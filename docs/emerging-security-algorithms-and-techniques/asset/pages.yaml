    # 16.5 CAPTCHA


    Due to increased intervention of automation in industries, it is implicit that
    attacks related to robots have a new threat troubling users is robot-calls which
    are spam and sometimes fraudulent. As a result, some humans have experience related
    to life and business. CAPTCHA is a test which we come through when entering a
    site as a security we input the correct string so that site can recognize as humans
    and not robots. CAPTCHA stands for “Completely Automated Public Turing test to
    tell Computers and Humans Apart”. It was designed to stop the interference of
    vague URLs and bots into sites; in other words, CAPTCHA can be referenced as an
    application which provides security.


    # 16.5.1 Origin of CAPTCHA


    The origin of CAPTCHA started in 1997 when producers of AltaVista, a search engine,
    were looking for solutions to block automated URLs. Andrie Broder found an algorithm
    which uses an image that only humans can understand to pass the code. When humans
    recognize the correct letters and input it, they get a reply from the website
    form of text; if it was some robot, then it was not able to guess the CAPTCHA.
    Later in 2001,'
  merge: -1
  img_proc: true
- pgno: 294
  md: '282


    Emerging Security Algorithms and Techniques


    Andrie got its technology patented. After 2 years, Luis Von Ahn, Manuel Blum,
    Nicholas Happer of CMU, and John Langford came up with the flawless algorithm
    and termed it CAPTCHA.


    # 16.5.2 Working of CAPTCHA


    CAPTCHA is nothing but a Turing test, which was developed by Alan Turing (1950);
    it tested machine''s ability to show intelligent behavior like of human beings.
    Turing''s philosophy was to test that a machine can think like humans or not.
    This gave birth to a new judgmental algorithm which tested humans and computer
    apart. It is a simple task which involves a JPEG or GIF image displayed before
    directing us to a particular web page asking a human to identify it; this image
    is not to be read by robots they can only read the source code, not the image.
    For making it easier to recognize the letters, the option to request a new CAPTCHA
    is always there. It is the test which humans come across every time they log in
    to an Internet website. It is a kind of challenge response when we had to guess
    the blurred and twisted combination of alphabets and numbers. Nowadays, new CAPTCHA
    is to distinguish between humans and bots (robots). It is an acronym for "Completely
    Automated Public Turing Test to tell Computers and Humans Apart". The admin of
    this is a computer. Though provided security, it made every working slow, but
    it was required so that anyone cannot interfere with the website system (Soni
    & Bonne, 2017).


    CAPTCHAs are saved on servers in the form of images and audio files and in HTML
    format. The web pages generate CAPTCHA dynamically in a submit form type; it can
    be of any programming language like PHP; JAVA, Ruby, JSP; etc. Now the integration
    of CAPTCHA takes use of a secret key, i.e., common to web servers and CAPTCHA
    server. Also, a string is generated within the link, which eventually generates
    a password, which is computed by CAPTCHA to display the image and website server
