    # 16.6.3 Attacks


    +   1. Passive attacks: The attackers make use of data that they observe, as for
    simple systems that they have plain text. The attackers intervene in the system
    making the mail available to the attacker. They use such techniques to send mail
    until unintended—an example of such attack is “Man-in-the-Middle Attack.

    2. Active attack: This attack causes interruption. Attackers debar the sender
    from accessing the site, and a modification of the content can be done. Most changes
    were observed during transmission of the mail. Without authentication, data can
    be fabricated including the creation of false accounts.

    3. DOS attacks: This attack can be easily launched on the network; it is so powerful
    it can shut down the whole network system. By such an attack, the computer gets
    infected without the user being aware. This attack mainly checks availability
    to send a request on the network so as to attack bandwidth and TCP connection,
    CPU cycle being the main part of the system gets affected by this attack (Kamthe
    & Nalawade, 2015).


