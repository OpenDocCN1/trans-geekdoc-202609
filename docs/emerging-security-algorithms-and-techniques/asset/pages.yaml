    # 9.3 Code-Based Cryptography


    Code-based cryptography usually refers to cryptographic algorithms using an error-correcting
    code C (McEliece, 1978). Furthermore, it adds an intended error to a word and
    calculates a syndrome relative to its parity-check matrix of code. The process
    of code-based cryptography is a commutation between efficiency and security. There
    are several codes for which efficient decoders are known.


    # 9.3.1 McEliece Cryptosystem


    McEliece cryptosystem is the most successful cryptosystem, based on extended Golay
    code [24, 12, 8]. Originally, Golay codes were invented in the early 1950s and
    have featured incredible responses in the last few years. McEliece (1978) proposed
    an asymmetric encryption cryptosystem based on Goppa codes, which remains unbroken,
    even after 15 years of adaptation of its proposed security parameters (Sendrier,
    1998). McEliece cryptosystem is based on linear error-correcting code for creating
    public and private keys. The secret key can be drawn from the various alternate
    codes. Several versions of McEliece cryptosystem were proposed using various secret
    codes such as Reed-Solomon codes, concatenated codes, and Goppa codes. The original
    McEliece cryptosystem algorithm is given below. McEliece public-key cryptosystem
    is illustrated in Figure 9.1 (see also Table 9.2).


    ![](img/5ee0cf067ac8390dfbbfeae8da2f7512_154_0.png)


    FIGURE 9.1 McEliece public-key cryptosystem.'
