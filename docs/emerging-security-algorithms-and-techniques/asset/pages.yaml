    # 4.4 Function Field Sieve


    The function field sieve is used to compute the discrete logarithm in F_n within
    random time, as introduced by Leonard Adleman in 1994. It generalizes the algebraic
    number field into the function field sieve. It is the faster method for factoring
    integers than other algorithm such as Coppersmith''s algorithm in the finite field
    of small characteristics. It is very similar to number field sieve (NFS) in the
    prime field, where a ring of integer Z is replaced by a ring of polynomial K[t]
    in a finite field of size k=#K (Adleman & Huang, 1999). The running time of finding
    this logarithm is L[1/3, c] for a constant c>0, if p ≤ q^g(n) where g is a function
    that satisfies g(0)=0 and g(n)>0 replace k. The calculation starts by taking a
    finite field F and a non-reducible polynomial p in F[x]. The goal is to find out
    the non-reducible polynomial A in F[x, y] with m in F[x] and degree in y that
    satisfies h(x, y) ≡ 0 mod p. Continuously working in F[x] and the function field
    l = Quotient(F[x, y])/(h) needs double smooth pair r < s > F[x], y where r and
    s are relatively prime. The intersection of ry+s with H, rm+s and r^s*H(x, -s/r)
    is smooth in F[x] (Schirokauer, 2008; Jean & Lercier, 2002).


    # 4.5 Index Calculus Algorithm


    The index calculus algorithm is a more efficient and powerful technique for computing
    the discrete logarithms in a group with no notion of smoothness. It applies to
    any chosen group and not to all groups, and gives a sub-exponential time algorithm.
    The base of this algorithm is Z_p*. This algorithm needs a factor base S that
    is selected as a relatively small subset S ∈ Z_p* that the significant fraction
    of elements of Z_p* can capably written as the product of elements of S (Padmavhavathi
    & Bharti, 2012).


    # Algorithm


    It requires a generator α of Z_p* and an element β as inputs and gives the discrete
    logarithm x=logαβ.


    +   1. Select a factor base S where S = {P1, P2, P3, ..., Pl} ∈ Z_p*.

    2. Assemble the linear relationship among elements of S.'
