    \ (mod 2)$\n\nOne nontrivial solution of this system of congruence is $(0,1,0,1,0)$.\
    \ Thus, we get the congruence $20^2 \times 24^2 = 3^2 \times 5^2 \times 11^2$\
    \ (mod 301). Here, $U=\\{20,24\\}$ is a subsequence of $M$.\n\n# 5.3.2 Quadratic\
    \ S Method\n\nPomerance (1982) developed a new factoring algorithm called QS method.\
    \ This method is similar to the square root method, but in this, a sieving procedure\
    \ is used to find the values $r^2 \\pmod n$. The algorithm is defined as follows:\n\
    \n+   1. Choose a composite number $n$.\n2. Choose a bound $B=\\{p_1, p_2, \\\
    dots, p_{\\pi(B)}\\}$.\n3. Consider a factor base $B$.\n4. Choose an integers\
    \ $r$ such that $f(r)=r^2-n$ is smooth over $B$.\n5. Choose a subset $U=\\{r_1,\
    \ r_2, \\dots, r_m\\}$ such that:\n\n+   i. $f(r_i) = p_1^{e_{i1}} p_2^{e_{i2}}\
    \ \\dots p_{\\pi(B)}^{e_{i\\pi(B)}} (\\pmod n), \\forall i$\nii. $\\sum_{j=1}^m\
    \ e_{ij} = 2k_i, 1 \\le j \\le \\pi(B)$, for some $k_i \\in \\mathbb{Z}$\nwhere\
    \ $e_{ij}$ is the exponent of $p_j$ occurring in the factorization of $f(r_i)$."
