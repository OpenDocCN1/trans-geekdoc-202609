  md: '# 24 Emerging Security Algorithms and Techniques


    # Proof


    The proof is based on approximations using continued fractions. Since $ed = 1$
    mod $\varphi(N)$, there exists a $k$ where $ed-k\varphi(N) = 1$. Therefore,


    ```

    $$\frac{e}{\varphi(N)} = \frac{k}{d} = \frac{1}{1}$

    ```


    Since $\varphi(N) = N-p-q+1$ and $p-q < 3\sqrt{N}$ an attacker can use $N$ to
    approximate $\varphi(N)$. In order to avoid this attack, since $N$ is $1,024$
    bits, $d$ must be at least $256$ bits. This is unfortunate for smart cards or
    low-powered devices. Now we have $|p+q-1| < 3\sqrt{N}$


    ```

    $N+1-\varphi(N)-1| < 3\sqrt{N}$

    ```


    Also on replacing $\varphi(N)$ by $N$ we have


    ```

    $$\frac{k}{d} = \frac{ed-kN}{Nd} = \frac{ed-k\varphi(N)-kN+k\varphi(N)}{Nd} =
    \frac{1-k(N-\varphi(N))}{Nd} \le \frac{3k\sqrt{N}}{Nd} = \frac{3\sqrt{N}}{\sqrt{N}\sqrt{d}}
    = \frac{3k}{d\sqrt{N}}$

    ```


    Here we have $k\varphi(N) = ed-1 < ed$; therefore, $k\varphi(N) < ed$. Since $e
    < \varphi(N)$, so $k\varphi(N) < ed < \varphi(N)$ which gives


    ```

    $$\varphi(N) < \varphi(N)d$\n k < d$

    ```


    we have $k < d$ also $d < \frac{1}{2}N^{1/4}$

    Hence, we get


    ```

    $$\frac{e}{N} \le \frac{k}{d} = \frac{1}{dN^{1/4}}$ (2.1)

    ```


    Since $d < \frac{1}{3}N^{1/4}$, $2d < 3d$, then $2d < N^{1/4}$.\nHence, $2d <
    N^{1/4}$,nFrom (2.1) and (2.2), we get


    ```

    $$\frac{1}{2d} > \frac{1}{N^{1/4}}$ (2.2)

    ```'
