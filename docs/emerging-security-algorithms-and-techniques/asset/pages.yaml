  md: '# Key Management


    are sometimes referred to asiphers. In the cryptographic technique, ciphers use
    keys to operate on the cryptographic algorithms. Keys are nothing but numbers
    which are kept, and ciphers use them to encrypt and decrypt the messages using
    encryption and decryption keys, respectively.


    There are two categories of cryptographic algorithms: (i) symmetric key cryptographic
    algorithms and (ii) asymmetric cryptographic algorithms. In symmetric key algorithms,
    the same key is used by both the communicating entities and in asymmetric key
    cryptography; there are two types of keys: private and public key. The sender
    entity uses the public key of receiver entity to encrypt the plaintext, and the
    receiving entity uses its own private key to decrypt the ciphertext. The keys
    must be kept secret in the cryptographic algorithms to make the communication
    immune to attacks from the intruders, and hence, here comes the concept of key
    management which tries to manage and distribute the keys to the participating
    entities securely.


    # 12.1.2 Importance of Key Management


    For efficient and secure transmissions of messages between the entities in the
    cryptosystem, there is always a need for encryption and decryption keys. Here,
    keys play a significant role in the cryptosystem, and so managing keys is a paramount
    area of research. Key management system, policies and rules help the cryptosystem
    to ensure security (i.e., confidentiality, authenticity of the participating entities
    and integrity) to the communicating entities. Key management allows an efficient
    and systematic key generation, distribution, and storage of keys, so that the
    participating entities can be able to communicate with the secure environment
    and remain immune to attacks. In the absence of an efficient key management system,
    the communicating entities are more prone to come into the contact of intruders
    whose results in an insecure cryptosystem.


    # 12.1.3 Challenges in Managing Cryptographic Key System


    Key management has various challenges that need to be addressed for an efficient
    implementation of cryptographic algorithms. The following are the major challenges
    associated with the key management system:


    +   1. Scalability: There are billions of entities who want to communicate with
    each other, and they require the cryptographic algorithms that will help them
    to communicate over an insecure network. For a large number of entities, a large
    number of keys are required, and managing such a large number of private and public
    keys in the cryptosynthesis is a tedious task. Thus, scalability is one of the
    issues of key management that needs to be addressed by the researchers.


    +   2. Availability: Key management system should ensure data accessibilities
    for the authorized participating entities.


    +   3. Security: Security is one of the biggest challenges of key management.
    Designing an efficient key management system, participating entities in the cryptosystem
    are more prone to the intruders and the keys are vulnerable from the intruders.


    +   4. Heterogeneity: Development of key management techniques should be such
    that it can support multiple databases, different platforms, diverse range of
    applications, and standards.'
