  md: "# Integer Factorization Problem\n\n63\n\nNote that for a large $i$, it is computationally\
    \ expensive to compute $\\gcd(x_i - x_j, n)$ for every $j < i$ as one has to check\
    \ $(i-1)$ gcds for each $i$. This algorithm can be improved by computing only\
    \ the following gcds:\n\n$\\gcd(x_j - x_i, n)$ for $i = 1, 2, \\dots$\n\nThis\
    \ is because if $x_i \\equiv x_j \\pmod p$, then $x_{i+1} \\equiv x_{j+1} \\pmod\
    \ p$, and we can extend $x_{i+k} \\equiv x_{j+k} \\pmod p$ for all $k \\ge 0$.\
    \ Therefore there exists $i$ such that $x_i \\equiv x_0 \\pmod p$. In this case,\
    \ for each $i$, one has to check one gcd, e.d., $\\gcd(x_i, n)$ instead of checking\
    \ $(i-1)$ gcds. The algorithm is as follows:\n\n+   1. Choose a composite number\
    \ $n$.\n2. Choose a polynomial $f(x)$ modulo $n$.\n3. Choose an integer $x_0$\
    \ modulo $n$.\n4. Compute $x_i$, form $x_i = f(x_{i-1}) \\pmod n$ for $i = 1,\
    \ 2, \\dots\n5. Find $i$ for which $\\gcd(x_2 - x_i, n) \neq 1$.\n\nThen, the\
    \ nontrivial $\\gcd(x_2 - x_i, n)$ will give the factors of $n$.\n\nThis algorithm\
    \ can also be improved by computing $\\gcd(Q_k, n)$ where for every $k$ steps,\
    \ $Q_k = \\prod_{i=1}^k (x_i - x_0) \\pmod n$. Note that if $\\gcd(x_i - x_i,\
    \ n) > 1$, then $\\gcd(Q_k, n) > 1$.\n\nNow if we construct a graph on $\\mathbb{Z}_n$,\
    \ for all $i \\ge 1$, then we have a diagram as in Figure 5.1. That is the figure\
    \ looks like the letter $\rho$ and the algorithm is named as $\rho$ algorithm.\
    \ The expected running time of this algorithm is proportional to the square root\
    \ of the size of the smallest prime factor $p$ of $n$. Hence, the running time\
    \ of this method is $O\\left(n^{\\frac{1}{4}} \\cdot (\\log n)^2\right)$.\n\n\
    Brent (1980) optimized this method. The most remarkable success of Pollard's $\r\
    ho$ method is finding the factors of the Fermat numbers, $2^{2^k} + 1$ (Brent\
    \ & Pollard, 1981). For practice, $f$ is considered as a simple quadratic polynomial.\n\
    \n![](img/5ee0cf067ac8390dfbbfeae8da2f7512_75_0.png)\n\nFIGURE 5.1\nPollard's\
    \ $\rho$ algorithm."
