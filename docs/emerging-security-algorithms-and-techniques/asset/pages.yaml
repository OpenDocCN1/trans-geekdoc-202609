  md: '# 14.8 Whirlpool


    # 14.8.1 Design Objective of Whirlpool


    For all digital signatures and message authentication processes, the most significant
    part is the hash function. A hash function accepts a variable-size message M as
    input and produces a fixed-size hash code H(m), sometimes called a message digest,
    as output.

    Although the use of block cipher was said to induce many security vulnerabilities,
    AES which is a block cipher is very secure. On the same lines for compression
    in whirlpool, block cipher is used.

    Whirlpool has the following features:


    +   1. The hash code length is 512 bits, equaling the longest hash code available
    with SHA.

    2. The overall structure of the hash function is one that has been shown to be
    resistant to the usual attacks on block-cipher-based hash codes.

    3. The underlying block cipher is based on AES and is designed to provide implementation
    in both software and hardware that is both compact and exhibits good performance.


