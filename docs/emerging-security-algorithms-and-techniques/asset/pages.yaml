- pgno: 249
  md: '# 14.6 Hash Message Authentication Code (HMAC)


    # 14.6.1 MAC Based on Hash Functions


    HMAC means applying a message authentication code algorithm using only cryptographic
    hash functions. Using Message authentication code with hash functions is more
    efficient than using Message authentication code with block ciphers which have
    hash functions like MD5 and SHA-1 are much faster than block cipher cryptographic
    functions like DES. While designing hash functions like SHA, its usage as MAC
    was not kept in mind and hence it cannot be used for the same purpose directly
    as its usage does not include a secret key. Various proposals were presented so
    as hoe to incorporate secret key into hash functions. HMAC is compulsory to implement
    MAC for IP security and for many other Internet protocols.


    # 14.6.2 Design Objectives of HMAC


    The design objectives listed for HMAC are as follows:


    +   1. Use those hash functions particularly whose code is available for free
    and they have efficient performance in software.

    2. The embedded hash function should be easy to replace if a faster or more secure
    hash function is discovered.

    3. The actual efficiency of the hash function should not be degraded.

    4. Keys should be handled in a simple way.

    5. Proper cryptanalysis of the strength of authentication procedure should be
    carried out on the required assignments related to the hash function.


    The first two are very crucial because software development purposes. The hash
    function is treated as a black-box by the HMAC. It has two advantages. Firstly,
    the hash function as a module can be used to implement HMAC. Due to this, most
    of the HMAC code is already compiled and ready to use with minimum customization.
    If there is a need to replace the existing hash function in HMAC, the only thing
    required to be done is the replacement of one hash function''s module with another
    one. Also, if the security of one hash function is compromised or the efficiency
    is reduced, the hash function can easily be replaced with the more secure or more
    efficient one.


    # 14.6.3 HMAC Algorithm


    The overall operation of HMAC can be explained as follows (Figure 14.5):


    ```

    H = Embedded hash function.

    I = Initial input value to the hash function

    M = Input message to HMAC

    Yi = ith block of M, 0 ≤ i ≤ (N - 1)

    N = Number of blocks in M

    b = Number of bits in a block

    n = Length of hash code produced by the hash function

    ```'
