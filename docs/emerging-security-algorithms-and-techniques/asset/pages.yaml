  md: "# Integer Factorization Problem\n\nIf $\theta \\in \\mathbb{C}$ is a root of\
    \ the polynomial function $f$ and $k$ is the degree of $f$, then the space $Z[\\\
    theta] = \\{x:x = a_{-1}\\theta^{k-1} + a_{-2}\\theta^{k-2} + \\dots + a_0 |{a_i\\\
    } \\subset \\mathbb{Z}\\}$ forms a ring with respect to the polynomial multiplication.\
    \ The basic idea of the NFS method is based on the following theorem of $Z[\t\
    heta]$ (Case, 2003).\n\n# Theorem (Case, 2003)\n\nLet $f(x)$ be a polynomial function\
    \ with integer coefficients. If $\\theta \\in \\mathbb{C}$ is a root of $f(x)$,\
    \ and $m \\in \\mathbb{Z}_n$ is an integer such that $f(m) \\equiv 0 \\pmod n$,\
    \ then there exists a unique mapping $\\phi: Z[\\theta] \\to \\mathbb{Z}$, satisfying:\n\
    \n+   i. $\\phi(ab) = \\phi(a)\\phi(b)a,b \\in \\mathbb{Z}[\\theta]$\nii. $\\\
    phi(a+b) = \\phi(a)+\\phi(b)b,a,b \\in \\mathbb{Z}[\\theta]$\niii. $\\phi(\\theta)\
    \ = 1 \\pmod n$\niv. $\\phi(\\theta) = m \\pmod n$\n\nNote that the above conditions\
    \ also imply that $\\phi(za) = z\\phi(a)\\forall a \\in \\mathbb{Z}[\\theta],z\
    \ \\in \\mathbb{Z}$. Using the above theorem, we can construct a difference of\
    \ squares. Consider a finite set $U$ of pairs $(a,b)$ such that\n\n> $$\\Pi_{(a,b)\
    \ \\in U}(a+b\\theta) = \\beta^2$ and $\\Pi_{(a,b) \\in U}(a+bm) = z^2$\n\nfor\
    \ $\\beta \\in \\mathbb{Z}[\\theta]$ and $z \\in \\mathbb{Z}$. Then using the\
    \ homomorphism as defined in the theorem, we can define $x = \\phi(\\beta)$ and\
    \ $z = y$ for any integer $x,y$. The pair $(x,y)$ constructs a difference of squares\n\
    \n> $x^2 = \\Pi_{(a,b) \\in U}(a+b\\theta)$$\\n$= \\Pi_{(a,b) \\in U}(\\phi(a+b\\\
    theta))$$\\n$= \\Pi_{(a,b) \\in U}(a+bm)$$\\n$= y^2 \\pmod n$\n\nThe algorithm\
    \ (Bimpakis & Jaiswal, 2005) is defined as follows:\n\n+   1. Choose an integer\
    \ $m \\in \\mathbb{Z}$ and find a polynomial $f$ such that $f(m) \\equiv 0 \\\
    pmod n$.\n2. Consider a base factor $\\mathcal{A} \\in \\mathbb{Z}[\\theta]$ and\
    \ $\theta \\in \\mathbb{Z}$.\n3. Choose two integers $a,b$ such that $(a+b\\theta)$\
    \ and $\\phi(a+b\\theta) = a+bm$ are smooth over $\\mathcal{A}$ and $\\mathcal{B}$,\
    \ respectively.\n4. Consider a subset $U$ of pairs $(a,b)$, found in Step (3)\
    \ such that for $\\beta \\in \\mathbb{Z}[\\theta]$ and $z \\in \\mathbb{Z}$\n\n\
    > $$\\Pi_{(a,b) \\in U}(a+b\\theta) = \\beta^2$ and $\\Pi_{(a,b) \\in U}(a+bm)\
    \ = z^2$\n\nThen, we have $x = \\phi(\\beta)$ and $z = y$ such that $x^2 \\equiv\
    \ y^2 \\pmod n$, which gives the nontrivial factors of $n$."
