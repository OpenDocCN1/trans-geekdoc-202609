  md: '# Attribute-Based Encryption 189


    (Herranz, Laguillaume, & Ràols, 2010). KP-ABE access tool and re-encryption technique
    get together and used during the efficient revocation.


    In the KP-ABE scheme, the problem that the data owner fails to decide who is the
    user and who will decrypt the encrypted message. So, for some applications, the
    data owner has to trust blindly by the key generator.


    # 11.3.2 Features of KP-ABE Scheme


    +   i. This scheme is designed for one-to-many communications.

