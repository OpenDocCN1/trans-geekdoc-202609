    \ for $i=1$, which is a prime factor of 63,787.\n\n# 5.2.5 Elliptic Curve Method\n\
    \nThe major drawback of Pollard's $p-1$ method is that the factors of $n$ cannot\
    \ find efficiently if it doesn't have a prime factor $p$ where $p-1$ is $B$-smooth.\
    \ Lenstra (1987) proposed a new factorization method which avoids the drawback.\
    \ He used the group of random elliptic curve over the field $\\mathbb{Z}_p$.\n\
    Note that for field $K$ of characteristic 0 or greater than 3, the elliptic curve\
    \ $E$ is a non-singular curve of the form $y^2=x^3+ax+b$ with $a,b,x,y \\in K$,\
    \ i.e., $E: y^2=x^3+ax+b$ such that $4a^3+27b^2\neq 0$. Also, the set of points\
    \ (K-rational points) on $E$ is defined as $E(K)=\\{(x,y) | x,y \\in K\\} \\cup\
    \ \\{\\mathcal{O}\\}$ where $\\mathcal{O}_E$ denotes a point at infinity and the\
    \ number of points on $E(K)$ is defined as $\\#E(K)$. In Pollard's $p-1$ algorithm,\
    \ we manage to find $m$ such that $(p-1) \\mid m$ and then for a nonzero $a \\\
    in \\mathbb{Z}_p$, $\\gcd(a^m-1,n)$ gives a nontrivial factor of $n$. If $(p-1)\
    \ \\nmid m$, then we have to increase $m$ such that $(p-1) \\mid m$. They are\
    \ replaced by $F_p$-rational points of some elliptic curve $E$ over $F_p$. Also,\
    \ we have found that $\\#E'(F_p)$ divides $m$, then for $P \\in E(F_p)$, $mP=\\\
    mathcal{O}_E$ will give a factor of $n$. If $\\#E(F_p)$ does not divide $m$, instead\
    \ of increasing $m$ we can define another elliptic curve $E'$\n\n##E'(F_p)$ divides\
    \ $m$. We can find $m$ by computing $m = \\prod_{p \\le B} p^{\\lfloor \\frac{\\\
    log n}{\\log p} \\rfloor}$, where $B$ is a given bound. If $\\#E(F_p)$ is $B$-smooth,\
    \ then $\\#E(F_p)$ divides $m$, then for any\n\n$P \\in E(F_p)$. The method is\
    \ given as follows:\nWe know that the sum $P+Q$ for $P=(x_1,y_1)$ and $Q=(x_2,y_2)$\
    \ of $E(F_p)$ is $(x_3,y_3)$, where $x_3=x_1^2-x_1-x_2$ and $y_3=(x_1-x_3)y_1-y_2\
    \ \\bmod p$ if $s=(x_2-x_1)^{-1} \\bmod p$. If $P=Q$, then $s=(3x_1^2+a)^{-1/2}\
    \ \\bmod p$. The computation of $mP$ involves repeatedly computing $P+Q$. At some\
    \ point of time, if $P+Q=\\mathcal{O}$, then $P=-Q$, i.e. $x_2=x_1 \\bmod p$ and\
    \ $\\gcd(x_2-x_1,n)$ gives a nontrivial factor of $n$. If $\\gcd(x_2-x_1,n) \\\
    neq 1$, then $(x_2-x_1)^{-1} \\bmod n$ does not exist and the computation $P+Q$\
    \ fails and we have a nontrivial factor of $n$. The algorithm is defined as follows:\n\
    \n+   1. Choose a composite number $n$ and a bound $B$.\n\n+   2. Compute $m =\
    \ \\prod_{p \\le B} p^{\\lfloor \\frac{\\log n}{\\log p} \\rfloor}$"
