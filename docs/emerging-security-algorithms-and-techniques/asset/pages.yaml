  md: "# Emerging Security Algorithms and Techniques\n\nand $p_i$ are primes $\\le\
    \ B$, i.e., $e_i = \\frac{\\log n}{\\log p_i}$ (also, we can write $m = \\prod_{p\
    \ \\le B} p^{\\frac{\\log n}{\\log p}}$). Clearly, $m$ is multiple of $(p-1)$\
    \ and where $\\gcd(a^m-1, n) > 1$, which gives a nontrivial factor of $n$. Note\
    \ that if $(p-1)$ is not smooth, then $a^m \not\\equiv 1 \\pmod p$ for at least\
    \ one $a \\in \\mathbb{Z}_n$. Therefore, this algorithm can be used to find p\
    \ factor of $n$, when $(p-1)$ have a small prime factor. The algorithm is as follows:\n\
    \n+   1. Choose a composite number $n$ and a bound $B$.\n2. Compute $m = \\prod_{p\
    \ \\le B} p^{\\frac{\\log n}{\\log p}}$\n3. Choose a random positive integer $a$\
    \ relatively prime to $n$.\n4. Compute $d=\\gcd(a^m-1, n)$.\n   i. If $d=1$, then\
    \ increase $B$.\n   ii. If $d=n$, then change $a$.\n   iii. $d$ will be a nontrivial\
    \ factor of $n$ if $d \neq 1$ or $n$.\n\nAs an example, if we apply the Pollard's\
    \ $p-1$ algorithm for $n=63,787$ with $B=20$ and $a=2$, then $m=7!$, $\\gcd(a^m-1,\
    \ n)=281$. The prime factors of $n$ are 227 and 281.\nThe running time of the\
    \ algorithm is $O(B(\\log n)^2 + (\\log n)^3)$ (Stinson, 2013). Since the exponent\
    \ $m$ depends on the bound $B$, the time required to find $n$ depends on $B$.\
    \ The probability of finding of $n$ will increase with increasing the bound $B$.\
    \ But it will also increase the time required to find $n$. There are various improvements\
    \ to make the algorithm faster, as can be found in Montgomery (1987).\n\n# 5.2.4\
    \ Pollard's $p$ Method\n\nPollard (1975) proposed a factoring algorithm (called\
    \ Pollard's $p$ method), which is more efficient than the trial division method.\
    \ This method is based on two ideas: the first is Birthday Paradox. According\
    \ to this paradox, in a group of at least 23 randomly people, the probability\
    \ of sharing the same birthday at least two people is more than 1 (Lenstra, 2000,\
    \ Stinson, 2013). More generally, if we choose some numbers randomly from a set\
    \ containing $p$ elements, then after the selection of $1.17\\sqrt{p}$ numbers,\
    \ the probability of choosing the same number becomes more than half. The second\
    \ idea is if $p$ is an unknown divisor of a composite number $n$ and $x_1, x_2\
    \ \\in \\mathbb{Z}$ such that $x_1 \neq x_2$ and $x_1 = x_2 \\pmod p$, then $p\
    \ \\le \\gcd(x_2-x_1, n)$ and so can we obtain a nontrivial factor of $n$ by computing\
    \ a gcd.\n\nWe consider the following iteration in Pollard's $p$ method:\n\n$x_i\
    \ = f(x_{i-1}) \\pmod n$ for $i=1, 2, \\dots$\n\nwith a random integer $x_0$ from\
    \ $(0, n-1)$ and a polynomial function $f(x)$ with integer coefficients. These\
    \ iteration generate a sequence of integer $\\{x_i\\}$ modulo $n$ for $i=1,2,\\\
    dots$ Now for each $j<i$, we compute $p=\\gcd(x_i-x_j, n)$ until $p>1$. This nontrivial\
    \ $p$ is a factor of $n$."
