    # 14.11 Spectral Hash


    # 14.11.1 Introduction to Spectral Hash


    Every other field in today''s world, such as finance, media, forensics, education,
    medicine, etc., using digital images extensively. Image acquisition and image
    storage also become less complicated and less expensive nowadays and hence, used
    extensively.This leads to the retrieval problem of images which led to the use
    of hash-based methods in image retrieval. These methods are more efficient than
    others because they work on the binary code of the images rather than using the
    image itself. But the problem with the digital images is not only their retrieval
    but also the trust factor. It can easily be tampered with any editing device.
    Image forging can be of many types such as image retouching, splicing, and copy-move
    forgery.


    Spectral hashing (SH) techniques are used to generate binary codes for the features
    extracted (Granty et al., 2016).


    It involves copy-move forgery and image retrieval. Sparsification of the graph
    Laplacian and tampering detection is performed using SH PCT (Polar Cosine Transformation)
    and is used for image retrieval process.'
  merge: -1
  img_proc: true
- pgno: 258
  md: "# 14.11.2 Origination and Design Objective of Spectral Hash\n\nThe origination\
    \ of Spectral Hash started with the booming of digital images being used by many\
    \ organizations. As the retrieval of the images from the databases was a tedious\
    \ task,\"trust factor” was also a problem. Digital tampering Hash-basedalgorithm\
    \ doesn't store the image in the database but stores the binary code, which makes\
    \ them easy to retrieve. There are several issues in image forgery such as image\
    \ retouching, copy-move forgery, and image splicing. In the copy-move forgery,\
    \ the parts of an image are copied and pasted on the same image with any wrong\
    \ intention. There are several image detection methods, including the active methods\
    \ and passive methods.\n\nActive methods are anything like watermarks or something,\
    \ whereas passive methods do not require any pre-embedded information and identify\
    \ the changes in the image by tampering only.\n\nThis approach involves the copy-move\
    \ forgery detection. The image retrieval process is performed using sparsification\
    \ of graph Laplacian, the tampering detection, and SH. The tampering detection\
    \ uses a spectral-basashing PCT. The image is subdivided into covering patches,\
    \ from which PCT features are extracted. SH is used to identify the comparable\
    \ patches.\n\nThe image retrieval process can only be examined and analyzed the\
    \ large data sets containing a large number of training images and test images\
    \ of almost 80 categories different kind and size of images. A large number of\
    \ images (around 5,000 out of 6,000) are used for training sets, whereas around\
    \ 1,000 images are used for data set.\n\nInitialization → Feature Extraction &\
    \ Graph Construction → Generation of Graph Laplacian Matrix $\rightarrow$ Sparification\
    \ of graph lap Laplacian $\rightarrow$ Spectral Hashing & Hamming Distance Calculation\
    \ $\rightarrow$ Retrieval of similar images\n\n# 14.11.3 Algorithm for Spectral\
    \ Hash\n\nIt mainly retrieves similar images by using the features of the images.\
    \ It extracts the features from the images and analyses the binary equivalent\
    \ of those features. For the training set of images, a feature vector is constructed\
    \ for each image and evaluated using a distance metric learning scheme. After\
    \ that, using these matrices, a graph is formed. The pairwise similarities between\
    \ the images and a graph are evaluated by the graph Laplacian and graph Laplacian\
    \ matrix is created. SH is used to obtain binary codes for the images. This process\
    \ is done for all images. Hamming distance between the binary code in training\
    \ dataset and the query image is calculated and based on those values, images\
    \ are retrieved which are most similar to the query.\n\nThe process includes the\
    \ feature vector extraction by the process of graph generation in which the images\
    \ are represented as the nodes along the graph perimeter. Then the nodes are connected\
    \ to each other on the basis of least Euclidian distance. Then pairwise similarity\
    \ is found and the average Hamming distance between similar images is calculated\
    \ using the following equation (Zhang et al., 2010):\n\n```\n$\\sum w_j |y_i -\
    \ y_j|^2$\n```\n\nTo reduce the Hamming distance between similar images, the SH\
    \ codes should satisfy the following conditions (Zhang et al., 2010):\n\n```\n\
    $\\min \\sum w_j |y_i - y_j|^2$\n```"
  merge: -1
  img_proc: true
