  md: '# Emerging Security Algorithms and Techniques


    ![](img/5ee0cf067ac8390dfbbfeae8da2f7512_198_0.png)


    FIGURE 11.1

    Data sharing system architecture.


    scalability. Currently, a trusted central server is used to save all profile information
    of the user in the social networking websites, but in ABE-based systems, the profile
    information is used to save on an untrusted server which decreases the storage
    requirements and trafficking by the system (refer to Figure 11.1).

    The data owner (sender) does the encryption before uploading the data to the server
    for keeping the data confidential. Then, the data user(receivers) access the data
    by using the data decryption key(s). Cryptographic security can be achieved by
    many methods of network security from which ABE is one of the best to use (Gagné,
    Narayan, & Safavi-Naini, 2010).

    Entities in Data Sharing System Architecture are as follows:


    +   A. Data Owner (Sender):


    A person who owns data and uploads the data in Storage Centre (like cloud storage),
    which makes sharing the data easy for them and also reduces the cost, is known
    as data owner. Encryption is done by the data owner before uploading the data.
    It helps in defining access policy and enforcement on its own data. The key for
    encrypting the file into a format ciphertext is generated by the key generator.


    +   B. Data Storage Centre:


    It provides service for storing data and is responsible for controlling the accesses
    of the outside users to the stored data and the content according to their demand.
    The Data Storing Centre with Key Generator Centre (KGC) provides personalized
    user key to user per each attribute and repudiates the attribute group keys, and
    this invokes a fine-grained user access control. So, Data Storing Centre provides
    data storage, data eradication, and delivery services.'
