    keystream as a nonlinear function $f$ of the state of the LFSR. In contrast to
    combination generators, where multiple LFSRs are tied together in parallel fashion,
    the Nonlinear filter works on the principle of computing output by a nonlinear
    function of some taps of a single LFSR (see Figure 6.2 (Braeken & Lano, 2005,
    August). The nonlinear function $f$ is known as the filter function.


    The quandary with sequences generated by nonlinear feedback shift registers is
    that there may be bias (more 1s than 0s), smaller period than expected and the
    different period for initial values.


    # 6.3.4 Clock Controlled Generators


    The clock-controlled generators are an alternate way of generating keystream with
    good statistical properties. These kinds of generators are built using two registers,
    and the movement of data of one register is controlled by the output of another
    LFSR. The register responsible for controlling the clock is called as a control
    register, and denoted as CR and the register that generates keystream according
    to the output sequence of CR is called as GR (Figure 6.3).


    # 6.4 Data Encryption Standard


    DES was introduced by IBM in 1970 and was based on a cryptographic cipher “Lucifer”
    developed by Horst Feistel. DES is a block cipher that takes a fixed-size string
    of plaintext as input and performs some operations on the input to generate the
    ciphertext of the same length (Thakur & Kumar, 2011). DES block size is 64 bits
    which undergoes 16-round structure to generate the ciphertext. DES operates at
    the key of size 56 bits out of which 8 bits are taken as parity bits leaving the
    actual length as 48 bits.


