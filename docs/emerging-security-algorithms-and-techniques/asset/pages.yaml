  md: "perfect square. Such a subsequence can be guaranteed by the notion of smooth\
    \ numbers.\nThe following lemma gives the guarantee of a subsequence with the\
    \ above condition.\n\n# Lemma\n\nIf $m_1, m_2, \\dots, m_l$ are positive $B$-smooth\
    \ integers, and if $k > \\pi(B)$, then some non-empty subsequence $(m_{ij})$ has\
    \ a perfect square. Here, $\\pi(B)$ denotes the number of primes in the interval\
    \ $[1, B]$ (Pomerance, 2008; Seifert, 2011).\n\nNote that a factor base $B$ is\
    \ a non-empty set of positive integers and an integer $x$ is smooth over a factor\
    \ base $B$, if all primes of $x$ are numbers of $B$. Consider a factor base $B=\\\
    {p_1, p_2, \\dots, p_{\\pi(B)}\\}$ and a set $M=\\{m_1, m_2, \\dots, m_k\\}$ of\
    \ integers, which is smooth over the factor base $B$, i.e., $m_i = p_1^{v_{i1}}\
    \ \\dots p_{\\pi(B)}^{v_{i\\pi(B)}}$, for $i=1, \\dots, k$. A subsequence $M'=\\\
    {m_{i_1}, \\dots, m_{i_s}\\}$ has the product perfect square $\\sum_{i=1}^s v_{ij}\
    \ \\equiv 0 \\pmod 2$, $\\forall j, 1 \\le j \\le \\pi(B)$, i.e., the problem\
    \ of finding a subsequence $M'$ is simplified to finding a set of vectors such\
    \ that their sum is the zero vector modulo 2. Here $(v_{i1}, v_{i2}, \\dots, v_{ik})$\
    \ is the exponent vector of $m_i$, $\\forall i$. Note that we can easily find\
    \ a subsequence with the above condition by using the linear algebra techniques\
    \ such as Gaussian elimination method. Thus, we describe the factorization of\
    \ $n:\n\n+   1. Choose a count $n$.\n2. Choose a bound $B$.\n3. Consider a factor\
    \ base $B=\\{p_1, p_2, \\dots, p_{\\pi(B)}\\}$, i.e., find all the primes in $[1,\
    \ B]$.\n4. Consider a set $U=\\{u_1, u_2, \\dots, u_k\\}$ of integers such that\n\
    \   i. $f(r_i) = r_i^2 \\pmod n$, $r_i$ is smooth over the factor base $B$,\n\
    \      i.e., $f(r_i) = p_1^{e_{i1}} \\dots p_{\\pi(B)}^{e_{i\\pi(B)}} \\pmod n$,\
    \ $\\forall i$\n   ii. $\\sum_{i=1}^k c_{ij} \\equiv 2k_j$, $\\forall j, 1 \\\
    le j \\le \\pi(B)$\n   where $c_{ij}$ is the exponent of $p_j$ occurring in the\
    \ factorization of $f(r_i)$ and $k_i \\in \\mathbb{Z}$\n5. Compute the integers\
    \ $a$ and $b$, where that $a = \\prod_{j=1}^{\\pi(B)} p_j^{a_j}$ and $b = \\prod_{j=1}^{\\\
    pi(B)} p_j^{b_j}$\n\nThen, we have:\n\n```\n$a^2 = \\prod_{i=1}^k r_i^2 = (p_1^{e_{i1}}\
    \ p_2^{e_{i2}} \\dots p_{\\pi(B)}^{e_{i\\pi(B)}})^2 \\equiv b^2 \\pmod n$\n```\n\
    \nWe find two integers $a$ and $b$ such that $a^2 \\equiv b^2 \\pmod n$ with $a\
    \ \\neq \\pm b$ (mod n). Hence, the nontrivial factors of $n$ can be determined.\n\
    \nFor example, consider $n=301$ and $B=13$. Here, $B=\\{2,3,5,7,11,13\\}$. Now\
    \ we perform the following computation:\n\n```\n$19^2 = 361 (mod 301) = 2^2 \\\
    times 3 \\times 5$\\n$20^2 = 99 (mod 301) = 3^2 \\times 11$\\n$21^2 \\equiv 140\
    \ (mod 301) = 2^2 \\times 5 \\times 7$\n```"
