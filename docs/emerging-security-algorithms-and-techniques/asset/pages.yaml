    # 12.1 Introduction


    Cryptographic system or cryptosystem is a suite of cryptographic algorithms, keys,
    and key management protocols for securing the message traveling over the unsecured
    networks between the entities. The cryptographic algorithms ensure the security,
    privacy, and authenticity of the communicated message between the entities. It
    involves ciphers, keys, plaintext, and ciphertext for the encryption of the message.
    There are two types of cryptography algorithms in the cryptosystem: symmetric
    (secret key) and asymmetric (public key) cryptography algorithms. Symmetric key
    cryptography uses the same key commonly known as the secret key for the encryption
    and decryption of'
