    # 1.8.3 Bézout''s Theorem


    Bézout''s theorem is defined as the description of algebraic geometry that states
    the number of common points, or intersection points, of two plane algebraic curves
    that do not share a common component (i.e., which do not have infinitely many
    common points) (Heiffer & Clark, 2003).

    **Bézout''s identity:** Bézout''s identity (or Bezout''s lemma) is the following
    theorem in elementary number theory: For nonzero integers $a$ and $b$, let $d$
    be the GCD $d = \gcd(a, b)$, then there exist integers $x$ and $y$ such that


    ```

    $ax + by = d$

    ```


    For $a = 120$ and $b = 168$, the gcd is 24. Then, $120x + 168y = 24$ for some
    $x$ and $y$. Let''s find the $x$ and $y$.

    Start with the next line of the Euclidean algorithm, $120 = 2(48) + 24$ and write


    ```

    $24 = 120 - 2(48)$

    ```


    In the line above this one, $168 = 1(120) + 48$. Thus, we have


    ```

    $48 = 168 - 1(120)$

    ```


    Substitute $168 - 1(120)$ for $48$ in $24 = 120 - 2(48)$, and simplify:


    ```

    $24 = 120 - 2(48)$\n$= 120 - 2[168 - 1(120)]\n$= 120 + 2(120) - 2(168)$\n$= 3(120)
    - 2(168)$

    ```


    Compare this to $120x + 168y = 24$ and we see $x = 3$ and $y = -2$.\nChecking
    these values, we obtain:


    ```

    $120x + 168y = 120(3) + 168(-2)$\n$= 360 - 336$\n$= 24$

    ```


