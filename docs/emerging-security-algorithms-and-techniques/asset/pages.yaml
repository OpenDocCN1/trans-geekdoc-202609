    # 2. Extraction


    For the calculation of private key, we obtain $D_{ID} = (D_1, D_2)$, where identity
    ID is


    $ID = (ID_1, ID_2, ..., ID_t)$


    +   a. Randomly generated $r \in \mathbb{Z}_p^*$ by root PKG.

    b. Calculate $q_{ID} = H_1(ID_1)$ $[1 \leq i \leq k]$

    c. Then calculate-


    $D_1 = rP$

    D_2 = \alpha P_2 + r \sum_{i=1}^k q_{ID} \cdot Q_k$


    # 3. Encryption


    For the encryption of message $M$, where $ID = (ID_1, ID_2, .., ID_k)$ for any
    $k \leq l$.


    +   a. Random $s \in \mathbb{Z}_p^*$

    b. Ciphertext $c = (c_0, C_1, C_2)$ where-


    $c_0 = M \oplus H_2(v^s)$

    D_1 = sP$ and

    C_2 = sr \sum_{i=1}^k q_{ID} \cdot Q_k$


    # 4. Decryption


    For the decryption of ciphertext, calculate


    $c_0 \oplus H_2(\hat{e}(C_1, D_2)) + (\hat{e}(D_1, C_2))$


    $c_0 \oplus H_2(\hat{e}(sP, \alpha P_2 + r \sum_{i=1}^k q_{ID} \cdot Q_i + P_3))
    + (\hat{e}(rP, s \sum_{i=1}^k q_{ID} \cdot Q_i + P_3)))$


    $c_0 \oplus H_2(\hat{e}(sP, \alpha P_2))$


    $c_0 \oplus H_2(\hat{e}(P, P_2)^{s})$


    $c_0 \oplus H_2(\hat{e}(\alpha P, P_2))$


    $c_0 \oplus H_2(v^s)$


    $M \oplus H_2(v^s) \oplus H_2(v^s) = M$.'
