    # # 14.5 Message Authentication Code


    # ## 14.5.1 Requirement for MAC


    The Message Authentication code is a piece of authentication information used
    to verify the sending authority of the information and the integrity of the message.
    It also protects the data''s integrity and authentic characteristics by allowing
    and verifying any changes to the content of the message. Message Authentication
    code: An essential requirement for sending sensitive and critical data from one
    system to another; it is considered to be the best practice for sending data over
    a network.


    # ## 14.5.2 Introduction to MAC Based on Block Ciphers


    MAC, if constructed from block ciphers, uses AES or similar algorithms to make
    the encryption more strong and reliable. Now using AES in CBC (cipher block chaining
    mode) will make the message more secure. CBC (Cipher Block chain mode): It is
    a kind of operation for ciphers based on block, where the sequence of bits is
    encrypted as a single unit. Cipher block uses an initial vector of a sequence
    of certain length; its key characteristic is that it uses a chaining mechanism
    that causes the decryption of a block of ciphertext which depend on all the previous
    ciphertext blocks.'
