    lightweight primitives are not intended for wide range of applications, and may
    impose limits on the power of the attacker. For example, the amount of data available
    to the attacker under a single key may be incomplete. However, it should be distinguished
    that this does not mean that the lightweight algorithms are feeble—rather, the
    idea is to use progress in designs with a better equilibrium between security,
    performance, and resource requirements for resource-constrained environments.


    # 7.8.2.1 Lightweight Block Ciphers


    **Lesser block sizes:** Order to save memory in lightweight cryptography, lighter
    block sizes from 64 to 80 bits in place of 18 bits are used. This helps in reduction
    of limits in the plain text blocks to be encrypted and saves memory.


    **Lesser key spans:** Uses lesser key spans such as less than 96 bits for better
    performance.

    Simpler rounds: Procedures in lightweight cryptography are comparatively simpler
    than used in conventional cryptographic techniques. Lightweight cryptography uses
    lighter Sand boxes of size 4 bits as compared to 8-bit Sand used in conventional
    cryptographic products. This reduces the use of resources.


    **Simpler key generation:** Relatively simpler key generation module results in
    less usage of memory, power consumptions, latency, and other resources, etc. Thus,
    in lightweight graphic structures, simple sub-keys are generated, but they are
    susceptible to various attacks.

    **Minimal implementations:** There are several modes of process and protocols
    that require only the encryption of a block cipher. Some claim may require a device
    to only support one of the encryption or decryption operations. Implementing only
    the essential functions of a cipher may necessitate fewer possessions than implementing
    the full cipher.


    # 7.8.2.2 Lightweight Hash Functions


    Conventional hash functions may not be appropriate for constrained environments,
    due to their large internal state sizes and high power consumption supplies. This
    has led to the development of lightweight hash functions, such as PHOTON, Quark,
    SPONGENT, and Lesanta-LW. The expected usage of conventional and lightweight hash
    functions is different in various aspects.


    **Smaller internal state and output sizes.** Large output sizes are significant
    for applications that require collision resistance of hash functions. For applications
    that do not need collision resistance, smaller internal states and output sizes
    might be used. When a collision-resistant hash is required, it may be suitable
    that this hash function has the same security against preimage, second-preimage,
    and collision attacks. This may decrease the size of the internal.


    **Smaller message size.** Conventional hash functions are probable to support
    inputs with very large sizes (around 264 bits). Most of the target protocols for
    lightweight hash functions, typical input sizes are much lesser (e.g., at most
    256 bit). Hash functions that are optimized for short messages may consequently
    be more suitable for lightweight applications.'
