  md: 'Here, the pair $(f, f_q^{-1})$ acts as a private key, and the public key is
    calculated as


    ```

    h = f_q^{-1} * g(mod.q) = 38x^6 + 3x^4 + 32x^2 + 16x + 9

    ```


    We have chosen the random polynomial $r$ beside the message $m$ as follows:


    ```

    m(x) = x^4 + x^3 - x^2 + 1

    ```


    ```

    r(x) = x^5 - x^4 + x^3 + 1

    ```


    The message $m$ is encrypted using public key as


    ```

    c(x) = pr * h + m(mod.q) = 19x^6 + 13x^3 + 22x^4 + 10x^3 + 33x^2 + 12x + 16

    ```


    Now, on receiving the ciphertext $(c)$, the message is decrypted using the private
    key and centering modulo to $q$ as


    ```

    a = f * c(mod.q) = 5x^6 + 39x^4 + 6x^3 + 30x^2 + 10x + 35

    ```


    After centering the coefficients, it becomes


    ```

    b = 5x^6 - 2x^4 + 6x^3 - 11x - 10

    ```


    Finally, compute $z = f_p^{-1} * b(mod.p)$ and centering the coefficients using
    mod $p$


    ```

    z = f_p^{-1} * b(mod.p) = x^4 + x^3 + 2x^2 + 1

    ```


    The next step is to loosen the coefficients of $z$ to mod $p$, and it becomes


    ```

    z = x^4 + x^3 - x^2 + 1

    ```


    which is equal to the original message $m$.

    TRU cryptosystem is secure and efficient on comparing with the best-known public-key
    cryptosystems such as RSA and ECC. There exists several attacks against NTRU scheme:
    brute force, multiple transmission attacks, and alternate private keys are used
    to decrypt the message $m$ and lattice-based attacks. (Mersin (2007) compared
    the NTRU cryptosystem with RSA and ECC systems. It has been shown that the performance
    of NTRU cryptosystem is better than other algorithms. Thus, the key generation,
    encryption, and decryption processes of NTRU take less time. But, on comparing
    with the McEliece public-key cryptosystem, it has been investigated that the encryption
    and decryption processes of NTRU take more time.


