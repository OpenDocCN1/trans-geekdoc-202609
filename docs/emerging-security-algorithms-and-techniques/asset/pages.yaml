    # 6.7 International Data Encryption Algorithm


    IDEA (Lai & Massey, 1990) was introduced by Lai and Massey in 1991. The primitive
    was actually a modification of Proposed Encryption Standard that was proposed
    in 1990 to counter the limitations of DES.


    # 6.7.1 How It Works?


    IDEA operates on blocks of size 64 bit, and each block is partitioned into 16
    bit sub-blocks. The encryption operation comprises a total of nine rounds on plaintext
    blocks, and during one round, all of these sub-blocks are operated upon some arithmetic
    and logical operations. The output of each round is fed as input to the next round,
    and the same sequence of operations is performed up to round eight. Round nine,
    also called the OUTPUT transformation phase, is the final round, and only arithmetic
    operations are performed in this round. The output of nine round is the resulting
    ciphertext of the corresponding plaintext.


    The 128-bit key of IDEA is divided into eight 16-bit sub-keys and six of these
    sub-keys are used in round one and the remaining two are used in round two. For
    subsequent rounds, a left cyclic shift of 25 bits on the 128-bit key results in
    another 128-bit block, which is then partitioned to form the keys. This process
    is repeated for all eight plus one rounds. In the entire encryption process, a
    total of 52 keys are used, six sub-keys per'
