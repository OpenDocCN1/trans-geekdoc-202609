    \ 75\n\n# 5.1 Introduction\n\nInteger factorization of a positive integer $n$\
    \ (say, $a, b$), i.e., $n=a \\cdot b$, is the decomposition of $n$ into a product\
    \ of two small integers $a, b$, then $a$ and $b$ are called factors of $n$. If\
    \ $a, b \neq 1, n$, then they are the nontrivial factors of $n$ and $n$ is called\
    \ a composite number; otherwise, $n$ is a prime number. If $a, b$ are primes (or\
    \ prime power), then the factorization is called prime factorization of $n$. Note\
    \ that the factorization of $n$ is unique, the fundamental theorem of arithmetic\
    \ states that for any positive integer $n > 1$ it can be expressed as the product\
    \ of prime numbers (not necessarily distinct). Therefore, it is trivial to find\
    \ $n$ from the given primes, but it is difficult to factor a large $n$. It is\
    \ believed that there is no efficient algorithm to find the factors. Note that\
    \ the problem of finding integer factors of a composite number is called integer\
    \ factorization problem. The concept"
