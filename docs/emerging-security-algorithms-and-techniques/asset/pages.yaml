    key $K_{IPU}$ and the private key $K_{IPR}$. In order to communicate securely
    using public cryptography, both the sender $S$ and the receiver $R$ generate pairs
    of distinct keys $[K_{IPU}, K_{IPR}]$. The public keys are stored in some public
    files or are exchanged, while private keys are kept as secret with its user. Now,
    in order for $S$ to send a message M'
