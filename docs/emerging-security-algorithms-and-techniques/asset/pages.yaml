  md: '(EdDSA) (Josefson and Liusvaara, 2017) is a variant of Schnorr digital signature
    scheme. It is based on twisted Edwards curves designed to be faster than existing
    digital signature schemes without sacrificing security. An extension of the Merkle
    scheme was introduced in RFC (Helseling et al., RFC 8390, 2018) as Extended Merkle
    signature scheme (XMSS). XMSS is considered to be secure and remains unf when
    the underlying hash function collisions. It is compact and simple to implement
    and compared to the base scheme, and naturally resists side-channel attacks. Aggregate
    signature (Bellar et al., 2007) is a scheme that supports "aggregation of users"
    which is the basis of the currently popular blockchains and bitcoins. Multiple
    signatures on multiple users can be clubbed into a single signature having constant
    size as per the number of users. This single signature will be enough to convince
    the verifier that the $n$ number of users have signed the $n$ number of original
    messages. An Aggregate Signature scheme by Mihir Bellare and Gregory Neven may
    also be used with Bitcoin. The Boneh-Lynch-Shacham (BLS) (Boneh et al., 2004)
    scheme facilitates user-level verification of a signer whether the signer is not
    pretending to be authentic. To achieve user-level verification, the scheme uses
    a bilinear pairing for verification. The BLS signatures fail under (per various
    elements) an elliptic-curve category.


    # ## 15.8 Conclusion


    This chapter covers the most widely used schemes for digital signature with a
    special emphasis on the base algorithms. Many variants of these schemes are coming
    up, and their variabilities are under scrutiny among the researchers. The performance
    of these schemes may vary depending on the theory behind them. The base methodologies
    and the added variations on them are on a constant review, and many communities
    have tailored their to the digitally signed world as per their requirements and
    adaptability. In the current quantum computing scenario, the traditional approaches
    have to be replaced or have to be improved using modern schemes or add-ons. The
    chapter has tried to cover these schemes and methodologies as well.


