    Primality test for Mersenne Number: This test was given by Lucas (Palimar & Shankar,
    2012) and after that modified by Lehner (Robinson, 1954). In this test, $M_n$
    is prime when it divides $S_{n-2}$ where $S$ is in the following form:


    ```

    $S_0 = 4$

    $S_1 = (S_0)^2 - 2$

    $S_2 = (S_1)^2 - 2$

    $:

    $S_{n-2} = (S_{n-3})^2 - 2$

    ```


    Example: $M_7 = 127$, needed $S_{7-2} = S_5$

    Hence,


    ```

    $S_0 = 4$

    $S_1 = 4^2 - 2 = 16 - 2 = 14$

    $S_2 = 14^2 - 2 = 196 - 2 = 194$

    $S_3 = 194^2 - 2 = 37,636 - 2 = 37,634$

    $S_4 = 37,634^2 - 2 = 1,416,317,956 - 2 = 1,416,317,954$

    $S_5 = 1,416,317,954^2 - 2 = 2,005,956,546,822,746,116 - 2 = 2,005,956,546,822,746,114$

    ```


    Now, $2,005,956,546,822,746,114$ is perfectly divisible by $127$ with quotient
    $15,794,933,439,549,182$; therefore, $M_7 = 127$ must be prime.


    # 3.13 Chinese Remainder Theorem


    This theorem is used to find out an integer when it is divided by given divisors,
    and leaves the given remainders. It is a perfect solution for the linearly simultaneous
    congruence with co-prime divisors (Childs, 2009; Piazza, 2012; Lady, n.d.):


    ```

    $N = a_1 (mod m_1)$

    $N = a_2 (mod m_2)$

    $N = a_3 (mod m_3)$

    :

    $N = a_k (mod m_k)$

    ```'
