  md: "# Asymmetric Cryptography\n\nAsymmetric cryptosystems can be applied to various\
    \ problems of security. The three broad categories of applications are confidentiality,\
    \ key exchange, and digital signatures. Key exchange schemes are used to exchange\
    \ symmetric keys between two users over an insecure channel. Digital signature\
    \ schemes are complementary in terms of usage of keys—the private key is used\
    \ to encrypt a message and the public key for decryption. When a message is encrypted\
    \ using a sender's private key, it generates a ciphertext that acts as a digital\
    \ signature of the sender. When someone successfully decrypts the message using\
    \ the sender's public key, it is immediately established that the message was\
    \ generated by the sender. Thus, possessing the ciphertext generated using the\
    \ sender's private key solves the problem of non-repudiation. The user can no\
    \ longer deny sending the message, since it is the only party possessing the secret\
    \ key, which was used for encrypting the received message.\n\nIn the following\
    \ sections, we first discuss some preliminaries that will be required to understand\
    \ the asymmetric algorithms in a formal manner. Then, we proceed to discuss some\
    \ of the most important public-key cryptographic systems, their properties, and\
    \ applications.\n\n# 8.2 Preliminaries\n\n# 8.2.1 Divisibility and the Euclidean\
    \ Algorithm\n\nAn integer $a$ is said to divide another integer $b$, if $a = q\\\
    cdot b$ for some integer $q$, and is expressed as $a|b$. If $p$ is an integer\
    \ and $q$ is a positive integer, then the *modulus* operation, denoted by $p \\\
    bmod\\ q$, is defined to be the remainder when $p$ is divided by $q$. A prime\
    \ number is a number that has no divisors other than 1 and itself; a number is\
    \ called composite if it has at least one nontrivial divisor. The **greatest common\
    \ divisor of** two integers $a$ and $b$, denoted here by $gcd(a, b)$, is the largest\
    \ integer $d$ that divides both $a$ and $b$.\n\nThe Euclidean algorithm is a fast\
    \ algorithm which can be used to find the $gcd(a, b)$ of two integers $a$ and\
    \ $b$. If two numbers $a$ and $b$ have $gcd(a, b) = 1$, then they are relatively\
    \ prime numbers. By using the Euclidean algorithm, it is possible to express the\
    \ $gcd(a, b)$ of two numbers $a$ and $b$ as a linear combination of $a$ and $b$\
    \ with integer coefficients. The process is called the extended Euclidean algorithm.\n\
    \n# Algorithm 1: The Euclidean Algorithm\n\n```\nAlgorithm: The Euclidean Algorithm\n\
    Input: Positive integers a, b;\n```nprocedure gcd(a, b) {\n  x := a;\n  y := b;\n\
    \  while(y != 0) {\n    r := x mod y;\n    x := y;\n    y := r;\n  }\n  return\
    \ x;\n}\n```\n```"
