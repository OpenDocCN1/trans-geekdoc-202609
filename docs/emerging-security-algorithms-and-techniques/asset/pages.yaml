- pgno: 197
  md: '# Attribute-Based Encryption


    # 11.2.3 Attribute-Based Encryption


    Sahai and Waters introduced the concept of ABE in the year 2005. The keys are
    generated by encryption and decryption of the data by the authority of the sender
    and receiver, respectively. These generated keys, the public key and the master
    key, are according to the set of attributes and should be pre-defined (Sahai &
    Waters, 2005). The user cannot add any data to the system if attributes are not
    pre-defined, and in such a case, the attribute will be re-defined by the authority
    and will again generate the public key and the master key.


    # 11.2.3.1 Principle of an Ideal Attribute-Based Encryption Scheme


    +   - Data Confidentiality:

    The Data owner encrypts the data before uploading to the storage and that is why
    the unauthorized parties do not get any of the information of the encrypted data.


    +   - Fine-grained access control:

    Every individual user has different access right even if they are in the same
    group.


    +   - Scalability:

    The efficiency of the system does not affect by the increase in the number of
    the authorized user.


    +   - User Revocation:

    The stored data cannot be accessed by the repudiated user as the ABE scheme revokes
    the access rights directly from the system.


    +   - Collusion resistant:

    Each attribute belongs to the polynomial or the random number; the user cannot
    collude with the different attribute with each other to decode the encrypted data.


    # 11.2.3.2 Features of ABE


    +   1. ABE has the capacity to address complex access control policies.

    2. There is no need to know the exact list of users as the knowledge of access
    policy is sufficient.

    3. ABE appears in terms of collision resistance.


    # 11.2.3.3 Architecture of Data Sharing


    In this growing world of technologies, the Internet has become a part of each
    and everyone''s life. Every user daily shares/her sensitive data to other users
    using services e-mails, social websites, etc., in which framework of the network
    is to grant access to the information of the shared storage. Accessing these services/applications,
    users acknowledge their personal information (like name, residence address, interests,
    gender, etc.) into the public domain which helps in automatically linking the
    people having the same attributes to each other. These systems possess weak security
    for the privacy of the data, and the undesirable parties can easily mine the data
    and misuse it. The ABE scheme gives user-controlled privacy according to the attributes,
    and it also provides'
