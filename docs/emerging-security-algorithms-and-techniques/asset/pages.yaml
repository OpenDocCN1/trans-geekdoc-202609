    # Common interface functionality through respect


    clear_prompts()—Returns the command used in this interface.

    detach()—subprocess forget to run but pretend that it’s no longer running.

    eval (code, strip = True, synchronize = False, locals = None, allow_use_file =
    True, split_lines = "nofile"*kwds)

    code – to evaluate

    strip – None; strip output prompts check, etc.

    locals – None (ignored); it is used for compatibility with Sage generic system
    interface.

    allow_use_file – bool (default value: TruenIf code exceeds an interface-specific
    threshold and True, then the code will be communicated via a temporary file rather
    than the characterbased interface.

    Otherwise code will be communicated via the character interface.

    split_lines – Tri-state (default value : “nofile”);

    If “nofile” then code is sent by line until it gets communicated through temporary
    file.'
