- pgno: 95
  md: 'Symmetric Algorithms I


    # 6.2.1.3 Cipher Feedback Mode


    The CFB mode of operation utilizes the block cipher to implement stream cipher
    for the generation of a sequence of pseudandom bits, and the ciphertext is produced
    by doing an XOR operation between output bits and plaintext. The first key block
    known as an initialization vector (IV) is for filling the input shift register
    with a seed value and subsequent previously generated ciphertext blocks are supplied
    back as an input to the block cipher. The mode of operation is similar to OFB
    except that ciphertext is used as feedback instead of block cipher output. The
    primary advantage of this mode is that in case of short plaintext blocks, a variant
    of this mode can be used in which the high-order s bits of block cipher are XORED
    with the plaintext to generate ciphertext. This ciphertext is then fed back to
    block cipher and current s MSB are shifted out and the process continues. On the
    flipside, any bit error that occurs during the course of communication is propagated.


    # 6.2.1.4 Output Feedback Mode


    The idea behind OFB mode of operation is to feed the output block cipher back
    to it and unlike CFB mode, the keystream does not depend on plaintext or ciphertext.
    The input is then XORed with the output ciphertext using an XOR operation to compute
    the corresponding ciphertext. Since no output keystream feedback is available
    for the first set of keystream blocks, an initialization vector (IV) is required
    as the initial n-bit input block. Initially, an IV is encrypted with a block cipher
    to generate the first set of keystream blocks, and the next block of keystream
    is computed by feeding previously generated keystream back to the block cipher.
    OFB mode operates in a similar fashion to that of a stream cipher, both encryption
    and decryption operations are the same as in the case of a stream cipher. Also
    like CBC mode, the use of IV makes OFB encryption nondeterministic Since no chaining
    dependencies are there in OFB mode, the decryption of subsequent blocks is not
    affected even if bit errors occur during transmission.


    # 6.2.1.5 The Counter Mode


    The counter mode of operation also uses block cipher as a means of achieving a
    stream cipher function. Similar to OFB and CFB, keystream is generated in terms
    of blocks, unlike both of these modes, no feedback is required in counter mode.
    In this mode, the underlying algorithm is with a counter value which counts from
    a starting value and takes a different value each new keystream block is generated.
    This keystream is then used to generate ciphertext by doing an XOR operation between
    input text and counter. The counter, in this case, may be any function with a
    large period, but the most popular is one that increments by one. CTR mode does
    not suffer the limitations like error propagation and chaining dependencies which
    were in the earlier discussed modes (Lipmaa, Rogaway, & Wagner, 2000). Another
    advantage of CTR mode is that it can significantly increase the speed by running
    two or more block ciphers in parallel.


    # 6.2.2 Pseudorandom Number Generation


    Random number generator is considered as one of the primary building blocks for
    cryptographic system essentially for the logic that they are quite unpredictable
    for potential attacks. Uniformly distributed random numbers are pivotal to cryptographic
    applications, and'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# 84 Emerging Security Algorithms and Techniques


    even though the values generated by random processes are very unpredictable, they
    lack uniform distribution (Random.org, 2018). Pseudorandom number generators (PRNGs)
    generate sequences commonly known as pseudorandom numbers starting with a random
    seed value and then recursively expand it into a large set of random-looking sequences.
    It is important to mention that PRNGs are completely deterministic in nature,
    implying that if the generator is put back into the same state, the output will
    be a replica of the earlier generated sequence (Van Tilburg, 2005). One of the
    primary requirements of these pseudorandom numbers is that they carry good statistical
    properties and a reasonable number of mathematical tests verify their statistical
    behavior. Owing to their good statistical properties, PRNGs are widely used in
    stream ciphers (Goldreich, 1998). A good PRNG must carry statistical properties
    that resemble the properties of a true random generator, and the size of the seed
    value must be long enough to resist exhaustive search attack.


    # ## 6.3 Stream Ciphers


    Stream ciphers usually act on individual elements of the message. A private key
    and a randomized seed value (IV) are passed as input to the stream cipher and
    a sequence of bits known as keystream is generated as output. This keystream is
    XORed with the plaintext to compute the ciphertext. The aim is to cryptographically
    secure primitive that is optimized for speed, easy to execute, no short cycles,
    and deduction of internal state from the output should be impractical. Stream
    ciphers on the basis of an internal state are commonly subdivided into synchronous
    and self-synchronous stream ciphers (Bokhari & Masoodi, 2010).


    # ### 6.3.1 Synchronous and Self-Synchronous Stream Ciphers


    Given how the keystream is generated, stream ciphers are generally categorized
    into two types. If the generated keystream is not dependent on plaintext and ciphertext,
    then the ciphertext is synchronous and if the keystream generation is dependent
    on plaintext and several bits of previously generated ciphertext then the ciphertext
    is referred to as self-synchronous stream ciphers. Majority of the functional
    stream ciphers are synchronous in nature as cipher feedback mode (CFB) is an example
    of self-synchronous stream cipher. Figure 6.4 depicts the encryption and decryption
    of synchronous stream cipher, and if the dotted line is present, then it represents
    self-synchronous stream cipher.


    In order to accurately decrypt in synchronous stream ciphers, both parties need
    to be synchronized in terms of key and state and lost synchronization may be regained
    using techniques like sufficient redundancy in plaintext, re-initialization, or
    using different stamps at fixed intervals within ciphertext, as in the case of
    self-synchronous stream ciphers, lost synchronization is regained automatically
    as in and only a limited number of plaintext symbols are lost.


    Also with synchronous stream ciphers, there is no error propagation seen the modified
    bit has no effect on other ciphertext bits. In the case of self-synchronous stream
    ciphers, there is limited error propagation as the modified bit affects a certain
    number of other ciphertext bits.'
