  md: '# 12 Emerging Security Algorithms and Techniques


    # 2.1 Introduction


    # 2.1.1 Background


    The word “algebra” is used to mean many different things. This word is used in
    the title of al-Khwarizmi’s book 1,200 years ago. But as a subject it is studied
    4,000 years ago by ancient Babylonia and Egypt. Modern algebra, also called Abstract
    algebra, is a branch of mathematics which deals with the algebraic structure of
    various sets as real numbers, complex numbers, sets of integers under modulo n
    (Zn), matrices, models, vector spaces, lattices, and algebras (Hazewinkel, Gubareni,
    & Kiriken, 2005). Kronecker (1888) claimed that the form of modern algebra began
    with his first paper of Vanderbilt. Cauchy states clearly that Vanderbilt had
    priority over Lagrange for this remarkable age which eventually led to the study
    of group theory (Connor & Robertson, 2001).


    Abstract algebra emerged around the start of the 20th century under the name algebra.
    Initially, the assumption in classical algebra on which mathematics depends took
    the form of the axiomatic system. The formal definition of algebraic structures
    began to emerge in the 19th century, as results on permutation group, algebra
    of structure, and classification of various mathematical objects. These processes
    were occurring throughout all of mathematics, but became especially pronounced
    in algebra. Formal definitions through primitive operations and axioms were proposed
    for many basic structures such as group, rings, and fields. Therefore, such things
    as group theory and ring took their place in pure mathematics.


    # 2.1.2 Binary Operation


    A mapping: ×A→A is called a binary composition on the set A, where AxA={a,b};a,b∈A}.


    In simple words, binary operation on a set A is a calculation that combines two
    elements of set A where the result is the element of the same set A. Image of
    an element (a,b)∈A×A is usually represented by b* (Kumar, 2009).


    # 2.1.3 Examples


    +   1. Addition and multiplication are binary operations on the set of Natural
    numbers, because a+b∈N and a-b∈N.

    However, the subtraction is not a binary operation in N, since 3∈N and 5∈N but
    3-5=-2 N

    2. Let a*b=a+b-1, where a,b∈Z

    * is a binary composition in the set of all odd integers, but * is not a binary
    composition in the set of all even integers, since 2*4=2+4-1=7 is not an even
    integer.

    3. Similarly, a*b=a+b-ab for all a,b∈Z is a binary composition in Z.


    # Remark


    Binary operation is also called binary composition.'
