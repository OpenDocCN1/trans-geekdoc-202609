    # 9.5.1 OV Signature Scheme


    Initially, the concept of multivariate quadratic systems named OV signature scheme
    is introduced by Patarin (1997). The reason behind the OV name is that they cannot
    be mixed in terms of quadratic variables.

    Let $k$ be a finite field, $o$ and vinegar $V$ are two integers such that $n =
    o + v$. We set $O = (\nu+1, \dots, n]$ where $x_1, \dots, x_o$ and $x_i$ are OV
    variables. Patarin (1997) suggested to select $o = v$. It is called a balanced
    OV scheme, if $v>0$, then it is named as unbalanced OV scheme. The key generation
    consists a mapping $F: k^v \to k^o$ such that $o$ quadratic polynomials is in
    form


    ```

    $f^k(x) = \sum_{i,j \in V} a_{ij}^k x_i x_j + \sum_{i \in V, j \in O} b_{ij}^k
    x_i x_j + \sum_{i \in O} c_i^k x_i + d^k \quad (9.13)$

    ```


    where $i, j$ is $1, \dots, o$ and $i=1, \dots, v$ are variables and $a_{ij}^k,
    b_{ij}^k, c_i^k$ and $d^k$ are randomly selected coefficients. It can be noted
    that mapping $F=(f_{v+1}(x), \dots, f_n(x))$ is simply invertible. We need to
    select vinegar variables randomly. Furthermore, we solve the linear equations
    with $o$ variables by using the Gaussian elimination method. If we do not get
    any solution, we need to select vinegar variables again.


