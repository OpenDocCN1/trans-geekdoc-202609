  md: "# Discrete Logarithm Problem 49\n\nAll elements in the discrete group $\\{1,\
    \ 2, 3, 4, 5, 6\\}$ are covered. After reaching the exponent $P-1=6$, it continues\
    \ to repeat the same results in the same order. This process is called the cyclic\
    \ group of generator $a$. After a finite number of exponentiations, the generated\
    \ elements repeat themselves until it becomes a loop. When it gets the remainder\
    \ value 1, the cycle starts from the origin in the same order. In this example\
    \ $P=7$, the cyclic group is represented in the form of: $Z_p$ or $Z^*$, where\
    \ $*$ has the meaning of zero and the total number of elements $e$ is $P-1=6$\
    \ (Meshram & Meshram, 2011).\n\n# Properties of $Z_p^*$:\n\n+   1. If $\\alpha,\
    \ \beta$ are the elements of $Z_p^*$, then their product also belongs to $Z_p^*$.\
    \ Suppose $\\alpha, \beta \\in Z_p^*$, (closed under)\n2. If $\\alpha, \beta,\
    \ \\lambda$ are the elements of $Z_p^*$, then $\\alpha(\beta\\lambda) = (\\alpha\b\
    eta)\\lambda$ (associative order)\n3. If $\\alpha$ is the elements of $Z_p^*$,\
    \ then $1-a=\\alpha$ ($Z_p^*$ has identity element)\n4. If $\\alpha$ is the elements\
    \ of $Z_p^*$, then there will be an element $\beta \\in Z_p^*$ such that $\\alpha\b\
    eta=1$ (every element in $Z_p^*$ has an inverse)\n\nTherefore, any collection\
    \ $G$ that satisfies any of the properties with product () is called the group.\n\
    Example: If $3 \\in Z_{13}$, then there is $\beta \\in Z_{13}$ (Property 4)\n\
    That $3\beta \\equiv 1 \\pmod{13} \\Rightarrow \beta = 9$. Hence $(Z_{13}^*,)$\
    \ is a special kind of group called cyclic group. This cyclic group is the backbone\
    \ of discrete logarithm in a cryptography system (Ilić, 2010).\n\n# 4.3 Baby-Step\
    \ Giant-Step Algorithm\n\nAs mentioned above, finding the remainder under modulus\
    \ is easy but doing its inverse to get logarithm is very difficult. To solve this\
    \ problem, the baby-step giant-step algorithm introduced by Shanks is one of the\
    \ most popular algorithms that deal with discrete logarithm in any finite abelian\
    \ group. This algorithm is widely used in many applications of computational theory\
    \ and invariants of the elliptic curve factorization techniques. It is a memory-trade-off\
    \ method with complexity $O(\\sqrt{n})$ group multiplication. This algorithm works\
    \ on any cyclic group $G$ with $n$ order to reduce the time at the cost of extra\
    \ storage (Kushawah & Mahalanobis, 2017).\nBasic strategy of the baby-step giant-step\
    \ algorithm. We know that $\\log_{\\alpha}\beta=x \\Leftrightarrow \\alpha^x=\b\
    eta$, where exponent $x$ can be represented in a two-digit numbers $X_g$ and $X_b$,:\n\
    \n```\n$x = X_g \\cdot m + X_b,$ (4.1)\n```\n\nwhere $m=\\lfloor\\sqrt{n}\rfloor$\
    \ and $0 \\le X_g, X_b < m$ (is the number of elements in the group and $\\lceil\r\
    ceil$ is the ceiling symbol to round off the fraction number). Now $\\alpha^x=\b\
    eta$ can be expressed through equation (4.1) as $\\alpha^{X_g \\cdot m+X_b}=\b\
    eta$\n\n```\n$\\Rightarrow \\alpha^{X_g \\cdot m} \\cdot \\alpha^{X_b} = \beta$\n\
    $\\Rightarrow \\alpha^{X_b} = \beta \\cdot (\\alpha^{-m})^{X_g}$ (Base of the\
    \ Baby-Step)\n```"
