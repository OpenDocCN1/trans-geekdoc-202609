    # 3.11 AKS Primality Test


    This test is also known as a Cyclotomic test or Agrawal-Kayal-Saxena primality
    and published by Manindra Agrawal, Neeraj Kayal, and Nitin Saxena at IIT Kanpur
    on 6 August 2002 in a paper title “PRIMES in P.\” This test is based on $(x+a)^n
    \equiv (x^n+a) \pmod{n}$ theorem and perfectly defines whether the given number
    is prime or within the polynomial time. A number $N$ is prime if all the coefficients
    of polynomial expansion $(x-1)^n \equiv (x^n-1)$ are divisible by $N$ (Klappenecker,
    2002; Cao, 2013; Rotella, 2005; Turchet et al., 2007; Wu et al., 2016; Dietzfinger,
    2004).


