    # 16.7.2 SMS Threats


    +   1. Message availability: As encryption is not by default, they can be read
    or hacked by malicious users during the flow in network. They are usually saved
    as plain text that can be easily viewed in the exchange servers by persons who
    have access to messaging systems. Programs that are used for sniping and spying
    can automatically record all messages. They, also can be saved on external/remote
    servers for further studies.

    2. Spamming: Mostly, advertisement messages are sent in bulk. These messages have
    data that can harm the user''s device system. The facility of bulk messages allows
    spans to communicate in the network, waiting to attack.

    3. Flooding: This is sending bulk messages on a particular hour; for example,
    we can ensure that 200 messages sent per second will disrupt or clog the mobiles.
    It can even make the device inaccessible; these attacks exploit the SMS protocol.

    4. SMS phone crashes: Sending messages results in total data loss or phone being
    corrupted. These attacks can hang and infect the cell not allowing the user to
    control. It can also result in the hacking of the phone so the phone becomes inactive.

    5. SMS viruses: As the technological changes are towards the advancing path, more
    threats are being detected and reported as robust as the previous versions of
    them. They have got the tendency to install themselves in just one click on the
    message leads to malfunction of mobile phones.

    6. SMS phishing: Users are being led by false messages, triggering users into
    downloading, and activating services which are malicious in nature. The text inside
    the message directs the screen to the unknown website; sometimes the process is
    so fast that the user is not able to recognize what happens to the system.


