    # ## 4.1 Introduction


    The term “logarithmic” is nothing but an exponent in the sense of real number.
    For example, $3^2=9$ (where 2 is called exponent). Now translating into the language
    of logarithm it becomes $Log_3 9=2$ (where Log 9 is the exponent equal to 2 and
    3 is the base of the logarithm). Basically, the exponent is $x$ is used to calculate
    the product $x=3^y=9$, while the logarithm is to compute the exponent $x=\log_3
    9=2$. This prompts to the definition of Log as $y=z$, or $x=y^z$, assuming $x$
    and $y$ as positive besides $x

    eq1$ in algebraic form. Indeed, $y$ is generally not an integer number. For example,
    the solution of logarithm $Log_3 7 \approx 2''$ gives the approximation result?
    $1.58496$ as an exponent because $2^{1.58496}=2.99999$ is exactly 3. The word
    “discrete” in logarithm refers to the aspect in discrete group $\{1, ..., P-1\}$
    only integer numbers than fractions (real) numbers (Pomerance, 2008). Now is coming
    to the point of DLP.


    In discrete logarithm, we apply the modulo operation on logarithm such as $x=Log_3
    9$ (mod 7). It can also be noted as $9^3=7 (mod 7)$ or $x=Dlog_2(9)$, where exponent
    is $x$, base=2, modulus=7, and remain=9. Suppose $x$ and $y$ are two integers
    greater than 0 and a prime number P. Then, the methodology to find out the solution
    of $z$ such that $x^z\equiv y (mod P)$ is the discrete logarithm problem or DLP.
