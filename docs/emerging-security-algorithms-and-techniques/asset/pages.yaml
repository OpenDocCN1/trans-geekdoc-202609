  md: '# Symmetric Algorithms I


    from corresponding input bits and the other two bits (first and last) are taken
    from the last of the previous chunk and the first bit of the next chunk, respectively.


    +   Key mixing: XOR operation is performed on the output from the expansion stage
    and the sub-key that is derived from the main key. There are a total of 16 sub-keys
    of length 48-bit each, and every round uses one sub-key.


    +   Substitution: The output from key mixing stage is passed to a substitution
    box and a total of 6 × 4 substitution boxes are used. S-Box is given a six-bit
    input, and a corresponding four-bit output is computed with the help of a lookup
    table. The S-Box is very critical to the DES, stage, as it plays a vital role
    in the nonlinearity of this primitive.


    +   Permutation: Permutation forms the last stage, and the idea here is to dissipate
    the output of each S-Box across four different S-Boxes in the next. A permutation
    box (P-Box) is used to rearrange the output generated by Substitution phase.


    # 6.5 Triple DES (3DES)


    One of the major weaknesses found in Data Encryption Standard (DES) is in its
    key size. With a key size of 56 bits, an adversary can analyze all possible combinations
    within a very short period of time. Multiple solutions have been proposed to overcome
    this problem of DES, and one such popular solution is triple DES (3-DES) (William,
    2006).


    # 6.5.1 How It Works?


    3-DES increases the key size by repeating the DES algorithm thrice with three
    different keys of DES keys, which leads to an aggregate key size of 168 bits.
    The triple data encryption algorithm employs three different 56-bit DES keys (k1,
    k2, and k3) in an EDE mode. The basic idea is to use $k_1$ to encrypt (E) the
    message followed by a decryption (D) using $k_2$. The three keys may either be
    completely independent of other or the first and third keys may be the same and
    the second key different. Based on the configuration used, we may have a key space
    of 168 or 112 bits, respectively.


    Let''s assume $(k_1, k_2, k_3)$ represent the three keys, also known as a key
    bundle. If $E_x(x)$ and $D_x(x)$ denote the encryption and decryption operations,
    respectively, $x$ is the input message and $C$ represents the ciphertext. Then,
    the encryption and decryption operations are defined as follows:


    ```

    Encryption: $C = E_{k1}(D_{k2}(E_{k3}(x)))$

    ```


    ```

    Decryption: $x = D_{k1}(E_{k2}(D_{k3}(C)))$

    ```


    The input message $x$ is encrypted with a function key $k_1$, and the output is
    decrypted using key $k_2$ and again encrypted using key $k_3$ and the decryption
    operation is exactly the reverse of encryption operation. 3DES with mutually independent
    keys are considered to be more secure in comparison to DES and provides a security
    of 168-bits against brute force.'
