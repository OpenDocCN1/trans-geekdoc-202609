  md: '# 11.5 Applications of Attribute-Based Encryption


    # 11.5.1 Maintaining Personal Health Record Security Using ABE Scheme


    Personal Health Record (PHR) applications allow patients to manage, initialize,
    and share their personal information on health. Nowadays, PHR has become a trending
    topic in the area of healthcare technology. It is mainly stored in the cloud storage
    which reduces its cost and makes its mechanism effective, to store and access.
    Over the data in PHR, there must be a fine-grained access control protocol. The
    main challenges faced by the users in cloud services of PHR are the privacy, security,
    and confidentiality on health. Losing physical control over the PHR data uploaded
    by the owner on cloud storage, the cloud server gets the access to the plaintext
    and challenges the security of PHR.


    PHR recently chose the ABE scheme as their encryption scheme which makes it more
    secure and effective, but it faces the challenge for the on-demand user revocation.
    For the security of PHR, CP-ABE and KP-ABE are used: multi-authority ABE is used
    for reducing the key-management problem and the ABE scheme, and break glass ABE
    scheme is used for the urgent/emergency access to PHR.


    # 11.5.2 Audit Log


    Applicationsations of forensic analysis are secured by the KP-ABE scheme. Electronic
    forensic analysis, "audit log", includes all details like all activity on the
    system; their security concerns are high. To capture the enemy, the thorough audit
    log is a prize target. Encrypting an audit log is not enough to secure the systems
    accessing the network system like Global Information Grid, because to access the
    audit log information only the secret is needed and getting such a single key
    means accessing all the data (Waters, 2011). So, to counter such security issues,
    audit log uses KP-ABE scheme which makes the entries as a set of attributes as
    data type, the name of the user, and time and date.


    # 11.5.3 Targeted Broadcast


    Targeted Broadcast is a new broadcast scenario which may have settings such as:


    +   i. a broadcaster broadcast different items in a sequence where each item is
    described by the set of attributes.


    +   ii. For example


    Targeted Broadcast allows the user to enjoy their shows, sports, news, etc., on
    their television according to their choices. The Targeted broadcast system is
    obtained from KP-ABE scheme, where each broadcast item is encrypted using the
    symmetric key and then KP-ABE scheme encrypt this symmetric key with the broadcast
    item’s attributes.'
