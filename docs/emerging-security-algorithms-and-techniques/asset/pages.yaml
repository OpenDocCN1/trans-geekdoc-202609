  md: '# 1.1 Introduction to Number Theory


    Number theory is a branch of pure mathematics which helps to analyze and study
    the integers. It is partly experimental and partly theoretical. The experimental
    part leads to questions and suggests the ways to answer the questions. The theoretical
    part tries to device an argument that gives a conclusive answer to the questions.
    It examines and accumulates numerical data, and finds the relationships between
    different types of numbers (Anglin, 1995). Number theory is also called “The Queen
    of Mathematics.”


    # 1.1.1 Integers


    The positive, negative, and whole numbers with zero together are known as an integer,
    i.e., ... -3,-2,-1, 0, 2, 3 ... etc. An integer can be represented by a number
    line by an arrow (Gay, 2007). A positive number is represented by an arrow pointing
    to the right. A negative number is represented by an arrow pointing to the left.
    The total value of these numbers is represented by the length of the arrow.


    ![](img/5ee0cf067ac8390dfbbfeae8da2f7512_14_0.png)


    Number line


    # 1.1.2 Integer Arithmetic


    The integer arithmetic is indispensable at most every area such as cryptology,
    computer graphics, mathematics, and several other engineering areas.


    # 1.1.3 Arithmetic Operations


    The most basic integer operations are as follows:


    +   1. Addition

    2. Subtraction

    3. Multiplication

    4. Division.


    Thus, the mathematical operations of the above integers can be performed as follows.


    +   1. **Addition**: It states that the addition of two integers is always an
    integer.


    +   a. 2 + 5 = 7


    ![](img/5ee0cf067ac8390dfbbfeae8da2f7512_14_1.png)


    Number line'
