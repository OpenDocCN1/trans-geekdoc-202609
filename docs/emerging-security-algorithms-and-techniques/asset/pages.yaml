  md: '# Post-Quantum Cryptography


    +   * **Verification**: In order to verify the signature above, the bit strings
    $a_{l-1}, ..., a_1, a_0$ are computed and check the equality such that


    ```

    $$(f^{2^{w-1}-a_{n-1}}(\sigma_{n-1}), ..., f^{2^w-a_0}}(\sigma_0)) = (y_{n-1},
    ..., y_0) \quad (9.25)$

    ```


    If the computed signature is logically correct, then the following equation holds:


    ```

    $$(f^{2^{w-1}-a_i}}(\sigma_i)) = f^{2^{w-1}}(x_i) = y_i \quad (9.26)$

    ```


    where $i = t-1, ..., 0$. It needs $t(2^w - 1)$ assessments of $f$ in the worst
    case.


    Till now, various generalizations of W-OTS have been occurred such as W-OTS (used
    in MAC) and W-OTS+ proposed by (Hülsing, 2013). The main purpose is to upgrade
    the W-OTS to increase the security and shorten the size of signatures.


    # 9.7 Conclusion


    Post-quantum cryptography offers secure alternatives, which consists many cryptographic
    systems that can be for today''s Internet communication. During the last decade,
    we have seen dynamic and secure developments in theory and its applications producing
    original ideas and algorithms. But there is a need of new hardware for their execution,
    which can be expensive of a large number of users. There is need of more effort
    to enhance the understanding and morale to use post-quantum cryptography widely.
    It is clear that in order to shift to the era of post-quantum cryptography, there
    are many challenging and important questions that need to be resolved yet. Particularly,
    there is a need to shorten the public-key size and to improve the efficiency and
    execution of quantum safe algorithms in the current systems. At present, there
    are lots of things happening in the field of post-quantum cryptography. Thus,
    as the new enhancements and algorithms are introduced, they need to be investigated
    as well.


