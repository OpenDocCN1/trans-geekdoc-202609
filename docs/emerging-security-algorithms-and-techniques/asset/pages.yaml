    # 17.3.2 Operators


    The characters $+$, *, /, \wedge$ are called operators, and it gives the information
    about SAGE what operations to perform on the objects in the given expression.


    # 17.3.3 Operator Precedence


    SAGE uses a set of rules called operator precedence to determine the order in
    which the operators are applied to the objects in the expression


    +   * Exponents use for evaluating from right to left.

    * %, multiplication, remainder, and division operations are evaluated left to
    right.

    * +, – addition and subtraction are evaluated from left to right.


    SAGE evaluates the operations in this expression according to the precedence rules:


    ```

    6 + 9^24/18 - 2^3

    6 + 9^24/18 - 8

    6 + 216/18 - 8

    6 + 12 - 8

    18 - 8

    10

    ```


    > ^ operator first so we get 8

    * operator is executed next we get 216

    / operator is executed and get 12

    + & then—result we get 10


    # 17.3.4 Variables


    When the expression returns an object, the object is assigned to the variable.
    Create variables in SAGE by the assignment. SAGE variables are also case sensitive.

    Example: A = 5 a variable A is created and assigned the number 7.

    If you want to see the contents of a variable, type its name into a blank cell
    and evaluate the cell:


    ```

    A\|

    7

    ```


    Variables that are created in a given cell in a worksheet are also available to
    the other cells in a worksheet. Variables can be saved before a worksheet is closed.
    This means that SAGE takes into account the case of each letter in a variable
    when it is deciding if two or more variable names are the same or not. For example


    # 17.3.5 Print Statement


    SAGE allows the results of expressions to be displayed regardless of where they
    are located in the cell by print statement.

    Strings string object consists of text which is enclosed within either double
    quotes or single quotes.'
