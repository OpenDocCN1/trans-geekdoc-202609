    # 13.1 Introduction


    Entity authentication is a mechanism that allows a connection between two parties
    authentically. The first party asks to establish the connection, whereas the second
    party accepts or denies the request after verifying the identity of the first
    party. The party asks for connection is called the claimant; the party which checks
    the identity of the claimant is called the verifier. “An entity can be a person,
    a process, a client or a server” (Forouzan & Mukhopadhyay 2011).


    A co-operative feature must be used to provide and provide the authenticity called
    as credential and it can be formed as follows:


    +   1. Something claimant knows: this credential is inexpensive, so it can be
    stored mentally like passwords and PINs (Personal Identification Numbers). This
    type of credentials is susceptible to loss due to humans’ short memory or can
    be guessed by others.

    2. Something claimant claims: this type of credentials is hard to be revealed
    to unauthorized parties, for example, smart cards, magnetic stripe cards, and
    the software operating private and public keys.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '3. Something inherited in claimant: this credential is a physical characteristic
    like fingerprints, face recognition systems, and other biometrics (Kizza 2005;
    Van Tilberg & Jajodia 2016).


    The purpose of entity authentication is to prevent unauthorized access to protect
    resources. Examples like outside party attempt to modify student''s marks or attempts
    to withdraw money from someone''s bank account.


    With the increment of security issues, a new number of entity authentication protocols
    come up with different techniques and criteria applied to different applications.
    To consider any protocol as an authentication protocol, it must follow the rules
    of security definition which have been specified by its designers. Security definition
    is based on some security goals. Those goals guarantee the security. If a protocol
    meets those security goals, then it can be called as an authentication protocol
    (Ahmed & Jensen 2010). Some authentication protocols, such as password authentication
    protocol (PAP), challenge-handshake authentication protocol (CHAP), and extensible
    authentication protocol (EAP), and other authentication techniques will be discussed
    in this chapter.


    # 13.2 Password Authentication Protocol


    PAP is a simple authentication technique used to validate the identity of devices
    when point-to-point protocol (PPP) establishes a direct connection between two
    devices. PAP is a two-way handshake protocol that proceeds in the following two
    steps (Figure 13.1; Forouzan & Fegan 2007):


    +   The first device user sends the authentication identity like username and
    password to the second device to get access permission.


    +   The second device validates the identity of the user and then decides either
    to accept or deny the connection.


    Due to the improvement of network infrastructure, the world replaced access modem
    links, dial-up-ISDN links, and T1 links by broadband and other new technologies.
    PAP became unsecured and replaced by new authentication protocols. On the other
    hand, PAP sends the password in plaintext; this could reduce the security goals.


    ![](img/5ee0cf067ac8390dfbbfeae8da2f7512_226_0.png)


    FIGURE 13.1

    PPP connection session with PAP.'
