    +   **Way 1:** Calculate $s$ from $g^s$, where $g^s$ can be solved from discrete
    logarithm in $G_1$. Then calculate $v$ with the result.


    +   **Way 2:** Calculate


    ```

    $v^s = \hat{e}(g,g)^{\alpha\beta s}$

    ```


    where the value of $\beta$ is defined as the discrete logarithm of


    ```

    $v = \hat{e}(g,g)^\beta \text{ in } G_T$.

    ```


    The message can be decrypted with the Bone–Boyen system if the attacker is able
    to calculate discrete logarithm in either $G_0$ or $G_T$. This is very close to
    solving BDHP, and for the elimination of the random oracle model, the Bone–Boyen
    system is most convenient for, and in the standard model, they can manage all
    the security properties.


    # 10.2.4 Hierarchical IBE


    Hierarchical identity-based encryption (HIBE) was described first by Harwitz and
    Lynn. The concept of HIBE is to create hierarchies of PKGs. In this hierarchy,
    at a particular level, the working of a PKG depends on its above level PKG working
    (see Figure 10.3; Boneh, Boyen, & Goh, 2005).


    *Note.* For each level of the hierarchy, users can use different identities. Therefore
    identity $ID$ with a maximum of $l$ levels is $ID = (ID_1, ID_2, ..., ID_l)$.


    It allows different security protocols that can be enhanced by the organization,
    easy to recover from a compromise as the recreation is only for that affected
    part and not for the whole system (Chatterjee & Sarkar, 2006a).


    # 10.2.4.1 Algorithms of HIB


    Unlike IBE scheme, HIBE has five algorithms (Chatterjee & Sarkar, 2006b):


    +   a. **Root setup:** For the working of the top level of the hierarchy, parameters
    are created.


    +   b. **Lower-level setup:** For the working of each of the other level and for
    the one-time execution of the lower level, additional parameters are created.


    **Extract, encryption, and decryption** have the same functionality as they have
    in single IBE scheme.'
