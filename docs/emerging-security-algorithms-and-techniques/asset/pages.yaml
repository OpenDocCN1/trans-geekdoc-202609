  md: '# 164 Emerging Security Algorithms and Techniques


    # Public Key for receiver Private Key for receiver


    ![](img/5ee0cf067ac8390dfbbfeae8da2f7512_176_0.png)


    FIGURE 10.2

    Public-key encryption.


    IBE allows any third party to generate a public key. PKG is a trusted third party
    which gives the corresponding private key.


    # 10.2.2.1 Algorithms of IBE


    The following are the four algorithms that make the IBE scheme (Al-Riyami & Paterson,
    2005) (Chatterjee & Sarkar, 2006):


    +   a. **Setup:** Sets the parameters and master key for all system.

    b. **Extraction:** The IBE private key initializes by using the PKG master key
    identical to the random chosen public key string $ID \in$ [0, 1]*$.

    c. **Encryption:** Using the IBE public key from system parameters the message
    is encrypted.

    d. **Decryption:** Using the IBE private key from PKG master secret key the message
    is decrypted.


    > *Correction: The correctness is very important in order to make the IBE scheme
    work*


    **Decrypt (Extract, Parameter, Encrypt) = message**


    # 10.2.3 Bone–Yoyen IBE


    The Bone–Yoyen IBE scheme is "commutative Blinding"; This name is arisen from
    the commuting of coefficients that we get, when we compute the ratio of the two
    pairings (Bone & Boyen, 2004a):


    ```

    $e(aP,bQ)\ne(bP,aQ)$

    ```


    Using the public parameters of the Bone–Yoyen IBE scheme, the value is calculated
    by the sender and this value is used to encrypt the plaintext. On the other hand,
    the receiver calculates the ciphertext and its private key by calculating such
    a ratio of pairings to get the same value as the cder have (Bone & Boyen, 2004b).'
