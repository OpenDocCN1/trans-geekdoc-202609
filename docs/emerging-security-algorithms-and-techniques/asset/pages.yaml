    # 7.8.1 Performance Metrics


    In the cryptographic design, there is a trade-off between performance and assets
    required for a given security level. Performance can be articulated in such as
    power and energy consumption, latency, and throughput. This output is replicated
    in the register, RAM and ROM usage. Resource requirements are sometimes referred
    to as costs, as adding more gates or memory tends to augment the production cost
    of a device. Power and energy consumption are pertinent metrics due to the nature
    of many constrained devices. Devices may particular power from their surroundings.


    Energy consumption (i.e., power consumption over a certain time period) is particularly
    significant in battery-operated devices that have a preset amount of stored energy.
    The batteries in some devices may not be easy or possible to recharge or restore
    once. It should also be noted that power consumption depends on many features
    other than the algorithm used, the threshold voltage, the clock frequency, and
    the technology used for execution.


    Latency is, in particular, relevant for certain real-time submission, for example,
    automotive applications where very fast times for components such as steering,
    airbags, or brakes are required. It can be defined as the time between the earliest
    request of an operation and turn out the Output. For example, the latency of an
    encryption operation is the time involving the initial request for the encryption
    of a plaintext and the reply that returns the equivalent ciphertext.


    Throughput is the rate at which new outputs (e.g., authentication tag or ciphertext)
    are produced. Unlike conventional algorithms, high throughput may not be a design
    aim in lightweight designs. However, reasonable throughput is compulsory in most
    applications.'
