    k^m \to k^m$ and $S_2: k^n \to k^m$. Private key contains $(F, S_1, S_2)$, where
    $F = (f^1, \dots, f^m)$ is a rainbow central map.

    * Signature a document: To sign a document $d$, we require to obtain a solution
    of the following equation:


    ```

    $S_1 \cdot F \cdot S_2(x_1, x_2, \dots, x_n) = F''(x_1, x_2, \dots, x_n) = T''$

    ```


    On applying the inverse of $S_1$, we have


    ```

    $F \cdot S_2(x_1, x_2, \dots, x_n) = S_2^{-1}T'' = T''''$

    ```


    We have computed recursively an equation to the inverse of $F$ such that


    ```

    $F(x_1, x_2, \dots, x_n) = T'''' = (y_1'', \dots, y_{n-v_1}'')$

    ```


    In the end, we apply the inverse of $S_2$ such that $z = S_2^{-1}(y)$, which gives
    us the signature $T''$ of document $d$, i.e., $T'' \in k^m$.


    +   * Verification: To demonstrate the authenticity of signature $d$, we have
    to check $F''(x_1, x_2, \dots, x_n) = T''''$.


    If there is a need to sign a large-size document, then we have to apply the hash
    function and compute the hash value to verify its authenticity. The rainbow signature
