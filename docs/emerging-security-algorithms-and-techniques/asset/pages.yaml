  md: '# Entity Authentication


    | Message C1 | $E_{K_A}(X)$ | Private secret key $k_B$ |

    | :--- | :--- | :--- |

    | Information that A sends | $E_{K_B}(E_{K_A}(X))$ | Message C2 |

    | Private secret key $k_A$ | $E_{K_A}(E_{K_B}(E_{K_A}(X))) = E_{K_A}(E_{K_B}(X))
    = E_{K_B}(X)$ | B |

    | Message C3 | Information obtained by B |


    FIGURE 13.5

    Illustration of Shamir''s TPP


    +   1. There are two users, A and B. Both will choose their own private keys $K_A$
    and $K_B$ randomly.

    2. A will encrypt the message by his/her own secret key $K_A$ and send it to B.
    The cryptogram will be $C_1 = E_{K_A}(X)$.

    3. When B receives the message, he/she will consider it as a plaintext and encrypt
    using his/her own secret key $K_B$ and send it back to A. The cryptogram will
    be $C_2 = E_{K_B}(C_1) = E_{K_B}(E_{K_A}(X))$.

    4. When A receives the message, he/she will decrypt it using his/her own secret
    key $K_A$. According to the commutative property, $E_{K_1}(E_{K_2}(X)) = E_{K_2}(E_{K_1}(X))$
    the cryptogram will be:

    C_3 = E_{K_A}^{-1}(E_{K_B}(E_{K_A}(X))) = E_{K_B}^{-1}(E_{K_A}(E_{K_B}(X)))$.
    Then, A will send $C_3$ to B.

    5. B will receive the message and decrypt it using his/her own secret key $K_B$,
    and he/she will be able to read the message successfully.


    # 13.7.2 Massy–Omura Cryptosystem


    It is a cryptography mechanism that uses the private key cryptography to secure
    a message in the time of transmission. Massey–Omura cryptosystem has some features
    that make it vulnerable to cryptanalysts. This kind of cryptosystem with prime
    modulus is considered as an exponential system. Therefore, if a cryptanalyst could
    get the encryption key and modulus, he/she would be able to subtract the private
    key of correspondents and decrypts the message easily. Massy–Omura cryptosystem
    uses the commutative function for encryption and decryption of messages, as discussed
    in Section 13.7.1. Massy–Omura cryptosystem with its correspondence protocol is
    explained in Winton (2007) as follows:


    +   1. An alphabet should be selected, let’s say A.

    2. The maximum length $N$ of the message must be determined. So, $N$ is the maximum
    length of characters for each message.

    3. The scheme $S$ selected is selected to convert the message from alphabetic
    to numerical form and vice versa.'
