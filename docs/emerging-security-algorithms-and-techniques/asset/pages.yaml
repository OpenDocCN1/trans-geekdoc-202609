    # 13.3 Two-Factor Authentication


    Due to the implementation of hacking tools and malicious accesses to others accounts
    and degradation of security concept by fake users, thus allowing hackers to get
    access into the system. Users also prefer to use easily guessable passwords and
    keep the same password for multiple accounts, and some of them allow the browser
    to save their passwords by asking it to remember these passwords; thus, it becomes
    easy to a hacker to hack a user''s accounts using some attacks like dictionary
    attack and some tools like key-loggers or through social engineering (Sabzevar
    & Stavrou 2008; Vaithyasubramananian, Christy, & Saravanan 2015). Two-factor authentication
    (TFA) method comes into the picture to solve these problems and ensure the authorized
    access of users on the Internet.


    TFA is a cybersecurity method that ensures the authorized access of users to their
    own accounts. This method uses two phases of security which adds an extra level
    of security along with a static password during the login procedure. The extra
    level of security avoids hackers from comprising the account even if the hacker
    knows the username and the static password.


    To apply TFA, users required to have thnings:


    +   - Something user knows like [login IDs and passwords].

    - Something user has like [mobile, computer, email, and ATM card].

    - Something user is like [fingerprint, iris recognition, voiceprint, and face].


    These three requirements are met by users to prove their identities while trying
    to access their accounts in social media or for some other proposes The first
    requirement is used for some other proposes like ticket booking and money withdrawal
    using the second requirement. The third requirement, which is the most important
    step of TFA and also used by users, is to achieve the extra level of security.
    While the third requirement options are more expensive and rise the privacy concern,
    the One-Time Password (OTP) came into the picture as an alternative option for
    the TFA method (Vaithyasubramanian, Christy, & Saravanan 2015).


    OTP is an authentication mechanism to secure user account from being accessed
    by unauthorized people. OTP adds more security to the login process by sending
    the user a password to be used once during logging in his account. In OTP, the
    user will be sent a different password each time he attempts to log in his account.


    To implement OTP authentication, there are two main modes discussed in Xiao-rong,
    Qi-yuan, Chao, and Ming-quan (2005) as follows:


    +   1. Challenge response mode: in this mode, a challenge will be generated to
    the user by the system during the login process. This challenge will be combined
    with the user password, and then the user will generate an OTP. User will send
    this OTP to the system and be logged successfully once.


    +   2. Time synchronization mode: in this mode, the login time will be taken as
    a random number and be combined with the user password to allow the user to access
    his account. In the mode, the user will be allowed to access his account only
    once and he has to repeat this process each time he attempts to log in his account.'
  merge: -1
  img_proc: true
