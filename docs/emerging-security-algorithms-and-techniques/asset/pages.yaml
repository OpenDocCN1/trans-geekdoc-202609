    # 3.3 Co-Prime Number


    A set of two natural numbers having only 1 as a common factor is called a co-prime
    number. It is also known as relatively prime numbers (Erdős, Luca & Pomerance,
    2008; Berliner, 2016; Raggi, Montes, & Wisbaurer, 2005; Camina & Camina, 2009),
    as depicted in Table 3.3.


    +   - Co-prime numbers always exist in a set or group

    - The highest common factor (HCF) of co-prime numbers is 1. In other words, the
    greatest common divisor gcd(a, b) = 1 where a and b are natural numbers and a
    > b.

    - Suppose a and b are co-prime and d is a common factor, then d has to be 1.

    - The sum of two consecutive numbers is always co-prime numbers, as shown in Table
    3.4.

    - Co-prime numbers can be of any odd or even number.'
