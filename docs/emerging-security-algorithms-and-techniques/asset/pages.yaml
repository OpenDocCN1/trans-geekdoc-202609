    # 16.8 Lightweight Cryptography Applications in IoT, Sensor Networks, and Cyber-Physical
    Systems


    Internet of Things (IoT) and Cyber-Physical Systems (CPS) are two newly introduced
    scenarios which play an important role for communication among wireless devices.
    IoT refers to the interactions happening between RFID sensors and small devices.
    All are categorized under IoT. These emerging small-sized devices are more vulnerable
    to attacks; threat is always observed for data integrity. The new small-sized
    devices working under environments confined under different kinds of constraints
    like systems connected to small networks known as Wireless Sensor Networks (WSN);
    they need short code size algorithms which take less memory space. This is the
    reason they are named lightweight. A lightweight security key is generated by
    algorithms made to work efficiently in the constrained environments. Examples
    of such protocols are TSL and IPSec. They provide security and efficiency trade-offs.
    Also uses symmetric keys for end-to-end communication as they are applicable low-resource
    devices of small footprints. Lightweight cryptography applications in IoT, Sensor
    Networks, and CPS refer to the requirements in security which leads to the system
    in which lightweight security key is used; the systems in which such kind of algorithms
    used are RFIDs WSNs and CPS. We will look at lightweight cryptography, its threats,
    how it can be made secure, what is the mechanism that lightweight security key
    generation flows.


    Cyber-Physical Systems—is a control and monitoring mechanism with the computer-based
    algorithm which is closely integrated with the Internet and its usage. These are
    built by integration of physical components that are deeply inter-wind; they work
    on different spatial and temporal scales. They show a modular behavior and interact
    using number of ways that can change according to usage. Examples of such systems
    are a smart grid, autonomous, automobile systems, medical monitoring, process
    control systems, robotic systems, and automatic pilot avionics. They process properties
    such as adaptability, scalability, resilience, security, and usability that provide
    a foundation to the infrastructural systems which will emerge smart systems for
    future.


