    \ 35 is not a prime number but satisfies the rule 6n−1 = 6 * 6 − 1 = 35.\n\n+\
    \   * 3 or 4 digits number: To check whether the given number is prime or not\
    \ just finds the perfect square closest to the given number.\nFor example, checking\
