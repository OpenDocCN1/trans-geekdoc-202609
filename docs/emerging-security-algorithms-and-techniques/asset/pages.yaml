- pgno: 196
  md: "Omkant Pandey, join their hands with Amit Sahai and Brent Waters in the development\
    \ of ABE. They have written an article on ABE, i.e., “Attribute-Based Encryption\
    \ for Fine-Grained Control of Encrypted Data”. Recently, many researches have\
    \ been performed on ABE with multiple authorities, where the user's private keys\
    \ are jointly generated.\n\n# ##11.2 Brief Discussion on ABE\n\nAlmost one of\
    \ the recent approaches in the study of cryptography is the concept of ABE which\
    \ is also one of the genres of public key cryptography.\nThe traditional approach\
    \ of public key cryptography includes the encryption of the messages for the particular\
    \ receiver by using his/her public key. This traditional approach of public key\
    \ cryptography was changed by the study of Adi Shamir of identity-based cryptography\
    \ and specially discussed in Chapter 10 which includes the public key as an arbitrary\
    \ string, e.g., e-mail id. Then, the concept of ABE came into existence, which\
    \ takes the study further by defining the identity as a set of attributes rather\
    \ than an atomic value (Shamir, 1979). In ABE, data are decrypted using the private\
    \ key where data are dependent on the set of attributes, such as residence address\
    \ of the receiver and type of subscription account (Sahai & Waters, 2005).\n are\
    \ two main types of ABE schemes:\n\n+   * Ciphertext-policy ABE (CP-ABE)\n* Key-policy\
    \ ABE (KP-ABE).\n\n# ##11.2 Key Terminology, Definitions, and Related Terms\n\n\
    # ##11.2.1 Identity-Based Encryption\n\nAs discussed in Chapter 10, IBE is used\
    \ for getting the authentication of the public key of the receiver before sending\
    \ the message by the sender (Shamir, 1984). The public key is an arbitrary string\
    \ which may be an e-mail address, physical IP address, etc.\nIBE allows any party\
    \ to generate a public key. Private key generator (PKG) is a trusted party which\
    \ gives the corresponding private key.\n\n# ##11.2.2 Fuzzy Identity-Based Encryption\n\
    \nIn 2005, Amit Sahai and Brent Waters introduced a new concept in IBE, i.e.,\
    \ FIBE—a set of descriptive attributes that are the identities (Chatterjee & Sarkar,\
    \ 2006). FIBE works on certain distance (threshold distance) between the users.\
    \ This distance is measured by some metric system. Suppose that Alice with $\\\
    omega$ as the secret key will only be able to decrypt the ciphertext which is\
    \ encrypted with $\\omega'$ as public key if and only if $\\omega$ and $\\omega'$\
    \ are within a certain distance. ABE is defined as the application in FIBE in\
    \ which the user can encrypt the information to all other users having the certain\
    \ set of attributes. The FIBE provides the advantage of storing the document on\
    \ an untrusted server like a cloud server."
