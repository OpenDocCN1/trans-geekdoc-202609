    # 14.3.1 Introduction to Logic of Message Digest Algorithms


    The algorithm is given arbitrary length input as a message and thus creates an
    output—a fingerprint is a 128-bit message hash of the input. It is the working
    of Message Digest that it is infeasible or difficult, computationally, to produce
    two inputs that have the same message digest or hash, or to produce any message
    with a predefined hash or digest.


    The simple logic for the Message Digest algorithm is that an arbitrary input is
    passed through the hash function on the sender''s end. The hash function digits
    it forms the message digest. On the receiver, this digest is decrypted by either
    a rainbow table of matched hashes or by know hashes. If the hash digest is the
    same as input digest, it is accepted as non-tampered data. If it does not match,
    it is discarded.


    All Message digest algorithms create a 128-bit output hash.


    # 14.3.2 MD2


    The Algorithm works in the following five steps:


    +   1. Append Padding

    The message is padded by a multiple of 128 bit or 16 bytes which is the block
    length to make it a multiple of 16 bytes.

    2. Append Checksum

    The message created in the previous step is appended by a checksum of 16 bytes.
    To do this, a 256-bit random permutation is used.

    3. Initialize MD buffer

    A new buffer already initialized to zero is used. It is a 48-bit auxiliary buffer
    which is used to compute digest value.

    4. Process Message in 16-byte blocks

    The 256-byte permutation similar to the one used in step 2 is used here. A loop
    runs permeates each byte in the auxiliary buffer 18 times for every 16 input bytes
    processed.

    5. Output

    When all blocks have been processed, the first partial block of the auxiliary
    block becomes the message digest.

    The MD2 message digest is simple to implement and provide a fingerprint of the
    message. The difficulty of two messages to come up with the exactly same hash
    of the message is $2^{64}$, and coming up with a message from message digest is
    $2^{128}$.


    # 14.3.3 MD4


    The MD4 algorithm was created to be quick on 32-bit machines. It does not require
    any large substitution tables as the MD2 does and the algorithm can be coded quite
    efficiently.'
