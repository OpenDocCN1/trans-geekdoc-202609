    # 9.6.2 Winternz One-Time Signature Scheme (W-OTS)


    After the introduction of LD-OTS, Merkle has written that Winternz suggested him
    the method and named it Winternz one-time signature scheme. The main notion is
    to use a string $(S_0)$ to sign various bits in message digest at the same time.
    It uses the same way functions and cryptographic functions like LD-OTS, and produces
    shorter signatures efficiently. The construction of the original W-OTS is explained
    as follows:


    +   * Key creation: Set, the number of bits to be signed at the same time, $w
    \ge 2$. Then, compute


    ```

    $t_1 = \left[ \begin{matrix} n \ w \end{matrix} \right], t_2 = \left[ \frac{\log_2
    t_1 \1+w}{w} \right]t = t_1 + t_2 \quad (9.19)$

    ```


    The signature key $(S_0)$ is selected such that


    ```

    $S_i(x) = (x_{i-1}, \dots, x_1, x_0) \in [0,1]^{n} \quad (9.20)$

    ```


    and the verification key $(V_i)$ is computed by applying one-way function $f :
    [0,1]^w \to \{0,1\}^w, 2^w-1$ times to each bit in $S_i$.


    ```

    $V_k(y) = (y_{k-1}, \dots, y_1, y_0) \in [0,1]^{n} \quad (9.21)$

    ```


    $y_i = f^{2^w-1}(x_i)$ for $0 \le i \le t-1$.


    +   * Signature generation: Construct a message digest $g(D)=M=(m_{n-1}, \dots,
    m_0)$ to be signed. In order to divide the message digest $d$ with $w$, prepend
    a minimum number of zeros to it. The string $d$ is split into $t-1$ bits such
    that $d=a_{t-1} \| \dots \| a_{t-1}$, where $\|$ signifies concatenation of strings
    and $a_i$ are integers belongs to $(0,1,2^w-1)$. Next, the checksum is computed


    ```

    $c = \sum_{i=0}^{t-1} (2^w - a_i) \quad (9.22)$

    ```


    Then, in order to divide a binary representation by $w$, we have prepend a minimum
    number of 0s and the string is split into $t_2$ groups such that


    ```

    $c = a_{t_2-1} \| \dots \| a_0 \quad (9.23)$

    ```


    In the end, the signature is calculated as


    ```

    $\sigma = \{f^{a_{n-1}}(x_{n-1}), \dots, f^{a_1}(x_1), f^{a_0}(x_0)\} \quad (9.24)$

    ```'
