    # 6.8 Word Auto Key Encryption


    David Wheeler in 1993 introduced a new cryptographic primitive named Word Auto
    Key Encryption (WAKE) (Pudovkina, 2001). It is a self-synchronous stream cipher
    that operates in CFB and essentially relies on three primitive operations: addition,
    shifting, and XOR. The keystream is generated in terms of blocks of size 256 and
    the preceding ciphertext is used to generate the new block of keystream.


    # 6.8.1 How It Works?


    "S-Box" with 2" entries is central to the design of WAKE stream cipher. Each entry
    in this table is a 4-bit word with a special attribute that the most significant
    of $4n$ is a permutation of all the available $n$-bit words and rest of the $3n$
    words are generated randomly. The initial values of the $4n$-bits $[a_0, b_0,
    c_0, d_0]$ are set with the key. At any point of time $t$, the new values of $[a,
    b, c, d]$ are computed using an invertible transformation function $S$ as illustrated
    here:


    ```

    $a_{new} = S(a_{prev}, y_{prev}, T)

    b_{new} = S(b_{prev}, a_{new}, T)

    c_{new} = S(c_{prev}, b_{new}, T)

    d_{new} = S(d_{prev}, c_{new}, T)$

    ```


    $Y$ and $T$ represent the ciphertext and S-BOX, respectively, and $S$ is the invertible
    transformation function defined as


    ```

    $S(x, y, T) = (x + y) \gg n \oplus T[(x + y) \mod 2^n]$

    ```


    where >> and ⊕ are shift and XOR operations, respectively.

    d_{new} represents the final output, and ciphertext is produced by doing an XOR
    between plaintext and $d_{new}$. Similarly, at the decryption, plaintext can be
    produced by doing an XOR between ciphertext and $d_{new}$.

    The cipher security relies on a repeated table using a large state space. The
    table and the initial constant are generated from the secret key. Because the
    block size is too large, it is not suitable for applying in real-time communications.'
