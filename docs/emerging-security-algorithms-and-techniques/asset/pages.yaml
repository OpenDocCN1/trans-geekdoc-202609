  md: '6. Compute the integers $a$ and $b$ such that $a = \prod_{i=1}^{(B)} r_i$ and
    $b = \prod_{i=1}^{(B)} p_i^{c_i}$.


    7. Then, we have:


    ```

    $a^2 = \prod_{i=1}^{B} r_i^2 = \prod_{i=1}^{B} p_i^{2 \cdot \lfloor n/v_{p_i}(n)
    \rfloor} = b^2 \pmod{n}$

    ```


    which the nontrivial $n$ is similar to the previous algorithm; only the function
    $f(r) = r^2 \pmod{n}$ is replaced by $f(r) = r^2 - n$. This improves the running
    time of the algorithm, as for the function $f(r)=r^2-n$, it is easy to check whether
    $f(r)$ for some $r$ is smooth over a factor base. The process of finding all $r$
    for which $f(r)$ is smooth over a factor base is called Sieving. Now, if $f(r)
    \equiv 0 \pmod{p_i}$ for some integer $r_i$, $p_i \in B$. This implies that $r_i^2
    - n \equiv 0 \pmod{p_i}$,


    ```

    $(r_i + tp_i)^2 - n \equiv 0 \pmod{p_i}, \ t \in \mathbb{Z}$

    ```


    In the QS method, one might consider all primes $p_i$ in $B$ and for all $r$ for
    which $p$ divides $r$, which is equivalent to finding the square roots of $n$
    modulo $p_i$, $\forall p_i \in B$. Because of the above relation (i.e., if $p|r$
    then $p|f(r)$ then $f(r+tp)$ for $t \in \mathbb{Z}$), the seizing is simplified.
    It is more efficient than checking the smoothness of $f(r)$ for a randomly selected
    $r_i$, as in that case, one has to verify that $f(r)$ is divisible by all primes
    $p_i$ in the factor base $B$ using the trial division method (which is the case
    in the random square method).


    The expected running time of this method is asymptotically bounded by $O(e^{(1+\epsilon)\sqrt{\log
    n \log \log n}})$, for any $\epsilon>0$ (Bimpakis & Jajais, 2005). The details
    of this method can be found in Back and Shallit (1997) and Pomerance (1985). This
    method is considered the fastest factorization method before the NFS method was
    proposed. For the numbers up to 110-digit number, the QS method is faster than
    the NFS method.


    # 5.3.3 Number Field Sieve Method


    The NFS is considered the fastest method for factoring a large number. Like the
    other factoring method, this method has also used the congruence $x^2 \equiv y^2
    \pmod{n}$ to find the factors of $n$, but this time computation is in ring of
    algebraic integers. The NFS was first designed for special form of a polynomial,
    and this variant is called special field sieve (SNFS) method (Lenstra et al.,
    1993). In 1992, this algorithm is modified for arbitrary integer and as general
    field sieve (GNFS) or NFS method.


    The GNFS includes two parameters: the first polynomial function $f: \mathbb{R}
    \to \mathbb{R}$ with integer coefficient and the second parameter is a number
    $m \in \mathbb{N}$ such that $f(m)=0 \pmod{n}$, where $n$ is a composite number
    whose factor we have to determine. Such $f$ and $m$ can be easily found if much.
    If we choose $m$ first, then we find $f$ as $n=a_dm^d + a_{d-1}m^{d-1} + \dots
    + a_0$. Therefore, the function $f$ can be defined as $f(x)=a_dx^d + a_{d-1}x^{d-1}
    + \dots + a_0$ and which implies $f(m) \equiv 0 \pmod{n}$.'
