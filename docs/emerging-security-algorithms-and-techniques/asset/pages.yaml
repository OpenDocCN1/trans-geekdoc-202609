    with A. In this, both A and B make the communication with the intruder.


    Various other exploitable uses in the DHE exchange protocol configurations can
    be possible (Adrian et al., 2015). For instance, Adrian et al. found 23,631 servers
    have browser-trusted certificates, and if any browser negotiates with any of the
    listed servers about the DHE ciphers, then there may be a possibility of passive
    attack, which can compute the discrete log and obtain the TLS session keys.


    DHE protocol is a non-authenticated key protocol based on discrete exponential
    and logarithmic functions, but it forms the ground for public-key cryptography
    and various authenticated protocols (Hellman, 1978). Researchers have developed
    various exchange protocols to remove the drawbacks of DHE protocol which will
    be discussed in later subsections.


    # 12.2.2 Elliptic Curve Diffie–Hellman Key Exchange Protocol


    Elliptic Curve Diffie–Hellman (Miller, 1985) is another key exchange protocol,
    which is based on Elliptic Curve Cryptography (ECC). ECC is an approach based
    on the algebraic structure of elliptic curves over the finite fields of public-key
    cryptos and is more secure because it uses discrete curve logarithm functions
    (Koblitz, 1987). In this protocol, each communicating entity has a public and
    private key pair to create a symmetric over an insecure channel.


    # 12.2.2.1 Prerequisite (Miller, 1985)


    +   1. Domain parameters of elliptic curve $T = (p, a, b, G, n, h)$ or $(m, f(x),
    a, b, G, n, h)$.

    2. An elliptic private key $d$ in the interval $[1, n-1]$.

    3. An elliptic public key $Q$, where $Q = d$.

    4. Entity A’s key pair will be $(d_A, Q_A)$, and Entity B’s key pair will be $(d_B,
    Q_B)$. The public key of the participating entity is known to public.


    The following is the working of Elliptic Curve Diffie–Hellman Key Exchange protocol:—


    +   1. Entity A computes elliptic curve point $(x_A, y_A) = (d_A, Q_B)$, and Entity
    B computes the point $(x_B, y_B) = (d_B, Q_A)$.

    2. The shared secret will be $x_s$, the $x$-coordinate of the elliptic point.'
