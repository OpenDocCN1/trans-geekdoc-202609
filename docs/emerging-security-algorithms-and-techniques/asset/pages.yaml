    # 15.5.1 Introduction to BLISS and Lamport


    # 15.5.1.1 BLISS Signature Scheme


    BLISS, stands for Bimodal Lattice Signature Scheme, was proposed by L. Ducas,
    A. Durmus, T. Leponit, and V. Lyabashevsky in 2013. This scheme does not use the
    integer factorization, discrete logarithm or elliptic curve which can be broken
    using quantum computers. However, the BLISS is unbreakable even using quantum
    computers. The previous schemes are considered as pre-quantum schemes, and the
    BLISS is hence a post-quantum'
