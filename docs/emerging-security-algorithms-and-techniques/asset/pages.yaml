    5. $K^*$ XOR with opad to produce the $b$-bit block $S_o$

    6. Append the hash result from Step 4 to $S_o$

    7. Apply $H$ to the stream generated in Step 6 and output the result.


    The time taken for HMAC execution is approximately the same as the embedded hash
