    Given an initial state $X_0$ of the system, future states can be obtained by repeatedly
    applying the evolution function. Thus, a discrete dynamical system is said to
    be iterated in this manner. An orbit of a state $X_0$ of a given map $X_n=f(X_n)$
    is the union of the set of states that the system went through to the given state
    $X_n$, and the set of states that are continuously applying the evolution function
    starting from the given state. The set containing the previous states of a given
    state is called the backward orbit, while the set containing the future states
    is the forward orbit. Non-invertible maps do not have backward orbits.


    A fixed point of a map is a state which has the same next state as the present
    state, when $f(X)=X$. If a map has a state $X_*$ such that applying the evolution
    function on it for $n$ iterations, the system reaches the same state $X_p$ then
    the point $X_0$ is called a periodic point of period $n$. A fixed point can be
    attracting or repelling in nature depending on whether the nearby orbits converge
    or diverge from the point. Attracting fixed points and periodic points are attractors.


    Stability of a fixed point or periodic point is determined by the stability coefficient.

    A small change or perturbation is applied to a fixed periodic point of a dynamical
    system, and the corresponding change is observed in the system. The stability
    coefficient is obtained by analyzing this change in the system. If the stability
    coefficient is not equal to one, then the fixed point or periodic is hyperbolic—stability
    coefficient having a value less than one implies stable and for coefficient greater
    than one, unstable. We cannot say about stability, if the stability coefficient
    is equal to one.


    **Nonlinear dynamical systems** have evolution functions that are nonlinear dependent
    on the inputs. These nonlinear dynamical systems exhibit deterministic chaotic
    behavior if they are deterministic in nature, have irregular and aperiodic behavior,
    and are sensitive to initial conditions. This sensitivity to initial conditions
    and irregular periodic behavior makes the chaotic systems mimic random behavior
    although being deterministic in true nature. This makes it suitable for cryptographic
    systems (Kovač & Lian, 2011).


    Chaotic maps form the core of chaotic-based cryptography. The properties of chaotic
    dynamical systems parallel many properties of cryptographic systems. The ergodicity
    and sensitivity properties of chaotic systems are similar to the confusion and
    diffusion properties of cryptographic systems. The deterministic irregular behavior
    works similar to the deterministic pseudo-randomness of systems. Despite the similarities,
    chaotic systems have many differences from cryptographic systems, as chaotic systems
    work on subsets of real numbers to cryptographic systems that work on finite sets
