    \ but diagonally all numbers multiples of 7 are not prime, as depicted in Table\
    \ 3.1.\n\n+   * Every number greater than 2 can be written as the sum of two prime\
    \ numbers.\nFor example: 8 = 7 + 1, 20 = 19 + 1, 36 = 31 + 5\n\nMethod to check\
    \ whether a given number is prime or not:\n\n+   * A prime number has exactly\
    \ two factors.\n* 1 is a unit not as a prime or composite number; it also has\
    \ only one factor itself.\n* Every prime number satisfies the rule: (6n +1) =\
    \ P or (6n−1) = P except 2 and 3, where n is the natural number, as shown in Table\
    \ 3.2.\n* It is not the final condition to check the primality of a given number,\
