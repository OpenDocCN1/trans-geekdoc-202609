  md: '# 2.2.3 Examples


    +   1. The set A = {1,-1} under binary operation multiplication is a cyclic group
    with -1 as its generator.

    2. The set A={1,-1,i,-i} with binary operation multiplication is a cyclic group.

    Where G=(i) cyclic i^1=1, i^2=-1, i^3=-i, i^4=1.

    3. (z,+) is a cyclic group, where Z=(1).

    4. The nth root of unity is a cyclic group.


    # 2.2.4 Results


    +   1. A subgroup of cyclic group is a cyclic.

    2. The number of generators of an infinite cyclic group is 2, namely a generator
    and its inverse.

    3. If G=(a) be a finite cyclic group of order n, then a^m is a generator of G
    iff 0 < m < n and (m,n)=1.


    # Illustrated Example


    Find the generators of a cyclic group of order 8.

    Solution: We have G=(a,a'''')=e

    Then by the theorem, all the generators of a,a^3,a^5,a^7 satisfy gcd of 1, 3,
    5, 7 with 8 is 1. Thus, G=(a)=(a^3)=(a^5)=(a^7).


    # 2.2.5 Abelian Group


    An abelian group is a set with a binary operation * satisfying the following conditions:


    +   1. For all a,b,c ∈ A, we have a*(b*c)=(a*b)*c (the associative law).

    2. There is an element e ∈ A such that a*e=e for all a ∈ A.

    3. For any a ∈ A, there exists b ∈ A such that a*b=e.

    4. For all a,b ∈ A, we have a*b=b*a (the commutative law).


    Thus, an Abelian group is a group satisfying the commutative law (Kumar, 2009).


    # Examples


    +   1. (Z,+),(R,+),(Q,+),(C+) are all infinite abelian group.

    2. All the cyclic groups are an abelian group.


    # 2.2.6 Coset of a Group


    The coset of a group is of two types: one is called left coset, and the other
    is called right coset. It can be defined as follows: if H is a subgroup of group
    G and a∈ G, then aH={ah | h∈ H} is called left coset and Ha={ha | h∈ H} is called
    right coset (Bhattacharya, Jain, & Nagpaul, 1999).

    Note both cosets are subsets of G, and these cosets partition the group into equivalence
    classes.'
