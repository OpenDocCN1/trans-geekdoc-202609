  md: '# 12.2 Key Exchange Cryptographic Algorithms


    Key exchange or key establishment in the cryptystem is the method of exchanging
    keys between the communicating entities for secure communication, using cryptographic
    key exchange algorithms. Broadly, key establishment protocols are divided into
    two types: key transport protocol, in which key created by one entity is transported
    to other communicating entity, and the second is key exchange protocols, which
    keys are created by the joint effort of the communicating entities and are exchanged
    between them (Law et al., 2003). Keys can be exchanged in two ways—either in-band
    or out-of-band. In in-band key exchange, key is exchanged between the entities
    through the same communication channel in which the entities are communicating
    and encryption is taking place, whereas in out-of-band key exchange method, keys
    are exchanged through the channel other than the channel by which they are communicating,
    i.e., the channel that they use for encryption (Dulaney and Eastmost, 2017). Key
    exchange is an important part of the key management system and is constantly explored
    by the researchers. This section discusses various key exchange methods, and more
    discussions can be found in subsequent subsections.


    # 12.2.1 Diffie-Hellman Key Exchange


    Diffie-Hellman Key Exchange (DHE) protocol was developed by Diffie and Hellman
    (1976) for securely exchanging keys between the communicating entities even if
    the intruder is monitoring the communication channel. This is the first public-key
    exchange protocol in which the communicating entities do not need to agree on
    the keys they require must choose two numbers P and Q known to public. P is a
    large prime number with restriction that (p-1)/2 must also be the prime number
    and Q is also a prime number. The protocol works as:


    +   1. Entity A chooses a large random number x and calculates $K_1 = Q^x \bmod
    P$

    2. Entity A sends the $K_1$ to entity B over the channel.

    3. Similarly, entity B chooses another large number y and calculates $K_2 = Q^y
    \bmod P$

    4. Entity B sends the $K_2$ to entity A over the channel.


    +   5. Both entities A and B after exchanging the $K_2$ and $K_1$, respectively,
    calculate the value of K which is a symmetric key. Entity A calculates $K = K_2^x
    \bmod P$, and entity B calculates $K = K_1^y \bmod P$. In this way, they share
    the symmetric key.


    Predicting the value of the symmetric key is very difficult in DHE protocol because
    the values of x and y are very large and difficult to guess. Perhaps it will take
    long time to interpret the key and it''s a secure way to exchange the key, but
    it suffers from various attacks (Adrian et al., 2015). First, it suffers from
    Man-in-the-Middle attack in which the intruder can create two keys and sends them
    to entity A, creating the communication link between A and himself, similarly
    it does with B. Suppose entities A and B want to exchange the key and the intruder
    is trying to get the message by fooling entity A to be as B and similarly, entity
    B to be entity A. The attack will work as follows:


    +   1. Entity A chooses the random number x and calculates $K_1 = Q^x \bmod P$
    and sends it to entities A and B.'
