- pgno: 94
  md: '# 6.2 Block Ciphers


    A block cipher works on the principle of dividing the input stream of plaintext
    into fixed-size strings called blocks. The conventional size of a block cipher
    is 64, 128, or 256 bits. Block cipher encryption remains one of the popular methods
    of concealing information (Lai & Massey, 1990). If the plaintext length is shorter
    than the size of the block, then the padding technique is used. This is to ensure
    that the data are appended to the actual plaintext, such that the resulting plaintext
    is partitioned into pieces that are multiple of block size. The resultant blocks
    are encrypted one at a time, using a cryptographic key to produce the ciphertext
    and there is no correlation between the encrypting of one message and another.
    Finally, the plaintext blocks of specific length are converted into their corresponding
    ciphertext blocks of equal length.


    # 6.2.1 Modes of Operation


    A cryptographic mode refers to the way in which plaintext can be encrypted into
    ciphertext by combining the basic cipher, some sort of feedback, and some elementary
    operations (Dworkin, 2001). Multiple methods of encrypting a large set of plaintext
    with a block cipher have been proposed. In this chapter, we discuss the five modes
    of operation.


    # 6.2.1.1 Electronic Code Book


    As the name suggests, this mode can be perceived as a large codebook that replaces
    each input by a distinct output. ECB is the most classical way of encryption (decryption)
    in which the message blocks are encrypted independently of one another with a
    key by the source. These message blocks are typically of size b bits and in case
    of exceeding b bits, the entire message is divided into blocks and the last block
    is padded in case it is not multiple of b. Each such block is encrypted and transmitted
    individually to the decrypt device, which uses the same key to decrypt. The advantage
    with this mode is that synchronization is not mandatory, ie., in some blocks are
    lost during transmission, the received blocks can still be decrypted. If some
    errors occur during transmission, they will only affect the corresponding block
    and no other blocks. The drawback with this mode is that the identical message
    block will be encrypted to identical ciphertext as long as key remains the same,
    but with different keys, the output will be different.


    # 6.2.1.2 Cipher Block Chaining Mode


    The objective is to overcome the limitations faced in ECB mode by chaining together
    the encryption of all blocks in a way that each cipher is reliant on the respective
    plaintext block as well as all preceding plaintext blocks. The underlying idea
    is to feedback the previously generated ciphertext as input to the algorithm and
    XOR it with next message block, which is then encrypted to generate next ciphertext
    block and it continues all the blocks are encrypted. Pertinently ciphertext for
    feedback is available here for the first message block. CBC mode takes care of
    this by adding an IV to the first message block. The initialization vector is
    a randomized seed value and plays a vital role in making CBC encryption random.'
