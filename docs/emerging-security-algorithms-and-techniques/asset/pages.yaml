  md: 'Post-Quantum Cryptography


    # 9.2 Preliminaries


    In this section, some preliminaries and basic notations are given, which will
    be used throughout the chapter.


    +   **Linear code:** Linear code C of length $n$ and dimension $k$ over a field
    $F$ is a $k$-dimensional subspace of the vector space $F_q^n$ with $q$ elements,
    a set of $n$-dimensional vectors can be referred to as a $[n, k]$ code and elements
    of bits such that $F=GF(2)=\{0, 1\}$. If the minimum Hamming distance of the code
    is $d$, then the code is a $[n, k, d]$ code.


    +   **Hamming distance:** A Hamming distance $d_H(x,y)$ is the number of positions
    in which two code words $(x,y)$ (Löndahl, 2015). Let C be a $[n, k]$ linear code
    over $F_q^n$ and $x=(x_1, x_2, \dots, x_n)$, $y=(y_1, y_2, \dots, y_n)$ are two
    code words.


    $$d_H(x,y) = |i : x_i \neq y_i, 1 \leq i \leq n|$$


    +   **Hamming weight:** A Hamming weight $w_H(x)$ is defined as the number of
    nonzero positions in the code $x$ (Löndahl, 2015). Let C be a $[n, k]$ linear
    code over $F_q^n$ and $x=(x_1, x_2, \dots, x_n)$ is a code word, such that


    $$w_H(x) = |i : x_i \neq 0, 1 \leq i \leq n|$$


    +   **Generator matrix:** A generator matrix for C is a $k \times n$ matrix $G$
    having the values of $V=(v_1, v_2, \dots, v_k)$ as rows, which forms a basis of
    such code


    ```

    $$C=\{m : m \in F_q^n\}, G=\begin{bmatrix} v_1 \ v_2 \ \vdots \ v_k \end{bmatrix}\$$

    ```


    The matrix $G$ generates the code as a linear map: for each message $m \in F_q^n$,
    we obtain the corresponding code word $mG$ (Löndahl, 2015).


    +   **Parity matrix:** A $(n-k) \times n$ generator matrix $H$ is called a parity-check
    matrix for code word $C$ (Löndahl, 2015), which is described by


    ```

    $$C=\{m : m \in F_q^n : mH^T = 0\}$$$

    ```


    +   **Lattice:** It is defined as a set of all integer combinations of linearly
    independent vectors $(a_1, a_2, \dots, a_n)$ of length $n$ in $R^n$, which are
    basis in the lattice.


    ```

    $$L(a_1, a_2, \dots, a_n) = \sum_{i=1}^n x_i a_i | x_i \in \mathbb{Z}, 1 \leq
    i \leq n$$

    ```


    It can be represented in a matrix form such that $A=(a_1, a_2, \dots, a_n) \in
    R^{n \times n}$, where columns act as a basis vector (Peikert, 2016).'
