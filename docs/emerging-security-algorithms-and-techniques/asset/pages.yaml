    ```\n\nThe loop has O(√n) iteration without polynomial running time in a number\
    \ of input bits.\n\n# 3.2 Prime Number\n\nA prime number is an integer that can\
    \ only be divided without remainder by positive and negative values of itself\
    \ and 1 (Stein, 2009; Aaronson, 2014; Agrawal, Kayal, and Saxena, 2004; Crandall\
    \ and Pomerance, 2005).\n\n+   * Prime numbers have only divisors of 1 and itself.\n\
    * They cannot be written as a product of other numbers.\n* A prime number is always\
    \ greater than 1.\n* Rules to find out prime numbers between 1 and 100\n  1. 1\
    \ is not prime, composite.\n  2. 2 is prime but all numbers divisible by 2 are\
    \ not prime.\n  3. 3 is prime but all multiples of 3 are not prime.\n  4. 5 is\
