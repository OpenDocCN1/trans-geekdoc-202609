    entities and other related information. CA is nothing but a trusted third party
    which issues digital certificates to the participating entities. The issued certificate
    from the CA is then given to the communicating entities with their matching private
    keys, and this information is not public, but rather they keep secret. The CA
    has the only right to create and update the certificates, which contains the name
    and the public key of the communicating entity. Any communicating entity can read
    the certificate''s owner and verify the certificate that it is issued by the CA
    or not. Denning and Sacco (1981) added the requirement of verification of the
    certificate''s freshness by any participating entities.


    For ensuring the security of the certificates, so that the CA will not be able
    to issue any improper certificate, RFC 5280 has defined a revoked state that if
    the CA issues an improper certificate or the private keys are compromised in any
    manner or any policies of CA are violated by the CA or by their users, then the
    certificate is revoked. There is also an revocation list, which is a kind of CRL
    that contains the list of revoked certificates from the issuing CA.


    In public-key scheme, each communicating entity requests a certificate with a
    public key from the CA. Requests for the certificate made by the communicating
    entities to the authority are in person or through an authenticated secure communication.
    The CA sends the certificate to the entity which requests it, say entity A. The
    certificate is encrypted by CA''s private key to prevent the certificate from
    getting forged, on receiving the encrypted certificate by the recipient, say entity
    B, the B will decrypt the message by the CA''s public key to get the certificate
    element, i., identity of entity A and its timestamp value indicates the freshness
    of the certificate. Certificates are assumed to be expired if it is sufficiently
    old where the timestamp serves the date of the expiry. This scheme solves the
    problem of forgery, for example, if an entity A wants the public key of B, then
    it will download the certificate and the encrypted message. Message digest; the
    encrypted message then is decrypted through CA''s public key and both the encrypted
    messages are compared; if both are equal, then no forgery happens and the certificate
    is valid.


    # 12.3.4 X.509 Certificates


    A public-key certificate scheme has solved the problem of the distribution of
    public keys to the communicating entities in a manner that it limits the forgery.
    But there is a problem with the certificate format issued from CA. The issued
    certificates may have different formats, i.e., one certificate is in one format
    and another format, which creates the problem of compatibility; there must be
    some universal format universally.


    To solve the above stated, a protocol X.509 was developed by ITU which is accepted
    Abstract Syntax Notation 1 (ASN.1). X.509 standard has a significant role in the
    certificate structure developed initially in 1988; later, it was introduced in
    2000 with the revised recommendation. The standard is based on the digital signature
    method and the public-key cryptography technique. The certificates are maintained
    by the CA. The CA has the responsibility to update the certificate and place them
    in their directory. The format of the X.509 standard for the certificates is provided
