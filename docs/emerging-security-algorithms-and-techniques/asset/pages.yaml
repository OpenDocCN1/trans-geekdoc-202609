  md: "# 2.2.7 Lagrange's Theorem\n\n# Statement\n\nThe order of a subgroup of a finite\
    \ group divides the order of the group.\nIn other words, if G is a finite group\
    \ and H is a subgroup of G, then $o(H)$ is a divisor of $o(G)$ (Gallian, 2012).\n\
    \n# Proof\n\nLet G be a group such that $|G|$ = number of elements of $G=n$\n\
    Also suppose that $H$ is any subgroup of $G$ such that $|G|=m$, we have to prove\
    \ that $m$ divides G.\nTake $G' = \\{g_1, g_2, g_3, \\dots, g_m\\}$ be $m$ distinct\
    \ elements of $G$.\nLet $a \\in G$ be any element of $G$, then clearly $aG'$ is\
    \ called left coset of $H$ in $G$.\nDefine $\\phi: G' \to aG'$ defined as $\\\
    phi(g)=ag$, here we easily prove that $\\phi$ is a bijective function from $G'$\
    \ to $aG'$, such that $\\phi[G']=aG'$, i.e., every left coset of $G'$ has the\
    \ same number of elements as $G'$.\nSince we know that cosets of $G'$ in $G$ partition\
    \ $G$, i.e., $G=\\{aG' | h \\in G\\} = a_1G' \\cup a_2G' \\dots \\cup a_rG'\n\
    $\\cdot |G|=r|G'$, where $r$ is the number of left cosets of $G$.\nThus, the order\
    \ of $G'$ divides the order of $G$.\nThis proves the theorem.\n\n# Remark 1\n\n\
    The converse of Lagrange's theorem is not true, i.e., if a number $m$ divides\
    \ the order of $G$, then it is not necessary that $G$ may have a subgroup of order\
    \ $m$.\n\n# Remark 2\n\nThe converse of Lagrange's theorem holds in the case of\
    \ finite cyclic groups.\n\n# 2.3 Ring\n\nA ring is a nonempty set $R$ with two\
    \ binary compositions denoted by $+$ and $\\cdot$, satisfying the following properties:\n\
    \n+   1. $a+b \\in R$ for all $a,b \\in R$\n2. $a+b=b+a$ for all $a,b \\in R$\n\
    3. $a+(b+c)=(a+b)+c$ for all $a,b,c \\in R$\n4. There exists an element denoted\
    \ by $0 \\in R$ such that $a+0=0+a=a$ for all $a \\in R$ (0 is called additive\
    \ identity or zero elements in R)\n5. For each $a \\in R$, there exists an element\
    \ $b \\in R$ such that $a+b=0$"
