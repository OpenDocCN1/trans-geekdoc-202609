    # 14.3 Introduction to Hash Functions


    Hash functions are extremely useful functions which have certain properties that
    make them extremely suitable for cryptography. These properties rely on the mathematical
    algorithm make it unique. It is an algorithm that takes any arbitrary input and
    produces an output of fixed size. Here input is either message or media and the
    output is digest or message digest. The one-way hash function makes it infeasible
    to invert. This means that the input data can be recreated through brute forcing
    of possible inputs or expecting a collision or by using rainbow table of matched
    hashes. There are certain properties to a hash function. Some of them are described
    below:


    +   1. Pre-Image Resistance

    Suppose you have a given value $h_i$, no messages $m$ should be easily discovered
    where $h = hash(m)$.


    +   2. Second pre-image resistance

    Suppose we have a message $m1$, discovery of a different message $m2$ such that
    **hash(m1) = hash(m2)** should be difficult. In other words, decrypting a hash
    function should lead to a single message.


    +   3. Collision Resistance

    Suppose we have an input message $m1$, its hash should not coincide with the hash
    of another message $m2$. In other words, **hash(m1) = hash(m2)** should be false.


    Informally, these properties about hash functions are meant to stop a malicious
    adversary from replacing or modifying the input data without changing its digest.
    This establishes accuracy and correctness. Thus, if two strings have the same
    digest, they should be identical. Second pre-image resistance on the other hand
    stops an attacker from counterfeiting a data surface with the hash'
