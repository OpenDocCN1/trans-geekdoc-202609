    Azizi, & Bouallegue 2015; Inamura 2015. The authentication process is explained
    in the following (Figure 13.3; Azizi, Azizi, & Bouallegue 2015) (Inamura 2015):


    +   - After the PPP connection is established between server and client, the server
    generates a random challenge message and sends it to the client to check its authenticity.
    The client calculates the password with challenge message using a hash function
    and sends it as a response to the server.

    - The server calculates its own hash function and compares it with the response
    hash function. If both are the same, then accept the connection; if not, deny
    it and send a result acknowledgment to the client.


    # 13.6 Extensible Authentication Protocol


    EAP is an authentication protocol which is used to support login authentication
    process. It is considered a framework that allows choosing one if there are multiple
    authentication methods. The authentication process in EAP occurs over the data
    link layer like PPP or IEEE 802 standard. As EAP operates under the data link
    layer, so does not require an IP. EAP works in many environments such as circuits,
    wired and wireless networks. Elimination and retransmission of the authentication
    are supported by EAP where there is no fragmentation.


    The implementation of EAP has been done with network devices like host and router
    which are linked by switched circuits or dial-up lines using PPP. The implementation
    of access points and switches has been done using IEEE 802.E EAP also supports
    the encapsulation of wired links, and it has been defined in [IEEE 802.1X] and
    also supports the encapsulation of wireless LAN which is defined in [IEEE 802.11i].


    EAP is a flexible authentication protocol, and this is a feature of it. The other
    feature is EAP allows choosing a certain authentication method. Consistently,
    the authenticator in EAP sends a request to get further information to decide
    which authentication method to be used. In some cases, the authenticator cannot
    be updated to update all authentication methods; EAP allows the use of a backend
    authentication server. The backend authentication server can apply some or all
    authentication methods (Abobah, Blunk, Vollbrecht, Carlson, & Levkowitz 2004).'
