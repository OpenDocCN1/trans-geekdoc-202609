- pgno: 93
  md: '# Symmetric Algorithms I 81


    is conveyed in a safe way prior to correspondence and known at both sender and
    receiver ends (Stinson, 2005).


    # 6.1.2 Classification of Symmetric Key Cryptography


    Secure file protocols make use of symmetric key primitives to encrypt data. These
    primitives are categorized into two types: block ciphers and stream ciphers.


    Block cipher, one of the popular methods of concealing information, works on the
    principle of dividing the input stream of plaintext into fixed-size strings called
    blocks, typically 64, 128, or 256 bits long. Stream ciphers usually act on individual
    elements of the message. A private key and a randomized seed value called initialization
    vector (IV) are passed as input to the stream cipher, and a sequence of bits known
    as keystream is generated as output. This keystream is then XORed with the plaintext
    to compute the ciphertext (Schneier, 2007).


    # 6.1.3 Confusion and Diffusion


    Shannon (1949) introduced the concept of two primitive operations that can lead
    to accomplishing strong encryption. The two operations termed as Confusion and
    Diffusion were then introduced in his work "Communication Theory of Secrets Systems".


    +   i. **Confusion**: Shannon defined confusion as an encryption task in which
    the correlation between key and ciphertext is intractable. The idea is to make
    key discovery even when a large amount of ciphertext is generated from plaintext
    using the same key. Typically change in a single bit of key should alter the entire
    stream of ciphertext.


    +   ii. **Diffusion**: Encryption activity in which the impact of input bits is
    dissipated over numerous output bits with the objective that any change in plaintext
    should alter entire ciphertext in a pseudandom manner. The idea is to dissipate
    the statistical properties of plaintext into ciphertext.


    In the design of symmetric encryption systems, Substitution and Permutation network
    is a typical component to accomplish both confusion and diffusion. The combination
    of these two basic functions in multiple rounds is employed to provide for a maximum
    level of confusion and diffusion and thereby achieve a fairly level of secrecy.


    # 6.1.4 Substitution Box (S-Box)


    The S-boxes play a significant role in symmetric key cryptography and their primary
    goal is to render the necessary confusion. They work on the principle of mapping
    an input of n bits into output of m bits, where n and m need not be equivalent.
    The idea is to complicate the connection between input and output bits. Generally,
    for an m x n S-Box construction, lookup table with 2m strings of n bits each is
    employed (William, 2006). An important attribute associated with S-Box is its
    size and there is a trade-off in terms of implementation complexity and resistance
    to attacks. Often than not, larger S-boxes are cryptytically secure but challenging
    to design. The table may either be static in which case some pre-computed values
    are used or may be dynamic in which case the values change during execution (Bokharhi
    & Masoodi, 2012).'
