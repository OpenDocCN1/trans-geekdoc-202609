  md: "# Integer Factorization Problem\n\n3. Choose the random integers $a, x, y \\\
    in \\mathbb{Z}_n$ and compute $b = y^2 - x^3 - ax$.\n\n+   i. If $\\gcd(4a^3 +\
    \ 27b^2, n) = 1$, then make the new choice for $a, x, y$.\n\n+   ii. If $\\gcd(4a^3\
    \ + 27b^2, n) \neq 1$, then $E: y^2 = x^3 + ax + b$ is a random elliptic curve.\n\
    \n+   iii. Choose a point $P = (x, y)$ on $E$.\n\n+   4. Compute $mP = P + P +\
    \ \\dots + P$. For each computation, we will get a new point on the curve or a\
    \ factor of n.\n\n+   5. If a factor of $n$ was not found in Step (4), then choose\
    \ a new point on $E$ or go back to Step (3) and choose new $a, x, y$ or go back\
    \ to Step (1) to increase $b$.\n\nAs an example, if we use the elliptic curve\
    \ method to find the factors of $n=2773$ with the elliptic curve $E: y^2 = x^3\
    \ + 4x + 4$ and $P=(1, 3)$, $2P = (1771, 705)$ and the computation of $3P$ is\
    \ found at $\\gcd(1771, 1275) = 59$ which is a factor of $n$. The elliptic curve\
    \ method is the fastest method for factoring a large number. Two remarkable factorizations\
    \ obtained by using the elliptic curve method are Fermat tenth $(2^{32}+1)$ (Brent,\
    \ 2000) and eleventh $(2^{64}+1)$ (Stinson, 2013). The largest factor found by\
