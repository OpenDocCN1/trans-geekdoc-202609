  md: 'Symmetric Algorithms 85


    #  6.3.2 Linear Feedback Shift Register


    In stream cipher design, LFSRs have received a wide acknowledgment primarily due
    to their inherited characteristics including extended period, desired statistical
    properties, and low implementation costs (Masoodi, Alam, & Bokhari, 2012). An
    LFSR is a shift register that consists of multiple cascaded storage units (flip-flops)
    and using feedback, cycles the bits on each clock tick. An LFSR is said to iteratively
    generate a sequence of pseudorandom numbers by performing exclusive-OR (or exclusive-NOR)
    operation on chosen bits (taps) and blend with input. An LFSR is said to have
    generated a maximal sequence (m-sequence), if it can generate every unique value
    (precluding all 0''s state in exclusive-OR and all 1s before arriving at its starting
    state).

    LFSRs corresponding to reducible polynomials are capable of generating maximum
    length sequences, as LFSRs corresponding to irreducible polynomials do not generate
    an m-sequence and the length of the generated bit stream is independent of the
    starting value and the third kind of LFSRs corresponding to reducible polynomials
    depends on the starting values and the length of the generated sequence is dependent.
    Irreducible polynomials refer to the type of polynomials that cannot be factored
    and all polynomials in addition to satisfying some mathematical conditions are
    also irreducible polynomials of degree *n*, where n* represents the length of
    the register. An important property associated with Linear feedback shift registers
    is linear complexity and can be determined by the Berlekamp–Massey algorithm (Upadhyay,
    Sharma, & Sampalli, 2016).


    # Example 1


    Let''s consider two XOR-based LFSRs of degree 4 with different tap selection.
    The four flip-flops are driven by a common *CLK* and denoted as $q_1$, $q_2$,
    and $q_3$. At every clock pulse, the value of the LFSR is shifted to right by
    one and the value at $q_3$ is taken as the output bit. As shown in Tables 6.1
    and 6.2, both the LFSRs are initialized with the same value of [1, 1, 1, 1] but
    after the third clock pulse, the sequences deviate.


