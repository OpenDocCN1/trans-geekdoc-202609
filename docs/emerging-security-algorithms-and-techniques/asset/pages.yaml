    $Y_3 = M_3^{-1} \mod m_3$


    $\vdots$

    $\vdots$


    $Y_k = M_k^{-1} \mod m_k$


    +   4. $N = (a_1 * M_1 * Y_1 + a_2 * M_2 * Y_2 + a_3 * M_3 * Y_3 + \dots + a_k
    * M_k * Y_k)$


    Example 1


    Find out the number N is divided by 11, 7, 9, and 5 and leaves the remainders
    of 4, 2, 3, and 1, respectively.

    Solution:


    ```

    $x = 4(\mod 11)$

    $x = 2(\mod 7)$

    $x = 3(\mod 9)$

    $x = 1(\mod 5)$

    ```


    $a_1 = 4, a_2 = 2, a_3 = 3, a_4 = 1$ and $m_1 = 11, m_2 = 7, m_3 = 9, m_4 = 5$

    Now:


