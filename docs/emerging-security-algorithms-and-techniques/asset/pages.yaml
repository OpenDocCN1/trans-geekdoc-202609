    \ number $n$ to be factored. General-purpose algorithm is used for the cryptographic\
    \ application.\n\n# 5.3.1 Random Squares Method\n\nIf $n$ is an odd number, $n$\
    \ can be expressed as the difference of two square, i.e., for $a,b>0, n=a^2-b^2=(a-b)(a+b)$.\
    \ Therefore, the problem of finding factors of $n$ is now transformed into the\
    \ problem of finding $a$ and $b$. For each $a$, one can compute $a^2-n$ and check\
    \ whether it is a perfect square or not. If one find such a $a$ and $b$, then\
    \ $a+b$ and $a-b$ are factors of $n$. Note that we cannot find the factors of\
    \ $n$ if $a \\equiv \\pm b \\pmod n$. The problem of finding factors of $n$ is\
    \ equivalent to finding the integers $a$ and $b$ such that $a^2 \\equiv b^2 \\\
    pmod n$ with $a \neq b \\pmod n$. $\\gcd(a \\pm b, n)$ will give the nontrivial\
    \ factors of $n$.\n\nNote that the finding perfect number from the sequence of\
    \ integers $a^2-n$, $a>n$ is time-consuming. We can remove this drawback by selecting\
    \ a subsequence from the sequence $a^2-n$ such that the elements of this subsequence\
