  md: '# Prime Number


    # 3.14 Solovay–Strassen Test


    The Solovay–Strassen test is basically an Euler–Jacobi (Dietzfelberginger) pseudo-primality
    test introduced by Robert M. Solovay and Volker Strassen. It is a probability
    test that gives the result as either the given number is composite or prime. The
    concept of this algorithm comes from the Euler theorem as a^(p-1)/2 ≡ (a/p) (mod
    p), for any value of integer a and p, where (a/p) is the Legendre symbol. If we
    take the value of p to any odd integer n, then it forms the Jacobi symbol as a^(n-1)/2
    ≡ (a/n) (mod n) to observe the congruence. If n is the prime number, then this
    congruence satisfies all the value of a. The base a is called the Euler witness
    if n is composite. It is also possible to return an incorrect (Conrad, 2009, 2016).


    # Algorithm


    Let integer n to test the primality and a value t to check the accuracy. If n
    is composite, then we gives the result as composite, otherwise properly prime.


    +   For t:

    Choosing a random integer, a form the range [2, n–1]

    x ← (a/n)

    if x = 0 then return “n is composite"

    y ← a^(n-1)/2 (mod n)

    if x ≡ y then return “n is prime”.

    otherwise, return “n is composite”.


    # 3.15 Conclusion


    There are many ways to determine whether a number is prime or composite. In this
    chapter, we have covered only a few methods conclusively or practically with the
    help of examples. The test based on the practical example has not been conclusive
    and vice versa. The Fibonacci series and Elliptic primality test are not covered.
    Furthermore, there are many references given in this chapter to improve the knowledge
    and further study the topics in detail.


