  md: '# 10.2.5 Boneh–Boyen HIBE (BB-HIBE)


    In this section, we will discuss the single-level Boneh–Boyen HIBE (BB-IBE) scheme
    which is extended to an l-level hierarchical HIBE (HIBE) scheme using the technique
    developed by Boneh, Boyen, and Goh (BBG) with parameters = $(G_1, G_2, \hat{n},
    n, P_1, P_y, H_1, H_2, v)$ and master secret $a$ assuming that $|G_1| = p$ (Boneh,
    Boyen, & Halevi, 2006).


    The resulting HIBE scheme security depends on the difficulty of the BDHP (bilinear
    Diffie-Hellman problem). The attacker who is able to decrypt such a system can
    also be able to crack down solve. If we take BDHP as crack down or solve, the
    basic BBG scheme is resistant to chosen-ciphertext attacks and adaptive (Chatterjee
    & Sarkar, 2006) chosen-identity attacks.


    Thus, we will discuss BBG-HIBE (Basic).


    Note:


    +   1. For limiting the HIBE construction to a single-level, PKG initiates the
    BB-IBE scheme discussed in Section 10.2.3.


    +   2. There is a property of HIBE which defines that the size of the ciphertext
    increases with the increase in the number of levels in the HIBE construction.

    But in the BBG scheme, the size of ciphertext is constant, i.e., as the number
    of level changes in HIBE construction does not affect the size of ciphertext as
    it is constant (Boyen & Waters, 2006).


    # 10.2.5.1 Algorithm of BB-HIBE (Basic)


    +   1. Setup


    BB-IBE scheme parameters = $(G_1, G_2, \hat{n}, n, P_1, P_y, H_1, H_2, v).

    HIBE scheme parameters = $(Q_1, Q_2, ..., Q) \in G_1$, where master parameter
    $Q$ is generated randomly (Chatterjee & Sarkar, 2007).

    So, BBG-HIBE parameters = $(G_1, G_2, \hat{n}, n, P_1, P_y, Q_1, Q_2, ..., Q,
    H_1, H_2, v)$.


    ![](img/5ee0cf067ac8390dfbbfeae8da2f7512_180_0.png)


    FIGURE 10.3

    HIBE scheme.'
