    +   1. It was developed for authentication of sender. Meng Wing was the developer
    behind the framework. This sender''s domain is recorded, that get checked by SPF
    and from domain name came, then IP address is matched for further authentication.
    If it doesn''t match, the mail is declared as SPAM.

    2. Encryption: It is a method of preventing the intended user from gaining information
    in the middle. The key is to provide the receiver from a sender who authenticates
    the data. An example can be taken of Kerberos authentication. In e-mails, while
    transmitting the data, various techniques are used such as HTTPS and HTTP. To
    prevent sniffing attacks, encryption is used with the private network (VPN); it
    detects malware and viruses, and debars them from getting into the network through
    the use of a firewall.

    3. Measures of DOS attack: Systems as intrusion detection, enhanced routers, and
    firewalls are used as a defense against such attacks. Generally, the analysis
