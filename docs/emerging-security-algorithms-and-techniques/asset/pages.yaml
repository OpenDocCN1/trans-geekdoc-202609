    \ the re-encryption key, i.e., $R_{ID_{\\mu},ID_2}$.\n\n+   e. Re-Encrypt: Generates\
    \ an output if $C_{ID_2}$ on the input of ciphertext $ID_{\\mu}$ will output $C_{ID}$,\
    \ and re-encryption key $R_{ID_{\\mu},ID_2}$.\n\n+   f. Decrypt: For decryption,\
    \ use secret key $SK_{ID}$ decrypts the ciphertext $C_{ID}$ will output the message\
    \ $M$.\n\n> Note: For security to ensure that there should be no advantage against\
    \ the non-colluding users from the key-holders of colluding users set (Hess, Smart,\
    \ & Vercauteren, 2006).\n\n# 10.4 Other IBE Schemes\n\n# 10.4.1 IBE with Wildcards\
    \ (WIB)\n\nIBE plays a vital role in the segment of exchanging mails. For instance,\
    \ using IBE scheme which the public is the identity of the user, Alice sends an\
    \ email to Bob by encrypting the message under his identity bob@ibe.univ.edu.\
