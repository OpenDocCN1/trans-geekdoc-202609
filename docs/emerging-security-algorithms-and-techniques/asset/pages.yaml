  md: '# 6.6 Advanced Encryption Standard


    AES is a symmetric block cipher that won an open submission call issued by NIST
    in January 1997 (Smid, 2000). A total of 15 candidate ciphers were accepted in
    the first round and five finalists were chosen. A subset of Rijndael (Daemon &
    Rijmen, 2002) primitive submitted by Daemen & Rijmen was found to be the most
    fitting candidate and therefore selected to be the Advanced Encryption Standard.
    The block length and the key length of Rijndael are at least 128 bits but in compliance
    with the adopted FIPS standard, NIST set the length of block 128 bits and three
    variant keys of 128 bits or 192 bits or 256 bits—thus making three variants: AES(128),
    AES(192), and AES(256).


    # 6.6.1 How It Works?


    The algorithm consists of 10 rounds (12 for AES(192) and 14 in the case of AES(256).
    Every round having its own key obtained from the original by a key generator.
    The plaintext block of 128 bits forms the input for the first round leaving and
    output of 128 bits forms the input for the next round, and so on. Each of the
    rounds consist of four basic steps as follows:


    +   1. The ByteSub

    2. The ShiftRow

    3. The MixColumn

    4. Add RoundKey


    We have chosen to show the structure for AES-128. The structure for the other
    two versions is the same, but with a more number of rounds. To start, with both
    the plaintext block as well as the key is partitioned into smaller 16-bit blocks.

    The steps can be enumerated as follows:


    +   - Expand 16-byte key into key blocks: Input of the plaintext block. The size
    of the key is 16 bytes. These 16 bytes are expanded into two-dimensional arrays
    consisting of four rows and columns. The first array is used in the initialization
    process, and other 10 arrays are used in each round.

    - Convert 16-byte plaintext block into a state: Here, a 16-byte input message
    block is transcribed into a state. The state is a two-dimensional 4 × 4 array.
    The input block is copied into the state in the column order. This means first
    4 bytes of input message get copied into the first column of state and second
    4 bytes of input in the second column and so on.

    - XORing state with key block: In this step, first 16 bytes of the extended key
    and 16-byte state array are XORed. Thus, every byte in the state array is replaced
    by the XOR of itself and the corresponding byte in the extended key.


    This follows 10 rounds with identical steps, which the end result in a 128-bit
    ciphertext block.'
