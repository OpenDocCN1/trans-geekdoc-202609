    \ the two schemes: one is $BB_1$, and the other is $BB_2$. We will only discuss\
    \ $BB_1$, IBE scheme.\n\n# 10.2.3.1 Algorithm of $BB_1$-IBE\n\n+   1. Setup\n\
    Parameters of BB, IBE are as follows (Boneh & Boyen, 2007):\n\n+   a. $q$ is the\
    \ prime power\nb. $G_1$ and $G_T$ are the cyclic groups\nc. $\\hat{e}$ is the\
    \ pairing, i.e., $\\hat{e}: G_1 \times G_1 \rightarrow G_T$\nd. $n$ is length\
