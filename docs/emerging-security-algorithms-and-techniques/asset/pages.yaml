    # 9.5 Multivariate Cryptography


    Multivariate cryptography schemes are based on nonlinear equations that are difficult
    to solve over finite fields. Therefore, it is said to be light-weight cryptography
    that is efficient and effective to be used in embedded devices (microcontrollers).
    The security of multivariate cryptystems is based on NP-hardness of the problem
    to solve nonlinear equations over a finite field. In the last two decades, the
    rigorous development occurs in multivariate cryptography. It is defined as the
    study of a public-key cryptosystem (Diffie and Hellman) in which trapdoor one-way
    function is based on the mapping of multivariate quadratic equations over a finite
    field. There exist several multivariate public-key cryptography schemes as oil
    and vinegar (OV) signature scheme (Patarin, 1997), Rainbow signature scheme ($^*$,
    18, 12, 12) (Ding and Schmidt, 2005), and Quartz signature scheme (2,129, 103,
    3, 4) (Patarin et al., 2001). Such multivariate public-key encryption schemes
    are built in many ways, and all have their advantages and disadvantages. It can
    also be built as trapdoor multivariate quadratic because of the schemes are constructed
    using higher order quadratic polynomials.'
