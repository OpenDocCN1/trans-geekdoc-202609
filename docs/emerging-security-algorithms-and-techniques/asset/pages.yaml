  md: '# 12.4 Conclusion


    Cryptographic key management is a broad concept, and there are lots of challenges
    associated with it which need to be addressed by the research community. The chapter
    discussed various challenges involved in the cryptographic key management and
    problems associated with it. The NIST (National Institute of Standard and Technology)
    is looking forward and is making efforts to manage the keys and improving the
    cryptographic key system in order to secure the cryptographic keys. The exchange,
    storage, and distribution of keys in various networks like the delay-tolerant
    network open the door for further research. There is a serious requirement of
    key management protocols for the delay-tolerant networks (Menesidou et al., 2017).
    Furthermore, minimum standard for the secure handling in a heterogeneous environment
    is necessary and is a very significant challenge in view of future research.


