    # 14.3.5 MD6


    MD6 is a hash function in cryptography that uses a Merkle tree-like structure.
    This tree structure is used for immense parallel and simultaneous computation
    of hashes for long inputs. A hash tree or Merkle tree consists of every leaf node
    as the hash of one particular data block and every non-leaf node as the hash of
    its children nodes. For use in large data structures, efficient and secure verification
    can be allowed through the hash trees.


    The performance of MD6 for MD6-256 is as high as 28 cycles per byte on an Intel
    Core 2 Duo processor and offers some resistance against differential cryptanalysis.


    The MD6 is still in development as a replacement for SHA-3 (Secure Hash Algorithm)
    but has since failed to replace it due to speed issues.'
