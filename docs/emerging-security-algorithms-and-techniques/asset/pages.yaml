    # 3.6 Euler''s Totient Function


    If N is a positive integer, then function $\phi(N)$ counts all the positive integers
    relatively to N and that is less than equal to N. The number N can be represented
    as follows (Turner, 2008); Gorgui-Naguib & Delay, 2000; Dineva, 2005):


    ```

    $N=(P_1)^{\phi^1} (P_2)^{\phi^2} ... * P_k^{\phi^k}$

    ```


    This formula denotes the prime factors of N. Hence, the formula for Totient(N)
    is as follows:

    $\phi(N)=N(1-1/P_1)(1-1/P_2)(1-1/P_3) ... ((1-1/P_k))$ is called Euler''s product
    formula. For example:


    +   - $\phi(35)=35(1-1/7)(1-1/5)=35*6/7*4/5=24$

    Co-prime numbers to 35: 1, 2, 3, 4, 6, 8, 9, 11, 12, 13, 16, 17, 18, 19, 22, 23,
    24, 26, 27, 29, 31, 32, 33 and 34 (not multiples of 5 and 7)'
