    The public available directories are more secure than a public announcement of
    public keys, but still suffer from a drawback. An intruder manages to get the
    private key of the authority, then it can eavesdrop any messages sent by any communicating
    entities or can damage the records maintained by the trusted authorities.


    # 12.3.3.3 Public-Key Authority


    The distribution of public keys to the communicating entities from the public
    available directory must be done in a secure manner by having tighter control
    over the distribution of public keys. In this scheme, public-key authority has
    both public and private keys. The public key is known to all the communicating
    entities, and the private key is known only to the authority. Now, if entity A
    knows the public key of entity B, then it will send a timestamped message to the
    public-key authority requesting the public key of entity B. The original message
    request of entity A and the original timestamp for the verification of the freshness
    of the message. Now, entity A stores the public key of entity B for the communication
    with B for future using and the entity should ensure the freshness of the public
    key by requesting the public key of communicating entities from time to time.
    Entity A uses the public key of B for the encryption of the destined for B containing
    a nonce ($n_a$) and an identifier of A ($Id_a$) to uniquely identify the transmission
    of the message. In the same manner, entity B manages to get the public key of
    entity A ($PK_a$) and starts communicating by sending the encrypted message with
    A''s private key; the message contains A''s nonce ($n_a$) along with B''s newly
    generated nonce ($n_b$). In order to ensure that the message is transmitted to
    entity A, A will return B''s nonce ($n_b$) encrypted by B''s public key. This
    is a seven-step process which needs secure message transmissions between two communicating
    entities and public-key authority for the communication between the communicating
    entities.


    # 12.3.3.4 Public-Key Certificates


    In the public-key authority scheme for the distribution of the public keys, there
    is a risk of tampering of records maintained by the trusted authority. An alternative
    approach is to use certificates created by a CA; the certificate contains the
