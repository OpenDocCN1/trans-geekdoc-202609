    and an eavesdropper $O$. Privacy is achieved in a cryptographic system when $S$
    and $R$ communicate without $O$ being able to extract any useful information about
    the communication. In order to avoid the need of a secure communication channel,
    it is generally assumed that the eavesdropper is able to intercept the encrypted
    messages.


