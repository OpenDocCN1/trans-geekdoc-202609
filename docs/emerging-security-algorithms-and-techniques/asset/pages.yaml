  md: '# 13.7 Three-Pass Protocol


    Three-pass protocol (TPP) is a security mechanism which allows two parties to
    communicate without ever exchanging their secret keys before establishing communication,
    and it depends on commutative encryption (Abdullah, Khalaf, Riza 2015). In TPP,
    the message sender and receiver have encryption and decryption methods, respectively.
    These methods allow the message to be encrypted using two different secret keys
    and using the same keys to decrypt the message.


    In TPP, sender A encrypts the message using his own secret key and sends it to
    receiver B. Receiver B receives the message and encrypts it until sender A decrypts
    the message by his own secret key and sends it back to receiver A. After that,
    sender A decrypts the message by his own secret key where there is only one level
    of security and can read the plaintext of the message. Receiver B decrypts the
    message by his own secret key and reads it. This kind of security mechanism can
    be performed if the commutative cipher or Last-In-First-Out (LIFO) method is used
    (Siahaan 2016). The above security procedure is explained in Figure 13.4.


    # 13.7.1 Shamir''s Three-Pass Protocol


    It is one of the various cryptography protocols that permit the communication
    with no need to exchange the secret keys in advance. This cryptography protocol
    ensures the secure communication where the hackers cannot modify or manipulate
    the message during transmission from the sender to the receiver. Both parties
    of communication (sender and receiver) must have a cipher system for secret keys,
    which has a commutative property of encryption function $E_{K1}(E_{K2}(X)) = E_{K2}(E_{K1}(X))$,
    where $X$ is a plaintext and $K_1$ and $K_2$ are secret keys. In this double encryption
    process, the result will be the same whether the encryption is started by the
    first or second party. Shamir''s TPP is explained in the following (Figure 13.5;
    Lang 2012):


    ![](img/5ee0cf067ac8390dfbbfeae8da2f7512_232_0.png)


    FIGURE 13.4

    TPP authentication process.'
