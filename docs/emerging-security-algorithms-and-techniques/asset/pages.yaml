    # 4.2 Discrete Logarithm Problem in Subgroup of Zₚ


    Discrete logarithm has a tendency to be associated with the multiplicative cyclic
    group. If g is the generator of multiplicative group G, then every element e in
    G can be written as gʸ for some y. The DLP has basically three important parts:
    a group G, a generator g, and an element e to find the discrete logarithm to the
    base of e in the group G. For example, if group is Zₚ with generator 4, then the
    discrete logarithm of 1 is z=3. 4⁴≡1 mod 7. Calculation of the discrete logarithm
    is not always a tedious task. It depends on the group structure. Zₚ gives a better
    set of groups for discrete logarithm when p is a prime number. Calculation of
    4³ mod 7 is very simple and easy, but the calculation of its inverse or opposite
    for finding the logarithm is very difficult (Chiu, 2016). A system tries on each
    exponent=0, 1, 2, ... until the equation matches=[..., ..., P-1]. For example,
    generator α=3, modulus P=7,


