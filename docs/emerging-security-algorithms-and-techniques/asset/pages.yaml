  md: '216                                Emerging Security Algorithms and Techniques


    S/Sky mode is an OTP authentication which belongs to challenge-response mode (Haller
    1995). The idea of S/Sky mode is to assign an account to each user. Each account
    will have three parameters [seed, sequence number, and secret passphrase]. By
    using these three parameters, the system can generate a series of OTPs. The server
    is allowed to use each OTP only once to log in his account.


    In S/Sky mode, the OTP-calculating program will be set up in both client and server
    sides. Then, in time of login, the client will send his account to the server.
    The server will send back a client and sequence number. Then, the OTP-calculating
    program in client side will generate an OTP and send it to the server along with
    the challenge and secret passphrase. The OTP-calculating program in server side
    will also generate an OTP. Both OTP will be compared; if they are the same, then
    the user can log in to his account.


    # 13.4 Biometric Authentication Method


    Secure authentication methods are gaining more attention from research to secure
    access to various applications. Companies apply several types of biometric authentication
    method to ensure the authentic access to their applications. Every application
    requires a different type of biometrics depending on the security of it and needs
    the type of biometric it suits: for example, to prove your attendance in the organization
    you work with, you have to have a fingerprint biometric; to enter the military
    lab, you have to have a palm biometric; and to identify you, you may need to use
    a retina biometric.


    The PIN of ATM cards and password can be easily observed by an intruder. The intruder
    observes the PIN and password, he can easily access to the user account, and the
    system cannot identify that he is the intruder, and this is one of the PIN and
    password limitations. In this case, biometric authentication provides more reliable
    and accurate security to users and called "something unique about the user" or
    something is user, like a fingerprint, face, iris, voiceprint, and so on. The
    biometrics cannot be shared, reputation unlike, forcing, and impossible to be
    disclosed, lost or stolen, and these are some features of biometric authentication
    (Ratha, Connell, & Bolle 2001).


    Biometric authentication is an authentication process that depends on the biological
    characteristics of the user to identify whether he is the one who claims to be
    or not. biometric system extracts the user biological characteristics and stores
    them in the database. The user inputs his biological characteristics into the
    system, the system compares both input and database-stored characteristics; if
    both are the same, then the authentication is confirmed and the user can access
    his account completely. Biometrics is used to manage the access process of physical
    and digital resources like computer devices, smartphones, cars, buildings, and
    apartments.


    Biometric measurements have two types of characters: physical characters (such
    as fingerprint, palm, retina, iris, and face characteristics) and behavioral characters
    (such as signature and face) (Liu & Silverman 2001).


