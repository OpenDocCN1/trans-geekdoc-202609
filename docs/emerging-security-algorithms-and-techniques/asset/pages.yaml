    # 14.10.2 Origin & Design Objective of BLAKE


    BLAKE was proposed by Jean-Philippe Aumasson, Luca Henrizen, Will Meier, and Raphael
    C.-W. Phan. It is somewhat based on the ChaCha Stream Cipher put forward by Dan
    Bernstein. The algorithm was developed in the NIST hash function competition for
