    \ and others (Alkin & Morain, 1993; Brent, 1986). For the general description\
    \ of ECM, refer to Brent (1996), Montgomery (1994), and Silverman and Wagstaff\
    \ (2003).\n\n# 5.3 General-Purpose Algorithms\n\nIn this section, we will focus\
