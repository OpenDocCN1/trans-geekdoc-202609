    # 14.1 Introduction


    One of the most complex areas of cryptography is authentication of message. Message
    authentication works in three different modules. The first module is about key
    generation; the second module is the algorithm, which takes the key and message
    as input and produces MAC; and the third module requires an algorithm, which will
    be used for validation, a verifying algorithm, which verifies the MAC at receiver''s
    end. Cryptographic Hash functions take a message as input and produces a value
    that is called hash, which is used to validate message integrity. MAC and cryptographic
    hash functions have little in common but they possess certain security requirements.
    MAC at one end ensures authentication while hashing ensures integrity. But MAC
    and hashing can be combined to ensure both authentication and integrity.


    In this chapter, we will focus on methods used to calculate message authentication
    codes and hashing algorithms. The technology/technical terms used in the chapter
    are explained wherever they appear or at the “Key Terminology & Definitions” section.
    From regular References, Additional References will be included in the “References
    for Advance/Further reading” for the benefit of advanced readers.


    Hash functions play the core role in message authentication where hash functions
    are iterative algorithms that operate in an arbitrary length message and produce
    a fixed-length output. There are several different algorithms that can implement
    the message digest as MD2, MD4, MD5, MD6, Secure Hash Algorithms 1 (SHA 1), SHA
    256, SHA 512, HMAC, and so on.


    MAC functions do possess security requirements. An MAC should be secure such that
    the attacker should not be able to guess MAC without performing an impossible
    amount of computation. MAC values are generated and verified by same secret key
    and hence it is different from digital signature which means that the start of'
