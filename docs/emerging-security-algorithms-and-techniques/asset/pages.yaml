    \ Number Field Sieve\n\nNFS is used in public key cryptosystem. For factoring\
    \ a large integer greater than 100 digits to produce a group of prime numbers,\
    \ developed by Pollard (Stehenhagen, 2011). It is also called general NFS and\
    \ later version of special number sieve. It is most similar to the quadratic sieve\
    \ algorithm. It was primarily used to factor RSA-130. It has the complexity over\
    \ $O(\\exp(\\log n)^{1/3}(\\log \\log n)^{2/3})$. This algorithm basically consists\
    \ of five steps depending on each (Briggs, 1998, 2008).\n\n+   a. Taking composite\
    \ number $N$ without a small factor.\nb. Selection of polynomial: $f(x)$ is the\
    \ major and open problem for NFS. The purpose of this step is to select the best\
    \ polynomial $f(x)$ from a large group of possible polynomials such as $f_a, f_b$\
    \ with the common root $m$ modulo $N$ in the homogeneous form: $b^{\\deg f_a}f_a(a/b)\
    \ = f_b(a,b).\nc. Factor bases: It chooses the base for the sieving step as\n\
    RFB: $(p_w p_0 \\pmod m), (p_w p_1 \\pmod m), (p_w p_2 \\pmod m), \\dots$ and\n\
    AFB: $(p, r_0), (p, r_1), \\dots$ such that $f(r) \\equiv 0 \\pmod p$.\nd. Deiving:\
    \ It finds the relationship $(a,b)$ where both homogeneous polynomials $[F_a,\
    \ F_b]$ are smooth for the values $k=1, 2$. It is normalized and gives out $gcd(a,b)=1$\
    \ $0 < b$. The $b^{\\deg f_a}f(a/b)$ is smooth over AFB and is polynomial, $m\
    \ \to f(m)=0 \\pmod n.\ne. Linear algebra and matrix creation: It gathers the\
    \ elements that are fully square product from the relation set.\nf. Square root:\
    \ It finds the algebraic and relational square root from the matrix to obtain\
    \ the solution.\n\n# 4.7 Pohlig-Hellman Algorithm\n\nThis algorithm is used to\
    \ compute prime factorization of $N$ and group order in DLPs discovered by Ronald\
    \ Silver. It was first published by Pohling and Hellman in 1978. This is applicable\
    \ only when $(P-1)$ has small factors where $P$ is a prime number. It computes\
    \ the discrete logarithm to find $x$ such that $\beta = \\alpha^x$ $0 \\le x \\\
    le P-1$. The worst-case time complexity of this algorithm is $O(\\sqrt{n})$ (Mihalik,\
    \ 2010; Wong, 2016; Pohlig & Hellman, 1978).\n\n# Algorithm\n\nIt finds the value\
    \ of $z$ such that $x^2 \\equiv y \\pmod p$ using the following steps:\n\n+  \
    \ 1. Compute the factor of $P$ in the group as $q(P) = P_{\nu_1} P_{\nu_2}, P_{\n\
    u_3}, \\dots, P_{\nu_n}$.n2. Assume $q(P) = P_1 * P_2$ and take $z = x_0 + P_1x_1$."
