    # 16.8.4 Requirement for Security


    +   1. Network availability: Even in adverse condition of DOS attacks, the network
    flow must be available so as to ensure uninterrupted transmission.


    +   2. Authorization: The sensors which are authorized by known sources will only
    be allowed in the network System to interact in CPS.


    +   3. Authenticity: Network nodes must be of their truthfulness so as to prevent
    any unidentified and unscrupulous user to interfere with the network system.


    +   4. Encryption: Mechanism of the well-designed algorithm must be followed which
    cannot be deciphered by anyone other than the intended user; in other words, the
    data must be confidential.


    +   5. Integrity: It ensures that the data are untouched or unmodified by the
    third unknown malicious user via the intermediate nodes.


    +   6. Non-repudiation: Node should be able to send data which it had earlier
    transmitted that is non-denial of sending a message which it had previously sent
    (Tausif, Ferzund, Jabbar, & Shahzadi, 2017).


