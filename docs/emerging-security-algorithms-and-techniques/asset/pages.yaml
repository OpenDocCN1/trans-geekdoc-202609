    # 10.3.5 Public-Key Encryption with Keyword Search (PEKS)


    Boneh, Di Crescente, Ostrovsky, and Persian describe a keyword-search scheme with
    public-key encryption (PEKS) which helps the user in searching for the encrypted
    keywords in the messages (Boneh, Gentry, & Waters, 2005).


    **Example:** User Alice, who is an employee in an XYZ company, is on a vacation
    for a few days and has a smartphone in which she reads all her emails. During
    the vacation she only wants to read the important emails. With a smartphone, she
    also has Laptop and Desktop.


    The mail gateway of Alice sends emails to the particular device according to the
    keywords in the email(s), such as when the sender, Bob, sends an email with the
    keyword “Hi” to the desktop, “urgent” to the smartphone and “Read” goes to the
    laptop.


    To get the messages by selection of her important emails, Alice will send a “trapdoor”
    to the server to enable the selection. When Bob sends a mail using PEKS schemes
    in which PEKS ciphertext contains keyword “urgent,” the email will appear to the
    smartphone of Alice. Security is ensured to her as all the emails of her will
    be encrypted using her public key.'
