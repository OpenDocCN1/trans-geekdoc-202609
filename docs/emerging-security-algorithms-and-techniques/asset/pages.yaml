  md: '# Emerging Security Algorithms and Techniques


    # 6.4.1 How plain text undergoes an initial permutation in which the 64-bit plain
    text


    The input plain text undergoes an initial permutation in which the 64-bit plain
    text is interchanged (bit position interchange). The permuted text is then passed
    to a series of 16 rounds with different keys. The different keys generated for
    these 16 rounds are generated from the same 48 bits of the key, which is then
    permuted in a unique way to generate the 16 keys for 16 rounds. The output of
    the 16th round is permuted again, i.e., a reverse of initial permutation is done
    to get the final result (ciphertext) (Figure 6.4a).


    # 6.4.2 What Happens in Each Round?


    The 64-bit plain text is divided into two blocks of 32 bits: right and left halves
    (Figure 6.4b). The fundamental operations on the information are enveloped into
    what is alluded to the cipher text and marked as $f$. This function takes two
    distinct inputs of size 32 bits (right half) and 48 bits (key) and yields a solitary
    32-bit number. Different operations are performed on data and key in a parallel
    fashion


    The 32-bit value generated by function $f$ is XORed with 32 bits (Left half) and
    is given as input (right half) to the next round. The left half for next round
    is simply the right half (unchanged-32-bit sequences) from the previous round.


    # 6.4.3 The Feistel Function ($f$)


    The Feistel function comprises of four stages and typically operates on 32 bits
    at one point of time as shown in Figure 6.4c.


    +   1. **Expansion:** In this stage, the 32-bit block is widened to 48 bits with
    the help of an expansion permutation. The generated output comprises of 8 chunks
    with each chunk 6 bits. Out of these six bits, four bits (central) bits


    ![](img/5ee0cf067ac8390dfbbfeae8da2f7512_100_0.png)


    **FIGURE 6.4** (a) DES structure. (b) A single round. (c) The Feistel ($F$) function.'
