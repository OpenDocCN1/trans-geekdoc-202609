    # 15.3.1 Signature Generation and Verification Algorithm


    # 15.3.1.1 ECDSA Key Generation


    Let''s assume that Ram wants to sign a message to Sham. For successful execution,
    we must agree on the curves (CURVE, B, n). We need field, equation of the curve
    and B (which is a base point of prime order on the curve), n (which is the multiplicative
    order of point B) in order to generate ECDSA key. Lets an entity A, whose pair
    is related to a particular set of EC domain parameters Dom=(q, FR, a, b, n, h).
    Given E is an elliptic curve which is defined over Zq, the power of prime order
    n in E(Zq) is P. Every entity A does


    +   1. Choose a randomized integer r in the interval [1, n-1]

    2. Calculate rP and assign it to Q, i.e., Q=rP

    3. The public key of A is Q, and the private key of A is r (Figure 15.3).


    # 15.3.1.2 Signature Generation Algorithm for ECDSA


    Let m be a message, and we need to sign it. To do so, we need an entity A with
    parameters as Dom=(q, FR, a, b, n, h), and they are used as follows: k-1


    +   1. Choose a randomly generated integer k in the interval [1, n-1]

    2. Calculate xk, yk, r and assign it to kP, i.e., kP=xk, yk=r mod n (where xi
    is an integer between 0 and q-1). If r equals to zero, then go back to step 1.

    3. Calculate k raise to the power -1 mod n.

    4. Calculate k raise to the power -1|h(m)+dr| mod n and assign it to s=k¹|h(m)+dr|
    n, where h is the secure hash algorithm. Now, if s equals to 0, then go back to
    step 1.

    5. Pair of integers (r, s) is the signature for the message m (Figure 15.4).


