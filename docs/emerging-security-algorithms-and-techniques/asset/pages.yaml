    # 15.1 Introduction


    As the world is moving away from paper documents and signing them manually with
    ink and stamps, digital signatures can provide with assurance to authenticity,
    integrity, and nonrepudiation. A digital signature comprises three main algorithms:
    a key generation algorithm which selects a key randomly from a pool of private
    keys, a signing algorithm which is responsible for signing the document with the
    help of private key, and a signature verifying algorithm. The real concept behind
    digital signature is to avoid paper and keep the data secure in electronic format.
    Digital signature uses an accepted and standard format like Public-Key Infrastructure
    (PKI). There are various certifying authorities that are responsible for signing
    digital signature. Technically binary blocks of digital signatures are attached
    to a document or a message to prove signer''s authenticity. This helps in reducing
    various cyber-attacks like Man-in-the-Middle attack, eavesdropping, etc. It also
    ensures that nonrepudiation is maintained for the author. Digital signatures have
    various other benefits, like message-wide authentication. This protects against
    the insertion of a skewed block in a message or document body by an attacker.
    Another benefit is the integrity of message, which confirms that a message has
    not been altered or modified during a communication. Choosing the method of digitally
    signing a digital document or a message is more like making a business decision.
    That is, the viability, vitality, and durability factors of a document have to
    be taken into consideration before choosing a scheme of signature. Digital users
    can range from simple consortium or traders. Digital signatures exist for legal
    reasons. We have long been able to send documents electronically. However many
    documents must be signed in legal proceedings. Until recently, the legality of
    electronic signatures sent with documents was uncertain. This is the digital signature,
    if the sender encrypts (s) a message with his or her private key. If this digital
    signature can be verified with the true party''s public key provided by a digital
    certificate from a reliable authority, the only rational basis for nonrepudiation
    is that the true party''s private key was stolen. Similarly, if someone falsely
    claims that a person signed a contract, a digital signature will prove that assertion
    false because verification with that person''s public key will fail. Consequently,
    although many forms of electronic signature are permitted by law, only digital
    signatures provide strong legal protections.


    Before going into further details, a brief understanding of digital signature
    is necessary. A digital signature scheme typically consists of the following three
    distinct procedures:


    +   1. Key generation

    2. Signature generation

    3. Verification of signature.'
