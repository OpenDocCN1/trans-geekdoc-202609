    # 15.3.3 Comparison with RSA and DSA


    Two types of operations are difficult to perform in most of the cryptographic
    systems. One is traceable (Gupta et al., 2004) which is known as forward operation,
    and the other is not-traceable which inverse operation. The two operations differ
    on the basis of key pairs. The inverse operation is exponentially proportional
    to the key size, whereas forward operation is linearly proportional. The complexity
    of both the operations increases if we increase the key length. Thus, ECC is preferred
    because the security in it is at the same level of 160-bit key length as 1,024-bit
    key length in RSA.


    # 15.3.3.1 Comparison with RSA


    +   - ECC takes full exponential time, whereas RSA takes subexponential time.
    For example, ECC takes 9 × 10¹¹ MIP years for the best-known attack, whereas RSA
    takes 3 × 10¹¹ years for 1,024-bit key size.

    - For smaller key sizes, ECC behaves with the same level of security.

    - In ECC, data size is larger than RSA.

    - Key size and data size are functions for the encrypted message. In RSA, key
    size is larger as compared with ECC; this results in a smaller encrypted message
    in ECC.

    - In comparison with RSA, computational power is less in ECC.


    # 15.3.3.2 Comparison with DSA


    +   - Signing equation is mentioned below and is the same for both DSA and ECC.
    Also, both algorithms are based on ElGamal signature scheme.


    ```

    s = k⁻¹[h(m) + dr] mod n.

