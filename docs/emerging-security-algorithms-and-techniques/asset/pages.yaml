    # 16.6 E-mail Security


    E-mail security can be regarded as being relied solely on SMTP. It provides the
    certain extent of security but not many features which concerns hackers and malicious
    users to send e-mails containing viruses. Mail system was the primitive method
    to communicate with the net; it developed another kind of stress of receiving
    and phishing e-mails as it is used as a weapon for hackers and attackers, so it
    is most important to eliminate threats and ameliorate the measures to secure e-mail
    systems (Banday, 2011).


    # 16.6.1 Simple Mail Transfer Protocol


    It is the protocol which was originally designed for communication happening between
    small groups. Initially, no security was provided, but after experiencing some
    breaches, the changes were incorporated in protocols, accompanied by technological
    advancements (Banday, 2021) (Figure 16.9).


    The changes included reducing the size of the e-mail, filtering, verification
    of header, machine learning for filtering SPAM, and meticulous mails. SMTP is
    regarded as the standard protocol for sending and receiving e-mails. Some security
    issues faced by SMTP security and integrity. Since date of e-mails are not decrypted,
    it is present in the plain-text form (Jin, Takabi, & Joshi, 2010).


    # 16.6.2 Threats


    +   1. SPAM: It is also called as junk. Such e-mails mostly contain viruses and
    malicious links. Sometimes just by opening the mail, it is recommended to not
    open such e-mails which are unaware of what a mail contains; which are from unknown
    recipients. Many steps have been taken for filtering e-mails which filter suspicious
    senders'' mail getting into the inbox (Kamthe & Nalawade, 2015).

    2. Viruses: Virus is the high-risk destroyer that can enter into the system through
    e-mails. Some virus example can be of the pop-up e-mails on our screen; now, it
    is rare to see pop-up e-mails. The threat hovering over our e-mails can be injected
    into our known recipient e-mails and also through our SPAM e-mails.


