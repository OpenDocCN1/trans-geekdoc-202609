- pgno: 7
  md: '# Preface


    Security is pervasive. It is estimated that 3.3 billion mobile phone users are
    registered worldwide, which is more than half of the global population. Most of
    the mobile phones are built-in with Bluetooth, Wi-Fi, cameras, sensors, and many
    other components. Hence, digital security is no longer limited to scholarly community
    but is now the concern of all users of computers worldwide. As e-commerce and
    electronic transactions have grown exponentially, the development of secure systems
    has also increased rapidly to protect the digital world against adversaries, giving
    rise to a vast number of applications of emerging security algorithms, and more
    applications are developing in proportion to the increasing development and usage
    of smartphone technology, online banking, m-commerce, share market, cloud computing,
    etc.


    This book covers symmetric, asymmetric and post-quantum cryptography algorithms,
    and their modern applications in developing secure systems, viz. digital signature,
    entity authentication, message authentication, cyber security, web security, cloud
    security, smart card technology, and CAPTCHA. The book has been structured well
    with simple explanations and illustrations. In other words, this book is designed
    to support students who are studying computer science and engineering, information
    technology, electronics and telecommunication scientists and engineers at undergraduate
    and postgraduate levels and teachers who working in the field of digital security.
    This book is written with aims to bring out a new paradigm for learning emerging
    security algorithms and techniques.


    This book is organized in 17 chapters. Each chapter covers the following important
    topics in brief: modular arithmetic, finite fields, prime numbers, discrete logarithm
    problems, integer factorization problems, symmetric algorithms, asymmetric algorithms,
    post-quantum cryptography, identity-based encryption, attribute-based encryption,
    message authentication, digital signatures, applications, and hands-on on “SageMath."'
