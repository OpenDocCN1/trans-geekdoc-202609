    # 15.4 Identity-Based Signature


    # 15.4.1 Introduction and Definition of ID-Based Signature


    Identity-based signature (IBS) scheme is an open problem which is based on the
    difficulty of factoring integers. In 2001, two schemes were launched: one by Cocks
    (Cocks, 2001) whose base was quadratic residuosity problem and the other by Boneh
    and Franklin (Boneh & Franklin, 2004) which was based on the bilinear Diffie–Hellman
    problem with respect to a pairing, e.g., the Weil pairing (Yi, 2003).


    Initially, the Weil pairing (Miller, 2004) was not having a good image in cryptography.
    It reveals that by using the Weil pairing, discrete logarithm problem in super-singular
    elliptic curves was reducible to that in a finite field. That resulted in dropping
    out of supersingular elliptic curves from cryptographic usage. The situation changed
    entirely by Roux''s work, which used a simple tripartite Diffie–Hellman (Bellare
    et al., 2003) protocol based on the Weil pairing on super-singular curves. Soon
    after Roux''s pair, a number of other applications were released, including a
    general signature algorithm and an identity-based encryption scheme.


    The Weil pairing and other IBS schemes are also used by an identity-based public-key
    signature algorithm.


    IBS scheme is a collection of the following algorithms:


    Setup—In this algorithm, a secret parameter is taken as an input by a master entity,
    and the output is generated in the form of public parameters related to a master
    secret and scheme. The parameters are published by the master entity, and the
    master secret is kept by itself.


    Extract—The algorithm generates the private key $d_u$ of $u$ if an identity $u$,
    master secret, and parameters are given as input. This private key is then used
    by the master entity to generate private keys for all participating entities,
    and then private keys are distributed to their owners, respectively, to secure
    a secure and safe channel.


    Sign—This algorithm generates the signature $\sigma$ of identity $u$ on $m$ if
    a message ($m$), an identity $u$, a private key $d_u$, and parameters are given
    as input. The identity $u$ with entity uses this algorithm for signing purpose.


    Verify—This algorithm gives output and will accept if signature $\sigma$ is a
    valid signature on $m$ for identity $u$, and reject the output otherwise where
    a signature $\sigma$, a message $m$, an identity $u$, and parameters are given
    as inputs.


    Let''s have a look at some notation. Bit strings are denoted as $a_1, ..., a_n
    || a_n$ is denoted as $a_1, ..., a_n$ which will be used to reconstruct the constituents
    objects. $|a|$ denotes the length of a string ''$a$'', and $|S|$ is the cardinality
    of set S. For as a random algorithm, $y \leftarrow A(a_1, a_2, ...)$ implies that
    $A$ has inputs $a_1, a_2, ...$ and the output of $A$ is assigned to $y$ when it
    runs on a random tape.'
