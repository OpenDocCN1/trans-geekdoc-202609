    \ P)^{\\alpha\beta}$\n\nMaster secret for BB, IBE,\n\n$\\alpha, \\beta, \\gamma\
    \ \\in \\mathbb{Z}$\n\n# 2. Extraction\n\nExtraction of private key\n\n+   a.\
