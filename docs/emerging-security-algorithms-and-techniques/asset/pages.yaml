  md: '# 10.3 Application, Extension and Related Primitives


    # 10.3.1 Identity-Based Signature


    The most basic primitive in the world of cryptography is the signature. As mentioned
    earlier in the chapter, every user has his/her own pair of keys: one is a public
    key, and the other is private or secret key (Boneh & Katz, 2005; Chatterjee &
    Sarkar, 2005).


    Public-key infrastructure (PKI) is a setup which is responsible for mapping the
    public keys to real-world identities like the name or email of the user. These
    keys are certified by the Certification Authority (CA) (Boneh, Lynn, & Shacham,
    2004). PKI requirements get simplified by IBS scheme as KGC (Key Generation Centre)
    distributes the corresponding private key that eliminates the PKI and certification
    costs.


    IBS uses public information say the user’s identity to verify the signature.


    # 10.3.1.1 Algorithms of IBS


    +   1. **Setup**: The master entity runs this algorithm on input $1^k$ to get
    master and a secret key pair $(mpk, msk)$. (Here, $k$ is a security parameter,
    which has its notation as $1^k$) (Boyen, Mei, & Waters, 2005).

    2. **Extract**: For the user ID,


    $ID \in \{0,1\}^*$


    This algorithm runs on the input of $mpk$ and $ID$ to generate private usk.


    +   3. **Sign**: This algorithm returns signature $\sigma$ of message $M$, on
    the input of $usk$ and $M$.

    4. **Verify**: Given $mpk, ID, M$ and signature $\sigma$. The algorithm verifies
    as it accepts if $\sigma$ is valid for $ID$ or it rejects it.


    *Correction*: Generating $mpk, M, Sign$ and,


    > $Verify(mpk, ID, M, Sign(usk, M))=1$


    for $k \in \mathbb{N}$ and $M \in \{0,1\\}^*$.


    For security, the IBS scheme is resistant to chosen-message attacks and adaptive
    identity attacks.


    # 10.3.2 Bone–Lynn–Shacham Scheme


    Authentication is a very important characteristic in cryptography. The signature
    scheme of Bone–Lynn–Shacham (BLS) in cryptography provides us with a service in
    which it verifies whether the signer is authentic or not. The BLS signature scheme
    is also known by the name of BL short-signature scheme (Boneh, Boyen, & Shacham,
    2004).


    In digital signature, short-signature schemes are easy to perform by a human as
    with long-signature schemes such as RSA and DSA.


    The long-signature schemes, RSA and DSA, have 1,024 bits long key, while BLS short-signature
    scheme has 170 bits long key. Their security level is the same as that of others.
    This BLS scheme is secure against existential forgery under a chosen-message attack
    (random oracle model), with taking assumption that the CDHP (computational Diffie-Hellman
    problem) is hard to solve.'
