    # Algorithm 14: Key Generation Algorithm


    Algorithm: Key Generation For Chaos-Based RSA


    Input: Null

    Output: Public Key, Private Key


    procedure keyGeneration():

    {

    p := Select a large random prime;

    q := Select another large random prime != p;

    N := p * q;

    phi := (p-1)(q-1);

    e := Select random integer such that 1<e<phi, and gcd(phi,e)=1;

    d := Multiplicative inverse of e mod phi;

    return PublicKey{N, e}, PrivateKey{d, N};

    }


    # Algorithm 15: Encryption Algorithm


    Algorithm: Encryption for Chaos-Based RSA


    Input: Receiver''s Public Key {N, e}, Input Message M

    Output: Encrypted Message


    procedure Encryption{N, e}, M:

    {

    Let MT_r(x) := T_r(x) mod N, the modified Chebyshev Polynomial of degree r;

    M'' := Represent M as an integer in range [1,N-1];

    C := MT_d(M'');

    return C;

    }'
