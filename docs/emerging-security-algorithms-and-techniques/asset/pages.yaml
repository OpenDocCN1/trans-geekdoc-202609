  md: "# Emerging Security Algorithms and Techniques\n\ngives $\\sqrt{n}=\\frac{Ap}{q}\\\
    left(1+\\frac{m}{Ap^2}\\right)$. As $\\frac{m}{Ap^2} \\ll 1$ so $\\left(1+\\frac{m}{Ap^2}\\\
    right)=1+\\frac{m}{2Ap^2}$ and hence $\\sqrt{n}=\frac{Ap}{q}-\frac{m}{2pq}$\n\n\
    Since $\\frac{m}{2pq} \\ll 1$, the following two approximations can be considered:\n\
    \n+   i. The integer part of $\\sqrt{n}$ is $\\left[\\sqrt{n}\\right]=\\frac{Ap}{q}\
    \ \\pm \\varepsilon$.\n\n+   ii. The fractional part of $\\sqrt{n}$ is $\\left(\\\
    sqrt{n}-\\left[\\sqrt{n}\\right]\\right)px=k \\pm \\varepsilon'$, where $k$ is\
    \ a positive integer or half-integer and $0 \\le \\varepsilon < 1$ and $0 \\le\
    \ \\varepsilon' \\ll 1$.\n\nTherefore, one can find $k$ by multiplying the fractional\
    \ part $\\sqrt{n}-\\left[\\sqrt{n}\\right]$ by $r=pq$. As $r$ is a small integer,\
    \ so if $k$ is found, one can easily find $p$ and $q$ using any of the factorization\
    \ methods. Then, multiplying the integer part $\\left[\\sqrt{n}\\right]$ by $\\\
    frac{P}{q}$ gives a number that is approximately equal to $A$. The algorithm is\
    \ presented below. We consider the factorization algorithm by Zalek and Haj-Boutros\
    \ (2011).\n\n# Algorithm\n\n**Input:** $n$: an integer to be factored\n$P$: a\
    \ list of subset of prime numbers\nUpr: a threshold indicating the highest $r=pq$\
    \ allowed\nHighstep: a threshold indicating the steps allowed to find a solution\n\
    \n**Output:** $A$ and $B$, two integer factors of $n$.\n\n```\nbegin\nInitialization;\n\
    $\\varepsilon:=0.02, r:=2, steps:=0$;\nfx:=\\sqrt{n}-\\left[\\sqrt{n}\\right]$;\n\
    Iterate until finding factors or reaching the threshold specified for $steps$;\n\
    repeat\n  while ($r < upr$ AND $fx \\times r \\neq \\left[fx \\times r]\\right\
    \ \\pm \\varepsilon$) do\n    find a possible multiplier of $fx$ which generates\
    \ its nearest integer;\n    steps:=steps+1$\n    factor $r$ into $p$ and $q$;\n\
    \  $A:=\\left[\\sqrt{n}\\right]\\times\\frac{P}{q}$;n  if $A$ is not a divisor\
    \ of $n$ then\n    find in $P$, the nearest value $P_n$ to $A$;\n    $A:=\\gcd(P_{i-2}\
    \ \\times P_{i-1} \\times P_i \\times P_{i+1} \\times P_{i+2}, n)$;\nuntil $A$\
    \ is an integer divisor of $n$ OR $Highstep$;\n```"
