    # 11.6 Conclusion


    As discussed in this chapter, ABE is one of the genres of public key cryptography
    in which the identity is defined as the set of the attribute rather than an atomic
    value. In ABE, the public key and the master key are according to the set of attributes
    and are pre-defined, and if the user-defined attributes not match, the authority
    re-generates the master key and the public key. ABE is collision resistant, and
    the decryption operation of ABE requires a more convoluted approach to control
    the access, and hence, it makes ABE more secure. We conclude that the two schemes
    of ABE, (i) KP-ABE and (ii) CP-ABE, include some properties: (1) the attributes
    are encrypted in these schemes; (2) a public key, a private and a random polynomial
    are allotted with each attribute, so that the data cannot be recovered by any
    other user by using their combination of attributes and therefore, no attack occurs;
    and (3) the access protocol accommodates a Boolean formula that includes flexibility
    in controlling user''s access.


