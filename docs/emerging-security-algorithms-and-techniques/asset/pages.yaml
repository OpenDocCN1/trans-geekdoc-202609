  md: '# Modular Arithmetic


    The following are main steps of the algorithm:


    +   1. Set the value of the variable $c$ to the larger of the two values $a$ and
    $b$, and set $d$ to the smaller of $a$ and $b$.

    2. Find the quotient and the remainder when $c$ is divided by $d$. Call the quotient
    $q$ and the remainder $r$. Use the division algorithm and expressions for previous
    remainders to write an expression for $r$ in terms of $a$ and $b$.

    3. If $r=0$, then $gcd(a,b)=d$. The expression for the previous value of $r$ gives
    an expression for $gcd(a,b)$ in terms of $a$ and $b$. Stop.

    4. Otherwise, use the current values of $d$ and $r$ as the new values of $c$ and
    $d$, respectively, and go back to step 2.


    # 1.8.4.1 Examples


    +   1. Find the $gcd$ of 81 and 57 by the Euclidean algorithm:


    81 = 1(57) + 24

    57 = 2(24) + 9

    24 = 2(9) + 6

    9 = 1(6) + 3

    6 = 2(3) + 0


    Now if the $gcd(a,b)=r$, then there exist integers $p$ and $s$ such that


    $$p(a)+s(b)=r$$


    We find values of $p$ and $s$ by reversing the steps in the Euclidean algorithm
    by starting with the next to last line of above example:


    $$3=9-1(6)$

    $$3=9-1(24-2(9))=3(9)-1(24) \quad \text{As } 6=24-2(9)$

    $$3=3(57-2(24))-1(24)=3(57)-7(24) \quad \text{As } 9=57-2(24)$

    $$3=3(57)-7(81-1(57))=10(57)-7(81) \quad \text{As } 24=81-1(57)$$


    Thus, we have $p=-7$ and $s=10$.

    By using the above procedure, we find that 3 is a $gcd$ of 81 and 57 and 3 is
    a linear combination of 57 and 81.


