    # 15.2 ElGamal Signature Scheme


    # 15.2.1 Introduction to ElGamal Signature Scheme


    The ElGamal digital signature scheme was introduced by ElGamal (ElGamal, ElGamal,
    1985). Since then, a lot of work has been done in advancing the proposed algorithm.
    For example, the US National Security Agency (NSA) introduced a variant known
    as digital signature algorithm (DSA) standard which was widely used digital signature
    standard (DSS) and adopted it as FIPS 186 in 1994 (FIPS PUB 186, 1998). Four revisions
    to the initial specification have been released: FIPS 186-1 in 1996 (FIPS PUB
    186-1), FIPS 186-2 in 2000 (FIPS PUB 186-2, 2000), FIPS 186-3 in 2009 (FIPS PUB
    186-3, 2009), and FIPS 186-4 in 2013 (FIPS PUB-186-4, 2013). ElGamal Signature
    scheme is not used as its proposed form. However, its variants like DSS (FIPS
    PUB) (Schnorr, 1991; Boneh, 2011) were used extensively by agencies.

    The ElGamal signature scheme is based on an arithmetic modulo a p. In fact, it
    was the first to use modular arithmetic. The main reasons for its low use/popularity
    are due to its larger signature size and longer computation time. As RSA (Rivest
    et al., 1978) thrives on the difficulty of factoring large integers, ElGamal signature
    scheme drives over the difficulty of computing discrete logarithms.


    # 15.2.2 Signature Parameters of ElGamal Signature Scheme


    The ElGamal was designed using discrete logarithms. One of the core parameters
    in the process of building signatures is a large prime number, which ensures that
    the discrete logarithms modulo p is computation. Another parameter $a$, such that
    $a < p$ is a congruence modulo $p$ generator, is also to be known to the system
    at everyone. Also in many variants, there will be a collision-resistant hash function
    $h$ which will be used to hash the message before making the signature. More parameters
    will be discussed after the next section.


    # 15.2.3 Key Generation and Signature Generation


    # 15.2.3.1 Key Generation


    ElGamal (1985) described key generation by computing the following:


    ```

    $y = \alpha^x \pmod p$$

    ```


    For a user $A$ signing a document $m$ such that $0 \leq m \leq p-1$, $X_A$ being
    the private key and $Y_A$ being the public key shared with all. can be said to
    be a triplet to all in the form $(Y_A, \alpha, p)$.'
