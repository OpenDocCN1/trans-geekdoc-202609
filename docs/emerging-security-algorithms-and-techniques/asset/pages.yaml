  md: '# Finite Fields


    # 2.2 Group


    A nonempty set G with binary composition * is called a **group** if the following
    conditions are satisfied (Bhattacharya, Jain, & Nagpal, 1999):


    +   1. $a*b \in G \forall a,b \in G$

    2. $a*(b*c) = (a*b)*c \forall a,b,c \in G$ (Associative law)

    3. There exists an element $e \in G$ such that


    $a*e=e*a=a \forall a \in G$ (Existence of identity)


    $e$ is called an identity element in G


    +   4. For each


    $a \in G$, there exists an element $b \in G$ such that

    $a*b=b*a=e$ (Existence of inverse)


    # 2.2.1 Examples


    +   1. Set $A=\{1,-1\}$ under the binary operation multiplication with identity
    1 and with $-1$ as inverse of $-1$, 1 as inverse of 1 known as self-inverse.

    2. Set $A=\{1,-1,i,-i\}$ under the binary operation multiplication is a group.
    Multiplicative inverse 1 and inverse $i$.

    3. $(I,+)$ is a group, with 0 as its additive identity and the inverse of $a$
    in $I$ is $-a \in I$.

    4. $(R,+),(Q,+)$ are groups.


    # Remark


    $(N,+)$ is not a group as the two conditions, namely existence of identity and
    existence of inverse, are not satisfied in $N$ under $+$.


    # 2.2.2 Cyclic Group


    A group is known as the cyclic group (Hazewinkel, 2001), if there exists an element
    $a \in G$ that generates all elements and each element of $G$ is expressed as


    $x=a^n=a \cdot a \cdot a \cdots a$ (n times)


    The element of $a \in G$ is called a generator of $G$ and $G$ is written as


    $G=\langle a \rangle$ or $G=(\langle a \rangle$.


    # Remark


    A group $\{G,+\}$ is cyclic, if there exists some element $a$ of $G$ such that
    each element $x$ of $G$ is expressed as follows:


    $x=na=a+a+a+\cdots+a$ (n times) for some integer $n$'
