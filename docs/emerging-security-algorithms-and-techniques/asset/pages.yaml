    scheme (Bernstein, 2011). BLISS is considered to be efficient in terms of computation,
    signature size, and security (Ducas et al., 2013).

    The BLISS scheme is based on lattice problems and rejection sampling from bimodal
    Gaussian distribution. The process hides the secret key $s$ with a small random
    $y$ by choosing $y$ from a narrow distribution and then performs acceptance-rejection
    (Casella et al., 2004) so that $s$ is not leaked when $y$ is added to it. Conceptually,
    the BLISS signs by drawing a sample $x$ from $g$ and is accepted with probability
    $f(x)/M_g(x)$, where $M$ is some positive real. The process is repeated until
    the sample is accepted. In the numerical analysis, rejection sampling is a basic
    technique used to generate observations from a distribution. It is also commonly
    called the acceptance-rejection method or "accept-rejection" and is a type of
    exact simulation method. The key generation, signature, and verification process
    are extracted from Ducas et al. (2013), as given in the following section (Figure
    15.8).


    # 15.5.1. Key Generation, Signature, and Verification Algorithms


    A ring $\mathbb{Z}_q$ is identified with the interval $[-q/2, q/2]\mathbb{Z}$,
    with $q$ being an integer and a general ring $R$ and $R_q$ a quotient ring $R/(qR)$
    such that $R_q = \mathbb{Z}_q[x]/(x^n+1)$, where $n$ is a power of 2 and $q$ is
    a prime number such that $q \equiv 1 \pmod{2n}$. Hoffman et al. proposed a ring-based
    public-key cryptystem NTRU. BLISS was proposed as an adaptation of NTRU (Hoffman
    et al., 1998) over SIS (Ajtai, 1996) which throws over the hardness of $R-SIS$
    with the $(q, n, m, \beta)$ problem defined in the same paper. For simplicity,
    an algorithm for $R = \mathbb{Z}[x]$ is presented in Ducas et al. (2013); however,
    it can be easily adapted for $R = \mathbb{Z}[x]/(x^n+1)$.


    The secret key is a (short) matrix $S \in \mathbb{Z}_{2q}^{m \times n}_{q}$ and
    the public key is a matrix $A \in \mathbb{Z}_q^{m \times n}_{2q}$ such that $AS
    = q_n (mod 2q)$. A hash function $H$ is modeled as an oracle that has uniform
    output in $B(n, k)$, the set of vectors of length $n$, and weight $k$ as in Fischer
    and Sterling (1996).'
