    # 10.1 Introduction to Identity-Based Encryption


    # 10.1.1 History of Identity-Based Encryption


    Adi Shamir, the Israeli cryptographer and co-inventor of RSA algorithm, introduced
    the concept of identity-based cryptography in 1984 (Shamir, 1979). The idea behind
    it is to lower the intricacy of cryptography system by using the unique identity
    of the user, such as name, email id, and mobile number, rather than digital certificates
    for encrypting the message (Shamir, 1985).


    For identity-based security (IBS) scheme, Shamir had already proposed the RSA
    function, but the problem of identity-based encryption (IBE) is not solved. In
    2001, two types of research, one on elliptic curves and pairings of Boneh and
    Franklin and the other on quadratic residues of Clifford Clocks, gave the solution
    to the IBE problem (Chatterjee & Sarkar, 2006).


    # 10.1.1 Cocks IBE Scheme


    Some of the main characteristics of the Clifford Clocks scheme are as follows:


    +   * The ciphertext consists of two characters ($c, \hat{c}$) in $\mathbb{Z}_n$,
    where $n=pq (p\equiv3 \pmod 4)$. These two characters $(c, \hat{c})$ are encrypted
    by the public key $R$ and $-R$, respectively. According to Jacobi, $R$ is 1. The
    message information is contained exactly by one $c$ and $\hat{c}$, so we can assume
    $R=r^2$ (Cocks, 2001).


    +   * Let $m$ be the encrypted message, $m \in {\pm1\}$,


    ```

    $m=t/n, \quad \text{where } t \leftarrow S_{\mathbb{Z}_n},\nlet c=t+R/t$

    ```


    +   * Decrypt with $2r+c$, if $r^2=R$. We know, $p \equiv3 \pmod 4$, ie., $(-1/p)=(-1/q)=-1$
    and, $R/n \Rightarrow (R/p)=(R/q)$, where quadratic residue is either $R$ or $-R$.
    So, the square root of $R$ is


    ```

    $r^2 = (R^{(n+5-p-q)/8})^2$

    ```


    ```

    $= (R^{(n+5-p-q-\\Phi(n))/8})^2$

    ```


    ```

    $= (R^{(n+5-p-q-n+(q-1))/8})^2$

    ```


    ```

    $= (R^{4/8})^2$

    ```


    ```

    $\pm R$.

    ```'
