    \ of the messages, respectively. The private key in the cryptsystem must be secret\
    \ by the participating entities, and the public key is announced publicly. Public\
    \ keys can be distributed in many ways or techniques to the communicating entities\
    \ for the secure communication to take place. Following are the ways for the distribution\
    \ of public keys.\n\n# 12.3.3.1 Public Announcement of Public Keys\n\nOne of distributing\
    \ the public keys to the communicating entities is through public announcement.\
    \ Public keys are announced publicly so that the entities who want to participate\
    \ in the communication use the public keys for their secure communication. In\
    \ this, the public key of each entity is announced in public forums, such as Internet\
    \ mailing lists and USENET newsgroups for the users to use for their communication\
    \ needs.\n approach is very simple and convenient to use, but it has one major\
    \ drawback. If the public keys of the communicating entities were announced in\
    \ public, it can be easily forged by some intruders (see Figure 12.1). The intruder\
    \ pretends to be one of the communicating entity, entity A, and sends its public\
    \ key to another entity, B. After receiving the key from the intruder, entity\
    \ B starts communicating with him assuming it to be entity A; by the time A discovers\
    \ the forgery, the intruder has already taken all the encrypted messages for him/her.\n\
    \n# 12.3.3.2 Public Available Directory\n\nPublic available directory is another\
    \ public-key distribution scheme in which publicly available dynamic directory\
    \ is maintained. The distribution and maintenance of the publicly available directory\
    \ are done by some trusted organizations or by some trusted entities (see Figure\
    \ 12.2). In this scheme, each entity registers a public key in the publicly available\
    \ directory maintained by the trusted authority. The trusted authority registers\
    \ the entity in the directory with its name and a public key, for any entity A,\
    \ the entry in the directory will be ($PK_A$) and at any point the entity may\
    \ replace the existing key with the new key if for reason key appears to be compromised\
    \ or used for a large amount of data. The authority updates or publishes the entire\
    \ directory to the public through circulated newspapers in hardcopy version or\
