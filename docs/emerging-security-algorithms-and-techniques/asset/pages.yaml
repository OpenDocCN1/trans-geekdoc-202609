    \ 155\n\n# ## 9.1 Introduction\n\nQuantum computing is a winsome field that deals\
    \ with theoretical computational systems (i.e., quantum computers) combining visionary\
    \ ideas of computer science, physics, and mathematics. It concerns with the behavior\
    \ and nature of energy at the quantum level to improve the efficiency of computation.\
    \ Initially, the idea of quantum computing is proposed after performing a quantum\
    \ mechanics simulation on a classical computer (Feynman, 1982). Up until then,\
    \ quantum computing was thought to be only a theoretical possibility, but research\
    \ over the last three decades has evolved to make quantum computing applications\
    \ a realistic possibility.\n\nOver the last three decades, public-key cryptystems\
    \ (Diffie-Hellman key exchange, RSA cryptosystem, the digital signature algorithm\
    \ [DSA], and elliptic curve cryptystems"
