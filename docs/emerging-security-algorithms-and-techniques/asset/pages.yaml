    It uses an algorithm to provide accessibility of the message to the person who
    is having the key to decrypt the message. The advantage of encryption is to provide
    security to the message in the system and when it is getting transmitted in the
    network, physically securing the whole network is difficult. The term encryption
    emerges from the Greek word “Kryptos” meaning hidden or secret. Thus, it is clear
    from the above meaning that encryption hides the data; it changes data into ciphertext
