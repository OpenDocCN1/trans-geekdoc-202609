    \n# 11.3.1 Introduction to KP-ABE Scheme\n\nIn 2006, Vipul Goy introduces the\
    \ KP-ABE scheme. In this scheme, the encrypted data are attached with the set\
    \ of descriptive attributes, and it also forms user’s private key access policy.\
    \ If this access design in user’s private key was announced by the encrypted data’s\
    \ attributes, the message can be decrypted by the user to obtain the plaintext\
    \ (refer to Figure 11.2).\n\nOver the data attributes, the users are authorized\
    \ with access tree-structure. The threshold-gate is defined as the node of the\
    \ access tree, and the leaf nodes are linked with the attributes. The user gets\
    \ the private key from trusted attribute authority, the policy in which it generates\
