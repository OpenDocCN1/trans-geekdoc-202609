  md: '# Post-Quantum Cryptography


    # 9.3.1.1 Disadvantages


    +   - Large key size: Public key is sizable. It consists of $2^{19}$ bits which
    can affect its implementation.


    +   - Low transmission rate.


    +   - It is asymmetric in bandwidth, i.e., the encryption does not commute with
    decryption.


    +   - Increase in bandwidth size due to lengthy encrypted message than the plaintext,
    which makes it vulnerable to errors.


    # 9.3.1.2 Security


    The McEliece public-key cryptosystem is considered to be quite secure. Its security
    depends on the thorough search on the key and decoding algorithm. The following
    are the two types of attacks on McEliece cryptosystem.


    # 9.3.2.21 Decoding Attacks


    This is due to decoding the ciphertext. If the attack becomes successful, then
    it is easy to recover the plaintext. It has been investigated that decoding ciphertext
    needs $2^m$ operations for a code of 1,024 length, 524 size, and 50 error-correcting
    ability (Loidreaux, 2000). Thus, the overall cost of decoding attack is based
    on the three parameters for code C: its size, length of code, and error-correcting
    ability. Consequently, the McEliece cryptosystem will be insecure as the computing
    power of system increases.


    # 9.3.2.22 Structural Attacks


    It is an effort to reconstruct the actual form of the code from the generated
    public key. In case of successful structural attack, the private key is recovered
    and the whole cryptosystem is broken. There is a need to scrutinize $2^{k}$ codes
    for the original McEliece cryptosystem of $n=1024$, $k = 524$, and $t = 50$. (Loidreaux
    and Sendrier, 2001) attacked the structure of McEliece encryption and disclosed
    the part of “weak” generator matrix G. Till now, the attacks have been attempted
    on its different variants.


    # 9.3.2 Niederreiter Cryptystem


    The concept of knapsack-type cryptosystem is proved by (Niederreiter, 1986) based
    on Reed–Solomon codes. It is equivalent to McEliece cryptosystem. It is different
    from McEliece cryptosystem in description of codes, i.e., Niederreiter uses parity-check
    matrix, whereas others use generator matrix. Later, it has been proved that Niederreiter
    cryptosystem is insecure using Reed-Solomon codes as Goppa codes (Sidelnikov et
    al., 1992). Many researchers proposed various cryptosystems as a modification
    to McEliece cryptosystem to shrink the size of its public key. however, they are
    proved to be insecure and ineffective compared to original McEliece cryptosystem
    (Table 9.3).


    It is noted that plaintext $m$ is illustrated as an C of original word as in the
    case of McEliece cryptosystem. It is helpful to design digital signature scheme.
    Moreover, its decryption part can be executed more efficiently than original McEliece
    cryptosystem. Thus, McEliece and Niederreiter cryptosystems are dual to each other
    using linear codes, i.e., parity-check matrix can be computed from the generator
    matrix and vice versa. if an attacker can decipher the code in McEliece, then
    he can easily decipher the code in Niederreiter cryptosystem and conversely.'
