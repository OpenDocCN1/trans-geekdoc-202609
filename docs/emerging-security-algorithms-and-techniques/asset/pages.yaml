    #  10.1.2 Brief Discussion on IBE


    IBE is a tool of public-key encryption which is used to overcome the major problem
    that is getting the receiver''s public-key authentication before the information/message
    being assigned to him/her by the sender (Chatterjee & Sarkar, 2006). In IBE scheme
    the public key can be any arbitrary string such as email address, name or dates.
    Let us take an example, Alice''s email id is alice@alice.com, which is her public
    key (Shamir, 1985). The Alice obtains the private key corresponding to this email-id
    from PKG. Bob uses alice@alice.com and some specification of the PKG to encrypt
    a message to Alice. Alice decrypts the message using her private key. In the future,
    for decrypting all the messages received by Alice, she will use this private key
    only (see Figure 10.1).


    #  10.1.2 Pros and Cons of IBE


    +   * PROS:

    * The encrypted message received by the recipient requires no certification as
    his identity in deriving the public key.

    * There is no need to revoke the key as expires automatically.

    * Automatically rendering information after a particular time and for future decryption
    enables postdating of messages.


    +   * CONS:

    * The sender and the receiver should have a secure path for exchanging messages
    and for imparting the private-key use from IBE server.

    * As some of the keys are initialized by IBE centralized server, the risk of disclosure
    increases.'
