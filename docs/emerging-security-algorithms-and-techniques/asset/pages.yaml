  md: "# Discrete Logarithm Problem\n\nalgorithm is to find k value satisfies Q=[k]P\
    \ through partitioning the group groups into three disjoint sets S$_1$, S$_2$,\
    \ S$_3$ having equal size. The iterative function is defined on the point T as\
    \ follows:\n\n```\n$f(T) = R \\oplus P$ if $T \\in S_1, f(T) = [2]R$ if $T \\\
    in S_2, f(T) = R \\oplus Q,$ if $T \\in S_3$\n```\n\nStarting with the point $T_i=[a_i]P\
    \ \\oplus [b_i]Q$ where $i=0$ and $a_i, b_i \\in [1, n-1]$, they are chosen randomly\
    \ to make the sequence $T_i$. The sequence of group is calculated as $a_{i+1}=(a_i+1)$\
    \ mod $n$ if $T_i \\in S_1, a_{i+1}=2a_i$ mod $n$ if $T_i \\in S_2, a_{i+1}=a_i$\
    \ mod $n$ if $T_i \\in S_3,$ and $b_{i+1}=b_i+1$ if $T_i \\in S_1, b_{i+1}=2b_i$\
    \ mod $n$ if $T_i \\in S_2, b_{i+1}=b_i+1$ mod $n$ if $T_i \\in S_3$. The total\
    \ number of points on the curve forming a cyclic group is finite. If $gcd(b_i,\
    \ n)=1$, the value is obtained as $k=\\log Q=(a_i-a_j)/b_j$ mod $n$ and matching\
    \ of the points is computed as $T_i \\Rightarrow [a_i]P \\oplus [b_i]Q=[a_j]P\
    \ \\oplus [b_j]Q$ (Teske, 1998).\n\n# 4.9 Pollard's Kangaroo Algorithm\n\nPollard's\
    \ Kangaroo algorithm is a variant of the rho algorithm discovered by J. M. Pollard\
    \ in 1978. It is also called Pollard's lambda $(\\lambda)$ algorithm and most\
    \ suitable to solve the DLP in arbitrary cyclic group. It has the complexity $O(\\\
    sqrt{\\omega})$, where $\\omega$ is upper limit it uses a different type of iterative\
    \ function, in which the multiplier is formed as $g^x$ and the point method is\
    \ used to detect the collision. Suppose a finite cyclic group $G$ with order $n$\
    \ generated by an element $a$ to find the discrete logarithm $x \\in Z_n$, such\
    \ as $a^x=\beta$. This algorithm allows us to find in the subset $[a, ..., b]\
    \ \\subset Z_n$ (Stein & Teske, 2001; Cheon, Kim, 2010).\n\n# Algorithm\n\n+ \
    \  1. Defining a pseudorandom map $f:G \\rightarrow S$, where $S$ is set of integers.\n\
    2. Choosing an integer N and computing the sequence of group element as $x_{y_0},\
    \ x_{y_1}, ...$, where $x_{y_0}=\\alpha$ and $x_{i+1}=x_i\\alpha^{(y_i)}$ for\
    \ $0<i<N-1$.\n3. Calculating $d=\\sum_{i=0}^{N-1}f(i)$ and observing $X_N=\\alpha^d$.\n\
    4. Computing the other sequence as: $y_0=\\beta, y_{i+1}=y_i\\alpha^{(y_i)}$ for\
    \ $0<y<N-1$ with corresponding sequence of integers $d_0, d_1, ...$ to check $d>c-b$.\n\
    5. Compare $x_n$ with $y_j$ to find the solution.\n\n# 4.10 Conclusion\n\nIn this\
    \ chapter, we have presented the general DLP in the finite cyclic group $G$ and\
    \ acquainted the different algorithms with a brief introduction to solving DLP.\
    \ The different types of algorithm to solve DLP describe the importance of DLP\
    \ in cryptography. The complexity of DLP is same as the factorization problem."
