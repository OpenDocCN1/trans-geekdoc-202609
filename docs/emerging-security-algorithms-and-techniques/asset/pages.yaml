    # 15.6 Merkle Signature Scheme


    Merkle signature scheme is another post-quantum computing signature scheme proposed
    by Ralph Merkle in 1979 (Merkle, 1979). In his thesis, he described a digital
    signature that is pre-certified in the sense of the certified underlying encryption
    methodology. The paper proposed a method converting any one-time signature (like
    Lamport''s) into a convenient multiple-time signature system. The basis of the
    need of multiple time signature as comprehended in various papers (Merkle, 1987;
    Merkle, 1990; Bindel et al., 2016; Merkle, 1979) is considering the following
    scenario: If A transmits his public key Z to B every time before signing his document,
    B is not having Y previously then anyone can create a C and claim to be A. If
    B can be tricked in this way making him believe he had received a properly authorized
    signature then some must be able to confirm that he sent the correct Y and not
    a forged Y. This has to be done with every message $m$. That is, for every message
    $m$, needs to be authenticated each time. A solution for this was proposed as
    "Tree Authentication" in various papers (Merkle, 1987; Merkle, 1996; Bindel et
    al., 2016) and later Merkle also elaborated the Tree Authentication-based Signature
    Scheme in 1990 (Merkle, 1990).


    The Merkle tree signature scheme key generation, signature, and verification are
    described below.


