  md: "# Emerging Security Algorithms and Techniques\n\nTo find out the values of\
    \ the given numbers $X_b$ and $X_\\mu$ use the divide-and-conquer method (Stein\
    \ & Teske, 2005; Kameswari, Surendra, & Ravithe, 2016).\n\nBeta step. Computing\
    \ and storing all values $a^{xb}$ for $0 \\leq X_b \\leq m$. Giant step. Checking\
    \ $X_{xb}$ for $0 \\leq X_b \\leq n$ if it matches with $a^{xb}$ as $\beta(\\\
    alpha^{-m})^{X_{xb}} = a^{xb}$\n\n# Algorithm\n\nLet a generator $a \\in Z_p^*$\
    \ thus $\beta \\in Z_p^*$.\n\n+   Step 1. Calculate $m = \\lfloor\\sqrt{n}\rfloor$\n\
    Step 2. Construct a hash table to store the pair $(X_\\mu, a^{X_\\mu})$ for $0\
    \ \\leq X_\\mu \\leq m$.\nStep 3. Calculate alpha inverse: $a^{-m} = (\\alpha^{-1})^m$\
    \ using the extended Euclidean algorithm also store the Beta value into lambda\
    \ as $\\lambda := \beta$\nStep 4. Perform loop operation such that:\n\n+   For\
    \ all $i$, where $0 \\leq i \\leq m - 1$ and check\nIf $\\lambda = a^i$ in the\
    \ table, then return $X_i m + X_b$ and stop.\nEnd return $\\lambda := \\lambda\
    \ a^{-m}$\n\n# Example\n\nTo find $log_a^x$ in the cyclic group $Z_{23}$.nThe\
    \ number 23 is a prime number, and the exponents in this group are $Z_{23}^*$\
    \ = [1, 2, ..., 22].\n\n+   Step 1. Calculate $m = \\lfloor\\sqrt{n}\rfloor =\
    \ [\\sqrt{23}] = [4.7958] = 5\nStep 2. Constructing a table for entries that are\
