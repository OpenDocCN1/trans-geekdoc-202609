  md: '# 1.6 Linear Congruence


    The standard form of the linear congruence is as follows:


    ```

    ax \equiv b(mod m)

    ```


    where $a, b,$ and $m$ are positive integers and $x$ is a variable (or integer)
    which is called linear congruence (Hall & Keynes, 2015).


    # Examples


    +   a. $56x \equiv 1(mod 93)$

    b. $15x \equiv 12(mod 57)$, etc.


    # 1.6.1 Solution of Linear Congruence


    +   1. A linear congruence $ax \equiv b(mod m)$ has a solution if and only if
    $(a, m)|b$.

    2. We can solve linear congruence by finding modular inverses, using the Euclidean
    algorithm, and by turning the congruence into a linear Diophantine equation.


    # Remarks


    If a linear congruence $ax \equiv b(mod n)$ has a solution, then there are always
    infinitely many solutions, because $x0$ is a solution, then $x0+kn$ is also a
    solution for any integer $k$. Mod $n$, we can always assume that $0 \leq x0 \leq
    n-1$ (Hall & Keynes, 2015).


    # 1.7 Prime and Relative Prime Numbers


    # 1.7.1 Prime Numbers


    A prime number is a positive integer with exactly two positive numbers. If $n$
    is prime, then its only divisors are 1 and $n$ itself. A number is called composite
    if it is greater than 1 and is the product of numbers greater than 1.


    Or An integer $n$ is called prime if $n > 1$, and if the only divisors of $n$
    are 1 and $n$, if $n > 1$ and if $n$ is not prime, then $n$ is called composite
    (Apostol, 1976).


    # Example


    The following are some of the prime numbers, as there are infinite prime numbers:
    2, 3, 5, 7, 11, 13, 17, 19, ...


    # 1.7.2 Relatively Prime Numbers


    Any two numbers are relatively prime if their $gcd$ is 1(one), i.e., $gcd(m, n)
    = 1$. It does not imply that $m$ and $n$ are prime numbers. Neither 10 nor 45
    is a prime number, since both have two prime factors: $10 = 2 \times 5$ and $65
    = 5 \times 13$.'
