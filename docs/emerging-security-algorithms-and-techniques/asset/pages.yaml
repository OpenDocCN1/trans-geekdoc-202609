    # 2.2.3 Modular Arithmetic


    If two integers $p$ and $q$ have the same remainder or residue, when divided by
    $n$, then they are said to be $p \equiv q$ (mod $n$). The set of integers, having
    the same remainder modulo $n$, forms the **residue class modulo n n**. The set
    of residue classes (mod $n$), denoted by $Z_n$, is the set of integers from zero
    to $n-1$.


    ```

    $Z_n = \{0, 1, 2, 3, 4, \dots, n-3, n-2, n-1\}$

    ```


    A multiplicative group of $Z_n$ is the group $Z_n^*$, such that if $a \in Z_n^*$,
    then $a \in Z_n$, and $\gcd(a, n)=1$. A quadratic residue modulo $n$ is the integer
    $a \in Z_n$, such that $x^2 \equiv a (mod n)$ where $x \in Z_n$, if it exists.
    If no such $x$ exists, then $a$ is called the quadratic non-residue modulo $n$.
    The set of all quadratic residues modulo $n$ is denoted by $Q_n$. Conversely,
    given $a \in Q_n$, if some $x \in Z_n$ satisfies $x^2 \equiv a (mod n)$, then
    $x$ is called the square root of $a$ modulo $n$.


    In order to find the square roots of $a$ modulo $p$, where $p$ is an odd prime,
    we first compute $b \in Z_p$ such that $b^2-4a$ is a quadratic non-residue modulo
    $p$. A polynomial $f(x) \equiv x^2-bx+a \in Z_p$ is considered. The value of $r
    = x^{(p-1)/2} (mod f)$ is computed. The square roots of $a$ modulo $p$ are thus
    obtained as $(r, -r)$.


