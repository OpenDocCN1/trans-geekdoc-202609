    # ## 3.1 Introduction


    The prime number has a fundamental position in mathematics and number theory.
    Hence, it behoves us to know as much as possible about the different properties
    of this number. There are several efficient methods with different characteristics
    to determine whether a number is prime or not. For example, the AKS algorithm
    is deterministic as opposed to the Miller-Rabin and Fermat approaches that are
    based on the polynomials as well as having slow speed. However, the Miller-Rabin
    test is more accurate almost for all numbers.


    Among the set of integers, it is very difficult to identify which number is reducible
    or not through the multiplicative process. Suppose $a$ and $b$ are integers where
    $a \neq 0$. If $b=a-k$ for some value $k$, then we can distinguish that $a$ is
    the divisor of $b$, and we simply write $b|a$.'
