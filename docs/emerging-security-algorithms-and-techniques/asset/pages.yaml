  md: '# 14.8.3 Whirlpool Performance


    The NIST evaluation of Rijndael determined that it exhibited good performance
    (execution speed) in both hardware and software, and it is well suited to restricted-space
    (low memory) requirements. These criteria were important in the selection of Rijndael
    for AES. Because Whirlpool uses the same building blocks as AES and has the same
    structure, we can expect similar performance and space characteristics.


    # 14.9 RACE Integrity Primitives Evaluation Message Digest (RIPEMD)


    # 14.9.1 Introduction to RIPEMD


    RIPEMD is a cryptographic hash function designed in the late 1990s at COSIC research
    group, Belgium. It''s tuned to 32-bit software implementations. It was funded
    by the European Union (EU) to find a long-term solution as RIPE Consortium research
    on MD4 and MD5 detected collisions. Its design principles are MD4 while performance
    factors are similar to SHA-1. It uses two independent and parallel chains simultaneously
    combined to form a result. RIPEMD-160, as suggested by the name, is a 160-bit
    hash function where RIPEMD-128 is the fastest variant as it provides 128-bit hash
    function (Wang & Shen, 2014; Wang et al., 2005; Bosselaers et al., 1997).


    # 14.9.2 Orientation & Design Objective of RIPEMD


    MD4 was famous in the 1990s but collision were encountered, so R. Rivest came
    up with a new version of MD4 called MD5. At the time, RIPE Consortium independently
    worked on a project which proved that about the collision count could be found
    by 10 million $ in 6 days and by Moore''s Law, computation power is doubled even
    reducing the cost of construction, so MD5 is not a long-term security solution.
    As a result, they decided to build a secure version of MD4, called RIPEMD. RIPEMD
    is basically two parallel versions of MD4 running simultaneously with changes
    in shifts and message orders while the parallel differed only in round count.
    Both the parallel instances were added in the last to form a 128-bit hash called
    RIPEMD-128. After a while, attacks were found on RIPEMD-128, newer versions of
    RIPEMD were launched RIPEMD-160, RIPEMD-256, RIPEMD found its applications in
    European bank projects, digital signatures, MAC, etc.


    # 14.9.3 Algorithm for RIPEMD-160, 320


    RIPEMD-160 breaks the input blocks of 512 bit which is further divided into 16
    chains of 4 bytes. 4-byte strings are generated using the little endian methodology
    of 32-bit numbers. A set of 5 32 bit entities form a 160-bit hash. To complete
    the hash padding is added to the end to generate the hash. Next and most important
    part is compression function which consists of five parallel rounds in 16 rounds
    for two hash, i.e., parallel. Therefore, 160 rounds as compared to 48 in MD4.
    Each step processes a new value with five registers and a message word. At the
    end, the new state is found by adding each word of the old state one register
    from the left half and one the right half.'
