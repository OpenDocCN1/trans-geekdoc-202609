    M. Merkle in 1976. In the iconic paper “New Directions in Cryptography," they
    introduced the basic structure of public-key cryptosystems and also demonstrated
    how key exchange can be performed securely using a public channel (Diffie & Hellman,
    1976; Goldwasser, 1997).


