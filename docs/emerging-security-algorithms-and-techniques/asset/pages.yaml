  md: '# Post-Quantum Cryptography


    **TABLE 9.4**

    NTRU Cryptosystem


    Public Parameters


    +   - Operations are performed on objects in a polynomial ring $(R)$ that is truncated
    having coefficients to a certain degree such as $R=Z[X]/(X^N-1)$. Select two moduli
    $p$ and $q$ relatively prime in $R$. The moduli $p$ is smaller than $q$, and $q$
    is smaller than $n$ $gcd(p,q)=1$. Note that the symbol $*$ denotes the multiplication
    in $R$

    - Additional parameter $d_i$, is a set of polynomials in $R$ having exactly $d-1$
    1s and $(d+1)$ -1s; $d_j$, and $d_l$ are sets of polynomials in $R$ having exactly
    $d-1$ 1s and $d$ -1s and $d_m$ is a set of polynomials in $R$, such that its coefficients
    are between $-1/2(p+1)$ and $1/2(q-1)$


    # Key Creation


    +   - Choose a random $f \in d$, and invertible in $R=Z[X]/(X^N-1)\pmod p$ and
    $q$. In case, if it does not satisfy, new random $f$ is chosen

    - Compute the inverse of $f \pmod p$ and $\pmod q$ such that $f_p^{-1} \equiv
    1 \pmod p$ and $f_q^{-1}f \equiv 1 \pmod q$

    - Hence, the pair $(f, f_p^{-1})$ is a private key

    - For the private key $h$, compute the polynomial $h=f_q^*g \pmod q$


    # Encryption


    +   - Choose a random $r \in d_r$

    - Select a message $m \in d_m$

    - Compute the ciphertext $(c: c=pr^*h+m \pmod q)$


    # Decryption


    +   - Compute a polynomial $a$ using private key polynomial such that $a=f^*c
    \pmod q$

    - Compute $b=a \pmod q$ and lessen each of the coefficients of $b \pmod p$

    - Compute $z=f_p^{-1}b \pmod p$ by using a private key polynomial $f_p^{-1}$ to
    retrieve the original message $m$


    It must be noted that if the public key polynomial $(n, p, q, d)$ of NTRU satisfy
    that $q>(dp+1)$, it assures that decryption will never be unsuccessful (Malekian
    and Zakerolhosheni, 2010). The advantages of NTRU cryptosystem are: it offers
    efficient implementation of encryption and decryption (Hoffstein et al., 1998;
    By Zhou, 2009). The keys are generated much faster. It takes less memory to implement
    and can be effective for small memory devices as smart cards (integrated circuit)
    and mobile phones.


    To demonstrate the NTRU cryptosystem, we considered the following parameters:
    $N=7, p=3, q=41$. We selected random polynomial $f \in d_f$, that it is invertible
    in $p$ and $q$. Then, randomly selected polynomial $g \in d_g$.


    ```

    f(x)=-x^6-x^5+x^4+x^2, g(x)=x^5-x^4+x^3-x^2

    ```


    In the next step, we have computed the inverse of $f(x)$ modulo $q$, modulo $p$
    and named it as $f_q^{-1}$ and $f_p^{-1}$.


    ```

    f_q^{-1}(x)=38x^6+16x^5+38x^3+22x^2+22x+3,

    f_p^{-1}(x)=2x^6+2x^4+x^3+2x^2+2x+1

    ```'
