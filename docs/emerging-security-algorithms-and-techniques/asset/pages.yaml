  md: "# 10.3.6 Identity-Based Conditional Proxy Re-Encryption\n\nProxy re-encryption\
    \ scheme is an extended scheme of IBE. The scheme coverts the public key of the\
    \ encrypted message of one user into an encryption to other user through a proxy.\
    \ The encrypted message can be temporarily forwarded without giving the private\
    \ key (Harrison, Page, & Smart, 2002). During the conversion, the proxy uses proxy\
    \ key or re-encryption keys to perform the translation without knowing the secret\
    \ key of any user and it does not read the plaintext and then these proxy keys\
    \ are apply to the ciphertext and re-encrypt from one identity to another.\n\n\
    # 10.3.6.1 Algorithm of IB-CPRE\n\n+   a. Setup: $e: G \\times G \\rightarrow\
