- pgno: 252
  md: '# 14.7.2 Design Objectives of CMAC


    MAC has a limitation that only fixed-length messages are processed. (If the cipher
    block size and $m$ is any fixed positive integer, then fixed length of $mn$ bits
    are processed.) As well as it is secured under a reasonable set of security criteria.
    This limitation could be overcome by using CMAC mode of operation with AES and
    triple DES.


    # 14.7.3 CMAC Algorithm


    CMAC algorithm is also known as OMAC1, i.e., One Key CBC-MAC version 1. This uses
    the very simple and efficient way of using بتكون block cipher''s machinery for
    its functioning, and applies a full encryption on each authenticated block. This
    design is very simple and a small variation of CBC-MAC and is alike CBC mode of
    operation for block ciphers.


    The message to be authenticated is divided into no. blocks $t$; these blocks are
    iteratively encrypted and XORed with the following block be processed; only the
    last block is treated in another manner. It is also XORed with one of key-dependent
    constants (denoted $R1$ and $R2=R1^*$) before encryption and it yields the authentication
    tag. These constants are calculated during CMACS initialization, and their purpose
    is to make sure that CMAC''s security is maintained while processing variable-length
    messages. CBC-MAC itself is secure for fixed-length messages (Figure 14.6).


    # 14.7.4 CMAC Security


    CMAC is totally based on the AES algorithm that is a strong cryptographic algorithm.
    We know that strength of any cryptographic algorithm lies in the secret key $k$
    and the accuracy of the implementation in all of the participating systems. For
    the secure authentication and integrity of the message, the secret key shall not
    be compromised and shared with care. It should be kept as well as the secret key
    should be created in a way that it meets the pseudo-randomness requirements.


    ![](img/5ee0cf067ac8390dfbbfeae8da2f7512_252_0.png)


