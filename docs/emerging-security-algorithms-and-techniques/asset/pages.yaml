- pgno: 217
  md: '# Key Management 205


    The first two methods are impractical because of manual delivery of the secret
    keys to the communicating entities. The efficiency of the third method depends
    on the level of security for the previously used secret key by the communicating
    entities. The fourth method is somewhat practical, as this method involves a trusted
    third party for the delivery of the participating entities; this trusted third
    party can be called a Key Distribution Center (KDC). In this method, for secure
    exchange of keys, two types of keys are used: a session key, which is a temporary
    key, used for encryption of message between the communicating entities for one
    logical session and is discarded after usage, and a master key, which is a long
    term used to encrypt and distribute the session keys shared by entities and the
    KDC. For instance, entity A wants to communicate with entity B, then entity approaches
    to the KDC with a connection request, which is encrypted by the master key shared
    by only entity A and the KDC. The KDC approves the connection request and generates
    a one-time session key and sends to entity A by encrypting the session key with
    the master key; similarly, it shares that session key with entity B by encrypting
    it with the master key. Both entities A and B have the on-time session key by
    which they can set up a logical connection and communicate with each other.


    Symmetric key distribution is simple to implement but can also be forged easily,
    because for the communication that takes place between each pair of communicating
    entities, it requires a symmetric key; for n entities, it requires n(n-1)/2 keys,
    which is a very large number of keys. Here, asymmetric/public-key cryptography
    comes into picture which is discussed in the following sections.


    # 12.3.2 Public-Key Infrastructure


    Public-Key Infrastructure (PKI) is a broad concept which came into existence for
    the universal use of public keys. PKI enables the exchange of information over
    an insecure network through the private- and public-key pair obtained through
    the certificate authority which is a trusted authority for issuing and distributing
    the public keys to the participating entities. PKI consists of the following elements
    (Vacca, 2004; Al-Janabi and Abd-Alrazzaq, 2011):


    +   1. **Certificate authority**: Certificate authority (CA) is a trusted authority
    for issuing, distributing, storing, revoking, and renewing the certificate for
    the corresponding public key of an entity.

    2. **Registered authority**: Registered authority verifies the identity of an
    entity; whether the entity requesting for the certificate or requesting for storing
    the certificate to a valid entity or not.

    3. **Certificate revocation list**: Certificate revocation list (CRL) lists the
    revoked certificates issued to the participating entity and other authorities.

    4. Certificate management system**: The certificate management system stores,
    distributes, and issues the certificates to the requesting entities.

    5. **Certificate directories**: Certificate directories are responsible for storing
    and distributing the digital certificates and CRLs issued to the participating
    entities.


    PKI is a combination of policies, standard, rules, entities, public-key cryptography,
    hardware, and software. It maintains the hierarchy of certificate authorities
    for getting the verification of the entities identity through the certificate
    issued by the CA.'
