  md: '# 198 Emerging Security Algorithms and Techniques


    the message, whereas asymmetric cryptography algorithm uses public and private
    keys for the encryption and decryption of the message. Hence, there are three
    types of keys involved in the cryptographic algorithm: secret key, private key,
    and public key for ensuring the secrecy of the message over the unsecured networks.
    For ensuring the secrecy of the message, cryptographic keys must be managed efficiently
    and is done by key management system.


    Key management system or cryptographic key management system deals with the generation,
    exchange, storage, replacement, destruction, and management of keys in the cryptographic
    systems. Key exchange and key distribution are the most important and critical
    aspects of the cryptographic key management system. Key exchange or key establishment
    is the method to exchange keys between the entities over the unsure channel. There
    are various problems associated with the key exchange methods, how to exchange
    the keys through the channel so that the keys can reach securely to the other
    ends. Several key exchange algorithms are also present in the literature which
    will be discussed further in this chapter.


    Key distribution is another aspect of a key management system which delivers the
    keys to the entities who wish to exchange messages between them, i.e., who communicate
    with each other. The key distribution method is used to reduce the risk of learning
    the keys by the intruder while exchanging the keys between the entities over the
    network. Literature mentions various key management and distribution cryptographic
    algorithms for managing and distributing keys for the secure communications, but
    there is no generalized key management and key distribution technique which can
    be used for all application scenarios.


    # 12.1.1 Background of Cryptographic Key System


    The concept of the cryptographic key system is not new; it was started back thousands
    of years ago. Basically, cryptography is an art which is created to be born along
    the art of writing. The term "cryptography" was formed by combining two Greek
    words "Krypto" and "Graphene" which means secret writing. The roots of cryptography
    can be very found in Egyptian and Roman civilizations. In Egyptian civilizations,
    the Egyptians wished to communicate with each other messages written in "hieroglyph"
    writing system is an old cryptographic technique. The messages written in hieroglyph
    were only understood by the scribes who wished to transmit messages to the other
    end on behalf of the king. Similarly, the Romans used a popular Caesar cipher
    method to transmit the messages, and the first record used of Caesar cipher was
    in which the plaintext characters are transformed monoalphabetically. Each character
    in the plaintext was transformed or shifts down by three characters alphabetically.
    The history of cryptography has witnessed many changes and can be found in the
    literature (Kahn, 1996; Singh, 2000; D''Agapejeff, 2016). Till 1970s, cryptography
    was mostly used by the government agencies, but with the two major developments—public
    cryptography and the designing of Data Encryption Standards (FIPS PUB, 1999)—the
    nature of cryptography was completely changed and has brought them in the public
    domain (Davies, 1997).


    Cryptography is both an art and science which transform the information into a
    form which is secure and immune to attacks. The components of cryptography include
    a plaintextwhich is the original text, the encryption algorithm that encrypts
    the plaintext, ciphertext which is formed after the encryption of the plaintext,
    and the decryption algorithm which decrypts the ciphertext into the plaintext.
    Encryption and decryption algorithms'
