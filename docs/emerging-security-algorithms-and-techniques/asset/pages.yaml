    system, but it is not efficient enough to detect undisclosed vulnerabilities (Kallapur
    & Geetha, 2021).


    # 16.3 Database Security


    Data mining is related to the database. When it comes to an enormous amount of
    data, mining is an add-advantage of databases. Another aspect related to the database
    is the sharing of information; databases can be of any type and when mining accompanied
    by sharing result in a breach of data security. The mining can impose the threat
    of data being used for a harmful purpose i.published data can be used undesirably.
    The aging and ordering of bulk data in a very large amount are known as mining.
    It provides facility to cluster or group the data so that sorting becomes easy.
    Its main use is to find information from big data clusters in way it helps in
    detecting records. The mining techniques the use of dependencies, which is also
    known as pattern mining. The process of data mining involves the use of sorting
    algorithms. This was coined after people started taking advantage of mining for
    personal benefits rather than maintaining integrity in the system such as spoofing,
    fishing, and mining unnecessary information.


    # 16.3.1 Classification of Database Security


    Securing the database was quite difficult, but not after the advent of the cloud,
    the databases started to have easy backups. It is classified into several parts
    like distributed and cloud data. The common thing is the host and location of
    the database (Denning, 1984). So, it is classified into physical and logical as
    follows (Malik & Patel, 2016):


    +   1. Physical database security: Security is involved in recovery mechanism
    as to revive the data, if its cloud servers are safe. The physical location of
    data plays an important role as it concerns for the location where data are physically
    present.'
