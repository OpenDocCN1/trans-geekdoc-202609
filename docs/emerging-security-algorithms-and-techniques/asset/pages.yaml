    # 14.4.1 SHA-1


    SHA-1 is a cryptographic hash function published by the National Institute of
    Standards and Technology (NIST). The three SHA algorithms are SHA-0, SHA-1, and
    SHA-2. The SHA-0 algorithm was not used in many applications. On the other hand,
    SHA-2 differs from the SHA-1 hash function. SHA-1 is the most widely used hash
    function.

    However, the most widely used are SHA 1 and SHA 256.

    SHA-1 hash function performs 80 (0-79) iterations to produce the message digest
    and its transformation rounds simple additions, rotations, and Non-linear functions
    (NLFs) $f[16]$.


    ```

    $f(t;B,C,D)=(B \AND\ C) \OR\ ((NOT\ B) \AND\ D) \quad (0\le t\le 19)$$

    $f(t;B,C,D)=B \ XOR\ C \ XOR\ D \quad (20\le t\le 39)$$

    $f(t;B,C,D)=(B \AND\ C) \OR\ (B \AND\ D) \OR\ (C \AND\ D) \quad (40\le t\le 59)$$

    $f(t;B,C,D)=B \ XOR\ C \ XOR\ D \quad (60\le t\le 79)$

    ```


    Where $B, C$, and $D$ are 32-bit words.

    Concerning the required 80 $W$, the first 16 are formed by decomposing the 512-bit
    incoming message block in 32-bit words that each of those corresponds to one 32-bit
    $W$, value.

    The remaining64 bits are produced through the following equation:


    ```

    $W_i = ROTL(W_{i-3} \, W_{i-8} \-, W_{i-14} \+, W_{i-16})$

    ```


    $16\le t\le 79$ where ROTL, stands for $x$ times left bit rotation (Figure 14.2).


