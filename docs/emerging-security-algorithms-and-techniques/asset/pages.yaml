  md: '# 3.12 Mersenne Number


    The Mersenne numbers are those that are generated by the formula: $M_n=2^n-1$
    where $n>2$. If the value of $M_n$ is prime, then it is called the Mersenne number
    (refer to Table 3.15). This classification is named after a religious and French
    mathematician Marin Mersenne (1588–1648) who produced a list of prime numbers
    in this form (Murata & Poraç, 2004; Terzich, 2012; Granger & Moss, 2013).


    +   1. If $n$ is a prime number, then $M_n$ may be prime or composite number.

