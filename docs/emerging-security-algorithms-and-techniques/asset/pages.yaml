    and make it look like the bank''s branch office has sent it, it can easily make
    a lot of money. An unauthorized user can escalate it privileges if he fools the
    machine into thinking that the messages it is receiving is sent by the system
    administrator. In absence of message authentication mechanisms, the receiver cannot
    verify the source of the message which leads to various attacks performed by the
    hackers.


    # 14.2.3 Non-Repudiation


    Non-repudiation means to make sure that someone cannot deny their actions. If
    a legal document is being signed, witnesses are required so that person signing
    the document cannot deny it. Similarly, in regards to communication, a party or
    a person has originated a message or sent some document, they cannot deny it and
    they cannot question the originality of their signature. Digital signatures are
    used to ensure non-repudiation.


    Digital Signatures are a form of electronic signatures that basically refer to
    a signature that is electronically generated. It uses asymmetric cryptography
    to ensure integrity and non-repudiation.


    A digital signature scheme usually contains three algorithms:


    +   1. A key-generation algorithm which generates a random private key and a corresponding
    public key.

    2. A signing algorithm takes the private key and the message as the input and
    generates a signature as the output.

    3. A signature verification algorithm which takes the public key, message, and
    signature as input and tells if the message''s authenticity is intact or not.


    # 14.2.4 Hash Functions


    A hash function is a function which takes variable-length input of data and returns
    a fixed-sized hash value. The hash generated has even distribution and is random.
    The advantage of hash functions is that upon a change in the input data, hash
    value changes which is used for message authentication. A cryptographic hash function
    is used for security purposes. Since the hash is a one-way function, some amount
    of data are modified. It cannot generate the pre-specified hash value, and hence
    becomes important to create hash functions which are hard to find out (Holden,
    2013). There are no data sets which generate the same hash unless they are exactly
    the same. Due to these benefits, hash functions are used to check the authenticity
    of the messages that if the contents of the messages have been modified or not.
    In cryptographic hash function, padding of data input is done to a fixed-length
    index and the padding contains the length of the actual message in bits (Hsieh
    et al., 1999). Both sender and the receiver calculate hash value through the hash
    function, if the values matched before and sending, the message''s integrity is
    maintained otherwise, it has been tampered after sending (Figure 14.1).


    # 14.2.5 Message Digest


    A message digest is a cryptographic hash function that takes any arbitrary length
    input and converts into an output of predefined fixed length known as hash or
    digest. Digests'
