- pgno: 72
  md: 'of integer factorization arises around Euclid. The defeat of unique factorization
    around 300 bc. The practical importance of the integer factorization problem arises
    with the development of public key cryptography. For example, the security of
    RSA cryptosystem (Rivest, Shamir & Adleman, 1978) is based on integer factorization
    problem, i.e., RSA cryptosystem will break if integer factorization is solved.
    Consequently, finding an efficient algorithm for integer factorization has practical
    importance.


    Currently, the size of numbers which can be factored using modern technology is
    around 232. Factoring such a number required an enormous amount of computing power.
    The records of integer factorization are categorized into two categories (Lenstra
    & Lenstra, 1993). In the first category, the composite numbers are RSA modulus
    are considered (Lenstra, 2017) and in the second category, the composite numbers
    with special form such as Fermat numbers ($F_m = 2^{2^m}+1, m \ge 0$) and Cunningham
    numbers ($C^c(b,m) = b^m\pm1$) (Brillhart et al., Cunningham & Woodall, 1925;
    Lenstra, 2017) are considered. Most, in the first category, a 232-digit number
    RSA-768 was factored on 12 December 2009 (Kleinjung et al., 2010) and a 200-digit
    number RSA-200 was factored on 9 May 2005. In the second category, numbers of
    the form $2^m-1$, where $m \in (1007, 1009, 1081, 1111, 1129, 1153, 1159, 1177,
    1193, 1199), are factored in the year 2014 (Coppersmith, 1993; Lenstra, Lenstra,
    2014).


    The integer factorization methods are distinguished into two types: special-purpose
    method and general-purpose method. The running time of the special-purpose method
    depends on the size of known factors of $n$, while the running time of the general-purpose
    method depends on the size of the composite number $n$ whose factors are to be
    determined. The most important special-purpose methods are trial division, Fermat''s
    factorization, Pollard''s $\rho$ method, Pollard''s $p-1$ method, and the elliptic
    curve method. Random Quadratic sieve (QS), and Number field sieve (NFS) method
    are examples of general-purpose methods. The general-purpose methods are basically
    used for evaluating the security of factoring-based cryptosystems.


    This chapter is a survey of various integer factorization methods, which is for
    the people who want to get an idea of how the modern factoring algorithms work.
    We will illustrate the basic concept of these methods with examples. We will provide
    the algorithms and discuss the complexity of these methods.


    The rest of this chapter is organized as follows. Section 5.2 is devoted to special-purpose
    methods, which consist of five subsections namely trial division method, Fermat
    factorization, Pollard''s rho method, Pollard''s p-1 method, and the elliptic
    curve method. In Section 5.3 we discuss the general-purpose methods. This section
    consists of three main subsections. In the first subsection, we will discuss the
    random squares method. which was considered as the most practical general-purpose
    method from 1982 to 1994. In the year 2001, a 135-digit number was factored with
    the help of this method. Note that RSA-768 and RSA-200 were factored with the
    help of NFS. Sections 5.4 and 5.5 are devoted to two new factorization methods
    proposed in 2011 and 2012 (Balasubramanian, Muthukumar & Othman, 2012; Zalaket
    & Hajj-Boussous, 2011).


    As the integer factorization is the core of many public key systems, it is important
    to know the size of the number which can be factored in current technology. Section
    5.6 provides the list of some integers that are factored between 1990 and 2017.
    We conclude the chapter in 5.7.'
