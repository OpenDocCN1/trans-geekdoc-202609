    # 8.6 Knapsack Algorithm


    The knapsack problem, also known as the subset sum problem, is an NP-complete
    problem in which the objective is to fit a knapsack of a given capacity from a
    set of objects, each having different weights. In a set-theoretic description,
    the problem can be described as finding the linear combination of the given values
    in a set, such that the sum is equal to a required amount. The best-known algorithm
    for this general subset problem is exponential in time complexity.


    Although this general knapsack is computationally infeasible for a large set of
    objects, there special cases of this problem can be computed efficiently. The
    knapsack-based schemes work by creating a transformation between a special case
    of a subset problem and the general subset problem for a fixed knapsack size.


    The first knapsack-based asymmetric algorithm was the Merkle-Hellman cryptosystem
    (Merkle & Hellman, 1978; Shamir, 1982). It used a super-increasing set as its
    special instance of the knapsack problem, since it is easily solvable. Although
    it was proven to be insecure, its importance lies in the fact that it was the
    very first asymmetric encryption scheme. Many knapsack based encryption schemes
    were developed following Merkle-Hellman, but all of them were proven to be insecure
    with the exception of one—the Chor-Rivest knapsack cryptosystem (Chor & Rivest,
    1985; Menezes, van Oorschot & Vanstone 2001).'
