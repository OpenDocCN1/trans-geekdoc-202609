    # 3.4 Composite Number


    A whole number that has more factors than itself and 1 can be defined as a composite
    number (Andrews & Berndt, 2012).


    +   - Every number greater than 2 is always a composite number.

    - Every composite number can be written as the product of two or more primes,
    shown in Table 3.5.


    # 3.5 Fermat''s Theorem


    It states that if **a** and **p** are co-prime numbers where **a** belongs to
    a natural number and **p** is prime, then the remainder of $a^{p-1}/p$ will be
    1. It is also known as Fermat''s little theorem (Faltings, 1995; Robinson, 2011;
    Korovuk, 2014).

    In other words, $a^{p-1} \pmod p = \mathbf{1}$ or $a^p \pmod p = \mathbf{a}$ where
    $p$ is prime and $\gcd(a, p) = 1$ For example: $5^6 \pmod 17 = 1$, $25^{96} \pmod
    97 = 1$, $42^{38} \pmod 131 = 1$.


    # 3.5.1 Multiplicative Property


    The multiplicative property states that $(a * b) \pmod c = ((a \pmod c) * (b \pmod
    c)) \pmod c$. It breaks down the numerator into factors and finds out the remainder
    of each factor after calculating their properties gets the final remainder. It
    means when the modulo operation is


