    # 17.3.7 if Statement


    In SAGE, an object is "true" if it is nonzero or nonempty and it is "false" if
    it is zero or empty. A simplified syntax specification for the if statement is
    as follows:


    ```

    if <expression>:

    <statement>

    <statement>

    <statement>

    .

    ```


    Example


    ```

    x = 4

    if x < 5:

    print x

    print "Smaller"

    |

    4

    Smaller

    ```


    Looping with while Statement

    The syntax specification for the while statement is as follows:


    ```

    while <expression>:

    <statement>

    <statement>

    <statement>

    .

    ```


