  md: "# Integer Factorization Problem\n\n# 5.2 Special-Purpose Algorithms\n\nThe\
    \ special-purpose algorithms are those whose runtime depends on the size of the\
    \ unknown factors of $n$. There are various integer factorization algorithms of\
    \ this kind. In this section, we discuss some of them.\n\n# 5.2.1 Trial Division\n\
    \nThis is the simplest method for finding prime factors of a composite integer\
    \ $n$. The prime number $p$ is the smallest factor of $n$ if $p|n$ is not divisible\
    \ by any prime number which is less than $p$. Therefore, to find $p$ we divide\
    \ $n$ by all the prime numbers until $p$ is reached.\n\n# 5.2.2 Fermat's Method\n\
    \nIn 1643, Fermat proposed a factorization algorithm, which is also called as\
    \ Fermat's difference of squares. The main idea of this method is that if we have\
    \ $n \\in N$, such that $a^2 \\equiv b^2 \\pmod n$ with $a \neq b \\in \\mathbb{Z}$,\
    \ then $n$ is a composite for $\\gcd(a+b, n) \neq 1$ and $\\gcd(a-b, n)$ gives\
    \ the factors of $n$.\n\nIn Fermat method, we consider an odd natural number $n=rs$\
    \ such that $1 < r < \\sqrt{n}$. Then $n$ can be expressed as $n=a^2-b^2$, where\
    \ $a=\\frac{r+s}{2}$ and $b=\\frac{r-s}{2}$. Thus, to find the factors of $n$,\
    \ we need to find the values of $a^2=b^2 \\pmod n$ for $b=\\lfloor\\sqrt{n}\r\
    floor, \\dots$ until $b^2-n$ is a perfect square. For example, we will apply the\
    \ Fermat method to find the factors of $n=63787$. The first $b$ equal to $\\lfloor\\\
    sqrt{63787}\rfloor+1=254$ and $b^2-n=729=27^2$, which is a perfect square. So,\
    \ $a=254$ and gives $63787=(254+27)(254-27)=281 \\cdot 227$.\n\nThis method gives\
    \ a good result if factors are near the square root of the number. The runtime\
    \ of this method is $O(n^{1/2})$. Lenstra has reduced time complexity of this\
    \ method to $O(n^{1/3})$, by combining this method with the trial division method.\
    \ There are various methods to speed up Fermat's factorization method (e.g., Brillhart\
    \ & Selridge, 1967; Lehman, 1974).\n\n# 5.2.3 Pollard's p-1 Method\n\nPollard\
    \ (1974) proposed a new technique for factorization called Pollard's $p-1$ method,\
    \ which is based on Fermat's theorem. Fermat's theorem states that for any prime\
    \ $p, a^{p-1} \\equiv 1 \\pmod p$. Thus, suppose $n=pq$ is a composite integer\
    \ to find the factors of $n$. If $p|n$ and $p$ is prime, then $\\gcd(a^m-1, n)=p$\
    \ and this is a prime factor of $n$. But we cannot compute $a^{p-1} \\equiv 1\
    \ \\pmod p$ directly as $p$ is unknown. We can calculate $a^m$ for $m=1, 2, 3,\
    \ \\dots$ until $\\gcd(a^m-1, n)>1$, i.e., until $m=p-1$ operations. The algorithm\
    \ can be improved in the following way.\n\nNote that, for any integer $k, a^{k-1}\
    \ \\equiv 1 \\pmod p$. Instead of finding $m$ for $\\gcd(a^m-1, n)$, it is sufficient\
    \ to find $m$ such that $(p-1)|m$. We can find such $m$ if relatively small bound\
    \ $B_1, (p-1)$ is $B_1$-smooth, i.e., $(p-1)$ has prime factors that are less\
    \ than or equal to $B$. Consider $m=$\n\n![](img/5ee0cf067ac8390dfbbfeae8da2f7512_73_0.png)"
