    # TABLE 9.5


    # GGH Cryptosystem


    Construction of Keys


    +   - For private key: Choose a full-column rank integer matrix $V$ such that
    columns are orthogonal to each other

    - Select a random $n \times n$ unimodular matrix $U$, such that $\det(U) = \pm1$

    - For public key, compute a matrix $W = VU$


    ```

    $V = [v_1, v_2, v_3, \dots, v_n], \ v_j \in \mathbb{Z}^l, 1 \le j \le n$

    ```


    Encryption


    +   - Choose a perturbation vector that acts as an ephemeral key

    - Select a plaintext message $m$ of the same dimension as lattice

    - Encrypt the message $m$ using public key $W$ and ephemeral key $r$, and compute
    the ciphertext


    ```

    $c = Wm + r$

    ```


    Decryption


    +   - Decrypt the closest vector $v$ that belongs to the lattice of ciphertext
    $(c)$ using private key $V$ and any decoding algorithm

    - Compute the inverse of $V$ to decrypt the ciphertext such that $c \cdot V^{-1}$

    - Then, return the original message $m$ by multiplying with the inverse of the
    unimodular matrix such as $m = x \cdot U^{-1}$. In the end, its correctness can
    be verified by differentiating $m$ with the hashed value


    is practical offers simplicity. It is introduced as a lattice equivalent of McEliece
    cryptosystem in which short orthogonal vectors are used as a private key by Goldreich
    et al. (1997). It acts as a good lattice basis. Till now, asymptotically good
    attack to GGH encryption scheme is not identified because security and correctness
    depend upon the selection of private basis and error vector. It is based on solving
    the problem ''close vector problem (CVP)'' in lattice, i.e., finds the lattice
    point closest to a vector. As compared to RSA, Diff–Hellman, and ElGamal, it offers
    high performance due to simple operations (Table 9.5).


    The security of GGH cryptosystem depends upon selecting a suitable perturbation
    vector $r$. If it is selected very small, then the closest vector can be easily
    retrieved without difficulty. If it is selected very large, then may not be possible
    to decrypt the private key. Here, the perturbation vector $r$ must be balanced,
    i.e., relatively small compared to the vectors in public key $W$. The advantages
    of lattice-based cryptography are as follows: till now, any quantum attacks do
    not exist to break lattice-based cryptystems, and it is one of chief substitutes
    for post-quantum cryptystems. The disadvantages of lattice-based cryptography
    are as follows: lattice-based cryptystems are not applied much due to security
    reasons (Nguyen and Regev, 2009). NTRU is efficient in implementation but lacks
    in security.


