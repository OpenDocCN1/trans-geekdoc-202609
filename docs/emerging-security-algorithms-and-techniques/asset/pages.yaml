    # 12.2.5 Ring LWE Key Exchange


    A vast majority of public key algorithms available in literature, such as Diffie-Hellman
    algorithm, RSA algorithm, and ECDH, are easily broken by the quantum computer
    and are insecure. The Learning With Errors (RLWE) key exchange (Ding et al., 2012)
    is one of the post-quantum public-key exchange algorithms that are designed to
    provide security against quantum computers. RLWE is a lattice-based cryptographic
    algorithm, and it is a widespread notion that lattice-based cryptographic algorithms
    provide security against quantum attacks and provide forward secrecy like Diffie-Hellman
    algorithm and ECDH. In this protocol (Ding et al., 2012), the communicating entities
    exchange key between them, one of the entities is an initiator, entity A for the
    key exchange and other is a respondent entity, entity B. The values of $q, n,
    a(x)$ are known to both entities A and B.


    They generate a small polynomials $x_w$ according to the discrete Gaussian distribution
    with the parameter $\sigma = Z_{|w|} / \Phi(x)$. The protocol follows the initiator
    (A) and works as follows:


    # Initiation:


    +   1. The initiator of the key exchange entity generates two polynomials $S_A$
    and $E_A$ from the distribution $x_w$.

    2. Entity A computes $P_A = aS_AS_B + 2E_A$.

    3. Entity A sends the polynomial $P_A$ to the respondent entity, entity B.


    # Response:


    +   1. The responder, entity B, generates two polynomials $S_B$ and $E_B$ by sampling
    from the distribution $x_w$.

    2. Entity B computes $P_B = aS_B + 2E_B$.

    3. Entity B generates $E_B''$ from the distribution $x_w$ and compute $K_B = P_BS_B
    + 2E_B''$. Then $P_BS_B+2E_{AS_B}+2E''_B$.

    4. The signal function $Sig$ is used to find $w = Sig(K_B)$.

    5. Respondent sides, i.e., entity B calculates the key $SK_B = mod_2(K_B, w)$
    based on the w and the polynomial $K_B$.

    6. Entity B sends $P_B$ and $w$ to entity A.


    # Finish:


    +   1. After receiving $P_B$ and $w$ from entity B, sample $E_A''$ from the distribution
    $x_w$ compute $K_A = P_BS_A + 2E_A'' = aS_AS_B+2E_{BS_A}$.

    2. Initiator sides, i.e., entity A a key is calculated as $SK_A = mod_2(K_A, w)$
    based on the w and the polynomial $K_A$.'
