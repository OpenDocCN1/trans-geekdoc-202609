    # 16.7 SMS Security


    Short Message Services (SMS) are most widely used nowadays. Chat applications
    came into existence, but before that, the SMS was the fastest and cheapest way
    to security to the devices and no valid identification of the user. Many SMS contains
    malicious and suspicious links which may lead to decrypt of devices. The protocols
    of SMS are laid ETS ITS 03.48 which provide a key identifier, SPI (Security Parameter
    Index), and integrity values. Digital signatures and redundancy checks are used
    for authentication and validation. SMS security has been a concern for Telecom
    companies and most probably for the mobile users as attacks related to snooping;
    flooding, fading, SMS interception, and modification are most common. The SMS
    gave to messengers in with Trojans and several viruses can sneak into our systems
    easily. Its security can be achieved by encryption and user authentication to
    make safe for users (Reaves et al., 2016) (Figure 16.10).


