- pgno: 292
  md: '# 16.4.1 Cloud and Its Deployment Models


    Cloud is being used as the most reliable source for the data storage. It provides
    facility to retrieve or view files from anywhere and on any computing devices
    like mobiles, laptops, etc. Google Cloud, i.e., drive, provides cloud storage;
    it allows storage of data on the Internet. The cloud servers are placed in a safe
    place from any physical damage. These servers have more capacity than the usual
    servers (Padhy & Patna, 2022; Rao & Selvamani, 2015).


    Cloud servers are in three forms, i.e, it can be used as Software as a Service,
    Platform as a Service, and Infrastructure as a Service. These three models are
    being adopted by vendors providing cloud services to their users (Rao & Selvamani,
    2015).


    +   1. Software as a Service (SaaS): These are application-based models, which
    can make a login and operate Internet and applications like Google, Facebook,
    etc; it is provided by Application Service Providers (APs). For example, Google
    apps vendor manages the infrastructure so to provide full maintenance.


    +   2. Platform as a Service (PaaS): It provides services which include the platform
    that does not involve installation and other software configuration, such as Microsoft
    Azure and RedHat on-Shift, which provides services like J2EE and DotNet. It provides
    good connectivity and backup which is more favorable to developers.


    +   3. Infrastructure as a Service (IaaS): It consists of the virtualization phenomenon,
    which consists of a virtual interface which helps in remotely on any systems and
    controlling servers, which may include disk allocation and other related operations.
    It is mostly concerning the interaction with network devices like switches, host-routers,
    etc. All of these can be summed as sharing hardware components by making use of
    virtualization.


    # 16.4.2 Threats to Data on Cloud


    +   1. Authorization and access: Malicious users can breach security and get into
    a cloud environment.


    +   2. Weak authentication: It can occur by not adopting robust methods top allowing
    access to data, by using weak passwords and primitive methods to allocate access
    to data users.


    +   3. Vulnerabilities and misconfiguration on network: Data is on cloud, 24 hours
    online and is exposed to all kinds threats which are present on a network like
    sniffing and Hacking, etc.


    +   4. Exposing backup: As the cloud is most used as a backup, then it can simply
    be vulnerable to attacks and being exposed to the malicious user. This can happen
    while transferring data; it depends on how data are useful.


    # 16.4.3 Securing a Cloud


    Security issues include data transmission, integrity, network security, privacy,
    availability, and segregation. These issues can be checked by security policies
    and compliance audits. The services on the cloud do not belong to the user itself;
    the data of the user are being saved on a third base. It does not provide any
    control over queries of what can happen to our data. Valuable information may
    also be threatened by any kind'
