    # 14.2 Message Authentication


    Message Authentication is the mechanism which lets the sending party and the receiving
    party maintains the integrity of the messages being shared. It allows the sender
    to send the message to the receiver in such a way that if the message sent is
    modified in the channel before reaching the receiver, the receiver will surely
    detect it. The following are the attacks identified in such communication through
    a network:


    +   1. Disclosure: Data being disclosed to any unauthorized person.

    2. Traffic analysis: Intercepting the traffic between the sending and the receiving
    party and analyzing the data collected to make deductions about.

    3. Masquerade: Sending fraudulent messages to the receiver and fraudulent acknowledgments
    to the sender

    4. Content modification: Editing the data contained in the message

    5. Sequence modification: Changing the sequence of the messages shared.

    6. Timing: Delaying or replaying of the messages which have been already sent.
    It may even involve recreating a whole session of conversation between the parties
    concerned.

    7. Source repudiation: Source denies to transmit the message

    8. Destination repudiation: Destination denies to have received the message.


    Out of the attacks defined, Message Authentication can solve the attacks (3) to
    (6). Attack (7) can be dealt with digital signatures, which is also a type of
    message authentication mechanism.


    # 14.2.1 Message Integrity


    Integrity is one of the three major pillars of information security. Message Authentication
    helps in maintaining integrity as it ensures that the message which received is
    exactly how the sender sent it—neither any data were added, deleted, or modified.
    If there is not any mechanism in place to ensure the security of the network,
    the network is susceptible to man-in-the-middle attacks which severely affect
    the integrity of the messages being sent.


    # 14.2.2 Data Origin Authentication


    It is very important for a person or party to verify the source of the message
    received. There should be a mechanism in place to verify that there is no man
    in the middle who is tampering with the messages and then forwarding the message
    to the receiver. For example, if a user sends the details of the deposit transactions
    to the bank''s central computer'
