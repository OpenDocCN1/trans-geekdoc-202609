- pgno: 16
  md: '# Emerging Security Algorithms and Techniques


    Or

    Sometimes we can say, $a \equiv b (mod m)$


    Integers $a$ and $b$ have same reminder, if we divide $m$ or

    there exists an integer $k$ such that

    $a - b = km$.


    # 1.2.1 Examples


    +   a. $6 \equiv 11(mod 5)$

    b. $23 \equiv 1(mod 2)$

    c. $-7 \equiv 5(mod 4)$, etc.


    # 1.3 Additive Inverse


    In mathematics, when we add two numbers and their sum is zero (0), the number
    that is added to a given number is called its additive inverse, e.g., $a + (-a)
    = 0 = -a + a$, where $-a$ is additive inverse of $a$ (Gloag, Gloag, & Kramer,
    2015).


    # 1.3.1 Examples


    +   a. $7 + (-7) = 0$

    Here, $-7$ is additive inverse of 7.

    b. $-2 + 2 = 0$

    Here, 2 is additive inverse of $-2.

    c. $4 + (-4) = 0$

    Here, $-4$ is additive inverse of 4.

    d. $0 + 0 = 0$

    $-0 + (-0) = 0$, etc.

    Here, 0 is additive inverse of 0 itself.


    Note: Zero is the only number which is additive inverse of itself.


    # 1.4 Multiplicative Inverse


    In mathematics, when we multiply two numbers and their sum is 1, the number we
    multiply to a given number is called its multiplicative inverse, e.g, $a \times
    1/a = 1$ or $a-1/a$, where $1/a$ is the multiplicative inverse of $a$ (Barua,
    2017).


    # 1.4.1 Examples


    +   a. $7 \times (1/7) = 1$

    Here, $1/7$ is the multiplicative inverse of 7.'
