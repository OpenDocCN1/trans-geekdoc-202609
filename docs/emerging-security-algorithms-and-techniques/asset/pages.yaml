    # 2.4.1 Examples


    +   1. The set of real numbers $R$, with the usual addition and multiplication,
    forms a field.

    2. The set of complex numbers $C$ also forms a field under usual addition and
    multiplication.

    3. The set of four elements, namely $[0, I, x, y]$, where $O$ stands additive
    identity, $I$ stands multiplicative identity, and $A, B$ are the elements in the
    set of the two binary operations defined in the composition tables (Tables 2.1
    and 2.2), forms a field denoted by $F_4$.

    4. The subset consisting of $0$ and $I$ in the above example is also a field,
    which is known as the binary field $F_2$ or $GF(2)$.


    # 2.4.2 Finite Field


    Finite fields (or Galois fields) are the field with finite elements; such cardinality
    is referred to as the order of the field. The above example $F_4$ is a field with
    four elements. Its subfield $F_2$ is the smallest field, because by definition
    a field has at least two distinct elements $1 \neq 0$.


    TABLE 2.1

    Addition

    | + | 0 | I | x | y |

    |---|---|---|---|--|

    | 0 | 0 | I | x | y |

    | I | I | 0 | y | x |

