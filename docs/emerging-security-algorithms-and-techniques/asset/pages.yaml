    # 14.7 Cipher-Based Message Authentication (CMAC)


    # 14.7.1 MAC Based on Block Ciphers


    Basically, there are two types of MAC''s which uses the block cipher of operation.
    One is Data Authentication Algorithm (DAA) which is not so in practice now, and
    another is CMAC which is designed to overcome the vulnerabilities of DAA.

    Let''s talk about DAA.


    DAA has been one of the most used MAC''s for years now but it is outdated. It
    is basically based on Data Encryption Standard. This algorithm uses CBC method
    of operation initializing vector Zero. The data (for example: Message, record,
    files, or programs) are first grouped into contiguous 64-bit blocks as D1, D2,
    ..., Dn.


    If necessary, the last block is be padded on the right with zeros to form a 64-bit
    block. Then the Data Authentication code (DAC) can be calculated as follows:


    ```

    O₁ = E(K, D₁)

    O₂ = E(K, D₂ ⊕ O₁)

    O₃ = E(K, D₃ ⊕ O₂)

    :

    :

    Oₙ = E(K, Dₙ ⊕ Oₙ₁))

    ```'
