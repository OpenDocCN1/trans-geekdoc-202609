  md: '[ECC]) have become a crucial component of cyber security. In this regard, security
    depends on the difficulty of a definite number of theoretic problems (integer
    factorization or the discrete log problem). (Shor, 1994) designed an algorithm
    to calculate factors of a large number n with space complexity O(log n)² * log
    n on a quantum computer, and then perform O(log n) post-processing on a classical
    computer, which could be applied for cracking the RSA algorithm at Bell Laboratories
    (US). (G, 1996) designed a search algorithm with quantum advantage for finding
    an in an unstructured set of size n √n operations approximately. (Kwiat et al.,
    2000) implemented Grover''s algorithm at Los Alamos National Laboratory using
    conventional optical interferometers. Quantum parallelism is one of the main features
    of quantum computation which allows algorithms to gain speedup as compared to
    classical algorithms.


    Through the impetus provided by Shor''s algorithm (Shor, 1994), quantum computational
    complexity is an exhilarating area that transcends the boundaries of quantum physics
    and theoretical computer science. This algorithm is well known in the field of
    cryptography given its potential application in creating various systems, such
    as the RSA algorithm and elliptic curve cryptography (Chen et al., 2016). These
    all public-key cryptystems can be attacked in polynomial time. Although Grover''s
    algorithm can be steered to some attacks, it can be evaded by modifying the parameters.
    Table 9.1 represents the present status of several cryptystems (Bernstein, 2009).


    Post-quantum cryptography offers secure alternatives. The goal of post-quantum
    cryptography is to develop cryptystems that are secure against both quantum and
    classical computers, and compatible with existing communication protocols and
    networks. Apart from RSA, DSA, and ECDSA, there are other classes of cryptographic
    systems which include Code-based, Lattice-based, Hash-based, and Multivariate
    quadratic equations. In fact, many have been applied to Shor''s algorithm to these
    classes of cryptographic systems.


    There are many challenges regarding the successful execution of post-quantum cryptographic
    algorithms; for example, there is a need to enhance the usability and effectiveness
    of post-quantum cryptystems, and we need to make sureness in post-quantum cryptystems.
    By 2020, if the quantum computers come into action, these challenges need to be
    addressed because we are not yet organized to shift to an era of post-quantum
    cryptography. The following are the details of several cryptographic systems that
    have otherwise with every attack.


