    # 理解可解释人工智能 (XAI) 的基础


    AI 系统从输入数据中提取模式，并根据训练过的知识得出感知。随着 AI 系统和应用在日常生活中的日益增加，人们对解释性和问责制的需求日益增长，以便为更广泛的
    AI 采用模型输出提供合理依据。与具有自解释性的传统人工规则规则系统不同，许多深度学习算法本质上是不透明的，且对于人类的可解释性来说过于复杂。


    XAI 是一个跨越心理学、计算机科学和工程的多学科领域，如图 2.1 所示。通过应用算法、心理学和认知科学概念，XAI 旨在提供可解释的 AI 决策，让没有机器学习背景的用户也能理解模型行为。


    ![](img/c06290096a327475ed918ba4a4328b77_44_0.png)


    图 2.1 - 作为多学科领域的 XAI


    # 理解可解释人工智能 (XAI) 的基础


    DARPA 最初的关注是在两个问题领域评估 XAI——即数据分析和自主性。他们认为，仅仅总结 AI 系统的内部逻辑不足以应对运营挑战，因为还需要帮助情报分析师从模型输出中过滤假阳性，并决定何时以及如何应用
    AI 支持的工作流能力。DARPA 的 XAI 计划遵循以用户为中心的方法，产生更具解释性的模型，设计用户界面，并根据心理需求创建充分的解释。他们聘用了了人在回路的心理学家来评估用户满意度、心理模型、任务性能和信任水平。为了识别更具解释性的模型，DARPA
    关注三个主要领域：


    - **深度解释**：通过审查深度设计选择来进行深度解释，包括训练数据来源、架构复杂度、训练序列、正则化、损失函数和优化技术。

    - **可解释模型**：探索作为贝斯规则列表（Bayesian rule lists）的可解释模型，以学习因果关系和可解释结构。

    - **模型归纳**：通过近似黑盒模型来导出可解释模型。


    除了推理 AI 系统外，DARPA 的 XAI 计划还旨在表征所学模型的优缺点。为期4 年的 DARPA XAI 计划于 2021 年结束，最终交付成果是开源的可解释人工智能工具包（XAITK;
    https://xaitk.org/），计划产物包括代码、论文和报告。XAITK 的目标是将 DARPA 的 XAI 研究整合到一个单一的公开访问仓库中，并为感兴趣的贡献者的未来研究提供运营能力。你可以在这篇论文阅读更多关于
    DARPA XAI 的信息：https://onelibrary.wiley.com/doi/10.1002/ai12.61。


    从那时起，以下动机成了 XAI 的增长：


    - **用户意图**：向用户解释模型输出——例如，为什么一个学生的大学申请被拒绝了？

    - **社会信任**：向公众提供解释，以培养对 AI 系统的信任和接受——例如，公众是否信任在推荐职位候选人时遵循伦理指南的 AI 系统？

    - **监管合规**：向审计员或监管机构解释算法逻辑以满足法律和伦理要求——例如，AI 系统能否解释会计中哪些特定交易被标记为异常？

    - **模型调试**：对模型产物的解释，使技术专业人员能够调试模型衰减

    - **业务利益**：为基于模型预测的业务决策提供解释——例如，在线零售商想要理解 AI 系统如何做出产品推荐以改进客户体验


    # 理解可解释人工智能 (XAI)


    机器学习模型可以是部分或完全可解释的。完全可解释的模型通常更有结构性，并遵循领域知识，使用相关变量提供关于决策如何得出的透明解释。相比之下，部分可解释的模型通常不受领域约束限制，并揭示了推理过程的关键要素。图
    2.2 比较了基于模型准确性和可解释性的机器学习算法。


    ![](img/c06290096a327475ed918ba4a4328b77_46_0.png)


    图 2.2 – 模型准确性与可解释性


    具有更多结构化功能细节的简单模型，如决策树、基于规则的算法和线性回归模型本质上是可以解释、可模拟且可分解的。相反，具有数百万参数和权重的深度学习网络等复杂算法被认为是黑盒模型，因为人类无法理解。


    目前的 XAI 成熟度尚未识别导致模型决策或预测的根源。尽管如此，XAI 方法专注于局部和全局可解释性，我们将在第 6 章中深入讨论。以下是对这两个概念的介绍：


    - **局部可解释性**解释了机器学习模型如何关联单个决策或预测特定结果。这种方法侧重于向用户解释模型决策背后的推理——例如，银行在根据 AI 生成的决策拒绝贷款申请时，可能接受审计以证明其可解释性。

    - **全局可解释性**通过研究模型学习（包括数据和算法的选择）提供模型整体行为的完整视图。这种方法向用户解释哪些元素影响了模型的决策——例如，公司的营销团队可能想知道哪些因素影响了模型的决策。


    XAI 技术适用于各种数据模态，包括图像、文本和表格数据。我们将在书的第二部分详细介绍通过**自然语言处理 (NLP)**、时间序列和计算机视觉来构建可解释异常检测器。


    本节强调了 XAI 的转折点和动机。下一节将比较 XAI 的两个方面：解释性和可解释性。


    # 区分解释性与可解释性


    XAI 有两个主要概念：解释性和可解释性。了解这些在文献中经常混用的术语的区别。


    在机器学习中，解释性是指对导出预测的工作机制提供人类可理解的解释——例如，欺诈检测模型预测某笔交易为欺诈，我们想知道它是得出这一结论的。


    相比之下，可解释性是指对预测的上下文理解——例如，我们想理解标记为欺诈的信用卡交易的严重程度和风险。简单来说，解释性关注“如何”和“为什么”，而可解释性强调的是“什么”。


    表 2 总结了解释性和可解释性的比较，其中解释性产生模型决策的推理，而可解释性衡量对模型行为的理解程度。


    | 解释性 (Explainability) | 可解释性 (Interpretability) |

    | :--- | :--- |

    | 对导出预测的工作机制提供人类可理解的解释 | 对预测的上下文理解 |

    | 模型训练后事后解释以评估模型的局部和全局解释性 | 内生可解释的算法，如决策树和线性模型 |

    | 模型如何预测欺诈？哪些参数导致了欺诈预测？ | 什么类型的欺诈？欺诈有多严重？ |


    表 2.1 – 比较解释性和可解释性


