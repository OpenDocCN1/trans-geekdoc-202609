    - **行业专家**：由于简单模型具有可解释性并满足监管要求，通常优于黑箱模型。XAI 帮助行业专家在考虑模型性能与可解释性的权衡时降低门槛。


    - **数据科学家**：模型开发是一个迭代过程。XAI 帮助数据科学家在整个 ML 生命周期中识别潜在的算法和数据偏差，以确保 AI 系统的可信度。


    - **终端用户**：自 2016 年诞生以来，欧盟（EU）《通用数据保护条例》（GDPR）实施了“解释权”，赋予数据主体从自动化决策系统中获得解释的权利。个人可以请求人工干预，以挑战影响其法律和财务权利的不公平决策——例如，一个被拒绝贷款的个人有权要求解释以证明该决策的合理性。


    AI 系统提供的解释主要作为一种工制品，引导用户根据模型输出决定下一步的操作。通常情况下，对模型结果和推理过程都了解的用户，其决策时间比只获得模型结果的用户要短。2.4
    展示了当前和理想的未来 XAI 状态，用户可以根据 AI 生成的解释识别最佳行动方案。


    # 无 XAI 的当前状态


    ![](img/c06290096a327475ed918ba4a4328b77_49_0.png)


    # 有 XAI 的未来状态


    ![](img/c06290096a327475ed918ba4a4328b77_49_1.png)


    图 2.4 – XAI 的未来状态


    AI 系统必须为用户产生有意义的解释。然而，“意义”的定义对于不同的用户群体可能有所不同。例如，对数据科学家有意义的解释可能并不适用于审计员。在这种情况下，数据科学家可能关注算法细微差别，而审计员通常寻找的是合理的保证。因此，收集直接的用户反馈并进行用户测试以验证验收标准至关重要。注意，用户对有意义解释的观点可以让他们对
    AI 系统感到更加舒适和熟悉。


    既然你已经理解了用户的可解释性需求，让我们在下一节中探索如何将 XAI 应用于异常检测。


    # 实现 XAI


    可解释性是构建异常检测深度学习解决方案的关键。XAI 效果的定性衡量通常涉及主观评分和对解释清晰度的用户反馈进行调查。定量方法（如不忠实度/infidelity
    和灵敏度/sensitivity）被用作显著性图解释的客观评估指标，基于解释捕捉预测器行为对扰动做出反应的程度。


    # 理解可解释 AI


    ML 生命周期涉及一个识别业务目标、建构特定 ML 问题、数据准备、模型开发和部署的循环迭代过程。在 ML 中引入 XAI 能够实现语境理解并增加可解释性。图
    2.5 展示了一个端到端的可解释深度学习异常检测循环。


    ![](img/c06290096a327475ed918ba4a4328b77_50_0.png)


    图 2.5 - 可解释深度学习异常检测生命周期


    - **业务问题**：构建异常检测 AI 系统的组织应该能够识别清晰的问题，并根据可量化的成功标准衡量业务价值。组织必须围绕业务问题构建 ML 问题，包括数据模态、目标预测、正常与异常情况以及性能指标。

    - **数据准备**：在识别可靠数据源后，组织必须执行数据处理任务，对数据进行接入、清洗、可视化、分析和转换以减轻潜在偏差。

    - **特征工程**：清洗后的数据现在可以用于特征工程，以提取模型训练的相关属性。检测特征偏差，性别、种族特征或社会地位等属性可能会对模型预测产生不利影响。

    - **模型开发**：此阶段涉及模型构建、训练、调优和性能评估，以实现预测精度。

    - **可解释性**：如果模型本身不是可解释的，此阶段通过检测算法内部由于错误假设导致的系统性误差来评估模型偏差。除了选择合适的 XAI 技术外，组织还对
    AI 生成的解释进行基准测试，以满足业务目标和用户直觉。无论你的算法有多强大，通过 XAI 识别假阳性和阴性结果对于确定最佳权衡至关重要。

    - **模型部署**：经过训练、调优和验证的模型已准备好部署和推理。监控概念漂移和数据漂移。


    正如你所注意到的，XAI 可以应用于模型开发之前、期间和之后。图 2.6 突出了构建模型时 XAI 的一些示例。


    ![](img/c06290096a327475ed918ba4a4328b77_51_0.png)


    图 2.6 - 构建模型时引入 XAI


    # 理解可解释 AI


    让我们回顾这些方法：


    - **预处理 XAI 技术**：重点在模型学习过程之前消除偏差，包括通过特征加权避免歧视，并确保多样性的平衡与包容性。示例包括探索性数据分析、可解释特征工程、数据集标准化和数据集摘要。

    - **处理中 XAI 技术**：在模型训练期间实施，旨在优化目标变量预测的同时最小化偏差。例如，公平性约束通过在模型内部强制公平条件来限制模型行为，对抗去偏差通过消除保护属性的暴露。

    - **后处理 XAI 技术**：在模型训练后应用，而不改变输入数据。常用方法包括扰动、反向传播和激活优化。


