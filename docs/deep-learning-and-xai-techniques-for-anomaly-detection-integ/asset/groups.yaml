    # Exploring Benchmarking Attribution Methods (BAM)


    SCS assesses the effectiveness of the XAI user interface in providing explanations
    to the target audience using a Likert scale questionnaire covering the scopes:


    +   * A given explanation offers causal factors with relevant granularity

    * The context of a given explanation makes sense to the user

    * Users can tune the granularity of the provided explanations

    * Users need guidance to interpret explanations

    * Users understand the causality of the generated explanations without support

    * Users can apply the capacity of the generated explanations with domain knowledge

    * An XAI system produces consistent explanations

    * Users agree that the generated explanations are easy to follow

    * Users need references or documentation to interpret the generated explanations

    * An XAI system explains promptly and efficiently


    SCS aims to provide a straightforward methodology to evaluate the effectiveness
    of an XAI user interface and the quality of explanations provided by SCS. Unlike
    the SUS score, which measures utility between 0 and 100, SCS normalizes the score
    to percentile ranking. Suppose the SCS scale ranges between 1 and 5 points for
    *strongly disagree, disagree, agree, and strongly agree* ratings. A perfect score
    of 50 is given if an XAI system meets all 10 requirements. For example, if the
    sum of the variations of an XAI system is 44 based on the preceding requirements,
    dividing by 50 gives a normalized 0.88 SCS score.


    The purpose of SCS is to provide a rapid evaluation framework to assess the quality
    of an XAI interface based on end user. One caveat with SCS is that the Likert
    scales follow ordinal measurement where the difference between each response category
    is not well-defined. Assuming the interval between response categories is equal
    can be misleading and may result in an erroneous conclusion. For example, the
    magnitude of emotional responses between strongly agree and agree could differ
    with other consecutive categories, such as strongly disagree and disagree. Furthermore,
    subjective user ratings on the explanation quality could misrepresent an explanation''s
    effectiveness in simulation tasks.


    After learning how to obtain qualitative feedback from users with SCS, the following
    section explores a quantitative approach to identify false positive explanations
    using benchmarking attribution methods.


    # Exploring Benchmarking Attribution Methods (BAM)


    With various feature attribution XAI methods available today, it can be challenging
    to quantify which

    inputs are indeed important to a model due to a lack of ground truth data. Relying
    solely on visual

    assessment can de-facto be misleading. XAI methods that compute gradients insensitive
    to the input data fail to'
  - '[PAGE 200]


    produce relevant explanations for desired target outputs, which can be detrimental
    in ML tasks, such as anomaly detection. For instance, research has shown that
    some XAI methods are unable to demonstrate true feature importance and produce
    identical visual explanations or saliency maps despite ranking a trained model''s
    parameters. For AI-assisted medical diagnosis, this can be risky and concerning
    when there is no change in explanations to a model''s prediction after randomizing
    a trained model''s data and parameters.


    There is no value in providing false positive explanations to the target audience.
    A common approach to address this gap involves *human-in-the-loop assessment*
    to evaluate the quality of explainability, which can be expensive with large datasets.
    Hence, XAI evaluation metrics should demonstrate the rationale of a model''s prediction
    by capturing false positives.


    BAM, https://doi.org/10.48550/arXiv.1907.09701, aims to tackle false positive
    explanations. BAM evaluates the accuracy of feature attributions using semi-synthetic
    datasets with trained models on known relative feature importance. BAM''s approach
    meets the NIST''s XAI principle to achieve explanation accuracy.


    BAM trains classifiers for detecting a target object class and background scene
    from an input image. The expectation is that adding irrelevant pixels to the input
    image should not impact the model''s ability to predict the expected target object
    or background scene class.


    For example, an input image of a desert with random inclusion of fish, as shown
    in Figure 9.2, should result in the expected target background scene as a desert
    class. Explanations that assign higher attributions to fish as the background
    scene class should be false positives. Such a false positive prediction can mislead
    the target audience because the fish is considered semantically more meaningful
    than the desert in this input image.


    ![](img/c06290096a327475ed918ba4a4328b77_200_0.png)


    Figure 9.2 – Input image with random object inclusion'
  - '[PAGE 201]


    BAM evaluates feature attribution methods using the following metrics:


    +   - Model contrast score (MCS): Given the same input, measure the difference
    in attribution between two models


    +   - Input dependence rate (IDR): Given two different inputs to the same model,
    calculate the difference in attribution


    +   - Input dependence rate (IIR): Given two functionally similar inputs to the
    same model, measure the difference in attribution


    MCS and IDR apply only to BAM datasets, https://github.com/google-research-datasets/bam,
    whereas IIR applies to all models and inputs. According to BAM''s observation,
    vanilla gradient descent and Gradient-weighted Class Activation Mapping (CAM)
    are less likely to produce false positives. In contrast, guided backpropagation
    seems to assign similar attributes regardless of evolution in feature importance.


    As discussed in Chapter 7, perturbation-based methods provide explainability by
    evaluating changes in model performance on removing a subset of pre-defined, highly
    attributed features from input data. Contrary to perturbation-based methods, BAM
    evaluates faithfulness by identifying unimportant features with their expected
    zero attributions. BAM does not make assumptions on pre-defined features. Instead,
    BAM''s approach focuses on assessing the significance of a feature relative to
    two different models by adjusting the frequency to introduce this feature in the
    dataset.


    Thus, far this section has reviewed how BAM can enhance explainability by analyzing
    relative feature importance. Next, let''s discuss the significance of faithfulness
    and monotonicity in benchmarking explainability.


    # Understanding faithfulness and monotonicity


    Faithfulness in XAI refers to evaluating the correlation between feature importance
    scores to the actual individual feature''s performance on a correct prediction.
    Measuring faithfulness is typically done by removing pre-defined important features
    incrementally, observing changes in model performance, and validating relevance
    to a model''s prediction. In other words, are the identified features genuinely
    relevant to the final model output?


    Besides feature importance correlation, researchers identified additional properties
    such as polarity consistency for evaluating the faithfulness of explanations,
    https://doi.org/10.48550/arXiv.2201.12114. Polarity in ML refers to positive and
    negative analysis – for example, the amount of positive and negative phrases for
    sentiment analysis. Polarity consistency validates faithfulness by measuring explanation
    weight based on their contribution and suppression effects on the model''s predictions.'
  - '[PAGE 202]


    # Explainability Evaluation Schemes


    Evaluating faithfulness meets the NIST''s XAI principles in assessing an XAI system''s
    ability to produce justifiable explanations and uncover knowledge limits. An explanation
    is considered faithful if the identified important features genuinely contribute
    to a model''s prediction.


    Figure 9.3 is a Venn diagram of faithfulness, encompassing feature importance
    correlation and polarity consistency:


    ![](img/c06290096a327475ed918ba4a4328b77_202_0.png)


    Figure 9.3 - Faithfulness Venn diagram


    In contrast, **monotonicity** in XAI evaluates feature attribution by adding pre-defined
    important features incrementally to validate feature relevance. The expectation
    is that model performance should increase gradually as important features are
    added incrementally. *Figure 9.4* compares faithfulness versus monotonicity in
    XAI evaluation:


    ![](img/c06290096a327475ed918ba4a4328b77_202_1.png)


    Figure 9.4 - Faithfulness versus monotonicity'
