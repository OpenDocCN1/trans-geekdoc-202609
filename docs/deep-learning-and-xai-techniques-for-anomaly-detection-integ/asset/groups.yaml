    # 理解时间序列的可解释性深度异常检测


    让我们学习每种趋势代表的含义：


    - 长期趋势（Secular trend）代表一种长期趋势，在可预见的未来内保持可预测的轨迹，或持续稳定的增长或减少方向移动。长期趋势的示例包括人口老龄化和计算能力。


    - 周期波动（Cyclical fluctuation）代表没有固定频率的逐渐波动，导致连续的扩张或收缩周期。例如，随着经济增长或失业率下降，消费者支出会增加。


    - 季节性变化（Seasonal variation）代表固定频率的系统性或预期性变化。例如，零售收入通常在假期期间增加，夏季的电费账单更高。


    - 不规则变化（Irregular variation）指的是随机、非均匀且非季节性的模式。不规则变化的示例包括异常的心电图（ECG）读数或自动取款机（ATM）的异常账户取款。


    在对时间序列结构有了基础理解的基础上，让我们下一节讨论深度学习异常检测方法。


    # 理解时间序列的可解释性深度异常检测


    由于异常在本质上是稀有的，许多深度学习模型从正常观测中学习特征表示，并通过测量与已知行为的偏差来检测异常。根据标记观测值的可用性，深度学习采用不同的方法，如监督、半监督和无监督。请参考第1章对这些方法进行对比。


    ![](img/c06290096a327475ed918ba4a4328b77_95_0.png)


    图4.2显示了时间序列深度学习异常检测的高级工作流，包含以下阶段：


    - 1. 深度学习模型接受时间步（timestep）或滑动窗口（sliding window）作为输入数据。A.- 时间步代表单个数据点，而滑动窗口指的是包含历史信息的时间步序列。通常，输入数据需要预处理任务（如填充缺失值和归一化），以提取最佳滑动窗口。


    - 2. 异常可能以点或子表面形式出现，并非每个观测值都是异常值。模型根据定义的损失函数计算异常评分，以确定预测是否偏离其他数据并应被标记为异常。本质上，异常评分表示异常的程度，使用为风险评估确定的阈值。


    - 3. XAI 旨在为模型的预测提供推理支持。事后解释方法（如 SHAP）常用于评估模型预测的质量。


    工作流中有三种类型用于时间序列异常检测的深度学习模型：


    - 基于预测的模型（Forecasting-based models）通过将预测值与实际值进行比较，预测新入的数据点或滑动窗口是否为异常值。偏差值成为异常值，用于识别异常行为。


    - 基于重构的模型（Reconstruction-based models）通过对正常滑动窗口输入的子序列进行编码，以在重构期间提供时间上下文。模型会生成重构误差，因为它们仅使用正常观测进行训练。重构误差根据阈值值对异常进行排名。


    - 混合模型（Hybrid models）结合了预测和基于重构的模型，以在时间序列中实现更好的学习，使用预测的时间戳预测和重构方法的潜在表示。


    在完成对时间序列异常检测深度学习方法的概述后，让我们下一节探索一个使用基于重构的模型检测时间序列异常，并使用 SHAP XAI 方法评估预测质量的示例。


