    ![](img/c06290096a327475ed918ba4a4328b77_195_0.png)


    Figure 8.29 – Choosing model-agnostic versus model-specific XAI methods


    As shown in the previous diagram, starting with a trained model, if you can obtain
    the inner structure, such as coefficient weights or the frequency of a feature
    used in an ensemble tree, you should explore a model-specific framework for better
    explainability performance. Otherwise, you should evaluate a model-agnostic framework
    since it does not rely on an internal model structure and focuses on correlating
    the relationship between the input and output. Subsequently, consider the scope
    of explainability, whether you will provide local explanations for individual
    predictions or global explanations for the overall model behavior.


    # Summary


    Awareness of explainability with AI systems is not limited to technological advancement
    in XAI techniques. Instead, it involves a multi-disciplinary collaboration to
    review legal, ethical, and societal questions comprehensively. You should be aware
    that the guiding explanations facilitate further model behavioral probing and
    debugging.


    So, why can''t we use model-agnostic methods for everything? Although model-agnostic
    methods have broad applicability, they often have a lower efficiency than model-specific
    methods. If you need targeted explanations and the internal model structure is
    known, choose model-specific methods for efficiency. Otherwise, model-agnostic
    models are a good starting point. Combining model-agnostic and model-specific
    techniques is recommended when you need to provide a comprehensive evaluation
    of the model''s prediction.


    You gained deeper insights into model-agnostic and model-specific XAI techniques
    in this chapter. Coupled with two practical examples, you learned that model-agnostic
    methods explain a model''s prediction regardless of the ML algorithm, whereas
    model-specific methods are designed to efficiently explain a specific model type.
    So, here is food for thought, can we trust AI-generated explanations? In the next
    chapter, we will explore XAI benchmarking schemes and evaluation methodologies
    to discuss this topic further.


    # Explainability Evaluation Schemes


    According to the World Economic Forum, https://www.weforum.org/agenda/2022/01/artificial-intelligence-ai-technology-trust-survey/,
    approximately 60% of adults believe artificial intelligence (AI) systems will
    transform their daily life. In contrast, only 50% say they trust AI technology.
    Advances in AI systems and calibrating trust require a balancing act between speed,
    transparency, and fairness.


    Generally, Explainable AI (XAI) systems provide explainability by generating explanations
    for individual predicted instances or describing how a model derives a prediction.
    Existing XAI approaches fall into two main categories: they favor interpretable
    models or assess change.


    The National Institute of Standards and Technology (NIST), in their paper, Four
    Principles of Explainable Intelligence, identifies four fundamental principles
    for XAI:


    - **Explanation**: An XAI system must produce evidence to justify machine learning
    (ML) outputs

    - **Meaningful**: Evidence produced by XAI system must be comprehensible by the
    target audience

    - **Explanation accuracy**: Explanations demonstrate correct reasoning

    - **Knowledge limits**: An XAI system operates within design boundaries and confidence
    limits


    # Explainability Evaluation Schemes


    > Phillips, P., Hahn, C., Fontana, A., Yates, K., Greene, D. and Przybicki, M.
    (2021), Four Principles of Explainable Intelligence, NIST Interagency/Internal
    Report (NISTIR 8312), National Institute of Standards and Technology, Gaersburg,
    MD, [online], https://doi.org/10.6028/NIST.IR.8312,https://tsaps.nist.gov/publication/get_pdf.cfm?pub_id=93399
    (Accessed December 12, 2022).


    Hence, must define an AI governance model that provides guards without slowing
    innovation and adoption. The goal is to achieve optimal confidence in AI systems
    and avoid distrust between humans and machines. Figure 9.1 summarizes key design
    considerations for XAI systems.


    | User | XAI Goals | Information | Benchmark |

    |---|---|---|---|

    | Who is the target audience? | What to explain? | How to explain? | How to evaluate
    explanations? |


    Figure 9.1 - XAI system design considerations


    So far, you have learned and experienced with various XAI techniques throughout
    the book. In this chapter, we cover the following evaluation schemes based on
    NIST’s fundamental principles to measure the quality of explanations for XAI systems:


    - Review the System Causability Scale (SCS)

    - Exploring Benchmarking Attribution Methods (BAM)

    - Faithfulness and monotonicity

    - Human-grounded evaluation framework


    In this chapter, you will learn about the existing XAI evaluation and benchmarking
    landscape and get a sense of which approach to consider for your applications.


    # Review the System Causability Scale (SCS)


    Created in 1986 by John Brooke, the System Usability Scale (SUS) provides a simple
    tool to measure the usability of a system’s user interface. It consists of a 10-item
    questionnaire with 5 options, allowing respondents to evaluate the quality of
    products and services from strongly agree to strongly disagree.


    Inspired by SUS, SCS, available at https://doi.org/10.1007/s13218-020-00636-z,
    focuses on measuring the qualitative aspect of XAI systems. SCS meets the XAI
    principle of meaningfulness by NIST to determine end user perception after explanations
    provided by XAI systems.

