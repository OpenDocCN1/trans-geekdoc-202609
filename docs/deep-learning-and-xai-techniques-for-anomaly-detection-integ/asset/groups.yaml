    # Understanding Explainable AI


    An ML model can be partially or fully explainable. Fully interpretable models
    are generally more structured and follow domain knowledge by using correlated
    variables to provide transparent explanations of how a decision is derived. In
    contrast, partially interpretable models are often not bound by domain constraints
    and reveal essential elements of a reasoning process. Figure 2.2 compares ML algorithms
    based on model accuracy and interpretability.


    ![](img/c06290096a327475ed918ba4a4328b77_46_0.png)


    Figure 2.2 – Model accuracy versus interpretability


    Simpler models with more structured functional details, such as decision trees,
    rule-based algorithms, and linear regression models are intrinsically interpretable,
    simulatable, and decomposable. In contrast, complex algorithms such as deep learning
    networks with millions of parameters and weights are considered black-box models,
    since they are not understood by humans.


    The current XAI maturity level has yet to identify the root cause leading to a
    model decision or prediction. Nevertheless, XAI methods focus on local and global
    explainability, which we will discuss in depth in Chapter 6. Here is an introduction
    to the two concepts:


    +   - **Local explainability** explains how an ML model relates an individual
    decision or predicts a specific outcome. This approach focuses on explaining to
    a user the reasoning behind a model''s decision – for example, a bank might be
    audited to demonstrate explainability when declining a loan application based
    on an AI-generated decision.

    - **Global explainability** provides a holistic view of the overall model behavior
    by investigating model learning, including the choice of data and algorithms.
    This approach explains to a user what elements influence a model''s decision-making
    – for example, a company''s marketing team might want to know how an ML model
    predicts the likelihood of a customer enrolling in a subscription.


    XAI techniques apply to various data modalities, including images, text, and tabular
    data. Choosing the appropriate XAI technique for the relevant data type is crucial
    in detail how to build explainable anomaly detectors as a source of explanations.
    We will walk through in detail **natural language processing (NLP)**, time series,
    and computer vision in Part 2 of the book.


    This section highlights the inflection point and motivations of XAI. The following
    section compares two aspects of XAI, explainability and interpretability.'
