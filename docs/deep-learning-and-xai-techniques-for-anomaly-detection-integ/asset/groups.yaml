    \ We will walk through an example of explaining an image classifier using LIME.\n\
    \n## Post hoc global explainability\n\nML models learn by training with a large\
    \ amount of data to derive knowledge into structure and parameters. Traditional\
    \ pipelines use feature engineering to transform raw data into features. ML models\
    \ then map the learned representation to outputs.\n\nPost hoc global explainability\
    \ generally focuses on feature importance by assessing model accuracy deviates\
    \ from the values of a specific feature, which is an iterative process using a\
    \ modified dataset to predict scores for all features.\n\nGenerally, learned representations\
    \ from *deep neural network (DNN)* models are not human-interpretable. Hence,\
    \ deep learning explanations rely on understanding the inner layer representations.\
    \ For instance, the activation mapping framework helps identify preferred inputs\
    \ for specific layers of neurons for CNNs by evaluating the quality of generated\
    \ images corresponding to neuron activations, providing the context of global\
    \ structure.\n\n## Post hoc local explainability\n\nPost hoc explainability aims\
    \ to provide explanations for individual predictions by identifying input features\
    \ attributing to model behavior. Popular post hoc explainability methods include\
    \ local approximation-based and perturbation-based explanation frameworks.\n\n\
    The local approximation-based explanation framework uses if-then rules to reproduce\
    \ individual predictions within the range of inputs using an interpretable model.\
