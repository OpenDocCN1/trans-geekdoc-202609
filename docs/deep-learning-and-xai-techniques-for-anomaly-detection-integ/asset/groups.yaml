    Figure 9.5 shows a plot for visualizing various metrics in quantifying the extent
    of faithfulness for an explanation:


    ![](img/c06290096a327475ed918ba4a4328b77_203_0.png)


    Let''s understand what each faithfulness metric represents and its scale in quantifying
    faithfulness:


    +   **Decision Flip – Most Informative Token (DFMIT):** This measures faithfulness
    between 0 and 1. A score of 1 means the explanation is faithful. An explanation
    is faithful if it demonstrates valid reasoning for a model''s prediction. For
    example, measuring faithfulness in **natural language processing (NLP)** using
    DFMIT is by observing the average percentage in a model''s decision flips after
    removing the highly important token from the test dataset.

    **Decision Flip – Fraction of Tokens (DFFOT):** Here, the lower the DFFOT value,
    the more faithful it is to an explanation. Like DFMIT, instead of removing the
    highly important token as a whole, DFFOT observes the percentage of decision flips
    by measuring the minimum fraction or threshold of important features to be removed
    that causes a change in the model''s predictions.

    **Comprehensiveness (COMP):** This measures an explanation''s faithfulness based
    on the representation and distribution of important features. A COMP score is
    calculated based on the change in output probability due to important feature
    removal. To test an explanation''s comprehensiveness, create a contrasting example
    and remove the predicted probability The difference between the original and new
    predicted probability yields the COMP score. The higher the COMP score, the more
    faithful it is to an explanation.

    **Sufficiency (SUFF):** This measures faithfulness by evaluating whether important
    features contain sufficient information to retain the original prediction. SUFF
    augments COMP by assessing the continuous importance of a feature to the model.
    For example, removing a subset of known influential tokens or phrases from an
    NLP classifier should cause a change in the predicted probability. SUFF measures
    the average percentage change in this classifier, starting'
