    自然语言处理（NLP）的演变始于 20 世纪 50 年代的机器翻译将俄语翻译成英语。计算能力和大数据的出现激发了 NLP 创新，导致了语言学、计算机科学和人工智能的一个新子领域。图
    3.1 显示了 NLP 与其他学科的交叉点：


    ![](img/c06290096a327475ed918ba4a4328b77_59_0.png)


    我们周围有大量的非结构化文本数据用于 NLP 任务，例如文本分类、主题建模和意图检测。NLP 使计算机能够大规模地理解和分析大量的书面和口语人类语言。目标是使语言细微差别上下文化并提取有用信息以获得价值见解。


    深度学习彻底改变了许多 NLP 应用，包括文本摘要、机器翻译和问答。尽管准确率很高，但其不透明性挑战了深度学习模型的解释性。此外，讽刺、俚语和多义等常见语言挑战增加了处理文本数据的复杂性。NLP
    解释性旨在揭示神经网络的内部表示，例如 transformer 模型。


