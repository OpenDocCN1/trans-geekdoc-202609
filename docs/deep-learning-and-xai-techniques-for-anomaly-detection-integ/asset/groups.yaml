    - **Model Deployment**: A trained, tuned, and validated model is ready for deployment
    and inferences. Monitor the model for concept and data drifts.


    As you may have noticed, XAI can be applied before, during, and after model development.
    Figure 2.6 highlights some examples of XAI when building models.


    ![](img/c06290096a327475ed918ba4a4328b77_51_0.png)


    Figure 2.6 - Incorporating XAI when building models


    # Understanding Explainable AI


    Let''s review these approaches:


    - **Pre-processing XAI techniques**: These focus on removing bias before the model
    learning process, including feature weighting to avoid discrimination and ensuring
    a balanced and inclusive representation of diversity. Examples include exploratory
    data analysis, explainable feature engineering, dataset standardization, and dataset
    summarization.

    - **In-processing XAI techniques**: These are implemented during model training
    to optimize target variable prediction while minimizing bias. For example, fairness
    constraints restrict model behavior by enforcing fairness conditions within a
    model, adversarial debiasing removes exposure of protected attributes.

    - **Post-processing XAI techniques**: These are applied after a model is trained
    without changing the input data. Common methodologies include perturbation, backpropagation,
    and activation optimization.

