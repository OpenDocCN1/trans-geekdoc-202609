    ## 反向传播与扰动 XAI 的对比


    在回顾了反向传播和扰动之后，让我们比较这些 XAI 技术的优缺点。


    通常，反向传播在通过网络进行单次反向传播生成所有输入特征的重要性评分方面比基于扰动的 XAI 方法更高效。然而，基于反向传播的 XAI 方法通常容易受到影响，并且需要模型的内部信息。虽然与图像区域相关的特征归因看起来直观，但相邻像素可能会出现巨大的归因分配差异，这是反向传播方法的缺点。此外，模型特征缺乏粒度可能导致其与输出变化的相关性不一致，导致解释的忠实度较低。


    相比之下，基于扰动的方法适用于任何深度学习模型，无论其架构如何。与反向传播的方法相比，它们的噪声较少。通过创建变体对象，扰动方法通过增量评估评估模型的可解释性。尽管广受欢迎，但基于扰动的
    XAI 方法通常依赖于输入模态，无法捕捉通的网络特征。此外，评估所有可能的特征集可能非常耗时且耗资源。


    静态图像的扰动通常比具有独特特征的文本数据和具有时间维度的视频更直接。因此，基于扰动方法的进展更多地围绕图像分类，为未来对其他数据类型的扰动研究留下了空间。扰动方法对实例的微小修改敏感，会导致输出的剧烈偏差。


    构建一个可靠的 XAI 系统不仅是解释模型的预测。任务关键型和安全关键型应用需要与其原始模型一致的忠实解释。例如，XAI 系统必须产生准确且忠实的解释，将病理图像分类为恶性，以便临床医生能够有信地专注于调查感兴趣区域（ROI）。


    我们是否能统一反向传播和基于扰动的方法，以便在复杂黑盒模型的事后解释中结合两者之长？为了在预测准确率之外实现解释性方面做出持续努力，目前出现了一种统一这两种方法的需求，例如
    DeepExplain，https://github.com/marcoananca/DeepExplain。


    解释性驱动可解释性。然而，解释性并不等同于因果关系。在考虑计算效率和泛化能力之外，在设计 XAI 系统时引入领域专家对于检测潜在偏差、确保模型行为和验证预测质量至关重要。


