    ## Understanding Deep Learning Anomaly Detection


    Anomaly detection is an active research field widely applied to many commercial
    and mission-critical applications, including healthcare, fraud detection, industrial
    predictive maintenance, and cybersecurity. It is a process of discovering outliers,
    abnormal patterns, and unusual observations that deviate from established normal
    behaviors and expected characteristics in a system, dataset, or environment.


    Many anomaly detection applications require domain-specific knowledge to extract
    actionable insights in a timely manner for informed decision-making and risk mitigation.
    For example, early detection of equipment performance degradation prevents unplanned
    downtimes, whereas early discovery of disease threats prevents a pandemic outbreak.


    The advent of cloud technologies, unlimited digital storage capacity, and a plethora
    of data have motivated deep learning research for anomaly detection. Detecting
    outliers requires an enormous dataset because anomalies are rare in the presence
    of abundance. For example, detecting abnormal machinery vibrations and unusual
    power consumption or temperature allows companies to plan for predictive maintenance
    and avoid expensive downtime.


    Deep learning anomaly detection has shown promising results in addressing challenges
    with the rare nature of anomalies, complex modeling of high-dimensional data,
    and identifying anomalous classes. The primary interest in anomaly detection is
    often focused on isolating undesirable data instances, such as product defects
    and safety risks, from the targeted domain. Other interests include improving
    model performance by removing noisy data or irrelevant outliers and identifying
    emerging trends from the dataset for a competitive advantage.


    This chapter covers an overview of anomaly detection with the following topics:


    - Exploring types of anomalies

    - Discovering real-world use cases

    - Considering when to use deep learning and what for

    - Understanding challenges and opportunities


    Understanding Deep Learning Anomaly Detection


    By the end of this chapter, you will have an understanding of the basics of anomaly
    detection, including real-world use cases, and the role of deep learning in accelerating
    outlier discovery. You will also have gained a sense of existing challenges and
    growth potential in leveraging deep learning techniques for anomaly detection.


    ## Technical requirements


    For this chapter, you will need the following components for the example walkthrough:


    - PyOD - An open-source Python library for outlier detection on multivariate data

    - Matplotlib - a plotting library for creating data visualizations

    - NumPy - An open-source library that provides mathematical functions when working
    with arrays

    - Pandas - A library that offers data analysis and manipulation

    - Seaborn - Matplotlib-based data visualization

    - TensorFlow - An open-source framework for building deep learning


    Sample notebooks and requirements are available at https://github.com/PacktPublishing/Deep-Learning-and-XAI-Techniques-for-Anomaly-Detection/tree/main/Chapter-1.


    You can experiment with this on SageMaker Studio, https://aws.amazon.com/sagemaker/studio-lab/,
    a free development environment that provides 12 hours of CPU or 4 hours of GPU
    per session at no cost.


    ## Exploring types of anomalies


    Before choosing appropriate algorithms, a fundamental understanding of what constitutes
    an anomaly is essential to enhance efficiency. Anomalies manifest in many shapes
    and sizes, including objects, vectors, events, patterns, and observations. They
    can exist in static entities or temporal contexts. Here is a comparison of different
    types:


    - Point anomaly exists in any dataset where an individual data point is outside
    the boundary of normal distribution. For example, expensive credit card purchase
    is a point anomaly.

    - Collective anomaly only occurs when a group of related data records or sequences
    of observations appear collectively and significantly differ from the remaining
    dataset. A spike of errors from multiple systems is a collective anomaly.

    - Contextual anomaly occurs when viewed against contextual attributes as day and
    time. An example is a sudden increase in online orders outside of peak shopping
    hours.


    An anomaly has at least one (univariate) or multiple attributes (multivariate)
    in numerical, binary, continuous, or categorical data types. These attributes
    describe the characteristics, features, and dimensions of an anomaly. Figure 1.1
    shows examples of common anomaly types:


