    # # Explainability Evaluation Schemes


    According to the World Economic Forum, https://www.weforum.org/agenda/2022/01/artificial-intelligence-ai-technology-trust-survey/.approximately
    60% of adults believe artificial intelligence (AI) systems will transform their
    daily life. In contrast, only 50% say they trust AI technology. Advances in AI
    systems and calibrating trust require a balancing act between speed, transparency,
    and fairness.


    Generally, Explainable AI (XAI) systems provide explainability by generating explanations
    for individual predicted instances or describing how a model derives a prediction.
    Existing XAI approaches fall into two main categories: they favor interpretable
    models or assess change through model manipulation.


    The National Institute of Standards and Technology (NIST), in their paper, Four
    Principles of Explainable Artificial Intelligence, identifies four fundamental
    principles for XAI systems (https://www.nist.gov/publications/four-principles-explainable-artificial-intelligence):


    +   - **Explanation**: An XAI system must produce evidence to justify machine
    learning (ML) outputs

    - **Meaningful**: Evidence produced by an XAI system must be comprehensible by
    the target audience

    - **Explanation accuracy**: Explanations demonstrate correct reasoning that preserves
    the justification of an ML output

    - **Knowledge limits**: An XAI system operates within design boundaries and confidence
    limits'
