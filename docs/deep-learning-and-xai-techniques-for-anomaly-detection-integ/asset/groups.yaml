  mdcn: "\n生成翻译时使用的句子。用户通过可视化单个预测的权重矩阵和注意力评分（attention scores）来理解基于注意力模型所利用的重要元素。\n\
    \n在本节中，你已经学习了内源解释性。接下来，让我们来探索事后解释性（post hoc explainability）。\n\n## 理解事后解释性\n\n\
    事后解释性是指在模型训练后应用解释性技术。通常，事后解释性方法通过关联特征与预测结果来近似模型行为。然而，在使用这些方法时，评估解释的质量（例如我们在第 9\
    \ 章将回顾的*忠实性*和*单调性*）至关重要。本节讨论了如何在局部和全局实现事后解释性。我们将通过一个使用 LIME 解释图像分类器的示例。\n\n##\
    \ 事后全局解释性\n\nML 模型通过使用大量数据训练来学习，并将知识转化为结构和参数。传统的流水线使用特征工程将原始数据转换为特征。然后 ML 模型将学习到的表示映射到输出。\n\
    \n事后全局解释性通常通过评估模型准确率偏离特定特征值的程度来关注特征重要性，这是一个使用修改后的数据集预测所有特征评分的迭代过程。\n\n通常，来自*深度神经网络\
    \ (DNN)* 模型的学习表示表示不是人类可解释的。因此，深度学习解释依赖于理解内部层表示。例如，激活映射框架（activation mapping framework）通过评估与神经元激活对应的生成图像质量，帮助识别\
    \ CNN 中特定神经元层的首选输入，提供了全局结构的上下文。\n\n## 事后局部解释性\n\n事后解释性旨在通过识别归因于模型行为的输入特征，为单个预测提供解释。流行的事后解释性方法包括基于局部近似和基于扰动的解释框架。\n\
    \n基于局部近似的解释框架使用 if-then 规则，利用可解释模型在输入范围范围内重建单个预测。相比之下，基于扰动的解释通过衡量特征在被省略（omission）或遮挡（occlusion）改变时预测评分的变化情况来确定特征归因，从而产生反事实解释。然而，在某些情况下，省略特征可能是不可行的，而遮挡可能会引入新信息，导致意外的结果。\n\
    \nLIME 是一种流行的局部近似和基于扰动的框架，它为单个预测提供事后解释。它对实例的局部邻域进行扰动，以学习可解释的稀疏线性模型作为解释。LIME 还通过突出文本和视觉伪迹中实例元素之间的关系，为模型的预测提供定性解释。\n\
