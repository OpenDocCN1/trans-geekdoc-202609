    ## 理解深度学习异常检测


    异常检测是一个活跃的研究领域，广泛应用于许多商业和任务关键型应用，包括医疗保健、欺诈检测、工业预测性维护和网络安全。它是一个发现偏离系统、数据集或环境中既定正常行为和预期特征的离群值、异常模式和异常观测值的过程。


    许多异常检测应用需要领域特定知识，以便及时提取可操作的见解，以做出明智决策并降低风险。例如，设备性能下降的早期检测可以防止非计划的停机，而疾病威胁的早期发现可以防止疫情爆发。


    云技术的出现、无限的数字存储容量以及海量数据促使了用于异常检测的深度学习研究。检测离群值需要巨大的数据集，因为在数据充足的情况下，异常是稀少的。例如，检测机器异常振动以及异常的能耗或温度，允许公司规划预测性维护并避免昂贵的停机时间。


    深度学习异常检测在解决异常的稀缺性、高维数据的复杂建模以及识别异常类别等挑战方面显示出良好的前景。异常检测的主要兴趣通常集中在从目标领域隔离出不受理想的数据实例（例如产品缺陷和安全风险）。其他兴趣包括通过删除噪声数据或无关的离群值来提高模型性能，以及从数据集中识别新兴趋势以获得竞争优势。


    本章概述了异常检测，涵盖以下主题：


    - 探索异常的类型

    - 发现现实世界的应用用例

    - 考虑何时以及为何使用深度学习

    - 理解挑战与机遇


    理解深度学习异常检测


    在本章结束时，您将理解异常检测的基础知识，包括现实世界的应用用例以及深度学习在加速离群值发现中的作用。您还将对利用深度学习技术进行异常检测的现有挑战和增长潜力有所感知。


