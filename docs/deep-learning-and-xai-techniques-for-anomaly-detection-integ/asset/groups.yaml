    神经元包含一个激活函数，通过输出层产生预测。图 1.19 展示了一个基础深度学习架构：


    ![](img/c06290096a327475ed918ba4a4328b77_40_0.png)


    异常检测技术通常分为三类：


    - **监督异常检测**：使用不平衡的标记数据集训练 ML 模型，其中每个实例都被归类为正常类或异常类。如果有地面真值（ground truth）或实际观测值，这种方法是可行的。异常检测模型通过确定与训练数据集分布相同的未见数据离群值的类别。监督异常检测的局限性包括异常样本稀缺以及在识别正常类精确表示方面存在挑战。

    - **半监督异常检测**：使用大量未标记数据集，辅以少量针对预期行为的标记数据来训练 ML 模型。这种方法假设离群值与训练数据集的分布不同。因此，由于异常很少，半监督比检测离群值更具适用性。

    - **无监督异常检测**：使用包含正常和异常观测值的未标记数据集训练 ML 模型。这种方法假设正常和异常观测值通常孤立在高密度和低密度区域。异常检测器寻找低密度区域中的实例或潜在的离群值。


    ## 理解挑战与机遇


    除了识别未见数据的类别外，异常检测算法还可以产生异常评分以量化严重程度，帮助企业确定可接受的影响阈值并管理风险容忍水平。


    异常检测的重要性在许多关键任务领域都是显而易见的。在选择深度学习与传统异常检测方法时，请考虑业务目标、数据规模和训练时间的权衡，例如算法的可扩展性、模型灵活性、解释性和可解释性。


    深度学习方法能够且理想地处理大型数据集和复杂问题。如果你的业务目标是发现大型数据集中的隐藏模式，深度学习可以提取并关联许多相互依赖之间的关系。否则，如果你的数据量较小，传统方法可能是很好的开始。


    训练深度学习异常检测模型可能是计算密集型且耗时的，这取决于参数的数量和可用的基础设施（如图形处理器/GPU）。随着深度学习模型规模和复杂性的增长，需要更多的计算力。相反，传统的异常检测方法可以在廉价的硬件上更快地运行和训练，仅需几小时。


    传统的由专家手动创建的基于规则的异常检测方法的可扩展性不足，无法处理高维数据且难以维护。例如，为每种可能的恶意行为开发安全规则并保持其更新是挑战性的。相比之下，深度学习异常检测方法通过隐藏层在嵌套层次中增量学习和提取特征，更具适应性。


    本节涵盖了深度学习的基础和通用实践。在接下来的章节中，我们将讨论深度学习异常检测的已知挑战以及 XAI（解释人工智能）在该领域的未来机遇。


    ## 理解挑战与机遇


    计算资源的丰富和可用数据的增加加速了多年异常检测技术的演进。根据国际数据公司（IDC）的数据 https://www.statista.com/statistics/871513/worldwide-data-created-digital/，在
    COVID-19 期间产生的 64.2 兆字节数据中，少于 2% 留到了 2021 年，这为大数据分析和异常检测带来了巨大的机遇。然而，高假报率、异常样本稀缺和分布不平衡等挑战仍然普遍。


    建立正常行为与异常行为的边界在异常检测中至关重要。然而，由于异常的动态性质，这并不总是一项简单的任务。例如，当恶意攻击者不断适应时，定义正常行为是一个移动的目标，且对于异常检测算法来说是合理的任务。噪声和标记错误的数据可能导致良性记录显示为异常观测值。异常记录可能被聚合数据或隐藏趋势的掩盖而漏检。此外，输入数据和特征的变化可能会发生漂移，导致当前的正常行为概念失效。


    通常，除了 ML 可以改进决策和运营效率外，随着预测准确性和复杂性的增加，公司在模型性能与可解释性（为了满足审计和监管合规性）之间的权衡陷入挣扎。例如，个人根据欧盟（EU）《通用数据保护条例》（GDPR）享有“解释权”。因此，在不同采纳
    ML 成熟程度的企业中，对解释性的意识日益增强。


    了解了关键点后，让我们探索下一代深度学习异常检测实践的一些未来研究重点和机遇。与其专门使用监督技术拟合标记的异常样本，或使用无监督方法进行训练，人们对使用部分标记异常数据的**弱监督异常检测**兴趣日益增加，希望获得两者的兼得。弱监督异常检测旨在通过少量准确标记的样本增强模型学习，并继续探索未见的异常。


    大多数深度学习方法关注**点异常**。如气候控制和机电系统等复杂的互连设备为**多模态异常检测**提供了新机会。当一个或多个维度超过或低于预期值范围，或者多个维度之间不相关时，就会发生多维异常。


    XAI 是一个新兴的研究领域，研究通过工具和框架来提供人类可读的解释，并通过量化因素增加对模型预测的信心。XAI 在异常检测中的早期阶段基于规则的专家系统，由人类专家制定规则和系统知识，使其具有内在解释性。对可解释和可操作深度学习异常检测的进一步研究对于解释模型决策和减轻潜在偏差具有重要意义。


    ## 总结


    尽管存在上述挑战，异常检测高度适用于各个领域，并将保持一个多样化的研究领域。在本章中，你学习了异常检测的基础、实际行业用例，以及深度学习与传统异常检测方法的权衡考虑。你还完成了两次演示，并探索了该领域的挑战和令人兴奋的机遇。在下一章中，我们将讨论
    XAI 及其对异常检测的意义。


    ## 2

    ## 理解解释人工智能


    2012 年 ImageNet 的突破加速了深度学习革命，并演变为 2015 年对解释人工智能（XAI）的关注，由美国高级研究计划局（DARPA）发起，由于对这些透明系统的研究兴趣增加。考虑到高风险情况下隐藏的担忧，DARPA
    在 2017 年 5 月启动了 XAI 项目，旨在开发用户可以理解并信任的 AI 系统。


    在过去的几十年里，AI 以以前未有的速度进化，到了不需要人工干预的程度。虽然深度学习在解决复杂问题方面日益成熟，这些进步引发了对 AI 社会影响和伦理含义的担忧。


    XAI 是一个新兴的研究领域，专注于研究解释 AI 系统内部机制的方法、工具和框架。XAI 的目标是满足利益相关者的兴趣和期望。例如，https://ieexplore.ieee.org/document/9785199
    讨论了一个 XAI 案例研究，为声学学家和皮肤科医生提供了关于 ML 模型如何检测黑色素瘤或痣病变的异常的信息和解释。该模型封装了来自皮肤成像协作组织（ISIC）的
    10,000 张图像的数据集知识。除了使用解耦推验变分自动编码器（DIP-VAE）检测皮肤病变异常外，模型还根据医疗指南对评估皮肤状况的对称性、边界和颜色提供解释。


    在本章中，我们将探索以下 XAI 主题：


    - 理解 XAI 的基础

    - 回顾 XAI 的意义

    - 选择 XAI 技术


    在本章结束时，你将了解到更多关于 XAI 及其对异常检测的意义，包括业务影响、社会影响和监管合规性。


    '
