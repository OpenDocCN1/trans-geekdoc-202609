    While the perturbation-based XAI technique produces intuitive explanations such
    as attribution maps, the output can be sensitive to tiny perturbations. In contrast,
    the gradient-based XAI method generates more robust explanations, which might
    not be faithful to the original model. Chapter 7 covers perturbation and gradient-based
    XAI techniques in more depth.


    +   Determine success criteria: Interpretability can be subjective with respect
    to a user''s preferences, experiences, subject matter knowledge, beliefs, and
    cultural influence. An organization might decide what explanations generated by
