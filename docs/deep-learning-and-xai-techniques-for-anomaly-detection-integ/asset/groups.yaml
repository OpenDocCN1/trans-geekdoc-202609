    # 序言


    我很荣幸受邀为本有趣且实用的书籍写序言。作为 Amazon Web Services (AWS) 的首席布道师，我看到我们的客户渴望使用机器学习来规模化解决许多不同类型的现实世界问题。得益于云端海量的存储和计算能力，他们能够应对在十年前尚不切实际甚至无法完成的挑战。


    本书详细探讨了这些挑战之一：利用所有这些存储和计算能力，创建可以准确高效地检测隐藏在其中的异常的机器学习 (ML) 模型。


    当我想到异常检测时，我会立刻想到我的直觉，那种觉得某些地方不对劲的“蜘蛛感”。你懂那种感觉吧，内心深处的早期警报，你的潜意识似乎比你先察觉到了，对吧？那是你的内部异常检测器在工作，使用了你可能没有意识到自己已经设置的规则和模式。


    而机器学习驱动的异常检测，就是我那无法解释的“蜘蛛感”的科学化、数学上严谨且可扩展的版本。本书将向你展示如何构建异常检测器，并将其应用于各种任务关键型场景——如欺诈检测、预测性设备维护等。虽然它将为你提供坚实的理论基础，但还会向你展示如何将理论投入实践。事实上，在读完第四页之前，你就能学会如何设置
    SageMaker Studio Lab！


    早期的模型是黑箱，无法提供关于它们如何做出预测的任何见解。随着机器学习从实验室走向生产环境，有远见的人意识到了合理的疑虑并提出了问题：模型是如何做出决策的？模型是否存在偏见？我们凭什么应该信任它来做出任务关键的决策？


    最后，本书还将带你进入可解释人工智能（或简称 XAI）这一重要课题。拥有数百万个参数和数十亿个权重，复杂的模型初看起来似乎超出了人类的理解范围。幸运的是，事实并非如此。当你在完成每一章中的示例时，你将学习如何利用解释来赢得用户的信任，确保符合你的目标，并确保模型能够准确反映你的业务需求。


    我希望你从从书中中学到很多知识（我知道我学到了很多），并且能够在几天内应用这些收获。


    祝你好运，并随时告诉我进展如何！


    Jeff Barr


    Amazon Web Services 副总裁兼首席布道师


