    +   - Article 15: "Right of access to the data subject" (https://gdpr-info.eu/art-15-gdpr/).
    This states that the data subject is entitled to obtain explanations about the
    logic involved with automated decision-making processes.


    +   - Article 22: "Automated individual decision-making, including profiling"
