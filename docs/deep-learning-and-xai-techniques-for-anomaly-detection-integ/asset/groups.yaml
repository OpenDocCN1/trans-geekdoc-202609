    # 模型特定的可解释性


    在本节中，你通过比较 IG（积分梯度）和 Guided IG（引导积分梯度）完成了对显著性技术的评估流程。传统上，反向传播方法通过评估对应于输入图像的梯度来识别像素归因，并使用特定神经网络中的加权梯度生成显著性图。IG
    的路径从一条黑线开始，通过遵循所有像素以相同速率增加的方向最终到达输入图像，在此过程中捕捉了许多无关的像素。尽管 IG 检测到了大多数阻碍因素，但 Guided
    IG 表现出更少的噪声和更好的的视觉显著性。


    Guided IG 应用 APM（近似投影模型）对对图像和模型的归因路径进行泛化，以创建符合预测类别的真实显著性图。通过选择性地过滤绝对值最低的模型子集，并将积分路径与输入、基准和模型进行适配，Guided
    IG 能够避免选择噪声信号。


    在回顾了模型无关和模型特定的 XAI 示例后，你可能会疑惑应该选择哪种方法。接下来的章节提供了选择 XAI 方法的通用指南。


    # 选择 XAI 方法


    随着公众意识的转变和监管合规要求的提高，可解释性对于需要自动化决策的组织至关重要。论文 https://arxiv.org/abs/2107.04427 提出了一种包含以下属性的方法论，以弥合利益相关者需求与基于以人为中心的
    AI 的解释性方法之间的差距：


    - **解释方法属性：** XAI 应由兼容性属性、解释属性、方法和过程组成。属性是指决定 XAI 方法对于特定项目类型或用例可行性的元素。相比之下，解释属性必须定义解释的范围，包括语言类型和解释内容。此外，方法使用应提供有关如何通过过程属性使用
    XAI 方法的信息，以识别产生解释的机制。


    - **可解释性需求：** 识别正确的利益相关者并通过问卷捕捉利益相关者的需求至关重要，包括用例限制、功能性和非功能性需求。


    - **信息收集：** 在确定利益相关者后，编制问卷列表以获取每项需求所需的详细信息。


    - **利益相关者需求与解释方法属性匹配：** 在进行彻底的需求分析后，你应该整合 XAI 技术知识，并向利益相关者展示将解决的可解释性程度，以及现有 XAI
    技术的已知局限性。


    一旦明确了利益相关者的需求，下一步就是决定选择哪种 XAI 方法。通常，你应该确定 ML 模型的内部结构是否是可解释的且具有清晰的表示。例如，决策树比深度学习神经网络更具解释性。你可以通过提取决策规则并使用
    Gini 纯度指标衡量决策划分质量来解释决策树，以识别潜在的分类错误。然而，


    决策树的复杂度随着终端节点数量的增加而增加。相反，神经网络将具有非线性数学运算的神经元层结合，使其难以解释。


    图 8.29 总结了本章中涵盖的模型无关和模型特定的 XAI 方法，以及你应该如何考虑什么对你的用例最合适：


    ![](img/c06290096a327475ed918ba4a4328b77_195_0.png)


    图 8.29 – 选择模型无关与模型特定的 XAI 方法


    如之前的图所示，从训练模型开始，如果你可以获取内部结构（例如系数权重或集成树中使用的特征频率），则应该探索模型特定的框架以获得更好的解释性性能。否则，你应该评估模型无关的框架，因为它不依赖于内部模型结构，侧重于输入和输出之间的关联。随后，考虑可解释性的范围，即你是将为单个预测提供局部解释，还是为整个模型行为提供全局解释。


    # 总结


    对 AI 系统可解释性的关注不仅限于 XAI 技术的性进步。相反，它涉及多学科的协作，以全面审查法律、伦理和社会问题。你应该意识到，这种指导对于全面审查至关重要。


    # 可解释性方案


    根据世界经济论坛 https://www.weforum.org/agenda/2022/01/artificial-intelligence-ai-trust-survey/，大约
    60% 的人认为人工智能将改变他们的生活。相比之下，只有 50% 的人信任 AI 技术。通常，可解释 AI (XAI) 系统通过为单个实例生成解释来提供可解释性。美国国家标准与技术研究院
    (NIST) 在其论文《可解释人工智能的原则》中识别了 XAI 的四个基本原则：


    - **解释（Explanation）：** XAI 系统必须产生证据来证明机器学习输出的合理性。

    - **有意义（Meaningful）：** XAI 系统产生的证据必须是目标观众可以理解的。

    - **解释准确（Explanation accuracy）：** 证据展示了正确的推理。

    - **知识限制（Knowledge limits）：** XAI 系统在设计边界内运行。


    # 可解释性方案


    > Phillips, P., Hahn, C., Fontana, A., Yates, K., Greene, D. and Przybicki, M.
    (2021), Four Principles of Explainable Intelligence, NIST Interagency/Internal
    Report (NISTIR 8312), National Institute of Standards and Technology, Gaersburg,
    MD, [online], https://doi.org/10.6028/NIST.IR.8312,https://tsaps.nist.gov/publication/get_pdf.cfm?pub_id=93399（访问日期略）。


    因此，必须定义一个不减缓创新和采用的 AI 治理模型。目标是实现 AI 系统的最佳信任，避免人类与机器之间的信任。图 9.1 总结了 XAI 系统的关键设计考量。


    | 用户 | XAI 目标 | 信息 | 基准 |

    |---|---|---|---|

    | 谁是目标观众？ | 解释什么？ | 如何解释？ | 如何评估解释？ |


    图 9.1 - XAI 系统设计考量


    到目前为止，你已经在书中学习并体验了各种 XAI 技术。在本章中，我们涵盖了基于 NIST 基本原则的以下评估方案，以衡量 XAI 系统的解释质量：


    - 系统因果量表 (SCS)

    - 探索归因方法 (BAM)

    - 忠实度与单调性

    - 人类引导的评估框架


    在本章中，你将学习现有的 XAI 评估和基准格局，并对哪些方法适用于你的应用有一个初步了解。


    # 系统因果量表 (SCS)


    系统可用性量表 (SUS) 由 John Brooke 于 1986 年创建，提供了一种衡量系统界面可用性的简单工具。它由包含 10 个问题的问卷组成，提供
    5 个选项，允许受访者从“非常同意”到“非常不同意”对产品和服务的质量进行评估。


    受 SUS 启发的 SCS（见 https://doi.org/10.1007/s13218-020-00636-z）专注于衡量 XAI 系统的定性方面面。SCS
    满足了 NIST 对有意义的原则，以确定最终用户对 XAI 系统提供的解释的感知。


