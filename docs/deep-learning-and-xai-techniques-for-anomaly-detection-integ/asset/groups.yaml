    # Model-Specific Explainability


    SHAP provides various visualizations to interpret feature importance based on
    SHAP values. Let''s see a few examples:


    +   1. A SHAP force plot shows which features influenced the model''s prediction
    for a single observation. We will call init to load the JS visualization code,
    followed by explaining a specific data instance. A force plot shows a baseline
    or average prediction. Each feature value is represented in an arrow that pushes
    the output toward a positive or negative prediction. The increment or decrement
    of each feature leads to the final prediction. This sample is predicted to be
    class 1 as a malignant tumor which is influenced by the features of the area_worst,
    radius_mean, fractal_dimension_se, and concave points_features:


    ```

    shap.initjs()

