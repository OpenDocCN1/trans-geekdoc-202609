    is needed to ensure that AI is for everyone and benefits people who cannot afford
    the technology.


    For the authors of this paper, http://jathan-herish.com/wp-content/uploads/2022/12/XAI_skills_gap.pdf,
    conducted an AI experiment with 685 employees with mixed ML experiences to assess
    how the digital divide could affect AI adoption and the significance of XAI in
    establishing user trust. The experiment generated AI predictions to clarify whether
    a loan will incur debate disbursement and without explanations, using Shapley
    values. The surveyed employees were asked to provide feedback on whether they
    trust AI predictions and what factors constitute their trust. The results indicated
    that respondents with ML backgrounds were reluctant to trust AI predictions but
    found the given explanations helpful. This experiment suggests that ML models
    designed with explainability could benefit every users.


    A complex organizational structure may hinder AI-driven decision-making, with
    individual business units taking different stances and diverging perspectives.
    Businesses want to ensure the reliability of AI systems and prevent any negative
    impact over time. XAI can accelerate a company''s AI maturity by bridging the
    gap in understanding AI algorithms among stakeholders and improving time to decision.


    Technology leaders constantly explore and invest in new possibilities to enhance
    business outcomes. According to a McKinsey report, at https://www.mcksey.com/business-functions/quantumblack/insights/global-survey-the-state-of-ai-in-2021,
    regulatory compliance, equity and fairness are the risks identified by surveyed
    respondents. Top performers with the highest returns from AI adoption are those
    who mitigate AI risks, detecting underrepresentation of protected characters and
    identifying potential bias through data life cycles and model development stages.
    Some top performers established a central governance committee that facilitates
    collaboration between legal and risk professionals and data scientists to determine
    the impact of bias and protected classes.


    This section covered XAI as an essential element in improving user experience.
    The following section discusses increased public awareness of XAI''s in mitigating
    business risks.'
  - '[PAGE 55]


    # Mitigating business risks


    With AI adoption rising, regulators are enforcing stricter policies that mandate
    explainability and interpretability with AI systems to protect citizens from harmful
    effects. Hence, firms are required to adhere to strict regulatory compliance.


    Besides regulatory compliance, firms that embrace XAI gain increased AI adoption.
    According to McKinsey at, https://www.mcksey.com/business-functions/quantumblack/our-insights/global-survey-the-state-of-ai-in-2020,
    a global manufacturer found its first workers did not trust AI decisions to operate
    a piece of heavy and potentially dangerous equipment after a significant investment
    in AI systems. To increase workers'' confidence in AI and enable explainability,
    the manufacturer opted for more transparent models to improve Return on Investment
    (ROI).


    Many companies accelerated their analytics strategy during COVID-19 by embracing
    AI technologies. According to Gartner, https://www.gartner.com/en/newsroom/press-releases/2021-09-07-gartner-identifies-four-trends-driving-near-term-artificial-innovation,
    AI roles should demonstrate responsible expertise by 2023. Greater insights come
    with greater risks and responsibility. Business and technology are increasingly
    aware of possible consequences and liability caused by decisions made by AI systems.
    Furthermore, failure to address public perception of bias and concerns over unfairness
    in AI systems can hinder AI adoption.


    We learned about the implications of XAI due to public awareness in this system.
    Next, let''s explore a methodology for choosing the appropriate XAI technique
    for deep learning anomaly detection solutions.


    # Choosing XAI techniques


    Fundamental XAI principles warrant AI systems to provide some forms of explanations,
    evidence, and information apprehensible by humans to justify model output. The
    main objective of XAI is to make AI decisions comprehensible to everyday users.
    Choosing an XAI technique for deep learning anomaly detection requires careful
    deliberation and thorough analysis of the following aspects:


    +   - **Analyze stakeholders and scope of explainability**: Know your audience,
    understand their roles, and discover what matters to them. Gather functional and
    non-functional requirements using questionnaires or existing documentation – for
    example, what qualifies as an anomaly in their business domain? What is an acceptable
    threshold when detecting outliers? What will they do with the explanations? Do
    they need reasoning for every prediction or aggregated to understand the overall
    model behavior?


    +   - **Identify data modalities**: XAI techniques differ by the data input they
    explain – for example, explaining images focuses more on the visual saliency of
    superpixels, while explaining text relies on highlighting key phrases contributing
    to the model prediction.'
