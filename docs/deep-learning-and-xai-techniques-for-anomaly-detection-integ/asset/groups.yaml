    本书适用于任何渴望解释深度学习异常检测的人、寻找 XAI 最佳实践的资深数据科学家或机器学习从业者，以及希望在异常检测性能与可解释性之间做出决策的业务领导者。建议具备使用
    Python 的深度学习和异常检测相关主题的基础知识，以充分利用本书的内容。


