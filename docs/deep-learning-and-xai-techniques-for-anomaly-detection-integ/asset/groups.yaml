  mdcn: '


    在示例演示中，我们将使用胸部 X 光射线数据集进行视觉检测问题实验，以检测患有肺炎的图像。然后，你将可视化模型的类激活图（CAM）和梯度加权类激活映射（Grad-CAM），以解释卷积神经网络（CNN）用于识别目标图像类别的判别性图像区域。


    下一节将回顾视觉异常检测的分类。


    ## 回顾视觉异常检测


    异常检测根据预期行为检测不符合规范的模式，以创建一个观察未见数据的合理模型。视觉异常检测是指使用机器学习（ML）方法（如监督、半监督和无监督技术）在图像数据中识别并定位异常区域。请参考第
    1 章了解这些技术的比较。


    评估视觉异常有两种方法方法：


    - **图像级（Image-level）**：该方法评估整个图像是否正常或异常。

    - **像素级（Pixel-level）**：该方法检测图像中的异常区域以确定图像是否正常或异常。像素级方法广泛用于工业故障检测，但由于变化巨大且边界模糊，该方法对于任务关键型应用可能具有挑战性。


    通常，大多数视觉可解释性（XAI）通过基于输出概率的热力图生成或散点图来解释 ML 模型的决策。示例包括本章将回顾的 CAM 和 Grad-CAM，以及第
    7 章的显著图和第 8 章的**积分梯度（Integrated Gradients）**。


    下一节回顾各种图像级和像素级技术。


    ## 回顾图像级异常检测


    传统的 ML 方法通常将图像的输出分布与参考分布进行比较以确定是否存在异常。深度学习算法如 CNN 通过使用高维数据的强大表示来增强传统方法。以下是图像级异常检测的示例：


    - **密度估计（Density estimation）**：该方法估计正常与未见图像之间的概率分布以检测异常。密度估计方法如**k 最近邻（KNN）**需要大型数据集。此外，随着数据集增长，特征维度变得越来越复杂。

    - **一类分类（One-class classification (OCC））**：该方法通过在特征空间中构建决策边界对正常类进行分类。深度学习模型通过特征提取增强密度估计。例如，一类卷积神经网络
    [OCC-CNN](https://arxiv.org/pdf/1901.0868.pdf）是一种基于 CNN 的异常检测方法，其中 OCC 异常很少，其学习过程仅关注目标。

    - **图像重建（Image reconstruction）**：该方法通过逆映射将输入图像映射到低维表示以重建原始图像。图像重建假设正常图像产生小的重建误差，而异常数据应产生较高的重建误差。我们在第
    1 章回顾过如自动编码器（autoencoder），这是一种通过隐藏层压缩输入数据的无监督神经网络。如果输入特征是独立的或非冗余的，压缩将很容易。

    - **自监督分类（Self-supervised classification）**：该方法利用大规模无监督数据学习颜色、纹理、形状、位置和方向等视觉表示。


    ## 回顾像素级异常检测


    虽然图像级算法可以通过将整个图像分割成块来用于像素级异常检测，但可能缺乏语义信息。因此，以下无监督像素级方法是理想的：


    - **图像重建（Image reconstruction）**：假设卷积神经网络仅用正常图像训练，像素级图像重建方法重建输入图像。然后，它评估输入与重建图像之间的像素差异以确定异常区域。从锐利边缘和复杂纹理创建高质量图像对于像素级异常检测具有挑战性，会导致检测异常时出现更高的假阳性率。

    - **特征建模（Feature modeling）**：与图像重建不同，基于特征的方法使用整个图像的局部区域表示来检测异常。区域特征与测试图像局部区域之间的特征分布决定了目标区域是否应标记为异常。


    在提供了计算机视觉异常检测技术的概述后，让我们在下一节探索深度学习模型在寻找异常时寻找什么。


    ## 将深度视觉异常检测与 XAI 结合


    深度学习通过教计算机模仿视觉系统，为计算机视觉异常检测提供了巨大机会。例如，CNN 设计用于复制视觉皮层的结构，用于目标检测、图像分类和语义分割等计算机视觉任务。图
    5.1 显示了以下的高级架构：


    ![](img/c06290096a327475ed91ba4a4328b77_118_0.png)


    图 5.1 - 简单的 CNN 架构


    如前面的图像所示，CNN 的架构由以下主要层组成。你可以从这篇论文 https://ieeeexplore.ieee.org/document/830818
    学习更多关于 CNN 的知识。该架构中的层为：


    - **卷积层（Convolutional layer）**：这是从输入图像中提取各种特征的第一层。当卷积层接收输入时，它通过在空间维度上对每个滤波器进行卷积产生
    2D 激活图。网络学习特定的滤波器。

    - **池化层（Pooling layer）**：该层使用最大池化或平均化处理输入以对空间维度进行下采样。

    - **全连接层（Fully-connected layer）**：这是接收池化层输出并产生分类的层。


    你可能在想，人类能理解深度学习是如何思考的吗？CAM 和 Grad-CAM 等 XAI 方法对于解释性性重要。CAM http://cnnlocalization.csail.mit.edu/
    通过定位相关区域帮助用户解释 CNN 如何预测给定输入。虽然 CAM 提供了热力图，但它可能存在噪声并遭受空间信息的丢失。或者，Grad-CAM 可以通过保留空间信息改进
    CAM。


    Grad-CAM https://arxiv.org/abs/1610.02391 是一种将 CAM 推广到为基于 CNN 模型生成视觉解释的技术。它利用最终卷积激活图的梯度来突出图像中的重要区域。与
    CAM 不同，Grad-CAM 没有 CNN 架构要求。


    现在你已经理解使用深度学习进行异常检测的 XAI 方法，让我们讨论一下示例演示需要什么。


    ## 技术要求


    实验该示例需要以下技术要求：


    - **OpenCV-Python**：用于图像处理和计算机视觉任务（如人脸检测和物体跟踪）的开源库。

    - **Keras**：用于构建神经网络的开源库。

    - **Matplotlib**：用于创建数据可视化的绘图库。

    - **NumPy**：处理数组时提供数学函数的开源库。

    - **pandas**：提供数据分析和处理工具的库。

    - **SciPy**：用于科学和技术计算的开源 Python 库。

    - **Slearn**：用于预测数据分析的 ML 工具。

    - **TensorFlow**：构建深度学习应用的开源框架。


    在本章讨论的示例笔记本和依赖关系文件位于 https://github.com/PaktPublishing/Deep-Learning-and-XAI-Techniques-for-Anomaly-Detection/tree/main/Chapter5。


    你可以在 Amazon SageMaker Studio Lab https://aws.amazon.com/sagemaker/studio-lab/
    上实验该示例，这是一个免费的笔记本开发环境，每个用户会话提供最多 12 小时 CPU 或 4 小时 GPU 以及 15 GiB 免费存储。或者，你也可以在你偏好的集成开发环境
    (IDE) 中尝试。


    接下来，让我们探索此示例的数据集。


    '
