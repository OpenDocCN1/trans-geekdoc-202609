    # Understanding intrinsic explainability


    Interpretable ML aims to address the challenge of incomprehensible ML models and
    predictions by humans. Models with explainability incorporated directly into the
    structures are locally and globally interpretable, requiring further processing
    to interpret their predictions. We can determine the marginal influence of a specific
    feature on its target variable by reviewing coefficients with intrinsic explainable
    models such as linear or logistic regression. This section discusses how to achieve
    intrinsic explainability locally and globally.


    # Intrinsic global explainability


    In this paper, https://arxiv.org/pdf/1808.00033.pdf, the authors stated that intrinsic
    models could achieve global explainability by enforcing sparsity or semantic monotonicity
    constraints:


    +   - Sparsity to using fewer features for model prediction, which increases explainability
    by highlighting influential features. For example, the Least Absolute Shrinkage
    and Selection Operator (LASSO regression or L1 regularization) helps build sparsity
    when dealing with many features in the dataset. Reducing the coefficients of less
    important features to zero enables LASSO regression to select subsets of features
    with less collinearity and thus removed features, making generalized linear models
    (GLMs) more interpretable.

    - Semantic monotonicity constraints ensure that features and target predictions
    are progressing in the same direction. Creating interactions between features
    simplifies relationships correlation, leading to increased explainability. For
    example, adding regularization loss allows a convolutional neural network (CNN)
    to learn more effectively.


    Alternatively, approximating outputs of a complex model with a more straightforward
    approach as decision trees can also achieve global explainability. This technique
    is known as knowledge distillation, https://arxiv.org/pdf/2006.05525.pdf, where
    information is transferred from a large or ensemble to a small model without performance
    compromise. In this case, decision trees are interpretable because they resemble
    the human thought process by asking clarifying questions until gaining sufficient
    information to reach a final prediction. However, decision trees are prone to
    overfitting and lose explainability as the depth increases. Applying active learning
    with decision trees avoids overfitting while achieving comparable performance
    to complex models and better explainability.


    # Intrinsic local explainability


    Unlike intrinsic global explainability, intrinsic local models provide explanations
    for individual predictions. Attention-based neural networks, such as transformers
    used in neural machine translation (NMT), provide intrinsic local explainability.
    For example, NMT encompasses an encoder to compute representation for source sentences
    and a decoder to translate words sequentially. Different weights added to the
    hidden layers of the decoder enable NMT to focus selectively on various parts
    of input'
