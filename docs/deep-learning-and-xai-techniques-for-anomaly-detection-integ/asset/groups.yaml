    10. Create a simple LSTM model by initializing LSTM encoder and decoder layers,
    applying dropout, repeating the inputs with RepeatVector, and adding a TimeDistributed
    dense output layer. We will use the Mean Absolute Error (MAE) loss as an evaluation
    metric and the Adam optimizer:


    ```

    LSTM_units = 64

    model = keras.Sequential()

    model.add(LSTM(LSTM_units, input_shape=(train_x.shape[1], train_x.shape[2]), return_sequences=False,
    name=''encoder_lstm''))

    model.add(Dropout(0.2, name=''encoder_dropout''))

    model.add(RepeatVector(train_x.shape[1], name=''decoder_repeater''))

    model.add(LSTM(LSTM_units, return_sequences=True, name=''decoder_lstm''))

    model.add(Dropout(rate=0.2, name=''decoder_dropout''))

    model.add(TimeDistributed(Dense(train_x.shape[2]), name=''decoder_dense_output''))

    model.compile(loss=''mae'', optimizer=''adam'')

    model.summary()

    ```


