    layer. Figure 1.19 shows a basic deep learning architecture:


    ![](img/c06290096a327475ed918ba4a4328b77_40_0.png)


    Anomaly detection techniques are generally available in three categories:


    - **Supervised anomaly detection**: Train an ML model with an imbalanced labeled
    dataset where each instance is categorized into a normal or abnormal class. This
    approach is viable if ground truth or actual observation is available. An anomaly
    detection model determines the class of unseen data outliers follow the same distribution
    as the training dataset. Limitations of supervised anomaly detection include scarcity
    of anomaly samples and challenges in identifying precise representation of the
    normal class.

    - **Semi-supervised anomaly detection**: Train an ML model with a large amount
    of unlabeled datasets supplemented by a small set of labeled data for expected
    behavior. This approach assumes outliers differ from training dataset distribution.
    Hence, semi-supervised is more applicable than detecting outliers since anomalies
    are rare.

    - **Unsupervised anomaly detection**: Train an ML model with an unlabeled dataset
    that contains normal and abnormal observations. This approach assumes normal and
    abnormal observations typically isolated in high-density and low-density regions.
    An anomaly detector looks for instances or potential outliers in the low-density
    region.


    ## Understanding challenges and opportunities


    Besides identifying the class of unseen data, anomaly detection algorithms can
    produce anomaly scores to quantify the severity, help businesses determine an
    acceptable impact threshold, and manage risk tolerance levels.


    The significance of anomaly detection is evident across many mission-critical
    domains. When choosing deep learning versus traditional anomaly detection methods,
    consider business objectives, data size, and training time trade-offs such as
    algorithmic scalability, model flexibility, explainability, and interpretability.


    Deep learning methods are capable and ideal for handling large datasets and complex
    problems. Deep learning can extract and correlate relationships across many interdependent
    features if your business aims to discover hidden patterns in large datasets.
    Otherwise, traditional methods might be a good start if your data size is small.


    Training a deep learning anomaly detection model can be compute-intensive and
    time-consuming, depending on the number of parameters and available infrastructure,
    such as graphics processing units (GPUs). More computing power is needed as the
    size and complexity grow with deep learning models. Conversely, traditional anomaly
    detection methods can run and train faster on cheaper hardware, within hours.


    Traditional rule-based anomaly detection methods created manually by experts are
    not scalable enough to handle high-dimensional data and are difficult to maintain.
    For instance, it can be challenging to develop security rules for every possible
    malicious behavior and keep those up to date. In contrast, deep-learning anomaly
    detection methods are more adaptive by learning and extracting features incrementally
    in a nested hierarchy through hidden layers.


    This section covered the basics and general practices of deep learning. In the
    following section, we will discuss known challenges of deep learning anomaly detection
    and future opportunities of XAI in this field.


    ## Understanding challenges and opportunities


    The abundance of computing resources and available data accelerated the evolution
    of anomaly detection techniques over the years. According to the International
    Data Corporation (IDC), https://www.statista.com/statistics/871513/worldwide-data-created-digital/,
    less than 2% of 64.2 zettabytes of data created during the COVID-19 pandemic remained
    into 2021, presenting enormous opportunities for big data analytics and anomaly
    detection. However, challenges such as high false positives, scarcity of anomaly
    samples, and imbalanced distribution remain prevalent.


    Establishing the boundary of normal versus abnormal behaviors is vital in anomaly
    detection. Nevertheless, this is not always a straightforward task due to the
    dynamic nature of anomalies. For example, defining normal behaviors is a moving
    target when malicious adversaries adapt and as justifiable tasks to anomaly detection
    algorithms. Noise and mislabeled data can cause a benign record to appear as an
    abnormal observation. An anomaly record might go undetected by aggregated data
    or masking of hidden trends. Furthermore, drift can occur with input data and
    feature changes, causing the current notion of normal behavior invalid.


    Generally, besides ML improves decision-making and operational efficiency. With
    increased predictive accuracy and complexity, companies struggle to identify trade-offs
    between model performance and interpretability for auditability and regulatory
    compliance. For example, individuals are entitled to the Right to Explanation
    under the European Union (EU) General Data Protection Regulation (GDPR). Therefore,
    there is a growing awareness of explainability across different maturity levels
    of ML adoption among enterprises.


    Knowing the keys, let''s explore some future research focuses and opportunities
    for the next generation of deep learning anomaly detection practices. Instead
    of exclusively fitting labeled anomaly samples with a supervised technique or
    training using unsupervised methods, there is an increasing interest in weakly-supervised
    anomaly detection using partially labeled anomaly data in the hope of getting
    the best of both worlds. Weak-supervised anomaly detection aims to enhance model
    learning with a small set of accurately labeled samples and continuing to explore
    anomalies in unseen.


    Most deep learning methods focus on point anomalies. Complex interconnected devices
    such as climate control and electromechanical systems provide a new opportunity
    for multimodal anomaly detection. Multidimensional anomalies can occur when one
    or more dimensions exceed or fall below the expected range of values, or multiple
    dimensions no correlate.


    XAI is an emerging research field that studies the tools and frameworks to provide
    human-legible explanations and increase confidence in model prediction with quantifiable
    factors. The earlier days of XAI in anomaly detection can be rule-based expert
    systems where human experts formulated the rules and system knowledge, resulting
    in their inherent explainability. Further research on interpretable and actionable
    deep learning anomaly detection is significant in explaining model decisions and
    mitigating potential bias.


    ## Summary


    Despite the previously mentioned challenges, anomaly detection is highly applicable
    to various domains and will remain a diverse research field. In this chapter,
    you learned about the basics of anomaly detection, practical industry use cases,
    and considerations of deep learning versus traditional anomaly detection approaches.
    You also completed two walkthroughs and explored challenges and exciting opportunities
    in this space. You also explored challenges and exciting opportunities in this
    space. In the next chapter, we will discuss XAI and its significance for anomaly
    detection.


    ## 2

    ## Understanding Explainable AI


    The breakthrough of ImageNet in 2012 accelerated the deep learning revolution,
    which evolved into the call for Explainable AI (XAI) in 2015, initiated by the
    United States (U.S.) Defense Research Project Agency (DARPA), due to increased
    research interests in these opaque systems. Realizing the gap between rationalizing
    concerns about hidden risks for high-stakes situations, DARPA launched the XAI
    program in May 2017, intending to develop AI systems that end users can understand
    and trust.


    In the past several decades, AI has evolved at an unprecedented rate to the extent
    that it requires no human intervention. While deep learning is increasingly sophisticated
    in solving complex problems, these advancements raise concerns about AI’s social
    impacts and ethical implications.


    XAI is an emerging research field focused on studying, methods, tools, and frameworks
    to explain the inner workings of AI systems. The goal of XAI is to satisfy stakeholders''
    interests and expectations. For example, this paper, https://ieexplore.ieee.org/document/9785199,
    discussed an XAI case study that provided sonologists and dermatologists with
    information and explanations on how an ML model detects anomalies for melanoma
    cancer or nevus-like skin lesions. The model encapsulates knowledge from a dataset
    that contains 10,000 images from the International Skin Imaging Collaboration
    (ISIC). Besides detecting skin lesion abnormalities using the Disentangled Inferred
    Prior Variational Autoencoder (DIP-VAE), the model provides explanations based
    on medical guidelines in evaluating the asymmetry, border, and color of skin conditions.


    In this chapter, we will explore the following XAI topics:


    - Understanding the basics of XAI

    - Reviewing XAI significance

    - Choosing XAI techniques


    By the end of this chapter, you will learn more about XAI and its significance
    for anomaly detection, including business implications, social impacts, and regulatory
    compliance.

