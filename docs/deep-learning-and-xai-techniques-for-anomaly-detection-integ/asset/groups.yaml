    Kernel SHAP is agnostic. Hence it has wide applicability to interpret predictions
    for a broad range of ML models. However, calculating Shapley values with large
    datasets using Kernel SHAP can be time-consuming and computationally intensive.
    We used the namples setting in this example to limit the number of SHAP evaluations
    for each prediction as an alternative.


    In contrast, SageMaker Clarity; https://aws.amazon.com/sagemaker/clarify/, improves
    SHAP runtime significantly and enhances scalability by parallelizing SHAP computation.
    Refer to SageMaker Clarity: Machine Learning Bias Detection and Explainability
    in the Cloud, https://assets.amazon.science/45/76/b30bab4f14acbab96cfe8067ed2b4a/amazon-sagemaker-clarify-machine-learning-bias-detection-and-explainability-in-the-cloud.pdf,
    for more info on Amazon SageMaker Clarity''s implementation of Kernel SHAP.


    In this section, you completed an end-to-end walkthrough of building and explaining
    a deep learning model to detect breast cancer by classifying benign or malignant
    tumor. The following section explores model-specific explainability in depth.


    # Reviewing model-specific explainability


    Unlike-agnostic techniques, model-specific XAI methods depend on the choice of
    model class and require understanding of the inner workings of a model. Hence,
    model-specific methods are applicable for inhertable models or when we understand
    internal network representation. Gaining insights into the underlying model structure
    allows us to reverse engine the rationale through deductive reasoning to justify
    the decisions made by the model.


    While providing a deeper understanding of a specific model, implementing model-specific
    XAI methods such as backpropagation approaches involves recreating the model in
    reverse order to unfold the inner logic and complexity. This section will discuss
    a model-specific example using Integrated Gradients (Guided IG).


    # Interpreting saliency with Guided IG


    Integrated Gradient (IG), https://arxiv.org/abs/1703.01365, is an XAI technique
    that evaluates feature attribution by computing gradients of a model''s prediction.
    IG is more scalable and works independently from the number of features within
    a network. However, IG is slower than the other backpropagation-based methods,
    requiring between 50 and 200 backward passes for gradient evaluations.


    Guided IG is an enhanced feature attribution method based on IG for deep learning
    models. Guided IG minimizes irrelevant attributions by introducing an adaptive
    path method (APM) to calculate an alternate integration path than IG.'
