    # About the reviewers


    Austen Groener is an applied scientist at AWS in the greater Boston area. His
    research and work are focused on developing computer vision and artificial intelligence
    capabilities for the Amazon Dash Cart. Previously, he was a research scientist
    at Lockheed Martin Space Systems where he worked within the field of remote sensing
    and anomaly detection. Austen holds a Ph.D. in physics from Drexel University.


    Samet Akcay is an AI research engineer/scientist. His primary research interests
    are real-time image classification, detection, anomaly detection, and unsupervised
    feature learning via deep or machine learning algorithms. He recently co-authored
    and open sourced anomalish, one of the largest anomaly detection libraries in
    the field. Samet holds a Ph.D. degree from the department of computer science
    at Durham University, UK, and received his M.Sc. degree from the Robust Machine
    Intelligence Lab at the department of electrical engineering at Penn State University,
    USA. He has over 30 academic papers published in top-tier computer vision and
    machine learning conferences and journals.


    Aditya Jain is a trained computational scientist from the University of Texas
    at Austin and IIT Rookee. He has experience in deploying large-scale machine learning
    models at organizations such as Meta Platforms, SparkCognition, and Ola Cabs for
    billions of users. He loves demystifying the workings of machine learning models
    and answering the question, “What is model learning?” thus making models more
    interpretable. Aditya Jain is a techn at heart with an avid interest in solving
    society’s biggest problems using deep learning and artificial intelligence. When
    he is not researching the latest advances in machine learning, he can be found
    running a marathon, dancing, or scuba diving. Follow his work at https://adityajain.in/'
