    and weaknesses of learned models. The 4-year DARPA XAI program ended in 2021 with
    an open source Explainable AI Toolkit (XAITK; https://xaitk.org/) as the final
    deliverable, program artifacts that include code, papers, and reports. The goals
    of XAITK consolidating DARPA XAI research into a single publicly accessible repository
    and providing operational capabilities for future research by interested contributors.
    You can read more about DARPA''s XAI in this paper: https://onelibrary.wiley.com/doi/10.1002/ai12.61.


    Since then, the following motivations have constituted XAI''s growth:


    - **User intents**: Explains a model output to a user – for example, why a student
    is denied a college application?

    - **Social trust**: Explanations for the general public to foster trust and acceptance
    in AI systems – for example, the public trust an AI system following ethical guidelines
    when recommending a candidate for a job?

    - **Regulatory compliance**: Explains algorithmic logic to auditors or regulators
    to meet legal and ethical requirements – for example, can an AI system explain
    which certain transactions are flagged as abnormal in accounting?

    - **Model debugging**: Explanations on model artifacts, enabling technical professionals
    to debug model decay

    - **Business interests**: Explanations to justify business decisions based on
    model prediction – for example, an online retailer wanting to understand how AI
    systems make product recommendations to improve customer experience


    # Understanding Explainable AI


    An ML model can be partially or fully explainable. Fully interpretable models
    are generally more structured and follow domain knowledge by using correlated
    variables to provide transparent explanations of how a decision is derived. In
    contrast, partially interpretable models are often not bound by domain constraints
    and reveal essential elements of a reasoning process. Figure 2.2 compares ML algorithms
    based on model accuracy and interpretability.


    ![](img/c06290096a327475ed918ba4a4328b77_46_0.png)


    Figure 2.2 – Model accuracy versus interpretability


    Simpler models with more structured functional details, such as decision trees,
    rule-based algorithms, and linear regression models are intrinsically interpretable,
    simulatable, and decomposable. In contrast, complex algorithms such as deep learning
    networks with millions of parameters and weights are considered black-box models,
    since they are not understood by humans.


    The current XAI maturity level has yet to identify the root cause leading to a
    model decision or prediction. Nevertheless, XAI methods focus on local and global
    explainability, which we will discuss in depth in Chapter 6. Here is an introduction
    to the two concepts:


    - **Local explainability** explains how an ML model relates an individual decision
    or predicts a specific outcome. This approach focuses on explaining to a user
    the reasoning behind a model''s decision – for example, a bank might be audited
    to demonstrate explainability when declining a loan application based on an AI-generated
    decision.

    - **Global explainability** provides a holistic view of the overall model behavior
    by investigating model learning, including the choice of data and algorithms.
    This approach explains to a user what elements influence a model''s decision-making
    – for example, a company''s marketing team might want to know how an ML model
    predicts the likelihood of a customer enrolling in a subscription.


    XAI techniques apply to various data modalities, including images, text, and tabular
    data. Choosing the appropriate XAI technique for the relevant data type is crucial
    in detail how to build explainable anomaly detectors as a source of explanations.
    We will walk through in detail **natural language processing (NLP)**, time series,
    and computer vision in Part 2 of the book.


    This section highlights the inflection point and motivations of XAI. The following
    section compares two aspects of XAI, explainability and interpretability.


    # Differentiating explainability versus interpretability


    There are two main XAI concepts, explainability and interpretability. Knowing
    the differences between these terms, often used interchangeably in the literature,
    it is essential.


    In machine learning, explainability refers to human-understandable explanations
    of working mechanisms deriving a prediction – for example, a fraud detection model
    predicts a transaction to be fraudulent, and we want to know how and why the model
    arrived at this conclusion.


    In contrast, interpretability refers to the contextual understanding of a prediction
    – for example, we want to understand the severity and risks of a credit card transaction
    flagged as fraudulent such as quantifying fraud and event correlation. Simply
    put, explainability focuses on the how and why, while interpretability emphasizes
    what.


    Table 2 summarizes the comparisons between explainability and interpretability,
    where explainability produces reasoning of the model’s decisions while interpretability
    measures the extent of understanding the model’s behavior.


    | Explainability | Interpretability |

    | :--- | :--- |

    | Human-understandable explanations for working mechanisms of models deriving
    a prediction | Contextual understanding of a prediction |

    | After model training, perform post hoc explainability to assess a model’s local
    and global explainability | Intrinsically interpretable algorithms such as decision
    trees and linear models |

    | How does a model predict fraud? What parameters lead to predicted fraud? | What
    kind of fraud? How bad is the fraud? |


    Table 2.1 – Comparing explainability and interpretability


    The explainability and interpretability of an ML model can result in profound
    implications for end users. For example, understanding how an AI system detects
    abnormal tissue samples for cancer screenings and how the system presents output
    to users can impact survival prediction and guide physicians in diagnosis and
    treatment. With the aforementioned case, an AI system explains how the model detects
    abnormal skin lesions based on asymmetry, border, color, and diameter measurements.
    Sonologists and dermatologists who receive AI generated explanations can interpret
    the model following medical guidelines in diagnosing skin disorders.


    In short, explainability tells us how the model behaves in human terms. In contrast,
    interpretability assesses whether the given explanations of how the model behaves
    make sense in real-world practice.


    Now that you understand the differences between explainability and interpretability,
    the following section discusses personas on the receiving end of XAI output.

