  - '[PAGE 4]


    # Foreword


    I was delighted to be asked to write the foreword for this interesting and helpful
    book. In my role as Chief Evangelist for Amazon Web Services (AWS), I can see
    that our customers are eager to use machine learning to solve many different types
    of real-world problems at scale. With access to vast amounts of storage and compute
    power in the cloud, they are able to take on challenges today that would have
    been impractical or even impossible just a decade ago.


    This book addresses one of these challenges in detail: using all of that storage
    and compute power to create machine learning (ML) models that can accurately and
    efficiently detect anomalies hidden in


    When I think about anomaly detection, I immediately think of my intuition, my
    Spidey-sense that something is not quite right. You know that feeling, early warning
    deep inside, where your subconscious seemingly knows before you do, right? That''s
    your internal anomaly detector at work, using rules and patterns that you might
    not realize you have set up.


    To, ML-powered anomaly detection is the scientific, mathematically sound, and
    scalable version of my inexplicable Spidey-sense. This book will show you how
    to build anomaly detectors that you can apply to all sorts of mission-critical
    cases — fraud detection, predictive machine maintenance, and much more. While
    it will give you a strong footing in the theory, it will also show you how to
    put the theory to work right away. In fact, you will learn how to set up SageMaker
    Studio Lab before the end of the fourth page!


    Early models were black boxes and provided no insights into how they make their
    predictions. As ML moved from the lab to production, forward-thinking people realized
    valid concerns and asked questions — how did the model make decisions, is the
    model biased, and why should we trust it to make mission-critical decisions?


    To end, this book will also bring you to the important topic of explainable artificial
    intelligence, or XAI. With millions of parameters and billions of weights, sophisticated
    models seem to be beyond human comprehension at first glance. Fortunately, that
    is not actually the case, and as you work through the examples in each chapter,
    you will learn how you can use explanations to earn trust with your users, ensure
    compliance with your objectives, and ensure that your accurately reflect your
    business needs.


    I hope that you will learn a lot from this book (I know I did!) and that you will
    be able to put those lessons to use within days.


    Good luck, and let me know how it goes!


    Jeff Barr


    VP and Chief Evangelist, Amazon Web Services'
