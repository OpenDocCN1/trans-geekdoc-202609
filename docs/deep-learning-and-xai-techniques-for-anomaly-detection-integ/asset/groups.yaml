    # Understanding Explainable AI


    Let''s review these approaches:


    +   - Pre-processing XAI techniques: These focus on removing bias before the model
    learning process, including feature weighting to avoid discrimination against
    sensitive variables or ensuring a balanced and inclusive representation of diversity
    in the input data. Examples include exploratory data analysis, explainable feature
    engineering, dataset standardization, and dataset summarization methods.

    - In-processing XAI techniques: One dilemma of XAI in constructing an explanation
    is to protect confidential information from being exposed to adversarial attacks,
    which could alter model output by manipulating input based on a given explanation.
    In-processing XAI techniques are implemented during model training to optimize
    target variable prediction while minimizing feature prediction. For example, the
    fairness constraints restrict model behavior by enforcing fairness conditions
    within a model, adversarial debiasing removes exposure of protected attributes
    from model predictions, and the prejudice remover adds discrimination-aware regularization.

    - Post-processing XAI techniques: These are applied after a model is trained without
    changing the input data. Common methodologies include perturbation, backpropagation,
    and activation optimization. We can use backpropagation and perturbation in more
    depth in Chapter 7.


    # Reviewing XAI significance


    Sophisticated and deep learning algorithms are capable of performing many tasks.
    Nevertheless, humans often cannot comprehend how AI systems make decisions due
    to their opaque nature. Fundamental questions to consider on why we need XAI are
    who built AI and who AI is built for. XAI has been viewed as a significant effort
    to keep the momentum going in the AI research field. As Albert Einstein said,
    "If you can''t explain it, you don''t understand it well enough." Without adequate
    understanding, humans cannot translate valuable insights produced by AI into actionable
    real-world knowledge. This section covers the following topics to help us understand
    significance for continuous advancements toward trustworthy AI:


    +   - Considering the right to explanation

    - Driving inclusion with XAI

    - Mitigating business risks


    # Considering the right to explanation


    Since its inception in 2016, the GDPR''s mission has been to unify data protection
    laws across EU member countries. Data protection is part of the EU Charter of
    Fundamental Rights to protect any personally identifiable data created through
    digital platforms. The legislation reaches beyond EU boundaries. Businesses collecting
    and processing EU residents'' data are subject to GDPR regulatory requirements,
    regardless of where the data processing occurs or where a company resides.'
