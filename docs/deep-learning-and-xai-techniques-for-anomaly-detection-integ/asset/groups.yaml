    COMP 分数。COMP 分数越高，对解释的忠实度越高。

    - **充分性 (SUFF):** 该指标通过评估重要特征是否包含足够的信息以保留原始预测来衡量忠实度。SUFF 通过评估特征对模型的持续重要性来增强 COMP。例如，从
    NLP 分类器中移除一组已知影响力的标记或短语子集，应该会导致预测概率发生变化。SUFF 衡量该分类器的平均百分比变化，从保留前 5% 的已知重要特征开始，逐步增加，直到模型预测发生变化为止。SUFF
    分数越低，说明解释越具有忠实度。

    - **重要性与输出概率之间的相关性 (CORR):** 在这里，如果随着重要特征的逐步移除，特征重要性与预测概率呈正相关，则认为解释是忠实的。相关性越高，说明解释越具有忠实度。

    - **单调性 (MONO):** 从空向量开始，观察逐步添加特征后分类概率的变化。如果预测类别的概率随着特征的添加而单调增加，则该解释是忠实的。单调性值越高，说明解释越具有忠实度。


    我们已经涵盖了多种 XAI 指标，通过隔离模型特征的影响并观察模型相似性来评估忠实度。XAI 指标捕捉了关于解释如何提高模型可解释性以及用户对模型行为理解的直觉。选择合适的
    XAI 指标对于确保模型具有合理理由的可信度至关重要。


    接下来的章节将探索基于人类的评估框架（human-grounded evaluation framework）如何对 ML 生成的解释中的人类推理进行量化分析。


    # 基于人类的评估框架


    当解释能够让目标受众建立模型行为的心理表征并掌握推理过程时，它是实用且有用的。目标受众包括没有领域知识的终端用户和可以提供信息反馈的专家用户。


    衡量人类模拟性（human simulatability）对于评估人类对 ML 行为的理解程度至关重要。人类模拟性有两种类型：


    -   **正向模拟 (Forward simulation):** 人类根据给定输入预测模型的输出。例如，要求用户根据特定的邮政编码估计房价。

    -   **反事实模拟 (Counterfactual simulation):** 在给定输入和输出的情况下，如果输入不同，人类预测模型的输出或做出因判断。例如，要求用户预测如果飞机提前
    20 分钟到达机场，他们是否会错过航班。


    模拟终端用户的预测可以为基于不寻或无关特征的不准确模型预测提供见解。或者，用户可以与 XAI 系统交互，并通过问卷机制（如 SCS Likert 量表问卷）提供反馈，说明他们是否从
    XAI 中获得了任何洞察。准确且有意义的 XAI 解释应该支持模型调试。专家用户（如数据科学家）可以就解释是否有助于发现差距并改进性能提供反馈。


    基于人类的评估框架 https://doi.org/10.48550/arXiv.1801.0575 通过要求人类标注员标记图像并手动捕捉特定类别的特征来评估局部可解释性。该方法通过将加权解释图与真实的单层掩码进行比较，总结了人类对解释的平均表示。尽管基于人类的评估框架提供了对显著特征更细粒度的评估，但由于人类对某些特征的固有偏见，结果存在局限性。


    # 总结


    在这一章中回顾了 XAI 评估方案和基准指标后，你现在理解如何根据 NIST 的基本 XAI 原则分析解释的质量。


    本章标志着本书的结束。感谢你与我一起探索各种 XAI 主题。我们学习了 XAI 在深度学习异常检测中的挑战、机会和意义。通过在书中整合理论与实践，你学习了在
    NLP、时间序列和计算机视觉中检测异常的深度学习模型。你现在理解如何量化和评估模型可解释性，以满足合规性要求并减少公平性和伦理分析中的偏见。

    '
