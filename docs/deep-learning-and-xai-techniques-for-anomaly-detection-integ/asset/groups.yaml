    41% of surveyed companies indicated they used AI to enhance decision-making.


    While the potential for autonomous learning using machine learning (ML) is promising,
    demand for explanations of how algorithms makes decisions is emerging. The research
    community and end users need to understand AI systems'' influence on real-life
    scenarios, hidden risks, and consequences for people'' lives as AI proliferates
    and becomes a mainstream technology. Hence, explainability and explainabilities
    are indispensable elements of ML models.


    We discussed the differences between explainability and explainability in Chapter
    2. Without understanding the rationale for how decisions are made and justified,
    it may be risky to deploy ML models to production that could potentially cause
    negative business and social impacts.


    Intertable ML refers to how models explain their behaviors in human-understandable
    terms. Many interpretable ML techniques have been proposed, yet a consensus is
    lacking for standards. Generally, interpretable ML is grouped into two main categories
    depending on when explainability is measured:


    +   - Intrinsic explainability – Limiting the complexity and dimensionality of
    ML models in the initial design phase


    +   - Post hoc explainability – Applying explainability methods to analyze the
    model after training


    Intrinsic explainable models are intentionally designed and constructed with simple
    structures to be self-explanatory. Examples of interpretable ML models include
    linear regression, generalized additive models (GAMs), decision trees, and k-nearest
    neighbors. In contrast, ML models that'
