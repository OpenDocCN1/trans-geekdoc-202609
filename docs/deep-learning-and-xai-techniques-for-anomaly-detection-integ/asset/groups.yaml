    # 探索基准归因方法 (BAM)


    SCS 通过李克特量表问卷来评估 XAI 用户界面在向目标受众提供解释方面的有效性，涵盖以下范围：


    - 给定的解释提供了具有相关粒度的因果因素

    - 给定解释的上下文对用户来说是有意义的

    - 用户可以调整所提供解释的粒度

    - 用户需要指导来理解解释

    - 用户在没有支持的情况下也能理解生成解释的因果关系

    - 用户能够结合领域知识应用生成解释的能力

    - XAI 系统产生一致的解释

    - 用户认为生成的解释易于理解

    - 用户需要参考资料或文档来解释生成的解释

    - XAI 系统能够快速、高效地进行解释


    SCS 旨在提供一种直观的方法，来评估 XAI 用户界面的有效性以及 SCS 提供的解释质量。与衡量 0 到 100 之间效用性的 SUS 分数不同，SCS
    将得分归一化为百分比排名。假设 SCS 刻尺的分值范围在 1 到 5 分之间，分别对应*强烈不同意、不同意、同意和非常同意*评分。如果一个 XAI 系统满足所有
    10 项要求，则给出 50 分的高分。例如，根据上述要求，如果一个 XAI 系统的变异值为 44，除以 50 得到归一化的 0.88 SCS 分。


    SCS 的目的是提供一个快速的评估框架，基于终端用户来评估 XAI 界面的质量。SCS 的一个缺陷是，李克特量表遵循序数测量，每个响应类别之间的差异没有明确定义。假设响应类别之间的间隔是相等的可能是误导性的，并可能导致错误的结论。例如，“非常同意”与“同意”之间的情感响应幅度可能与其他连续类别（如“强烈不同意”和“不同意”）不同。此外，用户对解释质量的主观评分可能会误导解释在模拟任务中的有效性。


    在学习了如何使用 SCS 从用户那里获得定性反馈后，下一节将探索使用基准归因方法识别假阳性解释的定量方法。


    # 探索基准归因方法 (BAM)


    尽管目前有多种特征归因 XAI 方法，由于缺乏地面事实数据（ground truth），要量化哪些输入对模型确实重要可能具有挑战性。仅依赖视觉评估在实际上可能是误导性的。对输入数据不敏感的梯度计算
    XAI 方法无法为预期的目标输出产生相关的解释，这在机器学习任务（如异常检测）中可能是有害的。例如，研究表明，某些 XAI 方法无法展示真实的特征重要性，尽管对训练好的模型参数进行了排序，但仍会产生相同的视觉解释或显著性映射。对于
    AI 辅助医疗诊断，当在随机化训练好的模型的数据和参数后，模型预测的解释没有发生变化时，这可能是存在风险且令人担忧的。


    向目标受众提供假阳性解释是没有价值的。解决这一差距的常用方法涉及*人机回评估 (human-in-the-loop assessment)*来评估可解释性的质量，这对于大型数据集来说可能是昂贵的的。因此，XAI
    评估指标应该通过捕获假阳性来证明模型预测的合理性。


    BAM，https://doi.org/10.48550/arXiv.1907.09701，旨在解决假阳性解释问题。BAM 使用带有已知相对特征重要性的训练模型的半合成数据集来评估特征归因的准确性。BAM
    的方法符合 NIST 关于解释准确性的 XAI 原则。


    BAM 训练分类器以从输入图像检测目标对象类和背景场景。预期是，向输入图像添加无关像素不应影响模型预测预期目标对象或背景场景类的能力。


    例如，如图 9.2 所示，一张随机包含鱼的沙漠输入图像，应该导致预期的目标背景场景为沙漠类。那些将鱼分配为背景场景类并赋予更高归因的解释应当是假阳性的。这种假阳性预测可能会误导目标受众，因为在这张输入图像中，鱼在语义上比沙漠更有意义。


    ![](img/c06290096a327475ed918ba4a4328b77_200_0.png)


    图 9.2 – 包含随机对象的输入图像


    BAM 使用以下指标评估特征归因方法：


    - 模型对比分 (MCS)：在相同输入下，衡量两个模型之间的归因差异

    - 输入依赖率 (IDR)：给同一个模型提供两个不同的输入，计算归因差异

    - 输入依赖率 (IIR)：给同一个模型提供两个功能相似的输入，衡量归因差异


    MCS 和 IDR 仅适用于 BAM 数据集，https://github.com/google-research-datasets/bam，而 IIR 适用于所有模型和输入。根据
    BAM 的观察，原生梯度下降和梯度权重类激活映射 (CAM) 不太产生假阳性。相比之下，引导反向传播 (guided backpropagation) 无论特征重要性如何变化似乎分配相同的属性。


    正如第 7 章所述，基于扰动的方法通过评估从输入数据中移除一组预定义的高归因特征后模型性能的变化提供可解释性。与基于扰动的方法相反，BAM 通过识别不重要的特征（其预期归因为为零）来评估忠实性
    (faithfulness)。BAM 对预定义特征不作假设。相反，BAM 的方法专注于通过调整在数据引入该特征的频率，评估该特征相对于两个不同模型的显著性。


    到目前为止，本节回顾了 BAM 如何通过分析相对特征重要性来增强可解释性。接下来，让我们讨论忠实性和单调性的意义。


    # 理解忠实性和单调性


    XAI 中的忠实性是指评估特征重要性评分与单个特征在实际预测上的性能之间的相关性。衡量忠实性通常通过逐步移除预定义的重要特征、观察模型性能的变化并验证与模型预测的相关性来实现。换句话说，识别出的特征与模型输出真正相关吗？


    除了特征重要性相关，研究人员还发现了诸如极性一致性等用于评估解释忠实性的额外属性，https://arxiv.org/abs/2201.12114.v2。机器学习中的极性指的是正负分析——例如，情感分析中的正面和负短语。极性一致性通过衡量解释权重对模型预测的贡献和抑制影响来验证忠实性。


    # 可解释性评估方案


    评估忠实性符合 NIST 的 XAI 原则，评估 XAI 系统产生合理解释和发现知识局限的能力。如果识别出的重要特征对模型预测有贡献，则认为解释是忠实的。


    图 9.3 是忠实性的韦恩图，包含了特征重要性相关性和极性一致性：


    ![](img/c06290096a327475ed918ba4a4328b77_202_0.png)


    图 9.3 - 忠实性韦恩图


    相比之下，XAI 中的**单调性**通过逐步添加预定义的重要特征来评估特征归因，以验证特征相关性。预期是随着重要特征的逐步添加，模型性能应该逐渐提高。*图
    9.4* 对比了 XAI 评估中的忠实性与单调性：


    ![](img/c06290096a327475ed918ba4a4328b77_202_1.png)


    图 9.4 - 忠实性与单调性对比


