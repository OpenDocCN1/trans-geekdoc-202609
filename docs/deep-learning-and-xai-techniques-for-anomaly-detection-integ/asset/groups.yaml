    Figure 9.1 - XAI system design considerations


    So far, you have learned and experienced with various XAI techniques throughout
    the book. In this chapter, we cover the following evaluation schemes based on
    NIST’s fundamental principles to measure the quality of explanations for XAI systems:


    +   * Review the System Causability Scale (SCS)

    * Exploring Benchmarking Attribution Methods (BAM)

    * Faithfulness and monotonicity

    * Human-grounded evaluation framework


    In this chapter, you will learn about the existing XAI evaluation and benchmarking
    landscape and get a sense of which approach to consider for your applications.


    # Review the System Causability Scale (SCS)


    Created in 1986 by John Brooke, the System Usability Scale (SUS) provides a simple
    tool to measure the usability of a system’s user interface. It consists of a 10-item
    questionnaire with 5 options, allowing respondents to evaluate the quality of
    products and services from strongly agree to strongly disagree.


    Inspired by SUS, SCS, available at https://doi.org/10.1007/s13218-020-00636-z,
    focuses on measuring the qualitative aspect of XAI systems. SCS meets the XAI
    principle of meaningfulness by NIST to determine end user perception after explanations
    provided by XAI systems.'
