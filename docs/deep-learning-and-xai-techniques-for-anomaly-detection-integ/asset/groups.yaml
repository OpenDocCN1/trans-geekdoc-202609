    尽管取得了令人瞩目的进展，但深度学习模型的黑箱性质使其难以解释，这对于实际部署和合规性要求是一个缺点。


    《异常检测的深度学习与 XAI 技术》展示了最先进的方法，帮助你理解并应对这些挑战。通过利用书中描述的可解释人工智能 (XAI) 和深度学习技术，你将发现如何在确保公平性和伦理分析的同时，提取关键的业务洞察。


    本实用指南将提供相关工具和最佳实践，以实现深度学习的透明度和可解释性，最终为你的异常检测应用建立信任。在整个章节中，你将掌握异常检测知识，能够胜任一系列现实项目。无论你是在构建计算机视觉还是自然语言处理模型，都将学习如何量化和评估它们的解释性。


    读完本深度学习书籍后，你将能够构建各种深度学习 XAI 模型并进行验证以评估它们的可解释性。


