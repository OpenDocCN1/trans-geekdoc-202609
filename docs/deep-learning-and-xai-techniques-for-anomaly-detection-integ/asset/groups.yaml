  md: "\nAutoGluon works by enrolling and stacking multiple models in layers. Without\
    \ much data preprocessing, AutoGluon can infer a given dataset's ML task based\
    \ on the label column's value type. For example, non-numeric string values in\
    \ the label column indicate a classification problem, whereas repeated values\
    \ in the label column indicate a regression problem.\n\nAutoGluon's TextPredictor\
    \ formats NLP datasets in tables containing text columns and label columns to\
    \ predict text. Each row represents a training example with discrete categorical\
    \ value for classification or continuous values for regression. Furthermore, TextPredictor\
    \ supports multilingual problems and multimodal data tables containing numeric,\
    \ and categorical columns. You can read more about AutoGluon at https://arxiv.org/abs/2003.06505.\n\
