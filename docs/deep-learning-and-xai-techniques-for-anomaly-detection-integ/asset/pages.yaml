- pgno: 54
  md: '# Understanding Explainable AI


    Historically, AI systems have been made by highly skilled researchers and technologists
    in a maldominated industry. According to the World Economic Forum, at https://www.weforum.org/docs/WEF_GGGR_2018.pdf,
    78% of worldwide talents are male, and only 22% are female. This skills gap affects
    underrepresented groups, as girls and women who not have AI educational opportunities.
    Furthermore, developing countries are underrepresented in the AI revolution due
    to the growing digital divide. According to United Nations, 3.7 billion people,
    or 50% of the world population, have no access to modern technological tools or
    communication devices. While AI continues to make strides, an inclusion effort
    is needed to ensure that AI is for everyone and benefits people who cannot afford
    the technology.


    For the authors of this paper, http://jathan-herish.com/wp-content/uploads/2022/12/XAI_skills_gap.pdf,
    conducted an AI experiment with 685 employees with mixed ML experiences to assess
    how the digital divide could affect AI adoption and the significance of XAI in
    establishing user trust. The experiment generated AI predictions to clarify whether
    a loan will incur debate disbursement and without explanations, using Shapley
    values. The surveyed employees were asked to provide feedback on whether they
    trust AI predictions and what factors constitute their trust. The results indicated
    that respondents with ML backgrounds were reluctant to trust AI predictions but
    found the given explanations helpful. This experiment suggests that ML models
    designed with explainability could benefit every users.


    A complex organizational structure may hinder AI-driven decision-making, with
    individual business units taking different stances and diverging perspectives.
    Businesses want to ensure the reliability of AI systems and prevent any negative
    impact over time. XAI can accelerate a company''s AI maturity by bridging the
    gap in understanding AI algorithms among stakeholders and improving time to decision.


    Technology leaders constantly explore and invest in new possibilities to enhance
