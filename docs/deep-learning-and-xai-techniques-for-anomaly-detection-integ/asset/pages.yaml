  md: '# 4


    # Time Series Anomaly

    Explainability


    Time series is a stream of continuous, sequential, indexed, and timestamped data
    points often plotted in temporal line charts to correlate trends, detect seasonality
    patterns, create forecasting, and identify anomalies. Time series data is ubiquitous.
    Examples of time series data are daily stock prices, weekly COVID-19 confirmed
    cases, monthly rainfall measurements, and annual sales revenue.


    The advent of connected technology, storage affordability, and increasing business
    demand for insights enables many systems to generate more data than most organizations
    can consume. According to Statista (https://www.statista.com/statistics/871513/worldwide-data-created/),
    only 2% of 64.2 zettabytes produced globally in 2020 was retained into 2021.


    Finding anomalies in time series produces significant value and applies to many
    real-world use cases. For example, companies proactively monitor manufacturing
    metrics for predictive maintenance to prevent economic loss. Government emergency
    management forecast natural disasters to issue alerts and avoid casualties. Security
    experts evaluate unusual web traffic to detect malicious activities. The healthcare
    industry applies time series analysis for public health observations, such as
    predicting the spread of COVID-19.


    Since anomalies are a rare by nature, finding anomalies in time series data is
    akin to searching for a needle in a haystack. Furthermore, a multivariate time
    series requires considerations across multiple time-dependent variables simultaneously.


    Deep learning has made advancements across diverse fields in research, including
    tackling complex challenges in anomaly detection using time series data. Despite
    high performance, the opaque nature of deep learning presents drawbacks in interpretability
    and slows down deployment.


    This chapter covers deep learning anomaly detection explainability for time series
    data. First, we will cover the basics of time series and various deep learning
    approaches for anomaly detection. Then, we will explore a time series dataset
    to detect, visualize, and explain anomalies using SHapley Additive exPlanations
    (SHAP), provided by Omni Explainable AI (OmniXAI). By the end of this chapter,
    you will understand approaches to building and evaluating time series anomaly
    explainability with deep learning.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# Understanding time series


    Anomaly detection with time series data is crucial for detecting novel and unexpected
    outliers in many real-world use cases, including healthcare, manufacturing, and
    cybersecurity. Hence, it has been an active research domain since the 1960s. As
    computing power and deep learning advances, neural networks can learn expressive
    feature representation using complex and multidimensional time series data with
    higher performance than traditional approaches.


    Let''s discuss the taxonomy of time series data to help us understand deep learning
    approaches for time series anomaly detection. A time series dataset consists of
    observations collected and indexed sequentially over a pre-determined period.
    These time series data points can be univariate or multivariate:


    +   Univariate time series refers to a series of one-dimensional timestamped data,
    with a single column of values that changes around a single variable. For example,
    a univariate time series of monthly precipitation can be used to predict rainfall
    and unexpected downpours.


    +   Multivariate time series refers to a series of multidimensional timestamped
    data, with multiple columns of values that change over time. These variables might
    have temporal or spatial dependencies on each other. A variable with temporal
    dependence might be influenced by another variable''s past or current behavior.
    In contrast, a variable with spatial dependence represents the dynamic relationships
    between a specific observation and nearby data points. For example, a multivariate
    time series containing precipitation, water temperature, humidity, and discharge
    can be used to extract climate patterns.


    As time series measurements can occur at regular or irregular intervals, we can
    observe different trends or movements for relationship correlation. Figure 4.1
    shows the components that represent various trends in time series:


    ![](img/c06290096a327475ed918ba4a4328b77_94_0.png)


    Figure 4.1 – Time series components'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Understanding explainable deep anomaly detection for time series


    Let us learn what each trend represents:


    +   - A secular trend represents a long-term trend that maintains a predictable
    trajectory or continues moving in a stable increasing or decreasing direction
    for the foreseeable future. Examples of secular trends include an aging population
    and computing power.


    +   - A cyclical fluctuation represents the gradual ups and downs without a fixed
    frequency, resulting in successive expansion or contraction cycles. For example,
    consumer spending increases as the economy expands or unemployment decreases.


    +   - A seasonal variation represents systematic or expected variation at a fixed
    frequency. For example, retail revenue typically increases during the holidays,
    and higher electric bills occur in the summer.


    +   - An irregular variation refers to random, non-uniform, and non-seasonal patterns.
    Examples of irregular variations include abnormal electrocardiogram (ECG) readings
    or unusual account withdrawals from an automated teller machine (ATM).


    With a foundational understanding of time series structure, let''s discuss deep
    learning anomaly detection approaches in the following section.


    # Understanding explainable deep anomaly detection for time series


    Because anomalies are rare by nature, many deep learning models learn the feature
    representation from normal observations and detect anomalies by measuring deviations
    from known behavior. Deep learning employs different approaches, such as supervised,
    semi-supervised, and unsupervised, depending on the availability of labeled observations.
    Please refer to Chapter 1 for comparisons of these approaches.


    ![](img/c06290096a327475ed918ba4a4328b77_95_0.png)


    Figure 4.2 – Deep learning anomaly detection for time series'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'Figure 4.2 shows a high-level workflow of deep learning anomaly detection for
    time series with the following stages:


    +   1. A deep learning model takes input data as either a timestep or a sliding
    window A timestep represents an individual data point, whereas a sliding window
    refers to a sequence of timesteps with historical information. Generally, input
    data requires preprocessing tasks, as imputing missing values and normalization,
    to extract the optimal sliding window.


    +   2. Anomalies can surface in point or subsurface form, and not every observation
    is necessarily an outlier. A model calculates anomaly scores based on a defined
    loss function to determine whether the prediction deviates from the rest of the
    data and should be flagged as an anomaly. Essentially, an anomaly score indicates
    the degree of an anomaly, using a threshold identified for risk assessment.


    +   3. XAI aims to provide reasoning behind a model''s prediction. Post hoc explainability
    methods such as SHAP are popular for assessing the quality of the model''s predictions.


    There are three types of deep learning models for time series anomaly detection
    in the workflow:


    +   * Forecasting-based models predict whether an incoming point or sliding window
    is an outlier by comparing the predicted values against their actual values. The
    deviation values become the anomalous values to identify abnormal behavior.


    +   * Reconstruction-based models capture time series embedding by encoding subsequences
    of normal sliding window input to provide temporal context during reconstruction.
    The model generates reconstruction errors, since they are only trained with normal
    observations. Reconstruction errors become the anomalous value to rank anomalies,
    based on a threshold value.


    +   * Hybrid models combine forecasting and reconstruction-based models to achieve
    better learning in time series, using timestamp prediction from forecasting and
    latent representations from the reconstruction approach.


    Following this overview of deep learning approaches for time series anomaly detection,
    let''s explore an example of detecting time series anomalies using a reconstruction-based
    model and evaluating prediction quality with the SHAP XAI method in the next section.


