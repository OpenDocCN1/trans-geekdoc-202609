    As shown in the previous diagram, starting with a trained model, if you can obtain
    the inner structure, such as coefficient weights or the frequency of a feature
    used in an ensemble tree, you should explore a model-specific framework for better
    explainability performance. Otherwise, you should evaluate a model-agnostic framework
    since it does not rely on an internal model structure and focuses on correlating
