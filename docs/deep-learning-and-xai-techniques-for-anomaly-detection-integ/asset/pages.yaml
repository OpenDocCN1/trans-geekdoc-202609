  md: "# Natural Language Processing Anomaly Explainability\n\n```\n[tf.keras.Input(shape=(None,),\
    \ dtype=\"int64\\),\nlayers.Embedding(max_features + 1, 16),\nlayers.Dropout(0.2),\n\
    layers.GlobalAverage1D(),\nlayers.Dropout(0.2),\nlayers.Dense(num_classes),\n\
    layers.Softmax())\n\nnet.compile(\n optimizer=\"adam\",\nloss=losses.SparseCategoricalCrosentropy(),\n\
    metrics=metrics.CategoricalAccuracy(),\n)\nreturn net\n```\n\n+   Wrap the neural\
    \ network with SciKeras as some features from Cleanlab to produce scikit-learn-compatible.\
    \ We are also setting 10 epochs each:\n\n```\nfrom scikeras.wrappers import KerasClassifier\n\
    model = KerasClassifier(get_net(), epochs=10)\n```\n\nCleanlab requires predicted\
    \ probabilities for each data point from a deep learning model. These predicted\
    \ probabilities can be overfitting. Hence, Cleanlab uses out-of-sample predicted\
    \ probabilities via held-out-datapoints from training. Here, we use k-fold cross-validation\
    \ to produce out-sample predicted probabilities, where every training copy of\
    \ defined K copies is trained with unseen data subsets. We can try adjusting num_crossval_folds\
    \ for better results:\n\n```\nfrom sklearn.model_selection import cross_val_predict\n\
    \nnum_crossval_folds = 5\n\npred_probs = cross_val_predict(\n model,\nfull_texts,\n\
    full_labels,\ncv=num_crossval_folds,\nmethod=\"predict_proba\"\n)\n```"
