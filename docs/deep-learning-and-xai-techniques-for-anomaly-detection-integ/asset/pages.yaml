- pgno: 203
  md: 'Figure 9.5 shows a plot for visualizing various metrics in quantifying the
    extent of faithfulness for an explanation:


    ![](img/c06290096a327475ed918ba4a4328b77_203_0.png)


    Let''s understand what each faithfulness metric represents and its scale in quantifying
    faithfulness:


    +   **Decision Flip – Most Informative Token (DFMIT):** This measures faithfulness
    between 0 and 1. A score of 1 means the explanation is faithful. An explanation
    is faithful if it demonstrates valid reasoning for a model''s prediction. For
    example, measuring faithfulness in **natural language processing (NLP)** using
    DFMIT is by observing the average percentage in a model''s decision flips after
    removing the highly important token from the test dataset.

    **Decision Flip – Fraction of Tokens (DFFOT):** Here, the lower the DFFOT value,
    the more faithful it is to an explanation. Like DFMIT, instead of removing the
    highly important token as a whole, DFFOT observes the percentage of decision flips
    by measuring the minimum fraction or threshold of important features to be removed
    that causes a change in the model''s predictions.

    **Comprehensiveness (COMP):** This measures an explanation''s faithfulness based
    on the representation and distribution of important features. A COMP score is
    calculated based on the change in output probability due to important feature
    removal. To test an explanation''s comprehensiveness, create a contrasting example
    and remove the predicted probability The difference between the original and new
    predicted probability yields the COMP score. The higher the COMP score, the more
    faithful it is to an explanation.

    **Sufficiency (SUFF):** This measures faithfulness by evaluating whether important
    features contain sufficient information to retain the original prediction. SUFF
    augments COMP by assessing the continuous importance of a feature to the model.
    For example, removing a subset of known influential tokens or phrases from an
    NLP classifier should cause a change in the predicted probability. SUFF measures
    the average percentage change in this classifier, starting'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'with retaining the top 5% of known important features, incrementally until
    there is a change in the model''s prediction. A lower SUFF score indicates a more
    faithful explanation.


    +   - Correlation between Importance and Output Probability (CORR): Here, an explanation
    is considered faithful if the feature importance and predicted probability are
    positively correlated as the important features are incrementally removed. A higher
    correlation value indicates a more faithful explanation.


    +   - Monotonicity (MONO): Starting with an empty vector, observe the change in
    classification probability after adding features incrementally. An explanation
    is faithful whether the probability of the predicted class increases monotonically
    with the feature addition. A higher monotonicity value indicates a more faithful
    explanation.


    We have covered several XAI metrics to evaluate the faithfulness by isolating
    the impacts of model features and observing model similarity. XAI metrics capture
    intuition on how explanations can improve model interpretability and a user''s
    understanding of the model''s behavior. Choosing the appropriate XAI metrics is
    crucial to ensure a model''s trustworthiness with justifiable rationale.


    The following section explores how the human-grounded evaluation framework enables
    quantitative analysis of human reasoning in ML-generated explanations.


    # Human-grounded evaluation framework


    Explainations are practical and helpful when they enable the target audience to
    build a mental representation of model behavior and grasp the inferential process.
    The target audience encompasses end users without domain knowledge and expert
    users who can provide informed feedback.


    Measuring human simulatability is essential to evaluate the extent of a person''s
    understanding of an ML behavior. There are two types of human simulatability:


    +   - Forward simulation: A human predicts a model''s output based on a given
    input. For example, ask a user to estimate house prices given a specific zip code.


    +   - Counterfactual simulation: Given an input and output, a human predicts a
    model''s output or makes a causal judgment if the input is different. For example,
    ask a user to predict if they will miss a flight if it arrives 20 minutes earlier
    at the airport.


    Simulating prediction from end users provides insights into inaccurate model predictions
    based on unusual or irrelevant features. Alternatively, users can interact with
    XAI systems and provide feedback through survey mechanisms such as the SCS Likert
    scale questionnaire on whether they get any insights from the XAI system by the
    end of the trial.


    Accurate and meaningful XAI explanations should support model debugging. Expert
    users, such as data scientists, can provide feedback on whether machine-generated
    explanations help identify gaps and improve model performance.'
