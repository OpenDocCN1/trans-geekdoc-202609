    # Detecting fraud


    The continued growth of the global economy and increased business demand for real-time
    and ubiquitous digital payment methods open the door to fraud exposure, causing
    electronic commerce systems to be vulnerable to organized crime. Fraud prevention
    mechanisms that protect technological systems from potential fraud risks are insufficient
    to cover all possible fraudulent scenarios. Thus, fraud detection systems provide
    an additional layer of protection in detecting suspicious and malicious activities.


    Discovery sampling is an auditing technique that determines whether to approve
    or reject a sampled audit population if the percentage error rate is below the
    defined minimum unacceptable threshold. Manual fraud audit techniques based on
    discovery sampling require domain knowledge across multiple disciplines and are
    time-consuming. Leveraging machine learning (ML) in fraud detection systems has
    proven to produce higher model accuracy and detect novel anomaly classes.


    Fraud detection systems leverage behavioral profiling methods to prevent fraud
    by modeling individual behavioral patterns and monitoring deviations from the
    norms, such as daily banking activities, spending velocity, transacted foreign
    countries, and beneficiaries based on historical transactions. Nevertheless, an
    individual’s spending habits are influenced by changes in income, lifestyle, and
    other external factors. Such unpredictable changes can introduce concept drift
    with the underlying model. Hence, a fraud detection model and an individual’s
    transactional profiling must be recursively and dynamically updated by correlating
    input data and various parameters to enable adaptive behavioral profiling.


    Let’s review a fraud detection example using an anonymized multivariate credit
    card transactions dataset from https://www.kaggle.com/datasets/whenanancodes/fraud-detection
    and AutoEncoder provided by PyOD, https://pyod.readthedocs.io/en/latest/pyod.models#module-pyod.models.auto_encoder.


    AutoEncoder is an unsupervised deep learning algorithm that can reconstruct high
    dimensional input data using a compressed latent representation of the input data.
    AutoEncoder helps detect abnormalities in the data by calculating the reconstruction
    errors.'
