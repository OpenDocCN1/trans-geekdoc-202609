    # Diagnosing medical conditions


    The physiological data collection through medical diagnosis applications, such
    as magnetic resonance imaging (MRI), and wearable devices, enables healthcare
    professionals to highlight abnormal readings that may be precursors of potential
    health risks to patients using anomaly detection approaches. Besides medical diagnosis,
    anomaly detection helps healthcare providers predict recovery and escalates medical
    risks by forecasting physiological signals, such as heart rate and blood pressure.


    Detection and prediction accuracy is critical in medical anomaly detection as
    they involve time-sensitive decisions and life-death situations. Besides common
    challenges with class imbalance and scarcity of anomaly samples, medical anomaly
    detection faces challenges in distinguishing patient and demographic-specific
    characteristics.


    Deep learning techniques have gained popularity in medical anomaly detection due
    to their feature learning and non-linearity modeling capabilities. However, current
    deep anomaly detection methods mainly correlate patients'' symptoms with a known
    disease category based on annotated data. Medical experts will be skeptical of
    trusting decisions from black-box models without quantifiable causal estimation
    or explanation. The role of explainable artificial intelligence (XAI) is crucial
    in providing end visibility into how a deep learning model derives a prediction
    that leads to informed decision-making.


    # Monitoring cybersecurity threats


    Detecting zero-day attacks or unforeseen threats is highly desirable in security
    applications. Therefore, unsupervised deep learning techniques using unlabeled
    datasets are widely applied in security-related anomaly detection applications
    such as intrusion detection systems (IDS), web attack detection, surveillance,
    and advanced persistent threat (APT).


    Two categories of IDS are host-based and network-based. Host-based IDS detect
    collective anomalies such as malicious applications, policy violations, and unauthorized
    access by analyzing sequential call traces at the operating system level. Network-based
    IDS analyze high-dimensional network data to identify potential external attacks
    for unauthorized access.


    Web applications are now an annoying target for criminals as data becomes ubiquitous.
    Existing signature-based techniques using static rules no longer provide sufficient
    web attack protection because the quality of rules depends on known attacks in
    the signature dataset. Anomaly-based web attack detection methods distinguish
    anomalous web requests by measuring the probability threshold of attributes in
    the request to the established normal request profiles.'
