- pgno: 52
  md: '# Understanding Explainable AI


    Let''s review these approaches:


    +   - Pre-processing XAI techniques: These focus on removing bias before the model
    learning process, including feature weighting to avoid discrimination against
    sensitive variables or ensuring a balanced and inclusive representation of diversity
    in the input data. Examples include exploratory data analysis, explainable feature
    engineering, dataset standardization, and dataset summarization methods.

    - In-processing XAI techniques: One dilemma of XAI in constructing an explanation
    is to protect confidential information from being exposed to adversarial attacks,
    which could alter model output by manipulating input based on a given explanation.
    In-processing XAI techniques are implemented during model training to optimize
    target variable prediction while minimizing feature prediction. For example, the
    fairness constraints restrict model behavior by enforcing fairness conditions
    within a model, adversarial debiasing removes exposure of protected attributes
    from model predictions, and the prejudice remover adds discrimination-aware regularization.

    - Post-processing XAI techniques: These are applied after a model is trained without
    changing the input data. Common methodologies include perturbation, backpropagation,
    and activation optimization. We can use backpropagation and perturbation in more
    depth in Chapter 7.


    # Reviewing XAI significance


    Sophisticated and deep learning algorithms are capable of performing many tasks.
    Nevertheless, humans often cannot comprehend how AI systems make decisions due
    to their opaque nature. Fundamental questions to consider on why we need XAI are
    who built AI and who AI is built for. XAI has been viewed as a significant effort
    to keep the momentum going in the AI research field. As Albert Einstein said,
    "If you can''t explain it, you don''t understand it well enough." Without adequate
    understanding, humans cannot translate valuable insights produced by AI into actionable
    real-world knowledge. This section covers the following topics to help us understand
    significance for continuous advancements toward trustworthy AI:


    +   - Considering the right to explanation

    - Driving inclusion with XAI

    - Mitigating business risks


    # Considering the right to explanation


    Since its inception in 2016, the GDPR''s mission has been to unify data protection
    laws across EU member countries. Data protection is part of the EU Charter of
    Fundamental Rights to protect any personally identifiable data created through
    digital platforms. The legislation reaches beyond EU boundaries. Businesses collecting
    and processing EU residents'' data are subject to GDPR regulatory requirements,
    regardless of where the data processing occurs or where a company resides.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Reviewing XAI significance


    Examples of GDPR articles relevant to XAI the following:


    +   - Article 12: "Transparent information, communication and modalities for the
    exercise of the rights of the data subject" (https://gdpr-info.eu/art-12-gdpr/).
    This requires businesses to communicate intelligible information to data subjects
    in their natural language.


    +   - Article 15: "Right of access to the data subject" (https://gdpr-info.eu/art-15-gdpr/).
    This states that the data subject is entitled to obtain explanations about the
    logic involved with automated decision-making processes.


    +   - Article 22: "Automated individual decision-making, including profiling"
    (https://gdpr-info.eu/art-22-gdpr/). Grants individuals the right to request human
    intervention to validate AI decisions. Considering the implications of the right
    to explanation in Article 15 and the right to human intervention in Article 22,
    businesses must have a clear picture of how their automated systems comply with
    GDPR.


    This paper, https://doi.org/10.1093/ipab02, discussed how GDPR Article 22 could
    pose challenges to accountability in an AI-based anomaly detection system, due
    to automated decision-making. For example, a user might be surprised to find their
    account frozen due to an abnormal spending pattern, detected by their bank using
    an anomaly detection algorithm. Under the GDPR, this user is entitled to request
    human intervention in validating an automated decision and obtain explanations
    on what triggered such an action.


    Violating GDPR can result in financial liability up to 4% of total annual revenue
    or 20 million euros, whichever is higher. A company will be subject to negative
    reputational consequences. Besides the GDPR, other regulations follow suit to
    enforce compliance. For example, Equal Credit Opportunity Act demands businesses
    to provide a statement of reasons for denied credit applications. With increased
    enforcement of the right to explanation across regulations, firms must perform
    diligence on XAI to improve user experience, establish trust, and minimize business
    risks.


    ML algorithms focus on statistical correlations to estimate probability without
    the causal relationship between variables. Besides reviewing potential data and
    algorithmic bias, firms must be aware of explainability capabilities to support
    the continued use of AI systems. Rather than one-size-fits-all approach, businesses
    should focus on producing user-centered explanations, as described by the GDPR
    articles.


    Now that you understand the legal implications of the right to explanation for
    anomaly detection, let''s review the social impacts of XAI in the following section.


    # Driving inclusion with XAI


    The skills and AI diversity remain prominent in the AI field. Building a successful
    AI team requires a versatile set and diversity representation across protected
    characteristics, including age, race, national origin, religion, marital status,
    disability, and sexual orientation. In-demand AI skills include machine learning,
    statistics, probability, data analytics and visualization, programming, cloud
    computing, and cognitive science.'
