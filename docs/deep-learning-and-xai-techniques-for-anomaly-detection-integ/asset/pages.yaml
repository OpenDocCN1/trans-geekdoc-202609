  md: '# Model-Specific Explainability


    In this section, you completed a walk-through of evaluating saliency techniques
    by comparing IG and Guided IG. Traditionally, backpropagation methods evaluate
    gradients corresponding to the input image to identify pixel attribution and produce
    a saliency map using weighted gradients in a specific neural network. The path
    IG starts with a black line and ends at the input image by following a direction
    where all pixels increment at the same rate, capturing irrelevant pixels along
    the way. Although IG detected most obstructions, Guided IG demonstrated less noise
    and better visual saliency.


    Guided IG applies APMs to generalize the attribution path for both the image and
    model to create realistic saliency maps that are true to the predicted class.
    Selectively filtering subsets of models with the lowest absolute value and adapting
    the integration path to the input, baseline, and model allows Guided IG to avoid
    picking noisy signals.


    After reviewing model-agnostic and model-specific XAI examples, you might wonder
    which method to choose. The following section provides a general guide for selecting
    an XAI method.


    # Choosing an XAI method


    With a shift in public awareness and regulatory compliance, explainability is
    essential for organizations that require automated decision-making. This paper,
    https://arxiv.org/abs/2107.04427, proposes a methodology containing the following
    properties to bridge the gap between stakeholder needs and explainability methods
    based on human-centered AI:


    +   **Explanation method properties:** XAI should consist of compatibility properties,
    explanation properties, method and process. Properties refer to elements that
    determine the feasibility of an XAI method for a project type or use case. In
    contrast, explanation properties must define the scope of explanations, including
    language type and the content of an explanation. Furthermore, method usage should
    provide information on using an XAI method with process properties to identify
    a mechanism for producing explanations.


    +   **Explainability needs:** It is essential to identify the right stakeholders
    and capture stakeholder needs through questionnaires, including use case constraint,
    functional and non-functional requirements.


    +   **Information collection:** The identification of stakeholders is finalized,
    curate a list of questionnaires to obtain details for each requirement need.


    +   **Matching stakeholder needs with explanation method properties:** After a
    thorough requirements analysis, you should integrate XAI technical knowledge and
    present the extent of explainability that will be addressed and any known limitations
    with existing XAI techniques to stakeholders.


    Once you gain clarity on stakeholder needs, the next step is to decide which XAI
    method to choose. Generally, you should determine whether the internal structure
    of an ML model is interpretable and has a clear representation. For example, decision
    trees are more interpretable than deep learning neural networks. You can interpret
    a decision tree by extracting decision rules and measuring the quality of the
    decision split using the Gini impurity metric to identify potential misclassification.
    However,'
