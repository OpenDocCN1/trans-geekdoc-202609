    # Understanding natural language processing


    Text classification is an NLP task that categorizes text into groups using predefined
    labels. Common business use cases for text classification include sentiment analysis,
    topic detection, and language detection. Classifying content valuable business
    insights into customer preferences, personalized experience, content moderation,
    emerging market segments, and social sentiment.


    For an overview of NLP, we will train a text classification model using AutoGluon,
    https://auto.gluon.ai/, and a public repository for Amazon reviews, https://doi.org/10.7910/DVN/W960FO,
    maintained by Harvard Dataverse. The data repository contains 7 datasets collected
    between 2008 and 2020, with 5,000 reviews each. You can download the export_food.csv
    file from this repository for the example walk through.


    The following section gives an overview of AutoGluon.


    # Reviewing AutoGluon


    AutoGluon is an open source AutoML library developed by Amazon that automates
    deep learning and ML applications for text, tabular, and image data. Without prior
    ML experience, users can train state-of-the-art and highly accurate models for
    text classification, tabular data prediction, and image classification with a
    few lines of code and minimal setup.'
