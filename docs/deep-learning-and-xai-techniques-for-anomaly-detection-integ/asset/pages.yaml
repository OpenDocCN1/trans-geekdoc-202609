    Deep learning models are excellent in extracting low-level features for images,
    such as corners, edges, and stripes. However, these low-level features are not
    interpretable by humans. The LIMEImageExplainer method from the lime_image provides
    high-level explanations for an image classifier by highlighting the regions of
    interest (ROIs) or superpixels that contribute positively or negatively to the
    model''s predictions. Consequently, LIME assesses whether the provided explanations
    are sensitive and prevent a model from making accurate predictions for wrong reasons.


    In this section, we built an image classifier using Inception V3 pre-trained model
    and explained the output using LIME. Next, let''s discuss best practices when
    using intrinsic versus post hoc explainability.


    # Considering intrinsic versus post hoc explainability


    Can we ignore explainability and just trust state-of-the-art models? The short
    answer is no. Correct prediction does not adequately solve real-world problems.
    Users will not adopt an AI system unless it is trustworthy. Knowing why predictions
    are important to show how much an AI system can be trusted and provide insights
    into the best course of action with domain expertise.


    There are no hard-and-fast rules when choosing intrinsic versus post hoc explainability.
    For explainability''s sake, an intrinsic model with adequate accuracy is always
    preferable over a complex model. Otherwise, post-processing methods are alternatives
    to provide post hoc explainability after model training.


    Invitably, humans trust explanations selections with unbiased bias based on position,
    domain knowledge, and personal experience. Often, humans seek contrastive and
    interactive explanations since they are easier to understand. Hence, partial information
    might be lost when producing explanations. Therefore, judicious explanations faithful
    to the model are essential to increase user trust by focusing on important aspects
    rather than every detail.'
