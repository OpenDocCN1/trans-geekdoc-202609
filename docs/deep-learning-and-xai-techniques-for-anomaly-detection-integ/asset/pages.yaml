- pgno: 115
  md: '# Computer Vision Anomaly Explainability


    Computer vision anomaly detection has broad applications, such as industrial manufacturing,
    medical imaging analysis, and autonomous driving. Detecting anomalies in image
    data is yet crucial to identifying abnormal events, safety risks, and quality
    defects that may cause financial and brand damage to many companies.


    According to the American Society for Quality at https://asq.org/quality-resources/cost-of-financial
    loss, organizations can incur 15-20% quality-related costs from their sales revenue.
    Beyond financial loss, quality-related activities can result in poor customer
    satisfaction, potential lawsuits, and productivity impact. Hence, research for
    visual anomaly detection plays a critical role in theory and applications. For
    example, the adoption of robotics is expected to increase by 50% in the next 5
    years, according to a survey by Material Handling Institute (MHI) at https://www.nytimes.com/2022/07/12/business/warehouse-technology-robotics.html.
    However, a broader adoption of self-driving vehicles on public roads faces technical
    challenges and legal scrutiny.


    We reviewed explainability for natural language processing (NLP) in Chapter 3
    and time series in Chapter 4. In this chapter, we will explore the following to
    understand Explainable AI (XAI) aspects of deep learning detection for computer
    vision, also known as visual anomaly detection.


    More specifically, in this chapter, we will cover the following topics:


    +   * Reviewing visual anomaly detection

    * Integrating deep visual anomaly detection with XAI

    * Problem and solution walkthrough'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'For the example walkthrough, we will experiment with a visual detection problem
    using a chest X-ray dataset to detect images with pneumonia. Then, you will visualize
    the model''s Class Activation Map (CAM) and Gradient-weighted Class Activation
    Mapping (Grad-CAM) to interpret discriminative image regions that a convolutional
    neural network (CNN) uses to identify target image class.


    The following section reviews the taxonomy of visual anomaly detection.


    # Reviewing visual anomaly detection


    Anomaly detection detects non-conforming patterns based on expected behavior to
    create a reasonable model for observing unseen data. Visual anomaly detection
    refers to identifying and localizing anomalous regions in imagery data using machine
    learning (ML) approaches, such as supervised, semi-supervised, and unsupervised
    techniques to surface anomalies through visual inspection. Please refer to Chapter
    1 for comparisons of these techniques.


    There are two approaches for assessing visual anomalies:


    +   - **Image-level**: This approach evaluates whether the whole image is normal
    or abnormal.

    - **Pixel-level**: This approach detects abnormal regions in an image to determine
    whether an image is normal or abnormal. The pixel-level method is widely used
    in industrial fault detection and medical diagnosis. However, this approach can
    be challenging for mission-critical applications due to large variations and ambiguous
    boundaries.


    Generally, most vision XAI explain an ML model''s decisions by producing values
    based on output probabilities, heatmap generation, or scatter plots to reveal
    the correlations of input features. Examples include CAM and Grad-CAM, which we
    will review in this chapter, saliency maps in Chapter 7, and **Integrated Gradients
    (Guided IG)** in Chapter 8.


    The following section reviews various image-level and pixel-level techniques.


    # Reviewing image-level visual anomaly detection


    Traditional ML methods typically compare the output distribution of images with
    a reference distribution model. These methods evaluate differences in the distribution
    model to determine whether anomalies exist. Deep learning algorithms such as CNNs
    enhance traditional methods with powerful representation capability using high-dimensional
    data. The following are examples of image-level anomaly detection:


    +   - **Density estimation**: This method estimates and compares the probability
    distribution model between a normal and an unseen image to determine deviations
    for anomaly detection. Density estimation methods such as **k-nearest neighbors
    (KNN)** require a large dataset. Furthermore, feature dimensions become increasingly
    complex as the dataset grows. Deep learning models can enhance density estimation
    by establishing probability distribution for high-dimensional imagery data.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '+   One-class classification (OCC): This method classifies the normal class
    by constructing a decision boundary in the feature space. Estimating concrete
    probability for each data point is optional for OCC. Deep neural networks enhance
    OCC by applying feature extraction. For example, One-Class Convolutional Neural
    Network (OCC-CNN), https://arxiv.org/pdf/1901.08688.pdf, is a CNN-based anomaly
    detection methods employ OCC anomalies are rare and the learning process focuses
    only on one target.


    +   Image reconstruction: This method maps an input image to a low-dimensional
    representation to reconstruct the original image through inverse mapping. Image
    reconstruction assumes normal images produce small reconstruction errors, whereas
    anomalous data should yield higher reconstruction errors. Image reconstruction
    methods such as autoencoder, which we reviewed in Chapter 1, is an unsupervised
    neural network that compresses the input data through a hidden layer to reconstruct
    the original image. The intuition is that compressing information would be difficult
    if the input features are independent or non-redundant. compressing redundant
    information should be straightforward if the data has a similar structure.


    +   Self-supervised classification: This method uses large-scale unsupervised
    data to learn visual representations as color, texture, location, shape, position,
    and direction from available self-constructed supervision for downstream tasks
    such as anomaly detection.


    # Reviewing pixel-level anomaly detection


    Although image-level algorithms can be used for deriving pixel-level anomaly detection
    by segmenting the whole image into patches, semantic information may be lacking.
    Hence, the following unsupervised pixel-level approaches are ideal:


    +   Image reconstruction: Assuming convolutional neural networks are only trained
    with normal images, the pixel-level image reconstruction method reconstructs the
    input image. Then, it evaluates the pixel difference between the input and reconstructed
    image to determine anomalous regions. Creating high-quality images from sharp
    edges and complex textures is challenging for pixel-level anomaly detection, leading
    to a higher probability of false positives in detecting abnormalities.


    +   Feature modeling: Unlike image reconstruction, feature-based methods focus
    on detecting anomalies using curated local region feature representations of the
    whole image. Deviations in feature distribution between a regional feature and
    the test image''s local region determine whether the target region should be labeled
    as an anomaly.


    Having provided an overview of anomaly detection techniques for computer vision,
    let''s explore what a deep learning model looks for when finding anomalies in
    the following section.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# # Integrating deep visual anomaly detection with XAI


    Deep learning presents enormous opportunities in computer vision anomaly detection
    by teaching computers to mimic human visual systems. For example, CNNs are designed
    to replicate the structure of the human visual cortex for computer vision tasks
    such as object detection, image classification, and semantic segmentation. Figure
    5.1 shows a high-level architecture of a:


    ![](img/c06290096a327475ed918ba4a4328b77_118_0.png)


    Figure 5.1 - A simple CNN architecture


    As you see in the preceding image, the high-level architecture of a CNN is shown
    with the following main layers. You can learn more about CNNs from this paper,
    https://ieeeexplore.ieee.org/document/830818. The layers in this architecture
    are:


    +   - **Convolutional layer**: This is the first layer that extracts various features
    from an input image. When the convolutional layer receives an input, it produces
    a 2D activation map by convolving each filter across the spatial dimensionality.
    The network learns a specific feature at a particular spatial position by gliding
    through the input using these filters.

    - **Pooling layer**: This layer processes each activation map from the input using
    max pooling or averaging pooling to reduce the number of parameters and downsample
    the spatial dimensionality of a given input image for activations.

    - **Fully-connected layer**: This is the last layer that receives outputs from
    the pooling layer and produces the best possible label by producing scores based
    on activations for classification.


    You are probably wondering, can humans understand how deep learning thinks? It
    is not feasible for humans to figure out the complex mapping and millions of weights
    that a neural network uses to predict a given input. XAI methods like CAM and
    Grad-CAM are essential to facilitate interpretability.


    CAM, http://cnnlocalization.csail.mit.edu/, helps users interpret how a CNN predicts
    a specific image label by localizing the relevant regions in an image to see.
    Visualizing what the model sees using heatmaps allows us to identify potential
    biases influencing a model''s decision-making and debug the model before deploying
    it to production. While CAM provides'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'heatmaps to interpret a CNN model, it can be noisy and suffer a loss of spatial
    information. Alternatively, Grad-CAM can improve CAM''s accuracy by retaining
    important spatial information to capture more activation maps.


    Grad-CAM, https://arxiv.org/abs/1610.02391, is a technique that generalizes CAM
    to produce visual explanations for CNN-based models. Grad-CAM exploits spatial
    information captured across layers to identify features that influence a model''s
    prediction. It uses gradients from the final convolutional activation maps to
    highlight important regions in the image. Grad-CAM is a post hoc mechanism for
    visualization. Unlike CAM, Grad-CAM does not have specific CNN architecture requirements.


    Now that you understand XAI approaches for visual anomaly detection using deep
    learning, let''s discuss what you will need for the example walkthrough.


    # # Technical requirements


    You will need the following technical requirements to experiment with the example:


    +   - **OpenCV-Python**: An open source library for image processing and computer
    vision tasks such as face detection and object tracking

    - **Keras**: An open source library for building neural networks

    - **Matplotlib**: A plotting library for creating data visualizations

    - **NumPy**: An open source library that provides mathematical functions when
    working with arrays

    - **pandas**: A library that offers data analysis and manipulation tools

    - **SciPy**: An open source Python library for scientific and technical computing

    - **Slearn**: An ML tool for predictive data analysis

    - **TensorFlow**: An open source framework for building deep learning applications


    A sample notebook and requirements file for package dependencies discussed in
