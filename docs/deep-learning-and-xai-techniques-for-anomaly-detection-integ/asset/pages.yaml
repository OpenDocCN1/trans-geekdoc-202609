  md: 'A neuron contains an activation function to produce prediction through the
    output layer. Figure 1.19 shows a basic deep learning architecture:


    ![](img/c06290096a327475ed918ba4a4328b77_40_0.png)


    Anomaly detection techniques are generally available in three categories:


    +   - **Supervised anomaly detection**: Train an ML model with an imbalanced labeled
    dataset where each instance is categorized into a normal or abnormal class. This
    approach is viable if ground truth or actual observation is available. An anomaly
    detection model determines the class of unseen data outliers follow the same distribution
    as the training dataset. Limitations of supervised anomaly detection include scarcity
    of anomaly samples and challenges in identifying precise representation of the
    normal class.

    - **Semi-supervised anomaly detection**: Train an ML model with a large amount
    of unlabeled datasets supplemented by a small set of labeled data for expected
    behavior. This approach assumes outliers differ from training dataset distribution.
    Hence, semi-supervised is more applicable than detecting outliers since anomalies
    are rare.

    - **Unsupervised anomaly detection**: Train an ML model with an unlabeled dataset
    that contains normal and abnormal observations. This approach assumes normal and
    abnormal observations typically isolated in high-density and low-density regions.
    An anomaly detector looks for instances or potential outliers in the low-density
    region.'
