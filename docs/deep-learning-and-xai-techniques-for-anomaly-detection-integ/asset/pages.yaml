- pgno: 60
  md: 'There is abundant unstructured textual data around us for NLP tasks, such as
    text classification, topic modeling, and intent detection. NLP enables computers
    to understand and analyze massive amounts of written and verbal human language
    at the scale. The goal is to contextualize language nuances and extract useful
    information to derive valuable insights.


    Deep learning has revolutionized many NLP applications, including text summarization,
    machine translation, and question-answering. Despite high accuracy, industry experts
    challenge the interpretability and credibility of deep learning model predictions
    by their opaque nature. Furthermore, common linguistic challenges such as sarcasm,
    slang, and polysemy in textual data add complexity to handling lexical and syntactic
    ambiguity. NLP explainability aims to uncover the interpretability of word embedding
    models and understand the internal representations of neural networks for NLP,
    such as transformer models.


    There are two example walkthroughs in this chapter to cover NLP explainability:


    +   - Using the public Customer Reviews dataset, https://doi.org/10.7910/DVN/W960FO,
    uses the basics of NLP to build a text classifier for multiclass text classification
    with AutoGluon, https://github.com/autogluon/autogluon, an open source automated
    machine learning (AutoML) library developed by Amazon.


    +   - For NLP explainability example, you will use the same dataset to detect
    anomalies in text using Cleanlab, https://github.com/cleanlab/cleanlab, an open
    source library that can find potential label errors for multiclass text classification
    and assess the quality of predictions using Shapley Additive Explanations (SHAP),
    https://github.com/slundberg/shap.


    By the end of this chapter, you will have gained a deeper understanding of evaluating
    explainability for NLP anomaly detection. Next, let''s discuss the technical requirements
    for this chapter.


