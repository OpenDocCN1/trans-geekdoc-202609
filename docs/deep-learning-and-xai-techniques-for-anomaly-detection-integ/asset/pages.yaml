  md: "20. Create functions to get the image array. Map the input image to the last\
    \ convolutional layer and compute gradients to show activation corresponding to\
    \ the last convolutional layer's feature map:\n\n```\ndef get_img_array(img_path,\
    \ size):\n    img = keras.preprocessing.image.load_img(img_\npath, target_size=size)\n\
    \    array = keras.preprocessing.image.img_to_\narray(img)\n    array = np.expand_dims(array,\
    \ axis=0)\n    return array\n```\n\n```\ndef make_gradcam_map(img_array, model,\
    \ last_conv_\nlayer_name, pred_index=None):\n    grad_model = tf.keras.models.Model(\n\
    \        [model.inputs], [model.get_layer(last_\nconv_layer_name)].output, model.output\n\
    \    )\n```\n\n```\n    with tf.GradientTape() as tape:\n        last_conv_layer_output,\
    \ preds = grad_\nmodel(img_array)\n        if pred_index is None:\n          \
    \  pred_index = tf.argmax(preds[0])\n        class_channel = preds[:, pred_index]\n\
    \        grads = tape.gradient(class_channel, last_conv_\nlayer_output)\n    \
    \    pooled_grads = tf.reduce_mean(grads, axis=(0, 1))\n        last_conv_layer_output\
    \ = last_conv_layer_\noutput[0]\n        heatmap = last_conv_layer_output @ pooled_\n\
    grads[..., tf.newaxis]\n        heatmap = tf.squeeze(heatmap)\n        heatmap\
    \ = tf.maximum(heatmap, 0) / tf.math.\n```"
