- pgno: 55
  md: '# Mitigating business risks


    With AI adoption rising, regulators are enforcing stricter policies that mandate
    explainability and interpretability with AI systems to protect citizens from harmful
    effects. Hence, firms are required to adhere to strict regulatory compliance.


    Besides regulatory compliance, firms that embrace XAI gain increased AI adoption.
    According to McKinsey at, https://www.mcksey.com/business-functions/quantumblack/our-insights/global-survey-the-state-of-ai-in-2020,
    a global manufacturer found its first workers did not trust AI decisions to operate
    a piece of heavy and potentially dangerous equipment after a significant investment
    in AI systems. To increase workers'' confidence in AI and enable explainability,
    the manufacturer opted for more transparent models to improve Return on Investment
    (ROI).


    Many companies accelerated their analytics strategy during COVID-19 by embracing
    AI technologies. According to Gartner, https://www.gartner.com/en/newsroom/press-releases/2021-09-07-gartner-identifies-four-trends-driving-near-term-artificial-innovation,
    AI roles should demonstrate responsible expertise by 2023. Greater insights come
    with greater risks and responsibility. Business and technology are increasingly
    aware of possible consequences and liability caused by decisions made by AI systems.
    Furthermore, failure to address public perception of bias and concerns over unfairness
    in AI systems can hinder AI adoption.


    We learned about the implications of XAI due to public awareness in this system.
    Next, let''s explore a methodology for choosing the appropriate XAI technique
    for deep learning anomaly detection solutions.


    # Choosing XAI techniques


    Fundamental XAI principles warrant AI systems to provide some forms of explanations,
    evidence, and information apprehensible by humans to justify model output. The
    main objective of XAI is to make AI decisions comprehensible to everyday users.
    Choosing an XAI technique for deep learning anomaly detection requires careful
    deliberation and thorough analysis of the following aspects:


    +   - **Analyze stakeholders and scope of explainability**: Know your audience,
    understand their roles, and discover what matters to them. Gather functional and
    non-functional requirements using questionnaires or existing documentation – for
    example, what qualifies as an anomaly in their business domain? What is an acceptable
    threshold when detecting outliers? What will they do with the explanations? Do
    they need reasoning for every prediction or aggregated to understand the overall
    model behavior?


    +   - **Identify data modalities**: XAI techniques differ by the data input they
    explain – for example, explaining images focuses more on the visual saliency of
    superpixels, while explaining text relies on highlighting key phrases contributing
    to the model prediction.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '+   Choosing XAI algorithms: There are two main categories of XAI algorithms
    for explaining deep learning models – perturbation and gradient-based algorithms.
    While the perturbation-based XAI technique produces intuitive explanations such
    as attribution maps, the output can be sensitive to tiny perturbations. In contrast,
    the gradient-based XAI method generates more robust explanations, which might
    not be faithful to the original model. Chapter 7 covers perturbation and gradient-based
    XAI techniques in more depth.


    +   Determine success criteria: Interpretability can be subjective with respect
    to a user''s preferences, experiences, subject matter knowledge, beliefs, and
    cultural influence. An organization might decide what explanations generated by
    an AI system it should present to stakeholders and how to do so. How often do
    they need access to this information? What would be a well-designed human-centered
    XAI interface? Are the explanations simulatable and reproducible? Chapter 9 covers
    explainability schemes in more detail.


    The general public consensus is that better performance with AI algorithms leads
    to complexity and lower interpretability. Most high-performing techniques, such
    as deep learning, are often less explainable. Conversely, most explainable methods,
    such as decision trees, accuracy factor. Nevertheless, interpretability can be
    subjective to users, and the satisfactory level of explainability can vary depending
    on people and their preferences.


    Despite ongoing research on benchmarking XAI methods, there is no unified approach
    to measure the quality of explanations, since XAI approaches vary on use cases,
    data modalities, and algorithm choices. Thus, a better understanding of inner
    logic helps correct potential deficiencies, implement quality control of input
    variables, ensure impartial decision-making, and detect vulnerabilities for adversarial
    perturbations that could manipulate model prediction.


    Implementing XAI at scale extends beyond technology. Companies must define a sound
    business strategy to balance the trade-offs between accuracy and explainability
    to meet compliance requirements. Therefore it is essential to understand the fundamentals
    of XAI and related concepts when choosing appropriate explainability frameworks
    and tools.


    # Summary


    While the advent of AI has pushed the boundary of what''s possible, interpretability
    makes it more accessible by providing relevant model metrics to satisfy the needs
    of company stakeholders. Future XAI advancements require further testing on the
    validity of existing explainability frameworks and careful engineering to communicate
    human-comprehensible explanations and drive effective interpretability.


    This chapter concludes Part 1 of the book. You gained an overview of deep learning
    and XAI for anomaly detection, including their significance and best practices.
    In Part 2, we will cover practical examples of building deep learning anomaly
    detectors, starting with NLP.'
