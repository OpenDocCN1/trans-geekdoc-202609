    \    lowercase = tf.strings.lower(input_data)\n    stripped_html = tf.strings.regex_replace(lowercase,\n\
    \    \"<br />\", \"\")\n    return tf.strings.regex_replace(stripped_html, f\"\
    [{re.escape(string.punctuation)}]\", \"\")\n```\n\n14. Map text features to integer\
    \ sequences:\n\n```\nfrom tensorflow.keras import layers\n\ntf.keras.utils.set_random_seed(SEED)\n\
    \nmax_features = 1000\nsequence_length = 250\n\nvectorize_layer = layers.TextVectorization(\n\
    \    standardize=preprocess_text,\n    max_tokens=max_features,\n    output_mode=\"\
    int\",\n    output_sequence_length=sequence_length,\n)\n```\n\n15. Apply preprocessing\
    \ to the dataset by calling adapt:\n\n```\nvectorize_layer.adapt(raw_full_texts_arr)\n\
    full_texts = vectorize_layer(raw_full_texts_arr)\nfull_texts = full_texts.numpy()\n\
    ```\n\n16. Create a simple neural network for multiclass text classification:\n\
    \n```\nfrom tensorflow.keras import losses, metrics\nfrom tensorflow.keras.optimizers\
    \ import Adam\n\ndef get_net():\n    net = tf.keras.Sequential(\n```"
