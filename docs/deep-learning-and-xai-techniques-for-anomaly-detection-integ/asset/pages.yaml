  md: '# Problem


    Pneumonia is an acute respiratory infection caused by viruses, bacteria, or fungi
    where the air sacs fill with pus or fluid. Symptoms of pneumonia include a cough
    with fever, chills, and difficulty breathing. Pneumonia can be life-threatening
    if left untreated, especially in vulnerable groups such as infants, young children,
    and the elderly. Almost 2.5 million people died from pneumonia in 2019, according
    to Our World in Data, https://ourworldindata.org/pneumonia.

    Viral pneumonia in the United States is commonly caused by influenza viruses,
    respiratory syncytial virus (RSV), and SARS-CoV-2 (COVID-19).


    Chest X-rays are commonly used in diagnosing pneumonia in clinical examination
    and medical history reviews. The continuous advancement of AI has shown results
    in finding abnormal patterns in chest X-rays, addressing the concern of needing
    more experts to see radiographs.


