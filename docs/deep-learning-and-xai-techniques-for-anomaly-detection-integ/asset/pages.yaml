  md: '# # Model-Agnostic versus

    Model-Specific Explainability


    Creating a **machine learning (ML)** model for high-stake decisions requires considerations
    for accuracy and interpretability throughout the ML life cycle. In healthcare,
    physicians must provide vital information to educate patients on the potential
    risks and benefits of a medical procedure, treatment, or clinical trial through
    an informed consent process.


    Similarly, when **artificial intelligence (AI)** is incorporated into the medical
    diagnosis process, physicians must be able to clarify important ML model-related
    information to derive a prediction, including the type of input data and training
    process.


    With such diverse landscape of **explainable artificial intelligence (XAI)** methods,
    you might wonder which XAI method to choose. In this chapter, we will explore
    the following topics to understand the differences between model-agnostic and
    model-specific XAI methods:


