    # Explaining AutoGluon with Kernel SHAP


    Shapley values have gained popularity in XAI methods based on the cooperative
    game theory concept, where individual features of the dataset represent players,
    and the target prediction is viewed as a payout to players based on the weighted
    average of their marginal contribution. Breaking down the additive contribution
    of each feature by Shapley values provides an intuitive measurement to assess
    feature importance in the trained model. Note that Shapley values merely highlight
    how features can influence a prediction and do not provide causality.


    In contrast, LIME, covered in Chapter 7, provides local explanations by training
    linear models using perturbation techniques. LIME evaluates feature importance
    based on the presence or absence of samples in the model''s prediction.


    Kernel SHAP, https://proceedings.neurips.cc/paper/2017/file/82a086219786327dc63fad2be67767-Paper.pdf,
    is a model-agnostic XAI method that combines LIME and SHAP to measure feature
    importance using weighted linear regression. Extending LIME using linear regression
    models without regularization allows Kernel SHAP to achieve improved efficiency.
    However, estimating Shapley values can be computationally expensive and time-consuming
    as the number of features grows to calculate all possible permutations of feature
    sets.


    In the following walkthrough, we will build a binary classifier using AutoGluon,
    https://github.com/autogluon/autogluon, to analyze the Breast Cancer dataset and
    classify tumors into malignant (cancerous) or benign (non-cancerous) categories.
    Then we will use Kernel SHAP to assess the model''s interpretability.


    According to the American Cancer Society,https://www.cancer.org/cancer/breast-cancer/how-common-is-breast-cancer.html,
    breast cancer is the second leading cause of death among women after lung cancer.
    A woman in the United States has an average risk of 13% of being diagnosed with
    breast cancer, meaning there is a 1 in 8 chance of developing it. Let''s review
    how Kernel SHAP works using this example. A sample notebook, chapter8_KernelSHAP.ipynb,
