- pgno: 167
  md: '# Comparing backpropagation and perturbation XAI


    After reviewing backpropagation and perturbation, let''s compare the pros and
    cons of these XAI techniques.


    Generally, backpropagation is more efficient than perturbation-based XAI methods
    in generating importance scores for all input features in a single backward pass
    through the network. However, backpropagation-based XAI methods are typically
    prone to noise and require internal information about the model. While feature
    attributions associated with an area of image seem intuitive, neighboring pixels
    can experience a high variant of attribution assignments, which is a shortcoming
    of backpropagation-based methods. Furthermore, a lack of granularity of a model''s
    characteristics might result in inconsistent correlation to its output variation,
    resulting in less faithful explanations.


    In contrast, perturbation-based methods are widely applicable to any deep learning
    model, regardless of its architecture. They experience less noise compared to
    backpropagation-based methods. By creating variant objects, perturbation-based
    methods assess a model''s explainability through incremental evaluations. Nevertheless,
    despite broad appeal, perturbation-based XAI methods often depend on input modality,
    which fails to capture the general network characteristics. Furthermore, evaluating
    all possible feature sets can be time-consuming and resource intensive.


    Perturbations of static images tend to be more straightforward than textual data
    with unique characteristics and videos with temporal dimensions. Hence, the advancement
    of perturbation-based methods has been more around image classification, leaving
    room for future research on perturbations with other data types. Perturbation
    methods can be sensitive to minor modifications to instances resulting in a drastic
    output deviation.


    Building a reliable XAI system takes beyond interpreting the model''s predictions.
    Mission-and safety-critical applications require faithful explanations aligning
    with their original model. For example, an XAI system must produce accurate and
    faithful explanations classifying a pathology image as malignant so that a clinician
    can confidently focus on investigating the ROI.


    Can we unify the backpropagation and perturbation-based methods to get the best
    of both worlds in post hoc explanations for complex black-box models? For continuous
    efforts to achieve interpretability beyond prediction accuracy, there is an emerging
    desire to unify both approaches, such as DeepExplain, https://github.com/marcoananca/DeepExplain.


    Explainability drives interpretability. However, interpretability is not equivalent
    to causality. Besides considering computation efficiency and generalization ability,
    involving domain experts when designing an XAI system is crucial for detecting
    potential bias, assuring model behaviors, and validating the quality of predictions.'
