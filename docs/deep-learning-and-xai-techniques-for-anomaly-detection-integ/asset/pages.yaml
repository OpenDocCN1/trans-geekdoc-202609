  md: '# Reducing environmental impact


    The widespread climate change driven by human activities has contributed to the
    rise of the earth''s temperature by 0.14 degrees Fahrenheit or -17.7 degrees Celsius
    since 1880, and 2020 was marked as the second-warmest year according to the National
    Oceanic Atmospheric Administration (NOAA). Irreversible consequences of climate
    change can lead to other impacts, such as intense droughts, water shortages, catastrophic
    wildfires, and severe flooding. Detecting abnormal weather patterns and climatic
    events, such as the frequency of heat and cold waves, cyclones, and floods, provides
    a understanding of the behaviors and relationships of climatological variables.


    With almost 80% of the world''s energy produced by fossil fuels, it is crucial
    to detect green energy sources and reduce total energy consumption by wasted anomaly
    detection approaches through smart sensors. For example, buildings contribute
    40% of global energy consumption and 33% of greenhouse emissions. Thus, reducing
    energy consumption is a significant effort toward achieving net-zero carbon emissions
    by 2050.


    # Recommending financial strategies


    Identifying anomalies in financial data, such as stock market indices, is instrumental
    for informed decision-making and competitive advantage. Characteristics of financial
    data include volume, velocity, and variety. For example, The New York Stock Exchange
    (NYSE) generates one terabyte of stock market data that reflects continuous market
    changes at low latency. Market participants need a mechanism to identify anomalies
    in financial data that can cause misinterpretation of market behavior leading
    to poor trading decisions.


    Now that we have covered some commercial and environmental cases for anomaly detection,
    you are ready to explore various deep learning approaches and their appropriate
    use for detecting anomalies in the following section.


    # Considering when to use deep learning and what for


    Deep learning forms the basis of neural networks in ML. A neural network contains
    many layers of densely interconnected neurons organized into input, hidden, and
    output layers. Information flows through a neural network in one direction and
    begins with the input layer receiving raw data for model training. The hidden
    layer uses backpropagation to calculate the gradient of errors and optimizes the
    learning process.'
