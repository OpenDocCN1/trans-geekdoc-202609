  md: '# Preface


    Despite promising advances, the opaque nature of deep learning models makes it
    difficult to interpret them, which is a drawback for practical deployment and
    regulatory compliance.


    Deep Learning and XAI Techniques for Anomaly Detection shows state-of-the-art
    methods that''ll help you to understand and address these challenges. By leveraging
    the Explainable AI (XAI) and deep learning techniques described in this book,
    you''ll discover how to extract business-critical insights while ensuring fairness
    and ethical analysis.


    This practical guide will provide tools and best practices to achieve transparency
    and interpretability with deep learning, ultimately establishing trust in your
    anomaly applications. Throughout the chapters, you''ll get equipped with anomaly
    knowledge that''ll enable you to embark on a series of real-world projects. Whether
    you are building computer vision, natural language processing, or you''ll learn
    how to quantify and assess their explainability.


    By the end of this deep learning book, you''ll be able to build a variety of deep
    learning XAI models and perform validation to assess their explainability.


    # Who this is for


    This book is for anyone who aspires to explain deep learning anomaly detection,
    tenured data scientists or ML practitioners looking for XAI best practices, or
    business leaders looking to make decisions on the trade-off between performance
    and interpretability of anomaly detection applications. Basic understanding of
    deep learning and anomaly detection-related topics using Python is recommended
    to get the most out of this book.


    # What this book covers


    Chapter 1, Understanding Deep Learning Anomaly Detection, describes types of anomalies
    and real-world cases for anomaly detection. It provides two PyOD walk-throughs
    to illustrate fundamental concepts, including challenges, opportunities, and considerations
    when using deep learning for anomaly detection.


    Chapter 2, Understanding Explainable AI, covers an overview of XAI, its evolution
    since the US Defense Advanced Research Project Agency (DARPA) initiative, its
    significance in the Right to Explanation and regulatory compliance context, and
    a holistic approach to the XAI cycle.


    Chapter 3, Natural Language Processing Explainability, dives deep into finding
    anomalies within textual data. You will complete two NLP walk-throughs to detect
    anomalies using AutoGluon and Cleanlab and explain the model''s output using SHapley
    Additive exPlanations (SHAP).'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Preface


    Chapter 4, Time Series Anomaly Explainability, introduces concepts and approaches
    to detecting anomalies within time series data. You will build a times series
    anomaly detector using Long Short-Term Memory (LSTM) and explain anomalies using
    OmniAI''s SHAP explainer.


    Chapter 5, Computer Vision Anomaly Explainability, integrates visual anomaly detection
    with XAI. This chapter covers various techniques for image-level and pixel-level
    anomaly detection. The example walk-through shows how to implement a visual anomaly
    detector and evaluate discriminative image regions identified by the model using
    a Class Activation Map (CAM) and Weighted-Gradient Class Activation Mapping (Grad-CAM).


    Chapter 6, Differentiating Intrinsic versus Post Hoc, discusses intrinsic versus
    post hoc XAI methods at the local and global levels. The example walk-through
    further demonstrates the considerations when choosing either approach.


    Chapter 7, Backpropagation versus Perturbation Explainability, reviews gradient-backpropagation
    and perturbation-based XAI methods to determine feature importance for a model''s
    decision. This chapter has two walk-throughs using the saliency map and Local
    Interpretable Model-Exanations (LIME).


    Chapter 8, Model-Agnostic versus Model-Specific Explainability, evaluates how
    these two approaches work with example walk-throughs using Kernel SHAP and Guided
    Integrated Gradients (Guided IG). This chapter also outlines a working-backword
    methodology for choosing the model-agnostic versus the model-specific XAI method,
    starting with analyzing and understanding stakeholder needs.


    Chapter 9, Explainability Evaluation Schemes, describes fundamental XAI principles
    recommended by the National Institute of Standards and Technology (NIST). This
    chapter reviews the existing XAI benchmarking landscape on how to quantify model
    explainability and assess the extent of interpretability.


    # To get the most of this book


    You need a Jupyter environment with Python 3.8+ to run the walk-throughs in this
    book. Each sample notebook comes with a requirement.txt file that lists the package
    dependencies. You can experiment with the sample notebooks on Amazon SageMaker
    Studio Lab (https://aws.amazon.com/sagemaker/studio-lab/). This free ML environment
    provides up to 12 hours of CPU or 4 hours of GPU per user and 15 GB storage at
    no cost.


