- pgno: 152
  md: '# Backpropagation versus Perturbation Explainability


    There are many explainable artificial intelligence (XAI) techniques to study the
    inner workings of neural networks. In Chapter 6, we reviewed the scope of global
    and local interpretability and how they are applied in intrinsic and post explainability
    models. This chapter covers two popular XAI approaches: backpropagation and perturbations.
    The main topics covered in this chapter are the following:


    +   - Reviewing backpropagation explainability

    - Reviewing perturbation explainability

    - Comparing backpropagation and perturbation


    By the end of this chapter, you will have learned more about backpropagation and
    perturbation methods to choose the appropriate approach for your use case.


    # Reviewing backpropagation explainability


    Feature attribution methods generally encompass two steps to determine inference
    results through a forward pass, followed by a backpropagation to assign relevance
    scores for input features on a trained model.


    Backpropagation is a gradient-based XAI method that evaluates feature attributions
    by generating partial derivatives of output in multiple forward and backward passes
    through neural networks. Unlike neural network training, backpropagation in the
    context of feature attribution does not require gradient computation for weight
    updates on model parameters. Instead of beginning with the input layer, backpropagation
    feature attribution starts by assigning importance scores at the final output
    layer, then calculating local activation gradients inversely across each intermediate
    layer until it reaches the input layer, as shown in Figure7.2:


    ![](img/c06290096a327475ed918ba4a4328b77_152_0.png)


    This section provides a walkthrough of saliency maps, a backpropagation-based
    XAI technique.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# Saliency maps


    Saliency maps are one of the most frequently used XAI methods for interpreting
    images with CNNs. It applies to most deep learning networks and provides an intuitive
    way to investigate hidden layers within CNNs.


    Saliency maps use backpropagation to probe a trained neural network for spatial
    information about a particular class – for identifying the location of an object
    without explicitly labeling the image with such information. Saliency maps amplify
    the weight of gradients to reflect or approximate relevant parts of an image user.
    Saliency maps only require one backpropagation pass since it focuses on the highest-scoring
    class.


    There are three ways to obtain saliency maps:


    +   - Using deconvolutional networks (DeconvNet) by inverting a specific activated
    input layer with unpooling and inverse ReLU techniques


    +   - Using gradient-based backpropagation by highlighting pixels based on computed
    gradients to the input network


    +   - Using guided backpropagation by combining DeconvNet and gradient-based backpropagation


    Let''s look at how saliency maps work using the gradient-based backpropagation
    approach. A sample notebook (chapter7_saliency_maps.ipynb) and requirements for
    package dependencies discussed in this chapter are available at https://github.com/PacktPublishing/Deep-Learning-and-XAI-Techniques-for-Anomaly-Detection/tree/main/Chapter7.


