    # # Technical requirements


    For this chapter, you will need the following components for the example walkthrough:


    +   * PyOD - An open-source Python library for outlier detection on multivariate
    data

    * Matplotlib - A plotting library for creating data visualizations

    * NumPy - An open-source library that provides mathematical functions when working
    with arrays

    * Pandas - A library that offers data analysis and manipulation tools

    * Seaborn - A Matplotlib-based data visualization library

    * TensorFlow - An open-source framework for building deep learning applications


    Sample Jupyter notebooks and requirements for package dependencies discussed in
    this chapter are available at https://github.com/PacktPublishing/Deep-Learning-and-XAI-Techniques-for-Anomaly-Detection/tree/main/Chapter-1.


    You can experiment with this example on Amazon SageMaker Studio Lab, https://aws.amazon.com/sagemaker/studio-lab/,
    a free ML development environment that provides up to 12 hours of CPU or 4 hours
    of GPU per user session and 15 GB storage at no cost. Alternatively, you can try
    this on your preferred Integrated Development Environment (IDE).


    Before exploring the sample notebooks, let''s cover the types of anomalies in
    the following section.


    # # Exploring types of anomalies


    Before choosing appropriate algorithms, a fundamental understanding of what constitutes
    an anomaly is essential to enhance efficiency. Anomalies manifest in many shapes
    and sizes, including objects, vectors, events, patterns, and observations. They
    can exist in static entities or temporal contexts. Here is a comparison of different
    types of anomalies:


    +   * A point anomaly exists in any dataset where an individual data point is
    outside the boundary of normal distribution. For example, an out-of-norm expensive
    credit card purchase is a point anomaly.

    * A collective anomaly only occurs when a group of related data records or sequences
    of observations appear collectively and significantly differ from the remaining
    dataset. A spike of errors from multiple systems is a collective anomaly that
    might indicate problems with downstream e-commerce systems.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Exploring types of anomalies


    +   - A contextual anomaly occurs when viewed against contextual attributes such
    as day and time. An example of a temporal contextual anomaly is a sudden increase
    in online orders outside of expected peak shopping hours.


    An anomaly has at least one (univariate) or multiple attributes (multivariate)
    in numerical, binary, continuous, or categorical data types. These attributes
    describe the characteristics, features, and dimensions of an anomaly. Figure 1.1
    shows examples of common anomaly types:


    ![](img/c06290096a327475ed918ba4a4328b77_21_0.png)


    | Feature | Feature 2 | Class |

    |---|---|--|

    | 115 | 10 | 1 |

    | 130 | 15 | 1 |

    | 300 | 500 | 0 |

    | 100 | 12 | 1 |


    Figure 1.1 – Types of anomalies


    Defining an anomaly is not a straightforward task because boundaries between normal
    and abnormal behaviors can be domain-specific and to tolerance levels defined
    by the business, organization, and industry. For example, an irregular heart rhythm
    from electrocardiogram (ECG) time series data may signal cardiovascular risk,
    whereas price fluctuations might be considered normal based on market demand.
    Thus, there is no universal definition of an anomaly and no one-size-fits-all
    solution for anomaly detection.


    Let''s look at a point anomaly example using PyOD and a diabetes dataset from
    Kaggle, https://www.kaggle.com/datasets/mathchi/diabetes-data-set. PyOD, https://github.com/yzhao062/pyod.
    PyOD is an open source library that provides over 40 outlier detection algorithms,
    covering everything from outlier ensembles to neural network-based methods on
    multivariate data.'
  merge: -1
  img_proc: true
