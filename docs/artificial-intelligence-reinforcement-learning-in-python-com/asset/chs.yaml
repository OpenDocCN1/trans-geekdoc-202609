- "# 人工智能：Python 强化学习：人工智能与机器学习完全指南，深度强化学习预备\n\n\n\n\n\n\n\n# 介绍\n\n当人们谈论人工智能时，他们通常指并不是监督学习和无监督机器学习。\n\
  \n与我们想象中 AI 所做的事情——下围棋和国际象棋、驾驶汽车以及以超人类水平玩视频游戏相比，这些任务是非常微不足道的。\n\n强化学习最近在实现这一切及更多领域方面变得流行。\n\
  \n与深度学习一样，许多理论在 70 世纪和 80 世纪就被发现了，但直到最近，我们才能够亲眼观察到这些可能的惊人结果。\n\n2016 年，我们看到 `AlphaGo`\
  \ 在围棋上击败了世界冠军。\n\n我们看到 AI 玩《毁灭战士》和《超级马里奥》等视频游戏。\n\n自动驾驶汽车开始在真实的道路上与其他司机一起，甚至载着乘客，完全无需人工辅助。\n\
  \n如果这听起来很神奇，请为未来做好准备，因为加速收益律决定了这种进步将继续呈指数级增长。\n\n然而，学习监督和无监督机器学习并不是一项易事。到目前为止，仅就这些主题我就开设了\
  \ 16 多门课程。\n\n而强化学习仍然开启了一个全新的世界。正如你将在本书中学学到的，强化学习范式与监督学习、无监督学习之间的差异，比它们彼此之间的差异大得多。\n\
  \n那么我们将在书中讨论什么呢？\n\n我在强化学习中注意到，你学习的理论知识与你在编程期间实际的操作之间存在巨大的鸿沟。\n\n理论是非常抽象的，因此不断思考它如何实际应用于\
  \ AI 任务（如控制机器人或玩游戏）非常重要。\n\n为了实现这一目标，我们实际上将从一个游戏开始这本书：老虎机。\n\n老虎机，或者强化学习中被称为“多臂老虎机问题”，向我们介绍一个名为“探索与利用困境”（explore-exploit\
  \ dilemma）的重要概念。你想利用你认为最好的那台老虎机，但你需要从所有老虎机中收集足够的数据，以便对那种信念充满信心。\n\n我们将讨论几种在探索与利用之间权衡的技术，包括\
  \ `epsilon-greedy` 方法、`UCB` 和 `Bayesian` 学习。\n\n# 如何成功\n\n在本章中，我将给你提供关于如何阅读这本书以及如何使收益最大化的建议。\n\
  \n与其他在线资源一样，你没有考试或成绩之分，所以你真的必须成为那种采取主动性并积极学习的人。\n\n这意味着要理解所有写下的方程，如果有推导过程：确保你理解每一步，并能够独立完成该推导。\n\
  \n这意味着要自己编写所有的代码，并在看我的代码之前尝试这样做。你应该将我的代码视为问题的答案，而不是一个在没有思考问题之前就直接看它的东西。\n\n我想上过我其他课程并读过我其他书的人理解这一点，但我不时仍看到学生对具体该如何练习感到困惑。\n\
  \n## 先决条件\n\n首先，如果你不知道这本书有先决条件，请从现在停下。你已经失败了。\n\n这是我看到人们失败，或者埋怪我的课程/书写的太难的首要原因。\n\
  \n重申：为了理解这门课程，你需要对大学水平的微积分、概率论、马尔可夫模型、线性模型以及梯度下降有良好的掌握。当然，你必须知道如何用代码实现所有这些内容。\n\n\
  \n\n\n\n这一切都来自我学生的经验，我并不是凭空捏造。如果你在 20 年前在大学学过高等数学，那不算数。如果你在 YouTube 上看了 20 分钟关于概率的视频，那也不算数。你需要的不仅仅是一个简短的回顾。你需要将硬核的技术概念刻在脑海里。\n\
  \n## 从零开始编码实践\n\n机器学习不像上物理课，章节末尾没有 20 道练习题供你做。\n\n机器学习很棒的地方在于，它是可以自动自检的。\n\n要么你写的代码可以运行，要么不能运行。如果它能运行，那是一个良好的第一步。\n\
  \n要么它的行为符合预期，要么不符合。如果它符合预期，意味着你写得很好，而且它正在正常工作。\n\n调试是编程的一部分。你应该成为一名出色的调试员，不要在代码一抛错误时就放弃。\n\
  \n这都是过程的一部分。\n\n人们认为自己应该能够在一个小时内完成某事，但现实中，一个聪明的人可能需要一整晚，甚至可能几天时间。\n\n所以请记住：我们所做的每件事都会自动自检。你写的代码要么有效，要么无效。努力让它独立运行。\n\
  \n记住， Github 仓库中的代码（将要讨论）已经经过验证可以运行，所以请根据它来检查你的工作。\n\n你的代码甚至可能变得更好！\n\n你必须亲手编写代码，并尽可能独立完成，理想情况下仅根据理论的伪代码/仅根据伪代码来编写。\n\
  \n这和我其他的机器学习课程的区别在于，你会觉得我们在又一遍一遍做同样的事情。\n\n这与之相对的是，例如我的监督机器学习课程，你在那里学习了决策树、朴素贝叶斯、k-近邻和感知器。那些是\
  \ 4 种不同的算法。\n\n在本书中，所有的算法看起来都一样，因此真正的挑战将是如何区分它们。\n\n理解每种方法之间的差异以及它们的优缺点是这门课程的关键。\n\
  \n在之前的课程中，你听我说过“所有数据都是平等的”。\n\n我认为在机器学习中实现这种视角其实相当容易。\n\n当我们谈论监督学习和无监督学习时，我们总是处理输入\
  \ `X` 和目标 `Y`。\n\n我们不需要指定 `X` 是什么或 `Y` 是什么，你仍然能理解我在说什么。\n\n你已经知道 `X` 可以代表任何特征，可以是年龄、体重、身高、你在电子商务商店中访问的页面数、DNA\
  \ 序列等。\n\n监督学习和无监督学习适用于所有不同领域，金融、生物学、在线广告等。\n\n我们不需要指定我们在谈论什么——只需说 `X` 和 `Y` 就足够了，因为无论数据代表什么，相同的算法都是通用的。\n\
  \n所以我们说“所有数据都是平等的”。你可能会问是：“这同样适用于强化学习吗？”\n\n我认为答案是，最终会适用，但起初可能不会。\n\n强化学习更困难，因为与学习体（agent）的接口比简单的特征和目标或\
  \ `Xs` 和 `Ys` 要广泛得多。\n\n然而，一旦你习惯了获取一个环境并思考如何编码状态、动作和奖励，你会在抽象这些概念方面变得越来越好。\n\n因此在未来，你将不需要以像井棋或网格世界（Gridworld）这样的特定问题来思考，而是以状态、动作和奖励等抽象实体来思考，这种直觉会随着时间的推移变得更加自动。\n\
  \n特别是在深度学习中，经验告诉我，很多人想跳进深度学习领域是因为因为它现在很流行，但他们缺乏基础。\n\n在未来，你将不需要以像井棋或网格世界这样的特定问题来思考，而是以状态、动作和奖励等抽象实体来思考，这种直觉会随着时间的推移变得更加自动。特别是在深度学习中，经验告诉我，很多人想跳进深度学习领域是因为因为它现在很流行，但他们缺乏基础。\n\
  \n在未来，你将不需要以像井棋或网格世界这样的特定问题来思考，而是以状态、动作和奖励等抽象实体来思考，这种直觉会随着时间的推移变得更加自动。特别是在深度学习中，经验告诉我，很多人想跳进深度学习领域是因为因为它现在很流行，但他们缺乏基础。\n\
  \n在未来，你将不需要以像井棋或网格世界这样的特定问题来思考，而是以状态、动作和奖励等抽象实体来思考，这种直觉会随着时间的推移变得更加自动。特别是在深度学习中，经验告诉我，很多人想跳进深度学习领域是因为因为它现在很流行，但他们缺乏基础。\n\
