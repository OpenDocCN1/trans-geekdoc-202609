  \n在这个阶段，我怀疑这些事情对你来说可能是微不足道的。这本书的设计也考虑到了这一点。我总是建议我的学生尝试自己编写代码，但如果你遇到困难或需要帮助，那么我 github\
  \ 仓库中的代码已经验证过是可以运行的。所以你可以对照它们来检查你的代码。\n\n偶尔有人会问我：“这本书的实践活动是什么？”——实践就是实现你学到的算法。之所以这样做，是因为看理论讲座并在高层次理解概念是一回事，而将它们理解得如此透彻以至于可以在没有任何参考的情况下用代码实现它们完全是另一回事。\n\
  \n这是计算机科学家所的工作，所以这也是你应该采取的方法。在这些课程中亲手编写所有代码尤为重要。\n\n我发现强化学习算法的一点是，从高层次来看，它们看起来几乎一模一样。所以如果你只是坐在那里从头到尾读这本书，你会感到困惑，并可能奇怪我为什么教了你三次相同的内容。我建议你不要采取这种方法，因为你从中无法获得任何收获。所以要主动，要积极。这本书就是为这类人准备的。只有通过尝试自己编写代码并在细节中挣扎，你才会真正开始理解所教的内容。\n\
  \n\n## 问题设置与探索-利用的困境\n\n在书的这一部分，我们将重新审视多臂老虎机问题，你最初在我关于贝叶斯机器学习和 A/B 测试的课程中见过它。如果你没有上过那门课程，不用太担心，因为我们将在书中完全涵盖这个问题。\n\
  \n假设你去了一家赌场，你有 3 台老虎机可供选择。每台老虎机都可以给你 0 或 1 的奖励，所以目前这就像是抛硬币一样。这被称为多臂老虎机问题，因为当你玩老虎机时，必须拉动机器的手臂（arm），而它们被称为“强匪”（bandits），是因为它们在掠夺你的钱。\n\
  \n每台老虎机的获胜率都是未知的。例如，它们可能是 0.1、0.3 和 0.5。但你并不知道这些，你只能通过收集数据来发现它们。现在你在赌场的目标显然是使收益最大化。如果你是预言者，能利用你的能力判断哪台机器的获胜率最高，你只会玩那一台机器，这样你就能实现收益最大化。\n\
  \n但由于你不知道获胜率，你需要通过收集数据来估计它们，这意味着你必须玩每台机器。困境就在这里产生。你需要收集大量数据使你的估计准确。但如果你收集了大量数据，你将花费大量时间在次优的老虎机手臂上。因此，你需要在尝试收益最大化与尝试获取每台老虎机获胜率的准确测量之间取得平衡，因为为了收益最大化，你需要准确地知道这一点。\n\
  \n在 A/B 测试中，你需要玩的次数取决于许多因素，例如获胜率的差异。如果差异越大，你需要的样本越少；如果差异越小，你需要的样本越多。这有点愚蠢，因为在开始之前并不知道差异，这是\
  \ A/B 测试的缺点之一。A/B 测试的一个重要规则是你不要提前停止测试。所以如果你预先决定每台老虎机要玩 1000 次，当你玩到 500 次时已经计算出 90%\
  \ 的获胜率，你是不允许停止的。\n\n有趣的是，人类的行为恰恰相反。假设你在一台机器上赢了 2/3 次，在另一台上赢了 0/3 次。你可能会产生一种冲动，从现在起只那那\
  \ 2/3 的机器，尽管有很大概率另一台更好。如果我用统计学的方法问你——如果你认为 2/3 和 0/3 就能给你准确的测量结果，你会说“不可能！”作为一个数据科学家，你知道第一台机器实际获胜率为\
  \ 67% 的概率较低，第二台实际获胜率为 0% 的概率较低。你知道这一点是因为 3 是一个非常小的样本量。然而，当你玩老虎机时，你却强迫自己相信第一台机器更好。\n\
  \n在接下来的章节中，我们将学习系统地权衡探索与利用的算法。这些算法允许我们改进上述两种糟糕的解决方案，即人类情感和传统的 A/B 测试。\n\n## 贪婪策略\n\
  \n解决探索-利用困境的第一种解决方案被称为 贪婪策略。这是最重要的，因为这是我们在整个课程中使用的（尽管任何其他技术都可以等效应用）。我们喜欢它是因为简单。它的工作原理是：我们使用一个名为\
  \ `epsilon` 的小数值作为探索的概率。`epsilon` 的典型值为 10% 或 5%。以下是执行此操作的伪代码。\n\n```python\nif\
  \ random() < eps:\n    play random arm\nelse:\n    choose current best arm\n   \
  \ update estimate for the arm played (i.e. avg = sum / N)\n```\n\n\n\n\n在每一轮中，我们生成一个随机数。如果随机数小于\
  \ `epsilon`，我们就进行探索（explore），意味着随机选择一个机械臂。如果随机数大于 `epsilon`，我们就进行开发（exploit），意味着选择到目前为止具有最大平均值的机械臂。\n\
  \n因此显而易见的是，最终你将学到哪条臂是真正的最好的，尽管你的初始猜测可能是错误的，因为每个臂始终都有机会被更新。\n\n---\n\n从长远来看，`epsilon-greedy`\
  \ 允许我们对每条臂进行无限次探索。\n\n然而，这种方法的问题在于，最终你会达到这样一个点：即在你不再真正需要探索时仍在进行探索。\n\n所以，如果 `epsilon`\
  \ 是 `10%`，那么你仍将花费 `10%` 的时间来选择次优臂。\n\nA/B 测试在这里也可能有用，你可以在预定的时间进行测试以检查统计显著性。如果你发现了统计学显著性，可以将\
  \ `epsilon` 设置为 `0`，这样你实际上只执行了贪婪部分。\n\n不过，在不久的将来，我们将看到更好的方法来适应我们所学的内容。\n\n## 更新均值\n\
  \n假设我们的奖励不仅仅是硬币掷，所以我们不只需要存储成功和失败的次数。\n\n解决这个问题的通用方法是使用均值。\n\n这对于硬币掷也有效，因为如果你将所有的\
  \ `0` 和 `1` 相加并除以 `N`，你就会得到获得 `1` 的最大似然概率。\n\n那么，我们如何计算随机变量的样本均值呢？\n\n我们知道它是总和除以样本数量。\n\
  \n```\nXmean(N) = sum[i=1..N]{ X(i) } / N\n```\n\n这个方程有什么问题？\n\n这个方程的问题在于，它需要存储所有的\
  \ `N` 个元素才能计算均值。\n\n有没有办法让这种计算更高效？\n\n确实有。\n\n诀窍在于，第 `N` 次样本的均值可以根据第 `(N-1)` 次样本的均值计算出来。\n\
  \n```\nXmean(N) = (1 - 1/N)Xmean(N-1) + (1/N)X(N)\nXmean(N) = Xmean(N-1) - (1/N)[Xmean(N-1)\
  \ - X(N)]\n```\n\n如果你没有立即看出它的原理，请尝试在纸上自己推导一下。\n\n所以这个方程允许我们以计算效率更高的方式计算均值。\n\n记住这种形式的更新方程，它在书的其余部分将非常重要。\n\
  \n## 在代码中比较不同的 epsilon\n\n在这一节中，我们将用代码实现 `epsilon-greedy`，并演示不同 `epsilon` 设置的影响。\n\
  \n如果你不想尝试自己编写代码（尽管我强烈鼓励你这样做），课程仓库中的相关文件是 `comparing_epsilons.py`。\n\n```python\n\
  import numpy as np\nimport matplotlib.pyplot as plt\n\n## represents one bandit\
  \ arm\nclass Bandit:\n    def __init__(self, m):\n        self.m = m # true mean\n\
  \        self.mean = 0\n        self.N = 0\n\n    # simulates pulling the bandit’s\
  \ arm\n    # is a Gaussian with unit variance\n    def pull(self):\n        return\
  \ np.random.randn() + self.m\n\n    # this is the update equation we just learned\n\
  \    def update(self, x):\n        self.N += 1\n        self.mean = (1 - 1.0/self.N)*self.mean\
  \ + 1.0/self.N*x\n\n## N = number of times we play\n## m1, m2, m3 = mean rewards\
  \ for the 3 arms\n## eps = epsilon for the epsilon greedy strategy\ndef run_experiment(m1,\
  \ m2, m3, eps, N):\n    bandits = [Bandit(m1), Bandit(m2), Bandit(m3)]\n\n    data\
  \ = np.empty(N)\n    for i in xrange(N):\n        # epsilon greedy\n        p =\
  \ np.random.random()\n        if p < eps:\n            j = np.random.choice(3)\n\
  \        else:\n            j = np.argmax([b.mean for b in bandits])\n        x\
  \ = bandits[j].pull()\n        bandits[j].update(x)\n\n        # for the plot\n\
  \        data[i] = x\n    cumulative_average = np.cumsum(data) / (np.arange(N) +\
  \ 1)\n\n    # plot moving average reward\n    plt.plot(cumulative_average)\n   \
  \ plt.plot(np.ones(N)*m1)\n    plt.plot(np.ones(N)*m2)\n    plt.plot(np.ones(N)*m3)\n\
  \    plt.xscale('log')\n    plt.show()\n\n    for b in bandits:\n        print b.mean\n\
  \n    return cumulative_average\n\nif __name__ == '__main__':\n    c_1 = run_experiment(m1,\
  \ m2, m3, eps, N)\n```\n\n\n\n\n细节超出了本课程的范围，但该算法与我们看过的其他算法一样简单。\n\n其核心思想是，我们将上置信区间设为\
  \ `regular sample mean + sqrt(2 * ln(N) / Nj)`。\n\n`Xmean= Xmean(j)+2ln(N)/Nj`\n\
  \n这等同于“选择”一个等于根号及其内部内容的 `epsilon`。\n\n所以，让我们来聊聊这些符号的含义。\n\n`Xmean(j) = 第 j 个老虎机手臂的常规样本均值`\n\
  \n`N` 是你玩老虎机的总次数。\n\n`Nj` 是你玩第 `j` 个老虎机的总次数。\n\n### 现在我们如何使用这个公式呢？\n\n嗯，这个想法与乐观初始值法类似。\n\
  \n我们只使用贪心策略，但我们贪婪的对象不仅是样本均值，而是样本均值的上置信区间。\n\n问题是，为什么这种方法有效呢？\n\n嗯，这个置信区间看起来是两个东西的比例值：`N`（你玩任何老虎机的总次数）和\
  \ `Nj`（你玩第 `j` 个老虎机的总次数）。\n\n所以，如果你玩过其他老虎机很多次，但 `Nj` 很小，那么这个比例 `ln(N)/Nj` 就会很大，导致上置信区间更高，从而导致你选择这个老虎机来玩。\n\
  \n同时，如果 `Nj` 很大，那么比例就很小，此时上置信区间会缩小。\n\n但关于这个比例的一个关键点是，分子是随着 `N` 的对数增长的。这意味着它的增长速度最终会比\
  \ `Nj` 慢。\n\n这意味着，随着你玩的老虎机越来越多，上置信区间将会缩小，你将只使用样本均值，这是可以的，因为你收集了大量数据。\n\n所以这也收敛于纯粹的贪心策略。\n\
  \n让我们看一些伪代码，以便更好地理解它的原理。\n\n它本质上和乐观初始值法一样简单。我们只是替换了进入 `argmax` 的公式，现在它变成了上置信区间。\n\
  \n```\nfor n=1..N:\nj = argmax[j’]{ bandit[j’].mean + sqrt(2*ln(n) / n_j) }\npull\
  \ bandit j\nupdate bandit j\n```\n\n注意，当 `n_j` 为 0 时，这个公式有一个无法运行的小问题。为了修复这个问题，你只需要在分母上添加一个小数字即可。\n\
  \n如果你不想自己尝试编写代码，课程仓库中的相关文件是 `ucb1.py`。至少尝试运行它，这样你就可以观察结果。\n\n## 贝叶斯 / 汤普采样 (Thompson\
  \ Sampling)\n\n在本节课程中，我们将讨论我最喜欢的解决探索-利用困境的方法之一，使用贝叶斯方法。\n\n你可能在某些来源中看到这种技术被称为 `Thompson\
  \ sampling`。\n\n为了引入贝叶斯方法背后的思想，我们想再次查看置信区间或置信边界。\n\n我们直观地知道，从 10 个样本计算出的样本均值没有从\
  \ 1000 个样本计算出的样本均值准确。\n\n我们可以利用中心极限定理来说，置信区间是“近似高斯分布的”，其真实均值等于随机变量的期望值，方差等于 `variance\
  \ / N`。\n\n`Xmean ~ Normal(true_mean, variance/N)`\n`X ~ Normal(true_mean, variance)`\n\
  \n`Xmean` 具有分布是因为它是随机变量之和。正如你所知，任何随机变量的函数也是随机变量。\n\n贝叶斯范式进一步扩展了这一思想。真实均值（我们称之为 `mu`）不再固定的，`mu`\
  \ 变成了随机变量。贝叶斯范式的基本思想是数据是固定的，而参数是随机的。\n\n在贝叶斯范式中，参数具有分布，我们想要知道的是给定数据的参数分布。这非常有道理。\n\
  \n给定一些数据，我应该能够根据数据得出一个比没有数据时更准确的分布。我们称之为后验概率：`p(param | data)`\n\n在贝叶斯范式中，关键工具是\
  \ `Bayes rule`（贝叶斯公式），因此我们可以翻转后验概率，并从似然概率和先验概率来计算它。\n\n`Likelihood = p(data | param)`\n\
  `Prior = p(param)`\n\n贝叶斯方法的一个缺点是我们需要自己选择先验，这有时会对后验概率产生不可忽视的影响。\n\n`p(param | data)\
  \ = p(data | param) / p(data)`\n`p(param | data) 比例于 p(data | param)`\n\n由于 `p(data)`\
  \ 是对 `p(data | param)` 的积分，分母是一个常数。这个公式存在一些问题。由于它非常通用，分母中的积分并不总是可行。幸运的是，存在特殊的分布集合，使得后验分布与先验分布具有相同的类型。这些被称为\
  \ `conjugate priors`（共轭先验）。\n\n让我们做一个短例子，看看如何将共轭先验应用于点击率。我们知道点击率类似于硬币抛掷，因此它们具有 `Bernoulli\
  \ likelihood`（伯努利似然）。如果你在维基百科上查阅 `Bernoulli likelihood` 的共轭先验，你会发现它是 `Beta distribution`（Beta\
  \ 分布）。\n\n`Beta distribution` 始终在 0 到 1 之间，它有两个参数 `a` 和 `b`。当我们更新参数时，后验分布将与先验具有相同的分布类型。这就是\
  \ `conjugate priors`。\n\n\n\n在我的第一门贝叶斯机器学习课程中，你学习了高斯似然分布与均值的高斯先验是共轭的。\n\n如果我们**只**对均值\
  \ `mu` 放置先验，并假设方差是固定的，我们可以从这些形式的似然和先验开始。\n\n你可以看到我们正在使用精度参数（precision parameters），它是方差的倒数。这使得数学计算更容易一些。\n\
  \n```\nX ~ Normal(mu, tau ^ (-1)),\nmu ~ Normal(m, lambda ^ (-1))\n```\n\n`mu` 分布的参数是\
  \ `m` 和 `lambda`，因此我们寻找的是 `m` 和 `lambda` 的更新方程。\n\n我们可以再次使用贝叶斯公式来求解新的 `m` 和新的 `lambda`：\n\
  \n```\np(mu | X) proportional to p(X | mu)p(mu)\n```\n\n你将会发现：\n\n```\nlambda’ =\
  \ lambda + tau*N\nm’ = [ m*lambda + tau*sum[i=1..N]{ X(i) } ] / lambda’\n```\n\n\
  记住 `N` 是我们收集的样本数量，而 `X(i)` 代表一个样本。\n\n我强烈建议仔细读一遍数学推导，以便你自己自己求解（在这个电子书格式中表示公式是非常困难的）。\n\
  \n---\n\n这一步的最后一步是讨论我们如何将其应用于老虎机问题（bandit problem）。\n\n答案是采样（sampling）。\n\n关键部分再次是选择老虎机的那行代码。\n\
  \n我们不再像在使用 `UCB1` 时那样选择上置信边界的 `argmax`，而是将选择从每个老虎机均值中抽取的样本的 `argmax`。\n\n记住均值现在是概率分布，所以我们可以从中抽取样本。\n\
  \n这如何帮助我们进行探索（explore）和利用（exploit）呢？\n\n嗯，你从之前的演示中看到，分布开始时总是是肥胖的，然后逐渐变得很窄。\n\n当分布很宽时，我们仍很有概率采样到一个非常大的数值，因此当分布很宽时，我们被鼓励更多地探索。\n\
  \n当分布变窄且我们对自己的估计更有信心时，我们就会减少探索并增加利用，因为样本将始终在一个非常窄的范围内。\n\n所以，从贝叶斯后验分布中采样会自动控制我们进行多少探索和利用。\n\
  \n## 汤普斯采样与其他方法的比较\n\n在这一节中，我们将编写一个大脚本来比较所有的探索-利用解决方案。\n\n我们有 4 种技术需要比较：epsilon-greedy（epsilon-greedy）、乐观初始值（optimistic\
  \ initial values）、`UCB1` 和贝叶斯采样。\n\n由于我们已经知道 epsilon-greedy 一般，我们将对其进行修改。我们的方法是使用衰减\
  \ epsilon。具体来说，我们将 `epsilon` 设置为 `1/t`，其中 `t` 是迭代次数。\n\n我们将看到最后这些方法的性能大大相同，这证明了在书中中使用\
  \ epsilon-greedy 是合理的。\n\n如果你不想自己写代码（尽管我强烈建议你这么做），课程仓库中的相关文件是 `comparing_explore_exploit_methods.py`。\n\
  \n```python\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom comparing_epsilons\
  \ import Bandit\nfrom optimistic_initial_values import run_experiment as run_experiment_oiv\n\
  from ucb1 import run_experiment as run_experiment_ucb\n\nclass BayesianBandit:\n\
  \    def __init__(self, m):\n        self.m = m\n        # parameters for mu - prior\
  \ is N(0,1)\n        self.m0 = 0\n        self.lambda0 = 1\n        self.sum_x =\
  \ 0 # for convenience\n        self.tau = 1\n\n    def pull(self):\n        return\
  \ np.random.randn() + self.m\n\n    def sample(self):\n        return np.random.randn()\
  \ / np.sqrt(self.lambda0)\n\n    def update(self, x):\n        # assume tau is 1\n\
  \        self.lambda0 += 1\n        self.sum_x += x\n        self.m0 = self.tau*self.sum_x\
  \ / self.lambda0\n\ndef run_experiment_decaying_epsilon(m1, m2, m3, N):\n    bandits\
  \ = [Bandit(m1), Bandit(m2), Bandit(m3)]\n\n    data = np.empty(N)\n    for i in\
  \ xrange(N):\n        # epsilon greedy\n        p = np.random.random()\n       \
  \ if p < 1.0/(i+1):\n            j = np.random.choice(3)\n        else:\n      \
  \      j = np.argmax([b.mean for b in bandits])\n        x = bandits[j].pull()\n\
  \        bandits[j].update(x)\n\n        # for the plot\n        data[i] = x\n \
  \       cumulative_average = np.cumsum(data) / (np.arange(N) + 1)\n\n        # plot\
  \ moving average ctr\n        plt.plot(cumulative_average)\n        plt.plot(np.ones(N)*m1)\n\
  \        plt.plot(np.ones(N)*m2)\n        plt.plot(np.ones(N)*m3)\n        plt.xscale('log')\n\
  ```\n\n## 非平稳老虎机\n\n在本节中，我们将讨论非平稳性问题，并更深入地观察之前的一些公式。这对于后续课程非常有帮助，因为相同的公式会反复出现。\n\
  \n那么，什么是非平稳性？\n\n平稳过程是指统计特性不随时间变化的过程。\n\n我们关注的是均值，但严格来说，有不同的平稳类型。\n\n弱平稳是指均值和自协方差不随时间变化。自协方差是一个二阶统计量。\n\
  \n还有强平稳性，即整个概率密度函数（PDF）必须随时间保持不变。这就是我们拥有的平稳性，因为每次你拉动老虎机的手臂时，它的分布都是相同的。\n\n注意，强平稳过程也是弱平稳过程，但反之不然。\n\
  \n问题是，如果老虎机不是平稳的，那么像之前这样计算均值还有意义吗？\n\n\n\n回想我们之前的均值更新方程。\n\n`Xmean(t)=(1-1/t)Xmean(t-1)\
  \ + (1/t)X(t)`\n\n为了方便起见，我们将 `Xmean` 称为 `Q`。我们可以重新排列项，使得 `1/t` 项单独出现。\n\n`Q(t)=Q(t-1)\
  \ - (1/t)(Q(t-1) - X(t))`, `Q(t) = Xmean(t)`\n\n我们可以进一步泛化此方程，让 `1/t` 项由学习率 `alpha`\
  \ 表示，这样它看起来有点像梯度下降。\n\n`Q(t) = Q(t-1) - alpha*(Q(t-1) - X(t))`\n\n这个方程的关键在于，我们不需要使用\
  \ `alpha = 1/t` 作为学习率。\n\n如果你还记得深度学习第 2 部分，`1/t` 学习率是我们学习过的自适应学习率技术之一。\n\n但学习率可以是任何值。如果我们把\
  \ `alpha` 设置为常数呢？这看起来也应该很熟悉。\n\n`Q(t) = (1 - alpha)*Q(t-1) + alpha*X(t)`\n\n这是我们在研究\
  \ `Theano scan` 函数作为如何使用 `Theano scan` 的简单示例时看过的。\n\n如果你还没有看过我关于 `Theano scan` 函数的\
  \ YouTube 教程，可以免费观看：[`youtu.be/R-7OGU3V4IY`](https://youtu.be/R-7OGU3V4IY)\n\n记住这实现了一个简单的低通滤波器。如果我们去掉递归，就可以用\
  \ `X` 的所有过去值来表示 `Q`。\n\n`Q(t) == alpha * sum[k=0..t]{ (1 - alpha)^k X(t - k) }`\n\
  \n从这一点我们可以看出，`Q` 对 `X` 的依赖呈指数衰减。通过这种方式，`Q` 对 `X` 的近期值更侧重点，而不是过去的 `X` 值，所以它就像是一个移动平均，换句话说，是一个低通滤波器。\n\
  \n如果你想运行 `Theano scan` 教程中的低通滤波器，相关文件夹是 `hmm_class`（与本书在同一个仓库），相关文件是 `scan3.py`。\n\
  \n你可以在这里看到，我们从一个非常嘈杂的正弦波开始，经过低通滤波器后，大部分高频噪声消失了。\n\n---\n\n在强化学习文献中，你通常会看到关于 `Q`\
  \ 收敛性的流行结果。\n\n结果是：如果所有 `alphas` 之和为无穷大，但所有 `alphas` 的平方之和为常数，则 `Q` 将收敛。\n\n`sum[t=1..inf]{\
  \ alpha(t) } = inf`\n\n`sum[t=1..inf]{ alpha(t)² } < inf`\n\n如果你回想起微积分 2，从这些标准中可以看出常数\
  \ `alpha` 不符合这两个条件，但 `alpha = 1/t` 符合。\n\n你经常看到使用常数 `alpha` 的原因是强化学习问题通常是非平稳的，因此尝试对收集过的每一个样本计算样本均值是没有意义的。\n\
  \n---\n\n让我们做一些简单的题来巩固这个概念。我们已经知道 `1/t` 是收敛的。那么 `alpha(t) = 1/t²` 呢？答案：这不收敛，因为 `alphas`\
  \ 的和不是无穷大。\n\n那么 `alpha = 1/t^(2/3)` 呢？答案：在这种情况下，将会收敛，因为 `alphas` 的和是无穷大的，但如果我们对\
  \ `alpha` 平方，分母的幂将大于 1，因此它收敛到一个常数。\n\n# 井字棋 (Tic-Tac-Toe)\n\n在课程的这一部分，我们将从编程的角度来处理井字棋。大一学生通常刚刚开始学习\
  \ `Java` 或 `C++` 等语言的基础知识，而编写像井字棋这样的一个游戏本身就是一个挑战。在本课程中，我们将直接编写所有环境以理解整体框架。系统的每个部分都包括\
  \ `agent`（代理）和 `environment`（环境）以及两者之间接口的任何代码。\n\n在下一本书，一旦你更熟悉强化学习的思想，我们将抽象掉环境，使得你无法查看其内部。因此，在讲座中，我们实际上是在看你如何在“上帝模式”（God-mode）下玩井字棋。你了解游戏的一切，所以你永远不会失败。\n\
  \n列出所有这些规则是可能的，但这不是本课程的主题。例如，如果棋盘是空的且轮到你的回合，你希望你的第一步是中心或或角。另一个规则可能是，如果对手在某一行有两个棋子，你想放下自己的棋子来阻挡他们，以免他们获得三个连成线。另一条规则是，如果你看到自己的两个棋子连在一起且没有被阻挡且轮到你的回合，你应该完成该行以赢得游戏。\n\
  \n这在代码中看起来是什么样的？本质上它将是一堆 `if` 语句。一堆 `if` 语句有什么问题呢？嗯，它违背了机器学习的整个理念。也就是说，我们希望有一个可以泛化到许多问题的算法。就像我们可以使用神经网络对动物图片进行分类，也可以训练相同的算法对音乐进行分类。如果我们写一个由\
  \ `if` 语句组成的井字棋代理，该程序将永远无法做除井字棋之外的任何事情。所以我们需要更好的东西，这就是为什么我们想要学习强化学习。\n\n这其中的一个重要方面是，我们有一个关于游戏如何运作的模型。我们了解井字棋的一切。我们知道什么状态会导致最高奖励。换句话说，任何你有三个棋子连成的状态，你都会获得一个赢得游戏的奖励，否则你就会失败或一无所获。我们知道如何从一个状态转换到下一个状态。换句话说，通过执行某些\
  \ `action`（动作），给定当前状态确切知道下一个状态是什么。这似乎是显而易见的，但在某些环境中并非如此。在井字棋中，我们在棋盘上放置一个棋子，棋子会进入我们选择的位置，我们到达预期的下一个状态。情况并不总是如此。\n\
  \n这些想法稍后会发挥作用，但我建议现在就开始思考它们。你会发现，我们学习的某些算法要求我们拥有环境的模型，就像我们在井字棋中那样。其他算法不需要我们知道任何事情，我们将在探索中获取信息。\n\
  \n## 强化学习系统的组件\n\n在本节中，我们将定义强化学习系统的组件。起初这可能看起来有些重复，因为我们在介绍部分已经做过这些，但你会注意到，随着书中不断深入，我们每次都会查看相同的概念，但会使其更加严谨。我们每次还会添加更多组件，所以每次你将在之前知识的基础上学习一些新术语。\n\
  \n在本节中，我们将再次查看一些你已经熟悉的概念：\n\n- `agent`（代理）：是玩游戏的实体，也是你想要编写强化学习算法的对象。\n- `environment`（环境）：是\
  \ `agent` 交互的实体。它是 `agent` 的世界。\n- `state`（状态）：是 `agent` 感知的环境特定配置。\n\n注意，`state`\
  \ 只涉及 `agent` 可以感知到的内容，而不是环境的一切。例如，如果我在澳大利亚有一个扫地机器人在清理房子，那么印度别人家里发生的事情都不会影响我的扫地机器人的\
  \ `state`。\n\n另一个例子是，如果你有一辆自动驾驶汽车，它对周围的一切都有 360 度的视野。在你面前有一辆卡车，卡车前面还有一辆车，那么那辆车就不属于你的\
  \ `state`，因为你看不见。所以，无论那辆车是否在你面前卡车的前面，你的 `state` 都是相同的。\n\n\n\n最后，我们来看下动作和奖励。\n\n\
  ### 动作 (Actions)\n动作是智能体可以执行并影响其状态的操作。在我们的井棋游戏中，动作就是在棋盘上落一个棋子。\n\n执行动作总是会带我们进入下一个状态，该状态也伴随着一个可能的奖励。\n\
  \n---\n\n奖励的一个方面是，奖励仅仅是告诉你你的动作“有多好”，而不是它是否是一个正确/错误的动作。它并不会告诉你这是否最好/最坏的动作。它仅仅是一个数字。\n\
  \n所以，如果你是一个智能体，你在存续期间获得的奖励并不一定代表你未来可能获得的奖励。\n\n你可能正在搜索状态空间中一个糟糕的部分，并碰到了 `10` 分的局部最大值，而全局最大值是\
  \ `1000` 分。\n\n但如果你是那个智能体，你永远无法得知这一点。我们之所以知道，是因为是我们设计了这个游戏。这又是一个“上帝视角（God-mode）”知识的实例。\n\
  \n---\n\n这与动物或人类的生活非常相似。你出生在一个特定的环境中，过着日常例常。你可能会发现一些让你快乐的事物，并可能将其视为一种局部最大奖励。\n\n\
  但如果那个人生活在一个没有现代医学或技术的地方，而你将其与现代文明的现代生活进行比较，你会发现局部最大值远不是全局最大值。\n\n所以一切都是相对的，奖励是某种无意义的数字，它们只有在相互比较时才有意义。\n\
  \n在强化学习中，奖励多总比奖励少好。\n\n---\n\n现在这里有一些有趣的符号表示。\n\n我们知道，处于状态 `S(t)` 并采取动作 `A(t)` 将引导我们获得奖励\
  \ `R(t+1)` 和状态 `S(t+1)`。\n\n但当我们舍弃时间索引时，我们将这个四元组表示为 `(s, a, r, s’)`。我们没有像你可能的那样给\
  \ `r` 加撇号（prime），这很奇怪，但它是标准的表示法。\n\n所以，撇号并不代表“在时间=t+1”。\n\n---\n\n现在我们要定义一些新术语。\n\
  \n### 回合 (Episode)\n我们要讨论的第一个新术语是“回合”。\n\n一个回合代表游戏的一次运行。\n\n例如，我们将从一个空棋盘开始一局井棋游戏。\n\
  \n一旦一名玩家有 `3` 个棋子连线，该回合就结束了。\n\n你可以想象到，我们的强化学习智能体将在许多回合中不断学习。\n\n例如，在玩了 `1000` 或\
  \ `10,000` 或 `100,000` 个回合后，我们可能训练出一个智能智能体。\n\n这需要多长时间当然取决于超参数，这取决于所玩的游戏、状态的数量、游戏的随机程度等。\n\
  \n如果你以前上过深度学习课程，你应该对超参数已经熟悉了。\n\n---\n\n我们将玩井棋游戏称为“回合任务（episodic task）”，因为你可以反复玩。\n\
  \n这与永不结束的“连续任务（continuous task）”不同。在某种程度上，你只玩一次那种游戏。\n\n我们在书中将不会涉及连续任务。\n\n### 终端状态\
  \ (Terminal States)\n我们如何知道处于一个回合的“结束”？状态空间中存在某些状态可以告诉你游戏已经结束。\n\n对于井棋来说，当 `2` 名玩家之一有\
  \ `3` 个棋子连线，或者棋盘满员时，游戏结束。\n\n这些状态被称为“终端状态”。\n\n所以，“终端状态”是一个你无法再采取更多动作的状态。这意味着回合结束了。\n\
  \n对于井棋来说，这意味着玩家 1 获胜、玩家 2 获胜，或者是平局。\n\n---\n\n强化学习和控制系统中的另一个著名问题是倒摆问题（inverted pendulum），在控制系统中它被称为倒摆，在强化学习中它被称为小车倒立摆（cart-pole）。它们是同一个问题。\n\
  \n如果你在 Google 上搜索“inverted pendulum”，你会看到控制系统领域的论文；如果你在 Google 上搜索“cart-pole”，你会看到看到强化学习领域的论文。\n\
  \n在一个回合的开始时，小车是静止的，杆子垂直于地面。但由于这是一个不稳定系统，小车是静止的，杆子垂直于地面。\n\n\n\n想象这样一个场景。\n\n你正在考虑为明天的考试复习。但你更想和朋友一起出去玩。\n\
  \n你的朋友会让你感到快乐，对你来说这就是一种奖励。你会获得多巴胺的刺激。\n\n如果你今晚学习，你会感到疲惫和无聊，也许你的多巴胺会减少，所以这某种程度上是一种负奖励。\n\
  \n那么，我们为什么要为了考试学习呢？\n\n因为我们不仅考虑即时奖励，还会根据未来奖励制定行动计划。\n\n如果你学习，你的考试就会考好，获得好成绩，并找到一份薪水不错的工作。\n\
  \n所以，我们想要为这种状态：你留在家里为考试学习分配一些价值。\n\n我们称之为**价值函数（value function）**，这就是我们在这一节要讨论的内容。\n\
  \n---\n\n现在让我们反过来来考虑这个问题。\n\n你获得了一个奖励，比方说是被录入了梦想中的工作。\n\n现在，如果你回顾自己在职业生涯和学校期间所做的各种事情，你会将你的成功归功于什么？\n\
  \n你过去的哪种状态导致了你今天获得了梦想中的工作？\n\n**归因分配问题（credit assignment problem）**是指解决以下问题：\n\n\
  你过去的哪种行为导致了你现在收到的奖励？\n\n---\n\n归因分配问题也出现在在线广告中，但形式略有不同。在在线广告中这被称为“归因（attribution）”。\n\
  \n其核心是，如果用户最终转化并购买了你的产品，在不同的广告展示中，谁应该得功？\n\n分配功劳有各种方案，比如线性分配。\n\n但你可以看到，对我们来说这是一个更深层次的问题。也许用户只看了前\
  \ 9 次广告，在第 10 次时才购买。所以从这个意义上说，第 10 次广告应该得功。\n\n在强化学习中，我们关注的是整个状态序列以及该序列是如何导致最终奖励的。\n\
  \n延迟奖励（Delayed Rewards）\n\n与归因分配问题密切相关的是“延迟奖励”的概念。\n\n请记住，这些只是描述同一种问题的不同方式，而且解决方案也是一样的。\n\
  \n延迟奖励是从另一个角度来看问题的。\n\n在归因分配中，我们回顾过去：做了什么导致了我们现在收到的奖励？\n\n在延迟奖励中，我们问：我正在做的动作与未来可能收到的奖励有什么关系？\n\
  \n延迟奖励的想法告诉我们，AI 需要具备预见未来的能力，即“规划”。\n\n---\n\n想象这样一个场景。你处于状态 `A`，这是游戏的最后状态。只有两个可能的后续状态：`B`\
  \ 或 `C`，它们都是终止状态。\n\n```\noA\n0.5 / 0.5\n/ \\\noB oC\nR=1 R=0\n```\n\nB 给你奖励 1，而\
  \ C 给你奖励 0。你有 50% 的概率进入其中一个状态，因为你的智能体还不知道哪一个最好。\n\n我们可以把状态 `B` 的价值看作 1，状态 `C` 的价值看作\
  \ 0。\n\n状态 `A` 的价值是多少？\n\n我们可以将其看作 0.5，因为你有 50% 的机会进入终止状态。\n\n---\n\n假设你处于状态 `A`，状态\
  \ `A` 只能到达状态 `B`，没有其他可能的后续状态。\n\n如果 B 给你奖励 1，那么 `A` 的价值也应该是 1，因为唯一能到达的地方是奖励为 1 的\
  \ B。\n\n```\noA\n1 / 0\n/ \\\noB oC\nR=1 R=0\n```\n\n因此，这个价值告诉我们一个状态的“未来好程度”。\n\n\
  ---\n\n为了更正式一点，我们实际上将这种价值称为**价值函数（value function）**。\n\n它是我们可能获得的未来奖励的衡量。\n\n我认为“价值（value）”这个词很糟糕，因为它非常模糊，但它是强化学习术语的一部分。\n\
  \n---\n\n奖励和价值是混合在一起的。区别在于，状态的价值是处于该状态后可能获得的未来奖励的衡量。\n\n奖励是即时的。即跳过障碍会立即增加你的分数。\n\
  \n站在障碍面前不会增加你的分数，因此不会产生任何奖励。然而，处于这个状态是有价值的，因为我们可以很快跳过去并在未来获得奖励。\n\n---\n\n所以，在障碍附近准备跳可能比站在障碍边缘具有更高的价值。因此，我们根据下一个状态的价值来选择动作，而不是进入该状态所获得的奖励。\n\
  \n奖励是主要目标，但我们无法用奖励来告诉我们状态有多好，因为它没有告诉我们任何关于未来的信息。\n\n---\n\n思考价值函数的一种方式是，它是一种快速或高效的方法，用来确定处于某个状态“有多好”，而不需要搜索整个游戏树。\n\
  \n你可以尝试列举游戏中每一个可能的状态转换并确定所有的状态转换概率，但你可以想象这将是一项耗时的任务。\n\n事实上，大多数游戏在计算上是不可行的。井棋很容易处理，因为它只有\
  \ 3x3 的棋盘，所以状态数约为 `3⁹ = 19683`。但它随着棋盘的大小呈指数级增长。例如，如果你有一个 4x4 的棋盘（如连棋），那么你会得到 `3¹⁶\
  \ = 4300 万。你可能已经知道指数级增长永远不是好事。搜索状态空间只在最简单的情况下可行。因此，一个仅根据当前状态就能告诉你未来表现如何的价值函数是非常有的。\n\
  \n到此为止，我还没有告诉你们如何实际上找到价值函数，所以我们甚至不知道是否可行，但我们在这里说的是，如果我们拥有了它，那就是它能告诉我们的信息，它可以立即告诉我们信息，而无需创建整个游戏树和转换概率模型。\n\
  \n事实上，这是一个常数时间查找，因为状态直接映射到一个值。你可能会将值存储在一个具有常数时间查找的数组中。\n\n顺便说一下，这个问题是“维度灾难”的另一个实例，我们在我的机器学习课程中也见过它。\n\
  \n---\n\n估计价值函数是强化学习中的核心任务。但请注意，并不是所有的 RL 策略都需要它。例如，遗传算法只需产生具有随机基因突变的后代，活得最长的那些将在下一代继续产生后代。所以，通过纯的演化或自然选择，我们可以培育出在游戏中变得越来越好的\
  \ AI。\n\n然而，这通常不是我们强化学习所感兴趣的算法类型。\n\n---\n\n让我们来看数学部分。\n\n正如我们讨论过的，价值函数接受一个参数：状态。所以我们将其标记为\
  \ `V(s)`。\n\n它是给定当前状态为 `s` 的情况下，所有未来奖励的期望值。换句话说，给定当前状态为 `s` 的情况下，所有可能的未来奖励的平均值。\n\
  \n`V(s) = E[all future rewards | s]`\n\n非常简单。\n\n我们将在稍后的章节中更严谨地定义价值的概念。\n\n---\n\
  \n现在让我们来看一种可以用来找到价值函数的通用算法。\n\n\n\n\n在本本书的这一章节，我们将引入一些不现实的限制，以便问题能够被解决，但你将在后面的章节中看到我们并不需要这样做。\n\
  \n我们将使用的算法是一种迭代算法，这意味着我们将运行一个循环，并且每次通过循环时，都会越来越接近真实的价值函数。\n\n我们做的第一件事是初始化价值函数。对于智能体胜利的所有状态，我们认为其值为\
  \ 1。对于智能体失败或平局的所有状态，我们认为其值为 0。对于所有其他状态，我们认为其值为 0.5。\n\n### `init`\n\n`V(s) = 1 if\
  \ s = winning state`\n\n`V(s) = 0 if s = losing state or draw`\n\n`V(s) = 0.5 otherwise`\n\
  \n对于我们未来将看到的算法，我们不需要进行如此仔细的初始化。\n\n理解价值函数的一种方法（仅适用于此游戏，而不通用）是：它是获胜的概率。\n\n值始终在 0\
  \ 和 1 之间，所以这是有意义。\n\n---\n\n更新方程看起来很简单，但包含一些隐藏的细节。\n\n`V(s) = V(s) + alpha*(V(s’)-V(s))`\n\
  \n### `s = current state, s’ = next state`\n\n第一个细节是，这里的 `s` 指我们在一个回合（episode）中遇到的所有状态。\n\
  \n这意味着对于循环的每次迭代，我们实际上需要玩一次游戏并记住我们所处的每个状态。\n\n然后我们遍历状态历史中的每个状态，并使用这个方程更新价值。\n\n注意，终止状态（terminal\
  \ state）的值永远不会被更新，因为这个方程根据下一个状态的值来更新当前状态的值，而如果我们处于终止状态，则下一个状态是不存在的。\n\n`i.e. if\
  \ s = terminal, then s’ doesn’t exist`\n\n---\n\n在伪代码中它可能像这样：\n\n```python\nfor\
  \ t in range(max_iterations):\n    state_history = play_game()\n    s = state_history[0]\n\
  \    for s’ in state_history[1:]:\n        V(s) = V(s) + learning_rate*(V(s’) -\
  \ V(s))\n```\n\n---\n\n我们必须讨论的下一个细节是实际上如何玩游戏。\n\n我们仅仅是采取随机动作吗？\n\n在这种情况下，我们不必这样做，因为我们已经有了价值函数。\n\
  \n价值函数告诉我们一个状态的好坏取决于未来状态的好坏，所以我们所做的就是执行通往最佳下一个状态的动作。\n\n在伪代码中它可能像这样：\n\n```python\n\
  maxV = 0\nmaxA = None\nfor a, s’ in possible_next_states:\n    if V(s’) > maxV:\n\
  \        maxV = V(s’)\n        maxA = a\nperform action maxA\n```\n\n---\n\n现在这个策略有什么问题呢？\n\
  \n问题在于价值函数是不准确！如果我们已经有了一个准确的价值函数，从一开始我们就不需要进行这些工作。\n\n你可能认出这是我们已经讨论过的问题。它是探索与利用的困境（explore-exploit\
  \ dilemma）。\n\n特别是，通过采取随机动作，我们可以学习到否则永远不会去的新状态。\n\n通过这样做，我们可以改进对那些状态的价值函数的估计。\n\n\
  但为了获胜，我们需要执行产生最大价值的动作。\n\n所以，我们将使用 epsilon-贪婪策略（epsilon-greedy strategy）在探索和利用之间进行权衡。\n\
  \n---\n\n让我们来看看为什么这种迭代更新有效的直观理解。\n\n首先，你会认出之前的这个更新方程。它应该让你想起之前见过的低通滤波器和迭代平均值求解方程。\n\
  \n如果你以前遇到过梯度下降，它看起来也像梯度下降。`V(s’)` 就像是目标值，我们想让 `V(s)` 向该值移动。\n\n然而，在强化学习中存在多个可能的下一个状态，因此有多个\
  \ `s’`。\n\n因此，通过多次执行这个更新方程，我们为每个不同的 `s’` 将 `V(s)` 拉向多个不同的方向。\n\n这种想法是，通过玩无限的回合，我们花费在\
  \ `s’`上的时间比例将接近真实的下一个状态概率。\n\n随着游戏次数趋于无穷大，我们实现了精确的期望值：\n\n`p(s1)*V(s1) + p(s2)V(s2)\
  \ + ...`\n\n---\n\n另一个极其重要的、且仅凭更新公式极难察觉的细节是，你必须更新任何给定状态价值的顺序。\n\n我们知道，对于任何特定的回合，我们只会更新出现在该回合中的状态值。\n\
  \n但这个方程的关键在于，我们正在让 `V(s)` 靠近 `V(s’)`。\n\n这意味着我们是在假设 `V(s’)` 比 `V(s)` 更准确的情况下进行这种更新。\n\
  \n对于终止状态，这是正确的，因为那总是 0 或 1 且永远不会改变。\n\n但如果 `V(s)` 和 `V(s’)` 的准确性相同，也就是说它们完全都不准确，那么让其中一个靠近另一个就没有意义了。\n\
  \n\n请记住，这个解决方案并非唯一，而且事实上，对象之间存在一些糟糕的耦合，这些可能并不是最优的。\n\n所以，如果你自己尝试实现它，很有可能你的解决方案看起来会完全不同，但只要它运行良好就没关系。\n\
  \n如果你不想跟着代码一起编写，只想直接运行代码，课程仓库中的相关文件是 `tic_tac_toe.py`。\n\n---\n\n## 高级设计 (High Level\
  \ Design)\n\n在高级层面上，我们将有两个主要对象：智能体（Agent）和环境（Environment）。\n\n`Agent <-----> Environment`\n\
  \n`play_game(agent1, agent2, environment)`\n\n在任何游戏过程中，会有 2 个智能体对象实例，它们都将与同一个环境实例进行交互。\n\
  \n为了让这些内容产生交互，我们可以创建一个名为 `play_game()` 的函数，它接受玩家 1 的智能体、玩家 2 的智能体以及环境对象。\n\n---\n\
  \n那么，`play_game()` 函数内部应该放什么呢？\n\n首先是代码，然后是讨论。\n\n```python\ndef play_game(p1, p2,\
  \ env, draw=False):\n    # 循环直到游戏结束\n    current_player = None\n    while not env.game_over():\n\
  \        # 在玩家之间切换\n        # p1 总是先行\n        if current_player == p1:\n      \
  \      current_player = p2\n        else:\n            current_player = p1\n\n \
  \       # 在想要查看视图的用户移动之前绘制棋盘\n        if draw:\n            if draw == 1 and current_player\
  \ == p1:\n                env.draw_board()\n            if draw == 2 and current_player\
  \ == p2:\n                env.draw_board()\n\n        # 当前玩家执行动作\n        current_player.take_action(env)\n\
  \n        # 更新状态历史\n        state = env.get_state()\n        p1.update_state_history(state)\n\
  \        p2.update_state_history(state)\n\n        if draw:\n            env.draw_board()\n\
  \n        # 执行价值函数更新\n        p1.update(env)\n        p2.update(env)\n```\n\n在这个函数内部，本质上是一个单一循环。我们会在\
  \ 2 个玩家之间切换，在循环的每次迭代中，我们需要完成几项操作。\n\n首先，我们需要让当前玩家执行一个更新环境的动作。\n\n其次，我们需要切换当前玩家，以便进行交替。\n\
  \n第三，我们需要检查游戏是否结束，因为循环会在结束时终止。\n\n所以你可以看到，我们在这里为我们的对象可能需要的某些实例方法创建了一个部分 API。\n\n\
  环境需要一个 `game_over()` 函数，它返回一个布尔值：如果游戏结束则返回 true，否则返回 false。你可以想象，这个函数将必须扫描棋盘以检查是否有胜者，或者棋盘是否已填满导致平局。\n\
  \n智能体需要一个 `take_action()` 函数，它接受环境作为参数。这将更新环境，从而更新状态。\n\n我们在智能体上需要的另一个函数是 `update()`\
  \ 函数，它用于更新该智能体对价值函数的内部估值。这就是我们讨论过的更新方程将所在的地方。`update()` 函数也需要接受环境，因为它必须从环境中查询最新的奖励。\n\
  \n另一个对我们非常有有用（但不是严格必须）的函数是 `draw_board()` 函数，它将显示当前哪些位置被占据，以及被什么种棋子占据。\n\n---\n\n\
  仅从这个设计，你可能就可以开始编写你自己的井跳棋了。所以，如果你之前不知道从何处，希望这能为你提供一个开始的方向。如果你想尝试自己完成剩余部分，那将非常好。\n\
  \n## 表示状态 (Representing States)\n\n在这一节中，我们将讨论如何在井跳棋游戏中表示状态。\n\n\n\n所以你将看到的状态总数为\
  \ $9! = 362,880$。\n\n这比 $3⁹ = 19683$ 大了几个数量级。\n\n因此，我们想要用于枚举所有状态的算法绝对只是生成排列。\n\n\
  ---\n\n好了，那么我们如何生成排列呢？\n\n再次想一下一个二进制数。\n\n这本质上是一个递归问题，因为长度为 $N$ 的二进制数可以 $0$ 或 $1$\
  \ 开头，然后可以在后面加上长度为 $N-1$ 的二进制数的所有排列。\n\n`长度为 N 的所有排列 =`\n`[1] + 长度为 N-1 的所有排列`\n\
  `[0] + 长度为 N-1 的所有排列`\n\n---\n\n在伪代码中，我们可以这样做。首先，我们获取递归结果，即所有长度为 $N-1$ 的二进制数。我们在循环外执行操作，因为执行多次是冗余的。在外层循环中，我们遍历所有可能的前缀；在内层循环中，我们遍历所有的子结果。在循环内部，我们通过组合前缀和后缀来创建新结果，并将其添加到我们的结果列表中。\n\
  \n为了简单起见，我在这里没有展示基础（base case）。\n\n```python\ndef generate_all_binary_numbers(N):\n\
  \    results = []\n    child_results = generate_all_binary_numbers(N-1)\n    for\
  \ prefix in ('0', '1'):\n        for suffix in child_results:\n            new_result\
  \ = prefix + suffix\n            results.append(new_result)\n    return results\n\
  ```\n\n---\n\n这只是通用的排列方法的一个例子。对于我们来说，情况会略有不同。\n\n我们将有一个名为 `get_state_hash_and_winner`\
  \ 的递归函数，它将返回一个三元组列表。每个三元组将包含：哈希后的状态数值、胜者是谁（如果有），以及该状态是否代表游戏已结束。\n\n该函数的 3 个参数是 `env`（我们只需要它的棋盘矩阵），以及用于放置下一个值的\
  \ `(i, j)` 坐标，值可以是 $0$（空）、`\"X\"` 或 `\"O\"`。\n\n---\n\n```python\ndef get_state_hash_and_winner(env,\
  \ i=0, j=0):\n    results = []\n    for v in (0, env.x, env.o):\n        env.board[i,j]\
  \ = v # 如果是空盘，它应该是 0\n        if j == 2:\n            # j 回到 0，增加 i，除非 i = 2，则我们完成了\n\
  \            if i == 2:\n                # 棋盘填满了，收集结果并返回\n                state\
  \ = env.get_state()\n                ended = env.game_over(force_recalculate=True)\n\
  \                winner = env.winner\n                results.append((state, winner,\
  \ ended))\n            else:\n                results += get_state_hash_and_winner(env,\
  \ i + 1, 0)\n        else:\n            # 增加 j，i 保持不变\n            results += get_state_hash_and_winner(env,\
  \ i, j + 1)\n    return results\n```\n\n在这个函数里将向你们展示基础。如果 $i=2$ 且 $j=2$，那么我们正在填充棋盘上的最后一个位置，这意味着我们现在应该检查游戏状态、胜者是谁以及游戏是否结束。\n\
  \n注意，尽管我是在说棋盘现在被“填满了”，但我的意思是它也可以被 $0$ 值（代表空）填满，所以这并不意味着游戏结束，仅仅意味着排列完成。\n\n现在，如果不是基础，我们想要递归地调用此函数，但有两个数字可以增加：`i`\
  \ 或 `j`，但绝不能同时增加。\n\n如果我们在一行的末尾（意味着 $j=2$），我们就想要跳转到下一行的第一列，所以设置 `j=0` 并增加 `i`。\n\
  \n如果不在一行的末尾，我们只需增加 `j` 并保持 `i` 不变。\n\n---\n\n最后，我想指出，两名玩家的初始值函数是不等价。\n\n记住，一个玩家必须是\
  \ `\"X\"`，另一个玩家必须是 `\"O\"`。\n\n所以，如果 `\"X\"` 的价值函数为 $1$（X 胜），那么对于 `\"O\"` 来说就是 $0$（O\
  \ 输），反之亦然。但它们并不完全相反，因为如果是平局，两个玩家都会得到 $0$。\n\n所以我们将有两个几乎相反的函数：`initializeV_x` 和 `initializeV_o`。\n\
  \n`state_winner_triples = get_state_hash_and_winner(env)`\n\n```python\ndef initialV_x(env,\
  \ state_winner_triples):\n    # 初始化状态值如下：\n    # 如果 x 胜，V(s) = 1\n    # 如果 x 输或平局，V(s)\
  \ = 0\n    # 否则，V(s) = 0.5\n    V = np.zeros(env.num_states)\n    for state, winner,\
  \ ended in state_winner_triples:\n        if ended:\n            if winner == env.x:\n\
  \                V[state] = 1\n            else:\n                V[state] = 0\n\
  \        else:\n            V[state] = 0.5\n    return V\n```\n\n\n\n接下来是奖励函数。\n\
  \n正如我们之前所说的，如果我们赢了游戏，奖励为 1，否则奖励为 0。\n\n```python\ndef reward(self, sym):\n    #\
  \ 在游戏结束之前没有奖励\n    if not self.game_over():\n        return 0\n\n    # 如果我们到了这里，说明游戏结束了\n\
  \    # sym 将是 self.x 或 self.o\n    return 1 if self.winner == sym else 0\n```\n\n\
  强化学习的定义是：在每一个状态转换时都会给予奖励作为反馈，因此我们需要这个函数能够在任何情况下返回一个有效的结果，这就是为什么我们不能只在游戏结束时才调用它。\n\
  \n当智能体调用 `reward(self, sym)` 时，它需要传入自己的 `sym`，这告诉我们每个智能体都需要知道自己的符号。\n\n---\n\n##\
  \ 更复杂的函数\n\n现在我们来看更复杂的函数。\n\n实际上，在课程早些时候讨论枚举状态时，我们已经见过 `get_state` 了。\n\n```python\n\
  def get_state(self):\n    k = 0\n    h = 0\n    for i in xrange(LENGTH):\n     \
  \   for j in xrange(LENGTH):\n            if self.board[i,j] == 0:\n           \
  \     v = 0\n            elif self.board[i,j] == self.x:\n                v = 1\n\
  \            elif self.board[i,j] == self.o:\n                v = 2\n          \
  \  h += (3**k) * v\n            k += 1\n    return h\n```\n\n这个想法是：如果我们将状态按三进制数字进行排序，那么整个结构就是一个三进制数，我们可以将其转换为一个十进制数。\n\
  \n---\n\n接下来是 `game_over()` 函数。这可能是 `environment` 类中是最复杂的函数了。\n\n```python\ndef\
  \ game_over(self, force_recalculate=False):\n    # 如果游戏结束（某玩家获胜或平局）返回 true\n   \
  \ # 否则返回 false\n    # 同时设置 'winner' 实例变量和 'ended' 实例变量\n    if not force_recalculate\
  \ and self.ended:\n        return self.ended\n\n    # 检查行\n    for i in xrange(LENGTH):\n\
  \        for player in (self.x, self.o):\n            if self.board[i].sum() ==\
  \ player*LENGTH:\n                self.winner = player\n                self.ended\
  \ = True\n                return True\n\n    # 检查列\n    for j in xrange(LENGTH):\n\
  \        for player in (self.x, self.o):\n            if self.board[:,j].sum() ==\
  \ player*LENGTH:\n                self.winner = player\n                self.ended\
  \ = True\n                return True\n\n    # 检查对角线\n    for player in (self.x,\
  \ self.o):\n        # 左上 -> 右下对角线\n        if self.board.trace() == player*LENGTH:\n\
  \            self.winner = player\n            self.ended = True\n            return\
  \ True\n        # 右上 -> 左下对角线\n        if np.fliplr(self.board).trace() == player*LENGTH:\n\
  \            self.winner = player\n                self.ended = True\n         \
  \       return True\n\n    # 检查是否平局\n    if np.all((self.board == 0) == False):\n\
  \        # 胜利者保持为 None\n        self.winner = None\n        self.ended = True\n\
  \        return True\n\n    # 游戏未结束\n    self.winner = None\n    return False\n\
  ```\n\n这里有一个可能会好奇的 `force_recalculate` 参数。\n\n首先，你会注意到 `game_over` 在此脚本中被多次调用。如果游戏已经结束，我们不想反复地进行这个复杂的操作，所以我们直接利用它已经结束这一事实作为快捷径。\n\
  \n但如果你记得我们之前枚举状态的递归函数，我们递归地填充了棋盘上的每个位置。这涉及到在棋盘上放置棋子、取出棋子、放置其他棋子等。因此我们会在游戏结束状态和非结束状态之间来回，这意味着我们不能使用那个快捷径。\n\
  \n所以 `force_recalculate` 让我们确保每次都执行整个操作（如果我们需要的话）。\n\n`game_over()` 函数的后续部分正如预期：我们检查是否有胜利者，如果没有胜利者，我们检查棋盘是否填满（这意味着平局）。\n\
  \n我们通过先检查所有行，然后是所有列，最后是对角线来判断是否有胜利者。\n\n将 `X` 和 `O` 的值赋值为 `-1` 和 `+1` 真的非常有帮助。因为如果某行有\
  \ 3 个 `X`，总和将是 `-3`；如果有 3 个 `O`，总和将是 `+3`。\n\n如果我们找到了胜利者，就会将 `winner` 实例变量设置为获胜的玩家，并将\
  \ `ended` 实例变量设置为 `true`。我们还返回 `true`，因为 `game_over()` 函数需要返回一个布尔值。\n\n唯一有点复杂的地方在于检查对角线时。\n\
  \n我们知道矩阵的 `trace`（迹）是主对角线上所有元素之和。\n\n---\n\n## 智能体 (Agent)\n\n在这一部分我们将讨论另一个主要类：`Agent`。\n\
  \n到目前为止我们知道它是 AI。\n\n这与普通的机器学习不同，因为在这种情况下我们不仅仅是提供数据。\n\n相反，智能体必须与环境交互，这是我们刚刚讨论过的。我们的学习算法只是智能体的一小部分，但它负责了\
  \ 100% 的智能。\n\n---\n\n让我们概述我们将查看的所有实例方法。\n\n首先是 `setV(V)`，它允许我们初始化价值函数。如所知，价值函数将以非常特定的方式初始化。\n\
  \n有 `set_symbol(sym)`，允许我们给这个智能体一个它在棋盘上使用的符号。\n\n有 `set_verbose(b)`，接收一个布尔值。顾如其名，如果\
  \ `b` 被设置为 `true`，就会打印更多信息。例如，在智能体移动之前，它会打印棋盘以及每个可能的价值。\n\n有 `reset_history()`。我们需要它是因为我们想要跟踪每个回合的状态历史，但一旦回合结束且学习完成，我们就不再需要该状态历史，可以开始新回合。\n\
  \n有 `take_action(env)`，接收环境作为输入。它将检查棋盘的有效移动并根据策略做出移动，如果你记得我们在在这个游戏中使用 epsilon-贪婪策略。\n\
  \n有 `update_state_history(s)`，它将状态添加到状态历史中。我们不想将其放在 `take_action` 函数中，因为我们只每隔一个回合调用\
  \ `take_action`，而状态历史需要在任何玩家移动时都更新。\n\n最后是 `update(env)` 函数，它也接收环境作为输入。它查询环境获取最新的奖励，由于我们只会在回合结束时调用\
  \ `update()`，因此这将对应于回合的结束。这是所有学习发生的地方。\n\n---\n\n这前 5 个函数非常简单。\n\n```python\nclass\
  \ Agent:\ndef __init__(self, eps=0.1, alpha=0.5):\n```\n\n\n\n\n```python\nself.eps\
  \ = eps # 选择随机动作而非贪婪动作的概率\n\nself.alpha = alpha # 学习率\n\nself.verbose = False\n\n\
  self.state_history = []\n\ndef setV(self, V):\n    self.V = V\n\ndef set_symbol(self,\
  \ sym):\n    self.sym = sym\n\ndef set_verbose(self, v):\n    # 如果为真，将打印棋盘上每个位置的值\n\
  \    self.verbose = v\n\ndef reset_history(self):\n    self.state_history = []\n\
  ```\n\n构造函数设置了 `epsilon`，这是实现 epsilon 贪婪策略所需要的。它设置了 `alpha`，即我们更新方程中的学习率。它设置了默认为\
  \ False 的 `verbose`，并如你所预期的那样将状态历史设置为空空列表。\n\n`SetV`、`set_symbol` 和 `set_verbose`\
  \ 是简单的 setter 方法。\n\n`reset_history()` 只是将状态历史重置为空列表。\n\n---\n\n接下来我们来看 `take_action`\
  \ 函数。\n\n```python\ndef take_action(self, env):\n    # 根据 epsilon-贪婪策略选择动作\n   \
  \ r = np.random.rand()\n    best_state = None\n    if r < self.eps:\n        # 采取随机动作\n\
  \        if self.verbose:\n            print \"正在采取随机动作\"\n\n        possible_moves\
  \ = []\n        for i in xrange(LENGTH):\n            for j in xrange(LENGTH):\n\
  \                if env.is_empty(i, j):\n                    possible_moves.append((i,\
  \ j))\n        idx = np.random.choice(len(possible_moves))\n        next_move =\
  \ possible_moves[idx]\n    else:\n        # 根据状态的当前值选择最佳动作\n        # 遍历所有可能的移动，获取它们的值\n\
  \        # 记录最大值\n        pos2value = {} # 用于调试\n        next_move = None\n    \
  \    best_value = -1\n        for i in xrange(LENGTH):\n            for j in xrange(LENGTH):\n\
  \                if env.is_empty(i, j):\n                    # 如果我们移动这一步，状态会是怎样的？\n\
  \                    env.board[i,j] = self.sym\n                    state = env.get_state()\n\
  \                    env.board[i,j] = 0 # 忘记改回来！\n                    pos2value[(i,j)]\
  \ = self.V[state]\n                    if self.V[state] > best_value:\n        \
  \                best_value = self.V[state]\n                        best_state\
  \ = state\n                        next_move = (i, j)\n\n        # 如果开启详细模式，则带有数值绘制棋盘\n\
  \        if self.verbose:\n            print \"正在采取贪婪动作\"\n            for i in\
  \ xrange(LENGTH):\n                print \"-----------------\"\n               \
  \ for j in xrange(LENGTH):\n                    if env.is_empty(i, j):\n       \
  \                 # 打印值\n                        print \"%.2f|\" % pos2value[(i,j)],\n\
  \                    else:\n                        print \" \",\n             \
  \       if env.board[i,j] == env.x:\n                        print \"x |\",\n  \
  \                  elif env.board[i,j] == env.o:\n                        print\
  \ \"o |\",\n                    else:\n                        print \" |\",\n \
  \                   print \"\"\n            print \"-----------------\"\n\n    #\
  \ 执行移动\n    env.board[next_move[0], next_move[1]] = self.sym\n```\n\n记住我们正在执行 epsilon\
  \ 贪婪策略。所以以 `epsilon` 的概率，我们将执行随机动作。\n\n现在，为了采取随机动作，我们需要创建一个所有可能的移动的列表。这等同于棋盘上所有\
  \ `is_empty` 返回 True 的位置，由于我们传入了环境，我们可以调用它。\n\n一旦我们有了可能的移动列表，就会以均匀概率选择其中一个。\n\n\
  ---\n\n接下来是 epsilon 贪婪策略中的贪婪部分。\n\n在最简单的形式中，我们需要做的与随机策略非常相似。我们将遍历棋盘上的所有位置，检查它是否为空，如果为空，则检查它的值。\n\
  \n如果它的值大于我们当前的最大值，我们就记录这个值和这个位置，将其变为新的最大值。\n\n完成这些后，我们就可以在选定的位置上放置自己的符号。\n\n---\n\
  \n当你考虑到打印详细信息时，贪婪部分会变得复杂一些。\n\n我们想要打印的是棋盘，以及智能体看到的所有值，因为它是利用这些值来做决策的。\n\n所以在第一个循环中，我们想要创建一个从\
  \ `(i,j)` 坐标到值的映射。\n\n然后，如果 `verbose` 为真，我们就打印整个棋盘；如果位置为空，我们就打印值，否则我们打印放置在棋盘该部分的符号。\n\
  \n---\n\n接下来是 `update_state_history`，它是非常容易理解的。你已经知道 `state_history` 是存储为列表的，所以我们只需要向列表中添加元素即可。\n\
  \n```python\ndef update_state_history(self, s):\n    # 不能把它放在 take_action 中，因为 take_action\
  \ 每个玩家\n    # 每隔一次迭代只发生一次\n    # 状态历史需要每次迭代更新\n    # s = env.get_state() # 不想做两次，所以把它传进来\n\
  \    self.state_history.append(s)\n```\n\n我们可以在这里传入环境并调用。\n\n---\n\n最后是 `update`\
  \ 函数。\n\n```python\ndef update(self, env):\n    # 遍历 state_history\n    # 每一个状态\n\
  \    # 计算 target 值\n    # 更新 V[state]\n    for state in reversed(self.state_history):\n\
  \        target = env.reward\n        if env.winner == state:\n            target\
  \ = 1\n        elif env.draw:\n            target = 0.5\n        else:\n       \
  \     target = 0\n        self.V[state] += self.alpha * (target - self.V[state])\n\
  ```\n\n\n\n\n# 在用户想要看棋盘的操作之前绘制棋盘\n\n```python\nif draw:\n    if draw == 1 and current_player\
  \ == p1:\n        env.draw_board()\n    if draw == 2 and current_player == p2:\n\
  \        env.draw_board()\n\n## 当前玩家行动\ncurrent_player.take_action(env)\n\n## 更新状态历史\n\
  state = env.get_state()\np1.update_state_history(state)\np2.update_state_history(state)\n\
  \nif draw:\n    env.draw_board()\n\n## 执行值函数更新\np1.update(env)\np2.update(env)\n\
  ```\n\n在 `play_game` 函数中，我们记录了当前玩家是谁。第一个玩家始终是玩家 1。\n\n我们进入循环，该循环在游戏结束时存在。\n\n循环的第一部分允许我们在玩家之间交替，并让玩家\
  \ 1 先手。\n\n由于我们**不**想在 AI 回合之前绘制棋盘，因此我们允许 `draw` 取 1 和 2 的值，1 代表玩家 1，2 代表玩家 2。这样，棋盘每隔一个回合就会绘制一次，并且针对正确的玩家。\n\
  \n下一步是让智能体采取行动，紧接着是更新所有智能体的状态历史。\n\n循环结束后，我们可以最后绘制一次棋盘，这样你就能谁赢了。\n\n之后，我们可以进行值函数更新，因为回合现在结束了。\n\
  \n---\n\n在脚本的主部分，我们将看到如何使用 `play_game` 函数，因为我们需要运行很多回合，以便智能体能够在很大程度上学会玩游戏。\n\n```python\n\
  if __name__ == '__main__':\n    # 训练智能体\n    p1 = Agent()\n    p2 = Agent()\n\n\
  \    # 为 p1 和 p2 设置初始 V\n    env = Environment()\n    state_winner_triples = get_state_hash_and_winner(env)\n\
  \n    Vx = initialV_x(env, state_winner_triples)\n    p1.setV(Vx)\n    Vo = initialV_o(env,\
  \ state_winner_triples)\n    p2.setV(Vo)\n\n    # 给每个玩家分配符号\n    p1.set_symbol(env.x)\n\
  \    p2.set_symbol(env.o)\n\n    T = 10000\n    for t in xrange(T):\n        if\
  \ t % 200 == 0:\n            print t\n        play_game(p1, p2, Environment())\n\
  \n    # 人类对战智能体\n    # 你认为智能体学会了如何玩游戏吗？\n    human = Human()\n    human.set_symbol(env.o)\n\
  \    while True:\n        p1.set_verbose(True)\n        play_game(p1, human, Environment(),\
  \ draw=2)\n        # 我让智能体当玩家 1，是因为我想看看它是否会\n        # 选择中心作为起始移动。如果你想让智能体\n   \
  \     # 后手，可以交换人类和 AI。\n        answer = raw_input(\"再次玩吗？[Y/n]: \")\n        if\
  \ answer and answer.lower()[0] == 'n':\n            break\n```\n\n第一步是由于创建了 2 个\
  \ AI。\n\n接下来的几步都用于初始化 AI。\n\n首先我们初始化它们的值函数，记住，对于 2 个智能体来说，它们取决于哪一个是 X 哪一个是 O，是不同的。\n\
  \n我们还设置了它们的符号。\n\n接下来，我们进行 10,000 局 AI 对战 AI 的游戏。\n\n从技术上讲，我们可以在这里创建一个重置环境的方法，但我并没有这样做。相反，我们只是每次迭代都创建一个新的\
  \ `Environment`。\n\n最后，当 AI 完成训练后，你可以和它对战，看看谁赢了。\n\n我们将 `verbose` 设置为 `True`，以便你可以看到\
  \ AI 用于做决策的值函数。\n\n你可以自己尝试脚本的其他配置：\n- 查看 AI 是否从中心开始\n- 故意犯错让 AI 获胜\n- 查看 AI 在你尝试获胜时是如何拦截的\n\
  \n## 总结\n\n在本节中，我们将总结这一章，因为内容非常长。\n\n令人惊讶的是，我们做了这一切只是为了玩井字棋，而我们还没有看到这门课程中的强化学习算法。\n\
  \n---\n\n首先，我让你思考如何像一个大一新生一样去解决井字棋。答案是我们将构建一个包含许多 `if` 语句的智能体。它不会适应环境，也不会随着次数的增加而变得更好。\n\
  \n所以即使它一开始看起来很聪明，它也无法增加自己的智能性。\n\n此外，算法会...（提示词中重复的内容）。\n\n\n\n我们唯一能发现的方法就是通过亲自执行动作来“发现”它。\n\
  \n---\n\n最后，强化学习是完全在线的。我们在玩的过程中学习。每当井字棋智能体玩一局井字棋时，它都会变得更优秀。\n\n对比一下决策树。它一次性获取所有的训练数据，并基于这些数据创建一个树。\n\
  \n如果你想将新数据整合到树中，你需要从头开始。\n\n希望这能让你更深入地理解，为什么虽然监督学习似乎可以用于强化学习任务，但实际上这是一项不可行的任务。\n\
  \n# 马尔可夫决策过程\n\n## 网格世界 (Gridworld)\n\n在本章中，我们将对已经在强化学习中学过的一些概念进行形式化。我们已经学习了 `agent`（智能体）、`environment`（环境）、`action`（动作）、`state`（状态）、`reward`（奖励）和\
  \ `episode`（回合）这些术语。\n\n本节将是将所有这些概念放入一个名为马尔可夫决策的正式框架中。\n\n---\n\n在本节中，我们将描述在书中其余部分将使用的游戏。\n\
  \n在很多方面，这个游戏实际上比井字棋更简单，但它具有某些属性，让我们能够探索强化学习的更多特性。\n\n在网格世界中，你的 `agent` 是机器人，而环境正如你可能猜的那样，是一个网格。\n\
  \n`agent` 被允许向 4 个方向移动：上、下、左或右。这就是它的全部动作集。\n\n网格通常是构建的：\n\n```\n0 1 2 3\n+-----+-----+-----+-----+\n\
  0| | | | win |\n+-----+-----+-----+-----+\n1| | wall| | lose|\n+-----+-----+-----+-----+\n\
  2|start| | | |\n+-----+-----+-----+-----+\n```\n\n在位置 `(1, 1)` 处有一个 `wall`（墙），所以机器人不能去那里。如果它尝试去那里，只会撞到\
  \ `wall`。\n\n在位置 `(0, 3)` 和位置 `(1, 3)` 处有两个终止状态。位置 `(0, 3)` 是目标状态。你想结束于这里，因为在这里你可以获得最大奖励。位置\
  \ `(1, 3)` 是失败状态。如果你落在这里，你就输了。我宽泛地使用“输”这个词，因为我们更关注像总奖励这样定义良好的概念。无论如何，在那个位置，你将收到一个巨大的负奖励。所以你不希望落到那里。\n\
  \n---\n\n你会注意到网格世界的一个点是，它的状态数量比井字棋要少得多。状态可以定义为机器人的位置。因此只有 11 个状态，因为网格大小为 12，而机器人不能进入其中一个方格。\n\
  \n正如你已经看到的，这是一个很小的游戏——11 个状态和 4 个动作。\n\n从这里开始我们将推导出后续的概念。\n\n## 马尔可夫属性 (Markov Property)\n\
  \n在本节中，我们将讨论马尔可夫属性。从名称可以看出，马尔可夫属性是马尔可夫决策过程的核心组件。\n\n我们之所以花整节课讨论马尔可夫属性，是因为在强化学习的语境下，它看起来与我们过去看到的有所不同。\n\
  \n---\n\n让我们从严格的数学意义上回顾马尔可夫属性。\n\n假设我们有一个从 `x(1)` 到 `x(t)` 的序列。\n\n```\n{x(1), x(2),\
  \ ..., x(t)}\n```\n\n我们可以根据所有之前的 `x` 来定义 `x(t)` 的条件概率。\n\n`p(x(t) | x(t-1), x(t-2),\
  \ ..., x(1))`\n\n通常情况下，这是无法简化的。\n\n但如果我们假设马尔可夫属性成立，那么它可以简化的。\n\n一阶马尔可夫：\n\n`p(x(t)\
  \ | x(t-1), x(t-2), ..., x(1)) = p(x(t) | x(t-1))`\n\n二阶马尔可夫：\n\n`p(x(t) | x(t-1),\
  \ x(t-2), ..., x(1)) = p(x(t) | x(t-1), x(t-2))`\n\n马尔可夫属性（阶）规定了当前的 `x` 取决于多少之前的\
  \ `x`。\n\n一阶马尔可夫意味着 `x(t)` 只依赖于 `x(t-1)`。二阶马尔可夫意味着 `x(t)` 依赖于 `x(t-1)` 和 `x(t-2)`。在本课程中，我们将仅处理一阶马尔可夫，并通常将其称为马尔可夫属性。\n\
  \n---\n\n让我们来看马尔可夫属性的一个简单例子。\n\n考虑句子：“马尔可夫属性是”。如果我告诉你：“这些是之前的词，预测下一个词”。你可能猜下一个词是“属性”。现在我说：“之前的词是”，你能预测下一个词吗？可能可以，但更难。\n\
  \n如果之前的词只是“属性”，你能预测下一个词吗？可能不能。但这就是马尔可夫假设。\n\n所以你会发现马尔可夫假设可能是很有局限性的，但你也可以定义你的问题使其不受此限制。\n\
  \n---\n\n那么在强化学习中，马尔可夫属性是什么样子的？\n\n记住，在状态 `S(t)` 下执行动作 `A(t)` 会产生两个结果。它产生下一个状态 `S(t+1)`\
  \ 和一个奖励 `R(t+1)`。在这种情况下，马尔可夫属性说的是 `S(t+1)` 和 `R(t+1)` **仅**依赖于 `A(t)` 和 `S(t)`，而不依赖于之前的任何\
  \ `A` 或 `S`。\n\n`p(S(t+1),R(t+1) | S(t),A(t),S(t-1),A(t-1),...,S(1),A(1)) = p(S(t+1),R(t+1)\
  \ | S(t),A(t))`\n\n为了方便，我们也可以使用我们的简写符号 `s`、`a`、`r` 和 `s'`。\n\n`p(s',r | s,a) = p(S(t+1)=s',R(t+1)=r\
  \ | S(t)=s,A(t)=a)`\n\n这与我们“通常”编写马尔可夫属性的方式何不同？\n\n注意这是 `s'` 和 `r` 的联合分布。所以它告诉我们在给定另外两个变量的情况下，这两个变量的联合分布。\n\
  \n---\n\n给定这个联合分布，当然只是使用概率规则寻找边缘条件分布的问题。例如，如果我们只想知道在给定 `s` 和 `a` 的情况下 `s'`，可以使用这些方程：\n\
  \n`p(s' | s,a) = integral{p(s',r | s,a)}dr`\n\n`p(r | s,a) = sum{p(s',r | s,a)}`\n\
  \n（假设 `r` 是连续的）。\n\n注意，对于我们考虑的几乎所有情况，这些概率将是确定性的。在一个状态中执行动作始终会将你带到相同的下一个状态。\n\n但知道这些概率在需要时是定义好的是好的，而且它们也是核心理论的一部分。\n\
  \n---\n\n作为一个马尔可夫假设并不一定具有局限性的例子，我们可以看看强化学习的一个近期应用。\n\nDeepMind (Mnih et al. 2013)\
  \ 使用最近 4 帧的拼接来表示当前状态。\n\n严格来说，状态可以由从过去到现在的任何时间点的任何内容组成。我们通常认为现在的状态是我们现在正在测量的东西，但事实并非如此。\n\
  \n注意，我们也不一定需要原始数据来表示状态。状态也可以由派自原始数据的数据组成。你可能认为那是对原始数据的特征转换。\n\n本质上，来自智能体传感器的任何输入都可以用于形成状态。\n\
  \n##形式化马尔可夫决策过程\n\n在本节中，我们将以更正式的方式观察马尔可夫决策过程。\n\n我们直以来一直在观察马尔可夫决策过程，只是从未给它命名。\n\n\
  任何遵循马尔可夫属性的具有状态、动作和奖励的强化学习任务都是马尔可夫决策过程。\n\n从形式上说，马尔可夫决策过程是一个五元组，由状态集合、奖励集合、动作集合、状态转移概率和奖励概率（我们之前作为联合分布讨论过）以及折扣因子组成（我们将在稍后的课程中定义）。\n\
  \n---\n\n然而，我们还需要另一个碎片块来完成这个拼图。\n\n“马尔可夫决策过程”中的另一个关键术语是“决策”。\n\n\n\n\n我们决定在什么状态下采取什么动作的方法被称为**策略**（policy）。\n\
  \n我们通常用符号 `pi` 来表示策略。\n\n从技术上讲，策略并不是 `MDP` 本身的一部分，但它是解决方案的一部分，与价值函数（value function）一起（我们就会对其进行更正式的定义）。\n\
  \n我之前没有提到策略的原因是因为这个符号有点奇怪。我们把 `pi` 写成一个数学符号，但并没有一个关于 `pi` 的方程。\n\n例如，如果 `pi` 是 `epsilon-greedy`（ε贪心策略），我们如何将其写成方程呢？它更像是一个算法。例如：`pi\
  \ = epsilon-greedy`？这并不是一个方程。\n\n唯一的例外是你想要写下**最优策略**（optimal policy）时，它可以根据价值函数用数学方式进行定义。我们将在后面的讲座中讨论最优策略及其含义。\n\
  \n所以目前，`pi` 更多是智能体用于导航环境的算法的简记符号。\n\n---\n\n由于马尔可夫决策过程满足马尔可夫属性，你可以想象我们可以像为马尔可夫模型和隐马尔可夫模型那样，也为\
  \ `MDPs` 绘制状态转移图。我不经常这样做，但你可能会发现这对你自己很有用。\n\n---\n\n让我们再次观察转移概率 `p(s’ | s, a)`。记得我提到过这通常是确定性的，但情况并不总是如此。为什么会这样呢？\n\
  \n记住，状态只是根据智能体从环境中感知到的信息所得出的。它不是环境本身。状态可能是对环境的不完美表示。在这种情况下，你会预期状态转移是概率性的。例如，你测量的状态可能代表环境的多种配置。\n\
  \n作为环境不完美表示的例子，想一下黑杰游戏（think-jack）。你可能认为发牌员下一张牌是状态的一部分。但如果你是智能体，你看不见下一张牌。所以它不是你状态的一部分。它是环境的一部分。\n\
  \n---\n\n有时，对于什么构成了智能体和环境存在困惑。想象你正在自己的环境中。你可能认为自己是智能体，但什么构成了“你”？\n\n你是你的身体吗？更准确地说，你的身体是环境的一部分。你的身体并不做决策或学习。你的身体拥有传感器并将信号传递给你的大脑，但是你的大脑或思想在进行所有的学习和决策。所以，你要留意区分智能体和环境的边界划在哪里。\n\
  \n## 未来奖励\n\n在本节中，我们将正式化总奖励的概念。特别是，我们感兴趣的衡量的是总未来奖励。即从 `t+1` 开始之后的所有内容。\n\n我们将其称为“**回报”（return），并使用符号\
  \ `G(t)` 来表示它。\n\n`G(t) = R(t+1) + R(t+2) + ... + R(t+infinity)`\n\n注意它不依赖于当前时间的奖励。这是因为，严格来说，当我到达一个状态时，我收到了该状态的奖励。我无法对其进行任何预测，因为它已经发生了。\n\
  \n---\n\n现在想一个非常长的任务。一个包含长数千步序列的任务。你的目标是使总奖励最大化。\n\n但现在获得奖励和 10 年后获得同样的奖励之间有区别吗？考虑一下金融。你知道今天的\
  \ `$1000` 价值低于 10 年前的 `$1000`。如果我问你，你更愿意在现在拿 `$1000`，还是愿意在 10 年后拿 `$1000`，你当然会选择现在。\n\
  \n---\n\n因此，我们对未来奖励引入了所谓的**折扣因子**（discount factor）。我们将折扣因子称为 `gamma`，并使用 0 到 1 之间的一个数字来表示它。\n\
  \n`G(t) = sum[t’=0...inf]{ gamma^t’ R(t+t’+1) }`\n\n很显然，`gamma` 为 1 意味着我们不在乎奖励在未来有多远，所有未来奖励应该具有相同的权重。如果\
  \ `gamma` 为 0，则意味着我们完全不在乎未来。因为，这样做将是一个真正的贪心算法。\n\n## 价值函数\n\n在本节中，我们终于准备好讨论价值函数了。\n\
  \n\n\n\n因此，我们也可以用它来计算之前看到的期望值的第二部分。\n\n`V(s) = E[R(t+1)+gamma*G(t+1) | S(t)=s]`\n\
  \n`V(s) = sum[a]{{ pi(a | s) sum[s’, r]{{ p(s’,r | s,a)(r + gamma*E[G(t+1) | S(t+1)=s’])\
  \ }}`\n\n`V(s) = sum[a]{{ pi(a | s) sum[s’, r]{{ p(s’,r | s,a)r+V(s')} }}`\n\n这个递归方程在强化学习中具有特殊地位，它是我们学习的所有算法所基于的方程。\n\
  \n它被称为“贝尔曼方程”（`Bellman equation`），以著名的数学家理查德·贝尔曼（Richard Bellman）的名字命名。\n\n贝尔曼开创了被称为“动态规划”的技术，你可能在算法课上学过它。它和递归有关，但它是高效的，因为它使用自底向上的方法来构建解决方案。\n\
  \n事实上，我们将学习的解决 MDP（马尔可夫决策过程）的技术之一被称为“动态规划”。\n\n---\n\n在讨论价值函数时，我们还需要学习另一种价值函数。\n\
  \n我们刚刚学习的 `V(s)` 被称为状态价值函数（state-value function）。\n\n有另一个价值函数 `Q(s, a)`，被称为动作价值函数（action-value\
  \ function）。之所以这样，是因为动作 `a` 也是函数的参数。\n\n注意，由于 `Q` 有 2 个输入，存储它所需的空间是二次方的。具体来说，我们需要的空间是状态集合的大小乘以动作集合的大小（`|S|`）。\n\
  \n\n\n\n`old_v = V(s)`\n\n`V(s)=sum[a]{pi(a | s)sum[s’,r]{p(s’,r | s,a)(r+V(s’))}}`\n\
  \n`\U0001D6E5 = max(\U0001D6E5, |V(s) - old_v|)`\n\n`if \U0001D6E5 < threshold:\
  \ break`\n\n`return V(s)`\n\n迭代策略评估的输入是策略 `pi`，输出是该策略的值函数。\n\n我们首先将所有状态的 `V(s)`\
  \ 初始化为 0。在一个无限循环中，初始化一个名为 `\U0001D6E5` 的变量。`\U0001D6E5` 代表当前迭代期间的最大变化。我们将使用 `\U0001D6E5\
  ` 来决定何时退出。当 `\U0001D6E5` 足够小时，我们就跳出循环。\n\n然后对于状态空间中的每个状态，我们保留一个旧 `V(s)` 的副本，然后使用贝尔曼方程来更新\
  \ `V(s)`。\n\n我们将 `\U0001D6E5` 设置为该迭代中 `V(s)` 的最大变化。\n\n一旦收敛，我们就返回 `V(s)`。\n\n---\n\
  \n算法中主要感兴趣的部分无疑是包含贝尔曼方程的部分。\n\n`V [k+1] (s) = sum\\[a\\]{ pi(a | s) sum\\[s’, r\\\
  ]{ p(s’,r | s,a)(r+V [k] (s’)) }}`\n\n注意严格来说，迭代 `k+1` 处的值仅依赖于迭代 `k` 的值。\n\n然而，事实并非如此。\n\
  \n事实上，我们始终可以通过就地更新（in-place update）来对任何状态使用最新的值函数版本。\n\n这实际上会导致更快的收敛。\n\n---\n\n\
  最后一点：\n\n我们通常将为给定策略寻找值函数的过程称为预测问题（prediction problem）。\n\n在本节的稍后部分，我们将学习一种寻找最优策略的算法。这被称为控制问题（control\
  \ problem）。\n\n因此，我们在书中剩余章节中遵循这一模式。\n\n我们将首先研究预测问题以找到给定策略的值函数，然后研究控制问题以找到最优策略。\n\
  \n## 代码中的网格世界 (Gridworld)\n\n在本节中，我们将用代码实现网格世界。这是课程中所有后续脚本所需要的，因此你现在需要理解它。\n\n本节的相关文件是\
  \ `grid_world.py`。\n\n```python\nimport numpy as np\n\nclass Grid: # 环境\n    def\
  \ __init__(self, width, height, start):\n        self.width = width\n        self.height\
  \ = height\n        self.i = start[0]\n        self.j = start[1]\n\n    def set(self,\
  \ rewards, actions):\n        # rewards 应该是一个字典: (i, j): r (行, 列): 奖励\n        #\
  \ actions 应该是一个字典: (i, j): A (行, 列): 可能动作的列表\n        self.rewards = rewards\n \
  \       self.actions = actions\n```\n\n构造函数接收宽度、高度和起始位置。起始位置应该是包含两个整数的元组，当前位置将存储在实例变量\
  \ `i` 和 `j` 中。\n\n接下来我们有一个设置器，可以同时设置环境的奖励和动作。\n\n明确的是，动作列出了所有能带你进入新状态的可能动作。\n\n\
  例如，如果你上方有一堵墙，你可以执行“向上”动作，但你实际上并不会“向上”，因为这不会出现在动作字典中。`Grid` 类将简单忽略它。\n\n因此，奖励和动作都将字典，键是状态的\
  \ `(i, j)` 坐标，值是奖励或可能的动作列表。\n\n```python\ndef set_state(self, s):\n    self.i =\
  \ s[0]\n    self.j = s[1]\n```\n\n接下来是 `set_state` 函数。它对于我们之后使用的各种算法都是用的。\n\n```python\n\
  def current_state(self):\n    return (self.i, self.j)\n```\n\n接下来是 `current_state()`\
  \ 函数。它告诉我们智能体的 `(i, j)` 位置。\n\n```python\ndef is_terminal(self, s):\n    return\
  \ s not in self.actions\n```\n\n接下来是 `is_terminal` 函数。它对于我们之后使用的各种算法都是用的。\n\n```python\n\
  def move(self, action):\n    # ... 实现细节 ...\n    pass\n```\n\n---\n\n```python\n\
  def game_over(self):\n    # 如果游戏结束返回 true，否则返回 false\n    # 如果我们处于一个没有可用动作的状态，返回\
  \ true\n    return (self.i, self.j) not in self.actions\n```\n\n---\n\n```python\n\
  def all_states(self):\n    # 一个可能有 bug 但简单的获取所有状态的方法\n    # 状态是具有可能后续动作的位置\n   \
  \ # 或者是产生奖励的位置\n    return set(self.actions.keys() + self.rewards.keys())\n```\n\
  \n---\n\n```python\ndef standard_grid():\n    # 定义一个描述到达每个状态的奖励的网格\n    # 以及每个状态下可能的动作\n\
  \    # 网格看起来如下\n    # x 意味着你不能去那里\n    # s 意味着起始位置\n    # 数字意味着该状态的奖励\n    # . .\
  \ . 1\n    # . x . -1\n```\n\n---\n\n\n\n\n## s . . .\n\n```python\ng = Grid(3,\
  \ 4, (2, 0))\nrewards = {(0, 3): 1, (1, 3): -1}\nactions = {\n    (0, 0): ('D',\
  \ 'R'),\n    (0, 1): ('L', 'R'),\n    (0, 2): ('L', 'D', 'R'),\n    (1, 0): ('U',\
  \ 'D'),\n    (1, 2): ('U', 'D', 'R'),\n    (2, 0): ('U', 'R'),\n    (2, 1): ('L',\
  \ 'R'),\n    (2, 2): ('L', 'R', 'U'),\n    (2, 3): ('L', 'U'),\n}\ng.set(rewards,\
  \ actions)\nreturn g\n```\n\n这是一个具有我之前展示给过的奖励结构的网格，右上角是 +1 奖励，下方是 -1 奖励，这两个者都是终止状态。\n\
  \n所有动作的定义使得我们可以在网格内移动，但永远不会离开。我们也不能撞墙墙，更不能离开终止状态。\n\n---\n\n接下来我们来看 `negative_grid`\
  \ 函数。其背后的思想是我们想要惩罚每一次移动。\n\n```python\ndef negative_grid(step_cost=-0.1):\n    #\
  \ 在这个游戏中，我们想要尽量减少移动步数\n    # 因此我们将惩罚每一次移动\n    g = standard_grid()\n    g.rewards.update({\n\
  \        (0, 0): step_cost,\n        (0, 1): step_cost,\n        (0, 2): step_cost,\n\
  \        (1, 0): step_cost,\n        (1, 2): step_cost,\n        (2, 0): step_cost,\n\
  \        (2, 1): step_cost,\n        (2, 2): step_cost,\n        (2, 3): step_cost,\n\
  \    })\n    return g\n```\n\n回想一下我们之前讨论过解决迷宫。我们说过，一个只会随机移动的机器人最终会解决迷宫，如果你只在解决迷宫时给它奖励，那么它永远学不到随机策略之外的任何东西。\n\
  \n我们学到，通过对每一步移动给予负奖励，我们可以激励机器人更高效地解决迷宫。\n\n这就是我们在这里所做的。我们激励机器人高效地解决迷宫，而不是随机移动直到碰到目标。\n\
  \n你将在代码示例中看到这 2 种奖励结构如何影响智能体最终学习到的策略。\n\n## 代码中的迭代策略评估\n\n在这一节中，我们将在代码中实现迭代策略评估。\n\
  \n为了演示我们如何找到不同策略的价值函数，我们将对 2 种不同的策略进行迭代策略评估。\n\n我们将看到的第一个策略是完全随机的策略。\n\n记住，贝尔曼方程中涉及\
  \ 2 个概率分布，一个是 `pi(a | s)`，另一个是马尔可夫状态转移概率 `p(s’, r | s, a)`。\n\n你认为哪一个与实现贝尔曼方程有关？\n\
  \n---\n\n答案是 `pi(a | s)`。这是当我处于状态 `s` 时，执行动作 `a` 的概率。\n\n对于均匀随机策略，该概率将是 `1 / 状态\
  \ s 的所有可能动作数`。\n\n另一个概率 `p(s’, r | s, a)` 仅在状态转移本身是随机时才相关。\n\n那种情况是，你尝试向左移动，结果却向右移动了。\n\
  \n---\n\n我们将看到的第二个策略是完全确定的策略。为了方便起见，我把它粘贴在这里：\n\n```\n---------------------------\n\
  R | R | R |\n---------------------------\nU | R |\n---------------------------\n\
  U | R | U |\n---------------------------\n```\n\n从起始位置开始，你直接走向目标状态。然而，如果你从任何其他状态开始，策略是直接走向失败状态。\n\
  \n因此，我们应该期望左上路径的值为正，而其他状态的值为负。\n\n现在来看代码。\n\n\n\n\n```python\nbiggest_change = 0\n\
  for s in states:\n    old_v = V[s]\n    # V(s) 只有在不是终点状态时才有值\n    if s in policy:\n\
  \        a = policy[s]\n        grid.set_state(s)\n        r = grid.move(a)\n  \
  \      V[s] = r + gamma * V[grid.current_state()]\n        biggest_change = max(biggest_change,\
  \ np.abs(old_v - V[s]))\n    if biggest_change < SMALL_ENOUGH:\n        break\n\
  \    print \"values for fixed policy:\"\n    print_values(V, grid)\n```\n\n循环的其余部分相同，当完成后，我们再次打印值。\n\
  \n---\n\n### 结果\n\n`均匀随机动作的值:`\n```\n---------------------------\n-0.03| 0.09| 0.22|\
  \ 0.00|\n---------------------------\n-0.16| 0.00| -0.44| 0.00|\n---------------------------\n\
  -0.29| -0.41| -0.54| -0.77|\n---------------------------\nR | R | R | |\n---------------------------\n\
  U | | R | |\n---------------------------\nU | R | R | U |\n```\n\n`固定策略的值:`\n```\n\
  ---------------------------\n0.81| 0.90| 1.00| 0.00|\n---------------------------\n\
  0.73| 0.00| -1.00| 0.00|\n---------------------------\n0.66| -0.81| -0.90| -1.00|\n\
  ```\n\n所以你可以看到，均匀随机策略的大部分值都是负数。这是因为如果你随机移动，有很大机会最终落入失败状态。\n\n记住，你有两种方式可以进入失败状态，但只有一种方式可以进入目标状态。\n\
  \n最负的值位于失败状态正下方的状态，这是符合逻辑的。\n\n现在对于固定策略和折扣因子 `0.9`，我们看到了预期的结果。距离终点状态越远，值就越小，且每次减少恰好\
  \ 10%。因此 `0.81` 是 `0.9*0.9`，`0.73` 是 `0.81*0.9`，依此类推。\n\n## 策略改进\n\n在这节课程中，我们将开始讨论控制问题，换句话说，如何找到更好的策略并最终获得最优策略。\n\
  \n到目前为止，我们知道如何在给定固定策略的情况下找到值函数。\n\n让我们再次看一遍 `Q` 的递归定义。\n\n`Q(s,a) = sum[s’,r]{ p(s’,r\
  \ | s,a)(r+V(s’)) }`\n\n这告诉我们使用策略 `pi` 时在状态 `s` 执行动作 `a` 的值。\n\n---\n\n使用当前策略，我们简单地获得当前的状态值函数。\n\
  `V(s) = Q(s, pi) = sum[s’,r]{ p(s’,r | s, pi)(r+V(s’)) }`\n\n但假设我们只想改变策略中的一个动作。我们可以这样做吗？\n\
  \n---\n\n我们有一个有限的动作集合，所以我们只需要选择一个比 `pi(s)` 提供更大 `Q` 的动作即可：`find a in A s.t. Q(s,a)\
  \ > Q(s, pi)`。\n\n这就是所有编程变得非常实用的地方。这看起来像是一个非常抽象的方程，但它的意思是，如果“向上”的策略、让我们看看“向右”或“向下”带给我们更大的\
  \ `Q`。如果是这样，我们就改变该状态的策略。\n\n---\n\n从正式地说，当我们为该状态选择新动作时，我们是在寻找一个新的策略 `pi’`，它对该状态的值比\
  \ `pi` 大。\n`pi <= pi’ --> V(s | pi) <= V’(s | pi’)`\n`pi’(s) = argmax[a]{ Q(s,a)\
  \ }`\n`pi’(s) = argmax[a]{ sum[s’,r]{ p(s’,r | s,a)(r+V(s’)) }}`\n\n我们只需要选择一个能提供最大\
  \ `Q` 的动作。注意我们可以将其写成使用 `Q` 的形式，或者写成对 `V` 进行前瞻查找的形式。\n\n---\n\n关于策略改进，有两点你应该注意：\n\
  \n第一，注意它是贪婪的。我们根本没有考虑所有状态的值函数。我们只看当前状态并根据值函数选择最佳动作。\n\n第二，注意它使用了一个不完美的值函数。一旦我们改变了\
  \ `pi`，`V(s)` 就会改变。你将在随后的章节中看到为什么这不是一个问题。\n\n你可能有一个问题是，我们如何知道何时完成了策略改进？当我们找到最优策略时，策略将不再随值函数发生改变。此外，值函数将不再改进，它将保持恒定。注意我们之前使用的不等式是“小于或等于”。在这种情况下，如果它是“相等”，说明我们找到了最优策略。\n\
  \n## 策略迭代\n\n在本节课程中，我们将讨论用于找到最优策略的算法。具体来说，当我们改变策略时，值函数也会改变。\n\n---\n\n当我们改变策略且值函数过时时该怎么办？我们只需要简单地重新计算值函数。幸运的是我们已经知道如何这样做，因为我们在上节写过了。在层面，算法非常简单：我们在策略评估和策略改进之间交替，直到策略不再变化。\n\
  \n在伪代码中，策略迭代看起来如下：\n\n第一步是随机初始化 `V(s)` 和策略 `pi`。\n`V(s) = random, pi(s) = random`\n\
  \n第二步执行迭代策略评估以找到当前的 `V(s)`。\n`V(s) = iterative_policy_evaluation(pi) # 我们之前写过了`\n\
  \n第三步是执行策略改进，我们将更详细地写在这里，因为你之前没见过。\n\n```python\npolicy_changed = False\nfor s in\
  \ all_states:\n    old_a = policy(s)\n    policy(s) = argmax[a]{ sum[s’,r]{ p(s’,r\
  \ | s,a)[r + gamma*V(s')} } }\n    if policy(s) != old_a: policy_changed = True\n\
  if policy_changed: 回到第二步\n```\n\n## 代码中的策略迭代\n\n在本节中，我们将在代码中实现策略迭代。如果你不想尝试自己编写（尽管我强烈建议你这样做），课程库中的相关文件是\
  \ `policy_iteration.py`。\n\n我们从通常的导入开始。从 `grid_world` 我们导入标准网格和负网格。\n\n```python\n\
  import numpy as np\nfrom grid_world import standard_grid, negative_grid\nfrom iterative_policy_evaluation\
  \ import print_values, print_policy\n```\n\n我们将使用负网格，但鼓励你尝试标准网格，看看智能体是否能找到良好的策略。\n\
  \n\n\n\n接下来，我们打印奖励，这样你就能记住它们是什么样子的。注意，我们可以直接使用 `print_values` 函数来完成这一点，因为它会打印任何以位置为键、以数值为值的字典。\n\
  \n```\nprint \"rewards:\"\nprint_values(grid.rewards, grid)\n```\n\n接下来，我们创建一个确定性的随机策略。我们只是为每个状态从所有可能的动作中随机选择一个动作。\n\
  \n```python\npolicy = {}\nfor s in grid.actions.keys():\n    policy[s] = np.random.choice(ALL_POSSIBLE_ACTIONS)\n\
  ```\n\n然后我们打印初始策略，让你知道它看起来是什么样子的。\n\n```python\n## initial policy\nprint \"initial\
  \ policy:\"\nprint_policy(policy, grid)\n```\n\n接下来，我们随机初始化 `V(s)`。我们知道任何终端状态的值都是\
  \ 0，因此我们将这些状态初始化为 0。\n\n```python\n## initialize V(s)\nV = {}\nstates = grid.all_states()\n\
  for s in states:\n    # V[s] = 0\n    if s in grid.actions:\n        V[s] = np.random.random()\n\
  \    else:\n        # terminal state\n        V[s] = 0\n```\n\n接下来，我们进入主循环，它在策略评估和策略改进之间交替。\n\
  \n```python\n## 重直到收敛 - 当策略不再改变时将跳出\nwhile True:\n    # 策略评估步 - 我们已经知道怎么做了！\n  \
  \  while True:\n        biggest_change = 0\n        for s in states:\n         \
  \   old_v = V[s]\n            # 如果 s 不是终端状态，V(s) 就值\n            if s in policy:\n\
  \                a = policy[s]\n                grid.set_state(s)\n            \
  \    r = grid.move(a)\n                V[s] = r + GAMMA * V[grid.current_state()]\n\
  \                biggest_change = max(biggest_change, np.abs(old_v - V[s]))\n  \
  \      if biggest_change < SMALL_ENOUGH:\n            break\n\n    # 策略改进步\n   \
  \ is_policy_converged = True\n    for s in states:\n        if s in policy:\n  \
  \          old_a = policy[s]\n            new_a = None\n            best_value =\
  \ float('-inf')\n            # 遍历所有可能的动作以寻找当前的最佳前瞻值\n            for a in ALL_POSSIBLE_ACTIONS:\n\
  \                grid.set_state(s)\n                r = grid.move(a)\n         \
  \       v = r + GAMMA * V[grid.current_state()]\n                if v > best_value:\n\
  \                    best_value = v\n                    new_a = a\n           \
  \ policy[s] = new_a\n            if new_a != old_a:\n                is_policy_converged\
  \ = False\n    if is_policy_converged:\n        break\n```\n\n第一步当然是策略评估。这和之前的代码完全相同，但注意它是“简单”版本，因为所有的动作、后继状态和奖励都是确定性的。\n\
  \n接下来是策略改进步。我们有一个名为 `is_policy_converged` 的标志位，并将其初始化为 `True`。然后我们遍历所有状态，获取现有的动作并赋值给\
  \ `old_a`。接着我们遍历所有可能的动作来搜索最佳的前瞻值。我们选择产生最佳价值的动作，然后更新我们的策略。如果 `new_a` != `old_a`，我们将\
  \ `is_policy_converged` 设置为 `False`。一旦跳出策略改进循环，我们就检查策略是否发生了变化，如果没有，我们就跳出主循环。最后，我们打印最终的值和最终的策略。\n\
  \n```\nprint \"values:\"\nprint_values(V, grid)\nprint \"policy:\"\nprint_policy(policy,\
  \ grid)\n```\n\n### 结果\n\n**rewards:**\n\n**initial policy:**\n\n**values:**\n\n\
  **policy:**\n\n注意到，如果我们在墙角处，代理会选择向右而不是向左。\n\n## 策略迭代用于风力网格\n\n在本节中，我将向你描述我们对环境的一种修改，称为“风力网格”。回顾一下我们需要处理的概率分布。首先是\
  \ `pi(a | s)`，即状态 `s` 下执行动作 `a` 的概率。然后是状态转移概率 `p(s', r | s, a)`。到目前为止都是确定性的。当我们在状态\
  \ `s` 执行动作 `a` 时，总是进入相同的状态 `s'`。这与奖励也有关，因为 Gridworld 根据你落入的状态来给予奖励。在本节中，我们将考虑这种概率分布不是确定性的情况，换句话说，概率将在\
  \ 0 到 1 之间。\n\n这就是风力网格发挥作用的地方。想象你正在走一条有风的街道。你想直直走，但风会将你向后或向左推。同样的事情会发生在我们的代理身上。代理尝试“向上”，但有时环境会将它推向其他地方。在我们的案例中，我们将预期动作的概率设置为\
  \ `0.5`，将其他 3 个动作的概率设置为 `0.5/3`。我们将再次查看策略迭代的代码，它也包含了策略评估，因为评估已经是主循环的一部分。如果你不想自己写代码（尽管我强烈建议你这样做），本节的相关文件是\
  \ `policy_iteration_random.py`。\n\n顶部的大部分内容都是从初始的 `policy_iteration` 脚本复制的。\n\n\
  ```python\nimport numpy as np\nfrom grid_world import standard_grid, negative_grid\n\
  from iterative_policy_evaluation import print_values, print_policy\n\nSMALL_ENOUGH\
  \ = 10e-4\nGAMMA = 0.9\nALL_POSSIBLE_ACTIONS = ('U', 'D', 'L', 'R')\n\n# 下一个状态和奖励现在会有一些随机性\n\
  ## 你以 0.5 的概率进入预期方向\n## 你以 0.5/3 的概率进入随机方向 a' != a\n\nif __name__ == '__main__':\n\
  \    grid = negative_grid(step_cost=-1.0)\n```\n\n\n\n\n## 重复直到收敛 - 当策略不再变化时跳出\n\
  \n```\nwhile True:\n    # 策略评估步骤 - 我们已经知道怎么做了！\n    while True:\n        biggest_change\
  \ = 0\n        for s in states:\n            old_v = V[s]\n            # V(s) 只有在非终止状态下才有值\n\
  \            new_v = 0\n            if s in policy:\n                for a in ALL_POSSIBLE_ACTIONS:\n\
  \                    if a == policy[s]:\n                        p = 0.5\n     \
  \               else:\n                        p = 0.5/3\n                    grid.set_state(s)\n\
  \                    r = grid.move(a)\n                    new_v += p*(r + GAMMA\
  \ * V[grid.current_state()])\n            V[s] = new_v\n            biggest_change\
  \ = max(biggest_change, np.abs(old_v - V[s]))\n        if biggest_change < SMALL_ENOUGH:\n\
  \            break\n```\n\n记住，策略本身是确定性的。这里有两个我们可以利用的概率，但我们目前只处理的是状态转移。\n\n因此，我们遍历所有可能的动作。如果该动作是策略中的动作，那么它实际发生的概率是\
  \ 0.5。否则，它是 0.5/3。\n\n接下来是策略改进步骤。这与确定性策略迭代脚本非常相似，不同在于我们现在对动作空间增加了一个额外的循环。\n\n```python\n\
  ## 策略改进步骤\nis_policy_converged = True\nfor s in states:\n    if s in policy:\n \
  \       old_a = policy[s]\n        new_a = None\n        best_value = float('-inf')\n\
  \        # 遍历所有可能的动作寻找当前的最佳动作\n        for a in ALL_POSSIBLE_ACTIONS: # 选定的动作\n\
  \            v = 0\n            for a2 in ALL_POSSIBLE_ACTIONS: # 结果动作\n       \
  \         if a == a2:\n                    p = 0.5\n                else:\n    \
  \                p = 0.5/3\n                grid.set_state(s)\n                r\
  \ = grid.move(a2)\n                v += p*(r + GAMMA * V[grid.current_state()])\n\
  \            if v > best_value:\n                best_value = v\n              \
  \  new_a = a\n        policy[s] = new_a\n        if new_a != old_a:\n          \
  \  is_policy_converged = False\nif is_policy_converged:\n    break\n```\n\n再次，实际执行所选动作的概率是\
  \ 0.5，而执行任何其他动作的概率是 0.5/3。\n\n其他部分都相同，我们在最后打印值和最终策略。\n\n---\n\n## 结果：\n\n`rewards:`\n\
  ---------------------------\n-1.00| -1.00| -1.00| 1.00|\n---------------------------\n\
  -1.00| 0.00| -1.00| 1.00|\n---------------------------\n-1.00| -1.00| -1.00| 1.00|\n\
  \n`initial policy:`\n---------------------------\nU | U | D | \n---------------------------\n\
  D | | R | \n---------------------------\nU | U | D | U\n\n`values:`\n---------------------------\n\
  -4.52| -2.95| -0.86| 0.00|\n---------------------------\n-5.57| 0.00| -1.94| 0.00|\n\
  ---------------------------\n-5.76| -4.88| -3.44| -2.17|\n\n`policy:`\n---------------------------\n\
  R | R | R | \n---------------------------\nU | | R | \n---------------------------\n\
  R | R | U | U\n\n注意靠近失败局状态的策略。由于状态转移是随机的，你选择的动作并不总是导致结果的动作，但它仍然具有最高的发生概率。因此，当我们接近失败局状态时，智能体直接尝试去失败会更好，这会结束回合并最大化未来的奖励。\n\
  \n## 价值迭代 (Value Iteration)\n\n在本节中，我们将讨论一种解决控制问题的备选技术，称为价值迭代（value iteration）。记得我们之前学习的技术是策略迭代（policy\
  \ iteration）。很容易把所有这些都搞混，因为所有算法看起来和听起来都一样，所以编写代码绝对会帮助你熟悉针对马尔可夫决策过程（MDP）的各种解决方案。策略迭代的一个缺点是它是迭代算法，因此我们必须等待它收敛。同时，主循环包含两个步骤，而第一步本身也是一个迭代算法，所以你在一个迭代算法内部另一个迭代算法。人们可能会问是否有更高效的方法来解决这个问题。\n\
  \n记得策略评估在 `V` 收敛时结束。一个合理的问题是，在收敛之前是否存在某一个点，使得贪婪策略不再变化？事实上，经验研究表明，在仅进行几次策略评估后，得到的贪婪策略就是恒定的。这告诉我们，当我们在执行策略迭代时，我们实际上不需要等待策略评估收敛，只需要执行几步然后跳出，因为策略改进步骤在额外的策略评估迭代下会找到相同的策略。\n\
  \n然而，我们在本讲座中学习的算法又进了一步。它被称为价值迭代。它的作用是将策略评估和策略改进步骤合并为一步。它执行的是：`Vk+1 = max[a]{sum[s',\
  \ r]{p(s', r | s, a)(r + Vk)}`。它的有趣之处在于，它看起来和我们见过的公式几乎完全一样。事实上，如果你没留神，它看起来和我们见过的公式一模一样。这就是为什么我一直在说编写代码来尝试理解差异是非常重要的。你需要仔细观察这个，以查看它与我们过的其他贝尔曼方程的区别。这个方程与策略评估方程非常相似，只是我们对所有可能的动作取\
  \ `max`。\n\n从 `k` 索引可以看出，它也是迭代的。类似于策略评估，我们并不真的需要等待整个 `k` 次迭代的 `V` 可用后再开始计算 `(k+1)`\
  \ 次迭代的 `V`。我们可以直接“就地”更新它。注意它是如何在一个步内完成策略评估和策略改进的。这是因为策略改进是通过对右侧表达式取 `ARGMAX` 来实现的。所以通过直接取\
  \ `max`，我们实际上是在执行如果我们取了 `argmax` 时会选择的策略的评估步骤。\n\n让我们把这些都写成伪代码，这样你就有机会看一看。第一步是任意初始化\
  \ `V`。这可以是随机数或全为 0，这并不重要。然后我们进入一个无限循环。和策略评估一样，我们跟踪最大的变化，并在最大变化低于某个阈值时跳出循环，这表示收敛。这种方法与策略评估之间的唯一区别在于，我们对右侧的贝尔曼方程对所有动作取\
  \ `max`。在我们收敛后，通过对每个 `V(s)` 取 `argmax` 来输出策略 `pi(s)`。\n\n```\ninitialize V(s) =\
  \ 0 for all s in S\nwhile True:\n    delta = 0\n    for each s in S:\n        old_v\
  \ = V[s]\n        V(s) = max[a]{sum[s', r]{p(s', r | s, a)(r + V(s'))}}\n      \
  \  delta = max(delta, |V(s) - old_v|)\n    if delta < threshold:\n        break\n\
  for each s in S:\n    pi(s) = argmax[a]{sum[s', r]{p(s', r | s, a)(r + V(s'))}}\n\
  ```\n\n\n\n\n\n# 打印奖励\n\n```python\nprint \"rewards:\"\nprint_values(grid.rewards,\
  \ grid)\n```\n\n## 状态 -> 动作\n#我们将随机选择一个动作并在学习过程中进行更新\n```python\npolicy = {}\nfor\
  \ s in grid.actions.keys():\n    policy[s] = np.random.choice(ALL_POSSIBLE_ACTIONS)\n\
  ```\n\n## 初始策略\n```python\nprint \"initial policy:\"\nprint_policy(policy, grid)\n\
  ```\n\n## 初始化 V(s)\n```python\nV = {}\nstates = grid.all_states()\nfor s in states:\n\
  \    # V[s] = 0\n    if s in grid.actions:\n        V[s] = np.random.random()\n\
  \    else:\n        # 终止状态\n        V[s] = 0\n```\n\n与之前的操作相同，我们获取负值奖励网格，打印奖励以便你了解它们是什么，并初始化一个随机策略。\n\
  \n我们打印初始的随机策略，以便你了解它的内容。\n\n我们随机初始化 `V(s)`。\n\n接下来是值迭代循环。它看起来与策略评估非常相似，不同在于我们现在正在遍历所有可能的动作并取最大值。\n\
  \n```python\nwhile True:\n    biggest_change = 0\n    for s in states:\n       \
  \ old_v = V[s]\n\n        # V(s) 只有在不是终止状态时才有值\n        if s in policy:\n      \
  \      new_v = float('-inf')\n            for a in ALL_POSSIBLE_ACTIONS:\n     \
  \           grid.set_state(s)\n                r = grid.move(a)\n              \
  \  v = r + GAMMA * V[grid.current_state()]\n                if v > new_v:\n    \
  \                new_v = v\n            V[s] = new_v\n            biggest_change\
  \ = max(biggest_change, np.abs(old_v - V[s]))\n\n    if biggest_change < SMALL_ENOUGH:\n\
  \        break\n```\n\n当 `biggest_change` 低于 `small_enough` 阈值时跳出循环。\n\n接下来，我们获取最优值函数并找到最优策略。记住，这只是\
  \ `argmax` 操作。\n\n## 寻找导致最优值函数的策略\n```python\nfor s in policy.keys():\n    best_a\
  \ = None\n    best_value = float('-inf')\n    # 遍历所有可能的动作以找到当前的最佳动作\n    for a in\
  \ ALL_POSSIBLE_ACTIONS:\n        grid.set_state(s)\n        r = grid.move(a)\n \
  \       v = r + GAMMA * V[grid.current_state()]\n        if v > best_value:\n  \
  \          best_value = v\n            best_a = a\n    policy[s] = best_a\n```\n\
  \n因此我们遍历所有的动作，并找到能带来最好未来奖励的动作。\n\n```python\nprint \"values:\"\nprint_values(V,\
  \ grid)\nprint \"policy:\"\nprint_policy(policy, grid)\n```\n\n最后，我们打印值并打印最终策略。\n\
  \n\n\n\n在本节中，我们将重点关注蒙特卡洛方法，我们将按照游戏设计的初衷来玩，并纯粹从经验中学习。\n\n---\n\n“蒙特卡洛”是一个定义相当模糊的术语。它通常指的是任何包含显著随机成分的算法。\n\
  \n在强化学习（RL）的蒙特卡洛方法中，随机成分是回报（return）。\n\n记住，我们始终寻找的是给定状态 `s` 时的期望回报。\n\n在蒙特卡洛方法中，我们不是计算需要概率分布的真实期望值，而是取样本平均值。\n\
  \n例如：\n\n`E(X) ~= sum[i=1..N]{ X(i) } / N`\n\n为了让这种方法生效，我们需要假设我们只处理回合式任务（episodic\
  \ tasks）。\n\n这是因为在计算任何回报之前，回合必须结束。\n\n这也意味着蒙特卡洛方法不是“完全”的在线算法（诸如多臂老虎机问题）。我们不会在每个动作后都进行更新，而是在每个回合结束后进行更新。\n\
  \n---\n\n我们在蒙特卡洛章节使用的方法应该会让人联想起多臂老虎机问题。\n\n在多臂老虎机问题中，我们总是在每个动作后对奖励取平均。\n\n在马尔可夫决策过程（MDP）中，我们总是对回报取平均。\n\
  \n思考蒙特卡洛的一种方式：每个状态都是一个独立的多臂老虎机问题，我们正在试图同时学习针对所有多臂老虎机问题的最优行为。\n\n---\n\n在本章中，我们将再次遵循动态规划章节中的相同模式。\n\
  \n我们将首先从预测问题开始，换句话说，如何进行策略评估。\n\n然后我们将研究控制问题，换句话说，如何找到最优策略。\n\n## 状态价值函数的蒙特卡洛预测\n\
  \n在本节中，我们将使用蒙特卡洛估计来解决预测问题。\n\n记住，价值函数的定义是：给定当前状态为 `s` 时，未来回报的期望值。\n\n`V(s) = E[G(t)\
  \ | S(t)=s]`\n\n我们知道可以通过累加样本并除以样本总数简单地估计任何期望值。\n\n`V(s) = (1/N) sum[i=1..N]{ G(i,\
  \ s) }`\n\n在这个方程中，`i` 是回合的索引，`s` 是状态的索引。\n\n问题是，我们如何获得这些采样的回报？\n\n---\n\n答案是，我们只需要玩很多回合并生成它们。\n\
  \n对于你运行的每一个回合，你将获得一个状态和奖励序列。\n\n`s1 s2 s3 … sT`\n\n`r1 r2 r3 … rT`\n\n`g(t) = r(t+1)\
  \ + gamma*g(t+1)`\n\n根据定义，我们可以从奖励中计算回报，它只是所有未来奖励的总和。\n\n注意，在代码中实际实现这一点时，反序遍历状态和奖励将非常有用，因为\
  \ `G` 只依赖于未来值。\n\n一旦我们对许多回合执行了此操作，我们就会有多个 `s` 和 `G` 的列表，然后我们可以取样本平均值。\n\n\n\n\n\
  如果你不想尝试自己编写代码（尽管我强烈建议你这样做），那么本课程相关的文件是 `monte_carlo.py`。\n\n在开头处我们有了常规的导入。我们导入了\
  \ `standard_grid` 和 `negative_grid`，我鼓励你尝试这两种。我们还使用了之前定义的 `print_values` 和 `print_policy`\
  \ 函数。\n\n我们也有通常的常数。\n\n```python\nimport numpy as np\nfrom grid_world import standard_grid,\
  \ negative_grid\nfrom iterative_policy_evaluation import print_values, print_policy\n\
  \nSMALL_ENOUGH = 10e-4\nGAMMA = 0.9\nALL_POSSIBLE_ACTIONS = ('U', 'D', 'L', 'R')\n\
  ```\n\n接下来我们定义了 `play_game` 函数，它接收一个网格和一个策略。\n\n```python\ndef play_game(grid, policy):\n\
  \    # 返回状态列表和对应的回报列表\n\n    # 重置游戏以从随机位置开始\n    # 我们需要这样做，因为在我们当前的确定性策略下，\n   \
  \ # 我们永远无法到达某些状态，但我们仍然想测量它们的价值\n    start_states = grid.actions.keys()\n    start_idx\
  \ = np.random.choice(len(start_states))\n    grid.set_state(start_states[start_idx])\n\
  \n    s = grid.current_state()\n    states_and_rewards = [(s, 0)] # (state, reward)\
  \ 元组列表\n    while not grid.game_over():\n        a = policy[s]\n        r = grid.move(a)\n\
  \        s = grid.current_state()\n        states_and_rewards.append((s, r))\n \
  \   # 从终止状态反向计算回报\n    G = 0\n    states_and_returns = []\n    first = True\n  \
  \  for s, r in reversed(states_and_rewards):\n        # 根据定义，终止状态的价值为 0\n      \
  \  # 我们应该忽略遇到的第一个状态\n        # 并忽略最后一个 G，因为它是没有意义的，不对应于任何移动\n        if first:\n\
  \            first = False\n        else:\n            states_and_returns.append((s,\
  \ G))\n        G = r + GAMMA*G\n    states_and_returns.reverse() # 我们希望它按照访问状态的顺序排列\n\
  \    return states_and_returns\n```\n\n我们的策略与我们之前使用的同一个，即一直采取左上方的路径到达目标状态。对于不在该路径上的任何状态，则通向失败状态。\n\
  \n由于蒙特卡洛方法只计算实际访问过的状态的价值，如果我们只从指定的起始状态开始，那么将有一些状态是我们永远不会访问的，因此在 `play_game` 的开头我们需要这个小技巧，允许我们从任何状态开始游戏。这被称为“探索性开始”（exploring\
  \ starts）方法，我们稍后会讨论。\n\n接下来，我们运行游戏。这和我之前展示给你的伪代码几乎相同。这里的目标是创建一个访问过的所有状态以及我们获得的奖励列表。\n\
  \n接下来，我们计算每个状态的回报。这和我之前展示给你的伪代码完全一样。我们反向访问每个状态，并递归地计算回报。\n\n最后，我们反转回报列表，因为我们执行的是“首次访问”蒙特卡洛方法，我们希望它是按时间顺序排列的。\n\
  \n---\n\n接下来我们进入主部分。\n\n```python\nif __name__ == '__main__':\n    # 再次使用标准网格（每一步均为\
  \ 0）以便与\n    # 迭代策略评估进行比较\n    grid = standard_grid()\n\n    # 打印奖励\n    print \"\
  rewards:\"\n    print_values(grid)\n\n    # 策略状态 -> 动作\n    policy = {\n       \
  \ (2, 0): 'U',\n        (1, 0): 'U',\n        (0, 0): 'R',\n        (0, 1): 'R',\n\
  \        (0, 2): 'R',\n        (1, 2): 'R',\n        (2, 1): 'R',\n        (2, 2):\
  \ 'R',\n        (2, 3): 'U',\n    }\n\n    # 初始化 V(s) 和 returns\n    V = {}\n  \
  \  returns = {} # 状态对应的回报列表字典\n    states = grid.all_states()\n    for s in states:\n\
  \        if s in grid.actions:\n            returns[s] = []\n        else:\n   \
  \         # 终止状态或无法到达的状态\n            V[s] = 0\n```\n\n首先我们要获取网格，打印奖励并创建策略。接下来我们初始化回报。注意我们不需要为终止状态设置价值，因为我们知道它们将是\
  \ 0。我们也不需要为其他状态设置初始值，因为它们会立即被平均回报覆盖。\n\n---\n\n接下来是我们的蒙特卡洛循环。它运行游戏并获取状态和回报列表。\n\n\
  ```python\n## 重复\nfor t in xrange(100):\n    # 使用 pi 生成回合\n    states_and_returns\
  \ = play_game(grid, policy)\n    seen_states = set()\n    for s, G in states_and_returns:\n\
  \        # 检查 s 是否已经见过\n        # 调用“首次访问”MC 策略评估\n        if s not in seen_states:\n\
  \            returns[s].append(G)\n            V[s] = np.mean(returns[s])\n    \
  \    seen_states.add(s)\n```\n\n接下来，我们创建一个集合来跟踪我们访问过的状态，因为我们只在在该回合中首次看到该状态时才添加回报。接下来，我们遍历所有的状态和回报。如果这是我们第一次看到该状态，我们将\
  \ `G` 添加到该状态的回报列表中。然后我们重新计算 `V(s)`。注意我们没有对计算平均值做任何特殊处理，只是使用了默认定义。\n\n然后我们将“s”添加到状态。在脚本结束处，我们打印价值和策略。\n\
  \n```python\nprint \"values:\"\nprint_values(V, grid)\nprint \"policy:\"\nprint_policy(policy,\
  \ grid)\n```\n\n\n\n\n接下来是 `play_game` 函数。请注意这与之前完全相同，不同之处在于我们不再使用策略选择的动作，而是让“风”可能选择另一个动作。\n\
  \n```python\ndef play_game(grid, policy):\n    # 返回状态列表和对应的回报列表\n\n    # 重置游戏从随机位置开始\n\
  \    # 我们需要这样做，因为根据我们给定的确定性策略\n    # 我们永远无法到达某些状态，但我们仍然想测量它们的价值\n    start_states\
  \ = grid.actions.keys()\n    start_idx = np.random.choice(len(start_states))\n \
  \   grid.set_state(start_states[start_idx])\n\n    s = grid.current_state()\n  \
  \  states_and_rewards = [(s, 0)] # (state, reward) 的元组列表\n    while not grid.game_over():\n\
  \        a = policy[s]\n        a = random_action(a)\n        r = grid.move(a)\n\
  \        s = grid.current_state()\n        states_and_rewards.append((s, r))\n \
  \   # 从终端状态开始反向计算回报\n    G = 0\n    states_and_returns = []\n    first = True\n\
  \    for s, r in reversed(states_and_rewards):\n        # 根据定义，终端状态的价值为 0\n    \
  \    # 我们应该忽略遇到的第一个状态\n        # 并忽略最后一个 G，它是没有意义的，因为它不对应于任何动作\n        if first:\n\
  \            first = False\n        else:\n            states_and_returns.append((s,\
  \ G))\n        G = r + GAMMA*G\n    states_and_returns.reverse() # 我们希望按照访问状态的顺序排列\n\
  \    return states_and_returns\n```\n\n---\n\n接下来我们进入主部分。我们仍然使用之前相同的网格和奖励。\n\n不同之处在于策略。特别是，无论我们处于什么状态，我们总是尝试到达目标。如果我们发现自己处于墙下，我们会选择向左走，这样就可以通过左上路线到达目标。\n\
  \n```python\nif __name__ == '__main__':\n    # 再次使用标准网格（每步为 0），以便与\n    # 迭代策略评估进行比较\n\
  \    grid = standard_grid()\n\n    # 打印奖励\n    print \"rewards:\"\n    print_values(grid.rewards,\
  \ grid)\n\n    # state -> action\n    # 通过在 standard_grid 上运行 policy_iteration_random\
  \ 得到\n    # MC 方法不会完全得到这个，但应该很接近\n    # values:\n    # ---------------------------\n\
  \    # 0.43| 0.56| 0.72| 0.00|\n    # ---------------------------\n    # 0.33| 0.00|\
  \ 0.21| 0.00|\n    # ---------------------------\n    # 0.25| 0.18| 0.11| -0.17|\n\
  \    # policy:\n    # ---------------------------\n    # R | R | R | |\n    # ---------------------------\n\
  \    # U | | U | |\n    # ---------------------------\n    # U | L | U | L |\n \
  \   policy = {\n        (2, 0): 'U',\n        (1, 0): 'U',\n        (0, 0): 'R',\n\
  \        (0, 1): 'R',\n        (0, 2): 'R',\n        (1, 2): 'U',\n        (2, 1):\
  \ 'L',\n        (2, 2): 'U',\n        (2, 3): 'L',\n    }\n```\n\n注意，我在注释中添加了通过策略迭代得到的答案。这就是这些算法的伟大之处——你可以使用它们来相互进行合理性检查（sanity\
  \ check）。\n\n我们期望蒙特卡洛方法会得到非常接近这个答案，但不会完全相同。\n\n---\n\n注意在那之后的一切内容都是那样的。蒙特卡洛算法\n\n\
  \n\n接下来，我们将按照当前策略从该起始位置生成一个回合（episode）。\n\n由此，我们将得到一个包含状态、动作和回报的三元组列表。\n\n我们将这些内容添加到以状态-动作对为键的回报字典中。\n\
  \n接下来，我们将重新计算 `Q(s,a)`，它是该状态-动作对所有回报的平均值。\n\n接下来，我们执行策略改进步骤，即分配 `Q` 的 `argmax` 动作。\n\
  \n---\n\n这个算法存在一个微妙的问题。\n\n记住，如果我们执行的动作导致我们撞到墙，我们最终会停在之前的同一个状态。\n\n所以，如果我们遵循这个策略，我们将永远无法到达终止状态，因此永远无法结束回合。\n\
  \n为了避免这个问题，我们将引入一种“黑操作”（hack）：如果在执行某个动作后我们落在了相同的状态，我们将给它一个为 `-100` 的奖励（这比环境提供的任何其他奖励都低），并结束该回合。\n\
  \n---\n\n有趣的是，这种方法是可以收敛的，尽管我们为 `Q` 平均的回报是针对不同策略的。\n\n直觉上，`Q` 必须收敛，因为如果 `Q` 不是最优的，策略就会改变，而反过来又会导致\
  \ `Q` 的改变。\n\n只有当价值和策略都收敛到最优价值和最优策略时，我们才能实现稳定性。\n\n一个有趣的事实是这从未被正式证明过。\n\n## 代码中的\
  \ MC-ES\n\n在本节中，我们将使用蒙特卡洛探索启动（MC-ES）来解决控制问题，即寻找最优策略和最优价值函数。\n\n如果你不想自己写（尽管我强烈建议这样做），相关文件是\
  \ `monte_carlo_es.py`。\n\n我们从标准的导入和常量开始。\n\n```python\nimport numpy as np\nimport\
  \ matplotlib.pyplot as plt\nfrom grid_world import standard_grid, negative_grid\n\
  from iterative_policy_evaluation import print_values, print_policy\n\nGAMMA = 0.9\n\
  ALL_POSSIBLE_ACTIONS = ('U', 'D', 'L', 'R')\n```\n\n接下来是 `play_game` 函数。\n\n```python\n\
  def play_game(grid, policy):\n    # 返回状态和对应回报的列表\n\n    # 重置游戏从随机位置开始\n    # 如果我们有确定性策略，我们需要这样做\n\
  \    # 否则我们永远无法到达某些状态，但我们仍然想测量它们的价值\n    # 这被称为“探索启动”方法\n    start_states = grid.actions.keys()\n\
  \    start_idx = np.random.choice(len(start_states))\n    grid.set_state(start_states[start_idx])\n\
  \n    s = grid.current_state()\n    a = np.random.choice(ALL_POSSIBLE_ACTIONS) #\
  \ 第一个动作是均匀随机的\n\n    # 注意计时\n    # 每个三元组为 s(t), a(t), r(t)\n    # 但 r(t) 来自于 s(t-1)\
  \ 取动作 a(t-1) 并落在 s(t)\n    states_actions_rewards = [(s, a, 0)]\n    while True:\n\
  \        old_s = grid.current_state()\n        r = grid.move(a)\n        s = grid.current_state()\n\
  \        if old_s == s:\n            # 使用黑操作以防止我们陷入无限的回合\n            # 重复撞墙\n \
  \           states_actions_rewards.append((s, None, -100))\n            break\n\
  \        elif grid.game_over():\n            states_actions_rewards.append((s, None,\
  \ r))\n            break\n        else:\n            a = policy[s]\n           \
  \ states_actions_rewards.append((s, a, r))\n\n    # 从终止状态反向计算回报\n    G = 0\n   \
  \ states_actions_returns = []\n    first = True\n    for s, a, r in reversed(states_actions_rewards):\n\
  \        # 根据定义，终止状态的价值为 0\n        # 我们应该忽略遇到的第一个状态\n        # 并忽略最后一个 G，它是没有意义的，因为它不对应任何移动\n\
  \        if first:\n            first = False\n        else:\n            states_actions_returns.append((s,\
  \ a, G))\n        G = r + GAMMA*G\n    states_actions_returns.reverse() # 我们希望它按照访问状态的顺序排列\n\
  \    return states_actions_returns\n```\n\n前几行随机选择第一个状态和第一个动作，这在我们进行探索启动时是要求的。\n\
  \n接下来，我们玩游戏。注意我们现在是如何存储状态、动作和回报的三元组的。这里多了一个 `if` 语句，以便如果我们的策略是撞墙，我们将通过一个非常负的奖励跳出循环。\n\
  \n接下来，我们计算回报。这与之前基本相同，只是现在加入了动作。\n\n---\n\n接下来，我们有一个特殊函数，同时对字典执行 `argmax` 和 `max`，我们将用它来存储\
  \ `Q`。\n\n```python\ndef max_dict(d):\n    # 返回字典的 argmax 和最大值\n    max_key = None\n\
  \    max_val = float('-inf')\n    for k, v in d.iteritems():\n        if v > max_val:\n\
  \            max_val = v\n            max_key = k\n    return max_key, max_val\n\
  ```\n\n```python\nif __name__ == '__main__':\n    grid = standard_grid()\n    policy\
  \ = {s: np.random.choice(ALL_POSSIBLE_ACTIONS) for s in grid.actions}\n    returns\
  \ = {s: [] for s in grid.actions}\n\n    for t in range(2000):\n        if t % 1000\
  \ == 0:\n            print t\n\n        # 使用 pi 生成回合\n        biggest_change = 0\n\
  \        states_actions_returns = play_game(grid, policy)\n        seen_action_pairs\
  \ = set()\n\n        for s, a, G in states_actions_returns:\n            # 检查是否已经见过\
  \ s\n            # 称为“首次访问”MC \n            sa = (s, a)\n            if sa not in\
  \ seen_action_pairs:\n                old_q = Q[s][a]\n                returns[sa].append(G)\n\
  \                Q[s][a] = np.mean(returns[sa])\n                biggest_change\
  \ = max(biggest_change, abs(old_q - Q[s][a]))\n            seen_action_pairs.add(sa)\n\
  \n        # 更新策略\n        for s in policy.keys():\n            policy[s] = max_dict(Q[s])[0]\n\
  ```\n（注：提示中的代码片段被中断了，我根据规则格式化了提供的部分。）*\n\n\n\n注意我们也可以通过 `Q` 找到最优状态价值函数，因此我们也这样做并将其打印出来。\n\
  \n```python\nplt.plot(deltas)\nplt.show()\n\nprint \"final policy:\"\nprint_policy(policy,\
  \ grid)\n```\n\n## 寻找 V\n```python\nV = {}\nfor s, Qs in Q.iteritems():\n    V[s]\
  \ = max_dict(Q[s])[1]\n```\n\nprint \"final values:\"\nprint_values(V, grid)\n\n\
  ```\n\n---\n\n结果:\n\n`final policy:`\n`---------------------------`\n`R | R | R\
  \ | |`\n`---------------------------`\n`U | | U | |`\n`---------------------------`\n\
  `R | R | U | L |`\n`final values:`\n`---------------------------`\n`0.62| 0.80|\
  \ 1.00| 0.00|`\n`---------------------------`\n`0.46| 0.00| 0.80| 0.00|`\n`---------------------------`\n\
  `-0.66| 0.15| 0.62| 0.46|`\n\n注意 `deltas` 中出现了几个 100。这是因为我们的初始策略包含了会导致撞墙的动作。\n\n\
  最终策略是合理的，价值函数也是如此。\n\n## 不带探索开始的蒙特卡洛 控制\n\n在本节中，我们将继续讨论用于蒙特卡洛控制的问题。\n\n回一下，我们刚刚看到的方法的一个缺点是，我们需要使用“探索开始”（exploring\
  \ starts）。\n\n我们讨论过，对于任何不在“上帝模式”下运行的游戏，这种方法可能是不可行的。\n\n例如，考虑自动驾驶汽车。列出汽车可能遇到的所有边缘情况是不可能的，即使可能，将汽车放在那些特定状态也需要花费大量精力。\n\
  \n因此，在本次课程中，我们将研究如何在不使用探索开始的情况下使用蒙特卡洛进行控制。\n\n---\n\n回一下我们在本节之前讨论过的，我们在多臂老虎机问题中学到的所有技术都适用于这里。\n\
  \n具体来说，我们要做的是不是遵循贪婪策略，而是遵循 $\\epsilon$-贪婪策略，或任何允许更多探索的方法。\n\n代码的修改应该非常简单。我们只需要移除执行探索开始的部分，而只从官方起始位置开始。\n\
  \n那么，在玩游戏的代码部分，我们不再仅仅遵循贪婪策略，而是有一个很小的概率 `epsilon` 执行随机动作。\n\n---\n\n考虑到达一个不在策略轨迹中的状态的概率是很有趣的。\n\
  \n对于距离起始状态 `K` 步的状态，我们需要在每一步都处于探索模式，并选择到达目标状态所需的动作。\n\n总之，这是：\n\n`p = [ epsilon/|A(s)|\
  \ ] ^ K`\n\n你可以想象这是一个非常小的数字，因此对于距离策略轨迹很远的状态，你需要多次蒙特卡洛迭代才能使这些状态的价值准确。\n\n## 不带 ES\
  \ 的 MC 控制代码\n\n在本节中，我们将使用 $\\epsilon$-贪婪实现蒙特卡洛控制，这样我们就不需要使用探索开始。\n\n如果你不想尝试自己编写代码，尽管我强烈建议你这样做，但课程仓库中的相关文件是\
  \ `monte_carlo_no_es.py`。\n\n我们从之前相同的导入开始，使用之前相同的常量。\n\n```python\nimport numpy\
  \ as np\nimport matplotlib.pyplot as plt\nfrom grid_world import standard_grid,\
  \ negative_grid\nfrom iterative_policy_evaluation import print_values, print_policy\n\
  from monte_carlo_es import max_dict\n```\n\n`GAMMA = 0.9`\n`ALL_POSSIBLE_ACTIONS\
  \ = ('U', 'D', 'L', 'R')`\n\n我们有一个选择随机动作的函数。\n\n注意，如果我们执行 $\\epsilon$-软策略，这个函数会变得简单得多。\n\
  \n```python\ndef random_action(a, eps=0.1):\n    # 以 1 - eps 的概率选择 a\n    # 或者以\
  \ eps 的概率选择其他动作\n    p = np.random.random()\n    if p < (1 - eps):\n        return\
  \ a\n    else:\n        return np.random.choice(ALL_POSSIBLE_ACTIONS)\n```\n\n我在那里留了一些注释，如果你想看一眼这种原始的实现方式。\n\
  \n---\n\n接下来，我们有 `play_game` 函数。\n\n```python\ndef play_game(grid, policy):\n  \
  \  # 返回状态列表及其对应的回报\n    # 在这个版本中，我们不使用“探索开始”方法\n    # 而只从官方起始位置开始\n    # $\\epsilon$-软策略\n\
  \    s = (2, 0)\n    grid.set_state(s)\n    states_rewards = []\n    while True:\n\
  \        a = random_action(policy[s])\n        if grid.game_over():\n          \
  \  states_rewards.append((s, None))\n            break\n        r = grid.move(a)\n\
  \        states_rewards.append((s, r))\n        s = grid.current_state()\n    return\
  \ states_rewards\n```\n\n\n\n\n```python\nbiggest_change = max(biggest_change, np.abs(old_q\
  \ - Q[s][a]))\nseen_state_action_pairs.add(sa)\ndeltas.append(biggest_change)\n\
  ```\n\n# 计算新策略 pi(s) = argmax[a]{ Q(s,a) }\n\n```python\nfor s in policy.keys():\n\
  \    a, _ = max_dict(Q[s])\n    policy[s] = a\n```\n\n最后，我们再次从 `Q` 计算 `V`，并打印最优策略和最优值。\n\
  \n```python\nplt.plot(deltas)\nplt.show()\n```\n\n## 寻找最优状态值函数\n## V(s) = max[a]{\
  \ Q(s,a) }\n```python\nV = {}\nfor s in policy.keys():\n    V[s] = max_dict(Q[s])[1]\n\
  \nprint \"final values:\"\nprint_values(V, grid)\nprint \"final policy:\"\nprint_policy(policy,\
  \ grid)\n```\n\n让我们运行一下看看结果什么。\n\n## MC 总结\n\n在本次课程中，我们将总结在本章中看到过的所有内容。\n\n这一部分完全关于蒙特卡洛（Monte\
  \ Carlo）方法。\n\n在动态规划的最后一部分，我们做了一个奇怪的假设，假设知道所有的状态转移概率且从未真正玩过游戏。因此，我们无法从经验中学习，正如预期强化学习智能体应该做的那样。我们遵循惯模式：首先研究预测问题，然后研究控制问题。\n\
  \n我们在蒙特卡洛中使用的主要技术是价值函数是给定状态的期望回报。我们从概率中知道，期望值可以通过样本平均值来近似。为了使用蒙特卡洛，我们需要生成回合（episodes）并计算每个回合的回报。这给了我们一个状态和回报的对列表。我们对这些回报取平均值以找到每个状态的值。记住，平均回报有两种：“首次访问”（first-visit）和“每次访问”（every-visit）。虽然这两种方法都被证明收敛于相同的结果，但我们使用了首次访问，因为它更简单。\n\
  \n我们看到蒙特卡洛方法可能比动态规划更高效，因为它不需要我们遍历整个状态空间。正因如此，我们可能永远无法获得“完整的”价值函数，但如果其中许多状态永远不会到达，或很少到达，这可能并不重要。也就是说，我们访问某个状态越频繁，该值就越准确。由于蒙特卡洛方法导致每个状态被访问的次数不同，取决于策略，我们使用了探索启动（探索\
  \ starts）来确保每个状态都有足够的数据。\n\n然后我们研究了控制问题。蒙特卡洛的区别在于现在我们需要使用 `Q` 而不是 `V`，以便我们可以对所有动作取\
  \ `argmax`。这是因为我们可以像动态规划中做的那样进行前瞻搜索（look-ahead）。我们看到可以继续使用策略迭代（policy iteration）的思想，我们在动态规划章节中在策略评估和策略改进之间交替进行。我们谈到了蒙特卡洛的一个主要缺点：为了准确，它需要大量的样本，并且必须在循环内部进行，这使得它非常低效。我们采取了与值迭代相同的方法，即每次迭代只进行一次更新。这令人惊讶的是，对于不同的策略，策略是演变的。同样惊讶的是，这从未被正式证明收敛。\n\
  \n蒙特卡洛的一个主要缺点是，我们需要使用探索启动来获得 `Q` 的完整测量。如果我们使用 epsilon 贪婪（epsilon-greedy）而不是探索启动，就不需要了，因为\
  \ epsilon 贪婪允许我们不断探索所有的状态空间。\n\n# 时分学习（Temporal Difference）\n\n## TD 简介\n\n在本节中，我们将学习一种强化学习的第三种技术，称为时分学习（temporal\
  \ difference learning），简称为“TD”。时分学习是强化学习中最重要的技术之一，它结合了前两个章节中动态规划和蒙特卡洛的思想。\n\n你会记得动态规划的一个缺点是它需要环境的完整模型，且从未从经验中学习。另一方面，蒙特卡洛从经验中学习。在蒙特卡洛方法中，我们看到在完成一个回合后才能更新价值函数。另一方面，动态规划使用了自助（bootstrapping），即基于现有估计值进行改进。我们将看到时分学习也使用自助，而且它是完全在线的（fully\
  \ online）。所以我们不需要等待回合结束就可以更新估计值。\n\n在本章中，我们将采取与前两个章节相同的方法。我们首先研究预测问题，或者说给定策略的情况下寻找价值函数。接下来，我们将研究控制问题。与前两个章节类似，我们将探索处理控制问题的两种方法：`SARSA`\
  \ 和 `Q-Learning`，后者最近变得非常流行。\n\n## TD(0) 理论\n\n在本节中，我们将学习如何将时分学习应用于预测问题，或者说寻找价值函数。起初你觉得这个名字很奇怪。为什么名字里是\
  \ 0 而不是其他数字？原因是存在其他的 TD 学习方法，例如 `TD(1)` 以及更通用的 `TD(lambda)`，但这些超出了本书的范围。它们是类似的，但对于理解\
  \ `Q-Learning` 和我们最终想要的近似方法并不是必要的。\n\n那么 `TD(0)`是如何工作的？首先，回想蒙特卡洛。记得蒙特卡洛的缺点是我们需要等待回合结束才能计算回报，因为回报取决于未来的奖励。还记得蒙特卡洛方法是对回报取平均，而且在课程早期我们研究了计算平均值的不同方法。\n\
  \n特别是，让我们看看不需要实际存储所有回报的方法：\n```python\nV(S(t)) = V(S(t)) + alpha*[G(t)-V(t)]\n```\n\
  记得 `alpha` 可以是常数也可以随时间衰减。所以如果我们使用这个公式，它就是计算状态平均回报的另一种方法。\n\n现在记得 `V` 的定义。记得它是给定状态的回报的期望值。但也记得我们可以递归地定义它：\n\
  ```python\nV(s) = E[G(t) | S(t)=s] = E[R(t+1)+gamma*V(S(t+1)) | S(t)=s]\n```\n\n\
  所以，合理的提问是，是否可以使用这个 `V` 的递归定义替换更新方程中的回报？\n```python\nV(S(t)) = V(S(t)) + alpha*[R(t+1)\
  \ + gamma*V(S(t+1)) - V(S(t))]\nV(s) = V(s) + alpha*[r+V(s’)-V(s)]\n```\n我们从中得到\
  \ `TD(0)` 方法。如果你仔细观察，就会发现这是一个完全在线的自助方法。我们现在不再计算完整的回 `G`。相反，我们只是在使用另一个 `V` 估计值，特别是下一个状态的\
  \ `V`。\n\n\n\n\n在蒙特卡洛方法中，随机性来自于每个回合（episode）可能以不同的方式进行。\n\n因此，如果后续所有的状态转移具有某种随机性，那么某个状态的回报（return）将会不同。\n\
  \n在 `TD(0)` 中，我们又有了另一个随机来源。\n\n具体来说，我们甚至不知道回报是多少，因此我们使用 `r + gamma*V(s’)` 来估计回报\
  \ `G`。\n\n---\n\n在本节中，我们学习了为什么时序分差学习（temporal difference learning）与动态规划和蒙特卡洛方法相比都更具优势。\n\
  \n与动态规划不同，我们不需要环境模型。我们从经验中学习，并且只更新我们实际访问过的状态。\n\n与蒙特卡洛方法不同，我们不需要等待回合结束就可以开始学习。这在回合非常长的情况下是有优势的。我们可以在回合进行过程中改进性能，而不需要一直等到等到下一个回合。\n\
  \n它甚至可以用于连续性任务（continuing tasks），即完全没有回合的任务。\n\n## 代码中的 TD(0)\n\n在本节中，我们将用代码实现 `TD(0)`。\n\
  \n如果你不想尝试自己编写代码（尽管我强烈建议你这么做），课程代码库中的相关文件是 `td0_prediction.py`。\n\n我们从标准的导入开始。\n\n\
  ```python\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom grid_world\
  \ import standard_grid, negative_grid\nfrom iterative_policy_evaluation import print_values,\
  \ print_policy\n```\n\n```python\nSMALL_ENOUGH = 10e-4\nGAMMA = 0.9\nALPHA = 0.1\n\
  ALL_POSSIBLE_ACTIONS = ('U', 'D', 'L', 'R')\n```\n\n我们还有通常的那些常量，现在我们还需要一个学习率 `alpha`。\n\
  \n接下来，是 `random_action` 函数。我没有从另一个文件导入它，因为我想把这段注释写在这里。\n\n```python\ndef random_action(a,\
  \ eps=0.1):\n    # 我们将使用 epsilon-soft 来确保所有状态都被访问\n    # 如果你你不这样做会发生什么？即 eps=0\n\
  \    p = np.random.random()\n    if p < (1 - eps):\n        return a\n    else:\n\
  \        return np.random.choice(ALL_POSSIBLE_ACTIONS)\n```\n\n我们在 `TD` 中面临着和蒙特卡洛方法相同的问题。那就是如果我们从不访问某个状态，我们就永远不会更新它的值。\n\
  \n所以，如果我们有一个没有任何任何探索的确定性策略，某些状态将没有值。如果你不在乎这些值，那是没问题的，但我们想在这里添加一些探索来让它更有趣。\n\n---\n\
  \n接下来是 `play_game` 函数。\n\n注意看这比蒙特卡洛版本要简单得多，因为我们不需要计算任何回报。我们做的只是返回一个状态和奖励的列表。\n\n\
  从技术上讲，我们应该在玩游戏时进行更新，这才是在线学习，但为了清晰起见，我想将游戏过程和更新智能体的过程分开。\n\n```python\ndef play_game(grid,\
  \ policy):\n    # 返回状态列表和对应的奖励（不是 MC 中的那种回报）\n    # 从指定的起始状态开始\n    s = (2, 0)\n\
  \    grid.set_state(s)\n    states_and_rewards = [(s, 0)] # (状态, 奖励) 的元组列表\n   \
  \ while not grid.game_over():\n        a = policy[s]\n        a = random_action(a)\n\
  \        r = grid.move(a)\n        s = grid.current_state()\n        states_and_rewards.append((s,\
  \ r))\n    return states_and_rewards\n```\n\n---\n\n接下来，我们进入主部分。\n\n```python\n\
  if __name__ == '__main__':\n    # 使用标准网格（每一步均为 0），以便与\n    # 迭代策略评估进行比较\n    grid\
  \ = standard_grid()\n\n    # 打印奖励\n    print \"rewards:\"\n    print_values(grid.rewards,\
  \ grid)\n\n    # 状态 -> 动作\n    policy = {\n        (2, 0): 'U',\n        (1, 0):\
  \ 'U',\n        (0, 0): 'R',\n        (0, 1): 'R',\n        (0, 2): 'R',\n     \
  \   (1, 2): 'R',\n        (2, 1): 'R',\n        (2, 2): 'R',\n        (2, 3): 'U',\n\
  \    }\n```\n\n我在这里使用了标准网格，所以你可以将其与我们早的脚本进行比较。策略也与我们使用的第一个策略相同。\n\n注意，你不会得到相同的答案，因为之前我们没有使用\
  \ epsilon-greedy 策略。\n\n---\n\n接下来，我们将所有值都初始化为 0。\n\n```python\nV = {}\nstates =\
  \ grid.all_states()\nfor s in states:\n    V[s] = 0\n```\n\n之后，是我们的主循环。\n\n```python\n\
  ## 重复直到收敛\nfor it in xrange(1000):\n    # 使用 pi 生成一个回合\n    states_and_rewards =\
  \ play_game(grid, policy)\n    # 第一个 (s, r) 元组是我们开始的状态，且奖励为 0\n    # （因为只是开始游戏，没有获得奖励）\n\
  \    # 最后一个 (s, r) 元组是终止状态和奖励\n    # 终止状态的值定义为 0，所以我们不需要\n    # 更新它。\n    for t\
  \ in xrange(len(states_and_rewards) - 1):\n        s, _ = states_and_rewards[t]\n\
  \        s2, r = states_and_rewards[t+1]\n        # 在体验回合时更新 V(s)\n        V[s]\
  \ = V[s] + ALPHA*(r + GAMMA*V[s2] - V[s])\n```\n\n注意，尽管我们可以在玩游戏时内联更新，但我决定不这样做，因为把更新和游戏过程交织在一起会让代码很混乱。\n\
  \n因此，一旦我们有了状态和奖励列表，我们就遍历它们并执行 `TD(0)` 更新，公式是相同的。\n\n最后，我们打印值。\n\n```python\nprint\
  \ \"values:\"\nprint_values(V, grid)\nprint \"policy:\"\nprint_policy(V, grid)\n\
  ```\n\n## SARSA \n\n在 SARSA 中，我们需要知道状态 `s` 下所有动作 `a` 的 `Q(s,a)`，以便准确选择 argmax。\n\
  \n由于更新依赖于知道五元组 `(s,a,r,s’,a’`，这种方法被命名 SARSA。\n\n---\n\n由于 SARSA 需要知道状态 `s` 下所有动作\
  \ `a` 的 `Q(s,a)`，我们面临着与蒙特卡洛方法相同的问题。\n\n回想一下问题在于：如果你遵循确定性策略，只会执行 `1/|A|` 的可能动作，这会导致大部分\
  \ `Q` 未定义。\n\n所以为了解决这个问题，我们要么使用探索启动（exploring starts），要么使用允许探索的策略，比如 epsilon-greedy。\n\
  \n由于我们已经知道探索启动是不现实的，我们将使用 epsilon-greedy。\n\n---\n\n让我们看一些伪代码来巩固这个概念。\n\n```\nQ(s,a)\
  \ = 任意值, Q(terminal, a) = 0\nfor t=1..N\n    s = start_state, a = epsilon_greedy_from(Q(s))\n\
  \    while not game over:\n        s’, r = do_action(a)\n        a’ = epsilon_greedy_from(Q(s’)\n\
  \        Q(s,a) = Q(s,a) + alpha*[r + gamma*Q(s’,a’) - Q(s,a)]\n        s = s’,\
  \ a = a’\n```\n\n\n\n我们然后根据 epsilon-greedy 策略和当前的 `Q` 选择下一个动作。我们称之为 `a’`。\n\n接下来，我们对\
  \ `Q(s,a)` 进行更新，它取决于：`Q(s,a)`、`r` 以及 `Q(s’,a’)`。\n\n接着，我们将 `s` 更新为 `s’`，并将 `a` 更新为\
  \ `a’`。\n\n--- 关于 SARSA 的一个有趣事实是，从未发表过收敛性证明。\n\n然而，非正式地说明，如果策略收敛到贪婪策略，SARSA 就会收敛。\n\
  \n实现这一目标的一种方法是让 `epsilon = 1/t`，其中 `t` 代表时间。\n\n这是我们在代码中使用的形式。\n\n注意，分子不一定是 1。你可以使用\
  \ `0.5/t` 或 `0.8/t` 等任何你想要的数值。\n\n此外，你**不一定**得使用 `1/t` 衰减，你可以使用 `1/t²/3` 或任何你选择的幂。\n\
  \n你应该将其视为一个超参数。\n\n--- 同样记住，学习率也可以衰减。\n\n使用 `1/t` 衰减存在一个问题。\n\n考虑一下，在每个时刻，`Q` 中只有一个状态-动作对会被更新。\n\
  \n因此，对于那些从未更新过的 `Q` 值，学习率也会发生衰减！\n\n你可以尝试弥补这一点，即每个回合（episode）只衰减一次学习率，但你仍然面临相同的问题。\n\
  \n在一个回合中，只有完整状态集的一个子集会被访问。\n\n而且每个状态只会采取所有可能动作中的一个。\n\n所以，即使你每回合只衰减一次学习率，你仍然对那些从未更新过的\
  \ `Q` 部分进行了衰减。\n\n--- 为了解决这个问题，我们从深度学习中汲取了灵感——特别是 `AdaGrad` 和 `RMSprop` 算法。\n\n\
  记住，这些算法独特之处在于，当过去的梯度很大时，有效学习率下降得更多。换句话说，事物过去变化得越多，我们未来降低学习率的就越大。\n\n我们的版本将比这些技术简单，但原理是相同的。我们将记录看到状态-动作对的次数。\n\
  \n我们将 `alpha` 设置为原始的 `alpha / the count`。\n\n`alpha(s,a) = alpha0/count(s,a)`\n\n\
  或者更通用地：\n\n`alpha(s,a)=alpha0/(k+m*count(s,a))`\n\n通过这样，每个状态-动作对都有自己的 `alpha`，因此它们都将拥有各自各自独立衰减的学习率。\n\
  \n## 代码中的 SARSA\n\n在本节课程中，我们将用代码实现 SARSA。\n\n如果你不想尝试自己写代码（尽管我强烈建议你这样做），课程代码库中的相关文件是\
  \ `sarsa.py`。\n\n在顶部，我们有标准的导入。注意我们还需要来自 `monte_carlo_es` 的 `max_dict` 函数。\n\n```\n\
  import numpy as np\nimport matplotlib.pyplot as plt\nfrom grid_world import standard_grid,\
  \ negative_grid\nfrom iterative_policy_evaluation import print_values, print_policy\n\
  from monte_carlo_es import max_dict\nfrom td0_prediction import random_action\n\n\
  GAMMA = 0.9\nALPHA = 0.1\nALL_POSSIBLE_ACTIONS = ('U', 'D', 'L', 'R')\n```\n\n我们拥有与之前相同的常量。注意这里的\
  \ `alpha` 并不是我们将用于 `Q` 的有效 `alpha`，但有效 alpha 将从这个初始 `alpha` 派而出。\n\n注意在这个脚本中，我们没有\
  \ `play_game` 函数，因为对于 SARSA，玩游戏和执行更新是无法分离的。我们必须在玩游戏的同时进行更新。正如承诺的那样，TD 方法是完全在线的（online）。\n\
  \n--- 现在我们进入主部分。注意我们正在使用负网格（negative grid）。你也可以尝试标准网格来观察效果。\n\n```\nif __name__\
  \ == '__main__':\n    grid = negative_grid(step_cost=-0.1)\n    print \"rewards:\"\
  \n    print_values(grid.rewards, grid)\n```\n\n接下来，我们打印奖励并初始化 `Q`。\n\n```python\n\
  ## initialize Q(s,a)\nQ = {}\nstates = grid.all_states()\nfor s in states:\n   \
  \ Q[s] = {}\n    for a in ALL_POSSIBLE_ACTIONS:\n        Q[s][a] = 0\n```\n\n此之后，我们创建了两个\
  \ `update_counts` 字典。名为 `update_counts` 的字典是为了查看我们在每个状态中花费的时间比例。名为 `update_counts_sa`\
  \ 的字典用于自适应学习率。\n\n```python\nupdate_counts = {}\nupdate_counts_sa = {}\nfor s in\
  \ states:\n    update_counts_sa[s] = {}\n    for a in ALL_POSSIBLE_ACTIONS:\n  \
  \      update_counts_sa[s][a] = 1.0\n```\n\n接下来，我们进入主循环。我们在这里使用变量 `t` 用于 epsilon-greedy。\n\
  \n```python\n## repeat until convergence\nt = 1.0\ndeltas = []\nfor it in xrange(10000):\n\
  \    if it % 100 == 0:\n        t += 1\n    # ... logic ...\n```\n\n\n\n这意味着，你所采取的动作可以是完全随机的，但你仍然得到了最优价值函数，并从它计算出最优策略。\n\
  \n---\n\n## 那么 Q-Learning 是如何工作的？\n\n它实际上看起来非常像 SARSA。\n\n如果你看一眼这两个公式，并发现它们在你看来完全一模一样，这并不会令人惊奇。\n\
  \n`Q(S(t),A(t)) = Q(S(t),A(t))+alpha*[R(t+1) + max[a’]{ Q(S(t+1),a’) } - Q(St,At)]`\n\
  \n`Q(s,a) = Q(s,a) + alpha*[r+max[a’]{ Q(s’,a’) } - Q(s,a)]`\n\n所以主意是，我们不是根据 `Q`\
  \ 的 `argmax` 来实际选择 `a’`，而是根据所有动作的 `max` 来更新 `Q`。\n\n现在你的第一个想法可能是：“嗯，这不就是完全一样吗？”\n\
  \n如果我们选择 `a’` 作为 `Q` 的 `argmax`，那么乘以 `gamma` 的项将是 `Q(s’, a’`，它是对 `a’` 取最大值。\n\n\
  ---\n\n## 这里的区别在于\n\n记住，对于 Q-Learning，它是一种离策略（off-policy）方法。\n\n`Q(s’,a’)` 可能是所有\
  \ `a’` 的 `max`，但这并不意味着 `a’` 必须是我们的下一个动作。\n\n我们使用 `Q(s’,a’)` 的 `max` 来更新 `Q(s,a)`，即使我们最后在下一步中没有执行动作\
  \ `a’`。\n\n这表明我们遵循什么策略完全不重要。我们可以随机选择动作，并且仍然得到相同的答案。代码将证明这一点。\n\n在现实中，如果你最终确实采取了纯随机的动作，结果将是你的智能体经常表现出非最优行为，这将使得你的回合（episodes）持续时间更长。\n\
  \n正因如此，对于相同数量的回合，脚本运行的时间会更长。\n\n---\n\n所以 Q-Learning 的关键区别在于，我们使用什么策略并不重要。\n\n那么合理的问题是，在什么情况下\
  \ Q-Learning 等同于 SARSA？\n\n如果你在 Q-Learning 期间使用的策略是贪婪策略（greedy policy），这意味着你总是选择\
  \ `Q` 的 `argmax`，那么你的 `Q(s’,a’)` 将对应于你采取的下一个动作。\n\n因此，在这种情况下，你既在做 SARSA，也在做 Q-Learning。\n\
  \n## 代码中的 Q-Learning\n\n在这一节中，我们将用代码实现 Q-Learning。\n\n如果你不想尝试自己写这些代码（尽管我强烈建议你这样做），课程代码库中的相关文件是\
  \ `q_learning.py`。\n\n请记住，这很大程度上与 SARSA 脚本是相同的。\n\n我们只看主循环，因为所有的相关变化都在那里。\n\n```python\n\
  ## 重复直到收敛\nt = 1.0\ndeltas = []\nfor it in xrange(10000):\n    if it % 100 == 0:\n\
  \        t += 10e-3\n    if it % 2000 == 0:\n        print \"it:\", it\n    # 我们不是“生成”一个回合，而是在循环内\n\
  \    # 玩一个回合\n    s = (2, 0) # 状态\n    grid.set_state(s)\n    # 第一个 (s, r) 元组是我们开始的状态，且\
  \ 0\n    # （因为我们没有得到奖励）仅仅是开始游戏\n    # 最后一个 (s, r) 元组是终止状态和最终奖励\n    # 终止状态的值定义上为\
  \ 0，所以我们不需要\n    # 关心更新它\n    a, _ = max_dict(Q[s])\n    biggest_change = 0\n  \
  \  while not grid.game_over():\n        a = random_action(a, eps=t) # epsilon-贪婪\n\
  \        # 随机动作也行，但较慢，因为你可能会撞墙\n        a = np.choice(ALL_POSSIBLE_ACTIONS)\n  \
  \      r = grid.move(a)\n        s2 = grid.current_state()\n        # 自适应学习率\n \
  \       alpha = ALPHA / update_counts_sa[s][a]\n        update_counts_sa[s][a] +=\
  \ 0.005\n        # 我们在经历回合时更新 Q(s,a)\n        old_qsa = Q[s][a]\n        # SARSA\
  \ 和 Q-Learning 的区别在于 Q-Learning\n        # 我们在更新中使用这个 max[a']{ Q(s',a')}\n     \
  \   # 即使我们在下一步没有执行这个动作\n        a2, max_q_s2\n```\n\n\n\n这意味着，只要架构正确，神经网络就可以以任意程度的精度近似任何函数。\n\
  \n在实践中，它们的表现并非完美，但表现得非常好。\n\n从数学角度来说，我们将要做的是首先进行特征提取。\n\n因此，从状态 `s` 中，我们可以提取出一个特征向量\
  \ `x`。\n\n我们的目标是找到一个函数，它接收一个特征向量 `x` 和一组参数 `theta`，并忠实地近似值函数 `V(s)`。\n\n```\nx =\
  \ get_features(s) = phi(s)\nf(x; phi) = theta.dot(x) = theta.dot(phi(s))\nf(x; phi)\
  \ ~= V(s) <-- 我们的目标\n```\n\n---\n\n在本书中，我们将特别关注线性方法。\n\n正如你所看到的，函数近似方法要求我们使用可微的模型。\n\
  \n因此，你将无法使用像决策树或 `k-nearest neighbor` 的方法。在本书的后续章节，我们将介绍深度学习方法，它们也是可微的。\n\n与线性方法不同，我们不需要事先进行特征工程，尽管我们可以这样做。深度学习模型具有更强的表达能力，并且能够自动完成大量工作。\n\
  \n像卷积神经网络这样的模型允许我们将原始像素数据作为状态，神经网络将完成其自动的特征提取和选择。\n\n然而，这些方法的实现难度更大，并且会偏离本课程的重点——强化学习的基础。\n\
  \n因此，通过这门课程你不需要了解任何深度学习的知识，但你需要了解一些基础机器学习技术，如 `linear regression` 和 `gradient descent`。\n\
  \n---\n\n本章的大纲如下。\n\n我们首先将近似方法应用于蒙特卡洛预测（Monte Carlo prediction）。这意味着我们将在给定策略策略估计值函数，但我们不再使用状态索引的字典来表示值函数，而是使用线性函数近似器。\n\
  \n记住，蒙特卡洛方法要求我们在进行任何更新之前，必须运行整个回合并计算回报。\n\n接下来，我们将近似方法应用于预测的 `TD(0)`。\n\n请记住，`TD(0)`\
  \ 结合了蒙特卡洛采样和动态规划中自举（bootstrapping）方法的特点。\n\n在完成预测问题后，我们将转向控制问题，并为此使用 `SARSA`，但当然，我们将用线性函数近似器替换\
  \ `Q`。\n\n---\n\n在本节中需要记住的一点是，你始终可以通过将结果与非近似版本的代码进行比较来进行合理性检查（sanity check）。\n\n\
  由于我们正在进行近似，我们不期望答案与非近似版本完全相等，但它们应该是接近的。\n\n你可能会遇到的一个障碍是：你的算法可能实现得完美，但你的模型很糟糕。\n\n\
  记住，线性模型的表达能力不强。\n\n因此，如果你提取了一组糟糕的特征，你的模型将无法很好地学习值函数。换句话说，你的模型将产生巨大的误差。为了避免这种情况，你的模型会有很大的误差。\n\
  \n## 线性模型\n\n（注：原文此处存在大量重复段落，已根据要求保留核心内容并处理）\n\n\n\n正如你所知，我们将类别编码为特征向量的方法是独热编码（one-hot-encoding）。\n\
  \n---\n\n让我们讨论一下如果我们对每个状态进行独热编码会发生什么。\n\n我们有 `|S|` 个状态，因此 `X` 的维度（我们称之为 `D`）是 `|S|`\
  \ 的基数。\n\n`D=|S|`\n\n所以我们有一个大小为 `|S|` 的长型特征向量 `X`。\n\n然后，对于每个状态，我们将 `X` 中的其中一个值设置为\
  \ 1。\n\n`s = (0,0) → x = [1, 0, 0, …]`\n`s = (0,1) → x = [0, 1, 0, …]`\n\n---\n\n\
  这种方法的问题在于，它无法允许我们压缩存储值函数所需的空间，而这正是我们最初想要这样做的根本。\n\n回一下，如果我们把 `V` 存储为一个字典，它将会有 `|S|`\
  \ 个键和 `|S|` 个值。\n\n所以，如果我们使用独热编码，并没有带来任何改进。\n\n事实上，这与我们之前所做的等价的，因为在这种情况下，每个 `theta`\
  \ 都代表对应状态的值。\n\n`V(s=0) = theta.dot([1,0,0,...]) = theta[0] = theta 的第 0 个分量`\n\n\
  ---\n\n然而，在特征变换中使用独热编码也有一个积极的方面。\n\n假设你的算法不起作用，且 `V_hat` 不能很好地表示真实的 `V`。\n\n你的 `V_hat`\
  \ 可能不好的原因之一是你的特征可能不好。\n\n所以，你的代码可能是完美且没有 true 的，但仍然因为特征不好而没有产生良好的结果。\n\n因此在这种情况下，你可以更改特征转换器来使用独热编码，其中你单独预测每个\
  \ `V(s)`。\n\n如果你这样做并且代码运行正常，那么它告诉你的你的特征很糟糕。\n\n---\n\n那么，如果独热编码并不好，那么什么才是好的呢？\n\n\
  在网格世界（Gridworld）的情况下，考虑每个 `(i, j)` 位置实际上代表二维空间中的一个位置。\n\n因此，它更像是一个实数而不是一个类别。\n\n\
  所以你可以直接将 `X` 向量表示为 `(i, j)` 本身。你可能想对其缩放，使其均值为 0，方差为 1。\n\n`(x1,x2) = (i,j)`\n\n\
  我们将此特征向量简单视为原始数据 - 无需任何特征工程。\n\n---\n\n将 `x` 仅设置为智能体的位置有什么问题？\n\n记住我们的模型是线性的。\n\n\
  假设 `j` 是固定的。\n\n这意味着，`V` 只能随 `i` 线性变化。\n\n这意味着，`V` 对于这个 `x` 坐标只能是一条直线。\n\n所以它要么始终增加的，要么始终减少的。\n\
  \n这种表表达能力不高。\n\n回想我的线性回归课程，创建新特征的一种简单方法是创建多项式。\n\n你可能在微积分学习中学习过，无限的泰勒展开可以近似任何函数。\n\
  \n所以，如果我们从 `x1` 和 `x2` 开始，我们可以创建项 `x1²`、`x2²` 和 `x1*x2`。\n\n如果你需要，你也可以创建高阶多项式，但你必须注意过拟合。\n\
  \n这是我们在本课程中将使用的方法，但如果你知道其他手动创建特征的方法，欢迎也使用那些方法。\n\n## MC 预测理论\n\n现在我们已经为将监督线性模型整合到我们的标记尔决策过程过程中奠定了基础，我们可以开始将它们应用于预测问题和控制问题。\n\
  \n我们当然将从预测问题开始。\n\n特别在本讲座中，我们将使用蒙特卡洛估计，但用我们的值函数线性模型替换值函数字典。\n\n---\n\n回想起蒙特卡洛估计，我们有两个重复执行的两个步骤。\n\
  \n第一步是玩游戏，并计算状态和回报（returns）列表。\n\n第二步是以回报为目标、以 `V(s)` 为预测来更新 `V(s)`。记住这是梯度下降，但它等同于计算该状态所有回报的平均值。\n\
  \n`V(s) = V(s) + alpha*(G - V(s))`\n\n---\n\n由于在本讲座中我们用参数 `theta` 来近似 `V(s)`，因此我们想要更新的是\
  \ `theta`。\n\n所以现在我们继续进行随机梯度下降，但是是针对 `theta` 而不是 `V`。\n\n`theta = theta + alpha*(G\
  \ - V_hat(s))x`\n\n---\n\n记住这是针对固定策略的，因为我们正在解决预测问题。\n\n让我们看一些伪代码来巩固这个想法。\n\n我们首先输入一个策略\
  \ `pi`，并随机初始化 `theta` 向量。\n\n接下来，我们进入一个迭代若干次的循环。\n\n在每次迭代中，我们玩游戏，它返回一系列状态和回报。\n\n\
  我们遍历这些状态和回报，并将我们的更新方程应用于 `theta`，将回报视为目标。\n\n```python\ndef mc_approx_prediction(\U0001D70B\
  ):\n    \U0001D703 = random\n    for i=1..N:\n        states_and_returns = play_game\n\
  \        for s, g in states_and_returns:\n            ���(s)\n            \U0001D703\
  \ ← \U0001D703 + \U0001D6FC(g - \U0001D703)x\n```\n\n## MC 预测代码\n\n在本讲座中，我们将使用参数化值函数实现\
  \ `V_hat`。在顶部有导入语句。\n\n```python\nimport numpy as np\nimport matplotlib.pyplot as\
  \ plt\nfrom grid import standard_grid, grid, s2x\nfrom monte_carlo import random,\
  \ play_game, values, policy\n```\n\n`LEARNING_RATE = 0.001`\n\n`theta = np.randn(4)\
  \ / 2`\n\n```python\ndef s2x(s):\n    return np.array([s[0], s[1], s[0]*s[1], 1])\n\
  ```\n\n注意到这里的特征是 i 坐标和 j 坐标之间的交互作用。我们还有一个 1，代表偏置项。\n\n接下来，是我们的主循环。\n\n```python\n\
  deltas = []\nt = 1.0\nfor it in xrange(20000):\n    if it % 100 == 0:\n        t\
  \ += 0.01\n    alpha = LEARNING_RATE/t\n    # 使用 policy 生成回合\n    biggest_change\
  \ = 0\n    states_and_returns = play_game(grid, policy)\n    seen_states = set()\n\
  \    for s, G in states_and_returns:\n        # 检查是否已经见过 s # 称为“首次访问”MC 策略评估\n \
  \       if s not in seen_states:\n            old_theta = theta.copy()\n       \
  \     x = s2x(s)\n            V_hat = theta.dot(x)\n            # grad(V_hat) wrt\
  \ theta = x\n            theta += alpha*(G - V_hat)*x\n            biggest_change\
  \ = max(biggest_change, np.abs(old_theta - theta).sum())\n        seen_states.add(s)\n\
  \    deltas.append(biggest_change)\n\nplt.plot(deltas)\nplt.show()\n```\n\n注意到我们正在使用衰减的学习率，所以\
  \ alpha 是原始学习率除以 t。\n\n\n\n\n\n我们还在跟踪所有的增量（deltas），这些增量现在衡量 `theta` 的绝对差异。\n\n---\n\
  \n最后，我们创建了一个值字典，以便我们使用 `print_values` 函数将其打印出来。\n\n## 获取预测值\n\n```python\nV = {}\n\
  states = grid.all_states()\nfor s in states:\n    if s in grid.actions:\n      \
  \  V[s] = theta.dot(s2x(s))\n    else:\n        # 终止状态或我们无法到达的状态\n        V[s] =\
  \ 0\n\nprint \"values:\"\nprint_values(V, grid)\nprint \"policy:\"\nprint_policy(policy,\
  \ grid)\n```\n\n运行这段代码并查看结果。\n\n## TD(0) 半梯度预测理论\n\n既然我们能够将近似方法应用于蒙特卡洛（Monte Carlo），那么提问我们是否也能将近似方法应用于\
  \ TD 学习也是合理的。\n\n答案是肯定的，但有一个注意事项。\n\n---\n\n让我们先来看算法。\n\n记住，蒙特卡洛和时序差分学习（Temporal\
  \ Difference Learning）的主要区别在于，在时序差分学习中，我们不使用实际回报（return），而是根据奖励和下一个状态的价值函数来估计回报。\n\
  \n`theta = theta + alpha*[r+gamma*V_hat(s’) - V_hat(s)] d(V_hat(s))/d(theta)`\n\n\
  `theta = theta + alpha*[target - prediction] d(prediction)/d(theta)`\n\n这个算法存在一个小问题。\n\
  \n问题在于我们在这里使用的目标（target）并不是真实的目标，因为它依赖于模型做出的预测，特别是 `V_hat(s’`。\n\n所以从某种意义上说，我们正在使用模型的输出作为目标来修正模型参数，这看起来很奇怪。\n\
  \n但同时，它是通的，所以我们还是做了。\n\n我们称这种为“半梯度”（semi-gradient）方法，因为我们使用的目标不是真实的目标，所以梯度也不是真实的梯度。\n\
  \n---\n\n现在我们来看代码。\n\n如果你不想尝试自己编写这些代码（尽管我强烈建议你这样做），相关文件是 `approx_semigradient_td0_prediction.py`。\n\
  \n记住，这与蒙特卡洛之间有两个主要区别。\n\n第一点，如你所见，我们在更新 `theta` 时不使用回报。\n\n正因如此，当我们玩游戏时，也不需要费心计算回报，因为我们将直接使用奖励。\n\
  \n---\n\n```python\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom grid_world\
  \ import standard_grid, negative_grid\nfrom iterative_policy_evaluation import print_values,\
  \ print_policy\nfrom td0_prediction import play_game, SMALL_ENOUGH, GAMMA, ALPHA,\
  \ ALL_POSSIBLE_ACTIONS\n```\n\n在开头，我们有常规的导入。我们从之前的 td0 预测脚本中导入了一些有用的东西，比如 `play_game`。\n\
  \n在这个脚本中，我们将模型定义为一个类，拥有类似于 sci-kit learn 的 API。\n\n```python\nclass Model:\n   \
  \ def __init__(self):\n        self.theta = np.random.randn(4) / 2\n    def s2x(self,\
  \ s):\n        return np.array([s[0] - 1, s[1] - 1.5, s[0]*s[1] - 3, 1])\n\n   \
  \ def predict(self, s):\n        x = self.s2x(s)\n        return self.theta.dot(x)\n\
  \n    def grad(self, s):\n        return self.s2x(s)\n```\n\n所以我们有一个 `init` 函数，用它来初始化\
  \ `theta`。\n\n我们有 `s2x` 函数，它将状态转换为特征向量。注意，我们使用了与蒙特卡洛阶段相同的特征转换。请注意，这些可能不是好的特征。\n\n\
  我们有 `predict` 函数，它接收状态 `s`，将其转换为 `x`，并返回 `theta` 和 `x` 之间的点积。\n\n最后我们有梯度函数，它只返回\
  \ `x`。\n\n---\n\n接下来，我们是主部分。\n\n```python\nif __name__ == '__main__':\n    # 使用标准网格\n\
  \    grid = standard_grid()\n    # 生成策略\n    policy = {\n        (2, 0): 'U',\n\
  \        (1, 0): 'U',\n        (0, 0): 'R',\n        (0, 1): 'R',\n        (0, 2):\
  \ 'R',\n        (1, 2): 'R',\n        (2, 1): 'R',\n        (2, 2): 'R',\n     \
  \   (2, 3): 'U',\n    }\n    model = Model()\n    deltas = []\n    k = 0.0\n   \
  \ for it in xrange(20000):\n        old_theta = model.theta.copy()\n        states_and_rewards\
  \ = play_game(grid, policy)\n        for t in xrange(len(states_and_rewards) - 1):\n\
  \            s, r = states_and_rewards[t]\n            s2 = states_and_rewards[t+1]\n\
  \            if grid.is_terminal(s2):\n                target = r\n            else:\n\
  \                target = r + GAMMA * model.predict(s2)\n            model.theta\
  \ += ALPHA * (target - model.predict(s2)) * model.grad(s)\n            deltas.append(np.abs(model.theta\
  \ - old_theta).sum())\n        if it % 100 == 0:\n            print \"rewards:\"\
  \n            print_values(grid, grid)\n```\n\n\n\n在代码中，我也为你提供了对所有状态-动作对进行独热编码（one-hot\
  \ encoding）的选项，这等同于直接进行没有任何近似的常规 SARSA。\n\n所以你也可以尝试这种方法，让自己相信程序运行正常。\n\n为了实现这一点，我们维护了一个名为\
  \ `SA2IDX` 的字典，它将状态-动作对映射到 `X` 中的一个唯一索引。\n\n这与我在 NLP 课程中看到的类似，在那里我们有一个 `word2idx`\
  \ 字典，并将词表中的每个单词映射到 `X` 中的一个唯一索引。\n\n## 半梯度 SARSA 代码\n\n在这一节中，我们将用代码实现半梯度 SARSA。\n\
  \n如果你不想尝试自己编写这些代码（尽管我强烈建议你这样做），相关文件是 `approx_semigradient_sarsa_control.py`。\n\n\
  请记住，这是为了解决控制问题，因此目标是找到最优策略。\n\n这是一个半梯度方法，是因为我们使用了时间差分学习（temporal difference learning），而且目标并不是真实的目标，因为它使用了模型预测。\n\
  \n正因如此，我们使用的梯度也不是真实的梯度，因此我们称之为半梯度方法。\n\n在顶部，我们包含了所有常规的导入。\n\n```\nimport numpy as\
  \ np\nimport matplotlib.pyplot as plt\nfrom grid_world import standard_grid, negative_grid\n\
  from iterative_policy_evaluation import print_values, print_policy\nfrom monte_carlo_es\
  \ import max_dict\nfrom sarsa import random_action, GAMMA, ALPHA, ALL_POSSIBLE_ACTIONS\n\
  ```\n\n`SA2IDX = {}`\n`IDX = 0`\n\n我们还创建了一个字典将状态-动作对映射到索引，以及一个全局索引变量来跟踪已经见过的状态-动作对的数量，以便它可以分配下一个索引。\n\
  \n接下来，我们创建了 `Model` 类。\n\n```python\ndef sa2x(self, s, a):\n    # NOTE: 仅使用 (r,\
  \ c, r*c, u, d, l, r, 1) 表达能力不够\n    return np.array([\n        s[0] - 1 if a ==\
  \ 'U' else 0,\n        s[1] - 1.5 if a == 'U' else 0,\n        (s[0]*s[1] - 3)/3\
  \ if a == 'U' else 0,\n        (s[0]*s[0] - 2)/2 if a == 'U' else 0,\n        (s[1]*s[1]\
  \ - 4.5)/4.5 if a == 'U' else 0,\n        1 if a == 'U' else 0,\n        s[0] -\
  \ 1 if a == 'D' else 0,\n        s[1] - 1.5 if a == 'D' else 0,\n        (s[0]*s[1]\
  \ - 3)/3 if a == 'D' else 0,\n        (s[0]*s[0] - 2)/2 if a == 'D' else 0,\n  \
  \      (s[1]*s[1] - 4.5)/4.5 if a == 'D' else 0,\n        1 if a == 'D' else 0,\n\
  \        s[0] - 1 if a == 'L' else 0,\n        s[1] - 1.5 if a == 'L' else 0,\n\
  \        (s[0]*s[1] - 3)/3 if a == 'L' else 0,\n        (s[0]*s[0] - 2)/2 if a ==\
  \ 'L' else 0,\n        (s[1]*s[1] - 4.5)/4.5 if a == 'L' else 0,\n        1 if a\
  \ == 'L' else 0,\n        s[0] - 1 if a == 'R' else 0,\n        s[1] - 1.5 if a\
  \ == 'R' else 0,\n        (s[0]*s[1] - 3)/3 if a == 'R' else 0,\n        (s[0]*s[0]\
  \ - 2)/2 if a == 'R' else 0,\n        (s[1]*s[1] - 4.5)/4.5 if a == 'R' else 0,\n\
  \        1 if a == 'R' else 0,\n    ])\n\n# 如果我们使用 `SA2IDX`，对每个 (s,a) 对进行独热编码\n\
  ## 实际上我们不想这样做，因为我们有\n## 之前一样多的参数\n## `x = np.zeros(len(self.theta))`\n## `idx =\
  \ SA2IDX[s][a]`\n## `x[idx] = 1`\n## return x\n```python\ndef predict(self, s, a):\n\
  \    x = self.sa2x(s, a)\n    return self.theta.dot(x)\n\ndef grad(self, s, a):\n\
  \    return self.sa2x(s, a)``init` 函数与之前相同，它初始化 `theta`。注意现在的维度是 25。\n\n接下来，我们有特征转换函数\
  \ `sa2x`。它创建了上一节中提到的所有特征。你也可以将其注释掉，因为我在下方提供了对状态动作对进行独热编码的选项。这样做等同于执行 SARSA。\n\n\
  接下来，我们有 `predict` 和梯度函数，与之前一样。\n\n接下来，我们有一个名为 `getQs` 的函数。我们需要它是因为在 SARSA 的某些时刻，我们需要对\
  \ `Q` 取 argmax，但如果 `Q` 没有表示为字典，我们就无法这样做。\n\n```python\ndef getQs(model, s):\n  \
  \  # 需要 Q(s,a) 来选择动作\n    # 即 a = argmax{ Q(s,a) }\n    Qs = {}\n    for a in ALL_POSSIBLE_ACTIONS:\n\
  \        q_sa = model.predict(s, a)\n        Qs[a] = q_sa\n    return Qs\n```\n\n\
  这个函数的作用是根据某些状态 `s` 将 `Q` 预测转换为字典。\n\n接下来，是主部分。我们在这里使用了负网格，但欢迎并鼓励尝试标准网格。\n\n```python\n\
  if __name__ == '__main__':\n    grid = negative_grid(step_cost=-0.1)\n\n    print\
  \ \"rewards:\"\n    print_values(grid.rewards, grid)\n\n    # 没有策略初始化，我们将从最新的 Q\
  \ 策略\n    # 遍历所有的 (s,a) 对，每个对在我们的“笨”模型中都有自己的权重\n    # 本质上每个权重都是 Q(s,a) 本身\n    states\
  \ = grid.all_states()\n    for s in states:\n        SA2IDX[s] = {}\n        for\
  \ a in ALL_POSSIBLE_ACTIONS:\n            SA2IDX[s][a] = IDX\n            IDX +=\
  \ 1\n```\n\n我们打印奖励，然后填充 `SA2IDX` 字典。接下来，初始化模型，然后进入主循环。\n\n```python\n## 初始化模型\n\
  model = Model()\n\n## 重复直到收敛\nt = 1.0\nt2 = 1.0\ndeltas = []\nfor it in xrange(20000):\n\
  \    if it % 100 == 0:\n        t += 10e-3\n        t2 += 0.01\n    if it % 1000\
  \ == 0:\n        print \"it:\", it\n    alpha = ALPHA / t2\n```\n\n注意这里有两个时间变量 `t`\
  \ 和 `t2`，因为我希望学习率和 epsilon 以不同的速率降低。这些是超参数，所以你只能通过实验找到好的值。\n\n接下来，我们进入主循环。注意在使用\
  \ `max_dict` 之前，我们需要使用 `getQs` 函数。\n\n接下来，我们进入游戏循环。\n\n```python\ns = (2, 0) # 状态\n\
  grid.set_state(s)\n\n## 获取 Q(s) 以便选择第一个动作\nQs = getQs(model, s)\n\na = max_dict(Qs)[0]\n\
  a = random_action(a, 0.5/t) # epsilon-greedy\n\nbiggest_change = 0\nwhile not grid.game_over():\n\
  \    r = grid.move(a)\n    s2 = grid.current_state()\n\n    # 我们还需要下一个动作，因为 Q(s,a)\
  \ 依赖于 Q(s',a')\n    # 如果 s2 在策略中则它是终止状态，所有 Q 都为 0\n    old_theta = model.theta.copy()\n\
  \    if grid.is_terminal(s2):\n        model.theta += alpha*(r - model.predict(s,\
  \ a))*model.grad(s, a)\n    else:\n        # 非终止\n        Qs2 = getQs(model, s2)\n\
  \        a2 = max_dict(Qs2)[0]\n        a2 = random_action(a2, 0.5/t) # epsilon-greedy\n\
  \n        # 我们在体验过程中更新 Q(s,a)\n        model.theta += alpha*(r + GAMMA*model.predict(s2,\
  \ a2) - model.predict(s, a))*model.grad(s, a)\n\n    # 下一个状态变为当前状态\n    s = s2\n\
  \    a = a2\n\n    biggest_change = max(biggest_change, np.abs(model.theta - old_theta).sum())\n\
  \    deltas.append(biggest_change)\n\nplt.plot(deltas)\nplt.show()\n```\n\n## 总结与后续\n\
  \n在这一节中，我们将总结本章的内容以及本书的内容。我们还将讨论可能的后续——关于强化学习中接下来学习什么的的一些建议。\n\n---本章完全关于近似方法。\n\
  \n在课程早期我们就学到，MDP 的状态空间可能会迅速增长到无法枚举的程度，因此，尝试存储一个为状态空间中每个状态定义的值函数可能是不可行的。\n\n近似方法允许我们对值函数进行参数化，从而使我们实际上需要的参数数量少于状态空间的大小。\n\
  \n具体而言，我们了解到可微模型是一个很好的选择，因为我们可以使用随机梯度下降，并像我们在书中做的那样以在线方式继续学习。\n\n\n\n我们在本课程中研究的可微模型类型是线性回归，但我们同样容易地将其应用于神经网络和深度学习。\n\
  \n使用线性回归意味着我们必须进行特征工程，因为我们拥有的原始特征——`i` 坐标和 `j` 坐标——无法产生足够表达力的模型。\n\n---\n\n## 近似方法\n\
  \n我们将近似方法应用在了课程早期学过的 3 种算法上。\n\n首先，我们使用了基于蒙特卡洛预测（Monte Carlo prediction）的近似。\n\n\
  接下来，我们使用了蒙特卡洛预测的自然扩展——`TD(0)` 预测的近似。\n\n我们学习到，由于 `TD(0)` 要求我们使用模型来形成目标，因此我们用于梯度下降的梯度并不是真实的梯度，所以我们称其为半梯度方法。\n\
  \n最后，我们将近似方法用于控制——特别是，将其应用于 `SARSA` 算法。由于 `SARSA` 也是一种时序差分方法，我们再次没有使用真实梯度，而是半梯度。\n\
  \n---\n\n## Q-Learning vs. SARSA\n\n你可能在奇怪为什么我们没有将近似方法应用于 `Q-Learning`。\n\n回想 `Q-Learning`\
  \ 是一种离策略（off-policy）方法。\n\n有些来源指出，对于离策略控制方法使用近似方法没有良好的收敛特性。\n\n然而，如果你想尝试修改现有 `SARSA`\
  \ 近似脚本以使用 `Q-Learning` 代替，我们鼓励这样做。\n\n请记住 `SARSA` 和 `Q-Learning` 之间的主要区别在于，用于更新的\
  \ `Q` 并不一定对应我们采取的下一个动作。\n\n所以基本上，选择动作的那行代码会出现在其他地方。\n\n---\n\n## 课程概述\n\n为了让这一切都有背景，让我们现在回顾一下在本课程中完成的所有内容。\n\
  \n我们在本课程开始时研究了多臂老虎机问题，你最初在我的《贝叶斯机器学习与 A/B 测试》课程中见过它。\n\n你学习了探索与利用的权衡（explore-exploit\
  \ dilemma），这是强化学习的核心。\n\n我们看到了解决多臂老虎机问题的 4 种方法，包括 ε-贪婪（epsilon-greedy）、乐观初始值、`UCB1`\
  \ 和汤普采样（Thompson sampling）。\n\n接下来，你学习了强化学习中更多的基础定义，并应用它们来创建一个井井棋智能体。通过编写井字棋智能体的代码，我们能够直感受到强化学习是如何工作的，以及我们用于学习的算法类型。\n\
  \n---\n\n## 马尔可夫决策过程 (MDP)\n\n在下一章中，我们将学到的所有强化学习概念形式化为马尔可夫决策过程框架，或 `MDPs`。\n\n你学习了策略（policies）、状态价值函数和动作价值函数。\n\
  \n你学习了回报（returns）的概念，即未来奖励的折现之和。\n\n---\n\n## 解决 MDPs\n\n在接下来的章节中，我们研究了解决 MDP 的\
  \ 3 种不同方法。特别是，我们对解决两个问题感兴趣：预测问题（在给定策略的情况下寻找价值函数）和控制问题（寻找最优策略）。\n\n### 动态规划\n在动态规划的第一部分，我们直接应用了贝尔曼方程（Bellman’s\
  \ Equation）来解决这两个问题。你学习了策略迭代（policy iteration）的思想，以及更高效的方法，即价值迭代（value iteration）。\n\
  \n我们学习到动态规划并不真正实用，因为它不从经验中学习，并且假设我们知道所有相关的概率分布。\n\n### 蒙特卡洛方法\n在下一节中，我们研究了蒙特卡洛方法，它只从经验中学习。通过蒙特卡洛，我们不再使用概率分布精确地计算期望值，而是使用样本平均值来估计它们。蒙特卡洛方法的问题是它不是完全在线的，如果你有非常长的回合或持续任务，就会出现问题。\n\
  \n### 时序差分学习\n我们研究的最后方法是时序差分学习，结合了动态规划和蒙特卡洛的特性。`TD` 学习使用了自助引导（bootstrapping），这意味着它基于其他估计来做出估计，这使得它能够完全在线，因为我们不需要等待回合结束就可以进行更新。同时，`TD`\
  \ 学习也从经验中学习，这意味着我们不需要 `MDP` 的概率模型。\n\n---\n\n## 深度强化学习\n\n在课程的最后一部分，我们学习了上述 3 种方法对于大型状态空间可能是不可行的，因此我们研究了压缩价值函数的方法。\n\
  \n我们函数近似器的唯一要求是它们可微。正如你所知，深度学习方法也是可微的。`Theano` 和 `TensorFlow` 等库会自动为我们计算梯度，这在我们拥有大量参数和复杂函数的情况下会使更新方程变得更简单。\n\
