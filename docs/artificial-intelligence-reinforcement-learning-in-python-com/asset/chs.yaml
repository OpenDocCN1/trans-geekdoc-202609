  \n特别是在深度学习中，经验告诉我，很多人想跳进深度学习领域是因为因为它现在很流行，但他们缺乏基础。\n\n## 什么是强化学习？\n\n强化学习是不同的。强化学习可以引导智能体在现实世界中行动。\n\
  \n所以强化学习的接口比简单的数据要广泛得多，它是整个环境。\n\n这个环境可以是现实世界，也可以是像视频游戏这样的模拟世界。\n\n例如，你可以创建一个强化学习智能体来打扫房屋。那么它就会与真实世界交互。你可以创建一个强化学习智能体学习走路。那也会与真实世界交互。\n\
  \n你可以确定军事军事对这类技术感兴趣——他们想要强化学习智能体可以替代士兵。不仅是走路，还有战斗、拆除炸弹，并在执行任务期间做出重要决策。\n\n所以你现在明白为什么强化学习相对于基础的监督和无监督学习是一个如此巨大的跨越了。\n\
  \n\n\n\n# 强化学习概述\n\n强化学习算法具有基于“目标”的目标。这与监督学习不同，监督学习的目标是获得良好的准确率或最小化代价函数。\n\n强化学习算法在智能体（agent）与环境交互时获取反馈。因此，反馈信号，或者我们喜欢称之为“奖励”（rewards），是由环境自动提供给智能体的。\n\
  \n这与监督学习大不同，后者获取人工标注的数据可能极其昂贵且耗时。从这个意义上说，强化学习与监督学习非常不同。监督学习需要人工标注的数据集，而强化学习从环境信号中自动学习，因此不需要人工标注。\n\
  \n## 目标概念\n\n让我们扩展一下这个目标概念。将我们的任务表述为目标，可以允许我们解决更广泛的问题。\n\n- `AlphaGo` 的目标是赢得围棋。\n\
  - 视频游戏 AI 的目标是在游戏中尽可能得远，或者获得高分。\n\n有趣的是，当你考虑到动物，特别是人类时。进化心理学家说，我们的基因是“自私”的，它们唯一想做的就是产生更多的自身。这非常有趣，因为就像\
  \ `AlphaGo` 一样，我们发现了许多“迂回”且不太可能实现这一点的方法。专家评论说 `AlphaGo` 使用了一些令人惊讶且不寻的技术。\n\n例如，你可能想要变得富有并赚大钱。但你是否想过你为什么会有这种感觉？也许那些拥有富有欲望相关的特定基因组的人，由于自然选择最终在我们的基因库中变得更加突出。也许拥有许多钱带来了更好的医疗保健和社交地位，从而帮助你的基因最大化了它们的核心目标，即产生更多的自身。\n\
  \n尽管银行账户里的数字在物理定律上与你的寿命长短没有直接关系，但它是该问题的一个新颖解决方案。“渴望并成功挣钱”只是我随口想出的随机例子，但你可以将其替换为任何你特质，比如“健康强壮”或“具有强大的分析能力”。知道确切的因素是社会科学家的工作，我们只感兴趣只有一个我们想要最大化的主要目标，以及实现它的各种新颖方法。\n\
  \n而且这些事物随着时间不断波动。在历史的某一点，尽可能寻求糖会为你提供能量并帮助你生存。今天，我们保留了这种特征，是因为进化是缓慢的，但在当今世界，这种特征实际上在杀死我们。我们基因最大化奖励的方法是通过突变和自然选择，这是缓慢的，但\
  \ AI 最大化其奖励的方法是强化学习，它是快速的。\n\n## 技术细节：状态\n\n现在让我们进入一些技术细节。当然，你永远不会一次性感知整个世界，即使人类也不是这样做的。我们有传感器从环境向大脑提供信号。这些信号甚至不能告诉我们关于所在房间的所有信息，更不用说世界了。因此，我们对环境的信息必然是有限的，那些具有有限数量和类型的机器人也是如此。\n\
  \n我们从这些传感器（视觉、听觉和触觉）获得的测量值构成了一个“状态”（state）。在本课程中，我们只观察具有少量有限状态的环境，但当然，也可以考虑具有无限状态的环境。\n\
  \n## 示例：五井棋\n\n让我们做一个简单的例子。考虑一个井棋盘，我们不在乎谁赢，我们只想在棋盘上放置 X 和 O。棋盘起初是空的，我们继续添加 X 或 O\
  \ 直到棋盘填满。\n\n例：\n\n```\n+---+---+---+\n| x | o | x |\n+---+---+---+\n| x | x | x\
  \ |\n+---+---+---+\n| x | o | o |\n+---+---+---+\n```\n\n如果你不知道五井棋是如何运作的，可以进行 Google\
  \ 搜索并在浏览器中自己玩这个游戏。记住井棋盘是 `3x3` 的棋盘。这个环境中的状态总数是多少？思考这个问题一分钟，然后回到书中。\n\n由于我们没有考虑在获得连续\
  \ 3 个 X 或 3 个 O 后就有胜者的井棋游戏，所以这个问题非常简单。棋盘上的每个位置有 3 种可能的状态：空、X 或 O。棋盘上有 9 个位置。因此，状态总数是\
  \ `3⁹`。\n\n## 关键术语回顾\n\n让我们回顾一下目前为止讨论过的术语——有 3 个，可能还有我偷偷插进去的。这 3 个重要的是：\n\n- **智能体（Agent）**：这是感知环境的实体，也是我们试图为其编码智能和学习能力的实体。\n\
  - **环境（Environment）**：这是你的智能体所在的真实世界或模拟世界。\n- **状态（State）**：这些是智能体可以感知环境的不同配置。\n\
  \n## 奖励概念\n\n强化学习中还有几个需要定义的概念，它们是该主题的核心。\n\n首先，有一个`奖励`（reward）的概念。这是强化学习算法与其他类机器学习算法的区别。智能体不仅尝试最大化其即时奖励，还最大化未来奖励。通常，强化学习算法会找到实现这一点的新颖方法。\n\
  \n我本身不是棋手，但我们听说 `AlphaGo` 程序学习了独特且不可预测的策略，这些策略导致它成为世界冠军。这些东西对人类来说是不直观的，但强化学习算法可以自动发现它们。其中一个潜在的危险方面是意外后果。想象你程序化\
  \ AI 来减少死亡人数，然后它决定由于人类将指数级增长，未来死的人也会增加，现在消灭所有人对减少未来的死亡更好。所以对于与真实世界交互的 AI，存在某些副作用。为了给你一个关于如何以及为什么要编写奖励的低级示例，考虑一个机器人试图解决迷宫。一个合理的目标可能是简单的解决迷宫。如果你解决了迷宫，你会获得\
  \ `1` 的奖励，否则获得 `0`。在这种奖励结构下，机器人可能会执行随机策略并最终解决迷宫。因为我们从未告诉过它应该高效地解决迷宫，所以随机移动直到解决迷宫仍然能让你获得奖励。\n\
  \n现在想象我们对 AI 在迷宫中走的每一步都给予 `-1`。现在 AI 有动力用最少的步骤解决迷宫，因此它倾向于通过这种方式找到更好的解决方案。我们将在书后的代码中演示这一点。注意负奖励就像是惩罚，事实确实如此。奖励只是我们一直使用的术语，无论是正还是负。它告诉你做得好还是坏。注意奖励总是实数。\n\
  \n## 动作\n\n到目前为止我们定义了这些术语：`agent`、`environment`、`state`和`reward`。我们需要讨论的最后一个重要概念是`actions`（动作）。动作是智能在其环境中的行为。例如，如果你是一个\
  \ `2-D` 视频游戏角色，你的动作可能是`上`、`下`、`左`、`右`和`跳`。这是一个有限动作集的示例。也有无限动作集的例子，但我们不会在书中讨论它。\n\
  \n我们讨论的最后 3 件事通常被认为三元组：你处于一个`状态`，采取一个`动作`，并获得一个`奖励`。\n\n\n\n\n\n我们将这些组称为 `(S,A,R)`\
  \ 或 `(state,action,reward)` 三元组。\n\n在强化学习中，时机也是一个重要的概念，因为你每次玩游戏时都会获得一系列状态、动作和奖励。\n\
  \n在这个框架内，你从一个状态 `S(t)` 开始，采取一个动作 `A(t)`，但你收到的奖励是 `R(t+1)`。\n\n因此，你获得的奖励总是来自于你上一个时刻所采取的状态和动作。\n\
  \n这个动作也会导致你处于一个新状态 `S(t+1)`。\n\n所以，另一个重要的三元组是 `(S(t), A(t), S(t+1))`。我们通常将其记为 `(s,\
  \ a, s')`。\n\n---\n\n这就是强化学习的概要。\n\n你编写智能体程序使其尝试变得智能。智能体通过处于状态、根据该状态采取动作来与环境交互，这又会将它带到另一个状态。当它到达下一个状态时，环境会给智能体一个奖励（正值或负）。\n\
  \n这一部分只是定义。在随后的章节中，我们将深入探讨理论并实现代码。\n\n\n在本节中，我将向你展示如何获取本课程的代码。我机器学习课程的所有代码都在我的 github\
  \ 仓库中：\n\n[`github.com/lazyprogrammer/machine_learning_examples`](https://github.com/lazyprogrammer/machine_learning_examples)\n\
  \n相关的文件夹是 `\"rl\"`。下载代码的命令是 `\"git clone\"` 加上我的 Github URL，你可以从仓库主页复制并粘贴它。\n\n\
  ```bash\ngit clone git@github.com:lazyprogrammer/machine_learning_examples.git\n\
  ```\n\n我建议使用 SSH URL，这样你每次执行任何操作时都不需要输入 github 密码。请确保定期检查更新或运行 `git pull` 以确保你拥有最新版本。本课程中的所有数据将在相关章节中提到（如果需要的话）。\n\
