- raw: '


    ![](Image00001.jpg)


    Artificial Intelligence: Reinforcement Learning in Python


    By: The LazyProgrammer


    [Introduction](#text00001.html#chapter-1)


    [How to Succeed](#text00002.html#chapter-2)


    [What is Reinforcement Learning?](#text00003.html#chapter-3)


    [Where to get the Code](#text00004.html#chapter-4)


    [The Multi-Armed Bandit](#text00005.html#chapter-5)


    [Tic-Tac-Toe](#text00006.html#chapter-6)


    [Tic Tac Toe in Code](#text00007.html#chapter-7)


    [Markov Decision Processes](#text00008.html#chapter-8)


    [Dynamic Programming](#text00009.html#chapter-9)


    [Monte Carlo](#text00010.html#chapter-10)


    [Temporal Difference Learning](#text00011.html#chapter-11)


    [Function Approximation](#text00012.html#chapter-12)


    [Conclusion](#text00013.html#chapter-13)


    # Introduction


    When people talk about artificial intelligence, they usually don’t mean supervised
    and unsupervised machine learning.


    These tasks are pretty trivial compared to what we think of AIs doing - playing
    chess and Go, driving cars, and beating video games at a superhuman level.


    Reinforcement learning has recently become popular for doing all of that and more.


    Much like deep learning, a lot of the theory was discovered in the 70s and 80s
    but it hasn’t been until recently that we’ve been able to observe first hand the
    amazing results that are possible.


    In 2016 we saw AlphaGo beat the world Champion in Go.


    We saw AIs playing video games like Doom and Super Mario.


    Self-driving cars have started driving on real roads with other drivers and even
    carrying passengers, all without human assistance.


    If that sounds amazing, brace yourself for the future because the law of accelerating
    returns dictates that this progress is only going to continue to increase exponentially.


    Yet learning about supervised and unsupervised machine learning is no small feat.
    To date I have over 16 courses just on those topics alone.


    And still reinforcement learning opens up a whole new world. As you’ll learn in
    this book, the reinforcement learning paradigm is more different from supervised
    and unsupervised learning than they are from each other.


    So what are we going to talk about in this book?


    What I noticed in reinforcement learning is that there is a huge gap between what
    you learn theory-wise and what you do during programming.


    The theory is super abstract so it’s important to continuously think about how
    it actually applies to doing AI tasks like controlling a robot or playing a game.


    So to that end, we are actually going to start this book with a game: slot machines.


    Slot machines, or the bandit problem, as it’s known in reinforcement learning,
    will introduce us to an important concept called the explore-exploit dilemma.
    You want to exploit the slot machine you believe is best, but you need to collect
    enough data from all the slot machines in order to be confident in that belief.


    We’ll discuss several techniques for making tradeoffs between exploration and
    exploitation, including the epsilon-greedy method, UCB1, and a Bayesian online
    learning technique.


    Reinforcement learning is all about trying to maximize a goal, or to use the terminology
    in this course, rewards.


    In A/B testing, the reward is a click on your advertisements or a conversion in
    your e-commerce store. It’s easy to see how trying to figure out which slot machine
    is best is the same as choosing the best advertisement to show, mathematically.


    \---


    The next game we’ll play is a simple game by the name of Tic Tac Toe.


    We’re going to start very low level - and come at it from the perspective of being
    a first-year computer science student. We’ll ask ourselves the question, “How
    would I code a game-playing agent that will never lose tic-tac-toe?”


    As you probably already know, there are only a very small set of rules that you
    need to follow in Tic Tac Toe in order to never lose.


    After going at it the naive way, we’ll introduce the reinforcement learning way
    of doing things, and code an agent from scratch that will train itself to play
    tic-tac-toe.


    \---


    In the following sections, we’ll introduce the central framework for solving reinforcement
    learning problems, known as the Markov Decision Process or MDP.


    MDPs will allow us to formalize and abstract all the concepts we learned about
    in tic-tac-toe, so that they can be applied to any game or scenario in the real-world.


    Then we’ll introduce 3 separate but related techniques for solving MDPs: dynamic
    programming, Monte Carlo methods, and temporal difference learning.


    These 3 techniques look very similar so I think what you’ll find interesting is
    that the hard part is actually differentiating between the 3.


    \---


    In the last section, we’ll do a little bit of a teaser and introduce what are
    known as approximation methods.


    The disadvantage of the previous 3 solutions to reinforcement learning is that
    they don’t scale to large state spaces, or in other words, environments where
    you can find yourself in a large number of different states.


    The solution to this problem is to use approximation methods, and as you might
    have guessed, this is where deep learning comes into play, since neural networks
    are very good “function approximators”.


    While we won’t explicitly cover deep learning in this course, this course provides
    all the techniques required to “plug-in” your deep neural networks into your reinforcement
    learning agents.


    Without the theory from this course, doing something like deep reinforcement learning
    wouldn’t make much sense.


    \---


    By the end of this book, you’ll understand the framework of reinforcement learning,
    how the 3 solutions work and the differences between each one, and how to use
    approximation methods to scale them up.


    When we talk about approximation methods you’ll understand exactly how you can
    “plug in” deep neural networks so that when we start talking about deep reinforcement
    learning (in a later book or course) we can just continue where we left off.


    So if you are interested in deep reinforcement learning but you don’t know where
    to start or even what the prerequisites are, this is the book you want to read.


    # How to Succeed


    In this chapter I’m going to give you tips on how to navigate this book and how
    to maximize your returns.


    Like other online resources, you don’t have exams or grades, so you really have
    to be the kind of person that takes initiative and is proactive about learning.


    That means understanding all the equations that get written down, and if there’s
    a derivation: making sure you understand each step and being able to do the derivation
    independently.


    That means writing all the code yourself and trying to do that before looking
    at my code. You should consider my code to be the “answer” to the problem, not
    just something you look at without thinking about the problem first.


    I think people that have taken my other courses and read my other books understand
    this but from time to time I still see students get confused about how exactly
    to practice.


    ## Prerequisites


    Firstly, if you did not know there were prerequisites to this book. Stop right
    now. You have already failed.


    This is the #1 reason I see people fail, or get mad at me for making my course/book
    “too hard”.


    To reiterate: in order to understand this course, you need to have a good handle
    on undergraduate-level calculus, probability, Markov models, linear machine learning
    models, and gradient descent. Of course you must know how to implement all these
    things in code as well.


    If you didn’t read these from the product description, and you think reinforcement
    learning is going to be as easy as how to make your own ads on Google AdWords,
    you are at the very bottom of the totem pole.


    If you did read the prerequisites in the course description, but felt confident
    enough in yourself that you’d “figure it out along the way” due to past experience
    in technical subjects, then you may possibly be a half step higher on the totem
    pole.'
