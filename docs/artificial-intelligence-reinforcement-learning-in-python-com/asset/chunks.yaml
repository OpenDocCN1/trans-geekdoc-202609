    \n然而，我们在本讲座中学习的算法又进了一步。它被称为价值迭代。它的作用是将策略评估和策略改进步骤合并为一步。它执行的是：`Vk+1 = max[a]{sum[s',\
    \ r]{p(s', r | s, a)(r + Vk)}`。它的有趣之处在于，它看起来和我们见过的公式几乎完全一样。事实上，如果你没留神，它看起来和我们见过的公式一模一样。这就是为什么我一直在说编写代码来尝试理解差异是非常重要的。你需要仔细观察这个，以查看它与我们过的其他贝尔曼方程的区别。这个方程与策略评估方程非常相似，只是我们对所有可能的动作取\
    \ `max`。\n\n从 `k` 索引可以看出，它也是迭代的。类似于策略评估，我们并不真的需要等待整个 `k` 次迭代的 `V` 可用后再开始计算 `(k+1)`\
    \ 次迭代的 `V`。我们可以直接“就地”更新它。注意它是如何在一个步内完成策略评估和策略改进的。这是因为策略改进是通过对右侧表达式取 `ARGMAX` 来实现的。所以通过直接取\
    \ `max`，我们实际上是在执行如果我们取了 `argmax` 时会选择的策略的评估步骤。\n\n让我们把这些都写成伪代码，这样你就有机会看一看。第一步是任意初始化\
    \ `V`。这可以是随机数或全为 0，这并不重要。然后我们进入一个无限循环。和策略评估一样，我们跟踪最大的变化，并在最大变化低于某个阈值时跳出循环，这表示收敛。这种方法与策略评估之间的唯一区别在于，我们对右侧的贝尔曼方程对所有动作取\
    \ `max`。在我们收敛后，通过对每个 `V(s)` 取 `argmax` 来输出策略 `pi(s)`。\n\n```\ninitialize V(s)\
