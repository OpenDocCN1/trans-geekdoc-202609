- raw: 'In the code, I also give you the option of one-hot encoding all the state-action
    pairs, which is equivalent to just doing regular SARSA without any approximation.


    So you can try that also to convince yourself that things are working.


    In order to implement this, we keep a dictionary called SA2IDX which maps state-action
    pairs to a unique index in X.


    This is similar to what you’ve seen in my NLP classes where we have a word2idx
    dictionary and we map each word in the vocabulary to a unique index in X.


    ## Semi-Gradient SARSA Code


    In this section we are going to implement semi-gradient SARSA in code.


    If you don’t want to try to code this yourself, although I highly recommend you
    do, the relevant file is approx\_semigradient\_sarsa\_control.py


    Remember that this is for solving the control problem, so the goal is to find
    the optimal policy.


    This is a semi-gradient method because we’re using temporal difference learning,
    and the target is not a true target, because it uses a model prediction.


    Because of this, the gradient we use is also not a true gradient, so we call this
    a semi-gradient method.


    At the top we have all our usual imports.


    `import numpy as np`


    `import matplotlib.pyplot as plt`


    `from grid_world import standard_grid, negative_grid`


    `from iterative_policy_evaluation import print_values, print_policy`


    `from monte_carlo_es import max_dict`


    `from sarsa import random_action, GAMMA, ALPHA, ALL_POSSIBLE_ACTIONS`


    ` `


    `SA2IDX = {}`


    `IDX = 0`


    We also create a dictionary for mapping state-action pairs to indexes, and a global
    index variable that keeps track of the number of state-action pairs we’ve already
    seen so that it can assign the next index.


    Next, we create our Model class.


    `def sa2x(self, s, a):`


    `# NOTE: using just (r, c, r*c, u, d, l, r, 1) is not expressive enough`


    `return np.array([`


    `s[0] - 1 if a == ''U'' else 0,`


    `s[1] - 1.5 if a == ''U'' else 0,`


    `(s[0]*s[1] - 3)/3 if a == ''U'' else 0,`


    `(s[0]*s[0] - 2)/2 if a == ''U'' else 0,`


    `(s[1]*s[1] - 4.5)/4.5 if a == ''U'' else 0,`


    `1 if a == ''U'' else 0,`


    `s[0] - 1 if a == ''D'' else 0,`


    `s[1] - 1.5 if a == ''D'' else 0,`


    `(s[0]*s[1] - 3)/3 if a == ''D'' else 0,`


    `(s[0]*s[0] - 2)/2 if a == ''D'' else 0,`


    `(s[1]*s[1] - 4.5)/4.5 if a == ''D'' else 0,`


    `1 if a == ''D'' else 0,`


    `s[0] - 1 if a == ''L'' else 0,`


    `s[1] - 1.5 if a == ''L'' else 0,`


    `(s[0]*s[1] - 3)/3 if a == ''L'' else 0,`


    `(s[0]*s[0] - 2)/2 if a == ''L'' else 0,`


    `(s[1]*s[1] - 4.5)/4.5 if a == ''L'' else 0,`


    `1 if a == ''L'' else 0,`


    `s[0] - 1 if a == ''R'' else 0,`


    `s[1] - 1.5 if a == ''R'' else 0,`


    `(s[0]*s[1] - 3)/3 if a == ''R'' else 0,`


    `(s[0]*s[0] - 2)/2 if a == ''R'' else 0,`


    `(s[1]*s[1] - 4.5)/4.5 if a == ''R'' else 0,`


    `1 if a == ''R'' else 0,`


    `1`


    `])`


    `# if we use SA2IDX, a one-hot encoding for every (s,a) pair`


    `# in reality we wouldn''t want to do this b/c we have just`


    `# as many params as before`


    `# x = np.zeros(len(self.theta))`


    `# idx = SA2IDX[s][a]`


    `# x[idx] = 1`


    `# return x`


    ` `


    `def predict(self, s, a):`


    `x = self.sa2x(s, a)`


    `return self.theta.dot(x)`


    ` `


    `def grad(self, s, a):`


    `return self.sa2x(s, a)`


    The init function is the same as before, it just initializes theta. Notice how
    the dimensionality is now 25.


    Next, we have our feature transformer function, sa2x. It creates all the features
    we talked about in the previous lecture.


    You can also comment this out, since underneath I give you the option of one-hot
    encoding the state-action pairs as well.


    Using that would be the equivalent of doing regular SARSA.


    Next, we have the predict and gradient functions, which are the same as before.


    Next, we have a function called getQs. The reason we need this is because at some
    point during SARSA, we need to take the argmax over Q, but we can’t do that if
    Q isn’t represented as a dictionary.


    `def getQs(model, s):`


    `# we need Q(s,a) to choose an action`


    `# i.e. a = argmax[a]{ Q(s,a) }`


    `Qs = {}`


    `for a in ALL_POSSIBLE_ACTIONS:`


    `q_sa = model.predict(s, a)`


    `Qs[a] = q_sa`


    `return Qs`


    So the job of this function is to turn the Q predictions into a dictionary given
    some state s.


    \---


    Next, we have the main section.


    We use the negative grid here but you are welcome and encouraged to try the standard
    grid too.


    `if __name__ == ''__main__'':`


    `grid = negative_grid(step_cost=-0.1)`


    ` `


    `print "rewards:"`


    `print_values(grid.rewards, grid)`


    ` `


    `# no policy initialization, we will derive our policy from most recent Q`


    `# enumerate all (s,a) pairs, each will have its own weight in our "dumb" model`


    `# essentially each weight will be a measure of Q(s,a) itself`


    `states = grid.all_states()`


    `for s in states:`


    `SA2IDX[s] = {}`


    `for a in ALL_POSSIBLE_ACTIONS:`


    `SA2IDX[s][a] = IDX`


    `IDX += 1`


    We print the rewards, and then we populate the SA2IDX dictionary.


    Next, we initialize the model, and then we enter the main loop.


    `# initialize model`


    `model = Model()`


    ` `


    `# repeat until convergence`


    `t = 1.0`


    `t2 = 1.0`


    `deltas = []`


    `for it in xrange(20000):`


    `if it % 100 == 0:`


    `t += 10e-3`


    `t2 += 0.01`


    `if it % 1000 == 0:`


    `print "it:", it`


    `alpha = ALPHA / t2`


    Notice I have 2 time variables here, t and t2, since I want the learning rate
    and epsilon to decrease at different rates.


    These are hyperparameters, so you would only be able to find good values via experimentation.


    Next, we go into the main loop. Notice how we need to use the getQs function here
    before we use max\_dict.


    \---


    Next, we enter the game loop.


    `s = (2, 0) # start state`


    `grid.set_state(s)`


    ` `


    `# get Q(s) so we can choose the first action`


    `Qs = getQs(model, s)`


    ` `


    `a = max_dict(Qs)[0]`


    `a = random_action(a, eps=0.5/t) # epsilon-greedy`


    `biggest_change = 0`


    `while not grid.game_over():`


    `r = grid.move(a)`


    `s2 = grid.current_state()`


    ` `


    `# we need the next action as well since Q(s,a) depends on Q(s'',a'')`


    `# if s2 not in policy then it''s a terminal state, all Q are 0`


    `old_theta = model.theta.copy()`


    `if grid.is_terminal(s2):`


    `model.theta += alpha*(r - model.predict(s, a))*model.grad(s, a)`


    `else:`


    `# not terminal`


    `Qs2 = getQs(model, s2)`


    `a2 = max_dict(Qs2)[0]`


    `a2 = random_action(a2, eps=0.5/t) # epsilon-greedy`


    ` `


    `# we will update Q(s,a) AS we experience the episode`


    `model.theta += alpha*(r + GAMMA*model.predict(s2, a2) - model.predict(s, a))*model.grad(s,
    a)`


    `# next state becomes current state`


    `s = s2`


    `a = a2`


    ` `


    `biggest_change = max(biggest_change, np.abs(model.theta - old_theta).sum())`


    `deltas.append(biggest_change)`


    ` `


    `plt.plot(deltas)`


    `plt.show()`


    Similar to the TD(0) prediction script, we have a different target depending on
    whether or not we’re in a terminal state.


    If we’re in a terminal state, I already know Q(s’,a’) is 0, so I can make a more
    accurate target.


    Everything else in the script should be stuff you’ve seen before.


    Run this and see what you get.


    ## Summary and Next Steps


    In this section we are going to summarize what we covered in this chapter, and
    what we covered in this book.


    We are also going to discuss possible next steps - some ideas for what to study
    next in reinforcement learning.


    \---


    This chapter was all about approximation methods.


    We learned early on in the course that the state space of an MDP can quickly grow
    too large to enumerate, and hence, trying to store a value function that needs
    to be defined for every state in the state space, can be infeasible.


    Approximation methods allow us to parameterize the value function, so that effectively
    we need a smaller number of parameters than the size of the state space.


    Specifically, we learned that differentiable models are a good fit, because we
    can use stochastic gradient descent, and continue learning in an online fashion,
    like we’ve done throughout the book.


    Remember that online learning is desirable, because episodes can be very long,
    so it’s good if our agent can improve during the episode.'
