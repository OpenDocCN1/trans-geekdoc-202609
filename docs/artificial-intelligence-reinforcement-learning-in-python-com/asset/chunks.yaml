    # Reinforcement Learning Overview


    Reinforcement learning algorithms have objectives in terms of a goal. This is
    different from supervised learning, where the objective is to get good accuracy
    or to minimize a cost function.


    Reinforcement learning algorithms get feedback as the agent interacts with its
    environment. So feedback signals, or as we like to call them, “rewards”, are given
    automatically to the agent by the environment.


    This is much different from supervised learning where it can be extremely costly
    and time-consuming to obtain hand-labeled data. So in this way reinforcement learning
    is very different from supervised learning. Supervised learning requires a hand-labeled
    dataset, reinforcement learning learns automatically from signals in the environment,
    so there is no need for hand-labeled data.


    ## The Concept of a Goal


    Let’s expand on this idea of a goal. Phasing our objective in terms of goals allows
    us to solve a much wider variety of problems.


    - The goal of `AlphaGo` is to win Go.

