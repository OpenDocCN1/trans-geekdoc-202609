    ` `


    `# initial policy`


    `print "initial policy:"`


    `print_policy(policy, grid)`


    ` `


    `# initialize V(s)`


    `V = {}`


    `states = grid.all_states()`


    `for s in states:`


    `# V[s] = 0`


    `if s in grid.actions:`


    `V[s] = np.random.random()`


    `else:`


    `# terminal state`


    `V[s] = 0`


