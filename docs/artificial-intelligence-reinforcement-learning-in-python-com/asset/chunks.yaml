- raw: 'That means, given the right architecture, a neural network can approximate
    any function to an arbitrary degree of accuracy.


    In practice, they don’t perform perfectly but they do perform very well.


    Mathematically, what we are going to do, is first do a feature extraction.


    So from the state s, we can extract a feature vector x.


    Our goal is to find a function, that takes in a feature vector x, and a set of
    parameters theta, that faithfully approximates the value function, V(s).


    x = get\_features(s) = phi(s)


    f(x; phi) = theta.dot(x) = theta.dot(phi(s))


    f(x; phi) ~= V(s) <-- our goal


    \---


    In this book, we are going to focus specifically on linear methods.


    As you’ll see, function approximation methods require us to use models that are
    differentiable.


    So you wouldn’t be able to use something like a decision tree or k-nearest neighbor.


    In the sequel to this book, we’ll look at deep learning methods, which are also
    differentiable.


    Unlike linear methods, we won’t need to do feature engineering beforehand, although
    we could. Deep learning models are much more expressive and do a lot of the work
    automatically.


    Models like convolutional neural networks will allow us to use raw pixel data
    as the state, and the neural network will do its own automatic feature extraction
    and selection.


    However, those are harder to implement, and take away from the main focus of this
    course, which is the fundamentals of reinforcement learning.


    So you don’t need to know anything about deep learning to get through this course,
    but you do need to know about some basic machine learning techniques like linear
    regression and gradient descent.


    \---


    The outline of this chapter is as follows.


    We are first going to apply approximation methods to Monte Carlo prediction.


    That means we’ll be estimating the value function given a fixed policy, but instead
    of representing the value function as a dictionary indexed by state, we’ll use
    a linear function approximator.


    Recall that Monte Carlo methods require us to play the entire episode and calculate
    the returns before doing any updates.


    Next, we’ll apply approximation methods to TD(0) for prediction.


    Remember that TD(0) takes aspects of both Monte Carlo sampling and the bootstrapping
    method of dynamic programming.


    After doing the prediction problem, we’ll move on to the control problem, and
    we’ll use SARSA for this, but we’ll of course be replacing Q with a linear function
    approximator.


    \---


    One thing to keep in mind in this section, is that you can always sanity check
    your work, by comparing your results to the non-approximated versions of the code.


    Since we’re doing approximation, we don’t expect our answers to be exactly equal
    to the non-approximated versions, but they should be close.


    One obstacle you may encounter is that your algorithm might be implemented perfectly,
    but your model is bad.


    Remember that linear models are not very expressive.


    So if you extract a poor set of features, your model won’t be able to learn the
    value function well.


    Or in other words, your model will have a large error.


    To avoid this, you’ll have to proactively think about what features are good for
    mapping states to values. You’ll have to put in manual work on feature engineering
    in order to improve your results.


    ## Linear Models


    In this lecture, we are going to discuss linear models in the context of reinforcement
    learning.


    In particular, what we are doing here is applying supervised learning to reinforcement
    learning.


    Recall that supervised learning basically amounts to function approximation.


    We’re trying to find a parameterized function that closely approximate the true
    function.


    In this case, that true function is the value function that we used to solve MDPs.


    \---


    Earlier in the course, we talked about the fact that rewards have to be real numbers.


    Since returns are sums of rewards, they are also real numbers.


    And since values are expected values of returns, they are also real numbers.


    So if you think of the possible supervised learning methods we have: classification
    and regression, it should be clear that what we want to do here is regression.


    \---


    In particular, we want our estimate of V to be close to the true V.


    As you know, for all supervised learning methods we need a cost function, and
    the appropriate cost function for regression is squared error.


    We can thus represent the error as the squared difference between V and V\_hat.


    Error = \[V(s) - V\_hat(s)\]^2


    \---


    Now that we have our basic error function, we can replace V with its definition,
    which is the expected value of the return.


    Error = \[E\[G(t) | S(t)=s\] - V\_hat(s)\]^2


    But since we don’t actually know this expected value, we need to replace it with
    something else.


    \---


    In particular, we can replace it with the sample mean of the actual returns.


    Recall that this is the approach we took when we studied Monte Carlo methods.


    Error = \[ (1/N) sum\[i=1..N\]{ G(i,s) - V\_hat(s) \]^2


    \---


    An alternative way of looking at this, is that we treat each state and return
    pair as a training sample.


    In this way, what we’ll try to do is minimize the squared difference between all
    of the G and V\_hats simultaneously.


    Error = sum\[i=1..N\]{ \[G(i,s) - V\_hat(s)\]^2 }


    So this should look more like what we’re used to when we’re doing regression,
    which is the sum of the squared differences between all the y’s and y\_hats.


    Error = sum\[i=1..N\]{ \[y(i) - y\_hat(i)\]^2 }


    \---


    The advantage of representing the error function in this way, is it allows us
    to do stochastic gradient descent.


    If you recall, this is where do take a small step in the direction of the gradient
    with respect to the cost of only one sample at a time.


    This is perfect for our needs, because at every iteration of the game, we’ll only
    have one state and return pair to look at.


    \---


    If you recall, V\_hat is parameterized by theta.


    In other words, what we are trying to find is the theta that allows V\_hat to
    be the best approximation.


    To achieve this, we want to do gradient descent with respect to theta, and minimize
    the error we derived earlier.


    V\_hat(s) = theta.dot(phi(s)) = theta.dot(x)


    theta = theta - alpha\*d(Error)/d(theta)


    Alpha once again represents the learning rate.


    \---


    We can take this a step further and replace the error with the squared difference
    we saw earlier.


    Remember this is stochastic gradient descent so we’re only looking at ONE sample
    of G at a time.


    theta = theta + alpha\*\[G -V\_hat(s)\] d(V\_hat(s))/d(theta)


    \---


    Recall that we are looking only at linear models in this class, so V\_hat is the
    dot product of the feature vector x and theta.


    In other words, the derivative of V with respect to theta, is x.


    theta = theta + alpha\*\[G -V\_hat(s)\] x


    \---


    Something interesting happens when you think back to our Monte Carlo methods,
    or in other words, when we were not parameterizing V\_hat.


    Instead, V\_hat(s) itself was the parameter we were trying to find, and we were
    trying to find it for all states s.


    If V\_hat(s) is itself the parameter, then we get this update equation.


    V(s) = V(s) + alpha\*(G - V(s))d\[V(s)\]/d\[V(s)\]


    V(s) = V(s) + alpha\*(G - V(s))


    But if you recall, this is the exact same equation we had before for updating
    the mean!


    So you see what we were doing before to find V, was actually an instance of gradient
    descent.


    ## Features


    In this lecture we are going to discuss feature engineering.


    Recall that neural networks can in some sense, automatically find good nonlinear
    transformations, or in other words, features, of the data.


    But in this book we are only going to study linear methods, which means we’ll
    have to come up with features on our own.


    \---


    One way you can think of states is that they are categorical variables.


    So for example, with Gridworld, you can think of position (0,0) as category 1,
    position (0,1) as category 2, and so on.'
