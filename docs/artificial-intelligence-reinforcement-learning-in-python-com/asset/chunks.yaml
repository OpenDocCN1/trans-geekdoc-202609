- raw: 'Next we have the reward function.


    As we stated before the reward is 1 if we win the game, otherwise the reward is
    0.


    `def reward(self, sym):`


    `# no reward until game is over`


    `if not self.game_over():`


    `return 0`


    ` `


    `# if we get here, game is over`


    `# sym will be self.x or self.o`


    `return 1 if self.winner == sym else 0`


    Reinforcement learning is defined such that a reward is given as feedback on every
