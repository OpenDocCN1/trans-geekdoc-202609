    ## MC for Finding Q / Exploring-Starts Optimization


    As you’ll recall, the pattern we want to follow us to first look at how to solve
    the prediction problem, which is finding a value function given a policy, and
    then to look at how to solve the control problem, which is how to find the optimal
    policy.


    In this section, we are going to start thinking about how to find the optimal
    policy using Monte Carlo.


    You should realize that when we try to do that, we come across a major problem.


    The problem is, we only have V(s) for a given policy, but we don’t know what actions
    will lead to a better V(s), because we can’t do a look-ahead search.


    With Monte Carlo, all we’re able to do is play an episode straight through and
    use the returns as samples.


    The key to using Monte Carlo for the control problem then, is to find Q, since
    Q is indexed by both s and a, and we can choose the argmax over a to determine
    the best policy.


    \---


    So how do we use Monte Carlo to find Q?


    The process is largely the same as for finding V, except that instead of just
    returning tuples of states and returns, we’ll return triples of states, actions,
    and returns.


    \---


    You can already see why this might be problematic.


    Recall that the number of values we need to store grows quadratically with the
    state set size and the action set size.


    That means, we have a lot more values to approximate, and that means we need to
    do many more steps of Monte Carlo in order to get a good answer.


    \---


    There is another problem with trying to estimate Q.


    This goes back to our explore-exploit dilemma.


    If we have a fixed policy, then every Q(s,a) will only have samples for one action.


    This means that out of |S|x|A| values we need to fill in, we’ll only be able to
    fill in 1/|A| of the values.


    \---


    The way we can fix this is, as we discussed earlier, using the “exploring starts”
    method.


    With exploring starts for Q, we now randomly choose an initial state and an initial
    action.


    Thereafter we follow the policy, and so the answer we get is Q\_pi(s, a).


    This is consistent with our definition of Q, which is the expected value of the
    return, given that we’re in state s and doing action a.


    Q(s,a) = E\[G(t) | S(t)=s,A(t)=a\]


    \---


    We can now return to the control problem.


    If you think carefully, you’ll realize we already know the answer to this problem.


    We discussed earlier how the method we can always use to find an optimal policy
    is generalized policy iteration, where we alternate between the policy evaluation
    and policy improvement steps.


    For policy evaluation, we just discussed that. We just use Monte Carlo to get
    an estimate for Q.


    The policy improvement step is the same as always, we just take the argmax over
    the actions from Q.


    pi(s) = argmax\[a\]{ Q(s,a) }


    \---


    One issue with this, as we already discussed, is that because we need to find
    Q over all states across all actions, this can take a very long time using sampling.


    And so we again have this problem where there’s an iterative algorithm inside
    another iterative algorithm.


    \---


    The solution to this is to take the same approach as we do with value iteration.


    Instead of doing a fresh Monte Carlo policy evaluation on each round, where it
    would take a long time to collect samples, all we do is keep updating the same
    Q, and do policy improvement after every single episode.


    This means that, on every iteration of the outer loop, we generate only one episode,
    use that episode to improve our estimate of Q, and then immediately do the policy
    improvement step.


    \---


    Let’s look at this in pseudocode to solidify this idea.


    The first step is to initialize Q and pi randomly.


    `Q = random, pi = random`


    `while True:`


    `choose random start state s`


    `states, actions, returns = generate an episode starting from s`


    `# evaluation step`


    `for s, a, G in zip(states, actions, returns):`


    `all_returns(s, a).append(G)`


    `Q(s,a) = mean(all_returns(s,a))`


    ` `


    `# improvement step`


    `pi(s) = argmax[a]{ Q(s,a) }`


    And then, in an infinite loop, we first choose a random state and a random action
    to start from.


    Remember this is called the exploring-starts method.'
