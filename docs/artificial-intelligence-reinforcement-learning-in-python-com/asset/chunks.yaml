- raw: 'In my first Bayesian machine learning class, you learned that a Gaussian likelihood
    is conjugate with a Gaussian prior on the mean.


    If we place a prior ONLY on the mean mu, and assume the variance is fixed, we
    can start with these forms of the likelihood and prior.


    You can see that we’re using precision parameters which is the inverse variance.
    This makes the math a little easier to work with.


    X ~ Normal(mu, tau ^ (-1)),


    mu ~ Normal(m, lambda ^ (-1))


    The parameters for the mu distribution are “m” and “lambda”, and so what we are
    looking for is the update equations for “m” and “lambda”.


    We can solve for the new m and the new lambda by using Bayes rule again:


    p(mu | X) proportional to p(X | mu)p(mu)


    You should find that:


    lambda’ = lambda + tau\*N


    m’ = \[ m\*lambda + tau\*sum\[i=1..N\]{ X(i) } \] / lambda’


    Remember that N = number of samples we’ve collected and X(i) represents one sample.


    I would strongly recommend going through the math so that you can solve this yourself
    (it’s highly non-trivial to represent formulae in this ebook format).


    \---


    The last step of this, is to talk about how we apply it to the bandit problem.


    The answer is sampling.


    The key part is again the line of code where we choose the bandit.


    Rather than choosing the argmax of the upper confidence bound like we did with
    UCB1, we’re going to choose the argmax of samples from each of the bandit means.


    Remember the means are now probability distributions, so we can draw samples from
    them.


    How does this help us explore and exploit?


    Well you saw in the demo earlier that the distribution always starts out as fat
    and then gradually becomes skinnier.


    When the distribution is fat, we still have a high chance of sampling a very high
    number, and hence when the distribution is fat, we are encouraged to explore more
    often.


    When the distribution becomes skinny and we become more confident in our estimates,
    we explore less and exploit more, since the sample will always be in a very narrow
    range.


    So sampling from the Bayesian posterior automatically controls how much exploration
    and exploitation we do.


    ## Comparing Thompson Sampling to Others


    In this section we are going to write one big script to compare all of the explore-exploit
    solutions to each other.


    We have 4 techniques to compare: epsilon-greedy, optimistic initial values, UCB1,
    and Bayesian sampling.


    Since we already know epsilon-greedy performs sub-par, we’re going to modify it.
    How we’re going to do that, is use a decaying epsilon. In particular, we’ll set
    epsilon to 1/t, where t is the iteration number.


    We’ll see that in the end all of these perform about the same, which justifies
    using epsilon-greedy throughout the book.


    If you don’t want to code this yourself, although I highly recommend you do, the
    relevant file in the course repo is comparing\_explore\_exploit\_methods.py


    `import numpy as np`


    `import matplotlib.pyplot as plt`


    `from comparing_epsilons import Bandit`


    `from optimistic_initial_values import run_experiment as run_experiment_oiv`


    `from ucb1 import run_experiment as run_experiment_ucb`


    ` `


    `class BayesianBandit:`


    `def __init__(self, m):`


    `self.m = m`


    `# parameters for mu - prior is N(0,1)`


    `self.m0 = 0`


    `self.lambda0 = 1`


    `self.sum_x = 0 # for convenience`


    `self.tau = 1`


    ` `


    `def pull(self):`


    `return np.random.randn() + self.m`


    ` `


    `def sample(self):`


    `return np.random.randn() / np.sqrt(self.lambda0) + self.m0`


    ` `


    `def update(self, x):`


    `# assume tau is 1`


    `self.lambda0 += 1`


    `self.sum_x += x`


    `self.m0 = self.tau*self.sum_x / self.lambda0`


    ` `


    ` `


    `def run_experiment_decaying_epsilon(m1, m2, m3, N):`


    `bandits = [Bandit(m1), Bandit(m2), Bandit(m3)]`


    ` `


    `data = np.empty(N)`


    `for i in xrange(N):`


    `# epsilon greedy`


    `p = np.random.random()`


    `if p < 1.0/(i+1):`


    `j = np.random.choice(3)`


    `else:`


    `j = np.argmax([b.mean for b in bandits])`


    `x = bandits[j].pull()`


    `bandits[j].update(x)`


    ` `


    `# for the plot`


    `data[i] = x`


    `cumulative_average = np.cumsum(data) / (np.arange(N) + 1)`


    ` `


    `# plot moving average ctr`


    `plt.plot(cumulative_average)`


    `plt.plot(np.ones(N)*m1)`


    `plt.plot(np.ones(N)*m2)`


    `plt.plot(np.ones(N)*m3)`


    `plt.xscale(''log'')`


    `plt.show()`


    ` `


    `for b in bandits:`


    `print b.mean`


    ` `


    `return cumulative_average`


    ` `


    ` `


    `def run_experiment(m1, m2, m3, N):`


    `bandits = [BayesianBandit(m1), BayesianBandit(m2), BayesianBandit(m3)]`


    ` `


    `data = np.empty(N)`


    `for i in xrange(N):`


    `# optimistic initial values`


    `j = np.argmax([b.sample() for b in bandits])`


    `x = bandits[j].pull()`


    `bandits[j].update(x)`


    ` `


    `# for the plot`


    `data[i] = x`


    `cumulative_average = np.cumsum(data) / (np.arange(N) + 1)`


    ` `


    `# plot moving average ctr`


    `plt.plot(cumulative_average)`


    `plt.plot(np.ones(N)*m1)`


    `plt.plot(np.ones(N)*m2)`


    `plt.plot(np.ones(N)*m3)`


    `plt.xscale(''log'')`


    `plt.show()`


    ` `


    `return cumulative_average`


    ` `


    `if __name__ == ''__main__'':`


    `eps = run_experiment_decaying_epsilon(1.0, 2.0, 3.0, 100000)`


    `oiv = run_experiment_oiv(1.0, 2.0, 3.0, 100000)`


    `ucb = run_experiment_ucb(1.0, 2.0, 3.0, 100000)`


    `bayes = run_experiment(1.0, 2.0, 3.0, 100000)`


    ` `


    `# log scale plot`


    `plt.plot(eps, label=''decaying-epsilon-greedy'')`


    `plt.plot(oiv, label=''optimistic'')`


    `plt.plot(ucb, label=''ucb1'')`


    `plt.plot(bayes, label=''bayesian'')`


    `plt.legend()`


    `plt.xscale(''log'')`


    `plt.show()`


    ` `


    ` `


    `# linear plot`


    `plt.plot(eps, label=''decaying-epsilon-greedy'')`


    `plt.plot(oiv, label=''optimistic'')`


    `plt.plot(ucb, label=''ucb1'')`


    `plt.plot(bayes, label=''bayesian'')`


    `plt.legend()`


    `plt.show()`


    Note that we make use of already-written code.


    Remember that mu is now no longer something we’re trying to find a fixed estimate
    of, it’s a random variable whose whose distribution has fixed parameters.


    Bayesian methods are kind of like Inception, so your parameters are random variables,
    but the parameters of the distributions of the original parameters can also be
    random variables, and so on.


    Since the posterior depends on the sum of X, we keep that as an instance variable
    for convenience. We also know that tau is 1.


    The new method here is the sample method, which generates a sample from a Gaussian
    with mean m0 and precision lambda0.


    The update method just implements the update equations I showed you in the last
    section.


    Now we have a function for running the epsilon-greedy experiment with a decaying
    epsilon. This is largely the same as before, but epsilon is now 1/(i + 1).


    Next we have the run\_experiment function for Bayesian sampling. The only major
    change is, as usual in the argmax part, where we call the sample function from
    earlier.


    In the main section, we run all 4 experiments, and plot the results.


    After running the script, you should see that all the methods are about equal.
    Which method comes out on top usually changes each time you run the script.


    ## Nonstationary Bandits


    In this lecture we are going to discuss the issue of nonstationarity and look
    at some of the equations we’ve seen more in-depth.


    This will be useful for later lectures since the same equations are going to show
    up again and again.


    So what do we mean by nonstationarity?


    A stationary process is a process whose statistics don’t change over time.


    We are interested in the mean, but strictly speaking, there are different types
    of stationarity.


    Weak-sense stationarity is when the mean and autocovariance don’t change over
    time. The autocovariance is a 2nd order statistic.


    There is also strong-sense stationarity where the entire PDF has to remain the
    same over time. This is the kind of stationarity that we have, because each bandit
    has the same distribution each time you pull its arm.


    Note that a strong-sense stationary process is also a weak-sense stationary process
    but the reverse is not true.


    The question is, what if the bandits weren’t stationary? Would it then make sense
    to calculate the mean as we have been?'
