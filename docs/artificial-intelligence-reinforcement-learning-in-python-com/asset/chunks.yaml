    ## Policy Iteration for Windy Gridworld


    In this lecture, I’m going to describe to you a modification of our environment
    called “Windy Gridworld”.


    Recall that we have 2 probability distributions to deal with.


    First there’s pi(a | s), which is the probability of doing action a when in state
    s.


    And then there’s the state transition probability p(s’,r | s,a). So far this has
    been deterministic. When we do action a in state s, we always end up in the same
    state s’.


    This is also tied to the reward, since Gridworld gives you a reward based on the
    state you land in.


    In this lecture, we’re going to consider the case where this probability distribution
    is not deterministic, or in other words, the probability will have a value between
    0 and 1.


    \---


    This is where Windy Gridworld comes into play.


    Imagine you’re walking through a windy street. You try to walk straight but the
    wind pushes you backwards or to the left.


    The same thing is going to happen to our agent. The agent will try to go “up”,
    but sometimes, the environment will push it in some other direction instead.


    In our case, we’ll set the probability of doing the intended action to be 0.5,
    and the probability of the other 3 actions to be 0.5/3.


    We will again be looking at code for policy iteration, which also covers policy
    evaluation since it’s already part of the main loop.


    If you don’t want to code this yourself, although I highly recommend you do, the
    relevant file for this lecture is policy\_iteration\_random.py


    \---


    At the top most of the stuff was just copied and pasted from the initial policy\_iteration
    script.


    `import numpy as np`


    `from grid_world import standard_grid, negative_grid`


    `from iterative_policy_evaluation import print_values, print_policy`


    ` `


    `SMALL_ENOUGH = 10e-4`


    `GAMMA = 0.9`


    `ALL_POSSIBLE_ACTIONS = (''U'', ''D'', ''L'', ''R'')`


    ` `


    `# next state and reward will now have some randomness`


    `# you''ll go in your desired direction with probability 0.5`


    `# you''ll go in a random direction a'' != a with probability 0.5/3`


    ` `


    `if __name__ == ''__main__'':`


    `grid = negative_grid(step_cost=-1.0)`


    One of the main differences with this script, other than the fact that we’re now
    in probabilistic windy Gridworld, is I’ve changed the step cost.


    What happens when we set the step cost to -1?


    Since the goal only gives you +1 reward, and the losing state gives you a -1 reward,
    you’ll see that the agent actually wants to end the game as soon as possible,
    even if this means ending up in the losing state.


    For example, if you’re 3 steps away from the goal, you’d get -3 reward before
    you have a chance to get to the goal. But if you’re only 1 step away from the
    losing state, then you only get -1 reward.


    Remember that the goal of the agent isn’t to get to what we’ve defined as the
    winning or losing states. All it does is try to maximize its reward.


    So I’d recommend trying different grids with different step costs to observe what
    happens.


