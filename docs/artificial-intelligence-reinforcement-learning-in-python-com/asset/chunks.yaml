  trans: "\n在我的第一门贝叶斯机器学习课程中，你学习了高斯似然分布与均值的高斯先验是共轭的。\n\n如果我们**只**对均值 `mu` 放置先验，并假设方差是固定的，我们可以从这些形式的似然和先验开始。\n\
    \n你可以看到我们正在使用精度参数（precision parameters），它是方差的倒数。这使得数学计算更容易一些。\n\n```\nX ~ Normal(mu,\
    \ tau ^ (-1)),\nmu ~ Normal(m, lambda ^ (-1))\n```\n\n`mu` 分布的参数是 `m` 和 `lambda`，因此我们寻找的是\
    \ `m` 和 `lambda` 的更新方程。\n\n我们可以再次使用贝叶斯公式来求解新的 `m` 和新的 `lambda`：\n\n```\np(mu |\
    \ X) proportional to p(X | mu)p(mu)\n```\n\n你将会发现：\n\n```\nlambda’ = lambda +\
    \ tau*N\nm’ = [ m*lambda + tau*sum[i=1..N]{ X(i) } ] / lambda’\n```\n\n记住 `N`\
    \ 是我们收集的样本数量，而 `X(i)` 代表一个样本。\n\n我强烈建议仔细读一遍数学推导，以便你自己自己求解（在这个电子书格式中表示公式是非常困难的）。\n\
    \n---\n\n这一步的最后一步是讨论我们如何将其应用于老虎机问题（bandit problem）。\n\n答案是采样（sampling）。\n\n关键部分再次是选择老虎机的那行代码。\n\
    \n我们不再像在使用 `UCB1` 时那样选择上置信边界的 `argmax`，而是将选择从每个老虎机均值中抽取的样本的 `argmax`。\n\n记住均值现在是概率分布，所以我们可以从中抽取样本。\n\
    \n这如何帮助我们进行探索（explore）和利用（exploit）呢？\n\n嗯，你从之前的演示中看到，分布开始时总是是肥胖的，然后逐渐变得很窄。\n\n\
    当分布很宽时，我们仍很有概率采样到一个非常大的数值，因此当分布很宽时，我们被鼓励更多地探索。\n\n当分布变窄且我们对自己的估计更有信心时，我们就会减少探索并增加利用，因为样本将始终在一个非常窄的范围内。\n\
    \n所以，从贝叶斯后验分布中采样会自动控制我们进行多少探索和利用。\n\n## 汤普斯采样与其他方法的比较\n\n在这一节中，我们将编写一个大脚本来比较所有的探索-利用解决方案。\n\
    \n我们有 4 种技术需要比较：epsilon-greedy（epsilon-greedy）、乐观初始值（optimistic initial values）、`UCB1`\
    \ 和贝叶斯采样。\n\n由于我们已经知道 epsilon-greedy 一般，我们将对其进行修改。我们的方法是使用衰减 epsilon。具体来说，我们将\
    \ `epsilon` 设置为 `1/t`，其中 `t` 是迭代次数。\n\n我们将看到最后这些方法的性能大大相同，这证明了在书中中使用 epsilon-greedy\
    \ 是合理的。\n\n如果你不想自己写代码（尽管我强烈建议你这么做），课程仓库中的相关文件是 `comparing_explore_exploit_methods.py`。\n\
    \n```python\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom comparing_epsilons\
    \ import Bandit\nfrom optimistic_initial_values import run_experiment as run_experiment_oiv\n\
    from ucb1 import run_experiment as run_experiment_ucb\n\nclass BayesianBandit:\n\
    \    def __init__(self, m):\n        self.m = m\n        # parameters for mu -\
    \ prior is N(0,1)\n        self.m0 = 0\n        self.lambda0 = 1\n        self.sum_x\
    \ = 0 # for convenience\n        self.tau = 1\n\n    def pull(self):\n       \
    \ return np.random.randn() + self.m\n\n    def sample(self):\n        return np.random.randn()\
    \ / np.sqrt(self.lambda0)\n\n    def update(self, x):\n        # assume tau is\
    \ 1\n        self.lambda0 += 1\n        self.sum_x += x\n        self.m0 = self.tau*self.sum_x\
    \ / self.lambda0\n\ndef run_experiment_decaying_epsilon(m1, m2, m3, N):\n    bandits\
    \ = [Bandit(m1), Bandit(m2), Bandit(m3)]\n\n    data = np.empty(N)\n    for i\
    \ in xrange(N):\n        # epsilon greedy\n        p = np.random.random()\n  \
    \      if p < 1.0/(i+1):\n            j = np.random.choice(3)\n        else:\n\
    \            j = np.argmax([b.mean for b in bandits])\n        x = bandits[j].pull()\n\
    \        bandits[j].update(x)\n\n        # for the plot\n        data[i] = x\n\
    \        cumulative_average = np.cumsum(data) / (np.arange(N) + 1)\n\n       \
    \ # plot moving average ctr\n        plt.plot(cumulative_average)\n        plt.plot(np.ones(N)*m1)\n\
    \        plt.plot(np.ones(N)*m2)\n        plt.plot(np.ones(N)*m3)\n        plt.xscale('log')\n\
    ```\n\n## 非平稳老虎机\n\n在本节中，我们将讨论非平稳性问题，并更深入地观察之前的一些公式。这对于后续课程非常有帮助，因为相同的公式会反复出现。\n\
    \n那么，什么是非平稳性？\n\n平稳过程是指统计特性不随时间变化的过程。\n\n我们关注的是均值，但严格来说，有不同的平稳类型。\n\n弱平稳是指均值和自协方差不随时间变化。自协方差是一个二阶统计量。\n\
    \n还有强平稳性，即整个概率密度函数（PDF）必须随时间保持不变。这就是我们拥有的平稳性，因为每次你拉动老虎机的手臂时，它的分布都是相同的。\n\n注意，强平稳过程也是弱平稳过程，但反之不然。\n\
    \n问题是，如果老虎机不是平稳的，那么像之前这样计算均值还有意义吗？\n"
