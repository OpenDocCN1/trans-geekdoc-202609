- raw: 'We then choose the next action based on epsilon-greedy and the current Q.
    We’ll call this a’.


    Next, we do our update for Q(s,a), which depends on: Q(s,a), r, and Q(s’,a’).


    Next, we update s to be s’, and we update a to be a’.


    \---


    One interesting fact about SARSA is that a convergence proof has never been published.


    However, it has been stated informally that SARSA will converge if the policy
    converges to a greedy policy.


    One way to achieve this is to let epsilon = 1/t, where t represents time.


    This is the form we’ll be using in the code.


    Note that the numerator doesn’t have to be 1. You can have 0.5/t, or 0.8/t, anything
    you want.


    Also, you don’t HAVE to have 1/t decay, you can have 1/t^2/3, or any other power
    you choose.


    You should consider this a hyperparameter.


    \---


    Also recall that learning rates can also decay.


    There is a problem with using a 1/t decay though.


    Consider that, for each time, only one state-action pair will be updated in Q.


    Therefore, the learning rate will decay for values of Q that have never been updated
    before!


    You could try to remedy this, by only decaying the learning rate once per episode,
    but you still have the same problem.


    Only a subset of the full set of states are going to be visited in an episode.


    And only one of the possible actions per state are going to be taken.


    So even if you only decay the learning rate once per episode, you’re still decaying
    the learning rate for parts of Q that have never been updated before.


    \---


    To solve this, we take inspiration from deep learning - in particular, the AdaGrad
    and RMSprop algorithms.


    Recall that what makes these unique, is the effective learning rates decrease
    more when past gradients have been large.


    In other words, the more something has changed in the past, the more we’ll decrease
    the learning rate in the future.


    Our version will be simpler than these techniques, but the idea is the same.


    We’re going to keep a count of how many times we’ve seen a state-action pair.


    We’ll set alpha to be the original alpha / the count.


    alpha(s,a) = alpha0/count(s,a)


    Or more generally:


    alpha(s,a)=alpha0/(k+m\*count(s,a))


    In this way, every state-action pair has its own alpha, and so each of them will
    have their own individually decaying learning rate.


    ## SARSA in Code


    In this lecture, we are going to implement SARSA in code.


    If you don’t want to try to code this yourself, although I highly recommend you
    do, the relevant file in the course repo is sarsa.py


    At the top, we have our standard imports. Notice how we also need the max\_dict
    function from monte\_carlo\_es.


    `import numpy as np`


    `import matplotlib.pyplot as plt`


    `from grid_world import standard_grid, negative_grid`


    `from iterative_policy_evaluation import print_values, print_policy`


    `from monte_carlo_es import max_dict`


    `from td0_prediction import random_action`


    ` `


    `GAMMA = 0.9`


    `ALPHA = 0.1`


    `ALL_POSSIBLE_ACTIONS = (''U'', ''D'', ''L'', ''R'')`


    We have the same constants as before. Note that alpha here, is not the effective
    alpha we’ll be using for Q, but the effective alpha will be derived from this
    initial alpha.


    Notice how in this script, we don’t have a play\_game function, because with SARSA,
    playing the game and doing the updates can’t be separate.


    We have to do the updates while we play the game. So as promised, TD methods are
    fully online.


    \---


    Now we enter the main section. Notice how we’re using the negative grid. You’re
    welcome to try the standard grid too to observe the effect.


    `if __name__ == ''__main__'':`


    `grid = negative_grid(step_cost=-0.1)`


    ` `


    `print "rewards:"`


    `print_values(grid.rewards, grid)`


    Next, we print the rewards, and initialize Q.


    `# initialize Q(s,a)`


    `Q = {}`


    `states = grid.all_states()`


    `for s in states:`


    `Q[s] = {}`


    `for a in ALL_POSSIBLE_ACTIONS:`


    `Q[s][a] = 0`


    After that, we create two update\_counts dictionaries. The dictionary called just
    update\_counts is to see what proportion of time we spend in each state. The dictionary
    called update\_counts\_sa is for the adaptive learning rate.


    `update_counts = {}`


    `update_counts_sa = {}`


    `for s in states:`


    `update_counts_sa[s] = {}`


    `for a in ALL_POSSIBLE_ACTIONS:`


    `update_counts_sa[s][a] = 1.0`


    Next, we enter the main loop. We’re using the “t” variable here for epsilon-greedy.


    `# repeat until convergence`


    `t = 1.0`


    `deltas = []`


    `for it in xrange(10000):`


    `if it % 100 == 0:`


    `t += 10e-3`


    `if it % 2000 == 0:`


    `print "it:", it`


    Notice how it’s only going to increase every 100 steps, and by a very tiny amount.


    This is also a hyperparameter, you would choose this based on your own experimentation.


    Inside the loop, we play the game.


    We set the start state and find the initial action based on Q.


    `s = (2, 0) # start state`


    `grid.set_state(s)`


    ` `


    `a = max_dict(Q[s])[0]`


    `a = random_action(a, eps=0.5/t)`


    `biggest_change = 0`


    `while not grid.game_over():`


    `r = grid.move(a)`


    `s2 = grid.current_state()`


    ` `


    `# we need the next action as well since Q(s,a) depends on Q(s'',a'')`


    `# if s2 not in policy then it''s a terminal state, all Q are 0`


    `a2 = max_dict(Q[s2])[0]`


    `a2 = random_action(a2, eps=0.5/t) # epsilon-greedy`


    ` `


    `# we will update Q(s,a) AS we experience the episode`


    `alpha = ALPHA / update_counts_sa[s][a]`


    `update_counts_sa[s][a] += 0.005`


    `old_qsa = Q[s][a]`


    `Q[s][a] = Q[s][a] + alpha*(r + GAMMA*Q[s2][a2] - Q[s][a])`


    `biggest_change = max(biggest_change, np.abs(old_qsa - Q[s][a]))`


    ` `


    `# we would like to know how often Q(s) has been updated too`


    `update_counts[s] = update_counts.get(s,0) + 1`


    ` `


    `# next state becomes current state`


    `s = s2`


    `a = a2`


    Next, we enter the game loop.


    We do the action to get the reward, and find the next state.


    Next, we find the next action based on epsilon-greedy. Notice how epsilon here
    is not constant but decaying with time.


    Next, we calculate alpha, which is the initial alpha / the count.


    We also update the count, but only by a small amount.


    Notice that we’re keeping track of the deltas here as well, since we would like
    to know how much Q is changing as we learn.


    Next, we do our Q update, and we update the update counts dictionary, and then
    we set “s” and “a” to the new “s” and “a”.


    Finally, we exit the loop.


    `plt.plot(deltas)`


    `plt.show()`


    ` `


    `# determine the policy from Q*`


    `# find V* from Q*`


    `policy = {}`


    `V = {}`


    `for s in grid.actions.keys():`


    `a, max_q = max_dict(Q[s])`


    `policy[s] = a`


    `V[s] = max_q`


    ` `


    `# what''s the proportion of time we spend updating each part of Q?`


    `print "update counts:"`


    `total = np.sum(update_counts.values())`


    `for k, v in update_counts.iteritems():`


    `update_counts[k] = float(v) / total`


    `print_values(update_counts, grid)`


    ` `


    `print "values:"`


    `print_values(V, grid)`


    `print "policy:"`


    `print_policy(policy, grid)`


    Since we want to print the policy, we need to find it by taking the argmax of
    Q.


    We also use this opportunity to calculate the state-value function as well.


    And also recall that we want to show what proportion of time we spend in each
    state, so we collect those values and use the print\_values function to show them.


    At the end, we print the state-values and the final policy.


    Run this and see what you get.


    ## Q-Learning


    In this section we are going to discuss Q-Learning.


    Q-Learning is very interesting because it deviates from the strategy we’ve been
    taking so far.


    Recall that the main theme behind each of the control algorithms we studied is
    generalized policy iteration.


    We always alternate between policy evaluation, and then policy improvement, which
    means choosing an action greedily based on the current value estimate.


    What’s the same about all these control algorithms we’ve studied, is that they
    are called “on-policy” methods.


    That means, we are always updating the value function based on the current policy.


    What’s different about Q-Learning is that it’s an off-policy method.'
