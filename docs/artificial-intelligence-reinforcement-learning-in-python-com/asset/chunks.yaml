    * 可能的应用：股票价格建模、时间序列、DNA

    * 应用深度学习技能：使用 `Theano` 和梯度下降寻找 `HMM` 参数

    * 将教你应对 `RNNs`（循环神经网络）的关键技能


    ## [深度学习：Python Python 循环神经网络](https://deeplearningcourses.com/c/deep-learning-recurrent-neural-networks-in-python?coupon=AMZN)
    (深度学习第 5 部分)

