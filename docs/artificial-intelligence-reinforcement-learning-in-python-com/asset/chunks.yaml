- raw: 'This means, the actions you take can be completely random, and yet you still
    end up with the optimal value function, from which you can calculate the optimal
    policy.


    \---


    So how does Q-Learning work?


    It actually looks a lot like SARSA.


    It wouldn’t be surprising if you look at these 2, and they look exactly the same
    to you.


    Q(S(t),A(t)) = Q(S(t),A(t))+alpha\*\[R(t+1) + max\[a’\]{ Q(S(t+1),a’) } - Q(St,At)\]


    Q(s,a) = Q(s,a) + alpha\*\[r+max\[a’\]{ Q(s’,a’) } - Q(s,a)\]


    So the idea is, instead of actually choosing a’ based on the argmax of Q, we instead
    update Q based on the max over all actions.


    Now your first thought might be, “well isn’t that exactly the same?”


    If we choose a’ as the argmax of Q, then the thing multiplied by gamma will be
    Q(s’, a’), which is maxed over a’.


    \---


    Here is the difference.


    With Q-Learning, remember that it’s an off-policy method.


    Q(s’,a’) might be the max over all a’, but this doesn’t necessarily mean a’ has
    to be our next action.


    We update Q(s,a) using the max of Q(s’,a’) even if we don’t end up doing the action
    a’ in the next step.


    What this suggests is that it doesn’t matter at all what policy we follow. We
    can choose actions randomly and still get the same answer. The code will demonstrate
    this.


    In reality, if you do end up taking purely random actions, what will end up happening
    is that your agent will act sub-optimally very often, and that will make your
    episodes last longer.


    And because of that the script will take longer to run for the same number of
    episodes.


    \---


    So the key difference with Q-Learning is that it doesn’t matter what policy we
    use.


    It’s reasonable to ask then, under what circumstances is Q-Learning equivalent
    to SARSA?


    If the policy you use during Q-Learning is a greedy policy, meaning you always
    choose the argmax over Q, then your Q(s’,a’) will correspond to the next action
    you take.


    And so in that case, you’ll be doing SARSA, but you’ll also be doing Q-Learning.


    ## Q-Learning in Code


    In this lecture we are going to implement Q-Learning in code.


    If you don’t want to try to code this yourself, although I highly recommend you
    do, the relevant file in the course repo is q\_learning.py


    Keep in mind that a lot of this is the same as the SARSA script.


    Let’s just look at the main loop since that’s where all the relevant changes are.


    `# repeat until convergence`


    `t = 1.0`


    `deltas = []`


    `for it in xrange(10000):`


    `if it % 100 == 0:`


    `t += 10e-3`


    `if it % 2000 == 0:`


    `print "it:", it`


    ` `


    `# instead of ''generating'' an epsiode, we will PLAY`


    `# an episode within this loop`


    `s = (2, 0) # start state`


    `grid.set_state(s)`


    ` `


    `# the first (s, r) tuple is the state we start in and 0`


    `# (since we don''t get a reward) for simply starting the game`


    `# the last (s, r) tuple is the terminal state and the final reward`


    `# the value for the terminal state is by definition 0, so we don''t`


    `# care about updating it.`


    `a, _ = max_dict(Q[s])`


    `biggest_change = 0`


    `while not grid.game_over():`


    `a = random_action(a, eps=0.5/t) # epsilon-greedy`


    `# random action also works, but slower since you can bump into walls`


    `# a = np.random.choice(ALL_POSSIBLE_ACTIONS)`


    `r = grid.move(a)`


    `s2 = grid.current_state()`


    ` `


    `# adaptive learning rate`


    `alpha = ALPHA / update_counts_sa[s][a]`


    `update_counts_sa[s][a] += 0.005`


    ` `


    `# we will update Q(s,a) AS we experience the episode`


    `old_qsa = Q[s][a]`


    `# the difference between SARSA and Q-Learning is with Q-Learning`


    `# we will use this max[a'']{ Q(s'',a'')} in our update`


    `# even if we do not end up taking this action in the next step`


    `a2, max_q_s2a2 = max_dict(Q[s2])`


    `Q[s][a] = Q[s][a] + alpha*(r + GAMMA*max_q_s2a2 - Q[s][a])`


    `biggest_change = max(biggest_change, np.abs(old_qsa - Q[s][a]))`


    ` `


    `# we would like to know how often Q(s) has been updated too`


    `update_counts[s] = update_counts.get(s,0) + 1`


    ` `


    `# next state becomes current state`


    `s = s2`


    `a = a2`


    First thing you’ll notice is that the place where we choose the action we actually
    do is now in a different spot.


    I’m doing epsilon-greedy in this script but I also leave you the option of choosing
    a uniform random action.


    You’ll see that both work, but uniform random takes longer to complete the same
    number of episodes since it doesn’t try to go directly to the goal.


    Notice how we are still using our adaptive learning rate and adaptive epsilon.


    Next, notice the spot where we choose a2 and the next Q.


    This part is the same as SARSA.


    We also assign a to a2 at the end of the loop.


    But once we wrap back around to the top, this a is going to possibly change. And
    so that’s what differentiates Q-Learning from SARSA.


    Run this and confirm that we get the expected answer.


    Note that your policy can be different due to randomness. But generally speaking
    any route you take will still lead you to the goal. There are just multiple ways
    of getting there.


    ## TD Summary


    In this lecture we are going to summarize everything we did in this section.


    This section was all about temporal difference learning, which combines aspects
    of both Monte Carlo and Dynamic Programming.


    From Monte Carlo, we incorporate ideas like learning from experience, meaning
    we actually play the game.


    We also learned how to generalize the idea of taking the sample mean of the returns,
    using what we learned in the multi-armed bandit section.


    The problem with Monte Carlo is that it’s not fully online.


    We also incorporated ideas from dynamic programming, such as bootstrapping, and
    using the recursive form of the value function to estimate the return.


    When we put these 2 together, we get TD(0), where instead of taking the sample
    mean of the returns, we take the sample mean of the estimated return, which is
    based on the current reward and the next state value.


    \---


    For the control problem, we saw that we again have to use the action-value function
    instead of the state-value function, for the same reason as Monte Carlo estimation.


    We derived the SARSA algorithm, which combines ideas from value iteration and
    TD(0).


    We learned the difference between on-policy and off-policy algorithms, and we
    determined in hindsight that all the control solutions we’ve seen have been on-policy
    up until now.


    We then learned about an off-policy algorithm called Q-Learning, which has gained
    traction recently in part due to Deep Q-Learning.


    \---


    One disadvantage of all these methods is that they require us to estimate Q.


    As we learned early on, the state space can easily become infeasible to enumerate,
    and then on top of that, for every state you need to enumerate all the possible
    actions as well.


    So in real-world problems, it’s very possible that Q does not even fit into memory.


    The method of storing Q as a dictionary and indexing it by state and action is
    called the tabular method.


    All the methods we’ve learned about so far have been tabular methods.


    As you might imagine, tabular methods are only practical for small problems.


    In the next section, we’ll learn a new technique that helps us get around this
    problem, using function approximation.


    This essentially allows us to compress the amount of space we need to represent
    Q.


    # Function Approximation


    ## Intro to Approximation


    In this chapter, we are going to study approximation methods.


    Recall that at the end of the last section, we discussed a major disadvantage
    of the methods we’ve been studying so far.


    That is, they all require us to estimate the value function for each state, and
    in the case of the action-value function, each state and each action.


    We learned early on in the course that the state space can grow infeasibly large
    very quickly, which makes all of the methods we studied impractical.


    The answer to this problem is approximation.


    \---


    Recall in our earlier studies of deep learning, that neural networks are universal
    function approximators.'
