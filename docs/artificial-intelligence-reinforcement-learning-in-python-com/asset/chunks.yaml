    The first step is we create 2 AIs.


    The next few steps are all devoted to initializing the AIs.


    First we initialize their value functions, and remember they are different for
    the 2 agents depending on which one is X and which one is O.


    We also set their symbols.


    Next, we play 10 000 games of AI vs AI.


    We technically could have created a method to reset the environment here but I
    just haven’t done it. So instead we just create a new Environment on every iteration.


    Finally, when the AI is done training, you can play against it yourself, so we
    create a Human object and set its symbol to O.


    We set verbose to True so that you can see the value function that the AI uses
    to make decisions.


    I’ve chosen the agent to be player 1 here because I wanted to see if it would
    select a good starting position on the tic-tac-toe board, but you are free to
    experiment with other configurations of this script.


    Run this yourself and:


    \* see if AI starts in the center


    \* make a mistake on purpose so AI can win


    \* show that AI blocks me if I try to win


    ## Summary


    In this section we are going to summarize this chapter section since it was extremely
    long.


    It’s amazing to think that we did all that just to play tic-tac-toe, and we haven’t
    even yet seen the main reinforcement learning algorithms in this course yet.


    \---


    First, I asked you to think about how you would solve tic-tac-toe as a naive first
    year computer science student. The answer was that we would end up building an
    agent with a bunch of if statements. It wouldn’t adapt to its environment or get
    better as it played more games.


    So even if it seemed intelligent at first, it would never be able to increase
    its intelligence.


    Moreover, the algorithm would not be generalizable to new games, it would only
    work for tic-tac-toe.


    So we’ve set out on this course to find algorithms that are intelligent, and that
    allow an AI to solve anything given the right rewards.


    \---


    Next, we took a deeper look at the components of a reinforcement learning system.


    We defined the agent, environment, state, actions, and rewards.


    We talked about how specific reward structures can lead to poor results, so we
    need to choose them carefully. This is like you choosing how to reward your dog
    in order to train it to behave well.


    We looked at new terms, like episode and terminal state, which we needed to fully
    understand the algorithm we used for tic-tac-toe.


    \---


    Next, we looked at the credit assignment problem and closely related to that,
    the idea of delayed reward.


    The idea was that an action you take now may not lead to a good immediate reward,
    but it may maximize your future rewards. So you want to be able to plan intelligently.


    We used these to motivate the idea behind the value function.


    We saw that, based on how the value function is updated, if we initialize it in
    the correct way, such that the value of the terminal state is 1 if we win and
    0 otherwise, then the values will propagate backward along the state history.


    We do this iterative update in small steps at the end of each episode, so only
    the possible next states can influence the previous state.


    \---


    Finally, we put this all together in code, and you saw that the algorithm does
    indeed work, and that the tic-tac-toe agent, once it’s trained to play tic-tac-toe,
    makes intelligent moves.


    \---


    Now that you’ve had some experience with reinforcement learning, it’s interesting
    to look back and try to compare it with supervised learning.


    A common question is - why can’t we just create a supervised learning problem
    that maps states to actions directly?


    \---


    The first problem with this is how we would come up with labels. As you’ve already
    seen, it’s extremely easy for the state-space to grow too large to enumerate.
    Tic-tac-toe or connect-4 is probably the limit.


    Imagine a video game with HD graphics and 60 frames per second. Now you have millions
    of pixels, with hundreds of values per pixel, and 60 of those every second. The
    number of possible states in a game like this is so large you probably can’t even
    conceptualize it.


    So there’s no way you can create proper labels.


    \--


    There’s also the fact that labels only tell us if we’re right or wrong. In a way,
    a reward is more flexible and gives us more information because it tells us “how
    right” or “how wrong”. Rewards tell us how good we’re doing.


    \---


    Rewards are delayed, but the value function has this information built-in.


    If you’re trying to choose the best action for a particular state, assuming somehow
    you get around the problem that you need to label an exponentially large dataset,
    you still need to choose the best action based on all possible future rewards.


    That means you would need to be the one calculating the value of each state and
    choosing the best action based on those values.


    In other words, instead of letting an algorithm calculate values in a way that
    automatically accounts for delayed rewards, you would need to somehow keep track
    of all that yourself.


    \---


    Rewards can also have a component of randomness.


    So sometimes when you go to a state you get a reward of 1, but other times you
    get 0.


    This could be like, you study for your exam tomorrow, but then tomorrow there’s
    a snow storm and your exam is canceled.


    Next states can likewise also be random.


    \---


    In reinforcement learning we are never told externally if an action / state pair
    is good or not.'
