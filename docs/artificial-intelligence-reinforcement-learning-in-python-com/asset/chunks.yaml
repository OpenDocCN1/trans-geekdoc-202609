- raw: 'The details are outside the scope of this course, but the algorithm is just
    as simple as all the others we’ve looked at.


    The idea is, we take the upper confidence bound to be the regular sample mean
    + sqrt(2 \* ln(N) / Nj).


    `Xmean= Xmean(j)+2ln(N)/Nj`


    This is equivalent to “choosing” an epsilon equal to the square root and everything
    inside it.


    So let’s talk about what all these symbols mean.


    `Xmean(j) = regular sample mean of jth bandit arm`


    N is the total number of times you’ve played the bandits.


    Nj is the total number of times you’ve played the jth bandit.


    Now how do we use this formula?


    Well the idea is similar to the optimistic initial values method.


    We use the greedy strategy only, but what we’re greedy with respect to is not
    just the sample mean, but the upper confidence bound of the sample mean.


    The question is, why does this work?


    Well the confidence bound seems to be the ratio of 2 things: N, which is the total
    times you’ve played any bandit, and Nj, the total number of times you’ve played
    bandit j.


    So if you’ve played some other bandits many times, but Nj is small, then this
    ratio ln(N)/Nj is going to be large, which would make the upper confidence bound
    higher, which would cause you to select this bandit to play.


    At the same time, if Nj is large, then the ratio is small, at which point the
    upper confidence bound will shrink.


    But one key point about this ratio is that the top part grows with the logarithm
    of N. Which means it’s going to grow more slowly than Nj eventually.


    That means, as you play all the bandits more and more, the upper confidence bounds
    will shrink, and you’ll only be using the sample means, which is ok since you’ve
    collected lots of data.


    So this also converges to a purely greedy strategy.


    Let’s look at some pseudocode so we can understand how this works better.


    It’s essentially just as simple as the optimistic initial values method. We’re
    just replacing the formula that goes into the argmax, which is now the upper confidence
    bound.


    `for n=1..N:`


    `j = argmax[j’]{ bandit[j’].mean + sqrt(2*ln(n) / n_j) }`


    `pull bandit j`


    `update bandit j`


    Note that there is a small problem where this formula doesn’t work if n\_j is
    0. To fix that, you can simply add a small number to the denominator.


    If you don’t want to try to code this yourself, the relevant file in the course
    repo is ucb1.py. At the very least, try running it so you can observe the results.


    ## Bayesian / Thompson Sampling


    In this lecture we are going to discuss one of my favorite ways to solve the explore-exploit
    dilemma, using the Bayesian method.


    You might also see this technique called Thompson sampling in some sources.


    To motivate the idea behind the Bayesian method, we want to look at confidence
    intervals or confidence bounds again.


    We know intuitively that a sample mean calculated from 10 samples, is not as accurate
    as a sample mean calculated from 1000 samples.


    We can use the central limit theorem to say that the confidence interval is “approximately
    Gaussian” with true mean equal to the expected value of the random variable, and
    variance equal to the original variance / N.


    Xmean ~ Normal(true\_mean , true\_variance/N)


    X ~ Normal(true\_mean , true\_variance)


    The reason that Xmean has a distribution is because it’s the sum of random variables.
    And as you know any function of random variables is also a random variable.


    The Bayesian paradigm extends this idea even further. Instead of the true mean
    (we’ll call it mu) being fixed, mu becomes a random variable too.


    The basic idea behind the Bayesian paradigm is that data is fixed , and parameters
    are random .


    In the Bayesian paradigm, parameters have distributions, and what we would like
    to know, is the distribution of the parameter given data.


    This makes a lot of sense I hope.


    Given some data, I should be able to come up with a distribution based on the
    data that is more accurate than if I didn’t have the data. We call this the posterior
    distribution:


    p(param | data)


    In the Bayesian paradigm, the key tool is Bayes rule, and so we can flip the posterior
    and compute it from the likelihood and the prior.


    Likelihood = p(data | param)


    Prior = p(param)


    One disadvantage of the Bayesian method is that we need to choose the prior ourselves,
    and this can sometimes have a non-negligible effect on the posterior.


    p(param | data) = p(data | param)p(param) / p(data)


    p(param | data) proportional to p(data | param)p(param)


    Since p(data) = integral over p(data | param)p(param)dparam is constant.


    There are some problems with this formula. One is that it’s very general, in the
    sense that a differential equation is very general.


    The integral in the denominator can’t always be found, so we need to resort to
    mathematical tricks in order to make this work out. And it doesn’t always work
    out.


    Luckily, there are a special set of pairs of distributions, such that the posterior
    will have the same distribution as the prior.


    These are called conjugate priors .


    Let’s do a short example to see how the conjugate prior method can be applied
    to click-through rates.


    We know that click-through rates are like coin tosses, so they have a Bernoulli
    likelihood.


    If you look up on Wikipedia what the conjugate prior for a Bernoulli likelihood
    is, you’ll find that it’s the Beta distribution.


    The Beta distribution is always between 0 and 1, which makes sense, and it has
    2 parameters, a & b.


    Knowing this, we can set up our calculation for the posterior.


    The likelihood can be written as a product, since each coin toss is independent.


    Let’s call our parameter, probability of the coin toss being 1, r. Then:


    r ~ Beta(a,b)


    Likelihood:


    p(X | r) = prod\[i=1..N\]{ r ^ 1(x(i)=1) (1 - r) ^ 1(x(i)=0) }


    Remember, the 1(.) function is defined as: 1(true) = 1, 1(false) = 0.


    The prior is just the PDF of the Beta, which you can simply write down verbatim.


    p(r) = \[1/B(a,b)\] r ^ (a-1) (1- r) ^ (b-1)


    To find the posterior, we need to combine the likelihood and the prior and solve
    for the posterior.


    p(r | X) proportional to prod\[i=1..N\]{ r ^ 1(x(i)=1) (1 - r) ^ 1(x(i)=0) } \[1/B(a,b)\]
    r ^ (a-1) (1- r) ^ (b-1)


    We can drop the Beta function out of the proportionality since it gets absorbed
    into the normalization constant.


    The key here is to see that the posterior also takes the form of a Beta distribution,
    so we can infer what the new parameters of the new Beta are.


    p(r | X) ~ Beta(a’, b’) where:


    a’ = a + sum\[i=1..N\] { 1(x(i)=1) }


    b’ = b + sum\[i=1..N\] { 1(x(i)=0) }


    So the new a is just the old a + the # of times X was a 1. The new b is just the
    old b + the # of times X was a 0.


    a''=a+#1''s


    b''=b+#0''s


    There is a script from my A/B testing class that you can run in order to demonstrate
    how the posterior gets updated as you collect more samples. (Same repository as
    this class).


    The file is in the folder ab\_testing and its name is demo.py.


    We start with the settings a0 = 1 and b0 = 1, which is equivalent to the uniform
    distribution, which is a suitable prior since we don’t know anything about the
    true click-through rate prior to starting.


    In the script, we plot the distribution periodically, and there are some things
    you should be able to notice.


    You’ll see that the distribution starts out fat and as it gets updated it gets
    skinnier and skinnier and taller and taller.


    The area under the PDF is always 1, so whenever it gets skinnier it must get taller.


    The reason it’s getting skinnier is because we’re becoming more confident in our
    estimate of the parameter.


    In other words, this is a natural way to represent confidence bounds or confidence
    intervals.


    Also notice that this is an instance of online learning .


    The distribution becomes more precise after every single coin toss, not just after
    we collect all the data.


    You’ll see that all of the learning methods we’ll look at in this book are able
    to update iteratively.'
