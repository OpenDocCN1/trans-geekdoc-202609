    \ - 1):\n            s, r = states_and_rewards[t]\n            s2 = states_and_rewards[t+1]\n\
    \            if grid.is_terminal(s2):\n                target = r\n          \
    \  else:\n                target = r + GAMMA * model.predict(s2)\n           \
    \ model.theta += ALPHA * (target - model.predict(s2)) * model.grad(s)\n      \
    \      deltas.append(np.abs(model.theta - old_theta).sum())\n        if it % 100\
    \ == 0:\n            print \"rewards:\"\n            print_values(grid, grid)\n\
    ```\n"
