  fmt: '

    The type of differentiable model we looked at in this course was linear regression,
    but we can just as easily apply it to neural networks and deep learning.


    Using linear regression meant we had to engineer our own features, since the raw
    features we had - the `i` coordinate and the `j` coordinate, did not yield an
    expressive-enough model.


    ---


    ## Approximation Methods


    We applied approximation methods to 3 algorithms we learned about earlier in the
    course.


    First, we used approximation with Monte Carlo prediction.


    Next, we used approximation with a natural extension of Monte Carlo prediction,
    `TD(0)` prediction.


    We learned that, because `TD(0)` requires us to use the model to form the target,
    the gradient we used for gradient descent is not a true gradient, so we call it
    a semi-gradient method.


    Finally, we used approximation for control - in particular, we applied it to the
    `SARSA` algorithm. Since `SARSA` is also a temporal difference method, we again
    were not using the true gradient, but a semi-gradient.


    ---


    ## Q-Learning vs. SARSA


    You may have wondered why we didn’t apply approximation methods to `Q-Learning`.


    Recall that `Q-Learning` is an off-policy method.


    Some sources have stated that using approximation methods for off-policy control
    methods do not have good convergence characteristics.


    However, if you want to try to modify the existing `SARSA` approximation script
    to use `Q-Learning` instead, you are encouraged to do so.


    Remember that the main difference between `SARSA` and `Q-Learning` is that the
    `Q` we use for the update does not necessarily correspond to the next action we
    take.


    So basically the line of code where you choose your action goes somewhere else.


    ---


    ## Course Overview


    To put all this into context, let’s now go through an overview of everything we
    accomplished in this course.


    We started out this course looking at the multi-armed bandit problem, which you
    first saw in my Bayesian Machine Learning, A/B testing course.


    You learned about the explore-exploit dilemma, which is central to reinforcement
    learning.


    We saw 4 different ways to solve the multi-armed bandit problem, including epsilon-greedy,
    optimistic initial values, `UCB1`, and Thompson sampling.


    Next, you learned about some more of the basic definitions in reinforcement learning,
    and you applied them to create a tic-tac-toe agent. By coding a tic-tac-toe agent,
    we were able to get a feel for how reinforcement learning works, and the types
    of algorithms we use for learning.


    ---


    ## Markov Decision Processes (MDP)


    In the next chapter, we formalized all the concepts we learned about reinforcement
    learning into a framework of Markov Decision Processes, or `MDPs`.


    You learned about policies, state-value functions, and action-value functions.


    You learned about the concept of returns, which is the sum of discounted future
    rewards.


    ---


    ## Solving MDPs


    In the next chapters, we looked at 3 different ways of solving MDPs. In particular,
    we were interested in solving 2 problems: the prediction problem, which is finding
    the value function given a policy, and the control problem, which is finding the
    optimal policy.


    ### Dynamic Programming

    In the first section on Dynamic Programming, we directly applied `Bellman’s Equation`
    to solve both of these problems. You learned about the idea of policy iteration,
    and the more efficient way of doing it, called value iteration.


    We learned that Dynamic Programming isn’t really practical because it doesn’t
    learn from experience and assumes we know all the relevant probability distributions.


    ### Monte Carlo Methods

    In the next section, we looked at Monte Carlo methods, which learn only from experience.
    With Monte Carlo, instead of calculating expected values precisely using probability
    distributions, we instead estimate them using sample means. The problem with Monte
    Carlo is that it’s not fully online, which is a problem if you have very long
    episodes or continuing tasks.


    ### Temporal Difference Learning

    The final method we looked at was temporal difference learning, which combines
    aspects of both Dynamic Programming and Monte Carlo. `TD` learning uses bootstrapping,
    which means it makes estimates based on other estimates, and this allows it to
    be fully online, since we don’t need to wait for an episode to be over before
    making updates. At the same time, `TD` learning also learns from experience, which
    means we don’t need a probabilistic model of the `MDP`.


    ---


    ## Deep Reinforcement Learning


    In the final section of the course, we learned how all 3 of the previous methods
    can be infeasible for large state spaces, so we looked at ways of compressing
    the value function.


    The only requirement for our function approximators is that they be differentiable.
    As you know, deep learning methods are also differentiable. Libraries like `Theano`
    and `TensorFlow` automatically calculate gradients for us, which would make the
    update equations easier in the case where we have lots of parameters and complex
    functions.


    We’ll be looking at deep reinforcement learning.

    '
  trans: '

    我们在本课程中研究的可微模型类型是线性回归，但我们同样容易地将其应用于神经网络和深度学习。


    使用线性回归意味着我们必须进行特征工程，因为我们拥有的原始特征——`i` 坐标和 `j` 坐标——无法产生足够表达力的模型。


    ---


    ## 近似方法


    我们将近似方法应用在了课程早期学过的 3 种算法上。


    首先，我们使用了基于蒙特卡洛预测（Monte Carlo prediction）的近似。


    接下来，我们使用了蒙特卡洛预测的自然扩展——`TD(0)` 预测的近似。


    我们学习到，由于 `TD(0)` 要求我们使用模型来形成目标，因此我们用于梯度下降的梯度并不是真实的梯度，所以我们称其为半梯度方法。


    最后，我们将近似方法用于控制——特别是，将其应用于 `SARSA` 算法。由于 `SARSA` 也是一种时序差分方法，我们再次没有使用真实梯度，而是半梯度。


    ---


    ## Q-Learning vs. SARSA


    你可能在奇怪为什么我们没有将近似方法应用于 `Q-Learning`。


    回想 `Q-Learning` 是一种离策略（off-policy）方法。


    有些来源指出，对于离策略控制方法使用近似方法没有良好的收敛特性。


    然而，如果你想尝试修改现有 `SARSA` 近似脚本以使用 `Q-Learning` 代替，我们鼓励这样做。


    请记住 `SARSA` 和 `Q-Learning` 之间的主要区别在于，用于更新的 `Q` 并不一定对应我们采取的下一个动作。


    所以基本上，选择动作的那行代码会出现在其他地方。


    ---


    ## 课程概述


    为了让这一切都有背景，让我们现在回顾一下在本课程中完成的所有内容。


    我们在本课程开始时研究了多臂老虎机问题，你最初在我的《贝叶斯机器学习与 A/B 测试》课程中见过它。


    你学习了探索与利用的权衡（explore-exploit dilemma），这是强化学习的核心。


    我们看到了解决多臂老虎机问题的 4 种方法，包括 ε-贪婪（epsilon-greedy）、乐观初始值、`UCB1` 和汤普采样（Thompson sampling）。


    接下来，你学习了强化学习中更多的基础定义，并应用它们来创建一个井井棋智能体。通过编写井字棋智能体的代码，我们能够直感受到强化学习是如何工作的，以及我们用于学习的算法类型。


    ---


    ## 马尔可夫决策过程 (MDP)


    在下一章中，我们将学到的所有强化学习概念形式化为马尔可夫决策过程框架，或 `MDPs`。


    你学习了策略（policies）、状态价值函数和动作价值函数。


    你学习了回报（returns）的概念，即未来奖励的折现之和。


    ---


    ## 解决 MDPs


    在接下来的章节中，我们研究了解决 MDP 的 3 种不同方法。特别是，我们对解决两个问题感兴趣：预测问题（在给定策略的情况下寻找价值函数）和控制问题（寻找最优策略）。


    ### 动态规划

    在动态规划的第一部分，我们直接应用了贝尔曼方程（Bellman’s Equation）来解决这两个问题。你学习了策略迭代（policy iteration）的思想，以及更高效的方法，即价值迭代（value
    iteration）。


    我们学习到动态规划并不真正实用，因为它不从经验中学习，并且假设我们知道所有相关的概率分布。


    ### 蒙特卡洛方法

    在下一节中，我们研究了蒙特卡洛方法，它只从经验中学习。通过蒙特卡洛，我们不再使用概率分布精确地计算期望值，而是使用样本平均值来估计它们。蒙特卡洛方法的问题是它不是完全在线的，如果你有非常长的回合或持续任务，就会出现问题。


    ### 时序差分学习

    我们研究的最后方法是时序差分学习，结合了动态规划和蒙特卡洛的特性。`TD` 学习使用了自助引导（bootstrapping），这意味着它基于其他估计来做出估计，这使得它能够完全在线，因为我们不需要等待回合结束就可以进行更新。同时，`TD`
    学习也从经验中学习，这意味着我们不需要 `MDP` 的概率模型。


    ---


    ## 深度强化学习


    在课程的最后一部分，我们学习了上述 3 种方法对于大型状态空间可能是不可行的，因此我们研究了压缩价值函数的方法。


    我们函数近似器的唯一要求是它们可微。正如你所知，深度学习方法也是可微的。`Theano` 和 `TensorFlow` 等库会自动为我们计算梯度，这在我们拥有大量参数和复杂函数的情况下会使更新方程变得更简单。


    我们将学习深度强化学习。

    '
