    ## Summary


    In this section we are going to summarize everything we did in this section.


    In the last chapter, we defined the Markov Decision Process, and in this chapter,
    we looked at one method of finding solutions to MDPs called Dynamic Programming.


    In particular, we looked at one way of solving the prediction problem, or in other
    words, finding the value function given a policy.


    We looked at two ways of solving the control problem, or in other words, finding
    the optimal policy and optimal value function.


    The first was called policy iteration, and it involved an iterative algorithm
    inside another iterative algorithm, which could be inefficient. We then looked
    at value iteration, which truncates the policy evaluation step, and combines both
    policy evaluation and policy iteration into one step.


    \---


    Notice how all the algorithms we looked at for dynamic programming involved looping
    through the entire set of states.


    As we discussed earlier in the course, for more realistic games, the state space
    can be ridiculously large.


    Therefore, even just one iteration of value iteration can take a very long time.


    Also recall, that one way to speed up value iteration is to do the update “in-place”,
    meaning that we don’t exclusively use the values from the previous iteration to
    update the values in the current iteration.


    We can take that a step further with what is called asynchronous value dynamic
    programming.


    The modification is simple. Instead of looping through the entire state set, we
    loop through just a few or even just one of the states per iteration.


    We can choose these states randomly or based on which states are more likely to
    be visited, and you could learn that information by having your agent play a few
    rounds of the game.


    \---


    Although we introduced policy iteration as a dynamic programming algorithm in
    this section, you’ll see that the main concept behind policy iteration will appear
    again and again throughout the course.


    What is this main concept?


    It’s that we iteratively perform 2 steps: policy evaluation, and policy improvement,
    and we just alternate between the 2 until we reach convergence.


    The only way we can reach convergence, is when Bellman’s equation becomes true,
    or in other words, the value has converged for the given policy and the policy
    has stabilized with respect to greedy selection on the value function.


    One way to visualize this process is with this 2-dimensional diagram. Initially,
    the policy and the value function can be highly suboptimal, but by requiring the
    policy to be greedy with respect to the value function, and the value function
    to be consistent with the policy, we can converge to the optimal policy and the
    optimal value function.


    \---


    We can talk a little bit about the efficiency of dynamic programming as well.


    Let’s consider how much better it is than brute force search.


    You’ll want to think about how you’d solve this problem using what you know from
    your algorithms class.


    Let’s call the number of states N and the number of possible actions M


    If we assume that the agent can go from the start state to the goal state in O(N)
    time, then we want a sequence of actions of length O(N).


    The number of possible actions is then O(M^N).


    How you would solve this practically, is you’d make a list of all the permutations
    of possible state sequences, and then do policy evaluation on all of them.


    You’d then keep the policy that gives you the maximum value function.


    This is exponential in the number of states, so you can see how dynamic programming
    is a much more efficient solution.


    \---


    Lastly, you may have noticed how the dynamic programming solutions require a full
    model of the environment.


    In particular, the state transition probabilities. You can imagine that in the
    real world, these probabilities might be infeasible to measure, especially when
    the number of states is large.


    You’ll see that for the remaining sections of the course, we’ll be exploring solutions
    that don’t require such a model of the environment. These are called “model-free”
    methods.


    You also may have noticed that these iterative solutions require an initial estimate.
    In policy iteration and value iteration, we’re essentially making estimates from
    other estimates, going back and forth between the value function and the policy.


    Making that initial estimate is called “bootstrapping”. You’ll see that the next
    method we’ll look at, Monte Carlo, does not require bootstrapping, while the method
    we’ll look at after that, called Temporal Difference Learning, will require bootstrapping.


    # Monte Carlo


    ## Monte Carlo Introduction


    In this chapter of the book, we are going to discuss another technique for solving
    MDPs, called Monte Carlo.


    In the last section, Dynamic Programming, you may have noticed something strange.


    We discussed early on in this course that reinforcement learning is all about
    learning from experience and playing games.


    And yet, in none of the Dynamic Programming algorithms did we actually play the
    game!


    We had a full model of the environment, which included all the state transition
    probabilities.


    You might wonder, is it reasonable to assume that you would have such information
    in a real-life environment?


    For board games, maybe, but what about self-driving cars?


    The way that we implemented our Dynamic Programming algorithms required us to
    put the agent into a state.


    That might not always be possible, especially when we’re talking about self-driving
    cars, or even video games.


    A video game starts in the state that it decides, you can’t choose any state you
    want.


    This is another instance of having “God-mode” capabilities.


    So it’s not very realistic to assume that’s always possible.'
