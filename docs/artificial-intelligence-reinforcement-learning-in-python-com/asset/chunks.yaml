    \ Q(s,a) }\n```python\nV = {}\nfor s in policy.keys():\n    V[s] = max_dict(Q[s])[1]\n\
    \nprint \"final values:\"\nprint_values(V, grid)\nprint \"final policy:\"\nprint_policy(policy,\
    \ grid)\n```\n\n让我们运行一下看看结果什么。\n\n## MC 总结\n\n在本次课程中，我们将总结在本章中看到过的所有内容。\n\n这一部分完全关于蒙特卡洛（Monte\
    \ Carlo）方法。\n\n在动态规划的最后一部分，我们做了一个奇怪的假设，假设知道所有的状态转移概率且从未真正玩过游戏。因此，我们无法从经验中学习，正如预期强化学习智能体应该做的那样。我们遵循惯模式：首先研究预测问题，然后研究控制问题。\n\
    \n我们在蒙特卡洛中使用的主要技术是价值函数是给定状态的期望回报。我们从概率中知道，期望值可以通过样本平均值来近似。为了使用蒙特卡洛，我们需要生成回合（episodes）并计算每个回合的回报。这给了我们一个状态和回报的对列表。我们对这些回报取平均值以找到每个状态的值。记住，平均回报有两种：“首次访问”（first-visit）和“每次访问”（every-visit）。虽然这两种方法都被证明收敛于相同的结果，但我们使用了首次访问，因为它更简单。\n\
    \n我们看到蒙特卡洛方法可能比动态规划更高效，因为它不需要我们遍历整个状态空间。正因如此，我们可能永远无法获得“完整的”价值函数，但如果其中许多状态永远不会到达，或很少到达，这可能并不重要。也就是说，我们访问某个状态越频繁，该值就越准确。由于蒙特卡洛方法导致每个状态被访问的次数不同，取决于策略，我们使用了探索启动（探索\
    \ starts）来确保每个状态都有足够的数据。\n\n然后我们研究了控制问题。蒙特卡洛的区别在于现在我们需要使用 `Q` 而不是 `V`，以便我们可以对所有动作取\
    \ `argmax`。这是因为我们可以像动态规划中做的那样进行前瞻搜索（look-ahead）。我们看到可以继续使用策略迭代（policy iteration）的思想，我们在动态规划章节中在策略评估和策略改进之间交替进行。我们谈到了蒙特卡洛的一个主要缺点：为了准确，它需要大量的样本，并且必须在循环内部进行，这使得它非常低效。我们采取了与值迭代相同的方法，即每次迭代只进行一次更新。这令人惊讶的是，对于不同的策略，策略是演变的。同样惊讶的是，这从未被正式证明收敛。\n\
    \n蒙特卡洛的一个主要缺点是，我们需要使用探索启动来获得 `Q` 的完整测量。如果我们使用 epsilon 贪婪（epsilon-greedy）而不是探索启动，就不需要了，因为\
    \ epsilon 贪婪允许我们不断探索所有的状态空间。\n\n# 时分学习（Temporal Difference）\n\n## TD 简介\n\n在本节中，我们将学习一种强化学习的第三种技术，称为时分学习（temporal\
    \ difference learning），简称为“TD”。时分学习是强化学习中最重要的技术之一，它结合了前两个章节中动态规划和蒙特卡洛的思想。\n\n\
    你会记得动态规划的一个缺点是它需要环境的完整模型，且从未从经验中学习。另一方面，蒙特卡洛从经验中学习。在蒙特卡洛方法中，我们看到在完成一个回合后才能更新价值函数。另一方面，动态规划使用了自助（bootstrapping），即基于现有估计值进行改进。我们将看到时分学习也使用自助，而且它是完全在线的（fully\
    \ online）。所以我们不需要等待回合结束就可以更新估计值。\n\n在本章中，我们将采取与前两个章节相同的方法。我们首先研究预测问题，或者说给定策略的情况下寻找价值函数。接下来，我们将研究控制问题。与前两个章节类似，我们将探索处理控制问题的两种方法：`SARSA`\
    \ 和 `Q-Learning`，后者最近变得非常流行。\n\n## TD(0) 理论\n\n在本节中，我们将学习如何将时分学习应用于预测问题，或者说寻找价值函数。起初你觉得这个名字很奇怪。为什么名字里是\
    \ 0 而不是其他数字？原因是存在其他的 TD 学习方法，例如 `TD(1)` 以及更通用的 `TD(lambda)`，但这些超出了本书的范围。它们是类似的，但对于理解\
    \ `Q-Learning` 和我们最终想要的近似方法并不是必要的。\n\n那么 `TD(0)`是如何工作的？首先，回想蒙特卡洛。记得蒙特卡洛的缺点是我们需要等待回合结束才能计算回报，因为回报取决于未来的奖励。还记得蒙特卡洛方法是对回报取平均，而且在课程早期我们研究了计算平均值的不同方法。\n\
    \n特别是，让我们看看不需要实际存储所有回报的方法：\n```python\nV(S(t)) = V(S(t)) + alpha*[G(t)-V(t)]\n\
    ```\n记得 `alpha` 可以是常数也可以随时间衰减。所以如果我们使用这个公式，它就是计算状态平均回报的另一种方法。\n\n现在记得 `V` 的定义。记得它是给定状态的回报的期望值。但也记得我们可以递归地定义它：\n\
    ```python\nV(s) = E[G(t) | S(t)=s] = E[R(t+1)+gamma*V(S(t+1)) | S(t)=s]\n```\n\
    \n所以，合理的提问是，是否可以使用这个 `V` 的递归定义替换更新方程中的回报？\n```python\nV(S(t)) = V(S(t)) + alpha*[R(t+1)\
    \ + gamma*V(S(t+1)) - V(S(t))]\nV(s) = V(s) + alpha*[r+V(s’)-V(s)]\n```\n我们从中得到\
    \ `TD(0)` 方法。如果你仔细观察，就会发现这是一个完全在线的自助方法。我们现在不再计算完整的回 `G`。相反，我们只是在使用另一个 `V` 估计值，特别是下一个状态的\
    \ `V`。\n\n"
