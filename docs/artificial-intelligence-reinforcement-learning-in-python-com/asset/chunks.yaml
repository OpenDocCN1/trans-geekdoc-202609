    \ s, a):\n    x = self.sa2x(s, a)\n    return self.theta.dot(x)\n\ndef grad(self,\
    \ s, a):\n    return self.sa2x(s, a)``init` 函数与之前相同，它初始化 `theta`。注意现在的维度是 25。\n\
    \n接下来，我们有特征转换函数 `sa2x`。它创建了上一节中提到的所有特征。你也可以将其注释掉，因为我在下方提供了对状态动作对进行独热编码的选项。这样做等同于执行\
    \ SARSA。\n\n接下来，我们有 `predict` 和梯度函数，与之前一样。\n\n接下来，我们有一个名为 `getQs` 的函数。我们需要它是因为在\
    \ SARSA 的某些时刻，我们需要对 `Q` 取 argmax，但如果 `Q` 没有表示为字典，我们就无法这样做。\n\n```python\ndef getQs(model,\
    \ s):\n    # 需要 Q(s,a) 来选择动作\n    # 即 a = argmax{ Q(s,a) }\n    Qs = {}\n    for\
    \ a in ALL_POSSIBLE_ACTIONS:\n        q_sa = model.predict(s, a)\n        Qs[a]\
    \ = q_sa\n    return Qs\n```\n\n这个函数的作用是根据某些状态 `s` 将 `Q` 预测转换为字典。\n\n接下来，是主部分。我们在这里使用了负网格，但欢迎并鼓励尝试标准网格。\n\
    \n```python\nif __name__ == '__main__':\n    grid = negative_grid(step_cost=-0.1)\n\
    \n    print \"rewards:\"\n    print_values(grid.rewards, grid)\n\n    # 没有策略初始化，我们将从最新的\
    \ Q 策略\n    # 遍历所有的 (s,a) 对，每个对在我们的“笨”模型中都有自己的权重\n    # 本质上每个权重都是 Q(s,a) 本身\n\
    \    states = grid.all_states()\n    for s in states:\n        SA2IDX[s] = {}\n\
    \        for a in ALL_POSSIBLE_ACTIONS:\n            SA2IDX[s][a] = IDX\n    \
    \        IDX += 1\n```\n\n我们打印奖励，然后填充 `SA2IDX` 字典。接下来，初始化模型，然后进入主循环。\n\n```python\n\
    # 初始化模型\nmodel = Model()\n\n# 重复直到收敛\nt = 1.0\nt2 = 1.0\ndeltas = []\nfor it in\
    \ xrange(20000):\n    if it % 100 == 0:\n        t += 10e-3\n        t2 += 0.01\n\
    \    if it % 1000 == 0:\n        print \"it:\", it\n    alpha = ALPHA / t2\n```\n\
    \n注意这里有两个时间变量 `t` 和 `t2`，因为我希望学习率和 epsilon 以不同的速率降低。这些是超参数，所以你只能通过实验找到好的值。\n\n\
    接下来，我们进入主循环。注意在使用 `max_dict` 之前，我们需要使用 `getQs` 函数。\n\n接下来，我们进入游戏循环。\n\n```python\n\
    s = (2, 0) # 状态\ngrid.set_state(s)\n\n# 获取 Q(s) 以便选择第一个动作\nQs = getQs(model, s)\n\
    \na = max_dict(Qs)[0]\na = random_action(a, 0.5/t) # epsilon-greedy\n\nbiggest_change\
    \ = 0\nwhile not grid.game_over():\n    r = grid.move(a)\n    s2 = grid.current_state()\n\
    \n    # 我们还需要下一个动作，因为 Q(s,a) 依赖于 Q(s',a')\n    # 如果 s2 在策略中则它是终止状态，所有 Q 都为 0\n\
    \    old_theta = model.theta.copy()\n    if grid.is_terminal(s2):\n        model.theta\
    \ += alpha*(r - model.predict(s, a))*model.grad(s, a)\n    else:\n        # 非终止\n\
    \        Qs2 = getQs(model, s2)\n        a2 = max_dict(Qs2)[0]\n        a2 = random_action(a2,\
    \ 0.5/t) # epsilon-greedy\n\n        # 我们在体验过程中更新 Q(s,a)\n        model.theta\
    \ += alpha*(r + GAMMA*model.predict(s2, a2) - model.predict(s, a))*model.grad(s,\
    \ a)\n\n    # 下一个状态变为当前状态\n    s = s2\n    a = a2\n\n    biggest_change = max(biggest_change,\
    \ np.abs(model.theta - old_theta).sum())\n    deltas.append(biggest_change)\n\n\
    plt.plot(deltas)\nplt.show()\n```\n\n## 总结与后续\n\n在这一节中，我们将总结本章的内容以及本书的内容。我们还将讨论可能的后续——关于强化学习中接下来学习什么的的一些建议。\n\
    \n---本章完全关于近似方法。\n\n在课程早期我们就学到，MDP 的状态空间可能会迅速增长到无法枚举的程度，因此，尝试存储一个为状态空间中每个状态定义的值函数可能是不可行的。\n\
    \n近似方法允许我们对值函数进行参数化，从而使我们实际上需要的参数数量少于状态空间的大小。\n\n具体而言，我们了解到可微模型是一个很好的选择，因为我们可以使用随机梯度下降，并像我们在书中做的那样以在线方式继续学习。\n"
