    This is an order of magnitude larger than 3^9 = 19683.


    So the algorithm we want to use to enumerate all the states is definitely just
    generating the permutations.


    \---


    Ok, so how do we generate permutations?


    Think of just a binary number again.


    This is naturally a recursive problem, since a binary number of length N can start
    with 0 or 1, and then we can use all the permutations for a binary number of length
    N-1 appended to that.


    `all permutations of length N =`


    `[1] + all permutations of length N - 1`


    `[0] + all permutations of length N - 1`


    \---


    In pseudocode, we can do it like this. First we get the recursive results, that
    is all the binary numbers of length N-1. We do this outside the loop since it
    would be redundant to do it more than once. On the outer loop we loop through
    all the possible prefixes, and on the inner loop we loop through all the child
    results. Inside the loops we create the new results by combining the prefix and
    the suffix and we append this to our results list.


    For simplicity I’m not showing you the base case here.


    `def generate_all_binary_numbers(N):`


    `results = []`


    `child_results = generate_all_binary_numbers(N-1)`


    `for prefix in (‘0’, ‘1’):`


    `for suffix in child_results:`


    `new_result = prefix + suffix`


    `results.append(new_result)`


    `return results`


    \---


    So that was just an example for doing permutations in general. For us, it’s going
    to be slightly different.


    We are going to have a recursive function called get\_state\_hash\_and\_winner,
    and this is going to return a list of triples. Each triple is going to contain
    the state as a hashed number, who the winner is, if there is one, and whether
    or not this state represents a finished game.


    The 3 arguments to this function are the environment, which we really just need
    for the board matrix, and the (i, j) coordinates to place the next value, which
    can be 0 (empty), “X”, or “O”.


    \---


    `def get_state_hash_and_winner(env, i=0, j=0):`


    `results = []`


    ` `


    `for v in (0, env.x, env.o):`


    `env.board[i,j] = v # if empty board it should already be 0`


    `if j == 2:`


    `# j goes back to 0, increase i, unless i = 2, then we are done`


    `if i == 2:`


    `# the board is full, collect results and return`


    `state = env.get_state()`


    `ended = env.game_over(force_recalculate=True)`


    `winner = env.winner`


    `results.append((state, winner, ended))`


    `else:`


    `results += get_state_hash_and_winner(env, i + 1, 0)`


    `else:`


    `# increment j, i stays the same`


    `results += get_state_hash_and_winner(env, i, j + 1)`


    ` `


    `return results`


    In this function I am going to show you the base case. If i=2 and j=2, then we’re
    filling up the last location on the board, which means we should now check the
    game state, who the winner is, and whether or not the game is ended.


    Notice how even though I’m talking about the board being “filled up” now, I mean
    it can be filled up by the 0 value also, which represents empty, so it doesn’t
    necessarily mean the game is over, it just means the permutation is done.


    Now if it’s not a base case, we want to recursively call this function, but there
    are 2 numbers we can increase, i or j, but never both at the same time.


    If we’re at the end of a row, which means j=2, then we want to go to the next
    row at the first column, so we set j=0 and we increment i.


    If we’re not at the end of a row, we just increment j and leave i the same.


    \---


    Finally, I want to point out that the initial value functions for the 2 players
    won’t be equivalent.


    Remember that one player has to be “X”, and one player has to be “O”.


    So if the value function is 1 for “X” (X wins), it’s going to be 0 for “O” (O
