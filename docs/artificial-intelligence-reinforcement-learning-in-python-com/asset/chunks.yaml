- raw: 'Therefore, we can also use this to calculate the 2nd part of the expected
    value we saw earlier.


    V(s) = E\[R(t+1)+gamma\*G(t+1) | S(t)=s\]


    V(s) = sum\[a\]{ pi(a | s) sum\[s’, r\]{ p(s’,r | s,a)(r + gamma\*E\[G(t+1) |
    S(t+1)=s’\]) }}


    V(s) = sum\[a\]{ pi(a | s) sum\[s’, r\]{ p(s’,r | s,a)r+V(s’) }


    This recursive equation has a special place in reinforcement learning, and it’s
    the equation from which all the algorithms we learn are based.


    It’s called the Bellman equation, named after the famous mathematician Richard
    Bellman.


    Bellmen pioneered the technique known as “dynamic programming”, which you may
    have learned about in your algorithms class. It’s related to recursion but it’s
    efficient since it builds up the solution using a bottom-up approach.


    In fact, one of the techniques we’ll learn about for solving MDPs is called “dynamic
    programming”.


    \---


    There is one more value function we’ll need to learn about in our discussion of
    value functions.


    What we just learned about, V(s), is called the state-value function.


    There is another value function Q(s, a), called the action-value function. It’s
    called this because the action “a” is also a parameter of the function.


    Note that because Q has 2 inputs, the amount of space we need to store it is quadratic.
    In particular, the amount of space we need is the the size of the set of states
    times the size of the set of actions (|S|x|A|).


    Q(s,a)=E\[G(t) | S(t)=s, A(t)=a\]


    In later sections of the course, you’ll see that the value function we use depends
    on what algorithm we’re using. There are some algorithms that specifically apply
    to only the state-value function or the action-value function.


    ## Optimal Policies and Optimal Value Functions


    In this section we are going to discuss optimal policies and optimal value functions.


    As you’ll see, they are interdependent, so we’ll need to discuss them together.


    This is a key concept in this course, and as you go through the course you’ll
    realize how much depth there is to this idea.


    We can talk about the relative “goodness” of policies.


    Let’s say we have 2 policies, pi1 and pi2.


    We can say pi1 is “better than” pi2, if the expected return of pi1 is greater
    than or equal to the expected return of pi2, for all states.


    pi1 > pi2 if V1(s) > V2(s) for all s in S


    Where S denotes the set of all states.


    \---


    Because we can talk about the relative “goodness” of policies, and one policy
    can be “better than” another policy, then we also have the notion of the “best”
    policy.


    In reinforcement learning, we call this the optimal policy. We use the symbol
    pi\* to represent it.


    The optimal policy is the policy for which there is no greater value function.


    We can write the optimal value function as the max of the value function over
    all policies.


    V\*(s) = max\[pi\]{ V(s | pi) } for all s in S


    Note that optimal policies are not necessarily unique, but optimal value functions
    are.


    You can imagine how 2 policies can lead to the same rewards, and hence lead to
    the same value functions.


    But if you have one value function that’s greater than another value function,
    then the optimal policy will be the one that leads to the greater value function.


    \---


    We can similarly define the optimal action-value function as the max of the action-value
    function over all policies.


    Q\*(s,a) = max\[pi\]{ Q(s,a | pi) } for all s in S,a in A


    \---


    Because the optimal action-value function is with respect to the optimal policy,
    we can define it recursively in terms of the optimal state-value function.


    Q\*(s,a)=E\[R(t+1)+V\*(S(t+1)) | S(t)=s,A(t)=a\]


    \---


    The state-value function and the action-value function can be related in this
    way. The state-value function means we are always choosing the best actions, and
    therefore choosing the max over all actions from Q.


    V\*(s) = max\[a\]{ Q\*(s,a) }


    Notice how Q leads to some practical advantages during implementation. If we only
    have V(s), then what we have to do is try all possible actions “a”, to take us
    to the next states, so we can get the values for those states.


    But if we have Q, we can directly choose the best action over all actions “a”,
    from Q.


    \---


    Let’s continue manipulating our equation for V\*.


    V\*(s) = E\[R(t+1)+V\*(S(t+1)) | S(t)=s,A(t)=a\]


    V\*(s) = max\[a\]{ sum\[s’,r\]{ p(s’,r | s,a)(r+V\*(s’)) }}


    We call this the “Bellman Optimality Equation” for the state-value function.


    \---


    We can do a similar thing to get the “Bellman Optimality Equation” for the action-value
    function.


    Q\*(s,a) = E\[R(t+1)+max\[a’\]{ Q\*(St+1,a’) } | S(t)=s,A(t)=a\]


    Q\*(s,a) = sum\[s’,r\]{ p(s’,r | s,a)(r+max\[a’\]{ Q\*(s’,a) }}


    \---


    One last thing to talk about is, once we have the optimal value function, how
    do we implement the optimal policy?


    The key point is the value function already takes into account future rewards,
    so nothing extra needs to be done in order to optimize the total expected future
    reward.


    All we need to do is choose the action that yields the best value for the next
    state.


    Notice how for the state-value function V, we need to do a look-ahead search,
    because V itself does not depend on a.


    So implementation-wise, we need to do all the possible actions “a”, look at what
    state we arrive in, s’, and choose the one that gives us the largest V(s’).


    If we have Q(s,a), we can do this lookup directly.


    What Q(s,a) does then, is it effectively caches the results of all one-step ahead
    searches.


    ## Summary


    In this lecture, we are going to summarize this section of the course.


    You’ll notice that it was purely theoretical.


    This was so we could setup all the prerequisites we need for the later sections.


    In particular, we formalized the Markov Decision Process framework.


    We talked about policies.


    We talked about returns, which is the total future reward.


    We talked about how to discount future rewards using the discount rate, gamma.


    We more rigorously defined value function and looked at 2 different types of value
    functions. The state-value function and the action-value function.


    We looked at the Bellman equation, which recursively defines the value function
    in terms of the value function at the next state.


    We looked at the notion of optimality, and defined the optimal policy, optimal
    state-value function, and optimal action-value function.


    Through these we were able to also recursively define the optimal value functions
    in terms of optimal value function at the next state.


    These are called the “Bellman Optimality Equations”.


    In the next section, we are going to begin looking at algorithms to compute the
    value functions for a given policy, and the optimal value functions and optimal
    policy.


