- raw: 'Next, we generate an episode from this starting position, following the current
    policy.


    From this, we receive a list of triples containing states, actions, and returns.


    We append these to a dictionary of returns keyed on state-action pairs.


    Next, we recalculate Q(s,a) as the average of all the returns for this state-action
    pair.


    Next, we do the policy improvement step, which is to assign the action that’s
    the argmax of Q.


    \---


    There is one subtle problem with this algorithm.


    Recall that if we do an action that results in us bumping into a wall, we end
    up in the same state as before.


    So if we follow this policy, we’ll never end up in a terminal state and therefore
    never finish the episode.


    To avoid this problem, we’ll introduce a hack, where if we end up in the same
    state after doing an action, we’ll give this a reward of -100, which is lower
    than any other reward from the environment, and end the episode.


    \---


    It’s interesting that this method converges, even though the returns that we average
    for Q are for different policies.


    Intuitively, Q has to converge, since if Q is suboptimal, then the policy will
    change, and that will in turn cause Q to change.


    We can only achieve stability when both the value and the policy converge to the
    optimal value and the optimal policy.


    An interesting fact is that this has never been formally proven.


    ## MC-ES in Code


    In this lecture we are going to use Monte-Carlo Exploring-Starts to solve the
    control problem, or in other words, find the optimal policy and the optimal value
    function.


    If you don’t want to code this yourself, although I highly recommend you do, the
    relevant file is monte\_carlo\_es.py


    We start out with our standard imports and constants.


    `import numpy as np`


    `import matplotlib.pyplot as plt`


    `from grid_world import standard_grid, negative_grid`


    `from iterative_policy_evaluation import print_values, print_policy`


    ` `


    `GAMMA = 0.9`


    `ALL_POSSIBLE_ACTIONS = (''U'', ''D'', ''L'', ''R'')`


    Next we have the play\_game function.


    `def play_game(grid, policy):`


    `# returns a list of states and corresponding returns`


    ` `


    `# reset game to start at a random position`


    `# we need to do this if we have a deterministic policy`


    `# we would never end up at certain states, but we still want to measure their
    value`


    `# this is called the "exploring starts" method`


    `start_states = grid.actions.keys()`


    `start_idx = np.random.choice(len(start_states))`


    `grid.set_state(start_states[start_idx])`


    ` `


    `s = grid.current_state()`


    `a = np.random.choice(ALL_POSSIBLE_ACTIONS) # first action is uniformly random`


    ` `


    `# be aware of the timing`


    `# each triple is s(t), a(t), r(t)`


    `# but r(t) results from taking action a(t-1) from s(t-1) and landing in s(t)`


    `states_actions_rewards = [(s, a, 0)]`


    `while True:`


    `old_s = grid.current_state()`


    `r = grid.move(a)`


    `s = grid.current_state()`


    `if old_s == s:`


    `# hack so that we don''t end up in an infinitely long episode`


    `# bumping into the wall repeatedly`


    `states_actions_rewards.append((s, None, -100))`


    `break`


    `elif grid.game_over():`


    `states_actions_rewards.append((s, None, r))`


    `break`


    `else:`


    `a = policy[s]`


    `states_actions_rewards.append((s, a, r))`


    ` `


    `# calculate the returns by working backwards from the terminal state`


    `G = 0`


    `states_actions_returns = []`


    `first = True`


    `for s, a, r in reversed(states_actions_rewards):`


    `# the value of the terminal state is 0 by definition`


    `# we should ignore the first state we encounter`


    `# and ignore the last G, which is meaningless since it doesn''t correspond to
    any move`


    `if first:`


    `first = False`


    `else:`


    `states_actions_returns.append((s, a, G))`


    `G = r + GAMMA*G`


    `states_actions_returns.reverse() # we want it to be in order of state visited`


    `return states_actions_returns`


    The first few lines are choosing the first state and the first action randomly,
    which is required when we’re doing exploring starts.


    Next, we play the game. Notice how we are now storing triples of states, actions,
    and rewards.


    We have an extra if-statement here, so that if our policy is to bump into a wall,
    we’ll break out of the loop with a very negative reward, so that the agent never
    chooses this action again.


    Next, we calculate the returns. This is largely the same as before except now
    we’re adding in the actions.


    \---


    Next, we have a special function that simultaneously does the argmax and the max
    over a dictionary, which is what we’ll be using to store Q.


    `def max_dict(d):`


    `# returns the argmax (key) and max (value) from a dictionary`


    `# put this into a function since we are using it so often`


    `max_key = None`


    `max_val = float(''-inf'')`


    `for k, v in d.iteritems():`


    `if v > max_val:`


    `max_val = v`


    `max_key = k`


    `return max_key, max_val`


    All it does is returns the key for the maximum value, and the maximum value itself.


    \---


    Next we have the main section. I’m using the negative grid here but you can try
    the standard grid as well.


    `if __name__ == ''__main__'':`


    `# use the standard grid again (0 for every step) so that we can compare`


    `# to iterative policy evaluation`


    `# grid = standard_grid()`


    `# try the negative grid too, to see if agent will learn to go past the "bad spot"`


    `# in order to minimize number of steps`


    `grid = negative_grid(step_cost=-0.1)`


    ` `


    `# print rewards`


    `print "rewards:"`


    `print_values(grid.rewards, grid)`


    ` `


    `# state -> action`


    `# initialize a random policy`


    `policy = {}`


    `for s in grid.actions.keys():`


    `policy[s] = np.random.choice(ALL_POSSIBLE_ACTIONS)`


    ` `


    `# initialize Q(s,a) and returns`


    `Q = {}`


    `returns = {} # dictionary of state -> list of returns we''ve received`


    `states = grid.all_states()`


    `for s in states:`


    `if s in grid.actions: # not a terminal state`


    `Q[s] = {}`


    `for a in ALL_POSSIBLE_ACTIONS:`


    `Q[s][a] = 0 # needs to be initialized to something so we can argmax it`


    `returns[(s,a)] = []`


    `else:`


    `# terminal state or state we can''t otherwise get to`


    `pass`


    We print the rewards as usual, and set the initial policy to random actions.


    Next we initialize Q and our returns dictionary.


    Notice how, even though Q doesn’t strictly need to be initialized in order to
    do policy evaluation, it does need to be initialized just in case we do the argmax
    and the values haven’t been set yet.


    \---


    Next, we have our main loop.


    `# repeat until convergence`


    `deltas = []`


    `for t in xrange(2000):`


    `if t % 1000 == 0:`


    `print t`


    ` `


    `# generate an episode using pi`


    `biggest_change = 0`


    `states_actions_returns = play_game(grid, policy)`


    `seen_state_action_pairs = set()`


    `for s, a, G in states_actions_returns:`


    `# check if we have already seen s`


    `# called "first-visit" MC policy evaluation`


    `sa = (s, a)`


    `if sa not in seen_state_action_pairs:`


    `old_q = Q[s][a]`


    `returns[sa].append(G)`


    `Q[s][a] = np.mean(returns[sa])`


    `biggest_change = max(biggest_change, np.abs(old_q - Q[s][a]))`


    `seen_state_action_pairs.add(sa)`


