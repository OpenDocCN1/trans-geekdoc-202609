- raw: 'We call these (S,A,R) or (state,action,reward) triples.


    In reinforcement learning, timing is an important concept as well, since every
    time you play a game you get a sequence of states, actions, and rewards.


    Within this framework, you start in a state S(t), you take an action A(t), but
    you receive a reward of R(t+1).


    So the reward you get always results from the state and action that you took at
    the previous time.


    This action also results in you being in a new state, S(t+1).


    So another important triple is (S(t), A(t), S(t+1)). Usually we just denote this
    as (s, a, s’).


    \---


    That’s reinforcement learning in a nutshell.


    You program the agent to try to be intelligent.


    The agent interacts with its environment by being in a state, taking an action
    based on that state, which then brings it to another state.


    The environment gives the agent a reward, either positive or negative, when it
    arrives in the next state.


    This section is just definitions. In later sections, we’ll dive deeper into the
    theory and implement code.


    #  


    # Where to get the Code


    In this section I am going to show you where to get the code for this course.


    All of the code for my machine learning courses are in my github repo:


    [https://github.com/lazyprogrammer/machine\_learning\_examples](https://github.com/lazyprogrammer/machine_learning_examples)


    The relevant folder is “rl”


    The command to download the code is “git clone” and then my Github URL, which
    you can copy and paste from the repo homepage.


    `git clone git@github.com:lazyprogrammer/machine_learning_examples.git`


    I would recommend using the SSH url so that you don’t need to type in your github
    password every time you do anything.


    Make sure you periodically check for updates or run “git pull” so that you have
    the latest version.


    All of the data in this course will be mentioned in the relevant section, if needed.


    If you don’t know how to use Git, or you need help setting up your development
    environment with the right Python libraries, you’ll want to check out the environment
    setup lecture on my YouTube channel: [https://www.youtube.com/watch?v=Fm1oXw4hZj0](https://www.youtube.com/watch?v=Fm1oXw4hZj0)
    .


    At this stage I suspect that these things are probably trivial for you. This book
    is designed with that in mind.


    I always recommend my students try to code for themselves, but if you get stuck
    or you need help, then the code in my github repo has already been verified to
    work.


    So you can always check your code against that.


    Occasionally people ask me “what are the practice activities for this book?” -
    the practice is implementing the algorithms you learn about.


    The point of that is because it’s one thing to watch the theory lectures and understand
    the concepts at a high level, it’s another thing entirely to understand them so
    well that you can implement them in code without any reference.


    This is what computer scientists do, so that’s the approach you should take.


    Writing all the code yourself in this course is especially important here.


    The thing I’ve found with reinforcement learning algorithms is that at a high
    level they all look almost exactly the same .


    So if all you do is sit there and read the book straight through, you’ll be confused
    and you’ll probably wonder why I taught you the same thing 3 times.


    I recommend you do not take this approach, because you won’t get anything out
    of it.


    So take initiative, be proactive. Those are the kinds of people this book is for.


    Only by trying to write the code yourself and struggling through the details will
    you really start to understand what is being taught.


    #  


    # The Multi-Armed Bandit


    ## Problem Setup and the Explore-Exploit Dilemma


    In this section of the book we are going to re-examine the multi-armed bandit
    problem, which you first saw in my course on Bayesian Machine Learning and A/B
    testing.


    If you haven’t taken that course, don’t worry too much, since we are going to
    fully cover the problem in this book.


    Suppose you go to a casino and you have a choice between 3 slot machines. Each
    slot machine can give you a reward of 0 or 1, so it’s like a coin toss for now.


    This is called the multi-armed bandit problem because when you play a slot machine
    you have to pull on the arm of the machine, and they are bandits because they’re
    taking your money.


    The win rate of each of the slot machines is unknown. So for example, they might
    be 0.1, 0.3, and 0.5. But you wouldn’t know that, you would only be able to discover
    it by collecting data.


    Now your goal at the casino is obviously to maximize your winnings. If you were
    psychic and could determine using your psychic powers which machine had the highest
    win rate, you would play only that machine, and that’s how you would maximize
    your winnings.


    But since you don’t know the win rates, you need to estimate them by collecting
    data, and that means you have to play each of the machines.


    This is where the dilemma comes in.


    You need to collect lots of data for your estimates to be accurate. But if you
    collect lots of data then you’re going to spend lots of time playing suboptimal
    bandit arms.


    So you need to balance between trying to maximize your earnings and trying to
    obtain accurate measurements of each bandit’s win rate, since in order to maximize
    your earnings you need to accurately know that information.


    In traditional A/B testing, what you would do is predetermine ahead of time the
    number of times you need to play each bandit in order to obtain statistical significance.


    The number of times you need to play is dependent on a number of things, such
    as the difference in win rates between each bandit. If the difference is bigger,
    you need less samples, but if the difference is smaller, you need more samples.


    This is kind of silly because you don’t know the difference before you start the
    test, so that’s one of the disadvantages of traditional A/B testing.


    An important rule of A/B testing is that you do not stop your test early. So if
    you decided beforehand that you need to play each bandit 1000 times, and by the
    time you get to 500, you’ve calculated 90% win rate for one bandit, and 10% win
    rate for another bandit, you’re not allowed to stop.


    Luckily, we don’t care about statistical significance in this course so we don’t
    need to follow any of those rules.


    \---


    It’s interesting that humans behave the opposite.


    Suppose you win 2/3 times on one bandit arm, and 0/3 times on another bandit arm.


    You would probably feel a strong urge to only play the 2/3 bandit from this point
    forward, even though there is a high probability the other bandit could still
    be better.


    If I were to ask you in a statistical way - if you think 2/3 and 0/3 give you
    accurate measurements, you would say “no way”!


    As a data scientist you know that there’s a low probability that the first bandit
    has an actual win rate of 67% and a low probability that the second bandit has
    an actual win rate of 0%.


    You know this because 3 is a very tiny sample size.


    And yet if you are playing slot machines you feel compelled to believe that the
    first bandit is better.


    In the coming sections, we’ll learn about algorithms that will systematically
    make a trade-off between exploration and exploitation.


    These will allow us to improve upon these 2 poor solutions to the problem, which
    are human emotion and traditional A/B testing.


    ## The Epsilon-Greedy Strategy


    The first solution to the explore-exploit dilemma is called the epsilon-greedy
    strategy. This is the most important because it’s the one we’ll be using throughout
    the course (although any of the other techniques can be equivalently applied).


    We like it because it’s simple.


    The way it works is this.


    We use a small number called epsilon to be the probability of exploration.


    Typical values for epsilon are 10% or 5%.


    Here’s some pseudocode that does this.


    `if random() < eps:`


    `play random arm`


    `else:`


    `choose current best arm`


    `update estimate for the arm played (i.e. avg = sum / N)`'
