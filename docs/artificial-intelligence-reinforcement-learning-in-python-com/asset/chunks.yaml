    \    state_history = play_game()\n    s = state_history[0]\n    for s’ in state_history[1:]:\n\
    \        V(s) = V(s) + learning_rate*(V(s’) - V(s))\n```\n\n---\n\nThe next detail\
    \ we have to talk about is how to actually play the game.\n\nAre we just going\
    \ to take random actions?\n\nIn this case, we don’t have to, since we have the\
    \ value function.\n\nThe value function tells us how good a state is based on\
    \ how good the future states will be, so all we need to do is perform the action\
    \ that leads to the best next state.\n\nIn pseudocode it might look like this:\n\
    \n```python\nmaxV = 0\nmaxA = None\nfor a, s’ in possible_next_states:\n    if\
    \ V(s’) > maxV:\n        maxV = V(s’)\n        maxA = a\nperform action maxA\n\
    ```\n\n---\n\nNow what’s the problem with this strategy?\n\nThe problem is the\
    \ value function isn’t accurate! If we already had an accurate value function,\
    \ we wouldn’t need to do any of this work in the first place.\n\nYou might recognize\
    \ this problem as a problem we already talked about. It’s the explore-exploit\
    \ dilemma.\n\nIn particular, by taking random actions, we can learn about new\
    \ states that we would have otherwise never gone to.\n\nBy doing so, we can improve\
    \ our estimate of the value function for those states.\n\nBut in order to win,\
    \ we need to do the action that yields the maximum value.\n\nSo we’ll be using\
    \ the epsilon-greedy strategy to make a trade-off between exploration and exploitation.\n\
    \n---\n\nLet’s look at some intuition for why this iterative update works.\n\n\
    First, you’ll recognize this update equation from before. It should remind you\
    \ both of the low-pass filter and the iterative average finding equation we saw\
    \ earlier.\n\nIt should also look like gradient descent if you’ve encountered\
    \ that in the past. `V(s’)` is like the target value, and we want to move `V(s)`\
    \ toward that value.\n\nHowever, with reinforcement learning there are multiple\
    \ possible next states, so there are multiple `s’`.\n\nSo by doing this update\
    \ equation multiple times we’re pulling `V(s)` in multiple different directions\
    \ for each different `s’`.\n\nThe idea is that, by playing infinitely many episodes,\
    \ the proportion of time we spend in `s’` will approach the true next-state probabilities.\n\
    \nAs the number of games approaches infinity, we achieve the exact expected value:\n\
    \n`p(s1)*V(s1) + p(s2)V(s2) + ...`\n\n---\n\nOne extremely important detail that’s\
    \ also extremely difficult to discern given only the update formula, is the order\
    \ in which you have to update the values for any given state.\n\nWe know that\
    \ for any particular episode, we’re only going to be updating the values for the\
    \ states that were in that episode.\n\nBut the key with this equation is, we’re\
    \ moving `V(s)` closer to `V(s’)`.\n\nThat means we’re doing this update under\
    \ the assumption that `V(s’)` is more accurate than `V(s)`.\n\nFor the terminal\
    \ state, this is true, since that’s always going to be 0 or 1 and will never change.\n\
    \nBut if both `V(s)` and `V(s’)` are of the same accuracy, as in, they are both\
    \ not accurate at all, then making one closer to the other.\n"
  trans: "\n\n在本本书的这一章节，我们将引入一些不现实的限制，以便问题能够被解决，但你将在后面的章节中看到我们并不需要这样做。\n\n我们将使用的算法是一种迭代算法，这意味着我们将运行一个循环，并且每次通过循环时，都会越来越接近真实的价值函数。\n\
    \n我们做的第一件事是初始化价值函数。对于智能体胜利的所有状态，我们认为其值为 1。对于智能体失败或平局的所有状态，我们认为其值为 0。对于所有其他状态，我们认为其值为\
    \ 0.5。\n\n### `init`\n\n`V(s) = 1 if s = winning state`\n\n`V(s) = 0 if s = losing\
    \ state or draw`\n\n`V(s) = 0.5 otherwise`\n\n对于我们未来将看到的算法，我们不需要进行如此仔细的初始化。\n\n\
    理解价值函数的一种方法（仅适用于此游戏，而不通用）是：它是获胜的概率。\n\n值始终在 0 和 1 之间，所以这是有意义。\n\n---\n\n更新方程看起来很简单，但包含一些隐藏的细节。\n\
    \n`V(s) = V(s) + alpha*(V(s’)-V(s))`\n\n### `s = current state, s’ = next state`\n\
    \n第一个细节是，这里的 `s` 指我们在一个回合（episode）中遇到的所有状态。\n\n这意味着对于循环的每次迭代，我们实际上需要玩一次游戏并记住我们所处的每个状态。\n\
    \n然后我们遍历状态历史中的每个状态，并使用这个方程更新价值。\n\n注意，终止状态（terminal state）的值永远不会被更新，因为这个方程根据下一个状态的值来更新当前状态的值，而如果我们处于终止状态，则下一个状态是不存在的。\n\
    \n`i.e. if s = terminal, then s’ doesn’t exist`\n\n---\n\n在伪代码中它可能像这样：\n\n```python\n\
    for t in range(max_iterations):\n    state_history = play_game()\n    s = state_history[0]\n\
    \    for s’ in state_history[1:]:\n        V(s) = V(s) + learning_rate*(V(s’)\
    \ - V(s))\n```\n\n---\n\n我们必须讨论的下一个细节是实际上如何玩游戏。\n\n我们仅仅是采取随机动作吗？\n\n在这种情况下，我们不必这样做，因为我们已经有了价值函数。\n\
    \n价值函数告诉我们一个状态的好坏取决于未来状态的好坏，所以我们所做的就是执行通往最佳下一个状态的动作。\n\n在伪代码中它可能像这样：\n\n```python\n\
    maxV = 0\nmaxA = None\nfor a, s’ in possible_next_states:\n    if V(s’) > maxV:\n\
    \        maxV = V(s’)\n        maxA = a\nperform action maxA\n```\n\n---\n\n现在这个策略有什么问题呢？\n\
    \n问题在于价值函数是不准确！如果我们已经有了一个准确的价值函数，从一开始我们就不需要进行这些工作。\n\n你可能认出这是我们已经讨论过的问题。它是探索与利用的困境（explore-exploit\
    \ dilemma）。\n\n特别是，通过采取随机动作，我们可以学习到否则永远不会去的新状态。\n\n通过这样做，我们可以改进对那些状态的价值函数的估计。\n\
    \n但为了获胜，我们需要执行产生最大价值的动作。\n\n所以，我们将使用 epsilon-贪婪策略（epsilon-greedy strategy）在探索和利用之间进行权衡。\n\
    \n---\n\n让我们来看看为什么这种迭代更新有效的直观理解。\n\n首先，你会认出之前的这个更新方程。它应该让你想起之前见过的低通滤波器和迭代平均值求解方程。\n\
    \n如果你以前遇到过梯度下降，它看起来也像梯度下降。`V(s’)` 就像是目标值，我们想让 `V(s)` 向该值移动。\n\n然而，在强化学习中存在多个可能的下一个状态，因此有多个\
    \ `s’`。\n\n因此，通过多次执行这个更新方程，我们为每个不同的 `s’` 将 `V(s)` 拉向多个不同的方向。\n\n这种想法是，通过玩无限的回合，我们花费在\
    \ `s’`上的时间比例将接近真实的下一个状态概率。\n\n随着游戏次数趋于无穷大，我们实现了精确的期望值：\n\n`p(s1)*V(s1) + p(s2)V(s2)\
    \ + ...`\n\n---\n\n另一个极其重要的、且仅凭更新公式极难察觉的细节是，你必须更新任何给定状态价值的顺序。\n\n我们知道，对于任何特定的回合，我们只会更新出现在该回合中的状态值。\n\
    \n但这个方程的关键在于，我们正在让 `V(s)` 靠近 `V(s’)`。\n\n这意味着我们是在假设 `V(s’)` 比 `V(s)` 更准确的情况下进行这种更新。\n\
    \n对于终止状态，这是正确的，因为那总是 0 或 1 且永远不会改变。\n\n但如果 `V(s)` 和 `V(s’)` 的准确性相同，也就是说它们完全都不准确，那么让其中一个靠近另一个就没有意义了。"
