- raw: "Keep in mind that this solution is in no way unique, and in fact there is\
    \ some poor coupling between objects that are probably not optimal.\n\nSo if you\
    \ were to do this on your own chances are high that your solution might look way\
    \ different, which is ok as long as it works.\n\nIf you don’t want to code along\
    \ and you just want to run the code, the relevant file in the course repo is tic\\\
    _tac\\_toe.py.\n\n\\---\n\nAt a high level, we’ll have 2 main objects, the Agent\
    \ and the Environment.\n\n`Agent <-----> Environment`\n\n` `\n\n`play_game(agent1,\
    \ agent2, environment)`\n\nDuring any game, there will be 2 instances of the agent\
    \ object, and they’ll both interact with the same single instance of the environment.\n\
    \nIn order to make these things interact, we can create a function called play\\\
    _game(), which accepts the agent for player 1, the agent for player 2, and the\
    \ environment object.\n\n\\---\n\nSo what should go inside the play\\_game() function?\n\
    \nFirst, the code. Then, discussion.\n\n`def play_game(p1, p2, env, draw=False):`\n\
    \n`# loops until the game is over`\n\n`current_player = None`\n\n`while not env.game_over():`\n\
    \n`# alternate between players`\n\n`# p1 always starts first`\n\n`if current_player\
    \ == p1:`\n\n`current_player = p2`\n\n`else:`\n\n`current_player = p1`\n\n` `\n\
    \n`# draw the board before the user who wants to see it makes a move`\n\n`if draw:`\n\
    \n`if draw == 1 and current_player == p1:`\n\n`env.draw_board()`\n\n`if draw ==\
    \ 2 and current_player == p2:`\n\n`env.draw_board()`\n\n` `\n\n`# current player\
    \ makes a move`\n\n`current_player.take_action(env)`\n\n` `\n\n`# update state\
    \ histories`\n\n`state = env.get_state()`\n\n`p1.update_state_history(state)`\n\
    \n`p2.update_state_history(state)`\n\n` `\n\n`if draw:`\n\n`env.draw_board()`\n\
    \n` `\n\n`# do the value function update`\n\n`p1.update(env)`\n\n`p2.update(env)`\n\
    \nInside this function, it’ll essentially be a single loop. We’ll alternate between\
    \ the 2 players, and at each iteration of the loop, we need to do a few things.\n\
    \nFirst, we need to make the current player perform an action which updates the\
    \ environment.\n\nSecond, we need to switch who the current player is, so that\
    \ it alternates.\n\nThird, we need to check if the game is over, since that’s\
    \ when the loop will terminate.\n\nSo you see here we’ve created a partial API\
    \ for some instance methods that our objects will need.\n\nThe environment will\
    \ need a game\\_over() function that returns a boolean, true if the game is over,\
    \ false if not. You can imagine that this is going to have to scan the board to\
    \ check if there is a winner or if the board is full and it’s a draw.\n\nThe agent\
    \ will need a take\\_action() function which accepts as a parameter the environment.\
    \ This will update the environment and hence the state.\n\nAnother function we\
    \ need on the agent is an update() function that updates that agent’s internal\
    \ estimate of the value function. This is where the update equation we talked\
    \ about is going to go. The update() function will need to accept the environment\
    \ as well since it’ll have to query the most current reward from the environment.\n\
    \nAnother function that will be extremely useful for us, but not strictly necessary,\
    \ is a draw\\_board() function that will display what positions are currently\
    \ occupied and by what pieces.\n\n\\---\n\nFrom this design alone, you can probably\
    \ start coding your own tic-tac-toe. So if you had no idea where to start previously,\
    \ hopefully this gave you a direction for where to start heading. So if you want\
    \ to try to do the rest yourself, that would be highly encouraged.\n\n## Representing\
    \ States\n\nIn this lecture we are going to talk about how we’re going to represent\
    \ states in our tic-tac-toe game.\n\nEarlier I promised you that this would be\
    \ an O(1) lookup.\n\nOne way to accomplish this would be to use a dictionary,\
    \ since the keys to a dictionary can be any immutable object. So we could represent\
    \ the game board with a 2-D tuple of size 3x3 and store the values inside as tuple\
    \ elements.\n\nHowever, we can do this so that each state maps to a number, and\
    \ by doing that we can store the value function as a Numpy array.\n\n\\---\n\n\
    So how can we map each state to a number?\n\nRecall that we talked about how to\
    \ find an upper limit on the number of hidden states earlier.\n\nWe calculated\
    \ it to be 3^9 = 19683 which is not too big of an array to store in memory.\n\n\
    Notice that this also encodes impossible states, for example, an “X” in all 9\
    \ locations, since you only need 3 in a row to win.\n\nThis overhead doesn’t affect\
    \ the algorithm at all so we won’t worry about it. These states are never reachable\
    \ anyway, since in every iteration of the loop we’re going to check if the game\
    \ is over, and if it is, we’ll quit the loop.\n\nSo these values will never show\
    \ up in the state history, which means their values will never be used or updated.\n\
    \n\\---\n\nThe idea of having 9 locations, and 3 possible values per location,\
    \ should remind you of binary numbers.\n\nYou know that N bits can store 2^N different\
    \ integers, and we can enumerate those possibilities by finding all the permutations\
    \ of a string of length N where each location can only contain 0 or 1.\n\nTo convert\
    \ a binary number into decimal, you know that the equation can be represented\
    \ like this.\n\nD = 2 ^(N-1)  b [N-1]  +...+2 ¹  b [1]  +2 ⁰  b [o] \n\nSo all\
    \ we need to do is replace the 2 with 3. And instead of “b” representing only\
    \ 0 or 1, it’ll have the values 0, 1, or 2.\n\nD = 3 ^(N-1)  b [N-1]  +...+3 ¹\
    \  b [1]  +3 ⁰  b [o] \n\n\\---\n\nIn code, it’s going to look like this:\n\n\
    `k = 0`\n\n`h = 0`\n\n`for i in xrange(LENGTH):`\n\n`for j in xrange(LENGTH):`\n\
    \n`if self.board[i,j] == 0:`\n\n`v = 0`\n\n`elif self.board[i,j] == self.x:`\n\
    \n`v = 1`\n\n`elif self.board[i,j] == self.o:`\n\n`v = 2`\n\n`h += (3**k) * v`\n\
    \n`k += 1`\n\n`return h`\n\nNotice how we loop through each location in the board,\
    \ which requires a nested for loop, but that’s only because of the structure of\
    \ the board.\n\nWe need to keep track of the power, which starts at 3^0 and gets\
    \ multiplied by 3 on each new location, so we keep track of that with the variable\
    \ k.\n\nWe use the variable h to accumulate the final result. We use the letter\
    \ “h” because “h” stands for “hash”, and that’s essentially what we’re doing.\
    \ We’re hashing an object and the output is an integer.\n\n## Enumerating States\
    \ Recursively\n\nIn this lecture we are going to talk about what work needs to\
    \ be done in order to initialize the value function properly.\n\nYou’ll recall\
    \ that for this particular algorithm, we need to initialize the value function\
    \ to very specific values, but for the algorithms we’ll learn about later, which\
    \ are considered the “real” reinforcement learning algorithms, you should be able\
    \ to initialize the value functions randomly.\n\nThe initialization we need is\
    \ V(s) = 1 for any state where the player wins, V(s) = 0 for any state where the\
    \ player loses or it’s a draw, and V(s) = 0.5 for all other states.\n\nIn order\
    \ to do this, we need to enumerate every possible state and assign the values.\n\
    \n\\---\n\nHere’s a question to think about.\n\nIs it better to create a game\
    \ tree, where you enumerate every possible sequence of moves, or is it better\
    \ to permute all 3^9 configurations of the board, even though many of those configurations\
    \ represent impossible game states?\n\nThink about it, then come back to the book!\n\
    \n\\---\n\nSo what happens if you do the game tree version?\n\nThe problem is\
    \ this leads to redundant states, or in other words, we’ll see the same state\
    \ more than once in the game tree.\n\nFor example, consider the case where X goes\
    \ in the top-middle, and then O goes in the center.\n\nAnother path down the tree\
    \ that leads to this exact same state is if O goes in the center, and then X goes\
    \ in the top-middle.\n\n`+---+---+---+`\n\n`| | x | |`\n\n`+---+---+---+`\n\n\
    `| | o | |`\n\n`+---+---+---+`\n\n`| | | |`\n\n`+---+---+---+`\n\n`2 ways to get\
    \ to this state`\n\nIf you think about how many different tree nodes there will\
    \ be in this game tree, you can see that at the root you have 9 different choices,\
    \ then at the layer below that you have 8 different choices, and then 7 and so\
    \ on."
