  trans: '


    ![](img/Image00001.jpg)


    人工智能：Python 强化学习


    作者：The LazyProgrammer


    - 介绍

    - 如何成功

    - 什么是强化学习？

    - 在哪里获取代码

    - 多臂老虎机

    - 井字棋游戏

    - 代码中的井字棋游戏

    - 马尔可夫决策过程

    - 动态规划

    - 蒙特卡洛

    - 时序差分学习

    - 函数近似

    - 结论


    # 介绍


    当人们谈论人工智能时，他们通常指并不是监督学习和无监督机器学习。


    与我们想象中 AI 所做的事情——下围棋和国际象棋、驾驶汽车以及以超人类水平玩视频游戏相比，这些任务是非常微不足道的。


    强化学习最近在实现这一切及更多领域方面变得流行。


    与深度学习一样，许多理论在 70 世纪和 80 世纪就被发现了，但直到最近，我们才能够亲眼观察到这些可能的惊人结果。


    2016 年，我们看到 `AlphaGo` 在围棋上击败了世界冠军。


    我们看到 AI 玩《毁灭战士》和《超级马里奥》等视频游戏。


    自动驾驶汽车开始在真实的道路上与其他司机一起，甚至载着乘客，完全无需人工辅助。


    如果这听起来很神奇，请为未来做好准备，因为加速收益律决定了这种进步将继续呈指数级增长。


    然而，学习监督和无监督机器学习并不是一项易事。到目前为止，仅就这些主题我就开设了 16 多门课程。


    而强化学习仍然开启了一个全新的世界。正如你将在本书中学学到的，强化学习范式与监督学习、无监督学习之间的差异，比它们彼此之间的差异大得多。


    那么我们将在书中讨论什么呢？


    我在强化学习中注意到，你学习的理论知识与你在编程期间实际的操作之间存在巨大的鸿沟。


    理论是非常抽象的，因此不断思考它如何实际应用于 AI 任务（如控制机器人或玩游戏）非常重要。


    为了实现这一目标，我们实际上将从一个游戏开始这本书：老虎机。


    老虎机，或者强化学习中被称为“多臂老虎机问题”，向我们介绍一个名为“探索与利用困境”（explore-exploit dilemma）的重要概念。你想利用你认为最好的那台老虎机，但你需要从所有老虎机中收集足够的数据，以便对那种信念充满信心。


    我们将讨论几种在探索与利用之间权衡的技术，包括 `epsilon-greedy` 方法、`UCB` 和 `Bayesian` 学习。


    # 如何成功


    在本章中，我将给你提供关于如何阅读这本书以及如何使收益最大化的建议。


    与其他在线资源一样，你没有考试或成绩之分，所以你真的必须成为那种采取主动性并积极学习的人。


    这意味着要理解所有写下的方程，如果有推导过程：确保你理解每一步，并能够独立完成该推导。


    这意味着要自己编写所有的代码，并在看我的代码之前尝试这样做。你应该将我的代码视为问题的答案，而不是一个在没有思考问题之前就直接看它的东西。


    我想上过我其他课程并读过我其他书的人理解这一点，但我不时仍看到学生对具体该如何练习感到困惑。


    ## 先决条件


    首先，如果你不知道这本书有先决条件，请从现在停下。你已经失败了。


    这是我看到人们失败，或者埋怪我的课程/书写的太难的首要原因。


    重申：为了理解这门课程，你需要对大学水平的微积分、概率论、马尔可夫模型、线性模型以及梯度下降有良好的掌握。当然，你必须知道如何用代码实现所有这些内容。


    '
