  trans: "\n\n如果你不想尝试自己编写代码（尽管我强烈建议你这样做），那么本课程相关的文件是 `monte_carlo.py`。\n\n在开头处我们有了常规的导入。我们导入了\
    \ `standard_grid` 和 `negative_grid`，我鼓励你尝试这两种。我们还使用了之前定义的 `print_values` 和 `print_policy`\
    \ 函数。\n\n我们也有通常的常数。\n\n```python\nimport numpy as np\nfrom grid_world import standard_grid,\
    \ negative_grid\nfrom iterative_policy_evaluation import print_values, print_policy\n\
    \nSMALL_ENOUGH = 10e-4\nGAMMA = 0.9\nALL_POSSIBLE_ACTIONS = ('U', 'D', 'L', 'R')\n\
    ```\n\n接下来我们定义了 `play_game` 函数，它接收一个网格和一个策略。\n\n```python\ndef play_game(grid,\
    \ policy):\n    # 返回状态列表和对应的回报列表\n\n    # 重置游戏以从随机位置开始\n    # 我们需要这样做，因为在我们当前的确定性策略下，\n\
    \    # 我们永远无法到达某些状态，但我们仍然想测量它们的价值\n    start_states = grid.actions.keys()\n  \
    \  start_idx = np.random.choice(len(start_states))\n    grid.set_state(start_states[start_idx])\n\
    \n    s = grid.current_state()\n    states_and_rewards = [(s, 0)] # (state, reward)\
    \ 元组列表\n    while not grid.game_over():\n        a = policy[s]\n        r = grid.move(a)\n\
    \        s = grid.current_state()\n        states_and_rewards.append((s, r))\n\
    \    # 从终止状态反向计算回报\n    G = 0\n    states_and_returns = []\n    first = True\n\
    \    for s, r in reversed(states_and_rewards):\n        # 根据定义，终止状态的价值为 0\n  \
    \      # 我们应该忽略遇到的第一个状态\n        # 并忽略最后一个 G，因为它是没有意义的，不对应于任何移动\n        if first:\n\
    \            first = False\n        else:\n            states_and_returns.append((s,\
    \ G))\n        G = r + GAMMA*G\n    states_and_returns.reverse() # 我们希望它按照访问状态的顺序排列\n\
    \    return states_and_returns\n```\n\n我们的策略与我们之前使用的同一个，即一直采取左上方的路径到达目标状态。对于不在该路径上的任何状态，则通向失败状态。\n\
    \n由于蒙特卡洛方法只计算实际访问过的状态的价值，如果我们只从指定的起始状态开始，那么将有一些状态是我们永远不会访问的，因此在 `play_game` 的开头我们需要这个小技巧，允许我们从任何状态开始游戏。这被称为“探索性开始”（exploring\
    \ starts）方法，我们稍后会讨论。\n\n接下来，我们运行游戏。这和我之前展示给你的伪代码几乎相同。这里的目标是创建一个访问过的所有状态以及我们获得的奖励列表。\n\
    \n接下来，我们计算每个状态的回报。这和我之前展示给你的伪代码完全一样。我们反向访问每个状态，并递归地计算回报。\n\n最后，我们反转回报列表，因为我们执行的是“首次访问”蒙特卡洛方法，我们希望它是按时间顺序排列的。\n\
    \n---\n\n接下来我们进入主部分。\n\n```python\nif __name__ == '__main__':\n    # 再次使用标准网格（每一步均为\
    \ 0）以便与\n    # 迭代策略评估进行比较\n    grid = standard_grid()\n\n    # 打印奖励\n    print\
    \ \"rewards:\"\n    print_values(grid)\n\n    # 策略状态 -> 动作\n    policy = {\n \
    \       (2, 0): 'U',\n        (1, 0): 'U',\n        (0, 0): 'R',\n        (0,\
    \ 1): 'R',\n        (0, 2): 'R',\n        (1, 2): 'R',\n        (2, 1): 'R',\n\
    \        (2, 2): 'R',\n        (2, 3): 'U',\n    }\n\n    # 初始化 V(s) 和 returns\n\
    \    V = {}\n    returns = {} # 状态对应的回报列表字典\n    states = grid.all_states()\n\
    \    for s in states:\n        if s in grid.actions:\n            returns[s] =\
    \ []\n        else:\n            # 终止状态或无法到达的状态\n            V[s] = 0\n```\n\n\
    首先我们要获取网格，打印奖励并创建策略。接下来我们初始化回报。注意我们不需要为终止状态设置价值，因为我们知道它们将是 0。我们也不需要为其他状态设置初始值，因为它们会立即被平均回报覆盖。\n\
    \n---\n\n接下来是我们的蒙特卡洛循环。它运行游戏并获取状态和回报列表。\n\n```python\n# 重复\nfor t in xrange(100):\n\
    \    # 使用 pi 生成回合\n    states_and_returns = play_game(grid, policy)\n    seen_states\
    \ = set()\n    for s, G in states_and_returns:\n        # 检查 s 是否已经见过\n      \
    \  # 调用“首次访问”MC 策略评估\n        if s not in seen_states:\n            returns[s].append(G)\n\
    \            V[s] = np.mean(returns[s])\n        seen_states.add(s)\n```\n\n接下来，我们创建一个集合来跟踪我们访问过的状态，因为我们只在在该回合中首次看到该状态时才添加回报。接下来，我们遍历所有的状态和回报。如果这是我们第一次看到该状态，我们将\
    \ `G` 添加到该状态的回报列表中。然后我们重新计算 `V(s)`。注意我们没有对计算平均值做任何特殊处理，只是使用了默认定义。\n\n然后我们将“s”添加到状态。在脚本结束处，我们打印价值和策略。\n\
    \n```python\nprint \"values:\"\nprint_values(V, grid)\nprint \"policy:\"\nprint_policy(policy,\
