    Recall earlier when we talked about solving a maze. We said that a robot that
    just moved randomly would eventually solve the maze, and if you only gave it a
    reward for solving the maze, then it would never learn anything beyond a random
    strategy.


    We learned that we could incentivize the robot to solve the maze more efficiently
    by giving it a negative reward for each step taken.


    And so that’s what we’re doing here. We’re incentivizing the robot to solve the
    maze efficiently, rather than moving randomly until it hits the goal.


    You’ll see in the code samples how these 2 reward structures can affect the policy
    that the agent eventually learns.


    ## Iterative Policy Evaluation in Code


    In this section, we are going to implement iterative policy evaluation in code.


    To demonstrate how we can find the value function for different policies, we’re
    going to do iterative policy evaluation on 2 different policies.


    The first policy we’ll look at is a completely random policy.


    Remember, there are 2 probability distributions involved in Bellman’s equation,
    there’s pi(a | s), and there’s the Markov state-transition probability, p(s’,
    r | s, a).


    Which one do you think is relevant for implementing Bellman’s equation?


    \---


    The answer is, pi(a | s). This is the probability that I do an action a, given
    I’m in a state s.


    For a uniformly random policy, this probability will be 1 / number of possible
    actions from the state s.


    The other probability, p(s’, r | s, a), is only relevant when the state transitions
    themselves are random.


    That’s a scenario where, you try to move left, but instead you end up going right.


    \---


    The second policy we’ll look at is a completely deterministic policy. I’ve pasted
    it here for your convenience.


    `---------------------------`


    `R | R | R | |`


    `---------------------------`


    `U | | R | |`


    `---------------------------`


    `U | R | R | U |`


    `---------------------------`


    From the start position, you go directly to the goal state. That’s U/U/R/R/R.


    However, if you’re starting from ANY other state, the policy is to go directly
    to the losing state.


    So we should expect the values along the upper-left path to be positive, and the
    values of the other states to be negative.


    Let’s now get to the code.


