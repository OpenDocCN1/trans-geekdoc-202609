- raw: 'And finally we have actions and rewards .


    Actions are the things the agent can do that will affect its state. So in our
    tic-tac-toe game that’s placing a piece on the board.


    Performing an action always brings us to the next state, which also comes with
    a possible reward.


    \---


    One aspect of rewards is that a reward just tells you “how good” your action was,
    not whether it was a correct/incorrect action. It doesn’t tell you whether it
    was the best/worst action. It’s just a number.


    So if you’re an agent, the rewards you’ve gotten over the course of your existence
    don’t necessarily represent the possible rewards you could get in the future.


    You could be searching a bad part of the state space and hit a local maximum of
    10 points, when the global maximum is 1000 points.


    But you would never know that if you were the agent. We’d know because we designed
    the game. That’s again an instance of God-mode knowledge.


    \---


    That’s a lot like the life of an animal or human being as well. You’re born into
    a specific environment, and you do your daily routine. You might find some things
    that make you happy, and you might consider that a sort of local maximum reward.


    But what if that person is living in some place without modern medicine or technology,
    and then you compare that to modern life in modern civilizations, you realize
    that the local maximum is nowhere near the global maximum.


    So everything is relative, rewards are kind of meaningless numbers that only make
    sense relative to each other.


    In terms of reinforcement learning more reward is always better than less reward.


    \---


    Now here’s some funny notation.


    We know that being in state S(t), and taking action A(t), will lead us to the
    reward R(t+1) and the state S(t+1).


    But when we drop the time indexes, we represent this 4-tuple as (s, a, r, s’).
    We don’t prime the r as you might expect, which is odd but it’s the standard notation.


    So the prime does not mean “at time=t+1”.


    \---


    Now we are going to define some new terms.


    The first new term we want to discuss is “episode ”.


    An episode represents one run of the game.


    For example, we’ll start a game of tic-tac-toe with an empty board.


    As soon as one player gets 3 of their pieces in a row, that’s the end of that
    episode.


    As you can imagine, our reinforcement learning agent will be learning across many
    episodes.


    So for example, after playing 1000 or 10,000 or 100,000 episodes we can possibly
    have trained an intelligent agent.


    How long it will take is of course is a hyperparameter and that depends on the
    game being played, the number of states, how random the game is, and so on.


    You should be used to hyperparameters if you’ve taken deep learning courses in
    the past.


    \---


    We call playing the game of tic-tac-toe an “episodic task” because you can play
    it again and again.


    This is different from a “continuous task”, which never ends. So in a way you
    only play that game once.


    We will not be looking at continuous tasks in this book.


    \---


    How do we know we’re at the “end” of an episode? There are certain states in the
    state space that tell you the game is over.


    For tic-tac-toe this is when one of the 2 players has 3 of their pieces in a row
    or when the board is full.


    These states are called “terminal states ”.


    So a “terminal state” is a state from which you can take no more actions. It means
    the episode is over.


    In terms of tic-tac-toe that means either player 1 has won, player 2 has won,
    or it’s a draw.


    \---


    Another famous problem in reinforcement learning and control systems is the problem
    of the inverted pendulum, as it’s called in control systems, or cart-pole, as
    it’s called in reinforcement learning. They are the same problem.


    If you search “inverted pendulum” on Google you’ll see research papers in the
    control systems field, and if you search “cart-pole” on Google you’ll see research
    papers in the reinforcement learning field.


    At the beginning of an episode, the cart is stationary and the pole is perpendicular
    to the ground. But since this is an unstable system, the pole starts to fall down,
    and the job of the agent is to move the cart so that the pole doesn’t fall.


    When the pole falls so far that it’s impossible to get it back up, any angle past
    a certain threshold is a terminal state.


    Note that because the angle in this system is a real number, this is a continuous
    state space and hence there are an infinite number of states.


    We will note deal with continuous state spaces or state spaces of infinite size
    in this book.


    \---


    The idea of being able to learn from multiple “episodes” is kind of like the movie
    Groundhog Day.


    In this movie the main character wakes up and lives through the same day, everyday.


    So it allows him to get better and better at making the most out of that day.


    That’s like what happens to an agent in reinforcement learning. Even though you
    may lose a lot of episodes at first, you learn from them.


    Each episode is a fresh start. So eventually you get to a point where you are
    an expert because you’ve explored all the potential ways that an episode can proceed.


    \---


    Let’s summarize everything we know about the components of a reinforcement learning
    system so far.


    We reviewed the agent, environment, states, actions and rewards. We learned about
    episodes and how an AI will learn across many episodes, and that the terminal
    state represents the end of an episode.


    In the next couple of sections we’ll look at some subtleties concerning reward
    assignment and how to do the actual “learning”.


    ## Notes on Assigning Rewards


    In this section we are going to take a deeper look at the concept of rewards.


    One difficult part of reinforcement learning is how to define rewards. You can
    think of us, the programmers, as sort of coaches to the AI.


    Maybe a pet owner is a good analogy too. So if you have a pet you can relate the
    material you learn in this course to real life.


    The reward is something we give to the agent. We can define how we’re going to
    reward the agent, which in turn will drive how it learns.


    For example, if we give it the same reward no matter what it does, then the agent
    will probably end up acting very randomly, since any action will lead to the same
    value.


    That’s like giving your pet a treat even when it behaves badly. You don’t want
    to do that because it’s going to encourage bad behavior.


    \---


    One good example of how to define rewards is a maze. Imagine you’re a robot and
    you’ve never seen this maze before. So you kind of just randomly move along, trying
    to find your way out.


    The goal, which is to exit the maze, gives you a reward of 1. Otherwise, you get
    nothing.


    Now to most people that seems reasonable, and it is reasonable.


    \---


    However with this reward structure, the robot may never actually solve the maze.
    Remember that the robot only knows about what it’s experienced.


    So if it’s only ever seen a reward of 0, then it will think, “that’s the best
    I can do”.


    A better solution would be to give the robot a reward of -1 for every step it
    takes, and it that way it will be encouraged to solve the maze as quickly as possible.


    \---


    One point of caution is to not build in your own prior knowledge into the AI.


    For example, in the game of chess, the agent should be only rewarded for winning,
    not for doing things like taking your opponent’s pieces or implementing some strategy
    that you read about in a chess book.


    You want to leave the agent free to come up with its own solution.


    The danger of rewarding the agent for achieving subgoals is that they might find
    a novel way to maximize the reward for the subgoals without actually winning the
    game.


    For example, taking all but one of the opponent’s chess pieces and then losing.


    To summarize that, we can say that the reward signal is your way of communicating
    to the agent what you want it to achieve, not how you want to be achieved.


    ## The Value Function and Your First Reinforcement Learning Algorithm


    ## Credit Assignment'
