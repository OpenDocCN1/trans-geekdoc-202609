    ## TD(0) Semi-Gradient Prediction Theory


    Since we were able to apply approximation methods to Monte Carlo, it is reasonable
    to ask if we can apply approximation methods to TD learning as well.


    The answer is that we can, but there is one caveat.


    \---


    Let’s begin by looking at the algorithm.


    Recall that the main difference between Monte Carlo and Temporal Difference Learning
    is that with Temporal Difference Learning we don’t use the actual return, we instead
    estimate the return based on the reward and the value function for the next state.


    theta = theta + alpha\*\[r+gamma\*V\_hat(s’) - V\_hat(s)\] d(V\_hat(s))/d(theta)


    theta = theta + alpha\*\[target - prediction\] d(prediction)/d(theta)


    There is one small problem with this algorithm.


    It’s that the target we’re using here is not a real target, because it depends
    on a prediction that the model makes, in particular, V\_hat(s’).


    So in a sense we’re using the model output as a target to fix the model parameters,
    which seems strange.


    At the same time, this works, so we do it anyway.


    We call this a “semi-gradient” method, because since the target we’re using is
    not a true target, the gradient is not a true gradient.


    \---


    Let’s now go to the code.


    If you don’t want to try to code this yourself, although I highly recommend you
    do, the relevant file is approx\_semigradient\_td0\_prediction.py


    Remember that there are two main differences between this and Monte Carlo.


    The first, as you’ve seen, is that we don’t use the returns in the update for
    theta.


    Because of this, when we play the game, we also don’t need to bother calculating
    the returns, since we’ll be using the rewards directly.


    \---


    `import numpy as np`


    `import matplotlib.pyplot as plt`


    `from grid_world import standard_grid, negative_grid`


    `from iterative_policy_evaluation import print_values, print_policy`


    `from td0_prediction import play_game, SMALL_ENOUGH, GAMMA, ALPHA, ALL_POSSIBLE_ACTIONS`


    At the top, we have our usual imports. We also import some useful stuff from our
    previous td0 prediction script, like play\_game.


    In this script, we’re going to define the model as a class, with an API like sci-kit
    learn’s.


    `class Model:`


    `def __init__(self):`


    `self.theta = np.random.randn(4) / 2`


    `def s2x(self, s):`


    `return np.array([s[0] - 1, s[1] - 1.5, s[0]*s[1] - 3, 1])`


    ` `


    `def predict(self, s):`


    `x = self.s2x(s)`


    `return self.theta.dot(x)`


    ` `


    `def grad(self, s):`


    `return self.s2x(s)`


    So we have the init function, which we use to initialize theta.


    We have the s2x function, which transforms the state into a feature vector. Notice
    that we’re using the same feature transformation as we did for Monte Carlo. Note
    that these may not be good features.


    We have the predict function, which takes in a state s, transforms it into x,
    and returns the dot product between theta and x.


    Finally we have the gradient function, which just returns x.


    \---


    Next, we have the main section.


    `if __name__ == ''__main__'':`


    `# use the standard grid again (0 for every step) so that we can compare`


    `# to iterative policy evaluation`


    `grid = standard_grid()`


    ` `


    `# print rewards`


    `print "rewards:"`


    `print_values(grid.rewards, grid)`


    ` `


    `# state -> action`


    `policy = {`


    `(2, 0): ''U'',`


    `(1, 0): ''U'',`


    `(0, 0): ''R'',`


    `(0, 1): ''R'',`


    `(0, 2): ''R'',`


    `(1, 2): ''R'',`


    `(2, 1): ''R'',`


    `(2, 2): ''R'',`


    `(2, 3): ''U'',`


    `}`


    We’re using the standard grid, and the same policy we were using earlier, where
    we take a direct path to the goal, but if we’re not on that path, then we go directly
    to the losing state.


    Next, we create a model and enter the main loop.


    `model = Model()`


    `deltas = []`


    ` `


    `# repeat until convergence`


    `k = 1.0`


    `for it in xrange(20000):`


    `if it % 10 == 0:`


    `k += 0.01`


    `alpha = ALPHA/k`


    `biggest_change = 0`


    ` `


    `# generate an episode using pi`


    `states_and_rewards = play_game(grid, policy)`


    ` `


    `for t in xrange(len(states_and_rewards) - 1):`


    `s, _ = states_and_rewards[t]`


    `s2, r = states_and_rewards[t+1]`


    `# we will update V(s) AS we experience the episode`


    `old_theta = model.theta.copy()`


    `if grid.is_terminal(s2):`


    `target = r`


    `else:`


    `target = r + GAMMA*model.predict(s2)`


    `model.theta += alpha*(target - model.predict(s))*model.grad(s)`


    `biggest_change = max(biggest_change, np.abs(old_theta - model.theta).sum())`


    `deltas.append(biggest_change)`


    ` `


    `plt.plot(deltas)`


    `plt.show()`


    We have some code to calculate the decaying learning rate.


    We play the game to get a sequence of states and rewards.


    Next, we loop through the states and rewards.


    Since we know the value at the terminal state is 0, we don’t bother to make a
    prediction for the target if s2 is terminal.


    Next, we implement our update equation for theta.


    \---


    When the loop is done, we create a dictionary of values from the model, so that
    we can print them out with the print\_values function.


    `# obtain predicted values`


    `V = {}`


    `states = grid.all_states()`


    `for s in states:`


    `if s in grid.actions:`


    `V[s] = model.predict(s)`


    `else:`


    `# terminal state or state we can''t otherwise get to`


    `V[s] = 0`


    ` `


    `print "values:"`


    `print_values(V, grid)`


    `print "policy:"`


    `print_policy(policy, grid)`


    Lastly, we print the policy.


    Run this and see what you get.


    ## Semi-Gradient SARSA


    In this section, we are going to move on the control problem.


    In particular, we’re going to implement SARSA, but instead of using Q, we are
    going to create a parameterized model to approximate Q.


    Note that this is going to be more difficult than approximating V, since instead
    of approximating |S| values, we have to approximate |S|x|A| values.


    \---


    At the same time, the basic idea is the same.


    Recall that our target is r + gamma\*Q(s’,a’), and our prediction is Q(s,a).


    Since Q is an approximation, and it appears in both the target and prediction,
    this is also not a true gradient, so this is also a semi-gradient method.


    theta = theta + alpha\*\[r+Q(s’,a’)-Q(s,a)\]d\[Q(s,a)\]/d\[theta\]


    \---


    Since Q is indexed by both s and a, we need a way to combine them both into a
    feature vector.


    Once simple method would be to take what we had before for V\_hat, and just one-hot
    encode the actions.


    So in effect, we’d have:


    (row, col, row\*col, U, D, L, R, 1)


    However, if you did do this, and I would recommend doing so, so that you can go
    through the same thought process as I did, you would find that this is not expressive
    enough.


    In other words, a linear model given these features, can’t accurately approximate
    Q.


    \---


    What I eventually decided to go with, was to add square terms, and have a separate
    set of features for each action.


    `X = [`


    `r && U,`


    `c *&& U,`


    `r*r && U,`


    `c*c *&& U,`


    `r*c && U,`


    `1 && U,`


    `r && D,`


    `…`


    `]`


    So for each of the actions, we have row, column, row^2, col^2, row\*col, and 1,
    which represents not really a bias, but the one-hot encoded action.


    There is however, still a lone bias term.


    You might wonder, given so many features, if that still compresses Q.


    So let’s calculate this.


    For each of the 4 directions, we have 6 different features involving different
    combinations of row and column. So that’s 24 + 1 bias term so the total is 25.


    If you were to store Q as a table, you’d have 9 states, and 4 actions per state,
    so in total that’s 36. So there’s still a bit of savings.


