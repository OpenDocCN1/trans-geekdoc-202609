- raw: 'Imagine this scenario.


    You are thinking about studying for tomorrow’s exam. But you would rather hang
    out with your friends.


    Your friends will make you feel happy, and so to you that’s a reward. You get
    a dopamine hit.


    If you study tonight, you’re going to feel tired and bored, and maybe your dopamine
    will decrease, so that’s sort of like a negative reward.


    So why do we study for exams?


    Because we don’t just think about immediate rewards, we design a plan of action
    based on future rewards too.


    If you study, you’ll do well on your exam, you’ll get good grades, and you’ll
    get a good job that pays well.


    So we want to assign some value for being in the state: you staying at home studying
    for your exam.


    We call this the value function, and that’s what we’re going to talk about in
    this section.


    \---


    Now let’s think of this in the reverse direction.


    You receive a reward, let’s say that is, getting hired for your dream job.


    Now if you look back at the various things you did in your career and at school,
    what would you attribute your success to?


    What state of being in your past led you to get your dream job today?


    The credit assignment problem is the problem of answering the question:


    What did you do in the past that led you to get the reward you are receiving now?
    In other words, “what action gets the credit?”


    \---


    The credit assignment problem shows up in online advertising too, but in a bit
    of a different form. In online advertising it’s called “attribution”.


    The idea is, if a user eventually converts, and buys your product, but 10 different
    ad networks showed your ad, who takes the credit for the conversion?


    There are various schemes for distributing the credit, like assigning the credit
    linearly.


    But you can see that for us it’s a much deeper problem. Maybe it was the act of
    showing the user the ad 10 times that made them want to buy your product.


    So in that sense, all the ads deserve to get the same credit.


    Perhaps the user didn’t see the ad the first 9 times, perhaps something else on
    the page was more interesting to look at. Maybe they only saw the 10th ad. So
    in that case only the 10th ad deserves the credit.


    So in reinforcement learning we’re interested in the entire state sequence and
    how that particular sequence led to the final reward.


    ## Delayed Rewards


    Closely related to the idea of the credit assignment problem is the idea of “delayed
    rewards”.


    Keep in mind these are all just kind of different ways of saying the same thing,
    and the solution is also the same.


    Delayed rewards are just looking at the problem from the other direction.


    With credit assignment we’re looking into the past and asking, “what action caused
    the reward we’re getting now?”


    With delayed rewards we’re asking, how is the action I’m doing now related to
    the potential reward I may receive in the future?


    The idea of delayed rewards tells us that an AI needs to have the ability of foresight
    or planning. “Planning” is actually a field of study that crosses over with reinforcement
    learning.


    \---


    Imagine this scenario. You are in state A, which is the 2nd last state in the
    game. There are only 2 possible next states, B or C, both of them are terminal
    states.


    `oA`


    `0.5 / \ 0.5`


    `/ \`


    `oB oC`


    `R=1 R=0`


    B gives you a reward of 1, and C gives you a reward of 0. You have a 50% probability
    of going to either state, perhaps because your agent doesn’t yet know which one
    is best.


    We can think of the value of state B as 1 and the value of state C as 0.


    What is the value of state A?


    We can think of it as 0.5, since it’s the expected value of your final reward
    given that you have a 50% chance of ending up in either terminal state.


    \---


    Let’s say you’re in state A, and state A can only lead to state B, and there’s
    no other possible next state.


    If B gives you a reward of 1, then perhaps A’s value should also be 1, since the
    only possible place to end up is with a final reward of 1, once you reach A.


    `oA`


    `1 / \ 0`


    `/ \`


    `oB oC`


    `R=1 R=0`


    Thus, this value tell us about the “future goodness” of a state.


    \---


    To make this a little more formal, we actually call this value the value function
    .


    It’s a measure of the future rewards we might get.


    I think the term value function is a pretty horrible name since the term “value”
    is very ambiguous, but it’s part of the reinforcement learning nomenclature.


    \---


    It’s easy to get rewards and values intermixed.


    The difference is, the value of a state is a measure of the possible future rewards
    we may get from being in this state.


    Rewards are immediate. i.e. Jumping on a Goomba will immediately increase your
    score.


    Standing in front of a Goomba will not increase your score, hence will not yield
    any reward.


    However, being in this state has value because we can soon jump on the Goomba
    and get the reward in the future .


    \---


    So standing near the Goomba prepared to jump might have a higher value than standing
    on the other edge of the screen from a Goomba.


    We therefore choose actions based on the value of the next state, rather than
    the reward we would get by going to that state.


    The reward is the main goal, but we can’t use the reward to tell us how good a
    state is, since it doesn’t tell us anything about future rewards.


    \---


    One way to think about the value function is that it’s a fast or efficient way
    of determining “how good” it is to be in a state, without needing to search the
    rest of the game tree.


    You could try to enumerate every possible state transition in a game, and determine
    all the state transition probabilities, but you can imagine that would be a time
    consuming task.


    In fact, most games would be computationally infeasible. Tic-tac-toe is easy since
    it’s only a 3x3 board, so the number of states is approximately 3^9 = 19683. But
    that grows exponentially with the size of the board. For example, if you have
    a 4x4 board, like in connect 4, then you get 3^16 = 43 million. As you probably
    already know exponential growth is never good. Searching the state space is only
    possible in the simplest of cases. Hence a value function that can tell you how
    good you’ll do in the future given only your current state is extremely helpful.


    At this point, I haven’t told you how we can actually find the value function,
    so we don’t even know if it’s possible yet, but what we’re saying here is if we
    did have it, then that’s the information it would tell us, and it would tell us
    that information instantly, without needing to create an entire model of the game
    tree and transition probabilities.


    In fact, this is a constant time lookup because a state directly maps to a value.
    You would presumably store the values in an array which has constant time lookup.


    This problem, by the way, is yet another instance of the curse of dimensionality,
    which we’ve seen in my other machine learning courses as well.


    \---


    Estimating the value function is a central task in reinforcement learning. But
    note that not all RL strategies require it. For instance, a genetic algorithm
    simply spawns offspring that have random genetic mutations, and the ones who survive
    the longest will go on to spawn offspring in the next generation. So by pure evolution
    or natural selection we can breed AIs that get iteratively better at a game.


    This is however, not the type of algorithm we’re interested in for reinforcement
    learning most of the time.


    \---


    Let’s get to the math.


    The value function, as we talked about, takes in one argument, the state. So we
    denote it as V(s).


    It’s the expected value of all future rewards, given that the current state is
    s. Or in other words, the average value of all possible future rewards, given
    that the current state is s.


    V(s) = E\[ all future rewards | s \]


    Pretty simple.


    We’ll define the concept of value more rigorously in a later section.


    \---


    Now let’s look at a generic algorithm we can use to find the value function.'
