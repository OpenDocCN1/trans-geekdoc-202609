- raw: 'In this section of the book, we’re going to introduce some unrealistic constraints
    so that the problem can actually be solved, but you’ll see in the later sections
    that we won’t need to do this.


    The algorithm we’ll use is an iterative one, meaning we’ll run a loop and each
    time we go through the loop we’ll get closer and closer to the true value function.


    The first thing we do is initialize the value function. For all the states where
    the agent wins, we say the value is 1. For all the states where the agent loses
    or it’s a draw, we say the value is 0. For all other states we say the value is
    0.5.


    `# init`


    `V(s) = 1 if s = winning state`


    `V(s) = 0 if s = losing state or draw`


    `V(s) = 0.5 otherwise`


    For the algorithms we look at in the future we won’t need to do such careful initialization.


    One way you can interpret the value function, for only this game, but not in general,
    is it’s the probability of winning.


    The value is always going to be between 0 and 1, so it makes sense.


    \---


    The update equation looks simple but there are some hidden details.


    `V(s) = V(s) + alpha*(V(s’)-V(s))`


    ` `


    `# s = current state, s’ = next state`


    The first detail is that “s” here means all states that we encountered in an episode.


    So that means for each iteration of the loop, we actually need to play the game
    and remember all the states we were in.


    We then loop through each of the states in the state history and update the value
    using this equation.


    Notice how the value of a terminal state will never get updated, because this
    equation updates a state’s value based on the next state value, which doesn’t
    exist if we’re in a terminal state.


    \[i.e. if s = terminal, then s’ doesn’t exist\]


    \---


    In pseudocode it might look like this:


    `for t in range(max_iterations):`


    `state_history = play_game()`


    `s = state_history[0]`


    `for s’ in state_history[1:]:`


    `V(s) = V(s) + learning_rate*(V(s’) - V(s))`


    \---


    The next detail we have to talk about is how to actually play the game.


    Are we just going to take random actions?


    In this case, we don’t have to, since we have the value function.


    The value function tells us how good a state is based on how good the future states
    will be, so all we need to do is perform the action that leads to the best next
    state.


    In pseudocode it might look like this:


    `maxV = 0`


    `maxA = None`


    `for a, s’ in possible_next_states:`


    `if V(s’) > maxV:`


    `maxV = V(s’)`


    `maxA = a`


    `perform action maxA`


    \---


    Now what’s the problem with this strategy?


    The problem is the value function isn’t accurate! If we already had an accurate
    value function, we wouldn’t need to do any of this work in the first place.


    You might recognize this problem as a problem we already talked about. It’s the
    explore-exploit dilemma .


    In particular, by taking random actions, we can learn about new states that we
    would have otherwise never gone to.


    By doing so, we can improve our estimate of the value function for those states.


    But in order to win , we need to do the action that yields the maximum value.


    So we’ll be using the epsilon-greedy strategy to make a trade-off between exploration
    and exploitation.


    \---


    Let’s look at some intuition for why this iterative update works.


    First, you’ll recognize this update equation from before. It should remind you
    both of the low-pass filter and the iterative average finding equation we saw
    earlier.


    It should also look like gradient descent if you’ve encountered that in the past.
    V(s’) is like the target value, and we want to move V(s) toward that value.


    However, with reinforcement learning there are multiple possible next states,
    so there are multiple s’.


    So by doing this update equation multiple times we’re pulling V(s) in multiple
    different directions for each different s’.


    The idea is that, by playing infinitely many episodes, the proportion of time
    we spend in s’ will approach the true next-state probabilities.


    As the number of games approaches infinity, we achieve the exact expected value:


    p(s1)\*V(s1) + p(s2)V(s2) + ...


    \---


    One extremely important detail that’s also extremely difficult to discern given
    only the update formula, is the order in which you have to update the values for
    any given state.


    We know that for any particular episode, we’re only going to be updating the values
    for the states that were in that episode.


    But the key with this equation is, we’re moving V(s) closer to V(s’).


    That means we’re doing this update under the assumption that V(s’) is more accurate
    than V(s).


    For the terminal state, this is true, since that’s always going to be 0 or 1 and
    will never change.


    But if both V(s) and V(s’) are of the same accuracy, as in, they are both not
    accurate at all, then making one closer to the other won’t make anything better.


    So the idea is we want to move backwards through the state history. Because the
    current state value is always updated using the next state value, then we want
    the next state value to be more accurate, so we should update the values in reverse
    order.


    This is also consistent with the terminal state being precisely accurate with
    a value of 0 or 1 that never changes.


    Therefore, we should modify our pseudocode as follows:


    `for t in range(max_iterations):`


    `state_history = play_game()`


    `T = len(state_history)`


    `s’ = state_history[T-1]`


    `for t = T - 2 ... 0:`


    `s = state_history[t]`


    `V(s) = V(s) + learning_rate*(V(s’) - V(s))`


    `s’ = s`


    \---


    Let’s summarize what we’ve just talked about.


    First, we looked at the credit assignment problem and the concept of delayed rewards.


    This is the idea that, an action you take now, doesn’t necessarily lead to a reward
    right now. In fact it might lead you to a reward many steps ahead.


    A great example of this is studying. Studying right now will probably just make
    you feel tired and miss out on hanging out with your friends, so in fact it might
    even be a slightly negative reward.


    But the future reward is that you do well on your test, get good grades, and get
    a high paying job.


    We looked at the value function as a solution to this problem, because it tells
    you how valuable being in a state is, which makes considerations for future rewards
    as well. This entire course in fact is devoted to showing you algorithms for how
    to determine a value of a state.


    We looked at the problem from a computational perspective - the fact that a tree
    of all the possible game states and transitions will grow exponentially means
    searching it to find the value of a state is infeasible.


    We therefore use an iterative algorithm, which essentially brings the value of
    a current state closer to the value of a possible next state. Since there are
    multiple possible next states, the algorithm is stochastic, but in the long run
    it should approach the mean or expected value.


    Throughout this course, we’ll see variations on this same idea over and over again.


    One small warning: The value function we’re learning about in this lecture is
    not like the “formal” version we’ll learn about later and use throughout the rest
    of this course. Everything in the Tic-Tac-Toe section is informal just to get
    you used to the whole process of solving a RL problem.


    Since this is so abstract, I think the most useful thing we can do is start looking
    at some code to see how we can implement this. Or in other words, how look at
    how a computer implements this algorithm and carries out this strategy.


    # Tic Tac Toe in Code


    In this chapter we are going to start looking at the code for tic-tac-toe.


    Typically in machine learning we’re implementing self-contained algorithms, so
    it’s simple to look at the code line by line.


    However, with reinforcement learning, there are multiple objects interacting,
    so we’ll want to take an object-oriented approach.


    Because of that, we’ll first do an overview in this lecture of all the objects
    we need to represent and how they interact.


    After that we’ll look at the details of each object.'
