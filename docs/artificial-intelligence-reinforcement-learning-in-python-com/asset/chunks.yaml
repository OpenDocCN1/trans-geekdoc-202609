    \ `V`. We can just update it \"in-place\". Notice how this does both policy evaluation\
    \ and policy improvement all in one step. This is because policy improvement occurs\
    \ by taking the `ARGMAX` of the expression on the right. So by just taking the\
    \ `max`, we’re doing the policy evaluation step on the policy we would have chosen\
    \ if we had taken the `argmax`.\n\nLet’s write all that out in pseudocode so you\
    \ have another chance to look at it. Step 1 is to initialize `V` arbitrarily.\
    \ this can be random numbers or all 0s it doesn’t really matter so much. Then\
    \ we enter an infinite loop. Just like policy evaluation, we keep track of the\
    \ biggest change and break out of the loop when the biggest change falls under\
    \ some threshold indicating convergence. The only difference between this and\
    \ policy evaluation is that we’re taking the max over all actions for the Bellman\
    \ equation on the right. After we’ve converged, we can output the policy `pi(s)`\
    \ by taking the `argmax` over every `V(s)`.\n\n```\ninitialize V(s) = 0 for all\
    \ s in S\nwhile True:\n    delta = 0\n    for each s in S:\n        old_v = V(s)\n\
