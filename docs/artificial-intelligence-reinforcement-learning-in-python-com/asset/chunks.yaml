    So you can see that most of the values for the uniform random policy are negative.
    That’s because if you’re moving randomly, there’s a good change you can end up
    in the losing state.


    Remember that there are two ways you can enter the losing state, but only one
    way you can enter the goal state.


    The most negative value is for the state right underneath the losing state, which
    makes sense.


    Now for the fixed policy and discount factor 0.9, we see what we expect to see.
    The further away we get from the terminal state, the more the value decreases,
    and each time it decreases by exactly 10%. So 0.81 is 0.9\*0.9, 0.73 is 0.81\*0.9,
    and so on.


    ## Policy Improvement


    In this lecture, we are going to start discussing the control problem , or in
    other words, how to find better policies and eventually get to the optimal policy.


    What we know so far is how to find the value function given a fixed policy.


    Let’s look at our recursive definition of Q again.


    Q(s,a) = sum\[s’,r\]{ p(s’,r | s,a)(r+V(s’)) }


    This tells us the value of doing action a while in state s, using the policy pi.


    \---


    Using the current policy, we simply get the current state-value function.


    V(s) = Q(s, pi(s)) = sum\[s’,r\]{ p(s’,r | s, pi(s))(r+V(s’)) }


    But let’s say we want to change just one of the actions in the policy. Can we
    do this?


    Of course we can!


    \---


    We have a finite set of actions, so all we need to do is pick one that gives us
    a bigger Q than pi(s) does.


    find a in A s.t. Q(s,a) > Q(s,pi(s))


    This is where doing all the programming exercises becomes really useful. This
    looks like a really abstract equation, but all it’s saying is, if the policy is
    current to go “Up”, let’s look at if “Left”, “Right”, or “Down” give us a bigger
    Q.


    And if it does, let’s change our policy for that state to this new action.


    \---


    Formally speaking, what we’re doing when we choose a new action for this state,
    is finding a new policy pi’, that has a bigger value for this state than pi.


    pi <= pi’ <--> V(s | pi) <= V’(s | pi’)


    pi’(s) = argmax\[a\]{ Q(s,a) }


    pi’(s) = argmax\[a\]{ sum\[s’,r\]{ p(s’,r | s,a)(r+V(s’)) }}


    And all we need to do this, is to pick an action that gives us maximum Q.


    Notice how we can write this in the form where we’re using Q, or in the form where
    we’re doing a lookahead search on V.


    \---


    There are 2 things about policy improvement you should notice.


    First, notice that it’s greedy. We’re never considering globally the value function
    at all states. We’re only looking at the current state, and picking the best action
    based on the value function at that state.


    Second, notice that it uses an imperfect version of the value function.


    Once we change pi, V(s) is different.


    You’ll see in later sections, why this is not a problem.


    One question you might have is - how do we know when we are finished improving
    the policy? When we’ve found the optimal policy, the policy won’t change with
    respect to the value function.


    In addition, the value function will no longer improve, it’ll stay constant.


    Notice how the inequality we had earlier was “less than or equal to”. So in the
    case where it’s strictly less than, then we are improving the policy. In the case
    where it’s equal to, then there’s no more improvement to be made, and we’ve found
    the optimal policy.


    ## Policy Iteration


    In this section we are going to discuss the algorithm we’ll use to find the optimal
    policy.


    It’ll solve the problem we encountered in the previous lecture. Specifically,
    when we change the policy, the value also changes and becomes out of date.


    In this section we’ll see how we can rectify that problem.


    \---


    What do we do when we change the policy and the value function becomes out of
    date?


    Well we can simply re-calculate the value function.


    Luckily, we already know how to do this, because we wrote code to do it, and the
    algorithm we used is called “iterative policy evaluation”.


    At a high-level, the algorithm is very simple.


    We just alternate between policy evaluation, and policy improvement.


    We keep doing this until the policy doesn’t change anymore.


    Note that what we are not checking for is the value function converging, although
    it will anyway because once the policy stops changing, we only need to do one
    more iteration of policy evaluation.


    \---


    In pseudocode, policy iteration looks like this.


    Step 1 is to randomly initialize V(s) and the policy pi(s).


    `V(s) = random, pi(s) = random`


    Step 2 is to do iterative policy evaluation to find the current V(s).


    `V(s) = iterative_policy_evaluation(pi) # we wrote this already in the last section`


    Step 3 is to do policy improvement, which we’ll write out more elaborately here
    since you haven’t seen this before.


    ` `


    `policy_changed = False`


    `for s in all_states:`


    `old_a = policy(s)`


    `policy(s) = argmax[a]{ sum[s’,r]{ p(s’,r | s,a)[r + gamma*V(s’) } }`


    `if policy(s) != old_a: policy_changed = True`


    `if policy_changed: go back to step 2`


    We initialize a flag that tells us if the policy has changed to False. Then we
    loop through all the states.


    We keep a copy of the old policy for state s. Then we choose a new action based
    on the argmax of the lookahead value.


    If the policy changes at any time during the loop, we go back to step 2, otherwise,
    we’re done.


    ## Policy Iteration in Code


    In this section we are going to implement policy iteration in code.


    If you don’t want to try to code this yourself, although I highly recommend you
    do, the relevant file in the course repo is policy\_iteration.py


    We start out with our usual imports. From grid\_world we import both standard
    grid and negative grid.


    `import numpy as np`


    `from grid_world import standard_grid, negative_grid`


    `from iterative_policy_evaluation import print_values, print_policy`


    We are going to use the negative grid, but you’re encouraged to try the standard
    grid to see if the agent will still find a good policy.


    Next we define some constants. We again have our threshold for finding V(s) called
    SMALL\_ENOUGH, we have GAMMA which is our discount factor, and we have ALL\_POSSIBLE\_ACTIONS
    which are the 4 directions on the grid.


    `SMALL_ENOUGH = 10e-4`


    `GAMMA = 0.9`


    `ALL_POSSIBLE_ACTIONS = (''U'', ''D'', ''L'', ''R'')`


    Next I’ve written a little comment so that you remember that this world is deterministic,
    when you try to go up, you go up. So the transition probability is always 1 or
    0.


    `# this is deterministic`


    `# all p(s'',r|s,a) = 1 or 0`


    Next we go to the main section.


    First we get the negative\_grid, with the default step cost of -0.1.


