- raw: 'Recall our mean-update equation from earlier.


    Xmean(t)=(1-1/t)Xmean(t-1) + (1/t)X(t)


    Let’s call Xmean Q for convenience. We can rearrange the terms so that we have
    the 1/t term all by itself.


    Q(t)=Q(t-1) - (1/t)(Q(t-1) - X(t)), Q(t) = Xmean(t)


    We can generalize this even further so that the 1/t term is representing by a
    learning rate alpha, so it kind of looks like gradient descent.


    Q(t) = Q(t-1) - alpha\*(Q(t-1) - X(t))


    The key with this equation is, we don’t have to use alpha = 1/t as the learning
    rate.


    If you recall from deep learning part 2, a 1/t learning rate was one of the adaptive
    learning rate techniques we studied.


    But learning rates can be anything.


    What if we set alpha to a constant?


    This should look familiar too.


    Q(t) = (1 - alpha)\*Q(t-1) + alpha\*X(t)


    This is something we looked at when we looked at the Theano scan function as a
    simple example of how to use Theano scan.


    My YouTube tutorial on the Theano scan function is free to view if you haven’t
    seen it yet: [https://youtu.be/R-7OGU3V4IY](https://youtu.be/R-7OGU3V4IY)


    Recall that this implements a simple low-pass filter.


    If we get rid of the recurrence, we can find Q in terms of all past values of
    X.


    Q(t) == alpha \* sum\[k=0..t\]{ (1 - alpha)^k X(t - k) }


    And from this we can see that Q has an exponentially decaying dependence on X.


    In this way, Q puts more emphasis on recent values of X rather than past values
    of X, so it’s like a moving average, or in other words, low pass filter.


    If you want to run the low pass filter from the Theano scan tutorial, the relevant
    folder is hmm\_class (same repo as this book) and the relevant file is scan3.py


    You can see here that we start out with a very noisy sine wave, and after we pass
    it through the low-pass filter, most of the high-frequency noise goes away.


    \---


    There is a popular result you usually see in reinforcement learning literature
    that talks about the convergence of Q.


    The result is that Q will converge if the sum of all alphas is infinity, but the
    sum of all the squares of the alphas is constant.


    sum\[t=1..inf\]{ alpha(t) } = inf


    sum\[t=1..inf\]{ alpha(t)^2 } < inf


    If you think back to calculus 2, it should be clear from these criteria that constant
    alpha does not meet these 2 conditions, but alpha = 1/t does.


    The reason you often see a constant alpha used, is because reinforcement learning
    problems are often non-stationary, so it doesn’t make sense to try and calculate
    a sample mean over every collected sample ever.


    \---


    Let’s do some simple problems to solidify this concept. We already know that 1/t
    converges. What about alpha(t) = 1/t^2?


    Answer: this doesn’t converge because the sum over all alphas is not infinity.


    What about alpha = 1/t^(2/3)?


    Answer: In this case, there will be convergence, because the sum over all alphas
    is infinity, but if we square alpha, the power in the denominator becomes bigger
    than 1, so that converges to a constant.


    #  


    # Tic-Tac-Toe


    In this section of the course we are going to approach the tic-tac-toe from a
    programmatic perspective.


    First, we’ll look at what you would do if you were a first-year computer science
    student.


    First-years are typically just learning the basics of a language like Java or
    C++, and probably coding a game like tic-tac-toe is a challenge in and of itself.


    In this course we’ll be directly coding all our environments. And that means coding
    a tic-tac-toe game as well.


    It helps to understand the overall picture if you understand in detail every part
    of the system.


    In our case, that includes both the agent and the environment and any code that
    interfaces between the 2.


    In the next course / book, once you’re more familiar with the ideas of reinforcement
    learning, we’ll abstract away the environment, so that you won’t be able to poke
    inside and look at the internals of the game you’re playing. In a way that’s kind
    of like playing the game in God-mode.


    So in this lecture we are sort of looking at how you’d play tic-tac-toe in God-mode.
    You know everything about the game, you know how to play so that you never lose.


    \---


    It’s possible to enumerate all these rules, but we won’t since that’s not what
    this course is about. But I want you to at least consider what they might be.


    For example, if the board is empty and it’s your turn, you want your first move
    to be either at the center or a corner.


    Another rule might be, if your opponent has 2 pieces in a row, you want to put
    your piece down to block theirs so that they don’t get 3 in a row.


    Another rule is that if you see 2 of your own pieces in a row and it’s not blocked
    and it’s your turn, you should complete the row so that you get 3 pieces in a
    row so that you can win the game.


    \---


    So what does this look like in code?


    Essentially it would be a bunch of if statements.


    What’s the problem with a bunch of if statements?


    Well it goes against the whole idea of machine learning.


    That is, we want one algorithm that can generalize to many problems. Just like
    how we can use a neural network for classifying pictures of animals but we can
    also train the same algorithm to classify music.


    If we write a tic-tac-toe agent made up of if statements, that program will never
    be able to do anything other than just play tic-tac-toe.


    So we need something better, which is why we want to do reinforcement learning.


    \---


    One important aspect of this is that we have a model for how the game works. We
    know everything about tic-tac-toe.


    We know what state leads to the highest reward. Or in other words, any state where
    you have 3 pieces in a row, you get a reward, which is winning the game, otherwise
    you lose or get nothing.


    We know how to transition from one state to the next. In other words, by doing
    some action, we know exactly what the next state is given the current state. It
    seems trivial, but in some environments it’s not so trivial. In tic-tac-toe, we
    place a piece on the board, and the piece goes to the place that we chose, and
    we arrive in the expected next state. This isn’t always the case.


    \---


    These ideas will come into play later, but I would recommend you start to think
    about them now.


    You’ll see that some of the algorithms we learn require us to have a model of
    the environment, like we do for tic-tac-toe.


    Other algorithms won’t require us to know anything, we’ll just explore the world
    and take in the information as we go along.


    ## Components of a Reinforcement Learning System


    In this section we are going to define the components of a reinforcement learning
    system.


    It might seem a little redundant at first because we already did this in the intro
    section, but you’ll notice that as we progress further and further into the book,
    we’re going to look at the same concepts each time, but make them more rigorous.


    We’ll also add more components each time, so each time you’ll learn a few more
    terms, building on what you knew before.


    \---


    So in this section we are going to again look at some concepts you already know
    a little bit about:


    There’s the agent , that’s the thing playing the game and the thing you want to
    program a reinforcement learning algorithm into.


    There’s the environment , that’s the thing the agent interacts with. It’s the
    agent’s world.


    There’s the state , which is the specific configuration of the environment that
    the agent is sensing.


    \---


    Note that the state only involves what the agent can sense, not everything about
    the environment.


    For example if I have a vacuum robot cleaning my house in Australia then what’s
    happening in someone else’s house in India won’t affect my vacuum robot’s state.


    \---


    Another example is if you have a self-driving car that has a 360 degree view of
    everything around it. If there’s a truck in front of you, and there’s a car in
    front of that truck, then that car is not part of your state, because you can’t
    see it.


    So your state would be the same, whether that car is in front of the truck that’s
    in front of you, or not.


    \---'
