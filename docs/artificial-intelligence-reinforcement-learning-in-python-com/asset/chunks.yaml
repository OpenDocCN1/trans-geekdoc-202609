- raw: 'In this section, which will focus on Monte Carlo methods, we will be playing
    the game as it was meant to be played, and we’ll be learning purely from experience.


    \---


    “Monte Carlo” is sort of a poorly defined term. Usually it refers to any algorithm
    that involves a significant random component.


    With Monte Carlo methods in RL, the random component is the return.


    Recall that what we are always looking for is the expected return given you’re
    in a state “s”.


    With Monte Carlo methods, instead of calculating the true expected value, which
    requires probability distributions, we instead take the sample mean.


    E.g.


    `E(X) ~= sum[i=1..N]{ X(i) } / N`


    In order for this to work, we need to assume we’re doing episodic tasks only.


    The reason is because an episode has to terminate before we can calculate any
    of the returns.


    This also means Monte Carlo methods are not “fully” online algorithms (like the
    multi-armed bandit). We don’t do an update after every action, but rather after
    every episode.


    \---


    The methods we use in the Monte Carlo section should be somewhat reminiscent of
    the multi-armed bandit problem.


    With the multi-armed bandit problem, we were always averaging the reward after
    every action.


    With MDPs, we’re always averaging the return.


    One way to think of Monte Carlo, is that every state is a separate multi-armed
    bandit problem, and what we’re trying to do is learn to behave optimally for all
    of the multi-armed bandit problems at once.


    \---


    In this chapter, we are again going to follow the same pattern we did in the Dynamic
    Programming section.


    We’ll start by looking at the prediction problem, or in other words, how to do
    policy evaluation.


    Then we’ll look at the control problem, or in other words, how to find the optimal
    policy.


    ## Monte Carlo Prediction for the State-Value Function


    In this section we are going to solve the prediction problem using Monte Carlo
    estimation.


    Remember that the definition of the value function is it’s the expected value
    of the future return given that the current state is “s”.


    V(s) = E\[G(t) | S(t)=s\]


    We know that we can estimate any expected value simply by adding up samples and
    dividing by the total number of samples.


    V(s) = (1/N) sum\[i=1..N\]{ G(i, s) }


    In this equation, i is indexing the episode, and s is indexing the state.


    The question is, how do we get these sampled returns?


    \---


    The answer is that we just need to play a bunch of episodes and generate them.


    For every episode you play, you’ll have a sequence of states and rewards.


    `s1 s2 s3 … sT`


    `r1 r2 r3 … rT`


    g(t) = r(t+1) + gamma\*g(t+1)


    And from the rewards we can calculate the returns by definition, which is just
    the sum of all future rewards.


    Notice how, to actually implement this in code, it would be very useful to loop
    through the states and rewards in reverse order, since G depends only on future
    values.


    Once we’ve done this for many episodes, we’ll have multiple lists of s’s and G’s,
    and we can take the sample mean.


    \---


    One interesting question that comes up is - what if you see the same state more
    than once in an episode?


    For instance, if you see state s at time = 1 and time = 3, what is the return
    for state s?


    There are 2 answers to this question, and surprisingly they both lead to the same
    answer.


    The first method is called “first-visit” Monte Carlo. That means, you would only
    count the return for time t = 1.


    The second method is called “every-visit” Monte Carlo. That means, you would calculate
    the return for every time you visited the state s, and all of them would contribute
    to the sample mean.


    It has been proven that both of these converge to the true value.


    \---


    Let’s now look at some pseudocode for Monte Carlo prediction - in particular,
    the “first-visit” version.


    `def first_visit_monte_carlo_prediction(𝜋, N):`


    `V = random initialization`


    `all_returns = {} # default = []`


    `do N times:`


    `states, returns = play_episode`


    `for s, g in zip(states, returns):`


    `if not seen s in this episode yet:`


    `all_returns[s].append(g)`


    `V(s) = sample_mean(all_returns[s])`


    `return V`


    The input into this function is a policy and the number of samples we want to
    generate.


    We initialize V randomly, and we create a dictionary to store our returns, with
    the default value being an empty list.


    We loop N times. Inside the loop, we generate an episode by playing the game.


    Next, we loop through the state sequence and return sequence.


    We only include the return if this is the first time we’ve seen this state in
    this episode, since this is “first-visit” Monte Carlo.


    If so, we add the return to our list of returns for this state.


    Next, we update V(s) to be the sample mean of all the returns we’ve collected
    for this state.


    At the end, we return V.


    \---


    One thing you may have noticed in the pseudocode is that it requires us to store
    all the returns we get for each state, so that the sample mean can be calculated.


    But if you recall from the section on the multi-armed bandit, there are more efficient
    ways to calculate the mean, such as calculating it from the previous mean.


    There are also techniques for nonstationary problems, like using a moving average.


    So all the techniques you learned before still apply here.


    \---


    Another thing you should notice about the Monte Carlo method is that because we’re
    calculating the sample mean, all the same rules of probability apply.


    That means, the confidence interval is approximately Gaussian, and the variance
    is the original variance of the data / number of samples collected.


    Therefore, we are going to be more confident in data that has more samples, but
    it grows slowly with respect to the number of samples.


    \---


    For completion’s sake, I’m also going to show you pseudocode for calculating the
    returns.


    `s = grid.current_state()`


    `states_and_rewards = [(s, 0)]`


    `while not game_over:`


    `a = policy(s)`


    `r = grid.move(a)`


    `s = grid.current_state()`


    `states_and_rewards.append((s, r))`


    ` `


    `G = 0`


    `states_and_returns = []`


    `for s, r in reverse(states_and_rewards):`


    `states_and_returns.append((s, G))`


    `G = r + gamma*G`


    `states_and_returns.reverse()`


    The first block of code is for collecting the state and reward sequences. This
    is just playing the game, and keeping a log of all the states and rewards we get,
    in the order that we get them. Notice that this is a list of tuples.


    Also notice that the first reward is assumed to be 0 - we don’t get any reward
    for simply arriving at the start state.


    The second block of code is for calculating the returns.


    We start out with an empty list, and then we loop through the states and rewards
    in reverse order.


    Note that in the first iteration of this loop, the state s represents a terminal
    state, and G will be 0. This makes sense since the value of any terminal state
    should be 0.


    Next, we update G. Notice how, on the first iteration of the loop, this includes
    the reward for the terminal state.


    Once the loop is done, we reverse the list of states and returns, since we want
    it to be in the order that we visited the states.


    \---


    One final thing to note about Monte Carlo.


    Recall that one of the disadvantages of Dynamic Programming is that we have to
    loop through the entire set of states on every iteration, and that this is bad
    for most practical scenarios in which there are a large number of states.


    Notice how Monte Carlo only updates the value for states that we actually visit.


    That means, even if the state space is large, if we only ever visit a small subset
    of states, then it doesn’t matter.


    Also notice that with Monte Carlo, we don’t even need to know what the states
    are. We can simply discover them by playing the game.


    So there are some advantages to Monte Carlo in situations where doing full, exact
    calculations is infeasible.


    ## MC in Code (V)


    In this lecture, we are going to implement Monte Carlo for finding the state-value
    function in code.'
