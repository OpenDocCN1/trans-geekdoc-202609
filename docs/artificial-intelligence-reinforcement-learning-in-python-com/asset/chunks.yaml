    \n# 多臂老虎机\n\n## 问题设置与探索-利用的困境\n\n在书的这一部分，我们将重新审视多臂老虎机问题，你最初在我关于贝叶斯机器学习和 A/B 测试的课程中见过它。如果你没有上过那门课程，不用太担心，因为我们将在书中完全涵盖这个问题。\n\
    \n假设你去了一家赌场，你有 3 台老虎机可供选择。每台老虎机都可以给你 0 或 1 的奖励，所以目前这就像是抛硬币一样。这被称为多臂老虎机问题，因为当你玩老虎机时，必须拉动机器的手臂（arm），而它们被称为“强匪”（bandits），是因为它们在掠夺你的钱。\n\
    \n每台老虎机的获胜率都是未知的。例如，它们可能是 0.1、0.3 和 0.5。但你并不知道这些，你只能通过收集数据来发现它们。现在你在赌场的目标显然是使收益最大化。如果你是预言者，能利用你的能力判断哪台机器的获胜率最高，你只会玩那一台机器，这样你就能实现收益最大化。\n\
    \n但由于你不知道获胜率，你需要通过收集数据来估计它们，这意味着你必须玩每台机器。困境就在这里产生。你需要收集大量数据使你的估计准确。但如果你收集了大量数据，你将花费大量时间在次优的老虎机手臂上。因此，你需要在尝试收益最大化与尝试获取每台老虎机获胜率的准确测量之间取得平衡，因为为了收益最大化，你需要准确地知道这一点。\n\
    \n在 A/B 测试中，你需要玩的次数取决于许多因素，例如获胜率的差异。如果差异越大，你需要的样本越少；如果差异越小，你需要的样本越多。这有点愚蠢，因为在开始之前并不知道差异，这是\
    \ A/B 测试的缺点之一。A/B 测试的一个重要规则是你不要提前停止测试。所以如果你预先决定每台老虎机要玩 1000 次，当你玩到 500 次时已经计算出\
    \ 90% 的获胜率，你是不允许停止的。\n\n有趣的是，人类的行为恰恰相反。假设你在一台机器上赢了 2/3 次，在另一台上赢了 0/3 次。你可能会产生一种冲动，从现在起只那那\
    \ 2/3 的机器，尽管有很大概率另一台更好。如果我用统计学的方法问你——如果你认为 2/3 和 0/3 就能给你准确的测量结果，你会说“不可能！”作为一个数据科学家，你知道第一台机器实际获胜率为\
    \ 67% 的概率较低，第二台实际获胜率为 0% 的概率较低。你知道这一点是因为 3 是一个非常小的样本量。然而，当你玩老虎机时，你却强迫自己相信第一台机器更好。\n\
    \n在接下来的章节中，我们将学习系统地权衡探索与利用的算法。这些算法允许我们改进上述两种糟糕的解决方案，即人类情感和传统的 A/B 测试。\n\n## 贪婪策略\n\
    \n解决探索-利用困境的第一种解决方案被称为 贪婪策略。这是最重要的，因为这是我们在整个课程中使用的（尽管任何其他技术都可以等效应用）。我们喜欢它是因为简单。它的工作原理是：我们使用一个名为\
    \ `epsilon` 的小数值作为探索的概率。`epsilon` 的典型值为 10% 或 5%。以下是执行此操作的伪代码。\n\n```python\n\
    if random() < eps:\n    play random arm\nelse:\n    choose current best arm\n\
    \    update estimate for the arm played (i.e. avg = sum / N)\n```\n"
