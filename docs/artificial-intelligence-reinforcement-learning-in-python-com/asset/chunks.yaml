    \n循环结束后，我们可以最后绘制一次棋盘，这样你就能谁赢了。\n\n之后，我们可以进行值函数更新，因为回合现在结束了。\n\n---\n\n在脚本的主部分，我们将看到如何使用\
    \ `play_game` 函数，因为我们需要运行很多回合，以便智能体能够在很大程度上学会玩游戏。\n\n```python\nif __name__ ==\
    \ '__main__':\n    # 训练智能体\n    p1 = Agent()\n    p2 = Agent()\n\n    # 为 p1 和\
    \ p2 设置初始 V\n    env = Environment()\n    state_winner_triples = get_state_hash_and_winner(env)\n\
    \n    Vx = initialV_x(env, state_winner_triples)\n    p1.setV(Vx)\n    Vo = initialV_o(env,\
    \ state_winner_triples)\n    p2.setV(Vo)\n\n    # 给每个玩家分配符号\n    p1.set_symbol(env.x)\n\
    \    p2.set_symbol(env.o)\n\n    T = 10000\n    for t in xrange(T):\n        if\
