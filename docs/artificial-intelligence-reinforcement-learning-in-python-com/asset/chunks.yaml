- raw: 'And as you know, the way that we encode categories into feature vectors is
    one-hot-encoding.


    \---


    Let’s discuss what would happen if we were to one-hot encode each state.


    We have |S| states, so the dimensionality of X, which we’ll call D, is the cardinality
    of |S|.


    D=|S|


    So we have a big long feature vector X, of size |S|.


    And then for each of the states, we set one of the values in X to 1.


    s = (0,0) → x = \[1, 0, 0, …\]


    s = (0,1) → x = \[0, 1, 0, …\]


    \---


    The problem with this, is that it doesn’t allow us to compress the amount of space
    it takes to store the value function, which is the entire reason we want to do
    this in the first place.


    Recall that if we store V as a dictionary, it’ll have |S| keys and |S| values.


    So we haven’t made any improvement if we do one-hot encoding.


    In fact, it is equivalent to what we were doing before, since each theta in this
    case would represent the value for the corresponding state.


    V(s=0) = theta.dot(\[1,0,0,...\]) = theta\[0\] = 0th component of theta


    \---


    There is however, one positive aspect to using one-hot encoding for your feature
    transformation.


    Let’s suppose your algorithm isn’t working, and V\_hat isn’t representing the
    true V very well.


    One reason your V\_hat might not be good is because your features might be bad.


    So your code might be perfectly fine and free of bugs, but still not yielding
    good results because the features are bad.


    So in that case, you could change your feature transformer to use one-hot encoding,
    where you predict each V(s) individually.


    If you do this, and your code works, that tells you that your features are bad.


    \---


    So if one-hot encoding is bad, then what’s good?


    In the case of Gridworld, consider that each (i, j) position actually represents
    a position in 2-dimensional space.


    Therefore, it’s more like a real number than a category.


    So you can represent the X vector as simply (i, j) itself. You might want to scale
    it so its mean is 0 and its variance is 1.


    (x1,x2) = (i,j)


    We would consider this feature vector to simply be the raw data - without any
    feature engineering.


    \---


    What’s the problem with setting x to just be the location of the agent?


    Remember that our model is linear.


    Let’s say j is fixed.


    That means, V can only change linearly with respect to i.


    That means, V can only be a line with respect to this x-coordinate.


    So it’s either always increasing or always decreasing.


    This is not very expressive.


    \---


    Recall from my linear regression class, that one easy way to make new features
    is by creating polynomials.


    You may have learned in your calculus studies, that an infinite Taylor expansion
    can approximate any function.


    So if we start with x1 and x2, we can create the terms x1^2, x2^2, and x1\*x2.


    You can also create higher order polynomials if you want, but you have to be careful
    of overfitting.


    This is the method we’ll use in this course, but if you know of other ways to
    manually create features, you are welcome to use those as well.


    ## MC Prediction Theory


    Now that we’ve set the groundwork for incorporating supervised linear models into
    our MDPs, we can start applying them to the prediction problem and the control
    problem.


    We are of course going to start with the prediction problem.


    In this lecture in particular, we are going to use Monte Carlo estimation, but
    replace the value function dictionary with our linear model of the value function.


    \---


    Recall that for Monte Carlo estimation, we have 2 main steps which we do repeatedly.


    The first step is to play the game, and calculate a list of states and returns.


    The second step is to update V(s) using the return as the target and V(s) as the
    prediction. Remember that this is gradient descent but it’s also equivalent to
    calculating the mean of all the returns for this state.


    V(s) = V(s) + alpha\*(G - V(s))


    \---


    Since in this lecture we are approximating V(s) with the parameter theta, what
    we want to update instead is theta.


    So now we do continue to do stochastic gradient descent, but with respect to theta
    instead of V.


    theta = theta + alpha\*(G - V\_hat(s))x


    \---


    Remember that this is for a fixed policy, since we’re doing the prediction problem.


    Let’s look at some pseudocode to solidify this idea.


    We start by taking in an input policy pi, and randomly initializing the theta
    vector.


    Next, we enter a loop for some number of iterations.


    On each iteration, we play the game, which returns a sequence of states and returns.


    We loop through these states and returns, and apply our update equation to theta,
    treating the return as the target.


    `def mc_approx_prediction(𝜋):`


    `𝜃 = random`


    `for i=1..N`


    `states_and_returns = play_game`


    `for s, g in states_and_returns:`


    `x = 𝜙(s)`


    `𝜃 ← 𝜃 + 𝛼(g - 𝜃Tx)x`


    ## MC Prediction Code


    In this lecture we are going to implement Monte Carlo prediction with a parameterized
    value function, in code.


    If you don’t want to try to code this yourself, although I highly recommend you
    do, the relevant file in the course repo is approx\_mc\_prediction.py


    At the top we have our usual imports.


    `import numpy as np`


    `import matplotlib.pyplot as plt`


    `from grid_world import standard_grid, negative_grid`


    `from iterative_policy_evaluation import print_values, print_policy`


    ` `


    `# NOTE: this is only policy evaluation, not optimization`


    ` `


    `# we''ll try to obtain the same result as our other MC script`


    `from monte_carlo_random import random_action, play_game, SMALL_ENOUGH, GAMMA,
    ALL_POSSIBLE_ACTIONS`


    ` `


    `LEARNING_RATE = 0.001`


    We are also importing some things from our previous Monte Carlo script that are
    useful.


    We are also defining a learning rate which we’ll be using for gradient descent.


    Next we have the main section.


    We’ll be using the standard\_grid for this demo.


    `if __name__ == ''__main__'':`


    `grid = standard_grid()`


    ` `


    `print "rewards:"`


    `print_values(grid.rewards, grid)`


    ` `


    `# state -> action`


    `# policy:`


    `# ---------------------------`


    `# R | R | R | |`


    `# ---------------------------`


    `# U | | U | |`


    `# ---------------------------`


    `# U | L | U | L |`


    `policy = {`


    `(2, 0): ''U'',`


    `(1, 0): ''U'',`


    `(0, 0): ''R'',`


    `(0, 1): ''R'',`


    `(0, 2): ''R'',`


    `(1, 2): ''U'',`


    `(2, 1): ''L'',`


    `(2, 2): ''U'',`


    `(2, 3): ''L'',`


    `}`


    Next, we print the rewards and set the policy.


    \---


    Next, we randomly initialize the theta vector and define a function that turns
    the state into a feature vector x.


    `# initialize theta`


    `# our model is V_hat = theta.dot(x)`


    `# where x = [row, col, row*col, 1] - 1 for bias term`


    `theta = np.random.randn(4) / 2`


    `def s2x(s):`


    `return np.array([s[0] - 1, s[1] - 1.5, s[0]*s[1] - 3, 1])`


    Notice that the only nonlinear feature here is the interaction effect between
    the i-coordinate and the j-coordinate.


    We also have a 1 which represents the bias term.


    \---


    Next, we have our main loop.


    `# repeat until convergence`


    `deltas = []`


    `t = 1.0`


    `for it in xrange(20000):`


    `if it % 100 == 0:`


    `t += 0.01`


    `alpha = LEARNING_RATE/t`


    `# generate an episode using pi`


    `biggest_change = 0`


    `states_and_returns = play_game(grid, policy)`


    `seen_states = set()`


    `for s, G in states_and_returns:`


    `# check if we have already seen s`


    `# called "first-visit" MC policy evaluation`


    `if s not in seen_states:`


    `old_theta = theta.copy()`


    `x = s2x(s)`


    `V_hat = theta.dot(x)`


    `# grad(V_hat) wrt theta = x`


    `theta += alpha*(G - V_hat)*x`


    `biggest_change = max(biggest_change, np.abs(old_theta - theta).sum())`


    `seen_states.add(s)`


    `deltas.append(biggest_change)`


    ` `


    `plt.plot(deltas)`


    `plt.show()`


    Notice how we’re using a decaying learning rate, so alpha is the original learning
    rate / t.


    The pattern here is the same as with regular Monte Carlo, we play the game and
    get a sequence of states and returns.


    We then loop through the states and returns, but instead of updating V we now
    update the parameter theta, using the equation you saw earlier for stochastic
    gradient descent.'
