- raw: "The type of differentiable model we looked at in this course was linear regression,\
    \ but we can just as easily apply it to neural networks and deep learning.\n\n\
    Using linear regression meant we had to engineer our own features, since the raw\
    \ features we had - the i coordinate and the j coordinate, did not yield an expressive-enough\
    \ model.\n\n\\---\n\nWe applied approximation methods to 3 algorithms we learned\
    \ about earlier in the course.\n\nFirst, we used approximation with Monte Carlo\
    \ prediction.\n\nNext, we used approximation with a natural extension of Monte\
    \ Carlo prediction, TD(0) prediction.\n\nWe learned that, because TD(0) requires\
    \ us to use the model to form the target, the gradient we used for gradient descent\
    \ is not a true gradient, so we call it a semi-gradient method.\n\nFinally, we\
    \ used approximation for control - in particular, we applied it to the SARSA algorithm.\
    \ Since SARSA is also a temporal difference method, we again were not using the\
    \ true gradient, but a semi-gradient.\n\n\\---\n\nYou may have wondered why we\
    \ didn’t apply approximation methods to Q-Learning.\n\nRecall that Q-Learning\
    \ is an off-policy method.\n\nSome sources have stated that using approximation\
    \ methods for off-policy control methods do not have good convergence characteristics.\n\
    \nHowever, if you want to try to modify the existing SARSA approximation script\
    \ to use Q-Learning instead, you are encouraged to do so.\n\nRemember that the\
    \ main difference between SARSA and Q-Learning is that the Q we use for the update\
    \ does not necessarily correspond to the next action we take.\n\nSo basically\
    \ the line of code where you choose your action goes somewhere else.\n\n\\---\n\
    \nTo put all this into context, let’s now go through an overview of everything\
    \ we accomplished in this course.\n\nWe started out this course looking at the\
    \ multi-armed bandit problem, which you first saw in my Bayesian Machine Learning,\
    \ A/B testing course.\n\nYou learned about the explore-exploit dilemma, which\
    \ is central to reinforcement learning.\n\nWe saw 4 different ways to solve the\
    \ multi-armed bandit problem, including epsilon-greedy, optimistic initial values,\
    \ UCB1, and Thompson sampling.\n\nNext, you learned about some more of the basic\
    \ definitions in reinforcement learning, and you applied them to create a tic-tac-toe\
    \ agent.\n\nBy coding a tic-tac-toe agent, we were able to get a feel for how\
    \ reinforcement learning works, and the types of algorithms we use for learning.\n\
    \n\\---\n\nIn the next chapter, we formalized all the concepts we learned about\
    \ reinforcement learning into a framework of Markov Decision Processes, or MDPs.\n\
    \nYou learned about policies, state-value functions, and action-value functions.\n\
    \nYou learned about the concept of returns, which is the sum of discounted future\
    \ rewards.\n\n\\---\n\nIn the next chapters, we looked at 3 different ways of\
    \ solving MDPs.\n\nIn particular, we were interested in solving 2 problems: the\
    \ prediction problem, which is finding the value function given a policy, and\
    \ the control problem, which is finding the optimal policy.\n\nIn the first section\
    \ on Dynamic Programming, we directly applied Bellman’s Equation to solve both\
    \ of these problems.\n\nYou learned about the idea of policy iteration, and the\
    \ more efficient way of doing it, called value iteration.\n\nWe learned that Dynamic\
    \ Programming isn’t really practical because it doesn’t learn from experience\
    \ and assumes we know all the relevant probability distributions.\n\nSo in the\
    \ next section, we looked at Monte Carlo methods, which learn only from experience.\n\
    \nWith Monte Carlo, instead of calculating expected values precisely using probability\
    \ distributions, we instead estimate them using sample means.\n\nThe problem with\
    \ Monte Carlo is that it’s not fully online, which is a problem if you have very\
    \ long episodes or continuing tasks.\n\nThe final method we looked at was temporal\
    \ difference learning, which combines aspects of both Dynamic Programming and\
    \ Monte Carlo.\n\nTD learning uses bootstrapping, which means it makes estimates\
    \ based on other estimates, and this allows it to be fully online, since we don’t\
    \ need to wait for an episode to be over before making updates.\n\nAt the same\
    \ time, TD learning also learns from experience, which means we don’t need a probabilistic\
    \ model of the MDP.\n\n\\---\n\nIn the final section of the course, we learned\
    \ how all 3 of the previous methods can be infeasible for large state spaces,\
    \ so we looked at ways of compressing the value function.\n\nThe only requirement\
    \ for our function approximators is that they be differentiable.\n\nAs you know,\
    \ deep learning methods are also differentiable.\n\nLibraries like Theano and\
    \ TensorFlow automatically calculate gradients for us, which would make the update\
    \ equations easier in the case where we have lots of parameters and complex functions.\n\
    \nWe’ll be looking at deep reinforcement learning in the followup to this course.\n\
    \n\\---\n\nThere are also some other things we didn’t consider in this course,\
    \ that would be worth studying now that you know the basics.\n\nWe know that state-spaces\
    \ are not necessarily discrete. For example, if our state space is an image of\
    \ our environment, images represent the real world - light intensity in a continuous\
    \ 3-dimensional space. Light intensity is also continuous.\n\nWe know that action-spaces\
    \ are not necessarily discrete either. For example, if your agent needs to decide\
    \ how much force to apply to a motor. Force is a continuous variable.\n\n\\---\n\
    \nAnother point to consider is that we’ve so far only parameterized the value\
    \ function.\n\nIn a future course, we’ll also look at how we can parameterize\
    \ the policy, pi(a | s).\n\nWe call this the “policy gradient” method.\n\n\\---\n\
    \nAnother point to consider is that when we learned from experience in this course,\
    \ we learned from our current experience only, and we did stochastic gradient\
    \ descent based on our most recent action.\n\nWhat happens though, as you play\
    \ the episodes, you accumulate (input, target) pairs.\n\nIn essence, what you’re\
    \ doing is accumulating training data.\n\nPractically speaking, you could even\
    \ store these input-target pairs in a file and use them to train later.\n\nSo\
    \ even though we are doing online learning, there’s no reason we can’t also use\
    \ our previous experience as well.\n\nIn other words, I can replay a previous\
    \ episode, and continue to update the parameters of my model with gradient descent\
    \ based on those old episodes.\n\n\\---\n\nSo there are still lots of things to\
    \ learn in the field of reinforcement learning.\n\nAs you’ve seen, even at the\
    \ fundamental level we still have a lot of open questions, and things that we\
    \ assume to be true that haven’t even been proven.\n\nAt the same time, this was\
    \ a massive book, with tons of different algorithms, so I hope you can now appreciate\
    \ how far-reaching the field of reinforcement learning is.\n\nThanks for reading!\n\
    \n## 读累了记得休息一会哦~\n\n### **网站：**[https://elib.cc](https://elib.cc)\n\n#### 百万电子书免费下载\n\
    \n# Conclusion\n\n I really hope you had as much fun reading this book as I did\
