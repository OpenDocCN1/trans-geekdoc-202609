- raw: 'This is all from my students’ experiences, I didn’t just make this up. If
    you did advanced math in college 20 years ago, it doesn’t count. If you watched
    some lectures about probability on YouTube for 20 minutes, it doesn’t count. You
    don’t just need a short review. You need tough technical concepts etched into
    your mind.


    ## Practice by Coding from Scratch


    Machine learning isn’t like taking a physics course, there aren’t 20 practice
    problems at the end of the chapter for you to do.


    The nice thing about machine learning is that it automatically self-checks.


    Either the code you wrote runs, or it doesn’t. If it runs, that’s a good first
    step.


    Either it behaves as expected, or it doesn’t. If it does behave as expected, that
    means what you wrote is good and it’s working.


    Debugging is part of programming. You should be a good debugger and not give up
    the instant your code throws an error.


    It’s all part of the process.


    People think they should be able to do something in an hour when in reality it
    should take an intelligent person all night or maybe even days.


    So keep that in mind: everything we do automatically self-checks. Either the code
    you write works, or it doesn’t. Strive to make it work on your own.


    Remember that the code in the Github repo (to be discussed) has already been verified
    to work, so check your work against that.


    It’s even possible for your code to be better!


    You absolutely must write the code and do as much of it on your own as you can,
    ideally working off of the pseudocode from the theory / pseudocode only.


    The difference between this and my other machine learning courses is that it’s
    going to feel like we’re doing the same thing over and over again.


    This is opposed to, for example, my supervised machine learning class where you
    learned decision trees, Naive Bayes, k-nearest neighbor, and the perceptron. Those
    were 4 distinct algorithms.


    In this book all the algorithms look alike, so the real challenge is going to
    be telling them apart.


    Understanding the differences between each method and their advantages and disadvantages
    is the key to this course.


    You’ve heard me say in previous courses that “all data is the same”.


    I think it’s pretty easy to achieve this level of perspective in machine learning.


    When we talk about supervised learning and unsupervised learning, we always deal
    with the inputs X and the targets Y.


    We don’t need to specify what X is or what Y is, and you still understand what
    I’m talking about.


    You already know that X can represent any feature, that could be age, weight,
    height, number of pages visited in your ecommerce store, a DNA sequence, etc.


    Supervised and unsupervised learning works for all different fields, finance,
    biology, online advertising, and more.


    We don’t need to specify what we’re talking about - saying X and Y is good enough,
    because the same algorithms work no matter what the data represents.


    So we say “all data is the same”. The question you might have is, “does this apply
    to reinforcement learning as well?”


    I think the answer is that eventually it will, but it probably won’t at first.


    Reinforcement learning is more difficult because the interface to the learning
    agent is much more broad than just features and targets or Xs and Ys.


    However once you get used to the idea of taking an environment and thinking about
    how you can encode states, actions, and rewards, you’ll get better and better
    at abstracting these concepts.


    So in the future you won’t need to think in terms of specific problems like Tic-Tac-Toe
    or Gridworld, you’ll instead think in terms of abstract entities like states,
    actions, and rewards and that instinct will become more automatic over time.


    In Deep Learning especially, experience has shown me that a lot of people want
    to jump into Deep Learning because it’s popular at the moment, but they have no
    idea what the prerequisites are, so they “don’t know what they don’t know”.


    I have 2 goals:


    (1) you end the book “knowing what you don’t know”, and


    (2) “knowing what you need to know, in order to know the things you want to know”.


    So perhaps your goal is to build an AI that can play Super Mario. This course
    is going to fill in the gaps, not all the way to that point, but very close. If
    you think you’ll be programming an AI for Super Mario tomorrow, then you are currently
    in a state of “you don’t know what you don’t know”. But by the end of the book
    (1) and (2) will be true.


    #  


    # What is Reinforcement Learning?


    In this chapter we are going to answer the question, “what is reinforcement learning?”


    How is it different from supervised and unsupervised learning?


    What are its applications?


    We talked a little bit about these things in the introduction and in this chapter
    we are going to expand on those things.


    The first thing you’ll notice is how different reinforcement learning is from
    supervised and unsupervised learning.


    With supervised and unsupervised learning, we always imagine the same interface,
    which we’ve modeled around sci-kit learn.


    For a supervised learning interface, we usually have the functions fit(X,Y), which
    takes in the input samples X and the targets Y, and predict(X), which takes in
    input samples X and tries to accurately predict Y.


    `class SupervisedModel:`


    `def fit(X, Y): ...`


    `def predict(X): ...`


    For an unsupervised learning interface, we usually just have a fit(X) function
    which only takes in some input samples X. Remember that there are no targets in
    unsupervised learning.


    Sometimes we have a transform(X) function which takes in some input samples X
    and turns it into a different representation that we call Z. PCA, Autoencoders,
    and Restricted Boltzmann Machines are examples of algorithms we’ve seen that can
    do that.


    `class UnsupervisedModel:`


    `def fit(X): ...`


    `def transform(X): ... # sometimes`


    In contrast, methods like k-means clustering and Gaussian Mixture Models have
    a fit() function but they don’t transform data. Instead, the parameters of the
    fitted model tell us something about the data, like which cluster a data point
    belongs to, and what the variance of that cluster is.


    The common theme with both of these is that the interface to these is training
    data. You take some training data, either X & Y, or just X, and you call a fit
    function.


    In the case of supervised learning, you can then make predictions on future data.


    This by itself can be useful. Imagine you’ve written an app that can scan a photo
    you take at the supermarket, classify what you took a photo of, and then return
    nutritional information about it.


    But reinforcement learning is different. Reinforcement learning can guide an agent
    for how to act in the real world .


    So the interface to a reinforcement learning agent is much more broad than just
    data, it’s the entire environment.


    That environment can be the real world, or it can be a simulated world like a
    video game.


    As an example, you could create a reinforcement learning agent to vacuum your
    house. Then it would be interacting with the real world. You could create a reinforcement
    learning agent learn to walk. That would also be interacting with the real world.


    You can be sure that the military is interested in such technologies - they want
    reinforcement learning agents that can replace soldiers. Not only to walk, but
    fight, diffuse bombs, and make important decisions while they are out on a mission.


    So you see now why reinforcement learning is such a big leap from basic supervised
    and unsupervised learning.


    The interface isn’t just data, but it could potentially be the entire world.


    The big leap isn’t that just the interface with the AI is way more broad, but
    that reinforcement learning algorithms train in a completely different way as
    well.


    You’ll see quite a lot of references to psychology, and indeed reinforcement learning
    can be used to model behavior.'
