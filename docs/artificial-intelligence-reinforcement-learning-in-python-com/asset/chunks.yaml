  trans: "\n我们然后根据 epsilon-greedy 策略和当前的 `Q` 选择下一个动作。我们称之为 `a’`。\n\n接下来，我们对 `Q(s,a)`\
    \ 进行更新，它取决于：`Q(s,a)`、`r` 以及 `Q(s’,a’)`。\n\n接着，我们将 `s` 更新为 `s’`，并将 `a` 更新为 `a’`。\n\
    \n--- 关于 SARSA 的一个有趣事实是，从未发表过收敛性证明。\n\n然而，非正式地说明，如果策略收敛到贪婪策略，SARSA 就会收敛。\n\n实现这一目标的一种方法是让\
    \ `epsilon = 1/t`，其中 `t` 代表时间。\n\n这是我们在代码中使用的形式。\n\n注意，分子不一定是 1。你可以使用 `0.5/t`\
    \ 或 `0.8/t` 等任何你想要的数值。\n\n此外，你**不一定**得使用 `1/t` 衰减，你可以使用 `1/t²/3` 或任何你选择的幂。\n\n\
    你应该将其视为一个超参数。\n\n--- 同样记住，学习率也可以衰减。\n\n使用 `1/t` 衰减存在一个问题。\n\n考虑一下，在每个时刻，`Q` 中只有一个状态-动作对会被更新。\n\
    \n因此，对于那些从未更新过的 `Q` 值，学习率也会发生衰减！\n\n你可以尝试弥补这一点，即每个回合（episode）只衰减一次学习率，但你仍然面临相同的问题。\n\
    \n在一个回合中，只有完整状态集的一个子集会被访问。\n\n而且每个状态只会采取所有可能动作中的一个。\n\n所以，即使你每回合只衰减一次学习率，你仍然对那些从未更新过的\
    \ `Q` 部分进行了衰减。\n\n--- 为了解决这个问题，我们从深度学习中汲取了灵感——特别是 `AdaGrad` 和 `RMSprop` 算法。\n\n\
    记住，这些算法独特之处在于，当过去的梯度很大时，有效学习率下降得更多。换句话说，事物过去变化得越多，我们未来降低学习率的就越大。\n\n我们的版本将比这些技术简单，但原理是相同的。我们将记录看到状态-动作对的次数。\n\
    \n我们将 `alpha` 设置为原始的 `alpha / the count`。\n\n`alpha(s,a) = alpha0/count(s,a)`\n\
    \n或者更通用地：\n\n`alpha(s,a)=alpha0/(k+m*count(s,a))`\n\n通过这样，每个状态-动作对都有自己的 `alpha`，因此它们都将拥有各自各自独立衰减的学习率。\n\
    \n## 代码中的 SARSA\n\n在本节课程中，我们将用代码实现 SARSA。\n\n如果你不想尝试自己写代码（尽管我强烈建议你这样做），课程代码库中的相关文件是\
    \ `sarsa.py`。\n\n在顶部，我们有标准的导入。注意我们还需要来自 `monte_carlo_es` 的 `max_dict` 函数。\n\n\
    ```\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom grid_world import\
    \ standard_grid, negative_grid\nfrom iterative_policy_evaluation import print_values,\
    \ print_policy\nfrom monte_carlo_es import max_dict\nfrom td0_prediction import\
    \ random_action\n\nGAMMA = 0.9\nALPHA = 0.1\nALL_POSSIBLE_ACTIONS = ('U', 'D',\
    \ 'L', 'R')\n```\n\n我们拥有与之前相同的常量。注意这里的 `alpha` 并不是我们将用于 `Q` 的有效 `alpha`，但有效 alpha\
    \ 将从这个初始 `alpha` 派而出。\n\n注意在这个脚本中，我们没有 `play_game` 函数，因为对于 SARSA，玩游戏和执行更新是无法分离的。我们必须在玩游戏的同时进行更新。正如承诺的那样，TD\
    \ 方法是完全在线的（online）。\n\n--- 现在我们进入主部分。注意我们正在使用负网格（negative grid）。你也可以尝试标准网格来观察效果。\n\
    \n```\nif __name__ == '__main__':\n    grid = negative_grid(step_cost=-0.1)\n\
    \    print \"rewards:\"\n    print_values(grid.rewards, grid)\n```\n\n接下来，我们打印奖励并初始化\
    \ `Q`。\n\n```python\n# initialize Q(s,a)\nQ = {}\nstates = grid.all_states()\n\
    for s in states:\n    Q[s] = {}\n    for a in ALL_POSSIBLE_ACTIONS:\n        Q[s][a]\
    \ = 0\n```\n\n此之后，我们创建了两个 `update_counts` 字典。名为 `update_counts` 的字典是为了查看我们在每个状态中花费的时间比例。名为\
    \ `update_counts_sa` 的字典用于自适应学习率。\n\n```python\nupdate_counts = {}\nupdate_counts_sa\
    \ = {}\nfor s in states:\n    update_counts_sa[s] = {}\n    for a in ALL_POSSIBLE_ACTIONS:\n\
    \        update_counts_sa[s][a] = 1.0\n```\n\n接下来，我们进入主循环。我们在这里使用变量 `t` 用于 epsilon-greedy。\n\
    \n```python\n# repeat until convergence\nt = 1.0\ndeltas = []\nfor it in xrange(10000):\n\
    \    if it % 100 == 0:\n        t += 1\n    # ... logic ...\n```\n"
