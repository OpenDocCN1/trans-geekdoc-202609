    这一切都来自我学生的经验，我并不是凭空捏造。如果你在 20 年前在大学学过高等数学，那不算数。如果你在 YouTube 上看了 20 分钟关于概率的视频，那也不算数。你需要的不仅仅是一个简短的回顾。你需要将硬核的技术概念刻在脑海里。


    ## 从零开始编码实践


    机器学习不像上物理课，章节末尾没有 20 道练习题供你做。


    机器学习很棒的地方在于，它是可以自动自检的。


    要么你写的代码可以运行，要么不能运行。如果它能运行，那是一个良好的第一步。


    要么它的行为符合预期，要么不符合。如果它符合预期，意味着你写得很好，而且它正在正常工作。


    调试是编程的一部分。你应该成为一名出色的调试员，不要在代码一抛错误时就放弃。


    这都是过程的一部分。


    人们认为自己应该能够在一个小时内完成某事，但现实中，一个聪明的人可能需要一整晚，甚至可能几天时间。


    所以请记住：我们所做的每件事都会自动自检。你写的代码要么有效，要么无效。努力让它独立运行。


    记住， Github 仓库中的代码（将要讨论）已经经过验证可以运行，所以请根据它来检查你的工作。


    你的代码甚至可能变得更好！


    你必须亲手编写代码，并尽可能独立完成，理想情况下仅根据理论的伪代码/仅根据伪代码来编写。


    这和我其他的机器学习课程的区别在于，你会觉得我们在又一遍一遍做同样的事情。


    这与之相对的是，例如我的监督机器学习课程，你在那里学习了决策树、朴素贝叶斯、k-近邻和感知器。那些是 4 种不同的算法。


    在本书中，所有的算法看起来都一样，因此真正的挑战将是如何区分它们。


    理解每种方法之间的差异以及它们的优缺点是这门课程的关键。


    在之前的课程中，你听我说过“所有数据都是平等的”。


    我认为在机器学习中实现这种视角其实相当容易。


    当我们谈论监督学习和无监督学习时，我们总是处理输入 `X` 和目标 `Y`。


    我们不需要指定 `X` 是什么或 `Y` 是什么，你仍然能理解我在说什么。


    你已经知道 `X` 可以代表任何特征，可以是年龄、体重、身高、你在电子商务商店中访问的页面数、DNA 序列等。


    监督学习和无监督学习适用于所有不同领域，金融、生物学、在线广告等。


    我们不需要指定我们在谈论什么——只需说 `X` 和 `Y` 就足够了，因为无论数据代表什么，相同的算法都是通用的。


    所以我们说“所有数据都是平等的”。你可能会问是：“这同样适用于强化学习吗？”


