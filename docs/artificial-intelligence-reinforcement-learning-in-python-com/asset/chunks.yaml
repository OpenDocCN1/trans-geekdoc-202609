    ## Value Iteration


    In this section we are going to talk about an alternative technique for solving
    the control problem, called value iteration.


    Recall that the technique we previously studied was called policy iteration.


    It’s very easy to get all of these confused, because all the algorithms look and
    sound the same, so coding them will definitely help you get used to the different
    varieties of solutions we have for MDPs.


    One of the disadvantages of policy iteration is that it’s an iterative algorithm.


    Therefore, we have to wait for it to converge.


    At the same time, the main loop contains 2 steps, and the first step itself is
    also an iterative algorithm.


    So you have one iterative algorithm inside another one.


    One might ask if there’s a more efficient way to go about solving this problem.


    \---


    Recall that the policy evaluation algorithm ends when V converges.


    It’s reasonable to ask, is there a point before convergence, such that the resulting
    greedy policy doesn’t change?


    In fact, empirical studies have shown that after only a few iterations of policy
    evaluation, the resulting greedy policy is constant.


    What this tells us is that we actually don’t need to wait for policy evaluation
    to converge when we’re doing policy iteration.


    We can just do a few steps and then break, because the policy improvement step
    would find the same policy given additional iterations of policy evaluation.


    \---


    However, the algorithm we’re studying in this lecture takes this one step further.
    It’s called value iteration.


    What it does is combines the policy evaluation and the policy improvement step
    into one line.


    V [k+1]  (s)=max\[a\]{ sum\[s’, r\]{ p(s’,r | s,a)(r+V [k]  (s’)) }}


    What’s interesting about this is it looks almost exactly like the equations we’ve
    already seen. In fact if you weren’t paying attention, it would look exactly like
    the equations we’ve already seen.


    That’s why I’ve been saying it’s really important to write code to try and understand
    the differences.


    You really need to look at this carefully to see what the difference is between
    this and the other Bellman-type equations we’ve looked at.


    This equation is very similar to the policy evaluation equation, except we’re
    taking the max over all possible actions.


    \---


    It’s also iterative as you can see with the k index.


    Similar to policy evaluation, we don’t actually need to wait for the entire kth
    iteration of V to be available before we start calculating the (k+1)th iteration
    of V.


    We can just update it “in-place”.


    Notice how this does both policy evaluation and policy improvement all in one
    step.


    This is because policy improvement occurs by taking the ARGMAX of the expression
    on the right.


    So by just taking the max, we’re doing the policy evaluation step on the policy
    we would have chosen if we had taken the argmax.


    \---


    Let’s write all that out in pseudocode so you have another chance to look at it.


    Step 1 is to initialize V arbitrarily. This can be random numbers or all 0s. It
    doesn’t really matter so much.


    Then we enter an infinite loop. Just like policy evaluation, we keep track of
    the biggest change and break out of the loop when the biggest change falls under
    some threshold, indicating convergence.


    The only difference between this and policy evaluation, is that we’re taking the
    max over all actions for the Bellman equation on the right.


    After we’ve converged, we can output the policy pi(s) by taking the argmax over
    every V(s).


    `initialize V(s) = 0 for all s ∈ S`


    ` `


    `while True:`


    `𝛥 = 0`


    `for each s ∈ S:`


    `old_v = V(s)`


    `V(s)= max[a]{ sum[s’,r]{ p(s’,r | s,a)(r+V(s’)) }}`


    `𝛥 = max(𝛥, |V(s) - old_v|)`


    `if 𝛥 < threshold: break`


    ` `


    `for each s ∈ S:`


    `pi(s) = argmax[a]{ sum[s’,r]{ p(s’,r | s,a)(r+V(s’)) }}`


