    ## MC Summary


    In this lecture, we are going to summarize everything we looked at in this chapter.


    This section was all about Monte Carlo methods.


    In the last section on Dynamic Programming, we made the weird assumption that
    we knew all the state transition probabilities and never actually played the game.


    So we were never able to learn from experience, as you would expect a reinforcement
    learning agent to do.


    We followed our usual pattern of first looking at the prediction problem and then
    looking at the control problem.


    The main technique we use with Monte Carlo is that the value function is the expected
    return given a state.


    We know from probability that the expected value of something can be approximated
    by its sample mean.


    In order to use Monte Carlo, we needed to generate episodes and calculate the
    returns for each episode.


    This gave us a list of pairs of states and returns.


    We then averaged these returns to find the value for each state.


    Recall that there are 2 methods for averaging the returns, “first-visit” and “every-visit”.


    While these have both been proven to converge to the same result, we used first-visit
    because it’s simpler.


    \---


    We saw that Monte Carlo methods can be more efficient than Dynamic Programming
    because it doesn’t require us to loop through the entire state space.


    Because of this, we might never get the “full” value function, but it might not
    matter if many of those states would never be reached, or reached very rarely.


    In other words, the more we visit a state, the more accurate the value will be,
    for that state.


    Since the Monte Carlo method results in each state being visited a different number
    of times, depending on the policy, we used the exploring starts technique in order
    to make sure we had adequate data for each state.


    \---


    We then looked at the control problem.


    The difference with Monte Carlo is that we now need to use Q instead of V, so
    that we can take the argmax of Q over all the actions.


    This is required since we can’t do the kind of look-ahead search with Monte Carlo
    that we did with Dynamic Programming.


    We saw that we could continue to use the idea of policy iteration from the dynamic
    programming section.


    Recall that this is where we alternate between policy evaluation and policy improvement.


    We talked about the fact that Monte Carlo has one major disadvantage here.


    Monte Carlo needs many samples in order to be accurate, and it has to happen inside
    a loop, which makes it very inefficient.


    We took the same approach here as we did with value iteration, which was to do
    only one update for evaluation per iteration.


    What’s surprising about this is that the sample returns are for different policies,
    since the policy evolves as we do the iterations.


    What’s also surprising is that this has never been formally proven to converge.


    \---


    One of the major disadvantages of the first control solution we looked at, is
    that we needed to use exploring-starts in order to get a full measurement of Q.


    We saw that it’s not necessary to use exploring starts if we use epsilon-greedy
    instead, since epsilon-greedy allows us to continually explore all the states
    in the state space.


    We learned that ALL of the techniques we learned about, when we studied the multi-armed
    bandit, apply here.


    In fact, MDPs are like having a different multi-armed bandit problem at each state.


    # Temporal Difference Learning


    ## Intro to TD


    In this section of the course, we are going to look at a third technique for reinforcement
    learning, called temporal difference learning, or just “TD” for short.


    TD learning is one of the most important techniques in reinforcement learning,
    and you’ll see how it combines ideas from the first 2 techniques, Dynamic Programming
    and Monte Carlo.


    You’ll recall that one of the disadvantages of Dynamic Programming was that it
    required a full model of the environment, and never learned from experience.


    We saw that Monte Carlo on the other hand, does learn from experience, and you’ll
    see in this section that TD learning also learns from experience.


    With the Monte Carlo method, we saw that we could only update the value function
    after completing an episode.


    On the other hand, Dynamic Programming used bootstrapping, or in other words,
    it was able to improve its estimates based on existing estimates.


    We’ll see that TD learning also uses bootstrapping, and furthermore, it’s fully
    online. So we don’t need to wait for an episode to finish before we update our
    value estimates.


    \---


    In this chapter, we are going to take the same approach as we did in the previous
    2 sections.


    We are first going to look at the prediction problem, or in other words, finding
    the value function given a policy.


    Next, we are going to look at the control problem.


    Similar to the previous 2 sections, we are going to explore two different ways
    of approaching the control problem, SARSA, and Q-Learning, which has become popular
    as of late.


    ## TD(0) Theory


    In this section we are going to look at how to apply temporal difference learning
    to the prediction problem, or in other words, finding the value function.


    You might think this is a strange name at first. Why is there a 0 in the name
    and not some other number?


    The reason is that there are other TD learning methods, such as TD(1), and more
    generally, TD(lambda), but these are outside the scope of this book.


    They are similar but not necessary to understand Q-Learning and approximation
    methods, which is what we eventually want to get to.


    \---


    So how does TD(0) work?


    First, let’s think back to Monte Carlo.


    Recall that one disadvantage of Monte Carlo is that we need to wait for the episode
    to finish before calculating the returns, since the return depends on all future
    rewards.


    Also recall, that the Monte Carlo method is to average the returns, and that earlier
    in the course we looked at different ways of calculating averages.


    \---


    In particular, let’s look at the method that does not require us to actually store
    all the returns.


    V(S(t)) = V(S(t)) + alpha\*\[G(t)-V(S(t))\]


    Recall that alpha can be constant or it can decay with time.


    So if we used this formula, it would be an alternative way of calculating the
    average return for a state.


    \---


    Now recall the definition of V. Recall that it’s the expected value of the return
    given a state.


    But also recall that we can define it recursively.


    V(s) = E\[G(t) | S(t)=s\] = E\[R(t+1)+gamma\*V(S(t+1)) | S(t)=s\]


    \---


    So, it’s reasonable to ask, if we can just replace the return in the update equation,
    with this recursive definition of V.


    V(S(t)) = V(S(t)) + alpha\*\[R(t+1) + gamma\*V(S(t+1)) - V(S(t))\]


    V(s) = V(s) + alpha\*\[r+V(s’)-V(s)\]


    What we get from this is the TD(0) method.


    If you look at this carefully, you’ll realize why this is a fully online bootstrapping
    method.


    We’re now not calculating G, the full return.


    Instead, we’re just using another V estimate, in particular, the V for the next
    state.


    What this also tells us is that we can’t update V(s), until we know s’.


    So rather than waiting for the entire episode to finish, we just need to wait
    until we reach the next state, to update the value for the current state.


    \---


    It’s helpful to examine how these estimates work and what the sources of randomness
    are.'
