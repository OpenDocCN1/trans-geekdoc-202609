    \        # epsilon greedy\n        p = np.random.random()\n        if p < eps:\n\
    \            j = np.random.choice(3)\n        else:\n            j = np.argmax([b.mean\
    \ for b in bandits])\n        x = bandits[j].pull()\n        bandits[j].update(x)\n\
    \n        # for the plot\n        data[i] = x\n    cumulative_average = np.cumsum(data)\
    \ / (np.arange(N) + 1)\n\n    # plot moving average reward\n    plt.plot(cumulative_average)\n\
    \    plt.plot(np.ones(N)*m1)\n    plt.plot(np.ones(N)*m2)\n    plt.plot(np.ones(N)*m3)\n\
    \    plt.xscale('log')\n    plt.show()\n\n    for b in bandits:\n        print\
    \ b.mean\n\n    return cumulative_average\n\nif __name__ == '__main__':\n    c_1\
    \ = run_experiment(m1, m2, m3, eps, N)\n```\n"
  trans: "\n\n在每一轮中，我们生成一个随机数。如果随机数小于 `epsilon`，我们就进行探索（explore），意味着随机选择一个机械臂。如果随机数大于\
    \ `epsilon`，我们就进行开发（exploit），意味着选择到目前为止具有最大平均值的机械臂。\n\n因此显而易见的是，最终你将学到哪条臂是真正的最好的，尽管你的初始猜测可能是错误的，因为每个臂始终都有机会被更新。\n\
    \n---\n\n从长远来看，`epsilon-greedy` 允许我们对每条臂进行无限次探索。\n\n然而，这种方法的问题在于，最终你会达到这样一个点：即在你不再真正需要探索时仍在进行探索。\n\
    \n所以，如果 `epsilon` 是 `10%`，那么你仍将花费 `10%` 的时间来选择次优臂。\n\nA/B 测试在这里也可能有用，你可以在预定的时间进行测试以检查统计显著性。如果你发现了统计学显著性，可以将\
    \ `epsilon` 设置为 `0`，这样你实际上只执行了贪婪部分。\n\n不过，在不久的将来，我们将看到更好的方法来适应我们所学的内容。\n\n## 更新均值\n\
    \n假设我们的奖励不仅仅是硬币掷，所以我们不只需要存储成功和失败的次数。\n\n解决这个问题的通用方法是使用均值。\n\n这对于硬币掷也有效，因为如果你将所有的\
    \ `0` 和 `1` 相加并除以 `N`，你就会得到获得 `1` 的最大似然概率。\n\n那么，我们如何计算随机变量的样本均值呢？\n\n我们知道它是总和除以样本数量。\n\
    \n```\nXmean(N) = sum[i=1..N]{ X(i) } / N\n```\n\n这个方程有什么问题？\n\n这个方程的问题在于，它需要存储所有的\
    \ `N` 个元素才能计算均值。\n\n有没有办法让这种计算更高效？\n\n确实有。\n\n诀窍在于，第 `N` 次样本的均值可以根据第 `(N-1)` 次样本的均值计算出来。\n\
    \n```\nXmean(N) = (1 - 1/N)Xmean(N-1) + (1/N)X(N)\nXmean(N) = Xmean(N-1) - (1/N)[Xmean(N-1)\
    \ - X(N)]\n```\n\n如果你没有立即看出它的原理，请尝试在纸上自己推导一下。\n\n所以这个方程允许我们以计算效率更高的方式计算均值。\n\n\
    记住这种形式的更新方程，它在书的其余部分将非常重要。\n\n## 在代码中比较不同的 epsilon\n\n在这一节中，我们将用代码实现 `epsilon-greedy`，并演示不同\
    \ `epsilon` 设置的影响。\n\n如果你不想尝试自己编写代码（尽管我强烈鼓励你这样做），课程仓库中的相关文件是 `comparing_epsilons.py`。\n\
    \n```python\nimport numpy as np\nimport matplotlib.pyplot as plt\n\n# represents\
    \ one bandit arm\nclass Bandit:\n    def __init__(self, m):\n        self.m =\
    \ m # true mean\n        self.mean = 0\n        self.N = 0\n\n    # simulates\
    \ pulling the bandit’s arm\n    # is a Gaussian with unit variance\n    def pull(self):\n\
    \        return np.random.randn() + self.m\n\n    # this is the update equation\
    \ we just learned\n    def update(self, x):\n        self.N += 1\n        self.mean\
    \ = (1 - 1.0/self.N)*self.mean + 1.0/self.N*x\n\n# N = number of times we play\n\
    # m1, m2, m3 = mean rewards for the 3 arms\n# eps = epsilon for the epsilon greedy\
    \ strategy\ndef run_experiment(m1, m2, m3, eps, N):\n    bandits = [Bandit(m1),\
    \ Bandit(m2), Bandit(m3)]\n\n    data = np.empty(N)\n    for i in xrange(N):\n\
    \        # epsilon greedy\n        p = np.random.random()\n        if p < eps:\n\
    \            j = np.random.choice(3)\n        else:\n            j = np.argmax([b.mean\
    \ for b in bandits])\n        x = bandits[j].pull()\n        bandits[j].update(x)\n\
    \n        # for the plot\n        data[i] = x\n    cumulative_average = np.cumsum(data)\
    \ / (np.arange(N) + 1)\n\n    # plot moving average reward\n    plt.plot(cumulative_average)\n\
    \    plt.plot(np.ones(N)*m1)\n    plt.plot(np.ones(N)*m2)\n    plt.plot(np.ones(N)*m3)\n\
    \    plt.xscale('log')\n    plt.show()\n\n    for b in bandits:\n        print\
    \ b.mean\n\n    return cumulative_average\n\nif __name__ == '__main__':\n    c_1\
    \ = run_experiment(m1, m2, m3, eps, N)\n```\n\n"
