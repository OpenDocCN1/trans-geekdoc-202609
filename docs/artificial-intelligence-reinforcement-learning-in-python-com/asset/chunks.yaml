- raw: 'Reinforcement learning algorithms have objectives in terms of a goal . This
    is different from supervised learning, where the objective is to get good accuracy
    or to minimize a cost function.


    Reinforcement learning algorithms get feedback as the agent interacts with its
    environment. So feedback signals, or as we like to call them, “rewards”, are given
    automatically to the agent by the environment.


    This is much different from supervised learning where it can be extremely costly
    and time-consuming to obtain hand-labeled data.


    So in this way reinforcement learning is very different from supervised learning.
    Supervised learning requires a hand-labeled dataset, reinforcement learning learns
    automatically from signals in the environment, so there is no need for hand-labeled
    data.


    \---


    Let’s expand on this idea of a goal.


    Phrasing our objective in terms of goals allows us to solve a much wider variety
    of problems.


    The goal of AlphaGo is to win Go.


    The goal of a video game AI is to either get as far as possible in the game or
    achieve a high score.


    What’s interesting is when you consider animals and specifically humans.


    Evolutionary psychologists have said that our genes are “selfish” and all they
    want to do is make more of themselves.


    This is really interesting because just like AlphaGo, we’ve found many “roundabout”
    and unlikely ways to achieve this. Experts commented that AlphaGo used some surprising
    and unusual techniques.


    For example, you might have a desire to be rich and make lots of money. But have
    you ever wondered why you feel that way?


    Perhaps those with the specific set of genes that are related to the desire to
    be rich, ended up being more prominent in our gene pool due to natural selection.


    Perhaps having lots of money led to better healthcare and social status, which
    then helped your genes to maximize their central goal, which was to make more
    of themselves.


    Although a number in your bank account has no direct relationship in terms of
    physical laws to how long you are going to live, it’s a novel solution to the
    problem.


    “Desiring and successfully earning money” is just a random example off the top
    of my head, but you can replace that with any trait you want, like “being healthy
    and strong”, or “having strong analytical skills”.


    Knowing the exact factors is a social scientist’s job, we’re just interested in
    the fact that there is only one main goal that we want to maximize, and various
    novel ways of achieving it.


    And these things are always fluctuating in time. At one point in history, seeking
    as much sugar as possible would give you energy and help you survive. Today, we
    keep that trait, because evolution is slow, but in today’s world that trait actually
    kills us.


    Our genes’ method of maximizing their reward is through mutation and natural selection,
    which is slow, but an AI’s method of maximizing its reward is reinforcement learning,
    which is fast.


    \---


    Now let’s get into some technical detail.


    Of course you never sense the entire world all at once, even humans don’t do this.
    We have sensors which feed signals to our brain from the environment.


    These signals don’t even tell us everything about the room we’re in, much less
    the world.


    So we necessarily have limited information about our environment, as do robots
    with limited numbers and types of sensors.


    The measurements we get from these sensors - sight, sound, and touch - make up
    a “state”.


    In this course we’ll only look at environments where there are a small finite
    number of states, but of course it’s possible to consider environments with an
    infinite number of states too.


    \---


    Let’s do a simple example. Consider a tic-tac-toe board where we don’t care about
    who wins, we just want to put X’s and O’s on the board. The board starts out as
    empty and we continue to add either X’s or O’s until the board is full.


    Ex:


    `+---+---+---+`


    `| x | o | x |`


    `+---+---+---+`


    `| x | x | x |`


    `+---+---+---+`


    `| x | o | o |`


    `+---+---+---+`


    If you don’t know how tic-tac-toe works, you can do a google search and play the
    game yourself in the browser.


    Remember that tic-tac-toe boards are 3x3 boards. What is the total number of states
    in this environment?


    Think about this for a minute and then come back to the book.


    \---


    Since we’re not considering a tic-tac-toe game where there is a winner after you
    get 3 X’s or 3 O’s in a row, this problem is very simple.


    Each location on the board has 3 possible states: empty, X, or O.


    There are 9 locations in the board.


    So the total number of states is 3^9.


    \-----


    Let’s recap the terms we’ve talked about so far - there are 3 of them and possibly
    more that I snuck in.


    The 3 important ones are:


    Agent : This is the thing that senses the environment and the thing we’re trying
    to code intelligence and learning into.


    Environment : This is the real world or the simulated world that your agent lives
    in.


    State : These are different configurations of the environment that the agent can
    sense.


    \---


    There are a couple more things to define in reinforcement learning that are central
    to the subject.


    First, there is a concept of reward .


    This is what differentiates reinforcement learning algorithms from other kinds
    of machine learning algorithms.


    An agent will try to maximize not only its immediate reward but future rewards
    as well.


    Often, reinforcement learning algorithms will find novel ways of accomplishing
    this.


    I’m not a Go player myself, but we’ve heard that the AlphaGo program learned unique
    and unpredictable strategies that led to its beating a world champion at Go.


    These are things that aren’t intuitive to humans, but reinforcement learning algorithms
    can automatically figure them out.


    One potentially dangerous aspect of this is the idea of unintended consequences.
    We’ve all heard about the idea that an AI could potentially wipe out humanity
    if it decides that is the best thing for us.


    Imagine you program your AI to minimize the number of human deaths, and then it
    decides that, since humanity is going to grow exponentially and hence more people
    are going to die as well, that it would be better to destroy everyone now in order
    to minimize more dying in the future.


    So there is some danger of unintended and dangerous side effects for AIs that
    are interacting with the real-world.


    To give you a more low-level example of how and why rewards should be programmed
    intelligently, think of a robot trying to solve a maze.


    A reasonable goal might be to simply solve the maze. If you solve the maze, you
    get a reward of 1, otherwise you get a reward of 0.


    With this reward structure, it’s possible for a robot to just implement a random
    strategy and eventually solve the maze.


    Because we never told it that it should try to solve the maze efficiently, then
    making random movements until the maze is solved still gets you the reward.


    Now imagine that we give a reward of -1 for every step the AI takes in the maze.
    Now the AI has incentive to solve the maze using the least number of steps, and
    so it will tend to find a more efficient solution this way.


    We’ll demonstrate this in code later in the book.


    Notice how a negative reward is like a penalty, which it is. Reward is just the
    term we always use, whether it be positive or negative. It tells you how good
    or bad you’re doing.


    Note that the reward is always a real number.


    \---


    So far we’ve defined these terms: agent, environment, state, and reward.


    The last important concept we need to talk about is actions .


    Actions are what the agent does in its environment. For example, if you’re a 2-D
    video game character, your actions might be up, down, left, right, and jump.


    This is an example of a finite set of actions.


    There are also examples of an infinite set of actions but we won’t discuss that
    in this book.


    The last 3 things we talked about are often thought about as a triple: You’re
    in a state, you take an action, and you get a reward.'
