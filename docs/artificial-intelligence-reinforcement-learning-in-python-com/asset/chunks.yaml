    \ using your psychic powers which machine had the highest win rate, you would\
    \ play only that machine, and that’s how you would maximize your winnings.\n\n\
    But since you don’t know the win rates, you need to estimate them by collecting\
    \ data, and that means you have to play each of the machines. This is where the\
    \ dilemma comes in. You need to collect lots of data for your estimates to be\
    \ accurate. But if you collect lots of data then you’re going to spend lots of\
    \ time playing suboptimal bandit arms. So you need to balance between trying to\
    \ maximize your earnings and trying to obtain accurate measurements of each bandit’s\
    \ win rate, since in order to maximize your earnings you need to accurately know\
    \ that.\n\nIn A/B testing, the number of times you need to play is dependent on\
    \ a number of things, such as the difference in win rates. If the difference is\
    \ bigger, you need less samples, but if the difference is smaller, you need more\
    \ samples. This is kind of silly because you don’t know the difference before\
    \ you start, so that’s one of the disadvantages of A/B testing. An important rule\
    \ of A/B testing is that you do not stop your test early. So if you decided beforehand\
    \ that you need to play each bandit 1000 times, and by the time you get to 500\
    \ you’ve calculated 90% win rate for one bandit, and 10% win rate for another,\
    \ you’re not allowed to stop.\n\nIt’s interesting that humans behave the opposite.\
    \ Suppose you win 2/3 times on one bandit, and 0/3 times on another. You would\
    \ probably feel a strong urge to only play the 2/3 bandit from this point forward,\
    \ even though there is a high probability the other bandit could be better. If\
    \ I were to ask you in a statistical way - if you think 2/3 and 0/3 give you accurate\
    \ measurements, you would say “no way”! As a data scientist you know that there’s\
    \ a low probability the first bandit has an actual win rate of 67% and a low probability\
    \ the second bandit has an actual win rate of 0%. You know this because 3 is a\
    \ very tiny sample size. And yet if you are playing slot machines you feel compelled\
    \ to believe that the first bandit is better.\n\nIn the coming sections, we’ll\
    \ learn about algorithms that will systematically make a trade-off between exploration\
    \ and exploitation. These will allow us to improve upon these 2 poor solutions\
    \ to the problem, which are human emotion and traditional A/B testing.\n\n## Epsilon-Greedy\
    \ Strategy\n\nThe first solution to the explore-exploit dilemma is called the\
    \ epsilon-greedy strategy. This is the most important because it’s the one we’ll\
    \ be using throughout the course (although any of the other techniques can be\
    \ equivalently applied). We like it because it’s simple. The way it works is this.\
    \ We use a small number called `epsilon` to be the probability of exploration.\
    \ Typical values for `epsilon` are 10% or 5%. Here’s some pseudocode that does\
    \ this.\n\n```python\nif random() < eps:\n    play random arm\nelse:\n    choose\
    \ current best arm\n    update estimate for the arm played (i.e. avg = sum / N)\n\
    ```\n"
  trans: "\n\n我们将这些组称为 `(S,A,R)` 或 `(state,action,reward)` 三元组。\n\n在强化学习中，时机也是一个重要的概念，因为你每次玩游戏时都会获得一系列状态、动作和奖励。\n\
    \n在这个框架内，你从一个状态 `S(t)` 开始，采取一个动作 `A(t)`，但你收到的奖励是 `R(t+1)`。\n\n因此，你获得的奖励总是来自于你上一个时刻所采取的状态和动作。\n\
