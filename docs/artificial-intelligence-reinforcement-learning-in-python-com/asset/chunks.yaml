    \ experience the episode\n        V[s] = V[s] + ALPHA*(r + GAMMA*V[s2] - V[s])\n\
    ```\n\nNote that even though we could do the update “inline” as we played the\
    \ game, I decided not to do that since it would make the code messy, having to\
    \ interleave the updates and the playing of the game.\n\nAnd so once we have our\
    \ list of states and rewards, we loop through them and do the `TD(0)` update,\
    \ which is the same equation.\n\nFinally, we print the values.\n\n```python\n\
    print \"values:\"\nprint_values(V, grid)\nprint \"policy:\"\nprint_policy(V, grid)\n\
    ```\n\n## SARSA Theory\n\nIn SARSA, we need to know `Q(s,a)` for all the actions\
    \ `a`, in a state `s`, so that you can accurately choose the argmax.\n\nBecause\
    \ the update depends on knowing the 5-tuple `(s,a,r,s’,a’)`, this method is named\
    \ SARSA.\n\n---\n\nSince SARSA requires you to know `Q(s,a)` for all the actions\
    \ `a`, in a state `s`, we have the same problem as we did with Monte Carlo.\n\n\
    Recall that the problem was, if you follow a deterministic policy, you’ll only\
    \ do `1/|A|` of the possible actions, which will leave most of `Q` undefined.\n\
    \nSo in order to remedy that problem, we either had to use exploring starts, OR\
    \ a policy that allows for exploration, like epsilon-greedy.\n\nSince we already\
    \ know exploring starts is not realistic, we are going to use epsilon-greedy.\n\
    \n---\n\nLet’s look at some pseudocode to solidify this idea.\n\n```\nQ(s,a) =\
    \ arbitrary, Q(terminal, a) = 0\nfor t=1..N\n    s = start_state, a = epsilon_greedy_from(Q(s))\n\
    \    while not game over:\n        s’, r = do_action(a)\n        a’ = epsilon_greedy_from(Q(s’)\n\
    \        Q(s,a) = Q(s,a) + alpha*[r + gamma*Q(s’,a’) - Q(s,a)]\n        s = s’,\
    \ a = a’\n```\n"
  trans: "\n在蒙特卡洛方法中，随机性来自于每个回合（episode）可能以不同的方式进行。\n\n因此，如果后续所有的状态转移具有某种随机性，那么某个状态的回报（return）将会不同。\n\
    \n在 `TD(0)` 中，我们又有了另一个随机来源。\n\n具体来说，我们甚至不知道回报是多少，因此我们使用 `r + gamma*V(s’)` 来估计回报\
    \ `G`。\n\n---\n\n在本节中，我们学习了为什么时序分差学习（temporal difference learning）与动态规划和蒙特卡洛方法相比都更具优势。\n\
    \n与动态规划不同，我们不需要环境模型。我们从经验中学习，并且只更新我们实际访问过的状态。\n\n与蒙特卡洛方法不同，我们不需要等待回合结束就可以开始学习。这在回合非常长的情况下是有优势的。我们可以在回合进行过程中改进性能，而不需要一直等到等到下一个回合。\n\
    \n它甚至可以用于连续性任务（continuing tasks），即完全没有回合的任务。\n\n## 代码中的 TD(0)\n\n在本节中，我们将用代码实现\
    \ `TD(0)`。\n\n如果你不想尝试自己编写代码（尽管我强烈建议你这么做），课程代码库中的相关文件是 `td0_prediction.py`。\n\n\
    我们从标准的导入开始。\n\n```python\nimport numpy as np\nimport matplotlib.pyplot as plt\n\
    from grid_world import standard_grid, negative_grid\nfrom iterative_policy_evaluation\
    \ import print_values, print_policy\n```\n\n```python\nSMALL_ENOUGH = 10e-4\n\
    GAMMA = 0.9\nALPHA = 0.1\nALL_POSSIBLE_ACTIONS = ('U', 'D', 'L', 'R')\n```\n\n\
    我们还有通常的那些常量，现在我们还需要一个学习率 `alpha`。\n\n接下来，是 `random_action` 函数。我没有从另一个文件导入它，因为我想把这段注释写在这里。\n\
    \n```python\ndef random_action(a, eps=0.1):\n    # 我们将使用 epsilon-soft 来确保所有状态都被访问\n\
    \    # 如果你你不这样做会发生什么？即 eps=0\n    p = np.random.random()\n    if p < (1 - eps):\n\
    \        return a\n    else:\n        return np.random.choice(ALL_POSSIBLE_ACTIONS)\n\
    ```\n\n我们在 `TD` 中面临着和蒙特卡洛方法相同的问题。那就是如果我们从不访问某个状态，我们就永远不会更新它的值。\n\n所以，如果我们有一个没有任何任何探索的确定性策略，某些状态将没有值。如果你不在乎这些值，那是没问题的，但我们想在这里添加一些探索来让它更有趣。\n\
    \n---\n\n接下来是 `play_game` 函数。\n\n注意看这比蒙特卡洛版本要简单得多，因为我们不需要计算任何回报。我们做的只是返回一个状态和奖励的列表。\n\
    \n从技术上讲，我们应该在玩游戏时进行更新，这才是在线学习，但为了清晰起见，我想将游戏过程和更新智能体的过程分开。\n\n```python\ndef play_game(grid,\
    \ policy):\n    # 返回状态列表和对应的奖励（不是 MC 中的那种回报）\n    # 从指定的起始状态开始\n    s = (2, 0)\n\
    \    grid.set_state(s)\n    states_and_rewards = [(s, 0)] # (状态, 奖励) 的元组列表\n \
    \   while not grid.game_over():\n        a = policy[s]\n        a = random_action(a)\n\
    \        r = grid.move(a)\n        s = grid.current_state()\n        states_and_rewards.append((s,\
    \ r))\n    return states_and_rewards\n```\n\n---\n\n接下来，我们进入主部分。\n\n```python\n\
    if __name__ == '__main__':\n    # 使用标准网格（每一步均为 0），以便与\n    # 迭代策略评估进行比较\n    grid\
    \ = standard_grid()\n\n    # 打印奖励\n    print \"rewards:\"\n    print_values(grid.rewards,\
    \ grid)\n\n    # 状态 -> 动作\n    policy = {\n        (2, 0): 'U',\n        (1, 0):\
    \ 'U',\n        (0, 0): 'R',\n        (0, 1): 'R',\n        (0, 2): 'R',\n   \
    \     (1, 2): 'R',\n        (2, 1): 'R',\n        (2, 2): 'R',\n        (2, 3):\
    \ 'U',\n    }\n```\n\n我在这里使用了标准网格，所以你可以将其与我们早的脚本进行比较。策略也与我们使用的第一个策略相同。\n\n注意，你不会得到相同的答案，因为之前我们没有使用\
    \ epsilon-greedy 策略。\n\n---\n\n接下来，我们将所有值都初始化为 0。\n\n```python\nV = {}\nstates\
    \ = grid.all_states()\nfor s in states:\n    V[s] = 0\n```\n\n之后，是我们的主循环。\n\n\
    ```python\n# 重复直到收敛\nfor it in xrange(1000):\n    # 使用 pi 生成一个回合\n    states_and_rewards\
    \ = play_game(grid, policy)\n    # 第一个 (s, r) 元组是我们开始的状态，且奖励为 0\n    # （因为只是开始游戏，没有获得奖励）\n\
    \    # 最后一个 (s, r) 元组是终止状态和奖励\n    # 终止状态的值定义为 0，所以我们不需要\n    # 更新它。\n    for\
    \ t in xrange(len(states_and_rewards) - 1):\n        s, _ = states_and_rewards[t]\n\
    \        s2, r = states_and_rewards[t+1]\n        # 在体验回合时更新 V(s)\n        V[s]\
    \ = V[s] + ALPHA*(r + GAMMA*V[s2] - V[s])\n```\n\n注意，尽管我们可以在玩游戏时内联更新，但我决定不这样做，因为把更新和游戏过程交织在一起会让代码很混乱。\n\
    \n因此，一旦我们有了状态和奖励列表，我们就遍历它们并执行 `TD(0)` 更新，公式是相同的。\n\n最后，我们打印值。\n\n```python\nprint\
    \ \"values:\"\nprint_values(V, grid)\nprint \"policy:\"\nprint_policy(V, grid)\n\
    ```\n\n## SARSA \n\n在 SARSA 中，我们需要知道状态 `s` 下所有动作 `a` 的 `Q(s,a)`，以便准确选择 argmax。\n\
    \n由于更新依赖于知道五元组 `(s,a,r,s’,a’`，这种方法被命名 SARSA。\n\n---\n\n由于 SARSA 需要知道状态 `s` 下所有动作\
    \ `a` 的 `Q(s,a)`，我们面临着与蒙特卡洛方法相同的问题。\n\n回想一下问题在于：如果你遵循确定性策略，只会执行 `1/|A|` 的可能动作，这会导致大部分\
    \ `Q` 未定义。\n\n所以为了解决这个问题，我们要么使用探索启动（exploring starts），要么使用允许探索的策略，比如 epsilon-greedy。\n\
    \n由于我们已经知道探索启动是不现实的，我们将使用 epsilon-greedy。\n\n---\n\n让我们看一些伪代码来巩固这个概念。\n\n```\n\
    Q(s,a) = 任意值, Q(terminal, a) = 0\nfor t=1..N\n    s = start_state, a = epsilon_greedy_from(Q(s))\n\
    \    while not game over:\n        s’, r = do_action(a)\n        a’ = epsilon_greedy_from(Q(s’)\n\
    \        Q(s,a) = Q(s,a) + alpha*[r + gamma*Q(s’,a’) - Q(s,a)]\n        s = s’,\
    \ a = a’\n```\n"
