    # Python 中的线性回归


    链接 1：[`deeplearningcourses.com/c/data-science-linear-regression-in-python?coupon=AMZN`](https://deeplearningcourses.com/c/data-science-linear-regression-in-python?coupon=AMZN)

    链接 2：[`www.udemy.com/data-science-linear-regression-in-python/?couponCode=AMZN12`](https://www.udemy.com/data-science-linear-regression-in-python/?couponCode=AMZN12)


    * 如果你对机器学习一窍不通，这是一个极好的入门课程

    * 仅需基础微积分、线性代数和 Python 编程

    * 使用线性回归证明摩尔定律的真实性

    * 使用年龄和体重预测收缩压


    ## 深度学习预备：Python 中的逻辑回归


    链接 1：[`deeplearningcourses.com/c/data-science-logistic-regression-in-python?coupon=AMZN`](https://deeplearningcourses.com/c/data-science-logistic-regression-in-python?coupon=AMZN)

    链接 2：[`www.udemy.com/data-science-logistic-regression-in-python/?couponCode=AMZN12`](https://www.udemy.com/data-science-logistic-regression-in-python/?couponCode=AMZN12)


    * 逻辑回归是神经网络的基础构建模块（即它是一个“神经元”模型）

    * 深入研究二分类

    * 如何从你的数据中提取特征

    * 比线性回归更难，因为无法通过“闭式解”找到解决方案，我们需要数值方法（称为 `gradient descent` 梯度下降）

    * 教你深度学习和神经网络所需的所有工具——事实上，你会发现神经网络使用的都是相同的工具，只是模型稍微复杂一些

    * 首次接触脸表情识别问题

    * 应用逻辑回归优化电子商务商店


    ## 数据科学：Python 中的深度学习（深度学习第 1）


    链接 1：[`deeplearningcourses.com/c/data-science-deep-learning-in-python?coupon=AMZN`](https://deeplearningcourses.com/c/data-science-deep-learning-in-python?coupon=AMZN)

    链接 2：[`www.udemy.com/data-science-deep-learning-in-python/?couponCode=AMZN12`](https://www.udemy.com/data-science-deep-learning-in-python/?couponCode=AMZN12)


    * 将“神经元”组合在一起形成“神经网络”，即“神经元网络”

    * 学习神经网络为何比线性方法（如线性和逻辑回归）更强大

    * 仅使用已知的原理推导出 `backpropagation` 反向传播算法

    * 从二分类转向多分类

    * 再次尝试脸部表情识别问题

    * 应用神经网络优化电子商务商店


    ## 数据科学：Theano 和 TensorFlow 实战深度学习（深度学习第 2）


    链接 1：[`deeplearningcourses.com/c/data-science-deep-learning-in-theano-tensorflow?coupon=AMZN`](https://deeplearningcourses.com/c/data-science-deep-learning-in-theano-tensorflow?coupon=AMZN)

    链接 2：[`www.udemy.com/data-science-deep-learning-in-theano-tensorflow/?couponCode=AMZN12`](https://www.udemy.com/data-science-deep-learning-in-theano-tensorflow/?couponCode=AMZN12)


    * 学习使用 `Theano` 和 `TensorFlow` 编写神经网络更简单、灵活的方法

    * 改进 `backpropagation` 反向传播的方法——动量、自适应学习率

    * 使用 `GPU` 在 `AWS`（亚马逊服务）加速训练

    * 正则化技术（`dropout` 等）

    * 必须学会如何使用 `Theano`/`TensorFlow` 编写卷积神经网络


    ## 深度学习：Python 中的卷积神经网络（深度学习第 3）


    链接 1：[`deeplearningcourses.com/c/deep-learning-convolutional-networks?coupon=AMZN`](https://deeplearningcourses.com/c/deep-learning-convolutional-networks?coupon=AMZN)

    链接 2：[`www.udemy.com/deep-learning-convolutional-networks/?couponCode=AMZN12`](https://www.udemy.com/deep-learning-convolutional-networks/?couponCode=AMZN12)


    * 学习卷积神经网络架构

    * 学习卷积操作以及如何应用于模糊和边缘检测

    * 使用 `Theano` 编写你自己的 CNN

    * 将卷积应用于音频


    ## Python 中的聚类分析与无监督学习


    链接 1：[`deeplearningcourses.com/c/cluster-analysis-unsupervised-learning?coupon=AMZN`](https://deeplearningcourses.com/c/cluster-analysis-unsupervised-learning?coupon=AMZN)

    链接 2：[`www.udemy.com/cluster-analysis-unsupervised-learning/?couponCode=AMZN12`](https://www.udemy.com/cluster-analysis-unsupervised-learning/?couponCode=AMZN12)


    * `K-Means` 聚类

    * 层次聚类

    * 高斯混合模型

    * 为隐性马尔可夫模型和无监督学习提供了背景知识


    ## 无监督深度学习（深度学习第 4）


    链接 1：[`deeplearningcourses.com/c/unsupervised-deep-learning?coupon=AMZN`](https://deeplearningcourses.com/c/unsupervised-deep-learning?coupon=AMZN)

    链接 2：[`www.udemy.com/unsupervised-deep-learning/?couponCode=AMZN12`](https://www.udemy.com/unsupervised-deep-learning/?couponCode=AMZN12)


    * 从零开始推导主成分分析（`PCA`）并理解其局限性

    * 使用 `PCA` 进行数据可视化

    * 建立 `PCA` 与自动编码器等无监督神经网络之间的联系

    * 学习非线性可视化技术 t-SNE（由深度学习之父 Geoffrey Hinton 联合开发）

    * 学习自动编码器和 RBMs（受限玻尔兹机）如何用于预训练神经网络并解决梯度消失问题，从而提升监督性能


    ## 数据科学：Python 中的自然语言处理


    链接 1：[`deeplearningcourses.com/c/data-science-natural-language-processing?coupon=AMZN`](https://deeplearningcourses.com/c/data-science-natural-language-processing?coupon=AMZN)

    链接 2：[`www.udemy.com/data-science-natural-language-processing/?couponCode=AMZN12`](https://www.udemy.com/data-science-natural-language-processing/?couponCode=AMZN12)


    * 学习机器学习如何应用于语言、文本和语音

    * 编写垃圾邮件检测算法

    * 进行情感分析

    * 学习如何使用 `NLTK` 库

    * 可视化潜在语义分析（`LSA`）的结果

    * 编写你自己的文章生成器


    ## 无监督机器学习：Python 中的隐性马尔可夫模型


    链接 1：[`deeplearningcourses.com/c/unsupervised-machine-learning-hidden-markov-models?coupon=AMZN`](https://deeplearningcourses.com/c/unsupervised-machine-learning-hidden-markov-models?coupon=AMZN)

    链接 2：[`www.udemy.com/unsupervised-machine-learning-hidden-markov-models/?couponCode=AMZN12`](https://www.udemy.com/unsupervised-machine-learning-hidden-markov-models/?couponCode=AMZN12)


