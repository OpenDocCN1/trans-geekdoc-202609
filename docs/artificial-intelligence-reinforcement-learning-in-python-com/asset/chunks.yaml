    \ it still has the highest chance of occurring. Therefore, when we’re close to\
    \ the losing state, it’s better for the agent to just try to lose which will end\
    \ up terminating the episode and maximizing the future reward.\n\n## Value Iteration\n\
    \nIn this section we are going to talk about an alternative technique for solving\
    \ the control problem, called value iteration. Recall that the technique we previously\
    \ studied was policy iteration. It’s very easy to get all of these confused because\
    \ all algorithms look and sound the same, so coding them will definitely help\
    \ you get used to the different varieties of solutions we have for MDPs. One of\
    \ the disadvantages of policy iteration is that it’s an iterative algorithm therefore\
    \ we have to wait for it to converge. At the same time the main loop contains\
    \ two steps and the first step itself is also an iterative algorithm so you have\
    \ one iterative algorithm inside another. One might ask if there is a more efficient\
    \ way to go about solving this.\n\nRecall that policy evaluation ends when `V`\
    \ converges. It’s reasonable to ask, is there a point before convergence such\
    \ that the greedy policy doesn’t change? In fact, empirical studies have shown\
    \ that after only a few iterations of policy evaluation, the resulting greedy\
    \ policy is constant. What this tells us is that we actually don’t need to wait\
    \ for policy evaluation to converge when we’re doing policy iteration we can just\
    \ do a few steps and then break because the policy improvement step would find\
    \ the same policy given additional iterations of policy evaluation.\n\nHowever,\
    \ the algorithm we’re studying in this lecture takes one step further. It’s called\
    \ value iteration. What it does is combine the policy evaluation and policy improvement\
    \ step into one line: `V[k+1](s) = max[a]{sum[s', r]{p(s', r | s, a)(r + V[k](s'))}}`.\
    \ What’s interesting about this is it looks almost exactly like the equations\
    \ we’ve already seen. In fact if you weren’t paying attention, it would look exactly\
