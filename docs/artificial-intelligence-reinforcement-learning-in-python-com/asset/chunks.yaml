    \ and approximation methods, which is what we eventually want to get to.\n\nSo\
    \ how does `TD(0)` work? First, let’s think back to Monte Carlo. Recall that one\
    \ disadvantage of Monte Carlo is that we need to wait for the episode to finish\
    \ before calculating the returns, since the return depends on future rewards.\
    \ Also recall, that the Monte Carlo method is to average the returns, and that\
    \ earlier in the course we looked at different ways of calculating averages.\n\
    \nIn particular, let’s look at the method that does not require us to actually\
    \ store all the returns.\n```python\nV(S(t)) = V(S(t)) + alpha*[G(t)-V(S(t))]\n\
    ```\nRecall that `alpha` can be constant or it can decay with time. So if we used\
    \ this formula, it would be an alternative way of calculating the average return\
    \ for a state.\n\nNow recall the definition of `V`. Recall that it’s the expected\
    \ value of the return given a state. But also recall that we can define it recursively.\n\
    ```python\nV(s) = E[G(t) | S(t)=s] = E[R(t+1)+gamma*V(S(t+1)) | S(t)=s]\n```\n\
    \nSo, it’s reasonable to ask, if we can just replace the return in the update\
    \ equation, with this recursive definition of `V`.\n```python\nV(S(t)) = V(S(t))\
    \ + alpha*[R(t+1) + gamma*V(S(t+1)) - V(S(t))]\nV(s) = V(s) + alpha*[r+V(s’)-V(s)]\n\
    ```\nWhat we get from this is the `TD(0)` method. If you look at this carefully,\
    \ you’ll realize why this is a fully online bootstrapping method. We’re now not\
    \ calculating `G`, the full return. Instead, we’re just using another `V` estimate,\
    \ in particular, the `V` for the next state. What this also tells us is that we\
    \ can’t update `V(s)`, until we know `s’`. So rather than waiting for the entire\
    \ episode to finish, we just need to wait until we reach the next state, to update\
    \ the value for the current state.\n\nIt’s helpful to examine how these estimates\
    \ work and what the sources of randomness are.\n"
