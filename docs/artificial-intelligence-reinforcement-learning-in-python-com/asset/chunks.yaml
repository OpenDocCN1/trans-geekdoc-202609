- raw: 'The way we make decisions for what actions to do in what states, is called
    a policy .


    We usually denote a policy with the symbol pi.


    Technically the policy is not part of the MDP itself, but it’s part of the solution
    along with the value function (which we’ll define more formally soon).


    The reason I’ve left the policy out until now is because it’s kind of a weird
    symbol.


    We write down pi as a mathematical symbol, but there’s no equation for pi.


    For example, if pi is epsilon-greedy, how do write that as an equation? It’s more
    like an algorithm.


    E.g. pi = epsilon-greedy? This is not an equation.


    The only exception to this is when you want to write down the optimal policy,
    which can be defined mathematically in terms of the value function.


    We’ll talk about optimal policies and what that means in a later lecture.


    So for now, pi is more like a short-hand notation for the algorithm the agent
    is using to navigate the environment.


    \---


    Because a Markov Decision Process satisfies the Markov property, you can imagine
    we can also draw state-transition diagrams for MDPs just like we do for Markov
    Models and Hidden Markov Models.


    I don’t do this often but you may find it useful for yourself.


    \---


    Let’s look at the state-transition probability again, p(s’ | s, a).


    Recall that I said this is typically deterministic but that’s not always the case.


    Why might that be so?


    Remember that the state is only something derived from what the agent senses from
    the environment.


    It’s not the environment itself. The state can be an imperfect representation
    of the environment.


    In which case you would expect the state transition to be probabilistic. For example,
    the state you measure can represent multiple configurations of the environment.


    As an example of an imperfect representation of the environment, think about Blackjack.
    You might think of the dealer’s next card as part of the state. But if you’re
    the agent, you can’t see the next card. So it’s not part of your state. It is
    part of the environment.


    \---


    Sometimes, there’s confusion about what constitutes the agent and the environment.


    Think of yourself navigating your environment. You might think you are the agent,
    but what constitutes “you”?


    Are you your body?


    Your body is more correctly part of the environment. Your body isn’t making decisions
    or learning.


    Your body has sensors which pass on signals to your brain, but it’s your brain
    or your mind that does all the learning and decision making.


    So you want to be mindful of where you draw that boundary that differentiates
    between agent and environment.


    ## Future Rewards


    In this section we are going to formalize the idea of total reward.


    In particular, what we are interested in measuring is total future reward.


    So everything from t+1 and onward.


    We call this the “return”, and use the symbol G(t) to represent it.


    G(t) = R(t+1) + R(t+2) + ... + R(t+infinity)


    Notice how it doesn’t depend on the reward at the current time.


    This is because, strictly speaking, when I arrive at a state, I receive the reward
    for that state. There’s nothing I can predict about it, since it already happened.


    \---


    Now think of a very long task. A task containing a sequence that is thousands
    of steps long.


    Your goal is to maximize your total reward.


    But is there a difference between getting a reward now, and getting that same
    reward 10 years from now?


    Think about finance. You know that $1000 today is worth less than $1000 was 10
    years ago.


    If I were to ask you, would you rather get $1000 today, or would you rather get
    $1000 10 years later, you would of course choose today.


    \---


    And so we introduce what is called a discount factor on the future rewards.


    We call the discount factor gamma and we use a number between 0 and 1 to represent
    it.


    G(t) = sum\[t’=0...inf\]{ gamma^t’ R(t+t’+1) }


    It should be clear that a gamma of 1 means we don’t care about how far in the
    future a reward is, all future rewards should be weighted equally.


    If gamma is 0, that means we don’t care about the future at all. Doing that would
    be a truly greedy algorithm, since the agent would only try to maximize its immediate
    reward.


    Usually we choose something in between, like gamma = 0.9.


    If we have a very short episodic task, it may not be worth discounting at all.


    An intuitive reason you might want to discount future rewards, is because the
    further you go in the future, the harder it is to predict. So there’s not a lot
    of sense in putting all your effort into getting something 10 years from now,
    unless you’re sure you can make it happen and that your circumstances won’t change.


    \---


    You’ll notice that the sum for the return goes from t’ = 0 to infinity.


    But recall that this suggests we’re looking at a continuous task, when in reality
    the games we’ve seen, tic-tac-toe and Gridworld, are both episodic tasks.


    This is a mathematical subtly, but we actually want to write all of our equations
    in continuous form. Simply put, it makes the math easier.


    There is a way to “merge” episodic and continuous tasks so that they are equivalent.


    The way you do it is this.


    The episodic task has a terminal state. What you can do is, pretend that there
    is a state transition from the terminal state to itself, that always happens with
    probability 1, and always yields the reward 0.


    In this way, the episodic task remains the same, but since it technically goes
    on forever it’s also a continuous task.


    ## Value Functions


    In this section we are finally ready to start formally discussing value functions.


    We saw value functions earlier when we discussed tic-tac-toe, but that was informal
    and only for the purpose of gaining intuition.


    So if you see any discrepancies between how we defined the value function before,
    and how we’re defining it now, you should consider everything we do from here
    onward to be more correct.


    The value function, given a policy and a state “s”, is equal to the expected value
    of the return, given that you are currently in state “s”.


    V(s) = E\[G(t) | S(t)=s\] = E\[ sum\[t’=0...inf\]{ gamma^t’ R(t+t’+1) } | S(t)=s\]


    Note that because of how it’s defined, the value function is dependent on the
    policy. This is because any future state transitions depend on what your policy
    is.


    Also notice that the value function depends only on future rewards.


    That means the value of any terminal state is 0, because by definition, you won’t
    be doing anymore state transitions and hence you won’t be receiving any future
    rewards.


    \---


    Let’s now do some algebra.


    Notice that the return is recursive. We can separate out R(t+1) from R(t+2) and
    so on.


    V(s) = E\[R(t+1) + gamma\*G(t+1) | S(t)=s\]


    \---


    Because this is the expected value over pi, that means we can express pi as a
    probability distribution.


    In particular, we can express it as the probability of doing an action “a” given
    that we’re in state “s”.


    pi = pi(a | s)


    Since expected values are linear operators, we can do the 2 terms in the expected
    value separately, so let’s first consider just the expected value of R(t+1) given
    “s”.


    Because everything is stochastic, this is governed by 2 probability distributions.
    First, there’s the policy, pi(a | s), that determines what action we’ll do.


    Once we have the state-action pair “s” and “a”, there’s also the probability distribution
    p(s’, r | s, a), which we can marginalize to get p(r | s, a).


    So both of these probability distributions are needed to find the expected value.


    E\[R(t+1) | S(t)=s\] = sum\[a\]{ pi(a | s) sum\[r\]{ rp(r | s,a) }}


    And of course we can write this in terms of the full joint state-transition probability
    as well, by summing over s’.


    E\[R(t+1) | S(t)=s\] = sum\[a\]{ pi(a | s) sum\[s’, r\]{ rp(s’,r | s,a) }}


    In fact, we can use this to calculate the expected value of anything given the
    policy and the current state.


    E\[ANY | S(t)=s\] = sum\[a\]{ pi(a | s) sum\[s’, r\]{ ANYp(s’,r | s,a) }}'
