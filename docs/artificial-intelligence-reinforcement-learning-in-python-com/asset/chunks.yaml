- raw: 'At each round we generate a random number. If the random number is less than
    epsilon, we explore, meaning we just choose an arm at random. If the random number
    is greater than epsilon, we exploit, meaning we choose the arm that has the best
    maximum so far .


    So it should be clear from this that eventually, you’ll learn which arm is the
    true best, even though your initial guesses might be wrong, since every arm always
    has the chance to get updated.


    \---


    In the long run, epsilon-greedy allows us to explore each of the arms an infinite
    number of times.


    The problem with this however, is that eventually you’ll get to a point where
    you’re still exploring when you don’t really need to explore anymore.


    So if epsilon is 10%, then you’ll still spend 10% of the time choosing suboptimal
    arms.


    An A/B test could also be useful here, where you could do a test at a predetermined
    time to check for statistical significance. If you find statistical significance,
    you could set epsilon to 0, and effectively you’re only doing the greedy part.


    However, we’ll see better ways to adapt to what we’ve learned in the near future.


    ## Updating a Mean


    Let’s assume that our rewards aren’t just coin tosses, so we don’t just need to
    store the number of successes and failures.


    The general method for solving this problem is to use the mean.


    This works for coin tosses too, since if you add up all the 0s and 1s you get,
    and divide by N, you arrive at the maximum likelihood probability of getting a
    1.


    So how do we calculate the sample mean of a random variable?


    We know that it’s the total sum divided by the number of samples.


    `Xmean(N) = sum[i=1..N]{ X(i) } / N`


    What’s the problem with this equation?


    The problem with this equation is that it requires is to store all N elements
    in order to calculate the mean.


    Is there a way to make that calculation more efficient?


    Indeed there is.


    The trick is, the mean at the Nth sample can be calculated from the mean at the
    (N-1)th sample.


    `Xmean(N) = (1 - 1/N)Xmean(N-1) + (1/N)X(N)`


    `Xmean(N) = Xmean(N-1) - (1/N)[Xmean(N-1) - X(N)]`


    If you don’t see how this works right away try deriving it yourself on paper.


    So this equation allows us to calculate the mean in a computationally efficient
    way.


    Remember this form of the update equation, it’ll be very important throughout
    the rest of the book.


    ## Comparing Different Epsilons in Code


    In this section we are going to implement epsilon-greedy in code, and demonstrate
    the effect of different settings of epsilon.


    If you don’t want to try to code this yourself, although I highly encourage you
    to do so, the relevant file in the course repo is comparing\_epsilons.py


    `import numpy as np`


    `import matplotlib.pyplot as plt`


    ` `


    `# represents one bandit arm`


    `class Bandit:`


    `def __init__(self, m):`


    `self.m = m # true mean`


    `self.mean = 0`


    `self.N = 0`


    ` `


    `# simulates pulling the bandit’s arm`


    `# is a Gaussian with unit variance`


    `def pull(self):`


    `return np.random.randn() + self.m`


    ` `


    `# this is the update equation we just learned`


    `def update(self, x):`


    `self.N += 1`


    `self.mean = (1 - 1.0/self.N)*self.mean + 1.0/self.N*x`


    ` `


    ` `


    `# N = number of times we play`


    `# m1, m2, m3 = mean rewards for the 3 arms`


    `# eps = epsilon for the epsilon greedy strategy`


    `def run_experiment(m1, m2, m3, eps, N):`


    `bandits = [Bandit(m1), Bandit(m2), Bandit(m3)]`


    ` `


    `data = np.empty(N)`


    `for i in xrange(N):`


    `# epsilon greedy`


    `p = np.random.random()`


    `if p < eps:`


    `j = np.random.choice(3)`


    `else:`


    `j = np.argmax([b.mean for b in bandits])`


    `x = bandits[j].pull()`


    `bandits[j].update(x)`


    ` `


    `# for the plot`


    `data[i] = x`


    `cumulative_average = np.cumsum(data) / (np.arange(N) + 1)`


    ` `


    `# plot moving average reward`


    `plt.plot(cumulative_average)`


    `plt.plot(np.ones(N)*m1)`


    `plt.plot(np.ones(N)*m2)`


    `plt.plot(np.ones(N)*m3)`


    `plt.xscale(''log'')`


    `plt.show()`


    ` `


    `for b in bandits:`


    `print b.mean`


    ` `


    `return cumulative_average`


    ` `


    `if __name__ == ''__main__'':`


    `c_1 = run_experiment(1.0, 2.0, 3.0, 0.1, 100000)`


    `c_05 = run_experiment(1.0, 2.0, 3.0, 0.05, 100000)`


    `c_01 = run_experiment(1.0, 2.0, 3.0, 0.01, 100000)`


    ` `


    `# log scale plot`


    `plt.plot(c_1, label=''eps = 0.1'')`


    `plt.plot(c_05, label=''eps = 0.05'')`


    `plt.plot(c_01, label=''eps = 0.01'')`


    `plt.legend()`


    `plt.xscale(''log'')`


    `plt.show()`


    ` `


    ` `


    `# linear plot`


    `plt.plot(c_1, label=''eps = 0.1'')`


    `plt.plot(c_05, label=''eps = 0.05'')`


    `plt.plot(c_01, label=''eps = 0.01'')`


    `plt.legend()`


    `plt.show()`


    ## Optimistic Initial Values


    In this lecture we are going to look at another way to solve the explore-exploit
    dilemma called the “optimistic initial values” method.


    Again it’s very simple.


    Suppose you knew the true mean of the bandits was much less than 10. The idea
    is you want to pick an high ceiling for your initial estimate of the bandit mean,
    and then do your update based on that.


    E.g.


    `Xmean(0) = 10`


    We say this is “optimistic” because the initial value for the sample mean is too
    good to be true.


    Since it’s too good to be true, the only thing that can ever happen is it will
    go down.


    So if the mean is 1, then as I collect more values, the sample mean is going to
    converge to 1.


    In fact, eventually, all the means will eventually settle into their true values,
    at which point we’ll just be exploiting.


    But it should be clear that this helps exploration as well.


    If you haven’t explored a bandit that much, then it’s sample mean is going to
    be very high, due to the initial setting. In fact it’s going to be higher than
    everything else, which means you’ll be forced to explore it.


    So in the main loop, all you need to do is perform the greedy strategy, but using
    these optimistic means.


    There are only 2 simple changes we need to make to the epsilon-greedy code to
    make this work.


    First, we change the initial setting of the mean to 10.


    Second, we remove the epsilon part and just do the greedy part.


    `class Bandit:`


    `def __init__(self, m):`


    `self.m = m`


    `self.N = 0`


    `...`


    `for i in xrange(N):`


    `# optimistic initial values`


    `j = np.argmax([b.mean for b in bandits])`


    `x = bandits[j].pull()`


    `bandits[j].update(x)`


    ` `


    In the code we compare the epsilon-greedy strategy with epsilon=10%, to the optimistic
    initial value strategy.


    If you don’t want to try to code this yourself, although I highly encourage you
    to do so, the relevant file is optimistic\_initial\_values.py


    \[run the code yourself before moving on!\]


    So it looks like we do a lot better with optimistic initial values compared to
    epsilon-greedy. With epsilon-greedy we always end up doing sub-optimally in the
    long run, but you can see we’re very close to 3 (the max reward) with the optimistic
    strategy.


    ## UCB1


    In this section we are going to look at yet another method for solving the explore-exploit
    dilemma.


    These are all important parts of the reinforcement learning literature, though
    it might seem we’re being a little too thorough.


    The main idea behind UCB1 is confidence bounds.


    Intuitively, you know that if you collect 10 samples and take the mean, this is
    not as accurate as when you collect 1000 samples and take the mean.


    If you were to draw a confidence bound around each mean, you would draw a much
    wider bound around the 10-sample mean, and a much skinnier bound around the 1000-sample
    mean.


    In statistics, there is a bound called the Chernoff-Hoeffding bound, and it says
    that our confidence bound changes exponentially with the number of samples we
    collect.


    `P(|Xmean - true_mean| >= eps) <= 2exp(-2*(eps**2)*N)`


    The bound looks complicated but it becomes less complicated if you read it out
    slowly.


    It says that “the probability that the absolute difference between the sample
    mean and the true mean, is greater than or equal to epsilon - is less than 2 x
    the exponent of -2(eps^2)N”


    Where N is the number of samples collected, and epsilon is just an arbitrary small
    number.'
