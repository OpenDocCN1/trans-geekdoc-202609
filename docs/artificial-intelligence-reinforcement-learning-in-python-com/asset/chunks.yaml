- raw: 'If you don’t want to try to code this yourself, although I highly recommend
    you do, the relevant file for this lecture is monte\_carlo.py


    At the top we have our usual imports. We’ve imported both standard\_grid and negative\_grid,
    I would encourage you to try both. We also make use of the print\_values and print\_policy
    functions we defined earlier.


    We have our usual constants as well.


    `import numpy as np`


    `from grid_world import standard_grid, negative_grid`


    `from iterative_policy_evaluation import print_values, print_policy`


    ` `


    `SMALL_ENOUGH = 10e-4`


    `GAMMA = 0.9`


    `ALL_POSSIBLE_ACTIONS = (''U'', ''D'', ''L'', ''R'')`


    Next we define the play\_game function, which takes in a grid and a policy.


    `def play_game(grid, policy):`


    `# returns a list of states and corresponding returns`


    ` `


    `# reset game to start at a random position`


    `# we need to do this, because given our current deterministic policy`


    `# we would never end up at certain states, but we still want to measure their
    value`


    `start_states = grid.actions.keys()`


    `start_idx = np.random.choice(len(start_states))`


    `grid.set_state(start_states[start_idx])`


    ` `


    `s = grid.current_state()`


    `states_and_rewards = [(s, 0)] # list of tuples of (state, reward)`


    `while not grid.game_over():`


    `a = policy[s]`


    `r = grid.move(a)`


    `s = grid.current_state()`


    `states_and_rewards.append((s, r))`


    `# calculate the returns by working backwards from the terminal state`


    `G = 0`


    `states_and_returns = []`


    `first = True`


    `for s, r in reversed(states_and_rewards):`


    `# the value of the terminal state is 0 by definition`


    `# we should ignore the first state we encounter`


    `# and ignore the last G, which is meaningless since it doesn''t correspond to
    any move`


    `if first:`


    `first = False`


    `else:`


    `states_and_returns.append((s, G))`


    `G = r + GAMMA*G`


    `states_and_returns.reverse() # we want it to be in order of state visited`


    `return states_and_returns`


    Our policy is the same one we used earlier, which is to take the upper-left path
    all the way to the goal state. And for any state not in that path, to go to the
    losing state.


    Since Monte Carlo only calculates values for states that are actually visited,
    and if we only start at the prescribed start state, there will be some states
    that we’ll never visit, we need this little hack at the beginning of play\_game
    which allows us to start the game at any state.


    This is called the “exploring starts” method and we’ll discuss it more in-depth
    later on.


    Next, we play the game. This is pretty much exactly the same as the pseudocode
    I showed you earlier. The goal here is to make a list of all the states we visited
    and the rewards we got.


    Next, we calculate the returns for each state. This is again exactly like the
    pseudocode I showed you earlier. We visit each state in reverse, and recursively
    calculate the return.


    At the end, we reverse the list of returns since we want it to be in chronological
    order given that we’re doing “first-visit” Monte Carlo.


    \---


    Next we enter the main section.


    `if __name__ == ''__main__'':`


    `# use the standard grid again (0 for every step) so that we can compare`


    `# to iterative policy evaluation`


    `grid = standard_grid()`


    ` `


    `# print rewards`


    `print "rewards:"`


    `print_values(grid.rewards, grid)`


    ` `


    `# state -> action`


    `policy = {`


    `(2, 0): ''U'',`


    `(1, 0): ''U'',`


    `(0, 0): ''R'',`


    `(0, 1): ''R'',`


    `(0, 2): ''R'',`


    `(1, 2): ''R'',`


    `(2, 1): ''R'',`


    `(2, 2): ''R'',`


    `(2, 3): ''U'',`


    `}`


    ` `


    `# initialize V(s) and returns`


    `V = {}`


    `returns = {} # dictionary of state -> list of returns we''ve received`


    `states = grid.all_states()`


    `for s in states:`


    `if s in grid.actions:`


    `returns[s] = []`


    `else:`


    `# terminal state or state we can''t otherwise get to`


    `V[s] = 0`


    The first thing we do is get the grid, print out the rewards, and create the policy.


    Next we initialize the returns. Note that we don’t bother setting the values for
    terminal states because we already know they’re going to be 0.


    We also don’t bother setting an initial value for any of the other states, because
    they would be immediately overwritten using the average returns.


    \---


    Next we have our Monte Carlo loop. This plays a game and gets the states and returns
    lists.


    `# repeat`


    `for t in xrange(100):`


    ` `


    `# generate an episode using pi`


    `states_and_returns = play_game(grid, policy)`


    `seen_states = set()`


    `for s, G in states_and_returns:`


    `# check if we have already seen s`


    `# called "first-visit" MC policy evaluation`


    `if s not in seen_states:`


    `returns[s].append(G)`


    `V[s] = np.mean(returns[s])`


    `seen_states.add(s)`


    Next, we create a set to keep track of all the states we’ve seen, since we only
    want to add a return if it’s the first time we’ve seen the state in this episode.


    Next, we loop through all the states and returns. If this is the first time we’ve
    seen the state, we add G to our returns list for the state.


    We then recalculate V(s). Notice how we’re not doing anything special to calculate
    the mean here, just using the default definition.


    And then we add “s” to the states we’ve seen.


    At the end of the script, we print the values we calculated, and the policy we
    used.


    `print "values:"`


    `print_values(V, grid)`


    `print "policy:"`


    `print_policy(policy, grid)`


    Result:


    `rewards:`


    `---------------------------`


    `0.00| 0.00| 0.00| 1.00|`


    `---------------------------`


    `0.00| 0.00| 0.00| -1.00|`


    `---------------------------`


    `0.00| 0.00| 0.00| 0.00|`


    `values:`


    `---------------------------`


    `0.81| 0.90| 1.00| 0.00|`


    `---------------------------`


    `0.73| 0.00| -1.00| 0.00|`


    `---------------------------`


    `0.66| -0.81| -0.90| -1.00|`


    `policy:`


    `---------------------------`


    `R | R | R | |`


    `---------------------------`


    `U | | R | |`


    `---------------------------`


    `U | R | R | U |`


    So it looks like we get the exact same answer as iterative policy evaluation.


    ## MC to find V in Windy Gridworld


    In this lecture, we are going to use the same Monte Carlo prediction algorithm
    to find V, but this time we’ll be in windy Gridworld and we’ll be using a slightly
    different policy.


    One thing you might have noticed with the last script, is that Monte Carlo wasn’t
    really needed, since the returns were deterministic. This was because the 2 probability
    distributions we’re interested in, pi(a | s), and p(s’,r | s,a), were both deterministic.


    In Windy Gridworld, the state transitions are not deterministic, so we’ll have
    a source of randomness, and hence a need for Monte Carlo.


    Also, the policy will be different.


    In particular, this policy is always going to try to win, or in other words, travel
    to the goal state.


    We’ll see that even though the policy is to go to the goal state, not all values
    will end up positive, since in windy gridworld, the wind can still end up pushing
    you into the losing state.


    So on average, the return for that state is negative.


    If you don’t want to try to code this yourself, although I highly recommend you
    do, the relevant file in the course repo is monte\_carlo\_random.py


    \---


    `import numpy as np`


    `from grid_world import standard_grid, negative_grid`


    `from iterative_policy_evaluation import print_values, print_policy`


    ` `


    `SMALL_ENOUGH = 10e-4`


    `GAMMA = 0.9`


    `ALL_POSSIBLE_ACTIONS = (''U'', ''D'', ''L'', ''R'')`


    At the top we have the same imports and constants as the regular Monte Carlo script.


    Underneath that we have the random\_action function.


    `def random_action(a):`


    `# choose given a with probability 0.5`


    `# choose some other a'' != a with probability 0.5/3`


    `p = np.random.random()`


    `if p < 0.5:`


    `return a`


    `else:`


    `tmp = list(ALL_POSSIBLE_ACTIONS)`


    `tmp.remove(a)`


    `return np.random.choice(tmp)`


    This works the same way as the previous Gridworld. We have a 0.5 probability of
    doing the intended action, and a 0.5/3 probability of doing some other action.


