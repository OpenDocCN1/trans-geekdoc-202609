    \ None\n    max_val = float('-inf')\n    for k, v in d.iteritems():\n        if\
    \ v > max_val:\n            max_val = v\n            max_key = k\n    return max_key,\
    \ max_val\n```\n\n```python\nif __name__ == '__main__':\n    grid = standard_grid()\n\
