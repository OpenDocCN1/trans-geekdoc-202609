    The input into iterative policy evaluation is a policy pi, and the output is the
    value function for this policy.


    We start out initializing V(s) to 0 for all states. Then in an infinite loop,
    we initialize a variable called 𝛥. 𝛥 represents the maximum change during the
    current iteration. We’ll use 𝛥 to determine when to quit. When 𝛥 is small enough,
    that’s when we’ll break out of the loop.


    Then for every state in the state space, we keep a copy of the old V(s), and then
    we use Bellman’s equation to update V(s).


    We set 𝛥 to be the maximum change in V(s) for that iteration.


    Once this converges, we return V(s).


    \---


    The main point of interest in the algorithm is of course the part that contains
    the Bellman equation.


    V [k+1]  (s) = sum\[a\]{ pi(a | s) sum\[s’, r\]{ p(s’,r | s,a)(r+V [k]  (s’))
    }}


    Notice how, strictly speaking, the values at iteration k+1 depend only on the
    values at iteration k.


    However, this need not be the case.


    In fact, we can always just use our most up-to-date versions of the value function
    for any state by doing an in-place update.


    This actually ends up converging faster.


    \---


    One last note:


    We usually call the act of finding the value function for a given policy, the
    prediction problem .


    Later in this section, we’ll learn an algorithm for finding the optimal policy.
    This is called the control problem .


    So this will be the pattern we’ll follow in all of the remaining sections of the
    book.


    We’ll first look at the prediction problem to find the value function for a given
    policy, and then we’ll look at the control problem to find the optimal policy.


