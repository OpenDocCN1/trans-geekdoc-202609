    # Markov Decision Processes


    ## Gridworld


    In this chapter, we are going to formalize some of the concepts we’ve already
    learned about in reinforcement learning. We’ve learned about the terms agent,
    environment, action, state, reward, and episode.


    This section is all about putting all these concepts into a formal framework called
    Markov Decision Processes.


    \---


    In this section we are going to describe the game that we are going to use for
    the rest of the book.


    In many ways this is actually a simpler game than tic-tac-toe, but it has some
    properties that allows us to explore some more of the features of reinforcement
    learning.


    In Gridworld your agent is a robot, and the environment, as you probably would
    guess, is a grid.


    The agent is allowed to move in 4 directions: up, down, left, or right. That is
    its entire set of actions.


    The grid is usually built in this way.


    `0 1 2 3`


    `+-----+-----+-----+-----+`


    `0| | | | win |`


    `+-----+-----+-----+-----+`


    `1| | wall| | lose|`


    `+-----+-----+-----+-----+`


    `2|start| | | |`


    `+-----+-----+-----+-----+`


    At position (1, 1) there is a wall, so the robot can’t go there. If it tries to
    go there, it just bumps into the wall.


    At position (0, 3) and position (1, 3) we have 2 terminal states. Position (0,
    3) is the goal state. You want to end up here because this is where you get the
    maximum reward. Position (1, 3) is a losing state. If you end up here you lose.
    I use the term “lose” loosely because we are more concerned with well-defined
    concepts like total reward. In any case, at this position you will receive a large
    negative reward. So you don’t want to end up there.


    \---


    One thing you’ll notice about Gridworld is that it has a much smaller number of
    states than tic-tac-toe. The state can be defined as the position of the robot.
    So there are only 11 states, because the grid is of size 12 and the robot can’t
    go to one of the squares.


    As you’ve already seen, there are only 4 actions.


    So this is a pretty small game - 11 states and 4 actions. And from this we will
    derive the rest of the concepts in this course.


    ## The Markov Property


    In this lecture we are going to discuss the Markov property. As you can tell from
    the name, the Markov property is a central component of the Markov Decision Process.


    The reason we’re devoting an entire lecture to the Markov property is because
    in the context of reinforcement learning, the Markov property looks a little different
    than what we’ve seen in the past.


    \---


    Let’s review the Markov property in the strict mathematical sense.


    Suppose we have a sequence x(1) up to x(t).


    {x(1), x(2), ..., x(t)}


    We can define a conditional probability on x(t) given all the previous x’s.


    p{x(t) | x(t-1),x(t-2),...,x(1)}


    Generally speaking, this can’t be simplified.


    But if we assume that the Markov property is true , then it can be simplified.


    First-order Markov:


    p{x(t) | x(t-1),x(t-2),...,x(1)} = p{x(t) | x(t-1)}


    Second-order Markov:


    p{x(t) | x(t-1),x(t-2),...,x(1)} = p{x(t) | x(t-1), x(t-2)}


    The Markov property (order) specifies how many previous x’s the current x depends
    on.


    So first-order Markov means that x(t) depends only on x(t-1).


    Second-order Markov means that x(t) depends only on x(t-1) and x(t-2).


    In this course, we will be working with first-order Markov only, and we typically
    just refer to this as the Markov property.


    \---


    Let’s do a simple example of the Markov property.


    Let’s consider the sentence, “Let’s do a simple example”.


    If I were to tell you: “here are the previous words in my sentence, now predict
    the next word”.


    And the previous words are “Let’s do a simple...”.


    You could probably guess that the next word is “example”.


    Now I say, the “the previous word is just ‘simple’”. Can you predict the next
    word? Probably, but it’s harder.


    What if the previous word is just “a”? Can you predict the next word? Probably
    not.


    But that’s what the Markov assumption is.


    So you see that the Markov assumption can be quite limiting, but you can also
    define your problem such that it’s not.


    \---


    So what does the Markov property look like in reinforcement learning?


    Recall that doing an action A(t) while in state S(t) produces 2 things.


    It produces the next state, S(t+1), and a reward, R(t+1).


    What the Markov property in this case says, is that S(t+1) and R(t+1) depend ONLY
    on A(t) and S(t), but not any A or S before that.


    p{S(t+1),R(t+1) | S(t),A(t),S(t-1),A(t-1),...,S(1),A(1)} = p{S(t+1),R(t+1) | S(t),A(t)}


    For convenience, we can also use our shorthand symbols, s, a, r, and s’.


    p(s'',r | s,a) = p{S(t+1)=s’,R(t+1)=r | S(t)=s,A(t)=a}


    So how is this different from the “usual” way we write the Markov property?


    Well notice how this is a joint distribution on s’ and r. So it’s telling us the
    joint distribution of 2 variables, conditioned on 2 other variables.


    This is different from the “usual” Markov from where we only have 1 variable on
    the left and 1 variable on the right.


    \---


    Given this joint conditional distribution, it is of course just a matter of using
    the rules of probability to find the marginal conditional distributions. For example
    if we just want to know s’ given s and a, or we just want to know r, we can use
    these equations:


    p(s'' | s,a) = integral\[r\]{ p(s’,r | s,a)dr }


    p(r | s,a) = sum\[s’\]{ p(s’,r | s,a) }


    (Assuming r is continuous and s is discrete).


    Also note that for pretty much all cases we’ll consider, these probabilities will
    be deterministic.


    That means, the reward you get for going to the state will always be the same
    reward.


    And doing an action in a state will always bring you to the same next state.


    But it’s good to know that these probabilities are defined if you need them, and
    they are also part of the core theory.


    \---


    As an example of how the Markov assumption is not necessarily limiting, we can
    look at a recent application of reinforcement learning.


    DeepMind (Mnih et al. 2013) used the concatenation of the 4 most recent frames
    in order to represent the current state.


    Strictly speaking, the state can be made up of anything from anytime from past
    to current. We just typically think of the state right now to be something we
    are measuring right now, but that need not be the case.


    Note that we also need not use raw data to represent the state. The state can
    also be made up of data derived from the raw data. You might think of that as
    a feature transformation on the raw data.


    Essentially any input from the agent’s sensors can be used to form the state.


    ## Formalizing the Markov Decision Process


    In this lecture we are going to look at the Markov Decision Process more formally.


    We’ve essentially been looking at Markov Decision Processes this whole time, just
    never calling it by name.


    Any reinforcement learning task with a set of states, actions, and rewards, that
    follows the Markov property, is a Markov Decision Process.


    Formally speaking, a Markov Decision Process is a 5-tuple, made up of the set
    of states, set of rewards, set of actions, the state-transition probabilities
    and the reward probabilities, which we previously discussed as a joint distribution,
    and the discount factor, which we’ll define in a later lecture.


    \---


    There is however, one more piece we need to complete the puzzle.


    The other key term in “Markov Decision Process” is “decision”.'
