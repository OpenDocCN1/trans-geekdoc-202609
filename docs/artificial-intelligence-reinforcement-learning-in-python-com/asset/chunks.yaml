    \n## 代码中的网格世界 (Gridworld)\n\n在本节中，我们将用代码实现网格世界。这是课程中所有后续脚本所需要的，因此你现在需要理解它。\n\n\
    本节的相关文件是 `grid_world.py`。\n\n```python\nimport numpy as np\n\nclass Grid: # 环境\n\
    \    def __init__(self, width, height, start):\n        self.width = width\n \
    \       self.height = height\n        self.i = start[0]\n        self.j = start[1]\n\
