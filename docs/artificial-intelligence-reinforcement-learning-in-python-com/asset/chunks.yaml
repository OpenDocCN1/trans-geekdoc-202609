  trans: "\n正如你所知，我们将类别编码为特征向量的方法是独热编码（one-hot-encoding）。\n\n---\n\n让我们讨论一下如果我们对每个状态进行独热编码会发生什么。\n\
    \n我们有 `|S|` 个状态，因此 `X` 的维度（我们称之为 `D`）是 `|S|` 的基数。\n\n`D=|S|`\n\n所以我们有一个大小为 `|S|`\
    \ 的长型特征向量 `X`。\n\n然后，对于每个状态，我们将 `X` 中的其中一个值设置为 1。\n\n`s = (0,0) → x = [1, 0, 0,\
    \ …]`\n`s = (0,1) → x = [0, 1, 0, …]`\n\n---\n\n这种方法的问题在于，它无法允许我们压缩存储值函数所需的空间，而这正是我们最初想要这样做的根本。\n\
    \n回一下，如果我们把 `V` 存储为一个字典，它将会有 `|S|` 个键和 `|S|` 个值。\n\n所以，如果我们使用独热编码，并没有带来任何改进。\n\
    \n事实上，这与我们之前所做的等价的，因为在这种情况下，每个 `theta` 都代表对应状态的值。\n\n`V(s=0) = theta.dot([1,0,0,...])\
    \ = theta[0] = theta 的第 0 个分量`\n\n---\n\n然而，在特征变换中使用独热编码也有一个积极的方面。\n\n假设你的算法不起作用，且\
    \ `V_hat` 不能很好地表示真实的 `V`。\n\n你的 `V_hat` 可能不好的原因之一是你的特征可能不好。\n\n所以，你的代码可能是完美且没有\
    \ true 的，但仍然因为特征不好而没有产生良好的结果。\n\n因此在这种情况下，你可以更改特征转换器来使用独热编码，其中你单独预测每个 `V(s)`。\n\
    \n如果你这样做并且代码运行正常，那么它告诉你的你的特征很糟糕。\n\n---\n\n那么，如果独热编码并不好，那么什么才是好的呢？\n\n在网格世界（Gridworld）的情况下，考虑每个\
    \ `(i, j)` 位置实际上代表二维空间中的一个位置。\n\n因此，它更像是一个实数而不是一个类别。\n\n所以你可以直接将 `X` 向量表示为 `(i,\
    \ j)` 本身。你可能想对其缩放，使其均值为 0，方差为 1。\n\n`(x1,x2) = (i,j)`\n\n我们将此特征向量简单视为原始数据 - 无需任何特征工程。\n\
    \n---\n\n将 `x` 仅设置为智能体的位置有什么问题？\n\n记住我们的模型是线性的。\n\n假设 `j` 是固定的。\n\n这意味着，`V` 只能随\
    \ `i` 线性变化。\n\n这意味着，`V` 对于这个 `x` 坐标只能是一条直线。\n\n所以它要么始终增加的，要么始终减少的。\n\n这种表表达能力不高。\n\
    \n回想我的线性回归课程，创建新特征的一种简单方法是创建多项式。\n\n你可能在微积分学习中学习过，无限的泰勒展开可以近似任何函数。\n\n所以，如果我们从\
    \ `x1` 和 `x2` 开始，我们可以创建项 `x1²`、`x2²` 和 `x1*x2`。\n\n如果你需要，你也可以创建高阶多项式，但你必须注意过拟合。\n\
    \n这是我们在本课程中将使用的方法，但如果你知道其他手动创建特征的方法，欢迎也使用那些方法。\n\n## MC 预测理论\n\n现在我们已经为将监督线性模型整合到我们的标记尔决策过程过程中奠定了基础，我们可以开始将它们应用于预测问题和控制问题。\n\
    \n我们当然将从预测问题开始。\n\n特别在本讲座中，我们将使用蒙特卡洛估计，但用我们的值函数线性模型替换值函数字典。\n\n---\n\n回想起蒙特卡洛估计，我们有两个重复执行的两个步骤。\n\
    \n第一步是玩游戏，并计算状态和回报（returns）列表。\n\n第二步是以回报为目标、以 `V(s)` 为预测来更新 `V(s)`。记住这是梯度下降，但它等同于计算该状态所有回报的平均值。\n\
    \n`V(s) = V(s) + alpha*(G - V(s))`\n\n---\n\n由于在本讲座中我们用参数 `theta` 来近似 `V(s)`，因此我们想要更新的是\
    \ `theta`。\n\n所以现在我们继续进行随机梯度下降，但是是针对 `theta` 而不是 `V`。\n\n`theta = theta + alpha*(G\
    \ - V_hat(s))x`\n\n---\n\n记住这是针对固定策略的，因为我们正在解决预测问题。\n\n让我们看一些伪代码来巩固这个想法。\n\n我们首先输入一个策略\
    \ `pi`，并随机初始化 `theta` 向量。\n\n接下来，我们进入一个迭代若干次的循环。\n\n在每次迭代中，我们玩游戏，它返回一系列状态和回报。\n\
    \n我们遍历这些状态和回报，并将我们的更新方程应用于 `theta`，将回报视为目标。\n\n```python\ndef mc_approx_prediction(\U0001D70B\
    ):\n    \U0001D703 = random\n    for i=1..N:\n        states_and_returns = play_game\n\
    \        for s, g in states_and_returns:\n            ���(s)\n            \U0001D703\
    \ ← \U0001D703 + \U0001D6FC(g - \U0001D703)x\n```\n\n## MC 预测代码\n\n在本讲座中，我们将使用参数化值函数实现\
    \ `V_hat`。在顶部有导入语句。\n\n```python\nimport numpy as np\nimport matplotlib.pyplot\
    \ as plt\nfrom grid import standard_grid, grid, s2x\nfrom monte_carlo import random,\
    \ play_game, values, policy\n```\n\n`LEARNING_RATE = 0.001`\n\n`theta = np.randn(4)\
    \ / 2`\n\n```python\ndef s2x(s):\n    return np.array([s[0], s[1], s[0]*s[1],\
    \ 1])\n```\n\n注意到这里的特征是 i 坐标和 j 坐标之间的交互作用。我们还有一个 1，代表偏置项。\n\n接下来，是我们的主循环。\n\n\
    ```python\ndeltas = []\nt = 1.0\nfor it in xrange(20000):\n    if it % 100 ==\
    \ 0:\n        t += 0.01\n    alpha = LEARNING_RATE/t\n    # 使用 policy 生成回合\n \
    \   biggest_change = 0\n    states_and_returns = play_game(grid, policy)\n   \
    \ seen_states = set()\n    for s, G in states_and_returns:\n        # 检查是否已经见过\
    \ s # 称为“首次访问”MC 策略评估\n        if s not in seen_states:\n            old_theta\
    \ = theta.copy()\n            x = s2x(s)\n            V_hat = theta.dot(x)\n \
    \           # grad(V_hat) wrt theta = x\n            theta += alpha*(G - V_hat)*x\n\
    \            biggest_change = max(biggest_change, np.abs(old_theta - theta).sum())\n\
    \        seen_states.add(s)\n    deltas.append(biggest_change)\n\nplt.plot(deltas)\n\
    plt.show()\n```\n\n注意到我们正在使用衰减的学习率，所以 alpha 是原始学习率除以 t。\n\n"
