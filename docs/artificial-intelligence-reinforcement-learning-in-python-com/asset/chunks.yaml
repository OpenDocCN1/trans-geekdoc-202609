    \ us it’s a much deeper problem. Maybe it was the act of showing the user the\
    \ ad 10 times that made them want to buy your product.\n\nSo in that sense, all\
    \ the ads deserve to get the same credit.\n\nPerhaps the user didn’t see the ad\
    \ the first 9 times, perhaps something else on the page was more interesting to\
    \ look at. Maybe they only saw the 10th ad. So in that case only the 10th ad deserves\
    \ the credit.\n\nSo in reinforcement learning we’re interested in the entire state\
    \ sequence and how that particular sequence led to the final reward.\n\n## Delayed\
    \ Rewards\n\nClosely related to the idea of the credit assignment problem is the\
    \ idea of “delayed rewards”.\n\nKeep in mind these are all just kind of different\
    \ ways of saying the same thing, and the solution is also the same.\n\nDelayed\
    \ rewards are just looking at the problem from the other direction.\n\nWith credit\
    \ assignment we’re looking into the past and asking, “what action caused the reward\
    \ we’re getting now?”\n\nWith delayed rewards we’re asking, how is the action\
    \ I’m doing now related to the potential reward I may receive in the future?\n\
    \nThe idea of delayed rewards tells us that an AI needs to have the ability of\
    \ foresight or planning. “Planning” is actually a field of study that crosses\
    \ over with reinforcement learning.\n\n---\n\nImagine this scenario. You are in\
    \ state `A`, which is the 2nd last state in the game. There are only 2 possible\
    \ next states, `B` or `C`, both of them are terminal states.\n\n```\noA\n0.5 /\
    \ \\ 0.5\n/ \\\noB oC\nR=1 R=0\n```\n\nB gives you a reward of 1, and C gives\
    \ you a reward of 0. You have a 50% probability of going to either state, perhaps\
    \ because your agent doesn’t yet know which one is best.\n\nWe can think of the\
    \ value of state `B` as 1 and the value of state `C` as 0.\n\nWhat is the value\
    \ of state `A`?\n\nWe can think of it as 0.5, since it’s the expected value of\
    \ your final reward given that you have a 50% chance of ending up in either terminal\
    \ state.\n\n---\n\nLet’s say you’re in state `A`, and state `A` can only lead\
    \ to state `B`, and there’s no other possible next state.\n\nIf B gives you a\
    \ reward of 1, then perhaps `A`’s value should also be 1, since the only possible\
    \ place to end up is with a final reward of 1, once you reach `A`.\n\n```\noA\n\
    1 / \\ 0\n/ \\\noB oC\nR=1 R=0\n```\n\nThus, this value tell us about the “future\
    \ goodness” of a state.\n\n---\n\nTo make this a little more formal, we actually\
    \ call this value the **value function**.\n\nIt’s a measure of the future rewards\
    \ we might get.\n\nI think the term value function is a pretty horrible name since\
    \ the term “value” is very ambiguous, but it’s part of the reinforcement learning\
    \ nomenclature.\n\n---\n\nIt’s easy to get rewards and values intermixed.\n\n\
    The difference is, the value of a state is a measure of the possible future rewards\
    \ we may get from being in this state.\n\nRewards are immediate. i.e. Jumping\
    \ on a Goomba will immediately increase your score.\n\nStanding in front of a\
    \ Goomba will not increase your score, hence will not yield any reward.\n\nHowever,\
    \ being in this state has value because we can soon jump on the Goomba and get\
    \ the reward in the future.\n\n---\n\nSo standing near the Goomba prepared to\
    \ jump might have a higher value than standing on the other edge of the screen\
    \ from a Goomba.\n\nWe therefore choose actions based on the value of the next\
    \ state, rather than the reward we would get by going to that state.\n\nThe reward\
    \ is the main goal, but we can’t use the reward to tell us how good a state is,\
    \ since it doesn’t tell us anything about future rewards.\n\n---\n\nOne way to\
    \ think about the value function is that it’s a fast or efficient way of determining\
    \ “how good” it is to be in a state, without needing to search the rest of the\
    \ game tree.\n\nYou could try to enumerate every possible state transition in\
    \ a game, and determine all the state transition probabilities, but you can imagine\
    \ that would be a time consuming task.\n\nIn fact, most games would be computationally\
    \ infeasible. Tic-tac-toe is easy since it’s only a 3x3 board, so the number of\
    \ states is approximately `3^9 = 19683`. But it grows exponentially with the size\
    \ of the board. For example, if you have a 4x4 board, like in connect 4, then\
    \ you get `3^16 = 43` million. As you probably already know exponential growth\
    \ is never good. Searching the state space is only possible in the simplest of\
    \ cases. Hence a value function that can tell you how you’ll do in the future\
    \ given only your current state is extremely helpful.\n\nAt this point, I haven’t\
    \ told you how we can actually find the value function, so we don’t even know\
    \ if it’s possible yet, but what we’re saying here if we did have it, then that’s\
    \ the information it would tell us, and it would tell us that information instantly,\
    \ without needing to create an entire model of the game tree and transition probabilities.\n\
    \nIn fact, this is a constant time lookup because a state directly maps to a value.\
    \ You would presumably store the values in an array which has constant time lookup.\n\
    \nThis problem, by the way, is another instance of the curse of dimensionality,\
    \ which we’ve seen in my machine learning courses as well.\n\n---\n\nEstimating\
    \ the value function is a central task in reinforcement learning. But note that\
    \ not all RL strategies require it. For instance, a genetic algorithm simply spawns\
    \ offspring that have random genetic mutations, and the ones who survive the longest\
    \ will go on to spawn offspring in the next generation. So by pure evolution or\
    \ natural selection we can breed AIs that get iteratively better at a game.\n\n\
    This is however, not the type of algorithm we’re interested in for reinforcement\
    \ learning most of the time.\n\n---\n\nLet’s get to the math.\n\nThe value function,\
    \ as we talked about, takes in one argument, the state. So we denote it as `V(s)`.\n\
    \nIt’s the expected value of all future rewards, given that the current state\
    \ is `s`. Or in other words, the average value of all possible future rewards,\
    \ given that the current state is `s`.\n\n`V(s) = E[all future rewards | s]`\n\
    \nPretty simple. \n\nWe’ll define the concept of value more rigorously in a later\
    \ section.\n\n---\n\nNow let’s look at a generic algorithm we can use to find\
    \ the value function.\n"
  trans: '

    想象这样一个场景。


    你正在考虑为明天的考试复习。但你更想和朋友一起出去玩。


    你的朋友会让你感到快乐，对你来说这就是一种奖励。你会获得多巴胺的刺激。


    如果你今晚学习，你会感到疲惫和无聊，也许你的多巴胺会减少，所以这某种程度上是一种负奖励。


    那么，我们为什么要为了考试学习呢？


    因为我们不仅考虑即时奖励，还会根据未来奖励制定行动计划。


    如果你学习，你的考试就会考好，获得好成绩，并找到一份薪水不错的工作。


    所以，我们想要为这种状态：你留在家里为考试学习分配一些价值。


    我们称之为**价值函数（value function）**，这就是我们在这一节要讨论的内容。


    ---


    现在让我们反过来来考虑这个问题。


    你获得了一个奖励，比方说是被录入了梦想中的工作。


    现在，如果你回顾自己在职业生涯和学校期间所做的各种事情，你会将你的成功归功于什么？


    你过去的哪种状态导致了你今天获得了梦想中的工作？


    **归因分配问题（credit assignment problem）**是指解决以下问题：


    你过去的哪种行为导致了你现在收到的奖励？


    ---


    归因分配问题也出现在在线广告中，但形式略有不同。在在线广告中这被称为“归因（attribution）”。


    其核心是，如果用户最终转化并购买了你的产品，在不同的广告展示中，谁应该得功？


    分配功劳有各种方案，比如线性分配。


    但你可以看到，对我们来说这是一个更深层次的问题。也许用户只看了前 9 次广告，在第 10 次时才购买。所以从这个意义上说，第 10 次广告应该得功。


    在强化学习中，我们关注的是整个状态序列以及该序列是如何导致最终奖励的。


    延迟奖励（Delayed Rewards）


    与归因分配问题密切相关的是“延迟奖励”的概念。


    请记住，这些只是描述同一种问题的不同方式，而且解决方案也是一样的。


    延迟奖励是从另一个角度来看问题的。


    在归因分配中，我们回顾过去：做了什么导致了我们现在收到的奖励？


    在延迟奖励中，我们问：我正在做的动作与未来可能收到的奖励有什么关系？


    延迟奖励的想法告诉我们，AI 需要具备预见未来的能力，即“规划”。


    ---


    想象这样一个场景。你处于状态 `A`，这是游戏的最后状态。只有两个可能的后续状态：`B` 或 `C`，它们都是终止状态。


    ```

    oA

    0.5 / 0.5

    / \

    oB oC

    R=1 R=0

    ```


    B 给你奖励 1，而 C 给你奖励 0。你有 50% 的概率进入其中一个状态，因为你的智能体还不知道哪一个最好。


    我们可以把状态 `B` 的价值看作 1，状态 `C` 的价值看作 0。


    状态 `A` 的价值是多少？


    我们可以将其看作 0.5，因为你有 50% 的机会进入终止状态。


    ---


    假设你处于状态 `A`，状态 `A` 只能到达状态 `B`，没有其他可能的后续状态。


    如果 B 给你奖励 1，那么 `A` 的价值也应该是 1，因为唯一能到达的地方是奖励为 1 的 B。


    ```

    oA

    1 / 0

    / \

    oB oC

    R=1 R=0

    ```


    因此，这个价值告诉我们一个状态的“未来好程度”。


    ---


    为了更正式一点，我们实际上将这种价值称为**价值函数（value function）**。


    它是我们可能获得的未来奖励的衡量。


    我认为“价值（value）”这个词很糟糕，因为它非常模糊，但它是强化学习术语的一部分。


    ---


    奖励和价值是混合在一起的。区别在于，状态的价值是处于该状态后可能获得的未来奖励的衡量。


    奖励是即时的。即跳过障碍会立即增加你的分数。


    站在障碍面前不会增加你的分数，因此不会产生任何奖励。然而，处于这个状态是有价值的，因为我们可以很快跳过去并在未来获得奖励。


    ---


    所以，在障碍附近准备跳可能比站在障碍边缘具有更高的价值。因此，我们根据下一个状态的价值来选择动作，而不是进入该状态所获得的奖励。


    奖励是主要目标，但我们无法用奖励来告诉我们状态有多好，因为它没有告诉我们任何关于未来的信息。


    ---


    思考价值函数的一种方式是，它是一种快速或高效的方法，用来确定处于某个状态“有多好”，而不需要搜索整个游戏树。


    你可以尝试列举游戏中每一个可能的状态转换并确定所有的状态转换概率，但你可以想象这将是一项耗时的任务。


    事实上，大多数游戏在计算上是不可行的。井棋很容易处理，因为它只有 3x3 的棋盘，所以状态数约为 `3⁹ = 19683`。但它随着棋盘的大小呈指数级增长。例如，如果你有一个
    4x4 的棋盘（如连棋），那么你会得到 `3¹⁶ = 4300 万。你可能已经知道指数级增长永远不是好事。搜索状态空间只在最简单的情况下可行。因此，一个仅根据当前状态就能告诉你未来表现如何的价值函数是非常有的。


    到此为止，我还没有告诉你们如何实际上找到价值函数，所以我们甚至不知道是否可行，但我们在这里说的是，如果我们拥有了它，那就是它能告诉我们的信息，它可以立即告诉我们信息，而无需创建整个游戏树和转换概率模型。


    事实上，这是一个常数时间查找，因为状态直接映射到一个值。你可能会将值存储在一个具有常数时间查找的数组中。


    顺便说一下，这个问题是“维度灾难”的另一个实例，我们在我的机器学习课程中也见过它。


    ---


    估计价值函数是强化学习中的核心任务。但请注意，并不是所有的 RL 策略都需要它。例如，遗传算法只需产生具有随机基因突变的后代，活得最长的那些将在下一代继续产生后代。所以，通过纯的演化或自然选择，我们可以培育出在游戏中变得越来越好的
    AI。


    然而，这通常不是我们强化学习所感兴趣的算法类型。


    ---


    让我们来看数学部分。


    正如我们讨论过的，价值函数接受一个参数：状态。所以我们将其标记为 `V(s)`。


    它是给定当前状态为 `s` 的情况下，所有未来奖励的期望值。换句话说，给定当前状态为 `s` 的情况下，所有可能的未来奖励的平均值。


    `V(s) = E[all future rewards | s]`


    非常简单。


    我们将在稍后的章节中更严谨地定义价值的概念。


    ---


    现在让我们来看一种可以用来找到价值函数的通用算法。

    '
