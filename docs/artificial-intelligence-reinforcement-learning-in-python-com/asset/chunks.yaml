    \ = Q(S(t),A(t))+alpha*[R(t+1) + max[a’]{ Q(S(t+1),a’) } - Q(St,At)]`\n\n`Q(s,a)\
    \ = Q(s,a) + alpha*[r+max[a’]{ Q(s’,a’) } - Q(s,a)]`\n\n所以主意是，我们不是根据 `Q` 的 `argmax`\
    \ 来实际选择 `a’`，而是根据所有动作的 `max` 来更新 `Q`。\n\n现在你的第一个想法可能是：“嗯，这不就是完全一样吗？”\n\n如果我们选择\
    \ `a’` 作为 `Q` 的 `argmax`，那么乘以 `gamma` 的项将是 `Q(s’, a’`，它是对 `a’` 取最大值。\n\n---\n\n\
    ## 这里的区别在于\n\n记住，对于 Q-Learning，它是一种离策略（off-policy）方法。\n\n`Q(s’,a’)` 可能是所有 `a’`\
    \ 的 `max`，但这并不意味着 `a’` 必须是我们的下一个动作。\n\n我们使用 `Q(s’,a’)` 的 `max` 来更新 `Q(s,a)`，即使我们最后在下一步中没有执行动作\
    \ `a’`。\n\n这表明我们遵循什么策略完全不重要。我们可以随机选择动作，并且仍然得到相同的答案。代码将证明这一点。\n\n在现实中，如果你最终确实采取了纯随机的动作，结果将是你的智能体经常表现出非最优行为，这将使得你的回合（episodes）持续时间更长。\n\
    \n正因如此，对于相同数量的回合，脚本运行的时间会更长。\n\n---\n\n所以 Q-Learning 的关键区别在于，我们使用什么策略并不重要。\n\n\
    那么合理的问题是，在什么情况下 Q-Learning 等同于 SARSA？\n\n如果你在 Q-Learning 期间使用的策略是贪婪策略（greedy policy），这意味着你总是选择\
    \ `Q` 的 `argmax`，那么你的 `Q(s’,a’)` 将对应于你采取的下一个动作。\n\n因此，在这种情况下，你既在做 SARSA，也在做 Q-Learning。\n\
    \n## 代码中的 Q-Learning\n\n在这一节中，我们将用代码实现 Q-Learning。\n\n如果你不想尝试自己写这些代码（尽管我强烈建议你这样做），课程代码库中的相关文件是\
    \ `q_learning.py`。\n\n请记住，这很大程度上与 SARSA 脚本是相同的。\n\n我们只看主循环，因为所有的相关变化都在那里。\n\n\
    ```python\n# 重复直到收敛\nt = 1.0\ndeltas = []\nfor it in xrange(10000):\n    if it\
    \ % 100 == 0:\n        t += 10e-3\n    if it % 2000 == 0:\n        print \"it:\"\
    , it\n    # 我们不是“生成”一个回合，而是在循环内\n    # 玩一个回合\n    s = (2, 0) # 状态\n    grid.set_state(s)\n\
    \    # 第一个 (s, r) 元组是我们开始的状态，且 0\n    # （因为我们没有得到奖励）仅仅是开始游戏\n    # 最后一个 (s, r)\
    \ 元组是终止状态和最终奖励\n    # 终止状态的值定义上为 0，所以我们不需要\n    # 关心更新它\n    a, _ = max_dict(Q[s])\n\
    \    biggest_change = 0\n    while not grid.game_over():\n        a = random_action(a,\
    \ eps=t) # epsilon-贪婪\n        # 随机动作也行，但较慢，因为你可能会撞墙\n        a = np.choice(ALL_POSSIBLE_ACTIONS)\n\
    \        r = grid.move(a)\n        s2 = grid.current_state()\n        # 自适应学习率\n\
    \        alpha = ALPHA / update_counts_sa[s][a]\n        update_counts_sa[s][a]\
    \ += 0.005\n        # 我们在经历回合时更新 Q(s,a)\n        old_qsa = Q[s][a]\n        #\
    \ SARSA 和 Q-Learning 的区别在于 Q-Learning\n        # 我们在更新中使用这个 max[a']{ Q(s',a')}\n\
    \        # 即使我们在下一步没有执行这个动作\n        a2, max_q_s2\n```\n"
