- raw: 'With Monte Carlo, the randomness came from the fact that each episode could
    play out in a different way.


    So the return for a state would be different if all the later state transitions
    had some randomness.


    With TD(0), we have yet another source of randomness.


    In particular, we don’t even know the return, so instead we use r + gamma\*V(s’)
    to estimate the return G.


    \---


    In this section, we learned why temporal difference learning is advantageous in
    comparison to both dynamic programming and Monte Carlo.


    Unlike dynamic programming, we do not require a model of the environment. We learn
    from experience, and we update only the states that we actually visit.


    Unlike Monte Carlo, we don’t need to wait for an episode to finish before we can
    start learning. This can be advantageous in situations where we have very long
    episodes. We can improve our performance during the episode itself, rather than
    having to wait until the next episode.


    It can even be used for continuing tasks, in which there are no episodes at all.


    ## TD(0) in Code


    In this section, we are going to implement TD(0) in code.


    If you don’t want to try to code this yourself, although I highly recommend you
    do, the relevant file in the course repo is td0\_prediction.py


    We start off with our standard imports.


    `import numpy as np`


    `import matplotlib.pyplot as plt`


    `from grid_world import standard_grid, negative_grid`


    `from iterative_policy_evaluation import print_values, print_policy`


    ` `


    `SMALL_ENOUGH = 10e-4`


    `GAMMA = 0.9`


    `ALPHA = 0.1`


    `ALL_POSSIBLE_ACTIONS = (''U'', ''D'', ''L'', ''R'')`


    We also have our usual constants, except now we also need a learning rate alpha.


    Next, we have the random\_action function. I didn’t import it from the other file
    since I wanted to put this comment in here.


    `def random_action(a, eps=0.1):`


    `# we''ll use epsilon-soft to ensure all states are visited`


    `# what happens if you don''t do this? i.e. eps=0`


    `p = np.random.random()`


    `if p < (1 - eps):`


    `return a`


    `else:`


    `return np.random.choice(ALL_POSSIBLE_ACTIONS)`


    We have the same issue with TD as we do with Monte Carlo. And that’s if we never
    visit a state, we’ll never update its value.


    So if we have a deterministic policy without any exploration, some states won’t
    have values. Which is fine if you don’t care about those values, but we want to
    add some exploration here to make it more interesting.


    \---


    Next we have the play\_game function.


    Notice how this is much simpler than the Monte Carlo version, since we don’t need
    to calculate any returns. All we need to do is return a list of states and rewards.


    Technically, we should be doing the update while we play the game, which would
    be true online learning, but I want to compartmentalize the playing of the game
    and updating the agent for clarity.


    `def play_game(grid, policy):`


    `# returns a list of states and corresponding rewards (not returns as in MC)`


    `# start at the designated start state`


    `s = (2, 0)`


    `grid.set_state(s)`


    `states_and_rewards = [(s, 0)] # list of tuples of (state, reward)`


    `while not grid.game_over():`


    `a = policy[s]`


    `a = random_action(a)`


    `r = grid.move(a)`


    `s = grid.current_state()`


    `states_and_rewards.append((s, r))`


    `return states_and_rewards`


    \---


    Next, we go to the main section.


    `if __name__ == ''__main__'':`


    `# use the standard grid again (0 for every step) so that we can compare`


    `# to iterative policy evaluation`


    `grid = standard_grid()`


    ` `


    `# print rewards`


    `print "rewards:"`


    `print_values(grid.rewards, grid)`


    ` `


    `# state -> action`


    `policy = {`


    `(2, 0): ''U'',`


    `(1, 0): ''U'',`


    `(0, 0): ''R'',`


    `(0, 1): ''R'',`


    `(0, 2): ''R'',`


    `(1, 2): ''R'',`


    `(2, 1): ''R'',`


    `(2, 2): ''R'',`


    `(2, 3): ''U'',`


    `}`


    I’m using the standard grid here, so you can compare this to our earlier scripts.
    The policy is also the same as the first policy we used.


    Note that you won’t get the same answer, since before we weren’t using epsilon-greedy.


    \---


    Next, we initialize all the values to 0.


    `V = {}`


    `states = grid.all_states()`


    `for s in states:`


    `V[s] = 0`


    After that, we have our main loop.


    `# repeat until convergence`


    `for it in xrange(1000):`


    ` `


    `# generate an episode using pi`


    `states_and_rewards = play_game(grid, policy)`


    `# the first (s, r) tuple is the state we start in and 0`


    `# (since we don''t get a reward) for simply starting the game`


    `# the last (s, r) tuple is the terminal state and the final reward`


    `# the value for the terminal state is by definition 0, so we don''t`


    `# care about updating it.`


    `for t in xrange(len(states_and_rewards) - 1):`


    `s, _ = states_and_rewards[t]`


    `s2, r = states_and_rewards[t+1]`


    `# we will update V(s) AS we experience the episode`


    `V[s] = V[s] + ALPHA*(r + GAMMA*V[s2] - V[s])`


    Note that even though we could do the update “inline” as we played the game, I
    decided not to do that since it would make the code messy, having to interleave
    the updates and the playing of the game.


    And so once we have our list of states and rewards, we loop through them and do
    the TD(0) update, which is the same equation you saw in the theory lecture.


    Finally, we print the values we found, and the policy.


    `print "values:"`


    `print_values(V, grid)`


    `print "policy:"`


    `print_policy(policy, grid)`


    Run this yourself and see what you get.


    ## SARSA Theory


    In this lecture we are going to look at how to apply the TD(0) algorithm to the
    control problem.


    By now you are probably noticing the pattern: what we’re going to do is apply
    TD(0) to policy iteration.


    In particular, we’re going to use the value iteration version where we continually
    update Q based on itself, and we’re going to do it in place, and any actions we
    take are always greedy with respect to our current estimate of Q.


    So in this section, we’re skipping the part where we do a full policy evaluation,
    and just immediately going to the more efficient form.


    \---


    Recall from the Monte Carlo section that the reason we want to use Q is because
    it allows us to choose an action based on the argmax of Q over a, whereas we can’t
    do that with V because it’s only indexed by the state.


    Since Q has the same recursive form, we can apply the same update equation as
    before.


    Q(S(t),A(t)) = Q(S(t),A(t)) + alpha\*\[R(t+1)+gama\*Q(S(t+1),A(t+1))-Q(S(t),A(t))\]


    Q(s,a) = Q(s,a) + alpha\*\[r+gamma\*Q(s’,a’)-Q(s,a)\]


    Notice that we have the same limitation as we did with Monte Carlo. Since Q is
    indexed by both state and action, we need more iterations to gather enough data
    for convergence.


    Because the update depends on knowing the entire 5-tuple (s,a,r,s’,a’), this method
    is named SARSA.


    \---


    Since SARSA requires you to know Q(s,a) for all the possible actions a, in a state
    s, so that you can accurately choose the argmax, we have the same problem as we
    did with Monte Carlo.


    Recall that the problem was, if you follow a deterministic policy, you’ll only
    ever do 1/|A| of the possible actions, which will leave most of Q undefined.


    So in order to remedy that problem, we either had to use exploring starts, OR
    a policy that allows for exploration, like epsilon-greedy.


    Since we already know exploring starts is not realistic, we are going to use epsilon-greedy.


    \---


    Let’s look at some pseudocode to solidify this idea.


    `Q(s,a) = arbitrary, Q(terminal, a) = 0`


    `for t=1..N`


    `s = start_state, a = epsilon_greedy_from(Q(s))`


    `while not game over:`


    `s’, r = do_action(a)`


    `a’ = epsilon_greedy_from(Q(s’))`


    `Q(s,a) = Q(s,a) + alpha*[r + gamma*Q(s’,a’) - Q(s,a)]`


    `s = s’, a = a’`


    First, we initialize Q arbitrarily, and 0 for any terminal state.


    Next we enter a loop.


    Inside the loop, we start a game.


    We get the first state and select the first action based on epsilon-greedy and
    the current Q. We’ll call this (s, a)


    Inside this loop, we start another loop, that ends when the episode is over.


    We do the action a, to get the next state, s’, and the reward, r.'
