    ## MC Control without ES


    In this section, we are going to continue our discussion of Monte Carlo for the
    control problem.


    Recall that one of the disadvantages of the method we just looked at, is that
    we need to use “exploring starts”.


    We talked about how that might be infeasible for any game we’re not playing in
    “God-mode”.


    For example, think of a self-driving car. It wouldn’t be possible to enumerate
    all the edge cases that the car might find itself in, and even if you could it
    would take a lot of work to put the car in those exact states.


    So in this lecture, we’re going to look at how we might use Monte Carlo for control,
    without using “exploring starts”.


    \---


    Recall what we talked about earlier in this section, that all of the techniques
    we learned about with the multi-armed bandit problem are applicable here.


    In particular, what we want to do is not follow the greedy policy, but the epsilon-greedy
    policy, or any other method that allows for more exploration.


    The modifications to the code should be fairly simple. All we need to do is remove
    the part where we do the exploring starts, and instead only start in the official
    start position.


    Then, in the portion of the code where we play the game, instead of just following
    the greedy policy, we’ll have a small probability epsilon, of doing a random action.


    \---


    It’s interesting to consider what the probability of reaching a state that is
    not part of the policy’s trajectory is.


    For a state that’s K steps away from the start state, we would need to be in exploration
    mode on each step and choose the necessary states to get to the target state.


    So in total that’s:


    p = \[ epsilon/|A(s)| \] ^ K


    You can imagine that this is a very small number, so for states that are very
    far off from the policy’s trajectory, you’ll need to do many iterations of Monte
    Carlo for the value to be accurate for those states.


    ## MC Control without ES Code


    In this section we are going to implement Monte Carlo control using epsilon-greedy,
    so that we don’t need to use exploring starts.


    If you don’t want to try to code this yourself, although I highly recommend you
    do, the relevant file in the course repo is monte\_carlo\_no\_es.py


    We start out with all the same imports as before, all the same constants as before.


    `import numpy as np`


    `import matplotlib.pyplot as plt`


    `from grid_world import standard_grid, negative_grid`


    `from iterative_policy_evaluation import print_values, print_policy`


    `from monte_carlo_es import max_dict`


    ` `


    `GAMMA = 0.9`


    `ALL_POSSIBLE_ACTIONS = (''U'', ''D'', ''L'', ''R'')`


    We have a function that chooses random actions.


    Notice how, if we’re doing epsilon-soft by definition, this function actually
    becomes much simpler to write.


    `def random_action(a, eps=0.1):`


    `# choose given a with probability 1 - eps + eps/4`


    `# choose some other a'' != a with probability eps/4`


    `p = np.random.random()`


    `# if p < (1 - eps + eps/len(ALL_POSSIBLE_ACTIONS)):`


    `# return a`


    `# else:`


    `# tmp = list(ALL_POSSIBLE_ACTIONS)`


    `# tmp.remove(a)`


    `# return np.random.choice(tmp)`


    `#`


    `# this is equivalent to the above`


    `if p < (1 - eps):`


    `return a`


    `else:`


    `return np.random.choice(ALL_POSSIBLE_ACTIONS)`


    I’ve left some comments in there if you want to look at the naive way of implementing
    it.


    \---


    Next, we have the play\_game function.


    `def play_game(grid, policy):`


    `# returns a list of states and corresponding returns`


    `# in this version we will NOT use "exploring starts" method`


    `# instead we will explore using an epsilon-soft policy`


    `s = (2, 0)`


    `grid.set_state(s)`


    `a = random_action(policy[s])`


    ` `


    `# be aware of the timing`


    `# each triple is s(t), a(t), r(t)`


    `# but r(t) results from taking action a(t-1) from s(t-1) and landing in s(t)`


    `states_actions_rewards = [(s, a, 0)]`


    `while True:`


    `r = grid.move(a)`


    `s = grid.current_state()`


    `if grid.game_over():`


    `states_actions_rewards.append((s, None, r))`


    `break`


    `else:`


    `a = random_action(policy[s]) # the next state is stochastic`


    `states_actions_rewards.append((s, a, r))`


    ` `


    `# calculate the returns by working backwards from the terminal state`


    `G = 0`


    `states_actions_returns = []`


    `first = True`


    `for s, a, r in reversed(states_actions_rewards):`


    `# the value of the terminal state is 0 by definition`


    `# we should ignore the first state we encounter`


    `# and ignore the last G, which is meaningless since it doesn''t correspond to
    any move`


    `if first:`


    `first = False`


    `else:`


    `states_actions_returns.append((s, a, G))`


    `G = r + GAMMA*G`


    `states_actions_returns.reverse() # we want it to be in order of state visited`


    `return states_actions_returns`


    Notice how we’ve taken out the exploring-starts code, and we’re now always starting
    from position (2, 0).


    Also notice the line where we add the epsilon-greedy policy, where we make use
    of the random\_action function above.


    The returns calculation is exactly the same as you would expect.


    \---


    Next, we go down to the main section.


    Notice how this is all exactly the same as before.


    `if __name__ == ''__main__'':`


    `# use the standard grid again (0 for every step) so that we can compare`


    `# to iterative policy evaluation`


    `# grid = standard_grid()`


    `# try the negative grid too, to see if agent will learn to go past the "bad spot"`


    `# in order to minimize number of steps`


    `grid = negative_grid(step_cost=-0.1)`


    ` `


    `# print rewards`


    `print "rewards:"`


    `print_values(grid.rewards, grid)`


    ` `


    `# state -> action`


    `# initialize a random policy`


    `policy = {}`


    `for s in grid.actions.keys():`


    `policy[s] = np.random.choice(ALL_POSSIBLE_ACTIONS)`


    ` `


    `# initialize Q(s,a) and returns`


    `Q = {}`


    `returns = {} # dictionary of state -> list of returns we''ve received`


    `states = grid.all_states()`


    `for s in states:`


    `if s in grid.actions: # not a terminal state`


    `Q[s] = {}`


    `for a in ALL_POSSIBLE_ACTIONS:`


    `Q[s][a] = 0`


    `returns[(s,a)] = []`


    `else:`


    `# terminal state or state we can''t otherwise get to`


    `pass`


    The only difference with this algorithm isn’t in how we do policy iteration, it’s
    in what policy we use to play the game.


    So we have the negative grid, we print the rewards, we initialize a random policy,
    and we initialize a random Q.


    Notice that we need to initialize Q to a value even though it’s not needed for
    the evaluation problem.


    This is because when we do the argmax later, we need to have values to choose
    from.


    \---


    In the main loop, we are again keeping track of the max deltas, so we can plot
    the changes as we go.


    `# repeat until convergence`


    `deltas = []`


    `for t in xrange(5000):`


    `if t % 1000 == 0:`


    `print t`


    ` `


    `# generate an episode using pi`


    `biggest_change = 0`


    `states_actions_returns = play_game(grid, policy)`


    ` `


    `# calculate Q(s,a)`


    `seen_state_action_pairs = set()`


    `for s, a, G in states_actions_returns:`


    `# check if we have already seen s`


    `# called "first-visit" MC policy evaluation`


    `sa = (s, a)`


    `if sa not in seen_state_action_pairs:`


    `old_q = Q[s][a]`


    `returns[sa].append(G)`


    `Q[s][a] = np.mean(returns[sa])`'
