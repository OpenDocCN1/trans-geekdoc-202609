    a draw, both players get 0.


    So we’ll have 2 functions which are almost the reverse of each other, initializeV\_x,
    and initializeV\_o.


    `state_winner_triples = get_state_hash_and_winner(env)`


    ` `


    `def initialV_x(env, state_winner_triples):`


    `# initialize state values as follows`


    `# if x wins, V(s) = 1`


    `# if x loses or draw, V(s) = 0`


    `# otherwise, V(s) = 0.5`


    `V = np.zeros(env.num_states)`


    `for state, winner, ended in state_winner_triples:`


    `if ended:`


    `if winner == env.x:`


    `v = 1`


    `else:`


    `v = 0`


    `else:`


    `v = 0.5`


    `V[state] = v`


    `return V`


    ` `


    ` `


    `def initialV_o(env, state_winner_triples):`


    `# this is (almost) the opposite of initial V for player x`


    `# since everywhere where x wins (1), o loses (0)`


    `# but a draw is still 0 for o`


    `V = np.zeros(env.num_states)`


    `for state, winner, ended in state_winner_triples:`


    `if ended:`


    `if winner == env.o:`


    `v = 1`


    `else:`


    `v = 0`


    `else:`


    `v = 0.5`


    `V[state] = v`


    `return V`


    \---


    Let’s summarize what we just did since that was pretty long.


    We know in order to initialize the value function for all states, we need to first
    enumerate all the states.


    We saw 2 ways of doing this, either searching the game tree, or doing permutations
    on the board.


    We saw that searching the game tree would take more steps than doing permutations
    since there’s a lot of redundancy.


    Note however they are both exponential or super-exponential so they’re both bad.


    And lastly I showed you the recursive function that we’re going to use in order
    to enumerate all the states.


    So we are slowly putting the pieces together for our tic-tac-toe game. As you
    can see many of the pieces are non-trivial.


    ## The Environment


    In this lecture we are going to take an in-depth look at the environment class.


    Remember that the environment is the thing that the agent interacts with.


    Let’s start with an overview of all the methods we’re going to look at:


    There’s the constructor, where we initialize important instance variables.


    There’s is\_empty(i, j) which tells us if a location on the board is empty or
    not.


    There’s reward(symbol) which gives us back a reward when we pass it the symbol
    representing a specific player.


    There’s get\_state() which we looked at earlier, it takes the state of the board
    and returns a number.


    There’s game\_over(), which checks if the game is over or not by looking at the
    state of the game, and returns true or false.


    And there’s draw\_board(), which draws the current tic-tac-toe board. You can
    imagine that this would be pretty pointless if we could not see the tic-tac-toe
    board.


    \---


    Let’s start with the constructor since this will introduce is to all of the instance
    variables we’re interested in.


    `class Environment:`


    `def __init__(self):`


    `self.board = np.zeros((LENGTH, LENGTH))`


    `self.x = -1 # represents an x on the board, player 1`


    `self.o = 1 # represents an o on the board, player 2`


    `self.winner = None`


    `self.ended = False`


    `self.num_states = 3**(LENGTH*LENGTH)`


    The first instance variable is the board, which is a square. We initialize it
    as 0s because 0 is going to be our symbol for empty.


    Next we define the symbols for X and O. Note that these all have to be numbers
    since we’re going to store them in a Numpy array. You’ll see why assigning them
    to +1 and -1 is convenient for us later on.


    Next we have the winner, which we initialize to None. None means there is no winner,
    or that there is no winner yet . Once we do have a winner, we’ll assign this to
    either +1 or -1.


    Next we have a boolean variable “ended”. This is obviously going to start out
    as false, and will only become true at the end of a game.


    Lastly we have a variable called num\_states which is just a convenience thing
    so we don’t have to write 3^(LENGTHxLENGTH) everywhere.


    \---


    Next we have the is\_empty function, which takes in 2 arguments which represent
    a position on the board.


    `def is_empty(self, i, j):`


    `return self.board[i,j] == 0`


    This is a useful function for the agent because the agent needs to check if a
    location is valid before trying to put one of its own pieces there. So this returns
    true if that position on the board is 0, and false otherwise.


