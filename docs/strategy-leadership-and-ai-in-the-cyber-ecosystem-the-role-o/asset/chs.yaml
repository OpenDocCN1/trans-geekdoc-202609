  \n## 2: 区块链\n\n区块链是一种去中心化的分布式数据库技术，最初出现在 2008 年比特币加密货币推出时。数据结构被共享以形成一种被称为共享账本的分布式数据结构。分布式账本包含了每笔历史交易的细节，区块链中的基本单元被称为“区块”；典型的区块结构参见图\
  \ 6。一个区块可以被理解为一份个人银行流水。\n\n![Fig. 6]\n\n图 6 区块结构。\n\n区块链技术包含一系列以加密方式安全链接的区块，区块的顺序由一种隐式时间戳机制控制，除非所有后续区块都被修改，否则区块无法被更改。区块的这种时间顺序使用加密哈希值，可以防止账本被篡改，尽管由于封闭环境中可能发生的干预，在私有区块链环境中无法保证抗篡改性。\n\
  \nFig 7 展示了区块结构过程，其中区块 `N` 持续通信并包含区块 `N`。\n\n![Fig 7]\n\n图 7 区块结构。\n\n## 2.1: 共识\n\
  \n所有的区块链网络都需要共识机制来对账本状态达成一致。目前使用的共识算法有几种：\n\n### 工作量证明 (PoW)\nPoW 要求矿工解决复杂的数学难题以获得添加区块的权利。这个过程是耗能的，但提供了高安全性。\n\
  \n### 权益证明 (PoS)\nPoS 根据验证者持有的代币数量和愿意质押的数量来选择验证者。它比 PoW 更节能。\n\n### 比尔庭容错 (BFT)\n\
  BFT 是一种用于分布式系统的共识机制，即使在某些节点故障或存在恶意的情况下也能达成一致。\n\n### 委托权益证明 (DPoS)\nDPoS 是 PoS 的变体，代币持有者投票选出代表，由代表代表他们执行共识。\n\
  \n## 2.2: 区块链类型\n\n区块链网络通常根据其访问和控制级别进行分类：\n\n### 公有区块链\n公有区块链向任何人开放加入、读取和写入。它们高度去中心化，但速度较慢。\n\
  \n### 联盟区块链\n联盟区块链由一组组织管理，而非单一实体。它们提供了比公有区块链更高的效率。\n\n### 私有区块链\n私有区块链由单一组织控制。访问受到限制，使得它们速度非常快，但去中心化程度较低。\n\
  \n\n\n\n\n私有和公共区块链（BC）生成形成交易链的标记，使得区块链在分布式网络中处理双重花费问题成为可能。这种链式结构通过防止网络内的非法修改来确保安全性，并由于所有成员之间的数据透明性，可以轻松检测到区块的篡改。诸如\
  \ `PoW` 等验证机制的使用仅接受一个历史交易，使得篡改哈希链变得不可能；这使得区块链能够采纳并验证数字数据。网络中的每个成员都包含所有通信数据的副本，从而消除了任何单点故障，确保了区块链的可靠性。\n\
  \n## 2.4: 分布式账本上的身份管理\n\n比特币一直是区块链技术的主导应用，尽管该领域正在被探索并扩展到其他领域，例如医疗保健、保险以及政府和私营机构的数字身份（DI）管理。\n\
  \n对终端用户、服务提供者（RPs）和身份提供者（IdPs）的调查调查可以通过支持管理身份的分布式信任模型来建立彼此之间的信任，发展中国家的人可以通过金融包容、资产所有和识别身份的能力获得赋权。\n\
  \n### 2.4.1: 去中心化和自主主权环境\n\n基于区块链的身份管理（IdM）分为两类，即自主主权身份（SSI）和去中心化信任身份框架。\n\nSSI\
  \ 管理系统是以用户为中心的，因为它们赋予了个人完全拥有和管理其数字身份的权利；可验证声明是这一概念的核心，因为 `RPs` 取决于所展示的内容。SSI 不依赖于任何第三方管理机构，因此与大多数依赖于\
  \ Facebook 和 Google 等大型 `IdPs` 的 IdM 系统不同，身份无法从控制个体手中被移除。\n\n图 9 展示了 SSI 系统中各种参与者之间的关系。\n\
