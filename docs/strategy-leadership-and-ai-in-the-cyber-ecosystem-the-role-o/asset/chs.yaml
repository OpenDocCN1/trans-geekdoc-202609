  \n## 2: 追踪与定向广告\n\n\n\n\n一个人的行为产生了许多数据签名，并可以通过被称为“跟踪”的方式进行汇总。对于访问者来说这很常见，但许多人可能没有意识到\
  \ Cookie 会充当木马并通过其他方式导致更多数据提取。\n\n## 2 在线追踪\n\n当个人搜索网络时，追踪器会收集有关个人的信息。脚本和跟踪像素被植入网页中，向服务器更新如浏览历史等内容，这些内容随后通过\
  \ Cookie 或用户的唯一标识符进行匹配或指纹识别，即使使用户关闭了 Cookie。跟踪像素隐藏在网页或电子邮件中，用于衡量访问网页的人数、广告以及允许用户在社交媒体上互动（如实时聊天和嵌入评论）。6000\
  \ 个热门网站每页有超过 10 个跟踪。发现 Google 和 Facebook 拥有最高的追踪份额并不意外。Google 位于 81% 的网络流量中，而 27%\
  \ 的网络使用 Facebook 跟踪像素。图 4 显示了追踪份额（\n\n![图 4 追踪份额。](img/f17-04-978012821428.jpg)\n\
  \n图 4 追踪份额。\n\n## 2.2 广告竞价技术\n\n过去几年技术取得了巨大的进步，企业（在数据经纪的帮助下）能够根据用户的位置、赞、偏好、浏览历史等发送定向广告。这些数据点的追踪来自\
  \ Facebook 按钮、嵌入 YouTube 视频以及普通的追踪 Cookie。许多广告基于实时在线拍卖，当用户访问网站时，包含用户关键信息的元数据会被送到平台，出价最高的广告商获得向个人发送广告的权利。Google\
  \ 已成为数字广告领域的领导者，在 2017 年广告销售额超过 738 亿美元，占全球 2237 亿美元数字广告收入的 33%。Facebook 在同年位列第二，收益了\
  \ 360 亿美元。\n\n## 2.3 行为广告\n\n行为广告是指个人被不断追踪，根据其网络浏览历史、网络搜索和一般的在线行为向用户投放广告。许多人会在自己的\
  \ Facebook 页面上看到与其最近搜索的物品类似的广告。这已变得如此复杂，以至于 mParticle\n\n## 2.4 物联网与智能设备\n\n物联网（IoT）设备正变得越来越主流，尽管这些设备具有家庭自动化在内的好处，但\
  \ IoT 存在巨大的隐私风险，因为大量的个人信息经常被以未加密的形式通过互联网发送到多个领域。随着连接设备数量和种类的增加，保护消费者的隐私变得越来越困难。由于连接性和缺乏安全性，这些设备容易受到当今企业计算机所面临的网络攻击。许多设备感染了如\
  \ Mirai 僵尸网络之类的恶意软件，这些软件可用于分布式拒绝服务（DDoS）攻击以干扰大型企业和政府。已经出现了智能设备成为刑事调查关键环节的案例，例如当警察询问一名男子杀害其妻子时，该男人的\
  \ Fitbit 位置与他的不在场证明不符（\n\n## 3 位置追踪\n\n总部位于英国的安全业务公司 Pen Test Partners 最近在交友应用 3Fun\
