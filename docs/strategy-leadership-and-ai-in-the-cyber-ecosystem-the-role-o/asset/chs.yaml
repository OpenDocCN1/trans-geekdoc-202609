  ## 2.5: 用例\n\n区块链主要用于金融服务，`Bitcoin` 一直是主应用，尽管该领域正在被探索并扩展到其他领域，例如医疗保健、保险以及政府和私营机构的数字身份管理。\n\
  \n区块链用于通过 `DLT` 提供身份。网络中的每个成员都包含所有通信数据的副本，从而消除了任何单点故障，确保了区块链的可靠性。\n\n## 3: 威胁模型\n\
