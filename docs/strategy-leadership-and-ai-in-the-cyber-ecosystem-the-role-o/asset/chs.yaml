  \ [访问日期：2018 年 11 月 18 日]。\n\n## 案例研究概述\n\n在案例研究二中，我们看到了向约旦的叙利亚难民提供高效粮食援助。`Blockchain`\
  \ 有助于减少从捐助者处转账资金时产生的成本，从而利用剩余资金增加供应。在早前的节文中，我们看到数字身份如何通过可访问的数字钱包为难民就业、银行服务和移民验证提供便利。一个未报告的挑战是难民身份的隐私和保护。正如引言中所述的：“这是一个巨大的成功（……）它减少了共享难民数据的成本和风险，同时提高了世界粮食计划组织（WFP）的控制力、灵活性问责制。现在如果我们接到电话说晚上有\
  \ 20,000 人进来，我们可以在早上为他们准备好一切，”他说，“旧方法需要两周时间并且需要纸质券”——世界粮食计划组织约旦援助项目联合国执行官员。\n\n\
  案例研究三探讨了教育援助的交付。该项目旨在跟踪南非儿童的学校出勤情况。捐助者能够通过父母、卫生工作人员、教师和政府的点对日志获取影响证明，并看到他们面临的挑战——这可以为官方国家数据分析得出儿童社会经济地位的准确数据。\n\
  \n案例研究四关注了在健康领域利用 `blockchain` 在坦桑尼亚识别、验证和交付产产保健服务，那里孕妇常因可预防的产产并发症去世。在这里，女性透明地获得了医疗权益，员工可以轻松管理预约，提供产前和产后护理以及儿童接种。尽管这个试点案例是成功的，但可能面临某些女性无法获得服务的挑战。\n\
  \n## 3.3：有效性与相关性\n\n后续章节批判性地讨论了案例研究中出现的新主题，关键主题包括援助有效性、`technology`。\n\n### 3.3.1：主题\
  \ 1：发展有效性\n\n这项研究显示了对援助有效性的高度认可。在早前的章节中，我们看到援助有效性受到宏观和微观问题的限制。证据证明，例如在发展援助中，约 30%\
  \ 的援助资金未到达目标。\n\n在透明度方面，这项研究发现援助的显著性源于。正如案例研究所示，`blockchain` 被识别受助者并直接发放资金。\n\n\
  ### 3.3.2：主题 2：适用性\n\n为了确定 `cryptocurrency` 和 `smart contracts` 在发展援助中的可行性，`technology`\
  \ 这一主题提供了确定性。受访者普遍认同 `smart contracts` 能够促进援助有效性的实现，这可以解释为它需要工作证明（proof of work），在此基础上才能自动触发支付。根据本研究的发现，`Smart\
  \ contracts` 管理规模和需求。然而，某些受访者对其扩展性缺乏信心，可能是因为该技术仍处于起步阶段，并且人们对谁来决定执行合同协议的算法交易以及是否所有利益相关者都确实包含在内存在疑问。\n\
  \n## 4：概念框架的构建：区块链与发展援助的协同\n\n为了帮助可视化 `blockchain` 在发展援助中的下一代应用，图 2 中展示了一个名为“区块链赋能的发展援助”概念框架的四位一体建议。它代表了发展援助从捐助者到受益者的透明流动，这种流动是通过\
  \ `smart contracts` 和 `cryptocurrencies` 实现的的人道主义援助物流可以通过与合作伙伴和服务提供商的 `smart contracts`\
  \ 高效处理，从而监控供应链管理。\n\n\n\n\n\n1. 在处理巨额捐赠资金和数百万援助受益者时，`blockchain` 在互操作性方面的`scalability`（扩展性），\n\
  2. 对于贫贫和文盲的人来说，`cryptographic tools` 的`usability`（可用性）是一个挑战，\n3. `big data` 和 `digital\
  \ migration` 监管政策方面的`structural functionalism`（结构功能主义），\n4. 遵守人道主义行为准则并维护无权弱势群体的安全、`privacy`和尊严的`ethical\
  \ operations`（道德运营）。\n\n基于前面的批判性和描述性讨论，发展援助部门可以依靠`blockchain` 进行评估和监控，以实现最终的问责和透明度。`blockchain`\
  \ 和 `smart contracts` 在`health` 和 `education` 等其他领域的成果应作为支柱，促进`blockchain` 在发展援助以及\
  \ `UN` 等主要机构中的潜力。与任何类似系统一样，问题在于它是会将 `digital identification` 和 `networked system`的所有权交到所代表的人手中，还是会成为公司和国家控制人类`digital\
  \ existence` 的更方便手段。根据后文中建议的概念框架并对终端用户进行充分教育，这些对`blockchain`的恐惧不太可能实现。\n\n## 5 结论\n\
  \n本章概述了当前的发展援助合同模型以及监控与评估工具，以确定`blockchain`在尊重`privacy`的同时以透明安全的方式提供发展援助的可行性。结果清楚表明，总体而言，当前和传统的模型在发展援助及其潜在的腐败和滥用问题上一直是无效的。一些关键发现显示，发展援助中现有的监控和评估工具非常薄弱，援助项目大多未能实现项目成果，官方援助数据不准确且不充分，受益者没有参与决策过程。`blockchain`凭借其属性和一些经过证明的能力，最终可以解决这些传统问题，并使发展援助部门实现\
  \ `SDGs`。\n\n本研究得出的明确结论是，`smart contracts` 和`blockchain` 在发展援助中是可行的，但在接收国面临采用挑战，因为这些国家不愿意让`cryptocurrency\
  \ transactions`合法化，运营成本高，且缺乏市场、关键基础设施和`Internet connectivity`。然而，本文和其他学术著作已描述过，捐赠者看好`blockchain`\
  \ 透明提供援助的潜力。调查结果的启示显示，援助人员对在该部门部署`blockchain`表现出巨大的兴趣。这是因为这将允许援助的可追溯性、基于证据的循环资金发放、高效交付以及物资的追踪；让受益者获得援助数据和资金；并通过`smart\
  \ contracts` 确保透明度和问责制。\n\n这项研究引发了关于发展援助中`digital data`未来的重要问题。在变革性技术和`big data\
  \ revolutions`时代，围绕`data safety`、保护弱势群体以及维护人道主义原则的道德问题不断出现，因为这可能被解释为对无权绝望的人群进行实验。对于违反`privacy`\
  \ 和 `GDPR` 时谁负责，尚没有说明。\n\n本研究得出的结论是，`blockchain` 和`smart contracts` 跳过了中心化的权力中心，意味着发展援助具有更高的透明度和完整性。它扩展了我们对`blockchain`\
  \ 在发展援助中可行性的认知，并有助于我们理解前述提到的挑战其应用的问题。根据发展援助部门的一般运营原则，该研究质疑了`blockchain` 在公司利益之前优先保护和服务受益者需求的道德能力。`blockchains`\
  \ 特性的潜力是存在的，尽管无法撤销不可变交易等担忧引发了人们对于人类是否会有自由完全无痕地删除自己的疑虑。随着数百万援助受益者在未来获得`digital identities`，对于滥用匿名来操纵数据、攻击系统或进行欺诈的可能性尚缺乏明确。此外，目前发展援助运营中的`blockchain\
  \ platforms` 要么是试点，小规模，对于它们可以承受的最大利益相关者数量或交易量一无所知；因此，这提出了扩展性问题。然而，如果采用`AI technologies`\
  \ 并连接到`smart governments`，它们可以增强`smart contracts` 和`blockchain` 的功能和智能性。\n\n## 参考文献\n\
  \n## 6 一种基于 OKR 的 GDPR 时代网络有效服务建议框架\n\nDavid Wilson; Hamid Jahankhani - 英国伦敦诺森布利亚大学\n\
  \n## 摘要\n\n本章将关注以下领域：`GDPR`、`data breaches`、`digital identity theft` 和 `digital\
  \ identity schemes`。本章将详细探讨每个主题，然后检查这四者的相关性，其中网络安全被认为是共同因素。虽然对每个主题都有许多孤立的研究，但本研究提供了首次在\
  \ `GDPR` 之后将这四者关联的独特机会。\n\n此外，本研究旨在理解在这个时代提供服务的组织的`cybersecurity controls` 的有效性，通过调查将专业人士对\
  \ `GDPR compliance` 和良好网络安全实践的态度联系起来。该研究旨在通过引入 `OKR framework` 在 `GDPR era` 实现有效的网络防御，从而影响执行委员会关于网络防御投资支出的投资决策。\n\
  \n### 关键词\n\n`GDPR`；`Digital identity theft`；`Data breaches`；`Cybersecurity`；`Federation`；`OKR\
  \ framework`\n\n## 1 通用数据保护条例和数据破坏\n\n`GDPR` 于 2018 年 5 月生效，是 `EU Protection Directive\
  \ (95/46/EC)` 的后续法律。\n\n`GDPR` 的主要缺点是其长度和复杂性：99 条详细规定。`GDPR` 是否真的能提高公平性和对基本权利尊重，显然只有在它适用一段时间后才能评估。\n\
  \n整个欧洲的机构必须在较短的时间内实施这些规定，将流程嵌入到并不匹配的组织结构中。这导致了法律实施方面的冲突和隐藏成本。\n\n自从 `GDPR` 法规诞生以来已过去一年，各地的评论人士已经能够查看数据并对新法规的表现进行评论。\n\
