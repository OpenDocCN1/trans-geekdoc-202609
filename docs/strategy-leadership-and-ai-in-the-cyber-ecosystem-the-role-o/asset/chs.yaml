  \ 目睹了违规者 `Y` 闯灯。`DW H` 也目睹了违规者 `Y` 的同一行为，并在其防篡存储设备中记录并加密了 `DE`。两组 `DE` 都被传输给了托管人\
  \ `DW J2`，随后通过 `DCoC-IoT` 过程将 `DE` 传输给 `OCP 1`。所有的 `DE` 都根据其披露的属性追溯到了 `DWs`。\n\n\
  #### 3.12.2: 违规行为 2\n\n`Fig. 20` 包含了记录的违规行为，`DW K` 目睹了违规者 `Z` 超速。`DE` 在 `DW J2`\
  \ 的防篡存储设备中记录并加密，由于其在 `OCP 1` 上拥有特权，它通过 `DCoC-IoT` 过程传输了 `DE`。所有的 `DE` 都根据其披露的属性追溯到了\
  \ `DW`。\n\n## 4: 结论与未来工作\n\n本章分析了提出的各种替代方案以对 `DW` 进行匿名处理。`BC-type` 选择是基于联盟的，因为它允许许多预选机构以无偏的方式验证交易，且验证者由信任网进行管理。共识方法符合环保的可持续性目标，因为与其他共识协议相比，它是轻量级的，并减少了能量需求。\n\
  \n基于自主权的 IdM 符合用户对隐私的关注，因为它通过使用 `DIDs` 让 `DW` 所有者控制自己的属性和声明。零知识证明的使用为 `DW` 和 `DW`\
  \ 生态系统提供了关于身份背后真实身份的保证。用户身份数据没有存储在去中心化账本上，而是由用户将所有细节安全地存储在个人设备上。这允许用户符合 `GDPR` 法，即用户拥有被遗忘权。与丢失了百万用户凭据的中心化第三方供应商相比，在去中心化的自主环境中，大规模身份盗窃的风险将在很大程度上得到缓解。\n\
  \n使用 `DIDs` 实现了匿名性，但在 `DW` 生态系统中使用时，由于无法追溯到目击者，`DE` 在法庭上可能不可采；然而，如果 `DW` 披露身份，关联是可能的。`DIDs`\
  \ 的使用也可以用于非人类标识符，将 `DWs` 的概念从人类扩展到非人类方法可能是可能的。\n\n未来的研究可能使智能道路基础设施充当 `DWs`，有助于治理交通和车辆相关的违规行为。在非人类环境中使用\
  \ `DWs` 的挑战在于如何确定将哪些独特特征绑定到目击基础设施，就像人类生物识别具有独特特征一样。`DW` 的愿景仅是概念性的，但关于法律框架如何适应司法体系内数字匿名性的进一步研究可能有助于\
  \ `DW` 的现实实现。\n\n## 参考文献\n\n# 9: 零信任网络：概念、策略与现实\n\nDavid Allan Eric Haddon ^伦敦帝国学院，英国，伦敦\n\
  \n## 摘要\n\n几十年来，防火墙通过在网络边界限制和检查流量来保护网络免受攻击。随着云计算的发展和对网络访问需求的增加，网络边界已经扩大。不仅邮箱在云端托管，虚拟桌面也是如此。以前需要防火墙异常的应用程序现在需要验证订阅并允许更新。用户必须根据需要传输数据到在线门户和报告服务，防火墙需要越来越多的自定义端口。更新防火墙配置曾是稀有事件，现在已不再如此。除了外部威胁、恶意软件和毒性链接外，恶意和粗心的内部人员在内部网络中活动，导致公司网络不再被认为是安全的。\n\
  \n2019 年 3 月在 RSA 大会上，微软安全架构师 Matt Soseman 宣布未来是零信任环境，物理防火墙将过时（\n\n网络安全多年来一直在演变，以增强内部内部的安全性，这在\
  \ `PCI-DSS`、`ISO 27001:2013` 和 `NIST` 中都有体现。随着通信越来越多采用端到端加密，防火墙因流量流量变得日益困难。网络边界变得模糊，需要新方法。这就是零信任概念的基础。\n\
  \n### 关键词\n\n零信任；BeyondCorp；Carta；CASB；防火墙；重新认证\n\n## 1: 引言\n\n当微软安全架构师 Matt Soseman\
  \ 宣布防火墙不再需要时（\n\n2019 年 4 月在该公告之后，微软宣布他们将从 Windows 10 中删除基本密码过期策略。这一发展方向可能显得鲁莽，意味着微软正在迎合那些讨厌\
  \ IT 人员的用户——这些人员通过防火墙、网络代理和电子邮件过滤器阻止网站和邮件，并通过强制更改密码来挫扰用户。用户是王，安全带来的任何轻微不便都会被视为麻烦和障碍。用户需要安全，但他们希望安全是非干扰的。假阳、隔离、无法投递、不可用和未找到等词已不再被接受，但与此同时，如果垃圾邮件进入了，人们又会解释为什么被允许进入。\n\
  \n\n\n\n\n尽管微软的声明似乎有些轻率，但不可否认，微软在安全如何演变方面投入了大量思考。微软通过许多技术看到了未来，如 `Windows Hello`、生物识别认证、人脸识别，以及利用\
  \ `Azure AD Conditional Access Policies` 结合人工智能检查用户和物理异常，并根据需要限制访问。AI 长期以来用于卡片支付系统，在这些系统中，可疑交易会触发远程办公人员进行调查。未来的网络认证系统（如\
  \ `Azure AD Conditional Access`）已经在追求这种方法。更进一步说，\n\n世界是数字化的，银行系统已在线化，税收和国家保险的提交现在只接受数字格式。验证谁、使用什么设备以及从何种位置连接到服务，对于减少欺诈至关重要。\n\
  \n本章将尝试协调 Forrester Research 等机构的最新研究概念，并讨论零信任（Zero Trust）框架的理念。\n\n## 2: 什么是零信任？\n\
  \n零信任模型最初由 Forrester Research 的 John Kindervag 在 2010 年提出。\n\n零信任的概念始于一个前提：一切一切都是不可信的。\n\
  \n不负责客户端内部网络的云服务提供者可能会主张边界防火墙和代理服务器不再需要。这是基于所有数据都安全地存储在云端，且防火墙会干扰访问的假设。但这种想法是天真的，因为安装在远程工作站上的恶意键盘记录器可以捕捉密码和其他信息，这些信息随后可能被用来破坏云服务。\n\
  \n零信任方法的关键要素是将内部网络视为与互联网同等程度的不可信状态。\n\n当某些数据存储在内部网络时，该模型建议根据区域要保护的资产将网络划分为区域，这意味着区域之间的流量应该由防火墙控制！\n\
  \n某些概念并非新鲜；在 `ISO27001` 中推崇的古老“最小权限访问”做法就是微隔离（microsegregation）的例子，而这也是零信任的一个原则。\n\
  \n## 3: 零信任网络的关键原则有哪些？\n\n零信任网络的五个核心概念如下：\n\n1. 始终假设网络是敌意的。\n2. 外部和内部威胁始终存在于网络中。\n\
  3. 网络位置不足以判断对网络的信任度。\n4. 每一个设备、用户和网络流都经过认证和授权。\n5. 策略必须是动态的，并尽可能从多个数据源中计算。\n\nJohn\
  \ Kindervag 包含的两个重要元素是：\n\n1. `MCAP`——“微核心与边界”。这是关于网络的微隔离。连接到接口的每个交换区域被称为微核心交换机。一个物理接口可能支持多个\
  \ `MCAPs`。尽管 Kindervag 推广网络分段的概念，但必须记住没有信任的网络段。其理由是，分段允许在必要时通过软件隔离网络段。\n2. `DAN`——“数据采集网络”。这涉及到流量流的网络可见性。监控网络流量意味着能够访问所有\
  \ `MCAPs` 上的流量，这需要作为实施策略的一部分进行规划。\n\n这两个目标 `MCAPS` 和 `DANS` 显然略有冲突，因为随着网络被隔离，提供更高的可见性会变得棘手。\n\
  \n## 4: 零信任概念有变体吗？\n\n零信任模型也有其他名称。这是因为零信任是一个非常通的概念；在实施零信任时，必须做出选择并以一致的方式执行。谷歌的 `BeyondCorp`\
  \ 和思科的 `Trusted Access` (`CTA`) 策略是基于谷歌和思科各自选择的策略的不同方法。\n\nGartner 将其模型称为持续自适应风险与信任评估\
  \ (`CARTA`)。这些概念关注的是软件定义边界，而非物理边界。\n\n微软的零信任模型围绕 `Azure conditional access policies`\
  \ 和 `Microsoft Intune` 展开，后者验证连接的设备并验证设备补丁状态。\n\n`sign-in risk policy`（登录风险策略）是一种条件访问策略，可以根据分配给连接的风险级别进行配置。\n\
  \n`user risk policy`（用户风险策略）是一种条件访问策略，可以根据人员被遭到攻击的概率进行配置。\n\n从 `Windows 2012R2`\
  \ 开始，存储在文件共享上的数据可以被加密以保护过程中的数据。\n\n`Cisco Trusted Access`:\n\n1. workforce—工作区—验证用户\n\
  2. workplace—工作场所—验证合规设备\n3. workload—负载—验证应用行为\n\n这可能是一种更简单的方法，但尽管与 John Kindervag\
  \ 的概念主题一致。\n\n`BeyondCorp` 是谷歌为其自己的网络定义的零信任模型。\n\n谷歌使用的所有应用程序都要求通过 `Access Proxy`\
  \ 运行。`BeyondCorp` 计划检查并鉴定了所有应用程序。\n\n这里的点是，谷歌已确保组织使用的所有应用程序都与 `BeyondCorp` 模型兼容。`Access\
  \ Proxy` 的另一个例子是 `Citrix Netscaler`，它广泛用于远程访问。在 `Citrix` 中，一旦远程用户通过验证，将授予通过 `TLS`\
  \ 隧道的访问。\n\n## 5: 让我们检查零信任的核心概念？\n\n零信任概念 1——网络始终被假设为敌意的。假设攻击者已经在网络内部。如果攻击者无法作为用户或使用恶意设备通过认证，那么即使攻击者连接到内部网络，也不存在其可以截获的流量。\n\
  \n零信任概念 2——外部和内部威胁始终存在于网络中。这一论点部分是因为许多攻击涉及内部人员——参见图. 1。每一个设备、用户和网络流都应该经过认证、授权并持续持续重新认证。在零信任中，安全性基于认证和授权，而非网络位置。\n\
  \n![图. 1 网络边界的模糊化。](img/f09-01-9780128214428.jpg)\n\n图 1 网络边界的模糊化。\n\n零信任概念 3——网络位置不是判断对网络信任的足够理由。不再存在受信任和不可信的网络之分。仅仅因为机器在内部网络中，并不是信任它的有效理由。“在网络的一部分隐藏信息而在另一部分不隐藏，表明一个比另一个更受信任”。\n\
  \n零信任概念 4——每一个设备、用户和网络流都经过认证和授权。所有网络流量在经过授权、检查和安全化之前都是潜在的威胁。零信任的关键在于持续验证用户和设备的原则。\n\
  \n零信任概念 5——策略必须是动态的，并尽可能从多个数据源中计算。因为网络连接是动态的，保护网络的策略也必须是动态的。这就是 AI 和异常检测可以利用来自 `Darktrace`、`Cognito`、`SIEM`\
  \ 解决方案或 `Microsoft Cloud App Security` 等系统的威胁信息的地方。\n\n\n\n\n\n# 零信任概念 6—网络微隔离\n\
  \n`VLANs` 一直是隔离网络的常用方法，但由于一个 VLAN 中的连接在理论上可以监控通过另一个 VLAN 发出的流量（因为数据是通过同一根电缆传输的），此外，`VLANs`\
  \ 之间的路由通常是开放的；因此，除了将不同的设备推入较小的广播网络之外，`VLANs` 对安全的贡献很小。微隔离在软件定义网络（`SDNs`）更为常见，那里存在更复杂的管理工具。在零信任中，安全始于数据和服务所在的位置，并从那里延伸到客户端。\n\
  \n# 零信任概念 7—网络可见性与零信任监控解决方案\n\n零信任网络的基本原则之一是对网络上的一切具有完全的可见性。对设备、IP 地址、使用的协议、开放端口以及网络内部和外部的数据流进行监控，并能够对异常进行报警，是保护零信任网络的基本原则。\n\
  \n## 6：哪些产品可以协助零信任网络监控？\n\n可见性是防御任何价值资产的关键。你无法保护不可见的东西。你对整个业务生态系统中网络的可见性越高，你就越有可能快速检测到正在进行的入侵的迹象并阻止它。零信任要求在整个业务范围内对可见性和分析进行大量投资——无论位置或托管模式如何。\n\
  \n`Zeek`（又名 `Bro`）是一个监控网络流量的开源工具。`Zeek` 将不同类型的流量分离到不同的日志中。`Bro` 出于 2001 年，可以在 OSI\
  \ 数据链路层（`layer 2`）级记录所有局域网和 `VLAN` 流量的数据。\n\n`Darktrace` 和 `Cognito` 基于 `Bro`，使用\
  \ AI 和其他算法来确定网络正常的基准，然后识别并对异常网络流量（例如工作站之间的异常流量）发出报警。\n\n`Fortinet` 引入了 `Fortinet\
  \ Security fabric` 作为其零信任策略的一部分。`Forticloud` 是一个云端报告工具，它可以从组织的防火墙中收集数据并提供网络流量的可见性。\n\
  \n对于不使用 `Office365` 的公司，`Centrify` 是另一个零信任框架的示例。\n\n其他实用的工具包括云管理的防病毒解决方案，如 `Bitdefender\
  \ MSP` 和 `Sophos Cloud`，它们可以对不合规或有问题的设备发出报警，以便对其进行隔离。\n\n对于网络监控，存在多种解决方案，包括 `PacketMotion`（现归\
  \ `VMWare` 所有）、`Lancope`（现为 `StealthWatch`）。\n\n实施零信任概念有两个线索：一个是云环境，另一个是物理环境。这些概念将在后续关于\
  \ `Dev-Ops` 和物理环境的章节中讨论。\n\n## 7：云、Dev-Ops 与零信任\n\n数据中心模型现在已演变为基于 `DevOps` 的混合云环境。在《网络安全》的一篇文章中，这些措施旨在控制进出特定区域的流量。然而，它们并不适用于动态的云级基础设施，在这些基础设施中，应用程序和负载被部署、自动化、自动伸缩，并在本地和云实例之间或不同云环境之间反复迁移。\n\
  \n正如我们之前看到的，软件定义网络（`SDN`）已经变得非常灵活和动态。\n\n由于应用基础设施是动态的，`Klein` 进一步指出：它专注于保护应用程序本身，而不是特定的子网络或域。为了符合零信任模型，这种方法旨在降低单个应用程序被未经授权的连接攻击的风险。\n\
  \n2014 年，`Google` 发布了一个名为 `Kubernetes` 的开源系统，它已成为事实上的 `Dev-Ops` 容器环境。它内置了集中日志记录和监控。`Google`\
  \ 现在在这些环境中运行所有服务，包括 `Gmail`、`Google Search` 和 `Google Maps`。\n\n零停机部署很常见，因为 `Kubernetes`\
  \ 默认执行滚动更新（启动新版本的容器，等待其变为健康，然后关闭旧容器）。\n\n`Google` 提供了一个名为 `MailU` 的开源邮件服务器，这是一个基于\
  \ `docker` 的邮件服务器，开发者可以部署在 `Kubernetes` 平台上，以提供组织所需的监控。然而，这是在重复造轮子，因为 `Gmail` 是在非常类似的平台上交付的，并由\
  \ `Google` 作为 `BeyondCorp` 框架的一部分进行管理和监控，而不是终端用户。对于组织监控什么成本有效、什么应该信任第三方，存在一种平衡。这种选择是一个成本和风险的问题。`Kubernetes`\
  \ 的全栈监控需要如 `Data Dog` 等第三方工具。\n\n`Calico` 项目是一个能够扩展容器安全性的解决方案，提供了微隔离和安全性，并通常用于许多\
  \ `Kubernetes` 部署。\n\n![图 2 如如 Istio Service Mesh 的流量管理平台如何控制附加到微服务应用的 Sidecar 代理](img/f09-02-9780128214428.jpg)\n\
  \n图 2 如如 `Istio Service Mesh` 的流量管理平台如何控制附加到微服务应用的 Sidecar 代理。\n\n`Istio Service\
  \ Mesh` 控制附加到微服务应用的 Sidecar 代理。\n\n可以看到，在云环境中，保护微服务的工具在微隔离方面达到了一个成熟水平，而这在本地环境中尚未看到。\n\
  \n## 8：本地环境与零信任\n\n基于 `TPMs` 的设备特定私钥允许 `PKI` 使用每个设备独有的加密密钥。`TPMs` 是嵌入设备中的芯片，它通过安全信道向操作系统提供密钥。它们被用于提供安全启动和设备身份验证，现在笔记本电脑和工作站中很常见。使用虚拟\
  \ `TPM` 的启动安全也适用于 `VMWare` 和 `Microsoft Hyper-V` 中的虚拟化服务器。`Intel` 和 `AMD` 在其处理器中为虚拟服务器引入了\
  \ `TPM` 支持，这可以被虚拟服务器利用。\n\n网络交换机变得越来越智能，高质量交换机可以将流量复制到镜像端口，用于将数据输入 `Bro`、`Darktrace`\
  \ 或 `Cognito`。虽然交换机可能被称为二层交换机，因为它们独立于 `VLAN` 标记传输流量，但许多交换机现在是三层交换机，因为它们在网络层运行，而其中一些实际上是四层的，因为可以指定允许的端口。进一步，某些\
  \ `CISCOs` 交换机的端口可以配置 `sticky MACs`，将端口锁定到特定的 `MAC` 地址。通过使用网络交换机进行物理或逻辑隔离，网络提供了额外的安全性。网络交换机还可以用于限制工作站和虚拟服务器之间通信的服务；然而，交换机配置更改可能需要重启交换机，这可能并不可行，因此更改交换机配置并不总是最佳方法。\n\
  \n\n\n\n身份验证机制多种多样，访问 IMAP 电子邮件账户使用的身份验证机制与连接 Windows 网络使用的机制不同。传统的身份验证机制 `NTLM`、`Kerberos`\
  \ 和 `LDAP` 侧于内部网络上的身份验证。随着云计算认证的演进，这些机制已扩展到支持云服务和内部系统。微软将 Active Directory 扩展到了\
  \ Azure 云，Google 也通过 `OpenIAM` 实现了此，但总而言之，大多数身份验证机制多年来没有变化。\n\n包括 `LDAP` 和 `RADIUS`\
  \ 在内的许多网络协议已有几十年的历史，而一些常用协议如 `Telnet`、`POP3`、`HTTP` 和 `SMTP` 在 Berners-Lee 于 1990\
  \ 年构万维网之前就已经存在了。尽管这些协议现在通过加密通道使用，但它们的授权机制并未改变。这些协议的一句特点是，一旦用户通过了身份验证，其访问权限将一直持续到用户需要为止。这与零信任（Zero\
  \ Trust）原则相悖，因为零信任要求对连接进行重新验证。作者认为，需要研究如何替换这些遗留协议。\n\n持续身份验证听起来很不错，但在办公环境中，一个不断提示用户输入凭据的程序将不受欢迎。其他方法，如检查\
  \ USB 密钥是否仍连接或使用的设备是否发生变化的系统，是解决问题的简单机制。另一种方法是使用会话证书，这样一旦隧道建立，它就能变成自验证。Web 身份验证协议早已通过使用会话\
  \ Cookie 解决了这些问题，使得无线网络连接即使在无线连接可能不稳定的情况下也能保持会话安全。未来，标准网络协议可能需要以类似的方式进行改进。\n\n###\
  \ 引用\n\n通常认为，物理连接意味着具有连接局域网（LAN）的权限……在无线网络中，“`IEEE 802.11` 要求在站点与接入点（AP）建立关联之前必须进行相互认可且成功的身份验证”。\n\
  \n`IEEE 802.11` 还规定了去身份验证机制。但不要忘记，这是 `WEP` 被破解的方法，因为合法加入的设备可以被攻击者去身份验证，导致初始化向量（IV）重传。因此，重新验证机制不能无意中协助攻击者破解密码。\n\
  \n由于许多有线网络协议忽略了持续身份验证，因此需要更具想象力的方法来重新验证有线连接。\n\n使用键盘、指纹和虹膜生物识别身份验证方法会导致反复使用相同的信息来验证用户。另一种新颖的方法是淘汰键盘和鼠标，因为这些接口在输入点不提供身份信息。语音识别作为一种数据输入手段具有更大的可能性，因为数据输入是根据可区分的声音模式进行调制的。\n\
  \n### Radius 身份验证\n\n`Radius` 使用共享密钥加密，以及用户名和密码。大多数防火墙、路由器以及几乎每个双因子身份验证供应商和 VPN\
  \ 供应商都支持 `Radius`。`Radius` 快速、简单且安全；然而，它的实现需要手动输入共享密钥密码，对于小规模部署以外的任何情况都是挑战。`Radius\
  \ Authentication` 使用 `TCP` 或 `UDP` 端口 `1812`，为了在外部可用，通常通过 `HTTPS` 进行代理。\n\n### RSA\
  \ SecureID\n\n`SecureID` 使用硬件令牌进行用户身份验证。令牌需要密码来解锁设备，并每隔 60 秒生成一个新的硬件令牌。`SecureID`\
  \ 通常与 `Radius` 集成用于身份验证。\n\n### Duo Security 身份验证\n\n`Duo` 是 radius 代理服务的示例，用于双因子身份验证服务，它使用可以与\
  \ `active directory` 集成的 radius 服务器。`Duo security` 通过其双因子身份验证系统倡导了零信任的事业。\n\n1.\
  \ 建立用户信任\n2. 建立设备信任\n3. 获取设备可见性\n4. 确保对所有应用的安全访问\n5. 强制自适应策略\n\n这可能类似于 Cisco 的方法，这并不意外，因为\
  \ `Duo` 现在归 Cisco 所有的。\n\n### PKI 身份验证\n\n`PKI` 是实现零信任网络的首选方法。\n\n`TLS` 已成为客户端验证资源的常用机制；然而，如果资源仅验证服务器，则\
  \ `TLS` 是匿名的。\n\n双向认证是符合零信任模型的安全协议的要求，`TLS` 也不例外。\n\n这一点在于，为了防止中间攻击，服务器也应该验证客户端，因此仅有\
  \ `TLS` 是不够的。需要双向 PKI 身份验证。\n\n`PKI authentication` 也是一种持续身份验证机制，通过 `PKI` 保护的连接传输的数据不需要通过\
  \ `VPN` 隧道发送到互联网上，这意味着外部连接不需要 `VPNs`。事实上，`VPN 隧道` 的概念与零信任是背离的，因为它意味着隧道内的流量是不安全的。\n\
  \n### 实现 PKI 并非没有挑战\n\n通信加密显然需要处理器时间，这会影响通信链路的速度。`RSA` 是一种基于大质数分解难题的公钥算法，然而 `RSA`\
  \ 的开销不适用于极高速通信。\n\n改进用户验证的一个示例可以从 Facebook 引入重新身份验证机制中看到。\n\nFacebook 身份验证机制引入了\
  \ `AUTH nonce` 的概念——这是一种由应用程序生成的字母数字随机数，可用于提供重放保护。\n\n在 `Android` 设备上锁定屏幕时，底层会话保持激活状态。用户不想重新输入用户凭据来解锁屏幕。答案是使用\
  \ `nonce`（一次性数字），它由客户端用于验证会话。此过程在后台进行，并确保会话不会被劫持。该过程位于第 3 层（传输层），但理想情况下该过程应该位于应用层，但这需要所有应用程序都集成网络身份验证功能，这不太可能。\n\
  \n## 10: 零信任和数据窃取威胁\n\n组织中的数据外泄防护非常侧重于在终端（工作站）或网络边界（防火墙）进行检测。但在零信任网络中，检测的重点在网络上，由于攻击者可以使用加密隧道外泄数据，因此检测流量内容的唯一方法是在终端而不是在流量加密的中途。终端解决方案和\
  \ DLP 解决方案的示例有 `Safetica` 和 `CoSoSys`，在许多 `CASB` 解决方案也常见。如果没有这些产品，网络管理员仍然可以看到流量流，但看不到内容。\n\
  \n## 11: 无线、移动网络与零信任\n\n使用 `WPA/WPA2` 的个人 Wi-Fi 系统的一个问题是许多实现缺乏通道隔离，这允许 Wi-Fi 设备攻击连接到相同接入点的设备。虽然企业级实现可能会防止这一点，但\
  \ `WPA3` 默认提供了更好的通道隔离。2018 年三星推出了 `Samsung 10` 和 `10 +` 系列手机。为了提高用户隐私，这些设备不仅支持 `IEEE802.11ax`，还使用\
  \ `RFC8484` 定义的 `DoH`（HTTPS DNS）解析域名。\n\n## 12: DHCP 与零信任\n\n`DHCP` 定义在 `RFC2131`\
  \ 中。\n\n\n\n\n# 13: 网络安全审计标准如何与零信任对齐？\n\n“防火墙不再需要”这一说法意味着需要对安全标准进行重新思考，这是必要的。其含义是强制边界防火墙的\
  \ `PCI-DSS`、`COBIT 5` 和 `ISO27001` 等现有计算机审计标准已经过时；然而，这些标准一直提倡深度防御。在将零信任与 `ISO27001`\
  \ 和 `Cobit5` 进行比较时，有一点是零信任概念没有涵盖物理安全、文化和治理。这些是 `ISO27001` 和 `COBIT 5` 的核心方面，因此零信任必须视为这些标准的补充而非替代。\n\
  \nJohn Kindervag 的背景是 `PCI DSS` 审计。`PCI-DSS` 审计中指定的许多控制措施假设攻击者已经在内部，这正是深度防御原则，该原则与零信任模型完美契合。`PCI-DSS`\
  \ 关注信用卡数据的存储和处理。零信任则将这些概念扩展到所有数据和流程。\n\n# 14: 实施零信任概念从数据开始\n\n零信任架构从数据开始，首先是保护静态数据。自\
  \ `SQL 2008R2` 以来，通过透明数据加密 (`TDE`) 对 `Microsoft SQL` 静态数据进行加密已成为。`TDE` 现在用于 `Azure\
  \ SQL` 和 `Azure SQL Data Warehouse` 数据文件。`TDE` 加密 `SQL` 日志文件和数据文件。当数据在 `SQL server`\
  \ 上处理时，内存中的数据处于解密状态，因此虽然对 `SQL server` 上存储数据的攻击可能受到保护，但 `SQL server` 仍然可能受到对处理中数据或内存中数据的攻击。如果需要保护的数据在本地，并且部署了\
  \ `Cloud CASB` 解决方案，那么它可能无法为本地资产提供零信任保护，可能需要适当额外的零信任解决方案来保护这些本地资产。\n\n# 15: 开发零信任网络策略\n\
  \nPalo Alto 发布了一份实施零信任网络的五步走指南：\n\n1. 定义你的保护面（Protect Surface）。这需要识别数据资产，并评估它们在静态、处理和传输状态下的脆弱性。\n\
  2. 映射事务流。这涉及识别进出数据资产的数据流。Palo Alto 推广 `Cortex Data Lake`。\n3. 构建零信任网络。\n4. 创建零信任策略。\n\
  5. 监控并维护网络。\n\n根据目前为止的讨论进一步扩展这些内容，在小型本地环境中开发 10 点零信任框架时，应考虑以下阶段：\n\n1. 识别需要保护的数据资产和服务。\n\
  2. 映射到数据资产的内部数据流，并识别网络上使用的流和身份验证方法。识别网络中任何未加密的身份验证协议并加密，例如，将 `LDAP` 替换为 `LDAPS`，将\
  \ `HTTP` 替换为 `HTTPS`。甚至应该考虑将打印机更换为不通过端口 `9100` 向网络打印机发送明文打印信息的打印机。\n3. 根据允许的协议，调整桌面和服务器全局防火墙策略，仅允许上一步识别出的协议。\n\
  4. 在内部网络上部署 `Zeek` 等网络监控解决方案，并确定是否有任何应用程序以明文发送网络凭据。`https://www.zeek.org/bro-workshop-2011/solutions/incident-response/index.html`\
  \ 显示了如何使用 `Zeek` 检测以明文发送的用户凭据。其他可以监控和记录网络流量流以及监控服务器的网络监控解决方案还有 `Nagios` 和 `FortiCloud`。必须考虑如何利用监控工具来执行策略。\n\
  5. 考虑创建一个次级网络，并将数据集和服务逐个从旧网络迁移到零信任网络。\n6. 加密 `SMB` 文件共享协议。\n7. 为服务器获取 `TPM` 模块并加密所有静态数据，使用\
  \ `BitLocker` 和 `virtual TPM` 加密虚拟服务器和驱动器，并对带有 `TPM` 和 `PIN` 恢复选项的工作站进行彻底评估，因为这些选项不能因安全性的增加而受到削弱。这可能需要额外的服务器来托管服务器副本。一旦实施，必须记录并测试恢复程序。\n\
  8. 实施双重身份验证以验证用户身份验证，可以使用如 `Duo` 等产品、硬件设备或使用生物识别。\n9. 评估由于在服务器和文件共享上实施加密可能导致的恢复选项丢失和性能下降，并实施缓解措施，如实时复制和能够提供更高性能的硬件。\n\
  10. 使用`条件访问策略`（Conditional Access Policies）为设备实施 `TPM` 身份验证，以便所有到网络的终端连接都经过验证，并部署条件访问用户策略。\n\
  \n第九点非常重要，因为从表面上看，零信任似乎可以在不需要部署更多物理服务器的情况下实施；然而，在对服务器进行加密后，计算机工程师在服务器故障时可用的恢复选项减少了。这种减少必须得到补偿，否则在发生故障时，提交给董事会的报告将说明安全性的增加如何阻碍了恢复。（正继续……）\n\
  \n# 16: 未来的本地零信任网络可能是什么样\n\n\n\n在 `[图 3]` 中，防火墙从边界防御移动到网络核心，作为一种网络隔离设备，它同时也是一个连接到云监控和报告服务的报告代理。与服务器通信所需的端口将根据需要专门设置，就像通往互联网的出站端口一样。\n\
  \n![图 3 防火墙集群位于网络核心而非边界。](img/f09-03-9780128214428.jpg)\n\n图 3 防火墙集群位于网络核心而非边界。\n\
  \n该模型还解决了 John Kindervag 提出的物理环境中微隔离的困境。增加分段和网络监控是看似不兼容的概念，但通过让防火墙成为网络分段和监控设备，这个困境得到了解决。在理想世界中，防火墙将利用\
