  交付有效的网络服务图 4](https://example.com/image.jpg)\n\n图 4\n\n通过商业实体的视角指导交付有效的服务。由于 GDPR\
  \ 是一项如此新的法律，该主题的学术写作存在空白。因此，应用了目标与关键结果（`OKR`）框架，以通过商业实体的视角指导交付有效的服务。\n\n\n\n社会环境因素对于提供服务的机构也非常重要。人口老龄化是会对服务交付和消费产生重大影响的因素之一。由于感知到技术交付服务的复杂性，以及对第三方管理其数据的不信任，老龄化人口不太可能参与技术交付的服务。机构必须与其利益相关者互动，通过意识活动和阐述其为保护个人数据而采取的保护措施，来确保建立信任。正如调查所示，数据泄露可能会对机构造成致命性损害，甚至导致其灭亡。各国内部的人口统计数据也需要关注这一点。社会地位低微的人群可能无法像富裕地区的人群那样获得由技术提供的服务。服务应该以平等的方式针对人口的所有部分。\n\
  \n## 5.1.4: 技术层面\n\n从技术角度来看，过去十年在数字领域提供服务方面发生了巨大变化。最引人注目区块链和人工智能的进步，这些技术通过部署来检测和防止恶意意图。这些通常被称为“颠覆性”的技术可以被采用以取代通常由静态劳动力执行的人工流程。通过机器学习，技术可以追踪网络流量和社会行为的破坏性模式，以防止数据泄露及随后的横向恶意活动。\n\
  \n## 5.1.5: 法律层面\n\n在规划和提供服务时，必须考虑法律因素，特别是从数字隐私的角度来看。美国的一个例子是参议院正在讨论的一项保护数字消费者权利的新法案（\n\
  \n## 5.1.6: 伦理层面\n\n伦理和环境因素包括可持续性、税收实践、供应链以及污染/碳排放。对网络安全有效影响最大的伦理考虑可能是机构收集个人数据的数据量。哈佛延伸学院的硕士生\
  \ Ethan Cowan 提出了以下观点：“技术的发展远远超过了公共政策和政治知识，我不认为我们——不仅在美国，而是作为一个物种——已经适应了我们产生的数据量所带来的激进影响，以及这些数据能告诉我们关于自己和个人的信息。”\n\
  \n## 6: 结论与未来工作\n\n本研究的总体目标是理解数字身份、国家身份计划、`GDPR` 与数据泄露之间的关联。批判性回顾独立考察了每个研究目标，以了解有关调查主题的最新新闻和概念。通过参考领先的学术期刊，对每个概念进行了详细研究。研究之后，发布了一项调查，以帮助理解四个研究目标之间的关联，从而获取关键知识，影响公共和私营领导者在网络支出方面的投资决策。随后采用了对\
  \ `OKR` 框架的分析，并应用于安全提供数字服务的商业案例研究。随后通过采用 `PESTLE` 框架进行批判性讨论，以引导对话。\n\n研究引用了许多该主题领域的领先评论人士。相关领域的顶级专家评论说，`GDPR`\
  \ 成本高昂且实施困难。还提到 `GDPR` 在法律中也没有完全定义，这也导致了实施和理解的困难。然而，`GDPR` 是一向善的力量，因为它迫使机构报告此前可能未被披露的数据泄露，例如英国航空和万豪的数据泄露事件。\n\
  \n评论指出，导致实际数据泄露的一个主要原因是 21 世纪的瘟疫——勒索软件类病毒。还有评论说，某些机构仍然未能报告数据泄露。如果是这样，结合调查受访者对于不再使用受数据泄露影响机构的服务的认知，这传出了一种令人担忧的情绪，即高管对\
  \ `GDPR` 合规和网络防御的投入不足。\n\n建议进一步的研究重点关注“数字身份”以及围绕安全和隐私出现的问题。例如，如果具有恶意意图的个人获得了某人的数字身份，机构正在建立什么机制来防止其被利用？此外，由于机构收集个人隐私数据（即信用卡信息和登录凭据），机构正在做什么来保护这些数据的隐私，并确保它们不会落入他人手中？进一步的研究可以关注公司对\
  \ `GDPR` 之外“隐私”法律的合规性。在向用户和客户提供服务时，隐私和信任建立必须是任何机构目标的核心。\n\n## 参考文献\n\n## 7: 平衡隐私与公共利益以检测和防止欺诈\n\
  \nSudhir Gautam; Hamid Jahankhani ^()英国伦敦，诺森布里亚大学\n\n## 摘要\n\n研究人员经常将数据称为“新石油”，但从这些数据集中提取价值仍然是一项挑战，通常是因为公共部门对数据安全和隐私的担忧。英国政府处理的数据是最大、最丰富的数据集，但尽管规模巨大，如何有效利用这些数据来改进预防欺诈等公共服务方面仍然是一项挑战。跨服务的最优数据利用仍然复杂且碎片化。同样不可否的是，公众对数据共享的信任已大幅侵蚀，为人知的事件引发了公众对隐私的担忧，以及对支持各种公共服务时使用个人数据接受性的质疑。各独立政府机构的研究反复表达了政府使用个人数据法律法规的不确定性，这些法律与其他相关法律领域之间的相互关系允许了多种解释。这导致数据共享实践随着时间的碎片化增长，使得决定哪些可以共享哪些不能共享变得困难。本研究关注隐私问题，因为它们可能被认为是阻碍数据共享的致命因素。更糟糕的是，新隐私法规\
  \ `GDPR` 的引入加剧了过度谨慎的态度，导致了机会的流失。本章探索并试图揭示法律框架内有效使用数据的奥秘。作者在英国公共部门工作了多年，为评估政府的数据共享提供了良好的视角。\n\
  \n### 关键词\n\n公共服务；欺诈；`GDPR`；数据共享；数据隐私；英国\n\n## 1: 引言\n\n2016 年，当时的英国首相要求秘书打击影响公共部门的所有欺诈。他要求采取协作方法来停止欺诈，并确保整个公共部门建立共同防御。为了实现这一目标，需要更有效的数据共享来打击欺诈，但公共机构之间何时行使数据共享的清晰度仍然是一个挑战。\n\
  \n\n\n\n\n欺诈的规模令人震惊。英国税务海和海关总署（HMRC）估计，因逃税导致的损失至少达 150 亿英镑。《年度欺诈指标》估算，已识别和隐藏的欺诈给英国经济造成的总损失每年达\
  \ 1930 亿英镑，其中大部分未被检测到。公共部门的欺诈损失估计为 403 亿英镑。\n\n尽管不同的公共机构运行不同的框架并具有不同的结构，但欺诈者面临的威胁是相似的。纳税人的损失、声誉风险以及公共部门信任的侵蚀，都是公共部门因欺诈而可能面临的一些风险。\n\
  \n欺诈者不承认组织边界，并可能跨政府部门发起多次攻击，因此公共机构汇聚应对欺诈问题具有巨大效益。只有通过汇集不同部门的各个拼图部分，才能对跨组织的欺诈进行良好的检测和管理。\n\
  \n长期以来，人们广泛认同数据共享是预防欺诈的非常重要的工具，但公共机构在是否共享、与谁共享、在什么情况下以及共享到何种程度合理方面一直面临困境。\n\n有强有证据表明，对法律允许范围的法律不确定可能阻碍了数据共享。这种不确定性导致的结果可能导致部门不愿和不追求数据共享。显然，这些疑虑源于法律权限，而非《数据保护法》或`GDPR`，但数据保护条例经常被引用为有效共享失败的原因。\n\
  \n由于近期备受关注的数据泄露事件，这个问题变得更加严重。数据共享已成为一个棘手问题，因为数据共享不足的法律影响可能从刑事起诉、声誉损害到民事处罚不等。\n\n\
  “几乎没有争议的是，对政府持有的、可在最充分利用数据的机构之间进行目标使用，具有推动更智能公共服务和改善生活的力量。”\n\n虽然为了更好地交付服务（如欺诈检测），数据共享不可避免，但执行共享的相应机构符合相关的监管和法律要求也同样重要。\n\
  \n公共机构拥有许多含有丰富数据集的数据库，这些可用于识别欺诈模式或已知欺诈者。例如，当在一个数据集中识别出欺诈时，如果这些结果能与其他数据集共享，则可能凸显尚未被察觉的欺诈，或确认欺诈模式。\n\
  \n尽管数据量巨大，但利用这些数据的格局仍然复杂且碎片化。\n\n英国围绕数据共享的法律框架通常被描述为高度复杂。新立法，如欧盟通用数据保护条例（`GDPR`）和《2018\
  \ 年数据保护法》可能为公共部门组织创造了一个难以应对的模糊系统。\n\n当法律框架尚时不，确保个人数据的处理和共享合规可能是一个挑战，特别是当实体之间创建新信息共享法律权限的过程可能需要几年时。这可能会对什么可以共享和不能共享产生困惑云。\n\
  \n本章分析了公共机构之间的数据共享，以更好地了解是否存在确实阻碍政府打击欺诈的数据共享法律挑战，这些挑战是什么，以及是否以及如何克服它们。\n\n《2006\
  \ 年欺诈法》为该犯罪提供了立法依据，并定义了三个主要的“要素”：“虚假陈述欺诈”、“未披露信息欺诈”和“滥用职位欺诈”。类似地，Farrell 引用道“欺诈可以通过三种明确定义的方式实施”。这些是“通过虚假陈述”、“通过滥用职位”或“通过未披露”。\n\
  \n2014 年，政府引入了欺诈定义和分类，以便为公共部门的欺诈和错误报告提供一致的方法。为了确保方法一致，政府在 2014 年引入了欺诈的法律定义（如《2006\
  \ 年欺诈法》中规定的）。\n\n“做出虚假陈述或未披露相关信息，或滥用职位，以获取财务利益或挪用资产。”由于未被检测到的欺骗本质，欺诈的真实规模永远无法衡量。“国家欺诈局（NFA）估计，欺诈每年给英国经济带来约\
  \ 520 亿英镑的损失，其中私营部门损失 213 亿，公共部门损失 206 亿，个人损失 91 亿。”\n\n根据英国医疗体系（NHS）的最新估计，欺诈和其他类似犯罪每年导致`NHS`损失\
  \ 29 亿英镑，并设定了 2018 年的目标，与适当合作伙伴机构建立信息共享框架，以便通过数据匹配检测和识别欺诈。\n\n在的一份报告中，内阁办公室和国家欺诈局指出，“如此大规模的盗窃纳税人的钱直接影响了可用于一线服务的资源的减少。“从政府被盗窃的每一英镑都意味着用于医疗、教育、执法和国防的资金减少了。”\n\
  \n## 2：数据共享与欺诈检测\n\n长期以来，人们一直希望转型公共服务并实现有效的数据共享文化，以提供联通的服务。\n\n“已经在开展大量工作以改进最佳实践和对系统性数据共享问题的理解”：通过信息专员办公室创建`数据共享代码`，通过由菲奥娜·Caldicott\
  \ 女士领导的独立信息治理监督小组，以及通过创建`国家医疗服务体系信息治理工具包`。\n\n但信息共享是一项复杂的任务\n\n现任政府在公共部门有效利用数据方面有类似的目标。2016\
  \ 年，他们发布了一份关于在政府中更好地使用数据的咨询。这构成了《数字经济法》中数据共享原则的基础，该法旨在促进公共机构之间建立数据共享网关，以便通过更高效的数据共享来检测欺诈。\n\
  \n2011 年，《反欺诈工作组中期报告》发布了一份报告，建议“采取协作共享方法以打击欺诈”。\n\n减少欺诈的战略计划《共同打击欺诈》（Fighting Fraud\
  \ Together）于于 2019 年发布，它承认了共同应对欺诈的益处，并指出损失达 380 亿。\n\n这些主张得到了国家欺诈局在 2013 年的验证，即“自愿部门损失了\
  \ 1.5 亿，以及 900 万，尽管对数据质量存在一些保留”。\n\n上述观点证明了欺诈给英国经济造成的巨大损失。在`HMICFRS`根据时任内政大臣授权于\
  \ 2018 年 3 月至 7 月期间进行的检查中，报告称缺乏打击欺诈的国家战略。在同一份报告中，一位分析师报告说，“一切都阻碍欺诈。它不是优先事项，不吸引眼球，人们不会报告，而且很难证明，这需要时间、资源和资金”，因此它不是国家执法的优先事项。\n\
  \n*   2002 年的索姆命案在坎布里郡两名女学生被杀后，引起了英国对数据共享重视。对这一严重案件的审查结论是，虽然不是警察部队的错，但“更好地利用信息本可以防止索姆谋杀案的发生”。\n\
  \n\n\n\n\n- 2001 年 9 月 11 日的纽约恐怖袭击凸显了信息共享的缺失，这导致了美国联邦、地方执法和情报机构在信息共享方式上进行了多次审查和调整。\n\
  - 英国目前为止最受关注的案例是`HMRC`在 2007 年（据称）丢失了 2500 万份儿童福利记录。这导致了 2008 年的`Poynter Report`（《英国税务和海关局信息安全审查》）。\n\
  \n这些受关注的案例凸显了及时信息共享的重要性和收益，并要求进行更广泛的共享，从而实现及时的预防和检测。\n\n数据共享对不同的人意味着不同的含义，就本研究而言，其定义如下：\n\
  \n1. 组织间信息共享，侧重于两个或多个组织之间的信息共享；\n2. 机构/部门间信息共享，侧重于组织内部及其部门之间的信息共享。\n\n为了使定义更具相关性和时效性，采用了信息专专员的定义：“`将数据从一个或多个组织披露给第三方组织或机构，或在组织的不同部分之间共享数据`”。\n\
  \n2016 年，内阁办公室在审查发现其`国家欺诈计划`在两年内节省了近 2 亿英镑后，敦促地方议会和其他公共部门加入。该计划基于“匹配公共和私营部门内部及部门之间的信息，以预防和检测欺诈”（（。\n\
  \n从之前的某些示例来看，自 2008 年`国家欺诈局`建立以改进欺诈管理方式以来，很少有倡议随时间碎片化增长。一个例子是由该机构领导的`国家欺诈计划`（`NFI`）。\n\
  \n很少有其他案例像`HMRC`和`DWP`这样的大型公共部门长期以来一直通过有效的数据共享在打击欺诈方面处于领先地位。例如，税务和海关局（`HMRC`）与工作和养老金部（`DWP`）共享实时的`PAYE`信息（称为`RTI`），以便`DWP`计算通用信贷的额度，并开展了耗时数年的复杂项目，以使数据系统兼容。这表明了政策要求、协作工作以及尽管面临困难和复杂性仍持续投入如何取得成效。但显然，还需要做更多工作。现任和前任政府已尝试长期获得完全投入。虽然此类倡议寥寥无几，但严酷的现实是，改进共享文化还需要更多工作，正如`国家审计办公室`在报告中所指出的，“`政府对欺诈问题的规模缺乏清晰的理解，各部门在识别和应对欺诈风险的能力上存在差异`”。\n\
  \n## 3: 数据隐私\n\n国家档案馆对公共部门数据共享咨询的审查指出，“关于数据保护存在许多神话——它似乎是被引用最频繁但最少被理解的法律之一”，正由于这个原因，什么是允许的、什么是不允许的可能抑制了某些部门的数据共享。“某些政府部门因为怀疑法律权力允许其做什么而决定不追求新的数据共享倡议”。\n\
  \n在已经复杂的数据保护法基础上，`GDPR`的出现由于其深远的要求、增加的数据主体权利以及大幅增加的罚款和罚金，增加了额外的复杂性。彼得·凯瑞（Peter Carey）称：“`GDPR\
  \ 是新监管背景新时代的黎明`”。\n\n从表面上看，`GDPR`似乎简单易于理解，但由于其涵盖范围广泛（例如，什么构成个人信息以及其范围），它已成为误解的来源，让机构认为他们寻求保护来自其他机构的信息，或使用来自其他机构的信息或其他任何其他额外目的。结果是，由于对其条款的不确定性，要求被解释得过于谨慎。\n\
  \n作者认为，由于对于日常运营职责的人缺乏清晰的法律建议，更好地利用数据往往阻碍了信息共享。导致的影响要么是不合规，要么是推迟共享数据的决策。\n\n随着新的强制性义务如：\n\
  \n1. (a) 数据隐私影响评估\n2. (b) 维护并证明所有处理活动的记录，\n3. (c) 增加的数据主体权利，`GDPR`，经常被引用为“创新的终结”。\n\
  \n但同时，这被认为是硬币的另一面，因为通过提高透明度和证明更好的问责制，`GDPR`可以为跨部门有效数据共享提供新的机会，并帮助恢复公众信任。\n\n## 4:\
  \ 通用数据保护条例（GDPR）格局\n\n目的限制是`GDPR`的基本原则。它规定，个人数据只能“`为了指定的、明确和合法的目的而收集，且不以与这些目的不兼容的方式进一步处理”，并且对于其收集和/或进一步处理的目的而言，数据应该是“充分、相关且不过量的”，并且“准确并在必要时保持更新”（法律、社会、经济和伦理层面的隐私和数据保护概念化）。\n\
  \n出于欺诈检测目的，必须针对公共机构存在欺诈犯罪，例如，为了采取措施对该欺诈而披露信息，该犯罪必须在《数字经济法案》附 8 中列为“指定人员”。所有此类共享还必须符合《2017\
  \ 年数字经济法案》和数据保护法规的要求。\n\n首先，《数据保护指令》中设定的`GDPR`规则仅适用于涉及自然人的数据，并将个人数据定义为：\n\n任何与已识别或可识别的自然人（`数据主体`）有关的信息；可识别的自然人是指可以直接或间接地（特别是通过引用如名称、身份号码、位置数据、在线标识符或与该自然人的物理、生理、遗传、心理、经济、文化或社会身份特定的一个或多个因素）来识别的人。\n\
  \n([Art. 4)`\n\n此外，`GDPR`第 6 条规定了个人数据共享合法的要求，必须满足以下条件。具体如下：\n\n1. (a) 同意：个人已明确同意，允许你为了特定目的处理其个人数据。\n\
  2. (b) 合同：处理对于你与该个人签订的合同是必需的，或者因为他们要求你在签订合同之前采取某些特定步骤。\n3. (c) 法律义务：处理对于你遵守法律是必要的（不包括合同义务）。\n\
  4. (d) 核心利益：处理对于保护某人的生命是必要的。\n5. (e) 公共任务：处理对于你履行公共利益任务或履行官方职责是必要的，且该任务或职责在法律上有明确依据。\n\
  6. (f) 合法利益：处理对于你的合法利益或第三方的合法利益是必要的，除非有正当理由保护该个人的个人数据并优于这些合法利益。（如果你是为履行官方职责而处理数据的公共机构，则此项不适用。）\n\
  \n\n\n\n\n毫无疑问，`GDPR` 赋予了个人更多权利，并加强了对其数据处理方式的控制，但通常存在一种误区，认为数据处理依赖于个人的同意（a），且他们可以随时撤回这种同意。这种说法是正确的，但并不适用于所有情况。绝大多数公共部门的个人数据处理将根据（e）公共任务功能（即\
  \ `ICO` 法律规定的处理的合法依据）进行。例如，对出生信息进行处理和注册是法律要求，或者为了预防欺诈而对税收或信息进行收集和管理或披露，这些并不依赖于个人的同意。但公共机构要依赖公共任务功能，其基础任务、功能或权力必须具有明确的法律依据。\n\
  \n例如，出于检测欺诈的目的，必须针对公共机构存在欺诈犯罪，例如，为了采取措施对该欺诈犯罪而披露信息，必须在《数字经济法案》附表 8 中被列为“特定人员”。而且所有此类共享还必须符合《2017\
  \ 年数字经济法案》及数据保护立法的要求。\n\n《2017 年数字经济法案》(Digital Economy Act (DEA)) 是政府通过数据共享打击欺诈的良好范例。它提供了一个法律框架，在遵守英国总体法律的前提下共享与欺诈相关的数据。这些法律包括：a)\
  \ 数据保护立法，(b) 《2016 年调查权力法案》第 1–7 部分或第 9 部分（在该法案完全生效前，为《2000 年调查权力监管法案》第 1 部分），以及\
  \ (c) `GDPR` 和《1998 年人权法》。\n\n## 5: 使用公共任务作为数据共享功能以打击欺诈\n\n“政府部门与其他部门共享数据的权力源于法律、法规、政策或其行政职能”\n\
  \n在任何其他条件下的处理个人数据都可能构成非法行为，除非寻求并获得同意……[文本已省略]……数据控制者的法律实体即使在考虑 `GDPR` 规定的要求之前，需要拥有法律赋予的权力。\n\
  \n“部门若要将‘公共任务作为一种职能’使用，双方都需要考虑他们是否拥有必要的法律权力”\n\n公共任务功能可以在以下情况下使用：\n* 在行使公职权力时。这涵盖了法律规定的公共职能和权力。\n\
  * 为了履行法律规定的符合公共利益的特定任务。\n\n`GDPR` 未对“公职权力”提供定义，因为它取决于决定某实体是否为公共当局的各国法律。“‘行使公职权力’可能取决于是否存在某法律规定了处理目的，并要求且允许控制者进行该处理。”\n\
  \n公职权力由《2018 年数据保护法案》定义，该法案规定：“对于 `GDPR` 而言，以下内容（且仅限于以下内容）是英国法律规定的‘公共当局’和‘公共机构’：\n\
  1. (a) 根据《2000 年信息自由法案》定义的‘公共当局’，\n2. (b) 根据《2002 年苏格兰信息自由（苏格兰）法案 (asp 13)》定义的‘苏格兰公共当局’，\n\
  3. (c) ‘由国务卿在法规中指定或描述的机构或团体，但受第 (2)、(3) 和 (4) 小的限制’””\n\n### 5.1: 必要性与比例性测试\n\n\
  “`GDPR` 第 26 条规定，当两个或多个控制者共同决定处理目的和手段时（在这种情况下为打击欺诈），他们应成为共同控制者”（`Chapter 4`，`GDPR`,\
  \ `eur-lex-europa.ew`）。由于用于检测欺诈的信息共享将在双方之间进行，共同控制者必须履行 `GDPR` 下的若干额外义务。“每个共同控制者都需要履行其在\
  \ `GDPR` 下的义务。”\n\n此外，数据控制者必须证明共享个人数据是必要的，且共享的数据在利益上成比例的，即共享与主体的隐私权和自由权之间取得了平衡，且处理履行了指定的职能。`ICO`\
  \ 对“必要性”给出了强有力的解释如下：\n1. a. 用于检测欺诈的数据共享目的是正的。\n2. b. 此类目的只有通过处理个人数据才能实现。\n3. c.\
  \ 处理与所追求的目标成比例的（`ICO`，必要性测试，2001 年）。\n\n### 5.2: 目的限制\n\n重要的是，在进行进一步处理活动时，实体应核实这些操作与初始目的是兼容的。否则，“新的处理活动只有通过重新获得同意，或通过欧盟成员国法律中允许更改数据处理目的的法定理由，才是合法的”。\n\
  \n### 5.3: 英国法律格局\n\n目前，没有通用的法定权力允许公共机构共享数据，因此根据行政法原则，公共机构只有在获得法律授予权力的情况下才能披露个人信息。\n\
  \n这意味着重复使用个人数据只有在当局为了公共利益或行使其被赋予的公职权力时才是合法的。法律可能规定为某一目的收集的信息可用于另一目的，例如，《2005 年税收和海关专员法》第\
  \ 17 条规定，税收和海关与某职能相关获得的信息可以被用于任何其他职能。\n\n如前一节所述，公共部门的处理可能通过公共任务作为一种合法依据被证明，并找到更强的法律依据，使其能够履行其职能，即为了促进公共利益的合法目标而进行处理，以缩小欺诈漏洞，从而提供更好的公共服务。\n\
  \n有三部允许出于预防欺诈目的进行数据共享的主要立法：\n* 《2001 年社会安全欺诈法》（称为《欺诈法案》）引入了授权的工作与养老事务部 (`DWP`) 和地方当局官员从列出的组织获取其客户信息的权力，以帮助打击针对福利制度的欺诈。\n\
  * 《2014 年地方审计与问责法》。\n* 《2007 年严重犯罪法》。\n\n### 5.4: 《1998 年人权法》\n\n由于欧盟法对英国法律具有直接影响，根据《1998\
  \ 年人权法》第 8 条第 1 款，“公共当局干预个人隐私是非法的，除非该等干预受到第 8 条 (2) 中包含的特定例外之一的授权”（`legislation.gov.uk`）。\n\
  \n在 във报告中，《人权法》和《数据保护》议会委员会成员得出，“政府的做法是在主要立法中包含非常广泛的赋能条款，并将数据保护保护措施留给次级立法”（位于第\
  \ 7 页；《数据保护与人权》，上议院下议院人权联合委员会）。\n\n在实践中，这意味着除了英国立法或判例规定的任何其他规则外，任何干预个人隐私的公共机构都必须证明其对尊重私人和家庭生活义务的干预如下：\n\
  \n\n\n\n\n- ‘根据法律，且出于国家安全利益，在民主社会中是必要的’，\n- ‘为了公共安全或国家的经济繁荣’，\n- ‘为了防止动乱或犯罪’，\n\
  - ‘为了保护健康或道德’，\n- ‘为了保护他人的权利和自由’。\n\n## 5.5: 数据共享权限\n\n收集、使用、共享或其他处理信息的权力可以源于普通法，对这些权力的限制也是如此，例如普通法中规定的保密义务。当某项被认为是机密的信息在涉及信誉义务的情况下被传播，但随后被未经授权地使用时，就可能发生违反保密的行为。\n\
  \n‘由王室大臣领导的政府部门可能可以依靠普通法权力来共享数据，即使在没有明文或隐含的法定权力的情况下也是如此。一般情况是，王室拥有普通的普通法权力，可以做自然人可以做到的任何事情’（除非该权力已被法律剥夺）（\n\
  \n\n\n例如，“《2007 年统计与注册服务法案》(SRSA) 设立了英国统计局（在法案中称为“统计委员会”），其法定目标是促进和保护服务于公共利益的官方统计数据的制作和发布；国家统计局是该机构的执行部门。2017\
  \ 年，《数字经济法案》修订了 SRSA，为国家统计局提供了许可性和强制性的通道，从所有公共机构和王室机构接收数据，并拥有强制某些英国企业提供数据的新权力；在有限情况下，国家统计局持有的数据也可仅出于统计目的与授权行政政府共享”（ONS，数据安全、治理和法律政策）。\n\
  \n除了普通法权力，“王室还拥有特权权力。尽管特权没有单一公认的定义，但这些权力通常被视为王室的剩余权力，允许行政部门行使未被法律明确涵盖的王室历史权力。例如，剩余权力可能涉及外交、国防和特赦。然而，议会可以通过法定规定覆盖并取代特权权力”（《公共部门数据共享：法律指南）。更增加性的是，大多数信息网关是许可性的而非强制性的。它们为持有信息的机构留下了决定是否披露信息的自由裁量权。这可能导致数据共享问题，因为持有信息的机构可能没有或动力不足来披露，并且可能不会这样做，这可能会引发数据共享问题。\n\
  \n根据法律设立的公共机构（例如地方当局和英国税务总局 HMRC）仅拥有法律授予的权力。这意味着这些机构没有普通法或王室特权的权力，必须完全依赖其明文或隐含的法定权力。\n\
  \n获得大臣授权的就业养老金部（DWP）官员，或负责调查社会安全福利欺诈且获得其首席执行官或首席财务官授权的地方当局官员，可以使用这些权力，并依靠《2001 年社会安全欺诈法案》（称为《2001\
  \ 年欺诈法》）从指定的个人和组织获取有关其客户的信息，帮助检测福利欺诈。\n\n行政法——或公法——是规范政府和其他公共机构活动的法律体系。在公共机构参与数据共享之前，它必须首先确定自己是否有共享相关数据的法律权力。“当公共机构越权行动时，其活动可以通过司法审查的方式向法院提出挑战’（\n\
  \n公共机构的性质和管理其活动的规则对于决定其行为的法律依据以及活动是否合法起着至关的作用。“如果公共机构没有收集、使用、共享或其他处理数据的权力，其行为将是违法的，而个人可能已同意这一事实并不会使该活动合法’（\n\
  \n非部长级部门或根据法律设立的机构不拥有特权或普通法权力。它们的任何数据共享必须基于法定权力（明文或隐含），而法定权力也可以向非公共机构施加共享或披露信息的义务。例如，《1994\
  \ 年贩毒法》第 52 条将未能报告怀疑的毒品洗钱活动定为犯罪，从而对个人和组织规定了与警方共享相关个人信息的法定职责。\n\n可以颁布明文的法定权力以允许出于特定目的披露数据。此类权力可能是许可性的，也可能是强制性的。许可性法定权力描述赋予机构共享数据权的法律，例如《1998\
  \ 年犯罪与动乱法案》第 115 条。强制性法定权力则要求机构在被要求时共享数据。其例子是《1995 年刑事上诉法案》第 17 条（\n\n即使在没有明文法定权力来共享数据的情况下，仍可能暗示此类权力。为此，“凡当公共机构的行动或决定是为履行明文权力或义务的要求而附带的时，它们可以被认为具有行事的的隐含权利或权力’（\n\
  \n法定机构根据隐含的法定权力执行许多活动。这对于数据收集和共享等活动尤为如此，因为这些活动并不总是法定的功能。\n\n## 6: 研究结果\n\n本研究的主要目标是分析为了实现防欺诈目的的有效个人数据共享必须满足的各种法律必要性。因此，显而易见的是与政府的数据保护和法律专业人士开始对话，获取有关防欺诈数据共享中关键挑战的首手意见。尽管安全仍然是一个关键挑战也是一个保证因素，但本研究侧重于数据共享的法律方面；因此，问题旨在探测数据共享的法律要求和影响。\n\
  \n因此，倾向于通过定性方法进行针对性研究。该方法旨在针对相关部门的少数人员，并从他们的经验中提取价值。这确保了对“现状”和“理想状态”有更好的理解。\n\n\
  本研究的核心问题是，阻碍公共部门为打击欺诈进行个人数据共享的法律障碍是否存在。因此，分两个阶段进行：调查和访谈。在整个研究过程中都考虑了所有的伦理因素。参与者提前通知他们的回复将不会用于研究之外的其他目的。大多数受访者来自公共部门，并受公务员准则的约束。为了确保不泄露敏感信息，受访者被要求不要填写详情或任何导致其身份识别的信息。没有受访者被强制参与。研究的主要发现如下：\n\
  \n- 需要开展更多工作来改进政府的数据共享。\n- 有效的数据共享有助于打击公共部门的欺诈。\n- 最后，本研究最重要的问题是\n    - 隐私和保密担忧（包括限制访问的政策和法律）是群体中最关注的问题。\n\
  \n\n\n\n\n- 紧随其的是对数据共享权限被误读的恐惧。\n\n## 7: 批判性讨论\n\n核心目标是考察防止公共部门更广泛数据共享的“感知”法律障碍。虽然通过共享数据来改进欺诈检测与预防是本研究的背景，但这同样适用于受数据共享影响的其他政府职能。\n\
  \n公共部门无休止的数据共享已经持续了相当长，主要是为了改进政策制定和统计目的。\n\n还存在其他关注的问题，例如数据的保护和安全，但这些不在本章的讨论范围内。\n\
  \n值得注意的是，政府在公共部门的数据共享方面已取得了一些成功。诸如 `National Fraud Initiative`（国家欺诈计划）和 `CiFAS`\
  \ 等计划在通过数据共享解决欺诈方面取得了进展，但研究表明，尽管现任政府和上届政府致力于建立联合政府来打击欺诈，但这种增长是碎片化的。\n\n根据这项研究，阻碍数据共享的关键因素似乎是对法律框架以及其与数据保护、人权和普通法之间关系的困惑和误解，并与新的隐私立法及\
  \ `GDPR` 相重叠。这些因素结合在一起可能导致了过于谨慎的做法。\n\n这种困惑问题因媒体强调的大规模信息滥用而进一步加剧，例如，私人汽车夹扣公司使用 `Driver\
  \ and Vehicle Licensing Agency (DVLA)` 数据库来执行民事违停处罚，或滥用监控技术来确定儿童是否住在当地学校的学区内。\n\n\
  这项研究标记了公共部门数据共享的三个不同维度。这本身构成了批判性分析的一部分。这些维度如下：\n\n- 行政权力，公共机构必须拥的数据共享权力；\n- 普通法，保密义务；\n\
  - 法定规章，如 `GDPR`\n\n### 7.1: 行政权力\n\n数据共享必须由规范数据共享支持的服务或政策的特定立法涵盖，因为没有通用的披露数据的立法权力。\n\
  \n公共机构需要拥有共享的行政权力（`vires`）。这些权力要么源于首要立法（例如 `HMRC`），要么通过普通法产生（例如 `DWP`）。其中一些权力还规定了为某一目的收集的信息可能被用于另一目的。\n\
  \n如果机构的行由于由于其行为超出了有限的法定权力范围，则被称为`越权行为`（`ultra vires`）。接收方也必须拥有接收数据的法律权力。\n\n必要权力的范围将取决于相关数据的状态。权力大致分为三类：法定权力、隐含法定权力以及普通法权力或特权权力。\n\
  \n#### 明示法定权力\n\n引入此类权力是为了允许出于特定目的披露信息。在明示法定权力下的共享可以是强制性的，也可以是许可性的。\n\n例如：\n\n-\
  \ 强制性：`2003 年地方政府法》（`Local Government Act 2003`）的第 17(3)条。\n- 许可性：`1998 年犯罪与骚乱法》（`Crime\
  \ and Disorder Act 1998`）的第 115 条。\n\n这些权力通常包含在首要立法中，它们还提供了进一步共享信息的权力，但并没有共享义务。这可能会导致数据共享的文化问题，因为数据所有者需要被说为什么要共享。另一方面，同样的权力也可用于共享数据，例如根据`1997\
  \ 年警察法》（`Police Act 1997`）的第 V 部分进行披露。\n\n#### 隐含法定权力\n\n此类权力取决于机构的法律地位，并需要对立法中议会的意图进行解释。这些权力也取决于这些机构的功能和权力，例如，`1972\
  \ 年地方政府法》（`Local Government Act 1972`）的第 111(1)条规定“地方当局有权做任何……以促进、有利于或附属于其职能履行的事……”。\n\
  \n换句话说，公共机构可能因为合作义务而被要求共享信息。出于这一原因，为某一目的收集的信息可能用于另一目的。\n\n例如，`2002 年税收抵免法》（`Tax\
  \ Credits Act 2002`）附表 5 第 7 段允许 `HMRC` 披露为了与税收抵免、儿童福利或监护人津贴相关的职而持有的信息，将其提供给负责管理住房补贴或地方议会税减免的机构，或授权行使此类功能的人员。\n\
  \n#### 普通法或特权权力\n\n由王室部长领导的部门（例如 `HMRC`）也可以建立数据共享权力。这受到`2005 年税务专员法》（`Commissioner\
  \ for Revenue Act 2005`）的监管。\n\n##### Ram 原则\n在此豁免情况下的数据共享可能某些不明。在 1945 年，第一任议会法律顾问格兰维尔·拉（Sir\
  \ Glanville Ram）给出法律建议，王室部长作为王室代理，可以行使王室拥有的任何权力，除非根据法律禁止其这样做。\n\n### 7.2: 保密法\n\n\
  保密法可以通过同意放弃，或者，如果出于公共利益的需要，则披露可能是合法的，即披露保密信息需要与保密本身属于公共利益的事实进行平衡。这是关键所在。\n\n####\
  \ 7.2.1: 1998 年人权法\n\n（Human Rights Act 1998）\n\n一旦评估了共享数据的权力，下一步是评估个人信息共享计划是否违反了`1998\
  \ 年人权法`。数据共享的通道必须与人权法兼容。必须注意的是，这项权利不是绝对的，该法认为需要在社会与个人之间进行平衡，在某些情况下干预是合法的：\n\n- 国家安全\n\
  - 公共安全\n- 经济保护\n- 预防犯罪和骚乱\n- 健康或道德保护\n- 他人的权利和自由保护\n\n但这种干预必须符合法律，并在数量和范围上都是比例的。\n\
  \n这意味着公共机构必须证明，没有其他能够以对个人隐私权更小侵入的方式来实现欺诈检测与预防的目的。\n\n欧洲人权法院考虑过许多涉及公共机构之间披露个人数据的案例。\n\
  \n在 `M.S. v Sweden` 案（申请号 00020837/92，1997 年 8 月 27 日）中，申请人对其申请工伤赔偿后将其病史披露给瑞典社会保险局的行为提出异议。该披露是根据瑞典法律的相关规定进行的，即《秘密法》（`Secrecy\
  \ Act`）和《保险法》（`Insurance Act`）。\n\n法院发现该披露未违反《欧洲人权公约》第 8 条，原因如下：\n\n\n\n\n\n1. (a)\
  \ 这种干扰具有法律依据。\n2. (b) 披露的目的是确定公共资金的分配，因此是在追求一种正当目标，即国家的经济福利。\n3. (c) 披露是必要的，因为医疗记录与申请人的赔偿请求有关。\n\
  \n此外，披露受到有效且充分保护措施的约束，因为相关法律规定了适用的保密义务，一旦违反将面临刑事和民事处罚。因此，该措施与所追求的目标相比并不不失比例。\n\n\
  ### 7.3 通用数据保护条例 (GDPR)\n\n`GDPR` 并没有为数据共享创建法律规定的通道。在考虑《数据保护法》（`Data Protection\
  \ Act`）任何限制之前，个人或组织必须已经拥有共享信息的权限。\n\n如果共享涉及个人数据（这在预防和检测欺诈目的中极有可能发生），但要求从数据收集开始的整个过程都必须履行数据保护义务。\n\
  \n这些义务主要由作为数据所有的数据控制者承担。数据控制者是否真的是公民数据的所有者则是另一个问题。数据控制者的一个非常简单的定义是“决定个人数据将如何处理或出于何种目的处理的机构或实体”，这可以作为考虑最合适的法律依据的良好参考。\n\
  \n尽管处理个人数据有六种法律依据，但“公共任务”作为共享欺诈数据的法律依据，是出于预防欺诈目的处理/共享个人数据的适当法律依据。\n\n公民的同意是基于欺诈检测目的处理其个人数据的金标准。这并非总是可能的，也并不可，因为给个人增加了行政负担且成本高昂，例如，如何处理同意或应采取何种形式的同意。而且同意可能满足一个特定目的，而无法满足公民数据用于其他目的的进一步用途。除非在正在接受调查的少数检查中，否则极少为了欺诈目的从公民那里收集数据。这导致公民联系相关部门停止共享他们的数据，因为他们撤回了同意。但现实是，政府部门有处理公民数据的法律义务，因此“法律依据”是最合适的选择。\n\
  \n此外，`ICO` 建议，在无论是否获得同意、个人数据都可能被共享的情况下，这会让个人认为他们拥有真正的选择权。寻求同意从本质上是不公平的，并且可能违反数据处理原则，该原则规定信息必须公平且合法地使用。\n\
  \n普通法保密法也需要考虑进去，一般规则是，在存在法定义务或法院命令要求披露，或者在无论个人是否同意都必须进行共享的情况下，不应征求同意。\n\n因此可以很有信心地说，对于几乎所有出于预防欺诈目的的共享，“执行法律规定的为了公共利益的特定任务；或行使法律规定的官方权力（例如，法律规定的公共机构的任务、职能、职责或权力）是适当的。\n\
  \n所以，问题似乎并不在于规章本身，因为它为数据共享提供了一种敏感的方法，因为它既不限制也不促进数据共享。相反，它提供了一系列原则和何时处理个人信息可以是公平且合法的情况。\n\
  \n因此，为了让数据共享和 `GPPR` 协同工作，(a) 必须建立法律依据，(b) 必须公平地处理，(c) 建立并证明“必要性和比例性”，以及 (d) 通过隐私通知对数据主体透明目的，并赋予数据主体不被侵犯权利和自由的权利。\n\
  \n#### 7.3.1 《2018 年数据保护法》\n\n`GDPR` 应与《2018 年数据保护法》（`Data Protection Act 2018`）并列阅读，即：\n\
  \n1. (a) “司法行政”，\n2. (b) “行使由制定法或法律规则授予个人的职能”，\n3. (c) “行使王室、王国大臣或政府部门的职能”。\n\n\
  ### 8 《2017 年数字经济法》\n\n引入《数字经济法》（`Digital Economy Act`）是为了简化并使公共部门打击欺诈的数据共享更加高效，但受到跨部门数据共享更开放环境的限制，使其成为可选的而非强制性。例如，由税务和海关总局（`Revenue\
  \ and Customs`）披露的个人信息只能在获得“税务和海关总局”同意的情况下，用于最初披露目的之外的。这意味着反欺诈权力是许可性权力，这意味着潜在能够根据这些权力共享信息的人可以选择是否这样做。这里的风险在于，相同目的的通道要么太窄要么太宽，而且由于过度谨慎的态度，机构可能会选择较窄的通道，从而限制了高效有效的使用。还存在对非法访问或导致违反保密性的错误的担忧。\n\
  \n### 9 结论\n\n及时的信息共享对于公共部门打击欺诈具有巨大作用，因为公共机构持有许多包含丰富数据集的数据库。这可以被用来识别欺诈模式或已知的欺诈者，或者突出尚未发现的欺诈，或确认欺诈模式。\n\
  \n政府内部的大部分数据包含在“孤岛”中，由于法律框架复杂，当局发现很难理解他们持有的哪些信息可以协助其他部门打击欺诈。\n\n此外，近期主流媒体高度报道的信息安全事件引起了人们的疑虑，并让公民对：为某一目的提供的数据是否真的可以用于完全不同的目的。\n\
  \n结果，数据共享的命运通常导致两种结果：要么推迟共享决定（尽管有其收益），要么根据感觉而非法律规定做出共享决定，例如最近的英国医疗系统（NHS）与内政部（Home\
  \ Office）乱剧。\n\n`GDPR` 最近也导致了一些这种困惑；虽然不是 `GDPR` 的错，但由于错误的解读，它让公民感到他们对信息的如何处理或共享拥有真正的选择权。\n\
  \n\n\n\n另一个复杂性在于出于欺诈目的处理个人数据的合法依据，即 `GDPR` 第 6.1.(e) 条。虽然这听起来像是一项新的 `GDPR` 要求，但它与\
  \ 1998 年《数据保护法》附录 2 中关于出于公共性质功能处理数据的旧条件相似。要符合此项要求，必须考虑基于此通过的法律文件是否在此语境下预见了公共任务（[edps.eurpoa.eu](http://edps.eurpoa.eu)，第\
  \ 6 页）。\n\n因此，`GDPR` 原则本身并不算有效数据共享的障碍，与其说它们既不抑制也不促进这种共享。相反，它仅提供了一个框架，在个人保护与由此产生的收益之间取得平衡。\n\
  \n目前，尚无通用的法定权力允许公共机构共享数据，每当信息共享时，公共部门组织都必须经过创建或寻找合适的法律“网关”的过程，以安全的方式实现共享。\n\n法律赋予的权力允许公共机构在特定情况下或条件下共享数据，这为数据共享问题增加了巨大的复杂性，因为存在许多网关。例如，税务海关总署（HMRC）有超过\
  \ 260 个网关，养老部（DWP）有 60 多个网关。这些网关遍跨 50 多部法律。\n\n需要对当前法律框架在公共机构收集、使用和共享个人数据的现有权力方面的运作，以及这些权力与数据保护条款之间的相互作用增加关注，并且必须遵守以下原则以恢复公众信任：\n\
  \n*   充分性、相关性和比例性：“与其收集和/或进一步处理的目的相比，是充分的、相关的且不过分的的”；\n*   准确性：“准确的，并在必要时保持更新”，且“必须采取一切合理措施确保不准确或不完整的数据被删除或纠正”；\n\
  *   公平性和合法性：“公平且合法地处理”。\n\n## 参考文献\n\n# 8：使用区块链和零知识证明保护数字证人身份\n\nLynton Lourinho^(a);\
  \ Stefan Kendzierskyj^(b); Hamid Jahankhani^(a)\n\n^a 英国伦敦，诺森布里亚大学\n\n^b 英国萨里郡，Cyfortis\n\
  \n## 摘要\n\n数字证人概念以物联网（`IoT`）为基础，这带来了严峻的隐私挑战和关注。数字证人通过数字监管链向授权实体交付数字证据。本章提供了一种替代方法，让数字证人背后的用户能够通过去中心化标识符来披露或匿名化其身份，以解决隐私担忧。该模型范围定位于城市环境中，以演示攻击和犯罪。在区块链环境中使用了一种新方法，通过数字证人生态系统内的零知识证明来身份验证和验证成员。该模型基于自主方法，以以无偏的方式验证交易，威胁模型为应对模型威胁的缓解策略奠定了基础。文中提供了进一步的研究建议，以鼓励对需要研究的领域扩展该概念。\n\
  \n### 关键词\n\n数字证人；区块链；身份；身份管理；去中心化；自主\n\n### 缩写\n\n`BC` 区块链\n\n`CIA` 机密性、完整性和可用性\n\
  \n`DC` 数字保管人\n\n`DCoC-IoT` 物联网数字监管链\n\n`DE` 数字证据\n\n`DI` 数字身份\n\n`DID` 去中心化标识符\n\
  \n`DLT` 分布式账本技术\n\n`DPoS` 委托权益证明\n\n`DW` 数字证人\n\n`IdM` 身份管理\n\n`IdP` 身份提供者\n\n`IoT`\
  \ 物联网\n\n`KYC` 了解您的客户\n\n`OCP` 官方收集点\n\n`PI` 物理身份\n\n`PoS` 权益证明\n\n`PoW` 工作证明\n\n\
  `RP` 信赖方\n\n`SE` 安全元素\n\n`SSI` 自主身份\n\n`SSO` 单点登录\n\n`TPM` 可信平台\n\n`ZKP` 零知识证明\n\
  \n## 1：引言\n\n到 2030 年，全球超过 60% 的人口将居住在城市中。`IoT`、智能技术和非人类实体发挥着重要作用。数字证人（`DW`）概念是这种方法，可以通过数字监管链（`DCoC`）向授权实体提供数字证据（`DE`）。该概念可以帮助城市居民协助当局，并可能满足个人的安全考量。\n\
  \n### 1.1：身份\n\n身份可以定义为是特定个人或作为自己而非他人，身份的核实可以定义为建立或识别特定个人或对象的行为。最初，识别用于社交互动，后来才出于经济原因使用。用于社交互目的特征可以定义为物理外貌和语音识别，它们依赖于人类记忆，但随着经济交易变得复杂，个体之间对交换更多信息的需求产生了。信息系统背景下的身份可以分为两大大类：物理身份（`PI`）和数字身份（`DI`）。\n\
  \n### 1.2：物理身份\n\n识别个人的目的是将身份与数据流关联，以便将数据与个人联系起来。表 1 可以作为区分正式身份识别各种特征的依据。\n\n表 1\n\
  \n正式身份识别的特征。\n\n| 定义 | 特征 |\n| --- | --- |\n| 外貌 | 个人的长相 |\n| 行为 | 个体如何相互互动 |\n\
  | 姓名 | 其他人如何称呼个人 |\n| 代码 | 组织如何称呼个人 |\n| 知识 | 个人知道什么 |\n| 令牌 | 个人拥有什么 |\n| 生理 |\
  \ 个人本质是什么 |\n\n\n\n\n\n出示国家身份证、护照或驾照等可接受的方法已用于验证个人信息（PI），但这些方法容易被盗取，并且可以被篡改和伪造。\n\
  \n一项研究显示：\n*   篡改出生登记日期；\n*   为个人公民发放双重身份证；\n*   包含错误父母姓名的身份证；\n*   公民在其他公共机构记录中被显示为死亡，但在其自身的数据库中未更新。\n\
  \n这些示例表明人们对该国家的治理流程存在怀疑，导致了公民信息的机密性、完整性和可用性（CIA）缺乏保障。身份保障取决于最初捕获、传输和存储的信息类型，而保护这些数据面临着隐私、技术和安全挑战。在人口不断增长的背景下，证明公民身份的进一步挑战增加了政府和许多全球实体寻求成本效益解决方案的压力。许多国家依赖生物识别进行注册，尽管通过生物识别进行身份入库已证明证明由于存在假阳性和假阴性错误率，这种方法是不可靠的。\n\
  \n### 1.3: 注册机制\n\n生物识别是一种物理安全机制，通过身份验证拒绝未经授权的访问。这种安全过程被称为生物识别认证，它依赖个人独特的生物特征来正确识别个人。这些特征可以代替密码来验证和识别个人，因为它们与个人紧密绑定。网膜、虹膜、面部、指纹或掌纹都是唯一的，但是。\n\
  \n该过程的一个重要部分是用于比较所呈现信息与记录信息的方法，因为大多数最常用的方法仍使用签名和照片对比来执行大多数交易。这些方法是靠的，当进行对比的人不认识该个人时，更是不可靠。\n\
  \n### 1.4: 公民信息的存储\n\n一项相关的案例研究由：\n\n![图 1 注册机制。](img/f08-01-9780128214428.jpg)\n\
  \n图 1 注册机制。\n\n从主数据库向备份数据库复制数据的明显问题是，主数据库中可能存在的任何不一致或受损的数据也将分发到备份数据库中。分布式账本技术（DLT）防止了这些不一致性，并提供了额外优势，如不可篡改性、审计性、透明度和去中心化，以维护\
  \ CIA。DLT 有时与区块链技术（BC）混淆，尽管两者之间存在紧密的关系，但存在明显的差异。\n\n合同法通常关注双方之间协议的真实性，特别是在普通法司法管辖区。\n\
  \n一个例子是反洗钱/反恐融资立法，要求金融机构识别每一位客户；该要求被称为“了解你的客户”（KYC）。KYC 流程需要初始的人面对面谈，申请者提供一系列原始身份文件以完成\
  \ 100 分身份检查。KYC 是在 2001 年根据《美国爱国者法案》引入的，并在 9/11 事件后不久通过，以震慑恐怖主义行为。\n\n### 1.5: 数字身份\n\
  \n真实的身份可以通过数字身份（DI）在在线环境中使用，关于实体的属性通常被称为声明（claim）。DI 可用于进行交易，关于实体的属性通常被称为声明（claim）。DI\
