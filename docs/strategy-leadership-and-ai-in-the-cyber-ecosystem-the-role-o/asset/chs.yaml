  \ 研究方法论\n\n将开展一项关于社交媒体营销策略如何影响政治竞选期间选民偏好和投票决策的描述性研究。这一研究范式适用于本研究，因为“描述性研究的目标是描述一种现象及其特征。这项研究更关注发生了什么，而不是为什么发生”（\n\
  \n\n\n### 研究哲学\n\n为了制定本研究的哲学和方法，将采用“研究洋葱”（research onion）作为指导。研究洋葱是由……开发的\n\n###\
  \ 研究方法\n\n本研究的方法是归纳法，根据……\n\n### 数据收集方法与策略\n\n本研究的数据将通过初级和次级研究获得，首先在完成实地研究之前通过文献综述。尽管之前的小节提到由于本研究的性质，仅使用定性方法会方便，但在特定情况下，本研究将结合定性和定量研究。这将对案例研究及其发现提供更更深入、更全面的理解，因为从两个不同的视角收集数据至关重要。因此，将通过针对哥伦比亚选民的调查来进行定量研究。这一决定得到了……的支持。混合方法的使用在社会科学研究人员中已变得普遍，因为他们不再将定性和定量方法视为对立面，而是认为它们是互补的方法，因为一个方法的缺点可以被另一个方法的优点所抵消。正如……\n\
  \n对于本研究，将收集横断面数据，这涉及到在某一时间点对样本或群体或现象的截面进行观察（\n\n### 调查\n\n将对拥有投票权的哥伦比亚公民进行调查，以了解他们对\
  \ 2018 年哥伦比亚总统大选的认知。调查旨在发现参与者认为社交媒体营销策略如何影响他们的政治偏好，以及这些策略在他们选举候选决策过程中发挥了什么作用。其主要目的是探索他们对选举数字竞选的意见和观点；因此，调查将提出有关他们对社交媒体作为政治和政治参与工具的认知的问题，以及他们对所用营销方法的看法，这些方法是否影响了他们的意见。调查特别适用于研究公众意见，以及衡量大量人口的态度和取向，对于兴趣收集原始数据以描述规模大到无法直接观察的人群的社会研究人员来说，这可能是目前最好的方法（\n\
  \n调查将包含一些闭式问题，要求受访者从研究人员提供的选项列表中选择一个答案，因为处理这些问题比处理开放式问题更容易（\n\n将采用雪球抽样（Snowball\
  \ Sampling）来选择调查参与者，从与研究人员接近的人开始，然后要求参与者将调查发送给他们认识的其他人，从而扩大样本量，并获得尽可能多的答案。Etikan\
  \ 等人简要地总结了雪球抽样为：“从初始受试者的便利样本开始，初始受试者作为‘种子’，通过他们招募第一波受试者；第一波受试者再招募第二波受试者；样本随之逐波扩大，像在山下滚球一样滚越大”（\n\
  \n#### 调查问卷设计\n\n调查问卷的设计受到文献回顾主题和发现的影响，文献回顾主要关注政治营销和参与中的社交媒体、数字营销中的口传传播，以及这些策略对公民投票行为的影响。调查的目的是证明本研究的假设，即作为政治营销工具的社交媒体在影响投票行为或选民决策方面发挥了重要作用。在调查设计方面，开头问题询问参与者的年龄，以更好地了解参与者的人口学特征。第二到第六题旨在揭示参与者通过社交媒体渠道进行的政治参与和表达，以及他们的政治活跃程度。第七和第八题涉及口传传播以及参与者在社交媒体上看到的内容是否影响他们的投票偏好。最后，第\
  \ 9 到 11 题与案例研究以及社交媒体在选举过程中的作用直接相关。\n\n大多数问题设计为 1-5 级李克特量表（Likert scale），带有选项，例如，“1，从不；2，极少；3，有时；4，经常；以及\
  \ 5，总是”。研究人员将把问题翻译成西班牙语，因为每个参与者的母语都是西班牙语，因此这被认为是帮助获得清晰结果的必要步骤。\n\n### 访谈\n\n将使用开放式问题的半结构化访谈来收集本研究所需的数据。“半结构化访谈基于开放式问题，它为访谈者和受访者提供了详细讨论某些话题的机会，赋予访谈者灵活性和自由，要求受访者详述答案或提供更多解释”（\n\
  \n\n\n\n\n我们将对五位受访者进行两种具有相似之处的访谈，受访者被分为两个小组，问题包含开放式问题，如“你怎么看”、“你感觉如何”以及“你是否认为”。第一组访谈将针对三位政治学专家进行，旨在发现他们对政治社交媒体营销的理解，以及这种营销如何影响政治和民主的动态。此外，访谈还将询问他们如何看待社交媒体作为政治传播工具的使用，以及这对当前的政治进程和竞选产生了什么影响。第二组访谈将针对两位人物，即两位总统候选人的竞选总监。这些访谈的目的是发现社交媒体在每位候选人竞选中的作用，这些政治竞选期间使用了哪些营销策略，以及这些策略在多大程度上影响了候选人获得的支持。\n\
  \n### 3.5.1 访谈问卷设计\n\n与调查问卷的设计一样，访问题的问题的是在回顾现有文献后开发的。第一组访谈的问题侧重于社交媒体与政治参与，以及这些对政治进程和民主的影响。第二组访谈的问题主要关注社交媒体在政治竞选中的作用，以及用于塑造选民偏好的社交媒体营销策略。两组访谈还共有三个与案例研究直接相关的问题，目的是发现受访者的不同观点。在此再次强调，这些问题将翻译成西班牙语，以获得更清晰的结果并避免混淆，因为每个受访者的母语都是西班牙语。\n\
