  \ Kingdom\n\n^e University of Law, London, United Kingdom\n\n\n\n在保修期间的故障识别非常复杂，这是因为产品设计复杂且采用了分布式制造。通常利用位于不同地理位置的各种供应链设施来制造特定产品。如果产品中的某个组件发生故障，它可能与由全球分布式供应链的其它部门采购和制造的其他组件相关联。因此，在这种多层次场景下，信息系统必须具备足够的集成性和响应能力，以便在网络生态系统中跨越供应链共享来自异构系统的数据，并做出主动的响应。为了实现这一目标，在本章中，我们整合了来自多个数据集的保修数据。首先，使用了社交媒体数据集。消费者越来越多地在博客、论坛、Facebook\
  \ 和 Twitter 等平台上参与信息共享。这些宝贵信息很大程度上未被汽车制造商挖掘。为了探索大量的隐藏故障相关数据，我们使用了数据分析技术。然后，我们开发了一个基于云的协作框架，以管理来自其他供应链信息系统（即设计、制造和服务系统）的保修数据。该框架提供了对供应链多个数据集保修数据的集成和访问。所提出的“自主智能代理”交互辅助有助于建立跨供应链的实时保修数据交换。整合后的数据随后可供故障学习和修复智能体进行详细的专家分析。我们通过一个说明性的执行过程演示了该框架的执行。我们的贡献得到了详细说明，并为全球分布式供应链的保修管理提供了重要的管理见解。\n\
  \n\n\n\n本章的初步概念已在 2016 年 8 月 15-17 日于牛津大学举行的国际商业、经济、管理与营销会议（ICBEMM 2016）上介绍。\n\n\
  \n车辆故障是消费者和汽车制造商关注的焦点。在本章关注的英国汽车行业中，驾驶员和车辆标准局 (DVSA) 在过去十年内因故障已发布了 8400 多次召回，给汽车制造商造成了数百万英镑的支出\n\
  \n在现有文献中，社交媒体已用于商业智能，例如预测股市的波动（\n\n因此，来自社交媒体的数据可以促进初步的故障识别。这些有用数据随后应与供应链数据相结合，以进行详细且快速的故障分析。产品生命周期管理\
  \ (`PLM`) 是一种“战略业务方法”，通常用于管理和整合从设计、制造、服务到处置的生命周期。它是一种由信息通信技术驱动的方法，整合了流程、人员和业务系统。这种技术解决方案可用于简化跨供应链的信息流（\n\
  \n1. `标准化的产品开发工程模型，例如计算机辅助设计 (CAD)、计算机辅助制造 (CAM)、计算机辅助工程 (CAE) 和产品数据管理 (PDM)；`\n\
  2. `标准化的业务流程系统，例如制造执行系统 (MES)、企业资源计划 (ERP)、客户关系管理 (CRM) 和企业资产管理 (EAM)；`\n3. `通过\
  \ STEP（产品模型数据交换标准）实现的标准化且成熟的产品数据和元数据模型；`\n4. `面向服务的架构 (SOA)，即独立于任何软件和技术的用于信息共享的服务原则；`\n\
  5. `用于连接软件组件或企业级应用的开源中间件。`\n\nIT 的发展和标准化协议为从制造设计、建模到执行的各种业务信息系统的于集成铺平了道路。尽管 `PLM`\
  \ 概念提供了对产品元数据的集中访问，但在整个供应链中仍然是碎片化的。保修数据（对于制造中的故障识别非常重要）分散在整个供应链中。保修数据分析 (`WDA`)\
  \ 文献中提出的所有模型和技术大多应用于单个数据库。因此，需要将跨供应链多个数据集的保修数据集成到故障识别系统中。这将能够利用产品知识支持内部决策并改进跨供应链的故障识别。分布式制造行业中故障识别的集成模型非常稀见。在这项研究中，我们提出了可以用于集成保修数据的\
  \ `PLM` 原则。\n\n在过去，云计算技术 (`CCT`) 被用于整合供应链的多个部分\n\n鉴于这些准备工作，本章的主要目标是将来自多个数据集的保修数据集成到故障识别系统中。提出的基于云的\
  \ `PLM` 框架专注于来自社交媒体的故障数据。多智能体系统 (`MAS`) 用于通过自主智能代理的相互协作来实现保修数据的整合。整合后的数据随后可供故障学习和修复智能体进行详细的专家分析。该框架由若干个智能代理组成。这些代理能够在没有或极少人工干预的情况下做出决策。其中，供应链促进智能体\
  \ (`SCF`)、故障学习智能体 (`FLR`) 和设计智能体 (`Di`) 在故障分析中起着关键作用。基于云的 `PLM` 框架有助于产品短生命周期内的快速故障识别。我们利用来自多个数据集的故障数据评估了云框架的有效性。\n\
  \n在我们的分析中，发现社交媒体对于车辆故障信息非常有用。详细的故障分析是通过内容分析 (`CA`) 完成的。但在我们的分析中，我们也发现结果可能无法完全代表故障，并根据客户情感产生偏差。为了克服这个问题，提出了一个基于云的\
  \ `PLM` 框架来整合跨供应链的保修数据。这里描述的保修管理过程是为了简化从多个数据集收集保修数据。整合后的数据随后可供故障学习和修复智能体进行详细分析。最后，通过说明性的执行过程演示了框架的执行。\n\
  \n本章其余部分的安排如下。第 2 节简要回顾了故障识别的现有研究。第 3 节包含研究问题和贡献，第 4 节解释了利用社交媒体进行初步故障识别。方法论、结果和评估将在第\
  \ 5 节和第 6 节讨论。第 7 节详细讨论了基于云的框架。第 8 节阐说明了框架的执行。第 9 节识别了源自研究的若干管理启示。最后，第 10 节以总结性意见结束。\n\
  \n\n\n在过去的十年里，研究人员对保修期内故障产品的故障识别进行了广泛研究。\n\n图 1 故障产品的生命周期。\n\n退回的故障产品将根据保修索赔情况进行检查。通常，可靠性方面的文献假设保修索赔可以使用单个数据集进行评估。然而，在当今的分布式制造背景下，由于复杂的产品数据被存储在多个数据集中，这一假设可能不再成立。在这种分布式场景下，需要对来自分布式制造的多个数据集进行广泛的保修数据分析，以找到故障的主要原因。\n\
  \n\n1. (1) 故障早期检测。这里已经开发了多种技术和方法。\n2. (2) 设计改进。这对提高产品可靠性非常重要。\n3. (3) 现场可靠性估计。这是基于制造商的保修政策进行的。保修政策根据年龄或使用情况分为一维（1D），以及根据二维平面上的区域分为二维（2D），即一个维度表示年龄，另一个维度表示使用情况。研究人员已经使用混合分布、Weibull\
  \ 分布、混合 Weibull 回归、非均匀泊松过程、参数和非参数伪似然然、协变量和寿命分布分析了用于保修政策的一维方法。\n4. (4) 保修索赔预测。这用于分析保修涵盖期间的保修索赔成本。用于预测保修索赔的技术有寿命分布、随机过程、人工神经网络和时间序列模型。\n\
  5. (5) 保修索赔估计。\n\n文献综述表明，由于保修数据的分布式特性，复杂产品的故障识别既困难又复杂。WDA 技术和上述提到的统计方法使用单个数据集，这在分布式制造中并不十分成功。当今产品及其相互关联组件（子系统）的复杂性使得故障识别变得困难。\n\
  \n我们本章的核心观点是，迫切需要整合来自供应链多个数据集的数据，以便快速识别故障。设计人员和工程师在使用已开发的保修识别方法、工程技术和工具来识别和解决复杂产品的设计/技术故障时，应当结合相关的知识/数据。云计算技术（CCT）是一项相对较新的技术，可以将整个制造供应链数据集成到制造公司自己的私有云上。各种部署和业务交付模型使得大型企业以及中小型企业（SME）更容易采用。\n\
  \n\n在本章中，解决了两个主要研究问题：\n\n1. (1) 社交媒体是否包含与保修期间故障相关的大量信息？\n2. (2) 从多个数据集中整合保修数据对于复杂分布式制造供应链中的详细故障分析是否重要？\n\
  \n本章的四个目标如下：\n\n1. 目标 1 提取大量社交媒体数据用于故障识别（第 5 ）\n2. 目标 2 使用情感和内容分析评估故障识别的数据（第 6 节\
  \ B97801282144280000124.xhtml#s0070)）\n3. 目标 3 设计一个云框架以整合来自供应链多个数据集的保修数据（[第 7 节\
  \ B97801282144280000124.xhtml#s0115)）\n4. 目标 4 使用示例性的逐步执行程序阐明整个故障识别过程（[第 8 节 B97801282144280000124.xhtml#s0150)）\n\
  \n\n为了识别保修期间的故障，英国汽车行业探索了社交媒体数据。选择汽车行业作为该框架测试的对象是基于以下标准：首先，尝试阐明保修期间故障的初步识别；其次，审查了保修期内故障的成本影响；第三，探讨了保修期间客户对故障修复过程的感知；第四，评估了经销商在故障识别和修复方面的能力。需要强调的是，鉴于故障识别数据往往分散在供应链的不同部门中，这在目前是不可行的。\n\
  \n本章的研究通过利用社交媒体来源规避了保修数据可用性不足的问题\n\n### 4.1 用于故障识别的社交媒体分析框架\n\n从 Facebook 收集数据需要应用程序编程接口（API）。Facebook\
  \ 最常用的 API 是 `Graph API`。密钥 API 密钥用访问令牌来提取 Facebook 数据。它可以方便地跟踪留言板帖子（即评论）。网络博客没有像\
  \ API 那样的标准数据提取方法。但大多数博客提供富源摘要（RSS）来提取元数据。如果不可用，则可以进行手动网页爬取，这需要 HTML 解析。\n\n如前所述，在这些丰富且非结构化的社交媒体数据中导航需要各种研究方法和智能技术。\n\
  \n图 2 故障识别的分析框架。\n\n\n商业智能技术对于从多个角度（客户、竞争对手、供应商、市场、收购和服务）利用产品或过程信息具有重要价值，以便在竞争激烈的全球业务中取得成功。\n\
  \n### 4.3 内容分析\n\n社交媒体数据是“非结构化”的，由文本和表达式组成。可以采用各种文本挖掘技术从 Web 2.0 的海量文本数据中提取情报。\n\
  \n\nSA 是对主观信息的检测和分析，如意见、情感、情绪、产品、问题、故障、投诉和服务。\n\n\n到目前为止，很少有研究特别关注利用社交媒体进行商业智能的车辆故障识别。之前的研究已经通过手动标记在线论坛来获取产品质量信息。\n\
  \n\n为了更好地理解车辆故障报告，理想方法是对社交媒体进行实证研究。\n\n\n在抽样时，采用了一系列标准对数据进行分类。首先，将社交媒体中讨论的车辆分为三类：A\
  \ 类是豪华型，B 类是中端，C 类是低端。接下来，根据五个主题对数据进行编码：\n\n* 保修期间的故障类型：车辆带有特定的保修出售。客户在保修期内遇到某些故障，然后向经销商或主要制造商报告。保修期间故障的示例如下：\n\
  \n    评论：我们之前那辆车的刹车异声问题已经对刹车进行了拆解、清洁和磨合，但没有效果，因此又采集了声音样本，并判定需要更换新的卡钳。这是在购车 2 个月/行驶\
  \ 900 英里后。\n* 故障和成本影响：保修期内的某些故障在范围内，但另一些作为服务费收取，取决于责任判定。具有成本影响的故障示例如下：\n\n\n\n\n\
  \n评论：由于位置原因，保险丝盒是否处于容易受潮和水汽渗透的地方？更换的成本可能高达 600 英镑！\n\n*   **客户对故障修复的感知**：客户在特定期间经历过故障并进行修复后，对他们的车辆表达了某些“感受”。客户感知的示例例如：\n\
  \n  评论：像其他德国制造商一样，仅依靠名声和过去的声誉生存。汽车一旦故障就会变得过于复杂且昂贵，如果产品过早失效，制造商应该对其产品负责。不符合使用标准。所提到的这款奥迪有任何召回问题吗？\n\
  \n*   **客户对经销商能力的感知**：客户的感知很大程度上取决于他们从经销商处获得的服务。适当且具有效益的故障诊断对塑造客户对经销商能力的感知起着关键作用。经销商能力的示例如下：\n\
  \n  评论：在奥迪 Epsom 有过过极其糟糕的客户服务体验。我向奥迪英国投诉了，我本以为因为是新车他们会很快解决问题，但奥迪英国的客户服务和经销商一样糟糕，我永远再也不会买奥迪了，并警告你不要使用奥迪\
  \ Epsom。\n\n*   **垃圾信息（即无故障报告的表达）**：它包括车辆爱好者的表达、喜悦、照片、请求新车型信息、一般的车辆服务问题、车辆定制以及改装问题。垃圾评论的示例如下：\n\
  \n  评论：我和相当多的福特爱好者正在研究福特 Sierra（所有变体）维修覆盖板的供应情况。\n\n\n从来自 `CD` 和 `FB` 两个来源的共 51,467\
  \ 条评论中筛选出 898 条有用评论。下文中，首先对数据进行了详细阐述（第 7.1 节）。随后，进行了 SA 分析（第 7.2 节）。\n\n\n所选评论讨论了约\
  \ 29 种独特的车型。共有 3189 名用户提到了车辆故障以及对他们的车辆或经销商的感知。平均条评论包含 617 个单词，分布在 27 个句子中。179 个（37%）单词是唯一的，其中大多数单词平均包含五个字符。\n\
  \n## 6.2: 内容分析\n\n在本章中，应用了两种类型的 CA，如词汇分析和 SA。词汇分析包括频率分析（TF）、文档摘要和聚类。\n\n词汇分析：`CD`\
