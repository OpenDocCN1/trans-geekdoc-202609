  \ Z` 在攻击时是匿名的，除非受害者决定出来并披露身份，否则无法追溯到 `Z`。\n\n### 3.12: 场景 2\n\n场景 2 中的所有违规行为展示了以下内容：\n\
  \n- 基于 DLT 环境的自主权 IdM 方案如何利用 `DIDs` 将 `DWs` 与其用户绑定，尽管根据 `DID` 原则，将 `DIDs` 绑定到非人类身份（如智能道路基础设施）应该是可能的。\n\
  - 所有的 `DE` 如何与处理它的 `DW` 关联，并包含与犯罪行为的信息，这些信息还包括贯穿整个 IoT 和 `DCoC-IoT` 传输过程的标识符信息。\n\
