  \n### 4.2: 浏览器无痕模式\n\n许多人认为通过在网络浏览器中选择“无痕模式”，他们就不会被追踪，且网络浏览记录也会被隐藏。\n\n## 5: 结论\n\
  \n本综述阐明了数据经纪的过程，并举了这些问题在现实生活中如何体现的例子，强调了对数据画像以及第三方组织滥用数据的主要担忧。这些过程利用了应用程序和新兴技术固有的缺陷，而用户对此完全不知情。\n\
  \n\n\n随着许多消费者将物联网设备引入家庭以使生活更智能/高效或更便利，这导致了诸如 Amazon Alexa 或电视 Firestick 这样常见的家用设备会向第三方传递大量的个人信息。许多供应商将条款与条件（T&Cs）编写得晦涩复杂，情况变得更加复杂，许多消费者实际上并没有阅读它们，也没有拒绝的选择权，因为拒绝可能会无法使用部分或全部服务。知名智能设备应用的数据泄露是另一个令人担忧的因素，位置、摄像头、存储和联系人的访问权限，以及拨打电话和发送短信的能力都是默认开启的，而且大多数在大多数人并不知情的情况下开启。Spotify\
  \ 等大型企业出售其订阅者的数据（以及他们的位置），这可以根据用户选择的音乐、时间和位置来洞察用户的情绪。考虑到 Spotify 拥有超过 1 亿订阅者的事实，这意味着海量数据正在被自由地利用！\n\
  \n本章强调的最具争议的话题之一很可能是关于剑桥分析（Cambridge Analytica）丑闻。它展示了数据中间商的力量，引起了许多消费者/个人提高对现状、个人权限以及他们是安全的还是完全开放等问题的意识。正如剑桥分析参与的许多全球性事件所示，世界性的重大事件已受到针对个人进行政治微定位的影响。尽管剑桥分析已不再运营，但市场上还有许多类似的业务正在进行等的服务并影响着同样重要的事件，但尚未被曝光。问题在于，既然已经有这么多数据被画像化，且对大量消费者的数据程度已为人知，改变习惯现在还能对个人产生任何影响。目标广告甚至可以被用于弱势群体的激进化，如果像剑桥分析这样的公司有能力改变一个人的政治观点，营销公司就可以让消费者购买他们从未主观想要或想过需要的某种物品。这进一步引发了思考：什么能阻止恐怖组织利用相同的技术使人们激进化？这对于民主及其自由、便捷地访问媒体和数据的基石构成了潜在威胁。\n\
  \n社交 Wi-Fi 也被标记为关注点，因为它可以通过单次点击快速方便地登录商店的访客 Wi-Fi，并使用个人的社交媒体账户进行登录。虽然对个人来说很简单，但向商店提供了大量的个人数据并允许了许多权限。管理员有能力在商店内跟踪个人，并计算他们在某些区域停留的时间。他们还可以根据年龄/性别/喜好/在商店停留的时间甚至访问商店的次数来发送目标广告。商店还可以访问用户在使用\
  \ Wi-Fi 期间的网络浏览历史，因此可以判断他们是否在与其他商店进行价格比较。智能设备应用的数据泄露以及它们如何默认向第三方泄露数据，可以显示存在有多少追踪器，以及一些“危险”的权限，如访问用户位置、联系人和存储，以及代表用户拨打电话和发送短信。消费者可能没有意识到这种数据泄露的程度，大多数人如果知道这些发生会感到不适。\n\
  \n1890 年，沃伦（Warren）和布兰迪斯（Brandeis）在《哈佛法学评论》上发表了《隐私权》，建议每个人都有“独处的权利”，且这种权利应该受到法律的保护。\n\
  \n## 参考文献\n\n# 18: 数据作为货币和营销工具价值\n\nSumesh Dadwal; Anwar Haq; Arshad Jamal; Imad\
  \ Nawaz `^()` 英国伦敦诺桑比亚大学\n\n## 摘要\n\n数据货币（Data currency）是分配给数据的货币价值，用于识别其对组织的财务意义，因为它可以作为交易中的交换单位，作为唯一的支付方式，也可以与货币结合使用。\n\
  \n营销的目的是细分市场、瞄准正确的客户，并在合适的地点以合适的价格通过有效的促销为客户需求提供特定的解决方案。因此，数据是新石油。此外，许多欠发达经济体能够由于现代信息技术和通信技术（ICT）更快地增长经济。互联网用户经常自愿释放大量数据并在无意中产生大量数据残留。组织可以利用这两类数据进行业务规划、市场细分、客户定位和促销。公共和私营部门的小中型组织一直在开发各种业务模式，如数据即服务\
  \ (`DaaS`）、信息即服务 (`IaaS`）、答案即服务 (`AaaS`）、数据作为共享经济基础模式（`DaaSE`）以及数据作为货币（`DaaC`），将其大数据变现并实现数据作为货币的价值。各国政府在监管数据收集、管理、隐私、保护和利用过程中正发挥着日益重要的作用。问题是如何为数据赋值？本章提出了多种数据估值模型，如数据作为商誉、数据作为价值的整合以及数据作为法定货币。泛而言利益相关者特别是客户需要增加数据素养，以保护并将他们的数据作为货币使用。\n\
  \n### 关键词\n\n数据货币；数据作为货币；数据即服务 (`DaaS`)；信息即服务 (`IaaS`)；答案即服务 (`AaaS`)；数据作为共享经济基础模式（`DaaSE`）；数据作为货币的估值模型；数据作为价值的整合；数据作为法定货币\n\
  \n## 1: 引言\n\n货币是一种交换媒介，帮助我们跨越地理和时间创造并交换经济价值。数据具有这些每一个基本特征，并且已经许多业务交易涉及数据的买卖。因此，数据就是货币。数据现在非常有用，以至于它可以说是企业拥有的最有价值的资产之一。在全球范围内，过去十年中，按市场提供的产品和服务排名，名前十的公司是……。今天，前十家公司中有\
  \ 50% 是基于数据的平台，如 Google、Facebook、阿里巴巴和腾讯。这是市场看待数据价值方式的一个根本性转变。\n\n消费者、企业和设备（物联网）产生了大量的直接数据以及具有潜在价值的数据残留。业务组织利用这些大数据，为他们的客户和客主创建并提供价值主张。由于数据中存在这种潜在价值，数据对所有人都是有价值的，并被视为资产。企业希望将大数据作为资产进行资本化。因此，数据可以被视为一种可变现的资产或一种货币。\n\
  \n数据货币是分配给数据的货币价值，用于识别其对组织的财务意义，因为它可以作为交易中的交换单位，作为唯一的支付方式，也可以与货币结合使用。\n\n在 2013\
  \ 年的一报告中，德勤主张数据是新货币，并论了政府在建立数据货币方面将或应该扮演的角色。营销的目的是细分市场、瞄准正确的客户，并在合适的地点以合适的价格通过有效的促销为客户需求提供特定的解决方案。这都需要关于消费者和市场的信息。这些信息存在于数据收集中。营销人员对通用数据保护条例（`GDPR`）最常见的恐惧是他们瞄准客户的能力下降了。\n\
  \n\n\n\n数据驱动营销（DDM）是营销人员关注的焦点重点。因此，一个组织的成败取决于其对这种“新石油”的获取和利用。显而察觉的数字化转型已经改变了营销执行的有效方式。市场需要学习并应用`Big\
  \ Data`来开发客户洞察。根据美国福瑞斯特（Forrester Research）的预测，营销技术、营销自动化及服务的支出预计将从 2018 年的 960\
  \ 亿美元增加到 2022 年的 1220 亿美元以上。消费者以数字身份的形式为其数据赋予了货币性质的价值，并乐意以此换取资金或定制化解决方案。\n\n## 2:\
  \ 数据概念与货币概念\n\n数据是原始的、未经组织的事实，需要经过处理、组织、结构化，并以总结的形式呈现，从而对数据内部的模式产生逻辑意义。`DIKW 金字塔`（`数据-信息-知识-智慧`）描述了数据的重要性及其获取、处理、保留和解释。\n\
  \n货币是商品和服务的交换媒介。信息的概念多年年来不断演变。货币作为交换媒介的概念随着人类的演化而演变。随着时间的推移，它已经从涉及石块、贝壳和贵金属的物物交换体系演变为法币，即我们所说的硬通币。它仍在演变，如期票、游戏币、塑料货币（`信用卡/借记卡`）以及非接触式货币；`Bitcoin`以及货币的概念仍在以数据货币的形式演变。开发作为交换媒介的货币（即可以兑换商品服务的货币）的过程在未来也将持续。数据被视为货币，因为数据几乎具备交换媒介的所有特征。\n\
  \n普通人将硬币和钞票等货币视为国家政府中央银行发行的法定货币。然而，根据\n\n具有内在效用的货币：这组货币包括贵金属、香烟（二战后的柏林）、预付电话卡、储值智能卡等。（\n\
  \n代币型货币：代币货币没有太大的内在价值，它是当地使用的一种社交接触形式。这类货币的某些例子包括 17 世纪到 19 世纪的英国代币；英国使用的`Bristol\
  \ pounds`；马萨诸塞州的`Berkshares`以及加拿大的`salt spring dollars`（盐泉美元）（\n\n### 2.1: 中心化数字货币\n\
  \n此类数字承诺的货币由单一实体或组织进行中心化管理，通常该组织接受该货币作为商品服务的交换媒介。以数字形式交换的有价值承诺属于这一类。示例可能包括国家级零售商（如`Wal-Mart`和`Tesco`）的忠诚积分；航空公司的里程；以及金融或欢迎公司的其他忠诚奖励。此外，虚拟世界（Second\
  \ Life）的`Linden Dollar`或某些在线游戏货币也属于此类系统。通常，交易限于单一组织（\n\n### 2.2: 分布式–去中心化数字货币\n\n\
  这些包括去中心化的交换媒介，此类数字货币可以在商品服务的交易中与许多参与者和组织作为交换媒介。一系列加密货币，如`Bitcoin`、`Litecoin`、`Dogecoin`、Facebook\
  \ 的`Libra`等，属于分布式数字货币范畴（\n\n### 2.3: 数据作为货币\n\n一种作为交换媒介的新型数字承诺，具有分布式治理特征，并将数据的内在价值视为有形价值。这种媒介可以作为交换媒介使用，也可以由任何拥有有用可变现数据的人兑换。数据作为货币的价值在于其对利益相关者具有多种用途的潜在价值，由于此类数据的私有所有权，数据正成为国家商业和经济的新石油。\n\
  \n## 3: 数据效用与作为货币的价值\n\n钱或货币有三个功能：交换媒介、价值尺度和价值单位（Krugman, 1984, cited in\n\n## 4:\
  \ 为什么数据是货币？\n\n各种人物和国家经济政策制定者一直称数据为“新石油”（\n\n目前，数据被用作单向货币，因为它主要被视为针对目标消费者或接触公民的价值。然而，消费者或公民并没有看到其数据的巨大价值，他们也不会用数据交换任何价值。然而，在未来，随着意识的提高以及数据安全和隐私问题的出现，消费者也将开始看到其个人数据的潜在价值，并开始将数据视为货币。此外，组织从营销和广告等变现角度来看，会对富客户与贫穷客户的个人数据看到不同的价值。然而，在未来，当组织意识到每个人数据的价值时，他们可能会开始认为每单位数据都是等同的。因此，这种行为将与我们对待每单位货币相等的行为非常相似。\n\
  \n个人在连接互联网时留下的数据被视为“数据废气”，类似于交通工具的尾气\n\n### 4.1: 营销数据作为资产\n\n许多许多数据已成为有效营销和业务流程改进的主要驱动力。`Netflix`使用关于制片人、导演、演员和节目的消费者数据来开发未来的产品和节目。Netflix《纸牌屋》的成功归功于对客户数据的智能利用。同样，`Amazon`、`eBay`、`阿里巴巴`、`Google`、`YouTube`、`Facebook`、`Twitter`等公司的增长归功于他们智能利用客户数据进行未来增长的决策。\n\
  \n数据是货币，因为它被用于研发和创新。当组织跟踪在线位置和行为并提供优惠和解决方案时，想象一下`Amazon`在我们通过其平台在线购买东西时知道我们还会买什么！与搜索引擎（`Google`）和社交媒体（`Facebook`、`Instagram`）相关的组织通过将我们的信息或行为发送并出售给教育、银行、零售、旅游、交通等其他行业盈利。每个人都声称更了解消费者，这种知识对于其他产品和服务营销人员来说将是有价值的。传统上所谓的“屏幕爬取”（你在屏幕上看到的一切，你与之共享数据的人也能看到）是一个巨大的挑战。银行业已经意识到屏幕爬取的挑战，以及固定的密码作为数据废气如何被在线系统和欺诈者捕获并滥用。银行业已经提出了创新，即生成随机密码（开放银行中的`芯片和令牌技术`）以代替固定的用户名和密码。\n\
