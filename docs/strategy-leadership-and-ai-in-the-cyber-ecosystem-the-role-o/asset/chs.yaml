  \n`Table 2` 也说明，LinkedIn、Facebook、Twitter、Yahoo 和 Google 的用户每年通过其用户数据创造了约 93.48\
  \ 美元的价值。\n\n`Table 2` 揭示了一些实用的解释，例如市值作为若干位用户的比例。然而，这种关系并非线性的，而是多项式或对数-对数类型的，这类似于网络效应的价值。数据使用的类型越多，市值越高（例如，比较\
  \ Yahoo 和 Google）。大多数社交媒体或网络网站的收入价值约为 7 美元，但对于 Google 来说，每位用户高达 62.50 美元，是其他公司的九倍。\n\
  \n平均价值并非精确数字，因为由于用户活动等原因，每个用户的价值都不同。然而，这种反向工程提供了一种根据组织市值来估算数据货币价值的公平方法。\n\n### 8.\
  \ 数据作为货币的合法性\n\n任何货币不仅是交换媒介，而且是价值的法定支付手段，且这种货币必须由交易双方拥有。因此，任何货币必须满足某些要求，例如标准化的交换单位、具有法律约束力的法币，以及经济活动、国民收入、税收等的衡量单位。毫无疑问，数据是一种新货币。然而，在数据成为国际货币的法律有效支付手段之之前，还有许多逻辑问题需要解决。任何国家政府都必须建立系统，对数据作为货币单位进行估值、验证数据交易、将其纳入国家税收体系范围、解决不遵守数据作为货币单位的法律纠纷、确定使用数据作为货币交易的各种利益相关者的组织状态和角色，并围绕作为新货币的数据调整货币和财政政策。\n\
  \n### 9. 结论\n\n当数据转换为信息和知识时，它为有效决策提供了智慧和价值。未来在生活不同领域和经济中自动化和人工智能的使用提升了数据的价值，数据被视为商业和经济的“新石油”。数据具有潜在价值，因此可以被视为重要的交换媒介或物物交换；因此，数据也被视为一种新货币。\n\
  \n数据货币是赋予数据的货币价值，用以识别其对组织的财务意义。它可以被视为货币，因为它具备货币的三个基本特征：交换媒介、价值载体和记单位。互联网用户通常会自愿释放大量数据，也会无意中产生大量数据。组织可以利用这两类数据进行业务规划、市场细分、客户定位和促销。\n\
