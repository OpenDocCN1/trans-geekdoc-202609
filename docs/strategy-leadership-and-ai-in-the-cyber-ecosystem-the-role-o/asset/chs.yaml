  \ 年 3 月 9 日访问）。\n\n他们指出，黑客攻击是由于勒索软件的传播造成的，犯罪集团认为这是一项获利性职业；文中引用道（\n\n近年来最显著的攻击之一是对美国富信公司（Equifax）的攻击。\n\
  \n数据泄露针对的是用户身份，且此类活动大幅增加：“根据身份情报公司 4iQ 刚刚发布的数字，2018 年有 12,449 起泄露用户身份的数据泄露——与上年相比增长了\
  \ 424%。”他们对 4iQ 发布的结果发表评论，并说明这些信息是如何汇总的：“4iQ 使用对互联网可访问源进行自动爬取——包括社交媒体、深层网站和暗网——并由主题专家进行分析对数据进行认证和验证。”\n\
  \n观察另一个令人担忧的趋势是，在 GDPR 实施前的一年里，各机构未能向信息专员办公室（ICO）报告数据泄露；随着近期 GDPR 的实施，这在全球范围内敲响了警钟：“来自信息专员办公室的数据显示，企业在《通用数据保护条例》（GDPR）颁布的前年里，惯性地推迟数据泄露披露，并未能向\
  \ ICO 提供重要细节。”\n\n数据泄露是身份犯罪分子获取这些个人识别信息的方式之一，因此对数据泄露的任何应对都可能影响身份犯罪的发生率。\n\n## 2：数据泄露、身份盗用以及对机构的影响\n\
  \n自 GDPR 实施以来，许多跨国公司遭受了泄露。这些包括英国航空（British Airways）、万豪酒店（Marriott）和第一资本（Capital\
  \ One）。这些泄露情况在随后的文中有所：\n\n* • 英国航空\n英国航空泄露事件是自 GDPR 开始以来影响最大的数据泄露之一，并遭受了巨额罚款。\n\n\
  * • 万豪酒店\n万豪酒店集团在 2018 年也遭受了严重的数据泄露，影响了 5 亿名客户；某篇文章中提到\n\n* • 第一资本\n第一资本一直是一直是最重大的数据泄露事件之一；CNN\
  \ 报道了这次数据泄露是如何开始的。\n\n根据该银行和美国司法部的说法，佩奇·汤普森（Paige Thompson）被控闯入第一资本的服务器，获取了 14 万个社会安全号码、100\
  \ 万个加拿大社会保险号码和 8 万个银行账户号码，此外还有未披露的姓名、地址、信用评分、信用额度、余额和其他信息。根据第一资本的说法，此次泄露影响了美国约 1\
  \ 亿人和加拿大约 600 万人。\n\n再次可以观察到攻击者正试图获取个人信息，以可能实施进一步的身份犯罪。\n\n### 2.1：数据泄露\n\nHealth\
  \ IT Security 网站上一篇关于\n\n他们还讨论了机构如何通过尽早与客户就如何处理数据泄露开始对话，来减轻数据泄露的影响：“我们建议公司可以通过时间的推移，从第一天就开始与消费者建立对话。”他们还建议了进一步调查工作可以集中在何处，以进一步提高客户留存和满意度：“未来的研究可能希望使用更强但等效的形式来激发愤怒和恐惧（例如显示图像视频）。”我们的法律系统需要面对泄露危害，因为真实的成本是由个人和社会承担的，在这种假设的情景下，任何机构在未来\
  \ 12 个月内泄露的概率乘以受泄记录数——`50% * 25000 * 27 = 337500`。在这种情况下，CSO 现在拥有超过 `300000` 的收益来证明安全投资。\n\
  \n对机构的直接影响主要是财务方面的，体现在保护受害者身份的手段上。“互联网正日益成为个人个人生活和职业生活的通道。”这种数字生态系统通常需要在安全和不安全的网络之间传输个人信息，引入了新的信息安全和隐私问题，以及复杂的个人身份信息（PII）监管链。\n\
  \n### 2.2：身份盗用\n\n作为本研究的一部分，了解身份盗用对受害的影响对于理解他们遭受的情感和行为反应非常重要。\n\n他们有一个重要的观察，获取信息的恶意分子很少是执行后续欺骗的犯罪犯：“黑客收集的数据可能不会直接使用。它们会在私有论坛或受保护的\
  \ IRC 通道上批量出售。”\n\n试图分类身份盗用的问题在于，数字世界发展迅速，分类很快就会过时失效，或者需要添加新的类别。显而易见，2011 年不流行的社交媒体在\
  \ 2019 年已成为身份盗用的巨大来源。\n\n#### 2.2.1：数字身份计划\n\n已经有很多国家层面的计划，政府为其公民引入单一数字身份。最值得注意的是印度\
  \ 2009 年启动的 `Aadhaar` 数字身份计划。`Aadhaar` 为所有公民发放了 12 位的唯一身份号码。\n\n`Aadhaar` 意为“基础”，指的是由印度身份识别管理局（`UIDAI`）发放的\
  \ 12 位随机识别号码。该项目目前拥有超过 11.5 亿人的生物识别数据库覆盖了印度 85% 以上的人口，是全球最大的生物识别数据库。\n\n他们对 `Aadhaar`\
  \ 计划的问题及其潜在的利益冲突发表了评论：“印度最高法院正在审理一系列挑战 `Aadhaar` 宪性的诉讼，包括其与政府福利的强制关联、受益人被排除的可能性，以及对隐私的影响等。”\n\
  \n\n\n\nAadhaar 受到批评，是由于印度政府未能建立支持该计划的“法律框架”，且缺乏公信力良好的治理机构。数据泄露已成为常有的现象。\n\n在 2017\
  \ 年初，出现了一系列关于如何轻松找到错误发布到网络上的 `Excel` 文章。这些文件源自不同的印度政府部门，充满了 Aadhaar 号和人口统计数据，通过简单的\
  \ Google 搜索即可检索；其中一次由于编程错误导致的数据泄露，导致政府网站上公布了一万名 Aadhaar 养老金受益人的银行详情。\n\n来自萨达尔·帕特尔技术学院（Sardar\
  \ Patel Institute of Technology）的研究人员（\n\n通常情况下，许多国家都有不同的国家身份。例如，在印度，有多种方法来识别个人，如\
  \ Aadhaar、护照、驾照等。凭借区块链技术的可能性，所有此类身份都可以整合，并仅使用一种身份用于无尽的应用。\n\n（\n\n另一个特别受关注的引入了“智能城市”概念的计划位于新加坡；\n\
  \n该计划所实现的电子居民或虚拟居民身份的目标，是让该国非居民（不取决于其国籍和居住地）能够通过政府支持的、以智能身份卡形式颁发的数字身份（电子居民 ID），远程访问爱沙尼亚先进的数字基础设施和电子服务。\n\
  \n在该地区，丹麦还利用数字身份方案将人口与银行服务连接起来={`${丹麦的 Nem ID](https://www.nemid.nu/dk-en/)` 系统于\
  \ 2010 年启动，其增长速度与瑞典的 BankID 相似，银行和政府共同努力，甚至到了共同邀请技术升级招标的程度。”\n\n正如引用提到的\n\n中国正在发布国家身份证的数字版本，作为目前正在使用的实体卡的替代方案。该项目得到了公安部研究院以及中国主要银行等其他机构的支持。\n\
  \n马来西亚的一项计划也引起了《马来亚邮报》（Malaya Mail）观察者的关注。\n\n布布贾亚实施国家数字身份（ID）的计划是一个实现无缝数字交易的好主意，但几位技术观察者对其安全可行性表示怀疑。\n\
  \nFong 同意这一倡议是一个良好的举，特别是该国正向数字经济和工业革命 4.0 迈进，但他警告说数字 ID 更容易被盗窃。Tan 甚至认为，设计良好的系统甚至可以提高个人隐私，特别是对于依赖该系统的第三方。\n\
  \n麦肯锡公司支持此类计划，阐述了数字 ID Concept 如何增加经济价值；“数字 ID 有望通过增强包容性为这三个群体中的每一个创造经济价值，这种包容性提供了获得商品和服务的更大机会；通过增加正式化有助于减少欺诈、保护权利并增加透明度；通过推动数字化来驱动效率和易用性。”（\n\
  \n麦肯锡在研究中继续研究数字 ID 的总体普及情况。\n\n到目前为止，数字 ID 的采用情况参差不齐，表明有改进和增长的空间。目前存在 40 多个国家或非国家数字身份计划。仅印度就有约\
  \ 12 亿拥有数字 ID 的人，他们注册在 2009 年开始的 Aadhaar 计划中。\n\n他们指出，尼日利亚 `eID` 的采用在 2017 年停滞，“由于用于启动该计划的公私合作伙伴关系存在问题，以及整合由不同政府机构运行的\
  \ 13 多个独立身份系统的用途和功能困难。”这与本研究早早提到的海合会（GCC）国家形成对比，这些国家正在将公共部门作为概念验证。麦肯锡还对数字身份方案的经济价值发表了评论：“对巴西、中国、埃塞俄比亚、印度、尼日利亚、英国和美国的分析表明，各国通过实施数字\
  \ ID 程序，可以在 2030 年解锁等于其 GDP 3% 到 13% 的经济价值。”随着许多国家的增长因全球化而停滞，数字身份的概念可能是一个突破。## 3:\
  \ 研究方法\n\n认为收集数据最合适的方法是通过在线问卷。在线问卷由五个问题组成：\n\n1. (1) 继 `GDPR` 实施以来，考虑到你与大型组织的互动，你对安全有效性的感知是改善还是恶化了？\n\
  \n问题 1 旨在了解受访者对 `GDPR` 实施以来安全有效性的感知。这对于机构权衡安全性投入具有价值的见解。量表 1（恶化）到 10（改善）。\n\n2.\
  \ (2) 你有多可能订阅通过 `GDPR` 合规认证的服务，而不是不通过的公司？\n\n问题 2 紧接问题 1，关注 `GDPR` 合规性本身而不考虑安全性。该回答随后可用于评估问题\
  \ 1 的回答，以提供真实的背景和定性。量表 1（不太可能）到 10（更有可能）。\n\n3. (3) 如果一家机构发生严重数据泄露，你还会继续使用的服务吗？\n\
  \n问题 3 在构建时已经引入了 `GDPR` 和安全性的概念，并关注严重数据泄露。假设如果机构拥有良好的 `GDPR` 合规性和安全控制，如果他们发生了严重数据泄露，业务会受到何影响。量表\
  \ 1（不太可能）到 10（更有可能）。\n\n4. (4) 考虑到你可能用于在线申报或申请政府福利的个人数字身份，你是否愿意政府将其（共享）给商业机构以在线为你提供服务？\n\
  \n问题 4 引入了围绕数字身份以及公共身份与商业机构共享的核心研究目标之一。量表 1（不满意）到 10（满意）。\n\n5. (5) 在未来的 5 年内，你是否愿意为证明了安全有效性（即没有数据泄露）的数字服务支付更多费用？\n\
  \n问题 5 建立在之前所有问题的基础上，并询问受访者对于机构投入安全性的支出意愿。量表 1（不满意）到 10（非常满意）。\n\n\n\n\n\n## 4.1:\
  \ 问题 1：考虑到自 GDPR 实施以来你与大型组织的互动，你对他们网络安全有效性的感知是提高了还是恶化了？\n\n调查小组的回复结果表明，自 `GDPR`\
  \ 实施以来，网络安全有效性得到了极大提高。98% 的调查小组表示有效性至少保持不变或有所提高。7% 的受访者认为改进达到了最高水平。28% 的受访者表示有效性保持不变，而只有\
  \ 1% 的人表示有所恶化。\n\n这项很好地反映了 `GDPR` 法规的引入，服务用户认为网络安全得到了提高。极少数受访者表示网络安全实际上恶化了，这对欧洲监管机构来说是一个积极消息。随着欧盟在\
  \ 2018 年引入这项法规，他们可以声称这迫使机构改进网络安全，作为实现 `GDPR` 合规的方法之一。虽然引入 `GDPR` 法规对欧盟及其境内运营的机构来说成本是巨大的，但可以认为，由于网络安全有效性的提高已经节省了数十亿欧元。这反过来使欧盟对希望在该司法管辖区运营业务的投资者更具吸引力。这一点可以在文献综述中提到的爱沙尼亚得到证明，爱沙尼亚有一项数字身份计划，吸引个人在该国获得居留权，从而可能或随之产生投资。\n\
  \n## 4.2: 问题 2：你有多大可能订阅通过 GDPR 合规认证的公司的服务，而不是未通过认证的公司？\n\n在受访者中，97% 表示，他们订阅通过 `GDPR`\
  \ 合规认证公司服务的可能性要么与之前相同，或者他们更倾向于订阅。32% 的受访者表示选择 `GDPR` 合规公司的可能性最高。只有 1% 的受访者表示他们最不太可能订阅\
  \ `GDPR` 合规服务。有趣的是，15% 的受访者表示他们的可能性保持不变。\n\n延续调查中的第一个问题，受访者的结果显示出他们对符合 `GDPR` 的组织持有积极态度。公共和商业机构的执行人员可以在做出网络安全投资决策时利用这些信息。这可以作为一种谈判筹码，即投资网络安全本质上会带来\
  \ `GDPR` 合规性的提高，从而获得更大的客户留存和吸引力。这反映在商业机构资产负债表的改善上，并可能增加公共机构来自中央政府的资金。也可以认为，这反映了政府的良好，因为他们很好地管理民众的数据，从而在选举中获得更多选票。\n\
  \n## 4.3: 问题 3：你还会继续使用受严重数据泄露影响的机构的服务吗？\n\n95% 的受访者反应是，他们对继续使用发生过数据泄露的公司服务的态度降低了，或者没有变化。25%\
  \ 的受访者反应表示他们最不可能使用此类公司的服务。2% 的受访者表示他们更有可能使用此类服务。8% 的人表示，对于如何考虑受数据泄露影响的公司的想法没有变化。\n\
  \n延续调查的前两个问题，很明显，从这个问题的回答来看，人们不太可能使用曾遭受过数据泄露的公司或机构的服务。由于在欧盟遵守 `GDPR` 是强制性的，可以假设服务用户认为他们的数据正在被安全且有效地管理。如果以及当发生数据泄露时，可以认为人们对数据泄露原因的认知是该机构所展示的网络安全控制措施不力。这反过来导致对组织的信任和信心下降，并可能导致客户份额或对机构服务参与度的流失。这可能导致机构的失败，因此机构的执行人员必须仔细考虑对网络有效性的投资。这与……一致\n\
  \n## 4.4: 问题 4：考虑到你可能用于在线提交纳税表或在线申请政府福利的个人数字身份，你是否愿意政府将此身份（联邦）与商业组织共享，以便向你提供在线服务？\n\
  \n对该问题的回答表明，92% 的受访者对于公共和商业实体之间共享身份感到不愉快，或他们的感受保持不变。绝大多数（48%）受访者通过选择量表上的最负面评分表示他们不愉快。12%\
  \ 的受访者对该概念的感觉保持不变。2% 的受访者通过选择最积极评分表示对凭证的联邦感到非常愉快。\n\n在前面的问题中，答案说明了不符合 `GDPR` 合规或未证明网络有效性的公司将失去市场份额或客户。这个问题探讨了公共与私人组织之间在利用数字身份计划进行服务联邦方面的关系。再次，绝大多数的情绪是用户不希望他们的数字身份在公共和私人机构之间共享。在之前的之前的调查回答之后，这是一个令人惊讶的反应，因为无论\
  \ `GDPR` 如何，他们仍然对联邦持有负面看法。有大量数据泄露导致公共机构的身份被盗，这些结果证实了即使在引入 `GDPR` 之后，用户尚未准备好接受联邦服务。此外，在商业领域，`Capital\
  \ One` 数据泄露导致 140,000 个社会安全号码暴露，这种弱性可以归因于商业部门的网络控制。特别关注的是，联邦将被视为医疗部门组织之间的问题，因为他们托管了最敏感的数据，容易受到攻击，正如之前所述的……\n\
  \n海合会（GCC）国家已经意识到其民众的情绪，并对这项调查的回答表示认同。他们意识到，在与私人部门联邦之前，他们必须提高公共部门网络安全控制的有效性，正如之前所述的……\n\
  \n## 4.5: 问题 5：在未来 5 年内，你是否愿意为一家已证明网络安全有效性（即没有发生数据泄露）的数字服务支付更多费用？\n\n90% 的受访者反应是，对于展示网络安全有效性的公司，他们愿意支付相同或更多。15%\
  \ 的人通过量表上的最高评分表示他们愿意支付更多。4% 的人表示，即使公司网络安全更安全，他们也希望支付得更少。16% 的受访者意见不同，他们的支付意愿保持“大致相同”。\n\
  \n\n\n\n已经确立了关于 GDPR 合规、网络安全有效性以及公共与私营部门之间服务联邦的情绪。这个问题说明了用户对服务用户的情绪，以及他们是否愿意为这些服务支付更多或更少的费用。从结果来看，响应者表明，大多数用户愿意在未来\
  \ 5 年为更有效的网络安全控制支付更多费用。\n\n# 5：一个用于 GDPR 时代交付有效网络服务的拟议框架\n\n之前的章节关注了 GDPR 时代对网络安全有效性的社会态度。普遍观点是，由于\
  \ GDPR 的合规，网络安全有效性得到了提高，消费者愿意在服务上花费更多资金，以确保他们的个人信息得到保护。然而，对于任何执行人员来说，交付有效的网络安全服务是一项复杂的掌握和执行任务。通常，对网络防御投资的底层因素是可用预算，这些预算根据董事会的风险偏好进行了精细平衡和调整。在交付网络安全有效服务时，还需要考虑其他因素，这通常由董事会设定的目标决定。目标需要是可量的，以便对性能进行衡量，并向关键利益相关者（包括私营部门的股东和公共部门的普通公众）提供证据。在整个文献综述过程中，很明显，没有讨论过关于\
  \ GDPR 时代交付有效网络服务的框架。由于 GDPR 是一项如此新的法律，该主题的学术写作存在空白。因此，应用了目标与关键结果（`OKR`）框架，以通过商业实体的视角指导交付有效的服务。\n\
