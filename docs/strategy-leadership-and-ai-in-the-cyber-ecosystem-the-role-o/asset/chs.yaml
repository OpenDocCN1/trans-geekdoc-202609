  \ 类）的维修费用平均高于其他两个类别。正如预期，低端车辆（即 C 类）的维修费用最低（见表 2）。\n\n表 2：故障与平均成本。\n\n| 空格 | A 类\
  \ | B 类 | C 类 |\n| :--- | :--- | :--- | :--- |\n| CD 平均成本 | 1668 | 1675 | 627 |\n\
  | FB 平均成本 | 1400 | 2731 | 600 |\n| 合并平均成本 | 1534 | 2203 | 613 |\n\n\n\n在本节中，探讨了（报告的）故障与满意度之间的联系。有多种\
  \ SA 工具和技术使我们捕捉客户情感。出于研究目的，采用了建议的算法\n\n#### 6.3.1: 客户对故障修复的感知\n\n对保修期间故障修复客户感知的评论根据修复时间范围进行聚类。聚类标准如下：\n\
  \n*   非常好 (+2)：在一周内修复\n*   好 (+1)：在一个月内修复\n*   中等 (0)：在 1–2 个月内修复\n*   差 (−1)：在\
  \ 2–3 个月内修复\n*   非常差 (−2)：在 3 个月以上修复\n\n聚类过程完成后，使用了 WordNet（第 1.4 节）中的情感词。图 4 显示了聚合数据集层面（即两个来源）对故障修复的客户情感。\n\
  \n\n\n\n\n\n图 4 客户对故障修复的情绪。\n\n\n在保修期间，客户对经销商能力感知结果的评论也根据时间段进行了聚类。聚类标准如下：\n\n* \
  \  非常好 (+ 2): 经销商能力非常强\n*   良好 (+ 1): 经销商能力很强\n*   中等 (0): 经销商能力尚可\n*   差 (− 1):\
  \ 经销商能力差\n*   非常差 (− 2): 经销商能力非常差\n\n在聚类处理后，情感词被用于 WordNet（第 4.4 节）。`图 4` 显示了整个数据集层面（CD\
  \ 和 FB）客户对经销商能力的感知。\n\n\n上述简单的数据练习强调了保修期间故障识别的一些重要问题。首先，保修期间确实会发生故障，而且这些故障倾向于影响所有类型的车辆类别（表\
  \ 1）。A 类车辆更容易发生故障，而 B 类车辆最不容易发生故障。其次，故障识别和修复对客户都有成本影响。特别是与其他两个类别相比，C 类车辆的维修费用更低（表\
  \ 2）。第三，故障识别和修复可能是一个冗长且缓慢的过程。修复故障的时间越长，客户就越不满意（图 4）。最后，经销商识别和修复故障的能力至关重要。能力最差的经销商往往获得更高的负面情绪（图\
  \ 4）。\n\n从早期数据练习得到的关键教训是，大量的车辆故障数据隐藏在社交媒体中。但这些数据无法代表整体故障。此外，客户对车辆和故障的情绪也存在偏差。为了解决这个问题，整合来自多个供应链数据数据集的保修数据对于完整表示至关重要。整合后的数据有助于制造商快速识别故障。保修数据的整合已被详细研究。\n\
  \n然而，据研究人员所知，极少有整合来自分布式供应链数据的集成保修数据系统或框架。高科技行业由于分布式制造，受影响最严重。保修管理成本正在上升。\n\n为了解决这些问题，提出的基于云的框架用于管理来自供应链系统（即设计、制造和服务）的保修数据。由于保密性和对数据更大控制的需求，采用了私有云部署模型。因此，在框架内，基础设施托管制造商自己的私有云上。使用\
  \ SaaS 交付模型为跨分布式制造的供应链利益相关者提供服务。利益相关者从私有云访问并检索集中数据。他们还通过 SaaS 上传数据。这些来自多个数据集的集中存储数据随后被用于故障识别和决策。\n\
  \n\n概念模型如图`图 5`所示。制造商在其云上托管整个基础设施。由于数据机密性和安全原因，制造商采用了私有云部署模型。该框架由两个基于智能体的子系统组成，即供应链和制造，它们通过接口代理（IA）集成。两个子系统分别在`第\
  \ 7.1 节`和`第 7.2 节`中详细说明。两个子系统通过接口代理（IA）集成。两个子系统在文中进行了详细说明。SaaS 交付模型用于为跨分布式制造的供应链利益相关者提供服务。利益相关者从私有云访问并检索集中数据。他们还通过\
  \ SaaS 上传数据。这些来自多个数据集的集中存储数据随后被用于故障识别和决策。\n\n\n图 5 基于云的框架。\n\n概念模型如图`图 5`所示。制造商在其云上托管整个基础设施。由于数据机密性和安全原因，制造商采用了私有云部署模型。该框架由两个基于智能体的子系统组成，即供应链和制造，它们通过接口代理（IA）集成。两个子系统分别在`第\
  \ 7.1 节`和`第 7.2 节`中详细说明。SaaS 交付模型用于为跨分布式制造的供应链利益相关者提供服务。利益相关者从私有云访问并检索集中数据。他们还通过\
  \ SaaS 上传数据。这些来自多个数据集的集中存储数据随后被用于故障识别和决策。\n\n提出的框架为制造业提供了标准化要求的支持结构。它可以应用于任何行业，例如航空、国防和高科技领域。它提供了对服务数据的访问。\n\
  \n### 7.1: 基于智能体的供应链\n\n基于智能体的供应链子系统为供应链利益相关者（服务中心、现场测试中心、客户、经销商）提供访问，如`图 6`所示。该系统由多个软件代理组成，可以解决分布式制造环境的问题。\n\
  \n![图 6 基于智能体的供应链的数据流。](img/f03-06-9780128214428.jpg)\n\n图 6 基于智能体的供应链的数据流。\n\n\
  这些软件代理是智能计算机或机器，能够自主解决复杂问题。在供应链系统中，这些软件代理促进利益相关者之间的互动，即服务中心、现场测试中心、客户、经销商和零售商。基于云的智能体供应链系统的主要目的是提供数据的协作、交互、交换和共享。制造商的私有云通过\
  \ SaaS 为利益相关者提供访问。软件代理及其相应的功能简要总结在`表 3`中。\n\n表 3\n\n供应链系统代理。\n\n| 代理名称 | 功能 |\n\
  | :--- | :--- |\n| 供应链促进代理 (SCF) | SCF 是供应链系统中服务的主要入口代理。用于促进制造服务。具体而言，SCF 为所有供应链利益相关者提供服务，即经销商、零售商、客户、现场测试中心和服务中心。\
  \ |\n|  网关服务代理 (GS) | GS 代理充当制造商服务中心和现场测试服务的协调代理。GS 代理与 `SA` 和 `PF` 通信服务。 |\n| 保修代理\
  \ (WA) | WA 负责根据唯一产品/零件号或 RFID 维护保修信息。保修期间发生产品/零件的故障和问题通过保修代理更新到保修数据库中。这些信息对于设计人员设计新产品以及解决现有产品/零件的复杂问题非常有用。WA\
  \ 检索并更新所有保修信息，并通过发现代理 (`DA`) 进行更新。 |\n\n\n\n\n| 目录协调代理 (DF) | DF 代理为供应链子系统中的所有服务和现场测试中心代理提供注册服务。它帮助维护活跃服务中心和现场测试中心的妥当记录。当中心状态发生某些变化时，DF\
  \ 代理会更新注册表。 |\n| 服务代理 (SA) | SA 帮助为服务中心提供服务。保修期内发生的保修故障由服务中心报告。在对唯一产品/部件编号或 `RFID`\
  \ 进行初步筛选后，将从制造商云数据库中进行保修有效性检查，然后提供相关服务。保修期间的所有故障都将通过使用 `DA` 更新到保修数据库中。这些保修数据有助于通过分析先前的历史来帮助设计人员和工程师设计新产品。它还帮助他们在制造期间解决并修复保修故障。\
  \ |\n| 现场测试代理 (FT) | FT 代理监控产品在现场测试中心的性能。在性能测试阶段，现场性能数据被输入到现场性能数据库中。数据通过 `DA` 进行存储。现场性能数据对于设计人员和工程师的早期设计阶段有用。\
  \ |\n| 客户代理 (CA) | CA 代理为客户提供访问制造系统的权限，以便记录投诉和审阅产品。 |\n| 分销代理 (Dis) | Dis 帮助监控和跟踪现货产品的分销网络。它持有分销中心的库存/货物数据。Dis\
  \ 使用 `DA` 来更新和从库存数据库中检索信息。 |\n| 零售商代理 (RA) | RA 用于维护和跟踪产品的零售商网络。它持有零售中心货架上的产品知识，并在销售和库存数据库中更新这些信息。这些信息被分销代理\
  \ (Dis) 用于为零售商维持妥当的库存。`DA` 帮助在相关数据库中更新和检索数据。 |\n| 软件即服务 (SaaS) | SaaS 是一种用于访问云资源的软件应用程序。`SaaS`\
  \ 的主要目的是从云端的服务器池中访问、共享、交换和管理所需的产品数据。利益相关者可以从云端更新和检索信息。云访问还帮助不同位置的部门在协作和交互的环境中工作。\
  \ |\n\n## 7.2: 基于代理的制造子系统\n\n基于代理的制造子系统如表 4 所示。多软件代理的概念（如供应链子系统所示）也被应用于制造子系统。设计了具有动态角色和职责的代理来执行相关工作。制造商的私有云通过使用\
  \ `SaaS` 为利益相关者提供访问。软件代理及其各自作为服务的功能在表 4 中进行了简要总结。\n\n### 表 4: 制造子系统代理功能。。\n\n| 代理名称\
  \ | 功能 |\n| --- | --- |\n| 制造服务器代理 (MS) | `MS` 代理是制造子系统中的主代理。`MS` 代理的工作是设计新产品/部件、通过分析保修数据改进现有产品，以及识别制造过程中产品的故障。所有产品的设计、工作流、制造工艺、产品检查、早期设计阶段分析、产品内部及相互相关的参数检查都是通过\
  \ `MS` 代理的协助完成的。`MS` 代理通过 `DA` 更新和检索数据文件。`DA` 帮助在制造商私有云上的特定数据库中存储数据。 |\n| 营销代理 (MK)\
  \ | `MK` 代理负责决定设计营销策略。它通过分析保修、服务和客户反馈数据来制定营销策略。`MK` 代理通过 `DA` 获取相关数据。根据产品/部件的数据，为新产品/部件的设计制定营销策略。提取出的数据有助于制定满足客户要求的有效设计营销策略。\
  \ |\n| 产品开发代理 (PD) | `PD` 代理维护产品开发需求。`PD` 代理在开始新产品需求时创建一个新的 `PD`，并在产品开发完成后将其关闭。\
  \ |\n| 设计代理 (Di) | `Di` 代理持有产品设计。它根据规格和客户需求确保产品/部件的制造。`Di` 代理的主要工作是记录材料需求规格 (MRS)、工程量清单\
  \ (BOQ)、工艺计划、功能图和逻辑图。上述设计数据通过 `DA` 进行更新。 |\n| 设计改进代理 (DAI) | `DAI` 的任务是监控现有产品的改进。如果产品/部件在保修期内出现故障，`DAI`\
  \ 将从 `FLR` 代理、`MK` 代理和 `MU` 代理处获取建议。这些建议根据生产成本和资源可用性的标准被考虑。在修复故障后，通过 `DA` 更新设计和知识中的数据。\
  \ |\n| 新产品设计代理 (DAN) | `DAN` 负责新产品开发 (NPD)。在新产品/部件的设计中，`DAN` 从 `FLR` 代理、`MK` 代理和\
  \ `MU` 代理处获取建议。这些建议再次根据生产成本和资源可用性的标准被考虑。在分析之前的类似产品及其故障后，通过 `DA` 更新产品数据库中的数据。 |\n\
  | 供应商代理 (SA) | `SA` 为所有选定的供应商提供访问。`DA` 帮助供应商从 `STEP-NC` 产品数据库获取标准化设计。 |\n| 制造商代理\
  \ (MU) | `MU` 代理的主要工作是监控制造过程。当收到制造产品/部件的需求时，`MU` 代理首先检查其 `STEP-NC` 产品数据库。如果满足制造设计要求，则分配资源。`MU`\
  \ 代理还监控制造过程中的功能和设计故障。这些知识根据产品/部件进行分类，并存储在制造商的设计和知识数据库中。这些数据对于设计人员和制造工程师修复故障非常有用。\
  \ |\n| 组配代理 (AA) | `AA` 为所有选定的组配商提供访问。`DA` 允许组配商访问 `STEP-NC` 产品数据库以获取组配设计。 |\n\n\
  #### 7.2.1: 设计代理\n\n`Di` 和故障学习修复代理 (`FLR`) 是框架中识别故障的关键代理。这里将对这两个代理进行更详细的讨论。\n\n\
  `Di` 代理持有各种格式的设计，例如 `CAD`、`CAM` 和 `CAE`。`Di` 代理将 `CAD`、`CAM` 和 `CAE` 转换为标准格式，即扩展标记语言\
  \ (`XML`)。这些基于 `XML` 的设计文件随后存储在云集群中。`Di` 代理如图 7 所示。\n\n![图 7 设计代理。](img/f03-07-9780128214428.jpg)\n\
  \n图 7 设计代理。\n\n\n\n\n\n在第一步中，设计师将 `CAD`、`CAM` 或 `CAE` 格式的设计文件发送到数据格式定义数据库。在获取所需的数据格式定义后，将带有推导定义的相应文件转发到第二步中的软件应用程序\
  \ (`SA`) 根目录。软件应用程序根目录由 `CAD`、`CAM` 和 `CAE` 等各种软件应用程序的数据库组成。位于软件应用程序 (`SA`) 根目录的应用程序引擎根据引擎中设定的规则转换设计文件。然后，转换后的文件在第三步通过\
  \ `DA` 发送到云数据库集群。如果利益相关者需要产品/部件的设计或数据格式，则按顺序编译并格式化 `XML` 文件。格式化后的文件通过 `DA` 传输给供应链利益相关者，即供应商、制造商、组装商、服务中心和现场测试中心。\n\
  \n### 7.2.2: 故障学习与修正代理\n\n`FLR` 是识别现有/新产品故障的主要代理（图 8）。`FLR` 从云数据库集群中检索数据，例如`保修数据库`、`扩展保修数据库`、`现场性能数据库`、`服务中心`和客户反馈数据库、`参数数据库`、制造测量数据库和知识数据库。它结合了获得的知识、背景知识、设计以及制造工程师的专家知识，通过采用\
  \ 13 步方法规划实验。\n\n![图 8 FLR 代理算法集](img/f03-08-978012821428.jpg)\n\n图 8 算法集\n\n两个系统之间有两个共同代理，即\
  \ `DA` 和 `IA`。这些代理的功能如下：\n\n### 7.2.3: 发现代理\n\n`DA` 为所有代理提供云数据库访问。`DA` 持有数据库位置的详细信息。它有助于更新和检索数据。\n\
  \n### 7.2.4: 接口代理\n\n`IA` 促进两个系统之间的交互，即制造系统和供应链系统。两个系统使用代理语言 (`ACL`) 进行交互。\n\n第\
  \ 8 节包含了基于云的框架的逐步执行。\n\n## 8: 示例性云框架\n\n在本节中阐述了第 7 节中描述的框架执行。该框架可以应用于任何复杂的制造业。假设公司拥有全球服务和现场测试中心以进行故障识别。\n\
  \n![图 9 产品/部件故障识别流程图](img/f03-09-978012821428.jpg)\n\n图 9 产品/部件故障识别流程图\n\n框架中多代理交互进行故障识别的步骤说明如下：\n\
  \n*   第 1 步：客户代理 (`CA`) 通过社交媒体向 `GS` 代理报告故障。\n*   第 2 步：`GS` 代理通过 `DF` 代理将故障转发给区域服务代理\
  \ (`SA`)。\n*   第 3 步：服务代理 (`SA`) 联系客户并进行故障初步识别，并通过 `SaaS` 在框架中上传故障。然后，故障报告从服务代理\
  \ (`SA`) 通过目录代理 (`DF`) 转发到网关服务代理 (`GS`)。\n*   第 4 步：网关服务代理 (`GS`) 接收 `SA` 故障报告，并通过保修代理\
  \ (`WA`) 检查保修有效性。如果保修有效，则将请求转发到供应链协调代理 (`SCF`)，否则报告产品/部件不在保范围内。\n*   第 5 步：供应链协调代理\
  \ (`SCF`) 在接收请求后，从基于云的 `STEP PDM` 数据库提取元数据并通过 `SCF` 转发给服务代理 (`SA`)。服务中心根据元数据的建议修复故障部件。如果故障尚未报告，则通过\
  \ `SCF` 转发到制造系统。\n\n制造系统中的故障识别涉及后续文本说明的多个子步骤：\n\n*   子步骤 5.1：制造服务器代理 (`MS`) 通过 `IA`\
  \ 接收制造系统中的产品/部件故障报告。`MS` 代理将故障报告转发给产品开发 (`PD`)。\n*   子步骤 5.2：`PD` 代理创建一个新设计并将其发送给设计代理\
  \ (`Di`)。\n*   子步骤 5.3：`Di` 代理从 `PD` 接收产品/部件故障报告。`Di` 代理通过 `DAI` 从 `STEP PDM` 数据库检索产品/部件详情（即元数据）。\n\
  *   子步骤 5.4：`DAI` 将故障报告转发给故障学习与建议代理 (`FLR`)。`FLR` 代理从云数据库集群中提取所有与故障的数据。将获得的知识、背景知识、设计和制造工程师的专家知识结合以规划实验。根据计划的实验，算法集（见[第\
  \ 7.2.2 节](#B9780128214428000124.xhtml#s0135））通过运行不同的算法找到故障的可能解决方案。根据 `FLR` 的建议，`DAI`\
  \ 产品/部件设计并将更新的无故障设计转发给 `Di`。\n*   子步骤 5.5：`Di` 代理与 `MK` 和 `MU` 代理协作重新检查改进的设计。`Di`\
  \ 代理还根据成本和资源可用性寻求建议。如果成本符合营销要求且资源可用，则制造商将更新的设计转发给 `PD`；否则，根据成本和制造商资源可用性发回 `DAI`\
  \ 进行进一步的设计改进。\n*   子步骤 5.6：`PD` 代理随后更新 `STEP PDM` 数据库、制造工艺数据库以及设计和知识数据库中产品/部件改进的设计。最后，关闭产品/部件的\
  \ `PD` 请求并转发给 `MS` 代理。\n\n通过制造系统交互进行产品/部件故障识别程序在此结束。\n\n*   第 6 步：`SCF` 从制造系统接收改进的无故障设计。产品/部件更换/修正的建议发送给\
  \ `GS` 代理。\n*   第 7 步：`GS` 代理将故障解决方案或产品/部件转发给 `SA`。\n\n## 9: 管理意义\n\n本章提出的整合多个数据集数据以识别保修期间故障的框架。通过利用\
  \ `CCT` 的服务，制造商的中心平台整合了整个供应链。所提框架对于资源、基础设施、IT 意识和运营经验有限的大型以及中小企业经理来说非常有用（本章认为，通过有效整合保修数据，该框架使故障识别变得更容易。此外，经理可以持续监控故障及其修复进度。存储在云仓库中的故障数据可以帮助工程师、设计师和决策者在未来制造更健壮的产品）。\n\
  \n\n\n\n目前，已有一些关于保修期间故障识别的有趣文献和模型可供参考。然而，业务世界变得日益敏捷、竞争激烈且瞬息万变，因此具有技术改进和管理理论的新框架的出现可能会带来不同。因此，为了解决这一问题，本章的目标是探索如何利用云计算技术作为载体，整合来自多个数据源（例如社交媒体和供应链）的数据，以辅助故障识别。本章提出的框架使用了\
  \ `PLM` 概念，这是一种可以用于优化跨供应链信息流的解决方案解决方案。\n\n已实现以下目标：首先，提取了大量的社交数据用于车辆的故障分析。其次，对于故障识别，使用情感分析和内容分析对数据进行评估。第三，设计了一个基于云的框架，以整合来自供应链多个数据集的保修数据（注：此处应为保修数据）。出于保密性和对数据更大的控制力，制造商采用了私有云部署模型。基础设施托管在制造商自己的私有云上。使用\
  \ `SaaS` 交付模型为跨分布式制造的供应链利益相关者提供服务。社交媒体用于初步故障识别，并通过将数据集成到框架中最终实现故障恢复。最后，通过一个说明性的分步执行程序阐明了整个故障识别过程。如整个框架所示，它通过自主智能代理、实时信息可见性、即时故障识别和协作决策，利用\
  \ `CCT` 促进了整个供应链的映射。本章假定，所提的基于云的框架可以加强协调，并使业务流程更高效。该框架设计用于通用背景，因此可以适用于任何分布式行业。然而，未来仍需要开发自动化的业务智能工具和有效的算法来分析数据。\n\
  \n## 参考文献\n\n*Getting it right*: Simon M. Wilson ([9780128214428](https://www.google.com/books/edition/Getting_It_Right/f_mQEAAQAAJ))978012821442800000\n\
  \n^a 诺布里亚大学，英国\n^b 牛津大学，英国\n\n## 摘要\n\n在通用环境下，由于保密性和对数据更大的控制力，制造商采用了私有云部署模型。基础设施托管在制造商自己的私有云上。使用\
  \ `SaaS` 交付模型为跨分布式制造的供应链利益相关者提供服务。社交媒体用于初步故障识别，并通过将数据集成到框架中最终实现故障恢复。最后，通过一个说明性的分步执行程序阐明了整个故障识别过程。如整个框架所示，它通过自主智能代理、实时信息可见性、即时故障识别和协作决策，利用\
  \ `CCT` 促进了整个供应链的映射。本章假定，所提的基于云的框架可以加强协调，并使业务流程更高效。该框架设计用于通用背景，因此可以适用于任何分布式行业。然而，未来仍需要开发自动化的业务智能工具和有效的算法来分析数据。\n\
  \n### 关键词\n\n治理；风险；投资；网络安全；战略；架构\n\n### 1. 引言\n\n过去，在那个时代，如果你需要一台电脑，就会去商店买一台，因为需求在增加。\n\
  \n低治理审批模型\n\n糟糕的需求意味着项目无法满足业务需求，而且重工作是昂贵的。由于终端用户会说明他们想要什么，IT 部门会要求合理化，并考虑可行性。在很多情况下，当某物被开发时，如果\
  \ IT 部门没有参与，开发者会直接与终端用户工作。在政府部门，IT 往往是由于年底未使用的预算盈余而购买的，为了防止下一年的预算被削减，因为他们无法花费。听到公司为了买几台大彩色激光打印机并不罕见。\n\
  \n随着计算机变得越来越强大，组织为它们发现了越来越多的功能，以支持跨业务、政府和学术的角色。由于对技术的需求领先于交付，出现了许多定制化应用程序，每个程序满足特定环境下的特定需求，但主要以烟囱形式交付，导致各个组织之间出现大量重复。\n\
  \n这些组织试图通过引入采购控制、需求管理、变更审批委员会、合理化和整合项目，以及最近的基于云的服务来解决这种烟囱式交付和功能重复的问题。这在很大程度上改善了状况，但问题仍然存在。\n\
  \n\n\n\n这就是为什么在改进需求方面投入了如此多的努力。“SMART”需求——即可扩展、可管理、可实现、现实可行且及时的需求——已变得广为人知。可测试性需求是最佳实践，如果一个需求被认为是不可测试的，就会被拒绝。需要追溯性来显示需求的来源、其所有者是谁、其赞助者是谁，以及其经理是谁？我们现在拥有了问责机制！\n\
  \n然而，项目在时间和成本上仍然会超支。项目也被认为未能达到客户的预期。\n\n# Mott-MacDonald 乐观偏误 (\n\n乐观偏误建议设备和开发项目^()\n\
  \n话虽如此，需求仍然是导致成本和时间估计和/或报价的主要原因，这使得客户必须承担额外费用。确保需求是良好的、充分的、可测试的且稳定的，并尽早进行，可以度地降低这种风险。\n\
  \n从概念、需求到最终解决方案及其最终设计和交付，有多个分解阶段。所需的细节和必要的规模将取决于项目或计划的性质大小。然而，在评估该需求是否已被捕并解决方面，将具有共性。\n\
  \n评估是系统开发和交付中的一项重要活动。然而，并不是只有一种可以采用的评估方法。有很多选择，取决于评估的是项目的哪个方面以及由谁来进行。\n\n在整个系统开发生命周期中进行的各种评估可以分类如下：\n\
  \n*   `Strategic assessment`（战略评估）：高层级的，取决于当前的优先级、企业愿景、使命目标和能力目标。\n*   `Functional\
  \ assessment`（功能评估）：定制的，关注所需、提议或交付的内容如何运行，以及如何使用和处理数据。\n*   `Nonfunctional/technical\
  \ assessment`（非功能/技术评估）：关注实现系统功能的支撑性需求。\n\n执行非功能/技术评估的标准更为稳定，能够支持并赋能功能性和战略性需求。\n\
  \n“非功能性需求 (NFR)”是指规定了用于衡量系统（或系统系统）运行的标准，而不是任何特定的行为属性。因此，虽然大多数项目倾向于记录良好的功能性需求，但非功能性需求并不总是达到缓解需求和解决方案风险所需的关注程度。\n\
  \n解决这一问题的方法是风险系统理解框架 (SURF)。SURF 源于“战略情报架构”（\n\n尽管在公共领域并不广为人知，但 SURF 的前身已在国防安全领域的多个项目中得到应用。\n\
  \n## 2: 风险系统理解框架 (SURF)\n\nSURF 提供了一个框架，涵盖了适用于需求、解决方案和设计的通用且固定的属性集。当然，它不需要开箱即用，不同的组织对“分蛋糕”的方式可能与他人略有不同，他们可能希望更改\
  \ SURF 以适应自己的需求。然而，它确实提供了一个可用的框架和方法，特别是在这种方法是新的或不存在替代观点的情况下。\n\nSURF 可以简单地作为一种保证检查，确保需求文档、提议的解决方案以及项目后续设计涵盖了这些领域。然而，它带有一套更体系化的方法。这包括评估需求、解决方案和设计中的风险水平，并直接比较不同的解决方案和设计。\n\
  \n以下是 SURF 各个部分的详细说明。\n\n![Systems Understanding of Risk Framework (SURF)](img/u04-02-9780128214428.jpg)\n\
  \n风险系统理解框架 (SURF)\n\n### 2.1: 保证 (Assured)\n\n在此语境下，“保证”意味着对满足规则、法规和条例的其他非功能性需求有信心。\n\
  \n![Assured](img/u04-03-9780128214428.jpg)\n\n保证\n\n保证机制适用于其应用的情况。\n\n### 2.2: 连接\
  \ (Connected)\n\n“连接”指的是组织、系统之间的物理连接，并不意味着互操作性。\n\n![Connected](img/u04-04-9780128214428.jpg)\n\
  \n连接\n\n### 2.3: 可互操作 (Interoperable)\n\n互操作性 (IO) 是采购需求中的一项关键考量。然而，许多人也将互操作性与连接性混淆了一一。\n\
  \n![Interoperable](img/u04-05-9780128214428.jpg)\n\n可互操作\n\n\n\n\n保护系统、系统系统和/或服务及其接收、存储、处理和/或传播的信息至关重要。必须评估攻击或任何恶意行为的影响，以调查所需的安全水平。这被分为以下几类，这些类别被公认为核心原则。\n\
  \n![Secure](img/u04-06-9780128214428.jpg)\n\n### 安全 (Secure)\n\n这些内容在其他地方进行了深入讨论，但为了完整性起包含在此处。\n\
  \n- **机密性**：防止向未经授权的人员或系统披露信息。这是必要性，但仅靠其本身不足以维护信息的安全。\n- **完整性**：确保数据不会被秘密地修改。违反数据完整性（以及系统完整性）的示例包括通过秘密手段对传输中或存储中的数据进行修改。\n\
  - **可用性**：从核心原则来说，这指的是信息在需要时必须可用，这在框架的其他部分已涵盖，但在这种意义上，它包含了拒绝服务攻击。这一概念是根据系统、系统系统、服务和/或数据对谁可用来考虑的，其中包括防止恶意活动。这可以被认为是在电子安全方面限制访问，但也应该考虑到硬件的物理访问等因素，例如进入该区域的措施。\n\
  - **身份验证**：通过验证实体（`证明者`）向另一个实体（`验证者`）证明身份，以确保所有数据、通信和交易都是真实的，并验证双方都是他们所称的。\n- **不可否认性**：这是个人履行其合同义务的责任，通过使某行为的发生不可否认，并确保该行为归于执行该行为的人来实现。\n\
  \n### 2.5：安全 (Safe)\n\n安全需求通常具有相对可复性，特别是在应用领域内部以及产品线的成员之间。作为质量需求，安全需求通常表现为特定系统的质量准则，加上相关质量指标的最小或最大需求量。这种结构源自\
  \ Donald Firesmith 的《安全相关需求分类法》（\n\n![Safe](img/u04-07-9780128214428.jpg)\n\n###\
  \ 安全 (Safe)\n\n- **防止对贵价值资产的意外伤害**：系统设计需要确保它不会导致、或允许对某类型资产发生预定义数量的某类型伤害，且数量不超过预定义的可测量阈值。接受容忍范围内的资产受损似乎违背直觉，但例如，工具可能会对设备造成磨损，但不会使其变得无法使用。\n\
  - **防止安全事件/事故**：系统设计需要确保它不会导致、或允许在可测的发生阈值内发生特定类型的安全事件，并可能在可测的严重程度内发生安全事件。虽然我们希望消除所有安全事件并提供完全安全的系统和工作环境，但这并不总是可能的。某些活动不可避免地涉及风险。\n\
  - **防止危害**：系统设计需要确保它不会导致、或允许发生特定类型的危害，且其发生频率不了一个预定义的可测量阈值。再次，这些危害在某些活动中是不可避免的，因此需要定义一个可接受的危险或危害水平，危害是指呈现危险或风险但不一定导致此类事件的事。\n\
  - **防止安全风险**：系统设计需要确保它不会导致、或允许发生任何可能在定义的严重程度或以上引起伤害的事故/事件或危害（进行分类，例如根据《伤害、疾病和危险情况报告条例》（`RIDDOR`））\n\
  - **检测违反预防措施的行为**：系统应检测到故意或无意绕过或禁用任何预防系统、措施或程序，例如工人在执行任务时可能偷工减料。\n- **对违反预防的反应**：当系统检测到故意或无意绕过或禁用任何预防系统、措施或程序时，系统应以预定的方式做出，以避免任何事故/事件或危害。\n\
  \n### 2.6：支持 (Supported)\n\n综合后勤支持（ILS）是一种管理全生命周期成本的严谨方法，影响着客户组织及其供应商。它旨在通过最小化资产所需的支持系统来优化全生命周期成本；通过影响其可支持性的需求、解决方案和设计；并通过确定最佳的支持需求。资产被定义为设备、服务、系统或系统系统。\n\
  \n结果是以优化的成本获得可支持和受支持的资产。通过对支持系统所需的属性进行充分范围，对交付解决方案的信心、其交付时间和成本的评估可以更高，从而风险评估也更低。\n\
  \n![Supported](img/u04-08-9780128214428.jpg)\n\n### 支持 (Supported)\n\n在这种语境下，“可用”与系统、系统系统和/或服务在工作时间和地点上需要运行何时何时何地有关。可能没有直接的连接；然而，业务过程可能不需要这些（例如，远程或独立工作），但必须考虑交付的系统、系统系统和/或服务的可用位置。此外，确保它们在需要的小时内可用也至关重要——一个\
  \ 24 小时的运营中心如果丢失服务且无法响应紧急请求，将无法有效运行。\n\n因此，必须确定可以承受的停机时间，以及发生故障时的恢复时间。因此，系统、系统系统和/或服务的可靠性和可维护性应充分定义，以确保其能够支持这些需求。\n\
  \n### 2.7：及时 (Timely)\n\n及时性是需求文档中必要的考虑因素，以确保基本操作在需要的时间范围内发生，以实现完全优化或达到可接受的水平。这取决于以下因素。\n\
  \n![Timely](img/u04-09-9780128214428.jpg)\n\n### 及时 (Timely)\n\n- **容量**指的是交付的许多方面方面，包括带宽提供和存储需求等方面，但但不限于面向系统的方法。诸如操作人数和有关设施的考量也很重要。\n\
  - **延迟**是指操作过程中可以容忍的时间延迟，例如消息的发送以及接收消息需要多长时间。\n- **响应能力**是指在请求后执行操作的速度有多快，例如在请求操作后多久才发送消息。\n\
  - **效用**（作为有用的质量或状态）有两种不同类型——硬效用软效用。硬效用定义为操作的输出在达到预定义的截止日期之前被视为完全优，此之后优性被视为零或负值（如果超过截止日期，它就是无用的、有害的或干扰的）。软效用可以定义为输出的优性随时间变化，输出耗时越长优性越低（越快越好）。这种对“效用”的衡量非常重要，应注意在使用“实时”等仅意味着延迟、或更糟糕的“近实时”术语时稀释这一含义。\n\
  \n\n\n\n### 3.1 SURF 最小应用\n\n框架内描述的 `SURF` 各种元素以分类法的形式存在，旨在提供一组规范的非功能性需求，以便在项目文档中处理。这些需求正如前文所述，分为顶层类别：保证（assured）、连接（connected）、互操作（interoperable）、安全（secure）、可靠（safe）、支持（supported）和及时（timely）。\n\
  \n从简单意义来说，这些元素可以作为清单，以确保项目治理考虑了业务需求所需的非功能性方面；反之，则检查解决方案是否涵盖了相同方面，并验证设计以确保其满足这些非功能性需求。\n\
  \n这最适用于小型采购和开发项目，表明已付出了适当的尽职调查，这有助于在不投入任务投入过度精力的情况下，管理并降低任何风险，同时保持可审计性和可问责性。\n\n\
  ### 3.2 SURF 风险评估方法\n\n需求集在充分传达完整业务需求方面存在程度的风险。反之，它代表了采购过程中所要求的“什么”，而潜在的供应商将返回带有解决方案的提案，说明他们将“如何”满足这些需求，这在充分满足完整业务需求方面也存在程度的风险。在后续阶段，设计也将面临类似的风险。\n\
  \n这种方法类似于标准风险评估与多准则决策分析（`MCDA`）方法的结合。其表现形式为评审小组根据 `SURF` 对需求、解决方案和/或设计进行评分。\n\n\
  该概念遵循标准的风险评估标准和评分系统，旨在对框架中每个最低级 `SURF` 元素（例如“能力”）进行评估，衡量未能实现这些元素的影响，并给出建议分：高影响为\
  \ 3 分，中影响为 2 分，低影响为 1 分，分别使用传统的红、黄、绿（`RAG`）标记。\n\n在评估需求的适用性时，也需要执行相同的操作，考虑到相关需求导致该考量因素无法实现的感知概率，同样按上述方法进行\
  \ 3 分制评分。当然，记录有关考量元素评分的因素对于审查和审计目的来说至关重要。\n\n解决方案和设计也遵循相同的流程。\n\n每个元素（影响和可能性）的两个分数相乘，得到总分\
  \ 9 分的分——即“风险”分；对于框架中相应的 `SURF` 元素（例如“及时”），则计算其下方分数的平均值。对于总的“需求风险”分，则计算所有高级考量因素的平均值。\n\
  \n解决方案和设计遵循相同的流程。\n\n可以对每个 `SURF` 元素单独对其“影响”和“可能性”进行评估，以便对投资和/或风险缓解做出判断。为了辅助这一点，所遵循的方法论允许分析影响因素，以及是否需要考虑如何减少影响、完善需求或两者兼顾。\n\
  \n同样的方法适用于从潜在供应商处收到的各种解决方案以及最终设计，以给出它们的整体解决方案和设计风险分。\n\n这提供了对项目各个阶段整体风险的可审计评估，并映射了风险在框架内的实际所在位置。因此，需求、解决方案和设计的风险评估结果可以指导并告知良好需求的编写；风险缓解策略；方案选择（多准则决策分析）；解决方案筛选；以及测试、评估和验收。\n\
  \n评审小组输出的一个示例见下文，其中使用的数字仅供演示目的。\n\n![可能性评分映射示例——总体可能性分：2.7](img/u04-10-9780128214428.jpg)\n\
  可能性评分映射示例——总体可能性分：2.7\n\n![影响评分映射示例——总体影响分：1.8](img/u04-11-9780128214428.jpg)\n\
  影响评分映射示例——总体影响分：1.8\n\n![风险评分映射示例——总体风险分：3.9](img/u04-12-9780128214428.jpg)\n风险评分映射示例——总体风险分：3.9\n\
  \n### 3.3 SURF 风险与投资评估\n\n这是主要的评估方法，对于从事过运分析/运筹学（`OA/OR`）的人来说会很熟悉。风险与投资评估（`CRIA`）基本上是用综合运营效能与投资评估（`COEIA`）中的整体风险分替换\
  \ Y 轴上的运营效能，但进行了反转以保持“左上最优”的偏置。\n\n风险分在之前已定义，单独进行评估，使用平均值作为点分，然后剔弃离群的高、低分（如果认为样本率足够高的话），然后将剩余的高、低分作为误差棒的范围限制。\n\
  \n投资评分是将方案的估计成本或报价成本作为点分，并应用评估的乐观偏差以提供误差棒。\n\n在接下来的示例中，显示了三个方案（A–C）的结果，这些方案可能是解决方案，允许它们与其他标准（能力和功能性）一起对系统风险进行评估。\n\
  \n使用 `SURF` 的概念是保持标准和保持简单。话虽如此，没有什么是固定的，组织可能希望自定义框架、方法论或两者。\n\n![示例 CRIA 图表](img/u04-13-9780128214428.jpg)\n\
  示例 CRIA 图表\n\n### 4 对网络安全的影响\n\n我们系统的网络安全是生活中一个悲哀的事实，需要从开始就考虑。设计安全（`SbD`）引导我们确保系统的设计和构建是安全的。这需要从一开始就让安全处于需求的核心，并遵循许多可用来源之一的指导，例如英国政府的指导。\n\
  \n需要在其应用背景下评估风险，无论它是服务交付、网络安全，还是两者之间的平衡。在网络安全背景下，这需要根据威胁是什么以及来自哪里进行评估，然后评估影响水平及其可能性。\n\
  \n这要求项目和计划对这种风险有理解。因此在网络安全领域，可以通过考虑风险的来源和风险类型来评估风险格局。来源是威胁产生的实体，可以分类如下：\n\n*   •\
  \ 网络犯罪分子——通过欺诈或出售信息盈利\n*   • 外国情报机构——为国家赢得优势\n*   • 黑客——认为这是一种有趣的挑战\n*   • 行动主义——出于政治或意识形态动机\n\
  *   • 用户——无论是无意还是故意误用\n\n网络威胁的类型如 `STRIDE` 缩写所示。\n\n```\nSTRIDE\n\n| 威胁 | 违反的属性\
  \ | 定义 | 示例 |\n| --- | --- | --- | --- |\n| 伪造 | 身份验证 | 冒充某些事物或他人 | 冒充 Bill Gates、`Paypal.com`\
  \ 或 `ntdlll.dll` |\n| 篡改 | 完整性 | 修改数据或代码 | 修改磁盘或 DVD 上的 `DLL`，或在网络传输时修改数据包 |\n```\n\
  \n\n\n\n\n# 威胁格局评估框架\n\n| 类别 | 维度 | 说明 | 示例 |\n| :--- | :--- | :--- | :--- |\n|\
  \ 否认 (Repudiation) | 不可否认 (Nonrepudiation) | 声称未执行某项操作 | “我没有发那封邮件”，“我没有修改那个文件”，或“亲爱的，我没去过那个网站！”\
  \ |\n| 信息泄露 (Information disclosure) | 机密性 (Confidentiality) | 向未经授权的人员暴露信息 | 允许他人读取\
  \ Windows 源代码；在网站发布客户列表 |\n| 拒绝服务 (Denial of service) | 可用性 (Availability) | 拒绝或降低用户的服务\
  \ | 使 Windows 或网站崩溃，发送数据包并占用数秒 CPU 时间，或将数据包路由黑洞 |\n| 权限提升 (Elevation of privilege)\
  \ | 授权 (Authorisation) | 在没有适当授权的情况下获取权限 | 允许远程用户运行是一个经典示例，但从限制用户变为管理员也是权限提升 |\n\
  \n![未标记表格](img/t0010_u1.png)\n\n每种威胁的影响和可能性都不同，这取决于相关的行动者。可以像下文的威胁格局所示，通过考虑每个行动者和威胁来进行评估，并附带示例评估。在示例评估中，黑客极有可能泄露他们从目标中提取的信息，但更多是为了证明拥有这些信息而不是为了造成伤害；而外国特工则会寻求尽可能大的影响。\n\
  \n![示例威胁格局](img/u04-14-978012.jpg)\n\n这种风险格局评估可以被用于识别高风险区域，反过来可以为制定解决问题的行动计划时确定优先级。具体的优先级将取决于现有的政策和保护措施。此场景中未传达这些状态，这需要被添加到风险格局中。此外，组织的风险偏好也会产生影响。有些组织选择保持开放，以较高水平的可用性和较低的安全性进行运营，并能够从任何事件中快速恢复。其他组织则更规避风险，安全性更高，但同时也随之而来的服务交付和可用性的影响。具有良好形势意识的组织可以根据感知威胁水平在两个极端之间切换立场，管理网络安全与服务交付之间的平衡。威胁的严重性可以通过\
  \ `DREAD` 缩写进一步推导（`Wikipedia.org`，2018）：\n\n- `Damage`（损害）：攻击后果有多严重？\n- `Reproducibility`（可复制性）：重现攻击有多容易？\n\
  - `Exploitability`（可利用性）：发起攻击需要多少工作量？\n- `Affected`（影响范围）：有多少人受到影响？\n- `Discoverability`（可发现性）：发现威胁有多容易？\n\
  \n在充分理解并获知了威胁格局后，应该使用 `SURF` 来确保整个项目或计划生命周期内的完整性。`SURF` 的各个部分适用于整个 `STRIDE`，如下文的矩阵所示![SURF\
  \ 到 STRIDE](img/u04-15-978012.jpg)。\n\n## SURF 到 STRIDE\n\n“保证（Assured）”和“安全（Secure）”自然适用于整个\
  \ `STRIDE`。政策、法律和策略需要涵盖所有方面，而安全是 `STRIDE` 的核心。“连接（Connected）”适用于谁可以访问系统。存在哪些网关以及这些网关上采取了什么保护措施。系统通过合法连接的系统也是脆弱的，因此取决于这些系统上到位的安全措施。如果这些系统受到攻击，攻击者可能拥有什么访问权限？\n\
  \n同样，对互操作系统具有足够访问权限的人可以通过伪装、更改系统以影响你的系统、秘密行动、从系统窃取数据以及阻止对你系统的访问来影响系统。安全（Safety）在所有\
  \ `STRIDE` 中都是关注点，任何攻击可能导致系统不安全，或者由于勒索软件导致数据不可用。\n\n最后，数据的及时性在开发援助中至关重要，这涉及到数据延迟的风险，以及静态数据的安全问题。因此，我们需要更关注开放、透明度和治理方法，以确保数据处于状态（Data\
  \ at rest）的正确性。`SURF` 是实现这些点的良好框架和方法。\n\n## 参考文献\n\n## 延伸阅读\n- **\n- **\n\n## 第\
  \ 2 节：AI（人工智能）：网络物理管理\n（待续）\n\n# 第 5 节：区块链作为开发援助透明度和治理的工具\n\nHamid Jahhani (a，Stefan\
  \ Kendziersky (b，Anita Colin (c)。\n\n`a` 英国伦敦诺布里亚大学\n`b` 英国萨里郡 FORTIS\n`c` 英国伦敦大赦国际组织\n\
  \n## 摘要\n全球讨论承认需要更多开发援助，欧盟（EU）等司法管辖区增加了 2021-27 年的援助预算，以实现援助大幅增加并消除官僚障碍。然而，这种增加的灵活性引发了对援助去向何处以及整个监管链在追踪、追溯和报告方面的日益增长。人们担心资金在筹集、批准和发送后，无法确定是否已到达最需要开发援助的人手中。此外，对于那些愿意为援助发展贡献的人，希望资金被安全地用于正确的用途。因此，对开放、透明以及准确监测和使用评估工具的治理方法的需求，有助于确保监管链并让所有人实现成果。近期研究表明，技术的利用提供了进步的机会，特别是区块链的使用及其属性：不可篡改性、透明度、通过智能合约实现的审计控制和安全性。然而，区块链对提高开发援助交付透明度的贡献在学术研究中较少关注。本章的目的是探讨区块链技术在开发援助交付中的可行性，通过解释区块链的属性、一些用例和应用，并分析支持作为可行区块链模型的数据点。\n\
  \n### 关键词\n`区块链`；`透明度`；`开发援助`；`比特币`；`加密货币`；`智能合约`；`数字经济`\n\n## 1：区块链背景与开发援助的相关性\n\
  开发援助部门每年支出超过 600 亿美元支持消除全球贫困和实现联合国（UN）可持续发展目标（SDGs）的努力。长期有效性仍然是一个挑战，因为监测工具在预算数据评估和资金问责方面不足。\n\
  \n\n\n\n作为一种去中心化技术，区块链在分布式公共账本中维护着一个持续的数据记录列表和点对点交易，且无需任何第三方参与。\n\n发展援助合同大多是基于纸质的，资金转账流程冗长，且要承受银行转账费用以及政府和援助官员的政治影响。智能合约是区块链的一项显著特征，可以加速评估工作，例如评估潜在灾害的规模，并决定所需的货物和服务的类型及数量；因此，区块链可以为发展援助捐赠者和接收方提供更高的价值。\n\
  \n目前，国际发展领域作为一个实践领域和研究领域，其最重大的讨论之一是：监测发展援助的工具存在缺陷。援助预算数据、研究报告以及关于援助效的官方发展报告未能提供清晰的支出图景，这使得基于绩效的评估无法评价项目成果的达成情况。大多数情况下，发展援助系统面临着欺诈、资源被挪用以及依赖“捏造”进度报告的指控。因此，监管链变得被“污染”，在供应链的末端，预期的接收者只能得到（如果有的话）属于他们的一小部分物资。缺乏防止援助资金管理不当以及受益人被排除在援助计划之外的工具，既是外部和内部差异的原因也是结果。\n\
  \n来自计算和技术学科的文献日益增多，它们对区块链技术提供了一系列不同的阐述。\n\n它具有突破性的潜力，等同于互联网。\n\n区块链一个独特的特征是其永恒的宗旨：连接人们并允许用户进行验证，尽管记录是不可能篡改的。\n\
  \n每年有超过 6000 亿美元用于发展援助以支持可持续发展目标（SDGs）的实现，发展援助旨在缩小发达国家与发展中国家之间的差距。\n\n许多关注发展援助长期效能的研究未能令人信服地证明评估和监测工具为捐赠者和受益者带来了真实的价值。\n\
  \n联合国要求每个国家提供其国民总收入 0.7% 用于援助的目标几乎没有实现，部分原因是由于捐赠者撤回援助，因为现有的发展援助系统面临着欺诈和资源被挪用的指控。这在难民援助案例中尤为明显，报告显示，约\
  \ 30% 的援助资金由于管理不当、盗窃和其他挑战未能到达受益者手中。\n\n此类案例挑战了“援助越多，变化越大”的误解。有证据表明，监测工具在发展援助预算数据评估方面存在不足。\n\
  \n评估发展援助的研究表明，尽管存在其他因素，但进度报告确实未能反映实际发生了什么以及援助资金是如何花费的。\n\n官方报告显示，援助程序及其分配比十年前更加透明。信息的提供和有关发展计划的国家报告的传播被视为援助透明度的一个指标。\n\
  \n近期报告捐赠者对接收国信心下降的研究几乎几乎是由于援助透明度水平较低导致的。这意味着从财务透明度的角度来看，高比例的合规水平没有得到解决，且现有的记录存储和管理程序存在缺陷。\n\
  \n其他关于在评估发展援助效能方面缺乏技术的研究也得出了类似的观点，指出了利用技术在基于分布式数据库组件的促进民主化形成方面的重要性。\n\n## 2: 加密货币和智能合约在发展援助中的可行性\n\
  \n如前节所述，区块链是 `Bitcoin` 加密货币系统运行的基础，其增强功能已应用于公共部门，用于在全球范围内安全、透明地交换价值，如图. 1 所示。同样，区块链的加密货币和智能合约的显著特征在发展援助供应链的问责和透明方面具有巨大潜力。\n\
  \n![Fig. 1 当前援助供应链与潜在的区块链支持援助平台的对比。](img/f05-01-9780128214428.jpg)\n\n图 1 当前援助供应链与潜在的区块链支持援助平台的对比。\n\
  \n多项研究表明，区块链的一项关键特征是它消除了欺诈等完整性违规行为，同时降低了交易成本。\n\n密码学已成功改进了各的服务交付。\n\n上述示例支持了以下观点：在没有任何中央机构干预的情况下建立共识，使得加密货币交易对不同部门具有吸引力。对于发展援助部门，区块链的效能可能不仅限于加密货币，在信息基础设施和智能合约方面也显示出潜力，并在危机和灾害期间及时提供人道主义救援——通过与航空公司连接食品和水，并在特定时间范围内进行规划交付。\n\
  \n### 表 1：智能合约的独特特征。\n\n| 特征 | 描述 |\n| --- | --- |\n| 自主性 | 合同启动后，发起合约的代理无需与之进一步联系\
  \ |\n| 自给自足 | 能够通过提供服务或发行股权来募集资金，并反之将其用于所需的资源 |\n| 去中心化 | 合同在整个网络中分布式并自动执行 |\n\n\
  智能合约可以改变供应链管理的各个方面，并在金融领域之外实现合约执行的自动化。\n\n图. 1 展示了区块链如何通过监管援助流潜在地改变当前的发展援助供应链。\n\
  \n利用大数据预测自然和人为灾害的发生，让执行伙伴使用客观指标可以触发智能合约交易，从而促进对减灾防灾和冲突管理的参与。\n\n### 2.1: 区块链忧虑与智能合约\n\
  \n其他关于区块链的研究引发了对安全、隐私以及围绕欧盟 `GDPR` 相关问题的担忧——例如数据滥用和个人信息权。\n\n在环境发展援助计划方面，智能合约可以通过关键的房地产对\
  \ SDGs 产生积极影响，因为全球对气候变化的关注已将援助努力转向智慧城市的演变。这涉及固定和非固定资产的控制、网络以及将交易整合到未来社区预测中，同时连接人们和组织。这不仅能根据智能合约的数据确保问责，还能为可持续生计改善环境。\n\
  \n毫无疑问，加密货币和智能合约在发展援助中的应用强调了区块链在该领域的潜力。然而，智能合约保留大量数据的能力遭到了广泛批评，表明确认交易所需的时间可能很长，从而导致无法实时对请求进行批准并对关键决策采取行动。\n\
  \n尽管捐赠者可以访问记录，并通过智能合约和大数据追踪交易，\n\n\n\n\n\n看来，预期的挑战被使用区块链所带来的经验和概念可能性所抵消了。本研究最相关的视角倾向于关注区块链在发展援助领域潜力的发展方向。例如，\n\
  \n## 3：区块链技术在发展援助中的应用\n\n核心问题是区块链如何增强发展援助中透明度的实现，并促进受益者的长期援助效力。在认识论中，实证主义和现实主义受到了批判，因为它们认为现实是可以独立于社会参与者从外部被理解的。因此，本研究采用了解释主义方法，因为它关乎对社会世界和语境创建更新或更丰富的理解和解释。通过这种，可以审视援助的价值，对援助的看法进行概念评估，并理解区块链技术与作为社会参与者的人类机构角色之间的差异。\n\
  \n相反，采取解释主义立场可能会导致超出研究目标的发现。尽管这可能被视为一种弱点，但它具有发现相关结果的潜力，从而丰富研究成果并指导进一步的研究方向。对于本研究，采用了一种共情立场，以从参与者的角度进入发展援助领域对区块链技术理解的社会世界。\n\
  \n### 3.1 发展援助中的区块链案例研究\n\n本节后续介绍了四个利用区块链提供发展援助的案例研究。第一部分展示了主题，第二部分对发现进行了批判性讨论，并提出了一个概念框架。本节的总结表明，尽管存在局限性，区块链和智能合约可以成功实现发展援助的透明化。本研究案例的选择主要具有揭示性。这是因为此处引用的案例具有阐明关于区块链在发展援助中适用性、可行性和局限性的更多见解的潜力。尽管这些与研究课题相关并产生了解决研究问题的重要数据，但案例研究被批评为数据重复，这削弱了做出理论预测的方法论严谨性。\n\
  \n### 3.2 发展援助区块链\n\n为了检查发展援助计划中使用区块链的可行性，以下重点介绍了关注的特定领域以及为何选择区块链作为目标技术。\n\n如案例一所示，很显然，数字代金已成功交付给难民。附在代金上的个人信息为每个预期接收者提供了身份识别。然而，在交易点识别出了代金复制尝试——这归因于区块链的不可篡改性。\n\
