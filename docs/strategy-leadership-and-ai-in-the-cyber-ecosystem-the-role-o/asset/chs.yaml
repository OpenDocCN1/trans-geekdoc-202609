  \ 业务的数字“握手”\n\n# 10：社交媒体营销角色在塑造选民偏好中的感知分析：2018 年哥伦比亚总统选举案例研究\n\nNatalia Gomez Arteaga^(a);\
  \ Lillian Clark^(b)\n\n^a 英国纽卡斯尔，纽坎布里亚大学\n^b 英国伦敦，QA Higher Education\n\n## 第 3\
  \ 节\n\n## 参考文献\n\n\n\n\n社交媒体平台的近期增长以及个人对其使用的加强加强了交流，同时也创造了政治参与和辩论的新型形式。近年来，政治候选人开始将社交媒体平台整合到他们的传播策略中，同时将其作为政治营销的工具，以增加他们的竞选潜力和对公民投票行为的影响。本研究的总目标是通过分析社交媒体营销在\
  \ 2018 年哥伦比亚总统大选中中塑造选民偏好方面的作用，探索数字营销策略如何在政治竞选期间影响选民。该研究最初通过文献综述开展，在综述中发现了围绕该主题的主要理论，强调了口碑营销在影响选民决策中发挥的作用。随后，对政治专家和两位政治竞选主管进行了访谈。此外，向哥伦比亚选民样本发放了调查问卷，以确认文献综述的发现并探索他们对该案例研究的观点。结果显示，研究发现政治营销中社交媒体的使用作为一种传播策略是至关重要的，其中口碑发挥了极其重要的作用，因为人们倾向于相信其他公共成员而非候选人本身。另一个发现是，社交媒体策略仅影响摇摆选者的偏好，而非整个选民群体，尽管在普通人口中，它可以用作强化预设政治立场的工具。最后，在哥伦比亚，社交媒体仍然仅对传统营销方法起到补充作用，因为占选民很大比例的农村地区互联网访问受限。\n\
  \n### 关键词\n政治营销；社交媒体；投票偏好；口碑\n\n### 1. 引言\n\n### 1.1 目标\n本研究旨在探讨现代政治竞选中数字营销策略的重要性，并分析这些策略在\
  \ 2018 年哥伦比亚总统大选期间影响选民决策和意见方面发挥的作用。为了帮助探索研究的主题，开发了一系列子主题，旨在实现以下目标：\n\n1. (1) 识别与社交媒体对政治竞选和选民投票决策影响相关的理论和当前研究。\n\
  2. (2) 分析对社交媒体在 2018 年哥伦比亚总统大选影响的认知。\n3. (3) 为政党如何在未来的政治竞选如何改进对社交媒体的使用提供建议。\n\n\
  ### 1.2 背景\n近年来，不同年龄、文化和社会地位的对社交网络的使用呈指数级增长，引入了一种新的交流形式。这种形式不仅能够人与人之间快速传播信息，还能在短时间内向数百万人传播，不受边界限制，人们花在社交媒体平台上的时间比阅读新闻更多。\n\
  \n因此，新的参与和辩论形式应运而生，因为信息可以在短时间内“病毒式”传播并在全球范围内可见。\n\n## 2. 文献综述\n\n### 2.1 概述\n本节将分析和回顾围绕前一节列出的主题和内容的现有文献，通过建立关于政治营销和政治参与中使用社交媒体的出版文献和理论框架。通过对文献的理解，将制定一个假设来回答问题问题。因此，关注政治营销、政治营销中的社交媒体与政治参与，以及数字营销中的口碑的出版将成为分析和综述的重点。\n\
  \n### 2.2 政治营销\n就像企业制定营销策略来销售产品一样，政党和候选人也试图通过使用营销策略推推他们的政策和信念，以引导舆论有利于他们。这被称为政治营销，可以定义为各种个人和组织在政治竞选中应用营销原则和程序，包括候选人和政党通过战略性竞选的管理和执行来影响公众舆论。\n\
  \n此外，\n\n因此它影响并改变了政治本身的内容，随着政治传播个性化程度的增加，因为人们倾向于关注候选人的个人特征而非他/她在政治上代表了什么。\n\n在政治营销的目标方面，\n\
  \n### 2.3 用于政治营销的社交媒体\n社交媒体平台的普及为政治营销建立一个政治市场提供了一个平台，在那里候选人和政党可以根据自己的方便和利益影响并驱动公众舆论。\n\
  \n社交媒体极大地改变了政府和政治参与者的运作和交流方式，以及选举实施的方式。它让公众了解政治事务，允许政治表达，并促进了社区建设以寻找针对相似利益和需求的解决方案，为更多声音被听到以及触及最中立的公民提供了可能。\n\
  \n### 2.4 社交媒体与政治参与\n由于\n\n### 2.5 数字营销中的口碑\n口碑营销涉及人们对产品、服务或品牌所说和告诉别人的内容，以及围绕其建立的声誉。它是营销传播和策略的一个重要组成部分，因为它是吸引更多客户和增加品牌声力和认知的一种方式。根据\n\
  \n通过这种方式，\n\n### 2.6 结论\n在回顾了现有文献后，可以说政治营销连同其细分、定位和口碑等策略，是选民决策过程中的决定因素，正如第 2.2 节所示。随着互联网和社交媒体平台的崛起，这些营销策略进一步强化和巩固了营销传播，并激发了公民的政治参与，参见第\
  \ 2.3 节和第 2.4 节。口碑是对比选民决策过程影响最大的元素，正如第 2.5 节所示。这支持于\n\n### 2.7 概念模型：假设与介词\n\n```\n\
