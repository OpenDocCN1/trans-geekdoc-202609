  \n我认为我们可以安全地说，从未在如此短的时间见过如此巨大的技术变革，社会也没有受到过个人计算和移动化的如此巨大的挑战。也许最惊讶的方面是社交网络的兴起，以及为了更明显的优势而几乎所有人人都愿意牺牲隐私。这对工作、娱乐、零售、娱乐和服务领域的影响是深远的——媒体和政治的演变也是如此！每个人现在都是拥有话语权的选民，每个人都可以成为影响者或被影响者。\n\
  \n这些变化标志着一个更广泛、更深的转型：从一个“缓慢、简单、线性且舒适”、解决方案显而易见的世界，转向一个“快速、非线性、令人不安且不舒适”、解决方案并不明显的世界。相反，这种趋势受到日益增长的自动化无形推动，机器人和\
  \ AI 提供并管理我们所有的基础商品和物资，同时也为我们的服务和公用事业提供动力。\n\n对大多数人提到 AI 和机器人会导致《终结者》之类的科幻幽灵，但与此同时，人们接受了\
  \ Amazon Alexa 和 Apple Siri，并信任由 AI 工具设计、机器人制造的高度自动化车辆。但可能没有比自动驾驶汽车更具争议的领域了：发生事故时谁负责？它们会破坏多少驾驶工作？同时，政府和机构受“简单世界模型”和思维的影响，成员、经理和董事会会导致不理想的结果。\n\
  \n使用基于 17 世纪流程来管理 21 世纪的经济，或者使用 19 世纪的管理模型会导致次优的结果，并往往导致衰落。\n\n因此，最后，我很高兴地说，我找到了一本应对这种格局的书，它描绘了过去和未来的变化图景，并解释了其中的原因、所在和优势。它还为个人、机构和公司无法接受新事物和变化所带来的各种难题提供了解决方案。这使其成为一本极具吸引力且全面的著作，在每个经理和政治家的办公室里都有一席之地。\n\
  \n# 第一部分：数字时代的战略领导力\n\n## 1：工业 4.0 管理者的 AI 演进与人机界面\n\nLiam M. O’Dell (a); Hamid\
  \ Jahankhani (b)\n^a 高级项目经理，项目管理协会会员 (MAPM)；建筑学会协会会员 (ACIOB)，伦敦\n^b 伦敦诺森布里亚大学\n\n\
  ## 摘要\n\n在工业 4.0 和数字革命的背景下，项目管理角色正在发生剧变。这种令人兴奋的转型将在未来几年发生，并将人工智能 (AI) 技术纳入知识能力体系。随着这种智能爆炸，AI\
  \ 技术的影响以及机器学习、大数据和数字孪生等关键主题正在演变，创造了信息物理项目专业人员的可能性。这带来了关于 AI 技术开发和使用的更多伦理和治理问题。本章旨在提供一个有用的初步见解，同时帮助项目管理专业人士进一步了解\
  \ 创新如何进入工作场所以及如何潜在与 AI 交互。此外，本研究希望激励未来的研究人员为项目管理领域内 AI 使用以及信息物理数字孪生协作关系开发创新构想。\n\
  \n### 关键词\n\n人工智能；大数据；机器学习；数字孪生；伦理与治理；知识能力领域与框架\n\n## 1：引言\n\n人工智能 (AI) 领袖和投资者吴恩达曾说：“数据是新石油，AI\
  \ 是新电力，物联网是新神经系统”。（\n\n“人工智能”一词最早出现于 1955 年，当时基于假设，学习的每个方面或智能的任何特征在原则上都可以被精确地描述，使得机器可以模拟它。）\n\
  \n\n\n\n虽然 `AI` 和 `ML` 技术本身可以被视为独立的行业，但将这两种技术相结合时，它们就成了推动我们思考、创造和工作方式演变的强大引擎。同样，这项研究的作者与过去\
  \ 20 年里任何经验丰富的项目经理一样，可能也经历过计算机化的第三次工业革命，曾第一次坐在新电脑前并对这项新技术感到惊讶。\n\n项目经理几乎肯定有过这样一个时刻：渴望拥有一个庞大的团队，他们掌握着所需的所有知识，并拥有所有可能的经验来指导他们解决问题或协助做出明智的决策。然而，直到现在，这可能是不可能的，或者说实际上是不可行的。\n\
  \n然而，随着 `AI` 和 `ML` 技术正在经历的通用创新，这些今天及未来的新兴工具将影响并改变项目经理交付项目的方式，通过应用大数据来评估如何更快速、更高效且高质量地完成复杂任务。\n\
  \n随着第四次工业革命的到来（\n\n该研究将 `AI` 和 `ML` 技术的创新视为项目管理专业服务领域内的一个新兴主题。这些技术甚至让一些行业领袖感到意外（\n\
  \n尽管如此，正如亨利·福特通过引入流水线彻底改变了制造业一样（\n\n## 2: 人工智能 (AI)\n\n`AI` 本身是多面的并且可能在不断演变，取决于行业处于新技术发现时间线的哪个阶段。解释来说，`AI`\
  \ 是一系列广泛且不断演进的技术集合。\n\n人工智能（AI）可以定义为关注智能行为自动化的计算机科学分支。\n\n作为 `AI` 研究的先驱，科学家艾兰·图灵写了多篇关于机器和计算能力的论文。图灵随后设计了一种测试来确定机器是否具有人类相同的能力，这种测试被称为`图灵测试`（\n\
  \n随着这些重大的进展和 `AI` 的发展，机器承担人类任务可能是可能的，并且前所未有的计算技术将被开发出来（\n\nSatell 在 `2018` 年指出，数字时代的兴起在目前我们正在看到的开发和创新阶段，与水力、蒸汽、电力及内燃机工业革命相比，尚未产生任何实际影响。随着新兴\
  \ `AI` 技术出现，研究表明 `AI` 遍布所有行业。`AI` 正迅速成为许多行业部门的焦点，并在最近几年影响了经济。`AI` 技术的发展和应用正在迅速改变全球经济（\n\
  \n因此，英国可能被视为全球领导者（\n\n尽管 `AI` 术语已经存在了近 `63` 年（ \n\n在开发 `AI` 技术时，大多数研究基于两个应用原则：知识表示或语言，以及问题解决过程或搜索技术（\n\
  \n`AI` 的创新在于远离工业时代，向数字技术创新的新时代迈进。也就是说，技术内部的转型，从专业人士最初熟悉和接触过的领域（如蒸汽、电力的出现，以及最近计算机等数字技术的突破）发生了转变。此外，可能没有人能预料到，当像`摩尔定律`这样的计算机技术早期先驱建立时，总有一天计算机将拥有与人类相同的能力，甚至开始变得多余（\n\
