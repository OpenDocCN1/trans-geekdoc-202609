  \ 4.4 结果讨论\n\n本研究采用了前文第 3.3 节所述的混合方法。这允许对定量和定性数据的结果进行比较和分析，使用了三角交叉策略，即两种类型的数据具有相同的重要性并进行整合（\n\
  \n从定量结果开始，一方面，结果分析支持论题：“选民认为社交媒体在 2018 年哥伦比亚总统大选竞选期间发挥着影响选民决策的作用。”然而，有些自矛盾的是，调查参与者并不认为社交媒体在影响他们的决策方面发挥了作用，因此假设测试接受了零假设，即“选民并不认为社交媒体在\
  \ 2018 年哥伦比亚总统大选竞选期间发挥着影响选民决策的作用。”假设 2 即“在社交媒体上分享政治相关帖子与 2018 年哥伦比亚总统大选期间的投票偏好有关”可以被接受。假设检验显示正相关关系，因此必须拒绝零假设。\n\
  \n另一方面，定性分析支持这一论题：“社交媒体作为一种政治营销工具，在 2018 年哥伦比亚总统大选竞选期间对影响选民的决策起着重要作用。”然而，根据访访者的说法，社交媒体并没有塑造选民的偏好和决策，而是起到了强化既有政治立场的作用。这有力地支持了约瑟夫·克拉普（Joseph\
  \ Klapper）于 1960 年提出的强化理论，该理论认为“媒体证实受众的信念而非创造新的信念，只有当受众倾向于改变时，媒体才能改变观点，例如媒体加强了政治观点而非改变它”（\n\
  \n\n\n\n此外，定性结果支持了这一观点：“社交媒体上的口碑传播在 2018 年哥伦比亚总统大选竞选期间对选民的决策产生了显著影响。”口碑传播对候选人的竞选产生了重大影响，特别是通过\
  \ `WhatsApp` 策略的使用。然而，物理和现实生活意义上的口碑传播也是一项非常重要的策略，它补充了数字策略，并支持了文献综述的发现，即“政治营销中的口碑传播对选民行为具有积极影响”。\n\
  \n从结果分析中得出的另一个重要发现涉及口碑传播的负面方面，因为假新闻的泛滥已成为社交媒体上一种日益增长的趋势。这一观点得到了访谈参与者和问卷参与者的共同证实，当被问及“你认为如果没有社交媒体的参与，选举结果会有不同吗？”时，他们频繁回答“是”，并把“假新闻”作为原因。这一发现支持了：\n\
  \n## 5: 综合与结论\n\n## 5.1 本研究的目的与目标\n\n本研究的目标已经达成，即：目标 1 是识别与社交媒体对政治竞选和投票偏好影响相关的理论和当前研究；目标\
  \ 2 是分析社交媒体在 2018 年哥伦比亚总统选举中的影响。本研究始于对现有文献的综述，这有助于识别和分析围绕政治营销、社交媒体作为政治营销工具以及数字营销中口碑传播的当前理论。随后，研究详细介绍了通过发放问卷和进行访谈来收集和分析数据的方法迭代过程，以理解选民以及参与总统竞选的政治和营销专的观点。\n\
  \n在现有文献中，政治营销及其策略对于政治竞选是至关重要的，因为它有助于在对人群进行细分和最终定位之前，介绍候选人并推广他们的提议。政治营销最重要的元素之一是口碑传播的实施，因为这是对选民投票期间的决策过程影响最大的策略。随着互联网的发展和社交媒体平台使用量的增加，政治营销得到了加强，允许候选人与普通大众之间进行更直接的交流，并建立更稳固的关系。\n\
  \n政治营销还激励政治参与，不仅通过投票，还通过在社交媒体上增加政治表达，这源于公民分享政治内容以及动员和改变的行动号召。社交媒体还让候选人和政党能够影响尚未决定的“摇摆”选民决策，并强化那些具有坚定预设政治立场者的观点。\n\
  \n研究结果支持了这一观点，根据访谈结果和 `Klapper` 在 1960 年对强化理论的分析，社交媒体在 2018 年总统选举中的作用是加强和强化选民坚定的预设政治立场。此外，此时需要强调的是，研究发现问卷参与者并不认为社交媒体影响了他们的投票决策，这可能引发自我感知的冲突，或者可能是社交媒体实际上并没有影响投票偏好，选民在做出投票决策时是独立的；因此，参与者可能对此持有虚假信念。尽管如此，这背后的正确原因尚未被发现，并为进一步的研究提供了可能。另一方面，问卷参与者确实认为社交媒体影响了其他人的决策以及整体选举结果。研究还揭示了在社交媒体上分享政治相关帖子与影响选民决策之间存在关系。人们更有可能分享自己和其他用户的政治观点，但不太可能转发来自政党或候选人的帖子，因为他们倾向于相信其他消费者（普通公众）而不是销售者本身（候选人），这支持了关于口碑营销的现有文献。\n\
  \n此外，社交媒体可以用来说服摇摆选民选择一个政治派别，这在选举期间通过使用正面或负面口碑实现了。在这里，叙事策略起了基础性作用，正如参与者 2 和参与者 4\
  \ 的回答所示，参与者 2 表示“社交媒体网络产生了一种已经存在的感觉，策略是利用情感玩游戏”；而 `参与者 4` 表示“该策略是对数字工具的最优利用，并将其与极具说服力的叙事相结合，这让人们思考、感受，并产生强烈的积极情感。”结果可以推断，社交媒体上的口碑在政治竞选期间对影响选民决策发挥了重要作用，特别是通过\
  \ `WhatsApp` 的使用。与此同时，还发现假新闻被用作一种负面口碑营销策略，通过社交媒体的使用，它更容易传播并接触大量人群。\n\n相比之下，结果还显示，从候选人自身的角度来看，社交媒体在政治竞选中发挥了重要作用，因为它证明它是介绍候选人、推广其提议以及直接接触大量观众的基础通信工具。然而，社交媒体在哥伦比亚的农村地区没有发挥作用，由于技术覆盖和财富水平有限，互联网访问受到限制。因此，政治营销策略应该作为传统营销策略的补充。\n\
  \n### 5.2 局限性\n\n时间是本研究的主要局限，因为研究是在 4 个月内完成的，这限制了研究的详尽和完整程度。由于由于，某些主题和发现仅进行了简要分析。\n\
  \n\n\n调查样本量也存在局限性，因为它试图代表超过 1900 万人的口群体（即选举中的选民人数）。此外，便利抽样是通过研究人员的本科生人脉获得的，该人员是学习政治的，因此这些参与者可能具有某种水平的政治知识，并且对大多数政治策略更加了解。因此，分析结果和发现可能无法准确代表作为本研究中心的人口群体。此外，调查方法论中的一个重要局限性是，选举事件发生在一年前以前，因此回答问题的参与者对真实发生的情况可能没有深刻的记忆。这限制了他们回忆准确事实以及当时感受的能力，这意味着如果这项研究是在选举期间进行的，其答案精确且真实的概率相较，现在可能会更低。\n\
  \n### 5.3：进一步研究的建议\n\n进一步研究的主要建议是调查参与者在回答问卷时自我感知的冲突，因为由于参与者所提供的答案存在矛盾，第一个假设无法得到妥善测试。进一步的研究考虑因素是调查问卷参与者为何认为社交媒体策略没有影响他们的投票决策，但影响了其他人的决策。另一项建议是扩大文献综述，将虚假新闻和强化理论等其他主题涵盖进来，这些主题在研究过程中显现出来。此外，对社交媒体营销和口碑传播作为正面或负面因素进行进一步研究是合适的，因为在本研究中，测量和分析是在更通用的层面进行的。进一步研究的最后建议是调查社交媒体是否真的影响了选民的投票偏好以及是如何影响的，并将其结果与本研究进行比较。\n\
  \n### 5.4：关于政党如何改进其政治营销活动中社交媒体使用的建议\n\n根据访谈结果，建议政党和候选人越来越多地将社交媒体作为政治营销的工具，但不要将其作为唯一策略，而是用传统的营销方法进行补充。这在哥伦比亚和其他其他发展中经济尤为如此，因为接入互联网（因此是社交媒体）目前在农村地区受到限制。根据文献综述和调查发现（`Sections\
  \ 2.6`），人们倾向于相信他人对候选人的评价，而不是候选人本人的说的话。这与商业营销的发现一致，产品和卖家身上也存在同样的情况。这导致了政治竞选遵循当前商业营销趋势的建议，这种趋势从“网红”（或伪社交媒体名人）广告产品开始，现在已转向“微影响力者”，即拥有几百到一千名粉丝的普通人。这是因为营销人员发现（与本研究的发现相似），消费者对其他消费者的信任超过对卖家本身的信任。本研究对未来政治竞选的建议遵循这条路径，并鼓励“微影响力者”与其亲密圈分享政治内容，强化他们的投票偏好。这支持了\n\
  \n## 参考文献\n\n# 11 新的安全趋势能实现“利益共担”吗？（从近期 IOC 中获得的教训）\n\nGiovanni Bottazzi^(a); Gianluigi\
  \ Me^(a); Giuseppe Giulio Rutigliano^(b); Pierluigi Perrone^(b); Luciano Capone^(c)\
  \    ^a 意大利罗马 LUISS Guido Carli 大学\n\n^b 意大利罗马“特尔盖塔”大学，意大利罗马\n\n^c 意大利罗马宪兵，意大利罗马\n\
  \n## 摘要\n\n信息安全领域的最新水平似乎一方面强调了研究活动正全力致力于识别日益智能、可易于集成和部署的技术解决方案；另一方面，基于被认为过时（或在某些情况下已不再使用）的漏洞的威胁和攻击在持续且反复地出现。本章的目的是引发对这种可见差距的讨论。主要目标是更好地理解为什么在网络安全博弈中，迄为止对抗攻击者的防御防御者似乎需要更多时间来妥善准备，也许他们不知道比赛在很久以前就已经开始了。\n\
  \n### 关键词\n\n网络安全；短缺；技能；专业人员\n\n## 1：引言\n\n查看最近的 IT 安全报告，我们可以观察到相同威胁家族几乎持续存在。互联网上总是充满了恶意\
  \ URL——每 10 个中就有 1 个（\n\n此外，由于 IoT 设备的扩散，从纯技术角度来看，一段时间以来引发了一些被认为不再使用或已完全根除的攻击技术（例如带有默认凭据的\
  \ telnet 访问或“离地攻击”攻击、MS Office 宏）。\n\n另一方面，从防御者的角度来看，技术市场提供了日益智能、集成、互联的工具和基础设施，至少在理论上，即使在复杂扩展的架构中也易于部署。\n\
  \n上述差距是否完全取决于为人知且固定的范式，例如“攻击者正在变得越来越强大”或“终端用户是互联网价值链中最薄弱环节”？\n\n可能，我们应该调查安全在多大程度上被所有利益相关者视为产品创新路线图中的关键组成（不同于清单式安全）、现代网络防御技术的普及程度如何、已实施的（安全）技术知识有多深、安全工具是否经过调优达到最佳状态，或者可能未实施的原因是什么（成本、专业技能等）。\n\
  \n终端用户的缺乏意识不仅损害他们自己，安全设计者的错误还意味着严重的负外部性。\n\n在这种背景下，我们认为网络安全的未来需要继续在技术、人员和流程之上不断堆叠，但具有不同的极化形式和形状，特别是：\n\
  \n- 技术将越来越多地集成到软件产品设计中，要求安全专业人员更多地关注集成而非安全本身。\n- 人将继续代表最薄弱环节，尽管最大的差距将影响安全专业人员，而不是终端用户，后者的设备使用自由将逐步减少（例如通过“消极引导法”引导安全行为）。\n\
  - 流程应适应新的“设计即安全（security by design）”范式以及逐步采纳的具有安全意识的法律框架，这也是因为安全和防护将日益崩溃。\n\n所有上述要点在事实和当前趋势的支持下，将对实现更好的“利益共担”成就做出贡献。\n\
  \n## 2：最广泛的网络威胁\n\n目前最广泛的网络威胁如下（\n\n\n\n\n\n# 1. 恶意软件\n任何对计算机用户有害的程序或文件。恶意软件的类型包括计算机病毒、蠕虫、特洛伊马和间谍软件。这些恶意程序可以执行各种不同的功能，例如窃取、加密或删除敏感数据；更改或劫持核心计算功能；以及在未经许可的情况下监控用户的计算机活动。今天，超过\
  \ 90% 的恶意软件通过电子邮件投递，通常隐藏在受感染的附件或不起眼的链接中。即使是一个心良好的员工，只需点击或下载恶意软件，也可能跨越最强大的防御城河。根据埃森哲的研究，恶意软件攻击的平均成本约为`240\
  \ 万美元`。如果你觉得这个数字很高，请记住，它包含了识别、处理、修补和修复受影响系统所需的近`50`项工作。\n\n# 2. 网络钓鱼\n使用伪装的电子邮件作为武器。其目标是欺骗邮件接收者使其相信信息是他们想要或需要的——例如来自银行的请求，或来自公司同事的通知——从而骗取用户点击链接或下载附件。钓鱼真正的区别在于信息的形式：攻击者伪装成某种受信实体，通常是真实的或看似真实的人或受害者可能与之开展业务的公司。在一项针对全球\
  \ IT 决策者的调查调查中，超过半的人表示，针对性的钓鱼计划是其组织面临的首要网络安全威胁。丢失或被盗的个人记录会给企业带来`225 美元`。然而，很少有网络攻击仅针对一条记录。在经历数据被盗的公司中，超过`74%`\
  \ 的公司在泄露期间平均丢失`1000`个文件。\n\n# 3. 勒索软件\n是一种恶意软件，通过阻止或限制用户访问系统，通过锁定系统屏幕或锁定用户文件（除非支付赎金）。\n\
  \n# 4. 无文件攻击\n\n# 5. 人为错误\n无意泄露、意外删除数据或对敏感文件的不当处理均属于人为错误，这是一种常见但被忽视的企业威胁。人为错误应重点关注网络安全意识和数据处理策略等术语。此类网络安全威胁占数据泄露的`27%`，每条受损害记录为企业带来约`148\
  \ 美元`的成本，可能花费`196`天才能发现并对账。\n\n## 3: 攻击者的视角\n\n今天的 IT 安全话题需要对一个涉及许多参与者、隐形但日益繁荣的行业提供一些思考空间。这可以被称为`漏洞链`，因为根据精确的逻辑，可以识别出阶段和结构化程序。然而，多年来，软件、操作系统和硬件设备中新漏洞的发现以各种方式引起了公司、犯罪组织甚至政府的兴趣。我们认为，行业对\
