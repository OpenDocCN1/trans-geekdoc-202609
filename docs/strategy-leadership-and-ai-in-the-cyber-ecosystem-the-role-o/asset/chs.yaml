  \n## 3: 数据演变为大数据\n\n由于 `AI` 的快速创新，我们也看到了数据产量的稳步增长。相比之下，大数据可能会消除目前的局限性，使用户能够获取数据创建者在创建时可能未想到的信息\n\
  \n## 4: 人工智能技术与职场\n\n`AI` 技术的利益对雇主和员工都是同等且无处不在的\n\n## 5: 人工智能与劳动力\n\n毫无疑问，与过去的任何工业革命或数字革命一样，目前劳动力中出现了前所未有的能力。劳动力的传统演变将看到“数字移民”\n\
  \n## 6: 数字孪生\n\n`数字孪生`（`DT`）一词最早出现在`2000` 年代初。物理信息与利用大数据支持的虚拟空间之间的连接被称为`DT`。相反，\n\
  \n## 7: 人工智能伦理与治理\n\n数字创新的发生速度（主要由于竞争性市场）带来了风险和问题的某种增加，主要涉及伦理和治理。研究表明，伦理化收集和使用数据的影响正变得广泛。这些挑战最常见的例子是近期发生的事件，如`Facebook/Kogan/剑桥分析公司`丑闻。在这方面，诸如`埃隆·马斯克`、`比尔·盖斯`和`史蒂芬·霍金`等几位\
  \ AI 领袖强调了人工智能潜在的负面影响和值得怀疑的方面。正式治理是行业现在可能需要重新学习变得更加关注并在开发上稍微放慢。这是为了确保在开发技术的同时，能够建立针对这些伦理因素的充分治理框架。同样，关注于\
  \ AI 改进行业、职场以及人们工作方式的进步；所有从人工智能应用中获得的收益，在全球互操作性和标准操作程序方面达到了平衡\n\n## 8: 项目管理中的人工智能\n\
  \n作者利用 `PMI` `PMBOK` 对各种学术文献来源进行了深入回顾。并对`项目管理知识体系指南``PMBOK`中的每个知识能力领域进行了进一步的批判性审查\n\
  \n## 9: 研究结果与批判性讨论\n\n本研究通过对批判性文献综述中可用信息进行综合，主要目标是确立人工智能技术创新的关键主题。这项研究有助于进一步分析和确定项目管理专业领域对这些主题的意识水平和态度。\n\
  \n研究方法和调查问卷经过设计并通过互联网分发给项目管理专业组织，包括项目管理协会（`APM`）和项目管理协会（`PMI`），以及作者自己的专业网络和组织项目管理办公室（`PMO`）。\n\
  \n\n\n\n本研究的年龄跨度范围广泛，样本人群的平均年龄在 40 至 49 岁之间。平均年龄表明，样本人群可能被认为处于数字原住民的边缘。\n\n在对当今职场\
  \ AI 技术利用的研究中，使用了一个研究问题来测试工作。\n\n随着 AI 技术在职场内的进步，该技术的使用可能意味着雇主和员工都必须适应当前的工作模式。本研究还调查了……的研究。\n\
  \n当组织寻求在 AI 技术方面进行创新时，文献综述识别出企业开始制定数字战略的倾向。\n\n随着 AI 技术在职场中变得日益普及，人机界面具有进一步发展的潜力。\n\
  \n随后，本调查研究了样本人群在职场中对所识别 AI 利用情况。数据表明，AI 使用的可能重点可能集中在更常采用的 AI 技术形式上，例如云计算和协作工具。这可能归因于目前行业对构建数字战略的关注。\n\
  \n大数据是 AI 技术创新的可能基础和新兴关键驱动力。\n\n此外，考虑到近期发生的一系列数据被误用的事件，这种情况是极其可能的。\n\n随着 AI 行业在英国的增长。\n\
  \n此外，这个问题支持了……的呼声。\n\n同样，本调查收集了关于使用 `APM` 进行项目管理的知识和能力的数据。\n\n研究表明，AI 技术的出现可以说是职场内最大的颠覆者。一个可能的结论可能是利用数字时代平等地分享创新，以确保在多产且高效的员工队伍之间实现平衡的方法。尽管如此，这不应以人性为代价。\n\
  \n从这项研究中显而易的是，AI 技术创新正在不断演变，并可能带来许多重大挑战。这可能对项目管理专业产生的影响目前是无法衡量的。然而，让未来的业务决策者和项目经理做好应对职场\
  \ AI 技术发展的准备，以及相关的人机关系管理特征、AI 技术利用以及治理和伦理视角，至关重要。对于项目经理来说，为了保持相关性，确保其技能在拥抱新兴理念的同时具有适应性至关重要。此外，企业应该制定稳健的业务战略，以协助管理这一新兴数字时代进步过程中可能出现的任何进一步发展。\n\
  \n## 10: Conclusions\n\n本研究的目的是提供有用的初步见解，同时帮助项目管理人员进一步了解 AI 创新和技术是如何进入职场的，以及如何潜在地与\
  \ AI 接触。此外，本研究预计将激励未来的研究人员开发项目管理专业内 AI 使用创新的想法。同样，随着研究的发展，它还旨在通过 AI 和信息物理数字孪生相互关系的帮助，成为未来项目管理专业结构重组的重要组成部分。人们认为该专业在未来几年内将经历一场令人兴奋的转型，同时将\
  \ AI 技术纳入知识能力体系中。\n\n这是通过完成三个目标实现的。`Objective 1` 是对 `Industry 4.0` 背景下 AI 技术创新兴起的相关文献进行批判性回顾，识别关键方面。同样，`Objective\
  \ 2` 是通过对项目管理中 AI 技术实现方面的批判性回顾实现的。`Objective 3` 是准备一种收集数据的方法。\n\n本研究的局限性从这项工作中是显而易见的。文献综述识别了关键主题。然而，由于空间和资源的限制，本报告仅涵盖了研究的一部分。此外，随着研究的进行，收集了大量数据。\n\
  \n希望这项研究能提供有用的初步见解，同时帮助项目管理人员进一步了解 AI 创新和技术是如何进入职场的，以及如何潜在地与 AI 接触。\n\n\n\nGordon\
  \ Bowen Northumbria University, London, United Kingdom\n\n\n本文试图探讨数字时代的领导力，这引发了数字领导力。数字技术使得人们对持续、动态、主动且复杂的环境中的领导方法进行重新思考。电子隐私需要各方的同意；如何与他们互动是本文的主题。此外，本文讨论了所需的领导力类型以及未来如何发展，这被确定为后通用数据保护条例（GDPR）时代。最后，但重要的是，讨论了电子隐私辩论带来的挑战，例如集体隐私，以及从\
  \ `GDPR` 的勾选框转向需要首席执行官和高级管理团队承诺的认可全球框架。声誉损害和监管机制的力量可以成为让企业从精神上遵守 `GDPR` 而不仅仅将其视为业务处罚的工具。\n\
  \n### Keywords\n\nEthics; Ethical leadership; Morality; Privacy; Digital leadership\n\
  \n## 1: Introduction\n\n2014 年 `IBM` 表示网络攻击最多的五个行业分别是制造业 26.5%、金融和保险 20.9%、信息和通信\
  \ 18.7%、医疗保健和社会服务 7.3%，最后是零售和批发业 6.6%。\n\n网络相关活动的规模需要数字领导力和信息治理来保护个人和业务数据，而且这些工作的实施应该基于伦理行为。从所呈现的数据中显而易见，应该建立一个支持信息治理和数字领导力的监管环境。本文的重点是讨论监管环境应该是怎样的，以及什么构成了数字领导力和信息治理。\n\
  \n本文将利用学术文献中战略、伦理和领导力的概念和模型，但在人工智能（AI）和网络安全的背景下对其进行评估。\n\n## 2: Ethics and consent\n\
  \n\n\n\n\n# 管理与伦理\n\n管理和商业中的决策预计将遵循伦理标准，且不合规的行为相对容易被识别。企业面临着各种治理流程的影响，从记录在案的公司治理政策到来自会计和审计师等机构的外部干预。这些治理结构并非完美，确实会发生严重的违规行为，但它们提供了某种程度的透明度，从而实现了监督并具有伦理背景。然而，由于由于网络空间中的活动透明度较低，问题在于如何提高透明度。\n\
  \n## 同意的概念\n\n多年来，甚至几个世纪以来，同意一直是伦理的基础。道德责任需要同意，并且从个人或商业角度来看，它是任何互动的核心。同意的产生需要两个参与者：给予同意的\
  \ `consentee`（同意者）和向 `consentee` 请求同意的 `consenter`（请求者）。\n\n将同意过程应用于 `AI` 有其自身的挑战，但本文记录了一种方法。除非应用了条件和条款，否则同意是各方面的权利转移。权利的转移使得同意成为一个转化过程，改变了同意权利转移的双方之间的道德图景；因此，行为变得许可或不可许可。\n\
  \n## 数字同意\n\n在讨论了同意之后，现在可以讨论数字同意了。挑战在于让数字同意在道德上具有约束力，鉴于引言中讨论的情况，这是非常有必要的。在线同意通知依赖于在\
  \ Cookie 横幅或弹出设置中点击“确定”。最常见的方法是留在网站上不更改任何设置。这些获取具有约束力同意的方法在法律上是正确的，但它们在道德上是可以接受的吗？\n\
  \n持续同意比结论性同意（一次性）更合适，因为它提供了撤回的选项。支持持续同意的工具使用了隐私仪表板方法，例如 `Google` 和 `Facebook`。通常，数据和信息被提供给第三方，然后对公众或用户不可见。因此，最有效的隐私同意是拒绝或限制数据收集的同意。然而，上述类型的同意并不支持合作伙伴关系的同意。\n\
  \n在 `AI` 和大数据分析流行之前，对隐私同意的早期尝试是允许用户设置自己的隐私设置。\n\n## AI 在隐私中的作用\n\n为什么不使用 `AI` 来开发信息隐私系统呢？利用\
  \ `machine learning` 的优势是一个明显的可能性，可以用于建立信任、知情建议和相关信息。`AI` 现在可以评估应用程序的行为；例如，曾使用 `AI`\
  \ 分析了 `18,000` 个免费 `Android` 应用程序的隐私政策，揭示了隐私政策中存在的差异。用户和设计者将从 `AI` 生成的同意中受益，因为用户现在能够给出知情同意，而设计者可以限制责任。\n\
  \n自动化隐私同意将有助于改进通知和选择，但可能会授予代理或第三方同意。`Machine learning` 能够理解用户的行为，并推断传递信息是否会引起用户的隐私异议。此外，`machine\
  \ learning` 工具可以提供用户隐私设置的预测性，从而产生“隐私画像”。\n\n## 3: 伦理维度与领导力\n\n对隐私同意的讨论引入了伦理和道德的概念，这与数字组织需要追求并实现的领导力类型很好地联系在一起。作为在数字环境中讨论领导力的合适起点模型是\
  \ `attribution model`（归因模型）。`attribution model` 指出人们会解释他人的行为。\n\n在讨论伦理领导力之前，需要了解哪些先兆与有效的领导力相关。\n\
  \n### 战略规划\n\n有效领导力的第一个属性是建立在战略规划的基础上——`Drucker` 表示未来无法预测，但可以被创造。创造未来需要战略规划。\n\n\
  ### 伦理与诚信\n\n有效领导力的第二个属性是对比商业伦理和个人诚信的要求。\n\n### 军事模型\n\n第三个属性是，有效领导力需要一种典范军事领导模型。\n\
  \n### 激励与知识\n\n有效领导力的第四个属性是领导者要以正确的方式进行激励。\n\n\n\n\n最后一个属性是将营销概念应用于领导力——德鲁克将员工称为“伙伴”，他们不能被命令，只能被说服；这是从员工被视为“体力劳动者”转变为“知识工作者”的范式转变。从根本上说，营销是关于理解客户的需求和渴望，然后满足他们。这不仅仅是说服客户购买产品或服务。德鲁克认为，如果营销做得完美，就不需要销售了。在实践中，销售与营销协同工作。然而，要以一种证明对其需求理解并让他们产生共鸣的方式接触客户，现代营销需要对客户细分及其价值观和行为有理解。领导者需要以同样的方式对待员工。\n\
  \n德鲁克（引用自\n\n在对管理大师德鲁克的基于有效领导力进行探索之后，现在是时候探讨伦理领导了。\n\n1. 诉讼和法律成本的增加；\n2. 员工试图通过旷工或偷窃来获得“公平交易”；\n\
  3. 信任度的迅速下降；\n4. 恐惧、消极攻击和愤怒的迅速增加；\n5. 诚信和道德正直的丧失。\n\n伦理似乎处于一种“持久的模糊状态”；为了打破这一趋势，企业需要培养“骨气”，即超越模糊性和主观性，转向基于原则的伦理。企业需要制定一种“准不可侵犯”的原则，通向“一个除非导致我们违反更高级别，否则不会放弃的道德目标”（\n\
  \n原则和挑战已有充分的文献记载，关注其中一些问题是值得的。贯穿本文的一个一致主题是道德与伦理，以及如何应用这些来解决数字时代的领导力问题。进一步讨论伦理道德领导力是恰当的。数字领导需要在隐私信息过程中拥抱技术（创建技术解决方案，即解决问题）。技术的实施不仅应该包括参与实施的人，还应该包括与结果互动或交流的人；例如，隐私信息过程需要组织内部（内部和外部）的通用访问。领导力变成了一种整体活动，跨越所有内部和外部边界，实现人员与组织价值观的一致。文章认为，伦理道德领导力是应对需求和挑战的方法。\n\
  \n伦理与领导力是相互交织的，为了伦理领导的成功，这种哲学方法是必要的（\n\n存在多种伦理领导力方法，并将重点讨论那些与数字时代领导力“更契合”的方法。后续文本将讨论有关伦理领导力的主题（\n\
  \n柏拉图写过自我认知和自我发展对于理解“善”或重要事项的重要性。福柯对伦理与自我之间的关系感兴趣，这与苏格拉和柏拉图的观点一致。孔子写道：“人学在己”（\n\n\
  马基雅维利理解了反对腐败和无法治社会秩序的需求。这并非完全拒绝道德，而是伦理取决于情况（即选择较坏的结果）。领导者受实用主义的指导，因此具有情境领导力。软硬实力与情境领导力相关；因此领导力植根于语境。数字环境是快速、动态、主动且不断变化的；因此，语境可以被视为一个持续变量。在这种环境中开发整体领导力技能需要应用硬软技能的能力，并识别在伦理领导力背景下哪种类型是合适的，这种背景是建立在道德基础之上的。\n\
  \n福柯将伦理领导视为一种自我建构的过程（\n\n伦理领导的另一个分支是包容性能力（即利益相关者管理）。伦理领导者需要是一个负责任的领导者（\n\n未来数字领导力的特质是什么？数字时代需要能够在道德基础之上实践伦理领导的领导者。他们需要具有德鲁克所识别的特质的有效领导者，并在内外部的不同环节（客户、用户和消费者）实现“更深层次”的数字领导力整体方法。数字领导者需要理解不断演进和已建立的技术趋势，并展示端到端的领导力（产品-过程-人员）。此外，他们需要战术性（解决问题）、战略（前瞻）以及跨文化工作的技能，以及人员管理技能（与利益相关者互动），并应用伦理情境领导力风格。情境领导要求根据不理想的情况进行判断，这将要求数字领导者进行风险评估（哪些行动最坏，它们将如何影响组织、人员和市场上的声誉）。伦理领导者需要从整体上理解脆弱性、风险及其可能的影响。这特别重要，因为情境领导意味着会有后果，产生赢家和输家。与员工、用户、客户、消费者和其他利益相关者的持续接触是缓解情境领导力结果的方法。情境领导中的决策必须被认为是公平的，且决策者具有“道德骨气”。\n\
  \n\n组织对声誉风险的担忧并不新鲜。声誉风险报告 `Reputational@Risk` 对 300 多位高管就声誉风险对其业务的重要性进行了调查，发现 87%的受访者将声誉风险评为“重要”或“非常重要”。此外，公司\
  \ 25%的价值与声誉相关。在后续文本列出了隐藏的声誉风险（\n\n\n\n公司的声誉受以下因素影响：\n\n* 财务表现——股东、投资者、贷款人和许多其他利益相关者。\n\
  * 质量——遵循质量标准的意愿。产品召回对声誉有负面影响。\n* 创新——通过创新流程和独特/小众产品与竞争对手区分开来的公司往往具有很高的知名度和声誉价值。\n\
  * 伦理与诚信——拥有强大伦理政策的公司在利益相关者眼中认为更值得信赖。\n* 危机响应——利益相关者密切关注公司如何应对困境。危机期间的任何行动最终都会影响声誉。\n\
  * 安全——强大的安全政策确认安全和风险管理是公司的首要战略任务，这有助于建立信任和创造价值。\n* CSR（企业社会责任）——积极推动健全的环境管理和社会责任计划有助于建立声誉的“安全网”。\n\
  * 安全性（Security）——防御物理和网络安全威胁的强大基础设施有助于避免损害公司声誉的安全漏洞。\n* 实时分析——高效处理和综合实时数据。模式检测和识别等工具能够实时识别和报告问题。\n\
  * 文本分析——使用自然语言处理、情感分析和计算语言学来识别和提取主观信息。\n* 大数据——成本效益地监控大量的内部和外部数据源。\n\n\n\n\n\n*\
  \   前瞻性且外向的视角——评估未来的战略、运营和战术驱动因素，从外部视角补充风险。\n    *   早期预警——通过改进信噪比来发现预警信号并避免意外。\n\
  \    *   可操作的洞察——提供能够影响业务的即时洞察。\n\n投资数据洞察为公司提供决策支持，并产生积极影响。\n\n影响声誉的因素是数字环境中的主要问题。隐私保护需要技术、伦理以及应用，以降低声誉风险。为了保护声誉，需要对声誉进行评估，这对于企业是至关重要的。\n\
  \n\n上述讨论了隐私政策实施的挑战，即数字环境对隐私的影响。此外，隐私政策（Privacy）是需要考虑的挑战。\n\n\n数据保护条例（GDPR）是为了保护数据流动。\n\
  \n通用数据保护条例（GDPR）是为保护数据流动，这可能影响数据保护。\n\n\n\n\n我们讨论了有效的领导力对于支撑隐私信息过程的性。德鲁克定义了与领导力相关的五个属性，这些属性在管理数字环境中非常重要。信息和数据分析可以带来新的业务机会；因此，从道德和伦理角度来看，数据的完整性需要领导力来赋予员工正直行为的能力，确保他们的行为不会对组织结果产生负面影响。本文引言部分提到了信息处理过程中治理结构的需求，包括隐私，但只有在员工积极且领导有效的情况下，这些结构才能发挥作用。德鲁克指出，领导力不是绝对的，而是取决于文化。另一个重要点是，领导力必须设定文化以实施有效的领导，因为组织文化会各不相同；因此，在一个组织中有效的领导力在另一个组织可能并不适用。\n\
  \n有效的领导力在离散环境中有效，但在连续环境中（驱动因素是全球化，即互通性和整合，以及文化认同和宗教强化），则需要不同的领导风格，即数字领导力。数字领导力是变革性领导力，因为变革必须发生在组织内部，并涉及用户、客户、消费者和外部代理的参与，且包括通过数字隐私过程进行的交互类型。伦理领导力的不同立场有助于决定哪些类型的伦理领导力能够舒适地适应数字时代。同意、电子隐私、人工智能和网络安全只是数字领导者将面临的挑战示例，以及这些挑战将如何演变，而它们的影响是另一个重大挑战。无需而喻，数字环境是连续的、多变的（颠覆性的）、主动的、复杂的且动态的；这些特征都会影响机会窗口，从而影响企业竞争优势的可持续性。讨论表明，要在描述的环境中领导，需要具有道德视角的伦理领导者，而且仅仅符合伦理标准是不够的。伦理领导力需要联系企业价值观和行为；然而，价值观不是标准的；它们受到文化（国家和组织）和社会的影响。伦理领导者有责任制定植根于公司价值观和文化的标准。\n\
  \n电子隐私辩论创造了更多风险和漏洞，包括声誉风险，以及在后-`GDPR` 时代审查 `GDPR` 框架的需求。声誉风险问题将促使企业在电子隐私方面做更多工作，因为这将影响他们的业务。对个人数据和信息的保护需要企业超越“勾选式”的方法，将其嵌入到组织的文化和福祉中。仅靠财务罚款无法带来这种变化，因为它是深刻且具有变革性的。在这一新世界约束企业文化需要组织高层的问责制，这可能需要一种法律程序，让\
  \ `CEO` 和高级管理层对数据保护承担问责和法律责任。单凭罚款可能被认为只是经营成本，而且孤立来看，它们不太可能改变整个组织的行为。这在后-`GDPR` 时代尤为重要，因为去中心化的生态系统可能需要重新审视伦理概念和原则并对\
  \ `GDPR` 框架进行更改。在后-`GDPR` 时代，利益相关者的参与将成为常态，以确保业务政策和 `GDPR` 过程透明，并将对问责的接受根于组织文化。数字领导者需要以活力、承诺以及符合用途的道德指南针或“骨气”来拥抱后-`GDPR`\
  \ 时代。`CEOs` 可能需要重新学习或修改当前的伦理思维，这将影响他们的道德哲学。技术公司正在推动同意辩论的发展，确保第三方（公司内部或外部）无法识别个人个人数据，因为电子隐私过程在对数据进行分析和处理期间会保持加密。加密过程的“强度”将决定集体或小组电子隐私过程的信誉。未来的技术可以在不破坏加密过程的情况下窃听数据。此类行为需要被纳入后-`GDPR`\
  \ 时代。后-`GDPR` 时代需要不同技能的人员，例如业务网络安全审计师，他们可能具有财务和 IT 背景；对这些新人员质量的保证需要认可的资质和认证。谁应该负责制定和维护这些资质的标准和质量？这是否需要政府监管，还是外部质量控制就足够了？风险评估应只是公司内部事务，还是需要政府干预以确保合规？默认的\
  \ `GDPR` 框架（`EU` 框架）是否足以代表一个由全球化驱动的世界？这些只是后-`GDPR` 时代需要解决的监管问题的一种。\n\n\n可以确定，成为一名数字领导者具有挑战性，因为其所需的范围和技能。领导者面临的挑战是为自己和公司建立一套符合组织需求的道德哲学（价值观）。数字时代由全球化、主动性和文化驱动，这需要一种伦理领导风格，这种风格将不断演变以应对后-`GDPR`\
  \ 时代的新挑战。未能发展伦理领导风格并用其嵌入必要且适当的公司价值观的领导者，可能会导致政府监管干预，以强化问责制和法律责任，确保个人数据处理稳健且符合用途，从而影响隐私环境。领导者需要建立一种与公司文化和价值观一致的道德哲学，以开发可持续的竞争优势。\n\
