  \n### 1.6: 身份保障\n\n身份保障是一个关键组成部分。包括身份欺诈在内的欺骗活动已对现状构成了巨大威胁。\n\n英国国家欺诈和网络犯罪报告中心记录了大量事件。仅其中一项统计数据在\
  \ 2017 年就导致了 4100 万英元的损失。\n\n### 1.7: 身份验证\n\n通过……批准实体的过程被称为身份验证，用于确定实体（人员或应用程序）是否有权访问所请求的内容。在网络环境中，验证身份的常用方法包括“登录凭据、多因素认证、第三方认证、简单文本密码、3D\
  \ 密码、图形密码、生物识别认证和数字设备认证”，如所示。所有的 DI 交易方案本质上都依赖两个过程来将个人与 DI 关联：\n\n*   身份认证：在注册时完成，并根据注册方案设定的标准进行。收集信息用于验证。\n\
  *   身份核实：这是一种验证过程，确保个人被正确识别。这些识别信息可以是从简单的签名或照片到增强的生物识别信息的任何内容。在某些方案中，可能需要这些组合。\n\
  \n### 1.8: 零知识证明\n\n零知识证明（ZKP）是一种方法，通过它可以向验证者证明某个陈述或知识是真实的，而无需透露除该知识或陈述真实性之外的任何信息。\n\
  \n零知识证明的概念并不新，它最初于 20 世纪 80 年代提出，但近年来来其解决隐私和安全问题的能力引起了许多区块链（BC）社区的关注。（区块链主题将在本章稍后部分讨论。）许多行业对采用区块链持犹豫态度，一项研究显示：\n\
  \n流行的阿里巴巴山洞插图以一种简单的方式描述了零知识。山洞在标记为 X 的附近有一个单一入口；有两条路径（左路径和右路径）通向山洞另一端的密门。密门封锁了左路径和右路径之间的路线，只有当证明者知道秘密且不向验证者泄露秘密时，才能打开。\n\
  \n\n\n\n证明者进入洞穴并随机选择一条通往秘密门的路径。随后，验证者进入洞穴并停在标记 X 处。验证者指示证明者通过通向 X 的随机路径出来。只有当证明者知道秘密时，在验证者每次随机选择路径时，秘密门才会打开。然而，如果证明者不知道秘密，那么证明者有\
  \ 50% 的概率通过正确路径出来。这种挑战会多次重复，直到验证者确信证明者的主张并非基于运气概率。\n\n根据定义：\n\n* ○ 完备性（Completeness）——只有当证明者拥有秘密时，它才能证明它，且只有当秘密真实时，验证者才会被该事实说服。\n\
  * ○ 健全性（Soundness）——只有当秘密真实时，证明者才能进行证明，因此证明者面临的挑战越多，如果它是真实的，那么概率就是真实的；但如果存在一个谎言，则证明者并不知道秘密。\n\
  * ○ 零知识（Zero knowledge）——如果秘密真实，那么验证者除了得知秘密为真之外，学不到任何其他信息。\n\n零知识证明（ZKPs）存在两种形式：交互式和非交互式。\n\
  \n* ○ 交互式：证明者通过执行一系列动作来证明一个事实，以说服验证者事实已知。这种方法基于多次证明该事实的概率，并由验证者设定的规则定义。如果证明者在挑战过程中出错，则不知道该事实的概率就会增加，验证者不会被说服。如果验证者未被说服，该过程可能会耗时，并重新开始一系列挑战。\n\
  * ○ 非交互式：不需要证明者和验证者之间的交互。它是由证明者提供的证明，验证者可以自行进行验证。它针对大量的验证者群体，且验证事实的效率极高。\n\n身份验证是\
  \ ZKP 可以应用的主要场景之一。由于其设计，它能够缓解伪装攻击、由于在受到挑战时表现出的随机能力而缓解重放攻击，以及在交换零知识时缓解中间人（`MitM`）攻击。它还能抵御智能卡系统易受的逆向工程攻击，尽管它也有其局限性，这些缺点在于如果秘密不是数字，则可能需要翻译，且被隐藏的证明的质量仅依赖于秘密本身。\n\
  \nZKP 已用于某些区块链生态系统；其中一个例子是名为 `Zcash` 的加密货币平台；它使用一种称为零知识简洁非交互知识论证（`zk-SNARKs`）的非交互迭代版本。`zk-SNARKS`\
  \ 缩写名称代表以下结果及其特征：\n\n* ○ 零知识（Zero knowledge）——不暴露任何信息。\n* ○ 简洁（Succinct）——证明在几毫秒内即可验证，极其高效。\n\
  * ○ 非交互式（Noninteractive）——证明者和验证者之间没有交互，因为证明记录由单条消息组成。\n* ○ 知识论证（Argument of knowledge）——一种健全且利用多项式时间的计算证明。\n\
  \n### 1.9: 身份管理 (`IdM`)\n\n`IdM` 是管理、管理和使用身份的过程。大多数 `IdM` 方案是中心化的并由实体拥有，尽管以用户为中心的模型为个人提供了控制权。`IdM`\
  \ 支持创建、管理和使用身份的功能。无论采用何种方法，`IdMs` 核心的一个基本功能是安全地将标识符与属性绑定。标识符可以在特定领域内明确地区分用户与其他用户，而属性是如个人的姓名和年龄等主张。\n\
  \n#### 1.9.1: 联邦身份\n\n联邦身份系统允许用户通过 `IdP` 建立身份。单点登录（`SSO`）协议以此这种方式工作的；`SSO` 被称为单一\
  \ `IdP`。许多 `SSO` 方案被公共部门和商业部门使用。`SSO` 协议可以说是当今最成功的身份验证解决方案之一；它们允许用户通过 `IdP` 访问大量服务，尽管一个主要缺点是如密码之类的单一身份验证方法可能会被破解并导致攻击者获得访问。为了缓解这一点，`SSO`\
  \ 可以配合多因素身份验证。\n\n#### 1.9.2: 以用户为中心的身份管理\n\n以用户为中心的身份管理系统将控制和管理身份信息的责任交给个人。这种解决方案允许用户在智能卡或便携设备等防篡硬件设备上存储第三方提供的标识符和凭据。实体担心的是无法得知使用系统的用户的精确身份。\n\
  \n#### 1.9.3: 去中心化标识符\n\n去中心化标识符（`DID`）是将标识符与用户绑定的身份机制。`DIDs` 是包含唯一标识符的数据结构，并为每个标识符有一个相关的公/私钥对。不需要中央注册机构，因为\
  \ `DID` 注册在分布式账本（DLT）上。每个 `DID` 主体都有发布和签名可验证主张的能力，让所有者控制其身份的各个方面，如属性或主张。`DID` 规范强烈建议将所有个人身份信息\
  \ (`PII`) 保留在账本之外，并存储在主体控制的终端上。\n\n\n\n\n- 终端用户\n    - 用户提供虚假的身份信息，导致他人使用了用户的凭据。\n\
  - 信赖方\n    - 依赖虚假的身份信息。\n    - 未能保护个人数据。\n- 身份提供者\n    - 错误地识别和验证个人。\n    - 未能保护个人数据。\n\
  \    - 未能验证或撤销个人的详细信息。\n\n一项研究表明\n\n一个例子是在注册 Facebook 时；他们的条款（\n\n![Fig. 5]\n\n\
  图 5 Facebook 注册页面。\n\n在全球范围内，各国政府意识到行业需要采用互联网技术以保持竞争力，因为采用这些技术使他们能够适应变化。在过去的几年中，许多障碍被消除，为电子商务铺平了道路。例如美国联邦政府于\
