  \n因此，显然，寻找新`0-day`（零日漏洞）的兴趣主要基于经济因素，例如吸引日益精选的参与者的注意力，他们被此类漏洞所提供的潜力所吸引。然而，由于其天然且快速的过时性，这一特定市场从长期来看往往与低成本漏洞市场合并。因此，垃圾邮件和网络钓鱼活动通常被用于传递勒索软件以进行勒索，收集用于转售的信息和个人数据，窃取银行凭据，并创建各种诈骗。该领域的许多专业公司（尤其是`消费`领域）开始关注此类威胁，提供日益复杂的硬件和软件产品，并声称能够识别并对比被视为恶意的行为。\n\
  \n在这种情况下，国家级参与者的介入越来越多，他们致力于利用这些知识进行间谍活动或调查目的。\n\n然而，与过去相比，今天发现新漏洞要困难得多，因此增加了所需的专业水平。事实上，只有少数专家安全研究人员能够发现它们，并有能够在此类活动中投入巨资源的公司支持。现在已知，例如能够在`IOS`和`Android`上执行远程代码（`RCE`）的`0-day`\
  \ 价值高达`100 万美元`。专门买卖漏洞的公司通常在拥有利用这些漏洞实施所需的珍贵技术细节的人之间充当真正的经纪人。近年来，人工智能算法和日益精炼的机器学习技术正在传播。\n\
  \n\n\n\n\n然而，使用尖端技术似乎不足以彻底击败盛行的网络威胁。为了证实这一观点，该行业内的重要组织和供应商进行了多项分析，结果显示，日益复杂的社会工程技术的使用频率正在增加，而且所使用的工具不仅由于已经存在于被攻击的目标系统中而被认为是可靠的，而且被用于其他目的。因此，人为因素是这一切的核心，而且它代表了一个无法消除的变量。事实上，今天超过\
  \ 99% 的网络攻击都是由人工触发的，其中大多数（例如）是从一封钓鱼邮件开始的（\n\n为了证实上述关于一般“人为因素”的论述，我们可以回顾天文学家克利福德·斯托尔（Clifford\
  \ Stoll）在其出版于 1989 年的书中讲述的故事《金谷莺蛋：在计算机间谍迷宫中追踪间谍》（`The Cuckoo's Egg: Tracking a Spy\
  \ Through the Maze of Computer Espionage`）。他被一名计算机黑客追踪了几个月，该黑客可以免费使用他所负责的加利福尼亚劳伯伯利国家实验室（`LBNL`）的计算资源。这一事件在今天被认为是历史上首批（如果不是第一批）记录在案的\
  \ APT 攻击。\n\n斯托尔使用连接到调制调器的打印机来转录攻击者发的所有命令，并记录黑客执行的活动。后者寻求并有时获得了对美国各种系统（包括军事系统）的未经授权的访问，搜索包含\
  \ `nuclear`（核）或 `Strategic Defense Initiative`（战略防御计划）等特定关键词的文件，复制包含密码的文件（以便随后进行字典攻击），并编写了典型的木马脚本来发现新密码。即便如此，斯托尔仍然注意到，黑客获取这些本应受到高度保护的资源是如此简单，这归因于许多系统管理员的肤浅，他们从不懒于更换默认密码，或对他们应该管理的系统进行正确的配置（\n\
  \n鉴于目前为止的内容，显而易见，许多年前提到并使用的技术在今天仍然在使用，尽管其方式变得更加精炼和复杂，但为了获得相同的结果。\n\nSophosLabs 的《2019\
  \ 年威胁报告》（`Threat Report 2019`）（\n\n在过去的十年中，网络罪分子试图自动化大量的攻击，以便快速且大规模地利用已知的漏洞。各种漏洞工具包在专业网站上随处可见并扩散，这并非巧合；通过大量发送包含恶意附件的电子邮件，垃圾邮件和钓鱼活动泛滥；而且社会工程学出现了宏观上的增长，这通常是勒索软件、间谍软件、木马等传播的前兆。然而，自动化面临着“可预测性”的问题。例如，一旦识别出恶意邮件，实际上采取必要的防御措施以防止类似的邮件送达目的地或携带任何恶意软件是相对简单的。\n\
  \n因此，在这一方面，近年来回归过去已变得必要，特别是在所有攻击者试图进行“针对性攻击”的情况下。在这些情况下，所执行的活动大多数是手动操作的，攻击者的行为在本质上变得变得不可预测，因为例如，他有可能对防御系统可能采取的反制措施做出反应，并因此根据不同且难以对比的方案来修改攻击场景。显而易见，此类行动仅适用于极少数的“受害者”样本。\n\
  \n## 4. 防御者的视角\n\n前几段中说明的概念必须是一个优秀良好御者的技术背景。但这仍然不足以阻止网络攻击。这就是网络安全发挥用场的地方：网络安全是保护网络、设备和程序免受任何类型网络攻击的状态或过程。\n\
  \n我们将尝试通过分析不同类型的网络安全系统来总结防御者的视角：\n\n### 4.1 网络安全防御系统\n\n可以将网络攻击分为两个不同的类：\n\n1. 第一类涉及攻击者想要获得的内容：\n\
  \   - `stealing information`（窃取信息）\n   - `tracking user information`（追踪用户信息）\n \
  \  - `taking control of a system`（控制系统）\n\n2. 第二类涉及攻击者用于利用现有漏洞的向量：\n   - `hardware`（硬件）\n\
  \   - `network`（网络）\n   - `application`（应用）\n\n网络安全防御系统可以分为以下四类：\n\n1. **系统架构**：为特定架构设计的安全系统：\n\
  \   - `stand-alone`（单机）\n   - `centralized client server`（集中式客户端服务器）\n   - `collaborative\
  \ architectures`（协作架构）\n\n2. **检测类型**：属于此类别的安全系统运行在上述的攻击向量（`hardware`、`network`\
  \ 和 `application`）层面。主要有两个类别：\n   - `anomaly-based detection`（基于异常的检测），基于对正常情况的建模来识别异常的发生。\n\
  \   - `signature-based detection`（基于特征的检测），基于一个可能指示特定类型攻击的特征数据库；它们将入流量与这些特征进行比较。\n\
  \n3. **数据类型**：安全系统可以根据分析数据的类型进行分类：\n   - `application data`（应用数据）\n   - `file data`（文件数据）\n\
  \   - `network data`（网络数据）\n\n4. **生态系统**：安全系统可以根据它们必须保护的生态系统进行分类：\n   - `enterprise`（企业）\n\
  \   - `mobile devices`（移动设备）\n   - `IoT`（物联网）\n\n在...报告的表格（表 1）：\n\n- (a) 网络解决方案包括组织防火墙和网络入侵检测系统（`NIDS`）。\n\
  - (b) 内容过滤解决方案包括代理、Web 客户端攻击检测以及电子邮件钓鱼和垃圾邮件检测。\n\n\n\n\n\n### 3. (c) 终端解决方案包括基于主机的入侵检测系统（HIDS）和基于主机的入侵防御系统（HIPS），它们通常监控设备（系统调用、文件系统完整性等）以检测恶意软件。\n\
  \n### 4.2 理解网络安全计划的真实成本和影响\n\n然而，如前所述，一个优秀的防御者不仅需要了解网络攻击技术和技术的最新水平，还必须意识到特定攻击对其旨在保护的环境可能产生何种影响。\n\
  \n麦肯锡公司（McKinsey & Company）的一篇有趣的文章指出：\n\n公司正在使用各种复杂的的技术和手段来保护关键业务资产。无疑可以肯定，在任何网络安全背景下，最重要的因素是信任。信任应该凌驾于执行管理人员对工具、人才和流程做出的所有决策之上。然而，许多组织的网络安全倡议往往缺乏信任。高级业务领导者和董事会仅在发生入侵时（例如）才将网络安全视为首要任务，而首席安全官及其团队将安全视为日常重中之重，因为即使是最常规的网站交易也存在可能被利用的漏洞。\n\
  \n一个持续出现的问题是组织感知的安全强度与其实际安全强度之间的差距。这种感知问题之所以出现，是因为企业通常没有建立量化指标来衡量安全准备情况。相反，他们经常使用更多定性的、轶事性的经验来确定安全成熟度。企业常犯的一个错误是将数据安全准备情况和成熟度视为可以通过列出\
  \ IT 部门部署的防御层来衡量的东西（两个防火墙比一个防火墙好）。通过这种视角看网络安全，意味着企业无法区分自我感知与现实。强有力安全态势的关键要素之一是组织在威胁发生之前预测它们的能力。\n\
  \n感知变成事实，信任进一步侵蚀，网络安全计划的最终成功率往往低于预期水平。例如，如果泄露事件发生较，业务领导者可能会冻结网络安全预算，直到 `CIO` 或其他网络安全负责人证明进一步投资控制措施的必要性——这可能会使自己暴露在攻击风险之中。\n\
  \n相反，如果威胁被频繁记录，业务领导者可能会反射性地决定在新技术上过度支出，而不理解存在其他其他非技术的补救措施来确保数据和其他公司资产的安全。\n\n由于上述提及的感知安全问题，网络安全领域充满了随着时间推移产生的错误误区，且非常难以被反驳。文章见于：\n\
  \n*   **误区 1—组织中的所有资产必须以相同的方式保护。** 显然这是一个误区，因为并不是所有数据的价值都是相等的。公司没有无尽的资源来以任何代价保护所有数据。强大的网络安全策略通过利用分级的安全措施，对公司最重要的资产提供差异化保护。例如，对于一家公司来说，对所有保存的数据进行全面的勒索软件保护是否方便？公司可能必须选择更方便的数据资产进行保护。\n\
  \n*   **误区 2—我们投入得越多，我们就越安全。** 根据：\n\n*   **误区 3—外部黑客是公司资产的唯一威胁。** 外部黑客攻击的危险确实很高，特别是对于持有重要专利或敏感数据的公司来说，但公司内部也存在重大威胁。离数据或其他公司资产最近的人员往往会成为公司的薄弱环节（例如，当他们在未受保护的网络上共享密码或文件、点击从未知邮箱地址发送的恶意链接，或以其他方式使公司网络暴露于攻击之下）。事实上，公司内部的威胁占了数据泄露的约\
  \ 43%。\n\n*   **误区 4—我们的技术越先进，我们就越安全。** 虽然网络安全团队经常使用强大、尖端的技术来保护数据和其他公司资产，这是事实。但如此，许多威胁可以使用不那么先进的方法缓解。毕竟，大多数公司面对的并不是军事级的黑客。全球超过\
  \ 70% 的网络攻击来自受财务驱动的犯罪分子，他们使用技术上很简单的策略，例如钓鱼邮件。\n\n我们认为这最后一个误区特别有趣。事实上，`Verizon` 关于\
  \ 2019 年数据泄露的报告显示：\n\n但这种现象不仅涉及网络安全链中终端用户的弱点，还涉及到顶级社交网络安全基础设施管理中存在不容忽视的弱点。\n\n事实上，上述报告显示了不同行业类别更常见的攻击模式类型，以及威胁行动类别和受影响资产的分类。我们想强调的是，从绝对术语来说，事件和泄露特别击中了服务器资产，而这些资产无疑由专业的\
  \ IT 人员控制。因此，防御者的弱点并不总是依赖于最终用户。\n\n### 5 安全框架的视角\n\n到目前，我们从攻击者和防御者的角度分析了网络威胁。现在，让我们看看防御者有什么工具来解决明显复杂的问题。复杂问题必须以方法论的方式处理，以便利用可用资源，为受保护的信息或实体获得适当的保护水平。\n\
  \n在科学或技术的其它领域一样，处理信息安全的方法论已经在国际范围内开发，并以框架、平台或最佳实践的形式组织起来。稍后，我们将说明一些广为人知的框架，并展示它们尽管假设不同但有许多共同点。\n\
  \n我们从“改进关键基础设施网络安全框架”（Framework for Critical Infrastructure Cybersecurity）开始。\n\n\
  该框架是一种基于风险的网络安全管理方法，由四部分组成：引言、基础、如何使用和网络安全自评估。基础包括核心、实施层和配置文件。\n\n核心部分列出了五个并发且持续的功能：识别、保护、检测、响应和恢复。这些高级活动被分为类别和子类别，以引用简单且定义的活动。单个活动还关联到信息性参考，即其他标准或最佳实践，提供了实施方面的细节。\n\
  \n框架实施层提供了组织如何考虑网络安全风险以及管理该风险的流程的背景。从部分（`Tier 1`）到自适应（`Tier 4`），实施层描述了网络安全风险管理实践在严谨性和复杂程度上的不断增加。每个组织都应该根据风险、资源、外部限制或义务等来决定自己的层级。\n\
  \n配置文件是功能、类别和子类别与业务需求、风险承受能力以及组织资源的对齐。实际配置文件和目标配置文件的描述可能有助于制定路线图。\n\n层级和配置文件的决策过程应该涉及组织中三个不同层面的人员：执行层、业务/流程层以及实施/运营层（图\
  \ 1）。\n\n\n\n\n\n![图 1 根据 NIST 提升关键基础设施网络安全框架进行的风险管理实施。](img/f11-01-9780128214428.jpg)\n\
  \n图 1 根据 NIST 提升关键基础设施网络安全框架进行的风险管理实施。\n\n该框架是解决 IT 安全问题的指南，但需要在人员、经济和技术资源方面投入大量精力，这些投入会随着安全需求的增加而增长。\n\
  \n* 网络和信息系统 (`NIS`)\n* 支付卡行业数据安全标准 (`PCI DSS`)\n* COBIT5\n* ISO/IEC 27001\n* 恶意软件信息共享平台\
  \ (`MISP`)\n\n实施需要大量的资源，但正确且广泛的使用可以带来不可忽视的优势。该项目由欧洲共同体共同资助。显然，这是一个涵盖与 IT 安全相关的一小部分需求的工具，特别是与\
  \ `SOCs` 和 `CERTs` 的运行相关的（`NIST Framework` 的实施/运行层面），而不是整体的信息安全管理。\n\n* MITRE ATT&CK\n\
  \n即使对于 `MITRE ATT&CK`，其案例历史也是复杂的，需要大量的精力进行持续更新。此外，在这种情况下，其视角也处于技术/操作层面，并假设存在一个组织和技术结构，能够优化资源配置、修改流程并实施防御措施。\n\
  \n### 各种框架中常见的共同点：\n\n1. 它们包含的元素——特别是在低层面——是通用的，事实上，各种框架之间存在映射矩阵。\n2. 高层框架提供了一个良好的起点视角，但距离在实际案例中获得真实安全的终极目标仍然很遥远。因此，它们经常引用其他较低层级的标准/框架。\n\
  3. 低层框架对于如何解决真实的网络安全问题（低层面）提供了良好的指示，但它们面临成为一份没有整体愿景的长任务列表的风险，即缺乏大局观。在这种情况下，已经在某处提出了迈一步的建议。\n\
  4. 完整的框架（例如 `NIST`），即多个框架的协同组合，需要大量的组织资源、配备专门的多级结构，并需要技术手段来涵盖大量的系列攻击（例如各种框架的矩阵）。\n\
  \n## 6: 我们在路上遗掉了什么吗？\n\n上述描述的场景（考虑到三个不同的视角）可能会导致不同的思考。首先，没有简单的、预封装的解决方案。预算、精明和技术是不够的。问题的复杂性、普遍性和跨越性需要一种严肃且自觉的方法，一种与目标和资源相匹配的组织结构，能够应对针对众多目标的海量攻击。\n\
  \n特别针对组织方面，似乎与人类一样，“我可以改变”的格言在这里同样是虚假的，或者至少是很难实现的。\n\n如果不这样解释，就无法说明为什么 38% 的《财富\
  \ 500 强》企业没有 `CISO`，而其中只有 16% 的企业有其他高管担任网络安全负责人。\n\n根据 `Cybersecurity Workforce\
  \ Study 2019`，`CISOs` 的短缺只是冰山一角。\n\n此外还有来自 `ESG` 和 `ISSA` 的一项全球性研究。\n\n然而，正式教育的缺乏并没有阻碍新人进入网络安全人才库。事实上，全世界都有一支道德黑客军，他们不会被聘为传统的全职职位。在未来几年里，将会有超过\
  \ 1,000,000 名道德黑客。如果所有这些专业技能也能在“篱笆另一侧”发挥（攻击者和防御者的工作可能非常不同，特别是在扩展环境中），企业应该认真考虑如何招聘和留住人才。\n\
  \n网络安全是一份不计回报的工作。安全专业人士处于保护“数字社会”的前线，但他们很少因为有效防御而受到表扬，而一旦出现问题就总是会被召回。因此，技能差距正在扩大，教育处于滞后状态，社会正以一起又一起的数据泄露为付出代价，正如引言中提到的，安全和保障将不断地崩溃。\n\
  \n计算机科学专业正努力为下一代技术人员提供足够的网络安全课程。在美国排名前 50 的计算机科学专业中，42% 提供三门或更多特定的安全课程，这远比 10 年前的要多。马里兰大学大学特帕克分校提供网络安全专业方向。加州大学伯克利分校也开设过一门“网络战争”课程。东北大学提供了\
  \ 11 门涵盖安全某些方面的课程。\n\n鉴于数据泄露的不断增加，91% 的调查受访者（全部为网络安全专业人士）认为，大多数组织被认为（或感到）对重大网络攻击极度脆弱或某种程度上脆弱，即中断业务流程或导致数据泄露的攻击（`B978012821442800082.xhtml#f015`）。\n\
  \n\n\n\n- 对安全区域的可见性和控制，例如库存漏洞、漏洞、终端安全、特权访问、身份与访问、补丁、应用安全以及用户意识；\n- 一系列安全指标和衡量，例如与任何安全框架对齐的关键性能指标（KPI）、关键风险指标（KRI）以及服务水平协议（SLA）指标；\n\
  - 流程自动化；\n- 统一数据处理（例如实体解析、关联、去重、规范、聚合和清洗）；\n- 数据连接器，用于统一来自各种安全、IT 和业务来源的数据数据；\n\
  - 对资产进行分段、分类且全面的视图（例如：设备、应用程序、漏洞、人员、数据库和权限）。\n\n最后，目前任职网络安全团队的工作人员经常因为缺乏职业发展（死胡同职位）而感到沮丧，因为尽管网络安全新闻层出不穷，网络安全与业务优先事项之间（以及薪资方面）仍然存在巨大差距。\n\
  \n因此，尽管如第 3 节中所示的 Gartner 预测，全球网络安全支出正在稳定增长，但似乎技术人员被完全遗忘了，或者，他们既不被视为成本，也不被视为投资。\n\
  \n本章多次讨论的网络安全专业人才短缺是一个复杂的应对问题，主要因为尚不清楚究竟由谁来承担这种严重技能人才匮乏的责任。\n\n首先，必须明确的是，网络安全的动态性质具有挑战性，而且不同组织（甚至是组织内部不同部门）之间工作角色以及视角的差异也增加了难度（一名高技能伦理黑客的工作可能与网络安全专业人员的工作完全不同）。由于该领域快速变化的性质，职业路径和所需的培训必须定期进行审查和更新。以医学和法律领域为例，这些职业所需的技能一直保持相对一致，而网络安全则不断要求学习全新的概念。正如此，课程可能会很快过时，无法反映任何特定时刻网络安全的现状。例如，人工智能（`AI`）、物联网（`IoT`）和武器化心理学只是网络领域中较新的几个关注重点。\n\
  \n这种困难可能源于许多并行的原因。换句话说，技能短缺的理论基础在于各种学术学科的交汇点，包括劳动经济学、人力资源管理、教育和技能政策。从这些交汇点中，产生了大量导致技能错配的研究，这是一个描述包括短缺在内的多种技能问题的伞状术语。\n\
  \n如前提到的，从教育角度来看（小学和/或中学）可能存在一些问题，但高等教育也是如此，即硕士学位或专业培训及认证，这些因素被识别为帮助专业人士进步的因素。\n\n\
  撇开理论不说，企业策略小组（`ESG`）和信息系统安全协会（`ISSA`**合作于 2016 年启动了一项初步研究项目，目标是收集网络安全专业人员对职业状态的声音和想法，并从最接近问题的人士那里获得态势分析的视角。针对这一目标，`ESG`\
  \ 和 `ISSA` 调查了 437 名信息安全人员（以及 `ISSA` 成员）。受访者代表了各种规模的组织，涵盖来自世界各地的专业人士。\n\n- 网络安全专业人员被道德使命所吸引。当被问为什么成为网络安全专业人员时，27%\
  \ 的人表示这让他们有机会利用技术技能来帮助保护价值巨大的业务和 IT 资产，而 22% 的人声称他们被该职业的道德性吸引。在许多网络安全专业人员看来，他们的工作等同于善与恶之间的战斗。\n\
  \n- 大多数网络安全专业人员起步于 IT。超过四之三（78%）的受访者表示他们的职业始于 IT 的某个地方，然后演变为网络安全。当被要求识别作为 IT 专业人员获得的最有帮助技能（可以应用于网络安全）时，受访者列出了各种属性，如对不同类型技术的经验、IT\
  \ 运营知识和技能，以及网络（技术）知识和技能。虽然这些是首选，但回答会根据经验而异。资深网络安全专业人员强调了与业务合作中中学的教训，而初级网络安全专业人员则强调了技术培训。\n\
  \n- 大多数网络安全专业人员在定义自己的职业路径方面挣扎。近三分之二（65%）的受访者没有明确定义的职业路径，或没有将职业提升到更高水平的计划。这可能是由于网络安全关注领域的多样性、缺乏定义良好的专业职业发展标准和路线图，以及网络安全领域本身的快速变化。业务、IT\
  \ 和网络安全经理、学者和公共政策领导者应该注意到当今的网络安全职业停滞，并开发和推广更正式的网络安全指南和框架，以指导网络安全专业人员在未来的职业发展。\n\n\
  - 网络安全专业人员对技能提升有坚实的想法。当被问及如何提高知识、技能和能力时，网络安全专业人员提到了活动，如参加特定的网络安全培训课程（58%）、参加专业组织（53%）以及接受经验丰富的网络安全人员的现场指导（37%）。回答随资历而异，经验丰富的网络安全经理（如\
  \ `CISOs`、`VPs` 和总监）倾向于专业组织，而网络安全员工则更青睐在职指导。\n\n- 网络安全认证参差不齐。超过一半（56%）的受访者获得过 `CISSP`，并认为它是获得工作和获取有用网络安全知识的有价值的认证。然而，除了\
  \ `CISSP` 认证外，网络安全专业人员对其他类型的行业认证似乎并不热情。根据这些数据，似乎应该鼓励针对特定角色和职责的安全认证，但将其作为网络安全专业人员整体职业和技能发展的一部分来重视。\n\
  \n- 网络安全专业人员对他们的工作相对满意。虽然 41% 的受访者声称对他们的工作非常满意，44% 仅部分满意，15% 不满意或完全不满意。网络安全专业人员提到了财务补偿（32%）、包含网络安全的组织文化（24%）、业务管理层对网络安全的承诺（23%）以及与高技能多才的网络安全团队合作（22%）等因素。\n\
  \n\n\n\n-   缺乏持续的网络安全培训。当被问及目前的雇主是否为网络安全团队提供相应水平的培训以应对业务和 IT 风险时，超过一半（56%）的受访者回答了“否”，这表明他们的组织需要为网络安全人员提供更多或大幅增加培训。不为网络安全人员提供持续培训的组织将进一步落后于对手，同时增加业务和\
  \ IT 风险。对于所有业务和技术经理来说，这应该是一个不可接受的状况。\n\n-   许多首席信息安全官（CISO）在董事会没有获得足够的面对面。虽然行业内声称“网络安全是董事会的问题”，但\
  \ 44% 的受访者认为，目前 CISO 与执行管理层的参与程度尚未达到适当水平，未来应在某种程度上或大幅增加。这种观点在经验更丰富的网络安全经理（他们本应与业务合作）中比在网络安全人员中更为常见。\n\
  \n-   内部关系需要改进。虽然许多组织认为网络安全、业务和 IT 团队之间的关系良好，但令人担忧的是，20% 的网络安全人士表示网络安全与 IT 之间的关系一般或较差，27%\
  \ 的受访者声称网络安全与业务之间的关系一般或较差。选出的最大的网络安全/IT 关系问题涉及两组之间的任务优先级，而最大的网络安全/业务关系挑战是目标对齐。报告数据显示，网络安全和\
  \ IT 团队正在采取措施改善协作，但也揭示了需要更多工作来弥补网络安全与业务管理之间的差距。\n\n-   CISO 的流失具有业务和经济根。当被问及为什么\
  \ CISO 倾向于在几年后寻找新工作时，网络安全人士回答说，当组织缺乏严肃的网络安全文化时（31%），CISO 倾向于离开；当 CISO 不是高层的积极参与者时（30%），以及当\
  \ CISO 在其他地方获得更高薪时（27%）。为了留住优秀的 CISO，组织不仅必须提供竞争性的薪酬，还必须对网络安全高管做出严肃承诺并提供全面的计划。\n\n\
  如今的网络安全人士处于永恒战斗的前线，任务是利用有限的资源保护组织免受从令人尴尬的网站篡改到体面的勒索软件勒索，再到毁灭性数据泄露的一切攻击。令人震惊的是，网络安全人士往往在知道自己战斗人手不足的情况下仍接受这一挑战。\n\
  \n在另一边，网络对手继续开发创新的攻击策略、技术和程序。也许，这才是攻击者变得越来越强的真正原因。\n\n大小组织必须识别风险和优先级，并投资于网络安全防御和监督。识别风险和优先级还意味着考虑出现问题时可能产生的外部性。正如前提提到的，安全专业人员错误造成的副作用可能比终端用户造成的错误大几个数量级。\n\
  \n## 7: 结论\n\n因此，可以假设如“终端用户是安全链中的薄弱环节”或“攻击者正在变得越来越强”等范式不再适用于证明当前的 IOC（入侵检测/指标）。\n\
  \n同样可能是，旨在“通过负向引导引导终端用户行为”的日益广泛的计划不会产生任何显著结果，仅因为其产生的外部性无论多重要，将是微道的。\n\n此外，似乎（略带强制性得出结论），自“布谷鸟之蛋”以来没有任何进展，这再次证实了“我可以改变”这一格言是错误的。\n\
  \n尽管过去 30 年在网络安全方面投入的资金或获得的科学结果不可否认，但近期的编年史似乎表明，攻击者与防御者之间的无尽战斗某种是不公平的，或者说，网络安全的投入似乎并没有随着对未来结果信心的增加（获得收益）而同步。\n\
  \n此外，网络安全框架是否真的被用来降低风险和漏洞并增加在日益连接的世界中的信心，还是说它们只是一个可以证明可能发生的数据泄露的机会（借口，即“基于清单的安全”）？\n\
  \n正如前面提到的，我们深信一个或多个关键因素没有被适当考虑或被完全遗忘，其中无疑人为因素。\n\n## 参考文献\n\n## 12: 社交媒体、营销数字化和人工智能对品牌知名度的影响\n\
  \nDaniel Hagan; Hamid Jahankhani; Lea Broc; Arshad Jamal ^()英国伦敦诺桑布利亚大学\n\n## 摘要\n\
  \n本章的目的是探索数字化和人工智能（AI）在社交媒体以及辅助品牌知名度营销中的作用——这是一种向客户创建、沟通和交付价值建议的方法。它提出消费者已准备好开启一段新的旅程，其中\
  \ AI 是提供无限选择的工具，并以个性化的方式对信息进行筛选和策划。它为经理就当今全球化世界中 AI 驱动的品牌建设和客户管理实践提供了见解。\n\n###\
  \ 关键词\n\n社交媒体；人工智能（AI）；影响者营销；Instagram；品牌知名度\n\n## 1: 引言\n\n数字革命改变了营销领域。世界见证了新的新兴数字技术，这些技术在过去转型了组织的每个部分，并破坏了传统的非人格化营销传播策略。数字技术不仅影响了主要的业务领域，如产品开发、盈利、品牌管理、客户关系管理、购买、销售以及数字技术的通信和应用（\n\
  \n由于设备、设备和营销活动的主要发展，数字技术对营销和业务通信过程产生了最实质的影响（\n\n数字技术以其独特的能力（包括交互性、可衡量性、客户参与、定制化、可访问性和管理大型信息源）重新定义了通信术语（\n\
  \n全球范围的公司正在增加数字化支出（\n\n在如今的数字环境中，技术创新对营销改进的效率有影响，并影响消费者行为的变化（\n\n\n\n\n\n## 2: 社交媒体\n\
  \n随着全球互联网的普及，社交媒体已成为大多数人的日常活动。社交媒体的独特特性和广泛使用使营销工具从传统转变为在线，特别是在互动和推广方面，例如 `Facebook`、`Instagram`、`Twitter`、`Blog`\
  \ 和 `Line`，因为社交媒体允许企业与任何地方的客户无需面对面即可实现更高速度的连接和互通。\n\n同样，社交媒体网站是在线组织者，允许网站成员建立和维护个人资料，识别他们建立联系的人，并通过消费、生产以及与与其联系的人创建的内容来参与其中。\n\
  \n社交媒体通常可以将创建内容（即用户生成内容， UGC）的用户分类为以下几类：\n\n-   **博客 (Blogs)**：博客被视为一种内容管理系统的形式，允许用户快速编写帖子并发布文章。在创建博客的博客中，它为热衷于通过随笔写作分享想法、知识和经验的人们提供了机会。因此，现在社交媒体平台上的博主日益增加，这有利于在线社区通过博主的叙述来接收内容。此外，利益相关者可以通过此渠道作为评论进行讨论或分享想法。\n\
  -   **Twitter 和微博客帖子 (Twitter and microblog posts)**：Twitter 和微博客帖子是将每次帖子大小限制在 140\
  \ 个字符的博客。最初，Twitter 设计师希望用户编写关于“你现在做什么”的故事。然而，公司将其视为建立品牌意识的机会，通过创建预期报告内容的内容，并将其作为营销工具来增加销量。此外，它还用于推广迅速变得流行的文章。\n\
  -   **社交网络 (Social networking)**：社交网络是一个连接朋友的网络，正成为一个在线社会，营销人员利用社交网络与客户互动。此外，如果消费者喜欢具有相同主题的产品或服务，他们可以创建并加入小组。尽管如此，社交网络的主要特征是朋友或家人的人脉网络，例如\
  \ `Facebook`，而商务网络则使用 `LinkedIn`。\n-   **媒体共享 (Media sharing)**：媒体共享是一个允许我们向公众上传图片或视频内容的网站。出于此原因，营销人员可以使用特定的电子设备传达创意想法，并将其上传到如\
  \ `YouTube` 等网站，其目标群体可以与社会共享。\n-   **社交新闻 (Social news)**：社交新闻是一个链接互联网文章和内容的互联网网站，允许发送者作为公众进行投票，并帮助过滤出哪些文章和内容最有趣。\n\
  -   **在线论坛 (Online forums)**：在线论坛是人们讨论感兴趣的话题、交换想法以及介绍各种产品或服务的方式。营销人员应该关注这些论坛中讨论的内容，因为这些可能是关于产品服务的评论，可以借此理解产品并与客户建立良好关系。\n\
  \n社交媒体是业务营销的新渠道，因为与 `TV` 或杂志等传统广告相比，它以更低的成本接触企业的目标群体。同样，社交媒体营销利用社交媒体技术、网络和软件来生成、互动、提供和交换对组织内利益相关者有价值的服务。\n\
  \n此外，他们使用连接互联网到各种应用程序的智能手机（包括 `Instagram`、`Facebook` 和 `Line`）以及其品牌网站，这些功能对于互联网来说方便、快速且负担得起。它也是一种通信渠道，可以联系目标群体并立即接收反馈，而无需通过中间环节。社交媒体是双向通信平台，允许用户在线上相互互动以分享信息和观点。这促进了品牌与客户之间的互联网交流，例如发布产品照片或通过代言穿着品牌衣服的明星来开发新趋势并刺激客户意识，从而引导产生购买意向。此外，通过社交媒体渠道进行产品查询和促销对决定中的客户来说是非常舒适的。\n\
  \n同样，在数字时代，在线业务变得越来越流行，因为它降低了成本并增加了客户服务和客户满意度，例如酒店预订、票务购买、商品和服务支付以及食物外卖。因此，产品和服务的分销不断增加了在线业务。目前，在线业务在数字世界中增长，在全球范围内迅速扩张。此外，电子商务已经整合了多种社交平台（如\
  \ `Instagram` 和 `Facebook`），用于推广通过社交媒体购物的消费者可以触及的产品。\n\n例如，社交媒体营销工具 `Instagram`\
  \ 是一款免费的移动应用程序，允许用户分享照片和视频。在过去的几年中，它迅速成为一种视觉媒介，因为它为用户提供了一种通过处理滤镜和视频与朋友分享生活的快速方式。\n\
  \n越来越多的小型企业使用 `Instagram` 通过上传图像和为其客户群编写描述来建立品牌意识，让粉丝者快速识别产品的外观和描述，并创造出不同的想象。由于\
  \ `Instagram` 界面简单，100 个品牌更倾向于使用视觉作品集和品牌意识策略，而不是投放他们的广告和促销活动。\n\n因此，企业家应该不断更新。这改进了客户的感知，并且可能对他们关注的内容感兴趣，无论他们使用博主还是名人来推广产品，通过展示产品图片并编写确定的描述让粉丝意识到他们的渴望和购买意向。\n\
  \n传统上，对消费者行为的解释植根于认知心理学，这种理论解释了消费者的决策转化为行动。今天的广告世界随着媒体技术的力量迅速进化。然而，我们尚不知道 `Instagram`\
  \ 在告知和说服消费者在线购买产品有多有效。\n\n## 3: 广告与效应层次 (Advertising and the hierarchy of effects)\n\
  \n在这个后现代世界中，人们交流的方式通过技术得到了发展。营销人员描述了从产品导向向以消费者为导向营销的范式转变，这种营销演变为理解与客户建立持久的关系。\n\n\
  然而，今天，`AI`、大数据和广告追踪允许营销人员通过从过去的客户行为中学习来更有效地识别和定位，从而吸引并引导新客户。这一切都是通过创建算法实现的，跟踪和预测允许营销人员进行行为修正。有效来说，今天我们被视为电子表格中的数据集，组织通过其使用的模型利用这种海量汇总数据集来定位客户。所有这些算法都使用人工智能进行跟踪和预测。对消费者行为的预测基于数据经纪人拥有的该人的信息——`信用评分`预测`某人违约贷款的可能性`；`营销评分`预测`某人购买特定产品的可能性`；`欺诈评分`预测`特定交易可能是欺诈的可能性`；`压力评分`可能帮助组织客户管理医疗成本和风险`。\n\
  \n\n\n\nDAGMAR 模型因其设定了以通信为导向的目标而被接受（\n\n## 4: 客户与智能零售互动\n\n在互联网十年中，零售和通信技术创新了购买方式，使消费者变得依赖技术。由于数字渠道（特别是移动设备和社交媒体）中新技术的开发和采用，零售业发生了发生变化，这对客户产生了深远影响，并改变了购物行为视角以及企业的业务模式。\n\
  \n智能零售通过决策过程的阶段（搜索、购买、消费和售后购买）改变了消费者行为，并向业务增长的创新方法转变。在智能零售的概念之外，现代技术应用中还存在着高水平的“智能性”，这与技术的部署有关。\n\
  \n智能零售的感知反映了公司和消费者对技术的使用。这将通过增强客户购物体验的质量，在经济中创造并强化一种新角色。与传统零售相比，智能零售既带来了灵活性也带来了挑战，因为消费者行为随着技术变化而演变，未来零售消费者的界面可能与目前的互动完全不同。\n\
  \n智能技术惠及了客户和企业，从而可能提高客户满意度和企业盈利能力。全球智能手机用户从 2014 年的 15.7 亿增加到 2020 年的 28.7 亿，这将为公司投资智能技术进一步创造机会。移动端应用程序、自助结算和扫描即取技术对消费者行为产生了影响。然而，智能手机的发展彻底改变了我们的购买方式，从移动应用程序到具有共同的地理区域，建立了与在线环境的持续连接，改变了消费者的预期以及企业与消费者连接的能力。\n\
  \n### 4.1: 在线活动与购物行为\n\n在在线活动方面，更多客户每天使用 Facebook、YouTube 和 Instagram 访问社交媒体平台，并倾向于通过自己的智能手机进行在线浏览。然而，还有其他客户正在使用的社交媒体平台，例如\
  \ Snapchat、LinkedIn 和各种博客。跨社交媒体平台最受欢迎的发布内容是生活方式帖子、美容和个人护理以及时尚产品。社交媒体被用于推广内容，采用推广文章、产品试用和演示视频。同样，YouTube\
  \ 内容包括受欢的视频产品、演示视频和 vlogs。年轻消费者经常在社交媒体上搜索产品或品牌的深度信息，并最可能推荐他们用过或通过广告看到的产品或品牌。\n\n\
  年轻一代热衷于在线购物，因为这节省了从事其他活动的时间。然而，按周计算，邻里商店和超市是购买必需品的首选地点，当他们需要不同的商品时，去当地最近的商店快速购物购更为合理。此外，从典型的电子商务网站中，年轻消费者购买衣服、IT&C\
  \ 产品和书籍；从国外网站，女性购买服装和美容护理产品。年轻一代在选择在线零售商时，首要条件是价格，其次是交货条款。在支付方式方面，男性选择通过网站进行在线支付，而女性倾向于货到付款，无论是现金还是刷卡。\n\
  \n## 5: 社交媒体网红分类\n\n“影响者”（influencer）一词已成为一个广泛的话题，关键在于对于品牌来说，考虑一刀切的方法是天真的（\n\n此外，\n\
  \n## 6: Instagram 作为最有效的平台/受众\n\n根据\n\n接受采访的社交媒体高管表示：“我们大多数时候与其他粉丝量更高的服装品牌、美容品牌合作。因此，这作为一种合作之上的合作，产生了双倍曝光，触达未来的消费者。”\n\
  \n在最近的研究中，\n\nInstagram 用户像任何社交媒体漏斗一样，倾向于根据自己的兴趣聚集在一起。消费者关注他们理想的时尚影响者，这些人不仅广告衣物，还广告如何在特定环境中进行搭配（\n\
  \n## 7: 品牌建设\n\n过去三十年的特点是全球竞争日益激烈，因此公司特别是营销人员正在寻找机会来加强其竞争地位。品牌建设作为这些机会之一，有助于获得竞争优势，因此具有巨大的意义（\n\
  \n品牌是“名称、术语、标志、符号或它们的组合，旨在鼓励潜在客户将生产者的产品与竞争对手的产品区分开”（\n\n品牌的功能不仅可以从外部（即客户）的角度来看，还可以从内部（员工和公司）的角度来看。品牌的内部功能涉及传递企业意义、内部身份和符号资源；使专业与身份相关的工作成为；并为员工提供指导（\n\
  \n### 7.1: 品牌识别与形象\n\n根据\n\n选择特定的影响者进行合作将从其形象中受益，反过来又提升品牌形象和认同。此外，上传到 Instagram\
  \ 的内容反映了品牌在风格和人口统计方面的声誉；Esch 的研究强化了这一观点，他认为“积极的品牌形象可以提高品牌忠诚度、正面口碑和购买意愿”（\n\n###\
  \ 7.2: 质量与一致性\n\n采访结果显示，Instagram 是一个持续增长的平台，正如受访者所述，“从一月开始，我的增长平均每月增加 8k”。这表明活跃用户仍在关注和崇拜影响者。当被问及采访者具有影响力地位的原因时，回答是“主要是我的帖子非常一致，我确保它们是高质量图像”。多项研究发现，65%\
  \ 到 85% 的人描述自己为视觉学习者，这导致营销人员通过不断在社交媒体上充斥图像向受众传达特定信息，来实现这一点最大化（\n\n根据\n\nHarmer 的论得出得出，图像必须质量良好才能促使游客购买产品、鼓励社交分享，从而增加认知。因此，如果缺乏互动，低质量图像将无法实现覆盖最大化。受访者提到，“持续发布”对于影响力的成功是必要的。\n\
  \n## 8: 人工智能与品牌意识\n\n数字革命改变了营销传播，例如智能手机、互联网和个人电脑（`PCs`）。这些进步提高了组织在识别客户需求、交付价值提供以及使用正确工具进行定位方面的知识潜力。此外，知识型环境中的组织创建、传播和使用知识作为竞争优势的关键来源。人工智能（`AI`）正在改变组织向客户交付价值的方式。通常，`AI`\
  \ 指计算机如何使用软件和算法像人类一样思考和执行任务。通过个性化，`AI` 积极改变了人类日常生活的几乎每一个方面。\n\n根据\n\n\n\n\n从营销角度来看，个性化（personalisation）通常与定制化（customisation）一起呈现和研究，因为它们在概念上相关，但在应用上有所不同。个性化发生在公司决定（通常基于之前收集的客户数据）什么样的营销组合最适合个人时；而定制化则发生在客户主动指定其营销组合中的一个或多个元素时。\n\
  \n个性化作为一种过程连接了客户与营销人员，并巩固了他们之间的关系。\n\nAI 高度的个性化是其流行的主要因素。AI 已将范式从基于规则的专家系统方法转向了基于深度学习、数据驱动的方法。\n\
  \n数字策展（Digital curation）被定义为“对数字材料的管理和保护，以确保长期可访问性”。\n\n在营销语境下，策展是指通过机器驱动自动选择产品、价格、网站内容和广告信息，以符合个人客户的偏好。在这种情况下，AI\
  \ 使用公司与客户之间的交易数据、客户对产品的消费模式以及关于公司向客户提供产品的沟通模式，自动预测偏好产品的类型、时机和购买行为。此外，AI 还可以定制公司的网站内容以匹配客户偏好（例如\
  \ `Wix` 和 `The Grid`），调整价格以符合客户的支付意愿（酒店房间定价的 `pace` 和动态定价的 `perfect price`），并无缝且个性化的方式连接所有渠道和设备的客户互动（`Adobe\
  \ Sensei` 和 `Samsung SmartThings` 生态）。AI 工具还从客户互动中学习，以提高对客户偏好的预测准确性，从而在客户关系生命周期内增加公司向客户提供的价值。\n\
  \n在 AI 内部，机器学习算法（如协同过滤、深度学习、无监督聚类和 `k-nearest neighbours`）已成为开发应用程序的首选方法，这些应用通过根据评价、先前的产品购买和产品使用情况来理解消费者偏好，以寻找消费者更可能喜欢的新产品或服务。\n\
  \n## 9: 客户信息处理\n\n在互联网出现之前，消费者的信息处理经历了三个不同的阶段；策展式推荐已通过电视、广播和印刷媒体作为可能的购买途径存在。通过这些技术，买家可以依靠他们喜欢并信任的明星或影响者的推荐、品牌活动，或是他们的亲友。随着互联网的出现，产品配置器或搜索引擎应用固定的\
  \ `if-then` 规则针对一组预设标准进行筛选，以缩小产品选择范围。信息的泛滥以及消费者在处理来自配置器或搜索引擎的所有数据时产生的挫败感，在学术文献中被反映为“选择悖论”和“数字认知负荷”。\n\
  \n### 9.1: 消费者选择与决策\n\n几乎所有的营销活动都针对消费者面临的选择，这种选择由两个或多个替代方案、替代方案之间的冲突以及一种缓解冲突的思维驱动方法组成。\n\
  \n## 10: 结论\n\n本文是理解 AI 对组织品牌形象影响的一种方式。具体而言，它探索了 AI 在创建个性化参与营销方法方面的作用。公司可以利用个人客户信息和\
  \ AI 技术来提供策展化的产品和服务。AI 技术可以促进实时学习，并帮助经理随着时间的推移改进客户价值主张。这种为客户提供增加价值的策展产品策略将成为客户留存和持续竞争优势的基础。作为一个开始，我们在这里展示了关于\
  \ AI 如何影响客户管理策略的若干预测。在此过程中，我们还展示了发达和发展中经济体的经验以及可能变化的未来。当然，这仅仅是理解 AI 在营销中更广泛影响的早期尝试。我们预计未来会有更多此类努力来让我们做好准备。\n\
  \n## 参考文献\n\n## 13: 英国音乐公关机构关于客户获取方法和客户搜索行为的营销现状\n\nKarsyn Robb^([a]), Lillian Clark^([b])\n\
  ^a 英国纽卡斯尔的纽卡布里尔大学\n^b 英国伦敦 QA 高教育\n\n## 摘要\n\n本研究的目的是确定音乐家如何搜索音乐公关服务，以及这种搜索行为是否与音乐公关机构用于获取客户的营销方法一致。该研究通过对音乐家和音乐公关机构的访谈分析，以及对机构网站\
  \ `SEO` 使用情况的分析。研究表明，虽然许多音乐公关机构认为客户的主要来源是口碑营销，但音乐家在很大程度上依赖在线搜索来研究推荐给他们的公司，并将这些机构与该地区的其他顶尖机构进行比较。基于此，建议音乐公关机构实施当前的数字营销策略，特别是\
  \ `SEO`，以增加对在线搜索的音乐家的可见性和吸引力。\n\n### 关键词\n\n数字营销；`SEO`；娱乐业\n\n## 1: 引言\n\n数字时代给音乐产业带来了巨大的变化。不仅是独立音乐家（即在合同上没有义务受限于唱片公司或机构）在笔记本电脑上可以使用高质量录音软件的情况下不再需要依赖唱片公司录制专辑，这些音乐的营销方式也发生了变化。虽然互联网为音乐家提供了让大量新潜在粉丝听到他们的平台，但也增加了获取这些粉丝的竞争水平。这可能是为什么音乐公关（PR）的角色对于独立音乐家的成功比以往任何时候都重要。由于音乐家的财务成功需要专辑、演唱会票和商品收入，因此需要音乐公关来维护和增加这些收入。音乐公关机构使用的主要营销方法一直是口碑（`WOM`）营销。\n\
  \n如果音乐家寻找合作音乐公关公司的关键方法是通过搜索引擎，那么音乐公关公司必须通过应用搜索引擎优化（`SEO`）来调整目前的营销策略，事实证明有助于公司在在线上与同行竞争竞争。本章将提供利用\
  \ `SEO` 等关键数字方法重要性的证据，通过网站评估和初步研究考察音乐公关机构对其的使用程度，并根据结果建议未来继续使用。\n\n## 2: 文献综述\n\n\
  ### 2.1: 音乐产业\n\n随着技术的进步，音乐产业面临着巨大的变化，例如数字分发对行业经济的影响。\n\n在音乐产业发布产品之前，它必须依靠互联网增加产品周围的“热度”，从而带来更多销售。例如，通过博客文章和社交媒体进行的在线讨论，在唱片发布之前就对应着未来周周销量的增加。\n\
  \n### 2.2: 音乐公关\n\n音乐公关是指为音乐家或唱片公司呈现公众形象，同时识别不同群体的信息需求并阐述组织的目标和任务。\n\n### 2.3: 音乐公关与数字营销\n\
  \n\n\n\n随着互联网的发明，音乐公关（PR）的机会呈爆炸式增长。虽然乐队仍然可以在广播和电视上亮相，但互联网让粉丝能够即时分享内容，从而将乐队介绍给以前难以接触的粉丝。这同样适用于音乐公关的其他方面，例如在音乐类杂志和其他刊物上获得艺人的相关报道。\n\
  \n一家音乐公关公司的成功在很大程度上取决于客户线索的获取。在与由主流唱片公司控制的大型内部公关公司竞争时，根据\n\n### 2.4: 寻寻求行为\n\n`Wilson`\
  \ 引入的信息寻求行为宏观模型有助于理解独立音乐人及其经理的搜索行为。尽管该模型首次发表在……的一篇文章中。\n\n该模型在此处适用的最重要的原因之一是它引用了信息提供者，例如经纪人和非正式系统，这些对于理解音乐人和经理等个体的日常信息寻求行为至关重要。此外，该模型具有特别的相关性，因为它包含了个人和心理因素，这些因素在考虑信息寻求行为时也必须被考虑。个人和心理因素对信息寻求行为的影响这一问题在……之前的研究中也得到了探讨。\n\
  \n与这些研究相比，\n\n### 2.5: 评估 SEO 有效性\n\n……提出的另一个模型。\n\n## 3: 方法论\n\n选择独立音乐人进行研究的关键原因是，签约音乐人拥有唱片公司的支持系统，而这种支持系统通常包括一个内部公关团队。另一方面，独立音乐人是独立工作，并试图自己组建支持团队。因此，本研究的第一步是建立这些音乐人寻找公关公司时所使用的搜索方法。这是通过采访这些音乐人关于他们如何寻找公关服务完成的。随后，将这些采访中收集的数据与采访音乐公关公司收集的数据进行对比。然后分析了现有的音乐公关公司网站，以评估\
  \ `SEO` 的使用情况和用户体验。研究确定并采访了英国的 27 位独立音乐人，其中 10 位流行流派、9 位摇滚、2 位 MOR（成人流行）、2 位 R&B、2\
  \ 位舞曲、1 位古典和 1 位嘻哈。这种分布是基于英国最流行的音乐流派（\n\n除了采访外，还使用 `ScreamingFrog` 和 `WAVE Webaim`\
  \ 工具评估了音乐公关公司的 `SEO` 活动。`ScreamingFrog` 是一种用于检查和衡量网站 `SEO` 状态各个方面的行业工具，而 `WAVE Webaim`\
  \ 通过检查网站的无障碍性，考虑到无障碍性对网站 `SERP` 排名的影响，可以识别潜在的 `SEO` 问题（\n\n研究人员应用 `Wilson` 的信息寻求行为宏观模型概念框架，将从音乐人处收集的信息整理成可比的格式。一旦完成这一步骤，该框架被放入\
  \ `Spais` 对 `Bendy` “活动”`理论` 视角的扩展中。这一步骤利用从音乐公关公司收集的信息，以确定是否已根据与音乐人采访中确定的信息搜索行为应用了有效的营销方法。最后，使用\
  \ `Solihin` 提供的框架对 `SEO` 策略进行了分类。\n\n## 4: 结果与分析\n\n### 4.1: 音乐人采访结果与分析\n\n选择了 27\
  \ 位具有与音乐公关公司合作经验的音乐人，并与他们联系电话采访。采访结束后，研究人员对对话内容进行了转录，然后使用主题分析来识别在整个采访过程中出现的共同主题。\n\
  \n#### 4.1.1: 主题 1：音乐人在音乐行业的经验\n\n确定的第一个主题是音乐行业经验。18 位受访者讨论了在音乐行业专业活跃超过 5 年，而只有\
  \ 9 人在行业中的活跃时间少于此。此外，研究发现大多数艺人（无论其在音乐行业工作的时间长短）通常每隔 3-4 个月发布一次新音乐（通常是单曲）。这些数据在……分享的一篇文章中得到了支持。\n\
  \n这些信息对本研究很重要，因为它们反映了音乐人可能需要音乐公关服务的频率，因此他们将寻找合作的公司。在行业内的持续时间也很重要，以便检查经验更丰富的音乐人寻找音乐公关服务的方式是否与行业新入者不同。\n\
  \n该主题的第三部分部分是了解音乐人过去合作过何种类型的音乐公关公司，以确保他们的经验与本研究调查的音乐公关公司类型一致。所有接受采访的音乐人都有与独立音乐公关公司合作的经验，只有\
  \ 3 人具有通过唱片公司与内部公关公司的额外经验。这意味着所有受采访的音乐人对所研究的主都有相关经验。\n\n#### 4.1.2: 主题 2：使用口碑推荐\n\
  \n确定的下一个主题是使用口碑推荐来定位合作的音乐公关公司。在接受采访的 27 位音乐人中，17 位提到依靠推荐来找到他们最终选择的公司。这支持了……的观点。\n\
  \n当该部分被进一步细分时，发现音乐人用于收集有关应使用的公关公司信息的推荐五个主要来源。\n\n这些来源中最常见的是过去使用过音乐公关公司且体验良好的其他音乐人的推荐。其次，4\
  \ 位受访音乐人用于推荐的第二种常见来源是他们的经理。2 位音乐人提到了律师的推荐，一位讨论了使用唱片公司的建议，一位讨论了在演出中结识音乐公关公司员工并在随后使用了他们的服务。\n\
  \n这种分解反映了独立艺术家依赖行业内的其他艺术家，作为指导其职业生涯信息的可靠来源。\n\n该部分一个值得讨论的分支是，虽然本研究采访的所有音乐人人都收到过想要与其合作的音乐公关公司的联系，但没有音乐人与过任何通过社交媒体或电子邮件联系他们的公关公司。此外，6\
  \ 位音乐人表示他们从不回复这些机构，因为他们更倾向于自己进行研究。这可能反映了音乐人对公关公司直接联系其意图的不信任。\n\n#### 4.1.3: 主题 3：使用在线搜索\n\
  \n虽然本研究采访的大量音乐人报告将口碑作为寻找合作音乐公关公司研究过程的一个步骤，但 27 位采访音乐人中的 24 位讨论了首先使用 Google 来了解他们当地“顶尖”音乐公关公司的情况。“顶尖”一词被强调，是因为本研究发现，各种音乐人提到认为在\
  \ `Google` 上搜索音乐公关公司时看到的领先结果是他们当地的佼者。\n\n这与……的一项研究相一致。\n\n#### 4.1.4: 主题 4：使用的 SEO\
  \ 关键词\n\n\n\n\n\n当进一步询问音乐人关于如何在 Google 上进行搜索时，发现关键搜索短语通常遵循以下格式：(1)‘音乐 PR（音乐人所在地）’、(2)‘音乐\
  \ PR 服务’、(3)‘音乐 PR（音乐流派）’、(4)‘独立音乐 PR 公司’以及(5)‘最佳音乐 PR’。这些搜索格式对于音乐公关机构理解至关重要，以便在网上更好地定位这些音乐人。\n\
  \n### 4.1.5 主题 5：选择的影响因素\n\n识别出的下一个主题是影响音乐人选择哪家音乐公关公司的因素列表。\n\n超过一半的受访音乐人表示，机构内工作人员是否友好以及对艺术人的音乐有真心的兴趣非常重要。此外，音乐人非常看重音乐公关公司过去为艺术家获得推广的案例，以及他们过去合作的对象。该群体中第三常见的子话题是，看到该机构之前合作过的艺术家所提供的推荐，鼓励其他艺术家也与他们合作。\n\
  \n音乐人经常提到的最后两个因素是：音乐人在决定使用其服务之前，能够与机构安排初次见面进行交流的能力，以及机构为音乐人提供公平的价格。这些价值对于音乐公关机构来说也非常重要，因为这些都是公关机构可以在其网站上提供的信息。\n\
  \n这些数据支持了\n\n### 4.1.6 信息寻求行为\n\n应用\n\n根据这项研究的结果，发现虽然音乐人依靠其他音乐人或经理的口口推荐来获取关于与哪家音乐公关公司合作的建议非常常见，但音乐人搜索活跃的部分是通过\
  \ Google 以及比较不同音乐公关机构网站上的信息。这项研究表明，无论机构是否通过口口推荐，音乐人都会通过 Google 搜索进行在线研究。虽然经验丰富的音乐人倾向于比新手更看重其他音乐人的推荐，但两组人都均通过\
  \ Google 搜索进行了大量的音乐公关机构搜索。\n\n### 4.2 音乐公关机构访谈结果与分析\n\n采用与音乐人访谈时相同的评估方法，在对音乐公关机构的访谈中也识别出了几个共同主题。同样，识别出的第一个主题是音乐公关方面的经验。\n\
  \n### 4.2.1 主题 1：音乐公关经验\n\n平均而言，本研究中受访的代表拥有 6 年经验，经验最多的为 9 年，最少的为 10 个月。这种音乐公关领域的经验范围值得注意，因为正如结果所示，所使用的营销方法似乎并没有受到领域经验的影响。\n\
  \n### 4.2.2 主题 2：客户类型\n\n识别出的第二个主题是音乐公关机构通常选择的音乐人类型。虽然所有代表都表示客户的年龄各异，但通常他们合作的音乐人处于\
  \ 20 到 30 岁之间。虽然大多数机构提到与摇滚流派的艺术家合作，但每家机构通常与来自三四个不同流派的音乐人合作。发现每家音乐公关机构平均上与各种水平的艺术家合作，范围从超级明星到发布首支单曲的艺术家。\n\
  \n这第二个主题反映了音乐公关机构倾向于不对其合作的客户类型进行专门。相反，大多数机构似乎与处于职业生涯任何阶段的艺术家合作，无论年龄和流派如何。基于文章\n\n\
  然而，在与音乐公关机构的访谈中，经常提到这些公司认为，即使流派不是他们的个人喜好，与他们所认可的音乐人的音乐合作也是重要的。这种非专业化意味着这些音乐公关机构并不是针对某一类音乐人进行营销，而是针对所有音乐人。艺术家在寻找音乐公关公司时的价值取向与音乐公关公司接受的工作类型之间的差异，反映了音乐公关公司自我营销方式存在的问题。\n\
  \n### 4.2.3 主题 3：客户发现或寻找客户\n\n识别出的第三个主题是机构寻找新客户的搜索行为。讨论的 10 家机构中有 5 家讨论了每周（在一种情况下是每天）搜索新客户。据报道，这些搜索主要通过社交媒体、SoundCloud\
  \ 或 Spotify 播放列表进行。一旦发现希望与其合作的艺术家，就会通过列出的电子邮件、电话号码或 Facebook、Instagram 等社交平台上的信息直接与其联系。\n\
  \n这也支持了音乐人提供的答案。虽然大多数音乐人是以这种方式被联系的，但他们并不想要这种形式的联系，并且可能将业务交给以这种方式联系他们的公司。这也反映了音乐公关营销策略中的一个错误，因为没有以正确的方式接触音乐人。\n\
  \n其他五家机构表示，由于有大量音乐人联系他们，他们不进行任何形式的新客户搜索。然而，每家受访机构都强调了这一点：无论他们是否寻找新客户，客户发现机构的可能性都大于机构发现他们。\n\
  \n### 4.2.4 主题 4：机构被发现的方法\n\n这引出了识别出的下一个主题：音乐公关机构报告的被发现的方法。\n\n受访的六家机构报告经常通过口口推荐被发现，一家表示大型唱片公司偶尔会将艺术家推荐给他们，八家机构报告通过其网站或社交账户在网上被发现。\n\
  \n虽然有些机构报告口口推荐和网站同时作为客户线索来源，但这种重叠反映了在音乐人访谈中发现的主题。即使是通过其他音乐人的口口推荐发现公关机构的音乐人，仍然可能在网上研究并最终通过网站表单或电子邮件与他们联系。\n\
  \n再次，这反映了音乐人访谈中发现的主题。虽然音乐人依靠口口推荐，但他们最活跃的部分是通过 Google 以及比较不同音乐公关机构网站的信息。这就是为什么音乐公关公司报告通过在线表单联系最多。\n\
  \n### 4.2.5 主题 5：数字营销的使用\n\n在数字营销方面，受访机构中仅有四家报告使用了任何形式的数字营销。在这四家机构中，最常用的工具是社交媒体，用于发布机构正在进行的项目并分享常规更新。然而，即使在使用社交媒体的公司中，也有三家讨论了机构没有按其应地使用社交媒体和数字营销的问题。\n\
  \n对于其他未报告使用任何数字营销的受访机构，一半表示不使用的原因是由于大量客户找到他们，而他们并未使用数字营销。另一半不使用数字营销的受访机构表示，他们想使用并知道这对他们的业务很重要；但是，机构缺乏投入其中的时间。\n\
  \n\n\n\n此外，在受访的机构中，只有两家表示经常更新网站，而其他机构表示，他们很少维护公司网站，因为该网站通常仅作为其客户和潜在客户的基础信息来源。在受访的机构中，只有一家讨论了在其网站上积极使用\
  \ SEO，并表示他们平均每周会收到 70 多份想要与他们合作的音乐人的申请。\n\n将使用数字营销（特别是 SEO）的公司与不使用或不频繁使用这些策略的机构进行比较，其潜在客户的咨询量存在明显差异。\n\
  \n使用 SEO 和数字营销方法的公司收到的想要与他们合作的音乐人咨询数量之多，以至于他们每周只能接受其中的一小部分咨询。\n\n## 4.2.6: Spais\
  \ 对 Bendy “活动”理论视角的扩展\n\n紧接\n\n### 4.3: WAVE 结果与分析\n\n使用网页无障碍性评估工具 `WAVE` 对公关机构的网站进行了调查。通过该工具发现，所有评估的网站总共有\
  \ 557 个无障碍性错误，每个网站平均有 56 个错误。这些错误被分为九类。\n\n### 4.3.1: 错误 1：缺失替代文本\n\n发现该样本中，有五类错误在每个网站中平均超过\
  \ 10 个。其中最常见的是缺失替代文本，或存在没有替代文本的图像。根据\n\n这种错误很重要，因为每张图像都必须有一个 `alt` 属性。如果没有替代文本，屏幕阅读器用户、搜索引擎爬虫或在图像无法显示时，将无法获取图像的内容。这个问题可以通过为图像添加\
  \ `alt` 属性来解决。理想情况下，所提供的属性应该准确描述图像的内容和功能。根据 `WAVE` 词条中关于“缺失替代文本”的文章，如果图像的内容在图像的上下文或环境中传达，或者图像不传达内容或不具有功能，则应赋予空/空值替代文本（`alt=\"\
  \"`）。这个问题对本研究的意味着，搜索引擎爬虫在索引音乐公关网站上的图像时平均面临困难，结果是这些网站可能在搜索结果页面页（SERPs）上的排名并不靠前。\n\
  \n### 4.3.2: 错误 2：空链接\n\n在缺失替代文本错误之后，分析的每个网站平均有 29 个空链接错误。这意味着平均而言，音乐公关网站包含多个没有文本来描述链接目的的链接。这很重要，因为如果链接不包含文本，链接的功能或目的将不会呈现给用户。结果，这可能会导致键盘用户和屏幕阅读器产生困惑，并可能影响网站的可排名性。正如\n\
  \n### 4.3.3: 错误 3：链接图像缺失替代文本\n\n这些音乐公关网站上第三种常见的错误类型是链接图像缺失替代文本。根据 `WAVE`，这意味着有一张没有替代文本的图像，这将导致产生一个空链接。这种类型的错误结合了前面描述的两种错误的问题。不仅屏幕阅读器和搜索引擎爬虫无法理解图像的功能，还会影响页面被正确索引的能力，理想情况下，这将有助于页面在\
  \ SERPs 上获得更高的排名。再次，此错误可以通过添加适当的替代文本来修复，该文本应展示图像的内容和或链接的功能。\n\n### 4.3.4: 缺失表单标签\n\
  \n该样本中的每个音乐公关网站还平均有 14 个缺失的表单标签。这意味着，虽然网站上可能存在表单标签，但它不包含任何内容。这很重要，因为与表单控件关联但不包含文本的\
  \ `<label>` 元素不会向用户或搜索引擎爬虫提供任何关于该表单控件的信息（缺失表单，`WAVE`）。再次，这个问题具有影响网站 SERP 排名的潜力。然而，此错误可以通过确保表单标签包含描述关联表单控件功能的文本来修复。\n\
  \n### 4.3.5: 空标题\n\n抽样的音乐公关网站中发现的最后一种常见错误是空标题。分析的网站每个网站平均有 11 个没有内容的标题。这很重要，因为根据\n\
  \n### 4.3.6: WAVE 分析总结\n\n无障碍性对 SEO 有许多影响。平均而言，所评估的音乐公关机构的首页包含许多无障碍错误，最常见的错误可能会直接影响网站在\
  \ SERPs 上的排名。这些错误持续的时间越长，搜索引擎爬虫索引页面就越困难，也就越缺乏将页面在 SERPs 上排得更高的动力。为了探索网站的无障碍性，对公司网站进行了\
  \ WAVE 分析。\n\n仅首页首页，`WAVE` 就识别出 76 个错误。在这一分析中，有五个缺失的表单标签影响了 SEO。当此元素不包含文本时，它不会向用户或搜索引擎爬虫提供任何关于表单控件的信息。\n\
  \n当使用常用关键词进行搜索时，这些 SEO 错误影响 SERP 的证明是显易见的。在这种情况下，机构位于伦敦，因此研究人员搜索了“music London”。2\
  \ 号机构出现在第 5 页的底部。这个例子说明了这些 SEO 错误对排名的直接影响，以及音乐人在搜索该关键词时面临的竞争。这个例子也值得注意，因为它进一步支持了主题\
  \ 4 中讨论的关键词的信息。\n\n### 4.4: SEO 分析\n\n使用 SEO 分析软件 `ScreamingFrog` 对受访机构的网站进行了检查。尽管\
  \ `ScreamingFrog` 测试网站的许多 SEO 因素，但对于本研究，选择了八个关键领域进行检查。\n\n### 4.4.1: 网页索引性\n\n第一个检查区域是页面的索引性。在对\
  \ 10 个网站测试的 1490 个页面中，只有 70% 的页面是可以索引的。根据\n\n### 4.4.2: Title 1、元描述和 H1-1 长度\n\n\
  下一个检查区域是 Title 1 的长度。所有分析的网站的 Title 1 平均长度为 15 个字符。Title 标签应该是网站上每个页面独有的，与 Title\
  \ 1 长度的重要性相似，还检查了元描述长度，这些网站平均为 16 个字符。这与建议的 150–160 个字符长度形成了鲜明对比（\n\n### 4.4.3:\
  \ 内部链接\n\n### 4.4.4: 白帽 SEO 概念框架\n\n`ScreamingFrog` 分析得出的结果是关键词的缺乏。在 `ScreamingFrog`\
  \ 分析的 10 个网站的所有页面中，报告显示只有 0.07% 的页面包含关键词。\n\n应用\n\n虽然 70% 的网页是可以索引的，但仍然留下了 30% 无法被\
  \ Google 爬虫索引的页面。这对 SERP 排名也是问题，因为如果音乐公关网站上关于服务或服务评论的重要页面无法被索引，音乐人在搜索这些服务时就不太可能找到该公司。\n\
  \n\n\n\n\n鉴于 `Title 1` 标签、`meta description` 和 `H1-1` 标签的长度远低于建议标准，可以合理假设其页面优化几乎没有进行，因为基础的\
  \ SEO 功能未遵循数字营销人员设定的标准。最后，根据在与音乐公关机构访谈期间收集的信息，有证据表明其缺乏页面外优化，这些机构报告其整体数字营销活动非常少，只有极少数机构在社交媒体上开展工作。\n\
  \n这些投入产生的结果如下：\n\n## 5: 结论\n\n随着音乐行业格局日益依赖技术支持，实施数字营销策略可以为音乐公关机构提供竞争优势。本研究的发现表明，音乐行业的这一领域普遍未能跟上当前的营销实践，结果导致他们误解了音乐人是如何搜索和选择其服务的。\n\
  \n### 5.1: 了解独立音乐人寻找公关机构时使用的当前搜索行为\n\n通过对音乐人访谈的分析，研究人员确定了独立音乐人在寻找音乐公关服务时（特别是在准备发布单曲时）通常表现出的当前搜索行为。音乐人通过向其他与音乐公关机构合作过经验的音乐人寻求建议，或向其管理团队寻求建议来开始这一过程。然后，他们使用\
  \ `Google` 对得到的建议进行研究，并比较与其流派和地区相关的音乐公关搜索结果。研究发现，对音乐人最终决定与哪家机构合作影响最大的的因素包括：音乐人对机构人员的感受、查看该机构过去的作品案例、推荐意见、与机构的初次会议以及最后是服务成本。\n\
  \n### 5.2: 了解音乐公关机构获取客户时使用的当前营销方法\n\n通过对音乐公关机构的访谈分析以及 `WAVE` 和 `ScreamingFrog` 分析结果的发现，音乐公关机构通常向所有音乐人推销自己，无论音乐人的过往成就或流派如何。还发现，由于大量音乐人主动联系音乐公关机构，只有一半的机构通过社交媒体或电子邮件直接向音乐人推销。然而，受访的音乐人报告说他们不希望以这种方式被联系。此外，略于一半的机构积极使用数字营销技术进行在线自我推销，最常见的方式是通过社交媒体（参见\
  \ `Section 4.2.5`）。然而，许多机构承认他们没有按照应有的程度来实施这些数字营销实践。\n\n### 5.3: 音乐公关获取客户的方法与客户搜索行为之间是否存在差异？其影响如何？\n\
  \n本研究的结果确实证明了音乐公关获取客户的方法与客户搜索行为之间存在差异。发现，虽然大多数音乐公关机构确实通过推荐获得客户线，但许多机构未能承认其在线形象在音乐人最终决定与他们合作时所起的作用。从研究中可以看出，音乐人利用在线搜索来收集更多关于音乐公关机构的信息，无论他们是否受到了可靠来源的推荐。音乐公关机构方面缺乏数字营销策略（特别是\
  \ `SEO`）的实施，反映了他们对客户如何找到自己缺乏深度理解。\n\n### 5.4: 建议\n\n公关机构可以通过下文的优化当前数字营销方法来改进客户获取。\n\
  \n#### 5.4.1: SEO 实施\n\n由于发现音乐人根据在线搜索中找到的结果来决定与哪家机构合作，因此音乐公关机构应该采用 `SEO` 策略来帮助其网站在\
  \ `SERPs` 上的排名。\n\n在使用 `SEO` 时，还建议机构对公司网站进行无障碍和 `SEO` 分析，以获得关于需要解决的错误的个性化结果。然而，本项研究发现，音乐公关机构特别需要关注为图像添加替代性文本（alternative\
  \ text），确保所有链接都有文本，并添加表单标签和标题。此外，建议标题长度约为 50 个字符，`meta descriptions` 长度为 150–160\
  \ 个字符，标题（titles）为 60–70 个字符。通过检查网站的这些区域，机构能够纠错，从而在 `SERPs` 上获得更高的排名。\n\n#### 5.4.2:\
  \ 额外的网站板块\n\n公关机构还应该在其网站上增加板块，以应对本研究中识别出的、对音乐人选择影响最大的价值观。这些板块包括机构所有团队成员的介绍及其性格。由于音乐人更大程度地信任和依赖其他音乐人的推荐，音乐公关机构应该要求以书面和/或视频格式提供推荐，并展示在特定板块中，以缓解潜在客户。建议机构网站的另一个板块是表单，允许音乐人申请初次会议。我们承认许多音乐公关机构可能没有时间会每一个请求，因此建议提供\
  \ `30-min Skype 会议/咨询`。这些会议可以进一步增强潜在客户选择该机构而非其他选项的信心，并为公关机构提供评估音乐人匹配度的机会。最后，应该包含一个概述各种服务基本价格的板块。\n\
  \n#### 5.4.3: 时间分配\n\n本研究中的许多机构还提到，他们没有进行更多数字营销的原因之一是没有时间。解决这一问题的一种可能方案是，机构与其花时间直接联系想要合作的音乐人，不如将这些时间投入到社交媒体和\
  \ SEO 中。这一建议是基于对音乐人的访谈，他们都报告收到了来自音乐公关机构的消息但未予回复。音乐人表示他们不希望以这种方式被联系，这得出结论：这种营销方法可能无效。\n\
  \n### 5.5: 局限性与未来研究\n\n本研究的一个局限性是受访音乐人和机构的样本量较小。虽然这项研究探索了英国音乐公关机构营销方法的现状以及音乐人使用的搜索方法，但通过更大规模的音乐人和公关机构样本，将更准确地理解问题双方的这些方法。\n\
  \n此外，建议未来的研究审查社交媒体在音乐人选择合作公司时起的作用，以及音乐公关公司如何使用社交媒体、为什么选择这些方法、音乐人与这些渠道互动的频率以及互动的原因。\n\
  \n\n\n\n\n# 14: 工业 4.0 在持续职业发展（CPD）中的应用\n\nEustathios Sainidis; Guy Brown\n英国伦敦，诺森布里亚大学\n\
  \n## 摘要\n本章旨在回顾微观和宏观层面知识获取范围内可用的数字技术形式。特别是，我们讨论了`Industry 4.0`对持续职业发展以及大学等知识提供者的影响。通过对学习风格和职业模式进行评估，旨在让读者理解学习如何与职业发展相互作用，以及`Industry\
  \ 4.0`技术在个人和组织层面如何相互作用。讨论随后转向组织中领导者的关键作用，以及变革型领导力在现代工作场所引入、管理和应对`Industry 4.0`技术挑战时所发挥的作用。\n\
  \n### 关键词\n工业 4；大流行；CPD；教学卓越框架；TEF；领导力；VARK 模型；CIPD \n\n## 1：引言\n21 世纪的前二十年为组织的运营提供了一个动荡、剧烈且复杂的环境。对全球化的追求和对经济持续增长的信念，随着二战结束以来最持久的金融危机——2008\
  \ 年大衰退，以及最近的 COVID-19 全球大流行的来临而受到了质疑。与早期的全球经济衰退一样，大衰退不仅触发了发达经济体和新兴经济体在地缘政治、经济和社会结构上的结构性变化，还促进了数字技术在工作场所应用的创新。新冠病毒（COVID-19）的流行以及作为减少其在国内及跨国传播措施的社交距离的引入，加速了个人、教育和工作通信对数字技术的依赖。\n\
  \n办公空间的数字化正挑战劳动力市场现有的就业技能基础，并促使培训机构、大学、教育者、学者、商业领袖和政策制定者反思他们现有的实践、流程和思维。\n\n大衰退后的环境其特点是高水平的就业和流动性，但同时也处于低生产率。制造业回流和服务业自动化的增加可能会减少对低技能工人的需求。\n\
  \n高等教育在塑造和将未来技术及创新工具融入年轻毕业生和成熟学习者的知识与技能库方面发挥着重要作用，后者以持续职业发展（CPD）的形式存在。因此，大学面临内部和外部压力，需要调整自身，并迅速采纳和推广教育者和学习者对第四次工业革命（`Industry\
  \ 4.0`）的预期。\n\n同时，组织及其领导者日益意识到 CPD 作为人力资本增值活动的重要性，这可能带来颠覆性的创新机会。使用理解每位员工如何学习和专业发展的技术，要求高级管理人员具备变革型领导特质。\n\
  \n本章旨在探索这些现象，特别是对`Industry 4.0`及其数字创新如何塑造工作场所、个人作为终身学习者所面临的机会与挑战，以及商业领袖在支持高生产力且有成就感的人力资源方面的作用。\n\
  \n## 2：工业 4.0 时代的高等教育\n高等教育（HE）机构承担着将年轻人培养成具有就业能力的人的任务，使他们能够为雇主、创业项目以及整个社会做出价值的贡献。大学日益关注其学位课程的相关性和启发性教学。学术人员和学生支持资源被要求参与多项由政府主导的流程，以评估学生接受的教学质量（例如英国的教学卓越框架——TEF）。此类指标提高了高等教育部门的问责制，并加剧了大学之间的竞争，旨在提供利用数字（在线和课堂）学习技术的学生体验。\n\
  \n2018 年英国大学毕业生的就业率为 87.7%，远高于非毕业生的 71.6%。\n\n然而，尽管有大量证据表明大学毕业生正在获得在职场成功所需的数字知识和技能，但人们也认识到组织劳动力包含了广泛的经验、知识和技能。因此，需要经过计划的人力资源战略，考虑到员工处于不同的阶段。为了转型并开发满足当代职场需求的数字技能，需要强大的引导。\n\
  \n\n\n\n\n# 引言\n\n个人的上升轨迹在维持阶段会开始变得平缓。在这里，员工通常在其传统的就业领域具有高水平的技能，并拥有丰富的经验。然而，这些技能和经验对于组织的新入职者来说，可能不再具有同等的时效性。\n\
  \n维持阶段最终将进入 `Super` 术语中所说的“衰退期”。在这里，员工正走向职业生涯的终点，可能不愿或不愿意参与新的开发工作。\n\n对于雇主来说，理解这些职业阶段至关重要，特别是在一个以技术不断更新为特征的行业工作时。处于探索阶段的人员会渴望学习，并寻求雇主对其投资的每一个机会。然而，考虑到这类人在在此阶段职业生涯中可能会发生变动；因此，必须努力使技能发展与适当的其他激励和奖励机制相匹配。未能这样做可能会导致员工离开组织，从而造成技能和相关投资的损失。\n\
  \n在建立阶段，员工寻求稳定性。因此，这是投资发展的理想时期。这一阶段员工的特征是渴望表现出对组织的忠诚，并通常隐含地期望这种忠诚将获得职业增长（如晋升或其他或其他形式的外在奖励）的回报。\n\
  \n通常，更有问题性的是维持阶段。在这里，员工很容易对其现有技能和知识的范围感到舒适。结果是他们可能不愿参与进一步的发展，往往是因为担心自己缺乏当前的技能和知识可能会暴露。有充分证据表明，数字原住民（处于建立阶段的员工）与数字移民（处于维持阶段的员工）之间存在分歧。\n\
  \n在此阶段，员工通常也处于对他人的影响力的职位上。因此，他们对发展的抵制可能会影响周围的人。组织内部领导者需要使用一系列工具和技术来仔细管理这组员工，以确保他们对新兴技术产生意义的认同。雇主可以参考这项研究的建议\n\
  \n## 4: 职业领导力\n\n已有许多尝试来确定实现这种影响力所需的个人特质、行为和能力。\n\n*   **领导力能力**：\n    *   愿景、参与、赋能、询问和发展\n\
  *   **领导力特征**：\n    *   真实性、正直、意志、自我自信和自我意识\n\n事实上，正是这些能力、特征和特质的结合，如果能够有效运用，就可以用于确保对新兴技术的参与。具体而言，他们可以利用这些能力激励处于职业生涯探索阶段的员工对组织保持忠诚，并利用他们对技能开发的热情发挥作用。同样，处于建立阶段的人员通常将领导者视为榜样，并渴望成为类似的高成就者。领导者还可以影响处于维持阶段的人员，让他们参与组织的发展方向，拥抱新兴技术并实现持续的转型。\n\
  \n## 5: 变革型领导力\n\n变革型领导力的概念出现在 20 世纪 70 年代，通常与……的工作相关。\n\n尽管 `Burns` 的工作关注政治背景，\n\
  \n简单来说，变革型领导力可以被视为一个改变和转化个人的过程，侧重于将追随者视为完整的人。领导者承担影响的角色，推动追随者完成比通常预期更多的任务。\n\n事实上，\n\
  \n*   提高追随者对特定和理想目标重要性和价值的意识水平，\n*   让追随者为了团队或组织的利益超越自己的个人利益，\n*   推动追随者应对更高层次的需求。\n\
  \n在这样做时，\n\n| 性格特征 | 行为 |\n| :--- | :--- |\n| 主导型 | 树立强有榜样 |\n| 影响欲望 | 展现能力 |\n\
  | 自信 | 阐述目标 |\n| 强烈的价值观 | 传达高期望 |\n| | 表达自信 |\n| | 激发动机 |\n\n表现出理想影响力的领导者具有强烈的伦理实践感，并受到做正确事情的驱动。事实上，他们所做的一切都阐述了自己的价值观和信念，并在做出任何决定之前仔细考虑道德和伦理后果。作为回应，他们的追随者钦佩并信任他们。\n\
  \n在这个阶段，员工通常也处于对他人的影响力的职位上。正如前面提到的，他们对发展的抵制可能会影响周围的人……对对员工的关怀。作为回应，他们的追随者钦佩并信任他们。\n\
  \n激励性动机促进了领导者以有意义的方式为周围的人提供意义和挑战。换句话说，这是领导者的职责是以有意义的方式阐述未来状态和愿景。随后，领导者鼓励这种愿景并清晰地传达期望。在人工智能（`AI`）的范围内，目前的（2020）数据表明，只有五分之一的管理团队引入了某些\
  \ `AI` 流程，只有十分之一的人广泛引入了 `AI`。\n\n表现出理想影响力的领导者具有强烈的伦理实践感，并受到做正确事情的驱动。事实上，他们所做的一切都阐述了自己的价值观和信念，并在做出任何决定之前仔细考虑道德和伦理后果。作为回应，他们的追随者钦佩并信任他们。\n\
  \n第三个组成部分智力刺激被定义为变革型领导者通过质疑假设、重构问题和以新方式处理旧情况来刺激其追随者创新和创造的能力。\n\n因此，变革型领导者鼓励共同学习、创造和创新。特别是领导者和追随者被鼓励追求好奇心，并利用想象力产生新的想法和解决方案。\n\
  \n最后，个性化关注指出变革型领导者需要识别追随者的个人需求并通过教练和指导的方法提供适当的发展支持。\n\n支持型领导者将表现出仔细倾听、有效管理追随者的情绪、关注追随者的福利和关怀、表现对他感受的考虑以及同情。\n\
  \n在最近一项关于变革型领导力及其影响的元分析中\n\n## 6: 变革型领导者参与持续学习的角色\n\n此外，在对员工需求通常很高且面临供应有限额外挑战的新兴技术行业中，领导者采取措施留住并提升现有员工技能的重要性变得更加重要。在这种背景下，\n\
  \n这种终身学习是当职场人士的核心要求，个人的初始职业培训无法满足其整个职业生涯。然而，要做到有效，领导者必须理解学习语境，并采取必要的方法来促进对个人员工来说有意义且具有参与感的有效学习。\n\
  \n这一过程的第一阶段是理解个人的偏好学习风格。\n\n\n\n\n事实上，在考虑学习风格时，常见的考虑模型有 Honey 和 Mumford 模型以及 `VARK`：\n\
  \n- **行动派（Activists）**通常倾向于通过实践和参与学习来学习。换句话说，他们寻求实践学习，并且当学习干预是基于活动的时（包括小组解决问题、角色扮演、试错法、现场模拟以及在边工作边学习等方法），他们往往能投入最多。作为领导者，确保行动派的学习活动多样化并重点关注社交活动是非常关重要的。\n\
  - **反思者（Reflectors）**通常倾向于通过观察、思考和反思来学习。因此，他们需要时间处理信息，随后得出解决方案或学习结果。迎合反思者的偏好通常涉及包括阅读、听取以及解决问题的学习活动，通常在他们有机会吸收所学内容后，在学习环境之外进行解决。作为领导者，设计学习活动时，让反思者能够坐下来接收信息，然后有时间仔细思考并理解所说内容是至关重要的。\n\
  - **理论家（Theorists）**通常倾向于通过了解支持思想和行动的理论来学习。因此，他们更倾向于允许大量分析、综合和吸收知识的学习。这可以通过包含模型使用、理论框架、告知这些模型和框架的基础研究，以及随后的讨论和提问机会的学习来实现。\n\
  - **务实者（Pragmatists）**通常倾向于通过将理论付实践来学习。因此，当有机会从专家那里学习新概念并迅速尝试它们以观察其在实践中如何运作时，他们学得最好。换句话说，务实者喜欢允许持续实验和实践性活动的学习。这可以包括咨询项目、基于问题的活动和整合方法等干预措施。\n\
  \n`VARK` 模型表明，学习的交付方式存在偏好。这可以通过视觉、听觉、读写或动觉的方法来实现。\n\n- **视觉型（Visual）**学习者关注视觉和视觉图像以达到最佳学习效果。这包括使用绘图、图表、图解、海报、白板活动和观察活动。\n\
  - **听觉型（Auditory）**学习者关注听力和声音以达到最佳学习效果。这包括使用讨论、播客、网络聊天和讲座。\n- **动觉型（Kinaesthetic）**学习者关注触觉、感觉和运动。这包括实践任务、角色扮演、案例研究和其他模拟方法。\n\
  \n当然，学习者可能有多种学习风格/偏好，很少有人会仅通过一种偏好方法进行学习。\n\n对学习风格/偏好的理解将使领导者能够最好识别出充分发挥个人能力的学习方法。\n\
  \n人力资源与开发协会学会（`CIPD`）：\n\n- 学习需求的性质和优先程度，\n- 干预后要求的预期和对绩效的影响，\n- 职业类型以及的需求和可行性，\n\
  - 学习者的背景，\n- 组织文化和预算提供，\n- 对之前学习干预有效性的评估，\n- 学习干预涵盖的知识、技能或行为的复杂性。\n\n然后可以确定学习方法是在工作场所内还是工作场所外进行。\n\
  \n## 6.1：职场学习\n\n如名所示，职场学习是在员工的工作场所进行的。这可以通过一对一学习或小组活动来实现。此类活动可以由在自己的领域担任专家的同事或其他内部或外部培训专业人员提供。\n\
  \n`CIPD` 总结了这种方法的优点，包括：\n\n- 学习具有相关性，并针对组织和个人的特定需求进行定制。\n- 学习者能够立即练习所学内容以增强记忆。\n\
  - 学习速度可以针对学习者进行调整。\n- 可以考虑学习者现有的知识和技能水平并利用其加速学习。\n- 学习者可以从领导者的持续积极反馈中受益。\n\n这些观点得到了以下因素的支持：\n\
  \n- 非常及时——在需要时进行培训。\n- 学习者了解工作的真实情况。\n- 学习者倾向于非正式学习，通常从专家同事或经理那里学习。\n- 可能帮助学习者的经理参与培训。\n\
  - 不会大幅减少工作时间。\n\n然而，他们也承认这种方法的局限性，包括：\n\n- 学习者可能会失去大局。\n- 学习者可能没有时间充分反思学习或提问。\n\
  - 职场的压力可能会损害培训质量。\n- 学习者可能对承认弱点感到不安。\n\n教练（Coaching）和导师（Mentoring）方法也可用于支持学习。这些一对一学习技术利用讨论来增强个人的技能、知识或工作表现。\n\
  \n- 学习可以根据个人需求定制。\n- 培养学习者对自身发展的责任感。\n\n然而，他们也承认这种方法的局限性，包括：\n\n- 教练或导师需要具备有效的技能来开展这种方法。\n\
  - 教练或导师必须与学习者建立良好的关系。\n\n## 6.2：工作轮岗、外借和影子学习\n\n同样，工作轮岗和影子学习是一种干预措施，员工从组织中拥有他们相关知识或专长的同事那里学习。\n\
  \n## 6.3：行动学习和学习项目\n\n组织可以启动的另一种学习方法是行动学习。这是一种协作学习的形式，一小组学习者（行动学习小组）定期见面，对实际工作问题进行反思。因此，学习者相互学习新的技能和知识。\n\
  \n- 学习源于彼此的经验。\n- 为讨论和解决工作挫折提供了很好的出口。\n- 鼓励对学习和行动的所有权。\n\n然而，他们也承认这种方法的局限性，包括：\n\
  \n- 取决于其他人是否想要相同的格式，\n- 需要离开工作场所，\n- 需要纪律和投入，可能难以维持小组成员关系。\n\n\n\n\n教学方法可以导师指导、演示、小组讨论、专家演讲、实验室工作、模拟以及广泛的后续学习者活动，如测试、测验、演示报告、角色扮演、技能练习和反思。然而，在投入任何形式的场外学习之前，必须仔细考虑个人的学习风格，以确保所采用的方法与学习者的偏好之间有紧密的匹配。\n\
  \n提供正式资格或职业认可通常也与场外学习相关，因此，这可以增加学习者参与的积极性。\n\n## 7.1 距离学习与在线数字学习\n\n认识到场外学习、距离学习或在线学习的某些挑战，涉及到使用通过邮政或电子方式传输的学习材料。因此，获取方式非常灵活，学习者通常可以在最适合其生活方式的时间参与。\n\
  \n* 学习在获取方面具有灵活性。\n* 学习者可以按照自己的进度学习，并根据需要进行回顾。\n\n然而，他们也意识到了这种方法的局限性，包括：\n\n* 学习者可能会错过来自他人学习的刺激。\n\
  * 可能需要额外的设备或 IT 技能以确保充分获益。\n\n## 8 总结\n\n总之，机构日益依赖数字技术来为其员工提供技能提升、终身学习倡议和流程实现成功。以\
  \ `AI` 等形式存在的数字技术已显示出某种程度的成功，但机构及其领导者尚未充分认识并利用此类资源效率工具的优势。\n\n## 参考文献\n\n# 15 针对全息和混合现实世界中数字公民法律与伦理保护的监管调查\n\
  \nRussell Watkins^(a); Hamid Jahankhani^(b)\n\n^a 英国伦敦 Hiscox 保险公司 \n\n^b 英国伦敦诺森布里亚大学\n\
  \n## 摘要\n\n混合现实——将数据与现实生活融合的混合状态——正处于成为主流的边缘，技术正在推人类大脑能够轻松理解的边界。本章对混合现实格局和用例进行了回顾，提供了当前/未来可能针对消费者的攻击机制示例，并讨论了现行的英国/欧盟法律法规是否充分保护了消费者。文中讨论了全息通信和攻击向量，以及此类技术对数字移民的影响以及生物识别凭据被盗取的易性。\n\
  \n### 关键词\n\n全息通信；混合现实；GDPR；VR；虚拟现实；生物识别；面部识别；DNA；法律；伦理\n\n## 1 引言\n\n我们的世界一直建立在恒常的基础上：触觉、嗅觉和味觉——这些都是切的、一致且可衡量的。从人类首次出现在草原以来，人类就与了我们今天仍在表现和实践的情感和行为。千年来，情况一直是如此；然而，数字时代已经来临；仅仅在一个代人的范围内，世界已向混合状态迈进，将我们编程到自身之中的现实与数字化的非现实混合在一起。这种发生速度之快，达尔文主义（生物体对新环境做出反应和适应）未能遵循其正确的道路。事实上，世界正在向着那些没有数字足迹的人注定灭绝的状态。人类心理学与技术的交汇是一个迷人的领域。随着这种向混合世界的快速转型，尚且这将如何影响数字原住民（从小沉浸在技术中的人）和数字移民（那些在技术出现前认识世界的人）尚不为人知。\n\
  \n法规似乎仍然匮乏，随着所有数字公民向混合现实的轨迹加速，新兴技术的影响以及其伦理/法律后果充其量只是了解较少。\n\n我们相信，总有一天，这种沉浸式增强现实将成为数十亿人日常生活的一部分。\n\
  \nMark Zuckerberg，Facebook Inc. 创始人兼首席执行官\n\n模拟时代已经结束；数字时代尚未到来。社会正处于一种混合现实中，这种现实是自然产生的，但几乎没有方向和指导。\n\
  \n增强现实是一个词组，当被使用时会勾勒出未来风格的世界，其中现实与虚拟融合。字典将这一定义界定为“通过使用技术在……叠加数字信息而创建的现实增强版本”。\n\n\
  这一连续体展示了现实与虚拟世界之间交互的不同阶段。为了解释这一点，请考虑一个戴着 `VR` 头显设备的主。`增强现实`作为一个概念似乎相对新，但其起源可以追溯到\
  \ 20 世纪初——远在任何人理解随之而来的技术进步和伦理挑战之前。要理解这一点，读者需要理解人类对《星际迷航》风格世界的梦想\n\n用于讨论连续体上不同点的术语引起了许多困惑。虽然连续体上的每一步在\
  \ CIA 三元组（机密性、完整性和可用性）方面面临不同的挑战，但为了本研究论文的目的，混合现实和混合现实这两个术语将交替使用，以描述量表上的任何点。例外是现实世界和虚拟现实的绝对值。\n\
  \n20 世纪 90 年代提出了数字鸿沟一词，以区分访问计算机和互联网的人。然而，这个定义只考虑了社会经济差异，而不是对技术的熟悉程度。\n\n此类术语的挑战在于它们是二分的\n\
  \n随着混合现实的到来，我们如何验证和保护隐私及个人数据面临着新挑战。生物识别正成为认证的事实标准，虽然传统的认证方法仍然是必要的，但在可预见的未来，它们将成为未来感且便利的安全凭证的一小部分。\n\
  \n许多现代技术设备利用 `biometrics` 来控制对个人数据的访问并用于识别目的。\n\n## 2 生物识别：事实标准\n\n欧盟消费者总体非常熟悉生物识别设备的使用。根据\n\
  \n尽管 `fingerprint` 生物识别是一项成熟技术，其他物理生物识别创新在识别和访问控制方面的应用也在增加，新创新脱颖而出并获得市场份额。同时，行为生物识别——关注性格特征而非物理标识符——正在获得关注，以补充物理生物识别技术。物理生物识别的金标准是\
  \ `DNA`——尽管这一直限于政府和执法部门的法医学，但技术和成本的提高可以将这项技术带给消费者。表 1 总结了现有的不同生物识别类型。\n\n表 1\n\n\
  生物识别模式列表。\n\n| 生物识别类型 || 描述 || 特征 |\n\n| --- | --- | --- |\n\n\n\n\n\n| 模态 | 描述\
  \ | 类型 |\n| --- | --- | --- |\n| 人脸识别 | 利用标准摄像头和红外摄像头映射人脸部独特点以进行身份验证的过程 | 物理 |\n\
  | 手部几何结构/血管技术 | 与人脸识别类似，但使用其他独特特征进行身份验证 | 物理 |\n| 语音识别 | 通过数字解码器转换人的声音，以产生针对受体的特有算法\
  \ | 物理/行为 |\n| 签名 | 对受体手写中独特点的识别 | 物理/行为 |\n| DNA | 使用个人的独特基因组成提供身份识别。是所有模态中最具独特性的\
  \ | 物理 |\n| 打字/鼠标模式 | 测量打字击键频率和压力，包括鼠标移动 | 物理/行为 |\n| 视网膜/虹膜 | 对独特的光学特征进行红外或摄影扫描\
  \ | 物理 |\n| 指纹/掌纹 | 指纹独特去特征的映射 | 物理 |\n| 步态 | 测量人的身体体型和行走方式 | 行为 |\n\n作为一种独立的安全机制，生物识别相较于传统的身份验证方法面临着独特的挑战。根据：\n\
  \n消费级设备中指纹的完整性是其作为身份验证机制成功的关键。长期以来人们认为指纹具有足够的独特性来提供保护并确保安全；然而，在日益连接的世界里，这可能不再成立。\n\
  \n虽然 DNA 是唯一的，但在某些情况下，这一前提可以被反驳，从而导致涉及个体的完整性问题。\n\n另一个挑战集中在机密性上——安全的身份验证建立在这一要素之上，如果没有它，身份验证者将无法通过任何完整性进行验证。此外，我们的生物识别标记随时向所有人展示——除非戴着墨镜或手套，否则人可能会通过智能手机上高分辨率摄像头等简单的工具面临凭据被窃取的风险。进一步考虑，人类只需通过开门和留下指纹的过程，在公共空间不断留下他们的凭据。仅仅走过高分辨率监控摄像头就可能暴露许多物理和行为生物识别标记，这些标记随后可能被不法利用。不幸的是，在这个新的混合现实世界中，面临风险不仅是技术用户；一个没有技术存在迹的人只要处于此类技术的范围内，其生物凭据就可能被被动破解。这可能直到很后才为人知，届那时该人发现存在一个他们完全无解的数字克隆。\n\
  \n生物识别信息的泄露为数字身份验证的综合威胁格局增加了额外的脆弱性，在某些情况下，可能会削弱而非加强身份验证机制，导致 CIA（机密性、完整性和可用性）概念的严重削弱。在混合现实和全息通信的情况下，对生物识别的过度依赖和过度自信可能会使其他形式的攻击变得多，并增加用户机密性和完整性被破坏的机会。此外，生物识别通常用作单因素身份验证机制，一旦被破解，就可以轻松访问个人数据。\n\
  \n![图 1](img/#B978012821442800001)\n\n## 3: 混合现实的未来方向\n\n为了讨论混合现实的未来，回顾由以下内容引入的挑战是有：\n\
  \n## 4: 全息现实\n\n尽管研究仍在进行且全息技术尚处于婴儿阶段，但关于开发的全息现实潜力的信息仍然匮乏。\n\n![图 1: 混合现实的威胁格局](img/#B978012821442800001)\n\
  \n![图 1: 混合现实的威胁格局](img/#B978012821442800001)\n\n## 5: 一对多通信\n\n在标准电话和增强全息通信中相关且常见的信息共享模型有三种：一对一、一对多和多对多。\n\
  \n由于全息通信涉及多模态数据流，引入了不适用于当前电话技术的各种攻击向量。为了实现真正的全息通信，需要大量的传感器来监控声音、视频和质量。根据情况、授予的权限和环境，每个全息化身（avatar）都可能需要对另一个化身进行\
  \ 360 度视图。如果没有这一点，真正的全息端到端通话将只是增强型的视频通话或单向的全息体验。\n\n\n\n\n尽管 `subject A` 已通过各种反馈渠道证明了真实性，但完整性已受到破坏。通过本研究中的一系列生物识别凭证盗窃实验，非专业用户可能很容易被胁迫交出生物识别凭证以辅助任何攻击。\n\
  \n深度伪造（Deepfake）网络犯罪——即利用人工智能模仿他人的声音或视频——已经已被威胁行为者成功利用，并预计未来将变得更加流行。这种技术的恶意用途也可能应用于广告和政治等迥不同的领域。由于该技术依赖于访问语音和视频数据来创建深度伪造全息图像，目前它仅限于公众人物。然而，随着技术的进步，预计其他数据点将允许创建出足以欺骗非专业用户的“浅层伪造（shallow\
  \ fakes）”。\n\n# ## 6: 全息通信的隐私挑战\n\n目前的消费者级视频通话技术通常会使用安装在通信设备上的静态摄像头（通常是智能手机、平板电脑，或使用个人电脑上的摄像头）。大多数数字公民对这种成熟技术很很，它被应用于大多数流行的社交媒体和通信应用中。正如上一章提到的，全息通信需要一系列沉浸式传感器能力来实现栩栩如生的互动。更重要的是，第三方或多个第三方的视野将超出目前的\
  \ 2D 边界，可能允许对第一人区域进行 360 度的观察。\n\n全息通信的进一步隐私挑战是观看区域控制权的丧。为了实现完全的沉浸式全息体验，每个参与都应该具有控制摄像头和视野的能力。目前的消费者级视频通信方法不允许这样做，仅将视野控制权交给了第一方。如果保持现状，全息体验将受到损害。\n\
  \n尽管从静态观看轨迹到动态轨迹的转变可能受到某些通信的欢迎，但在某些情况下，这可能会威胁到第一方的机密性。以冷启动电话或欺骗电话为例；通过移动或固定电话拨打，这不涉及被动隐私问题。在通信信道中加入视频会导致指定区域内的受控隐私风险；但对于全息通信，随着观看区域的扩大，第三方可能会进行进一步的侦察。之前隐藏的信息（如钥匙位置或书面信息）可能会被泄露。\n\
  \n今天许多连接设备和相关的消费者服务依赖于个人消费者放弃某些个人隐私，以换取相应的利益或便利性。\n\n尽管 Corcoran 没有明确引用这一领域，但他确实将“位置和空间”作为个人隐私的关键分类之一，并指出此类技术用户需要受到免受伤害的保护。创建“增强黑点（augmented\
  \ blackspots）”可能是解决此问题的方案；第一方可以委托视野内的某些区域进行像素化以确保隐私；然而，这项技术尚未普及。此外，目前增强现实设备之间还没有统一的标准来确保一致性。\n\
  \n### ### 6.1: 立法挑战\n\n在全球范围内，为增强现实或全息通信提供监管的计划很少。其原因可能是由于这些模式处于婴儿阶段，该技术尚未发布少数商业应用。\n\
  \n巴西试图将其数据监管进入现代，，其新创建的《通用数据保护法》已于 2020 年 2 月生效。被称为 `LGPD` 的法律与欧盟的数据保护法相似，因为它引入了数据所有权、被遗忘权以及对违规行为的严厉惩罚。\n\
  \n在英国和欧盟，除了 `GDPR` 和《2018 年数据保护法》外，增强现实没有针对性的监管规定。\n\n#### #### 6.1.1: 财产产权\n\n\
  #### #### 6.1.2: 隐私\n\n尽管 `GDPR` 为消费者提供了免受未经授权收集信息的保护，但增强现实的目前进展可能会让毫无防备的用户越越法规的边界。社交媒体网站上已经有了用户的多个数据点；带有此类应用程序的智能手机未来可能会通过增强显示无意中识别用户位置，或泄露个人身份信息。这将违反数据保护法规。如果收集的数据是针对未成年人的，那么这可能被视为更严重的犯罪。\n\
  \n\n\n\n该实验的前提是理解攻击者在自然环境中多容易从毫无防备的公众手中窃取生物识别信息。在助手的帮助下，研究人员访问了实验地点。研究人员和助手穿着休闲，与该区域的顾客混在一起。一旦就位，实验的操作仅仅是要求公众以爱洛斯像（Eros\
  \ statue）为背景为研究人员和助手拍照。这种行为在许多旅游景点都很常见，两名公众可能希望出现在同一张照片中，并需要第三方的帮助。\n\n### 实验方法\n\
  \n在进行实地实验之前，考虑并记录了测量所需的参数和数据点。收集的相关数据点如下：\n\n* 实验日期和时间\n* 地点\n* 受试者性别\n* 受试者年龄组\n\
  * 人数\n* 受试者提出的任何挑战\n* 理解易懂程度（例如语言）\n* 理解易懂程度——智能手机的技术使用\n* 手机相对于身体的位置（即：持于脸部高度或胸高度）\n\
  * 拒绝请求及理由\n* 使用数字或机械相机快门按钮\n\n受试者是随机的，但为了确保涵盖关键的人口特征——数字原住民和数字移民——特意尝试让这两组人数平均。随后，这些数据被转换为分类变量。\n\
  \n智能手机相机程序已经启动，受试者只需对准智能手机，在取景器中对齐研究人员和助手，然后按下快门按钮拍照。\n\n窃取凭据的方法有很多；然而，生物识别凭据由于其本质，一旦泄露就难以或无法更换。由于生物识别凭据属于下一代攻击向量，强制性窃取生物识别凭据的手段虽未被具体包含在\
  \ MITRE 框架中，但被松散涵盖在通过被动手段进行输入捕获中。\n\n虽然这次练习用于证明窃取凭据的易用性，但实际上并没有记录任何凭据。事实上，智能手机处于标准状态，因此无法记录或存储此类凭据。\n\
  \n未收集或存储任何个人身份识别数据，因此这些数据免于 GDPR 规则的管辖。不需要进行匿名化，因为没有数据可以追溯到任何个人。\n\n每个受试者都被要求拍照，并有机会拒绝该机会。除了提供使用硬件快门按钮或点击手机屏幕上的电子按钮的选择外，没有提供关于智能手机相机使用的指导。\n\
  \n为了提高实验的有效性，研究人员决定在另一个地点重复实验——即另一天的 what3words 地点 `fell.cost.elder`。该区域以零售业为主，游客较少，因此这增强了实验的人口统计特征、范围以及后续结果。\n\
  \n### 物理与认知要求\n\n使用智能手机拍照需要以下物理和认知反应：\n\n* 根据拍摄场景对智能手机进行定位；照片可以根据场景以横屏或竖屏模式拍摄。\n\
  * 智能手机操作者的灵灵活性。根据智能手机的大小，这可能是一项双手或单手操作。\n* 取景器的位置。对于实验要求的肖像照，预计受试者会将手机持在脸部高度，这不仅是为了从正确的角度拍摄，还为了确保取景器的可见性。\n\
  * 对硬件的熟悉程度。本实验中使用的硬件相机功能是由于其易用性以及对任何安卓/iOS 用户的熟悉度而被选定的。图 2 显示了呈现给受试者的取景器。\n\n![图\
  \ 2 本实验所用智能手机的标准取景器。](img/f15-02-9780128214428.jpg)\n\n图 2 本实验所用智能手机的标准取景器。\n\n\
  ### 凭据窃取前提\n\n使用智能手机开启了多种凭据据的可能性。具有高清镜头、指纹传感器以及红外和声波能力的前后摄像头都是可以在不引起系统用户的情况下发起被动凭据窃取活动的组件。实验数据点的选择是为了测试以下前提：\n\
  \n* P[1] 手机将平举，使受试者暴露于以下凭据风险中：\n    * 虹膜\n    * 眼脉\n    * 面部识别\n* P[2] 使用物理按钮或屏幕按钮拍照。使用屏幕按钮将使受试者暴露于以下凭据风险：\n\
  \    * 指纹生物识别\n* P[3] 受试者的年龄组将与 P[1] 和 P[2] 匹配。\n\n记录了额外的次要数据点（人数、性别和理解易懂程度），以评估未来的研究领域或支持主要数据点。\n\
  \n## 8: 批判性讨论\n\n本研究的总目标是回顾消费者在混合媒体通信和泛增强现实方面将面临的挑战，并决定是否需要进一步的保护来防止消费者受到伤害。\n\n\
  所开展的工作涵盖了网络安全领域和未来数字通信领域的多个领域。\n\n在回顾现有文献时，本研究发现关于隐私和全息通信的信息匮乏。这导致在呈现领域现有研究的同时，提出了各种可能的案例。\n\
  \n本研究完成的工作清楚地表明，公众尚未为混合现实世界做好准备。发现人类心理并不擅长处理现实与增强数据的融合，即使是合格的数字公民也可能被这种环境欺骗。在目前的控制下，消费者可以很容易被强制交出隐私详情或个人信息。汽车信息系统的增强可能会被破坏，并导致可能及生命的后果。\n\
  \n科技公司继续推动技术进步，往往很少考虑消费者保护。在全息通信的情况下，可能需要硬件和软件控制，以允许用户安全地使用这项技术。\n\n虽然生物识别技术在移动设备的身份验证和识别领域占据主导地位，但这种数据保护方法显然将用于混合现实领域，密码将逐渐退出消费者数据的保护机制。由于生物识别经常被用作单因子验证方法，个人数据被窃取的可能性可能会增加。\n\
  \n数字消费者通常将生物识别视为一种法医学上的“涅槃”，一种确保身份验证和识别的万无一的方法。实地调查和文献综述表明，这种想法周围存在巨大挑战，如果没有进一步的意识，用户可能会轻易遭受凭据窃取。特别是实地调查简洁明要地强调了这一前提。\n\
  \n\n\n\n英国和欧盟立法通过《通用数据保护条例》（GDPR）为用户的生物识别信息提供了一些保护；虽然生物识别未被特别提及，但它们仍被涵盖在“特殊情况”之下。2018\
  \ 年的法规在两个经济区内均已法律化，并强制公司尊重数据。对于违反法规的惩罚具有惩罚性，以确保遵守；然而，对于生物识别数据已泄露的数字公民来说，这种安慰微乎其微。用户名或密码可以更换，但由于其生物和行为属性，生物识别往往是不可替代的，需要进一步的保护。\n\
  \n英国在线欺诈的频率呈上升趋势；政府统计数据显示，2018 年此类案件增加了 6%。重要的是，身份欺诈是该领域增长最快的欺诈类型。令人担忧的是，针对被视为“数字移民”的人群，此类犯罪出现了不成比例的增长。\n\
  \n数字移民与原住民之间缺乏差异，可能是由于技术类型的现代性——生物识别是智能手机上一种相对现代的身份验证机制，在这种情况下，所有调查的人口统计群体都可以被归类为数字移民。\n\
  \n研究提炼出了各种建议。建议对任何可能被认为让公众面临危险的混合现实系统进行政府监管。这种监管可以包括监管机构或对此类设备的设计制定强制规定。\n\n事实上，在未来的增强或全息通信中，由于此类通信媒介的被动查看区域，存在隐私风险。此处建议使用数字“黑点”作为解决此类风险的技术解决方案。这可以基于\
  \ GPS 或类似技术的网格系统；结果是网格区域的所有者可以需要从增强世界中编辑网格单元。这带来了关于所有权、所有权转移、维护和标准的许多问题。此类系统将为此类技术的挑战性隐私问题提供解决方案。\n\
  \n## 参考文献\n\n# 16: 大数据分析对竞争情报的影响：阿酋房地产开发定性案例研究\n\nEman Reda AlBahsh; Amin Hosseinian-Far\
  \ `^()` 诺丁汉大学，英国诺丁汉\n\n## 摘要\n\n颠覆性信息系统的出现为许多组织提供了超越其竞争对手的竞争优势。这也导致了多样化且大量数据的产生。现代企业开始实施大数据分析（BDA）来提取价值并为其决策提供信息。大数据分析和竞争情报（CI）一直是学术界和从业人员的重要研究领域，但对于大数据驱动的决策及其结果如何在组织竞争情报中创造价值的理解仍然有限。本文试图弥补这两个概念之间的鸿沟，并对采用大数据的影响及其对组织竞争情报的影响进行全面评估。本研究的背景是阿联酋的房地产行业。研究结果为在存在大数据技术的情况下开发正式的竞争情报流程框架提供了必要的变量。\n\
  \n### 关键词\n\n大数据分析；竞争情报；决策；战略工程\n\n## 1: 引言\n\n考虑到产品生命周期缩短、市场瞬息万变以及营销策略寻求生存的环境中的竞争趋势，组织被迫不断识别竞争对手的活动并关注他们的市场洞察（\n\
  \n组织可以通过收集信息以汇集有关竞争的原始数据并开发洞察，或通过使用现成的分析结果来获得竞争情报（\n\n文献中识别了多种竞争情报模型。通常情况下，竞争情报始于收集信息，结束于制定决策。现代企业提升了在竞争情报过程中利用\
  \ IT 能力的需求，因为它可以改进预测并能动态检测竞争对手的活动（\n\n\n\n## 2: 文献综述\n\n### 2.1: 竞争情报\n\n文献中对竞争情报有几种定义。\n\
  \n竞争情报可以被视为过滤、提炼和分析信息的工具（\n\n决策者应该请求相关信息以实现某些目标。这些信息用于构成两类决策：运营决策和战略决策（\n\n### 2.2:\
  \ 竞争情报流程\n\n竞争情报是一个链接阶段的过程\n\n竞争情报的其他阶段在文献中也有讨论；\n\n通过对相关模型进行批判性评估并考虑到项目的目标和目的，\n\
  \n![图 1](img/f16-01-978012821428.jpg)\n\n通过所有阶段，组织必须提供清晰的正式和非正式政策，帮助员工做出有效贡献，为决策者提供反馈。\n\
  \n### 2.3: 竞争情报的测量\n\n存在实证主义哲学\n\n正如上一节所述，竞争情报的目标是为决策者信息\n\n- 充足的人员和适当的技术以充分实现测量\n\
  - 所有测量的战略资金和成本效益\n- 与其他部门联系以建立数据传输路线\n\n学者识别了不同的竞争情报测量指标；\n\n一种最近的指标寻求测量中的“正确的事物”\n\
  \n总之，竞争情报指标应该衡量某项行动是否成功实现了目标。回答什么、为什么和如何是评估性能的关键指标，特别是当情报的主要目的不仅是为了证明生产力而且为了向决策提供信息时。\n\
  \n### 2.4: 大数据分析\n\n大数据正成为学者和从业人员中的一个热点\n\n大数据的出现已成为一个技术复杂性的全球术语，旨在分析大多数非结构化大数据数据，而传统工具无法处理。“V”的概念在文献中被广泛用于定义“大数据”。总结，“V”指的是：\n\
  \n- 体量：需要巨大存储或包含大量记录的数据\n- 多样性：来自更多来源和格式并包含多维数据字段的数据\n- 速度：数据生成的频率和数据交付的频率\n- 真实：分析大数据以对小样本进行可靠预测\n\
  - 价值：提取可以帮助组织长期或短期节省资金的洞察\n\n\n\n\n\n- **规范性分析（prescriptive analytics）**：涉及描述性分析和预测性分析。\n\
  - **预防性分析（preemptive analytics）**：对可能对组织产生负面影响的事件进行预警性情报分析。\n\n\n\n\n## 2.5: 大数据分析\n\
  \n大数据定义\n大数据分析（`BDA`）在文献中已有大量报道。然而，只有少数研究探讨了 `BDA` 对组织竞争情报的影响。尽管 `BDA` 可以处理结构化、半结构化和非结构化数据，但研究仍然存在。\n\
  \n# 3: 研究方法论\n\n## 3.1: 研究范围\n本文侧重于评估利用大数据源和分析技术对竞争情报过程性能的影响。评估将在阿联酋阿布扎比的一家本地房地产开发商进行，以下简称\
  \ `‘EK04’`。该组织近期采用了 `Oracle` 来实施 `BDA`，本文将对 `BDA` 首次实施后的竞争情报过程及程和性能进行首次评估。\n\n本研究计划通过提供一个将大数据与竞争情报相结合的综合模型，作为支持决策的运营工具，以填补文献中的空白。\n\
  \n## 3.2: 研究哲学与方法\n本项目采取了建构主义哲学，研究者假设现实是通过主观主体间的意义和理解构建的，这些理解是通过社会化和实验发展出来的。\n\n\
  遵循解释主义的哲学认识论方法，本文将寻求基于个人意图的主观和深度信息。\n\n研究的依据源于研究目标，这些目标具有探索性质，旨在获得对特定行为的深入理解。这种探索性研究通常试图弄清特定情况下发生了什么，并澄清和完善对事物如何发生的更佳理解。\n\
  \n通过归纳推理，评估将从对大数据实施与竞争情报系统连接的详细观察开始，旨在走向抽象的概括和陈述。此外，由于本研究旨在理解经理的经验，预计数据强度非常高。因此，生成的知识和发现应当能够构建变量组件之间动态与韧性之间的严密关系。虽然归纳法可以揭示关系方面的见解，但也可能识别出其他认知活动并发现新现象。\n\
  \n鉴于研究工作的探索性质，选取了案例研究法，将 `CI` 和 `BDA` 元素作为研究设计的核心重点，并“强调与环境相关的发展因素”。\n\n## 3.3:\
  \ 数据收集\n本研究基于定性方法，通过使用半结构化访谈进行数据收集，以确保获得丰富的描述支持研究目的。访谈将有助于研究深入理解现象的复杂性。\n\n数据收集（即访谈）是以谨慎的方式进行的，例如适时的停顿或提示。\n\
  \n在 `EK04` 现场共开展了七次访谈，以符合研究重点，确保参与者在自然环境中感到舒适。\n\n受访者与其工作年限和领域相关的经验如表 1 所示。\n\n\
  ### 表 1\n| 受访者 | 工作领域 | 部门 | 高级管理经验总年限 | 在 EK04 工作年限 |\n| :--- | :--- | :--- | :---\
  \ | :--- |\n| 受访者 A | 营销经理 | 营销 | 16 | 3 |\n| 受访者 B | 分行经理 | 销售 | 15 | 6 |\n| 受访者\
  \ C | 财务 | 财务 | 20 | 10 |\n| 受访者 D | 运营官 | 运营 | 15 | 11 |\n| 受访者 E | 销售经理 | 销售 |\
  \ 12 | 9 |\n| 受访者 F | 客服经理 | 客服 | 14 | 10 |\n| 受访者 G | IT 经理 | 运营 | 10 | 2 |\n\n\
  为了确保可靠性和有效性，严格遵守了完整的机构伦理政策；在进行访谈之前，收集了参与者信息表以及每位受访者填写并签署的知情同意书。该研究是纵向的，因为受访者对采用\
  \ `BDA` 之前后的竞争情报过程都有见解，他们能够进行比较并提供有关决策经验的信息。\n\n## 3.4: 数据分析\n数据分析过程是系统且迭代的，为了更深层次的理解并提高通用性。\n\
  \n最后，将出现的主题和主题与现有文献综述相结合，以探索数据分析的可能解释，并为拟议的过程提供依据。\n\n## 4: 发现\n根据七位经理的叙述，出现了四个主题。首先，`CI`过程在实施\
  \ `BDA` 后发生了变化。其次，`BDA` 发挥了数据收集、排序、存储和分析的作用。因此（第三点），`CI` 社区需要更少的决策者来运行 `CI`。最后，`BDA`\
  \ 对描述和预测市场具有巨大影响。\n\n## 4.1: 产生竞争情报\n\n### 4.1.1: BDA 之前\n观察到 `CI` 的计划和方向是 `VC`、`CEO`、四位分行经理和五位部门主管组成的社区的责任。每周二，该小组聚集讨论市场反馈并做出决策和制定相应的计划。问卷结果发现这一阶段是整合的，并被视为信息分析的同一阶段。对数据收集进行调查后，问卷询问经理在组织内部如何定期创建竞争情报。问卷旨在识别经理依赖的收集市场信息的策略工具。\n\
  \n在实施 `BDA` 之前用于生成竞争情报的工具（见图 3）如下：\n*   `SWOT 分析`：它包含了市场、竞争对手和/或内部任何可能影响组织的信息的优势、劣势、机会和威胁。报告由营销人员准备，并每两周通过电子邮件发送给高级经理、`CEO`\
  \ 和 `VC`。\n*   `每日新闻稿`：IT 人员收集所有相关的发布新闻并每天汇总，通过 WhatsApp 群组发给相同的相关的管理团队。\n*   `反馈会议`：这有两个阶段。第一是每个分行经理与相关销售团队的会议。第二是所有高级经理与\
  \ `CEO` 和 `VC` 的会议。\n\n**图 3 用于数据收集的策略性 CI 工具。**\n\n一些经理严重依赖反馈会议来获取和收集信息；受访者 B 表示营销部门依赖\
  \ `SWOT 分析`。受访者 D 发现`每日新闻稿`比任何其他工具都有用。通过问卷谨慎地调查了情报传播。受访者 F 将其描述为“EK04 中不存在的阶段”。\n\
  \n### 4.1.2: BDA 之后\n受访者在收到第一份 `BDA` 报告（2019 年 4 月 28 日）后，被问及目前为止生成 `CI` 的工具；所有答案都忽略了\
  \ `SWOT 分析`。此外，受访者 B、C、E 和 F 声称数据收集阶段是受访者 A 的职责，而受访者 A 认为这是受访者 G 的责任。受访者 G 认为随着\
  \ `Oracle 数据管理软件` 接管这些任务，数据收集阶段已不再存在。正如受访者 G 所言，“现在不要问 CI 过程，软件正在做收集和分析的工作”。\n\n\
  `每日新闻稿`新闻像以前一样继续运行，`反馈会议`没有改变也没有重新安排；事实上，受访者 B、C、E 和 F 认为需要更多的会议来传播 `BDA` 现在提供的关键见解。\n\
  \n**图 4 情报传播过程：BDA 之前/之后。**\n\n## 4.2: BDA 在 CI 过程中的作用\n发现显示，实施 `BDA` 生成 `CI` 的价值在某些特定过程中比其他过程更高（见表\
  \ 2）。此外，不同受访者对 `BDA` 在 `CI` 过程的作用评价不同。受访者 D 和 G 都在运营部门，他们对 `BDA` 可以增强所有阶段的 `CI`\
  \ 过程表示信心。相反，代表客服部门的受访者 F 没有这种这种影响，理由是“创建情报的技术和程序通常不是客服部门的重点，我们根据与客户的互动反馈寻求解决方案”。\n\
  \n**表 2 组织部门间 CI 过程的 BDA 价值。**\n\n\n\n\n\n# 图 2 大数据分析类型\n\n## 2.5: 大数据分析\n文献中对大数据的定义已有大量的讨论。然而，只有少数研究探讨了大数据分析（BDA）对组织竞争情报的影响。尽管\
  \ BDA 可以处理结构化、半结构化和非结构化数据。\n\n## 3: 研究方法论\n\n### 3.1: 研究范围\n本文侧重于评估利用大数据源和分析的竞争情报过程性能。评估将在阿拉伯联合长酋酋阿布扎比的一家当地房地产开发商处进行，后续称为“EK04”。该机构近期采用了\
  \ `Oracle` 来实施 BDA，本文将在其首次实施 BDA 后，对竞争情报过程和性能进行首次评估。该研究计划通过提供一个结合了大数据和竞争情报的综合模型，作为一种支持决策的运营工具，以填补文献中的空白。\n\
  \n### 3.2: 研究哲学与方法\n项目采用了建构主义哲学，研究者假设现实是通过意义和理解在主体间主观地构建的，并在社交和实验中发展。遵循解释主义的哲学认识论方法，本文将寻求基于个人意图的主观和深度信息。研究的合理性源于其探索性质的研究目标，旨在获得对特定行为的深入理解。这种探索性研究通常试图弄明特定情况下发生了什么，并澄清和发展对事物如何发生更深入的理解。通过归纳推理，评估将从对大数据实施与竞争情报系统连接的详细观察开始，旨在迈向抽象的概括和陈述。此外，由于本研究旨在理解管理者的经验，预计数据强度非常高。因此，生成的知识和发现应当能够构建变量组件之间动态与韧性的刚性关系。虽然归纳法可以揭示关于关系的见解，但也可能识别出其他认知活动并发现新现象。鉴于研究工作的探索性质，选择了案例研究法，将竞争情报（CI）和\
  \ BDA 的元素作为研究设计的核心重点，并“强调与环境相关的发展因素”。\n\n### 3.3: 数据收集\n研究基于定性方法进行，通过半结构化访谈进行数据收集，以确保丰富的描述来支持研究目的。访谈将帮助研究深入理解现象的复杂性。数据收集（即访谈）以谨慎的方式进行，例如适时地停顿或提示。在\
  \ EK04 现场共进行了七场访谈，以符合研究重点，确保参与者在自然环境中感到舒适。受访者与其资历和工作领域相关的经验如 表 1 所示。\n\n#### 表 1\n\
  | 受访者 | 工作领域 | 部门 | 高级管理经验总年限 | 在 EK04 工作时长 |\n| :--- | :--- | :--- | :--- | :---\
  \ |\n| 受访者 A | 市场经理 | 市场部 | 16 | 3 |\n| 受访者 B | 分行经理 | 销售部 | 15 | 6 |\n| 受访者 C |\
  \ 财务 | 财务部 | 20 | 10 |\n| 受访者 D | 运营官 | 运营部 | 15 | 11 |\n| 受访者 E | 销售经理 | 销售部 |\
  \ 12 | 9 |\n| 受访者 F | 客服经理 | 客服部 | 14 | 10 |\n| 受访者 G | IT 经理 | 运营部 | 10 | 2 |\n\
  \n![Table 1](img/t0010_u3.png)\n\n为了确保可靠性和有效性问题，严格遵守了完整的机构伦理政策；在进行访谈之前，收集了参与者信息表以及由每位受访者填写并签署的知情同意书。该研究是纵向的，因为受访者对采用\
  \ BDA 前后的竞争情报过程都有见解，并且他们能够进行比较并提供有关决策经验的信息。\n\n### 3.4: 数据分析\n数据分析过程是系统且迭代的，为了更深入的理解并提高泛化性。最后，将出现的主题和主题与现有文献综述相结合，以探索数据分析的可能解释并为所提流程提供依据。\n\
  \n## 4: 发现\n根据七位管理者的叙述，出现了四个主题。首先，竞争情报过程在实施 BDA 后发生了变化。其次，BDA 履行了数据收集、排序、存储和分析的角色。因此（以及第三点），竞争情报社区需要更少的决策者来运行竞争情报。最后，BDA\
  \ 对描述和预测市场具有巨大影响。\n\n### 4.1: 产生竞争情报\n#### 4.1.1: BDA 之前\n\n\n\n\n\n# 竞争情报（CI）的规划与方向被视为风险委员会、CEO、四位分支经理和五位部门主管的共同责任。每周二，该群体会聚会讨论市场反馈并据此做出决策和计划。问卷结果显示，这一阶段是整合的，并被认为与信息分析处于同一阶段。通过对数据收集的调查，问卷询问了经理在组织内部如何定期创建竞争情报。问卷旨在识别经理依赖的收集市场信息的战术工具。\n\
  \n在实施大数据分析（BDA）之前，用于生成竞争情报的工具（见图 3）如下：\n\n-   **SWOT 分析**：它包含了对市场、竞争对手和/或内部任何影响组织的信息的优势、劣势、机会和威胁。报告由营销人员准备，并每两周通过电子邮件发送给高级经理、CEO\
  \ 和 VC。\n-   **每日新闻稿**：IT 人员收集所有相关的发布新闻并每日进行汇总，通过 WhatsApp 群分发给相关的管理团队。\n-   **反馈会议**：分为两个阶段。首先是每位分支经理与相关销售团队的会议；其次是所有高级经理与\
  \ CEO 和 VC 的会议。\n\n![Fig 3 用于数据收集的战术 CI 工具。](img/f16-03-9780128214428.jpg \"fig:\"\
  )\n\n一些经理严重依赖反馈会议来获取和收集信息；特别是销售部门被发现对通过定期会议收集数据更有信心。受访者 B 表示，只有从他的销售团队会议中收集信息时，信息才是可靠的。很大一部分的人相信通过\
  \ SWOT 分析收集数据。经理们认为营销部门的市场分析是一项可靠且有效的努力。值得注意的是，IT 部门对每日新闻稿的依赖程度超过了任何其他工具。受访者 D 表示：“每日报告不包含怀疑性数据，因为它们都是发布的新闻”。\n\
  \n通过问卷谨慎地调查了情报的传播。分析显示，传播始于管理层周二的周会。反馈和解决方案是这些会议的主题，决策在会议上做出并传达到所有部门。\n\n“分类和存储”信息并不是受访者所认可的阶段。受访者\
  \ F 将其描述为“EK04 中不存在的阶段”，而受访者 D 则认为管理相关信息是每位经理的责任。\n\n### 4.1.2 BDA 之后\n\n受访者被询问收到第一份\
  \ BDA 报告（2019 年 4 月 28 日）后目前用于生成 CI 的工具；所有答案都忽略了 SWOT 分析。此外，受访者 B、C、D、E 和 F 声称数据收集阶段是受访者\
  \ A 的职责，而受访者 A 认为受访者 G 的责任。受访者 G 认为，随着 `Oracle data management software` 接管这些任务，数据收集阶段已不存在。引用受访者\
  \ G 的，“现在不要问 CI 流程，软件正在根据我们提供的标准进行收集和分析工作”。\n\n每日新闻发布继续像以前一样运行，反馈会议也没有改变或重新安排；事实上，受访者\
  \ B、C、E 和 F 觉得需要更多的会议来传播 BDA 现在可以持续提供的关键洞察。\n\n值得注意的是，BDA 改变了传播过程，如图 4 所示。只有 IT\
  \ 经理和营销经理负责此。“我们共同促进了高层与整个公司之间的信息循环，”受访者 A 说道。\n\n![Fig 4 情报传播过程：BDA 之前/之后。](img/f16-03-9780128214428.jpg\
  \ \"fig:\")\n\n### 4.2 BDA 在 CI 过程中的作用\n\n受访者被询问收到第一份 BDA 报告后目前用于生成 CI 的工具。结果显示，实施\
  \ BDA 生成 CI 的价值在某些过程中高于其他过程（见表 2)）。此外，不同的受访者对 BDA 在 CI 中的作用认可不同。受访者 D 和 G 都在运营部门，他们对\
  \ BDA 可以通过所有阶段增强 CI 过程表示信心。相反，代表客户服务部门的受访者 F 未充分认可这种影响，其理由是“创建情报的技术和程序通常不是客户服务部门的重点，我们根据与客户的互动寻求解决方案”。\n\
  \n### 表 2\n| 评估组织部门内部 BDA 对 CI 过程的价值 |\n\n## 6 启示\n\n本研究关注通过 BDA 产生的可操作情报。组织必须意识到演示、运行和理解分析所需的技能和知识。因此，管理层在招聘\
  \ BD 分析师时必须谨慎，因为这些员工专门负责将准确的关键数据传输到 CI 系统。本研究发现显示，营销和 IT 经理都负责此。营销经理的丰富经验表明其对市场洞察和标准的了解，而\
  \ IT 经理拥有使用 `Oracle` 软件运行分析的技术技能。\n\n另一个启示是其他员工对现状的反馈。数据收集不应忽视任何内部或外部反馈，而应依赖 BDA。CI\
  \ 管理必须扩大数据收集范围为决策战略提供支持；战略信息系统可以被视为之一。\n\n## 7 结论\n\n数据的产生刺激了技术开发收集、存储和分析这些信息的工具。大数据分析是一个将海量数据转化为可操作洞察的新概念。一些公司已经意识到\
  \ BDA 对其竞争优势的价值创造，并开始实施 BDA 解决方案。本文调查了 BDA 对组织竞争情报的影响。规划、数据收集、分析和传播都是 BDA 实施增强的\
  \ CI 过程阶段。组织情报现在通过描述性和预测性分析得到了加强。发现强调，将 BDA 整合到 CI 过程中将产生新的反馈和决策方向结构。未来的研究可以借鉴本文的方法，并增加结合定性和定量方法的三角验证法。此外，未来的工作可以提供其他行业的见解，而不只是房地产，以加强对利用\
  \ BDA 时 CI 过程的理解。\n\n\n\n\n近期的全球趋势导致了个人数据的商品化，而绝大多数用户仍然不知道或不了解数据挖掘的后果以及个人数据泄露的影响。这一过程对全球范围内用户的生活和隐私产生了不可否认的负面影响，尽管人们对这些问题的意识正在日益增强，但其影响可能已经发展得远到无法停止。数据经纪人可以访问数十亿条个人身份信息（PII），其中大部分具有敏感性质。这些信息可以并已被用于影响个人的决策——从买什么鞋子到填写选票纸时勾选哪个框。如果普通大众对这种过程的发生毫无不知，目前还没有法律或法规可以限制数据经纪人在影响他人过程中所采取的手段。数据经纪人已经存在多年，而未来的技术（如未经过严格隐私测试的物联网和智能设备）将使数据收集过程变得更加容易。本章强调了数据经纪人在个人信息商品化中的作用，并讨论了将此类数据用于广告的过程、误用时可能产生的问题，以及消费者在没有完全意识的情况下数据泄露的问题。\n\
  \n### 关键词\n\nPII；数据经纪人；收割；隐私；数据挖掘；物联网\n\n## 1: 数据中介背景\n\n数据经纪人被描述为“一种公司或业务部门，其主要收入通过提供关于人的数据或推断获得，这些数据主要收集自数据主体以外的其他来源”（\n\
  \n### 1.1: 在线政治微定位\n\n剑桥分析丑闻在 2018 年占据了头条新闻，震惊了许多不知道自己的数据存在及其影响的人们。然而，这场丑闻确实引起了一些人的意识，通过揭露它们在影响众多全球事件（如美国总统竞选和英国脱欧公投）方面所起的作用，证明了数据经纪人究竟有多强大。剑桥分析对\
  \ 8700 万 Facebook 用户建立了非常详尽的心理画像，其中一些用户接受了特定的通信，这帮助改变了世界性事件（包括上述事件）的投票结果。那些个人信息被收割的人认为他们是在回答一个名为“这是你的数字生活”的\
  \ Facebook 应用程序，该程序据称可以判断他们的在线人格。这类应用程序在 Facebook 上非常常见。根据剑桥分析前研究总监及近期举报人克里斯托弗·莱利（Christopher\
  \ Wylie）的，这些答案被输入到一个名为 `OCEAN` 的画像工具中，该工具根据用户的“开放性”、“尽责性”、“外向性”、“易于从”和“神经质”进行分类，从而将其与其点赞和分享相关联，导致极其准确的心理画像（\n\
  \n### 1.2: 数据中介的类型\n\n数据中介分为三类：\n\n- 营销\n- 消费者信贷\n- 欺诈预防/人员搜索\n\n#### 1.2.1: 营销\n\
  \n这是最大的领域，占数据量的 50%。Facebook、Google 和 Amazon 等大型在线业务公司与数据经纪人合作，根据其年龄、位置、兴趣和家庭收入等个人资料数据，为个人定位并优化广告。广告商还将从数据经纪人处获取消费者的网络浏览历史、消费习惯以及信用卡购买记录（包括在线和店内）。超市根据从购物历史和忠诚度计划收集的海量客户数据，确切知道消费者何时可能访问、可能花费多少钱以及购买什么产品。柯克·罗根（Kirk\
  \ Grogan）在最近的 TEDx 西雅图演讲中重点强调了企业对消费者的了解程度，他说超市往往在女性自己发现之前就知道她怀孕了，纯粹是因为由于身体潜意识的渴望，她购买了与平时购买不同的产品，例如无香型手霜以及某些维生素和矿物质（\n\
  \n#### 1.2.2: 消费者信贷/欺诈预防\n\n这占数据量的 45%。知名的信誉局如 Equifax、Experian 和 TransUnion 提供信誉报告，包含信誉历史、个人银行详情、任何借款和还款债务以及任何法律判决、破产申请以及公用事业单支付等消费者支付行为。如果这些数据中有任何一项不正确，可能会导致个人在尝试获得公平负担起的信贷时面临巨大问题。一项研究显示，“每五位消费者中有一人的信贷数据存在错误”（\n\
  \n### 1.3: 人员搜索\n\n这涵盖了普通人员搜索以及政府、执法部门和健康搜索。数据经纪人为许多医疗保健提供者提供数据。一家数据经纪人称其拥有“全球销量\
  \ 85% 以上的处方”（\n\n- 遭受“心理健康问题、癌症、艾滋病/AIDS 以及数百种疾病”痛苦的人；\n- 警察的家庭地址列表；\n- 强奸受害者名单；\n\
  - 家庭暴力避难所名单；\n- 患有痴呆症的人员；\n- 表现出酒精或药物成瘾行为的人员；\n- 信用评分低的人员。\n\n所有信息都会被添加到消费者的画像中，并生成一个数值来描述许多情况，例如患上糖尿病或依赖酒精或药物的可能性。可以从\
  \ [DMDatabases.com](http://DMDatabases.com) 列表，这是一个包含超过 3 亿人的营销数据库在线来源。（\n\n![图\
  \ 1 人口统计示例。](img/f17-01-9780128214428.jpg)\n\n图 1 人口统计示例。\n\n根据 Acxiom 了解其营销产品的指南，他们从三个不同的来源收集数据——\n\
  \n对消费者行为的预测基于以下内容：\n\n- 数据经纪人拥有的关于该人的信息，\n- 预测个人违约贷款概率的信用评分，\n- 预测个人购买某种产品概率的营销评分，\n\
  - 预测特定交易为欺诈概率的欺诈评分，\n- 可能帮助机构客户管理医疗成本和风险的压力评分（\n\n由于这些数据经纪人拥有关于人的海量数据，他们是黑客的首要目标。许多数据经纪人发生过备受关注的安全漏洞，例如\
  \ Equifax（\n\n![图 2 暗网 Tor 论坛上的可下载数据转储。](img/f17-02-97801228214428.jpg)\n\n图 2 暗网\
