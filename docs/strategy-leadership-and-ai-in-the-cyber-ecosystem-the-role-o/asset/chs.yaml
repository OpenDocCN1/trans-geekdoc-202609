  \ `DW` `F` 和 `C` 见证了同一攻击，因为它们在范围内，可以通过 `DW J2` 和 `DW H1` 以不同路由安全地捕捉并交付 `DE`。`DW\
  \ J2` 和 `DW H1` 是生态系统中的已知 `DW`，由于它们是 `DW` 托管人，因此在 `OCP` 环境中拥有较高的权限。\n\n\n\n\n\n\
  `DW F` 是广为人知的并披露了其自身的 `PII`，在调查中进行进一步取证时，这些信息可以追溯到所有者。`DW C` 决定保持匿名，没有披露任何与其身份相关的属性，因此无法将其追溯到该匿名的\
  \ `DW`。所有证据都经过加密，并安全地存储在防篡的存储设备中，其中包含了 `DE` 和身份信息。\n\n### 3.11.2: 攻击 2（远程）\n\n`Fig.\
