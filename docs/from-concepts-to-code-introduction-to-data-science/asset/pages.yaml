    # 4.7.4 Protecting Identity


    Personally identifiable information (PII) and protected health information (PHI)
    such as phone numbers and social security numbers may be stored in a system. To
    preserve anonymity, this data often needs to be detected and masked. Some users
    may not have clearance to work with PII and PHI. One method for masking data is
    to replace sensitive information, such as a patient name, with random letters.


    # 4.7.5 Refined Zone


    After processing the trusted data, it is best practice to store the output into
    a separate zone. Here, I will call the refined zone. Different organizations might
    need this data differently, divide it into several zones, or place it in different
    structures.


    The data in the refined zone will likely be subjected to very specific treatment
    with different assumptions, algorithms, and so on. If all goes well, then this
    data should be very useful for solving problems. In the event of weaknesses, the
    appropriate users need to identify and improve them, backing up to the trusted
    zone and raw zone as necessary.


    The table below summarizes the data zones by their degree of processing and reliability:


    | Zone | Processing | Reliability |

    |---|---|--|

    | Refined | Highest | Highest |

    | Trusted | Moderate | Moderate |

    | Raw | None | Lowest |


