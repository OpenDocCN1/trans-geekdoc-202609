    # 4.10 Representativeness and Bias


    When we think about an object or event (subsequently called things), whether it''s
    a deck of cards, a flower, or a shuttle launch, we reduce it to some attributes
    to generate understanding. We might identify the deck of cards as because there
    are 52 pieces of identically shaped paper of certain demands, marked with a familiar
    set of colors, numbers, and patterns. But what if the cards are made of wood?
    What if there is an extra queen of hearts, or a missing queen?


    We understand things by reasoning about their data, and in the other direction,
    we can reason about data and attempt to reconstruct things. This works well when
    the data representation is sufficient, but when essential information is missing,
    there is bias. A representation of data is that it should be representative of
    the thing it seeks to represent.


    Bias is a major issue of statistics, and one reason is that sampling methods will
    infer properties from a population of interest. If the data is biased, it will
    be systematically misrepresentative of the overall population. When bias is combined
    with automation, the consequences can be disastrous.


    Here are some examples where bias can have harmful consequences:


    +   - A school district conducts an internet survey of parents to understand if
    they need somebody to afford lunch. The district is located in a rural town, where
    many residents do not have internet access.


    This is an example of selection bias, where the sample of individuals is not representative
    of the population. The risk is that the survey results may not address the needs
    of parents.


    +   - A county would like to raise additional funding by opening a large shopping
    mall. The mall would be placed on a Native American burial ground. To understand
    how residents feel about this project, a random sample is drawn and asked to participate
    in the survey. The fraction of Native Americans in the county is less than 1%
    and it happens that none of them are invited to participate.


    In this case, the minority group is very small and happens to be excluded from
    the survey. This results in sampling error since the Native Americans are not
    represented.'
