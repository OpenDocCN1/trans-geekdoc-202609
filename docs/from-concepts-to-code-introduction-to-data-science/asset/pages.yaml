- pgno: 19
  md: '# # 1 Introduction


    # ## 1.1 What Is Data Science?


    There is a great need for data scientists, but at the same time, there is also
    a great need for people to understand what the field is about. For many, data
    science is a completely unfamiliar term. Many educators and universities wonder
    how it is different from more mature fields like computer science and statistics.
    This might partly explain why some schools have data science in the computer department,
    while others might have within statistics, engineering, a school of information,
    or as a standalone school (as at UVA).


    I won''t ask for trouble by stating where data science should live at a university,
    or how it should be implemented, I do want to offer a definition of the field,
    to provide some bases for understanding.


    > *Data science is a multidisciplinary field that explores trends and relationships
    in data, and solves problems using information in data. It draws heavily from
    statistics, mathematics, and computer science.*


    Beyond these fields, data is gathered from people and other living beings and
    used to make decisions, important questions arise in ethics, law, privacy, and
    security. Business questions arise, such as what data is valuable, which algorithms
    to build, which datasets to use, and how data products can fairly serve others.
    The practice of data science touches so many areas, which makes it broad, complex,
    and exciting.


    Data science is intertwined with computer science: computations are done by computer,
    data is often stored in databases and similar structures, and algorithms are used
    to automate tasks.


    # ## 1.2 Relationships of Primary Importance


    Data science explores, identifies, and harnesses persistent relationships between
    variables. These relationships are used for explanation and prediction (referred
    to subsequently as prediction going forward; this will be clarified'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Introduction


    when the distinction is necessary). The quantity being predicted will be called
    the target variable. The variables used for prediction will be called the predictors.
    As data science has many groups of participants using specific terminology, elsewhere
    the target might also be called the response variable or dependent variable. A
    predictor might also be called an explanatory variable, independent variable,
    factor, or feature.


    # 1.3 Modeling and Uncertainty


    Many of the machine learning models in use today, such as regression models, trace
    their origins to statistics. In 1885, Sir Francis Galton introduced the idea of
    regression when he examined the relationship of fathers'' and sons'' heights [2].
    Statistics rests upon probability theory, which is a branch of mathematics.


    This leads to an important point that I want to make:


    Much of data science rests on systems and methods which are inherently uncertain.


    When predictive modeling is used, the model will make assumptions. It will take
    variables as inputs. The inputs may be subject to uncertainty in measurement and
    sampling error. For example, drawing again from the population might produce data
    with different properties and relationships. Finally, where we cannot explain
    a relationship with equations, we turn to simulation. The simulation will face
    uncertainty. This is not to say that we shouldn''t simulate, model, or do data
    science. This is to say we must do it carefully, we must understand the assumptions,
    and we need to properly test and monitor the products.


    # 1.4 Pipelines


    # 1.4.1 The Data Pipeline


    For data to be useful in a system, it often needs to be ingested, processed, and
    stored. Processing steps generally include:


    +   - Data extraction, which parses useful parts of data from volumes of ingested
    data

    - Data cleaning, such as detecting and fixing problematic values'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'Pipelines


    +   - Combining datasets to provide a more comprehensive view of the subject matter


    +   - Data transformation, such as converting units of measure and normalizing
    values


    The structure that handles this end-to-end process is called a *data pipeline*.
    To advance the idea beyond just a bluehprint for handling the data requires developing
    code..., and usually quite a lot of it. Since it can be such a heavy lift to build
    and run a reliable, efficient pipeline, specialized software applications have
    been developed for this purpose. For example, Amazon Kinesis can ingest and process
    data in real time.


    # 1.4.2 The Data Science Pipeline


    A second pipeline that in data science is the *data science pipeline*. One possible
    sequence of steps is shown in Figure 1.1, which is loosely based on the Machine
    Learning Lens of the AWS Well-Architected Framework. Movement generally flows
    from left to right, but there are many cycles the data scientist takes to build
    better models. The steps consist of clearly defining and understanding the objectives,
    determining the objectives as an analytical problem, collecting appropriate data,
    preparing the data for modeling, iteratively building and evaluating models, deploying
    the winning model, monitoring performance, communicating the results, and adjusting
    the model to meet objectives. If the model does not meet objectives, the steps
    will be repeated. As modeling proceeds, steps in the process might be repeated
    several times, such as collecting more data, preparing and exploring it, building
    additional models, and evaluating them.


    The data science pipeline is more a separate process where the purpose is to produce
    a useful model. A data scientist will typically spend a large amount of time processing
    the data, testing different predictors, evaluating the results, and analyzing
    the errors.


    ![](img/7f40a2246fd3d2d5353d109f489c4e33_21_0.png)'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# 1.5 Representation


    An essential step in preparing data for modeling and analysis is to represent
    the data in a useful form. A data representation needs to include enough detail
    to solve the problem at hand. It also requires a data structure that is compatible
    with the algorithm.


    Taking natural language as an example, we might wish to classify the sentiment
    of a review such as:


    +   * “Their bar makes a mean martini"


    To do this calculation, we need to convert the words to numbers, but what are
    the right numbers? A good representation will strike a balance where the important
    information is retained (such as the relationship between the words) and the unnecessary
    information is discarded (such as the word “Their”). This is not an easy problem
    to solve, but good solutions do exist, and the right representation is needed
    for solving the problem.


    # 1.6 For Everyone


    Data science is for everyone, done properly, it can benefit everyone. Predictive
    models are used throughout the world at all kinds of organizations, solving a
    myriad of problems. We can teach the concepts and technologies to the workforce
    of today, and our students – the workforce of tomorrow – so that they can participate
    in data science.


    I have worked with individuals who selected their career fields to avoid math
    and statistics. Later, they found themselves designing surveys, compiling the
    results, and reporting them to upper management. To their surprise and dismay,
    they were doing statistics and were unprepared. We all need to be prepared for
    data science, and we can have fun on this journey.


    # 1.7 Target Audience


    Data and data-driven decision making pervades every aspect of our daily lives.
    This book is intended to provide a valuable set of tools and an understanding
    of data literacy, analytics, and predictive modeling. The prerequisites are lightweight:
    an understanding of algebra including functions. Programming'
  merge: -1
  img_proc: true
