    # 11.3 Use and Limitations of Summary Statistics


    We have studied many variables in this section by graphing scatter plots and computing
    correlations. More generally, the two common pairs we study are predictor-target
    pairs and predictor-predictor pairs. Finding a strong relationship — direct or
    indirect — between a predictor $X_1$ and a target $Y$ is very promising as this
    suggests the predictor may be useful in a model. Now consider another predictor
    $X_2$ that has a strong, direct relationship with $X_1$. In this case, $X_2$ may
    not be useful in a model which already includes $X_1$ as the predictors are redundant
    (to some degree). A key to variable selection is to add predictors which exhibit
    a strong relationship with the target but not among themselves.


    The regression and classification models that we will cover assume linearity between
    predictors and the target. Recall that the correlation coefficient measures a
    linear relationship, and this is appropriate for models. There are several machine
    learning models that do not make a linearity assumption, such as random forests
    and gradient boosted trees. These approaches offer flexibility in using predictors
    with complex relationships. This also means that while two variables might not
    have a strong linear relationship, they might have a more complex relationship
    that can be explained by more flexible models. This highlights the notion of using
    the right statistic for'
