- pgno: 344
  md: '# Model Benchmarking


    The term *benchmarking* in model validation refers to comparing the model under
    consideration to an alternative model or metric. The benchmark model is generally
    a model with minimal complexity, which could have been developed with less effort.
    In fact, the supervised models that we have studied, linear regression and logistic
    regression, are good benchmark models. If we are validating a more complex model
    like a neural network, it would make sense to see how its performance compares
    to the appropriate regression model.


    Sometimes very simple heuristics are available for benchmarking. A common question
    is to ask if “is better than a coin flip? That is, say on a True/False question.
    A model with 50% chance of guessing correctly (say in this case would need to
    have accuracy better than 50%. One of the most prognosticators of all time, Punsutsawney
    Phil, is a we who uses shadow to predict whether we will get an extension. From
    the National Weather Service [47], it appears he has about 40% of the time. This
    suggests his accuracy is better than a coin flip, and we would do better by flipping
    his prediction.


    Let’s think about some benefits benchmark model can provide. First, it is possible
    that the performance of a benchmark model is similar or better than a more complex
    model. In this case, the benchmark model might be promoted as the *champion model*
    in production. Second, the benchmark model can be used as a sanity check and to
    validate different inputs given the same input and they produce vastly different
    output. This provides the opportunity for research. The analyst might be able
    to explain this difference based on the different inputs, which might find a bug
    in the code. In either case, diving deeper should provide a better understanding.


    Table 17.2 repeats the $m_1$ out-of-sample test results from a benchmark model
    $m_{bn}$. The benchmark model is a simple linear regression, where $m_1$ has greater
    complexity. For each observation, the prediction from $m_{bn}$ is closer to the
    actual value. Additionally, the RMSE is smaller for $m_{bn}$ (0.03) than $m_1$
    (0.15). This provides evidence that $m_{bn}$ is the more accurate model. If the
    pattern holds for a larger sample of observations, this would indicate that the
    more complex model is not warranted.'
  merge: -1
  img_proc: true
