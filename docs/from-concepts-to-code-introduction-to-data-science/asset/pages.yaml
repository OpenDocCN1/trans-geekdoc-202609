    Illegal, disparate treatment occurs when a lender bases its decision on one or
    more discriminatory factors covered by fair lending laws. For example, a bank
    using a lending process where females are offered an auto loan with a higher interest
    rate than males would be a violation of fair lending laws.


    In finance, banks and other lenders typically use machine learning models to make
    lending decisions. The underwriting decision may use a logistic regression model.
    Given approval, the pricing decision may use a linear regression model.


    The model predictors should capture the ability and willingness of borrowers to
    repay the loan. The predictors should not use protected class information, as
    this can discriminate and promote unfair lending.


