- pgno: 43
  md: '# A Questionnaire for Defining the Objectives


    Q4: How good does predictive performance need to be, and what are the important
    metrics?


    If the work is for a customer, they might already have a model and a performance
    benchmark in mind. They might say that their current model has an area under the
    ROC curve of 80%, and the new model needs to at exceed this threshold. Conversely,
    the customer might not have metrics in mind, and you might need to educate them.
    It can be difficult to get firm numbers, and I encourage you to push for them
    and discuss different metrics to clarity.


    Q5: Is there a system for running and monitoring models in production?


    A member of the engineering team should be able to answer this question. Assuming
    the model meets the performance objectives, the next step will be to deploy it
    into production. For this to happen, needs to be a reliable system to support
    data ingestion and processing, model scoring, and passing results to users. Model
    scoring, or *inference*, is the process of running new data through the model
    to get predictions. Passing results to users is typically done with an *application
    programming interface*, or API.


    Details to include how quickly results need to be returned (*response time*),
    how available the system needs to be (*uptime*), and where the data and results
    will be stored. A system required for real-time scoring will need high uptime
    and low latency, while a system returning batches of results won''t have these
    requirements.


    > Tip: Response time is the elapsed time from the request is made to when the
    client receives the first byte of the response.


    Uptime is the percentage of time that the system is available and working properly.
    It is usually expressed in 99''s, as in “six nines” for 99.999%. This translates
    to less than 32 seconds of downtime per year.


    If a system is not available, then the discussion can include how a system might
    be provided. There are several cloud providers offering low-cost, readily available
    services including AWS, Google Cloud, and Databricks.


    Q6: Is there sensitive information in the data?


    If there is sensitive information in the data, then additional steps and extra
    care will be required. For example, the data might need to be stored and prepared
    on a specific machine for conducting the work. Parts of the data might need to
    be masked before colleagues can view it. The owner of the data should be able
    to answer this question.


    Q7: Does the model need to be interpretable?'
