    into files. We briefly saw examples using the requests and Beautiful modules.
    Anaconda has many essential modules pre-installed, and it is straightforward to
    install many others by running the command pip install [package_name], where [package_name]
    is the package name. We will review these applications later in this chapter.


    To use an installed module, the import statement needs to be run. It is possible
    to import the module or only the required parts, such as specific functions. For
    example, the os module for operating system functionality can be imported by running
    this command:


    ```

    import os

