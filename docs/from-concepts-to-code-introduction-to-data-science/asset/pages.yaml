- pgno: 337
  md: '# 17

    Model Risk


    We dedicated a good amount of study to collecting data, setting up models, fitting
    the parameters to data, and interpreting results. What can go wrong?

    A lot, it turns out. Let''s begin with a definition of model risk from the Board

    of Governors of the Federal Reserve System’s Guidance on Model Risk Man-agement.


    The use of models invariably presents model risk, which is the potential for ad-verse
    consequences from decisions based on incorrect or misused model outputs\and reports.


    For the full report, visit:


    https://www.federalreserve.gov/supervisionreg/srlletters/sr1107.htm


    We can think about the entire process as the model. In this way, we consider not
    only the risk from, say, a mathematical or statistical model, but also the

    risk from the systems running the model and the input data. Each of these

    components can also introduce risk that needs to be managed.


    Some divisions or entire companies make decisions based on models run-ning production.
    Incorrect predictions can lead to poor decision making and

    financial loss. Biased data and models can cause reputational damage and-

    semantic harm to individuals. Copyright infringement can lead to lawsuits from

    content owners. An enlightening book replete with hard-hitting case studies

    on model risk is Weapons of Math Destruction [46].


    Some companies never recover from bad models. One doesn''t need to

    search for very long to find the news about problematic models that-

    tnled to financial meltdowns, disparate treatment, legal risk, and reputa-tional
    damage. Here are some examples:


    +   Long-Term Capital Management was a hedge fund founded in 1994 which

    had a strong start and high-profile leadership. When markets moved against

    their quantitative strategy and massive leverage, the firm faced multibillion

    dollar losses and a collapse.'
  merge: -1
  img_proc: true
- pgno: 338
  md: 'Zillow used predictive models to fuel the purchase and flipping of homes in
    their Zillow Offers program. During the COVID pandemic, their predictions were
    highly inaccurate, leading to losses in excess of $400 million and a 25% reduction
    in staff.


    Stability AI developed a model to create images from a text description. The firm
    is currently embroiled in a lawsuit with Getty Images, which claims that Stability
    AI unfairly scraped millions of images from its site. Getty Images believes that
    Stability AI used these images in training its model.


    The purpose of this chapter is not to scare the reader away from data science,
    of course, but to bring awareness of what can go wrong and how to prevent it.
    I spent the early part of my career building models for investment banks and asset
    managers as a Quant. One of my roles a bit later was in model validation, where
    I examined, tested, and challenged an array of models for major commercial bank.
    My group was independent from model development, mandated by the federal government,
    and designed to provide another effective line of defense against model risk.
    The work that my team gave me made me a better model developer. It opened my eyes
    to the ''gotchas'' hidden in models, such as predictors that might lead to unfair
    treatment, assumptions that might not hold up in practice, and patterns that vanish.


    Model validation is an essential function that is not restricted to banks or the
    financial sector. Anywhere that a model is used, it introduces risk that needs
    to be measured and managed. The person doing this work must review the model carefully
    ensure proper use, correct design and logic, proper data handling, robust performance
    measurement and testing, and complete documentation. From the standpoint of a
    model developer, while validation introduces extra work, it brings the benefit
    of a fresh perspective. An effective validation will challenge the model and likely
    strengthen it.


    # 17.1 Model Documentation


    Model documentation is essential for communicating information about the development
    process, the analysis conducted, and the decisions made. The model developer should
    create create a *model development document* or devdoc to capture the important
    elements in the process including:


    +   - Model purpose


    +   - Names and titles of stakeholder


    +   - Data assumptions and limitations'
