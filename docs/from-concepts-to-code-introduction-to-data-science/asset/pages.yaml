    # 14.3 Chapter Summary


    Logistic regression can be a useful supervised learning approach when the target
    variable is binary. It assumes that a linear combination of predictors is linearly
    related to the log of odds of an event. To estimate the parameters, we worked
    with the log-likelihood of the estimate and applied the gradient descent algorithm.
    Gradient descent works by iteratively moving the parameter estimates in a direction
    which is expected to be optimal. Many machine learning models variants of gradient
    descent, including deep neural networks.


    We considered a dataset of tumors which were either benign or malignant. We used
    this case for logistic regression, and we fit the model using sklearn. We also
    verified the parameter estimates using gradient descent, and they matched our
    learning rate and number of iterations. We measured model performance using binary
    classification metrics. As the model outputs probabilities, the predicted label
    is determined by applying a threshold to the probabilities. We learned that varying
    the threshold will produce different performance metrics.


    In this chapter and the previous chapter, we studied models that are useful when
    the data is labeled. Oftentimes, data is not labeled, and unsupervised methods
    will be valuable. In the next chapter, we will study an algorithm that is useful
