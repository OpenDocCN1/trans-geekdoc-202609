    # 10.4.3 Additional Common Transformations


    There is a wide range of other transformations which may be helpful for engineering
    useful predictors. The context of the problem can help guide transformation use.
    The small table below provides some examples.


    | Transformation | Example |

    |---|---|

    | Ratio of variables | Assets to liabilities |

    | Difference of variables | Long-term minus short-term interest rate |

    | Lagged variable | Last month medication dose |

    | Cumulative sum of variable | Total study time |

    | Power of a variable | Square of time |


    # 10.4.4 Storing Transformed Data


    Creating transformed data can be time consuming. Similar to how the cleaned data
    was stored, it will be beneficial to store the transformed data to avoid reconstructing
    it. If other permitted users might find the data useful, then providing access
    and documentation is recommended. A feature store is dedicated storage for such
    data. Some cloud applications, such as Amazon SageMaker, provide this functionality
    for making features reusable and easily accessible to permitted users.


    # 10.5 Chapter Summary


    Raw data will generally need to be transformed before it can be useful. Data may
    be noisy, and we discussed smoothing with a moving average. Extreme values, sometimes
    originate from noise, can be removed by winsorizing and trimming. Care should
    be taken when removing outliers.


    Variables are often more useful when they are scaled. It is difficult to visualize
    that changes in magnitude. Comparing variables of magnitudes, or using them in
    algorithms that measure distance, leads to incorrect conclusions. We studied transformations
    to handle scale, such as using of the logarithm, standardization, and normalization.
    When deciding between standardization and normalization, the former is recommended
    when the data is normally distributed. Normalization will squeeze data into a
    range such as [0, 1], which removes outliers and symmetry.'
