    \nNext, we need to determine the parameter estimate $\beta_1$. We take the partial\
    \ derivative of $S$ with respect to $\beta_1$ and set equal to zero:\n\n```\n\
    $$\\frac{\\partial S_{res}(\beta)}{\\partial \\beta_1} = \\sum_{i=1}^n (-2x_iy_i\
    \ + 2\\beta_0x_i + 2\\beta_1x_i^2)$\n$$0 = \\sum_{i=1}^n (-x_iy_i + \\beta_0x_i\
    \ + \\beta_1x_i^2) \\quad \\text{(dividing by 2)}$$\n$$0 = \\sum_{i=1}^n (-x_iy_i\
    \ + (\tilde{y}-\\hat{\beta}_0)x_i + \\beta_1x_i^2) \\quad \\text{(substituting\
    \ for $\\hat{\beta}_0)}$$\n$$0 = -\\sum_{i=1}^n x_iy_i + \\sum_{i=1}^n x_i\\tilde{y}\
    \ - \\hat{\beta}_0\\sum_{i=1}^n x_i + \\hat{\beta}_1\\sum_{i=1}^n x_i^2 \\quad\
    \ \\text{(applying sums)}$$\n$$0 = -\\sum_{i=1}^n x_i(y_i-\\tilde{y}) + \\hat{\b\
    eta}_1\\sum_{i=1}^n x_i(x_i-\\tilde{x}) \\quad \\text{(grouping terms)}$$\n```\n\
    \nSolve for the parameter estimate $\\hat{\beta}_1$:\n\n```\n$$\\hat{\beta}_1\
    \ = \\frac{\\sum_{i=1}^n x_i(y_i-\\tilde{y})}{\\sum_{i=1}^n x_i(x_i-\\tilde{x})}$$$\n\
    ```\n\nThis is equivalent to the common equation for $\beta_1$, which is left\
    \ as an exercise:\n\n```\n$$\\hat{\beta}_1 = \\frac{\\sum_{i=1}^n x_i(y_i-\\tilde{y})}{\\\
    sum_{i=1}^n x_i(x_i-\\tilde{x})^2}$$$\n```\n\nWe have now seen how to derive the\
    \ simple linear regression estimates using differential calculus. This is done\
    \ in software, but it is a valuable exercise nonetheless. For the more general\
    \ case, we can use matrices. This will handle the simple linear regression case\
    \ that we just completed, as well as the multiple linear regression case. This\
    \ involves creating:\n\n+   A design matrix $X$ which holds the predictor data.\
    \ The $n$ rows represent the observations and the $p+1$ columns represent the\
    \ intercept term (in the first column) and the $p$ predictors in the remaining\
    \ columns. For example, element $x_{12}$ is the value of predictor 2 for observation\
    \ 1."
