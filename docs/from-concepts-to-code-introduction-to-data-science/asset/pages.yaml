    Computer vision is being used to detect objects of interest in images and videos.
    The models can provide a list of found items, their locations, and attributes
    about them. For example, a model might indicate that an adult and child are in
    a photo, that the adult is wearing glasses, and the child has her eyes closed.
    A model might flag an unexpected person taking an exam as an indicator of potential
    cheating. A traffic signal might count the number of vehicles at a bus intersection
    to help reduce congestion and increase safety. The potential applications of this
    technology are massive. The extracted information can be stored with the underlying
    data as metadata and tags. The enriched dataset can be used to improve search
    and recommendation.


    # Natural Language Processing and Understanding


    One of the earliest language models, called the bag of words model, use the count
    of each word in a document to provide information about the document. An article
    containing several mentions of the word "football" might be classified as an article
    about sports. For a more robust understanding of the text, the context of each
    word needs to be incorporated. One of the challenges for a language model is understanding
    the relationship between far-apart words or phrases in the text. For example,
    consider this:


    > "Jacqui loved visiting Barcelona. She enjoyed the way that flamenco guitarists
    would play music in the streets. Yesterday, when I asked what she would like to
    do next summer, she mentioned how much she would like to go back there."


    If we asked a bag of words model to identify the meaning of there, it would not
    be able to make the connection to Barcelona.


    More advanced models build an understanding of context with objects called embeddings.
    Several decades of work have led to state-of-the-art transformer models consisting
    of stacks of processing modules. The leading models currently use hundreds of
    billions of parameters and can accomplish several language tasks including language
    translation, text summarization, and detection of entities of interest.


    # Speech Recognition


    Speech-to-text recognition services support the recognition and translation of
    spoken language into text. Personal assistants such as Siri and Alexa recognize
    users'' voices, process the speech, and provide personalized responses. The technology
    behind speech recognition is deep learning models that process sequences of text.
    Challenges include the understanding of diverse accents and dialects.'
