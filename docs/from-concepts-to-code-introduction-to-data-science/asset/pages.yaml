  md: '# 9 Statistics Preliminaries


    To save on resources (time, money, etc.) we draw samples of data from a population
    of size $N$. A statistic is a quantity computed from a data sample. The hope is
    that the statistic is representative of the population. As data science is grounded
    in the collection and analysis of data samples, we have a great need to work with
    statistics. This section will provide a summary of descriptive statistics and
    inferential statistics. Descriptive statistics are useful for understanding properties
    of a data sample. Inferential statistics allow for drawing conclusions about a
    population based on a sample. A common question in inference, for example, is
    whether a predictor''s coefficient is significantly different from zero; if so,
    this indicates that the predictor is important.


    # 9.1 Descriptive Statistics


    Our samples will be drawn from random variables which may be discrete or continuous.
    Each variable may take a single value at one extreme to an unbelievably large
    number of values at the other extreme. As the sample size grows, it becomes impossible
    to look at all of the data and understand its distribution. Computing statistics
    will help in summarizing this data, and we outline different statistics in what
    follows.


    # Frequency Count


    For data with low cardinality (say below 50 unique levels), we can count the number
    of times each value is taken. These occurrences can be called frequency counts
    or simply counts. It is also useful to calculate the percentage of times each
    value is taken. The values with their percentages are then equivalent to the probability
    mass function. For example, given observed data $S = (1, 1, 1, 2, 3, 5000)$, the
    values and associated counts are $F = (1 : 3, 2 : 1, 3 : 1, 5000 : 1)$. The values,
    counts, and percentages can be assembled in a table like this:'
