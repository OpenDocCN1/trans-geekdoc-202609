    Bash is a Unix shell and command-line interface (CLI). It is a powerful, efficient
    tool for working with files. We will learn more about the shell and the CLI in
    Chapter 5: Computer Preliminaries.


    Specific data processing steps include:


    +   - Segmenting the data into parts, such as breaking paragraphs into sentences,
    ECG waves into heartbeats, and comma-separated rows into columns

    - Repairing foreign language characters which are transcribed incorrectly

    - Verifying data by applying rules and logic, such as flagging rows of data containing
    an unexpected number of columns

    - Detecting values that fall outside a predefined range


    # 4.7.1 Trusted Zone


    After the raw data is processed, the output data might be stored into a different
    zone on one or more computers. Different organizations might name the zones differently;
    we will call this the *trusted zone*. Concretely, there might be a folder containing
    the raw data files, and a separate folder containing the trusted data files.'
