    S3 (Simple Storage Service), Azure Data Lake, and Google Cloud Storage.


    While it is to quickly ingest, store, and centralize all manner of data in the
    data lake, a new problem arises: the lake can become polluted with improper and
    incorrect data. The popular term for this phenomenon is the data becoming a data
    swamp. The fear is that the data swamp will render the data lake less useful,
    and this is a real concern.


    # 7.5.3 Data Lakehouse


    The data lakehouse is a hybrid of a data lake and a data warehouse. It offers
    a centralized data store for any of data structure with the ability to use tabular
    forms as needed. In this way, users can impose structure on segments of the data
    lake, leveraging the strength of a data warehouse. This helps to minimize the
    risk of the data lake becoming a swamp.


    In addition to the data lake scaling well to a variety of datasets, a robust offering
    provides functionality for building a data catalog. This allows users to easily
    browse datasets, which can improve projects and encourage new ones. Finally, administrators
    can manage access to users, which promotes secure, efficient data sharing.


    The data lakehouse is frequently evangelized as the modern data architecture.
    Several cloud providers offer commercial data lakehouse products, including Databricks
    and AWS.


    # 7.6 Chapter Summary


    A database supports the creation, retrieval, updating, and deletion of data, or
    the CRUD operations. Relational databases can be used to separate concepts into
    tables to maximize efficiency and minimize duplication. The tables can be joined
    to bring data together. SQL is used to work with relational databases. Relational
    database systems (RDBMS) are on the market, and some are freely available. Non-relational
    databases, or NoSQL databases, support semi-structured and unstructured data.


    A table consists of rows and columns. Rows are also called records and tuples,
    while columns are also called attributes and fields. The primary key is the unique
    identifier for telling records apart; it may consist of multiple fields. A foreign
    key is a field in one table that references the primary key in another table.'
