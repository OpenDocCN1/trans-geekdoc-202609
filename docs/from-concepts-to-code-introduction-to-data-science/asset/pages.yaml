    In this case, the slope gets steeper when $x$ exceeds $c$. Linear regression would
    not handle this relationship properly, but a tree-based model could learn the
    non-linear pattern from the data and use branching as needed.


    Regression models require the user to determine the best set of predictors.$1$
    Tree-based models use imputation to automatically determine useful predictors,
    the most important predictors higher in the tree. Predictors that aren''t sufficiently
    helpful for increasing explanatory power are dropped from the model. For a large
    set of potential predictors, this can save a lot of time.


    Regression require imputation of missing values. For some implementations of tree-based
    models, missing values are treated as a separate level for each predictor. In
    doing this, imputation is not necessary in the tree-based model.


    A challenge introduced by tree-based models is that interpretation is less clear
    compared to linear and logistic regression models. This is primarily because treebased
    models combine output from multiple trees when making a prediction. There are
    specialized methods for measuring the importance of predictors in these models,
    but they are still more challenging to understand than the parameter estimates
    in a regression model.


    # 18.3.2 Artificial Neural Networks


    Artificial neural networks, simply called neural networks, when there is no risk
    of confusion with biological neural networks, were first developed in the 1950s
    and have seen a resurgence in the last several decades. Many of today''s state-of-the-art
    models are based on customized neural networks. We will learn about some of their
    cases later and see an overview of their architecture.


    The building blocks of neural networks are weights, and biases. The nodes are
    arranged in layers, beginning with an *input layer*, followed by one or more hidden
    layers, and finally an *output layer*. Figure 18.2 shows a small illustration
    of a neural network with one hidden layer. The input layer takes the predictors
    as input, and there is one node per predictor. The number of hidden layers and
    nodes per hidden layer are hyperparameters to be decided through tuning. Each
    hidden layer may have a different number of nodes. Neural networks with more than
    one hidden layer are called *deep neural networks* (DNNs). The subfield of machine
    learning that uses DNNs is called *deep learning*. The number of nodes in the
    output layer will match the task. If the purpose of the model is to predict a
