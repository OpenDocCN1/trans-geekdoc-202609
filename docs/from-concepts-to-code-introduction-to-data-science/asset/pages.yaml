  md: '# Houses, Lakes, and Lake Houses


    # 7.5.1 Data Warehouse


    Data warehouse is a central place for data storage. It integrates data from one
    or more sources, which may include transactional systems and relational databases.
    The implications are that data is copied, and processes are required for preparing
    and storing the data. The data warehouse stores structured data. The ETL processes
    generally extract data, transforming it, and loading into the warehouse generally
    runs on a regular schedule.


    The purpose of the data warehouse is to allow for enterprise-wide reporting, ad
    hoc queries, data analysis, and decision making. This is a key function in business
    intelligence (BI). A business analyst will use SQL heavily. BI and data science
    teams have different managers and the participants are on separate teams, can
    be fruitful interaction. In particular, BI teams are highly knowledgeable about
    the availability, lineage, and readability of the datasets. The right datasets
    can enable broad analyses, calculating the profitability across all lines of business.


    Several commercial, cloud-based data warehouses exist on the market, such as Amazon
    Redshift, Google BigQuery, and Snowflake. Working in these systems is similar
    to working in RDBMS user interface. Panes are available for essential functions
    like browsing objects (e.g., tables and views), working with SQL code, and reviewing
    result sets.


    # 7.5.2 Data Lake


    Given the variety of modern data sources and formats, a storage solution is needed
    for semi-structured and unstructured data. For some files like videos, the data
    cannot be stored in lakes. For other files like documents, it may be preferable
    to store the data in its native format first and figure out a proper schema later.
    This is because it can take a lot of time to understand the implicit pieces of
    data and their relationships to one another. Finally, even if a schema is specified,
    it might be evident, and a tabular format might not be the best structure. When
    the schema upfront is too strict a requirement for some data.


    The data lake allows for storing data in a variety of formats without defining
    a schema. Like the warehouse, the data lake can be used as a central place for
    storage. Unlike the warehouse, ETL jobs are not needed for extracting and preparing
    the data for the lake. For data that is cleaned and prepared in the data lake,
    it can be stored in distinct zones for easy identification and retrieval (think
    of these as separate folders).


    Some of the early lakes were built by companies and managed on-premise. This required
    a team of IT specialists to manage software, hardware, climate control, and so
    forth. As the stockpile of data outg the on-premise servers, new, costly machines
    needed to be added. In short, it was a resource-intensive endeavor that didn''t
    scale well and often didn''t align with the value proposition of the organization
    (e.g., does a pharmaceutical'
