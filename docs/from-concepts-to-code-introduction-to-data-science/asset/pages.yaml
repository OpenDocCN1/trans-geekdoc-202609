- pgno: 1
  md: '# From Concepts to Code


    The breadth of problems that can be solved with data science is astonishing, and
    this book provides the required tools and skills to a broad audience. The reader
    takes a journey into the forms, uses, and abuses of data and models, and learns
    how to critically examine each step. Python coding and data analysis skills are
    built from the ground up, no prior coding experience assumed. The necessary background
    in computer science, mathematics, and statistics is provided in an approachable
    manner.


    Each step of the machine learning lifecycle is discussed, from business objective
    planning to monitoring a model in production. This end-to-end approach necessary
    to sidestep many of the pitfalls that can sink a data science project. Detailed
    examples are provided from a wide range of applications and fields, from fraud
    detection in banking to breast cancer classification in healthcare. The reader
    will learn the techniques to accomplish tasks that include predicting outcomes,
    explaining observations, and detecting patterns. Improper use of data and models
    can introduce unwanted effects and damages to society. A chapter on model risk
    provides a framework for comprehensively challenging a model and mitigating weaknesses.
    When data is collected, stored, and used, it may misrepresent reality and introduce
    bias. Strategies for addressing bias From Introduction to Data Science leverages
    developed by the author for a full-year data science course suitable for advanced
    high school or undergraduate students. This course is freely available and includes
    weekly lesson plans.


    Adam P. Tashman has been working in data science for more than 20 years. He is
    an associate professor of data science at the University of Virginia School of
    Data Science. He is currently Director of the Capstone program, and he was formerly
    Director of the Master’s of Data Science program. He is the School of Data Science
    Capital One for the 2023–2024 academic year. Dr. Tashman won multiple awards from
    Amazon Web Services, where he advised education and government technology companies
    on best practices in machine learning and artificial intelligence. He lives in
    Charlottesville, VA with his wonderful wife Elle and daughter Callie.'
