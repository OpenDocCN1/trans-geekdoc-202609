  md: "# Statistics Preliminaries\n\nstate $H_0$ and $H_A$ for a given parameter.$^2$\
    \ We set a significance level $\\alpha$ and a sample size $n$. A statistic is\
    \ selected to estimate the value of the parameter. Then given the data, the test\
    \ statistic is computed. For a large sample, the test statistic will have an approximate\
    \ normal distribution after standardization. The p-value can be computed and compared\
    \ against $\\alpha$. If the p-value is less than $\\alpha$, then $H_0$ is rejected,\
    \ the probability of making a Type I error is sufficiently small. If the p-value\
    \ is greater than or equal to $\\alpha$, then we fail to reject $H_0$.\n\n# 9.21\
    \ One-Sample Test of the Mean\n\nNext, we will conduct a specific test on the\
    \ population mean $\\mu$. The hypothesis test will look like this:\n\n```\n$H_0\
    \ : \\mu = \\mu_0$\n$H_A : \\mu \neq \\mu_0$\n```\n\nGiven the alternative hypothesis,\
    \ this is a two-tailed test where we must consider the parameter taking a value\
    \ less than $\\mu_0$ or greater than $\\mu_0$. We compute the p-value, we calculate\
    \ the probability of a test statistic taking its or more extreme in direction.\
    \ For example, if the test $t=-1$, the p-value is the probability that $t < -1$\
    \ or $t > 1$ which is true. $P(|t| > 1)$.\n\nThe sample mean $\bar{X}$ is used\
    \ to estimate $\\mu$. As its distribution will depend on the sample size $n$,\
    \ we denote this random variable as $X_n$. The central limit theorem makes this\
    \ statement about the sampling distribution of the mean:\n\nAs $n \\to \\infty$,\n\
    \n```\n$\\sqrt{n}\\frac{X_n - \\mu}{\\sigma}\\to \\mathcal{N}(0,1)$\n```\n\nBefore\
    \ standardization, this says that as $n$ increases, $X_n$ is normally distributed\
    \ with mean $\\mu$ and standard deviation $\\sigma/\\sqrt{n}$. The quantity $\\\
    sigma/\\sqrt{n}$ is called the *standard error (SE)* of the sample mean. In general,\
    \ the SE of a statistic is the standard deviation of its sampling distribution.\
    \ As the sample size increases, the standard error decreases, with $X_n$ approaching\
    \ the population mean $\\mu$.\n\nOne complication is that we generally won't know\
    \ the population standard deviation $\\sigma$. In such a case, we can replace\
    \ it with the sample standard deviation $s$. Now let's look at the quantity\n\n\
    ```\n$\\frac{\bar{X}_n - \\mu}{s}$\n```\n\n> $^2$It is also possible to test functions\
    \ of multiple parameters, such as the difference $\\theta_1 - \\theta_2$."
