  md: "In this case, there were 3 false negatives where the actual label was P\nthe\
    \ predicted label was N. The diagonal of the table holds the correct counts\n\
    (85+7), while the errors appear on the off diagonal (3+5). The accuracy can\n\
    be computed as:\n\n```\naccuracy = \\frac{TP + TN}{TP + FP + TN + FN}\n```\n\n\
    For this example, accuracy = (85+7)/(85+7+3+5) = 0.92.\n\nNext, let's discuss\
    \ recall and precision. Recall is the fraction of true positives\n are predicted\
    \ as positive. It measures how the classifier is detecting\nactual positives.\
    \ The trouble is that a model can always predict positive\nand attain recall.\
    \ As a counterbalance, we can use a second metric.\n\nPrecision is the fraction\
    \ of predicted positives that are correct. It measures\nt accuracy of positive\
    \ predictions. The trouble here is that the classifier\nmake positive predictions\
    \ only when it is very confident, attaining high\nprecision. However, it would\
    \ then miss of the actual positives, resulting in\nlow recall. For a classifier\
    \ seeking, it has high precision and high\nrecall. When it predicts the positive\
    \ label, it needs to be accurate (precision),\nand also needs to identify the\
    \ positive cases (recall). Precision and recall\ncan be calculated as follows:\n\
    \n```\nprecision = \\frac{TP}{TP + FP}\n```\n\n```\nrecall = \\frac{TP}{TP + FN}\n\
    ```\n\nFor our example, precision = 85/(85+5) = 0.944 and recall = 85/(85+3) =\
    \ 0.966.\n\nThe last metric we will discuss here is the F1 score (F1), which is\
    \ the harmonic\nmean of precision and recall:\n\n```\nF_1 = 2 \\times \\frac{precision\
    \ \\times recall}{precision + recall}\n```\n\nAs a single number combining recall\
    \ and precision, the F1 score is very popular\nand effective for binary classifier\
    \ evaluation. Additionally, the harmonic mean\nis more punitive than the arithmetic\
    \ mean, which results in a conservative\nmetric. As an example, for a classifier\
    \ with recall=0.2 and precision=1.0, the\narithmetic mean is 0.6, while the harmonic\
    \ mean is 0.333.\n\nThe sklearn module provides functions for computing regression\
    \ and binary\nclassifier metrics. However, it is very valuable to understand what\
    \ they\nmean so they can be used and interpreted appropriately."
