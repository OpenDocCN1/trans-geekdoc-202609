  md: '# Exercises


    Data can be represented in different ways, and the representation used will change
    its utility. Text data cannot be directly used by a model; it needs to be converted
    to a quantitative form. We studied the count vectorizer, which can be used to
    represent a set of documents as a term-document matrix. One-hot encoding can convert
    categorical data to a vector indicating the variable''s level. Some transformations,
    such as binarization, work by accentuating certain parts of the data. Discretization
    converts a continuous variable into discrete buckets, which sometimes yields a
    powerful predictor.


    It takes experimentation to discover the best predictors. Once they are, it is
    useful to save the code and save the predictors. Transforming data can be resource
    intensive it is best not to repeat valuable work. Additionally, the transformed
    data can be used by others when helpful.


    The sklearn module has functions that make data transformation easier, and we
    reviewed small examples. Additional resources on data transformation can be found
    in the course repo in this folder:


    semester1/week09_10_transform


    It is helpful to be a “collector” of transforms, and this can be done by looking
    on the web and else to find interesting and useful approaches. In the next chapter,
    we will learn techniques and tools for exploratory data analysis. This will allow
    us to investigate the cleaned and transformed data.


