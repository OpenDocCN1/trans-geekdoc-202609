    +   1. The correlation between a predictor $X$ and target $Y$ cannot tell us whether
    $X$ caused $Y$. This is particularly true in observational data, which is not
    collected under the control of a researcher. A positive correlation indicates
    that an increase in $X$ is associated with an increase in $Y$, but we cannot confirm
