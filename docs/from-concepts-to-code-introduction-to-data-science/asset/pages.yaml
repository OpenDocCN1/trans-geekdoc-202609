- pgno: 29
  md: '# Know Your Audience


    critically. For example, he might realize that a column of numbers should sum
    to one. Great managers and leaders can do this, so it''s best to be careful and
    thoughtful. As you do the simple things properly, you will be trusted to do harder.


    A great scientist needs to be a thoughtful "trail guide." Like any technical field,
    data science uses abstractions, assumptions, complex ideas, and jargon. Data and
    models have limitations and weaknesses that may render your careful analysis useless.
    To earn trust, make everything clear to your audience. Statistics and limitations
    import upon. Explain why the approach is used in spite of the assumptions and
    limitations. Add a key for acronyms, define variables, explain the metrics. Are
    you summarizing customer satisfaction with a scale of 1-10? Explain how this is
    measured. If possible, test the assumptions and impact, and try things in different
    ways.


    When we review the work of others, we tend to look for logical fallacies. Methodology
    issues early in a presentation can quickly eradicate the interest of the audience.
    "Wait... this dataset is missing a key group of individuals. In that case, including
    them in this analysis." When sharing our work, it is ideal to avoid making errors,
    and to anticipate tough questions by the work. An effective strategy that Amazon
    uses when developing a new product is to write a PR/FAQ, which is a combined press
    release and question/answer section thinks around corners and gets ahead of reader
    questions and objectives.


    # 2.3 Know Your Audience


    As an advisor and consultant, I work with customers to conceptualize, plan, and
    implement applications of AI and machine learning. This includes working with
    their leadership to prioritize initiatives, plan a detailed proof of concept (POC),
    help with implementation, and report out the findings. From project to finish,
    the audiences will change and I need to be thoughtful on how to lead discussions.
    As a technical person, I need to avoid my temptation to talk about deep networks
    with a CEO, for example. I need to "know my audience," so let''s get to know them
    a bit.


    My meetings with the leadership team may include the CEO, the Chief Officer, and
    the VP engineering. In these discussions, the focus will be at a strategic level:
    it is not about fighting fires to solve a small, immediate problem. We talk about
    things that can have a large impact on the business, such as creating a new product.
    If we discuss a metric, it will most often be return on investment (ROI), which
    reflects expected revenue and capital investment. The questions are focused on
    what should be done, and not how it should be done. Of course, machine learning
    is part of the how,'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'but we won''t get into these details with this group. First, this is likely
    not the right team to answer the *how*, and second, it is generally more effective
    to brainstorm and think through the *how* later.


    After identifying the right project, I will back a technical team that has knowledge
    of the data and process. This might include an engineering manager and a data
    science manager, as well as lead data scientists and data engineers. At this level,
    we can talk about the *how* in detail, such as nuances in the data, the strengths
    and weaknesses of various models, and performance metrics. Not every technical
    team has scientists, and I will need to explain things properly and educate each
    group as needed.


    After the POC is completed I will report back to leadership, and the technical
    leaders will join this discussion. At this point, I have an understanding of the
    problem we are trying to solve, the approach taken in the POC, and the results
    of our efforts. It is possible to talk in detail about the approach and performance
    metrics, but this will likely not be appropriate with this group. If I feel the
    details may come up in discussion, I will put slides in an appendix.


    When meeting with leadership, it is extremely useful to use an *executive summary*
    front. These meetings can sometimes spur lively discussion at the beginning, and
    the presenter may not get far into slides. The summary will make all of the essential
    points clear. When presenting results, it is best to keep it brief, and provide
    clear definitions. Help the audience understand why the results are valuable,
    in business terms when possible. If a case will be made for replacing their current
    model with a new model, it is best to quantify the impact in dollar terms when
    possible. Be in mind that leaders may have direct experience using *“new, improved”*
    models that didn''t deliver what they promised.


    The guiding principle for meetings and presentations is to align on the agenda.
    When possible, come to agreement on topics in advance. It also helps to learn
    about the audience members before the event: their backgrounds, roles, and responsibilities.
    This will make for a more engaging, valuable discussion.


    # 2.4 Tell Good Stories


    If you have ever found yourself at a presentation where you were overwhelmed by
    a large tale of numbers, you understand the value of proper context. A tale of
    numbers cannot be expected to support itself. It is not enough to make a decision.
    A more effective way to communicate data science findings is to craft a story
    with a narrative and visualization, grounded in data. We will look at an example,
    but first let''s start with an effective storytelling approach using product teams.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'Tell Good Stories


    Product teams make stories a central part of their process. A common template
    looks like this:


    | A [description of user] wants [functionality] so that she can [benefit]. |


    This clarifies the persona involved and how the work will be helpful. A specific
    example may be:


    # Content Discovery: User Story


    | A seventh grade math teacher wants a way to easily search for relevant content
    that she can quickly plan her lessons. |


    Data science can often provide the functionality that a product requires. For
    the content discovery story, a recommender system might be added to help the teacher.
    Since the audience may be broad, we will mention the type of model, but will refrain
    from getting into details. Let''s add to the story, providing layers about the
    data and the model.


    # Content Discovery: Data


    | We can leverage our database of information about the teachers and the content.
    The content includes things like articles, lessons, and videos. The content is
    tagged with things like the appropriate grade level, the learning objectives,
    and the subject area. We will know which grade levels and subjects are taught
    by the teachers. We also have all of the interaction data: each time a teacher
    selects a piece of content, we have the teacher identifier, content identifier,
    and the timestamp. We know who selected what when. |


    At this point, I should mention that this would be the ideal data for this kind
    of system. As you might imagine, many schools may not yet have this kind of information.
    Let''s continue with the model layer.


    # Content Discovery: Model


    | We trained a recommender system on all of the data from the past year. The model
    was rigorously tested and we measured latency (the time required to get back recommendations),
    and the quality of recommendations. The model is secured in production. Teachers
    can click a button in a web browser to see a list of useful content. |


    This layer touches on important considerations like data security, speed, and
    relevance of output. The audience will probably be curious if the results look
    sensible, and the story should include examples like this:'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Content Discovery: Usage and Results


    Jamie teaches seventh grade math. Her students learned about representing numbers
    in decimal form. She is planning her next lesson, which will require students
    to learn about representing numbers as percentages. She logs into the learning
    management system with her credentials and clicks the button _Get Next Lesson.


    The recommender system returns a list of 20 suggested titles with keywords and
    learning outcomes. Here are the top three titles:


    +   1. Pterodactyl Percentages

    2. 100%! Decimals to Percentages

    3. Blue Horseshoe Loves Percentages


    Note that this was a small example, and I picked a recommender example. The story
    can be crafted to meet the needs of the audience, with additional layers as appropriate.
    Let''s put all the layers together to see a compelling story:


    # Content Discovery: Complete Story


    # User Story


    _A seventh grade math teacher wants a way to easily search for relevant content
    so that she can more quickly plan her lessons_


    # Data


    We can leverage our database of information about the teachers and the content.
    The content includes things like articles, lessons, and videos. The content is
    tagged with things like the appropriate grade level, the learning objectives,
    and the subject area. We will know which grade levels and subjects are taught
    by the teachers. We also have all of the interaction data: each time a teacher
    selects a piece of content, we have the teacher identifier, content identifier,
    and the timestamp. We know *who* selected what when.


