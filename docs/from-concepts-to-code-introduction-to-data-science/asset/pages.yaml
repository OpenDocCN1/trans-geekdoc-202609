  md: '# 18 Next Steps


    Congratulations, you''ve made it through the content of the book! You should now
    have a good understanding of the field of data science, important data literacy
    topics, and how to implement a data science pipeline. Data science, and machine
    learning in particular, is vast and growing rapidly. The intention of this chapter
    is to provide some ideas and suggestions of where to go next. Over time, we can
    expect to see new areas of activity, applications, and tools.


    # 18.1 Building Blocks


    To prepare for the more advanced models and applications, it will be necessary
    to add to your skills in mathematics, statistics, computing, data analysis, and
    communication. This section will be a bit of a laundry list, and I apologize in
    advance. I don''t expect to build all of these skills in a month; it will take
    longer to fully absorb the ideas and have the ability to apply them. Some of the
    topics may only come up for certain roles, and you''ll know this when you see
    a job posting or have an interview.


    # Mathematics


    Our treatment of calculus stopped short of power series and integral calculus.
    These topics will be important to learn. An understanding of integration will
    provide a foundation better understand the continuous random variables of probability
    theory. The expected value of a continuous random variable is an integral, for
    example.


    Many of the loading models in machine learning have deep underpinnings in probability,
    as they model sequences of events subject to randomness. Over time, you will need
    to learn advanced probability concepts and techniques. We studied gradient descent
    for fitting parameters in machine learning models. Some of the more complex models
    will use more specialized optimization techniques, such as stochastic gradient
    descent.


    It will be necessary to go deeper in linear algebra to understand topics including
    norms, diagonalization, eigenvalues and eigenvectors,'
