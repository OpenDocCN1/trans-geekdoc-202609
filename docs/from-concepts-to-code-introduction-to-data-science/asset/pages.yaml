  md: 'studying each variable individually and in groups, it will help build a more
    complete understanding of what insights the data holds.


    When we conduct analysis on a single variable, this is often called a univariate
    analysis. For the study of two variables together, it is called a bivariate analysis.
    Different statistics and graphs are relevant for each, and they are both necessary
    for a complete study. In the next two sections, we will conduct EDA on a binary
    target and a continuous target, respectively. The first exercise will consider
    a synthetic dataset from a bank where the records represent customer check deposits
    and the target variable is whether the check was fraudulent or not. The second
    exercise will study population happiness. These exercises should give a good feel
    for the data exploration process and methods.


    # 11.1 Check Fraud


