- pgno: 68
  md: 'The challenge with bias is that it can easily happen unintentionally, and it
    can result from a technical shortcoming. To help avoid bias, ask:


    +   * Are we leaving out important time periods?

    * Are we leaving out important groups, such as demographic segments?

    * Are we leaving out important locations?


    +   * Do the group proportions in the sample match the proportions in the overall
    population?


    Finally, all people working with data should ask these questions – not just data
    scientists.


    # 4.11 Data Is Never Neutral


    As we learned from the bias discussion, data is never neutral. How the data is
    conceived, collected, processed, stored, analyzed, visualized, and will differ
    by person. This means that as we work with data, we must learn to view each step
    critically. We should ask questions like:


    +   * Where did this data come from, and how was it created?

    * How might this data be biased?

    * What are the limitations of this data?

    * What can we do with this data, and what can we not do?

    * How can we improve this data?

    * Is this analysis interpreting the data correctly?


    Challenge the data, the analysis, and the results. The application of critical
    thinking to data and the products of data will always be valuable and important.


