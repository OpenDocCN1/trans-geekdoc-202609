    of the things in the questionnaire.


    # 3.2 A Questionnaire for Defining the Objectives


    This set of questions is typically discussed at a meeting with key stakeholders.
    The attendees are generally from product, engineering, data (when this is a standalone
    team), data science, and the line of business.


    +   Q1: What is the problem that needs to be solved, and why is it valuable?


    This should make the problem very clear, and it should help the requestor understand
    if it''s really something that should be done. Example objectives might be to
    increase revenue for the flagship product, or to lower the cost of customer acquisitions.


    +   Q2: What data is needed and what data is available?


    As mentioned earlier, if the data isn''t available to support the initiative,
    it will never get off the ground. This question is essential for taking inventory
    of the data, and strategizing on what necessary data might be collected.


    +   Q3: Who are the right stakeholders and what will be their roles?


    For a data science project to succeed, it needs support across many teams. There
    needs to be clarity on the people, their roles, and how much they can support
    the project. For example, if Jeff is the sole subject matter expert and he''s
    tied up for the next six months, then this project likely can''t start right away.'
