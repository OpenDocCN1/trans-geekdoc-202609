- pgno: 341
  md: '# Conceptual Soundness


    323


    ![](img/7f40a2246fd3d2d5353d109f489c4e33_341_0.png)


    FIGURE 17.1: Sample Recommender Flow Diagram


    The model is often where a good portion of the complexity and risk is located.
    This is because models are abstractions of reality a tradeoff is made. Consider
    face-recognition algorithms. How can they recognize someone with glasses or a
    slightly different hair style? The model does not attempt to match every pixel,
    but rather learns a representation, or simplified structure, of the face. The
    model essentially condenses the information into a subset of information which
    may be sufficient to solve the task at hand. This happens when converting an image
    in RAW (uncompressed) format to a JPEG, does it work? In some cases, it does.
    The JPEG is a lower-resolution image, but is sufficient for photos on a mobile
    app; it won''t be good for museum-quality prints, however.


    The models used in data machine learning will make assumptions to similarly abstract
    away details to simplify the problem. We assume that a variable follows a normal
    distribution, when this this may not be exactly true. Does it matter if a variable
    isn''t quite normally distributed? This depends. If the variable under study is
    the percentage change of a stock price, and the model will be used in a trading
    system, then it matters matters. Suppose the real-world behavior of a negative
    value is greater than the normal distribution would suggest. This could lead to
    serious losses.


    Each model brings a level of complexity which depends on factors like the architecture
    and the number of predictors. We should strive to use only the level of complexity
    necessary to solve the problem. There may be a temptation to use the most advanced
    methods to solve a problem, but if it can be solved with linear regression, by
    all means we use this method. However, if a non-linear relationship exists between
    predictors and a target, then a more flexible (and complex) model may be warranted.
    The data should be the guide, and not publication trends.


    When I was a graduate student, one of my areas of specialization was regime-switching
    models. In the right circumstances, these models were very useful and powerful.
    They used additional parameters when comparing linear regression models. These
    parameters added flexibility, but also complexity.'
