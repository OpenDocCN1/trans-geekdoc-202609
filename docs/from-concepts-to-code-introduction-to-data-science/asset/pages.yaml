    # 1.10 Why Isn''t Data Science Typically Done with Excel?


    Excel and similar spreadsheet applications are packed with features and they can
    present all of the numbers to the viewer. From my experience in industry, some
    managers love the visibility that Excel brings. However, it can be very easy to
    make large mistakes, such as deleting data, failing to update ranges, and sorting
    only part of a dataset. Extending the analysis, tracking changes, making work
    reproducible, and automating the process can be a challenge. Learning a language
    such R or Python to do data science requires a greater upfront investment, but
    it is worth the effort. How can one satisfy the manager who loves to see all of
    the numbers? After the analysis is finished, the results can populate dashboards,
    tables, or another format that stakeholders prefer.


    # 1.11 Goals and Scope


    This book is a first course in data science. It will teach essential skills including:


    +   - How to use Git and GitHub to work with a code repository


    +   - Coding in Python to process, summarize, transform, and visualize data


    +   - Classical machine learning tasks: regression, classification, and clustering
    using sklearn


    +   - Troubleshooting errors, which are a daily part of the life of a data scientist
    (sorry!)


    Beyond these technical skills, the reader will learn to think holistically about
    the field, paying attention to critical topics such as:


    +   - Effective communication of technical topics to broad audiences


    +   - Understanding how bias plays a role in data science


    +   - Learning how to incorporate ethical practice into data science'
