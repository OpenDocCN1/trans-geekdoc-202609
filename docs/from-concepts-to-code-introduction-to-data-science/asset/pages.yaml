    # 12.6 Generalization


    We will focus on our modeling attention on the supervised learning approach. A
    critical assumption in SL is that the patterns learned from the training set will
    generalize to additional data. The additional data might be a separate segment
    of data that has already been collected, or data yet to be collected.


    One of the greatest fears of a data scientist is that a model is trained on some
    data, it fits the data, it is deployed, and fails to work as well in production.
    This would mean the model learned relationships between the predictors and target
    from the training set, but those relationships were not present in production
    data. This can happen, and when it does, it is a major disappointment.


    How can we avoid this lack of generalization? Unfortunately, it can''t be eliminated
    with certainty, but there are steps a data scientist can take to improve the chances
    of generalization. First, it is important to distinguish between two cases:


    +   1. The model fails out of the gate.

    2. The model works in production for some time and later fails


