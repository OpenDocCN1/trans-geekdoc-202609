  md: '# Mathematical Framework


    Filling in the steps,


    ```

    $l(\beta) = \ln \prod_{i=1}^{n} p(x_i|\beta)^{y_i}(1 - p(x_i|\beta))^{1-y_i}$$

    = \sum_{i=1}^{n} \ln p(x_i|\beta)^{y_i}(1 - p(x_i|\beta))^{1-y_i}$$\n= \sum_{i=1}^{n}
    \ln p(x_i|\beta)^{y_i} + \ln (1 - p(x_i|\beta))^{1-y_i}$$\n= \sum_{i=1}^{n} \ln
    p(x_i|\beta) + (1 - y_i) \ln (1 - p(x_i|\beta))$

    ```


    > Note: In the introductory chapter on machine learning, we defined the cross-entropy
    loss for binary classification as follows:

    $H(\hat{p}_i, y_i) = -y_i \ln(\hat{p}_i) + (1 - y_i) \ln (1 - \hat{p}_i)$$

    If we sum the cross-entropy loss over $n$ observations, it will be equivalent
    to the negative log-likelihood.


    We can apply the logarithm property $log(a/b) = log(a) - log(b)$ to yield


    ```

    $l(\beta) = \sum_{i=1}^{n} \ln (1 - p(x_i|\beta)) + y_i \ln \frac{p(x_i|\beta)}{1
    - p(x_i|\beta)}$

    ```


    The term on the right is odd logs, which can be replaced by the linear term $\beta_0
    + \beta_1 x_{i1} + \dots + \beta_k x_{ik}$ like this:


    ```

    $I(\beta) = \sum_{i=1}^{n} \ln (1 - p(x_i|\beta)) + \sum_{i=1}^{n} y_i (\beta_0
    + \dots + \beta_k x_{ik})$

    ```


    Substituting for $1 - p(x_i|\beta)$ and simplifying yields


    ```

    $l(\beta) = \sum_{i=1}^{n} -ln (1 + exp[\beta_0 + \dots + \beta_k x_{ik})) + \sum_{i=1}^{n}
    y_i (\beta_0 + \dots + \beta_k x_{ik})$

    ```


