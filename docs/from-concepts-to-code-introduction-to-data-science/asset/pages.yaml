    data:


    +   - User Data: At a minimum, user identifiers (userids) are required to tell
    users apart. Metadata such as age and interests may also be helpful.


    +   - Product data: At a minimum, product identifiers (productids) are required.
    Metadata such as category and synopsis may also be helpful.


    +   - User-product interaction data: This captures each user purchase. We need
    the userids, productids, and timestamp (date and time) of each purchase.


    # 3.5 Data Quantity and Coverage


    Another important question to answer is how much data is required. This depends
    on a number of factors, and I will give some qualitative guidelines. First, there
    are some conditions where there will never be enough data:


    +   - There are no available predictors that can explain the target variable


    If there is no relationship between any predictor and the target, then ampli-ing
    amount of data will not solve the problem.


    +   - The Labels (target variable values) are not accurate


    If the labels cannot be trusted, this will lead to inaccurate results. Collecting
    more bad data will not improve the model.


    +   - The predictors are not accurate


    This presents the same issue as bad labels, bad data leads to bad models. Next,
    let''s take for granted that the data is accurate and there are variables that
    can predict the target. Data coverage of the important dimensions is crit-ical.
    For example problems involving time involve time, location, or subpopulations.
    Financial markets alternate between bull and bear markets. E-commerce platforms
    are busier around holiday seasons. A stock price predictor that is only trained
    on bad markets will suffer underperformance when the market turns. The data used
    for these problems should cover several full cycles so that models can learn these
    patterns.


    Real estate pricing is partly explained by price per square foot, but this value
    will vary over time and by location, such as proximity to the beach (glorious)
    or highway (noisy). Prices may also be driven by season and month of the year.
    The data should include several full cycles across the locations of interest.'
