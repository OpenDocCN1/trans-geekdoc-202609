  md: '# # 13

    Modeling with Linear Regression


    We have learned how to clean and prepare data, how to summarize and visualize
    it, and how to transform it into useful predictors. We just learned about the
    building blocks of machine learning. In this chapter, we fit supervised learning
    models to data when the target variable is continuous. This is the regression
