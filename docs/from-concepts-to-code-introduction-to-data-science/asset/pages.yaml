    Mathematics Preliminaries


    ```

    $$\lim_{n\to\infty} a_n = 0$$

    ```


    A sequence *diverges* if it does not converge to any number.


    Next we turn from the limit of a sequence to the limit of a function. The central
    idea is the same: getting arbitrarily close to some value (the limit) by changing
    the input value. For the limit of a sequence, we can get arbitrarily close by
    sufficiently increasing $n$. For the limit $L$ of a function $f(x)$, we can get
    arbitrarily close by moving $x$ close to some point $\xi$. We say that the value
    of $f(x)$ tends to $L$ as $x$ tends to $\xi$, which can be written symbolically:


    ```

    $$\lim_{x\to\xi} f(x) = L$$

    ```


    Returning to the exponential function $y = e^x$, we noticed that as $x$ decreased,
    $e^x$ approached zero. In fact, this is an example of a limit, which can be:


    ```

    $$\lim_{x\to\-\infty} e^x = 0$$

    ```


    What happens to $y = e^x$ as $x$ increases? As an exponential function, the value
    increases rapidly and without bound. For any threshold, the function would eventually
    cross it for sufficiently large $x$. This is an example of divergence; as $x$
    increases, the limit does not exist. This can be written:


    ```

    $$\lim_{x\to\-\infty} e^x = \infty$$

    ```


    # Continuity


    A function is *continuous* on an interval if it can be "drawn without taking pencil
    off the paper." A function that has value 0 for all $x < 0$ and 1 for all $x \geq
    1$. Revisiting limits, we would get that the function has 0 when approaching $x$
    from the left of 0, and 1 when approaching from the right of zero. These two limits
    do not coincide due to a break, or *jump discontinuity*. We say the function has
    a *discontinuity* at a point, and it is *discontinuous* on an interval containing
    it.


    Practically speaking, it is often important to work with functions that there
    is a guarantee that we can get arbitrarily close to a point $f(x_0)$ by moving
    $x$ close to some point $x_0$. If it were not possible to get arbitrarily close,
    this would imply that changing $x$ by some small amount might change $f(x)$ by
    a large amount (as in the case of the jump discontinuity). Imagine holding the
    button on a remote control to increase the volume. We expect the volume to increase
    steadily, and not suddenly jump to a deafening level.'
