  md: '# 16

    Elements of Reproducible Data Science


    It is a great outcome when a model from the data science team is identified for
    deployment to production. At the same time, the process of moving the model from
    development to production takes a lot of work. For organizations that do not have
    a lot of experience productionizing machine learning models, the steps can seem
    unclear, onerous, and manual. Concrete, common steps include:


    +   - Sharing code

    - Setting up testing and production environments with sufficient software and
    hardware (e.g., dependencies)

    - Testing the model and data

    - Insuring that the data pipelines are properly processing the data and feeding
    the model

    - Setting up a secure API endpoint to serve requests

    -Collecting and storing artifacts and predictions

    -Returning results at the appropriate frequency (e.g., batch or real time)

    - Standing up a model monitoring system

    - Setting up a pipeline for model retraining


    These steps fall in the domain of MLOps, which is often handled by members of
    the engineering team. While a different team owns this process, scientists will
    need to actively contribute their knowledge. For example, they will advise on
    the path to production, the better that data scientists understand the path, the
    more they can help. This can allow for a smoother handover of the model, saving
    time and effort. Additionally, tight integration between data science and MLOps
    can ensure that things are working as expected.


    In this chapter, we will explore some of the items listed above. In particular,
    we will focus on the practices that help make data science products reproducible.
    The first habit is to maintain code in a collaborative repository such as GitHub.
    The second habit is to develop and include tests with'
