- pgno: 48
  md: '# Data Science Project Planning


    For any pre-existing data that will be used, its *provenance* should be understood.
    Users will want to know how the data was collected and what it represents. For
    example, one of my teams had built a model to predict bankruptcy using a large
    database of variables. One of the variables had a perfect correlation with bankruptcy.
    This was very suspicious, and we asked the owner of the data to walk us through
    the variables. It turned out that the predicting factor was lagged bankruptcy.
    Since lagged bankruptcy is something not known in advance, it couldn''t be used
    in the model. Understanding the backstory of the data prevented my from making
    a huge mistake.


    In the event that the required data is not available, options include purchasing
    or using open-source data. For collection, it might be possible to work with teams
    such as engineering and design to build a collection mechanism. This approach
    might be possible if relevant data can be collected quickly. If this won''t work,
    the company might turn to external data.


    For certain cases, there may be free, useful data in the public domain. Another
    option is to pay for data. There are many third-party data providers such as AIData
    and People Data Labs that collect, clean, enrich, and share various datasets.
    The data transfer is done through an API which allows for programmatic delivery
    and processing. If there is funding available for data and a provider has something
    relevant, this may work.


    For any dataset, it is important to understand if the data is right for the project.
    The data should be fit for purpose, and it should be checked for quality, consistency,
    and predictive ability.


    # 3.7 Chapter Summary


    Data science projects require careful planning to increase their chances of success.
    The planning starts by defining and clarifying the business objectives. We reviewed
    a questionnaire for defining objectives. This helps stakeholders understand the
    value of a project and the resources required. To operationalize the data science
    work, the problem is cast into an analytical framework. This approach allows the
    data science team to think about sensible models and the necessary data. Next,
    the data needs to be acquired. It may be that the company already has this data,
    or it needs to be collected or purchased. If high-quality data cannot be obtained,
    the project cannot move forward.


    Following the planning stage, the data will need to be ingested into the system.
    The next chapter will briefly review the use of APIs and web scraping for this
    purpose. We will also review data more broadly from different perspectives including
    data structures and data processing.'
