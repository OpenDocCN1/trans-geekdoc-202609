  md: '134 Mathematics Preliminaries


    Rational integral functions, more commonly called polynomials, are the simplest
    functions. They are obtained by repeated application of elementary operations:
    addition, subtraction, and multiplication. Given constants $a_0, a_1, \dots, a_n$,
    polynomials can be represented like this


    ```

    $$y = a_0 + a_1x + \dots + a_nx^n$$

    ```


    Examples $y = 3x+4$ and $y = 1+x^2$; the first is a linear function and the latter
    is a quadratic function.


    A rational function is a fraction with polynomials in the numerator and denominator.
    Examples include $y = \frac{1}{1+x^2}$.


    Algebraic functions can be defined as the root of a polynomial equation. For illustration,
    let''s start with $y = x^n$, a polynomial. We will require $x \ge 0$ and find
    the inverse of the function. This can be done by solving for $x$. We can then
    interchange $x$ and $y$, which produces $y = x^{1/n} = \sqrt[n]{x}$. The case
    of $n=2$ produces the rational function $y = \sqrt{x}$, for example.


    The elementary transcendental functions — the trigonometric functions, the exponential
    function, and the logarithm — derive from geometry. Consider the circle of radius
    1, or unit circle, in Figure 8.5. The angle $\theta$ is measured in radians, which
    measures the length of the arc of the circumference that the angle sweeps out.
    For the unit circle, the circumference $C=2\pi r=2\pi$. This means that an angle
    sweeping out the entire circumference, or 360 degrees, would measure $2\pi$, while
    an angle sweeping out half the circle, or 180 degrees, would measure $\pi$.


