    # Iteration 1: Assign


    Based on the centroids, we need to assign the points to their closest centroid.
    To do this, we first need to measure the distance of each point P to centroid
    as follows:


    | | dist(P,centroid0) | dist(P,centroid1) |

    |---|---|--|

    | A | 0 | 26.2 |

