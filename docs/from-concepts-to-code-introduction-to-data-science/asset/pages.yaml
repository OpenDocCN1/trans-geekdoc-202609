- pgno: 62
  md: '# An Overview of Data


    An analyst using the trusted data files is less likely to encounter bad actors
    or other problematic data. However, errors are still possible, and one reason
    is inconsistency. For example, the definition of an outlier might change for a
    variable, and this might not be reflected properly in the data. In such a case,
    the analyst need to revise the data to rebuild the trusted data.


    The trusted zone is typically not the last step for the data. There may be processing
    steps that run on the trusted data, such as data standardization, natural language
    processing, and detecting and masking sensitive information. The steps should
    support the goals of the organization. A complication is that different users
    might require different versions of the data, as in the case of privacy requirements.
    Taking this into account, an organization needs to be strategic when deciding
    how to process, secure, store, and manage the data. If a certain step is required
    for all users, then it should take place as part of the main process; it should
    not be done by multiple teams, as this can introduce inconsistencies and redundant
    work.


    # 4.7.2 Standardizing Data


    Data is often messy, and when it comes from multiple sources, it may be inconsistent.
    Suppose a system is collecting lab records from different laboratories. Even on
    a single lab test, there will be name variations. Here is an example of possible
    names for a COVID test:


    +   * COVID-19

    * COVID19

    * COVID-19 (Lab X)

    * Covid-19


    In the X case, a lab provider has included its name in the test name. These data
    variations have happened in practice, and they make it difficult for systems and
    users to discern identical objects from different objects. This entity resolution
    is challenging and ubiquitous, and techniques such as machine learning can help.


    This is just one example of standardizing data. It may be the case that every
    piece of data needs a standardization step. This is a lot of work, which is why
    automating these steps is critical.


    # 4.7.3 Natural Language Processing


    A series of steps for processing language is often required to make the data more
    useful. This may include determining the dominant language of the text,'
