    # Transpose


    The transpose of matrix A is a matrix denoted A^T and A''.T is obtained by taking
    the rows (or columns) of A to be the columns (or rows) of A^T. Here is an example:


    ```

    A = \begin{pmatrix} 1 & 5 & 0 \ 2 & 12 & -1 \ 4 & 12 & 3 \end{pmatrix}

    ```


    ```

    A^T = \begin{pmatrix} 1 & 2 & 4 \ 5 & 12 & 12 \ 0 & -1 & 3 \end{pmatrix}

    ```


    For example, the first row of A, [1, 5, 0], became the first column of A^T. Note
    that [1, 5, 0] is a row vector, and taking its transpose made it a column vector.
    Taking the transpose of a column vector makes it a row vector.


    When a matrix M is equal to its transpose M^T, it is said to be symmetric. An
    example is


    ```

    M = \begin{pmatrix} 1 & 2 & 4 \ 2 & 12 & -6 \ 4 & -6 & 3 \end{pmatrix}

    ```


    Symmetric matrices can reduce the amount of storage and computation, due to repeated
    values in predictable locations (here, where m12 = m21, m13 = m31, and m23 = m32).


    # Matrix Diagonal


    The diagonal of an n x n matrix includes the elements m11, m22, ..., mnn. That
    is, they begin at the top left and proceed down to the bottom right. From the
    above example, the elements on the diagonal of M are 1, 2, and 3.


    # Identity


    The identity matrix I_n is a square n x n matrix with 1s on the diagonal and 0s
    elsewhere. The subscript n is sometimes suppressed. Multiplying an appropriately
    sized matrix M by I_n (on the left or right) will reproduce M.'
