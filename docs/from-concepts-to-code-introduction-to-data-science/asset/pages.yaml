  md: '# 13.3.4 Interpreting the Parameter Estimates


    The sklearn package allowed for fitting the model and working with the parameter
    estimates, but it didn''t tell us which estimates, if any, are statistically different
    from zero. The statsmodels package can fit the same linear regression model and
    run one-sample t-tests to answer this question. Since we have already done the
    work of preparing the data, the code is minimal:


    ```

    # import statsmodels

    import statsmodels.api as sm


    # append column of 1 to design matrix for intercept term

    X = sm.add_constant(x_train_s)


    # fit the OLS model

    results = sm.OLS(y_train, X).fit()


    # print the model summary

    print(results.summary())

    ```


