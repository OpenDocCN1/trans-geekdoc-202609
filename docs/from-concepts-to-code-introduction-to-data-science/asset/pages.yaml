  md: '# Exercises


    Data ingestion is the process of collecting data from one or more sources. The
    data may be used immediately or stored for later use. Two important approaches
    for data ingestion are use of an API and web scraping. The API delivers data in
    an agreed-upon format. Web scraping can be an effective method for collecting
    data, but it can encounter many challenges such as the structure of the web pages.


    Data integration consists of preparing and combining the ingested data. The common
    pipeline consists of an extraction step, a transform step, and a load step. This
    is called the ETL pipeline. In some cases, such as when the important data elements
    are not known, the data is stored without processing.


    Raw data is unprocessed and as it is increasingly cleaned and processed, it becomes
    more useful for downstream applications. Metadata is data about data, as the genre
    and runtime of a movie. This information can be helpful when searching for relevant
    objects.


    Data can be at rest, or in motion. The velocity of the data is the speed at which
    it enters a system for processing. We will measure data volume as the number of
    rows of data. High-velocity and high-volume data necessitate tools for storage
    and processing.


    Some datasets are finite and they can be processed in a large chunk. This is called
    batch processing. Data that is infinite, such as video from a sensor, is called
    streaming data. This kind of data requires decisions such as what data to store
    (since it can''t all be stored) and when to compute (since there is no end to
    the data).


    Data at rest may be structured, semi-structured, or unstructured. Structured data
    can be stored in tables, and transactions are an example. Semi-structured data
    is generally hierarchical, and it is stored as key-value pairs. Home address is
    unstructured. Unstructured data comes from a variety of sources, such as audio
    files and images. This format cannot be easily stored into a tabular format.


    To be useful, data needs to be credible and reliable, and it must faithfully represent
    the population. In cases where the data is not representative, there will be bias.
    Care needs to be taken to prevent and mitigate bias, as it can lead to harmful
    consequences and lead to poor decisions.


