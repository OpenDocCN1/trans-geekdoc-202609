  md: 'it down the relevant path. For example, an observation where age=19 and visits=10
    would first travel left and then right, receiving prediction N.


    ![](img/7f40a2246fd3d2d5353d109f489c4e33_366_0.png)


    FIGURE 18.1: Sample Decision Tree


    When fitting a decision tree to training data, important considerations include
    the predictors to use, the depth of the trees, and the cutpoints for each of the
    predictors (e.g., do we move left when age<20 or when age>21?). A major shortcoming
    of decision tree is that it can overfit the training data. A useful technique
    for reducing overfitting is to build multiple decision trees and then aggregate
    the results into a prediction. Two popular and effective models following this
    approach are random forests (RF) and gradient-boosted trees (GBT). A variant of
    the GBT XGB is very efficient and wins many data science competitions.


    One distinction between RF and GBT is that the former builds a set of independent
    trees, while the latter builds a sequence of small trees meant to correct prediction
    errors. The "randomness" in random forests reflects the practice of drawing subsets
    of data and predictors when building each tree. After each tree is built, its
    predictions are equally weighted to produce an aggregated prediction. The GBT
    model, will, determine an optimal weighting of the small trees to produce an aggregated
    prediction. The technique of combining multiple trees to yield a prediction is
    called an ensemble method.


    A major advantage of random forest models is that the construction of the independent
    trees can be done in parallel across multiple cores to speed up processing. Since
    the GBT model builds trees sequentially as error refinements, the task cannot
    be done in parallel by multiple cores.


    From their architecture, tree-based models do not assume a linear relationship
    between predictors and the target. This provides flexibility not present in linear
    regression and logistic regression models (recall that logistic regression models
    assume a linear relationship between the log odds and predictors). To be sure,
    there are many kinds of data where the linearity assumption is violated. For example,
    the relationship between a predictor and a target may exhibit this piecewise-linear
    behavior.'
