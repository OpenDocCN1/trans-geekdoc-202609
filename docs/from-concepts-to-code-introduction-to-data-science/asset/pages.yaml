    Model Risk


    When I proposed the model to practitioners, many expressed hesitation to use them
    in production. After several discussions, I found a common difficulty: for some
    kinds of data, the parameter estimates were very unstable. Over time, they would
    vary greatly, and the models produced inaccurate predictions. This led me to realize
    that such care and testing was required when introducing complex models.


    This leads to the point that model developers need to justify their modeling decisions.
    This should be done through analysis and testing. More than one model should be
    considered, so that comparisons can be made. The final model does not need to
    be the optimal model over the universe of models, but it needs to make sense,
    provide demonstrable value, and carry an acceptable risk profile.


    # 17.3 Data and Inputs


    The data considered for the model, as well as the model inputs, are crucial for
    strong performance. First, there needs to be an understanding of what all of the
    data means. In the ideal case, a data dictionary will describe each of the variables
    to provide context. Unfortunately, a data dictionary may not be available. In
    this case, the data scientist might need to spend time searching for clues, documentation,
    and the right people to ask. For one consulting project, my team built a model
    without all of the variables. We noticed that the model fit perfectly, which was
    a red flag that something was amiss. It turned out that one of the predictors
    was essentially the target variable. This kind of thing happens more than you
    might guess.


    Suppose the data is now understood and documented. What is important? If a variable
    will be an input or predictor in a model, we must ensure that:


    +   - The variable will be available in the future. If the variable will need
    to be processed in real time, but the system requires two hours to process it,
    then we should not include the variable in the model.

    - The variable does not induce bias

    - The variable makes intuitive sense in the model

    - The data is accurate. When possible, it should be cross-referenced.

    - We are permitted to use the data. For example, unauthorized use of copyrighted
    material can provoke a lawsuit.


    After reviewing the data and model inputs, it is also important to ensure that
    the dataset is sufficient. For example, if we are building a risk model, then
    the'
