  md: "# 9.3 Chapter Summary\n\nIn studying a population, it generally is not possible\
    \ to take a full census. We draw samples and compute statistics with the aim that\
    \ the statistic can tell us something meaningful about the population. Descriptive\
    \ statistics help us understand the population. Inferential statistics allows\
    \ us to draw conclusions about the population based on the sample.\n\nWhen we\
    \ have a data sample, there are several statistics we can compute to understand\
    \ its distribution. The frequency counts tell us the number of times each value\
    \ is taken. We studied several measures of central tendency: the mean, median,\
    \ and mode. The mode is the most frequent value. It is simple to explain, but\
    \ it is purely frequency based. The median is the 50th percentile of the data.\
    \ The mean is not influenced by outliers and it better identifies the center of\
    \ the data. The average or sample mean of the data is the sum of the data divided\
    \ by the number of observations. Each data point contributes to an estimate of\
    \ the population mean.\n\nWe studied measures of dispersion or spread in data.\
    \ The range is the difference between the maximum and minimum. It is simple to\
    \ calculate, but it can be influenced by outliers. The interquartile range is\
    \ the range covered by the middle 50% of the sorted data. By trimming the lowest\
    \ and highest 25%, the outliers are removed. The five-number summary is useful\
    \ for reducing a data distribution to a handful of values: the minimum, 25th percentile,\
    \ median, 75th percentile, and maximum. The boxplot is useful for graphically\
    \ depicting the distribution with the five-number summary. The sample standard\
    \ deviation measures the spread based on the deviation of each data point from\
    \ the sample mean. The sample variance is the square of the standard deviation.\n\
    \nThe covariance measures the average tendency of two variables to move together.\
    \ A large, positive covariance indicates that both variables move in the same\
    \ direction, while a negative covariance indicates movement in the opposite direction.\
    \ If the covariance is zero, this indicates no relationship between the variables.\
    \ The covariance can be divided by the product of the variables' standard deviations\
    \ to produce the sample correlation. Correlations are typically reported in favor\
    \ of covariances as they fall in the range [-1, 1].\n\nA point estimate is a single\
    \ value that approximates a parameter, such as the sample mean $\bar{x}$ estimating\
    \ the population mean $\\mu$. A confidence interval is a range that supplements\
    \ the point estimate with a variability measurement. It can also be used for conducting\
    \ a two-tailed hypothesis test. We reviewed the construction of a confidence interval\
    \ for the population mean.\n\nWe outlined the formal process of hypothesis testing.\
    \ This uses a data sample to infer information about a population parameter. One-sample\
    \ tests"
