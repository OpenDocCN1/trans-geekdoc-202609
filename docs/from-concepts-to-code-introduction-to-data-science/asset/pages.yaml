    As director of an online master''s program in data science, I watched many of
    my students struggle to balance a demanding degree, family responsibilities, and
    a full-time job. Several projects involved group work, and it was difficult for
    teammates to work at a constant pace. This was the first time I heard mention
    of the term *positive intent*, which suggested that students assume others are
    trying their best and mean no harm, particularly in ambiguous circumstances. One
    might imagine, it can be very easy to interpret a Slack message negatively (especially
    when it''s missing the right emoji). Moreover, once things take a negative turn,
    situations can escalate quickly. The advice was very powerful, assuming positive
    intent brushes off things that may mean nothing. It means giving the benefit of
    the doubt to the other person, and can induce empathy.


    In *Conversations* [5], the authors suggest that we invent a story to explain
    behavior. When things don''t align with ours, the story is often negative. We
