    breeds taking values of zero. The columns in this matrix are sometimes called
    indicator variables or dummy variables. These columns can now be included in modeling
    techniques such as regression. Next, let''s look at a code snippet that begins
    with the categorical data and converts it to numeric using one-hot encoding.


