    The CPU is critical in determining how fast programs run. Major factors that determine
    the processing speed are the number of processor cores, the clock speed, and the
    word size. The clock speed is the number of cycles the CPU executes per second,
    measured in gigahertz (GHz). The word size is the amount of data that can be transferred
    to the CPU in one pass. A good clock speed for today''s machines is 4 GHz, with
    word sizes of 32 to 64 bits, where a bit is the smallest unit of data stored by
    a computer. Each bit can take a value of 0 or 1. For both the clock speed and
    the word size, a larger value will mean faster processing.


    The graphical processing unit (GPU) is a processor of specialized cores. Unlike
    the CPU, it is particular computing engine. However, its architecture is different,
    as its purpose is to accelerate 3D rendering tasks [19]. It does this by performing
    parallel computations, which happens to be very useful for machine learning workloads.
    Today, some GPUs are designed for machine learning, some learning algorithms and
    frameworks - deep learning, which is a subarea of machine learning - are for GPUs.


    The technology of CPUs and GPUs has been rapidly improving, which has supported
    major advances in data science. Today, GPUs may be integrated into CPUs. Resource
    intensive tasks, such as computer vision, benefit from the combination of CPUs
    and GPUs. It is common for a data scientist to think about the task at hand, and
    select a machine with a desirable number of CPUs and GPUs.


    # 5.1.2 Memory (RAM)


    Random Access Memory (RAM), generally called memory, provides a place to store
    data for the CPU. At any given time the operating system is often running several
    applications such as a browser, an email application, and a design tool. Memory
    provides short-term storage to quickly move data in and out of the CPU.


    RAM is much faster than the hard drive storage we will review next, but it is
    much more expensive. As a result, a computer will be equipped with less RAM than
    hard drive. A typical laptop has 8 GB or 16 GB of RAM (32 GB for a higher-end
    machine), while the hard drive price may be 500 GB to 1 TB (1000 GB).


    When doing data science, 8 GB of RAM is enough to handle relatively small datasets
    for processing. Breaking the data into smaller pieces, or chunking, can allow
    for handling larger datasets. However, sometimes a dataset needs to be processed
    and it doesn''t fit in RAM. In this case, another option is required, and this
    is where cloud computing can be helpful. Cloud providing access to additional
    compute resources, including more RAM,'
