  img_proc: true
- pgno: 315
  md: '# Clustering Foods by Nutritional Value


    1) For each data point $i$, calculate its mean distance from all other points
    in its cluster, calling it $a(i)$. This measures how well the point is aligned
    in its cluster.


    2) For each data point $i$, compute its mean distance from all of the points in
    a different cluster. Repeat this mean calculation for each of the different clusters
    and identify the cluster with smallest mean. This is the *neighboring cluster*
    of point $i$, since it is the next-best cluster. The mean distance to points in
    the neighboring cluster is denoted $b(i)$.


    3) For each data point $i$, calculate its *silhouette*


    ```

    $s(i) = \frac{b(i) - a(i)}{max(a(i), b(i))}$$

    ```


    A large difference $b(i)-a(i)$ indicates a good fit between point $i$ and its
    cluster. In the extreme case where each point in a cluster is identical, $a(i)
    = 0$ for each of these points. The denominator normalizes values to fall in the
    range $[-1,1]$. For the extreme case the numerator would be $b(i)-a(i) = b(i)$
    and the denominator would be $max(a(i),b(i)) = b(i)$. The silhouettes are $s(i)
    = b(i)/b(i) = 1$.


    4) The silhouette score is calculated as the mean $s(i)$ over all $i$. For the
    case where each point in a cluster is identical, $s(i) = 1$ for all $i$, and the
    silhouette score will be 1.


    The silhouette score can be calculated in Python using **sklearn** and we will
    see this in the next section.


