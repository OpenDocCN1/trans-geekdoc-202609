    # Bernoulli Distribution


    The *Bernoulli distribution* is a discrete probability distribution for a random
    variable that takes value 1 (this is a success) with probability $p$ and value
    0 with probability $1-p$ (this is a failure). As there are two possible outcomes,
    it can model the result of a coin flip. For random variable $Y$ following a Bernoulli
