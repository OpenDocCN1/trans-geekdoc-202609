    # 1.8 How This Book Teaches Coding


    Doing data science well requires writing good code. This book covers the fundamentals
    of coding, but more importantly, it will help with becoming a self-directed programmer.
    To make the most of this book, it is best to actively work through the code. This
    means running the code snippets, reviewing the detailed explanations, trying variations
    on the code, and investigating errors.


    This uses Python because it is one of the most popular languages for data science,
    it supports the tasks we need to accomplish, and it is relatively easy to learn.
    It will teach Python by diving into problems with data and solving challenges.
    It will not methodically catalog what each operator does, what each constructed
    structure looks like, and so forth. There are excellent references for learning
    in this way, with suggestions given later. Finally, the book includes many exercises
    across different topics, with the hope that they are interesting and motivating.


    # 1.9 Course and Code Package


    Accompanying this book is the content of the introductory data science course
    targeted to advanced high school students, first and second-year undergraduates,
    and others interested in getting started in the field. It consists of agendas
    that teachers can use for planning and preparation, lecture notes, and coding
    assignments. Most of the lecture and coding assignments are in Jupyter notebooks,
    which contain rich text, images, links, and runnable code. The notebooks are very
    useful for teaching and demonstrations.


    The course materials were designed to be sufficient for a one-semester or two-semester
    introductory data science course. Teachers can assign readings and exercises from
    this book to support the course. A one-semester course'
