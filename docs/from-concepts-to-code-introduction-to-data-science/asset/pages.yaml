  md: 'An Overview of Machine Learning


    > **Tip**: In a binary classification problem, it is generally important to accurately
    predict both the positive and negative labels. We can consider the case where
    one of the labels outnumbers the other, and without loss of generality we will
    take the positive labels to be rare. In this case, the data will be imbalanced
    and most observations will have negative labels. A classifier can have high accuracy
    by predicting all observations to have negative labels. Such behavior will not
    identify any of the positive labels, which means it will not be a useful classifier.
    This is why the F1 score can be a more useful metric than accuracy for binary
    classification.


    # 12.10 Chapter Summary


    We began this chapter with a simple tool for making a decision: a pros and cons
    list. We learned that to make a decision, we needed to surface all of the important
    predictors and determine their weighting. It is not an easy task to determine
    the optimal weighting, and this is one place where machine learning can help.


    Next, we reviewed the branches of machine learning, starting with supervised learning.
    This approach pairs predictors with labels, so that a function can be learned
    for taking new predictor values as input and predicting the target. It is not
    always easy or even possible to collect labeled data, and this is one motivation
    for other approaches.


    Unsupervised learning is used to understand the structure of data that is not
    labeled. Given a set of observations containing predictor values, we can try to
    identify underlying groupings of the data points. We can also predict the group
    membership of a new data point. For the case where we have a small fraction of
    labeled data and a larger fraction of unlabeled data, semi-supervised learning
    can be a useful approach. One recipe is to train on the labeled data and predict
    the labels of the unlabeled data. Reinforcement learning takes a different approach
    that follows human learning. An agent takes an action and receives a reward and
    new state from the environment. Working to maximize long-term reward, the agent
    learns the value of taking action from each state.


    Next, we focussed on supervised learning and one of its biggest risks: failure
    to generate new data. Overfitting is a major culprit, and we discussed mitigating
    practices as evaluating model performance on held-out data.


    For measuring prediction error, we defined some common loss functions. To measure
    the error across the training set, we defined risk as the expected loss; optionally
    we average the loss over the data points in the training set.'
