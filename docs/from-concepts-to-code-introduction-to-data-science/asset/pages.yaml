    # 17.2 Conceptual Soundness


    When we consider a system to solve a problem with data, it is essential to validate
    each component: the data collection process, logic, models, sequence of steps,
    assumptions, and limitations. It is enlightening to create a detailed flow diagram
    to understand each step, possible gaps, bottlenecks, redundancy, and feedback
    loops (see Figure 17.1 for an example). The analyst should be asking questions
    such as:


    +   • Why is this doing sense?


    +   • Does this make sense?


    +   • Is this the best way to solve the problem?


    +   • Are there other alternatives that should be considered?


    +   • Is this assumption/limitation reasonable? Could it cause problems later?


    +   • What might cause this to break?'
