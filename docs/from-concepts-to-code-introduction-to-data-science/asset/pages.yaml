  md: 'Being Thoughtful about Predictors


    # 13.2 Being Thoughtful about Predictors


    When selecting model predictors, it may be tempting to include all available variables
    in the model. It is certainly possible to use an algorithm to automate this step.
    However, a word of caution is in order, as there are some qualitative considerations
    when deciding predictors:


    +   • They should make intuitive sense. In practice, the data scientist must discuss
    the predictors with the line of business, the product manager, and other stakeholders.


    +   • They should not introduce bias or ethical issues into the model


    One needs to be careful around the use of demographic variables, as it can be
    easily discriminate based on age, gender, race, and ethnicity. Examples of variables
    that would introduce bias, and therefore should be avoided in modeling:


    +   • Age, ethnicity, gender, race, religion, disability, color, native origin,
    religion


    +   • Employment type, where jobs like nursing can introduce a gender bias


    +   • An indicator if a caller pressed 2 to hear a message in Spanish, which can
    introduce an ethnicity bias


    +   • Salary, which can introduce a race/ethnicity bias


    In summary, the model predictors should be carefully considered. It is not enough
    that predictors improve the model fit; they must also make sense and not cause
    harm.


    # 13.3 Predicting Housing Prices


    In this exercise, we will fit a linear regression model to a dataset of California
    housing prices from the StatLib repository at Carnegie Mellon. It was originally
    featured in [41]. The data is from the 1990 U.S. census and includes variables
    such as population, median income, and median house price for each block group.
    A block group is the smallest geographical unit for published sample data (typically
    600 to 3000 people). We will begin by importing relevant modules and exploring
    the data in Figure 13.2.'
