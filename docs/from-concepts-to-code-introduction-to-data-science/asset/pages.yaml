  md: "# Classification with Logistic Regression\n\nestimates that maximize it. Unfortunately,\
    \ it is not possible to follow our approach from the linear regression model (take\
    \ partial derivatives, set equal to zero, and find the critical point), as there\
    \ is no closed-form solution. Instead, we use a numerical approach to find an\
    \ approximate solution. The convention in optimization is to solve a minimization\
    \ problem, and maximizing the log-likelihood would be reframed as minimizing the\
    \ negative log-likelihood. There are many algorithms to accomplish this task,\
    \ and we will use gradient descent as it is widespread in machine learning and\
    \ less complex than many alternatives.\n\nGradient descent is an iterative method\
    \ that simultaneously updates the parameters according to this equation:\n\n```\n\
    $\\beta^{(t+1)} = \\beta^{(t)} - \\alpha \\frac{\\partial\\beta^{(t)}}{\\partial\\\
    beta^{(t)}}$\n```\n\nwhere\n\n+   - $\\beta^{(t)}$ is the vector of parameter\
    \ estimates at iteration $t$\n- $\\alpha$ is the learning rate or step size\n\
    - $\\partial\\beta^{(t)}/\\partial\\beta^{(t)}$ is the gradient of the log-likelihood\
    \ function\n\nA useful analogy for understanding gradient descent is a hiker finding\
    \ the lowest point in the mountains. Imagine that she moves downhill in the direction\
    \ of greatest descent (the gradient) for a given number of paces (the learning\
    \ rate)\n\nThe algorithm begins by initializing the parameter estimates as $\\\
    beta^{(0)}$. The parameter update moves in the direction of the largest change,\
    \ which is determined by the gradient. For a small step size, moving in the direction\
    \ of the gradient will bring an update to the parameter estimates which brings\
    \ closer to their optimal values. A larger step size can lead to faster convergence,\
    \ but it might miss the minimum. When optimality is reached, the algorithm is\
    \ said to converge. In practice, it may not be possible to reach optimality (due\
    \ to a bad start) or take a very long time (due to a small alpha). Stopping criteria\
    \ are used to prevent the algorithm from running indefinitely: (1) a maximum number\
    \ of iterations is provided, and (2) a tolerance is set to determine when a change\
