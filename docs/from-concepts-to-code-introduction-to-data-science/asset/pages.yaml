  md: "# Inferential Statistics\n\nstatistic. The fundamental challenge is that each\
    \ sample might produce a slightly different estimate due to sampling error. Increasing\
    \ the sample size will reduce this sampling error, but including more data is\
    \ not always possible. We will therefore need to account for the variability of\
    \ the estimate when making a decision.\n\nThe estimate will follow a distribution\
    \ called the sampling distribution, and for large samples (n ≥30) this will increasingly\
    \ resemble a normal distribution by the central limit theorem. In data science,\
    \ one can expect the samples to nearly surpass 30 by a large margin. After standardizing\
    \ the estimate, it will follow a normal distribution, and probabilities can be\
    \ computed with software (the modern approach) or tables (the earlier approach).\n\
    \nIt will be of interest to compute a probability that this statistic or something—“What\
    \ is the probability of observing this value or more extreme than $H_0$ is true?”\
    \ The \"more extreme\" statement is determined from $H_A$. This probability is\
    \ called the p-value. When the p-value is \"sufficiently small,\" we reject $H_0$;\
    \ otherwise we fail to reject $H_0$. The benefit of this approach is that it is\
    \ driven by the data. We will discuss the choice of threshold for making the decision\
    \ next, but let's first consider a small example where\n\n```\n$H_0: θ ≥0\nnH_A:\
    \ θ <0$\n```\n\nand the statistic is -0.25. The probability of a statistic of\
    \ -0.25 or less assuming that $\theta ≥0$? Intuitively, if this probability (or\
    \ p-value) is very large, then means $H_0$ is likely true. However, if the p-value\
    \ is very small, then there is evidence to reject $H_0$ in favor of $H_A$.\n\n\
    There are two possible errors that can be made with this approach. If we reject\
    \ the null when it is true, it is called a Type I error. If we fail to reject\
    \ the null when it is false, it is called a Type II error. Since uncertainty cannot\
    \ be eliminated, the strategy is to accept some probability of making a Type I\
    \ error the significance level, denoted $\\alpha$. The most common value for $\\\
    alpha$ is 0.05, which amounts to error in 1 out of 20 decisions. A less stringent\
    \ value of 0.10 (1 out of 10) and a more stringent value of 0.01 (1 out of 10)\
    \ is also common. These numbers are not magical and should be taken with a grain\
    \ of salt when results are borderline. A two-way table of decision versus (or\
    \ truth) is shown below. For the decision to reject $H_0$ (accepting $H_A$) when\
    \ $H_A$ is true results in a correct decision.\n\n| decision/actual | $H_0$ |\
    \ $H_A$ |\n|---|---|---|\n| $H_0$ | Type I error | Type II error |\n| $H_A$ |\
    \ correct | correct |\n\nWe now have all the necessary ingredients for a hypothesis\
    \ test. We can"
