  md: '# Probability


    # Discrete and Continuous Random Variables


    A random variable is either a discrete random variable or a continuous random
    variable, and this is determined by the number of possible values it can take.
    Note that the principle is the same as discrete and continuous data that we encountered
    earlier: a discrete random variable takes a finite or countable number of values,
    while a continuous random variable takes an uncountable number of values. A random
    variable representing the sum from rolling dice is discrete, and so is the cumulative
    number of visitors to at any given time. Discrete random variables depend on quantities
    taking real-valued measurements like length and volume. An example would be the
    distance of citizens from a police station. Most problems are now solved with
    computers which have finite memory, values are rounded and this results in discrete
    measurement. However, treating variables with high cardinality as continuous can
    be very and very effective.


    The simplest probabilities to compute discrete random variables with equally likely
    outcomes. When rolling a six-sided die, there are six equally likely outcomes.
    The probability of rolling a five, for example, is equal to the number of possible
    outcomes to arrive at success divided by the number of outcomes P(5)=1/6. When
    rolling two dice, the probability of the sum $Y$ being equal to five follows the
    same approach:


    ```

    $P(Y=5) = \frac{\#(\text{ways of achieving 5})}{\#(\text{possible outcomes})}
    = \frac{\{|(1,4), (4,1), (2,3), (3,2)\|}{36} = \frac{4}{36}=\frac{1}{9}$

    ```


    # Conditional Probability


    When computing a probability, it is important to consider what prior information
    is available. From the dice-rolling example, we used the fact that each side of
    a die would appear with equal probability. Each roll produces six equiprobable
    outcomes {1, 2,..., 6}, and two rolls produce $6 \times 6 = 36$ equiprobable outcomes.
    Now let''s ask the same question with additional data. What is the probability
    that the sum of two dice is 5 given that one of the dice is showing 1? To do this,
    we can return to our earlier formula of #(ways of achieving success)/#(possible
    outcomes), but we need to update these expressions. In the numerator, it is no
    longer possible to roll (2,3) or (3,2). In the denominator, there are no longer
    36 possible outcomes, but rather 12 outcomes involving a 1: {{(1,1), (1,2),...,(1,6),
    (6,1), (5,1),...,(1,1)}}'
