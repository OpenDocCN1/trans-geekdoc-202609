  md: '# 4 An Overview of Data


    Our working definition of data will come from the Collins Dictionary:


    *Data is information that can be stored and used by a computer program.*


    The Cambridge Dictionary gives a similar, slightly longer definition:


    information, especially facts or numbers, collected to be examined and considered,
    and used to help decision-making, or information in an electronic form that can
    be stored and used by a computer


    Nearly all data is now digital, with books holding less than 10% of the world''s
    data. Libraries are working feverishly to digitize and extract information from
    their physical documents. Digitization has led to improved search and retrieval,
    and in the age of AI, it enables so much including classification, translation,
    and personalization. Data may be produced by people or agents as robots, sensors,
    devices, and servers. It may look like:


    +   - Text in the form of social media tweets


    +   - Images taken by a digital camera


    +   - A TikTok video


    +   - Numeric measurements taken by a blood pressure monitor


    +   - Sound waves recorded by a digital audio workstation, and DAW


    Now that we have this broad view of data, we will examine it from many different
    perspectives. This will include understanding the attributes of different kinds
    of data, the different forms that data can take, how data is treated within systems
    and applications, and how data can represent (or misrepresent) things.'
