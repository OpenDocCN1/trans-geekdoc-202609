    \ \\end{bmatrix}\n```\n\nPutting the pieces together allows for writing the system\
    \ of equations in compact matrix notation:\n\n```\n$y = X\\beta + \\epsilon$$\n\
    ```\n\nIn theory, it is possible to solve this system of equations analytically\
