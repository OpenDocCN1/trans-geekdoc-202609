  md: '# Supervised Learning


    Supervised learning (SL) uses n data pairs $(x_1, y_1), (x_2, y_2), \dots, (x_n,
    y_n)$ to learn a function that can predict a target $y$ given $x$. We denote the
    labeled dataset as $\{(x_i, y_i)\}_{i=1}^n$. It is common in classification problems
    (which we discuss shortly) to refer to target values as *labels* or *ground truth
    values*. For a given observation $i$, the data pair $(x_i, y_i)$ is associated
    with a $d$-dimensional vector of predictors $x_i$, associated with the label $y_i$.
    When each observation has a label, we say that the dataset is labeled.


    Taking a step back, we might ask if it is possible to avoid learning a function
    and take a simpler approach: why not use data as a lookup table? That is, if we
    were given a new $x$, could we look up the data pair for the right $x$, and return
    its $y$? There are some problems with this approach. First, the particular value
    of $x^*$ might not be in the dataset. Second, if $x^*$ is noisy, leading to an
    erroneous $y$. Third, for a large set of data pairs with possibly high-dimensional
    $x^*$, this motivates a function to handle the mapping for us. These shortcomings,
    it motivates us to learn from the data at hand, interpolate for new values of
    $x^*$, and complete much faster as it avoids lookup.


    There are two kinds of supervised learning problems, and this depends on whether
    $y$ is a continuous– or discrete-valued variable. In the continuous case $y$ takes
    an uncountable number of values, the problem is a *regression problem*. An example
    is predicting the price of a house. In the discrete case $y$ takes a countable
    number of values, the problem is a *classification problem*. A common task is
    to predict an outcome with two possible values, or classes, such as:


    +   * The patient recovers (positive class) or not (the negative class)

    * A bank deposit is fraudulent (positive class) or not (negative class)

    * A stock price rises over the next trading day (positive class) or not (negative
    class)


    These examples are called *binary classification problems*. The positive class
    is assigned to the event of interest; it makes no judgment on good versus bad.
    Programmatically, the positive class is coded as 1, and the negative class as
    0.


    In the case the outcome has more than two possible values, it is called a *multiclass
    classification problem*. Examples might include predicting the fastest runner
    in a marathon, or the next number rolled on a six-sided die. Coding by numbering
    each class from zero to the total classes minus one. For the six-sided die, the
    classes would be 0, 1, $\dots$, 5.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# Unsupervised Learning


    Supervised learning is a very powerful method for predicting outcomes, but it
    has some strong requirements. First, labeled data is required, and it must be
    accurate. Depending on the problem and the explanatory power of the predictors,
    the necessary dataset may be massive. Additionally, the labeled data needs to
    be relevant. Let''s think about why this can be challenging. Consider a new product
    launch, where the task is to predict the number of units in the first month. Since
    the product is new, there is no data. Consider a product which has been on the
    market for ten years. There is an abundance of labeled data. Then the world is
    gripped by a pandemic, and demand surges. The historical database is now irrelevant.
    For these reasons, supervised learning might not work.


    # 12.3 Unsupervised Learning


    Unsupervised learning problems aim to understand the structure of data that is
    not labeled. In this case, we have collected a set of observations $\{X_1, X_2,
    \dots, X_n\}$ where $X_i$ is again a $d$-dimensional vector of predictors. As
    shorthand, we will denote the dataset as $\{X_i\}_{i=1}^n$. We can ask questions
    of this data as:


    +   - Which of these data points are outliers? This can be used for outlier detection
    to flag suspicious activity, for example.

    - If we wanted to group the data points according to some distance metric, how
    should they best grouped? This can help discover substructure to understand different
    persons in the data, for example.

    - For a new data point, which group provides the best fit? For example, in an
    ideal case, we might find that bank transactions form two groups: fraudulent transactions
    and non-fraudulent transactions. The new data point, based on the values of the
    predictors, might clearly belong to the non-fraudulent group.


    Unsupervised learning can often be an iterative procedure, as algorithms require
    parameters such as the number of groups which often are unknown in advance. In
    some cases, the grouping can be used as a new variable in analysis. The most popular
    algorithm for unsupervised learning is $k$-means, and we will discuss this in
    detail later.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# 12.4 Semi-supervised Learning


    Semi-supervised learning (SSL) uses a combination of supervised and unsupervised
    learning. In some cases, there may be a small set of labeled data and a larger
    set of unlabeled data. We will review one approach to SSL. There are several other
    techniques, and the interested reader can consult [36].


    Consider a classification task. To get parties start, the small set of labeled
    data may be used to train a supervised learning model. Next, the unlabeled data
    can be run through the model, or scored. When the unlabeled data is scored, each
    data point is given probability of belonging to the positive class and the negative
    class (more on later). For the data points with a sufficiently high probability,
    they can be assigned the corresponding label. Table 12.1 shows examples of these
    and their probabilities originating from the positive and negative classes. Assume
    a required threshold of 0.90 for making a label assignment. In this case, data
    point 1 would be assigned to the positive class, as its probability of 0.91 exceeds
    0.90. The second data point would be assigned to the negative class as its probability
    of 0.96 exceeds 0.90. The third data point would not be assigned, as neither of
    its probabilities exceeds the threshold.


    TABLE 12.1: Labeling data based on probabilities.


    | Data Point | P(neg class) | P(pos class) | Action |

    |---|---|---||

