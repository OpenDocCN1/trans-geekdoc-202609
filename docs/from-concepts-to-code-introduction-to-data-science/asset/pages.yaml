- pgno: 253
  md: '# Hyperparameter Tuning


    # 12.8 Hyperparameter Tuning


    As mentioned earlier, some models use hyperparameters, and their best values are
    not known in advance. Some hyperparameters are integer-valued, such as the number
    of decision trees to grow, while others are real-valued, such as the penalty for
    using large hyperparameter values. A common practice for learning the optimal
    hyperparameters is *grid search*. This is an exhaustive search method that works
    like this:


    +   1. Provide a list of values for each hyperparameter values, fit the model

    2. For each combination of hyperparameter values,

    3. Evaluate model performance for each combination of hyperparameter values

    4. Determine which hyperparameter combination produced the best performance. These
    are the optimal hyperparameters.


    The benefit of grid search is that it is comprehensive, as it tries all combinations
    of listed values. However, there are some shortcomings:


    +   * For real-valued hyperparameters, it won''t be possible to try all values.
    A common approach is to try different orders of magnitude (e.g., 0.01, 0.1, 1,
    100)

    * Since the Cartesian product of hyperparameter values must be evaluated, this
    method is expensive. For example, if


    ```

    H1: [0.01, 0.1, 1, 100]

    H2: [1, 2, 3]

    ```


    grid search will proceed by trying each combination:


    ```

    (0.01, 1), (0.1, 1), ..., (100, 3)

    ```


    There are 5 x 3 = 15 combinations to try, which results in fitting and evaluating
    15 models.


    +   * The method will continue to evaluate areas of the search space that don''t
    look promising. This is because it doesn''t use information about the performance.


    Alternatives to grid search include Bayesian methods and random search. Bayesian
    methods focus attention on promising areas of the search space, while avoiding
    areas that don''t result in strong performance.'
  merge: -1
  img_proc: true
