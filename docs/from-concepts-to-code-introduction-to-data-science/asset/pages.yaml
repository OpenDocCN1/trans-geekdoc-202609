    # Binomial Distribution


    The *binomial distribution* is a discrete probability distribution that counts
    the number of successes of $n$ trials following a Bernoulli distribution with
    success probability $p$. The distribution can be written compactly as $Y \sim
    \text{Bin}(n, p)$. As an example, we can compute the probability of flipping one
    head out ten coin flips, where the probability of heads is 0.75. This can be calculated
    like this:


    ```

    $f(1) = \#(\text{ways to flip 1 head}) \times (\text{prob of 1 success}) \times
    (\text{prob of 9 failures})$

    ```


    The pmf expresses more generally for $y$ successes:


    ```

    $f(y) = \binom{n}{y} p^y (1-p)^{n-y} \text{for } y = 0, 1, \dots, n$

    ```


    where $\binom{n}{y}$ is the number of ways that $y$ can happen. For example, if
    $n = 10$ and $y = 1$, a success can occur in any trial and $\binom{10}{1} = 10$.


    # Uniform Distribution


    The *uniform distribution* is a continuous probability distribution on the interval
    $(a, b)$. It is denoted $U(a, b)$ and has pdf:


    ```

    $f(y) = \begin{cases} \frac{1}{b-a}, & \text{if } a < y < b \ 0, & \text{if otherwise}
