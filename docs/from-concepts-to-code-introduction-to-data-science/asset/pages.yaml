    # 6.3.2 Imputation


    Pandas offers several methods for imputing values, such as replacement with the
    median, the mean, a value of choice, or the last missing value. Like all things
    with data science, it is important to consider what makes sense conceptually.
    For any variable that is imputed, the analyst needs to ask what is appropriate.
    It may be the case that each patient needs its imputation method.


    For this dataset, there are several patients, and each patient has several observations.
    It might make more sense to use each patient''s data for imputation, rather than
    computing a statistic across all patients. The choice made here is to impute with
    the last non-missing value, or last value carried forward (LVCF). This might not
    be the true measurement at that time point, but it might be reasonable. The pandas
    ffill() function will accomplish this, and passing the parameter inplace=True
    will update the value in the dataframe.


    ```

    df.bp_diastolic.ffill(inplace=True)

    ```


    Checking for missing again returns records, meaning that imputation was successful.


    ```

    df[df.bp_diastolic.isnull() == True]

    ```


    OUT:


    | index | patientid | date | bp_systolic | bp_diastolic |

    |---|---|---|---|---|


    Looking at records around the previously missing row confirms the LVCF.


    > The number of unique patients can be computed with len(df.patientid.unique())'
