    To illustrate a real-world modeling assumption, I will draw from my first job
    as a credit derivatives researcher. To study different structures, we built financial
    models that took inputs such as the probability of default for various types of
    bonds. From a careful testings, we learned that a small change to the default
    assumptions could produce a large change in predictions. In fact, a small change
    could be the difference between a lucrative investment and financial distress.


    In measuring the impact on the output, we will need to decide exactly what should
    be measured. This might mean running the model on some important cases, such as
    interest rate forecasts for predetermined scenarios. It might mean running the
    model on the entire test set. The decision will depend on what is important to
    stakeholders and the business case.


    Once the analyst has identified what should be changed (e.g., a seed, a variable''s
    distribution, an assumed value), and what output should be measured, we can design
    the tests. Running the tests will produce output that might be supplemented with
    metrics, visualizations, and alerts. For example, an alert might be triggered
    if any test causes a change of 10% or more for any metric. The results can be
    reported to the appropriate stakeholders.


