  md: "![](img/7f40a2246fd3d2d5353d109f489c4e33_264_0.png)\n\nFIGURE 13.1: Scatter\
    \ Plot with Line of Best Fit\n\n$\\epsilon_i \\sim \\mathcal{N}(0, \\sigma^2)$\n\
    \nThe normality assumption is not necessary for fitting the model, but it is a\
    \ requirement in the statistical testing.\n\nNext, let's look at the mathematical\
    \ form for linear regression, which is stated for each observation $i$ and $p$\
    \ predictors:\n\n$y_i = \beta_0 + \beta_1 x_{i1} + \\dots + \beta_p x_{ip} + \\\
    epsilon_i, \\quad i=1, \\dots, n$\n\nwhere\n\n+   - $y_i$ is the target for observation\
    \ $i$\n-* $\beta_0$ is an intercept parameter\n-* $\beta_1, \\dots, \beta_p$ are\
    \ slope parameters or $weights$\n-* $x_{i1}, \\dots, x_{ip}$ are predictors for\
    \ observation $i$\n-* $\\epsilon_i$ is the error for observation $i$\n\nIn this\
    \ setup, we assume that the target can be modeled by a linear combination of predictors.\
    \ There is a linear equation for each observation, for a total of $n$ equations.\
    \ There are $p-1$ unknown, represented by the weights $\beta_0, \beta_1, \\dots,\
    \ \beta_p$, applied to each predictor. The weighted combination of predictors\
    \ is an attempt to match the target value.\n\nAs a small example, imagine we have\
    \ collected three observations $(1,2), (2,3), (3,5)$. There is one predictor,\
    \ and the first observation has predictor value 1 and target value 2. Given this\
    \ data, we can write three linear equations with two unknowns:"
  merge: -1
  img_proc: true
- pgno: 265
  md: "# Mathematical Framework\n\n```\n$$2 = \\beta_0 + \\beta_1(1) + \\epsilon_1$$\n\
    $$3 = \\beta_0 + \\beta_1(2) + \\epsilon_2$$\n$$5 = \\beta_0 + \\beta_1(3) + \\\
    epsilon_3$$\n```\n\nNow let's guess that $\\beta_0 = 0$ and $\\beta_1 = 2$. This\
    \ produces:\n\n```\n$$2 = 0 + 2 + \\epsilon_1$$\n$$3 = 0 + 4 + \\epsilon_2$$\n\
    $$5 = 0 + 6 + \\epsilon_3$$\n```\n\nFor the first equation, the weighted combination\
    \ of predictors exactly matches the target. For the next two equations, however,\
    \ there are errors. In fact, this system has more equations than unknowns, and\
    \ it cannot be solved. It is called an *overdetermined system*. An overdetermined\
    \ system is better than an *underdetermined system*, which results when there\
    \ are more unknowns than equations. Underdetermined systems cannot be solved.\n\
    \nIn algebra class, you might have seen systems where the number of equations\
    \ matched the number of unknowns. These systems can be exactly solved, which is\
    \ wonderful. In practice, it won't be possible to have a matching number of equations\
    \ and unknowns; we will collect observations generally outweigh the predictors:\
    \ $n > p$. To solve the overdetermined system, we will establish a metric and\
    \ an objective, such as minimizing squared errors. This procedure will yield estimates\
    \ $\\hat{\beta}_j$ for each parameter $\\beta_j$. Then the predictions can be\
    \ estimated with a fitting equation:\n\n```\n$$\\hat{y}_i = \\hat{\beta}_0 + \\\
    hat{\beta}_1 x_{i1} + \\dots + \\hat{\beta}_p x_{ip}$\n```\n\nIn the case of a\
    \ simple predictor ($p = 1$), we can drop the subscript on the predictor and write\
    \ the fitting equation:\n\n```\n$$\\hat{y}_i = \\hat{\beta}_0 + \\hat{\beta}_1\
    \ x_i$$\n```\n\nThis model is *simple linear regression*. In the case of multiple\
    \ predictors ($p > 1$), the model is called *multiple linear regression*. The\
    \ prediction $\\hat{y}_i$ is called the *fitted value*. The difference between\
    \ the target and the fitted value, $y_i - \\hat{y}_i$, is called the *residual*.\
    \ The residual is an estimate of the true, unobservable error.\n\nA common technique\
    \ for fitting a linear regression model is called *ordinary least squares regression*\
    \ (OLS regression), and this is what will be used here."
  merge: -1
  img_proc: true
- pgno: 266
  md: "A squared loss function is applied to the residuals. The objective of OLS regression\
    \ is to establish parameter estimates $\beta_0, \beta_1, \\dots, \beta_p$ that\
    \ minimize the sum of squared residuals $SS_{res}$ defined as:\n\n```\n$SS_{res}(\b\
    eta) = \\sum_{i=1}^n (y_i - (\beta_0 + \beta_1x_{i1} + \\dots + \beta_px_{ip}))^2\
    \ \\quad (13.1)$\n```\n\nMinimizing $SS_{res}$ with respect to $\beta$ can be\
    \ done with differential calculus, and this will yield a parameter estimate $\\\
    hat{\beta}_i$ for each parameter $\beta_i$. Next, we will review the details for\
    \ the simple linear regression case.\n\n# 13.1.1 Parameter Estimation for Linear\
    \ Regression\n\nLet us use the residual sum of squares for the simple predictor:\n\
    \n```\n$SS_{res}(\beta) = \\sum_{i=1}^n (y_i - (\beta_0 + \beta_1x_i))^2$\n```\n\
    \nThere are two parameters in this model: $\beta_0$ and $\beta_1$. Our strategy\
    \ is to simplify the equation and find a critical point. This is done by taking\
    \ the partial derivative with respect to each parameter (i.e., computing the gradient),\
    \ setting the equations to zero, and solving the system of equations.\n\n```\n\
    $SS_{res}(\beta) = \\sum_{i=1}^n (y_i^2 - 2y_i(\beta_0 + \beta_1x_i) + (\beta_0\
    \ + \beta_1x_i)^2) \\= = \\sum_{i=1}^n (y_i^2 - 2y_i\beta_0 - 2y_i\beta_1x_i +\
    \ 2\beta_0\beta_1x_i + \beta_1^2x_i^2)$\n```\n\nNext, take the partial derivative\
    \ with respect to $\beta_0$ and set to zero:\n\n```\n$\\frac{\\partial SS_{res}(\b\
    eta)}{\\partial \beta_0} = \\sum_{i=1}^n (-2y_i + 2\beta_0 + 2\beta_1x_i) \\=\
    \ 0 = -\\sum_{i=1}^n y_i + n\beta_0 + \beta_1\\sum_{i=1}^n x_i \\quad (text{(dividing\
    \ through } n) \\= 0 = -\bar{y} + \beta_0 + \beta_1\bar{x} \\quad (text{(dividing\
    \ by } n)$\n```\n\nWe used the definition of the mean in the final line: $\bar{z}\
    \ = \\sum_{i=1}^n z_i/n$.\n\nNow solve for the parameter estimate $\beta_0$:"
  merge: -1
