    # 10.4 Other Common Methods for Creating Predictors


    # 10.4.1 Binarization


    Binarizing data is commonly used to build a variable to reflect if something happened
    or not (e.g., a user viewed a video, a patient recovered). A binarized variable
    may sometimes be a better predictor than the original variable, as it can condense
    cases where counts are high. For example, in a dataset of movie viewers, most
    viewers viewed Titanic once or didn''t watch the film. There may be a small number
    of viewers who watched it ten or more times. To consolidate the information content
    of this data, it could be useful to binarize the variable into viewers and non-viewers.


