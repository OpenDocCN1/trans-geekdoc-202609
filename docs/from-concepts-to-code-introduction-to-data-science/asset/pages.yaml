- pgno: 373
  md: 'Final Thoughts


    355


    # Protein Folding


    A string of dozens to hundreds of amino acids determines the complex 3D shape
    of proteins in the human body. The shape determines how the proteins function,
    and knowledge of this shape can help researchers devise effective medications
    [52]. The number of amino acids and their possible interactions posed a massive
    combinatorial problem that has vexed scientists since the 1960s. In 2021, a model
    named AlphaFold was delivered by DeepMind. It uses a deep learning model trained
    on a repository of data to predict the 3D shape of proteins. In 2022, the team
    released protein structure predictions for nearly all catalued proteins to science.


    # Generative AI


    The transformer models mentioned earlier are behind deep learning models that
    can take a prompt from a user and generate entirely new content including text,
    code, and images. The Stable Diffusion model can create a detailed image from
    a text description. The GPT-4 model can accept input and produce text outputs.
    ChatGPT is a high-powered chatbot that can take the world by storm with its fluent
    responses to user prompts. The applications for generative AI are vast and include
    drafting documents, summarizing content, developing code, and providing educational
    assistance.


    Like groundbreaking technology, Generative AI offers a powerful tool for accelerating
    work. At the same time, the current models have shortcomings that need to be addressed.
    The training data can contain bias or toxic content which can be propagated by
    a model. If a model does not have sufficient information to answer a question,
    it can *hallucinate*, or craft incorrect responses. Human reviewers, including
    data scientists, can help improve these models to make them safer and more useful.


    # 18.7 Final Thoughts


    I hope that this chapter provided some good ideas of where to go next, and that
    it sparked excitement about where the field is headed. Finally, I sincerely hope
    that you enjoyed reading this book as much as I enjoyed writing it. Please feel
    free to reach out to me on LinkedIn, including a note that you read the book.


