  md: '# # 14


    # Classification with Logistic Regression


    In the last chapter, we learned a modeling approach when the target variable is
    continuous. In this chapter, we will learn a model for the case when the target
    is binary. This task is widespread across domains, such as predicting survival,
    the movement of a stock price, or the outcome of a sporting event. Logistic regression
    is an appealing model because it can work well in practice and the results are
    interpretable. The model is a good starting point before attempting more complex
    models.


    We will begin by outlining the mathematical framework, which makes use of the
    calculus concepts covered earlier. Following along is encouraged, a high-level
    understanding will be enough. Estimation of the parameters in logistic regression
    cannot be done in closed form, and we will review gradient descent as an iterative
    solution. Next, we will build a model to detect malignancy. Python packages will
    do the model fitting for us, but we will confirm the results by running gradient
    metrics. Additional resources can be found in the course repo in this folder:


    semester2/week_03_04_classification_and_logistic_regression/


    # 14.1 Mathematical Framework


    As in the regression task, a labeled dataset $(x_i, y_i)_{i=1}^n$ is available.
    The goal is to learn a function that can predict the target $y$ given $x$. We
    regard the outcome as an event that occurs $(y=1)$ with probability $p$ and does
    not occur $(y=0)$ with probability $1-p$. Given this setup, we need a function
    that takes predictors as inputs and produces the probability of the event as output.
    The predictors can potentially have domain $(-\infty, \infty)$.


    A first thought might be to reuse our linear regression approach, which consists
    of a linear combination of the predictors. The trouble with this approach is that
    the range can be $(-\infty, \infty)$, which is inconsistent with probabilities.
    Instead, we begin with the sigmoid function to model probabilities. It has form:'
