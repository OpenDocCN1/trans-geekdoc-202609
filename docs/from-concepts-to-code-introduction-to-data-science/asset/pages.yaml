    # 5.3.2 File Formats


    The file format is the structure of data in a file. The format can make easier,
    as it can follow conventions such as separating columns by a designated character,
    or compressing data strategically. There is a wide range of formats for specific
    kinds of data, such as MP4 for videos, JPG for images, and CSV, TXT, or DOCX for
    files.


    The formats we will use the most for data are CSV and TXT. The CSV format separates
    columns with the comma delimiter. It can be very useful when each row contains
    the same number of CSV columns. Here is a small example of what the first few
    rows of a CSV file look like:


    ```

    year,location_captured,females,males,cubes,unknown_sex,total

    2014,China,14,11,2,0,27

    2014,Russia,25,21,3,2,5

    ```


    This dataset includes a header row which provides the names for each field. The
    header is not always included, and it is best to check this before plunging ahead
    into analysis.


    The TXT format is very useful when the data doesn''t follow a structure, such
    as the contents of a web page or a document.


    A format that is increasingly useful in big data is the Parquet format, which
    stores a dataset by its columns, along with its metadata. It provides efficient
    data compression for fast storage and retrieval.


    Python provides functions for easily saving and loading file formats. It won''t
    be necessary to spend time writing code to loop over rows of data and load'
