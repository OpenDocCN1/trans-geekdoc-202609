  md: '# 310 Elements of Reproducible Data Science


    from unittest import TestCase


    ```

    # check if two statements are equal

    actual1 = 100 % 2 == 0

    expected = True

    ```


    ```

    # create TestCase object

    tc = TestCase()

    ```


    ```

    # run test to assert equality, printing the result

    # the tests, returning None

    tc.assertEqual(actual1, expected)

    ```


    ```

    # run a second test, with different answer

    # this will fail and throw an error

    actual2 = 100 % 2 == 1

    tc.assertEqual(actual2, expected)

    ```


    The unittest module includes the TestCase class, which provides a number of methods
    to check and report failures. In the first test, we compute an actual value which
    evaluates to True (100 divided by 2 has remainder 0). The expected value is True.
    The assertEquals() method checks that the actual value matches the expected value.
    Since these values match, the test passes. For the second test, we compute an
    actual value which evaluates to False. The assertion checks if False is equal
    to True, which is a false statement. The output includes:


    ```

    raise self.failureException(msg)

    AssertionError: False! = True

    ```


    Upon reviewing the output, the data scientist can investigate the code, correct
    the error, and rerun the code. This can be repeated until all of the tests pass.
    unit tests used simple arithmetic to produce the actual values. In practice, a
    more common way to generate actual values is to pass the inputs to the model and
    run inference (make the predictions). Next, the relevant output can be used for
    the actual values. For a classification task, the actual might be predicted probabilities.
    For a regression task, the actual are the predicted target values.


    There are times when a test fails because it is written improperly. The developer
    needs to carefully review the tests and run them, to ensure they meet expectations.
    This may seem circular or excessive, but it can happen and faulty logic is often
    the culprit. One way to mitigate these errors is to design tests consistently.
    Specifically, testing some functions with assertEqual() and others with assertNotEqual()
    can lead to confusion. It can be better to design the latter tests to check for
    equality.'
