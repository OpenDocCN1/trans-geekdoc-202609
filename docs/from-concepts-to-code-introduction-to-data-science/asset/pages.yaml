  md: '# 17.9 Case Study: Fair Lending Risk


    This section will provide a detailed, computational example of fair lending risk.
    We will start with some background on the topic.


    # 17.9.1 Fair Lending Background


    Lenders such as commercial banks offer loan products to customers. For many, this
    is a major pathway for purchasing a car or home, or affording college. The lender
    will decide which applicants should be approved for a loan (the underwriting decision)
    and what interest rate should be offered (the pricing decision). Lenders want
    to avoid the possibility of nonpayment, or default, on part of the loan or the
    full amount, and other things, to make lending decisions. Decisions which lead
    to rejecting applicants or offering higher interest rates will promote unfair
    practices.


    Unfortunately, some lenders include bias – knowingly and unintentionally – in
    their decision. There are many ways that this can happen. In one pathway, decisions
    are biased against certain groups of individuals. If data is used to train a model,
    the model will learn the patterns and systematically propagate unfair lending
    practices. A second possible origin is data imbalance. For example, there may
    be lopsided quantities of male and female loan applicants at a bank. There are
    tools for identifying and remedying bias and unfairness in data and models, such
    as SageMaker Clarify from AWS [48].


    Federal bank regulatory agencies such as the Office of the Comptroller of the
    Currency have developed approaches to address unfair and deceptive lending practices.
    The Fair Housing Act and the Equal Credit Opportunity Act protect consumers by
    prohibiting unfair and discriminatory practices. Discrimination in credit and
    real estate transactions is prohibited based on factors:


    +   * Race or color

    * National origin

    * Religion

    * Sex

    * Age (provided the applicant is old enough to enter into a contract)

    * Women


    A protected class refers to groups of individuals protected by anti-discrimination
    laws, such as:'
  merge: -1
  img_proc: true
