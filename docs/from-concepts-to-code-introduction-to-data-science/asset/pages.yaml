    # 5.1.3 Storage


    The hard drive, also called disk space or disk is another option for data storage.
    Disk is used to store files supporting the operating system, files for running
    applications, and miscellaneous files. Disk is much less expensive than RAM, but
    it is much slower for file access, which translates to slower processing speeds.


    The two main types of disk storage are the older hard disk (HDD), technology and
    the newer solid-state drive (SSD). The HDD consists of a spinning platter (the
    disk) and an arm containing several heads. The arm moves across the platter to
    read and write data. SSDs are mechanically very different, as they do not use
    a spinning disk and arm, they can be smaller, and the time to read and write is
    much faster. SSDs are generally more expensive than HDDs, but the cost has been
    falling over time.


    # 5.1.4 Motherboard


    The motherboard is a board with integrated circuitry that connects all of the
    principal hardware components. It distributes electricity from the power supply
    to the essential components, including the CPU, GPU, RAM, and disk.


    # 5.2 Software


    Software is the set of instructions used to operate computers and execute tasks.
    It can be stored on disk or in memory. The most important software on the computer
    is the operating system, or OS. The OS manages the computer''s memory and processes,
    including all of its hardware and software. Bringing up the system information
    page will show the OS name, version, and other specifications.


    There will be some user experiences depending on the running OS. Visual differences
    will be most apparent, as the backgrounds, icons, and window panes will look different.
    Functionality will also vary between the operating systems, and we will discuss
    how directories are structured.


    > Tip: The Mac operating system derives from the Linux operating system, and explains
    why some of their functionality is the same or very similar. This also explains
    why instructions may be grouped for Mac and Linux users. This book will use this
