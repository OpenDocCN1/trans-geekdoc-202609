  md: '# 6.1.3 Variables


    We assigned the path to a variable named PATH_TO_DATA


    Variables are used in computer science to store information to be used by the
    program. They are fundamentally different from variables in mathematics, and this
    can cause confusion for the uninitiated. In mathematics, variables are unknown
    quantities. In computer science, variables are known, and their values are stored
    in a memory address. If we want to use the memory address, we can use the id()
    function like this:


    ```

    id(PATH_TO_DATA)

    OUT:

    234078058544

    ```


    The output is a memory address, which is not particularly illuminating on its
    own. However, sometimes this function is useful to check if two variables are
    truly different. If they both point to the same memory address, then they are
    the same.


    The names of Python variables need to follow the rules:


    +   * Names must start with a letter or underscore character

    * Names must contain only letters, numbers, and the underscore character

    * Reserved keywords such as return cannot be used


    Also of note: names are case-sensitive. VAR, VaR, and var are different variables.
    Let''s try to break a rule and see what happens:


    ```

    4badvar = 5

    OUT:

    Input In [11]

    4badvar = 5

    SyntaxError: invalid syntax

    ```


    Python throws a syntax error, due to an invalid variable name. In this case, it
    doesn''t like that the variable begins with a number.


