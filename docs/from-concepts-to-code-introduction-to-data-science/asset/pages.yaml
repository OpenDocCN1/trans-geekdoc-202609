    The calculation strategy used by neural networks is to apply a set of weights
    to the values in layer of nodes and add a bias term $b$; the bias term plays the
    same role as the intercept term from regression. The result is an expression like
    this: $b_i + w_1x_1 + \dots + w_nx_n$. This expression may remind you of the linear
    combinations of predictors in regression. The difference is purely notational,
    with the role of $\hat{y}_i$ being very different from regression, however a non-linear
    *activation* function is applied to the expression. There are several commonly
    used activation functions, and their purpose is to give the model flexibility
    to capture non-linear relationships between inputs and the target. After the inputs
    are weighted, adjusted by a bias term, and passed through the activation function,
    the intermediate quantities may pass through these steps one or more times. This
    is a composition of functions, and different sets of weights and biases are used
    in each layer of the network. To organize the calculations the weights are stored
    in a matrix $\mathbf{W}$ and the biases are stored in a vector $\mathbf{b}$. Given
    an increasing number of parameters, useful activation functions, and a host of
    other features, neural networks can fit extremely rich, complex patterns in data.


    The mathematics necessary to study neural networks is mostly things you already
    know. The *forward* phase of pushing inputs through the model and arriving at
    predictions uses arithmetic operators, matrix algebra, and the compositions of
    functions. The more intricate part is optimizing the weights'
