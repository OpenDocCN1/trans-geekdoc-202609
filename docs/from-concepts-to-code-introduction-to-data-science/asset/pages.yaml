    # 18.2 Advanced Technique: Regularization


    One of the biggest risks faced by a machine learning model is overfitting. To
    mitigate this issue, we learned data splitting as a strategy. In this approach,
    the model performance is evaluated on a separately held out set of data. This
    provides an independent assessment of performance that is less likely to overfit
    the nuances of data.


    Another powerful technique to prevent overfitting is regularization. Regularization
    takes the view that overfitting might be caused by model parameters that are too
    large. This may happen, for example, when the data sample is small and some of
    the observations are spurious. If you recall, OLS regression selects parameter
    estimates that minimize the sum of squared residuals. For a model with $p$ predictors,
    the loss function looks like:


    ```

    $$SS_{res}(\beta) = \sum_{i=1}^{n}(y_i - (\beta_0 + \beta_1x_{i1} + \dots + \beta_px_{ip}))^2$$

    ```


    To keep the parameter estimates small, regularization introduces a penalty term
    in this function. Its goal is to shrink the parameters toward zero. There are
    different penalty terms depending on the regularization technique used, and for
    implementation we consider Lasso regression. It is worth noting an important feature
    of Lasso regression: if multiple predictors are highly correlated, only one of
    them will be included in the model. The remaining predictors will have coefficients
    of zero. If this effect is not desired, then a different penalty term will be
    warranted.'
  merge: -1
  img_proc: true
- pgno: 364
  md: 'The penalty term in Lasso regression consists of two parts: the sum of the
    absolute value of the parameter estimates, which penalizes magnitudes, and a scalar
    $\lambda$ which controls the relative importance of the penalty term versus the
    sum of squared residuals term. The regularization term for $p$ parameters looks
    like this:


    ```

    $$\lambda \sum_{j=1}^p |\beta_j|, \quad \lambda \ge 0$$

    ```


    The loss function for Lasso regression with $p$ predictors combines the two terms
    as:


    ```

    $SS_{res}(\beta) = \sum_{i=1}^n (y_i - \beta_0 + \beta_1 x_{i1} + \dots + \beta_p
    x_{ip})^2 + \lambda \sum_{j=1}^n |\beta_j|, \quad \lambda \ge 0$$

    ```


    The first term can be minimized by selecting parameter estimates which bring the
    predictors closer to the response values $y_i$. At the same time, the second term
    adds a positive quantity which increases with the sum of the magnitudes of the
    parameter estimates. Specifically, increasing any coefficient $|\beta_j|$ will
    increase the penalty. Additionally, increasing $\lambda$ will increase the value
    of the loss function. Ultimately, the optimal parameter estimates must strike
    a balance between these two terms.


    Earlier, we encountered parameters, which are important quantities in the configuration
    of a model. Additionally, their values are not known in advance. The $\lambda$
    term is an example of a hyperparameter, and a common way to estimate its value
    through k-fold validation. Here is an outline of possible steps:


    +   1. Provide a list of possible values for $\lambda$. We can start with 10 since
    we are near the right of order of magnitude. This is the hyperparameter grid.
    Referring to this set as $\Lambda$, we might use $\Lambda = \{1 \times 10^{-4},
    1 \times 10^{-3}, \dots, 1 \times 10^3, 1 \times 10^5\}$.n2. Decide on the number
    of folds $k$\n3. Set aside portion of the dataset for final evaluation (a test
    set)\n4. For each possible $\lambda_i \in \Lambda$, repeat these steps:


    For iterations $1, \dots, k$, train the model on $k-1$ folds and evaluate a metric
    such as MSE on the left-out fold. Each iteration should leave out a different
    fold.


    The average MSE to attain the final estimate $MSE_i$.'
