    # Normal Distribution


    The *normal distribution* or *Gaussian distribution* is a continuous probability
    distribution on the interval $(-\infty, \infty)$. It is a famous distribution
    with a bell-shaped pdf. Many random variables, the sum of a large number of independent,
    identically distributed (i.i.d.) random variables follow an approximately normal
    distribution. The normal distribution is fully defined by two parameters: the
    mean $\mu$ and variance $\sigma^2$ with $\sigma>0$. It is commonly denoted $N(\mu,\sigma^2)$.
    The mean measures the center of the data while the variance measures the spread
    of the data. We will discuss these quantities in more detail. The pdf of the normal
    distribution is:


    ```

    $f(x) = \frac{1}{\sigma\sqrt{2\pi}} \exp\left(-\frac{(x-\mu)^2}{2\sigma^2}\right),
    \-\infty < x < \infty$

    ```


    The closed-form of the normal distribution is computed numerically, as there is
    no closed-form solution. In practice, values are easily obtained through software.


    # Standard Normal Distribution


    The *standard normal distribution* is a continuous probability distribution that
    derives from the normal distribution. A normally distributed random variable $X$
    can be converted to a random variable $Z$ with standard normal distribution through
    the formula:


    ```

    $Z = \frac{X-\mu}{\sigma}$

