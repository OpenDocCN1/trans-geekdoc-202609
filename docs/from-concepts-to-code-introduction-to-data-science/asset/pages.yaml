  md: "# Appendix: Parameter Estimation in Matrix Form\n\nparameter values minimizing\
    \ the sum of squared differences between targets and predictions. The differences\
    \ are called residuals.\n\nVariables used as predictors should be intuitive and\
    \ they should avoid introducing biases and ethical issues into the model. While\
    \ demographic variables might increase explanatory power, they can systematically\
    \ discriminate against subpopulations.\n\nWe fit a linear regression model to\
    \ California housing prices to predict home price. During the exercise, we split\
    \ the data, scaled the predictors, the model, and assessed performance. We measured\
    \ the $R^2$ on the test set, which represents the fraction of variance in the\
    \ target explained by the model. Additionally, we produced a residual plot and\
    \ a fitted-actual plot to diagnose zero patterns and a random scatter about, but\
    \ in fact, this data showed a pattern and was far from random. This suggests more\
    \ work ahead, as including additional features. Lastly, we fit a second model\
    \ to the data and compared model performance with adjusted $R^2$. This metric\
    \ penalizes for additional complexity making it appropriate for comparing regression\
    \ models of different size.\n\nIn the next chapter, we will work with data to\
    \ predict a target which can take two possible values. This is the binary classification\
    \ problem, and we will learn a very useful and prevalent model for tackling it:\
    \ *logistic regression*.\n\n# 13.5 Appendix: Parameter Estimation in Matrix Form\n\
    \nWe return to the system of equations in compact matrix notation:\n\n```\n$y\
    \ = X\\beta + \\epsilon$$\n```\n\nNext, we write the equation for the sum of squared\
    \ residuals:\n\n```\n$SS_{res}(\beta) = (y - X\\beta)^T(y - X\\beta)$\n```\n\n\
    Now we take the derivative of $SS_{res}$ with respect to $\\beta$. This is like\
    \ taking the derivative of quadratic function $(y - X\\beta)^2$. The result is\
