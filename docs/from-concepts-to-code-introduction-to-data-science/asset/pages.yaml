    # 5.4 Shell, Terminal, and Command Line


    The ability to interact with the operating system of a computer is provided by
    the shell. The shell is a computer program that takes commands, interprets them
    for the OS, and outputs the results. It is called a shell because it wraps around
    the operating system.


    Most Linux and Mac operating systems use *Bash* as the default shell. Windows
    machines come preloaded with two shells: *cmd* and *PowerShell*. There are several
    other shells, but at a basic level, they all support user interaction, and they
    differ in their functionality. Some power users can get quite particular about
    their shells!


    There are two ways that users can interact with the shell: visually through the
    *graphical user interface* (GUI), and through the CLI. Most users are familiar
    with clicking icons in a GUI. Use of the CLI is often through a terminal environment.


    On a Mac, users can bring up terminal with Spotlight (search for “terminal”).
