    # 5.8 Cloud Computing


    Cloud computing is the delivery of computing services over the internet. It provides
    tremendous flexibility compared to computing with the machines premises. Advantages
    include:


    +   - a wide variety of processors and storage, including state-of-the-art GPUs

    - Automated scaling of hardware to match demand. This can be very cost effective
    by buying machines to match peak demand and having them sit idle for the remainder
    of the year.

    - Highly durable data storage that reduces the risk of data loss

    - Features for automating the deployment of services, such as model predictions

    - Advanced security features


    Cloud service offerings are commonly grouped into categories which often interact:


    +   - IaaS, or infrastructure as a service, provides access to servers, storage,
    and networking. This is the back-end infrastructure required for running applications
    and workloads.

    - PaaS, or platform as a service, is a cloud environment that includes everything
    to build, run, and manage applications

    - SaaS, or software as a service, is on-demand access to cloud-hosted applications


    Cloud providers own and maintain warehouses of hardware, and customers can access
    these resources virtually through an internet connection. Security is essential
    in this setup, whereby an organization''s data is transmitted and placed on external
    servers which are shared by others. Customers pay only for what they use, which
    is called consumption-based pricing.2 Providers offer a variety of hardware and
    software for different use cases and patterns,


    > Note that forgetting to shut down a server, an issue called "leaving the lights
    on," will incur billing charges.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# Cloud Computing


    such as compute-intensive jobs and storage-intensive. The warehouses are secure
    and climate controlled, and they are placed throughout the world to offer fast
    response times with high availability. Data can be copied to multiple locations
    to reduce the likelihood of data loss. This practice promotes durability of data;
    note that each copy of data incurs costs. Compute jobs can be set to automatically
    scale as the required resources increase or decrease.nFor example, additional
    servers can be added if there is a surge in customer demand.


    The number of cloud-provider services has grown rapidly in the last years. Early
    services include compute (for processing a batch of data with Python, file storage,
    and database storage. Today, there are services for game development, end-to-machine
    learning, generative AI, chatbots, and hundreds of other applications. The services
    respond to customer demand, and competition works to guide prices lower.


    The largest cloud providers are Amazon Web Services (AWS), Microsoft Azure, Google
    Cloud Platform (GCP), Alibaba Cloud, and Oracle Cloud. AWS was first to market
    and it is the largest cloud provider by market share. The top three are fierce
    competitors offering similar services. Some of the key differentiators are the
    number of regions/zones, the pace of innovation (e.g., better hardware, fully
    featured services), the level of customer service, and pricing. For example, some
    providers build their own GPU chips to accelerate machine learning and bring down
    pricing.


    The table below lists services offered by the three largest cloud providers. Data
    and relational (SQL) databases will be discussed later; the former is used for
    unstructured data, while the latter is used for structured data.


    | Service | AWS | Azure | GCP |

    |---|---|---|---|

    | Compute | Amazon EC2 | Virtual Machines | Compute Engine |

    | Data | Amazon S3 | Blob Storage | BigQuery |

    | SQL DB | Amazon RDS | SQL Database | Cloud SQL |

    | ETL | AWS Glue | Data Factory | Cloud Data Fusion |

    | ML | SageMaker | Machine Learning | Vertex AI |


    Most of the 500 companies use cloud-based services. This makes cloud skills essential
    for data science and related roles. Here is a brief sketch of how a data scientist
    Carla works in the cloud: Carla arrives at the office to test a new predictor
    in a system that her team built. She logs into the AWS Management Console and
    launches SageMaker Studio. She opens a notebook and starts the EC2 compute instances.
