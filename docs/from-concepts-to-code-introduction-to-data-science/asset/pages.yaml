    \n# 9.2 Inferential Statistics\n\nThe topic of inferential statistics is vast.\
    \ For our purposes, we will review ideas and specific examples. Suppose that we\
    \ set out to provide an alternative hypothesis (denoted $H_A$) about a population\
    \ parameter $\theta$. The current belief is the null hypothesis, denoted $H_0$.\
    \ The current belief might be that $\theta$ is equal to some value $\theta_0$,\
    \ while the alternative belief is that $\theta$ differs from $\theta_0$. This\
    \ can be stated formally as\n\n```\n$H_0: \\theta = \\theta_0$\\nnH_A: \\theta\
    \ \\neq \\theta_0$\n```\n\nFor example, we might hypothesize that the mean batting\
    \ average of a baseball player is 0.300. In this case, the parameter of interest\
    \ is the population $\\mu$, the null hypothesis is $H_0: \\mu = 0.300$, and the\
    \ alternative is $H_A: \\mu \\neq 0.300$.\n\nTo provide evidence to reject the\
    \ null hypothesis $H_0$, we can collect a sample of the population and compute\
    \ an estimate the test"
