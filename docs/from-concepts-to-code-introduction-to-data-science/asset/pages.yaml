  md: '# 16.3 Containers


    After the data science team completes a model, it will be delivered to engineering.
    It will be staged in a testing environment to ensure that everything works properly.
    From there, the model will be promoted to a production environment for deployment.
    Oftentimes when running the code on another machine, there may be compatibility
    issues which cause failure. There may be a difference in Python versions or Python
    modules, for example. It can take great effort to keep all machines running the
    same package versions (consider some organizations use different or machines).
    Moreover, it may not be possible to sync all versions. For example, two different
    ML applications may require different versions of a module.


    The container emerged to maintain consistent, isolated project environments. It
    is a standalone, executable package containing everything needed to run an application.
    This will include software, configurations, and variables. The package can be
    shipped to another machine, and run on that. It is even possible for a single
    machine to run multiple containers with different package versions. For example,
    a cloud server might run several machine learning models at the same time.


    Virtualization technology that allows software to simulate hardware functionality,
    creating a virtual computer system. Containers are designed to share the operating
    system of a host, rather than requiring their own copies. This is particularly
    helpful when multiple containers run on the same machine. Based on this, we say
    that containerization is lightweight.


    Virtualization is different from containerization.


    The universally accepted, open-source tool for containerization is Docker. Getting
    started with Docker includes learning some of the terminology and basic commands,
    which we outline below. A Docker image is a read-only file that contains instructions
    for creating a container. We can think of image as a template. New images can
    be created, and they can also be shared. The online repository DockerHub has a
    large array of Docker images for the community (see dockerhub.com). .


    A Docker container is a runtime instance of a Docker image. As we will see shortly,
    it is created by running the docker run command. A container can run on any machine
    that has Docker installed. This allows great portability, as Docker can run on
    machines including a laptop, local server, or cloud server. Docker runs on operating
    systems including Linux, Windows, and Mac.


    # 16.3.1 Installing Docker


    For current Docker installation instructions and other details, please see the
    official Docker documentation here: https://www.docker.com/. Many organizations
    will opt for installing Docker on a Linux machine running in the'
