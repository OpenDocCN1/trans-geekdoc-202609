    # 10.3 Transforms for Treating Data Representation


    Recall the California wildfire news article. We processed the data, tokenizing
    the document into words. Suppose that we wanted to automatically determine, classify
    the topic of the article based on the frequency of the words. This is a standard
    task accomplished with a machine learning model, but the model cannot directly
    accept words, which are strings. We will need to transform the data into an appropriate
    quantitative form. The type of model (e.g., regression) and its implementation
    will dictate the precise form. In the next sections, we will review common transformations
    for representing text and categorical data.


    # 10.3.1 Count Vectorizer


    To make progress on the automated topic classification task, we can represent
    each document as a set of words and their frequencies. The CountVectorizer() transform
    from sklearn can be used for this task. Here is a short code example that processes
    two documents; the first is drawn from the wildfire article we encountered early,
    and the second is about sports. By default, each document will be tokenize into
    words, and a matrix with counts on the rows and the words on the columns is computed.
    The element in row $i$ and column $j$ of the matrix will show the number of times
    that word $j$ appears in document $i$. The matrix of these counts can later be
    passed to a machine learning model for topic determination.


    ```

    from sklearn.feature_extraction.text import CountVectorizer

    docs = [''The 2021 California wildfire season was

    series of wildfires that burned across the

    .S. state of California.'',

    ''Golden State Warriors basketball team is

    located in California.'']

    ```'
