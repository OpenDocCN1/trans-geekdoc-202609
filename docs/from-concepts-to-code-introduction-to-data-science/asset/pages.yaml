- pgno: 347
  md: '# Stress Testing


    # 17.7 Stress Testing


    For certain models, it will be appropriate or even necessary to run them on pleasurable,
    extreme scenarios to measure the output. The scenarios often represent adverse
    conditions, although it is not required. We might predict a model''s performance
    in strongly and weakly performing markets, for example. The difference between
    stress testing and sensitivity analysis is that the former makes material changes
    to inputs, while the latter makes small changes to modeling assumptions. We expect
    the outputs to change dramatically when running stress tests, and we use the information
    to prepare and consider if the model is functioning properly.


    For an example of stress testing, we might apply a financial model to estimate
    the impact of a dot-com crash or an inflation surge on an investment portfolio.
    To be sure, a future event will not mimic a historical event, but it can give
    a sense of the magnitude of risk. After building an inventory of scenarios and
    applying the model, there will be a set of account outcomes as in Table 17.4.
    The analyst should question whether the results make sense. For example, if a
    historical event resulted in a 37% loss, and the model is predicting a 5% gain,
    this should elicit suspicion that the model may be problematic. Perhaps the model
    needs better specification for extreme inputs, and its structure should be reconsidered.


    When the analyst is satisfied that the model is functioning properly for the stress
    tests, the calculation, testing, and reporting processes can be automated. Regular
    review of the outcomes should be conducted as part of ongoing monitoring (to be
    discussed next). Additionally, the stress test scenarios will likely need to be
    updated during the model lifecycle.


    TABLE 17.4: Sample Stress Tests


    | scenario_id | name | description | outcome |

    |---|---|---||

    | 1 | Market Up | S&P 500 up 20% | +25% |

    | 2 | Market Down | S&P 500 down 20% | -25% |

    | 3 | Volatility | CBOE vix up 20% | -15% |

    | 4 | Volatility Down | CBOE vix down 20% | +15% |

    | 5 | Dot-com Crash | Repeat of dot-com bubble | -32% |


    Now that we have discussed both sensitivity analysis and stress testing, we can
    revisit the Columbia University case. If one or more of the model inputs between
    2021 and 2022 changed drastically, this might have been more like a stress test
    than sensitivity analysis. This could explain the large change in ranking (but
    don''t quote me on this).'
  merge: -1
  img_proc: true
- pgno: 348
  md: '# 17.8 Ongoing Model Performance Monitoring


    Models need to be monitored to ensure that operational and predictive performance
    meet expectations. Operational performance includes response time and uptime,
    for example. The response time is the elapsed time from when the request is made
    to when the client receives the first byte of the response. The uptime is the
    percentage of time that the system is available and working properly. Predictive
    performance will quantify prediction errors using metrics such as recall and precision.
    Recall will measure the fraction of positive labels that were detected by a classifier,
    while precision will measure the fraction of predicted positives. A data scientist
    will generally focus on predictive performance.


    Before a model is placed in production, a performance monitoring plan should be
    drafted and agreed upon by key stakeholders. There should be a governing body
    which provides oversight and has the authority to enforce the plan, should action
    be needed. The plan should include but is not limited to these elements:


    +   - The metrics to be monitored

    - For each metric, the thresholds that should trigger an alert

    - The next steps when a threshold is crossed. This should mention stakeholder
    responsibilities.

    - The review frequency

    - The name, title, and voting authority of each person on the model review committee


    Here is a small, fictitious example which elaborates on the elements listed above:


    # START OF PERFORMANCE MONITORING PLAN


    | Model ID | 123 |

    | Model Name | Student Loan Default Model |

    | Date of Report | 2023-04-15 |

    | Period Covered | 2023-01-01 through 2023-03-31 |

    | Review frequency | quarterly |'
  merge: -1
  img_proc: true
