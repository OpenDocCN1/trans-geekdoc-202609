- pgno: 41
  md: '# 3 Data Science Project Planning


    This chapter discusses the earliest steps in the data science pipeline, which
    consist of planning activities. The first step is gaining clarity on the problem
    that needs to be solved, the requirements, and the constraints. The problem is
    often stated as a business objective, as increasing the profitability of a product.


    Next, the data science team needs to state the problem in an analytical framework.
    For example, a specific machine learning technique might work well, combined with
    a loss function and metrics. The executives won''t need this level of detail,
    the team doing the work will use this blueprint to move forward.


    Finally, a plan for data collection needs to be in place. The data might already
    be available, or it might need to be collected or purchased. If there is no way
    to get the required data, the project won''t be able to move forward, so it is
    important that it is discovered early.


    # 3.1 Defining the Project Objectives


    In traditional software development projects, software teams are accustomed to
    spending a lot of time and attention writing requirements. The development work
    won''t start until this stage is completed. Data science should follow a similar
    disciplined process. It may be tempting to launch into analysis, but without a
    process, the project can diverge from the problem that needs to be solved. The
    initial planning can help clarify objectives and identify resources that are needed,
    such as data, tools, and key people.


    Data scientists work on a mix of internal projects for the company and external
    projects for customers. Either way, it is essential for the objectives to be defined
    and clear to all stakeholders. For example, at startup company, my team was tasked
    with building a system that could detect objects in images. When we asked the
    customer about the level of performance it would need, they responded with a required
    predictive accuracy of 75%. We got to work, building computer vision models and
    a massive dataset of images. As the project progressed, the accuracy target kept
    increasing ... 80%, 85%. Even worse, when we clarified the metric, it turned out
    that accuracy wasn''t'
  merge: -1
  img_proc: true
- pgno: 42
  md: '24 Data Science Project Planning


    what they cared about! The customer was adamant that when the model detected the
    object, it needed to be right. They were not concerned about cases where the model
    did not detect the object. This meant that the metric was actually precision not
    accuracy (we will learn more about metrics later). Ultimately, my team was not
