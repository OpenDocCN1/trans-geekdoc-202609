    # 17.6 Sensitivity Analysis


    The U.S. News and World Report is one of the most followed college ranking systems
    in the United States. Between 2021 and 2022, Columbia University plummeted from
    a ranking of 2 to a ranking of 18. This was caused largely by inaccurate data,
    and it prompted questions about the validity of a system with such a large sensitivity.
    Was the model faulty? This is difficult to say without an audit of the model and
    data, and I am not here to criticize the approach. I do point out the importance
    in assuring that small changes to modeling assumptions do not lead to large changes
    in outputs. A small change to a parameter or the addition of a predictor will
    result in massive changes, which can lead to backlash.


    An important practice in model validation is conducting sensitivity analysis,
    which quantifies how a change in modeling assumptions translates to a change in
    output. In turn, changes impact performance metrics. There are two pieces I wish
    to expand upon: the modeling assumptions, and the measurement of output. Let''s
    discuss these in turn.

    When we think about modeling assumptions, this might include things like used
    system dynamics, distributions of random variables, relationships between parameters,
    and hyperparameters. The thoughtful developer considers each of these elements,
    makes decisions, and builds the model to express the decisions. For example, we
    decided that a certain hyper should have a value of 10, and tested values both
    near and far from 10. The developer might have considered different distributions
    for predictor $X$, deciding that a normal distribution is more appropriate than
    a t-distribution. Let''s list some of the choices we encountered so far:


    +   - When we split the data into a training set and a test set, we used a seed
    for the random selection of rows. A different seed would likely have split the
    data differently.


    +   - We had a choice of methods for imputing missing data. For example, we might
    have imputed with the median or mean of a variable.'
