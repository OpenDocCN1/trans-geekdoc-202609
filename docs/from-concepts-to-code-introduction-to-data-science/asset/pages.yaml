    # 10.3.2 One-Hot Encoding


    Categorical data may have discrete values where direct computation on the values
    does not make sense. Marital status (e.g., ''single'', ''married''), education
    level (e.g., ''high school'', ''some college''), and zip code (e.g., 11787) are
    examples. The first two examples are string types, it may be obvious they are
    not quantitative, while zip code might not be so obvious. For each of these cases,
    they cannot be averaged, for example. To include these variables in a model, they
    can be transformed to an amenable representation using one-hot encoding (OHE).


