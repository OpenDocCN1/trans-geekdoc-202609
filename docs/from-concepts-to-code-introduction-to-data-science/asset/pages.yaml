    # ## 13.1 Mathematical Framework


    Returning to our labeled data $\{(x_i, y_i)\}_{i=1}^n$, we want to learn a function
    that can predict the target $y$ given $X$. A linear regression model specifies
    a linear relationship between $X$ and the target $y$. This is a simpler structure
    than a nonlinear model, which will make it easier to explain and fit to data.
    The tradeoff is that for a complex relationship between predictors and target,
    the linear model might not fit well. In this chapter, we will specify precisely
    what we mean by the fitting well. For some intuition, consider a single predictor
    $X$, its associated response $Y$, and a set of observations $(x_1, y_1), (x_2,
    y_2), \dots, (x_n, y_n)$. A linear model that best fits the data will minimize
    its distance from the points, in effect “passing through” a majority of them as
    in Figure 13.1.


    For each observation $i$, the error in measuring the target in linear regression
    is $\epsilon_i$. A common assumption made in linear regression is that the errors
    follow a normal distribution with mean zero and variance $\sigma^2 > 0$. This
    is often written as'
  merge: -1
  img_proc: true
