  md: '# 10


    # Data Transformation


    We have ingested and processed raw data into cleansed data that promises to be
    useful in further analysis. The end goal might be visualizing data for review
    by leadership, producing quantitative summaries to share with customers, or a
    machine learning model for predicting an outcome. There is a large step that is
    missing, and that is maximizing the signal in the cleansed data. Specifically,
    we might want to know how two variables are correlated. It might be important
    to understand if one or more variables are trending over time (that is, their
    mean is increasing or decreasing).


    Unfortunately, there are factors that get in the way of easily discerning a signal
    in data, and chief among them are noise, scale, and data representation. We will
    start by exploring transformations, or transforms, for handling these challenges.
    In the interest of space, we will cover a selection that is common and useful.


    It is also possible to create new predictors which may produce insights and improve
    models. This activity can be a fun and creative process. We will consider some
    examples for illustration.


    # 10.1 Transforms for Treating Noise


    Many variables are subject to different kinds of noise, or error. Measurement
    error can result from random error in a system, such as electrical disturbances.
    Human error can result in transmitting incorrect data, such as permitting digits
    or entering an extra zero. This is also called a fat finger originating in financial
    trading markets. Sampling error can result from a data sample that fails to accurately
    represent the population under study.


    When we think about a process that fluctuates widely and is subject to signals
    and noise, the stock market might come to mind. Stock prices move for reasons
    including fundamentals, economic events, and randomness at different time scales.
    Figure 10.1 shows an example of a simulated stock price over time. We see many
    peaks, valleys, and jagged movements. In real-world stock data, the jagged movements
    are often induced by noisy market microstructure. This noise can make it difficult
    to identify trends, and it can render the data series less useful as a predictor
    in a model.'
