  md: '# Levels of Data Processing


    categorized by its level of processing. *Raw data* is data that has not undergone
    any processing. The potential sources and types of raw data are diverse and may
    include video camera footage, ECG waves, survey results, and scanned documents.
    The benefit of capturing and storing raw data is that all of the data will be
    available, and the user can revert to the original state of the data as needed.


    Consider example of a photographer taking a picture of Times Square in the evening
    under difficult lighting conditions. The image is stored and later modified by
    changing the contrast and brightness, cropping the frame, and changing it to monochrome.
    The modified image is saved as a new file. The photographer later decides she
    prefers the picture in color. Since the original photo is stored, she can revert
    to


    The limitation of raw data is that it likely won''t be immediately useful for
    tasks like analysis, predictive modeling, or reporting. One reason is that raw
    data is noisy. In the case of ECG waves, the waves cannot accurately detect a
    heart arrhythmia due to artifacts such as movement and power interference. Before
    the data is to be answered it needs processing. The specific processing steps
    will depend on how the data is collected, which defects might be present, how
    the data will be used, and In a proper system, the data processing will often
    be triggered automatically and implemented by computer code such as Python or
    Bash.


