    \ \times b$ and **Y** is $c \times d$, then **XY** we will be $(a \times b) \t\
    imes (c \times d)$. The inner dimensions are $b$ and $c$, while the outer dimensions\
    \ are $a$ and $d$. The inner dimensions must match for the product to be valid.\
    \ The product will have the outer dimensions.\n\nFor the case of **E** and **F**,\
    \ the calculation looks like $(m \times n) \times (n \times p)$. The inner dimensions\
