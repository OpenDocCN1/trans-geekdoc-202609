    # 4.5 Data Ingestion


    gestion is the process of collecting data from one or more sources for immediate
    use or storage in a centralized repository. The data may be ingested in real time
    (as it arrives) or in batches. The complexity of the data ingestion step can range
    from the download of one small file for an academic project to streaming video
    footage from a traffic camera.


    When ongoing data ingestion is required, the job may be scheduled. For example,
    a system might collect daily batches of data from a vendor at 2 am Eastern Time.
    A utility program in the Linux operating system called cron allows users to input
    commands for scheduling tasks at a specific time. A task scheduled in cron is
    called cron job. A task that runs at 2 am day of the year can be scheduled with
    this command:


    0 * * *


    where


    +   * The first value (0) indicates the minute

    * The second value (2) indicates the hour

    * The third value (*) indicates that the job runs every day of the month

    * The fourth value (*) indicates that the job runs every month of the year

    * The fifth value (*) indicates that the job runs every day of the week'
