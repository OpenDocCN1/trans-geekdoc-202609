    # Statistics


    We touched on statistical inference, but more specialized methods may be necessary
    for your work, including additional hypothesis tests, nonparametric testing, categorical
    data analysis, time series analysis, and Bayesian inference. It is important to
    know how to properly sample data and avoid bias. Some data scientists will find
    themselves designing experiments to determine if an effect is significant. These
    topics are covered in experimental design.


    # Computer Science


    A data scientist should be comfortable with common data structures and algorithms,
    and have an understanding of when to apply them. A good understanding of time
    complexity and space complexity will help you write better algorithms. The time
    complexity is the time it takes to run the algorithm as a function of the input
    length. The space complexity of an algorithm is the amount of memory consumed
    as a function of the input length. When comparing two algorithms, the one with
    lower complexity and space will be preferable.


    We briefly covered databases and SQL. It will be very valuable to gain mastery
    of SQL. I should point out that large tech companies love to ask interview candidates
    about data structures, algorithms, and SQL.


    It is essential for data scientists to be able to program in Python, R, or something
    similar. Many data scientists do not regularly apply software development practices
    as design patterns and unit testing, but these practices are highly encouraged.
    Writing efficient, reusable code takes practice and the depth of source material.
    There are many excellent open-source repositories available for each. Moreover,
    for ML Engineering roles, strong software skills are required.


    Familiarity with a cloud-based system such as AWS, Google Cloud, or Microsoft
    Azure, will be very valuable, as many organizations use the cloud for their computing
    and storage needs. The cloud providers evangelize their services and products,
    and their documentation can be very informative on topics including databases,
    analytics, machine learning, and hardware. As many of their services overlap,
    don''t worry about learning each service offered by each provider.


