    It is helpful to summarize the high-level details of a model in one place, and
    the model card is such a tool (this name is not universal). Historically, organizations
    that developed models were typically the only ones to use them. This is no longer
    the case. Increasingly, models are a shared resource. A reason for this is: building
    state-of-the-art models, such as those that understand language, requires massive
    datasets and expensive computing resources. It also requires specialized expertise.
    Furthermore, many of these leading machine learning models are freely available
    on platforms as Hugging Face (https://huggingface.co). Repurposing an appropriate
    model can promote and accelerate development. An important question is whether
    a model is appropriate for a given use case, and this is where model cards can
    help. An informative model card can provide transparency and safety, which helps
    foster model usage. In practice, the depth of information provided in model cards
    runs the gamut from empty to complete, a model card might include:


    +   - Model description: the high-level purpose of the model

    - Model background information

    - Model uses and limitations'
