  md: '# Descriptive Statistics


    The average or sample mean of the data applies equal weight to each observation
    in estimating where the data "balances." It is a statistic that estimates the
    population mean, denoted $\mu$. The sample mean is computed by summing the values
    and dividing by the number of observations $n$. For values $x_1, x_2, \dots, x_n$
    drawn from random variable $X$, the formula is


    ```

    $$\bar{x} = \frac{\sum_{i=1}^{n} x_i}{n}$

    ```


    Extreme outliers will have a large influence on the sample mean; for measuring
    the center in such a case, the median will be better. From our example $S$, the
    sample mean is approximately 85 due to the large outlier. While this value might
    give a sense of where the data balances, it does not represent most of the data.
    When we see the median and sample mean together for a dataset, their similarity
    or difference provides additional information. When the two statistics are similar,
    this indicates symmetry in the data distribution. When the sample mean is much
    larger (smaller) than the median, this indicates one or more (small) outliers.


    # Spread


    The dispersion or spread of the data gives how the values are distributed about
    a central value. For a spread of zero, all values would be the same; such variable
    would not be random at all. The mean is a measure of the variable''s uncertainty,
    and several statistics are used: the range, the interquartile range (IQR), the
    variance, and the standard deviation.


    The range is the difference between the maximum and minimum values of the data.
    It is simple to calculate and intuitive, but influenced by outliers, as we see
    with our data $R = 5000 - 1 = 4999$.


    For measuring the interquartile range, we first sort the data from highest to
    lowest and divide the sorted values into four equal parts, quartiles. The lowest
    quartile of the data ranges from the minimum to Q1 (the 25th percentile), the
    second quartile ranges from Q1 to Q2 (the 50th percentile or median), the third
    quartile ranges from Q2 to Q3 (the 75th percentile), and the fourth quartile ranges
    from Q3 to Q4 (the maximum). The middle 50% of the data is found here between
    Q2 and Q3.


    The interquartile range is calculated as $Q3 - Q1$, which represents the range
    covered by the middle 50% of the data. Since it removes the highest and lowest
    25% of the data, it is not sensitive to outliers. For our data sample, $IQR(S)
    = Q3 - Q1 = 2.7 - 1.0 = 1.7$. This is substantially lower than the range as it
    removed the outlier.


    A five-number summary is very common and useful for reducing a data distribution
    to five statistics, namely the minimum, Q1, median, Q3 and maximum. These numbers
    can be depicted graphically with a boxplot in Figure 9.1. The example boxplot
    summarizes randomly generated data following a standard normal distribution. Notice
    that the median does not necessarily'
