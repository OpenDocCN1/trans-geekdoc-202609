- pgno: 44
  md: '# Data Science Project Planning


    For some use cases, the model can be treated as a black box. Perhaps as long the
    prediction errors are small, nobody is concerned with how the model works or why
    it arrived at the output. This is increasingly rare, however, because at some
    point, all models degrade and stakeholders will want to see justification for
    the output.


    More commonly, predictions will need to be explained to people. For a model that
    recommends a treatment protocol to patients, a doctor will want to know why 20
    mg of medication is A the best course of action. An insurance regulator will want
    to see the predictors in the workers'' compensation claim prediction model.


    It is important to know in advance if the model needs to be interpretable, because
    some models are more interpretable than others. We learn about modeling, which
    will cover regression models, which are highly interpretable.


    Q8: What are the requirements for compliance?


    Some industries are highly regulated, such as finance and insurance. To protect
    consumers, there are laws specifying how models should be developed and tested,
    and how data should be collected and treated. The stakeholders should have awareness
    of relevant laws to remain compliant.


    Models fail to remain compliant can lead to financial loss, reputational damage,
    and job loss. In the financial industry, for example, lending models are regularly
    reviewed to ensure they don''t systematically discriminate against protected groups
    of people. We will study this topic later in the book.


