    For a large number of bins, the data distribution can be better understood with
    a graph of the bins on the x-axis and their occurrences on the y-axis (as in a
    vertical bar chart).


    # Central Tendency


    The central tendency or center of the data is one of the most common and useful
    attributes. It can be measured by the variable: mode, median, or mean. The mode
    is the most common value taken by the variable. Frequent counts as in $F$, the
    mode is equal to the key with highest value (1 in this case). The mode will not
    be influenced by outliers, as they are rare by definition. A shortcoming of the
    mode is that it is purely frequency based.


    The median is the value in the "middle" of the data. To be more precise, we can
    define the $p$th percentile of the data. The median is defined as the 50th percentile
    of the data; half of the values are above and below the median. For an odd number
    of data points, this can be found by sorting the values and taking the middle
    point. For an even number of data points, the median is computed as taking the
    midpoint of the two middle values. For the example $S$, the median will be 1.5,
    which is the midpoint of 1 and 2. Like the mode, the median is not influenced
    by outliers. The median gives a better estimate of center since it uses the ranking
    of values.'
