  md: '# 2

    Communicating Effectively and Earning Trust


    Once you move beyond data science for yourself as a hobby, you''ll need to communicate
    your work with others. Data scientists have the potential to be transformative
    and highly visible, and it is not uncommon for them to present work to leadership,
    board members, venture capitalists, and customers. Effective communication is
    so essential that if you don''t master it, no paying customer or employer will
    enlist your technical services for long. That is why this chapter appears before
    the technical topics. A side effect of learning communication skills is better
    relationship building, which is associated with greater happiness and fulfillment
    [5].


    One of my interviews at a healthcare IT firm was with a seasoned clinician I''ll
    call Janice. She was apprehensive about my ability to come in and lead a team
    of data scientists to develop their electronic health record system. By my surprise,
    she had worked with many scientists before who had developed neural networks to
    predict health outcomes. Digging deeper, it turned out that Janice had been burned
    by data science before, and the pain radiated through the organization. This is
    very common, unfortunately, as data science outcomes can be highly uncertain,
    and the field has overwhelmed. To win over Janice, you''ll need to earn and maintain
    trust. You will need to show that you are competent and responsible, and that
    you respect and value people.


    # 2.1 Master Yourself


    Before you win over the hearts and minds of others, you need to convince yourself
    that you''re doing the right things for the right reasons. If you''re taking an
    introductory data science course and plan to go no further in the field, then
    you have a compelling reason that doesn''t require a lot of deep digging: doing
    this to meet a requirement. My hope, however, is that you fall in love with data
    science and make it a longer-term endeavor. In this case, having a “why” and revisiting
    and reinforcing it will be invaluable [6]. When we have a burning reason for doing
    something, it propels us forward through adversity, and it gives others an entry
    point to admire our work. This is how'
  merge: -1
  img_proc: true
- pgno: 28
  md: '10 Communicating Effectively and Earning Trust


    great leaders can influence others. As a bonus, when an interviewer says “Tell

    about yourself,” your “why” will do the important work of telling your

    unique, important story.


    In addition to a “why,” you will need a strong belief in yourself. You\may worry
    about the computer science requirements of the field, public speaking,

    or some other type of data science. From the start, keep an open mind,

    stay positive, keep a list of topics for exploration, and gradually chip away

    at the challenges. Even for accomplished professionals, feelings of self-doubt

    not deserving a “seat at the table” are very common. The phenomenon

    is so prevalent it has a name: imposter syndrome. A meta-analysis in the

    Journal of General Internal Medicine shows imposter syndrome prevalence

    rates from 9% to 82% over 62 studies and 14,161 participants [7].


    Having some wins in your areas can help build confidence.

    For the areas that need improvement, plan a plan for moving forward. You\may be
    able to get coaching from a mentor or more senior colleague. It is perfectly to
    be honest about things you don’t know and ask for help. Finally,

    a mentor can help greatly. In the highest ranks of large organizations

    use mentors to share ideas, identify weaknesses, and identify opportunities for

    growth.


    Let’s imagine that you’ve been working in data science for a few years\and you
    feel confident doing things like coding, preparing, and building

    machine learning models. While these functions may not change, the underly tools
    and techniques will constantly change. I mention this because I

    want you to be prepared for this certainty. Data science is a field

    that constantly evolves, as is driven by technology and changing

    customer demands. If you can accept the challenge of learning new things, and

    the idea that you’re never done, this will keep you relevant and engaged. For
    support take part in activities that you enjoy, as joining a data science community,
    attending conferences or talks,

    or reading online blogs.


    Finally, think deeply about what you want to accomplish in your lifetime,

    put in the work, and have courage. Here is one of my favorite quotes from

    onas Salk, the developer of one of the first successful polio vaccines:


    > There is hope in dreams, imagination, and in the courage of those who wishnto
    make those dreams a reality.


    # 2.2 Technical Competence


    In my first job at Merrill Lynch, my manager had an uncanny knack for looking

    at a table of numbers and finding errors. He didn’t need to see the code or pick

    through the details. He used heuristics, or rules of thumb, to examine results'
