  md: "For two predictors $X$ and $Z$, we may compute their covariances with a target\
    \ $Y$ as $s_{xy}$ and $s_{zy}$, respectively. As the covariances are not adjusted\
    \ for the spreads of the underlying variables, it is not possible to directly\
    \ compare them, however, it will therefore be useful to normalize, or scale, the\
    \ covariance by the product of the variables' standard deviations. If $s_x$ and\
    \ $s_y$ are the sample standard deviations of $X$ and $Y$, respectively, the sample\
    \ correlation between $X$ and $Y$, denoted $r_{xy}$, is defined as\n\n```\n$r_{xy}\
    \ = \\frac{s_{xy}}{s_x s_y}$$\n```\n\nGiven this scaling, the sample correlation\
    \ will fall in the range $[-1,1]$. The interpretation of correlation is identical\
    \ to covariance: a higher, positive value indicates that the variables movement\
    \ in the same direction, on average, while a negative value indicates movement\
    \ in opposite directions. A correlation of zero indicates no relationship. Correlation\
    \ estimation between predictors and target will be essential in identifying good\
    \ predictor candidates for a model.\n\nWe have now seen the essential statistics\
    \ needed to understand our data counts, measures of tendency and dispersion, and\
    \ measures of association. Given one or more datasets, these statistics can be\
    \ computed for better insight. Pairing statistics with graphics provides for robust\
