- pgno: 327
  md: '# Testing


    bugs, and the surfacing of unexpected results. For these reasons, it is good practice
    for data scientists to write unit tests when developing code. It is also important
    to include clear comments on what each test does. This will allow for verifying
    that the tests matches expectations.


    Testing the data and the model output is also highly recommended. This practice
    can help identify issues that arise when new data is collected, when the code
    evolves, or when the model is updated. Particularly in machine learning, it is
    possible for the model to receive malformed or intermittent data and return an
    incorrect result. In such an event, the bad result may go undetected since breaks.


    Testing the stability of model output is also essential. For example, a data scientist
    may train a model that performs well. She may proceed to refine the application
    code to engineering, while keeping the model unchanged. Confirming that the model
    produces the same predictions for test cases will be important. A set of tests
    with model inputs and outputs (e.g., predicted probabilities) can be created and
    saved with the code. Their careful design is essential, since their coverage defines
    the scope of testing. The tests may include:


    +   - Common cases, such as frequent input combinations

    - Cases where different input values are missing

    - A case where all inputs are missing

    - Edge cases which may be challenging for the model

    - Cases for each predicted label, when the task is classification


    The practice of writing tests on the model output allows the data scientist to
    assert that the model predictions match known values, both at present and over
    time. Additionally, this allows others to test the application, as quality assurance
    (QA) engineers. Since QA engineers are a step removed from the data science project,
    it will be hard for them to detect issues; the tests will provide a layer of support.


    Python has modules for testing, and one of the modules is unittest. This provides
    a rich set of tools for constructing and running tests. This includes a set of
    methods for Boolean verification such as assertEquals(), which checks if two values
    are equal. For example, we assert that a given model input will produce an expected
    output. The output may be known from an earlier call to the model. For the case
    where the prediction does not match the expected value, the test would fail and
    issue an AssertionError. The code below illustrates two simple unit tests. The
    first test passes and the second test fails. An explanation follows the code.'
