- pgno: 52
  md: '# 4.1 Data Types


    Each piece of data will have an associated data type, which allows for a set of
    possible values and operations. A numerical measurement like 121.5 may be compared
    to another numerical measurement with the > and = operators, for example. The
    measurements might also be averaged. A word such as “Love” from a social media
    tweet could be uppercase or lowercase. It would not make sense to uppercase a
    numerical measurement, and it would not make sense to compute the average two
    words.


    Each programming language will define a set of built-in data types. In Python,
    the float data type would be appropriate for decimal values like 121.5. The string
    data type would be sensible for words “Love,” as strings hold a sequence of letters
    and punctuation. The other two primitive data types in Python are integers and
    Booleans. The Boolean data type takes True and False, such whether a Twitter account
    has followers or not. More complex data types can be built from the primitive
    data types. We will actively work with and study the various Python data types
    throughout the book.


    To summarize, are the Python data types with examples:


    | Type | Examples |

    |---|---|

    | float | 3.14, 2.71, -1.111 |

    | integer | -2, 0, 500 |

    | bool | True, False |

    | string | ‘success’, bag of words |


    # 4.2 Statistical Data Types


    Data can also be categorized into statistical data types. At the first level of
    the taxonomy, data can be qualitative or quantitative. Qualitative data can be
    further divided into categorical data and ordinal data. Categorical data can take
    the form of text or even numeric values. A key property is that it does not have
    a meaningful ordering. Examples include eye color and zip code. Note that zip
    codes are integers, calculations on them are not meaningful (we would not compute
    the mean of two zip codes). Although categorical data cannot be ordered, it is
    still highly useful, and it can be included in models. Ordinal data has a natural
    ordering system, and an example is letter grades assigned to student exams; a
    grade of A is preferable to a grade of B, for example.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Datasets and States of Data


    Quantitative data can be divided into discrete data and continuous data. Discrete
    data is data that takes a finite or countable number of values, while continuous
    data takes an uncountable number of values. An example of discrete data is the
    number of attendees at different nature preserves at a given time. An example
    of continuous data is the speed of a football pitch, assuming this is measured
    with perfect precision.


    Consider a dataset with several variables, such as eye color, height, weight,
    and zip code. The categorical variables (eye color and zip code) generally require
    the same processing steps, while the continuous variables (height and weight)
    generally require the same steps. For example, one-hot encoding is commonly used
    to represent categorical variables in machine learning models. It is useful to
    programmatically group the variables by statistical data type. This will make
    the processing more efficient, and it will keep the workflow organized.


    To summarize, here are the statistical data types with examples for each type:


    | Type | Examples |

    | --- | --- |

    | Discrete | #website visitors, #students graduating |

    | Continuous | depth of a lake, lap time of a swimmer |


    | Type | Examples |

    | --- | --- |

    | Categorical | cat breed, type of a star, occupation |

    | Ordinal | highest grade completed, job category (I, II, III) |


    # Statistical Data Types with Examples


    # 4.3 Datasets and States of Data


    A dataset refers to related information that can be processed as a unit by a computer.
    Examples include a table of stock prices over time, or clinical notes on a set
    of hospital patients.


    > For a countable number of values, each value can be assigned to a number 1,
    2, etc., even if the counting process continues indefinitely.'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'At any given time, we can think of a dataset belonging to one of three states
    [12]:


    +   * At Rest: the data is in storage, such as a file, database, or data lake


    +   * In Use: the data is being updated, processed, deleted, accessed, or read
    by a system


    +   * In Motion: the data is moving locations, such as within a computer system
    or over a wireless connection


    A system or application may comprise dozens or more datasets. At any given time,
    there may be datasets in each of these three states: new data is ingested into
    the system, mutate data is stored in a database, and a user is updating a portion
    of data. This may be a very dynamic process. We will learn more about each of
    these states later when discussing storage and processing.


    An important consideration in each of these states is the risk of malicious attack.
    Data is at lowest risk of attack. Of course, data may be corrupted or destroyed
    on any storage device, so precautions should always be taken, such as backing
    up data.


    When data is moved, hackers may intercept it, and when moved over public networks
    like the internet. Encrypting the data before it is transmitted (at rest), encrypting
    the connection, or both will reduce this risk. Security is beyond the scope of
    this book, but the interested reader may consult [13]. When data is in use, it
    is directly accessible and at highest risk. The risk may be reduced by using encryption,
    user authentication, and permissioning.


    # 4.4 Data Sources and Data Veracity


    Data may originate internally at an organization, or may be collected from external
    sources. Internal data might come from a wide array of sources. For any data set,
    internal or external, it is essential to understand how the data is collected
    and processed, and to ensure its quality. Reliable, useful data can enrich analysis
    and modeling. Bad data can take an application and render the output useless.


    Some datasets only need to be collected once, while others need to be collected
    on an ongoing basis. In the first case, a dataset might be downloaded for a research
    project or an academic project. In the second case, data might need to feed an
    application running in production. An example might be daily stock prices that
    are ingested into a financial risk management application. It is essential in
    this case that the data arrives in an ongoing, timely manner.'
  merge: -1
  img_proc: true
