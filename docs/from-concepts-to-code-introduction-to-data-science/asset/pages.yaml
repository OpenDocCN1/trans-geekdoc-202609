    The first two records are persian, and this is represented by the 1 in the persian
    column and zeroes in the rest. Written as a vector, record 1 is encoded as [0,
    0, 1, 0]. We can condense this by observing that for a categorical variable with
    n levels, or unique values, we only need n-1 columns to represent them. In this
    case, we will drop the burmese column and update the matrix.


    | record himalayan persian siamese |

    |---|---|---|---||

    | 1 | 0 | 1 | 0 |

    | 2 | 0 | 1 | 0 |

