  md: "# Predicting Housing Prices\n\n$R^2$ is very close to the $R^2$. If we look\
    \ at the formula for adjusted $R^2$, we notice an adjustment factor of $(n-1)/(n-1)$.\
    \ As $n$ increases relative to $p$, the factor approaches one, which implies the\
    \ adjusted $R^2$ approaches $R^2$. For this example, $n=8256$, $p_{small} = 3$,\
    \ and $p_{large} = 8$. The adjustment factor for the small and large model is\
    \ $(8256-1)/(8256-3-1) = 1.00036$ and $(8256-1)/(8256-8-1) = 1.00097$, respectively.\
    \ There is a greater adjustment for the larger model due to its higher complexity,\
    \ but in each case, the adjustments are very small.\n\n# 13.3.7 Calculating R-Squared\n\
    \n$R^2$ is easily calculated in software, but it is important to understand its\
    \ conceptual meaning and calculation. Conceptually, we state an equality about\
    \ the total sum of squares which is proportional to the variance in the target\
    \ data:\n\ntotal sum of squares = explained sum of squares + residual sum of squares\n\
    \ndenoting\n\n+   * $SS_{tot}$ = total sum of squares\n* $SS_{exp}$ = explained\
    \ sum of squares\n* $SS_{res}$ = residual sum of squares\n* $R^2 = SS_{exp}/SS_{tot}$\n\
    \ngives\n\n$SS_{tot} = SS_{exp} + SS_{res}$\n\nDividing by $SS_{tot}$ gives:\n\
    \n$1 = \frac{SS_{exp}}{SS_{tot}} + \frac{SS_{res}}{SS_{tot}}$\n\nSubstituting\
    \ for $R^2$ gives:\n\n$1 = R^2 + \frac{SS_{res}}{SS_{tot}}$\n\nLastly, we solve\
    \ for $R^2$:\n\n$R^2 = 1 - \frac{SS_{res}}{SS_{tot}}$\n\nThis gives a compact\
    \ formula for $R^2$ and a nice interpretation: a model that explains a large fraction\
    \ of the variation in the target variable will produce a small residual sum of\
    \ squares relative to the total sum of squares, $SS_{res}/SS_{tot}$."
  merge: -1
  img_proc: true
- pgno: 282
  md: '264 Modeling with Linear Regression


    In turn, this will result in a large $R^2$. If the model perfectly fits the data,
    $SS_{res}$ will be zero and $R^2$ will be one. If the model does not explain any
    of the variation in the target, $SS_{res}$ will equal $SS_{tot}$ and $R^2 = 1
    - 1 = 0$. Next, we need to explain how to compute $SS_{res}$ and $SS_{tot}$.


    As shown earlier, $SS_{res}$ is computed by:


    +   1. Calculating residuals, $y_i - \hat{y}$ for each data point i

    2. Squaring the residuals

    3. Summing the squared residuals


    As a formula,


    $$SS_{res} = \sum_{i=1}^{n} (y_i - \hat{y})^2$$


    $SS_{tot}$ is computed by:


    +   1. Computing the average of the data, $\hat{y}$

    2. Calculating deviations $y_i - \hat{y}$ for each data point i

    3. Squaring the deviations

    4. Summing the squared deviations


    As a formula,


    $$SS_{tot} = \sum_{i=1}^{n} (y_i - \hat{y})^2$$


    Again, it is generally not necessary to do these calculations by hand or spread-sheet,
    as $R^2$ is implemented in software. However, the conceptual understanding and
    reasoning with sums of squares is valuable.


