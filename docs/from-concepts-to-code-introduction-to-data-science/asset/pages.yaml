  md: '# 15.4 Chapter Summary


    Unsupervised techniques such as k-means clustering can uncover substructure and
    outliers. K-means divides n points into clusters with the objective of minimizing
    the within-cluster sum of squared errors. Each cluster has a centroid, which is
    a vector of coordinates where the points in the cluster are located.


    K-means begins with initialization of the centroids, and there are several methods
    for doing this. Following initialization, the algorithm proceeds by assigning
    each point to its closest centroid based on Euclidean distance. Given the points
    in the cluster, each centroid is updated to reflect the average value in each
    dimension. The assignment and update steps are repeated until all iterations don''t
    change.


    Users should be aware of several advantages and limitations of k-means. The algorithm
    is not guaranteed to converge to a global optimum. To find the optimum, k-means
    should be run a large number of times. Since the algorithm uses Euclidean distance,
    it is important that variables are on the same scale. The distance metric also
    has implications for the data patterns that are amenable to k-means: spherical-shaped
    clusters will yield good results, while complex patterns like concentric circles
    will not. K-means requires numeric data; categorical variables are typically encoded.


    The only required parameter for k-means is the number of clusters, k. Different
    techniques are used to determine k, and we investigated the silhouette score.
    The silhouette measures the fit of each point in its assigned cluster to its next-closest
    cluster. The silhouette score falls in a range of [-1,1] where a higher value
    is better.


    We obtained a large dataset of nutritional values from diverse foods. The dataset
    required some cleanup, and we removed unwanted strings with a regular expression,
    or regex. K-means cluster analysis of the data found a high-calorie, high-fat
    cluster. The illustration showed an interesting result with relatively little
    effort, but a more robust solution would require deeper investigation.


    This chapter and earlier chapters focused on machine learning techniques. In the
    next chapter, we will learn some techniques for making data science projects more
    reproducible. This will also reduce the time necessary to move a model from development
    to production.


