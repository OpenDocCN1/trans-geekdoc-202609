  md: '# Mathematical Framework


    This expresses the odds as an exponential function of $t$. We can take the logarithm
    of both sides to yield an expression for the $log$ odds:


    ```

    $ln \frac{p(t)}{1-p(t)} = t$

    ```


    This results from $exp()$ and $ln()$ being inverses of one another. We now assume
    that $t$ is a linear combination of the predictors:


    ```

    $t = \beta_0 + \beta_1 x_1 + \dots + \beta_k x_k$$

    ```


    In fact, the right-hand side is the specification from the linear regression model.
    Then the equation for the log odds


    ```

    $ln \frac{p(x)}{1-p(x)} = \beta_0 + \beta_1 x_i + \dots + \beta_k x_k$$

    ```


    This is the equation for logistic regression. It assumes a linear relationship
    between the predictors and the log odds of the probability of the event. In the
    case of a single predictor ($k=1$), we can drop the subscript on the predictor
    and write it as


    ```

    $ln \frac{p(x)}{1-p(x)} = \beta_0 + \beta_1 x_i$$

    ```


    # 14.1.1 Parameter Estimation for Logistic Regression


    Now that the form is specified, we will need parameter estimates $\hat{\beta}_i$
    for each parameter $\beta_i$, where $i=0,\dots,k$. Our technique is to write the
    probability of observing a sequence of outcomes as a function of the parameters
    (this is called the likelihood function), and to apply gradient descent to maximize
    the likelihood.


    > Note: This section is more mathematically heavy than the early sections. It
    will be good to attempt the section and see the application of preliminary material,
    such as calculus, but it is not required.


    Each outcome is a Bernoulli random variable with success probability $p(t)$, which
    is a function of the data and parameters. Given this information, a sequence of
    outcomes can be treated as a sequence of independent Bernoulli trials. The likelihood
    of observing the outcomes, denoted $\mathcal{L}(\beta)$, has this:


    ```

    $\mathcal{L}(\beta) = \prod_{i=1}^n p(x_i|\beta)^{y_i} (1-p(x_i|\beta))^{1-y_i}$$

    ```'
