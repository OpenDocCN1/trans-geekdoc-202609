    # 12.9 Metrics


    We examined loss functions, which are designed to measure errors and optimize
    model parameters. For the purpose of understanding how well a model performs,
    not all functions are easily understood by a human. Cross-entropy loss, for example,
    is a number that approaches as the predicted probability of the correct label
    zero. For this reason, we use metrics to measure and report on model performance,
    and the relevant metrics depend on the choice.


    For the regression problem, the MSE and MAE are both reasonable metrics. As MSE
    represents a sum of squared errors, the square root is often taken, producing
    the root mean error (RMSE). The RMSE measures the average error, irrespective
    of the error directions.


    Increasing the number of predictors in the model can inflate the R² without increasing
    complexity. To combat this, the Adjusted R-squared can be computed. We will discuss
    the detailed calculation of R-squared and Adjusted R-squared in the next chapter.


    Let''s introduce some notation and classification metrics:


    +   * P: a positive value, which can be used for the actual or predicted label


    +   * N: a negative value, which can be used for the actual or predicted label'
