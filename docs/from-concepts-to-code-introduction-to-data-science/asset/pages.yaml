  md: 'The reinforcement learning approach has several benefits compared to super-vised
    learning:


    +   - Mimics how we learn from experience


    +   - Labeled data is not required. For some problems, such as the best way to
    treat patients for a life-threatening condition like sepsis, the right answer
    is not known. RL can help the patient to improvement based on observed rewards.


    +   - It models a sequence of actions for a complex process


    +   - Learning can happen in a dynamic environment


    Depending on the problem, there can also be several challenges such as:


    +   - The environment needs to be known, accurately modeled, or simulated. In
    some cases, it is not possible to test and learn, as in medicine where patients
    cannot be randomly assigned different actions.


    +   - There can be a time delay between taking the action and observing a change
    in state. As several actions might be taken before seeing the change, this makes
    it difficult to attribute the change to a particular action.


    +   - For some problems, the state space $S$, the action space $A$, or both might
    be continuous. This increases the computational cost and necessitates different
    algorithmic approaches.


    Examples of RL problems:


    +   - A doctor providing a series of medication doses to a patient to bring a
    lab value into a reference range. The state space is the lab value measurement,
    the action space might be whether to increase the dose, decrease the dose, or
    keep it unchanged, and a reward function might give positive values to actions
    that move the lab value into the range or closer to it. For actions moving the
    lab value away from the range, a penalty would be assigned. The terminating condition
    would occur if the patient faces mortality.


    +   - A portfolio manager selecting fractions of wealth to invest in a universe
    of stocks over time to maximize return. The state space is the fraction invested
    in each stock and the action space might be whether to increase the allocation,
    decrease the allocation, or keep the unchanged for each stock. To simplify the
    action space, the investor might only be allowed to change each allocation by
    a fixed percentage at each time step. The reward could be the cumulative return,
    which is the portfolio''s percentage change in value since the start. The terminating
    condition might be the earlier of the end of the investment horizon and the portfolio
    value going to zero.'
