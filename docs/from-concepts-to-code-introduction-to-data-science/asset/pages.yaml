  md: '# 7 Data Storage and Retrieval


    In this chapter, we will learn about databases and how to use them to store and
    retrieve data. We can think of a database as a tool that supports the creation
    (C), retrieval (R), updating (U), and deletion (D) of data. These operations are
    called the CRUD operations, and they provide minimal requirements for a database.
    For example, our brains qualify as a database under this definition. Unfortunately,
    brains tend to forget things that are not sufficiently used. For a database to
    be trusted and useful, it needs to offer:


    +   - Perfect retrieval, so that every piece of data can be accessed

    - Speed, so that all operations are fast ...even at scale

    - Consistency, so if two users make the same request at the same time, they see
    the same result

    - Ease of error correction


    Different database systems offer different features. For massively data-intensive
    applications, it is not possible to perfectly satisfy all of the features, and
    tradeoffs must be made. It is useful, however, to keep CRUD in mind, and the considerations
    for a useful database.


    We will not have the space to provide a detailed treatment of databases, nor to
    discuss proper design. An excellent book for this purpose is [25]. Here we will
    approach databases from the likely viewpoint of a data scientist new to an organization.
    In this scenario, a database (or collection of databases) is already in place.
    The structure may have been designed by a data architect and built by a data engineer.
    The data may have been saved by an automated process. The data scientist will
    then be required to access to the data and start retrieval. If this is to happen,
    the data scientist must learn a programming language to query the data.


    There is a segmentation of database types into relational databases and non-relational
    databases. At the time of writing, most databases are still relational databases.
    The language for relational databases is SQL. Non-relational databases are also
    called NoSQL databases, which indicates that SQL is not used for queries. The
    relational database requires that the data is structured according to a pre-defined
    schema. Much of the data in the modern world— including documents, images, and
    videos— is not amenable to schemas'
  merge: -1
  img_proc: true
