- pgno: 314
  md: '# 15.2.2 Performance Evaluation


    The k-means algorithm attempts to minimize the within-cluster sum of squares for
    a given number of clusters $k$. The question remains of how to select the best
    $k$. Selecting the $k$ that minimizes WSSE won''t work, as the metric can be minimized
    by setting $k=n$. In this case, each point is its own cluster and WSSE=0, but
    this tells us nothing about substructure in the data. Something else is needed.


    A common approach is to plot the WSSE for a range of $k$ as in Figure 15.3. As
    $k$ increases, WSSE will generally decrease. There is sometimes a sharp drop and
    then a flattening of WSSE, which forms an "elbow" pattern. For this particular
    graph, the elbow is not particularly clear, but a $k$ of perhaps 3 or 4 is sensible.
    Increasing $k$ beyond the underlying number of clusters will break apart points
    that belong together, little change in WSSE.


    ![](img/7f40a2246fd3d2d5353d109f489c4e33_314_0.png)


    FIGURE 15.3: WSSE versus Number of Clusters


    Another more quantitative approach for selecting $k$ is to compute the silhouette
    score. The silhouette score measures the cohesion of each data point within its
    cluster when compared to other clusters. The metric falls in the range $[-1, 1]$
    where a higher value indicates better cohesion. Given this, the metric can be
    used to compare different $k$ and pick the best value. We will limit attention
    to the case $k$ > 1$.


    Given the assignment of points to clusters, the silhouette score is calculated
    as follows:'
