- pgno: 309
  md: '# Clustering Concepts


    Notice where the horizontal and vertical lines cross, as it shows three things:


    +   * The intersection forms a right angle

    * Student A scored 70 on exam 1

    * Student B scored 80 on exam 2


    The distance between A and B will be the hypotenuse of the formed right triangle.
    The horizontal side of the triangle represents the difference in scores for exam
    1, 75-70, while the vertical side represents the difference in scores for exam
    2, 82-80. The distance may be calculated as $\sqrt{(75-70)^2+(82-80)^2} = \sqrt{29}
    \approx 5.39$ according to the Pythagorean theorem (which you might recall as
    $c = \sqrt{a^2+b^2}$).


    Euclidean distance can be stated as a formula for vectors x and y, each with length:


    ```

    $d(x, y) = \sqrt{\sum_{i=1}^{p} (x_i - y_i)^2}$ \quad (15.1)

    ```


    This is an extension of our example to the p-dimensional case. The distances between
    the other students could be calculated in a similar fashion. Notice that one method
    involves doing the calculation of all pairwise distances $d(A,B), d(A,C), d(B,C)$.
    For a large number of datapoints, this can be a large calculation. One simplification,
    which we will see later with the k-means algorithm, is to stop taking the square
    root. Instead, we calculate squared distances $d^2$, because ranking on $d^2$
    will be identical to ranking based on $d$. Since the square root function is monotonically
    increasing function.


    Another consideration is the number of groups k to be formed. A single group will
    illuminate similarities or differences in the students, so we would help either,
    as this places each student on their own. In this case, it makes sense to use
    two groups. In the general case of n objects, we require that k is greater than
    one and less than n. There are different ways of measuring the quality of grouping,
    and we will study a specific metric shortly. Conceptually, points within a group
    should be "close together" and points in different groups should be "far apart."
    The closeness can be measured by sum of squared distances between points.


    In the next section, we will discuss the popular k-means clustering algorithm.
    The algorithm can scale to massive numbers of observations and variables, and
    it requires only a single parameter. We have already introduced many of the important
    concepts used in k-means, so let''s dive deeper.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# 15.2 K-Means


    The k-means algorithm divides $n$ objects, points, into $k$ clusters by placing
    each point in the cluster with the nearest centroid. Figure 15.2 shows k-means
    clustering for the three-student example. The clustering uses two clusters, and
    the $x$ marks show the centroids. To understand how the centroids are decided,
    we''ll need to study the steps of the algorithm, which we do next.


    ![](img/7f40a2246fd3d2d5353d109f489c4e33_310_0.png)


    FICTURE 15.2: Data Points and K-Means Centroids


    Give the number of clusters $k$, there are different methods for initializing
    the centroids. A common approach is to randomly select $k$ of the points and make
    them centroids.


    Each point is assigned to the closest centroid based on Euclidean distance. This
    is the *assignment step*.


    Next, each centroid is recalculated by selecting the points assigned to it and
    computing the average value of each variable. For $p$ variables, each centroid
    will be a $p$-dimensional vector where the $i$th element is the average value
    of the $i$th variable. If a cluster consists of points $(1, 2)$ and $(3, 4)$,
    for example, the centroid would be $(1+3)/2, (2+4)/2) = (2,3)$. This step is called
    the *update step*.


    The pair of steps (assignment, update) is repeated until there are no assignment
    changes or the algorithm has run the allowed number of iterations.


    The k-means algorithm attempts to minimize within-cluster sum of squared errors
    (WSSE). This would satisfy the desire for points in the same cluster'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# K-Means


    to be “close together.” Unfortunately, k-means is not guaranteed to attain its
    objective, and the result depends on the initial centroids. For this reason, the
    algorithm should be run multiple times and the best result should be used. This
    is implemented in software, and we will use sklearn.


    # K-Means Assumptions and Limitations


    K-means has several assumptions and limitations that should be understood:


    +   1) Since the algorithm uses Euclidean distance, the clustering pattern of
    the data will be important. Specifically, it will do well when the clusters are
    spherically shaped. It won’t do well if there are concentric rings of data or
    complex shapes; an alternative method like DBSCAN will work better for these cases.


    +   2) As distance measurements are used in clustering, it is important to ensure
    the variables are on the same scale. Normalization or scaling can be used for
    this purpose.


    +   3) The variables need to be numeric. Categorical variables are typically one-encoded.


    +   4) K-means will always give an answer. It may take a large amount of time
    to evaluate the results, iterate, and understand if the clusters are useful.


    +   5) The results can be highly dependent on the variables and observations used.
    For example, including or dropping a variable can produce different clustering
    results. This should be explored as part of testing.


    # 15.2.1 K-Means Hand Calculation


    To clearly understand an algorithm, a hand calculation can be very helpful. We
    can work out k-means by hand for our small example. Note that because the number
    of points and variables is small, we could try each initialization, select the
    best one, and be guaranteed to reach optimality. For our purposes, it will be
    sufficient to illustrate a single initialization. A large-scale case would not
    allow for exhaustive search (trying each initialization) due to the massive number
    of configurations.


    As a reminder, here is the student data:


    | student | exam1 | exam2 |

    |---|---|--|

    | A | 70 | 82 |

    | B | 75 | 80 |

    | C | 95 | 90 |'
