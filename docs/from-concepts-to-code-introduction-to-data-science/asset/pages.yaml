    # Inverse


    The inverse $M^{-1}$ of a square matrix $\mathbf{M}$ is a matrix such that $MM^{-1}
    = M^{-1}M = \mathbf{I}$. The inverse is unique, and it serves the same role as
    in arithmetic. Finding the inverse of a matrix is efficiently computed (e.g.,
    Python has a function `numpy.linalg.inv()`), it involves solving a system of linear
    equations. *Gaussian elimination* is one popular method for inverting a matrix.
    A matrix with an inverse is called an *invertible matrix*; it is otherwise called
