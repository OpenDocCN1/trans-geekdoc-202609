    # # 16.4 Chapter Summary


    Deploying models and making them reproducible can be challenging. There are many
    steps required, but there are several practices and tools that can help. This
    chapter outlined the process of testing of code, data, and output. It also provided
    an introduction to containers.


    The easiest, safest way to share code is with a tool like GitHub. Carefully documenting
    and maintaining a project''s code repository eases the task of promoting code
    to engineering. Over time, the code will change, and different users may have
    different versions. It is important to track each package of code for future reference.


    Writing a comprehensive set of tests takes time and care. Incorrect tests and
    missing tests will compromise the entire exercise. The tests should be reviewed
    for proper coverage and execution. They should include common cases and edge cases,
    among others.


    Providing a container with a data science project allows others to easily replicate
    the work. Containers hold all of the dependencies and configurations for an application.
    They can be used to stand up, run, and tear down a temporary, isolated environment.
    This can accelerate the path to production. Docker is currently the most popular
    container software. For more details and examples, see source [44].


    Now that we have covered some the important steps in model deployment and reproducibility,
    we will review model risk management and model monitoring. Model risk is something
    that should be considered throughout the model lifecycle, starting with model
    conception.


