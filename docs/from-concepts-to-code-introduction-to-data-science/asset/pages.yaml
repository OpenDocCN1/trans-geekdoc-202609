  md: '# # 11


    # ## Exploratory Data Analysis


    One of the first things that should be done with a new dataset is to get a feel
    for the data. We did some of this during the preprocessing step, when we looked
    for missing values and extreme observations, and when we transformed variables.
    Every dataset will be different and might contain surprises; understanding the
    nuances and the tools to treat them will allow for accurate, insightful analysis.


    The two activities we will explore are statistical summarization and visualization
    of the data. As the datasets grow larger, it can be difficult or impossible to
    review all of the data points, and this is where statistics will help. Statistical
    summaries provide a quick overview of the distribution of one or more variables.
    Aggregations can summarize data along one or more axes, such as computing daily
    averages on high-frequency data. We will see examples of statistical applications
    in this chapter.


    Properly done graphs will lead you to important features of the data, prompting
    further investigation. Python includes several modules for visualization, with
    matplotlib and seaborn the most popular. We will show examples of seaborn to give
    a sense of its power and ease. Seaborn is based on matplotlib and it provides
    a high-level interface for attractive and informative statistical graphics. For
    customizing seaborn, there are times when this book does not allow for a comprehensive
    treatment of the module, so the examples to follow will serve as a starting point.
    For an introduction to seaborn, please see [32]. To get started with matplotlib,
    see [33]. Both of these packages will be pre-installed with Anaconda.


    Exploratory data analysis (EDA) can be done on variables individually, but many
    of the interesting insights we will gain when we consider how one variable changes,
    or covars, with another. This speaks to the importance of understanding relationships
    between variables, which is essential for prediction. To drive the point home,
    consider that each time a variable is selected, data is taken out of context from
    a large system. If the column of data is a set of midterm grades, the excluded
    data might be the students who weren''t feeling well that day. For a series of
    stock prices, the underlying economic regime has been left out. In each case,
    these excluded variables might be essential to truly understanding the data. By
    thoroughly'
  merge: -1
  img_proc: true
