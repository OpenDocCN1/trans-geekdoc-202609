    Sonnet 上生成了 4,800 篇人工智能生成文本——对应人工撰写的文本——这些文本被用于我们的实验中。


    ## D 实现细节


    所有实验都在单张拥有 80GB 内存的 NVIDIA A100 GPU 上完成。除非另有说明，温度、top-k 和其他生成参数均使用默认设置。本研究不涉及额外的超参数调优。对于基于训练的方法（Biscope
    和 R-Detect），模型在 HC3 数据集的 4,000 个平衡样本上进行训练，并根据在单独的 2,000 个样本验证集上的验证性能选择表现最佳的检查点。在主要实验中，报告的所有
    F1 分数均是通过根据每种方法的正负分数选择最佳阈值而获得的最大值。


    ## E 鲁棒性实验


    在本研究中，我们未考虑针对人工撰写文本的对抗性攻击，因为在这种情况下规避行为通常无关紧要。相反，我们专注于涉及人工智能生成文本的对抗性场景，引入两种常见的攻击类型：改写和标记级别编辑。对于改写攻击，我们采用
    DAPPER 工具，其超参数设置为词汇多样性为 60，句法多样性为 60。这种程度的改写足以潜在地绕过最先进（SOTA）的检测器。对于编辑攻击，我们使用 GPT-2
    分词器对输入进行分词，并对 1% 的标记应用随机插入、删除和替换。插入或替换的标记是从分词器的词汇表中均匀采样的。


