    Table 2 evaluates the real-world detection performance of all methods on three
    high-quality public benchmarks. DNA-DetectLLM demonstrates superior reliability,
    with average AUROC and F1 score improvements of 5.55% and 2.08%, respectively.
    Notably, it achieves significant AUROC gains on the challenging DetectRL settings—6.92%
    on Multi-LLM and 13.92% on Multi-Domain. This improvement can be attributed to
    the inherent difficulty of DetectRL, where both positive and negative samples
    may include mixtures of texts with the same label due to the dataset’s construction.
    Such complexity hinders traditional training-free methods that rely on fixed statistical
    scores. In contrast, DNA-DetectLLM appropriately computes repair scores for intricately
    constructed input texts by aligning them with their respective ideal AI-generated
    sequences. This flexible repair-based scoring allows for more accurate detection
    under distributional overlap and ambiguous cases, underscoring the practical utility
    of DNA-DetectLLM in complex detection scenarios.


    ## 4.3 Robustness


    ### 4.3.1 Robustness against Various Attacks


    Figure 4 illustrates the AUROC curves of DNA-DetectLLM and other baselines against
    various attacks (see Appendix E for details). We conducted experiments on texts
    generated by GPT-4 Turbo, Gemini-2.0 Flash, and Claude-3.7 Sonnet, incorporating
    two distinct attacks: token-level edits and paraphrasing. Editing attacks involved
    random insertion, deletion, or substitution of tokens at rates of 1%. The paraphrasing
    attacks employed DIPPER to rephrase AI-generated texts. To maintain clean labels,
    attacks were exclusively applied to AI-generated texts.


    ![](img/2697b8f09141d971af1c91a7a9002213_7_0.png)


    Figure 4: AUROC curves of DNA-DetectLLM and baselines under paraphrasing and editing
    attacks.


    ![](img/2697b8f09141d971af1c91a7a9002213_7_1.png)


    Figure 5: Detection performance (AUROC) on input texts truncated to the target
    number of tokens.


    The results demonstrate that DNA-DetectLLM exhibits strong robustness against
    a variety of adversarial attacks. For instance, on GPT-4 Turbo-generated text,
    our method achieves relative AUROC improvements of 6.65%, 3.17%, 6.62%, and 0.81%
    under insertion, deletion, substitution, and paraphrasing attacks, respectively.
    Notably, the improvement is particularly pronounced under low false positive rate
    (FPR) conditions. We attribute this robustness to the observation that although
    token-level edits are limited in scope, they can substantially alter the generation
    probability distribution of the input sequence while having minimal impact on
    its ideal AI-generated sequence. As a result, DNA-DetectLLM is still able to compute
    accurate repair scores for reliable detection. Moreover, even under paraphrasing
    attacks using Dipp er, the method effectively captures intrinsic deviations from
    the ideal sequence and maintains a high AUROC of 97.23%. These findings highlight
    DNA-DetectLLM’s capacity to detect adversarially manipulated AI-generated text,
    even when such attacks are designed to evade detection.


    ### 4.3.2 Robustness on Different Lengths


    Prior research [4, 28] indicates that token length significantly affects detection
    performance, with shorter texts proving more challenging to detect. We investigate
    the impact by truncating the input texts to vary target tokens. Figure 5 presents
    the detection performance across varying lengths for five methods: DNA-DetectLLM,
    Binoculars, Fast-DetectGPT, Lastde++, and Biscope. Results show that DNA-DetectLLM
    consistently outperforms all baselines across varying lengths. On GPT-4 Turbo-generated
    text, it achieves an average AUROC improvement of 2.46%. While all methods benefit
    from longer inputs, DNA-DetectLLM exhibits a greater advantage on shorter texts.
    At a token length of 40, it surpasses the second-best method by 3.38%, 1.80%,
    and 3.27%, respectively. These findings suggest that our method enables detection
    at shorter lengths by extracting more discriminative features from limited textual
    input.


    ![](img/2697b8f09141d971af1c91a7a9002213_8_0.png)


    ![](img/2697b8f09141d971af1c91a7a9002213_8_1.png)


    ### 4.4 Ablation Studies


    We further evaluated the importance of repair order and different base LLMs through
    two types of ablation experiments. More detailed ablation studies are available
    in Appendix F.


    **Repair Score-based Detection under Various Repair Orders.** Table 1 compares
    the detection performance of DNA-DetectLLM under various repair orders. When the
    repair order is changed to High-to-low, Low-to-high, or Sequential Repair, a slight
    performance drop is observed. Although these strategies still outperform other
    baselines, they require recalculating the conditional score after each mutated
    token repair, resulting in significantly increased computational cost. In contrast,
    the simplified repair score ($R(s) = \frac{1}{2}(\sigma(s) + \sigma(s|s))$) maintains
    strong performance while improving efficiency by an order of magnitude, highlighting
    its necessity in practical deployment.


    **DNA-DetectLLM’s Performance with Different $M_1$ and $M_2$.** Figure 6 evaluates
    four different LLM combinations: “Falcon-7B-Instruct + Falcon-7B”, “Llama-3-8B-Instruct
    + Llama-3-8B”, “Mistral-7B-Instruct + Mistral-7B”, and “Llama-2-7B + Llama-7B”.
    Results demonstrate that any of these combinations significantly outperform existing
    baselines, with an average performance improvement of 15.28%. Interestingly, the
    combination “Llama-2-7B + Llama-7B” slightly exceeds the default combination “Falcon-7B-Instruct
    + Falcon-7B” used in our main experiments, achieving AUROC of 92.4% and 90.7%.
    These findings highlight the inherent effectiveness of DNA-DetectLLM, suggesting
    its robust detection performance is not reliant on any specific LLM combination,
    with potential for further enhancement through better LLM pairings.


    ### 4.5 Efficiency Analysis


    Efficiency is critical for AI-generated text detection, as slow detection speeds
    hinder large-scale or real-time monitoring in practical scenarios. Figure 7 illustrates
    the average processing time per sample for each method. To eliminate the confounding
    factor of text length, we randomly sampled 1,000 long texts from the ReadDet dataset,
    truncated them to 300 tokens, and measured average detection cost with a batch
