    ## 11. 保障措施


    问题：论文是否描述了针对高风险误用（例如预训练语言模型、图像生成器或爬取的数据集）的数据或模型负责任发布而实施的保障措施？


    回答：[NA]


    理由：不涉及误用问题。


    指南：


    - 回答 NA 意味着论文未涉及此类风险。

    - 高风险误用或双重用途的已发布模型，应配备必要的保障措施，以便对模型的使用进行控制，例如要求用户遵守使用指南或限制对模型的访问权限，或实施安全过滤器。

    - 从互联网爬取的数据集可能存在安全风险。作者应描述他们是如何避免发布不安全图像的。

    - 我们认识到提供有效的保障措施具有挑战性，且许多论文并不强制要求这一点，但我们鼓励作者考虑此事并尽最大努力。


