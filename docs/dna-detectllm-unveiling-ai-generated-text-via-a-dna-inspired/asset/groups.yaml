    \ 或 GPU，内部集群或云提供商，包括相关的内存和存储。\n-   论文应提供每次单独实验运行所需的计算量以及估算总计算量。\n-   论文应披露完整的研究项目是否比论文中报告的实验需要更多计算资源（例如，未纳入论文的初步或失败实验）。\n\
