    ## 4.3 鲁棒性


    ### 4.3.1 对各种攻击的鲁棒性


    图 4 展示了 DNA-DetectLLM 及其他基线方法在各种攻击下的 AUROC 曲线（详情见附录 E）。我们在由 GPT-4 Turbo、Gemini-2.0
    Flash 和 Claude-3.7 Sonnet 生成的文本上进行了实验，并引入了两种不同的攻击：词元级编辑和改写。编辑攻击涉及以 1% 的比率随机插入、删除或替换词元。改写攻击使用
    DIPPER 对 AI 生成的文本进行重新表述。为了保持标签的清洁性，攻击仅应用于 AI 生成的文本。


    ![](img/2697b8f09141d971af1c91a7a9002213_7_0.png)


    图 4：DNA-DetectLLM 和基线方法在改写和编辑攻击下的 AUROC 曲线。


    ![](img/2697b8f09141d971af1c91a7a9002213_7_1.png)


    图 5：在截断至目标词元数的输入文本上的检测性能（AUROC）。


    结果表明，DNA-DetectLLM 对多种对抗性攻击表现出强大的鲁棒性。例如，在 GPT-4 Turbo 生成的文本上，我们的方法在插入、删除、替换和改写攻击下分别取得了
    6.65%、3.17%、6.62% 和 0.81% 的相对 AUROC 提升。值得注意的是，在低假正率（FPR）条件下，这种提升尤为显著。我们将这种鲁棒性归因于以下观察：虽然词元级编辑的范围有限，但它们可能会显著改变输入序列的生成概率分布，同时对其理想
    AI 生成序列的影响微乎其微。因此，DNA-DetectLLM 仍然能够计算准确的修复分数以实现可靠检测。此外，即使在使用 Dipp er 进行改写攻击的情况下，该方法也能有效捕捉与理想序列的内在偏差，并维持
    97.23% 的高 AUROC。这些发现突显了 DNA-DetectLLM 检测经过对抗性操纵的 AI 生成文本的能力，即使这些攻击旨在逃避检测。


    ### 4.3.2 在不同长度上的鲁棒性


    先前的研究 [4, 28] 表明，词元长度显著影响检测性能，较短的文本更难检测。我们通过截断输入文本以改变目标词元数来研究其影响。图 5 展示了五种方法在不同长度下的检测性能：DNA-DetectLLM、Binoculars、Fast-DetectGPT、Lastde++
    和 Biscope。结果显示，DNA-DetectLLM 在不同长度上始终优于所有基线方法。在 GPT-4 Turbo 生成的文本上，它实现了 2.46%
    的平均 AUROC 提升。虽然所有方法都受益于较长的输入，但 DNA-DetectLLM 在较短文本上表现出更大的优势。在词元长度为 40 时，它分别比次优方法高出
    3.38%、1.80% 和 3.27%。这些发现表明，我们的方法通过从有限的文本输入中提取更具判别力的特征，从而能够在较短长度下进行检测。


    ![](img/2697b8f09141d971af1c91a7a9002213_8_0.png)


    ![](img/2697b8f09141d971af1c91a7a9002213_8_1.png)


    ### 4.4 消融实验


    我们通过两类消融实验进一步评估了修复顺序和不同基础 LLM 的重要性。更详细的消融研究见附录 F。


    **各种修复顺序下的基于修复分数的检测。** 表 1 比较了 DNA-DetectLLM 在各种修复顺序下的检测性能。当修复顺序更改为“由高至低”、“由低至高”或“顺序修复”时，观察到性能略有下降。虽然这些策略仍优于其他基线，但它们需要在每次突变词元修复后重新计算条件分数，导致计算成本显著增加。相比之下，简化的修复分数（$R(s)
    = \frac{1}{2}(\sigma(s) + \sigma(s|s))$）在保持强大性能的同时，将效率提高了一个数量级，凸显了其在实际部署中的必要性。


    **DNA-DetectLLM 在不同 $M_1$ 和 $M_2$ 下的表现。** 图 6 评估了四种不同的 LLM 组合：“Falcon-7B-Instruct
    + Falcon-7B”、“Llama-3-8B-Instruct + Llama-3-8B”、“Mistral-7B-Instruct + Mistral-7B”
    和 “Llama-2-7B + Llama-7B”。结果表明，这些组合中的任意一种都显著优于现有基线，平均性能提升 15.28%。有趣的是，“Llama-2-7B
    + Llama-7B” 组合略微超过了我们在主要实验中使用的默认组合“Falcon-7B-Instruct + Falcon-7B”，实现了 92.4% 和
    90.7% 的 AUROC。这些发现突显了 DNA-DetectLLM 的内在有效性，表明其稳健的检测性能不依赖于任何特定的 LLM 组合，并通过更好的 LLM
    配对还有进一步提升的潜力。


    ### 4.5 效率分析


    效率对于 AI 生成文本检测至关重要，因为缓慢的检测速度会阻碍实际场景中的大规模或实时监控。图 7 展示了每种方法的平均每样本处理时间。为了消除文本长度这一混淆因素，我们从
    ReadDet 数据集中随机采样了 1,000 篇长文本，将其截断为 300 个词元，并在批次大小为 1 的情况下测量平均检测成本。我们观察到，Biscope
    和 OpenAI-D 等基于训练的方法最快，每文本处理时间少于 0.1 秒，但这些方法涉及显著的训练开销。在免训练方法中，Likelihood、Logrank
    和 Entropy 等经典方法速度更快，推理时间约为 0.3 秒，但其检测准确性未达我们的

