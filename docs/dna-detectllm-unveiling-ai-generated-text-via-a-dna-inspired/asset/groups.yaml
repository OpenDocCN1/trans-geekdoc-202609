    ## D Implementation Details


    All experiments are conducted on a single NVIDIA A100 GPU with 80GB of memory.
    Unless otherwise specified, default settings are used for temperature, top-k,
    and other generation parameters. No additional hyperparameter tuning is involved
    in this study. For training-based methods (Biscope and R-Detect), models are trained
    on 4,000 balanced samples from the HC3 dataset, and the best-performing checkpoints
    are selected based on validation performance on a separate 2,000-sample validation
    set. In the main experiments, all reported F1 scores are the maximum values obtained
    by selecting the optimal threshold based on the positive and negative scores of
    each method.


    ## E Robustness Experiments


    In this study, we do not consider adversarial attacks on human-written texts,
    as evasion in such cases is generally inconsequential. Instead, we focus on adversarial
    scenarios involving AI-generated texts, introducing two common attack types: paraphrasing
    and token-level editing. For paraphrasing attacks, we employ DAPPER with hyperparameters
    set to a lexical diversity of 60 and a syntactic diversity of 60. This level of
    paraphrasing is sufficient to potentially bypass SOTA detectors. For editing attacks,
    we tokenize the input using the GPT-2 tokenizer and apply random insertions, deletions,
    and substitutions to 1% of the tokens. The inserted or substituted tokens are
    sampled uniformly from the tokenizer''s vocabulary.


