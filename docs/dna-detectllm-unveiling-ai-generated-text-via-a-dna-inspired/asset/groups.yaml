    ![](img/2697b8f09141d971af1c91a7a9002213_1_0.png)


    Figure 1: Illustration of the Mutation-Repair Paradigm. The input sequence can
    be analogized to a replicating strand, while the ideal AI-generated sequence corresponds
    to the template strand.


    However, recent advancements in generative language modeling have produced outputs
    increasingly indistinguishable from human-authored content, causing these classification
    boundaries to become progressively blurred. Empirical studies [6, 24] have highlighted
    substantial overlap regions in the feature distributions of human-written and
    AI-generated texts, significantly undermining detection accuracy in practical
    scenarios. Therefore, one capable of more precisely and intrinsically capturing
    differences between the generative processes of AI and human writing is urgently
    needed.


    In molecular biology, DNA''s double-helix structure ensures stable transmission
    of genetic information, yet mutations during replication introduce variations
    that can lead to individual differences or even diseases such as cancer. In a
    similar vein, an ideal AI-generated text sequence can be seen as a “template strand”,
    representing the most probable token choices at each position. Human-written texts,
    by contrast, resemble mutated strands, where token selections deviate from the
    optimal probabilities, creating measurable differences. Inspired by this biological
    mechanism, we propose a new perspective for AI-generated text detection: by analogizing
    to DNA base-repair processes, we iteratively “correct” non-optimal tokens in a
    text and measure the difficulty of restoring it to the ideal AI-generated form.
    This repair-based approach captures the intrinsic divergence between AI-generated
    and human-written texts in a direct and interpretable manner.


    Building on this intuition, we propose **DIA-DetectLLM**, a novel method for zero-shot
    detection of AI-generated texts. For each input sequence, we first construct its
    corresponding ideal AI sequence—that is, the sequence formed by greedily selecting
    the most probable token at each position under a reference language model. We
    then perform a token-by-token repair process on the input sequence, progressively
    modifying tokens toward their optimal choices until the sequence fully aligns
    with the ideal AI sequence. To quantify the difficulty of this repair process,
    we introduce a repair score that captures the cumulative effort required to complete
    the transformation. Finally, by comparing the repair score against a calibrated
    threshold, **DIA-DetectLLM** robustly distinguishes AI-generated texts from human-written
    ones, leveraging the fundamental differences in their deviation patterns from
    ideal generation.


    **DIA-DetectLLM** consistently achieves state-of-the-art performance across multiple
    datasets and LLMs. In particular, it obtains relative improvements of **5.55%**
    in AUROC and **2.08%** in F1 score on three public benchmark datasets. Additionally,
    the method exhibits notable robustness against various adversarial attacks and
    across different input lengths. Efficiency experiments further indicate rapid
    detection capability, processing each sample in under 0.8s.


    Our contributions are summarized as follows:


    +   - Inspired by the mutation and repair mechanisms of nucleotide bases in DNA
    replication, we introduce the mutation-repair paradigm into AI-generated text
    detection.


    +   - We propose **DIA-DetectLLM**, a novel zero-shot method for detecting AI-generated
    text that incrementally repairs mutated tokens within the input sequence until
    it perfectly aligns with the ideal AI-generated sequence, subsequently quantifying
    the repair difficulty as a metric for text detection.'
