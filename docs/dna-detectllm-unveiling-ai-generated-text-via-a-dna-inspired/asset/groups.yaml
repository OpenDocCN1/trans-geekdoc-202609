    -   反之，如果核心部分提供了非正式证明，则应通过附录或补充材料中提供正式证明来予以补充。\n-   证明所依赖的定理和引理应正确引用。\n\n## 4.\
    \ 实验结果的可复现性\n\n问题：论文是否完整披露了复现其主要实验结果所需的所有信息，直至影响论文主要主张和/或结论的程度（无论是否提供代码和数据）？\n\
    \n答案：[是]\n\n理由：我们完整披露了复现主要实验结果所需的所有信息，包括但不限于第 3、4 节及附录 D 中提供的细节。\n\n指南：\n\n- \
    \  答案为 NA 表示论文未包含实验。\n-   如果论文包含实验，对该问题回答“否”将不会被审稿人良好接受：无论是否提供代码和数据，使论文可复现都是重要的。\n\
    -   如果贡献是数据集和/或模型，作者应描述为使结果可复现或可验证而采取的步骤。\n-   根据贡献不同，可复现性可以通过多种途径实现。例如，如果贡献是一种新颖架构，完整描述架构可能就足够了；或者如果贡献是特定模型和经验评估，可能有必要使他人能够使用相同数据集复制该模型，或者提供该模型的访问权限。通常，发布代码和数据是实现这一目标的好方法，但可复现性也可以通过详细说明如何复现结果、访问托管模型（例如，对于大型语言模型）、发布模型检查点或适合所进行研究的其他方式来提供。\n\
    -   虽然 NeurIPS 不要求发布代码，但会议要求所有投稿提供某种合理的可复现途径，这可能取决于贡献的性质。例如：\n    -   (a) 如果贡献主要是一种新算法，论文应清楚说明如何复现该算法。\n\
    \    -   (b) 如果贡献主要是一种新的模型架构，论文应清晰且完整地描述该架构。\n    -   (c) 如果贡献是一种新模型（例如，大型语言模型），那么要么可以访问该模型以复现结果，要么可以复现该模型（例如，使用开源数据集或如何构建数据集的说明）。\n\
    \    -   (d) 我们认识到在某些情况下可复现性可能具有挑战性，在这种情况下，欢迎作者描述他们提供可复现性的特定方式。对于闭源模型，模型的访问可能在某些方面受限（例如，仅限注册用户），但其他研究人员应有可能通过某种途径复现或验证结果。\n\
    \n## 5. 数据和代码的公开访问\n\n问题：论文是否按补充材料中所述，提供了数据和代码的公开访问权限，以及忠实地复现主要实验结果的充分说明？\n\n\
    答案：[是]\n\n理由：我们在补充材料中包含了数据和代码，并附有详细说明，以方便复现主要实验结果。\n\n指南：\n\n-   答案为 NA 表示论文未包含需要代码的实验。\n\
    -   更多详情请参阅 NeurIPS 代码和数据提交指南（[NeurIPS code and data submission guidelines](https://nips.cc/public/guides/CodeSubmissionPolicy)）。\n\
    -   虽然我们鼓励发布代码和数据，但我们理解这可能不可行，因此“否”是一个可接受的答案。除非未包含代码对贡献至关重要（例如，对于新的开源基准），否则论文不能仅因未包含代码而被拒绝。\n\
    -   说明中应包含复现结果所需的精确命令和环境。更多详情请参阅 NeurIPS 代码和数据提交指南（[NeurIPS code and data submission\
    \ guidelines](https://nips.cc/public/guides/CodeSubmissionPolicy)）。\n-   作者应提供数据访问和准备的说明，包括如何访问原始数据、预处理数据、中间数据和生成数据等。\n\
    -   作者应提供脚本以复现新提出方法和基线的所有实验结果。如果只有部分实验可复现，他们应说明哪些实验被排除在脚本之外以及原因。\n-   在提交时，为保持匿名性，作者应发布匿名版本（如适用）。\n\
    -   建议在补充材料（附在论文后）中提供尽可能多的信息，但允许包含指向数据和代码的 URL。\n\n## 6. 实验设置/细节\n\n问题：论文是否指定了理解结果所需的所有训练和测试细节（例如，数据划分、超参数、它们如何被选择、优化器类型等）？\n\
