    # 5 Conclusion


    In this paper, we introduce DNA-DetectLLM, a novel zero-shot AI-generated text
    detection method via a DNA-inspired mutation-repair paradigm. Extensive experiments
    demonstrate that DNA-DetectLLM consistently achieves SOTA detection performance
    while exhibiting strong robustness across diverse scenarios. We hope our work
    offers new insights and perspectives for AI-generated text detection and plan
    to further explore the mutation-repair paradigm to enhance detection performance.


