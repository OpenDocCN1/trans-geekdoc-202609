    # DNA-DetectLLM：通过 DNA 启发的突变-修复范式揭示 AI 生成文本


    Xiaowei Zhu¹,²; Yubing Ren¹,²; Fang Fang¹,²; Qingfeng Tan³; Shi Wang⁴; Yanan Cao¹,²


    ¹ 中国科学院信息工程研究所，北京，中国

    ² 中国科学院大学网络空间安全学院，北京，中国

    ³ 广州大学网络空间高等技术研究院，广州，中国

    ⁴ 中国科学院计算技术研究所，北京，中国


    {zhuxiaowei, renyubing}@iie.ac.cn


    ## 摘要


    大语言模型（LLM）的快速进步模糊了 AI 生成文本与人类撰写文本之间的界限。这一进展带来了虚假信息、作者归属模糊以及知识产权担忧等社会风险，突显了对可靠的
    AI 生成文本检测方法的迫切需求。然而，生成式语言建模的最新进展导致人类撰写文本与 AI 生成文本的特征分布出现显著重叠，模糊了分类边界，使准确检测变得愈发困难。为应对上述挑战，我们提出了一个受
    DNA 启发的视角，利用基于修复的过程直接且可解释地捕捉人类撰写文本与 AI 生成文本之间的内在差异。基于这一视角，我们引入了 DNA-DetectLLM，一种用于区分
    AI 生成文本和人类撰写文本的零样本检测方法。该方法为每个输入构建一个理想的 AI 生成序列，迭代修复非最优词元（token），并将累积的修复工作量量化为一种可解释的检测信号。实证评估表明，我们的方法实现了最先进的检测性能，并针对各种对抗性攻击和输入长度表现出强大的鲁棒性。具体而言，DNA-DetectLLM
    在多个公开基准数据集上，AUROC 取得了 5.55% 的相对提升，F1 分数取得了 2.08% 的相对提升。


    ## 1 引言


    大语言模型（LLM）的快速进步产生了越来越像人类的文本内容，极大地缩小了 AI 生成文本与人类撰写文本之间可区分的差距。虽然这些改进催生了重大的技术突破，但同时也带来了严峻的社会挑战，包括虚假信息的传播、作者归属的模糊以及对知识产权的威胁
    [2, 1, 12]。因此，迫切需要有效且可靠的方法来准确检测 AI 生成文本。


    尽管大量的研究工作致力于 AI 生成文本检测，但现有方法通常采用基于训练或无训练的方法。基于训练的方法 [25, 15, 11, 34, 10] 依赖于大量的标注数据，限制了其可扩展性及其向新域推广的能力。相比之下，无训练方法
    [19, 4, 13, 32] 利用固有的统计差异来区分人类撰写文本和 AI 生成文本。这两种范式本质上都是通过尝试在特征空间中识别不同的、可分离的边界来运行的。


    ![](img/2697b8f09141d971af1c91a7a9002213_1_0.png)


    图 1：突变-修复范式的示意图。输入序列可以类比为复制链，而理想的 AI 生成序列则对应于模板链。


    然而，生成式语言建模的最新进展产生的输出与人类创作的内容越来越难以区分，导致这些分类边界逐渐模糊。实证研究 [6, 24] 强调了人类撰写文本和 AI 生成文本在特征分布中存在的显著重叠区域，这严重降低了实际场景中的检测准确率。因此，迫切需要一种能够更精确、更本质地捕捉
    AI 与人类写作生成过程之间差异的方法。


    在分子生物学中，DNA 的双螺旋结构确保了遗传信息的稳定传递，但在复制过程中发生的突变会引入变异，可能导致个体差异甚至癌症等疾病。类似地，理想的 AI 生成文本序列可以被视为一条“模板链”，代表了每个位置最可能的词元选择。相比之下，人类撰写的文本更像是一条突变的链，其中词元选择偏离了最优概率，从而产生了可测量的差异。受这种生物机制的启发，我们提出了
    AI 生成文本检测的新视角：通过类比 DNA 碱基修复过程，我们迭代地“纠正”文本中的非最优词元，并衡量将其恢复为理想 AI 生成形式所需的难度。这种基于修复的方法直接且可解释地捕捉了
    AI 生成文本与人类撰写文本之间的固有分歧。


    基于这一直觉，我们提出了 **DNA-DetectLLM**，一种检测 AI 生成文本的新型零样本方法。对于每个输入序列，我们首先构建其对应的理想 AI 序列——即在参考语言模型下，通过在每个位置贪心地选择最可能词元所形成的序列。然后，我们对输入序列执行逐词元的修复过程，逐步将词元修改为它们的最优选择，直到序列与理想
    AI 序列完全对齐。为了量化这一修复过程的难度，我们引入了一个修复分数，用于捕捉完成转变所需的累积工作量。最后，通过将修复分数与校准的阈值进行比较，**DNA-DetectLLM**
    利用其偏离理想生成模式的根本差异，稳健地区分 AI 生成文本和人类撰写文本。


    **DNA-DetectLLM** 在多个数据集和 LLM 上始终实现最先进的性能。特别是，它在三个公开基准数据集上获得了 **5.55%** 的 AUROC
    相对提升和 **2.08%** 的 F1 分数相对提升。此外，该方法对多种对抗性攻击表现出显著的鲁棒性，并且适用于不同的输入长度。效率实验还表明其具有快速的检测能力，每个样本的处理时间不到
    0.8 秒。


    我们的贡献总结如下：


    - 受 DNA 复制过程中核苷酸碱基的突变和修复机制启发，我们将突变-修复范式引入 AI 生成文本检测。


    - 我们提出了 **DNA-DetectLLM**，这是一种检测 AI 生成文本的新型零样本方法，该方法增量地修复输入序列中的突变成词元，直到其与理想的 AI
    生成序列完美对齐，随后将修复难度量化为文本检测的指标。


    - 广泛的评估验证了 DNA-DetectLLM 为 AI 生成文本检测提供了一种可靠、高效且具有广泛通用性的解决方案，在各种检测设置下均有一致的提升。


    ## 2 相关工作


    检测 AI 生成文本对于增强公众信任度和防止误用至关重要，引发了学术界和工业界日益增长的兴趣。除了水印技术 [18]（在生成期间嵌入可识别的标记）之外，当前的事后检测方法大致分为基于训练和无需训练的方法。


    **基于训练的方法。** 此类方法通常涉及训练分类模型以区分 AI 生成文本和人类撰写文本。具体而言，OpenAI [25] 早期的努力采用基于 RoBERTa
    的模型来训练文本分类器。随后，RADAR [15] 引入对抗性学习以增强对改写文本的鲁棒性。DeTeCtive [11] 利用多层级对比学习将由不同 LLM
    生成的文本映射到相应的特征空间，并基于相似度指标进行分类。DPIC [34] 通过重构提示词并重新生成文本来提取深层文本特征。Biscopic [10] 提出采用双向交叉熵损失来提取统计特征，用于训练二元分类器。R-Detect
    [26] 采用非参数核相对测试来检测 AI 生成文本，从而与双样本测试相比降低了假阳性率。然而，现有研究 [5, 29] 表明，基于训练的方法通常会对分布内特征过拟合，导致对分布外（OOD）文本的泛化能力较差。因此，研究人员越来越关注开发更具通用性的无训练方法。


    **无训练的方法。** 这些无训练方法强调利用文本的概率特性，基于特定假设构建统计分数，并根据分数与阈值的比较做出决策。例如，LogRank [8]、Likelihood
    [14] 和 Entropy [16] 计算平均概率排名、似然概率和熵值，以衡量 AI 生成文本的不确定性。DetectGPT [19] 开创了一种使用扰动生成大量对比样本来评估整体分布的范式。虽然
    DetectLLM-NPR [27] 和 DNA-GPT [33] 等方法进一步发展了这一范式，但其效率局限性阻碍了实时或大规模检测的实现。Fast-DetectGPT
    [4] 随后更新了采样技术，以计算条件概率曲率，显著提高了检测效率并拓宽了潜在应用。Binarcoles [13] 通过从双模型视角计算交叉困惑度（cross-perplexity）实现了最先进的分类性能。Lastde++
    [32] 提出通过计算多样性熵（Diversity Entropy）来关注局部文本特征，以优化分类性能。


