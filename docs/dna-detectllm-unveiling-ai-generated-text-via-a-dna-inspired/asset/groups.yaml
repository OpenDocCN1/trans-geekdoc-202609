    # ## 4 Experiments


    # ### 4.1 Experimental Setup


    **Datasets.** To evaluate performance across diverse domains, we collect 4,800
    human-written texts from three representative tasks: news article writing (XSum
    [20]), story generation (WritingPrompts [7]), and academic writing (ArXiv [21]).
    For each text, we construct task-specific prompts (see Appendix C) and generate
    corresponding AI outputs using three advanced LLMs: GPT-4 Turbo, Gemini-2.0 Flash,
    and Claude-3.7 Sonnet. We further sample 2,000 balanced samples from each of three
    high-quality detection benchmarks—M4 [30], DetectRL [31], and RealDet [35]—to
    ensure fair and comprehensive evaluation across real-world scenarios.


    **Metrics.** We adopt the area under the receiver operating characteristic curve
    (AUROC [17]) and F1 score to evaluate detection performance, where higher values
    indicate better separability between human-written and AI-generated texts.


    **Baselines.** We compare DNA-DetectLLM with existing training-based and training-free
    methods. For training-based methods, we include OpenAI-D [25], Biscope [10] and
    R-Detect [26]. For training-free methods, we consider classic zero-shot detectors
    including Likelihood [14], LogRank [8], and Entropy [16], along with several recent
    SOTA approaches such as DetectGPT [19], Fast-DetectGPT [4], Binculars [13], and
    LastDet++ [32].


    **Implementation details.** In real-world detection scenarios, the source and
    distribution of textual data are often unknown, constituting an out-of-distribution
    (OOD) detection problem. To ensure fairness for training-based methods, we exclusively
    train on the HC3 dataset [9], which is entirely disjoint from the test sets. For
    training-free methods, the choice of LLM used for scoring can introduce significant
    performance variation [3]. To eliminate this factor, we standardize the reference
    (or scoring) model across all methods by employing Falcon-7B-Instruct [22] to
    compute token generation probabilities. Moreover, Fast-DetectGPT, Binculars, LastDet++,
    and DNA-DetectLLM utilize Falcon-7B [22] as the observer (or sampling) model,
    while DetectGPT uses TS-3B [23]. During testing, the maximum input token length
    is capped at 1024. More details are in Appendix D.


