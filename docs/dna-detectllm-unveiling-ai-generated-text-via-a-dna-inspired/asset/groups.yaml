    # A Limitations


    Due to memory constraints, we were unable to scale up the batch size for evaluating
    method efficiency under ample computational resources. As a result, this study
    does not fully explore performance differences in real-world scenarios involving
    large-scale, real-time monitoring of AI-generated texts. The reported efficiency
    results are based on relative comparisons under a uniform small-batch setting.'
