    -   完整细节可以提供在代码中、附录中或作为补充材料。\n\n## 7. 实验统计显著性\n\n问题：论文是否适当且正确地报告了误差线，或关于实验统计显著性的其他适当信息？\n\
    \n答案：[否]\n\n理由：虽然我们未报告误差线，但我们使用 AUROC 和 F1 分数对我们的方法和所有基线进行评估。\n\n指南：\n\n-   答案为\
    \ NA 表示论文未包含实验。\n-   如果结果附有误差线、置信区间或统计显著性检验，至少对于支持论文主要主张的实验，作者应回答“是”。\n-   误差线所捕获的变异性因素应明确陈述（例如，训练/测试划分、初始化、某个参数的随机抽取，或在给定实验条件下的整体运行）。\n\
    -   应解释计算误差线的方法（闭式公式、调用库函数、自举法等）。\n-   应给出所做的假设（例如，误差服从正态分布）。\n-   应清楚误差线是标准差还是均值的标准误。\n\
    -   报告 1 倍标准差（1-sigma）误差线是可以的，但应加以说明。如果未验证误差的正态性假设，作者最好报告 2 倍标准差（2-sigma）误差线，而不是声称拥有\
    \ 96% 的置信区间。\n-   对于非对称分布，作者应注意不要在表格或图表中显示对称误差线，因为这会导致超出范围的结果（例如，负的误差率）。\n-  \
    \ 如果误差线报告在表格或图中，作者应在文本中解释其计算方式，并在文本中引用相应的图表。\n\n## 8. 实验计算资源\n\n问题：对于每个实验，论文是否提供了足够的关于复现实验所需的计算机资源（计算工作器类型、内存、执行时间）的信息？\n\
