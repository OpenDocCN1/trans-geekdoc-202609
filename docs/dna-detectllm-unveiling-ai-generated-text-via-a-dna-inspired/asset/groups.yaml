    # Abstract


    The rapid advancement of large language models (LLMs) has blurred the line between
    AI-generated and human-written text. This progress brings societal risks such
    as misinformation, authorship ambiguity, and intellectual property concerns, highlighting
    the urgent need for reliable AI-generated text detection methods. However, recent
    advances in generative language modeling have resulted in significant overlap
    between the feature distributions of human-written and AI-generated text, blurring
    classification boundaries and making accurate detection increasingly challenging.
    To address the above challenges, we propose a DNA-inspired perspective, leveraging
    a repair-based process to directly and interpretably capture the intrinsic differences
    between human-written and AI-generated text. Building on this perspective, we
    introduce DNA-DetectLLM, a zero-shot detection method for distinguishing AI-generated
    and human-written text. The method constructs an ideal AI-generated sequence for
    each input, iteratively repairs non-optimal tokens, and quantifies the cumulative
    repair effort as an interpretable detection signal. Empirical evaluations demonstrate
    that our method achieves state-of-the-art detection performance and exhibits strong
    robustness against various adversarial attacks and input lengths. Specifically,
    DNA-DetectLLM achieves relative improvements of 5.55% in AUROC and 2.08% in F1
    score across multiple public benchmark datasets.


    # 1 Introduction


    The rapid advancement of large language models (LLMs) has created increasingly
    human-like textual content, substantially narrowing the distinguishable gap between
    AI-generated and human-written text. While these improvements have catalyzed significant
    technological breakthroughs, they simultaneously pose critical societal challenges,
    including misinformation dissemination, authorship ambiguity, and threats to intellectual
    property rights [2, 1, 12]. Consequently, there is an urgent and growing need
    for effective and reliable methods to accurately detect AI-generated text.


    While significant research efforts have been dedicated to AI-generated text detection,
    existing methodologies typically adopt either training-based or training-free
    approaches. Training-based methods [25, 15, 11, 34, 10] depend upon large volumes
    of annotated data, limiting their scalability and generalization to new domains.
    In contrast, training-free approaches [19, 4, 13, 32] leverage intrinsic statistical
    differences to distinguish human-written and AI-generated texts. Both paradigms
    fundamentally operate by attempting to identify distinct, separable boundaries
    within the feature space.'
