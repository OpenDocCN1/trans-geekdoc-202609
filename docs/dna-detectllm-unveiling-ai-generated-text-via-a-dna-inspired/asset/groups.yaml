    # DNA-DetectLLM: Unveiling AI-Generated Text via a DNA-Inspired Mutation-Repair
    Paradigm


    Xiaowei Zhu1,2; Yubing Ren1,2; Fang Fang1,2; Qingfeng Tan3; Shi Wang4; Yanan Cao1,2


    1 Institute of Information Engineering, Chinese Academy of Sciences, Beijing,
