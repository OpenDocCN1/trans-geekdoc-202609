    # ## Related Works


    Detecting AI-generated text is essential for enhancing public trust and preventing
    misuse, driving growing interest from both academia and industry. Beyond watermarking
    techniques [18], which embed identifiable markers during generation, current post
    hoc detection methods are broadly categorized into training-based and training-free
    methods.


    **Training-based Methods.** Such approaches typically involve training classification
    models to distinguish between AI-generated and human-written texts. Specifically,
    early efforts by OpenAI [25] employed RoBERTa-based models for training text classifiers.
    Subsequently, RADAR [15] introduced adversarial learning to enhance the robustness
    against paraphrased texts. DeTeCtive [11] utilized multi-level contrastive learning
    to map texts generated by different LLMs into corresponding feature spaces, classifying
    them based on similarity metrics. DPIC [34] extracted deep textual features by
    reconstructing prompts and regenerating texts. Biscopic [10] proposed employing
    a bidirectional cross-entropy loss to extract statistical features for binary
    classifier training. R-Detect [26] employs a nonparametric kernel relative test
    to detect AI-generated text, thereby reducing the false positive rate compared
    to two-sample tests. However, existing research [5, 29] indicates that training-based
    methods consistently overfit to in-distribution features, resulting in poor generalization
    to out-of-distribution (OOD) texts. Consequently, researchers have increasingly
    focused on developing more universally applicable training-free methods.


    **Training-free Methods.** These training-free methods emphasize exploiting probabilistic
    char-acteristics of texts, constructing statistical scores based on specific hypotheses,
    and making decisions according to the comparison of scores against thresholds.
    For example, LogRank [8], Likelihood [14], and Entropy [16] calculate the average
    probability ranking, likelihood probabilities, and entropy values to measure the
    uncertainty of AI-generated texts. DetectGPT [19] pioneered a paradigm that uses
    perturbations to generate numerous contrast samples to evaluate the overall distribution.
    Although methods such as DetectLLM-NPR [27] and DNA-GPT [33] have further developed
    this paradigm, their efficiency limitations prevent real-time or large-scale detection
    implementations. Fast-DetectGPT [4] has since updated sampling techniques to compute
    conditional probability curvature, significantly improving detection efficiency
    and broadening potential applications. Binarcoles [13] achieved state-of-the-art
    classification performance by calculating cross-perplexity from dual-model perspectives.
    Lastde++ [32] proposed focusing on local textual features by calculating Diversity
    Entropy to optimize classification performance.


