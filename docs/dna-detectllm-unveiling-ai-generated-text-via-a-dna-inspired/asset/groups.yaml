    ## 3.2 DNA-DetectLLM 概述


    DNA-DetectLLM 的完整工作流程可以概括为 3 个关键步骤，如图 2 所示。


    - **步骤 1：获取理想的 AI 生成序列。** 对于给定的输入，我们通过在每个位置贪心地选择最可能的词元来构建理想的 AI 生成序列。

    - **步骤 2：突变修复机制。** 我们对输入序列进行迭代的词元级修改，直到它与理想的 AI 生成序列完全一致。

    - **步骤 3：基于修复分数的检测。** 我们引入一个修复分数来量化修复的难度，该分数与经过校准的阈值进行比较，以确定检测结果。


    ## 3.3 获取理想的 AI 生成序列


    我们提出了*理想 AI 生成序列 $\hat{s}$*的概念，类似于 DNA 复制中无错误的模板链，其中每个词元都是通过最大化其位置上的条件概率来选择的：


    $$\hat{s} = \{\hat{x}_{1}, \hat{x}_{2}, \dots, \hat{x}_{L}\}, \quad \text{其中}
    \quad \hat{x}_{i} = \arg \max_{\hat{x} \in \mathcal{V}} P_{M_{1}}(\hat{x} | x_{<i}),
    \tag{3}$$


    其中 $\mathcal{V}$ 表示词汇表，$x_{<i} = \{x_{1}, \dots, x_{i-1}\}$ 表示输入序列 $s$ 的前 $i-1$
    个词元。


    ## 3.4 突变修复机制


    我们将非最大概率词元视为突变词元，将最大概率词元视为理想词元。类似于 DNA 中的突变-修复范式，我们提出了一种*突变修复机制*，旨在揭示 AI 生成文本和人工撰写文本在偏差模式上的根本差异。在该机制下，输入序列中的突变词元通过逐步用其理想词元进行迭代修复，直到输入与理想形式完全一致：


    $$x_{i} \in s = \{x_{1}, x_{2}, \dots, x_{L}\} \rightarrow \hat{x}_{i} = \arg
    \max_{\hat{x} \in \mathcal{V}} P_{M_{1}}(\hat{x} | x_{<i}), \quad \text{如果} \quad
    x_{i} \neq \hat{x}_{i}, \tag{4}$$


    ![](img/2697b8f09141d971af1c91a7a9002213_4_0.png)


    图 3：不同修复策略下修复分数的变化。


    ## 3.5 基于修复分数的检测


    我们引入了*修复分数* $R(s)$ 来量化修复过程的难度，定义为其在整个修复轨迹中累积的平均条件分数：


    $$R(s) = \frac{1}{T+1} \sum_{t=0}^{T} \sigma(s_{t}|s) = \frac{\sum_{t=0}^{T} \log
    \text{PPL}_{M_{t}}(s_{t}|s)}{(T+1) \log X \text{-PPL}_{L, M_{T}}(s)}, \qquad (5)$$


    其中 $s_{t}$ 是 $t$ 步修复后的序列，$T$ 是需要修正的突变词元的总数。


    人工撰写的文本通常表现出更严重的突变，导致修复难度更大。相比之下，AI 生成的文本通常更容易修复。因此，输入序列的检测结果确定如下：


    $$D(s) = \begin{cases} \text{人工撰写的文本}, & R(s) > \tau \\ \text{AI 生成的文本}, & R(s)
    \leq \tau. \end{cases} \qquad (6)$$


    ## 3.6 对修复顺序的敏感性以及分数简化


    图 3 表明，对于相同的输入序列，不同的修复顺序会产生不同的修复分数，这是由于每个突变词元对条件分数的影响不相等。突变词元可以大致分为高概率和低概率类型。修复低概率词元通常会导致条件分数发生较大变化，而高概率词元导致的较小变化。为了系统地分析修复顺序的影响，我们确定了以下四种主要的修复策略：


    - **从高到低：** 先修复高概率词元，然后修复低概率词元，会导致一个凸形的“修复曲线”和较高的修复分数。

    - **从低到高：** 先修复低概率词元，再修复高概率词元，会产生一个凹形的“修复曲线”和较低的修复分数。

    - **顺序修复：** 无论概率值如何，都按照词元在输入序列中出现的原始顺序进行修复。

    - **随机修复：** 按随机选择的顺序修复词元。对多次随机修复的修复分数取平均值可得到更稳定的估计。


    这些发现突显了修复分数对所选修复顺序的敏感性。执行多次随机修复可以有效缓解偏差，使修复分数接近初始分数和最终分数的中间值。因此，我们进一步推导出，当随机修复次数
    $N$ 趋于无穷大时，平均修复分数收敛。推导如下：


    设 $\{\delta_{1}, \delta_{2}, \dots, \delta_{T}\}$ 为满足 $\sum_{i=1}^{T} \delta_{i}
    = \sigma(s) - \sigma(s|s)$ 的一组非负实数。此外，$\delta_{i} = \sigma(s_{t-1}|s) - \sigma(s_{t}(s)$
    量化了修复当前词元对分数的影响。由于每个词元修复对条件对数困惑度的影响是独立且固定的，因此对于给定的输入序列，集合 $\{\delta_{1}, \delta_{2},
    \dots, \delta_{T}\}$ 由固定值组成，其顺序取决于修复策略而变化。进一步可得：


    $$\sigma(s_{t}|s) = \sigma(s) - \sum_{i=1}^{t} \delta_{i} \quad \text{对于 } t =
    1, 2, \dots, T, \quad \text{其中 } \sigma(s) = \sigma(s_{0}|s). \qquad (7)$$


    对于特定的排列 $\phi \in [1, N]$，对应的修复分数 $R^{\phi}(s)$ 为：


    $$R^{\phi}(s) = \frac{1}{T + 1}\sum_{t = 0}^{T}\left(\sigma(s) - \sum_{i = 1}^{t}\delta_i^{\phi}\right)
    = \sigma(s) - \frac{1}{T + 1}\sum_{i = 1}^{T}\delta_i^{\phi}\cdot(T - i + 1).$$


    由于每个词元被随机修复的概率相等，$\delta_i^{\phi}$ 在所有排列中出现在第 $i$ 个位置的期望值为 $\frac{1}{T}(\sigma(s)
    - \sigma(s \mid s))$。我们进一步推导修复分数的期望值如下：


    $$\mathbb{E}[R(s)] = \sigma(s) - \frac{1}{T + 1}\sum_{i = 1}^{T}\mathbb{E}\left[\delta_i^{\phi}\right]\cdot(T
    - i + 1) = \sigma(s) - \frac{1}{T + 1}\cdot\frac{\sigma(s) - \sigma(s \mid s)}{T}\cdot\frac{T(T
    + 1)}{2}.$$


    因此，当随机排列数量 $N$ 趋于无穷大时，平均修复分数收敛如下：


    $$\lim_{N \to \infty}\frac{1}{N}\sum_{n = 1}^{N}R^{(n)}(s) = \lim_{N \to \infty}\frac{1}{N}\sum_{n
    = 1}^{N}\left(\frac{1}{T + 1}\sum_{t = 0}^{T}\sigma^{(n)}(s_i \mid s)\right) =
    \frac{1}{2}(\sigma(s) + \sigma(s \mid s)).$$


    因此，我们将修复分数简化为 $R(s) = \frac{1}{2}(\sigma(s) + \sigma(s \mid s))$，在提高检测性能的同时避免了修复过程中的中间分数计算。


    # 4 实验


    ## 4.1 实验设置


    **数据集。** 为了评估在不同领域的表现，我们从三个代表性任务中收集了 4,800 条人工撰写的文本：新闻文章写作（XSum [20]）、故事生成（WritingPrompts
    [7]）和学术写作（ArXiv [21]）。对于每条文本，我们构建了特定于任务的提示词（见附录 C），并使用三个先进的 LLM 生成相应的 AI 输出：GPT-4
    Turbo、Gemini-2.0 Flash 和 Claude-3.7 Sonnet。我们进一步从三个高质量的检测基准——M4 [30]、DetectRL
    [31] 和 RealDet [35]——中各采样 2,000 条平衡样本，以确保在真实场景中进行公平和全面的评估。


    **指标。** 我们采用接收者操作特征曲线下面积（AUROC [17]）和 F1 分数来评估检测性能，其中较高的值表明人工撰写文本与 AI 生成文本之间的可分离性更好。


