    ## B Broader Impacts


    The proposed DNA-DetectLLM contributes to the field of AI-generated text detection
    by improving accuracy and introducing a novel detection perspective to the research
    community. Its enhanced reliability may serve as a reference in socially relevant
    scenarios where auxiliary judgment is required. However, we emphasize that detection
    inherently carries a risk of implication or accusation. While our method demonstrates
    strong performance, we strongly oppose the use of its outputs as direct evidence
    in punitive or disciplinary contexts. Regardless of its accuracy, such applications
    could lead to serious consequences and misuse.


    ## C Prompt Design for Main Data


    Table 3: Examples of input prompts and corresponding outputs across different
    writing tasks, where the outputs are sampled from GPT-4-generated texts.


