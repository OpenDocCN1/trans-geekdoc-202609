  md: '# Build a Swarm


    If you’re following along, you’ll need a swarm because overlay networks leverage
    the swarm’s key-value store and other security features.


    This section builds a two-node swarm with two Docker nodes called node1 and node2.
    If you already have a swarm, you can skip this section.


