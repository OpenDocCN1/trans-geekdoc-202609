- pgno: 322
  md: '# Intro to Wasm and Wasm containers


    Wasm is a new type of application that is smaller, faster, and more portable than
    traditional Linux containers. However, traditional Linux containers can do a lot
    more than Wasm apps. For example, Wasm apps are currently great for AI workloads,
    serverless functions, plugins, and edge devices but not so good for complex networking
    or heavy I/O.


    However, Wasm is evolving fast and may become better at other workloads in the
    future.


    Digging a little deeper...


    As we''re about to see, Wasm is a new virtual machine architecture that programming
    languages compile to. So, instead of compiling apps to Linux on ARM or Linux on
    AMD, you compile them to Wasm. You can then run these Wasm apps on any system
    with a Wasm runtime. Fortunately, Docker Desktop already ships with several Wasm
    runtimes.


    Run the following command to see the list of Wasm runtimes installed as part of
    your Docker Desktop environment. The first time you run the command, it will download
    the image.'
  merge: -1
  img_proc: true
- pgno: 323
  md: '```

    $ docker run --rm -i --privileged --pid=host jorgeprendes420/docker

    io.containerd.wasmtime.v1

    io.containerd.spin.v2

    io.containerd.wss.v1

    io.containerd.lunatic.v1

    io.containerd.slight.v1

    io.containerd.wasmedge.v1

    io.containerd.wasmer.v1

    ```


    My installation has seven Wasm runtimes, including the **io.containerd.spin.v2**
    runtime we''ll use in the examples.


    These Wasm runtimes allow **containerd** to deploy and manage **Wasm containers**.
    A **Wasm container** is a Wasm running inside a minimal **scratch** container
    so that you can build, ship, and run them with familiar Docker tools such as the
    **docker run** command and Docker Hub.


    Talk is cheap though, let''s see it in action.


    # Write a Wasm app


    We''ll use **spin** to create a simple web server that we''ll compile as a Wasm
    app. In future steps, you''ll build, ship, and run the app as a Wasm container.


    Change into a new directory and then run the following command to create a new
    Wasm app called `hello-world`.'
  merge: -1
  img_proc: true
- pgno: 324
