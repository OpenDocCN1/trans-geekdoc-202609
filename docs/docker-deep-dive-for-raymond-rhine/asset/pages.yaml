  md: '```

    $ docker service rm svcl

    ```


    Now, delete the standalone containers you created.


    ```

    $ docker rm c1 c2 client web mactainer1 -f

    ```


    Finally, delete the networks you created.


    ```

    $ docker network rm localnet macvlan100

    ```


    # Docker Networking – The Commands


    Docker networking has its own docker network sub-command, and the main commands
    include:


    +   - docker network ls lists all the Docker networks available to the host.

    - docker network create is how you create a new Docker network. You have to give
    the network a name and you can use the -d flag to specify which driver it creates.

    - docker network prune deletes all unused networks on a Docker host.'
  merge: -1
  img_proc: true
- pgno: 380
  md: '+   - **docker network rm** Deletes specific networks on a Docker host or swarm.


    You also ran some native Linux commands.


    +   - **brctl show** prints a list of all kernel bridges on the Docker host and
    shows if any containers are connected.


    +   - **ip link show** prints bridge configuration data. You ran an **ip link
    show docker0** to see the configuration of the **docker0** bridge on your Docker
    host.


    # Chapter Summary


    The Container Network Model (CNM) is the design document for Docker networks and
    defines the three major constructs — sandboxes, endpoints, and networks.


    Libnetwork is the reference implementation of the CMN and is an open-source project
    maintained by the Moby project. Docker uses it to implement its core networking,
    including control plane services such as service discovery.


    Drivers extend the capabilities of libnetwork by implementing specific network
    topologies, such as bridge and overlay networks. Docker ships with built-in drivers,
    but you can also use third-party drivers.'
  merge: -1
  img_proc: true
- pgno: 381
  md: 'Single-host bridge networks are the most basic type of Docker network but are
    only suitable for local development and very small applications. They do not scale,
    and you need to map containers to host ports if you want to publish services outside
    of the network.


    Overlay networks are all the rage and are excellent container-only multi-host
    networks. We’ll talk about them in-depth in the next chapter.


    The macvlan driver lets you create Docker networks that connect containers to
    existing physical networks and VLANs. They make containers first-class citizens
    on external networks by giving them their own MAC and IP addresses. Unfortunately,
    you have to run your host NICs in promiscuous mode, meaning they won’t work in
    public clouds.'
  merge: -1
  img_proc: true
- pgno: 382
  md: '# # 14: Docker overlay networking


    Overlay networks are at the center of most cloud-native microservices apps, and
    this chapter will get you up to speed on how they work in Docker.


    I''ve divided the chapter into the following sections:


    +   - Docker overlay networking – The TLDR

    - Docker overlay networking history

    - Building and testing overlay networks

    - Overlay networks explained


    Let''s do some networking magic!


    # ## Docker overlay networking – The TLDR


    Real-world containers need a reliable and secure way to communicate without caring
    which host they’re running on or which networks those hosts are connected to.
    — they create flat, layer 2 networks that span multiple hosts. Containers on different
    hosts can connect to the same overlay network and communicate directly.'
  merge: -1
  img_proc: true
- pgno: 383
  md: 'Docker offers native overlay networking that is simple to configure and secure
    by default.


    # Docker overlay networking history


    In March 2015, Docker, Inc. acquired a container networking startup called Socket
    Plane with two goals in mind:


    +   1. Bring overlay networking to Docker

    2. Make container networking simple for developers


    They accomplished both goals, and overlay networking continues to be at the heart
    of container networking in 2024 and the foreseeable future.


    However, there''s a lot of complexity hiding behind the simple Docker commands.
    Knowing the commands is probably enough if you''re a casual Docker user. However,
    if you plan to use Docker in production, especially if you plan to use Swarm and
    Docker networking, then the things we''ll cover will be vital.'
  merge: -1
  img_proc: true
