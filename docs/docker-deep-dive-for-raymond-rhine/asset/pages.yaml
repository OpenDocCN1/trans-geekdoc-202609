    # Deploying apps with Compose – The commands


    +   **docker compose up** is the command to deploy a Compose app. It creates all
    images, containers, networks, and volumes the app needs. It expects you to call
    the Compose file **compose.yaml**, but you can specify a custom filename with
    the **-f** flag. You''ll normally start the app in the background with the **--detach**
    flag.'
