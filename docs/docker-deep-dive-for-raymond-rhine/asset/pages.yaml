- pgno: 371
  md: '# Service discovery


    As well as core networking, libnetwork also provides service discovery that allows
    all containers and Swarm services to locate each other by name. The only requirement
    is that the containers be on the same network.


    Under the hood, Docker implements a native DNS server and configures every container
    to use it for name resolution.


    Figure 13.18 shows a container called c1 pinging another container called c2 by
    name. The same principle applies to Swarm service replicas.


    ![](img/aae0230bf8529bd80767c4c780dca8d3_371_0.png)


    Figure 13.18


    Let''s step through the process.'
  merge: -1
  img_proc: true
- pgno: 372
  md: '+   - **Step 1:** The c1 container issues a ping c2 command. The container’s
    local DNS resolver checks its cache to see if it has an IP address for c2. All
    Docker containers have a local DNS resolver.

    - **Step 2:** The local resolver doesn''t have an IP address for c2, so it initiates
    a recursive query to the embedded Docker DNS server. All Docker containers are
    pre-configured to know how to send queries to the embedded DNS server.

    - **Step 3:** The Docker DNS server maintains name-to-IP mappings for every container
    you create with the --name --net-alias flags. This means it knows the IP address
    of the c2 container.

    - **Step 4:** The DNS server returns the IP address of the c2 container to the
    local resolver in the c1 container. If c1 and c2 are on different Docker networks
    it won''t return the IP address — name resolution only works for containers on
    the same network.

    - **Step 5:** The c1 container sends the ping request (ICMP echo request) to the
    IP address of c2.


    Just to confirm a few points.


    Docker will automatically register the name and IP of every container you create
    with the --name or net-alias flag with the embedded Docker DNS service. It also
    automatically'
  merge: -1
  img_proc: true
- pgno: 373
  md: "configures every container to use the embedded DNS service to convert names\
    \ to IPs. And name resolution (service discovery) is network scoped, meaning it\
    \ only works for containers and services on the same network.\n\nOne last point\
    \ on service discovery and name resolution...\n\nYou can use the `--dns` flag\
    \ to start containers and services with a customized list of DNS servers, and\
    \ you can use the `--dns-search` flag to add custom search domains for queries\
    \ against unqualified names (i.e., when the application doesn't specify fully\
    \ qualified DNS names for services they consume). You'll find both of these useful\
    \ if your applications query names outside of your Docker environment such as\
    \ internet services.\n\nBoth of these options work by adding entries to the container's\
    \ `/etc/resolv.conf` file.\n\nRun the following command to start a new container\
    \ with the infamous 8.8.8.8 Google DNS server and nigelpoulton.com as a search\
    \ domain for unqualified queries.\n\n```\n$ docker run -it --name custom-dns \\\
    \n  --dns=8.8.8.8 \\\n  --dns-search=nigelpoulton.com \\\\\n  alpine sh\n```"
  merge: -1
  img_proc: true
- pgno: 374
  md: 'Your shell prompt will change to indicate you’re connected to the container.


    Inspect its `/etc/resolv.conf` file.


    ```

    # cat /etc/resolv.conf

    Generated by Docker Engine.

    This file can be edited; Docker Engine will not make further changes.

    has has been modified.


