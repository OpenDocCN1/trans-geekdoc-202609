    # Signing and verifying images with Docker Content Trust


    Docker Content Trust (DCT) makes it simple for you to verify the integrity and
    publisher of images and is especially important when you''re pulling images over
    untrusted networks such as the internet.


    At a high level, DCT lets you sign your images when you push them to registries
    like Docker Hub. It also lets you verify the images you pull and run as containers.


    Figure 16.9 shows the high-level process.'
  merge: -1
  img_proc: true
- pgno: 455
  md: '![](img/aae0230bf8529bd80767c4c780dca8d3_455_0.png)


    Figure 16.9 - Docker Content Trust image signing and verification


    You can also use DCT to provide *context*, such as whether or not a developer
    has signed an image for use in a particular environment such as **prod** or **dev**,
    or whether an image has been superseded by a newer version and is therefore stale.


    The following steps walk you through configuring Docker Content Trust, signing
    and pushing an image, and then pulling the signed image.


    If you plan on following along, you''ll need a cryptographic key pair. If you
    don''t already have one, you can run the following **docker trust** command to
    generate one. The command generates a new key pair called **nickel** and loads
    it to the local trust store ready for use. It will prompt you to enter a passphrase;
    don''t forget it :-)'
  merge: -1
  img_proc: true
