- pgno: 102
  md: 'So far, you''ve seen how to pull and work with images using names (tags). While
    this is the most common method, it has a problem — tags are mutable. This means
    it''s possible to tag an image incorrectly or give a new image the same tag as
    an older one. An extremely common example is the **latest** tag. For example,
    pulling the **alpine:latest** tag a year ago will not pull the same image as pulling
    the same tag today.


    Consider a quick example outlining one potential implication of trusting mutable
    tags. Imagine you have an image called **goltrack:1.5** and you get a warning
    that it has a critical vulnerability. You build a new image containing the fix
    and push the new image to the same repository with the **same tag**.


    Take a moment to consider what just happened and the implications.


    You have an image called **goltrack:1.5** that''s being used by lots of containers
    in your production environment, and it has a critical bug. You create a new version
    containing the fix. So so good, but then you make the mistake. You push the new
    image to the same repository with the **same tag as the vulnerable image**. This
    overwrites the original image and leaves you without a great way of knowing which
    of your production containers are using the vulnerable image and'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'which are using the fixed image — both images have the same tag!


    This is where image digests come to the rescue.


    Docker uses a content addressable storage model where every image gets a cryptographic
    content hash that we usually call the digest. As these are hashes of an image''s
    contents, it’s impossible for two different images to have the same digest. It’s
    also impossible to change an image without creating a new unique digest. Fortunately,
    Docker lets you work with image digests instead of just names.


    If you’ve already pulled an image by name, you can see its digest by running a
    `docker images` --digests flag as shown.


    ```

    $ docker images --digests alpine

    REPOSITORY TAG DIGEST IMAGE ID

    alpine latest sha256:c5b1261d...8elad6b c5b1261d6d3e

    ```


    If you want to find an image''s digest before pulling it, you can use the `docker
    buildx imagetools` command. The following example retrieves the image digest for
    `nigelpoulton/k8sbook/latest` image on Docker Hub.'
  merge: -1
  img_proc: true
