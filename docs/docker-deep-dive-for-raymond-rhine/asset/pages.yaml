- pgno: 424
  md: '# Chapter Summary


    There are two main types of data: *persistent* and *non-persistent*.


    Persistent data is data you need to keep, and non-persistent data is data you
    don''t need to keep.


    By default, all containers get a layer of writable non-persistent storage that
    lives and dies with the container. We sometimes call this *local storage* for
    non-persistent data. However, if your apps create data you need to keep, you should
    store the data in a Docker volume.


    Docker volumes are first-class objects in the Docker API, and you manage them
    independently of containers using their own `docker volume` sub-command. This
    means deleting containers doesn''t delete the data in their volumes.


    A few third-party plugins exist that provide Docker with access to specialized
    external storage systems.


    Volumes are the recommended way to work with persistent data in Docker environments.'
  merge: -1
  img_proc: true
