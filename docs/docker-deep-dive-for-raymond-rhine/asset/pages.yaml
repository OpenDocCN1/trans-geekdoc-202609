- pgno: 66
  md: 'networking, and more.


    LXC did the hard work of interfacing with the Linux kernel and constructing the
    required namespaces and cgroups to build and start containers.


    # Replacing LXC


    Relying on LXC posed several problems for the Docker project.


    First, LXC is Linux-specific, and Docker had aspirations of being multi-platform.


    Second, Docker was evolving fast, and there was no way of ensuring LXC evolved
    in the ways Docker needed.


    To improve the experience and help the project evolve more quickly, Docker replaced
    LXC with its own tool, *libcontainer*. The goal of libcontainer was to be a platform-agnostic
    tool that gave Docker access to the fundamental container building blocks in the
    host kernel.


    Libcontainer replaced LXC in Docker in a very long time ago.


    # Breaking up the monolithic Docker daemon'
