- pgno: 67
  md: 'As previously mentioned, the Docker Engine was originally a monolith with almost
    all functionality coded into the daemon. However, as time passed, this became
    more and more problematic for the following reasons:


    +   1. It got slower

    2. It wasn’t what the ecosystem wanted

    3. It''s hard to innovate on monolithic software


    The project recognized these challenges and began a long-running program to break
    apart and refactor the Engine so that every feature became its own small specialized
    tool. Platform builders could then re-use these tools to build other platforms.


    This work of breaking apart the Docker daemon is an ongoing process, and all of
    the code for building images and executing containers has been removed and refactored
    into small, specialized tools. Notable examples include removing the high-level
    and low-level runtime functionality and re-implementing them in separate tools
    called containerd and runc, both of which are used by many different projects
    including Docker, Kubernetes, Firecracker, and Fargate.(starting with Docker Desktop
    4.27.0), Docker has removed image management from the daemon and now uses containerd’s
    image management capabilities.'
