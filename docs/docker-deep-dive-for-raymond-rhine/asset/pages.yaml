    # Docker Secrets'
  merge: -1
  img_proc: true
- pgno: 460
  md: 'Most applications leverage sensitive data such as passwords, certificates,
    and SSH keys. Fortunately, Docker lets you wrap them inside *secrets* to keep
    them secure.


    **Note:** *Secrets only work in swarm mode as they leverage the cluster store.*


    Behind the scenes, Docker encrypts secrets when they’re *at rest* in the cluster
    store and while they’re *in flight* on the network. It also uses *in-memory filesystems*
    to mount secrets into containers and operates a least-privilege model, where secrets
    are only available to services that have been explicitly granted access. There’s
    even a `docker secret` command.


    Figure 16.10 shows the high-level workflow of creating a secret and deploying
    it to service replicas:


    ![](img/aae0230bf8529bd80767c4c780dca8d3_460_0.png)'
  merge: -1
  img_proc: true
- pgno: 461
  md: '# Figure 16.10 - Secret workflow


    Let''s go through the five steps in the diagram. I''ve used a key symbol to show
    the secret, and it''s only available to the dark containers.


    +   1. You create the secret

    2. Docker stores it in the encrypted cluster store

    3. You create a service (the dark containers) and grant access to the secret

    4. Docker encrypts the secret when sending it over the network to service replicas

    5. Docker mounts the secret into service replicas as an unencrypted file in an
    in-memory filesystem


    The light-colored containers are part of a different service and cannot access
    the secret.


    As soon as replicas using the secret terminate, Docker destroys the in-memory
    filesystem and flushes the secret from the node.


    Docker mounts secrets in their unencrypted form so that applications can use them
    without needing keys to decrypt them.'
  merge: -1
  img_proc: true
- pgno: 462
  md: 'You can create and manage secrets with the **docker secret** command and attach
    them to services by passing the **--secret** flag to the **docker service create**
    command.


    # Clean up


    If you''ve followed along, you''ve created a swarm, added a signer, created a
    new repo on Docker Hub, and exported an environment variable to sign and verify
    images automatically.


    Run the following command to disable Docker Content Trust. You''ll need to run
    it on every node where you enabled Docker Content Trust.


    ```

    $ unset DOCKER_CONTENT_TRUST

    ```


    Remove the signer from the repository you created. Your signer and repository
    will have different names.


    ```

    $ docker trust signer remove nigelpoulton/ddd-trust

    Removing signer "nigel" from nigelpoulton/ddd-trust...

    all signed tags are currently revoked, use docker trust sign to f

    ```


    You may also want to delete the repositories you created on Docker Hub and delete
    the local key files on your system'
  merge: -1
  img_proc: true
- pgno: 463
  md: '(usually a .pub file in your home directory)


    Delete the swarm by running the following command on all swarm nodes. You should
    run it on the swarm managers last.


    ```

    $ docker swarm leave -f

    ```


    # Chapter Summary


    You can configure Docker to be extremely secure. It supports all of the major
    Linux security technologies such as kernel namespaces, cgroups, capabilities,
    MAC, and seccomp. It ships with sensible defaults for all of these, but you can
    customize and even disable them.


    In addition to the Linux security technologies, Docker includes an extensive set
    of its own security technologies. Swarms are built on TLS and are secure out of
    the box. Docker Scout performs binary-level image scans and provides detailed
    reports of new vulnerabilities and suggested fixes. Docker Content Trust lets
    you sign and verify images, and Docker secrets allow you to share sensitive data
    with swarm services.'
  merge: -1
  img_proc: true
