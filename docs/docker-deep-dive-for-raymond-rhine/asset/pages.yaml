- pgno: 294
  md: "If you look at the Compose file, you'll see it has three top-level keys.\n\n\
    +   - networks\n- volumes\n- services\n\n**Networks** is where you define the\
    \ networks app needs, **volumes** defines the volumes it needs, and **services**\
    \ defines the microservices that make up the app. The file is a simple example\
    \ of *infrastructure as code* — the application and infrastructure are defined\
    \ in a configuration file that you deploy and manage them from.\n\nIf you expand\
    \ each top-level key, you'll see how things map to Figure 11.2 with a network\
    \ called **counter-net**, a volume called **counter-vol**, and two services called\
    \ **web-fe** and **redis**.\n\n```\nnetworks:\n  counter-net:\nvolumes:\n  counter-vol:\n\
    services:\n  web-fe:\n  redis:\n```\n\nLet's look at each section of the stack\
    \ file."
  merge: -1
  img_proc: true
- pgno: 295
  md: "# Looking closer at the stack file\n\nStack files are identical to Compose\
    \ files with a few differences at run-time. For example, Docker Compose lets you\
    \ build images at run-time, but Docker Stacks don't.\n\nLet's look at the networking\
    \ elements defined in our stack file.\n\n# Networks and networking\n\nOne of the\
    \ first things Docker does when you deploy an app from a stack file is create\
    \ the networks listed under the **networks** key. If they already exist, Docker\
    \ doesn't need to do anything. But if they don't exist, it creates them.\n\nThis\
    \ app defines a single encrypted overlay network called **counter-net.**\n\n```\n\
    networks:\n  counter-net:      <---- Network name\n    driver: overlay   <----\
    \ Driver/type of network\n    driver_opts:\n      encrypted: 'yes' <---- Encrypt\
    \ the data plane\n```\n\nIt needs to be an overlay network so it can span all\
    \ nodes in the swarm."
  merge: -1
  img_proc: true
- pgno: 296
  md: "Encrypting the data plane will keep the application traffic private, but it\
    \ incurs a performance penalty that varies based on factors such as traffic type\
    \ and traffic flow. It's not uncommon for the performance penalty to be around\
    \ 10%, but you should perform your own testing against your own applications.\n\
    \nThe stack also publishes the web-fe service on port 5001 on the swarm-wide ingress\
    \ network and maps it back to port 8080 on all service replicas. This allows external\
    \ clients to reach the service by hitting any swarm node on port 5001.\n\n```\n\
    services:\nweb-fe:\n<Snip>\nports:\n  target: 8080      <-- Service replicas listen\
    \ on this\n  published: 5001   <-- and are published externally on\n```\n\nLet's\
    \ look at the volumes and mounts.\n\n# Volumes and mounts\n\nThe app defines a\
    \ single volume called counter-vol and mounts it into the /app directory on all\
    \ web-fe replicas. This means all reads and writes to the /app folder will be\
    \ read and written to the volume."
  merge: -1
  img_proc: true
- pgno: 297
  md: "```\nvolumes:\n  counter-vol: <<----- Volume name\n\nservices:\n  web-fe:\n\
    \    <Snip\n    volumes:\n      - type: volume\n        source: counter-vol <-----\
    \ Mount the \"counter-vol\" vol\n        target: /app <----- \"/app\" in all service\
    \ repli\n```\n\nLet’s look at the services.\n\n# Services\n\nServices are where\
    \ most of the action happens. Our application defines two, and we'll look at each\
    \ in turn.\n\n# The web-fe service\n\nAs you can see, the web-fe service defines\
    \ an image, an app, the desired number of replicas, rules for updating the app,\
    \ a restart policy, which network to connect to, which ports to publish, and how\
    \ to mount a volume. That’s a lot to take in, so I’ve annotated it in the book.\
    \ Take a minute to read through the file and annotations.\n\n```\nweb-fe:\n  image:\
    \ nigelppoulton/ddd-book:swarm-app <<----- Create all repl\n```"
  merge: -1
  img_proc: true
- pgno: 298
  md: "```\ncommand: python app.py      <-- Run this command\ndeploy:\n  replicas:\
    \ 4                             <-- Deploy 4 replicas\n  update_config:\\    \
    \                    <-- When you perform an\n    parallelism: 2             \
    \          <-- update 2 replicas at a\n    delay: 10s                        \
    \   <-- wait 10 seconds between\n    failure_action: rollback             <--\
    \ and perform a rollback\n  constraints:\n    'node.role == worker'          \
    \     <-- Only run replicas on worker\n  restart_policy:\n    condition: on-failure\
    \                <-- Only restart if\n    delay: 5s                          \
    \  <-- they've failed (non-zero)\n    max_attempts: 3                      <--\
    \ wait five seconds between\n    window: 120s                          <-- only\
    \ three restarts\n                                      -- and give up after\n\
    networks:\n  - counter-net                          <-- Connect replicas to the\n\
    ports:\n  - published: 5001                     <-- Publish the service endpoint\n\
    \    target: 8080                         <-- map traffic to each replica\nvolumes:\n\
    \  - type: volume                        <-- Mount the \"counter-vol\"\n    source:\
    \ counter-vol                 <-- \"/app\" in each service\n    target: /app\n\
    ```\n\nThe **image** key is the only mandatory key and tells Docker which image\
    \ to use when creating service replicas. Swarm stacks don't support building images\
    \ at deploy time, so the image must exist before you deploy the app. Docker is\
    \ also **opinionated** and assumes you want to pull images from Docker Hub. However,\
    \ you can add the registry’s DNS name before the image name if you want to use\
    \ a third-party registry. For"
  merge: -1
  img_proc: true
- pgno: 299
  md: "example, adding ghcr.io before an image name will pull it from GitHub Container\
    \ Registry.\n\nThe **command** key tells Docker how to start the app in each replica.\
    \ Our example tells it to execute **python app.py** in replicas.\n\nThe **deploy.replicas**\
    \ key tells Swarm to deploy and manage four service replicas (identical containers).\n\
    \n```\nweb-fe:\n  deploy:\n    replicas: 4\n```\n\nIf you need to change the number\
    \ of replicas after you've deployed the service, you should update the value of\
    \ **deploy.replicas** in the stack file and then redeploy the stack. We'll see\
    \ this later.\n\nThe **deploy.update_config** block tells Docker how to perform\
    \ rollouts.\n\n```\nweb-fe:\n  deploy:\n    update_config:\n      parallelism:\
    \ 2\n      delay: 10s\n      failure_action: rollback\n```"
  merge: -1
  img_proc: true
- pgno: 300
  md: "This application tells Docker to update two replicas at a time, wait 10 seconds\
    \ between each set of two, and perform a rollback if it encounters any problems.\n\
    \nRolling back replaces the new replicas with fresh copies of the old version.\
    \ The default value for failure_action is pause, which will halt the update where\
    \ it is and may result in some replicas running the old version and some running\
    \ the new. The other option is continue.\n\nThe deploy.placement block forces\
    \ all replicas onto worker nodes. You'll need to delete this section if you're\
    \ running a single-node cluster with one manager and zero workers.\n\n```\nweb-fe:\n\
    \  deploy:\n    placement:\n      constraints:\n        - 'node.role == worker'\n\
    ```\n\nThe deploy.restart_policy block tells Docker what to do when it encounters\
    \ a failure during a rollout.\n\n```\nweb-fe:\n  deploy:\n    restart_policy:\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 301
  md: "```\ncondition: on-failure\nmax_attempts: 3\ndelay: 5s\nwindow: 120s\n```\n\
    \nThis app tells Docker to restart replicas if they fail, to attempt a maximum\
    \ of 3 restarts, to wait 5 seconds between each restart attempt, and to wait up\
    \ to 120 seconds to decide if the restart worked.\n\nThe **networks** key tells\
    \ Docker to attach all replicas to the **counter-net** network.\n\n```\nweb-fe:\n\
    networks:\n  - counter-net\n```\n\nThe **ports** block publishes the app on port\
    \ 5001 on the ingress network and port 8080 on the counter-net network. This means\
    \ external traffic can hit any swarm node on 5001 and get redirected to the service\
    \ replicas on 8080.\n\n```\nweb-fe:\nports:\n  published: 5001\n  target: 8080\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 302
  md: "Finally, the **volumes** block mounts the **counter-vol** volume into each\
    \ service replica’s **/app** directory.\n\n```\nweb-fe:\nvolumes:\n  type: volume\n\
    \  source: counter-vol\n  target: /app\n```\n\n# The redis service\n\nThe **redis**\
    \ service is much simpler. It pulls the **redis:alpine** image, starts a single\
    \ replica, and attaches it to the **counter-net** network. This is the same network\
    \ as the **web-fe** service, meaning the two services will be able to communicate\
    \ with each other by name (“redis” and “web-fe”).\n\n```\nredis:\n  image: \"\
    redis:alpine\"\nnetworks:\n  counter-net:\n```\n\nAs previously mentioned, Compose\
    \ files are a great source of application documentation. We can read this file\
    \ and know the application has two services, two networks, and one volume. We\
    \ know how the services communicate, how they’re"
  merge: -1
  img_proc: true
- pgno: 303
  md: 'published outside of the swarm, and a bit about how they''ll be deployed, updated,
    and restarted from failures.


