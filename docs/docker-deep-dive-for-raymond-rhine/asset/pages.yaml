- pgno: 155
  md: 'This is where **Docker Debug** comes to the rescue allowing you to get shell
    access to images and containers that don''t include a shell and seamlessly injecting
    powerful debugging tools into them.


    At a high level, Docker Debug works by attaching a shell to a container and mounting
    a toolbox loaded with debugging tools. This *toolbox* is mounted as a directory
    called `/nix` and is available during your debugging session but is never visible
    to the container. As soon as you exit the Docker Debug session, the `/nix` directory
    is removed. If you''re debugging a running container, any changes you make are
    immediately visible to the container and persist across container restarts. For
    example, updating an `index.html` during a Docker Debug session will immediately
    update the running web app, and the changes will persist if the container is stopped
    and restarted. If you''re debugging an image or stopped container, the Docker
    Debug session creates a debug sandbox and adds it to the image as a R/W layer
    to make it feel like a running container. However, changes you make while debugging
    an image or stopped container are **not** persisted and are lost as soon as you
    quit the debug session.


    If you''ve been following along, you''ll have a running container called **ddd-ctr**.
    If you don''t, you can start one by running'
