    # Docker Swarm – The Commands


    +   - docker swarm init creates a new swarm. The node you run the command on becomes
    the first manager and the Docker Engine on that node switches into swarm mode.


    +   - docker swarm join-token reveals the commands and tokens you need to join
    workers and managers to the swarm. You add manager to the command to get the manager
    join token and worker to get the worker token. Be sure to keep your join tokens
    secure!


    +   - docker node ls lists managers and workers, including which manager is the
    leader.


    +   - docker service create creates a new service.


    +   - docker service ls lists running services and gives basic information on
    their state and the number of replicas they’re running.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '+   docker service ps <service> gives more detailed information about individual
    service replicas.


    +   docker service inspect gives very detailed information on a service. You can
    add the --pretty flag to get a nicely formatted summary view.


    +   docker service scale lets you scale the number of service replicas.


    +   docker service update lets you update the properties of a running service.


    +   docker service logs shows service logs.


    +   docker service rm deletes a service without asking for confirmation.


    # Chapter summary


    Swarm is Docker’s native technology for managing clusters of Docker nodes and
    orchestrating microservices applications. It is similar to Kubernetes but less
    advanced and easier to use.


    The enterprise-grade clustering component offers a wealth of security and HA features
    that are automatically configured and extremely simple to modify.


    The orchestration component deploys and manages cloud-native microservices applications.'
  merge: -1
  img_proc: true
