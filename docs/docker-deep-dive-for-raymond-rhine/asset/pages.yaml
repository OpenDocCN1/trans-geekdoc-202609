    # Docker Compose – The TLDR


    We create modern cloud-native applications by combining lots of small services
    that work together to form a useful app. We call them microservices applications,
    and they bring a lot of benefits, such as self-healing, autoscaling, and rolling
    updates. However, they can be complex.'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'For example, you might have a microservices app with the following services:


    +   * Web front-end

    * Ordering

    * Catalog

    * Back-end datastore

    * Logging

    * Authentication

    * Authorization


    Instead of hacking together complex scripts and long `docker` commands, Compose
    lets you describe the application in a simple YAML file called a `Compose file`.
    You then use the Compose file with the `docker compose` command to deploy and
    manage the app.


    You should keep your Compose files in a version control system such as Git.


    That''s the basics. Let''s dig deeper.


    # Compose background


    When Docker was new, a company called `Orchard Labs` built a tool called `Fig`
    that made deploying and managing multi-'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'container apps easy. It was a Python tool that ran on top of Docker and let
    you define complex multi-container microservices apps in a simple YAML file. You
    could even use the **fig** command-line tool to manage the entire application
    lifecycle.


    Behind the scenes, Fig would read the YAML file and call the appropriate Docker
    commands to deploy and manage the app.


    Fig was so good that Docker, Inc. acquired Orchard Labs and rebranded Fig as *Docker
    Compose*. They renamed the command-line tool from **fig** to **docker-compose**,
    and then more recently, they folded it into the **docker** CLI with its own **compose**
    sub-command. You can now run simple **docker compose** commands to easily manage
    multi-container microservices apps.


    There is also a [Compose Specification]() driving Compose as an open standard
    for defining multi-container microservices apps. The specification is community-led
    and kept separate from the Docker implementation to maintain better governance
    and clearer demarcation. However, *Docker Compose* is the *reference implementation*,
    and you should expect Docker to implement the full spec.'
  merge: -1
  img_proc: true
- pgno: 221
