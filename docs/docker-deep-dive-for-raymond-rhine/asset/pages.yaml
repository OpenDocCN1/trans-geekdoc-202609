    # Chapter summary


    The Docker Engine is a platform that makes it easy to build, ship, and run containers.
    It implements the OCI standards and is a modular app comprising many small, specialized
    components.


    The Docker daemon implements the Docker API, but most other functionality has
    been stripped out and implemented as standalone composable tools as containerd
    and runc.


