    | 1933628380bb | alpine | "sh" | 15 seconds ago | Up 2 seconds |


    The container is running as expected. However, you can see it was created 15 seconds
    ago but has only been running for 2 seconds. This is because you forced it to
    exit when you killed the shell process, and then Docker automatically restarted
    it. It’s also important to know that Docker restarted the same container and didn’t
    create a new one. In fact, if you run a `docker inspect` against it, you’ll see
    the `RestartCount` has been incremented to 1. Remember to replace `grep` with
    to replace `grep` with `Select-String -Pattern ''RestartCount''` if you''re on
    Windows using PowerShell.


    An interesting feature of the `--restart always` policy is that if you stop a
    container with `docker stop` and then restart the Docker daemon, Docker will restart
    the container when the daemon comes up. To be clear:'
  merge: -1
