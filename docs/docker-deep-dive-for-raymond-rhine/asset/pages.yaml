  md: 'As with all consensus algorithms, more participants means

    longer times to achieve consensus. It''s like choosing where to

    eat — it''s always quicker and easier for three people to decide

    than it is for 33! With this in mind, it''s usually a best practice to

    have three or five managers for HA. Seven might work, but

    tthreeree or five usually right for most swarms.


    A final word of caution regarding manager HA. While you

    should definitely spread your managers across availability

    zones, they they need to be connected by fast and reliable networks.

    This means you should think carefully and do lots of testing

    before implementing multi-cloud clusters implementing multi-

    cloud HA.


    # Built-in Swarm security


    Swarm ships with a lot of security features, such as a built-in

    cificate authority (CA), mutual TLS, an encrypted cluster

    store, encrypted networks, cryptographic node IDs and join

    tokens, and more. Fortunately, Swarm automatically configures

    them with sensible defaults.


    # Locking a Swarm


    Despite all of Swarm''s security features, restarting an old

    manager or restoring an old backup can potentially'
  merge: -1
  img_proc: true
- pgno: 263
  md: 'compromise your cluster. For example, a malicious actor with access to an old
    manager node may be able to re-join it to the swarm and gain unwanted access.


    Fortunately, you can use Swarm''s *autolock* feature to force restarted managers
    to present a key before being admitted back into the swarm.


    You can autolock new swarms at build time by passing the --autolock flag to the
    `docker swarm init` command. For existing swarms, you can autolock them with the
    `docker swarm update` command.


    Run the following command from one of your swarm managers to lock your existing
    swarm cluster.


    ```

    $ docker swarm update --autolock=true

    Swarm updated.

    To unlock a swarm manager after restarts, run the `docker swarm unlock-key` provide
    the following key:


    WMKEY-1-XDeU3XC75Ku7rvGvIxJ0vV7ehdVJGgVIAvq0D8VuEAEaw

    ```


    Please remember to store this key in a password manager...


    While it''s possible to run a `docker swarm unlock-key` command on any manager
    to view your unlock key, you should'
