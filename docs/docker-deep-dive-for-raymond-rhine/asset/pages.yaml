    # Deleting Images


    You can delete images using the docker rmi command. rmi is short for remove image.


    Deleting images removes them from your local repository and they''ll no longer
    show up in your docker images commands. The operation also deletes all directories
    on your local filesystem containing layer data. However, Docker won''t delete
    layers shared by multiple images until you delete all images that reference them.


    You can delete images by name, short ID, or SHA. You can also delete multiple
    images with the same command.


    The following command deletes three images — one by name, one by short ID, and
    one by SHA. I''ve trimmed the output for easier reading.


    ```

    $ docker rmi redis:latest af111729d35a sha256:c5b1261d...f8elad6b

    Untagged: redis:latest

    Deleted: sha256:76d5908f5e19fdd73daf956a38826f790336ee4707d9028f

    ```'
