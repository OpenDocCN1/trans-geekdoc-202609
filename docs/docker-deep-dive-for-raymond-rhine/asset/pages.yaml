- pgno: 331
  md: '![](img/aae0230bf8529bd80767c4c780dca8d3_331_0.png)


    # # Run a Wasm container


    Now that you’ve packaged the Wasm app as an OCI image and pushed it to a registry,
    you can run it as a container.


    The following command runs it in a new container called wasm-ctr and maps it to
    port 5556 on your Docker host. The -runtime flag makes sure Docker executes the
    container with the spin Wasm runtime. Versions of Docker Desktop older than 4.24
