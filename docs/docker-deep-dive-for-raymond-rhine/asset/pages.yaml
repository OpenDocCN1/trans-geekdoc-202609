- pgno: 124
  md: '# Containers – The TLDR


    Containers are run-time instances of images, and you can start one or more containers
    from a single image.


    Figure 7.1 shows multiple containers started from a single image. The shared image
    is read-only, but you can write to the containers.


    ![](img/aae0230bf8529bd80767c4c780dca8d3_124_0.png)


    Figure 7.1


    You can start, stop, restart, and delete containers just like you with VMs. However,
    containers are smaller, faster, and more portable than VMs. They''re also designed
    to be stateless and ephemeral, whereas VMs are designed to be long-running and
    can be migrated with their state and data.'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'Containers are also designed to be immutable. This means you shouldn’t change
    them after you’ve deployed them — if a container fails, you replace it with a
    new one instead of connecting to it and making the fix in the live instance.


    Containers should only run a single process and we use them to build microservices
    apps. For example, an application with four features (microservices), such as
    a web server, auth, catalog, and store, will have four containers — one running
    the web server, one running the auth service, one running the catalog, and another
    running the store.


    # Containers vs VMs


    Containers and VMs are both virtualization technologies for running applications.
    They both work on your laptop, bare metal servers, in the cloud, and more. However,
    the ways they virtualize are very different:


    +   - VMs virtualize hardware

    - Containers virtualize operating systems


    In the VM model, you power on a server and a hypervisor boots. When the hypervisor
    boots, it claims all hardware resources such as CPU, RAM, storage, and network
    adapters. To deploy an app, you ask the hypervisor to create a virtual'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'machine. It does this by carving up the hardware resources into virtual versions,
    such as virtual CPUs and Virtual RAM, and packaging them into a VM that looks
    exactly like a physical server. Once you have the VM, you install an OS and then
    an app.


    In the container model, you power on the same server and an OS boots and claims
    all hardware resources. You then install a container engine such as Docker. To
    deploy an app, you ask Docker to create a container. It does this by carving up
    OS resources such as process trees and filesystems into virtual versions and then
    packaging them as a container that looks exactly like a regular OS. You then tell
    Docker to run the app in the container.


    Figure 7.2 shows the two models side by side and attempts to demonstrate the more
    efficient nature of containers with the same server running 3x more containers
    than VMs.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '![](img/aae0230bf8529bd80767c4c780dca8d3_127_0.png)


    Figure 7.2


    In summary, hypervisors perform hardware virtualization where they divide hardware
    resources into virtual versions and package them as VMs. Container engines perform
    OS virtualization where they divide OS resources into virtual versions and package
    them as containers. VMs look and feel exactly like physical servers. Containers
    look and feel exactly like regular operating systems.


    The VM tax


    One of the biggest problems with the virtual machine model is that you need to
    install an OS on every VM — every OS'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'consumes CPU, RAM, and storage and takes a relatively long time to boot.


    Containers get around all of this by sharing a single OS on the host they''re
    running on. This gives containers all of the following benefits over VMs:


    +   - Containers are smaller and more portable

    - You can run more containers on your infrastructure

    - Containers start faster

    - Containers reduce the number of operating systems you need to manage (patch,
    update, etc.)

    - Containers present a smaller attack surface


    Let''s briefly expand on each point.


    Containers are smaller than VMs because they only contain application code and
    a minimal set of OS-related constructs, such as essential filesystem objects.
    Because of this, they''re typically only a few megabytes in size. On the other
    hand, every VM needs a full OS, meaning they''re usually hundreds or thousands
    of megabytes.


    Because containers don''t contain an OS, you can run a lot more containers than
    VMs. For example, deploying 100 applications as VMs will require 100 operating
    systems, each consuming'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'CPU, memory, and storage, and each needing to be patched and managed. However,
    deploying the same 100 applications as containers requires no additional operating
    systems. This drastically reduces your OS management overhead and allows you to
    allocate more system resources to applications instead of operating systems.


    Containers also start faster than VMs because they use the host''s OS which is
    already booted. On the other hand, VMs need to go through a full OS bootstrapping
    process before starting the app.


    One of the early concerns about containers centered around the shared kernel model
    where all containers on the same host share the host''s kernel. While this offers
    performance and portability benefits, it''s less secure than the VM model where
    every VM has its own dedicated kernel. For example, a rogue container that exploits
    a vulnerability in the host''s kernel might be able to impact every other container
    on the same host. Fortunately, this is much less of a concern now that container
    platforms have matured and ship with class-leading tools that can make them more
    secure than non-container platforms. For example, most container engines and platforms
    implement sensible defaults for security-related technologies such as SELinux,
    AppArmor, seccomp, capabilities, and more. You can'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'even configure these to make containers more secure than VMs. Other technologies,
    such as image vulnerability scanning, give you more control over the security
    of your software than you ever had before.


    At the time of writing, in 2024, containers are the go-to solution for the vast
    majority of new applications.


    # Prereqs


    You''ll need a working Docker environment to follow along with the examples, and
    I recommend Docker Desktop. Other Docker setups should work, but you may have
    to manually install the Docker Debug plugin if you want to follow along with those
    examples.


    # Images and Containers


    As previously mentioned, you can start multiple containers from a single image.
    The image is read-only in this relationship, but each container is read-write.
    As shown in Figure 7.3, Docker accomplishes this by creating a thin read-write
    layer for each container and placing it on top of the shared image.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '![](img/aae0230bf8529bd80767c4c780dca8d3_131_0.png)


    In this example, each container has its own thin R/W layer shares the same image.
    The containers can see and access the files and apps in the image *through* their
    own R/W layer, and if they make any changes, these get written to their R/W layer.
    When you stop a container, Docker keeps the R/W layer and restores it when you
    restart the container. However, when you delete a container, Docker deletes its
    R/W layer. This way, each container can make and keep its own changes without
    changing the shared image.


