    # Swarm manager high availability


    Swarm clusters are highly available (HA), meaning one or more managers can fail,
    and the swarm will keep running.


    Technically speaking, Swarm implements active/passive multi-manager HA. This means
    a swarm with three managers will have one active manager, and the other two will
    be passive. In a swarm, we call the active manager the leader and the passive
    managers followers, and the leader is the only manager that can update the swarm
    configuration. If the leader fails, one of the followers will be elected as the
    new leader and the swarm will keep running without any service interruption. If
    you send commands to a follower, it proxies them to the leader.


    Figure 10.3 shows you issuing a command to a follower manager requesting an update
    to the swarm. Step 1 shows you issuing the command. Step 2 shows the follower
    manager'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'receiving and proxying the command to the leader. Step 3 shows the leader executing
    it.


    ![](img/aae0230bf8529bd80767c4c780dca8d3_260_0.png)


    Figure 10.3


    Leader and follower is Raft terminology, and we use it because Swarm implements
    the Raft consensus algorithm to maintain a consistent cluster state across multiple
    highly-available managers.


    The following good practices apply when it comes to manager HA:


    +   1. Always deploy an odd number of managers

    2. Don''t deploy too many managers (3 or 5 is usually enough)

    3. Spread managers across availability zones'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'Consider the two examples shown in Figure 10.4. The swarm on the left has an
    even number of managers, and a network incident has created a network partition
    with two managers on either side. We call this a split brain because neither side
    can be sure it has a majority, and the cluster goes into read-only mode. When
    this happens, your apps continue working but you can''t make changes to them or
    the cluster. However, the swarm on the right has an odd number of managers and
    remains fully operational in read-write mode because the two managers on the right
    side of the network partition know they have a majority (quorum). So, even though
    the swarm on the right has fewer managers than the one on the left, it has better
    availability.


    ![](img/aae0230bf8529bd80767c4c780dca8d3_261_0.png)


    Figure 10.4 - Swarm high availability'
