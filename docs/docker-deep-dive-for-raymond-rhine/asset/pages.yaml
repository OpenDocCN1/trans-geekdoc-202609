    # Looking a bit closer


    Now that you’ve containerized the application let''s take a closer look at how
    some of the machinery works.


    The **docker build** command parses the Dockerfile one line at a time, starting
    from the top.


    You can insert comments by starting a line with the `#` character, and the builder
    will ignore them.


    All non-comment lines are called *instructions* or *steps* and take the format
    `<INSTRUCTION> <arguments>`. Instruction names are not case-sensitive, but it’s
    common to write them in UPPERCASE to make them easier to read.'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'Some instructions create new layers, whereas others add metadata.


    Examples of instructions that create new layers are **FROM**, **RUN**, **COPY**
    and **WORKDIR**. Examples that create metadata include **EXPOSE**, **ENV**, **CMD**,
    and **ENTRYPOINT**. The premise is this:


    +   - Instructions that add *content*, such as files and programs, create new
    layers


    +   - Instructions that don''t add content don''t add layers and only create metadata


