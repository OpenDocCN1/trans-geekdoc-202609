    # Volumes and persistent data – The Commands


    +   * **docker volume create** creates new volumes. By default, it creates them
    with the **local** driver, but you can use the **-d** flag to specify a different
    driver.

    * **docker volume ls** lists all volumes on your Docker host.

    * **docker volume inspect** shows you detailed volume information. You can use
    this command to see where a volume exists in the Docker host’s filesystem.

    * **docker volume prune** deletes **all** volumes not in use by a container or
    service replica. **Use with caution!**

    * **docker volume rm** deletes specific volumes that are not in use.'
