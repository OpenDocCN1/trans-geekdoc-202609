- pgno: 210
  md: 'BuildKit uses a cache to speed up builds. The best way to see the impact is
    to build a new image on a clean Docker host and then repeat the same build immediately
    after. The first build will pull images and take time to build layers. The second
    build will instantly complete because the layers and other artifacts of the first
    build are cached and leveraged by later builds.


    If you use a local builder, the cache is only available to other builds on the
    same system. However, your entire team can share the cache on Docker Cloud.


    For each build, the builder iterates through the Dockerfile one line at a time,
    starting from the top. For each line, it checks if it already has the layer in
    its cache. If it does, a cache hit occurs, and if it doesn''t, a cache miss occurs,
    and it builds a new layer from the instruction. Cache hits are one of the best
    ways to make builders faster.


    Let''s take a closer look.


    Assume the following Dockerfile:


    ```

    FROM alpine

    RUN apk add --update nodejs npm

    COPY . /src

    WORKDIR /src

    RUN npm install

    ```'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'The first instruction tells Docker to use the `alpine:latest` image as its
    *base image*. If you already have a copy of this image, the builder moves on to
    the next instruction. If you don''t have a copy, it pulls it from Docker Hub.


    The next instruction (`RUN apk...`) runs a command to update package lists and
    install `nodejs` and `npm`. Before executing the instruction, Docker checks the
    build cache for a layer built using the same instruction. In this case, it''s
    looking for a layer built by executing the `RUN apk add --update nodejs npm` instruction
    directly on top of the `alpine:latest` image.


    If it finds a matching layer, it links to that layer and continues the build with
    the cache intact. If it does **not** find a matching layer, it invalidates the
    cache and builds the layer. Invalidating the cache means the builder has to execute
    all remaining Dockerfile instructions in full and cannot use the cache.


    Let''s assume Docker had a cached layer for the `RUN` instruction and that the
    layer''s ID is `AAA`.'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'The next instruction runs a COPY ./src command to copy the app code into the
    image. The previous instruction scored a cache hit, meaning Docker can check if
    it has a cached layer built by running a COPY ./src against the AAA layer. If
    it has a cached layer for this, it links to the layer and proceeds to the next
    instruction. If it doesn’t have a cached layer, it builds and invalidates the
    cache for the rest of the build.


    This process continues for the rest of the Dockerfile.


    It’s important to understand a few things.


    Any time an instruction results in a cache miss, the cache is invalidated and
    no longer checked for the rest of the build. This means you should write your
    Dockerfiles so that instructions most likely to invalidate the cache near the
    end of the Dockerfile. This allows builds to benefit from the cache for as long
    as possible.


    You can force a build to ignore the cache by running docker build --no-cache option.


    It’s also important to understand that COPY and ADD instructions include logic
    to ensure the content you’re copying into the image hasn’t changed since the last
    build. For example, you might have a cached layer that Docker built by running
    a'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'COPY . /src against the AAA image. However, if the files that the COPY . /src
    instruction copies into the layer have changed since the cached layer was built,
    you cannot use the cached layer as you''d get old versions of the files. To protect
    against this, Docker performs checksums against each file it copies. If the checksums
    don''t match, the cache is invalidated, and Docker builds a new layer.


