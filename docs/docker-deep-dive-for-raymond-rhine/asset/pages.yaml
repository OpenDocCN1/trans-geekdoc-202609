- pgno: 12
  md: '# 0: About the book


    This is a book about Docker and containers; no prior knowledge required! In fact,
    the book''s motto is Zero to Docker in a single book.


    So, if you want to work with cloud and cloud-native technologies, this book is
    dedicated to you.


    Why should I read this book or care about Docker?


    Docker is here, and it''s changed the world. If you want the best jobs working
    with the best technologies, you need to know Docker and containers. They''re even
    central to Kubernetes, and a strong Docker skill set will help you learn Kubernetes.
    Docker and containers are also well-positioned for emerging cloud technologies
    such as WebAssembly and AI workloads.


    What if I''m not a developer


    Most applications, even modern cloud-native microservices, need high-performance
    production-grade infrastructure. If you think traditional developers will take
    care of this, think again. To cut a long story short, if you want to thrive in
    the modern cloud-first world, you must know Docker. But don''t stress, this book
    will give you all the skills you need.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# How I''ve organized the book


    I''ve divided the book into two main sections:


    +   1. The big picture stuff

    2. The technical stuff


    **The big picture stuff** gets you up to speed with things like what Docker is,
    why we have containers, and the fundamental jargon such as **cloud-native, microservices,
    and orchestration.**


    **The technical stuff** section covers everything you need to know about **images,
    containers, multi-container microservices apps**, and the increasingly important
    topic of **orchestration**. It even covers WebAssembly, vulnerability scanning
    with Docker Scout, debugging containers, high availability, and more.'
  merge: -1
  img_proc: true
