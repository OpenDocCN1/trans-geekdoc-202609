- pgno: 53
  md: 'image. Finally, it told Docker to start a Bash shell as the container’s main
    app.


    Run a `ps` command from inside the container to list all running processes.


    ```

    root@bbd2e5ad1817:$# ps -elf

    F S UID PID NI ADDR SZ WCHAN STIME TTY TIME CMD

    4 S root 1 0 0 - 4560 13:38 pts/0 00:00:00

    O R root 9 1 0 - 8606 13:38 pts/0 00:00:00

    ```


    There are only two processes:


    +   - PID 1 is the Bash process that we told the container to run

    - PID 9 is the `ps -elf` command we ran to list the running processes


    The presence of the `ps -elf` process in the output can be a bit misleading as
    it is a short-lived process that exits as soon as the `ps` command completes.
    This means the only long-running process inside the container is the `/bin/bash`
    process.


    Press `Ctrl-PQ` to exit the container without terminating it. This will land your
    shell back at your local terminal, and your shell prompt will revert.'
  merge: -1
