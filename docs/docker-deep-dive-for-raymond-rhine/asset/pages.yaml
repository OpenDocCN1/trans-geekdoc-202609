- pgno: 82
  md: 'The docker run command is the most common way to start a container from an
    image. Once the container is running, the image and the container are bound, and
    you cannot delete the image until you stop and delete the container. If multiple
    containers use the same image, you can only delete the image after you''ve deleted
    all the containers using it.


    Containers are designed to run a single application or microservice. As such,
    they should only contain application code and dependencies. You should not include
    non-essentials such as build tools or troubleshooting tools.


    For example, the official Alpine Linux image is currently about 3MB. This is because
    it doesn''t ship with six shells, three different package managers, and a bunch
    of tools you “might” need once every ten years. In fact, it’s increasingly common
    for images to ship without a shell or a package manager — if the application doesn''t
    need it at run-time, the image doesn''t include it. We call these slim images.


    Another thing that keeps images small is the lack of an OS kernel. This is because
    containers use the kernel of the host they''re running on. The only OS-related
    components in most images are filesystem objects, and you''ll sometimes hear people
    say images contain just enough OS.'
