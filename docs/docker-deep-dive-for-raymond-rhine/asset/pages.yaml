    # Deploy and manage an app on swarm


    Swarm nodes can run regular containers, but they can also run enhanced containers
    called *services*. Each *service* takes a single container definition and augments
    it with cloud-native features such as self-healing, scaling, and automated rollouts
    and rollbacks.


    In this section, you''ll deploy a simple web server as a *swarm service* and see
    how to scale it, perform rollouts, and delete it.


    Swarm lets you create and manage services in two ways:


    +   1. *Imperatively* on the command line

    2. *Declaratively* with a Compose file


    We''ll look at Compose files in the next chapter. For now, we''ll focus on the
    imperative method.


    Run the following command to deploy a new service called **web-fe** with five
    identical replicas.


    ```

    $ docker service create --name web-fe \\

    -p 8080:8080 \\

    -- replicas 5 \\

    nigelpoulton/ddd-book:web.0

    ```'
  merge: -1
  img_proc: true
- pgno: 267
  md: '```

    z7oveargqmruwk0u2vc5o7ql0p

    overall progress: 5 out of 5 tasks

    1/5: running [====================]

    2/5: running [====================]

    3/5: running [====================]

    4/5: running [====================]

    5/5: running [====================]

    verify: Service converged

    ```


    The docker service create command tells Docker to deploy a new service. The --name
    flag calls this web-fe, the -p flag maps port 8080 on every swarm node to 8080
    inside of each replica (container), and the --replicas flag tells Swarm to deploy
    five replicas of the service. The last line tells Swarm which image to build the
    replicas from.


    Terminology: We use the terms replicas and containers interchangeably when referring
    to services. For example, a service defining five replicas will deploy five identical
    containers.


    Your Docker client sent the command to a swarm manager, and the leader manager
    initiated the work to deploy the five replicas across the swarm. You configured
    this swarm so that user applications won''t run on managers, meaning all five
    replicas will be running on your worker nodes. Each worker node that'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'received a work task pulled the image, started the required containers, and
    created the port mappings.


    However, it doesn''t end there. The command you issued requested a new service
    with five replicas, and Swarm stored this in the cluster store as your *desired
    state*. In the background, Swarm runs a *reconciliation loop* that constantly
    compares the *observed state* of the cluster with the *desired state*. When the
    two states match, the world is a happy place, and no further action is needed.
    When they don''t match, Swarm takes action to bring the *observed state* into
    line with *desired state*.


    For example, if a *worker* hosting one of the five replicas fails, the *observed
    state* of the cluster will drop from 5 replicas to 4 and no longer match the *desired
    state* of 5. As soon as the swarm observes the difference, it will start a new
    replica to bring the *observed state* back in line with *desired state*. We call
    this *reconciliation* or *self-healing*, and it''s a key tenet of cloudnative
    applications.


    You''ll soon learn that desired state and reconciliation are also at the heart
    of scaling, rollouts, and rollbacks.


