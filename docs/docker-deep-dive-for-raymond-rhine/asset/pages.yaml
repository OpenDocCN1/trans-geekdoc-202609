    At the time of writing, building this simple application with two dependencies
    actually downloads 97 packages!


    Fortunately, some package managers provide a way for you to only download and
    install essential packages instead of the entire internet. One example is the
    apt package manager that lets you specify the no-install-recommends flag so that
    it'
  merge: -1
