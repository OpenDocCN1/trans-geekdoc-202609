    # Replicated vs global services


    Swarm has two modes for deploying replicas to nodes:


    +   - Replicated (default)

    - Global


    The default `replicated` mode allows you to deploy as many replicas as you need
    and attempts to distribute them evenly across available nodes.


    The `global` mode deploys a single replica on every available node in the swarm.'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'Both modes respect node availability and will only deploy replicas to eligible
    nodes. For example, if you don''t allow your swarm to deploy applications to managers,
    both modes will only deploy to workers.


    If you want to deploy a global service, you need to pass the -- mode global flag
    to the docker service create command. Obviously, it doesn''t support the --replicas
    flag, as it always deploys a single replica on each available node.


