  md: 'It''ll take a few seconds to build and pull the images and then start the app.
    Once it''s running, you''ll have to hit Return to reclaim your shell prompt.


    We''ll review what happened in a second, but let''s talk about the **docker compose**
    command first.


    Running a docker compose up command is the most common way to deploy a Compose
    app. It reads through the Compose file in the local directory and runs the Docker
    commands required to deploy the app. This includes building and pulling all the
    necessary images, creating all required networks and volumes, and starting all
    containers.


    The command you executed didn''t specify the name or location of the Compose file,
    so Docker assumed it was called compose.yaml in the local directory. However,
    you can use the -f flag to point to a Compose file with a different name in a
    different directory. For example, the following command will deploy the application
    defined in a Compose file called sample-app.yml in the apps/ddd-book directory.


    ```

    $ docker compose -f apps/ddd-book/sample-app.yml up &

    ```'
