- pgno: 426
  md: 'The chapter focuses heavily on Linux, but the sections relating to Docker security
    technologies apply to Linux and Windows containers.


    # Docker security – The TLDR


    Good security is about layers and defence in depth, and more layers is always
    better. Fortunately, Docker offers a lot of security layers, including the ones
    shown in Figure 16.1.


    ![](img/aae0230bf8529bd80767c4c780dca8d3_426_0.png)


    Figure 16.1


    As you can see, Docker leverages the common Linux security and workload isolation
    technologies, including namespaces, control groups, capabilities, mandatory access
    control (MAC), and seccomp. It ships with sensible defaults for each one, but
    you can customize them to your specific requirements.'
  merge: -1
  img_proc: true
- pgno: 427
  md: 'Docker also has its own security technologies, including Docker Scout and Docker
    Content Trust.


    Docker Scout offers class-leading vulnerability scanning that scans your images,
    provides detailed reports on known vulnerabilities, and recommends solutions.
    Docker Content Trust (DCT) lets you cryptographically sign and verify images.


    If you use Docker Swarm, you''ll also get all of the following that Docker automatically
    configures: cryptographic node IDs, mutual authentication (TLS), automatic CA
    configuration and certificate rotation, secure cluster join tokens, an encrypted
    cluster store, encrypted networks, and more.


    Other security-related technologies also exist, but the important thing to know
    is that Docker works with the major Linux security technologies and adds a few
    of its own. Sometimes, the Linux security technologies can be complex and challenging
    to work with, but the native Docker ones are always easy.


    # Kernel Namespaces


    Kernel namespaces, usually shortened to namespaces, are the main technology for
    building containers.'
  merge: -1
  img_proc: true
- pgno: 428
  md: 'Let’s quickly compare namespaces and containers with hypervisors and virtual
    machines (VM).


    Namespaces virtualize operating system constructs such as process trees and filesystems,
    whereas hypervisors virtualize physical resources such as CPUs and disks. In the
    VM model, hypervisors create virtual machines by grouping virtual CPUs, virtual
    disks, and virtual network cards so that every VM looks, smells, and feels like
    a physical machine. In the container model, namespaces (containers) by grouping
    virtual process trees, virtual filesystems, and virtual network interfaces so
    that every container looks, smells, and feels exactly like a regular OS.


    At a very high level, namespaces provide lightweight isolation but do not provide
    a strong security boundary. Compared with VMs, containers are more efficient,
    but virtual machines are more secure.


    Don’t worry, though. Platforms like Docker implement additional security technologies,
    such as cgroups, capabilities, and seccomp, to improve container security.


    Namespaces are a tried and tested technology that’s existed in the Linux kernel
    for a very long time. However, they were'
  merge: -1
  img_proc: true
- pgno: 429
  md: 'complex and hard to work with until Docker came along and hid all the complexity
    behind the simple **docker run** command and a developer-friendly API.


    At the time of writing, every Docker container gets its own instance of the following
    namespaces:


    +   - Process ID (pid)

    - Network (net)

    - Filesystem/mount (mnt)

    - Inter-process Communication (ipc)

    - User (user)

    - UTS (uts)


    Figure 16.2 shows a single Docker host running two containers. The host OS has
    its own collection of namespaces we call the *root namespaces*, and each container
    has its own collection of equivalent isolated namespaces. Applications in containers
    think they’re running on their own host and are unaware of the *root namespaces*
    or namespaces in other containers.'
  merge: -1
  img_proc: true
- pgno: 430
  md: '![](img/aae0230bf8529bd80767c4c780dca8d3_430_0.png)


    Let''s briefly look at how Docker uses each namespace:


    +   **Process ID namespace:** Docker uses the pid namespace to give each container
    its own isolated process tree. This means every container gets its own PID 1 and
    cannot see or access processes running in other containers. Nor can any container
    see or access processes running on the host.


    +   **Network namespace:** Docker uses the net namespace to provide each container
    with an isolated network stack. This stack includes interfaces, IP addresses,
    port ranges, and routing tables. For example, every container gets its own eth0
    interface with its own unique IP and range of ports.


    +   **Mount namespace:** Every container has its own mnt namespace with its unique
    isolated root ( / ) filesystem. This means every container can have its own /etc,
    /var,'
  merge: -1
  img_proc: true
- pgno: 431
  md: '/dev, and other important filesystem constructs. Processes inside a container
    cannot access the host''s filesystem or filesystems in other containers.


    +   **Inter-process Communication namespace**: Docker uses the ipc namespace for
    shared memory access within a container. It also isolates the container from shared
    memory on the host and other containers.


    +   **User namespace**: Docker gives each container its own users that are only
    valid inside the container. It also lets you map those users to different users
    on the Docker host. For example, you can map a container''s root user to a non-root
    user on the host.


    +   **UTS namespace**: Docker uses the uts namespace to provide each container
    with its own hostname.


    Remember, a container is a collection of namespaces that Docker organizes to look
    like a regular OS. These namespaces provide isolation, but they are not a enough
    security boundary on their own. This is why Docker augments container security
    with the technologies we''re about to discuss.


    # Control Groups


    If namespaces are about isolation, control groups (cgroups) are about limits.'
  merge: -1
  img_proc: true
- pgno: 432
  md: 'Think of containers as similar to rooms in a hotel. While each room might appear
    to be isolated, they actually share a lot of things such as water supply, electricity
    supply, air conditioning, swimming pool, elevators, gym, breakfast bar, and more.
    Containers are similar — even though they’re isolated, they share a lot of common
    resources such as the host’s CPU, RAM, network I/O, and disk I/O.


    Docker uses cgroups to limit a container’s use of these shared resources and prevent
    any container from consuming them all and causing a denial of service (DoS) attack.


    # Capabilities


    The Linux root user is extremely powerful, and you shouldn’t use it to run apps
    and containers.


    However, it’s not as simple as running them as non-root users, as most non-root
    users are so powerless that they are practically useless. What’s needed is a way
    to run apps and containers with the exact set of permissions they need — nothing
    more, nothing less.


    This is where capabilities come to the rescue.'
  merge: -1
  img_proc: true
- pgno: 433
  md: 'Under the hood, the Linux root user is a combination of a long list of capabilities.
    Some of these capabilities include:


    +   - CAP_CHOWN: lets you change file ownership

    - CAP_NET_BIND_SERVICE: lets you bind a socket to low-numbered network ports

    - CAP_SETUID: lets you elevate the privilege level of a process

    - CAP_SYS_BOOT: lets you reboot the system.


    The list goes on and is long.


    Docker leverages capabilities so that you can run containers as root but strip
    out all the capabilities you don''t need. For example, suppose the only capability
    your container needs is the ability to bind to low-numbered network ports. In
    that case, Docker can start the container as root, drop all root capabilities,
    and then add back the CAP_NET_BIND_SERVICE capability.


    This is a good example of implementing the principle of least privilege as you
    end up with a container that only has the capabilities it needs. Docker also sets
    restrictions to prevent containers from re-adding dropped capabilities.


    Docker ships with sensible out-of-the-box capabilities, but you should configure
    your own for your production apps and'
  merge: -1
  img_proc: true
- pgno: 434
  md: 'containers. However, configuring your own requires extensive effort and testing.


    # Mandatory Access Control systems


    Docker works with major Linux MAC technologies such as AppArmor and SELinux.


    Depending on your Linux distribution, Docker applies default AppArmor or SELinux
    profiles to all new containers, and according to the Docker documentation, the
    default profiles are moderately protective while providing wide application compatibility.


    You can tell Docker to start containers without these policies, and you can configure
    your own. However, with capabilities, configuring your own policies is very powerful
    but requires a lot of effort and testing.


    # seccomp


    Docker uses seccomp to limit which syscalls a container can make to the host''s
    kernel.


    Syscalls are how applications ask the Linux kernel to perform tasks. At the time
    of writing, Linux has over 300 syscalls and the'
  merge: -1
  img_proc: true
- pgno: 435
  md: 'default Docker profile disables approximately 40-50.


    As per the Docker security philosophy, all new containers get a default seccomp
    profile configured with sensible defaults designed to provide moderate security
    without impacting application compatibility.


    As always, you can customize your own seccomp profiles or tell Docker to start
    containers without one. Unfortunately, the Linux syscall table is long, and configuring
    custom seccomp policies may be prohibitively complex for some users.


    # Final thoughts on the Linux security technologies


    Docker supports most of the important Linux security technologies and ships with
    sensible defaults that add security without being too restrictive. Figure 16.3
    shows how Docker uses them to build a defence in depth security posture with multiple
    layers.'
  merge: -1
  img_proc: true
