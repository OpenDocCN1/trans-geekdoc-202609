    \   \"Id\": \"c7464dce2...ba2e3b8\",\n    \"Scope\": \"local\",\n    \"Driver\"\
    : \"bridge\",\n    \"EnableIPv6\": false,\n    \"IPAM\": {\n      \"Driver\":\
    \ \"default\",\n      \"Options\": null,\n      \"Config\": [\n        {\n   \
