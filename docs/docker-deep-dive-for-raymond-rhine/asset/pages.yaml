  md: '# 9: Multi-container apps with Compose


    In this chapter, you’ll deploy and manage a multi-container application using
    Docker Compose. When we talk about Docker Compose, we usually shorten it to Compose
    and always write it with a capital “C”.


    I''ve organized the chapter as follows:


    +   - Docker Compose – The TLDR

    - Compose background

    - Installing Compose

    - The sample app

    - Compose files

    - Deploying apps with Compose

