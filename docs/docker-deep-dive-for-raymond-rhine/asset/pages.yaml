- pgno: 406
  md: '# 15: Volumes and persistent data


    Stateful applications that create and manage data are a big part of modern cloud-native
    apps. This chapter explains how Docker volumes help stateful applications manage
    their data.


    I''ve split the chapter into the following parts:


    +   - Volumes and persistent data – The TLDR

    - Containers without volumes

    - Containers with volumes

    - The commands


    # Volumes and persistent data – The TLDR


    There are two main types of data — persistent and non-persistent.


    Persistent data is the stuff you care about and need to keep. It includes things
    like customer records, financial data, research results, audit data, and even
    some types of logs. Non-persistent data is the stuff you don’t care about and
    don’t need to keep. It call applications that create and manage persistent data
    stateful apps, and applications that don’t create or manage persistent data stateless
    apps.'
  merge: -1
  img_proc: true
- pgno: 407
  md: 'Both are important, and Docker has solutions for both.


    For stateless apps, Docker creates every container with an area of non-persistent
    local storage that''s tied to the container lifecycle. This storage is suitable
    for scratch data and temporary files, but you''ll lose it when you delete the
    container or the container terminates.


    Docker has *volumes* for stateful apps that create and manage important data.
    Volumes are separate objects that you mount into containers, and they have their
    own lifecycles. This means you don''t lose the volumes or the data on them when
    you delete containers. You can even mount volumes into different containers.


    That''s the TLDR. Let''s take a closer look.


    # Containers without volumes


    In the early days of Docker, containers were only good for stateless applications
    that didn''t generate important data. However, despite being *stateless*, many
    of these apps still needed a place to write temporary scratch data. So, as shown
    in Figure 15.1, Docker creates containers by stacking read-only image layers and
    placing a thin layer of local storage on top.'
  merge: -1
  img_proc: true
- pgno: 408
  md: 'The same technology allows multiple containers to share the same read-only
    image layers.


    ![](img/aae0230bf8529bd80767c4c780dca8d3_408_0.png)


    This thin layer of local storage is integral to the read-write nature of containers.
    For example, if an application needs to update existing files or add new files,
    it makes the changes in the local storage layer, and Docker merges them into the
    view of the container. However, the local storage is coupled to the container''s
    lifecycle, meaning it gets created when you create the container, and deleted
    when you delete it. This means it''s not a good place for data that you need to
    keep (persist).


    Docker keeps the local storage layer on the Docker host''s filesystem, and you''ll
    hear it called various names as the thin writeable layer, ephemeral storage, read-write
    storage, and graphdriver storage. It''s usually located in the following locations
    on your Docker hosts:'
  merge: -1
  img_proc: true
- pgno: 409
  md: "+   - Linux containers: `/var/lib/docker/<storage-driver>/...`\n\n+   - Windows\
    \ containers:\n  C:\\ProgramData\\Docker\\windowsfilter\\...\n\nEven though the\
    \ local storage layer allows you to update live containers, you should never do\
    \ this. Instead, you should treat containers as immutable objects and never change\
    \ them once deployed. For example, if you need to fix or change the configuration\
    \ of a live container, you should create and test a new container with the changes\
    \ and then replace the live container with the new one.\n\nTo be clear, applications\
    \ like databases can change the data they manage. But users and configuration\
    \ tools should never change the container’s *configuration*, such as its network\
    \ or application configuration. You should always make changes like these in a\
    \ new container and then replace the old container with the new one.\n\nIf your\
    \ containers don’t create persistent data, this thin writable layer of local storage\
    \ will be fine, and you’ll be good to go. However, if your containers create persistent\
    \ data, you need to read the next section."
  merge: -1
  img_proc: true
- pgno: 410
  md: '# Containers with volumes


    There are three main reasons you should use volumes to handle persistent data
    in containers:


    +   - Volumes are independent objects that are not tied to the lifecycle of a
    container

    - You can map volumes containers on different Docker hosts can use volumes to
    access and share the same data


    At a high level, you create a volume, then create a container, and finally mount
    the volume into the container. When you mount it into the volume, you mount it
    into a directory in the container''s filesystem, and anything you write to that
    directory gets stored in the volume. If you delete the container, the volume and
    data will still exist. You''ll even be able to mount the surviving volume into
    another container.


    Figure 15.2 shows a Docker volume outside the container as a separate object.
    The volume is mounted into the container''s filesystem at /data, and anything
    you write to that directory will be stored on the volume and exist after you delete
    the container.'
  merge: -1
  img_proc: true
- pgno: 411
  md: '![](img/aae0230bf8529bd80767c4c780dca8d3_411_0.png)


    Figure 15.2 High-level view of volumes and containers


    The image also shows that you can map the volume to an external storage system
    or a directory on the Docker host. External storage systems can be cloud services
    or dedicated storage appliances, but either way, the volume’s lifecycle is decoupled
    from the container. All of the container’s other directories use the thin writable
    layer in the local storage area on the Docker host.


    Creating and managing Docker volumes


    Volumes are first-class objects in Docker. This means there’s **docker volume**
    sub-command, and a **volume** resource in the API.


    Run the following command to create a new volume called **myvol.**'
  merge: -1
  img_proc: true
- pgno: 412
  md: '```

    $ docker volume create myvol

    myvol

    ```


    By default, Docker creates new volumes with the built-in local driver. And, as
    the name of the driver suggests, these volumes are only available to containers
    on the same node as the volume. You can use the -d flag to specify a different
    driver, but you''ll need to install the driver first.


    Third-party drivers provide advanced features and access to external storage systems
    such as cloud storage services and on-premises storage systems such as SAN and
    NAS. Figure 15.3 shows a Docker host connected to an external storage system via
    a plugin (driver).


    ![](img/aae0230bf8529bd80767c4c780dca8d3_412_0.png)


    Figure 15.3 Plugging external storage into Docker'
  merge: -1
  img_proc: true
- pgno: 413
