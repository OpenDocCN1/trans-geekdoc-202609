    Type `exit` to return to your local terminal.


    Ingress load balancing


    This section only applies to Docker Swarm.


    Swarm supports two ways of publishing services to external clients:


    +   - Ingress mode (default)'
  merge: -1
  img_proc: true
- pgno: 375
  md: '+   - Host mode


    External clients can access ingress mode services via any swarm node — even nodes
    not hosting a service replica. However, they can only access host mode services
    via nodes running replicas.

    Figure 13.19 shows both modes.


    ![](img/aae0230bf8529bd80767c4c780dca8d3_375_0.png)


    Figure 13.19


    Ingress mode is the default, meaning any time you create a service with -p or
    --publish, Docker will publish it in ingress mode. If you want to publish a service
    in host mode, you’ll need to use the --publish flag with the mode=host'
  merge: -1
  img_proc: true
- pgno: 376
  md: 'option. The following example publishes a service in host mode and will only
    work on a swarm.


    ```

    $ docker service create -d --name svcl \

    --publish published=5005,target=80,mode=host \

    nginx

    ```


    A few notes about the command. `docker service create` lets you publish services
    using either `long form syntax` or `short form syntax`.


    The short form looks like `-p 5005:80` and you’ve seen it a few times already.
    However, you cannot publish a service in *host mode using the short form.


    Long form looks like this: `--publish published=5005,target=80,mode=host`. It’s
    a comma-separated list with no whitespace after the commands, and the options
    work as follows:


    +   - `published=5005` makes the service available to external clients via port
    `5005`

    - `target=80` makes sure requests hitting the `published` port get mapped back
    to port `80` on service replicas

    - `mode=host` makes sure requests will only reach the service if they arrive on
    nodes running a service replica'
  merge: -1
  img_proc: true
- pgno: 377
  md: 'You’ll almost always use ingress mode.


    Behind the scenes, ingress mode uses a layer 4 routing mesh that Docker calls
    the service mesh or the swarm-mode service mesh. Figure 13.20 shows the basic
    traffic flow when an external request hits the cluster for a service exposed in
    ingress mode.


    ```

    $ docker service create -d --name svc1 --network overnet \

    --publish published=5005,target=80 nginx

    ```


    ![](img/aae0230bf8529bd80767c4c780dca8d3_377_0.png)


    Figure 13.20


    Let''s quickly walk through the diagram.


    The command at the top deploys a new Swarm service called svc1 with one replica,
    attaches it to the overnet network and publishes it on port 5005 on the ingress
    network. Docker automatically creates the ingress network when you create the'
  merge: -1
  img_proc: true
- pgno: 378
  md: 'swarm, and it attaches every node to it. The act of publishing the service
    on port 5005 makes it accessible via port 5005 on every swarm node because every
    node is connected to the ingress network. Docker also creates a swarm-wide rule
    to route all traffic hitting nodes on port 5005 to port 80 in the svc1 replicas
    via the ingress network.


    Now let''s track that external request.


    +   1. The external client sends a request to Node 1 on port 5005

    2. Node 1 receives the request and knows to forward traffic arriving on port 5005
    to the ingress network

    3. The ingress network forwards the request to Node 2 which is running a replica

    4. Node 2 receives the request and passes it to the replica on port 80


    If the service has multiple replicas, swarm is clever enough to balance requests
    across them all.


    # Clean-up


    If you''ve been following along, you''ll have a lot of containers, networks, and
    services that you probably want to clean up.


    Run the following command to delete the services you created.'
