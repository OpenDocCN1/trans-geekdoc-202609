- pgno: 194
  md: '+   * Stage 0 is called base and builds an image with compilation tools, etc

    * Stage 1 is called build-client and compiles the client executable

    * Stage 2 is called build-server and compiles the server executable

    * Stage 3 is called prod and copies the client and server executables into a slim
    image


    Each stage outputs an intermediate image that later stages can use. However, Docker
    deletes them when the final stage completes.


    The goal of the base stage is to create a reusable build image with all the tools
    stages 1 and 2 need to build the client and server applications. The image created
    by this stage is only used to compile the executables and not for production.
    It pulls the golang:1.22.1-alpine image, which is over 300MB when uncompressed.
    It sets the working directory to /src and copies in go.mod and go.sum files from
    your working directory. These files list the application dependencies and hashes.
    After that, it uses the RUN instruction to install the dependencies and then the
    COPY instruction to copy the application source code into the image. All of this
    creates a large image with three layers containing a lot of build stuff but'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'not much app stuff. When this build stage completes, it outputs a large image
    that later stages can use.


    The **build-client** stage doesn''t pull a new image. Instead, it uses the `FROM
    base AS build-client` instruction to use the intermediate image created by the
    **base** stage. It then issues a **RUN** instruction to compile the client app
    into a binary executable. The goal of this stage is to create an image with the
    compiled `client` binary that can be referenced by later stages.


    The **build-server** stage does the same for the **server** component and outputs
    a similar image for use by later stages.


    The **prod** stage pulls the minimal **scratch** image. It then runs two `COPY
    --from` instructions to copy the compiled `client app` from the **build-client**
    stage and the compiled `server app` from the **build-server** stage. It then tells
    Docker to run the server app when it''s started as a container. This stage outputs
    the final production image containing just the client and server binaries inside
    a tiny scratch image and the metadata telling Docker how to start the app.


    The builder will run the **base** stage first, then run the **build-client** and
    **build-server** stages in parallel, and finally run the **prod** stage.'
