  md: '# 10: Docker Swarm


    Now that you know how to install Docker, pull images, and work with containers,
    the next logical step is to do it all at scale. That''s where Docker Swarm comes
    into play.


    I''ve split the chapter into the following main parts:


    +   - Docker Swarm – The TLDR

    - Swarm primer

    - Build a secure Swarm cluster

    - Deploy and manage an app on swarm

    - Service logs

    - The commands


    # Docker Swarm – The TLDR


    Docker Swarm is two things:


    +   1. An enterprise-grade cluster of Docker nodes

    2. An orchestrator of microservices apps


    On the clustering front, Swarm groups one or more Docker nodes into a cluster.
    Out of the box, you get an encrypted distributed cluster store, encrypted networks,
    mutual TLS, secure cluster join tokens, and a PKI that makes managing and'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'rotating certificates a breeze. You can even add and remove nodes non-disruptively.
    We call these clusters “swarms”.


    On the orchestration front, Swarm makes deploying managing complex microservices
    apps easy. You define applications declaratively in Compose files and use simple
    Docker commands to deploy them to the swarm. You can even perform rolling updates,
    rollbacks, and scaling operations.


    Docker Swarm is similar to Kubernetes — both are clusters that run and manage
    containerized applications. Kubernetes is more popular and has a more active community
    and ecosystem. However, Swarm is easier to use and is a popular choice for small-to-medium
    businesses and smaller application deployments. Learning Swarm also prepares you
    to learn and work with Kubernetes. In fact, if you plan on learning Kubernetes,
    you should check out my books, Quick Start Kubernetes and The Kubernetes Book.


    # Swarm primer


    On the clustering front, a swarm is one or more Docker nodes that can be physical
    servers, VMs, cloud instances, Raspberry Pi’s, and more. The only requirement
    is that they all run Docker and can communicate over reliable networks.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '**Terminology:** When referring to the Docker Swarm technology, we’ll write
    Swarm with an uppercase “S”. When referring to a swarm as a cluster of nodes,
    we’ll use a lowercase “s”.


    Every node in a swarm is either a manager or a worker:


    +   * Managers run the control plane services that maintain the state of the cluster
    and schedule user applications to workers

    * Workers run user applications


    Swarm runs user applications on managers and workers in a default installation.
    However, you can force user applications to run on worker nodes on important clusters,
    allowing your managers to focus on cluster management operations.


    The swarm stores its state and configuration in an in-memory distributed database
    that replicates across all manager nodes. Fortunately, it’s automatically configured
    when you create the swarm and takes care of itself.


    Swarm uses TLS to encrypt communications, authenticate nodes, and authorize roles
    (managers and workers). It also configures and performs automatic key rotation.
    And with the cluster store, it’s automatically configured when you create the
    swarm and takes care of itself.'
  merge: -1
  img_proc: true
- pgno: 249
