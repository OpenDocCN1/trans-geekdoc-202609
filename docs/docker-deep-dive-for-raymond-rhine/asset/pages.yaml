  md: '```

    FROM scratch AS prod-client         <----- New stage

    COPY --from=build-client /bin/client /bin/

    ENTRYPOINT [ "/bin/client" ]

    ```


    ```

    FROM scratch AS prod-server         <----- New stage

    COPY --from=build-server /bin/server /bin/

    ENTRYPOINT [ "/bin/server" ]

    ```


    I''ve pre-prepared the file and called it **Dockerfile-final** in the **multi-stage**
    folder, but you can see the only change is splitting the final **prod** stage
    into two stages — one for the client build and the other for the server. With
    a Dockerfile like this, you tell a **docker build** command which of the two final
    stages to target for the build.


    Let''s do it.


    Run the following two commands to create two different images from the same **Dockerfile-final**
    file. Both commands use the **-f** flag to tell Docker to use the **Dockerfile-final**
    file. They also use the **--target** flag to tell the builder which stage to build
    from.


    ```

    $ docker build -t multi:client --target prod-client -f Dockerfile

    <Snip>


    docker build -t multi:server --target prod-server -f Dockerfile

    <Snip>

    ```'
