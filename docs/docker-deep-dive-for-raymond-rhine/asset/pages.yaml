    in the host''s kernel


    You can run a docker network inspect command to confirm that the bridge network
    is based on the docker0 in the host''s kernel. If you''re on Windows using PowerShell,
    you''ll need to replace grep with Select-String.


    ```

    $$ docker network inspect bridge | grep bridge.name

    "com.docker.network.bridge.name": "docker0",

    ```


    Now run these Linux commands to inspect the docker 0 bridge from the Linux host.
    You might need to manually install the brctl utility.'
