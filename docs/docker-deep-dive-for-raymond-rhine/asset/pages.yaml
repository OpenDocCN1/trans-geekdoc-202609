    # Containerize a Wasm app


    Docker Desktop lets you containerize Wasm apps so you can use familiar Docker
    tools to push and pull them to OCI registries and run them inside containers.


    As always, you need a Dockerfile that tells Docker how to package the app as an
    image. Create a new file called'
  merge: -1
  img_proc: true
- pgno: 328
  md: 'Dockerfile in your current directory and populate it with the following three
    lines.


    ```

    FROM scratch

    COPY /target/wasm32-wasi/release/hello_world.wasm

    COPY spin.toml

    ```


    The file references a special empty base image called scratch because Wasm containers
    don''t need a Linux OS.


    The two COPY instructions copy the hello_world.wasm Wasm app and the spin.toml
    file into the image.


    If you look closely, you''ll see that the spin.toml file expects the Wasm app
    to be in the target/wasm32-wasi/release/ directory. However, the second COPY instruction
    places it in the root folder. This means we''ll need to update the spin.toml file
    so it knows where to find the app after it''s copied into the root of the image.


    Edit the spin.toml file and remove the leading path for the source line as shown.


    ```

    <Snip>

    [component.hello-world]

    source = "hello_world.wasm"      <----- Remove any leading direc

    <Snip>

    ```'
  merge: -1
  img_proc: true
- pgno: 329
  md: 'Save your changes.


    Run the following command to containerize the Wasm app. Be sure to tag the image
    with your own Docker Hub username instead of mine.


    ```

    $ docker build \\n--platform wasi/wasm \\n--provenance=false \\n--t nigelpoulton/ddd-book:wasm
    .

    ```


    The --platform wasi/wasm flag sets the image as a Wasm image.


    Some older versions of Docker have an older builder and will fail. If this happens,
    try running the same command, but change the first line to docker buildx build
    \.


    List the images on your system.


    | REPOSITORY | TAG | IMAGE ID | CREATED | SIZE |

    | nigelpoulton/ddd-book | wasm | 7b55889f1006 | 2 minutes ago | 620 |'
  merge: -1
  img_proc: true
