- pgno: 105
  md: '# Image hashes and layer hashes


    You already know that images are just a loose collection of independent layers.
    This means an image is just a manifest file with some metadata and a list of layers.
    The actual application and all its dependencies live in the layers. However, layers
    are fully independent and have no concept of being part of an image.


    With this in mind, images and layers have their own digests as follows:


    +   - Images digests are a crypto hash of the image manifest file

    - Layer digests are a crypto hash of the layer’s contents


    This means all changes to layers or image manifests result in new hashes, giving
    us an easy and reliable way to know if changes have been made.


    # Content hashes vs distribution hashes


    Docker compares hashes before and after every push and pull to ensure no tampering
    has occurred. However, it also compresses images during push and pull operations
    to save network bandwidth and storage space on the registry. As a'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'result of this compression, the before and after hashes won’t match.


    To get around this, each layer gets two hashes:


    +   - Content hash (uncompressed)

    - Distribution hash (compressed)


    Every time Docker pushes or pulls a layer from a registry, it includes the layer''s
    *distribution hash* and uses this to verify no tapering occurring. This is one
    reason why the hashes in different CLI and registry outputs don’t always match
    — sometimes you’re looking at the content hash, and other times you’re looking
    at the distribution hash.


    # Multi-architecture images


    One of the best things about Docker is its simplicity. However, as technologies
    grow, they inevitably get more complex. This happened for Docker when it started
    supporting different platforms and architectures, such as Windows and Linux on
    variations of ARM, x64, PowerPC, s390x and more. Suddenly, there were multiple
    versions of the same image for all the different architectures, and developers
    and users had to put in significant extra work to get the right version. This
    broke the smooth Docker experience.'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'Multi-architecture images to the rescue!


    Fortunately, Docker and the registry API adapted and became clever enough to hide
    images for multiple architectures behind a single tag. This means you can do a
    `docker pull alpine` on any architecture and get the correct version of the image.
    For example, if you''re on an AMD64 machine, you''ll get the AMD64 image.


    To make this happen, the Registry API supports two important constructs:


    +   - Manifest lists

    - Manifests


    The *manifest list* is exactly what it sounds like — a list of architectures supported
    by an image tag. Each supported architecture then has its own *manifest* that
    lists the layers used to build it.


    Run the following command to see the different architectures supported behind
    the `alpine:latest` tag.


    ```

    $ docker buildx imagetools inspect alpine

    Name: docker.io/library/alpine:latest

    MediaType: application/vnd.docker.distribution.manifest.list.v2+json

    Digest: sha256:c5b1261d6d3e43071626931fc04f70149baeba2c8ec62

    ```'
  merge: -1
  img_proc: true
