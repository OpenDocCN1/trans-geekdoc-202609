  md: '# 5: The Docker Engine


    In this chapter, we’ll look under the hood of the Docker Engine.


    This chapter has a strong operations focus, and you can use Docker without knowing
    everything you’re about to learn. However, to truly master something, you need
    to understand what’s going on under the hood. So, if you want to master Docker,
    you should read this chapter.


    I’ve divided the chapter into the following sections:


    +   - Docker Engine – The TLDR

    - The Docker Engine

    - The influence of the Open Container Initiative (OCI)

    - runc

    - containerd

    - Starting a new container (example)

    - What’s the shim all about

    - How it’s implemented on Linux


    Let’s learn about the Docker Engine.


    # Docker Engine – The TLDR'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'Docker Engine is jargon for the server-side components of Docker that run and
    manage containers. If you’ve ever worked with VMware, the Docker Engine is similar
    to ESXi.


    The Docker Engine is modular and built from many small specialized components
    pulled from projects such as the OCI, the CNCF, and the Moby project.


    In many ways, the Docker Engine is like a car engine:


    +   - A car engine is made from many specialized parts that work together to make
    a car drive — intake manifolds, throttle bodies, cylinders, pistons, spark plugs,
    exhaust manifolds, and more.


    +   - The Docker Engine is made from many specialized tools that work together
    to create and run containers — the API, image builder, high-level runtime, low-level
    runtime, shims, and etc.


    Figure 5.1 shows the components of the Docker Engine that create and run containers.
    Other components exist, but this simplified diagram focuses on the components
    that start and run containers.'
