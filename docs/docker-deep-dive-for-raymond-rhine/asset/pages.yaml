  md: 'The entrypoint command is clever enough to look for Entrypoint and Cmd instructions.


    Type exit to quit the debug session.


    In summary, Docker Debug is a new tool for debugging slim images and containers.
    It gets you access to containers and images that don''t include a shell, and you
    can run troubleshooting tools that aren''t available in the container or image.
    Any changes you make to running containers take immediate effect and persist across
    stop and restart operations. However, changes made while debugging images and
    stopped containers are lost when you close the session. In all cases, the tools
    you install and use are never part of the container or image.


    # Self-healing containers with restart policies


    Container restart policies are a simple form of self-healing that allows the local
    Docker Engine to automatically restart failed containers.


    You apply restart policies per container, and Docker supports the following four
    policies:


    +   * no (default)'
  merge: -1
  img_proc: true
- pgno: 164
  md: '+   * on-failure

    * always

    * unless-stopped


    | Restart | Non- | Zero | docker | when |

    |---|---|---|---|---|

    | | | stop | Daemon |

    | | exit code | exit code | command | restarts |

    | no | N | N | N | N |

    | on-failure | Y | N | N | Y |

    | always | Y | Y | N | Y |

    | unless-stopped | Y | Y | N | N |'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'Non-zero exit codes indicate a failure occurred. Zero exit codes indicate the
    container exited normally without an error.


    We''ll demo some examples, but you should also do your own testing.


    Let''s demonstrate the **always** policy by starting a new interactive container
    with the **--restart always** flag and telling it to run a shell process. We''ll
    then type **exit** to kill the shell process **and** the container to see what
    happens.


    Run the following command to start an interactive container called **neversaydie**
    with the **always** restart policy.


    ```

    $ docker run --name neversaydie -it --restart always alpine sh #

    ```


    Your terminal will automatically connect to the shell process inside the container.


    Type **exit** to kill the shell process and return to your local terminal. This
    will cause the container to exit with a zero exit code, indicating a normal exit
    without any failures.


    According to the previous table, the **always** restart policy should automatically
    restart the container.'
  merge: -1
  img_proc: true
- pgno: 166
