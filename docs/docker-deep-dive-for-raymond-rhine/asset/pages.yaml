- pgno: 395
  md: '# Overlay networks explained


    First and foremost, Docker uses VXLAN tunnels to create virtual layer 2 overlay
    networks. So, let''s do a quick VXLAN primer.


    # VXLAN primer


    At the highest level, Docker uses VXLANs to create layer 2 networks on top of
    existing layer 3 infrastructure. That''s a lot of jargon that means you can create
    simple networks on top of complex networks. The hands-on example in the previous
    sections created a new 10.0.0.0/24 layer 2 network that abstracted a more complex
    network topology below. See Figure 14.4 and remember that your underlay network
    configuration was probably different.'
  merge: -1
  img_proc: true
- pgno: 396
  md: '![](img/aae0230bf8529bd80767c4c780dca8d3_396_0.png)


    Figure 14.4


    Fortunately, VXLAN is an *encapsulation* technology and, therefore, transparent
    to existing routers and network infrastructure. This means the routers and other
    infrastructure in the underlay network see the VXLAN/overlay traffic as regular
    IP/UDP packets and handle it without requiring changes.


    To create the overlay, Docker creates a VXLAN tunnel through the underlay networks,
    and this tunnel is what allows the overlay traffic to flow freely without having
    to interact with the complexity of the underlay networks.'
  merge: -1
  img_proc: true
- pgno: 397
  md: '**Terminology:** We use the terms underlay networks or underlay infrastructure
    to refer to the networks the overlay tunnels through.


    Each end of the VXLAN tunnel is terminated by a VXLAN Tunnel Endpoint (VTEP),
    and it’s this VTEP encapsulates and de-encapsulates the traffic entering and exiting
    the tunnel. See Figure 14.5.


    ![](img/aae0230bf8529bd80767c4c780dca8d3_397_0.png)


    Figure 14.5


    The image shows the layer 3 infrastructure as a cloud for two reasons:'
  merge: -1
  img_proc: true
- pgno: 398
  md: '+   - It can be a lot more complex than the two networks and a single router
    from the previous diagrams


    +   - The VXLAN tunnel abstracts the complexity and makes it opaque


    In reality, the VXLAN tunnel traverses the underlay network. However, I don’t
    show this in the diagram to keep the diagram simple.


    # Traffic flow example


    The hands-on examples from earlier had two hosts connected via an IP network.
    You deployed an overlay network across both hosts, connected two containers to
    it, and did a ping test. Let''s explain some of the things that happened behind
    the scenes.


    Docker created a new sandbox (network namespace) on each host with a new switch
    called Br0. It also created a VTEP with one end connected to the Br0 virtual switch
    and the other end connected to the host’s network stack. The end in the host’s
    network stack got an IP address on the underlay network that the host is connected
    to and was bound to UDP port 4789. Finally, the two VTEPs on each host created
    a VXLAN tunnel as the backbone for the overlay network.'
  merge: -1
  img_proc: true
- pgno: 399
  md: 'Figure 14.6 shows the configuration. Remember, the VXLAN tunnel goes through
    the networks at the bottom of the diagram; I''ve just drawn it higher up for readability.


    ![](img/aae0230bf8529bd80767c4c780dca8d3_399_0.png)


    Figure 14.6


    At this point, you''ve created the VXLAN overlay, and you''re ready to connect
    containers.


    Docker now creates a virtual Ethernet adapter (veth) in each container and connects
    it to the local Br0 virtual switch. The final topology looks like Figure 14.7,
    and although it''s complex, you should now see how the containers communicate
    over the VXLAN overlay despite their hosts being on two separate'
  merge: -1
  img_proc: true
- pgno: 400
  md: 'networks — the overlay is a virtual network tunneled through the underlay networks.


    ![](img/aae0230bf8529bd80767c4c780dca8d3_400_0.png)


    Figure 14.7


    Now that you know how Docker creates overlay networks, let’s see how the two containers
    communicate.


    > Warning! This section is very technical, and you don’t need to understand it
    all for day-to-day operations.


    For this example, we’ll call the container on node1 “C1” and the container on
    node2 “C2”. We’ll also assume C1 wants to ping C2 like we did in the practical
    example earlier. Figure 14.8 shows the full configuration with container names
    and IPs added.'
  merge: -1
  img_proc: true
- pgno: 401
  md: '![](img/aae0230bf8529bd80767c4c780dca8d3_401_0.png)


    # Figure 14.8


    **C1** initiates a ping request to 10.0.0.4 — the IP address of **C2**.


    **C1** doesn''t have an entry for 10.0.0.4 in its local MAC address table (ARP
    cache), so it floods the packet on all interfaces, including the veth interface
    connected to the **Br0** bridge. The **Br0** bridge knows it can forward traffic
    for 10.0.0.4 to the connected VTEP interface and sends a proxy ARP reply to the
    container. This results in the veth **learning** how to forward the packet by
    updating its own MAC table to send all future packets for 10.0.0.4 directly to
    the local VTEP. The **Br0** switch knew about the **C2** container because Docker
    propagates details of all new containers to every swarm node via the network''s
    built-in gossip protocol.'
  merge: -1
  img_proc: true
- pgno: 402
  md: 'Next, the veth in the C1 container sends the ping to the VTEP interface which
    encapsulates it for transmission through the VXLAN tunnel. The encapsulation adds
    a VXLAN header containing a VXLAN network ID (VNID) that maps traffic from VLANs
    to VXLANs and vice versa — each VLAN gets mapped to its own VNID so that packets
    can be de-encapsulated on the receiving end and forwarded to the correct VLAN.
    This maintains network isolation.


    The encapsulation also wraps the frame in a UDP packet and adds the IP of the
    remote VTEP on node2 in the *destination IP field*. It also adds the UDP/4789
    socket information. This encapsulation allows the packets to be routed across
    the underlay networks without the underlays knowing anything about VXLAN.


    When the packet arrives at node2, the host''s kernel sees it''s addressed to UDP
    port 4789 and knows it has a VTEP bound to this socket. This means it sends the
    packet to the VTEP, which reads the VNID, de-encapsulates it, and sends it to
    its own local Br0 switch on the VLAN corresponding to the VNID. From there, it
    delivers it to the C2 container.


    And that, my friends, is how Docker uses VXLAN to build and operate overlay networks
    — a whole load of mind-blowing'
  merge: -1
  img_proc: true
- pgno: 403
  md: 'complexity beautifully hidden behind a single Docker command.


    I''m hoping that''s enough to get you started and help you when talking to your
    networking team about the networking aspects of your Docker infrastructure. On
    the topic of talking to your networking team... don’t approach them thinking that
    you now know everything about VXLAN. If you do do, you’ll probably embarrass yourself.
    I’m speaking from experience ;-)


    One final thing. Docker also supports layer 3 routing within within an overlay
    network. For example, you can create a single overlay network with two subnets,
    and Docker will handle the routing. The following command will create a new overlay
    called **prod-net** with two subnets. Docker will automatically create two virtual
    switches called **Br0** and **Br1** inside the sandbox and handle all the routing.


    ```

    $ docker network create --subnet=10.1.1.0/24 --subnet=11.1.1.0/24

    ```


    # Clean up


    If you followed along, you’ll have created an overlay network called **uber-net**
    and deployed a service called **test**. You may also have created a swarm.'
  merge: -1
