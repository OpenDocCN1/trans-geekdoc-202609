    # Debugging slim images and containers with Docker Debug


    At the time of writing, Docker Debug is a new tool and requires a Pro, Team, or
    Business subscription.


    It''s a widely accepted good practice to deploy small images containing only app
    code and dependencies. This means no shell ordebugging tools is a big part of
    making images and containers small and secure. However, it also makes it difficult
    to debug them when things go wrong.'
