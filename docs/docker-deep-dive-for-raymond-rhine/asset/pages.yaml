- pgno: 422
  md: '# Potential data corruption


    Data corruption is a major concern for any shared storage configuration.


    Assume the following example based on Figure 15.4.


    The application running in `ctr1` writes an update to the shared volume. However,
    instead of directly committing the update, it keeps it in a local cache for faster
    recall. At this point, the application in `ctr1` thinks it’s written data to the
    volume. However, before `ctr1` flushes its cache and commits the data to the volume,
    but in reality, only the application in `ctr2` updates the same data with a different
    value and commits it directly to the volume. At this point, both applications
    think they’ve updated the data in the volume, but the application in `ctr2` has
    A few seconds later, `ctr1` flushes the data to the volume and overwrites the
    changes made by the application in `ctr2`. However, neither of the applications
    is aware of the changes the other has made.


    This is why you need to design applications that share data to coordinate updates
    to shared volumes.


    # Clean up'
  merge: -1
