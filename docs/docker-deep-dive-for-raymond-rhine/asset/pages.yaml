    \ container by name.\n\n```\n# ping c1\nPING c1 (172.21.0.2): 56 data bytes\n\
    64 bytes from 172.21.0.2: seq=0 ttl=64 time=1.564 ms\n64 bytes from 172.21.0.2:\
    \ seq=1 ttl=64 time=0.338 ms\n64 bytes from 172.21.0.2: seq=2 ttl=64 time=0.248\
    \ ms\n<Control-c>\n```\n\nIt works! This is because all containers run a DNS resolver\
