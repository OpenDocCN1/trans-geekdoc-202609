    # Docker images – The TLDR


    Before getting started, all of the following terms mean the same thing, and we''ll
    use them interchangeably: *Image, Docker image, container image,* and OCI image.'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'An image is a read-only package containing everything you need to run an application.
    This means they include application code, dependencies, a minimal set of OS constructs,
    and metadata. You can start multiple containers from a single image.


    If you''re familiar with VMware images are a bit like VM templates — a VM template
    is like a stopped VM, whereas an image is like a stopped container. If you''re
    a developer, images are similar to *classes* — you can create one or more objects
    from a class, whereas you can create one or more containers from an image.


    The easiest way to get an image is to pull one from a *registry*. Docker Hub is
    the most common registry, and *pulling* an image downloads it to your local machine
    where Docker can use it to start one or more containers. Other registries exist,
    and Docker works with them all.


    Images are made by stacking independent *layers* and representing them as a single
    unified object. One layer might have the OS components, another layer might have
    the application dependencies, Docker stacks these layers and makes them look like
    a unified system.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'Images are usually small. For example, the official NGINX image is around 60MB,
