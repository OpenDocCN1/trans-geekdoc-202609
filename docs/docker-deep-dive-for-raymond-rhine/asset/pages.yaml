    # Intro to images


    We’ve already said that images are like stopped containers. You can even stop
    a container and create a new image from it. With this mind, images are *build-time*
    constructs, whereas containers are *run-time* constructs. Figure 6.1 shows the
    *build and run* nature of each and that you can start multiple containers from
