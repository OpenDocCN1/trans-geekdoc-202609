- pgno: 308
  md: 'Let’s switch tack and see how to manage swarm stacks.


    # Managing the app


    There are two ways to manage Docker stacks:


    +   - Imperatively

    - Declaratively


    The imperative *method* is where you run Docker commands to make changes to the
    stack. For example, using the **docker service scale** command to increase and
    decrease the number of service replicas.


    The declarative *method* is where you make all changes via the stack file. For
    example, if you want to change the number of service replicas, you edit the stack
    file with the desired replica count and run another `docker stack deploy` command.


    The declarative method is the preferred method.


    Consider the following example that demonstrates why you should manage stacks
    declaratively.


    Imagine you''ve deployed an app from a stack file that includes **reporting**
    service and a **catalog** service. The stack file includes other services that
    are part of the app, but we’re only interested'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'in these two. It''s currently running five replicas of the reporting service,
    but year-end reporting has started, and it''s experiencing slow performance due
    to increased demand. You decide to run an imperative `docker service scale` command
    to increase the number of reporting replicas to 10. This fixes the performance
    issues, but the current state of the app is out of sync with the stack file —
    the stack file defines five replicas but the cluster is running 10. Later in the
    day, a colleague is tasked with rolling out a new version of the catalog service
    — the catalog service is part of the same app, and therefore, is defined in the
    stack file as the reporting service. Your colleague makes the changes declaratively
    by editing the stack file with the new version of the catalog service and running
    `docker stack deploy` command to push the updates. When Docker receives the updated
    version of the stack file, it rolls out the new version of the catalog service
    and changes the number of reporting replicas back to five. This will cause the
    reporting service to start running slowly again.


    This is why you should make all changes declaratively via your stack files and
    manage them in a version control system.


    Getting back to the app you deployed, let''s do the following:


    +   - Increase the number of `web-fe` replicas from 4 to 10'
  merge: -1
  img_proc: true
- pgno: 310
  md: "+   Update the web-fe service to the newer swarm-appv2 image\n\nEdit the compose.yaml,\
    \ increase the web-fe replica count to 10, and change the image to swarm-appv2.\n\
    \n```\n<Snip>\nservices:\n  web-fe:\n    image: nigerpoulton/ddd-book:swarm-appv2\
    \  <---- changed t\n    command: python app.py\n  deploy:\n    replicas: 10  \
    \    <---- Changed f\n</Snip>\n```\n\nSave your changes and redeploy the app.\
    \ This will cause Docker to rollout a new version of the web-fe service with all\
    \ 10 replicas running the new image.\n\n```\n$ docker stack deploy -c compose.yaml\
    \ ddd\nUpdating service ddd_redis (id: ozljsazuv7mmh14ep70pv43cf)\nUpdating service\
    \ ddd_web-fe (id: zbbplw0hul2gr593mvwvsl5)\n```\n\nEven though it looks like Docker\
    \ has redeployed both services, it hasn't. It's clever enough only to redeploy\
    \ the bits you've changed.\n\nRun a docker stack ps to see the rollout's progress."
  merge: -1
  img_proc: true
- pgno: 311
  md: '```

    $ docker stack ps ddd

    NAME          IMAGE NODE DESI

    ddd_web-fe.1  nigelpoulton/ddd-book:swarm-app node2 Runn

    ddd_web-fe.2  nigelpoulton/ddd-book:swarm-appv2 node2 Runn

    \ ddd_web-fe.2  nigelpoulton/ddd-book:swarm-app node2 Shut

    ddd_web-fe.3  nigelpoulton/ddd-book:swarm-app node1 Runn

    ```


    I''ve trimmed the output to fit the book, and I''ve only listed some

    of the replicas. However, you can see a few things.


    The top line shows the ddd_web-fe.1 replica running the old

    image for the last 8 minutes.


    The next two lines show the ddd_web-fe.2 replica. You can see

    the old copy was running the old image, was shut down 26

    seconds ago, and was replaced with a new version running the

    new image. The new replica has been running for 13 seconds.


    The last line shows the ddd_web-fe.3 replica is still running the

    old version.


    It''s important to emphasize two things.


    First, Docker followed the rules in the

    deploy.update_config** section of the Compose file. If you

    look at that section of the file again, you''ll see that Docker can'
  merge: -1
  img_proc: true
- pgno: 312
  md: "update two replicas, wait for 10 seconds, update the next two, wait 10 seconds,\
    \ and then attempt a rollback to the previous version if it encounters any issues.\n\
    \n```\nweb-fe:\ndeploy:\n  update_config:\n    parallelism: 2\n    delay: 10s\n\
    \    failure_action: rollback\n```\n\nSecond, containers are immutable and Docker\
    \ didn’t update the existing containers to run the new image. It deleted and replaced\
    \ them with new containers running the new image.\n\nAfter a short period, all\
    \ 10 replicas will be running updated image.\n\nRefresh your browser to make sure\
    \ you see the updated version of the app with a purple WebAssembly is the future\
    \ banner.\n\nSomething needs to be fixed because it still displays the old web\
    \ page.\n\nThe issue is with the volume. Let’s walk through what happened."
  merge: -1
  img_proc: true
- pgno: 313
  md: "The new image has the updated app version with the purple WebAssembly is the\
    \ future banner. The rollout deleted the old replicas and replaced them with new\
    \ ones running the new version of the app. So far, so good. However, when Docker\
    \ started each new replica, it mounted the volume with the old app version. This\
    \ had the effect of overwriting the new version of the app with the old.\n\nYou\
    \ should be aware of this when working with volumes. However, it will usually\
    \ be fine because you typically only use volumes for data stores, not for hosting\
    \ application binaries.\n\nLet's assume you realize the web-fe service is stateless\
    \ and doesn't require a volume. The declarative way to remove the volume is to\
    \ edit the Compose file again, remove the volume and mount, and redeploy the app.\
    \ Let's do it.\n\nEdit the compose.yaml file and make the following changes:\n\
    \n```\nvolumes:\\               <-- Delete this line\ncounter-vol:      <-- Delete\
    \ this line\n<Snip>\nservices:\n  web-fe:\n    image: nigelpoulton/ddd-book:swarm-appv2\n\
    <Snip>\nvolumes:                 <----- Delete this line\n  type: volume     \
    \     <----- Delete this line\n```"
  merge: -1
  img_proc: true
- pgno: 314
  md: 'Save your changes and redeploy.


    ```

    $ docker stack deploy -c compose.yaml ddd

    Updating service ddd_redis (id: ozljjsazuv7mmh14ep70pv43cf)

    Updating service ddd_web-fe (id: zbbplw0hul2gbr593mvwlz5i)

    ```


    The stack will update two replicas at a time and wait 10 seconds between each.
    The stack has converged and all replicas are updated, you should see the new version
    of the app as shown in Figure 11.4. Refresh your browser a few times to make sure
    it works. Don''t worry if some requests get the old version while the rollout
    is in progress.


    ![](img/aae0230bf8529bd80767c4c780dca8d3_314_0.png)


    Figure 11.4 - The updated app'
  merge: -1
