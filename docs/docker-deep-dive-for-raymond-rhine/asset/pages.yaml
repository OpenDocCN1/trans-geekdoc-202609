- pgno: 137
  md: 'There are three ways you can tell Docker how to start an app in a container:


    +   1. An **EntryPoint** instruction in the image

    2. A **Cmd** instruction in the image

    3. A CLI argument


    You’ll learn more about these in the next chapter, but the **EntryPoint** and
    **Cmd** instructions are optional image metadata that store the command Docker
    uses to start the default app. Then, whenever you start a container from the image,
    Docker checks the Entrypoint or Cmd instruction and executes the stored command.


    **EntryPoint** instructions cannot be overridden on the CLI, and anything you
    pass in via the CLI will be appended to the Entrypoint instruction as an argument.


    **Cmd** instructions can be overridden by CLI arguments.


    Run the following command to see if the `nigelpoulton/ddd-book:web0.1` image has
    an Entrypoint instruction. The command searches the image metadata and returns
    any lines containing the word “EntryPoint” and the three lines immediately following
    it. Windows users will need to replace'
  merge: -1
  img_proc: true
- pgno: 138
  md: "the grep command with Select-String -Pattern 'Entrypoint' -Context 0,3.\n\n\
    ```\n$ docker inspect nigelpouton/ddd-book:web0.1 | grep Entrypoint -\n<Snip>\n\
    \"Entrypoint\": [\n  \"node',\n  \"./app.js\"\n]\n```\n\nThis image has an Entrypoint\
    \ instruction that translates into the following command — node ./app.js . If\
    \ you're not familiar with Node.js, it's a simple command telling the Node.js\
    \ runtime to execute the code in the app.js file.\n\nIf an image doesn't have\
    \ an Entrypoint instruction, you can search for the presence of a Cmd instruction.\n\
    \nIf an image doesn't have either, you'll need to pass an argument on the CLI.\n\
    \nThe format of the docker run command is:\n\n```\ndocker run <arguments> <image>\
    \ <command>\n```"
  merge: -1
  img_proc: true
