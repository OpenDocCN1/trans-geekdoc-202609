  md: '# 8: Containerizing an app


    Docker makes it easy to package applications as images and run them as containers.
    We call this process containerization, and this chapter will walk you through
    the entire process.


    I''ve divided the chapter as follows:


    +   - Containerizing an app – The TLDR

    - Containerize a single-container app

    - Moving to production with multi-stage-builds

    - Buildx, BuildKit, drivers, and Build Cloud

    - A few good practices


    # Containerizing an app – The TLDR


    Docker aims to make it easy to build, ship, and run applications. We call this
    containerization and the process looks like this:


    +   1. Write your applications and create the list of dependencies

    2. Create a Dockerfile that tells Docker how to build and run the app

    3. Build the app into an image

    4. Push the image to a registry (optional)

    5. Run a container from the image'
