    # Multi-stage builds and build targets


    You can also build multiple images from a single Dockerfile.


    The previous example compiled client and server apps and copied both into the
    same image. However, Docker makes it easy to create a separate image for each
    by splitting the final prod stage into two stages as follows:


    ```

    FROM golang:1.20-alpine AS base

    WORKDIR /src

    COPY go.mod go.sum

    RUN go mod download

    COPY . .


    FROM base AS build-client

    RUN go build -o /bin/client ./cmd/client


    FROM base AS build-server

    RUN go build -o /bin/server ./cmd/server

    ```'
