    # Moving to production with multi-stage builds


    When it comes to container images... big is bad! For example:


    +   - Big means slow

    - Big means more potential vulnerabilities

    - Big means a larger attack surface


    For these reasons, your container images should only contain the stuff needed
    to run your applications in production.


    This is where multi-stage builds come into play.


    At a high level, multi-stage builds use a single Dockerfile with multiple FROM
    instructions — each instruction represents a new build stage. This allows you
    to have a stage where you do the heavy lifting of building the app inside a large'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'image with compilers and other build tools, but then you have another stage
    where you copy the compiled app into a slim image for production. The builder
    can even run different stages in parallel for faster builds.


    Figure 8.6 shows a high-level workflow. Stage 1 builds an image with all the required
    build and compilation tools. Stage 2 copies the app code into the image and builds
    it. Stage 3 creates a small production-ready image containing only the compiled
    app and anything needed to run it.


    ![](img/aae0230bf8529bd80767c4c780dca8d3_192_0.png)


    Figure 8.6


    Let’s look at an example!


    We’ll work with the code in the multi-stage folder of the book’s GitHub repo.
    It’s a simple Go app with a client and server'
