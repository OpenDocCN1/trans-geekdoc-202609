- pgno: 27
  md: '# 2: Docker and container-related standards and projects


    This chapter introduces you to Docker and some of the most important standards
    and projects shaping the container ecosystem. The goal is to lay some foundations
    that we’ll build on later chapters.


    This chapter has two main parts:


    +   - Docker

    - Container-related standards and projects


    # Docker


    Docker is at the heart of the container ecosystem. However, the term Docker can
    mean two things:


    +   1. The Docker platform

    2. Docker, Inc.


    The Docker platform is a neatly packaged collection of technologies for creating,
    managing, and orchestrating containers. Docker, Inc. is the company that created
    the Docker platform and continues to be the driving force behind developing new
    features.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'Let’s dive a bit deeper.


    Docker, Inc.


    Docker, Inc. is a technology company based out of Palo Alto founded by French-born
    American developer and entrepreneur Solomon Hykes. Solomon is no longer at the
    company.


    The company started as a platform as a service (PaaS) provider called dotCloud.
    Behind the scenes, dotCloud delivered their services on top of containers and
    had an in-house tool to help them deploy and manage those containers. They called
    this in-house tool Docker.


    The word Docker is a British expression meaning dock worker that refers to a person
    who loads and unloads cargo from ships.


    In 2013, dotCloud dropped the struggling PaaS side of the business, rebranded
    as Docker, Inc., and focussed on bringing Docker and containers to the world.


    # The Docker technology


    The Docker platform is designed to make it as easy as possible to build, ship,
    and run containers.'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'At a high level, there are two major parts to the Docker platform:


    +   * The CLI (client)

    * The engine (server)


    The CLI is the familiar `docker` command-line tool for deploying and managing
    containers. It converts simple commands into API requests and sends them to the
    engine.


    The engine comprises all the server-side components that run and manage containers.


    Figure 2.1 shows the high-level architecture. The client and engine can be on
    the same host or connected over the network.


    ![](img/aae0230bf8529bd80767c4c780dca8d3_29_0.png)


    Figure 2.1 Docker client and engine.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'In later chapters, you''ll see that the client and engine are complex and comprise
    a lot of small specialized parts. Figure 2.2 gives you an idea of some complexity
    behind the engine. However, the client hides all this complexity so you don''t
    have to care. For example, you type friendly docker commands into the CLI, the
    CLI converts them to API requests and sends them to the daemon, and the daemon
    takes care of everything else.


    ![](img/aae0230bf8529bd80767c4c780dca8d3_30_0.png)


    Let''s switch focus and briefly look at some standards and governance bodies.


    # Container-related standards and projects


    There are several important standards and governance bodies influencing the development
    of containers and the container ecosystem. Some of these include:'
  merge: -1
  img_proc: true
- pgno: 31
  md: '+   - The OCI

    - The CNCF

    - The Moby Project


    # The Open Container Initiative (OCI)


    The Open Container Initiative (OCI) is a governance council responsible for low-level
    container-related standards.


    It operates under the umbrella of the Linux Foundation and was founded in the
    early days of the container ecosystem when some of the people at a company called
    CoreOS didn''t like the way Docker was dominating the ecosystem. In response,
    CoreOS created an open standard called appc that defined specifications for things
    such as image format and container runtime. They also created a reference implementation
    called rkt (pronounced “rocket”).


    The appc standard did things differently from Docker and put the ecosystem in
    an awkward position with two competing standards.


    While competition is usually a good thing, competing standards are generally bad,
    as they generate confusion that slows down user adoption. Fortunately, the main
    players in the ecosystem came together and formed the OCI as a vendor-neutral'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'lightweight council to govern container standards. This allowed us to archive
    the appc project and place all low-level container-related specifications under
    the OCI governance.


    At the time of writing, the OCI maintains three standards called specs:


    +   - The image-spec

    - The runtime-spec

    - The distribution-spec


    We often use a rail tracks analogy when explaining the OCI standards:


    When the size and properties of rail tracks were standardized, it gave entrepreneurs
    in the rail industry confidence the trains, carriages, signaling systems, platforms,
    and other rail infrastructure they built would work with the standardized tracks
    — nobody wanted competing standards for track sizes.


    The OCI specifications did the same thing for the container ecosystem and it''s
    flourished ever since. Docker has also changed a lot since the formation of the
    OCI, and all modern versions of Docker implement all three OCI specs. For example:


    +   - The Docker builder (BuildKit) creates OCI compliant-images'
  merge: -1
  img_proc: true
- pgno: 33
  md: '+   - Docker uses an OCI-compliant runtime to create OCI-compliant containers


    +   - Docker Hub implements the OCI distribution spec and is an OCI-compliant
    registry


    Docker, Inc. and many other companies have people on the technical oversight board
    (TOB) of the O.


    The CloudNative Computing Foundation (CNCF)


    The Cloud Native Computing Foundation (CNCF) is another Linux Foundation project
    that is influential in the container ecosystem. It was founded in 2015 with the
    goal of “...advancing container technologies... and making cloud native computing
    ubiquitous”.


    Instead of creating and maintaining container-related specifications, the CNCF
    hosts important projects such as Kubernetes, containerd, Notary, Prometheus, Cilium,
    and lots more.


    When we say the CNCF hosts these projects, we mean it provides a space, structure,
    and support for projects to grow and mature. For example, all CNCF projects pass
    through the following three phases or stages:'
  merge: -1
  img_proc: true
- pgno: 34
  md: '+   - Sandbox

    - Incubating

    - Graduated


    Each phase increases a project’s maturity level by requiring higher standards
    of governance, documentation, auditing, contribution tracking, marketing, community
    engagement, and more. For example, new projects accepted as sandbox projects may
    have great ideas and great technology but need help and resources to create strong
    governance, etc. The CNCF helps with all of that.


    Graduated projects are considered ready for production and are guaranteed to have
    strong governance and implement good practices.


    If you look back to Figure 2.2, you’ll see that Docker uses at least two CNCF
    technologies — containerd and Notary.


    # The Moby Project


