  md: '# 11: Deploying apps with Docker Stacks


    Deploying and managing cloud-native microservices applications at scale is hard.
    Fortunately, Docker Stacks are here to help.


    I''ve split this chapter as follows:


    +   - Deploying apps with Docker Stacks – The TLDR

    - Build a Swarm lab

    - The sample app

    - Deploy the app

    - Manage the app


    # Deploying apps with Docker Stacks – The TLDR


    Docker Stacks combine Compose and Swarm to create a platform for easy deployment
    and management of multi-container apps on secure, highly available infrastructure.


    You build a swarm, define your apps in Compose files, and deploy and manage them
    with the `docker stack` command.


    From an architecture perspective, stacks are at the top of the Docker application
    hierarchy — they build on top of services,'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'which in turn build on top of containers, and they only run on swarms.


    ![](img/aae0230bf8529bd80767c4c780dca8d3_290_0.png)


    If you''ve been following along, you''ll already know Compose and Swarm and find
    Docker Stacks easy.


    # Build a Swarm lab


    This section shows you how to build a three-node swarm lab with a single manager
    and two workers. You can skip to the next section if you already have a swarm.


    You can build the lab in Multipass, Play with Docker, or just about any Docker
    Docker environment. However, I don''t recommend using Docker Desktop, as you only
    get a single swarm node.'
  merge: -1
  img_proc: true
