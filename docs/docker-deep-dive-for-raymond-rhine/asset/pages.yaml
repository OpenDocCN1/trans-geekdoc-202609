- pgno: 315
  md: 'The volume will still exist, and you''ll need to delete it manually.


    Congratulations. You’ve successfully deployed and managed a multi-container app
    using Docker Stacks. You also learned to deploy and manage apps declaratively
    by making all changes via the stack file (Compose file).


    # Clean up


    If you’ve been following along, you’ve deployed an app with two services, a network,
    and a volume.


    You can delete the stack with the **docker stack rm** command. However, be warned
    that it deletes the stack without asking for confirmation.


    ```

    $ docker stack rm ddd

    Removing service ddd_redis

    Removing service ddd_web-fe

    Removing network ddd_counter-net

    ```


    The command deleted the network and services but not the volume. This is because
    volume lifecycles are decoupled from containers and services, and you need to
    delete them manually.


    Run the following command on every swarm node that hosted a replica.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '```

    $ docker volume rm ddd_counter-vol

    ddd_counter-vol

    ```


    # Deploying apps with Docker Stacks – The Commands


    +   - docker stack deploy is the command you''ll run to deploy and and update
    stacks. You need to specify the name of the stack and the stack file. Docker expects
    the stack file to be called compose.yaml by default. docker stack ls lists all
    stacks on a swarm and shows the number of services each one has.

    - docker stack ps gives you detailed information about a stack. It tells you which
    nodes replicas are running on, which images they''re based on, and shows the desired
    state and current state of each service replica.

    - docker stack rm deletes a stack and doesn''t ask for confirmation.


    # Chapter Summary


    Stacks are Docker''s native solution for running cloud-native microservices applications
    on Swarm clusters. They offer a simple declarative interface for managing the
    entire lifecycle of applications and infrastructure.'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'You start with application code and infrastructure requirements — things like
    networks, ports, volumes, and secrets. You containerize the application and combine
    all the services and infrastructure definitions into a single declarative stack
    file. You set the number of replicas, as well as rollout and restart policies.
    Then, you use the `docker stack deploy` command to deploy the application from
    the stack file.


    You should also perform all updates declaratively by updating the stack file and
    redeploying the app.'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# 12: Docker and WebAssembly


    WebAssembly is driving the third of cloud computing, and Docker is evolving to
    take advantage.


    We built the first wave on virtual machines (VMs), the second on containers, and
    we''re building the third on WebAssembly. Each wave is driving smaller, faster,
    and more secure workloads, and all three will work together in the future of cloud
    computing.


    ![](img/aae0230bf8529bd80767c4c780dca8d3_318_0.png)


    In this chapter, you''ll write a simple WebAssembly application and use Docker
    to containerize and run it in a container. The goal is to introduce you to WebAssembly
    and show you how easy it is to work with Docker and WebAssembly together.'
