    # runc


    As previously mentioned, runc (pronounced “run see” and always written with a
    lowercase “r”) is the reference implementation of the OCI runtime-spec. Docker,
    Inc. was heavily involved in defining the spec and contributed the initial code
    for runc.


    runc is a lightweight CLI wrapper for libcontainer that you can download and use
    to manage OCI-compliant containers. However, it’s a very low-level tool and lacks
    almost all of the features and add-ons you get with the Docker Engine. Fortunately,
    as previously shown in Figure 5.2, Docker uses runc as its low-level runtime.
    This means you get OCI-compliant containers and the feature-rich Docker user experience.


    On the jargon front, we sometimes say that runc operates at the OCI layer, and
    we often refer to it as a low-level runtime.


