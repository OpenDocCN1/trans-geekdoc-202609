- pgno: 18
  md: '# 1: Containers from 30,000 feet


    Containers have taken over the world!


    In this chapter, you’ll learn why we have containers, what they do for us, and
    where we can use them.


    # The bad old days


    Applications are the powerhouse of every modern business. When applications break,
    businesses break.


    Most applications run on servers, and in the past, we were limited to running
    one application per server. As a result, the story went something like this:


    Every time a business needed a new application, it had to buy a new server. Unfortunately,
    we weren''t very good at modeling the performance requirements of new applications,
    and the IT departments had to guess. This often resulted in businesses buying
    very expensive servers with a lot more performance capability than the apps needed.
    After all, nobody wanted overpowered servers incapable of handling the app, resulting
    in unhappy customers and lost revenue. As a result, companies ended up with racks
    and racks of overpowered servers'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'operating as low as 5-10% of their potential capacity. This was a tragic waste
    of company capital and environmental resources!


    # Hello VMware!


    Amid all this, VMware, Inc. gave the world a gift — the virtual machine (VM).


    As soon as VMware came along, the world became much better. We finally had a technology
    that allowed us to safely run multiple business applications on a single server.


    It was a game-changer. Businesses could run new apps on the spare capacity of
    existing servers, spawning a golden age of maximizing the value of existing assets.


    # VMwarts


    But, and there’s always a but! As great as VMs are, they’re far from perfect.


    A feature of the VM model is every VM needing its own operating system (OS). Unfortunately,
    this has several drawbacks, including:


    +   - Every OS consumes CPU, RAM, and other resources we’d rather use on applications'
  merge: -1
  img_proc: true
- pgno: 20
  md: '+   - Every VM and OS needs patching

    - Every VM and OS needs monitoring


    VMs are also slow to boot and not very portable.


    # Hello Containers!


    While most of us were reaping the benefits of VMs, web scalers like Google had
    already moved on from VMs and were using containers.


    A feature of the container model is that every container shares the OS of the
    host it''s running. This means a single host can run more containers than VMs.
    For example, a host that can run 10 VMs might be able to run 50 containers, making
    containers far more efficient than VMs.


    Containers are also faster and more portable than VMs.


    # Linux containers


    Modern containers started in the Linux world and are the product of incredible
    work from many people over many years. For example, Google contributed many container-related
    technologies to the Linux kernel. It''s thanks to many contributions like these
    that we have containers today.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'Some of the major technologies behind modern containers include; kernel namespaces,
    control groups (cgroups), capabilities, and more.


    However, despite all this great work, containers were incredibly complicated,
    and it wasn''t until Docker came along that they became accessible to the masses.


    > Note: I know that many container-like technologies pre-date Docker and modern
    containers. However, none of them changed the world the way Docker has.


    # Hello Docker!


    Docker was the magic that made Linux containers easy and brought them to the masses.
    We''ll talk a lot more about Docker in the next chapter.


    # Docker and Windows


    Microsoft worked hard to bring Docker and container technologies to the Windows
    platform.


    At the time of writing, Windows desktop and server platforms support both of the
    following:


    +   - Windows containers'
  merge: -1
  img_proc: true
- pgno: 22
  md: '+   * Linux containers


    Windows containers run Windows apps and require a host system with a Windows kernel.
    Windows 10, Windows 11, and all modern versions of Windows Server natively support
    Windows containers.


    Windows systems can also run Linux containers via the WSL 2 (Windows Subsystem
    for Linux) subsystem.


    This means Windows 10 and Windows 11 are great platforms for developing and testing
    Windows and Linux containers.


    However, despite all the work developing Windows containers, almost all containers
    are Linux containers. This is because Linux containers are smaller and faster,
    and more tooling exists for Linux.


    # All of the examples in this edition of the book are Linux containers.


    # Windows containers vs Linux containers


    It''s vital to understand that containers share the kernel of the host they''re
    running on. This means containerized Windows apps need a host with a Windows kernel,
    whereas containerized Linux apps need a host with a Linux kernel.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'However, as mentioned, you can run Linux containers on Windows systems that
    have the WSL 2 backend installed.


    # What about Mac containers?


    There is no such thing as Mac containers. However, Macs are great platforms for
    working with containers, and I do all of my daily work with containers on a Mac.


    The most popular way of working with containers on a Mac is Docker Desktop. It
    works by running Docker inside a lightweight Linux VM on your Mac. Other tools,
    such as Podman and Rancher Desktop, are also great for working with containers
    on a Mac.


    # What about WebAssembly


    WebAssembly (Wasm) is a modern binary instruction set that builds applications
    that are smaller, faster, more secure, and more portable than containers. You
    write your app in your favorite language and compile it as a Wasm binary, and
    it''ll run anywhere you have a Wasm runtime.


    However, Wasm apps have many limitations, and we''re still developing many of
    the standards. As a result, containers remain the dominant model for cloud-native
    applications.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'The container ecosystem is also much richer and more mature than the Wasm ecosystem.


    As you''ll see in the Wasm chapter, Docker and the container ecosystem are adapting
    to work with Wasm apps, and you should expect a future where VMs, containers,
    and Wasm apps run side-by-side in most clouds and applications.


    This book is up-to-date with the latest Wasm and container developments.


    # What about Kubernetes


    Kubernetes is the industry standard platform for deploying and managing containerized
    apps.


    > **Terminology:** A containerized app is an application running as a container:
    We''ll cover this in a lot of detail later.


    Older versions of Kubernetes used Docker to start and stop containers. However,
    newer versions use *containerd*, which is a stripped-down version of Docker optimized
    for use by Kubernetes and other platforms.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'The important thing to know is that all Docker containers work on Kubernetes.


    Check out these resources if you need to learn Kubernetes.


    +   - **Quick Start Kubernetes**: This is ~100 pages and will get you up-to-speed
    with Kubernetes in **one day!**

    - **The Kubernetes Book.** This is the ultimate book for mastering Kubernetes.


    ![](img/aae0230bf8529bd80767c4c780dca8d3_25_0.png)


    I update both books annually to ensure they''re up-to-date with the latest and
    greatest developments in the cloud native ecosystem, including WebAssembly.


    # Chapter Summary'
  merge: -1
  img_proc: true
- pgno: 26
  md: We used to live in a world where every time the business needed a new application,
    we had to buy a brand-new server. VMware came along and allowed us to drive more
    value out of new and existing servers. However, following the success of VMware
    and hypervisors came a newer, more efficient, and portable virtualization technology
    called containers. However, containers were complex and hard to implement until
    Docker came along and made them easy. WebAssembly is powering a third wave of
    cloud computing, but Docker and the container ecosystem are evolving to work with
    WebAssembly, and the book has an entire chapter dedicated to Docker and WebAssembly.
  merge: -1
