    one of the reasons that single-host bridge networks are only useful for local
    development or very small applications.


    # Connecting to existing networks and VLANs


    The ability to connect containerized apps to external systems and physical networks
    is important. A common example is partially containerized apps where the parts
    running in containers need to be able to communicate with the parts not running
    in containers.


    The built-in MACLAN driver (transparent if you''re using Windows containers) was
    created with this in mind. It gives every container its own IP and MAC address
    on the external physical network, making each one look, smell, and feel like a
    physical server or VM. This is shown in Figure 13.12.'
  merge: -1
  img_proc: true
- pgno: 360
  md: '![](img/aae0230bf8529bd80767c4c780dca8d3_360_0.png)


    Figure 13.12 - MACVLAN driver making containers visible on external networks


    On the positive side, MACVLAN performance is good as it doesn’t require port mappings
    or additional bridges. However, you need to run your host NICs in promiscuous
    mode, which isn’t allowed on many corporate networks and public clouds. So, MACVLAN
    will work on your data center networks if your network team allows promiscuous
    mode, but it probably won’t work on your public cloud.


    Let’s dig a bit deeper with the help of some pictures and a hypothetical example.
    This example will only work if your host NIC is in promiscuous mode on a network
    that allows it. It also requires an existing VLAN 100. You can adapt it if the
    VLAN config on your physical network is different. You can follow along without
    the VLANs, but you won’t get the full experience.'
  merge: -1
  img_proc: true
- pgno: 361
  md: 'Assume you have the network shown in Figure 13.13 with two VLANs:


    ![](img/aae0230bf8529bd80767c4c780dca8d3_361_0.png)


    Next, you add a Docker host and connect it to the network.


    ![](img/aae0230bf8529bd80767c4c780dca8d3_361_1.png)


    Now comes the requirement to attach a container to VLAN 100. To do this, you create
    a new Docker network with the `macvlan` driver and configure it with all of the
    following:'
  merge: -1
  img_proc: true
- pgno: 362
  md: "+   - Subnet info\n- Gateway\n- Range of IPs it can assign to containers\n\
    - Which of the host’s interfaces or sub-interfaces to use\n\nRun the following\
    \ command to create a new MACLAN network called **macvlan100** that will connect\
    \ containers to VLAN 100. You may need to change the name of the parent interface\
    \ to match the name on your system. For example, changing **-o parent=eth0.100**\
    \ to **-o parent=enp0s1.100**. The parent interface must be connected to the VLAN,\
    \ and you'll need to type `exit` if you’re still logged on to the container from\
    \ the previous example.\n\n```\ndocker network create -d macvlan \\\n  --subnet=10.0.0.0/24\
    \ \\\n  --ip-range=10.0.0.0/25 \\\n  --gateway=10.0.0.1 \\\n  -o parent=eth0.100\
    \ \\<----- Make sure this matches your\n  macvlan100\n```\n\nDocker will create\
    \ the **macvlan100** network and a new sub-interface on the host called **eth0.100@eth0**.\
    \ The config now looks like this."
  merge: -1
  img_proc: true
- pgno: 363
  md: '![](img/aae0230bf8529bd80767c4c780dca8d3_363_0.png)


    # Figure 13.15


    The MACVLAN driver creates standard Linux sub-interfaces and tags them with the
    ID of the VLAN they will connect to. In this example, we''re connecting to VLAN
    100, so we tag the sub-interface with .100 (-o parent=eth0.100).


