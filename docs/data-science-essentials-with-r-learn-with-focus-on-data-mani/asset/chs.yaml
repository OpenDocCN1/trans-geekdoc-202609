  \n![](img/fm1.png)\n\n# 第 8 章 特征工程\n\n### 简介\n\n特征是机器学习模型的基本组成部分，以算法易于处理的数值格式表示原始数据。然而，将原始数据转换为特征的方法有无数种，特征的选择会显著影响机器学习模型的准确性和有效性。\n\
  \n在本章中，我们将探索特征工程的艺术，它涉及从数据中选择和转换最相关的特征，以提高机器学习模型的性能。机器学习模型中使用的特征数量在其性能中起着至关重要的作用。如果信息量大的特征不足，模型可能难以完成手头的任务。\n\
  \n另一方面，拥有过多特征，尤其是无关特征，会使模型更加复杂且难以训练。因此，在特征数量及其与任务的相关性之间取得平衡至关重要。\n\n### 结构\n\n在本章中，我们将探索处理数值数据和分类数据的各种技术。\n\
  \n*   理解特征工程\n*   转换数值数据\n    *   Z-score 标准化\n    *   最小-最大缩放\n    *   分箱\n   \
  \ *   特征裁剪\n*   处理分类数据\n    *   标签编码\n    *   独热编码\n    *   虚拟变量编码\n\n### 目标\n\n\
  在本章中，我们将讨论特征工程的基本概念，即为有效的机器学习准备数据的艺术。您将学习如何识别数据中的关键特征，并使用分箱和特征缩放等技术来提取它们。此外，您将学习如何对分类数据进行编码，并基于现有数据创建新特征。在本章结束时，您将具备为机器学习准备数据的必要技能，从而做出更准确的预测。\n\
  \n### 理解特征工程\n\n将特征工程视为一种协助机器学习模像您自己一样理解数据集的方式。正如艺术家雕去大理石块中不必要的部分以呈现杰作，特征工程仔细选择、改变并创建数据的新侧面，以揭示其隐藏的模式。\n\
  \n特征工程旨在调整和改进模型中的预测变量，以便模型能更好地发现预测变量与响应变量之间有意义的关系。“工程”一词暗示了一种有目的地修复性能问题和改进预测的方法。知道在模型中表示特征有不同的方式，并意识到某些方式比其他方式效果更好，这是特征工程的核心。因此，特征工程成为制作优化模型有效性的数据表示的实践。它承认我们向模型呈现数据的方式会显著影响其预测能力。重要的是要注意，多种因素共同影响模型的有效性。例如，如果一个预测变量与响应变量缺乏有意义的关系，那么该预测变量的表示方式就变得无关紧要。\n\
  \n![](img/Figure8.1.png)\n\n图 8.1：特征工程在典型机器学习工作流更广泛背景中的位置\n\n前图展示了特征工程如何融入典型机器学习工作流的大局中。它的核心是从原始数据创建特征。outlined\
  \ process may not strictly follow a sequence. Modifying the features during the\
  \ training phase may be necessary based on insights gained regarding which features\
  \ are effective and which are not.\n\n特征工程可能会带来一些挑战，因为它依赖于数据分析技能、领域专业知识和一定程度的直觉的结合。特征创建中常见的陷阱是倾向于直接使用现成的数据，而不咨询相关专家、进行彻底研究或进行探索性思考。忽视这些关键步骤，可能会导致忽略本可显著影响模型性能的重要预测变量。\n\
  \n在深入进行特征转换之前，彻底探索和清理数据集至关重要。这一初始步骤包括：\n\n*   检查数据：检查几行数据以了解其结构、内容和潜在问题。\n*   检查基本统计量：计算描述性统计量（例如均值、中位数、标准差）以识别异常并发现初步模式。\n\
  *   可视化数据：创建散点图、直方图和其他可视化图表，以识别从数值摘要中可能不明显的模式和异常。可视化应贯穿转换过程始终，用于评估变更的影响并验证假设。\n\n\
  众所周知的谚语“垃圾进，垃圾出”在机器学习中同样适用。这意味着生成模型的质量在很大程度上取决于输入数据。想象一下你在建造一座城堡。坚固、放置得当的砖块使施工过程顺利，最终城堡坚固耐用。但如果你使用歪斜、形状不规则的砖块，你将需要更复杂、更精巧的设计才能达到同样的稳定性。同样，在机器学习中，特征的质量直接影响你构建的模型。好的特征，如信息丰富且相关的数据，使训练模型更容易，并产生更准确、更高效的模型。相反，差的特征需要复杂的模型，且往往表现不佳。\n\
  \n在为机器学习模型准备数据时，我们经常对其进行转换，使其更兼容、更有信息量。这个过程称为数据转换，是特征工程的关键部分。以下是转换特征的主要原因：\n\n*\
  \   确保数据兼容性\n\n\n\n#### 数值数据转换\n\n##### 数值表示\n机器学习算法依赖数值计算。因此，将非数值特征（如分类变量或文本数据）转换为数值表示，对于兼容性而言是必要的。\n\
  \n##### 提升数据质量\n\n###### 减少噪声\n应用分箱或平滑技术可减少噪声，使模式更加明显。\n\n###### 处理缺失值\n使用插补技术（例如均值、中位数、众数或更复杂的方法）填补缺失数据点，或策略性地移除它们。\n\
  \n##### 改进模型性能\n\n###### 特征缩放\n将特征带到相似的尺度，以防止某些特征主导其他特征，特别是在对特征幅度敏感的算法中（例如基于距离的算法）。\n\
  \n**技术**：归一化和标准化。\n\n###### 处理偏态分布\n转换偏态分布（例如收入、寿命）以提高模型准确性并减少异常值的影响。\n\n**技术**：对数变换和幂变换。\n\
  \n##### 提取有意义的信息\n\n###### 创建衍生特征\n组合或转换现有特征，以捕获可能与机器学习模型更相关的新信息或关系。\n\n---\n\n\
  ### 转换数值数据\n\n假设我们要预测客户是否会点击网站上展示的特定广告。两个关键特征可能是：\n\n*   **广告展示次数**：范围可能从 1 到 1000，数字越大表示曝光越多。\n\
  *   **用户上次点击广告以来的时间**：数值可能从几分钟到几个月不等，时间越短表示兴趣越高。\n\n原始数字固然好，但它们并不能讲完整的故事。对机器学习算法而言，这些只是两列数字。以下是转换它们如何释放隐藏洞察的方法：\n\
  \n*   **展示次数对数缩放**：用户看到广告 10 次与 1000 次的差异，远大于 500 次与 600 次的差异。对数缩放压缩了展示次数的大范围，使较小的变化对模型更具影响力。\n\
  *   **上次点击时间分箱**：将时间分组为“一天内”、“1-3 天”和“一周以上”等桶，可捕捉用户兴趣随时间的变化。这有助于模型理解近期点击比久远点击更相关。\n\
  \n转换数值变量不仅仅是操纵数字；而是利用我们对问题和数据的理解，以一种对模型有意义的方式呈现它们。这就像说算法的语言，让它们通过我们的眼睛看世界并做出更好的预测。\n\
  \n转换数值数据没有放之四海而皆准的方法。最佳技术取决于您的特定数据集和模型需求。实验、探索，并不断自问：我如何引导这些数字揭示我数据中的真实故事？\n\n**特征缩放**确保每个特征都对模型的学习过程有意义地贡献，无论其原始尺度如何，从而更准确地表征潜在数据模式。\n\
  \n---\n\n#### Z-score 缩放\n\n**Z-score 缩放（标准化）**将数值数据转换为均值为 0、标准差为 1 的标准化分布。该过程包括从每个数据点中减去数据集的均值，然后除以标准差。这确保了生成的分布以\
  \ 0 为中心，并以距离均值的标准差数来表示。计算 z-score 的公式为：\n\n![](img/EQ-1.jpg)\n\n其中 `x'` = 标准化值（z-score），`x`\
  \ = 原始数据点，`μ` = 数据集的均值，`σ` = 数据集的标准差。\n\n在我们的讨论中，我们将使用来自知名 UCI ML 存储库的 **阿尔及利亚森林火灾数据集**。在这里，每个实例都与描述天气条件、火灾天气指数指标的特定属性相关联，以及指示特定观测是否导致森林火灾的分类标签。\n\
  \n温度服从正态分布，范围从 22 到 42 摄氏度。在此场景中，大多数温度值分布在整个范围内，提供了平衡的数据表示。让我们可视化 `Temperature`\
  \ 列的分布：\n\n```r\n# Distribution of the Temperature\nggplot(forest_fires, aes(x =\
  \ Temperature)) +\n  geom_histogram(binwidth = 1, fill = \"steelblue3\", color =\
  \ \"black\", boundary = 0) +\n  labs(x = \"Temperature (in Celsius Degrees)\",\n\
  \       y = \"Frequency\") +\n  theme_bw()\n```\n\n![](img/Figure8.2.png)\n\n**Figure\
  \ 8.2: Distribution of temperature**\n\n现在，我们创建一个名为 `z_score_scaling` 的函数，该函数接受数值向量\
  \ `x` 作为输入。该函数使用 Z-score 缩放公式将 `x` 的值转换为标准化分布。然后，我们将 `z_score_scaling` 应用于 `Temperature`\
  \ 列。\n\n```r\n# Z-Score scaling function\nz_score_scaling <- function(x) {\n  (x\
  \ - mean(x)) / sd(x)\n}\n\n# Apply Z-Score scaling to the Temperature column\nforest_fires$Temperature_Z_Score\
  \ <- z_score_scaling(forest_fires$Temperature)\n\n# Distribution of the Scaled Temperature\n\
  ggplot(forest_fires, aes(x = Temperature_Z_Score)) +\n  geom_histogram(binwidth\
  \ = 1, fill = \"steelblue3\", color = \"black\", boundary = 0) +\n  labs(x = \"\
  Scaled Temperature (Z-Scores)\",\n       y = \"Frequency\") +\n  theme_bw()\n```\n\
  \n![](img/Figure8.3.png)\n\n**Figure 8.3: Distribution of the scaled temperature\
  \ (Z-scores)**\n\nZ-score 缩放过程将原始温度值转换为均值为 0、标准差为 1 的分布。正 z-score 表示温度高于平均值，而负 z-score\
  \ 表示低于平均值。例如，z-score 为 2 表示该值比平均值高 2 个标准差。z-score 为 0 意味着温度恰好在平均值处。注意，它对异常值敏感；极端值可能会不成比例地影响均值和标准差。\n\
  \n---\n\n#### Min-max 缩放\n\n**Min-max 缩放（归一化）**将特征转换到标准范围，通常在 0 和 1 之间。Min-max 缩放通过从每个数据点减去特征的最小值，然后除以最大值和最小值的差值来工作。数学上可表示为：\n\
  \n```\nx' = (x - xmin) / (xmax - xmin)\n```\n\n其中 `x'` 是缩放后的值，`x` 是原始值，`xmin` 代表特征的最小值，`xmax`\
  \ 代表特征的最大值。\n\n当特征分布大致均匀且数据中不存在显著异常值时，这种缩放方法效果特别好。极端值会显著拉伸缩放范围，将大多数数据点压缩到一个狭窄区域。如果特征分布偏态或有长尾，min-max\
  \ 缩放可能不是最佳选择。\n\n让我们定义一个名为 `min_max_scaling` 的函数，它接受一个数据向量作为输入并返回数据的缩放版本。然后，我们通过对温度值应用\
  \ min-max 缩放来创建一个新列 `Temperature_Scaled`，将其转换为 0 到 1 之间的标准化尺度。\n\n```r\n# Min-Max\
  \ scaling function\nmin_max_scaling <- function(x) {\n  (x - min(x)) / (max(x) -\
  \ min(x))\n}\n\n# Apply Min-Max scaling to the Temperature column\nforest_fires$Temperature_Scaled\
  \ <- min_max_scaling(forest_fires$Temperature)\n\n# Distribution of the Scaled Temperature\n\
  ggplot(forest_fires, aes(x = Temperature_Scaled)) +\n  geom_histogram(binwidth =\
  \ 0.125, fill = \"steelblue3\", color = \"black\", boundary = 0) +\n```\n\n\n\n\n\
  #### 分箱\n\n数值数据分箱是指将连续变量转换为离散的类别或区间，从而将其从定量属性变为定性属性。此过程可以识别线性模型可能遗漏的特征与目标变量之间潜在的非线性关系。此外，分类特征比数值特征更易于解释和说明。然而，分箱固有地涉及粒度的损失。请仔细权衡细节与泛化之间的取舍。分箱过少会过度简化模式；分箱过多会使分析复杂化并降低模型的泛化能力。您可以尝试不同的分箱大小并可视化结果，以确保分割的意义性。\n\
  \n当选择对数值特征应用分箱时，必须明确定义边界设置并确定分箱类型。两种常见的分箱方法包括：\n\n*   等宽分箱\n*   分位数分箱\n\n##### 等宽分箱\n\
  \n等宽分箱是一种简单直接的分箱技术，它将数值特征的范围划分为宽度相等的箱。它通常是一种简单直观的方法，但也必须考虑其对不同数据分布的适用性。等宽分箱可能对异常值敏感，因为极端值会不成比例地影响分箱边界。现在，我们将把连续的温度值分为四个箱。\n\
  \n```r\n# 定义分箱数量\nnum_bins <- 4\n\n# 为温度数据创建分箱\nforest_fires$temp_bins <- cut(forest_fires$Temperature,\
  \ breaks = num_bins, labels = FALSE)\n\n# 将 temp_bins 转换为因子\nforest_fires$temp_bins\
  \ <- as.factor(forest_fires$temp_bins)\n```\n\n此处，`cut()` 函数根据先前定义的 `num_bins` 为\
  \ 'Temperature' 特征创建分箱。在函数调用中，`breaks=num_bins` 表示沿温度轴所需的分割数量。`labels=FALSE` 意味着生成的水平接收默认的整数分配（1,\
  \ 2, ..., n_bins）。`temp_bins` 列中的值被转换为因子。\n\n```r\n# 带分箱线的温度分布\nggplot(forest_fires,\
  \ aes(x = Temperature, fill = temp_bins)) +\n  geom_histogram(binwidth = 1, color\
  \ = \"black\", boundary = 0) +\n  geom_vline(xintercept = seq(min(forest_fires$Temperature),\
  \ max(forest_fires$Temperature), length.out = num_bins + 1),\n             linetype\
  \ = \"dashed\", color = \"darkred\", linewidth = 0.8) +\n  scale_fill_brewer(palette\
  \ = \"Set2\") +\n  labs(x = \"Temperature\",\n       y = \"Frequency\",\n      \
  \ fill = \"Temperature Bins\") +\n  theme_bw()\n```\n\n![](img/Figure8.5.png)\n\n\
  图 8.5：等宽分箱下的温度分布\n\n上图显示了分为四个箱的温度分布。虚线垂直线表示温度分箱的边界。应用 Set2 调色板以直观地区分各个箱。\n\n#####\
  \ 分位数分箱\n\n虽然等宽分箱将特征范围划分为大小均匀的区间，但分位数分箱采取了不同的方法，确保每个箱包含大致相同数量的观测值。这使其特别适合处理偏态或分布不规则的数据。它处理范围内密度变化的数据，确保每个箱具有相似的重要性。下面的代码对\
  \ Temperature 列执行分位数分箱。\n\n```r\n# 对 Temperature 列执行分位数分箱\nforest_fires$temperature_quantile_bins\
  \ <- cut(forest_fires$Temperature,\n                                           \
  \   breaks = quantile(forest_fires$Temperature),\n                             \
  \                 labels = FALSE,\n                                            \
  \  include.lowest = TRUE)\n\n# 将分位数分箱转换为因子\nforest_fires$temperature_quantile_bins\
  \ <- as.factor(forest_fires$temperature_quantile_bins)\n```\n\n此处，通过设置 `breaks=quantile(forest_fires$Temperature)`，我们确保每个类别中包含相同数量的样本。下图显示了分位数分箱下的温度分布。\n\
  \n```r\n# 创建带分位数分箱的直方图\nggplot(forest_fires, aes(x = Temperature, fill = temperature_quantile_bins))\
  \ +\n  geom_histogram(binwidth = 1, color = \"black\", boundary = 0) +\n  geom_vline(xintercept\
  \ = quantile(forest_fires$Temperature),\n             linetype = \"dashed\", color\
  \ = \"darkred\", linewidth = 0.8) +\n  scale_fill_brewer(palette = \"Set2\") +\n\
  \  labs(x = \"Temperature\",\n       y = \"Frequency\",\n       fill = \"Quantile\
  \ Bins\") +\n  theme_bw()\n```\n\n![](img/Figure8.6.png)\n\n图 8.6：分位数分箱下的温度分布\n\n\
  #### 特征截断\n\n在处理数据中的极端异常值时，请考虑实施特征截断以减轻其影响。它涉及将高于或低于定义阈值的特征值进行封顶，从而在不完全移除它们的情况下降低其影响力。例如，您可以将所有超过\
  \ 5 毫米的 \"Rain\" 值进行截断，确保它们被封顶在 5。另一种有效的方法是使用标准差 (σ) 等度量来定义阈值。示例：截断均值 +3σ 或 -3σ\
  \ 以外的值。请注意，特征截断是管理异常值的工具，但理解其成因并选择适当的方法对于稳健的模型开发至关重要。图 8.7 显示了 rain 列的原始分布：\n\n\
  ```r\n# Rain 的分布\nggplot(forest_fires, aes(x = Rain)) +\n  geom_histogram(binwidth\
  \ = 1, fill = \"steelblue3\", color = \"black\", boundary = 0) +\n  labs(x = \"\
  Rain (in mm)\",\n       y = \"Frequency\") +\n  theme_bw()\n```\n\n![](img/Figure8.7.png)\n\
  \n图 8.7：Rain 的分布\n\n让我们创建一个新列 `Rain_Capped`，将原始 `Rain` 列中超过 5 的任何值替换为封顶值 5。\n\n\
  ```r\n# 创建列 Rain_Capped\nforest_fires <- forest_fires %>%\n  mutate(Rain_Capped\
  \ = ifelse(Rain > 5, 5, Rain))\n\n# 截断后 Rain 的分布\nggplot(forest_fires, aes(x = Rain_Capped))\
  \ +\n  geom_histogram(binwidth = 1, fill = \"steelblue3\", color = \"black\", boundary\
  \ = 0) +\n  labs(x = \"Rain (in mm)\",\n       y = \"Frequency\") +\n  theme_bw()\n\
  ```\n\n![](img/Figure8.8.png)\n\n图 8.8：Rain 的分布（已截断）\n\n### 处理分类数据\n\n分类变量代表具有有限个不同值的不同类别或标签。这些值可能传达关于定性属性的信息，例如产品类型、客户细分或季节。将分类变量转换为数值对于机器学习至关重要，因为大多数机器学习算法专门设计用于处理和分析数值数据。它们使用固有基于数字的数学运算、距离计算和统计分析。数值表示使它们能够捕捉数据点之间有意义的差异和相似性。\n\
  \n#### 标签编码\n\n标签编码是将分类变量转换为数值的一种简单而有效的方法。它涉及为变量中的每个类别分配唯一的整数标签。\n\n让我们创建一个示例数据框\
  \ `customer_category`，包含两列：`customer_id` 和 `customer_segment`。`customer_segment`\
  \ 列代表不同的客户类别，如首次购买者、忠诚客户和流失购买者。\n\n```r\n##### 创建示例数据框\ncustomer_category <- data.frame(\n\
  \  customer_id = 1:7,\n```\n\n\n\n\n* `customer_segment = c(\"First-time purchasers\"\
  , \"Loyal customers\", \"Loyal customers\", \"Lapsed purchasers\", \"First-time\
  \ purchasers\", \"Lapsed purchasers\", \"Loyal customers\")`\n* `)`\n\n接下来，我们定义一个名为\
  \ `label_encode` 的标签编码函数。该函数接受一个向量 `x` 作为输入，识别向量中的唯一水平，并为每个唯一水平分配数字标签。然后，我们通过将定义的\
  \ `label_encode` 函数应用于 `customer_segment` 列来创建一个名为 `customer_segment_encoded` 的新列。\n\
  \n* `# 定义标签编码函数`\n* `label_encode <- function(x) {`\n* `levels <- unique(x)`\n*\
  \ `as.numeric(factor(x, levels = levels))`\n* `}`\n* `# 创建一个带有标签编码的新列`\n* `customer_category\
  \ <- customer_category %>%`\n* `mutate(customer_segment_encoded = label_encode(customer_segment))`\n\
  \n| customer_id | customer_segment | customer_segment_encoded |\n| --- | --- | ---\
  \ |\n| 1 | First-time purchasers | 1 |\n| 2 | Loyal customers | 2 |\n| 3 | Loyal\
  \ customers | 2 |\n| 4 | Lapsed purchasers | 3 |\n| 5 | First-time purchasers |\
  \ 1 |\n| 6 | Lapsed purchasers | 3 |\n| 7 | Loyal customers | 2 |\n\n表 8.1：客户细分的标签编码\n\
  \n在将分类变量包含的嵌入信息纳入模型时，识别这些变量是否具有特定顺序至关重要。对于有序因子，您可以利用另一种称为**序数编码**的技术。它以反映类别顺序的方式为类别分配数字。与无序因子（其中数字仅作为标签）不同，序数编码确保分配的数字代表类别之间有意义的顺序。\n\
  \n例如，考虑分为“低”、“中”、“高”的客户满意度等级，表示不同程度的满意度。在这种情况下，序数编码会为这些满意度等级分配数值以反映其顺序。例如，“低”可分配值\
  \ 1，“中”分配值 2，“高”分配值 3。这种编码确保数字标签捕捉满意度等级的固有顺序，即较高的数值对应较高的满意度。这种方法使机器学习模型能够理解并利用客户满意度等级中的序数关系，从而提高其基于数据有序性质进行预测或分类的能力。\n\
  \n#### 独热编码\n\n此技术为名义特征中的每个唯一水平或类别创建一个新的二元变量。每个二元变量充当一个标志，指示特定类别的存在 (1) 或不存在 (0)。当处理类别之间没有固有顺序的分类变量时，独热编码特别有用。它确保模型不会通过向数字标签赋予非预期的重要性而误解数据。\n\
  \n您可以使用 `fastDummies` 包中的 `dummy_cols()` 对 `customer_segment` 列执行独热编码，如下所示：\n\n\
  * `library(fastDummies)`\n* `# 使用 dummy_cols() 执行独热编码`\n* `customer_category_encoded\
  \ <- dummy_cols(customer_category, select_columns = \"customer_segment\")`\n\n|\
  \ customer_id | customer_segment | customer_segment_First-time purchasers | customer_segment_Lapsed\
  \ purchasers | customer_segment_Loyal customers |\n| --- | --- | --- | --- | ---\
  \ |\n| 1 | First-time purchasers | 1 | 0 | 0 |\n| 2 | Loyal customers | 0 | 0 |\
  \ 1 |\n| 3 | Loyal customers | 0 | 0 | 1 |\n| 4 | Lapsed purchasers | 0 | 1 | 0\
  \ |\n| 5 | First-time purchasers | 1 | 0 | 0 |\n| 6 | Lapsed purchasers | 0 | 1\
  \ | 0 |\n| 7 | Loyal customers | 0 | 0 | 1 |\n\n表 8.2：客户细分的独热编码\n\n表 8.2 显示 `dummy_cols()`\
  \ 为 `customer_segment` 列中的每个唯一类别创建了二元列。\n\n#### 虚拟编码\n\n对于虚拟编码，我们为每个类别创建一个二元变量，但除去一个类别，该类别将成为参考类别。这消除了**多重共线性**的可能性，这是一种当变量高度相关时可能出现的统计问题。\n\
  \n要使用 `dummy_cols()` 应用虚拟编码，只需将 `remove_first_dummy` 参数设置为 `TRUE`，如下所示。移除一个虚拟变量有助于防止编码特征之间的线性相关性。\n\
  \n* `# 执行虚拟编码`\n* `customer_category_encoded <- dummy_cols(customer_category, select_columns\
  \ = \"customer_segment\", remove_first_dummy = TRUE)`\n\n| customer_id | customer_segment\
  \ | customer_segment_Lapsed purchasers | customer_segment_Loyal customers |\n| ---\
  \ | --- | --- | --- |\n| 1 | First-time purchasers | 0 | 0 |\n| 2 | Loyal customers\
  \ | 0 | 1 |\n| 3 | Loyal customers | 0 | 1 |\n| 4 | Lapsed purchasers | 1 | 0 |\n\
  | 5 | First-time purchasers | 0 | 0 |\n| 6 | Lapsed purchasers | 1 | 0 |\n| 7 |\
  \ Loyal customers | 0 | 1 |\n\n表 8.3：客户细分的虚拟编码\n\n前面的表格显示，由于 `remove_first_dummy\
  \ = TRUE` 设置，它保留了“流失购买者”和“忠诚客户”的虚拟列，而丢弃了“首次购买者”的虚拟列。虚拟编码在解决独热编码中可能出现的多重共线性问题的同时，有效地表示了分类数据。\n\
  \n### 结论\n\n特征工程是一个创造性的过程，需要理解数据以及您试图解决的问题。它是一个迭代且耗时的过程。请尝试不同的技术，以找到最适合您特定数据集和模型的方法。目标是创建能够有效代表数据中潜在模式和关系的特征，从而带来更好的模型性能和洞察。特征的质量通常比算法的选择对机器学习模型性能有更显著的影响。本章广泛涵盖了数值数据转换，探讨了\
  \ Z-score 标准化、最小-最大缩放和分箱方法，并提供了关于何时以及如何应用这些技术的见解。处理分类数据是一个关键方面，本章全面涵盖了各种方法，包括标签编码、独热编码和虚拟编码。下一章将探讨数据科学所需的统计学和概率论基本原理。\n\
  \n# 第 9 章 统计学与概率论\n\n### 简介\n\n数据科学的本质在于从海量结构化和非结构化信息中发现有价值的洞察。统计学构成了该领域的基础框架，为分析和解释数据提供了坚实的基础。它提供了理解和解释机器学习模型结果所必需的基本语法和词汇。但统计学不仅仅是理解机器学习输出。通过描述性统计对数据进行汇总和可视化，您可以清晰地描绘趋势、异常值和变量之间的关系。另一方面，概率论关注量化不确定性和随机现象。通过将概率推理纳入分析过程，您可以对复杂系统建模、预测未来行为、优化性能指标，并从海量数据集中得出可操作的洞察。\n\
  \n### 结构\n\n在本章中，我们将涵盖以下主题：\n\n* 总体抽样\n  * 简单随机抽样\n  * 分层抽样\n* 描述性统计\n  * 集中趋势度量\n\
  \  * 离散程度度量\n* 概率论\n* 推断统计\n* 统计假设检验\n* 协方差与相关性\n\n### 目标\n\n\n\n### 统计与概率基础\n\n\
  虽然统计学和概率论是广泛的领域，无法在单个章节中完全涵盖，但本章旨在介绍理解和使用机器学习模型所必需的基本概念。您将学习如何从总体中选择有代表性的样本，并计算各种集中趋势和离散程度的度量。您还将学习如何进行统计假设检验并计算变量间的相关性。\n\
  \n#### 总体抽样\n\n总体是您感兴趣研究的整个个体或事物群体。其规模可以是任何大小，从一个班级里的一小群学生到一个国家的所有居民。样本是根据特定抽样策略从总体中抽取的有限子集，用于通过研究样本来估计总体特征。但为什么不直接研究整个总体呢？虽然理论上是理想的，但这通常是不切实际、不可行且没有必要的。\n\
  \n让我们考虑制造工厂中的质量控制流程，具体关注智能手机的生产。制造商面临着在大型生产线中确保每部智能手机质量的挑战。检查每一个单元既耗时又消耗大量资源。因此，公司决定采用基于样本的质量控制策略。\n\
  \n设想这样一个场景：制造商从 50,000 台的生产批次中随机抽取 500 部智能手机作为样本。他们评估该样本以确定整个批次的整体质量。样本显示 95% 的手机符合质量标准。\n\
  \n然而，这一结论的有效性取决于各种样本考量因素。首要的是样本量。500 是否是 50,000 部智能手机的充分代表性子集？如果样本量太小，可能无法准确反映整个批次的真实质量。反之，过大的样本可能会产生不必要的成本，而不会提供实质性更准确的结果。\n\
  \n样本选择的方法也至关重要。如果智能手机是在没有系统方法的情况下随意挑选的，某些缺陷或问题可能会被忽视，导致对整体产品质量的不准确表征。此外，质量评估中使用的检验标准也很关键。如果标准过于严格或宽松，都会影响对智能手机是否符合质量标准的分类。\n\
  \n在产量高、资源有限的制造业中，有效的样本考量对于在无需检查每个单元的情况下做出明智的产品质量决策至关重要。\n\n##### 简单随机抽样\n\n简单随机抽样（SRS）确保总体中的每个元素都具有等概率的机会被选入样本。这确保了样本能准确代表整个总体，最小化偏差并提高可靠性。在此方法中，抽样可以是有放回或无放回的。\n\
  \n###### 有放回抽样\n\n当我们进行有放回抽样时，每次抽取都独立于其他抽取。这意味着一个个体的选择不会影响或改变后续抽取中选择另一个个体的机会。在整个抽样过程中，选择任何特定个体的概率保持不变。例如，如果我们随机选择一名学生，记录其学习习惯，然后将其放回总体，那么在下一次抽取中再次选择该同一学生的机会与之前相同，不受先前选择的影响。\n\
  \n```\n# Generate a population of 100 students\npopulation <- 1:100\n\n# Select\
  \ a simple random sample of 5 students with replacement\nsample_with_replacement\
  \ <- sample(population, size = 5, replace = TRUE)\n\n# Display the sample\nprint(sample_with_replacement)\n\
  ## 68 19 67 90 68\n```\n\n`sample()` 函数从指定的总体向量中选择简单随机样本。`size` 参数指示要选择的元素数量，`replace\
  \ = TRUE` 表示进行有放回抽样。这意味着每次选择后，被选中的学生会被放回合格候选者池中，以供下一次抽取。请注意，由于采用有放回抽样，同一个学生 ID 可能在样本中出现多次。\n\
  \n在上述示例中，选择是独立的。每个学生都是从整个总体中随机选取的，每次选取后，该学生被放回总体，确保其存在或缺席不影响后续的抽取。\n\n###### 无放回抽样\n\
  \n相反，在无放回抽样中，选择之间不是独立的。第一次抽取的结果会影响后续抽取的合格候选者池。一旦选中一个个体，他们就会从总体中移除，从而改变下一次抽取的概率。先前选择的结果会影响样本的构成。例如，如果我们随机选择学生，记录他们的学习习惯，并不将他们放回总体，那么下一次抽取的合格候选者池就会减少。再次选择同一学生的机会被消除，剩余个体的概率会根据第一次选择进行调整。\n\
  \n```\n# Select a simple random sample of 5 students without replacement\nsample_without_replacement\
  \ <- sample(population, size = 5, replace = FALSE)\n\n# Display the sample\nprint(sample_without_replacement)\n\
  ## 76 50 11 25 72\n```\n\n这里，`replace = FALSE` 表示进行无放回抽样。这意味着一旦学生被选中，他们就会从后续抽取的合格候选者池中移除。因为采用无放回抽样，每个学生\
  \ ID 在样本中只出现一次。\n\n当进行无放回抽样时，选择不是独立的。每个学生都是从总体中随机选取的，但一旦被选中，他们就会从后续抽取的合格候选者池中移除。这改变了剩余个体的概率，并在选择之间引入了依赖性。\n\
  \n##### 分层抽样\n\n分层抽样是另一种抽样技术，其中总体根据特定特征被划分为不同的子群（或层），然后从每个层中随机收集样本。这种方法确保了总体中所有相关子群都有代表性，从而得出更准确、更可靠的分析。\n\
  \n在分层抽样中，总体根据特定特征（例如年龄、性别、收入水平）被划分为互不重叠的层。每个层代表总体内的一个同质子群。创建层后，从每个层中独立随机抽取样本。这确保了每个子群在最终样本中都得到充分代表。\n\
  \n分层抽样通常比简单随机抽样提供更精确的估计，特别是在总体内部存在显著变异性时。每个层的样本量按该层在整个总体中的比例大小确定。\n\n让我们创建一个名为 `customers`\
  \ 的数据集，包含两个分类变量：`age_group` 和 `shopping_frequency`。我们根据指定概率进行随机抽样，将每个客户分配给一个 `age_group`\
  \ 和一个 `shopping_frequency`，并使用 `set.seed(123)` 以确保随机抽样的可重复性。\n\n```\n# Create a\
  \ dataset with customer information\nset.seed(123) # For reproducibility\ncustomers\
  \ <- data.frame(\n  customer_id = 1:1000,\n  age_group = sample(c(\"18-25\", \"\
  26-35\", \"36-45\", \"46+\"), 1000, replace = TRUE, prob = c(0.2, 0.3, 0.3, 0.2)),\n\
  )\n```\n\n\n\n\n# 分层抽样示例\n\n```r\nshopping_frequency = sample(c(\"occasional\",\
  \ \"regular\", \"frequent\"), 1000, replace = TRUE, prob = c(0.4, 0.3, 0.3))\n```\n\
  \n此处，分层基于客户人口统计学特征定义：年龄组（18-25、26-35、36-45、46+）和购物频率（偶尔、定期、频繁）。现在，让我们使用 `dplyr`\
  \ 执行分层抽样以选择客户样本。\n\n## 分层抽样代码\n\n```r\n# Stratified sampling\nstratified_sample\
  \ <- customers %>%\n  group_by(age_group, shopping_frequency) %>%\n  sample_n(size\
  \ = 20, replace = FALSE)\n```\n\n在上述命令中，我们使用 `group_by()` 函数按 `age_group` 和 `shopping_frequency`\
  \ 对数据集进行分组。然后使用 `sample_n()` 从每个层（组）中选择大小为 20 的样本且不放回，确保 `age_group` 和 `shopping_frequency`\
  \ 的每种组合都在样本中得到体现。下表显示了 `stratified_sample` 数据集中 `age_group` 和 `shopping_frequency`\
  \ 变量的交叉列联表。\n\n## age_group 和 shopping_frequency 的交叉列联表\n\n```r\n# Cross-Tabulation\
  \ of the age_group and shopping_frequency\ntable(stratified_sample$age_group, stratified_sample$shopping_frequency)\n\
  ```\n\n| | frequent | occasional | regular |\n| --- | --- | --- | --- |\n| 18-25\
  \ | 20 | 20 | 20 |\n| 26-35 | 20 | 20 | 20 |\n| 36-45 | 20 | 20 | 20 |\n| 46+ |\
  \ 20 | 20 | 20 |\n\n**表 9.1：age_group 和 shopping_frequency 变量的交叉列联表**\n\n在上表中，行代表\
  \ `age_group` 的不同取值，列代表 `shopping_frequency` 的不同取值。表中的每个单元格表示落入特定 `age_group` 和\
  \ `shopping_frequency` 组合的观测值计数（每个单元格均为 20）。\n\n#### 描述性统计\n\n描述性统计是理解任何数据集的基础。它们提供了数据集关键特征的简明摘要，使我们能够了解其集中趋势、变异性和形状。均值、中位数和众数等指标捕捉典型值，而方差、标准差和极差则量化数据的离散程度和潜在异常值。从本质上讲，描述性统计使我们能够回答诸如“平均值是多少？”和“数据有多分散？”等基本问题，为进一步的分析和模型构建奠定基础。\n\
  \n##### 集中趋势度量\n\n集中趋势度量是一种统计摘要，代表数据集中的中心或典型值。这些度量有助于总结和理解数据分布的中心位置或趋势。\n\n考虑这样一个场景：快递服务经理想要分析其快递员的派送时间。她想要确定包裹送达目的地的典型时间，同时承认由于不可预见的情况可能存在偶尔的异常值。\n\
  \n**均值**（或平均数）是通过将数据集中的所有值相加，然后将总和除以观测数量来获得的。平均派送时间是通过将所有派送时间相加并除以总派送次数来计算的。例如，如果有七个派送时间：18、20、22、25、28、30，以及因异常事件导致的意外异常值\
  \ 3 小时，则均值为 (18 + 20 + 22 + 25 + 28 + 30 + 3) / 7 = 146 / 7 ≈ 20.86 小时。\n\n虽然均值是常用的集中趋势度量，但在某些场景下它可能无法提供准确的洞察。均值对极端值（即异常值）敏感，这会扭曲其值并错误地代表集中趋势，正如\
  \ 3 小时的派送时间所示。在这种情况下，对极端值不那么敏感的**中位数**可能提供更稳健的指标。\n\n###### 创建数据框并计算均值\n\n```r\n\
  # Create a dataframe\ndelivery_data <- data.frame(\n  delivery_times = c(18, 20,\
  \ 22, 25, 28, 30, 3),\n  package_types = c(\"Small\", \"Large\", \"Medium\", \"\
  Large\", \"Small\", \"Medium\", \"Small\")\n)\n\n# Calculate mean\nmean_delivery_time\
  \ <- mean(delivery_data$delivery_times)\ncat(\"Mean Delivery Time:\", mean_delivery_time,\
  \ \"hours\")\n## Mean Delivery Time: 20.85714 hours\n```\n\n相比之下，**中位数**是一种对极端值不敏感的集中趋势度量。它代表数据按升序或降序排列后的中间值。请注意，中位数不依赖于数据中的每一个值，这与均值不同。在给定的派送时间数据集中，按顺序排列为\
  \ 3、18、20、22、25、28 和 30，中位数被确定为第 4 项的值。在该实例中，有七个派送时间（奇数个），中位数为 25 小时。与均值不同，中位数不取决于数据集中的每个值，这使其成为一种能够抵御异常值影响的稳健度量。\n\
  \n###### 计算中位数\n\n```r\n# Calculate median\nmedian_delivery_time <- median(delivery_data$delivery_times)\n\
  cat(\"Median Delivery Time:\", median_delivery_time, \"hours\")\n## Median Delivery\
  \ Time: 22 hours\n```\n\n**众数**是数据集中出现频率最高的值。经理现在想了解快递员中最普遍的包裹类型。例如，如果数据集显示“Small”包裹出现频率最高，则“Small”即为众数。基础\
  \ R 中没有内置的众数函数，因此我们可以创建一个自定义函数。\n\n###### 众数计算\n\n```r\n# Mode calculation\nget_mode\
  \ <- function(x) {\n  unique_values <- unique(x)\n  frequencies <- tabulate(match(x,\
  \ unique_values))\n  mode_value <- unique_values[which.max(frequencies)]\n  return(mode_value)\n\
  }\n\n# Calculate the mode for package types\nmode_package_type <- get_mode(delivery_data$package_types)\n\
  cat(\"Mode Package Type:\", mode_package_type)\n## Mode Package Type: Small\n```\n\
  \n必须仔细评估数据的特征，并选择最符合数据集固有性质的集中趋势度量。\n\n##### 离散程度度量\n\n离散程度是指数据集内部传播或变异性的程度。它提供了关于单个值偏离集中趋势程度的洞察。离散程度度量对于理解数据点的分布和变异性至关重要。\n\
  \n**极差**是一种简单而有效的测量数据变异性的方法，定义为观测到的最高值和最低值之间的差距。通常，较大的极差意味着观测值之间的差异较大。虽然极差易于理解，但它有局限性。其主要缺点在于受异常值影响很大。当一个异常数据点极高或极低时，会极大地影响整个极差。\n\
  \n假设您正在分析电商平台的每日网站流量。您的数据包含一个名为 `daily_visits` 的向量，表示一个月内的网站访问量。\n\n###### 创建向量并计算极差\n\
  \n```r\n# Create a vector, daily_visits\ndaily_visits <- c(1200, 950, 1500, 800,\
  \ 1100, 1350, 1000, 1800, 750, 1400)\n\n# Calculate Range\nvisits_range <- diff(range(daily_visits))\n\
  cat(\"Range of daily website visits:\", visits_range, \"visits\\n\")\n## Range of\
  \ daily website visits: 1050 visits\n```\n\n此处，`range()` 返回一个包含 `daily_visits` 向量最小值和最大值的双元素向量。`diff()`\
  \ 计算向量中连续元素之间的差异。在这种情况下，它计算从 `range()` 函数获得的最大值和最小值之间的差值。极差告诉我们网站流量在 1050 次访问范围内变化。\n\
  \n**方差**量化数据集内部离散的程度。它度量单个数据点与均值之间的平均平方差。样本方差公式如下：\n\n![](img/eq-11.jpg)\n\n其中，\n\
  \n- `s2` = 样本方差\n- `xi` = 每个观测值的值\n- ![](img/eq-21.jpg) = 样本均值\n- `n–1` = 自由度\n\n\
  \n\n\n通过对差值进行平方，我们确保了正偏差和负偏差不会相互抵消。因此，方差始终为非负数，即零或正数。方差为零表示所有数据点的值都相同，表明不存在变异性。另一方面，随着数据值变得更加分散，变异性也会增加。然而，由于方差涉及平方单位而非自然数据单位，因此解释起来可能具有挑战性。较高的方差意味着变异性增加；尽管如此，对于特定数值并没有明确的解释标准。\n\
  \n###### 计算方差\n\n```\nvisits_variance <- var(daily_visits)\ncat(\"Variance of daily\
  \ website visits:\", visits_variance, \"visits²\\n\")\n```\n\n## Variance of daily\
  \ website visits: 109472.2 visits²\n\n`var()` 函数计算数值向量的方差，它衡量每个数据点偏离均值的平均平方偏差。在指定期间内，每日网站访问量的方差约为\
  \ 109472.2 visits²。由于方差以平方单位（visits²）表示，其直观解释性可能不如原始数据。\n\n标准差是方差的平方根，它用原始数据的单位来表示变异性。较小的标准差值意味着数据点紧密聚集在均值周围，而较大的值则表明数据在不同数量级上分散得更广。与以平方单位表示变异性且可能不如原始数据直观的方差不同，标准差通过使用与原始数据相同的单位简化了解释。\n\
  \n标准差公式为：\n\n![](img/eq-31.jpg)\n\n其中，\n\n*   `s2` = 样本标准差\n*   `xi` = 每个观测值的值\n\
  *   ![](img/eq-21.jpg) = 样本均值\n*   `N` = 观测值的数量\n\n###### 计算标准差\n\n```\nvisits_std_dev\
  \ <- sd(daily_visits)\ncat(\"Standard Deviation of daily website visits:\", visits_std_dev,\
  \ \"visits\\n\")\n```\n\n## Standard Deviation of daily website visits: 330.8659\
  \ visits\n\n`sd()` 函数计算标准差，它代表单个每日访问计数偏离平均访问计数的平均量。平均而言，每日访问量偏离均值约 330 次。\n\n####\
  \ 概率\n\n概率是衡量事件发生可能性的指标。它定义了在所有可能结果中事件发生的几率或概率。概率总是表示为 0 到 1 之间的数字，其中 0 代表不可能事件，1\
  \ 代表必然事件。\n\n概率帮助我们量化数据中的不确定性并对结果建模。例如，想象一下构建一个预测客户流失的模型。你无法确定哪些客户会流失；通过分析过去的行为并结合购买历史和人口统计特征等因素，你可以计算每个客户的流失概率。这有助于确定外联工作的优先级并有效分配资源。\n\
  \n我们用 `P(E)` 表示事件 E 的概率。在概率论中，事件可以是独立的，也可以是依赖的。独立事件的特点是其结果互不相关，即一个事件的发生不影响另一个事件的概率。另一方面，依赖事件则紧密相关，一个事件的发生提供了关于另一个事件可能性的信息。让我们考虑两个事件\
  \ E 和 F。对于独立事件，两者同时发生的联合概率，记为 `P(E and F)`，等于它们各自概率的乘积：\n\n```\nP(E and F) = P(E)\
  \ * P(F)\n```\n\n例如，想象抛掷两枚独立的硬币，每枚硬币正面朝上的概率都是 50%。两枚硬币都正面朝上的概率是 50% * 50% = 25%，这说明了它们的独立性。\n\
  \n然而，对于依赖事件，情况则不同。在事件 F 已经发生的条件下事件 E 发生的概率，记为 `P(E | F)`，是通过条件概率计算的：\n\n```\nP(E\
  \ | F) = P(E and F) / P(F)\n```\n\n已知 F 条件下 E 的条件概率，等于两个事件同时发生的联合概率除以事件 F 单独发生的概率。\n\
  \n假设你是一家零售店的经理，想要确定顾客在拿起商品并查看后购买该商品的概率。这是一个条件概率的例子，因为你试图确定顾客购买商品的概率，前提是他们已经通过拿起和查看表现出了兴趣。\n\
  \n这里的事件是：\n\n*   **E**：顾客购买商品。\n*   **F**：顾客拿起并查看商品。\n\n条件概率：`P(E|F)`：已知顾客拿起并查看商品的条件下，其购买该商品的概率。\n\
  \n条件概率 = (购买商品的概率) × (拿起并查看商品的概率) / (拿起并查看商品的概率)\n\n#### 推断统计\n\n推断统计帮助我们根据样本数据得出有意义的结论并对总体进行预测。与仅总结和描述数据集主要特征的描述性统计不同，推断统计更进一步，利用从中抽取样本的更大总体进行推断或概括。这一过程涉及使用概率论和统计技术，将具有代表性的数据子集的发现推广到整个总体。\n\
  \n#### 统计假设检验\n\n我们经常会遇到需要检验某个假设是否具有统计显著性的情况。这些假设的例子包括：实施新功能后，人均收入增加了；或者周末的客户参与度高于工作日。假设检验允许我们使用稳健的统计方法批判性地审视这些陈述。假设检验过程包含几个关键步骤：\n\
  \n1.  **构建假设**：定义原假设（`H0`）和备择假设（`H1`）\n    *   **原假设（`H0`）**：原假设假设被比较的变量或组别之间不存在显著关系、效应或差异。它总是包含一个等式条件，表明如果仅是随机偶然性在起作用，则结果不会偏离预期结果。\n\
  \    *   **备择假设（`H1`）**：相反，备择假设是数据科学家旨在确立的内容。备择假设通过断言被比较的变量或组别之间存在统计上显著的关系、效应或差异，来挑战原假设。值得注意的是，备择假设从不包含等式条件。\n\
  \n实质上，`H0` 和 `H1` 是数学上的对立面，代表了对数据中变量关系的两种截然不同的观点。让我们考虑一个实际场景。你正在调查电商平台引入个性化推荐系统是否显著提高了用户点击率。在这种情况下，原假设可能断言推荐系统没有效果，任何观察到的变化仅仅是由于随机偶然性。相反，备择假设断言归因于推荐系统的点击率存在切实的增加。\n\
  \n2.  **确定检验统计量**\n\n一旦设定了假设，我们需要选择一个统计检验来帮助我们确定是否可以拒绝原假设。有许多统计检验可用，但常用的包括：\n\n\n\
  \n\n##### 假设检验中的检验统计量\n\n###### Z-test\nZ-test 是一种广泛使用的检验统计量，特别适用于涉及均值的假设检验。它适用于大样本（n\
  \ > 30），并假设数据服从正态分布。\n\n###### T-test\nT-test 是另一种常用的检验统计量，与 Z-test 类似但更通用。它可以处理小样本（n\
  \ < 30），并放宽了正态性假设。\n\n###### Chi-square test\n卡方检验，也称为 Pearson 卡方检验，用于分类数据。它评估两个变量的独立性，或评估理论分布与数据集的拟合优度。卡方检验适用于分析列联表或交叉表。它可以识别分类变量之间的关系，或将观测分布与预测分布进行比较。\n\
  \n###### ANOVA\n方差分析（ANOVA）是一种用于比较多组均值的强大检验统计量。它将 T-test 扩展到两组以上，允许检验多个因素或处理的效应。\n\
  \n选择合适的检验统计量取决于数据的性质和研究问题。每种检验统计量都有其优势和局限性，选择合适的统计量可确保从假设检验中得出准确且有意义的结论。\n\n# 3.\
  \ 设定拒绝域\n\n拒绝域是导致拒绝原假设而支持备择假设的取值范围。此步骤涉及基于特定统计指标确定接受或拒绝原假设的标准。要设定拒绝域，我们需要定义三个参数：Alpha\
  \ (\U0001D6FC)、P-value 和临界值。\n\n###### Alpha (\U0001D6FC)\nAlpha（也称为显著性水平）是在原假设为真时拒绝原假设的概率。Alpha\
  \ 的常用值包括 0.05 或 0.01，反映了决策中可接受的风险水平。例如，若 \U0001D6FC 设为 0.05，意味着有 5% 的风险错误地拒绝原假设。\n\
  \n###### P-value\nP-value 是在原假设为真时，获得观测结果（或更极端结果）的概率。较低的 P-value 表明观测效应不太可能仅由随机偶然性引起，从而提供了反对原假设的证据。\n\
  \n###### 临界值\n临界值是定义拒绝域边界的检验统计量值。它是将拒绝域与接受域分开的值。\n\n# 4. 执行检验并得出结论\n\n利用样本数据计算检验统计量，并确定\
  \ P-value。将 P-value 与预先确定的显著性水平（通常为 0.05）进行比较。如果 P-value 小于显著性水平，则拒绝原假设。如果拒绝原假设，意味着观测效应具有统计学显著性，有证据支持备择假设。另一方面，如果不拒绝原假设，则表明观测效应可能归因于随机偶然性，没有足够证据支持备择假设。\n\
  \n> **注意：** 拒绝原假设并不证明备择假设为真。这仅意味着观测到的差异不太可能由偶然性引起。\n\n---\n\n让我们考虑一个分析新营销活动对产品销售效果的场景。原假设\
  \ (H0) 是营销活动对销售没有影响，任何观测到的变化均归因于随机偶然性。备择假设 (H1) 表明营销活动对销售有显著影响。\n\n在进行假设检验后，假设你计算出的\
  \ P-value 为 0.02，低于选定的显著性水平 0.05。在这种情况下，你会拒绝原假设，表明营销活动实际上对产品销售具有统计学显著影响。\n\n这一结论意味着观测到的销售增长（或下降）不能仅归因于随机波动，而很可能是营销努力的结果。因此，决策者可以基于这一数据驱动的证据，有信心地分配资源以继续或优化营销活动。\n\
  \n#### 协方差与相关性\n\n协方差衡量两个随机变量之间的线性关系。它捕捉该关系的方向，指示变量是同向变动（正值）还是反向变动（负值）。协方差的取值范围覆盖所有实数，从负无穷\
  \ (-∞) 到正无穷 (+∞)。\n\n*   **正协方差**：变量间存在正向关系。一个变量增加时，另一个也倾向于增加，反之亦然。\n*   **负协方差**：变量间存在反向关系。一个变量增加时，另一个减少，反之亦然。\n\
  *   **零协方差**：表明变量间无线性关系。它们的变化在任何特定方向上都无一致关联。但必须认识到，这不一定意味着不存在关系。关系可能是非线性的，或受分析未捕捉的其他因素影响。\n\
  \n`cov()` 函数计算两个向量之间的协方差。重要的是要注意，协方差提供了关系方向的洞察，但不提供关联强度。这就是相关性的作用，它提供一个从 -1 到 +1\
  \ 的标准化分数来量化关系强度。\n\n相关性衡量两个变量之间线性关系的强度和方向。这有助于分析师识别一个变量的变化是否与另一个变量的变化相关联。相关性为 -1\
  \ 表示完全负相关（反向变动），0 表示无线性关系，+1 表示完全正相关（同向变动)。越接近 -1 或 +1 的值表明关系越强，而越接近 0 的值表明关联越弱或不存在。识别这些关系对于进行预测和理解数据中观测模式背后的驱动因素至关重要。`cor()`\
  \ 函数计算两个向量之间的相关系数。\n\n考虑一个城市 Uber 乘车数据集。每个数据点包含行驶距离（公里）和对应的乘车时长（分钟）。距离与时间之间的正相关意味着，平均而言，较长的距离与较长的乘车时长相关联。\n\
  \n例如，市中心内的短途乘车，距离 2 公里，可能耗时约 10 分钟。另一方面，从郊区到机场的长途乘车，距离 30 公里，可能耗时 45 分钟或更久。正相关表明，完成乘车所需的时间倾向于随行驶距离的增加而增加。Figure\
  \ 9.1 展示了距离与耗时之间的线性关系：\n\n![](img/Figure9.1.png)\n\nFigure 9.1: 距离与耗时之间的线性关系\n\n\
  ### 结论\n\n\n\n\n统计学为您提供工具，以总结数据集的关键特征并识别模式与趋势。这些统计知识对于有效准备机器学习模型所需的数据至关重要。如果缺乏扎实的统计学掌握，您就有可能向模型输入理解不透彻或具有误导性的数据，从而导致结果不准确且不可靠。虽然概率论和统计学在数据科学中都扮演着关键角色，但它们的用途截然不同。概率论关注机会、可能性和随机性等概念。它探讨诸如“这一事件发生的概率是多少？”之类的问题。统计学则关注收集、分析、解读数据并从中得出结论。它提出诸如“这些数据告诉我们关于其所代表的总体的哪些信息？”之类的问题。在下一章中，您将接触到机器学习概念。\n\
