  \n![Figure 1.1](img/fm1.png)\n\n## 第 1 章：数据科学全景\n\n### 简介\n\n本章讲授如何处理数据问题、需要检查什么，以及在解决业务问题时应提出什么问题。您将了解通过拆解各要素来分析问题的过程，这将帮助您理解为何问题构建能决定产品的成败。根据业务需求的类型，所有数据应用均可归纳为四类业务分析——描述性、诊断性、预测性和处方性。\n\
  \n### 结构\n\n本章将涵盖以下主题：\n\n- 为何每个人都应了解数据科学\n- 理解业务问题\n- 处理数据的流程\n  - 关于数据应提出的问题\n\
  \  - 检查可复现性和一致性\n  - 建立假设并寻找证据\n- 所需的分析技能\n- 业务分析的类型\n  - 描述性分析\n  - 诊断性分析\n  -\
  \ 预测性分析\n  - 处方性分析\n\n### 目标\n\n完成本章后，您将牢固掌握数据科学生态系统，并学会如何利用海量可用数据有效应对和解决现实业务问题。您将获得处理任何数据问题的基础知识，并掌握发展为数据驱动型专业人士的基本技能。\n\
  \n### 理解数据科学的必要性\n\n理解数据科学对所有个体而言变得愈发重要，因为我们生活在一个数据无处不在的时代。凭借优质的数据技能，我们能为组织的成功注入更强动力。\n\
  \n让我为您介绍 Vedh，他是一名内容撰稿人，热衷于帮助专业人士打造个人品牌，在 LinkedIn 上积累了约 7,000 名关注者。过去三年里，他一直在 LinkedIn\
  \ 上分享其领域内的知识（见解）。尽管投入了大量精力，Vedh 过去几个月一直难以在该平台上获得关注。他一直定期发帖；另一方面，他的帖子不再获得以往同等水平的互动。结果，Vedh\
  \ 感到**受挫**，不知能否采取行动提升互动率，让内容触达更多人。\n\n随着时间的推移，Vedh 参加了一个数据科学研讨会，了解到数据分析在增强内容表现方面的威力。出于好奇，Vedh\
  \ 决定尝试一下，最终意识到通过分析他的 LinkedIn 帖子，他可以深入了解什么有效、什么无效，并利用数据优化内容策略。\n\n这一当代洞见让 Vedh 兴奋不已，他开始细致地复盘自己的帖子。他首先追踪每篇帖子的互动率，包括点赞、评论和分享数。接着，他按主题、形式和长度对帖子进行分类，并追踪各类别的互动率。\n\
  \n在短暂的分析时间内，Vedh 发现了一些令人振奋的趋势。首先，他意识到某一特定主题的帖子比其他主题获得更多互动，且长文表现优于短文。仔细检查后，他发现表现更好的帖子包含更多个人轶事和故事。此外，带图片或视频的帖子比纯文本帖子获得更多互动。基于这些认知，Vedh\
  \ 决定在未来的帖子中融入更多故事。图 1.1 展示了 Vedh 在 90 天内的 LinkedIn 内容表现。\n\n![Figure 1.1: LinkedIn\
  \ Content Performance of Vedh](img/Figure1.1.jpg)\n\n接着，Vedh 分析了受众的人口统计特征。他确定大多数关注者是\
  \ IT 服务和咨询机构的中年职业人士。随后，Vedh 创作了更多针对这一特定受众的内容，例如分享面向 IT 顾问的个人品牌打造技巧。下图展示了 Vedh 的\
  \ LinkedIn 关注者的人口统计行为。\n\n![Figure 1.2](img/Figure1.2.png)\n\n\n\n\n\n### Vedh 的\
  \ LinkedIn 分析之旅\n\n图 1.2：Vedh 的 LinkedIn 粉丝人口统计特征分布\n\n最后，Vedh 分析了他发帖的时间和频率。他发现，在上午晚些时候发布的帖子比在晚上或夜间发布的帖子往往能获得更多互动。他还发现，每周至少发帖两次能带来更高的互动率，使受众保持参与和兴趣。\n\
  \n利用这些指标，Vedh 开始将洞察应用到他的 LinkedIn 策略中。他开始更多地关注能引起受众共鸣的主题，尝试长篇幅内容和更多多媒体形式，并在上午晚些时候更频繁地发帖。随着时间的推移，Vedh\
  \ 的互动率开始提升。他的帖子获得了更多点赞、评论和转发，并且开始吸引更多粉丝关注他的 LinkedIn 主页。行业思想领袖也开始转发他的帖子并与他的内容互动。\n\
  \n得益于他对数据科学和分析的全新理解，Vedh 成功将他的 LinkedIn 内容推向了新高度。他现在是公认的个人品牌专家，并帮助越来越多的专业人士打造自己的个人品牌。总的来说，Vedh\
  \ 的经历凸显了数据科学如何帮助内容创作者深入洞察其在 LinkedIn 等社交媒体平台上的表现。\n\n如今海量的可用数据提供了获取宝贵洞察的巨大机遇，这使得理解数据比以往任何时候都更加关键。\n\
  \n### 数据驱动的度假规划\n\n现在，让我们看看 Vedh 的例子。他最近学习了数据科学，并决定去塞舌尔度假以充电放松。\n\n凭借对数据科学的新理解，Vedh\
  \ 意识到他可以利用数据来规划岛屿行程，充分利用这次旅行。他首先想利用数据回答几个基本问题：\n\n*   在一个岛上待多少天？\n*   每天去哪些景点？\n\
  *   从一个地方去另一个地方的最优路线是什么？\n\nVedh 决定运用数据科学技能寻找机票和酒店的最佳优惠。他首先分析机票价格数据，以确定飞往和离开塞舌尔具有竞争力价格的日期和时段。接着，利用航班可用性和机票价格数据，Vedh\
  \ 找到了最划算的机票，在机票上节省了数百美元。\n\n接下来，Vedh 专注于寻找每个岛上最好的酒店。他利用在线评论网站寻找评分最高、好评最多的酒店，但他更进一步，通过分析评论的情感倾向来识别潜在问题或关注点。利用情感分析等数据科学技术，Vedh\
  \ 可以识别出始终拥有好评和高评分的酒店，让他能够毫无后顾之忧地预订住宿。\n\n抵达马埃岛（塞舌尔的主要岛屿）后，Vedh 面临众多可选活动，感到无从下手。Vedh\
  \ 首先将马埃岛和塞舌尔其他岛屿的地图下载到智能手机上。然后，他运用数据科学技能分析地图，规划出游览岛上所有主要旅游景点的最佳路线。接着，Vedh 开始追踪马埃岛不同活动的受欢迎程度和评分，包括徒步路线、海滩和文化遗址。他还考察了不同旅游项目和活动的频次和时间，确定游览每个景点的最佳时间。最后，利用交通模式和游客流量数据，Vedh\
  \ 规划了每天的行程，确保充分利用时间，避免长时间排队和拥挤区域。\n\n当 Vedh 前往其他岛屿时，他继续利用数据优势。他利用在线评论和评分寻找最好的餐厅和当地美食，并运用数据技能分析菜单，找出最值得尝试的菜肴。他还利用数据识别最佳海滩和风景优美的地点，结合卫星图像和天气数据，根据最佳天气条件和光线安排游览时间。\n\
  \n凭借数据驱动的旅行方式，Vedh 充分体验了塞舌尔之旅。他游览了所有主要旅游景点，在最好的餐厅用餐，享受了最美的海滩和风景。此外，得益于对数据科学的理解，Vedh\
  \ 能够轻松自信地游历各岛，使这次假期难以忘怀。\n\n### 理解业务问题\n\n与房地产、库存和专利等传统运营资产不同，数据在有效利用时能产生巨大的增长潜力。关键在于理解其内在价值，明智地使用它，并建立一种拥抱数据驱动方法优势的文化。数据已成为全球组织通往新机遇的门户，潜在用途无限。产生的数据量呈指数级增长，主要归因于联网设备数量的增加以及全球互联网普及率的上升（包括固定和移动设备）。\n\
  \n嘿，你知道吗？Vedh 经营他的个人品牌机构“Being Minimalist Services”已有数年！虽然生意不错，但他知道还有改进空间。他一直基于经验和直觉做决策，但意识到需要开始在决策过程中引入数据。\n\
  \n> **数据驱动型组织的标志是什么？**\n> 成为数据驱动型组织意味着你的公司善于利用其数据，且数据团队在关键决策过程中有发言权。在这样的组织中，决策主要由数据洞察驱动，而非个人偏见或一己之见。\n\
  \n怀着这个想法，Vedh 开始投资数据收集和分析工具。他开始追踪网站分析、社交媒体指标和其他关键绩效指标，以更好地了解他的业务和客户。随着他深入挖掘数据，Vedh\
  \ 发现了此前从未注意到的趋势和模式。\n\n例如，他发现大多数客户来自某个特定地区，因此可以相应调整营销策略以瞄准该地区。他还发现，某些类型的内容在社交媒体上获得的互动远高于其他内容，这让他能够调整内容策略，提升社交媒体触达率。\n\
  \n他看到了客户互动增加、线索增多，最终业务增长。然而，Vedh 知道他可以做得更多。于是，他开始将数据融入公司的方方面面，从市场营销到销售，再到运营。\n\n\
  通过将数据作为决策过程的核心部分，Vedh 能够做出更明智的决策，避免昂贵的错误。然而，他意识到数据驱动只是第一步，为了真正蓬勃发展，他需要在整个组织中建立数据主导的文化。\n\
  \n> **如何界定数据主导型组织？**\n> 数据主导型组织更进一步。在这里，数据融入公司各层级、各角色的工作中，在每次会议中被讨论，并融入同步和异步工作流中。在未来几年，成为数据主导型组织将对企业的成功和长久至关重要，并可能帮助企业抵御经济低迷，实现“面向未来”。这对于运营或财务复杂度高的企业尤其如此。\n\
  \n\n\n\n\n### Vedh 的目标：打造数据驱动型组织\n\nVedh 的目标是建立一支精干的团队，利用数据驱动业务决策。此外，他旨在创建一种重视数据作为战略资产、并将数据嵌入业务各个层面和每个角色的企业文化。他知道，通过成为数据主导型组织，他可以让业务在经济衰退中立于不败之地，并在日益激烈的市场竞争中蓬勃发展。\n\
  \n![](img/Figure1.3.jpg)\n\n**图 1.3：数据驱动型组织**\n\n上图展示了什么在数据驱动型组织中驱动业务价值。当组织建立数据驱动文化并评估其采纳关于数据的新视角、行为和实践的准备情况时，这些只是组织应反思的几个问题。\n\
  \n*   作为一个组织，我们是否制定了清晰的数据战略？如果没有，我们面临哪些数据可以帮助解决的挑战？\n*   领导层是否在推动业务决策过程优先考虑数据？\n\
  *   我们是否全面了解可用的数据，组织内部的人员是否信任这些数据？\n*   我们的数据管理方法有多成熟，我们可以利用哪些资源来自信地改进和扩展组织？\n*\
  \   我们员工的数据专业水平如何，不同层级之间是否存在技能差距？\n\n| 组织如何转型为数据驱动型实体？ |\n| --- |\n| • 建立一种将数据置于业务战略核心的创新文化\
  \ |\n| • 开发支持并驱动这种文化的数据能力 |\n\n我们是否遵循了分析领域的最佳实践？如果没有，我们应建立哪些标准以确保在整个组织中遵循一致的实践？\n\
  \n数据科学是一个应用领域，数据科学家致力于满足业务消费者的需求并解决他们的问题。\n\n公司实现高级分析目标的关键因素之一，是将这些目标与其总体目标对齐，以提升其产品、服务和流程的盈利能力。当数据科学家与业务利益相关者协作、预先确立成功标准并优先考虑最终用户需求时，便能创造出最高效的分析解决方案。\n\
  \n在整个决策过程中（例如选择合适的分析技术），团队应考虑最终用户将如何解读数据积累的洞察并据此采取行动。\n\n#### 接近数据的过程\n\n现在让我们来看一个关于\
  \ Vedh 妻子 Vedika 的精彩故事，她拥有一家连锁咖啡馆。她担心公司面临的高客户流失率。尽管拥有相当数量的客户，但连锁咖啡馆面临回头客下降的问题，Vedika\
  \ 想弄清楚原因。为了解决这个问题，Vedika 寻求 Vedh 在数据科学方面的专业知识，帮助她找出问题的根本原因并寻找减少客户流失的解决方案。\n\n####\
  \ 关于数据应提出的问题\n\n为了更好地了解连锁咖啡馆的运营情况，Vedh 走访了多家咖啡馆并与咖啡馆经理（在本例中即我们的主题专家）进行了交谈。他请他们讲述咖啡馆日常运营的故事，以及他们认为可能导致客户流失的原因。他甚至亲自品尝了咖啡馆的餐饮，以更好地了解什么能驱动顾客回头，什么不能。\n\
  \nVedh 的方法并非简单地提出一个理论并将其宣称为事实。相反，他寻找证据来支持或反驳他的假设。对 Vedh 来说，将业务需求表述为具体的问题或假设至关重要。这样做有助于确保他收集到正确的数据，并思考数据中可能存在的缺口。他首先收集客户行为数据——每天光顾咖啡馆的顾客数量、他们点的餐饮类型、到访时间段以及交易记录。然而，在查看数据之前，他先确保理解数据收集的背景。他检查了咖啡馆的系统和仪表，以确保数据收集准确，且不存在异常配置或人群限制。随着他查看数据，问题也在演变，但拥有清晰的问题或假设使他的分析保持专注和目的性。他知道，在没有明确问题或假设的情况下分析数据会产生无目的的结果。\n\
  \n> 要开始数据分析，首先应构思问题，而非直接深入数据或使用特定技术。\n\n接下来，他进入验证阶段。他确保数据自洽且代表了他所认为的含义。接着，他检查错误、缺失数据和可能扭曲结果的异常值。他还检查日志，确认没有数据缺口或不一致性会影响分析。下图显示\
  \ Vedh 正在与经理们讨论咖啡馆面临的挑战。\n\n![](img/Figure1.4.png)\n\n**图 1.4：Vedh 与咖啡馆经理交谈的插图**\n\
  \n一旦他对数据质量充满信心，便客观地解读数据以确定其传达的信息。他寻找客户行为中的模式和趋势，例如哪些产品销量最高、一周中哪几天客流量最大。\n\n####\
  \ 检查可重复性和一致性\n\nVedh 还考虑到首先查看标准指标的重要性，即使他预期这些指标会随新功能的引入而变化。例如，他在深入研究关于新菜品的自定义指标之前，确保理解新菜品对“总顾客数”和“平均顾客消费”等标准指标的影响。接着，他将这些指标与过去报告的指标进行比较，检查与过往测量的一致性，以确保分析走在正轨上。\n\
  \n> 分析数据时，将指标与过往测量进行比较至关重要，即使这些指标来自不同的用户群体。这有助于确保分析的一致性，并提供随时间发生变化的洞察。通过这样做，你可以发现你的发现与过往指标之间的任何差异，并进一步调查以验证你的结果。\n\
  \n他确立每个指标的标准值，并严格地将其与其他特征和指标进行比较。他用多种方式测量同一底层事物，以确保结果的一致性和准确性。他甚至使用不同的数据源进行测量，以确保获得数据的全面视图。例如，他通过调查、社交媒体反馈和面对面交谈来衡量客户满意度，并将其与销售数据交叉引用，以确保一切一致。\n\
  \n#### 提出假设并寻找证据\n\n在分析数据时，他注意到使用移动点餐 App 的顾客与不回头的顾客之间存在强相关性。具体而言，他发现使用移动 App 的顾客比不使用的顾客少\
  \ 20% 的回头率。\n\n虽然这种相关性看起来很有趣，但并不一定意味着使用移动 App 导致顾客不回头。其他因素可能同时驱动 App 的使用和不回头的决定。例如，使用\
  \ App 的顾客可能更懂技术，更倾向于从其他在线平台订餐；或者他们可能来自更年轻的群体，更倾向于在餐饮选择上寻求新奇和多样性；又或是由于地理位置和多样化的客户人口统计特征。\n\
  \n这些潜在因素可能才是这些顾客不回头的真实原因，而与移动 App 使用的相关性只是巧合。\n\n\n\n\n\n### 确定因果关系\n\n为了确定因果关系，Vedh\
  \ 需要进行额外的分析，例如实验或观察性研究，以建立移动应用使用与客户流失之间的因果关系，而不仅仅依赖相关性。\n\n### 咖啡馆经理的共同主题\n\n当咖啡馆经理分享他们的故事时，Vedh\
  \ 发现了一些共同主题。其中一个问题是所有分店的咖啡质量一致性。喜欢某家分店特定咖啡的顾客，在另一家分店点同款咖啡时感到失望，因为口感不同。\n\nVedh 意识到咖啡质量不一致是一个异常值，这可能是导致客户流失的一个因素。他深入挖掘，发现每家分店从不同的供应商订购咖啡豆，导致了口感差异。\n\
  \n### 识别风险与不确定性\n\n除了识别异常值，Vedh 还检查了咖啡馆经理面临的风险和不确定性。例如，他发现高峰时段热门菜单售罄的问题，导致顾客空手而归。他还识别出附近开设了新竞争对手，给业务带来了压力。总的来说，我们的目标是以一种增加积极结果可能性并降低消极结果可能性的方式缩小关注范围。实现这一点需要做出更好的决策；为此，我们需要减少不确定性。Vedh\
  \ 通过询问关于风险和不确定性的相关问题来理解这些，以解决最重要的问题。\n\n### 分析结果与业务影响\n\n最终，Vedh 的分析揭示了客户离开咖啡连锁店的几个关键洞察。Vedh\
  \ 确信，凭借他对细节的关注以及对业务问题和领域的理解，他能为咖啡连锁店提供有价值的见解。因此，Vedika 的咖啡连锁店能够对其菜单、客户服务和营销策略进行有针对性的改进，减少客户流失并推动收入增长。\n\
  \n### 所需的分析技能\n\n如果我们审视 Vedh 的经历，可以将数据科学定义为远不止简单分析数据。数据科学领域包含各种职位角色，需要多样化的技能组合。让我们深入了解上述示例所暗示的几项关键技能：\n\
  \n*   **理解应用领域** — 深入理解领域对于识别数据问题至关重要。这要求保持开放心态、好奇心、创造力，并愿意提出大量问题。\n*   **连接数据用户与运营及一线管理者/用户**。\n\
  *   **以最终采用为目标设计分析解决方案** — 着眼于业务问题的全貌。\n*   **关注数据质量** — 理解所用数据的局限性，衡量其准确性，并为未来改进数据质量提供建议。\n\
  *   **为有效分析准备数据**。\n*   **构建并检验假设**。\n*   **编写高效且可维护的代码**（R/Python 或其他语言）。\n*  \
  \ **基于需求利用统计学和机器学习技术**。\n*   **数据叙事** — 通过叙述和可视化清晰、引人入胜地传达数据洞察。\n\n在最后一章，我们将深入探讨这一点。现在，让我们了解不同类型的分析可以如何分类。\n\
  \n### 业务分析的类型\n\n介绍四种关键类型的数据分析，可以为理解数据如何被分析以及可以获得什么洞察提供一个有价值的框架。这四种类型——描述性、诊断性、预测性和处方性分析——层层递进，为寻求数据驱动决策的组织提供独特优势。通过理解这些数据分析类型，企业可以更好地调整其数据分析策略，以实现目标并改进决策流程。\n\
  \n#### 描述性分析\n\n描述性分析涉及从原始数据中提取模式和洞察，简要概述发生了什么或正在发生什么？它是其他三种分析类型的基石。这是最直接的分析形式，构成了更高级数据分析技术的基础。为企业增加价值的初始步骤如下图所示，涉及描述性分析。\n\
  \n![](img/Figure1.5.jpg)\n\n**图 1.5：组织价值增加。第一阶段：描述性分析**\n\n假设我们有一个数字银行平台，想要分析客户如何使用它。我们可以使用描述性分析来回答以下问题：\n\
  \n*   每月有多少客户登录数字银行平台？\n*   客户访问最多的是哪些页面？\n*   客户在平台上花费多少时间？\n*   平台使用情况按月或按年对比如何？\n\
  \n使用从平台收集的数据，我们还可以计算以下指标：\n\n*   **月活跃用户 (MAU)**：我们可以追踪每月登录平台的独立用户数量。例如，2023 年 1\
  \ 月，我们有 70,000 名独立用户。\n*   **页面浏览量 (Page Views)**：我们可以统计平台上每个页面的浏览次数。2023 年 1 月，登录页被浏览了\
  \ 110,000 次，而账户余额页被浏览了 65,000 次。\n*   **平均平台停留时间**：我们可以衡量每个用户在平台上花费的时长并计算平均值。2023\
  \ 年 1 月，平均停留时间为每用户 6 分钟。\n*   **月增长率**：我们可以按月对比指标，查看平台增长情况。例如，与 2022 年 12 月相比，2023\
  \ 年 1 月月活跃用户增长了 2%。\n\n通过分析这些指标，我们可以深入了解客户如何使用数字银行平台，并识别改进领域。\n\n很好！我们了解了描述性分析的概况。\n\
  \n现在让我们考虑另一个场景——一家披萨连锁店在不同渠道（包括在线、电话订单和店内购买）运营 2000 家门店。该公司收集了过去三年的披萨销售数据，希望分析交易数据以深入了解客户行为并优化运营。\n\
  \n现在，披萨连锁店可以分析特定时期的销售数据，以确定哪些披萨最受欢迎、客户最常使用哪些渠道订购披萨，以及一周中的哪几天或一天中的哪些时段销售额最高。\n\n\
  例如，披萨连锁店可以分析其销售数据，发现意大利辣香肠披萨最受欢迎，占所有披萨销量的 40%，而素食披萨最不受欢迎，仅占 6%。他们还发现在线销售占所有披萨销售的\
  \ 70%，而移动端和店内销售分别占 18% 和 12%。数据显示在线销售增长快于电话或店内销售，因此公司可能希望投资改进其在线订购平台。\n\n通过查看每日披萨销量，披萨连锁店可以确定一周中最繁忙的日子和时段，从而安排员工排班并优化库存。例如，数据显示销售额在周五和周六晚上\
  \ 5 点到 8 点之间最高，高峰时段平均售出 6,500 个披萨。在这种情况下，公司可能希望在那些时段增加人员配置，以确保订单能快速处理。\n\n\n\n\n\
  \n#### Descriptive Analytics Empowers Business Decisions\n\nA pizza chain can gain\
  \ valuable insights by analyzing its pizza sales data, enabling data-driven decisions\
  \ to boost sales. For example, they can create targeted promotions or offers for\
  \ the most popular pizzas, invest in improving their online and mobile ordering\
  \ platforms, and increase staffing during peak hours to improve in-store sales.\
  \ With descriptive analytics, the pizza chain can better understand customer preferences,\
  \ identify sales trends, and make informed decisions to drive business growth.\n\
  \nGreat! Now let's see how descriptive analytics can be a valuable tool for marketing\
  \ teams to analyze and evaluate the performance of their marketing campaigns.\n\n\
  Marketing teams can gain insights into the behavior and preferences of their target\
  \ audience by examining click-through rates and social media engagement. For instance,\
  \ a marketing team launches a social media ad campaign to promote a new product.\
  \ By using descriptive analytics, the team can track metrics such as ad impressions,\
  \ click-through rates, and conversion rates. They can also monitor social media\
  \ followers, likes, comments, and shares to gauge audience engagement.\n\nBased\
  \ on these metrics, the marketing team can identify which aspects of the campaign\
  \ were successful and which areas need improvement. For example, they might find\
  \ that a specific type of social media post (e.g., video) garners more engagement\
  \ than others, or that conversion rates are higher when the campaign targets a specific\
  \ demographic segment.\n\nDescriptive analytics can also be used to segment the\
  \ target audience based on demographic, geographic, and psychographic variables.\
  \ By analyzing data on customer behavior and preferences, marketing teams can create\
  \ more targeted and personalized campaigns to improve conversion rates.\n\nFor example,\
  \ suppose a pizza chain with 2,000 locations across multiple channels wants to create\
  \ a marketing campaign to promote a new vegan pizza line. Using descriptive analytics,\
  \ the marketing team can segment the target audience based on factors such as age,\
  \ location, dietary preferences, and past purchase behavior. They can then create\
  \ targeted campaigns for each segment and track the performance of each campaign.\
  \ This helps the team optimize campaigns and maximize return on investment.\n\n\
  Descriptive analytics provides valuable insights into business operations and is\
  \ often presented through data visualizations. Dashboards can be developed based\
  \ on these descriptive analytics, allowing stakeholders to track progress toward\
  \ goals and spot any anomalies. While descriptive analytics can stand alone as a\
  \ useful tool, it is also a critical foundation for future analytics. It forms the\
  \ backbone of daily reporting for many businesses and can be applied across various\
  \ domains, such as annual revenue reports, inventory, and sales data. These reports\
  \ are easy to compile and provide a clear snapshot of company operations.\n\n####\
  \ Diagnostic Analytics\n\nDiagnostic analytics builds upon descriptive analytics\
  \ and goes a step further to answer the question, \"Why did this happen?\" This\
  \ analysis attempts to pinpoint the root cause of a specific trend or issue. It\
  \ often involves comparing coexisting trends or movements, discovering correlations\
  \ between variables, and determining causal relationships where possible. Diagnostic\
  \ analytics helps business users understand why things happened and provides valuable\
  \ insights into the underlying factors leading to a specific trend or issue. The\
  \ figure below illustrates the second stage of increasing business value to an organization:\
  \ diagnostic analytics.\n\n![](img/Figure1.6.jpg)\n\n**Figure 1.6: Increasing Value\
  \ to the Organization. Stage 2: Diagnostic Analytics**\n\nFor companies that collect\
  \ customer data, diagnostic analytics plays a crucial role in understanding the\
  \ motivations behind customer behavior. These insights can be used to improve products\
  \ and user experience (UX), fine-tune brand messaging, and ensure products stay\
  \ aligned with the target audience.\n\nHere are some potential diagnostic analytics\
  \ questions with examples:\n\n*   **Why did logins decrease last month?**\n\n  \
  \  By analyzing the data, we might discover that the drop in platform usage was\
  \ due to a higher-than-normal rate of errors during the login process. We can use\
  \ diagnostic analytics to drill down into the root cause of these errors, identifying\
  \ the specific factors causing them, such as mandatory password resets, updated\
  \ security requirements, or technical issues with the platform. Addressing these\
  \ underlying issues can improve the login process, enhance the overall customer\
  \ experience, and ultimately increase customer engagement and retention on the platform.\n\
  \nSuppose a mobile banking platform offers a cash-back rewards program for customers\
  \ who make at least 10 transactions per month. The marketing team wants to analyze\
  \ the effectiveness of this program and its impact on customer behavior.\n\nUsing\
  \ diagnostic analytics, the team can ask the following questions:\n\n*   Did the\
  \ cash-back program lead to an increase in customer transaction volume?\n*   Are\
  \ specific types of transactions more likely to result in customers making 10 or\
  \ more transactions per month?\n*   Are there specific customer segments more likely\
  \ to take advantage of the cash-back program?\n\nBy analyzing transaction data and\
  \ other customer data, the team might discover that certain types of transactions\
  \ (such as bill payments or online shopping) are more likely to drive customers\
  \ to make at least 10 transactions per month. They might also find that certain\
  \ customer segments (such as younger or tech-savvy customers) are more likely to\
  \ engage with the cash-back program.\n\nBy answering these questions, the team can\
  \ make data-driven decisions to optimize the cash-back program to encourage more\
  \ transactions and drive revenue growth for the mobile banking platform.\n\nA use\
  \ case for diagnostic analytics is determining the reasons behind product demand.\
  \ Continuing with the pizza chain example:\n\n**Why did online orders decrease last\
  \ quarter?**\n\n*   Technical issues on the website or mobile app caused customer\
  \ frustration, leading to reluctance to use the platform.\n*   Reduced marketing\
  \ efforts for the online channel compared to other channels, such as in-store promotions\
  \ or targeted advertising.\n*   A decrease in the quality or variety of menu items\
  \ available for online ordering compared to in-store purchases, leading to reduced\
  \ customer interest.\n\nOther questions the team might ask include:\n\n*   Why do\
  \ a few specific stores have the lowest sales?\n*   How do promotions and offers\
  \ affect overall sales?\n*   What factors influence repeat customer purchase frequency?\n\
  *   What causes a high number of returns or complaints for certain pizza toppings?\n\
  *   Why are in-store sales lower during certain times of the day?\n\nNow, let's\
  \ look at a few examples of questions a marketing team might ask when using diagnostic\
  \ analytics to evaluate their campaigns:\n\n*   Why is the click-through rate (CTR)\
  \ for our Facebook ads lower than expected?\n*   Which specific elements of our\
  \ landing page drive higher conversion rates?\n*   Why do customers add items to\
  \ their cart on our e-commerce site but not complete the checkout process?\n*  \
  \ What are the common characteristics of customers who churn after signing up for\
  \ our subscription service?\n*   Which elements of our social media strategy drive\
  \ higher engagement, and which fail to resonate with our audience?\n\nThus, we have\
  \ seen how diagnostic analytics allows you to uncover the underlying causes and\
  \ factors leading to data trends.\n\n#### Predictive Analytics\n\n\n\n\n\n#### 预测分析\n\
  \n预测分析涉及使用数据分析、统计模型和机器学习技术来识别模式并预测潜在的未来结果或事件，为“未来可能发生什么？”这一问题提供洞察。预测分析通过分析过去和现在的数据来预测未来行为。下图描绘了预测分析为组织增加商业价值的阶段。\n\
  \n![](img/Figure1.8.jpg)\n\n**图 1.7：** 为组织增加价值。第 3 阶段：预测分析\n\n预测分析在众多行业中有着广泛的应用，包括但不限于银行业、零售业、公用事业、公共部门、医疗保健和制造业。它可用于改善业务运营、增加收入并有效管理风险。\n\
  \n利用预测分析，可以检测交易数据中可能表明欺诈活动的模式。通过分析历史数据并应用机器学习算法，银行可以构建预测模型，帮助实时识别潜在的欺诈交易，从而在造成损失前采取行动。机器学习算法在预测欺诈交易时可考虑的几个特征包括：确定账户的历史行为、设备是否为虚拟机或模拟器、确认地理位置不匹配、设备类型/操作系统/屏幕分辨率不匹配，以及与其他设备和账户的关联。\n\
  \n一家披萨连锁店可以使用预测分析来按半小时间隔预测各渠道的披萨销量。公司可以分析历史销售数据、销售点、消费者行为、营销活动绩效以及外部因素（如天气、竞争对手和社交媒体活动），以构建预测模型来预测需求。例如，公司可能预测在大型体育赛事期间意大利辣香肠披萨的销量将会增加，并相应地调整其生产和库存水平以满足预期需求。预测分析还可以帮助公司优化定价策略，通过最大限度地减少过度生产来最大化收入并减少浪费。\n\
  \n下图展示了机器学习如何准确建模产品的价格弹性。因此，例如，我们可以看到产品降价对销量的影响程度。\n\n![](img/Figure1.9.png)\n\n\
  **图 1.8：** 价格下降时需求增加\n\n营销团队使用预测分析根据客户的行为和偏好将其细分为不同群体。通过分析购买历史、浏览行为、人口统计信息和其他相关因素等客户数据，团队可以识别模式并预测不同客户最可能对哪类产品或服务感兴趣。然后，他们可以针对每个细分群体定制营销活动，创建更有可能引起每个群体共鸣的个性化内容和优惠。\n\
  \n例如，营销团队可能会使用预测分析根据客户购买高端产品的可能性、首选沟通渠道或对特定类型促销的兴趣将其细分为不同群体。这有助于团队优化营销工作，提高客户参与度，并最终推动更多转化。\n\
  \n#### 处方分析\n\n处方分析涉及使用数据来确定最佳行动方案。这种分析会考虑所有相关因素，并为后续步骤提供建议。因此，处方分析是做出数据驱动决策的宝贵工具。它有助于回答“下一步该采取什么措施？”这一问题。下图展示了为组织增加商业价值的第四个也是最后一个阶段，即处方分析。\n\
  \n![](img/Figure1.10.jpg)\n\n**图 1.9：** 为组织增加价值。第 4 阶段：处方分析\n\n处方分析可应用于营销中的定价策略。例如，公司可能会利用历史销售数据和竞争定价信息来开发一个最大化收入和利润率的定价模型。公司可以使用处方分析测试各种定价场景，以确定最佳定价策略。该模型可能会考虑季节性、产品需求、客户行为和竞争格局等因素。基于这些因素，模型可能会为不同的产品、市场或客户群体推荐不同的定价策略。公司可以利用这些建议做出数据驱动的定价决策，并随着市场条件的变化随时调整其定价策略。\n\
  \n![](img/Figure1.11.png)\n\n**图 1.10：** 社交媒体平台推荐示意图\n\n上图展示了社交媒体推荐的示意图。社交媒体平台可以使用推荐引擎，根据用户的过去行为，为用户提供下一步消费什么内容的处方建议。例如，如果用户对健身内容感兴趣，推荐引擎可能会建议他们关注的健康与健身影响者发布的健身视频或健康食谱帖子。通过使用处方分析，社交媒体平台可以提高用户参与度并增加在平台上花费的时间，从而通过广告和其他变现策略获得更高的收入。\n\
  \n尽管算法可以提供数据驱动的指导，但它们无法替代人类的判断。处方分析应被视为支持决策和策略的工具，而非取代人类的洞察力。尽管如此，必须记住，你的判断对于提供背景和为算法输出设定边界至关重要。\n\
  \n无论是否使用算法，人类的判断仍然至关重要，因为算法的准确性和公正性仅取决于其训练数据的质量。\n\n### 结论\n\n本章讨论了数据驱动型组织如何利用数据科学创造更好的客户体验，并做出更快、更好的决策。然而，要充分发挥数据科学的潜力，组织需要确定要解决的正确业务问题。虽然数据分析和编码技能对数据科学家很重要，但他们还必须具备讲故事的技巧、批判性思维和对可视化展示的敏锐洞察力。此外，了解数据分析的四种主要类型——描述性、诊断性、预测性和处方性——对于从数据中获得最有价值的见解非常重要。\n\
