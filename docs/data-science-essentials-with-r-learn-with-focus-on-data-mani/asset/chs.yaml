  # 第 12 章 在数据科学领域建立职业生涯\n\n### 简介\n\n在数据科学领域建立职业生涯，就像踏上一场长达十年的冒险，途中充满了曲折，让旅程始终保持趣味。前方的道路可能并不总是清晰可见，但这正是旅程刺激的部分。随着数据科学的迅猛发展，对\
