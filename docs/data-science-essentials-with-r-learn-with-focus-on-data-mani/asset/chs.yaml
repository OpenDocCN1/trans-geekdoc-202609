  \n![fm1](img/fm1.png)\n\n## 第 10 章：机器学习导论\n\n### 简介\n\n与普遍看法相反，数据科学家的角色不仅限于开发和调优机器学习模型。实际上，他们的工作很大一部分涉及模型开发之前的任务，例如理解业务挑战并将其转化为数据驱动的问题。数据科学家花费大量时间收集、清洗和转换原始数据，使其成为适合分析的格式。这一关键的准备工作为有效的模型构建奠定了基础，并确保生成的洞察具有相关性和可操作性。判断机器学习是否为解决特定问题的合适方法，需要仔细考量。为协助这一过程，我们将概述一个评估机器学习可行性的分步指南。\n\
  \n### 结构\n\n在本章中，我们将了解以下主题：\n\n*   机器学习基础\n*   界定机器学习问题\n*   机器学习系统类型\n    *   监督学习\n\
  \    *   无监督学习\n    *   强化学习\n    *   生成式 AI\n*   机器学习算法的主要挑战\n\n### 目标\n\n在本章中，您将理解基本的机器学习概念。首先，您将探索如何定义并判断一个问题是否值得通过机器学习来解决。我们将阐明使用机器学习算法解决问题与传统方法之间的区别。随后，本书将指导您根据业务需求选择最合适的机器学习模型，并提供对各类机器学习系统的深入见解。最后，它将提请您关注机器学习算法固有的根本挑战，以便您在实施过程中能有效应对和解决它们。\n\
  \n### 机器学习基础\n\n机器学习通过赋能翻译应用和自动驾驶汽车等技术，彻底改变了我们生活的各个方面。机器学习为问题求解、问答以及内容/图像创作提供了一种通用的方法。它使系统能够预测客户流失、估算行程时长、推荐电影、自动补全句子、总结书籍或生成图像。\n\
  \n机器学习是利用历史数据训练模型以做出有价值的预测或生成内容的过程。模型是各变量间存在关系的数学表示或规范。\n\n设想一个场景，任务是开发一个金融交易欺诈检测系统。在传统方法中，人们可能依赖基于规则的系统和预定义标记来标记潜在的欺诈活动。这种常规方法需要根据历史欺诈模式制定复杂的规则，涉及对各种欺诈指标的深入理解。该过程可能耗时较长，且存在忽视新出现的、不符合预设规则的欺诈手段的风险。\n\
  \n另一方面，采用机器学习方法涉及使用包含各种交易特征及其对应欺诈标签的海量数据集来训练模型。机器学习模型从数据中学习模式和异常，从而能够适应新的和以前未见过的欺诈模式。与传统方法静态且受规则束缚的性质不同，机器学习模型擅长识别那些可能未被显式编程的新欺诈模式。\n\
  \n面对新交易时，机器学习模型可基于学习到的模式自主评估欺诈的可能性。这种自主性提供了一种更动态、更适应性强的解决方案，因为模型无需人工干预更新预定义规则，即可适应新出现的欺诈趋势。\n\
  \n机器学习在以下各种场景中极具优势：\n\n*   **需要大量微调或复杂规则集的问题**\n    在现有解决方案涉及冗长规则列表的情况下，机器学习算法提供了一种精简的替代方案。机器学习将复杂的规则集整合为高效的模型，提高了代码清晰度和性能。\n\
  *   **涉及波动环境的问题**\n    机器学习系统展现出对变化数据和环境的适应性。它们从新信息中学习的能力使其能够调整和进化，在条件多变的场景中尤为宝贵。\n\
  *   **无满意传统解决方案的复杂问题**\n    机器学习擅长解决常规方法难以提供有效解决方案的复杂问题。\n\n### 界定机器学习问题\n\n机器学习问题界定是任何成功机器学习项目开发中的关键步骤。它涉及分析问题以识别需解决的关键要素，从而有效解决问题。此过程有助于确定项目的技术可行性，并提供一组明确的目标和成功标准。在机器学习背景下，问题界定尤为重要，有助于确保所开发的解决方案针对手头问题的特定需求量身定制。\n\
  \n机器学习问题界定的第一步是确定机器学习是否为解决特定问题的正确方法。这涉及评估问题的特征，并判断机器学习能否有效解决该问题。如果机器学习合适，第二步是用机器学习术语界定问题。这包括将问题分解为几个部分、识别相关特征和标签，以及定义机器学习算法寻求优化的目标函数。\n\
  \n让我们仔细看看我们理解和定义问题的方法论。\n\n*   **明确定义目标：** 从用简单语言清晰定义您的目标开始，不包含任何机器学习相关的表述。目标应回答“我想达成什么？”这个问题。\n\
  \n下表展示了一些示例：\n\n| 应用 | 目标 |\n| --- | --- |\n| 健身追踪器 | 估算不同活动消耗的卡路里并提供个性化健身见解 |\n\
  | 音乐流媒体应用 | 基于用户偏好生成播放列表 |\n| 农业应用 | 优化灌溉时间表并预测潜在作物病害 |\n| 睡眠追踪应用 | 通过提供个性化建议提升睡眠质量\
  \ |\n| 个人理财 | 通过预测潜在支出并建议预算调整，提供主动理财建议 |\n| 求职应用 | 将求职者与相关职位空缺匹配 |\n| 旅行应用 | 通过预测地点间精准行程时间来优化旅行应用\
  \ |\n\n表 10.1：为各类应用明确定义业务目标\n\n\n\n#### 机器学习问题定义与数据要求\n\n#### 何时使用机器学习\n\n虽然有人认为机器学习（ML）是一种适用于所有类型业务问题的通用工具，但现实是\
  \ ML 是为解决特定问题而设计的专用工具。必须避免在更简单的非 ML 方法足以解决问题时，实施复杂的 ML 解决方案。\n\n为确保 ML 是最佳方法，请在投资\
  \ ML 替代方案前，彻底评估现有非 ML 解决方案的性能。请考虑以下问题以确定是否需要 ML 解决方案：\n\n*   **量化预期改进**：与现有（已优化的）非\
  \ ML 解决方案相比，ML 解决方案能否带来显著影响？较小的收益可能意味着应坚持当前方法。\n*   **成本对比**：审视 ML 解决方案相关的短期和长期费用。ML\
  \ 实施可能在计算资源和时间方面产生巨大成本。\n*   **成本效益论证**：在大型系统中，即使 ML 带来的微小改进也能转化为显著收益，从而抵消实施和维护成本。\n\
  *   **维护考量**：ML 模型通常需要专人负责监控、重新训练和潜在调试。评估团队是否具备长期维护所需的资源和专业知识。\n\n#### 训练数据质量要求\n\
  \n用于训练的数据质量在决定模型准确性和有效性方面起着至关重要的作用。为创建稳健可靠的模型，数据应具备以下关键特征：\n\n*   **数据量与相关性**：数据集中相关且有价值的示例越多，模型越稳健。更大的数据集为模型提供了更广泛的泛化空间，并提升其预测能力。\n\
  *   **数据收集可靠性**：数据收集流程应当合理，并应尽力减少数据录入、存储和处理过程中的错误。一致可靠的数据集使模型能够学习有意义的模式，降低偏差风险。\n\
  *   **标注准确性**：虽然大型数据集中难免存在少量标注错误，但高比例的错误标签会严重损害模型性能。确保标注准确对于构建产生可信预测的模型至关重要。\n*\
  \   **真实世界代表性**：数据集应尽可能贴近被建模的真实场景。这意味着要捕捉实际环境中发生的相关事件、用户行为和其他现象。这样模型才能适应现实世界的变化和变体，在预测时表现更佳。\n\
  \n满足这些数据要求对于创建强大且可靠的预测性 ML 模型不可或缺。\n\n#### 特征预测能力\n\n为使模型生成准确预测，数据集中的特征必须具备显著的预测能力。特征与其对应标签之间的相关程度直接影响其预测准确性。相关性越高，该特征作为给定标签的可靠预测指标的可能性越大。\n\
  \n在**医疗患者再入院预测**场景中，不同特征表现出不同程度的预测能力。`previous_hospitalizations`、`medication_compliance`\
  \ 和 `age` 等特征可能具有较高的预测能力。既往住院次数可反映患者健康史，`medication_compliance` 反映治疗依从性，`age` 可成为预测再入院风险的关键因素。另一方面，`patient_gender`\
  \ 和 `day_of_week` 等特征预测能力可能较低。\n\n然而，必须认识到特征的预测能力可能依赖于上下文。在医疗保健的特定子领域中，通常预测能力较低的特征可能变得更有影响力。因此，理解特征相关性在不同语境或领域中的动态性质，对于构建准确且符合语境的预测模型至关重要。\n\
  \n#### 以机器学习术语定义问题\n\n现在，让我们将 ML 模型的目标与表 10.1 中概述的业务目标对齐。\n\n**表 10.2：以 ML 术语定义目标**\n\
  \n| 应用 | 目标 | ML 模型目标 |\n| :--- | :--- | :--- |\n| 健身追踪器 | 估算不同活动消耗的卡路里并提供个性化健身洞察\
  \ | 开发 ML 模型分析用户运动数据，结合心率、时长、活动类型等因素，准确估算消耗卡路里并提供个性化健身建议。 |\n| 音乐流媒体应用 | 根据用户偏好生成播放列表\
  \ | 实现推荐系统分析用户收听行为、偏好和上下文线索，生成符合用户不断变化偏好的动态播放列表。 |\n| 农业应用 | 优化灌溉时间表并预测潜在作物病害 |\
  \ 开发 ML 模型分析环境数据（包括天气模式和土壤条件）以优化灌溉时间表。此外，利用历史和实时数据创建预测模型识别潜在作物病害。 |\n| 睡眠追踪应用 |\
  \ 通过提供个性化建议提升睡眠质量 | 分析睡眠模式、环境条件和用户反馈，提供改善睡眠质量的个性化建议（如调整就寝习惯或优化睡眠环境）。 |\n| 个人理财 |\
  \ 通过预测潜在支出并建议预算调整，提供主动理财建议 | 分析用户财务行为，识别模式，预测潜在支出。通过建议预算调整并提供未来财务趋势洞察，给出主动理财建议。\
  \ |\n| 求职应用 | 将求职者与相关职位匹配 | 实现 ML 算法，基于求职者技能、经验、偏好及其他相关因素，准确匹配相关职位，提升求职流程的效率和有效性。\
  \ |\n| 旅行应用 | 通过预测地点间准确行程时间来增强旅行应用 | 实现 ML 模型，利用历史行程数据、实时交通信息及其他相关因素，预测指定地点间的行程时间。\
  \ |\n\n#### 选择 ML 模型类型\n\n决定使用哪种类型的 ML 模型并非“一刀切”的情况。模型的输出需要满足您期望的结果。因此，第一个关键问题是：**什么样的输出能有效解决我的问题？**\n\
  \n*   如果目标涉及**分类**或**数值预测**，预测性 ML 可能是合适的选择。\n*   如果任务涉及**生成新内容**、**翻译语言**或**创建类人对话**，生成式\
  \ AI 将是恰当的选择。\n\n接下来，您需要定义关键绩效指标（`KPIs`），以衡量 ML 实施的成功与否。这些 `KPIs` 应与项目目标对齐，并传达最重要的方面，如提升用户体验、增加参与度或促进适当行动。成功指标示例包括：\n\
  \n*   **参与度**：追踪用户与平台交互的时长、推荐项目的点击次数或回访频率。\n*   **转化率**：监控采取期望行动的用户比例，如购买产品、注册服务或完成任务。\n\
  *   **时间节省**：评估 ML 实施在多大程度上减少了用户搜索相关内容或解决问题所花费的时间。\n*   **成本效益**：计算利用 ML 技术实现的成本节约。此评估可能需要对比实施\
  \ ML 系统的支出与传统人工流程的相关成本。\n\n\n\n\n### Types of Machine Learning Systems\n\nMachine\
  \ learning systems can be categorized based on their learning methods, which determine\
  \ how they make predictions or generate content:\n\n*   Supervised Learning\n* \
  \  Unsupervised Learning\n*   Reinforcement Learning\n*   Generative AI\n\n####\
  \ Supervised Learning\n\nIn supervised learning, algorithms are trained on datasets\
  \ containing input data and corresponding output labels. The goal is for the algorithm\
  \ to learn the relationship between the input data and the correct output labels,\
  \ enabling it to make accurate predictions on new, unseen data. It is called \"\
  supervised\" learning because humans provide labeled data to the algorithm, guiding\
  \ it toward the correct solution.\n\nSupervised learning encompasses two types of\
  \ tasks: regression and classification.\n\n##### Regression\n\nRegression models\
  \ predict numerical values based on input features. Their primary objective is to\
  \ establish a relationship between input features and a target variable, allowing\
  \ for accurate prediction of numerical outcomes. For example, predicting house prices\
  \ based on a set of features (location, size, number of bedrooms, etc., known as\
  \ predictors) (Figure 10.1). To train a model for this task, you need a diverse\
  \ dataset with many house samples containing both the predictors (features) and\
  \ their corresponding labels (prices).\n\n![Figure 10.1: Regression task example\
  \ - predicting house prices based on house size](img/Figure10.1.png)\n\nThe table\
  \ below lists more examples of regression tasks.\n\n| Target | Potential Input Variables\
  \ | Predicted Numerical Outcome |\n| --- | --- | --- |\n| Stock Price Prediction\
  \ | Historical stock prices, trading volume, economic indicators, company financials,\
  \ news sentiment | Price of a specific stock |\n| Energy Consumption Forecasting\
  \ | Historical energy usage, temperature, day of week, time of day | Energy consumption\
  \ in kWh |\n| Crop Yield Estimation | Soil quality, weather conditions, irrigation\
  \ levels, historical yield data | Yield in bushels |\n| Website Traffic Forecasting\
  \ | Historical website traffic, marketing campaign data, seasonal trends | Expected\
  \ website visits |\n| Air Quality Prediction | Air pollution levels, meteorological\
  \ data, historical air quality indices | Air quality index for a specific area |\n\
  \nTable 10.3: Regression Task Examples\n\n##### Classification\n\nClassification\
  \ models are a subset of supervised learning algorithms used to predict the likelihood\
  \ that an instance belongs to a specific category or class. Unlike regression models,\
  \ which output numerical values, classification models output values indicating\
  \ whether an item belongs to a specific category.\n\nClassification models fall\
  \ into two categories: binary classification and multi-class classification. In\
  \ binary classification, the model generates a value from a category with only two\
  \ possibilities. For example, a model might predict whether a transaction is fraudulent\
  \ or not fraudulent (Figure 10.2). Multi-class classification involves making predictions\
  \ from multiple categories. For example, classifying weather conditions as sunny,\
  \ cloudy, rainy, or snowy.\n\n![Figure 10.2: Classification task example - predicting\
  \ if a transaction is fraudulent](img/Figure10.2.png)\n\nThe table below shows several\
  \ classification task scenarios:\n\n| Target | Potential Input Variables | Predicted\
  \ Classification Outcome |\n| --- | --- | --- |\n| Customer Churn Prediction | Customer\
  \ demographics, purchase history, support interactions, feedback | Churn (Yes/No)\
  \ |\n| Email Spam Classification | Email content, sender information, historical\
  \ spam data | Spam (Yes/No) |\n| Loan Approval Prediction | Applicant credit score,\
  \ income, debt-to-income ratio, employment status, loan amount requested | Loan\
  \ Approved (Yes/No) |\n| Customer Segment Identification | Purchase history, demographics,\
  \ website interactions | Customer Segment Category: e.g., Premium, Standard, New\
  \ |\n| Customer Subscription Prediction | Customer activity, usage patterns, engagement\
  \ with subscription-related features | Subscribed (Yes/No) |\n\nTable 10.4: Classification\
  \ Task Examples\n\n#### Unsupervised Learning\n\nIn unsupervised learning, training\
  \ data lacks explicit labels, requiring the model to learn patterns and structures\
  \ without explicit guidance. Unlike supervised learning, there are no labeled outputs\
  \ to guide the model's learning process. This approach is particularly useful when\
  \ exploring and understanding the inherent complexities and relationships within\
  \ a dataset, especially when labeled examples are unavailable or difficult to obtain.\n\
  \nA common technique in unsupervised learning is clustering, where the model identifies\
  \ natural groupings in data by finding data points that share common characteristics\
  \ or patterns. Figure 10.3 illustrates a clustering schematic:\n\n![Figure 10.3:\
  \ Clustering - Unsupervised Learning](img/Figure10.3.png)\n\nBesides clustering,\
  \ there are several other unsupervised learning tasks. One is anomaly detection,\
  \ which identifies data points that deviate significantly from the majority of the\
  \ data. Anomaly detection can be used for applications like fraud detection, network\
  \ intrusion detection, and manufacturing defect identification. Another task is\
  \ dimensionality reduction, which reduces the number of features in a dataset while\
  \ retaining the most important information. Dimensionality reduction can also be\
  \ used for visualizing high-dimensional data.\n\n#### Reinforcement Learning\n\n\
  Reinforcement Learning (RL) is a branch of machine learning where algorithms learn\
  \ by interacting with an environment. RL models learn through exploration, taking\
  \ actions, and receiving feedback in the form of rewards or penalties. The goal\
  \ of RL is for the agent to discover a policy—a set of rules dictating the best\
  \ action to take in different situations—to maximize cumulative reward.\n\nReinforcement\
  \ learning has been successfully applied to various tasks, such as training robots\
  \ to perform manipulation tasks like grasping and pouring, and navigating unknown\
  \ environments. It is also used to recommend products or content based on user interactions,\
  \ and to develop AI agents capable of achieving professional-level play in games\
  \ like poker.\n\n#### Generative AI\n\nGenerative AI models are deep learning algorithms\
  \ capable of creating various types of content—such as images, music, articles,\
  \ and even videos—using user input. A key advantage of generative AI is its ability\
  \ to handle diverse inputs and outputs. For example, a model can accept text and\
  \ images as input and generate video as output, or accept an image as input and\
  \ generate a descriptive text caption.\n\n\n\n\n### 生成式 AI 应用利用基础模型\n\n生成式 AI 应用利用基础模型，这些模型在海量多样化数据上进行了广泛训练。此类基础模型的一个例子是大语言模型（`LLMs`），专门经过训练以处理和生成基于文本的内容。它们可以高效执行广泛的下游任务，例如问答、摘要生成和开放式内容生成。`LLMs`\
  \ 可帮助企业分析数据并自动化与语言相关的任务，如报告生成。这不仅节省了宝贵的时间和资源，还提高了准确性和效率。此外，还有多模态基础模型，它们在图像、软件代码或视频上进行训练。\n\
  \n### ML 算法的主要挑战\n\nML 算法有潜力发挥高效作用，但其成功取决于一个关键因素：高质量数据。然而，获取充足、准确且相关的数据对开发者来说可能是个障碍，这使得创建可靠高效的\
  \ ML 模型变得具有挑战性。让我们看看一些主要挑战：\n\n#### 数据量不足\n\n训练 ML 模型的基本要求之一是大量数据。数据不足会阻碍模型学习复杂模式的能力。\n\
  \n**解决方案：** 您可以使用数据增强等技术，或生成合成数据，以增加可用数据的数量和多样性。\n\n#### 低质量数据\n\n低质量数据会严重削弱 ML\
  \ 算法的性能。嘈杂、缺失或错误的数据可能导致模型产生偏差，无法捕捉数据中的潜在模式。在低质量数据上训练的模型可能会产生不准确且不可靠的预测。\n\n**解决方案：**\
  \ 实施稳健的数据预处理技术，如清洗、过滤和插补，以提高数据质量。进行彻底的探索性数据分析（`EDA`），以识别并处理异常值和离群点。\n\n#### 无关特征\n\
  \n对预测或结果无贡献的特征会稀释模型性能。在训练数据中包含此类特征会引入噪声和复杂性。\n\n**解决方案：** 执行特征选择或提取技术，以识别并仅保留最相关的特征。\n\
  \n#### 有偏训练数据\n\n如果训练数据不能准确反映现实世界中数据的分布，模型可能无法很好地泛化到新的、未见过的数据。训练集中的偏差可能导致预测和决策产生偏差。\n\
  \n**解决方案：** 持续审查并刷新训练数据集，以确保它们始终代表应用领域。\n\n#### 欠拟合\n\n当模型过于简单，无法捕捉训练数据中的潜在模式时，就会发生欠拟合。这会导致性能不佳，因为模型未能学习数据集中固有的复杂性。\n\
  \n**解决方案：** 您可以使用更高级的算法，或向数据集添加更多重要特征。\n\n#### 过拟合\n\n当模型过于复杂，从训练数据中捕捉到了噪声和无关细节时，就会发生过拟合。这导致缺乏泛化能力，即模型在训练集上表现良好，但在新的、未见过的数据上表现不佳。\n\
  \n**解决方案：** 通过简化模型、使用正则化技术，或增加训练数据集的大小和多样性来解决过拟合问题。\n\n### 结论\n\nML 是一个快速发展的领域，有潜力改变众多行业，并彻底改变我们的生活和工作方式。在本章中，我们探讨了\
  \ ML 的基本构建模块，探索了如何有效构建 ML 问题，并了解了可用的不同类型的 ML 系统。此外，我们还检视了 ML 算法的主要挑战，如欠拟合、过拟合和数据质量问题。在下一章中，我们将了解如何在\
  \ R 语言中实现不同的 ML 算法。\n\n### 加入我们书籍的 Discord 空间\n\n加入书籍的 Discord 工作区，获取最新动态、优惠、全球科技动态、新版本发布及作者见面会：\n\
  \n[`discord.bpbonline.com`](https://discord.bpbonline.com)\n\n![](img/fm1.png)\n\
  \n## 第 11 章：训练机器学习模型\n\n### 简介\n\n训练有效的 ML 模型是更广泛的机器学习生命周期的核心组成部分。本章将概述几种基本的建模技术和概念。我们将从探索线性回归开始，这是一种广泛用于建模因变量与一个或多个自变量之间关系的方法。在此基础上，我们将了解逻辑回归，它用于估计二元结果概率的二分类任务。超越线性模型，讨论将转向决策树，它通过递归划分特征空间为区域来捕捉复杂和非线性关系。然而，这些模型的强大功能也伴随着过拟合的风险，这凸显了理解偏差-方差权衡及其对模型性能影响的重要性。扎实掌握这些基本的\
  \ ML 概念将帮助您理解权衡，并有效利用每种方法的优势。\n\n### 结构\n\n本章将涵盖以下主题：\n\n*   机器学习生命周期\n*   线性回归\n\
  \    *   数据拆分\n    *   回归评估指标\n    *   使用线性回归预测 ETA\n*   逻辑回归\n    *   逻辑回归的似然函数\n\
  \    *   分类评估指标\n    *   使用逻辑回归预测贷款违约\n    *   线性模型的局限性\n*   决策树\n*   偏差-方差权衡\n\
  *   聚类\n    *   K 均值聚类\n\n### 目标\n\n本章涵盖与模型训练和评估相关的几个关键主题。首先，将讨论线性回归和逻辑回归的基础知识，重点介绍其用例和底层数学原理。接下来，我们将讨论决策树以及如何利用它们解决各种\
  \ ML 问题。将引入偏差-方差权衡的概念，解释其如何影响模型性能，以及在训练过程中寻找恰当平衡的重要性。最后，我们将深入探讨无监督学习技术 K 均值聚类，并了解如何使用它来发掘数据中隐藏的模式和结构。全章将提供实际示例和真实应用，以加深对这些基本\
  \ ML 模型和技术的理解。\n\n### 机器学习生命周期\n\n让我们开始了解 ML 生命周期的各个阶段。图 11.1 展示了 ML 生命周期阶段。\n\n\
  ![](img/Figure11.1.png)\n\n**图 11.1：** ML 生命周期\n\n各阶段详细解释如下。\n\n*   **确定业务目标：**\
  \ 任何机器学习项目的第一步是确定您试图解决的问题。明确定义您旨在解决的业务问题，并量化预期收益。建立可衡量的目标和成功标准，以确保 ML 项目与组织的整体战略保持一致。\n\
  *   **构建 ML 问题：** 通过识别输入（特征）和期望输出（目标变量），将业务问题转化为机器学习问题。确定用于评估模型成功的误差指标。\n*   **收集数据：**\
  \ 下一步是收集和汇集与问题相关的数据。这可能涉及从各种来源收集数据，如数据库、API、文件和传感器。\n\n\n\n\n\n### 数据预处理\n\n收集数据后，必须对其进行处理以准备用于机器学习。这可能涉及清洗数据、处理缺失值、归一化数据，以及将数据转换为合适的格式。预处理是关键步骤，因为它会显著影响机器学习模型的准确性。\n\
  \n### 特征工程\n\n特征工程是从现有数据创建新特征的过程，有助于提高机器学习模型的性能。这可能涉及创建衍生特征、组合现有特征，以及从数据中提取相关信息。\n\
  \n### 训练机器学习模型并评估\n\n选择合适的算法，并在训练数据集上训练模型。使用与问题相关的指标以及泛化能力，在测试数据集上评估模型的性能。\n\n###\
  \ 模型部署\n\n评估模型后，您可以将其部署到生产环境，用于为业务创造价值。部署可能涉及将模型与现有系统集成、创建 API 端点、监控模型性能，并根据需要进行更新。\n\
  \n### 监控\n\n必须随时间监控机器学习模型的性能，以确保其保持准确和相关。建立监控系统，确保模型保持其预期的性能水平。快速检测并解决任何性能下降或异常，以维持模型的准确性和相关性。\n\
  \n### 线性回归\n\n线性回归是一种用于预测连续结果变量的统计技术。尽管历史悠久，线性回归在现代数据分析中仍是一种流行且有效的方法。\n\n线性回归的核心思想是构建一个线性模型，以捕捉因变量（`Y`）与一个或多个自变量（`X`）之间的关系。该模型通过计算输入特征的加权和，加上一个称为偏置或截距的常数项，来预测给定\
  \ `X` 时 `Y` 的期望值。数学上可表示为：\n\n```\nY = β₀ + β₁x₁ + β₂x₂ + ... + βₙxₙ + ε\n```\n\n\
  其中：\n\n*   `Ŷ` 是预测的结果变量\n*   `β₀` 是偏置项，表示当所有 `X` 变量均等于零时 `Y` 的基准值\n*   `β₁` 是与 `x₁`\
  \ 相关的权重，决定了在保持其他 `X` 变量不变时，`x₁` 每变化一个单位 `Y` 所发生的变化\n*   `x₁` 是单个特征或输入变量\n\n要训练机器学习模型，我们使用带标签的示例来确定权重和偏置的最优值。在监督学习中，机器学习算法通过分析大量示例并识别出一个使损失最小化的模型来构建模型。损失是对不准确预测的惩罚，用一个数值表示单个示例中错误的程度。理想情况下，模型的预测完美无缺，损失为\
  \ 0。然而，如果预测不完美，损失就会增大。训练模型的目标是找到一组权重和偏置，使其在所有示例上的损失较低。\n\n我们的目标是获得系数估计，并确保线性模型很好地拟合可用数据。我们可以基于\
  \ `X` 的值表达对 `Y` 的预测为：\n\n```\nŷᵢ = β₀ + β₁xᵢ\n```\n\n残差（`eᵢ`）是观测响应值（`yᵢ`）与预测响应值（`ŷᵢ`）之间的差异。残差（`eᵢ`）计算公式为\
  \ `eᵢ = yᵢ - ŷᵢ`。\n\n在线性回归中，成本函数通常定义为均方误差（MSE）。MSE 测量预测值与实际值之间平方差的平均值。\n\n```\n\
  MSE = (1/n) Σ(yᵢ - ŷᵢ)²\n```\n\n最小化 MSE 有助于确保线性模型准确捕捉数据中的潜在模式，并为新观测值提供合理的预测。\n\n\
  线性回归模型基于若干假设，必须满足这些假设才能确保模型预测的有效性。以下是线性回归的一些关键假设：\n\n*   假设自变量与因变量之间的关系是线性的。\n*\
  \   观测值必须相互独立。\n*   假设残差的方差在自变量的所有水平上是恒定的。当误差项的变异性在自变量的不同水平上发生变化时，就会出现异方差性。\n* \
  \  假设残差呈正态分布。\n*   自变量之间不应高度相关。变量间的高度相关性会在模型拟合过程和结果解释中造成困难。\n*   残差不应随时间相互关联。\n\n\
  #### 数据拆分\n\n我们通常将数据集拆分为两个子集：训练集和测试集。训练集用于训练模型。它包含大部分数据，使模型能够学习数据中的模式和关系。另一方面，测试集用于评估模型的性能。下图\
  \ Figure 11.2 展示了数据拆分为两个集合的情况：\n\n![](img/Figure11.2.png)\n\nFigure 11.2: 将数据拆分为训练数据集和测试数据集\n\
  \n现在，让我们讨论一些将数据拆分为训练数据集和测试数据集的最佳实践。\n\n*   首先，确保测试集足够大，以产生统计学上显著的结果。您要避免测试集过小，因为它可能无法准确反映模型的真实性能。根据经验，常见的拆分比例是\
  \ 80% 训练和 20% 测试，但这可能因数据集的大小和复杂性而异。\n*   其次，至关重要的是要避免选取与训练集具有不同特征的测试集。这是因为测试集作为新数据的代理，目标是创建一个能很好地泛化到新的、未见过的数据的模型。\n\
  *   第三，绝不要在测试数据上训练模型，也不要使用测试集的任何信息来影响模型训练。确保测试集在整个模型构建过程中始终与训练集完全分离。数据泄露，即测试集的信息无意中影响了模型，会导致过拟合和误导性的评估指标。\n\
  \n在训练阶段，机器学习算法通过调整模型参数来学习训练数据中的模式。然而，模型可能会过拟合训练数据，意味着它在训练数据上表现良好，但在新的、未见过的数据上表现不佳。为了防止这种情况，我们可以使用验证集在训练过程中评估模型性能并根据需要进行调整。这确保模型不仅仅是记忆训练数据，而是学习能泛化到新数据的有用模式。下图\
  \ Figure 11.3 展示了数据拆分为三个子集的情况：\n\n![](img/Figure11.3.png)\n\nFigure 11.3: 将数据拆分为训练、验证和测试数据集\n\
  \n典型的数据划分工作流包括以下步骤：\n\n1.  将初始数据集拆分为三个子集：训练集、验证集和测试集。常见的拆分比例为 80-10-10% 或 70-15-15%。\n\
  2.  在训练集上训练模型，并在验证集上评估其性能。\n3.  调整模型的任何方面，添加或移除特征，应用正则化技术，甚至构建一个全新的模型。进行修改后，返回步骤\
  \ 2 并继续迭代，直到达到满意的性能。\n\n\n\n\n\n#### 模型选择与评估\n\n一旦达到预期性能，请根据验证集指标选择表现最佳的模型，随后在保留的测试集上对其进行评估，以评估其真正的泛化能力。请记住，不要根据测试集进一步调整模型，因为这样做可能导致性能估计产生偏差。\n\
  \n下图 Figure 11.4 展示了数据划分工作流：\n\n![](img/Figure11.4.png)\n\n**Figure 11.4: Data partition\
  \ workflow**\n\n##### 回归评估指标\n\n以下是回归任务中最常用的一些评估指标：\n\n*   **平均绝对误差**：`MAE` 衡量实际值与预测值之间平均绝对差异。它提供直观的解释，数值越低表示模型性能越好。\n\
  *   **均方误差**：`MSE` 计算实际值与预测值之间平方差的平均值。平方操作会对较大误差施加更重的惩罚，使 `MSE` 对异常值敏感。\n*   **均方根误差**：`RMSE`\
  \ 是 `MSE` 的平方根，提供与目标变量相同单位的可解释度量。与 `MSE` 一样，`RMSE` 惩罚较大误差，但因量纲一致而更具可解释性。\n*   **均方根对数误差**：`RMSLE`\
  \ 衡量预测值与实际值对数的 `RMSE`。当目标变量跨越多个数量级且关注相对误差而非绝对误差时，该指标非常实用。\n*   **平均绝对百分比误差**：`MAPE`\
  \ 计算相对于实际值的实际值与预测值之间平均百分比差异。它以百分比形式表示误差，便于跨不同数据集进行解释和比较。\n\n这些指标用于评估回归模型的性能，帮助确定哪个模型最适合数据。每个指标都有其优缺点，指标的选择取决于具体问题和期望结果。\n\
  \n##### 使用线性回归预测 ETA\n\n以网约车应用为例，准确预测到达时间（`ETA`）是创造满意客户体验的关键组件。可靠的 `ETA` 预测在服务的各个方面发挥着关键作用，例如计算费用、匹配乘客与司机以及规划配送。客户依赖准确的\
  \ `ETA` 做出明智决策并管理预期，平台的成功在很大程度上取决于维护用户满意度和信任。不准确或不可靠的 `ETA` 预测会导致用户沮丧和不满，可能损害平台声誉并对整体业绩产生负面影响。\n\
  \n以下命令读取数据集，并可视化网约车服务中行驶距离与耗时之间的线性关系。数据集 `cab_data.csv` 包含每趟行程的行驶距离及对应耗时信息。\n\n\
  ```\n# Load the required libraries\nlibrary(dplyr)\nlibrary(ggplot2)\nlibrary(ModelMetrics)\n\
  \n# Read the dataset\ncab_data <- read.csv(\"cab_data.csv\")\n\n# Visualize the\
  \ linear relationship between distance and time\nggplot(cab_data, aes(x = Distance,\
  \ y = Time_Taken)) +\n  geom_point(col = \"steelblue4\") +\n  labs(title = \"Linear\
  \ Relationship between Distance and Time\",\n       x = \"Distance (kms)\",\n  \
  \     y = \"Time Taken (minutes)\") +\n  theme_bw()\n```\n\nFigure 11.5 展示了两个变量之间的线性关系。图表表明，随着行驶距离增加，耗时也成比例增加：\n\
  \n![](img/Figure11.5.png)\n\n**Figure 11.5: Relationship between distance and time**\n\
  \n接下来，将数据集划分为训练集和测试集。\n\n```\n# Split data into train and test\nset.seed(123)\n\
  rows = seq(1, nrow(cab_data), 1)\ntrainRows = sample(rows, (80 * nrow(cab_data))\
  \ / 100)\ntrain = cab_data[trainRows, ]\ntest = cab_data[-trainRows, ]\n```\n\n\
  设置随机种子以确保可复现性，并随机抽样行以创建训练集和测试集。具体而言，80% 的行分配给训练集，剩余 20% 分配给测试集。\n\n使用 `lm()` 函数训练线性回归模型。以下代码基于\
  \ `Distance` 变量训练模型以预测 `Time_Taken` 变量。\n\n```\n# Train a linear Regression Model\n\
  lm_time <- lm(Time_Taken ~ Distance, data = train)\n```\n\n公式 `Time_Taken ~ Distance`\
  \ 指定 `Time_Taken` 为响应变量，`Distance` 为预测变量。`data` 参数指定用于训练的数据集。\n\n生成的模型存储在 `lm_time`\
  \ 变量中，可用于对新的未见数据进行预测。`summary` 输出提供了关于线性回归模型性能及响应变量 `Time_Taken` 与预测变量 `Distance`\
  \ 之间关系的宝贵信息。\n\n```\n# Summary of the model\nsummary(lm_time)\n\n## Call:\n## lm(formula\
  \ = Time_Taken ~ Distance, data = train)\n\n## Residuals:\n## Min 1Q Median 3Q Max\
  \ \n## -14.110 -2.708 -0.064 2.734 14.646 \n\n## Coefficients:\n## Estimate Std.\
  \ Error t value Pr(>|t|) \n## (Intercept) 6.49814 0.71935 9.033 <2e-16 ***\n## Distance\
  \ 1.37346 0.06857 20.030 <2e-16 ***\n## ---\n## Signif. codes: 0 '***' 0.001 '**'\
  \ 0.01 '*' 0.05 '.' 0.1 ' ' 1\n\n## Residual standard error: 4.173 on 395 degrees\
  \ of freedom\n## Multiple R-squared: 0.5039, Adjusted R-squared: 0.5026 \n## F-statistic:\
  \ 401.2 on 1 and 395 DF, p-value: < 2.2e-16\n```\n\n**残差** 代表因变量（`Time_Taken`）观测值与模型预测值之间的差异。摘要显示了残差的最小值、第一四分位数、中位数、第三四分位数和最大值。\n\
  \n**系数** 估计线性方程的截距（6.49814）和斜率（1.37346），表明平均而言，每增加一公里行驶距离，耗时约增加 1.37 分钟。\n\n两个系数的\
  \ **p 值** 均高度显著，表明距离与时间之间存在很强的线性关系。\n\n**残差标准误** 代表残差的标准差，约为 4.173。它衡量 `Time_Taken`\
  \ 观测值与预测值之间的典型差异。\n\n**决定系数**（`R²`）量化回归模型中自变量解释的因变量方差比例，并以基线模型（即数据均值的方差）进行归一化。\n\
  \n![](img/eq-8.jpg)\n\n`R²` 值为 1 表示模型捕获了 100% 的方差，而负 `R²` 表明模型表现比仅遵循数据均值的简单模型还要差。\n\
  \n**多重 R 平方值**（0.5039）表明，`Time_Taken` 中约 50.39% 的变异性可由与 `Distance` 的线性关系解释。**调整后\
  \ R 平方值**（0.5026）根据模型中的预测变量数量调整 `R²` 值，提供更准确的模型拟合度量。\n\n**F 统计量**（401.2）评估模型的整体显著性。在此例中，F\
  \ 统计量的 p 值极低（< 2.2e-16），表明该模型在预测 `Time_Taken` 方面具有高度整体显著性。\n\n现在，让我们使用 `predict()`\
  \ 函数基于先前拟合训练数据的线性回归模型 `lm_time`，在测试数据集上生成预测。预测值存储在 `predicted_values` 对象中。\n\n```\n\
  # Predict on test set\n```\n\n\n\n\n\n###### 线性回归模型评估\n\n```r\npredicted_values\
  \ <- predict(lm_time, newdata = test)\n```\n\n然后，创建一个新的数据框 `compare_df`，包含两列：`Actual`\
  \ 和 `Predicted`。`Actual` 列代表测试数据集中响应变量 `Time_Taken` 的真实值，`Predicted` 列包含从线性回归模型获得的相应预测值。\n\
  \n```r\n# Create a dataframe with Actuals and Predicted values\ncompare_df <- data.frame(Actual\
  \ = test$Time_Taken, Predicted = predicted_values)\n```\n\n####### 均方根误差 (RMSE)\n\
  \n```r\n# Root Mean Squared Error (RMSE)\nrmse(compare_df$Actual, compare_df$Predicted)\n\
  ```\n\n```\n## 3.974987\n```\n\n####### 平均绝对误差 (MAE)\n\n```r\n# Mean Absolute Error\
  \ (MAE)\nmae(compare_df$Actual, compare_df$Predicted)\n```\n\n```\n## 3.289056\n\
  ```\n\n在这种情况下，RMSE 为 3.975，表明平均而言，模型的预测值与实际值偏离约 3.975 个 `Time_Taken` 单位。与 RMSE 相比，MAE\
  \ 提供了更具可解释性的误差度量。MAE 值 3.29 表明模型的预测值平均与实际值相差约 3.29 个单位。\n\n### 逻辑回归\n\n逻辑回归在生成概率估计作为输出方面非常高效。这些概率可通过以下两种方式使用：\n\
  \n*   直接使用返回的概率，无需任何转换。\n*   根据指定阈值将概率转换为二元类别。\n\n在逻辑回归中，我们建模自变量与因变量处于特定类别的对数几率之间的关系。几率定义为事件发生的概率与不发生的概率之比。\n\
  \n为了计算因变量的概率，我们使用几率。给定一组输入特征 `x1, x2, x3, …, xn`，几率的对数 (`ln(p/(1-p))`)（通常称为 logit\
  \ 函数）可以用以下表达式线性表示：\n\n![](img/eq-9.jpg)\n\n对等式两边取指数，我们得到几率本身：\n\n![](img/eq-10.jpg)\n\
  \n解 `P`，我们推导出逻辑回归的概率估计：\n\n![](img/eq-111.jpg)\n\n#### 示例\n\n考虑这样一个场景：银行希望根据客户的信用评分、负债收入比和年龄，预测其违约贷款的可能性。逻辑回归模型将根据这些输入变量估计违约概率。\n\
  \n![](img/eq-121.jpg)\n\n其中，![](img/eq-41.jpg)、![](img/eq.jpg)、![](img/eq-13.jpg)\
  \ 是模型训练期间估计的系数。\n\n系数 ![](img/eq-41.jpg)、![](img/eq.jpg)、![](img/eq-13.jpg) 代表相应输入变量每增加一个单位，违约对数几率的变化量。正系数表明该变量的增加会导致违约几率升高。这意味着输入变量的较高值与事件发生的较高可能性相关。相反，当与输入变量相关的系数为负时，该变量值的增加会导致事件发生几率下降。这表明输入变量的较高值与事件发生的较低可能性相关。\n\
  \n下图展示了逻辑函数曲线，解释了违约概率与信用评分的关系。\n\n![](img/Figure11.6.png)\n\n**Figure 11.6: 逻辑回归模型预测违约概率**\n\
  \n#### 逻辑回归的似然函数\n\n在逻辑回归中，似然函数用于估计模型参数（系数），以最大化在给定模型下观察到训练数据的概率。由于逻辑回归预测概率，因此它特别适合使用似然函数对二元数据进行建模。\n\
  \n其中，`p(xi)` 是给定输入特征 `xi` 时正类别（在本例中为 Default）的概率。`yi` 是第 `i` 个数据点的类别标签，`n` 是数据点的总数。\n\
  \n似然函数度量在给定输入特征 `xi` 和模型参数 ![](img/eq-33.jpg) 和 ![](img/eq-41.jpg) 的情况下，观察到给定类别\
  \ `yi` 的可能性。逻辑回归模型通常使用最大似然估计 (MLE) 或梯度下降等优化技术进行拟合。这些技术迭代调整回归系数的值以最大化似然函数，从而找到能准确预测观察到的类别的最佳拟合模型参数。\n\
  \n#### 分类评估指标\n\n以下是分类中常用的一些评估指标：\n\n*   **混淆矩阵**：混淆矩阵是一个表格（如表 11.1 所示），通过比较预测类别和实际类别来显示分类器的性能。它包含四个类别：\n\
  \    *   **真阳性 (TP)**：预测类别和实际类别均为阳性。\n    *   **真阴性 (TN)**：预测类别和实际类别均为阴性。\n    *\
  \   **假阳性 (FP)**：实际类别为阴性，但预测类别为阳性。\n    *   **假阴性 (FN)**：实际类别为阳性，但预测类别为阴性。\n\n|\
  \ | Predicted positive | Predicted negative |\n| --- | --- | --- |\n| Actual positive\
  \ | True positive (TP) | False negative (FN) |\n| Actual negative | False positive\
  \ (FP) | True negative (TN) |\n\n**Table 11.1: 混淆矩阵**\n\n*   **准确率**：正确分类实例的比例与总实例数的比值。它衡量分类器做出正确预测的频率。然而，它可能不适用于不平衡数据集，即某些类别的数据点多于其他类别的情况。\n\
  \n![](img/eq-14.jpg)\n\n*   **精确率**：在分类器做出的所有阳性预测中，真阳性预测所占的比例。它指示分类器在预测阳性结果时的准确程度。\n\
  \n![](img/eq-15.jpg)\n\n*   **召回率 (灵敏度或真阳性率)**：在数据集中所有实际阳性实例中，真阳性预测所占的比例。它指示分类器识别阳性实例的能力。\n\
  \n![](img/eq-16.jpg)\n\n*   **F1 分数**：精确率和召回率的调和平均数。它通过结合精确率和召回率，提供了分类器性能的平衡度量。\n\
  \n`F1 Score = 2 * (precision * recall) / (precision + recall)`\n\n*   **AUC (ROC\
  \ 曲线下面积)**：接收者操作特征 (ROC) 曲线在不同分类阈值下绘制真阳性率与假阳性率的关系。AUC 衡量分类器区分阳性和阴性类别的能力。较高的 AUC\
  \ 值表示更好的分类性能。AUC 范围从 0 到 1，其中 0.5 表示随机分类，1 表示完美分类。\n\n下图展示了典型的 ROC 曲线：\n\n![](img/Figure11.7.png)\n\
  \n**Figure 11.7: 典型的 ROC 曲线**\n\nAUC 评估模型的预测能力，而不依赖于选定的分类阈值。这种独立性确保了性能评估在不同决策边界下保持一致。\n\
  \n#### 使用逻辑回归预测贷款违约\n\n\n\n\n\n# 构建用于贷款违约预测的逻辑回归模型\n\n在本节中，我们将构建一个逻辑回归模型来预测贷款违约的发生。预测贷款违约是银行和放贷业务的关键组成部分。放贷人必须评估向借款人发放贷款的潜在盈利能力和相关风险。尽管大多数借款人履行了还款义务，但违约的可能性依然存在，这可能导致放贷人和借款人之间的信任破裂，也会对放贷人的业务构成财务威胁。因此，放贷人在批准贷款申请前，必须准确估算违约概率。\n\
  \n准确的违约预测模型使放贷人能够就贷款审批、定价和风险管理策略做出明智决策。通过利用预测分析，放贷人可以识别高风险借款人，并采取适当措施降低违约可能性。这可能涉及调整贷款条款、要求额外抵押品，或完全拒绝贷款申请。\n\
  \n##### 数据准备\n\n例如：我们将首先读取一个名为 `loan_df.csv` 的 CSV 文件到名为 `loan_df` 的数据框中。然后使用 `as.factor()`\
  \ 函数将数据框中的 `default` 列转换为因子变量，该变量代表二元类别，如违约 (1) 和非违约 (0)。下表描述了数据框 `loan_df` 的列。\n\
  \n| 列名 | 描述 |\n| --- | --- |\n| `credit_score` | 申请贷款的个人的信用评分。 |\n| `debt_to_income_ratio`\
  \ | 个人每月总债务还款额与其月毛收入的比率。 |\n| `age` | 申请贷款的个人的年龄 |\n| `default` | 二元响应变量，指示个人是否违约\
  \ (1) 或未违约 (0)。 |\n\n表 11.2：贷款数据描述\n\n为了探索信用评分与违约之间的关系，我们将首先加载贷款数据集并执行一些初始数据准备步骤。然后我们将创建一个直方图，以可视化违约和非违约情况下信用评分的分布。\n\
  \n```r\n# 读取文件\nloan_df <- read.csv(\"loan_df.csv\")\n\n# 将列 default 的数据类型转换为因子\n\
  loan_df$default <- as.factor(loan_df$default)\n\n# 违约的分布\nggplot(loan_df, aes(x\
  \ = credit_score, fill = default)) +\n  geom_histogram(binwidth = 100, colour =\
  \ \"black\") +\n  labs(title = \"违约 vs. 信用评分\",\n       x = \"信用评分\",\n       y\
  \ = \"频数\") +\n  theme_bw()\n```\n\n下图表明，较高的信用评分对应较低的违约可能性：\n\n![](img/Figure11.8.png)\n\
  \n图 11.8：信用评分分布\n\n##### 模型训练\n\n数据准备就绪后，我们现在将贷款数据集拆分为训练集和测试集，以评估预测模型的性能。然后我们将使用训练集拟合一个逻辑回归模型，该模型基于信用评分、负债收入比和年龄来预测违约的可能性。\n\
  \n```r\n# 将数据拆分为训练集和测试集\nset.seed(123)\nrows = seq(1, nrow(loan_df), 1)\ntrainRows\
  \ = sample(rows, (80 * nrow(loan_df)) / 100)\ntrain = loan_df[trainRows, ]\ntest\
  \ = loan_df[-trainRows, ]\n\n# 训练逻辑回归模型\nLogReg <- glm(default ~ credit_score +\
  \ debt_to_income_ratio + age,\n              data = train, family = binomial)\n\
  ```\n\n首先，使用随机抽样技术将数据集划分为训练集和测试集。`set.seed(123)` 通过固定随机种子来确保可重复性。随后，使用 `glm()` 函数在训练数据上训练逻辑回归模型。公式\
  \ `default ~ credit_score + debt_to_income_ratio + age` 指定了二元结果变量 `default` 与预测变量\
  \ `credit_score`、`debt_to_income_ratio` 和 `age` 之间的关系。\n\n`glm()` 函数用于拟合广义线性模型，这是一大类统计模型，包括逻辑回归。`glm()`\
  \ 函数的语法与 `lm()` 函数（用于线性模型）的语法相似，但有一个关键区别。在执行逻辑回归时，需要指定 `family = binomial` 参数，以告知\
  \ R 运行逻辑回归。\n\n###### 模型摘要\n\n为了了解逻辑回归模型的性能和特征，我们现在将生成模型的摘要。\n\n```r\n###### 模型摘要\n\
  summary(LogReg)\n```\n\n```\n## Call:\n## glm(formula = default ~ credit_score +\
  \ debt_to_income_ratio +\n##     age, family = binomial, data = train)\n##\n## Coefficients:\n\
  ##                      Estimate Std. Error z value Pr(>|z|)\n## (Intercept)   \
  \      1.4256388  0.7269003   1.961  0.0498 *\n## credit_score       -0.0094701\
  \  0.0009416 -10.057 < 2e-16 ***\n## debt_to_income_ratio 1.6934105  0.3883530 \
  \  4.360 1.3e-05 ***\n## age                 0.0194711  0.0126075   1.544  0.1225\n\
  ## ---\n## Signif. codes:  0 '***' 0.001 '**' 0.01 '*' 0.05 '.' 0.1 ' ' 1\n##\n\
  ## (Dispersion parameter for binomial family taken to be 1)\n##\n## Null deviance:\
  \ 693.44  on 799  degrees of freedom\n## Residual deviance: 515.75  on 796  degrees\
  \ of freedom\n## AIC: 523.75\n##\n## Number of Fisher Scoring iterations: 6\n```\n\
  \n逻辑回归模型的摘要提供了关于预测变量（`credit_score`、`debt_to_income_ratio` 和 `age`）与贷款违约可能性之间关系的见解。\n\
  \n系数代表在保持所有其他变量不变的情况下，对应预测变量每变化一个单位，结果（`default`）的对数几率的变化量。正系数表示违约的对数几率增加，而负系数表示违约的对数几率减少。截距代表所有预测变量为零时违约的对数几率。`credit_score`\
  \ 的负系数表明，随着 `credit_score` 的增加，违约的对数几率降低。`debt_to_income_ratio` 的正系数表明，随着 `debt_to_income_ratio`\
  \ 的增加，违约的对数几率也会增加。\n\n`credit_score` (< 2e-16) 和 `debt_to_income_ratio` (1.3e-05)\
  \ 的 p 值非常小，表明它们在预测贷款违约方面高度显著。然而，正如 p 值 (0.1225) 所示，列 `age` 在统计上不显著。\n\n零偏差代表不包含任何预测变量时模型的拟合优度，而残差偏差衡量包含预测变量后模型的拟合优度。偏差的减少表明模型拟合得到改善。赤池信息准则\
  \ (AIC) 是针对给定数据集的统计模型相对质量的度量。较低的 AIC 值表示更好的拟合。\n\n##### 模型评估\n\n为了评估逻辑回归模型在未见数据上的性能，我们现在将使用训练好的模型对测试集进行预测，然后将预测概率转换为类别标签（违约或非违约）。\n\
  \n```r\n# 在测试集上预测模型\nfitted_results <- predict(LogReg, test, type = 'response')\n\
  \n# 将概率转换为类别标签\nfitted_class <- ifelse(fitted_results > 0.5, 1, 0)\n```\n\n`predict()`\
  \ 函数可用于在给定预测变量值的情况下预测结果的概率。在使用逻辑回归模型时，`predict()` 函数中的 `type = \"response\"` 选项告诉\
  \ R 输出形式为 P(Y = 1 | X) 的概率，其中 Y 是二元因变量，X 代表预测变量。然后使用 0.5 的阈值将预测概率转换为二元类别标签 (0 或\
  \ 1)。如果预测的违约概率大于 0.5，则该观测值被分类为违约 (1)；否则分类为非违约 (0)。\n\n为了评估模型预测的准确性，我们现在将创建一个混淆矩阵。\n\
  \n\n\n\n\n###### 混淆矩阵\n\n```r\nconf_matrix = table(test$default, fitted_class)\n\
  conf_matrix\n```\n\n## fitted_class\n\n## 0 1\n\n## 0 151 12\n\n## 1 25 12\n\n#\
  \ 计算真阳性 (TP)、真阴性 (TN)、假阳性 (FP) 和假阴性 (FN)\n\n```r\nTP <- conf_matrix[2,2]\nTN <-\
  \ conf_matrix[1,1];\nFP <- conf_matrix[1,2];\nFN <- conf_matrix[2,1];\n```\n\n#\
  \ 计算准确率\n\n```r\naccuracy <- (TP + TN) / sum(conf_matrix)\naccuracy\n```\n\n## 0.815\n\
  \n# 计算精确率\n\n```r\nprecision <- TP / (TP + FP)\nprecision\n```\n\n## 0.5\n\n# 计算召回率\
  \ (灵敏度)\n\n```r\nrecall <- TP / (TP + FN)\nrecall\n```\n\n## 0.3243243\n\n混淆矩阵用于总结模型的性能。它列出了模型预测的真阳性\
  \ (`TP`)、真阴性 (`TN`)、假阳性 (`FP`) 和假阴性 (`FN`) 的数量，并将其与测试数据集中的实际结果进行比较。模型达到了 `0.815`\
  \ 的准确率，表明它正确分类了测试数据集中约 81.5% 的实例。精确率为 `0.5`，表明预测为违约的实例中约有一半是真阳性，而另一半是假阳性。召回率为 `0.324`，表明模型仅正确识别了约\
  \ 32.4% 的实际违约案例。\n\n### 线性模型的局限性\n\n线性模型的局限性如下：\n\n*   当输入变量与输出变量之间的关系近似线性时，线性模型简单且有效。虽然线性模型提供了简洁性和可解释性，但由于其固有的线性假设，它们可能无法始终捕捉数据中存在的复杂关系。\n\
  *   线性模型在捕捉变量间的非线性关系和交互作用方面存在固有局限。这可能导致欠拟合，即模型无法捕捉数据中真实的潜在模式。\n*   线性模型对异常值敏感，异常值可能不成比例地影响模型参数和预测，导致估计产生偏差。\n\
  \n既然我们已经探讨了线性模型，现在让我们转向另一种预测建模技术：决策树。\n\n### 决策树\n\n决策树是一种使用树形模型来表示决策及其可能后果的机器学习算法。决策树由节点和分支组成。最顶层的节点称为根节点。它代表初始问题。每个分支代表节点上测试的结果，每个节点代表对一个属性（或自变量）的测试。叶节点代表结果或类别标签（在分类问题中）或数值（在回归问题中）。\n\
  \n描述决策树时使用了几个关键术语和概念：\n\n*   **根节点**：代表整个样本总体或数据集，并作为构建树的起点。\n*   **决策节点**：决策树中基于特征值做出决策的节点。\n\
  *   **终端/叶节点**：决策树中分配结果或类别标签的节点。\n*   **深度**：测量从根节点沿分支到叶节点的路径长度，通常用于在生长过程中控制树的大小。\n\
  *   **分裂准则**：用于确定在每个节点按哪个特征和值分裂数据的度量，通常基于基尼不纯度、熵或信息增益等指标。\n*   **剪枝**：通过移除预测能力较弱的树枝来减小决策树规模的过程。它有助于避免过拟合并提高泛化性能。\n\
  \n下图展示了决策树的一般结构：\n\n![Figure 11.9: General structure of a decision tree](img/Figure11.9.png)\n\
  \n*图 11.9：决策树的一般结构*\n\n决策树的一些优势包括：\n\n*   **模型可解释性**：决策树的一大优势是其能够提供清晰的见解以简化决策过程。决策树生成的规则促进了与领域专家和监管机构的沟通与协作。\n\
  *   **非参数方法**：它们适用于解决各种问题结构，无需对数据分布做严格假设。\n*   **处理混合数据类型**：决策树可处理数值型和分类型特征，简化了预处理工作。\n\
  *   **抗异常值能力**：与参数方法相比，决策树对极端观测值表现出更强的韧性。\n\n然而，缺点主要源于过拟合风险和对数据集微小变化的敏感性。解决这些问题涉及超参数调优或利用集成技术。\n\
  \n决策树主要有两类：\n\n*   **分类树**处理离散或分类因变量。\n*   **回归树**处理连续因变量。\n\n下面将详细解释它们：\n\n####\
  \ 分类树\n\n分类树是一种决策树，用于预测给定数据点的类别或类别。它们通过递归地将特征空间划分为若干区域来工作，每个区域对应一个特定的类别标签。当需要对新实例进行分类时，它会沿着树向下遍历，遵循每个节点的决策规则，直到到达叶节点，在那里分配类别标签。有几种不同的方法用于确定如何在每个节点分裂数据。两种常见的方法是基尼指数和熵。\n\
  \n*   **基尼指数**：衡量一组数据点的不纯度或不确定性。其范围从 0 到 1，其中 0 表示完全纯净（所有元素属于同一类），1 表示最大不纯度（元素在所有类别中均匀分布）。具有\
  \ C 个类别的集合 S 的基尼不纯度指数计算公式为：\n\n![Gini index formula](img/eq-17.jpg)\n\n基尼指数方法旨在最大化分裂后子节点的纯度，从而构建出分类更准确的决策树。\n\
  \n*   **熵**：是衡量一组数据点随机性或不确定性的指标。在决策树的背景下，熵用于量化节点的不纯度。低熵的节点意味着它是纯净的（所有数据点属于同一类），而高熵的节点意味着它是不纯净的（数据点在各类别间均匀分布）。信息增益是通过在特定特征上分裂节点所实现的熵减少量来衡量的。决策树算法选择使信息增益最大化的分裂。具有\
  \ C 个类别的集合 S 的熵由以下公式给出：\n\n![Entropy formula](img/eq-18.jpg)\n\n让我们构建一个决策树，使用 `rpart`（递归分区和回归树）来预测贷款违约。\n\
  \n```r\n# load the required libraries\nlibrary(rpart)\nlibrary(rpart.plot)\n\n#\
  \ Train a Decision Tree model \nModel_rpart = rpart(default ~ credit_score + debt_to_income_ratio,\n\
  \                    data = train, method = \"class\", maxdepth = 5)\n```\n\n在这里，模型基于两个输入特征：`credit_score`\
  \ 和 `debt_to_income_ratio` 来预测贷款违约 (`default`) 的二元结果。训练数据存储在 `train` 数据集中。`method\
  \ = \"class\"` 参数指定该模型用于分类，`maxdepth = 5` 参数将决策树的最大深度限制为 5 层。\n\n生成的 `Model_rpart`\
  \ 对象代表训练好的决策树模型，可用于对新数据进行预测。\n\n为了更好地理解模型使用的决策过程，我们现在将可视化决策树，这将提供用于预测贷款违约的规则和分裂的图形表示。\n\
  \n```r\n# Visualise the decision tree\n```\n\n\n\n\n##### 决策树模型解读与评估\n\n###### 可视化决策树\n\
  \n```r\nrpart.plot(Model_rpart)\n```\n\n![Figure 11.10: 用于预测贷款违约的决策树](img/Figure11.10.png)\n\
  \n为了进一步解读决策树模型，我们将提取用于预测贷款违约的规则，这将提供一个简洁易读的摘要，总结用于分配违约概率的条件和阈值。\n\n###### 决策树规则\n\
  \n```r\n###### 决策树规则\nrpart.rules(Model_rpart, cover = T)\n```\n\n```\n## default\
  \ cover\n## 0.05 when credit_score >= 506 66%\n## 0.26 when credit_score < 506 &\
  \ debt_to_income_ratio < 0.62 21%\n## 0.33 when credit_score is 377 to 506 & debt_to_income_ratio\
  \ >= 0.62 8%\n## 0.74 when credit_score < 377 & debt_to_income_ratio >= 0.62 5%\n\
  ```\n\n`rpart.plot` 函数可视化决策树模型，创建树结构的图形表示。`rpart.rules` 函数提取决策树模型学习到的规则或条件。输出呈现了一组定义预测贷款违约二元结果条件的规则。每个规则由特征值的组合及相应的违约概率组成。\n\
  \n####### 决策规则解读\n\n*   如果 `credit_score` 大于或等于 506，预测违约概率为 0.05，覆盖约 66% 的数据集。\n\
  *   如果 `credit_score` 小于 506 且 `debt_to_income_ratio` 小于 0.62，预测违约概率增加到 0.26，覆盖约\
  \ 21% 的数据集。\n*   如果 `credit_score` 落在 377 到 506 之间且 `debt_to_income_ratio` 大于或等于\
  \ 0.62，预测违约概率为 0.33，覆盖约 8% 的数据集。\n*   如果 `credit_score` 小于 377 且 `debt_to_income_ratio`\
  \ 大于或等于 0.62，预测违约概率显著升高至 0.74，覆盖约 5% 的数据集。\n\n##### 测试集预测与评估\n\n接下来，我们使用训练好的决策树模型（`Model_rpart`）对测试数据集进行贷款违约预测。`type=\"\
  class\"` 参数确保返回类别标签而非概率。预测结果存储在 `pred_rpart` 变量中。\n\n```r\n# Predicting on Test\n\
  pred_rpart <- predict(Model_rpart, test, type=\"class\")\n```\n\n###### 混淆矩阵\n\n\
  ```r\n# Confusion Matrix\nconf_matrix = table(test$default, pred_rpart)\nconf_matrix\n\
  ```\n\n```\n## pred_rpart\n##    0  1\n## 0 159  4\n## 1  28  9\n```\n\n###### 性能指标计算\n\
  \n```r\n# Calculate True Positives (TP), True Negatives (TN), False Positives (FP),\
  \ and False Negatives (FN)\nTP <- conf_matrix[2,2]\nTN <- conf_matrix[1,1]\nFP <-\
  \ conf_matrix[1,2]\nFN <- conf_matrix[2,1]\n\n# Calculate Accuracy\naccuracy <-\
  \ (TP + TN) / sum(conf_matrix)\naccuracy\n## 0.84\n\n# Calculate Precision\nprecision\
  \ <- TP / (TP + FP)\nprecision\n## 0.6923077\n\n# Calculate Recall (Sensitivity)\n\
  recall <- TP / (TP + FN)\nrecall\n## 0.2432432\n```\n\n基于混淆矩阵，我们计算了准确率、精确率和召回率（灵敏度）指标。准确率是正确预测实例占所有实例的比例，本例中为\
  \ 0.84。精确率是真阳性占所有预测阳性的比例，结果为 0.69。召回率是真阳性占所有实际阳性的比例，结果为 0.24。\n\n#### 回归树\n\n回归树\n\
  \n回归树是另一种决策树类型，用于目标变量为连续值的场景。与预测分类结果的分类树不同，回归树预测数值。\n\n回归树通过递归地将特征空间划分为多个区域来工作，每个区域对应一个预测数值。当需要预测新实例时，它会沿着树向下遍历，遵循每个节点的决策规则，直到到达叶子节点，在那里被分配预测数值。回归树有多种分裂方法，两种常见的方法是平方和减少（RSS）和均方误差减少（MSE）。\n\
  \nRSS 方法使每个分区内预测值与实际值之间的平方差之和最小化。在每个节点，算法会考虑每个特征的所有可能分裂，并计算每个分裂的 RSS。然后选择使所有分区总\
  \ RSS 最小化的分裂。\n\nMSE 方法与 RSS 类似，但在某些方面有所不同。它专注于使每个分区内的均方误差最小化。均方误差是预测值与实际值之间平方差的平均值。算法选择使所有分区总\
  \ MSE 最小化的分裂。\n\n#### 超参数调优\n\n在训练决策树模型时，可以调整多个超参数以帮助降低过拟合风险。三个关键超参数包括：\n\n*   **最大深度**\
  \ (`maxdepth`)：决策树的最大深度，控制模型的复杂度。更深的树可以捕捉数据中更复杂的模式，但也更容易过拟合。设置较低的最大深度有助于防止树变得过于复杂并拟合训练数据中的噪声。\n\
  *   **分裂最小样本数** (`minsplit`)：分裂一个节点所需的最小样本数。增加此参数可以通过在分裂前要求更多样本来减少过拟合，防止树创建特定的、高方差的分裂。\n\
  *   **叶节点最小样本数** (`minbucket`)：每个叶节点所需的最小样本数。为此参数设置较高值有助于防止创建样本极少的叶节点，这类节点更容易过拟合训练数据。\n\
  \n通过微调这些超参数，可以在模型复杂度和泛化能力之间取得适当的平衡。一棵过深的树，若分裂和创建叶节点所需的样本太少，很可能会过拟合训练数据。调整这些超参数有助于决策树模型捕捉数据中的潜在模式，而不会变得过于复杂并对噪声或异常值敏感。\n\
  \n### 偏差-方差权衡\n\n偏差-方差权衡\n\n预测误差可理解为两个主要组成部分：偏差误差和方差误差。偏差代表用简化模型近似现实世界问题所引入的误差。它是模型平均预测值与被预测真实值之间的差异。高偏差模型倾向于欠拟合数据，它过度简化了特征与目标变量之间的关系。\n\
  \n方差衡量模型对给定数据点的预测变化程度。它量化了模型对训练数据波动的敏感性。高方差模型倾向于过拟合数据。它将训练数据中的噪声视为真实模式，导致在未见数据上泛化能力差。\n\
  \n偏差-方差权衡源于：减少其中一个分量往往会导致另一个分量增加。高偏差模型复杂度低，可能无法捕捉数据中的潜在模式。同时，高方差模型复杂度高，可能过于紧密地拟合训练数据中的噪声。通过以偏差换取方差（或反之），我们可以为数据集找到一个平衡的模型。下图\
  \ Figure 11.11 展示了偏差-方差权衡：\n\n![Figure 11.11: 偏差-方差权衡](img/Figure11.11.png)\n\n\n\
  \n\n理想模型位于偏差和方差之间的最佳平衡点，实现了二者的平衡，从而将这两种误差源都降至最低。它既不简单（高偏差），也不复杂（高方差）。达到这种平衡可在新的、未见过的数据上产生最小的预测误差。这种平衡的模型能很好地泛化到未见过的数据，使其在进行预测时既稳健又可靠。\n\
  \n### 聚类\n\n聚类关注于发现无标签数据中固有的结构和关系。它是一种无监督学习，意味着它用于数据未被标记或分类的情况。聚类在众多行业中有着广泛的应用，服务于市场细分、社交网络分析、图像分割和异常检测等各种目的。执行聚类后，每个簇都会获得一个称为簇\
  \ ID 的唯一标识符。聚类输出也可用作下游机器学习系统的特征数据。\n\n设想这样一个场景：一家银行希望根据人口统计信息和交易行为对客户进行细分。通过采用聚类技术，银行可以将其客户群划分为不同的群体，每个群体表现出相似的特征。这些簇可能反映出年龄、收入、交易频率或首选银行渠道等共同特征。\n\
  \n聚类的成败取决于其可解释性和实用性。生成的簇能否被理解并转化为业务可执行的洞察？它们是否揭示了此前被忽视的新视角或模式？\n\n#### K-means 聚类\n\
  \nK-means 聚类是一种流行的无监督机器学习算法，用于将数据集划分为预定义数量的簇。它通过迭代地将数据点分配给簇并更新簇质心，直到达到收敛。K-means\
  \ 聚类数据预处理中的一个关键步骤是确保所有特征具有相同的尺度。这是必要的，因为 K-means 依赖于计算数据点之间的距离来将它们分配给簇，而具有不同尺度的特征会对聚类过程产生不成比例的影响。\n\
  \n对于 K-means 聚类，该过程包含以下步骤：\n\n1.  确定簇的数量 (k)：决定数据集的最佳簇数量。\n2.  初始化簇质心：在特征空间内随机放置\
  \ k 个簇质心。\n3.  将数据点分配给簇：将数据点分配给最近的簇。\n4.  更新簇质心：通过计算分配给该簇的所有数据点的均值，重新计算每个簇的质心。\n\
  5.  迭代直到收敛：重复步骤 3 和 4，直到簇分配不再显著变化，或达到预定的迭代次数。\n\n##### 寻找最佳簇数量\n\n肘部法则是一种用于识别最佳簇数量的流行技术。它将簇的数量\
  \ (k) 与相应的簇内平方和 (WCSS) 绘制在一起，并通过目测图表寻找肘部点。\n\nWCSS 通过以下步骤计算：\n\n1.  对于每个簇，计算该簇中每个数据点到该簇质心的平方距离之和。\n\
  2.  将所有簇的这些平方距离相加，得到总 WCSS。\n\nK-means 聚类的目标是最小化 WCSS。当你增加簇的数量 (k) 时，WCSS 会减小，因为簇变得更小、更紧凑。然而，增加更多簇也会增加过拟合数据的风险，这可能无法很好地代表底层结构。让我们来了解肘部法则是如何工作的：\n\
  \n*   对一系列 k 值（例如 1 到 10 个簇）执行 K-means 聚类。\n*   对每个 k 值，计算 WCSS。\n*   将簇的数量 (k)\
  \ 绘制在 x 轴上，相应的 WCSS 绘制在 y 轴上。\n*   检查生成的图表。肘部点是 WCSS 下降速度减缓并形成类似肘部形状的点。\n\n肘部点代表最佳簇数量，因为它指示了\
  \ WCSS 下降速度显著减缓的位置。在此点之后增加更多簇，在提高聚类质量方面可能不会带来太多额外收益。\n\n##### K-means 的优势\n\n* \
  \  该算法高效，能够处理包含大量数据点的大型数据集，使其适用于海量数据应用。\n*   K-means 可以轻松将新数据点纳入现有簇，使模型能够随时间适应数据集的变化。\n\
  *   该算法可以处理不同形状和大小的簇。这种灵活性使 K-means 能够应用于各个领域的广泛聚类任务。\n\n### 结论\n\n理解机器学习生命周期的各个阶段及其相互作用，对于构建有效的\
  \ ML 模型至关重要。遵循所有步骤，我们可以开发、监控和部署满足需求的模型。线性回归使用直线来最小化误差，而逻辑回归使用 Sigmoid 函数将输出转换为概率。基于树的模型（如决策树）为分类和回归任务提供了直观的方法，能够解释数据中的复杂关系。然而，驾驭偏差与方差之间的权衡以防止过拟合并确保最佳模型性能至关重要。聚类技术（如\
  \ K-means 聚类）通过对相似数据点进行分组，提供有价值的洞察，并有助于模式发现和数据探索。\n\n有了这些基础技术的坚实基础，你现在已做好充分准备，可以进入下一章，学习如何在这个领域建立成功的职业生涯。\n\
