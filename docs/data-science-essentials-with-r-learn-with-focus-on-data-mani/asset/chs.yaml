  \n![fm1](img/fm1.png)\n\n## 第 5 章：处理日期\n\n### 简介\n\n日期和时间在许多数据分析任务中至关重要。本章将指导您了解处理日期和时间的各种操作和技术。首先，您将学习如何使用不同类型的输入创建日期、时间和日期时间。一旦拥有了日期/日期时间对象，您将学习如何提取特定组件，如年、月和日。因此，让我们逐步探索并理解如何处理日期和时间。在本章结束时，您将在实用技能方面打下坚实基础，帮助您应对典型的日期数据分析挑战。\n\
  \n### 结构\n\n在本章中，我们将讨论与处理日期和时间组件相关的几个关键概念：\n\n*   创建日期和日期时间对象\n*   检索日期和时间组件\n*\
  \   修改日期和时间组件\n*   深入电力生产数据\n*   日期和时间的计算\n\n### 目标\n\n从基础开始，您将学习如何创建、检索和修改日期和时间对象。这些技能将在使用电力生产数据的真实场景中接受检验，您将在其中探索日期操作、超前与滞后计算，以及持续时间、周期和区间的应用。掌握这些技能后，您将能够准确且自信地分析和解读时间序列数据。\n\
  \n### 创建日期和日期时间对象\n\n在本章中，我们将使用几个有用的包。随着我们深入本章，我们将发现 `lubridate` 包如何显著增强我们管理和分析时间信息的能力。安装\
  \ `lubridate` 有两种选择。\n\n一种是安装完整的 `tidyverse` 套件，其中包含 `lubridate` 以及其他用于数据操作和可视化的有用包。要开始使用\
  \ Tidyverse 包集合，请首先使用以下命令安装并加载它：\n\n1.  `install.packages(\"tidyverse\")`\n2.  `library(tidyverse)`\n\
  \n或者，您可以单独安装 `lubridate`：\n\n1.  `install.packages(\"lubridate\")`\n2.  `library(lubridate)`\n\
  \n让我们首先了解三种指代特定时间点的主要日期/时间数据类型：日期、一天中的时间、日期时间。在我们的数据分析中，我们必须处理日期或日期时间。\n\n#### 从字符串创建\n\
  \n当事件的确切时间不相关，而日期本身才相关时，通常使用日期。设想这样一个场景：您的数据集包含一列以各种格式呈现的日期，如 Sep 02, 2023。这些日期的顺序可能不同；有些可能是月-日-年格式，而另一些可能是年-月-日顺序。\n\
  \n为了高效地将这些日期字符串转换为日期对象，`lubridate` 包提供了一系列针对不同日期元素顺序量身定制的函数。这些函数的命名使用了代表基本日期和时间元素的首字母组合：\n\
  \n*   日期组件包括 `y` 代表年，`m` 代表月，`d` 代表日。\n*   时间组件包括 `h` 代表时，`m` 代表分，`s` 代表秒。\n\n函数名称中这些组件的顺序决定了如何以字符串形式提供您的日期和时间信息。例如，如果您的日期结构为月-日-年，您将使用\
  \ `mdy()` 函数将其转换为日期对象。反之，如果您的日期组织为年-月-日，`ymd()` 函数则是合适的选择。\n\n简而言之，`lubridate` 提供了函数来处理日期数据中\
  \ `m`、`d` 和 `y` 的每一种可想象的排列组合，无论您的数据集中日期格式如何变化，都能使转换过程无缝衔接。\n\n```\n# 从字符串创建日期对象\n\
  \nymd(\"2023-08-30\")\n## \"2023-08-30\"\n\nymd(\"20230830\")\n## \"2023-08-30\"\
  \n\nmdy(\"09 02 2023\")\n## \"2023-09-02\"\n\ndmy(\"31-Aug-2023\")\n## \"2023-08-31\"\
  \n```\n\n要创建日期时间对象，请在上述函数名称后添加下划线和一个或多个 `h`（时）、`m`（分）和 `s`（秒）。这使您不仅能精确指定日期，还能指定时间组件。\n\
  \n例如，如果您的数据包含类似 `2023-09-02 14:30:45` 的日期时间字符串，其中同时包含年-月-日 时:分:秒格式的日期和时间，您将使用 `ymd_hms()`\
  \ 函数进行解析：\n\n```\nymd_hms(\"2023-09-02 14:30:45\")\n## \"2023-09-02 14:30:45 UTC\"\
  \n```\n\n或者，如果您的数据包含不同格式的日期时间字符串，如 `\"09/02/2023 14:30\"`，其中日期和时间为月/日/年 时:分格式，您可以使用\
  \ `mdy_hm()` 函数进行解析：\n\n```\nmdy_hm(\"09/02/2023 14:30\")\n## \"2023-09-02 14:30:00\
  \ UTC\"\n\nclass(ymd(\"2023-08-30\"))\n## \"Date\"\n\nclass(ymd_hms(\"2023-09-02\
  \ 14:30:45\"))\n## \"POSIXct\" \"POSIXt\"\n```\n\n> **注意：** 始终应尽量使用能胜任工作的最简单数据类型。如果日期足够，就不要用日期时间。日期时间更棘手，因为它们必须处理时区，这会使事情变得更复杂。\n\
  \n有时，如果您的 CSV 或 Excel 表已经遵循 ISO8601 格式 ^(1)，您可能根本不需要转换日期或日期时间。\n\n#### 从变量创建\n\n\
  在数据分析中，经常会遇到日期信息分散在多个列中的数据集，例如年、月和日。为了有效处理这些数据，`lubridate` 提供了特定函数将此类列转换为单个日期列。\n\
  \n例如，我们创建一个包含单独日期组件（年、月、日）的 `date_data` 数据框。\n\n```\n# 创建一个包含单独日期组件的数据框\n\ndate_data\
  \ <- data.frame(\n  year = c(2023, 2022, 2021),\n  month = c(8, 12, 5),\n  day =\
  \ c(24, 15, 3)\n)\n```\n\n我们使用 `lubridate` 中的 `make_date` 函数创建一个统一的日期列。该函数将单独的日期组件（年、月、日）作为参数，并将它们组合成单个日期对象。\n\
  \n```\n# 添加新的日期列\n\ndate_data <- date_data %>%\n  mutate(full_date = make_date(year,\
  \ month, day))\n\n# 显示结果\nprint(date_data)\n\n## year month day full_date\n## 2023\
  \ 8 24 2023-08-24\n## 2022 12 15 2022-12-15\n## 2021 5 3 2021-05-03\n\nstr(date_data$full_date)\n\
  ```\n\n\n\n\n## Date[1:3], 格式：\"2023-08-24\" \"2022-12-15\" \"2021-05-03\"\n\n####\
  \ 缺失元素的默认值\n\n```r\nmake_date(year = 2023, month = 9) # day = 1\n# \"2023-09-01\"\
  \n\nmake_date(month = 9, day = 15) # year = 1970\n# \"1970-09-15\"\n\nmake_date(year\
  \ = 2023, day = 15) # month = 1\n# \"2023-01-15\"\n```\n\n### 包含单独日期和时间组件的示例数据\n\
  \n```r\ndatetime_data <- data.frame(\n  year = c(2023, 2022, 2021),\n  month = c(8,\
  \ 12, 5),\n  day = c(24, 15, 3),\n  hour = c(10, 14, 8),\n  minute = c(30, 15, 45)\n\
  )\n\n# 添加新的 datetime 列\ndatetime_data <- datetime_data %>%\n  mutate(full_datetime\
  \ = make_datetime(year, month, day, hour, minute))\n```\n\n在 `mutate` 内部，我们调用 `lubridate`\
  \ 包中的 `make_datetime` 函数，将 `year`、`month`、`day`、`hour` 和 `minute` 列合并为一个新的 `full_datetime`\
  \ 列。\n\n```r\n# 显示结果\nprint(datetime_data)\n\n## year month day hour minute full_datetime\n\
  ## 2023 8 24 10 30 2023-08-24 10:30:00\n## 2022 12 15 14 15 2022-12-15 14:15:00\n\
  ## 2021 5 3 8 45 2021-05-03 08:45:00\n```\n\n### 检索日期和时间组件\n\n`lubridate` 为您提供了一组友好的工具，用于深入挖掘日期或时间的特定元素。假设您正在处理来自智能手表的健身数据。您有一个时间戳，代表\
  \ 2023 年 8 月 25 日上午 6:30 的一次晨跑。现在，让我们使用 `lubridate` 函数来探索这个时间数据。\n\n```r\n# 创建晨跑的时间戳\n\
  run_timestamp <- ymd_hm(\"2023-08-25 06:30\")\nrun_timestamp\n## \"2023-08-25 06:30:00\
  \ UTC\"\n\n# 识别年份\nyear(run_timestamp)\n## 2023\n\n# 识别月份\nmonth(run_timestamp)\n\
  ## 8\n\n# 识别月份中的日期\nmday(run_timestamp)\n## 25\n\n# 识别年份中的日期\nyday(run_timestamp)\n\
  ## 237\n\n# 识别星期几（星期五，表示为 6）\nwday(run_timestamp)\n## 6\n\n# 设置 label = TRUE 将星期几显示为有序因子\n\
  wday(run_timestamp, label = T)\n## Fri\n## Levels: Sun < Mon < Tue < Wed < Thu <\
  \ Fri < Sat\n```\n\n### 修改日期和时间组件\n\n虽然在典型的数据分析任务中不太常见，但修改日期和时间组件的功能在清理包含错误日期的数据时显得非常宝贵。让我们看看下面这个\
  \ datetime 示例，您有一个代表 2023-09-15 14:30:45 事件的 datetime 对象。您需要将其日期调整为 14 日，时间调整为下午\
  \ 4:45。\n\n```r\n# 创建一个 datetime 对象\nevent_datetime <- ymd_hms(\"2023-09-15 14:30:45\"\
  )\n\n# 显示原始 datetime\nevent_datetime\n## \"2023-09-15 14:30:45 UTC\"\n\n# 更新多个组件：更改为\
  \ 2023 年 9 月 14 日 16:45:00\nevent_datetime <- update(\n  event_datetime,\n  day\
  \ = 14,\n  hour = 16,\n  minute = 45,\n  second = 00\n)\n\n# 显示更新后的 datetime\nevent_datetime\n\
  ## 2023-09-14 16:45:00 UTC\n```\n\n### 深入电力生产数据\n\n现在，我们将探索一个包含经济合作与发展组织（OECD）成员国月度电力生产和贸易统计数据，以及少数其他经济体电力生产数据的数据集。该数据集源自国际能源署（IEA）的《月度电力统计\
  \ 2023》。我们的目的是提取该时间数据中的特定组件。下表描述了 `MonthlyElectricityStatistics` 数据集中每一列的含义：\n\n\
  | 列名 | 描述 |\n| --- | --- |\n| Country | 国家名称 |\n| Time | 日期。代表月份和年份 |\n| Balance\
  \ | 包含描述电力生产和消费状态的各种类别。这些类别包括净电力生产、抽水蓄能用电、输配电损失、计算最终消费、总进口、总出口和其他备注。 |\n| Product\
  \ | 对能源来源和相关数据进行分类。包括电力、各种燃料类型、风能、太阳能等可再生能源。 |\n| Value | 该年特定月份的数值 |\n| Unit |\
  \ 单位为 GWh |\n\n**表 5.1：** 月度电力数据集列描述\n\n使用以下代码读取 CSV 文件并了解生成的 DataFrame 结构：\n\n\
  ```r\n# 读取 CSV 文件\nmonthly_electricity <- read.csv(\"MonthlyElectricityStatistics.csv\"\
  )\n\n# monthly_electricity dataframe 的结构\nstr(monthly_electricity)\n\n## 'data.frame':\
  \ 132833 obs. of 6 variables:\n## $ Country: chr \"Australia\" \"Australia\" \"\
  Australia\" \"Australia\" ...\n## $ Time : chr \"May 2023\" \"May 2023\" \"May 2023\"\
  \ \"May 2023\" ...\n## $ Balance: chr \"Net Electricity Production\" \"Net Electricity\
  \ Production\" \"Net Electricity Production\" \"Net Electricity Production\" ...\n\
  ## $ Product: chr \"Electricity\" \"Total Combustible Fuels\" \"Coal, Peat and Manufactured\
  \ Gases\" \"Oil and Petroleum Products\" ...\n## $ Value : num 22310 15224 10447\
  \ 386 4118 ...\n## $ Unit : chr \"GWh\" \"GWh\" \"GWh\" \"GWh\" ...\n\n# 显示数据集的前\
  \ 6 行\nhead(monthly_electricity)\n\n## Country Time Balance Product Value Unit\n\
  ## Australia May 2023 Net Electricity Production Electricity 22309.8804 GWh\n##\
  \ Australia May 2023 Net Electricity Production Total Combustible Fuels 15224.3408\
  \ GWh\n## Australia May 2023 Net Electricity Production Coal, Peat and Manufactured\
  \ Gases 10446.8998 GWh\n## Australia May 2023 Net Electricity Production Oil and\
  \ Petroleum Products 385.5876 GWh\n## Australia May 2023 Net Electricity Production\
  \ Natural Gas 4117.5758 GWh\n## Australia May 2023 Net Electricity Production Combustible\
  \ Renewables 274.2775 GWh\n\n# Time 列的数据类型\nclass(monthly_electricity$Time)\n##\
  \ \"character\"\n```\n\n让我们为分析准备 `monthly_electricity` 数据集。我们数据集中的 `Time` 列格式为“月份\
  \ 年份”（例如，May 2023）。为了有效地处理这些数据，我们要给每个日期添加一个日期组件，具体为 '01'。这一步确保我们拥有完整的日期字符串（01 May\
  \ 2023），随后可以解析并用于进一步分析。\n\n```r\n# 添加日期组件（例如 01）并解析日期\nmonthly_electricity <- monthly_electricity\
  \ %>%\n  mutate(\n    Time = dmy(paste(\"01\", Time))\n  )\n```\n\n在以下代码中，我们在 `monthly_electricity`\
  \ 数据集中添加 `Month`、`Year` 和 `Quarter` 列，以进行精确的时间分析。随后，我们专注于 Electricity 产品类别下的印度电力数据，筛选\
  \ 2021 年及以后的数据。然后我们按季度对这些信息进行分组和汇总，计算总值和平均值。\n\n```r\n# 从 Time 中提取不同组件\nmonthly_electricity\
  \ <- monthly_electricity %>%\n  mutate(\n    Month = month(Time),\n    Year = year(Time),\n\
  \    Quarter = quarter(Time, type = \"year.quarter\")\n  )\n\nhead(monthly_electricity)\n\
  \n## Country Time Balance Product Value Unit Month\n## Australia 2023-05-01 Net\
  \ Electricity Production Electricity 22309.8804 GWh 5\n## Australia 2023-05-01 Net\
  \ Electricity Production Total Combustible Fuels 15224.3408 GWh 5\n## Australia\
  \ 2023-05-01 Net Electricity Production Coal, Peat and Manufactured Gases 10446.8998\
  \ GWh 5\n```\n\n\n\n\n# 澳大利亚 2023-05-01 净发电量 石油及石油产品 385.5876 GWh 5\n\n# 澳大利亚 2023-05-01\
  \ 净发电量 天然气 4117.5758 GWh 5\n\n# 澳大利亚 2023-05-01 净发电量 可燃可再生能源 274.2775 GWh 5\n\n\
  # 年份 季度\n\n# 2023 2023.2\n\n# 2023 2023.2\n\n# 2023 2023.2\n\n# 2023 2023.2\n\n\
  # 2023 2023.2\n\n# 2023 2023.2\n\n# 子集化 `electricity_subset` 数据框\n\n```r\nelectricity_subset\
  \ <- monthly_electricity %>%\n  filter(Country == \"India\", Product == \"Electricity\"\
  , Year >= 2021)\n```\n\n# 汇总 `electricity_subset` 数据集\n\n```r\nsummary_electricity\
  \ <- electricity_subset %>%\n  group_by(Quarter) %>%\n  summarize(\n    Total_Value\
  \ = sum(Value),\n    Average_Value = mean(Value)\n  )\n```\n\n# 显示 `summary_electricity`\
  \ 数据框\n\n```r\nView(summary_electricity)\n```\n\n# 季度 Total_Value Average_Value\n\
  \n# 2021.1 386916.7 128972.2\n\n# 2021.2 389065 129688.3\n\n# 2021.3 413978.2 137992.7\n\
  \n# 2021.4 370094.3 123364.8\n\n# 2022.1 393960.4 131320.1\n\n# 2022.2 439537.5\
  \ 146512.5\n\n# 2022.3 422333.3 140777.8\n\n# 2022.4 393441.4 131147.1\n\n# 2023.1\
  \ 422806.5 140935.5\n\n# 2023.2 301012.8 150506.4\n\n### 日期与时间的计算\n\n在本节中，我们将探讨如何使用\
  \ `lubridate` 包计算领先值和滞后值、持续时间、周期以及区间。\n\n#### 领先与滞后计算\n\n来自 `dplyr` 包的 `lead()`\
  \ 和 `lag()` 函数使我们能够访问序列中的前一个（滞后）或后一个（领先）值，无论该序列是数字序列还是日期序列。当您需要计算连续时间单位之间的变化或差异时，这些函数显得尤为重要。\n\
  \n然而，必须注意的是，使用 `lead()` 或 `lag()` 时，数据集中行的顺序至关重要。您的日期或数字是按升序还是降序排列，都会对结果产生深远影响。\n\
  \n在以下分析中，我们将通过引入 `previous_month_Value` 列来探索 `electricity_subset` 数据集，以监测上个月的值。在此基础上，我们将计算与上个月相比的值，即连续月份之间的数值差异。我们还将在\
  \ `Percentage_Difference` 列中将这些差异表示为百分比。\n\n### 1. 创建 `previous_month_Value` 列\n\
  \n```r\nelectricity_subset <- electricity_subset %>%\n  select(Time, Value) %>%\n\
  \  mutate(\n    previous_month_Value = lead(Value)\n  )\n```\n\n### 2. 计算“与上月相比的值”\
  \ 和 `Percentage_Difference`\n\n```r\nelectricity_subset <- electricity_subset %>%\n\
  \  mutate(\n    Value_Compared_To_Previous_Month = Value - previous_month_Value,\n\
  \    Percentage_Difference = round(((Value - previous_month_Value) / previous_month_Value)\
  \ * 100, 2)\n  )\n```\n\n```r\nhead(electricity_subset)\n```\n\n# Time Value previous_month_Value\
  \ Value_Compared_To_Previous_Month Percentage_Difference\n\n# 2023-05-01 153915.5\
  \ 147097.3 6818.226 4.64\n\n# 2023-04-01 147097.3 144378.1 2719.146 1.88\n\n# 2023-03-01\
  \ 144378.1 134485.0 9893.172 7.36\n\n# 2023-02-01 134485.0 143943.4 -9458.418 -6.57\n\
  \n# 2023-01-01 143943.4 138183.0 5760.381 4.17\n\n# 2022-12-01 138183.0 128644.9\
  \ 9538.127 7.41\n\n在 `lubridate` 包中，有多种方式可以表示时间跨度——通过持续时间、周期和区间。每种表示方式都有其独特的用途，并提供不同的功能。\n\
  \n#### 持续时间\n\n持续时间允许您以秒为单位来度量时间段。`lubridate` 包还提供了多个函数来处理持续时间，例如 `dweeks()`、`ddays()`、`dminutes()`\
  \ 和 `dseconds()`。利用这些函数，您可以轻松地在不同的时间单位之间进行转换，并对它们执行计算。\n\n以下示例跟踪服务停机事件的持续时间以评估其影响。它使用\
  \ `duration()` 函数创建一个停机持续时间向量，并通过将给定的停机持续时间列表相加来计算总停机时间。\n\n### 1. 停机持续时间\n\n```r\n\
  downtime_durations <- c(duration(hours = 1), duration(minutes = 30), duration(hours\
  \ = 2))\n```\n\n```r\ndowntime_durations\n```\n\n```\n## \"3600s (~1 hours)\" \"\
  1800s (~30 minutes)\" \"7200s (~2 hours)\"\n```\n\n```r\nclass(downtime_durations)\n\
  ```\n\n```\n## \"Duration\"\n## attr(,\"package\")\n## \"lubridate\"\n```\n\n###\
  \ 2. 计算总停机时间\n\n```r\ntotal_downtime <- sum(downtime_durations)\n```\n\n```r\ntotal_downtime\n\
  ```\n\n```\n## 12600\n```\n\n#### 周期\n\n周期是时间跨度的灵活表示形式，允许您使用人类友好的单位，如年、月、周、日、小时、分钟和秒。与持续时间不同，周期不指定固定的秒数长度，而是根据底层的日期时间调整其长度。这使得周期非常适合在不必担心具体秒级细节的情况下，跟踪长时间段内的时钟时间变化。`lubridate`\
  \ 提供了多种操作周期的方法，包括加法和减法运算，使执行复杂的时间分析任务变得容易。\n\n让我们看一个通过定义以周为单位的续订周期来设置订阅续订提醒的示例：\n\
  \n### 1. 订阅续订周期\n\n```r\nrenewal_periods <- c(period(weeks = 2), period(weeks =\
  \ 4), period(weeks = 6))\n```\n\n```r\nrenewal_periods\n```\n\n```\n## “14d 0H 0M\
  \ 0S” “28d 0H 0M 0S” “42d 0H 0M 0S”\n```\n\n```r\nclass(renewal_periods)\n```\n\n\
  ```\n## \"Period\"\n## attr(,\"package\")\n## \"lubridate\"\n```\n\n### 2. 计算续订日期\n\
  \n```r\n# Sys.Date() 返回当前日期\nSys.Date()\n```\n\n```\n## \"2023-09-10\"\n```\n\n\
  ```r\nrenewal_dates <- Sys.Date() + renewal_periods\n```\n\n```r\nprint(renewal_dates)\n\
  ```\n\n```\n## \"2023-09-24\" \"2023-10-08\" \"2023-10-22\"\n```\n\n#### 区间\n\n\
  区间提供了一种定义两个特定时间点之间时间范围的方法，在处理日期时间数据时能提供更高的精度。`lubridate` 包中的 `interval()` 函数创建一个\
  \ `Interval` 对象，表示指定的开始和结束日期。以下代码通过定义具有开始和结束时间的区间来安排事件。\n\n### 1. 定义事件区间\n\n```r\n\
  event_intervals <- c(\n  interval(ymd_hms(\"2023-08-01 10:00:00\"), ymd_hms(\"2023-08-01\
  \ 12:00:00\")),\n  interval(ymd_hms(\"2023-08-03 15:30:00\"), ymd_hms(\"2023-08-03\
  \ 17:00:00\"))\n)\n```\n\n```r\nevent_intervals\n```\n\n```\n## 2023-08-01 10:00:00\
  \ UTC--2023-08-01 12:00:00 UTC 2023-08-03 15:30:00 UTC--2023-08-03 17:00:00 UTC\n\
  ```\n\n```r\nclass(event_intervals)\n```\n\n```\n## \"Interval\"\n## attr(,\"package\"\
  )\n## \"lubridate\"\n```\n\n### 2. 检查事件是否与特定时间重叠\n\n```r\ncheck_time <- ymd_hms(\"\
  2023-08-01 11:30:00\")\noverlapping_events <- event_intervals[check_time %within%\
  \ event_intervals]\n```\n\n```r\nprint(overlapping_events)\n```\n\n```\n## 2023-08-01\
  \ 10:00:00 UTC--2023-08-01 12:00:00 UTC\n```\n\n### 结论\n\n完成本章关于日期和时间处理的内容后，您现在可以浏览和操作时间数据。您已经学会了如何创建和修改日期和日期时间对象，检索年、月、日、时、分、秒等相关组成部分，并执行各种计算，如领先和滞后计算。我们还学习了如何使用持续时间、周期和区间来分析时间数据。\n\
  \n现在您已经在处理日期和时间方面打下了坚实的基础，可以继续学习下一章，在那里您将学习如何处理字符串。\n\n\n\n\n1. ISO 8601 是一项涵盖全球日期和时间相关数据交换与通信的国际标准\
  \ - 维基百科\n\n## 第 6 章：操作字符串\n\n### 简介\n\n现实世界的数据集通常包含大量文本数据，以及数值和逻辑数据。无论您处理的是客户评论、社交媒体评论还是调查回复，文本数据都隐藏着宝贵的见解。然而，原始文本数据往往包含噪声、不一致性和其他问题，必须在适当分析之前解决这些问题。在本章中，您将接触到一套全面的字符串操作函数，帮助您应对与文本数据相关的常见挑战。您将学习如何清洗文本、提取相关信息，并将文本数据转换为适合进一步分析的结构化形式。\n\
  \n### 结构\n\n本章将探讨和讨论与操作字符串相关的各种基本概念。我们将在本章中讨论以下主题：\n\n*   基本字符串操作\n    *   更改大小写\n\
  \    *   计算字符串长度\n    *   替换子字符串\n    *   移除不必要的空白字符\n    *   填充\n*   连接字符串\n* \
  \  提取子字符串\n*   正则表达式\n    *   正则表达式要素\n    *   贪婪与非贪婪匹配\n*   检测和提取模式\n\n### 目标\n\
  \n本章旨在利用 `stringr` 包，深入理解字符串操作技术。本章涵盖基本字符串操作，如清洗和操作字符串、更改大小写、计算字符串长度、替换子字符串、移除不必要的空白字符、填充以及连接字符串。本章还涵盖使用\
  \ `str_sub()` 和 `str_extract()` 函数从字符串中提取子字符串。提取子字符串是数据科学中的典型操作，因为经常需要从字符串中提取特定信息片段，如从时间戳中提取日期。本章还介绍正则表达式（regex），它有助于搜索和操作文本。正则表达式是一组共同形成模式的字符，用于在字符串中搜索、验证和提取信息。它们可用于查找和提取字符串中的特定模式，如电子邮件地址、电话号码和日期。\n\
  \n### 基本字符串操作\n\n在整章中，我们将使用 `stringr` 包中的函数，该包是 Tidyverse 生态系统的组成部分。`stringr` 包提供了高效且有效的工具来执行字符串操作任务。首先，我们加载数据操作所需的包。\n\
  \n```\n# load tidyverse\nlibrary(tidyverse)\n\n# install stringr\ninstall.packages(\"\
  stringr\")\n\n# load stringr\nlibrary(stringr)\n```\n\n`stringr` 提供了广泛的函数来处理文本数据，包括用于基本字符串操作的函数，如修剪空白字符和转换大小写，以及更高级的功能，如正则表达式匹配。其一致的命名约定使您容易记住哪个函数执行什么操作，让您专注于解决问题，而不是记忆语法。在\
  \ RStudio 中，您可以输入 `str_` 并按 Tab 键查看 `stringr` 包中可用的字符串操作函数列表。此快捷方式允许您轻松访问并选择所需的函数，而无需输入其完整名称。\n\
  \n**表 6.1** 列出了一些最基本且广泛使用的用于字符串操作的 `stringr` 函数：\n\n| stringr 函数 | 说明 | 等效的基础 R\
  \ 函数 |\n| --- | --- | --- |\n| `str_to_lower()` | 将字符串转换为小写。 | `tolower()` |\n|\
  \ `str_to_upper()` | 将字符串转换为大写。 | `toupper()` |\n| `str_length()` | 返回字符串中的字符数。\
  \ | `nchar()` |\n| `str_replace()` | 用替换字符串替换字符串中模式的第一次出现。 | `sub()` |\n| `str_replace_all()`\
  \ | 用替换字符串替换字符串中模式的所有出现。 | `gsub()` |\n| `str_trim()` | 移除字符串首尾的空白字符。 | `trimws()`\
  \ |\n| `str_squish()` | 移除字符串中所有连续的空白字符。 | NA |\n| `str_pad()` | 使用指定的填充字符将字符串填充到指定长度。\
  \ | NA |\n| `str_c()` | 连接两个或多个字符串。 | `paste()` 或 `paste0()` |\n| `str_sub()` |\
  \ 提取子字符串 | `substr()` |\n\n表 6.1：基本 `stringr` 函数列表\n\n这些函数可用于执行广泛的字符串操作，例如将字符串转换为不同的大小写、移除空白字符、替换字符和组合子字符串。\n\
  \n假设您负责创建新的产品页面并确保它们针对搜索引擎进行了优化。创建结构良好的 URL 是搜索引擎优化 (SEO) 最重要的方面之一。创建 URL 时，必须遵循某些最佳实践。这些最佳实践有助于提高产品页面的\
  \ SEO 并使其更加用户友好。\n\n现在，您将利用可用的特定数据点（如产品名称、产品类别和产品 ID）创建 URL 名称。您可以手动创建每个 URL 名称，但这既耗时又容易出错。更好的方法是使用\
  \ `stringr` 从数据点创建 URL 名称并实现流程自动化。\n\n首先，我们创建一个名为 `books` 的数据框，包含三列：产品名称、产品类别和产品\
  \ ID。产品名称列包含产品的名称，产品类别列包含产品的类别，产品 ID 列包含产品的唯一标识符。\n\n```\n# Create a data frame\
  \ of product data\nbooks <- data.frame(product_name = c(\"Mastering MEAN Stack\"\
  , \" Breaking Ransomware\", \"Data Science with R \", \"Learning Google Cloud Vertex\
  \ AI\"),\n  product_category = c(\"Web Development \", \" Security \", \"Machine\
  \ Learning & AI\", \"Cloud & Networking\"),\n  product_id = c(255, 78, 7077, 537))\n\
  \n# Display the data frame\nView(books)\n```\n\n| product_name | product_category\
  \ | product_id |\n| --- | --- | --- |\n| Mastering MEAN Stack | Web development\
  \ | 255 |\n| Breaking ransomware | Security | 78 |\n| Data science with R | ML and\
  \ AI | 7077 |\n| Learning Google Cloud Vertex AI | Cloud and networking | 537 |\n\
  \n表 6.2：`View(books)` 的输出\n\n#### 更改大小写\n\n接下来，我们将使用 `mutate()` 函数将产品名称和产品类别列更新为小写。`mutate()`\
  \ 接受一个数据框和一个表达式列表作为输入，并返回一个包含新列或更新列的新数据框。\n\n在创建 URL 之前将产品名称和类别转换为小写有几个好处。首先，这被认为是搜索引擎优化\
  \ (SEO) 的最佳实践，因为搜索引擎倾向于更有效地索引和排名小写 URL。其次，小写 URL 更便于用户理解和记忆，使其更加用户友好。下面的代码使用 `str_to_lower()`\
  \ 函数将产品名称和产品类别转换为小写。\n\n```\n# Changing case of product_name and product_category\n\
  books <- books %>%\n  mutate(product_name = str_to_lower(product_name),\n  product_category\
  \ = str_to_lower(product_category))\n\n# Display books\nView(books)\n```\n\n| product_name\
  \ | product_category | product_id |\n| --- | --- | --- |\n| mastering mean stack\
  \ | web development | 255 |\n| breaking ransomware | security | 78 |\n| data science\
  \ with r | ml and ai | 7077 |\n| learning google cloud vertex ai | cloud and networking\
  \ | 537 |\n\n表 6.3：更改大小写后 `View(books)` 的输出\n\n\n\n\n# 表 6.3：标准化大小写后的图书数据\n\n| product_name\
  \ | product_category | product_id |\n| :--- | :--- | :--- |\n| Learning Google Cloud\
  \ Vertex AI | Cloud and networking | 537 |\n\n正如你所见，`product_name` 和 `product_category`\
  \ 列现在均为小写。你可以使用 `str_to_upper()` 函数将字符串转换为大写。在文本分析中，将字符串转换为小写或大写是处理文本数据的基础操作。当比较字符串、消除大小写敏感性或统一格式化字符串时，这种转换是必要的。\n\
  \n例如，假设你有一个包含客户姓名和电子邮件地址的数据库。某些条目可能是大写，而另一些是小写。为了准确识别并移除重复记录，你需要将所有姓名和电子邮件转换为大写或小写。这样可以防止将\
  \ `business@bpbonline.com` 和 `Business@bpbonline.com` 错误地视为独立条目，从而确保数据完整性。\n\n####\
  \ 计算字符串长度\n\n现在让我们使用 `str_length()` 函数计算 `product_name` 列的长度。计算每个产品名称长度的代码如下：\n\n\
  ```r\n# Calculate the length of the product_name\nbooks <- books %>%\n  mutate(product_name_length\
  \ = str_length(product_name))\n\n# View the modified data frame\nView(books)\n```\n\
  \n请参考下表：\n\n| product_name | product_category | product_id | product_name_length\
  \ |\n| :--- | :--- | :--- | :--- |\n| Mastering mean stack | Web development | 255\
  \ | 20 |\n| Breaking ransomware | Security | 78 | 20 |\n| Data science with R |\
  \ ML and AI | 7077 | 20 |\n| Learning Google Cloud Vertex Ai | Cloud and networking\
  \ | 537 | 31 |\n\n**表 6.4：包含产品名称长度的图书数据**\n\n`str_length()` 函数在文本分析中具有多种用途，包括：\n\
  \n*   **验证输入数据**：`str_length()` 函数可通过根据指定标准检查输入数据的长度来验证数据。例如，在密码验证函数中，你可以使用 `str_length()`\
  \ 确保输入密码至少有八个字符。如果密码少于八个字符，该函数可返回错误消息或直接拒绝输入。\n*   **格式化输出数据**：通过填充字符串至固定长度来格式化输出数据。这在以表格或报表形式显示数据时非常有用，因为一致的格式至关重要。例如，向字符串添加前导空格直到达到指定长度，确保表格中所有行的列宽相同。\n\
  *   **分析文本数据**：计算与字符串长度相关的各种指标。例如，计算句子中单词的平均长度，或查找段落中最长的单词。\n\n#### 替换子字符串\n\n移除特殊字符（如\
  \ URL 链接中的 `&`）通常是推荐的做法，因为不同的 Web 浏览器和服务器对特殊字符的解析可能不同。\n\n以下代码使用 `str_replace_all()`\
  \ 将 `books` 数据框 `product_category` 列中所有出现的 `&` 字符替换为空字符串。\n\n```r\n# Replacing substring\
  \ from the column product_category\nbooks <- books %>%\n  mutate(product_category\
  \ = str_replace_all(product_category, \"&\", \"\"))\n\n# View the data frame\nView(books)\n\
  ```\n\n| product_name | product_category | product_id | product_name_length |\n\
  | :--- | :--- | :--- | :--- |\n| Mastering mean stack | Web development | 255 |\
  \ 20 |\n| Breaking ransomware | Security | 78 | 20 |\n| Data science with R | ML\
  \ and AI | 7077 | 20 |\n| Learning Google Cloud Vertex Ai | Cloud networking | 537\
  \ | 31 |\n\n**表 6.5：从产品类别中移除 `&` 后的图书数据**\n\n`str_replace_all()` 是一个字符串操作函数，用于将字符串中所有出现的模式替换为替换字符串。在本例中，模式是\
  \ `&` 字符，替换字符串为空字符串。\n\n`str_replace_all()` 函数可用于多种文本分析任务，例如移除停用词。停用词是指那些不太具备信息量的常用词，如\
  \ `and`、`the`、`is`；替换缩写为全拼；纠正拼写错误等。`str_replace()` 函数与 `str_replace_all()` 类似，但它仅针对并替换指定子字符串的**首次出现**。当你想要执行一次性替换而不影响同一单词后续出现的情况时，这非常有用。\n\
  \n#### 移除不必要的空白字符\n\n在文本分析中，`str_trim()` 和 `str_squish()` 函数常用于在应用情感分析、主题建模或机器学习算法等其他技术之前清理和预处理文本数据。\n\
  \n`str_trim()` 函数移除字符串开头和结尾的空白字符，有助于规范化数据。它接受一个参数，即待修剪的字符串。\n\n```r\n# Remove leading\
  \ and trailing spaces in product_name and product_category\nbooks <- books %>%\n\
  \  mutate(product_name = str_trim(product_name),\n         product_category = str_trim(product_category))\n\
  \n# Display the modified data frame\nView(books)\n```\n\n| product_name | product_category\
  \ | product_id | product_name_length |\n| :--- | :--- | :--- | :--- |\n| Mastering\
  \ mean stack | Web development | 255 | 20 |\n| Breaking ransomware | Security |\
  \ 78 | 20 |\n| Data science with R | ML and AI | 7077 | 20 |\n| Learning Google\
  \ Cloud Vertex Ai | Cloud networking | 537 | 31 |\n\n**表 6.6：修剪产品名称和类别后的图书数据**\n\
  \n请注意每个书名和类别周围的前导和尾随空格已被移除。另一方面，`str_squish()` 除了像 `str_trim()` 一样修剪首尾空格外，还会将文本中多个连续的内部空格缩减为单个空格。在下面的代码中，我们将\
  \ `product_category` 列中的所有内部空白字符替换为单个空格。\n\n```r\n# Apply str_squish() to product_category\
  \ column\nbooks <- books %>%\n  mutate(product_category = str_squish(product_category))\n\
  \n# View the data frame\nView(books)\n```\n\n| product_name | product_category |\
  \ product_id | product_name_length |\n| :--- | :--- | :--- | :--- |\n| Mastering\
  \ mean stack | Web development | 255 | 20 |\n| Breaking ransomware | Security |\
  \ 78 | 20 |\n| Data science with R | ML and AI | 7077 | 20 |\n| Learning Google\
  \ Cloud Vertex AI | Cloud networking | 537 | 31 |\n\n**表 6.7：标准化产品类别后的图书数据**\n\n\
  此输出将连续的空白字符压缩为单个空格，使字符串更加简洁。此外，在 URL 中使用连字符（`-`）代替空格分隔单词是一种良好的实践，有助于用户和搜索引擎更好地阅读和理解。为了实现这一点，我们将把产品名称和类别中的所有空格替换为连字符。\n\
  \n```r\n# Replacing all spaces in product names and categories with hyphens\nbooks\
  \ <- books %>%\n  mutate(product_name = str_replace_all(product_name, \" \", \"\
  -\"),\n         product_category = str_replace_all(product_category, \" \", \"-\"\
  ))\n\n# Display the dataframe\nView(books)\n```\n\n| product_name | product_category\
  \ | product_id | product_name_length |\n| :--- | :--- | :--- | :--- |\n| Mastering-MEAN-Stack\
  \ | Web-development | 255 | 20 |\n| Breaking-ransomware | Security | 78 | 20 |\n\
  | Data-science-with-R | ML-and-AI | 7077 | 20 |\n| Learning-Google-Cloud-Vertex-AI\
  \ | Cloud-networking | 537 | 31 |\n\n**表 6.8：产品名称和类别中空格被替换后的图书数据**\n\n#### 填充\n\n\
  \n\n填充是一种可用于确保所有数据点具有相同长度的技术。`str_pad()` 函数使用指定的填充字符将字符串填充到指定长度。当您需要标准化字符串长度时（例如处理代码或标识符时），这特别有用。它接受四个参数：\n\
  \n*   `string`：要填充的字符串。\n*   `width`：填充后字符串的期望长度。\n*   `side`：要填充的字符串侧边。可以是 `left`、`right`\
  \ 或 `both` 之一。\n*   `pad`：填充字符。\n\n```\n# 使用 str_pad() 通过前导零标准化 product_id\nbooks\
  \ <- books %>%\n  mutate(product_id = str_pad(product_id, width = 4, side = \"left\"\
  , pad = \"0\"))\n\n# 查看数据框\nView(books)\n```\n\n您可以看到，`str_pad()` 是文本分析任务中一项宝贵的函数，适用于需要将字符串填充至一致长度的场景。\n\
  \n在处理文本数据（如句子或段落）时，遇到长度不一的序列是常态。深度学习模型（如 LSTM 和 Transformer 模型）通常期望固定维度的输入序列。在这种情况下，填充可确保所有序列具有相同的长度。\n\
  \n#### 连接字符串\n\n`str_c()` 函数将多个字符向量合并为单个字符向量。它接受两个或更多参数，即要合并的字符向量。`str_c()` 是文本分析任务中一项方便的函数，适用于需要将多个字符串合并为一个字符串的场景。\n\
  \n现在，您将使用 `str_c()` 为 `books` 数据框中的每个产品创建唯一的产品 URL。\n\n```\n# 使用 str_c() 生成唯一的产品\
  \ URL\nbooks <- books %>%\n  mutate(product_url = str_c(\"https://in.bpbonline.com/\"\
  , \"collections/\", product_category, \"/\", product_name, \"/\", product_id))\n\
  ```\n\n在上述代码中，我们使用 `str_c()` 函数创建了一个名为 `product_url` 的新列。这里我们合并了以下内容：\n\n*   `https://in.bpbonline.com/`：在线商店的基础\
  \ URL。\n*   `collections/`：将追加到基础 URL 后的目录路径。\n*   `product_category`：每个产品类别的名称。我们在此处使用它来为每个产品动态生成目录路径。\n\
  *   `/`：分隔目录路径与产品名称的正斜杠字符。\n*   `product_name`：每个产品的名称。\n*   `/`：分隔产品名称与产品 ID 的另一个正斜杠字符。\n\
  *   `product_id`：每个产品的唯一标识符。\n\n```\n# 显示 product_url 列\nbooks %>% select(product_url)\n\
  \n## product_url\n\n## https://in.bpbonline.com/collections/web-development/mastering-mean-stack/0255\n\
  ## https://in.bpbonline.com/collections/security/breaking-ransomware/0078\n## https://in.bpbonline.com/collections/machine-learning-ai/data-science-with-r/7077\n\
  ## https://in.bpbonline.com/collections/cloud-networking/learning-google-cloud-vertex-ai/0537\n\
  ```\n\n您可以看到，生成的 `product_url` 列将包含每个产品的唯一 URL，格式如下：\n\n`https://in.bpbonline.com/collections/[product_category]/[product_name]/[product_id]`\n\
  \n#### 提取子字符串\n\n`str_sub()` 函数根据指定的起始和结束索引从字符串中提取子字符串。它接受三个参数：\n\n*   `string`：用于提取子字符串的字符串。\n\
  *   `start`：子字符串的起始索引。\n*   `end`：子字符串的结束索引。\n\n您可以使用 `str_sub()` 从 `product_url`\
  \ 列中提取最后四位数字，并创建一个名为 `extracted_product_id` 的新列。\n\n```\n# 从 product_url 列中提取最后\
  \ 4 位数字。\nbooks <- books %>%\n  mutate(extracted_product_id = str_sub(product_url,\
  \ start = -4))\n```\n\n在上述代码中，我们使用了以下两个参数：\n\n*   `product_url`：包含 URL 的列。\n*  \
  \ `start = -4`：指定提取应从字符串末尾的第 4 个字符开始，捕获最后四位数字。\n\n```\n# 打印 extracted_product_id\n\
  books %>% select(extracted_product_id)\n\n## extracted_product_id\n## 0255\n## 0078\n\
  ## 7077\n## 0537\n```\n\n您会观察到，`str_sub()` 函数是文本分析任务中一项非常有用的函数，适用于需要提取字符串特定部分的场景。\n\
  \n### 正则表达式\n\n正则表达式是可用于描述特定字符串的模式。它们允许您定义模式，以便在较大文本中匹配和替换特定字符串。它们是文本分析和操作的强大工具。正则表达式可用于多种任务，例如：\n\
  \n*   从文本中识别和提取特定模式：例如，您可以使用正则表达式识别文档中的所有电话号码。\n*   替换文本：您可以使用正则表达式将特定单词的所有出现替换为另一个单词。\n\
  *   验证文本：您可以使用正则表达式验证密码是否满足特定要求，例如包含至少一个大写字母和一个特殊字符。\n\n> **注意：** 正则表达式区分大小写。\n\n\
  #### 正则表达式的构成要素\n\n正则表达式由构建模块构成。每个构建模块都是一个简单的模式或规则，可以通过无限种方式组合以创建复杂模式。学习如何组合这些构建模块对于实现特定的文本分析目标至关重要。\n\
  \n正则表达式由两类字符组成：特殊字符（元字符）和字面字符。特殊字符包括 `.`、`\\`、`|`、`(`、`)`、`{`、`}`、`[`、`]`、`^`、`$`、`-`、`*`、`+`、`?`\
  \ 等符号，它们在正则表达式中具有特定含义。字面字符是匹配其自身的常规文本字符。\n\n下表概述了正则表达式中常用的字符类型及其对应的解释：\n\n| 字符类型\
  \ | 解释 |\n| --- | --- |\n| `abc` | 精确匹配字符 abc |\n| `123` | 匹配数字序列 123 |\n| `\\w`\
  \ | 匹配任意单个 alphanumeric 字符（a-z, A-Z, 0-9） |\n| `\\W` | 匹配任意单个非 alphanumeric 字符（不含\
  \ a-z, A-Z, 0-9） |\n| `\\d` | 匹配任意单个数字（0-9） |\n| `\\D` | 匹配任意单个非数字字符（不含 0-9） |\n\
  | `\\s` | 匹配任意单个空白字符（空格、制表符、换行符等） |\n| `\\S` | 匹配任意单个非空白字符（不含空格、制表符、换行符等） |\n| `.`\
  \ | 匹配任意单个字符（换行符除外） |\n| `$` | 匹配输入字符串的结尾 |\n| `^` | 匹配输入字符串的开头 |\n\n表 6.10：正则表达式中常用的字符类型\n\
  \n#### 正则表达式中的分组\n\n下表描述了正则表达式中各种分组模式：\n\n| 分组 | 解释 |\n| --- | --- |\n| `[abc]`\
  \ | 匹配集合 abc 中的任意单个字符 |\n| `[^abc]` | 匹配不在集合 abc 中的任意单个字符 |\n| `[0-9]` | 匹配 0 到\
  \ 9 之间的任意单个数字 |\n| `[a-z]` | 匹配 a 到 z 之间的任意单个小写字母 |\n| `[A-Z]` | 匹配 A 到 Z 之间的任意单个大写字母\
  \ |\n| `[a-zA-Z]` | 匹配任意单个 alphanumeric 字符，无论大小写 |\n| `( )` | 捕获组：捕获匹配的文本并使其可供后续使用\
  \ |\n| `(a(bc))` | 捕获子组：在捕获组内捕获子模式 |\n| `(abc|def)` | 匹配 abc 或 def |\n\n表 6.11：正则表达式中使用的分组模式\n\
  \n\n\n\n##### 组修饰符\n\n组修饰符是特殊的语法扩展，用于改变正则表达式中量词的行为。它们允许你指定量词应匹配其前面模式的次数。理解这些修饰符对于微调正则表达式以精确匹配文本数据至关重要。\n\
  \n使用下面的组修饰符，你可以指定特定模式应重复的次数，无论是零次或多次、一次或多次、特定次数，还是在某个范围内。\n\n| 组修饰符 | 解释 |\n| ---\
  \ | --- |\n| `*` | 匹配前一个模式的零次或多次重复（贪婪量词） |\n| `+` | 匹配前一个模式的一次或多次重复（贪婪量词） |\n| `?`\
  \ | 使前一个模式变为可选（匹配零次或一次）。 |\n| `{n}` | 精确匹配前一个模式的 n 次重复 |\n| `{n,m}` | 匹配前一个模式 n\
  \ 到 m 次重复 |\n| `*?` | 匹配前一个模式的零次或多次重复（非贪婪量词） |\n| `+?` | 匹配前一个模式的一次或多次重复（非贪婪量词）\
  \ |\n\n表 6.12：组修饰符列表\n\n##### 贪婪与非贪婪匹配\n\n在正则表达式中，量词用于指定模式应匹配的次数。当应用于一组字符时，量词决定了在输入字符串中的匹配范围。贪婪和非贪婪修饰符是控制量词行为的特殊扩展。下表总结了贪婪和非贪婪量词之间的主要区别：\n\
  \n| 量词 | 行为 |\n| --- | --- |\n| 贪婪 | 匹配尽可能多的内容 |\n| 非贪婪 | 匹配尽可能少的内容 |\n\n表 6.13：正则表达式中的贪婪与非贪婪量词\n\
  \n`str_extract()` 函数默认使用贪婪匹配。这意味着如果你有一个包含量词（如 `*`、`+` 或 `{}`）的正则表达式模式，`str_extract()`\
  \ 将尝试匹配满足该模式的最长可能字符串。\n\n考虑这样一个场景：你有一段 HTML 代码，想要提取特定 HTML 标签内的内容。让我们创建一个示例 HTML\
  \ 文本：\n\n```r\n# 示例 HTML 文本\ntext <- \"<div class='main'><h1>Machine Learning &\
  \ AI</h1><div> <a href='DataSciencewithR.pdf'>Data Science with R</a> </div></div>\"\
  \n\n# 打印 'text'\ntext\n```\n\n```\n## \"<div class='main'><h1>Machine Learning &\
  \ AI</h1><div> <a href='DataSciencewithR.pdf'>Data Science with R</a> </div></div>\"\
  \n```\n\n贪婪匹配是正则表达式的默认行为，即模式匹配尽可能多的输入字符串。\n\n```r\n# 贪婪匹配\nstr_extract(text, \"\
  <div>.*</div>\")\n```\n\n```\n## \"<div> <a href='DataSciencewithR.pdf'>Data Science\
  \ with R</a> </div></div>\"\n```\n\n正则表达式 `<div>.*</div>` 匹配任何以 `<div>` 开头并以 `</div>`\
  \ 结尾的字符串，中间的 `.*` 量词匹配零个或多个任意字符的序列。\n\n现在，让我们在 `.*` 量词后添加一个 `?` 来将模式修改为非贪婪：\n\n\
  ```r\n# 非贪婪匹配\nstr_extract(text, \"<div>.*?</div>\")\n```\n\n这一次，函数返回了不同的结果：\n\n\
  ```\n## \"<div> <a href='DataSciencewithR.pdf'>Data Science with R</a> </div>\"\n\
  ```\n\n正则表达式 `<div>.*?</div>` 与之前的正则表达式相同，只是在 `.*` 量词后添加了一个 `?`。这个 `?` 告诉正则引擎尝试匹配满足该模式的最短可能字符串。\n\
  \n区别在于非贪婪模式 `<div>.*?</div>` 一遇到第一个闭合的 `<div>` 标签就停止匹配，而贪婪模式 `<div>.*</div>` 则继续匹配直到输入字符串的末尾。\n\
  \n#### 检测与提取模式\n\n本节将教授正则表达式在分析和从数据框中提取信息方面的实际应用。下面的数据框包含两条银行短信，一条用于借记交易，一条用于贷记交易。我们可以使用正则表达式从这些短信中提取信息，例如交易类型、金额和日期。\n\
  \n```r\n# 创建数据框 \"bank_messages\"\nbank_messages <- data.frame(\n  message = c(\n\
  \    \"Your Bank Acc XX998006 is debited for INR 555.68 on 10-Nov-23 towards paytmqroihh5855ap@paytm.\
  \ UPI Ref No 368033761556. If you have any concerns, please contact us at 1800-267-3456.\"\
  ,\n    \"Dear Customer, Your A/C XXXXX123456 has a credit by Cheque of Rs 80,000.00\
  \ on 30/10/23.\"\n  )\n)\n```\n\n让我们首先从 `bank_messages` 数据框的 `message` 列中提取提到的金额。这里我们假设所需的金额前面带有\
  \ INR 或 Rs。\n\n```r\n# 提取前面带有 \"INR\" 或 \"Rs\" 的金额\nbank_messages <- bank_messages\
  \ %>%\n  mutate(amount = str_extract(message, \"(?<=\\\\bINR\\\\s|\\\\bRs\\\\s)[0-9,]+\\\
  \\.?[0-9]*\"))\n\n# 查看结果\nView(bank_messages)\n```\n\n| Message | Amount |\n| ---\
  \ | --- |\n| Your Bank Acc XX998006 is debited for INR 555.68 on 10-Nov-23 towards\
  \ paytmqroihh5855ap@paytm. UPI Ref No 368033761556. If you have any concerns, please\
  \ contact us at 1800-267-3456. | 555.68 |\n| Dear Customer, Your A/C XXXXX123456\
  \ has a credit by Cheque of Rs 80,000.00 on 30/10/23. | 80,000.00 |\n\n表 6.14：提取了交易金额的银行短信数据框\n\
  \n让我们分解一下 `str_extract` 函数中使用的正则表达式：\n\n`\"(?<=\\\\bINR\\\\s|\\\\bRs\\\\s)[0-9,]+\\\
  \\.?[0-9]*\"`\n\n*   `(?<=\\\\bINR\\\\s|\\\\bRs\\\\s)`：这是一个正向后顾断言。它检查文本前面是否带有单词\
  \ INR 或 Rs（区分大小写）、单词边界 (`\\\\b`) 和空格 (`\\\\s`)。`\\\\b` 确保 INR 或 Rs 是一个完整的单词，而不是另一个单词的一部分。\n\
  *   `[0-9,]+`：这部分匹配一个或多个数字（0-9）或逗号。这允许捕获使用逗号作为千位分隔符的金额，例如 80,000。\n*   `\\\\.?`：这匹配一个可选的小数点\
  \ (`.`)。反斜杠 (`\\\\`) 用于转义点号，因为在正则表达式中，点号是一个匹配任意字符的特殊字符。问号 (`?`) 使小数点成为可选的，从而允许整数和小数金额。\n\
  *   `[0-9]*`：匹配小数点后零个或多个数字，捕获金额的小数部分。\n\n接下来，我们将创建两列 `credit` 和 `debit`，指示 `message`\
  \ 列是否包含单词 credit 和 debit，包括 credited 和 debited 等变体。正则表达式使用 `str_detect` 函数来检查 \"\
  message\" 列中是否存在指定的模式。\n\n```r\n# 添加列以指示消息是否包含 \"credit\" 或 \"debit\"\nbank_messages\
  \ <- bank_messages %>%\n  mutate(\n    has_credit = str_detect(message, \"\\\\bcredit(ed)?\\\
  \\b\"),\n    has_debit = str_detect(message, \"\\\\bdebit(ed)?\\\\b\")\n  )\n\n\
  # 查看数据框\nView(bank_messages)\n```\n\n| message | amount | has_credit | has_debit\
  \ |\n| --- | --- | --- | --- |\n| Your Bank Acc XX998006 is debited for INR 555.68\
  \ on 10-Nov-23 towards paytmqroihh5855ap@paytm. UPI Ref No 368033761556. If you\
  \ have any concerns, please contact us at 1800-267-3456. | 555.68 | FALSE | TRUE\
  \ |\n| Dear Customer, Your A/C XXXXX123456 has a credit by Cheque of Rs 80,000.00\
  \ on 30/10/23. | 80,000.00 | TRUE | FALSE |\n\n表 6.15：带有贷记和借记指示符的银行短信数据\n\n上述命令确定每条消息是否包含单词\
  \ credit 或 debit 及其变体。`dplyr` 包中的 `mutate` 函数用于向银行短信数据框添加两个新列 `has_credit` 和 `has_debit`。\n\
  \n*   `\\\\b`：这是一个单词边界断言。它确保匹配 credit 或 debit 作为完整单词，而不是作为另一个单词的一部分。\n\n\n\n\n*\
  \   `credit(ed)?`：此部分匹配单词 `credit`，并通过 `(ed)?` 使 `ed` 部分变为可选。这允许同时匹配 `credit` 和\
  \ `credited`。\n\n*   `debit(ed)?`：与 `credit` 部分类似，此部分匹配单词 `debit`，并使 `ed` 部分变为可选，允许匹配\
  \ `debit` 和 `debited` 等变体。\n\n*   如果消息包含单词 `credit` 或 `credited`，则 `has_credit`\
  \ 列将为 `TRUE`，否则为 `FALSE`。同理，如果消息包含单词 `debit` 或 `debited`，则 `has_debit` 列将为 `TRUE`，否则为\
  \ `FALSE`。\n\n接下来，我们将从 `bank_messages` 数据框的 `message` 列中提取日期。日期预期采用 `dd/mm/yy` 或\
  \ `dd-mmm-yy` 格式。生成的 `date` 列将包含在每条消息中找到的日期列表。\n\n```\n# Extract date from the message\
  \ column\nbank_messages <- bank_messages %>%\n  mutate(\n    date = str_extract_all(message,\
  \ \"\\\\b\\\\d{2}/\\\\d{2}/\\\\d{2}|\\\\d{2}-[a-zA-Z]{3}-\\\\d{2}\\\\b\")\n  )\n\
  # Display the modified data frame with the new \"date\" column.\nView(bank_messages)\n\
  ```\n\n| message | amount | has_credit | has_debit | date |\n| --- | --- | --- |\
  \ --- | --- |\n| Your Bank Acc XX998006 is debited for INR 555.68 on 10-Nov-23 towards\
  \ paytmqroihh5855ap@paytm. UPI Ref No 368033761556. If you have any concerns, please\
  \ contact us at 1800-267-3456. | 555.68 | FALSE | TRUE | 10-Nov-23 |\n| Dear Customer,\
  \ Your A/C XXXXX123456 has a credit by Cheque of Rs 80,000.00 on 30/10/23. | 80,000.00\
  \ | TRUE | FALSE | 30/10/23 |\n\n表 6.16：提取了交易日期的银行消息数据\n\n上述命令使用正则表达式提取两种格式的日期：`dd/mm/yy`\
  \ 和 `dd-mmm-yy`。`str_extract_all` 函数提取每条消息中所有出现的指定日期模式。\n\n*   `\\\\b`：单词边界断言，确认日期模式作为一个完整单词被匹配，而不是作为另一个单词的一部分。\n\
  *   `\\\\d{2}/\\\\d{2}/\\\\d{2}`：此部分匹配 `dd/mm/yy` 日期格式。它查找两位数字（日），后跟一个正斜杠，两位数字（月），另一个正斜杠，以及两位数字（年）。\n\
  *   `|`：管道符号充当逻辑 OR，允许正则表达式匹配 `dd/mm/yy` 或 `dd-mmm-yy` 格式。\n*   `\\\\d{2}-[a-zA-Z]{3}-\\\
  \\d{2}`：此部分匹配 `dd-mmm-yy` 日期格式。它查找两位数字（日），后跟一个连字符，三个字母代表月份（由于 `[a-zA-Z]` 不区分大小写），另一个连字符，以及两位数字（年）。\n\
  *   `\\\\b`：另一个单词边界断言，确保匹配的日期模式的完整性。\n\n下图展示了用于提取日期的正则表达式的分解结构。\n\n![](img/Figure6.1.png)\n\
  \n图 6.1：从消息列提取日期的正则表达式\n\n让我们检查另一种场景：从 `message` 列中提取遵循特定格式的电话号码。\n\n```\n# Extract\
  \ phone number\nbank_messages <- bank_messages %>%\n  mutate(\n    phone_number\
  \ = str_extract(message, \"\\\\b\\\\d{4}-\\\\d{3}-\\\\d{4}\\\\b\")\n  )\n```\n\n\
  上述命令提取预期遵循 `xxxx-xxx-xxxx` 格式的电话号码。\n\n```\n# View the dataframe\nView(bank_messages)\n\
  ```\n\n| message | amount | has_credit | has_debit | date | phone_number |\n| ---\
  \ | --- | --- | --- | --- | --- |\n| Your Bank Acc XX998006 is debited for INR 555.68\
  \ on 10-Nov-23 towards paytmqroihh5855ap@paytm. UPI Ref No 368033761556. If you\
  \ have any concerns, please contact us at 1800-267-3456. | 555.68 | FALSE | TRUE\
  \ | 10-Nov-23 | 1800-267-3456 |\n| Dear Customer, Your A/C XXXXX123456 has a credit\
  \ by Cheque of Rs 80,000.00 on 30/10/23. | 80,000.00 | TRUE | FALSE | 30/10/23 |\
  \ NA |\n\n表 6.17：提取了电话号码的银行消息数据\n\n正则表达式 `\\\\d{4}-\\\\d{3}-\\\\d{4}` 匹配电话号码模式 `xxxx-xxx-xxxx`。它查找四位数字，后跟一个连字符，三位数字，另一个连字符，以及四位数字。\n\
  \n正如你所见，我们使用正则表达式从 `bank_messages` 数据框中提取了交易类型、金额、日期和电话号码。这些信息可用于各种目的，例如欺诈检测和客户细分。\n\
  \n### 结论\n\n本章探讨了使用 `stringr` 包操作和清理字符串的基本技术。`stringr` 提供了多种用于操作字符串的函数。本章涵盖了基本字符串操作，如更改大小写、计算字符串长度、替换和移除子字符串、处理空白字符、填充和连接字符串。正则表达式提供了一种通用且高效的方式来搜索、编辑、操作和提取数据。它们可用于执行各种任务，例如：\n\
  \n*   **数据清洗**：移除不需要的字符、统一数据格式和纠正错误。\n*   **特征工程**：从现有数据创建新特征，例如提取日期和时间信息、识别产品类别和检测垃圾邮件。\n\
  *   **文本分析**：正则表达式可用于执行各种文本分析任务，如实体提取。\n\n在下一章中，您将学习如何使用数据可视化以可视化方式呈现您的发现。\n\n###\
