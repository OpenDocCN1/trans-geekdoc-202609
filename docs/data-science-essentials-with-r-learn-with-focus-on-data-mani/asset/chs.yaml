  ## 第 2 章：R 基础\n\n### 简介\n\n本章将简要概述 R 语言和 RStudio 界面。你将学习如何安装和加载包，以及创建不同类型的 R 对象，如向量、矩阵、列表、数组和数据框。R\
  \ 拥有大量内置函数。该语言还拥有自己的帮助页面，可通过访问它来了解更多关于函数的信息。你还将了解如何自行创建函数。接下来，你将学习在 R 中加载数据集并将任意数据导出到你的系统。本章将使你能够舒适地在下一阶段探索你的数据。\n\
  \n### 结构\n\n你将在本章涵盖以下主题：\n\n*   **RStudio 界面**\n    *   R 作为计算器\n    *   键盘快捷键\n\
  *   **包**\n    *   安装包\n    *   加载包\n*   **工作目录**\n*   **对象**\n    *   向量\n\n\n\n\
  \n\n### 属性\n\n### 矩阵\n\n### 数组\n\n### 类\n\n### 列表\n\n### 数据框\n\n### 函数\n\n# 使用帮助页面获取帮助\n\
  \n##### 加载数据\n\n### 保存数据\n\n# R 惯例\n\n### 目标\n\n在本章结束时，您将掌握 R 语言的基础知识，从而具备高效使用 R\
  \ 进行数据分析的技能。本章将全面概述使用 R 所需的基本概念，包括 RStudio 界面、包、工作目录、不同的 R 对象、函数、加载和保存数据以及 R 惯例。\n\
  \n### RStudio 界面\n\nR 是一种编程语言，能够处理大型数据集、执行复杂计算，并创建可视化图表以帮助您理解数据。它是开源且免费使用的，使得任何对统计计算感兴趣的人都能轻松上手。它拥有庞大且活跃的用户和开发者社区，他们为各种包和库的开发与维护做出贡献。下图展示了\
  \ R 编程的几个特性：\n\n![](img/Figure2.1.png)\n\n图 2.1：R 的特性\n\n当您首次打开 R 时，可能会感到无从下手。这就是\
  \ RStudio 发挥作用的地方。RStudio 是一个集成开发环境（IDE），它使得各个层次的用户都能更流畅、更便捷地使用 R。\n\nRStudio 界面有四个主要面板：\n\
  \n*   **控制台**：您在此输入命令并查看输出。\n*   **脚本编辑器**：您在此输入命令并将其保存到文件中。您也可以提交命令在控制台中运行。\n*\
  \   **环境/历史**：您在此查看所有活动对象和历史记录，以追踪在控制台中运行的所有命令。\n*   **文件/图表/包/帮助**\n\n安装并启动 RStudio\
  \ 后，将显示以下界面：\n\n![](img/Figure2.2.png)\n\n图 2.2：RStudio 界面\n\n您还可以通过转到 `Tools |\
  \ Global Options | Pane Layout` 来添加和移除面板。\n\n#### R 作为计算器\n\n现在，让我们进入 Aarya 的故事，她想用\
  \ R 来分析她的 Netflix 使用数据。她首先将 R 用作计算器。她想计算出过去一周内，她观看 Netflix 电影和电视剧总共花费了多少小时。以下是 Aarya\
  \ 记下的信息：\n\n*   她看了两部电视剧，每部 12 集。每集 30 分钟。\n*   此外，她还看了三部 2 小时的电影。\n\n![](img/Figure2.3.jpg)\n\
  \n图 2.3：Aarya 分析其 Netflix 数据的示意图\n\n上图展示了 Aarya 分析其 Netflix 数据的过程。Aarya 使用 R 中的简单算术运算来计算总小时数。\n\
  \n对于电视剧，Aarya 观看了 12 x 2 = 24 集。每集 30 分钟，因此观看电视剧的总时间为 24 x 30 = 720 分钟。要将分钟转换为小时，Aarya\
  \ 可以除以 60。因此，观看电视的总时间为：720 / 60 = 12 小时。\n\n对于电影，Aarya 总共观看了 3 x 2 = 6 小时。要计算观看电视剧和电影的总时间，Aarya\
  \ 可以将小时数相加：12 + 6 = 18 小时。下图显示了 R 控制台中的计算过程：\n\n![](img/Figure2.4.png)\n\n图 2.4：R\
  \ 控制台中的基本计算\n\n因此，Aarya 使用 R 中的简单算术运算计算了在 Netflix 上观看电视剧和电影的总小时数。\n\n#### 键盘快捷键\n\
  \n了解 RStudio 的键盘快捷键将帮助您更快地编程。您可以通过顶部菜单 `Tools | Keyboard Shortcuts Help`（快捷键：`Alt\
  \ + Shift + K`）访问 RStudio 提供的数十个有用快捷键，如下所示。\n\n![](img/Figure2.5.jpg)\n\n图 2.5：R\
  \ 快捷键\n\n表 2.1 列出了一些基本的 RStudio 快捷键。\n\n| 快捷键 | 操作 |\n| --- | --- |\n| `Ctrl + Enter`\
  \ | 运行当前行/选中的代码 |\n| `Ctrl + Shift + N` | 创建新的 R 脚本文件 |\n| `Ctrl + Shift + C` |\
  \ 注释或取消注释当前行或选中的代码 |\n| `Ctrl + Shift + D` | 复制当前行或选中的代码 |\n| `Ctrl + 1` | 将光标移至脚本编辑器\
  \ |\n| `Ctrl + 2` | 将光标移至控制台 |\n| `Ctrl + L` | 清空控制台 |\n| `Ctrl + Shift + H` | 更改工作目录\
  \ |\n| `Ctrl + Shift + M` | 插入 `%>%`（管道操作符） |\n\n表 2.1：常用 R 键盘快捷键\n\n学习并熟练掌握快捷键值得花费时间，这能提高您的工作效率和流程效率。如果您想个性化外观，RStudio\
  \ 提供了大量选项。请转到 `Tools | Global Options | Appearance` 探索各种选择。\n\n### 包\n\n当您下载并安装\
  \ R 时，它附带一组默认函数，可用于各种用途。然而，随着全球 R 社区开发新的函数和功能，将它们全部纳入核心软件包已变得不切实际。相反，许多函数被捆绑到包中，可根据需要下载和安装，以解决这一问题。\n\
  \nR 包是函数、数据集和文档的集合，旨在协同工作。例如，一些包专门用于数据整理，而另一些则专门用于数据可视化。\n\n例如，安装一个包就像为您的汽车订购一项新功能，例如导航系统。您不能立即使用它，因为您需要先安装它。一旦新功能安装在您的车上，您就可以打开并使用它。\n\
  \n同样，要使用一个新的 R 包，您首先需要使用 `install.packages()` 函数将其安装在您的计算机上。此外，您还需要使用 `library()`\
  \ 函数将包加载到您的工作会话中，以访问它提供的新函数和功能。\n\n就像您可以在车上安装多个功能，但在特定时间只开启您需要的那些一样，您可以在计算机上安装多个\
  \ R 包，但只为特定项目加载所需的包。下图展示了汽车显示系统和车载导航应用的示意图：\n\n![](img/Figure2.6.png)\n\n图 2.6：汽车显示系统中的显示系统和导航应用\n\
  \n例如，要安装 `lubridate` 包（包含处理日期的实用函数），您只需将包名 `lubridate` 作为字符串参数传递给该函数：\n\n```\n#\
  \ install the lubridate package\ninstall.packages(\"lubridate\")\n```\n\n包下载并安装完成后，您可以使用\
  \ `library()` 函数将其加载到 R 会话中：\n\n```\n# load the lubridate package\nlibrary(lubridate)\n\
  ```\n\n加载后，您就可以在代码中使用该包提供的函数，就像使用任何其他 R 函数一样。\n\n> **注意：** R 中的井号（`#`）是注释符号。请为您的代码添加注释，以阐明每部分代码的功能。如果您这样做，其他人（以及未来的您自己！）会更容易理解您的代码。\n\
  \n有几个良好的实践可以帮助您更高效、更有效地使用包。\n\n*   **在脚本开头加载包**：最好在脚本开头加载您将要使用的所有包。这将确保在代码运行前安装并加载所有必要的包，避免因缺少依赖项而导致的潜在错误或问题。\n\
  *   **定期更新包**：R 社区不断更新和改进包，因此保持包的更新很重要。您可以通过定期运行 `update.packages()` 函数来实现这一点，该函数将检查已安装包的更新并安装任何可用的新版本。\n\
  *   **注意包的依赖关系**：某些包可能依赖于其他包，这意味着您需要安装并加载这些依赖包，才能使用您想要的包。\n\n\n\n\n\n### 避免命名空间冲突\n\
  \n如果您使用来自多个包且名称相同的函数，可能会遇到命名空间冲突。为避免这种情况，您可以使用 `::` 运算符来指定要使用哪个包的函数。例如，不使用 `summarize()`，而是可以使用\
  \ `dplyr::summarize()` 来指定要使用 `dplyr` 包中的 `summarize()` 函数。\n\n### 工作目录\n\n使用 R\
  \ 时，保持文件井然有序至关重要。这意味着为您正在处理的每个项目创建一个文件夹，并将相关文件保留在该文件夹中。R 工作目录是 R 默认启动时所在的文件夹。\n\n\
  R 使用您计算机上的一个指定文件夹（称为工作目录）来定位与特定项目相关的文件。在这里，R 查找要加载的文件并保存文件。在不同的计算机上，您的工作目录位置可能不同，并且一次只能打开一个工作目录。要确定当前工作目录，可以运行以下代码：\n\
  \n```\n### 查看当前工作目录\ngetwd()\n## “C:/Users/Hp/Documents”\n```\n\n在整理数据集时，您有两个选择：第一，将文件放入您的工作目录中；第二，将工作目录更改为存储文件的文件夹。您可以使用函数\
  \ `setwd()` 并指定新工作目录的文件路径，将工作目录修改为计算机上的任意文件夹。请看以下示例：\n\n```\n### 设置工作目录\nsetwd(“E:/Book_Project”)\n\
  ```\n\n从菜单栏，您可以点击 **Session | Set Working Directory | Choose Directory**（会话 | 设置工作目录\
  \ | 选择目录）来更改工作目录。要查看工作目录中的文件，可以使用函数 `list.files()`。\n\n在 R 中读写文件时，注意您的工作目录至关重要。如果您不在正确的文件夹中工作，可能会遇到错误或覆盖现有文件。保持文件井然有序并适当设置工作目录，可确保您的\
  \ R 代码具有可复现性，且易于与他人共享。\n\n### 对象\n\n让我们回到 Aarya 的例子。为了分析她的 Netflix 使用情况，Aarya 首先必须理解\
  \ R 中对象的概念。对象是一种通过将数据存储在指定名称内来保存数据的方式，该名称可用于调用存储的数据。所有数据都存储在对象中，范围从简单的数字或字符串到复杂的结构，如统计分析摘要和绘图。\n\
  \n为了继续她的分析，Aarya 创建了三个不同的 R 对象，分别称为 `hours_watched_movies`、`hours_watched_tv` 和\
  \ `total_hours_watched`，以分别保存她观看电影、电视节目以及观看 Netflix 总共花费的小时数。有了这些对象，Aarya 可以执行许多操作来高效地分析她的数据。要将名称分配给数字，您可以使用赋值运算符：`<-`（`<`\
  \ 和 `-` 之间无空格）。请看以下示例：\n\n```\n# 定义 hours_watched_movies\nhours_watched_movies <-\
  \ 6\n\n# 存储观看电视节目所花费的时间（小时）\nhours_watched_tv <- 12\n\n# 将总花费时间（小时）保存到 total_hours_watched\n\
  total_hours_watched <- 18\n```\n\n要检查 `total_hours_watched` 对象中存储的内容，Aarya 只需在 R\
  \ 控制台中输入其名称 `total_hours_watched`，它将在下一行显示对象值：\n\n```\n# 显示存储在 total_hours_watched\
  \ 中的值\ntotal_hours_watched\n## 18\n```\n\n> **注意：** 全书中，R 代码的输出将后跟 `##`。\n\n现在，让我们看看\
  \ Aarya 如何创建各种 R 对象并为它们赋值，以高效地分析她的数据。\n\n### 向量\n\n向量是相同数据类型元素的集合。向量可以包含数字、字符或逻辑值，但不能包含这些数据类型的混合。向量是\
  \ R 最基本的数据结构，用于许多不同的目的，例如存储数据或执行数学运算。向量可以被视为一维数组，向量中的每个元素都有一个索引或位置。理解如何创建和操作向量至关重要，因为它们是更复杂的数据结构和分析的基础。让我们进一步了解其中一些类型的向量。\n\
  \n#### 数值向量\n\nAarya 可以使用数值向量来存储她在 Netflix 上观看的每部电影或电视节目的时长。例如，她可以创建一个名为 `movie_durations`\
  \ 的数值向量，并将她观看的每部电影的时长分配给它。例如：\n\n```\n# 创建观看电影时长的向量\nmovie_durations <- c(98, 109,\
  \ 124, 138, 115, 149)\n\n# 打印 movie_durations\nmovie_durations\n## 98 109 124 138\
  \ 115 149\n```\n\n这将创建一个名为 `movie_durations` 的数值向量，包含 6 个元素，分别代表她观看的每部电影的时长（以分钟为单位）。`c()`\
  \ 用于创建向量或将两个或更多向量连接在一起。`c()` 函数代表 combine（合并）或 concatenate（连接），是 R 中最常用的函数之一。\n\n\
  #### 字符向量\n\n字符向量存储一系列字符值。字符值是您想要存储的任何文本，例如单词、句子或单个字符。您可以使用 `c()` 函数通过用引号括起值来创建字符向量。例如，Aarya\
  \ 创建一个字符向量来存储她观看的电影：\n\n```\n# 创建观看电影标题的向量\nmovie_titles <- c(“Rush Hour”, “Knight\
  \ and Day”, “The Notebook”, “Shutter Island”, “Now you see me”, “The Da Vinci Code”)\n\
  \n# 打印 movie_titles\nmovie_titles\n## “Rush Hour” “Knight and Day” “The Notebook”\n\
  ## “Shutter Island” “Now you see me” “The Da Vinci Code”\n```\n\n> **注意：** 字符串是字符向量的单个组成部分。因此，如果您将数字用引号括起来，例如：`1`，它将仅被视为字符向量。任何被引号括起来的内容都被视为字符串。\n\
  \n现在，如果 Aarya 想知道她上个月看了多少部电影，她可以使用 `length()` 函数来确定该向量中有多少个元素，如以下示例所示：\n\n```\n\
  # 计算 movie_titles 中的元素数量\nnum_movie_titles <- length(movie_titles)\n\n# 打印结果\ncat(“Number\
  \ of movies watched on Netflix last month:”, num_movie_titles)\n## Number of movies\
  \ watched on Netflix last month: 6\n```\n\n#### 逻辑向量\n\nR 形式的布尔数据是存储 `TRUE` 和 `FALSE`\
  \ 的逻辑向量。指示 Aarya 在给定日期是否观看了电影的向量显示如下：\n\n```\n# 创建逻辑向量 watched\nwatched <- c(TRUE,\
  \ FALSE, TRUE, FALSE, TRUE, TRUE, FALSE)\n\n# 打印 watched\nwatched\n## TRUE FALSE\
  \ TRUE FALSE TRUE TRUE FALSE\n```\n\n对于指示 Aarya 是否在给定类型中观看了电影的向量：\n\n```\n# 创建向量\
  \ genre\ngenre <- c(“Action”, “Action”, “Romance”, “Thriller”, “Thriller”, “Thriller”)\n\
  \n# 检查电影是否属于 “Thriller”\nwatched_thriller <- genre == “Thriller”\n\n# 打印 watched_thriller\n\
  watched_thriller\n## FALSE FALSE FALSE TRUE TRUE TRUE\n```\n\n对于指示 Aarya 对电影或电视节目给出“赞”或“踩”评分的向量：\n\
  \n```\n# 创建向量 rating\nrating <- c(“Thumbs Up”, “Thumbs Down”, “Thumbs Down”, “Thumbs\
  \ Up”, “Thumbs Up”, “Thumbs Up”)\n\n# 检查电影是否被评为 “Thumbs Up”\nwatched_good <- rating\
  \ == “Thumbs Up”\n\n# 打印 watched_good\nwatched_good\n## TRUE FALSE FALSE TRUE TRUE\
  \ TRUE\n```\n\nR 中最常用的逻辑运算符有：\n\n| Operators | Description |\n| --- | --- |\n\n\n\
  \n\n#### 逻辑运算符\n\n| 运算符 | 含义 |\n| :--- | :--- |\n| `==` | 等于 |\n| `!=` | 不等于 |\n\
  | `<` | 小于 |\n| `>` | 大于 |\n| `<=` | 小于或等于 |\n| `>=` | 大于或等于 |\n| `&` | 逻辑与 |\n\
  | `\\|` | 逻辑或 |\n| `!` | 逻辑非（取反） |\n\n**表 2.2：R 语言中使用的逻辑运算符**\n\n### 属性\n\nAttributes\n\
  \n属性是与 R 对象关联的附加信息。它们提供关于对象的元数据，例如名称、维度、类或描述其属性的其他信息。属性不影响对象的行为，但有助于组织和操作数据。\n\n\
  例如，当 Aarya 创建向量或矩阵时，她可以为对象分配属性来描述其属性。她可以使用 `names()` 为向量元素分配名称，使用 `dim()` 为矩阵分配维度，或使用\
  \ `class()` 函数为对象分配类，以指示其数据类型或结构。\n\n通过使用属性，Aarya 可以跟踪数据的结构和属性，这有助于她更有效地操作和分析数据。属性在\
  \ R 编程中也起着至关重要的作用，因为许多函数和操作使用它们来确定如何处理或转换数据。下文将进一步讨论不同类型的属性。\n\n#### 名称\n\n`names()`\
  \ 函数为向量、列表或数组的元素分配或检索名称。它是组织数据并使其更易于理解的宝贵工具。\n\n例如，让我们创建一个包含 Aarya 上周观看的所有电视节目及其各自观看时长的向量：\n\
  \n```r\n# TV Shows watched\ntv_shows_names <- c(\"Breaking Bad\", \"Money Heist\"\
  , \"The office\", \"Suits\", \"The Last Kingdom\")\n\n# time spent on watching each\
  \ TV show in minutes\nduration <- c(120, 142, 64, 90, 185)\n\n# adding and accessing\
  \ attributes\n# assign names to duration\nnames(duration) <- tv_shows_names\n```\n\
  \n现在，`duration` 拥有名称属性：\n\n```r\n# print names and attributes of the vector duration\n\
  names(duration)\n## \"Breaking Bad\" \"Money Heist\" \"The office\" \"Suits\" \"\
  The Last Kingdom\"\n\nattributes(duration)\n## $names\n## \"Breaking Bad\" \"Money\
  \ Heist\" \"The office\" \"Suits\" \"The Last Kingdom\"\n```\n\n每当我们打印 `duration`\
  \ 向量时，R 都会在 `duration` 元素上方显示节目名称：\n\n```r\n# print duration\nduration\n## Breaking\
  \ Bad Money Heist The office Suits The Last Kingdom \n## 120 142 64 90 185\n```\n\
  \n#### 维度\n\n`dim()` 函数通过分配维度属性将向量转换为 n 维数组。为此，您可以将 `dim()` 设置为长度为 n 的向量，其中 n 是您希望数组拥有的维度数。这允许您重塑和操作存储在向量中的数据，以适应特定的矩阵或数组结构。\n\
  \n例如，Aarya 想要将她的 `duration` 向量转换为一个 5 X 1 矩阵（5 行 1 列）。她使用以下代码创建它：\n\n```r\n# set\
  \ the dimension of the vector\ndim(duration) <- c(5, 1)\n\n# print duration vector\n\
  duration\n##      [,1]\n## [1,]  120\n## [2,]  142\n## [3,]   64\n## [4,]   90\n\
  ## [5,]  185\n```\n\nR 始终将 `dim` 中的第一个值视为行数，第二个值视为列数。在任何涉及行和列的 R 操作中，行总是排在第一位。\n\
  \n### 矩阵\n\nMatrices\n\n矩阵是只能容纳同类数据的二维数组。您可以将矩阵视为一组长度相同、按矩形模式排列的向量。`matrix()` 方法用于构建矩阵。\n\
  \n您可以使用 `matrix()` 创建矩阵，并通过将 `nrow` 参数设置为数字来指定行数。然后 `matrix()` 会将您的向量组织成具有指定行数的矩阵。例如，让我们用一个数值向量创建一个矩阵并将\
  \ `nrow` 设置为 3：\n\n```r\n# create a matrix \nsimple_matrix <- matrix(1:6, nrow =\
  \ 3)\n\n# print simple_matrix\nsimple_matrix\n##      [,1] [,2]\n## [1,]    1  \
  \  4\n## [2,]    2    5\n## [3,]    3    6\n```\n\n假设 Aarya 记录了周六和周日观看不同电视剧的小时数。接下来，Aarya\
  \ 创建一个矩阵来展示她的数据：\n\n```r\n# create a vector with the duration of TV shows in hours\n\
  tv_duration <- c(2, 1, 2, 3)\n\n# create a matrix with a number of hours spent watching\
  \ each TV shows\ntv_matrix <- matrix(tv_duration, nrow = 2, ncol = 2, byrow = TRUE)\n\
  \n# assign row and column names\n# setting the vector tv_shows_names vector which\
  \ we created earlier as rownames\nrownames(tv_matrix) <- c(\"Breaking Bad\", \"\
  Money Heist\")\n\n# assign column names\ncolnames(tv_matrix) <- c(\"Saturday\",\
  \ \"Sunday\")\n\n# print tv_matrix\ntv_matrix\n##         Saturday Sunday\n## Breaking\
  \ Bad      2      1\n## Money Heist       2      3\n```\n\n默认情况下，`matrix()` 按列填充矩阵，如果您想按行填充，可以将参数\
  \ `byrow` 设置为 `TRUE`。现在 Aarya 可以使用 `dim()` 方法获取矩阵的维度：\n\n```r\n# get the dimensions\
  \ of the matrix\ndim(tv_matrix)\n## [1] 2 2\n```\n\n输出显示 `tv_matrix` 有 2 行 2 列（第一个值是行数，第二个值是列数）。\n\
  \n### 数组\n\nArrays\n\n数组是具有两个以上维度的多维对象，可以包含任意类型的数据，类似于矩阵。与向量或矩阵相比，Aarya 可以使用数组以更复杂的方式存储和分析她的\
  \ Netflix 数据。\n\n例如，假设 Aarya 想要创建一个数组，按类型和设备划分，保存她上个月每天观看 Netflix 的分钟数。她可以使用 `array()`\
  \ 构建数组来存储这些数据。Aarya 想要存储在数组中的数据是 `array()` 的第一个参数。数组的维度由第二个参数中的数值向量指定：\n\n```r\n\
  # create a 3-dimensional array\nduration_array <- array(data = c(30:39, 50:59, 20:29),\
  \ \n                        dim = c(5, 2, 3))\n\n# note: the : operator in R is\
  \ used to create a sequence of numbers. It takes two values, a starting value and\
  \ an ending value, and generates a sequence of numbers that includes all the integers\
  \ between those two values, inclusive.\n\n# print duration_array\nduration_array\n\
  \n## , , 1\n##\n##      [,1] [,2]\n## [1,]   30   35\n## [2,]   31   36\n## [3,]\
  \   32   37\n## [4,]   33   38\n## [5,]   34   39\n##\n## , , 2\n##\n##      [,1]\
  \ [,2]\n## [1,]   50   55\n## [2,]   51   56\n## [3,]   52   57\n## [4,]   53  \
  \ 58\n## [5,]   54   59\n##\n## , , 3\n##\n##      [,1] [,2]\n## [1,]   20   25\n\
  ## [2,]   21   26\n## [3,]   22   27\n## [4,]   23   28\n## [5,]   24   29\n```\n\
  \n现在，让我们看看通过为数组添加维度名称后的结果：\n\n```r\n# assign names to the dimensions of the array\n\
  dimnames(duration_array) <- list(days = c(\"Week 1\", \"Week 2\", \"Week 3\", \"\
  Week 4\", \"Week 5\"),\n                                 genre = c(\"Comedy\", \"\
  Action\"),\n                                 device = c(\"TV\", \"Laptop\", \"Phone\"\
  ))\n\n# Print the array\nduration_array\n## , , device = TV\n##\n##      genre\n\
  ## days      Comedy Action\n## Week 1      30     35\n## Week 2      31     36\n\
  ## Week 3      32     37\n## Week 4      33     38\n## Week 5      34     39\n##\n\
  ## , , device = Laptop\n##\n##      genre\n## days      Comedy Action\n## Week 1\
  \      50     55\n## Week 2      51     56\n## Week 3      52     57\n## Week 4\
  \      53     58\n## Week 5      54     59\n##\n## , , device = Phone\n##\n##  \
  \    genre\n## days      Comedy Action\n## Week 1      20     25\n## Week 2    \
  \  21     26\n```\n\n\n\n\n## 第 3 周 22 27\n\n## 第 4 周 23 28\n\n## 第 5 周 24 29\n\n\
  正如我们在此处所见，Aarya 创建了一个名为 `duration_array` 的三维数组来存储她的 Netflix 数据。该数组有 5 行（每周一行）、2\
  \ 列（一列用于喜剧，一列用于动作片）和 3 层（每层对应一种观看 Netflix 的设备）。她使用 `dimnames()` 为数组的每个维度分配了名称。\n\
  \n### 类\n\nR 中的每个对象都有一个 `class` 属性，用于标识该对象的类型。这一点至关重要，因为 R 拥有大量可用于各种对象类型的函数。例如，你可以使用\
  \ `mean()` 函数计算数值向量的平均值，但不能用它来计算字符向量的平均值。这是因为对字符串求平均值在逻辑上讲不通。\n\n当我们创建对象时，R 可能会自动为其分配一个类。例如，当你使用\
  \ `c()` 函数创建一个数字向量时，R 会为其分配 `numeric` 类。`class()` 函数也允许你直接为对象分配一个类。下表展示了用于测试变量中存储的数据类型以及在必要时在不同数据类型之间转换变量的函数：\n\
  \n| 数据类型 | 逻辑测试 | 强制转换函数 |\n| --- | --- | --- |\n| 数值型 | `is.numeric()` | `as.numeric()`\
  \ |\n| 整数型 | `is.integer()` | `as.integer()` |\n| 字符型 | `is.character()` | `as.character()`\
  \ |\n| 逻辑型 | `is.logical()` | `as.logical()` |\n| 因子 | `is.factor()` | `as.factor()`\
  \ |\n| 日期 | `is.Date()` | `as.Date()` |\n| POSIXct | `is.POSIXct()` | `as.POSIXct()`\
  \ |\n| 矩阵 | `is.matrix()` | `as.matrix()` |\n| 数组 | `is.array()` | `as.array()`\
  \ |\n\n表 2.3：不同数据类型的逻辑测试和强制转换函数\n\n`is.*` 函数返回一个逻辑值（`TRUE` 或 `FALSE`），指示输入变量是否为指定类型。`as.*`\
  \ 函数将输入变量强制转换为指定类型。重要的是要注意，强制转换可能导致数据丢失或意外行为，因此应谨慎使用。\n\n> **注意：** 你也可以使用 `c()`\
  \ 连接不同数据类型的向量，例如数值向量和字符向量。然而，当你连接不同数据类型的向量时，R 会将所有值转换为单一数据类型。\n\n### 日期和时间\n\nR\
  \ 提供了多种用于处理日期和时间的类，包括 `Date`、`POSIXct` 和 `POSIXlt`。这些类使 Aarya 能够存储和操作日期和时间值，从而更容易随时间分析她的\
  \ Netflix 使用情况。\n\n例如，Aarya 可以使用 `as.Date()` 函数创建一个日期对象，表示她开始观看某个电视节目的日期。她也可以使用\
  \ `as.POSIXct()` 创建一个 `POSIXct` 对象，表示她开始观看某一集的具体时间。创建后，她可以对这些对象执行各种操作，例如使用 `format()`\
  \ 函数提取月份或年份，或使用 `difftime()` 函数计算两个日期之间经过的时间。我们将在第 5 章“处理日期”中深入探讨日期功能。\n\n现在，假设\
  \ Aarya 想计算她在一月份观看电视节目所花费的总时间。她可以首先创建一个 `POSIXct` 向量，包含她在一月观看的所有节目的开始时间。她可以使用 `as.POSIXct()`\
  \ 函数来实现这一点：\n\n```r\n# 观看电视节目的开始时间\njan_start_times <- as.POSIXct(c(\"2023-01-07\
  \ 14:00:00\", \"2023-01-08 15:30:00\", \"2023-01-14 18:00:00\", \"2023-01-22 19:00:00\"\
  ))\n```\n\n接下来，她可以创建一个 `POSIXct` 向量，包含她在一月观看的所有节目的结束时间：\n\n```r\n# 观看电视节目的结束时间\n\
  jan_end_times <- as.POSIXct(c(\"2023-01-07 16:00:00\", \"2023-01-08 16:30:00\",\
  \ \"2023-01-14 20:00:00\", \"2023-01-22 22:00:00\"))\n```\n\n现在，她可以通过从结束时间减去开始时间来计算每个节目的时长，如下所示：\n\
  \n```r\n# 计算每个节目花费的时间\njan_durations <- jan_end_times - jan_start_times\n\n# 打印\
  \ jan_durations\njan_durations\n## Time differences in hours\n## 2 1 2 3\n```\n\n\
  最后，她可以将这些时长相加，得到她在一月份观看电视节目的总时长：\n\n```r\n# 计算总时长\njan_total_duration <- sum(jan_durations)\n\
  \n# 打印 jan_total_duration\njan_total_duration\n## Time difference of 8 hours\n```\n\
  \n通过这种方式，Aarya 可以利用日期和时间对她的 Netflix 使用情况随时间的变化进行基本计算和分析。\n\n### 因子\n\n在 R 中，分类数据使用因子表示。电影类型或评分是固定可能值集合内分类数据的示例。在\
  \ R 对因子的表示中，每个数字代表一个不同的类别。\n\n因子是存储字符值的高效方式，因为它们使用整数向量来表示唯一值，每个值仅存储一次。这种存储方法在保持原始字符信息的同时减少了存储数据所用的内存。例如，Aarya\
  \ 的 Netflix 数据中有一列用于电影类型和评分。在 `factor()` 函数的帮助下，她可以将这些列转换为因子。假设 Aarya 有以下数据：\n\n\
  ```r\n# 创建电影类型向量\nmovie_genres <- c(\"Action\", \"Action\", \"Romance\", \"Thriller\"\
  , \"Thriller\", \"Thriller\")\n\n# movie_genres 的类\nclass(movie_genres)\n## \"character\"\
  \n\n# 创建电影评分向量\nmovie_ratings <- c(4, 3, 2, 5, 5, 3)\n\n# movie_ratings 的类\nclass(movie_ratings)\n\
  ## \"numeric\"\n```\n\nAarya 可以按如下方式从这些向量创建因子：\n\n```r\n# 为电影类型创建因子\nmovie_genres_factor\
  \ <- factor(movie_genres)\n\n# movie_ratings 的类（原文如此，应为 movie_genres_factor 的类）\n\
  class(movie_genres_factor)\n## \"factor\"\n\n# 为电影评分创建因子\nmovie_ratings_factor <-\
  \ factor(movie_ratings)\n\n# movie_ratings_factor 的类\nclass(movie_ratings_factor)\n\
  ## \"factor\"\n```\n\n在本例中，Aarya 创建了两个因子：`movie_genres_factor` 和 `movie_ratings_factor`。R\
  \ 会为因子中的每个唯一值分配一个整数值。Aarya 可以使用 `levels()` 函数查看每个因子中的唯一值：\n\n```r\n# 查看电影类型因子中的唯一值\n\
  levels(movie_genres_factor)\n## \"Action\" \"Romance\" \"Thriller\"\n\n# 查看电影评分因子中的唯一值\n\
  levels(movie_ratings_factor)\n## \"2\" \"3\" \"4\" \"5\"\n```\n\nAarya 也可以使用 `levels()`\
  \ 函数为每个水平分配自定义标签：\n\n```r\n# 为电影类型因子分配自定义标签\nlevels(movie_genres_factor) <- c(\"\
  Act\", \"Rom\", \"Thrill\")\n\n# 为电影评分因子分配自定义标签\nlevels(movie_ratings_factor) <-\
  \ c(\"two\", \"three\", \"four\", \"five\")\n```\n\n因子还可以是有序或无序的。在 Aarya 的例子中，她可能想根据评分对电影进行排序。她可以使用\
  \ `ordered()` 函数创建一个有序因子：\n\n```r\n# 为电影评分创建有序因子\nmovie_ratings_ordered_factor <-\
  \ ordered(movie_ratings, levels = c(2, 3, 4, 5))\n\n# 打印 movie_ratings_ordered_factor\n\
  movie_ratings_ordered_factor\n## 4 3 2 5 5 3\n## Levels: 2 < 3 < 4 < 5\n```\n\n\
  `levels = c(2, 3, 4, 5)` 参数指定了因子中水平的顺序。在本例中，我们按评分升序指定了水平，从 2 到 5：\n\n```r\n# 查看电影评分因子中的有序水平\n\
  levels(movie_ratings_ordered_factor)\n## \"2\" \"3\" \"4\" \"5\"\n```\n\n因子是 R 中表示分类数据的基本数据类型，`factor()`\
  \ 函数可以轻松地将字符向量转换为因子。\n\n### 列表\n\n\n\n\n\n# R 语言中的列表\n\n列表是 R 语言中一种有用的数据结构，可以容纳任意\
  \ R 对象的集合。与向量和矩阵不同，列表中的对象允许不同的类型，包括字符型、数值型，甚至其他列表。因此，列表非常通用，有助于完成各种任务，例如排列复杂的数据结构或开发自定义函数。Aarya\
  \ 可以使用列表以有意义的方式组织她的 Netflix 数据，如下面的列表所示：\n\n```r\n# 创建一个向量列表\nmovies_list <- list(\n\
  \  movie_names = c(\"Inception\", \"The Dark Knight\", \"Edge of Tomorrow\"),\n\
  \  movie_durations = c(148, 152, 113),\n  genre = factor(c(\"Sci-fi\", \"Action\"\
  , \"Sci-fi\")),\n  ratings = factor(c(3, 5, 4), ordered = TRUE, levels = c(3, 4,\
  \ 5))\n)\n\n# 打印列表\nmovies_list\n```\n\n## 输出\n\n```\n## $movie_names\n## [1] \"\
  Inception\" \"The Dark Knight\" \"Edge of Tomorrow\"\n##\n## $movie_durations\n\
  ## [1] 148 152 113\n##\n## $genre\n## [1] Sci-fi Action Sci-fi\n## Levels: Action\
  \ Sci-fi\n##\n## $ratings\n## [1] 3 5 4\n## Levels: 3 < 4 < 5\n```\n\n在本例中，我们创建了一个名为\
  \ `movies_list` 的列表，它包含四个不同类型的向量——字符型、数值型、因子和有序因子。我们使用 `list()` 函数创建列表，并使用相同的语法为每个向量分配了名称。\n\
  \n### 数据框\n\n数据框是一种包含行和列的表格结构。它无非就是列表的二维版本。每一列可以有不同的数据类型，且必须有一个名称。数据框常用于存储和操作数据，因为它们易于处理，并允许进行许多操作，例如筛选、排序和汇总数据。让我们熟悉一下数据框，这是最常用的\
  \ R 对象之一。\n\n利用 Aarya 的 Netflix 数据，她可以创建一个包含 `movie_names`、`movie_durations` 和 `watched_scifi`\
  \ 列的数据框。每个向量的长度必须相同。她使用 `data.frame()` 来创建数据框。请参考下面的数据框示意图：\n\n![](img/Figure2.7.png)\n\
  \n图 2.7：R 语言中数据框的表示\n\n```r\n# 创建数据框\nnetflix_df <- data.frame(\n  movie_names =\
  \ c(\"Inception\", \"The Dark Knight\", \"Edge of Tomorrow\"),\n  movie_durations\
  \ = c(148, 152, 113),\n  watched_scifi = c(TRUE, FALSE, TRUE)\n)\n\n# 打印 netflix_df\n\
  netflix_df\n```\n\n## 输出\n\n```\n## movie_names movie_durations watched_scifi\n\
  ## Inception 148 TRUE\n## The Dark Knight 152 FALSE\n## Edge of Tomorrow 113 TRUE\n\
  ```\n\n```r\n# netflix_df 的类\nclass(netflix_df)\n```\n\n## 输出\n\n```\n## \"data.frame\"\
  \n```\n\n`str()` 代表结构，用于显示 R 对象的结构。当应用于数据框时，`str()` 提供了一种显示数据框内部结构的紧凑方式。它显示数据框中变量名、数据类型以及每个变量的前几个值。如果我们在\
  \ R 控制台中应用 `str(netflix_df)`，将显示数据框的以下结构：\n\n```r\n# 数据框 netflix_df 的结构\nstr(netflix_df)\n\
  ```\n\n## 输出\n\n```\n## 'data.frame': 3 obs. of 3 variables:\n## $ movie_names:\
  \ chr \"Inception\" \"The Dark Knight\" \"Edge of Tomorrow\"\n## $ movie_durations:\
  \ num 148 152 113\n## $ watched_scifi: logi TRUE FALSE TRUE\n```\n\n输出显示 `netflix_df`\
  \ 是一个包含三个观测值和三个变量的数据框。第一个变量 `movie_names` 是字符向量，`movie_durations` 是数值变量，`watched_scifi`\
  \ 是逻辑变量。然后她创建另一个数据框来存储她几位朋友的 Netflix 数据使用情况：\n\n```r\n# 创建数据框\nnetflix_data <- data.frame(\n\
  \  name = c(\"Aarya\", \"Vedh\", \"Vedika\", \"Raj\", \"Simran\", \"Rahul\"),\n\
  \  age = c(25, 27, 26, 24, 28, 25),\n  gender = c(\"F\", \"M\", \"F\", \"M\", \"\
  F\", \"M\"),\n  location = c(\"Kolkata\", \"Bangalore\", \"Bangalore\", \"Pune\"\
  , \"Chandigarh\", \"Mumbai\"),\n  total_hours = c(25, 20, 22, 9, 18, 21),\n  hours_series\
  \ = c(15, 10, 15, 7, 15, 18),\n  hours_movies = c(9, 5, 8, 2, 2, 3),\n  hours_documentaries\
  \ = c(1, 2, 1, 0, 1, 0)\n)\n\n# 查看数据框\nView(netflix_data)\n```\n\n![](img/Figure2.8.jpg)\n\
  \n图 2.8：View(netflix_data) 的 R 语言输出\n\n### 函数\n\n函数封装重复或复杂的操作，使代码更有条理、高效且可复用。在 R\
  \ 语言中，函数可以是内置的、用户定义的，或从包中加载的。自定义函数使用 `function()` 关键字定义，后跟函数名称及其参数（在括号中）。函数体则包含在花括号\
  \ `{}` 中。让我们为各种业务场景创建一些自定义函数。\n\n#### 电子商务\n\n一个函数，用于计算电子商务网站上某产品产生的总收入，给定产品价格和销售数量：\n\
  \n```r\n# 计算总收入的函数\ncalculate_revenue <- function(price, num_sold) {\n  total_revenue\
  \ <- price * num_sold\n  return(total_revenue)\n}\n```\n\n这里，`price` 是电子商务网站上产品的价格，`num_sold`\
  \ 是销售数量。该函数将价格与销售数量相乘来计算产品产生的总收入，并返回结果：\n\n```r\n# 定义向量以计算收入\nprice <- c(250, 2099,\
  \ 1999, 750)\nnum_sold <- c(1000, 250, 100, 1150)\n\n# 计算每个产品的总收入\ntotal_revenue\
  \ <- calculate_revenue(price, num_sold)\n\n# 打印结果\ntotal_revenue\n```\n\n## 输出\n\
  \n```\n## 250000 524750 199900 862500\n```\n\n这里，我们定义了两个向量 `price` 和 `num_sold`，分别包含四种不同产品的价格和销售数量。然后我们将这些向量作为参数传递给\
  \ `calculate_revenue` 函数，该函数计算每个产品的总收入并返回一个结果向量。\n\n#### 市场营销\n\n一个函数，用于计算营销活动的转化率，给定展示次数和点击次数：\n\
  \n```r\n# 计算转化率的函数\ncalculate_conversion_rate <- function(impressions, clicks) {\n\
  \  conversion_rate <- clicks / impressions\n  return(conversion_rate)\n}\n```\n\n\
  这里，`impressions` 是营销信息展示的次数，`clicks` 是被点击的次数。该函数通过将点击次数除以展示次数来计算转化率。\n\n你可以将 `conversion_rate`\
  \ 函数用于包含展示次数和点击次数的数据向量：\n\n```r\n# 定义展示次数和点击次数向量\nimpressions <- c(1205, 2000, 1532,\
  \ 4101)\nclicks <- c(90, 75, 82, 210)\n\n# 计算每个广告活动的转化率\nconversion_rates <- calculate_conversion_rate(impressions,\
  \ clicks)\n\n# 打印转化率\nconversion_rates\n```\n\n## 输出\n\n```\n## 0.07468880 0.03750000\
  \ 0.05352480 0.05120702\n```\n\n这里，我们定义了两个数据向量 `impressions` 和 `clicks`，分别包含四个不同广告活动的展示次数和点击次数。然后我们将这些向量作为参数传递给\
  \ `conversion_rate` 函数，该函数计算每个活动的转化率并返回一个结果向量。我们也可以使用 `round()` 来对结果进行四舍五入。\n\n\
  #### 金融\n\n一个函数，用于计算贷款的复利，给定本金、利率、贷款期限（年）以及每年计息次数：\n\n```r\n# 计算复利的函数\ncalculate_compound_interest\
  \ <- function(principal, interest_rate, years, compounding_frequency) {\n  n <-\
  \ compounding_frequency\n  interest <- principal * (1 + interest_rate / n)^(n *\
  \ years) - principal\n  return(interest)\n}\n\n# 定义向量输入\nprincipal <- c(5000, 7500,\
  \ 9200)\n```\n\n\n\n\n## 计算复利\n\n```r\ninterest_rate <- c(0.05, 0.06, 0.09)\nyears\
  \ <- c(1, 2, 3)\ncompounding_frequency <- c(1, 2, 4)\n\n# calculate compound interest\
  \ for each set of inputs\ncompound_interest <- calculate_compound_interest(principal,\
  \ interest_rate, years, compounding_frequency)\n\n# view output\ncompound_interest\n\
  ```\n\n## 输出结果\n\n```\n## [1] 250.0000 941.3161 2815.6599\n```\n\n这告诉我们，对于第一组输入（`principal\
  \ = 5000`，`interest_rate = 0.05`，`years = 1`，`compounding_frequency = 1`），复利将是 250.00\
  \ 卢比。同样，对于第二组输入（`principal = 7500`，`interest_rate = 0.06`，`years = 2`，`compounding_frequency\
  \ = 2`），复利将是 941.3161 卢比，依此类推。\n\n> **注意**：虽然 R 会自动返回函数最后一行的值，但显式使用 `return()` 函数来指示函数返回的内容被认为是更好的实践。这有助于使函数更具可读性且更易于理解，特别是对于可能不熟悉该函数行为的其他用户。\n\
  \n例如，下面的 `calculate_revenue` 函数在不使用 `return` 语句的情况下也能工作：\n\n```r\n# calculate total\
  \ revenue (without return statement)\ncalculate_revenue <- function(price, num_sold)\
  \ {\n  price * num_sold\n}\n```\n\n### 获取帮助页面\n\n接收帮助是你作为 R 用户踏上旅程时最需要的关键要素之一。无论你作为程序员有多么丰富的经验，你都会不断遇到新函数，并需要帮助来理解如何使用它们。\n\
  \n每个 R 函数都附带一个帮助页面，你可以通过在问号后输入函数名来访问它。例如，你可以使用以下代码访问 `mean()` 函数的文档：\n\n```r\n#\
  \ display help page for the mean function\n?mean\nhelp(mean)\n\n# quotes are optional\n\
  ?\"mean\"\nhelp(\"mean\")\n```\n\n这将调出 `mean()` 函数的帮助页面，提供有关如何使用该函数、它接受什么参数以及返回什么值的信息。帮助页面还可能包括在实践中使用该函数的示例，以及关于关键注意事项或限制的说明。如果函数来自\
  \ R 包，则必须先加载该包，R 才能找到帮助页面。否则，你可以使用 `package` 参数指定包名：\n\n```r\n# documentation of\
  \ select function from dplyr package\nhelp(select, package = \"dplyr\")\n```\n\n\
  上述命令将返回 `dplyr` 包中 `select` 函数的文档。随着你在 R 方面知识和熟练度的提高，帮助页面对于了解特定函数和包的更多信息非常有用。\n\n\
  ##### 加载数据\n\n将外部数据导入 R 是项目的初始步骤之一。数据通常以表格格式保存，如电子表格或 CSV 文件。开源社区最常使用逗号分隔值（`.csv`）格式。可以使用\
  \ `read.csv()` 函数读取 CSV 文件，它要求 CSV 文件使用 `.` 作为小数点，`,` 作为分隔符。\n\n![Figure 2.9: Reading\
  \ CSV files into R as data frames using read.csv()](img/Figure2.9.png)\n\n**Figure\
  \ 2.9: Reading CSV files into R as data frames using read.csv()**\n\n要读取 `Aarya_Netflix.csv`\
  \ 数据，Aarya 使用 `read.csv()` 将其存入数据框 `netflix_df`：\n\n```r\nnetflix_df <- read.csv(\"\
  Aarya_Netflix.csv\")\n```\n\n`read.csv()` 的第一个参数是文件名，该文件应位于你的工作目录中；否则，如果它不在你的工作目录中，你还需要提及文件的绝对路径。在\
  \ R 4.4.2 版本中，所有字符串变量都被读取为 `character` 类，但如果你需要将它们读取为 `factor`，可以设置参数 `stringsAsFactors\
  \ = TRUE`。你也可以像下图所示那样从“Workspace”选项卡读取 CSV 文件：\n\n![Figure 2.10: Import dataset\
  \ from Workspace tab](img/Figure2.10.png)\n\n**Figure 2.10: Import dataset from\
  \ Workspace tab**\n\n要读取任何电子表格，你必须先安装并加载 `readxl` 包，并使用 `read_excel()`，如下所示：\n\n\
  ```r\nread_excel(\"netflix_sample_excel.xlsx\")\n```\n\n如果你有多个工作表，可以通过在 `sheet`\
  \ 参数下提及工作表位置或名称来指定要读取的工作表。下表显示了用于读取各种类型数据集的不同包：\n\n| Packages | Types of data |\n\
  | --- | --- |\n| DBI | databases |\n| xml2 | XML |\n| jsonlite | JSON |\n| httr\
  \ | Web APIs |\n| rvest | HTML (Web scraping) |\n| haven | SPSS, SAS files |\n|\
  \ googlesheets4 | Google sheets |\n| readr::read_lines() | Text data |\n\n**Table\
  \ 2.4: Different packages to import various types of data**\n\n#### 访问内置数据集\n\n\
  R 自带约 100 个数据集（包内数据集），包中还有更多。要访问可用数据集的当前列表，请使用：\n\n```r\ndata()\n```\n\n并且，你可以加载一个内置的\
  \ R 数据集：\n\n```r\ndata(\"dataset_name\")\n```\n\n#### 从其他 R 包加载数据\n\n要访问特定包中的数据，请使用\
  \ `package` 参数，例如：\n\n```r\ndata(package = \"rpart\")\n```\n\n并且，如果一个库已附加了某个包，其数据集会自动包含在搜索路径中。\n\
  \n### 保存数据\n\n在 R 中，根据你正在处理的数据类型以及想要保存的格式，有多种保存数据的方法。下面讨论其中几种。\n\n#### 另存为 CSV 文件\n\
  \n逗号分隔值（CSV）文件是存储和交换表格数据的常用方式。要将数据另存为 CSV 文件，可以使用 `write.csv()` 函数。示例如下：\n\n```r\n\
  # save data as a CSV file\nwrite.csv(netflix_df, file = \"Netflix_Data.csv\")\n\
  ```\n\n这将在你的工作目录中创建一个名为 `Netflix_Data.csv` 的 CSV 文件。`file` 参数指定要创建的文件名。\n\n需要注意的一点是，`write.csv()`\
  \ 默认会在输出文件中包含行名。如果你不想包含行名，可以将 `row.names` 参数设置为 `FALSE`。请参考以下示例：\n\n```r\nwrite.csv(netflix_df,\
  \ file = \"Netflix_Data.csv\", row.names = FALSE)\n```\n\n这将从输出文件中排除行名。\n\n####\
  \ 另存为文本文件\n\n有时，你可能想将数据另存为文本文件而不是 CSV 文件。你可以使用 `write.table()` 将数据另存为文本文件。示例如下：\n\
  \n```r\n# Create a data frame\nmy_data <- data.frame(x = 1:5, y = c(\"A\", \"B\"\
  , \"C\", \"D\", \"E\"))\n\n# Save data as a text file\nwrite.table(my_data, file\
  \ = \"my_data.txt\", sep = \"\\t\", row.names = FALSE)\n```\n\n这将在你的工作目录中创建一个名为\
  \ `my_data.txt` 的文本文件。`sep` 参数指定分隔符（在本例中为制表符），`row.names = FALSE` 从输出中移除行名。\n\n\
  #### 另存为二进制文件\n\nR 提供了将数据另存为二进制文件的功能，这是一种以紧凑高效方式存储数据的文件格式。要将数据另存为二进制文件，可以使用 `saveRDS()`\
  \ 函数。它创建一个可移植的二进制文件，可以轻松地在不同的 R 安装或版本之间共享和使用。如果你需要与可能未安装相同包或 R 版本的人共享数据，这会特别有用。\n\
  \n与以基于文本的格式（如 CSV）保存相比，使用 `saveRDS()` 以二进制格式保存对象通常更高效。二进制文件体积更小，读写速度快得多。要将数据另存为二进制文件：\n\
  \n```r\n# create a sample data\nmy_data <- list(x = 1:5, y = c(\"A\", \"B\", \"\
  C\", \"D\", \"E\"))\n\n# save data as a binary file\nsaveRDS(my_data, file = \"\
  my_data.rds\")\n```\n\n这将在你的工作目录中创建一个名为 `my_data.rds` 的二进制文件。这些只是保存数据的众多方法中的几个示例。根据你的需求，可能还有其他更合适的函数或文件格式。\n\
  \n### R 编码规范\n\n\n\n您可以遵循许多约定和最佳实践，以在 R 中编写清晰、高效且可维护的代码。下面列出了一些：\n\n*   R 区分大小写，意味着大写和小写字母会被区别对待。对变量和函数名使用小写字母是一种良好的实践。\n\
  *   为变量和函数使用有意义的名称。这有助于提高代码的可读性和可理解性。使用易于理解和记忆的描述性变量名。\n*   缩进在 R 中很重要，能让您的代码更具可读性。因此，您应该始终如一地缩进代码，使用空格或制表符。\n\
  *   为您的代码添加注释，解释您在做什么以及为什么这么做。这使得其他人（以及未来的您自己）更容易理解您的代码。\n*   编写模块化代码。将代码拆分为小型的、可复用的函数，以便在代码的不同部分中使用。这使您的代码更易于阅读、理解和维护。\n\
  *   避免使用 R 中已定义的变量名，例如 `mean`、`sum` 或 `sd`。这可能导致意外行为。\n*   使用包。R 拥有庞大的包生态系统，可以为您节省大量时间和精力。使用\
  \ `dplyr`、`tidyr` 和 `ggplot2` 等包来简化您的代码。\n\n### 结论\n\n本章概述了 R 语言的基础要点，帮助您入门。我们回顾了\
  \ RStudio 界面和键盘快捷键的基础知识，随后讨论了包、如何安装和加载它们，以及函数和对象的重要性。借助本章的帮助，您将能够使用不同的 R 对象保存数据，这些对象允许您以不同类型的关系存储不同类型的值。通过对数据框的理解，您可以存储表格数据，其中每一列可以包含不同类型的数据，且每一列必须包含相同类型的数据。我们还学习了函数以及如何编写自定义函数。接下来，我们讨论了使用基础包和其他包加载和保存不同的数据格式。本章为初学者学习和理解\
  \ R 编程概念与技术奠定了坚实的基础。\n\n在下一章中，您将掌握数据清洗和探索的实用技能，为分析和可视化准备数据。\n\n### 加入我们的图书 Discord\
