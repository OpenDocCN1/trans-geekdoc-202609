  \n![](img/fm1.png)\n\n## 第 7 章：数据可视化\n\n### 简介\n\n数据可视化是艺术与科学的融合。在这两个方面之间实现微妙的平衡对于准确传达数据至关重要。在创建具有视觉吸引力的图形的同时准确呈现数据，是有效沟通的关键。数据可视化可以揭示模式、识别异常值、指导数据转换，并为机器学习模型启发新特征。成功的数据可视化应在不误导或扭曲数据的前提下准确传达数据，同时具有美感以增强其影响力。分散数据注意力的视觉元素（如刺眼的颜色或不平衡的元素）会阻碍解读。`ggplot2`\
  \ 是一个广泛使用的 R 数据可视化包，它采用基于图形语法的绘图系统。这简化了创建复杂且富有洞察力的可视化的过程。它为指定图表的不同元素（如数据、美学映射和几何对象）提供了一套一致的规则。\n\
  \n### 结构\n\n在本章中，我们将详细阐述与数据可视化相关的基本概念。\n\n*   `ggplot2` 模板与美学映射\n*   可视化分布\n   \
  \ *   条形图\n    *   直方图\n    *   密度图\n*   可视化比例\n    *   饼图\n    *   堆叠条形图\n*   可视化关联\n\
  \    *   箱线图\n    *   散点图\n*   使用折线图可视化时间序列\n\n### 目标\n\n本章将教您如何使用数据可视化正确呈现数据。您将获得使用\
  \ `ggplot2` 包生成多种可视化的知识，包括条形图、直方图、密度图、箱线图、饼图、折线图和散点图。您还将学习如何可视化时间序列数据和数据分布。在本章结束时，您将能够创建信息丰富且引人入胜的数据可视化，有效地向他人传达您的发现。\n\
  \n### ggplot2 模板与美学映射\n\n\n\n\n# ggplot2：图形语法\n\n与许多其他图形包不同，`ggplot2` 基于 Wilkinson\
  \ 的*图形语法*（2005）运行，拥有一套独特的语法体系。这种语法允许您通过组装不同的组件来构建图形，使 `ggplot2` 成为数据可视化的强大工具。`ggplot2`\
  \ 的方法论鼓励迭代过程：从代表原始数据的基础层开始，逐步添加用于注释和统计摘要的额外层。这种迭代方法使创建图形的过程与我们典型分析中涉及的结构化思维保持一致。\n\
  \n在 Wilkinson 语法的基础上，Wickham (2009) 引入的 `ggplot2` 着重于图层的重要性，并将该语法调整为可与 R 语言集成。图形语法是将数据映射到几何对象（如点、线或条形）的美学属性（颜色、形状和大小）上。此外，图形还可能包含数据的统计变换以及关于图形坐标系统的细节。这些独立组件的深思熟虑的组合构成了一个全面且信息丰富的图形。\n\
  \n#### 基本组件\n\n每个 `ggplot2` 图形均由三个基本组件构建而成：\n\n*   **数据**：图形的基础，代表您想要可视化的信息。\n*\
  \   **几何对象（geom 函数）**：数据的视觉表现形式，由 geom 函数定义。Geom 函数决定构成图形的图形元素，如点、线、条形或多边形。\n* \
  \  **美学映射**：数据与其视觉表现之间的连接，通过美学映射指定。美学映射将数据变量分配给视觉属性，如颜色、形状和大小，控制数据在图形上的显示方式。\n\n\
  要创建 `ggplot2` 图形，您可以使用以下模板组合这三个组件：\n\n*   `ggplot(data = <YOUR_DATA>) +`\n*   `geom_<YOUR_GEOM_FUNCTION>(aes(<YOUR_MAPPINGS>))`\n\
  \n将 `<YOUR_DATA>`、`<YOUR_GEOM_FUNCTION>` 和 `<YOUR_MAPPINGS>` 替换为您打算使用的特定数据集、geom\
  \ 函数和映射。\n\n#### 附加图层\n\n除了数据、几何对象和美学映射这些基础组件外，`ggplot2` 还允许您通过引入完善和丰富图形的附加图层来增强视觉叙事能力。\n\
  \n*   **统计变换**：`stat` 函数直接在图形内对数据进行汇总和处理。\n*   **标度**：它们将数据值映射到颜色、形状、大小和不透明度等美学属性。标度还有助于构建图例和坐标轴。\n\
  *   **坐标系**：它们通过映射数据坐标来组织几何对象。\n*   **分面**：分面将数据分解为不同的子集，并在同一图形中将它们显示为多个较小的图形。这一强大技术允许您探索变量之间的关系，并识别在整体检查数据时可能不明显的模式。\n\
  *   **主题**：主题控制显示的细节，如字体大小和背景颜色。\n\n`ggplot2` 所基于的图形语法认识到，一个图形是数据集、几何对象、一组映射、统计变换、位置调整、坐标系和分面方案的独特融合。下图展示了\
  \ `ggplot2` 模板的所有组件。\n\n![](img/Figure7.1.png)\n\n**图 7.1**：ggplot2 模板\n\n现在，让我们探索如何利用此模板创建各种类型的图形。\n\
  \n#### 入门：包安装\n\n要开始可视化，第一步是安装必要的包。我们有两种选择：要么加载包含 `ggplot2` 包的 `tidyverse`，要么采用更专注的方法，单独安装\
  \ `ggplot2`。\n\n```\n# Load tidyverse:\nlibrary(tidyverse)\n\n# Alternatively, install\
  \ ggplot2\ninstall.packages(\"ggplot2\")\ninstall.packages(\"forcats\")\n\n# Load\
  \ ggplot2 and forcats\nlibrary(ggplot2)\nlibrary(forcats)\n```\n\n### 可视化分布\n\n\
  有效传达数据分布是数据分析的一个基本方面，可视化方法因变量的性质而异——无论是分类变量还是数值变量。本节探讨三种基本的可视化技术：条形图、直方图和密度图。\n\n\
  #### 条形图\n\n在许多情况下，我们关注的是理解一组给定数值的规模。设想一家零售企业想要描绘各产品类别（如电子产品、书籍和家居用品）在特定时间段内的销售业绩。又或一位网站所有者可能希望剖析其网站流量的来源，区分直接访问、搜索引擎推荐和其他来源。同样，一位教育工作者可能想展示学生在不同学科中取得的平均分数。在每种情况下，我们都面临这样一种场景：不同的类别（如产品类别、流量来源或学科）与相应的定量数值相关联。此类情况下的首选可视化方法是条形图。\n\
  \n有些人可能会避免使用条形图，因为他们认为条形图太过常见，但这是一个错误的假设。实际上，条形图的广泛使用反而对您有利，使您的受众能够更快地掌握您呈现的信息。受众无需费力去理解陌生的图表，而是可以专注于从视觉展示中提取有价值的见解。我们的眼睛可以轻松比较条形的长度，从而快速识别类别的排名，区分最大值和最小值，并感知它们之间的渐变变化。\n\
  \n让我们深入研究一个源自联合国粮农组织企业统计数据库（FAOSTAT）的数据集，该数据集记录了 2021 年 185 个国家的香料总消费量。该数据集包含两列：一列表示国家名称，另一列表示以千吨（kt）为单位的香料消费量。我们将首先探索香料消费量最高的前\
  \ 10 个国家。\n\n```\n# Read the dataset\nspice_consumption <- read.csv(\"Spice_Consumption.csv\"\
  )\n\n# Arrange the data in descending order of Value and subset the top 10 countries\n\
  spice_top10 <- spice_consumption %>%\n  arrange(desc(Value)) %>%\n  slice_head(n\
  \ = 10)\n```\n\n条形图的 `ggplot2` 模板遵循一个直观的结构。我们将创建一个条形图来可视化香料消费量最高的前 10 个国家。\n\n```\n\
  # Distribution of Spice Consumption\nggplot(spice_top10, aes(x = Country, y = Value))\
  \ +\n  geom_bar(stat = \"identity\")\n```\n\n**输出：**\n\n![](img/Figure7.2.png)\n\
  \n**图 7.2**：香料消费量条形图\n\n`ggplot()` 函数为图形创建一个空白画布，而 `aes()` 函数定义数据的美学映射。在本例中，我们将\
  \ `Country` 列映射到 x 轴，将 `Value` 列映射到 y 轴。最后，`geom_bar()` 函数向图形添加条形图，使用 `stat = \"\
  identity\"` 参数指定我们要使用实际数值渲染条形。\n\n垂直条形图的一个常见问题是，标识每个条形的标签可能占据大量水平空间，导致图表中文本重叠且难以辨认。上图显示一些国家名称重叠，无法轻松阅读。解决此问题的一种方法是旋转\
  \ x 轴标签。然而，这种方法往往会导致图形外观别扭，需要图表下方过多的空间，同样难以阅读。\n\n```\n# Distribution of Spice Consumption\n\
  ggplot(spice_top10, aes(x = Country, y = Value)) +\n  geom_bar(stat = \"identity\"\
  ) +\n  theme(axis.text.x = element_text(angle = 90, vjust = 0.5, hjust = 1))\n```\n\
  \n\n\n\n\n![](img/Figure7.3.png)\n\n图 7.3：香料消费量条形图\n\n`ggplot2` 代码片段中的最后一条命令通过更改字体属性来修改\
  \ x 轴标签的外观。`theme()` 函数可自定义绘图的各种视觉样式方面。在本例中，`axis.text.x` 参数指定我们要修改 x 轴标签。`element_text()`\
  \ 使用以下参数为 x 轴标签创建一个新的文本元素：\n\n*   `angle = 90`：将文本顺时针旋转 90 度，使其垂直排列。\n*   `vjust\
  \ = 0.5`：调整文本的垂直对齐方式。在此语境下，它使标签垂直居中。\n*   `hjust = 1`：调整文本的水平对齐方式。值为 1 表示右对齐。\n\n\
  解决条形图中长标签挑战的一种更有效方法，通常是交换 x 轴和 y 轴，使条形呈水平方向。这种重新定向缓解了标签重叠的问题，并提供了更清晰、更节省空间的数据表示。\n\
  \n要在 `ggplot2` 中实现此解决方案，我们可以使用 `coord_flip()` 函数，它交换 x 轴和 y 轴，将垂直条形图转换为水平条形图。这解决了\
  \ x 轴标签拥挤的问题，并提供了更美观的数据表示。\n\n```\n# 香料消费量分布\nggplot(spice_top10, aes(x = Country,\
  \ y = Value)) +\n  geom_bar(stat = \"identity\") +\n  coord_flip()\n```\n\n![](img/Figure7.4.png)\n\
  \n图 7.4：香料消费量条形图\n\n无论条形是垂直还是水平排列，其排列顺序都至关重要。随机或任意的排列会导致混淆，使图表不够直观。在 R 中，默认排列是标签的字母顺序，这并不总是组织数据最有意义的方式。以香料消费量图表为例，按香料消费量的顺序重新排列条形更有意义。通过以这种方式重新排列条形，我们可以创建更有效的可视化效果，帮助读者一目了然地理解数据。\n\
  \n```\n# 香料消费量分布\nggplot(spice_top10, aes(x = fct_reorder(Country, Value), y = Value))\
  \ +\n  geom_bar(stat = \"identity\", fill = \"steelblue3\") +\n  labs(title = \"\
  Spice Consumption\",\n       x = \"Country\",\n       y = \"Spice Consumption (kt)\"\
  ) +\n  coord_flip() +\n  theme_bw()\n```\n\n![](img/Figure7.5.png)\n\n图 7.5：香料消费量条形图\n\
  \n让我们探讨一下上述代码中用于更有意义、更易解释地呈现数据的一些新函数和参数。\n\n`fct_reorder(Country, Value)`：这是 `forcats`\
  \ 包的一部分，用于根据 `Value` 列中的值重新排序 `Country` 因子的水平。这意味着条形图中的条形将按香料消费量递减的顺序排列。\n\n`fill\
  \ = steelblue3`：此参数指定用于填充图表中条形的颜色。此处，`fill` 参数设置为 `steelblue3`。\n\n`labs()` 函数为绘图的坐标轴和标题添加标签。它将绘图标题设置为\
  \ Spice Consumption，x 轴标签设置为 Country，y 轴标签设置为 Spice Consumption (kt)。\n\n`theme_bw()`\
  \ 函数为绘图应用黑白主题。`ggplot2` 中的 `theme_` 函数是一组允许用户自定义绘图视觉外观的函数。`ggthemes` 包通过提供具有特定样式的其他预定义主题，扩展了\
  \ `ggplot2` 中的主题选项。您可以轻松地将这些主题应用于 `ggplot2` 绘图，以获得美观的外观。\n\n必须注意的是，只有当条形所代表的类别没有自然顺序或层级时，我们才应重新排列条形。如果类别已经有意义地排序（例如，如果我们的分类变量是有序因子），则建议在可视化中保留该顺序。\n\
  \n#### 直方图\n\n直方图是连续数据分布的图形表示。直方图是通过将 x 轴划分为等距的区间（称为箱）来创建的。直方图中每个条形的高度代表落在相应箱内的数据点数量。这创建了一个显示数据频率分布的图表，揭示了数据在数值范围内的分布情况。\n\
  \n它们可以告诉我们数据是对称的、向左或向右偏斜的，还是有多个峰值。这些信息对于识别数据中的模式和离群值至关重要。离群值是不遵循其余数据总体模式的观测值，可能表明错误、异常或有趣的现象。通过检查直方图，我们可以轻松发现离群值，并决定它们是否值得进一步调查。\n\
  \n在 `ggplot2` 中，您可以使用 `binwidth` 参数设置区间的宽度。尝试不同的箱宽以找到最能说明数据潜在结构的最佳区间大小至关重要。您也可以选择使用\
  \ `bins` 参数指定箱的数量，默认设置为 30。\n\n现在，我们将从 FAOSTAT 导入一个营养不良指标数据集，并创建 173 个国家营养不良患病率的直方图。联合国粮农组织（FAO）将营养不良患病率（PoU）定义为一个估计值，代表常规食物摄入量低于维持正常、活跃和健康生活所需的膳食能量水平的人口百分比。以下代码生成直方图以可视化\
  \ 2021 年营养不良患病率的分布。\n\n```\n# 读取数据集\nundernourishment <- read.csv(\"undernourishment_data.csv\"\
  )\n\n# 筛选 2021 年数据\nundernourishment_2021 <- undernourishment %>% filter(Year ==\
  \ 2021)\n\n# 营养不良患病率分布\nggplot(undernourishment_2021, aes(x = Value)) +\n  geom_histogram(binwidth\
  \ = 2, fill = \"steelblue3\", color = \"black\") +\n  labs(title = \"Prevalence\
  \ of Undernourishment\",\n       x = \"Prevalence (%)\",\n       y = \"Frequency\"\
  ) +\n  theme_bw()\n```\n\n![](img/Figure7.6.png)\n\n图 7.6：营养不良患病率分布\n\n> **注意：**\
  \ 在 FAO 数据集中，营养不良率低于 2.5% 的国家和地区被归类为 2.5%。\n\n此处，`geom_histogram(binwidth = 2, fill\
  \ = \"steelblue3\", color = \"black\")` 使用 `geom_histogram()` 向绘图添加直方图层。它将 x 轴划分为宽度为\
  \ 2 的箱，并用 `steelblue3` 填充每个箱；每个箱的边框为黑色。\n\n要在直方图的每个条形上方添加计数标签，可以使用统计变换函数 `stat_bin()`。它允许我们直接在相应条形顶部显示每个箱内的频率计数。这一简单的添加可以提供对潜在分布更精确的理解。它还可以帮助您准确比较不同箱以及跨不同数据集的情况。\n\
  \n```\n# 营养不良患病率分布\nggplot(undernourishment_2021, aes(x = Value)) +\n  geom_histogram(binwidth\
  \ = 2, fill = \"steelblue3\", color = \"black\") +\n  labs(title = \"Prevalence\
  \ of Undernourishment\",\n       x = \"Prevalence (%)\",\n       y = \"Frequency\"\
  ) +\n  stat_bin(aes(label = after_stat(count)),\n           binwidth = 2,\n    \
  \       geom = \"text\", vjust = -0.5, color = \"black\", size = 3) +\n  theme_bw()\n\
  ```\n\n![](img/Figure7.7.png)\n\n图 7.7：营养不良患病率分布\n\n\n\n\n\n#### 密度图\n\n当探索数值数据时，直方图常用于可视化分布。密度图是直方图的平滑版本。这使其特别适合快速掌握分布的整体形状，包括其偏度和多峰性。图\
  \ 7.8 展示了营养不良患病率的密度图。\n\n```r\n# Density Plot of Undernourishment Prevalence\nggplot(undernourishment_2021,\
  \ aes(x = Value)) +\n  geom_density(fill = \"lightblue\", color = \"steelblue4\"\
  ) +\n  labs(title = \"Prevalence of Undernourishment\",\n       x = \"Prevalence\
  \ (%)\",\n       y = \"Frequency\") +\n  theme_bw()\n```\n\n![](img/Figure7.8.png)\n\
  \n**图 7.8：营养不良患病率密度图**\n\n#### 可视化比例\n\n有效传达一个群体、实体或数量分解为其组成部分是数据可视化中的常见任务。无论是描绘人口中的性别分布，还是选举中不同政党的得票份额，可视化比例在数据探索和沟通中都起着至关重要的作用。它帮助观众理解不同部分如何构成整体。\n\
  \n##### 饼图\n\n饼图长期以来一直是比例或百分比的首选可视化方式，广泛用于商业演示和报告。其圆形布局和比例切片使其成为说明不同组成部分如何贡献于整体的流行选择。饼图能提供比例分布的总体概念，特别是在处理少量类别时。然而，数据科学家经常因以下几个缺点而批评饼图：\n\
  \n*   **难以比较比例**：当处理众多类别时，使用饼图比较比例变得越来越困难。\n*   **人类感知局限**：人眼不适合准确判断饼图切片的相对大小，尤其是在处理小切片时。\n\
  *   **不利于突出变化**：饼图不适合可视化比例随时间或不同条件下的变化。\n\n现在，让我们使用 `ggplot2` 创建一个饼图，以直观地描绘全球饥饿的地理分布。虽然\
  \ `ggplot2` 没有专门用于饼图的 `geom`，但我们可以通过变通方法创建一个。我们可以使用 `geom_bar()` 构建一个只有一个条形的堆叠条形图，然后使用\
  \ `coord_polar()` 将图表转换为圆形布局，从而得到一个饼图。可以把它想象成获取一个常规条形图并将其弯曲成一个圆，从而得到一个切片代表不同类别的饼图。\n\
  \n绘图中使用的默认坐标系是笛卡尔坐标系，其中每个点由其独立的 x 和 y 坐标定义。然而，还有两种额外的坐标系可用：专为绘制空间数据设计的 `coord_quickmap()`，以及利用极坐标的\
  \ `coord_polar()`。\n\n让我们创建一个如下所示的简单饼图：\n\n```r\nhunger_2021 <- read.csv(\"hunger_2021.csv\"\
  )\n\n# Pie chart\nggplot(hunger_2021, aes(x = \"\", y = Value, fill = Region)) +\n\
  \  geom_bar(stat = \"identity\", width = 1, color = \"white\") +\n  coord_polar(theta\
  \ = \"y\")\n```\n\n![](img/Figure7.9.png)\n\n**图 7.9：饼图**\n\n在这种情况下，我们通过在引号中指定空字符串来留空\
  \ x 轴。饼图切片基于 `Value` 变量绘制，每个切片根据相应的 `Region` 着色。默认情况下，它按类别的字母顺序逆时针绘制切片。`coord_polar(theta\
  \ = \"y\")` 将绘图的坐标系设置为极坐标，这适合饼图。`theta = \"y\"` 表示每个切片的角度由 y 变量（`Value`）决定。\n\n\
  现在，如果你仔细观察上图，可能会注意到图表背景中有一些多余的东西。让我们去除它们，使其看起来更整洁。我们将通过函数 `theme_void()` 移除数字和网格线。可以把它想象成擦除除切片本身之外的所有内容。为了使切片突出，我们将通过在\
  \ `geom_bar()` 中添加 `color` 并根据营养不良人口规模重新排序图表，为每个切片添加边框。下图显示了各地区营养不良人口的分布。\n\n```r\n\
  # Pie Chart displaying the undernourished population across different regions\n\
  ggplot(hunger_2021, aes(x = \"\", y = Value, fill = fct_reorder(Region, Value)))\
  \ +\n  geom_bar(stat = \"identity\", width = 1, color = \"white\") +\n  coord_polar(theta\
  \ = \"y\") +\n  theme_void() +\n  theme(legend.position = \"bottom\") +\n  labs(title\
  \ = \"Undernourished People by Region\", fill = \"Region\") +\n  scale_fill_brewer(palette\
  \ = \"Set3\") +\n  geom_text(aes(x = 1.7, label = ifelse(Value >= 30, paste(Region,\
  \ \"\\n\", round(Value, 0), \"M\"), \"\")),\n            position = position_stack(vjust\
  \ = 0.5),\n            size = 3, show.legend = FALSE)\n```\n\n![](img/Figure7.10.png)\n\
  \n**图 7.10：各地区营养不良人口分布**\n\n让我们了解上述命令中使用的额外组件：\n\n*   **布局与主题**\n    *   `theme_void()`：移除不必要的背景元素，以获得更整洁的展示。\n\
  \    *   `theme(legend.position = \"bottom\")`：将图例置于底部，以提高可读性。\n*   **标签与颜色**\n\
  \    *   `labs(title = \"Undernourished People by Region\", fill = \"Region\")`：为图表添加标题，并将填充（颜色）图例标记为\
  \ Region。\n    *   `scale_fill_brewer(palette = \"Set3\")`：从 Set3 调色板中选择颜色调色板用于切片颜色。\n\
  *   **添加文本标签**\n    *   `geom_text`：向图表添加文本标签。\n    *   `aes(x = 1.7, label = ifelse(Value\
  \ >= 30, paste(Region, \"\\n\", round(Value, 0), \"M\"), \"\"))`：设置 x 位置和标签文本。标签有条件；如果\
  \ `Value` 大于或等于 3000 万，标签包含 Region 和 Value（四舍五入到最接近的整数并附加 M）；否则为空字符串。\n    *   `position_stack(vjust\
  \ = 0.5)`：将标签垂直居中定位在每个切片内。\n    *   `size = 3`：设置文本大小。\n    *   `show.legend = FALSE`：从图例中隐藏文本标签。\n\
  \n上图显示，亚洲是遭受饥饿人群的主要地区，2021 年有 4.14 亿人，占营养不良总人口的 56%。非洲拥有约 37%（2.71 亿）营养不良人口，而拉丁美洲和加勒比地区约占\
  \ 6%（4600 万）。\n\n##### 堆叠条形图\n\n\n\n\n\n# 饼图与堆积条形图的对比\n\n饼图长期以来一直是数据可视化的主流工具，但其局限性日益凸显。饼图的主要问题之一在于其倾向于扭曲所代表的实际数值，尤其是在处理微小切片或多个类别时。这种扭曲发生的原因是我们的眼睛不擅长准确判断角度，导致难以比较饼图中不同扇区的大小。因此，受众可能会误解数据，从而得出错误的结论或做出错误的决策。堆积条形图通过将每个类别表示为成比例的矩形来规避这一问题，使观众能更准确地比较不同片段的大小。\n\
  \n堆积条形图的另一大优势在于其处理各类数据类型的通用性。与饼图仅适合展示简单比例不同，堆积条形图既能容纳离散变量，也能容纳连续变量。例如，您可以使用一张堆积条形图，在单个图表中同时展示公司总销售额在不同产品类别和地区间的划分情况。\n\
  \n我们现在将在 `hunger_2021` 数据集中生成一个新列，该列代表各地区遭受饥饿（即营养不良）的人口百分比。随后，我们将使用堆积条形图来可视化这些数据。\n\
  \n```\n# 创建新列 \"Percentage\"\nhunger_2021 <- hunger_2021 %>%\n  mutate(Percentage\
  \ = round((Value / sum(Value)) * 100, 1))\n\n# 堆积条形图\nggplot(hunger_2021, aes(x\
  \ = \"\", y = Percentage,\n  fill = fct_reorder(Region, Percentage))) +\n  geom_bar(stat\
  \ = \"identity\") +\n  geom_text(aes(label = ifelse(Percentage >= 1, paste0(round(Percentage,\
  \ 0), \"%\"), \"\")),\n  position = position_stack(vjust = 0.5),\n  size = 3, show.legend\
  \ = FALSE) +\n  labs(title = \"Undernourished People by Region\", fill = \"Region\"\
  ,\n  x = \"\", y = \"Percentage\") +\n  scale_fill_brewer(palette = \"Set2\") +\n\
  \  theme_bw()\n```\n\n下图是堆积条形图的参考示例：\n\n![](img/Figure7.11.png)\n\n图 7.11：堆积条形图\n\
  \n上述代码生成了一个以变量 `Percentage` 为 y 轴的堆积条形图。`Region` 变量用不同颜色填充条形，`fct_reorder` 函数根据百分比值对地区进行排序。`geom_bar()`\
  \ 用于创建条形，`geom_text()` 用于向条形添加标签。`position_stack` 参数用于调整标签在条形内的位置。\n\n### 可视化关联关系\n\
  \n在接下来的章节中，我们将探讨用于描绘两个变量间关联关系的常用图表。\n\n#### 箱线图\n\n箱线图，又称箱须图，提供了集中趋势、离散程度和潜在异常值的图形化表示，特别适用于可视化数值变量与分类变量之间的关系。箱线图的关键组成部分包括：\n\
  \n*   **箱体**：代表四分位距（IQR），跨度从分布的第 25 百分位到第 75 百分位。其长度直观地展示了数据的分散程度。箱体越长表示变异性越大，箱体越短则表明分布越集中。\n\
  *   **中位数线**：箱体内绘制的一条粗线标记了中位数，即第 50 百分位。它在箱体内的位置暗示了分布的对称性或偏态。\n*   **须线**：从箱体边缘延伸出的线条，通常延伸至最远的非异常值点。它们提供了数据总体范围的概念。\n\
  *   **异常值**：绘制在须线之外的单个点，通常定义为距离箱体边缘超过 1.5 倍 IQR 的数值。这些异常值突出了可能与大部分数据显著不同的异常观测值。\n\
  \n##### 数据分析中的核心应用\n\n箱线图在以下任务中特别有用：\n\n*   **比较分布**：并排的箱线图展示了不同组别或类别在集中趋势、分散程度和形状上的差异。\n\
  *   **识别异常值**：定位可能扭曲结果或揭示意外模式的异常观测值。\n*   **可视化偏态**：通过观察中位数在箱体内的位置以及须线的相对长度，可快速判断分布是对称还是偏态。\n\
  \n现在，让我们探索并可视化 2023 年 1 月黄色出租车的行程数据，该数据可通过纽约市出租车和豪华轿车委员会（TLC）获取。该数据集记录了每次出租车行程的多样化详情，如上下客时间、行驶距离和车费金额。数据来源：[`www.nyc.gov/site/tlc/about/tlc-trip-record-data.page`](https://www.nyc.gov/site/tlc/about/tlc-trip-record-data.page)。\n\
  \n为进行分析，我们使用了该数据的特定子集，概述如下：\n\n| 列名 | 说明 |\n| --- | --- |\n| `tpep_pickup_datetime`\
  \ | 出租车计价器启动的时间戳。 |\n| `tpep_dropoff_datetime` | 出租车计价器关闭的时间戳。 |\n| `trip_distance`\
  \ | 行程中记录的行驶距离，由出租车计价器按英里测量。 |\n| `RatecodeID` | 行程结束时适用的费率代码。1=标准费率，2=JFK |\n|\
  \ `fare_amount` | 根据时间和距离由计价器计算的车费。 |\n\n表 7.1：黄色出租车行程数据说明\n\n```\ncab_rides <-\
  \ read.csv(\"cab_rides.csv\")\n\n# 转换数据类型\ncab_rides$RatecodeID <- as.factor(cab_rides$RatecodeID)\n\
  \ncab_rides <- cab_rides %>% mutate(pickup_date = as_date(tpep_pickup_datetime))\n\
  \n# 创建箱线图以可视化驾驶速度分布\nggplot(cab_rides, aes(x = \"\", y = speed)) +\n  geom_boxplot()\
  \ +\n  labs(\n    title = \"Driving Speed Distribution\",\n    x = \"\",\n    y\
  \ = \"Speed (mph)\"\n  ) +\n  theme_bw()\n```\n\n![](img/Figure7.12.png)\n\n图 7.12：箱线图\n\
  \n接下来，让我们探索车速如何随一天中的不同时段而变化。为此，我们将添加一个名为 `pickup_timeofday` 的新列。该列将包含每次乘车上客时的时间段信息，从而使我们能够分析驾驶速度在不同时段的变化情况。函数\
  \ `time_of_day` 接受单个参数 `x`，代表一天中的某个具体小时。该函数随后使用一系列 `if` 语句来判断给定小时是否落在四个预定义时段之一内：上午（6\
  \ 点-11 点）、下午（12 点-16 点）、晚上（17 点-21 点）或夜间（22 点-次日 5 点）。根据这些检查的结果，函数返回相应的字符串值以指示时间段。生成的\
  \ `pickup_timeofday` 列使用 `factor` 函数转换为有序因子类型。这确保了该列中的值被视为具有定义顺序的分类数据，而非单纯的字符串。`levels`\
  \ 参数指定类别的顺序，而 `ordered` 参数指示这些类别应被视为有序数据。\n\n```\n# 创建计算一天中时间段的函数\ntime_of_day <-\
  \ function(x) {\n  if (x %in% 6:11) {\n    return('Morning')\n  } else if (x %in%\
  \ 12:16) {\n    return('Afternoon')\n  } else if (x %in% 17:21) {\n    return('Evening')\n\
  \  } else {\n    return('Night')\n  }\n}\n\n# 创建新列 - pickup_timeofday\ncab_rides\
  \ <- cab_rides %>%\n  mutate(pickup_timeofday = sapply(pickup_hour, time_of_day))\n\
  \n# 创建 pickup_timeofday，一个有序因子类型\ncab_rides$pickup_timeofday <- factor(cab_rides$pickup_timeofday,\
  \ levels = c(\"Morning\", \"Afternoon\", \"Evening\", \"Night\"), ordered = TRUE)\n\
  ```\n\n\n\n\n# 创建箱线图以可视化一天中不同时段的速度分布\n\n```r\nggplot(cab_rides, aes(x = pickup_timeofday,\
  \ y = speed)) +\n  geom_boxplot() +\n  labs(\n    title = \"Distribution of Speed\
  \ by Time of Day\",\n    x = \"Time of Day\",\n    y = \"Speed\"\n  ) +\n  theme_bw()\n\
  ```\n\n![](img/Figure7.13.png)\n\n**图 7.13：一天中不同时段的速度分布**\n\n上述代码生成一个箱线图，用于可视化一天中不同时段的驾驶速度分布。它使用\
  \ `ggplot` 函数创建一个散点图，将 `pickup_timeofday` 置于 x 轴，`speed` 置于 y 轴。`geom_boxplot` 函数用于向图表添加箱线图层，显示每个时段类别速度分布的中位数、四分位数和异常值。上图说明驾驶速度的模式遵循典型趋势。平均而言，速度从深夜稳步增加至清晨时段。\n\
  \n#### 散点图\n\n散点图是描绘两个数值变量之间关系的图形表示。每个数据点在图上用一个点表示，该点的位置反映了该特定数据点两个变量的值。它让我们能够看到一个变量的值如何随着另一个变量的值而变化。这使得散点图在探索复杂数据集和识别值得进一步分析的潜在关注领域时特别有用。仔细考虑哪个变量应为解释变量，哪个应为响应变量也至关重要。解释变量影响或导致响应变量的变化。响应变量是被测量或观察的变量。\n\
  \n让我们更仔细地观察行驶距离与其对应车费金额之间的关联。在此背景下，我们将行驶距离作为解释变量（x 坐标），将计价器计算的车费作为响应变量（y 坐标）。该图将帮助我们回答诸如以下的问题——短途行程是否总是比长途行程便宜？是否存在意外情况，如昂贵的短途行程或便宜的长途行程？是否有其他因素影响车费？\n\
  \n##### 行程距离与车费金额之间的关系\n\n```r\nggplot(cab_rides, aes(x = trip_distance, y = fare_amount))\
  \ +\n  geom_point(col = \"steelblue4\", alpha = 0.5) +\n  labs(\n    title = \"\
  Trip Distance v/s Fare Amount\",\n    x = \"Distance (Miles)\",\n    y = \"Amount\
  \ (USD)\"\n  ) +\n  theme_bw()\n```\n\n下图是描绘行程距离与车费金额关系的散点图：\n\n![](img/Figure7.14.png)\n\
  \n**图 7.14：散点图**\n\n此处，`geom_point` 图层向图表添加单个数据点，以钢蓝色表示（`col = \"steelblue4\"`），透明度为\
  \ 0.5（`alpha = 0.5`）以提高可见性。上述散点图显示行程距离与车费金额呈正相关，意味着随着距离增加，车费金额也倾向于上升。我们将基于 `RatecodeID`\
  \ 变量检查数据，以更好地理解这种关联。在下图中，点的颜色和形状由 `RatecodeID` 决定，为不同类别提供了视觉区分。\n\n##### 按 RatecodeID\
  \ 分组的行程距离与车费金额关系\n\n```r\nggplot(cab_rides, aes(x = trip_distance, y = fare_amount))\
  \ +\n  geom_point(aes(col = RatecodeID, shape = RatecodeID), alpha = 0.6) +\n  labs(\n\
  \    title = \"Trip Distance v/s Fare Amount\",\n    x = \"Distance (Miles)\",\n\
  \    y = \"Amount (USD)\"\n  ) +\n  theme_bw()\n```\n\n![](img/Figure7.15.png)\n\
  \n**图 7.15：行程距离与车费金额的关联**\n\n在 `RatecodeID = 1`（标准费率类别）中，距离与车费金额之间的关系大体呈线性，车费随行驶距离增加而增加。然而，存在一些不遵循此趋势的异常值。另一方面，在\
  \ `RatecodeID = 2`（JFK 机场费率类别）中，由于往返 JFK 机场的行程具有 70 美元的固定初始统一费率，距离与车费金额之间的关系不是线性的。也存在车费低于\
  \ 70 美元的异常值。\n\n#### 分面\n\n分面用于生成小倍数，即一系列显示数据不同子集的图表或图形。这些小倍数使我们能够快速轻松地比较数据不同部分的模式，并识别相似点或差异。通过根据分类变量将图表划分为分面，您可以深入了解特定于每个类别的变化和趋势。在处理包含多个维度或因素的复杂数据集时，分面尤为有价值。\n\
  \n`ggplot2` 中常用的两个分面函数是 `facet_wrap()` 和 `facet_grid()`。`facet_wrap()` 将一维面板条带包装成二维显示，而\
  \ `facet_grid()` 则由变量定义创建二维面板网格，形成行和列。在下面的代码中，使用 `facet_grid(RatecodeID~.)` 根据 `RatecodeID`\
  \ 变量创建分面网格。\n\n##### 按 RatecodeID 分面的行程距离与车费金额关系\n\n```r\nggplot(cab_rides, aes(x\
  \ = trip_distance, y = fare_amount)) +\n  geom_point(aes(col = RatecodeID, shape\
  \ = RatecodeID), alpha = 0.6) +\n  labs(\n    title = \"Trip Distance v/s Fare Amount\"\
  ,\n    x = \"Distance (Miles)\",\n    y = \"Amount (USD)\"\n  ) +\n  facet_grid(RatecodeID~.)\
  \ +\n  theme_bw()\n```\n\n![](img/Figure7.16.png)\n\n**图 7.16：行程距离与车费金额的关联（基于 Ratecode\
  \ ID）**\n\n此处，我们观察到散点图被划分为多个面板，每个面板代表不同的 `RatecodeID` 类别。`RatecodeID~.` 符号表示分面应沿行（`RatecodeID`）进行，同时保持单列布局。\n\
  \n### 使用折线图可视化时间序列\n\n折线图提供了一种直观的方式来表示变量随时间的变化，使其特别适用于时间相关数据。x 轴通常代表时间，而 y 轴表示感兴趣变量的值。通过观察折线图中的模式，分析师可以识别季节性、周期性行为和潜在异常。折线图还提供了一种直接的方法，在同一图表上比较多个时间序列，从而全面了解不同变量随时间的相互作用。\n\
  \n现在让我们生成一个折线图，以可视化 2023 年 1 月每日出租车行程数量的变化。我们创建一个名为 `total_trips_per_day` 的数据集，按上车日期对数据进行分组，并使用\
  \ `group_by` 和 `summarize` 函数计算每个唯一日期的总行程数（`total_trips`）。然后，我们将利用 `total_trips_per_day`\
  \ 数据集生成一个折线图，展示每日总行程数。\n\n#### 创建用于分析的汇总数据集\n\n```r\ntotal_trips_per_day <- cab_rides\
  \ %>%\n  group_by(pickup_date) %>%\n  summarize(total_trips = n())\n```\n\n####\
  \ 可视化 2023 年 1 月总行程数的折线图\n\n```r\nggplot(total_trips_per_day, aes(x = pickup_date,\
  \ y = total_trips)) +\n  geom_point() +\n  geom_line() +\n  labs(\n    title = \"\
  Total Trip Distribution on January 2023\",\n    x = \"Pickup Date\",\n    y = \"\
  Total Trips\"\n  ) +\n  theme_bw()\n```\n\n下图是折线图的示意图：\n\n![](img/Figure7.17.png)\n\
  \n**图 7.17：2023 年 1 月行程分布**\n\n\n\n在上述代码中，`geom_point()` 向图表添加单个数据点，而 `geom_line()`\
  \ 用线条连接这些点，创建一个连续的折线图，表示指定时间段内总行程数的趋势。该折线图展示了 1 月份出租车乘车数量一致的每周趋势。\n\n### 结论\n\n\
  在本章中，我们探索了使用 `ggplot2` 包的各种可视化技术。我们首先讨论了 `ggplot2` 模板和美学映射，它们为创建自定义图表提供了框架。然后我们使用条形图、直方图和密度图来可视化分布。这些技术使我们能够检查不同类别中数据的频率和分布。接下来，我们讨论了使用饼图和堆叠条形图来可视化比例。这些技术使我们能够比较数据集中不同类别的相对大小。我们还探索了箱线图，它有助于检查数据的分布范围和中心趋势。最后，我们介绍了可视化变量间关联的技术，包括散点图和折线图。这些技术用于可视化两个或多个变量之间的关系，并识别数据中的模式或趋势。\n\
  \n在下一章中，我们将专注于特征工程，它涉及转换变量并在数据集中创建新特征，以提高机器学习模型的性能。\n\n### 加入我们书籍的 Discord 空间\n\n\
