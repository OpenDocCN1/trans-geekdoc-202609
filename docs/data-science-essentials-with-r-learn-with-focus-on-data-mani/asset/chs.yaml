  \n![](img/fm1.png)\n\n## 第 4 章：数据整理\n\n### 简介\n\n\n\n\n### 数据清洗\n\n本章将深入探讨数据清洗。在得出任何有意义的见解之前，操纵\
  \ `DataFrames`（如重塑和重组）的能力往往变得至关重要。`DataFrames` 通常需要重塑以用于分析或可视化目的。在本章的第一部分中，您将学习将数据表从长格式转换为宽格式以及反之亦然的过程。您将学习如何根据特定标准汇总数据并对分组数据执行操作。我们还将深入探讨选择列和筛选行，重点关注处理聚合数据。合并来自多个来源的数据是数据分析中的常见任务，因此我们也将探讨这一点。\n\
  \n### 结构\n\n在本章中，您将探索以下主题以增强您的数据操作技能：\n\n*   **数据透视**\n    *   长格式和宽格式数据\n    *\
  \   将宽格式转换为长格式\n    *   将长格式转换为宽格式\n*   **分组与汇总**\n    *   对分组数据进行筛选\n    *   在分组数据上添加新列\n\
  *   **合并数据**\n    *   绑定数据：`rbind()` 和 `cbind()`\n    *   连接：内连接、外连接、左连接和右连接\n\n\
  ### 目标\n\n您将研究重塑和重组，以学习将 `DataFrames` 从长格式转换为宽格式以及反之亦然。接下来，您将深入研究基于特定标准汇总数据以及对分组数据执行操作的技术。此外，您将发现如何将两个\
  \ `DataFrames` 合并为单个数据集。\n\n在本章结束时，您将获得基本的数据清洗技能，帮助您高效地重塑、聚合和合并 `DataFrames`。这一基础将为您进行更高级的数据分析技术做好准备。\n\
  \n### 数据透视\n\n数据透视是数据分析中一项至关重要的技术，用于重构数据集以进行更有效的探索。通常，数据以宽格式或长格式呈现，每种格式都有其自身的优势。在长格式数据中，每一行对应单个观测值或测量值，多行代表不同的时间点。相反，在宽格式数据中，每个主体或实体由单行表示，多列用于表示不同的时间点。宽格式适用于初步汇总统计，而长格式更适合某些分析，如时间序列或重复测量。通过在这两种格式之间转换数据，您可以根据特定需求对其进行定制。\n\
  \n#### 长格式和宽格式数据\n\n假设您在一家水果销售公司工作。您有一个电子表格，列出了每周每天售出的苹果、香蕉和橙子的总数。数据如 **表 4.1**\
  \ 所示：\n\n| Day | Apples | Bananas | Oranges |\n| --- | --- | --- | --- |\n| Monday\
  \ | 10 | 5 | 7 |\n| Tuesday | 8 | 3 | 9 |\n| Wednesday | 12 | 2 | 6 |\n| Thursday\
  \ | 15 | 6 | 8 |\n| Friday | 11 | 4 | 10 |\n\n**表 4.1**：宽格式数据示例\n\n这是宽数据的一个示例，因为每种水果类型都有一个单独的列。宽数据的优势在于易于阅读和理解。您可能希望以不同方式分析数据集。有时，您希望在各自的列中查看每个变量，有时，您希望在单个列中查看所有变量。这就是宽格式和长格式数据发挥作用的地方。\n\
  \n然而，当您想使用 `ggplot2` 包可视化数据时，可能需要使用长格式数据。在长格式中，每个观测值对应单次销售，列指示日期、水果类型和售出的水果数量。一些库，如\
  \ `ggplot2` 和 `plyr`，以及大多数建模函数，如 `lm()`、`glm()` 和 `gam()` 都需要长格式数据。**表 4.2** 如下所示为长格式数据：\n\
  \n| Day | Fruits | Sales |\n| --- | --- | --- |\n| Monday | Apples | 10 |\n| Monday\
  \ | Bananas | 5 |\n| Monday | Oranges | 7 |\n| Tuesday | Apples | 8 |\n| Tuesday\
  \ | Bananas | 3 |\n| Tuesday | Oranges | 9 |\n| Wednesday | Apples | 12 |\n| Wednesday\
  \ | Bananas | 2 |\n| Wednesday | Oranges | 6 |\n| Thursday | Apples | 15 |\n| Thursday\
  \ | Bananas | 6 |\n| Thursday | Oranges | 8 |\n| Friday | Apples | 11 |\n| Friday\
  \ | Bananas | 4 |\n| Friday | Oranges | 10 |\n\n**表 4.2**：长格式数据示例\n\n通常，当您有一组固定的列对应感兴趣的变量时，宽数据是合适的；当您有许多不同的变量应组织成行时，长数据是合适的。\n\
  \n##### 介绍 reshape2\n\nHadley Wickham 创建了 `reshape2` 包，它有助于轻松地在宽格式和长格式之间转换数据。`reshape2`\
  \ 包使用两个主要函数：`melt()` 和 `cast()`。`melt()` 将数据从宽格式转换为长格式，而 `cast()` 接受长格式数据并将其转换回宽格式。\n\
  \n##### 加载数据\n\n为了阐述本主题，我们将使用加州大学欧文分校（UCI）机器学习存储库上提供的伯明翰停车数据集作为示例数据集。**表 4.3** 描述了停车数据集：\n\
  \n| 列名 | 描述 |\n| --- | --- |\n| `SystemCodeNumber` | 停车场 ID |\n| `Capacity` | 停车场容量\
  \ |\n| `Occupancy` | 停车场占用率 |\n| `LastUpdated` | 测量的日期和时间 |\n\n**表 4.3**：停车数据集列描述\n\
  \n为了开始分析，我们将首先安装并加载必要的包，即 `reshape2` 和 `dplyr`。之后，我们将读取停车数据集并仔细查看 `DataFrame` 的结构。\n\
  \n```r\n# install and load the required packages\ninstall.packages(\"reshape2\"\
  )\nlibrary(reshape2)\n\n# you will use dplyr for a few pre-processing steps\nlibrary(dplyr)\n\
  \n# read the dataset\nparking_df <- read.csv(\"parking.csv\")\n\n# structure of\
  \ the DataFrame\nstr(parking_df)\n```\n\n```\n## 'data.frame': 35717 obs. of 4 variables:\n\
  ## $ SystemCodeNumber: chr \"BHMBCCMKT01\" \"BHMBCCMKT01\" \"BHMBCCMKT01\" \"BHMBCCMKT01\"\
  \ ...\n## $ Capacity        : int 577 577 577 577 577 577 577 577 577 577 ...\n\
  ## $ Occupancy       : int 61 64 80 107 150 177 219 247 259 266 ...\n## $ LastUpdated\
  \     : chr \"2016-10-04 07:59:42\" \"2016-10-04 08:25:42\" \"2016-10-04 08:59:42\"\
  \ \"2016-10-04 09:32:46\" ...\n```\n\n宽数据为每个变量设有一列。例如，停车数据集当前的数据格式是宽格式数据。停车数据集有\
  \ 35,717 条记录和 4 个变量。让我们使用 `head()` 函数显示 `DataFrame` 的前 6 行：\n\n```r\nhead(parking_df)\n\
  ```\n\n```\n##   SystemCodeNumber Capacity Occupancy           LastUpdated\n## 1\
  \      BHMBCCMKT01      577        61 2016-10-04 07:59:42\n## 2      BHMBCCMKT01\
  \      577        64 2016-10-04 08:25:42\n## 3      BHMBCCMKT01      577       \
  \ 80 2016-10-04 08:59:42\n## 4      BHMBCCMKT01      577       107 2016-10-04 09:32:46\n\
  ## 5      BHMBCCMKT01      577       150 2016-10-04 09:59:48\n## 6      BHMBCCMKT01\
  \      577       177 2016-10-04 10:26:49\n```\n\n```r\n# subset duplicated rows\
  \ in the DataFrame\nduplicated_rows <- parking_df %>% filter(duplicated(parking_df))\n\
  \nnrow(duplicated_rows)\n```\n\n```\n## [1] 216\n```\n\n由于这些重复行是冗余的，您应该将其移除以进行任何进一步分析，如下所示：\n\
  \n```r\n# remove 216 duplicate rows from the parking_df\nparking_df <- parking_df\
  \ %>% distinct()\n\n# number of rows in the updated DataFrame\nnrow(parking_df)\n\
  ```\n\n```\n## [1] 35501\n```\n\n##### 将宽格式数据转换为长格式数据\n\n`melt()` 函数是将宽格式数据转换为长格式数据的有用工具。这对于数据分析和可视化非常有帮助，因为许多统计和图形方法要求数据采用长格式。\n\
  \n\n\n\n# 使用 `melt()` 和 `dcast()` 重塑数据\n\n`melt()` 的关键参数之一是 `id.vars`。该参数指定在长格式数据中保留哪些列作为\
  \ ID 变量。这些列将保持原样，输出数据中的每一行将对应 ID 变量中值的唯一组合。\n\n在我们的停车数据集中，`SystemCodeNumber` 和 `LastUpdated`\
  \ 唯一标识每个观测值。因此，它们是 ID 变量的良好候选者，因为每一行代表 `SystemCodeNumber` 和 `LastUpdated` 的唯一组合。\n\
  \n```r\n# 将 parking_df 从宽格式转换为长格式数据\nparking_melt <- melt(parking_df, id.vars =\
  \ c(\"SystemCodeNumber\", \"LastUpdated\"))\n\n# 显示熔化后 DataFrame 的前 6 行\nhead(parking_melt)\n\
  ```\n\n```\n## SystemCodeNumber LastUpdated variable value\n## BHMBCCMKT01 2016-10-04\
  \ 07:59:42 Capacity 577\n## BHMBCCMKT01 2016-10-04 08:25:42 Capacity 577\n## BHMBCCMKT01\
  \ 2016-10-04 08:59:42 Capacity 577\n## BHMBCCMKT01 2016-10-04 09:32:46 Capacity\
  \ 577\n## BHMBCCMKT01 2016-10-04 09:59:48 Capacity 577\n## BHMBCCMKT01 2016-10-04\
  \ 10:26:49 Capacity 577\n```\n\n标记为 Capacity 和 Occupancy 的列合并到一个名为 Variable 的更大类别中，而它们各自的测量值则堆叠在\
  \ value 列之下。要自定义长格式数据中熔化列（variable 和 value）的默认列标题，可以使用 `variable.name` 和 `value.name`\
  \ 参数。这些参数允许你分别指定将保存变量名和值的列的名称。\n\n```r\n# 自定义 variable 和 value 的默认列标题\nparking_melt\
  \ <- melt(parking_df, id.vars = c(\"SystemCodeNumber\", \"LastUpdated\"),\n    \
  \                 variable.name = \"parking_variable\",\n                     value.name\
  \ = \"parking_value\")\n\n# 打印更新后 parking_melt 的前 6 行\nhead(parking_melt)\n```\n\
  \n```\n## SystemCodeNumber LastUpdated parking_variable parking_value\n## BHMBCCMKT01\
  \ 2016-10-04 07:59:42 Capacity 577\n## BHMBCCMKT01 2016-10-04 08:25:42 Capacity\
  \ 577\n## BHMBCCMKT01 2016-10-04 08:59:42 Capacity 577\n## BHMBCCMKT01 2016-10-04\
  \ 09:32:46 Capacity 577\n## BHMBCCMKT01 2016-10-04 09:59:48 Capacity 577\n## BHMBCCMKT01\
  \ 2016-10-04 10:26:49 Capacity 577\n```\n\n##### 将长格式数据转换为宽格式数据\n\n`reshape2` 包提供了多个函数用于将数据从长格式转换为宽格式。由于我们经常处理\
  \ DataFrame，我们将重点关注 `dcast()` 函数。如果需要，也可以使用 `acast()` 转换为向量、矩阵或数组。\n\n要使用 `dcast()`\
  \ 函数，你需要指定一些参数。首先，你需要使用 `data` 参数指定要转换的 DataFrame。接下来，你需要使用 `formula` 参数指定一个公式。该公式将指定你想要用于将数据从长格式转换为宽格式的变量。你还需要使用\
  \ `value.var` 参数指定包含要转换值的列。最后，如果有必要，你可以使用 `fun.aggregate` 参数指定一个在转换前应用于数据的函数。\n\n\
  现在，让我们关注之前创建的长格式数据 `parking_melt`，并使用它恢复到原始的宽格式数据：\n\n```r\n# 将 parking_melt 从长格式转换为宽格式数据\n\
  parking_cast <- dcast(parking_melt, SystemCodeNumber + LastUpdated ~ parking_variable,\
  \ value.var = \"parking_value\")\n\n# 显示更新后 parking_cast 的前 6 行\nhead(parking_cast)\n\
  ```\n\n```\n## SystemCodeNumber LastUpdated Capacity Occupancy\n## BHMBCCMKT01 2016-10-04\
  \ 07:59:42 577 61\n## BHMBCCMKT01 2016-10-04 08:25:42 577 64\n## BHMBCCMKT01 2016-10-04\
  \ 08:59:42 577 80\n## BHMBCCMKT01 2016-10-04 09:32:46 577 107\n## BHMBCCMKT01 2016-10-04\
  \ 09:59:48 577 150\n## BHMBCCMKT01 2016-10-04 10:26:49 577 177\n```\n\n我们将在以下代码中仔细查看\
  \ `dcast()` 函数中使用的公式：\n\n```r\nSystemCodeNumber + LastUpdated ~ parking_variable\n\
  ```\n\n该公式定义了用于将数据从长格式转换为宽格式的变量。在公式中，波浪号（`~`）将左侧（LHS）与右侧（RHS）分开。我们在左侧有两个 ID 变量，`SystemCodeNumber`\
  \ 和 `LastUpdated`。这些变量将成为生成的宽格式数据的行名。在右侧，我们有 `parking_variable`，即包含要在宽格式数据中使用的变量名的列。\n\
  \n通过在公式中同时指定行变量和列变量，它创建了一个宽格式 DataFrame，其中每个 `SystemCodeNumber` 和 `LastUpdated`\
  \ 的唯一组合对应一行，而 `parking_variable` 列中的每个唯一值对应一列。\n\n下图展示了 `dcast()` 函数——长格式到宽格式数据的转换：\n\
  \n![](img/Figure4.1.png)\n\n**图 4.1：** `dcast()` 函数示意图：长格式到宽格式数据的转换\n\n### 分组与汇总数据\n\
  \n接下来，为了加深你对基于分组变量汇总数据的理解，我们将利用加州大学欧文分校机器学习存储库中的批发客户数据集。\n\n批发客户数据集指的是一家批发分销商 440\
  \ 位客户的消费行为。该数据集包含每位客户在不同产品类别上的年支出（货币单位 M.U.）：鲜食产品、奶制品、杂货产品、冷冻产品、洗涤剂和纸制品、熟食产品。\n\n\
  ```r\n# 读取批发客户数据集\nwholesale_df <- read.csv(\"Wholesale customers data.csv\")\n\n\
  # DataFrame 的结构\nstr(wholesale_df)\n```\n\n```\n## 'data.frame': 440 obs. of 8 variables:\n\
  ## $ Channel : int 2 2 2 1 2 2 2 2 1 2 ...\n## $ Region : int 3 3 3 3 3 3 3 3 3\
  \ 3 ...\n## $ Fresh : int 12669 7057 6353 13265 22615 9413 12126 7579 5963 6006\
  \ ...\n## $ Milk : int 9656 9810 8808 1196 5410 8259 3199 4956 3648 11093 ...\n\
  ## $ Grocery : int 7561 9568 7684 4221 7198 5126 6975 9426 6192 18881 ...\n## $\
  \ Frozen : int 214 1762 2405 6404 3915 666 480 1669 425 1159 ...\n## $ Detergents_Paper:\
  \ int 2674 3293 3516 507 1777 1795 3140 3321 1716 7425 ...\n## $ Delicassen : int\
  \ 1338 1776 7844 1788 5185 1451 545 2566 750 2098 ...\n```\n\n在以下数据中，Region 中的水平\
  \ 1、2 和 3 分别对应里斯本、波尔图和其他地区。Channel 中的水平 1 和 2 分别对应餐饮住宿业（Hotel/Restaurant/Café）和零售业，如下所示：\n\
  \n```r\n# 将 Region 和 Channel 转换为具有相应水平和标签的因子\nwholesale_df <- wholesale_df %>%\n\
  \  mutate(Region = factor(Region, levels = c(1, 2, 3),\n                       \
  \  labels = c(\"Lisbon\", \"Oporto\", \"Other Region\")),\n         Channel = factor(Channel,\
  \ levels = c(1, 2),\n                          labels = c(\"Horeca\", \"Retail\"\
  )))\n\n# 检查 Channel 和 Region 列的频数\ntable(wholesale_df$Channel)\n```\n\n```\n## Horeca\
  \ Retail\n## 298 142\n```\n\n```r\ntable(wholesale_df$Region)\n```\n\n```\n## Lisbon\
  \ Oporto Other Region\n## 77 47 316\n```\n\n> **注意：** `mutate()` 函数基于现有变量生成新列。如果同名列已存在，也可以修改它。此外，通过将列的值赋为\
  \ `NULL` 可以删除列。\n\n这里，`mutate()` 函数修改了两个变量：`Region` 和 `Channel`。我们在 `mutate()` 中使用\
  \ `factor()` 函数将 `Region` 和 `Channel` 列的数值转换为具有指定相应水平和标签的因子：\n\n```r\n# 计算每个产品类别的平均支出\n\
  spending_summary <- wholesale_df %>%\n  summarise(mean_fresh = mean(Fresh),\n  \
  \          mean_milk = mean(Milk),\n            mean_grocery = mean(Grocery),\n\
  \            mean_frozen = mean(Frozen),\n            mean_detergents_paper = mean(Detergents_Paper))\n\
  ```\n\n\n\n\n## 代码示例与输出\n\n*   `mean_delicatessen = mean(Delicassen)`\n*   `# print\
  \ the summary`\n*   `spending_summary`\n\n### 输出结果\n\n```\n## mean_fresh mean_milk\
  \ mean_grocery mean_frozen mean_detergents_paper mean_delicatessen\n## 12000.3 5796.\
  \ 7951.277 3071.932 2881.493 1524.87\n```\n\n在该代码片段中，使用 `dplyr` 包的 `summarise()`\
  \ 计算整个数据集中不同产品类别的平均支出。值得注意的是，`summarise()` 结合 `group_by()` 使用时最为有用，后者将分析单位从整个数据集更改为由某一列定义的特定分组：\n\
  \n*   `# group by region and calculate the mean spending on Fresh, Milk, and Grocery\
  \ product category`\n*   `grouped_data1 <- wholesale_df %>%`\n*   `group_by(Region)\
  \ %>%`\n*   `summarise(mean_fresh = mean(Fresh),`\n*   `mean_milk = mean(Milk),`\n\
  *   `mean_grocery = mean(Grocery))`\n*   `# view the result`\n*   `View(grouped_data1)`\n\
  \n### 输出结果\n\n```\n## Region mean_fresh mean_milk mean_grocery\n## Lisbon 11102.727\
  \ 5486.416 7403.078\n## Oporto 9888.681 5088.170 9219.596\n## Other Region 12533.472\
  \ 5977.085 7896.364\n```\n\n上述代码按地区对数据分组，然后计算每个地区三个产品类别的平均年支出。\n\n接下来，计算两个客户渠道（Horeca\
  \ 和 Retail）在几个产品类别上的总支出：\n\n*   `# group by channel and calculate the total spending\
  \ on product categories`\n*   `grouped_data2 <- wholesale_df %>%`\n*   `group_by(Channel)\
  \ %>%`\n*   `summarise(total_fresh = sum(Fresh),`\n*   `total_milk = sum(Milk),`\n\
  *   `total_grocery = sum(Grocery))`\n*   `# view the result`\n*   `View(grouped_data2)`\n\
  \n### 输出结果\n\n```\n## Channel total_fresh total_milk total_grocery\n## Horeca 4015717\
  \ 1028614 1180717\n## Retail 1264414 1521743 2317845\n```\n\n*   `# group by region\
  \ and channel, and calculate the number of customers in each group`\n*   `grouped_data3\
  \ <- wholesale_df %>%`\n*   `group_by(Region, Channel) %>%`\n*   `summarise(count\
  \ = n())`\n*   `# view the result`\n*   `View(grouped_data3)`\n\n### 输出结果\n\n```\n\
  ## Region Channel count\n## Lisbon Horeca 59\n## Lisbon Retail 18\n## Oporto Horeca\
  \ 28\n## Oporto Retail 19\n## Other Region Horeca 211\n## Other Region Retail 105\n\
  ```\n\n上述代码使用 `group_by` 函数按 `Region` 和 `Channel` 列对数据集分组。然后使用 `summarize` 函数和 `n()`\
  \ 函数计算每组的客户数量，`n()` 统计每组中的观测值数量。生成的 DataFrame 每行对应地区和渠道的唯一组合，并显示该组中的客户数量。\n\n##\
  \ 分组数据上的筛选\n\n分组数据通常在与 `summarise()` 函数结合使用时变得非常有价值，可进行简洁的计算和汇总。但值得注意的是，`mutate()`\
  \ 和 `filter()` 也提供了可在分组数据上执行的便捷操作，如下所示：\n\n*   `region_high_grocery_spending <-\
  \ wholesale_df %>%`\n*   `group_by(Region) %>%`\n*   `filter(Grocery > mean(Grocery))`\n\
  \n此处，通过按 `Region` 变量对数据分组，并根据杂货产品的高支出（大于各地区内的平均支出）进行筛选，可找出在其所在地区杂货支出高于平均水平的客户子集。筛选后的数据将识别出消费者在杂货产品上的地区性行为差异和偏好。\n\
  \n## 分组数据上新增列\n\n*   `# Grouping by Region and calculating the total spending per\
  \ region`\n*   `region_total_spending <- wholesale_df %>%`\n*   `group_by(Region)\
  \ %>%`\n*   `mutate(total_spending = sum(Fresh, Milk, Grocery, Frozen, Detergents_Paper,\
  \ Delicassen))`\n\n通过按 `Region` 变量对数据分组并使用 `mutate()` 函数，代码向数据集新增了一个名为 `total_spending`\
  \ 的变量。该新变量表示各地区不同产品类别支出的总和。各地区的总支出可帮助企业就资源分配、地区支出差异和市场细分识别做出明智决策。\n\n### 合并数据\n\n\
  让我们看看在 R 中合并数据的方法：\n\n#### 绑定数据：`rbind()` 和 `cbind()`\n\n`rbind()` 代表行绑定，允许通过将行堆叠在一起，将两个或多个\
  \ DataFrame 合并为单个 DataFrame。为确保生成的 DataFrame 中的列正确对齐且结构一致，必须满足以下条件：\n\n*   待合并的\
  \ DataFrame 必须具有相同的列名。\n*   待合并的 DataFrame 必须具有相同数量的列。\n*   待合并的 DataFrame 中列的顺序应相同。\n\
  \n*   `# create a DataFrame`\n*   `player_df1 <- data.frame(`\n*   `Player_Name\
  \ = c(\"Virat Kohli\", \"Rohit Sharma\", \"Suresh Raina\"),`\n*   `Score = c(102,\
  \ 53, 45)`\n*   `)`\n*   `# create another DataFrame`\n*   `player_df2 <- data.frame(`\n\
  *   `Player_Name = c(\"Ravindra Jadeja\", \"Hardik Pandya\"),`\n*   `Score = c(82,\
  \ 64)`\n*   `)`\n\n这里有两个 DataFrame：`player_df1` 和 `player_df2`，包含印度板球运动员在不同比赛中的得分信息。现在假设我们想将这两个\
  \ DataFrame 合并为一个显示所有球员所有得分的 DataFrame。可以使用 `rbind()` 函数实现，请看以下代码片段：\n\n*   `# combine\
  \ the two DataFrames using rbind()`\n*   `player_df_combined <- rbind(player_df1,\
  \ player_df2)`\n*   `# view the combined DataFrame`\n*   `player_df_combined`\n\n\
  ### 输出结果\n\n```\n## Player_Name Score\n## Virat Kohli 102\n## Rohit Sharma 53\n\
  ## Suresh Raina 45\n## Ravindra Jadeja 82\n## Hardik Pandya 64\n```\n\n`cbind()`\
  \ 代表列绑定，允许通过将一个 DataFrame 的列附加到另一个 DataFrame 旁边来合并多个 DataFrame。为确保生成的 DataFrame\
  \ 结构一致，待合并的 DataFrame 必须具有相同数量的行。\n\n*   `# Create a DataFrame with characteristics\
  \ of the match`\n*   `match_df <- data.frame(`\n*   `Venue = c(\"Mumbai\", \"Delhi\"\
  , \"Kolkata\"),`\n*   `Date = c(\"2023-05-15\", \"2023-05-16\", \"2023-05-17\")`\n\
  *   `)`\n*   `# Combine player_df1 and match_df using cbind`\n*   `combined_df <-\
  \ cbind(player_df1, match_df)`\n*   `# print combined_df`\n*   `combined_df`\n\n\
  ### 输出结果\n\n```\n## Player_Name Score Venue Date\n## Virat Kohli 102 Mumbai 2022-05-15\n\
  ## Rohit Sharma 53 Delhi 2022-05-16\n## Suresh Raina 45 Kolkata 2022-05-17\n```\n\
  \n#### 连接：内连接、外连接、左连接和右连接\n\n在数据库领域，有一种称为连接的强大操作，允许基于公共列或变量合并两个表。同样，在 R 中，可以使用 `merge()`\
  \ 函数基于共享列合并两个 DataFrame。\n\n可以将其想象为拼合两块完美契合的拼图碎片。`merge()` 帮助你基于共同特征（如名称或 ID 号码）匹配碎片。DataFrame\
  \ 合并后，你可以利用合并的信息进行各种分析和可视化。下表定义了 `merge()` 函数的基本参数。\n\n| Argument | Description\
  \ |\n| --- | --- |\n| `x` | 要合并的第一个 DataFrame。 |\n| `y` | 要合并的第二个 DataFrame。 |\n\
  | `by` | 要合并的列。 |\n| `all` | 逻辑值，指示是否包含两个 DataFrame 中的所有观测值（行）（外连接）。 |\n| `all.x`\
  \ | 逻辑值，指示是否包含第一个 DataFrame 中的所有观测值，即使第二个 DataFrame 中没有匹配行（左连接）。 |\n\n\n\n\n\n#####\
  \ 数据框合并操作\n\n## merge 函数参数说明\n\n| 参数 | 类型 | 说明 |\n|------|------|------|\n| `all.y`\
  \ | 逻辑值 | 指示是否包含第二个数据框中的所有观测值，即使在第一个数据框中没有匹配的行（右连接）。 |\n\n**表 4.4：merge 函数参数说明**\n\
  \n##### 创建示例数据框\n\n### transactions 数据框\n\n创建一个包含借记卡交易信息的 `transactions` 数据框：\n\n\
  ```r\n# Create the transactions DataFrame\ntransactions <- data.frame(\n  transaction_id\
  \ = c(1, 2, 3, 4, 5, 6, 7, 8, 9),\n  transaction_date = as.Date(c(\"2023-05-01\"\
  , \"2023-05-02\", \"2023-05-03\", \"2023-05-04\",\n                            \
  \   \"2023-05-04\", \"2023-05-04\", \"2023-05-05\", \"2023-05-06\", \"2023-05-07\"\
  )),\n  transaction_amount = c(1050, 1075.50, 2050.00, 1120.00, 190.75, 1150.00,\
  \ 160.00, 2580.50, 1825.00),\n  customer_id = c(101, 102, 103, 104, 105, 106, 107,\
  \ 108, 109),\n  stringsAsFactors = FALSE\n)\n\n# print transactions DataFrame\n\
  transactions\n```\n\n输出结果：\n\n```\n##   transaction_id transaction_date transaction_amount\
  \ customer_id\n## 1              1       2023-05-01           1050.00         101\n\
  ## 2              2       2023-05-02           1075.50         102\n## 3       \
  \       3       2023-05-03           2050.00         103\n## 4              4  \
  \     2023-05-04           1120.00         104\n## 5              5       2023-05-04\
  \            190.75         105\n## 6              6       2023-05-04          \
  \ 1150.00         106\n## 7              7       2023-05-05            160.00  \
  \       107\n## 8              8       2023-05-06           2580.50         108\n\
  ## 9              9       2023-05-07           1825.00         109\n```\n\n### customers\
  \ 数据框\n\n创建一个包含客户信息的 `customers` 数据框：\n\n```r\n# create the customers DataFrame\n\
  customers <- data.frame(\n  customer_id = c(102, 103, 104, 105, 107, 108, 109, 110),\n\
  \  customer_name = c(\"Penny\", \"Sheldon\", \"Howard\", \"Amy\",\n            \
  \        \"Raj\", \"Stuart\", \"Emily\", \"Missy\"),\n  customer_email = c(\"penny@gmail.com\"\
  , \"sheldon@gmail.com\", \"howard@gmail.com\", \"amy@gmail.com\",\n            \
  \         \"raj@gmail.com\", NA, \"emily@gmail.com\", NA),\n  stringsAsFactors =\
  \ FALSE\n)\n\n# print customers DataFrame\ncustomers\n```\n\n输出结果：\n\n```\n##  \
  \ customer_id customer_name   customer_email\n## 1         102         Penny  penny@gmail.com\n\
  ## 2         103       Sheldon sheldon@gmail.com\n## 3         104        Howard\
  \  howard@gmail.com\n## 4         105           Amy    amy@gmail.com\n## 5     \
  \    107           Raj    raj@gmail.com\n## 6         108       Stuart         \
  \    <NA>\n## 7         109         Emily  emily@gmail.com\n## 8         110   \
  \      Missy             <NA>\n```\n\n> **注意**：`customer_email` 列中 `customer_id`\
  \ 为 108 和 110 的记录存在缺失值。\n\n##### 合并前的准备\n\n在合并数据集之前，识别每个数据集的**主键**非常重要。主键是唯一标识数据集中每个观测值的列或列集合，这意味着没有两个观测值应具有相同的主键值。\n\
  \n下面将演示如何在这两个数据框上执行不同类型的合并操作。\n\n##### 连接类型示例\n\n###### 内连接\n\n内连接仅返回两个数据框中都有匹配值的行，即返回两个数据框的交集。使用\
  \ `merge()` 函数且不添加额外参数即可执行内连接：\n\n```r\n# perform an inner join\ninner_join_df <-\
  \ merge(transactions, customers, by = \"customer_id\")\n```\n\n此处 `by` 参数设置为 `customer_id`，即两个数据框间的公共变量。生成的\
  \ `inner_join_df` 仅包含 `customer_id` 在 `transactions` 和 `customers` 中均存在的行：\n\n```r\n\
  # print inner_join_df\ninner_join_df\n```\n\n输出结果：\n\n```\n##   customer_id transaction_id\
  \ transaction_date transaction_amount customer_name customer_email\n## 1       \
  \  102              2       2023-05-02           1075.50         Penny  penny@gmail.com\n\
  ## 2         103              3       2023-05-03           2050.00       Sheldon\
  \ sheldon@gmail.com\n## 3         104              4       2023-05-04          \
  \ 1120.00        Howard  howard@gmail.com\n## 4         105              5     \
  \  2023-05-04            190.75           Amy    amy@gmail.com\n## 5         107\
  \              7       2023-05-05            160.00           Raj    raj@gmail.com\n\
  ## 6         108              8       2023-05-06           2580.50       Stuart\
  \            <NA>\n## 7         109              9       2023-05-07           1825.00\
  \         Emily  emily@gmail.com\n```\n\n###### 外连接\n\n外连接返回两个数据框中的所有行，并用 `NA` 填充无匹配列的值。将\
  \ `all` 参数设置为 `TRUE` 可执行外连接：\n\n```r\n# perform an outer join\nouter_join_df <-\
  \ merge(transactions, customers, by = \"customer_id\", all = TRUE)\n```\n\n合并后的\
  \ `outer_join_df` 包含两个数据框的所有行，无匹配处以 `NA` 填充：\n\n```r\n# print outer_join_df\nouter_join_df\n\
  ```\n\n输出结果：\n\n```\n##    customer_id transaction_id transaction_date transaction_amount\
  \ customer_name customer_email\n## 1          101              1       2023-05-01\
  \           1050.00          <NA>           <NA>\n## 2          102            \
  \  2       2023-05-02           1075.50         Penny  penny@gmail.com\n## 3   \
  \       103              3       2023-05-03           2050.00       Sheldon sheldon@gmail.com\n\
  ## 4          104              4       2023-05-04           1120.00        Howard\
  \  howard@gmail.com\n## 5          105              5       2023-05-04         \
  \   190.75           Amy    amy@gmail.com\n## 6          106              6    \
  \   2023-05-04           1150.00          <NA>           <NA>\n## 7          107\
  \              7       2023-05-05            160.00           Raj    raj@gmail.com\n\
  ## 8          108              8       2023-05-06           2580.50       Stuart\
  \            <NA>\n## 9          109              9       2023-05-07           1825.00\
  \         Emily  emily@gmail.com\n## 10         110             NA             <NA>\
  \               NA         Missy           <NA>\n```\n\n###### 左连接\n\n左连接返回左侧数据框（`transactions`）的所有行，以及右侧数据框（`customers`）中匹配的行。若右侧无匹配行，结果中右侧列将显示\
  \ `NA`。将 `all.x` 设置为 `TRUE` 执行左连接：\n\n```r\n# perform a left join\nleft_join_df\
  \ <- merge(transactions, customers, by = \"customer_id\", all.x = TRUE)\n```\n\n\
  ```r\n# print left_join_df\nleft_join_df\n```\n\n输出结果：\n\n```\n##   customer_id\
  \ transaction_id transaction_date transaction_amount customer_name customer_email\n\
  ## 1         101              1       2023-05-01           1050.00          <NA>\
  \           <NA>\n## 2         102              2       2023-05-02           1075.50\
  \         Penny  penny@gmail.com\n## 3         103              3       2023-05-03\
  \           2050.00       Sheldon sheldon@gmail.com\n## 4         104          \
  \    4       2023-05-04           1120.00        Howard  howard@gmail.com\n## 5\
  \         105              5       2023-05-04            190.75           Amy  \
  \  amy@gmail.com\n## 6         106              6       2023-05-04           1150.00\
  \          <NA>           <NA>\n## 7         107              7       2023-05-05\
  \            160.00           Raj    raj@gmail.com\n## 8         108           \
  \   8       2023-05-06           2580.50       Stuart            <NA>\n## 9    \
  \     109              9       2023-05-07           1825.00         Emily  emily@gmail.com\n\
  ```\n\n###### 右连接\n\n右连接返回右侧数据框（`customers`）的所有行，以及左侧数据框（`transactions`）中匹配的行。若左侧无匹配行，结果中左侧列将显示\
  \ `NA`。将 `all.y` 设置为 `TRUE` 执行右连接：\n\n```r\n# perform a right join\nright_join_df\
  \ <- merge(transactions, customers, by = \"customer_id\", all.y = TRUE)\n```\n\n\
  生成的 `right_join_df` 保留 `customers` 的所有行，仅包含 `transactions` 中匹配的行：\n\n```r\n# print\
  \ right_join_df\nright_join_df\n```\n\n输出结果：\n\n```\n##   customer_id transaction_id\
  \ transaction_date transaction_amount customer_name customer_email\n## 1       \
  \  102              2       2023-05-02           1075.50         Penny  penny@gmail.com\n\
  ## 2         103              3       2023-05-03           2050.00       Sheldon\
  \ sheldon@gmail.com\n## 3         104              4       2023-05-04          \
  \ 1120.00        Howard  howard@gmail.com\n## 4         105              5     \
  \  2023-05-04            190.75           Amy    amy@gmail.com\n## 5         107\
  \              7       2023-05-05            160.00           Raj    raj@gmail.com\n\
  ## 6         108              8       2023-05-06           2580.50       Stuart\
  \            <NA>\n## 7         109              9       2023-05-07           1825.00\
  \         Emily  emily@gmail.com\n## 8         110             NA             <NA>\
  \               NA         Missy           <NA>\n```\n\n### 结论\n\n结论\n\n\n\n\n在本章中，我们探讨了用于操作和转换数据以促进有效分析的基本技术。我们首先讨论了长格式和宽格式数据的概念，并演示了如何在这两种格式之间透视数据，这对于支持多样化的分析需求至关重要。随后，我们深入研究了数据的分组与汇总，涵盖了如何对分组数据进行筛选以及添加新列，从而实现更细粒度、更有洞察力的数据分析。最后，我们探索了合并数据的方法，包括使用\
  \ `rbind()` 和 `cbind()` 进行数据绑定，以及不同类型的连接（内连接、外连接、左连接和右连接），以灵活的方式组合数据集。掌握这些技能将显著增强您处理复杂数据集并从分析中获取有意义见解的能力。请记住要持续练习、探索新的包和库，并尝试新方法，以保持和提升您的专业水平。\n\
