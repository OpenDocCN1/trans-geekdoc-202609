- - '###'
  - 第一：留心你传输的数据以及连接到你自己网络的内容
- - '###'
  - 第二：养成网络卫生习惯这意味着基本的预防措施。避免简单或明显的密码，或者那些通过研究你的传记就能猜到的密码（例如你母亲的姓氏）。定期更改密码，不要对所有数据字段或网络网站使用同一个密码。如果你通过电子邮件发送受密码保护的文档，不要也通过邮件发送密码。通过短信或电话发送。在可用的情况下使用多因素身份验证，或通过坚持要求电话或短信验证来确认交易的合法性。
