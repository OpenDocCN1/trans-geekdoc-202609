- - '#'
  - 有一点应当明确。虽然人们习惯于将现代大数据的发展归因于互联网，但这种观点过于简单。这些发展源于我们收集、存储、传输和分析数据方式的改变，以及数字传输与调节物理世界的控制系统运行之间相互作用的变化。正如我将描述的那样，多种因素的汇聚推动了这些变化。无疑，互联网的创造是之一，其动力源于对灵活通信系统的需求，这种系统能够抵抗自然或人为对常规通信方式的破坏。数据收集和分析的其他进步源于一种新的国家安全环境，在这种环境中，威胁不再是国家，而是唯有通过监控全球人员、资金和通信的移动才能检测并阻止的在线敌人。更深层次的是，数据已成为目标营销的价值工具，以及降低商业交易执行成本的手段。简而言之，数据革命驱动了并反过来推动了全球经济的转型扩张。
