- "# 数据爆炸：数字时代重夺我们的网络安全\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n*献给 Meryl, Emily 和 Philip，以及所有无私奉献的人们……*\n\
  \n\n\n# 引言：大数据正在监视你\n\n2001 年 9 月 11 日早晨，当我正担任美国司法部刑事司部助理司法检察长，开车前往华盛顿特区的办公室时，我的副手打来电话，告诉我有一架飞机撞入了纽约市的世界贸易中心。我们最初的假设是某架私人飞机飞行员迷失了方向。但几几分钟内，电视新闻报道了第二架飞机撞击了双子塔。就在那时，我们意识到美国正受到攻击。\n\
  \n几分钟内，我们就到达了 FBI 战略信息与行动中心，与 FBI 局长合作，拼凑是谁在攻击我们，以及——重要的是如何防止进一步的袭击。当我们开始收集事实时，获悉第三架飞机撞击了五角大楼。第四架飞机——`United\
  \ Flight 77` 也被劫持，并正飞往华盛顿特区。指令已下达给战斗机要求将其击落；但在乘客英雄式地冲入驾驶舱并迫使飞机在宾夕法尼亚州的尚克斯维维尔坠毁后，这一指令变得不再必要。美国陷入了战争。\n\
  \n在接下来的几个小时和几天里，我们拼凑出了劫持者的身份，并得出基地组织正在执行对美国的战争宣言。袭击发生后，乔治·W·布什总统告诉司法部长：“不要让这种事情再次发生。”这成了我们的使命。\n\
  \n这场战争与之前的冲突不同。我们的敌人没有制服，不挥旗帜；他们试图以普通平民的伪装悄悄靠近。他们的武器是自制爆炸物。他们混杂在人流中。面对这些隐藏的攻击者，我们赖以警报敌方导弹或轰炸机的雷达完全毫无用处。\n\
  \n那么，该如何检测其他恐怖分子并防止他们发动攻击？我们很快得出结论，答案在于收集大量关于游客和外国人的信息，并识别出显示与恐怖网络有关的联系和行为。这意味着不仅要重新调整情报机构的重心，使其专注于探测恐怖网络的轮廓，还要获得在海量数据中检测模式的能力。\n\
  \n这种国家安全领域的范式转移，恰逢了互联网的扩张以及致力于使用数据分析进行营销的商业企业的增长。私营部门在防止进一步袭击的紧迫感驱动下，开始开发新策略，在草堆中寻找恐怖分子针。与此同时，情报部门扩大了我们的数据“草堆”，利用新的或重新开发的法律授权（包括我参与的《美国爱国者法案》）来积累有关全球资金、人员和通信流动的信息。在接下来的几年里，作为司法部刑事司司长，随后担任美国国土安全部长，我见证了扩展后的数据收集和分析作为保护我们国家及其人民工具的巨大力量。\n\
  \n意所当然的是，这些新能力开始被用于其他用途，包括商业目标。正如民用互联网是由国防部的研究成果催生的一样，用于反恐主义的数据收集和分析工具也被应用于许多商业目的。由于我见证了无处不在的监控增长，以及数据收集、存储和分析革命（许多人称之为“大数据”）的重大转折点，我敏锐地意识到数据收集和分析对社会有益的力量。我也知道这场信息采集革命将挑战美国在隐私和自由领域的传统观念和价值观。\n\
  \n随着时间的推移，我在职业和个人上都参与了引导、推动、使用以及担忧政府和尤其是私营部门不断扩张的个人数据收割。我可能比大多数人都更了解我们现在为收集而产生了多少数据。这可能是有益的。也可能非常危险。\n\
  \n由于我职业生涯的大部分时间都是律师和法官，我也注意到我们的法律规则和政策规定了这些巨大的新能力如何被部署；然而，这一法律框架大部分是在 20 世纪创建的，当时的数据格局比今天稀疏得多。作为一个希望鼓励数据革命积极影响的人，我认为我们是时候重塑规则了。当然，这场数据革命应该保护而不是损害我们的价值观。这本书旨在让感兴趣的公民了解数据生成、收集和分析革命及其的影响。我也提出了一个愿景，在保留这些发展带来的安全和经济效益的同时，不至于无意中牺牲我们的隐私、自由和公民价值。为了说明这种变化是如何迅速向我们袭来的，这里有四个假设但现实的场景——其中三个已经发生。\n\
  \n\n\n\n\n## 一\n\n一个纽约年轻人，阿兰（Alan），对激进圣战主义的意识形态产生了兴趣。在搜索互联网后，他偶然发现了一个由叙利亚某恐怖组织招募人员管理的网站。恐怖分子探测到了阿兰的兴趣，通过向他的\
  \ IP 协议（IP）地址发送电子邮件与他联系，邮件中包含了如何通过下载免费软件来实现通信匿名化的指令。他带着兴奋的心情步入了阴影之中。\n\n尽管阿兰遵循了圣战者的指示，但他开始在\
  \ Facebook 上与朋友讨论他日益加剧的激进倾向。他发布了自己留着胡子并穿着 `thobe`（许多阿拉伯国家穿着的传统长袍）的照片。他与朋友们讨论他正在形成的政治观点。他还访问了一些网站，这些网站会教导观众如何使用家用用品和在园艺商店即可购买的化学品来制造炸弹。有一次，阿兰上网寻找前往叙利亚的路线，尽管他并没有买票。阿兰的朋友本（Ben）实际上已经去过叙利亚，他多次给阿兰打电话鼓励他过去。阿兰用委婉的语言通过邮件回复，他打算在美国执行一项“天堂般”的任务。阿兰还访问了当地的园艺超市，购买的化学品数量超过了纽约市爱好园艺通常的用量。\n\
  \n阿兰并不知道，监控跨境通信（包括电话和互联网）的情报和执法官员已探测到了他与本的联系。但这些官员并没有实时拦截这两个人的通信内容。由于叙利亚是一个已知的恐怖分子活动区域，当局向一名特殊的联邦法官申请许可，以尽可能地收集有关阿兰通信的信息。联邦政府一旦可以，就想要想要传唤元数据——即带有数字或\
  \ IP 地址的电子邮件记录——以显示阿兰过去两年的联系人；联邦政府还想获得阿兰在线推文和社交媒体帖的记录，以及他的在线搜索和网站访问记录。联邦探员还强制传唤了他的信用卡记录。\n\
  \n检查这些数据揭示了阿兰几个月来的大部分在线和通信活动。同时，对这些海量数据应用分析算法，得出了阿兰不断演变的极端观点的轮廓。他曾努力前往叙利亚，一个海外恐怖热点。阿兰已与可识别的恐怖分子取得联系，并研究了炸弹制造技术。他的信用卡记录显示，化学品的积累量得人震惊，这与阿兰访问的网站上的炸弹制造说明有关。\n\
  \n探员们进一步行动。他们联系了纽约警察局（NYPD），获取了位于曼哈顿下城金融区摄像头的几个月的录像。尽管这些录像量巨大，肉眼无法审查，但具有面部识别能力的视频分析工具迅速识别出在过去的两个月里，阿兰一直在纽约联邦银行大楼附近徘徊。\n\
  \n根据这些信息，当局编写了一个有说力的掩护故事，允许一名卧底假装成暴力极端分子与阿兰结交。该探员通过表达与阿兰在网上表达过的极其相似的观点，获得了阿兰的信任。最终，阿兰向他透露了在联邦银行实施爆炸的意图。阿兰被捕了。\n\
  \n## 二\n\n布恩（Brian）和凯特（Kate）正在为他们六岁的女儿艾什莉（Ashley）挑选生日礼物。在一家商店里，他们遇到了“说话特里”（Talkie\
  \ Terry），这是一个娃娃，它倾听和回应人类语言的能力“栩栩如如，会让你的孩子有一个新朋友”。正如制造商奥尼公司（Omnicorp）所解释的那样，特里能够识别语音并将其立即无线传输到服务器，该服务器存储了对孩子提出的任何请求或陈述的数千种可能回复。此外，特里的服务器会保留一份与每个孩子过去互动的文件，因此特里可以“认识”这个孩子——特里能够提醒艾什莉过去发生过、给出建议，甚至主动对话。奥尼公司将特里推为一种学习工具。特里会鼓励孩子学习语言、做家务并欣赏道德教训。此外，父母可以通过应用程序将特里连接到他们的智能手机，这样他们就可以监控孩子在周围的活动。奥尼公司将特里推为一种学习工具。特里会鼓励孩子学习语言、做家务并欣赏道德教训。此外，父母可以通过应用程序将特里连接到他们的智能手机，这样他们就可以监控孩子在周围的活动。由于布恩将特里连接到智能手机，特里从未真正被“关闭”。\n\
  \n## 三\n\n卡尔（Carl）是一位年轻的法学教授，当然，他以警觉地保护自己的隐私为荣。卡尔没有个人社交网站，并且对推文内容非常谨慎。他不访问那些要求下载跟踪在线行为\
  \ Cookie 的网站。他使用加密邮件服务，并且没有授权服务提供商挖掘其邮件中的个人数据。卡尔认为他对允许他人访问的个人数据是谨慎的。\n\n但卡尔享受现代“智能”技术，并在无意中留下了大量的数字足迹。典型的一天从闹钟响起开始，咖啡机的无线连接开启了启动循环。卡尔检查手腕上的\
  \ Fitbit 查看睡眠情况。这些数据以及他今天走的步数和心率，将持续上传到他的智能手机。\n\n早餐时，卡尔为自己做了一顿丰盛培根鸡蛋。他使用智能冰箱更新了他的在线购物清单，加入了培根和其他用品；系统会自动向当地杂货店下单，数量接近他目前的消耗速度。\n\
  \n\n\n\n在教学了一整天后，卡尔使用智能手机为他的周度购物清单增加了项目，这份清单早些在家里冰箱面板上就开始创建了。在购物列表应用上买完物品后，他想起今晚要去当地一家酒吧参加一位同事的送欢会。卡尔将手机作为导航设备，在途中停下来喝了饮料，他的同事在派对上为卡尔拍了几张手机照片。这些照片会自动上传到同事的社交媒体账号。\n\
  \n不久后，卡尔上车回到家里。\n\n那天晚上，卡尔在他接入网络的电视机上看新闻和一档政治讽刺节目。当卡尔进入房间时，高清电视会自动开启，并可以根据他的观看偏好“建议”观看选项。服务提供商还可以记录卡尔进入或离开房间的时刻，甚至是他的注意力从屏幕转移到房间内其他地方。此外，电视发出的超高频声波（人类无法听到的频率）会自动将卡尔的智能手机与电视配对，记录下卡尔在手机上搜索电视上刚刚广告过的商品。新的分析软件实际上允许服务提供商根据智能手机捕捉到的微小眼动（这些眼动与积极或消极反应相关）来判断卡尔是否喜欢或不喜欢正在看的内容。\n\
  \n卡尔的健康保险公司后来提高了保费，因为他的饮食、饮酒、运动和睡眠模式本更健康。保险公司建议改变饮食和增加运动将触发一种特殊的“健康生活”折扣，从而降低他的费率。这被呈现为一种减少疾病的积极“助推”。他的汽车保险公司也告诉卡尔，他的费率将上涨，因为他的驾驶风格反复无常，而且通过社交媒体显示，他在开车前曾与饮酒场所有关。商业营销人员根据从他的“数字废料”流中建立的偏好向卡尔发送广告材料。竞选活动专家根据对卡尔对新闻事件和政治评论反应的行为分析，向他投放广告。\n\
  \n卡尔故事中的所有功能目前都存在。进取保险（Progressive Insurance）“奖励”那些在汽车内安装监控设备的司机。一家雇主会对追踪设备记录的每晚睡眠七小时的员工发放奖金。眼动追踪技术目前正在视频系统中试点。\n\
  \n### 四号\n詹姆斯睁开了眼睛，将思绪从睡梦中挣脱。他又一次在凌晨 5:43 醒来。詹姆斯总是这样。监控器从不让他赖在床上。他有时在想，21 世纪初的“闹钟功能”会是什么样的。他从未经历过那种事，但在几部老电影里见过。在现代\
  \ 2084 年，上个世纪的观念不再被认为具有相关性，大多数媒体已经被销毁了。\n\n詹姆斯没有这种奢侈。在最佳唤醒时间，已经感知到他睡眠阶段的监控器开始播放声音以产生唤醒。可听的部分应该是令人放松的。詹姆斯选择了海浪声，这让他想起在科德角角的童年时光。几乎听不见的部分与他的潜意识接触，导致他的身体无论主观如何都会开始醒来。\n\
  \n今天他很快起床了。（注：原文中存在大量重复段落，此处已根据提供的唯一内容进行翻译。）\n\n\n\n詹姆斯从白日梦中回过神来。他不确定是否能将他杂乱的思绪拼凑成一条连贯的线，但他丝毫不怀疑自己正被监视。由于不确定哪些想法会触发报警报警，詹姆斯发现只关注眼前的任务更为简单。朋友是一种分心，而他总是会忍不住在想，他们中哪一个可能是特工。詹姆斯开始思考“现实究竟是什么”，而不再仅仅纠结于“可能是什么”。\n\
  \n## 数据收集与分析的影响\n\n之前的每一个场景都展示了通用数据收集与分析对当今或不不远的未来中人们所产生的革命性影响。前三个场景基于现有技术；第四个是对这些技术可能导致的结果的戏剧化描述。如果第四种场景看起来很遥不可及，请考虑一下已经上市或正在开发的事物的组合：面部识别、自动驾驶汽车、许多城市无处不在的闭路电视，以及某些公司俯瞰工作站的鸟瞰摄像头和（目前是）自愿植入员工的微芯片。当然，使用其中任何一种设备的效果可能是好也可能是坏。遗憾的是，政府政策制定者、法官和普通消费者往往对大数据革命的后果了解甚浅。\n\
  \n## 信息共享的加速\n\n今天，大数据收集的影响比以往任何时候都发生得更快。信息共享让新技术以越来越快的速度被创造。为安全设计并被政府列为机密的技术现在迅速进入普通消费者的手中。增强营销工具的商业驱动力也推动了收集和利用数据能力的持续创新。由于今天的信息和网络拥有如此多的连接点，防止信息泄露变得越来越困难。信息并不会轻易消失——它会留存。总而言之，现代信息技术的这些特征加速了思想和我们个人信息的传播。\n\
  \n然而，作为一种无意的副产品，日益增长的互联性极大地增加了对我们安全和隐私的威胁。无线连接设备（通常是移动设备）的泛滥扩大了网络入口的面积，黑客可以通过这些入口渗透进我们的信息和通信网络。同样，政府和公司对我们个人数据的集中收集，意味着黑客更容易在大规模范围内窃取这些数据。因此，请考虑以下近期的网络数据威胁：信贷机构\
  \ `Equifax` 丢失了涉及 1.43 亿美国人的数据；`Yahoo` 有 30 亿用户账户遭到破解；而政府的人力资源机构 `U.S. Office of\
  \ Personnel Management` 超过 2500 万员工和申请者的高度敏感安全文件被盗，或许是某个外国国家所为。\n\n## 社会适应与社会契约\n\
  \n历史确实表明技术变革会带来社会和规范的改变，使社会得以适应。因此，汽车的发展导致了安全要求的采纳和交通模式的监管。因为在现代民主国家中，人们最终定义了决定或限制其行为的规则——即社会契约——所以规则必须调整以满足时代需求。但新技术并不总是适应现有的社会结构。试图将其强行推入过时的法律体系甚至可能破坏该系统。最终，人们通过要求规则发生根本性变化来做出反应。选民官员、行政人员和法院的任务就是识别发生变化的情况，然后重构法律和政策标准。\n\
  \n随着社会契约的重新谈判，回归基本原则和价值观是必要的。跳出过时的范式和自动化的法律分类，我们必须重新确定我们的核心和社会伦理价值观是什么。什么正处于危险之中，什么需要保护？通常自由、安全、言论和结社自由以及独立的宪原则必须相互权衡，可能还需要将社会利益与个人的权利和利益进行平衡。\n\
  \n## 重新定义隐私\n\n大数据能力的起往往从隐私丧失的角度受到批评。但当技术收集、编目并利用数据时（其中许多数据是人们自愿提交的），或者在开放的公共空间收集数据时，隐私这个概念就太狭窄了，无法反映可能面临的风险。\n\
  \n真正面临危险的是影响我们价值观和命运的个人选择的自由。人可能会被多种方式操纵和胁迫，但最令人不安的是持续监控我们行为所带来的压力。父母不仅通过教导我们来塑造行为，还通过他们的榜样。他们希望在孩子心中植立坚强的价值观体系的同时，也希望孩子能获得新的机会、思想和经历来塑造他们。随着年龄增长，我们拥有越来越多的机会去选择自己的方式并探索新思想。\n\
  \n当我们失去对自身信息——我们的行为、信仰、关系甚至是缺点和错误——的控制时，这种自由可能会被破坏。\n\n## 现代分析的力量\n\n现代分析工具具有形成几乎任何个人活动详细图谱的潜力。今天要“退出”数据流变得极其困难。现代生活作为我们所享受的便利服务的必要组成部分产生数据。今天收集的信息必然比过去收集的更广泛；持续时间更长；用途也更多。但那些收集和汇总这些数据的人拥有更大的力量来影响甚至胁迫我们的行为——可能通过社会羞辱以及财务激励和惩罚。\n\
  \n今天数据的爆炸被正化为促进健康的生活方式、便利的营销甚至是更轻松、更有知情的政治参与。但无处不在的监控是压迫的经典工具，正如乔治·奥威尔《1984》中的老大哥那样，他时刻在监视。我们是否正处于将这种压迫性监控引入自己生活的边缘，尽管它正披着“为了我们好”而看护我们的“大妈”这种看似伪善的外装？\n\
  \n\n\n\n# 有一点应当明确。虽然人们习惯于将现代大数据的发展归因于互联网，但这种观点过于简单。这些发展源于我们收集、存储、传输和分析数据方式的改变，以及数字传输与调节物理世界的控制系统运行之间相互作用的变化。正如我将描述的那样，多种因素的汇聚推动了这些变化。无疑，互联网的创造是之一，其动力源于对灵活通信系统的需求，这种系统能够抵抗自然或人为对常规通信方式的破坏。数据收集和分析的其他进步源于一种新的国家安全环境，在这种环境中，威胁不再是国家，而是唯有通过监控全球人员、资金和通信的移动才能检测并阻止的在线敌人。更深层次的是，数据已成为目标营销的价值工具，以及降低商业交易执行成本的手段。简而言之，数据革命驱动了并反过来推动了全球经济的转型扩张。\n\
  \n然而，数据使用领域的这些革命性变化远快于我们的法律和政策架构。我们希望建立道路规则，以平衡安全、隐私、自主、经济增长和便利之间竞争性的需求。但正如安全专家布鲁斯·施尼尔（Bruce\
  \ Schneier）所观察到的，我们的法律体系适应技术变化可能非常缓慢。正如我在这里概述的，，我们不应该试图将新技术强入现有的过时法律学说的“普罗克鲁斯床”中。我们需要回归本质：对我们想要保护的价值建立清晰的认识，大数据带来了哪些挑战，以及我们的法律体系如何演进以应对这些挑战。\n\
  \n## 数据收集的历史背景\n\n为了给这项努力提供背景，值得回顾的是，历史上我们在面对技术颠覆时，已经意识到重构法律政策的必要性。我们实际上处于监控和数据（或信息）收集史上三个转型中的第三。我将这些时期称为\
  \ `Data 1.0`、`Data 2.0` 和 `Data 3.0`。\n\n### Data 1.0\n`Data 1.0` 指的是在自动记录设备（如相机、电话和录音机）发明之前收集信息的时期。在文字发明后，记录仅限于手写或打印的笔记、图画。这些是对面对面互动中看到或听到的观察，或者是从另一份手写记录中读到的。这些材料的可靠性取决于传播者在脑中记录并传输它们的能力，无论是通过告诉他人还是通过写下来。\n\
  \n但数据处理的第一次转型随着印刷机的发明而到来。这使得信息的广泛传播成为可能，并在在图书馆中存储著作的能力。尽管如此，书面信息的保留、传播和可用性仍受到存储空间、复制能力和通信模式的限制。\n\
  \n### Data 2.0\n`Data 2.0` 指的是 19 世纪摄影和电话发明后的时期。摄影允许通过复制的图像对事件进行更优的回忆。随着视频的出现，更全面的视觉记录随之而来。电话使得更远距离的通信变得更加快速。但电话和麦克风也允许通过窃听和电子监控设备（或“窃听器”）从远程更深地接触个人生活。这些技术让生活变得方便，但同时也开启了新的监控手段。正如我将解释的，在斗争之后，我们管理这些新数据技术的法律需要演进，以便在这些价值之间取得平衡。\n\
  \n### Data 3.0\n`Data 3.0` 是今天日益数字化的世界。自 21 世纪开始，照片不再记录在胶片上，而是以信息字节的形式记录，这些字节可以无限存储、轻松复制，并随时通过计算机和智能手机在全球范围内传输。随着数据存储内存系统的改进，越来越多的数据被捕获和存储。\n\
  \n`Data 3.0` 的另一个特征是数据分析的出现——使用计算机软件检查海量数据，得出人类无法独立得出的结论。数据挖掘提供了许多益处，同时也引发了有害的用途。所有这些可用数据都伴随着社会后果。我们必须学会管理这些数据，以便在保护个人的同时，让整个社会获益。\n\
  \n\n这不太可能是我们处理数据方式演进的最后一个章节。我们可以想象一个 `Data 4.0`——现代机器人和人工智能已经预示了这一时期——在那个时代，人类体内嵌入的软件创造了真正的半人人：人机混合体。迈向这一愿景的初期可以在无线连接的植入医疗设备（如胰岛素泵和起搏器）的普及中看到，以及用于康复神经系统或其他医学缺陷的计算机驱动肢体也是如此。\n\
  \n\n在思考法律如何演进以及应该如何演进时，明确我们想要保护和重新平衡的价值至关重要。正如我将在书中后后部分描述的样，在 `Data 1.0` 的世界里，法律通过财产权主要保护物理空间的隐私利益。在美国宪法签署时，规则是在私有物理空间内进行搜索和查押需要司法许可。当\
  \ `Data 2.0` 来临时，电报和电话等技术缩短了空间间的物理距离。法律进行了调整，以保护个人对话的隐私利益，即使在公共电话线上的截听也需要搜查证。\n\n\
  \n\n\n\n这些原则——法治的本质——正受到侵蚀。个人数据的普及使得任何数据持有者（官方或私人）都能利用心理操纵、羞辱以及财务激励和惩罚来影响并可能强制人类行为的几乎每一个方面：我们看什么、看到、吃什么；我们的行为如何；以及我们与谁交往。当政府能够完全访问你的个人信息时，其权威的实际触及几乎是无限的，超越了对官方权力的正式宪法或法律限制。同样令人担忧的是，对这些数据的不受限制访问可以允许私营企业或团体在没有任何公共问责的情况下，对个人行为施加压力、操纵或激励。正如日益严重的网络暴凌现象所示，与我们没有联系的社区如果不喜欢我们的政治甚至审美观点，他们可以使用关于我们的数据来对我们进行报复或骚扰。\n\
  \n为了保留合法个人选择的空间，意味着我们必须对自己的数据——我们的肖像、我们所做的事情、我们的思维过程和决策——拥有重大的控制权。一个我们每一步行动都会影响汽车保险或营销，或者允许政府预测和监管我们行为的世界，将对我们的信仰自由、人际关系和行动构成实质性的限制。从本质上说，这意味着我们将被程序化。我们正朝着那个方向移动。\n\
  \n我们一直担心“老大哥”可能会闯入我们的家，并在他的监视下强迫服从。但“老大哥”不需要破门而入。我们正在铺红毯欢迎他的到来。而且，“老大哥”不仅是指政府，还有外国、组织犯罪分子，甚至是私营公司。事实上，当我们不断地记录彼此时，我们变成了“小弟和小妹”。\n\
  \n从根本上说，人们应该意识到他们的数据是如何被处理的，并应该对如何处理这些数据做出选择。换句话说，对我们生活方式的保护必须超越隐藏我们数据的权利，进入更广泛的控制我们数据的权利，即使在隐藏或私下维护这些数据在技术上已变得不可不可。除非我们审视新的数字环境及其后果，否则我们可能会以便利之名失去不仅是隐私，还有自由和自主权。\n\
  \n# 第一章\n\n# 什么是互联网？它是如何改变数据的？\n\n## 连接\n\n发送电子消息的方法自 19 世纪初起就以电报的形式存在（这是第一台“短信”机器！）。人类使用摩尔斯码通过线路连接传输电子脉冲进行通信。随着时间的推移，电报机得到了改进，允许消息自动并发送到世界各地。随后电话发明，使得口头对话得以传输。\n\
  \n随着 1876 年第一部实用电话的出现，人们对扩展这项便利技术的兴趣随之增加。美国电话电报公司（AT&T）于 1885 年成立。纽约与芝加哥之间的电话服务于\
  \ 1892 年开始。技术的发展在 1915 年实现了跨洲电话服务。\n\n电话系统基于模拟信号。这需要电信号发生变化，以便在沿导体传输时携带声音重现。最初的“网络”完全由电信行业所有，由分布在人口中心之间的绝缘铜线长连接组成。人工操作员沿线路建立连接。在该系统中拨电话，必须在拨号者和接听者之间保持不中断的连接，这导致了拨“长途”电话的高昂价格。\n\
  \n将大量信息分解成小的“数据包”进行发送的想法，由美国和英国的研究人员在 20 世纪 60 年代提出。这个简单而创新的想法是将数据分解为数字格式——“1”和“0”的块，将给定消息中的单词转换为“数据报文”，每个数据报文都被单独标记标签以指示信息的来源和目的地，就像单独的数据明片一样。发送大消息不再需要端点之间建立持续连接。这些数据报文可以通过任何数量互连的通信路由电子发送，并在所有报文到达后在目的地进行组装。\n\
  \n20 世纪 60 年代后期，使用数据包的概念在封闭研究中心的内部网络中得到了证实（第一个是在加利福尼亚州的劳伦斯·利弗莫国家实验室，那是一个核武器研究中心）。20\
  \ 世纪 60 年代末，一个相对未知的政府机构高级研究计划署（ARPA）开始研究将任何计算机网络通用连接到另一个网络的方法。ARPA 的合同寻求开发一种通用系统，连接四个地点的学术计算机：加利福尼亚大学洛洛矶矶分校（UCLA）、斯坦福研究所（SRI）、加利福尼亚大学圣塔芭芭拉分校（UCSB）和犹他大学。由于以前从未实现过，这项挑战包括创建该系统以及允许各种类型数据包网络互连的协议。ARPA\
  \ 启动的系统导致了计算机间通信标准的建立。\n\n如今的互联网仍然基于相对简单的概念，即将数据分解为单个单独的数据包（1 和 0 的集合），并带有一个“标签”指示它们应该去哪里。这些数据包然后被投进“互联网”中，并通过称为\
  \ `routers` 的设备通过许多路径中的一条路径进行传输。它们“读取”标签并引导数据包通过通往预期目的地的路线。一旦消息到达预期目的地，它就会等待被重新组装成数据集或消息。\n\
  \n换句话说：消息被分解成小的、单独标记并标明地址的数据包。这种信息的拆分是由创建消息的计算机应用程序（如网络浏览器或电子邮件程序）完成的。单个数据包被标记了信息，帮助它们找到离开计算机的方法（使用哪扇门或“端口”）以及在开放网络上的目的地（一组帮助指向互联网上地址的数字）。\n\
  \n互联网的设计对于其所引导的数据类型是中立的。它可以使用任何可用路径发送其数据包。如果由于某种原因某条路径停止工作，数据包可以通过其他路径移动。网络只需将数据包传递到目标位置。只有当数据包到达目的地并重新组装时，所传达的信息才具有意义。在国防当局担心在战争期间维持通信线路能力的时代，这种多条传输路径的元素——互联网的韧性——是一个基本美德。\n\
  \n互联网还设计为与硬件无关。只要符合正确的通信标准，就可以使用任何类型的硬件。这种架构的优之处在于，许多不同类型的计算机可以可以使用不同的软件和工具连接在一起。\n\
  \n互联网是无边界的。数据在路径存在的地方移动，而不考虑法律边界或规则。正如我们所看到的，这一特征破坏了主权和管辖的传统法律概念。\n\n\n\n\n\n为了更好地理解其运行机制，可以将互联网网络通信想象为发送消息所经历的不同步骤。对这些步骤进行分类的最常用方法是开放系统互连（OSI）七层模型^(3)和互联网工程任务组（IETF）四层模型.^(4)\
  \ 在定义数据位在互联网上处理和收集传输的过程中发生什么，OSI 模型实际上比 IETF 模型更具体。但为了说明在互联网上共享信息的过程，这里对简单的四层 IETF\
  \ 模型进行了简单描述，它由应用层、传输层、网络层和链路层以及相关的物理层组成。\n\n## 应用层\n\n所有互联网应用程序（或“应用”）创建的数据首先在应用层进行处理。在这里，任何互联网数据的组装、发送或接收的内容对人类来说是有意义的。在应用层内部，这些数据可以通信到同一“主机”或计算机上的其他应用程序。使用网页浏览器运行`超文本传输协议`（`HTTP`）——用于维护万维网地址的统一系统——就是应用层的一个示例。\n\
  \n在这一层，数据位被组装并呈现给设备操作员。在这里，这些位变成了可读的消息、可见的图片和视频，或者你的银行账户余额的视觉呈现。\n\n## 传输层\n\n在传输层内部，创建了一个数据交换通道。数据被封装以便在局域网内进行传输（并非在“互联网”本身，而是在本地管理的网络内）。使用特定的传输协议（或标准通信技术）来启动通信、控制数据流，并允许数据分段并发送到由所有通过线或无线连接的网络组成的更广泛的互联网。数据在接收时重新组装。这些协议将数据作为局域网内的消息进行路由和发送。\n\
  \n## 网络层\n\n网络层是将数据分类到不同目的地。不同网络之间的通信通过使用互联网地址——技术上称为`网协议`（`IP`）地址来实现。将它们想象成互联网的精确邮政编码，描述了数据包的目的。\n\
  \n路由的魔力使消息能够向其最终目的地发送。路由可以比作站在路口中间的交警。除非汽车正到达该社区的最终目的地，否则交警对路过的车辆漠不关心。警官对车辆内的乘客也不在意。交警的工作仅仅是让交通以组织化的流动。网络层的交通控制也是如此。如果在每个路口（或节点）上有一条消息正试图通过互联网，本地`路由器`的工作就是将其传递到下一个路口，并期望它最终能到达预定目的地，并被巡逻该路口的交警标记以便收集。数据包可能必须穿过互联网中的多个路口才能到达那里，但它可能会最终通过其预期的路口，并被拉入本地网络以向应用层处理。\n\
  \n## 链路层\n\n链路层确保从网络层发送给它的数据包能够无错误地传递。这可以被比作邮局的职员。为了发送挂号信，链路层确保信件地址填写正确。在发送到互联网之前，链路层会向数据中添加信息。\n\
  \n## 物理层\n\n物理层是 IETF 四层模型的一部分。虽然人们经常将网络空间描述为“虚拟”，但互联网实际上存在于物理空间。它由`电缆`、`连接器`、`服务器`等组成。随着时间的推移，基础设施已经进化到传输更多的数据。这些基础设施仍然是赖以生存的不可缺的基础。不奇怪的是，国家在寻求维护主权时，往往将重点放在控制物理层。\n\
  \n## 信任是事后考虑\n\n原始互联网的一个关键特性（或缺陷）是信任是一个事后考虑。这个新系统的设计初衷并不是为了安全，因为不需要。发明者们彼此认识，并信任自己会将该系统用于适当的目的。而且由于最初用户数量很少，滥用行为可以很容易被根除，让违规者感到羞愧并改变行为。\n\
  \n早期互联网中这种信任假设的副产品是对用户身份识别采取的随意方法。作为一种生态系统，互联网的入场券仅仅是一个`IP 地址`。虽然个人网站可能要求密码或其他形式的个人身份识别，但互联网本身并不需要。因此，任何用户都可以互联网上自由漫游，进入任何网站。\n\
  \n建立在假设信任的基础系统既有优点也有缺点。由于其开放且可用的架构，互联网能够迅速发展。任何想要访问的组都可以在本地建立连接。这与`贝尔（Ma Bell）`系统形成了鲜明对比，在该系统中，网络的所有部分（包括电话）都由电话公司拥有。另一个优势是许多不同类型的系统可以相互通信。消息不再依赖于单一的端到端连接（如跨大西洋`电缆`）；相反，数据包的共享只需要一个连接。\n\
  \n但也有一个缺点：信任可以被利用。20 世纪 80 年代中期，第一批互联网域名被注册。这些名称使用易记的文本短语指向控制计算机网络地址的底层数字。直到 1995\
  \ 年，尽管形式上受政府控制，所有新域名（如`google.com`）都是由互联网的技术创建者免费添加的。随着系统的增长，它被误用的机会也随之增加。\n\n2004\
  \ 年，`John Zuccarini` 被判处 30 个月监禁，其中原因之一是使用 `www.bobthebuilder.com` 域名误导儿童进入色情网站.^(5)\
  \ 这导致了美国政府颁布法律，试图确保域名既不虚假也不误导。\n\n\n\n\n\n互联网也并非不可欺骗。1988 年，康奈尔大学的学生罗伯特·塔潘·莫里斯（Robert\
  \ Tappan Morris）发布了一系列代码，感染了整个网上数百台计算机。这种所谓的“蠕虫”通过利用软件漏洞和弱密码，嵌入到了许多计算机中。该蠕虫在计算机系统上运行时，会减慢机器的处理速度，特别是当系统被感染多次时。数百台机器崩溃并变得无法使用，直到它们被消毒为止。莫里斯蠕虫攻击仅仅是现在全球定期报告的数以百万计的拒绝服务攻击、蠕虫攻击和病毒攻击的序曲。\n\
  \n## 无线化\n\n早期的互联网通信需要发送者和接收者通过电话链路进入网络，这种链路连接到线路或电缆基础设施，就像固定电话一样。随着无线基础设施的扩张，互联网发生了深刻的变化。通信者现在摆脱了线缆的物理限制，不再需要连接到电话或类似的固定基础设施。\n\
  \n无线访问指数级地增加了可连接到网络的终端数量，并提高了移动网络的前景。这一发展不仅让用户能够从许多地点访问互联网数据，更重要的是，它让设备从几乎任何地方自主生成数据并将其发送到网络进行存储和使用的可能性成为现实。在这里，我们瞥见了“老大哥”从帘子后窥窥。\n\
  \n无线共享信息的能力最初非常新奇。将笔记本电脑从家庭办公室带到厨房桌并继续连接互联网的能力是非常方便的。\n\n电信公司下决心将互联网引入移动电话。手机手机最初的设计仅用于允许数字语音和基础文本数据传输。因此，最初的数字手机网络在努力确保全国范围内的语音连接时，经常会丢失连接。竞争者通过声称减少掉线次数来争夺客户。\n\
  \n当移动运营商设计出允许数据更快速传播的网络时，革命开始了。第三代（`3G`）以及后的第四代（`4G`）网络的创建，是为了共享更多的数字信息。网络增加了数据编码并添加了多条天线路径，以确保每位消费者都能可靠地访问快速数字数据。突然之间，你在工作或学校的\
  \ PC 上流媒体的音乐可以在回家的路上继续播放。你可以查阅刚才在 PC 上看过的网站，以满足你对刚读内容日益增长的好奇心。你可以在超市排队时看流媒体电影或查看你喜欢的社交媒体网站。如果你发现自己迷路了，不仅可以调出地图，手机的\
  \ `GPS` 还能逐步引导你到达目的地。\n\n无线访问的扩张为将“笨”设备变为“智能”设备打开了大门。在个人没有任何意识行为的情况下，手机、汽车、电器和医疗植入物就可以连接并发送接收数据。这大大扩大了可以采集的数据量，正如我们将看到的，这些数据可以被整合和分析。\n\
  \n能力的提升正渗透到社会的每个角落。2009 年，蜂窝网络中文本宽带数据的网络流量首次超过了语音数据。在 2015 年期间，`4G` 高速数据的网络流量超过了\
  \ `3G`。2015 年，总数据流量增长了 74%，每月高达 3.7 艾字节（exabytes）。（一个典型的电脑硬盘容量约为 1 太字节（terabyte）。一个艾字节是一百万万太字节。所以，如果你想存储每月移动网络的所有流量，你需要\
  \ 370 万块每块 1 太字节的硬盘。）\n\n\n意料之中，数据的海量扩张引发了人们如何利用数据的问题。这与数据存储容量和芯片存储容量的增长相契合，允许存储日益增长的数据。这两项发展都将互联网从一种在网络间通信现有数据的方法，转变为公共或私有实体可以在其平台上指数级地增加从物理世界收集、处理并存储以供未来参考的数据。\n\
  \n移动设备的爆炸又增加了一层采集能力，不仅包括设备本身产生的数据，还包括设备操作者输入的图片或通信内容。例如，与互联网的无线连接创建了有效地将各种物理传感器（如\
  \ `GPS` 设备）与摄像头、车牌读取器以及信用卡和借记卡交易记录器连接起来的能力。\n\n如果没有数据存储容量的同步爆炸，数据爆炸将在婴儿期夭折。其中一部分是摩登定律的产物：英特尔联合创始人戈登·摩尔（Gordon\
  \ Moore）观察到，集成电路的处理能力可能每两年翻一倍。这种翻倍导致了单个芯片存储容量的稳定增长。同样重要的是“云”的发展，它并不是字面上的数据在空中重新定位。云实际上是一组互连的计算机服务器和软件，作为高效存储和处理来自多个源数据的手段。该软件分配处理能力和存储容量，以最有效的方式处理数据。如果没有可用处理存储容量的剧增，人们能够采集或想要采集的数据将受到自然限制。有了几乎无限的存储空间，人们与采集设备交互产生的所有“数字废料”都可以以较低的成本被捕获并无限保留。\n\
  \n内存存储的增长大致与摩登定律同步。电脑硬盘本身的存储容量也大约每两年翻一倍。然而，内存的成本下降得更快。每兆字节存储的价格每 14 个月减半一次。`IBM`\
  \ 在 1980 年推出了第一块吉字节大小的硬盘。它有冰箱一样大，花费 40,000 美元。截至 2016 年初，一个太字节大小的硬盘购买价格大约为 50 美元。在过去的\
  \ 35 年里，我们能够以 80 万分之一的成本购买到多 1000 倍的内存！\n\n如果没有处理和利用这些数据的能力，大容量存储本身将几乎没有吸引力。这需要比人类分析更快的速度来识别、搜索和解释存储信息。关于位置、财务交易和在线活动的数据在孤立时几乎没有价值，但通过排序和分析，它们可以产生关于用户偏好和活动的丰富图景。\n\
  \n视频监控器和馈流的扩张还导致了用于编目、搜索和关联非结构化数据的软件工具的发展。例如，这些工具允许调查人员通过调取视频记录搜索特定时间和地点的事件。但更具价值的是在广泛的时间和范围内进行搜索。这引发了对面部识别和行为识别软件的需求，这种软件可以在大型视频数据库中搜索特定人物或特定行为。\n\
  \n\n\n\n讽刺的是，这些分析工具的发展也增加了犯罪行为的动机，因为滥用大量数据的潜力也随之扩大了。例如，2015 年据披露，美国人事管理局存储的数百万联邦员工和申请人文件被黑客入侵并盗取。有人理论认为，某个国家寻求这些记录是为了建立一个情报和反情报的数据库。然而，很明确的是，数百万被盗的人员文件包含的数据量太大，人类无法凭人工对其进行审查、检索和分类。因此，除非这堆被盗文件能被高效地分类，并根据黑客感兴趣的特征提取信息，否则它们将是毫无用处的。然而，日益复杂的分析能力使得大型个人信息数据库对具有犯罪或间谍目标的黑客来说更具吸引力。\n\
  \n\n数据收集、传输、存储和分析领域的这些发展正在改变我们的经济和社会行为。数据架构的快速根本性变化使得能够活动在线执行：\n\n\n\n根据美国人口调查局的数据，2016\
  \ 年美国电子商务销售额约为 4000 亿美元，几乎占零售总额的 10%。在金融领域，网上银行是一项广泛使用的服务。(13)截至 2014 年，87%的美国人拥有手机，其中\
  \ 61%是智能手机。(14)调查显示，51%的美国人进行网上银行，32%的人使用手机进行银行服务。(15)移动银行用户可以使用手机查询余额或近期交易、转账并存入支票。2012\
  \ 年，银行网站和移动银行应用程序处理了 25 亿笔账单支付交易。(16)\n\n但除了交易数量之外，互联网从根本上实现了新类型市场的创建。通过降低交易成本和扩张成本，互联网允许在大范围内快速创建大量新公司；亚马逊、谷歌和脸书都是非常晚生的科技巨头。互联网还实现了个性化商品和服务；例如，互联网广告根据过去的购买记录或浏览历史推荐产品。而且，互联网促进了快速创新——新产品、支付系统和定价机制增长迅速，因为公司可以与在线消费者进行对照实验并几乎瞬时比较结果。(17)\n\
  \n共享经济——松散定义为点对点贷款或协作消费——帮助人们通过直接在互联网上出租床、汽车、运动设备、正装或宠物寄养服务来利用空闲产能。(18)Airbnb 帮助房主将空房与游客匹配，平均每晚有\
  \ 42.5 万人入住，每年 1.55 亿人。(19)共享出行应用 Uber 在数百个城市运营。在线音乐平台 Spotify 允许订阅者无需拥有歌曲即可听音乐。从交易衣服到交换玩具到租赁汽车，数据\
  \ 3.0 改变了我们的经济生活。同时，点对点经济挑战了监管劳动法甚至反歧视原则的传统法律。例如，最近有人投诉某些对点住宿网站上的房主拒绝向少数族裔出租。(20)\n\
  \n数据 3.0 还实现了高效的众包。维基百科就是一个例子——利用世界各地人们的想法、时间和精力来开发和记录知识。通过 Kickstarter，有 1100 万人支持了艺术家、音乐家和其他创造者的倡议，承诺金额达\
  \ 23 亿美元，实现了超过 10 万个项目。(21)即使美国国税局（IRS）也发起了一项众包挑战，以开发能够组织……\n\n\n随着世界全面数字化和在线化，自动收集的信息量变得惊人。零售巨头沃尔玛处理超过\
  \ 100 万笔交易。(23)每一笔交易都被下载为 2.5 拍字节（相当于 2500 块普通硬盘）。(24)\n\n这种扩张的动力是数据的创建和存储成本很低。根据硬盘制造商希捷科技（Seagate\
  \ Technology）的数据，2013 年生成的数字数据总量约为 3.5 泽塔字节（即 3,500,000,000,000,000,000,000,000,000,000,000,000，等等——或者相当于\
  \ 340 亿部手机的大小）。估计到 2020 年，我们每年将产生 44 泽塔字节。(25)\n\n\n但正如之前提到的，不可用的数据就是垃圾。除非能转化为有用的东西，否则它们会变得越来越混乱、越来越难以处理。随着越来越多数据的存储，数据分析的新科学——包括存储、搜索和分析信息的高效方法——已应运而生。我们正处于数据分析革命之中，理解大型数据集并从中提取有用信息的方法和工具正在出现。用于智能分析数据的算法正在不断被发明和改进。\n\
  \n数据分析工具被用于成千上万不同的用途。公司利用自学习算法在在线对话中匹配债务人和债权人，通过评估数据来改进催收流程。(26)企业高管的决策正受到数据驱动结果的增强。2016\
  \ 年《哈佛商业评论》的一篇文章将此称为从“疯狂男人”（Mad Men）到“数学男人”（Math Men）的文化转变，其中决策越来越多地基于数据，而非高管们经常错误的意见。(27)可能最有意义的是，数据收集和分析驱动了针对性广告和营销，无论是商业企业还是政治意识形态活动人士。这些新工具并非没有缺陷，必须与已知的“真相”进行比较才能具有真正的价值。例如，已关闭的谷歌流感趋势（Google\
  \ Flu Trends）网站曾长期被誉为大数据分析价值的典范。该网站利用个人谷歌搜索数据来预测各州每年流感病例的严重程度。\n\n然而，这些预测是有缺陷的，高估了实际患病病例。它们更有可能是在“预测冬季，而不是流感”。(28)\n\
  \n\n\n\n电子控制系统的能力已经存在几十年了。可编程逻辑控制器（PLC）正如其名称所示：是可以被编程以电子方式控制其他设备的设备。PLC 可以打开管道系统中的阀门、启用和禁用电源开关，并运行液压系统以及任何可以想象的自动化设备。\n\
  \n监视控制与数据采集（SCADA）系统是电子监控设备与 PLC 结合的产物。它们相互连接以运行整个系统，例如工厂或电网。这些系统通常控制着各种工业制造流程——水处理厂、能源输电系统以及供暖、通风和空调系统——这些系统使我们的现代生活得以实现。它们确保了电力生产与传输之间的微妙平衡得以维持。它们进行校准，以确保汽油生产厂的压力和流量保持在安全范围内，并达到最佳输出水平。随着互联网的增长，连接到它的\
  \ SCADA 系统也随之增加。这种便利性允许工程师远程管理和检查系统。\n\n但 SCADA 系统是脆弱的。它们的设计之初从未打算连接到全球通信网络。相反，它们是为闭环环境设计的，只有现场技术人员才能访问。而且正如之前观察到的，互联网的设计是用户是已知且受信赖的。这意味着这些系统的安全性是一个事后考虑的问题。它们往往很容易被黑客攻击，并不是因为设计糟糕，而是因为它们被用在了预设环境之外。\n\
  \n此外，无线带宽的急剧扩大和计算机芯片处理能力的提高，使社会处于互联网控制的物理系统急剧扩张的边缘。“物联网”涵盖了连接和引导几乎任何种机械系统的能力，无论是汽车、医疗、住宅还是关键基础设施。像冰箱、报警器和恒温器等家用电器现在正相互连接，或者远程连接到人类或计算机。调节这些不同的系统可以非常方便，甚至是经济的，例如智能电网管理用电量的情况。\n\
  \n但是，正如我们将看到的那样，不安全的设备可能会产生宽广的攻击面（即许多入口点），从而导致破坏性甚至是致命的在线攻击。\n\n\n网页远非仅限于那些易于搜索的内容。互联网不仅包含可搜索的数据，还包含大量数据，只有知道其地址或拥有访问权限的人才能访问。这就是所谓的深网，它无法通过传统的搜索引擎进行快速检索，也无法通过标准浏览器访问。深网包括仅通过应用程序接口（API）访问的网站数据，以及即时消息数据和文件共享服务。深网还包括私人或学术数据库。在某些情况下，深网包含了搜索引擎无法索引或找不到的数据，因为它们受密码保护或需要特殊软件才能访问。\n\
  \n深网是庞大的。根据未来主义者马克·古德曼（Marc Goodman）的说法，Google 能够搜索和检索的网络信息不到 1%。^(29) 根据一些研究人员的，深网是表面网的\
  \ 4000 到 5000 倍，占了互联网流量的 90%。\n\n深网的大部分是无害的。这包括由企业或学术机构运营的私控制网站，以及一些社交媒体网站和文件共享服务。但深网的一小部分是所谓的暗网，可以通过特殊浏览器访问，并可能需要密码。在暗网上，人们可能会发现各种非法活动。它利用了许多活动通过\
  \ `Tor` 匿名进行的这一事实。\n\n`the Onion Router`（洋葱路由），缩写为 `Tor`，最初是为了不同的目的而开发的。海军实验室（`NRL`）在\
  \ 21 世纪初开发了它，旨在为海外人员提供匿名性。^(30) 该系统无法确定最初请求网站的 IP 地址。为了确保用户的匿名性，`NRL` 于 2003 年 10\
  \ 月将其作为面向公众的免费开源浏览器部署。^(31)\n\n`Tor` 匿名背后的机制实际上相当简单。该系统通过通过至少随机选择的计算机（称为中继）发送网站请求来工作。^(32)\
  \ 每台计算机都会向信号添加一层加密——就像洋葱的层一样——只有它自己可以解密。随后随后离开名为 `exit relay`（出口中继）的计算机，接收者感知到请求源于那里。^(33)\
  \ 这使得用户处于匿名状态，因为出口中继可能会代表不同的用户发出请求，并且随机算法决定使用哪个出口中继。全球有约 7,000 台志愿者计算机作为中继。^(34)\n\
  \n需要注意的是，绝大多数 `Tor` 用户并不是在访问暗网。他们使用 `Tor` 匿名浏览表面网，通常是因为他们所在的国家没有自由开放的互联网访问权限。`Tor`\
  \ 用户也可能只是特别注重隐私。另一大群 `Tor` 用户正在进行深网研究。^(35) 最后，一些 `Tor` 用户确实通过该平台访问暗网。\n\n暗网面临的早期挑战是很难找到那些隐藏站点。`Hidden\
  \ Wiki` 在 2004 年引入了第一批用户。^(36) 该网站包含了当前运行的所有暗网网站的目录、用户对这些网站的反馈以及关于通过每个网站可以访问的信息。另一种寻找网站的方法是使用\
  \ Tor 专用的搜索引擎，例如 `Ahmia`，它可以索引它能找到任何隐藏站点，以及 `Grams`，它专门寻找销售非法药物、枪支和伪钞币的隐藏站点。^(37)\n\
  \n为了更具隐蔽性操作，暗网市场参与者利用了所谓的加密货币，如 `bitcoin`，这些货币不与银行系统挂钩，并允许匿名。`bitcoin` 的数字支付系统与其他加密货币一样，依赖于公开分布且加密的交易账本，即区块链`blockchain`），它在促进\
  \ `bitcoin` 交易的同时，为促进交易的计算机所有者发放新发的 `bitcoin` 作为奖励。`bitcoin` 的价值随用户需求而变化。\n\n\n\n\
  \n\n\n暗网支持犯罪生态系统的案例是“丝绸之路”（Silk Road），这是一个非法商品和服务的在线市场。“这个想法是创建一个网站，让人们可以匿名购买任何东西，而没有任何可以追溯到他们身上的痕迹，”丝绸之路的创建者罗斯·乌布里特（Ross\
  \ Ulbricht）说道。他以网名“海盗王罗伯特”（Dread Pirate Roberts，简称 DPR）为人所知，乌布里特模仿亚马逊和 eBay 管理了一个组织良好的非法药物和其他非法活动市场，并拥有用户资料和产品评论。市场上列出了违禁品和其他物品的类别，且买方与卖方之间的通信通常经过加密。从\
  \ 2011 年到 2013 年，丝绸之路取得了巨大的成功——拥有约 100 万个注册账户，估计销售额达 10 亿美元，客户超过 15 万名。在试图定位并揭露\
  \ DPR 身份近三年后，联邦探员在 DPR 无意中泄露其 IP 地址后终于获得了突破口。丝绸之路于 2013 年 10 月关闭，乌布里特因洗钱、计算机入侵和合谋贩毒毒被判处终身监禁且不得假释。但丝绸之路和其他类似的网站重新整合了自身，不同的管理员接管了它们。\n\
  \n自从 FBI 于 2013 年 10 月关闭丝绸之路以来，非法商品的暗网市场发生了爆炸式增长。该市场此前集中在丝绸之路，但现在已变得碎片化。Reddit 上的一个暗网市场目录不断更新，以告知用户哪些是信誉良好的，哪些是不可靠的。不可信网站列表比信任列表长得多。在丝绸之路关闭后不久，用户便涌向了一个名为“羊肉市场”（Sheep\
  \ Marketplace）的此前未知网站。该网站一直主导着暗网市场，直到一个供应商利用漏洞偷走了 600 万美元的比特币。原丝绸之路的前任管理员在原丝绸之路关闭仅一个月后，便于\
  \ 2013 年 11 月 6 日启动了“丝绸之路 2.0”。丝绸之路 2.0 的生命周期很短，它在 2014 年 2 月被一个供应商黑入，偷走了 270 万美元的比特币。然而，这并不是丝绸之路的终结。\n\
  \n自 2016 年 5 月起运营的丝绸之路 3.0 被认为是韧性最强的暗网市场。虽然美国政府参与了原始丝绸之路的取缔行动，但显然该行动并未完全成功。人们迅速建立了新的暗网市场。政府也未能让供应商或客户对他们在网站上的交易承担责任。\n\
  \n暗网继续繁荣并扩大其全球影响力。2017 年，全球十几个国家的执法机构取缔了 AlphaBay，该平台交易各种违禁品，被称为曾有以来最大的暗网市场。20 万名用户在\
  \ AlphaBay 账户中持有价值数百万美元的比特币。在短短两年内，其首脑就积聚了超过 2000 万美元的财富。\n\n\n互联网扩大了身份盗用、信用卡欺诈和直接盗取钱款的非法机会。这是因为在线交易通常缺乏我们在物理世界中赖以的信任指数。似乎每天都会有关于大型黑客攻击的新闻；犯罪分子从公司和政府数据库中收割数百万个信用卡号和类似的财务记录并逃逸已成为常态。仅在\
  \ 2015 年，披露的恶意漏洞就包括上述的美国人事管理局（OPM）入侵事件，导致 2100 万份个人记录丢失；通过入侵 Experian（讽刺的是，这是一家信用检查机构）的网络盗取了\
  \ 1500 万名 T-Mobile 客户的数据；从密码管理器 LastPass 盗取了密码记录；以及对健康保险公司 Anthem 的 800 万名客户数据的潜在入侵。2016\
  \ 年，互联网服务提供商雅虎披露有惊人的 5 亿个账户被攻破。2017 年，美国司法部指控包括两名俄罗斯情报特员在内的等人参与雅虎窃案——这表明了某些国家对数据盗窃的支持。同样在\
  \ 2017 年，信用机构 Equifax 被迫承认通过一次黑客事件丢失了 1430 万名美国人的数据。\n\n当然，数据盗取只是犯罪分子利用破坏网络安全获利的一种手段。其他方法包括直接抢劫银行。2013\
  \ 年，国际有组织犯罪集团入侵了印度两家数据公司，这些公司管理全球多家银行的借记卡。该集团识别出了可以在 ATM 机上提取无限额现金的借记卡号。在伪造这些卡片后，犯罪集团将其分发到世界各地，并在一天内其同伙提取了目标\
  \ ATM 机持有的所有现金。一天的收益是多少？4500 万美元。\n\n最近，2016 年 2 月，在针对孟加拉国中央银行的高级攻击中，被盗走了 8100 万美元。黑客利用了国际电子交换网络，即全球银行金融电讯协会（`SWIFT`），该网络在孟加拉国连接点的控制非常薄弱。`SWIFT`系统并未直接被黑入，但孟加拉银行被盗取的凭据被用于发布欺诈订单。这些订单实际上通过了`SWIFT`的“认证”，表明犯罪分子非常精练且熟悉流程。总共发布了\
  \ 9.51 亿美元的欺诈转账，尽管除四个请求外所有的请求最终都被拦截了。（这给骗子留下了 8100 万美元。）攻击的时机掌握得非常好，使得发现和响应被延迟；纽约联邦银行无法联系到孟加拉的银行家，因为那里的周末开始了。当孟加拉的中央银行家发现欺诈时，联邦银行在纽约的办公室已经因周末关闭了。钱款被送到了菲律宾的银行，随后可能转给了菲律宾的赌场运营商。菲律宾的反洗钱法律不适用于博彩行业，因此犯罪调查人员几乎没有选择来进一步追踪资金的去向。\n\
  \n甚至勒索也进入了网络，表现为所谓的“勒索软件”的传播。犯罪分子攻击机器或网络上的数据并对其加密。然后他们向数据所有者发送信息，警告说如果在规定时间内不支付勒索金，解密密钥将被销毁，数据将无法恢复。该计划的聪明之处在于其可扩展性。所要求的勒索金（要求使用比特币或其他替代金融机制支付）通常较小，因此对于受害者来说，付费比向当局报案或尝试反击容易得多。由于互联网允许这些违法者攻击成千上万台机器，即使是金额较小的个人赎金加起来也是一笔巨款。\n\
  \n\n\n\n这些勒索软件攻击攻击不仅带来了财务后果，还影响了健康与安全。好莱坞卫斯登医疗中心的网络遭受了勒索软件攻击，其数据被扣持了几天。医院领导层顺从了要求，支付了约\
  \ 17,000 美元的比特币将其网络从勒索软件中释放出来。(54)在另一次医院攻击中（这次是针对肯塔基州西部的方法师医院），管理人员拒绝支付费用以移除勒索软件，而是依靠备份使其系统恢复上线。(55)幸运的是他们有备份，但在生死攸关的时刻，等待电脑是否能重新运行并不总是可行的。如果患者的自动心脏泵或药物分配器感染了勒索软件，医院会支付多少钱、支付多快？\n\
  \n事实上，勒索软件已经变得病毒式传播。2017 年，`WannaCry`漏洞感染了英国国家医疗服务体系、西班牙的一个电话系统和中国的加油站，关闭了对运营数据的访问。总共有\
  \ 99 个国家受到 75,000 次独立攻击的影响。(56) 之后，一种名为`NotPetya`的变种勒索软件针对了乌克兰的关键设施，并意外瘫痪了斯堪的维亚运输巨头马士的数据访问。\n\
  \n数据盗取、欺诈和勒索虽然有害，但网络犯罪分子、恐怖分子或国家造成真实破坏的潜力在于网络化数据与其对物理世界影响之间的关系。物理控制系统日益连接到数据网络，用于监控甚至指令控制。远程进入控制系统的能力增加了风险，即这些系统可以在无需物理接触系统本身的情况下被破坏或损坏。\n\
  \n例如，最近的实验证明，通过蓝牙电话连接、无线电数据系统以及各种导航和远程协助常用的蜂窝和 Wi-Fi 连接，可以控制汽车。注意，基于语音的嵌入式电话可能被破解，远程开启麦克风并秘密记录车内人员说话的内容。(57)其他被黑客攻击的智能联网设备包括酒店锁、(58)家用报警器、(59)甚至是洗碗机。(60)\n\
  \n2013 年，伊朗黑客入侵了控制`Bowman Avenue Dam`的计算机，该设施位于纽约州和康涅狄格州边界附近，距离中央公园东北约 20 英里。(61)\
  \ 这座 20 英尺高的大坝并不特别突出。它更像是一个环境池：一个水控坝，通过收集来自 Blind Brook Creek 的雨水径流来防止下游洪水。控制排水的宽\
  \ 15 英尺高 2.5 英尺闸门在 2013 年自动化，以防止水位变化引起洪灾损坏。控制闸门的程序通过蜂窝调制调器被破解了。这使得黑客获得了对洪闸的控制。(62)幸运的是，在攻击发生时，闸门正处于维修离线状态，任何远程操纵的尝试都是可能的。(63)\n\
  \n一些观察者（如该大坝所在地小镇的市长）怀疑，这座特定大坝之所以成为目标是因为它与另一座大坝同名，即俄勒冈州 Crooked River 上的`Arthur\
  \ R. Bowman Dam`，那是一座更宏伟的建筑，高 245 英尺，长 800 英尺。(64) 也许，伊朗人正试图入侵这个规模更大的设施？后果可能会严重得多。\n\
  \n另一次导致基础设施物理损坏的网络攻击于 2015 年 12 月发生在乌克兰。这次攻击在几乎同一时间针对了三家不同的电力公司，影响了 30 个不同的配电设施。(65)\
  \ 攻击者使用了合法的访问凭据，可能是通过包含恶意软件的针对性电子邮件（称为网络钓鱼）获取的，远程登录控制计算机并关闭了控制开关。操作人员目瞪口呆地看着光标“自自地在屏幕上移动”，导航到相应的关闭程序，并在弹出的确认关闭对话框中点击“是”。(66)\
  \ 随后，一种名为`KillDisk`的清理程序删除了计算机数据，包括主引导记录，防止电力公司在断路器关闭后重启计算机。(67) 大约 225,000 名客户失去了三小时电力。(68)\
  \ 当客户尝试拨打公用公司报告停电时，他们无法接通。一场涉及数千次同时拨出的自动电话攻击（称为分布式拒绝攻击`DDoS））已经开始，大部分电话来自国外。(69)\n\
  \n幸运的是，仅三小时后，电力供应商就恢复了电力。控制操作员开车受影响的配电站，使用旧的机械遗产控制开关手动重启了电力。\n\n\n\n\n1762 年 11\
  \ 月，四名英国王室特工闯入了伦敦郊外斯泰尼（Stepney）地区约翰·恩蒂克（John Entick）的家中。恩蒂克是一位小册作家、作家和政府批评者。在接下来的四个小时里，这些人在高级政府官员的授权下，寻找煽动和不忠诚写作的证据。特工翻遍了橱子和抽屉，没收并带走了数百张纸，并造成了严重的物理破坏。恩蒂克因侵入房屋起诉这些特工，英国普通法诉法院维持了该诉讼，裁定在没有明确法律依据的情况下，对恩蒂克家中进行物理侵入和没收文件是非合法的。^(1)恩蒂克的案件被视为“**英国自由的里程碑之一**”，^(2)当美国宪法起草者起草禁止不合理和过度泛化的搜查与扣押的第四修正案时，恩蒂克的案件为美国宪法提供了参考。^(3)\n\
  \n一年前，即 1761 年，马萨诸塞的殖民地发生了类似的案件。为了镇制涉嫌将货物走私波士顿的殖民商人，英国海关官员寻求“协助令”，允许他们在没有合理理由或针对个人怀疑的情况下，搜查私人住宅和经营场所，并寻求臣民协助进行这些搜查。^(4)律师詹姆斯·奥蒂斯（James\
  \ Otis）代表一群商人对协助令提出挑战，认为其是非法的，是无证许可的隐私侵犯。尽管奥蒂斯输了，但该案件推动了美国独立革命的发展。约翰·亚当斯（John Adams）在描述奥蒂斯的观点时写道：“那时，独立之魂由此诞生了。”^(5)\n\
  \n通过采纳联邦宪法的第四修正案，新生的美国试图保护其公民免受不合理的搜查和扣押；各州也在其宪法中通过了类似的条款。但在《权利法案》通过期间以及国家独立后的第一个世纪里，个人数据指的是所见、所听和写下的内容。事实上，根据其条款，第四修正案保护“人们对于保护其身体、房屋、文件和财产免受不合理搜查和扣押的权利”。^(6)因此，隐私问题主要是物理空间内产权的产物。法律的发展是围绕针对物理侵入或没收文件等物理物品的搜查令而展开的。这被概括为一个简短的公式：公民的家“**是他的城堡**”，这暗示着一个物理上的堡垒。在美国宪法起草后，美国法院通常基于对侵入私有财产或未经许可接触肉体人员的判定来提供隐私保护。\n\
  \n\n在 19 世纪末和 20 世纪初，法律面临着视觉和听觉记录技术的发展。摄影技术的使用导致人在公共场所拍摄的图像被挪用于商业目的的现象出现。此外，印刷和出版技术的进步使得文字和图像比过去更广泛地流传。由于摄影师是第三方，且只要没有对摄影主体的财产进行物理侵入，那么对在公共场所拍摄的图像的使用施加何种限制呢？\n\
  \n1900 年，住在纽约的年轻女子阿比盖尔·罗伯森（Abigail Roberson）在工作室拍摄了照片。她将照片给了朋友，朋友将其卖给当地的一家粉坊用于商业用途。该公司在广告中使用她的肖像，并虚假地声称她是一名保单人。^(7)罗伯森抱怨，未经授权使用她的肖像让她感到“极大的羞辱”。^(8)她提起了诉讼，声称未经授权使用其图像导致了她的“精神震惊”。^(9)她要求获得\
  \ 15,000 美元的赔金以及停止印刷其肖像的法院命令。^(10)\n\n这起诉讼一直到了纽约州最高法院。在一个分歧的裁决中，法院多数拒绝了她的请求。法院承认法律保护防止虚假陈述或财产盗窃（例如，如果照片被偷了）。但在`Roberson\
  \ v. Rochester Folding Box Co.`案中，维持对其肖像控制的基本利益被认为过于微不足道，不值得获得保护。^(11)简而言之，这种纯属精神层损害并没有说服法院给予罗伯森赔偿。^(12)该裁决引发了公众愤慨，纽约州议会随后颁布了一项保护隐私权的法案。该法律至今仍然有效。^(13)\n\
  \n在`Roberson`案三年后，佐治亚州最高法院考虑了一起类似的诉讼，该案件源于保险广告中未经授权使用照片，以及原告的虚假陈述。这一次，法院裁定侵犯了原告的隐私。理由是，未经授权挪用和商业化个人的肖像和身份等同于对自由的侵害，因为主体“处于他人的控制之下”且“不再自由”。^(14)\n\
  \n这一裁决以及随后的其他裁决，呼应了 1890 年一篇具有影响力的法律评论文章，该文章质疑了关于个人丑闻细节和个人行为的新闻报道激增是否值得保护一个人的“**不受骚扰的权利**”。^(15)作者是未来的法官路易·D·布兰迪斯（Louis\
  \ D. Brandeis）和塞缪尔·D·沃伦（Samuel D. Warren），他们指向了现有的财产和名誉保护，并推出一个更广泛的理论，即保护个人免受私人生活信息的公开。再次，这种拟议保护“私人事实”（即不具公共利益或不涉及公众人物的事实）的动力是摄影和大众市场出版技术的进步，这些技术极大地增加了媒体或其他渠道关于普通人的传播内容，即使假设没有侵入财产或不存在事实虚假。布兰迪斯和沃伦阐述了人类对于保护私人生活细节（即使是真实的）免受广泛分发和观察的兴趣。正如他们所说，“为了填充一栏又一栏的闲散闲闻，只能通过侵入家庭来获得。”^(16)\n\
  \n\n\n\n\n随后的普通法案例和法律学者最终承认，对于公开披露私人事实，或未经授权将他人的身份或肖像用于商业目的，应受到有限的保护。尽管所保护的的确切利益仍存在争议，但扩张的隐私权已超出了物理财产范畴。这种法律演变让普通公民对个人尊严拥有某种程度的控制权，拥有定义身份的权力，以及对其姓名和肖像商业化开发的排他性控制权。当然，这些都是我们社会对自主性更广泛利益的组成部分。\n\
  \n另一个响应技术变化而重塑隐私概念的事件是窃听和电子监控的发展。窃听的非法性——即试图偷听私人场所的谈话内容——其根源于防止对房屋或电话线进行物理侵入的财产利益。在\
  \ 20 世纪以前，高效窃听的能力是有限的；窃听者必须进入该地点并接触说话者，且必须离得足够近才能听到任何对话。这通常意味着物理侵入，在没有搜查令的情况下是非法的。\n\
  \n电话改变了这一点。随着电话线穿过个人家庭进入公共空间（或存放交换机的电话公司），好奇的人在技术上变得可能在离开说话者的情况下拦截电话通话，而无需物理性侵入私人财产。其他技术发展很快允许了录制面对面的谈话，只要可以将麦克风放置在说话者的物理附近即可。\n\
  \n最初，法院对电话窃听的反应是遵循基于物理财产的对话隐私理论。所要保护的利益并非两个或更多人之间的言论；而是发生该言论的物理空间的神圣性。\n\n\n该案件一直到了美国最高法院。在`奥尔姆斯特德诉美国案`（Olmstead\
  \ v. United States）中，法院狭狭拒绝了罗伊·奥尔姆斯特德对警察无搜查令窃听外部电话线的挑战，理由是电话用户——奥尔姆斯特德——知道他的声音会顺着电话线进入公共空间，而第四修正案的宪法隐私保护仅适用于“人的房屋、其身体、其文件和其物品，防止它们在违背其意愿的情况下被没收”。^(21)\n\
  \n`Olmstead` 引发了四位法官的强烈反对意见。布兰代斯法官观察到，第四修正案的原则必须适应以应对技术创新，并预见地指出，“科学在为政府提供间谍手段方面的进展不太可能在窃听处停止。”^(22)到法院判决时，民意已通过立法决策得到了体现：48\
  \ 个州中有 41 个州制定了限制无搜查令窃听的法律。国会很快通过了类似的窃听限制措施，但没有解决在物理空间使用麦克风窃听的问题。^(23)\n\n窃听法遵循了类似的路径。随着物理空间录音技术的发展，最高法院首先将个人保护的关键设定为录音设备是否在物理上侵入了私人财产。随着时间的推移，法官们暗示，所要保护的利益可能不在于私人物理空间，而在于说话者之间存在的保密预期。换句话说，第四修正案不仅应该保护财产免受侵入，还应该保护说话者控制其言论流向的能力。\n\
  \n20 世纪 60 年代，查斯·卡茨（Charles Katz）是大学篮球的领先“博彩者”。他通过为赌徒下注并抽取分成来谋生。^(24) 联邦法律禁止跨州赌博，为了躲避检测，卡茨经常从他在洛杉矶的日落大道公寓走到一组公共电话亭。从那里，他给波士顿和迈阿密拨打长途电话，使用代码掩盖赌博。当\
  \ FBI 探员获知卡茨的活动后，他们制定了一个复杂的捕捉计划。探员先让电话公司将一个电话亭标记为“故障”。然后他们在另外两个电话亭上方和之间放置了麦克风和录音设备。最后，一名在卡茨公寓附近的探员在卡茨离开家时发出信号，另一名探员迅速开启录音设备。FBI\
  \ 成功录制了卡茨几天的对话并对其提起起诉。^(25)\n\n尽管 FBI 没有搜查令就录制卡茨的对话，但在 `Olmstead` 案下他们不需要搜查令，因为没有物理侵入。记得在\
  \ `Olmstead` 案中，当联邦探员窃听奥尔姆斯特德家中延伸出来的电话线时，法院认为不需要搜查令。事实上，当最高法院审 `Olmstead` 案时，许多邻居共享“小组”电话线，他们对这些线路没有隐私预期。\n\
  \nFBI 在公共电话亭内录制了卡茨的对话。政府辩称卡茨在带玻璃门的公共电话亭内没有隐私预期。但到 1967 年，最高法院已准备承认口头通信的隐私权。^(26)\n\
  \n在`卡茨诉美国案`（Katz v. United States）中，法院推翻了 `Olmstead` 案，并明确规定第四修正案保护的是“人，而不是地点”。^(27)\
  \ 分析不应关注物理空间的性质，而应关注个人对某些通信保持保密的意图。FBI 的录音证据被排除，卡茨的定罪被撤销。\n\n\n\n\n\n在 `Katz` 案中，技术演进重新定义了什么构成应当受隐私保护的行为。如果你在物理环境中或在对普通公众关闭的物理设备上说话，你就有权保护这些数据，即使没有对你的财产进行物理侵入。因此，只有在获得司法许可许可，才允许窃听。另一方面，如果你在公共区域的他人公开听力范围内说话，你并没有合理地表现出维护机密的意图，也没有权保护你所说的话。这导致了“第三人原则”：如果你将数据传递给第三方（如电信服务提供商），你的隐私保护将受到极大削弱。\n\
  \n在 `Katz` 案中，技术变化导致了我们社会对政府监控和调查界限的重新界定。法院将法律保护的重点从物理空间转移到了对通信机密性的利益上。但通过以个人的“隐私预期”来制定这些新的法律保护措施，法院将公众意见嵌入了这些保护措施的定义中。当下一次数据革命开始改变社会预期时，这被证明是一个弱点。\n\
  \n\n20 世纪初，所谓的公共活动相当显而易见：未在私人空间内维持的对话或信息，因此被预期为会被他人看到或听见。但当通信发生在私人空间时，美国人期望对该隐私获得合理程度的保护。只有在政府正当且获得许可的侵入下，这种隐私才可能被侵犯。\n\
  \n随着电话从富人的专属便利变为变为大众的普及，拦截这些通信以协助抓捕罪犯的需求日益增加。第一次世界大战期间，窃听变得如此普遍，以至于国禁止了这种做法——尽管间谍和破坏分子对国家安全构成了明显的威胁。^(28)\n\
  \n回想起，在禁酒时期，最高法院以 5 比 4 的裁定认定，在私酒酒商奥尔姆斯特德（Olmstead）电话上的窃听不需要许可。然而，当该案件在下级法院（第九巡回上诉法院）被审理时，一位法官即使在没有物理侵入的情况下也会要求获得许可。在一份反对意见中，弗兰克·鲁德金（Frank\
  \ Rudkin）法官认为：“使用电报或电话的人并不是在向世界广播。他的对话根据所用工具的性质在允许的范围内完全地与公众隔绝，任何联邦官员或联邦特工无权从电线中获取他的信息，以便将其用于对付他……如果必须忍受这些苦难，我们的祖先在他们制定和建立政府以为他们及其后代确保自由福祉的愿望上显著失败了。”^(29)\
  \ 尽管窃听在 20 世纪 30 年代虽未被判定为非法，但公众意见日益反对它。这种情绪最终反映在 1934 年的《通信法》中，该法案首次规定监听电话和传播获听内容为非法行为。\n\
  \n但随着对国家安全的威胁增加，支持窃听和偷听的公众论点变得更具说服力。当世界卷入第二次世界大战的混沌时，富兰克林·罗斯福总统于 1940 年 55 月 21\
  \ 日向司法部长罗伯特·杰克逊（Robert Jackson）写了一份备忘录。在信中，罗斯福“授权必要的调查探，让他们有权通过听音设备获取信息……针对怀疑有颠覆活动的人……包括疑似间谍。”^(30)\
  \ 这些新权力在一个极度恐惧时期为了公共利益而获得，随后被政府用于调查任何被认为具有“颠覆性”的人。整个战争期间，窃听持续进行。此后在 2 世纪 50 年代，对共产主义的恐惧驱动了“麦卡锡主义”扩大了窃听的使用。\n\
  \n1949 年 3 月 30 日，司法部一名 27 岁的政治分析师朱迪迪斯·科普隆（Judith Coplon）因间谍罪被指控。在一次 5 比 4 的裁定中，最高法院曾发现在私酒酒商奥尔姆斯特德电话上的窃听不需要许可。然而，当该案件在下级法院——第九巡回上诉法院被审理时，一位法官即使在没有物理侵入的情况下也会要求获得许可。在获取截获的苏联电报后，科普隆被指控参与一项与苏联特探瓦伦廷·G（Valentin\
  \ G）有关的卧底行动。在极度恐惧时期为了公共利益获得这些新权力，随后被政府用于调查任何被认为具有“颠覆性”的人。整个战争期间，窃听持续进行。此后在 2 世纪\
  \ 50 年代，对共产主义的恐惧驱动了“麦卡锡主义”扩大了窃听的使用。\n\n1949 年 3 月 30 日，司法部一名 27 岁的政治分析师朱迪迪斯·科普隆（Judith\
  \ Coplon）因间谍罪被指控。在获取截获的苏联电报后，科普隆被指控参与一项与苏联特探瓦伦廷·G（Valentin G）有关的卧底行动。在一个极度恐惧时期为了公共利益获得这些新权力，随后被政府用于调查任何被认为具有“颠覆性”的人。整个战争期间，窃听持续进行。此后在\
  \ 2 世纪 50 年代，对共产主义的恐惧驱动了“麦卡锡主义”扩大了窃听的使用。\n\n1949 年 3 月 30 日，司法部一名 27 岁的政治分析师朱迪迪斯·科普隆（Judith\
  \ Coplon）因间谍罪被指控。在获取截获的苏联电报后，科普隆被指控参与一项与苏联特探瓦伦廷·G（Valentin G）有关的卧底行动。\n\n*(注：由于原文文本存在多处段落重复，翻译时已根据逻辑进行了去重处理，确保内容连贯且不重复)*\n\
