  \ Jackson）写了一份备忘录。在信中，罗斯福“授权必要的调查探，让他们有权通过听音设备获取信息……针对怀疑有颠覆活动的人……包括疑似间谍。”^(30) 这些新权力在一个极度恐惧时期为了公共利益而获得，随后被政府用于调查任何被认为具有“颠覆性”的人。整个战争期间，窃听持续进行。此后在\
  \ 2 世纪 50 年代，对共产主义的恐惧驱动了“麦卡锡主义”扩大了窃听的使用。\n\n1949 年 3 月 30 日，司法部一名 27 岁的政治分析师朱迪迪斯·科普隆（Judith\
  \ Coplon）因间谍罪被指控。在获取截获的苏联电报后，科普隆被指控参与一项与苏联特探瓦伦廷·G（Valentin G）有关的卧底行动。（此处略）^(31)\n\
  \n即使在最高法院 1967 年 `Katz v. United States` 裁定判定第四修正案对不合理搜查的保护延伸到电话对话时，平衡个人隐私与不断变化的需求的法律演进进展缓慢。1968\
  \ 年《综合犯罪控制与街道法案》迈出了第一步。它接受了 `Katz` 案，并明确政府可以根据该修正案的要求获得许可，以调查谋杀、绑架等特定犯罪。^(32)\n\n\
  \n\n\n虽然对国内电话线路进行窃听是非法的，但可以认为，拦截互联网上的数字数据通信是完全合法的，因为 `Katz` 案以及国会通过的法律仅涉及电话技术。因此，尚未通过任何明确法律来防止对互联网通信的拦截。与线路电话等封闭的点对点通信系统不同，互联网通信通过一种（理论上）对任何人开放的基础设施进行传输。为了弥补法律上的这一技术差距，国会通过了《1986\
  \ 年美国电子通信隐私法案》，要求电子通信享有与电话通信相同的法律保护，尽管在无线电话上进行的对话不受此保护。该法案还规定了笔迹记录器（记录拨出电话号码的设备）和陷阱与追踪设备（记录进入特定电话号码的系统）的使用。法律通过后，参议院报告评论道：\n\
  \n法律必须随技术共同进步，以确保第四修正案的持续生命力。隐私不能仅仅依赖于物理保护，否则它将随着技术的进步而逐渐侵蚀。国会必须采取行动保护我们公民的隐私。如果我们不这样做，我们将助长这种珍贵权利的逐渐侵蚀。\n\
  \n不出所料，监控和安全要求的下一次重大变化出现在 2001 年 9 月 11 日的剧性袭击之后。那些引导司法部做出立即响应的人（包括我）意识到，我们需要重新校准情报收集。基地组织分子进入该国的能力以及对后续攻击的担忧，使得收集大量关于旅行者的数据变得至关重要，以便获得恐怖分子的早期预警。新的需求将情报收集从针对外国领导人和官员的传统间谍活动，转变为在平民人口海洋中寻找隐藏的恐怖分子，这种更具挑战性的工作。\n\
  \n一系列出台的立法（包括《美国爱国法案》）使政府能够扩大其收集和审查数据的能力。新法试图将在互联网上收集信息的权限与现有的电话和模拟通信收集权限同步。但一个灰色地带是，对于源于或结束于海外的通信收集应适用什么样的隐私限制（例如，一个可疑的叙利亚恐怖分子打给他居住在美国的表弟打电话）。这种国内通信拦截是受《外国情报监控法》（FFISA）管辖，还是可以被视为美国情报机构在外国进行的本质上不受限制的间谍活动的一部分？美国政府最初采取后者的立场，但在几年后，司法部律师产生了顾虑，拒绝批准这种无证的监控。结果是产生了一种新的法律方案：针对海外非美国目标的监控不需要搜证令，但需要\
  \ `FISA` 法院监督收集过程，以确保政府在目标是美国居民时没有规避搜证要求。\n\n因此，根据《2008 年<外国情报监控法案>修正案》，行政部门可以针对美国境外的非美国人士（或被认为是非美国人士的人）进行无证的电子监控。虽然在单个案件中不需要司法审查，但法院被要求定期审查通用的目标程序。他们希望确保信息收集工作经过合理的调整，以避免监控物理位于美国境内的美国人或其他人。另一方面，政府必须获得搜证才能合法地监控美国人士或在美国境内的外国人。所达成的平衡是极力保护美国公民和我们境内人员的隐私权，但对海外外国人的保护则较少。\n\
  \n但即使是这些限制也不适用于在 9/11 之后世界中变得越来越重要的电子信息收集类型。拦截恐怖分子之间的实际对话或文本通信已不再仅仅重要。现在，所谓的元数据可以被有效利用，绘制从已知恐怖分子到其网络未知成员的潜在链接和连接。元数据本质上是互联网或电话地址以及路由指令（或财务路由指令），用于识别谁在与谁通信（或两个人是否正在进行金融交易）。它可以被比作密封邮信封外侧的地址信息。虽然这些信息在经典意义上不是私密的——它们没有揭示对话的实际内容——但它们揭示了关于人的所属群体的信息。从大量来看，这些信息对于某人的社会行为具有合理的参考价值。\n\
  \n在 9/11 之前和之后，元数据的收集被认为只需要适度的法律隐私保护：只需证明其与犯罪或国家安全调查具有相关性即可。但由于过去十年互联网通信和数据存储的剧增，让政府收集并持有所有通信的元数据以进行大规模分析首次变得可行且具有吸引力。尽管对特定数据的审查需要某些显示合理依据的先决条件，但数据库的维护允许几乎任何实质性的线索被追溯。它允许识别从已知恐怖分子到其他人的远程联系。\n\
  \n多年来，元数据收集一直是美国反恐库中一种宝贵的工具，作为标记潜在未知恐怖分子的手段。但当收集信息的庞大规模公开后（部分是因为爱德华·斯诺登的大规模数据窃取），引发了负面反应。尽管对任何个人收集的数据极少，但几乎所有美国人的元数据都在该计划下被收集，使其看起来比以往任何时候都更大、更令人担忧。2015\
  \ 年，《美国自由法案》结束了国家安全局（`NSA`）对所有元数据的批量收集，要求未来政府将元数据留在个人电信公司和服务提供商的数据库中（只要他们维护这些信息）。对该元数据的任何搜索都需要某些特定的相关性。\n\
  \n这些对法律格局的修改反映了隐私预期的当代演变，同时也影响并改变了这些预期。法律演变的这一特征暴露了 `Katz` 案中的概念缺陷：围绕“预期”建立隐私规则是循环论证，因为规则本身就塑造或重塑了预期。如果法律规则允许更大的监控自由度，预期本身可能会退化，指向更大程度的监控。如果监控限制收紧，预期可能会增加，从而导致进一步的限制。\n\
  \n\n\n\n\n\n与此同时，新的互联网技术对我们的个人安全和保障构成了前所未有的威胁。过时的法律框架不仅低估了防止政府滥用数据收集和分析的保护，相反，也未能充分保护这些数据和网络免受犯罪分子、恐怖分子甚至国家的外部威胁。\n\
  \n本着现有的社会规范和法律仍然有效的预期，我们试图将新技术整合到现有的法律结构中。然而，随着新技术极大地改变了我们对“私有”和“公共”含义的认知，我们现在必须确定哪些社会价值和原则需要被维护。自主性的更广泛概念——控制我们自己数据的权利，并以此塑造我们自己的命运——是必须保护的核心。\n\
  \n\n\n万维网是一个网络网络，其中海量数据存储在网上，并且在缺乏特定保护措施的情况下，任何连接网络的人都可以访问。数据收集规模的剧烈扩张、传输的易易性、存储时间的长短，以及聚合和分析的效率，都具有巨大的社会影响——这种影响比摄影和电话出现所产生的影响深远得多。使这些革命性变化更加复杂的是如今对移动设备和无线技术的广泛使用，这些技术提供了更大的面向外表面积，网络可以通过这些表面积进行运行或被渗透。\n\
  \n新的数据革命从根本上改变了私有信息与公共信息之间的概念区别。在 21 世纪之前的数据结构下，关于个人的数据或信息可以相对容易地划分为非公共（私下对话、私人空间内的活动、两个或几个特定人员之间的电话讨论）和公共（通常对公众可见的活动，如街道或窗户外的活动，以及在街道上未定义群体可听的讨论等）。但当前的数据收集、存储和使用架构模糊了私有与明显公共之间的界限。\n\
  \n这种模糊现象的一个方面是，作为各种“免费”在线服务的嵌入价格，数据不受限制的收集日益增加。例如，`Angry Birds` 是一款极其受欢迎的手机游戏，通过弹射小鸟飞向小猪来消灭它们。它可以免费下载，下载量已超过十亿次。然而，大多数人并没有停下来问一个问题：“开发者是如何通过这个应用程序获利的呢？”在\
  \ `Angry Birds` 的案例中，大多数用户（他们并不阅读应用程序披露政策）并没有意识到他们的数据（如位置、唯一的手机 ID 号或性别）正在被收集、包装并传输给所谓的广告合作伙伴。\n\
  \n关于个人用户的数据已成为一种利润丰厚的商品。它现在是一项在围绕互联网法律灰色地带运行的、价值数十亿美元的产业。如果你不知道手机上的应用程序正在收集数据，只要你享受其他益处（如玩\
  \ `Angry Birds`），这没关系吗？数据收集的事实被埋在你在安装程序时未能阅读的、无尽长的同意书中，这重要吗？这种数据收集在何时变得具有侵略性——当你的名字被收集时？还是你的联系人列表？\n\
  \n监控法的编写是为了防止对私人电话线路的窃听，以及防止除授权的人员以外的任何人在封闭空间内的窥听。但现在，人们经常且往往在不知情的情况下泄露数据，导致这些数据可以被他人获取和审查。而且你的数据的可用性并不限于任何特定在线服务的提供者。根据法律授权，政府官员可能会查看数据。这些关于你的信息也可能从提供者处购买。或者被那些黑入提供者并盗取数据的人看到并收集。这些数据不会分解，稍后可以组合成关于你日常活动日益完整的画像。显然，我们看待“私有”和“公共”信息历史保护的背景需要更新了。\n\
  \n\n直到最近，在公共场合进行的行为或发表的陈述在定义上都是碎片化的：它们在传播范围、聚合程度和持续时间方面具有固有的局限性。除非个人处于持续监控下或被无情地跟踪，否则几乎不可能收集他们所有的言论或行为，即使是发生在公共场所的也是。公共场所的大多数言语和行为都没有被记录，即使在在那里被记录或拍照，也没有办法来聚合它们。此外，任何可以被收集和记录的数据都难以广泛传播。随着时间的推移，由于无限存储信息的物理和财务限制，很多内容会被遗忘。因此，个人言论和行为的收集、分发和存储——即使是发生在开放的公共空间——也会随着时间的推移而化或丢失。这种特征我称之为\
  \ `信息摩擦`（`information friction`）。重要的是，信息摩擦通过减少公共行为与其他行为建立联系、被无限存储以及被广泛发表的实际可能性，从本质上减轻了公共行为的负面后果。简而言之，我们可以忘记，而且除极少数特殊情况外，我们可以依靠他人的健忘来生存。\n\
  \n但在 21 世纪的数据 3.0 架构下，私有和公共行为的特征都发生了变化。任何连接到互联网的数据或信息——即使是在看似私密空间（如家庭或办公电脑）中输入和维护——除非信息的创建者或所有者主动采取保护措施，否则在结构上可以让世界上任何连接互联网的其他人访问。换句话说，此类信息的`默认设置`已从私有变为公共且永久久保留。\n\
  \n同样，在公共场所产生的数据性质也发生了变化。现在收集和聚合个人所有的公共行为变得相对容易。视频和音频技术的爆炸，特别是在个人智能手机和其他移动设备上，以及大城市随处可见的摄像头和车牌读取器，意味着更多的公共行为被记录下来，尤其是个人的行为。同样，社交媒体和易用工具的扩张意味着人们经常近实时地发布关于他们观察到或经历的行为的评论。\n\
  \n\n\n\n\n\n我们现在正处于一个行为录像变得简单且无处不在的世界中。地球上手机手机数量比人还要多，大多数手机都能够随时随地快速拍摄照片或视频。这通常只是一种非常酷且方便。你拍到了宝宝可爱的瞬间并可以分享给奶奶；你捕捉到了朋友在某个瞬间的完美姿势。然而，这种便利是有代价的。\n\
  \n2010 年，位于宾夕法尼亚州费城郊区的下梅尔里恩县（Lower Merion）学区曾有一项政策，鼓励学生将学校的笔记本电脑带回家做作业。许多学生利用了这项计划，发现休息期间或晚上在家里做作业非常方便。然而，在某些奇怪的时间，电脑摄像头附近的绿灯会闪烁，似乎表明他们的摄像头已被激活。事实上，该学区在笔记本电脑上安装了间谍软件，允许其远程访问摄像头。此类间谍软件通常用于通过识别犯罪分子和被盗设备的位置来找回被盗的电脑，但该学区却利用这些网络工具监控其部分家中的学生。当时\
  \ 15 岁的学生布莱克·罗宾斯（Blake Robbins）在两周内被拍摄了 400 多次，有时甚至是在睡觉时。另一名学生在约六个月内被拍摄了 8000 多次。这些录像只有在罗宾斯被叫到副校长办公室并被控吸毒时才被公开。一张截图显示他手里拿着学校所说的“药片”。罗宾斯辩称，他实际上在吃\
  \ Mike and Ike 品牌的糖果。两起诉讼已以 61 万美元达成和解，至少还有一起诉讼正在审理中。\n\n尽管在未经父母同意的情况下使用网络摄像头捕捉学学生的视频和图像令人不安且不道德，但未经披露的视频录像并不一定违法。如今的许多窃听法仅涵盖具有音频特征的监控工具进行的窃听。只要不传输或记录音频，这些监控法律可能就不适用。\n\
  \n事实上，在某些情况下，通过对公共事件进行视频录像，我们的公民自由可能会得到更好的保护。以西蒙·格利克（Simon Glik）为例。格利克是波士顿地区的刑事辩护律师，他在\
  \ 2007 年结束了遗产法院的实习，恰好在波士顿公共广场（波士顿市中心的一个公共公园）目击了一次逮捕。在涉嫌毒毒者十英尺外，格利克目睹了拳击和锁喉。当他觉得警察使用了不必要的武力时，他拿出手机拍摄了这次逮捕过程。随后，一名警察走向格利克，询问他的手机是否具有“录制功能”。当他确认具有后，警察没收了他的手机并逮捕了他。2011\
  \ 年，美国第一巡回上诉法院裁定，格利克有权对执法中的警察进行视频录像。理由之一是，他并不是在“秘密录像”，而是“公开录像”——公开举起手机捕捉该事件。对他的指控随后被撤销，但格利克起诉这些警察和波士顿市违反了他的美国宪法第一修正案的权利。2012\
  \ 年的一项和解让格利克获得了 17 万美元。\n\n类似的事件于 2010 年发生在巴尔的摩。克里斯托弗·夏普（Christopher Sharp）在普雷克尼斯锦马赛（Preakness\
  \ Stakes）马赛期间目睹巴尔的摩警方强制逮捕他的女性朋友。该女子被推倒在地，口中清晰可见一滩血。夏普用手机视频录制了那场混乱。随后，警察命令他交出设备。他交了设备，警察带着他的手机离开了一会儿。他们稍后回来并交还了他的手机，但设备中所有的录像都被删除了，包括他儿子在体育活动中的个人视频。夏普后来参与了总额为\
  \ 25 万美元的和解。\n\n关于这一事件，美国司法部在 2012 年的诉讼过程中正式就了“私人公民是否有权根据宪法第一修正案记录在公共场所履行职责的警察，以及警察在没有授权或正当程序的情况下没收并销毁此类录像，是否违反了公民根据宪法第四修正案和第十四修正案的权利”。司法部“敦促法院对这两个问题给出肯定的回答”。\n\
  \n巴尔的摩警方（BPD）随后发布了一项政策，规定了公民在 BPD 成员于任何公共场所执行官方业务或以官方身份行事时，“视频录像、拍照和/或音频录制 BPD 成员的权利，除非此类记录干扰警方活动。”这项政策显然是双向的。2015\
  \ 年，巴尔的摩警方为 150 多名警察配备了执法记录仪，记录他们与公众的互动，以建立警方与平民互动的记录。\n\n监控摄像头的使用不仅在美国，在许多国家也无处不在。在伦敦，可能是世界上最“老大哥”的城市，有约\
  \ 51,000 台警方运行的摄像头，以及超过 50,000 台公开的私人运营摄像头一直在监控。私人公民、企业主和政府不断安装额外的摄像头来监控关注区域。联网安全系统现在已成为主流，家庭用户只需少量的投资即可安装。至少某些系统已经在捕捉个人在其住所内的图像，即使是无意的。此外，随着口袋里智能手机等监控设备数量增加，关于什么可以录制以及什么是公共领域的冲突将继续。\n\
  \n\n更为意义重要的是，这些记录的图像和声音不再存储在个人设备上，而是通常上传到云端，本质上是一个通过终端设备访问的巨大服务器群。云端不仅能以低廉的成本缓存大量的数字数据，而且在链接数据存储环境中的数据聚合也意味着云提供商（或通过法律程序的政府机构）可以搜索整个数据领域，并提取和聚合所有与单个个人相关的信息。现代分析工具使此类搜索变得切可行且廉价。这些积累的信息可以毫不费力地传播到世界各地并永久缓存。\n\
  \n为了方便，越来越多的这种聚合是自动发生的。软件编写人员为了自己或软件用户考虑方便的事物，并因为操作简单而将其添加进去。例如，许多数字图像的默认设置（无论是用`iPhone`等移动设备还是专业相机拍摄的）除了实际图像外，还包含了大量信息。这不仅记录了时间和日期，还记录了光圈设置和闪光灯信息等内容，供摄影师审阅。许多图像还记录了拍摄地点（由内置`GPS`系统报告）。这些“额外”信息是元数据——记录它们的目的是为了让摄影师确定录制图像时的位置，或以便他们在未来的照片中重新创建相机设置。\n\
  \n\n\n\n元数据听起来可能无害，但他人可以轻松审查它。免费软件工具，例如 Jeffrey Friedl 的 `Exif viewer`，能够追踪图像的位置。那些不小心忘记关闭此功能的名人可能会泄露其私人住宅的地址。热门电视节目《探险大师》（`MythBusters`）之星亚姆·萨奇（Adam\
  \ Savage）就曾遇到这种情况，他在出发上班前发了一张汽车照片，并配文说“现在要去上班了”。在不知不觉中，他向世界公开了自己的家的位置。\n\n位置数据并不总是像\
  \ GPS 坐标那样明显。超级模特汉娜·戴维斯（Hannah Davis）在 2015 年万圣节期间发布了一张身穿戏装的照片。虽然照片不包含地理位置信息，但图像中独特的窗帘和地毯图案让狗仔摄影师追踪到了这位名人，并等待她离开建筑。\n\
  \n我们生活在一个街角都有摄像头的时代，因为每个人都随身携带一个。我们已经变成了狗仔。当我们急于拍摄在街角发现的某个名人并将其发布到 `Facebook` 或\
  \ `Instagram` 上时，我们没有停下来思考自己正在为他人提供实时追踪器。事实上，已经开发出了帮助跟踪名人的软件。2010 年，一个名为 `JustSpotted`\
  \ 的网站和应用程序上线。该工具允许用户通过 `Twitter` 和其他社交媒体上的目击记录追踪名人的行踪。\n\n然而，`Twitter` 希望那些“推特”的真人感到这样做是安全的。该公司切断了\
  \ `JustSpotted` 对“所有公共推文的海量数据流”的访问。有趣的是，一年后，整个 `JustSpotted` 开发团队被 `Google` 聘用负责\
  \ `Google+` 社交平台。看来社交媒体数据所有者和大型科技公司已开始自我监管，就互联网上使用社交媒体数据制定了新规范。但今天，由于这些数据的存在，仅仅关闭一个跟踪名人的应用程序并不能阻止其他跟踪。\n\
  \n这些功能交易成本的消除，消除了信息摩擦及其改善作用。在拉斯维加斯发生的事情不再留在拉斯维加斯，而是可以与任何地方存储的记录和行为报告相结合并传播到世界各地，或者在多年后被重新发现。公开行为的成本被极大地放大了。\n\
  \n\n许多人在不完全理解的情况下，将个人信息放在通信、电子邮件、数据存储（即 `云`）和社交媒体服务中，这些服务允许其运营者或所有者查看、保留，甚至营销所产生的数据。此外，随着在线和通信活动日益从有线传输转向无线，当数据通过空气无线传输时，比起物理插入硬件进行窃听，第三方更容易拦截和捕获数据。因此，“数字泄露”的可能性日益增加，外外人员可以借此几乎持续地拦截元数据、通信内容，甚至是物理位置数据。\n\
  \n大多数人意识到，上传到社交媒体的个人数据服务提供者可以访问，至少是为了监控和提高服务效率，也是为了对各种无关的商品和服务进行直接或第三方营销。如果你在另一个网站上看中的鞋子现在出现在\
  \ `Facebook` 广告中并列为待售状态，这可能被认为是一种便利。\n\n不那么明显的可能是那些互联网服务提供商，他们不仅监控网络搜索，还监控电子邮件内容，以开发用于精准广告的原数据。更隐晦的是各种零售和其他商业“忠诚度”卡计划以及各种信用卡促销，这些活动允许卡发行机构不仅记录使用忠诚卡或信用卡购买了什么，还记录了何时何时何时。\n\
  \n现在想象一下，你的搜索数据、电子邮件数据和购买数据被结合，使得分析师可以将你的搜索频率和程度与实际购买相关起来。或者，人们可以根据你的关联帖子、社交媒体和邮件引用，预测谁最可能影响你进行购买。无需想象——这正在发生！`Google`\
  \ 和 `Facebook` 都向其付费商业客户提供显示查看在线广告与购买之间相关性的数据。信息量最大的数据显示，购买有时是在查看广告的几天或几周后完成的。这些信息是从你点击广告和访问实体店的行为中收集的。\n\
  \n当然，访问和分析此类数据带来的不仅是商业利益。政治竞选顾问日益寻求与政治偏好相关的行为信息，既是为了更高效地购买广告，也是为了帮助候选人的信息传递。在 2012\
  \ 年总统竞选期间，奥马竞选购买了电缆和卫星观众数据，并将其与可说服选民的画像（源自社交媒体）相关，以确定哪些节目是同于奥马的人最常看的。通过使用被称为 `Optimizer`\
  \ 的软件，竞选官员能够针对“可说服”的选民。奥马竞选不再是估算某一投票群体（如特定性别和年龄的人群）广告的效果，而是通过对个人选民进行“微位投放”实现了广告预算的最大化。\n\
  \n竞选活动变得越来越复杂。例如，在 2016 年初选季，一家向大公司出售精准广告信息的数据智能公司从智能手机中汇总选民特征，并得出结论：在爱荷华州，喜欢烧烤或修剪草坪的人极有可能投票给唐纳德·特朗普。为了创建个性化的选民画像，竞选活动正在从海量来源中收集越来越多的信息——投票记录、工会、倡导团体、政党、社交媒体和付费消费者数据，这仅列举了几个。\n\
  \n竞选活动希望为每个达到投票年龄的人建立画像，以预测和影响投票。数据足迹对服务提供者也很有价值。现代手机、汽车、射频识别 (`RFID`) 卡和钥匙扣都会生成关于持有物体的人的位置信息。这样做有许多原因：它可能对于所提供的服务至关重要，或者在紧急情况下可能很有用，以便提供警告或协助。但再次，这存在间接用途。其是识别设备持有者何时在购物，以便向手机发送定向广告或折扣信息，或通过其他方式进行沟通。总而言之，这种信息可以用来绘制某人的日常日程安排和生活模式。\n\
  \n\n\n\n同样，现在涌出了大量的健身追踪设备，这些设备可以监测身体活动、心率、热量消耗、行驶距离甚至血糖水平。随着这些数据被上传到云端存储，它们在营销领域就变得可用且具有价值。根据\
  \ 2014 年美国联邦贸易委员会（FTC）的一项研究，12 个移动健康应用程序或设备会将数据传输给 76 个第三方。^(25)其中某些信息可以追溯到特定个人。事实上，这些难以识别的第三方可能会接收关键的健康信息，例如餐食或饮食信息、性别以及医疗症状的搜索历史。FTC\
  \ 的报告以轻描淡写的的语气总结了这一点：“当健康常规、饮食习惯和症状搜索能够使用该消费者特有的标识符进行聚合时，将产生重大的隐私影响。”\n\n事实上，随着技术的日益复杂，数据公司已经能够秘密地与多个独立设备通信，以获取消费者所观看、阅读、在物理或电子层上访问或购买的几乎所有信息的快照。正如民主与技术中心在对\
  \ FTC 的行政评论中所写的，数据商将多个设备上的活动归因于同一个人的能力，构成了一个该个人活动的详细肖像。^(26)具体来说，民主与技术中心的报告提到，“通过跨设备跟踪个人，营销人员可以为每个个人用户创建完整且详细的，并识别长期的购物或行为模式。”FTC\
  \ 的研究进一步显示，100 个热门网站中有 87%嵌入了跨设备追踪器。^(27)这种能力通过一种在范围内配对多个设备的追踪技术得到了增强。一旦配对成功，设备的摄像头、麦克风和其他传感器就可以被用于追踪用户的行为。这项技术是谷歌热门的\
  \ Chromecast 系统的一部分，并在用户不知情的情况下嵌入了许多智能手机应用程序中。\n\n利用现有的技术，可以从个人的社交媒体、电子邮件、移动设备、健身可穿戴技术和汽车中，收集关于他们的兴趣、身体状况、日常作息、驾驶行为和消费偏好的海量信息，甚至可能是他们的政治观点。无论好坏，外部第三方都可以确定你吃什么、喝什么、看什么、读什么；你运动的频率；以及你在何时、何地驾驶。第三方可以收集有关你是否在开车前购买咖啡的信息、你是否在吃更多脂肪食物并跳过健身房，以及你是否是一个为了通勤而选择高流量路线的激进型驾驶员。\n\
  \n越来越多的各行各业正依赖此类数据来构建客户和委托人的全方位肖像。一家德国金融服务公司通过检查社交媒体行为、语言分析、互联网浏览历史以及潜在客户提供或同意提供的类似信息，来评估在线借款人的信誉状况。^(28)从某种意义上说，这种对分析的使用使得贷款人能够超越传统的还款标准和信用历史，从而让那些可能不符合正常信誉标准的个人能够证明自己的可靠性。当然，这种评估的优坏取决于其所依赖的算法。\n\
  \n同样，如前所述，保险公司也开始在承保和风险定价中采用这种富数据的方法。目前，许多保险公司使用“远程信息技术”来监控汽车驾驶。里程数、路上的时长、时间段、速度、刹车激活和其他统计数据会从车载诊断信息中收集，并近实时上传到公司服务器。大多数生成的数据源自驾驶员同意连接到汽车上以获得折扣的设备。\n\
  \n某保险公司已经在现场安装了超过 750,000 台此类设备，且数量仍在增长。该公司最近还获得了一种更全面的监控系统的专利，该系统可以追踪驾驶员的每一个动作。通过摄像头和传感器，它不仅能够追踪汽车性能和操作（你在上一个交叉路口打灯了吗？），还能追踪驾驶员的心率、血压以及乘客信息。该公司还可能利用这些数据并将其出售给提供信用评分到个人健康保险的第三方公司。^(29)再次，消费者在失去隐私方面的潜在利益是，他们根据良好的驾驶行为获得奖励，而不是基于年龄等其他一般因素被归类为某类风险。然而，风险在于算法可能存在缺陷，或者由于工作或生活环境要求必须在特定时间或特定地点驾驶的人将受到系统性的惩罚。\n\
  \n当然，在上述大多数案例中，参与是出于自愿的。但如果无法提供数据成为受到惩罚的原因，会发生什么？^(30)例如，除非你同意提供大量的个人数据，否则保险公司可能会提高你的保费。或者想象一下，雇主因为发现你没有社交媒体活动而拒绝了你的工作申请。\n\
  \n最引人注目的将强制性数据收集作为社会控制手段的例子可能是中国正在进行的尝试。商业公司现在评估信誉不仅基于财务行为，还基于有关人们如何花费时间以及购买什么的信息。中国政府正在考虑应用此类技术来建立社会信用分。这不仅包括经济活动，还包括访问的网站以及朋友的社会信用排名。^(31)随着此类评分越来越多地展示并被用户依赖，它们将产生一种改变行为的强大压力。公民将成为自己的社会行为监测器。\n\
  \n\n近年的互联网革命不仅涵盖个人产生的海量信息。这一巨大变革的另一个要素是物理世界中的许多系统是如何通过托管在网络上的数字驱动控制来运行的。这些系统既产生数据（包括能源消耗等），又引导系统的性能。潜在地，互联网入侵者可能会影响、损坏或破坏控制交通、公用事业和医疗程序的系统。或者此类入侵者可以执行金融交易。\n\
  \n此类攻击不仅仅是理论上的可能性。2000 年，被澳大利亚昆士兰州马鲁奇郡委员会拒绝录用的个人 Vitek Boden，将他对无线电控制 SCADA 系统的知识变成了黑客工具。Boden\
  \ 远程渗透了昆士兰州一个污水处理厂的控制系统。在接管了工厂控制系统后，他导致数百万升原污水流入河流附近的野餐区。^(32)\n\n\n\n\n\n2011 年，德克萨斯州的一家公共水务公司遭到了使用俄罗斯互联网地址者的攻击。攻击操纵了控制系统，导致一台水泵烧毁以及客户用户名和密码被窃盗。美国国土安全部（DHS）被要求调查此事，他们将此问题仅仅视为水泵故障，对关键基础设施没有风险。DHS\
  \ 的这一评估让另一位名为“pr0f”的黑客非常愤怒，他决定要证明对水处理系统进行攻击是可能的。他入侵了系统，获取了控制系统软件的截图，并在网上发布了结果。与使用俄罗斯互联网地址的攻击者不同，pr0f\
  \ 故意没有对工厂造成任何物理损坏。他还表示，这次入侵并不是真正的黑客，因为系统仅受一个简单的三字符密码的保护。pr0f 说，“将你的 SCADA 机械连接到互联网”是愚蠢的，并补充说这“几乎不需要任何技巧，两岁的孩子都能做到”。\n\
  \n2014 年的某时候，一个未知的黑客群体渗透了德国钢铁厂的业务信息系统，并穿过内部网络，最终进入了熔炉的控制系统。他们操纵系统，导致系统无法正常关闭熔炉，对系统造成了“巨大的破坏”。在\
  \ 2015 年和 2016 年，正如之前描述的那样，数十万乌克兰人在圣诞期间遭遇了停电，他们的电网被黑客入侵并关闭，这可能是为了对乌克兰政府进行混合战争行动的俄罗斯黑客所为。\n\
  \n这些风险并不一定威胁生命安全。2012 年，世界上价值最高的公司——沙特石油公司（即沙特阿姆 CO）遭到了入侵。一种植入的病毒在公司网络中传播，无差别地擦除了\
  \ 30,000 多块硬盘。许多员工正因穆斯林节日“古德圣之夜”（Laylat al Qadr）不在家，这确保了病毒能够造成最大的破坏。少数在岗的员工注意到他们的“电脑运行异常；屏幕开始闪烁；文件开始消失；某些电脑在没有任何解释的情况下关机”。由于无法访问数据库信息，业务交易停滞。在加油站装载和配送燃料的汽油车因支付服务离线而被拒绝。由于自动化的存在，生产服务一直保持在每天\
  \ 950 万桶。为了恢复企业网络系统，沙特阿姆 CO 将代表直接派往东南亚硬盘制造商的工厂现场。他们支付了高价以从生产线上获取首批 50,000 块硬盘，并让企业网络重新上线。尽管拥有巨大的资源和\
  \ IT 专家，沙特阿姆 CO 花了近两周的时间才恢复服务，并花了五个个月才重建了一个更安全的企业系统。\n\n## 物联网：你所未见的尚未开始\n\n破坏性风险不仅限于连接到网络的大型数字驱动基础设施。在过去几年的会议上，研究人员展示了利用无线连接干扰或停止汽车或医疗设备（如起搏器和胰岛素泵）运行的能力。数百万个机械设备（包括恒温器、摄像头、冰箱和汽车）的无线连接网络的前景，正如前面提到的，被称为“物联网”。\n\
  \n2015 年，两名安全研究人员入侵了一辆 2014 年的吉普切诺基，并能够控制车辆的方向盘、短暂禁用刹车并关闭发动机。通过一个无线娱乐和导航系统，他们实现了对数千辆其他吉普的互联网访问，允许他们从几乎任何地方控制这些车辆。其他研究人员已经了汽车的多个入口点，包括与仪表盘显示和安全气囊交互的计算机，这反过来允许访问变速箱、发动机和转向系统。具有语音激活娱乐或蓝牙功能的汽车可以被渗透，使得麦克风在远程激活下秘密地记录和传输信息。\n\
  \n远程控制或禁用车辆的威胁不仅仅是一项研究活动。2010 年，被奥斯汀德克萨斯州汽车中心（Texas Auto Center）解雇的员工利用网络黑客攻击对其前雇主及其客户进行报复。该公司曾在其汽车中嵌入了一种设备，该设备可以禁用点火并触发响亮的喇叭，作为惩罚欠款客户的手段——这是一种高科技收回手段。这名前员工入侵了\
  \ 100 多辆汽车，关闭了它们的点火系统并触发了喇叭。\n\n\n这些研究实验表明，个人信息的漏洞（`data confidentiality` 问题）和控制系统的漏洞（`data\
  \ integrity` 问题）由于数据连接的物联网而变得加剧。这种现象为干扰物理系统提供了更大的攻击面，并产生了关于个人行为的海量数据。即使你完全不知情，你的汽车和冰箱可能正在收集你日常活动和兴趣的信息。\n\
  \n随着芯片上微处理器的处理能力大幅提高，更多的计算能力被嵌入即使是小型家电中。这些设备可以连接在一起形成物联网的一部分。公用事业部门越来越多地部署智能电网，将恒温器无线连接到公用事业部门以测量使用模式并允许根据需要精确调整能源供应。公司正在研发时钟、厨房电器和其他家居产品，这些产品可以监控消费者行为，在你醒来前几分钟开启咖啡机；在物资用完时警告你；订购下周的杂货；并允许你远程操作锁和灯，这样你就不需要回家迎接访客或检查住所是否安全。\n\
  \n亚马逊已成功营销并发布了一种名为 `Echo` 的产品。该设备是一个交互式的、联网的、语音扬声器。只需提问，它就会在网上搜索答案，告诉你天气，播放音乐或安排你的日程。亚马逊还在销售一种名为\
  \ `Dash Button` 的产品，可以放置在家里使用某产品的地方。当你用完产品（例如洗衣液）时，你只需按下 `Dash Button`，它就会自动生成订单，并将替代品快速送到你家。再也不需要列清单并去商店了！\n\
  \n\n\n\n\n一台名为 `June` 的联网烤箱使用顶置式高清摄像头来识别你正尝试烹饪的食物类型。它会建议烹饪时间，并内置了传感器以提高烹饪性能。如果你想在另一个房间观察饼干的成色，甚至可以通过智能手机查看高清摄像头的画面。`飞浦公司`（Phillips\
  \ Corporation）制造了联网照明系统，你可以通过智能手机控制它们。该系统能识别你何时回到家并自动为你开灯。此外，你可以在世界任何地方控制照明。\n\n\
  `August Home` 已于 2017 年被全球锁具巨头 `Assa Abloy` 收，它生产了一系列家用锁，这些锁可以连接到现有的硬件，但允许通过支持手机的连接实现无手开锁和锁定。当你靠近门时，门会自动解锁；在你离开时会自动锁定。它还能跟踪使用数字锁进入和离开的人员。`希尔顿酒店`（Hilton\
  \ Hotels）正将其门锁系统与手机应用程序同步，允许客人办理入住并打开房门，无需在前台取钥匙。\n\n这些网络设备的危险之处在于不速之客可能黑入你的家，确定你何时不在家以及你的日常生活规律。几年前，`美国商会`（U.S.\
  \ Chamber of Commerce）曾遭到看似为中国黑客的入侵，他们通过一个联网的节能智能恒温器的漏洞进入。攻击者对 `商会` 网络中的所有内容拥有了数月的访问权限，包括贸易政策秘密。直到\
  \ `联邦调查局`（FBI）识别出入侵并通知了 `商会`，黑客攻击才被停止。最近，一家用于操作灯具和其他插电设备的远程系统制造商收到警告，称这些设备代码中的缺陷将允许外部人员不仅获得连接到遥控开关设备的控制权，还能访问连接到同一无线网络的任何其他设备。这可能让黑客远程控制家电，并让入室者知道人们何时在家。再举一个例子，俄亥俄州使用联网婴儿监视器的父母被一个男人的大喊声“醒醒，宝宝！”所惊醒。由于没有更改默认密码，该监视器被轻易破解了。\n\
  \n研究人员还证明，联网冰箱可以被黑入并用于发送大量的骚扰性广告——垃圾邮件。酒店锁和家用报警器也曾被黑入。\n\n即使是儿童玩具也无法幸免。在本书的引言中，我将一个孩子娃娃描绘成一种收集家庭大量数据的手段。这种场景并非不可能。`美泰集团（Mattel）的\
  \ Hello Barbie` 娃娃也开启了无线功能，以便将孩子的话语传输到服务器，以触发真实的反应，就像真正的对话一样。起初，该连接未受保护，这意味着它可以被伪造——也就是说，黑客可以将其变成窃听设备，或者更糟糕的是，直接与孩子发起对话。\n\
  \n尽管这些计算机支持的、联网设备日益增加，但它们仍然是网络生态系统中最为脆弱的黑客目标之一。这些联网设备中的每一个都配备了一个微型嵌入式、功能强大的计算机处理器，和一个旨在执行少数功能的操作系统。结果是，该处理器不太可能受到防病毒软件或其他方法的保护，并且可能无法进行更新。处理器的配置通常不具备（也不支持）允许对缺陷的软件代码或漏洞进行修复。事实上，电脑打印机是黑客寻求进入网络的热门目标。打印机的处理器、内存和网络连接很少更新，使其成为容易捕捉的猎物。你上一次更新打印机上的嵌入式固件（称为\
  \ `firmware`）是什么时候？如果脆弱的智能设备没有与网络上的关键节点隔离，恶意感染可能会迅速遍整个网络，规避任何网络边界防御。\n\n\n`数据 3.0`\
  \ 革命的政策和法律影响影响着至少三类参与者：连接到互联网的个人公民和企业；从安全角度接触互联网的政府；以及在互联网上运营或服务的私人科技公司。\n\n个人和大多数商业企业产生了关于自身的大量数据（无论是故意的还是作为日常活动），但很少有人了解其全部范围。因此，访问数据的第三方有能力监控并获取关于个人和企业的大量信息：他们的通信、计划、行为，甚至是观看阅读习惯。此外，通过犯罪、知识产权盗窃甚至恐怖主义，受害用户的风险也在增加。这些变化对我们的隐私构成了巨大挑战，对安全也是如此。\n\
  \n政府也面临这些新的漏洞，同时也获得了极大增加的监控和间谍活动机会。`国家安全局`（National Security Agency）网站上一张显示新犹他数据中心的图片写着：“欢迎来到犹他数据中心”，随后是一句话：“心心虚者，无所畏。”\n\
  \n当我们从共同理解的基础上进行交流时，人类相处得更好。我们都知道，在餐桌旁或卧室里的对话并不总是适用于公众的。允许存在私密的个人表达空间，让思想得到探索和挑战，让信仰得到巩固或传播，并不是坏事。\n\
  \n\n\n\n\n事实上，人事管理局的数据泄露事件表明，现代数据技术如何改变了国家通过间谍活动收集海量信息的能力。在十年前，盗取数百万份人事文件根本是不可能的，甚至是不值得的。首先，收集、复制和传输这些数据当时是无法实现的。（想象一下，冷战时期的苏联特工在复印机前或使用微型相机耗费数小时来复制文件。）相比之下，现在只需几分钟，数\
  \ TB 的数据就能下载到优存盘中并装进口兜里带走。\n\n更重要的是，这些数据在 20 世纪毫无意义，因为没有任何分析师团队能通过关联这些数据来识别出模式或线索，从而检测出卧底或非官方身份特工。大规模数据分析的出现，使得这类信息宝从一开始就具有盗取的价值。从这个意义上说，数据分析革命让常规信息通过间谍手段获取变得有利。\n\
  \n除了机密信息泄露的风险外，还有数据完整性的风险。随着政府运营功能（如保险注册甚至投票）转向线上，数据完整性受损进而影响政府核心运营的风险也随之增加。事实上，中国已明确将“信息战争”概念作为其军事理论的一部分。这一概念涉及针对敌方的军事和社会信息结构，以干扰敌方的战斗能力。\n\
  \n1988 年，被誉为中国信息战争理论之父的沈卫光博士在一场讲座中描述未来的战场将是隐形的。那将是一个“受病毒感染的微芯片”影响武器系统的战场。自毁微芯片上的逻辑炸弹可以被植入，供未来对敌人使用，通过让对方的武器失效.^(2)\
  \ 这让人们想起孙子古代《兵法》中“摧毁敌方发动战争或进行战争的意志”的概念。^(3)\n\n信息战争并非理论。2008 年，俄罗斯人攻击了格鲁亚政府通信网络，以为在入侵格鲁亚南奥塞梯的军事行动期间地面作战提供支持。\n\
  \n因此，随着互联网表面的扩大和入口点的激增，攻击向量也在扩张，政府对保护其数据及其互联网控制系统的需求日益增长。这就是为什么自 20 世纪 90 年代以来，每一届总统政府都强调网络安全任务。2016\
  \ 年，国家情报局主任将网络攻击确定为*首要*的国家安全威胁。\n\n最近最近，俄罗斯特工利用黑客手段试图颠覆美国和欧洲的选举进程。正如美国情报部门公开证实的那，在\
  \ 2016 年总统大选中，俄罗斯黑客组织渗透并窃取了希拉里·克林顿竞选团队的电子邮件；这些邮件随后被公开，造成了令人难堪的后果。对 39 个州选民数据库的进一步调查显示，选民数据系统遭到了渗透或探测，并存在选民数据泄露的风险。^(4)\
  \ 而且这些“信息行动”——通过选择性或扭曲性发布信息来实施颠覆——不仅限于美国。近年来，可能与俄罗斯集团有关的犯罪黑客访问了德国政党智库的数据库，甚至访问了德国联邦议院（Bundestag）。民主政府的各种运行机制本身已成为网络目标。\n\
  \n但增加政府风险的相同技术也增强了政府的防御能力。随着数据和通信从电话、无线电转向在线传输，截获或收割数据的机会呈指数级增长。这种收集对于防御上述此类网络攻击，以及防御国际恐怖分子或“独行侠”的物理攻击都至关重要。因此，一方面，互联网带来的风险增加凸显了政府采取措施保护公民的重要性，包括监控在线上的威胁和攻击。与此同时，政府也有更多机会滥用这些能力进行压迫性目的。\n\
  \n正如上一章所述，提供互联网服务或收集持有数据的私营企业对隐私构成了更新的挑战。许多全球市值最高的数字公司（如 Google 和 Facebook）其业务很大程度上依赖于获取、分析和营销通过互联网产生的数据。这些数据有时是用户主动选择生成的，有时是企业活动的副产品，且用户对此不知情。在许多方面，私人数据公司在收集、整合、分析和使用数据方面已经超过了政府。由于互联网已成为生活中不可或缺的工具，人们保护隐私变得越来越困难。\n\
  \n挑战在于，如何使 20 世纪的数据 2.0 法律政策结构适应新的数据 3.0 环境。\n\n\n在数据 2.0 时代，私人与公共通信之间相对清晰的界限意味着政府直接针对个人通信的监管限制相当严格。然而，当这些数据由目标个人以外的人员持有时，其获得的法律保护极小。因此，根据所谓的“第三方原则”，自愿访问或传递给第三方的信息（例如电信公司持有的账单记录，即元数据）受保护有限。\n\
  \n*史密斯诉马里兰案*说明了这一点。20 世纪 70 年代后期，在巴的摩，帕特里夏·麦克农遭到了抢劫。她看到了抢劫她的人，以及案现场的一辆 1975 型福特轿。她将这些细节给了警方。抢劫后，麦克农开始接到一个自称是抢劫者的威胁电话。在一次电话中，该男子要求她走到前廊。当她走出去时，她看到一辆\
  \ 1975 型的福特轿驶而过。她将车牌号给了警方，警方随后查出那辆车属于迈克尔·李·史密斯.^(5)\n\n第二天，警方让电信公司安装了笔迹器（一种跟踪电脉冲的机械装置）来记录从史密斯电话拨出的号码。通过笔迹器，警方发现史密斯确实给麦克农打过那些威胁电话。警方随后对史密斯的住所进行了搜查，发现了一本电话簿，上面高亮了帕特里夏·麦克农的名字。史密斯最终被定抢劫罪，并判处六年监禁。\n\
  \n\n\n\n在上诉中，史密斯主张任何来自拨号登记器（pen register）的证据都应被排除，因为政府未能获得拦截对话所需的搜查（根据 `Katz` 案）。最高法院认为，拨号登记器并未侵犯任何财产利益，因为它被安装在电信公司而非史密斯的家里，而且史密斯对其手机拨打的号码并不具有“合理的隐私预期”。法院指出，电话用户“意识到”他们是自愿将拨号号码提供给电信公司以便通话的。此外，电话簿通常包含一份通知，说明电信公司可以帮助警方识别具有威胁性的电话。\n\
  \n`Smith` 声称，个人对其自愿传输给第三方的信息不享有合理的隐私预期。根据 `Smith` 及其其他法院案件，个人在公共街道上不受限制地跟踪和拍照，政府可以出于任何合法目的利用这些信息。根据同样的原则，由银行或电信公司生成或传输的记录，其受保护程度低于这些文件处于原始创建者或所有者手中时所受的保护。\n\
  \n但在如今的数据 3.0 时代，由于缺乏信息摩擦，在公共空间或通过第三方收集的数据在数量、全面性和持久性上呈指数级增长。此外，随着现代大数据分析的发展，这些数据更容易揭示关于个人思想和行为的深层洞察。例如，在历史上，个人可能在公共广场被定期拍照，甚至在一段时间内被执法部门跟踪；但在现代技术下，人们可以汇总视频、手机数据、定位\
  \ GPS 数据和其他信息，创建一个关于该个人活动和关联的虚拟 24/7 地图。\n\n同样，第三方数据——如个人的电话和银行记录，如果以足够大的规模进行收集并与他人生成的类似数据相结合——就可以通过算法进行分析，生成个人行为和信仰的完整图谱，甚至可能预测其未来的行为。这些政府能力的一个显著例子是弗雷斯诺警察局实时犯罪中心运行的一项软件程序。它会每个嫌疑人分配一个威胁分来评估其危险程度，就像信用评分评估信用状况一样。该系统搜寻数百万条公共数据条目，例如财产记录、商业数据库、犯罪记录、社交媒体帖子以及其他数据、视频和车牌读取信息，以及从手机塔下载的手机站位置信息\
  \ (`CSLI`)。基于这些以及其他数据（所有在公共场合均可见），该软件工具会对得分超过特定水平的人员分配风险警告（绿色、黄色或红色）。\n\n再以加利福尼亚州的埃尔格罗为例，这个萨克拉门托郊区在全市安装了\
  \ 100 多路摄像头画面。视频直接发送到警察局服务器，允许警员随时审查。在历史上，如此数量的监控设备的效率取决于监控它们的警察人数。这种情况随着数据分析软件的出现发生了变化。现代视频分析工具允许警察使用“人脸识别、车牌读取器和基于对象的搜索”。警察可以在几秒钟对数周的视频流进行搜索，寻找特定的车牌号或嫌疑犯的脸部。不再需要许多警察监控所有摄像头。只需几个人就可以监控整个城市，并根据选定的算法或犯罪高发区域接收警报。\n\
  \n分析能力还具有显著的反恐主义潜力。在恐怖分子和罪犯加密或通过其他方式掩盖通信日益复杂的时代，收集细微的元数据和其他数字痕迹可以与地理分析软件相结合，以预测恐怖分子可能在哪里躲藏、制造炸弹或训练。例如，随着用户无意识模式的出现，可以识别出伪装成看似随机位置通话的规避步骤。这些模式就像行为抽动，有助于三角定位恐怖分子居住和活动的地方。\n\
  \n最后，为了正常运行，手机必须与手机塔通信。随着手机的移动，设备会继续与附近的塔台进行“注册”。已经开发了一些工具，允许执法人员利用这种通信在几乎任何地方锁定并定位罪犯。这些设备中的一个被称为\
  \ `StingRay`，它模拟手机塔的操作，通过与附近的所有手机通信来发送/接收运营商信号。通过将每个手机的唯一识别码与其他进行对比，警察可以极高精度地找到手机位置。这些手机站模拟器目前在执法部门手中。然而，历史显示，技术往往向外渗透并供所有人使用，使每个人都容易成为追踪和监控的目标。\n\
  \n\n从公民的身体甚至在线安全的角度来看，这些新的批量数据工具让执法部门更容易预防犯罪和恐怖主义，并在必要时捕获罪犯和恐怖分子。但它们也表明，与传统认为受隐私权保护的内容相比，当局掌握的关于无辜平民的“公共”数据量是巨大的。与政府可以公开获取和使用的内容相比，剩余受保护的内容几乎可以忽略不计。\n\
  \n校准已经迫不容缓，现在是时候考虑对即使是公共行为的监控应该提供哪些额外的个人保护了。面对现代国家，我们的挑战是保留对个人信息的足够的控制权，以确保个人自主。\n\
  \n这些问题已经开始探索，但尚未由美国法院定论。在 `United States v. Jones` 案中，几位大法官提出了这样可能性：大规模公共监控可能需要目前适用的法律限制。案件事实非常简单，最初看起来这只是一个原则的常规应用，即公开可见的公共行为获得最少的隐私保护。\n\
  \n2004 年，FBI 和华盛顿特区警方开始怀疑夜总会所有者安托万·史密斯正在贩运毒品。尽管他们没有有效的搜查令，但作为调查的一部分，当局在史密斯妻子的吉普越野车停在公共停车场时，在其安装了一个\
  \ `GPS` 设备。在连续 28 天内，该设备生成了关于该越野车的每一次移动的数据，精度在 50 到 100 英尺以内。该设备产生了 2000 页数据。追踪显示了被告前往一个毒品窝点的行程，当局在那里发现了\
  \ 97 公斤洛柯因、1 公斤海洛碱和超过 80 万美元现金。被告寻求排除从 `GPS` 获取的证据，宣布其为无搜查令的搜查，他的案件一直上到了最高法院。\n\n\
  九位大法官都同意，通过附带的 `GPS` 在公共场所跟踪汽车属于搜查，并且由于没有搜查令，证据必须被排除。但不同的意见展示了数据 2.0 时代与数据 3.0 时代之间分析上的断层线。\n\
  \n\n\n\n\n\n大多数法官加入了一份起草得严谨的意见，该意见根据 `GPS` 在汽车上的物理位置对搜查行为进行了分析。根据传统学说，极微的物理附着就足以构成“侵入”行为——如上文所述——这正是隐私保护的依据。\n\
  \n但有几位法官并未将他们的反对意见归因于物理侵入，而是归因于持续时间的过长。在他们看来，当技术允许公共监控超过“对隐私的合理预期”时，就构成了对《宪法》第四修正案保护隐私的侵犯。\n\
  \n第一次，一些法官表示，对于短时间内可能被观察的活动，如果技术允许进行长时间的观察，就可能具有隐私性。本质上，他们发现技术的消除意味着，对公共空间内的个人进行持续监控实际上等同于侵犯隐私。其中一位法官甚至更进一步建议，或许在某些算法分析此类数据之前，应该存在更进一步的门槛。正如索托马约尔法官解释过的，由于现代能力的影响，现在向第三方披露信息的使用可能值得额外的隐私限制。这些法官提出了一个问题：数据存储是否从根本上改变了公共信息的定义，从而使得需要对个人自由进行新的保护。\n\
  \n法院随后的裁决在基于收集大量手机数据的定位追踪是否值得新的限制方面一直存在分歧。此类信息收集可能需要搜令，要么是因为其持续时间过长，要么是因为手机被带入了私人空间（如家中或办公室）。2016\
  \ 年 5 月，美国第四巡回上诉法院裁定，允许政府追踪智能手机用户的位置不需要搜令。法院推理认为，根据“第三方学说”，智能手机用户已经同意了该服务。由于他们自愿放弃了地理位置，第三方服务提供商可以将该信息共享给政府。\n\
  \n但为了充分理解这一裁决的背景，请注意：近三分之二的美国人现在拥有智能手机。最高法院已就 `Carpenter v. States` 一案进行了辩论，该案涉及获取手机数据是否需要司法搜令。此案的决定将决定美国当局几乎持续地理定位的未来，尽管这对外国政府没有影响。如果法院不对获取此类数据施加某些搜令要求，风险在于，现代智能手机技术的使用（最初是一种便利，很快就成为许多人的必需品）将开始包含自动政府追踪功能。\n\
  \n## 莱利诉加利福尼亚州案\n\n这场数据存储革命也是 `Riley v. California` 一案最高法院裁决的核心。在一次交通拦截发现莱利车内有装弹枪后，警方逮捕了大卫·里昂·莱利。警方没收了莱利的手机，并搜索了他的联系人、信息、视频和照片。政府部分基于这些数据指控莱利参与了一起无关的枪击案。莱利被定罪，加利福尼亚州上诉法院维持了判决，依据是长期法律原则：被捕人员身上或触及范围内的物品可以由警方自动搜索，无需搜令或合理理由（“逮捕现场搜查”原则）。其他法院包括第一巡回在\
  \ `United States v. Riley` 案中得不同的结论。最高法院受理上诉以解决这一分歧。在 `Riley` 案中，最高法院由罗伯斯大法官发表一致意见，裁定：在没有紧急或特殊的情况下，警方在逮捕期间搜查手机需要一份具有合理理由的搜令。法院认为，搜查手机并不促进政府的两大利益：警员安全和证据保护。\n\
  \n警方可能在逮捕时自动搜索个人身上的手机。法院将手机定性为“微型计算机”，强调了它们与被捕者身上其他物品的显著区别。法院承认，传统上，对合法逮捕人员身上的物品可以在没有司法搜令的情况下进行搜索，因为搜查范围有限（仅针对该人员携带的物品）。但正如法院观察到的，手机的存储容量以及这些设备通常是通往云端海量数据的密钥这一事实，改变了被搜查对象的性质。`Riley`\
  \ 的意见并未决定在警方正当没收的原始数据受到分析算法处理之前，是否还需要进一步的司法许可。\n\n\n`Riley` 裁决是一个重要的决定，但它并没有解决所有与执法部门使用手机数据相关的隐私问题。纽约州的立法者考虑过引入\
  \ `Textalyzer`（短信检测仪）来执行禁止开车发短信的法律，就像酒精仪帮助阻止醉驾一样。该设备将允许到达交通事故现场的警务人员判断司机是否在发送短信、电子邮件或使用纽约州禁止的其他手机功能（因为使用这些功能需要双手握方向盘）。尽管它不会允许一毯子的搜索，但\
  \ `Textalyzer` 如果被引入几乎会面临法律挑战，而 `Riley` 案将因此发挥作用。\n\n\n\n\n\n美国海关和边境保护局（CBP）因在 2017\
  \ 年初在边境对个人手机进行检查而引发了日益增加的审查，这使其公开重申了其在边境检查手机的权限，并发布了统计数据说明受此类检查影响的游客人数较少。这一争议导致几位参议员提出了一项法案，禁止\
  \ CBP 在边境对美国公民和绿卡持有者进行手机检查，并向该机构要求对其手机检查政策进行澄清。CBP 随后对参议院的质询做出回应，澄清其检查权限不允许其务员检查存储在云端的任何数据，包括社交媒体。\n\
  \n出乎意料的是，法院在边境检查手机或笔记本电脑时应提供的保护水平上存在分歧。例如，加利福尼亚州的一个联邦法院允许在无搜查证的情况下检查手机中的号码和短信，而华盛顿特区的联邦法院则否决了对边境检查的笔记本电脑进行无证搜查。最终，即使是在边境——法院传统上倾向于政府的安全利益而非个人的隐私利益的地方——鉴于笔记本电脑、电脑和其他设备上存储的数据量，法律也必须适应。在不久的将来，即使是对移动设备的边境检查也应该要求充分的理由证明，并且可能需要司法搜查令，因为这些设备实际上是访问存储在世界各地数据库中的个人数据的门户。\n\
  \n### 数据 3.0 威胁环境\n\n在假设对数据 3.0 的普遍反应在所有情况下都是对政府实施更多限制之前，请考虑我们描述的新技术也放大了对个人公民的威胁。对政府使用新技术的过分限制可能会使平衡向恐怖分子和犯罪分子倾斜。数据\
  \ 3.0 极大地增加了危险分子扩大其网络的能力，并为他们提供了新的矢量，以攻击、伤害甚至杀死无辜平民。近期事件表明，互联网是恐怖分子的招聘和培训工具。\n\n\
  正如西点军反恐中心最近的一份报告详细所述，ISIS 通过识别搜索或登录特定网站的人来招募美国和欧洲人。ISIS 与他们建立友好联系，然后缓慢地将他们培养为潜在的招募对象。这一过程利用社交媒体鼓励目标招募对象从非支持者和主流穆斯林中孤离开来。接下来是私信，鼓励他们迁移到伊斯兰国、进行独狼攻击或提供资金支持。根据《纽约时报》的一篇报道，居住在华盛顿州与其祖父母住的\
  \ 23 岁女性 Alex 每天都会与叙利亚的一名 ISIS 战士和其他支持者在线聊天数小时。他们通过 `Skype` 教她伊斯兰教的基础知识，并送给她价值 200\
  \ 美元的在线伊斯兰书店购物券、头巾、巧克力，最后是带有伊斯兰教极端解释的传单。当 Alex 了解到家五英里外的清真寺时，她被阻止去那里。Alex 与对话者讨论了自杀式炸弹的宗教理由，一名\
  \ ISIS 支持者还为她提供了前往奥地利包婚姻的旅行。怀疑她被招募，Alex 的家人干预了并拨打了 `FBI`。\n\n如果没有追踪并连接广泛分散网络中的点，就没有可靠的方法来检测那些根据定义不穿制服或不表明身份的恐怖分子或招募人员。截至\
  \ 2016 年初，约有 6600 名西方男女（包括 250 名美国人）前往伊拉克或叙利亚为 ISIS 作战或以其他方式支持它。此类招募人员的平均年龄为 24\
  \ 岁。2015 年，美国至少有 60 人因犯罪支持伊斯兰国被捕。\n\n除了招募和煽动恐怖分子外，互联网还可以实施攻击的实际手段，干扰、损坏甚至破坏数据系统以及连接它们的物理控制系统。随着物联网的普及，破坏性攻击的机会增加了。\n\
  \n回想乌克兰的电网黑客事件。当攻击者黑入 `SCADA` 网络时，电网被禁用，关闭了约 30 个变电站的控制开关，然后擦除了控制计算机使其失效。这次攻击导致控制系统“突然盲目”，并发布了一份虚假报告，看起来电力正在流动，而实际上电力已经关闭。次要的电话中断攻击阻止了技术人员通过电话获取更新。这导致客户无法来电报告停电情况，进一步延迟了纠正系统的响应。\n\
  \n2014 年，人们发现在乌克兰攻击中使用的相同恶意软件的一个变体——一种 `BlackEnergy` 后门木洛伊病毒——自 2011 年以来一直存在于美国电网中。尽管该病毒在发现后被移除，但黑客继续向电网部分植入其新变体。对于这种病毒仅仅是侦察手段，还是可以远程激活的潜在破坏性工具，目前仍存在争议。乌克兰人在许多方面是幸运的。乌克兰电网没有美国系统那样自动化。尽管在物理上很远，但乌克兰存在手动开关以恢复电网的操作性。如果其自动控制系统被损坏，美国网络可能无法轻易恢复。\n\
  \n检测和阻止上述威胁的唯一方法是匹配攻击者在网络上的全面“战场”。这种方法有两个维度。\n\n首先，政府必须对互联网上的招募和其他通信有充分的认识，以便能够识别萌芽状态的威胁。这意味着要么具有收集公共信息的能力，要么在有适当保护的情况下拥有法律权限来拦截更多私密通信。\n\
  \n其次，为了应对互联网本身成为威胁载体的情况（间谍；侦察；系统的干扰或破坏），政府需要网络时代的雷达。\n\n至少，政府必须能够监控和评估关键基础设施网络的恶意软件包。此外，像\
  \ `Tor` 浏览器工具可能会创建一个法律真空区，非法或恐怖活动可以在其中滋生。政府渗透深网并识别那些希望保持匿名的人的权限应该是多少？作为推论，政府应如何处理可用于掩盖威胁活动的加密？政府使用其工具破解加密或为了情报收集目的利用漏洞是否正确？进一步来说，法律是否应要求服务提供商保留解密密钥？\n\
  \n\n\n\n\n\n协调日益增长的隐私担忧与当今政府安全需求的一种方法，是拆解监控的阶段，并将这一过程视为一个连续体。\n\n![](img/121-1.png)\n\
  \n`Access`（访问）是指收集数据的能力（尽管尚未被使用）。它可能包括预置的基础设施、预先的法律安排，以及解密获取的任何加密通信的能力和专业知识。访问不会立即损害数据隐私，尽管如果使用不当，可能会导致这种情况。\n\
  \n`Collection`（收集）是在不检查或审查的情况下获取数据的过程。政府越来越多地收集大量信息作为一种对冲——以防未来可能需要审查。廉价存储容量的进步使得这成为可能。\n\
  \n`Retention`（保留）是机构对已收集或检查的信息保留多久的决定。机构保留数据的时间越长，挖掘数据模式的能力就越强。但更长的保留也意味着数据更容易受到威胁。\n\
  \n`Inspection and Analysis`（检查与分析）是指某或某物查看并处理所收集的内容。在情报领域，关键的授权时刻通常被认为不在收集阶段，而是在检查阶段。（注意人工审查与机器审查之间的潜在区别；机器可能作为例行工作审查数据。）通过将关键时刻从收集转移到检查，情报部门能够吸取信息，而在其对数据进行审查或采取行动之前，不会触发隐私保护。\n\
  \n`Dissemination`（传播）是将数据从一个实体（例如，收集者）共享另一个实体（例如，审查者）的决定。共享数据使其能够有更多用途，我们可能希望限制某些实体使用某些数据。例如，如果\
  \ `NSA` 收集了包含美国人员信息的通信数据，它何时可以与这些数据共享给如 `FBI` 等面向国内的机构？这个问题是唐纳德·特朗普总统指控的核心，他指责情报机构不当地“去掩码”（unmasking）或揭露了其助理的身份，这些助理在与俄罗斯官员的通信中被无意截获了。\n\
  \n与更多实体共享数据也可能使数据变得更加脆弱。\n\n`Action`（行动）发生在机构根据收集的数据采取步骤时，例如处理索赔、起诉嫌疑人或针对恐怖分子。对信息使用的限制或关于可能产生后果的规则将开始发挥作用。这包括对原始数据应用`predictive\
  \ analytic techniques`（预测分析技术）。机构何时可以获取数据集，使用它们来预测关于个人的行为，然后根据这些预测采取行动？\n\n观察这一连续体使我们能够识别可以监管个人自主保护点。在每个阶段，我们都可以同意允许（或禁止）法律当局访问、收集、保留、检查、传播或对数据采取行动。\n\
  \n美国传统的保护隐私监控政策是将收集视为关键阈值。因此，宪法判例法很大程度上取决于收集实体物品或截获音频通信或记录视觉数据时是否需要搜查令和合理理由。然而，一旦收集被允许，对该数据的保留、分析或进一步传输几乎没有限制，尽管联邦法律《1974\
  \ 年隐私法案》（Privacy Act of 1974）确实合法收集信息的使用和传输限制在合法的政府范围内。相比之下，在欧洲，不仅收集，保留和使用也受到单独法律限制（下文将详细介绍）。\n\
  \n一种对监控连续体的各个阶段采取单独、更精细限制的法律模型将使社会能够更好地兼顾对个人自由的担忧，以及同时对保护我们所有人安全的更先进工具的需求。这本书敦促我们促进潜在的访问甚至收集，同时对数据的使用、保留和传播增加更严格的限制。\n\
  \n\n在美国历史上，当涉及窃听或视频监控时，只要没有对私人财产的物理侵入，对访问（即政府开发收集技术或安装技术的能力）几乎没有限制。这一原则的一个例外出现在\
  \ 20 世纪 90 年代中期，当时有一场关于电信运营商是否应被要求在法院命令时确保新的加密技术被修改以以便进行窃听访问的辩。1993 年，克林顿白宫引入了“加密器芯片”（Clipper\
  \ Chip），这是一种由政府开发的微芯片，可以安装在电话中，为私人提供加密，但仍允许政府访问。在启动加密语音通话之前，`Clipper Chip` 会向“密钥托管”发送数字签名，以便政府可以获取密钥并解密通话^(41)。`Clipper\
  \ Chip` 引发了激烈的辩论，预演了今天的加密争议：政府警告称缺乏访问，而隐私倡导者、技术专家和行业领袖则反对这一措施，认为它损害了对美国产品和服务隐私保护的信任，并为潜在的黑客和犯罪分子制造了后门。加密领域有影响力的领袖的一份报告谴了\
  \ `Clipper Chip`^(42)。最终，由于争议，并没有对 `Clipper Chip` 实施要求。但在 2016 年，`FBI` 启动了一项类似的努力，强制互联网服务提供商和设备制造商包含后门或重复密钥，以便政府可以解码通过互联网传输或存储在智能手机等设备上的加密数据。关于这一努力的争议尚未解决。\n\
  \n目前、过时的法律框架既涵盖不足又过度。例如，随着数据和现代分析的激增，没有直接、明显意义的信息在随后从更广泛的源中获取的数据语境下，可能会获得重要性。这对于追踪恐怖分子或网络罪犯之间的联系可能至关重要。如果原始信息没有被很好地收集和存储以便后用，其价值可能永远丢失。\n\
  \n另一个相反的危险是，鉴于目前收集公共行为数据的门槛很低（例如，通过伦敦和芝加哥等许多大城市的摄像头），这些同样的存储和分析工具可能会让当局对无辜主体的政治和社会活动获得不受限制且详细的\
  \ 24/7 画像。这表明，`Data 3.0` 世界中的紧张关系只有只有通过放宽可以收集的信息，并同时收紧对其检查、分析和使用的标准才能得到解决。\n\n更具体地说，随着私人和公共界限不断演变，政府情报频谱的每个步骤都需要重新审视和调整。\n\
  \n`Access` 应该是政府获得相对广泛权限的领域，以确保它可以收集所需且授权的情报。但私营部门不应被要求为了这种访问而削弱安全性。\n\n\n\n\n要求公司在构建系统中植入漏洞将是一个战略性错误，而且将违背我们的民主价值观——从历史上看，我们组织社会的方式并不是为了最大化政府对通信的访问权限；相反，我们进行权衡。正如我所主张的样，“更大的公共利益是安全的通信基础设施，这种基础设施在设备、服务器和企业级受到无处不在的加密保护，且没有为政府监控提供手段。”^(43)\n\
  \n当政府发现一个预先存在的漏洞并以此访问，但该漏洞也意味着结构性的安全缺陷，可能被包括犯罪在内的其他人利用时，也会面临类似的困境。例如，美国国家安全局（NSA）被某些分析师怀疑利用了瞻网络（Juniper\
  \ Networks）路由器中的后门漏洞，这可能削弱了加密，允许加密流量被解密。^(44)更广泛地说，NSA 已透露其在“超过 90%的时间内”会分享有关最关键软件漏洞的信息。^(45)\
  \ NSA 利用剩余的漏洞来执行其工作，或将其留作“零日漏洞”（从未被使用过但具有攻击潜力的缺陷）。在这种情况下，政府并没有在创建访问权限，但也没有提供存在缺陷的警告，从而导致其自身可能可能其他人获得了访问权限。\n\
  \n安全官员认为，软件中此前未发现的安全缺陷对于出于情报目的获取对手数据是有帮助的，但当这些安全漏洞广泛分布时，会使个人公民面临来自犯罪分子、恐怖分子甚至外国国家的安全侵害风险。\n\
  \n当许多无辜的人可能因为广泛漏洞而面临风险时，有强有力的论点认为政府应该发布通知并警告该漏洞，即使情报官员因此失去了用于间谍目的的访问权限。另一方面，如果安全漏洞仅存在于少数主体中（可能大部分是敌对政府的官员），或者犯罪分子在技术上难以利用该漏洞，则可能没有必要公开披露。\n\
  \n当然，政府应该能够利用自己的专业知识，建立在法律授权的针对性基础上访问信息的能力，但不应要求私营公司和公民设计故意削弱以提供政府访问权限的系统。同样，应该推定政府会向服务提供商警告广泛分布的网络或软件漏洞。\n\
  \n\n对政府收集不同类型的数据应该施加多大的限制，是一个更具争议的问题。如之前所述，对政府监控的传统法律障碍通常发生在收集阶段。在境内或处理涉及美国公民的事务时，通信的收集受到司法授权令要求的严格限制。正如前文描述，对元数据（metadata）的收集限制较少。一些人认为，即使是对元数据收集的限制也应该实质性加强，也许通过“可能理由”的要求。\n\
  \n在我看来，在国家安全和网络安全领域——其目标是预防而非起诉——对非内容元数据的收集应该是相对宽松的，不需要具备特定的“可能理由”来相信犯罪将要发生或已经发生。特定数据与国家安全的关联性通常在收集机会过去很之后仍然不明确。一旦数据丢失，就永远无法恢复。如果不收集，再进行审查和分析就太晚了。收集只要防止未经授权的审查，就不会构成重大的隐私或自主权风险。\n\
  \n诚然，收集和存储数据的能力并非遥远的可能。NSA 于 2013 年在犹他州布拉夫代尔（Bluffdale）的沙漠完成了其占地 100 万平方英的数据存储设施。犹他州州长盖·赫伯特（Gary\
  \ Herbert）将该设施描述为世界上具有存储西亿字节（一万兆 GB）数据能力的设施。^(46) NSA 本身将该设施描述为“为了未来的扩展而建造的”，使得存储数据的能力具有活性且不断增加。^(47)\n\
  \n政府需要这种规模的数据来执行其保护工作。但如果数据由私方（如电话或通信提供商）收集并持有，并且仅在达到法律阈值时供审查，那么确保只有授权的政府检查和使用收集数据的担忧可能会进一步减轻。这就是最近的《美国自由法案》（USA\
  \ Freedom Act）关于手机元数据的理论。但只有当法律满足两个要素时，这种方法才是实用的。首先，必须强制私方在指定的、而非无限的时间段内存储数据——例如，两年。这样，当新信息出现时，数据就可供审查，以便得出分析结论。其次，数据应以执法部门或情报机构易于搜索的格式维护。如果政府获得搜查令从第三方处收集此类数据，这些机构希望能够轻松读取它。\n\
  \n一些欧洲国家有管理数据保留的法律。法国《内部安全法》为收集的数据设定了保留期，在某些情况下短至 30 天。^(48)法国国家情报监督委员会还可以建议停止监控活动或销毁收集的数据。^(49)2014\
  \ 年，欧洲最高法院否决了一项指令，该指令要求欧盟国家确保电信服务提供商保留 6 至 24 个月的数据。法院的理由是，该指令涉及对基本权利的干涉，且该指令未提供足够的保护措施来限制数据保留并保护收集的数据免受滥用。^(50)\
  \ 虽然这些欧洲裁决中规定的时间范围在我看来短得不切实际，但合理持续时间的时间限制这一原则是有意义的。\n\n\n对于访问和收集，我建议赋予政府较大的自由裁量，但对收集数据的实际检查（以及基于这些数据的进一步传播或官方行动）可能需要对政府实施重大隐私限制，甚至要超出目前的做法。这是\
  \ `United States v. Jones` 案中几位法官的见解：即使政府收集数据目前在极低的关联性门槛下是法律允许的（例如街头摄像头监控），由于数据量巨大，对这些数据的审查和使用应在没有搜查令的情况下禁止政府进行。在\
  \ `Jones` 案中，萨缪尔·阿利托（Samuel Alito）法官强调，尽管在安托万·琼斯（Antoine Jones）妻的吉普车底部安装 `GPS` 在技术上属于侵入，但它是是是微不足道的；真正重要的是政府对数据的使用。^(51)\
  \ 索尼娅·索托马约尔（Sonia Sotomayor）法官特别担心政府存储 GPS 数据并“在未来几年内对其进行高效的挖掘”。^(52) 因此，她建议警察即使是短期的\
  \ `GPS` 监控也可能受到监督。^(53)\n\n\n\n对先前收集的数据的使用正受到日益严格的限制。随着数据全球流动成为跨国贸易的因素，欧洲对限制数据使用的观点不可避免地影响着美国的国内规则。在\
  \ 2015 年的一起法律案件`Schrems v. Data Protection Commissioner`中，欧洲最高法院废除了“安全港”协议（Safe\
  \ Harbor），这是一项美欧之间的协议，允许美国公司自我认证其符合欧盟数据隐私标准。奥地利隐私活动人士马克西西米利安·施密斯（Maximilian Schrems）指控爱德华·斯诺登的未经授权披露显示，美国对传输到美国的欧盟客户数据提供的隐私保护不足。法院认为，“安全港”安排让美国当局获取了过度的数据访问权限，并提供的司法救济手段不足，因此得出结论，“安全港”协议违反了《欧盟基本权利宪章》中的私人生活权。2016\
  \ 年 2 月，美国同意了一项新的“欧盟隐私盾牌”框架，要求美国公司对欧洲人的个人数据提供更强的保护。\n\n更进一步：在某些类型的预测性分析工具（包括所谓的人工智能）应用于政府收集的数据之前，应该存在额外的法律门槛。人工智能可以对一个人的传记数据进行详细分析，并此此行为预测。当行为预测算法实际上为某个主体分配风险分时——如之前讨论的弗雷斯诺警方软件案例那样——就需要额外的保护措施。当然，对此类分析的使用应该受到限制：仅凭行为预测本身不足以限制这些人员的活动、就业或言论自由的理由。\n\
  \n虽然我们需要分析和预测性工具在预防犯罪和恐怖主义方面变得更“智能”，但应该根据这些分析技术所应用的具体程度进行限制。所谓的“微观定位”（microtargeting）结合了大量变量，旨在预测个人的行为、兴趣和偏好。我们应该对政府将预测性分析技术针对个人进行应用实施严厉限制。尽管如此，我们应该允许政府将预测分析应用于更大规模、匿名的人群。当然，即使是这些技术也可能被滥用以促进种族定型或其他刻板印象。\n\
  \n\n政府应该尽一切保护公民免受网络犯罪和其他黑客的侵害，他们可能试图窃取我们的身份和金钱，冻结计算机数据进行勒索，甚至破坏我们房屋和汽车的基础设施。但我们也应该采取措施来保护自己。历史上最具破坏性的网络安全事件之一是\
  \ 2017 年大规模的 WannaCry 勒索软件攻击，它利用微软操作系统中的一个漏洞冻结了全球计算机中的数据。在事件发生的一个月前，微软发布了一个补丁来修复该漏洞，这本可以防止勒索软件进入网络。遗憾的是，许多网络运营商忽略了下载补丁，导致自己暴露在关闭其网络运行的网威胁之下。对于这些受害者来说，这次网络攻击是完全可以避免的。\n\
  \n大多数连接到互联网的网络都归私人所有。因此，除非我们邀请政府住在我们的计算机里——从而消除了一切隐私——否则我们永远是自己的第一道防线。以下是我们作为公民应该采用的一些简单策略，以降低我们自己网络和数据的风险。\n\
  \n### 第一：留心你传输的数据以及连接到你自己网络的内容\n\n每一个进行在线交易、提供敏感信息或使用公共通信基础设施（如`Wi-Fi`）的决定都伴随着收益和风险。你分发敏感数据得越广，它落入他人之手的可能性就越大。此外，随着物联网的扩大，可以作为攻击面的网络也变得越来越广泛。联网对象并不真的更智能——它们只是连接得更多，为你的网络提供了更多入口点。\n\
  \n事实上，对于关键物理控制系统，你应该询问你的起搏器是否通过无线连接，因为它可能会被破解。现在有些汽车的转向、传动系统和刹车可以通过远程无线连接进行控制。连接这些系统是有价值的，但这种便利值得冒这种风险吗？如果考虑购买这样一种装备的汽车，你应该确保制造商在这些设备中内置了升级安全和修补漏洞的能力，以便它们不易被黑客利用。\n\
  \n事实是，许多这些新的“智能”联网设备在制造时的安全功能低于最低标准。它们很容易被黑客破解并变成一个广泛的远程控制僵尸网络：僵尸网络。在 2016 年的一次事件中，连接到`DNS`服务供应商`Dyn`的打印机、摄像头、婴儿监视器和类似设备感染了`Marai`恶意软件。由于被远程指令产生大量的流量，`Dyn`被冲垮了。互联网用户在数几个小时内无法访问许多网站。在这种情况下，无辜的互联网用户——以及许多知名企业——遭受了数百万个简易家用设备内置安全措施不足的后果。为了保护你的数据并避免让你的设备被劫持成为破坏性僵尸网络的一部分，教训是只购买允许安全更新的联网设备。\n\
  \n### 第二：养成网络卫生习惯这意味着这意味着基本的预防措施。避免简单或明显的密码，或者那些通过研究你的传记就能猜到的密码（例如你母亲的娘姓）。定期更改密码，不要对所有数据字段或网络网站使用同一个密码。如果你通过电子邮件发送受密码保护的文档，不要也通过邮件发送密码。通过短信或电话发送。在可用的情况下使用多因素身份验证，或通过坚持要求电话或短信验证来确认交易的合法性。\n\
  \n### 第三：利用网络安全技术\n\n信誉良好的服务供应商经常更新操作系统以修复漏洞或缺陷，或者建立针对新发现的恶意利用、病毒或蠕虫的防御。务必更新病毒防护程序或下载修补或修复你计算机漏洞的软件更新。\n\
  \n最好的防御是分层防御——即通过在多个层面保护网络数据来检测并解决攻击。许多人认为安全只存在边界，防御就是将恶意软件完全隔在之外。但现实是，某些恶意软件甚至会渗透受防御的边界并进入网络。通常，入侵者在你的网络中停留的时间越长，造成的真实损害就越大。黑客可以使用渗透的初始阶段侦察你的网络，确定什么是有价值的，建立返回到外部控制服务器的通信链路，并窃取可以打开你网络内各个隔间的凭据。\n\
  \n\n\n\n显然，强大的边界防御至关重要，但在你的网络*内部*建立防御同样重要，特别是针对你最敏感的数据。这通过在网络内部对数据进行分段来实现：为你最有价值的数据设置隔间，并要求在访问时时进行进一步的身份验证。对网络内部发生的情况进行持续诊断和监控是关键，因为这些措施可以让你发现有人试图以可疑的方式访问或移动敏感数据。行为分析的最新进展使计算机系统本身能够检测异常行为并发出警报。\n\
  \n最后，生物识别——指纹、面部或虹膜识别——以及数据本身加密技术的发展也是重要的安全赋能因素。加密数据即使被盗，没有解密密钥也是徒用的。我们需要使用加密工具，并考虑用另一种形式的身份验证（如指纹或虹膜扫描）来补充密码要求。\n\
  \n思考安全网络网络架构的一种方法是考虑世界上最灵活的防御系统：人体。我们的身体设计有了针对细菌和病毒的强力外部防御。但这些防御并不能过滤掉一切。我们的免疫系统是第二道防线；当外物进入我们的身体时，健康的免疫系统会对其进行特征，如果它是威胁，我们的白细胞就会将其杀灭。在某种程度上，免疫是与我们的免疫系统进行威胁信息共享的形式：我们的年度流感疫苗告诉白细胞当前流感病毒的“特征”，以便我们的身体能够检测并杀掉真正的入侵者。\n\
  \n\n许多数据泄露事件并不是通过巧妙地绕过软件防御实现的，而是通过简单的欺骗——通过访问伪造网站或点击电子邮件中嵌入的假链接，诱导用户下载恶意工具或病毒。后一种技术被称为“钓鱼”，它依赖于欺骗电子邮件收件者点击随附的、隐藏了恶意计算机代码的附件。许多此类邮件设计得精巧，看起来非常真实。熟练的黑客可能会研究你的在线身份，使这封邮件看起来像是来自一位真实的朋友，并引用了一个真实的事件。那些在线诈骗完全由使用破碎英语的明显冒充者、或向外国王子提出荒唐要钱请求的人实施的时代早已一去不返了。\n\
  当对链接产生怀疑时，请寻求带外确认——如短信或电话——以验证电子邮件和链接的真实性。仅仅有回复邮件是不够的，因为骗子可能使用了你真实朋友的被盗身份凭证。更好的真实性证明是个人交谈，或者发送邮件中提到了只有发送者和你才知道的事件或讨论。\n\
  \n# 第五章\n\n# 数据 3.0 与对私营部门使用数据的控制\n\n\n## 服务提供商是否真的有义务对其维护的网络进行监视？\n\n撇开控制政府何时可以审查和分析收集数据的规则，我们还必须确定何时或是否让私营服务提供商承担义务，审查其托管的流量，以寻找：(1)\
  \ 不允许的内容，如儿童色情；(2) 恐怖或暴力行为的招募或前兆，例如表明有意实施攻击的社交媒体帖子；或 (3) 设计用于直接破坏或干扰数据网络的恶意工具或病毒。有些网络和平台没有检查其托管流量的能力，而另一些则具有这种能力。后者平台会检查流量以向用户投放广告，或为了其他原因聚合用户数据。但同样的能力也允许他们编辑或限制恶意内容。\n\
  \n在这种情况下，有一种强有力的论点认为服务提供商应该采取措施阻止有害内容或警告政府当局以防止暴力或滥用。类比，医学伦理要求如果患者表达了对他人实施暴力行为的意图，提供者必须违反保密，某些法律也承认了这些义务。例如，在\
  \ `Tarasoff v. Regents of the University of California` 一案中，一名男学生向心理治疗师倾诉了他杀掉一名女同学的幻想；两个月后，他刺杀了她。加利福尼亚州最高法院裁定，得知患者构成严重暴力威胁的治疗师有义务尽到合理责任来保护可预见的受害者。各州法律都承认了类似的义务；但在保护人们免受暴力与促进患者-治疗师保密及关怀之间解决竞争利益时，法律在责任认定、威胁的特定性以及警告潜在受害者或通过将患者住院来保护受害者的义务方面存在差异。\n\
  \n但重要的是，对支持暴力的通信的限制应谨慎谨慎，以避免关闭可能令人厌恶但并未实际煽动暴力的言论。例如，2015 年 10 月 13 日，理查德·拉金在耶路撒的一次巴士袭击中不幸身亡。据报道，他的家人后来得知其中攻击者之一曾在\
  \ Facebook 上宣布了他的攻击计划。因此，20,000 名以色列人在纽约州州审判法院起诉 Facebook，“停止允许巴勒斯坦恐怖分子在其互联网平台上煽动针对以色列公民的暴力攻击”。另一组原告也以死于恐怖袭击的美国公民遗属的身份提起诉讼。诉状指控\
  \ Facebook 在拉金的死亡以及一系列针对犹太以色列人的袭击中起从犯作用，因为攻击者阅读了 Facebook 上的仇恨帖子，这些帖子煽动他们杀人并美化暴力，而且\
  \ Facebook 并不是中立方——据称其算法通过根据用户的“赞”和浏览历史提供朋友、小组和活动建议，帮助煽动者找到对他们事业表示同情的人。这些诉讼寻求禁令，要求这家互联网巨头监控其平台上的煽动暴力的帖子，删除此类帖子，并相应更改其政策。\n\
  \n\n\n\n原告部分根据以色列法律申请了禁令，该法律惩罚了赞扬、支持或号召支持恐怖主义或煽动恐怖主义的出版。正如 `Eugene Volokh` 教授所写的，执行此类禁止规定将违反《美国宪法》的\
  \ `First Amendment`（第一修正案）。它将限制很大一类允许的言论；其范围过于宽泛。即使法院仅考虑原告提出的更局限的要求，即要求 `Facebook`\
  \ “立即删除所有包含煽动杀害犹太人的页面、群组和帖子”，根据 `U.S.` 法律，不受宪法保护的“煽动”仅指那些煽动实施“迫在眉睫”的犯罪行为的言论——即即将发生的暴力，而非在某个未定义的未来发生的暴力。这将排除起诉书中列出的许多事件。此外，美国国会法律《通信尊严法案》的\
  \ `Section 230` 条款宽泛地保护了互联网服务提供商免受其用户发布内容的民事责任。简而言之，政府并不要求这些公司审查其用户的内容，即使这些内容是仇恨、淫秽、诽谤或不受宪法保护的。\n\
  \n在诉讼移交联邦法院后，它们因多种理由被驳回，包括《通信尊严法案》。但这些诉讼表明，人们正日益认为互联网服务提供商对其网络有监管义务。同样，美国和欧洲的官员也主认为，互联网媒体平台应该关闭用户招募恐怖分子或煽动暴力的网站。`Facebook`、`Google`、`Yahoo`\
  \ 以及其他互联网公司每月通过内部政策或程序从其平台删除数千条内容。这些决策大部分没有公开，极少数成为诉讼的素材，尽管一些被踢出的用户抱怨他们的言论自由遭到了侵犯。事实上，《尊严法案》中的\
  \ `section 230` 也保护了服务提供商，使其在采取善意行动限制对“淫秽”、“过度暴力的”、“骚扰的”或“内容在其他方面令人反感”言论的访问时，即使此类内容通常受宪法保护。\n\
  \n除了删除明显令人反感的材料外，还有一个更复杂的问题，即如何处理各种类型极端组织的在线倡导：例如：`伊斯兰主义者`、新纳粹分子或极端无政府主义者。这种倡导可能尚未达到煽动或招募的程度，但它可以作为进入这两者的门户。有人认为这种倡导应该受到抑制，互联网公司也日益关注这些呼声，特别是在\
  \ 2017 年 8 月弗吉尼亚州查洛斯维尔白人至上主义者发生暴力示威之后。\n\n\n一个更有前景的策略可能是 `Google` 附属公司 `Jigsaw`\
  \ 所采用的策略。`Google`并没有关闭极端网站，而是监控它们，并为这些网站的访问者提供明显的链接，指向提供平衡或相反材料的网站。实际上，用于生成与在线搜索者相关的商业广告的相同技术被被用于为搜索极端主义网站的人提供反极端主义材料。这种方法有两个优势：它在尊重不审查内容原则的同时，比那种更公开的直接压制方法更有效地对抗极端主义。\n\
  \n### 我们如何应对“虚假新闻”？\n\n更复杂的是近期呼吁媒体平台限制或拦截所谓的“虚假新闻”所提出的问题。宣传和欺骗性信息操作的概念可以追溯到几个世纪以前，以前苏联及其所属的\
  \ `共产国际` 网络因其将传播虚假新闻作为地缘政治工具的努力而闻名。然而，直到最近，此类信息操作的影响范围是有限的。伪造的故事必须通过相对边缘的通信媒介进行传播，如海报、事报或政府经营的报纸和广播电视。或者，主流媒体必须被欺骗去发布谎言。\n\
  \n互联网平台的兴起使大众传播民主化，从而显著扩大了分发虚假信息的机会。任何连接互联网的人都可以使用 `Twitter`、博客和社交媒体在全球范围内发布故事，而且利用匿名甚至伪装来掩盖传播者是恐怖网络或国家及其代理人的事实是相对容易的。此外，通信技术便利了诸如修改照片或创建伪造文件等技术。\n\
  \n\n随着虚假新闻规模的扩大，它对政治的影响已变得显著。那些研究俄罗斯影响甚至颠覆 `欧洲` 公共舆的努力的人观察到过去几年互联网驱动的虚假新闻不断增加。`俄罗斯`\
  \ 军事思想明确指出，通过虚假新闻等信息操作削弱公众对政府的信任，是地缘政治竞争中一种强大的工具。\n\n这些努力产生了真实的影响——例如，影响 `中欧` 人口对\
  \ `西方` 和 `欧盟` 采取更加怀疑的态度，与其他们对 `俄罗斯` 的态度相比。更有意义的是这种虚假信息运动在削弱对传统新闻来源和专业媒体信任方面的影响。2016\
  \ 年 `美国` 总统竞选首次凸显了虚假新闻对美国政治进程的影响。\n\n\n\n\n\n\n虽然假新闻的危害是真实存在的，但对内容的直接监管将是药比毒强。撇开完全的伪造或虚构的照片不谈，对内容准确性的评估往往是模糊的，特别是当争议集中在事件起因或从特定事实组中应该得出什么推论时。内容监管本身本质上容易操纵，特别是当政府监管者拥有会影响其视角的既得利益时。\n\
  \n这并不是说什么都不应该做。如果我们从虚假内容转而虚假放大，许多方法可以减轻这些虚假信息行动造成的大部分伤害——而且不会侵犯言论自由。例如，检测和抑制机器人网络，或人为驱动搜索引擎搜索趋势（trending）的协同活动，是限制信息活动的一种内容中立的方法。更具说服力的要求是社交媒体上的冒充者必须暴露身份，这样虚假信息就无法通过伪装成朋友甚至是名人或其他公众人物的合法推荐这种借口来进行推广。\n\
  \n随着互联网日益成为恐怖分子招募、煽动暴力，甚至是自动操纵舆论的媒介，我们的政策制定者和技术人员必须合作，明确交通规则。互联网服务提供商既有义务也有能力监控其托管的流量，但拦截流量应严格限制在那些旨在煽动他人暴力的人的明确招募行为。同时，提供商可以也应该阻止影响搜索引擎的自动化在线活动，以及利用虚假身份或冒充来推动新闻报道。\n\
  \n## 服务提供商对“数字足迹”的操作是否应该受到限制？\n\n根据安全专家布鲁斯·施奈尔（Bruce Schneier）的观点，“到 2010 年，我们物种每天产生的数据比从人类文明开始到\
  \ 2003 年的总和还要多。”私人收集的范围正在迅速扩大。随着云服务的出现，私营部门收集和使用数据的能力已远超政府。这些能力包括：\n\n- 社交媒体\n-\
  \ 位置、GPS 和手机信息\n- 搜索引擎结果\n- 追踪购买记录\n- 上传健身和其他个人数据\n\n在比之前讨论的警察预测软件更大的范围内，这些消费者数据提供了一个关于个人行为、活动和信仰的几乎完整的图景。之前识别用于警察监控的相同工具可以修改用于审查信息以提取偏好。\n\
  \n斯坦大学的一项研究利用志愿者的手机元数据，以了解今天的数字足迹中包含多少信息。仅根据手机元数据，研究人员就能确定“参与者 A”向专门药房和治疗复发性多性硬化的神经科小组打了电话。“参与者\
  \ B”与心脏专家进行了长谈，并拨打了用于监测心律失常的热线电话。“参与者 C”向一家专门经营半自动步枪的枪械店打了电话。此人还与枪械客户服务取得了联系。“参与者\
  \ D”联系了“一家家居用品店、锁匠、水培经销商和大品店”。“参与者 E”与其姐姐进行了一次长时间的谈话。\n\n这种程度甚至比之前讨论的警察预测软件更深，这些消费者数据提供了一个关于个人行为、活动和信仰的几乎完整的图景。之前识别用于警察监控的相同工具可以修改用于审查信息以提取偏好。斯坦大学的一项研究利用志愿者的手机元数据，以了解今天的数字足迹中包含多少信息。仅根据手机元数据，研究人员就能确定“参与者\
  \ A”向专门药房和治疗复发性多性硬化的神经科小组打了电话。“参与者 B”与心脏专家进行了长谈，并拨打了用于监测心律失常的热线电话。“参与者 C”向一家专门经营半自动步枪的枪械店打了电话。此人还与枪械客户服务取得了联系。“参与者\
  \ D”联系了“一家家居用品店、锁匠、水培经销商和大品店”。“参与者 E”与其姐姐进行了一次长时间的谈话。\n\n这种程度甚至比之前讨论的警察预测软件更深，这些消费者数据提供了一个关于个人行为、活动和信仰的几乎完整的图景。从这些研究中得出的显而易见的结论是，关于复发性多性硬化患者、心脏病患者、枪械爱好者、大麻种植者以及选择堕胎的人的信息，可以仅根据手机元数据得出。由于数据收集和聚合，隐私敏感性增加。这些状况是未被进一步调查的隐私敏感性。\n\
  \n收集和聚合的数据越多，个人的习惯、偏好、信仰和行动就越容易被监控、预测甚至塑造。收集这些信息通常并不违法，但产生的信息量可能会令人“毛骨悚然”并不安。我们还没有像对现实世界体验那样，产生对隐私侵害的直觉。隐私允许远离监控，以便我们行使自由表达。隐私防止我们被操纵。隐私确保了我们的自由。\n\
  \n一旦被收集，这些信息在存储和使用方面几乎是无限的。它们被聚合并出售。它们可能用于增强在线服务，但正如之前描述的，也可能用于营销产品、评估职位申请者、设定保险率甚至为某些服务定价。\n\
  \n## 有意义的同意\n\n大多数数据采集者的权威建立在订阅或用户的同意基础上——他们通常点击接受冗长的服务条款。但除了明确同意或自愿向社交媒体提交数据外，还有许多收集途径。\n\
  \n在大数据时代，个人无论去哪里，无论在网上做什么都会留下数字足印。许多日常活动产生的数据元素是在未获得主体明确同意甚至知情的情况下获取的。例如，提供零售折扣卡时可能没有对数据的最终用途做出明确说明。手机位置信号（为了正常运行所必需）也会产生用户可能不理解或不同意的的信息，对于这些信息他们没有现实的同意选择，因为这些数据是设备运行的固有产物。人们很少理解并对这些数据的审查、出售和在其他地方的使用给予知情同意。\n\
  \n公司与第三方的安排意味着个人数据可以在个人不知情或没有有意义同意的情况下传播。即使没有内含同意的人，其数据也可能被上传。例如，如果拍摄了第三人的照片或记录了路人的活动，这些内容可能不仅被上传到摄影师个人的设备上，还会上传到云服务中。从理论上讲，云服务提供商可以聚合从所有来源收集的关于同一个人的数据，而无需被拍摄或记录者的者的许可。因此，未使用该服务提供者且未同意的名人或公众人物仍可能为服务提供者生成重大的个人画像。\n\
  \n物联网的出现将进一步扩大关于本质上无意个体的产生的数据量和敏感性。\n\n\n\n\n\n如果我们采用早先在政府监控背景下应用的连续模型，那么对数据的收集、分析、使用、保留和传播是否应该有所限制？这在很大程度上取决于为了被视为“同意”，应该设定何种程度的警告和明确性阈值。\n\
  \n收集到的数据有两种使用方式。一种是改进应用程序或功能的功能，例如在 `Google Maps` 中使用位置数据。我将其称为数据的**内在使用**（intrinsic\
  \ use）。可以说另一个例子是使用购买历史来像 `Amazon` 那样推荐新购买，甚至为了促进零售店的库存监控。但数据也可以被营销给第三方，不仅用于促进广告，还用于评估对广泛企业在就业、定价或保险决策方面可能感兴趣的行为：**数据的外在使用**（extrinsic\
  \ use of the data）。例如，一个潜在的雇主可能感兴趣于评估关于申请人在支出、运动、阅读和锻炼习惯方面的全方位数据。\n\n这表明，对于数据收集者的“内在使用”和对于购买数据或寻求聚合多个数据流的第三方的“外在使用”，其同意的阈值应当有所不同。或许对于内在使用，应该假定用户希望该功能能够得到改进。但对于营销人员等第三方的外在使用，则应要求清晰的通知和明确的肯定性同意。当数据是从多个来源购买、出售或聚合时，这一点尤为真实，因为这些数据可能提供了比个人想象中要丰富得多的行为画像。随着越来越多的物体成为物联网中的数据源，这个问题将变得更加剧烈。\n\
  \n另一个问题也随之产生：当非订阅者的数据被私营公司捕获并用于他们自己的目的时，会发生什么？如上所述，云计算的出现意味着单一服务提供商可以为数千甚至数百万个人订阅账户托管数据。如果一个服务提供商可以在所有这些账户中进行搜索，那么即使是关于非用户第三方的相当的大量数据也可以被开发和利用。这可能源于特定个人（例如公众人物）被许多订阅者通过自己的社交或其他媒体拍摄或录像，或者通过私有视频产生产生的数据。这里存在两个不同的同意问题。首先，摄影师或记录的创建者是否同意对其进行使用或重新分发？这个问题本质上反映了每当数据生成者必须同意服务提供商使用时的情况。但另一个额外的问题是：何时需要非订阅者的同意？他们也可能是数据记录的无意主体。\n\
  \n通常情况下，如果人在公共场所拍摄或记录活动，被拍摄者没有控制这些数据的权利。除了礼貌考虑，没有人会询问第三方主体关于同意的事。但如果一个服务提供商可以从所有将数据存储在云端的个人记录者那里聚合大量的此类数据，那么这种聚合就需要限制，或者需要主体提供额外层次的同意。这是法院在考虑公共场所无处不在的政府监控时考虑过的问题的变体。此类数据如何被聚合和使用应该受到约束，就像现在对公共场所的政府监控正受到限制一样。例如，如果保险公司从各种来源采集非订阅者数据，它不应能够在未通知且未经数据主体同意的情况下使用这些数据。\n\
  \n## 为数据使用设定限制\n\n目前，对于私营公司能用大数据做什么，或者数据何时可以与其他公司共享，很少有绝对的限制。美国最近限制这些用途的立法和监管努力尚未进展；相比之下，欧洲对数据的使用和转售受到严格监管。\n\
  \n回想一下本书开头 James 的那个近未来的虚构场景。通过 24 小时的监控——包括测量食物摄入量、休息时间以及每日血液和尿液采样——可以为私营公司的利益创造宝库。例如，对降低保险成本感兴趣的健康保险公司可以激励被保险人转向更健康的生活方式。通过鼓励保单持有人更健康的饮食、睡眠和运动习惯，公司增加了利润率。致力于防止诉讼和提高生产率的雇主也可以鼓励批准的下班后行为。通过跟踪员工的下班位置并敦促休息，雇主可以确保其员工不惹麻烦并为企业利益回报最大化。“大哥”（或“老奶妈”）过来了。\n\
  \n对此类数据显性侵入性较小的使用已经开始。如前所述，几家汽车保险公司目前向那些在汽车中嵌入记录驾驶习惯设备的驾驶员提供折扣。论点是，这种设备提供了更准确的风险评估，并让安全驾驶员从其行为中获益。健康保险公司开始对个人佩戴的活动监测仪做同样的事情。追踪饮食的选项通常作为跟踪软件的便利功能提供。\n\
  \n显然，这些情况对涉及的个人有直接益处：旅行期间安全性的提高以及更健康的体魄。然而，我们经常为了短期的便利或低成本的满足而交易掉数据，却没有意识到长期后果。意识到我们完全不知道数据可能被如何使用、由谁使用或为了什么使用，这确实令人不安。想象一下你的健康保险公司购买你的餐厅和杂货店记录来决定你吃什么食物。这需要什么样的同意？\n\
  \n还有某些情况，保险公司可能会说，如果你不同意对生活方式进行全面监控（通过数据），将被收取最高的保费，甚至更糟，完全被拒绝保险。正如之前提到的，某些潜在的雇主对不使用社交媒体的候选人表示怀疑——推测他们有隐藏的。为什么他们没有一个易于查看且可用于判断其行为并对其性格做出假设的在线形象呢？如果这有什么意义的话，我们的隐私和自主权应该包含不产生该数据流的权利。\n\
  \n最后，无处不在的数据收集的完全影响即使对于资深用户来说也是不的。例如，智能手机用户在使用地图应用程序时必须向该程序显示她的位置。因为她的数据对模式软件可能有价值，应用程序提供商有动力保留她的信息。默认情况下，该个人的数据是不受保护的。\n\
  \n\n\n\n\n许多手机上的 `Waze` 交通应用是一个极其方便的导航工具。Waze 可能是最有效且最强大的方向查找工具，它收集成千上万用户的数据，并应用其算法来确定事故、交通拥堵和其他导航问题的位置。该工具通过允许驾驶者避开拥堵区域寻找前往目的地的新路径，为他们节省了宝贵的时间。然而，大多数用户并不知道，在默认设置下，`Waze`\
  \ 永远不会停止追踪手机位置。只有那些足够关注并理解背景设置的用户才能能够禁用持续追踪。如果你是 Waze 算法开发人员，这种持续跟踪就完全合逻辑：数据越多，理解就越深。通过更更有效地预测导航热点，它还能为用户提供更好的产品。\n\
  \n但也有负面影响：这种便利性也让其他人能够跟踪你。加州大学圣塔芭芭拉分校的研究人员已经表明，通过“幽灵车辆”组成的虚拟军队来操纵数据流，可以对个人用户进行追踪和操纵。\n\
  \n`Waze` 应用的用户还可以为其他登录应用的用户识别警察车辆。这种数据作为防止掉入速度测陷阱的警告，看似无害，但可以被用于追踪警察。因为用户并不知道警察实际上是在速度测陷阱中还是只是停下来吃午饭，识别他们的位置可能会让执法人员面临风险。在\
  \ 2014 年底，两名纽约警方局的警官被一名使用了数月 `Waze` 追踪警察的男子杀害后，执法部门官员近期对该应用表达了担忧。\n\n为了节省几分钟时间的便利性，对于警察人员的安全性或隐私的损失来说，似乎是一项廉价的交易。但用户被短期便利性所吸引，很少有人有意识地做出这种权衡。有些人可能信任所交换的数据将仅用于善意目的。然而，“善意”的定义在个人、公司和公众之间是不同的。在一个利益竞争的时代，默认设置正在发生变化。\n\
  \n### 被遗忘的权利\n\n当第三方收集由新闻媒体进行或由新闻媒体获取时，会引发独特的问题。由于数据的主体并非数据的生成者，因此数据主体并不拥有明显的所有权。在西方民主国家，新闻界和类似机构在收集或发布有关第三方的信息时，通常不需要同意，前提是信息是真实的且没有违反版权法。但正如我们所看到的，欧洲国家对数据隐私的重视程度远高于美国，他们日益制定了“被遗忘的权利”。数据主体可以向当局提出申请，要求搜索引擎删除指向个人信息的链接，这些信息虽然是真实的，但由于年龄、语境或其他敏感性而被认为是不相关的。\n\
  \n 2010 年，一位西班牙公民向西班牙数据保护机构提起了投诉，诉称在网上搜索他的名字时出现了一篇 1998 年的新闻报道，提到他的房产正被出售以偿还社会保障债务。他辩称这些扣押程序已经解决，不再具有相关性。因此，一家西班牙报纸和\
  \ Google 都应该被要求移除或隐藏这些信息。数据保护机构拒绝了针对该报纸的请求；该信息是根据政府广泛宣传拍卖的命令合法发布的。但 Google 则不同；该机构发现\
  \ Google 是一个`数据控制者`。根据的一项关于处理个人信息隐私保护的欧盟指令，Google 必须更改其搜索结果。\n\n欧盟的一所高级法院裁定，个人可以申请删除搜索引擎中“与数据处理目的相比不充分、不相关或不再相关，或过量”的个人信息，且在缺乏访问该信息的“公众首要利益”的情况下，搜索引擎必须删除这些链接。\n\
  \n在欧洲最高法院 2014 年 5 月做出裁决后的两年里，Google 收到了 407,673 个从其搜索结果中移除个人信息的请求。它评估了 1,425,748\
  \ 个 `URLs`，删除了其中的 516,575 个，占 42.6%。在这些请求中，包括歌手 Axl Rose 要求 Google 删除不利的照片。\n\n\
  诚然——排除那些荒谬案例之后——欧洲的裁决具有直觉上的吸引力。例如，强奸和其他犯罪的受害者能够让此类故事的搜索结果隐藏，以保护他们的身份。但这一决定引起了巨大的批评；通过过度特权化，被遗忘的权利威胁到了限制言论自由和公众对真实信息的获取。\n\
  \n### 走向解决方案：数据使用框架\n\n在寻找第三方收集问题的解决方案时，隐私的基本权利以及更广泛的自主权，绝不能被忘记或忽视。从言论自由和民主价值观的角度，一个框架应该允许新闻机构和个人公民收集并使用由他们记录的数据，或在获得数据主体同意的情况下从第三方收集者处获得的数据。对于关于公众人物的数据尤为如此。长期以来，公职人员在反对关于自己的公共论述方面的法律权利被认为较小。因为由于他们在当选的职位上代表了公共利益，媒体在访问和展示收集的信息方面被赋予了自由。\n\
  \n对于商业获取非媒体相关数据——考虑到在美国法学中，商业言论受到的保护少于政治或艺术交流——规则应该是不同的。正如之前提出的，对于为了改进用户体验功能而收集的用户数据，应该推定已同意。例如，如果收集位置数据是为了提高地图应用的准确性，情况就是如此。但对于为了其他商业目的（如产品营销）收集的用户数据，应该要求用户主动选择（opt\
  \ in）；在某些情况下，也许可以提供补偿作为诱因。最后，在聚合的非用户数据用于最初批准之外的其他商业用途之前，应通知主体并特别要求其对用途变更进行`加入或退出`（opt\
  \ in or opt out）。这些规则将允许商业企业利用大数据的优势，同时也尊重个人自由和隐私原则。\n\n选择加入或退出数据共享应该是一个有意义的选择，而不是被迫的选择。当服务提供者对某项服务拥有垄断权力时，同意无限制地使用数据不应成为参与的条件。当提供者占据市场领先地位时，限制他们寻求同意的数据用途范围是合适的。此外，雇主和保险公司对于作为就业或保险条件的所要求访问的数据范围应受到合理的限制。\n\
  \n\n\n\n美国也应该采用限制版的欧洲“被遗忘权”。这项权利在历史上是隐含于人类保留信息的有限能力，以及即使是已记录的信息（如照片）在传播上通常也受到限制，并会随着时间的推移而恶化。现代数据工具不再允许这种现象自然发生。在传统搜索工具下被排除在搜索之外的权利，对未成年人和私人个体可能最有利；另一方面，公众人物不应拥有被排除在在线搜索之外的权利。这种搜索排除权的可用性应取决于相关数据的性质、搜索发生的目的以及由谁发起。然而，另一个兼具实践意义和法律意义的问题是，被遗忘权是否延伸到搜索工具之外，并可能强制要求从数据库中删除。这种情况将类似于今天社交媒体网站阻止和消除儿童色情信息的方式。然而，将删除底层数据库中条目的权利就过头了，而且带有一种令人不安的字面上修改历史的味道，就像乔治·奥威尔的*1984*中描写的那样。\n\
  \n## 我们公民应该如何如何更好地控制我们的数据\n\n我们对个人数据的控制在很大程度上取决于我们所出的选择。在任何关于同意的规则下，我们在同意使用自己的数据时，做出审慎选择是我们的责任。这意味着要询问同意后将获得什么收益，或者我们的数据可能如何被使用。权衡是什么？\n\
  \n例如，新下载的应用程序经常会询问我们是否同意共享位置数据以“提供更好的服务”。位置数据一旦被采集和存储，就能描绘出日常活动的细粒度画像，特别是当它与其他数据结合时。因此，我们必须询问共享数据如何为*我们*带来更好的服务。对于`GPS`-映射应用，这种处是显而易见的。但对于零售机构，我们如何从他们精确定位我们的位置中受益并不明显，除非是为了向我们投放更精准的广告。\n\
  \n同样，对我们的在线搜索保持意识也是值得的。它们经常留下数字足迹。如果我们持续搜索疾病症状，保险公司某天可能会询问我们为什么对这些如此感兴趣。登录一个有争议的网站也可能引起误导或不受欢迎的关注。2017\
  \ 年，司法部向一家名为`DreamHost`的网站索要数据，该网站曾用于组织 2017 年总统就职典式的抗议活动。搜查令范围之大，要求该网站任何访问者的`IP`地址，估计总数约为\
  \ 130 万个地址。(29) 即使是好奇驱动者也会被卷入这项政府调查。\n\n一个建议：敏感搜索可能不必在自己的设备上进行，而是在图书馆或其他具有公共登录地址的场所进行。\n\
  \n互联网服务提供商和平台提供了便利、服务和利益，但控制我们数据的最佳方式是留意如何以及何时生成它。正如传统的互联网谚言所说，如果服务是“免费”的，你可能就是产品。\n\
  \n## 数据 3.0 与主权：法律冲突问题\n\n随着数据轻而易举地跨跨境，法律和政府政策呈现了另一个维度。在全球化世界中，很难确定应该遵循谁的规则。\n\n\
  ### 动态数据与静态数据\n\n根据定义，互联网无无不在的，数据在全球流动。现实中，数据必须托管在物理基础设施上，并通过路由器以及光纤或无线传输技术移动。问题随之产生：适用谁的规则？如果基础设施的位置成为指导原则呢？这将产生一种反常的效果，导致各国要么要求或创造激励将服务器部署在本地，或者部署在对互联网服务提供商法律最有利的国家。如果每个国家都要求将其与其公民相关的数据存储在自己的边界内，这可能会导致互联网的碎片化。那种巴尔干化无疑会导致工程效率的低低，更糟糕的是，将导致一个充满间隙和接缝的互联网。\n\
  \n例如，`Facebook`的设计方式最大化了其收集的数据的可用性、可扩展性和留存。该公司的数据在物理上存储在许多地点，以确保其始终可用，并定期检查备份。因此，在任何时刻要确定特定的“数据数据”存在于何处可能是困难的，而且一旦它被用户删除，该数据的所有副本是否都已被移除。(1)\n\
  \n然而，如果我们应用传统的美国法律观点，即任何涉及美国的交易都受美国法律管辖，那么每个拥有通信基础设施的国家都可以声称拥有管辖权。首先，数据包在到达目的地之前可能会经过许多国家。无线网络加剧了这一点——想象一下一个人在飞越欧洲时正在发送电子邮件或下载新闻推送。在理论上，飞行路径上的每个国家都可以声称拥有管辖权。\n\
  \n### 执法部门对数据的访问\n\n对于存储在服务器中的静态数据或跨国流动的动态数据，在可能不兼容的法律规则下，可能会对其合法访问产生冲突的需求。这一问题在法律案件中已经出现，即数据存储在一个国家，但由数据创建者作为公民所属的另一个国家请求。当互联网服务提供商是第三国的公司法人，但在所有三个国家都经营业务时，复杂性可能会进一步增加。关于法律程序是否可以直接送达给互联网服务提供商，存在程序性问题，但还取决于此类请求是否应该通过条约机制进行处理。\n\
  \n我们留下了两个问题——一个关于访问数据的法律程序，另一个是关于哪个国家的法律管辖境外数据处理的实质性决策。\n\n这个问题并非理论。在 2013 年 12\
  \ 月，美国政府向`Microsoft`签发了一份搜查令，作为刑事毒品调查的一部分，索要与特定客户账户相关的电子邮件和其他私人信息。`Microsoft`的`全球刑事合规`团队发现部分信息存储在美国服务器上，但与账户相关的电子邮件存储在`Microsoft`位于爱尔兰的服务器上。`Microsoft`提交了存储在美国的数据，但拒绝了提供境外存储信息的请求。(2)\n\
  \n地区法院确认了治安法官的命令，认为根据《存储通信法》(SCA)签发的搜查令要求美国互联网服务提供商提供存储在外国服务器上的电子邮件。(3) 当`Microsoft`拒绝执行命令时，法官判定该公司藐视法庭。`Microsoft`对判决提出上诉，美国第二巡回上诉法院撤销了该命令。该法院认为，由于数据保存在爱尔兰的服务器上，缺乏签发搜查令的法定授权。(4)\
  \ 2018 年，该案将由美国最高法院裁决。\n\n\n\n法律争论很大程度上取决于对《远程搜索法》（SCA）的解释，该法案编写于 1986 年，远在互联网被广泛采用之前。微软认为，搜查令不能在美国境外执行；法院通常推定法律不具有域外效力。微软还表示，美国政府必须通过与爱尔兰等国的法律协助条约或其他外交渠道来获取数据。\n\
  \n在 `Microsoft` 案中做出裁决时，上诉法院权衡了两因素。首先，对物理数据中心拥有管辖权的国家通常有自己的数据隐私规则。其次，一个国家获取物理存储在海外服务器上的个人数据的意愿，绕过了主权国家共享证据的（尽管很繁琐的）条约程序。但法院没有考虑的一个因素是拥有微软墨尔林服务器上数据的实际人员的国籍或所在地。人们可能会合理地认为，这是评估涉及隐私利益时最重要的因素。\n\
  \n双方都同意，美国国会需要更新现有的国会法律以适应全球电子通信的现实。美国立法者已经提交了数项法案来实现这一目标。《国际通信隐私法》（`ICPA`）和《电子邮件隐私法》将要求执法部门对存储超过\
  \ 180 天的数据获取搜查令。`ICPA` 和《2018 年云法》（CLOUD act）还将限制针对存储数据的搜查令的域外效力。\n\n执法部门对境外数据的访问也是其他国家面临的问题。2016\
  \ 年，作为毒品走私调查的一部分，巴西一名法官要求 Facebook 提供 `WhatsApp` 账户的信息，这是 Facebook 收购的一种消息服务。据报道在多次拒绝配合后，巴西联邦警察逮捕了一名\
  \ Facebook 高管。\n\n## 哪些国家法律管辖可能存储在任何地方的数据权利和责任？\n\n全球范围内管理数据的法律是相互矛盾的，尽管一些国家试图将其关于许可通信和隐私的观点强加给某些主体，而这些主体与这些国家的唯一联系仅仅是数据存储或发送地点的偶然性。\n\
  \n欧洲法院最近裁定，由于美国的数据隐私法没有欧盟那样严格，跨国企业可能无法将任何与欧洲公民有关的信息传输到位于美国的数据库。这适用于关于员工的最平凡、常规的内部业务数据，例如工资单或累积假期，甚至是商务差旅信息。欧盟根据其《通用数据保护条例》颁布的新规定对任何管理欧盟公民个人数据的任何国家的控制者或服务提供者实施处罚，如果该控制者或提供者不遵守欧洲隐私规则。截至\
  \ 2018 年春天（新规定生效时），`GDPR` 的效果将是所有与欧洲人相关的数据单独存储在欧洲，或者——更有可能的意图是——让欧洲的隐私监管足迹实际上扩张到美国。对于美国来说，让所有人遵守一个更严苛的标准，比为欧洲数据专门建立一套制度要容易得多。也许这个问题看起来是无害的，可以通过非欧洲国家采纳欧洲更严格的隐私法来轻松解决。但如果这些法律过度阻碍了执法或安全，可能会产生代价。这是冲突的政府法律制度在全球信息环境中碎片化数据处理规则的一个例子。\n\
  \n更棘手的是当一个国家隐私权利的扩张与其他国家的言论自由直接冲突时。例如，考虑欧洲的“被遗忘权”法律，根据该法律，通过互联网搜索引擎访问的故事主体可以要求删除该故事的网络链接，因为该故事侵犯了隐私。这一裁决不仅限于已证实的虚假信息，也不涉及儿童或犯罪受害者的故事或图像。从搜索引擎中删除的项目包括一个维基百科页面、一个关于非正式便利签艺术比赛的故事、关于一个对在场做出的判罚撒过谎言的前足球裁判员的新闻文章，以及一篇关于被指责协助导致金融危机的美林利德高管的\
  \ BBC 文章。\n\n最初，全球搜索公司对欧洲“被遗忘权”规则的回应是删除来自欧洲网站的搜索链接，但不删除位于美国网站的链接（大多数搜索是在特定国家的网站上进行的）。但在实际意义上，这导致了不合规，因为坚定的搜索者可以连接到非欧洲网站进行搜索。因此，法国法院强制要求只要搜索引擎公司在某种意义上存在于欧洲，“被遗忘”就适用于该搜索引擎运营的所有网站。`Google`\
  \ 最初抵制了这一举措。曾几何时，公司鼓励在线用户使用美国域名（`google.com`）进行搜索，而不是欧洲的域名（例如 `google.de` 或 `google.co.uk`）。然而，`Google`\
  \ 最近宣布，作为其实施“被遗忘权”规则的一部分，在欧盟境内浏览器内进行的搜索现在将被禁止在范围内所有域名下搜索“被遗忘”的数据。\n\n这种对单一隐私观的扩张与美国的言论自由权相冲突。如果欧洲法院试图在美国执行“被遗忘权”，可以很容易预见到美国法院将禁止这种执行。在禁止贬低种族的言论和（如上文所述的）“虚假新闻”的欧洲规则下，或者在禁止政治上不受欢迎的言论或宗教亵渎的国家规则下，也可能发生相同。此外，拉丁美洲国家现在开始主张类似的权利来删除互联网上的材料，也不难想象中国和俄罗斯监管机构可能对什么应该被遗忘有自己的看法。\n\
  \n## 法律适用规则：一些替代方案\n\n我们目前的状况是不可持续的。随着互联网实现了越来越多的交易，由这些交易产生的纠纷正在迅速增加。在解决这些纠纷时，谁的法律非常重要。一些国家正转向要求将有关本国公民的数据存储在境内的物理设施中——所谓的数据本地化法。其他国家正在编写具有域外效力的法律。\n\
  \n我和同事保罗·罗森维格（Paul Rosenzweig）在其他地方曾辩称，目前的混乱局面必须让位于国际法律适用框架。目前存在多种方法。法律适用规则可以基于\
  \ (1) 数据创建者的国籍；(2) 数据主体的国籍；(3) 数据持有者的国籍；或 (4) 损害发生地。\n\n\n\n为了理解这些规则每一条在实践中是如何运作的，请想象一起关于艺术品的纠纷。摄影师（数据创建者）拍摄了一位女性（数据主体）的照片。摄影师和这位女性是不同国家的公民——例如芬兰和瑞典。在没有获得该女性同意的情况下，摄影师将照片存储在爱尔兰的一台服务器上（数据持有者）。该服务器遭到黑客攻击，数据被一家越南公司获取，该公司在越南对照片进行复制以用于广告（损害发生地）。这位瑞典女性对她的照片被用于商业目的感到愤怒，她认为这是对她隐私的侵犯，于是起诉了芬兰摄影师和爱尔兰数据公司，要求赔偿损害并发布禁令。应该由哪个国家的法律管辖？\n\
  \n基于数据创建者国籍的规则意味着，创建数据或控制数据的人无论其位于何处，都受其主权国家的管辖。这种规则遵循了普遍的人事管辖权——一个国家（往往未行使）在世界任何地方对其公民施加规则的权力。因此，在上述示例中，芬兰法律将适用，因为摄影师（数据创建者）是芬兰人。\n\
  \n然而，这位瑞典女性对照片拥有比芬兰摄影师更强的隐私利益。在一个存在复杂的跨境交易的全球化世界中，数据所有者可能并非数据的主体。因此，基于数据主体国籍的规则意味着瑞典的法律选择规则适用。\n\
  \n但芬兰摄影师将照片存储在爱尔兰公司的服务器上。基于数据持有者的规则可能会强化网络的地理属性。当然，我们可能希望区分声称拥有所有权的数据持有者（例如，如果爱尔兰公司雇佣了芬兰摄影师，并签署了关于照片共同拥有的合同协议）与那些声称没有此类权益的数据持有者。\n\
  \n最后，考虑基于损害发生地的规则。这种规则将代表对现行体系的巨大偏离。该规则不再关注各方身份，而是关注损害发生地。在上述示例中，这将越南。四种替代方案中没有一种能提供完全的清晰度。某些数据创建者可能是双重国籍。数据持有者可能在多个国家设有公司总部。而且某些事件可能在多个国家造成损害（如果照片不仅在越南被看到，也在韩国看到）。但这些复杂性比基于数据位置的规则更容易被操纵。一个国家可以通过要求数据本地化来预判诉讼后果，而个人不太可能为了可能的法庭大战而寻求双重国籍。\n\
  \n上述的每种替代方案都有优点和局限性。基于数据创建者国籍的规则可以提供清晰度。通过照片的元数据，我们可以发现其创建者。但当数据创建者和数据主体不同时，这一规则会低估数据主体的隐私利益。\n\
  \n基于数据主体国籍的规则会将互联网法律选择规则系到一个熟悉的概念：人事管辖权。但执行起来可能很困难。数据主体可能没有清晰的来源或国籍。追溯性地分析国籍可能太困难了。\n\
  \n基于数据持有者国籍的规则优点是易于适用。如果你是爱尔兰数据持有公司，只有一条规则适用。然而，该规则将产生不幸的后果，即激励数据本地化——公司将搬到规则最有利而非最具经济效益的地区。各国将在吸引公司的竞争中实施最松松的规则。\n\
  \n最后，基于损害发生地的规则在理论上似乎是合理的，而且可以说是最不容易受操纵的。（毕竟，谁知道损害将在哪里发生？）但不同的国家可以操纵对损害的定义；这种规则可能只适用于全球承认的损害（如谋杀），而不适用于有争议的损害（如对“强奸”的精确定义）。\n\
  \n虽然这些规则中没有完美的，但其中任何一条都比目前无序的流程要有改进。最实际且最公平的规则可能是适用基于数据主体国籍的隐私原则，但将执法权授予损害所在地国家以寻求数据的权力。\n\
  \n\n\n这种恶意网络活动的最初目标包括政府和新闻媒体网站，但随后目标范围扩大到了几乎所有重要的政府网站（包括总统府、部委、法院和议会的网站），以及金融和教育机构。黑客用欺诈交易涌入银行，导致国际银行在冲突期间暂停了格鲁吉亚的银业务。事实上，格鲁吉亚国家银行被迫切断了十天的网络连接，导致大多数金融交易中断。全国范围内的手机服务也中断了。\n\
  \n这场活动在格鲁吉亚试图抵抗俄罗斯入侵的关键时刻，将其政府与其公民和其他国家隔离开来。与前一年针对爱沙尼亚的 D 攻击不同，2008 年针对格鲁吉亚的行动影响了政府在物理世界中自卫的能力。最终，当格鲁吉亚外的互联网服务提供商同意托管其被围的网站时，服务得以恢复。\n\
  \n如前所述，2015 年 12 月发生于乌克兰的网络攻击对电网造成了物理破坏。尽管在网络空间进行归因非常困难，但人们认为与俄罗斯有关的黑客是幕后黑手。攻击者是部署多个恶意软件工具所需的知识、技能和行动规划的严肃行为者。他们使用定制的恶意软件工具以及现成的恶意软件获取了访问并干扰了三家不同公司的电力。黑客了解控制系统的细节，并针对性地删除特定的活动日志^(8)。在变电站网络攻击中发现的一些恶意软件是现成的，与俄罗斯活动分子在其他漏洞中使用的相似，但入侵者的活动显示他们执行了深度侦察，以获得目标系统的知识并创建了相当复杂的攻击能力。在这种情况下，影响不仅是让计算机网络离线或阻止其使用，而是损坏或破坏物理资产以减缓电力恢复。这一事件表明，恶意网络活动已从仅仅的骚扰或数据窃取演变为地缘政治斗争中的物理资产破坏。有人推测，俄罗斯对乌克兰的网络攻击旨在恐吓该国议会，阻止将其该国的私有电力公司国有化^(9)\n\
  \n此前，还有 2012 年针对石油巨头沙特阿姆姆石油（Saudi Aramco）的攻击。这次攻击使用了 `Shamoon` 病毒，影响了超过 30,000 台计算机。它破坏了重要的信息基础设施，并导致石油交付和配送的延迟。在沙特阿姆姆石油攻击发生两周后，卡塔尔天然气生产商\
  \ `RasGas` 也遭了类似的病毒攻击。攻击关闭了本地电子邮件服务器，但似乎并未影响天然气生产。伊朗和真主派均被怀疑参与了针对沙特阿姆姆石油和 `RasGas`\
  \ 的攻击^(10)。如果属实，这意味着伊朗在 2010 年遭受其自身基础设施攻击后，已获得了强大的能力^(11)\n\n随后，`Stuxnet` 蠕虫对用于核用途浓铀的伊朗离心机造成了物理破坏。目前还没有一方声称对该攻击负责，尽管调查记者大卫·辛格尔（David\
  \ Sanger）将其归于以色列和美国共同^(12)。无论谁了 `Stuxnet`，将其深藏在离心机的控制系统中。在机器上进行秘密安装后，蠕虫一直处于闲置状态，直到合适的时刻，迫使离心机失控旋转^(13)\n\
  \n能够造成物理破坏的网络攻击不再是科幻小说。数据窃取、知识产权窃取甚至国家间谍活动都是传统上由执法或外交解决的活动类型。\n\n### “战争”的定义与归因问题\n\
  \n一个破坏性行为被视为犯罪活动还是战争，通常取决于多种因素。这些因素包括：该行为归因于政府的程度是否清晰；该行为是否由受政府有效控制的私人行为者实施；行为实施者的意图；以及攻击的影响。\n\
  \n在网络空间中，犯罪与战争之间传统的法律和政策区别开始崩溃。出现了几个概念性的法律问题。首先，犯罪性破坏与战争之间的区别可能仅仅是影响程度的问题。也许攻击的目的是相关的。而且恶意行为者必须是一个国家才能触发战争状态，还是说非国家团体（如有同感的活动分子）也可以发动战争行为？例如，2001\
  \ 年，我们入侵了阿富汗，要求该国对奥萨马·本·拉丁丁 2001 年 9 月 11 日的袭击负责。根据国际法，尚不清楚互联网访问或可用性的中断或破坏是否算作“使用武力”或“武装攻击”。\n\
  \n解决这些问题将决定一个国家应该通过执法、反情报还是军事手段应对网络攻击；被围的国家是否可以根据国际法行使武力自卫并在集体防御条约下寻求盟友帮助；以及战争法在限制武装冲突方面的适用程度。\n\
  \n网络空间无限的地理限制使得私人行为者与国家之间的关系变得特别具有挑战性。在物理冲突中，战斗员存在于战场或附近。在网络冲突中，攻击可以从数千英外的桌面电脑发出，经过多个路径和路由器。攻击者是不可见的，不穿制服。他们通常不受军事指挥控制结构的限制。正如我们在俄罗斯攻击格鲁吉亚和乌克兰的案例中所看到的，国家可能通过忽视或未能调查有利于该国政治或军事利益的活动，来赞助和鼓励私人黑客。这种混合战争是近期物理冲突的一个特征（如如\
  \ 014 年入侵克里米亚的见证），但在网络领域这更为普遍。这引发了困难的问题：如果一个政府被认为控制着执行网络攻击的私人行为者，该政府是否应承担责任。\n\n\
  \n\n最后，利用网络工具进行信息行动（或信息战）带来了一个特殊的挑战。这些战术旨在混扰对手的人民或削弱其信心。尴尬的信息可能会被泄露，甚至可能被分发伪造的文件。在所谓的“迈丹广场革命”期间（乌克兰亲俄总统被下台），同情俄罗斯的黑客发布了据称是**两名美国官员鼓励起义的对话录音**。最近，美国国土安全部和国家情报局局长曾表示，俄罗斯政府指示对美国政党和组织发动网络入侵，导致旨在让某些美国政治人物颜面的文件被选择性地发布。2016\
  \ 年，美国主要情报机构公布了一项确定性发现，证实俄罗斯政府支持的黑客是窃取和传播民主全国委员会电子邮件的幕后黑手。前国土安全部长杰什·约翰逊于 2017 年\
  \ 6 月在美国国会作证道：“2016 年，俄罗斯政府在弗拉基米·普京本人的指示下，对我们的国家策划了网络攻击，目的是影响我们的选举——这非常明确。”^(14)\n\
  \n其他国土安全部官员指出，州和地方选民数据库也被俄罗斯黑客渗透，尽管没有证据表明选票被篡改或删除。一名俄罗斯特工渗透了伊利诺伊州的选民注册数据库，并试图下载\
  \ 1500 万选民的文件未果。总之，有 20 多个地方选举数据库被俄罗斯黑客渗透，其中一些显示出试图影响选民名单信息的努力。这些渗透凸显了通过删除或更改选民注册，或传播有关如何以及何地投票的误导性信息来干预美国选举过程的风险。^(15)\n\
  \n操纵选举过程或实际上物理干预投票的行为是否跨越了战争行为的界限？虽然前者带有宣传色彩，通常不会引发实际的敌对，但对投票的物理干扰接近于对关键基础设施的攻击。\n\
  \n### 威慑与应对网络战争\n\n鉴于网络冲突的新颖性以及不断演变的适用于网络的国际规范，^(16)，目前尚未制定关于如何有效威慑或应对网络攻击的清晰准则，即使这种攻击造成了严重的物理影响。某些困难源于对这些影响何时跨越界限被明确视为武装侵略的不确定性。但对于如何校准一种威慑政策的策略，目前也还没有完全成熟的理解——这种策略既不能软弱到招致攻击，又不能倾向于鲁莽地升级小事件。网络战争威慑理论目前类似于核威慑策略的早期阶段，但问题要复杂得多：早期的核威慑仅涉及两个主要的核国家，而发动网络战争的能力在全球范围内广泛分布。\n\
  \n诚然，模糊性在威慑不理想的网络操作方面是有帮助的。可以理解，美国政府尚未对网络空间中什么算作战争行为划出极其清晰的界限。美国国防部《战争法手册》（`Law\
  \ of War Manual`）承认，将战争法应用于网络空间“尚未定论”，且该法律“可能会继续发展”。^(17)\n\n2015 年，在参议院司法委员会的提名听证会期间，国防部长阿什·卡特被问及他认为什么构成战争行为。作为回答，他关注了网络产生的后果：\n\
  \n我认为，所谓的战争行为应该遵循与其他领域相同的做法，因为最重要的是严重性，而不是手段。\n\n无论特定的攻击是在网络空间内还是空间外，是否被视为战争行为，都需要根据具体情况进行裁定。恶意的网络活动可能导致死亡，任何此类活动都将受到极大关注，并完全可以被视为战争行为。攻击并不需要被视为战争行为才需要回应。该手册列举了一些使用武力的例子。\n\
  \n一个特别的灰色地带值得考虑：我们如何处理互联网上的信息行动——即宣传——这些行动是有时被称为“混合战争”的特征？当一个主权国家开展所谓的信息行动时，这些行动可能包括：旨在混扰其他公众并削弱凝聚力和战斗意志的**事实性虚信息（factual\
  \ misinformation）**；旨在封口批评者的网络喷子和在线恐吓；窃取并发布旨在在政治或个人上造成尴尬的敏感文件（被称为“人肉搜索”）；甚至对政府和金融职能的干预和破坏，例如\
  \ 2007 年针对爱沙尼亚政府和银行网络的拒绝服务攻击。\n\n此类信息行动并不像那种可以轻易描述为战争的方式那样具有破坏性。然而，它们并非仅仅是犯罪；出于地缘政治目的，它们是战略性削弱另一个国家战斗意志的努力。对等的回无疑是合理的，但很少有人会认为回应应该升级为暴力或物理战斗。应该制定一系列应对措施，包括推广反叙事、经济制裁，甚至阻止或禁用发起这些信息行动的在线平台。\n\
  \n### 归因挑战使威慑变得更加困难\n\n除了确定网络空间中的哪些活动上升到战争行为水平之外，识别罪首也是一种挑战。网络攻击的典型特征是黑客通过多个服务器移动恶意软件，以掩盖攻击的来源。恶意行为者可以很容易在网上隐藏其行迹，这导致许多评论员描述网络空间所谓的“归因问题”。在物理世界中，通常可以通过监控发射点来识别大规模军事攻击的来源。诚然，物理世界中的归因能力并非完美。\n\
  \n\n\n\n\n总而言之，在网络空间中，精确归因恶意行为要困难得多，因为在那里即使是巨大的破坏性载荷也可以从优 盘发出。攻击可以从几乎任何地方物理发起，并且可以通过远程控制机器发送攻击来掩盖起源。就像现实生活中的谋杀现场一样，调查人员会寻找证据并检查所有通往犯罪者的路径。在物理攻击中，侦探试图证明某项行为是由一个出现在现场、具有动机和机会的嫌疑个人实施的。而在网络调查中，执行者几乎从未物理出现在攻击现场。调查人员必须追踪恶意软件的行为并尝试对其进行逆向工程以理解其意图。线索包括使用的语言或代码中遗留的注释。侦探可能会关注恶意软件代码试图做什么、它*没有*做什么，以及它是否与其他恶意软件相似。军事学者托马斯·里德（Thomas\
  \ Rid）和网络安全专家本·布肯南（Ben Buchanan）将归因描述为一个微妙的、艺术化的过程，其中没有正确的归因唯一配方，没有统一的方法、流程图或清单。找到正确的线索需要对一系列详细问题进行严谨的关注——但也需要技术丰富的操作员的直觉……在操作层面，`归因是一个微妙的过程，而不是一个简单的问题。`这种归因过程不是二元的，而是以不均匀的程度衡量的；它不是黑即白、是非的，而是呈现出深浅程度。因此，这也是一项团队运动——成功的归因比任何单一大脑能提供的更多技能和资源。\n\
  \n即使攻击可以一直追溯到发起攻击的单个机器，识别屏幕后的人可能是困难的。根据政治学家 P. W. 辛格（P. W. Singer）和艾兰·弗里德曼（Allan\
  \ Friedman）来说，“确定归因等同于确定共犯。追踪行动者的努力到某个特定的地理位置是可能的，但要建立任何正式的政府角色（无论是作为行动的执行者还是授权者）要困难得多。”攻击可能是故意的，也仅仅是意外。或者表面攻击者可能被他人所操纵。更具问题的是判断这一恶意行为是由国家授权的还是由孤立行为者实施的。\n\
  \n### 模糊的归因削弱了我们的威慑能力\n\n如果无法识别责任个人或群体，那么我们在阻止恶意行为方面就会遇到困难。这个问题变得复杂，是因为网络攻击可以经过中立第三国的设施进行路由，进一步掩盖网络攻击者的身份。即使识别出恶意行为者，如果它是非国家行为者，也可能没有物理资产可以进行制裁。由于个人和国家能够在网络空间掩盖归因，惩罚威胁的信誉往往较低。因此，前国防副部长威廉·J·林恩三世（William\
  \ J. Lynn III）写道：“威慑将不可避免地基于拒绝攻击者获得任何利益，而不是通过报复施加成本。”\n\n### 归因格局的变化\n\n然而，有迹象表明，网络空间的归因问题可能正在发生变化。政府对此不再像十年前那样陌生了。在从驻守纽约的退役航空母母“企业勇士号”（USS\
  \ *Intrepid*）上发表的演讲中，时任国防部长莱昂·潘内塔（Leon Panetta）强调了政府在识别网络攻击来源方面的进展：\n\n> 如果我们的网络对手知道我们能够将攻击联系起来，或者知道他们的努力在我们强大的防御面前将失败，那么他们攻击我们的概率将大大降低。部门在解决一个让威慑网络对手变得更加复杂的问题上取得了重大进展：即识别攻击起源的困难……在过去的两年里，国防部在取证方面投入了大量资金来解决归因问题，我们正在看到这些投资的回报。潜在的攻击者应该意识到，美国有能力定位他们，并让他们对可能试图伤害美国的行为负责。\n\
  \n即使证明军事报复正当所需的归因确定性门槛被认为相对较高，但对网络攻击采取不那么剧烈的反应可能仍然具有威慑作用。这些包括经济制裁、刑事指控和其他形式的“点名羞辱（naming\
  \ and shaming）”。例如，在美国 2013 年指控人民解放军成员从事商业网络间谍活动后，中国政府同意减少商业网络黑客行为。2014 年，奥马政府公开指责朝鲜入侵索尼影视公司，破坏了这家好莱坞制片厂的物理计算机系统并盗取了敏感数据，包括未上映电影的剧本。\n\
  \n更具戏剧性的是 2016 年，美国情报界正式指责俄罗斯情报机构入侵民主国家委员会数据库，司法部起诉了两名俄罗斯情报特工，指控他们入侵了雅虎 5 亿用户账户。\n\
  \n### 成本与私营部门的参与\n\n的确然，即使是对另一个国家提出正式指控也是有成本的，包括与涉嫌犯罪者敌对、设定一个增加识别未来恶意行为者压力的先例，以及暴露政府通常希望秘密以继续收集价值情报的情敏感来源和方法。\n\
  \n另一种让国家黑客感到难堪或沮丧的方法，是依靠私营网络安全研究机构，通过发布开源文章将入侵与可能的执行者联系起来，从而公开归因。公众舆论法庭并不需要“排除合理怀疑”的证据。即使这些研究机构没有关于究竟是谁负责的结论性证据，关于攻击者的信息披露也能让其他人进一步调查，并凸显一条让其他潜在受害者警惕的威胁途径。暴露国家黑客行为的私营安全公司不需要在一个政府正式指控另一个国家网络侵略时与更广泛的地缘政治考虑作斗争。\n\
  \n通过鼓励私营公司调查和归因国家黑客行为，公众的意识可以得到提高。这种情况发生在 2013 年，当时《纽约时报》雇佣了 Mandiant 计算机安全公司调查其网络遭受入侵的情况。Mandiant\
  \ 帮助将执行者追踪到一组特定的互联网地址，这些地址分配给上海某中国军事单位的场所。利用社交媒体和其他线索，该报纸能够识别出两个个人黑客。如前所述，美国司法部随后起诉了五名人民解放军成员从事网络间谍罪。通过公开报道这些结论，《纽约时报》让公众了解中国窃取美国公司商业秘密的情况，并可能让中国感到难堪从而改变其行为。\n\
  \n\n\n\n\n我们还应该扩大对什么是网络攻击的国家责任以及什么构成战争行为的定义。正如讨论过的，私营黑客与政府当局之间的关系通常被刻意隐藏在模糊之中，以产生官方的可否认性。如果一个国家只有在有官方支持的明确证据的情况下才能对破坏性攻击负责，那么要证明实际的国家责任——特别是在行动机密的限制范围内——往往是困难的。在如此狭窄的国家责任定义下，威慑力将被削弱，因为更难触发相互自卫条约（如`NATO\
  \ Article 5`）或《联合国宪章》下规定的自卫权。\n\n诚然，对网络攻击做出反应的国家可能会通过秘密证据或间接证据来证明其对犯罪者的归属认定。对于严重的网络侵略行为，响应国可能仅根据其对归属的结论采取行动。正如伊拉克战争的对比所示，在国际法下为回应提供辩护并建立国际支持，通常在全球和国内范围内带来更具可持续性的结果。\n\
  \n解决方案是以广视角看待国家责任；根据这一规则，如果一个国家明知并容忍从其领土发出的攻击，就足以判定这些行为的责任。如果攻击目标将发射源追踪到`State X`的一台计算机服务器，那么要求`State\
  \ X`停止攻击并惩罚攻击者，或将其作为赞助者追责是恰当的。`State X`未能关闭侵略可能为对攻击者进行直接回应，以及对鼓励或忽视攻击的国家进行惩罚性报复。在这种宽泛的威慑观点下，归属推定关注于发起网络攻击的国家，这为该国监管其境内黑客的行为提供了激励。\n\
  \n### 主动防御与私人掠夺者问题\n\n一些人认为，当“主权”政府无法或不想停止网络攻击（无论是破坏性的还是仅仅是窃取的）时，受害者应该有权进行回应——这有时被称为“主动防御”。美国军和情报机构已经在使用主动防御系统，被描述为“部分传感器、部分哨兵、部分射击手”，用于实时反击网络入侵.^(29)。问题在于，是否也允许私营部门参与主动防御。\n\
  \n主动防御引发了之前关于国家对私营黑客责任范围的反面问题——即作为网络攻击受害者的私方是否应该能够报复。但最初作为针对犯罪性破坏的防御可能会升级为战争，而国家本身将对此负责。政府是否应该拥有触发此类升级行为的排他性权利？^(30)\n\
  \n应用于网络空间的主动防御存在争议，但其核心涉及为了应对持续且危险的威胁的机动性和适应性。^(31) 主动防御者将“监控、响应对手并从其身上学习”。^(32)\
  \ 存在一系列可以被定性为主动防御的行为。最基本的（也可能最不会引起反对的）是被动的、分析性的行动，例如创建一个包含看似具有吸引力的目标的“蜜罐”，用于诱捕并捕获恶意软件以进行取证分析。\n\
  \n![](img/189-1.png)\n\n在光谱的另一端是“反击攻击”（hacking back），这涉及追踪攻击者并通过中和被盗数据或使攻击发起地的服务器失效来做出回应。网络与国土安全中心（由我共同担任主席）的一个工作组在\
  \ 2016 年 10 月的一项研究观察到，在这两极之间存在一系列主动防御步骤。^(33)\n\n对反击攻击至少有两个反对意见——一个是法律上的，另一个是实务上的。在法律上，我们通常不允许私营受害者采取自我救助来报复或中和他们的攻击者。（这与自卫有所区别，自卫是阻止攻击而非对攻击进行报复。）在实践中，没有保证私方可以进行手术式地限制回应；反击攻击可能无效（例如，未能擦除被盗数据），而且还可能放大问题。私方也无法确定犯罪者的真实身份。事实上，如上述所示，政府并不总是能够进行归因；例如，在\
  \ 1999 年，五角大楼将从`U.S. Air Force`——军事设施地图和硬件设计——的数据外泄追踪到俄罗斯的一台计算机，但未能归因任何政治实体或明确动机。^(34)\
  \ 反击攻击增加了巨大的附带损害风险，或升级为国家间的冲突。反击攻击还存在使私人冲突公开的风险：美国公司通过中和目前存储在外国服务器上的被盗数据来报复，在海外可能被视为美国政府的黑客行为。\n\
  \n更具攻击性的是不仅是为了防御而是为了报复的私人行动。这可以被解释为未来的威慑，尽管很难辨别这种政策的原则性辩护。\n\n存在两个值得辩论甚至立法立法的中立立场。一种是在蜜罐中嵌入恶意软件，使得对目标的攻击和信息的窃取产生将恶意软件回传到攻击者自己网络的效果。这样做的好处是让攻击者自食其果，因为正是他自己的窃取行为导致了其网络遭受损。。但这并不能完全消除附带损害的风险，因为精明的攻击者可能会将被盗数据存放在无辜第三方的代理服务器上。\n\
  \n一个更保守的立场是在蜜罐中嵌入不是恶意软件，而是虚假或带有标记的信息。在前一种情况下，窃取知识产权的人实际上误导了其努力，因为他寻求利用的东西可能是无法使用的。然而，值得注意的是，如果恶意行为者完全渗透了公司网络，它通常能够发现公司试图植入虚假或标记信息的尝试。也许更有用的是，秘密标记被盗的知识产权允许所有者对任何试图从数据窃取中获利的人提起诉讼。\n\
  \n\n\n\n政府在许可私人报复中应扮演什么角色？美国宪法规定，“国会有权……宣战、授予私掠许可许可证和报复许可，并对陆上和水面上的捕获制定规则。” 私掠许可许可证（Letters\
  \ of marque）是授权私人掠夺者捕获敌舰的正式许可。在美国历史早期，这种做法允许政府以低成本增加其舰队规模，并监管公海上的私人行为；私人船只船可以从捕获和掠夺敌方船的利润中获得分成。例如，在\
  \ 1798 年至 1800 年与法国爆发的未宣战战争期间，国会通过了法律，为重新夺回美国船只提供奖励。在那个时期的一个案件中，最高法院的意见将国际敌对描述为“完全战争”和“不完全战争”。如果一场“完全的”或已宣布的战争触发了特定的国际法交战和中立状态规则，那么一场“不完全的”或未宣布的战争可能只涉及某些方之间的敌对，例如获得私掠许可许可证授权的方。\n\
  \n利用与私掠许可和报复许可的类比，政府可以在网络空间批准某些私人行为，例如报复。正如美国和法国船只在不触发正式全面战争的情况下进行战斗一样，美国也可以通过授权私人行动者在网络空间中与其敌人战斗。从国内法的角度来看，宪法可以解释为私掠许可许可证允许国会授权网络私人掠夺者。从国际法的角度来看，1856\
  \ 年的《巴黎海洋法宣言》旨在废除私人掠夺行为；然而，美国并未批准该宣言，因此它对美国的行动没有约束力。尽管有《巴黎宣言》，各国继续使用私掠许可许可证来反击海盗，并在某些情况下授权自卫，尽管这种做法尚未完全发展为国际习惯法（即出于法律义务感而采取的持续国家实践）。尽管存在模糊性，但国际法可以被辩证为允许对网络海盗进行自卫。\n\
  \n### 增强国家资源\n\n授予私掠许可许可证可以增强美国用于保护信息免受盗窃和破坏的资源。正如牛津大学网络学者弗洛里·埃格洛夫（Florian Egloff）观察到的，“为了经济财富转移而培养和利用私人人才是私人掠夺的现代版本。”苹果、脸书、谷歌、微软、威信——这些跨国科技公司受利润驱动，但它们的利益也与美国的利益高度一致：信息的自由交换、经济整合、技术发展以及对私有财产（包括商业秘密）的保护。授权此类行动者积极防御自己的网络有助于遏制知识产权和其他敏感数据的盗窃。\n\
  \n### 成本与风险\n\n但私掠许可许可证将产生成本。政府在控制私人报复方面将面临困难。意外后果可能会升级冲突。拥有资源进行反击攻击（hack-backs）的私人行动者包括跨国公司，这些公司可能因为担心违反反击攻击的外国法律而犹豫不决。此外，私掠许可许可证将阻止美国实施“合理否认”（plausible\
  \ deniability），并可能向外国对手暴露美国至少的部分能力。授权私人行动者可能会削弱我们谴责他人此类行为的能力。这可能会迫使美国停止来自行动符合美国利益的行动者的网络行动。\n\
  \n保护美国民用网络基础设施对于维持我们经济的活力和国防至关重要，美国国土安全部在保护 `.gov` 和 `.com` 地址方面承担着艰巨任务。为了增强防御和威慑网络攻击的能力，政府应该针对某些特定行动培训并授权“私人掠夺者”，例如创建带有标记信息的蜜罐（honeypots），或协助威慑针对美国公司和基础设施的攻击。然而，为了减少意外后果，政府应绝对禁止私人报复，并将网络防御活动限制在上述范围之内。\n\
  \n### 美国法律权威在无国界战场上如何变化？\n\n战争法通常取决于战场的存在。但网络攻击或报复是在承载民用流量的同一网络上执行的。针对网络攻击，此时将网络视为可以随意对待的目标是合理的吗？随着现代地缘政治冲突日益将经济实力视为武器（例如金融制裁），承载经济活动的平台已成为战场的一部分。\n\
  \n网络战是在无国界的区域内执行的，对美国基础设施的攻击可能由敌人在德克萨斯州奥斯汀的一家网络咖啡馆通过一个 U 盘发起的。对于防御和安全机构而言，假装执法执法与军事行动之间存在清晰界限已不再意义。传统上，我们的美国法律结构建立在一个观点之上：战争涉及一个界定的战场，且几乎都在海外。因此，根据\
  \ `posse comitatus`（民兵强制法法）等美国法律，在国内执法（军事禁止进入）与军事战斗（武装部队主导）之间划定了一条清晰的界限。但支撑第 10\
  \ 卷（武装部队）、第 18 卷（刑法）和第 50 卷（情报）政府权威大部分结构的国内外区别，并不适用于这种环境——在这种环境中，攻击不仅可以从全球范围内的服务器发起，也可以从美国境内发起。当外国敌人的攻击从位于美国境内某咖啡馆的服务器发出时，`posse\
  \ comitatus` 如何适用尚尚不清楚。当网络攻击上升到战争水平时，我们的回应必须结合军事和执法权威。\n\n在情报收集中，对我们的法律架构进行类似的重构也是必要的。涉及美国人员的收集中通常规范情报收集的限制，在外国政府劫持美国人的电脑发动攻击时，不应完全适用。而且这些问题必须以网络速度进行裁决。也许在紧急情况下，如果政府需要访问正在破坏关键基础设施的美国境内服务器，不应要求搜查令。这类似于为了防止迫在眉睫的身体危险而需要采取紧急行动时，对搜查令要求的公共安全豁免。我们管理情报机构权威法律核心的许多区别，并不适用于一个无视国内外区别的网络冲突和网络威胁的世界。\n\
  \n\n\n\n暂且不论美国法律的运作方式，网络空间领域的武装冲突对国际武装冲突法的适用提出了极具挑战性的问题。例如，该法的一项基本原则是无辜平民不能成为攻击目标，且必须采取合理措施，避免对军事力量进行许可攻击时对平民造成附带伤害。但在网络空间中，平民何时跨越界限参与网络战斗可能是模糊的。保护和维护执行军事功能的计算机网络可能构成对敌方的直接攻击。同样，为其他用途设计可转化为破坏敌方指挥控制系统的攻击性黑客工具。只有军事“物体”才能被合法攻击，而此类物体通常被定义为“可见且实体的东西”。但目前数据是否属于“物体”尚不清楚。虽然计算机基础设施是实体的，但流经网络或存储在“智能”设备中的数据并非实体。另一方面，如果数据被销毁，物理“智能”设备的使用价值也随之消失。这引发了关于数据是否可以成为合法军事目标的争论。相反，如果数据不是“物体”，那么在性质上属于平民的数据可能在现有法律的字面解释下无法受到保护。\n\
  \n在物理世界中，有一些物体具有双重用途——既有助于维持军事行动，又对纯平民目的至关重要。例如，用于停泊海军舰船的海港。根据公认的法律原则，可以将海港作为军事目标，并采取合理注意避免损坏仅具有平民功能的港口要素。但在网络空间中，用于军事目的的基础设施可能同样用于纯平民目的。流经基础设施的数字数据包可能同时包含军事和平民数据元素。从逻辑上讲，人们可能会认为整个互联网或大部分互联网都是军事物体。许可目标与禁止目标之间的界限变得非常模糊。\n\
  \n互联网地理上的不确定性和功能上的互换性，意味着规范军事和情报机构以及武装冲突的传统法律规则不再完全适用。虽然在民主国家中限制军事权力以及在时期保护平民的价值观比以往任何时候都重要，但在`Data\
  \ 3.0` 的新格局下，这些应用需要在军事执行任务的方式和地点具备更大的灵活性。\n\n## 结论\n\n## 应对数据 3.0 的挑战：法律与政策建议\n\n\
  在我们的大数据时代，我们希望赋予政府适当的法律权限来提供安全，同时维持人类尊严所需的足够的隐私范围和自主权。公民寻求享受现代商业数据驱动技术带来的便利和效率，而不将他们的安全和自由置于风险之中。\n\
  \n如今的技术具有生成和审查海量数据的能力，使社会变得麻木，对我们失去隐私产生了社会接受度。鉴于电子邮件、电话元数据和其他此前私有的信息形式被他人轻易捕获，美国人正在放弃对电子隐私的控制。如今的法律框架试图在一个基于几十年前的技术假设下保护隐私权。我们已经接受了电子邮件可能被阅读的事实，并习惯了我们的数据被他人收集和使用。\n\
  \n如果隐私意味着有能力从窥探的目光中隐藏或遮蔽我们的行动和思想，那么这艘隐私之船已经启航了。我们产生的数据量以及可以应用于我们数据上的分析能力意味着，我们极少数人可以保持透明。我认为，我们关注的重点应该转向保护我们的自主性。我们应该对我们产生或与我们相关的数据保持合理程度的所有权和控制。\n\
  \n在过去，政府对本国公民进行监控的能力不断增强，通过重新校准个人自由的范围得到了制约。随着技术的进步，平衡应当进行适当的转变。\n\n回想起在`Olmstead\
  \ v. United States`案中，法院权衡了个人隐私权与政府监听对话的需求。布兰迪斯法官在反对意见中认为，“密封的信件和私私的电话信息在本质上没有区别。”在权衡政府不受限制的窃听访问权与个人隐私权时，布兰迪斯法官提供了深思熟虑的反对意见，认为必须作为隐私受到保护的是私人信件或电话信息中的内容，而不仅仅是通信媒介的物理完整性。\n\
  \n但历史的教训不仅是随着新侵入性技术的开发，规则通过限制政府权力来保护个人自主性。法律也会发生变化，鼓励政府更积极地行使权威，以防止权力在不受问责的私人手中过度集中。这种情况发生在西迪·罗斯福总统执政期间，他动员了联邦反垄断法来拆解私营企业中高度集中的财富和权力。同样，反窃听法也延伸到了私人公司和公民，以保护我们的隐私。\n\
  \n所以，正如我们看到的，隐私和自由必须不仅仅意味着免受政府监控的自由。我们还需要免受可能无处不在甚至具有强制性的私人监控危险的保护。然而，如今保护我们隐私的针对公司的法律和社会框架在这里不再足够了。在不理解我们同意的程度的情况下，我们在长达数页的同意书中，通过一个简单的勾选或点击，就自由地将数据交给了私人公司。\n\
  \n诚然，我们可以对那些过长、太复杂或没有限制的同意书说“不”。但当寻求我们同意的服务是垄断时，而我们不得不将同意作为获得必要服务的条件，那么政府反垄断机构应当对所要求的同意范围设定限制。此外，我们从未给予过同意的私人公司有时会在没有明确法律许可的情况下使用我们产生的数据，仅仅是因为不清楚到底谁真正“拥有”这些数字信息。\n\
  \n当技术以以前无法实现的方式极大地扩展监控活动的能力时，我们需要一套新法律。我们看到国父们如何设计宪法以通过私有财产保护隐私，并看到法律如何应对电报和电话而演变以保护对话。今天，技术极大地扩大了不仅政府而且公司和个人收集、存储和分析数字数据的能力。现在再次是国会和法院重新校准法律和政策的时候。\n\
  \n不可避免的是，这不同价值观之间进行权衡：隐私、自主、安全，以及个人与集体利益之间的平衡。试图将新技术装入旧容器会破坏或扭曲容器。我们必须创造新的容器，但这一项目必须以我们正试图保护的内容为指导。\n\
  \n\n\n\n\n我通过几个场景开启了这本书。布莱恩（Brian）和凯特（Kate）是贴心的父母，希望给女儿提供最好的照顾，但无意中通过给她买一个 Omnicorp\
  \ 公司的 Talkie Terry 娃娃，从而“同意”了隐私的侵犯。出于好的隐私法教授卡尔（Carl）因为他的数字排放而面临更高的保险费率。还记得詹姆斯（James），他在“组织”的监督和控制下过着完全程序化的生活。我们必须防止这些场景中最糟糕的特征变成我们的现实。\n\
  \n## 新法律和规则的五个特定框架可以阻止这些场景\n\n首先，为了保护我们免受坏分子对物理安全和网络安全的攻击，同时防止政府过度扩张威胁我们的自主权，我们必须认识到数据\
  \ 3.0 既需要放宽政府收集信息的范围，同时也需要收紧对这些信息进行检查、分析和使用的标准。我们应该授予政府相对广泛的访问和收集数据的权限。如果不遵循可能随着时间推移才显现意义的数字数据追踪，政府就无法有效破坏犯罪企业或挫败恐怖计划。如果政府没有初始的访问和收集能力，以便在上下文中分析数据中的关系，线索就会中断。然而请注意，我并不是主张私营公司在其系统中构建如解密后门之类的漏洞来协助政府。政府应该使用自己的资源；这一负担仍由政府承担。\n\
  \n但即使对访问和收集的限制被放宽，也应该加强对政府（人类或机器人）对数据进行检查、分析、传播和使用的限制，以加强对防止滥用的民事自由保护。从个人自主权角度考虑，这平衡了保留有用信息的需求与控制人类访问（以及可能滥用）这些信息的需求的需求。\n\
  \n其次，考虑当我们的企业或家庭受到网络犯罪分子、恐怖分子或敌对国家攻击时的主动防御防御谱。我建议许可私人参与者防御其网络可能帮助美国遏制知识产权的盗窃——这是史上最大的劫案。但为了减轻意外后果和冲突不受控升级的风险，政府必须将这些许可限制在特定活动中，并设定明确的规则。特别是，除非在适当执法或司法机关的指导和控制下，否则不允许任何私方报复或入侵另一个网络——即使它是黑客攻击的源头。\n\
  \n第三，为了避免互联网碎片化以及随之而来的巨大的全球经济成本，国会应与其他合作，在获取数据的法律程序和管理该数据的实质性法律方面实现统一。这需要建立具有执行力的条约或国际协议，重点侧重于保护数据主体的权利，因为个人自主权的核心是对其自身数据的合理控制。这一不断发展的国际法体系的目标应该是避免不一致性，从而避免导致各国制定强制性数据本地化的法律，进而损害互联网数据的全球架构和移动自由。\n\
  \n第四，法律必须演进，以控制私营参与者对个人数据的使用。在一个人们不可避免地产生数字排放，并且往往无法对应用程序或第三方使用其数据提供有意义同意的世界里，法律应该将默认设置转向更好地保护隐私和自主权。正如某些欧洲监管机构目前坚持的那样，这意味着如果企业寻求将数据用于改进用户参与的特定服务之外的目的（例如转售给第三方营销人员），则应获得该用户的确认或“选择加入（opt\
  \ in）”同意。当数据聚合者或平台试图转售或重新利用从最初未经许可便收集该主体数据的第三方处获取的个人数据时，还应强制要求数据主体提供更明确的同意。对于那些市场地位使其成为有效垄断者的聚合者或平台，同意可能被认为是不够的；监管机构可能对垄断者可能从事的数据使用实施限制，甚至可能要求公司就某些用途向主体付费。\n\
  \n最重要的是，法律必须限制公司强迫个人同意放弃对其数据的广泛控制权。因此，雇主或保险提供者坚持将对个人数据的几乎无限访问作为就业或负担得起保费的条件，应当量身定制，仅适用于与就业或可保性合理相关的信息。且出于这些原因收集的数据应被禁止转售或用于不相关的目的。\n\
  \n事实上，考虑到非政府组织已经开发了衡量科技公司响应政府用户数据请求情况的透明度指数，我们应该制定透明的说明或法规，以规范私营公司如何使用、特别是如何共享个人用户的数据。\n\
  \n第五，法律必须激励私营参与者与政府合作防御共同漏洞。大部分 IT 基础设施位于私人手中，但互联网使其具有相互依赖性。如果没有政府的专业知识甚至监管，加之私营部门的创新和承诺，互联网基础设施将继续受到其最薄弱环节的侵害。作为这一努力的一部分，法律应该鼓励并保护私营和公共实体之间基于行业和地区的基础上直接且实时的信息共享。\n\
  \n## 我们公民需要拥有自己的互联网\n\n如果从数据 3.0 技术革命中可以总结出一个首要教训，那就是我们的日常生活被数据描述甚至定义了。我们产生数据，追踪我们的行为、偏好、位置甚至意图。数据被用来激励、威慑甚至强迫我们。如果其他人（无论是政府还是私营参与者）管理我们的数据，他们实际上控制了我们所做的的大部分。\n\
  \n互联网的本意是作为赋能个人、建立全球连接甚至促进自由的力量。尽管有人认为互联网可以是不受法律的、几乎无政府的区域，但这本书证明了如果没有深思熟虑的规则，互联网可能成为限制个人自主、欺凌和操纵的工具。\n\
  \n看待我们所处的数据海的一种方法是将其视为全球公共利益。只有在存在禁止过度干扰和破坏的规则时，这种公共利益才有价值。因此，我们必须制定规则，防止强大的机构和坏分子利用互联网数据损害而非增强我们的自主权。\n\
  \n# 致谢\n\n这本书源于多年对情报、安全和执法问题的处理，这些经历让我接触到了我们快速扩张的数据宇宙的价值用途——以及滥用。构成本作品核心的许多观点曾在评论文章、文章、演讲和非正式讨论中提到过。\n\
  \n\n\n\n将这些想法汇编成书的建议，得到了格拉姆·艾利森（Graham Allison）教授的鼓励与协助。他是一位多产的学者、哈佛大学肯尼迪学院贝尔费中心的前任院长，也是我的朋友。格拉姆鼓励我致力于创作一本书，慷慨地为我贝尔费中心成员的知识支持，并向我介绍了他的文学经纪人。\n\
  \n通过格拉姆，我有机会与两位卓越的学者合作：`Scott McEntire`，一位退伍军人和贝尔费中心学者；以及 `Dan Severson`，一位哈佛法学院学生，现任律师。`Scott`\
  \ 和 `Dan` 帮助塑造了书的内容，开展了大量的研究，起草了章节，并为这项事业付出了巨大的努力。贝尔费中心其他投入时间讨论我的想法并提供有用意见的专家还包括迈克尔·苏尔梅耶（Michael\
  \ Sulmeyer）`、布鲁斯·施奈尔（Bruce Schneier）`、约瑟夫·奈（Joseph Nye）`和安·布斯斯泰德（Anne Boustead）`，以及在格拉姆组织的各种开放论坛上提问并提出建议的学生们。\n\
  \n在我的咨询公司切尔托夫集团（Chertoff Group），我得到了许多同事的宝贵帮助，多年来他们在政策问题上与我合作，并与我共同撰写了文章和演讲，这些构成了本书的大部分知识基础。`保罗·罗森茨威格（Paul\
  \ Rosenzweig）`曾与我合著过多篇文章。`凯蒂·蒙哥马利（Katy Montgomery）` 启发了我对书中许多领域的思考，并是一位出色的编辑。`艾兰·韦勒（Alan\
  \ Wehler）` 是知识的源泉也是一位经验丰富的研究者，他承担了审阅我的草稿、检查来源并提出重要建议的任务。我的行政助理梅吉·特拉斯蒂（Meggie Trusty）`愉快地承担了汇总最终成品、协调编辑和管理后勤的任务。没有他们，这本书就无法完成。\n\
  \n通过在全球互联网治理委员会的工作，我获得了其他宝贵的见解，该委员会由`卡尔·比尔特（Carl Bildt）`和`戈登·史密斯（Gordon Smith）`负责主持；来自国际治理创新中心的`芬·汉普森（Fen\
  \ Hampson）`；以及查塔姆学院的`帕特里夏·刘易斯（Patricia Lewis）`。\n\n我的编辑乔治·吉布森（George Gibson）和丹娜·艾萨克森（Dana\
  \ Isaacson），以及经纪人迈克尔·卡斯莱（Michael Carlisle）`，巧妙地引导我完成了从手稿到书稿、再到出版著作的过程。他们的建议是无价的。\n\
  \n无数其他人为我的工作贡献了智力，包括客户、律师事务所的同事和朋友。当然，所有事实或分析上的错误责任完全由我承担。\n\n如果没有我的妻子`梅莉（Meryl）``、女儿`艾米（Emily）``和儿子`菲利普（Philip）``的支持和建议，这本书不仅无法开始，更不用说完成了。在此过程中，他们提供了有用的建议和评论，并激励、鼓励和支持着我。\n\
