    # # 3 Regression analysis for correlation-based machine state and parameter reduction


    The fuzzy clustering of MSs, as presented in [8] can be exercised without any
    consideration of possible correlations between TPs and CVs. This is possible for
    a limited number of pre-defined MSs based on practical considerations about components
    of interest and – heuristically anticipated – correlations between CVs and TPs.
    If a broad range of TPs is combined with a variable resolution of TP sections
    as well as time spans the clustering of all combinations – for every CV – becomes
    unpractical, statistically challenging and the information content decays. Therefore
    a reduction of significant MS and TPs for these states is necessary. This task
    can be addressed by the usage of an artificial neural network (ANN), but the robustness
    and accuracy of such depends heavily on the quantity of training data. This means
    that every relevant MS has to occur several times before the ANN can play off
    its strength. This is not a given in non-serial machine tool applications as described
    in section 1.


    For this purpose, regression analysis between the TPs and the CVs can be employed
    as suggested in this paper. Based on the introduced cycle, a regression analysis
    was carried out. The input variables (TPs) and the responses (CVs) used in the
