    acquired sensor data is evaluated by the event detection module. If the log-probability
    for a new measurement is below the predefined threshold, an alarm is raised by
    the plug-in which sends this information to the platform cache.

    +   - Graph generation plugin (3): This plugin generates graphics containing the
    results of the event detection modules as well as the corresponding measurements.
    These graphics can be accessed from the web-client and provide a long term overview
