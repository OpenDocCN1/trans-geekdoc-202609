    input variables are the sheet thickness (ST) and the tool temperature during quenching
    (ToTemp). Controllable input variables are sheet temperature after warming (STemp),
    transfer time between warming and quenching (TT), quenching force (QF), quenching
    time (QT) and spacing (Sp). Quality variables are the output variables hardness
    at a critical point P1 on the finished part (P1H) and sheet thickness at another
