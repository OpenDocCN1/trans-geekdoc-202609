  md: '# 3.2 Process from idea to production


    The industrial analytics solution touches various fields, such as data engineering,
    machine learning, UI design and systems engineering. Covering the variety of these
    topics requires an interdisciplinary development team. Typical roles are:


    +   - Application Engineer: They cover the domain knowledge required to get a
    deep understanding of the target machine application.

    +   - Data Scientist: The data scientist is developing the analytics pipeline
    from an algorithmic point of view. This involves the feature preparation and selection,
    as well as the algorithm selection and tuning.

    +   - System Architect: System architects are required to help in defining a layout
    of the system architecture best suited for the target analytics application.

    +   - Full-Stack SW-Developer: The SW developer implements the selected analytics
    pipeline to the target system architecture, which can e.g. be an IPC on machine
    level up to a cloud or hybrid solution.

    +   - UX/UI-Designer: The user interface requires being designed for ease of use
    providing analytics result information at the right level of detail prepared for
    the target user group. The UX/UI designer creates the expected UI features and
    designers the


    All project management related tasks are realized by a corresponding project manager.
    As shown in Fig. 3, we follow a development process, which is inspired by the
    CRISP-DM process [3]. We tailored the process to meet the special requirements
    of industrial analytics. Starting from the target definition of the machine learning
    application, we investigate the quality and quantity of data of the given application
    and prepare suitable analytics models in the proof of concept phase. In the pilot
    phase, the model is implemented on the target platform and in the final development
    phase the missing software features, such as UI functionality and interoperability
    features are finalized.


    ![](img/a2f5eed6507498d886a06be86239344b_127_0.png)


    Fig. 3 Development process for data analytics solutions


    # 3.3 CI/CD Pipeline


    The development of the proposed container-based analytics solution is realized
    by a development team consisting of data scientist, data engineers and application
    engineers. One of the key challenges is to maintain team efficiency in such an
    interdisciplinary team. A challenge in the development process of an industrial
    analytics application is the implementation effort for migrating the selected
    machine learning model from the proof of concept phase to the final software solution
    in a production environment. A means to reduce this effort is to automate the
    software build process by continuous integration and continuous delivery (CI/CD).
    We have implemented a'
