    # ## 4 Conclusion and Outlook


    The presented approach can serve as guidance for the strategic evaluation of digital
    assistance solutions supporting maintenance processes. Combined with the proposed
    process-modeling tool the assistance system can provide the needed information
    to improve the maintenance efficiency. Since the proposed approach is currently
    a prototype, it encompasses some limitations that necessitate further research.
    First, the underlying decision hierarchy is based on experimental knowledge to
    experts and has been only validated through the proposed use case. In order to
    improve the quality of recommendations we need to collect feedback through employing
    the proposed approach to further practical use-cases. Second, the key information
    regarding hard- and software of the DAS on the market is extracted manually. By
    using various web crawling and web analytic techniques, including automated text-
    and web-mining methods, information can be extracted from documents such as product
    manuals and patent documents dynamically to identify the key features of existing
    products and technologies.


