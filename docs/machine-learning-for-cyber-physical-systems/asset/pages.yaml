  md: 'CI/CD pipeline for the industrial analytics solution and were able to significantly
    reduce the development effort.


    # 4 Practical Example


    To discuss these aspects on a practical example, we consider a real-world machine
    learning use case in the area of industry compressors. There, we used machine
    learning algorithms to automatically learn the sensor data distributions of a
    normal behaving compressor. Consecutively, our models detect deviations from these
    data distributions and label them as specific anomalies. These anomalies are then
    predicted by an additional machine learning model to forecast component failures
    and to prevent unforeseen downtimes.


    # 5 Summary


    In this contribution, we focus on technical and organizational aspects to make
    industrial analytics work for real-world applications in factory automation. As
    an example, we consider a machine learning use case in the area of industry compressors.
    We discuss the importance of scalability and reusability of data analytics pipelines
    and present a container-based system architecture. Furthermore, we share the experience
    of our development process to bring industrial analytics solutions from idea to
    production. Based on that process, we present a suitable CI/CD pipeline, which
    supports our development team to easily bring a machine learning model from the
    proof of concept phase to production.


