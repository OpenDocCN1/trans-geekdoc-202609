  md: "It is definitely hard (or even impossible) to explain why a certain algorithm\
    \ (like random forests in our case) provide the best results compared to other\
    \ algorithm. We will follow some discussions like on KDNuggets², on blocks like\
    \ Towards Data Science³ as well as in a work on energy consumption analysis [19].\n\
    \nThe models built by random forests are known as rather robust models, i.e.,\
    \ they are able to better handle outliers, missing data or just weird values.\
    \ We realize a slight overfitting, which is a well-known problem of random forests\
    \ (especially with deep trees), but it is minor and negligible in our case.\n\n\
    Neural networks (and also SVM) are more difficult to parametrize. Although we\
    \ applied various training iterations with different parameter settings (always\
    \ including default parameters), it is still imaginable that a better parameter\
    \ combination for the algorithms exists and the resulting model would outperform\
    \ our current best random forest solution. Furthermore, our model covers very\
    \ complex interactions among features, which is shown by the very deep trees (compared\
    \ to the total number of features). However, all features are numerical values\
    \ or categorical values, there are no images and we are not in the realm of image\
    \ or speech processing, which are known areas where neural networks and SVM (especially\
    \ for text data) mostly outperform other algorithms.\n\n# ## 5 Summary and Outlook\n\
    \nIn this paper, we presented a study for in-advance error classification in a\
    \ highly individualized production environment. The best predictions are achieved\
    \ by tree-based algorithm, in particular by a random forest classifier that achieves\
    \ a rather decent precision rate to forecast whether a particular ordered product\
    \ is likely to fail or not. However, the recall is comparable low. As the data\
    \ set is highly imbalanced, we used sampling strategies to slightly improve the\
    \ ratio between errors and non-errors in our data set.\n\nAs future work, we train\
    \ our models with an updated (newer) data set, containing more data in both dimensions,\
    \ i.e., for data entities samples, but also slightly more features. The expectation\
    \ is that this will increase the algorithm performance.\n\n# ## References\n\n\
