- pgno: 35
  md: 'a variety of algorithms (cf. [4–6]), ranging from rather basic ones like regression
    and Naive Bayes, to more difficult algorithms (in terms of setting-up and computation)
    like artificial neural networks (ANN), support vector machines (SVM), decision
    trees and extensions of them like random forests classifiers (RFCs) and boosted
    decision trees. Boosted decision trees and random forests belong to the so-called
    ensemble algorithms, i.e., a set of trees or a forest is built by an ensemble
    of decision trees. Ensemble algorithms implement methods to generate multiple
    classifiers and then aggregate their results (cf. [16]). Boosted decision tree
    algorithms apply a strategy of state-wise optimization of trees (measured in terms
    of loss functions) [14, 15]. Trees within the ensemble of random forests are built
    by randomly selecting the input features. Each tree in the ensemble is obtained
    by randomly selecting the input features. Within each tree, each node is still
    split by using the best feature (measured in terms of cost functions). The final
    result of the forest is obtained by unit votes from the trees for the most popular
    class.


    # # 3 Characteristics of the Data Set and the Application Scope


    The data set is obtained from a rather dedicated domain, following a production
    process for highly individualized products, there are some essential key characteristics
    that are comparable and transferable to different problems in completely other
    domains. Therefore, we have to tackle challenges to cope with the following data
    and application characteristics.


    The data set is highly *imbalanced*, which is actually in the nature of error
    and non-error classification problems. As already mentioned, we have a relationship
    of roughly 5.4 % belonging to the minority class (error case), while slightly
    more than the remaining 94.6 % of the data samples belong to the majority class
    (non-error case). It is well known that the best classification results can be
    achieved on balanced data sets (cf. [11–13]). Furthermore, in our case, we are
    not only interested in the correct classification, we also want to know which
    are the most influential features for ending-up in one of these two classes. Thus,
    a sound prediction model that is able to do a proper classification (i.e., a non-guessing
    solution!) is needed.


    A further property is the *complexity* of the model. The pure number of samples
    (roughly 560000 entries in the data set) is a decent size, but the compared amount
    of features (about 130) is rather high. In particular, not only the number itself
    is an issue, it is rather the feature characteristic that counts for complexity,
    as we will see later. There are no dominating single features and the number of
    influential features is high, ending up with models that need a deep consideration
    of feature manifestation and combinations, as demonstrated in the next section.


    Finally, the third characteristic is the vague *discriminability*, which is the
    most difficult one to handle in our case. Given all the features of a particularly
    ordered product of an error case, the manufacturing process at the first time
    has failed, while the second run with quite similar or even the same features
    (in-'
