    # 3.2 Dynamic systems


    Figure 2 shows the selected dynamic systems which are tested in combination with
    the prior shown excitation signals. In detail, the systems consist of a dead time,
    a low-pass filter, a nonlinearity and finally a resonant second order system.
    In detail, the systems are described as follows:


    *Dead Time* - In this benchmark, the excitation signal is shifted by 10 samples.
    No dynamic system is added between input and output signal. Hence, this responds
    to the most simple case for the detection of directed connectivities from one
    signal to another.


    *Low-pass filter* - The low pass filter with the time constant T = 1s represents
    the most basic system for the detection of input and output signal. In process
    technology low-pass filter are e.g. fluid tanks or pipes which tend to attenuate
    a disturbance and hence making in sometimes complicated to track back the disturbance
    propagation path. This benchmark is mainly used to investigate the behavior regarding
    the defined input signals in section 3.1.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '*Nonlinear system* - In this process a sinusoid is taken from the intermediate
    output signal $y_1(t)$. Depending on the amplitude of the excitation signal, the
    sinusiod will have a strong impact on the resulting output signal. The main purpose
    is to determine for which input signals the methods can still determine the input
    and output signals and their parameters.


    *Resonant system* - This benchmark represents a classic mass-spring-damper system.
    Like for the other systems the time constant is set to $T = 1$ s, while the dimensionless
    damping ratio is set to $\xi = 0.05$.


    ![](img/a2f5eed6507498d886a06be86239344b_110_0.png)


    # ## 4 Results


    For analysis, each dynamic systems wax excited with the different input signals
    and the spectral Granger causality was used for the detection of directed influences
    from $u \to y$, with results shown in figure 4, and from $y \to u$, where the
    results are shown in figure 4. If a directed influence has been found, the corresponding
    box contains a checkmark, elsewise it contains a cross. In the following a summary
    is given by following corresponding to the defined benchmarking dynamic systems.


    **Dead time:** In that use case, consisting of a simple time shift, for all input
    signals, the directed dependencies from $u \to y$ are detected and defined as
    being significant. Nevertheless, for the input signal $u_{sun}$ and $u_{imp}$
    a false positive directed influence has been found pointing from $y \to u$. The
    explanation is straight forward, since the impulse train as well as the sinusoid
    are cyclic excitations signals, hence having only a time shift in the signals,
    it is not possible to distinguish input from output signal .'
