  md: 'A possible example includes the CV1 (effective vibration level) which represents
    “undesired system energy” and causes wear. Therefore the CV1-level should be observed.
    The number and range of MS will gradually improve over time for a given machine
    tool. Therefore more and more clusters arise. Some of these clusters represent
    high wear-proceeding defined by high CV1-levels and caused by higher-than-average
    bearing temperatures while others won’t. Consequently machining operations as
    well as manufactured parts can be categorized and evaluated regarding their wear-processing
    characteristics. While some correlations may state the obvious – e.g. heavy machining
    – the overall load-wear correlation of the machine tool becomes more transparent.
    Furthermore measurements like switching of an axis position for high wear-processing
    manufactured parts became practicable.


    ![](img/a2f5eed6507498d886a06be86239344b_22_0.png)


    Fig. 5. Cluster-CV progress including Fuzzification ; CV1: Peff of ball-screw
    nut of Y2 axis


    # 6 Conclusion


    The auto-definition of relevant MS is crucial for addressing the ongoing changes
    in internal and external conditions of large and special purpose machine tools.
    By using a linear regression a significant reduction on the number of MS is possible.
    This includes the distinction between relevant and irrelevant sub-phases. Furthermore
    the regression analysis also enables to reduce the number of relevant input TPs
    (e.g. measuring parameters) per CV.


    Based on a subsequent clustering of the machine states these clusters represent
    a more stable base than a single MS. Their specific TP-ranges in context of specific
    CVs (e.g. a ball-pass frequency) represent machine tool characteristics. A categorization
    of processes and manufactured parts – regarding their wear-processing as well
    as'
