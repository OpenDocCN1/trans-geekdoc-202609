- pgno: 14
  md: '# Deduction of time-dependent machine tool characteristics by fuzzy-clustering


    Uwe Frieß⁸*, Martin Kolouch¹ and Matthias Putz


    ¹ Fraunhofer Institute for Machine Tools and Forming Technology IWU, Chemnitz,
    Germany


    * Corresponding author. Tel.: +49-371-5397-1393; fax: +49-371-5397-6-1393; E-mail
    address: uwe.friess@iwu.fraunhofer.de


    Abstract. With the onset of ICT and big data capabilities, the physical asset
    and data computation is integrated in manufacturing through Cyber Physical Systems
    (CPS). This strategy also denoted as Industry 4.0 will improve any kind of monitoring
    for maintenance and production planning purposes. So-called big-data approaches
    try to use the extensive amounts of diffuse and distributed data in production
    systems for monitoring based on artificial neural networks (ANN). These machine
    learning approaches are robust and accurate if the data base for a given process
    is sufficient and the scope of the target functions is curated. However, a considerable
    proportion of high-performance manufacturing is characterized by permanently changing
    process, workpiece and machine configuration conditions, e.g. machining of large
    workpieces is often performed in batch sizes of one or of a few parts. Therefore,
    it is not possible to implement a robust condition monitoring based on ANN without
    structured data-analyses considering different machine states – e.g. a certain
    machining operation for a certain machine configuration. Fuzzy-clustering of machine
    states over time creates a stable pool representing different typical machine
    configuration clusters. The time-depending adjustment and automatized creation
    of clusters enables monitoring and interpretation of machine tool characteristics
    independently of single machine states and pre-defined processes.


    Keywords: Fuzzy logic, Machine tool, Machine learning, Clustering.


    # 1 Introduction


    Technological value adding by extracting of CPS-capabilities is acting as selective
    pressure not only at academicals levels but already on the shop floor [1-3]. Integrally
    modules are predictive maintenance and cloud-based monitoring of production systems
    [4-6]. In [7] and [8] the authors introduced an approach to overcome limits in
    condition monitoring of large and special-purpose machine tools. The core challenge
    to address is the time-based change in nearly every internal and external constrain-
    parameter (Fig. 1).'
  merge: -1
  img_proc: true
- pgno: 15
  md: '![](img/a2f5eed6507498d886a06be86239344b_15_0.png)


    This results in difficulties to correlate any kind of measuring data with the
    health state of the machine and its components. Measures to address these challenges
    are:


    +   1. Definition of Machine States (MSs) based on trigger parameters (TPs) (**Table
    1**).

    +   2. Deduction and comparison of Characteristic Values (CVs) is only carried
    out

    +      a. for the same machine state

    +      b. Gradually for a cluster resulting from the fuzzy-clustering (see 5 below)

    +   3. Deduction of dynamic limits for the CVs over time

    +   4. Fuzzy-based interpretation of the current CV-values regarding their expectation
    values (see section 5, **Fig. 5**)

    +   5. Fuzzy-Clustering of MSs to create a stable pool including a broad range
    of characteristically configurations of the machine tool


    # 1.1 Limits of cluster analyses based on pre-defined machine states


    The fuzzy clustering of pre-defined MSs can be adequate for monitoring of components
    with clear objectives, e.g. the health state. Essential basis is a balanced definition
    of MSs by a maintenance expert. Therefore the pre-definition of MSs is prone to
    an unexperienced workforce. More challenging is the altering of processes and
    workpiece batches which leads to a decay of the initial defined MSs. The expert
    therefore needs to define new relevant MSs and exclude old ones from the “pool”
    (see Fig. 9 in [8]).


    Further potentials can be obtained if the pre-definition of MSs is replaced by
    an auto-derivation of MSs and a subsequent fuzzy clustering of these MSs with
    the objective of a broad characterization of the machine tool configurations over
    time. For this purpose, a tree-step machine-learning cycle is introduced subsequently
    and described in the following sections:


    +   1. Auto-definition of MS by segmentation of MS parameters (section 2)

    +   2. Deriving of Characteristic Values (CVs) for every state as described in
    [8]

    +   3. MS-TP-reduction: Correlation analyses between MSs, CVs, parameter reduction
    and exclusion of non-significant MSs (section 3 and 4)

    +   4. Fuzzy-clustering of MSs including derivation of Cluster-CVs (section 5)

    +   5. Deriving of machine-characterizing Clusters which represent concrete categories
    of machine tools, e.g. heavy machining for certain feed axes configuration.'
  merge: -1
  img_proc: true
