    # 3.3 Least Squares Optimization with Constraints


    **Set-up of the Optimization Problem** After each step in the production line
    the qualities P1H and P2ST are estimated using the variables already measured
    in combination with assumptions for variables of the process steps not yet performed
    (default values in Table 1). These assumptions are based on technological expert
    knowledge. After the warming process, we know the ST and the STemp. In order to
    get a first estimate for the expected quality P1H and P2ST we use the linear regression
    model established in 3.2 with the measured ST and STemp and default values for
    TT, ToTemp, Sp, QT and QF as stated in Table 2. If the estimated quality is below
    the predefined threshold, also stated in Table 2, the controllable variables following
    process steps have to be adjusted in order to bring the quality back into its
    desirable interval. An optimization process was established, which calculates
    the necessary adjustments. Least squares are applied to solve the emerging inhomogeneous
    linear system with constraints after every process step. With each step the accuracy
    of the model improves as less and less process estimates have to be used to predict
    the quality.


    In order to solve the optimization problem least squares with equality and inequality
    constraints is performed. The function from the R-package limSolve is called lsei()
    and solves


    ```

    min ||Ax - b|| subject to Ex = f, Gx >= h.

    ```


    For the optimization after process step 1 (warming) the matrix A is the unity
    matrix with dimension 4 because there are four subsequently determinable variables
    left in the manufacturing process. The vector b contains the default values /
    desirable process values for the 4 adjustable variables. The objective function
    tries to find a solution for the 4 adjustable variables which is as close as possible
    to the desired default values. Since our optimization problem does not have equalities,
    E is a zero matrix of the dimension 4 and f is a vector of zeros. The inequality
    constraint Gx >= h is constructed from the upper and'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'lower boundaries of the adjustable variables and the linear regression equations
    combined with the quality boundaries. The optimization after process step 2 is
    conducted in a similar way but only 4 adjustable variables are remaining.


    **Weighting of Parameters** Since an adjustment of some parameters is easier than
    others, e.g. TT or QT, weighted least squares can be used to improve the efficiency
    of parameter optimization. The weighting vector W_a as an additional input for
    the lsei() optimization function is defined to prefer changes on easily adjustable
    variables such as TT and QT. Thus the weighting coefficients for TT and QT were
    chosen 1 while they are 100 for QF and Sp. By giving each variable its proper
    amount of influence on the resulting quality a more realistic image of the real
    press hardening process is established. The weight for each variable is given
    relative to the weights of the other variables.


    # 4 Results and Discussion


    In order to show the versatility of the approach four different scenarios are
    presented in the following.


    The type of component to be produced has an immediate impact on the optimization
    problem. The system can be optimized towards the hardness of the produced component,
    process velocity (usually as fast as possible to be cost-effective), geometric
    accuracy or other objectives. In the production industry the overall equipment
    effectiveness (OEE) is a relevant and popular indicator for a machine or production
    line. Thus, we want to focus on a process as fast as possible which correlates
    directly with the maximization of the number of cycles in a production line. For
    this purpose, the default setting for TT is the smallest possible value of 5 s,
    similar to a minimum QT of 2 s. The QF has to be as high as possible in order
    to allow the quenching process to be fast. Thus, a QF of 2,000 kN is chosen as
    default allowing slight upward adjustment with a total maximum of 2,500 kN. The
    Sp default is 1.05 mm.


    The quality control of the production line can return an “accepted part” for parts
    meeting both quality criteria as defined in Table 1 and “defective part” otherwise.


    # 4.1 No Parameter Adjustment Necessary


    In the majority of cases a production line should produce high quality parts when
    working with feasible process parameter intervals. One example for a process cycle
    resulting in an accepted part is shown in Table 2. The warming process is conducted
    with a ST of 1.5 mm and a resulting STemp of 900°C. Both P1H and P2ST are estimated
    with the linear regression approach described in section 3.2 with default values
    for TT, QF, QT and Sp (see Table 1). The predicted P1H and P2ST imply a qualitatively
