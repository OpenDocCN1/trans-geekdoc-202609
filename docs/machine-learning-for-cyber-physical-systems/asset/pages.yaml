- pgno: 123
  md: '# # Making Industrial Analytics work for Factory Automation Applications


    Markus Koester


    Weidmüller Group, Klingenbergstr. 16, 32758 Detmold, Germany


    markus.koester@weidmueller.com


    **Abstract.** In this contribution, we give an insight in our experiences in the
    technical and organizational realization of industrial analytics. We address challenges
    in implementing industrial analytics in real-world applications and discuss aspects
    to consider when designing a machine learning solution for production. We focus
    on technical and organizational aspects to make industrial analytics work for
    real-world applications in factory automation. As an example, we consider a machine
    learning use case in the area of industry compressors. We discuss the importance
    of scalability and reusability of data analytics pipelines and present a container-based
    system architecture.


    **Keywords:** Industrial Analytics, Anomaly Detection, Development Process.


    # ## 1 Introduction


    In factory automation maintainers and operators constantly ask themselves if their
    assets are operating well or what measures they should take to keep up a good
    operation and to avoid unforeseen downtimes. Classical condition monitoring approaches,
    such as signal tracing and threshold mechanisms, only apply for a reactive maintenance
    scenario, where machine operators usually get informed, when it is already too
    late to avoid a machine failure. Inspired from recent advance in other areas such
    as e-commerce and finance, industrial analytics based on machine learning algorithms
    is gaining attention as a mean to get a deeper insight into the current state
    of machines or plants. Machine learning is promised to be the key technology to
    deliver a glimpse into the future of the machine behavior, predicting if and when
    components are supposed to fail from a statistical point of view under the current
    operational conditions. In the context of factory automation, machine learning
    is a relatively new topic, such that the know-how and experience of machinery
    experts in implementing data analytics pipelines is still limited. Adapting machine
    learning in the field of factory automation requires not only a sound understanding
    of the underlying mechanisms of the various algorithms, but also software engineering
    skills to implement suitable data analytics pipelines for the target machine.
    Working examples of machine learning implementations at a production level are
    still rare [1].


    This paper gives an overview of the experiences we have gained in creating industrial
    analytics solutions in the area of machinery and factory automation. The focus
    of'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'this paper is more on the challenges in implementing these solutions. Section
    2 gives a high-level overview over the functionality of the industrial analytics
    pipeline, which was considered in the implementations. This pipeline describes
    the data flow starting from the raw data created by the target machine to the
    visualization of the analytics results. Section 3 covers the main scope of this
    contribution by highlighting the challenges, which are a) design considerations
    to allow for scalability of the solution, b) our underlying process from the first
    idea of the solution to the final production-ready software, and c) a continuous
    integration (CI) and continuous delivery (CD) pipeline for automatically building
    the software solution. In Section 4 we give an overview over an example application,
    which we have implemented the industrial analytics solution for.


    # 2 Overview of the Industrial Analytics Pipeline


    The core concept of the analytics pipeline is present in Fig. 1. Collecting machine
    data is highly use case dependent and requires to be tailored according to the
    given data sources and accessibilities of the target machine. To simplify the
    data processing of the following analytics steps the raw data requires being collected
    and stored centralized if the target architecture allows. Having a single data
    source for further data operations of the pipeline, such as a centralized data
    base, greatly simplifies the data handling.


    Preprocessing of the data is a key step to filter out data that has little or
    even no impact on the modeling success and to create relevant features that represent
    the actual state of the target machine. As described in the context of data dependencies
    in [2] the quality of the result of an analytics model greatly depends on the
    given input features. Besides statistical and data centric approaches, we consider
    domain knowledge provided by the machine user in the creation of features. Thus
    we combine expert know-how from the industry application domain and from the data
    science domain.


    ![](img/a2f5eed6507498d886a06be86239344b_124_0.png)


    # Fig. 1 Industrial Analytics Pipeline'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'The selected features are used in the two branches model learning and model
    execution. The selection of the underlying machine learning algorithm highly depends
    on the target application. Once a model is created it can be used in the model
    execution branch to compute analytics results. These can be numerical indicators
    for anomaly detection or contextual information reflecting the current state of
    the machine. For the scenario of predictive maintenance the output of the model
    can be e.g. the likelihood of a failure in a given future time interval. This
    information is finally visualized to support the user in taking decisions for
    optimizing the efficiency of the machine and for avoiding unplanned down-times.


    # ## 3 Challenges in implementing Industrial Analytics


    In the context of machinery and factory automation industrial analytics is a relatively
    new topic, where experiences in the technical and organization realization are
    still rare. In this section we provide an insight into our experiences in implementing
    industrial analytics in real world applications and discuss aspects to consider
    when designing a machine learning solution for production.


    # ### 3.1 Scalability and reusability of data analytics pipelines


    In contrast to classical big data application such as natural language processing
    or image classification, machinery applications typically suffer from little amount
    of historic data. On the one hand automation technology for collecting machine
    data at high sampling rates needed for machine learning applications was hardly
    available. On the other hand there was simply no need to store large amounts of
    machine data for the given automation application. With the growing awareness
    of the value of historic data, machine builders and operators start to implement
    more and more sensor technology to improve the data quality. Thus the amount of
    data generated by machines will increase in the future as the cost for implementing
    sensor and storage technology decrease. However, in the current machinery applications,
    data sets tend to be in the Mega-Byte to Giga-Byte range, allowing for applying
    small data processing architectures, which should be prepared for scalability
    to allow for processing larger data sets in the future. To achieve that, we designed
    a container-based architecture, where the key functions such as the analytics
    pipeline, frontend user interface, etc. are implemented in separate software containers
    as shown in Fig. 2.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '![](img/a2f5eed6507498d886a06be86239344b_126_0.png)


    # Fig. 2 Container-based Industrial Analytics Architecture


    The fronted user interface holds different functionality, which is described in
    the following: Status monitoring is used to track the state of the analytics pipeline
    and to inform the user about abnormal behavior. The analytics architecture is
    designed to handle different users and to provide authentication and user grouping
    functionalities. Analytics functions, such as model scoring or model learning
    can be executed in different time intervals, which can be configured in a scheduler.
    The user can select different models out of the ones given in the model data base
    and configure and tune the models according to the target machine. The plot creation
    container is used to generate user-defined plots based on the resulting analytics
    data.


    The machine data is collected and stored in a corresponding data base, which is
    used as source for the data analytics pipeline container. Besides the machine
    data the architecture additionally comprises a model data base, where different
    machine learning models with its pre-processing pipelines are stored.


    In a typical flow of the analytics functionality the scheduler triggers the execution
    of the analytics pipeline, which loads the selected model from the database and
    applies the model to the specified input machine data. For model scoring the resulting
    data are written to the analytics result data base, which holds the data for result
    visualization. For a model learning scenario, the result of the analytics pipeline
    is a new or updated machine model, which is stored in the model data base, and
    which can be used for scoring in the future.


    The architecture is designed for horizontal scalability and platform independence.
    Instead of using a single analytics pipeline, the architecture allows for running
    several analytics pipelines at the same time, which can be used to speed up the
    execution, or to run different models concurrently. Its container-based implementation
    allows the architecture to be deployed locally on a single PC (with reasonable
    amount of available resources) as well as on virtual environments in the cloud.'
