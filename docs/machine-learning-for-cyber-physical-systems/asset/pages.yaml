- pgno: 94
  md: '# A Process Model for Enhancing Digital Assistance in Knowledge-Based Maintenance


    Klaudia Kovacs$^{1,2*}$, Fazel Ansari$^{1,2}$, Claudio Geisert$^{3}$, Eckart Uhlmann$^{3,4}$,
    Robert Glawar$^{2}$, Wilfried Sihn$^{1,2}$


    $^{1}$Vienna University of Technology (TU Wien), Institute of Management Science

    $^{2}$Fraunhofer Austria, Division of Production & Logistics Management, Vienna,
    Austria

    $^{3}$Fraunhofer Institute for Production Systems and Design Technology IPK, Berlin,
    Germany

    $^{4}$Institute for Machine Tools and Factory Management, TU Berlin, Berlin, Germany

    klaudia.kovacs@tuwien.ac.at


    **Abstract.** Digital transformation and evolution of integrated computational
    and visualisation technologies lead to new opportunities for reinforcing knowledge-based
    maintenance through collection, processing and provision of actionable information
    and recommendations for maintenance operators. Providing actionable information
    regarding both corrective and preventive maintenance activities at the right time
    may lead to reduce human failure and improve overall efficiency within maintenance
    processes. Selecting appropriate digital assistance systems (DAS), however, highly
    depends on hardware and IT infrastructure, software and interfaces as well as
    information provision methods such as visualization. The selection procedures
    can be challenging due to the wide range of services and products available on
    the market. In particular, underlying machine learning algorithms deployed by
    each product could provide certain level of intelligence and ultimately could
    transform diagnostic maintenance capabilities into predictive and prescriptive
    maintenance. This paper proposes a process-based model to facilitate the selection
    of suitable DAS for supporting maintenance operations in manufacturing industries.
    This solution is employed for a structured requirement elicitation from various
    application domains and ultimately mapping the requirements to existing digital
    assistance solutions. Using the proposed approach, a (combination of) digital
    assistance system is selected and linked to maintenance activities. For this purpose,
    we gain benefit from an in-house process modeling tool utilized for identifying
    and relating sequence of maintenance activities. Finally, we collect feedback
    through employing the selected digital assistance system to improve the quality
    of recommendations and to identify the strengths and weaknesses of each system
    in association to practical use-cases from TU Wien Pilot-Factory Industry 4.0.


    **Keywords:** Maintenance, Digital Assistance Systems, Process Model, Industry
    4.0.


    # 1 Introduction


    # 1.1 Digital Assistance in Knowledge-Based Maintenance


    Maintenance is a knowledge-intensive process in which the process participants
    (organizations or group of individuals involved in the maintenance process and
    sub-process(es) either as internal or external stakeholders) create, (re)use,
    and share specialized professional knowledge, while enriching their implicit and
    experiential knowledge. Considering maintenance organization as a learnable unit,
    it encompasses the creation,'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'acquisition, extraction, storage, retrieval, discovery, application, review,
    sharing and transfer of the knowledge captured from/within maintenance processes.
    To this end, Knowledge-Based Maintenance (KBM) continuously supports value generation
    and facilitates developing and protecting maintenance collective knowledge across
    maintenance organization, which is enhanced by a variety of data-driven, digital
    technologies and artificial intelligence (AI) techniques, including advanced statistics,
    stochastics, real-time computing and analytics, machine learning algorithms, static
    rule-based or dynamic model-based analytics, and semantic modelling and representations
    [1],[2]. From a practical point of view, maintenance operators and engineers are
    frequently associated with a wide range of difficulties due to the increasing
    complexity of manufacturing systems, in terms of products, processes and systems,
    namely: i) a wide range of maintenance tasks from diagnosis to repair, ii) increasing
    complexity of maintenance requirements and iii) a large number of equipment types
    to maintain [3],[4]. Additionally, they are constantly confronted with situations
    in which the experiential knowledge of other employees is needed, particularly
    in the confrontation with new or rarely occurring tasks and circumstances. The
    challenge that arises with increasing complexity is a shortage of skilled workers
    and the time required to build up relevant experience [5].


    With the digitization of the industry and the recent technological advancements
    of computing and visualization technologies, the opportunity to access actionable
    information for maintenance operators and engineers provides additional benefits.
    The increasing integration of ICT technologies in classical automation as well
    as a constantly increasing digital database enable them to capture information
    through a real time interaction [6], [7]. According to our experiential knowledge,
    almost 90% of maintenance practitioners use a notebook as a tool to obtain information
    for their maintenance tasks. Nevertheless, hardcopies build the second most common
    information source. The study participants consider the active support of the
    diagnosis as well as the availability of information and checklists for the respective
    process steps to be the most helpful measures during the service visit [8]. Digital
    assistance systems (DAS) can enhance human performances, depending the degree
    of digitization, by providing relevant information for a given specific task [9].
    Maintenance operators and engineers can capture information through the used device
    more quickly and more precisely, while they are performing maintenance, inspection
    or repair tasks [10]. Recent studies show that DAS can increase maintenance practitioners’
    productivity by 8.5% [3]. However, the reason for selecting a device rather than
    another is not always trivial and relates to context of application, environmental
    conditions, the user and the process related requirements [11]. In order to select
    and make decision on an appropriate device to assist maintenance operators, organisations
    need to take multiple decision criteria and preferences into account [13]. Research
    surveys show that companies confront major challenges in implementing digital
    assistance solutions due to high investment costs and technological issues such
    as: i) choosing the right hardware, ii) development of a software and realizing
    a suitable visualisation method and iii) supplying adequate information to improve
    human performances by providing relevant information regarding both corrective
    and preventive maintenance [11], [12], [14]. The selection procedures can be challenging
    due to the wide choice of services (options) available on the market.'
