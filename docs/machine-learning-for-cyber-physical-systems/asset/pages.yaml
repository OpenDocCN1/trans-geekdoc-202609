- pgno: 112
  md: '**Resonance:** Detecting \( u \to y \) in the spring-mass-damper benchmark
    is only possible with \( u_{wn} \), \( u_{sin} \) and \( u_{rw} \). When having
    as excitation the signals \( u_{imp} \) and \( u_{st} \), spectral Granger Causality
    assumes that there is neither a directed influence from \( u \to y \) nor from
    \( y \to u \). Furthermore, except for \( u_{rw} \) none of the excitation signals
    detect in a wrong causal influence \( y \to u \).


    # ## 5 Summary


    The results showed when using spectral Granger Causality, the detection of directed
    influences in time series depends the exciting signal as well as on the underlying
    dynamic system. Regarding the excitation signals, for none of the signals it was
    possible to detect for all four dynamic systems the correct directed influence
    \( u \to y \), while at the same time never detecting a wrong influence \( y \to
    u \). Hence, when using Granger Causality, detected or not detected directed influences
    in data always need to be questioned in terms of the excitation as well as in
    terms of the underlying process behavior. Still, this method can be of great help
    to generate first a understanding of the influences variables have onto each other
    in a data set, since no always, but most of the times Granger Causality detected
    the correct dependency. In terms of the development of benchmarks, there is a
    variety of future research. Questions that arise are the impact of noise in the
    data or how a directed influence can still be detected if variables having a common
    cause. Regarding Granger Causality, it can be evaluated, in which cases it is
    possible to differentiate between direct and indirect influences, e.g. when using
    the multivariate Granger Causality. Additionally, the benchmarks should be used
    to compare several methods like Transfer Entropy with its extensions or the estimation
    of Directed Transfer Functions.


