    to Modeling Sediment Transport, Journal of Hydraulic Engineering, 2007

    +   2. C- Bishop: Pattern recognition and machine learning, Springer, 2006

    +   3. E. Gamma, R. Helm, R. Johnson, J. Vlissidies: Design Patterns: Elements
    of Reusable Object-oriented Software, Addison-Wesley, 1994

    +   4. C. Kuehnert et al.: A new alarm generation concept for water distribution
