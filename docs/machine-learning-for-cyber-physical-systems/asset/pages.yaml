    Tps can vary in a broad range, e.g. the current position of an axis or the feed.
    A combination that doesn’t occur in praxis – e.g. a stroke between 0 and 1 mm
    for a given axis – is not detectable and therefore it does not increase the complexity.
    However an axis stroke of 1000 mm could be divided from any numerical integer
    between 2 and ∞ in principle. Thus it is still necessary to have an upfront definition
    of TPs ranges. A practical solution for dynamic TPs like the jerk, the acceleration
    or the feed consists in definition of altering-constrains to intersect a MS in
    sub-phases.


    A MS is not a singular event but a process which is characterized by a given timespan.
    Real-life processes of machine tools are continuous and can be fragmented in several
    sub-phases by various measures. An example would be a boring operation with a
    specific tool. Another one could be the stroke of a single axis as depicted in
    Table 2 and Fig. 2.


    The definition of an overall process is complex and may vary depending on the
    desired application or monitoring object. This process would be the highest level
    of a MS as depict in Table 1. The y-axis executes a stroke from 300 mm up to 2400
