  md: 'Considering the discussion above, this paper presents an approach to improve
    the maintenance efficiency through DAS using a morphological approach for the
    proper hardware selection combined with a process-modeling tool providing the
    adequate information to fulfill the needed maintenance task. The goal of the proposed
    process model is to systematically identify functionalities of the emerging technologies
    on the market and apply the functionalities to requirements in order to find appropriate
    assistance systems for various industrial applications. Therefore, an overview
    on present digital assistance solutions is given and a morphological approach
    for the elicitation of derived requirements on digital assistance solutions is
    presented.


    # 1.2 Digital Assisted Maintenance (DAM)


    The emergence of novel wearable technologies (in this paper referred to as a type
    of DAS) such as smart glasses, smart watches and tablets spurred new concepts
    of service support systems [9]. DAS combined with Cloud manufacturing concepts
    provide an opportunity to deal with the increasingly complex maintenance procedures
    [3], [9]. DAS create the potential to shape new working environments in which
    modern technology is used to assist workers in activities that are challenging
    in terms of their cognitive complexity [14]. Via interfaces, corresponding process
    data are processed and visualized by software components embedded into assistance
    system to support maintenance operators with relevant information, e.g. by means
    of head-mounted displays or portable devices. A strong focus of literature is
    the exploration and identification of application areas for implementing and deploying
    DAS [5]. To implement DAS, the service-oriented architecture approach has become
    established. Although innovative technologies, e.g. web services, have already
    been employed in industrial applications [15], [16], their usage in maintenance
    support has not been sufficiently well emphasized. A preliminary chronological
    market and literature analysis with regard to suitability and industrial applicability
    (i.e. technology readiness) of DAS, in particular wearable devices, is shown in
    Fig.1.


