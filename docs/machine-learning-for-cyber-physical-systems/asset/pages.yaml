  md: 'during driving a mobile platform Mir-100 (Fig. 1) in a gait- and motion analysis
    lab. Details of the dataset and its aquisition is described in [13]. Three trials
    are arbitrary chosen to build a validation set.


    The DNNs are trained with the remaining 24 example trials with about 15000 time
    frames each. Only the sections of the trial without the overruns of the cable
    channel are included in the training set. Over each trial a time window of width
    100 frames is moved step by step and the resulting 100 * trial length sequences
    are mixed up to build the training sequence. To normalize the data and make it
    more suitable as input for the DNN the mean is subtracted and a division by the
    standard deviation is done.


    ![](img/a2f5eed6507498d886a06be86239344b_68_0.png)


    **Fig. 2.** Inertial measurement unit MPU 9250 + Onion Omega2.


    Further three test trials with acceleration data (sampling rate 120Hz) are collected
    from an inertial measurement unit MPU 9250 (Inven Sense) connected via I2C to
    a Omega2 module (Onion, Fig. 2) and mounted on the mobile platform. To test the
    DNNs the data is saved in csv files. In principle the data can be streamed via
    WiFi to an external laptop, which also collects the position data of the mobile
    platform via the MiRs REST-API.


    Vertical acceleration data is collected for three test trials during driving the
    robot in a corridor with full speed. A cable channel (Fig. 3) is overrun in the
    middle of the trial.


    # 5 Results


    Training of LSTM based autoencoder and the VAE (4) both converges well with a
    batch size of 50 and a learning rate of 0.2. Loss function values after training
    with 1 and after 5 epochs are 4.686 and 1.154 for the LSTM layers based autoencoder
    and 0.619 and 0.039 for the VAE. The values show no differences between the three
    test trials (optical marker based measurements) for the shown digits.'
