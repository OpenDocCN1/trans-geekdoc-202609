  md: '# A Random Forest Based Classifier for Error Prediction of Highly Individualized
    Products


    Gerd Gröner


    Carl Zeiss Vision International GmbH

    http://www.zeiss.com

    gerd.groener@zeiss.com


    **Abstract.** This paper presents an application of a random forest based classifier
    that aims at recognizing flawed products in a highly automated production environment.
    Within the course of this paper, some data set and application features are highlighted
    that make the underlying classification problem rather complex and hinders the
    usage of machine learning algorithms straight out-of-the-box. The findings regarding
    these features and how to treat the concluded challenges are highlighted in a
    abstracted and generalized manner.


    **Keywords:** random forest classifier, imbalanced data, complex tree-based models,
    high peculiarity of data


    # 1 Introduction


    In a manufacturing process with highly individual products like ophthalmic lenses,
    which are produced according to personalized prescriptions, it is difficult to
    identify orders that are likely to fail within the production process already
    in advance. These products might fail due to their difficult and diverse parameter
    combinations. The parameters cover raw material characteristics, lens design,
    geometry and manufacturing parameters (i.e., machine setting values). Even such
    individual, prescribed products are not excluded from hard market competitions.
    Accordingly, avoiding waste of material and working time is an emerging problem.
    Obviously, since such customer-specific, individual products are not interchangeable
    or replaceable by other products (like in case of on-stock products), it is highly
    valuable to avoid any kind of scrap / failure already beforehand the production.
    Summing up, it is becoming more and more useful to analyze product (order) parameters
    and find features and feature correlations in order to predict (potential) failures
    already prior to the start of any manufacturing process.


    In our case, we are confronted with a rather hard problem since the products can
    not be perfectly discriminated into good or bad ones solely based on their product
    characteristics (which are given by individual prescription and design in our
    case) and their corresponding target processing prescriptions. Therefore, it is
    a challenging machine learning (ML) task to remedy this problem within an advance
    distinction between good and potential faulty products, while, at the'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'same time, avoiding ML pitfalls like over-fitting. Furthermore, the pure number
    of features is high and the data set is quite imbalanced, hampering the straight
    forward exploitation of ML models.


    Until now, ML is used for error detection in different manufacturing areas (e.g.,
    [1–3]), but due to the domain-specific data (highly individualized) and fully-automated
    and very standardized manufacturing processes, the gap between different parameter
    combinations and the resulting processing steps is an open challenge for applying
    ML technologies and assessing their benefits accordingly.


    We present a random forest classifier for error prediction that resulted from
    a deep analysis of different ML algorithms, which has been used to train various
    models. These models are evaluated in terms of their classification quality. The
    best model is presented in detail. Interestingly, doubts (like difficult distinction)
    and findings (like important features) of the domain experts form the manufacturing
    division were confirmed by the model. Finally, we give an argumentation why the
    random forest model outperforms other (rather complex) models like Neural Networks
    and Support Vector Machines (SVM) within this particular use case.


    # ## 2 Background


    This section shortly outlines background information on a particular studied use
    case, followed by some principles on machine learning.


    +   **I. Use Case: Error Recognition and Prediction.** For an ordered product,
    we focus on the relevant product features and the according machine setting parameters.
    Summing up to 130 features that describe the product, i.e., lens in our case by
    data on geometry, shape, target prescriptions, coatings and tinting values. We
    removed identifiers like order number and dates. In the used data set, we have
    about 560000 entries in total (i.e., products), covering those products without
    errors and such cases, where the first production was erroneous and a further
    (second) production cycle was necessary.


    As we train, test and evaluate our model with historical data, for each product
    there is the corresponding characteristic whether it is an error or a non-error
    (binary classification). Since we are interested in an advance classification
    of products (and their corresponding to-be processing parameters), we neglect
    in the historic data those errors that were cased by operators, by unexpected
    machine failures or by other arbitrary circumstances. The remaining proportion
    of (final) errors is about 5.4 %.


    +   **II. Machine Learning (in Practice).** Based on the use case, we are faced
    with a binary classification problem (i.e., we distinguish – at least in a first
    step – between good and potential bad products). This problem (_classification_)
    constitutes one group of algorithms in the realm of supervised machine learning,
    while the second group of algorithms of supervised learning is referred to as
    a _regression_ problem, where instead of discrete categories (as in our case)
    a continuous value is the target output of a model. Among _classifications_, there
    are'
