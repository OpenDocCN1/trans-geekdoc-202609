    图 4. 随机森林分类器的 ROC 曲线。


    ## 4.4 算法比较与选择


    尽管经常有人认为上述两种树算法（即，提升决策树和随机森林）往往会完美适应其特征值，因此经常遭受过拟合之苦，但 Breiman [5] 表明，随机森林对过拟合具有鲁棒性，提供（其中包括）设置正则化参数的可能性。


    ## 4.5 评估、结果与设计决策回顾


    值得注意的是，由于错误样本（所谓的少数类）的比例相当低，我们应用了重采样方法 [7, 8] 以获得更平衡的数据集。通过降采样（即，减小数据集大小）结合轻微的上采样，取得了最佳结果，使得错误比例上升到近
    18%。在最重要的特征中，没有占主导地位的特征。


    尽管一些实际比较（例如，[19]）表明复杂的 ANN 优于随机森林，但重要（但不占主导）特征的多样性，结合它们不同的交互结果以及过拟合的威胁，可能导致在我们的案例中随机森林占据主导地位。


    尽管如此，我们强调，随机森林的最佳结果基于底层数据集和应用用例，并未表明随机森林分类器相对于其他分类算法具有普遍优势，这一点例如在 [18] 中被提出，但后来在
    [17] 中（就泛化性而言）被反驳。


    要解释为什么某个算法（如我们案例中的随机森林）相对于其他算法能提供最佳结果，绝非易事（甚至可能是不可能的）。我们将关注一些讨论，例如 KDNuggets²
    上的讨论，Towards Data Science³ 等博客，以及关于能耗分析的著作 [19]。


    随机森林构建的模型以相当鲁棒著称，即它们能够更好地处理异常值、缺失数据或只是奇怪的值。我们观察到轻微的过拟合，这是随机森林的一个众所周知的问题（特别是在深度树的情况下），但在我们的案例中这是微不足道且可忽略的。


    神经网络（以及 SVM）更难以参数化。尽管我们应用了带有不同参数设置的各种训练迭代（始终包括默认参数），但仍有可能存在更好的算法参数组合，而由此产生的模型将优于我们当前的最佳随机森林解决方案。此外，我们的模型涵盖了特征之间非常复杂的交互，这由非常深的树（与特征总数相比）所显示。然而，所有特征都是数值或类别值，没有图像，我们也不在图像或语音处理领域，而神经网络和
    SVM（尤其是文本数据）通常优于其他算法的正是这些领域。


    ## 5 总结与展望


    本文介绍了一项在高度个性化生产环境中进行预先错误分类的研究。最佳预测由基于树的算法实现，特别是由随机森林分类器实现，它能以相当不错的精确率预测某个特定订购产品是否可能失败。然而，召回率相对较低。由于数据集高度不平衡，我们使用了采样策略，以略微改善数据集中错误与非错误样本之间的比例。


    作为未来工作，我们将使用更新（较新）的数据集训练我们的模型，该数据集在两个维度上都包含更多数据，即数据实体样本，但也略有更多特征。预期这将提高算法性能。


