    a certain period. If a machine breaks, a maintenance engineer who is responsible
    for all machines repairs it and afterwards the machine is back in the desired
    mode.


    In this use case the intelligent maintenance agent is responsible for the decision
    when and which maintenance action to take. The goal is to reduce the opportunistic
    maintenance cost, i.e. the optimal action considering the current system load
    of incoming orders, the cost of the action and the cost of a machine breakdown.


    Fig. 4 illustrates the remaining time to failure of a critical state machine at
    the time the agent performs the action over the learning phase iterations. The
    agent learns to follow a strategy that brings the action closer to the failure.
    Additionally, the results proves that the algorithm is able to implicitly learn
    the prediction and, based on this, perform a suitable preventive action.


    Fig. 4 also proves that conducting maintenance as late as possible is able to
    increase the overall output of the system and comes at lower total cost, since
    fewer maintenance actions are carried out. The results are compared to two benchmarks:
    a reactive and a time-base maintenance strategy. The numbers do not take into
    account the further exploited wear rate of the machine components at the latest
    possible maintenance time, which is why the actual value tends to be underestimated.


    ![](img/a2f5eed6507498d886a06be86239344b_137_0.png)


    | | Intelligent maintenance | Reactive maintenance | Time-based maintenance |

    |---|---|---|---|

    | Finished orders | 460,000 | 330,000 (-28%) | 395,000 (-14%) |

    | Failures | 570 | 2,950 (+420%) | - |

    | Maintenance actions | 3,700 | - | 6,500 (+120%) |

    | Cost | 1,680 | 2,950 (+76%) | 1,950 (+16%) |


    Fig. 4. Remaining time to failure (left, moving average values for 1000 iterations)
    and cost comparison with benchmark maintenance strategies (right, average values
    of 40 runs)


    # # 5 Conclusion, discussion and outlook


    This research has shown that CPPS providing real-time data pave the way for the
    application of data-driven algorithms to enhance the operational efficiency of
    production planning and control. RL algorithms are successfully implemented for
    order dispatching and maintenance management outperforming existing rule-based
    approaches.


    However, ML algorithms are not favorable for all industrial applications. The
    following properties are advantageous: (i) applications with a limited scope in
    terms of the number of states and actions (the learning period is dependent on
    these dimensions), (ii) responsive real-time decision systems (computing the output
    of a ML algorithm requires just linear operations), (iii) “cheap” training data
    (the trial-and-error approach is intensively data-driven) and (iv) complex environments
    that can hardly be described in detail (ability to generalize) [15].'
  - '[PAGE 138]


    This work brings the application of ML algorithms and the transition towards autonomous
    production systems one step closer to reality. However, the limitations of ML
    algorithms and RL in particular still prevail, e.g. in terms of solution robustness.
    Further research in the area of designing RL algorithms is needed to achieve a
    broad application also in other areas of production control such as employee allocation
    and capacity control. Furthermore, research on multi-agent systems is required
    to broaden the scope of applications.


