    R. Data Science and Machine Learning platforms are characterized by easy handling
    and fast model development [8]. Nevertheless, operating the platform can result
    in high licensing costs [9]. Open source platforms like Python and R play an increasingly
    important role in the data science market because they are free of charge and
    are the most common programming languages for ML-implementation [8]. We decided
    to use the “open source platform” Python because the libraries that can be called,
