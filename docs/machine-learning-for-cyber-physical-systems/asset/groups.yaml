    \ are not proven to be better.\n\n```\nSMEM Access Difference (SMRW) = BLK.K *\
    \ ((BLK.M / DIM.X) +(BLK.N / DIM.Y)) - BLK.K / DIM.YA * BLK.M / DIM.XA - BLK.N\
    \ / DIM.YB * BLK.K / DIM.XB\n(1)\n```\n\n```\nSMEM Reuse (SMR) = BLK.K * ((BLK.M\
    \ / DIM.X) + (BLK.N / DIM.Y)) / (BLK.K / DIM.YA * BLK.M / DIM.XA + BLK.N / DIM.YB\
    \ * BLK.K / DIM.XB)\n(2)\n```\n\n```\nWork per Thread (WpT) = (BLK.M / DIM.X)\
    \ * (BLK.N / DIM.Y)   (3)\n```\n\nBecause of the contradictory definition of the\
    \ efficiency criteria and the utilization criteria, it is not possible to optimize\
    \ both at once. The efficiency criteria will force contexts, which will reduce\
    \ the reload operations from GMEM and therefore enforce higher resource consumption.\
    \ On the other hand, the utilization criteria will favor shorter working times\
    \ for the contexts by consuming less SMEM and REG resources. The approach of this\
    \ work is to use those parametrizations for the subsequent SA autotuning step,\
    \ which forces to achieve the highest efficiency criteria on a specific utilization\
    \ level. This ensures long living contexts on a specific utilization level with\
    \ respect to the latency hiding principle from Paragraph 2.2. With respect to\
    \ these suppositions, the resulting search space reduces to 84 meaningful parameter\
    \ combinations.\n\n## 2.3 Simulated Annealing\n\nSimulated annealing (SA) is a\
    \ probabilistic technique for finding optimal parameter combinations in a given\
    \ search space - a detailed overview of the concept is given in [22]. For our\
    \ approach SA is fitting, because of its ability to ignore local minima and converge\
    \ to the global one. Sorting the search space after different criteria enforces\
    \ grouping of parameter combinations with similar runtime on similar problems\
    \ in the search space, resulting in faster convergence of SA. The parameter combinations\
    \ found in Paragraph 2.1 are sorted according to their achieved utilization on\
    \ the GPU and processed in the SA step. It should be noted, that other possible\
    \ criteria for SA could be the blocksizes (BLK.M * BLK.N) or the leading dimension\
    \ (DIM.X) from Paragraph 2.1.\n\n## 3 Performance Evaluation\n\nThe performance\
    \ evaluation of the proposed work is based on a NVIDIA Pascal GPU (MSI GeForce\
    \ GTX 1080 Ti Aero 11G OC) in combination with a Intel Xeon E5-1620 with 96 GB\
    \ Memory host system. The operating system is Windows 64 Bit with NVIDIA Driver\
    \ Version is 390.65 and CUDA 8. To evaluate the performance of the proposed approach\
    \ different data sets are used - Table 1 gives on overview of the different matrix\
    \ shapes for evaluation. These matrix shapes have been chosen, because cuBLAS\
    \ proven to perform very well. An evaluation test consists of three Matrices A,B\
    \ and C with format M x K, K x N and M x N ∈ N. Additionally in order to illustrate\
    \ the flexibility of the proposed approach, several other matrix shapes have been\
    \ evaluated. The results of the performance evaluation are shown in Figure 1 and\
    \ Table 2. Figure 1 shows the achieved speedups with respect to the matrix shapes\
    \ compared to cuBLAS. It can be seen, that the larger N the lower the performance\
    \ speedup. In the worst case the achieved result of the proposed approach is 1.3\
    \ times faster than the highly optimized cuBLAS routine, in the best case the\
    \ speedup is 187 times faster than cuBLAS.\n\nTable 1 shows a comparison between\
    \ the best-found solutions with a standard the brute-force approach to the proposed\
    \ approach based on SA proposed in this work. The speedup for finding optimal\
    \ kernel parameters with the proposed SA approach is nearly five to six times\
    \ faster than the standard brute force approach, while the performance loss for\
    \ GEMM kernel execution is maximum 10%.\n\nAlgorithm 2: Procedure for proving\
    \ performance capability of this work. The algorithm generates examples in the\
    \ form of three matrices A, B and C with the formats M x K, K x N and M x N ∈\
    \ N. After 152 generated examples the process terminates.\n\n```\nfor M = 25;\
    \ M < 1000000; M = M + 25 do\n  for K = 25; K < 1000000; K = K + 25 do\n    if\
    \ M * K = 6250000 or 25000000 or between 1000 and 2000\n    then\n      N = 25;\n\
    \      Brute-force search space (M,N,K);\n      Simulated Annealing (M,N,K);\n\
    \      N = 0.5 * M;\n      Brute-force search space (M,N,K);\n      Simulated\
    \ Annealing (M,N,K);\n      N = M;\n      Brute-force search space (M,N,K);\n\
    \      Simulated Annealing (M,N,K);\n      N = 5 * M;\n      Brute-force search\
    \ space (M,N,K);\n      Simulated Annealing (M,N,K);\n```\n\n| M | K | N | Matrix\
    \ Number | M | K | N | Matrix Number |\n|---|---|---|---|---|---|---|---|\n| 10000\
    \ | 25 | 10000 | 1 | 1250 | 5000 | 1250 | 5 |\n| 10000 | 200 | 10000 | 2 | 25\
    \ | 10000000 | 25 | 6 |\n| 5000 | 500 | 5000 | 3 | 4000 | 50000 | 25 | 7 |\n|\
    \ 2500 | 2500 | 2500 | 4 | 25 | 10000 | 2000 | 8 |\n\nTable 1. Data Matrix sizes\
    \ for performance evaluation.\n\n![](img/a2f5eed6507498d886a06be86239344b_80_0.png)\n\
    \n**Fig. 1.** Comparison of the speedup times against cuBLAS with the brute-force\
    \ approach on the examples from Algorithm 2. The minimum Speedup was 1,3, the\
    \ maximum was 187 times as fast as cuBLAS. The average was 12.3 compared to 11.9\
    \ in the Simulated Annealing approach. The figure shows, that with an increasing\
    \ size of N compared to M the speedup reduces. But there was no negative speedup\
    \ in this test so the results are always faster than the calculation with cuBLAS.\n\
    \n| Matrix Format | brute-force Speedup against Simulated Annealing (%) |\n|---|---|\n\
    | N=25 | 10,0 |\n| N=M/2 | 8,4 |\n| N=M | 3,7 |\n| N=5M | 4,3 |\n| average | 5,8\
    \ |\n\n**Table 2.** Comparison between the best achieved brute-force solution\
    \ in comparison to the found solution with the Simulated Annealer on examples\
    \ in the form of three matrices A, B and C with the formats M x K, K x N and M\
    \ x N ∈ N\n"
