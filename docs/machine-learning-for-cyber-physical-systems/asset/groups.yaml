    ### 3.1 Z-score 归一化


    假设 \( x[k] \in \mathbb{R} \)（其中 \( k = 1 ... K \)）是均值为 \( \mu \)、标准差为 \( \sigma
    \) 的过程变量的时间序列。因此，所有过程变量的集合描述为


    \( X = \left[ x_1[k], x_2[k], ..., x_p[k] \right] \) (1)


    其中 \( p \) 为过程变量的数量，从而形成矩阵 \( X \in \mathbb{R}^{(K \times P)} \)。最后，Z-score 归一化定义为


    \( Z = \frac{x_j - \mu_j}{\sigma_j} \) (2)


    其中 \( j = 1 ... P \)。如前所述，PCA 是使用包含归一化过程变量的矩阵 \( Z \) 计算得出的。


    ### 3.2 主成分分析


    主成分分析（PCA）是多元统计学中用于构建大型数据集的一种程序。在此情况下，它用于模型缩减。其核心思想是执行正交变换，将一组相关变量映射为一组线性无相关变量。在数学上，主成分随后涵盖数据集中解释的方差。主成分的计算是通过计算协方差矩阵的特征向量来执行的，该矩阵定义为：


    \( \Sigma = \begin{bmatrix} \sigma_{11}^2 & \sigma_{12}^2 & \cdots & \sigma_{1p}^2
    \\ \sigma_{12}^2 & \sigma_{22}^2 & \cdots & \sigma_{2p}^2 \\ \vdots & \vdots &
    \ddots & \vdots \\ \sigma_{1p}^2 & \sigma_{2p}^2 & \cdots & \sigma_{pp}^2 \end{bmatrix}
    \) (3)


    其中 \( \sigma_{ij}^2 \) 是变量集中两个标准化变量 \( z_i[k] \) 和 \( z_j[k] \) 的协方差。接下来，计算协方差矩阵的特征值
    \( \lambda \) 并按升序排序。这得到最终的对角矩阵 \( \Lambda \in \mathbb{R}^{P \times P} \)，定义为


    \( \Lambda = \begin{bmatrix} \lambda_1 & 0 & 0 \\ 0 & \ddots & 0 \\ 0 & 0 & \lambda_p
    \end{bmatrix} \text{with } \lambda_1 \ge \cdots \ge \lambda_p \) (4)


    在下一步中，计算特征值矩阵 \( \Lambda \) 对应的特征向量并按列汇总。这得到矩阵 \( \Gamma \in \mathbb{R}^{P \times
    P} \)


    \( \Gamma = \begin{bmatrix} Y_{11} & Y_{12} & \cdots & Y_{1p} \\ Y_{21} & Y_{22}
    & \cdots & Y_{2p} \\ \vdots & \vdots & \ddots & \vdots \\ Y_{p1} & Y_{p2} & \cdots
    & Y_{pp} \end{bmatrix} \quad (5) \)


    最后，使用矩阵 \(\Gamma\) 执行线性变换 \(Z \rightarrow Y = \Gamma^T Z\)，其中 \(Y\) 包含主成分。例如，\(y_1[k]
    = y_{11} z_1[k] + \cdots + y_{1p} z_p[k]\) 对应第一个主成分。


    ### 3.3 高斯混合模型


    高斯混合模型（GMM）是一种参数统计模型，假设数据来自多个高斯源。详细地，GMM 定义为：

    \(p(x|\theta) = \sum_{i=1}^K \omega_i p_i(x|\mu_i, \Sigma_i)\) (6)


    其中 \(K\) 为密度分量的数量，\(\omega_i\)（满足 \(\omega_i \ge 0\) 且 \(\sum_{i=1}^K \omega_i
    = 1\)）为混合权重，\(p_i(x|\mu_i, \Sigma_i)\) 为单独的高斯分布，定义为


    \(p_i(x|\mu_i, \Sigma_i) = \frac{1}{(2\pi)^{p/2}|\Sigma_i|^{1/2}} e^{-\frac{1}{2}((x-\mu_i)^T
    \Sigma_i^{-1}(x-\mu_i))}\) (7)


    其中 \(\mu_i\) 为均值向量，\(\Sigma_i\) 为协方差矩阵。样本 \(x \in \mathbb{R}^{1 \times P}\) 的对数概率随后确定为


    \(\hat{a} = \sum_{p=1}^P \log \sum_{i=1}^K \omega_i p(x|\mu_i, \Sigma_i)\) (8)


    其中 \(\hat{a} \in \mathbb{R}\)。GMM 的训练意味着估计权重 \(\omega_i\)、均值 \(\mu_i\) 和协方差 \(\Sigma_i\)。因此，通常使用期望最大化（EM）算法
    9。EM 算法试图通过迭代更改 GMM 参数直到收敛，来增加完整训练数据集的期望对数似然。在本文中，为了训练 GMM，使用了初始训练集中的前两个主成分。


    ### 3.4 过程映射与轨迹


    图 3 显示了 Berliner Wasserbetriebe 一个测量站的过程图。在生成过程图时，x 轴表示第一个主成分，y 轴表示第二个主成分。训练好的高斯混合模型以等压线形式可视化，其中红色表示聚类中心，蓝色表示无数据区域。新测量被转移到主成分空间，并使用前两个分量映射到过程图中。如果测量被映射到蓝色区域，则表明可能存在异常。图
    3 右侧显示了一个异常示例，该异常源于柏林某个测量站氧化还原电势的突然降低。轨迹正在远离 GMM 聚类中心。


    最后，GMM 对某次测量的对数概率可以用作异常指数，用于定义系统是处于正常还是异常状态。\(\hat{a}\) 的低值表示非正常状态，而阈值选择的良好做法是取训练数据得到的
    \(\hat{a}\) 的最低值。


    ![](img/a2f5eed6507498d886a06be86239344b_48_0.png)


    图 3：（左）Berliner Wasserbetriebe 测量站在正常状态下的计算 GMM 和轨迹可视化。（右）同一张地图，显示检测到的异常，即测量中氧化还原电势的降低。


    ## 4 用例：柏林水处理厂水质监测


    在德法研究项目 ResiWater 7 中，已建立起对柏林市九家水处理厂水质参数的监测。在每家水处理厂，测量 pH、浊度、氧化还原电势、溶解氧和电导率参数。分析链包含以下步骤：（1）从
    BWB 的 SCADA 系统获取数据并存储在本地数据库中以进行分析，（2）对每个监测站使用第 3 节描述的数据驱动状态监测算法，（3）生成包含过去几周状态监测系统结果的图表；（4）将结果推送到网页客户端以进行事件的可视化和解释。所有开发的插件将在以下部分中简要描述。


    ### 4.1 插件


    - 数据轮询与解析插件 (1)：水质监测站的测量数据由 SCADA 系统以分块 .csv 文件形式导出到安全的 FTPPS 服务器上，采样时间为几分钟。插件会周期性地轮询
    FTPPS 服务器并检查是否有新数据可用。在这种情况下，相应的文件将被下载、解析并写入缓存。从缓存中，它们由状态监测插件进行分析。


