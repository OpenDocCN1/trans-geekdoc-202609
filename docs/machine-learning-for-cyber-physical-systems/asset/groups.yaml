    The quality of regression for the effective Vibration level (Peff) is significant
    in more sub-phases and therefore more generally usable than the ball pass frequency
    of the ball-screw (Y2) nut (fmax).


    Therefore the auto detection mechanism would choose sub-phases 112 and 212 as
    most relevant for monitoring. In regard to the CVs, the temperature remains the
    only relevant TP for the effective Vibration level while the feed remains the
    only relevant TP for the outer ring frequency of the ball-screw nut.


    ## 5 Deduction of machine characteristics based on clustering


    The clustering was deducted solely on base of the two relevant TPs for each of
    the two CVs as described in section 4. The algorithm is described in detail in
    [8] based on [9]. Every MS is gradually attributed to the cluster centres. The
    relevant TP 8.1 and 9.1 do not vary in accordance to the sub-phases, so the clustering
    solely depends on the (average) TP of the 9 MS. We obtain cluster centres at 0.71/0.99/0.00
    for TP 8.1 (feed rapid traverse) respectively 0.09/0.92/0.64 for TP 9.1 (temperature
    of y2 ball screw nut). Table 5 depicts the TP-values for each MS and their affiliation
    rate.


    Table 5. Normalized TP and affiliation rates per cluster for all MS; optimization
    cycle n_opt = 100; fuzzifier w = 1.5


    | Maschine states | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 | 9 |

    |---|---|---|---|---|---|---|---|---|---|

    | Relevant TPs | | | | | | | | | |

    | 8.1 Feed rapid traverse (for CV2) | 1 | 1 | 1 | 0 | 0.67 | 0.83 | 0.67 | 1 |
    1 |

    | 9.1 Temperature of y2 ball-screw nut (for CV1) | 0 | 0.40 | 0.66 | 0.81 | 0.96
    | 0.91 | 1 | 0.71 | 0.70 |

    | Cluster | | Affiliation rates per cluster | | | | | | | |

    | 1 | TP 8.1 | 1 | 0 | 0 | 0 | 1 | 0.732 | 1 | 0 | 0 |

    | | TP 9.1 | 1 | 0.273 | 0 | 0 | 0 | 0 | 0 | 0 | 0 |

    | 2 | TP 8.1 | 0 | 1 | 1 | 0 | 0 | 0.268 | 0 | 1 | 1 |

    | | TP 9.1 | 0 | 0.034 | 0 | 0.857 | 1 | 1 | 0.997 | 0.013 | 0.06 |

    | 3 | TP 8.1 | 0 | 0 | 0 | 1 | 0 | 0.000 | 0 | 0 | 0 |

    | | TP 9.1 | 0 | 0.693 | 1 | 0.143 | 0 | 0 | 0.003 | 0.987 | 0.994 |


    Based on the affiliation rates of each MS the clusters represent typical CV-progressions
    as depicted in Fig. 5 for CV1 (effective vibration level). We obtain several alarms
    for cluster 1 (Fig. 5 left) with limits corresponding to a band in the +/- 3σ
    range. This is due to the fact that cluster 1 represents the head-up of the machine
    tool representing an unsettled pool of MSs (essentially MS 1). Alternatively a
    band of +/- 6σ for limit calculation can be used.


    The auto-reduction of relevant TP and MS generates clusters which represent typical
    conditions of a machine tool. When combined with CV information and by subsequent
    structure-attribution the gathering of machine tool characteristics over time
    is achievable.


    A possible example includes the CV1 (effective vibration level) which represents
    “undesired system energy” and causes wear. Therefore the CV1-level should be observed.
    The number and range of MS will gradually improve over time for a given machine
    tool. Therefore more and more clusters arise. Some of these clusters represent
    high wear-proceeding defined by high CV1-levels and caused by higher-than-average
    bearing temperatures while others won’t. Consequently machining operations as
    well as manufactured parts can be categorized and evaluated regarding their wear-processing
    characteristics. While some correlations may state the obvious – e.g. heavy machining
    – the overall load-wear correlation of the machine tool becomes more transparent.
    Furthermore measurements like switching of an axis position for high wear-processing
    manufactured parts became practicable.


    ![](img/a2f5eed6507498d886a06be86239344b_22_0.png)


    Fig. 5. Cluster-CV progress including Fuzzification ; CV1: Peff of ball-screw
    nut of Y2 axis


    ## 6 Conclusion


    The auto-definition of relevant MS is crucial for addressing the ongoing changes
    in internal and external conditions of large and special purpose machine tools.
    By using a linear regression a significant reduction on the number of MS is possible.
    This includes the distinction between relevant and irrelevant sub-phases. Furthermore
    the regression analysis also enables to reduce the number of relevant input TPs
    (e.g. measuring parameters) per CV.


    Based on a subsequent clustering of the machine states these clusters represent
    a more stable base than a single MS. Their specific TP-ranges in context of specific
    CVs (e.g. a ball-pass frequency) represent machine tool characteristics. A categorization
    of processes and manufactured parts – regarding their wear-processing as well
    as quality stability – becomes possible when combined with structural information
    and a process-evaluation regarding their cluster attribution.


    Further research is necessary due to different clustering approaches as well as
    more complex regression model approaches (e.g. quadratic). Furthermore, the deduction
    of complex Characteristic values for entire structural components using several
    CVs based on different algorithms will be investigated.


