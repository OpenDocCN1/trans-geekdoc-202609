    - 5. Ostfeld A., Oliker N. 和 Salomons E. (2014)。"供水系统最低成本设计与韧性的多目标优化"。ASCE水资源规划与管理分会杂志，第140卷，第12期，04014037，http://dx.doi.org/10.1061/(ASCE)WR.1943-5452.0000407

