    \) of the covariance matrix are calculated and sorted in ascending order. This
    results in the final diagonal matrix \( \Lambda \in \mathbb{R}^{P \times P} \)
    defined as


    \( \Lambda = \begin{bmatrix} \lambda_1 & 0 & 0 \\ 0 & \ddots & 0 \\ 0 & 0 & \lambda_p
    \end{bmatrix} \text{with } \lambda_1 \ge \cdots \ge \lambda_p \) (4)


    In a next step, the corresponding eigenvectors of the eigenvalue matrix \( \Lambda
    \) are calculated and summarized in columns. This results in the matrix \( \Gamma
    \in \mathbb{R}^{P \times P} \)


    \( \Gamma = \begin{bmatrix} Y_{11} & Y_{12} & \cdots & Y_{1p} \\ Y_{21} & Y_{22}
    & \cdots & Y_{2p} \\ \vdots & \vdots & \ddots & \vdots \\ Y_{p1} & Y_{p2} & \cdots
    & Y_{pp} \end{bmatrix} \quad (5) \)


    Finally, the matrix \(\Gamma\) is used to perform the linear transformation \(Z
    \rightarrow Y = \Gamma^T Z\), while \(Y\) contains the principal components. For
    example, \(y_1[k] = y_{11} z_1[k] + \cdots + y_{1p} z_p[k]\) corresponds to the
    first principal component.


    ### 3.3 Gaussian Mixture Models


    A Gaussian Mixture Model (GMM) is a parametric statistical model, which assumes
    that the data comes from several Gaussian sources. In detail, a GMM is defined
    as:

    \(p(x|\theta) = \sum_{i=1}^K \omega_i p_i(x|\mu_i, \Sigma_i)\) (6)


    With \(K\) being the number of density components, \(\omega_i\), with \(\omega_i
    \ge 0\) and \(\sum_{i=1}^K \omega_i = 1\), the mixture weight and \(p_i(x|\mu_i,
    \Sigma_i)\) the individual Gaussian distributions being defined as


    \(p_i(x|\mu_i, \Sigma_i) = \frac{1}{(2\pi)^{p/2}|\Sigma_i|^{1/2}} e^{-\frac{1}{2}((x-\mu_i)^T
    \Sigma_i^{-1}(x-\mu_i))}\) (7)


    with \(\mu_i\) the mean vector and \(\Sigma_i\) the covariance matrix. The log-probability
    of a sample \(x \in \mathbb{R}^{1 \times P}\) is then determined as


    \(\hat{a} = \sum_{p=1}^P \log \sum_{i=1}^K \omega_i p(x|\mu_i, \Sigma_i)\) (8)


    with \(\hat{a} \in \mathbb{R}\). The training of the GMM means to estimate the
    weights \(\omega_i\), the mean \(\mu_i\) and the covariance \(\Sigma_i\). Therefore,
    usually an Expectation Maximization (EM) algorithm is used 9. The EM algorithm
    tries to increase the expected log-likelihood of the complete training data set
    by iteratively changing the GMM parameters until they converged. In this paper,
    for training the GMM, the first two principal components from the initial training
    set are used.


    ### 3.4 Process mapping and trajectory


    A process map of a measuring station from Berliner Wasserbetriebe is shown in
    Fig 3. For the generation of the process map, the x-axis represents the first,
    the y-axis the second principal component. The trained Gaussian Mixture Model
    is visualized in terms of isobars, while red represents a cluster center and blue
    areas without data. New measurements are transferred into principal component
    space and, using the first two components, is mapped into the process map. If
    the measurements are mapped into the blue area, this indicates a possible anomaly.
    Fig 3 on the right side shows an example of an anomaly, resulting from a sudden
    reduction of the redox-potential at one of the measuring stations in Berlin. The
    trajectory is moving away from the GMM cluster center.


    Finally, the log-probability from the GMM for a measurement can be used as anomaly
    index which defines if a system is running in normal or abnormal state. A low
    value of \(\hat{a}\) indicates a not normal state, while a good practice for a
    threshold selection is to take the lowest value of \(\hat{a}\) resulting from
    the training data.


    ![](img/a2f5eed6507498d886a06be86239344b_48_0.png)


    Fig 3: (Left) Visualization of the calculated GMM and the trajectory of a measuring
    station from Berliner Wasserbetriebe in normal state. (Right) The same map with
    a detected anomaly, namely a reduction of the redox-potential in the measurements.


    ## 4 Use case: Water quality Monitoring of Water Treatment Plants in Berlin


    Within the French-German research project ResiWater 7 a monitoring of the water
    quality parameters of nine water treatment plants of the city of Berlin has been
    built up. At each water treatment plant the parameters pH, turbidity, redox-potential,
    oxygen and conductivity are measured. The analysis chain consists in these steps:
    (1) Data fetching from BWB’s SCADA system and storing in a local database for
    analyses, (2) using the in section 3 described data-driven condition-monitoring
    algorithm for each monitoring station, (3) generate graphs comprising the results
    of the condition-monitoring system over the last couple weeks; (4) pushing results
    to a web-client for visualization and interpretation of the event. All developed
    plugins are briefly described in the following section.


    ### 4.1 Plugins


    - Data polling and parsing plugin (1): The measurements from the water quality
    monitoring stations are exported by the SCADA system as chunked .csv files on
    a secure FTPPS server with a sample time of a few minutes. A plugin cyclically
    polls to the FTPPS server and checks if new data is available. In this case the
    corresponding files are downloaded, parsed and written into the cache. From the
    cache, they are analyzed by the condition-monitoring plugin.


    - Condition-Monitoring plugin (2): The in section 3 described approach for data-driven
    condition monitoring has been implemented in this plug-in. For each measuring
    station (in total nine stations are monitored), data representing the normal state
    has been selected and used for training the PCA and GMM. New acquired sensor data
    is evaluated by the event detection module. If the log-probability for a new measurement
    is below the predefined threshold, an alarm is raised by the plug-in which sends
    this information to the platform cache.


    - Graph generation plugin (3): This plugin generates graphics containing the results
    of the event detection modules as well as the corresponding measurements. These
    graphics can be accessed from the web-client and provide a long term overview
    of the detected events in the network.


    - Realtime-web plugin (4): This plugin pushes the online-measurements as well
    as the current results of the event detection module via web sockets to the web-clients.
    To avoid too much network traffic, values are only pushed on change and not on
    a fixed time stamp.


    Fig 4, upper side, shows the plug-in manager with the loaded plug-ins. The lower
    plot gives a screenshot of the real-time data cache containing results from the
    different plug-ins


    ![](img/a2f5eed6507498d886a06be86239344b_49_0.png)


    ![](img/a2f5eed6507498d886a06be86239344b_49_1.png)


    Fig 4: (Upper plot) Plug-in manager with loaded plug-ins for monitoring; (lower
    plot) real-time data cache


    ### 4.2 Web-interface


    The web-interface provides an overview of the current state of the monitored measurement
    stations, the process map with the trajectory, as well as information about the
    historic results from the condition-monitoring algorithms. Furthermore, the complete

