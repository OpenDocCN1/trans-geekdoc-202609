    · Time Series Analysis.


    # 1 Introduction


    Process control systems at production plants usually consist of a large number
    of process variables, while the interconnectivity of the variables is not always
    directly evident. Hence, due to the interconnectivity, if some change, voluntary
    or on purpose is performed on one unit, this can lead to unwanted effects at another
    unit. Therefore, it is of great interest to understand which variable has a significant
    influence on another variable.


    For the automatic detection of directed connectivities in time series exists already
    a wide variety of methods, which are mainly developed for the use in neuroscience
    (e.g. [3] or [1] for reviews) or for the analysis of econometric data [9]. One
    of the first methods developed, was done by Granger [8], being called the Granger
    Causality. This method uses two vector autoregressive functions and, by comparing
    their residual sum of squares, the method tells if one variable causes the other
    or not. The original approach, taking place in the time domain,'
