    \ Apart from the sensitivity to outliers, the reason is a neglect of the inherent\
    \ behavior of a time series. As an example consider the measurements of an acoustic\
    \ sensor attached to a motor that recently is sending fluctuating measurements,\
    \ yet within the predefined tolerance. Although the recorded values are still\
    \ considered as valid, the fluctuation with respect to the volume could already\
    \ indicate a nearly defect motor. Finally, one initially needs to evaluate appropriate\
    \ thresholds for any parameter of each configuration.\n\n### 3.4 Dissimilarity\
    \ Measurement\n\nFor now we discussed the exploitation of inherent information,\
    \ extracted from segmented time series. The final step of GADPL is to measure\
    \ the level of dissimilarity for all obtained representatives. Since no ground\
    \ truth is available to define the default behavior for a specific configuration,\
    \ the algorithm uses an approximation based on the given data. One problem in\
    \ this regard is the variability of a default behavior, consisting of more than\
    \ one pattern. Therefore, a naive approach as choosing the most occurring representative\
    \ would already fail for a time series consisting of two equally appearing patterns\
    \ captured by different segments, where consequently half of the data would be\
    \ detected as\n\n```\nAlgorithm 1 GADPL\nRequire: Time series T, Machine parameters\
    \ M, Configuration transition time p,\nSegment length (l_min, l_max), Number of\
    \ nearest neighbors k,\nDissimilarity threshold Delta_max\nC' = cluster_configurations(T,\
    \ M)\nR' = {R_1, .., R_|C'|}\nfor all configuration segments C_i in C' do\n  for\
    \ all segments s_j in C_i do\n    s_j = truncate_transitions(s_j, p)\n    if |s_j|\
    \ < l_min then\n      C_i = C_i \\ s_j\n    else if |s_j| > l_max then\n     \
    \ s'_j = split_segments(s_j, l_max)\n      C_i = C_i U s'_j\n      C_i = C_i \\\
    \ s_j\n    end if\n    R_i = R_i U extract_features(s'_j)\n  end for\nend for\n\
    for all configuration representatives R_i in R' do\n  for all representatives\
    \ r_j in r_i do\n    NN_k = query_index(r_j, k)\n    if Delta(r_j, NN_k) > Delta_max\
    \ then\n      emit_anomaly(i, j)\n    end if\n  end for\nend for\n```\n\nanomalous\
    \ behavior.\n\nAs one potential solution GADPL instead uses the mean over a specified\
    \ size of nearest neighbors, depicting the most similar behavior according to\
    \ each segment. The idea is that even though there might multiple distinct characteristics\
    \ in the data, at least a predefined number of elements represent the same behavior\
    \ compared to the processed item. Otherwise, this item will even have a high average\
    \ dissimilarity with respect to the most similar observations and can therefore\
    \ be classified as anomaly.\n\nLet $r_i$ be the representative vector of the i-th\
    \ segment obtained by feature extraction and let $NN_k(r_i)$ be the according\
    \ set of $k$ nearest neighbors. The dissimilarity measure $\\Delta$ for $r_i$\
    \ is defined as:\n\n```\n\\(\\Delta(r_i, NN_k(r_i)) = \\frac{1}{k} \\sum_{j=1}^k\
    \ \\delta(r_i, NN_k^j(r_i))\\)\n```\n\nwhere $NN_k^j(r_i)$ corresponds to the\
    \ $j$-th nearest neighbor and $\\delta$ to a ground distance defined on $\\mathbb{R}^n$.\n\
    \nHere, for the vectorized feature representations, any suitable distance function\
    \ \\(\\delta\\) is applicable. In the context of COMPOSITION we decided to use\
    \ the Euclidean distance for a uniform distribution of weights, applied to normalized\n\
    \n![](img/a2f5eed6507498d886a06be86239344b_30_0.png)\n\nFig. 1. Application of\
    \ GDPL: The upper part shows the segmentation of time annotated power consumption\
    \ data in percent. The lower part illustrates the result of the dissimilarity\
    \ measurement, where the red rectangle indicates classified anomalies.\n\nfeature\
    \ values. To further increase the performance of nearest neighbor queries, we\
    \ exploited the R*-tree [1] as a high-dimensional index structure.\nGiven the\
    \ dissimilarity for each individual representative together with a predefined\
    \ anomaly threshold, GDPL finally emits potential candidates having an anomalous\
    \ behavior.\n\n## 4 Evaluation\n\nIn this section we will discuss the evaluation\
    \ performed on a historical data set, provided in the scope of COMPOSITION. While\
    \ in future, the algorithm should be applied to continuously streamed sensor data,\
    \ the initial evaluation was performed on recorded data, captured over a period\
    \ of seven years. The data consists of machine parameters (already classified\
    \ by recipe names) and time-annotated sensor measurements including temperature\
    \ value and power consumption, based on a sampling rate of 5 minutes. In addition,\
    \ a separate maintenance log covers the dates of previous fan exchanges. However,\
    \ malfunctions only occurred two times during runtime and are therefore comparatively\
    \ rare. A confirmation of results due to actual defect components is consequently\
    \ restricted to some extent. Since this project and the here presented approach\
    \ are regarded as ongoing work, the outlined evaluation is continuing likewise.\n\
    Figure 1 illustrates the application of GDPL, including segmentation (upper part)\
    \ and dissimilarity measurement (lower part), for the time around one fan failure.\
    \ Here, differently colored circles represent slices of the time series after\
    \ segmentation, describing the percentage power consumption of a fan. Using the\
    \ features mentioned in section 3.3, we intended to perceive deviating values\
    \ and untypical fluctuations within the data, without being sensitive to outliers\
    \ arising from single incorrect sensor measurements. Having one of the recorded\
    \ fan exchanges at the end of February 2012, the result of the algorithm clearly\
    \ shows significantly higher values for the dissimilarity (red rectangle) prior\
    \ to the event. Even though increased dissimilarity values at the end of May 2011\
    \ and around September 2011 can be explained by analyzing the original data, yet\
    \ there were no recordings for a defect component at those times. However this\
    \ does not automatically imply incorrect indications, since defect machine parts\
    \ are not the only reasoning for anomalous characteristics in the data. An appropriate\
    \ choice for the value of a maximal dissimilarity, defining the anomaly threshold,\
    \ can therefore highly influence the accuracy.\nBoth cases of a defect fan behavior\
    \ were clearly captured by the algorithm and emphasized by a high dissimilarity.\n\
    \n## 5 Conclusion\n\nWith GADPL we introduced a solution to the relevant topic\
    \ of unsupervised anomaly detection in the context of configuration-based production\
    \ lines. After a short outline on the topic and related work, we discussed the\
    \ algorithm and the associated intention of our approach, before briefly showing\
    \ the evaluation results based on the project data.\nSince the approach is ongoing\
    \ work, in the future we will primarily extend our evaluation based on streaming\
    \ data. Although we described the algorithm using historical data, the procedure\
    \ for streaming data is carried out analogous. Another point in the scope of future\
    \ evaluations is the choice of more complex features and a related automated feature\
    \ selection. Another idea to further improve the approach is a semantic segmentation\
    \ of the time series. While currently a time series is segmented exploiting domain\
    \ knowledge, a segmentation based on characteristics in the data might potentially\
    \ increase the accuracy. This would also prevent from an unappropriated choice\
    \ of the maximal segmentation length, which could result in a split of data within\
    \ a potential motif.\nFinally, we plan to investigate the correlation of anomalies\
    \ within multivariate data. If GADPL in its current state is used for multivariate\
    \ time series data, each dimension is processed independently. Combining inter-dimensional\
    \ information within a single dissimilarity measure to cover anomalies would therefore\
    \ be a useful functionality to further optimize the approach.\n\n## 6 Acknowledgements\n\
    \nThis project has received funding from the European Unions Horizon 2020 research\
    \ and innovation programme under grant agreement No 723145 - COMPOSITION. This\
    \ paper reflects only the authors views and the commission is not responsible\
    \ for any use that may be made of the information it contains.\n"
