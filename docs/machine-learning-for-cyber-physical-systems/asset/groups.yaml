    ### 3.2 Linear Regression for Quality Prognosis


    Description of the Model Ultimately, we aim for on-line process control which
    makes the application of high speed models and fast predictions necessary. As
    a first step – conducted off-line – we need to describe the relationship between
    input and output variables in a distinguishable way. A general linear model which
    accounts for the single parameters linear effects was considered. In general,
    a linear regression equation has the following form


    ```

    DepVar = a + (b1 x IndepVar1) + ... + (bn x IndepVarn).

    ```


    Where a, b1, ..., bn are unknown parameters, DepVar stands for dependent variable
    and represents the qualities P1H and P2ST, respectively. IndepVar''s are the independent
    variables, such as the process parameters.


    The analysis is carried out in R using the lm() function for fitting linear models
    independently for the two quality parameters P1H and P2ST. The resulting regression
    coefficients are shown in Table 1.


    **Validation of the Model** The regression analysis indicates that STemp, TT,
    ToTemp, QF, QT and Sp had significant influence on P1H, which is confirmed by
    the p-values (no significant influence of ST). The overall suitability of a linear
    regression approach is supported by an adjusted R² of 0.90 which describes the
    percentage of the dependent variable variation by the model. P2ST can be thoroughly
    described by linear combinations of ST, TT, ToTemp, QF, QT and Sp (no significant
    influence of STemp) with an adjusted R² of 0.99.


    Since the total number of observations is limited and a partition into training
    and test data is not sensible without loosing significant modeling capability
    the models were validated with K-fold cross-validation. For K = 5, the overall
    mean square of prediction error is 97.6 for the linear model (compared to 102
    for the complete model with all variables) to predict P1H and 3.87 x 10^-6 for
    the prediction of P2ST (compared to 6.14 x 10^-6 for the complete model). This
