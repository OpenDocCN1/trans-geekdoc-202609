    ## 2 Detecting directed connectivities in time series


    ### 2.1 Bivariate Spectral Granger Causality


    The concept of Granger causality (GC) has been originally introduced in the field
    of economics by Clive Granger in 1969 [8] who used it to determine the relationships
    of different econometric models. The basic concept of bivariate GC can be explained
    by assuming the two time series \(u[k] \in \mathbb{R}\) and \(y[k] \in \mathbb{R}\)
    with \(k = 1, \dots, K\) samples. In that case, the causal connectivity \(u \to
    y\) is assumed to exist if past values from \(u[k]\) and \(y[k]\) result in a
    higher forecast accuracy for \(y[k]\) than using only past values from \(y[k]\).
    Mathematically, this is evaluated by comparing two linear vector autoregressive
    models, while the first one only contains past values of \(y[k]\), called the
    restricted model, and the other one containing past values of \(u[k]\) and \(y[k]\),
    called the unrestricted model. Furthermore, Granger Causality can be easily extended
    into the multivariate case, while good explanations can be found e.g. in [16]
    or [4]. Since the developed benchmarks in section 3 compare always one input against
    one output, for simplicity, multivariate GC will not be explained in this paper.


    **GC in the time domain:** Checking if \(u\) causes \(y\) or \(y\) causes \(u\),
    is in the time domain is done by comparing two linear vector autoregressive (VAR)
    models.


    The two VAR models are defined as


    $$

    u[k] = \sum_{j=1}^n a_{uu}[j] \cdot u[k-j] + \sum_{j=1}^n a_{uy}[j] \cdot y[k-j]
    + e_u[k], \quad (1)

    $$

    $$

    y[k] = \sum_{j=1}^n a_{yy}[j] \cdot y[k-j] + \sum_{j=1}^n a_{yu}[j] \cdot u[k-j]
    + e_y[k] \quad (2)

    $$


    containing the residual covariance matrix being defined as


    $$

    \Sigma = \begin{pmatrix} \Sigma_{uu} & \Sigma_{uy} \\ \Sigma_{yu} & \Sigma_{yy}
    \end{pmatrix} \quad (3)

    $$


    In (1), (2) n is the model order, \(a_{uu}, a_{uy}, a_{yu}, a_{yy} \in \mathbb{R}^n\)
    contain the model coefficients and \(e_u[k], e_y[k] \in \mathbb{R}\) define the
    residuals. Finally GC checks the coefficients in \(a_{yu}\) (respectively \(a_{uy}\)).
    If these are significantly different from zero, it is assumed that \(u\) causes
    \(y\) (respectively \(y\) causes \(u\)). Usually, this is done by comparing the
    squared-sum of residuals of \(e_u\) (respectively \(e_y\)) with and without taking
    into account the influencing variable \(y\) (respectively \(u\)).


    **GC in the frequency domain** The advantage when working in the frequency domain
    compared to the time domain is that causal connectivities can be tied to specific
    frequency bands and one gets better insights in the data. The methodology has
    been explained in detail in [7] and the main steps are given here for completeness.
    The Fourier Transformation of the equations 1 and 2 can be written in the following
    set of equations:


    $$

    \begin{pmatrix} A_{uu}(f) & A_{uy}(f) \\ A_{yu}(f) & A_{yy}(f) \end{pmatrix} \begin{pmatrix}
    u(f) \\ y(f) \end{pmatrix} = \begin{pmatrix} e_u(f) \\ e_y(f) \end{pmatrix} \quad
    (4)

    $$


    with \(u(f)\) and \(y(f)\) are the Fourier transformed time series from \(u[k]\)
    and \(y[k]\) and \(e_u(f), e_y(f)\) are the Fourier transformations of \(e_u[k]\)
    and \(e_y[k]\). The components of \(A\) are then transformed as


    $$

    A_{uu}(f) = 1 - \sum_{i=1}^n a_{uu}(i) e^{(-i2\pi fn)} \quad (5)

    $$

    $$

    A_{uy}(f) = - \sum_{i=1}^n a_{uy}(i) e^{(-i2\pi fn)} \quad (6)

    $$


    which holds analogous for \(A_{yu}(f)\) and \(A_{yy}(f)\). Finally, equation 4
    can be rewritten as


    $$

    \begin{pmatrix} u(f) \\ y(f) \end{pmatrix} = \begin{pmatrix} H_{uu}(f) & H_{uy}(f)
    \\ H_{yu}(f) & H_{yy}(f) \end{pmatrix} \begin{pmatrix} e_u(f) \\ e_y(f) \end{pmatrix}
    \quad (7)

    $$


