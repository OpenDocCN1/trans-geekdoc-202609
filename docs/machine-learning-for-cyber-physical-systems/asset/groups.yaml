    TP 与 CV 全范围的代表性。然而，回归分析为每个输入参数 (= TP) 提取了显著性项，从而区分特定 CV（表 4 中的响应变量）的相关 TP 与无关
    TP。此外，通过将 TP 的显著性项与相关性分析的调整 R-Square 值进行比较，我们获得了定义适当子阶段的评估依据。此外，还会检查显著 TP 之间的相关性（协方差矩阵），以排除高协方差的
    TP。例如，在子阶段 112 中，温度的显著性项甚至高于进给。然而，协方差矩阵显示温度与温度（-0,9861）高度相关，因此应将其排除在 CV fmax 的后续聚类之外。随后，相关
