    ![](img/a2f5eed6507498d886a06be86239344b_120_0.png)


    图 5：电磁阀示意图


    为防止因磨损造成的过早磨损，必须监测电磁阀中的阀门或排水阀以及通往阀门的信号线。报告中占主导地位的四类错误 [NRC1987]：


    - 阀内异物（16%）

    - 线圈烧毁/短路（15%）

    - 阀部件磨损或缺陷（11%）

    - 线圈开路（9%）


    在监测电磁阀时，有两种不同的方法。第一种方法是基于规则的方法。在运行期间，通过电子元件监测负载电流。如果电流低于或超过设定限值，该模块会向控制器发送信号。


    ![](img/a2f5eed6507498d886a06be86239344b_120_1.png)


    图 6：曲线的显著偏移表明阀门机构有磨损迹象


    使用此方法，可以检测和报告诸如导线断路、短路或过电压和欠电压等事件。但是，定义边界内系统动态的变化不会被检测到。


    第二种方法致力于阀门故障的早期检测。在此，记录并比较开关循环的电流波形（参见图 6）。这种方法能够实现特定于设备和应用的监测，因为参考模型是在运行期间创建或参数化的。一定程度的偏差可能表明即将发生缺陷，从而启动及时更换阀门（参见图
    6）。与之前的情况一样，实现这种监测策略不需要使用专用传感器，因为使用从已有信号中提取的特征。这也使得此类策略可以应用于低成本应用。


    ## 5 总结与结论


    本文展示了工业分析作为实现预测性维护策略的手段的应用。它说明了用于实现数据驱动监测的灵活架构如何使此类监测系统也能应用于简单的自动化设备。通过两个实际用例证明了这一点，揭示了该方法在降低维护成本的同时提高其有效性的潜力。


