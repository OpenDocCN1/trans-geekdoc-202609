    多种算法（cf. [4–6]），从回归和朴素贝叶斯等较基础的算法，到人工神经网络（ANN）、支持向量机（SVM）、决策树及其扩展（如随机森林分类器（RFCs）和提升决策树）等在搭建与计算方面更为困难的算法。提升决策树和随机森林属于所谓的集成算法，即由一组决策树构建一组树或森林。集成算法实现生成多个分类器并聚合其结果的方法（cf.
    [16]）。提升决策树算法采用分阶段优化树的策略（按损失函数衡量）[14, 15]。随机森林集成中的树是通过随机选择输入特征构建的。集成中的每棵树都是通过随机选择输入特征获得的。在每棵树中，每个节点仍使用最佳特征（按代价函数衡量）进行分割。森林的最终结果是由树对最常见类别的单一投票获得的。


    ## 3 数据集特征与应用范围


    该数据集来自一个相当专业的领域，针对高度个性化产品的生产流程，存在一些可与完全不同领域的不同问题相比较和迁移的基本关键特征。因此，我们必须应对挑战以处理以下数据和应用特征。


    该数据集高度 *不平衡*，这实际上是误差和非误差分类问题的本质特征。如前所述，约 5.4 % 的样本属于少数类（误差情况），而略多于剩余 94.6 % 的数据样本属于多数类（非误差情况）。众所周知，在平衡数据集上可以获得最佳的分类结果（cf.
    [11–13]）。此外，在我们的案例中，我们不仅关心正确的分类，还想知道导致最终属于这两类中的哪一类的最具影响力的特征是什么。因此，需要一个可靠的预测模型，能够进行适当的分类（即，非猜测解决方案！）。


    另一个属性是模型的 *复杂性*。样本的纯数量（数据集中约 560000 条记录）是一个不错的规模，但相对的特征数量（约 130 个）相当高。特别是，问题不仅在于数量本身，而在于特征特性决定了复杂性，如我们在后面将看到的。不存在占主导地位的单个特征，且具影响力的特征数量较多，最终导致模型需要对特征表现和组合进行深入考虑，如下一节所示。


    最后，第三个特征是模糊的 *可区分性*，在我们的案例中这是最难处理的一个。给定某个特定订单产品（误差情况）的所有特征，第一次制造过程失败了，而第二次运行使用非常相似甚至相同的特征（包括机器设置参数）却获得了良好的质量。因此，这种产品属性的具体特征无法预先确定是误差情况还是非误差情况。


    ## 4 用于错误预测的随机森林模型


