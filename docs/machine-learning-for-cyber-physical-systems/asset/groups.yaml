    ## 可扩展机器学习者的 GPU GEMM-Kernel 自动调优


    Johannes Sailer, Christian Frey 和 Christian Kühnert


    德国卡尔斯鲁厄 Fraunhofer IOSB 光电子学、系统技术和图像利用研究所


    **摘要。** 深度学习（DL）是人工智能（AI）领域的关键技术之一 深度学习神经网络（DLNN）从整体指数级数据增长中获益良多，而另一方面，训练和推理的计算工作量大幅增加。DLNN
    中大部分计算时间都用于卷积步骤，该步骤基于通用矩阵乘法（GEMM）。为了加速 DLNN 的计算时间，近年来提出了多种针对图形处理单元（GPU）的高度优化 GEMM
    实现 [1]，但这些方法中的大多数都是针对 GEMM 软件内核的 GPU 硬件特定实现，并未考虑训练数据布局的性能依赖性。为了实现最大性能，必须针对不同的
    GPU 硬件和训练任务的特定数据布局调整 GEMM 算法的参数。本文提出了一种基于 GPU 的 GEMM 算法的两步自动调优方法。第一步，通过多个性能标准对内核参数搜索空间进行剪枝，然后使用修改后的模拟退火算法进行进一步处理，以找到针对
    GPU 硬件和任务特定数据布局的最佳内核参数组合。我们的研究在 160 个不同的输入问题上进行，采用所提方法，与 NVIDIA（cuBLAS）的最先进的实现相比，在
    NVIDIA GTX 1080 Ti 加速卡上可实现平均约 12 倍的加速比。


    **关键词：** GPU、矩阵乘法、自动调优、自动生成、加速、CUDA、BLAS


    ### 1 引言


    ### 1.1 动机


    深度学习（DL）是人工智能（AI）领域的关键技术之一 深度学习神经网络（DLNN）从整体指数级数据增长中获益良多，而另一方面，训练和推理的计算工作量大幅增加。机器学习应用从这种整体数据增长中获益良多，因为模型可以被训练得更精确。


