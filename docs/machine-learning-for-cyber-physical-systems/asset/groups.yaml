    and Smart Manufacturing (2018)

    +   3. Breiman, L.: Random forests. Machine learning 45(1), 5–32 (2001)

    +   4. Cover, T., Hart, P.: Nearest neighbor pattern classification. IEEE transactions
    on information theory 13(1), 21–27 (1967)

    +   5. Domingos, P., Pazzani, M.: On the optimality of the simple bayesian classifier
