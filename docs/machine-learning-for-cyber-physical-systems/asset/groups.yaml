    ![](img/a2f5eed6507498d886a06be86239344b_9_0.png)


    图 1. 注塑机（KIMW）的部件及外围设备 [2]。


    来自铝和塑料等行业的产业，将通过数据驱动方法进行优化。


    在本工作中，我们专注于塑料行业的一个特定用例。我们使用真实生产线网络物理系统提供的传感器测量数据，该生产线生产咖啡胶囊，并旨在以数据驱动的方式减少废品数量，即低质量生产周期的数量。为此，我们将废品数量减少问题建模为二分类问题，并研究不同的基础机器学习方法用于检测和预测低质量生产周期。我们在真实生产线的数据集上评估这些方法，并按分类准确率对其进行比较。


    本文结构如下。在第 2 节中，我们描述生产过程和收集的传感器测量数据。在第 3 节中，我们介绍分类方法并讨论结果。在第 4 节中，我们总结本文并展望未来工作。


    ## 2 生产过程与传感器测量


    在 MONSOON 项目范围内，一个特定的研究重点是塑料行业，聚合物材料（咖啡胶囊）的制造通过注塑方法进行。注塑是一种通过将原材料注入模具来生产塑料部件的制造工艺。该过程首先加热原材料，然后关闭模具并注入热塑料。在保压阶段和冷却阶段后，模具再次打开，塑料部件（在我们的场景中即咖啡胶囊）被取出。这样，每个注塑周期生产一个或多个部件。理想情况下，每个周期的缺陷率趋向于零，并尽可能减少原材料浪费。事实上，只有缺陷率低于某个阈值的周期才可被制造商接受。为了阐明制造过程，我们以示意图的方式在图
    1 中展示了典型注塑机的部件及外围设备。如图所示，注塑机包含不同的部件，其中塑化单元构成机器的核心，还有允许控制生产过程的控制器。


    本工作中使用的 MONSOON 咖啡胶囊与上下文数据集 [2] 包含来自真实注塑机的 250 个咖啡胶囊生产周期的信息。它包含 36 个实值属性，反映每个周期的机器内部传感器测量数据。这些测量数据包括内部状态（如温度和压力值）的数值，以及各周期内不同阶段的时间信息。此外，我们还考虑每个周期的质量信息，即非缺陷咖啡胶囊的数量，该数量在各个生产周期中会有所变化。如果生产的咖啡胶囊数量大于预定义阈值，我们将相应周期标记为
    _高质量_，否则分配 _低质量_ 标签。质量标签的决定由领域专家做出。


    基于该数据集，我们对不同基础机器学习方法及其基于上述传感器测量数据对低质量生产周期进行分类的能力进行了基准测试。方法和结果将在下一节中描述。


    ## 3 塑料行业中机器学习的应用


    通过将机器学习应用于配备网络物理系统的咖啡胶囊生产线收集的传感器测量数据，我们旨在检测和预测低质量生产周期。为此目的，我们首先通过对属性进行居中和缩放，并额外排除近零方差的属性来预处理数据。预处理是基于
    _CARET_ 包 [7] 在编程语言 _R_ 中实现的。


    基于预处理后的数据集，我们通过 k 折交叉验证，按 _平衡准确率_、_精确率_、_召回率_ 和 _F1_ 测量了分类性能，其中将折数设置为 5，重复次数设置为
    100。即，我们使用 80% 的数据集作为训练数据，剩余 20% 作为测试数据，用于预测生产周期的质量。我们对 100 个随机生成的训练集和测试集上的性能进行了平均。


    我们研究了以下基础预测模型，均通过 _R_ 中的 _CARET_ 包实现：


    - _k-最近邻_ [4]: 一种基于欧氏距离的简单非参数，因此无模型的分类方法。

    - _朴素贝叶斯_ [5]: 一种假设属性独立性的概率方法。

    - 分类回归树 [9]: 一种层次划分数据的决策树分类器。

    - 随机森林 [3]: 多个决策树的组合，旨在避免过拟合。

    - 支持向量机 [11]: 一种旨在通过超平面分离类别的方法。我们研究了线性 SVM 和带 RBF 核函数的 SVM。


    我们基于注塑机通过传感器测量数据捕获的内部状态，评估了上述预测模型的分类性能。相应的分类结果在表 1 中汇总。


    表 1. 不同预测模型的分类结果。


    | | 平衡准确率 | 精确率 | 召回率 | F1 |

    |---|---|---|---|---|

    | k-NN | 0.697 | 0.638 | 0.686 | 0.657 |

    | 朴素贝叶斯 | 0.643 | 0.604 | 0.563 | 0.578 |

    | CART | 0.637 | 0.595 | 0.566 | 0.573 |

    | 随机森林 | 0.653 | 0.619 | 0.570 | 0.589 |

    | SVM (线性) | 0.632 | 0.626 | 0.488 | 0.540 |

    | SVM (RBF) | 0.663 | 0.643 | 0.563 | 0.594 |


    如上表所示，所有预测模型的分类准确率均至少达到 63%，而 k-最近邻分类器达到的最高分类准确率约为 69%。对于该分类器，我们使用了欧氏距离，并将最近邻数
    k 设置为 7。事实上，k-最近邻分类器平均能够对 250 个周期中的 172 个周期预测出正确的质量标签。


    值得注意的是，这个相当低的分类准确率（69%）可能对实际生产过程产生重大影响，因为在我们特定的领域中每分钟生产数百个咖啡胶囊，因此废品数量减少的微小提升将导致生产成本降低的重大改善。此外，我们表明，当用额外的工艺参数丰富传感器测量数据时，k-最近邻分类器的性能可以提高到
    72% [2]。


    总而言之，上述实证结果表明，即使是 k-最近邻分类器这样简单的机器学习方法也能够预测低质量生产周期，从而增强废品数量减少。尽管所提供的传感器测量数据在测量数量方面范围有限，但我们相信我们的调查将有助于
    MONSOON 项目范围内及以外的进一步数据驱动方法。


    ## 4 结论与未来工作


    在本工作中，我们专注于欧盟资助的 MONSOON 项目，并展示了如何通过机器学习手段改善废品数量减少这一特定问题。我们将基础机器学习方法应用于塑料行业真实生产线网络物理系统的传感器测量数据，并表明预测模型能够通过预测低质量生产周期来挖掘优化潜力。在研究的预测模型中，我们实证表明
    k-最近邻分类器在准确性方面实现了最高的预测性能。


    作为未来工作，我们旨在研究不同的预处理方法和集成策略，以提高整体分类准确率。我们还打算评估不同的基于距离的相似度模型 [1]，以提高 k-最近邻分类器的性能。此外，我们打算将我们的性能分析扩展到其他行业领域，例如表面贴装器件的生产
    [10]，并研究度量访问方法 [8, 12] 以及托勒密访问方法 [6]，以实现高效且可扩展的数据访问。


