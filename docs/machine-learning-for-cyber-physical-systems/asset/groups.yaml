    # 3.3 Feature Extraction


    Having a set of segments for each configuration, the next step is to determine
    the characteristics of all segments. While the literature presents multiple approaches
    to describe the behavior of time series, we will focus on common statistical features
    extracted from each segment. Nonetheless, the choice of features is not fixed,
    which is why any feature suitable for the individual application scenario can
    be used. One example for rather complex features could be the result of a kernel
    fitting in the context of Gaussian processes, accepting a decrease in performance.
    Since the goal is to capture comparable characteristics of a segment, we compute
    different real-valued features and combine them in a vectorized representation.
    In the case of COMPOSITION, we used the mean to describe the average level, the
    variance as a measure of fluctuation and the lower and upper quartiles as a coarse
    distribution-binning of values. Due to the expressiveness of features being dependent
    from the actual data, one possible way to optimize the selection of features is
    the Principal Component Analysis [6]. Simply using a large number of features
    to best possibly cover the variety of characteristics might have a negative influence
    on the measurement of dissimilarity. The reason for this is the partial consideration
    of irrelevant features within distance computations.


    Moreover, since thresholds could be regarded as a more intuitive solution compared
    to additionally extracted features, this replacement would lead to a significant
    decrease in the number of recognized anomalies. Apart from the sensitivity to
    outliers, the reason is a neglect of the inherent behavior of a time series. As
    an example consider the measurements of an acoustic sensor attached to a motor
    that recently is sending fluctuating measurements, yet within the predefined tolerance.
    Although the recorded values are still considered as valid, the fluctuation with
    respect to the volume could already indicate a nearly defect motor. Finally, one
    initially needs to evaluate appropriate thresholds for any parameter of each configuration.


