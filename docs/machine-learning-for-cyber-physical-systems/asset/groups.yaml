    # Unsupervised Anomaly Detection

    in Production Lines


    Alexander Graß, Christian Beeks, Jose Angel Carvajal Soto


    Fraunhofer Institute for Applied Information Technology FIT, Germany

    {alexander.grass,christian.beeks,angel.carvajal}@fit.fraunhofer.de


    **Abstract.** With an ongoing digital transformation towards industry 4.0 and
    the corresponding growth of collected sensor data based on cyber-physical systems,
    the need for automatic data analysis in industrial production lines has increased
    drastically. One relevant application scenario is the usage of intelligent approaches
    to anticipate upcoming failures for maintenance. In this paper, we present a novel
    approach for anomaly detection regarding predictive maintenance in an industrial
    data-intensive environment. In particular, we are focusing on historical sensor
    data from a real reflow oven that is used for soldering surface mount electronic
    components to printed circuit boards. The sensor data, which is provided within
    the scope of the EU-Project COMPOSITION (under grant no. 723145), comprises information
    about the heat and the power consumption of individual fans inside a reflow oven.
    The data set contains time-annotated sensor measurements in combination with additional
    process information over a period of more than seven years.


    **Keywords:** Unsupervised Learning, Industry 4.0, Anomaly Detection


    # 1 Introduction


    In the last couple of years, the importance of cyber-physical systems in order
    to optimize industry processes, has led to a significant increase of sensorized
    production environments. Data collected in this context allows for new intelligent
    solutions to e.g. support decision processes or to enable predictive maintenance.
    One problem related to the latter case is the detection of anomalies in the behavior
    of machines without any kind of predefined ground truth. This fact is further
    complicated, if a reconfiguration of machine parameters is done on-the-fly, due
    to varying requirements of multiple items processed by the same production line.
    As a consequence, a change of adjustable parameters in most cases directly leads
    to divergent measurements, even though those observations should not be regarded
    as anomalies.


    In the scope of the EU-Project COMPOSITION (under grant no. 723145), the task
    of detecting anomalies for predictive maintenance within historical sensor data
    from a real reflow oven was investigated. While the oven is used for soldering
    surface mount electronic components to printed circuit boards based on continuously
    changing recipes, one related problem was the unsupervised recognition'
  - '[PAGE 26]


    of potential misbehaviors of the oven resulting from erroneous components. The
    utilized data set comprises information about the heat and power consumption of
    individual fans. Apart from additional machine parameters like a predefined heat
    value for each section of the oven, it contains time-annotated sensor observations
    and process information recorded over a period of more than seven years.


    As one solution for this problem, in the upcoming chapters we will present our
    approach named Generic Anomaly Detection for Production Lines, short GDPL. After
    a short introduction on related approaches, in the upcoming chapters we will focus
    on a description of the algorithm. Afterwards we outline the evaluation carried
    out on the previously mentioned project data, followed by a concluding discussion
    on the approach and future work.


    # ## 2 Related Work


    While the topic of anomaly detection and feature extraction is covered by a broad
    amount of literature, in the following we will focus on a selection of approaches
    that led to the here presented algorithm. Recently, the automatic description
    of time series, in order to understand the behavior of data or to perform subsequent
    operations has drawn the attention of many researchers. One idea in this regard
    is the exploitation of Gaussian processes [3,5] or related structural compositions
    [4]. Here, a time series is analyzed using a semantically intuitive grammar consisting
    of a kernel alphabet. Although corresponding evaluations show impressive results,
    they are rather applicable to smaller or medium sized historical data, since the
    training of models is comparatively time consuming. In contrast, other approaches
    exist, which focus on the extraction of well-known statistical features, further
    optimized by means of an additional feature selection in a prior stage [2]. However,
    the selection of features is evaluated based on already provided knowledge and
    thus not applicable in unsupervised use-cases. A last approach discussed here,
    uses the idea of segmented self-similarity joins based on raw data [7]. In order
    to decrease the complexity, segments of a time series are compared against each
    other in the frequency domain. Even though this idea provides an efficient foundation
    for many consecutive application scenarios, it lacks the semantic expressiveness
    of descriptive features as it is the case for the already mentioned methods.


    In the upcoming chapter we consequently try to deal with those challenges, while
    presenting our approach for unsupervised anomaly detection.


    # ## 3 Approach


    The hereafter presented description of GDPL is based on the stage-wise implementation
    of the algorithm. After an initial clustering of similar input parameters (3.1)
    and a consecutive segmentation (3.2), we will discuss the representation of individual
    segments (3.3) and the corresponding measurement of dissimilarity'
  - '[PAGE 27]


    (3.4). GADPL is also summarized in figure Algorithm 1, at the end of this chapter.


    # 3.1 Configuration Clustering


    In many companies, as well as in the case of COMPOSITION, a single production
    line is often used to produce multiple items according to different requirements.
    Those requirements are in general defined by varying machine configurations consisting
    of one or more adjustable parameters, which are changed ''on-the-fly'' during
    runtime. For a detection of deviations with respect to some default behavior of
    a machine, this fact raises the problem of invalid comparisons between sensor
    measurements of dissimilar configurations. If a measurement or an interval of
    measurements is identified as an anomaly, it should only be considered as such,
    if this observation is related to the same configuration as observations representing
    the default behavior. In other words: If \( C_k = \{x_l := \lambda_l | 1 \le l
    \le M \} \) is a configuration with \( M \) parameters \( x_l \) of value \( \lambda_l
    \), then for the dissimilarity \( \delta \) of two measurement representations
    \( y_{1,i} \) and \( y_{2,j} \) with associated configurations \( C_i \) and \(
    C_j \), it holds that:


    \(\delta(y_{1,i} \text{ , } y_{2,j}) \text{ is defined iff. } i==j\)


    Therefore in advance to all subsequent steps, at first all sensor measurements
    have to be clustered according to their associated configuration. For simplicity,
    in the following subsections we are only discussing the process within a single
    cluster, although one has to keep in mind, that each step is done for all clusters
    in parallel.


    # 3.2 Segmentation


    As a result of the configuration-based clustering, the data is already segmented
    coarsely. However, since this approach describes unsupervised anomaly detection,
    the idea of a further segmentation is, to create some kind of ground truth, which
