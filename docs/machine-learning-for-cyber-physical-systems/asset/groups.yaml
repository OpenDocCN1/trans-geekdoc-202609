    ## 3 基于相关性的机器状态和参数降级的回归分析


    如 [8] 所示的 MS 模糊聚类可以在不考虑 TPs 与 CVs 之间可能相关性的情况下进行。这是基于对感兴趣组件的实际考虑以及 CV 与 TP 之间（启发式预期）的相关性，对有限数量预定义
    MS 进行的可能。如果将广泛的 TPs 与可变的 TP 节区分辨率以及时间跨度相结合，则所有组合（每个 CV）的聚类将变得不切实际，在统计上具有挑战性，且信息含量会下降。因此，对于这些状态，有必要对显著的
    MS 和 TP 进行减少。这项任务可以通过使用人工神经网络 (ANN) 来解决，但其鲁棒性和准确性在很大程度上取决于训练数据的数量。这意味着每个相关 MS
    必须出现几次，ANN 才能发挥其优势。在第 1 节所述的非系列机床应用中，这并不一定成立。


    为此，本文建议采用 TPs 与 CVs 之间的回归分析。基于所介绍的周期，进行了回归分析。回归分析中使用的输入变量 (TP) 和响应变量 (CV) 如表 8
    所示。这包括 MS 的所有变化参数。所考虑的 MS 回归分析并非旨在量化输入变量与响应变量之间的回归函数，而应从统计上验证输入变量的显著性（详情见 [9]）。因此，回归分析选用不含任何交互作用的线性函数。


