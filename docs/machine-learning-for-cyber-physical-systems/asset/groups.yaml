    ## 3 基准测试


    对于时间序列中有向连通性的检测，两点很重要，即激励信号的特性和底层过程行为。因此，本节提出了若干可能的输入信号（3.1 节）和若干动态 SISO 系统（3.2
    节）。接下来，频谱 Granger 因果性被用于检测每对信号的输入和输出。


    ### 3.1 分析的激励信号


    作为激励信号，使用了白噪声、正弦波、锯齿波、脉冲列车和基于随机游走的时间序列。所有信号均在图 1 的时域及其功率谱中显示。为进行分析，每个信号总共包含 $N
    = 1000$ 个样本。激励信号的详细信息如下：


    - **白噪声** - 由白噪声组成的时间序列是指一组不相关随机变量序列，具有常数均值 $\mu$ 和方差 $\sigma^2$。在以下内容中，输入时间序列
    \( u_{\text{wn}}[k] \in \mathbb{R} \) 被建模为均值 $\mu = 0$ 方差 $\sigma^2 = 1$ 的随机过程。


    - **正弦波** - 正弦波可视为周期扰动的原型，例如由调校不当的 PI 控制器产生。对于输入序列，采用形式为 \( u_{\text{sin}}[k]
    = \sin(\omega \cdot k) \in \mathbb{R} \) 的正弦波，角频率为 \(\omega = 2\pi \cdot 0.1\)。


    - **锯齿波** - 该时间序列可解释为一种漂移，例如当传感器缓慢污染时。对于锯齿波，输入序列 \( u_{\text{sw}}[k] \in \mathbb{R}
    \) 定义为 \( u_{\text{sw}}[k] = \text{frac}(\frac{k}{T} + \Phi) \)，周期为 \( T = 100
    \)，相位 \(\Phi = 0\)，其中 frac 为小数部分，定义为 \(\text{frac} \equiv x - \lfloor x \rfloor\)。


    - **脉冲列车** - 所谓脉冲或尖峰列车，是指例如在预定义周期内向过程注入惰性气体或流体。因此，输入时间序列 \( u_{\text{it}}[k] \in
    \mathbb{R} \) 定义为 \( u_{\text{it}}[k] = \sum_{k=0}^{\frac{N}{K}-1} \delta[n -
    kK] \)，其中 \( N|K \)，\(\delta\) 为 Dirac 脉冲，\( N \in \mathbb{R} \) 表示时间序列的长度，\(
    K \in \mathbb{R} \) 为周期。在以下内容中，周期 K 设为 100。


    - **随机游走** - 随机游走的时间序列定义为一种过程，其中采样点 [k] 的值由过去值 [k - 1] 加上一个定义为白噪声的误差项组成。本文使用随机游走来研究所用方法在过程低频变化（例如流体中某种浓度的波动）下的表现。因此，输入时间序列
    \( u_{\text{RW}}[k] \in \mathbb{R} \) 定义为 \( u_{\text{RW}}[k] = u_{\text{RW}}[k
    - 1] + \epsilon[k] \)，其中 \(\epsilon[k]\) 是均值 \(\mu = 0\) 方差 \(\sigma^2 = 0.1\)
    的白噪声序列。


    ![](img/a2f5eed6507498d886a06be86239344b_109_0.png)


    图 1. 时域内的研究激励信号及其对应的功率谱。


    ### 3.2 动态系统


    图 2 显示了与前面展示的激励信号结合测试的选定动态系统。具体而言，系统包含死时间、低通滤波器、非线性以及最后一个二阶共振系统。系统描述如下：


    - **死时间** - 在此基准测试中，激励信号移位 10 个样本。输入信号和输出信号之间未添加动态系统。因此，这对应于从一个信号到另一个信号检测有向连通性的最简单情况。


    - **低通滤波器** - 时间常数 T = 1s 的低通滤波器代表了检测输入和输出信号的最基本系统。在过程技术中，低通滤波器例如为流体罐或管道，它们倾向于衰减扰动，因此有时使追溯扰动传播路径变得复杂。此基准测试主要用于研究
    3.1 节中定义的输入信号的行为。


    - **非线性系统** - 在此过程中，从中间输出信号 $y_1(t)$ 中提取一个正弦波。取决于激励信号的幅值，该正弦波将对结果输出信号产生强烈影响。主要目的是确定对于哪些输入信号，方法仍能确定输入和输出信号及其参数。


    - **共振系统** - 此基准测试代表一个经典质量-弹簧-阻尼系统。与其他系统一样，时间常数设为 $T = 1$ s，而无量纲阻尼比设为 $\xi = 0.05$。


    ![](img/a2f5eed6507498d886a06be86239344b_110_0.png)


    ## 4 结果


    为进行分析，每个动态系统均用不同的输入信号激励，并使用频谱 Granger 因果性检测从 $u \to y$ 的有向影响（结果见图 4）以及从 $y \to
    u$ 的有向影响（结果见图 4）。如果发现有向影响，相应方框包含一个对勾，否则包含一个叉号。以下给出了针对定义的基准动态系统的摘要。


    **死时间：** 在此用例中，由一个简单的时间移位组成，对于所有输入信号，从 $u \to y$ 的有向依赖性被检测并定义为显著。然而，对于输入信号 $u_{sin}$
    和 $u_{it}$，已发现从 $y \to u$ 指向的假正例有向影响。解释很简单，因为脉冲列车和正弦波都是周期性激励信号，因此仅在信号间存在时间移位时，无法区分输入信号和输出信号。


