    ## 基于知识维护的数字辅助增强流程模型


    Klaudia Kovacs (1,2*), Fazel Ansari (1,2), Claudio Geisert (3), Eckart Uhlmann
    (3,4), Robert Glawar (2), Wilfried Sihn (1,2)


    (1) 维也纳工业大学 (TU Wien)，管理科学研究所

    (2) 奥地利弗劳恩霍夫，生产与物流管理部门，维也纳，奥地利

    (3) 德国柏林弗劳恩霍夫生产系统与设计技术研究所 IPK

    (4) 德国柏林工业大学机床与工厂管理研究所

    klaudia.kovacs@tuwien.ac.at


    **摘要。** 数字化转型以及集成计算和可视化技术的发展，通过收集、处理和提供可操作的信息及维护运营人员的建议，为加强基于知识的维护带来了新的机遇。在适当的时间提供关于纠正性和预防性维护活动的可操作信息，可能有助于降低人为失误并提高维护流程的整体效率。然而，选择合适的数字辅助系统（DAS）高度依赖于硬件和IT基础设施、软件和界面以及可视化等信息提供方法。由于市场上可用的服务和产品种类繁多，选择程序可能具有挑战性。特别是，每种产品部署的底层机器学习算法可能提供一定程度的智能，并最终可能将诊断性维护能力转变为预测性和指导性维护。本文提出了一种基于流程的模型，以便为制造业中的维护运营选择合适的DAS。该解决方案用于从各种应用领域进行结构化需求收集，并最终将需求映射到现有的数字辅助解决方案。采用所提方法，选择（一组）数字辅助系统并将其与维护活动关联。为此，我们利用内部流程建模工具来识别和关联维护活动序列。最后，通过使用所选的数字辅助系统收集反馈，以提高建议质量，并识别每个系统与TU
    Wien工业4.0试点工厂实际用例相关的优势和劣势。


    **关键词：** 维护，数字辅助系统，流程模型，工业4.0。


    ## 1 引言


    ### 1.1 基于知识维护中的数字辅助


    维护是一个知识密集型过程，其中过程参与者（作为内部或外部利益相关者参与维护过程及子流程的组织或个人群体）创建、（再）使用和共享专业知识，同时丰富其隐性知识和经验知识。将维护组织视为一个可学习的单元，它涵盖了从维护流程中捕获/在维护流程中的知识的创建、获取、提取、存储、检索、发现、应用、审查、共享和转移。为此，基于知识的维护（KBM）持续支持价值生成，并促进在整个维护组织中开发和保护维护集体知识，这由多种数据驱动、数字技术和人工智能（AI）技术增强，包括高级统计、随机过程、实时计算和分析、机器学习算法、静态基于规则或动态基于模型的分析，以及语义建模和表示
    [1], [2]。从实际角度来看，由于制造系统（在产品、流程和系统方面）复杂性不断增加，维护操作人员和工程师经常面临各种困难，即：i) 从诊断到修理的各种维护任务，ii)
    维护要求复杂性增加，iii) 需要维护的设备类型众多 [3], [4]。此外，他们不断面临需要其他员工经验知识的情况，尤其是在面对新的或不常发生的任务和情况时。随着复杂性增加而出现的挑战是熟练工人短缺以及建立相关经验所需的时间
    [5]。


    随着工业数字化以及计算和可视化技术的最新进步，维护操作人员和工程师能够获取可操作信息，这带来了额外的好处。ICT技术在经典自动化中的日益集成以及不断增长的数字数据库，使他们能够通过实时交互捕获信息
    [6], [7]。根据我们的经验知识，近90%的维护从业者使用笔记本电脑作为获取维护任务信息的工具。然而，硬拷贝是第二常见的信息来源。研究参与者认为，主动诊断支持以及各自流程步骤的信息和清单的可用性是在服务访问期间最有帮助的措施
    [8]。数字辅助系统（DAS）可以通过为给定的特定任务提供相关信息，根据数字化程度增强人类性能 [9]。维护操作人员和工程师在执行维护、检查或维修任务时，可以通过所用设备更快速、更精确地捕获信息
    [10]。最近的研究表明，DAS可以提高维护从业者的生产力8.5% [3]。但是，选择某种设备而非另一种设备的原因并不总是显而易见的，它与应用场景、环境条件、用户以及流程相关要求有关
    [11]。为了选择并做出辅助维护操作人员的合适设备的决策，组织需要考虑多个决策标准和偏好 [13]。研究调查表明，由于高投资成本以及技术问题（如：i) 选择合适的硬件，ii)
    开发软件并实现合适的可视化方法，iii) 提供充分的信息以通过为纠正性和预防性维护提供相关信息来提高人类性能），公司在实施数字辅助解决方案时面临重大挑战 [11],
    [12], [14]。由于市场上可用的服务（选项）种类繁多，选择程序可能具有挑战性。


