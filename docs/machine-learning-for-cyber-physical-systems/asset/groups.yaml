  mdcn: '


    本文展示了如何利用工业分析（Industrial Analytics）作为手段，为缺乏专用监控资源的简单自动化组件实现基于状态甚至预测性维护策略。第 2 节说明了如何通过结合边缘与云端计算的灵活架构来实现此类监控系统。第
    3 节接着解释了开发工业分析解决方案的过程。第 4 节随后介绍了两个实际应用案例，揭示了该方法在降低维护成本的同时提高维护效能的潜力。


    ## 2 工业分析解决方案的开发过程


    工业分析功能通常由不同的任务组成，如图 1 所示。该图展示了工业分析应用程序的典型工作流程，其中不同设备的数据首先被整合到单个数据源（数据存储）中。下一步是预处理数据，以作为学习过程的准备（预处理）。在此步骤中，从原始数据信号中提取相关特征，涉及将统计方法与领域知识相结合以选择有意义的特征。


    ![](img/a2f5eed6507498d886a06be86239344b_115_0.png)


    图 1：工业分析系统的典型工作流程。


    下一步是选择、训练和调优机器学习算法，以从所选特征中推导模型（模型学习）。同样，分析专业知识与领域知识的结合是开发高效模型的关键。模型开发完成后，可在运行时用于监控机器或进程（模型执行）。为了有用，结果需要得到适当的可视化（可视化）。可视化的类型应根据将使用此信息的人员的角色来选择，例如机器操作员、维护经理等。工业分析功能在自动化系统中的集成可以在不同层级进行，例如在机器层级，或使用云平台。这些可能性将在下一节中探讨。


    ## 3 用于工业分析的灵活自动化系统架构


    在典型的自动化系统中，由机器、执行器和传感器产生的连续异构数据流可作为工业分析应用（例如预测性维护）的输入。随着越来越多来自物联网（IoT）领域的智能组件进入生产设施，这场数据洪流将急剧增长，并越来越难以利用集中式云端数据采集和处理方法进行管理。最近提出了边缘计算的概念，以通过提供一种分布式计算模型来克服这一限制，在该模型中，数据在网络的“边缘”处理，即靠近现场设备
    [SD2016, GJFVR2016]。


    该方法的核心优势是允许在数据生成处进行计算而不产生网络延迟，从而实现低延迟，这对实时状态监控应用至关重要。另一个优势是可扩展性：虽然随着通信设备数量增加，传统集中式方法将不再可行，但边缘计算提供了线性可扩展性，并作为补充手段以减轻网络基础设施的压力。此外，通过本地处理时敏数据，并在发送到云端之前大幅减少原始数据，可以降低存储和运营成本。该技术还可用于保护隐私，确保敏感数据在本地预处理，因此只有符合隐私要求的数据才会传输到云端。遵循从数据采集到分析处理再到有意义机器信息可视化的步骤，涉及不同系统组件上的各种处理步骤。图
    1 说明了在边缘、本地和云端层级实施工业分析的灵活自动化系统架构示例。


    原始数据由远程终端单元（RTU）通过现场总线（例如 PROFIBUS，由绿色总线连接表示）从机器以及与工艺相关的执行器和传感器采集。这些设备上可以实现诸如滤波等初始预处理阶段。然后，信号由可编程逻辑控制器（PLC）采集并用于控制系统。其他与工艺无关的组件，如智能温度、振动或压力传感器，通常通过蓝牙、WiFi、以太网或新兴的
    5G [PLZW2015] 连接到工业物联网（IIoT）网关。这些组件在对旧机器进行改造并启用工业分析服务的过程中发挥着重要作用。通常因设计原因不提供数据接口的重要控制部件（即机电继电器或电磁阀）的监控系统，理想情况下可以连接到
    IIoT 网关。我们将在本论文的下一节介绍这些系统的两个实际应用案例。


    ![](img/a2f5eed6507498d886a06be86239344b_117_0.png)


    低延迟边缘分析功能可以在现代 PLC 和 IIoT 网关中实现。虽然 PLC 只能监控连接到它的设备，但 IIoT 网关通常除了可以访问与工艺无关的组件数据外，还可以访问
    PLC 数据，以生成更大的机器学习模型。如果有必要，可在边缘层级进一步降低数据密度。除数据存储和可视化外，还可以由工业 PC（IPC）在本地，或在云端以更高延迟和增加网络流量为代价，对多台机器或设备执行更复杂的分析功能。监控控制与数据采集系统（SCADA）或制造执行系统（MES）提供丰富且详细的可视化功能。


    ## 4 应用案例


    本节介绍了两个应用案例，展示了为简单自动化设备启用自监控功能的优势：机电继电器和电磁阀的监控。


    ### 机电继电器监控


    机电继电器是电气操作的开关，使用电磁铁机械操作开关，以通过单独的低功率信号控制电路。它们广泛应用于厂房建设、机械工程或造船等工业领域，用于切换感性负载，例如控制电磁阀。


    ![](img/a2f5eed6507498d886a06be86239344b_118_0.png)


    图 3：典型机电继电器的剖面图


    简单的机电继电器由电磁线圈、可动衔铁和触点组成。衔铁通过弹簧连接，因此在正常工作条件下会回到其原始位置。如果线圈由电源供电，磁场会使衔铁被吸向电磁铁，从而使常开触点（NO）和公共端子触点（COM）连接。该状态如图
    3 所示。当线圈未由电源供电时，不产生磁通，弹簧将衔铁拉回其原始位置，从而使常闭触点（NC）和 COM 连接。在切换感性直流负载时反复发生的继电器触点 NC
    和 NO 上的重载会导致继电器过早失效。取决于应用，组件失效可能导致停机、设备损坏或人身伤害。因此，及时更换损坏的继电器非常重要。


    在此应用案例中，对机电继电器在整个使用寿命期间进行感性负载测试，以开发用于故障检测的工业分析方法。在实验设置中，继电器在高直流负载下反复通断测试。一个感性负载连接到继电器的触点侧，在断开瞬间导致开启触点表面之间产生电弧并损坏继电器触点。该过程重复进行，直到继电器失效。


    基于继电器线圈电流特征与基于 Kullback-Leibler 散度的分类器 [KL1951] 相结合，已找到一种可用于预测即将发生的故障并实现预测性维护的组合特征。在本研究中，仅考虑了无需额外传感器即可直接在继电器中测量的特征。图
    3 显示了分类输出的示例图。


