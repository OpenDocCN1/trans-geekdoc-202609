    Process (AHP) and fuzzy TOPSIS method principles [22]. An AHP method was applied
    to calculate the criteria priority weights, while fuzzy TOPSIS is used to evaluate
    and select a proper (combination of) digital assistance system(s).


    ### 2.2 Device Selection Layer


    The Device selection layer represents the technology database and includes hardware
    and authoring software solutions. Due to the novelty of the topic, we had access
    to only a few practitioners with real-life implementations of DAS, especially
    smart glasses in this matter. For this reason, we have decided to elicit the functionalities
    from systematic literature review and market analysis. Based on ISO16290 the Technology
    Readiness Level of the emerging technologies on the market has been rated (see
    Fig. 1).


    ## 3 Case Study: An Explanatory Process Model for DAM


    To reveal the functionality of the developed process model a maintenance scenario
    has been developed within the TU Wien Pilot-Factory Industry 4.0. Up to now, maintenance
    processes on the Universal Robot (UR5 laboratory robot) have only been carried
    out by experts. A proper DAS should guide workers step by step through the maintenance
    activities on the machine. Based on the developed selection model (cf. Section
    2), the use of smart glasses is recommended. The chosen underlying software tool
    is called MO²GO, a Process Modeling Tool developed by the Fraunhofer Institute
    for Production Systems and Design Technology IPK.


    ![](img/a2f5eed6507498d886a06be86239344b_99_0.png)


    Fig. 5. Schematic software architecture for a context sensitive digital assistance
    system.


    To model business processes, the method of integrated enterprise modeling (IEM)
    was developed in the 1990s at the Fraunhofer IPK [23]. The application of the
    IEM supports the description of business processes and their interactions with
    description elements of companies, such as organization, system, product or control.
    It is compatible with DIN EN ISO 19440 "Enterprise Integration - Constructs for
    Enterprise Modelling" and describes four element classes that can be related by
    five connection types. Table 1 shows a selection of element classes and connection
    types which are needed to model maintenance processes. The graphical modeling
    tool MO²GO[24], also developed at Fraunhofer IPK, is well suited to model the
    maintenance processes and forms the basis for the implementation of DAS[25]. MO²GO
    supports the XML (eXtensible Markup Language) exchange format, which is suitable
    for exchanging data between different applications. For the process step representation
    in a graphical user interface (GUI) of a digital assistance system, MO²GO offers
    an interface to provide the XML format of the process model as a JavaScript object
    representation. The elements and their connections are then converted to JSON
    format and interpreted by an application interface (API) to link resources, generate
    context sensitive instructions and to initialize support functions on the maintained
    system during the various process steps. This JSON representation is then transformed
    to the web-capable HTML5 format in which JavaScript is embedded to realize human-machine-interaction.


    Table 1. Excerpt of IEM classes and connection types used for maintenance process
    modeling.


    | Objects and linkage types | Description |

    |---|---|

    | Product | All objects that are changed by activities during a field service
    deployment, e.g. the product “machine tool with failure” (start condition) is
    changed by the activity “performing service deployment” towards the product “machine
    tool without failure” (final condition) |

    | Activity | Changes the condition of a product |

    | Resource | All needed objects necessary to perform an activity, e.g. web service
    call to invoke a test routine on the machine tool |

    | Sequence | Activities are performed successively |

    | Parallel branching | Activities are performed parallel; parallel activities
    have to be completed before the next activity can be started |

    | Loop | The activity in the loop will be performed until the condition for starting
    the next activity is met |


    Figure 6 shows a scenario for the exchange of gripper jaws.


    ![](img/a2f5eed6507498d886a06be86239344b_100_0.png)


    **Fig. 6** Pictorial representation of a need for action and textual explanation
    of the activity combined with a pictorial representation of the tool and the object
    to be exchanged.


    The maintenance operator is assisted by step-by-step instructions through virtual
    information directly on the work object. The user interface has been kept simple
    i.e. users see a complete virtual model of the equipment and the needed information
    to fulfil the maintenance task to the right. The MO²GO model is used to provide
    logic and information for the augmented reality (AR) based assistance system and
    to guide the worker through eight process steps.


    ## 4 Conclusion and Outlook


    The presented approach can serve as guidance for the strategic evaluation of digital
    assistance solutions supporting maintenance processes. Combined with the proposed
    process-modeling tool the assistance system can provide the needed information
    to improve the maintenance efficiency. Since the proposed approach is currently
    a prototype, it encompasses some limitations that necessitate further research.
    First, the underlying decision hierarchy is based on experimental knowledge to
    experts and has been only validated through the proposed use case. In order to
    improve the quality of recommendations we need to collect feedback through employing
    the proposed approach to further practical use-cases. Second, the key information
    regarding hard- and software of the DAS on the market is extracted manually. By
    using various web crawling and web analytic techniques, including automated text-
    and web-mining methods, information can be extracted from documents such as product
    manuals and patent documents dynamically to identify the key features of existing
    products and technologies.


