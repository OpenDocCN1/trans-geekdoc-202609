    ## 生产线中无监督异常检测


    Alexander Graß, Christian Beeks, Jose Angel Carvajal Soto


    弗劳恩霍夫应用信息技术研究所 FIT，德国

    {alexander.grass,christian.beeks,angel.carvajal}@fit.fraunhofer.de


    **摘要。** 随着向工业 4.0 的数字化转型不断推进，基于 cyber-physical systems 收集的传感器数据相应增长，工业生产线中自动数据分析的需求急剧增加。一个相关的应用场景是利用智能方法预测即将发生的故障以进行维护。在本文中，我们提出了一种针对工业数据密集型环境中预测性维护的异常检测新方法。特别是，我们专注于来自真实回流焊炉的历史传感器数据，该炉用于将表面贴装电子元件焊接到印刷电路板上。在
    EU-项目 COMPOSITION（赠款编号 723145）范围内提供的传感器数据，包含回流焊炉内各个风扇的热量和功耗信息。该数据集包含时间标注的传感器测量值，以及超过七年期间的额外工艺信息。


    **关键词：** 无监督学习，工业 4.0，异常检测


    ## 1 引言


    在过去几年中，网络物理系统为优化工业流程的重要性，导致传感化生产环境显著增加。在此背景下收集的数据，允许新的智能解决方案，例如支持决策过程或实现预测性维护。与后一种情况相关的一个问题是，在没有任何预定义基准真理的情况下，检测机器行为中的异常。如果由于同一生产线加工的多个物料需求不同而实时重新配置机器参数，这一事实会进一步复杂化。因此，可调参数的更改在大多数情况下会直接导致不一致的测量结果，即使这些观察不应被视为异常。


    在 EU-项目 COMPOSITION（赠款编号 723145）范围内，研究了基于真实回流焊炉的历史传感器数据进行预测性维护的异常检测任务。虽然该炉子基于不断变化的配方用于将表面贴装电子元件焊接到印刷电路板上，但一个相关问题是由错误元件引起的炉子潜在误行为的无监督识别。所使用的数据集包含各个风扇的热量和功耗信息。除了每个炉区预定义的热值等其他机器参数外，它还包含记录超过七年的时间标注传感器观测值和工艺信息。


    作为解决这个问题的一个方案，在接下来的章节中，我们将介绍我们的方法，名为生产线通用异常检测，简称 GDPL。在简要介绍相关方法后，在接下来的章节中，我们将重点介绍算法的描述。随后，我们将概述在前述项目数据上进行的评估，最后对该方法和未来工作进行总结性讨论。


    ## 2 相关工作


    虽然异常检测和特征提取主题已有大量文献涉及，但在接下来的内容中，我们将专注于导致此处所提出算法的一系列方法。最近，自动描述时间序列以理解数据行为或执行后续操作，已引起许多研究人员的关注。在这方面的一个想法是利用高斯过程
    [3,5] 或相关结构组合 [4]。在这里，使用由核心字母表组成的语义直观语法对时间序列进行分析。尽管相应的评估显示出令人印象深刻的结果，但它们更适用于较小或中等规模的历史数据，因为模型训练相对耗时。相比之下，还有其他方法，专注于提取
    well-known 的统计特征，并在前一阶段通过额外的特征选择进一步优化 [2]。然而，特征选择的评估是基于已提供的知识，因此不适用于无监督用例。此处讨论的最后一种方法，使用基于原始数据的分段自相似连接的想法
    [7]。为了降低复杂度，在频域中将时间序列的分段相互比较。尽管这一想法为许多后续应用场景提供了高效的基础，但它缺乏描述性特征的语义表达性，就像已经提到的方法一样。


    在接下来的章节中，我们因此试图应对这些挑战，同时介绍我们的无监督异常检测方法。


    ## 3 方法


    此处介绍的 GDPL 描述基于算法的分阶段实现。在对相似输入参数进行初始聚类（3.1）和随后的分段（3.2）后，我们将讨论单个分段的表示（3.3）和相应的差异度量（3.4）。GDPL
    也在本章末尾的图 Algorithm 1 中总结。


    ### 3.1 配置聚类


    在许多公司，就像在 COMPOSITION 案例中一样，单个生产线通常用于根据不同要求生产多个物料。这些要求通常由可变机器配置定义，包括一个或多个可调参数，这些参数在运行期间实时更改。为了检测相对于机器默认行为的偏差，这一事实引发了不同配置的传感器测量值之间无效比较的问题。如果将测量值或测量间隔标识为异常，则只有当此观察与代表默认行为的观察属于同一配置时，才应将其视为异常。换句话说：如果
    \( C_k = \{x_l := \lambda_l | 1 \le l \le M \} \) 是带有 \( M \) 个参数 \( x_l \) 和值
    \( \lambda_l \) 的配置，那么对于两个测量表示 \( y_{1,i} \) 和 \( y_{2,j} \) 及其关联配置 \( C_i \)
    和 \( C_j \) 之间的差异度 \( \delta \)，有：


    \(\delta(y_{1,i} \text{ , } y_{2,j}) \text{ is defined iff. } i==j\)


    因此，在所有后续步骤之前，首先必须根据关联配置对所有传感器测量进行聚类。为简单起见，在以下子节中，我们仅讨论单个簇内的过程，尽管必须牢记，每个步骤都会对所有簇并行执行。


    ### 3.2 分段


    作为基于配置的聚类的结果，数据已经被粗略分段。然而，由于这种方法描述的是无监督异常检测，进一步分段的目的是创建某种反映机器默认行为的基准真理。在小节 3.4
    中，我们将看到如何利用分段来实现这一想法。在初始步骤中，定义最大分段长度，以指定时间范围，在此之后可以检测异常。假设每个传感器的采样率为 5 分钟，那么一个分段的最大长度将相应为
    \((60 \cdot 24)/5 = 288\)，以按天描述行为。虽然减少分段长度意味着响应时间缩短，但也会增加计算复杂度，并使检测对无效传感器测量更加敏感。在此背景下，需要指出，如果由于缺失值导致分段在时间上不连续，则在此阶段也会拆分分段。另一个必须考虑的事实是配置更改的过渡时间。虽然与配置更改关联的输入参数会立即改变，但观察值可能适应较慢，因此会模糊新分段的表达性。为防止这种情况发生，


