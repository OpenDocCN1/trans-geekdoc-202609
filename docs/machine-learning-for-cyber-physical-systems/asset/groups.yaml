    However, those algorithms runtime depend heavily on the input data. Most of the
    computational time in DLNN is consumed by the convolution step, which is based
    on a general matrix multiplication (GEMM). In order to accelerate the computational
    time for DLNN different highly optimized GEMM implementations for Graphic Processing
    Units (GPUs) have been presented in the last years [1]. In order to achieve a
    high computational throughput, most of these approaches are based on a hardware
    specific software kernel implementation of the GEMM algorithm. Usually the different
    hardware dependent kernel parameters are tuned manually, which involves expertise
    about the specific GPU architecture. Furthermore the performance of the GEMM kernel
    is strongly affected by the shape of the input data processed different data sizes
    have a huge impact on the computational runtime of the GEMM kernel due to the
    different memory layouts of the GPU accelerators.


    In order to achieve a maximum performance the parameters of the GEMM algorithm
    have to be tuned hardware and task specific. In the last years, several autotuning
    approaches of GEMM kernel parameters have been proposed [2] - the basic idea is
    to automatically tune a limited number of essential GPU kernel parameters in order
    to achieve a maximum performance. Usually the approaches do not take into account
    the size and shape of the given input data, which yields to varying computational
    runtimes.


    The motivation of the presented work is to develop an autotune procedure for GPU
    based GEMM kernels, which takes into account a comprehensive set of kernel parameters
    and varying shapes of the data in the input task.


    Proposed autotuning solutions such as [2] usually require a lot of computational
    runtime to find an optimal kernel parameter set. The kernel parameter space e.g.
    in the MAGMA GEMM kernel [4] is very large and therefore restrictions are made
    to reduce the search space for the kernel parameters followed by a brute search
    mechanism. This usually results in high search times for the kernel parameters
    to be set.


