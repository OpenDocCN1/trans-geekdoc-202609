    `one-hot-encoding` 方法。此外，对于生产步骤（生产流程中的步骤）中具有不同值的一些参数，通过将这些参数的聚合（如平均值）添加到数据集中，结果得到了改善。


    ### 4.2 特征与特征分布


    在特征（自变量）中，特征重要性存在明显的排序，但不存在单个特征或小特征组的明显主导地位。例如，最重要特征的相对重要性约为 0.0383，第 10 重要特征的相对重要性仍达到大约
    0.0302。


    图 3 显示了最重要特征和第 10 重要特征的分布。在此，特征已重新命名，param. 1 指第一个/最重要的特征（图 1），param. 2 指第 10
    重要特征（图 2）。我们在图表中添加了后缀，以分别显示误差和非误差情况的分布。图表描绘了整个数据集的分布（即，包括训练部分和测试部分的数据）。左侧框（即后缀“majority”）指多数类（即非误差情况）的值，而后缀“minority”指少数类（即误差情况）的值。


    ### 4.3 算法比较与选型


    我们使用 Python 编程语言和类似 Scikit-learn 库¹ 的库，通过训练多种算法构建了所有模型。


    该数据集被分为训练（0.7）和测试（0.3）数据。结果表明，数据中包含最相关


