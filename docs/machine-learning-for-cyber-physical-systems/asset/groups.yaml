    ## 带有众多工艺变量和质量标准的冲压硬化生产线的工艺控制


    Anke Stoll, Norbert Pierschel, Ken Wenzel, 和 Tino Langer


    弗劳恩霍夫机床与成形技术研究所 IWU，德国 09126 采姆尼茨赖兴汉纳街 88 号

    anke.stoll@iwu.fraunhofer.de


    ### 摘要


    目前，冲压硬化工艺的优化仍然是一项复杂且具有挑战性的任务。本报告描述了将线性回归与最小二乘优化相结合，以调整该工艺的工艺参数，从而提高质量。使用了 FE 仿真程序
    AutoForm 来建模相关生产线，并测量了各种工艺和质量参数。所提系统能够根据生产线各步骤的质量估计，自动调整后续工艺步骤的工艺参数。额外的好处是能够在生产过程早期识别可能存在缺陷的零件。基于
    1000 次观察的结果，更好地了解了该工艺，未来可将组合回归与优化方法扩展到更复杂的生产线。


    ### 关键词


    线性回归，最小二乘优化，生产线，冲压硬化，工艺控制


    ## 1 引言


    工业 4.0 的目标之一是通过算法、大数据方法和高新技术进行数字化，以优化和定制生产流程 [1]。目前，机器学习 (ML) 方法支持用于故障检测、维护、决策支持和产品质量改进的监控、诊断和(离线)系统优化
    [2,3]。ML 领域多种多样，有多种不同的方法可供选择。然而，在制造和其他应用领域，ML 方法的复杂性可能会阻碍其采用，即使许多生产过程的数据采集是可能的，并且充足的数据库可用或可获得。因此，本工作旨在为生产线实施一种简单的
    ML 和优化方法。本文从第 2 节讨论与 ML 和工艺控制相关的工作开始，接着在第 3 节介绍方法论，其中包括数据集、数据准备和估计技术的描述。第 4 节描述了分析结果。第
    5 节介绍了结论和实际意义的讨论。


