    \ such as [8, 9]. While the work presented in [8] focuses on 3D TFT, the approach\
    \ in [9] focuses on sparse matrices and optimizing the GPU kernel based on a statistical\
    \ model. The concepts presented in [10] and [11] focus on automatic generating\
    \ GPU kernel code and autotune over different generated kernels. Since the generated\
    \ code is not optimized with respect to the underlying GPU architecture, usually\
    \ the performance of these concepts is not optimal.\n\nThe presented work in this\
    \ contribution is based on the well-known MAGMA GEMM kernel. The software implementation\
    \ is characterized by an extensive GPU kernel parameter space. The MAGMA GEMM\
    \ kernel has already been investigated in several autotuning approaches [2, 12–16].\
    \ The original kernel implementation has been described in [12] and a first autotune\
    \ concept [13]. With the introduction of the NVIDIA Fermi GPU architecture, the\
    \ kernel implementation has been revised [14] and an autotuning procedure has\
    \ been presented in [2]. The approach is characterized by a huge search space\
    \ for the GPU kernel parameters in conjunction with a brute-force parameter search\
    \ mechanism, which leads to a high computational effort for finding optimal kernel\
    \ parameters. With respect to small GEMM operations, in [15, 16] approaches for\
    \ batched GEMM operations have been presented and [17] describes the utilization\
    \ of the MAGMA GEMM kernel in machine learning procedures. The autotuning approach\
    \ presented in [18] focuses on energy efficiency of the GPU while processing GEMM\
    \ operations.\n\nMost of the presented state-of-the-art work is based on a brute-force\
    \ approach for determining the optimal GEMM kernel parameters. This usually leads\
    \ to a huge parameter search space and therefore most of the approaches use a\
    \ parameter combination pre-elimination step in order to reduce the computational\
    \ effort. The different heuristics for reducing the search space can possibly\
    \ dismiss optimal kernel parameter combinations. With respect to these suppositions,\
    \ the presented work focuses on defining optimal heuristics to reduce the search\
    \ space in combination with a Simulated Annealing (SA) procedure to find efficiently\
    \ optimal performing GEMM kernel parameters.\n\n## 2 Solution\n\nOptimal GPU kernel\
    \ parameters strongly rely on the underlying GPU hardware architecture, the memory\
    \ layout and the input data size. Different settings lead to different optimal\
    \ parameter combinations. Therefore the resulting search space for finding the\
    \ optimal parameter combination can be enormous. Tuning the parameters by hand\
    \ is impractical, since it has to be redone for every GPU architecture and every\
    \ set of input data size again. With respect to these suppositions in the following\
    \ sections we present a two-step autotuning approach for GPU-based GEMM algorithms.\
    \ In the first step the kernel parameter search space is pruned by several heuristic\
    \ performance criteria, keeping good performing parameter combinations for a set\
    \ of different use cases. In the second step based on a modified Simulated Annealing\
    \ (SA) algorithm the remaining parameter sets are further processed in order to\
    \ find the best kernel parameter combinations with respect to the GPU architecture\
    \ and task specific data layout out.\n\nIn the following sections, the proposed\
    \ autotuning approach is presented. In section 2.1, a short overview of the MAGMA\
    \ GEMM kernel is given; in section 2.2 we explain the developed heuristics for\
    \ reducing the search space and in section 2.3 the SA approach is introduced.\n\
    \n### 2.1 Magma GEMM Stencil structure\n\nThe developed autotuning approach is\
    \ based on the well-known MAGMA GEMM kernel. The original kernel implementation\
    \ has been described in [12] and is characterized by an extensive GPU kernel parameter\
    \ space. Algorithm 1 shows the pseudo-code of the kernel. The kernel has 11 parameters\
    \ - two of the kernel parameters are only relevant for calculations in complex\
    \ number space. Therefore the kernel parameter space is reduced to nine relevant\
    \ kernel parameters - the parameters are described in the following:\n\n- **Blocksizes**:\
    \ The Blocksizes BLK\\_M, BLK\\_N and BLK\\_K define how many elements a Threadblock\
    \ will calculate.\n- **Threadblock dimensions**: The Threadblock dimensions DIM\\\
    _X and DIM\\_Y determine the size of the Threadblock, which calculates a block\
    \ on the result matrix.\n- **Subdimensions**: The Subdimensions DIM\\_XA, DIM\\\
    _XB, DIM\\_YA and DIM\\_YB determine how the Shared Memory (SMEM) is filled.\n\
    \n### Algorithm 1: GEMM Kernel Algorithm (simplified)\n\n```\nData: Matrix A [M\
    \ x K], Matrix B [K x N], Matrix C [M x N], alpha,\nbeta\nResult: C=A x B * alpha\
    \ C + beta * B\nload $A_t$ and $B_t$ to SMEM;\nfor $i \\leftarrow 0$ to $K step\
    \ BLK\\_K$ do\n  $A_{t+1}$ and $B_{t+1}$ to regs;\n  for $i \\leftarrow 0$ to\
    \ $BLK\\_K$ do\n    load $A_t$ and $B_t$ to REG;\n    $C_{temp}=A_t * B_t$\n \
    \ load $A_{t+1}$ and $B_{t+1}$ to SMEM;\nC = $C_{temp}$ * alpha + beta\n```\n\n\
    ### 2.2 Reducing search space\n\nTo reduce the search time for finding optimal\
    \ kernel parameter sets in the first step it is necessary to eliminate parameter\
    \ sets, which with respect to the underlying GPU hardware layout are not possible\
    \ and possibly lead to an unstable behaviour of the kernel execution. The following\
    \ parameters are reduced:\n\n- **prelimitations**: We started with reducing the\
    \ viable threadcounts respectively the threadblock dimensions. The threadblock\
    \ dimensions(DIM\\_X, DIM\\_Y) can only be 8, 16 or 32 resulting in 64, 256, 512\
    \ or 1024 threads. The GPU manufacturer NVIDIA recommends using a minimum of 64\
    \ threads [20], which is the lower limit we are applying, the upper limit is given\
    \ by the hardware specification of the GPU. Other configurations will not map\
    \ onto the GPU hardware.\n"
