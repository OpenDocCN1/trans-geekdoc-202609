    ## Process Control in a Press Hardening Production Line with Numerous Process
    Variables and Quality Criteria


    Anke Stoll, Norbert Pierschel, Ken Wenzel, and Tino Langer


    Fraunhofer Institute for Machine Tools and Forming Technology IWU, Reichenhainer
    Str. 88, 09126 Chemnitz, Germany

    anke.stoll@iwu.fraunhofer.de


    ### Abstract


    Today, the optimization of the press hardening process is still a complex and
    challenging task. This report describes the combination of linear regression with
    least squares optimization to adjust the process parameters of this process for
    quality improvement. The FE simulation program AutoForm was used to model the
    production line concerned and various process and quality parameters were measured.
    The proposed system is capable of automatically adjusting the process parameters
    of following process steps based on the quality estimate at each step of the production
    line. An additional benefit is the identification of likely defective parts early
    in the production process. Based on the results derived from 1000 observations
    a better understanding of the process was obtained and in the future the combined
    regression and optimization approach can be extended to more complex production
    lines.


    ### Keywords


    linear regression, least squares optimization, production line, press hardening,
    process control


    ## 1 Introduction


    One of the goals of Industry 4.0 is the optimization and customization of production
    processes through digitization with algorithms, big data approaches and high technologies
    [1]. Currently, machine learning (ML) approaches support monitoring, diagnosis
    and (off-line) system optimization for fault detection, maintenance, decision
    support and product quality improvement [2,3]. The field of ML is manifold and
    various different methods are available. However, in manufacturing and other fields
    of application the complexity of ML methods can hinder their adoption even though
    the data acquisition for many production processes is possible and a sufficient
    data base is available or can be obtained. Therefore, this work aims to implement
    a simplistic ML and optimization approach for a production line. The paper starts
    with a discussion of work related to ML and process control in Section 2, followed
    by the presentation of the methodology in Section 3, that includes a description
    of the data sets, the data preparation, and the estimation techniques. The results
    of the analysis are described in Section 4. Section 5 presents the conclusions
    and discussion of practical implications.

