    ## 基于谱格兰杰因果性的不同激励信号下动态系统定向连通性检测


    Christian Kühnert, Christian Frey and Ruben Seyboldt


    Fraunhofer 光电子学、系统技术与图像利用研究所 IOSB，Fraunhoferstraße 1，76131 卡尔斯鲁厄，德国


    {christian.kuehnert,christian.frey,ruben.seyboldt}@iosb.fraunhofer.de


    **摘要。** 工业装置通常由多个强相关的工艺单元组成。这意味着一个单元中的自愿或非自愿变化（例如，更改某些工艺控制参数或出现故障值）可能导致另一个工艺单元出现意外结果。因此，了解哪些是引起变量、哪些是受影响变量至关重要。然而，取决于底层工艺和激励信号的特性，定向连通性可能可以也可能无法被检测到。因此，本文定义了多种动态SISO系统和激励信号，其中应检测从输入到输出信号的定向连通性，而不应检测从输出到输入的定向连通性。作为检测定向影响的方法，使用了谱格兰杰因果性（Spectral
    Granger Causality），并已将其扩展为基于代理的显著性检验。该检验用于判断一个工艺变量向另一个工艺变量是否存在定向影响。


    **关键词：** 谱格兰杰因果性 · 定向连通性检测 · 时间序列分析。


    ## 1 引言


    生产工厂的过程控制系统通常包含大量工艺变量，而变量之间的互连性并不总是直接明显。因此，由于互连性，如果对一个单元进行自愿或有意的更改，可能导致另一个单元出现不良影响。因此，了解哪个变量对另一个变量有显著影响至关重要。


    对于时间序列中定向连通性的自动检测，已存在多种方法，这些方法主要开发用于神经科学应用（例如，[3]或[1]作为综述）或计量经济数据分析[9]。最早开发的方法之一由Granger
    [8]提出，称为格兰杰因果性（Granger Causality）。该方法使用两个向量自回归函数，通过比较它们的残差平方和，该方法能判断一个变量是否导致另一个变量。最初在时域中提出的方法，由Geweke
    [7]扩展到频谱域，具有选择特定频率进行分析的优势。2000年，Schreiber [14]开发了一种称为传递熵（Transfer Entropy）的方法，用于衡量从一个随机过程到另一个随机过程的信息传递量。在近期研究中，传递熵已被扩展。它包含多种扩展，如部分传递熵（Partial
    Transfer Entropy）[11]或符号熵（Symbolic Entropy）[13]。Bauer [2]提出了一种用于因果-效应分析的最近邻方法。在[12]中，开发并比较了多种用于检测显著定向影响的方法，在几个基准测试上进行了比较，这些基准测试包括模拟动态系统数据、生物信号以及玻璃成型过程中的干扰。Kaminski
    [10]提出了定向传递函数的估计方法。


    本文旨在探究在何种情况下可以检测测量中的定向影响，这取决于激励信号以及底层动态系统。作为特定检测方法，使用了谱格兰杰因果性[7]，并将其扩展为基于代理的显著性检验。与[12]不同，[12]已为因果依赖的检测定义了基准过程，本文更侧重于激励信号的特性。


    本文结构如下：第2节介绍如何在时间序列中检测定向连通性以及如何应用谱格兰杰因果性。此外，解释了基于代理的显著性阈值计算。第3节描述了用于基准测试的定义输入信号和动态系统，而第4节讨论结果。最后，第5节给出总结和未来研究的一些想法。


    ## 2 时间序列中定向连通性的检测


    ### 2.1 双变量谱格兰杰因果性


    格兰杰因果性（GC）的概念最初由克莱夫·格兰杰（Clive Granger）于1969年在经济学领域提出[8]，他用它来确定不同计量经济模型之间的关系。双变量GC的基本概念可以通过假设两个时间序列
    \(u[k] \in \mathbb{R}\) 和 \(y[k] \in \mathbb{R}\)（\(k=1,\dots,K\) 个样本）来解释。在这种情况下，如果
    \(u[k]\) 和 \(y[k]\) 的过去值对 \(y[k]\) 的预测精度高于仅使用 \(y[k]\) 的过去值，则假定因果连通性 \(u \to y\)
    存在。在数学上，这是通过比较两个线性向量自回归模型来评估的，第一个模型仅包含 \(y[k]\) 的过去值，称为受限模型，另一个模型包含 \(u[k]\) 和
    \(y[k]\) 的过去值，称为不受限模型。此外，格兰杰因果性可以轻松扩展到多变量情况，良好的解释可参见例如 [16] 或 [4]。由于第3节开发的基准始终将一个输入与一个输出进行比较，为简化起见，多变量GC不会在本文中解释。


    **时域中的GC：** 在时域中，通过比较两个线性向量自回归（VAR）模型来检查 \(u\) 是否导致 \(y\) 或 \(y\) 是否导致 \(u\)。


    两个VAR模型定义为


    $$

    u[k] = \sum_{j=1}^n a_{uu}[j] \cdot u[k-j] + \sum_{j=1}^n a_{uy}[j] \cdot y[k-j]
    + e_u[k], \quad (1)

    $$

    $$

    y[k] = \sum_{j=1}^n a_{yy}[j] \cdot y[k-j] + \sum_{j=1}^n a_{yu}[j] \cdot u[k-j]
    + e_y[k] \quad (2)

    $$


    其中残差协方差矩阵定义为


    $$

    \Sigma = \begin{pmatrix} \Sigma_{uu} & \Sigma_{uy} \\ \Sigma_{yu} & \Sigma_{yy}
    \end{pmatrix} \quad (3)

    $$


    在(1)、(2)中，n是模型阶次，\(a_{uu}, a_{uy}, a_{yu}, a_{yy} \in \mathbb{R}^n\) 包含模型系数，\(e_u[k],
    e_y[k] \in \mathbb{R}\) 定义残差。最后，GC检查 \(a_{yu}\) 中的系数（分别为 \(a_{uy}\)）。如果这些系数与零有显著差异，则假定
    \(u\) 导致 \(y\)（分别 \(y\) 导致 \(u\)）。通常，这是通过比较 \(e_u\)（分别 \(e_y\)）的残差平方和，与不考虑影响变量
    \(y\)（分别 \(u\)）时的情况来完成的。


    **频域中的GC** 与时域相比，在频域中工作的优势在于，因果连通性可以与特定频段相关联，并能更好地理解数据。该方法在[7]中已详细说明，为完整起见，此处给出主要步骤。方程1和2的傅里叶变换可以写成以下方程组：


    $$

    \begin{pmatrix} A_{uu}(f) & A_{uy}(f) \\ A_{yu}(f) & A_{yy}(f) \end{pmatrix} \begin{pmatrix}
    u(f) \\ y(f) \end{pmatrix} = \begin{pmatrix} e_u(f) \\ e_y(f) \end{pmatrix} \quad
    (4)

    $$


