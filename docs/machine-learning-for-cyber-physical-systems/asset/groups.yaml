    support has not been sufficiently well emphasized. A preliminary chronological
    market and literature analysis with regard to suitability and industrial applicability
    (i.e. technology readiness) of DAS, in particular wearable devices, is shown in
    Fig. 1.


    ![](img/a2f5eed6507498d886a06be86239344b_96_0.png)


    Fig. 1. Overview of digital assistance systems on the market and their market
    entrance.


    As a result, the four most common DAS in industrial application are: industrial
    tablets, smart watches, smart phones and head mounted displays [12], [17], [18],
    [19]. While the pros and cons of handheld devices (industrial tablets, smart watches,
    smart phones) are well known and elaborated in literature, the potential of head–mounted
    displays are disputed. The most value–creating functionalities of head mounted
    displays lie in information provision, environmental identification and tracking
    [6]. The opportunity to access information hands free provides additional benefits.
    However, due to various technical limitations and challenges, such as wear comfort
    or poor wireless network connections, the question of usefulness in maintenance
    still arises.


    ## 2 Selection Methodology


    This section explains the methodology of the developed model to select proper
    DAS for maintenance tasks. The proposed model builds on three integrated elements
    (see Fig. 2): i) Morphological Approach, ii) Application Layer and iii) Device
    Selection Layer.


    ![](img/a2f5eed6507498d886a06be86239344b_97_0.png)


    Fig. 2 3-layer model for selecting proper digital assistance systems


    The first element represents a morphological box, which has been developed to
    facilitate and optimize the selection of suitable DAS. The second element represents
    the application domain. The application layer provides the individual user-specific
    system requirements as well as application scenarios (i.e. describing and representing
    maintenance activities). Subsequently, the system and hardware requirements resulting
    from i) the predefined parameters of the requirement morphology and ii) from the
    application level are evaluated and, according to their overall systemic meaning,
    compared with the potential technology solutions. Algorithms and correlation analyses
    within this system are used to ultimately map the requirements to existing digital
    assistance solutions. Using the proposed approach, a (combination of) DAS is selected
    and linked to maintenance activities. Finally, we collect feedback through employing
    the selected digital assistance system to improve the quality of recommendations
    and to identify the strengths and weaknesses of each system in association to
    practical use-cases.


    ### 2.1 Morphological approach


    In order to facilitate and optimize the selection of suitable DAS for supporting
    maintenance operations in manufacturing industry, a morphological approach has
    been developed. A Morphological Analysis (MA) represents a method for systematically
    structuring and analyzing a set of relationships contained in multi-dimensional,
    non-quantifiable problem complexes [20], [21]. MA usually consists of three steps.
    First, the problem complexity is categorized into several dimensions. Second,
    all possible conditions (also referred to as parameters) to each dimension are
    identified. These parameters represent the characteristics of each dimension.
    Finally, a morphological matrix is developed based on the identified dimensions
    and their assigned condition parameters [22]. Figure 3 depicts a morphological
    matrix, which contains a collection of identified features that are critical to
    selecting an assistance system. Key features for an adequate assistance system
    can be categorized into three groups: i) requirements regarding the application
    (software): How and to what extent maintenance information is presented to maintenance
    operators and engineers towards increasing their performance in an affordable
    manner? ii) requirements regarding the information system: How and to what extent
    maintenance information is tailored to the application? iii) requirements regarding
    the hardware: which hardware should be applied for the selected case?


