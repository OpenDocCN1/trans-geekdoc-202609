    # 2 Development process of Industrial Analytics solutions


    Industrial analytics functions are typically composed of different tasks, as shown
    in Figure . The figure shows the typical workflow of an industrial analytics application,
    where data from the different devices are first consolidated in a single data
    source (data storage). The next step is to pre-process the data as preparation
    for the learning process (preprocessing). In this step, relevant features are
    extracted from the raw data signals, involving the combination of statistical
    methods with domain-knowledge to select meaningful features.


    ![](img/a2f5eed6507498d886a06be86239344b_115_0.png)


    # Figure 1: Typical workflow of an industrial analytics system.


    The next step is the selection, training and tuning of machine learning algorithms
    to derive a model from the selected features (model learning). Again, the combination
    of analytics expertise and domain knowledge is key to develop an efficient model.
    Once developed, the model can be used at runtime to monitor the machine or process
    (model execution). To be useful the results need to be properly visualized (visualization).
    The kind of visualization should be selected according to the role of the person
    who shall'
  - '[PAGE 116]


    use this information, e.g., the machine operator, the maintenance manager, etc.
    The integration of an industrial analytics function in an automation system can
    be done at different levels, for instance at the machine, or using a cloud platform.
    These possibilities are explored in the next section.


    # 3 A flexible automation system architecture for Industrial Analytics


    In a typical automation system, the continuous stream of heterogeneous data created
    by machines, actuators and sensors can be used as input for industrial analytic
    applications such as predictive maintenance. As more and more smart components
    from the Internet of Things (IoT) domain enter the production facilities, this
    flood of data will grow dramatically and will become increasingly difficult to
    manage utilizing a centralized Cloud-based data collection and processing approach.
    The concept of Edge Computing has recently been proposed to overcome this limitation
    by providing a distributed computing model where data is processed at the “edge”
    of a network, i.e., near field devices [SD2016, GJFVR2016].


    The core benefit of this approach is to allow for low latency by computing the
    data where it is created without incurring network latencies, which is essential
    for real-time condition monitoring applications. Another benefit is scalability:
    while a traditional centralized approach will no longer be feasible with an increasing
    number of communicating devices, Edge Computing provides a linear scalability
    and is needed as augmentation to reduce pressure on network infrastructure. Furthermore,
    storage and operation cost can be reduced by processing time-sensitive data locally
    and significantly reducing raw data before being sent to the Cloud. This technique
    can also be used to preserve privacy by ensuring that sensitive data is pre-processed
    on-premise so that only privacy-complaint data is transferred to the Cloud. Following
    the steps from data acquisition to analytics processing and to the visualization
    of meaningful machine information, various processing steps at different system
    components are involved. Figure 1 illustrates an example of a flexible automation
    system architecture implementing Industrial Analytics at Edge-, on-premise- and
    Cloud levels.


    Raw data are acquired by Remote Terminal Units (RTUs) from machines, and process-relevant
    actuators and sensors over a fieldbus, e.g. PROFIBUS, depicted by green bus connections.
    An initial pre-processing stage such as filtering can be implemented on these
    devices. The signals are then collected by a Programmable Logic Controller (PLC)
    and used to control the system. Additional process-independent components like
    smart temperature-, vibration- or pressure sensors are typically connected to
    an Industrial IoT (IIoT) gateway via Bluetooth, WiFi, Ethernet or the emerging
    5G [PLZW2015]. These components play an important role in the process of retrofitting
    and enabling Industrial Analytics services on older machines. Monitoring systems
    for important control parts that usually don’t offer data interfaces by design
    (i.e. electro-mechanical relays or solenoid valves) can ideally be connected to
    an IIoT Gateway. We present two practical use cases for these systems in the following
    section of this paper.'
