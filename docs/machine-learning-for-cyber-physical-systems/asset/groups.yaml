    the performance of these concepts is not optimal. The presented work in this contribution
    is based on the well-known MAGMA GEMM kernel. The software implementation is characterized
    by an extensive GPU kernel parameter space. The MAGMA GEMM Kernel, has already
    been investigates in several autotuning approaches [2,12–16]. The original kernel
    implementation has been described in [12] and a first autotune concept [13]. With
    the introduction of the NVIDIA Fermi GPU architecture, the kernel implementation
    has been revised [14] and an autotuning procedure has been presented in [2]. The
    approach is characterized by a huge search space for the GPU kernel parameters
    in conjunction with a brute-force parameter search mechanism, which leads to a
    high computational effort for finding optimal kernel parameters. With respect
    to small GEMM operations in [15,16] approaches for batched GEMM operations have
    been presented and [17] describes the utilization of the Magma GEMM kernel in
    machine learning procedures. The autotuning approach presented in [18] focuses
    on energy efficiency of the GPU while processing GEMM operations.

    Most of the presented state-of-the-art work is based on a brute-force approach
    for determining the optimal GEMM kernel parameters. This usually yields to a huge
    parameter search space and therefore most of the approaches use a parameter combination
    pre-elimination step in order to reduce the computational effort. The different
    heuristics for reducing the search space can possibly dismiss optimal kernel parameter
    combinations. With respect to this suppositions, the presented work focuses on
    defining optimal heuristics to reduce the search space in combination with a Simulated
    Annealing(SA) procedure to find efficiently optimal performing GEMM kernel parameters.


    # 2 Solution


    Optimal GPU kernel parameters strongly rely on the underlying GPU hardware architecture,
    the memory layout and the input data size different settings lead to different
    optimal parameter combinations. Therefore the resulting search space for finding
    the optimal parameter combination can be enormous. Tuning the parameters by hand
    is impractical, since it has to be redone for every GPU architecture and every
    set of input data size again. With respect to these suppositions in the following
    sections we present a two step autotuning approach for GPU-based GEMM algorithms.
    In the first step the kernel parameter search space is pruned by several heuristic
    performance criteria, keeping good performing parameter combinations for a set
    of different use cases. In the second step based on a modified Simulated Annealing
    (SA) algorithm the remaining parameter sets are further processed in order to
    find the best kernel parameter combinations with respect to the GPU architecture
    and task specific data layout out.


    In the following sections, the proposed autotuning approach is presented in section
    2.1 a short overview of the MAGMA GEMM kernel is given, in section 2.2 we explain
    the developed heuristics for reducing the search space and in section 2.3 the
    SA approach is introduced.'
