    ## 4 结论


    机器学习算法的计算吞吐量受到底层硬件可用计算能力的限制。DLNN 中的大部分计算能力都由卷积步骤消耗，该步骤基于通用矩阵乘法 (GEMM)。近年来，为了加速机器学习应用中的计算时间，提出了多种针对
    GPU 的高度优化 GEMM 实现。通常，这些软件库已针对特定的 GPU 版本和要处理的数据的特定布局进行了优化。


    为了获得最大性能，GEMM 算法的内核参数需要针对硬件和学习任务进行专用调优。基于这些假设，我们提出了一种适用于基于 GPU 的 GEMM 算法的两步自动调优方法：第一步，通过使用几种开发的性能指标分析内核源代码，对内核参数搜索空间进行剪枝；第二步，使用一种改进的模拟退火算法，该算法能够快速搜索性能最优的内核参数，同时保持搜索运行时间低于最先进的暴力搜索实现。我们表明，所提出的用于自动调优
    MAGMA-GEMM 内核的方法能够实现高性能，并能适应 GPU 硬件和数据布局。我们的结果基于 160 个不同的输入问题得出——与 NVIDIA (cuBLAS)
    的最先进的 GEMM 实现相比，在基于 Pascal 的 NVIDIA 加速卡上平均加速比约为 12。本文提出的关键概念可以推广，用于自动调优其他对性能敏感的
    GPU 内核的内核参数。


