    \ GEMM 内核参数自动调优方法 [2]——其基本思路是自动调整有限数量的关键 GPU 内核参数，以实现最大性能。通常，这些方法不考虑给定输入数据的大小和形状，从而导致不同的计算运行时间。\n\
    \n所提出工作的动机是为基于 GPU 的 GEMM 内核开发一种自动调优流程，该流程会考虑全面的内核参数集以及输入任务中数据的不同形状。\n\n诸如 [2]\
    \ 之类的提议自动调优解决方案通常需要大量的计算运行时间来找到最优内核参数集。例如 MAGMA GEMM 内核 [4] 中的内核参数空间非常大，因此进行了限制以减少内核参数的搜索空间，随后采用暴力搜索机制。这通常会导致待设内核参数的搜索时间较长。\n\
    \n## 1.2 相关工作\n\n广为人知的自动调优概念，如自动调优线性代数软件项目（ATLAS）[5] 或优化稀疏内核接口（OSKI）[6]，侧重于 CPU\
    \ 计算的优化。只有少数方法引入了 GPU 内核参数自动调优概念 [7]。这些方法仅关注少量调优参数，因此其获得的性能无法与本工作中提出的方法合理比较。为了实现最佳性能，必须考虑全面的\
    \ GPU 内核参数集。\n\n在文献中还有更多自动调优方法，例如 [8, 9]。虽然 [8] 中提出的工作侧重于 3D TFT，但 [9] 中的方法侧重于稀疏矩阵，并基于统计模型优化\
    \ GPU 内核。[10] 和 [11] 中提出的概念侧重于自动生成 GPU 内核代码并对不同生成的内核进行自动调优。由于生成的代码未针对底层 GPU 架构进行优化，这些概念的性能通常不是最优的。\n\
    \n本工作基于广为人知的 MAGMA GEMM 内核。该软件实现的特点是拥有广泛的 GPU 内核参数空间。MAGMA GEMM 内核已在多种自动调优方法中进行过研究\
    \ [2, 12–16]。原始内核实现已在 [12] 中描述，第一个自动调优概念在 [13] 中提出。随着 NVIDIA Fermi GPU 架构的推出，内核实现已被修订\
    \ [14]，一种自动调优流程已在 [2] 中提出。该方法的特点是 GPU 内核参数拥有巨大的搜索空间，并结合暴力参数搜索机制，这会导致寻找最优内核参数时付出高昂的计算开销。针对小规模\
