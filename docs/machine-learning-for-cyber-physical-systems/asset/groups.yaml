    emphasized by a high dissimilarity.


    # 5 Conclusion


    With GADPL we introduced a solution to the relevant topic of unsupervised anomaly
    detection in the context of configuration-based production lines. After a short
    outline on the topic and related work, we discussed the algorithm and the associated
    intention of our approach, before briefly showing the evaluation results based
    on the project data.

    Since the approach is ongoing work, in the future we will primarily extend our
    evaluation based on streaming data. Although we described the algorithm using
    historical data, the procedure for streaming data is carried out analogous. Another
    point in the scope of future evaluations is the choice of more complex features
    and a related automated feature selection. Another idea to further improve the
    approach is a semantic segmentation of the time series. While currently a time
    series is segmented exploiting domain knowledge, a segmentation based on characteristics
    in the data might potentially increase the accuracy. This would also prevent from
    an unappropriated choice of the maximal segmentation length, which could result
    in a split of data within a potential motif.

    Finally, we plan to investigate the correlation of anomalies within multivariate
    data. If GADPL in its current state is used for multivariate time series data,
    each dimension is processed independently. Combining inter-dimensional information
    within a single dissimilarity measure to cover anomalies would therefore be a
    useful functionality to further optimize the approach.


