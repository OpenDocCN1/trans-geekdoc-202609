    Fig. 5. General Concept of the Decision Making Tool


    Using the UI, the data scientist loads the characteristics of the data set, the
    requirements of the model to be created and a description of the use case into
    the DMT. Characteristics of the data set are for example the dimensionality of
    the data, number of features, number of data points, data quality, data distribution
    or data noise. Requirements of the model to be created are for instance the learning
    time, performance of the model or transparency of the model. The description of
    the use case includes information about the type of the use case, e.g. predictive
    maintenance or product quality prediction. Characteristics like the dimensionality
    or the maximum running time are quantitative and can directly be loaded into the
    DMT. Others like the transparency of the model need to be transformed from their
    qualitative state into a measurable form using for example goal question metrics
    [22]. This influences the degree of automation to which characteristics can be
    loaded into the DMT.


    Two main databases function as the backbone of the DMT: A database that includes
    the domain-specific characteristics of ML-algorithms and a database that stores
    problem-specific characteristics of ML-algorithms.

