    \n![](img/a2f5eed6507498d886a06be86239344b_13_0.png)\n\n## 基于模糊聚类的时间相关机床特性推导\n\
    \nUwe Frieß⁸*, Martin Kolouch¹ and Matthias Putz\n\n¹ 弗劳恩霍夫机床与成形技术研究所 IWU, 化尔尼茨,\
    \ 德国\n\n* 通讯作者。电话: +49-371-5397-1393; 传真: +49-371-5397-6-1393; 电子邮件地址: uwe.friess@iwu.fraunhofer.de\n\
    \n摘要. 随着信息通信技术(ICT)和大数据能力的兴起，通过物理网络系统(CPS)，制造业中将实物资产和数据计算相结合。该战略也称为工业 4.0，将改善用于维护和生产规划的任何类型的监测。所谓的大数据方法试图利用生产系统中大量分散和分布的数据，基于人工神经网络(ANN)进行监测。如果给定过程的数据基础充足且目标函数的范围经过策划，这些机器学习方法是健壮且准确的。然而，高性能制造业的相当一部分以过程、工件和机器配置条件持续变化为特征，例如，大型工件的加工通常以一件或少量零件的批量进行。因此，如果不考虑不同机器状态（例如，特定机器配置下的特定加工操作）的结构化数据分析，就不可能实现基于\
    \ ANN 的稳健状态监测。随着时间的推移对机器状态进行模糊聚类，创建了一个代表不同典型机器配置簇的稳定池。基于时间的簇调整和自动创建使得能够独立于单个机器状态和预定义过程来监测和解释机床特性。\n\
    \n关键词: 模糊逻辑, 机床, 机器学习, 聚类.\n\n## 1 引言\n\n通过提取 CPS 能力实现技术增值，不仅在学术界，而且在车间生产中已经成为一种选择压力\
    \ [1-3]。核心模块是预测性维护和生产系统的基于云的监测 [4-6]。在 [7] 和 [8] 中，作者介绍了一种克服大型和专用机床状态监测局限性的方法。需要解决的核心挑战是几乎每个内部和外部约束参数随时间的变化\
    \ (图 1)。\n\n这导致难以将任何测量数据与机器及其组件的健康状态相关联。为应对这些挑战，采取的措施如下：\n\n- 1. 基于触发参数 (TPs)\
    \ 定义机器状态 (MSs) (表 1).\n- 2. 特征值 (CVs) 的推导和比较仅在以下情况下进行：\n  - a. 对于相同的机器状态\n  -\
    \ b. 逐步针对由模糊聚类生成的簇 (参见下文 5)\n- 3. 随时间推导 CVs 的动态限值\n- 4. 基于模糊逻辑对当前 CV 值相对于其期望值进行解释\
    \ (参见第 5 节, 图 5)\n- 5. 对 MSs 进行模糊聚类，以创建包含机床广泛特征配置的稳定池\n\n## 1.1 基于预定义机器状态的聚类分析的局限性\n\
    \n对预定义 MSs 进行模糊聚类对于具有明确目标的组件监测（例如健康状态）可能是足够的。基本前提是维护专家对 MSs 进行平衡定义。因此，预定义 MSs\
    \ 容易受到缺乏经验的人员的影响。更具挑战性的是过程和工件批次的变化，这会导致最初定义的 MSs 失效。因此，专家需要定义新的相关 MSs，并从“池”中排除旧的\
    \ MSs (参见 [8] 中的图 9)。\n\n如果用 MSs 的自动推导取代 MSs 的预定义，并随后对这些 MSs 进行模糊聚类，旨在随时间对机床配置进行广泛表征，则可以获得更多潜力。为此，下文将介绍并随后各节将描述一个三步机器学习循环：\n\
    \n- 1. 通过 MS 参数分段自动定义 MS (第 2 节)\n- 2. 如 [8] 所述，为每个状态推导特征值 (CVs)\n- 3. MS-TP 归约:\
    \ MS、CVs 之间的相关性分析、参数归约以及排除不显著的 MSs (第 3 和 4 节)\n- 4. 包括推导簇 CVs 在内的 MS 模糊聚类 (第\
    \ 5 节)\n- 5. 推导表征机器的簇，这些簇代表机床的具体类别，例如特定进给轴配置的重型加工.\n\n## 2 基于不同参数数量的 TP 分段自动定义\
    \ MS\n\n典型的预定义 MS 由 [7] (表 1) 中所示的 TP 子集表征。表 1 中描绘的 MS 通过为轴行程使用不同的 TP 来表示 (参见图\
    \ 2).\n\n表 1. 使用 TP 相对归一化的 MS 归一化数据，整个周期.\n\n| MS | 1 | 2 | 3 | 4 | 5 | 6 | 7\
    \ | 8 | 9 |\n|---|---|---|---|---|---|---|---|---|---|\n| TP | | | | | | | | |\
    \ |\n| 1.1 自动模式 | 1 | 1 | 1 | 1 | 1 | 1 | 1 | 1 | 1 |\n| 3.1 x-位置 | 1 | 1 | 1\
    \ | 1 | 1 | 1 | 1 | 1 | 1 |\n| 4.1 y-位置 | 0.5 | 0.5 | 0.5 | 0.5 | 0.5 | 0.5 |\
    \ 0.5 | 0.5 | 0.5 |\n| 4.2 y-位置 (Δ) | 0 | 0 | 0 | 0 | 0 | 0 | 0 | 0 | 0 |\n| 5.1\
    \ z-位置 | 1 | 0.5 | 0 | 0.86 | 0.41 | 0.14 | 0.05 | 0.55 | 0.95 |\n| 6.1 急加速度 |\
    \ 1 | 1 | 1 | 1 | 1 | 1 | 1 | 1 | 1 |\n| 7.1 加速度 | 1 | 1 | 1 | 0.5 | 0.5 | 0 |\
    \ 0.75 | 0.75 | 0.75 |\n| 8.1 快速进给 | 1 | 1 | 1 | 0 | 0.67 | 0.83 | 0.67 | 1 |\
    \ 1 |\n| 9.1 y2 珠丝杆螺母温度 | 0 | 0.40 | 0.66 | 0.81 | 0.96 | 0.91 | 1 | 0.71 | 0.70\
    \ |\n\nTP 可以在宽范围内变化，例如轴的当前位置或进给。在实际中不会发生的组合 – 例如，给定轴在 0 到 1 mm 之间的行程 – 是不可检测的，因此不会增加复杂性。但是，原则上，1000\
    \ mm 的轴行程可以分为 2 到 ∞ 之间的任何数值整数。因此，仍然需要预先定义 TP 范围。对于动态 TP（如急加速度、加速度或进给）的一个实际解决方案是定义变化约束，以将\
    \ MS 划分为子阶段。\n\nMS 不是单一事件，而是由特定时间跨度表征的过程。机床的实际过程是连续的，可以通过各种措施分割为多个子阶段。例如，使用特定工具的镗削操作。另一个例子可以是单轴的行程，如表\
    \ 2 和图 2 所示。\n\n总体过程的定义是复杂的，并可能取决于所需的应用或监测对象。该过程将是 MS 的最高级别，如表 1 所示。y 轴执行从 300\
    \ mm 到 2400 mm 并返回的行程，从而代表一个完整周期。因此，总行程可以分为几个子阶段，这些子阶段可以被视为离散 MS。这些“子 MS”可根据动态参数的变化进行识别，如表\
    \ 2 所述。为了相互区分，每个子 MS 都由取决于动态参数水平的数值描述 (表 2，左侧)。也可以构思替代标识。但是，基于水平的引入描述将物理参数直接与子\
    \ MS 关联。\n"
