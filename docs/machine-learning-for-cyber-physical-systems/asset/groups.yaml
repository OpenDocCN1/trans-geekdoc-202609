    \ 等待时进行切换。通常从 GMEM 加载数据需要几百个 GPU 周期，因此延迟隐藏对性能至关重要。要实现延迟隐藏，GPU 内核必须保持足够的可用 warp，并且\
    \ GPU 能够在加载数据时在上下文之间切换。\n\nGPU 上可用 warp 的数量由利用率描述。利用率受可用 SMEM 和 GPU 内核本身使用的寄存器\
    \ (REG) 数量的限制。基于这些资源，可以计算可实现利用率的上限。资源消耗和最大利用率可以通过分析内核源代码来确定 - 类似的方法可以在 [2] 中找到。需要注意的是，所呈现的工作以每个流式多处理器\
    \ (SM) 的 warp 数量来衡量利用率。GPU 在 warp 中调度所有内容，因此这似乎是一种合理的方法。此外，我们强制 SMEM 和 REG 具有相似的利用率水平。此约束避免了大量利用一种资源而几乎不利用另一种资源的参数组合。由于\
    \ REG 而利用率严重受限的参数组合性能较差，那些由于 SMEM 而利用率严重受限的参数组合也是如此。那些由于 SMEM 而利用率严重受限的参数组合，对于其所实现的利用率而言，保留的结果矩阵条目较少。因此，数据必须比必要时更频繁地从\
    \ GMEM 加载。受 REG 高度限制的参数组合，为了获得更快的运行时间，保留更少的待读取数据。因此，它们必须更频繁地加载和等待。\n\n## efficiency\
