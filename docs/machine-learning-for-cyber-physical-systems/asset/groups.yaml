    that it can be applied as flexible order dispatching control that continuously
    learns the optimal behavior. Fig. 3 shows the development of the reward signal
    starting from the initial state where the agent’s behavior is completely random.
    The agent successfully learns a high performance behavior, however not losing
    the desired flexible behavior. The reward fluctuation points out that the agent
    is adaptive enough to react to changing conditions of the production system (e.g.
    disturbances, demand fluctuations). The benchmark FIFO-heuristic approach is based
    on a set of if-then-rules, e.g. “take the longest waiting batch next” and “first
    dispatch all batches in one area and move to another area afterwards” (to minimize
    time consuming area changes). According to Fig. 3 the RL-based algorithm yields
    a superior performance behavior. After the first iterations the utilization drops
    to a bottom value. In the end, an overall machine utilization of above 90% is
    achieved, comparing to a utilization of far below 90% for the heuristic. The same
    applies for the TPT. Moreover, the heuristic results show an almost stable performance
    that is not able to adapt to changing conditions. [15]


    ![](img/a2f5eed6507498d886a06be86239344b_136_0.png)


    Fig. 3. Reward signal (left), utilization (middle) and throughput time (right);
    moving average values for 1000 iterations


    # 4.3 Intelligent maintenance management


    The aim of the maintenance approach presented in this paper is to predict machine
    failures and based on this prediction perform the most appropriate maintenance
    action at the optimal time, which is characterized by a low load of incoming orders,
    i.e. when the opportunity cost of maintenance are low.


    The above presented use case is abstracted and considered as a system that consists
    of a set of parallel machines, each with a buffer, which receives the orders according
    to the dispatching. A machine then processes the available orders. The state of
    each machine is monitored and the state directly affects the performance of the
    machine, e.g. the operating speed is linked to the achieved output and in case
    of a failure the machine might only run at a low speed. Initially, the machines
    operate in a normal mode, where the performance is on the highest level. Each
    machine fails stochastically. If a critical, failure-initiating value is exceeded,
    a malfunction begins that ends with the failure after'
