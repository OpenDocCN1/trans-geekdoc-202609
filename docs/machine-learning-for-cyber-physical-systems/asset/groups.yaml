    \ | 0.05 | 0.55 | 0.95 |\n| 6.1 Jerk | 1 | 1 | 1 | 1 | 1 | 1 | 1 | 1 | 1 |\n|\
    \ 7.1 Acceleration | 1 | 1 | 1 | 0.5 | 0.5 | 0 | 0.75 | 0.75 | 0.75 |\n| 8.1 Feed\
    \ rapid traverse | 1 | 1 | 1 | 0 | 0.67 | 0.83 | 0.67 | 1 | 1 |\n| 9.1 Temperature\
    \ of y2 ball-screw nut | 0 | 0.40 | 0.66 | 0.81 | 0.96 | 0.91 | 1 | 0.71 | 0.70\
    \ |\n\nTps can vary in a broad range, e.g. the current position of an axis or\
    \ the feed. A combination that doesn’t occur in practice – e.g. a stroke between\
    \ 0 and 1 mm for a given axis – is not detectable and therefore it does not increase\
    \ the complexity. However an axis stroke of 1000 mm could be divided from any\
    \ numerical integer between 2 and ∞ in principle. Thus it is still necessary to\
    \ have an upfront definition of TPs ranges. A practical solution for dynamic TPs\
    \ like the jerk, the acceleration or the feed consists in definition of altering-constrains\
    \ to intersect a MS in sub-phases.\n\nA MS is not a singular event but a process\
    \ which is characterized by a given timespan. Real-life processes of machine tools\
    \ are continuous and can be fragmented in several sub-phases by various measures.\
    \ An example would be a boring operation with a specific tool. Another one could\
    \ be the stroke of a single axis as depicted in Table 2 and Fig. 2.\n\nThe definition\
    \ of an overall process is complex and may vary depending on the desired application\
    \ or monitoring object. This process would be the highest level of a MS as depicted\
    \ in Table 1. The y-axis executes a stroke from 300 mm up to 2400 mm and back,\
    \ thereby representing a complete cycle. This overall stroke can consequently\
    \ be divided into several sub-phases which can be treated as discrete MS. These\
    \ “sub-MS” can be identified in dependence of the altering of dynamic parameters\
    \ as described in Table 2. To distinguish them from each other every sub-MS is\
    \ described by numerical values depending on the level of the dynamic parameter\
    \ (Table 2, left). Alternative identifications are also conceivable. However the\
    \ introduced description based on levels links physical parameters directly to\
    \ the sub-MSs.\n"
