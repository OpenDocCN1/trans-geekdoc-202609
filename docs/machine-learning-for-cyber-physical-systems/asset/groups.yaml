  - '[PAGE 71]


    These positive results should not hide the fact that a neural net application
    often needs more care and expenditure in its configuration than an explicit formulated
    algorithm. Neural nets always come along with the risk to learn hidden but unwanted
    rules by so called overfitting. In practice you can meet this by a number of arrangements.
    Carfully choosen architecture details, e.g. for the variational autoencoder used
    for this project the count of hidden nodes is set higher than the count of input/output
    nodes. This helps a lot against overfitting. Furthermore you can use so called
    data augmentation techniques, if the training data set is not divers enough or
    too small. To be sure that the DNN learns the concrete paths of the training data
    as normal, we cut the complete movement paths into pieces and create the training
    set with an random sequence of these pieces.


    If the configuration is such sensitive, why to use a neural net et all? The overrun
    of the cable channel produces a time window with spikes. With a simple threshold
    spike detector anomaly detection could be achieved with less effort. Furthermore,
    this could have the additional advantage that the time threshold for spiky data
    considered as anomalous, can be defined explicitly, so that the concrete mobile
    platform is meaningful affected. If only 1D acceleration data is available this
    can be the better approach.


    However, if multichannel data is available e.g. from multiple 3d-acceleration
    and other sensors in combination and if the algorithm should be robust against
    single sensor dropouts, the DNN approach is more flexible. It is much easier to
    train a DNN with a different sensor configuration than to adjust thresholds for
    multiple sensors and to implement a configuration specific logic to make the system
    robust against dropouts.


    The failure of our convolutional layer approach seems to be caused by a too small
    training data set.


    # 7 Conclusion and Future Work


    The DL4J and its VAE implementation has proved in our project as a production
    ready framework for anomaly detection in mobile platforms acceleration data. This
    motivates to implement the newer so called variational recurrent autoencoder (VRAE)
    [10] based on DL4J. The VRAE extends the VAE and takes into account the dynamic
    temporal behaviour from the scratch.


    The next step is to establish a multichannel approach with three or more 3D acceleration
    sensors and an optimization of the hyper parameters. For this purpose the DL4J
    provides the the promising so called Arbiter API.


