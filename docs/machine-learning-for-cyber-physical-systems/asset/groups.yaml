    determine the new policy: (i) value-based and (ii) policy-based approaches. The
    main difference between both approaches is that value approximation learns the
    action-value function during the interaction instead of directly learning a policy
    \(\pi\). The value function \(q_\pi(s,a)\) defines the expected long-term return
    when choosing an action \(a\) in state \(s\) following policy \(\pi\). The policy
    is then derived from the estimated value of all possible actions in each state.
    Policy approximation, on the other hand, directly updates the policy function
    \(\pi_t = \pi_t(a|s)\).


    Most real-world problems deal with continuous action and state spaces. Storing
    and updating the policy or value function in a table is therefore computationally
    inefficient and requires lots of memory space. One possibility is to store the
    original policy or value function approximatively. Artificial neural networks
    are widely used for that purpose, as they are capable of approximating complex
    functional relationships via multiple weights connecting the neurons within the
    network and allow the adaption of those weights dynamically during the learning
    process [11]. As a result, neural networks reduce the computational effort by
    updating a set of weight parameters instead of the values for each state-action
    pair in each iteration. A dense fully connected feed-forward network is considered
    in this paper.


    Depending on the dimension and the characteristics of the problem, different learning
    approaches lead to good results. In recent years, new kinds of RL algorithms such
    as PPO [12], TRPO [13] and DQN [14] were developed to deal with complex problems
    in different domains. They can be regarded as advanced policy or value approximation
    algorithms that are optimized with regard to an efficient and stable learning
    process. The results of this paper are based on these RL algorithms.


    # ## 4 Case study and experiment results


    # ### 4.1 Case study setup and description


    The considered production system is the production area for wafer implantation.
    The layout of the production area is illustrated in Fig 2. It consists of three
    sections with in total eight machines and one entrance and exit lift per section.
    Regardless of the sections, the machines are grouped according to the principle
    of job shop production, which can perform the same processing steps. Processing
    begins with incoming orders at the lifts and the distribution to the respective,
    pre-defined machines and ends after the order has been processed on the machine
    and is transported back to the lift. When unloading orders from the lift, access
    to the first element is always possible. One worker does the transportation between
    the resources manually. The worker receives the information which order to transport
    from a central control system. Intermediate storage does not exist, however the
    machines have a limited buffer in which order batches can be stored before and
    after processing. The unprocessed batches in the input buffer are automatically
    fed by the machine according to the FIFO principle and, after complete processing,
    automatically put into the output buffer.


    For this real-world system, a virtual simulation model has been implemented to
    derive the computational results and evaluate the performance of the RL algorithm.
