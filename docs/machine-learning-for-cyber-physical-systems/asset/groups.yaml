    like Matlab or RapidMiner and “open source platforms” like Python and R. Data
    Science and Machine Learning platforms are characterized by easy handling and
    fast model development [8]. Nevertheless, operating the platform can result in
    high licensing costs [9]. Open source platforms like Python and R play an increasingly
    important role in the data science market because they are free of charge and
    are the most common programming languages for ML-implementation [8]. We decided
    to use the “open source platform” Python because the libraries that can be called,
    such as TensorFlow and scikit-learn, are undergoing strong development. The algorithm
    is implemented in Python by calling the decision tree algorithm via the scikit-learn
    library. Scikit-learn uses an optimized version of the CART algorithm [10].


    To achieve better performances of the ML-algorithm, hyperparameter must be set.
    Hyperparameters are the configuration that is external to the model and whose
    values cannot be estimated from the data set [11]. They are initially set when
    the algorithm is called by scikit-learn and need to be optimized. Hyperparameters
    of the decision tree algorithm are e.g. the maximum depth and the minimum size
    of the tree. There are different approaches to optimize hyperparameters. For this
    use case, the basic approach, called random search, is applied on the decision
    tree algorithm. Random search randomly selects any combination of the hyperparameters
    to be set within an interval of possible hyperparameters. If this combination
    of hyperparameters lead to better results, the parameters are updated. Basic approaches
    to set and tune hyperparameters are grid-search and random-search. Over the last
    years, other tuning approaches like Bayesian Optimization and Gradient Descent
