    \ GPU 在处理 GEMM 操作时的能效。\n\n大部分提出的最先进的工作都基于暴力方法来确定最优 GEMM 内核参数。这通常会导致巨大的参数搜索空间，因此大多数方法都采用参数组合预消除步骤来减少计算开销。用于减少搜索空间的不同启发式方法可能会排除掉最优内核参数组合。鉴于这些假设，所提出的工作侧重于定义最优启发式方法以减少搜索空间，并结合模拟退火（SA）流程，以高效地找到性能最佳的\
    \ GEMM 内核参数。\n\n## 2 解决方案\n\n最优 GPU 内核参数在很大程度上依赖于底层 GPU 硬件架构、内存布局和输入数据大小。不同的设置会导致不同的最优参数组合。因此，寻找最优参数组合的搜索空间可能非常大。手动调整参数是不切实际的，因为需要针对每个\
    \ GPU 架构和每组输入数据大小重新进行。鉴于这些假设，在以下章节中，我们提出了一种针对基于 GPU 的 GEMM 算法的两步自动调优方法。在第一步中，通过多种启发式性能标准修剪内核参数搜索空间，为一组不同的用例保留性能良好的参数组合。在第二步中，基于修改后的模拟退火（SA）算法，对剩余的参数集进行进一步处理，以找出最佳内核参数组合，该组合针对\
    \ GPU 架构和任务特定的数据布局进行了优化。\n\n在以下章节中，提出的自动调优方法将进行介绍。在 2.1 节中，简要介绍了 MAGMA GEMM 内核；在\
    \ 2.2 节中，我们解释了开发的减少搜索空间的启发式方法，在 2.3 节中，介绍了 SA 方法。\n\n### 2.1 Magma GEMM Stencil\
    \ 结构\n\n所开发的自动调优方法基于广为人知的 MAGMA GEMM 内核。原始内核实现已在 [12] 中描述，并以广泛的 GPU 内核参数空间为特点。算法\
    \ 1 显示了内核的伪代码。内核具有 11 个参数——其中两个内核参数仅与复数空间中的计算相关。因此，内核参数空间被减少到九个相关的内核参数——这些参数如下所述：\n\
    \n- **块大小**：块大小 BLK\\_M、BLK\\_N 和 BLK\\_K 定义了线程块将计算多少个元素。\n- **线程块维度**：线程块维度 DIM\\\
    _X 和 DIM\\_Y 决定了线程块的大小，该线程块在结果矩阵上计算一个块。\n- **子维度**：子维度 DIM\\_XA、DIM\\_XB、DIM\\\
    _YA 和 DIM\\_YB 决定共享内存（SMEM）的填充方式。\n\n### 算法 1：GEMM 内核算法（简化）\n\n```\nData: Matrix\
    \ A [M x K], Matrix B [K x N], Matrix C [M x N], alpha,\nbeta\nResult: C=A x B\
    \ * alpha C + beta * B\nload $A_t$ and $B_t$ to SMEM;\nfor $i \\leftarrow 0$ to\
    \ $K step BLK\\_K$ do\n  $A_{t+1}$ and $B_{t+1}$ to regs;\n  for $i \\leftarrow\
    \ 0$ to $BLK\\_K$ do\n    load $A_t$ and $B_t$ to REG;\n    $C_{temp}=A_t * B_t$\n\
    \  load $A_{t+1}$ and $B_{t+1}$ to SMEM;\nC = $C_{temp}$ * alpha + beta\n```\n\
    \n### 2.2 减少搜索空间\n\n为了在第一步中减少寻找最优内核参数集的搜索时间，有必要消除那些相对于底层 GPU 硬件布局不可能且可能导致内核执行行为不稳定的参数集。以下参数进行了削减：\n\
    \n- **预限制**：我们首先削减了可行的线程数，即线程块维度。线程块维度（DIM\\_X、DIM\\_Y）只能是 8、16 或 32，从而产生 64、256、512\
    \ 或 1024 个线程。GPU 制造商 NVIDIA 建议至少使用 64 个线程 [20]，这是我们应用的下限，上限由 GPU 的硬件规范给出。其他配置将无法映射到\
    \ GPU 硬件。\n\n"
