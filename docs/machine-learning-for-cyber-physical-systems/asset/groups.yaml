    If the lowest possible level is defined by the direction of the jerk, a maximum
    of 50 sub-phases can be identified based on path dynamics. We divide the overall
    stroke in 12 sub-phases based on the identification levels 1-3 of Table 2 for
    demonstration purposes as depicted in Fig. 2. Practically other TPs like the dynamic
    path of a second axis as well as process parameters could also vary in parallel.


    ![](img/a2f5eed6507498d886a06be86239344b_17_0.png)


    Fig. 2. Test cycle used in [8] including sub-phases of MSs


    Obviously the auto-detection of any possible MS based on time-dependent changes
    of any considered TP is not a practicable solution. Therefore a parallelization
    approach is suggested, where MPs based on different TPs for different sub-phases
    – down until the level where the TPs still vary – are created, CVs derived and
    correlation analyses between MSs and TPs carried out. This overall approach is
    depicted in Fig. 3.


    ![](img/a2f5eed6507498d886a06be86239344b_18_0.png)


    Fig. 3. Suggested approach for automatic MS- and TP reduction


    ## 3 Regression analysis for correlation-based machine state and parameter reduction


    The fuzzy clustering of MSs, as presented in [8] can be exercised without any
    consideration of possible correlations between TPs and CVs. This is possible for
    a limited number of pre-defined MSs based on practical considerations about components
    of interest and – heuristically anticipated – correlations between CVs and TPs.
    If a broad range of TPs is combined with a variable resolution of TP sections
    as well as time spans the clustering of all combinations – for every CV – becomes
    unpractical, statistically challenging and the information content decays. Therefore
    a reduction of significant MS and TPs for these states is necessary. This task
    can be addressed by the usage of an artificial neural network (ANN), but the robustness
    and accuracy of such depends heavily on the quantity of training data. This means
    that every relevant MS has to occur several times before the ANN can play off
    its strength. This is not a given in non-serial machine tool applications as described
    in section 1.


    For this purpose, regression analysis between the TPs and the CVs can be employed
    as suggested in this paper. Based on the introduced cycle, a regression analysis
    was carried out. The input variables (TPs) and the responses (CVs) used in the
    regression analysis are shown in Table 8. This includes all varying parameters
    of the MS. The considered MS regression analysis does not aim to a quantification
    of the regression function between the input variables and the responses but it
    should statistical validate the significance of the input variables (for more
    detail see [9]). Thus, a linear function without any interactions is chosen for
    the regression analysis.


    Table 3. Defined input variables and responses in the regression analysis


    | Input variables = TPs | Responses = CVs |

    |---|---|

    | z-position | Effective vibration level |

    | Acceleration | Frequency of the highest peak |

    | Feed rapid traverse | |

    | Temperature of the ball-screw nut | |


    The included MSs are 10 sub-phases of Fig. 2 for every TP-combination of Table
    1. Sub-phases 113 and 213 (Fig. 2) are not considered due to their corrupted measurement
    data. It should be noted the TPs 4.1 and 4.2 vary in accordance to the sub-phases.
    Therefore 90 different – but related – MS are taken into account.


    ## 4 Practical example


    The test cycle of Fig. 2 was derived for the 9 MS in Table 1 (Fig. 4). 51 cycles
    were successively executed for each MS, resulting in an overall time of 2550s.
    Every cycle includes all sub-phase (“sub-MS”) of Fig. 2.


    ![](img/a2f5eed6507498d886a06be86239344b_19_0.png)


    Fig. 4. UNION PCR130 machine; y- and z-axis used for the test cycles


    Based on these cycles, a linear regression analyses was derived for the sub-phases
    using the commercial software Cornerstone®. The aim of the regression analyses
    is not to derive a quantitative model with the aim to predict the CVs based on
    the TPs. The data available is not sufficient for such a purpose. The regression
    model is only linear and not representative for the TPs as well as the CVs overall
    range. However, the regression analysis deducts significance terms for every input-parameter
    (= TP), therefore distinguishing the relevant TPs for a given CV (responses in
    Table 4) from the irrelevant ones. Furthermore, when comparing the significance
    terms of the TPs with the adjusted R-Square value of the correlation analysis
    we obtain an assessment to define adequate sub-phases. Additionally the correlation
    between the significant TPs (Covariance matrix) is checked to exclude TPs with
    high covariances. For example the temperature has an even higher significance-term
    in sub-phase 112 than the feed. However the Covariance matrix indicates that the
    temperature is highly correlated to the Temperature (-0,9861) and should therefore
    excluded for the subsequent clustering for the CV fmax. Successively the number
    of relevant MSs is significantly reduced. The number of relevant TPs is simultaneously
    reduced. Table 4 depicts the overall result for all 10 sub-phases and 4 inputs,
