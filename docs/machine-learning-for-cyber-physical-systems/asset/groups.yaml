  - '[PAGE 5]


    # Preface


    Cyber Physical Systems are characterized by their ability to adapt and to learn.
    They analyze their environment, learn patterns, and they are able to generate
    predictions. Typical applications are condition monitoring, predictive maintenance,
    image processing and diagnosis. Machine Learning is the key technology for these
    developments.


    The fourth conference on Machine Learning for Cyber-Physical-Systems and Industry
    4.0 - ML4CPS - was held at the Fraunhofer IOSB in Karlsruhe, on October 23.$^{rd}$
    and 24.$^{th}$ 2018. The aim of the conference is to provide a forum to present
    new approaches, discuss experiences and to develop visions in the area of data
    analysis for cyber-physical systems. This book provides the proceedings of selected
    contributions presented at the ML4CPS 2018.


    The editors would like to thank all contributors that led to a pleasant and rewarding
    conference. Additionally, the editors would like to thank all reviewers for sharing
    their time and expertise with the authors. It is hoped that these proceedings
    will form a valuable addition to the scientific and developmental knowledge in
    the research fields of machine learning, information fusion, system technologies
    and industry 4.0.


    Prof. Dr.-Ing. Jürgen Beyerer

    Dr.-Ing. Christian Kühnert

    Prof. Dr.-Ing. Oliver Niggemann'
