    and present a container-based system architecture. Furthermore, we share the experience
    of our development process to bring industrial analytics solutions from idea to
    production. Based on that process, we present a suitable CI/CD pipeline, which
    supports our development team to easily bring a machine learning model from the
    proof of concept phase to production.


