    This paper presents a generic platform for data analysis with a focus on data-driven
    condition-monitoring in water distribution. Therefore, a plugin based software
    architecture is proposed, which can be used to collect data from different sources,
    treat data with different analysis algorithms and provide the results by a web-based
    user interface. Due to the plugin structure, the platform provides a large flexibility
    and can be adapted for very complex scenarios. For data analyses, a data-driven
    condition-monitoring approach based on a combination of Principal Component Analysis
    and Gaussian Mixture Models was realized. Within this approach, the original input
    data is reduced down to two dimension to generate a map of the process. Next,
    this map is used in combination with the calculated process trajectory to visualize
    if the process is close to a cluster center, meaning in a normal state. Furthermore,
    an anomaly index is calculated, which defines if the process is in normal or abnormal
    state. As a use-case, the results of the monitoring of the water quality parameters
    in the city of Berlin has been presented.


