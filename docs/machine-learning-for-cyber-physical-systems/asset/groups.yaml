    ## Selection and Application of Machine Learning-Algorithms in Production Quality


    Jonathan Krauß¹, Maik Frye¹, Gustavo Teodoro Döhler Beck¹, Robert H. Schmitt²

    ¹Fraunhofer Institute for Production Technology IPT

    Steinbachstr. 17, Aachen 52074, Germany

    {jonathan.krauss,maik.frye,gustavo.döhler.beck}@ipt.fraunhofer.de

    ²Laboratory for Machine Tools WZL RWTH Aachen University

    Steinbachstr. 19, Aachen 52074, Germany

    robert.schmitt@rwth-aachen.de


    Abstract. Due to the increase in digitalization Machine Learning (ML)-algorithms
    bare high potentials for process optimization in the production quality-domain.
    Nowadays, ML-algorithms are hardly implemented in the production environment.
    In this paper, we present a tangible use case in which ML-algorithms are applied
    for predicting the quality of products in a process chain and present the lessons
    learned we extracted from the application. In the described project, the process
    of choosing ML-algorithms was a bottleneck. Therefore we describe a promising
    approach how a decision making tool can help selecting ML-algorithms problem-specifically.


    ### 1 Data-Driven Modeling in the Production Quality


    Digitalization has led to a steady increase in data in recent years. Through higher
    computing power, it is possible to process the large amount of data [1]. Analyzing
    the acquired data can enhance both the understanding and the process efficiency
    - or to describe it in the words of Peter Sondergaard: “Information is the oil
    of the 21st century, and analytics is the combustion engine” [2]. Especially sectors
    like the financing-domain or the marketing-domain are leading when it comes to
    generate value from data [3]. In particular, the use of Machine Learning (ML)-algorithms
    increased over the last decade. The main reasons for this trend, apart from the
    higher computing power and data input mentioned above, are the increasing reliability
    of the algorithms, the simpler implementation of the algorithms as well as the
    easier data acquisition. [1]


    Even though the application of ML-algorithms is well established in other domains,
    it is not common in the context of production quality. For process optimization
    in the production quality-domain, physically based modeling (PBM) is commonly
    used. While PBM offers the advantage of describing the current and future state
    of a system by physical dependencies, data-driven models use the information from
    observed data to identify current system characteristics and to predict the future
    state without requiring a deeper understanding of the physical interdependencies
    of the process. [4] The development of data-driven models thus shows a high potential
    for even further optimization of production processes. In the presented case we
    chose to transform the data into a data-driven model by applying ML-algorithms.

