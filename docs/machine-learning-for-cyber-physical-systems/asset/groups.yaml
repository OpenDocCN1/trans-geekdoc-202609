    # 4 Conclusion


    The computational throughput of Machine Learning algorithms is limited by the
    available computational power of the underlying hardware. Most of the computation
    power in DLNN is consumed by the convolution step, which is based on a general
    matrix multiplication (GEMM). To accelerate the computational time in Machine
    Learning applications different highly optimized GEMM implementations for GPUs
    have been presented in the last years - usually these software libraries have
    been optimized for a specific GPU version and a specific layout of the data to
    be processed.


    In order to achieve a maximum performance the kernel parameters of the GEMM algorithm
    have to be tuned hardware and learning task specific. With respect to these suppositions,
    we have presented a two-step autotuning approach for GPU-based GEMM algorithms:
    In the first step, the kernel parameter search space is pruned by analysing the
    kernel source code with several developed performance metrics. In the second step
    a modified Simulated Annealing algorithm is utilized, which enables a fast searching
    process for performance optimal kernel parameters, while maintaining search runtimes
    lower than state of the art brute-force implementations. We have shown that the
    proposed approach for autotuning MAGMA-GEMM kernels yields high performance and
    adapts to the GPU hardware and the data layout. Our results have been carried
    out base on 160 different input problems - we get an average speed up against
    the state of the art GEMM implementation from NVIDIA (cuBLAS) from around 12 on
    Pascal based NVIDIA accelerator cards. The key concepts of this contribution can
    be generalized, to autotune the kernel parameters of other performance sensitive
    GPU kernels.


