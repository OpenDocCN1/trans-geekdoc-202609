    并且，基尼不纯度（Gini impurity）也用于评估分割质量。学习率（learning rate）会降低集成中单个分类器的贡献。我们使用默认的提升算法（SAMME.R），其目标是比其他选项收敛得更快。


    人工神经网络（ANN）（也称为多层感知机 - MLP - 分类器）使用自适应学习率，这意味着如果在连续两次运行中训练损失不下降，则学习率会降低（除以五）。参数
    alpha 表示 L2 惩罚（即，岭惩罚）的正则化。该值高于默认值，意味着更小的系数（权重）。隐藏层上的参数定义了隐藏层的数量（在我们的情况中为五层）以及每一层中的节点（神经元）数量。


    对于支持向量机（SVM）（或支持向量分类器），我们使用 rbf（径向基函数）内核。（rbf 内核使用平方欧氏距离作为数据（点）分离的度量。gamma 系数设置为
    auto，这意味着 1 与特征数量（n）的商。错误的惩罚参数（C）为 5。该参数在训练错误与测试错误之间取得平衡，即，它影响分类器对未见数据的泛化能力。）


