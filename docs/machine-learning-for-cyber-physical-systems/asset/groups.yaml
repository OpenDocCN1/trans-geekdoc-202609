    extended by contains several extensions like Partial Transfer Entropy [11] or
    Symbolic Entropy [13]. Bauer [2] proposes a Nearest-Neighbor approach for cause-effect
    analysis. In [12] different methods for the detection of significant directed
    influences were developed and compared on several benchmarks, consisting of simulated
    dynamic systems data, biosignals and on disturbances from a glass forming process.
    Kaminski [10] proposes the estimation of directed transfer functions.


    This aim of this paper to investigate under which circumstances it is possible
    to detect directed influences in measurements, depending on the excitation signal
    as well as the underlying dynamic systems. As specific detection method Spectral
    Granger Causality [7] is used, which is extended with a surrogate-based significance
    test. In difference to [12], which already defines benchmark processes for the
    detection of causal dependencies, the current paper focuses more on the excitation
    signal characteristics.


    The paper is structured as follows: Section 2 introduces how directed connectivities
    can be detected in time series and how Spectral Granger Causality is applied.
    Additionally, the surrogate-based calculation of the significance threshold is
    explained. Section 3 describes the defined input signals and dynamic systems for
    benchmarking, while section 4 discusses the results. Finally, section 5 gives
    a summary and some ideas for future research.


    # ## 2 Detecting directed connectivities in time series


    # ### 2.1 Bivariate Spectral Granger Causality


    The concept of Granger causality (GC) has been originally introduced in the field
    of economics by Clive Granger in 1969 [8] who used it to determine the relationships
    of different econometric models. The basic concept of bivariate GC can be explained
    by assuming the two time series \(u[k] \in \mathbb{R}\) and \(y[k] \in \mathbb{R}\)
    with \(k = 1, \dots, K\) samples. In that case, the causal connectivity \(u \to
    y\) is assumed to exist if past values from \(u[k]\) and \(y[k]\) result in a
    higher forecast accuracy for \(y[k]\) than using only past values from \(y[k]\).
    Mathematically, this is evaluated by comparing two linear vector autoregressive
    models, while the first one only contains past values of \(y[k]\), called the
    restricted model, and the other one containing past values of \(u[k]\) and \(y[k]\),
    called the unrestricted model. Furthermore, Granger Causality can be easily extended
    into the multivariate case, while good explanations can be found e.g. in [16]
    or [4]. Since the developed benchmarks in section 3 compare always one input against
    one output, for simplicity, multivariate GC will not be explained in this paper.


    **GC in the time domain:** Checking if \(u\) causes \(y\) or \(y\) causes \(u\),
    is in the time domain is done by comparing two linear vector autoregressive (VAR)
    models.'
