  - '[PAGE 2]


    Ziel der Buchreihe ist die Publikation neuer Ansätze in der Automation auf wissenschaftlichem
    Niveau, Themen, die heute und in Zukunft entscheidend sind, für die deutsche und
    internationale Industrie und Forschung. Initiativen wie Industrie 4.0, Industrial
    Internet oder Cyber-physical Systems machen dies deutlich. Die Anwendbarkeit und
    der industrielle Nutzen als durchgehendes Leitmotiv der Veröffentlichungen stehen
    dabei im Vordergrund. Durch diese Verankerung in der Praxis wird sowohl die Verständlichkeit
    als auch die Relevanz der Beiträge für die Industrie und für die angewandte Forschung
    gesichert. Diese Buchreihe möchte Lesern eine Orientierung für die neuen Technologien
    und deren Anwendungen geben und so zur erfolgreichen Umsetzung der Initiativen
    beitragen.


    Weitere Bände in der Reihe http://www.springer.com/series/13886'
