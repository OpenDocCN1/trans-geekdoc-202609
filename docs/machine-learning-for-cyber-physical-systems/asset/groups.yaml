    随机森林分类器通过使用 5 折交叉验证（带有参数备选项的网格搜索）进行设置，以找到最佳参数组合（例如，叶子节点中的最小样本数）。我们需要非常深的树（不设置深度限制）以及节点中非常低的分割率（使用三个样本分割时效果最佳）。平均树深度为
    51。另一个有趣的发现是精确率和召回率之间的差距。虽然精确率约为 0.74，但召回率最终为 0.4（F1 分数为 0.52）。


    图 4 描绘了随机森林分类器的 ROC 曲线（接收者操作特征曲线）。真阳性率（即召回率，也称为灵敏度）显示在 y 轴上，x 轴显示假阳性率。


