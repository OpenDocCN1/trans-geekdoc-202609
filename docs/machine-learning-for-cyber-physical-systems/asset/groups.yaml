    ### 3.1 Data Preparation


    The open source statistical programming tool R [8,9] was used to evaluate the
    data generated by AutoForm. The aim of this study was to find an appropriate ML
    model to describe the relationship between the input and output parameters. Upper
    and lower boundaries for the allowed input parameter variations are defined as
    stated in Table 1. Boundaries for the quality criteria have to be defined as well.
    These depend on the type of component that is produced. The focus can be on maximum
    component hardness or for example on the maximum thickness of the finished component.
    As we focus on a part from the automotive industry we want to maximize/increase
    both, the sheet thickness and hardness at critical points which are prone to tearing.
    Thus, no upper boundaries for P1H and P2ST were defined.


