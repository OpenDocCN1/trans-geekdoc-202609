    1）未被检测到。原因在于低通滤波器衰减过大，导致输出信号在过去值中已经包含了太多关于自身的信息。因此，从格兰杰因果性角度来看，这对 \(u_{rw}\) 来说并未带来显著的信息增益。唯一导致从
    \(y \to u\) 产生连通性的激励信号是正弦波。与死时基准测试一样，原因在于正弦波是周期性的。


    **非线性系统:** 在先前基准测试的低通滤波器中添加一个额外的正弦波作为非线性，显著改变了检测到的定向影响的结果。\(u_{wn}\) 不再检测 \(u
    \to y\) 的连通性，而 \(u_{rw}\) 检测到了它。两个激励信号 \(u_{sin}\) 和 \(u_{imp}\) 的表现与无非线性时相似。关于错误的定向因果影响
    \(y \to u\)，激励信号 \(u_{wn}\)、\(u_{st}\) 和 \(u_{rw}\) 检测到了该影响。只有 \(u_{sin}\) 和 \(u_{imp}\)
    正确地将该影响定义为不显著。


    **共振:** 在弹簧-质量-阻尼器基准测试中，检测 \(u \to y\) 只能使用 \(u_{wn}\)、\(u_{sin}\) 和 \(u_{rw}\)
    实现。当使用 \(u_{imp}\) 和 \(u_{st}\) 作为激励信号时，频谱格兰杰因果性假定既不存在 \(u \to y\) 的定向影响，也不存在
    \(y \to u\) 的定向影响。此外，除了 \(u_{rw}\) 之外，没有激励信号检测到错误的因果影响 \(y \to u\)。


    ## 5 总结


    结果表明，使用频谱格兰杰因果性时，时间序列中定向影响的检测既取决于激励信号，也取决于基础动态系统。关于激励信号，对于任何信号都无法在检测所有四个动态系统的正确定向影响
    \(u \to y\) 的同时，从不检测错误的影响 \(y \to u\)。因此，在使用格兰杰因果性时，无论检测到还是未检测到数据中的定向影响，都必须结合激励信号和基础过程行为进行质疑。尽管如此，该方法仍能极大地帮助生成对数据集中变量之间影响的初步理解，因为格兰杰因果性并非总是，但大多数时候检测到了正确的依赖关系。在基准测试开发方面，有多项未来研究可供开展。产生的问题包括：数据中噪声的影响，以及当变量具有共同原因时，如何仍能检测到定向影响。关于格兰杰因果性，可以评估在哪些情况下可以区分直接影响和间接影响，例如使用多变量格兰杰因果性时。此外，应使用基准测试来比较多种方法，如传递熵及其扩展或定向传递函数的估计。


    ## 6 致谢


    本工作在弗劳恩霍夫卓越集群“认知互联网技术”中开发。


