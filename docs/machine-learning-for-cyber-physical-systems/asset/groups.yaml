    有效振动水平（Peff）的回归质量在更多子阶段中显著，因此比球丝杠（Y2）螺母的球通过频率（fmax）更通用。


    因此，自动检测机制将选择子阶段112和212作为监测最相关的阶段。关于CVs，温度仍然是有效振动水平唯一相关的TP，而进给仍然是球丝杠螺母外圈频率唯一相关的TP。


    ## 5 基于聚类的机床特性推断


    聚类仅基于第4节所述的每个CV的两个相关TP进行。算法在[8]中详细描述，基于[9]。每个MS逐渐归属到聚类中心。相关TP 8.1和9.1不随子阶段变化，因此聚类仅取决于9个MS的（平均）TP。我们得到TP
    8.1（快速进给）的聚类中心为0.71/0.99/0.00，分别得到TP 9.1（Y2球丝杠螺母温度）的聚类中心为0.09/0.92/0.64。表5描绘了每个MS的TP值及其隶属率。


    表5. 所有MS的每个聚类的归一化TP和隶属率；优化周期n_opt = 100；模糊化因子w = 1.5


    | 机床状态 | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 | 9 |

    |---|---|---|---|---|---|---|---|---|---|

    | 相关TPs | | | | | | | | | |

    | 8.1 快速进给（针对CV2） | 1 | 1 | 1 | 0 | 0.67 | 0.83 | 0.67 | 1 | 1 |

    | 9.1 Y2球丝杠螺母温度（针对CV1） | 0 | 0.40 | 0.66 | 0.81 | 0.96 | 0.91 | 1 | 0.71 | 0.70
    |

    | 聚类 | | 每个聚类的隶属率 | | | | | | | |

    | 1 | TP 8.1 | 1 | 0 | 0 | 0 | 1 | 0.732 | 1 | 0 | 0 |

    | | TP 9.1 | 1 | 0.273 | 0 | 0 | 0 | 0 | 0 | 0 | 0 |

    | 2 | TP 8.1 | 0 | 1 | 1 | 0 | 0 | 0.268 | 0 | 1 | 1 |

    | | TP 9.1 | 0 | 0.034 | 0 | 0.857 | 1 | 1 | 0.997 | 0.013 | 0.06 |

