    | 使用类型 | 一次性使用（培训、教育等） | 选择性使用 | | 定期使用 |

    | 数据传输 | 本地通过电缆 | 通过私有网络无线 | | 通过公共网络无线 |

    | 人机交互 | 单模式 | | | 多模式 |

    | 交互类型 | 单向对话（无交互可能性） | | 对话式 | 通信（例如通过聊天功能） |

    | 提供的支持 | 信息 | 指令 | 干预 | 文档 |

