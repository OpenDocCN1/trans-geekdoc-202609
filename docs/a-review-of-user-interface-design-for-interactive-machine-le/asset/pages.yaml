  md: 'fact that the benefit of Interactive Machine Learning is observable in situations
    where the precise design objectives of the user are unclear and/or data labels
    cannot be obtained *a priori*.


    More recent work extends the application of the interactive component beyond just
    review and correction of classifier errors to other stages of the model construction
    exercise, i.e. the choice of features, the choice of models, debugging and the
    evaluation of performance. In the context of this article, we refer to a *comprehensive*
    IML process as one in which the system delivers all of the necessary functionality
    to allow a user to configure then train a model on their data and deploy it in
    the target application (this full generalised workflow is described in detail
    in Section 5).


    During the iterative refinement stage, the user drives the IML process in a tightly
    coupled arrangement between human and machine. The key elements and flow of information
    under this methodology are illustrated in Figure 1. The user’s interaction may
    be viewed as a form of pseudo-programming in that the user builds functionality
    through demonstration and labelling samples rather than by directly writing code
    [Gillies et al. 2016]. As an interaction paradigm, Interactive Machine Learning
    exists at the overlap between computer-as-tool and computer-as-partner as described
    by Beaudouin-Lafon [2004]. An IML application certainly provides a tool in that
    it supports the user in building a model fit for their purposes. At the same time,
    the user and computer engage in an interaction that is a partnership where both
    sides must respond to input and to some extent, infer desired actions. The metaphor
    of moving an object with high and/or variable inertia along a desired trajectory
    provides a very high level interaction model for IML. This interaction model captures
    the fact that inputs may produce marginal or no response in the object and that
    a sequence of inputs is required to drive change.


    The Interactive Machine Learning approach is likely to see initial adoption at
    the two extremes of user-data interaction tasks: at the lower complexity end,
    users selecting examples of things that they do and do not like; and at the higher
    complexity end, users (and even developers) applying their domain expertise to
    refine a classifier or build some other intelligent functionality [Grose et al.
    2014].


    From a structural perspective, we separate an IML system into four key components:
    these are 1) the user; 2) the model; 3) the data; and 4) the interface. These
    components are summarised in Figure


    ![](img/17c50ccda69f2e1b79eba2e3563dce88_4_0.png)


    Fig. 1. The user plays a central role in Interactive Machine Learning by actively
    training the model in an iterative fashion. The user interface is a critical component
    of this interaction.'
