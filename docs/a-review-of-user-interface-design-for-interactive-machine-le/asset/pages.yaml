    # 2  CONTEXT AND DEFINITIONS


    This article examines Interactive Machine Learning from a user interface design
    perspective. Developing an effective IML system is an interdisciplinary effort
    that draws on both the machine learning and HCI domains. In order to meet the
    objectives of this article, we concentrate primarily on IML studies that present
    user evaluations and offer suggestions for design of the interaction component.
    Limited attention is given to the underlying technical requirements for the machine
    learning component of the system beyond their implications for user interaction.
    In this section we first seek to establish clear definitions for the terminology
    used throughout this article.


    # 2.1  Interactive Machine Learning Definition


    *Interactive Machine Learning* is an interaction paradigm in which a user or user
    group iteratively builds and refines a mathematical model to describe a concept
    through iterative cycles of input and review. Model refinement is driven by user
    input that may come in many forms, such as providing indicative samples, describing
    indicative features or otherwise selecting high-level model parameters. Interactive
    Machine Learning is distinct from classical machine learning in that human intelligence
    is applied through iterative teaching and model refinement in a relatively tight
    loop of “set-and-check”. In other words, the user provides additional information
    to the system to update the model and the change in the model is reviewed against
    the user’s design objective. Under this workflow, the change in the model at each
    iteration may be relatively small. This is in contrast to more traditional machine
    learning approaches where the workflow requires wholesale pre-selection of training
    data and significant changes in the model per execution step. Amershi et al. [2014]
    present a detailed discussion of the distinction between IML and classical machine
    learning as well as a series of cases studies that highlight the value of the
    technique. The IML process is characterised by the user being the principle driver
    of the interaction to deliver desired behaviour in the system. This does not mean
    that the computer has no influence on the process or does not make independent
    decisions. Indeed, the application may, for example, intelligently select a subset
    of data for review. The notion of the user being the principle driver is more
    reflected in the fact that the IML application seeks to provide the user with
    control over the high level behaviour of the system. This may or may not necessarily
    be exercised in each discrete interaction.


    Fails and Olsen [2003] introduced the concept of IML in the interactive image
    processing tool Crayons, as being chiefly focused on the review and correction
    of classifier errors. Crayons allows the user to draw directly on images to guide
    the training of an image classifier. The user reviews the current classifier performance
    based on its classification of image regions and provides more feedback by drawing
    on the image if necessary. ReGroup [Amershi et al. 2012] is a tool leveraging
    the Interactive Machine Learning paradigm to assist users in creating custom contact
    groups in a social network context. The system trains a model to classify contacts
    according to their likelihood of membership to the contact group being created.
    The system takes a selection of a contact for inclusion as a positive sample and
    the skipping of a contact in an ordered list as an implied negative sample. The
    user receives feedback in the form of an ordered list of suggested contacts after
    each selection. Just like Crayons, the user refines the behaviour of the model
    with incremental improvements derived through iteratively applied user input.


    The at-completion model behaviour in the Crayons and ReGroup systems described
    above could of course be replicated using a standard machine learning approach
    that takes the collection of user inputs as a batch of labelled data. However,
    in the applications discussed, it is the process of refining the model itself
    that helps elicit the user input. These two examples help highlight the'
