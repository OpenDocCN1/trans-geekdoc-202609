- pgno: 14
  md: '# 4.2 Feedback assignment


    The feedback assignment interface is the channel employed by the user to assign
    labels, select features and/or generate new samples. It is this interface that
    perhaps requires the most careful design in terms of both the interface elements
    and the interaction techniques provided. User interaction at the point of describing
    a classification or performing a demonstration can take many forms. Porter et
    al. [2013] make a useful distinction between training vocabulary and training
    dialog. Porter et al. suggest that the training vocabulary in IML has expanded
    from just being labels to include constraints and structures. Similarly, the training
    dialog is no longer exclusively a batch process but can be highly interactive
    and dynamic. Generally, the preference from the user’s point of view is for more
    complete and more specific feedback assignment methods. There is, however, an
    inevitable trade off as Hartmann et al. [2007] note in terms of balancing the
    desire for user control over behaviour versus overwhelming users with machine-centric
    ‘knobs’.


    BrainCel [Sarkar et al. 2015] obtains user input through standard spreadsheet
    paradigms while other studies have captured raw gestures inputs [Katan et al.
    2015], [Sarasua et al. 2016]. Kim et al. [2015a] found that users wish to describe
    high level attributes (such as code structure) that are difficult to encode as
    features. Constraining the labelling or demonstration process may have a filtering
    effect on the user’s intent which may ultimately be detrimental to user satisfaction
    and model quality. Similarly, subjecting users to poorly implemented or confusing
    interaction techniques is likely to degrade overall performance.


    One difficulty faced in the collection of input from users is the fact that the
    concept they are trying to train may shift over time [Kulesza et al. 2014]. This
    has motivated efforts to improve the structure and guidance provided around how
    people are requested for, and supply input. Rosenthal and Dey [2010] investigate
    what information can be provided to improve quality of labels (amounts of context,
    level of context, uncertainty, prediction, and requests for user feedback). Certain
    constructions can also make it more engaging for the user and promote higher quality
    input. For example, Huang et al. [2013] motivate users to fix errors in sentiment
    analysis of restaurant reviews by providing current predictions of the categories
    which their reviews cover.


    Shilman et al. [2006] introduce five design principles for correction interfaces:
    1) minimise decision points by choosing appropriate operators; 2) design seamless
    transitions between modes; 3) provide reachability of all states; 4) appropriately
    scope cascading changes; and 5) promote clear user models. Shilman et al. [2006]
    also summarise possible correction strategies: n-best selection, transformation,
    user-driven hints, and user-driven constraints.


    Amershi et al. [2012] note that the ability to model a concept is dependent upon
    the quality of the data. Various studies have sought novel methods for transforming
    both explicit and implicit user input into data for consumption by the learner.
    The system described in [Amershi et al. 2012] takes advantage of users skipping
    instances (contacts in a social network) as an indicator for labelling negative
    samples. Javdani et al. [2016] seek to make use of user resistance to robot actions
    under shared autonomy as a means for identifying undesirable actions. The potential
    for feature labelling rather than just instance labelling is also being exploited
    in IML studies (e.g. [Wong et al. 2011]) but does require that the learning algorithm
    can exploit these identified distinctions among features. In some applications,
    however, the features themselves may be too abstract for users to interpret or
    exploit effectively [Gillies et al. 2015a].


    # 4.3 Model inspection


    In addition to review of individual sample instances, a comprehensive IML process
    will typically also support some form of inspection at the model level. This summative
    view of model quality is referred to here as the model inspection interface. The
    assessment of model quality is not necessarily'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'limited to prediction accuracy, and may also incorporate other metrics such
    as coverage and confidence. Several studies have shown the potential for user
    interaction with parameters (e.g. [Kapoor et al. 2010]) and/or emergent structures
    (e.g. [Chang et al. 2016]) as part of the model inspection interface. GaussBox
    [Françoise et al. 2016] provides a tangible and interactive tool for inspecting
    HMMs trained for gesture recognition.


    The quality of predictions is ultimately dependent on the quality of the constructed
    model. Various sources of error may affect model quality. Amershi et al. [2015]
    identify three main causes of model errors: 1) mislabelled data; 2) feature deficiencies;
    and 3) insufficient data. Mislabelled data is data the user incorrectly assigned
    some value. Feature deficiency errors result when the model does not have sufficient
    samples of a given feature to make a distinction. Insufficient data errors result
    when there are gaps in the data in areas relevant to model prediction. A comprehensive
    model inspection interface should thus support the user in identifying such errors
    to facilitate debugging and improve model quality.


    Receiver Operating Characteristic (ROC) and cost curves are commonly used in the
    machine learning community to support evaluation of model performance, and have
    been incorporated into IML systems. Alternatively, model performance may be assessed
    in a more involved manner through targeted testing. Groce et al. [2014] suggest
    three requirements for test methods: algorithmic agnosticism, sufficiently fast
    to run in an interactive environment, and able to support effective detection
    of failures using comparatively small test suites. However, constructing tests
    to obtain an encompassing metric of model quality is not a simple task, especially
    for end users. Fleishman et al. [2011] highlight that evaluating based on training
    set partitioning may not be meaningful and end users in IML may be particularly
    ill suited to choosing a test set that represents anticipated future data.


    Recent work has given more attention to the quality assessment and debugging task
    in Interactive Machine Learning. While rapid visual inspection of model performance
    may be possible in certain applications, such as with image data, doing so with
    other data formats (e.g. documents) is more complicated. This difficulty grows
    with increasing dataset size. Amershi et al. [2015] present ModelTracker, a concise
    visual representation of model performance for use in debugging exercises. The
    representation allows for the rapid assessment of where labelled samples are correctly
    or incorrectly predicted and the relative confidence of that prediction.


    The model inspection interface provides user visibility of the global task, i.e.
    typically minimising prediction error. This interface allows users to apply strategies
    that iteratively work towards desired levels of model quality. We argue later,
    however, that framing task completion criteria purely in terms of model quality
    is undesirable. Focusing an end user on model prediction accuracy alone is likely
    to promote overfitting. For this reason, we make a distinction between the *model
    inspection* and *task overview* interfaces.


    # 4.4  **Task overview**


    A self-contained IML system may additionally require information advising the
    user on task status and termination conditions. In most experimental IML systems,
    this interface is not included as the interaction is managed through other means
    such as timed exercises or constrained datasets. In reality, however, there are
    non-trivial task related decisions that users require guidance on that may be
    independent of instantaneous model quality.


    Yimam et al. [2015] highlight the fact that a text classification system is likely
    to reach a point of diminishing returns for user annotations. Ghani and Kumar
    [2011] also argue for a distinction between system performance and classification
    accuracy. The task overview interface should provide visibility of the global
    objectives, but also contextualise these with other information relevant to the
    task such as the target application of the model and the availability of training
    data.'
  merge: -1
  img_proc: true
