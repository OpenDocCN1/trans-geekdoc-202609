  md: 'Making informed predictions represents a key challenge for Interactive Machine
    Learning. This is in contrast to more traditional programming tasks where systems
    are predictable and repeatable by nature. The uncertainty in the model is of fundamental
    interest to expert practitioners of machine learning. However, effectively interpreting
    model accuracy can be very difficult and a learnt skill in itself.


    # 6.3   Capture intent rather than input


    Careful design of the interface may help to extract user intent from potentially
    noisy input actions. This solution principle is a response to the challenge raised
    in Section 1 that there is uncertainty in the relationship between user intent
    and user input. Reducing this uncertainty is obviously an objective in HCI more
    generally, but the specifics of IML mean that confusion about user input is particularly
    detrimental to the process of training a model.


    Fogarty et al. [2008] note that it is impossible for an algorithm to distinguish
    between what the user deems highly-relevant samples versus what are perhaps only
    minor inconsistencies. CueFlik [Fogarty et al. 2008] helped mitigate this issue
    by displaying only the best and worst matches so that less certain training samples
    were typically out of view. The user is therefore guided towards focusing on samples
    that are definitely ‘good’ or definitely ‘bad’.


    The study performed by Amershi et al. [2012] provides a number of potentially
    useful insights related to interactivity in terms of explicit and implicit user
    input. The Interactive Machine Learning application developed for building custom
    social networks exploits both explicit and implicit user action. For example,
    a user skipping past contacts is used as an indicator that these contacts should
    be labelled as negative samples. Ritter and Basu [2009] applies similar assumptions
    to extract implied user intent from cursor pass over behaviour in a file selection
    IML application. Self et al. [2016] present an informative study of how careful
    interaction design can assist in making better inferences about user intent from
    user actions. For example, Self et al. demonstrate how adding a circular selection
    tool when dragging a data point primes users to think about and select other points
    with which that point should be clustered.


    As Porter et al. [2013] observes, “users are quite good at finding creative ways
    to use a small set of (inadequate) tools to reach their objectives, and so computers
    must learn to exploit a more unstructured dialog”. In other words, in circumstances
    where the user cannot explicitly express their intent, they may still be able
    to achieve their goal by exploiting a sequence of actions. An example of this
    is Gesture Script [Lü et al. 2014], which allows users to synthesise gesture samples
    by drawing sub-segments and then programmatically describing how they combine
    together to form a complete gesture. To accommodate the ‘creative’ ways the user
    may come to steer the process, the interface designer should thus consider avoiding
    overly constrained functionality or workflows.


    # 6.4   Provide efficient data representations


    An effective IML interface will enhance user perception or at least make best
    use of human perception capabilities. The sub-task of reviewing sample outputs
    within the model steering activity in the IML process is largely a comprehension
    task. Improving the speed and quality of this operation has high impact given
    the iterative nature of the model steering activity. The adaptive interaction
    framework [Payne and Howes 2013] further suggests that the strategy employed by
    a user will be dictated by their experience, their task level goals, and their
    ability to process information relevant to the task. From a user interaction perspective,
    then this third factor suggests a potential lever in terms of amplifying the cognitive
    ability of the user that might be activated to improve performance and hence model
    quality.'
