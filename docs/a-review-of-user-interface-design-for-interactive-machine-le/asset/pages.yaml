    \ playing games. This functionality is built through a process of training that\
    \ is not dissimilar from the human process of learning. In general terms, the\
    \ algorithm learns to recognise or represent a concept through repeated exposure\
    \ to samples of that concept. A mathematical model that accurately represents\
    \ a concept for some functional purpose is the goal product of a machine learning\
    \ algorithm.\n\nDespite the success of these techniques, their use as a development\
    \ tool remains largely confined to expert practitioners. However, the ability\
    \ for these approaches to deliver functionality without"
