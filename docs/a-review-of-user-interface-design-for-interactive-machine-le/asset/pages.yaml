- pgno: 23
  md: 'may identify a suggested movie as being completely outside their category of
    interest despite it possessing many attributes consistent with other favoured
    content. Amershi et al. [2012] note that, “this problem occurs in all machine
    learning systems when the hypothesis language is insufficiently expressive to
    model the true concept”. In other cases, numerous user actions may be required
    before the learning model reflects a desired change [Wong et al. 2011]. An application
    that does not respond in a timely manner to user input is in violation of the
    principles of direct manipulation and is a potential cause of significant frustration.
    The degree to which a user understands their limitations in addressing such model
    failings may have a significant impact on their satisfaction with the interface
    and the refinement actions with which they proceed.


    Without user understanding of the limitations of machine learning techniques,
    the process also exposes the potential risk of overfitting. Overfitting is the
    construction of a model that, although it matches to the data available, does
    not truly represent the phenomenon. Avoiding overfitting while supporting continued
    model refinement poses a unique challenge for supporting non-expert interaction.
    Expert machine learning practitioners are aware of this risk but naive users may
    be prone to over-specification. The interactive tree-based classifier demonstrated
    in [Ware et al. 2001] framed the task goal in a very clear and intuitive form
    but lead to some users expending significant effort to maximise classification
    accuracy with little real gain.


    The user may in many cases not require an understanding of the global objective
    they are working towards provided they understand their role in the immediate
    interaction task. It is unclear what impact understanding the global task may
    have on user performance, however, we would argue it is essential to effective
    performance in the termination assessment and transfer activities.


    # 6.2  Support user understanding of model uncertainty and confidence


    *Uncertainty* is an inevitable feature of data driven models in most real world
    applications. Correspondingly, the concepts of uncertainty and confidence cannot
    be removed from the IML process. This solution principle seeks to address the
    fact that interacting with a model is not like interacting with a conventional
    information structure (one of the key challenges highlighted in Section 1). Both
    the task of steering the model as well as the ultimate application of the model
    to a target dataset involve uncertainty. It is important that users are aware
    of this uncertainty for two reasons: 1) to manage their expectations during interaction;
    and 2) to manage their expectations of final system performance.


    The concept of a probabilistic model and its limitations can be difficult to convey
    to non-experts and so many applications of IML are likely to rely on simplified
    explanations. Users without experience in machine learning are unlikely to comprehend
    the implications of working with a probabilistic model. User studies have found
    that even a single outlier in a classifier can result in significant confusion
    for users [Kim et al. 2015a]. Users will calibrate their trust in the model both
    through individual predictions as well as the performance of the model as a whole
    [Ribeiro et al. 2016]. Furthermore, IML is a co-adaptive process in that both
    the user and model will respond to the behaviour of the other [Gillies et al.
    2016]. Establishing the right level of understanding among users and framing the
    task appropriately is critical and non-trivial.


    Non-experts unfamiliar with the internal behaviours of a computer program will
    construct their own mental model to aid their formulation of interaction strategies.
    This model will be derived in part from their past experience and knowledge. While
    the mental model constructed does not have to be accurate, a poor model may have
    a highly detrimental effect on user performance and thus, their perception of
    the effectiveness of the program [Norman 2014]. It is perhaps useful to make the
    distinction between functional models that allow one to use a system versus structural
    models that allow one to comprehend how and why it works. Gillies et al. [2015a]
    argue that users should be aided in their construction of conceptual models in
    order to enhance their debugging capabilities. As'
