- pgno: 12
  md: '![](img/17c50ccda69f2e1b79eba2e3563dce88_12_0.png)


    Fig. 3. Distinct interface elements in the IML process.


    tree-based classification application targeted at non-experts. Users create decision
    branches to build their own classifiers. Brown et al. [2012] present an iterative
    approach for learning user preferred distance functions in a multidimensional
    scaling projection visualisation interface. The user may drag one or many points
    within a scatterplot visualisation window then initiate the learning step to identify
    a new distance function that better reflects the user’s desired data arrangement.
    This process can be performed iteratively, while preserving the user’s interaction
    history, to incrementally find the most suitable distance function.


    These studies illustrate that data independent IML systems can be developed and
    effectively used. This is not to say that abstracting data to a simplified representation
    is a preferable strategy and in many cases this approach may be undesirable as
    it can limit the application of domain expertise. Nevertheless, what these approaches
    lose in terms of domain relevance they gain in flexibility.


    # 4 COMPOSITION OF AN IML INTERFACE


    In this section we describe the structural composition of a generalised Interactive
    Machine Learning interface. The design of an IML system may, of course, vary considerably
    depending on the nature of the data, the intended application of the model, and
    the user experience desired, as well as many other factors. Nevertheless, an understanding
    of the commonality can help inform the establishment of design principles.


    The interface elements presented are based on an identification of the commonality
    among the broad range of IML systems reviewed. We are also guided by the requirements
    and desired attributes suggested by others. Amershi et al. [2012] highlight three
    important aspects of an IML process that can be thought of as desired attributes
    of the interface: 1) illustrating the current state of the learned concept; 2)
    guiding the user to provide input that improves concept quality; and 3) providing
    revision mechanisms that allow the user to explore the model space. Stumpf et
    al. [2009] identify three activities relevant to the productive integration of
    the human user and machine learning techniques: 1) conveying system reasoning
    to the user; 2) conveying user reasoning to the system; and 3) ensuring both system
    and user profit from this feedback cycle. We split the third activity identified
    by Stumpf et al. into inspecting the model and reviewing task progress. The four
    key interface elements are then: sample review, feedback assignment, model inspection
    and task overview. These four interface elements are summarised in Figure 3. We
    do not suggest that these elements are necessarily visually distinct, or indeed
    necessary in all applications of IML. For'
