  img_proc: true
- pgno: 7
  md: '# 2.2 Related domains


    The machine learning community has sought to make its techniques more accessible
    to end users. There are a growing number of packaged toolkits (e.g. WEKA [Hall
    et al. 2009] and Scikit-learn [Pedregosa et al. 2011]) and automated functionality
    (e.g. The Automatic Statistician [Lloyd et al. 2014]). Fiebrink’s thesis introduces
    Wekinator [Fiebrink 2011], a stand-alone application for applying supervised machine
    learning to real-time data streams and particularly suited to music composition
    and performance.


    The concept of “Machine Learning as a Service” (MLaaS) has also recently emerged
    in response to the demand for advanced analytics and data driven applications
    within industry [Ribeiro et al. 2015]. Many service oriented machine learning
    platforms now exist including those offered by major companies such as Google,
    Microsoft, Amazon and IBM. While these services do provide access to machine learning
    functionality paired with powerful computing back-ends, they still require familiarity
    with the techniques for their effective use.


    Exposure of machine learning techniques to non-experts has occurred only more
    recently through applications such as email filters and recommender systems. Recommender
    systems are a form of Interactive Machine Learning in that the model of the user’s
    preferences is iteratively constructed through interpreting their actions such
    as liking, disliking, purchasing and reviewing. However, in many of these applications
    the user may be unaware that they are interacting with an algorithm that is learning
    in response to their inputs. Some recommender systems do explicitly inform users
    that they can influence the behaviour of their preference model and/or provide
    an interface to do so, but even in these cases, the interaction typically focusses
    more on data capture than on a bipartite process of closed-loop model refinement.
    In this article, we specifically focus on Interactive Machine Learning from an
    interface design perspective. While the algorithmic backends of recommender systems
    and their considered approach to implicit and explicit user input is certainly
    relevant to understanding Interactive Machine Learning more generally, the lack
    of focus given to the process excludes them from broader discussion in Section
    3.


    It is useful to explicitly highlight the distinction between Interactive Machine
    Learning and the related concept of Active Learning. Active Learning is a machine
    learning technique that focuses on selecting new points for labelling by the user.
    The key distinction from IML is that point selection is driven by the learner
    rather than the user. IML may also leverage learner driven point selection strategies
    but not to the exclusion of user driven input. For a survey of Active Learning,
    see [Settles 2010]. Reinforcement Learning is a machine learning technique that
    guides the learner towards a desired behaviour based on simple reward feedback.
    Research has examined the potential for humans to be positioned inside this loop
    as a means to steering the Reinforcement Learning algorithm. Knox and Stone [2015]
    provide a detailed overview of a series of experiments on reinforcement learning
    based on human derived reward feedback.


    Beyond human-computer interactions, IML related concepts have also been explored
    in human-robot interaction research ([Losing et al. 2015], [Javdani et al. 2016],
    [Gopinath et al. 2016]). Gopinath et al. [2016] are motivated by the need to adjust
    levels of robotic assistance to accommodate the user’s requirements. A motor impairment
    injury or illness may result in dynamic levels of capability even among a single
    user through the stages of recovery or degeneration. Supporting user-driven customisation
    of the level of assistance is a prime application for IML. There is also some
    overlap between IML and aspects of Knowledge Discovery in Databases (KDD) (see
    [Holzinger 2013]) and Interactive Optimisation (see [Meignan et al. 2015]). IML
    differs from these fields in the emphasis given to the role of the user and the
    process rather than the end goal.'
  merge: -1
  img_proc: true
