  md: 'balance between supervision effort and recognition error. While allowing the
    user to configure an acceptable word error rate does not in itself set a termination
    condition per se, it does offer an interactive tool for exploration of whether
    further effort will yield worthwhile benefit.


    Determining when to stop training under the IML process requires considerable
    judgment. The user’s decision can, however, be informed by improved contextualisation
    of the various objectives and constraints relevant to the given application.


    # 5.6  Transfer


    The activity of deploying the trained model in the target domain is described
    here as *transfer*. In certain applications, this task may be as trivial as pointing
    to a test dataset. In other applications, however, the transfer of model functionality
    into practical use may be considerably more complicated. While the IML workflow
    should endeavour to achieve good generalisability from the outset, this activity
    recognises the fact that tools are often applied in ways that cannot be predicted
    at design time. Packaging the model for end use and ensuring that it generalises
    is important to actually delivering an application that is useful.


    Importantly, some applications such as abstrackr [Wallace et al. 2012] and the
    assisted claims processing system of [Ghani and Kumar 2011] make no real distinction
    between training and deployment. The model learns and becomes more helpful as
    its predictive power increases. Nevertheless, it is useful to consider how one
    might subsequently transfer such developed models to the next context. This is
    indeed what Selvaraj et al. [2015] explored in their reuse of their statute classifier
    trained in one jurisdiction in another jurisdiction. Talbot et al. [2009] observed
    that a model trained by a participant which achieved the highest-accuracy on the
    training set did not generalise well to the test set due to overfitting. Arguably
    the transfer activity should be supported by tools that aid in identifying and
    correcting such situations.


    The IML system demonstrated by Ghani and Kumar [2011] highlights the fact that
    deployment considerations can have significant effects on the efficiency of the
    process. For example, in the claims processing system, auditors were presented
    the next case based on similarity rather than confidence. This decision delivered
    a performance improvement by reducing the time lost to context switching.


    The transfer activity has received limited attention in the literature on IML
    but should be recognised as a necessary stage in a comprehensive IML process.
    At the same time, it is important to note that not all applications require a
    transfer activity. Several of the applications reviewed in Section 3 do not involve
    an end-point or target dataset, but rather focus on the process itself. Nevertheless,
    it is useful to consider the end use of trained models where appropriate and the
    implications this may have on the design of the interface.


    # 6  EMERGENT SOLUTION PRINCIPLES


    While the value of placing machine learning functionality in the hands of non-experts
    is gaining recognition, and emerging applications are enhancing user capability,
    there has been limited attention given to the generalised user interface design
    principles for such systems. This section seeks to consolidate observations from
    user studies in IML, and synthesise these with relevant recognised HCI theory
    to establish some basic solution principles for interface design in IML. The solution
    principles are intended to serve as guidance to interface designers tasked with
    constructing effective interfaces for IML systems.


    The specific interpretation and relative importance of the solution principles
    are likely to vary depending upon the level of involvement expected of the user
    and on the complexity of the required functionality. Compare, for example, a user
    seeking to instruct a content suggestion service to obtain better recommendations,
    versus a user seeking to train a robot to perform some function in'
