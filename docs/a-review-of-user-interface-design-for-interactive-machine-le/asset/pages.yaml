  md: 'Endert et al. [2012] introduce the concept of semantic interaction in text
    analytics. They make use of the information embedded in interactions such as word
    search, highlighting, annotations, and adjustment of document pin locations to
    iteratively refine a model of document associations. This information is used
    to update a spatial visualisation of document associations.


    Applying an IML process to textual data is challenged by the difficulty of providing
    succinct representations of documents that facilitate rapid user review. Kim et
    al. [2015b] compare a variety of machine learning techniques to the task of document
    feature compression. Their aim is to identify representations that improve the
    speed of categorisation assessment by users. Several of the discussed studies
    exploit term highlighting that indicates features relevant to the categorisation
    result. Giving salience to indicative keywords is hypothesised to speed up the
    assessment process. In terms of feature labelling, Raghavan et al. [2006] observe
    that users take up to five times longer to label one document, i.e. assign a document
    to a topic, than to label one feature, i.e. assign a word as an important term
    for a topic.


    # 3.2 Images


    The categorisation of images is a very popular application area within the machine
    learning community. The availability of suitable techniques for image based classification
    has encouraged the examination of the potential pairing of user input through
    IML. As for the application of IML to textual data, the usefulness of the technique
    is seen when more subtle concept discrimination capabilities are desired.


    At the inter-image level, applications have sought to allow users to train models
    to understand their own, sometimes obscure, concepts. Fogarty et al. [2008] introduce
    CueFlik, an interactive application that allows users to create their own concepts
    to incorporate into image search. The user may define a new search rule by assigning
    a collection of images to describe a desired concept, e.g. scenic. The user may
    then apply this rule to their search so that only results consistent with that
    concept are provided. Fogarty et al. [2008] found that providing a visualisation
    of both the most-confident positive and most-confident negative samples led to
    higher quality and faster concept learning than providing the full ranking of
    images. Amershi et al. [2011a] extend CueFlik by adding features to the interface
    that better allow users to model changes and visualise the current model state.
    Amershi et al. also introduced a visualisation of historical model quality (expressed
    in terms of model reliability and snapshots in time of ranked images) and the
    ability to revert back to previous model states. Guo et al. [2016] present an
    IML system for clustering medical images based on the underlying condition, and
    attempt to specifically incorporate expert constraints. Users can drag images
    apart to indicate that they should be disconnected in the model.


    Other applications of IML have sought to train systems to recognise specific objects
    at the intra-image level. Crayons [Fails and Olsen 2003] is the often cited formative
    paper in IML that demonstrates an interface whereby users can incrementally train
    a classifier by directly drawing on an image. This approach has also been leveraged
    by Tsutsumi and Tateda [2009] to help measure the amount of leaf debris flowing
    on a river as well as for analysis of satellite, medical and material science
    images ([Porter et al. 2011], [Porter et al. 2013],[Harvey and Porter 2016],[Kreshuk
    et al. 2011]).


    IML is well suited to use with images as there is a rich repository of features
    that have already been established and the user can quickly review a large number
    of images. The ability to provide pixel or region level feedback by directly sketching
    on images is an interaction technique successfully exploited in several applications.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# ### 3.3  Time series data: speech, audio, video and motion


    The transcription of speech into text can be a laborious task when performed manually
    but there are an increasing number of systems that can autonomously perform this
    task at very low error rates. Sanchez-Cortina et al. [2012] pair an automatic
    speech recogniser system with an IML interface that facilitates error correction.
    The acceptable word error rate can be adjusted to vary how many uncertain cases
    are shown to the user.


    Kabra et al. [2013] employ an Interactive Machine Learning approach to allow non
    expert users to build classifiers for recognising distinct animal behaviours.
    The user reviews video footage of the animal and assigns behaviour labels to segments
    of the video. When a label is added, the user may initiate re-training of the
    model and the classifier will be applied over the duration of the video. Upon
    encountering a behaviour that has been incorrectly classified, the user may correct
    the sample to incrementally improve model quality. The classifiers constructed
    through this process then allow for rapid and accurate annotation of animal behaviour
    in recorded datasets: a task that is very slow if performed manually and highly
    error prone if performed autonomously using less advanced methods. Versino and
    Lombardi [2011] apply an IML process to the filtering of surveillance streams
    for safeguarding a nuclear processing facility. Users assign positive and negative
    samples of safeguard-relevant events and the trained model can thus help identify
    potential hazards.


    The challenging task of separating individual sources from a recorded audio track
    is explored by Bryan et al. [2014]. Bryan et al. use a paint on approach (similar
    to that employed by Fails and Olsen [2003] on images) to train a classifier to
    recognise the desired source from within an audio file. The user ‘paints’ on regions
    of a time-frequency visualisation of an audio recording to separate out sources.


    BeatBox [Hipke et al. 2014] allows users to train a system to recognise different
    percussive vocalisations. Having established a custom vocabulary of vocalisations,
    users can then create a track that recognises and labels the vocalisations employed.
    The interface separates distinct vocalisation classes into different virtual pads
    and colour codes recorded vocalisations for a pad according to their recognised
    class. This colour coding provides a simple to interpret sense of the quality
    of a particular vocalisation class. A pad that contains recorded samples that
    are not accurately classified quickly attracts the attention of the user. They
    can then target a new class with greater discriminative power.


    Motivated by relieving the prohibitive challenges people with disabilities face
    when playing conventional musical instruments, Katan et al. [2015] apply Interactive
    Machine Learning to the creation of gesture controlled instruments. Katan et al.
    [2015] enabled users to build a gesture vocabulary and customise the relationship
    between gestures and sounds. Sarasua et al. [2016] show the potential for customised
    gesture recognition to control music articulations, as a conductor might control
    an orchestra with a baton. Similar approaches have demonstrated the potential
    for IML to support unique forms of music composition ([Fiebrink et al. 2011],
    [Tsandilas et al. 2009]) and interactive experiences ([Klein­smith and Gillies
    2013], [Brenton et al. 2014], [Gillies et al. 2015b]). These studies highlight
    that the goal in IML is not necessarily just about making a task more efficient
    or productive, but potentially about extending human creativity.


    Others have sought to produce intelligent functionality in response to data streams
    such as for seizure detection ([Chua et al. 2011]) and for office task automation
    (Dey et al. [2004]). IML has also been applied in training of brain computer interfaces
    ([Kosmy­na et al. 2015]).


    Gesture Script [Lü et al. 2014] is an interactive tool for creating 2D gesture
    recognisers. The application allows users to generate feature level descriptions
    and combine these together to'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'supplement training data. Hartmann et al. [2007] present an interaction authoring
    tool based on recognising patterns in generic sensor data.


    As with textual data, the application of IML to time series data can also be challenging
    in terms of providing summative representations of sample points: it can be difficult
    to succinctly represent the dynamic contents of an image stream or the temporal
    relationship between time and position that represents a gesture. There is a risk
    that the requirement for serial review of samples leads to a highly serialised
    process that does not scale well. Interfaces designed for this purpose must find
    ways to allow users to quickly inspect and review samples.


    # 3.4  Assisted processing of structured information


    The IML systems discussed in this section exploit structured data to train models
    that enhance user capabilities. These examples in particular highlight the application
    of domain or user-specific expertise to the training process. Amershi et al. [2012]
    present a social networking assistance tool based on the Interactive Machine Learning
    paradigm. The system builds a probabilistic model based on a Naïve Bayes classifier
    of contacts likely to be relevant to a particular group and makes suggestions
    and provides new filters for identifying new members.


    Ghani and Kumar [2011] apply an IML process to greatly assist the work of auditors
    processing health insurance claims. In addition to learning to highlight fields
    of likely interest to support the auditor, the classification method can also
    help by grouping similar claims in the processing queue to reduce inefficiencies
    of context switching. This later strategy is estimated to reduce time spent per
    claim by 27%.


    CueT ([Amershi et al. 2011c], [Amershi et al. 2011b]) is an IML system that supports
    network alarm triage. The system can learn from the actions of operators to suggest
    alarm groupings. Kose et al. [2015] apply IML to facilitate the process of fraud
    detection in electronic claims data. The dynamic nature of the underlying data,
    and the potentially subtle relations that must be identified motivate the use
    of a human-in-the-loop approach. AppGrouper [Chang et al. 2016] assists in the
    process of delivering topically coherent application clusters in an online application
    store. Users may directly edit clusters and encourage more or fewer clusters to
    be generated. In evaluation, the approach was shown to improve the quality of
    clustering results over algorithm-generated clusters. AppGrouper highlights the
    potential value in pairing human judgement with computational intelligence through
    a carefully designed interface. Human input is applied only at the stages where
    it is most useful.


    The assisted processing applications discussed here highlight that certain domains
    will require highly specialised interface design. In many cases however, the system
    level architecture may not require modification. Similarly, we hypothesise that
    the interaction and task level strategies that are effective are likely to remain
    consistent.


    # 3.5  Raw numerical data


    In an effort to demonstrate complete data type agnosticism, several studies have
    applied the IML process to numerical data that is abstracted from any particular
    application. There are parallels that can be drawn between Interactive Machine
    Learning and the uptake of spreadsheet applications that placed basic statistical
    and data representation tools in the hands of non-expert users. Indeed, Sarkar
    et al. [2015] have even demonstrated the capabilities of BrainCel which adds machine
    learning functionality to a typical spreadsheet type interface. The user can select
    rows as training data then click a ‘guess’ button to make model predictions based
    on those rows.


    Holzinger et al. [2016] incorporate human feedback with an Ant Colony Optimisation
    (ACO) framework to solve a traveling salesman problem. Users can select the path
    joining two cities and adjust the pheromone levels assigned using a slider. Ware
    et al. [2001] present an interactive'
  merge: -1
