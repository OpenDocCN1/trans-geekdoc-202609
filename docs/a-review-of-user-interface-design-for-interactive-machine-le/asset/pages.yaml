  md: 'from a user interaction perspective. The following research strands are proposed
    based on the gaps identified in the literature and also gaps identified through
    the consolidation and synthesis process applied in preparing this article.


    # 7.1  **Priming and guiding the user**


    The role of the user’s mental model in the IML process has received some recent
    attention ([Kulesza et al. 2013], [Sarkar et al. 2015]) as has the potential for
    improved task guidance during training ([Cakmak and Thomaz 2014], [Kulesza et
    al. 2014]). These studies show that relatively simple strategies can be applied
    to improve user consistency and understanding. In addition to extending this work
    on guiding task level strategies at execution, further research should examine
    the initial instructions and framing given to users. An improved understanding
    of appropriate user priming is perhaps more likely to be generalisable across
    IML applications than execution related guidance. This in turn may help highlight
    more concrete solution principles related to the formation of user mental models
    in IML.


    As more comprehensive IML processes covering the full range of activities described
    in Section 5 emerge, there is value in investigating the user guidance required
    to inform decisions on switching between the global task activities. It is necessary
    that users can build effective strategies that in some way relate the model steering
    activity to the broader task goals and related activities such as model configuration
    and deployment.


    # 7.2  **Capturing, representing and reasoning with uncertainty**


    As highlighted earlier, a key aspect of prediction using a model is uncertainty.
    The concept of data and prediction uncertainty is not always well understood by
    end users who traditionally associate computers with precision and repeatability.
    Furthermore, uncertainty can be difficult to succinctly represent visually. Micallef
    et al. [2012] show that non experts struggle in probabilistic reasoning tasks,
    even when concise visual and textual guidance is provided. While the most appropriate
    approach may differ depending on the data and application, Bayesian machine learning
    methods provide a distinct advantage in their ability to incorporate the notion
    of uncertainty [Ghahramani 2015].


    There is value in studies investigating the application of these approaches coupled
    with intuitive uncertainty visualisation techniques. Horvitz’s early work on mixed-initiative
    interfaces applied probabilistic models of user intention to support selection
    of different interface modes. Similar methods may be appropriate for capturing
    uncertainty in user input. The specific advantage of a Bayesian framework is to
    embed the estimation of uncertainty from the outset as well as throughout the
    model components. Allowing users to view model uncertainty and its evolution may
    support improved understanding and performance but care must be taken to ensure
    such feedback provides genuine insight without adverse secondary effects, such
    as becoming a distraction or attracting attention away from other critical aspects
    of the interface.


    # 7.3  **Enhancing perception, interaction and engagement via immersive environments**


    Holzinger and Jurisica [2014] argue for tools that are interactive and representations
    that support high dimensions and multiple modalities. The recent advancement in
    augmented and virtual reality head mounted displays presents new opportunities
    for users to interact with and explore complex multidimensional datasets. It is
    reasonable to propose that more natural interaction may thus support improved
    understanding and reduced perceived cost of model refinement.


    The placement of a user into an immersive environment can also facilitate more
    natural mechanisms of discovery and learning. Gillies et al. [2015b] show the
    potential for full bodied interaction as part of an IML process. The placement
    of users within an immersive environment is likely to'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'have particular relevance to IML processes applied in gesture and motion recognition
    applications. Immersive three-dimensional interfaces also offer additional data
    representation opportunities over conventional two-dimensional displays. A further
    ancillary benefit is that an enjoyable immersive experience may also improve user
    engagement. However, as the mass of research effort in the field of information
    visualisation shows, the construction of intuitive and informative multi-dimensional
    data representations is non-trivial.


    # 7.4  Evaluating interfaces and user performance in IML


    The task of evaluating user interfaces for Interactive Machine Learning requires
    careful consideration given the various characteristics that distinguish them
    from more traditional user interfaces. In the case of a user training a model
    to capture their own personal concept, Groce et al. [2014] highlight that potentially
    only that particular individual can properly evaluate the quality of their model.


    Additionally, interfaces designed for cognitively intense tasks can be difficult
    to evaluate due to the longitudinal nature of analysis and learning. A key challenge
    for evaluating information visualisations designed to provide enhanced cognition
    is the fact that insight is ‘temporally elusive’ in that a stimulus may trigger
    a response long after exposure [Carpendale 2008].


    Gillies et al. [2016] point to different traditions for evaluation of developed
    methods between the HCI and machine learning communities (i.e. user studies versus
    benchmark testing). Regrettably, unlike in traditional machine learning research
    where alternate techniques may be repeatedly evaluated on a single dataset, a
    human user, once exposed to a problem as part of an IML evaluation, cannot unlearn
    their experience and be retested. The HCI community may do well to establish representative
    datasets, and perhaps even representative structured tasks, relevant to the specific
    challenges introduced by Interactive Machine Learning. This may foster better
    engagement from the broader machine learning community while at the same time
    support the identification of generalisable requirements and enable comparative
    evaluation of interfaces.


    # 8  CONCLUSIONS


    Machine learning techniques are slowly creeping into the lives of non-expert users.
    Enabling users to efficiently interact with such algorithms is likely to be a
    key design challenge in the coming decade. Interactive Machine Learning promises
    new opportunities for assisting users in data intensive processing tasks, enhancing
    outcomes in analytic tasks, and supporting the development of comparatively complex
    functionality without explicit programming. IML is a co-adaptive process, driven
    by the user, but inherently dynamic in nature as the model and user evolve together
    during training. The user may adjust their strategy in response to the observed
    behaviour in the model, and the model correspondingly changes but in ways that
    are not entirely predictable.


    There are aspects of the task of training a model that make the interaction requirements
    distinct from more conventional human-computer interfaces. It is important that
    the application of new and exciting machine intelligence is accompanied by careful
    design of the user interfaces for such applications. Research is beginning to
    focus more on the interface features that make such applications effective and
    enjoyable to use. Studies have shown that even non-expert users want to understand
    more about the models they are interacting with and how they can refine their
    accuracy.


    This article has presented a survey of prominent efforts to apply the IML process
    in a range of applications. The survey illustrates that the IML approach has utility
    on a range of underlying data types. Furthermore, there is a degree of commonality
    across implementations. A synthesis of the literature forms the basis for the
    structural and behavioural IML models presented. The interface elements identified
    in Section 4 provide a generalised perspective on the interface design'
