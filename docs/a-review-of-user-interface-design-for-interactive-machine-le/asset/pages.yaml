  md: 'Fogarty et al. [2008] observe, evolution of the predictive model can result
    in seemingly unpredictable behaviour from the user’s perspective. Kulesza et al.
    [2013] investigate the impact that different explanations have on the fidelity
    of the mental models constructed by end-users. The results indicate that more
    detailed explanations about intelligent agents are useful if added understanding
    can be leveraged by the user to improve outcomes. Sarkar [2015] proposes to exploit
    metamodels for confidence (is an output correct?), command (is the understanding
    complete?), and complexity (how simple was it to arrive at the output?) to augment
    machine learning models. Such metamodels would capture the information that is
    more intuitive and relevant for communication to end-users to support their understanding.


    A number of strategies have been explored as a means to simplify the interpretation
    of model behaviour. ManiMatrix [Kapor et al. 2010] allows users to interact directly
    with the classifier’s confusion matrix and thereby steer classification behaviour.
    Ribeiro et al. [2016] present explanations that are locally faithful representations
    of considerably more complex models. This approach supports interpretation while
    hiding the potentially confusing complexity underneath. Violin et al. [2014],
    referencing constructivist learning theory, propose constraining the construction
    of decision trees to only represent relationships that are credible to the user.
    The use of examples to support understanding of classes appears to be a promising
    solution that resonates with users [Kim et al. 2015a]. As a summative view of
    model quality, presenting best and worst matching samples has been shown to support
    more efficient model evaluation than ranking of the n best [Fogarty et al. 2008].
    ReGroup, the social network group creation tool introduced in [Amershi et al.
    2012], presents filters that were generated based on features in the model. Participants
    noted that these filters provided insight on the patterns that were being exploited
    by the model, and thus served the dual purpose of explaining the model as well
    as their intended function as an interaction element.


    Uncertainty can be difficult to represent succinctly in a user interface. Sarkar
    et al. [2015] demonstrated the potential for colouration to represent confidence
    within their BrainCell application, however, representing confidence through colouration
    in a speech recognition application [Vertanen and Kristensson 2008] did not yield
    an improvement in user performance. Within the field of information visualisation,
    the representation of uncertainty is a key area of investigation. In general,
    the objective of uncertainty visualisation is to provide representations that
    aid data analysis and decisions making [Pang et al. 1997]. It can be useful to
    distinguish between different forms of uncertainty. Pang et al. [1997] describe
    three types of uncertainty: statistical (distribution of the data), error (delta
    compared to datum) and range (interval of possible values).


    Within the machine learning community there also been interest in representing
    model quality in ways that support human understanding. The technique known as
    t-Distributed Stochastic Neighbour Embedding (t-SNE) enables the visual representation
    of clustering models [Van der Maaten and Hinton 2008]. Such representations are
    easily queried and support non-expert reasoning on the level of confidence in
    the underlying model. Micallef et al. [2012] present an investigation of explanatory
    methods for supporting Bayesian reasoning. The observations of this study reveal
    the difficulty of the design problem in that text *without numbers* paired with
    visual aids yielded higher performance than text *with numbers* and visuals.


    The literature suggests that there is likely to be a close relationship between
    user tolerance of error and the level of clarity in system uncertainty [Sacha
    et al. 2016]. The degree of error a user will tolerate in an application is task
    specific (e.g. compare an error encountered while withdrawing money from an ATM
    versus an erroneous turn instruction given by a navigation system [Fogg and Tseng
    1999]). If the user understands that they are in part responsible for an erroneous
    output, then they may be more forgiving in their perception of the system. Users
    will calibrate their trust of a system based on an understanding of the system
    properties. Muir and Moray [1996] argue that behaviours must be observable for
    trust to grow.'
