- pgno: 27
  md: 'effect in the model is observable [Wong et al. 2011]. Horvitz [1999] sought
    to bridge the principles of direct manipulation and enhanced computer autonomy
    through what he termed mixed-initiative interfaces. Horvitz identified twelve
    critical factors in ensuring effective collaboration with intelligent services.
    Importantly, Horvitz cautions against patching poor interface design by overusing
    machine intelligence and highlights the requirement to consider the design of
    both components in combination.


    Interactivity may also be important at the point of understanding the sample data
    or inspection of whole datasets involved in the IML process. It is widely observed
    that interaction supports understanding ([Card et al. 1999], [Chi and Riedl 1998])
    and so interactive data exploration tools are likely to be of value. This is particularly
    true for multidimensional or very large datasets that are difficult to visualise
    in a single view. Carpendale [2008] provides a summary of different tasks relevant
    to information visualisation and makes a distinction between low-level, detail-oriented
    tasks such as associating, ranking, clustering versus high-level, cognitive tasks
    such as identifying trends, causal relationships, and understanding uncertainty.
    Various data characteristics may frustrate simplistic approaches to visualisation,
    for instance data properties such as non-linearity, holoarchy, and internal causality.


    Inevitably there will be a coupling between the data type and the most suitable
    representation and interaction methods. A unique aspect of the model training
    task is the potential overlap in the sample review and feedback assignment interfaces.
    Creating a meaningful and productive interface that serves these dual functions
    requires careful design.


    # *6.5.2* **Make the most of the user.**


    The ability to reverse actions appears to be a highly valued interaction feature
    in IML. This observation is consistent with the ‘user control and freedom’ usability
    heuristic proposed by Nielsen [1995]. In constructing and refining a model, users
    require the ability to retrace steps in the event that recent actions have resulted
    in an undesired outcome ([Talbot et al. 2009],[Kapoor et al. 2010],[Amershi et
    al. 2010]). Related to the ability to ‘undo’ is the provision of a visualisation
    of the history of model quality. Amershi et al. [2010] demonstrated that visualisation
    of model improvement or degradation is useful in guiding the non-expert user’s
    efforts to refine the model.


    Another interesting aspect of end-user interaction with machine learning is perception
    of relevance. Users want to feel like they are contributing value and that their
    inputs are utilised. A number of IML interfaces have attempted to address this
    issue by allowing users to label features rather than instances, such as allowing
    users to select words considered representative of a document class rather than
    just assigning documents to categories. This approach better exploits human insight
    and appears to promote user engagement. Sun and DeJong [2005] present an augmentation
    of a Support Vector Machine (SVM) that can incorporate domain knowledge to improve
    SVM learning. The study does not apply domain knowledge directly extracted from
    domain experts but does provide a suitable framework. The difficulty lies in elucidating
    that domain knowledge and transforming it into a format that is useful to the
    learner.


    Users do not enjoy being repeatedly asked ‘yes or no’ questions and so frustration
    and interrupt-ability needs to be carefully managed. Cakmak et al. [2010] highlight
    that an ignorant learner asking many questions can be perceived as annoying. To
    reduce user annoyance, there are a number of potential strategies for minimising
    the frequency of interaction requests or minimising the impact of individual interruptions.
    For example, it may be possible to reduce the frequency of interaction requests
    by ensuring only questions of high relevance are posed to the user.


    A novel approach suggested by Wallace et al. [2012], in seeking to exploit the
    knowledge and experience of domain experts, is to allocate classification labelling
    to different users depending on the confidence of the learner. The probabilistic
    measures generated for a particular instance'
