- pgno: 17
  md: '![](img/17c50ccda69f2e1b79eba2e3563dce88_17_0.png)


    Fig. 4. The IML workflow as a behavioural breakdown into distinct user activities.
    The *model steering* activity is the iterative feedback-and-review cycle most
    commonly associated with the pure IML process. The user may initialise or reconfigure
    the process by engaging in *model selection* and *feature selection*. *Quality
    assessment* and *termination assessment* are depicted beside the main loop rather
    than within it. The intent here is to highlight that *model steering* is the primary
    activity but that this loop may be suspended temporarily, at any time, to undertake
    quality assessment and termination assessment. Upon successfully training the
    model to represent their desired concept, the user engages in *transfer* to deploy
    the developed model into the target application.


    # 5.1  Feature selection


    Fails and Olsen [2003] suggest that the need for explicit feature selection can
    be removed thanks to the IML process by incorporating a very large number of features
    and allowing the classifier to indirectly perform the filtering. While the feature
    selection activity may indeed be unnecessary in many applications where an appropriate
    repository of features exist, a more generalised workflow model for IML benefits
    from its inclusion.


    Allowing users to select features has been found to deliver both efficiency [Raghavan
    et al. 2006] and quality [Brooks et al. 2015] gains. Patel et al. [2008] suggest
    there is value in integrating data collection and feature creation tools. Kim
    et al. [2015a] observe a desire among users to introduce higher level features
    (such as code structure). The fact that human curated features are, by nature,
    more interpretable [Brooks et al. 2015] may also serve to improve user understanding
    in other activities in the process.


    For other reasons too, the features themselves may be more relevant to users than
    the classification they produce [Calderon et al. 2015]. For example, rather than
    identifying how sentiment towards an administration is clustered, it may be more
    important to explore where and for what reasons this sentiment occurs.


    Recent research has given more focus to the potential for human involvement in
    feature selection and construction. With Flock, Cheng and Bernstein [2015] show
    the potential for crowdsourcing to'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'facilitate novel feature generation. Aggregating crowd features achieved better
    performance than just asking the crowd for a prediction or using a standard set
    of typical machine learning features. The Flock interface prompts users to think
    of discriminatory features by presenting contrasting samples. FeatureInsight [Brooks
    et al. 2015] is a tool that enables feature selection in website classification.
    Users are prompted to consider new dictionary features by being shown misclassified
    documents.


    The studies discussed above suggest that end users are capable of, and indeed
    enjoy, identifying useful features for incorporation in the training process.
    Designing the IML system and interface to accommodate the feature selection activity
    may thus be desirable, though not always practical. Certain data types and applications
    are better suited to end user feature selection than others.


    # 5.2  Model selection


    Studies in IML typically demonstrate the procedure using a machine learning technique
    specifically chosen by the authors for its applicability to the target data. This
    approach is entirely reasonable for application areas where the data and feature
    structures are known *a priori* or can be determined. However, in instances where
    an IML process is sought but the ideal machine learning technique is undetermined,
    it may be useful to allow the user to make this selection or perform a comparative
    evaluation. Furthermore, if one credits the proposition that an ideal IML system
    be agnostic to the underlying model and algorithm then there is value in considering
    model selection as an activity the user may perform.


    The combination of multiple models through ensemble methods has also proven an
    effective strategy for the machine learning community. EnsembleMatrix [Talbot
    et al. 2009] demonstrates an interface that allows users to create combinations
    of classifiers trained on different features. It is not unreasonable to expect
    the user to weigh up the potential benefits and disadvantages of different models
    provided these can be concisely expressed for a given domain.


    The selection of the most appropriate model (or their parameters) may also be
    influenced by the target application. For example, Fiebrink et al. [2011] comment
    in the context of gesture based music generation that the shape and smoothness
    of the decision boundaries may be more important to the user than their specific
    location.


    It is perhaps overly optimistic to imagine an IML architecture in which the underlying
    learning techniques are completely modular and easily changed. Nevertheless, supporting
    the model selection activity by allowing the model to be configured by the user,
    even to a limited extent, can help to reduce the burden on machine learning practitioners.
    If the user can experiment with multiple different machine learning techniques
    within the same IML application, then the user can develop their own, albeit potentially
    naïve, sense of the relative advantages and disadvantages without the involvement
    of a practitioner.


    # 5.3  Model steering


    The model steering activity is the stage in the workflow where most user effort
    is expended and with which the concept of IML is most traditionally associated.
    The majority of user focused research in IML examines this particular activity.
    While engaged in the steering task, the user is seeking to train the model to
    understand a given concept by iteratively refining the training data. This interaction
    will typically involve some combination of correcting existing erroneous samples,
    assigning labels to new samples or generating completely new samples. The emphasis,
    however, is generally on providing just enough feedback per iteration to push
    the model in the right direction. Fails and Olsen [2003] hypothesise that “having
    a very fast training algorithm is more important than strong induction”. This
    is based on the assumption that users will apply an iterative strategy that will
    eventually deliver the necessary predictive power.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'Fogarty et al. [2008] observe that users first focus on getting their classifier
    working and then seek to improve robustness by introducing more corner cases to
    the training. This is comparable to the approach followed by teachers in terms
    of first introducing the basic concept and then later exploring the extensions
    of this concept. Porter et al. [2013] refers to the exchange between the model
    and user that occurs during the model steering activity as the training dialog.
    The richness and flexibility of this dialog is directly influenced by the design
    of the interface and the interaction methods available. The Gesture Script application
    [Lü et al. 2014] provides an excellent example of a compelling and engaging dialog
    that shows how user intelligence can be applied to more than just assigning or
    correcting labels. In addition to improving gesture recognition performance by
    providing new samples, Gesture Script allows users to create rendering scripts
    that describe the underlying structure of a gesture. For example, the user can
    specify that an arrow is composed of a line and a triangle-shaped head. This approach
    supports the synthesis of new gesture samples that help to introduce more variation
    and thus greater discriminative power. The model steering activity in Gesture
    Script thus incorporates multiple sub-tasks with which the user can engage and
    provide input where the greatest benefit is anticipated.


    While the model steering activity is normally assumed to be iterative, Kleinsmith
    and Gillies [2013] found that users will not necessarily follow an iterative strategy.
    A portion of the participants in Kleinsmith and Gillies’ study performed only
    one or two iterations in training their character behaviour model, and preferred
    to expend their effort in carefully labelling samples. This observation highlights
    the fact that users may require high-level guidance on the strategy they should
    apply in the task of model steering (e.g. follow an iterative approach), and indeed,
    it is unreasonable to expect non-expert users to know what strategy is most appropriate.
    As Kleinsmith and Gillies suggest, the interface should promote this strategy
    through the interaction techniques available and the visual feedback presented.


    Unfortunately users also suffer from inconsistency and boredom and this can result
    in changes in their task behaviour over time. Unavoidably, the user’s perception
    of a concept may drift over the duration of a task. For example, what the user
    might consider to be a ‘scenic’ image or a ‘local news’ article can evolve as
    they are exposed to more samples. Similarly, the level of expressiveness that
    a user invests in the first articulation of a gesture may be radically different
    from their hundredth articulation. Structured Labeling [Kulesza et al. 2014] is
    an attempt to address concept drift during the training process. Kulesza et al.
    found that people labelling the same websites in two different sessions separated
    by four weeks were only 81% consistent. Providing more structure to the labelling
    task produced more consistent labelling. Cakmak and Thomaz [2014] demonstrate
    that automatic or heuristic based teaching guidance can also improve the efficiency
    and quality of user feedback. In Cakmak and Thomaz’s study, text-based instructions
    were presented to help guide the user in selecting positive and negative samples
    when training their model. In applications where an optimal training strategy
    can be described, these instructions can be generated algorithmically and in response
    to the model state. However, even heuristic based teaching guidance was shown
    to improve user performance. For example, in the experimental application of teaching
    a facial expression recogniser, a heuristic for teaching an angry face might be,
    “When you show examples of Angry face vary them as much as possible” [Cakmak and
    Thomaz 2014]. This finding suggests that appropriate framing of the task and even
    relatively simple guidance in the interface can positively influence user performance
    and model quality.


    Tsandilas et al. [2009] introduce the concept of ‘semi-structured delayed interpretation’
    of gestures. This approach encourages gestural annotations without having to specify
    their meaning. This preserves freedom of expression at gesturing time, but still
    allows semantic meaning to be attached later. This approach may be very useful
    in situations where users experience concept drift'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'by only requiring formal specification of meaning once the concept has solidified
    in the user’s mind.


    Ambiguity in subjective or interpreted concepts can also be problematic. Curran
    et al. [2012] observe that inter-user variation can be high when annotators are
    associating subjective attributes with images. Sarkar et al. [2016] achieve more
    consistent labelling by constructing the feedback task as a set-wise comparison.


    The model steering activity is the stage in the IML process at which most user
    effort and time is likely to be spent. Improving the speed and concept growth
    at each iteration step is thus likely to have the greatest impact on the overall
    efficiency and usability of the process.


    # 5.4 Quality assessment


    The Interactive Machine Learning process can be alternatively viewed as a user-driven
    error minimisation loop placed around the model. The user seeks to train the model
    to some level of acceptable accuracy. The quality assessment task represents the
    activity of evaluating the trained system performance. Early in the process, the
    user may not execute this activity based on the assumption that the concept is
    unlikely to have been sufficiently captured. Indeed, the feedback provided in
    the sample review interface provides a proxy for system accuracy at this early
    stage. After sufficient training, the user may periodically check the model quality
    and compare this against some desired or pre-established threshold. Amershi et
    al. [2011a] demonstrate visualisation of the current model accuracy as an interface
    element present during the standard model steering task. Amershi et al. suggest
    that this visualisation, coupled with an ability to undo actions, allows users
    to experiment with different strategies and evaluate their impact on accuracy.
    The quality assessment task may be interactive such as in the method proposed
    by Kapoor et al. [2010]. ManiMatrix [Kapoor et al. 2010] provides a method for
    visualising and controlling classification behaviour. The user can directly interact
    with the confusion matrix and express preferred classification behaviour. Kapoor
    et al. suggest that this approach is superior to manual tuning of numerical parameters
    in terms of both speed and quality. There is, however, a risk that users may focus
    too much on the quality assessment activity. Fiebrink et al. [2011] observe that
    users can inadvertently fall into a workflow that focuses on optimising cross-validation
    accuracy as an end in itself, rather than just using it as feedback to help refine
    their broader strategy. Supporting users in selecting the appropriate strategy
    and avoiding overfitting in the model requires careful framing of the quality
    assessment activity.


    # 5.5 Termination assessment


    Limited attention has been given to the task of determining when to terminate
    the IML process. While the system may provide advice on termination conditions,
    it seems most fitting that the user ultimately decides when to end the process.
    This suggests inclusion of the termination assessment activity within the generic
    workflow. There is potentially some overlap between termination and quality assessment
    activities. Certainly, in some cases the termination criteria may be entirely
    based on accuracy targets. However, Amershi et al. [2011a] observe that there
    is typically a degree of model decay between when peak performance is achieved
    and when users choose to stop. Supporting the identification of this inflection
    point may deliver improved performance in a comprehensive IML process. There may,
    however, be alternative conditions for ending the process such as: further labelling
    will deliver negligible gain, there is already sufficient confidence in the particular
    classifications of value, and there is an increasing risk of overfitting. Sanchez-Cortina
    et al. [2012] describe a unique approach to allowing for dynamic adjustment of
    the user’s workload by changing the acceptable word error rate in speech-to-text
    transcription. This approach allows the user to find an acceptable'
