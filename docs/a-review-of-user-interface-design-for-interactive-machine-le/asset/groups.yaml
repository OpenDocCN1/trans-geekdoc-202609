    从小型或简单的数据集中提取信息通常可以通过标准分析技术实现。当目标数据的复杂性和规模会使更成熟的方法感到挫败时，机器学习才真正发挥作用。因此，机器学习与终端用户的交互也必须提供查看和交互庞大、多维和多模态数据的方式。一些界面支持对模型输出的快速理解，例如可视化与不同分类预测相关的图像区域
    [Ribeiro et al. 2016]。文本分类应用可能会突出显示单词或 n-gram，以帮助用户感知模型正在利用哪些特征 [Wallace et al.
    2012]。总体设计目标似乎是最大化用户对与理解模型功能及其任何缺陷相关的特征的感知，以便随后可以选择适当的改进措施。


    旨在支持复杂数据交互的界面通常旨在呈现数据的简化形式（例如聚类、层次化组织、子集等）和/或增强用户的认知能力（例如突出相关区域、支持交互、提供有用工具等）。以合理的方式可视化多维数据可能极其困难，且首选的表示形式可能高度依赖于数据。这使得在终端用户应用中推广表示技术设计原则的努力变得复杂。平行坐标是一种将高维数据转换为低维表示的技术。然而，折叠维度通常会降低可用的视觉信息并阻止感知更微妙的模式。多维数据的呈现也可能引入新的用户认知障碍，例如迷失方向和遮挡。信息可视化研究人员寻求通过使模式、趋势、关系、异常值和其他相关性更易于立即观察来增强用户认知
    [Card et al. 1999]。交互式机器学习界面也必须利用这些技术。Stolper 等 [2014] 提出了渐进分析中动态可视化的四项设计准则：


    -   避免因视图变化过度而产生的干扰；

    -   突出显示新结果出现的位置；

    -   提供刷新功能以添加新结果；

    -   允许用户指定感兴趣的区域以及要忽略的问题空间部分。


    ## 6.5 利用交互性并促进丰富的交互


    IML 过程中的用户交互推动了模型开发。因此，通过使用户能够充分表达其意图并应用其洞察，可以使模型开发过程更高效。这一解决方案原则表明，IML 界面应具有最大程度的交互性，并在可能的情况下利用丰富的交互形式，例如在图像上直接绘制草图、构建解释以及编辑样本。


    ### 6.5.1 用于理解的交互


    支持用户与机器学习算法和复杂数据集的交互为典型的用户界面设计任务引入了新的维度。与不同对象的交互相比，与模型的交互使得难以应用许多已知有效的用户界面设计原则。Shneiderman
    [1982] 提出的直接操作原则在界面设计师中广为人知。然而，构建和与机器学习模型交互的任务性质可能禁止应用此类启发式方法，尤其对于非专家用户而言。作为回应，有必要培养用户构建适当的心理模型，以帮助框定这种非传统的交互体验。Shneiderman
    [1996] 提出了一种按任务分类的类型（TTT），描述了用户在七种数据类型上执行的七项基本任务。该框架为在不同形式的数据上执行不同任务时哪些特征有帮助或有阻碍提供了指导。例如，将过滤器应用于从视图中移除不感兴趣的数据必须在显示中迅速反映出来。然而，正如
