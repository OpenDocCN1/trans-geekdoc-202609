    ![](img/17c50ccda69f2e1b79ebae3563dce88_17_0.png)


    Fig. 4. IML 工作流程作为行为分解为不同的用户活动。*模型引导* 活动是与纯 IML 过程最常关联的迭代反馈和审查循环。用户可以通过参与 *模型选择*
    和 *特征选择* 来初始化或重新配置流程。*质量评估* 和 *终止评估* 被描绘在主循环之外而不是在其中。此处的意图是强调 *模型引导* 是主要活动，但该循环可在任何时候暂时中止，以进行质量评估和终止评估。在成功训练模型以表示其期望的概念后，用户会参与
    *迁移* 将开发的模型部署到目标应用中。


    ## 5.1 特征选择


    Fails 和 Olsen [2003] 认为，通过纳入大量特征并允许分类器间接执行过滤，IML 流程可以消除对显式特征选择的需要。虽然在存在适当特征库的许多应用中，特征选择活动可能确实是不必要的，但更通用的
    IML 工作流程模型从中受益。


    允许用户选择特征已被证明可带来效率 [Raghavan et al. 2006] 和质量 [Brooks et al. 2015] 的提升。Patel et
    al. [2008] 认为将数据收集和特征创建工具集成具有价值。Kim et al. [2015a] 观察到用户希望引入更高层次的特征（例如代码结构）。人工筛选的特征本质上更具可解释性
    [Brooks et al. 2015]，这也可能有助于提高用户在流程其他活动中的理解。


    出于其他原因，特征本身可能比它们产生的分类更相关于用户 [Calderon et al. 2015]。例如，与其识别对政府的情绪如何聚类，更重要的是探索这种情绪发生在哪里以及出于什么原因。


    近期研究更关注人类参与特征选择和构建的潜力。Cheng 和 Bernstein [2015] 在 Flock 中展示了众包促进新颖特征生成的潜力。聚合众包特征的表现优于仅向人群请求预测或使用标准机器学习特征集。Flock
    界面通过展示对比样本促使用户思考判别性特征。FeatureInsight [Brooks et al. 2015] 是一种可在网站分类中实现特征选择的工具。用户通过展示被误分类的文档被提示考虑新的词典特征。


    上述研究表明，最终用户有能力并且确实喜欢识别可用于训练过程的有用特征。因此，设计 IML 系统和界面以适应特征选择活动可能是可取的，尽管并不总是可行。某些数据类型和应用更适合最终用户进行特征选择。


    ## 5.2 模型选择


    IML 研究通常使用作者为其适用性于目标数据而专门选择的机器学习技术来演示该程序。对于数据和特征结构已知 *a priori* 或可确定的应用领域，这种方法完全合理。然而，在寻求
    IML 流程但理想的机器学习技术未确定的情况下，允许用户进行此选择或执行比较评估可能是有用的。此外，如果认可理想 IML 系统应与底层模型和算法无关的观点，那么将模型选择视为用户可能执行的活动就具有价值。


    通过集成方法组合多个模型也被证明是机器学习社区的有效策略。EnsembleMatrix [Talbot et al. 2009] 展示了一个界面，允许用户创建在不同特征上训练的分类器的组合。只要这些模型可以针对给定领域简洁地表达，就要求用户权衡不同模型的潜在利弊是合理的。


    最合适的模型（或其参数）的选择也可能受目标应用的影响。例如，Fiebrink et al. [2011] 在基于手势的音乐生成背景下评论说，决策边界的形状和平滑度可能比其具体位置对用户更重要。


    设想底层学习技术完全模块化且易于更改的 IML 架构或许过于乐观。然而，通过允许用户（即使在有限程度上）配置模型来支持模型选择活动，可以帮助减轻机器学习从业者的负担。如果用户可以在同一
    IML 应用中尝试多种不同的机器学习技术，那么用户就可以在没有从业者参与的情况下培养自己对相对优缺点（尽管可能天真）的认识。


    ## 5.3 模型引导


    *模型引导* 活动是工作流程中用户投入最多努力的阶段，也是 IML 概念最传统关联的阶段。IML 中以用户为重点的研究大部分都考察这一特定活动。在执行引导任务时，用户试图通过迭代优化训练数据来训练模型理解给定概念。这种交互通常涉及纠正现有错误样本、为新样本分配标签或生成完全新样本的某种组合。然而，重点通常在于每次迭代提供足够多的反馈以将模型推向正确方向。Fails
    和 Olsen [2003] 假设“拥有非常快的训练算法比强归纳更重要”。这基于用户将采用迭代策略最终提供必要预测能力的假设。


    Fogarty et al. [2008] 观察到用户首先专注于使分类器工作，然后通过向训练中引入更多边界情况来寻求提高鲁棒性。这与教师的做法相似，即首先介绍基本概念，然后再探索该概念的扩展。Porter
    et al. [2013] 将模型引导活动期间模型与用户之间发生的交流称为训练对话。这种对话的丰富性和灵活性直接受界面设计和可用交互方法的影响。Gesture
    Script 应用 [Lü et al. 2014] 提供了引人入胜且吸引人的对话的绝佳示例，展示了用户智能如何应用于不仅仅是分配或纠正标签。在通过提供新样本提高手势识别性能的同时，Gesture
    Script 允许用户创建描述手势底层结构的渲染脚本。例如，用户可以指定箭头由一条线和一个三角形形状的头部组成。这种方法支持新手势样本的合成，有助于引入更多变化，从而获得更大的判别力。因此，Gesture
    Script 中的模型引导活动包含用户可以参与并在预期获益最大的地方提供输入的多个子任务。


    尽管模型引导活动通常被认为具有迭代性，Kleinsmith 和 Gillies [2013] 发现用户不一定会遵循迭代策略。Kleinsmith 和 Gillies
    研究中的一部分参与者在训练其角色行为模型时仅执行了一到两次迭代，并更愿意将精力花费在仔细标记样本上。这一观察突出了用户可能需要在模型引导任务中应用的策略（例如遵循迭代方法）方面获得高层指导的事实，事实上，不能期望非专家用户知道哪种策略最合适。正如
    Kleinsmith 和 Gillies 所建议的，界面应通过可用的交互技术和呈现的视觉反馈来促进这种策略。


    不幸的是，用户也受不一致性和厌倦的影响，这可能导致其任务行为随时间发生变化。不可避免地，用户对概念的感知可能在任务持续时间内发生漂移。例如，用户可能认为的‘风景’图像或‘地方新闻’文章会随着他们接触到更多样本而演变。同样，用户在手势的第一次表达中投入的表现力程度可能与其第一百次表达大不相同。Structured
    Labeling [Kulesza et al. 2014] 是试图解决训练过程中概念漂移的一种尝试。Kulesza et al. 发现，人们在相隔四周的两个不同会话中标记同一网站时仅有
    81% 的一致性。对标记任务提供更多结构产生了更一致的标记。Cakmak 和 Thomaz [2014] 证明，基于自动或启发式的教学指导也可以提高用户反馈的效率和质量。在
    Cakmak 和 Thomaz 的研究中，文本指令被呈现出来以帮助指导用户在训练模型时选择正样本和负样本。在可以描述最佳训练策略的应用中，这些指令可以算法生成并响应模型状态。然而，即使是基于启发式的教学指导也被证明可以提高用户性能。例如，在教授面部表情识别器的实验应用中，教授愤怒面部的启发式方法可能是，“当你展示愤怒面部的例子时，尽可能多地变化它们”
    [Cakmak and Thomaz 2014]。这一发现表明，对任务的适当框架以及界面中相对简单的指导可以积极影响用户性能和模型质量。


    Tsandilas et al. [2009] 提出了手势的‘半结构化延迟解释’概念。这种方法鼓励手势注释而无需指定其含义。这在手势表达时保留了表达自由，但仍允许稍后附加语义含义。这种方法在用户经历概念漂移的情况下可能非常有用

