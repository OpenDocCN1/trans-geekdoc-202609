    - (1) Make task goals and constraints explicit

    - (2) Support user understanding of model uncertainty and confidence

    - (3) Capture intent rather than input

    - (4) Provide effective data representations

    - (5) Exploit interactivity and promote rich interactions

    - (6) Engage the user


    These principles cover multiple aspects across the different activities performed
    in the IML workflow. They also have specific implications for the interface components
    described in Section 4. Each is discussed in detail in the remainder of this section.


    ## 6.1 Make task goals and constraints explicit


    Establishing clear task goals is an important part of Interactive Machine Learning
    for non-experts given that the process is largely user driven. Similarly important
    is an understanding of what is not possible, i.e. the constraints in the process.
    The iterative model refinement paradigm implies that users work in pursuit of
    some desired goal state. For users to construct effective strategies in pursuit
    of this goal state, it is necessary that they understand their task and its constraints.


    This solution principle is largely a response to two of the key challenges for
    IML introduced in Section 1: users can be imprecise and inconsistent, and training
    is open ended. In terms of the first challenge, constructing explicit task goals
    and constraints can aid in focusing user efforts and improving consistency. Many
    recommender systems exploit user input for dual purposes, i.e. a like provides
    a signal of interest to a social group but may also inform predicted recommendations.
    While dual-purpose input with unclear objectives may be suitable for recommender
    systems, we hypothesise that being explicit when requesting user input, whether
    singular, or multi-purpose, is preferable. It stands to reason that when asking
    a user to serve as a component in a closed feedback loop, understanding the information
    presented and actions required is paramount. However, too much information can
    also be confusing and detrimental to performance.


    If user effort and attention is considered as a resource with limited supply then
    it is sensible to ensure that all expended effort is in pursuit of the goal state.
    However, this goal state must be clearly defined. For example, Amershi et al.
    [2011a] observed that when a model reliability metric plot was introduced to the
    CueFlik interface to provide feedback on quality, users began to focus on maximising
    this quantity as their primary objective. Careful framing of the task goals and
    awareness of the interface features that may promote or hinder this understanding
    is required. The literature has explored and discussed the role that model and
    prediction explanations may have on the understanding and mental models of users
    ([Kulesza et al. 2013], [Sarkar 2015]) but there has been less attention given
    to the effect that prior framing of the task may have on users. It is not unreasonable
    to hypothesise that supporting user perception of the global task and constraints
    may improve their ability to select model refinement actions although this should
    be investigated.


    The second challenge revisited above (i.e. the fact that training is open ended)
    can also be mitigated in part through improved user understanding of goals and
    constraints. Interaction with machine learning models differs from more conventional
    computer interactions in that the user may have limited direct control over the
    behaviour exhibited. A key limitation of machine learning is that false positives/negatives
    produced are typically difficult to eradicate. For example, a user may identify
    a suggested movie as being completely outside their category of interest despite
    it possessing many attributes consistent with other favoured content. Amershi
    et al. [2012] note that, “this problem occurs in all machine learning systems
    when the hypothesis language is insufficiently expressive to model the true concept”.
    In other cases, numerous user actions may be required before the learning model
    reflects a desired change [Wong et al. 2011]. An application that does not respond
    in a timely manner to user input is in violation of the principles of direct manipulation
    and is a potential cause of significant frustration. The degree to which a user
    understands their limitations in addressing such model failings may have a significant
    impact on their satisfaction with the interface and the refinement actions with
    which they proceed.


    Without user understanding of the limitations of machine learning techniques,
    the process also exposes the potential risk of overfitting. Overfitting is the
    construction of a model that, although it matches to the data available, does
    not truly represent the phenomenon. Avoiding overfitting while supporting continued
    model refinement poses a unique challenge for supporting non-expert interaction.
    Expert machine learning practitioners are aware of this risk but naive users may
    be prone to over-specification. The interactive tree-based classifier demonstrated
    in [Ware et al. 2001] framed the task goal in a very clear and intuitive form
    but lead to some users expending significant effort to maximise classification
    accuracy with little real gain.


    The user may in many cases not require an understanding of the global objective
    they are working towards provided they understand their role in the immediate
    interaction task. It is unclear what impact understanding the global task may
    have on user performance, however, we would argue it is essential to effective
    performance in the termination assessment and transfer activities.


    ## 6.2 Support user understanding of model uncertainty and confidence


    *Uncertainty* is an inevitable feature of data driven models in most real world
    applications. Correspondingly, the concepts of uncertainty and confidence cannot
    be removed from the IML process. This solution principle seeks to address the
    fact that interacting with a model is not like interacting with a conventional
    information structure (one of the key challenges highlighted in Section 1). Both
    the task of steering the model as well as the ultimate application of the model
    to a target dataset involve uncertainty. It is important that users are aware
    of this uncertainty for two reasons: 1) to manage their expectations during interaction;
    and 2) to manage their expectations of final system performance.


    The concept of a probabilistic model and its limitations can be difficult to convey
    to non-experts and so many applications of IML are likely to rely on simplified
    explanations. Users without experience in machine learning are unlikely to comprehend
    the implications of working with a probabilistic model. User studies have found
    that even a single outlier in a classifier can result in significant confusion
    for users [Kim et al. 2015a]. Users will calibrate their trust in the model both
    through individual predictions as well as the performance of the model as a whole
    [Ribeiro et al. 2016]. Furthermore, IML is a co-adaptive process in that both
    the user and model will respond to the behaviour of the other [Gillies et al.
    2016]. Establishing the right level of understanding among users and framing the
    task appropriately is critical and non-trivial.


    Non-experts unfamiliar with the internal behaviours of a computer program will
    construct their own mental model to aid their formulation of interaction strategies.
    This model will be derived in part from their past experience and knowledge. While
    the mental model constructed does not have to be accurate, a poor model may have
    a highly detrimental effect on user performance and thus, their perception of
    the effectiveness of the program [Norman 2014]. It is perhaps useful to make the
    distinction between functional models that allow one to use a system versus structural
    models that allow one to comprehend how and why it works. Gillies et al. [2015a]
    argue that users should be aided in their construction of conceptual models in
    order to enhance their debugging capabilities. As

