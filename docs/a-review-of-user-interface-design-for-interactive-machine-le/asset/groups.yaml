    Fogarty 等 [2008] 观察到，预测模型的演化可能导致从用户角度来看似乎不可预测的行为。Kulesza 等 [2013] 研究了不同解释对终端用户构建的心理模型保真度的影响。研究结果表明，如果用户能够利用增加的理解来改善结果，那么关于智能体的更详细解释是有用的。Sarkar
    [2015] 提出利用元模型来增强机器学习模型，用于置信度（输出是否正确？）、命令（理解是否完整？）和复杂性（得出输出有多简单？）。这种元模型将捕捉更直观且与向终端用户沟通相关的信息，以支持他们的理解。


    已探索了多种策略作为简化模型行为解释的手段。ManiMatrix [Kapoor 等 2010] 允许用户直接与分类器的混淆矩阵交互，从而引导分类行为。Ribeiro
    等 [2016] 提出了对相当复杂的模型进行局部忠实表示的解释。这种方法在隐藏下面可能令人困惑的复杂性的同时支持解释。Violin 等 [2014] 引用建构主义学习理论，提出限制决策树的构建，使其仅表示用户认为可信的关系。使用示例来支持对类别的理解似乎是一种令人信服的有前景的解决方案
    [Kim 等 2015a]。作为模型质量的总结性观点，与对 n 个最佳样本进行排名相比，展示最佳和最差匹配样本已被证明能支持更高效的模型评估 [Fogarty
    等 2008]。ReGroup，即 [Amershi 等 2012] 中介绍的社交网络群组创建工具，展示了基于模型中特征生成的过滤器。参与者指出，这些过滤器提供了对模型所利用的模式的洞察，因此既解释了模型，也发挥了其作为交互元素的预期功能，具有双重目的。


    不确定性在用户界面中难以简洁地表示。Sarkar 等 [2015] 在其 BrainCell 应用中展示了使用着色表示置信度的潜力，然而，在语音识别应用 [Vertanen
    和 Kristensson 2008] 中通过着色表示置信度并未提高用户性能。在信息可视化领域，不确定性的表示是一个关键的研究领域。总体而言，不确定性可视化的目标是提供有助于数据分析和决策的表示
    [Pang 等 1997]。区分不确定性的不同形式是有用的。Pang 等 [1997] 描述了三种不确定性类型：统计（数据的分布）、误差（与数据点的偏差）和范围（可能值的区间）。


    在机器学习社区中，也有人对以支持人类理解的方式表示模型质量感兴趣。称为 t-分布随机邻域嵌入（t-SNE）的技术能够实现聚类模型的视觉表示 [Van der
    Maaten 和 Hinton 2008]。这种表示易于查询，并支持非专家对底层模型置信度的推理。Micallef 等 [2012] 提出了对支持贝叶斯推理的解释方法的调查。该研究的观察结果揭示了设计问题的困难之处，即与视觉辅助搭配的
    *不含数字* 的文本比 *含数字* 的文本和视觉效果取得了更高的性能。


    文献表明，用户对错误的容忍度与系统不确定性的清晰程度之间可能存在密切关系 [Sacha 等 2016]。用户在应用中愿意容忍的错误程度是任务特定的（例如，将在
    ATM 取款时遇到的错误与导航系统给出的错误转弯指令进行比较 [Fogg 和 Tseng 1999]）。如果用户理解他们对错误输出负有部分责任，那么他们在感知系统时可能会更宽容。用户会根据对系统属性的理解来校准他们对系统的信任。Muir
    和 Moray [1996] 认为行为必须可观察，信任才能增长。


    进行知情预测是交互式机器学习的关键挑战。这与更传统的编程任务形成对比，后者在本质上系统是可预测且可重复的。模型中的不确定性对机器学习专家从业者具有根本性的兴趣。然而，有效地解释模型准确性可能非常困难，并且本身就是一种需要学习的技能。


    ### 6.3 捕获意图而非输入

    界面的精心设计可能有助于从潜在嘈杂的输入操作中提取用户意图。这一解决方案原则是对第 1 节提出的挑战的回应，即用户意图与用户输入之间存在不确定性。减少这种不确定性显然是人机交互的更广泛目标，但
    IML 的具体情况意味着对用户输入的混淆对模型训练过程尤其有害。


    Fogarty 等 [2008] 指出，算法无法区分用户认为高度相关的样本与可能只是轻微不一致的内容。CueFlik [Fogarty 等 2008] 通过仅显示最佳和最差匹配来缓解此问题，从而使不太确定的训练样本通常处于视野之外。因此，用户被引导专注于肯定是“好”或肯定是“坏”的样本。


    Amershi 等 [2012] 进行的研究提供了关于显式和隐式用户输入的交互性的若干潜在有用见解。用于构建自定义社交网络的交互式机器学习应用利用了显式和隐式用户操作。例如，用户跳过联系人被用作这些联系人应标记为负样本的指标。Ritter
    和 Basu [2009] 在文件选择 IML 应用中应用了类似的假设，从光标悬停行为中提取隐含的用户意图。Self 等 [2016] 提出了一项信息丰富的研究，探讨了如何通过谨慎的交互设计帮助从用户操作中对用户意图做出更好的推断。例如，Self
    等 演示了在拖动数据点时添加圆形选择工具如何促使用户思考并选择该点应与之聚类的其他点。


    正如 Porter 等 [2013] 所观察到的，“用户在利用少量（不足的）工具以达到目标方面非常擅长创造性使用，因此计算机必须学会利用更不结构化的对话”。换句话说，在用户无法明确表达其意图的情况下，他们仍可能通过利用一系列操作来实现目标。一个例子是
    Gesture Script [Lü 等 2014]，它允许用户通过绘制子段然后以编程方式描述它们如何组合形成完整手势来合成手势样本。为了适应用户可能采用的“创造性”引导过程方式，界面设计师因此应考虑避免过度受限的功能或工作流程。


    ### 6.4 提供高效的数据表示

    有效的 IML 界面将增强用户感知或至少充分利用人类感知能力。在 IML 过程中模型引导活动中的审查样本输出的子任务在很大程度上是理解任务。鉴于模型引导活动的迭代性质，改进此操作的
    speed 和质量具有高影响。自适应交互框架 [Payne 和 Howes 2013] 进一步表明，用户采用的策略将由其经验、任务级目标以及处理与任务相关信息的能力决定。从用户交互的角度来看，这一第三因素表明了一种潜在的杠杆，即放大用户的认知能力，从而可能激活以提高性能并进而提高模型质量。

