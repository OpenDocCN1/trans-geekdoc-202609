  - '[PAGE 6]


    Model/algorithmic agnosticism is a design objective for IML systems but not readily
    achievable. An IML system which allows the user to switch between different model
    structures and algorithms while maintaining the same or similar interfaces and
    interactions provides greater flexibility without a significant re-familiarisation
    cost. Certain machine learning techniques are more suited to direct interaction
    and partial inspection than others. The machine learning community is hard at
    work developing new and more powerful techniques. There is growing interest in
    probabilistic machine learning methods that better capture and represent uncertainty
    [Gharamani 2015]. However, techniques such as deep neural networks (which have
    recently made significant advances) deliver functionality without any clear way
    to support inspection or interaction.


    An IML process may also leverage multiple models, either to deliver ensembled
    functionality or for comparative evaluation purposes. An ideal IML system architecture
    would allow for state-of-the-art techniques to be introduced with minimal adjustment.


    # 2.1.3  *Data.*


    The data component in an IML system is analogous to the source code in a conventional
    program. The user selects, describes or generates data in order to indicate how
    the model should behave in response to certain inputs. It can be useful to think
    of such a labelled data point as a training sample. Unlabelled data may also contribute
    to the construction of a model by inferring its association with other data points.
    Data type agnosticism is also a design objective for IML systems but similarly
    difficult to achieve. Users are likely to value the ability to apply a familiar
    IML system to whatever data type is dictated by the problem domain. IML systems
    have been developed targeting a range of data types including images, text and
    motion data. Section 3 provides a survey of IML applications across different
    data types. The features relevant to each data type may vary considerably. Early
    studies in IML typically avoided user involvement at the feature level but there
    has been a recent shift towards greater transparency and even user involvement
    in feature selection. It does indeed seem desirable to apply domain expertise
    at the feature selection level in certain circumstances provided effective interfaces
    and interaction methods exist.


    # 2.1.4  *Interface.*


    The user interface and its interplay with the user is the central focus of this
    article. A further decomposition of the interface into its potential sub-elements
    is presented in Section 4. Although this section presents a structural breakdown
    of an IML system, it is useful to highlight the distinction between the interface
    component and the actual interactions that it supports. The interactions available
    to a user are dictated by the interface, but as a designer, it is of course useful
    to think in terms of interactions when building an interface. Our discussion of
    the user interface design for IML thus encompasses the design of corresponding
    interaction techniques, and these two aspects are distinguished where possible.


    The interface component is responsible for the bidirectional feedback between
    the user and the model/data. It must support both the input and output mechanisms
    necessary to provide this functionality. Constraints imposed on the richness of
    the labelling or demonstration process represent an efferent filter on the user’s
    intent which may have negative consequences for user satisfaction and model quality.
    Limitations of the visual representation of sample points for review represent
    an afferent filter on the user’s perception and understanding which may also degrade
    performance and satisfaction.


    A central argument in this article is that the interface design is critical to
    the success of the IML process. Careful management of the user workflow and interactions
    can address the four key challenges raised in Section 1: i) users can be imprecise
    and inconsistent; ii) there is typically a degree of uncertainty in the relation
    between user input and user intent; iii) interacting with a model is not like
    interacting with a conventional information structure through an interface; and
    iv) training is open ended.'
  - '[PAGE 7]


    # 2.2 Related domains


    The machine learning community has sought to make its techniques more accessible
    to end users. There are a growing number of packaged toolkits (e.g. WEKA [Hall
    et al. 2009] and Scikit-learn [Pedregosa et al. 2011]) and automated functionality
    (e.g. The Automatic Statistician [Lloyd et al. 2014]). Fiebrink’s thesis introduces
    Wekinator [Fiebrink 2011], a stand-alone application for applying supervised machine
    learning to real-time data streams and particularly suited to music composition
    and performance.


    The concept of “Machine Learning as a Service” (MLaaS) has also recently emerged
    in response to the demand for advanced analytics and data driven applications
    within industry [Ribeiro et al. 2015]. Many service oriented machine learning
    platforms now exist including those offered by major companies such as Google,
    Microsoft, Amazon and IBM. While these services do provide access to machine learning
    functionality paired with powerful computing back-ends, they still require familiarity
    with the techniques for their effective use.


    Exposure of machine learning techniques to non-experts has occurred only more
    recently through applications such as email filters and recommender systems. Recommender
    systems are a form of Interactive Machine Learning in that the model of the user’s
    preferences is iteratively constructed through interpreting their actions such
    as liking, disliking, purchasing and reviewing. However, in many of these applications
    the user may be unaware that they are interacting with an algorithm that is learning
    in response to their inputs. Some recommender systems do explicitly inform users
    that they can influence the behaviour of their preference model and/or provide
    an interface to do so, but even in these cases, the interaction typically focusses
    more on data capture than on a bipartite process of closed-loop model refinement.
    In this article, we specifically focus on Interactive Machine Learning from an
    interface design perspective. While the algorithmic backends of recommender systems
    and their considered approach to implicit and explicit user input is certainly
    relevant to understanding Interactive Machine Learning more generally, the lack
    of focus given to the process excludes them from broader discussion in Section
    3.


    It is useful to explicitly highlight the distinction between Interactive Machine
    Learning and the related concept of Active Learning. Active Learning is a machine
    learning technique that focuses on selecting new points for labelling by the user.
    The key distinction from IML is that point selection is driven by the learner
    rather than the user. IML may also leverage learner driven point selection strategies
    but not to the exclusion of user driven input. For a survey of Active Learning,
    see [Settles 2010]. Reinforcement Learning is a machine learning technique that
    guides the learner towards a desired behaviour based on simple reward feedback.
    Research has examined the potential for humans to be positioned inside this loop
    as a means to steering the Reinforcement Learning algorithm. Knox and Stone [2015]
    provide a detailed overview of a series of experiments on reinforcement learning
    based on human derived reward feedback.


    Beyond human-computer interactions, IML related concepts have also been explored
    in human-robot interaction research ([Losing et al. 2015], [Javdani et al. 2016],
    [Gopinath et al. 2016]). Gopinath et al. [2016] are motivated by the need to adjust
    levels of robotic assistance to accommodate the user’s requirements. A motor impairment
    injury or illness may result in dynamic levels of capability even among a single
    user through the stages of recovery or degeneration. Supporting user-driven customisation
    of the level of assistance is a prime application for IML. There is also some
    overlap between IML and aspects of Knowledge Discovery in Databases (KDD) (see
    [Holzinger 2013]) and Interactive Optimisation (see [Meignan et al. 2015]). IML
    differs from these fields in the emphasis given to the role of the user and the
    process rather than the end goal.'
