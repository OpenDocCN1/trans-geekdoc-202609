    IML 应用中都是必需的。因为


    ### 4.2 反馈分配


    反馈分配界面是用户用来分配标签、选择特征和/或生成新样本的渠道。这个界面在界面元素和所提供的交互技术方面可能需要最精心的设计。用户在描述分类或执行演示时的交互可以采取多种形式。Porter
    等人 [2013] 对训练词汇和训练对话做出了有用的区分。Porter 等人提出，IML 中的训练词汇已从仅包含标签扩展到包含约束和结构。类似地，训练对话不再仅仅是批处理过程，而是可以高度交互和动态的。通常，从用户的角度来看，更倾向于更完整、更具体的反馈分配方法。然而，正如
    Hartmann 等人 [2007] 所指出的，在用户对行为的控制愿望与以机器为中心的‘旋钮’使用户不堪重负之间，存在不可避免的权衡。


    BrainCell [Sarkar 等人 2015] 通过标准电子表格范式获取用户输入，而其他研究则捕获了原始手势输入 [Katan 等人 2015]、[Sarasua
    等人 2016]。Kim 等人 [2015a] 发现用户希望描述难以编码为特征的高级属性（如代码结构）。约束标注或演示过程可能会对用户意图产生过滤效应，最终可能损害用户满意度和模型质量。同样，让用户面对实现不佳或令人困惑的交互技术，可能会降低整体性能。


    从用户收集输入时面临的一个困难是，他们试图训练的概念可能会随时间漂移 [Kulesza 等人 2014]。这激发了人们在如何要求用户提供输入以及如何提供输入方面改进结构和指导的努力。Rosenthal
    和 Dey [2010] 研究了可以提供哪些信息来提高标签质量（上下文数量、上下文级别、不确定性、预测以及用户反馈请求）。某些构造还可以让用户更有参与感，并促进更高质量的输入。例如，Huang
    等人 [2013] 通过提供用户评论涉及的类别的当前预测，激励用户修复餐厅评论情感分析中的错误。


    Shilman 等人 [2006] 介绍了校正界面的五个设计原则：1) 通过选择适当的操作符来最小化决策点；2) 设计模式之间的无缝转换；3) 提供所有状态的可达性；4)
    适当限定级联更改的范围；5) 促进清晰的用户模型。Shilman 等人 [2006] 还总结了可能的校正策略：n-best 选择、转换、用户驱动提示和用户驱动约束。


    Amershi 等人 [2012] 指出，对概念建模的能力取决于数据的质量。多项研究已经探索了将显式和隐式用户输入转换为可供学习器消费的数据的新方法。在 [Amershi
    等人 2012] 中描述的系统利用用户跳过实例（社交网络中的联系人）作为标记负样本的指标。Javdani 等人 [2016] 试图利用用户在共享自主权下对机器人行动的抵制，作为识别不良行动的手段。在
    IML 研究中，特征标记（而不仅仅是实例标记）的潜力也正在被利用（例如 [Wong 等人 2011]），但这确实要求学习算法能够利用这些识别出的特征差异。然而，在某些应用中，特征本身可能过于抽象，用户难以有效解释或利用
    [Gillies 等人 2015a]。


    ### 4.3 模型检查


    除了审查单个样本实例外，全面的 IML 过程通常还支持模型级别的某种形式的检查。这种对模型质量的总结性视图在这里称为模型检查界面。模型质量的评估不一定仅限于预测准确性，还可能包含其他指标，如覆盖率和置信度。多项研究表明，用户与参数（例如
    [Kapoor 等人 2010]）和/或涌现结构（例如 [Chang 等人 2016]）进行交互的潜力，可作为模型检查界面的一部分。GaussBox [Françoise
    等人 2016] 提供了一种有形的、可交互的工具，用于检查为手势识别训练的 HMM。


    预测的质量最终取决于所构建模型的质量。各种错误来源可能影响模型质量。Amershi 等人 [2015] 确定了模型错误的三个主要原因：1) 错误标记的数据；2)
    特征缺陷；3) 数据不足。错误标记的数据是指用户错误地分配了某些值的数据。当模型没有足够的给定特征样本来进行区分时，会导致特征缺陷错误。当与模型预测相关的数据区域存在空白时，会导致数据不足错误。因此，全面的模型检查界面应支持用户识别此类错误，以促进调试并提高模型质量。


    受试者工作特征（ROC）曲线和成本曲线通常用于机器学习社区中，以支持模型性能评估，并已被纳入 IML 系统。或者，可以通过有针对性的测试以更复杂的方式评估模型性能。Groce
    等人 [2014] 提出了测试方法的三个要求：算法无关性、在交互环境中运行速度足够快，以及能够使用相对较小的测试套件有效检测故障。然而，构建测试以获得模型质量的综合指标并非易事，尤其是对于最终用户而言。Fleishman
    等人 [2011] 强调，基于训练集划分的评估可能没有意义，而且 IML 中的最终用户可能特别不适合选择能够代表预期未来数据的测试集。


    近年来，交互式机器学习中的质量评估和调试任务受到了更多关注。虽然在某些应用中（如图像数据）可能可以快速直观地检查模型性能，但对于其他数据格式（例如文档）这样做则更为复杂。这种难度随着数据集规模的增大而增加。Amershi
    等人 [2015] 提出了 ModelTracker，这是一种用于调试练习的模型性能的简明可视化表示。该表示允许快速评估标记样本被正确或错误预测的位置以及该预测的相对置信度。


    模型检查界面为用户提供全局任务的可视性，即通常最小化预测误差。该界面允许用户应用迭代地朝着期望模型质量水平努力的策略。然而，我们稍后将论证，仅根据模型质量来定义任务完成标准是不可取的。仅让最终用户关注模型预测准确性可能助长过拟合。因此，我们区分*模型检查*界面和*任务概览*界面。


    ### 4.4 任务概览


    一个独立的 IML 系统可能还需要向用户提供有关任务状态和终止条件的信息。在大多数实验性 IML 系统中，该界面并未包含在内，因为交互是通过其他方式（如定时练习或受限数据集）进行管理的。然而，在现实中，存在一些重要的任务相关决策，用户需要指导，这些决策可能与即时模型质量无关。


    Yimam 等人 [2015] 强调，文本分类系统很可能会达到用户标注收益递减的程度。Ghani 和 Kumar [2011] 也主张区分系统性能和分类准确性。任务概览界面应提供全局目标的可视性，同时还应结合与任务相关的其他信息（如模型的目标应用和训练数据的可用性）来提供情境信息。


