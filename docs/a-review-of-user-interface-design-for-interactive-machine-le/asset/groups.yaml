  mdcn: '


    模型/算法不可知论是IML系统的一个设计目标，但并非轻易就能实现。一个IML系统若能允许用户在保持相同或相似界面与交互的同时，在不同模型结构和算法之间切换，就能在无需付出大量重新熟悉成本的前提下提供更大的灵活性。某些机器学习技术比其他技术更适合直接交互和部分检查。机器学习界正在努力开发新的、更强大的技术。人们对能够更好捕获和表示不确定性的概率机器学习方法兴趣日益增长
    [Ghahramani 2015]。然而，诸如深度神经网络（近年来已取得重大进展）之类的技术，在提供功能的同时，却没有任何清晰的方式来支持检查或交互。


    IML过程也可能利用多个模型，要么是为了提供集成功能，要么是为了进行对比评估。一个理想的IML系统架构应能以最小的调整引入最先进的技术。


    ### 2.1.3 数据


    IML系统中的数据组件类似于传统程序中的源代码。用户选择、描述或生成数据，以指示模型应当如何响应特定输入。将此类带标签的数据点视为训练样本是很有用的。未标注的数据也可以通过推断其与其他数据点的关联来帮助构建模型。数据类型不可知论也是IML系统的一个设计目标，但同样难以实现。用户很可能重视将熟悉的IML系统应用于问题领域所要求的任何数据类型的能力。目前已开发出针对多种数据类型的IML系统，包括图像、文本和动作数据。第3节提供了跨不同数据类型的IML应用综述。与每种数据类型相关的特征可能差异很大。早期的IML研究通常避免在特征层面让用户参与，但最近已转向更高的透明度，甚至让用户参与特征选择。的确，在某些情况下，只要存在有效的界面和交互方法，在特征选择层面应用领域专业知识似乎是可取的。


    ### 2.1.4 界面


    用户界面及其与用户的交互是本文的核心焦点。第4节将对界面进一步分解为其潜在子元素。尽管本节展示了IML系统的结构分解，但仍需强调界面组件与其所支持的实际交互之间的区别。用户可用的交互由界面决定，但作为设计者，在构建界面时以交互的角度思考当然是有用的。因此，我们对IML用户界面设计的讨论涵盖了相应交互技术的设计，并在可能的情况下对这两个方面加以区分。


    界面组件负责用户与模型/数据之间的双向反馈。它必须支持提供此功能所必需的输入和输出机制。对标注或演示过程丰富性施加的限制，相当于对用户意图的一种传出过滤器，可能对用户满意度和模型质量产生负面影响。用于审查的样本点可视化表示的局限性，相当于对用户感知和理解的一种传入过滤器，也可能降低性能和满意度。


    本文的一个核心论点是，界面设计对IML过程的成功至关重要。对用户工作流程和交互的审慎管理可以应对第1节中提出的四个关键挑战：i) 用户可能不精确且不一致；ii)
    用户输入与用户意图之间的关系通常存在一定程度的不确定性；iii) 与模型交互不像通过界面与常规信息结构交互；iv) 训练是开放式的。


    ### 2.2 相关领域


    机器学习界一直在努力使其技术更易被最终用户使用。越来越多的打包工具包（如WEKA [Hall et al. 2009]和Scikit-learn [Pedregosa
    et al. 2011]）以及自动化功能（如The Automatic Statistician [Lloyd et al. 2014]）不断涌现。Fiebrink的论文介绍了Wekinator
    [Fiebrink 2011]，这是一个将监督式机器学习应用于实时数据流、特别适合音乐创作和表演的独立应用程序。


    “机器学习即服务”（MLaaS）的概念也最近应运而生，以响应行业内对高级分析和数据驱动应用的需求 [Ribeiro et al. 2015]。现在存在许多面向服务的机器学习平台，包括谷歌、微软、亚马逊和IBM等大公司提供的平台。虽然这些服务确实提供了机器学习功能并配以强大的计算后端，但有效使用它们仍然需要熟悉相关技术。


    机器学习技术向非专家的普及只是最近才通过电子邮件过滤器和推荐系统等应用实现。推荐系统是交互式机器学习的一种形式，因为用户偏好模型是通过解读其行为（如喜欢、不喜欢、购买和评论）而迭代构建的。然而，在许多此类应用中，用户可能并未意识到他们正在与一个根据输入进行学习的算法交互。一些推荐系统确实明确告知用户，他们可以影响其偏好模型的行为，并/或提供相应的界面，但即使在这些情况下，交互通常也更侧重于数据捕获，而不是闭环模型细化的双向过程。在本文中，我们特别从界面设计角度聚焦于交互式机器学习。虽然推荐系统的算法后端及其对隐式和显式用户输入的考虑方式确实与更普遍地理解交互式机器学习相关，但由于其对过程缺乏关注，这些系统在第3节的更广泛讨论中被排除在外。


    明确指出交互式机器学习与相关概念主动学习之间的区别是有益的。主动学习是一种机器学习技术，专注于选择新的点供用户标注。其与IML的主要区别在于，点的选择由学习器驱动，而非用户。IML也可以利用学习器驱动的点选择策略，但不能排除用户驱动的输入。关于主动学习的综述，参见
    [Settles 2010]。强化学习是一种机器学习技术，基于简单的奖励反馈引导学习器朝向期望行为。已有研究探讨了将人类置于该循环之内以引导强化学习算法的可能性。Knox和Stone
    [2015] 详细概述了基于人类衍生奖励反馈的强化学习系列实验。


    除了人机交互之外，IML相关概念也在人机交互研究中得到了探索（[Losing et al. 2015]、[Javdani et al. 2016]、[Gopinath
    et al. 2016]）。Gopinath等人 [2016] 的研究动机是需要调整机器人辅助水平以适应使用者需求。运动损伤或疾病即使在单个用户中也可能导致能力的动态变化，这取决于其处于康复或退化的哪个阶段。支持用户驱动的辅助水平自定义是IML的一个主要应用。IML与数据库知识发现（KDD）的某些方面（参见
    [Holzinger 2013]）和交互式优化（参见 [Meignan et al. 2015]）也存在一定重叠。IML与这些领域的区别在于，它更强调用户和过程的作用，而非最终目标。


    '
