    一个有效的系统会让用户参与到正在执行的任务中，使他们有动力实现IML应用的目标结果。然而，这种参与不应以过度的脑力负担为代价。Early等人 [2016]
    提出，呈现部分预测可以通过鼓励用户主动提高预测质量来保持用户的参与度。这种反馈即使不完整，也有助于提醒用户：他们是流程中的关键组成部分，他们的活动正在产生影响。


    Porter等人 [2013] 提出要区分两类IML用户：一类是在必须被诱导提供反馈的领域中操作的用户，另一类是应用于科学、工程、健康和国防等领域，这些领域中的用户会内在地有动力去训练高质量模型。在后一种情况下，用户可能寻求采用高度复杂的策略；而在前一种情况下，目标可能是尽量减少对用户的打扰。尽管这取决于具体应用，用户通常不喜欢执行琐碎的标注任务或回答重复的是/否类型问题[Cakmak
    et al. 2010]，并且在存在可提供见解之处确实会寻求提供见解 [Kim et al. 2015a]。然而，用户表现出有限理性，并会根据感知到的收益与努力进行满意化决策
    [Piroli 和 Card 1995]。促进参与可能会增加用户愿意投入到优化过程中的时间，从而对训练模型的质量带来相应好处。


    减少解读输出（见第6.4节）和表达反馈（见第6.5节）所需的工作量可以增强用户参与度。以图像为中心的IML系统中典型的总结视图，可能比文本数据IML系统中的类似视图更具吸引力。同样，任务中支持的交互水平也可能有助于提升用户参与度。诸如
    [Katan et al. 2015] 和 [Sarasua et al. 2016] 中引入的界面，允许用户通过身体活动生成和展示样本。


    提供训练分类器进展的直观表示，例如 ModelTracker [Amershi et al. 2015]，是让用户参与任务的另一种潜在方式。Huang等人
    [2013] 发现，能够可视化与其餐厅评论相关的当前预测的用户，会有动力去修复任何问题。


    ## 7 开放研究问题


    交互式机器学习中正在涌现许多有望带来新的强大应用的研究领域。从用户交互的角度来看，许多其他有价值的研究途径也需要关注。基于文献中发现的空白，以及在撰写本文时通过整合和综合过程发现的空白，提出了以下研究方向。


    ### 7.1 启动和引导用户


    用户心智模型在IML过程中的作用最近受到了一些关注（[Kulesza et al. 2013]，[Sarkar et al. 2015]），在训练期间改进任务引导的潜力也是如此（[Cakmak
    and Thomaz 2014]，[Kulesza et al. 2014]）。这些研究表明，应用相对简单的策略可以提高用户的一致性和理解力。除了扩展这项关于在执行中指导任务级策略的工作之外，进一步的研究还应审查给用户的初始说明和框架设定。与执行相关的指导相比，对适当用户启动的更好理解也许更有可能在IML应用中具有普适性。这反过来可能有助于突出与IML中用户心智模型形成相关的更具体的解决方案原则。


    随着涵盖第5节所述全部活动的更全面IML流程的出现，研究所需用户指导以支持在全局任务活动之间切换的决策具有价值。用户必须能够建立有效的策略，以某种方式将模型引导活动与更广泛的任务目标以及模型配置和部署等相关活动联系起来。


    ### 7.2 捕获、表示和推理不确定性


    如前所述，使用模型进行预测的一个关键方面是不确定性。数据和预测不确定性的概念并不总是被最终用户很好地理解，因为他们传统上将计算机与精确性和可重复性联系在一起。此外，不确定性可能难以简洁地视觉化表示。Micallef等人
    [2012] 表明，即使提供了简洁的视觉和文本指导，非专家在概率推理任务中仍然很吃力。虽然最合适的方法可能因数据和应用而异，但贝叶斯机器学习方法在融入不确定性概念方面提供了明显优势
    [Ghahramani 2015]。


    研究这些方法与直观不确定性可视化技术相结合的应用具有价值。Horvitz早期关于混合主动界面的工作应用了用户意图的概率模型来支持不同界面模式的选择。类似的方法可能适用于捕获用户输入中的不确定性。贝叶斯框架的具体优势在于从一开始并在整个模型组件中嵌入不确定性的估计。允许用户查看模型不确定性及其演变可能有助于提高理解和性能，但必须注意确保这种反馈提供真正的见解，而不会产生不利的副作用，例如分散注意力或将注意力从界面的其他关键方面引开。


    ### 7.3 通过沉浸式环境增强感知、交互和参与


    Holzinger和Jurisica [2014] 主张使用交互式工具和支持高维、多模态的表示。增强现实和虚拟现实头戴式显示器的最新进展，为用户与复杂的多维数据集交互和探索提供了新的机会。可以合理认为，更自然的交互可能因此有助于提高理解并降低模型优化的感知成本。


    将用户置于沉浸式环境中还可以促进更自然的发现和学习机制。Gillies等人 [2015b] 展示了全身交互作为IML过程一部分的潜力。将用户置于沉浸式环境中，很可能与应用于手势和动作识别应用的IML过程特别相关。与传统二维显示器相比，沉浸式三维界面还提供了额外的数据表示机会。另一个附加好处是，愉快的沉浸式体验也可能提高用户参与度。然而，正如信息可视化领域的大量研究成果所示，构建直观且信息丰富的多维数据表示并非易事。


    ### 7.4 评估IML中的界面和用户表现


    评估交互式机器学习用户界面的任务需要仔细考虑，因为它们具有与传统用户界面不同的各种特征。对于用户训练模型来捕获他们自己个人概念的情况，Groce等人 [2014]
    强调，可能只有该特定用户才能正确评估其模型的质量。


    此外，由于分析和学习的纵向性，为认知密集型任务设计的界面可能难以评估。评估旨在提供增强认知的信息可视化面临的一个关键挑战是，洞察力是“在时间上难以捉摸的”，因为刺激可能在暴露很久之后才触发反应
    [Carpendale 2008]。


    Gillies等人 [2016] 指出了HCI和机器学习社区在评估开发方法方面的不同传统（即用户研究对比基准测试）。遗憾的是，与传统的机器学习研究（其中替代技术可以在单一数据集上反复评估）不同，人类用户一旦在IML评估中接触过某个问题，就无法忘记自己的经验并被重新测试。HCI社区不妨建立与交互式机器学习引入的具体挑战相关的代表性数据集，甚至可能建立代表性结构化任务。这可能促进更广泛的机器学习社区更好地参与，同时支持识别可泛化的需求，并实现界面的比较评估。


    ## 8 结论


    机器学习技术正慢慢渗透到非专业用户的生活中。让用户能够有效地与这类算法交互，很可能是未来十年的关键设计挑战。交互式机器学习为协助用户完成数据密集型处理任务、提高分析任务的结果，以及支持无需显式编程即可开发相对复杂的功能提供了新的机会。IML是一个共同适应的过程，由用户驱动，但随着模型和用户在训练过程中共同演变，其本质上是动态的。用户可能会根据模型中观察到的行为调整其策略，而模型也会相应变化，但变化方式并非完全可预测。


    训练模型这一任务在某些方面使得其交互需求不同于更传统的人机界面。新的、令人兴奋的机器智能的应用，必须伴随为这类应用精心设计的用户界面，这一点很重要。研究开始更多地关注那些使此类应用有效且使用愉悦的界面特性。研究表明，即使是非专业用户也想要更多地了解他们正在交互的模型，以及如何提高其准确性。


    本文综述了在一系列应用中应用IML过程的重要努力。该综述表明，IML方法在一系列基础数据类型上具有实用性。此外，各种实现之间存在一定程度的共性。对文献的综合构成了所提出的结构性和行为性IML模型的基础。第4节中确定的界面要素提供了关于界面设计的通用视角。


