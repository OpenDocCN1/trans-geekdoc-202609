  - '[PAGE 26]


    Extracting information from small or simple datasets is typically achievable with
    standard analytic techniques. Machine learning comes into its own when the complexity
    and size of the target data would frustrate more established approaches. Consequently,
    end-user interaction with machine learning must also provide ways for viewing
    and interacting with voluminous, multi-dimensional and multi-modal data. Some
    interfaces support rapid understanding of model outputs such as the visualisation
    of image regions associated with different classification predictions [Ribeiro
    et al. 2016]. Text classification applications may highlight words or n-grams
    to help the user perceive what features are being exploited by the model [Wallace
    et al. 2012]. The general design objective would appear to be to maximise user
    perception of the features relevant to understanding the function of the model
    and any of its deficiencies, so that appropriate refinement actions can then be
    selected.


    Interfaces designed to support interaction with complex data will typically aim
    to present a simplification of the data (e.g. clustered, hierarchically organised,
    subset, etc.) and/or amplify the user’s cognitive ability (e.g. highlight relevant
    regions, support interaction, provide useful tools, etc.). Visualising multidimensional
    data in a sensible manner can be extremely difficult and the preferred representations
    may be highly data specific. This complicates efforts to generalise design principles
    for representation techniques in end-user applications. Parallel coordinates is
    one technique for transforming high-dimensional data into a representation with
    reduced dimensionality. However, collapsing dimensions typically degrades the
    visual information available and prevents more subtle patterns from being perceived.
    The presentation of multidimensional data may also introduce new obstacles to
    user cognition such as disorientation and occlusion. Researchers in information
    visualisation seek to enhance user cognition by making patterns, trends, relationships,
    outliers and other correlations more immediately observable [Card et al. 1999].
    Interfaces for Interactive Machine Learning must also exploit these techniques.
    Stolper et al. [2014] offers four design guidelines for dynamic visualisations
    in progressive analysis: 1) avoid distractions due to excessive view changes;
    2) highlight where new results have appeared; 3) provide a refresh capability
    to add new results; and 4) allow users to designate regions of interest and parts
    of the problem space to ignore.


    # 6.5 Exploit interactivity and promote rich interactions


    The user’s interactions during the IML process are what drive model development.
    The model development process can thus be made more efficient by enabling users
    to fully express their intent and apply their insight. This solution principle
    suggests that the IML interface should be maximally interactive and should exploit
    rich forms of interaction where possible, for example direct sketching on images,
    constructing explanations, and editing of samples.


    # 6.5.1 Interaction for understanding.


    Supporting user interaction with machine learning algorithms and complex datasets
    introduces new dimensions to the typical user interface design task. The interaction
    with a model rather than a distinct object makes it difficult to apply many of
    the user interface design principles that are known to be effective. The principles
    of direct manipulation proposed by Shneiderman [1982] are well recognised among
    interface designers. However, the nature of the task of building and interacting
    with a machine learning model may prohibit application of such heuristics, especially
    for non-expert users. In response, it is necessary to foster the construction
    of appropriate mental models among users that help frame this non-traditional
    interaction experience. Shneiderman [1996] presents a type by task taxonomy (TTT)
    which describes seven basic tasks performed by users on seven data types. The
    framework provides guidance on what features either help or hinder in performing
    different tasks on different forms of data. As an example, the application of
    filters to remove uninteresting data from view must be rapidly reflected in the
    display. However, as studies in IML have shown, it may take many user actions
