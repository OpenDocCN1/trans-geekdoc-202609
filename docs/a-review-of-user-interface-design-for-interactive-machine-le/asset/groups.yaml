    面向非专家的基于树的分类应用。用户创建决策分支来构建自己的分类器。Brown 等人 [2012] 提出了一种迭代方法，用于在多维缩放投影可视化界面中学习用户偏好的距离函数。用户可以在散点图可视化窗口中拖出一个或多个点，然后启动学习步骤，以识别一个新的距离函数，从而更好地反映用户期望的数据排列。该过程可以迭代执行，同时保留用户的交互历史，以逐步找到最合适的距离函数。


