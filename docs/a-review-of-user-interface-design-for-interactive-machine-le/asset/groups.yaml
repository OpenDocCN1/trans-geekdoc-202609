    explicit programming makes them attractive to a broad group of potential users.
    The recent explosion in broad interest in machine learning further exacerbates
    the shortfall in intuitive systems that allow non-experts to apply these techniques.
    Interactive Machine Learning (IML) has attracted interest among human-computer
    interaction (HCI) researchers due to the unique aspects of establishing effective
    human interactions under this paradigm.


    IML (defined in detail in Section 2) makes machine learning techniques more accessible
    by careful framing of the training process as an HCI task. The IML process involves
    the user in the training process by, at the simplest level, using human input
    in the example selection, creation and labelling process. A machine learning practitioner
    may be required to deploy the underlying algorithm for use in the IML system but
    is not essential to the training process. In an ideal implementation, the machine
    learning-naïve end user can construct their own learned concepts by creating or
    collecting training data according to their need. In practice, constructing such
    a system is a major challenge for both the machine learning practitioner and for
    the user interface designer. This article focuses primarily on the interface design
    challenge but does highlight points of intersection with the technical challenges
    for the machine learning practitioner.


    Early efforts by Ware et al. [2001] and Fails and Olsen [2003] demonstrated that
    typical machine learning tasks could be framed to take advantage of human input,
    and over the past decade and a half the IML process has seen increasing attention
    within the HCI community. The user providing input to the IML system need not
    possess any deep understanding of the models with which they are interacting.
    The value of the approach is perhaps most evident when one considers the potential
    to allow a domain expert to train a model. Researchers have demonstrated IML systems
    that leverage domain expertise in a range of specific applications including animal
    behaviour annotation [Kabra et al. 2013], insurance claims auditing [Ghani and
    Kumar 2011] and conducting systematic reviews of published medical evidence [Wallace
    et al. 2012]. In these applications, the effort required by the user is significantly
    reduced as the model improves its understanding of the concept being trained.
    Wallace et al. [2012] achieved a reduction in user workload of approximately 40%
    by exploiting the predictions of the trained model to mark particular research
    papers as irrelevant. In this way, IML seeks to apply the complementary strengths
    of humans and computers.


    The IML workflow is inherently co-adaptive in that the user and the target model
    directly influence each other’s behaviour. It is important to recognise that it
    is in fact the interactions, as an emergent property of the interface, that must
    actually accommodate the changing behaviour of the user in response to the model.
    Appropriate design of the interface is *critical* to the success of such systems
    and this presents a unique user interface design challenge. The approach relies
    on the transformation of the data inspection and correction task into an intuitive
    and productive dialogue between human and machine. Achieving this is non-trivial.


    Designing the interface for an Interactive Machine Learning application exposes
    four key challenges. First, users can be imprecise and inconsistent. A user may
    not strictly adhere to a concept during the training process or may introduce
    their own errors and biases into the learning process. Poor training leads to
    poor models but unless users perceive their own deficiencies, this failure is
    attributed to the system.


    Second, there is a degree of uncertainty when relating user input and user intent.
    Users may assign training data based on features that they perceive in an example
    which the system does not or cannot model. In addition, the fact that a user did
    not assign an example to a concept does not necessarily imply that it is a counter
    example.


    Third, interacting with a model is not like interacting with a conventional information
    structure through a user interface. The machine learning model evolves in response
    to user input but not necessarily in a way that is perceived as intuitive or predictable
    by the user.'
  - '[PAGE 2]


    Fourth, training is open ended. For example, if a user is designing a part in
    a Computer-Aided Design (CAD) system, the state of completion is more or less
    binary: the task is complete when the part is fully specified. By contrast, training
    a model to be 100% accurate may be both undesirable and impossible. Furthermore,
    IML has seen extensive use in exploratory and creative applications where the
    actual model is perhaps of secondary importance to the process itself.


    These four key challenges in aggregate make human-centred machine learning, and
    the IML process specifically, a design challenge that is far more complicated
    than simply integrating the relevant components.


    # 1.1 Guidance for the designer


    This paper consolidates research findings related to interface design for IML
    with the objective of providing guidance to designers. It seeks to bring a binocular
    perspective to the challenge of building an effective Interactive Machine Learning
    system: a unified consideration of the application of intelligent algorithms and
    the design of the user interface. We present both a structural and behavioural
    breakdown of an IML system based on our synthesis of the literature. The structural
    breakdown divides the system into its constituent components (the user, the interface,
    the data and the model) with the objective of helping designers think about how
    they might architect such a system. The IML interface is further decomposed into
    four distinct interface elements that serve different functions within the broader
    procedure. Awareness of these distinct interface elements can help designers think
    about how they present information to users and what interactions they promote.


    The behavioural breakdown separates the process of interactively building a model
    into sub-tasks. It is important to note, however, that these tasks may overlap
    and/or be performed iteratively. The structural and behavioural breakdowns are
    not intended to serve as blueprints, but rather to support rich discussion of
    design considerations with clearly defined terminology. This formalisation of
    the design space will contribute to a better foundation for exchange of concepts
    in this emerging field.


    A further contribution of this paper is the identification of emergent solution
    principles that can help guide IML interface designers more generally. The six
    solution principles identified and described in detail in Section 6, are:


    +   (1) Make task goals and constraints explicit

    +   (2) Support user understanding of model uncertainty and confidence

    +   (3) Capture intent rather than input

    +   (4) Provide effective data representations

    +   (5) Exploit interactivity and promote rich interactions

    +   (6) Engage the user


    # 1.2 Outline


    The remainder of the article is organised as follows. Section 2 provides a detailed
    definition of Interactive Machine Learning, and seeks to highlight its similarities
    and distinctions from related techniques. An overview of prominent efforts at
    making machine learning techniques and advanced analytics more accessible to non-experts
    is presented in Section 3, categorised by underlying data type. Section 4 presents
    a structural characterisation of the key interface elements of a generalised IML
    system. An abstracted description of the typical IML process is presented in Section
    5. Section 6 is an attempt to consolidate recent efforts by identifying a number
    of common solution principles. We highlight that tackling user interface design
    challenges and advancing the state-of-the-art requires further research in several
    key areas. We therefore propose four distinct strands of research'
