    # ### 3.3  Time series data: speech, audio, video and motion


    The transcription of speech into text can be a laborious task when performed manually
    but there are an increasing number of systems that can autonomously perform this
    task at very low error rates. Sanchez-Cortina et al. [2012] pair an automatic
    speech recogniser system with an IML interface that facilitates error correction.
    The acceptable word error rate can be adjusted to vary how many uncertain cases
    are shown to the user.


    Kabra et al. [2013] employ an Interactive Machine Learning approach to allow non
    expert users to build classifiers for recognising distinct animal behaviours.
    The user reviews video footage of the animal and assigns behaviour labels to segments
    of the video. When a label is added, the user may initiate re-training of the
    model and the classifier will be applied over the duration of the video. Upon
    encountering a behaviour that has been incorrectly classified, the user may correct
    the sample to incrementally improve model quality. The classifiers constructed
    through this process then allow for rapid and accurate annotation of animal behaviour
    in recorded datasets: a task that is very slow if performed manually and highly
    error prone if performed autonomously using less advanced methods. Versino and
    Lombardi [2011] apply an IML process to the filtering of surveillance streams
    for safeguarding a nuclear processing facility. Users assign positive and negative
    samples of safeguard-relevant events and the trained model can thus help identify
    potential hazards.


    The challenging task of separating individual sources from a recorded audio track
    is explored by Bryan et al. [2014]. Bryan et al. use a paint on approach (similar
