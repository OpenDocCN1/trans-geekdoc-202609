    can be applied to evaluate their specific use case on their specific dataset.


    The execution speed of the learning algorithm may also have implications for interactivity.
    Fails and Olsen [2003] hypothesise that fast algorithms are more important than
    inductive power. Versino and Lombardi [2011] express this attribute in another
    way as the need to ensure computation time at each iteration stays within human
    acceptable levels. These observations are consistent with the direct manipulation
    concept of, “rapid incremental reversible operations whose impact on the object
    of interest is immediately visible” [Shneiderman 1982]. However, certain machine
    learning techniques applied on large volumes of data may unavoidably have very
    large execution times. Careful design of the interface can help to mitigate the
    imposition on interactivity under these circumstances.


    # 6.6  Engage the user


    An effective system will engage the user in the task being performed so that they
    are motivated to achieve the desired outcomes of the IML application. This engagement,
    however, should not come at the expense of excessive mental load. Early et al.
    [2016] suggest that presenting partial predictions can keep users engaged by encouraging
    them to actively improve prediction quality. Such feedback, even though incomplete,
    can be helpful in reminding the user that they are a critical component in the
    process and that their activities are having an effect.


    Porter et al. [2013] suggest a distinction between users of IML operating in domains
    where they must be enticed for feedback versus applications such as those in science,
    engineering, health and defense in which users will be inherently motivated to
    train a high quality model. In the latter case, users may seek to employ highly
    sophisticated strategies whereas in the former case, the objective may be to minimise
    imposition on the user. Although dependent upon the application, users typically
    do not enjoy performing trivial labelling tasks or responding to repeated yes/no
    type questions [Cakmak et al. 2010] and do seek to provide insight where it exists
    [Kim et al. 2015a]. Nevertheless, users exhibit bounded rationality and will satisfice
    based on perceived gains versus effort [Piroli and Card 1995]. Promoting engagement
    may increase the time users are willing to invest in the refinement process with
    corresponding benefits in trained model quality.


