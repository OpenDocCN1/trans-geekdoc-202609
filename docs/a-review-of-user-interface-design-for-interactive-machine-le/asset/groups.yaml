    ## 4 IML 界面的组成


    在本节中，我们描述广义交互式机器学习界面的结构组成。当然，IML 系统的设计可能会因数据性质、模型的预期应用、期望的用户体验以及许多其他因素而有很大差异。然而，理解其共性有助于指导设计原则的建立。


    所呈现的界面元素基于对广泛回顾的 IML 系统之间共性的识别。我们也受到其他人提出的要求和期望属性的指导。Amershi 等人 [2012] 强调了 IML
    过程的三个重要方面，可视为界面的期望属性：1) 展示学习概念的当前状态；2) 指导用户提供改进概念质量的输入；3) 提供允许用户探索模型空间的修订机制。Stumpf
    等人 [2009] 确定了与人类用户和机器学习技术有效集成相关的三项活动：1) 将系统推理传达给用户；2) 将用户推理传达给系统；3) 确保系统和用户都从这一反馈循环中获益。我们将
