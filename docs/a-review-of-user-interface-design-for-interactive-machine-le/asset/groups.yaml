    ## 3 IML 应用综述


    交互式机器学习已被应用于各种数据类型，服务于多种最终用途。在本节中，我们综述了交互式机器学习中现有的方法和应用。本文不旨在提供交互式机器学习及其应用的详尽综述。本文所讨论的文献满足以下条件：i)
    有助于阐明 IML 范式的不同维度，和/或 ii) 特别强调 IML 系统的界面设计考量。我们通过对带引号的短语‘Interactive Machine Learning’进行
    Scopus 检索，获得了一份适当的文献列表。我们对全部搜索结果进行了审查，并根据其是否对上述 i) 和/或 ii) 有所贡献进行了筛选。结果集中文献所引用的参考文献也一并纳入（如相关）。


    这里采用的分类基于应用中研究的基础数据类型。但需要注意的是，许多界面特征和算法方法在不同数据类型之间是通用的。我们努力强调为每种数据类型开发 IML 系统的独特要求，同时提取可推广至不同应用领域的共同特征。


    ### 3.1 文本


    机器学习技术非常适合应用于文本数据。特定领域的文本通常可以大量获取，并且往往已经带有一定程度的人工标注。现代垃圾邮件过滤器就是基于文本数据的机器学习有效改善用户体验的一个例子。


    交互式机器学习系统的开发目标是满足需要更受限或定制化分类的场景。这类分类及其特征可能难以从领域专家那里提取，并且/或者可能难以用编程方式表达。Wallace
    等人 [2012] 提出了 abstrackr，这是一个在线工具，用于支持对已发表医学证据进行系统评价的筛选。当用户从最高相关性的文献开始手动评估并处理临时列表时，系统可以迭代改进其对相关引文的分类。在试点评估中，该系统通过成功将临时列表中的文献重新分类为不相关，将工作量减少了约
    40%。


    同样繁琐的法规分析任务也是 Šavelka 等人 [2015] 的研究对象。Šavelka 等人部署了一个 IML 系统，以促进审查监管框架、识别与给定主题相关条款的过程（在该研究中即公共卫生应急准备与响应）。用户会看到条款的分类结果，并可以修改分配的标签。他们还可以建议对该分类重要的术语。用户可以随时请求根据最近一次反馈迭代重新训练模型。有趣的是，Šavelka
    等人证明，在一个司法管辖区（即堪萨斯州）训练的模型，可以有利地复用于另一个司法管辖区（即阿拉斯加州）的同一主题分析。该系统是 IML 潜力的典型例子：它能帮助用户完成高度特定于问题的任务，同时允许将已投入的工作应用于相关数据集。


    Kim 等人 [2015a] 展示了一个用于构建和编辑学生代码提交分类的交互式界面。该方法通过允许教师选择类别范例来生成不同学生答案类型的分类，已成功应用于编程任务的评分。Yimam
    等人 [2015] 将交互式学习过程应用于医学摘要标注任务。Huang 等人 [2013] 展示了 IML 在辅助餐馆评论撰写和阅读方面的潜力。通过交互式过程，系统可以学习在食物、服务和价格三个类别中突出显示并建议总结性的情感倾向。研究发现，在撰写过程中提供这些建议可以激励用户纠正错误的预测。


    Endert 等人 [2012] 在文本分析中引入了语义交互的概念。他们利用嵌入在交互中的信息，例如词搜索、高亮、注释和文档固定位置的调整，来迭代改进文档关联模型。该信息用于更新文档关联的空间可视化。


    将 IML 过程应用于文本数据所面临的挑战在于，难以提供简洁的文档表示以促进用户快速审查。Kim 等人 [2015b] 比较了多种机器学习技术在文档特征压缩任务中的表现。其目标是找出能够提高用户分类评估速度的表示方法。所讨论的几项研究利用了术语高亮来指示与分类结果相关的特征。据推测，突出显示指示性关键词可以加快评估过程。在特征标注方面，Raghavan
    等人 [2006] 观察到，用户标注一篇文档（即将文档分配到某个主题）所需的时间，最多是标注一个特征（即将一个词指定为某个主题的重要术语）的五倍。


    ### 3.2 图像


    图像分类是机器学习社区中一个非常流行的应用领域。由于已有合适的图像分类技术，人们开始研究通过 IML 将用户输入与之结合的可能性。至于 IML 在文本数据上的应用，当需要更细致的概念辨别能力时，该技术的实用性便会体现。


    在图像间层面，现有应用试图让用户训练模型来理解他们自己的、有时较为模糊的概念。Fogarty 等人 [2008] 推出了 CueFlik，这是一个允许用户创建自己的概念并将其融入图像搜索的交互式应用。用户可以通过分配一组图像来描述期望的概念（例如风景）来定义新的搜索规则。然后用户可将此规则应用于其搜索，从而只提供与该概念一致的结果。Fogarty
    等人 [2008] 发现，与提供完整图像排名相比，同时显示置信度最高的正样本和置信度最高的负样本的可视化能够带来更高质量、更快速的概念学习。Amershi
    等人 [2011a] 通过向界面添加新功能，使用户能够更好地对变化进行建模并可视化当前模型状态，从而扩展了 CueFlik。Amershi 等人还引入了历史模型质量的可视化（以模型可靠性和排序图像的时序快照表示），以及回退到先前模型状态的能力。Guo
    等人 [2016] 提出了一个基于潜在病理状况对医学图像进行聚类的 IML 系统，并尝试具体整合专家约束。用户可以将图像彼此拖开，以表示它们在模型中应断开连接。


    其他 IML 应用则试图训练系统在图像内层面识别特定对象。Crayons [Fails and Olsen 2003] 是 IML 领域经常被引用的奠基性论文，它展示了一种界面，用户可以直接在图像上绘制来逐步训练分类器。Tsutsumi
    和 Tateda [2009] 也采用了这种方法来帮助测量河流中漂浮的落叶碎屑量，以及分析卫星、医学和材料科学图像（[Porter et al. 2011]、[Porter
    et al. 2013]、[Harvey and Porter 2016]、[Kreshuk et al. 2011]）。


    IML 非常适合与图像结合使用，因为已有丰富的特征库可供使用，而且用户可以快速查看大量图像。通过直接在图像上涂画来提供像素级或区域级反馈的能力，是多个应用中成功利用的一种交互技术。

    '
