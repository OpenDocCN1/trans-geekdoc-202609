    # 3  SURVEY OF IML APPLICATIONS


    Interactive Machine Learning has been applied over a diverse range of data types
    for a variety of end use applications. In this section we present a survey of
    existing approaches and applications in Interactive Machine Learning. This paper
    does not claim to provide an exhaustive survey of research in Interactive Machine
    Learning or its applications. The literature discussed herein is that which: i)
    helps to illustrate the different dimensions of the IML paradigm and/or, ii) gives
    special emphasis to the interface design considerations of IML systems. A proportional
    list of literature was obtained by performing a Scopus search on the quote-enclosed
    phrase, ‘Interactive Machine Learning’. The full set of search results was reviewed
    and culled based on its contribution to i) and/or ii) above. Literature referenced
    by that in the result set is also included where relevant.


    The categorisation employed here is based on the underlying data type explored
    in the application. It is important to note, however, that many of the interface
    features and algorithmic methods used are common across data types. An effort
    is made to highlight the unique requirements of developing an IML system for each
    data type while extracting the common features that generalise across application
    areas.


    # 3.1  Text


    Machine learning techniques are well suited to application on textual data. Text
    in specific domains can typically be obtained in high volumes and often already
    incorporates some degree of manual labelling. Modern spam filters are one example
    of effective machine learning based on textual data to improve the user experience.


    Interactive Machine Learning systems have been developed to target use cases where
    a more constrained or custom categorisation is desired. Such categorisations and
    the features that characterise them may be difficult to tease out from domain
    experts and/or may be difficult to express programmatically. Wallace et al. [2012]
    present abstrackr, an online tool to support screening for systematic reviews
    of published medical evidence. The system can iteratively improve its classification
    of relevant citations as the user works through the provisional list, starting
    with their manual evaluation with publications of highest relevance. In pilot
    evaluations, the system was able to reduce workload by approximately 40% by successfully
    reclassifying publications in the provisional list as irrelevant.


    The similarly laborious task of statutory analysis is targeted by Šavelka et al.
    [2015]. Šavelka et al. deploy an IML system to facilitate the process of reviewing
    regulatory frameworks to identify provisions relevant to a given topic (preparedness
    and response to public health emergencies in the case of the study). The user
    is presented with a classification of provisions and can modify the label assigned.
    They may also suggest terms that are important to this classification. At any
    time, the user may request that the model be re-trained based on their most recent
    feedback iteration. Interestingly, Šavelka et al. demonstrate that the model trained
    in one jurisdiction, i.e. Kansas, can be advantageously reused in another jurisdiction,
    i.e. Alaska, for the same topic analysis. This system is a prime example of the
    potential for IML to assist the user in completing a highly problem-specific task
    while also allowing the expended effort to be leveraged on related datasets.


    Kim et al. [2015a] demonstrate an interactive interface for building and editing
    classifications of student code submissions. The approach was successfully applied
    to grading of coding tasks by allowing teachers to choose class exemplars and
    thereby generate a classification of different student answer types. Yimam et
    al. [2015] apply an interactive learning process to the task of annotating medical
    abstracts. Huang et al. [2013] show the potential of IML to assist restaurant
    review authoring and reading. Through an interactive process, the system can learn
    to highlight and suggest summary sentiment in the three categories of food, service
    and price. The study found that providing these suggestions during authoring can
    motivate users to correct erroneous predictions.'
  - '[PAGE 9]


    Endert et al. [2012] introduce the concept of semantic interaction in text analytics.
    They make use of the information embedded in interactions such as word search,
    highlighting, annotations, and adjustment of document pin locations to iteratively
    refine a model of document associations. This information is used to update a
    spatial visualisation of document associations.


    Applying an IML process to textual data is challenged by the difficulty of providing
    succinct representations of documents that facilitate rapid user review. Kim et
    al. [2015b] compare a variety of machine learning techniques to the task of document
    feature compression. Their aim is to identify representations that improve the
    speed of categorisation assessment by users. Several of the discussed studies
    exploit term highlighting that indicates features relevant to the categorisation
    result. Giving salience to indicative keywords is hypothesised to speed up the
    assessment process. In terms of feature labelling, Raghavan et al. [2006] observe
    that users take up to five times longer to label one document, i.e. assign a document
    to a topic, than to label one feature, i.e. assign a word as an important term
    for a topic.


    # 3.2 Images


    The categorisation of images is a very popular application area within the machine
    learning community. The availability of suitable techniques for image based classification
    has encouraged the examination of the potential pairing of user input through
    IML. As for the application of IML to textual data, the usefulness of the technique
    is seen when more subtle concept discrimination capabilities are desired.


    At the inter-image level, applications have sought to allow users to train models
    to understand their own, sometimes obscure, concepts. Fogarty et al. [2008] introduce
    CueFlik, an interactive application that allows users to create their own concepts
    to incorporate into image search. The user may define a new search rule by assigning
    a collection of images to describe a desired concept, e.g. scenic. The user may
    then apply this rule to their search so that only results consistent with that
    concept are provided. Fogarty et al. [2008] found that providing a visualisation
    of both the most-confident positive and most-confident negative samples led to
    higher quality and faster concept learning than providing the full ranking of
    images. Amershi et al. [2011a] extend CueFlik by adding features to the interface
    that better allow users to model changes and visualise the current model state.
    Amershi et al. also introduced a visualisation of historical model quality (expressed
    in terms of model reliability and snapshots in time of ranked images) and the
    ability to revert back to previous model states. Guo et al. [2016] present an
    IML system for clustering medical images based on the underlying condition, and
    attempt to specifically incorporate expert constraints. Users can drag images
    apart to indicate that they should be disconnected in the model.


    Other applications of IML have sought to train systems to recognise specific objects
    at the intra-image level. Crayons [Fails and Olsen 2003] is the often cited formative
    paper in IML that demonstrates an interface whereby users can incrementally train
    a classifier by directly drawing on an image. This approach has also been leveraged
    by Tsutsumi and Tateda [2009] to help measure the amount of leaf debris flowing
    on a river as well as for analysis of satellite, medical and material science
    images ([Porter et al. 2011], [Porter et al. 2013],[Harvey and Porter 2016],[Kreshuk
    et al. 2011]).


    IML is well suited to use with images as there is a rich repository of features
    that have already been established and the user can quickly review a large number
    of images. The ability to provide pixel or region level feedback by directly sketching
    on images is an interaction technique successfully exploited in several applications.'
