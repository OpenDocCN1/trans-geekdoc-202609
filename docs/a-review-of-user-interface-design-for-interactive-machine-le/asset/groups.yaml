    under this methodology are illustrated in Figure 1. The user’s interaction may
    be viewed as a form of pseudo-programming in that the user builds functionality
    through demonstration and labelling samples rather than by directly writing code
    [Gillies et al. 2016]. As an interaction paradigm, Interactive Machine Learning
    exists at the overlap between computer-as-tool and computer-as-partner as described
    by Beaudouin-Lafon [2004]. An IML application certainly provides a tool in that
    it supports the user in building a model fit for their purposes. At the same time,
