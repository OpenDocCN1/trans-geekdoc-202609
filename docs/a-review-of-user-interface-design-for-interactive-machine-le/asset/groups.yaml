    识别了确保与智能服务有效协作的十二个关键因素。重要的是，Horvitz 警告不要通过过度使用机器智能来修补糟糕的界面设计，并强调需要结合考虑两个组件的设计。


    交互性在理解 IML 过程中涉及的样本数据或检查整个数据集时也可能很重要。普遍观察到交互支持理解（[Card et al. 1999]、[Chi and Riedl
    1998]），因此交互式数据探索工具可能很有价值。对于难以在一张视图中可视化的多维或非常大的数据集尤其如此。Carpendale [2008] 提供了与信息可视化相关的不同任务的总结，并区分了低级、注重细节的任务（如关联、排序、聚类）与高级、认知任务（如识别趋势、因果关系和理解不确定性）。各种数据特征可能会使可视化的简单方法失效，例如数据的非线性、全息层级结构和内部因果性。


    不可避免地，数据类型与最合适的表示和交互方法之间存在耦合。模型训练任务的一个独特方面是样本审查和反馈分配界面之间潜在的重叠。创建同时满足这两个功能的意义且富有成效的界面需要仔细设计。


    ### 6.5.2 最大化利用用户


    能够撤销操作似乎是 IML 中备受重视的交互功能。这一观察与 Nielsen [1995] 提出的‘用户控制和自由’可用性启发式一致。在构建和完善模型时，用户需要在最近的操作导致不期望的结果时能够回溯步骤（[Talbot
    et al. 2009]、[Kapoor et al. 2010]、[Amershi et al. 2010]）。与‘撤销’能力相关的是提供模型质量历史的可视化。Amershi
