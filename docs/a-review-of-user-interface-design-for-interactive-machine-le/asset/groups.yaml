  mdcn: "\n\n## 交互式机器学习用户界面设计述评\n\n约翰·J·达德利，英国剑桥大学  \n佩尔·奥拉·克里斯滕森，英国剑桥大学\n\n交互式机器学习（IML）旨在将人类的感知和智能与计算机的计算能力和速度紧密结合，以补充人类的感知和智能。这一交互过程被设计为纳入用户的输入，但并不要求用户具备使用更传统机器学习技术所必需的背景知识或经验。在IML流程下，非专家人员可以将其领域知识和洞察力应用于原本难以处理的数据集，以发现感兴趣的模式或开发复杂的数据驱动应用。该过程本质上具有协同自适应性，并依赖于对人与机器之间交互的精心管理。用户界面设计是这种方法成功的根本，但目前仍然缺乏关于如何实现此类界面的统一原则。本文从交互系统的角度对交互式机器学习进行了详细的回顾和描述。我们提出并描述了一个通用IML系统的结构和行为模型，并确定了为IML构建有效界面的解决方案原则。在可能的情况下，这些涌现的解决方案原则通过参考更广泛的人机交互文献进行了情境化。最后，我们指出了对解锁更高效、更有生产力的非专家交互式机器学习应用至关重要的用户界面研究方向。\n\
    \nCCS 概念：• **以人为本的计算** → *HCI 理论、概念和模型*；\n\n附加关键词和短语：交互式机器学习，界面设计\n\n**ACM 引用格式：**\
    \  \nJohn J. Dudley 和 Per Ola Kristensson。2018。交互式机器学习用户界面设计述评。*ACM Trans. Interact.\
    \ Intell. Syst.* 1, 1, Article 1（2018年3月），37页。https://doi.org/10.1145/3185517\n\
    \n## 1 引言\n\n机器学习（ML）支持构建能够描述和展示复杂行为而无需显式编程的数学模型。这些技术已经在诸如语音识别、图像分类和游戏等广泛任务中展现出先进功能。这种功能是通过一个与人类学习过程不无相似之处的训练过程建立的。一般来说，算法通过反复接触某个概念的样本来学习识别或表示该概念。一个能够准确表示某个概念以实现某种功能目的的数学模型，是机器学习算法的目标产物。\n\
    \n尽管这些技术取得了成功，但它们作为开发工具的使用在很大程度上仍然局限于专家从业者。然而，这些方法无需显式编程就能提供功能的能力，使其对广泛的潜在用户群体具有吸引力。近期机器学习领域广泛兴趣的爆发进一步加剧了直观系统的短缺，而这类系统能够让非专家应用这些技术。交互式机器学习（IML）因其在这种范式下建立有效人类交互的独特之处，引起了人机交互（HCI）研究人员的兴趣。\n\
    \nIML（在第2节中详细定义）通过将训练过程仔细地构架为一个HCI任务，使机器学习技术更加易于使用。在最简单的层面上，IML过程通过在示例选择、创建和标注过程中使用人工输入，将用户纳入训练过程。机器学习从业者可能需要部署底层算法以供IML系统使用，但这对训练过程并非必需。在理想实现中，对机器学习不熟悉的最终用户可以根据自己的需求创建或收集训练数据，从而构建自己的学习概念。在实践中，构建这样的系统对机器学习从业者和用户界面设计师都是一项重大挑战。本文主要关注界面设计挑战，但也着重指出了与机器学习从业者所面临的技术挑战的交叉点。\n\
    \nWare等人 [2001] 以及Fails和Olsen [2003] 的早期工作表明，典型的机器学习任务可以被构建为利用人类输入，并且在过去的十五年中，IML过程在HCI社区中受到了越来越多的关注。为IML系统提供输入的用户无需对所交互的模型有任何深入理解。当考虑到允许领域专家训练模型的潜力时，这种方法的价值或许最为明显。研究人员已经展示了在一系列具体应用中利用领域专业知识的IML系统，包括动物行为标注\
    \ [Kabra等人 2013]、保险索赔审计 [Ghani和Kumar 2011] 以及对已发表医学证据进行系统性评价 [Wallace等人 2012]。在这些应用中，随着模型对正在训练的概念理解能力的提高，用户所需付出的努力显著减少。Wallace等人\
    \ [2012] 通过利用训练模型的预测来将特定研究论文标记为不相关，实现了用户工作量约40%的减少。通过这种方式，IML寻求应用人类和计算机的互补优势。\n\
    \nIML工作流程本质上是协同自适应的，因为用户和目标模型直接影响彼此的行为。重要的是要认识到，实际上是交互作为界面的一种涌现属性，必须适应用户响应模型而不断变化的行为。界面的适当设计对此类系统的成功是*关键*的，这提出了一个独特的用户界面设计挑战。该方法依赖于将数据检查和纠正任务转化为人与机器之间直观且富有成效的对话。实现这一点并非易事。\n\
    \n为交互式机器学习应用设计界面暴露了四个关键挑战。首先，用户可能不精确和不一致。用户可能在训练过程中不严格遵守某个概念，或者将自己的错误和偏见引入学习过程。不良的训练会导致不良的模型，但除非用户意识到自身的缺陷，否则这种失败会被归咎于系统。\n\
    \n其次，在关联用户输入和用户意图时存在一定程度的不确定性。用户可能会基于他们在示例中感知到的、系统没有或无法建模的特征来分配训练数据。此外，用户没有将某个示例分配到某个概念并不一定意味着它就是反例。\n\
    \n第三，与模型交互不同于通过用户界面与常规信息结构交互。机器学习模型会响应用户输入而演化，但不一定以用户认为直观或可预测的方式演化。\n\n第四，训练是开放式的。例如，如果用户在计算机辅助设计（CAD）系统中设计一个零件，完成状态或多或少是二元的：当零件被完全指定时，任务即完成。相比之下，训练一个模型达到100%的准确率可能既不可取也不可能。此外，IML在探索性和创造性应用中被广泛使用，在这些应用中，实际模型相对于过程本身可能只是次要的。\n\
    \n这四个关键挑战加在一起，使得以人为中心的机器学习，特别是IML过程，成为一个远比简单集成相关组件复杂得多的设计挑战。\n\n### 1.1 给设计者的指导\n\
    \n本文整合了与IML界面设计相关的研究发现，旨在为设计者提供指导。它试图为构建有效的交互式机器学习系统这一挑战带来一个双重视角：同时考虑智能算法的应用和用户界面的设计。基于对文献的综合分析，我们提出了IML系统的结构和行为分解。结构分解将系统划分为其组成部分（用户、界面、数据和模型），目的是帮助设计者思考如何构建这样的系统。IML界面被进一步分解为四个不同的界面元素，它们在更广泛的流程中服务于不同的功能。认识到这些不同的界面元素可以帮助设计者思考如何向用户呈现信息以及他们促进何种交互。\n\
    \n行为分解将交互式构建模型的过程划分为子任务。然而，需要注意的是，这些任务可能重叠和/或迭代执行。结构和行为分解并非旨在作为蓝图，而是支持使用明确定义的术语对设计考虑进行丰富讨论。这种对设计空间的正式化将有助于为该新兴领域中的概念交流奠定更好的基础。\n\
    \n本文的另一个贡献是识别了能够更普遍地指导IML界面设计者的涌现式解决方案原则。第6节中详细描述的六个解决方案原则是：\n- （1）明确任务目标和约束\n\
    - （2）支持用户理解模型的不确定性和置信度\n- （3）捕获意图而非输入\n- （4）提供有效的数据表示\n- （5）利用交互性并促进丰富的交互\n- （6）让用户参与\n\
    \n### 1.2 文章结构\n\n本文其余部分的组织如下。第2节提供了交互式机器学习的详细定义，并试图强调其与相关技术的相似性和区别。第3节概述了为使非专家更容易使用机器学习技术和高级分析所做的重要工作，并按底层数据类型进行分类。第4节对通用IML系统的关键界面元素进行了结构性描述。第5节给出了典型IML过程的抽象描述。第6节通过识别若干常见的解决方案原则，试图整合近期的努力。我们强调，解决用户界面设计挑战和推进最先进技术水平需要在几个关键领域进行进一步研究。因此，我们提出了四个不同的研究方向。\n\
    \n"
