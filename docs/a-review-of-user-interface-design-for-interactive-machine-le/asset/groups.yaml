  - "[PAGE 0]\n\n# A Review of User Interface Design for Interactive Machine Learning\n\
    \nJOHN J. DUDLEY, University of Cambridge, United Kingdom  \nPER OLA KRISTENSSON,\
    \ University of Cambridge, United Kingdom\n\nInteractive Machine Learning (IML)\
    \ seeks to complement human perception and intelligence by tightly integrating\
    \ these strengths with the computational power and speed of computers. The interactive\
    \ process is designed to involve input from the user but does not require the\
    \ background knowledge or experience that might be necessary to work with more\
    \ traditional machine learning techniques. Under the IML process, non-experts\
    \ can apply their domain knowledge and insight over otherwise unwieldy datasets\
    \ to find patterns of interest or develop complex data driven applications. This\
    \ process is co-adaptive in nature and relies on careful management of the interaction\
    \ between human and machine. User interface design is fundamental to the success\
    \ of this approach, yet there is a lack of consolidated principles on how such\
    \ an interface should be implemented. This article presents a detailed review\
    \ and characterisation of Interactive Machine Learning from an interactive systems\
    \ perspective. We propose and describe a structural and behavioural model of a\
    \ generalised IML system and identify solution principles for building effective\
    \ interfaces for IML. Where possible, these emergent solution principles are contextualised\
    \ by reference to the broader human-computer interaction literature. Finally,\
    \ we identify strands of user interface research key to unlocking more efficient\
    \ and productive non-expert interactive machine learning applications.\n\nCCS\
    \ Concepts: • **Human-centered computing** → *HCI theory, concepts and models*;\n\
    \nAdditional Key Words and Phrases: Interactive machine learning, interface design\n\
    \n**ACM Reference Format:**  \nJohn J. Dudley and Per Ola Kristensson. 2018. A\
    \ Review of User Interface Design for Interactive Machine Learning. *ACM Trans.\
    \ Interact. Intell. Syst.* 1, 1, Article 1 (March 2018), 37 pages. https://doi.org/10.1145/3185517\n\
    \n# 1  INTRODUCTION\n\nMachine Learning (ML) supports the construction of mathematical\
    \ models that can describe and exhibit complex behaviour without the need for\
    \ explicit programming. These techniques have demonstrated advanced functionality\
    \ in a wide variety of tasks such as recognising speech, classifying images and\
    \ playing games. This functionality is built through a process of training that\
    \ is not dissimilar from the human process of learning. In general terms, the\
    \ algorithm learns to recognise or represent a concept through repeated exposure\
    \ to samples of that concept. A mathematical model that accurately represents\
    \ a concept for some functional purpose is the goal product of a machine learning\
    \ algorithm.\n\nDespite the success of these techniques, their use as a development\
    \ tool remains largely confined to expert practitioners. However, the ability\
    \ for these approaches to deliver functionality without"
