    2. The user drives the process by providing feedback and steering model training.
    The model is the component being trained. The data is a collection of the pre-existing
    and newly created points upon which the model is trained. The interface is the
    bridge between the user and the model and data and provides the basis for interaction.
    The interface component is the primary focus of this article and will be dissected
    further in Section 4. We briefly define the role of each of these components within
    the IML process below.


    # 2.1.1 User.


    As has been reiterated several times already, the user is the main driver of the
    IML process. An assumption is made that the user possesses no deep understanding
    of machine learning techniques. Furthermore, it is unreasonable to expect a typical
    end-user to appreciate the subtleties of probabilistic inference. The user may
    possess significant domain expertise relevant to interpretation of the data and
    evaluation of model outputs. It is also worthwhile highlighting that the “user”
    may in fact be multiple users interacting with the system serially or in parallel.


    The user is a dynamic and potentially unreliable component of the process. A single
    user’s concept may drift over time [Kulesza et al. 2014] and inter-user variability
    in subjective annotations may be high [Curran et al. 2012]. Unaddressed, these
    deficiencies are likely to have a negative effect on trained model quality. Fortunately,
    careful design of the interface, both in terms of the information presented and
    the guidance provided, can help to improve the consistency of users.


    # 2.1.2 Model.


    The model is the component of the system that takes inputs and determines appropriate
    outputs based on its current understanding of the concept/process the user is
    seeking to capture. The high-level goal in machine learning generally, is to build
    a model that accurately describes the relationship between input and output for
    a given concept based on data indicative of that concept. In machine learning,
    this model may be implemented using a wide variety of different algorithms and
    architectures. In interactive machine learning, it is the model that the user
    is ultimately seeking to refine through their interactions. The user may manipulate
    the model directly, i.e. by adjusting parameters, or indirectly, i.e. by relabelling
    or adding new data. The machine learning community provides an extensive range
    of modelling techniques, each with their corresponding advantages and disadvantages.
    It is important to note too that certain models, like certain users, may be unreliable
    in that their behaviour is not necessarily deterministic.


    ![](img/17c50ccda69f2e1b79eba2e3563dce88_5_0.png)


    Fig. 2. Structural breakdown of a generic IML system. The user steers the model
    towards a desired concept by assigning or creating training data. The interface
    may also support direct interaction with the model by exposing parameters, editable
    structures and choice in alternative techniques. Not independently represented
    in this figure but encompassed by the interface component, is the conceptual model
    for the system that frequently provides an abstraction layer between the user
    and the manipulated objects.'
