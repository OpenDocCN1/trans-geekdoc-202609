    在第 7 节中，我们从用户交互的角度探讨了提升交互式机器学习应用性能的方法。最后，我们在第 8 节中总结了本文的关键发现。


    ## 2 上下文与定义


    本文从用户界面设计的角度审视交互式机器学习。开发有效的 IML 系统是一项跨学科工作，融合了机器学习和人机交互领域。为实现本文目标，我们主要集中于呈现用户评估并提供交互组件设计建议的
    IML 研究。除其对用户交互的影响外，系统机器学习组件的底层技术需求仅得到有限关注。在本节中，我们首先旨在为全文使用的术语建立明确的定义。


    ### 2.1 交互式机器学习定义


    *Interactive Machine Learning* 是一种交互范式，其中用户或用户群体通过输入和审查的迭代循环，迭代地构建和完善数学模型以描述一个概念。模型完善由用户输入驱动，用户输入可能以多种形式出现，例如提供指示性样本、描述指示性特征或以其他方式选择高层模型参数。交互式机器学习与经典机器学习的区别在于，人类智能通过迭代教学和模型完善在相对紧密的“set-and-check”循环中应用。换句话说，用户向系统提供额外信息以更新模型，并且模型的变化会对照用户的设计目标进行审查。在此工作流程下，每次迭代中模型的变化可能相对较小。这与更传统的机器学习方法形成对比，后者需要预先整体选择训练数据，并且每次执行步骤中模型会发生显著变化。Amershi
    等 [2014] 详细讨论了 IML 与经典机器学习之间的区别，并提供了一系列案例研究来突出该技术的价值。IML 过程的特点是用户是驱动交互以实现系统期望行为的主要驱动者。这并不意味着计算机对过程没有影响或不做出独立决策。事实上，应用程序例如可以智能地选择一批数据供审查。用户是主要驱动者的概念更多地体现在
    IML 应用程序旨在为用户提供对系统高层行为的控制上。这种控制可能在每次离散交互中行使，也可能不行使。


    Fails 和 Olsen [2003] 在交互式图像处理工具 Crayons 中引入了 IML 的概念，其主要侧重于分类器错误的审查和纠正。Crayons
    允许用户直接在图像上绘制以指导图像分类器的训练。用户根据图像区域的分类审查当前分类器性能，并在必要时通过在图像上绘制提供更多反馈。ReGroup [Amershi
    et al. 2012] 是一种利用交互式机器学习范式帮助用户在社交网络环境中创建自定义联系人组的工具。系统训练模型以根据其成为所创建联系人组的成员的可能性对联系人进行分类。系统将对联系人的选择作为正样本，将在有序列表中跳过联系人作为隐含负样本。用户在每次选择后会以建议联系人的有序列表形式收到反馈。就像
    Crayons 一样，用户通过迭代应用的用户输入产生的增量改进来完善模型的行为。


    上面描述的 Crayons 和 ReGroup 系统中的完成时模型行为当然可以用标准机器学习方法复制，该方法将用户输入的集合作为标记数据的批量处理。然而，在所讨论的应用中，正是完善模型的过程有助于引出用户输入。这两个例子有助于突出交互式机器学习的益处在用户精确设计目标不明确和/或数据标签无法*a
    priori*获得的情况下是可观察的。


    最近的工作将交互组件的应用扩展到不仅仅是分类器错误的审查和纠正，还扩展到模型构建练习的其他阶段，即特征选择、模型选择、调试和性能评估。在本文的上下文中，我们将*comprehensive*
    IML 过程定义为系统提供所有必要功能以允许用户在其数据上配置然后训练模型并将其部署到目标应用程序中的过程（该完整通用工作流程在第 5 节中详细描述）。


    在迭代完善阶段，用户在人类与机器紧密耦合的安排中驱动 IML 过程。在此方法下，关键元素和信息流在图 1 中示出。用户的交互可以被视为一种伪编程形式，因为用户通过演示和标记样本而不是直接编写代码来构建功能
    [Gillies et al. 2016]。作为一种交互范式，交互式机器学习存在于 Beaudouin-Lafon [2004] 所描述的计算机即工具和计算机即伙伴的重叠处。IML
    应用程序当然提供了一种工具，因为它支持用户构建适合其目的的模型。与此同时，用户和计算机参与的交互是一种伙伴关系，双方都必须对输入做出响应，并在一定程度上推断期望的操作。将具有高和/或可变惯性的物体沿期望轨迹移动的隐喻为
    IML 提供了一个非常高层的交互模型。该交互模型捕捉到输入可能在物体上产生边际或无响应的事实，并且需要一系列输入来驱动变化。


    交互式机器学习方法可能在用户-数据交互任务的两个极端首先得到采用：在较低复杂性端，用户选择他们喜欢和不喜欢的事物示例；在较高复杂性端，用户（甚至开发者）应用其领域专业知识来完善分类器或构建其他智能功能
    [Grose et al. 2014]。


    从结构角度来看，我们将 IML 系统分为四个关键组件：1) 用户；2) 模型；3) 数据；以及 4) 界面。这些组件在图 2 中进行了总结。


    ![](img/17c50ccda69f2e1b79eba2e3563dce88_4_0.png)


    图 1. 用户在交互式机器学习中发挥核心作用，通过迭代方式主动训练模型。用户界面是这种交互的关键组成部分。


    用户通过提供反馈并引导模型训练来驱动过程。模型是正在训练的组件。数据是模型所训练的预先存在和新创建点的集合。界面是用户与模型和数据之间的桥梁，并为交互提供基础。界面组件是本文的主要关注点，将在第
    4 节中进一步剖析。我们将在下面简要定义这些组件在 IML 过程中的作用。


    #### 2.1.1 用户


    正如前面多次重申的那样，用户是 IML 过程的主要驱动者。假设用户对机器学习技术没有深入的理解。此外，要求典型的终端用户理解概率推理的细微差别是不合理的。用户可能拥有与数据解释和模型输出评估相关的显著领域专业知识。还值得强调的是，“用户”实际上可能是多个用户串行或并行与系统交互。


    用户是动态且可能不可靠的过程组件。单个用户的概念可能随时间漂移 [Kulesza et al. 2014]，而主观标注的跨用户变异性可能很高 [Curran
    et al. 2012]。如果不加以解决，这些缺陷可能会对训练模型的质量产生负面影响。幸运的是，界面的精心设计，无论是在呈现的信息方面还是在提供的指导方面，都可以帮助提高用户的一致性。


    #### 2.1.2 模型


    模型是系统组件，它接收输入并根据其对用户试图捕捉的概念/过程的当前理解确定适当的输出。机器学习中的高层目标通常是构建一个模型，该模型能够基于指示该概念的数据准确描述给定概念的输入与输出之间的关系。在机器学习中，该模型可以使用各种不同的算法和架构实现。在交互式机器学习中，用户最终寻求通过其交互来完善的正是该模型。用户可以直接操纵模型，即通过调整参数，或间接地，即通过重新标记或添加新数据。机器学习社区提供了广泛的建模技术，每种技术都有其相应的优缺点。还需要注意的是，某些模型就像某些用户一样可能不可靠，因为它们的行为不一定是确定性的。


    ![](img/17c50ccda69f2e1b79eba2e3563dce88_5_0.png)


    图 2. 通用 IML 系统的结构分解。用户通过分配或创建训练数据将模型引导至期望的概念。界面还可以通过暴露参数、可编辑结构以及替代技术的选择来支持与模型的直接交互。图中未单独表示但包含在界面组件中的是系统的概念模型，它通常在用户与被操作对象之间提供抽象层。


    '
