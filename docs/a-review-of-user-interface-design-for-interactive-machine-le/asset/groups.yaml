    对给定输入的响应。这种跨应用的差异性阻碍了获得简洁且可泛化的解决方案原则的努力。尽管如此，将此类交互视为一种伪编程任务或许是有用的。这种抽象层级为识别共性提供了一个有用的框架。


    我们提出六项关键的解决方案原则，用于 IML 接口的设计：


    - (1) 使任务目标和约束明确

    - (2) 支持用户理解模型的不确定性和置信度

    - (3) 捕捉意图而非输入

    - (4) 提供有效的数据表示

    - (5) 利用交互性并促进丰富的交互

    - (6) 吸引用户


    这些原则涵盖了 IML 工作流程中执行的各种活动中的多个方面。它们对第 4 节中描述的界面组件也有具体的含义。本文节的其余部分将详细讨论每一条。


    ## 6.1 使任务目标和约束明确


    建立明确的任务目标对于非专家的交互式机器学习而言是一个重要部分，因为该过程在很大程度上由用户驱动。同样重要的是理解什么是不可能的，即过程中的约束。迭代模型精炼范式意味着用户在追求某个期望的目标状态。用户要构建有效策略以实现该目标状态，就必须理解其任务及其约束。


    该解决方案原则在很大程度上是对第 1 节中提出的 IML 的两个关键挑战的回应：用户可能不精确且不一致，以及训练是开放式的。针对第一个挑战，构建明确的任务目标和约束可以帮助集中用户努力并提高一致性。许多推荐系统利用用户输入实现双重目的，即点赞既向社交群体提供兴趣信号，也可能为预测的推荐提供信息。虽然目标不明确的双重用途输入可能适用于推荐系统，但我们假设在请求用户输入时，无论是单一用途还是多用途，保持明确都是更可取的。显而易见的是，当要求用户作为闭环反馈中的一个组件时，理解所呈现的信息和所需操作至关重要。然而，过多的信息也可能令人困惑并对性能产生不利影响。


    如果将用户努力和注意力视为供应有限的资源，那么确保所有花费的努力都用于追求目标状态是合理的。然而，该目标状态必须明确定义。例如，Amershi 等人 [2011a]
    观察到，当在 CueFlik 界面中引入模型可靠性指标图以提供质量反馈时，用户开始将最大化该指标作为其主要目标。需要仔细界定任务目标，并意识到可能促进或阻碍这种理解的界面特征。文献已探讨和讨论了模型和预测解释对用户理解和心理模型可能发挥的作用（[Kulesza
    et al. 2013]、[Sarkar 2015]），但对任务先前框架对用户可能产生的影响关注较少。假设支持用户对全局任务和约束的感知可能会提高他们选择模型精炼操作的能力，这并非不合理，尽管这应得到研究。


    上述重新讨论的第二个挑战（即训练是开放式的）也可以通过提高用户对目标和约束的理解在一定程度上得到缓解。与机器学习模型的交互与更传统的计算机交互不同之处在于，用户对表现出的行为可能只有有限的直接控制。机器学习的一个关键限制是产生的假阳性/假阴性通常难以根除。例如，用户可能会将推荐的电影识别为完全超出其兴趣类别，尽管它具有与其他偏好内容一致的许多属性。Amershi
    等人 [2012] 指出，“当假设语言不足以表达真实概念时，这一问题会出现在所有机器学习系统中”。在其他情况下，可能需要大量用户操作后，学习模型才会反映期望的变化
    [Wong et al. 2011]。不能及时响应用户输入的应用程序违反了直接操作原则，并可能导致严重挫败感。用户理解其在解决此类模型失败方面的局限性的程度可能会对其对界面的满意度以及其进行的精炼操作产生重大影响。


    如果用户不了解机器学习技术的局限性，该过程还会暴露出过拟合的潜在风险。过拟合是指构建一个模型，虽然它与可用数据匹配，但并不能真正代表现象。在支持持续模型精炼的同时避免过拟合，对支持非专家交互提出了独特的挑战。专家机器学习从业者意识到这种风险，但
    naive 用户可能容易过度指定。[Ware et al. 2001] 中演示的交互式树形分类器以非常清晰且直观的形式框定了任务目标，但导致一些用户花费大量精力来最大化分类准确性，而实际收益甚微。


    在许多情况下，用户可能不需要理解他们正在努力的全局目标，只要他们理解自己在即时交互任务中的角色即可。理解全局任务对用户性能的影响尚不明确，然而，我们认为这对于终止评估和迁移活动中的有效性能至关重要。


    ## 6.2 支持用户理解模型不确定性和置信度


    *不确定性* 是大多数现实世界应用中数据驱动模型不可避免的特征。相应地，不确定性和置信度的概念无法从 IML 过程中移除。该解决方案原则旨在解决与模型交互不像与传统信息结构交互这一事实（第
    1 节中强调的关键挑战之一）。引导模型以及将模型最终应用于目标数据集这两个任务都涉及不确定性。用户了解这种不确定性很重要，原因有二：1) 管理交互期间的期望；2)
    管理对最终系统性能的期望。


    概率模型及其局限性的概念可能难以向非专家传达，因此许多 IML 应用可能依赖于简化的解释。没有机器学习经验的用户不太可能理解使用概率模型的含义。用户研究发现，即使分类器中出现单个异常值也可能导致用户产生显著困惑
    [Kim et al. 2015a]。用户会通过单个预测以及模型的整体性能来校准他们对模型的信任 [Ribeiro et al. 2016]。此外，IML
    是一个协同适应过程，因为用户和模型都会对彼此的行为做出反应 [Gillies et al. 2016]。在用户中建立合适的理解水平并适当框定任务至关重要且非平凡。


    非专家如果不熟悉计算机程序的内部行为，会构建自己的心理模型以帮助制定交互策略。该模型部分源于他们过去的经验和知识。虽然构建的心理模型不必准确，但糟糕的模型可能会对用户性能产生高度不利的影响，从而影响他们对程序有效性的感知
    [Norman 2014]。也许区分功能模型是有用的，功能模型允许使用系统，而结构模型则允许理解其如何以及为何工作。Gillies et al. [2015a]
