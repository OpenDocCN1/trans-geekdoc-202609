- - '###'
  - 13.22 涵盖了一种基于过度加密的新型密钥强制访问控制机制。接下来，作者提出了 `LightCore`，这是一种具有密钥强制访问控制的敏感数据协作编辑云服务。然后，他们提出了一种基于过度加密的新型密钥强制访问控制机制，通过强制双层加密来实现访问控制策略的更新。此外，作者展示了一种
    `dualheader` 结构以便在授予新授权时无需重新加密相关数据资源，并提出了批量撤销，以减少撤销发生时重新加密的开销，从而在加密云存储中高效更新访问控制策略。接下来，他们描述了
    `LightCore` 的系统设计，最后作者展示了实验结果，显示实现了 `LightCore` 的高性能，并为不同的使用场景建议了合适的密钥流策略。
