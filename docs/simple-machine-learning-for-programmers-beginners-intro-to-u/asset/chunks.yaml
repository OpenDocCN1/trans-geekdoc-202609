- raw: 'Classification in Code Before we jump into our first coding example, you’ll
    need to have your environment setup. You’ll need Python and some numerical computing
    libraries such as Numpy, Scipy, Matplotlib, Pandas, and Scikit-Learn. For Windows
    users, I recommend using Anaconda, which already comes with all of these libraries
    built-in. Instructions for installing Anaconda on your Windows system can be found
    in my YouTube video: [http://bit.ly/2LfBBCo](http://bit.ly/2LfBBCo) For Mac and
    Linux users, I would recommend not installing any additional programs such as
    Anaconda (but look into virtualenv if you want to keep your environments isolated).
    Instructions for installing the required libraries can be found at: [http://bit.ly/2nS9hg3](http://bit.ly/2nS9hg3)
    Note that these videos come with installation instructions for many libraries
    which are not needed for this book, since the same instructions are used for all
    of my courses. Thus, you can stop once you’ve installed just the libraries I’ve
    listed above. The Code In this chapter, we are going to look at how we can use
    scikit-learn to build a predictive model on a real dataset. You can find the completed
    script in the file classification\_example.py at: [http://bit.ly/2Lae8SR](http://bit.ly/2Lae8SR)
    By the way, I recommend pasting these lines into an interactive REPL such as Jupyter
    Notebook or IPython, so that you can see the outputs in real-time. The intention
    of this chapter is to describe each line of the code in the above script. import
    numpy as np \# import the function that will get the data \# yes, sklearn comes
    with built-in datasets! from sklearn.datasets import load\_breast\_cancer Luckily,
    scikit-learn comes with datasets that are readily available for you to use. One
    such example is the breast cancer dataset. Side note: This lets us highlight yet
    another important application of machine learning classification - diagnosis of
    disease. These days, there have been instances where machine learning algorithms
    have learned to correctly identify disease on par with or better than human experts.
    This is great, because human experts are not scalable, whereas machine learning
    algorithms are just code that we can replicate much more easily. What we’ve just
    imported is actually just a function. We need to call this function in order to
    get the data. \# load the data data = load\_breast\_cancer() What is “data”? We
    don’t actually know what’s just been returned. But we can check what it is by
    printing the type of data or just printing data itself. I recommend doing both.
    print(data) print(type(data)) “data” is an object of type Bunch. A Bunch object
    doesn’t seem like anything we might know of. But we can check its attributes.
    If you are in IPython, you can type in “data.” (note the dot) and then hit the
    tab key. Now you can see all the attributes and methods that belong to this object.
    Judging by the attributes belonging to the data object, it appears that the data
    object behaves a lot like a Python dictionary. Specifically, pay attention to
    the keys() and values() methods. Now you can see what keys this object has. What’s
    nice about this is we don’t have to use square bracket notation like a normal
    Python dictionary, and instead we can treat these keys just like object attributes.
    data.keys() We find the keys: Out\[1\]: dict\_keys(\[''data'', ''target'', ''target\_names'',
    ''DESCR'', ''feature\_names''\]) Let us check the data key. In \[2\]: data.data
    Out\[2\]: array(\[\[1.799e+01, 1.038e+01, 1.228e+02, ..., 2.654e-01, 4.601e-01,
    1.189e-01\], \[2.057e+01, 1.777e+01, 1.329e+02, ..., 1.860e-01, 2.750e-01, 8.902e-02\],
    \[1.969e+01, 2.125e+01, 1.300e+02, ..., 2.430e-01, 3.613e-01, 8.758e-02\], ...,
    \[1.660e+01, 2.808e+01, 1.083e+02, ..., 1.418e-01, 2.218e-01, 7.820e-02\], \[2.060e+01,
    2.933e+01, 1.401e+02, ..., 2.650e-01, 4.087e-01, 1.240e-01\], \[7.760e+00, 2.454e+01,
    4.792e+01, ..., 0.000e+00, 2.871e-01, 7.039e-02\]\]) It looks like a big matrix
    of numbers. Let us check its shape. In \[3\]: data.data.shape Out\[3\]: (569,
    30) data.data is a 2-D array of shape 569 x 30. What do we know of that has to
    be a 2-D array? The input data into our machine learning model! This means that
    we have N=569 samples, and D=30 input features. Importantly, notice how this big
    matrix of numbers appears to have no meaning at all. It’s just a big table of
    numbers. What do these numbers mean? Who knows? In fact, what we will learn is
    that the machine learning algorithm doesn’t care. All it sees is a table of numbers
    and that’s all it needs to see. Let’s not dwell on this now, but we’ll talk more
    about this crucial point later on. Next, let’s check the target attribute. In
    \[4\]: data.target Out\[4\]: array(\[0, 0, 0, 0, 0… We can see that the target
    is a 1-D array of 0s and 1s. This brings us to another crucial point. Why are
    the targets 0 and 1 and not another 2 numbers? In order to truly appreciate why
    this is useful, you’ll have to learn a little more about how machine learning
    algorithms work, so that’s something you can look forward to in the future. Generally
    speaking, if you have K different labels, your labels will be numbered from 0...K-1
    inclusive. Intuitively, we know that in Python programming, array indexes start
    from 0. If you have an array of length K, its indices will be integers from 0…K-1.
    Luckily, the “meaning” of 0 and 1 here is not lost. We can check the attribute
    target\_names, and this will tell us the meaning of 0 and 1. In \[5\]: data.target\_names
    Out\[5\]: array(\[''malignant'', ''benign''\], dtype=''<U9'') We can see that
    0 and 1 correspond to “malignant” and “benign”. While we’re here, let’s also check
    the shape of targets. In \[6\]: data.target.shape Out\[6\]: (569,) We can see
    that it has length 569. Every input sample has a corresponding target. Note that
    we can also check the names of the features. In \[7\]: data.feature\_names Out\[7\]:
    array(\[''mean radius'', ''mean texture'', ''mean perimeter'', ''mean area'',
    ''mean smoothness'', ''mean compactness'', ''mean concavity'', ''mean concave
    points'', ''mean symmetry'', ''mean fractal dimension'', ''radius error'', ''texture
    error'', ''perimeter error'', ''area error'', ''smoothness error'', ''compactness
    error'', ''concavity error'', ''concave points error'', ''symmetry error'', ''fractal
    dimension error'', ''worst radius'', ''worst texture'', ''worst perimeter'', ''worst
    area'', ''worst smoothness'', ''worst compactness'', ''worst concavity'', ''worst
    concave points'', ''worst symmetry'', ''worst fractal dimension''\], dtype=''<U23'')
    So if you were wondering what the 30 features were, here you go. Crucially, I
    want you to notice one important thing. The machine learning algorithm does not
    in any way make use of these feature names or target names. All it cares about
    are the numbers (X and Y - or in this case - data.data and data.targets). Next,
    something we like to do usually is split our data into train and test sets. from
    sklearn.model\_selection import train\_test\_split X\_train, X\_test, y\_train,
    y\_test = train\_test\_split(data.data, data.target, test\_size=0.33) Why do we
    do this? To understand this, a good example to consider is the stock market. Quite
    intuitively, you’d like to be able to predict the stock market, so that you can
    make money. Of course, you need to be able to predict information from the future
    , because you can’t act on information from the past. If the stock went up or
    down last week, you’ve already lost your opportunity to take advantage of it.
    But here’s the thing. You can’t train your model on data from the future, because
    by definition, it doesn’t exist yet. So in order to accurately evaluate your model’s
    performance, you need to make sure that the data you test on is different from
    the data that you train on. If you test on the same data that you train on, it
    could simply be that your model has just memorized everything it’s seen in the
    past, which is not useful. That would just be a lookup table, like a Python dictionary.
    We don’t want to build something that just stores things in memory that we can
    pull back later. I don’t think anyone would agree that that would be considered
    intelligent behavior, or “learning”, for that matter. The goal is to be able to
    predict things I have not yet seen, not to memorize things I’ve already seen.
    We say that we would like our model to generalize to unseen data. Now it’s time
    to build a model. Let’s pick the random forest classifier, since that is often
    a good choice. from sklearn.ensemble import RandomForestClassifier model = RandomForestClassifier()
    The random forest classifier is an object, not a function, so the first thing
    we need to do is instantiate it. Now we can call the “fit” instance method. Remember,
    we only want to pass in the training data. model.fit(X\_train, y\_train) So far,
    we don’t have any feedback for how well this model performs. That’s what the score
    function is for, which if you recall, is the prediction accuracy of the model.
    In\[8\]: model.score(X\_train, y\_train) Out\[8\]: 0.994750656167979 In \[9\]:
    model.score(X\_test, y\_test) Out\[9\]: 0.9574468085106383 About 96% test accuracy,
    not bad! Now, just for completion’s sake, I want to show you how to make predictions
    using the model. We’re going to use X\_test here, but you can also pretend this
    is brand new data that we have never ever seen before. This is one of the most
    common questions I get from machine learning beginners. After we train the model,
    how can we use it to make predictions in the future? This is how. As long as your
    data is in the same format as before, everything will work as expected. predictions
    = model.predict(X\_test) Let’s check and see what our predictions look like. In
    \[11\]: predictions Out\[11\]: array(\[1, 1, 0, 1, 1, 0… As expected, it’s a bunch
    of 0s and 1s. Earlier, we discussed how we can check the accuracy manually using
    the predictions. Remember, accuracy is just:  # correct / # total Let’s start
    by getting N, the number of test samples. N = len(y\_test) An easy way to count
    up the number of predictions I got correct it to just use == and then sum over
    the result. np.sum(predictions == y\_test) This might seem confusing at first,
    so let’s break it down. I encourage you to try out each part on your own if you
    don’t get this right away. Firstly, the == just returns an array of booleans of
    length N. The result is true at position i if predictions\[i\] == y\_test\[i\].
