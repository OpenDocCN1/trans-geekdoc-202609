    # 什么是回归？


    在本章中，我们将转向监督学习中的另一项主要任务，即回归（regression）。我认为分类（classification）总是一个很好的起点，因为它在逻辑上非常直观。“这里有一张图像。告诉我里面是什么物体。”这里有一封邮件。告诉我是垃圾邮件还是非垃圾邮件。”这里有一些医疗检查的测量数据。告诉我这个人是否患了某种疾病。”这非常符合逻辑。


    回归也非常直观，但它的直观性是体现在视觉上的。让我们来看看具体的。在 x-y 平面上有一些点。￼![](img/image443.jpg)你应该很清楚地看出这些点形成了一个模式。事实上，你可以画一条直线直接穿过这些点，你可能在脑海中已经构思好了这条线，尽管最初那里并没有这条线。这是另一个例子。![](img/image453.jpg)这并不是一条直线，但非常的是，我们可能仍然能想象出什么样的曲线会穿过这些点。回归的本质如此。“这里有一些点，现在告诉我拟合这些点的直线或曲线。”


    ## 回归和分类有什么区别？


    分类意味着你正在预测一个类别。回归意味着你正在预测一个数字。这个数字通常是实轴上的一个数字。在分类中，我预测的是没有数值意义的东西。如果我看到一封邮件，我想知道它是垃圾邮件还是非垃圾邮件。你可能会在这里提出异议，因为在代码
    `spam / not-spam` 被编码为 `0` 和 `1`。实际上，这些数字并不重要。这些数字只是代表实际类别的符号（因为它们在计算机内部，而计算机内部的一切都是数字）。垃圾邮件是
    `0` 而非垃圾邮件是 `1` 还是反过来**并不重要**。在回归中，数字确实是有意义的。


    ## 示例 #1：身高与体重


    当然，如果没有一些回归应用的真实生活例子，本章将是不完整的。这里有一个简单的例子。给定一个人的身高，我想预测他们的体重。反之亦然。￼![](img/image472.jpg)自然，较高的人质量越大，因此体重越重。这种相关性不是完美的，但通常是真实的。你可以想象，例如，恐龙重量比蚂蚁重得多。


    ## 示例 #2：房价预测


    回归的另一个常见应用是预测房价。如果你从事房地产或房产买卖业务，这对你来说将非常相关。注意，在我们之前看过的图片中，我们能够将数据可视化为 2D 图形，因为我们有
    `1` 输入（自变量）和 `1` 输出（因变量）。但就像分类一样，我们可以有多个输入。例如，房屋的价格可能与所在社区的平均家庭收入以及该社区的犯罪率相关。它可能还取决于属性，如房屋的大小、卧室的数量以及最后一次装修的时间。


    当你处于高维空间时，你预测的东西就不再是一条线。如果你有 `2` 输入和 `1` 输出，那么你总共有 `3` 个维度，所以你看到的是一个平面；如果它是弯的，那么它就是一个曲面。如果你有超过
    `2` 个输入，那么。当然，人类的眼睛和大脑通常没有可视化此类对象的能力。


    ## 示例 #3：预测股票


    让我在这里再给你们一个例子，因为对于回归和分类，我都想给你们提供一个真实的业务应用，人们可以利用这些思想并从中赚大钱。我们都听过股市。通常情况下，玩股市的“规则”之一是你低买高卖。这样，你得到的钱总是比投入的要多。当然，事情并不总是这样发展，许多人让情绪和恐惧战胜了自己，但那是另一个课程的内容。


    从机器学习的角度来看，我们想做什么？其实非常简单。我们想获取一些输入，例如，该股票过去 `10` 天的价格，昨天是否有关于该公司的新闻报道，以及该新闻是否是正面。我们可以获取这些输入，并输出对明天股票价格的预测。


    ## 代码大纲


    当然，如果你可以的话……


    ```python

    model = LinearRegression()

    model.fit(X, Y)

    predictions = model.predict(X)

    model.score(X, Y)

    ```


    '
