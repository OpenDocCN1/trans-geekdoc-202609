    ```python

    df = pd.read_csv(''airfoil_self_noise.dat'', sep=''\t'', header=None)

    ```


    Next, let’s look at this dataframe to get a sense of what’s inside it.


    ```python

    In[1]: df.head()

    Out[1]: 0     1       2      3         4         5 0    800  0.0  0.3048  71.3  0.002663  126.201
    1    1000  0.0  0.3048  71.3  0.002663  125.201 2    1250  0.0  0.3048  71.3  0.002663  125.951
    3    1600  0.0  0.3048  71.3  0.002663  127.591 4    2000  0.0  0.3048  71.3  0.002663  127.461

    ```


    We can see that it’s a table of numbers, which makes sense.


    ```python

    In[2]: df.info()

    <class ''pandas.core.frame.DataFrame''>

    RangeIndex: 1503 entries, 0 to 1502

    Data columns (6 columns):

    0      1503 non-null int64

    1      1503 non-null float64

    2      1503 non-null float64

    3      1503 non-null float64

    4      1503 non-null float64

    5      1503 non-null float64

    dtypes: float64(5), int64(1)

    memory usage: 70.5 KB

    ```


    Recall that as per the documentation, the first 5 columns are inputs, and the
    final column is output. Crucially let me remind you that all we have right now
    is a table of numbers! You can read the documentation to determine what they mean,
    but the code does not.


    Next we would like to extract `X` and `Y` as Numpy arrays from the dataframe.
    These columns don’t have names other than the default 0, 1, 2, 3, 4 so we can
    use these integers as column names. 0-4 represents `X`, and 5 represents `Y`.


    ```python

    data = df[[0,1,2,3,4]].values

    target = df[5].values

    ```


    Next, we would like to do a train test split as we did before.


    ```python

    from sklearn.model_selection import train_test_split

    X_train, X_test, y_train, y_test = train_test_split(data, target, test_size=0.33)

    ```


    We’re going to use a `LinearRegression` model to solve our problem. Let’s import
    `LinearRegression`.


    ```python

    from sklearn.linear_model import LinearRegression

    ```


    Notice how all these steps are the same as before. We instantiate the object.


    ```python

    model = LinearRegression()

    ```


    We call `fit`.


    ```python

    model.fit(X_train, y_train)

    ```


    We call `score` to evaluate the model.


    ```python

    In[3]: print(model.score(X_train, y_train))

    0.5036858385032759

    In[4]: print(model.score(X_test, y_test))

    0.528662769515345

    ```


    Remember these don’t represent “accuracy” since we’re not doing classification.
    This number is $R^2$. Close to 1 is better, but 0.5 is actually not bad even though
    normally you might consider a classification rate of 0.5 as bad.


    Finally I want to point out that regression models also have a `predict` function.
    So if you have new data tomorrow you would like to make predictions for, this
    is how you do it.


    ```python

    predictions = model.predict(X_test)

    ```


    ```python

    In[6]: predictions

    Out[6]: array([122.1680307, 118.5415739, 119.9438255])

    ```


    Just a list of numbers, as expected. Finally just as we did with classification,
    we might want to see what happens if we use a different model. This time I choose
    `RandomForestRegressor`. Notice how this seems very similar to what we used in
    the previous script which was `RandomForestClassifier`. Both these models have
    the same underlying algorithm, but one makes categorical predictions whereas the
    other makes real-valued predictions.


    In scikit-learn, if you’re doing regression, your class name generally ends with
    “Regressor”, whereas if you’re doing classification your class name generally
    ends with “Classifier” (but there are some exceptions to this). By now you are
    probably noticing the pattern! We instantiate the model.


    ```python

    from sklearn.ensemble import RandomForestRegressor

    model2 = RandomForestRegressor()

    ```


    We call `fit`.


    ```python

    model2.fit(X_train, y_train)

    ```


    Now we call `score` to evaluate the model.


    ```python

    print(model2.score(X_train, y_train))

    0.9824755927334798

    print(model2.score(X_test, y_test))

    0.8951934422429184

    ```


    Pretty good!


    # What is a Feature Vector?


    In machine learning you’ll often hear people talk about “feature vectors”. In
    this chapter I want to demystify this concept. I’ve given longer talks about this
    before, but my intention in this chapter is to make this discussion super compact.


    Firstly what is a vector? A vector is just a list of numbers. `[1, 2, 3]` is a
    vector. Recall that we can draw vectors in the cartesian plane if they are 2-D.
    ![](image663.jpg) In machine learning we don’t draw them as arrows but rather
    as dots. These visualizations will be important when we talk about machine learning
    as a geometry problem.


    Consider our dataset for predicting grades. The first row corresponds to a student
    who studied for 10 hours, played 0 hours of video games, and achieved a grade
    of 99. The 99 is the target and the vector `(10, 0)` is the feature vector for
    that sample. A feature vector is just a vector containing the input features.


    As a side note one usually asks: “How can I come up with good features for my
    model?” ![Screen Shot 2018-08-20 at 11.58.51 PM-1.png](image675.jpg)


    That is a deep topic worthy of a long discussion, but for the scope of this book
    we can say that coming up with a good feature vector usually requires domain knowledge.
    For example an expert in finance can probably determine good features for a financial
    forecasting model, but not for a biology model. Conversely a biologist can probably
    come up with good features for a biology model, but not for a financial model.
    The answer is thus to be an expert in your respective field. Of course we are
    all experts in studying for exams and so it is quite intuitive what would be a
    good feature and what would not, in the above example. We know that the number
    of hours you studied is probably predictive, whereas your height is probably not.
    Your exam grade is probably not affected by how tall you are.

    '
