    \ model.fit(X\\_train, y\\_train) \\# evaluate the model's performance model.score(X\\\
    _train, y\\_train) model.score(X\\_test, y\\_test) Only the data has changed!\
    \ This is why we say “all data is the same ”. The machine learning algorithm doesn’t\
