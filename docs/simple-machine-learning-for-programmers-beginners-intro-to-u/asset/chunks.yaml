    \ over 10 million images. This is today’s benchmark for image classification.\
    \ Imagine having to go through every image and label it properly. So for example,\
    \ if the image is of a cat, you have to label it cat. If the image is of a dog,\
    \ you have to label it dog. But it’s not just cats and dogs you have to label.\
    \ In fact, `ImageNet` has 1000 different classes! This is extremely time-consuming.\
    \ You definitely can’t do this by yourself. Maybe you can pay someone to do it\
    \ for you. But now it costs money. Imagine you’re a startup, and you need to label\
    \ 10 million training samples. Is that always going to be feasible? The answer\
    \ is no.\n\nThis is where `unsupervised learning` comes into play. `Unsupervised\
    \ learning` means we have an `X`, but we don’t have a `Y`. In other words, we\
    \ have a bunch of images or a bunch of emails, but no labels for them. Can we\
    \ still learn something from this data? Yes! One example of this is `clustering`.\
    \ As an example, we might collect data from a bunch of news articles, but it’s\
    \ too time consuming for us to actually read through them all manually. We can\
    \ apply `clustering`, and look to see what patterns we find. We may find that\
    \ one cluster contains a lot of articles about technology, and another cluster\
    \ contains a lot of articles about politics. Thus, `clustering` allows us to group\
    \ together similar items without needing to label them by hand, which as we discussed,\
    \ saves both time and money.\n\n## Reinforcement Learning\n\nThe third kind of\
    \ machine learning I want to talk about is `reinforcement learning`. Here is where\
    \ things get really tricky. First, let me tell you about some applications. `Reinforcement\
    \ learning` has been used to produce some tremendous results in the recent past.\
    \ Some examples are `AlphaGo` - which beat the world Champion in the game of Go.\
    \ This is despite the fact that many experts didn’t think this would be possible\
    \ for another 10 years. Then, a few years after that, we got `AlphaZero`, which\
    \ is an even bigger improvement over `AlphaGo`. One big difference between `AlphaGo`\
    \ and `AlphaZero` is that `AlphaGo` required knowledge about human strategies\
    \ whereas `AlphaZero` learned to play Go totally on its own, playing against itself.\n\
    \nAnother important application of `Reinforcement Learning` is playing video games.\
    \ These algorithms have demonstrated superhuman abilities at `Atari` games and\
    \ more recently `Dota 2`. Video games are important because they simulate physics.\
    \ If an algorithm is capable of learning simulated physics, then it’s reasonable\
    \ to assume that the same algorithm can learn real-world physics. And in fact,\
    \ we have some examples of `RL` algorithms that can learn to walk, run, jump,\
    \ and navigate.\n\n## Conclusion\n\nBut as I said earlier, `reinforcement learning`\
    \ is tricky. It’s a whole different beast than `supervised` and `unsupervised\
    \ learning`. In my opinion, if you want to tackle `RL`, it’s good to get solid\
    \ grounding in `supervised` and `unsupervised learning` first. Finally, there\
    \ are a ton of practical concepts that we haven’t talked about in this course.\
    \ We touched on train and test sets, and why it’s always the test set that you\
    \ actually care about. This is definitely a topic we’re going to study more-depth.\
    \ Some concepts related to this are: `generalization`, the `bias-variance trade-off`,\
    \ and `cross-validation`. Another important topic is hyperparameters. If you look\
    \ at the documentation for `RandomForestClassifier` or `MLPClassifier`, you’ll\
    \ notice that they actually come with tons of options - although we didn’t use\
    \ them. What are these options? What are good values and what are not good values?\
    \ How should we choose them? One example: we know that the random forest consists\
    \ of an ensemble of decision trees. How many decision trees should we actually\
    \ use? This is a hyperparameter. Hyperparameter selection is a very important\
    \ topic in modern deep learning as well.\n\n### Takeaways\n- Machine learning\
    \ isn’t magic, it’s just geometry.\n- All data is the same.\n- All machine learning\
    \ interfaces are the same.\n- Learning machine learning isn’t about trying new\
    \ datasets, it’s about learning the theory behind the algorithms.\n"
