    \ a “flowchart” or diagram as: `input > model > prediction`\n\n### Making correct\
    \ predictions\n\nHow does the machine learning classifier learn to make correct\
    \ predictions? This is where the “learning” in “machine learning” comes in. Normally,\
    \ in machine learning, we have a table of data from which to learn (we’ll see\
    \ exactly how works programmatically shortly). But not only do we have the input\
    \ data like the images or the text or user attributes, but we also have the correct\
    \ answer. Usually, people refer to these as the labels or the targets. In my courses\
    \ we usually use these 2 words interchangeably.\n\nThe short answer for “how”\
    \ a classifier learns to make correct predictions is that the model is given lots\
    \ of examples of inputs and their true labels, and some algorithm learns to identify\
    \ this pattern. The long answer is that once you’re given a set of data (consisting\
    \ of inputs and corresponding targets), there are actually many different kinds\
    \ of learning algorithms you can apply. If you move beyond this course, those\
    \ are the algorithms you’d learn (linear regression, logistic regression, decision\
    \ trees, random forests, neural networks, etc.). Of course, that’s where the math\
    \ comes in - and in this book I’ve promised you no math.\n\n### What does data\
    \ “look like?”\n\nAt this point, we’ve looked at some examples (image classification,\
    \ text classification, click classification), but what does the data actually\
    \ like when it sits on your computer? We know that data takes the form of “inputs”\
    \ and “targets”, but how are these represented?\n\nWhat a great time for another\
    \ example! This one will be simple so that it can actually fit on the page. Suppose\
    \ I’d like to predict whether or not the students in my class will pass or fail\
    \ my exam (another binary classification problem). I take some measurements from\
    \ past students to help me make this prediction: the number of hours they studied\
    \ and the number of hours they spent video games during the study period. I can\
    \ make a table containing all these measurements. Each row represents the measurements\
    \ for a different student.\n\n![Screen Shot 2018-08-20 at 2.58.15 PM.png](image195.jpg)\n\
    \nThus, you can imagine your data being stored as a `CSV` (comma-separated values)\
    \ spreadsheet. In memory, your input data (the first 2 columns of the table) would\
    \ be represented by a `2-D array`. Your targets (the last column of the table,\
    \ highlighted in gray) would be represented by a `1-D array` of the same length.\
    \ The idea behind machine learning is that I can learn to identify patterns from\
    \ this data. So for next year’s class, I can ask a student, “How many hours did\
    \ you study and how long have you spent playing games?” and using that data I\
    \ can predict whether or not that student will pass my exam.\n\n### The black\
    \ box perspective\n\nWhat we need in our case is a useful abstraction. Let’s treat\
    \ the machine learning algorithm like a black box. We can assume this black box\
    \ is capable of doing 2 things:\n1. It can learn a pattern based on training data.\
    \ Remember, this training data consists of 2 parts: the input, and the corresponding\
    \ targets. People usually call these `X` and `Y`, respectively.\n2. After it learns\
    \ the pattern from the training data, it can make predictions on new data. For\
    \ example, Gmail’s spam classifier has probably never seen the emails I got today,\
    \ before today. So how can Gmail’s spam classifier take an email it has never\
    \ seen and predict whether it’s spam or not spam? The reason is due to #1 - it\
    \ has learned to correctly identify the patterns between spam and non-spam.\n\n\
    ### How does it work in code?\n\nNow that we have a basic idea of how classification\
    \ works, we can start looking at code. Luckily, the `scikit-learn` API has exactly\
    \ the 2 functions we need to perform the 2 tasks we just talked about. Let’s first\
    \ consider our data. Remember, we usually call these `X` and `Y`. We discussed\
    \ earlier that `X` will be a `2-D array` and `Y` will be a `1-D array` of the\
    \ same length.\n\n```python\nX, Y = load_data()\nmodel = RandomForestClassifier()\n\
    model.fit(X, Y)\npredictions = model.predict(X)\naccuracy = model.score(X, Y)\n\
    ```\n"
