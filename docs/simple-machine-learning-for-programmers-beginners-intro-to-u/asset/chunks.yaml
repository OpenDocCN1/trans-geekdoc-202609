    记住，根据文档，前 5 列是输入，最后一列是输出。至关让我提醒你，我们现在拥有的只是数字表格！你可以阅读文档来确定它们的含义，但代码本身并没有说明。


    接下来，我们想从 dataframe 中提取 `X` 和 `Y` 作为 Numpy 数组。这些列除了默认的 0, 1, 2, 3, 4 外没有名称，所以我们可以这些整数作为列名。0-4
    代表 `X`，5 代表 `Y`。


    ```python

    data = df[[0,1,2,3,4]].values

    target = df[5].values

