- raw: 'What is Regression? In this chapter, we are going to move on to another major
    task in supervised machine learning, known as regression. I think classification
    is always a nice place to start, because it’s logically intuitive. “Here is an
    image. Tell me what object is in it.” “Here is an email. Tell me if it’s spam
    or not spam.” “Here are some measurements from a medical test. Tell me whether
    or not this person has some disease.” It just makes sense. Regression is also
    very intuitive, but it’s intuitive in a visual way. Let us see how. Here are some
    dots on the x-y plane.￼ ![](image443.jpg)It should be pretty clear to you that
    these dots form a pattern. In fact, you can draw a line straight through these
    dots, and you probably even pictured this line in your head, even though there
    wasn’t one there to begin with. Here’s another example. ![](image453.jpg)This
    one is not a line, but remarkably, we can all still probably imagine what kind
    of curve would go through these points. That’s all there is to regression. “Here
    are some dots, now tell me the line or the curve that fits these dots.” How is
    regression different from classification? Classification means you’re predicting
    a category. Regression means you’re predicting a number. This number is usually
    a number on the real line. With classification I’m predicting things that have
    no numerical meaning. If I see an email I want to know if it’s spam or not spam.
    You might object here, since in the code spam / not-spam was encoded as 0 and
    1. In actuality, these numbers don’t matter. These numbers are just symbols to
    represent the actual category (because they are inside a computer and everything
    inside a computer is a number). It doesn’t matter if spam is 0 and not-spam is
    1 or vice versa. In regression, the numbers actually do have meaning. Example
    #1: Height vs. Weight Of course, this chapter wouldn’t be complete without some
    real life examples of how regression can be applied. Here’s a simple one. Given
    a person’s height, I would like to predict their weight. Or vice versa.￼ ![](image472.jpg)Naturally,
    a taller person has more mass, and therefore weighs more. This correlation isn’t
    perfect, but generally it’s true. You can imagine, for instance, that a dinosaur
    weighs much more than an ant. Example #2: House Price Prediction Another common
    application of regression is predicting house prices. If you’re in real estate
    or you’re in the business of buying and selling property, this is going to be
    very relevant to you. Note that in the pictures we looked at earlier, we were
    able to visualize the data as a 2-D plot because we had 1 input (the independent
    variable) and 1 output (the dependent variable). But just like with classification,
    we can have more than one input. For example, the price of a house may correlate
    with the average family income in the neighborhood, and also the crime rate in
    that neighborhood. It might also depend on attributes like its size, how many
    bedrooms it has, and when it was last renovated. When you’re in higher dimensions,
    the thing you’re predicting is no longer a line. If you have 2 inputs and 1 output,
    then you have 3 dimensions in total so you’re looking at a plane, or if it’s curved,
    then a surface. If you have more than 2 inputs then you have a hyperplane or a
    hypersurface. Of course, human eyes and human minds don’t generally have the capability
    to visualize such objects. Example #3: Predicting Stocks Let me just give you
    one more example here since for both regression and classification I want to give
    you a real business application where people can take these ideas and make lots
    of money from them. We’ve all heard of the stock market. Generally, one of the
    “rules” for playing the stock market is you should buy low and sell high. That
    way, you always get more money than you put in. Of course, things don’t always
    work out this way and many people let their emotions and fear get the best of
    them, but that’s a story for another course. From a machine learning perspective,
    what would we like to do? It’s actually pretty simple. We would like to take some
    inputs, for instance, the price for that stock for the past 10 days, whether or
    not the company had a news article written about it yesterday, and whether or
    not the news was positive. We can take those inputs, and output a prediction for
    the price of the stock tomorrow. Of course, if you can do this accurately, you
    can become very rich. Rough Outline of Code Let’s again look at some code so you
    have a good idea of what it’s going to look like in the following exercise. As
    before, we’re going to start with “What does the data look like?” We again have
    2 items: X, which contains our input data Y, which contains our corresponding
    targets. Crucially, note that their shapes are the same as in the classification
    case. X is a 2-D array of shape NxD, and Y is a 1-D array of length N. N = number
    of samples and D = number of input features. Here’s another example to help you
    visualize what’s going on. Suppose I’d like to predict your exam grade out of
    100. As input data, I’m again going to ask you how many hours you studied for
    the exam and how many hours you spent playing video games during the exam period.
    The table below (which you may notice looks a lot like the classification case)
    displays some sample data. ![Screen Shot 2018-08-20 at 11.58.51 PM.png](image514.jpg)As
    usual, when we represent this in code, they are just arrays of numbers. The arrays
    don’t know what those numbers represent, since the “meaning” of each column is
    purely conceptual. What does the actual code look like? Lucky for us, it actually
    looks exactly the same as before. First, we instantiate the model. Let’s suppose
    we’re using linear regression. model = LinearRegression() Then, we train the model,
    by calling fit and passing in X and Y. model.fit(X, Y) We can also make new predictions
    by calling the predict function. predictions = model.predict(X) Finally, we can
    evaluate the model by calling the score function. model.score(X, Y) One minor
    difference with regression is that the score function no longer returns the accuracy,
    which only makes sense when we’re doing classification. That’s because the accuracy
    is just # correct / # total. That makes sense when we have labels, because if
    you guess the right label, then you’re correct, otherwise, you’re not. But for
    regression, that doesn’t make sense. Suppose the price of a house is $1 million,
    and we predict $1 million+1. Does that mean we’re wrong? No. In fact, intuitively
    we know this prediction is pretty good. It’s not “correct” since $1 million !=
    $1 million + 1. So accuracy may not be the best evaluation metric. In general,
    one way to measure the performance of a regression model is to use the mean squared
    error (MSE). The mean squared error is the average of the squared difference between
    each prediction and its corresponding target. However, the MSE is not what is
    returned by the score function. Why? Let’s think about why we might not want a
    score function to return the mean squared error. Consider house prices again.
    These are numbers that are going to range from a few hundred thousand, to millions.
    Now think about grades. These are numbers that are going to range from 0 to 100.
    Magnitude matters. You don’t really care if a house costs $1 million, and you
    guess $1 million+100. That’s still a pretty good prediction. But, if you’re predicting
    grades, then a difference of 100 in the prediction is huge.  That’s as large as
    the entire range of possible values. What we care about is the relative difference
    between the squared error and the range of possible values. Instead, we use a
    measurement called the R2 (“R-squared”). If you want to read more about it, I
    would suggest Wikipedia - but I promised you no math in this book and I’m sticking
    to it. Instead, I’ll tell you how to interpret the R2 . Generally, it’s going
    to be a number less than or equal to 1. 1 means your prediction is perfect. There
    is no difference between your prediction and the targets. 0 means your model is
    doing the dumbest thing possible - just predicting the average value of the targets.
    For example, if your targets are \[1, 2, 3, 4, 5\], that means you’re predicting
    3 every time. We say this is “dumb” because it doesn’t consider the input data
    at all. It is possible for your R2 to be negative. In this case, your model performs
    worse than simply predicting the mean target, which means your model is pretty
    bad. '
