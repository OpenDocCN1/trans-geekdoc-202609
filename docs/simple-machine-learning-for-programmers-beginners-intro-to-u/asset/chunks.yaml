    ```python

    In[2]: df.info()

    <class ''pandas.core.frame.DataFrame''>

    RangeIndex: 1503 entries, 0 to 1502

    Data columns (6 columns):

    0      1503 non-null int64

    1      1503 non-null float64

    2      1503 non-null float64

