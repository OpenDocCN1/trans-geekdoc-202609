- raw: 'Comparing Different Machine Learning Models In this chapter, we’re going to
    expand on the idea that “all machine learning interfaces are the same”. When you
    hear this, I think a question immediately comes to mind. If all model interfaces
    are the same, then which model should I choose? In my code, it takes no more lines
    of code to use Linear Regression than it does to use a neural network. So, why
    shouldn’t I always just pick the most powerful model? But more importantly, how
    do I know which model is the most powerful in the first place? All important questions.
    My answer, which I know is going to disappoint some of you is that: “There is
    no shortcut ”. In this chapter, I’m going to give you some general ideas and concepts
    to follow, but for the most part, nothing will replace actually learning how these
    models work. That means, learning the algorithms, learning the math, understanding
    where these models fail and where they succeed, and so forth. Nothing will replace
    that experience and knowledge. Let’s start with a general overview. By the way,
    if you want a list of all the models that are available in scikit-learn, just
    go to the documentation. This chapter will list some, but not all models. Let’s
    start with the most basic type of model - linear models. These are called linear
    models because the geometry is always a line, plane, or hyperplane. In other words,
    they are never curved. You can probably already see a significant disadvantage
    here. For example, what if your data follows the shape of a polynomial or a sine
    wave? One advantage is that these models are very easy to interpret. For example,
    if my formula is: weight (lbs) = 80 + 2\*height (inches) Then I can immediately
    see that, for every inch taller you are, your weight goes up by 2 pounds. In general,
    you lose this kind of interpretability with other models. After this, we have
    more basic models, but these are nonlinear. However, don’t be fooled! Just because
    these are nonlinear does not mean they are more powerful than a linear model.
    To really know which model is going to work better on your particular dataset,
    you just need to experiment. Some examples of these basic models are Naive Bayes,
    Decision Trees, and K-Nearest Neighbor. (Side note: for certain distributions,
    Naive Bayes simplifies to a linear model.) In this book, it’s not my goal to talk
    about any of the details of these models, since I have other courses that go very
    in-depth, but I just want you to know that they exist. Another category of models,
    which I would not consider “basic”, are ensemble models. We’ve seen one example
    of this already - the random forest. Other examples include AdaBoost, ExtraTrees,
    and Gradient Boosted Trees. The way these generally work is they take a very large
    number of individual decision trees (e.g. 200 of them) but they train these trees
    over different subsets of the input data X. What you get out of the training process
    is 200 different trees, all trained in a slightly different way. It turns out,
    that when you average the predictions from these trees, the result is very powerful.
    In fact, there’s a variant of the gradient boosted tree called “XGBOOST” which
    has been used to win a significant number of Kaggle contests. Ensemble models
    were also used to win the famous Netflix prize, which was a $1 million prize hosted
    by Netflix to predict movie ratings. Needless to say, ensemble methods are very
    powerful. They are also very easy to “plug-and-play” as we saw in this book. You
    didn’t really have to think about the data itself - just plug in X and Y and watch
    it go! This is opposed to a deep neural network - you saw that standardizing the
    data was required to achieve good performance. Another model that kind of sits
    on its own is the support vector machine. The support vector machine, or SVM,
    is very interesting because it was the state of the art and the “go-to” machine
    learning model for a long time. These days that title goes to neural networks,
    but in the past, SVMs actually beat out neural networks at many tasks. SVMs are
    also very powerful, nonlinear classifiers, but one problem with them is that they
    don’t scale. In other words, if your dataset is too large, it becomes infeasible
    to use this model. These days, because most datasets are large, this immediately
    disqualifies SVM. The final category I want to talk about is deep learning methods.
    In fact, we’ve already used deep learning in this book, with the MLPClassifier.
    Of course, this barely scratches the surface. As of the writing of this book,
    I already have 10 deep learning courses, with more on the way. There is so much
    to learn, and even I am still constantly learning. As I mentioned earlier in this
    book, deep learning is responsible for producing new state of the art results
    in both computer vision and NLP, which cover the 2 “fundamental” data types that
    seem to appear naturally (images and text). At the same time, unlike the other
    models we’ve discussed in this lecture, deep learning models are not good with
    plug and play. Sure, there is the MLPClassifier, which works on the type of data
    we looked at in this book, but modern deep learning models are generally more
    complex. And so for images and text and other complex data types, you can’t use
    scikit-learn. Instead, you have to look to more specialized libraries, such as
    Theano, Tensorflow, and Keras. In fact, it wasn’t until recently that the MLPClassifier
    was even included in scikit-learn. There was discussion where developers were
    against including it, because of the fact that deep neural networks are not really
    meant to be plug and play like the rest of the models in the scikit-learn library.
    The following table best summarizes the above discussion. What I don’t want you
    to do is take this table as gospel. There are always exceptions to the rule and
    in machine learning this happens more often than not. It’s important to remember
    that machine learning is a field of experimentation, not a field of philosophy.
    So if you ever find yourself asking “How would such and such work in this situation?”
    That is never a good idea. A better approach to take is just to code it up and
    see the results for yourself. Remember: Experimentation, NOT philosophy. Keep
    in mind this is just my personal grouping, and it’s what I think on this particular
    day. If you ask me on another day, I might think something else. So again - what’s
    more important is to learn about these models for yourself.￼ ![Screen Shot 2018-08-21
    at 3.06.03 AM.png](image835.jpg)For linear models, some examples are linear regression
    and logistic regression. They’re not that powerful, but they are easy to interpret,
    they scale well, and it’s easy to use them for plug and play on any dataset. Next,
    we have some models that are still pretty basic, but not necessarily linear. They
    can be flexible and very expressive, but that does not necessarily mean they are
    powerful. I’m using the term “powerful” very loosely here so you have to take
    this with a grain of salt. The advantage of these models is they’re easy to interpret,
    some of them scale well, and you can plug and play with them. Next, we have ensemble
    methods. As we discussed, these are very powerful and have been used to win many
    actual machine learning prizes. They also generally scale very well and they can
    be used for plug and play. Ensemble methods are easy to parallelize, meaning they’ve
    been written for distributed computing frameworks such as Spark. So, you can spread
    out your work across 100 different machines and get the result faster than you
    would have using just 1 machine. Next, we have SVM, which just sits by itself.
    SVMs very powerful and they used to be the “go-to” method for many people doing
    machine learning, but they just don’t scale to today’s datasets. Finally, we have
    deep learning. Very powerful, and state of the art for many tasks. They don’t
    really scale per se, since training large neural networks has been known to take
    weeks or longer, but we can reduce the time necessary for training by using special
    hardware. Deep learning is the least plug-and-playable group of all of these methods. '
  fmt: "\n# Comparing Different Machine Learning Models\n\nIn this chapter, we’re\
    \ going to expand on the idea that “all machine learning interfaces are the same”.\
    \ When you hear this, I think a question immediately comes to mind. If all model\
    \ interfaces are the same, then which model should I choose? In my code, it takes\
    \ no more lines of code to use `Linear Regression` than it does to use a neural\
    \ network. So, why shouldn’t I always just pick the most powerful model? But more\
    \ importantly, how do I know which model is the most powerful in the first place?\
    \ All important questions. \n\nMy answer, which I know is going to disappoint\
    \ some of you is that: “There is no shortcut”. In this chapter, I’m going to give\
    \ you some general ideas and concepts to follow, but for the most part, nothing\
    \ will replace actually learning how these models work. That means, learning the\
    \ algorithms, learning the math, understanding where these models fail and where\
    \ they succeed, and so forth. Nothing will replace that experience and knowledge.\
    \ Let’s start with a general overview. By the way, if you want a list of all the\
    \ models that are available in `scikit-learn`, just go to the documentation. This\
    \ chapter will list some, but not all models.\n\n## Linear Models\n\nLet’s start\
    \ with the most basic type of model - linear models. These are called linear models\
    \ because the geometry is always a line, plane, or hyperplane. In other words,\
    \ they are never curved. You can probably already see a significant disadvantage\
    \ here. For example, what if your data follows the shape of a polynomial or a\
    \ sine wave? \n\nOne advantage is that these models are very easy to interpret.\
    \ For example, if my formula is:\n`weight (lbs) = 80 + 2*height (inches)`\nThen\
    \ I can immediately see that, for every inch taller you are, your weight goes\
    \ up by 2 pounds. In general, you lose this kind of interpretability with other\
    \ models.\n\n## Basic Nonlinear Models\n\nAfter this, we have more basic models,\
    \ but these are nonlinear. However, don’t be fooled! Just because these are nonlinear\
    \ does not mean they are more powerful than a linear model. To really know which\
    \ model is going to work better on your particular dataset, you just need to experiment.\
    \ Some examples of these basic models are `Naive Bayes`, `Decision Trees`, and\
    \ `K-Nearest Neighbor`. (Side note: for certain distributions, `Naive Bayes` simplifies\
    \ to a linear model.) In this book, it’s not my goal to talk about any of the\
    \ details of these models, since I have other courses that go very in-depth, but\
    \ I just want you to know that they exist.\n\n## Ensemble Models\n\nAnother category\
    \ of models, which I would not consider “basic”, are ensemble models. We’ve seen\
    \ one example of this already - the `random forest`. Other examples include `AdaBoost`,\
    \ `ExtraTrees`, and `Gradient Boosted Trees`. \n\nThe way these generally work\
    \ is they take a very large number of individual decision trees (e.g. 200 of them)\
    \ but they train these trees over different subsets of the input data `X`. What\
    \ you get out of the training process is 200 different trees, all trained in a\
    \ slightly different way. It turns out, that when you average the predictions\
    \ from these trees, the result is very powerful. \n\nIn fact, there’s a variant\
    \ of the gradient boosted tree called `XGBOOST` which has been used to win a significant\
    \ number of Kaggle contests. Ensemble models were also used to win the famous\
    \ Netflix prize, which was a $1 million prize hosted by Netflix to predict movie\
    \ ratings. Needless to say, ensemble methods are very powerful. They are also\
    \ very easy to “plug-and-play” as we saw in this book. You didn’t really have\
    \ to think about the data itself - just plug in `X` and `Y` and watch it go! This\
    \ is opposed to a deep neural network - you saw that standardizing the data was\
    \ required to achieve good performance.\n\n## Support Vector Machines\n\nAnother\
    \ model that kind of sits on its own is the `support vector machine`. The support\
    \ vector machine, or `SVM`, is very interesting because it was the state of the\
    \ art and the “go-to” machine learning model for a long time. These days that\
    \ title goes to neural networks, but in the past, `SVMs` actually beat out neural\
    \ networks at many tasks. `SVMs` are also very powerful, nonlinear classifiers,\
    \ but one problem with them is that they don’t scale. In other words, if your\
    \ dataset is too large, it becomes infeasible to use this model. These days, because\
    \ most datasets are large, this immediately disqualifies `SVM`.\n\n## Deep Learning\
    \ Methods\n\nThe final category I want to talk about is deep learning methods.\
    \ In fact, we’ve already used deep learning in this book, with the `MLPClassifier`.\
    \ Of course, this barely scratches the surface. As of the writing of this book,\
    \ I already have 10 deep learning courses, with more on the way. There is so much\
    \ to learn, and even I am still constantly learning. \n\nAs I mentioned earlier\
    \ in this book, deep learning is responsible for producing new state of the art\
    \ results in both computer vision and `NLP`, which cover the 2 “fundamental” data\
    \ types that seem to appear naturally (images and text). At the same time, unlike\
    \ the other models we’ve discussed in this lecture, deep learning models are not\
    \ good with plug and play. Sure, there is the `MLPClassifier`, which works on\
    \ the type of data we looked at in this book, but modern deep learning models\
    \ are generally more complex. \n\nAnd so for images and text and other complex\
    \ data types, you can’t use `scikit-learn`. Instead, you have to look to more\
    \ specialized libraries, such as `Theano`, `Tensorflow`, and `Keras`. In fact,\
    \ it wasn’t until recently that the `MLPClassifier` was even included in `scikit-learn`.\
    \ There was discussion where developers were against including it, because of\
    \ the fact that deep neural networks are not really meant to be plug and play\
    \ like the rest of the models in the `scikit-learn` library.\n\n## Summary and\
    \ Philosophy\n\nThe following table best summarizes the above discussion. What\
    \ I don’t want you to do is take this table as gospel. There are always exceptions\
    \ to the rule and in machine learning this happens more often than not. It’s important\
    \ to remember that machine learning is a field of experimentation, not a field\
    \ of philosophy. So if you ever find yourself asking “How would such and such\
    \ work in this situation?” That is never a good idea. A better approach to take\
    \ is just to code it up and see the results for yourself. Remember: Experimentation,\
    \ NOT philosophy. \n\nKeep in mind this is just my personal grouping, and it’s\
    \ what I think on this particular day. If you ask me on another day, I might think\
    \ something else. So again - what’s more important is to learn about these models\
    \ for yourself.\n\n![Screen Shot 2018-08-21 at 3.06.03 AM.png](image835.jpg)\n\
    \nFor linear models, some examples are `linear regression` and `logistic regression`.\
    \ They’re not that powerful, but they are easy to interpret, they scale well,\
    \ and it’s easy to use them for plug and play on any dataset. Next, we have some\
    \ models that are still pretty basic, but not necessarily linear. They can be\
    \ flexible and very expressive, but that does not necessarily mean they are powerful.\
    \ I’m using the term “powerful” very loosely here so you have to take this with\
    \ a grain of salt. The advantage of these models is they’re easy to interpret,\
    \ some of them scale well, and you can plug and play with them. Next, we have\
    \ ensemble methods. As we discussed, these are very powerful and have been used\
    \ to win many actual machine learning prizes. They also generally scale well and\
    \ they can be used for plug and play. Ensemble methods are easy to parallelize,\
    \ meaning they’ve been written for distributed computing frameworks such as `Spark`.\
    \ So, you can spread out your work across 100 different machines and get the result\
    \ faster than you would have using just 1 machine. Next, we have `SVM`, which\
    \ just sits by itself. `SVMs` very powerful and they used to be the “go-to” method\
    \ for many people doing machine learning, but they just don’t scale to today’s\
    \ datasets. Finally, we have deep learning. Very powerful, and state of the art\
    \ for many tasks. They don’t really scale per se, since training large neural\
    \ networks has been known to take weeks or longer, but we can reduce the time\
    \ necessary for training by using special hardware. Deep learning is the least\
    \ plug-and-playable group of all of these methods.\n"
