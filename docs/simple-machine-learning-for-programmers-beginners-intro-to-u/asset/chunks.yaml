    # 机器学习与深度学习：未来主题


    在本章中，我想让你们初步了解一下存在的其他类型的机器学习，以及一些你们可以期待学习的未来主题。


    我希望你意识到，由于特殊性，这本书的内容是非常局限的。这本书的唯一目的是教你如何使用 `scikit-learn` API，并开始从几何的角度来思考机器学习。尽管这很简单，但仅仅是这些基础知识，达到这一水平仍然花费了一些时间！因此，我希望你能理解并欣赏机器学习中可以深入探索的深度。


    在本书中，我们学习了分类和回归任务。对于这两个问题，我们都给出了以输入 `X` 和目标 `Y` 形式提供的训练数据。在机器学习术语中，这被称为`监督学习`，因为你会被告知正确答案，并可以根据真实目标来修正你的猜测。


    ## 无监督学习


    但你可以想象，获取目标是一个耗时且昂贵的过程。考虑 `ImageNet` 数据集，这是一个包含超过 1000 万张图片的数据集。它是今天图像分类的基准。想象一下你必须处理每一张图片并对其进行正确标记。例如，如果图片是一只猫，你就必须将其标记为猫；如果图片是一只狗，你就必须将其标记为狗。但你需要标记的不仅仅是猫和狗。事实上，`ImageNet`
    拥有 1000 个不同的类别！这极其耗时。你绝对无法独立完成。也许你可以付钱让别人帮你做，但现在需要花费费用。想象你是一家初创公司，你需要标记 1000 万个训练样本。这总是可行的吗？答案是否。


    这就是`无监督学习`派上用场的地方。`无监督学习`意味着我们有 `X` 但没有 `Y`。换句话说，我们有很多图片或一组邮件，但对它们没有标签。我们还能从这些数据中学习到什么吗？可以！一个例子就是`聚类`。例如，我们可以从一组新闻文章中收集数据，但如果我们实际上手动阅读它们就太耗时了。我们可以应用`聚类`并观察发现什么模式。我们可能会发现一个簇包含许多关于技术的文章，而另一个簇包含许多关于政治的文章。因此，`聚类`允许我们在不需要手动标记的情况下将相似的项目归类，正如我们讨论过的，这既节省了时间又节省了金钱。


    ## 强化学习


    我想谈论的第三种机器学习是`强化学习`。在这里事情变得非常棘手。首先，让我告诉你们一些应用。`强化学习`在最近的过去取得了巨大的成果。一些例子包括 `AlphaGo`
    —— 它在围棋中击败了世界冠军。尽管许多专家认为这在 10 年内是不可能的。几几年之后，我们得到了 `AlphaZero`，它是对 `AlphaGo` 更更大的改进。`AlphaGo`
    和 `AlphaZero` 之间一个很大的区别是 `AlphaGo` 需要人类策略的知识，而 `AlphaZero` 完全通过自我对弈学会了下棋。


    `强化学习`的另一个重要应用是玩视频游戏。这些算法在 `Atari` 游戏以及最近的 `Dota 2` 中展示了超人类。视频游戏很重要是因为它们模拟了物理学。如果一个算法能够学习模拟物理学，那么可以假设同样的算法也可以学习现实世界的物理学。事实上，我们有一些`RL`算法的例子，它们可以学习行走、跑步、跳跃和导航。


    ## 结论


    但正如我之前提到的，`强化学习`是复杂的。它与`监督学习`和`无监督学习`是完全不同的东西。在我看来，如果你想应对 `RL`，最好先在`监督学习`和`无监督学习`上打下坚实的基础。最后，还有许多在本课程中没有讨论过的实用概念。我们接触了训练集和测试集，以及为什么你真正关心的一直是测试集。这绝对是我们我们将深入研究的主题。与此相关的概念有：`泛化`、`偏差-方差权衡`(bias-variance
    trade-off）以及`交叉验证`。另一个重要主题是超参数。如果你查看 `RandomForestClassifier` 或 `MLPClassifier`
    的文档，你会发现它们实际上带有大量的选项——尽管我们没有使用它们。这些选项是什么？什么是好的值，什么是不好的值？我们应该如何选择它们？一个例子：我们知道随机森林是由决策树集成组成的。我们实际上应该使用多少棵决策树？这是一个超参数。超参数选择在现代深度学习中也是一个非常重要的课题。


    ### 核心点

    - 机器学习不是魔法，它只是几何学。

    - 所有数据都是一样的。

    - 所有的机器学习接口都是一样的。

    - 学习机器学习并不是尝试新的数据集，而是关于学习算法背后的理论。


    '
