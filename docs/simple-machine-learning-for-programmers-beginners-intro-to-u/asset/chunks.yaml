    # 什么是分类？


    在本章中，我们将介绍机器学习中的两个基本问题之一：“分类”。分类意味着我们正试图去预测一个类别。让我们通过例子来让这个概念更加具体。


    ### MNIST 这是一个机器学习的经典案例。事实上，在多年里，它一直是标准的基准测试。每当有人写新论文时，他们总是会报告其算法在该数据集上的性能。该数据由一组手写数字图像组成。可能的数字是从
    0 到 9。如果你正在构建一个机器学习模型，你的工作就是编写代码，将图像作为输入，并输出与图像对应的正确数字。


    ![](img/image97.jpg)


    你可能知道这只是手写识别的一种特例。一个更通用的分类器能够接收任何字符的图像，并将其映射到相应的字符（0-9、A-Z 以及可能的某些符号）。例如，你可以在纸上写字母“a”，给它拍张，你的代码就会输出字符“a”。这一个立竿见见的应用是将物理文档（手写或打印）转换为数字形式。我们称其为
    `OCR`（光学字符识别）。


    ### 数据类型


    在机器学习中，你会发现有两种非常常见的数据类型。MNIST 是由一组图像组成的。图像通常属于“计算机视觉”领域。之所以被称为计算机视觉，是因为你正在教计算机能够智能地处理图像。我们在机器学习中工作的另一种常见数据格式是文本。文本无处不在，就像图像一样。当我们处理文本时，我们就是在进行“自然语言处理”。顺带提一下，这两个领域被深度学习彻底改变了。得益于深度学习，计算机视觉和
    NLP 算法在近期都取得了巨大的进展。今天如果不讨论深度学习算法，你就上不上计算机视觉或 NLP 类。10 年前，甚至不会提到深度学习。


    ### 垃圾邮件分类


    既然我们已经讨论了图像分类的例子，现在让我们来讨论一个文本的例子。这应该很简单。垃圾邮件检测如何？你可能已经注意到，如今像 Gmail、Yahoo、Hotmail
    等现代电子邮件提供商会自动为你分类垃圾邮件和非垃圾邮件。你的垃圾邮件会自动进入一个名为“垃圾邮件”（Spam）的文件夹，而你的普通邮件直接进入收件箱。它们并不总是完全准确，但做得相当不错。


    这是如何实现的？嗯，这不是魔法。这只是机器学习。机器学习算法接收电子邮件作为输入，并输出一个预测：它会将该电子邮件分类为垃圾邮件或非垃圾邮件。我们看到模式了吗？机器学习分类算法接收一个输入，并输出一个类别预测！


    ### 商业案例


    当然，一定还有一些不属于图像和文本的分类例子。现在的企业正在利用机器学习来改进他们的服务并赚更多的钱。我们能想出一个例子吗？当然可以！我们都能共鸣的一个例子（无论你喜欢还是讨厌）是在线广告。这通常以横幅广告或视频广告的形式出现。在线广告是一个十亿美元行业，也是很多争议的来源。幸运的是，这本书不是关于广告伦理的。


    那么，在线广告商可以如何利用机器学习呢？假设广告商收集了一些关于你的数据。例如，他们知道你的年龄、性别和。他们知道你昨天在 Google 上搜索了“最好的跑步太阳镜”。需要知道的一个细节是，广告商有一组可以展示给你的广告（这些广告由他们的客户提供）。假设他们的客户包括：

    - 太阳镜公司

    - 泳衣公司

    - 办公家具公司

    - 妆美美容公司

    - 鞋子公司


    这些客户每一个都为广告商提供了一些广告，广告商的工作是向用户展示最好的广告。最好的广告是用户最可能点击并从中购买产品的广告。因此，对于每条广告，我们都要对用户是否会点击做出预测。一旦他们确定了哪条广告的点击概率最高，广告就会展示给你（用户）。当然，在上述列出的公司中，属于太阳镜公司的广告最适合你（但根据其他属性，也许并不不是！）。这个例子和垃圾邮件分类都是**二分类**的例子，意味着你的预测始终是
    2 个类别之一：

    1. 垃圾邮件

    2. 非垃圾邮件

    1. 点击

    2. 不点击


    ### 模式是什么？


    让我们尝试识别一下上一个例子中的共同主题。对于每个例子，我们都有三样东西：

    1. 输入数据（图像、文本或用户属性）

    2. 一个机器学习分类器

    3. 分类器做出的预测


    对于我们的例子，预测是：图像代表什么？邮件是垃圾邮件还是非垃圾邮件？这个用户会点击广告还是不会？你可以将这个过程视为一个“流程图”或图表：`input >
    model > prediction`


    ### 做出正确的预测


    机器学习分类器是如何学习做出正确预测的？这就是“机器学习”中“学习”的用武所在。通常，在机器学习中，我们有一张数据表从中学习（稍后我们将从程序角度详细说明它是如何工作的）。但我们不仅有图像、文本或用户属性等输入数据，我们还有正确答案。通常，人们称这些为标签（labels）或目标（targets）。在我的课程中，我们通常互换这两个词。


    对于分类器“如何”学习做出正确预测的简短回答是：给模型提供大量的输入示例及其真实标签，然后某些算法学习识别这种模式。长回答是，一旦你被给你一组数据（由输入和相应的目标组成），实际上有许多不同的学习算法可以应用。如果你离开了这门课程，那些将是你学习的算法（线性回归、逻辑回归、决策树、随机森林、神经网络等）。当然，那是数学发挥作用的地方——而在本书中，我承诺过你没有数学。


    ### 数据“长什么样？”


    到目前，我们已经看了一些例子（图像分类、文本分类、点击分类），但数据存储在你的计算机上实际上是什么样的？我们知道数据以“输入”和“目标”的形式存在，但它们是如何表示的呢？


    真是另一个另一个例子的好时机！这个例子将很简单，以便它实际上能放在页面上。假设我想预测我的班级学生是否会通过我的考试（另一个二分类问题）。我从过去的学生那里获取了一些测量值来帮助我做出这个预测：他们学习的小时数以及在学习期间玩游戏的小时。我可以创建一个包含所有这些测量值的表格。每行代表一个不同学生的测量值。


    ![Screen Shot 2018-08-20 at 2.58.15 PM.png](img/image195.jpg)


    因此，你可以想象你的数据被存储为 `CSV`（逗号分隔值）表格。在内存中，你的输入数据（表格的前 2 列）将由一个 `2-D array` 表示。你的目标（表格的最后一列，用灰色突出显示）将由一个相同长度的
    `1-D array` 表示。机器学习背后的想法是我可以学习从这些数据中识别模式。所以对于明年的班级，我可以问一个学生：“你学习了几个小时，玩游戏了多久？”并使用该数据，我可以预测该学生是否会通过我的考试。


    ### 黑盒视角


    在我们的情况下，我们需要一个实用的抽象。让我们把机器学习算法看作一个黑盒。我们可以假设这个黑盒能够做两件事：

    1. 它根据训练数据学习模式。记住，这些训练数据由部分组成：输入和相应的目标。人们通常分别称它们 `X` 和 `Y`。

    2. 在从训练数据学习模式后，它可以对新数据做出预测。例如，Gmail 的垃圾邮件分类器可能从未见过我今天收到的邮件。那么 Gmail 的垃圾邮件分类器如何处理它从未见过的邮件并预测它是垃圾邮件还是非垃圾邮件呢？原因在于
    #1 - 它已经学会了正确识别垃圾邮件和非垃圾邮件之间的模式。


    ### 代码中是如何工作的？


    现在我们已经对分类如何工作有了基本的了解，可以开始查看代码了。幸运的是，`scikit-learn` API 正好拥有我们刚刚讨论的两个任务所需的函数。让我们先考虑数据。记住，我们通常称它们为
    `X` 和 `Y`。我们之前讨论过 `X` 将是一个 `2-D array`，而 `Y` 将是一个相同长度的 `1-D array`。


    ```python

    X, Y = load_data()

    model = RandomForestClassifier()

    model.fit(X, Y)

    predictions = model.predict(X)

    accuracy = model.score(X, Y)

    ```


