    # 程序员的简单机器学习：作者 The Lazy Programmer


    ## 目录

    - 引言

    - 什么是分类？

    - 代码中的分类

    - 什么是回归？

    - 代码中的回归

    - 什么是特征向量？

    - 机器学习无非几何学

    - 所有数据都是同的

    - 比较不同的机器学习模型

    - 机器学习与深度学习：未来主题

    - 核心要点

    - 其他资源


    ## 引言

    这本书对我来说是一次实验。在在线教授了多年成功的深度学习和机器学习课程后，我观察到了一些模式。其中一种模式就是，大部分学生一看到数学就会**落荒而逃**。这有点小问题，因为机器学习本质上是应用数学（例如，你不是简单地写下方程，而是将方程编程到计算机中以执行某些有用任务）。很多学生问过我：“Lazy
    Programmer，通过 API 机器学习可能吗？”


    事实上，在编程中，为大型系统中的不同组件提供抽象的想法是一个非常强大的概念。这意味着你不需要非常详尽地理解每一行代码，而是信任其他程序员（他们都在构建各自的组件）已经完成了他们各自负责的那部分拼图。API
    是一份契约。它说：“你给我这个，我承诺还你回那个。”它让你能够只专注于编写你所负责的系统部分，因为你信任其他人已经正确地完成了他们的工作。


    这本书是一次实验，旨在看看学生在不需要进行任何数学或理论工作的情况下，能多好地学习机器学习的一些基本概念。如果你是一个想通过“API 方法”来学习机器学习的程序员，那么这本书非常适合你。我拥有总时长超过
    100 小时的数学、算法和理论课程。如果你找的是这些，那么这本书并不是你想要的。


    在本书中，我们将学习如何使用机器学习解决实际问题。我们甚至会学习如何在不需要理解其数学工作原理的情况下，应用简单的深度神经网络。我们将大量使用 Numpy
    栈：

    - `Numpy`

    - `Scipy`

    - `Matplotlib`

    - `Pandas`

    - `Scikit-Learn`


    这本书的另一个目标是为你学习更进阶的主题做准备。其中一个主题是自然语言处理（NLP）。本质上，`NLP` 是机器学习在文本上的应用。我在学生身上看到的一种常见模式是，他们经常在尝试处理
    NLP 时，从根本不知道什么是机器学习！这导致了各种奇怪的误解和错误的假设。如果你不知道某东西是什么，你就无法应用它。当然，结果就是产生过度的挫败感。


    到为止，我还没有地方可以指引这些学生去学习机器学习的基础。市面上大多数其他资源的问题在于，它们试图让机器学习听起来尽可能复杂。它们的目标是让机器学习听起来几乎像魔法一样。它们也利用
    API，但它们把代码视为一种咒语，而不是试图真正理解机器学习在做什么。


    我更倾向于务实的方法。与其让机器学习听起来像魔法，我我想让它听起来尽可能笨。事实上，我将向你证明，它仅仅是一个几何问题。这才是真正的直觉。你不需要变魔法，而是可以使用基本的空间推理能力来理解机器学习，这让你在实际实现机器学习算法时处于更好的位置——这是成为机器学习大师的下一步。


    '
