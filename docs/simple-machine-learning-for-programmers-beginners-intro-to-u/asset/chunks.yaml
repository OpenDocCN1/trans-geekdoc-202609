    # 比较不同的机器学习模型


    在本章中，我们将扩展“所有机器学习接口都是同的”这一观点。当你听到这种话时，我想你脑中会立刻浮现出一个问题：如果所有模型的接口都是同样的，那么我应该选择哪种模型呢？在我的代码中，使用
    `Linear Regression` 所需的代码行并不比使用神经网络多。那么，为什么我不应该一直选择最强大的模型呢？但更重要的是，我从一开始又如何知道哪个模型是最强大的呢？这些都是重要的问题。


    我的答案（我知道这会让你们中的一些感到失望）是：“没有捷径”。在本章中，我将给你们一些可以遵循的通用想法和概念，但在大多数情况下，没有任何东西可以替代实际学习这些模型是如何工作的。这意味着要学习算法、学习数学、理解这些模型在何时失败以及在何时成功等等。没有任何东西可以取代这种经验和知识。让我们从总的概述开始。顺便说一下，如果你想查看
    `scikit-learn` 中所有可用模型的列表，请直接查看文档。本章将列出一些模型，但不是全部。


    ## 线性模型


    让我们从最基础的模型类型开始——线性模型。它们之所以被称为线性模型，是因为它们的几何形状始终是直线、平面或超平面。换句话说，它们永远不是弯曲的。你可能已经看出这里有一个明显的劣势。例如，如果你的数据遵循多项式或正弦波的形状怎么办？


    一个优势是这些模型非常容易解释。例如，如果我的公式是：

    `weight (lbs) = 80 + 2*height (inches)`

    那么我可以立即看到，你每高一英寸，体重就会增加 2 磅。通常情况下，在其他模型中，你会失去这种解释性。


    ## 基础非线性模型


    之后，我们有了更基础的模型，但它们是非线性的。然而，不要被骗了！仅仅因为这些是非线性的并不意味着它们比线性模型更强大。要真正知道哪个模型在你的特定数据集上效果更好，你只需要进行实验。这些基础模型的示例包括
    `Naive Bayes`、`Decision Trees` 和 `K-Nearest Neighbor`。（旁注：对于某些分布，`Naive Bayes`
    会简化为线性模型。）在本书书中，我的目标不是讨论这些模型的任何细节，因为我还有其他非常深入的课程，我只想让你们知道它们的存在。


    ## 集成模型


    另一类我不认为是“基础”的模型是集成模型。我们已经看到过这方面的一个例子——`random forest`。其他例子包括 `AdaBoost`、`ExtraTrees`
    和 `Gradient Boosted Trees`。


    这些模型通常的工作方式是它们采用了大量的个体决策树（例如 200 棵），但它们在输入数据 `X` 的不同子集上训练这些树。你从训练过程中得到的是 200 棵不同的树，它们都是以略有不同的方式训练的。事实证明，当我们对这些树的预测取平均值时，结果是非常强大的。


    事实上，梯度提升树的一种变体叫做 `XGBOOST`，它已被用于赢得大量的 Kaggle 竞赛比赛。集成模型也被用于赢得了著名的 Netflix 奖赛，那是
    Netflix 举办的用于预测电影评分的奖金为 100 万美元的活动。不用说，集成方法非常强大。正如我们在书中看到的，它们也非常容易“即插即用”。你真的不需要考虑数据本身——只需插入
    `X` 和 `Y` 然后看着它运行即可！这与深度神经网络相反——你看到为了获得良好的性能，需要对数据进行标准化。


    ## 支持向量机


    另一个某种独立存在的模型是 `support vector machine`。


    '
