    \ At this point, it’s pretty clear that there is a pattern. All the boys go in\
    \ the top right corner and all the girls go in the bottom left corner. In order\
    \ to separate the 2 groups, I can draw a line or a curve between the red dots\
    \ and the blue dots. I would call that my classification boundary. Again, what\
    \ are lines and curves? Geometry! And so you see how classification too, is just\
    \ a geometry problem. It has nothing to do with boys or girls or heights or weights.\
    \ To generalize the problem: “here are some red dots” “here are some blue dots”\
    \ “find a line that goes between them” Machine learning is not magic. In reality,\
    \ it’s just a geometry problem. Some people like to say, machine learning is nothing\
