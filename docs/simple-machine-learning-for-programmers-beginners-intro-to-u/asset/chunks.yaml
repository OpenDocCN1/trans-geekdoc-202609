    首先，如果你不知道什么是翼型（Airfoil），它基本上就是飞机机翼。这个数据集是关于获取翼型的某些特定属性（例如频率和攻角），并尝试预测“声压级”。简单来说，就是声音有多大。如果你感兴趣，该
    URL 提供了关于数据的更多信息。


    让我们导入 Numpy 和 Pandas：


