- raw: "In this chapter, you’ll use Google to find information about yourself and\
    \ look for usernames and passwords with *Google hacking*. Then you’ll do further\
    \ recon using social media, and you’ll learn how to protect yourself by limiting\
    \ what information you share online. Information you don’t share is information\
    \ an attacker can’t use!\n\n## Google Yourself (Before Your Enemy Does)\n\nAn\
    \ attacker can use public information for a *phishing* attack, in which they pretend\
    \ to be someone you know and send a fake email asking for personal information\
    \ like your password. Many company websites have a staff listing or employee directory\
    \ with all the names and email addresses an attacker would need to launch a phishing\
    \ attack, or worse.\n\nLet’s find out what an attacker could see about you. Open\
    \ a web browser and search for your own name. I searched for my own name in Google,\
    \ as shown in [Figure 4-1](#c04.xhtml#figure4-1).\n\n![Figure 4-1: Search on your\
    \ own name in your favorite search engine.](image_fi/502000c04/f04001.png)\n\n\
    Figure 4-1: Search on your own name in your favorite search engine.\n\nAnyone\
    \ on the internet can find out what I do, where I work, and that I’ve written\
    \ books and published online courses in coding and cybersecurity. Clicking the\
    \ result links turns up a lot more information, including the kind of car I drove\
    \ in 2018 and some of my email addresses. Similarly, you may appear in photos\
    \ from work events, news articles, sports teams, church or nonprofit groups, and\
    \ social media pages and posts. Your name or image might even appear in articles\
    \ about your family or a high school or college reunion—things you didn’t realize\
    \ were on the internet.\n\nIt often takes just a few minutes’ reconnaissance to\
    \ discover where someone works, where they live, their age, who their family members\
    \ are, and more. Any one of these pieces of information alone might not be particularly\
    \ worrisome, but if enough information is available, an attacker could build a\
    \ complete profile on you, filled with family members’ names and birthdates, pets’\
    \ names, work and home locations, and so on. Armed with this information, an attacker\
    \ may be able to answer your password security questions, guess one of your passwords\
    \ entirely, or pose as someone you know in order to extract even more information\
    \ from you.\n\nIt’s harder than ever to protect your personal information, but\
    \ a little awareness can help you avoid some common mistakes. And a few skills\
    \ will help you find information that may already have been leaked about you,\
    \ your company, or your family, including your online accounts and passwords.\n\
    \n## Advanced Google Searching\n\nA simple web search is good recon, but the real\
    \ power of Google—Google hacking—comes from using advanced search commands. With\
    \ advanced searches, you can find usernames, passwords, security camera feeds,\
    \ and more. However, Google hacking techniques also put you at greater risk of\
    \ accidentally downloading malware. For protection, be sure to use these defenses:\n\
    \n*   Conduct your research inside the Kali Linux virtual machine you set up in\
    \ Chapter 3. Remember: actions you perform in a VM usually don’t affect your computer,\
    \ so the VM provides a layer of security. If you open an infected file in your\
    \ VM, you can simply delete and reinstall the virtual machine.\n\n*   Check whether\
    \ links have been infected with viruses before you click them. This is always\
    \ a good security measure, even inside a VM. VirusTotal is a free online tool\
    \ that scans web pages, files, and links for malware. We’ll use VirusTotal in\
    \ the next section to scan a file of passwords before opening it.\n\n*   Make\
    \ sure your computer has antivirus software installed in case you accidentally\
    \ click a link outside a VM and any malware gets on your computer during your\
    \ research.\n\nGoogle hacking hinges on the sophisticated use of *search operators*,\
    \ the symbols or words that make your search results more precise. You’re probably\
    \ familiar with some basic search operators already. For example, putting quotation\
    \ marks (“ ”) around a phrase searches for the exact phrase, instead of individual\
    \ words in the phrase. Using the operators *AND* and *OR* can help you find pages\
    \ with both words (*3D* AND *printer*) or either word (*coding* OR *cyber*).\n\
    \nOther search operators are less well-known, but they can be powerful hacking\
    \ tools. For example, the operator `ext:` searches for specific *file extensions*,\
    \ or the filename endings for different types of files. Examples include *docx*\
    \ for Microsoft Word documents, *txt* for plaintext, *pdf* for PDF files, *xlsx*\
    \ for Microsoft Excel spreadsheets, and so on. The operator `site:` searches for\
    \ results on specific sites; you might search for `site:nostarch.com` or `site:``yourcompany.com`.\n\
    \nHackers know how to use these operators to find specific types of files that\
    \ might have more valuable information, like the default password for a particular\
    \ kind of video surveillance camera stored in the online PDF version of the camera’s\
    \ user manual. An ethical hacker performing recon for a client can use these targeted\
    \ search terms to help a company remove sensitive data unintentionally exposed\
    \ to public view online, like a budget spreadsheet that shows what brand of video\
    \ surveillance camera a company purchased last year.\n\n### Finding Passwords\
    \ with the ext: Operator\n\nThe internet is full of sensitive information like\
    \ people’s usernames and passwords if you know where—and how—to look. Let’s try\
    \ using the `ext:` search operator to find spreadsheets containing passwords.\n\
    \nIn your virtual machine, open the web browser, go to *https://www.google.com/*,\
    \ and type `ext:xls password` into the search field, as shown in [Figure 4-2](#c04.xhtml#figure4-2).\n\
    \nRemember *not* to click any of the results, as a skilled attacker could easily\
    \ hide a virus or ransomware in an infected spreadsheet file (or make an infected\
    \ web page look like a spreadsheet to the search engine). *Ransomware* is a nasty\
    \ type of malware that encrypts all your files and demands that you pay a ransom\
    \ to get your data back, so be careful!\n\nYou’ll likely find dozens of usernames\
    \ and passwords right in the search page, and you can add additional search terms\
    \ to target the search even further. For example, I added DCCC to my search (short\
    \ for Democratic Congressional Campaign Committee), and the top result in [Figure\
    \ 4-2](#c04.xhtml#figure4-2) shows 2016 US election campaign passwords allegedly\
    \ stolen by hackers attempting to interfere in the 2016 US presidential election.\n\
    \n![Figure 4-2: Typing ext:xls password finds Excel spreadsheets filled with usernames\
    \ and passwords.](image_fi/502000c04/f04002.png)\n\nFigure 4-2: Typing `ext:xls\
    \ password` finds Excel spreadsheets filled with usernames and passwords.\n\n\
    Once you’ve found a search result you’re interested in, follow these steps:\n\n\
    1.  Copy the URL of one of the files: highlight the link address in the Google\
    \ results, right-click or CONTROL\\-click (on a Mac), and select **Copy link address**\
    \ or **Copy link location**.\n\n2.  Open VirusTotal ([https://www.virustotal.com](https://www.virustotal.com)*/*)\
    \ in a new browser tab, click the **URL** tab, and paste the copied URL into the\
    \ search field, as shown in [Figure 4-3](#c04.xhtml#figure4-3).\n\n    ![Figure\
    \ 4-3: Check suspicious web links before clicking them by scanning them through\
    \ VirusTotal.](image_fi/502000c04/f04003.png)\n\n    Figure 4-3: Check suspicious\
    \ web links before clicking them by scanning them through VirusTotal.\n\n3.  Click\
    \ the search icon (the magnifying glass) to scan the link. In [Figure 4-4](#c04.xhtml#figure4-4),\
    \ VirusTotal has scanned the password spreadsheet file with more than 60 different\
    \ antivirus engines, and none of them found any sign of infection."
