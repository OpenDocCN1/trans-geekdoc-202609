    点击通过你看到的任何设置屏幕，很快就会到达 Mac 桌面。你应该会在屏幕顶部的菜单栏中看到你已以系统管理员身份登录。你现在可以访问 Mac 上所有用户的文件和文件夹！


    ## 其他物理攻击

    除了 Sticky Keys 攻击和 Mac root 攻击之外，还有许多物理访问攻击。事实上，几乎任何可启动光盘——如 Ultimate Boot CD、KNOPPIX、SystemRescueCd
    或 Trinity Rescue Kit——都可以让你访问你有物理访问权限的计算机硬盘上的文件。还有专门制作的黑客工具，如 Rubber Ducky 和 Bash
    Bunny，价格不到 100 美元，外观像普通 USB 驱动器，但包含用于入侵计算机的自动化工具。一些物理访问攻击甚至使用语音命令。例如，Open Sesame!
    攻击利用了微软的 Cortana 语音助手，通过让 Cortana 打开 USB 驱动器或网站上的恶意文件来绕过登录屏幕。


    ## 防御物理攻击

    正如你所见，物理访问攻击可以帮助你恢复旧照片、复制文件，并在几乎任何你能触及的计算机上更改用户，甚至无需原始密码。然而，这也意味着任何拥有物理访问权限并了解这些攻击的人也可以访问*你*的私人文件和信息！因此，重要的是将设备随身携带或锁在安全区域内。


    如果有人设法访问你的计算机，仍然有几种方法可以保护你的数据。其中一种是设置 *固件密码*，也称为 *BIOS 密码* 或 *EFI 密码*。Mac 和大多数
    PC 上的此选项可以防止攻击者篡改计算机的 BIOS/UEFI 设置，从而 neutralizing 如 Sticky Keys 攻击和 Mac root
    攻击等漏洞利用。不幸的是，固件密码只是防御的一层，并且经常会被绕过。例如，有动机的攻击者可以从计算机电路板上移除电池，从而擦除大多数 PC 上存储的固件密码。


    更可靠的方法是 *加密* 你的文件，将其打乱成无法读取的形式，只有用密码才能 *解密*（解乱）。加密密码与计算机的登录密码不同，因此攻击者无法通过 Sticky
    Keys 或 Mac root 攻击更改用户密码来查看加密文件的内容。我们将在第 11 章更详细地讨论加密。


    ## 总结

    在本章中，你了解了如何使用 Windows Sticky Keys 攻击和 Mac root 攻击在不知道用户名和密码的情况下获得对计算机上所有文件和用户账户的管理员级访问。你还了解到还有其他物理攻击和一些专用工具，如
    Rubber Ducky 和 Bash Bunny，使物理攻击变得更加容易。虽然你可以使用这些攻击来恢复丢失的文件或重置忘记的密码，但你也发现了拥有物理访问权限的攻击者通常可以访问你计算机上的每一条信息。你可以通过限制谁可以访问你的计算机、设置固件密码以及加密文件来防御这些攻击。


    现在你已经了解了物理安全的重要性，是时候开始思考其他可能使你的计算机处于危险之中的攻击了——恶意网站、网络钓鱼和感染的电子邮件附件，甚至是对日常生活中联网智能设备的攻击。为了能够安全地练习这些其他类型的攻击并学习如何防御它们，你将在第
    3 章设置自己的私有虚拟黑客实验室。


    # 第 3 章 建立你自己的虚拟黑客实验室


    ![](img/chapterart.png)


    为了安全和合乎道德地学习黑客技术，你将使用 `virtual machines (VMs)`，即在你的物理台式机或笔记本电脑内模拟独立计算机的程序。你可以隔离一个
    VM，使其内部的任何操作都不会影响你的计算机或网络。例如，如果你在 VM 中打开一个带病毒的文件，病毒只会感染虚拟机，而不会感染你的真实计算机。


    `Virtualization software` 让你在台式机或笔记本电脑（`host`）上运行虚拟机（称为 `guest`）。在本章中，我们将安装 `VirtualBox`，一个免费的虚拟化程序，以及
    VirtualBox 扩展包。然后我们将创建两个 VM。第一个将是运行 Kali Linux 操作系统的 *攻击* VM。你将使用此 VM 来启动你的攻击。另一个虚拟机将是运行
    Windows 的 *目标* VM。你将把攻击指向这台机器。设置好这两个 VM 后，你就可以安全地尝试黑客工具，而不会影响你的计算机或他人的计算机。


    ## 设置 VirtualBox

    按照以下说明下载和设置 VirtualBox。


    1. 前往 VirtualBox 主页 at [`www.virtualbox.org/`](https://www.virtualbox.org/) 并点击
    **Download VirtualBox** 按钮。


    2. VirtualBox 下载页面列出了 Windows、macOS 和多个 Linux 主机操作系统的选项。点击与你的计算机匹配的选项以下载 VirtualBox
    的最新版本。


    3. 打开下载的文件并按照屏幕上的说明安装 VirtualBox。（Windows 用户应选择以管理员身份运行该文件；你必须具有管理员权限才能运行 VirtualBox。）

