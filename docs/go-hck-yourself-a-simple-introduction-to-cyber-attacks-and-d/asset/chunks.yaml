    如果记录按键记录对你来说还不够 creepy，查看受害者计算机的网络摄像头应该会让你想搬到没有网络的偏远岛屿（或至少说服你用便利贴遮住网络摄像头）。将网络摄像头连接到\
    \ Windows VM 可能不起作用，但即使你无法亲自尝试此攻击，它对配备网络摄像头的真实 Windows 计算机也可靠有效。要继续操作，你需要一个网络摄像头（笔记本电脑内置的或连接到桌面的\
    \ USB 网络摄像头）以及耐心，按照刚才给出的警告中的步骤多次重新运行整个黑客攻击。\n\n1. 检查网络摄像头是否出现在 Windows VM 菜单栏下的\
    \ Devices▶Webcams 下。如果出现，选择其名称并跳到第 6 步。否则，我们需要将网络摄像头连接到 VM。\n2. 关闭 Windows VM\
    \ 并选择 **关闭机器**。\n3. 在 VirtualBox Manager 中，选择 Windows VM 并前往 **机器**▶**设置** 或 **机器**▶**设置**▶**端口**（在\
    \ macOS 上）。在设置菜单中选择 **USB** 并选中 **启用 USB 控制器** 旁边的复选框。\n4. 重新启动 Windows VM。前往菜单栏，选择\
    \ **设备**▶**网络摄像头** 或 **设备**▶**USB**，并选择网络摄像头的名称。\n5. 关闭 Windows VM 的防火墙和 Defender。然后再次运行木马。\n\
    6. 在 Kali 中的 Meterpreter 提示符下输入 `webcam_list` 以查看网络摄像头是否可用。你应该会看到类似以下内容：\n```\n\
    meterpreter > webcam_list\n1: VirtualBox Webcam - Logitech HD Webcam C310 \n```\n\
    我的网络摄像头显示为 `VirtualBox Webcam - Logitech HD Webcam C310`，例如。\n7. 输入 `webcam_stream`\
    \ 通过 Meterpreter 连接到网络摄像头。\n```\nmeterpreter > webcam_stream\n[*] Starting...\n\
    [*] Preparing player...\n[*] Opening player at: /home/kali/KMKiGQxa.html\n[*]\
    \ Streaming...\n```\nMeterpreter 将打开 Firefox 并从 Windows VM 的网络摄像头流式传输视频，如 图 6-9\
    \ 所示。\n\n![图 6-9：网络摄像头流显示了我和办公室里的书架。](img/f06009.png)\n图 6-9：网络摄像头流显示了我和办公室里的书架。\n\
    \n你应该会看到网络摄像头的 LED 灯亮起，表示摄像头处于活动状态。与 `screenshare` 和 `keyscan` 命令不同，网络摄像头黑客会让你知道有人在监视你。如果网络摄像头灯在你未使用时亮起，请运行\
    \ *彻底* 的防病毒扫描并重新启动计算机，看看灯是否熄灭。然而，不要依赖网络摄像头 LED：一些高级黑客能够在 *不打开* LED 的情况下通过网络摄像头进行监视。这就是为什么练习下一节中描述的安全措施很重要。\n\
    \n要停止从 Windows 10 VM 的网络摄像头流式传输视频，请关闭 Firefox 并在 Meterpreter 窗口中按 CTRL\\-C 中断\
    \ `webcam_stream` 命令。然后拿一张便利贴或一小块遮蔽胶带遮住笔记本电脑上的网络摄像头！\n\n## 防御恶意软件\n\n如本章所示，病毒的创建和传播非常容易。任何你收到或打开的可疑电子邮件附件、链接、网页、应用或视频都可能包含等待被启动的恶意软件。攻击者甚至不需要很多技能；他们只需要使用\
    \ Metasploit 并欺骗人们下载病毒。一旦计算机被感染，不道德黑客可以对其使用的攻击是相当可怕的。\n\n你的最佳防御措施如下：\n\n1. 经常更新软件。更新你的操作系统和应用程序，从文字处理器和网页浏览器到\
    \ PDF 阅读器——至少每月一次。选择一个月中的某一天，例如 1 日、15 日或 30 日，并在日历上标记以更新你的设备和所有应用程序。把它当作另一项必须完成的任务，就像付账单或割草一样。Kali\
    \ 中的 2,000 多个漏洞利用攻击的是旧版本的软件，因此如果你为使用的软件安装最新的安全补丁，你将更不容易受到攻击。\n2. 使用防火墙和防病毒软件。保持防火墙开启并定期更新防病毒软件。有许多免费和低成本的防病毒工具可供选择。研究哪些工具阻止了最多的恶意软件，然后每周更新你的防病毒工具，或打开自动更新，以便它获得最佳的保护机会。\n\
    3. 三思后点。恶意软件可通过感染的程序文件、盗版视频，甚至 Office 文档和 PDF 启动。点对点文件共享网站充满了“免费”的恶意软件感染文件，等待毫无防备的受害者。对你不信任来源的\
    \ *任何* 文件运行 VirusTotal 或另一个病毒扫描，并且完全不要下载可疑或非法的 files。\n\n这些措施不会让你无敌，但它们会帮助你避免大多数基于恶意软件的攻击，并且会让你成为一个足够难的目标，以至于大多数黑客会转向其他受害者。大多数攻击依赖于\
    \ *低垂的果实* 概念——恶意黑客入侵你系统的简单机会，例如过时的软件、已禁用的防火墙或防病毒程序，或用户在未先扫描的情况下打开链接或下载文件。不幸的是，有足够的低垂果实让黑客忙碌，因此采取这些聪明的预防措施可以让你免受超过\
    \ 90% 的攻击。\n\n哦……并且在不使用时遮住那个网络摄像头！\n\n## 总结\n\n在本章中，你学习了攻击者如何创建恶意软件以及未受保护的计算机如何容易被感染。使用\
    \ Metasploit 框架，你创建了一个 Meterpreter 远程访问木马（RAT），这是一种特殊的恶意软件，只要攻击者有互联网连接，就能让攻击者从世界任何地方控制你的计算机。你通过在\
    \ Kali Linux VM 中打开 Apache Web 服务器并将木马放在共享网页文件夹中，在网络上共享你的恶意软件。然后你将恶意软件下载到 Windows\
    \ VM 并打开文件以感染你的机器。\n\n接下来，你从 Kali 中的 Meterpreter 远程 shell 控制了 Windows VM。你学习了攻击者如何仅使用一两个命令上传和下载文件、窃取屏幕截图、记录按键并通过网络摄像头监视。对于大多数攻击，你的\
    \ Windows VM 甚至没有显示它正在被黑客攻击。\n\n最后，你学习了如何防止许多基于恶意软件的攻击。避免可疑下载、链接和网站；保持防火墙和防病毒软件开启并保持最新；定期更新操作系统和应用程序都是重要的预防措施。如果你采用多层安全措施，你将成为一个更难的目标，大多数攻击者会转向更容易的猎物。\n\
    \n在下一章中，我们将把技能提升一个层次，看看不道德的黑客如何使用 Meterpreter 和其他工具窃取和破解密码。\n\n# 7 窃取和破解密码\n\n\
    ![](img/chapterart.png)\n"
