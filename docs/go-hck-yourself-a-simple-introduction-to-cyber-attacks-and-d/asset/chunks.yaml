  trans: '


    5. 一旦你进入了启动 BIOS 或 UEFI 设置，找到虚拟化设置并将其打开。你可能需要使用方向键、空格键或 `ENTER` 键在看起来老式的菜单中导航。每种品牌的
    PC BIOS 都有细微差别，所以只需查找类似“Virtualization Technology”、“VT-x”或“VT-d”的菜单选项。这些通常位于高级、系统或
    CPU 设置下。


    6. 启用或打开虚拟化，保存更改，然后退出以重新启动进入 Windows。


    7. 重新启动 `VirtualBox` 并再次打开 `Kali VM`。


    ## 最后的一个问题：某些防病毒程序


    如果在尝试了上面讨论的所有虚拟化设置后，你的 VM 仍然无法启动，并且在下载并重新安装了正确的 `VirtualBox` 和 VM 文件之后，你电脑的防病毒软件可能正在阻止
    `VirtualBox`。在线搜索是否有其他人遇到相同问题（我的学生在使用 WebRoot SecureAnywhere 以及某些版本的 Avast 和 Symantec
    时遇到过问题），这样你可能可以为 `VirtualBox` 添加排除项，使防病毒软件不会阻止它。最后的办法是尝试使用安装了不同防病毒应用的电脑或更换防病毒程序。


