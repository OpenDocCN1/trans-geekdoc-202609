    一次 *反射型 XSS 攻击* 利用会将用户的输入直接 *反射* 回到网页上的页面，就像一个订单表单会询问你的姓名和地址，然后将它们显示给你以确认你输入正确。攻击者利用反射型跨站脚本向未受保护的
