    # Security through obscurity


    Security through obscurity is a technique that attempts to keep something safe
    by hiding it. In the physical world, hiding your house key under the welcome mat
    on your front porch is an example of security through obscurity. Your house may
    *feel* secure, but that security breaks down as soon as someone thinks to look
    under the mat.


    Hiding something to keep it safe isn’t necessarily a bad approach, unless it’s
    the *only* security measure you’ve taken. Unfortunately, security through obscurity
    often fails, especially when it’s applied to our computers. For example, many
    users “hide” their passwords in a text document or Excel spreadsheet on their
    computer or, worse, on a sticky note under their keyboard or in a desk drawer.
    These passwords are even easier to find than the one you’ll hack in this chapter.
    Similarly, some software developers hardcode obscured passwords and other secret
    values into their applications, but a skilled hacker can often find and decode
    those values.


    As you’ll see in this chapter, if obscurity is your only security, all that stands
    between you and a motivated intruder is a little of their time and energy spent
    searching for the way in.


    ## How Browsers “Secure” Passwords


    When you enter your password to log in to an online service, such as an email
    or a social media account, your web browser usually hides the password with dots
    or asterisks. That way, someone looking over your shoulder can’t read it. If you
    tell your browser to save your password and you come back to the site later, those
    dots or asterisks will appear in the password field automatically when the browser
    fills in your stored password for you.


    These dots or asterisks are a great example of security through obscurity. Your
    browser isn’t encrypting your password or protecting it in any other special way.
    It’s just obscuring the characters in the password field to protect your password
    from casual snoopers. This technique isn’t actually secure at all. In fact, a
    hacker needs just a few seconds on your keyboard to view the password.


    ## Revealing an Obscured Password


    To reveal a password obscured by your browser, we’ll use the browser’s `Inspect`
    tool. This tool lets you view and temporarily edit a web page’s *source code*,
    the code that tells your browser how to display the web page. We’ll change the
    piece of the source code that makes the password show up as dots or asterisks.
    When we’re done, the password will display as regular text instead.


    This isn’t the sort of hack that could take down a nation-state or compromise
    millions of people’s private data in one fell swoop. Rather, this hack illustrates
    one of the guiding principles of hacking: using an existing tool—in this case,
    a browser’s `Inspect` tool—in a creative way to accomplish a particular goal—revealing
    a hidden password. At the same time, this hack demonstrates the risk of storing
    passwords in a browser in the event an attacker gets physical access to your computer.


    Let’s try out the hack, using the Twitter login page as an example. We’ll enter
    a fake username and password, launch the browser’s `Inspect` tool, and update
    the source code to expose the password.


    1. Open Google Chrome and go to [https://twitter.com/login/](https://twitter.com/login/).
    This hack will also work in other browsers, but we’ll use Chrome for simplicity.


    2. Enter your name in the username field and type `Notmyrealpassword!` into the
    password field. *Don’t* enter your real password. The password will be obscured
    by dots, as shown in [Figure 1-1](#c01.xhtml#figure1-1).


    ![Figure 1-1: Web browsers usually obscure passwords with dots or asterisks.](image_fi/502000c01/f01001.png)


    Figure 1-1: Web browsers usually obscure passwords with dots or asterisks.


    3. `Right-click` (or `CONTROL-click` on a Mac) the password field and select `Inspect`,
    as shown in [Figure 1-2](#c01.xhtml#figure1-2). The `Inspect` tool, which will
    look like an assortment of windows showing code, should open in your browser.
    Since you right-clicked the password field to open the `Inspect` tool, the browser
    should already be highlighting the part of the code that creates the password
    field in the login page.


    ![Figure 1-2: Inspecting the password code](image_fi/502000c01/f01002.png)


    Figure 1-2: Inspecting the password code


    4. Find `type="password"` in the highlighted code and double-click the word `password`
    to select it, as shown in [Figure 1-3](#c01.xhtml#figure1-3). This piece of code
    is how the browser identifies the password field. The browser knows that any text
    in a field with type `password` should be obscured.


    ![Figure 1-3: Finding type="password" in the Inspect tool](image_fi/502000c01/f01003.png)


    Figure 1-3: Finding `type="password"` in the `Inspect` tool


    5. With `password` highlighted, press the `spacebar` to replace `password` with
    a space (`type=" "`), as shown in [Figure 1-4](#c01.xhtml#figure1-4). We’ve now
    changed (or hacked) the code for the password field so that the browser no longer
    knows it’s supposed to be a password-type field. This should reveal any text in
    the password field!


    ![Figure 1-4: Replacing the word password in type="password"](image_fi/502000c01/f01004.png)


    Figure 1-4: Replacing the word `password` in `type="password"`


    6. Press `ENTER` to display the updated code in the browser. You should now see
    the password you entered as regular text in the browser window, as shown in [Figure
    1-5](#c01.xhtml#figure1-5).


    This hack worked because the `<input>` tag that lets web developers create password
    fields is insecure—and it has been for a quarter of a century. In the 1990s, when
    early web developers added the `<input>` tag to *HyperText Markup Language (HTML)*,
    the language that makes web pages display in web browsers, their only security
    feature was replacing password characters with dots or asterisks by using the
    extra code `type="password"`. However, since regular text boxes also use the `<input>`
    tag, we can use the `Inspect` tool to change a password input into a regular text
    input just by changing `type="password"` to `type=" "`.


    ![Figure 1-5: The password is now visible.](image_fi/502000c01/f01005.png)


    Figure 1-5: The password is now visible.


    ## Using and Misusing This Hack


    The hack we just carried out has practical, ethical applications. Because passwords
    stored in a browser are autofilled but obscured on a website’s login screen, you
    can use this simple hack to unmask a password you’ve forgotten. This is especially
    useful if you store your passwords on one machine, like your home computer, but
    periodically have to log in from other machines, like your work computer, a family
    member’s computer, or your mobile device. If you can’t remember your password
    when you try to log in on another computer, you can unmask the stored password
    on your home computer to look it up rather than reset your password.


    This hack can be used ethically in other ways as well. For example, if an employee
    leaves a company unexpectedly, an ethical hacker with the permission of the company’s
    owner can use this hack to recover passwords to important online accounts the
    employee might have been responsible for.


    If you practice it enough times, you can easily perform this hack in under 5 seconds.
    However, that also means that if you ever store a password in a public computer,
    anyone with physical access to that computer needs only 5 seconds to steal it.
    A black hat hacker can walk into a hotel lobby or public library almost anywhere
    in the world, sit down at a computer, check the browser’s history for recently
    visited websites, and see if any potential victims saved their passwords when
    logging in to their private accounts.

    '
