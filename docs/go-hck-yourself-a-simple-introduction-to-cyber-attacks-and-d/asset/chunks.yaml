  trans: '

    你甚至不需要在浏览器中保存密码，别人就能将其泄露。如果你身处公共场所，有人在你输入网站密码时分散你的注意力，他们就能利用这个漏洞窃取你的密码。他们甚至可以修改
    `type="password"` 代码并关闭检查工具以掩盖痕迹！如果你在多个账户上使用了相同的密码，攻击者现在就能访问所有这些其他账户。


    ## 保护你的密码

    我们讨论过的这个漏洞，如果被恶意使用，会对你的密码安全构成明显风险。然而，有一些简单的方法可以保护自己。首先，这个漏洞只有在黑客能够物理接触到存储的密码时才可能实现，因此防止攻击的关键是根本不在浏览器中存储密码，或者限制以下内容：

    1.  存储密码的位置 仅在你拥有并随身携带的计算机或设备上在浏览器中存储密码，切勿在公共电脑上存储。

    2.  存储哪些密码 切勿存储你的电子邮件密码，因为攻击者通常可以用你的电子邮件账户发现或重置你所有的其他密码。

    3.  谁可以访问你的电脑 将电脑随身携带或存放在安全的地方，如果你必须离开，即使只有一分钟，也不要将其保持开启状态。


    如果你必须从公共电脑登录私人账户，请通过使用 Chrome 中的无痕模式 (`CTRL-SHIFT-N`) 或在 Firefox 中打开新的私人窗口 (`CTRL-SHIFT-P`)
    或在 Safari 中打开 (`SHIFT-⌘-N`) 来限制浏览器中存储的信息。*请记住在会话结束时同时注销并完全关闭浏览器。* 即使你注销或使用无痕模式，共享电脑也有风险，因为恶意软件可以记录你的击键或其他信息。（事实上，我们将在第
    6 章中创建的病毒中捕获击键。）只有在绝对必要时才从公共电脑登录账户。此外，回到自己的电脑后，请考虑更改你的密码。


    如果你在公共场所使用个人电脑，请务必在离开时注销或锁定屏幕——更好的做法是随身携带电脑。设置锁屏或屏幕保护程序在几分钟后自动开启，以限制电脑暴露的时间，以防你忘记自行锁定。使用强密码或密码短语（尝试四个或更多单词）登录电脑，而不是像
    *password123* 这样明显的密码，这样即使电脑无人看管，其他人也无法轻易解锁。


    除此之外，你还应利用其他密码安全工具，例如双因素认证和像 KeePass、Dashlane、LastPass 或类似的密码管理器。我们将在第 11 章讨论这些工具。


    保护自己免受计算机攻击需要一些明智的预防措施，但了解如何在便利性和安全性之间取得平衡很重要。将所有东西的密码都存储在浏览器中似乎很方便，因为你永远不必输入它们，但这也意味着任何可以访问该电脑的人都可以窃取你的密码和账户。我们必须在物理世界和在线环境中，在便利性和安全性之间找到正确的平衡。


    ## 总结

    本章中，你看到通过模糊性实现的安全很容易被击败，因此根本不安全。你学习了如何仅用几个步骤在几秒钟内揭示输入到浏览器中的密码。你还了解了绝不在公共或共享电脑上存储密码的重要性。此外，你现在知道要对电脑进行物理保护，防止不认识或不信任的人接触——如果有人可以触摸你的键盘，他们就可以访问你的敏感信息。


    本章讨论的漏洞是一个物理访问攻击的例子——攻击者需要对你的电脑进行物理访问才能执行它。在下一章中，你将了解到其他物理访问攻击，这些攻击允许黑客在无需知道登录信息的情况下从你的硬盘获取文件。


    # 2 物理访问攻击


    ![](img/chapterart.png)


    你是否曾经在咖啡店把笔记本电脑无人看管，认为你的私人文件在登录屏幕后面是安全受保护的？事实证明，任何拥有对电脑物理访问权限的人只需几个按键就能访问你的文件，而无需知道你的登录详情。在本章中，我将向你展示两种
    *物理访问攻击*：用于 Windows PC 的 *Sticky Keys 攻击* 和用于 Mac 的 *Mac root 攻击*。这两种攻击都可让攻击者获得目标电脑的管理员级访问权限，从而窃取文件或更改重要设置。


    物理访问攻击听起来可能很可怕，因为它们可以被攻击者恶意用于被盗或无人看管的电脑上。然而，它们也有建设性的应用。家里的道德黑客和 IT 服务台使用 Sticky
    Keys 攻击或 Mac root 攻击等技术来恢复因忘记密码而原本会丢失的文件。如果你车库或阁楼里有一台旧电脑，里面有家庭照片或其他重要文件，但由于没人记得电脑密码而无法访问，这些漏洞可以帮助你。


    ## Sticky Keys 攻击

    Sticky Keys 是 Windows 的一项功能，通过允许你依次按下按键而不是同时按下，使发出某些键盘命令（如 `CTRL-C` 复制或 `CTRL-V`
    粘贴）变得更容易。Sticky Keys 可通过按五次 `SHIFT` 触发，甚至可以在 Windows 登录屏幕上启用，在输入用户名或密码之前。


    对于这个漏洞，我们将用另一个文件 `cmd.exe` 替换 Sticky Keys 程序文件。这样，按五次 `SHIFT` 就不会启动通常的 Sticky
    Keys 助手，而是会启动一个 `command prompt`。这是一个基于文本的程序，允许我们直接向 Windows 输入命令。通过在登录屏幕上启动命令提示符（参见
    图 2-1），你将能够添加新的用户名和密码，为自己提供对电脑的管理员级访问权限，并访问电脑的文件，所有这些都不需要知道该电脑的登录信息！


    由于 2019 年或之后更新的 Windows 10 电脑已不受 Sticky Keys 攻击影响，你需要一台较旧的 Windows 电脑来亲自尝试此漏洞。你还需要一个
    Windows 10 安装光盘或 USB 驱动器。要创建它，请按照附录 A 中的说明操作。


    ### 从 Windows 10 安装光盘启动

    要将 Sticky Keys 程序替换为命令提示符程序，我们需要使用 Windows 10 安装光盘或 USB 驱动器访问包含这些程序文件硬盘。一旦你按照附录
    A 中所述创建了安装光盘，请插入光盘然后重新启动电脑。


    ![图 2-1：Sticky Keys 攻击会弹出命令提示符窗口而不是 Sticky Keys 助手。](img/f02001.png)


    图 2-1：Sticky Keys 攻击会弹出命令提示符窗口而不是 Sticky Keys 助手。


    我们需要告诉电脑从光盘或 USB 驱动器而不是从电脑硬盘加载操作系统（OS）。为此，我们将访问启动菜单或 *基本输入/输出系统 (BIOS)*，它包含在电脑启动时控制电脑的基本设置。不同的
    PC 制造商和不同版本的 Windows 会导致说明略有不同，但以下步骤结合一点网络搜索将使你进入大多数较旧的 Windows 电脑：

