    ![Figure 9-9: When we turn off the ring volume in Meterpreter, the user can’t
    turn it back on from the Settings screen!](image_fi/502000c09/f09009.png)


    Figure 9-9: When we turn off the ring volume in Meterpreter, the user can’t turn
    it back on from the Settings screen!


    Try to slide the Ring volume slider to the right or left. You won’t be able to!
    Meterpreter has locked the ring volume off by turning on a “Do not disturb” mode
    (much like sliding the mute switch on some smartphones). The user will have to
    find “Do not disturb” under Settings and turn it off to regain control of their
    smartphone’s ring volume.


    There’s another change we can make that the user can’t override. You might have
    already thought to yourself, *If I saw an app I didn’t recognize, like `MainActivity`,
    I’d probably delete it*. So let’s hide the `MainActivity` app icon to make it
    harder for the user to delete our trojan app.


    In Meterpreter, enter the following command to hide the `MainActivity` trojan
    app from the user’s list of installed apps:


    ```

    meterpreter > hide_app_icon

    [*] Activity MainActivity was hidden

    ```


    Switch back to your Android VM, click the home button, and swipe up to show your
    apps. The `MainActivity` app will disappear from the list, as shown in [Figure
    9-10](#c09.xhtml#figure9-10).


    ![Figure 9-10: Hiding our MainActivity app icon from the user’s screen](image_fi/502000c09/f09010.png)


    Figure 9-10: Hiding our MainActivity app icon from the user’s screen


    By hiding the app icon, we’ve made it difficult for the user to uninstall the
    trojan app. If an attacker hides the app icon at the very beginning, the user
    might not even know the trojan app had been installed! The user can still uninstall
    the trojan app, however, even if they can’t see it. Go to **Settings**▶**App info**,
    click `MainActivity`, and click **Uninstall**. Notice that stopping or uninstalling
    the app closes the Meterpreter session in the Kali VM. To reinstall the trojan
    app, go to your `Downloads` folder in Android and click the `CoolGame.apk` file
    like we did earlier.


    ## Defending Against Malicious Apps


    To protect yourself from malicious apps, be careful about which apps you allow
    onto your smartphone. In short, think before you install! Use Google Play Protect
    on your Android device and view each security pop-up as a chance to reconsider
    what you’re doing. Even better, don’t download apps over the web or outside the
    Google Play Store, Apple’s App Store (if you’re on an iPhone), or your smartphone
    manufacturer’s store.


    Malicious apps can make it into official app stores, though. That’s why it’s important
    to read which permissions an app is requesting when you install it. A game or
    simple app shouldn’t need access to your contacts, call logs, or text messages,
    and other than augmented-reality or location-based apps like *Pokémon Go*, an
    app shouldn’t require your location. If an app asks for more permissions than
    you think it should need, delete it and find one that does what you want with
    fewer permissions. Similarly, if an app you’ve installed ever asks for additional
    permissions—especially if it asks for superuser access—you can cancel the request
    or even delete the app. You *never* have to give more permission to an app than
    you want to, and most apps function perfectly well without being granted extensive
    permissions.


    If you ever see apps opening on your smartphone that you didn’t open (like when
    we used Meterpreter to open YouTube on the Android VM), turn your smartphone off
    completely (don’t just turn off the screen). Press the power button on the side
    or top of the phone along with the volume up button for several seconds until
    the screen goes black (this works on most Android devices), or search (using a
    different device) for how to reboot or reset your specific device. It might also
    be a good idea to install a security app if you spot any suspicious activity on
    your smartphone or tablet. There are free or low-cost antivirus apps for most
    mobile devices that can detect malicious processes or communications if your smartphone
    ever gets hacked through an app.


    Finally, just like on your desktop or laptop, don’t click suspicious links in
    emails or text messages. You can use VirusTotal to check most links by copying
    and pasting, just like you can on a desktop, but on your smartphone, you need
    to be even more careful about clicking malicious links. Remember, an attacker
    can access a lot of personal information (and even track your location!) if they’re
    able to trick you into clicking a bad link or installing a malicious app. So tell
    your friends, your family members, and other people you care about to be suspicious
    of any links they get via text message or email and to think before they install
    an app, especially if it’s from an unknown source.


    ## The Takeaway


    In this chapter, you created an Android virtual machine that looks and works just
    like a real Android smartphone or tablet. You used Metasploit to create a Meterpreter
    remote access trojan for Android, almost exactly the same way you did for Windows
    10 in Chapter 6, and you installed and launched the trojan on the Android VM.
    Once you gained control of the Android device, you saw how an attacker can run
    apps, steal contacts, upload and download files, hijack your camera, and snoop
    around in your search history.


    You also learned that the best way to defend your mobile devices from malware
    is to avoid installing untrusted apps. Even if an app looks legitimate, delete
    or uninstall it if the app asks for more permissions than it needs. If your smartphone
    starts acting weird, reboot it, delete all suspicious apps, and consider installing
    a security app like an antivirus scanner if you suspect you accidentally installed
    malware.


    In the next chapter, you’ll try one last hacking activity. You’ll see that hacking
    doesn’t apply just to computers, smartphones, and tablets. You can also use the
    tools in your Kali Linux VM to hack other network-connected devices in the world
    around you, from smart TVs to video game consoles and beyond. To prove it, we’ll
    hack a car!


    # 10 Car Hacking and the Internet of Things


    ![](image_fi/book_art/chapterart.png)


    Some of the coolest computers you can hack into are all around you every day,
    but you probably don’t think of them as computers. Many home appliances—like thermostats,
    security cameras, refrigerators, and Alexa or Google Home speakers—have a computer
    inside. These days, even cars have internet connections and computer systems that
    can be attacked by unethical hackers.


    Internet-connected computing devices embedded in everyday objects are known as
    the *Internet of Things (IoT)*. IoT devices make our lives easier or better, but
    they can also pose serious security risks. Internet-connected medical devices
    may help keep us healthy and allow the manufacturer to monitor and update them
    remotely, but imagine if an attacker could hack someone’s pacemaker or insulin
    pump to harm the user. Likewise, satellite radio, GPS navigation, and 4G/5G wireless
    entertainment systems in your car make long road trips more convenient and fun,
    but all of those networks bring additional vulnerabilities that attackers could
    exploit. Imagine if someone hacked into your car and made it brake suddenly on
    the highway.


    Ethical hackers hack IoT devices to find issues before attackers use them to do
    real damage. In this chapter, you’ll see how it works. You’ll hack into a simulated
    car network, watch the network messages the car sends, and write commands to control
    the car’s dashboard.


    ## Installing the Car-Hacking Software

