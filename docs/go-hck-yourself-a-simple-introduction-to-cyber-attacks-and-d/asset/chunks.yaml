    \nIn Chapter 10, you’ll hack a (simulated) car! This last exercise provides a\
    \ window into how attackers are increasingly looking beyond PCs and phones into\
    \ the world of smart appliances and other networked devices.\n\nFinally, in Chapter\
    \ 11, we’ll wrap up with 10 things you can do right now to protect yourself online,\
    \ summarizing the most important tricks and tips from throughout the book. A few\
    \ simple self-defense steps can prevent most online attacks from succeeding.\n\
    \n## Basics of Cyber Self-Defense\n\nAs you explore the hacks in the chapters\
    \ ahead, you’ll learn more about the core behaviors white hat hackers use to protect\
    \ the systems they defend. Good cyber self-defense starts with understanding the\
    \ dangers from cyber predators and online attackers. The next step is learning\
    \ how to avoid being an easy target. With more practice, you’ll be able to protect\
    \ yourself and others from even highly sophisticated real-world attacks.\n\nYou\
    \ can go from being a cyber victim to becoming a cyber hero just by making a few\
    \ key changes in the way you use your computer and other devices! Let’s get started!\n\
    \n# 1  \n\nSecurity Through Obscurity\n\n![](image_fi/book_art/chapterart.png)\n\
    \nIn this chapter, you’ll start learning how to think like a hacker to find weaknesses\
    \ in security measures. You’ll discover a simple hack for revealing passwords\
    \ hidden in a web browser. This hack works because web browsers protect passwords\
    \ using *security through obscurity*."
