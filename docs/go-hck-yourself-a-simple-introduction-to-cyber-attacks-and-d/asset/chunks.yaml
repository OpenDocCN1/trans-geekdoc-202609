  trans: '

    ## 掩码攻击

    我们可以使用我们已知的密码部分（`SuperGir`），加上一些通配符字符，来创建一个 `mask`。一个 `mask` 通过填入我们已知的字符（在本例中为前八个字符：`SuperGir`）来减少我们需要尝试的密码组合数量。根据便签，我们不知道
    Kara 的密码是以数字、字母还是特殊字符结尾，所以让我们先使用掩码 `SuperGir?a`。


    1. 在 Johnny 中，点击左侧的 **Options**，点击 **Mask** 选项卡，并在 Mask 文本框中输入 `SuperGir?a`。

    2. 在顶部点击 **Start new attack**。然后，要查看 Kara 的密码是否被破解，点击左侧的 **Passwords**。你应该会看到在
    `SuperGir` 后面添加一个通配符字符并不能破解密码。

    3. 返回 **Mask** 选项卡，输入两个通配符字符，`SuperGir?a?a`，然后再次尝试。

    4. 还是没有？输入第三个通配符字符，`SuperGir?a?a?a`，如 图 7-8 所示。然后再次点击 **Start new attack**。


    ![图 7-8：使用掩码攻击——在便签上找到的部分密码后添加通配符字符——来破解 Kara 的密码](img/f07008.png)

    图 7-8：使用掩码攻击——在便签上找到的部分密码后添加通配符字符——来破解 Kara 的密码


    这次，图 7-8 中窗口底部的进度条应发生变化，显示 Johnny 成功破解了另外一个密码。再次点击 **Passwords**。现在，在 `kara` 旁边，你会看到她的密码，`SuperGirl7!`，如
    图 7-9 所示。


    ![图 7-9：密码掩码 SuperGir?a?a?a 在不到一秒的时间内破解了 Kara 的密码（SuperGirl7!）！](img/f07009.png)

    图 7-9：密码掩码 `SuperGir?a?a?a` 在不到一秒的时间内破解了 Kara 的密码（`SuperGirl7!`）！


    即使我们只有 Kara 密码的一部分，我们也能使用掩码攻击来猜出她的完整密码。Johnny 花费不到一秒钟就逐一尝试了成千上万种可能性，从 `SuperGir000`
    到 `SuperGirl7!`。这意味着，如果你通过仅在开头、中间或结尾更改数字和符号来重复使用密码，那么发现你旧密码的黑客可以使用 Johnny 或类似工具在几秒钟内猜出你的当前密码。


    你也可以对 Peter 的密码使用掩码攻击。输入几个通配符字符——从 `SpidermanRu?a` 开始，然后是 `SpidermanRu?a?a`，依此类推——直到破解完整密码。最后一轮可能需要五到六分钟才能运行，因为每个新增字符都会使复杂度呈指数级增长（3
    个通配符不到一秒，4 个通配符需要三到四秒，5 个通配符需要五到六分钟，6 个通配符几乎需要九小时，而 14 个通配符需要数千年！）。


    破解更长密码所需时间呈指数级增长，这正是每个人都应该使用长密码的原因。无论我们运行 Johnny 多年，我们也不太可能破解我们的长密码短语，即你创建的最终密码。长密码是我们用来阻止黑客进入账户的技巧之一。


    ## 使用更安全的密码

    你只需做几处更改，就能让密码变得难以破解，即使是专业人士也难以破解。首先，通常密码越长越安全。要创建强密码短语，请选择四个或更多随机、无关联的单词并将其串联起来。要使密码短语几乎无法破解，请添加一些数字或特殊字符。


    除了常规键盘上的特殊字符如 `!`、`@`、`#` 和 `$` 之外，你还可以添加来自不同于你自己的语言或字母表的特殊字符。即使你使用较短的密码而不是密码短语，添加另一种语言的特殊字符也能使其更难破解。


    让我们看看如何在不同的操作系统中做到这一点。


    1. Windows 按住 `ALT` 键，同时在数字键盘上输入数字，然后松开。例如，按住 `ALT` 键，同时在数字键盘上输入 `0214`；松开 Alt
    键后，字符 `Ö` 将出现（带分音符的大写 O）。在线搜索“Windows alt codes”列表以找到你想要使用的字符。请注意，有些键盘可能需要你专门使用左侧
    `ALT` 键。在没有数字键盘的笔记本电脑上，你可以按 Windows 键加句点键（`Windows-.`）来插入表情符号或其他符号。

    2. Linux 按 `ctrl-shift-U`；松开（你会看到屏幕上出现带下划线的 `u`）；输入你想要的字符的 Unicode 十六进制值，例如 `d6`（或对于需要四位数字的系统为
    `00d6`）表示 `Ö` 字符，然后按 `spacebar` 或 `enter`。在线搜索“Unicode character codes”以找到更多选项。

    3. macOS 按 `CONTROL-COMMAND-SPACEBAR` 调出字符查看器。输入 `u+d6` 以显示 `Ö` 字符。要插入字符，可以按向下箭头选择它然后按
    `ENTER`，或直接用鼠标点击它。适用于 Linux 的相同 Unicode 字符代码在 macOS 的字符查看器中也适用；只需在十六进制代码前加上 `u+`
    即可。

    4. iPhone 或 Android 在虚拟键盘上长按 `O`，直到弹出窗口出现 `Ö` 字符和其他选项。没有安装应用或选择替代键盘布局，就无法访问所有
    Unicode 字符，但对大多数元音和少数辅音进行长按将提供足够的选项来增强密码。


    当然，你可能记不住多于一两个带有此类特殊字符的长密码。密码管理器可以通过为大多数账户设置长随机密码并安全地为你存储它们来减轻负担。此外，只要提供就应开启双因素认证。借助此功能，即使攻击者破解了你的其中一个密码，他们也可能无法访问你的账户。我们将在第
    11 章更详细地研究这些工具。


    ## 总结

    在本章中，你学习了攻击者如何使用 `Metasploit` 中的 `Mimikatz` 通过网络窃取 Windows 密码哈希。一旦攻击者通过你被诱骗安装的恶意软件访问了你的计算机，他们可以（并且经常会）浏览你的系统寻找密码或其他敏感数据。然后你看到了黑客如何使用免费的在线密码数据库或
    `John the Ripper` 中的字典攻击轻松破解许多密码哈希。你还学习了如何通过向旧的或不完整的密码添加几个通配符字符，使用掩码攻击破解更复杂的密码。


    最后，你学习了一些技巧，以保护自己免受本章所述的密码攻击。以下是一些可以改变你终身密码习惯的 dos 和 don’ts 的简短总结：


    * *Don’t* 在多个账户中使用相同的密码。

    * *Don’t* 通过在末尾（或中间或开头）添加数字或符号来重复使用密码。

    * *Don’t* 将密码写下来或存储在明文文档或电子表格中。

    * *Do* 使用包含一个或多个特殊字符的长密码短语。

    * *Do* 使用密码管理器和多因素认证。


    这些提示将使你的在线生活比普通人更容易且 *much* 更安全。然而，攻击者不必访问你的计算机就能窃取你的密码；他们可以通过互联网从 Web 应用程序和服务器窃取密码和其他信息。在下一章中，我们将通过入侵虚拟实验室中的易受攻击的
    Web 服务器来学习如何做到这一点。


    首先，检查 列表 7-2 以查看你是否成功破解了本章开头的密码！

    '
