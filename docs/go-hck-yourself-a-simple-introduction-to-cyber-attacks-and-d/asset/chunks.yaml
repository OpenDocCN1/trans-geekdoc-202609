    在本章中，我们使用 `ICSIM` 和 `can-utils` 来入侵虚拟汽车网络。我们在 Kali 虚拟机上设置了这些工具。然后使用 `cansniffer`
    嗅探网络流量，以了解 CAN 数据的样子。我们使用 `candump` 捕获 CAN 信号，然后使用 `canplayer` 重放这些数据包，以在不使用汽车键盘控制的情况下更改仪表板。我们还使用
    `cansend` 发送特定的 CAN 消息，直接从命令行使用转向灯、更改速度表并解锁车门。最后，我们了解到入侵一辆真正的汽车只需要大约 $100 的工具和大量的耐心。


    # 11 现在就可以做的十件事来保护自己在线安全


    ![](img/chapterart.png)


    你已经读完了本书，但你作为一名道德黑客的旅程才刚刚开始。你现在了解坏人使用的技巧和工具——以及如何防御主要攻击来源（物理入侵、社会工程、搜索引擎侦察、汽车和物联网入侵、恶意软件、密码破解、Web
    服务器入侵以及移动设备入侵）。换句话说，你已经学会先入侵自己！本章最后是对十件最重要的事情的快速回顾，你可以立即做到，以保护自己和你关心的人免受网络和现实世界中的攻击。


    ## 1\. 认识到你是一个目标。


    人们有时会说，“这永远不会发生在我身上”或“我什么也做不了”，然后他们最终成为恶意入侵的受害者。本书向你展示了入侵大多数设备是多么简单，任何人都无法完全免受网络威胁。然而，通过采取一些明智的预防措施，你至少可以避免成为攻击者的
    *容易* 目标。认识到你是一个潜在的目标——并且你的个人信息对普通黑帽黑客来说很有价值——是你保护自己和你关心的人的重要第一步。


    ## 2\. 警惕社会工程学。


    如果有人试图让你做某事，无论是在线还是面对面，请停下来思考这是否符合你的最佳利益。从咄咄逼人的二手车销售人员到网络罪犯再到网络捕食者，攻击者利用人类心理试图诱骗我们按他们想要的方式行事。


    注意并小心对待对你隐私的威胁。如果有人要求你的个人信息，请考虑他们到底是谁。他们在索要什么，为什么需要这些信息？在可能的情况下，避免自己处于必须放弃信息的位置：屏蔽不需要的联系人和社交媒体连接，不回复直接删除可疑电子邮件，挂断机器人电话，并删除垃圾短信。任何这些烦恼都可能是攻击者的入侵途径。


    顺便说一下，克制自己在社交媒体上分享太多信息。在发布、拍照、推文或分享之前，想想谁可以看到你的帖子，他们可以用这些信息做什么。你和朋友的照片、你去过的地方（*永远*不要在度假期间发布度假照片），以及你喜欢的东西，都可能被攻击者用来诱骗你信任他们。


    如有疑问，请与你信任的人谈谈；向 FTC 报告网络犯罪，网址为 [`www.ftc.gov/`](https://www.ftc.gov/) 或向 FBI
    报告，网址为 [`www.ic3.gov/`](https://www.ic3.gov/)，并向当地执法部门报告网络欺凌、跟踪或骚扰。


    ## 3\. 记住物理安全的重要性，并在可能时关闭设备。


    物理访问即完全访问，因此要像关注在线安全一样小心物理安全。锁好门，保护好你的物品，并注意将什么东西插入你的电脑。如果你只是在咖啡店离开笔记本电脑几分钟，攻击者就可以访问你的文件或直接带走整台电脑。插入电脑的闪存驱动器或其他设备可用于窃取文件或启动恶意软件。


    当不使用时，关闭电脑的连接，如蓝牙或 Wi-Fi。除了节省电池寿命外，你还将阻止攻击。移动设备也一样，使用完毕后应关闭应用。如果可以的话，夜间关闭电脑和手机。你会因额外的安心而睡得更好——而且每月还能节省几美元的电费！


    ## 4\. 点击前三思。


    如果你不确定电子邮件的来源，不要打开任何链接或附件。点击前仔细检查网页链接——或将其通过 VirusTotal 运行。更好的是，打开一个新浏览器并搜索真实网站，而不是通过电子邮件点击，即使它看起来合法。


    除非你信任来源，否则不要通过网络下载或安装软件，即使如此，也请先在 VirusTotal 或你的防病毒扫描器中检查。不要打开可疑的附件，包括 Office
    文档、PDF 和视频；验证来源或扫描文件以防病毒更安全。不要分享或下载非法文件或盗版软件、音乐或电影。恶意黑客喜欢在这些“免费”文件中隐藏邪恶的惊喜。


    只从官方应用商店安装移动应用。在安装新应用之前，阅读应用请求的权限列表。游戏或简单应用不需要访问你的联系人、通话记录或短信——除了像 *Pokémon Go*
    这样的增强现实或基于位置的应用外，应用也不应要求你的位置。如果应用请求的权限比你认为它需要的多，请删除它并找到一个权限更少的替代品。


    ## 5\. 使用密码管理器并开启双因素认证。


    大多数人的密码可以在几秒钟或几分钟内被破解。八个字符的密码永远不够。用四个或更多单词组成一个易记的密码短语，并混合字符类型（包括字母、数字、符号，甚至非键盘字符）。不要在多个网站上重复使用相同的密码；即使你添加数字或特殊字符，黑客破解与他们已知的密码相似的密码也只需要几秒钟。


    不要将密码存储在浏览器中——记住，你只需几次点击就能泄露这些密码！相反，使用 *密码管理器*，如 KeePass、Dashlane、LastPass 或类似工具。密码管理器会为你的所有账户随机生成难以破解的复杂（20
    个字符以上）密码并以加密形式存储。你设置一个长密码短语来访问密码管理器，然后让密码管理器自动处理所有其他密码，这样你就不必记住它们了。


    密码管理器被认为很安全，因为它们实际上使用军用级加密来加密你的密码。这与我们在第 1 章中看到浏览器使用的通过混淆实现的安全性非常不同。密码管理器不仅仅是隐藏你的其他密码，而是通过在攻击者没有你的长密码短语时使其无法恢复来保护它们。打个比方，密码管理器就像把你的家门钥匙放在一个重达两吨的防弹保险箱里，这个保险箱用
    20 位数字组合锁固定在你的路边，而不是把钥匙藏在门垫下。通过在存储前真正加密你的密码，密码管理器（配合良好的密码短语）提供了真正的保护，而不仅仅是混淆。

    '
