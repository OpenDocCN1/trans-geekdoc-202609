    6. Choose `64 bit`, select your language, and click `Download`.


    The Windows 10 installation download is an `ISO` file, often called an `image`,
    which is a single file containing all the files needed to make a CD or DVD like
    our software installation disc. The ISO file is 4GB or more, so try to download
    it somewhere with a fast internet connection.


    ### Burning Windows 10 onto a DVD


    To burn the copy of Windows 10 onto a DVD, you’ll need a computer with a DVD writer
    drive.


    1. For Windows, right-click the ISO file and select `Burn disc image`. For Mac,
    select the ISO file in Finder and go to `File`▶`Burn <disc>`.


    2. Insert a blank DVD into the drive, and in a few minutes, you should have a
    bootable Windows 10 installation disc.


    ### Installing Windows 10 onto a USB Flash Drive


    If you don’t have a DVD writer drive, you can install the copy of Windows 10 onto
    a USB flash drive using Microsoft’s Windows Media Creation Tool.


    1. Go to [https://www.microsoft.com/en-us/software-download/windows10/](https://www.microsoft.com/en-us/software-download/windows10/),
    as shown in [Figure A-3](#b01.xhtml#figureA-3). (Again, Microsoft changes its
    URLs, site names, and even tool names often, so if this URL doesn’t work, search
    for “Windows Media Creation Tool” and you should find the correct link.)


    ![Figure A-3: Download the Windows Media Creation Tool from Microsoft.](image_fi/502000b01/fAA003.png)

    Figure A-3: Download the Windows Media Creation Tool from Microsoft.


    2. Download and install the Windows Media Creation Tool for your preferred language.


    3. When you run the tool, select `Create installation media (USB flash drive,
    DVD, or ISO file)`, then click `Next`.


    ![Figure A-4: Choose Create installation media.](image_fi/502000b01/fAA004.png)

    Figure A-4: Choose `Create installation media`.


    4. Leave the default selections for the language and version of Windows 10, then
    click `Next`.


    5. Choose `USB flash drive` as your media type.


    ![Figure A-5: Choose USB flash drive, insert an empty USB drive, then click Next.](image_fi/502000b01/fAA005.png)

    Figure A-5: Choose `USB flash drive`, insert an empty USB drive, then click `Next`.


    6. Plug in an empty USB drive with at least 8GB of free space, select the empty
    USB drive, and click `Next`.


    It’ll take several minutes, but when the tool is finished, you’ll have a bootable
    USB drive with a full installation of Windows 10 ready to use for the Sticky Keys
    hack or general computer troubleshooting and repair.


    # B Troubleshooting VirtualBox


    ![](image_fi/book_art/chapterart.png)


    The first time you run a virtual machine in VirtualBox, you might encounter errors
    due to different settings on your Mac or PC. Use this appendix to troubleshoot
    your VirtualBox setup. If you try everything listed in these steps and still have
    trouble, go to the book’s website, [https://www.nostarch.com/go-hck-yourself/](https://www.nostarch.com/go-hck-yourself/),
    for the latest help, or do a web search for the specific error you’re seeing.
    Setting up a virtual hacking lab may take a few tries, but it’s worth it!


    ## Troubleshooting VirtualBox on Mac


    Some Macs might display an error when loading the Kali VM for the first time.
    Try following these steps to fix the error:


    1. Make sure you’ve correctly installed the VirtualBox Extension Pack, as described
    in Chapter 3.


    2. Go to `System Preferences`▶`Security & Privacy` and click the `General` tab.


    3. If you see a message near the bottom saying that Oracle software was blocked
    from loading, click `Allow`.


    4. Restart VirtualBox, and your Kali VM should open correctly.


    ## Troubleshooting VirtualBox on Windows


    If VirtualBox isn’t running correctly for you on Windows, you may need to do the
    following:


    1. Turn off Hyper-V options in the Control Panel.


    2. Turn on Virtualization in your computer’s BIOS or UEFI settings.


    We’ll go through both steps in more detail next. Once you’ve done both, restart
    VirtualBox and retry opening the Kali VM.


    ### Turn Off Hyper-V Options


    Some versions of Windows come with Hyper-V (Microsoft’s own virtualization software)
    enabled by default. To use VirtualBox instead, you’ll need to turn off Hyper-V.


    1. Go to `Control Panel`▶`Programs`▶`Programs and Features`▶`Turn Windows features
    on or off`.


    2. In the list of settings, uncheck all boxes with Hyper-V or Hypervisor Platform
    in their names, as shown in [Figure B-1](#b02.xhtml#figureB-1).


    ![Figure B-1: Turning off all Hyper-V and Windows Hypervisor Platform options](image_fi/502000b02/fab001a.png)

    Figure B-1: Turning off all Hyper-V and Windows Hypervisor Platform options


    3. After turning off the Hyper-V and Hypervisor Platform settings, you’ll need
    to reboot your computer before running VirtualBox again.


    ### Turn On Virtualization in BIOS/UEFI Settings


    If you’ve turned off Hyper-V and still have trouble using VirtualBox, you may
    need to enable virtualization. To turn on virtualization support, you’ll need
    to reboot into your computer’s BIOS or UEFI, the basic hardware settings for your
    PC.


    1. In Windows 10, go to `Settings`▶`Update & Security`▶`Recovery`▶`Advanced startup`▶`Restart
    now`, as shown in [Figure B-2](#b02.xhtml#figureB-2). Your computer should reboot
    into an advanced startup mode.


    ![Figure B-2: Entering BIOS from Windows 10](image_fi/502000b02/fab002.png)

    Figure B-2: Entering BIOS from Windows 10


    2. From the blue startup menu, select `Troubleshoot` and press `ENTER`. Then select
    `Advanced options` and press `ENTER` again, as shown in [Figure B-3](#b02.xhtml#figureB-3).


    3. The Advanced options menu screen contains useful tools for troubleshooting
    and fixing your PC, including System Restore and Startup Repair. At the bottom-right
    of this menu, select the option for either `UEFI Firmware Settings` or `Startup
    Settings`, as shown in [Figure B-4](#b02.xhtml#figureB-4).


    ![Figure B-3: Accessing the Advanced options menu](image_fi/502000b02/fab003b.png)

    Figure B-3: Accessing the Advanced options menu


    ![Figure B-4: Accessing the UEFI Firmware Settings or Startup Settings](image_fi/502000b02/fab004b.png)

    Figure B-4: Accessing the UEFI Firmware Settings or Startup Settings


    4. Press `ENTER` and then click `Restart`. If your computer uses the newer UEFI
    firmware settings, you should see the UEFI settings menu when it restarts. If
    your computer uses the older BIOS startup settings, you may need to press a special
    key to enter BIOS as it restarts.

