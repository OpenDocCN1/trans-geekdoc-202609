    通常，输入用户 ID（如 1）到文本框中并点击提交会显示该特定用户的信息。然而，我们将入侵该表单以显示所有用户。


    3. 如果你尝试过查找用户，请重新加载 SQL 注入页面。然后在 User ID 文本框中输入 `'' OR 1=''1`，如 图 8-12 所示。


    ![图 8-12：通过向易受攻击的数据库搜索表单注入 SQL 代码来攻击数据库](img/f08012.png)

    图 8-12：通过向易受攻击的数据库搜索表单注入 SQL 代码来攻击数据库


    4. 点击提交，你应该会看到所有用户的名字和姓氏（姓氏）的列表，如 图 8-13 所示。


    5. 现在让我们提取所有 DVWA 用户名和密码。重新加载 SQL 注入页面并在 User ID 下方的搜索框中输入以下 SQL 代码：


    ```

    '' union select user, password from users#

    ```


    ![图 8-13：我们已泄露所有五个用户的名字和姓氏！](img/f08013.png)

    图 8-13：我们已泄露所有五个用户的名字和姓氏！


    SQL 中的 `union` 命令将两个查询语句连接起来，以便同时访问多个表。在这种情况下，我们将用于查找名字和姓氏的用户 ID 查询与将从 `users`
    表返回用户名和密码的查询结合起来。


    6. 点击提交，你会看到所有五个用户的用户名和密码代替了他们的名字和姓氏，如 图 8-14 所示。所有密码都以哈希形式存在，但正如你在第 7 章中学到的那样，像
    Hashes.com 或 John the Ripper 这样的工具可以轻松破解大多数密码哈希。


    ![图 8-14：我们已使用 SQL 注入攻击从 DVWA 窃取了所有用户名和密码哈希！](img/f08014.png)

    图 8-14：我们已使用 SQL 注入攻击从 DVWA 窃取了所有用户名和密码哈希！


    正如你所见，拥有几行简短的 JavaScript 或 SQL 代码的黑客可以破坏 Web 应用程序，将用户重定向到恶意站点，窃取数据，甚至更糟。幸运的是，道德黑客可以帮助网站所有者抵御这些攻击，从而极大地提高每个人的在线数据安全性。


    ## 从 XSS、SQLi 等攻击中保护 Web 应用程序


    DVWA 展示了如何入侵 *和* 如何保护 Web 应用程序。每个易受攻击页面的右下角都有一个 View Source 按钮，可以显示页面的代码。我们将比较低安全性页面的源代码与更高安全级别页面的源代码，以学习如何防止注入攻击。


    仍在 DVWA 的脚本安全性设置为低的 SQL 注入页面上，点击 `View Source` 查看用户查找应用程序的源代码，包括以下两行代码：


    ```

    $id = $_GET[''id''];

    $getid = "SELECT first_name, last_name FROM users WHERE user_id = ''$id''";

    ```


    该 Web 应用程序是用 PHP 编写的，一种流行的 Web 编程语言。第一行代码从名为 `''id''` 的表单字段获取用户输入并将其存储在名为 `$id`
    的变量中。然后，它使用用户输入创建 SQL 查询。用户未修改的输入成为代码的一部分——这是危险的编程错误，也是我们能够入侵数据库的原因。


    点击左侧的 `DVWA Security`，将脚本安全级别更改为 `medium`，然后点击 `Submit`。点击 `SQL Injection` 返回用户查找应用程序，然后再次点击
    `View Source`。（如果切换安全级别有困难，请关闭 Edge 浏览器，重新打开并重新登录 DVWA。）这次，你会看到在刚刚列出的两行之间插入了一行新代码：


    ```

    $id = mysql_real_escape_string($id);

    ```


    这一行重新格式化用户的输入，在用户输入的任何特殊字符之前添加 *转义字符*（如反斜杠 `\`），例如我们在 `'' OR 1=''1` 入侵中使用的单引号
    `''`。在单引号前添加反斜杠会告诉数据库将单引号视为文本的一部分，而不是命令的一部分。`mysql_real_escape_string()` 命令通过将单引号和其他潜在恶意字符更改为无害的转义序列形式（`\''`）使表单更安全，这样数据库就不会将其视为代码，但有动机的攻击者仍可能绕过它。


    返回 DVWA Security 页面并将脚本安全级别更改为 `high`。然后返回 SQL 注入页面并最后一次点击 `View Source`。查找以下代码：


    ```

    $id = $_GET[''id'']; $id = stripslashes($id); $id = mysql_real_escape_string($id);    if
    (is_numeric($id)){ --snip--

    ```


    高安全性代码使用 `stripslashes()` 命令从用户文本中删除反斜杠，并使用 `is_numeric()` 确保你输入的是数字。使用 `is_numeric()`
    是表单字段 *验证* 的一个例子：命令 `is_numeric()` 检查用户的提交是否采用可接受的预期格式——在这种情况下是数字 ID——并且只有在是的情况下才继续。


    查看低、中、高安全性的其他页面的源代码，以发现 Web 开发人员用来保护其应用程序的命令的其他层。例如，XSS 反射页面的安全版本包含 `htmlspecialchars()`
    以防止 HTML 和 JavaScript 注入。为了防止用户输入破坏网站或数据库代码，更高安全版本源代码中添加的命令会 *清理* 输入，或在该输入在网站或数据库中使用之前，从中删除可能恶意的代码符号（如单引号、反斜杠和尖括号字符）。


    ## 总结


    在本章中，你了解到 Web 服务器全天候在线，可供全球各地的黑客攻击。此外，单个未受保护的 Web 表单可能会使攻击者暴露数百万用户的数据。你在虚拟黑客实验室中构建了一个故意易受攻击的
    Web 服务器 Metasploitable VM，并使用 DVWA Web 应用程序训练自己测试网站的两种代码注入类型：跨站脚本（XSS）和 SQL 注入（SQLi）。


    你使用了反射和存储的恶意 JavaScript 代码使网页弹出警报消息并将浏览器重定向到另一个网站。你使用 SQL 查看了数据库驱动的 Web 应用程序中所有用户的名字和姓氏，然后你了解了攻击者如何从
    Web 数据库窃取用户名和密码哈希。使用我们在第 7 章中使用的密码破解工具，攻击者可以用很少的技能或精力窃取数百万用户名和密码。


    在如此多的利益相关时，保护 Web 应用程序免受攻击是道德黑客的重要角色。需要多层安全才能充分保护 Web 应用程序。你学习了流行的 Web 编程语言 PHP
    中用于通过删除特殊代码相关字符来清理用户输入的几个函数，从而保护服务器和数据库。你还看到了表单字段验证的示例，检查文本字段以确保用户输入了可接受的值。


    在下一章，你将再为你的道德黑客工具箱添加一组技能——移动设备黑客！你将学习如何保护自己和你的亲人免受日益增多的移动攻击。


    # 9 入侵移动设备


    ![](img/chapterart.png)


    在本章中，我们将探索移动设备黑客的世界。你将使用世界上最流行的移动操作系统 Android 构建一台虚拟机。然后你将使用 Metasploit 入侵你的虚拟移动设备，并使用
    Meterpreter 远程控制它，就像你在第 6 章中入侵 PC 一样。你还将学习几种保护自己、家人和朋友免受日益增多的移动攻击的方法。


    ## 创建 Android 手机/平板电脑 VM

