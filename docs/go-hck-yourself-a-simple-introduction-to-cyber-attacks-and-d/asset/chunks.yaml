    ## Mask Attack

    We can use the part of the password that we know (`SuperGir`), plus some wildcard
    characters, to create a `mask`. A `mask` decreases the number of password combinations
    we have to try by filling in the characters that we know already (in this case,
    the first eight characters: `SuperGir`). We don’t know whether Kara’s password
    ends in numbers, letters, or special characters based on the sticky note, so let’s
    use a mask of `SuperGir?a` to start.


    1. In Johnny, click **Options** on the left, click the **Mask** tab, and enter
    `SuperGir?a` into the Mask: text box.

    2. Click **Start new attack** at the top. Then, to see if Kara’s password was
    cracked, click **Passwords** on the left. You should see that a single wildcard
    character after `SuperGir` wasn’t able to crack the password.

    3. Go back to the **Mask** tab, enter two wildcard characters, `SuperGir?a?a`,
    and try it again.

    4. Still nothing? Enter a third wildcard character, `SuperGir?a?a?a`, as shown
    in [Figure 7-8](#c07.xhtml#figure7-8). Then click **Start new attack** again.


    ![Figure 7-8: Using a mask attack—putting wildcard characters after the partial
    password found on a sticky note—to crack Kara’s password](image_fi/502000c07/f07008.png)

    Figure 7-8: Using a mask attack—putting wildcard characters after the partial
    password found on a sticky note—to crack Kara’s password


    This time, the progress bar at the bottom of the window in [Figure 7-8](#c07.xhtml#figure7-8)
    should change to show that Johnny was able to crack one additional password. Click
    **Passwords** again. Now, next to `kara`, you’ll see her password, `SuperGirl7!`,
    as shown in [Figure 7-9](#c07.xhtml#figure7-9).


    ![Figure 7-9: The password mask SuperGir?a?a?a was able to crack Kara’s password
    (SuperGirl7!) in less than a second!](image_fi/502000c07/f07009.png)

    Figure 7-9: The password mask `SuperGir?a?a?a` was able to crack Kara’s password
    (`SuperGirl7!`) in less than a second!


    Even though we had only part of Kara’s password, we were able to use a mask attack
    to guess her complete password. It took Johnny less than a second to try the thousands
    of possibilities, from `SuperGir000` to `SuperGirl7!`, one by one. That means
    that if you reuse a password by changing only numbers and symbols at the beginning,
    middle, or end, a hacker who finds one of your old passwords can guess your current
    password in seconds using Johnny or a similar tool.


    You can also use a mask attack for Peter’s password. Enter a few wildcard characters—starting
    with `SpidermanRu?a`, then `SpidermanRu?a?a`, and so on—until you crack the full
    password. The last round may take five or six minutes to run, as each added character
    increases the complexity exponentially (3 wildcards take less than a second, 4
    wildcards take three to four seconds, 5 wildcards take five to six minutes, 6
    wildcards take almost nine hours, and 14 wildcards would take thousands of years!).


    The exponential increase in the time it takes to crack longer passwords is exactly
    why everyone should use long passwords. No matter how many years we run Johnny,
    we’re not likely to crack our long passphrase, the final password you created.
    Long passwords are one of the tricks we can use to keep hackers out of our accounts.


    ## Using Safer Passwords

    You can make your passwords too hard for even pros to crack with just a couple
    of changes. First, generally the longer a password is, the safer it will be. To
    make a strong passphrase, pick four or more random, unrelated words and string
    them together. To make your passphrase almost uncrackable, add a few numbers or
    special characters.


    In addition to the regular keyboard special characters like `!`, `@`, `#`, and
    `$`, you can add a special character from a language or alphabet different from
    your own. Even if you use a shorter password instead of a passphrase, adding a
    special character from another language can make it much harder to crack.


    Let’s look at how to do this in different operating systems.


    1. Windows Hold down the `ALT` key while typing numbers on the numeric keypad
    and then release it. For example, hold down the `ALT` key while typing `0214`
    on your numeric keypad; when you release the alt key, the character `Ö` will appear
    (a capital `O` with an umlaut). Search online for a list of “Windows alt codes”
    to find a character you want to use. Note that some keyboards may require you
    to use the left `ALT` key specifically. On a laptop without a numeric keypad,
    you can press the Windows key plus the period key (`Windows-.`) to insert an emoji
    or other symbol.

    2. Linux Press `ctrl-shift-U`; release (you’ll see an underlined `u` onscreen);
    enter the Unicode hexadecimal value for the character you want, like `d6` (or
    `00d6` for systems that require four digits) for the `Ö` character, and then press
    the `spacebar` or `enter`. Search online for “Unicode character codes” to find
    more options.

    3. macOS Press `CONTROL-COMMAND-SPACEBAR` to bring up the Character Viewer. Enter
    `u+d6` to show the `Ö` character. To insert the character, either press the down
    arrow to select it and then press `ENTER` or simply click it with your mouse.
    The same Unicode character codes that work for Linux will work on macOS in the
    Character Viewer; just add `u+` before the hexadecimal code.

    4. iPhone or Android Press and hold the `O` on the virtual keyboard until a pop-up
    appears with the `Ö` character and other options. You can’t access all Unicode
    characters without installing an app or choosing an alternate keyboard layout,
    but a long press on most vowels and a few consonants will give you enough options
    to make your password stronger.


    Of course, you might not remember more than one or two long passwords with special
    characters like this. A password manager can lessen the burden by setting long,
    random passwords for most of your accounts and safely storing them for you. Additionally,
    you should turn on two-factor authentication whenever it’s offered. With this
    feature, even if an attacker cracks one of your passwords, they may not be able
    to gain access to your account. We’ll look more closely at these tools in Chapter
    11.


    ## The Takeaway

    In this chapter, you learned how attackers steal Windows password hashes over
    the web using `Mimikatz` in `Metasploit`. Once an attacker has access to your
    computer through malware they’ve tricked you into installing, they can (and often
    do) look around your system for passwords or other sensitive data. Then you saw
    how hackers can easily crack many password hashes with a free online password
    database or a dictionary attack in `John the Ripper`. You also learned how to
    crack more complex passwords using a mask attack by adding a few wildcard characters
    to an old or incomplete password.


    Finally, you learned some techniques to keep yourself safe from the password hacks
    covered in this chapter. Here’s a short summary of dos and don’ts that can change
    your password habits for life:


    * *Don’t* use the same password across multiple accounts.

    * *Don’t* reuse a password by adding numbers or symbols to the end (or middle
    or beginning).

    * *Don’t* write passwords down or store them in plaintext documents or spreadsheets.

    * *Do* use long passphrases with one or more special characters.

    * *Do* use a password manager and multifactor authentication.


    These tips will make your online life easier and *much* more secure than the average
    person’s. However, an attacker doesn’t have to access your computer to steal your
    password; they can steal passwords and other information from web applications
    and servers over the internet. In the next chapter, we’ll learn how by hacking
    into a vulnerable web server in our virtual lab.


    First, though, check [Listing 7-2](#c07.xhtml#listing7-2) to see if you successfully
    cracked the passwords from the beginning of the chapter!

