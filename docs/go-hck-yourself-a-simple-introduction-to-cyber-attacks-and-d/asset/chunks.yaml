  trans: "\n在本章中，您将使用 Google 查找有关您自己的信息，并使用 *Google hacking* 查找用户名和密码。然后您将使用社交媒体进行进一步的侦察，并学习通过限制在线分享的信息来保护自己。您不分享的信息就是攻击者无法利用的信息！\n\
    \n## 先自行搜索（在敌人之前）\n\n攻击者可以利用公开信息进行 *phishing* 攻击，在这种攻击中，他们假装成您认识的人并发送虚假电子邮件，要求提供个人信息如您的密码。许多公司网站都有员工名单或员工目录，其中包含攻击者发动钓鱼攻击所需的所有姓名和电子邮件地址，甚至更糟。\n\
    \n让我们看看攻击者能看到您哪些信息。打开一个网页浏览器并搜索您自己的姓名。我在 Google 上搜索了自己的姓名，如 图 4-1 所示。\n\n![图 4-1：在您喜欢的搜索引擎上搜索自己的姓名。](img/f04001.png)\n\
    \n图 4-1：在您喜欢的搜索引擎上搜索自己的姓名。\n\n任何人在互联网上都可以查到我做什么、在哪里工作，以及我写过书籍并发布了有关编程和网络安全方面的在线课程。点击结果链接会显示更多信息，包括我在\
    \ 2018 年驾驶的汽车类型以及一些我的电子邮件地址。同样，您可能出现在工作活动、新闻文章、运动队、教会或非营利组织以及社交媒体页面和帖子的照片中。您的姓名或图像甚至可能出现在有关您家人或高中或大学同学聚会的文章中——这些都是您没有意识到已在互联网上的东西。\n\
    \n通常只需几分钟的侦察就能发现某人工作在哪里、住在哪里、年龄多大、家庭成员是谁等等。这些信息中的任何一项单独来看可能并不特别令人担忧，但如果足够多的信息可供获取，攻击者就可以在您身上建立一个完整的档案，包含家庭成员的姓名和出生日期、宠物的名字、工作和家庭位置等等。掌握这些信息后，攻击者可能能够回答您的密码安全问题，完全猜出您的一个密码，或冒充您认识的人以便从您那里提取更多信息。\n\
    \n保护个人信息的难度比以往任何时候都大，但一点意识可以帮助您避免一些常见错误。并且一些技能将帮助您找到可能已经泄露的关于您、您的公司或您家人的信息，包括您的在线账户和密码。\n\
    \n## 高级 Google 搜索\n\n简单的网络搜索是很好的侦察，但 Google 的真正威力——Google hacking——来自于使用高级搜索命令。通过高级搜索，您可以找到用户名、密码、安防摄像头\
    \ feed 等等。然而，Google hacking 技术也会使您更容易意外下载恶意软件。为保护自己，请务必使用以下防御措施：\n\n*   在您在第 3\
    \ 章中设置的 Kali Linux 虚拟机内进行研究。请记住：在 VM 中执行的操作通常不会影响您的计算机，因此 VM 提供了一层安全性。如果您在 VM\
    \ 中打开了感染的文件，您只需删除并重新安装虚拟机即可。\n*   在点击链接之前检查链接是否感染了病毒。即使在 VM 内部，这也始终是一个良好的安全措施。VirusTotal\
    \ 是一个免费的在线工具，可扫描网页、文件和链接中的恶意软件。我们将在下一节中使用 VirusTotal 在打开文件前扫描密码文件。\n*   确保您的计算机已安装防病毒软件，以防您在\
    \ VM 外意外点击链接，并在研究期间恶意软件进入您的计算机。\n\nGoogle hacking 依赖于对 *search operators* 的熟练使用，这些符号或词语使您的搜索结果更精确。您可能已经熟悉一些基本搜索操作符。例如，将引号（“\
    \ ”）放在短语周围会搜索确切的短语，而不是短语中的单个词。使用操作符 `AND` 和 `OR` 可以帮助您找到同时包含两个词的页面（*3D* `AND`\
    \ *printer*）或包含任一词的页面（*coding* `OR` *cyber*）。\n\n其他搜索操作符不太为人所知，但它们可以成为强大的黑客工具。例如，操作符\
    \ `ext:` 搜索特定的 *file extensions*，即不同类型文件的 filename 结尾。示例包括 *docx* 用于 Microsoft\
    \ Word 文档，*txt* 用于纯文本，*pdf* 用于 PDF 文件，*xlsx* 用于 Microsoft Excel 电子表格，等等。操作符 `site:`\
    \ 搜索特定网站的结果；您可能会搜索 `site:nostarch.com` 或 `site:yourcompany.com`。\n\n黑客知道如何使用这些操作符来查找可能包含更有价值信息的特定类型文件，例如存储在摄像机用户手册在线\
    \ PDF 版本中的某种视频监控摄像机的默认密码。执行客户侦察的道德黑客可以使用这些有针对性的搜索词，帮助公司删除在线公开的敏感数据，例如显示公司去年购买了什么品牌的视频监控摄像机的预算电子表格。\n\
    \n### 使用 ext: 操作符查找密码\n\n如果您知道在哪里以及如何查找，互联网上充满了敏感信息，如人们的用户名和密码。让我们尝试使用 `ext:`\
    \ 搜索操作符来查找包含密码的电子表格。\n\n在您的虚拟机中，打开网页浏览器，前往 `https://www.google.com/`，并在搜索字段中输入\
    \ `ext:xls password`，如 图 4-2 所示。\n\n请记住 *not* 点击任何结果，因为熟练的攻击者很容易在感染的电子表格文件中隐藏病毒或勒索软件（或让感染的网页看起来像搜索引擎中的电子表格）。*Ransomware*\
    \ 是一种讨厌的恶意软件类型，它会加密您所有的文件并要求您支付赎金才能取回您的数据，所以要小心！\n\n您可能会在搜索页面中直接找到数十个用户名和密码，并且可以添加额外的搜索词来进一步定位搜索。例如，我在搜索中添加了\
    \ DCCC（缩写为民主党国会竞选委员会），并且 图 4-2 中的顶部结果显示了 2016 年美国选举活动密码，据称这些密码被黑客窃取，企图干预 2016\
    \ 年美国总统选举。\n\n![图 4-2：输入 ext:xls password 会找到充满用户名和密码的 Excel 电子表格。](img/f04002.png)\n\
    \n图 4-2：输入 `ext:xls password` 会找到充满用户名和密码的 Excel 电子表格。\n\n一旦您找到了感兴趣的搜索结果，请按照以下步骤操作：\n\
    \n1.  复制其中一个文件的 URL：突出显示 Google 搜索结果中的链接地址，右键单击或 `CONTROL-click`（在 Mac 上），然后选择\
    \ `Copy link address` 或 `Copy link location`。\n2.  在新的浏览器标签页中打开 VirusTotal（[`www.virustotal.com`](https://www.virustotal.com)），点击\
    \ `URL` 标签，并将复制的 URL 粘贴到搜索字段中，如 图 4-3 所示。\n\n    ![图 4-3：在点击前通过 VirusTotal 扫描可疑网页链接。](img/f04003.png)\n\
    \n    图 4-3：在点击前通过 VirusTotal 扫描可疑网页链接。\n3.  点击搜索图标（放大镜）扫描该链接。在 图 4-4 中，VirusTotal\
    \ 已使用超过 60 种不同的防病毒引擎扫描了密码电子表格文件，且均未发现任何感染迹象。\n"
