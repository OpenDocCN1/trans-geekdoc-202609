    # Windows 粘滞键漏洞利用


    ## 通过安装介质访问 Windows 命令提示符


    1. 在 Windows 计算机上，您按一个特殊键来访问启动菜单或 BIOS。如果启动屏幕在 Windows 启动标志出现之前没有显示您需要按哪个键，请重新启动计算机，并在启动开始时迅速按下
    `ESC`、`DELETE`、`F8`、`F9`、`F10`、`F11` 或 `F12`。在网上搜索“启动菜单”以及您计算机的具体品牌和型号以找到正确的键。


    2. 如果启动菜单出现，请选择 **从 DVD 启动** 或 **从 USB 启动** 选项以从您插入的 Windows 安装光盘启动，然后继续执行步骤 5。


    3. 如果启动菜单在几次重启后仍未出现，请尝试进入 BIOS 菜单：再次关闭并打开计算机，然后按下 `DELETE`、`F2`、`F9`、`F10`、`F12`
    或 `ESC`。在网上搜索“BIOS”以及您的计算机型号以找到正确的键。


    4. 进入 BIOS 后，找到启动选项并更改启动设备的顺序或优先级（通常使用方向键），使 USB 或 DVD 成为首选选项。然后保存更改并退出 BIOS。


    5. 再次重启计算机。您应该会短暂看到消息 `Press any key to boot from CD or DVD` 或 `Press any key
    to boot from USB device`。按下任意键（例如空格键）*立即* 从您的 DVD 或 USB 启动。


    6. 当 Windows 安装光盘启动时，点击 **下一步**▶**修复你的电脑**▶**疑难解答**▶**命令提示符**，如 图 2-2 所示。菜单顺序或选项名称可能看起来不同，但请查找
    Windows 命令提示符。


    ![图 2-2：使用 Windows 安装光盘访问命令提示符。](img/f02002a.png)

    图 2-2：使用 Windows 安装光盘访问命令提示符。


    7. 一旦到达 Windows 命令提示符（通常是一个黑色、基于文本的窗口），输入 `c:` 并按 `ENTER` 切换到 `C:` 驱动器，如下所示：


    ```

    X:\> c:

    ```


    8. 输入命令 `dir` 查看 `C:` 驱动器上的文件和文件夹列表。查找名为 `Windows` 的文件夹（它将被标记为 `<DIR>`，缩写为 *目录*）。


    ```

    C:\> dir Volume in drive C is Windows 10 Volume Serial Number is B4EF-FAC7 Directory
    of C:\--snip--

    03/15/2018  02:51 AM    <DIR>            Users

    05/19/2019  10:09 AM    <DIR>            Windows 1--snip--

    ```


    此文件夹 1 包含操作系统文件，包括命令提示符应用程序和我们需要交换以执行此漏洞利用的粘滞键程序文件。


    9. 如果 `C:` 驱动器上没有 `Windows` 目录，请在 `D:` 驱动器上尝试相同的过程，输入 `d:` 然后 `dir`。如果 `D:` 驱动器也没有
    `Windows` 目录，请继续按字母顺序尝试（`E:`、`F:`、`G:` 等），直到找到包含 `Windows` 的驱动器。


    ### 获取管理员级别访问权限


    现在将 `sethc.exe` 粘滞键程序替换为 `cmd.exe` 命令提示符程序。然后我们将能够在计算机上创建一个新的管理员账户。


    1. 输入以下三个命令：


    ```

    C:\> cd \Windows\System32\

    C:\Windows\System32\> copy sethc.exe sethc.bak

    C:\Windows\System32\> copy cmd.exe sethc.exe

    ```


    这些命令进入可以找到 `sethc.exe` 和 `cmd.exe` 的目录，创建粘滞键程序的备份副本，并用命令提示符程序文件的副本替换原始粘滞键程序文件。这样，每当计算机运行
    `sethc.exe` 时，它将打开一个命令提示符窗口代替粘滞键程序。


    2. 在第三个命令之后，Windows 会询问您是否要覆盖 `sethc.exe`。输入 `Y` 继续。


    3. 移除 Windows 10 安装 DVD 或 USB 并重启计算机。


    4. 当 PC 启动到登录屏幕时，按五次 `SHIFT`。而不是通常的粘滞键程序，您应该会看到一个命令提示符窗口弹出*在前面*登录屏幕，如 图 2-3 所示。


    ![图 2-3：打开命令提示符窗口](img/f02003.png)

    图 2-3：打开命令提示符窗口


    5. 在命令提示符窗口中输入以下两个命令：


    ```

    C:\Windows\System32\> net user ironman Jarvis /add

    C:\Windows\System32\> net localgroup administrators ironman /add

    ```


    第一个命令在 Windows 计算机上添加一个名为 `ironman` 且密码为 `Jarvis` 的用户账户。第二个命令将 `ironman` 用户添加到本地管理员列表中。这意味着当我们以
    `ironman` 登录时，我们将对计算机上的所有文件具有管理员级别的访问权限。


    6. 当您看到 图 2-4 中类似的成功消息时，关闭命令提示符。


    ![图 2-4：我们已成功将名为 ironman 的用户添加为此计算机的管理员。](img/f02004.png)

    图 2-4：我们已成功将名为 `ironman` 的用户添加为此计算机的管理员。


    除了创建新用户账户外，您还可以通过在命令提示符窗口中输入 `net user` 后跟现有用户名和您想要设置的新密码来重置现有用户的密码——例如，`net user
    bryson Thisisyournewpassword!`。但是，您绝不应在未经他人许可和计算机所有者许可的情况下重置他人的密码。


    ### 现在您是管理员。登录！


    恭喜！您现在已作为管理员访问该机器。请继续登录。输入 `.\ironman` 作为用户名（或从账户列表中选择 `ironman`，如 图 2-5 所示）。`ironman`
    前面的点和反斜杠告诉 Windows 该账户是本地计算机的，而不是存储在网络服务器上。输入用户名后，输入密码 `Jarvis`。


    ![图 2-5：您现在可以使用 ironman 用户登录此 Windows PC。](img/f02005.png)

    图 2-5：您现在可以使用 `ironman` 用户登录此 Windows PC。


    由于我们将 `ironman` 用户设为本地管理员组的成员，您应该对 *全部* 文件和文件夹具有管理员级别的访问权限，包括 `C:\\Users\\` 中的所有用户和文档，如
    图 2-6 所示。


    ![图 2-6：作为管理员级别用户，您可以看到所有用户的文件，而不仅仅是您自己的。](img/f02006.png)

    图 2-6：作为管理员级别用户，您可以看到 *全部* 用户的文件，而不仅仅是您自己的。


    当您第一次点击另一个用户的文件夹时，您会看到一个弹出消息，提示您需要权限来打开另一个用户的文件，如 图 2-7 所示。由于您是管理员，请点击 **继续**
    为自己授予永久访问权限！


    ![图 2-7：管理员可以授予自己访问同一台计算机上任何人文件的权限。](img/f02007.png)

    图 2-7：管理员可以授予自己访问任何人文件的权限在同一台计算机上。


    粘滞键漏洞利用仅适用于 Windows 机器。然而，运行 macOS 的计算机也容易受到物理访问漏洞利用的影响。


    ## Mac Root 漏洞利用


    与粘滞键漏洞利用类似，Mac root 漏洞利用是一种物理访问攻击，可让您获得对计算机的管理员级别访问权限。它使您成为 `root` 用户，即 macOS
    计算机上的管理员级别账户。对于此漏洞利用，您只需要一台 Mac 计算机。我们将以 `single-user mode` 重启 Mac，这是一种故障排除和修复登录。从那里，我们可以更改
    root 用户的密码，从而访问计算机上的所有文件。


    ### 更新 Root 用户设置


    1. 开始时，Mac 需要完全关闭——不仅仅是休眠。如果它尚未关闭，请按住电源按钮约六秒钟。

