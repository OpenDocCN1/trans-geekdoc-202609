    ### 存储型跨站脚本攻击


    大多数网站使用数据库来存储用户输入或经常变化的信息，例如产品信息或客户数据。如果攻击者向与数据库关联的 Web 表单注入恶意代码，该恶意代码将被存储在数据库中并成为网页的永久组成部分。这种攻击称为
    *存储型 XSS 攻击*，可确保恶意代码在有人查看受影响的网页时每次都会运行。相比之下，我们的反射型 XSS 攻击并未永久更改网页，因为注入的代码未保存到数据库。我们现在来试试存储型
    XSS 攻击。


    1. 在左侧的 DVWA 菜单中点击 `XSS stored`。你会看到一个类似留言簿的应用程序，允许用户将姓名和简短消息保存到页面。


