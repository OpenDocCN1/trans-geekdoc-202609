    Location data is automatically stored in most images taken with your smartphone,
    tablet, and many newer digital cameras. *Location data* usually means the *global
    positioning system (GPS)* coordinates, or the precise latitude and longitude of
    your phone or other device on Earth. Depending on the social media service you’re
    using (and your settings), you may be regularly streaming your location in every
    picture you post. A cute picture of your cat or dog taken at home with your smartphone
    can give away the exact location where you live.


    To view location data and other information hidden in pictures, we’ll use Jeffrey’s
    Image Metadata Viewer ([http://exif.regex.info/](http://exif.regex.info/)). You
    can upload a picture file or enter the URL of a picture online to find out if
    there’s any location data or other information in the image file.


    1. Go to [https://www.nostarch.com/go-hck-yourself/](https://www.nostarch.com/go-hck-yourself/)
    and download `BrysonPayne-TEDx.jpg`, a picture of me taken a few years ago at
    a TEDx talk on coding and cybersecurity for kids.

    2. Go to [http://exif.regex.info/](http://exif.regex.info/), click `Choose file`,
    and select the downloaded image file.

    3. Check the reCAPTCHA box to confirm you’re not a robot and then click `View
    Image Data`. [Figure 4-7](#c04.xhtml#figure4-7) shows the hidden data (called
    *image metadata*).


    ![Figure 4-7: Image metadata reveals when, where, and even with which phone the
    photo was taken!](image_fi/502000c04/f04007a.png)


    Figure 4-7: Image metadata reveals when, where, and even with which phone the
    photo was taken!


    The picture was taken on April 8, 2018, at latitude and longitude 34.530261N,
    83.986075W—the exact GPS coordinates of the auditorium where I gave the talk!
    The stage is located at an altitude of 443 meters (1,453 feet) above sea level,
    and the photo was taken on an old iPhone 6S. All of that information, and more,
    is hidden inside every picture you snap with a smartphone by default, so be careful
    where and how you share your photos.


    Some social media apps intentionally post where you are as well. If you’ve ever
    seen someone “check in” at a cool location, that’s an example. But many of the
    other apps on your smartphone, from map apps to email and search engines, may
    also be tracking your location. It’s a good idea to check the security and/or
    privacy settings for all of the apps that you use regularly to see if you can
    turn off location services or use them only when needed.


    ### Protecting Yourself on Social Media


    A little more caution is likely to protect you from sharing too much online. You
    also need to educate your friends, relatives, and coworkers—anyone who might take
    a picture of you in a group and post it to social media or say where you are at
    a specific time. Everyone needs to understand the importance of keeping a little
    more privacy in today’s hyperconnected world.


    Here are some of the steps you can take to protect yourself and those you care
    about from the dangers of social media oversharing:


    1. Think before you share. Before posting a picture or comment, pause to think
    about whether you need to share it right now (or at all). At least wait until
    you’re back home to brag about your amazing vacation. And remember that a thoughtless
    (or drunk) 2 AM social media post can be printed out, reposted, or worse. Every
    tweet, post, and snap becomes part of your permanent online reputation.

    2. Change your default settings. Most social media apps are set by default to
    share way too much information with way too many people. Go into the security
    or privacy settings for the app or website and turn off location data (or location
    services), along with any other sensitive info you don’t want to share.

    3. Limit who can see your posts. If a photo or comment gives out too much information
    about your daily activities, hobbies, or common places you hang out, share it
    privately with just the friends who’d enjoy the post.

    4. Fix problems quickly. Report identity theft (to your local police and to your
    credit bureaus), fraud (to your bank and to the Federal Trade Commission at [https://www.ftc.gov/](https://www.ftc.gov/)),
    other crimes (to the FBI at [https://www.ic3.gov/](https://www.ic3.gov/)), and
    any cyberbullying or harassment (to your local authorities).


    Social media is a powerful connector, but it’s also a powerful tool for both criminal
    black hats and ethical white hat hackers to conduct recon and information gathering.
    Don’t overshare. Instead, be aware of your security and privacy settings, use
    social media wisely, and, if anyone uses social media against you, report it to
    the proper authorities right away.


    ## The Takeaway


    In this chapter, you learned about free online tools, like search engines and
    image metadata viewers, that hackers use to gather information about you and the
    people you care about. Advanced search operators can pinpoint specific usernames
    and passwords either stolen or accidentally posted online. Image metadata viewers
    reveal sensitive information hidden inside pictures posted online, including the
    exact GPS coordinates of the location where the picture was taken and what kind
    of smartphone was used.


    You learned the importance of thinking before you share, being aware of your security
    and privacy settings, limiting who can see your posts, and reporting fraud and
    other cybercrimes quickly. As smart cyberdefenders, we have to balance convenience
    with security to protect ourselves and the people and organizations we care about.


    Each tool and technique discussed in this chapter can be used by ethical hackers
    to improve security and train people to protect themselves. But it can also be
    used by attackers to target victims. The first step in being prepared is to be
    aware of what information is already out there. Take control of what information
    you share online, and you’ll already be one step ahead of online attackers.


    # 5 Social Engineering and Phishing Attacks


    ![](image_fi/book_art/chapterart.png)


    In this chapter, you’ll use your virtual hacking lab to learn one of the most
    common and successful ways that attackers access victims’ computers and accounts:
    social engineering.


    *Social engineering* means tricking people into giving out sensitive or valuable
    information like passwords, credit card numbers, or medical data. Researchers
    estimate that 94 to 98 percent of all computer attacks start with some form of
    social engineering. In movies, hackers often do something really advanced to break
    into a network, but in the real world, they usually just send an email tricking
    someone into giving up their username and password. This social engineering technique
    is known as *phishing*.


    In this chapter, you’ll learn about the dangers of social engineering by creating
    a phishing website and sending a phishing email. You’ll see how easy it is for
    attackers to fool people into giving up their usernames and passwords and how
    to protect yourself against phishing attacks.


    ## How Social Engineering Works


    Social engineering takes advantage of our human desire to be social, help others,
    and be part of a group, or it manipulates our basic human emotions like fear,
    curiosity, or greed to trick us into making a security mistake or giving away
    sensitive information. Peer pressure is a form of social engineering: it persuades
    someone to do something they wouldn’t normally do because “everyone else” is doing
    it or for fear of missing out. Similarly, online scammers use social engineering
    to manipulate us into making bad decisions without thinking about the consequences.


    In the physical world, con artists and criminals socially engineer their way into
    secure buildings by dressing like a delivery person or a utility worker, or they
    “tailgate” behind someone by carrying a large box and asking someone to hold the
    door open for them. Once inside, they “shoulder surf” by watching over someone’s
    shoulder while they enter a password.

