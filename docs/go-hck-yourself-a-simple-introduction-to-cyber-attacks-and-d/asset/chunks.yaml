    在这一点上，非道德的黑客会打开一个或多个电子表格，看看是否能找到可用的登录名和密码信息。作为道德黑客，我们可以选择尊重他人的隐私而不打开文件。或者，如果我们代表客户执行搜索，我们可以检查文件并告知他们信息可能已在线泄露。


    ![图 4-4：我们选中的密码电子表格看起来可以安全打开。](img/f04004.png)


    图 4-4：我们选中的密码电子表格看起来可以安全打开。


    再次尝试搜索，但现在输入 `ext:txt` 或 `ext:pdf` 来检查包含密码的其他文件类型。


    现在尝试专门搜索你自己的信息。搜索你的用户名和单词 *password*，并添加 `ext:` 操作符以查找各种文件类型（例如，`bryson_payne
    AND password ext:xls`）。*切勿在 Google 或任何其他搜索引擎中输入你的实际密码。*


    如果你发现自己的密码已在线发布，请立即更改。


    ## 使用 `site:` 操作符查找密码


    你可以使用 `site:` 搜索操作符在特定网站上查找泄露的密码。例如，在 图 4-5 中，我在 Google 中输入了 `site:ung.edu password`，以查明我所在的大学——北佐治亚大学——的学生或教职员工密码是否存储在我们的公共
    Web 服务器上。实际上这种情况比你想象的更常见——有时私有文件或文件夹会意外存储在公共服务器上，或者教师或管理员可能会临时上传密码文件供新用户使用而忘记删除。


    ![图 4-5：使用 site: 搜索操作符在特定组织的网站上搜索结果。](img/f04005.png)


    图 4-5：使用 `site:` 搜索操作符在特定组织的网站上搜索结果。


    如你所见，没有列出任何文本文件或电子表格，但底部结果是一篇旧新闻文章，关于分配给入校大学生的默认密码。在该文章发布时，攻击者本可以利用默认密码信息猜测数千名学生的初始密码。


    你还可以将 `site:` 操作符与其他操作符组合使用。例如，`ext:pdf site:ung.edu bryson_payne AND password`
    会搜索我大学网站上包含我的用户名和单词 *password* 的 PDF 文件。


    这些只是你在 Google 中用来查找敏感信息的一些搜索操作符。多年来，其他黑客创建了一个 Google 黑客数据库，用来记录有用的搜索操作符组合。


    ## Google 黑客数据库


    *Google Hacking Database* *(GHDB)* 是一个公开列表，其中包含数千种 Google 搜索操作符组合，可用于查找密码、连接到互联网的特定类型设备或设备、存在漏洞的特定
    Web 应用程序等。


    GHDB 是 Hackers for Charity 的 Johnny Long 发起的项目；该数据库现在由 Offensive Security 维护，Offensive
    Security 也是支持 Kali Linux 和其他黑客与安全工具的团队。你可以在 [`www.exploit-db.com/google-hacking-database/`](https://www.exploit-db.com/google-hacking-database/)
    找到 GHDB，或在搜索引擎中搜索“Google Hacking Database”。


    前往 [`www.exploit-db.com/google-hacking-database/`](https://www.exploit-db.com/google-hacking-database/)
    上的 GHDB，并在搜索框中输入 `password`，如 图 4-6 所示。数据库将显示所有包含单词 *password* 的 *search queries*（操作符和搜索文本的组合）。


    ![图 4-6：Google Hacking Database 密码搜索查询](img/f04006.png)


    图 4-6：Google Hacking Database 密码搜索查询


    点击 GHDB 中的任何条目都会显示该特定搜索查询的信息，你甚至可以直接前往 Google 尝试该搜索。


    黑客将 GHDB 中找到的类似高级搜索称为 *Google dorks*，并将使用它们的过程称为 *dorking*。攻击者使用 dorking 不仅可以找到用户名和密码的电子表格，还可以找到带有默认管理员密码的产品
    PDF，或找到具有 Web 界面的易受攻击设备，如监控摄像头甚至建筑物恒温器控制等。像 `intext:username ext:log` 这样的 Google
    dork 可以暴露服务器日志，其中可能包含数据库用户名和密码等有用信息。这些高级搜索技术为黑客节省了大量时间。


    ## 道德黑客如何使用 Google


    如果一家公司聘请道德黑客测试其安全性，黑客会将侦察搜索集中在该公司、其供应商和供货商、员工、客户等方面。如果黑客在侦察过程中发现密码或其他敏感信息，他们会通知公司，以便锁定账户、要求用户更改密码或采取其他必要措施。你应对本书侦察中发现的任何信息采取同样的方式。


    假设你发现了来自你办公室、孩子学校或朋友/家人的账户的密码。首先，永远不要自己尝试这些密码；这就像找到某人的钥匙并未经许可尝试打开那人的前门一样令人毛骨悚然且不道德。道德黑客会向公司或学校的
    IT 员工报告潜在的密码泄露，或告诉朋友或家人他们的密码可能已泄露，并且应立即更改使用该密码或类似密码的任何账户的密码。


    ## 社交媒体与过度分享的危险


    除了 Google 搜索之外，黑客还有另一种令人恐惧的简单侦察工具：社交媒体。你可能会对 Google 已掌握的关于你的信息量感到惊讶——甚至有点害怕。然而，你可能每天或一天多次通过社交媒体泄露更具体、更敏感的信息。


    这里有一个你可以为自己做的快速练习，也可以与朋友或家人分享：在你最喜欢的社交媒体账户上花五分钟做一次关于自己的快速侦察任务。你能查出你住在哪里，你养了什么宠物（它们的名字是什么），你在哪里工作，或你配偶和孩子的名字吗？最近生日的帖子呢？从帖子的日期和提到的年龄（例如，如果有人发布了“祝
    29 岁生日快乐！”），攻击者能否推断出你的确切出生日期和年份？你还能找到关于你经常去的地方（如体育赛事）和你交往的人的其他什么信息？


    发布关于你的工作、爱好、孩子、旅行、宠物或周末活动的信息会向潜在攻击者透露你的位置和兴趣。试图进入你账户的攻击者会尝试使用他们在网上找到的个人信息来猜测或重置你的密码，例如宠物的名字、你的生日或你最喜欢的餐厅。更糟糕的是，如果你在仍在度假期间发布度假照片，任何可以访问你帖子的人都可能推断出你的家可能空着，因此入侵风险更低。


    甚至分享你猫或狗的照片也可能很危险，因为图像文件本身可能会泄露你的位置，正如你在下一节中将看到的那样。


    ### 位置数据——社交媒体的未言明危险

    '
