    ## Reflected Cross-Site Scripting (XSS)


    A *reflected XSS attack* takes advantage of pages that display, or *reflect*,
    a user’s input directly back to them on the web page, like an order form that
    asks for your name and address and then displays them to you to confirm that you
    typed them correctly. Attackers use reflected cross-site scripting to inject malicious
    HTML or JavaScript code into an unprotected web application. Let’s try it out!


    1. In DVWA on your Windows 10 VM, click `XSS reflected` on the left to open the
    Vulnerability: Reflected Cross Site Scripting (XSS) web page.


    This page is designed to reflect your input into the What’s your name? text field
    by displaying it to you, after the word *Hello*. For example, if you enter the
    name `Bryson`, the page will respond with `Hello Bryson`.


    2. Instead of your name, enter the HTML/JavaScript command from the previous section
    into the name text field, as shown in [Figure 8-6](#c08.xhtml#figure8-6):


    ```

    <script>alert("You''ve been hacked!");</script>

    ```


    ![Figure 8-6: Attacking the reflected XSS page by entering HTML and JavaScript
    into the text box](image_fi/502000c08/f08006.png)


    Figure 8-6: Attacking the reflected XSS page by entering HTML and JavaScript into
    the text box


    3. Click `Submit`, and the web page will reload, popping up the message “You’ve
    been hacked!” as shown in [Figure 8-7](#c08.xhtml#figure8-7).


    ![Figure 8-7: The vulnerable web page pops up a message saying we’ve been hacked!](image_fi/502000c08/f08007.png)


    Figure 8-7: The vulnerable web page pops up a message saying we’ve been hacked!


    By combining a single line of HTML and JavaScript and entering it into an unprotected
    text box in DVWA, we injected our code into the web page. A malicious attacker
    could use the same technique to convince a user that their computer is really
    under attack and get them to call a toll-free number for “technical support.”
    In this common scam, criminals rent a call center to take worried victims’ credit
    card information and charge them for fake computer services.


    ### Stored Cross-Site Scripting


    Most websites use databases to store user input or information that changes often,
    such as product information or customer data. If an attacker injects malicious
    code into a web form tied to a database, that malicious code gets stored in the
    database and becomes a permanent part of the web page. This type of attack, called
    a *stored XSS attack*, ensures that the malicious code will run every time someone
    views the affected web page. By contrast, our reflected XSS attack didn’t permanently
    change the web page since our injected code wasn’t saved to a database. We’ll
    try out a stored XSS attack now.


    1. Click `XSS stored` in the DVWA menu at the left. You’ll see a guestbook-like
    application that allows a user to save their name and a short message to the page.


    2. Instead of signing the guestbook with your name and a nice message, enter just
    your name. Then, in the Message text box, enter the XSS attack code that we want
    to store in this page’s database, `<script>alert("You''ve been hacked!");</script>`,
    as shown in [Figure 8-8](#c08.xhtml#figure8-8).


    ![Figure 8-8: Storing our malicious script in the XSS stored page in DVWA](image_fi/502000c08/f08008.png)


    Figure 8-8: Storing our malicious script in the XSS stored page in DVWA


    3. Click `Sign Guestbook`, and you’ll see the alert pop up, as shown in [Figure
    8-9](#c08.xhtml#figure8-9).


    ![Figure 8-9: Our JavaScript alert will tell every visitor, “You’ve been hacked!”](image_fi/502000c08/f08009.png)


    Figure 8-9: Our JavaScript alert will tell every visitor, “You’ve been hacked!”


    Unlike in the reflected attack, this alert will pop up every time someone visits
    the Stored Cross Site Scripting (XSS) guestbook page. You’ve used a database-driven
    web page to permanently store a malicious script in the DVWA website.


    JavaScript can do much more than pop up an alert message, though. Let’s change
    the browser’s `window.location` to redirect users to a completely different website:


    1. Load the XSS stored web page again and click `OK` to close the alert message
    pop-up.


    2. This time, after entering your name as usual, enter the following code into
    the Message text box, as shown in [Figure 8-10](#c08.xhtml#figure8-10):


    ```

    <script>window.location.href="https://www.nostarch.com/go-hck-yourself";</script>

    ```


    ![Figure 8-10: Entering a more malicious script that will redirect the user to
    a completely different web page](image_fi/502000c08/f08010alt.png)


    Figure 8-10: Entering a more malicious script that will redirect the user to a
    completely different web page


    3. Click `Sign Guestbook`, and you’ll see the alert pop-up we injected before.
    But as soon as you close the alert, you’ll be taken to [https://www.nostarch.com/go-hck-yourself/](https://www.nostarch.com/go-hck-yourself/).
    You can’t go back to the DVWA XSS stored page because every time you reload the
    page, it redirects to the *Go H\*ck Yourself* web page.


    We’ve permanently hijacked the XSS stored page so that every visitor will be redirected
    to this book’s website instead. An attacker could do the same, or worse, to an
    unprotected web application in your employer’s website, your favorite online game
    or social media app, or even your local government website. To restore the site’s
    original functionality, the site administrator would have to access the database
    and delete the stored XSS code entirely.


    To reset the database in DVWA to delete the malicious code we entered, click `Setup`
    in the DVWA menu on the left, as shown in [Figure 8-11](#c08.xhtml#figure8-11).
    Then click `Create / Reset Database`, and DVWA will reset the database to its
    original state.


    ![Figure 8-11: Clearing your stored XSS hacks](image_fi/502000c08/f08011.png)


    Figure 8-11: Clearing your stored XSS hacks


    ## Launching SQL Injection Attacks on Databases


    Injecting malicious code *into* a website was scary, but how do hackers take sensitive
    data *from* a website? In this section, you’ll learn how web hackers use Structured
    Query Language (SQL) injection attacks to steal information directly from a website’s
    database. SQL is the language used to access most databases, and a *SQL injection*
    *(SQLi)* involves inserting malicious SQL code into a web application to trick
    the application’s database into revealing private information.


    Databases contain *tables*, which look like spreadsheets of columns and rows.
    The columns are for different *fields* or pieces of information, like first name,
    last name, username, password, email address, and so on. The rows are for individual
    *records*. For example, each user in a table of users would occupy a separate
    row.


    When we access a database, we use a SQL *query*, like this one:


    ```

    SELECT password FROM users WHERE username=''Bryson''

    ```


    This query requests the `password` field from the `users` table from the row or
    rows where the `username` field is `Bryson`. We can modify the query slightly
    to ask for *all* users’ passwords:


    ```

    SELECT password FROM users WHERE username=''Bryson'' OR 1=''1''

    ```


    By adding an `OR` condition to the query, we’ve asked the database to select all
    the passwords from the `users` table. At every row, SQL will ask whether `username`
    equals `''Bryson''` or whether `1` equals `''1''` for that row. If either of these
    conditions is true, SQL will return the password for that row. Because one of
    the conditions is *always* true (1 is always equal to 1), the database will return
    *every* password in the `users` table.


    Let’s inject some SQL queries into DVWA to steal information from the website’s
    database.


    1. In your Windows 10 VM’s Edge browser, make sure DVWA Script Security is set
    to low (as shown in [Figure 8-5](#c08.xhtml#figure8-5) on page 95).


    2. Click `SQL Injection` in the DVWA menu on the left. You’ll see a user lookup
    page like the one in [Figure 8-12](#c08.xhtml#figure8-12).

