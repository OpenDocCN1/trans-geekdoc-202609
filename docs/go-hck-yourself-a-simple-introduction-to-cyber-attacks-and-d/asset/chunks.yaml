- raw: "    Meterpreter captured all of the Windows 10 user’s keystrokes, including\
    \ special keys like `<CR>` (short for *carriage return*, another name for the\
    \ ENTER key). Typing into a text file might seem like an unrealistic example,\
    \ but you can imagine instead that the user was typing their credit card number\
    \ into an online shopping site or entering their username and password to log\
    \ in to their bank’s web portal.\n\n5.  Enter `keyscan_stop` in the Meterpreter\
    \ shell to stop capturing keystrokes from the Windows computer:\n\n```\nmeterpreter\
    \ > keyscan_stop\nStopping the keystroke sniffer...\n```\n\n### Spying Through\
    \ Webcams\n\nIf logging keystrokes wasn’t creepy enough for you, viewing a victim\
    \ computer’s webcam should make you want to move to a remote island with no internet\
    \ (or at least convince you to cover your webcam with a sticky note). Connecting\
    \ a webcam to the Windows VM might not work, but even if you can’t try this attack\
    \ yourself, it works reliably against real Windows computers with webcams. To\
    \ proceed, you’ll need a webcam (the one built into your laptop or a USB webcam\
    \ attached to your desktop) and the patience to rerun the entire hack a few times\
    \ following the steps in the Warning just given.\n\n1.  Check if your webcam appears\
    \ under Devices▶Webcams on the Windows VM’s menu bar. If it does, select its name\
    \ and skip ahead to step 6. Otherwise, we’ll need to connect your webcam to the\
    \ VM.\n\n2.  Close the Windows VM and select **Power off the machine**.\n\n3.\
    \  In VirtualBox Manager, select the Windows VM and go to **Machine**▶**Settings**\
    \ or **Machine**▶**Settings**▶**Ports** (on macOS). Select **USB** in the Settings\
    \ menu and select the checkbox next to **Enable USB Controller**.\n\n4.  Restart\
    \ the Windows VM. Go to the menu bar, select **Devices**▶**Webcams** or **Devices**▶**USB**,\
    \ and select the name of your webcam.\n\n5.  Turn off the Windows VM’s Firewall\
    \ and Defender. Then run the trojan again.\n\n6.  Enter `webcam_list` at the Meterpreter\
    \ prompt in Kali to find out if the webcam is available. You should see something\
    \ like this:\n\n    ```\n    meterpreter > webcam_list\n    1: VirtualBox Webcam\
    \ - Logitech HD Webcam C310 \n    ```\n\n    My webcam is showing up as `VirtualBox\
    \ Webcam - Logitech HD Webcam C310`, for example.\n\n7.  Enter `webcam_stream`\
    \ to connect to the webcam via Meterpreter.\n\n    ```\n    meterpreter > webcam_stream\n\
    \    [*] Starting...\n    [*] Preparing player...\n    [*] Opening player at:\
    \ /home/kali/KMKiGQxa.html\n    [*] Streaming...\n    ```\n\n    Meterpreter will\
    \ open Firefox and stream video from the Windows VM’s webcam, as shown in [Figure\
    \ 6-9](#c06.xhtml#figure6-9).\n\n![Figure 6-9: The webcam stream shows me and\
    \ the bookshelf in my office.](image_fi/502000c06/f06009.png)\n\nFigure 6-9: The\
    \ webcam stream shows me and the bookshelf in my office.\n\nYou should see your\
    \ webcam’s LED light up, showing that the camera is active. Unlike the `screenshare`\
    \ and `keyscan` commands, the webcam hack lets you know someone’s spying on you.\
    \ If your webcam light is ever on when you’re not using it, run a *thorough* antivirus\
    \ scan and reboot your computer to see if the light turns off. However, don’t\
    \ rely on the webcam LED: some advanced hacks enable spying through the webcam\
    \ *without turning on* the LED. That’s why it’s important to practice the safety\
    \ measures described in the next section.\n\nTo stop streaming video from the\
    \ Windows 10 VM’s webcam, close Firefox and press CTRL\\-C in the Meterpreter\
    \ window to interrupt the `webcam_stream` command. Then grab a sticky note or\
    \ a piece of masking tape and cover the webcam on your laptop!\n\n## Defending\
    \ Against Malware\n\nAs you’ve seen in this chapter, viruses are incredibly easy\
    \ to create and distribute. Any suspicious email attachment, link, web page, app,\
    \ or video that you receive or open could contain malware waiting to be launched.\
    \ Attackers don’t even need a lot of skill; they just need to use Metasploit and\
    \ trick people into downloading the virus. Once a computer is infected, the attacks\
    \ an unethical hacker can use against it are downright frightening.\n\nYour best\
    \ defenses are the following:\n\n1.  Update software often. Update your operating\
    \ system and applications, from your word processor and web browser to your PDF\
    \ reader—at least monthly. Pick a certain day of the month, like the 1st, 15th,\
    \ or 30th, and mark your calendar to update your devices and all applications.\
    \ Think of it as another must-do task, like paying bills or mowing the lawn. Most\
    \ of the 2,000+ exploits in Kali attack older versions of software, so you’ll\
    \ be less vulnerable to an attack if you keep the latest security patches installed\
    \ for the software you use.\n\n2.  Use a firewall and antivirus software. Keep\
    \ your firewall turned on and update your antivirus software regularly. There\
    \ are several free and low-cost antivirus tools out there. Research which ones\
    \ stop the most malware and then update your antivirus tool weekly, or turn on\
    \ automatic updates, to give it the best shot at protecting you.\n\n3.  Think\
    \ before you click. Malware can be launched through infected program files, bootlegged\
    \ videos, or even Office documents and PDFs. Peer-to-peer file-sharing sites are\
    \ filled with “free” malware-infected files, waiting for unsuspecting victims.\
    \ Run VirusTotal or another virus scan on *any* files from sources you don’t trust\
    \ and don’t download suspicious or illegal files at all.\n\nThese measures won’t\
    \ make you invincible, but they’ll help you avoid most malware-based attacks,\
    \ and they’ll make you a difficult enough target that most hackers will move on\
    \ to other victims. Most attacks rely on the concept of *low-hanging fruit*—easy\
    \ opportunities for a malicious hacker to break into your system, such as out-of-date\
    \ software, a disabled firewall or antivirus program, or a user who opens links\
    \ or downloads files without scanning them first. Unfortunately, there is enough\
    \ low-hanging fruit to keep hackers busy, so taking a few smart precautions like\
    \ these can keep you safe from more than 90 percent of attacks.\n\nOh . . . and\
    \ cover that webcam when you’re not using it!\n\n## The Takeaway\n\nIn this chapter,\
    \ you learned how attackers create malware and how easily an unprotected computer\
    \ can be infected. Using the Metasploit framework, you created a Meterpreter remote-access\
    \ trojan (RAT), a special kind of malware that gives an attacker control of your\
    \ computer from anywhere in the world as long as they have an internet connection.\
    \ You shared your malware across a network by turning on the Apache web server\
    \ in your Kali Linux VM and placing the trojan in a shared web folder. Then you\
    \ downloaded the malware onto your Windows VM and opened the file to infect your\
    \ machine.\n\nNext, you took control of the Windows VM from the Meterpreter remote\
    \ shell in Kali. You learned how an attacker can upload and download files, steal\
    \ screenshots, log keystrokes, and spy through a webcam using only a command or\
    \ two. For most of the attacks, your Windows VM didn’t even show it was being\
    \ hacked.\n\nFinally, you learned how to prevent many malware-based attacks. Avoiding\
    \ suspicious downloads, links, and websites; keeping your firewall and antivirus\
    \ software turned on and current; and regularly updating your operating system\
    \ and applications are important precautions. If you employ multiple layers of\
    \ security, you are a much more difficult target, and most attackers will move\
    \ on to easier prey.\n\nIn the next chapter, we’ll take our skills one level higher\
    \ and see how unethical hackers use Meterpreter and other tools to steal and crack\
    \ passwords.\n\n# 7  \n\nStealing and Cracking Passwords\n\n![](image_fi/book_art/chapterart.png)"
