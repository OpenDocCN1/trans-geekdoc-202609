    \ 文件](img/f08001.png)\n    图 8-1：导入 `Metasploitable2-gohack.ova` 文件到 VirtualBox\n\
    3. 在 VirtualBox VM 管理器中选择 Metasploitable2 VM 并点击 **设置**。\n4. 转到 **网络** 选项卡并确保启用网络适配器框已勾选，并且显示附加到：`NAT\
    \ Network` 和名称：`PublicNAT`，与我们的其他虚拟机一样。正确的设置显示在 图 8-2 中。\n    ![图 8-2：确保 Metasploitable\
    \ VM 已连接到 PublicNAT 网络](img/f08002.png)\n    图 8-2：确保 Metasploitable VM 已连接到 `PublicNAT`\
    \ 网络\n5. 点击 **确定** 保存这些网络设置。你的新 Metasploitable VM 现在已准备好运行！\n6. 在 VirtualBox 管理器中选择\
