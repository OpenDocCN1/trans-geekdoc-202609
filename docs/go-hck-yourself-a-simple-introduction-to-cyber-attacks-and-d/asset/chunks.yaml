  trans: "\n![图 5-4：向你的 SET 克隆站点输入虚假信息；切勿在钓鱼网站上输入你的真实用户名和密码。](img/f05004.png)\n\n\
    图 5-4：向你的 SET 克隆站点输入虚假信息；切勿在钓鱼网站上输入你的真实用户名和密码。\n\n一旦你提交虚假的登录凭据，`SET` 将把你的浏览器重定向到真正的\
    \ Twitter 网站，`https://twitter.com/`。你可以通过地址栏判断这是真实的网站，在那里你会看到锁形图标。`SET` 将受害者带到真实的登录页面，让他们以为自己输入的登录信息有误。这一次，他们在不知攻击者已窃取其凭据的情况下登录了真实的网站。\n\
    \n现在打开正在运行 `SET` 的终端窗口。如果你的钓鱼网站工作正常，你会看到一屏幕被提交的网页表单数据。如有需要向上滚动，你会看到你输入的用户名和密码：\n\
    \n```\n[*] WE GOT A HIT! Printing the output:\n...\nPOSSIBLE USERNAME FIELD FOUND:\
    \ session[username_or_email]=GeorgeJetson\nPOSSIBLE PASSWORD FIELD FOUND: session[password]=Jane!!!\n\
    ```\n\n如果 `SET` 没有检索到登录信息，再次填写克隆的表单。如果仍然找不到你输入的用户名和密码，请关闭 `SET` 并尝试克隆另一个站点。\n\n\
    只要 `SET` 正在运行，你就可以通过任何可以访问你的 Kali VM 网络的浏览器访问你的 Kali IP 地址来向你的表单提交用户名和密码。这意味着你可以启动你的\
    \ Windows VM，假装自己是浏览到 Kali VM IP 地址（10.0.9.4 或类似）的钓鱼受害者，并向假页面输入用户名和密码。\n\n###\
    \ 创建钓鱼邮件\n\n钓鱼攻击的最后一步是创建并发送一封包含指向你的钓鱼站点 IP 地址链接的钓鱼邮件。记住，`SET` 的 Site Cloner 在你的\
    \ Kali VM 上运行着 Twitter 登录页面的虚假版本，因此它使用你的 Kali VM 的 IP 地址。在你的 Kali 或 Windows VM\
    \ 中，登录你的电子邮件账户并撰写一封新邮件。你的钓鱼邮件可以简单到这样：\n\n> `Subject: Unusual account activity`\n\
    > \n> `Message: Someone attempted to log in to your Twitter account from Budapest,\
    \ Hungary. If this wasn't you, please log in to your account and check your Security\
    \ settings: http://10.0.9.4.`\n\n在 `SET` 运行时，将邮件发送给自己并在 Kali 或 Windows 10 VM 上打开它。点击链接应该会带你到克隆的钓鱼站点！\n\
    \n然而，大多数人可能不会点击邮件中的链接。邮件看起来不像来自 Twitter 的常规消息，而且链接显示的是 IP 地址而不是 Twitter URL。为了制造更具说服力的钓鱼诈骗，攻击者可能会复制一封来自\
    \ Twitter 的真实邮件，该邮件使用 Twitter 的标志和样式，然后将其粘贴到新消息中。然后他们会更改文本和链接，试图说服人们点击进入克隆站点。图\
    \ 5-5 显示了我制作的一个示例。\n\n![图 5-5：我通过更改文本和超链接，将来自 Twitter 的真实邮件转换为钓鱼邮件。](img/f05005.png)\n\
    \n图 5-5：我通过更改文本和超链接，将来自 Twitter 的真实邮件转换为钓鱼邮件。\n\n我让它看起来像有人试图从朝鲜入侵用户的账户，以促使他们点击链接检查其“Security\
    \ settings”。接下来，我为文本“Security settings”添加了一个超链接，将用户带到我的克隆登录页面。在大多数电子邮件程序中，你可以通过突出显示要变成链接的文本，点击链条图标（在\
    \ 图 5-5 中框出），然后输入链接地址来插入超链接。随着可疑的 IP 地址隐藏在“Security settings”文本后面，人们更有可能点击进入钓鱼站点。\n\
    \n现在你了解了钓鱼攻击，让我们看看如何防范它们。\n\n## 防范钓鱼攻击\n\n你只需几个简单的提示就能保护自己免受电子邮件诈骗：\n\n* 将鼠标悬停在电子邮件中的链接上（不要点击！）以查看链接地址是否可疑，因为它拼写错误或异常长/数字。当你这样做时，地址通常会出现在你的浏览器或电子邮件程序屏幕底部或附近。（你也可以使用\
    \ VirusTotal 检查链接地址是否存在恶意软件，就像我们在第 4 章中所做的那样。）\n* 检查电子邮件的 `From:` 和 `To:` 字段，以确保两者都是真实的。注意发送者地址中是否有拼写错误或不同的域名，例如\
    \ `gmail.com` 而不是 `yourbank.com`。\n* 如果有人要求你提供个人信息，请仔细考虑是谁在索取、索取什么以及为什么需要这些信息。\n\
    * 如果你对电子邮件的来源 ever 不确定，不要点击或打开任何内容。使用真实的电话号码（而不是邮件中提供的号码）致电该人或公司，以核实任何重要交易或紧急问题。\n\
    \n如果你怀疑一封电子邮件是假的，请打开一个单独的网页浏览器窗口，通过输入真实的 URL 或在线搜索企业名称来访问真实网站。再次检查地址栏，确保 URL 是你所期望的。即便如此，只有在网站安全时才在登录页面输入用户名和密码。你可以通过\
    \ URL 以 `https://` 开头且浏览器地址栏中出现安全网站锁形符号来判断网站是否安全。\n\n## 要点\n\n在本章中，你了解到社会工程师利用人类的情绪对受害者施加影响，诱使他们在现实中和在线上做出错误选择。你了解了最常见的在线社会工程攻击——钓鱼。\n\
    \n为了了解钓鱼攻击的简易性和有效性，你使用 Kali Linux 中的社会工程工具包 `SET` 克隆了一个登录页面，从而能够收集毫无防备用户的凭据。你创建了一封链接到克隆页面的钓鱼邮件，并看到了攻击者如何通过先使用真实邮件，然后更改文本和链接来创建更具说服力的邮件。\n\
    \n你学会了通过仔细查看任何要求你点击链接、打开文档或进行非常规操作的电子邮件中的 `From:` 和 `To:` 字段来保护自己免受钓鱼攻击。你还学会了通过将鼠标悬停在每个链接上并检查\
    \ URL 来检查链接。奇怪或拼写错误的网址，以及 URL 中异常长或数字的 IP 地址，都可能是该地址来自钓鱼攻击的线索。遇到疑问时，不要点击电子邮件中的任何链接。相反，打开一个单独的浏览器窗口，输入你拥有账户的真实网站的域名，并直接登录。\n\
    \n在下一章中，你将为你的黑客工具库添加另一项重要工具：恶意软件。恶意软件将允许你远程接管另一台计算机，以便窃取文件、记录击键，甚至访问用户的网络摄像头。\n\
    \n# 6 使用恶意软件进行远程入侵\n\n![](img/chapterart.png)\n\n在本章中，你将了解攻击者如何通过互联网使用恶意软件从世界任何地方感染和控制各种计算设备。*恶意软件*\
    \ 是 *恶意软件* 的缩写，是指任何旨在窃取或损坏数据或破坏计算机系统或用户的软件。\n\n如果攻击者能骗你打开恶意附件、视频或应用，他们就可以控制你的计算机、智能手机或其他互联网连接设备。为了保护自己，你需要了解黑帽黑客创建病毒并感染你的计算机是多么容易。一旦设备被感染，攻击者通常可以看到\
    \ *一切*——包括你的文件、你的击键、你的屏幕，甚至你的网络摄像头看到的内容！\n"
