    \ drive the virtual car, click in the CANBus Control Panel window and then use\
    \ your keyboard to send commands. Available commands are listed in [Table 10-1](#c10.xhtml#table10-1).\
    \ Press the up arrow to accelerate, use the left and right arrows to control the\
    \ turn signals, and so on.\n\nTable 10-1: Keyboard Controls for the CANBus Control\
    \ Panel\n\n| **Function** || **Key(s)** |\n| --- | --- |\n| **Accelerate** ||\
    \ Press and hold the up arrow (↑) |\n| --- | --- |\n| **Signal a left or right\
    \ turn** || Press and hold the left or right arrow (←/→) |\n| **Unlock front-left\
    \ or front-right door** || right\\-SHIFT\\-A or right-SHIFT\\-B |\n| **Unlock\
    \ back-left or back-right door** || right\\-SHIFT\\-X or right-SHIFT\\-Y |\n|\
    \ **Lock all doors** || Hold right\\-SHIFT + tap left\\-SHIFT |\n| **Unlock all\
    \ doors** || Hold left\\-SHIFT + tap right\\-SHIFT |\n\nThe controller app is\
    \ the only way to interact with the `VCAN`—unless we hack it.\n\n## Hacking the\
    \ Car\n\nOur car-hacking adventure will follow the same steps you’d use to test\
    \ the security of most IoT devices:\n\n1. Use a program to view and record traffic\
    \ on the `vcan0` network between the controller app and the dashboard. This kind\
    \ of program is called a `packet sniffer` because messages sent on the network\
    \ are called `packets`.\n2. Identify what network packets and commands control\
    \ what car systems or functions.\n3. Take control of the car by resending the\
    \ packets you’ve captured back over the `vcan0` network or by writing your own\
    \ commands from your terminal.\n\n### Viewing Packets\n\nWe’ll use `cansniffer`,\
    \ the packet sniffer built into `can-utils`, to listen to our simulated car network.\n\
    \n1. In your terminal window, launch `cansniffer` with the following command:\n\
    ```\nkali@kali:~/ICSim$ cansniffer -c vcan0\n```\n2. Make the terminal window\
    \ tall and narrow (as shown in [Figure 10-3](#c10.xhtml#figure10-3)) to make the\
    \ `cansniffer` messages easier to see. You may also need to reduce the font size\
    \ by pressing CTRL and − a few times.\n\n3. Click in the CANBus Control Panel\
    \ window and send some commands to the virtual car. Try accelerating, using the\
    \ turn signals, and so on.\n\nThe `cansniffer` tool intercepts packets being sent\
    \ on `vcan0` between the controller app and the dashboard and displays them in\
    \ the terminal window. Each line in the window represents one packet. The network\
    \ transmits several hundred packets per second, so they go by quickly.\n\nLet’s\
    \ look at an example packet to see what information we can find. Here’s one of\
    \ the packets shown in [Figure 10-3](#c10.xhtml#figure10-3):\n```\n10.204188 2244\
    \ 300 00 00 01 06 4.....\n```\n\n![Figure 10-3: The cansniffer packet sniffer\
    \ shows messages on our vcan0 network.](image_fi/502000c10/f10003.png)\n\nFigure\
    \ 10-3: The `cansniffer` packet sniffer shows messages on our vcan0 network.\n\
    \nThe first column is a `timestamp` 1 that represents when the packet was sent.\
    \ The second column 2 is the ID number of the system a message is being sent to\
    \ or from. As we’ll discover, CAN ID# `244` represents the speedometer. The third\
    \ column 3 is the `CAN` message data, represented by hexadecimal values, and the\
    \ fourth column 4 contains the same data represented in printable characters.\n\
    \nExperienced hackers know how to analyze the traffic picked up by a packet sniffer\
    \ to determine what different packets mean. This takes practice and patience.\
    \ For now, try accelerating a few times by pressing the up arrow in the controller\
    \ app while watching for ID# `244` in the terminal window. Look for changing values\
    \ in the message data column as you speed up and slow down. Recognizing this pattern\
    \ is a clue that ID #`244` refers to the speedometer.\n\nNow press the turn signals\
    \ (the left and right arrows) and watch for ID# `188`. It should appear when you\
    \ touch the turn signals and disappear a few moments after you turn them off.\
    \ Lock and unlock the doors using the left and right SHIFT keys, or the right\
    \ SHIFT key plus X, Y, A, and B, and watch what changes in the data next to ID#\
    \ `19B`. The row for `19B` should appear only for a moment when you’re locking\
    \ or unlocking doors.\n"
  trans: "\n## 安装 ICSim\n\n对于本次黑客攻击，我们将安装一个名为 `Instrument Cluster Simulator (ICSim)`\
    \ 的软件包，这是一个虚拟仪表板，让你可以看到并与速度表、转向信号和车门锁交互，就像在真正的车辆中一样。Craig Smith（又名 zombieCraig）和\
    \ OpenGarages 团队构建了 `ICSim`，以帮助黑客和研究人员安全、合乎道德地学习如何操作汽车网络，而不会损坏或摧毁真正的车辆或无辜的行人。\n\
    \n1. 打开一个终端窗口并更新 Kali 的软件包列表：\n```\nkali@kali:~$ sudo apt update\n```\n2. 现在通过输入以下命令安装\
    \ `ICSim` 的依赖项：\n```\nkali@kali:~$ sudo apt install libsdl2-dev libsdl2-image-dev\
    \ can-utils\n```\n请注意，两个 `libsdl2` 包都是用小写字母 `L` 后跟数字 2 拼写的。\n3. 按如下方式安装 `ICSim`：\n\
    ```\nkali@kali:~$ cd ~ \nkali@kali:~$ git clone https://github.com/zombieCraig/ICSim.git\
    \ \n```\n4. 在你的机器上设置 `can-utils`：\n```\nkali@kali:~$ cd ~\nkali@kali:~$ git clone\
    \ https://github.com/linux-can/can-utils\nkali@kali:~$ cd can-utils\nkali@kali:~/can-utils$\
    \ make\nkali@kali:~/can-utils$ sudo make install\n```\n5. 使用以下命令设置 `ICSim` 仪表板模拟器软件：\n\
    ```\nkali@kali:~/can-utils$ cp lib.o ~/ICSim\nkali@kali:~/can-utils$ cd ~/ICSim\n\
    kali@kali:~/ICSim$ make clean\nkali@kali:~/ICSim$ make\n```\n现在运行我们的虚拟汽车仪表板并开始黑客攻击！\n\
    \n## 准备虚拟 CAN 总线网络\n\n汽车的网络被称为 `CAN bus`，或简称为 `CAN`。`CAN bus` 自 1990 年代以来已在大多数汽车中使用，用于控制各种系统和传感器，如转向和制动、收音机、空调和娱乐中心。你刚刚安装的\
    \ `ICSim` 软件创建了一个 `virtual CAN (VCAN)` 总线网络，我们将学习如何攻击它。我们现在将创建该网络并完成你的汽车黑客环境的设置。\n\
    \n1. 要设置 `VCAN`，请在 `ICSim` 文件夹内的终端中输入此命令：\n```\nkali@kali:~/ICSim$ sh setup_vcan.sh\n\
    ```\n2. 通过在终端中输入 `ip addr` 确保 `VCAN` 已正确设置。你应该会看到你的 IP 地址以及一个名为 `vcan0` 的新网络。\n\
    ```\nkali@kali:~/ICSim$ ip addr\n--snip--\n3: vcan0: <NOARP,UP,LOWER_UP> mtu 72\
    \ qdisc noqueue state UNKNOWN group default qlen 1000 link/can\n```\n3. 在终端中输入以下内容，告诉它首先使用我们刚刚创建的\
    \ `vcan0` 网络运行 `ICSim`，然后等待我们的命令：\n```\nkali@kali:~/ICSim$ ./icsim vcan0 &\n```\n\
    你应该会看到一个模拟仪表板，如 图 10-1 所示。\n\n![图 10-1：ICSIM 程序显示了一个模拟的汽车仪表盘，带有速度表、转向信号等！](img/f10001.png)\n\
    \n图 10-1：ICSIM 程序显示了一个模拟的汽车仪表盘，带有速度表、转向信号等！\n\n4. 在 `vcan0` 上启动控制器应用程序：\n```\n\
    kali@kali:~/ICSim$ ./controls vcan0 &\n```\nCANBus 控制面板窗口应该打开。它看起来很像一个电子游戏控制器。\n\
    \n5. 通过点击窗口的任何角落并拖动来调整控制面板的大小，以便 `ICSim` 窗口可见。\n\n6. 右键单击控制面板窗口的顶部栏并选择 **始终置顶**，如\
    \ 图 10-2 所示。\n\n![图 10-2：保持控制器应用程序可见且易于访问](img/f10002.png)\n\n图 10-2：保持控制器应用程序可见且易于访问\n\
    \n要驾驶虚拟汽车，请在 CANBus 控制面板窗口中单击，然后使用键盘发送命令。可用命令列在 表 10-1 中。按下向上箭头加速，使用左右箭头控制转向信号，等等。\n\
    \n表 10-1：CANBus 控制面板的键盘控制\n\n| **功能** || **键** |\n| --- | --- |\n| **加速** || 按住向上箭头\
    \ (↑) |\n| --- | --- |\n| **指示左转或右转** || 按住左箭头或右箭头 (←/→) |\n| **解锁前左门或前右门** ||\
    \ right\\-SHIFT\\-A 或 right-SHIFT\\-B |\n| **解锁后左门或后右门** || right\\-SHIFT\\-X\
    \ 或 right-SHIFT\\-Y |\n| **锁住所有车门** || 按住 right\\-SHIFT + 点按 left\\-SHIFT |\n\
    | **解锁所有车门** || 按住 left\\-SHIFT + 点按 right\\-SHIFT |\n\n控制器应用程序是与 `VCAN` 交互的唯一方式——除非我们入侵它。\n\
    \n## 黑客攻击汽车\n\n我们的汽车黑客冒险将遵循与测试大多数物联网设备安全性相同的步骤：\n\n1. 使用程序查看并记录控制器应用程序与仪表板之间在\
    \ `vcan0` 网络上的流量。这种程序称为 `packet sniffer`，因为网络上传送的消息称为 `packets`。\n2. 识别哪些网络数据包和命令控制哪些汽车系统或功能。\n\
    3. 通过重新发送你捕获的数据包回 `vcan0` 网络，或通过从终端编写自己的命令来控制汽车。\n\n### 查看数据包\n\n我们将使用 `cansniffer`，这是内置于\
    \ `can-utils` 中的数据包嗅探器，来监听我们的模拟汽车网络。\n\n1. 在你的终端窗口中，使用以下命令启动 `cansniffer`：\n```\n\
    kali@kali:~/ICSim$ cansniffer -c vcan0\n```\n2. 使终端窗口高而窄（如 图 10-3 所示），以便更轻松地查看\
    \ `cansniffer` 消息。你可能还需要通过按 CTRL 和 − 几次来减小字体大小。\n\n3. 在 CANBus 控制面板窗口中单击并向虚拟汽车发送一些命令。尝试加速、使用转向信号等。\n\
    \n`cansniffer` 工具拦截在控制器应用程序与仪表板之间在 `vcan0` 上发送的数据包并在终端窗口中显示它们。窗口中的每一行代表一个数据包。网络每秒传输数百个数据包，因此它们很快就过去了。\n\
    \n让我们看一个示例数据包，看看我们可以找到什么信息。以下是 图 10-3 中显示的数据包之一：\n```\n10.204188 2244 300 00 00\
    \ 01 06 4.....\n```\n\n![图 10-3：cansniffer 数据包嗅探器显示我们 vcan0 网络上的消息。](img/f10003.png)\n\
    \n图 10-3：`cansniffer` 数据包嗅探器显示我们 vcan0 网络上的消息。\n\n第一列是 `timestamp` 1，表示数据包发送的时间。第二列\
    \ 2 是消息发送到或来自的系统的 ID 号。正如我们将发现的，CAN ID# `244` 代表速度表。第三列 3 是 `CAN` 消息数据，以十六进制值表示，第四列\
    \ 4 包含以可打印字符表示的相同数据。\n\n有经验的黑客知道如何分析数据包嗅探器捕获的流量以确定不同数据包的含义。这需要练习和耐心。现在，尝试在控制器应用程序中按向上箭头几次加速，同时在终端窗口中查找\
    \ ID# `244`。在加速和减速时查找消息数据列中的变化值。识别这种模式是 ID #`244` 指速度表的线索。\n\n现在按下转向信号（左右箭头）并查找\
    \ ID# `188`。当你触摸转向信号时它应该出现，在你关闭它们几分钟后消失。使用左右 SHIFT 键，或右 SHIFT 键加上 X、Y、A 和 B 来锁定和解锁车门，并观察\
    \ ID# `19B` 旁边的数据发生了什么变化。`19B` 的行只应在你锁定或解锁车门时出现一瞬间。\n"
