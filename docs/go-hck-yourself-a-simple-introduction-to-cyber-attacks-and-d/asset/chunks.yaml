    \ log dump_contacts     Get contacts list dump_sms          Get sms messages geolocate\
    \         Get current lat-long using geolocation hide_app_icon     Hide the app\
    \ icon from the launcher interval_collect  Manage interval collection capabilities\
    \ send_sms          Sends SMS from target session set_audio_mode    Set Ringer\
    \ Mode sqlite_query      Query a SQLite database from storage wakelock       \
    \   Enable/Disable Wakelock wlan_geolocate    Get current lat-long using WLAN\
    \ information\nApplication Controller Commands\n===============================\
    \ Command        Description -------        ----------- app_install    Request\
    \ to install apk file app_list       List installed apps in the device app_run\
    \        Start Main Activity for package name app_uninstall  Request to uninstall\
    \ application\n```\n\n我们首先要做的是防止 Android 设备进入睡眠。请在 `Meterpreter` 提示符下输入以下命令：\n\
    \n```\nmeterpreter > wakelock -w\n```\n\n`Meterpreter` 会回复 `Wakelock was acquired`，如果你的\
    \ Android 设备之前已进入睡眠或变为黑屏，屏幕将唤醒并且设备会保持唤醒状态，直到你释放 `wakelock`。\n\n最容易运行 `Meterpreter`\
    \ 命令并查看其效果的方法是同时在屏幕上显示 Android 和 Kali 虚拟机。（这种方法也有助于在攻击者入侵设备时看到用户所见的内容。）如果您有双显示器，请将\
    \ Kali 放在一个显示器上，Android 放在另一个显示器上。如果您只有一个屏幕，请尝试将 Kali 与 Android 并排放置，以便在操作时可以看到两者。\n\
    \n### 运行应用\n\n一旦攻击者控制了移动设备，他们就可以远程启动任何想要的应用。为了了解其工作原理，让我们列出用户在其设备上安装的应用。在 `Meterpreter`\
    \ 终端窗口中输入命令 `app_list`。Android 将列出智能手机上安装的每个应用，包括应用图标上显示的名称和该应用的包统一资源标识符（`URI`）字符串。*URI\
    \ 字符串*是我们识别 Android 设备上各种资源的方式。例如，你可能会看到 YouTube 应用列出如下：\n\n```\n  YouTube  com.google.android.youtube\
    \  false  true\n```\n\n行末最后两个条目告诉你该应用是否正在运行以及它是否是操作系统安装的系统应用。这里，`false` 值告诉我们\
    \ YouTube 应用当前未运行，而 `true` 值表示它是作为 Android 操作系统的一部分安装的标准应用。\n\n现在我们知道 YouTube\
    \ 已安装在 Android 设备上，我们可以使用 `app_run` 命令和 YouTube 的包 `URI` 字符串从 `Meterpreter` 启动它。输入以下内容：\n\
    \n```\nmeterpreter > app_run com.google.android.youtube\n```\n\n你会在 Android 虚拟机中看到\
    \ YouTube 应用打开！切回你的 Android 虚拟机并搜索视频“Bryson Payne TED Talk”。Android 虚拟机上的 YouTube\
    \ 应用将调出该视频（不过你可能无法通过虚拟机听到音频，因为 VirtualBox 的驱动程序并不总是适用于智能手机和平板电脑操作系统）。\n\n你可以通过这种方式在被感染的智能手机或平板电脑上运行\
    \ *任何应用*，完全不需要用户的许可或交互。尝试运行更多应用，例如设置（`com.android.settings`）或电话应用（`com.android.dialer`）。\n\
    \n你也可以请求卸载应用的权限，但用户会收到提醒。尝试以下命令：\n\n```\nmeterpreter > app_uninstall com.google.android.gm\n\
    ```\n\n你的 Android 虚拟机会显示一个弹出窗口询问是否要卸载 Gmail，如 图 9-6 所示。点击 **Cancel** 以保留设备上的 Gmail\
    \ 应用。新款 Android 设备的[content]\n6. 在 Android 屏幕底部黑色条带中点击返回按钮（左箭头），你会看到名为 `MainActivity`\
    \ 的 `Meterpreter` 木马应用请求的权限列表：设置、图片、视频、联系人、GPS、麦克风、通话记录、短信、SD 卡访问……几乎是智能手机允许的每项权限！在权限窗口右下角点击\
    \ **Next**，然后点击 **Install**。如果收到 Google Play Protect 警告，点击 **Install Anyway**。\n\
    7. 在 Android 虚拟机屏幕底部点击主屏幕按钮（中间的圆圈）。然后点击并向上拖动屏幕以显示已安装的应用。点击 `MainActivity` 图标启动木马应用。\n\
    8. 切回你的 Kali 虚拟机，你会看到 `Meterpreter` 中已打开一个新的会话。\n\n我们 Android 设备上的木马已向 Kali 汇报并等待命令。让我们看看接管控制后能做什么。\n\
