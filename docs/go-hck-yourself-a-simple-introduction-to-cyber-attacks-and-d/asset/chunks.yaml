    \ VM 的菜单栏并选择 **查看**▶**虚拟屏幕 1**▶**缩放至 200%**（或适合你屏幕的其他值）。\n7. 输入用户名 `msfadmin`\
    \ 和密码 `msfadmin`。在 Metasploitable 的终端窗口中输入时密码不会显示，但如果输入正确，提示符将从登录变为如下所示的 shell\
    \ 提示符：\n```\nmsfadmin@metasploitable:~$\n```\n8. 输入此命令：\n```\nmsfadmin@metasploitable:~$\
    \ ip a\n```\nMetasploitable 将回复其 IP 地址（在我这里是 `10.0.9.8`）：\n```\n--snip--\n2: eth0:\
    \ <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc pfifo_fast qlen 1000 link/ether\
    \ 08:00:27:11:23:67 brd ff:ff:ff:ff:ff:ff inet 1 10.0.9.8/24 brd 10.0.9.255 scope\
    \ global eth0 --snip--\n```\n请注意 IP 地址。你需要它从其他虚拟机浏览到 Metasploitable VM 的 Web 服务器。\n\
    \n## 从浏览器进行 Web 入侵\n\nWeb 入侵非常常见，因为它对攻击者来说回报丰厚（记住，对 Web 服务器的成功攻击一次可获得 *数百万* 用户的信息），Web\
    \ 服务器始终在线并连接到互联网，而且攻击者只需一个 Web 浏览器即可操作。为了演示其工作原理，我们将从 Windows 10 VM 中的 Edge 浏览器入侵\
    \ Metasploitable 服务器。\n\n在 VirtualBox 管理器中启动你的 Windows 10 VM。使用凭据 `IEUser` 和 `Passw0rd!`\
    \ 登录。打开 Edge 浏览器（任务栏上的蓝色 *e* 旋涡图标）并在地址栏中输入你的 Metasploitable VM 的 IP 地址。你将看到 图\
    \ 8-3 所示的 Metasploitable 2 主页。\n![图 8-3：从你的 Windows 10 VM 输入你的 Metasploitable\
    \ VM 的 IP 地址以查看此主页。](img/f08003.png)\n图 8-3：从你的 Windows 10 VM 输入你的 Metasploitable\
    \ VM 的 IP 地址以查看此主页。\n\nMetasploitable 2 包含五个存在漏洞的 Web 应用程序，但我们将只关注其中一个：`DVWA`，即\
    \ Darn Vulnerable Web App。这个故意存在漏洞的开源 Web 应用程序旨在帮助 Web 开发人员和安全专业人员学习基本攻击，以及如何保护\
    \ Web 应用程序免受攻击。`DVWA` 具有不同的漏洞等级，以便用户可以尝试攻击具有不同安全程度的应用程序。我们将安全等级设置为低，以模拟没有额外安全性的\
    \ Web 应用程序。\n1. 点击 Metasploitable 2 主页上的 **DVWA** 链接。你将看到应用程序的登录屏幕，如 图 8-4 所示。\n\
    2. 输入 `admin` 作为用户名和 `password` 作为密码以访问 `DVWA`。\n    ![图 8-4：带有我们凭据的 DVWA 登录屏幕](img/f08004.png)\n\
    \    图 8-4：`DVWA` 登录屏幕，显示我们的凭据\n3. 在左侧点击 **DVWA 安全**。\n4. 在脚本安全部分下，将安全等级设置为 **低**\
    \ 并点击 **提交**，如 图 8-5 所示。\n    ![图 8-5：设置 DVWA 脚本安全等级为低](img/f08005.png)\n    图\
    \ 8-5：设置 `DVWA` 脚本安全等级为低\n\n现在我们准备在 `DVWA` 上尝试两种 Web 攻击：跨站脚本攻击和 SQL 注入攻击。\n\n\
    ### 启动跨站脚本攻击\n\n在 *跨站脚本 (XSS) 攻击* 中，黑客通过用于常规文本输入的字段（如登录表单或搜索字段）将恶意代码输入到 Web 页面中。XSS\
    \ 攻击也称为 *代码注入* 攻击，因为黑客能够输入或 *注入* 自己的代码到 Web 应用程序中。我们将使用两种 Web 语言——JavaScript 和超文本标记语言\
    \ (HTML)——向 `DVWA` 注入脚本。\n\n要测试 Web 应用程序是否存在 XSS 漏洞，你只需要一个 JavaScript 命令：\n```\n\
    alert(\"You've been hacked!\");\n```\n该命令会弹出一个警告框，显示“你已被入侵！”为了将其注入到 Web 页面中，我们用适当的\
    \ HTML 标签 `<script>` 和 `</script>` 包裹 JavaScript 代码，如下所示：\n```\n<script>alert(\"\
    You've been hacked!\");</script>\n```\nHTML `<script>` 标签告诉 Web 页面一个 *脚本*（一段简短的代码），通常是\
    \ JavaScript，开始了。`</script>` 标签称为闭合标签，它让 Web 页面知道脚本代码已结束。\n\n#### 反射型跨站脚本\n\n"
