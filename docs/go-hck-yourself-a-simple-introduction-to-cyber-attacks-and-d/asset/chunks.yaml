    ![图 9-9：在 Meterpreter 中关闭铃声音量后，用户无法从设置屏幕将其重新打开！](img/f09009.png)


    图 9-9：在 Meterpreter 中关闭铃声音量后，用户无法从设置屏幕将其重新打开！


    尝试将铃声音量滑块向右或向左滑动。你做不到！Meterpreter 已通过打开“请勿打扰”模式锁定了铃声音量（类似于在某些智能手机上滑动静音开关）。用户必须在设置下找到“请勿打扰”并将其关闭，才能重新控制智能手机的铃声音量。


    还有一个用户无法覆盖的更改。我们可以做的。你可能已经想过，*如果我看到一个我不认识的应用，比如 `MainActivity`，我可能会删除它*。所以让我们隐藏
    `MainActivity` 应用图标，使用户更难删除我们的特洛伊木马应用。


    在 Meterpreter 中，输入以下命令以从用户的已安装应用列表中隐藏 `MainActivity` 特洛伊木马应用：


    ```

    meterpreter > hide_app_icon

    [*] Activity MainActivity was hidden

    ```


    切换回你的 Android 虚拟机，点击主屏幕按钮，然后向上滑动以显示你的应用。`MainActivity` 应用将从列表中消失，如 图 9-10 所示。


    ![图 9-10：从用户屏幕隐藏我们的 MainActivity 应用图标](img/f09010.png)


    图 9-10：从用户屏幕隐藏我们的 MainActivity 应用图标


    通过隐藏应用图标，我们使用户难以卸载特洛伊木马应用。如果攻击者在最初就隐藏了应用图标，用户可能甚至不知道特洛伊木马应用已被安装！然而，即使看不到它，用户仍然可以卸载特洛伊木马应用。前往
    **设置**▶**应用信息**，点击 `MainActivity`，然后点击 **卸载**。请注意，停止或卸载该应用会关闭 Kali VM 中的 Meterpreter
    会话。要重新安装特洛伊木马应用，请前往 Android 中的 `Downloads` 文件夹并点击 `CoolGame.apk` 文件，就像我们之前做的那样。


    ## 防御恶意应用


    为了保护自己免受恶意应用的侵害，请谨慎选择允许安装到智能手机上的应用。简而言之，安装前请三思！在你的 Android 设备上使用 Google Play Protect，并将每个安全弹出窗口视为重新考虑你正在做的事情的机会。更好的是，不要通过网络或
    Google Play 商店、Apple 的 App Store（如果你使用的是 iPhone）或你智能手机制造商的商店以外的渠道下载应用。


    然而，恶意应用也可能进入官方应用商店。这就是为什么在安装应用时阅读其请求的权限很重要。一个游戏或简单应用不应该需要访问你的联系人、通话记录或短信权限，除了像
    *Pokémon Go* 这样的增强现实或基于位置的应用外，应用也不应要求你的位置。如果一个应用请求的权限比你认为它需要的更多，请删除它并找到一个用更少权限就能满足你需求的应用。同样，如果你已安装的应用
    ever 请求额外权限——尤其是请求超级用户访问权限——你可以取消请求甚至删除该应用。你 *永远* 不必给予应用比你愿意提供的更多权限，而且大多数应用在没有获得广泛权限的情况下也能完美运行。


    如果你发现智能手机上打开了你没有打开的应用（就像我们使用 Meterpreter 在 Android VM 上打开 YouTube 时那样），请完全关闭智能手机（不要只是关闭屏幕）。同时按住手机侧面或顶部的电源按钮和音量上按钮数秒，直到屏幕变黑（这适用于大多数
    Android 设备），或使用另一台设备搜索如何重新启动或重置你的特定设备。如果你在智能手机或平板电脑上发现任何可疑活动，安装安全应用也是个好主意。大多数移动设备都有免费或低成本的防病毒应用，可以检测恶意进程或通信，如果你的智能手机通过应用被黑客入侵。


    最后，就像在你的台式机或笔记本电脑上一样，不要点击电子邮件或短信中的可疑链接。你可以使用 VirusTotal 通过复制粘贴来检查大多数链接，就像在台式机上一样，但在智能手机上，你需要更加小心地点击恶意链接。请记住，如果攻击者能够骗你点击恶意链接或安装恶意应用，他们可以访问大量个人信息（甚至跟踪你的位置！）。因此，请告诉你的朋友、家人和其他你关心的人，对通过短信或电子邮件收到的任何链接保持怀疑，并在安装应用之前三思，尤其是来自未知来源的应用。


    ## 总结


    在本章中，你创建了一个 Android 虚拟机，它看起来和运作方式都与真正的 Android 智能手机或平板电脑一样。你使用 Metasploit 为 Android
    创建了一个 Meterpreter 远程访问特洛伊木马，几乎与你在第 6 章中为 Windows 10 所做的完全相同，并且你在 Android VM 上安装并启动了该特洛伊木马。一旦你控制了
    Android 设备，你就看到了攻击者如何运行应用、窃取联系人、上传和下载文件、劫持你的摄像头，并在你的搜索历史中窥探。


    你还了解到，防御移动设备免受恶意软件攻击的最佳方式是避免安装不受信任的应用。即使一个应用看起来合法，如果它请求的权限超过所需，请删除或卸载它。如果你的智能手机开始出现异常行为，请重新启动它，删除所有可疑应用，并在怀疑你意外安装了恶意软件时考虑安装像防病毒扫描器这样的安全应用。


    在下一章中，你将尝试最后一次黑客活动。你会发现黑客技术不仅仅适用于计算机、智能手机和平板电脑。你还可以使用 Kali Linux VM 中的工具来攻击你周围其他联网设备，从智能电视到游戏机等等。为了证明这一点，我们将入侵一辆汽车！


    # 10 汽车黑客技术与物联网


    ![](img/chapterart.png)


    你每天都能接触到的一些最酷的计算机就在你周围，但你可能不会把它们当作计算机。许多家用电器——如恒温器、安全摄像头、冰箱以及 Alexa 或 Google Home
    扬声器——内部都有计算机。如今，甚至汽车也拥有互联网连接和可被不道德黑客攻击的计算机系统。


    嵌入日常物品中的联网计算设备被称为 *物联网 (IoT)*。物联网设备使我们的生活更轻松或更好，但也可能带来严重的安全风险。联网医疗设备可能有助于保持我们的健康并允许制造商远程监控和更新它们，但想象一下如果攻击者能够入侵某人的心脏起搏器或胰岛素泵来伤害用户。同样，你汽车中的卫星广播、GPS
    导航和 4G/5G 无线娱乐系统使长途公路旅行更方便和有趣，但所有这些网络都带来了攻击者可能利用的额外漏洞。想象一下如果有人入侵你的汽车并使其在高速公路上突然刹车。


    道德黑客入侵物联网设备是为了在攻击者利用它们造成真正损害之前发现问题。在本章中，你将看到其工作原理。你将入侵一个模拟的汽车网络，观察汽车发送的网络消息，并编写命令来控制汽车的仪表盘。


    ## 安装汽车黑客软件

