  trans: "\n在数字世界中，社会工程师使用电子邮件、社交媒体、广告、网站、短信、自动电话呼叫和其他技术。在线罪犯可以欺骗毫无防备的用户点击恶意链接、登录到假网站、接受虚假好友请求、输入信用卡信息、下载并运行恶意软件，或泄露个人详细信息。\n\
    \n最常见的社会工程攻击类型是网络钓鱼。在网络钓鱼攻击中，攻击者使用电子邮件诱骗你下载感染恶意软件的文件或访问伪装成在线服务登录页面的恶意网站。如果你登录到假服务，攻击者就会获取你的用户名和密码。\n\
    \n为了了解攻击者设置网络钓鱼攻击有多容易，我们将使用你的 Kali Linux 虚拟机自己搭建一个。了解其操作方式将帮助你在点击之前识别出即使是最好的网络钓鱼邮件\
    \ *before* 你点击一个。\n\n## 创建钓鱼网站\n\n我们将首先创建一个看起来就像 Twitter 登录页面的钓鱼网站。该网站将捕获并存储用户名和密码。\n\
    \n1. 启动你的 Kali Linux 虚拟机并点击屏幕左上角菜单面板上的 Kali 图标。打开 `13 - Social Engineering Tools`\
    \ 文件夹并找到 `Social Engineering Toolkit (SET)` 应用程序，如 图 5-1 所示。该程序也称为 Social-Engineer\
    \ Toolkit，使安全专业人员能够开发高级社会工程攻击来测试公司的安全性。这种类型的道德黑客行为称为 `penetration testing`（简称为\
    \ `pentesting`），因为你是在测试是否能够渗透公司的防御。\n\n![图 5-1：找到 13 - Social Engineering Tools\
    \ 文件夹和 SET 应用程序。](img/f05001.png)\n\n图 5-1：找到 `13 - Social Engineering Tools`\
    \ 文件夹和 `SET` 应用程序。\n\n2. 点击 SET 图标打开 Social Engineering Toolkit。如果提示输入密码，请输入 `kali`。（注意输入时可能看不到密码。）应用程序加载时，SET\
    \ 会要求你接受使用条款，如 图 5-2 所示。输入 `Y` 以同意仅将 SET 用于合法目的。\n\n3. 你现在应该会看到类似于 清单 5-1 所示的主\
    \ SET 菜单。\n\n```\nSelect from the menu: 1) Social-Engineering Attacks 2) Penetration\
    \ Testing (Fast-Track) 3) Third Party Modules 4) Update the Social-Engineer Toolkit\
    \ 5) Update SET configuration 6) Help, Credits, and About 99) Exit the Social-Engineer\
    \ Toolkit\nset>\n```\n\n清单 5-1：主 SET 菜单\n\n![图 5-2：使用 SET 必须同意服务条款。](img/f05002.png)\n\
    \n图 5-2：使用 SET 必须同意服务条款。\n\n4. 输入 `1` 选择 Social-Engineering Attacks。这应该会带你进入攻击菜单，如\
    \ 清单 5-2 所示。\n\n```\n   1) Spear-Phishing Attack Vectors 2) Website Attack Vectors\
    \ 3) Infectious Media Generator 4) Create a Payload and Listener 5) Mass Mailer\
    \ Attack --snip--\n```\n\n清单 5-2：SET 攻击菜单\n\n5. 在攻击菜单下，输入 `2` 选择 Website Attack\
    \ Vectors。这应该会带你进入 Website Attack Vectors 菜单，如 清单 5-3 所示。\n\n```\n   1) Java Applet\
    \ Attack Method  2) Metasploit Browser Exploit Method 3) Credential Harvester\
    \ Attack Method 4) Tabnabbing Attack Method 5) Web Jacking Attack Method --snip--\n\
    ```\n\n清单 5-3：SET Website Attack Vectors 菜单\n\n6. 输入 `3` 选择 Credential Harvester\
    \ Attack Method。这应该会打开 Credential Harvester Attack 菜单，提供几个选项，如 清单 5-4 所示。\n\n\
    ```\n   1) Web Templates 2) Site Cloner 3) Custom Import\n```\n\n清单 5-4：SET Credential\
    \ Harvester Attack 菜单\n\n7. 我们将使用第二个选项 Site Cloner 来制作一个 `clone`，即真实网站的精确副本，用于我们的钓鱼攻击。这种类型的钓鱼称为\
    \ `credential harvesting`，因为其目标是收集人们的 `credentials`，即用户名和密码。按 `2` 选择 Site Cloner\
    \ 然后按 `ENTER`。\n\n### 克隆登录页面\n\nSET 的 Site Cloner 将帮助你设置几乎任何登录页面的克隆。它下载显示现有登录页面所需的所有代码，例如社交媒体平台、银行或电子邮件服务。正如我们在第\
    \ 1 章使用浏览器检查工具时所看到的，这些代码是公开可用的。Site Cloner 然后使用下载的代码创建页面的精确副本。剩下的就是找到一种方法 trick\
    \ 用户在克隆页面中输入其用户名和密码。\n\n按照以下步骤克隆 Twitter 登录页面。\n\n1. 首先，Site Cloner 会询问将存储受害者用户名和密码的机器的\
    \ IP 地址。默认情况下，提示会显示你的 Kali VM 的 IP 地址。在我的例子中，那就是 `10.0.9.4`，如 SET 提示所示：\n\n```\n\
    set:webattack> IP address for the POST back in Harvester/Tabnabbing [10.0.9.4]:\n\
    ```\n\n如果你的 Kali VM 的 IP 地址不同，请记下来，因为稍后你需要它。按 `ENTER` 继续。\n\n2. SET 接下来应询问你想要克隆的站点的\
    \ URL：\n\n```\nset:webattack> Enter the url to clone:\n```\n\n对于成功的凭据收割攻击，你需要克隆一个在同一屏幕上要求用户名和密码的登录页面。大多数在线服务，包括许多社交媒体网站，都符合这一描述，但一些银行网站和电子邮件网站，包括\
    \ Gmail 和 Outlook，会在不同屏幕上分别要求用户名和密码，以防止此类攻击。\n\n我们将克隆 Twitter 登录页面。在 SET 窗口中输入\
    \ `https://twitter.com/login`：\n\n```\nset:webattack> Enter the url to clone:\
    \ https://twitter.com/login\n```\n\n3. SET 现在应该会说它正在克隆网站。它可能会要求你再次按 `ENTER` 继续。如果\
    \ SET 要求确认其他任何内容，请按 `Y` 或 `ENTER`。\n\n4. 片刻之后，你会看到一条确认 SET Credential Harvester\
    \ Attack 正在运行的消息：\n\n```\n[*] The Social-Engineer Toolkit Credential Harvester\
    \ Attack\n[*] Credential Harvester is running on port 80\n[*] Information will\
    \ be displayed to you as it arrives below:\n```\n\nSET 已能够在你的 Kali VM 上启动一个临时\
    \ Web 服务器，受害者可以访问它。现在它正在等待受害者在网站上输入信息。\n\n### 让我们收割一些凭据！\n\n让我们测试我们的钓鱼网站是否有效。在保持终端窗口打开的同时，点击菜单面板上的\
    \ Kali 图标并前往 `Favorites`▶`Web Browser`。浏览器打开后，在地址栏中输入 `localhost`。你应该会看到几乎完美的\
    \ Twitter 主页副本，如 图 5-3 所示。（网页会不时变化，浏览器也会变化，因此你看到的内容可能略有不同。）判断该页面不真实的唯一方法是查看地址栏。\n\
    \n![图 5-3：克隆的 Twitter 主页看起来与真实的一模一样。](img/f05003.png)\n\n图 5-3：克隆的 Twitter 主页看起来与真实的一模一样。\n\
    \n首先，你应该看到你输入的地址（`localhost`）而不是真实地址（`https://twitter.com`）。其次，地址栏旁边没有安全站点锁图标，因此浏览器告诉你该页面不安全。\n\
    \n现在我们知道克隆站点看起来像真的一样，让我们看看它是否能捕获登录详细信息。点击 `Log in` 进入登录页面。输入一个虚构的用户名和密码，然后再次点击\
    \ `Log in`。\n\n我输入的用户名为 `GeorgeJetson`，密码为 `Jane!!!`，如 图 5-4 所示。\n"
