    ## 图

    56. 图 8-7：易受攻击的网页弹出一条消息说我们已被入侵！

    57. 图 8-8：在 DVWA 的 XSS 存储页面中存储我们的恶意脚本

    58. 图 8-9：我们的 JavaScript 警告将告诉每个访客，“你已被入侵！”

    59. 图 8-10：输入更具恶意的脚本，该脚本将把用户重定向到完全不同的网页

    60. 图 8-11：清除你的存储型 XSS 攻击

    61. 图 8-12：通过向易受攻击的数据库搜索表单注入 SQL 代码来攻击数据库

    62. 图 8-13：我们已泄露所有五个用户的名字和姓氏！

    63. 图 8-14：我们已使用 SQL 注入攻击从 DVWA 窃取了所有用户名和密码哈希！

    64. 图 9-1：我们已在 VirtualBox 中添加了 Android 8.1 虚拟机！

    65. 图 9-2：虚拟 Android 设备上的主屏幕

    66. 图 9-3：从 Android 虚拟机的 Chrome 浏览器导航到 Kali 虚拟机的 `share` 文件夹，找到准备下载和安装的 `CoolGame.apk`
    木马应用。

    67. 图 9-5：访问下载管理器

    68. 图 9-6：Android 在卸载应用前会询问用户的许可。

    69. 图 9-7：使用联系人应用添加包含虚假信息的新的联系人

    70. 图 9-8：为 `Meterpreter` 授予超级用户访问权限

    71. 图 9-9：当我们在 `Meterpreter` 中关闭铃声音量时，用户无法从设置屏幕将其重新打开！

    72. 图 9-10：从用户屏幕隐藏我们的 `MainActivity` 应用图标

    73. 图 10-1：`ICSIM` 程序显示一个模拟的汽车仪表盘，带有速度表、转向信号等！

    74. 图 10-2：保持控制器应用可见且易于访问

    75. 图 10-3：`cansniffer` 数据包嗅探器显示我们在 `vcan0` 网络上的消息。

    76. 图 10-4：在 `Mousepad` 文本编辑器中搜索特定的 CAN ID 值

    77. 图 10-5：重放的数据包正在控制仪表盘。

    78. 图 10-6：我们可以通过使用 `cansend` 直接向 CAN 总线发送信号来控制仪表盘。

    79. 图 A-1：Windows 10 企业版评估屏幕

    80. 图 A-2：选择平台和语言以下载免费、合法的 Windows 评估副本。

    81. 图 A-3：从 Microsoft 下载 Windows 媒体创建工具。

    82. 图 A-4：选择 **创建安装媒体**。

    83. 图 A-5：选择 **USB 闪存驱动器**，插入一个空的 USB 驱动器，然后单击 **下一步**。

    84. 图 B-1：关闭所有 Hyper-V 和 Windows Hypervisor Platform 选项

    85. 图 B-2：从 Windows 10 进入 BIOS

    86. 图 B-3：访问高级选项菜单

    87. 图 B-4：访问 UEFI 固件设置或启动设置


