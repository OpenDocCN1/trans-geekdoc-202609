    \ 命令并查看其效果的方法是同时在屏幕上显示 Android 和 Kali 虚拟机。（这种方法也有助于在攻击者入侵设备时看到用户所见的内容。）如果您有双显示器，请将\
    \ Kali 放在一个显示器上，Android 放在另一个显示器上。如果您只有一个屏幕，请尝试将 Kali 与 Android 并排放置，以便在操作时可以看到两者。\n\
    \n### 运行应用\n\n一旦攻击者控制了移动设备，他们就可以远程启动任何想要的应用。为了了解其工作原理，让我们列出用户在其设备上安装的应用。在 `Meterpreter`\
    \ 终端窗口中输入命令 `app_list`。Android 将列出智能手机上安装的每个应用，包括应用图标上显示的名称和该应用的包统一资源标识符（`URI`）字符串。*URI\
    \ 字符串*是我们识别 Android 设备上各种资源的方式。例如，你可能会看到 YouTube 应用列出如下：\n\n```\n  YouTube  com.google.android.youtube\
    \  false  true\n```\n\n行末最后两个条目告诉你该应用是否正在运行以及它是否是操作系统安装的系统应用。这里，`false` 值告诉我们\
    \ YouTube 应用当前未运行，而 `true` 值表示它是作为 Android 操作系统的一部分安装的标准应用。\n\n现在我们知道 YouTube\
    \ 已安装在 Android 设备上，我们可以使用 `app_run` 命令和 YouTube 的包 `URI` 字符串从 `Meterpreter` 启动它。输入以下内容：\n\
    \n```\nmeterpreter > app_run com.google.android.youtube\n```\n\n你会在 Android 虚拟机中看到\
    \ YouTube 应用打开！切回你的 Android 虚拟机并搜索视频“Bryson Payne TED Talk”。Android 虚拟机上的 YouTube\
    \ 应用将调出该视频（不过你可能无法通过虚拟机听到音频，因为 VirtualBox 的驱动程序并不总是适用于智能手机和平板电脑操作系统）。\n\n你可以通过这种方式在被感染的智能手机或平板电脑上运行\
    \ *任何应用*，完全不需要用户的许可或交互。尝试运行更多应用，例如设置（`com.android.settings`）或电话应用（`com.android.dialer`）。\n\
    \n你也可以请求卸载应用的权限，但用户会收到提醒。尝试以下命令：\n\n```\nmeterpreter > app_uninstall com.google.android.gm\n\
    ```\n\n你的 Android 虚拟机会显示一个弹出窗口询问是否要卸载 Gmail，如 图 9-6 所示。点击 **Cancel** 以保留设备上的 Gmail\
    \ 应用。新款 Android 设备的安全设置会阻止 `Meterpreter` 木马卸载该应用。然而，有了超级用户权限（我们将在“窃取文件和在日志中窥探”第\
    \ 117 页获得），我们可以在用户不知情的情况下删除该应用的数据甚至其主要程序文件。\n\n![图 9-6：Android 在卸载应用前会征求用户的许可。](img/f09006.png)\n\
    图 9-6：Android 在卸载应用前会征求用户的许可。\n\n在我们继续进行更阴险的黑客攻击之前，让我们再运行最后一个应用，通讯录：\n\n```\n\
    meterpreter > app_run com.android.contacts\n```\n\n通讯录应用将在你的 Android 虚拟机中打开。在它打开时，我们将添加一个联系人，以便稍后在\
    \ `Meterpreter` 中窃取它。\n1. 在 Android 的通讯录屏幕右下角点击添加联系人图标（带加号 + 的红色圆圈）。\n2. Android\
    \ 会要求你添加一个账户以访问你的 Google 联系人。点击 **Cancel**。（你不需要登录 Google 账户就可以向虚拟智能手机添加联系人。）\n\
    3. 将出现创建新联系人窗口。输入你的姓名、一个或两个假电话号码以及一个假电子邮件地址，如 图 9-7 所示。\n4. 点击 **Save** 将新联系人保存在你的\
    \ Android 虚拟机上。如果想添加更多联系人，点击 Android 屏幕底部的返回箭头。\n\n![图 9-7：使用通讯录应用添加带有虚假信息的新联系人](img/f09007.png)\n\
    图 9-7：使用通讯录应用添加带有虚假信息的新联系人\n\n### 访问联系人\n\n`Meterpreter` 有多个用于访问我们存储在智能手机中的敏感数据的命令。在\
    \ Kali 中的 `Meterpreter` 控制台运行 `help` 并查找以 `dump` 开头的几个命令：\n\n```\n    dump_calllog\
    \      Get call log dump_contacts     Get contacts list dump_sms          Get\
    \ sms messages\n```\n\n由于我们的 Android 虚拟机不是物理 Android 设备，我们无法拨打电话或接收短信，但我们在上一节中添加了一个联系人。现在让我们窃取它。\n\
    1. 在 `Meterpreter` 中运行 `dump_contacts` 命令：\n"
