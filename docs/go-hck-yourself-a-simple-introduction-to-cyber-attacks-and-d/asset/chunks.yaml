    图 8-10：输入一个更恶意的脚本，将用户重定向到完全不同的网页


    3. 点击 `Sign Guestbook`，你会看到之前注入的警告弹出。但是一旦你关闭警告，你将被带到 [`www.nostarch.com/go-hck-yourself/`](https://www.nostarch.com/go-hck-yourself/)。你无法返回
    DVWA XSS stored 页面，因为每次重新加载页面时，它都会重定向到 *Go H\*ck Yourself* 网页。


    我们已永久劫持了 XSS stored 页面，以便每个访客都会被重定向到本书的网站。攻击者可以对雇主网站中未受保护的 Web 应用程序、你最喜欢的在线游戏或社交媒体应用，甚至当地政府网站做同样的事情或更糟。要恢复网站的原始功能，网站管理员必须访问数据库并完全删除存储的
    XSS 代码。


    要重置 DVWA 中的数据库以删除我们输入的恶意代码，请在左侧的 DVWA 菜单中点击 `Setup`，如 图 8-11 所示。然后点击 `Create /
    Reset Database`，DVWA 将数据库重置为原始状态。


    ![图 8-11：清除你的存储型 XSS 入侵](img/f08011.png)


    图 8-11：清除你的存储型 XSS 入侵


    ## 对数据库发起 SQL 注入攻击


    向网站 *注入* 恶意代码很可怕，但黑客如何从网站 *获取* 敏感数据呢？在本节中，你将学习 Web 黑客如何使用结构化查询语言 (SQL) 注入攻击直接从网站数据库窃取信息。SQL
    是用于访问大多数数据库的语言，而 *SQL injection* *(SQLi)* 涉及将恶意 SQL 代码插入 Web 应用程序，以欺骗应用程序的数据库泄露私有信息。


    数据库包含 *表*，它们看起来像列和行的电子表格。列用于不同的 *字段* 或信息片段，如名字、姓氏、用户名、密码、电子邮件地址等。行用于单个 *记录*。例如，用户表中的每个用户都会占据一行。


    当我们访问数据库时，我们使用 SQL *查询*，如下所示：


    ```

    SELECT password FROM users WHERE username=''Bryson''

    ```


    此查询请求 `users` 表中 `username` 字段为 `Bryson` 的行或行的 `password` 字段。我们可以稍微修改查询以请求 *所有*
    用户的密码：


    ```

    SELECT password FROM users WHERE username=''Bryson'' OR 1=''1''

    ```


    通过向查询添加 `OR` 条件，我们要求数据库从 `users` 表中选择所有密码。对于每一行，SQL 会询问 `username` 是否等于 `''Bryson''`，或该行的
    `1` 是否等于 `''1''`。如果任一条件为真，SQL 将返回该行的密码。因为其中一个条件 *始终* 为真（1 始终等于 1），数据库将返回 `users`
    表中的 *每个* 密码。


    让我们向 DVWA 注入一些 SQL 查询以窃取网站数据库中的信息。


    1. 在你的 Windows 10 虚拟机的 Edge 浏览器中，确保 DVWA 脚本安全级别设置为低（如 图 8-5 第 95 页所示）。


    2. 在左侧的 DVWA 菜单中点击 `SQL Injection`。你会看到一个类似 图 8-12 的用户查找页面。

