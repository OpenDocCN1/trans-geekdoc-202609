    ## Connecting Your VMs to a Virtual Network


    By default, new VMs are connected to a *host-only network*, meaning you can access
    them only from your host computer. To connect your VMs to each other and to the
    internet, we’ll create a *virtual network*. Connecting your Windows and Kali machines
    to a virtual network is like connecting them to the same Wi-Fi network.


    1. In VirtualBox, go to **File**▶**Preferences** (or **VirtualBox**▶**Preferences**
    on a Mac).

    2. Go to the **Network** tab and click the green Add icon (the one with the plus
    sign) to create a new virtual network.

    3. A new network (with a name like `NatNetwork`) should appear in the list. Make
    sure the box under the Active column next to the network name is checked.

    4. Select the network, then click the Settings icon (the one with the yellow gear).

    5. Enter `PublicNAT` into the Network Name box and change the Network CIDR text
    box by typing **10.0.9.0/24** to set the IP addresses for the VMs.

    6. Leave the Supports DHCP checkbox selected and click **OK** twice to finish
    creating your network.


    Our next task is to connect your VMs to the `PublicNAT` network you’ve created.


    ### Connecting Your Kali VM


    We’ll start by connecting your Kali VM to the network and testing out the connection.


    1. In the Oracle VM VirtualBox Manager, click your Kali VM and then click **Settings**.

    2. Select the **Network** tab and choose **NAT Network** from the Attached to:
    drop-down list. In the Name: drop-down list, choose `PublicNAT`. Then click **OK**
    to save your changes.

    3. Start the Kali VM and log in with the username `kali` and the password `kali`,
    as before.

    4. Once the Kali VM desktop appears, open the command line Terminal program by
    clicking the black box icon in the panel at the top left of your screen, circled
    in [Figure 3-4](#c03.xhtml#figure3-4).

    5. Type the command `ip addr` and press **ENTER** to see information about your
    VM’s network connections.


    ![Figure 3-4: Checking the Kali VM’s IP address](image_fi/502000c03/f03004.png)


    Figure 3-4: Checking the Kali VM’s IP address


    6. You should see an IP address starting with `10.0.9` under the `eth0:` section,
    like the one circled in [Figure 3-4](#c03.xhtml#figure3-4).


    When Kali shows an IP address starting with 10.0.9, it’s connected to the `PublicNAT`
    network. If you don’t see an address like 10.0.9.*x*, go to **Machine**▶**Reset**
    to restart your Kali VM. When the VM reboots, run the `ip addr` command in the
    terminal again. If you still don’t see a 10.0.9.*x* IP address, go back and check
    yo*u*r Kali VM’s network settings in the VirtualBox Manager.


    ### Connecting Your Windows VM


    Connecting your Windows VM to the `PublicNAT` network works almost exactly like
    connecting your Kali VM.


    1. Go to the VirtualBox Manager, select your Windows VM, and click **Settings**.

    2. Click the **Network** tab, select **NAT Network** from the Attached to: drop-down
    list, and choose `PublicNAT` from the Name: drop-down list. Click **OK** to apply
    these settings.

    3. Start your Windows VM and log in with the default password (`Passw0rd!`) as
    before.

    4. When the VM loads, click the Windows search bar (in the lower left of [Figure
    3-5](#c03.xhtml#figure3-5)), type `CMD`, and press **ENTER** to open the Windows
    command prompt, which is similar to the Kali Linux Terminal program.

    5. Enter the command `ipconfig` to check the VM’s network settings.

    6. You should see an IP address in the 10.0.9.*x* range, like the `10.0.9.5` address
    in [Figure 3-5](#c03.xhtml#figure3-5).


    If your address starts with 10.0.9, you’ve successfully connected the Windows
    VM to the `PublicNAT` network. If not, go to **Machine**▶**Reset** to restart
    your Windows VM. Try the `ipconfig` command again. If you still don’t see a 10.0.9.*x*
    IP address, go back and check your VM’s network settings in the VirtualBox Manager.


    ![Figure 3-5: Checking your Windows VM’s network settings](image_fi/502000c03/f03005.png)


    Figure 3-5: Checking your Windows VM’s network settings


    7. Finally, try testing your network’s internet connection. In your Windows VM,
    open the Microsoft Edge web browser and surf to any web address, like [https://www.nostarch.com/go-hck-yourself/](https://www.nostarch.com/go-hck-yourself/).


    If you can’t access any websites, run through the previous steps one more time
    and try closing and restarting the Windows VM.


    ## Updating Your VM Operating Systems


    Now that your virtual machines are connected to the internet, we can update their
    operating systems to ensure they have access to the latest features. It’s always
    a good idea to update a computer’s operating system often, either by enabling
    automatic updates or by checking for updates at least once a month. Updating your
    operating system protects you against viruses, hackers, and other online threats.
    It’s one of the most important things you can do to defend against the latest
    cyberattacks.


    ### Updating Kali Linux


    Follow these instructions to update Kali Linux:


    1. Start your Kali VM and open the terminal command line application again.

    2. At the terminal prompt, enter the following command to find out what software
    needs to be updated:


    ```

    kali@kali:~$ sudo apt update

    ```


    3. Kali will ask for your password the first time you use `sudo`. This command,
    short for “superuser do,” lets you run commands with administrator (or *superuser*)
    privileges. Type `kali` as your password and press **ENTER**.

    4. Now use this command to perform the updates:


    ```

    kali@kali:~$ sudo apt upgrade

    ```


    5. You may have to press `Y` to confirm certain updates. As the various software
    packages are updated, they’ll be listed in the terminal window, followed by the
    message `Done`.

    6. When `apt` finishes updating Kali, close the machine and save the machine state.


    ### Updating Windows


    Next we’ll update your Windows VM.


    1. Launch the Windows VM, type `updates` into the Windows search bar, and choose
    **Check for updates** from the list of options.

    2. If updates are available for Windows, you should see an Install now or a Restart
    now button. Click the button to install updates. You may have to restart your
    VM, just like you have to do sometimes for updates to your real computer.

    3. After your Windows VM finishes updating, close it and save the machine state.


    ## The Takeaway


    In this chapter, you set up the VirtualBox virtualization software and created
    two virtual machines, software functioning as computers within your actual computer.
    One of your VMs runs Kali Linux and will act as your attacking computer, while
    the other runs Windows and will act as your target computer. You also created
    a virtual network, named `PublicNAT`, to connect both VMs to the internet and
    to each other. Then you applied updates to your Kali and Windows VMs.


    You’ve now set up a fully functional virtual hacking lab. Well done! With your
    two VMs and your virtual network, you’re ready to safely and ethically try out
    different hacks without affecting your physical computer. In the next chapter,
    we’ll start putting your lab to use by conducting some reconnaissance to see what
    kind of information can be turned up using just a search engine and social media.


    # 4 Online Reconnaissance and Self-Defense


    ![](image_fi/book_art/chapterart.png)


    The first step in most hacking is *reconnaissance*, or *recon*. In a military
    operation, recon involves surveying enemy territory or observing a target. In
    the hacking world, attackers perform recon online. They gather information about
    companies, networks, and individuals using regular search engines (like Google),
    social media platforms, and specialized tools. Then they use the information to
    plan the next stage of a hack.

