    ## Installing the VirtualBox Extension Pack


    In addition to VirtualBox itself, you need to install the VirtualBox Extension
    Pack, which adds required features like support for attaching newer USB devices
    to your VMs. Go ahead and install it now.


    1. Return to the VirtualBox Downloads page ([https://www.virtualbox.org/wiki/Downloads](https://www.virtualbox.org/wiki/Downloads)),
    find the VirtualBox Extension Pack section, and click **All supported platforms**
    to download the Extension Pack.

    2. Open VirtualBox. (On Windows, be sure to right-click the VirtualBox icon and
    choose **Run as administrator**.)

    3. Open the Extension Pack from your `Downloads` folder.

    4. Once the VirtualBox Extension Pack installation window opens, click **Install**.


    ## Creating a Kali Linux Virtual Machine


    Now that you have VirtualBox, you’ll create your Kali Linux virtual machine. Kali
    is a version of the Linux operating system used by ethical hackers worldwide.
    It includes over 600 security and hacking tools, so it’s a perfect operating system
    for your attacking VM.


    1. Go to [https://www.kali.org/downloads/](https://www.kali.org/downloads/), scroll
    down to the Virtual Machines section, and click the link to go to the VM Download
    Page.

    2. Click the **Kali Linux VirtualBox Images** tab to see the download options
    compatible with VirtualBox. Make sure to look for VirtualBox images—there are
    also images made for VMware, a different software package that’s not compatible
    with VirtualBox.

    3. Click **Kali Linux VirtualBox 64-Bit** to download the VM. The file is around
    4GB, so download it somewhere with a fast internet connection.

    4. Start VirtualBox and select **File**▶**Import Appliance**.

    5. Click the folder icon on the right and find your Kali Linux file. Select the
    file, click **Open**, and then click **Next** (on a PC) or **Continue** (on a
    Mac).

    6. You should now see a list of settings for the Kali Linux VM you’re importing.
    Click **Import** to continue.

    7. When the VM has finished importing, you’ll see it listed on the left in the
    Oracle VM VirtualBox Manager, as shown in [Figure 3-1](#c03.xhtml#figure3-1).


    ![Figure 3-1: The Kali Linux VM appears in the list on the left of the VirtualBox
    Manager.](image_fi/502000c03/f03001.png)


    Figure 3-1: The Kali Linux VM appears in the list on the left of the VirtualBox
    Manager.


    As you add other VMs, they’ll appear in the list alongside Kali. For now, let’s
    test the new Kali VM to make sure it runs on your system.


    ## Running the Kali VM


    Double-click the Kali Linux VM entry in your VirtualBox Manager panel to start
    up the Kali Linux virtual machine. The first time you run a VM in VirtualBox,
    you may encounter errors due to different settings on your Mac or PC. If you have
    any trouble running VirtualBox or starting your Kali VM, see Appendix B.


    When the VM finishes booting, you’ll come to a login screen. Log in with the username
    `kali` and the password `kali`. After you log in, you’ll see a screen with the
    signature Kali dragon logo like the one shown in [Figure 3-2](#c03.xhtml#figure3-2).
    Welcome to Kali Linux!


    Using a computer within a computer takes some getting used to. Once you click
    inside the VM window, your keyboard and mouse are “captured” for use within the
    VM. To return your mouse and keyboard to your physical (host) computer, click
    your mouse outside the VM window or press the *host key* on your keyboard. This
    should be the *right* CTRL key on a PC/Linux machine or the *left* COMMAND key
    on a Mac. If you ever need a reminder, the host key should also be identified
    in the bottom-right corner of the VM window.


    ![Figure 3-2: Your Kali Linux VM is ready to go!](image_fi/502000c03/f03002.png)


    Figure 3-2: Your Kali Linux VM is ready to go!


    If you find that the VM screen and icons are too small, go to **View**▶**Virtual
    Screen 1** and try changing the scale or resolution. Additionally, if you leave
    your VM alone for a while, the VM window may go blank. If this happens, click
    in the Kali window and press the spacebar to wake up the machine.


    Take some time to explore Kali Linux. You won’t be able to connect to the internet
    until we set up the network later in the chapter, but you can still take a look
    around. Click the **Applications** menu at the top of the screen (the button with
    the dragon logo) to see some of Kali’s hundreds of programs and tools. They may
    seem intimidating now, but this book will teach you to use several of them, helping
    you become more confident in exploring others.


    After you’ve looked around a bit, close the Kali Linux VM window. You should see
    the Close Virtual Machine pop-up window. Choose **Save the machine state** and
    click **OK**. Saving the machine state lets you pick up where you left off the
    next time you open the VM, like putting your computer to sleep instead of powering
    it completely down. However, if you ever need to reboot a VM after installing
    software or changing settings, you’ll need to choose **Power off the machine**
    instead.


    Congratulations! You’ve set up your first virtual machine! If this is your first
    experience with Linux, give yourself a high five! With this Kali VM, you’ll be
    able to test dozens (or even hundreds) of hacks against other, target virtual
    machines to see how online attacks happen and how to defend against them. We’ll
    set up one of those target VMs next.


    ## Creating a Windows VM


    You’ll now create a second VM that runs Windows. As the most common desktop and
    laptop operating system in the world, Windows is the number one target for both
    ethical and unethical hackers, so it’s an important operating system to learn
    to attack and defend. We’ll download a fully functional Windows 10 VM from the
    Microsoft Edge Developer website.


    1. Go to [https://developer.microsoft.com/en-us/microsoft-edge/tools/vms/](https://developer.microsoft.com/en-us/microsoft-edge/tools/vms/)
    (or search for the Microsoft Edge Developer Virtual Machines website).

    2. Choose a Windows 10 virtual machine, select VirtualBox as your platform, and
    download the VM. The file is over 6GB, so download this VM somewhere with a fast
    internet connection.

    3. Unzip the downloaded file.

    4. Open VirtualBox and select **File**▶**Import Appliance**.

    5. Click the file icon on the right and find your Windows 10 VM. It will either
    be a `.ova` file or a `.ovf` file. Choose the file, then click **Continue**.

    6. You should now see a list of settings for the Windows 10 VM. Click **Import**
    to continue.

    7. When it’s done importing, the Windows VM will appear in the VirtualBox Manager
    list along with your Kali VM, as shown in [Figure 3-3](#c03.xhtml#figure3-3).


    ![Figure 3-3: After you import the Windows VM, you’ll have two VMs in your virtual
    ethical hacking lab!](image_fi/502000c03/f03003.png)


    Figure 3-3: After you import the Windows VM, you’ll have two VMs in your virtual
    ethical hacking lab!


    Now let’s turn on the Windows 10 VM to make sure it works. Double-click the Windows
    10 VM in the VirtualBox Manager list. Once the VM loads, click within the window
    to show the Windows login prompt. Log in with the default username, `IEUser`,
    and the default password, `Passw0rd!` (with a zero in place of the letter *o*).
    If the password doesn’t work, check the Microsoft VM download page. The default
    password should be listed under the Download button.


    Once the virtual desktop loads, click around and explore a bit. It’s just like
    a regular Windows computer. You won’t be able to surf the internet yet, but we’ll
    set up the virtual network in the next section. Once you’ve finished exploring
    the Windows VM, close the VM and select **Power off the machine**. You need to
    power off the VM completely to change the network settings.


    You now have two virtual machines, a Kali Linux VM and a Windows 10 VM, in your
    ethical hacking lab. We’ll add more VMs as we need them in future chapters. As
    soon as we connect these two VMs together, you’ll be able to practice hacking
    and defending without endangering your laptop or desktop.

    '
  trans: '

    ## 安装 VirtualBox 扩展包


    除了 VirtualBox 本身之外，您还需要安装 VirtualBox 扩展包，它会添加所需的功能，例如支持将更新的 USB 设备连接到您的虚拟机。现在就安装它吧。


    1. 返回 VirtualBox 下载页面（[`www.virtualbox.org/wiki/Downloads`](https://www.virtualbox.org/wiki/Downloads)），找到
    VirtualBox Extension Pack 部分，然后点击 **所有受支持的平台** 下载扩展包。

    2. 打开 VirtualBox。（在 Windows 上，请务必右键单击 VirtualBox 图标并选择 **以管理员身份运行**。）

    3. 从您的 `Downloads` 文件夹打开扩展包。

    4. VirtualBox 扩展包安装窗口打开后，点击 **安装**。


    ## 创建 Kali Linux 虚拟机


    现在您已经安装了 VirtualBox，您将创建 Kali Linux 虚拟机。Kali 是全球道德黑客使用的 Linux 操作系统版本。它包含超过 600
    种安全和黑客工具，因此是攻击虚拟机的完美操作系统。


    1. 前往 [`www.kali.org/downloads/`](https://www.kali.org/downloads/)，向下滚动到 Virtual
    Machines 部分，然后点击链接前往 VM 下载页面。

    2. 点击 **Kali Linux VirtualBox 镜像** 选项卡，查看与 VirtualBox 兼容的下载选项。务必查找 VirtualBox
    镜像——还有为 VMware 制作的镜像，VMware 是一种不同的软件包，与 VirtualBox 不兼容。

    3. 点击 **Kali Linux VirtualBox 64 位** 下载虚拟机。该文件约为 4GB，因此请在网络连接快速的地方下载。

    4. 启动 VirtualBox 并选择 **文件**▶**导入设备**。

    5. 点击右侧的文件夹图标并找到您的 Kali Linux 文件。选择文件，点击 **打开**，然后点击 **下一步**（在 PC 上）或 **继续**（在
    Mac 上）。

    6. 现在您应该会看到正在导入的 Kali Linux 虚拟机的设置列表。点击 **导入** 继续。

    7. 虚拟机导入完成后，您将在 Oracle VM VirtualBox 管理器左侧看到它，如 图 3-1 所示。


    ![图 3-1：Kali Linux 虚拟机出现在 VirtualBox 管理器左侧的列表中。](img/f03001.png)


    图 3-1：Kali Linux 虚拟机出现在 VirtualBox 管理器左侧的列表中。


    随着您添加其他虚拟机，它们会与 Kali 一同出现在列表中。现在，让我们测试新的 Kali 虚拟机，以确保它能在您的系统上运行。


    ## 运行 Kali 虚拟机


    在 VirtualBox 管理器面板中双击 Kali Linux 虚拟机条目以启动 Kali Linux 虚拟机。首次在 VirtualBox 中运行虚拟机时，由于
    Mac 或 PC 上的设置不同，您可能会遇到错误。如果您在运行 VirtualBox 或启动 Kali 虚拟机时遇到任何问题，请参阅附录 B。


    虚拟机启动完成后，您将进入登录屏幕。使用用户名 `kali` 和密码 `kali` 登录。登录后，您将看到带有标志性 Kali 龙标志的屏幕，如 图 3-2
    所示。欢迎使用 Kali Linux！


    在计算机中使用计算机需要一些适应。一旦您点击进入虚拟机窗口，您的键盘和鼠标将被“捕获”供虚拟机使用。要将鼠标和键盘返回到您的物理（主机）计算机，请在虚拟机窗口外点击鼠标或按下键盘上的
    *主机键*。在 PC/Linux 机器上，这应该是 *右* CTRL 键，在 Mac 上则是 *左* COMMAND 键。如果您需要提醒，主机键也应标识在虚拟机窗口的右下角。


    ![图 3-2：您的 Kali Linux 虚拟机已准备就绪！](img/f03002.png)


    图 3-2：您的 Kali Linux 虚拟机已准备就绪！


    如果您发现虚拟机屏幕和图标太小，请前往 **查看**▶**虚拟屏幕 1** 并尝试更改缩放比例或分辨率。此外，如果您让虚拟机闲置一段时间，虚拟机窗口可能会变空白。如果发生这种情况，请点击
    Kali 窗口并按空格键唤醒机器。


    花点时间探索 Kali Linux。在本章后面设置网络之前，您将无法连接到互联网，但仍可以四处查看。点击屏幕顶部的 **应用程序** 菜单（带有龙标志的按钮）查看
    Kali 的数百个程序和工具中的一些。它们现在可能看起来令人望而生畏，但本书将教您使用其中几种，帮助您更自信地探索其他工具。


    在四处查看一番后，关闭 Kali Linux 虚拟机窗口。您应该会看到关闭虚拟机弹出窗口。选择 **保存机器状态** 并点击 **确定**。保存机器状态可让您下次打开虚拟机时从上次离开的地方继续，就像让计算机进入睡眠而不是完全关机一样。然而，如果您在安装软件或更改设置后需要重新启动虚拟机，则需要选择
    **关闭机器**。


    恭喜！您已设置好第一台虚拟机！如果这是您第一次使用 Linux，给自己一个高五吧！有了这个 Kali 虚拟机，您可以针对其他目标虚拟机测试数十种（甚至数百种）攻击，以了解在线攻击是如何发生的以及如何防御。我们接下来将设置其中一个目标虚拟机。


    ## 创建 Windows 虚拟机


    您现在将创建一个运行 Windows 的第二个虚拟机。作为世界上最常见的桌面和笔记本操作系统，Windows 是道德黑客和非道德黑客的首要目标，因此学习攻击和防御它是一个重要的操作系统。我们将从
    Microsoft Edge 开发者网站下载一个功能齐全的 Windows 10 虚拟机。


    1. 前往 [`developer.microsoft.com/en-us/microsoft-edge/tools/vms/`](https://developer.microsoft.com/en-us/microsoft-edge/tools/vms/)（或搜索
    Microsoft Edge 开发者虚拟机网站）。

    2. 选择一个 Windows 10 虚拟机，选择 VirtualBox 作为您的平台，然后下载虚拟机。该文件超过 6GB，因此请在网络连接快速的地方下载此虚拟机。

    3. 解压下载的文件。

    4. 打开 VirtualBox 并选择 **文件**▶**导入设备**。

    5. 点击右侧的文件图标并找到您的 Windows 10 虚拟机。它要么是 `.ova` 文件，要么是 `.ovf` 文件。选择文件，然后点击 **继续**。

    6. 现在您应该会看到 Windows 10 虚拟机的设置列表。点击 **导入** 继续。

    7. 导入完成后，Windows 虚拟机将与您的 Kali 虚拟机一起出现在 VirtualBox 管理器列表中，如 图 3-3 所示。


    ![图 3-3：导入 Windows 虚拟机后，您将在虚拟道德黑客实验室中拥有两个虚拟机！](img/f03003.png)


    图 3-3：导入 Windows 虚拟机后，您将在虚拟道德黑客实验室中拥有两个虚拟机！


    现在让我们打开 Windows 10 虚拟机以确保它能正常工作。在 VirtualBox 管理器列表中双击 Windows 10 虚拟机。虚拟机加载后，点击窗口内以显示
    Windows 登录提示。使用默认用户名 `IEUser` 和默认密码 `Passw0rd!`（用零代替字母 *o*）登录。如果密码不起作用，请检查 Microsoft
    VM 下载页面。默认密码应列在下载按钮下方。


    虚拟桌面加载后，四处点击并探索一下。它就像一台普通的 Windows 计算机。您目前还无法上网，但我们将在下一节设置虚拟网络。探索完 Windows 虚拟机后，关闭虚拟机并选择
    **关闭机器**。您需要完全关闭虚拟机才能更改网络设置。


    您现在在道德黑客实验室中有两个虚拟机，即 Kali Linux 虚拟机和 Windows 10 虚拟机。我们将在未来章节中根据需要添加更多虚拟机。一旦我们将这两个虚拟机连接起来，您就可以在不危及笔记本电脑或台式机的情况下练习攻击和防御。

    '
