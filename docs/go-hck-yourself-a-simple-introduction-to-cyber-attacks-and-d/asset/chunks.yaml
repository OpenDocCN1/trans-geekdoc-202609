    In a *cross-site scripting (XSS) attack*, a hacker enters malicious code into\
    \ a web page through a field intended for regular text input, such as a login\
    \ form or a search field. XSS attacks are also known as *code injection* attacks,\
    \ because hackers are able to enter, or *inject*, their own code into the web\
    \ application. We’ll use two web languages—JavaScript and HyperText Markup Language\
    \ (HTML)—to inject a script into `DVWA`.\n\nTo test a web application for XSS\
    \ vulnerabilities, you need only a single JavaScript command:\n```\nalert(\"You've\
    \ been hacked!\");\n```\nThe command pops up an alert box reading “You’ve been\
    \ hacked!” To inject it into a web page, we wrap the JavaScript code in the proper\
    \ HTML tags, `<script>` and `</script>`, like this:\n```\n<script>alert(\"You've\
    \ been hacked!\");</script>\n```\nThe HTML `<script>` tag tells a web page that\
    \ a *script* (a short piece of code), usually in JavaScript, is beginning. The\
    \ `</script>` tag is called a closing tag, and it lets the web page know the script\
    \ code is finished.\n\n#### Reflected Cross-Site Scripting\n"
