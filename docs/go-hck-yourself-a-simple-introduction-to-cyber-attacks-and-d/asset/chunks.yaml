- raw: "![Figure 5-4: Enter fake information into your SET cloned site; never enter\
    \ your real username and password on a phishing site.](image_fi/502000c05/f05004.png)\n\
    \nFigure 5-4: Enter fake information into your SET cloned site; never enter your\
    \ real username and password on a phishing site.\n\nOnce you submit your fake\
    \ login credentials, SET will redirect your browser to the real Twitter website,\
    \ [https://twitter.com/](https://twitter.com/). You can tell it’s the real site\
    \ from the address bar, where you’ll see the lock icon. SET takes the victim to\
    \ the real login page to make them think that they mistyped their login information.\
    \ This time, they log in to the real site without ever realizing that an attacker\
    \ stole their credentials.\n\nNow open the terminal window running SET. If your\
    \ phishing website worked correctly, you’ll see a screen full of web form data\
    \ that was submitted. Scroll up if needed, and you’ll see the username and password\
    \ you entered:\n\n```\n[*] WE GOT A HIT! Printing the output:\n...\nPOSSIBLE USERNAME\
    \ FIELD FOUND: session[username_or_email]=GeorgeJetson\nPOSSIBLE PASSWORD FIELD\
    \ FOUND: session[password]=Jane!!!\n```\n\nIf SET didn’t retrieve the login information,\
    \ fill out the cloned form again. If you still can’t find the username and password\
    \ you entered, close SET and try cloning a different site.\n\nAs long as SET is\
    \ running, you can submit usernames and passwords to your form by going to your\
    \ Kali IP address in any browser that has access to your Kali VM’s network. That\
    \ means you can start up your Windows VM, pretend you’re a phishing victim surfing\
    \ to your Kali VM’s IP address (10.0.9.4 or similar), and enter a username and\
    \ password into the fake page.\n\n### Creating a Phishing Email\n\nThe final step\
    \ in a phishing attack is to create and send a phishing email with a link to your\
    \ phishing site’s IP address. Remember, SET’s Site Cloner is running a fake version\
    \ of the Twitter login page on your Kali VM, so it uses your Kali VM’s IP address.\
    \ In your Kali or Windows VM, log in to your email account and compose a new email.\
    \ Your phishing email can be as simple as this:\n\n> `Subject: Unusual account\
    \ activity`\n\n> \n\n> `Message: Someone attempted to log in to your Twitter account\
    \ from Budapest, Hungary. If this wasn't you, please log in to your account and\
    \ check your Security settings: http://10.0.9.4.`\n\nEmail the message to yourself\
    \ and open it on either your Kali or Windows 10 VM while SET is running. Clicking\
    \ the link should take you to your cloned phishing site!\n\nMost people, however,\
    \ probably wouldn’t click the link in the email. The email doesn’t look like a\
    \ regular message from Twitter, and the link shows an IP address rather than the\
    \ Twitter URL. To create a more convincing phishing scam, an attacker might instead\
    \ copy a real email from Twitter, one that uses the Twitter logo and style, and\
    \ paste it into a new message. Then they would change the text and links to try\
    \ to convince people to click through to the cloned site. [Figure 5-5](#c05.xhtml#figure5-5)\
    \ shows an example I cooked up.\n\n ![Figure 5-5: I converted a real email from\
    \ Twitter into a phishing email by changing the text and hyperlinks.](image_fi/502000c05/f05005.png)\n\
    \nFigure 5-5: I converted a real email from Twitter into a phishing email by changing\
    \ the text and hyperlinks.\n\nI made it look like someone tried to hack the user’s\
    \ account from North Korea to motivate them to click the link to check their “Security\
    \ settings.” Next, I added a hyperlink for the text “Security settings” that takes\
    \ the user to my cloned login page. In most email programs, you can insert a hyperlink\
    \ by highlighting the text you want to turn into a link, clicking the chain-link\
    \ icon (boxed in [Figure 5-5](#c05.xhtml#figure5-5)), and entering the link address.\
    \ With the suspicious IP address hidden behind the text “Security settings,” people\
    \ are more likely to click through to the phishing site.\n\nNow that you understand\
    \ phishing attacks, let’s look at how you can defend yourself against them.\n\n\
    ## Protecting Yourself Against Phishing Attacks\n\nYou can protect yourself from\
    \ email scams with just a few simple tips:\n\n*   Mouse over links in your email\
    \ (don’t click them!) to see if the link address is suspicious, either because\
    \ it’s misspelled or unusually long/numeric. The address usually appears at or\
    \ near the bottom of the screen in your browser or email program when you do this.\
    \ (You can also use VirusTotal to check a link address for malware, as we did\
    \ back in Chapter 4.)\n\n*   Check the From: and To: fields of the email to make\
    \ sure both are authentic. Look for misspellings or different domain names, like\
    \ *gmail.com* instead of *yourbank.com*, in the sender’s address.\n\n*   If you’re\
    \ asked for personal information, think carefully about who’s asking for it, what’s\
    \ being asked for, and why the information is needed.\n\n*   If you’re ever unsure\
    \ about the source of an email, don’t click or open anything. Call the person\
    \ or company (using a real phone number, not one found in the email) to verify\
    \ any important transactions or urgent problems.\n\nIf you suspect that an email\
    \ is fake, open a separate web browser window and visit the real website by entering\
    \ the real URL or searching online for the business name. Double-check the address\
    \ bar to make sure the URL is what you expect. Even then, only enter your username\
    \ and password into a login page if the site is secure. You can tell if a website\
    \ is secure if the URL begins with *https://* and the secure website lock symbol\
    \ appears in your browser’s address bar.\n\n## The Takeaway\n\nIn this chapter,\
    \ you learned that social engineers use human emotions against their victims to\
    \ lure them into making the wrong choice, both in person and online. You learned\
    \ about the most common online social engineering attack—phishing.\n\nTo understand\
    \ how easy and effective phishing is, you cloned a login page with the Social\
    \ Engineering Toolkit (SET) in Kali Linux that allowed you to harvest the credentials\
    \ of unsuspecting users. You created a phishing email linking to the cloned page,\
    \ and you saw how attackers can create more convincing emails by starting with\
    \ a real email, then changing the text and links.\n\nYou learned to protect yourself\
    \ from phishing attacks by looking carefully at the From: and To: fields in any\
    \ email asking you to click a link, open a document, or take any action out of\
    \ the ordinary. You also learned to check links by mousing over each one and examining\
    \ the URL. Strange or misspelled web addresses, as well as unusually long or numeric\
    \ IP addresses in a URL, can be clues that the address might be from a phishing\
    \ attack. When in doubt, don’t click any links in an email. Instead, open a separate\
    \ browser window, type the domain name of the real website where you have an account,\
    \ and log in directly.\n\nIn the next chapter, you’ll add another important tool\
    \ to your hacking repertoire: malware. Malware will allow you to remotely take\
    \ over another computer so you can steal files, log keystrokes, and even access\
    \ the user’s webcam.\n\n# 6  \n\nRemote Hacking with Malware \n\n![](image_fi/book_art/chapterart.png)\n\
    \nIn this chapter, you’ll learn how attackers use malware over the internet to\
    \ infect and control all kinds of computing devices from anywhere in the world.\
    \ Short for *malicious software*, *malware* is any software designed to steal\
    \ or damage data or to disrupt computer systems or users.\n\nIf an attacker can\
    \ trick you into opening a malicious attachment, video, or app, they can take\
    \ control of your computer, smartphone, or other internet-connected device. To\
    \ protect yourself, you need to understand how easy it is for a black hat hacker\
    \ to create a virus and infect your computer. Once a device is infected, the attacker\
    \ can often see *everything*—including your files, your keystrokes, your screen,\
    \ and even what your webcam sees!"
