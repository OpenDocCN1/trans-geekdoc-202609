- raw: "In the digital world, social engineers use email, social media, ads, websites,\
    \ text messages, automated phone calls, and other technologies. Online criminals\
    \ can fool unsuspecting users into clicking a bad link, logging in to a fake website,\
    \ accepting a fake friend request, entering their credit card information, downloading\
    \ and running malware, or giving out their personal details.\n\nThe most common\
    \ type of social engineering attack is phishing. In a phishing attack, an attacker\
    \ uses email to trick you into downloading files infected with malware or visiting\
    \ a malicious website disguised as the login page for an online service. If you\
    \ log in to the fake service, the attacker gets your username and password.\n\n\
    To understand how easy it is for an attacker to set up a phishing attack, we’ll\
    \ set one up ourselves using your Kali Linux VM. Seeing how it’s done will help\
    \ you spot even the best phishing emails *before* you click one.\n\n## Creating\
    \ a Phishing Website\n\nWe’ll start by creating a phishing website that looks\
    \ just like the Twitter login page. The site will capture and store usernames\
    \ and passwords.\n\n1.  Launch your Kali Linux VM and click the Kali icon on the\
    \ menu panel at the top left of the screen. Open the *13 - Social Engineering\
    \ Tools* folder and find the *Social Engineering Toolkit (SET)* application, as\
    \ shown in [Figure 5-1](#c05.xhtml#figure5-1). This program, also called the Social-Engineer\
    \ Toolkit, enables security professionals to develop advanced social engineering\
    \ attacks to test a company’s security. This type of ethical hacking is called\
    \ *penetration testing* (*pentesting* for short) because you’re testing whether\
    \ you can penetrate a company’s defenses.\n\n    ![Figure 5-1: Find the 13 - Social\
    \ Engineering Tools folder and the SET application.](image_fi/502000c05/f05001.png)\n\
    \n    Figure 5-1: Find the *13 - Social Engineering Tools* folder and the SET\
    \ application.\n\n2.  Click the SET icon to open the Social Engineering Toolkit.\
    \ If prompted for your password, enter `kali`. (Note that you may not see your\
    \ password as you type.) As the application loads, SET will ask you to accept\
    \ the terms of use, as shown in [Figure 5-2](#c05.xhtml#figure5-2). Enter `Y`\
    \ to agree to use SET for lawful purposes only. \n\n3.  You should now see something\
    \ like the main SET menu shown in [Listing 5-1](#c05.xhtml#listing5-1).\n\n  \
    \  ```\n    Select from the menu: 1) Social-Engineering Attacks 2) Penetration\
    \ Testing (Fast-Track) 3) Third Party Modules 4) Update the Social-Engineer Toolkit\
    \ 5) Update SET configuration 6) Help, Credits, and About 99) Exit the Social-Engineer\
    \ Toolkit\n    set>\n    ```\n\n    Listing 5-1: The main SET menu\n\n    ![Figure\
    \ 5-2: To use SET, you must agree to the terms of service.](image_fi/502000c05/f05002.png)\n\
    \n    Figure 5-2: To use SET, you must agree to the terms of service.\n\n4.  Enter\
    \ `1` to select Social-Engineering Attacks. This should bring you to the Attacks\
    \ menu, as shown in [Listing 5-2](#c05.xhtml#listing5-2).\n\n    ```\n       1)\
    \ Spear-Phishing Attack Vectors 2) Website Attack Vectors 3) Infectious Media\
    \ Generator 4) Create a Payload and Listener 5) Mass Mailer Attack --snip--\n\
    \    ```\n\n    Listing 5-2: The SET Attacks menu\n\n5.  Under the Attacks menu,\
    \ enter `2` to select Website Attack Vectors. This should take you to the Website\
    \ Attack Vectors menu, shown in [Listing 5-3](#c05.xhtml#listing5-3).\n\n    ```\n\
    \       1) Java Applet Attack Method  2) Metasploit Browser Exploit Method 3)\
    \ Credential Harvester Attack Method 4) Tabnabbing Attack Method 5) Web Jacking\
    \ Attack Method --snip--\n    ```\n\n    Listing 5-3: The SET Website Attack Vectors\
    \ menu\n\n6.  Enter `3` to select Credential Harvester Attack Method. This should\
    \ open the Credential Harvester Attack menu, which gives us a few options, as\
    \ shown in [Listing 5-4](#c05.xhtml#listing5-4).\n\n    ```\n       1) Web Templates\
    \ 2) Site Cloner 3) Custom Import\n    ```\n\n    Listing 5-4: The SET Credential\
    \ Harvester Attack menu\n\n7.  We’ll use the second option, Site Cloner, to make\
    \ a *clone*, or exact copy, of a real website for our phishing attack. This kind\
    \ of phishing is called *credential harvesting* because its goal is to collect\
    \ people’s *credentials*, or usernames and passwords. Press `2` to select Site\
    \ Cloner and then press **ENTER**.\n\n### Cloning a Login Page\n\nSET’s Site Cloner\
    \ will help you set up a clone of almost any login page. It downloads all the\
    \ code needed to display an existing login page, such as for a social media platform,\
    \ a bank, or an email service. As we saw when we used your browser’s Inspect tool\
    \ in Chapter 1, this code is publicly available. Site Cloner then creates an exact\
    \ copy of the page using the downloaded code. All that remains is to find a way\
    \ to trick a user into entering their username and password into the cloned page.\n\
    \nFollow these steps to clone the Twitter login page.\n\n1.  First, the Site Cloner\
    \ asks for the IP address of the machine that will store victims’ usernames and\
    \ passwords. By default, the prompt shows the IP address of your Kali VM. In my\
    \ case, that’s 10.0.9.4, as shown in the SET prompt:\n\n    ```\n    set:webattack>\
    \ IP address for the POST back in Harvester/Tabnabbing [10.0.9.4]:\n    ```\n\n\
    \    If the IP address for your Kali VM is different, write it down, as you’ll\
    \ need it later. Press **ENTER** to continue.\n\n2.  SET should next ask for the\
    \ URL of the site you want to clone:\n\n    ```\n    set:webattack> Enter the\
    \ url to clone:\n    ```\n\n    For a successful credential-harvesting attack,\
    \ you need to clone a login page that asks for a username and password on the\
    \ same screen. Most online services, including many social media sites, fit this\
    \ description, but some bank sites and email sites, including Gmail and Outlook,\
    \ ask for the username on one screen and the password on another screen to prevent\
    \ attacks like this one.\n\n    We’ll clone the Twitter login page. Enter `https://twitter.com/login`\
    \ into the SET window:\n\n    ```\n    set:webattack> Enter the url to clone:\
    \ https://twitter.com/login\n    ```\n\n3.  SET should now say it’s cloning the\
    \ website. It may ask you to press ENTER again to continue. If SET asks you to\
    \ confirm anything else, press `Y` or ENTER as requested.\n\n4.  After a moment,\
    \ you’ll see a message confirming that the SET Credential Harvester Attack is\
    \ running:\n\n    ```\n    [*] The Social-Engineer Toolkit Credential Harvester\
    \ Attack\n    [*] Credential Harvester is running on port 80\n    [*] Information\
    \ will be displayed to you as it arrives below:\n    ```\n\nSET was able to start\
    \ a temporary web server on your Kali VM that victims can surf to. Now it’s waiting\
    \ for victims to type their information into the site.\n\n### Let’s Harvest Some\
    \ Credentials!\n\nLet’s test our phishing website to see if it works. While leaving\
    \ the terminal window open, click the Kali icon on the menu panel and go to **Favorites**▶**Web\
    \ Browser**. Once the browser opens, enter `localhost` into the address bar. You\
    \ should see an almost perfect replica of the Twitter home page, as shown in [Figure\
    \ 5-3](#c05.xhtml#figure5-3). (Web pages change from time to time, as do browsers,\
    \ so what you see may look slightly different.) The only way to tell that the\
    \ page isn’t real is to look in the address bar.\n\n![Figure 5-3: The cloned Twitter\
    \ home page looks identical to the real one.](image_fi/502000c05/f05003.png)\n\
    \nFigure 5-3: The cloned Twitter home page looks identical to the real one.\n\n\
    First, you should see the address you entered (*localhost*) instead of the real\
    \ address ([https://twitter.com](https://twitter.com)). Second, there’s no secure\
    \ site lock icon next to the address bar, so the browser is telling you that the\
    \ page isn’t secure.\n\nNow that we know our cloned site looks like the real thing,\
    \ let’s see if it can capture login details. Click **Log in** to go to the login\
    \ page. Enter a made-up username and password and click **Log in** again.\n\n\
    I’ve entered a username of GeorgeJetson with the password Jane!!!, as shown in\
    \ [Figure 5-4](#c05.xhtml#figure5-4)."
