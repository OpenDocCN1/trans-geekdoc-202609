    These examples raise overarching question: do foundation models uncover causal
    mechanisms, or merely spurious correlations? The issue is whether models recover
    any plausible generative process consistent with the data or simply rely on pattern
    matching. In neuroscience and cognitive science, it is sharper to show that models
    capture the data-generating process underlying activity and reasoning than just
    one of many facts. This distinction between predictive power and the extraordinary
    power of today''s models makes it easy to mistake fitting for understanding. In
    what follows, we review recent work that addresses these challenges in the current
    era.


    At the same time, models can capture strong unnecessary correlations—a phenomenon
    known as shortcut learning. But even perfect predictive accuracy does not guarantee
    explanatory value: Pavlov''s episodic memory for motor planning while a feat of
    motion reflection can abstract complexity beyond individual mechanistic truth.
    It remains debated, whether generative-based models trained on proxy sequences
    truly capture the underlying rules or whether models also solve them at a human
    level performing causal reasoning (see Serra and Pavlick).


    These findings underscore that predictive alignment, itself, is insufficient for
    mechanistic alignment. Without evidence that models have discovered cognitive
    mechanisms of brain and reasoning, we risk replacing one black box (with another
