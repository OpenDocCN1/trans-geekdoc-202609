    # CellProcess


    # 神经元


    # CellView


    # 从预测到理解：

    AI 基础模型将改变脑科学吗？


    **Thomas Serre**¹ 和 Ellie Pavlick²

    布朗大学认知与心理科学系及计算机科学系，计算脑科学中心，美国罗德岛州，普罗维登斯。

    *联系邮箱：thomas.serre@brown.edu https://doi.org/10.1016/j.neuron.2025.09.0399*


    利用海量数据的深度学习方法改变了 AI，并正在重塑科学。我们探讨了基础模型何时将改变神经科学，概述了关键条件，以及从预测到解释的转变——将之与神经活动和认知的机制联系起来。


    生成式预训练——ChatGPT 中“GPT”（生成式预训练的缩写）背后的概念——已使得神经网络能够在没有人类演示的情况下，从海量的非结构化数据集中进行学习。这些特征达到了新高度：它们的首次预测发表于基于视觉运动皮层的大规模钙成像研究，以及一个在不收集电生理数据的情况下预测人类决策的行为模型。²
    两项实验都提高了跨越实验任务、研究和领域的预测准确性。我们仍然面临一些悬而未决的问题：我们能否回顾训练范式，并询问我们在预测什么——是否可以在不使用因果模型的情况下进行解释？


    在标记数据集上进行监督训练——例如，对神经标记分类、分析日志文档或对决策建模（见 Serra 和 Pavlick³）。ChatGPT 中的文本生成首先在人类编写的演示上进行微调——例如，通过提示词与响应配对，通过强化学习说明对话。例如，在人类反馈强化学习（RLHF）中，模型优化响应以匹配人类偏好。后续流程实现了
    ChatGPT 中的“点赞”功能，使模型能够生成多样且准确的响应。RLHF 流程的变体现在已成为通用系统和特定领域系统（包括心理健康案例）的标准。


    同样的“预训练-微调”配方现在被应用于科学领域，模型加速了各个领域的领域的发现。基于蛋白质折叠的模型可以预测 3D 蛋白质结构、设计酶和功能性突变——这些能力由
    AlphaFold 实现。⁴开发者 David Jabis 分享了 2022 年诺贝尔化学奖的一半，另一半授予了用于蛋白质设计的 David Baker。在化学领域，基于
    AI 的模型可以预测反应，其准确性可媲美最好的物理材料。基于科学的系统已经提出了数百万候选方案，并已合成和测试。


    大型语言模型（LLM）能力的核心是自监督——一类方法，模型通过预测或将其输入映射到外部标签来学习。我们看到大多数常用的 LLM 都是 GPT，其中模型被训练用于预测非结构化文本中的下一个标记（token），跨越历史和世界知识。关于所有结构形式和架构细节的详细分析，请参见框
    1。随后的微调将模型适配到特定的领域和应用。在许多情况下，这种在——


    视觉语言模型（VLM）使用动态图像并匹配强大的内容，对齐从物体识别到图像的范围内的注意力。这些重构的对比或查询音频段，使用较少训练数据进行文本分段。在编程等离散领域，在大规模语料库上的模型可以预测缺失或下一个标记，引导代码生成、翻译和调试中的应用。这种配方是一致的：在原始数据上进行大规模预训练，随后是


    最近的一研究引入了视觉运动皮层的模型


    ![](img/5d2e02e98d0d27e742ac5d2382d8a13e_0_0.png)


    # # NeuronView

    NeuroView CellPress


    ### ### 框 1. 自监督学习


    自监督学习（SSL）是一类方法，其中模型创建自己的训练信号。模型不再依赖外部标签，而是通过破坏输入的一部分并根据周围上下文对其进行预测。这使得系统能够直接从数据、未标记的数据集中学习。


    一种广泛使用的 SSL 方法是预训练，它在原始 GPT 论文中引入，模型被训练用于预测输入序列中的下一个元素（例如句子中的下一个单词）。模型运行的基本单位被称为标记（tokens），它们跨越数据类型。在文本中，标记可能是单词、子词或字符；在图像中，标记是补丁（patches）；在音频中，标记是短时间窗或神经事件（例如脉冲）。这种共享的标记化原则允许相同的嵌入表示扩展到图像、音频/视频、录音和行为。


    基础模型是指一种在异构数据上通过规模（通常使用 SSL）预训练的网络，以学习通多的表示。这些表示随后可以通过线性探测、微调适配到下游任务。如今的模型都是构建在
    Transformer 架构上的，该架构在很大程度上取代了早期的设计（MLPs、CNNs、RNNs）。Transformer 使用一种称为自注意力机制，模型表示根据加权关系（“注意力分数”）进行更新。在仅解码器模型（例如
    GPT、Centaur）中，注意力被限制在过去的标记（因果掩码）。在编码器中（例如 BERT），注意力是双向的并涵盖所有标记。尽管存在这些差异，通配方是在数据集上预训练
    Transformer 以学习通用表示。对于神经科学家来说，一个有用的类比是手工特征与学习表示之间的对比。SSL 取消了手动特征工程步骤：模型从原始或轻微处理的数据中学习特征。基础模型的显著进展反映了这种从手工到学习的转变——结合了海量数据和计算。这种灵活性使模型能够捕捉行为、模态中的复杂模式。模型还捕获了有关神经细胞类型、形态和连接的信息。相似性体现在人类老化的进展，大型
    fMRI 基础模型预测状态和临床变量，泛化到新的群体（见 Serge 和 Parlick）或将自然语言任务描述和先验选择作为标记来预测患者的下一个选择或句子。Centaur
    在群体上使用经典认知模型并泛化到各种未见的任务。


    随着神经科学的扩展，对模型孪生投影的需求也随之增加。例如，高密度探针跨越长时间记录数千个神经元，大规模细胞聚合了数千万个细胞。在实践中，生成式基础模型可以产生与个体或群体相同的神经或行为序列。这种模拟器将构成数字孪生的核心，允许硅实验、个性化神经技术。然而，解释性仍然是一个问题——它并没有，通过，


    科学认知中的第一个大规模行为基础模型


    ### 框 2. 基础模型扩展


    最近的进展由经验扩展法则驱动，这些法则表明随着数据、计算和参数的增加，模型性能会预测地提高。这些法则指导了日益巨大的基础模型的设计，这些模型在多样化数据集上预训练并适配任务。


    相同的预训练-微调范式实现了文本、图像、音频和其他数据类型的多模态学习。例如，在大规模图像数据集上训练的视觉语言模型可以支持临床任务，而视觉语言动作模型使机器人能够遵循自然语言指令。前沿模型——如
    GPT-4o、Claude Claude 和 Gemini 2.0——是以前所未有的规模训练的多模态系统。虽然扩展带来了惊人的预测收益，但它并不能保证模型揭示其目标系统背后的因果机制。


    '
