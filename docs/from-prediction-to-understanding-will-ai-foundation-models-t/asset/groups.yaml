    # CellProcess


    # 神经元 NeuroView


    提供一种说明。阐明“存在”如何超越预测保真度转向机制需求，取决于它们是否能够推动神经科学的发展，而仅仅是另一个黑箱。


    交织线索（参考文献参见 Serra 和 Pavlick）。这些发现共同营造了谨慎的乐观，即基础模型不仅可能实现预测准确性，还能为语言和学习背后的认知和神经机制提供见解。


    在广为人知的实验中，预测往往与人类行为产生。在某些情况下，即使在无法获取任务信息也能实现性能，从调节序列中的不一致性中学习——这些策略与人类决策在根本上是不兼容的。这些局限性强调了需要更强的约束，以使模型与人类数据对齐，并参考安全等级等数字。


    这些示例提出了一个总性问题：基础模型揭示了因果机制，还是仅仅是虚假相关？问题在于模型是恢复了与数据一致的任何生成过程，还是仅仅依赖于模式匹配。在神经科学和认知科学中，证明模型捕捉了活动和推理背后的数据生成过程，比仅仅作为许多事实中的一个更有说服力。这种预测能力与当今模型卓越能力之间的区别，使得很容易将拟合误认为理解。在下文中，我们回顾了应对当前这些挑战的近期工作。


    同时，模型可以捕捉强大的无用相关性——这种现象被称为捷径学习。但即使完美的预测准确性也不能保证解释价值：帕甫洛夫对运动规划的片段记忆作为运动反射的成就可以抽象出超越个体机制真相的复杂性。目前仍在的是，在代理序列上训练的基于生成的模型是否真的捕捉了底层规则，还是模型也以人类的水平通过执行因果推理解决了这些问题（参见
    Serra 和 Pavlick）。


    这些发现强调，预测对齐本身对于机制对齐是不够的。如果没有证据证明模型发现了大脑和推理的认知机制，我们就有面临用一个黑箱替换另一个黑箱（类似的深度网络）的风险。


    鉴于这种乐观，模型可以通过将相关性转换为揭示底层生成过程来改进。如果一个模型执行人类的行为，但没有内部机制；如果它可以仅根据记录进行计划，它就具有游戏的恐惧。这类示例表明，随着模型规模和数据的增加，性能变得越来越可能（参考文献参见
    Serra 和 Pavlick）。


    一个示例模型来自在神经力学生成的合成轨迹上训练。这些模型实现了高性能，但未能泛化到相关任务——表明它们没有内部化底层的物理。这些示例显示了当前模型的一个关键局限性：它们是简单的，并定义在训练数据中，可能仍然无法还原。


    实现模型理解认知的承诺将要求它们植根于机制和心理学框架，并识别支撑其力量的因素。通过这种机制理解，基础模型可以生成泛化到我们对人类认知知识的可测试假设。


    确实，有一些似乎不可能的希望（参考文献参见 Serra 和 Pavlick）。虽然关于细节的争议仍然，但语言模型可能代表句法结构和关系，以及此类语义和语法依赖，并且这些表示在模型行为中放置了可衡量的因果。然而，工作也表明，Transformer
    模型可能会捕捉到与人类中观察到的平行的学习路径。


    这是一个务实的问题：基础模型如何植根于脑科学框架？如果没有视觉逻辑来证明神经网络不是“箱子”，神经科学和心理学中寻求的那种解释。解释性的最新进展开始揭示多个层次的结构变化。


