  md: '# LOCALITY DEFEATS THE CURSE OF DIMENSIONALITY


    Deep Convolutional Neural Networks (CNNs) have emerged as the driving force behind
    many recent developments in deep learning, yet such success is surprising. In
    principle, supervised learning models face the curse of dimensionality: under
    minimal assumptions about the function being learned, reaching a fixed generalization
    error $E$ requires a number of training samples $P$ that grows exponentially with
    the dimensionality $d$ of the input data [Wei19; LBo4], i.e., $\mathcal{E}(P)
    \sim P^{-1/d}$. However, empirical observations show that CNNs consistently overcome
    this limitation in practice [Hes+17; KSH12], exhibiting:


    ```

    $$\mathcal{E}(P) \sim P^{-\beta}, \quad \hat{\beta} \geq 1/d.$ (19)

    ```


    In particular, CNNs achieve remarkable performances on high-dimensional tasks,
    with state-of-the-art attributes achieving exponents $\beta \approx [0.3,0.5]$
    [Hes+17]. This empirical success implies that data must possess additional structure
    that makes them effectively learnable. One classical hypothesis [Bie87] attributes
    the effectiveness of recognition systems to compositionality, where complex objects
    are composed of simpler features, which are composed of sub-features [Pog+178;
    Dez+20; Bie21]. From this perspective, the locality inherent in CNNs is considered
    critical for their performance, a view supported by empirical evidence [Ney20].
    However, a clear understanding of how novelty influences learning curves remains
    elusive.


    We investigate this relationship with a teacher-student framework, where the function
    to be learned takes one of two forms:


    ```

    $f^{LC}(\mathbf{x}) = \sum_{i\in P} g_i(\mathbf{x}_i), \quad f^{CN}(\mathbf{x})
    = \sum_{i\in P} g_i(\mathbf{x}_i).$ (20)

    ```


    Parts of this chapter have been previously published:

    Favero, A., Cagnetta, and F. Wyart, 2022. Locality defeats the curse of dimensionality
    in convolutional-student scenarios. Journal of Statistical Mechanics: Theory and
    Experiment, 2022(1), p.114012.

    Favero, A., Cagnetta, and F. Wyart, 2021. Locality defeats the curse of dimensionality
    in convolutional-student scenarios. Advances in Neural Information Processing
    Systems (NeurIPS), 34: pp-9456–9467.

    These authors contributed equally.'
