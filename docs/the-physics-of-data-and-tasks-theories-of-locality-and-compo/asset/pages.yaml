    In **Figure 33**, we plot this for a Vi-B/32 CLIP model trained on RESISC45 with
    Cars as control. We provide results for other tasks in Section G.3.4. Notably,
    the local energy of the eigenfunctions the predictor uses to represent the RESISC45
