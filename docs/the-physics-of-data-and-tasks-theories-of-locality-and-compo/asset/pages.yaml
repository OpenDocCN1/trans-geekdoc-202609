  md: '# A THEORY OF CREATIVITY AND COMPOSITIONALITY


    Compositional generalization, the ability to understand and generate novel combinations
    of known components, is a fundamental characteristic of human intelligence. This
    skill underlies what linguists refer to as creativity [Cho+76]; the capacity to
    produce an infinite number of novel and well-formed expressions from a finite
    set of rules. Under which conditions machines learn such a skill? The success
    of diffusion models in producing realistic data across various domains [SD+15;
    HjAa2; Se19; Bet+23; Rom+22] provides a unique opportunity to study this ability.
    Fundamental questions include: What signals in the data are exploited by neural
    networks to learn the compositional rules? How many training examples are needed
    to learn rules, and in what order are they learned? How does the fineness of the
    training set affect the structure of generated data?


    To address these questions theoretically, we bridge two viewpoints developed in
    the context of natural language processing. Symbolic approaches aim to describe
    the structure of data via a list of rules that generate them. For context-free
    grammars (PCFG) [Cho014] describe sentences with trees, whose nodes are hidden
    variables that can generate other nodes or leaves according to production rules.
    PCFGs approximate both structural and semantic aspects of text and have also been
    proposed for the description of images under the name of Pattern Theory [Gre96;
    JGo6; Sis+07]. On the other hand, statistical approaches use data-driven analytics
    to exploit knowledge of grammatical structure. A notable example is wordzec [Mik+13],
    where a shallow neural network learns representations of words by predicting their
    neighborhood.


    We unify these two viewpoints by studying how diffusion models learn the Random
    Hierarchy Model (RHM) [Cag+24]. In particular, we empirically show that the learning
    process of diffusion models trained on the RHM is hierarchical, progressively
    capturing rules at deeper levels of the PCFG’s hierarchy.


    Parts of this work have been previously published in:

    Faver*, A., Scolch*, A., Cagnetta, F., Frossard, P. and Wyatt, M., 2025. How Compositional
    Generalization and Creativity Improve as Diffusion Models Are Trained. appear
    in Proceedings of the 42nd International Conference on Machine Learning (ICML),
    PML.

    * These authors contributed.'
