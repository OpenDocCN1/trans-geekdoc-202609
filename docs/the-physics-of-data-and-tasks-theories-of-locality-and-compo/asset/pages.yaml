    # ACKNOWLEDGEMENTS


    The years spent on this PhD have been a period of profound personal and academic
    transformation. I have had the privilege of meeting wonderful people, traveling
    the world, and growing in ways I had not anticipated. The achievements detailed
    in this thesis, and indeed any personal growth I have experienced, are by no means
    my merit alone. They are the result of a deeply collective endeavor, a reflection
    of the incredible people I have been surrounded by. This is, to me, the most beautiful
    way to do science.


    My deepest gratitude goes first to my two PhD advisors, Prof. Mathieu Wyart and
    Prof. Pascal Frossard. To Mathieu, thank you for your unwavering belief in me
    from the very beginning. I am indebted to you for the countless hours of scientific
    discussion that fundamentally shaped how I think. You taught me the meaning of
    scientific rigor, clarity of thought, and importance of honest feedback. You showed
    me how to approach problems with precision without losing the underlying intuition,
    and you instilled in me a unique research taste for which I will always be grateful.


    To Pascal, thank you for trusting me and for granting me immense freedom and independence
    to grow as a researcher and, later, as a mentor. Your constant support and patience,
    especially during my time away from UBS, were invaluable. I am grateful for your
    wisdom, your practical advice on navigating academia, and for always asking the
    right questions.


    I was honored to have an exceptional committee. My sincere thanks to Prof. Surya
    Ganjali, Prof. Eric Vanden-Ijnder, Prof. Emmanuel Abbe, and the committee president,
    Prof. Christian Theiler. I could not have asked for a more distinguished and insightful
    group of experts in the field. It was a privilege to present my work to you, and
    I look forward to future scientific conversations.


    This thesis would not exist without my co-authors: Francesco, Antonio, Noam, and
    Guille. I feel incredibly fortunate to have worked alongside such brilliant scientists.
    I am grateful for the time we spent together and immensely proud of the publications
    we co-authored, which form the core of this work.


    Several people have been instrumental in teaching me the art of science. My journey
    began with Stefano, who co-supervised my Master’s thesis, partially taught me
    the fundamentals of kernel theory, and introduced me to both theoretical and numerical
    research.'
