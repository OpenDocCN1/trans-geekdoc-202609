    # B.7.5 CIFAR-2 learning curves


    Figure 41 shows the learning curves of the neural tangent kernels of different
    architectures applied to pairs of classes of the CIFAR-10 dataset. In particular,
    the task is built by selecting two CIFAR-10 classes, e.g., plane and car, and
    assigning label +1 to the elements belonging to one class and label -1 to the
    remaining ones. Learning is again achieved by minimizing the empirical mean squared
    error using a ''student'' kernel. We find that the kernels with the worst performance
