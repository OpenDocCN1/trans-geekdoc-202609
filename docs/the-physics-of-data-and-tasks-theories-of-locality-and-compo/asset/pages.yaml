  md: 'Therefore, the correlation function $\dot{C}(r,t)$ exhibits algebraic decay
    with exponent $2(a-d)$ for $r \ll 1/\kappa^*$ and faster than any power law for
    $r \gg 1/\kappa^*$.


    # D.2.4 Discussion


    For the Gaussian random field model, the correlation length $\xi \sim 1/\kappa^*(t)$
    is a monotonically increasing function of the inversion time $t_i$, or noise-to-signal
    ratio (NSR). As a result, the susceptibility $\chi(t)$ - calculated by integrating
    the correlation function over space - also increases monotonically reaches its
    maximum at the inversion time $t=T$, where the NSR = $\infty$. This behavior contrasts
    sharply with the hierarchical data studied here, where a phase transition occurs
    at a finite time/NSR. As discussed in the main text, this divergence arises due
    to the geometry of correlations induced by the hierarchical tree structure, which
    is absent in the Gaussian random field model.


    # D.2.5 Numerical experiments


    In Figure 5 (a), we plot the local model errors $\mathcal{E}_k = \varepsilon_k
    ||\hat{X}(k,t)_0 - X(k)_0||$. For $|k|>\kappa^*$, the errors remain $O(1)$, indicating
    that the coefficients are not retrieved, but predicted by our analysis. Conversely,
    for $|k|>\kappa^*$, the errors decay, indicating successful recovery of the coefficients.
    In panel (b), we decay, the correlations $C(r,t)$, which exhibit a power law decay
    followed by a cutoff. Notably, the correlation length increases monotonically
    with the inversion time $t$. Finally, in panel (c), we plot the susceptibility
    $\chi(t)$, which reaches its maximum at $t=T$.


    # D.3 LANGUAGE DIFFUSION


    # D.3.1 Setup


    Here, we describe the particular realization of discrete diffusion used in the
    MDLM setting, which is detailed in [Sah+24].


    MDLMs are a form of discrete diffusion model tailored for language generation.
    Uniscale autoregressive (AR) models, MDLMs generate by gradually masking tokens,
    allowing for non-sequential generation. This process is governed by a forward
    masking and reverse unmasking process, parameterized using a Rao-Blackwellized
    objective to improve performance.'
  merge: -1
  img_proc: true
- pgno: 247
  md: "# APPENDIX: PROBING HIDDEN HIERARCHIES IN DATA\n\nFORWARD PROCESS: The forward\
    \ process is defined by progressively noisy a clean sequence x using a categorical\
    \ distribution:\n\n```\n$q(z_t|x) = \\text{Cat}(z_t; a_t x + (1 - a_t)m),$\n```\n\
    \nwhere $z_t$ is the latent variable at time $t$, representing the noisy version\
    \ of the input sequence, $x$ is the original clean sequence of tokens, $\\text{Cat}(\\\
    cdot;)$ is a categorical distribution over the possible states, $a_t$ is the noise\
    \ schedule function, strictly decreasing from 1 to 0 as $t$ increases, and $m$\
    \ is a one-hot vector representing the special masked token. At each step, a fraction\
    \ of the data transitions into the masked state.\n\nREVERSE PROCESS AND RAO-BLACKWELLIZATION:\
    \ The reverse process reconstructs the original data from noisy observations.\
    \ It is parameterized by a neural network approximation $x_\theta(z_t, t)$, which\
    \ predicts clean tokens from noisy inputs:\n\n```\n$p_\theta(z_s|z_t) = \\begin{cases}\
    \ \\text{Cat}(z_s; z_t), & \\text{if } z_t \\neq m, \\ \\text{Cat}(z_s; \\frac{(1-a_t)m+(a_t)x_\t\
    heta(z_t,t)}{1-a_t}), & \\text{if } z_t = m. \\end{cases}$\n```\n\nwhere $z_s$\
    \ is the latent variable at a prior step $s$ (with $s < t$), $x_\theta(z_t, t)$\
    \ is a neural network approximation of $x$ given the noisy observation $z_t$ at\
    \ time $t$, and $p_\theta(\\cdot|\\cdot)$ is the model distribution approximating\
    \ the true reverse process.\n\nThe training objective is a negative log bound\
    \ (ELBO), expressed as:\n\n```\n$L_{\\text{diffusion}} = \\sum_{i=1}^T \\mathbb{E}_q\
    \ \\left[ \\frac{a_{t(i)}\\alpha_{t(i)}}{1-\\alpha_{t(i)}} \\log(x_\theta(z_{t(i)}),\
    \ x) \\right]$\n```\n\nwhere $T$ is the number of diffusion steps, $a_{t(i)}$\
    \ and $alpha_{t(i)}$ is the noise schedule evaluated at time steps $(i)$ and $(t)$,\
    \ respectively, $\\mathbb{E}_q$ is the expectation over the forward process defined\
    \ by $q$, and $(x_\theta(z_{t(i)}), x)$ is the dot product between the neural\
    \ network output and the original input.\n\nCONTINUOUS-TIME LIKELIHOOD BOUND:\
    \ To achieve a tighter approximation to the ELBO, the discrete objective is extended\
    \ to continuous time:\n\n```\n$L_{\\text{ELBO}} = \\mathbb{E}_q \\int_0^1 \\frac{a'_t}{1-a'_t}\
    \ \\log(x_\theta(z_t, t), x) \\ dt.$\n```\n\nwhere $a'_t$ is the time derivative\
    \ of the noise schedule $a_t$. The integral evaluates the objective over continuous\
    \ time, providing a tighter bound on the likelihood to the specific functional\
    \ form of the noise schedule $a_t$, highlighting the robustness of the MDLM approach."
