  md: '# 5.1 PRELIMINARIES 75


    If the noisy observation $\mathbf{x}$ is produced by a forward diffusion process,
    sampling from $p(\mathbf{x}_0|\mathbf{x})$ is equivalent to integrating exactly
    (i.e., for an infinite number of time steps) the backward diffusion process starting
    from $\mathbf{x}$ and using the score function. In fact, BP can also be used to
    compute the score function, which is proportional to $\mathbb{E}_{\mathbf{x}_0|\mathbf{x}}[\mathbf{x}_0]$,
    to having access to a neural network achieving perfect generalization (see Section
    D.1.1.3 for a comparison between BP sampling and backward diffusion with the score
    function). This is a different situation with respect to real data, like images
    and text, where the score is estimated by training a neural network.


    DIFFUSION PROCESSES IN THE RHM For the RHM data, we consider two different processes.


    +   *e-process* is this simplified process where one considers any data $x_0$
    that can be generated by the RHM, and ensures there is some level of uncertainty
    on each visible token (see Section D.11.2 for details). One uses BP to compute
    the probability that the true initial data was $x_0$. The noisy process is controlled
    by a noise-to-signal ratio $\epsilon \in [0,1]$, which plays the role of $t$ in
    the standard diffusion processes, such that the $\epsilon = 0$ at $t=0$ and $\epsilon
    = 1$ at $t=T$. From an RHM data $x_0$, we include the noisy observation at the
    leaf priors. Before, BP computes the marginals $p(h^{(l)}|x_c)$ and samples from
    $p(x_0|x_c)$. We theoretically this process in Section 5.2.1 using a mean-field
    approximation, neglecting fluctuations of the marginal probabilities and averaging
    over the disorder of the RHM.


    +   *Masking diffusion with an absorbing state* This is the diffusion process
    described above for discrete data, which is commonly used in practice. We study
    numerically with BP in Section 5.2.2.


    PHASE TRANSITION IN THE CLASS RECONSTRUCTION OF THE RHM In the previous chapter,
