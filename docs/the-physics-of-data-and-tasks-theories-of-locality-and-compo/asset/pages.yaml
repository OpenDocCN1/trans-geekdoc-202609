    samplers’, building new data from known, reusable parts. Moreover, it puts forward
    hierarchical generative models as valuable theoretical tools for capturing nontrivial-world
    data properties.


    PROBING HIERARCHIES IN DATA Chapter 5 explores whether diffusion models can also
    serve as tools for discovering the latent structure in data, a longstanding challenge.
    Using the same forward-backward paradigm of the previous chapter, we show that
    changes introduced by denoising in correlated chunks, with a correlation length
    that diverges at the phase transition identified earlier. We find that this behavior
    is consistent across real-world datasets, including text and images, suggesting
    that diffusion models function as empirical probes of hierarchical organization
    in natural domains.


    A THEORY OF CREATIVITY AND COMPOSITIONALITY In the previous chapters, we established
    the presence of compositional effects in the generative process of pre-trained
    diffusion models. Chapter 6 addresses how many training samples are needed for
    a model to learn composition rules that enable it to generate novel outputs.


    To answer this, we consider the hierarchical grammars introduced earlier and find
    that learning the rules in the learning regime requires the same sample complexity
    as clustering features that statistically similar contexts. This process unfolds
    hierarchically: identifying higher-level features, which correspond to longer
    context dependencies, requires more data. Importantly, the number of samples needed
    polynomially with the size of the context, allowing the model to learn a high-dimensional
    distribution without encountering the curse of dimensionality. The key mechanism
    behind this result is the model’s ability to construct a lower-dimensional internal
    representation of the grammar by recovering the latent variables – an ability
    that fundamentally depends on feature learning.


