  md: '# 34 LOCALITY DEFEATS THE CURSE OF DIMENSIONALITY


    Theorem 2.4.1 is proven in Section A.4 and extended to the scenario of local teachers
    and students in Section A.5. Below, we provide an intuitive proof for the simpler
    nonoverlapping patch case.


    We begin by calculating the variance of the coefficients of the target function
    in the student eigenbasis. By indexing the coefficients with the $s$-dimensional
    wavevectors $k$,


    ```

    $$\mathbb{E}[|c_k|^2] = \int_{[0,1]^d} d^x \phi_k(x) \int_{[0,1]^d} d^y \phi_k(y)
    \mathbb{E}[f^*(x)f^*(y)] = \int_{[0,1]^d} d^x \phi_k(x) \int_{[0,1]^d} d^y \phi_k(y)K_T(x,y).
    \quad (43)$

    ```


    When the teacher and students share the same filter size ($s = t$) they share
    the same eigenfunctions. Using the eigenvalue equation for the teacher kernel
    we have $\mathbb{E}[|c_k|^2] \sim k^{-(a+t)}$ by ordering eigenvalues by increasing
    wavelet magnitude $k$, with multiplicity $k^{s-1}$ from all the wavevectors having
    the same modulus, we


    ```

    $B(P) = \sum_{|k|>p^{1/s}} k^{-(a+t)} \sim \int_{p^{1/s}}^{\infty} k^{-(a+t)}k^{s-1}
    dk \sim P^{-\dots}. \quad (44)$

    ```


    When the teacher size $t$ is reduced, some coefficients $\mathbb{E}[|c_k|^2]$
    vanish. Specifically, as the target function becomes a composition of $t$-dimensional
    components, the only non-zero coefficients are found for $k$''s which lie in $t$-dimensional
    subspaces of the $s$-dimensional Fourier space. These subspaces correspond to
    wavevectors having at most of $t$ consecutive non-vanishing components. In other
    words, $\mathbb{E}[|c_k|^2]$ is finite only if $k$ is $t$-dimensional and the
    integral on the right-hand side of Equation 44 becomes $t$-dimensional, this


    ```

    $B(P) = \int_{p^{1/s}}^{\infty} k^{-(a+t)}k^{s-1} dk \sim P^{-\dots}. \quad (45)$

    ```


    Finally, if the teacher patches are not contained in the student ones, the target
    function cannot be represented in the student eigenbasis. Therefore, the generalization
    error does not decay to zero but instead approaches a finite positive limit as
    $P \to \infty$.


