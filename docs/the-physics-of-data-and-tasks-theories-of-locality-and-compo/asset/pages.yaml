  md: "# TASK COMPOSITIONALITY IN WEIGHT SPACE\n\n![](img/86150bd6d44cb578b97e3eba954b7be2_135_0.png)\n\
    \n**Figure 28:** *Illustration of weight disentanglement, where distinct directions\
    \ in the weight space, $\tau_i$, are associated with spatial localized areas of\
    \ the function space, $D_i$, This enables a model, $f_i$, to manipulate the disjoint\
    \ parts of the input space independently by adding linear combinations of those\
    \ weight directions to a-pre-trained checkpoint $\theta_0$.*\n\nDespite these\
    \ breakthroughs, a deep understanding of the underlying principles of task composition\
    \ and its general effectiveness remains lacking.\n\nTo address these open questions,\
    \ this chapter presents a systematic study of task arithmetic in the context of\
    \ contrastively pretrained vision-language models like CLIP [Rad+21]. We examine\
    \ the hypothesis, proposed by Wortsman et al. [Wort+22b], that task arithmetic\
    \ is possible because these large models inherently function in a linear regime,\
    \ where their behavior is governed by the finite-width neural kernel (NTK) [JGH18:COB19].\n\
    \nOur research indicates that while linearized CLIP models show significantly\
    \ better task arithmetic performance than their counterparts (Table 5-6), the\
    \ NTK framework cannot fully account for the task arithmetic abilities of their\
    \ nonlinear forms. We find the sole condition for *weight disentanglement*—a property\
    \ where distinct directions in the weight space correspond to localized changes\
    \ of the network function in disjoint spatial regions (Figure 28). This structure\
    \ allows a model to compose tasks by independently manipulating these specific\
    \ weight directions.\n\nWe find that fine-tuning models in their tangent space\
    \ by linearizing them weight disentanglement, yielding significant performance\
    \ improvements across multiple benchmarks. However, weight disentanglement is\
    \ stronger in the tangent space, it is also present in nonlinear models. We show\
    \ that weight disentanglement of semantically meaningful tasks is an emergent\
    \ property of pre-training, as it is not present at random initialization.\n\n\
    The main contributions of this part of the thesis are as follows.\n\nWe provide\
    \ a formal notion of task arithmetic, which allows for its quantitative analysis.\n\
    \n> Throughout the paper, we use the term *spatial* to refer to the input space."
