    to the conditional expectation $\mathbb{E}_{x_t|x_0}$, with a neural network.
    Sampling from $p_0$ is achieved by sampling $x_t \sim p_t=\mathcal{N}(0, I)$ and
    then applying the learned backward process $p_\theta(x_0|x_t)$ to obtain a new
    sample $\hat{x}_0$.


    # FORWARD-BACKWARD EXPERIMENTS Previous studies on DDPMs [HJA20] note that inverting
    the diffusion process at different times $t$ starting from an image $x_0$ results
    in samples $\hat{x}_0(t) \sim p(x_0|x_t)$ with distinct characteristics depending
    on the choice of $t$. Specifically, when conditioning on the noisy samples by
    images using the CelebA dataset, one finds that for small values of $t$, only
    fine details change [HJA20]. We conduct a similar experiment using a class-unconditional
    DDPM introduced by [DN21], on the ImageNet dataset with 256x256 resolution.


    In the left panel of Figure 5 we present some images resulting from this experiment.
    For each row, the initial image $x_0$ is generated by initiating the diffusion
    process from $x_0$, running the forward dynamics until time $t=1000$, and ultimately
    running the backward dynamics to produce a sample image $\hat{x}_0(t)$. Our observations
    from these synthetic images are as follows:


    +   1. Similarly to the findings in [HJA20], at small inversion times $t$, only
    local features change. Furthermore, the class of the sampled images remain consistent
    with that of the starting images, i.e., $class(\hat{x}_0(t)) \equiv class(x_0)$
    with high probability.

    2. There exists a characteristic time scale $t^*$ at which the class of the sampled
    images undergoes a sudden transition.

    3. Even after the class transitions, low-level features persist and are reinforced
    into the newly generated image. For instance, looking at the left panel of Figure
    5, in the second row, the jaguar is composed with the paws and the ears of the
    dog in the starting picture, or in the third row, the jaguar''s arms inherit the
    shape of the car headlights.


    Our theory, presented in Section 4.4 and 4.5, predicts how features at different
    hierarchical levels vary at different time scales of the diffusion dynamics in
    accordance with observations (i), (ii), and (iii).'
