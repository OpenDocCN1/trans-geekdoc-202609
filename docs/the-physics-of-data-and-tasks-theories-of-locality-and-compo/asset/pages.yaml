    # E.1 TOKEN-LATENT TUPLE CORRELATIONS


    In this section, we discuss our estimate for the magnitude of the

    correlations between $x_i$ and tuples of latent, level-$(\ell-1)$ features

    h_{(i-1)+1:i}^{(\ell)}$ with $i=2, \dots, s$ and $\ell=1, \dots, L-1$ (level-0
    latents $h^{(0)}$)

    correspond to visible tokens. These correlations are identical for all

    theples of the same higher-level feature

    h_i^{(\ell)}$, thus we can reconstruct level-$\ell$ latents. For instance, with

    s=2, so $i=2$ (see Figure 19), the correlations of $x_1$ with $(x_3, x_4)$

    determine the value of $h_2^{(1)}$, while with $h_3^{(1)}, h_4^{(1)}$ determine

    h_2^{(2)}$. To simplify the notation, we will use the case for $i=2$ remains

    remainder of the sunken. Then, the goal is to compute the statistics of


    ```

    $C^{(\ell+1)}(\mu, v) := \mathbb{P}[X_i = \mu | \mathbb{P}[X_i = \mu | h_{s+1:2s}^{(\ell-1)}
    = v] - \mathbb{P}[X_i = \mu | h_{s+1:2s}^{(\ell-1)} = v]$\n(385)

    ```


    over realizations of the RHM.

    For each visible token $i=1, \dots, d$, single-token probabilities can be

    written as products of probabilities over the single production rules,


    ```

    $\mathbb{P}[X_i = \mu] = \sum_{\mu_1, \dots, \mu_i=1} p_{\mu_1}^{(i)}(\mu_1)\dots
    p_{\mu_i}^{(L)}(\mu_{L-1}|\mu_L)p_{\mu_L}^{(L+1)}(\mu_L),\n(386)

    ```


    where


    +   i) the $i_1, \dots, i_\ell$ are such that $i_1, \dots i_1$ equals the $s$-ary
    representation of $i$, with $i=1, \dots, s$, and $s$ added to ensure

    the representation consists of L latents. In other words,

    the multi-index $i_1, \dots, i_ell$ uniquely identifies the path linking the

    root of the tree to the $i$-th leaf.

    ii) $p_{\mu_\ell}^{(\ell)}(\mu_{\\ell-1}|\mu_L)$ the probability of choosing,
    among

    the available production rules starting from $\mu_\ell$ one that has

    the $i_\ell$-th position of the right-hand size.

    iii) $p_{\mu_L}^{(L)}(\mu_L)$ the probability of selecting the symbol $\mu_L$
    as

    the root ($1/v$ for our model).


    These decompositions arise naturally due to the connection between

    probabilistic context-free grammars and Markov processes. Similar


