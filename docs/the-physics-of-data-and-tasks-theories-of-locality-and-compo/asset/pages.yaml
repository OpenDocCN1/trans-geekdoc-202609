  md: 'DEEP LEARNING A subfield of machine learning based on artificial neural networks
    with multiple layers (deep architectures). These models learn hierarchical representations
    of data, enabling them to tackle complex tasks like image recognition and natural
    language processing.


    DIFFUSION MODELS A class of generative models inspired by nonequilibrium statistical
    physics that learn to create data by reversing a denoising process. They start
    with pure noise and iteratively denoise it over time to produce a sample from
    the learned data distribution.


    FEATURE LEARNING A learning regime in neural networks where the model''s parameters
    (weights) evolve significantly during training. This allows the network to adapt
    its internal representations (features) to the specific structure of the training
    data, in contrast to the ''lazy'' or kernel regime, where features remain largely
    fixed.


    FULLY CONNECTED NEURAL NETWORK (FCN) A basic neural architecture where each neuron
    in a given layer is connected to every neuron in the preceding and subsequent
    layers. FCNs are general function approximators but do not inherently encode structural
    priors, such as locality.


    GENERALIZATION A model''s ability to perform accurately on new, unseen data after
    being trained on a finite dataset. Good generalization means the model has learned
    the underlying patterns in the data distribution, rather than simply memorizing
    the training examples.


    GENERALIZATION ERROR A measure of how well a trained model''s predictions match
    the true outcomes for unseen data drawn from the same distribution. It is formally
    the expected value of the loss function over the entire data distribution.


    KERNEL In machine learning, a function that measures the similarity between pairs
    of data points. Kernels allow to operate in a high-dimensional feature space without
    explicitly computing the coordinates of the data in space.


    KERNEL METHODS A class of learning algorithms, such as Support Vector Machines
    or Kernel Ridge Regression, that use a kernel function to learn a predictor. In
    the infinite-width limit, certain neural networks become equivalent to kernel
    methods.


    KERNEL RIDGE REGRESSION A regression algorithm that learns a function by minimizing
    a combination of the squared error on the training data and the norm of the function
    in a Reproducing Kernel Hilbert Space (RKHS).'
  merge: -1
  img_proc: true
- pgno: 322
  md: '# LAZY TRAINING REGIME See Neural Tangent Kernel (NTK) Regime.


    LOCALITY A structural property of data where interactions are primarily confined
    to small, local regions. For example, in an image, the value of a pixel is most
    strongly correlated with its immediate neighbors. This thesis shows that locality
    is a key property that allows CNNs to defeat the curse of dimensionality.


    LOCALLY CONNECTED NETWORK (LCN) A neural network architecture similar to a CNN
    but without weight sharing. It applies local filters to input patches, but each
    filter is unique to its location, capturing local structure without enforcing
    translational invariance.


    MEMORIZATION The phenomenon where a machine learning model, particularly an overparameterized
    one, learns to store and reproduce specific examples from its training set rather
    than learning the underlying data distribution. This typically leads to poor generalization.


    MODEL EDITING The process of modifying the behavior of a trained model to add
    new skills, correct errors, or remove undesired capabilities, often by directly
    manipulating its weights rather than retraining it.


    NEURAL SCALING LAWS Empirical findings showing that the performance of deep learning
    models improves predictably as a power-law function of the model size, dataset
    size, and computational budget.


    NEURAL TANGENT KERNEL (NTK) A deterministic kernel that describes the training
    dynamics of an infinitely wide neural network under gradient descent. In this
    ''lazy'' regime, the network''s parameters change very little, and the model behaves
    like a linear model in parameter space, equivalent to a kernel method with the
    NTK.


    OVERPARAMETERIZATION The modern practice of training neural networks with far
    more parameters than the number of training examples. Classically, this was expected
    to lead to severe overfitting, but in deep learning, it often results in excellent
    generalization, a phenomenon that challenges traditional learning theory.


    PROBABILISTIC CONTEXT-FREE GRAMMAR (PCFG) A type of generative grammar used in
    linguistics and computer science where production rules are assigned probabilities.
    The thesis uses PCFGs, specifically the Random Hierarchy Model, to model data
    with a hierarchical and compositional structure.'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'RANDOM HIERARCHY MODEL (RHM) A synthetic generative model, based on probabilistic
    context-free grammars, used in the thesis to model data with a hierarchical and
    compositional structure. It consists of an ensemble of tree-like graphical models
    with random production rules, providing a tractable framework for studying how
    networks learn such structures.


    RECEPTIVE FIELD The region of the input space that a particular neuron in a neural
    network is sensitive to. In CNNs, the receptive field of a neuron is typically
    a small, local patch of the input.


    REPLICA METHOD A heuristic technique from statistical physics used to compute
    averages over disordered systems. In this thesis, it is applied to analyze the
    generalization error of kernel methods in teacher-student settings.


    SAMPLE COMPLEXITY The number of training examples required for a model to learn
    a task to a desired level of accuracy. A key goal of learning theory is to understand
    how sample complexity scales with factors like data dimension.


    SCORE FUNCTION In the context of diffusion models, the gradient of the log-probability
    density of the data at a given time during the diffusion process ($

    abla p_t(x)$). Learning this function is the central task for the backward (generation)
    process.


    SPECTRAL BIAS The tendency of neural networks trained with gradient descent to
    first learn the components of a target function that correspond to the largest
    eigenvalues of the model''s kernel. This often translates to a preference for
    learning low-frequency (smooth) functions first.


    STATISTICAL MECHANICS A branch of physics that uses statistical methods and probability
    theory to study the macroscopic behavior of systems composed of a large number
    of microscopic constituents. The thesis applies concepts and tools from statistics
    to analyze deep learning systems.


    SUPERVISED LEARNING A machine learning paradigm where a model learns a mapping
    from inputs to outputs based on a labeled training set of input-output pairs.


    TASK ARITHMETIC An empirical phenomenon observed in pre-trained models where algebraic
    operations on the models'' weight vectors (specifically, *task vectors*) correspond
    to semantic operations on the tasks the model can perform. For example, adding
    or subtracting task vectors can combine or remove skills.'
  merge: -1
  img_proc: true
- pgno: 324
  md: "TASK VECTOR The difference in weights between a pre-trained model and a model\
    \ that has fine-tuned on a specific task $(\tau = \theta_{\text{fine-tuned}} -\
    \ \theta_{\text{pre-trained}})$. These vectors are the fundamental units used\
    \ in task arithmetic.\n\nTEACHER-STUDENT SETTING A theoretical framework used\
    \ to analyze learning, where a 'student' model (the learner) is trained on data\
    \ generated by a 'teacher' model (the target function). This allows for precise\
    \ control over the properties of the data.\n\nUNSUPERVISED LEARNING A machine\
    \ learning paradigm where a model learns to find patterns and structure in unlabeled\
    \ data, without explicit input-output examples. Generative modeling is a form\
    \ of unsupervised learning.\n\nWEIGHT DISENTANGLEMENT A property identified in\
    \ this as the key mechanism for task arithmetic. It describes a situation where\
    \ distinct directions in a model's weight space are associated with localized,\
    \ non-interfering changes in the model's function space. This allows different\
    \ tasks to be manipulated independently.\n\nZERO-SHOT GENERALIZATION The ability\
    \ of a large model to perform a task it has never been explicitly trained on,\
    \ often by following a natural language description or prompt. This is a key emergent\
    \ capability of large-scale pre-trained models."
  merge: -1
  img_proc: true
