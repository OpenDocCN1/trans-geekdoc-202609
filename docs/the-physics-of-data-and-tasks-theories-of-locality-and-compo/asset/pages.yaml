  md: '# APPENDIX: PROBING HIDDEN HIERARCHIES IN DATA


    ![](img/86150bd6d44cb578b97e3eba954b7be2_245_0.png)


    Figure 54: Gaussian random field model. (a) Relative modal errors as a function
    of wave-vector magnitude $|k|$. For $|k| > \kappa^*$, errors remain large, indicating
    unsuccessful retrieval of the Fourier coefficients, for $|k| < \kappa^*$, the
    error decreases, signifying significant recovery (b). Spatial correlation function
    $C(r,t)$, showing a power decay at short distances and a cutoff at long distances.
    The correlation length increases with inversion time $t$. (c) The susceptibility
    $\chi(t)$ increases monotonically and reaches its maximum at the inversion time
    $t = T$.


    To compute $\mathbb{E}[z(u,t)z(0,t)]$, in terms of Fourier coefficients $Z(\mathbf{k},t)$,
    with $\kappa < \kappa^*$, we can assume $Z(\mathbf{k},t) \approx 0$. For with
    $\kappa > \kappa^*$, $\hat{X}(\mathbf{k},t)_0$ is approximately independent of
    $X(0)$. Thus, $Z(\mathbf{k},t)$ for $\kappa > \kappa^*$ is a Gaussian random variable
    with zero mean and variance $2\sigma_z^2$.

    The variance of $z$ is


    > $$\mathbb{E}[z(u,t)z(0,t)] \approx \int_{|k|>\kappa^*} k^{uk} 2\sigma_z^2 d^d
    k.$$\quad (378)$


    Substituting $\sigma_z^2 \approx \|k\|^{-a}$, we have:


    > $$\mathbb{E}[z(u,t)z(0,t)] \approx \int_{|k|>\kappa^*} k^{uk} 2\|k\|^{-a} d^d
    k.$$\quad (379)$


    To evaluate the integral, we consider the asymptotic behavior for different regimes
    of $r$. At short distances $r \ll 1/\kappa^*$, the integral over $k$ is dominated
    by large $\kappa$ and behaves as $\mathbb{E}[z(u,t)z(0,t)] \approx C_1 r^{a-d}$,
    where $C_1$ is a constant. At long distances $r \gg 1/\kappa^*$, the lower limit
    $\kappa^*$ (\kappa^$) introduces an effective cutoff and the covariances decay
    faster than any power law.'
