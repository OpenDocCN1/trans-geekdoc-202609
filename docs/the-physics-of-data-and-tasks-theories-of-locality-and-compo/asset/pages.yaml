    < 1/3. This aligns with human perception of visual similarity [Yoo+23].


    # RESULTS AND ANALYSIS


    Figure 22 (left panel) presents the results of this experiment. Our key findings
    are as:


    +   1. Generalization before memorization: Initially, both train and validation
    loss decrease, indicating that the model is generalizing, i.e., approaching the
    population score. However, at critical t_mem, the two losses bifurcate, signalling
    the onset of memorization. After this point, the number of copies among generated
    images steadily increases. By the end of training, all models exhibit some degree
    of memorization, with copy rates ranging from 1% for the largest training set
    to 100% for the smaller ones.


    +   2. Memorization is delayed by larger training sets: The onset of memorization
    t_mem scales approximately linearly with the training set P_i, as indicated in
    the insets of Figure 22.


    These observations suggest that early starting can effectively prevent the model
    from entering the memorization phase. As a example, the right panel of Figure
    22 displays images generated by a diffusion model on 16,384 images, with early
    starting applied. The quality and diversity of these images are quantified using
    the Frechet Inception Distance (FID), calculated using Inception v3. The model
    achieves an FID score of 5.4, indicating–despite being overparameterized– robust
    generalization, while the rate of copies is 0%. In Section F.2, we show the overfitting
    phenomenon in Stable Diffusion [Rom+22]– a text-to-image latent diffusion model–fine-tuned
    on a subset of the LAION dataset [Kad+23].


    PROGRESSIVE GENERALIZATION BEFORE MEMORIZATION We extend our analysis by conducting
    a second experiment inspired by Kadkhakae [Kad+23b]. We train two models on non-overlapping
    subsets D1 and D2 of 2,048 images from CelebA [Liu+18], a dataset with faces each,
