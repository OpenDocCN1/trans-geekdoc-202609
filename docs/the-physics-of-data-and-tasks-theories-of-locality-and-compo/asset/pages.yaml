    The functions $\kappa_0$ and $\kappa_1$ are non-analytic in $t = \pm 1$, with
    the following singular expansion [BB21]. Near $t=1$, with $u=1-t$


    ```

    $$\begin{aligned} \kappa_0(1-u) &= \frac{\sqrt{2}}{\pi}u_{i_1}^{1/2} + O(u^{5/2}),
    \ \kappa_1(1-u) &= 1-u + \frac{2\sqrt{2}}{3\pi}u^{3/2} + O(u^{5/2}). \end{aligned}$
    (208)

    ```


    Near $t = -1$, with $u=u^{3/2}$


    ```

    $$\begin{aligned} \kappa_0(-1+u) &= \frac{\sqrt{2}}{\pi}u_{i_1}^{1/2} + O(u^{5/2}),
    \ \kappa_1(-1+u) &= \frac{2\sqrt{2}}{3\pi}u^{3/2} + O(u^{5/2}). \end{aligned}$
    (209)

    ```


