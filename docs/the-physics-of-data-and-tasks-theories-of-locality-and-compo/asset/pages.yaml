- pgno: 274
  md: '# F.5 SCALING FOR THE MEMORIZATION OF KERNEL METHODS


    We now substitute the expansion of the kernel near the origin:


    ```

    $$\psi_i, K\psi_i_{L_2(\rho)} \simeq \frac{1}{\rho^2} \int \psi_i(\\mathbf{x})\mathcal{N}(\mathbf{x},
    \sigma^2 I_d) d^d\mathbf{x} - \int \psi_i(\\mathbf{y})\mathcal{N}(\\mathbf{y}|\mathbf{x},
    \sigma^2 I_d) d^d\mathbf{y}$$

    $+ \frac{C}{\rho^2} \iint \psi_i(\\mathbf{x}) \cdot \psi_i(\\mathbf{y}) |\mathbf{x}-\mathbf{y}|^{\sigma}}
    \mathcal{N}(\\mathbf{x}, \mathbf{y}, \sigma^2 I_d) d^d\mathbf{x} d^d\mathbf{y}$.$

    (416)

    ```


    The first term vanishes because $\mathcal{N}(\\mathbf{x}_c, \sigma^2 I_d)$ is
    an odd function with respect to the center $x_c$. The integral is zero. The leading
    contributions come from the second term. We again change variables to $u = (x
    - x_c)/\sigma$ and $v = (y - x_c)/\sigma$ obtaining


    ```

    $$\psi_i, K\psi_i_{L_2(\rho)} \simeq \frac{1}{\rho^2} \iint uR(||u||) \cdot vR(||v||)^{\sigma}
    ||u-v||^{\sigma} \mathcal{N}(u|0, I_d) \mathcal{N}(v|0, I_d) d^d u d^d v$.$

    (418)

    ```


    Collecting the powers of $\sigma$ we find:


    ```

    $$\lambda_i \simeq \frac{\sigma^{2+v}}{\rho^2}$.$

    (419)

    ```


    The remaining double integral is a dimensionless constant. Combining the numerator
    and denominator, we obtain the eigenvalue scaling:


    ```

    $$\lambda_i \simeq \frac{\sigma^{2+v}/P^2}{\sigma^2/P} = \frac{\sigma^v}{P}$.$

    (420)

    ```


    The training time required to learn these localized eigenfunction scales as the
    inverse of the eigenvalue. This defines the memorization timescale


    ```

    $$\tau_{mem} \sim \lambda_i^{-1} \sim \frac{P}{\sigma^v}$.$

    (421)

    ```


    This argument extends from contemporaneous work on random features in the proportional
    regime (number of neurons proportional to the input dimension) [Bon+25] to any
    isotropic kernels. Our derivation relies only on the local behavior of the kernel
    and shows that random features and neural networks in the NTK limit exhibit distinct
    behaviors.


    NUMERICAL EXPERIMENTS We confirm our theoretical scaling numerically in Figure
    70 for a one-hidden layer fully-connected network in the lazy (NTK) regime [COB19].
    Notably, the same experimental setting under a mean-field (feature learning) initialization
    [MMN18] also exhibits a memorization time consistent with our NTK-based prediction.'
  merge: -1
  img_proc: true
