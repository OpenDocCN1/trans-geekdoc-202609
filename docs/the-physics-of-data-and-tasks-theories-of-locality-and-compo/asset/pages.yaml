  md: '# APPENDIX: RACE BETWEEN MEMORIZATION AND GENERALIZATION


    Here I the identity matrix, a vector of ones and entity $e_M$ the one-hotencoding
    vector to the [MASK] symbol. The entries $[Q_{ij}]$ of $Q_t$ indicate the probability
    of the token $x_k$ transitioning from state $i$ to state $j$, i.e., $[Q_{ij}]
    = q(x_{k,j} = t)$. At the final timestep $T$, all tokens are fully masked, i.e.,
    $x_{k,T} = [MASK]$ for every $k \in [dim(x)]$. For our experiments, we use MD4
    using a batch size of 64 and a context size of 256. All other hyperparameters
    are kept consistent with the original MD4 implementation.


    # F.1.3 Random Hierarchy Model


    D3PM For our experiments on the Random Hierarchy Model, we employ convolutional
    U-Net based Discrete Diffusion Diffusion Probabilistic Models (D3PMs) [Aus+21].
    These models are tasked to predict the expectation $E(x_t|x_t)$, which parameterizes
    the reverse diffusion process. In particular, we consider a uniform diffusion
    process [Hoo21; Aus+21], where at each timestep $t$, tokens can stay unchanged
    or, with probability $\beta_t$, transition to some symbol in the vocabulary. One-encoding
    the $|V|$ states, the forward transition matrix formally reads:


    ```

    $Q_t = (1 - \beta_t)I + \frac{\beta_t}{|V|}\mathbf{1}$.

    ```


    Here is the identity and a vector of all ones. At the final $T$, the stationary
    distribution U-Net has $L$ resolution blocks in both the encoder and decoder parts.
    Each block features the following specification: filter size $s$, stride $s$,
    192 channels per layer, GELU non-linearity, skip connections linking encoder and
    decoder blocks of matching resolution to preserve multi-scale feature information.
    We include embedding and unembedding layers implemented as convolutional layers
    with a filter size of 1. This architecture is specifically aligned with the RHM''s
    hierarchical structure, where the filter size and stride of $s$ in the convolutional
    layers mirror the branching factor of the RHM tree. This design provides practical
    benefits in terms of training efficiency, it should as long as the network is
    sufficiently deep and expressive [Cag+24]. The networks are initialized with the
    maximal-update $(\mu P)$ parameterization [YH20], ensuring stable feature learning
    even in the largewidth regime. We train with Adam with a learning rate of 0.1
    and a batch size of 32. For the diffusion process, we adopt a linear schedule
    with 1,000 noise levels.'
