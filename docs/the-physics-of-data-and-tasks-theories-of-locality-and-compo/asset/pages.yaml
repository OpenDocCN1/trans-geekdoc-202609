    # B.4 GENERALIZATION BOUNDS FOR KERNEL REGRESSION AND SPATIAL ADAPTIVITY


    This appendix provides an introduction to classical generalization bounds for
    kernel regression and extends Corollary 3.4.0.1 to patches on the hypersphere.


    # B.4.1 Classical generalization bounds


    RADEMACHER BOUND. Consider the regression setting detailed in Section 3.4 of the
    main text. First, assume that the true function $f^*$ belongs to the RKHS $H$
    of the kernel $K$. Then, without assumptions on $K$, we have the following dimension-free
    bound on the excess risk, based on Rademacher complexity [Bac21],[Bie22].


    ```

    $E(\lambda, p) - E(f^*) \le C \||f^*||_H \sqrt{\frac{Tr(T_K)}{P}}$ $\quad (248)$

    ```


    where $T_K$ is the integral operator associated to $K$. For a hierarchical kernel,
    having a target with more power in the local sectors can result in a smaller $||f^*||_H$,
    hence a smaller excess risk. However, this gain is only a constant factor in terms
    of sample complexity and, importantly, being in the RKHS requires an order of
    smoothness which typically is of the order of the dimension, which is a very restrictive
    assumption in high-dimensional settings.'
