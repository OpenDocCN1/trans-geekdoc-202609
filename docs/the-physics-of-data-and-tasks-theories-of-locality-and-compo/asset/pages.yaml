  md: '# 1.5 THESIS STRUCTURE AND MAIN RESULTS


    process after a time t and uncover a phase transition at a critical time: beyond
    this point, the probability of accurately reconstructing high-level features,
    such as the class of an image, sharply differs. In contrast, the reconstruction
    of low-level features, such as fine-grained image details, evolves smoothly throughout
    the entire process. Hence, beyond the transition, even if the class has changed,
