- pgno: 134
  md: '# 8


    # TASK COMPOSITIONALITY IN WEIGHT SPACE


    The previous parts of this thesis have established how deep networks exploit the
    latent structure of data – specifically locality and compositionality – to overcome
    the curse of dimensionality. We have seen convolutional architectures are biased
    towards local functions and how diffusion models learn to hierarchically compose
    novel data from learned features. We now shift our focus to the structure within
    the data that emerges within tasks and the models themselves. The advent of large,
    pre-trained models has revealed a new and surprising form of compositionality,
    one that exists not in the input space but in the vast parameter space of the
    model’s weights.


    Many recent machine learning systems, large pre-trained models require further
    editing to enhance performance on downstream tasks [Zhu+20; Ilh+22; Ilh+23], align
    with human values [Ouy+22; Lu+22; RL+22; Gla+22], and increase robustness [Wor+22;
    San+21]; Conventional editing approaches often depend on resource-intensive fine-tuning
    across multiple tasks [Zhu+20] or human-feedback mechanisms [Ouy+22], limiting
    their scalability. Moreover, specializing a model on new tasks can degrade its
    performance on previously learned and zero-shot capabilities [MC80; Freng; Wor+22].


    More recent research has pioneered cost-effective and scalable model editing strategies
    that aim to preserve the capabilities of the pre-trained model. These methods
    act directly on the model weights through arithmetic or weight interpolation techniques
    [Ilh+23; Ilh+22; Wor+22; Wor+22; IHS23; Fra+20; DY+22; MR21; Li+22; Sj20; Izm+18]
    and circumvent the need for expensive fine-tuning. These approaches are based
    on the key observation that arithmetic operations performed on fine-tuned weights
    respond to analogous operations on the model’s function [Ilh+23]. For example,
    by summing the relative weight vectors of a model between pre-training and fine-tuning
    on separate tasks, a new model can be created that exhibits enhanced performance
    on both tasks. Conversely, subtracting a task’s vector can effectively make the
    model ‘forget’ that specific skill.


    Parts of this chapter have been previously published in: Ortiz-Jimenez, G., Faverno,
    A. and Fross, P. 2023. Task Arithmetic in the Tangent Space: Improving Editing
    of Pre-Trained Models. In Advances in Neural Information Processing Systems (NeurIPS),
    36, pp.66727-66754. Oral presentation. These authors contributed equally.


    119'
