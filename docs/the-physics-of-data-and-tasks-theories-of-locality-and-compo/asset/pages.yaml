  md: 'parameters of multiple fine-tuned models has been proposed to produce superior
    multi-task models [Ilh+23; Li+22; Ill+22; Wor+22a] to avoid catastrophic forgetting
    [Freq99; MC8] and even provide a better starting point for subsequent fine-tuning
    [Cho+22; DY+22]. Interestingly, the benefits of weight ensembles and interpolations
    extend to models trained from scratch, as as they are properly aligned before
    merging [AHS23; Sj20]. This phenomenon has been observed in downstream performance,
    further emphasizing the potential of weight interpolation and task arithmetic
    techniques as the ones used in this study.


    # LINEAR VS NONLINEAR REGIME


    Extensive research has been conducted on comparing generalization and dynamical
    properties of neural networks in linear and nonlinear regimes [For+20; Gei-bob;
    Pac+21; Bar+21; VBN22; Pet+22] and investigating specific inductive biases [Yu++;
    Tan+20; BMDH2; CLI21; MLL20; Ach+21; Mal+22]. In addition to theoretical understanding,
    several studies have applied linearized models for practical purposes, such as
    predicting fine-tuning generation [Des+21] and training speed [Zen+20], as well
    as enhancing calibration [Mad+21] and few-shot performance [A+20]. Our work serves
    as another example of where the utility of linearized models provides benefits
    but also provide valuable insights.


    # FEATURE DISENTANGLEMENT


    The notion of disentanglement lies at the heart of representation learning, where
    ideal representations are assumed to separate distinct data variation factors
    along directions in the feature space [BCV13; Hig+18; AS18]. A multitude of approaches
    in generative modeling [Hig+17; RMW14; Che+16] and self-supervised learning [Che+20;
    Rad+21; BHB19; Loc-19] strive to achieve this. Our investigation, however, explores
    distinct weight disentanglement within the framework of task arithmetic. Departing
    from the static perspective of feature disentanglement weight disentanglement
    connects weight space and function space, thereby enriching our understanding
    of disentanglement in neural networks from a functional standpoint. Several studies
    have previously attempted to exploit a similar notion by inducing the learning
    of task-subnetworks within a larger network [Wor+20; Hav+21; WTB20; ML18; MDL18;
    MGF15; Hu+22]. To the best of our knowledge, our work is the first to demonstrate
    the natural emergence of such phenomena in specific semantically meaningful tasks
    during CLIP pre-training.'
