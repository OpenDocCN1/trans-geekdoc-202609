  md: "# E.3 EXPERIMENTAL DETAILS 243\n\n# RANDOM HIERARCHY MODEL\n\nWe train the\
    \ U-Net-based Discrete Denoising Diffusion Probabilistic Model (D3PM), optimizing\
    \ the diffusion loss derived from a variational bound on the negative likelihood\
    \ [SD+15]. Following Austin et al. [Aus+21], we use the network to predict the\
    \ conditional expectation $\\mathbb{E}[x(0)|x(t)]$, which parameterizes the reverse\
    \ diffusion process.\n\nThe convolutional U-Net consists of $L$ resolution blocks\
    \ in both the encoder and decoder, with filter size of $s$, stride of $s$, and\
    \ 8192 channels. Each block uses GELU activation functions, link encoder and decoder\
    \ layers with the same resolution. The model also includes embedding and unembedding\
    \ layers, implemented as convolutions with filter size.\n\nWe initialize the network\
    \ using the maximal-update $(\\mu P)$ parameter [YH20]. This allows stable learning\
    \ dynamics even in large models. The model is trained with SGD with a learning\
    \ rate of 1, a batch size of 32, and momentum parameter of 0.9. The diffusion\
    \ process follows a linear schedule with 1,000 noise levels. To prevent overfitting,\
    \ we apply early stopping based on the validation loss, halting training when\
    \ it plateaus or begins to increase.\n\n# LANGUAGE DIFFUSION MODEL Our experiments\
    \ are based on the codebase of MD4 [Shi+24]: https://github.com/googledeepmind/md4.\
    \ MD4 is a masked diffusion model. At each step $t$, non-masked tokens either\
    \ remain unchanged or transition to [MASK] with probability $\beta_t$. Using a\
    \ one-hot-encoding representation of the $|\\mathcal{V}|+1$, the forward transition\
    \ matrix is given by:\n\n> $Q_t = (1 - \beta_t)I + \beta_t e_M^\top$.\n\nwith\
    \ the identity matrix $I$, one at vector and $e_M$ the one-hot-encoding vector\
    \ corresponding to the [MASK] symbol. For the final time $T$, all tokens are masked,\
    \ i.e., $x_t(T) = [MASK]$ for every $i \\in [dim(x)]$. We train MD4 with batch\
    \ size 64 and context size 1024 or 4 Hioos for a single epoch. All other hyperparameters\
    \ are kept unchanged.\n\n# DIFFUSION MODEL Our experiments are\n\nbased on the\
    \ codebase of Improved DDPMs [ND21]: https://github.com/openai/improved-diffusion.\
    \ In particular, we train a DDPM with de-128 channels, 3 resolution blocks, 4000\
    \ diffusion steps, cosine noise schedule, learning rate $10^{-4}$ and batch size\
    \ 128 for 10 epochs using a hybrid objective [ND21]."
