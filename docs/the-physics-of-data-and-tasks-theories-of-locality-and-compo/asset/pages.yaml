    confirms the presence of eigenfunctions localized across the different data domains
    and the fact that task arithmetic occurs thanks to the use of those. Indeed, thanks
    to this localization, CLIP models can effectively separate the representation
    of tasks and carry out task-specific operations without interference. We believe
    that further investigation into this intriguing phenomenon holds the potential
    to deepen our understanding of these models.


    > While we have shown that localized eigenfunctions play a crucial role in task
    arithmetic, it is important to note that they are not always necessary. In fact,
    the task arithmetic property can hold even if the eigenfunctions used to represent
    a single task cancel outside the corresponding domain. Indeed, although eigenfunctions
    are linearly independent on the union of the domains, they are not necessarily
    independent when evaluated on a single domain and, in general, can cancel out.
    However, if the eigenfunctions, e.f., they are locally independent, then the existence
    of localized eigenfunctions becomes a necessary condition for task arithmetic.
    This means that if the eigenfunctions are locally independent and not localized,
    task arithmetic is not possible. We provide some analytical examples of the latter
    case in Section G.2, including the NTKs of fully-connected and convolutional networks
    at initialization.


