    # 5.5 CONCLUSIONS


    In this chapter, we showed that when data exhibit a hierarchical structure, the
    changes induced by forward-backward experiments in diffusion models reveal a growing
    correlation length and susceptibility near a phase transition. At this critical
    point, changes in the data become highly regular, reflecting changes in deep latent
    variables. In particular, we focused on understanding how modifications in the
    latent variables manifest in the data, in contrast with common approaches which
    attempt to reconstruct the latent representations from visible data.


    Our predictions for a hierarchical model were confirmed through experiments across
    different natural data modalities, showing a remarkable level of universality.
    This supports the hypothesis that hierarchical and compositional structures are
    fundamental, universal properties underlying natural data as diverse as images
    and text.


    Such fundamental analyses have the potential to impact practical applications.
    For example, they can enhance the interpretability of deep networks, whose representations
    are believed to reflect the hierarchical structure of data. Moreover, the diffusion
    dynamics of high and low-level features can suggest improved training strategies
    for instance, to avoid collapse when fine-tuning diffusion models [BAT24].


    Future work may include interpreting the large, correlated changes in text of
    grammatical structure and context variables, possibly sharpening these concepts
    through the data-driven method introduced in this study. Moreover, better capturing
    the grammatical structure of real languages may require considering more general
    latent models involving context dependencies. A challenge for future work is extending
    our theoretical analysis to such cases.'
