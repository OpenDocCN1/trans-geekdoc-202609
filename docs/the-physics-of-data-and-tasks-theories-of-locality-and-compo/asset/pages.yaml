    # 4.6 CONCLUSIONS


    We have argued that reversing in denoising diffusion models opens a window on
    the compositional nature of data. For synthetic hierarchical generative models
    of data, where the Bayes optimal denoising can be exactly computed, low-level
    features can change at small times, but the class remains often the same. At larger
    times, a phase transition is found where the probability of remaining in the same
    class suddenly drops to random chance. Yet, low-level features can persist and
    compose the new sample. Strikingly, this theoretical analysis characterizes the
    results well with ImageNet, where the denoising is performed by a trained U-Net.
