    sentences, and biological sequences such as proteins show primary, secondary,
    and tertiary structural organization. Deep neural networks are believed to exploit
    this compositionality by layer learning, increasingly abstract representations.
    Post hoc analyses reveal that neurons in trained networks respond to progressively
    more complex features [LBH15; ZFI14; Doi20], mirroring the hierarchical organization
