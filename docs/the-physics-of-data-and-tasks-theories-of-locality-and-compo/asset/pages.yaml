    of the student''s structure, i.e., the algorithm, is as crucial as the role of
    the teacher, i.e., the task. Indeed, using a fully-connected student with no prior
    on the task''s locality would result in an error''s decay caused by dimensionality.
    However, in contrast to fully-connected students, shallow students are only able
    to learn tasks with the same structure. In particular, any task entails nonlinear
    interactions between patches – which are arguably crucial in order to learn data
    image – belongs to their null space.


    > See, e.g. Lee et al. [Lee+17] for the equivalence between infinitely-wide networks
    and Gaussian random fields with covariance given by the RFK.'
