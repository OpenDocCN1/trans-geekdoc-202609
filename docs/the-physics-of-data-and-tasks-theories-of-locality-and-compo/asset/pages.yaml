  md: '# 7 RACE BETWEEN MEMORIZATION AND GENERALIZATION


    The previous chapter investigated how diffusion models achieve generalization,
    learning to capture the underlying structure of data training. However, instead
    of learning to approximate the data distribution, a model can simply store and
    reproduce the specific training examples it has seen. In, since the score function
    is learned from the empirical training distribution, minimizing the training loss
    often leads the model to reproduce the training data itself—a phenomenon known
    as memorization [Car+23; Som+22]. This phenomenon is observed in practical settings,
    as models trained on sensitive privacy and copyright concerns, or proprietary
    data may inadvertently regenerate content, exposing sensitive information or violating
    intellectual property rights [Wua+22; HP+23].


    Despite the empirical success of diffusion models, the mechanisms underlying their
    ability to generalize remain poorly understood. The prevailing view—rooted in
    classical learning theory—is that generalization depends on underparameterization
    [Yoo+23; Zha+23; Kad+23]: only models that lack the capacity to memorize their
    training data are expected to generalize. In this work, we go beyond this by demonstrating
    that even overparametri diffusion models exhibit generalization during training
    before they memorizing the data. We systematically investigate this phenomenon,
    showing that generalization and memorization are not mutually exclusive but unfold
    as distinct phases of training. The main contributions of this chapter are as
    follows:


    We empirically demonstrate the transition from generalization to memorization
    during training in a range of overparameterized diffusion models—including Improved
    DDPM [ND21], Stable Diffusion [Rom+22], MD4 [Shi+24], and D3PM [Aus+21]—on both
    images and text data. We measure generalization and metrics and systematically
    vary the training set size, showing that generalization improves boldly, before
    the onset of memorization.


    In all settings, we find the empirical law that the onset of memorization requires
    a number of training steps that is proportional to


    > Parts of this chapter have been previously published in:

    Faern, A., Schoenchi, A., and Wyart, M., 2025. Bigger Isn''t Always Memorizing:
    Early Stopping Overparameterized Diffusion Models. ICML 2025 Workshop on The Impact
    of Memorization on Trustworthy Foundation Models.

    * These authors contributed equally.'
  merge: -1
  img_proc: true
