- pgno: 87
  md: 'U-Net with the skip connections between the encoder and decoder parts mimics
    the upward and downward iterations of belief propagation, where the downward process
    mixes upward and downward messages. In fact, building on the present work [Mei24]
    U-Nets are capable of effectively approximating the belief propagation denoising
    algorithm. Investigating whether the function learned by U-Net approximates BP
    is a promising avenue for future work. Our analysis focused on score-based diffusion,
    which holds for more recent generative frameworks like flow matching [Lip+22]
    and stochastic interpolants [ABVE23]. These methods rely on a continuous transformation
    from data to noise, and the phase transition remains uncovered as a signature
    of the data''s latent hierarchical structure, rather than of specific noise paths.


    In the present work, we used the internal representation of networks as a proxy
    for the hierarchical structure of images. An interesting direction for future
    work will be using deep hierarchical segmentation techniques [Arb+10; Ge+23; Xie+21;
    ZM20] to extract latent variables, so as to test our predictions on their evolution
    in forward-backward experiments. Finally, future work can test theoretical predictions
    on other modalities successfully handled by diffusion models, such as language
    and biological structures.


    The interplay between the hierarchy in feature space and time revealed here may
    help understand the puzzling success of diffusion methods, including the number
    of data needed to train such methods, or why they generalize and not simply memorize
    the empirical distribution on which they were trained [Som+22; Car+23; Yoo+23].
    More generally, our results put forward hierarchical generative models as tools
    to understand open questions for other methods, ranging from the emergence of
    new skills by the composition of more elements in foundation models to that of
    transferable representations in self-supervised learning.'
