- pgno: 214
  md: "In this case, we show that the error decays as $P^{-1/d_{at}(3)}$, i.e. the\
    \ rate is cursed by the input dimension. The physical meaning of this result is\
    \ that the hierarchical structure we are considering is still too complex and\
    \ cannot be learned efficiently. In other words, hierarchical convolutional networks\
    \ are excellent students, since they can adapt to the spatial structure of the\
    \ task, but bad teachers, since they generate global functions that are too complex\
    \ to be learned efficiently.\n\n# B.7.4 Extensions to different normalizations\
    \ and overlapping patches\n\nThis section investigates the robustness of our results\
    \ to the input distribution, i.e. for data outside the multisphere $M^{S-1}$,\
    \ and relaxes the non-overlapping patches assumption.\n\n**Inputs in $\\mathbb{R}^d$.**\
    \ While our analysis requires that each of the input data is normalized to a unit\
    \ sphere, this normalization is not the standard one used for neural networks.\
    \ Therefore, in this section, we investigate the robustness of our predictions\
    \ to data distribution. In particular, we consider data uniformly distributed\
    \ in the hypercube, $x \\in [0,1]^d$, and data with standard Gaussian distribution,\
    \ $x \\sim \\mathcal{N}(0, I_d)$. First, we extend the definition of the RFK and\
    \ NTK to inputs in $\\mathbb{R}^d$.\n\n**Definition B.7.1** (RFK and NTK of hierarchical\
    \ CNNs for inputs in $\\mathbb{R}^d$). Let $x, y \\in \\mathbb{R}^d$. Denote tuples\
    \ of the kind $i_1, i_2, \\dots i_m$ with $i_{l \to m}$ for $m \\ge 1$. For $m\
    \ < l$, $i_{l \to m}$ denotes the empty tuple. For each tuple $i_{2 \to L+1}$\
    \ and $s$ a divisor of $d$, denote with $\theta_{i_{2 \to L+1}}$ the angle between\
    \ the $s$-dimensional patches of $x$ and $y$ by the same sample, i.e.\n\n> $$\\\
    frac{x_{i_{2 \\to L+1}}^T y_{i_{2 \\to L+1}}}{\\|x_{i_{2 \\to L+1}}\\| \\|y_{i_{2\
    \ \\to L+1}}}\\quad (273)$\n\nFor $1 \\le l \\le L$, denote with $\\{x_{i_{2 \t\
    o l+1}}, y_{i_{2 \to l+1}}\\}$ the sequence of patches obtained by letting the\
    \ indices of the tuple $i_{2 \to l}$ vary in their respective range. Consider\
    \ a hierarchical CNN with filter sizes $(s_1, \\dots, s_L)$, $P_L \\ge 1$ and\
    \ all the weights $w_l^{(1)}, w_l^{(2)}, \\dots, w_l^{(L)}$ initialized as Gaussian\
    \ random numbers with zero mean and unit variance."
