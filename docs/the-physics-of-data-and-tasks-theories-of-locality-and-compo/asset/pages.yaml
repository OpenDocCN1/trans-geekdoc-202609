  md: '# 4.1 RELATED WORK


    To model theoretically the compositional structure of images, we consider hierarchical
    generative models of data where the structure of the latent variables is tree-like.
    We believe propagation to study the optimal denoising dynamics for such data and
    obtain the evolution of the latent variables'' properties for different levels
    of correlation noise. In the limit of a large tree depth, analysis reveals a phase
    transition for the probability of reconstructing the root node of the tree – represents
    the class label of a data point – at a specific threshold. Conversely, the probability
    of reconstructing low-level latent varies evolves throughout the denoising diffusion
    process. After the transition, low-level features of the original datum may persist
    in composing a generated element of a new class, as we empirically observe in
    ImageNet. Finally, we show numerically that the dynamics of the latent variables
    is reflected in the hidden representation of deep networks previously trained
    on a supervised classification task on these data.


    # 4.1 FORWARD-BACKWARD PROTOCOL IN DIFFUSION-BASED MODELS


    Ho et al. [HJA20] introduced the "forward-backward" protocol to probe diffusion-based
    models, whereby an image with a controlled level of noise is then denoised using
    a reverse-time diffusion process. It led to the observation that "when the noise
    is small, all but fine large-scale features are preserved". Our overall work agrees
    with the first part of the statement, it disagrees with the second. Our work also
    provides a systematic quantification of the effects of forward-backward experiments,
    going beyond qualitative observations based on individual images as in [HJA20].
    Specifically, we introduce quantitative observations that characterize the latent
    features of images and perform experiments with state-of-the-art models, averaging
    over 10³ ImageNet samples. The forward-backward protocol was also studied in Behjoo
    and Chertkov [BC23] to speed up the generation of images.


    # THEORY OF DIFFUSION MODELS


    Most of the theoretical work on diffusion models considers simple models of data.
    Under mild assumptions on the data distribution, diffusion models exhibit a sample
    complexity that scales exponentially with the data dimension [BMR20; OAS23]. This
    curse of dimensionality can be mitigated through stronger distributional assumptions,
    such as considering data lying within a low-dimensional latent subspace [DB22;
    Che+23; Yua+23], Gaussian mixture models [BM23; SCK23; Cui+23], graphical models
    [MW23], or data distributions that are factor-'
