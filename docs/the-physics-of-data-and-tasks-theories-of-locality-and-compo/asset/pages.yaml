    $K_{\text{NTK}}(\mathbf{x},\mathbf{x}'')=\lim_{H\to\infty} \nabla f(\mathbf{x};\theta_0)^top
    \nabla f(\mathbf{x}'';\theta_0) \quad (8)$

    ```


    For a two-layer ReLU network with normalized inputs, the NTK can be computed in
    closed form. If $t = \mathbf{x}^top\mathbf{x}''$, then [BM19]:


    ```

    $K_{\text{NTK}}(\mathbf{x},\mathbf{x}'')=t\frac{\pi-\arccos(t)}{2\pi\|+\\frac{(\pi-\arccos(t))\sqrt{1-t^2}}{2\pi}
    \quad (9)$

    ```


    Intuitively, in this regime, small changes of parameters can interfere, changing
    the output by $O(1)$ – which is sufficient for learning, but not changing the
    Jacobian. This means the model effectively learns by combining a fixed set of
    features defined at initialization.


    The performance of kernels is determined by their spectra.


    Given a kernel $\mathcal{K}$, generalization is governed by the spectral decomposition
    of the integral operator $T_K$, defined as


    ```

    $(T_K f)(\mathbf{x})=\int \mathcal{K}(\mathbf{x},\mathbf{x}'')f(\mathbf{x}'')''
    \quad (10)$

    ```


    With eigenfunctions $\phi_p$ and eigenvalues $\lambda_p (T_K\phi_p=\lambda_p\phi_p)$
    [CDV07], gradient descent first learns components of the target function aligned
    with eigenfunctions to larger eigenvalues – phenomenon known as *spectral bias*.
    Given $P$ elements, only the components aligned with the top $O(P)$ are effectively
    learned [BCP20; SGW20]. By Wiet and Maal [BM19] has analyzed the spectrum of the
    NTK for two-layer fully-connected networks, showing that eigenvalues decay with
    the frequency of the corresponding eigenfunctions. This explains why networks
    exhibit a preference for learning low-frequency (smooth) functions. Moreover,
    the same spectral property persists in deeper fully-connected networks, suggesting
    that in this regime, depth alone does not provide benefits to generalization [Ato19;
    Ato20].


    Feature/representation learning: weights evolve significantly.


    BEYOND THE KEREL REGIME The kernel provides a tractable framework for analyzing
    generalization in overparameterized neural networks. However, a key limitation
    of this regime is the absence of *feature* or *representation learning*: parameters
    remain close to their random initialization, and the network behaves effectively
    as a fixed feature extractor.


    To address this, an infinite-width scaling has been proposed, in which the network
    output is rescaled by a factor $H^{-1}$ as opposed to $H^{-1/2}$. This modification
    leads to fundamentally different training dynamics: to achieve $O(1)$ outputs,
    weights must evolve'
