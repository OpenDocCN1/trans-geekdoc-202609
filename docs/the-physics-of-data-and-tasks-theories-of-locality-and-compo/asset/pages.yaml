  md: '# 2.7 CONCLUSIONS


    This work shows that efficient learning is possible in high-dimensional settings
    when the target function admits a compositional structure – specifically, when
    it can be expressed as a sum of constituent functions, each depending on a smaller
    subset of variables size t. By using a kernel that incorporates this structure
    with s-dimensional constituents, the learning curve exponent is independent of
    $d$ and governed by $s \ge t$, optimal for $s=t$ and null if $s < t$.


    In the context of image classification, these results are related to the “Bag
    of Words” interpretation. Consider images composed of $M$ features, each consisting
    of $t$ adjacent pixels, where classes correspond to specific (possibly overlapping)
    subsets of such features. If features can be located anywhere in the image, then
    data lie on a $2M$-dimensional manifold. We expect a one-hidden-layer convolutional
    network with filter size $s \ge t$ to learn the task efficiently with a learning
    curve exponent governed by $s$ and independent of $M$. In contrast, a fully-connected
    network operating in the lazy training regime would exhibit poor generalization
    in this setting for large $M$ due to the curse of dimensionality.


    Our analysis does not account for the hierarchical compositional structure of
    real data, where large features are composed of smaller sub-features. It is intuitively
    clear that depth and locality together are well-suited for such data structure
    [Bie21; Pog17a]. In the next chapter, we will extend the present framework to
    this case.'
