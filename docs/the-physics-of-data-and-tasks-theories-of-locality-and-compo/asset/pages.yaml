- pgno: 152
  md: '# CONCLUSIONS


    The remarkable effectiveness of deep neural networks, particularly in high-dimensional
    domains where learning is in principle statistically tractable, presents a foundational
    paradox in modern machine learning. The resolution to this paradox, as argued
    throughout this thesis, lies not in the learning algorithms alone, but in the
    latent structure inherent in natural data and the tasks we ask models to perform.
    This work has advanced the thesis that locality and compositionality are key principles
    that enable learning, providing a theoretical lens through which understand how
    neural networks overcome the curse of dimensionality. We considered a hierarchy
    of abstraction, from the local structure of data to the compositional algebra
    of tasks within a model''s weight space, employing tools from statistical physics
    and learning theory to build a quantitative, ''physical'' theory of data and tasks.


    This work was structured into three primary investigations. In Part II, we began
    with an analysis of convolutional neural networks (CNNAs) in the analytically
    tractable limit of infinite width. We established that efficient learning is possible
    when the target function can be decomposed into a sum of spatially located components,
    with generalization performance governed by the local scale of the target function
    rather than the ambient dimension. However, we also exposed the limitations of
    this ''lazy'' regime, demonstrating its inability to efficiently learn with long-range
    correlations and a hierarchical structure motivating the need to move beyond kernels
    and towards models capable of feature learning.


    Part III proceeded to generative modeling, asking how deep models learn complex,
    structured data. Using the Random Hypothesis Model - a synthetic, yet real, model
    for data with built-in compositional and hierarchical structure we developed a
    theory of composition, revealing a phase where high-level semantic features are
    assembled from a set of learned lower-level components. We argued that diffusion
    models learn the underlying ''grammar'' of the data through a hierarchical clustering
    mechanism of features, akin to a number of samples that scales polynomially with
    data dimension. This provides a concrete mechanism by which generative models
    can become creative, composing novel outputs from familiar parts. Moreover, we
    framed the trade-off between generalization and memorization as a race between
    competing time scales during training.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# CONCLUSIONS


    Finally, in Part IV, we considered the composition of tasks themselves. We investigated
    the phenomenon of task arithmetic in large, pre-trained models, where entire skills
    can be manipulated through algebraic operations on model weights. We demonstrated
    that this capability is not merely a consequence of model linearity, previously
    hypothesized. Instead, we identified weight disentanglement as the key underlying:
    structural property, emergent from pre-training, where distinct directions in
    weight space correspond to localized and semantically meaningful functions.


    # 9.1 KEY FINDINGS AND THEIR SYNTHESIS


    The primary contribution of this thesis is a quantitative framework for how structure
    enables learning. Our main findings can be synthesized as follows:


    +   1. LOCALITY IS THE PRIMARY DRIVER FOR GENERALIZATION IN SHALL COMPOSITIONAL
    TASKS Our analysis in Part II clarified the distinct roles of architectural priors
    in CNNs. In the kernel regime, it is the spatial locality of the receptive field,
    not weight-sharing, that dictates the asymptotic scaling of the learning curve.
    This result provides a precise, quantitative answer to why convolutional architectures
    are so effective on tasks, showing that the effective dimension for learning comes
    the filter size, rather than the input dimension. Findings underscores that even
    simple structural assumptions, when correctly matched by the model''s architecture,
    can yield exponential gains in sample efficiency.


    +   2. HIERARCHICAL LEARNING REQUIRES FEATURE LEARNING The limits of the kernel
    regime became apparent when we considered hierarchical tasks involving long-range
    correlations. We found that even deep CNNs, when constrained to the lazy training
    regime, fail to efficiently learn functions by a matched deep architecture. This
    negative result is significant, as it implies that the benefits of depth for learning
    functions are not merely about representation but are intrinsically tied to the
    dynamics of feature learning, where the kernel itself adapts to the data. This
    provides a clear theoretical motivation for studying the feature-learning regime.


    +   3. GENERATIVE MODELS LEARN A ‘GRAMMAR’ OF DATA Our investigation into diffusion
    models in Part III provided a new lens for understanding generative modeling.
    By studying the Random Hierarchy Model, an ensemble of simple formal grammars
    with random rules, we moved beyond simplistic data assumptions. The discovery
    of a phase transition in the reverse diffusion process – where the semantic class
    of a sample can change'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# 9.2 COMPARISON WITH OTHER THEORETICAL FRAMEWORKS


    while low-level features are preserved and recombined – provided strong evidence
    for a compositional generation process. We showed that the sample complexity for
    learning the grammar rules scales polynomially, not exponentially, with dimension.
    This means the model learns to cluster features that appear in statistically similar
    contexts, a hierarchical process that effectively reconstructs the latent structure
    of the grammar. This explains not only how models can generate, coherent data
    but also how models trained on limited data outputs that are only locally coherent,
    a phenomenon confirmed in both text and image data


    +   4. TASK-SPECIFIC KNOWLEDGE IS LOCALIZED The exploration of Part IV revealed
    a novel form of compositionality at the model itself. Our central finding is that
    the ability to compose and subtract tasks is enabled by weight disentanglement
    – an emergent property of pre-training where distinct direction parameters control
    functionally aspects of the model’s behavior. By showing that this property is
    absent at initialization and can be enhanced by linearizing the model, we provided
    both mechanistic explanation for task arithmetic and a practical method for improving
    it. This recasts the geometry of the weight space of large models as a structured
    space where tasks correspond to localized, composable subspaces.


    Synthesizing these points, this thesis posits that deep learning is effective
    because it operates on a cascade of compositional structures. It begins with features
    in the input, builds hierarchical representations that mirror the compositional
    nature of the world, and culminates in a modular organization of knowledge in
    weight space that allows for the flexible composition of skills.


    # 9.2 COMPARISON WITH OTHER THEORETICAL FRAMEWORKS


    A central result of this thesis is that the Random Hierarchy Model characterized
    by non-Gaussian statistics predicts qualitatively different phenomena from other
    common theoretical data models. It is instructive to contrast our findings from
    Part III with two representative frameworks.


    GAUSSIAN MIXURE MODELS (GMMS) Some theoretical works model data as a mixture of
    Gaussians, where each mode might represent a distinct class. In these models,
    the reverse diffusion process exhibits a crossover known as *speciation*, where
    the dynamics collapses into one of the modes at a characteristic time or noise
    scale [Bir+24; Amb23]. Although this resembles the class phase transition we inden-'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# CONCLUSIONS


    tify, it lacks compositionality. In the RHM, following the class change, low-level
    features from the original sample are preserved and recombined to the new sample.
    This compositional process – we confirm empirically in natural data – cannot be
    explained by GMMs. Furthermore, as mean-field models with no inherent spatial
    structure, GMMs do not present the growing susceptibility or length scale at transition,
    which are central positions of the RHM.


    GAUSSIAN STATISTICS AND SPECTRAL BIAS Models like Gaussian Random Fields (GRFs),
    are fully specified by their second-order statistics (i.e., two-point correlations).
    While a GRF can be tuned to match the RHM’s two-point statistics, it fundamentally
    lacks the higher-order correlations induced by the RHM''s latent structure. Crucially,
    the RHM''s context-free nature reduces complex multiplicities among observable
    events to effective pairwise correlations involving the latent variables. This
    property allows a deep learning algorithm to efficiently infer the hierarchy by
    clustering groups that correspond to the same latent variable, yielding the “local-to-global”
    learning dynamics we predict and observe.


    This mechanism cannot be explained by models based on second-order statistics.
    In these settings, the score is driven by a spectral bias: eigenmodes of data
    covariance are learned in decreasing variance, meaning that low-frequency (global)
    components are acquired first [Wan25]. This predicts an opposite phenomenology,
    where global structure appears early in training, and local details are learned
    later.


    The distinction also appears in the generative process: as shown in Chapter 5,
    a GRF exhibits a dynamical correlation length that grows monotonically with the
    inversion time. Whereas, in the RHM, the correlation length peaks at a finite
    time corresponding to the phase transition.


    The concurrence of a “local-to-global” dynamics and a susceptibility in real systems
    provides strong evidence that hierarchical compositionality, not just second-order
    statistics, is a key principle governing how deep models learn and generate data.


    # 9.3 LIMITATIONS AND FUTURE DIRECTIONS


    This thesis opens up several avenues for inquiry and highlights areas where our
    understanding remains incomplete.


    BEYOND SIMPLIFIED MODELS OF HIERARCHY Throughout Part III of this thesis, the
    Random Hierarchy Model (RHM) served as the basis for developing a tractable theory
    of generating and learning compositional data. It was conceived as a minimal model
    that cap-'
