  md: "# 1.1 INTRODUCTION TO DEEP LEARNING\n\n# 1.1.2 Theoretical puzzles\n\nDespite\
    \ the remarkable empirical success of deep neural networks, our theoretical understanding\
    \ of how high-dimensional tasks remain limited. A central question is: How many\
    \ data points are needed for a model to learn a task with good precision? That\
    \ is, does the generalization error $\\mathcal{E}(P)$ decrease as the number of\
    \ training examples $P$ increases? Remarkably, empirically, for many high-dimensional\
    \ tasks, $\\mathcal{E}(P)$ is fitted by a power-law decay:\n\n```\n$$\\mathcal{E}(P)\
    \ \\sim P^{-\\beta},$\n```\n\nwhere the exponent $\beta$ captures how efficiently\
    \ a model learns from data [Hes17; Kap+20; Hot+22]. These empirical scaling laws\
    \ show that $\beta$ depends on the dataset, the task, and the algorithm. General\
    \ works suggest that $\beta$ would be vanishing for large input dimension $d$,\
    \ implying that learning would be practically impossible in settings where the\
    \ dimension is large, which is the case in practice (e.g., images where $d$ is\
    \ the number of pixels and color channels). This is the essence of the curse of\
    \ dimensionality. In high-dimensional spaces, volume grows exponentially with\
    \ $d$, and the typical distance between nearest-neighbor points decreases very\
    \ slowly: $d \\sim P^{-1/d}$. Consequently, only weak regularity assumptions on\
    \ the task — like resembling a 1-Lipschitz function $f$, where $|f(x) - f(x')|\
    \ \\le |x - x'|$ — lead to $\beta \\propto 1/d$ [LB04; Wai19]. For large $d$,\
    \ this means that the number of samples $P$ needed to generalize almost extremely,\
    \ even exceeding the number of atoms in the observable universe.\n\nThe empirical\
    \ success of deep learning in high-dimensional tasks, despite the curse of dimensionality,\
    \ highlights a fundamental puzzle. If high-dimensional data can be learned efficiently,\
    \ they must possess under structure: symmetries, invariances to transformations,\
    \ or other forms of regularity that make the problem tractable. This leads to\
    \ several critical questions: *What is the nature of the exponent $\\beta$?* *How\
    \ do neural networks harvest this structure through architectural choices — such\
    \ as depth, convolution, or weight sharing — that encode inductive biases?* Addressing\
    \ these questions is among the most fundamental and practical problems in deep\
    \ learning, as it directly impacts the sample requirements for achieving a given\
    \ precision and, influence model training and scaling.\n\nA longstanding hypothesis\
    \ attributes the success of deep networks to the compositionality of data: the\
    \ notion that objects are composed of parts, which in turn are composed of sub-parts.\
    \ Natural data is often hierarchical in this sense. For example, images contain\
    \ edges, textures, and objects at different spatial scales; language exhibits\
    \ a hierarchical grammatical structure, from words to full\n\nCurse of dimensionality:\
    \ the sample complexity grows exponentially with the input dimension.\n\nImages\
    \ and- language display a hierarchical and compositional structure."
  merge: -1
  img_proc: true
