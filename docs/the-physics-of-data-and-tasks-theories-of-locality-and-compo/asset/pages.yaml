  md: "# 5 PROBING HIDDEN HIERARCHIES IN DATA\n\nIn the last chapter, we introduced\
    \ *forward-backward experiments*, where a controlled level of noise is added to\
    \ a starting image and then removed to generate a new one [HJa20; SFW25; BC23].\
    \ For small amounts of noise, low-level features of the image change. Passed a\
    \ transition point, the class is likely to change, but remarkably, some of the\
    \ low-level features of the original image are still retained, as predicted in\
    \ simple hierarchical models of data structure. However, this analysis is limited\
    \ to image modality. Moreover, the geometrical structure of the changes occurring\
    \ in such a process is not known.\n\nIn this chapter, we derive the length scale\
    \ associated with changes occurring in the forward-backward protocol with the\
    \ RHM, and we experimentally that our predictions hold in both language and image\
    \ datasets. Specifically, in the generative model of hierarchically structured\
    \ data, using a mean-field description of the forward-backward diffusion process,\
    \ we show theoretically that the tokens are correlated over a length scale that\
