    \mathbf{q}) + \sum_{i \in P_l} \delta(\mathbf{k}_l, \mathbf{0})\n+ \sum_{i \in
    P_i} \epsilon^q e^{\mathbf{q}_i^T x} \delta(\mathbf{k}_l^{(s)}, \mathbf{0}) \delta(\mathbf{k}_{s-o+1}^{(o)},
    \mathbf{q}_i) \delta(\mathbf{q}_{o+1}^{(s-o)}, \mathbf{0})$\n+ \sum_{i \in P_i}
    \epsilon^q e^{\mathbf{q}_i^T x} \delta(\mathbf{k}_l^{(s)}, \mathbf{0}) \delta(\mathbf{k}_{s-o+1}^{(o)},
    \mathbf{0}) . \quad (155)$

    ```


    For $k \in \mathcal{F}^u$, with $u=1, \dots, s$, the deltas which set the first
    component of $k$ to $0$ are satisfied, if


    ```

    $\int_{[0,1]^d} d^x d^y K^{LC}(x,y) e^{\mathbf{k}_l^T x} e^{\mathbf{k}_k^T y}
    = \frac{1}{2} \sum_{q} \lambda_q \delta(\mathbf{k}_l, \mathbf{q}) e^{\mathbf{k}_k^T
    y} + \sum_{q} \epsilon^q e^{\mathbf{q}_i^T x} \delta(\mathbf{k}_l^{(s)}, \mathbf{0})
    \delta(\mathbf{k}_{s-o+1}^{(o)}, \mathbf{q}_i) \delta(\mathbf{q}_{o+1}^{(s-o)},
    \mathbf{0}) . \quad (156)$

    ```


    The second term in brackets vanishes for $k \in \mathcal{F}^s$ and the eigenvalue
    equation is satisfied with $\lambda_{\lambda_k} = \Lambda_k/d$. For $\mathbf{k}
    = \mathbf{k}^{(u)}$ with $u < s, \delta(\mathbf{k}^{(s-u)}, \mathbf{0}) = 0$ for
    any $o \geq u$. As a result of the remainder, the RHS of Equation 156 becomes
    a sum over all $q$''s which are $s-u+1$ (including $k_l^{(u)}$ itself). The patch
    $\mathbf{x}_l$ is multiplied by $q$ in the exponent is also a shift of $\mathbf{x}_l$,
    thus all the factors $e^{\mathbf{q}_i^T \mathbf{x}_l}$ in the sum coincide with
    $e^{\mathbf{k}^{(u)T} \mathbf{x}_l}$. As $\lambda_q$ depends on the modulus of
    $q$, all these terms correspond to the same eigenvalue, $\lambda_k$, so that


    ```

    $\int_{[0,1]^d} d^x d^y K^{LC}(x,y) e^{\mathbf{k}_k^T y} = \frac{s-u+1}{d} \Lambda_{k^{(u)}}
    e^{\mathbf{k}_l^{(u)T} \mathbf{x}_l} . \quad (157)$

    ```


    We prove the expansion of Kernel 149


    ```

    $K^{LC}(x,y) = \frac{1}{d} \sum_{i \in P_l} C(x_i,y_i) = \frac{1}{d} \sum_{i \in
    P_l} \lambda_k \phi_k(\mathbf{x}_i) \phi_k(\mathbf{y}_i) . \quad (158)$

    ```


    As in the proof of the eigendendecomposition of convolutional kernels, all $k$
    having $s-u$ vanishing extremal components can be written as shifts of $k^{(u)}
    \in \mathcal{F}^u$, with the last $s-u$ components vanishing. The shift of $k$
    does not affect $\lambda_k$ nor the product $\phi_k(\mathbf{x}_i)\phi_k(\mathbf{y}_i)$,
