  md: '# 5.2 CORRELATIONS OF TOKEN CHANGES


    In this section, we characterize the statistics of how the input tokens change
    in the forward-backward experiments. Let $x_{0,j}$ denote the $i$-th input token,
    $i \in [d]$, and $\hat{x}_{0,j}(t)$ the same token after undergoing a forward-backward
    experiment with inversion time $t$. We seek to compute the changes between the
    tokens as a function of the inversion time $t$. For each token position $i$, we
    introduce a variable $\sigma_i(t)$ characterizing the dynamics.


    **Definition 5.2.1** (Token change). If $\sigma_i(t)$ takes values in a discrete
    variable, then $\sigma_i(t)$ is a spin variable defined as


    ```

    $$\sigma_i(t) = \begin{cases} +1, & \text{if } x_{0,j} \neq \hat{x}_{0,j}(t);
    \ -1, & \text{if } x_{0,j} = \hat{x}_{0,j}(t). \end{cases} \quad (75)$

    ```


    **Definition 5.2.2** (Dynamical correlation function). Given the $\sigma_i(t)$
    defined above, the dynamical correlation function between the changes of tokens
    at positions $i$ and $j$, relative to the initial point $x_0$, is defined as


    ```

    $C_{x_0,ij}(t) = \langle\sigma_i(t)\sigma_j(t)\rangle - \langle\sigma_i(t)\rangle\langle\sigma_j(t)\rangle,
    \quad (76)$

    ```


    $\langle\cdot\rangle$ denotes averaging over different stochastic trajectories.
    The **average dynamical correlation function** is defined as $C_{ij}(t) = C_{x_0,ij}(t)$,
    where the overline indicates averaging over the initial point $x_0$.


    Given the correlations, we compute the **dynamical susceptibility** $\chi(t)$,
    a quantity used to study the dynamics in physical systems [Don+02; Ton+05].


    **Definition 5.2.3** (Dynamical susceptibility). Given the average correlation
    function $C_{ij}(t)$ of Definition 5.2.2, the dynamical susceptibility is defined
    as


    ```

    $$\chi(t) = \frac{\sum_{i=1}\sum_{j=1} C_{ij}(t)}{\sum_{i=1}\sum_{j=1} C_{ii}(t)},
    \quad (77)$

    ```


    where we normalized by the sum of auto-correlations.


    Intuitively, the susceptibility measures the volume of the blocks of tokens that
    change together. In the case of the $\epsilon$-process for the RHM, where $\hat{x}_0(\epsilon)$
    is sampled from $p(|\mathbf{x}_|)$, the same definitions hold for $C_{ij}(\epsilon)$
    and $\chi(\epsilon)$. In the case of continuous embeddings, where the tokens $x_{0,j}$
    and $\hat{x}_{0,j}$ are continuous vectors (see Section 5.3 for image diffusion),
    the same definitions for $C_{ij}(t)$ and $\chi(t)$ hold by redefining $\sigma_i(t)$
    as $\sigma_i(t) = ||x_{0,i} - \,hat{x}_{0,i}(t)||$.'
