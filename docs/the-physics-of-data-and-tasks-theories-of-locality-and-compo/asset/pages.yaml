  md: 'where the factor $\psi^{(\ell+1)}(y, a_1, \dots, a_s)$ reads


    ```

    $$\psi^{(\ell+1)}(y, a_1, \dots, a_s) = \begin{cases} 1 & \text{if } y \to (a_1,
    \dots, a_s) \text{ is a rule at layer } (\ell+1) \to \ell \ 0, & \text{otherwise.}
    \end{cases}$$

    ```


    (335)


    This upward process is iterated from the leaf nodes at $\ell = 0$ until the root
    node at $\ell = L$. Afterward, BP computes the downward messages. The initialization
    at the root node is given by a uniform prior over the symbols of $\mathcal{V}^{(L)}$,
    i.e.


    ```

    $v_l^{(L)}(h_l^{(L)}) = \frac{1}{\sqrt{\mathcal{V}^{(L)}}} a \in \mathcal{V}^{(L)}.$

    ```


    (336)


    For the same-patch at layer $\ell$ and parent node at layer $\ell+1$ as before,
    the downward message for $h_i^{(\ell)}$ is given


    ```

    $$\hat{v}_i^{(\ell)}(h_i^{(\ell)}) = a_1 = \sum_{a_2, \dots, a_s \in \mathcal{V}^{(\ell+1)}}
    \psi^{(\ell+1)}(y, a_1, \dots, a_s) v_y^{(\ell+1)}(h_i^{(\ell+1)})$

