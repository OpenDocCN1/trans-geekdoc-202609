    # 4-3 HIERARCHICAL GENERATIVE MODEL OF DATA


    In this section, we introduce a generative model of data that mimics the structure
    of images (and language) while being analytically tractable. Natural images often
    display a hierarchical and compositional structure [Greg66]. Take, for example,
    the image of a snow leopard (Figure 6). This image is composed of multiple high-level
    components, such as the head and the paws. Each of these components, in turn,
    is composed of sub-features. For instance, the head comprises eyes, ears, and
    mouth. Further dissecting these elements, we find even more granular details,
