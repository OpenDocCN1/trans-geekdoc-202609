    which is in invariant to exchanging the tuple $(x_1, \dots, x_t)$ with a synonym.
    As proved in Section E.2, one step of gradient descent aligns the learned weights
    with the empirical token-tuple correlations. If the size of the training set is
    large enough for the accurate measure of correlations, the network can build a
    representation of the tuple $(x_1, \dots, x_t)$, which is invariant to exchanging
    synonyms. This invariance is empirically observed for the U-Net in Figure 57 of
    Section E.4.'
