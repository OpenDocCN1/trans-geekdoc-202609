    where memorization starts, which we found to follow a remarkably universal law:


    T_{mem} \propto P.


    THEORETICAL SUPPORT TO THE LINEAR DEPENDENCE In Section E5 provide a theoretical
    basis for this scaling within the tractable framework of kernel regression. We
    analyze the gradient flows for fitting the empirical score of P training points
    in the low-noise regime with variance r^2, where the Gaussian modes centered at
    the training points are random well-separated. Using an ansatz for the scores,
    we show that to fit the empirical score scales as T_{mem} \propto P^{^v}. The
    exponent v is determined by the kernel''s expansion near the origin. This result
    generalizes to any isotropic kernel except for [Bon+25], who studied random features
    in the proportional regime (width proportional to input dimension) using a Gaussian
    equivalence assumption. In our results, we show that random features and neural
    networks in the Neural Tangent Kernel (NTK) regime [GIH18, COB19] have different
    behaviors.


    We empirically validate these predictions with a one-hidden layer network with
    NTK initialization [IGH18], trained by gradient descent to fit the empirical score
    of Gaussian random points. The observed T_{mem} precisely follows the predicted
    scaling. Interestingly, the same scaling holds under feature initialization, suggesting
    our theory captures a more general phenomenon beyond its fixed-kernel assumption.
    Moreover, we show that T_{mem} is insensitive to batch size - from-batch SGD to
    full-batch gradient descent - indicating that memorization time is governed by
    the number of optimization steps required to fit the empirical score, not by how
    often each example is revisited.


