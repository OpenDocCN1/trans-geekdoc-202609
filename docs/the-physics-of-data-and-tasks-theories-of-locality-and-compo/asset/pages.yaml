    # 6.2.2 Learning the compositional rules


    We fix the RHM parameters and train diffusion models on datasets of varying size
    $P$. After training, we generate 1024 samples and evaluate whether the generated
    data satisfies the compositional rules of the RHM at hierarchical levels. Specifically,
    we define accuracy $A_l$ at level $l$ as the fraction of generated samples that
    satisfy level-$l$.


    Figure 17 (a) shows the accuracy at different levels as a function of $P$. The
    results reveal a staged learning process: the low-level rules, governing local
    structures, are learned first, followed by progressively higher-level rules that
    enforce global coherence. Thus, models trained on intermediate $P$ values generate
    data that are consistently correct but lack global coherence.


    The inset of Figure 17 (a) compares favorably the scaling of accuracy with our
    theoretical prediction, which we will derive in the next section. This prediction
    indicates that to satisfy rules at level $l$ requires a number of samples as $m^{l+1}$.
    Importantly, this scaling is polynomial, not exponential, in the data dimension
    $d=s^l$. Specifically, the sample complexity to learn all rules is $m^{l+1}=md^l$.
    Figure 17 (b) demonstrates that the same staged learning process applies in the
    online learning setting, where fresh samples are drawn at each training step.


