  md: '# A.6 PROOF OF THEOREM 2.6.1


    fact, we will conclude that the integral is dominated by the portion of the domain
    around $\lambda$. After the change of variables $y=\Lambda/\lambda$,


    ```

    $$\int_{0}^{\infty} d\lambda D_{r}(\lambda)c^{2}(\lambda) \frac{\Lambda^{2}}{(\Lambda+\lambda)^{2}}=\Lambda^{q-r}
    \int \frac{y^{q-1-r}}{(1+y)^{2}}, \quad (180)$

    ```


    where one recognizes one of the integral representations of the beta function,


    ```

    $B(a,b)=\int dy \frac{y^{a-1}}{(1+y)^{a+b}} \frac{\Gamma(a)\Gamma(b)}{\Gamma(a+b)},
    \quad (181)$

    ```


    with $\Gamma$ denoting the gamma function. Therefore,


    ```

    $$\int_{0}^{\infty} d\lambda D_{r}(\lambda)c^{2}(\lambda) \frac{\Lambda^{2}}{(\Lambda+\lambda)^{2}}=\Lambda^{q-r}\frac{\Gamma(q-r)\Gamma(2-q+r)}{\Gamma(2)},
    \quad (182)$

    ```


    It is interesting to notice that the assumptions $q>r$ and $q+r<2$ are required
    in order to avoid the poles of $\Gamma$ in the RHS of Equation 182.


    We now use Equation 182 to fix the asymptotics of $\mathcal{R}(\lambda,P)$ in
    the scaling limit $\lambda\to0$ and $P\to\infty$ with $1/(\sqrt{\lambda}P)\to0$.
    The latter condition implies that $\lambda$ decays slower than $(P)^{-1/2}$, additionally
    terms stemming from the finite-$P$ difference between $\theta$ and $\lambda$,
    of $P^{-1}$ are negligible w.r.t. $\Lambda^{q-r}$. The finite-$P$ difference between
    $\partial_{\lambda}\mathcal{R}$, also $O(P^{-1})$, is negated too.


    ```

    $$\mathcal{R}(\lambda,P)\sim\int_{0}^{\infty} d\lambda D_{r}(\lambda)c^{2}(\lambda)
    \frac{\Lambda^{2}}{(\Lambda+\lambda)^{2}}\sim\Lambda^{q-r}\sim\int_{0}^{\infty}
    d\lambda D_{r}(\lambda)c^{2}(\Lambda). \quad (183)$

    ```


    Theorem 6 of [lac20b] shows the convergence of $\mathcal{E}(\lambda,P)$ towards
    $\mathcal{R}(\lambda,P)$ when $P\to\infty$. Specifically,


    ```

    $|\mathcal{E}(\lambda,P)-\mathcal{R}(\lambda,P)|\le\left(\frac{1}{P}+g\left(\frac{\text{Tr}[T_{K}]}{\lambda\sqrt{\P}}\right)\right)\mathcal{R}(\lambda,P),
    \quad (184)$

    ```


    where $g$ is a polynomial with non-negative coefficients and $g(0)=0$. With a
    decaying rate $\lambda$ such that $1/(\sqrt{\lambda}P)\to0$, both $\mathcal{R}/P$
    and $\mathcal{G}(\text{Tr}[T_{K}]/(\sqrt{\lambda}P))$ tend to zero hence $\mathcal{R}$
    itself, the asymptotics of $\mathcal{E}(\lambda,P)$ coincide with those of $\mathcal{R}(\lambda,P)$
    and Equation 175 is proven.


    MARK The estimate for the exponent $\beta$ of Corollary-2.6.1 follows from the
    theorem above with $r=t/(s+a_{s})$, $q=(a_{t}+t)/(as+s)$ and $\lambda\sim P^{-q}$.
    If $q>r$ then $a_{t}>0$, the condition $q<r+2$ is equivalent to the assumption
    $a_{t}<2(a_{s}+s)$ required in Section 2.4 in order to derive the learning exponent
    in Equation 42 from our estimate of $\mathcal{B}(P)$.


