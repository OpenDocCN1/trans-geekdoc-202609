- pgno: 148
  md: '# 8.7 CONCLUSIONS


    We conducted a thorough analysis of task arithmetic in deep neural networks, delving
    into its fundamental mechanisms and enhancing its performance. Our findings demonstrate
    that linearized models, governed by the NTK, outperform their nonlinear counterparts
    in task arithmetic, providing a more effective approach for model editing. Crucially,
    we revealed that weight disentanglement plays a vital role in the success of task
    arithmetic, as distinct directions in weight space correspond to localized areas
    in the function space and that it is an emergent property of pre-training.


    A fascinating open question is understanding how weight disentanglement arises
    during pre-training and finding algorithms that enhance it. Another exciting research
    direction is investigating the potential of tangent spaces for editing other pre-trained
    models. In this sense, developing more efficient linearized models would be a
    significant leap forward in this field. These advancements could pave the way
    for novel approaches to model editing and deepen our understanding of the complex
    relationship between weight space and function space in deep learning.'
