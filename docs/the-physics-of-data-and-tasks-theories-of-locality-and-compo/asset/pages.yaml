  md: '# A PHASE TRANSITION IN THE DIFFUSION PROCESS


    ![](img/86150bd6d44cb578b97e3eba954b7be2_79_0.png)


    **Figure 6: Sketch of the hierarchical and compositional structure of data.**
    *Left:* The leopard in the image is iteratively decomposed in features at different
    levels of abstraction. *Right:* Generative hierarchical model we study in this
    paper. In this example, $L=3$ and branching factor $s=2$. Different values of
    the input and latent variables are represented with different colors.


    MSS18; MSS20; De19; AZL20; Cag24 belonging to the class of probabilistic context-free
    grammars (PCGs) [RS97]. These models consist of a collection of symbols and rules
    that prescribe sequence data starting from a single feature. Generic PCGs consist
    of a vocabulary of hidden (nonterminal) symbols, a vocabulary of visible (terminal)
    symbols and production rules that quantify the probability that either hidden
    symbol generates tuples of or visible symbols. The Random Hierarchy Model – which
    we introduced in [Cag+24], not included in this thesis – is a particular PCG,
    including the following additional assumptions to make it analytically tractable:


    +   i) The nonterminal symbols are split into $L$ finite vocabularies $(V_\ell)_{\ell=1}^L$
    of finite cardinality $v$ and $\mathcal{V}_0$ denotes the vocabulary of terminal
    symbols.


    +   ii) All the production rules transform one level-$(\ell + 1)$ symbol into
    a string of $s$-level $\ell$ symbols,


    ```

    $$\mu^{(\ell+1)} \to \mu_1^{(\ell)}, \dots, \mu_s^{(\ell)}$. (68)$

    ```


    +   iii) There are $m$ unambiguous production rules for nonterminal symbol, i.e.,
    two distinct nonterminals cannot generate the same $s$-tuple. These rules are
    randomly chosen and frozen for a given instance of the RHM. We call the $m$ strings
    produced by any given symbol synonyms.


    +   iv) All the available production rules are equally likely.


    Due to assumptions $i)$ and $ii)$, the data-generating process can be represented
    as a regular tree graph with depth $L$ and branching ratio $s$. The leaf nodes
    (level $\ell=0$) correspond to the tokens of the visible data, which form strings
    of size $d=s^L$.'
