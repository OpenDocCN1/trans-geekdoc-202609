  md: '# E.2 ONE-STEP GRADIENT DESCENT 241


    Knowing that the production rules of RHM realization are chosen uniformly at random
    compatible with the ambiguity constraint [CW24],


    ```

    $$\left(C^{(p)}(\mu|\mu_1)\right)^2 \simeq \frac{v^{s-1}(\nu-1) + m(v^{s-1}-1)}{mv(v^{s-1}-1)}
    \quad (393)$

    ```


    and, for $\nu \neq \mu_1,$,


    ```

    $$\left(C^{(p)}(\mu|\mu_1)p^{(1)}(\nu|\nu_1)\right) \simeq \frac{v^{s-1}-1}{v(v^s-1)}
    \quad (394)$

    ```


    In addition, since $\sum_{\mu} C^{(l)}(\mu, \nu) = 0$, then


    ```

    $$\sum_{\nu \neq \mu_1} \left(C^{(l)}(\mu_1, \nu)\right)^2 = - \left(C^{(l)}(\mu_1,
    \nu)\right)^2. \quad (395)$

    ```


    Hence,


    ```

    $$\left(C^{(l+1)}(\mu, \nu)\right)^2 \simeq \frac{\nu^{s-1}(\nu-1)}{m(v^{s-1}-1)}
    \cdot \left(\left(C^{(l)}(\mu_1, \nu)\right)^2\right. \quad (396)$

    ```


    Starting with $C^{(2)}$ from Equation 389, we get


    ```

    $C^{(l)} \simeq \sqrt{\left(C^{(l)}(\mu, \nu)\right)^2} \simeq \frac{1-f}{\sqrt{v^3
    m^{2f+2}}} \quad (397)$

    ```


    where the rightmost equality is equal in the limit $v, m \to +\infty$.


    # E.2 ONE-STEP GRADIENT DESCENT


    We consider a simplified one-step gradient descent setting [DLS22], where a simple
    machine-learning model of one input token $X_{s+1}$ following an $s$-tuple of
    tokens $X=(X_1, \dots, X_s)$. The training set $X_p$ consists of $P$ pairs $(x,
    v)$, with $v$ denoting the feature in the token $X_{s+1}$. We assume that


    +   i) the input token $X$ is given as the one-hot encoding of the tuple index.
    Each of $mv$ possible combinations of $s$ features is assigned an index $\mu =
    1, \dots, mv$ and $x$ is the $mv$-dimensional sequence $x_\mu = \delta_{\mu, \mu(x)}$


    +   ii) the machine-learning model is initialized on the empirical marginal probability
    of the token $X_{s+1}$ over the training set, $\mathbb{P}(X_{s+1} = v) := P^{-1}
    \sum_{(x, \lambda) \in X_p} \delta_{v, \lambda}$. This assumption is equivalent
    to a preprocessing step on the labels [DLS22] that removes the class imbalance
    of the training set.'
