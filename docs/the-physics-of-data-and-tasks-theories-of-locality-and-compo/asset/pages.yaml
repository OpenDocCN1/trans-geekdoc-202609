    # A.3.1 Spectra of convolutional kernels with overlapping patches


    In this section Lemma 2.3.3 and Lemma 2.3.4 are extended to kernels with overlapping
    patches, where $\mathcal{P}=\{1,\dots,d\}$ and $|\mathcal{P}|=d$. Such an extension
    requires additional assumptions, which are stated below:


    +   i) The d-dimensional input measure $p^{(d)}(d^d\mathbf{x})$ is uniform on
    the d-torus $[0,1]^d$;


    +   ii) The constituent kernel $\mathcal{C}(\mathbf{x},\mathbf{y})$ is translationally-invariant,
    isotropic and periodic,


    ```

    $$\mathcal{C}(\mathbf{x},\mathbf{y}) = c(|||\mathbf{x}-\mathbf{y}||\), c(|||\mathbf{x}-\mathbf{y}+\mathbf{n}||\)=c(|||\mathbf{x}-\mathbf{y}||\)
    \forall \mathbf{n} \in \mathbb{Z}^d. \quad (134)$

    ```


    Assumptions (i) and (ii) imply that $\mathcal{C}(\mathbf{x},\mathbf{y})$ can be
    diagonalized in Fourier space, i.e., with $k$ denoting the s-dimensional wavenumber


    ```

    $$\c(\mathbf{x}-\mathbf{y}) = \sum_{k=2:n \in \mathbb{Z}^d} \lambda_k \Phi_k(\mathbf{x})\overline{\Phi_k(\mathbf{y})}
    = \sum_{k=2:n \in \mathbb{Z}^d} \lambda_k e^{i\mathbf{k}^T\mathbf{x}}, \quad (135)$

    ```


    and the eigenvalues $\lambda_k$ depend only on the modulus of $k$, $\mathbf{k}=\sqrt{\mathbf{k}^T\mathbf{k}}$.
    Let us introduce the following definitions, after recalling that a s-dimensional
    path $x_i$ of $\mathbf{x}$ is a contiguous subsequence of $\mathbf{x}$ starting
    at $x_i$,


    ```

    $$\mathbf{x} = (x_1,x_2,\dots,x_d) \Rightarrow \mathbf{x}_i = (x_i,x_{i+1},\dots,x_{i+s-1}),
    \quad (136)$

    ```


    and that inputs are ''wrapped'', i.e., we identify $x_{nd}$ with $x_d$ for all
    $n \in \mathbb{Z}$.'
