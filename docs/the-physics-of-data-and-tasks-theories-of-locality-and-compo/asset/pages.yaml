    # D.1.1.1 BP iteration


    The initialization of BP is given by the leaf messages $v_\Upsilon(h_i^{(0)}),
    i \in [s^L]$. For each s-patch level $\ell$, e.g., $\{h_i^{(\ell)}\}_{i=1,\dots,s}$
    having a common parent node at level $\ell+1$, e.g., $h_{(\ell+1)}$, the upward
    message in the upper level is computed as


    ```

    $$\hat{v}_\Upsilon\left(h_1^{(\ell+1)}\right) = \sum_{a_1,\dots,a_s\in\mathcal{V}(v^{(\ell)})}
    \psi^{(\ell+1)}(y,a_1,\dots,a_s)\prod_{i=1}^s v_\Upsilon\left(h_i^{(\ell)}=a_i\right),
    \quad (333)$

    ```


    ```

    $v_\Upsilon\left(h_1^{(\ell+1)}\right) = \frac{\hat{v}_\Upsilon\left(h_1^{(\ell+1)}\right)}{\sum_{y''\in\mathcal{V}(\hat{v}_\Upsilon^{(\ell)})})}
