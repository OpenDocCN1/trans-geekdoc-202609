  md: "# APPENDIX: LOCALITY DEFEATS THE CURSE OF DIMENSIONALITY\n\nThe authors of\
    \ [BCP20; CBP21] found a heuristic expression for the average of the mean error\
    \ over realizations of the training set $\\{\\hat{f}_x\\}$, based on the replica\
    \ method of statistical physics, reads\n\n```\n\\mathcal{E}(\\lambda, P) = \\\
    partial_{\\lambda} \\left( \\frac{k_{\\lambda}(P)}{P} \\right) \\sum_{P} (\\lambda_{\r\
    ho} + k_{\\lambda}(P))^2 |c_{\\rho}|^2, \\quad 102\n```\n\nwhere (P) satisfies\n\
    \n```\n\\frac{k_{\\lambda}(P)}{P} = \\lambda + \\frac{1}{P} \\sum_{\\rho} \\frac{\\\
    lambda_{\rho} k_{\\lambda}(P)/P}{\\lambda_{\rho} + k_{\\lambda}(P)/P}, \\quad\
    \ 103\n```\n\nIn short, the replica method works as follows [MPV87b]: first one\
    \ defines an energy function $E(f)$ as the argument of the in Equation 97, then\
    \ to attribute a probability distribution $P(f) = Z^{-\\beta E(f)}$, with $Z$\
    \ normalization constant and $\\beta=0$. As $\\beta \\to \\infty$, the probability\
    \ distribution $P(f)$ centers around the solution of the minimization problem\
    \ of Equation 97, i.e., one can replace $f$ in the right-hand side of Equation\
    \ 101 with an average over $\beta$, then perform the limit $\\beta \\to \\infty$\
    \ after the calculation to recover the generalization error. The simplification\
    \ comes from the fact that $f$ is replaced with its eigendecomposition, the energy\
    \ function $E(f)$ becomes a quadratic function of the coefficients $c_{\rho}$.\
    \ Then, under the assumption the first and second moments of the eigenfunctions\
    \ $\\phi_{\rho}(x)$ w.r.t. x, all averages in Equation 101 reduce to Gaussian\
    \ integrals. Mathematically, $k_{\\lambda}(P)/P$ is related to the Stieltjes transform\
    \ [PB20] of the Gram matrix $K_{p}/P$ in the large-$P$ limit. Intuitively, it\
    \ plays the role of a threshold: the mathematical contribution to the error to\
    \ 0 for $\\rho$ such that $\\lambda_{\rho} \\gg k_{\\lambda}(P)/P$, and $\\mathbb{E}[|c_{\r\
    ho}|^2]$ for $\\rho$ such that $\\lambda_{\rho} \\ll k_{\\lambda}(P)/P$. This\
    \ is equivalent to saying that the algorithm predictor $f(x)$ captures only the\
    \ eigenfunctions having eigenvalue larger than $k_{\\lambda}(P)/P$ (see also [jac+2a;\
    \ jac+2b]). This intuitive picture can actually be exploited to explore the learning\
    \ curve $\\beta$ from the asymptotic behavior of Equation 102 and Equation 103\
    \ in the ridgeless $\\lambda \\to 0$. Following, we assume that both the kernel\
    \ and the target function have a power-law spectrum, in which $\\lambda_{\rho}\
    \ \\sim \\rho^{-a}$ and $\\mathbb{E}[|c_{\rho}|^2] \\sim \\rho^{-b}$, with $2a\
    \ > b-1$. First, we approximate the sum over modes in Equation 103 with an integral\
    \ using the Euler-Maclaurin formula. Then we substitute the eigenvalues inside\
    \ the integral with their asymptotic limit,\n\nNotice that the risk considered\
    \ in [BCP20; CBP21] differs from Equation 97 by a factor of 1/P in front of the\
    \ sum."
