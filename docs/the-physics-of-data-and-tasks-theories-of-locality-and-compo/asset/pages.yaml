  md: '# APPENDIX: THE ROLE OF DEPTH AND SPATIAL ADAPTIVITY


    As we illustrated in the main text, to solve this constraint on the hypothesis
    space, one has to consider deep convolutional architectures. In particular, consider
    the same teacher of the previous paragraph (left) learned by a depth-four convolutional
    student (right).


    ![](img/86150bd6d44cb578b97e3eba954b7be2_213_0.png)


    ![](img/86150bd6d44cb578b97e3eba954b7be2_213_1.png)


    Remarkably, this student is able to learn the teacher without being cursed by
    input dimensionality. Indeed, as the number of patches diverges, the error asymptotes
    to $P^{-1/s_1}$. This rate is slightly worse than the one obtained by the student
    matched with the teacher, which is proven to be the Bayes-optimal case cursed.
    Intuitively, this fast rate is obtained because the student engine constant a
    single patch, correspond to large eigenvalues and bias the learning dynamics towards
    $s_1$-local functions. Yet, this student is also able to represent functions that
    are considerably complex.


    Now consider a depth-three teacher (left) learned by a depth-four student (right).


    ![](img/86150bd6d44cb578b97e3eba954b7be2_213_2.png)


    ![](img/86150bd6d44cb578b97e3eba954b7be2_213_3.png)


    As highlighted in orange, the output of the teacher is a linear combination of
    a composition of non-linear functions acting on patches and coupling them. In
    this setting, the error decay is controlled by the effective dimension of the
    second layer. In fact, when the number of patches diverges, the error decay asymptotes
    to $P^{-1/d_{eff}(2)}$, this behavior is a result of what we called ‘adaptivity’
    to the spatial structure of the target.


    Finally, consider both teacher and student with the complete hierarchy, i.e.,
    the receptive fields of the neurons in the penultimate layers coincide with the
    full input.


    ![](img/86150bd6d44cb578b97e3eba954b7be2_213_4.png)


    ![](img/86150bd6d44cb578b97e3eba954b7be2_213_5.png)'
