    complexities match the number of data required by the diffusion model to generate
    data that follow the grammar rules up to the corresponding level. Since hierarchical
    clustering procedure requires a number of samples that is polynomial in the size
    of the token sequence, this mechanism allows the model to learn a high-dimensional
    distribution while avoiding the curse of dimensionality. Beyond simple PCGs, we
    predict that diffusion models trained on limited samples that is locally coherent
    (i.e., satisfying local rules), but not globally, with a coherence length growing
    with the training time/number of samples. We confirm this prediction in diffusion
    models trained on OpenWebText and ImageNet.


    We conclude by discussing how the principle we forward to build a hierarchy of
    latent variables generalizes the renormalization group used in physics, where
    coarse-grained variables are obtained by simple pooling operations.


    # 6.1 RELATED WORK


