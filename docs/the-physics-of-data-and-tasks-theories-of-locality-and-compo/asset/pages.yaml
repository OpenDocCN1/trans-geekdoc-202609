  md: "# APPENDIX: A PHASE TRANSITION IN THE DIFFUSION PROCESS\n\nWe call $\\Delta_{w}$\
    \ the Hamming distance between two sequences $\\mathbf{w} = [w_1, \\dots, w_s]$,\
    \ $\\mathbf{z} = [z_1, \\dots, z_s]$ of length $s$.\nFrom Equation 28s, at the\
    \ bottom layer, the belief in a sequence $\\mathbf{x} = [x_1, \\dots, x_s]$ with\
    \ $\\Delta_{\\mathbf{x},\tilde{x}} = k \\in \\{0, \\dots, s\\}$ from $\tilde{\\\
    mathbf{x}} = [\tilde{x}_1, \\dots, \tilde{x}_s]$ is\n\n```\n$$\\mathcal{B}(k)\
    \ = \\binom{s}{k} \\epsilon^k (1-\\epsilon)^{s-k} \\quad (286)$\n```\n\nThe non-normalized\
    \ upward messages for the variable $Y$ are given by:\n\n```\n$$\\tilde{\\psi}^{\\\
    dagger}(y) = \\sum_{x_1,\\dots,x_s} \\psi(y, x_1, \\dots, x_s) \\prod_{i=1}^s\
    \ \\frac{\\psi(y, x_i)}{\\sum_{x \\in S} \\psi(y, x)} \\mathcal{B}(\\Delta_{x,\\\
    tilde{x}}) \\quad (287)$\n```\n\nwhere we use the short-hand notation $\\psi(y,\
    \ x_1, \\dots, x_s) = \\psi(y, \\mathbf{x})$ and we have restricted the sum over\
    \ the set $S$ of sequences $\\mathbf{x}$ that appear in the possible rules $y\
    \ \\rightarrow x_1, \\dots, x_s$. In fact, if $\\mathbf{x} \\notin S$, then $\\\
    psi(y, \\mathbf{x}) = 0$.\n\nFor $\\mathbf{x} \\in S$, the factor $\\psi(y, \\\
    tilde{\\mathbf{x}})$ is:\n\n+   if $\\Delta_{\\mathbf{x},\\tilde{x}} = 0$:$\n\
    \  $\\begin{cases} \\psi(y, \\tilde{x}_1, \\dots, \\tilde{x}_s) = 1, \\ \\psi(y,\
    \ \\tilde{x}_1, \\dots, \\tilde{x}_s) = 0, & \\quad y \\neq \\tilde{y}. \\end{cases}\
    \ \\quad (288)$\n\n+   if $\\Delta_{\\mathbf{x},\\tilde{x}} > 0$:$\n  $\\begin{cases}\
    \ \\psi(y, x_1, \\dots, x_s) = 1, & \\text{for some } \\tilde{y}$ independent\
    \ of $\\tilde{y}$ \\ \\psi(y, x_1, \\dots, x_s) = 0, & \\quad y \\neq \\tilde{y}.\
    \ \\end{cases} \\quad (289)$\n\nWe can decompose Equation 287 as\n\n```\n$$\\\
    tilde{\\psi}^{\\dagger}(y) = \\delta_{y,y}B(0) + \\sum_{k=1}^s B(k) \\sum_{\\\
    substack{x \\in S \\ \\Delta_{x,\\tilde{x}}=k}} \\psi(y, x). \\quad (290)$\n```\n\
    \nANNEALED AVERAGE $\\psi$ is a random quantity and we want to compute the average\
    \ message $\\langle\\tilde{\\psi}(y)\\rangle$ over the possible realizations of\
    \ $\\psi$. We can decompose the selection of rules in two steps: selecting the\
    \ set of $mv-1$ sequences $[\\mathbf{x}, \\mathbf{x} \\neq \\tilde{\\mathbf{x}}]$\
    \ and associating the $\\psi$ higher-level features $y$ to them. Therefore, for\
    \ a generic quantity $A$, we indicate the average over rules $\\langle A\\rangle_{\\\
    {y \\leftarrow \\mathbf{x}}\\}_S$, where $\\langle\\dots\\rangle_S$ is the average\
    \ over the sequence sampling and $\\langle\\dots\\rangle_{\\{y \\leftarrow \\\
    mathbf{x}\\}}}$ is the average over the $y \\leftarrow \\mathbf{x}$ associations.\n\
    \n```\n$$\\tilde{\\psi}^{\\dagger}(y)\\psi = \\delta_{y,y}B(0) + \\sum_{k=1}^s\
    \ B(k) (\\langle \\sum_{\\substack{x \\in S \\ \\Delta_{x,\\tilde{x}}=k}} \\psi(y,\
    \ x) \\rangle_{\\{y \\leftarrow \\mathbf{x}}}_S) \\quad (291)$\n```"
