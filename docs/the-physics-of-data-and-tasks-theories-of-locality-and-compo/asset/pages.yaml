    With the end of the upward-downward iteration, each variable $h_i^{(\ell)}$ is
    associated with two BP messages for each symbol of the vocabulary $\mathcal{V}^{(\ell)};
    \nu_i^{(\ell)}$ and $v_i^{(\ell)}$. Their product gives the marginal probability
