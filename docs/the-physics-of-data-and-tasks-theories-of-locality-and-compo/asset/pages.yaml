- pgno: 156
  md: 'the essential properties of hierarchical compositionality – found in real-world
    modalities like language and vision – sacrificing tractability. Its simplifying
    assumptions, such as fixed, regular tree topology and random production rules,
    enabled a theoretical study of the denoising process and the computation of the
    nested correlations that govern learning. Despite its absence, as common in physics
    models, the RHM successfully predicts non-trivial phenomena with natural data,
    including the phase transition in the denoising process and the local-to-global
    learning dynamics, where long-range correlations emerge with training. As discussed
    in the previous section, results cannot be reproduced by simpler models, such
    as Gaussian random fields with long-spatial correlations, that the RHM''s higher-order
    structure captures. This alignment between theory and empirics underscores the
    RHM''s value as a powerful conceptual tool for studying data like text and images.


    Future work could extend the RHM to better capture the complexity of natural data.
    Promising avenues include:


    +   * Regular tree topologies: Natural language exhibits variable branching and
    depth, leading to heterogeneous trees. Extending the RHM to accommodate irregular
    tree topologies, adding distributions over branching factors across layers, would
    better reflect these hierarchies. Moreover, it would introduce a degree of ambiguity,
    which is also found in language, and is currently absent from the model. In particular,
    this structural ambiguity means the boundaries of grammatical units uncertain,
    and a single sequence of tokens could be parsed into a valid grammatical structure
    in multiple ways. The model would then need to learn to resolve these parsing
    uncertainties, likely by leveraging broader context to infer the most probable
    latent structure.


    +   * Context dependencies: The RHM is fundamentally a probabilistic context-free
    grammar. However, it is established that natural language requires at least mildly
    context-sensitive models to capture all syntactic phenomena. Introducing more
    general latent models that involve context dependencies is thus a key challenge
    for future work. For instance, this could be achieved by allowing for more complex
    latent variables that encode additional information or considering models that
    gradually depart from a tree-like structure.


    Characterizing the correlation structures that arise from these modifications
    could provide deeper insights into how advanced models like transformers acquire
    linguistic competence.'
