  md: '# APPENDIX: PROBING HIDDEN HIERARCHIES IN DATA


    # D.1 THE RANDOM HIERARCHY MODEL


    # D.1.1 Denoising the RHM with Belief Propagation


    In the RHM, knowing the production rules of its tree structure, the Bayes-optimal
    denoising of its data can be done exactly using the Belief Propagation (BP) algorithm
    [SFW25].


    In the factor graph of the RHM, all latent and visible variables $h_i^{(f)}$ represent
    variable nodes, while the RHM rules connecting them are factor nodes. Each variable
    node is associated to two BP messages, $v_f(h_i^{(f)})$, and one coming from below,
    $v_\ell(h_i^{(f)})$. The starting point of the BP algorithm is the definition
    of the messages below the tree, with the upward messages at the leaves $v_\ell(h_i^{(0)})$
    and the downward message at the root $v_f(h_i^{(L)})$. Since we consider class-unconditional
    diffusion processes, we consider the latter as being uniform over the values of
    $y^{(\ell)}$. The initialization at the leaves, instead, corresponds to the prior
