  md: "# APPENDIX: LOCALITY DEFEATS THE CURSE OF DIMENSIONALITY\n\n# A.1 SPECTRAL\
    \ BIAS IN KERNEL REGRESSION\n\nIn this appendix, we provide additional details\
    \ about the derivation of Equation 28 within the framework of [BCP20; CBP21].\
    \ Let us begin by recalling the definition of the kernel ridge regression estimator\
    \ $\\hat{f}$\n\n```\n$$\\hat{f} = \\arg\\min_{f \\in \\mathcal{H}} \\left\\{ \\\
    frac{1}{P} \\sum_{v=1}^{P} (f(x_v) - f^*(x_v))^2 + \\lambda ||f||_{\\mathcal{H}}^2\
    \ \\right\\} (97)$\n```\n\nwhere $\\mathcal{H}$ denotes the Reproducing Kernel\
    \ Hilbert Space (RKHS) of the kernel $\\mathcal{K}(x,y)$. After utilizing the\
    \ Mercer's decomposition of the kernel,\n\n```\n$$\\mathcal{K}(x,y) = \\sum_{\\\
    rho=1}^{\\infty} \\lambda_{\\rho} \\phi_{\rho}(x)\\phi_{\rho}(y), \\quad \\int\
    \ (d^d y) \\mathcal{K}(x,y)\\phi_{\rho}(y) = \\lambda_{\\rho}\\phi_{\rho}(x).\
    \ (98)$\n```\n\nThe RKHS can be characterized as a subspace of the functions lying\
    \ in the span of the kernel eigenbasis,\n\n```\n$$\\mathcal{H} = \\left\\{ f =\
    \ \\sum_{\\rho=1}^{\\infty} a_{\\rho}\\phi_{\\rho}(x) \\left. \\ \\sum_{\\rho=1}^{\\\
    infty} \\frac{|a_{\\rho}|^2}{\\lambda_{\\rho}} < \\infty \\right. \\right\\ (99)$\n\
    ```\n\nIn other words, the RKHS contains functions having a finite norm $||f||_{\\\
    mathcal{H}}$ with respect to the following inner product,\n\n```\n$$\\f(x) = \\\
    sum_{\\rho=1}^{\\infty} a_{\\rho}\\phi_{\\rho}(x), \\quad f'(x) = \\sum_{\\rho=1}^{\\\
    infty} a_{\\rho}\\phi_{\\rho}(x), \\quad (f,f')_{\\mathcal{H}} = \\sum_{\\rho=1}^{\\\
    infty} \\frac{a_{\\rho}a_{\\rho}'}{\\lambda_{\\rho}}. (100)$\n```\n\nGiven any\
    \ target function $f^*$ lying in the span of the kernel eigenbasis, the mean-squared\
    \ generalization error of the kernel ridge regression estimator\n\n```\n$$\\mathcal{E}(\\\
    lambda, \\{x_v\\) = \\int (d^d x) (f(x) - f^*(x))^2 = \\sum_{\\rho=1}^{\\infty}\
    \ |a_{\\rho}(\\lambda, \\{x_v\\) - c_{\\rho}|^2. (101)$\n```\n\nWith $c_{\rho}$\
    \ denoting the $\rho$-th coefficient of the target $f^*$ and $a_{\rho}$ of the\
    \ estimator, $f$ depends on the ridge $\\lambda$ and on the training set $\\{x_v\\\
    }_{v=1,...,P}$. Notice that, as $f$ belongs to $\\mathcal{H}$ by definition, $\\\
    sum_{\\rho}|a_{\\rho}|^2/\\lambda_{\\rho} < \\infty$, whereas the $c_{\\rho}$\
    \ are free to take any value."
