  md: '# 6.3 THEORETICAL ANALYSIS


    # 6.2.4 Emergence of hierarchical representations


    To generate sequences that satisfy the compositional rules of the RHM, the diffusion
    model presumably needs to construct internal representations of the latent variables
    at each level of the hierarchy. We probe this by perturbing the trees generating
    the data: specifically, we alter the subtree by a given latent variable, while
    keeping that variable fixed. In the training set size increases, the hidden representations
    of the U-Net become increasingly invariant to such perturbations indicating reduced
    sensitivity to progressively higher levels of synonyms and the emergence of more
    abstract representations.


    # 6.3 THEORETICAL ANALYSIS


    To derive the sample complexity of the U-Net, we build upon prior work that explains
    how deep networks efficiently learn hierarchical tasks. This result is achieved
    by building a lower-dimensional representation that iteratively clusters the latent
    hierarchical structure of the data. [MSS18], allowing the network to recover the
    clustering mechanism is based on statistical correlations between s-tuples of
    tokens and the given task—supervised or self-supervised which are identical for
    synonyms. Notably, the sample complexity of deep networks with gradient descent
    aligns with the training set size required to detect these correlations [Cag+24;
    CW24]. For supervised learning, this connection can be justified in a one-step
    gradient descent (GD setting).


    Here, we extend these results to diffusion models. First, we demonstrate that
    learning the score function in the low-noise limit corresponds to a latent invariant
    to exchanging synonyms, and could be simplified by reconstructing the latent variables.
    Then, we compute the sample complexities required to reconstruct latent variables
    of different levels using correlations. We conclude by showing that a clustering
    algorithm based on correlations indeed recover the latent variables with the predicted
    sample complexities, and the sample complexity to reconstruct first-level latent
    variables can be recovered in a one-step-GD setting.


