    # HIERARCHICAL MODELS OF NATURAL DATA


    Generative models of data have a long history of describing the structure of language
    and image data. In linguistics, formal grammars describe the syntactic of a language
    through a hierarchical tree [Rs97]. Similar ideas have been explored to decompose
    visual scenes hierarchically into objects, and primitives by [ZM+07] have been
    formalized in pattern theory to practical algorithms for semantic segmentation
    and scene understanding, as in e.g., [Go: Sis+07; LSF9]. Recent works propose
    hierarchical decomposition of images, in latent variants are wavelet coefficients
    at different scales [Mar+22; Kad+23a]. In this case, the graph is not tree-like
    [Kad+23a] – a conclusion that could stem from the specific choice of latent variables.


    # HIERARCHICAL MODELS IN MACHINE LEARNING THEORY


    More recently, generative models of data received attention in the context of
    machine learning theory. In supervised learning, deep networks can represent hierarchical
    tasks much more efficiently than these works learning from information theory
    view [Pog+17b] [SH20]. For hierarchical models of data, relations between the
    input data and the task are critical for learning [Mos16; SSSS17; MSS18; MSS20]
    and representations learned by neural networks with gradient descent reflect the
    hidden variables of such models both in Convolutional Neural Networks (CNNs) [Cag+24]
    and transformers [AZL23]. In this chapter, we use these hierarchical generative
    models of data to study the denoising dynamics of diffusion models theoretically.


