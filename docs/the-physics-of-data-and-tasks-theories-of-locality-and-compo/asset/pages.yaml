    # 1.2 GENERALIZATION IN DEEP LEARNING


    # 1.2.1 Classical learning theory


    Classical learning theory provides a fundamental framework for understanding generalization.
    Its primary aim is to quantify the relationship between the training error (performance
    on training data) and the generalization error (expected performance on unseen
    data). This is typically achieved through bounds of the form:


    ```

    $$\mathcal{E}(f) \leq \mathcal{E}(f) + \frac{C(\mathcal{H})}{P}$,

    ```


    where $\mathcal{H}$ is the hypothesis class, representing the set of all functions
    the model can express (e.g., for neural networks, $\mathcal{H} = \{\theta : \theta
    \in \mathcal{\Theta}\}$), and $C(\mathcal{H})$ is a measure of the complexity
    or capacity of the hypothesis class.


    Classical theories also suggest that a model''s ability to generalize is closely
    tied to its capacity. For instance, the Vapnik-Chervonenkis (VC) dimension [Vaps99],
    a common measure of $C(\mathcal{H})$, typically grows with the number of parameters
    in a neural network. Rademacher complexity [KPoW; Bmo02] measures how well functions
    within the hypothesis class can fit random noise, essentially quantifying the
    model''s ability to ''memorize'' $P$ points. The underlying principle is that
    richer models, capable of fitting a broader family of functions, are more prone
    to overfitting the training data, leading to poor performance on unseen examples.
    This framework implies a tradeoff: to achieve good generalization, one must carefully
    select a complexity that is neither too low (leading to underfitting) nor too
    high (leading to overfitting, or a large gap between training and generalization
    error).


    However, the empirical success of modern deep networks challenges these traditional
    notions. In modern learning, networks routinely train hundreds of millions, even
    billions, of parameters far exceeding the number of training examples. By the
    previous reasoning, these models should generalize poorly. Yet, contrary to the
    warnings of classical theory, highly overparameterized networks do not necessarily
    have to overfit the'
  merge: -1
