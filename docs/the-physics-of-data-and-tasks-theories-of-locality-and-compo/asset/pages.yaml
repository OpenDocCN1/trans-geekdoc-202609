  md: '# 2.1 RELATED WORK


    Several recent studies have focused on the role of compositional structure in
    data. When structure is hierarchical, deep convolutional networks have been shown
    to possess significantly greater power than shallow architectures [Pog170; Pbl20;
    Dez20]. From a training perspective, Malach and Shalev-Shwartz [MSS21] demonstrated
    convolutional and locally-connected networks can achieve target generalization
    errors in polynomial time functions that depend on consecutive bits of a d-dimensional
    input, with s=O(log d). Conversely, fully-connected networks do not share this
    advantage.


    Bietti [Bie21] explored the impact of locality in the architecture through the
    lens of kernel methods, using deep convolutional kernels introduced by Mairal
    [Mai6] and Bietti and Mairal [BM19], and characterized their Associated Reproducing
    Kernel Hilbert Space (RKHS). However, for isotropic kernels, this membership performance
    constraints on smoothness might become increasingly restrictive as the dimensionality
    d grows. By contrast, for kernels exhibiting locality, smoothness constraints
    depend on the filter size s, rather than the dimensionality d [Bie21]. Additionally,
    Mei et al. [MMM21] recently established that weight sharing, without locality,
    provides only a modest improvement in the generalization performance of shift-invariant
    kernels.


    In contrast to the above studies, in this chapter, we specifically consider nontrivial
    learning curve events, within a framework where the locality and shift-invariance
    properties of the kernel do not necessarily match the target of function class
