    of training points $P$. As $P$ increases, the sensitivities $S_{k,l}$ decrease
    sequentially across levels, following the same staged learning process in Figure
    17. Deep encoder layers become invariant to synonym substitutions at lower levels,
    confirming that the network learns to encode the hierarchical structure of the
    grammar. In contrast, decoder layers gradually regain sensitivity to specific
    low-level symbols as the output is approached. This behavior aligns with high-level
    representations. Crucially, the network begins to satisfy rules at level $\ell$
    when it becomes insensitive to synonym variations at level $\ell-1$. This suggests
    that the U-Net learns to collapse lower-level synonyms into shared latent representations
    and to compose these latents into the production rules at level $\ell$.


    # E.4.2 Sample complexity of deep clustering algorithm


