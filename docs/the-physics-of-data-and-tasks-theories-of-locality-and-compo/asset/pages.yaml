- pgno: 2
  md: '# ABSTRACT


    Deep neural networks have achieved remarkable success, our understanding of how
    they learn remains limited. These models can learn high-dimensional tasks, which
    is generally statistically intractable due to the curse of dimensionality. This
    apparent paradox suggests that learning data must have an underlying latent structure.
    What is the nature of this structure? How do neural networks encode and exploit
    it, and how does it quantitatively impact performance – for instance, how does
    generalization improve with the number of training examples? This thesis addresses
    these questions by studying the roles of locality and compositionality in data,
    tasks, and deep learning representations.


    We begin by analyzing convolutional neural networks in the limit of infinite width,
    where the learning dynamics simplifies and becomes analytically tractable. Using
    tools from statistical physics and learning theory, we characterize their generalization
    abilities and show that they can overcome the curse of dimensionality if the target
    function is local by adapting to its spatial scale.


    We turn to more complex structures in which features are composed hierarchically,
    with elements at larger scales built from subfeatures at smaller scales. We model
    data using simple probabilistic-free grammars – tree-like graphical models used
    to describe data such as language and images. Within this framework, we study
    how diffusion-based generative models compose new data by assembling features
    from examples. This theory of composition predicts a phase transition in the generative
    process, which we confirm empirically in both image and language modalities, providing
    support for the hypothesis of natural data. We further demonstrate that the sample
    complexity for learning these grammars scales polynomially with data dimension,
    providing a mechanism by which models avoid the curse of dimensionality by learning
    to hierarchically compose new data. These results offer a theoretical grounding
    for generative models to generalize, and ultimately, create.


    Finally, we shift our analysis from the structure of data in the input space to
    the structure of tasks in the model''s parameter space. Here, we investigate a
    novel form of compositionality, where tasks and skills can be composed. In particular,
    we empirically demonstrate that distinct directions in the weight space of large
    pretrained models are associated with localized, semantic task-specific areas
    in function space, and how this modular structure enables task arithmetic and
    model editing at scale.'
