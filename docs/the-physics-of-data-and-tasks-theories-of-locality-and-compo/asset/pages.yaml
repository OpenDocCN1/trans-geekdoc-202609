    ![](img/86150bd6d44cb578b97e3eba954b7be2_259_0.png)


    **Figure 57: Relative sensitivity of the hidden representations of the U-Net,
    defined with respect to the number of training points.** Different colors correspond
    to different layers $\ell$ of synonymic activations of different U-Net blocks.
    Encoder layer 1 is the closest to the input, decoder layer 5 is the closest to
    the output. As the number of training points increases, deeper layers of the encoder
    become less sensitive to synonymic transformations. This implies that encoder
    layers learn to represent deep latent variables of the RHM. The decoder layers,
    instead, progressively learn the sensitivity to transformations as they expand
    latent variables into their lower-representations. For each layer $\ell$, the
    dashed line represents the fraction of generated samples that do not satisfy the
    rules at that level, $1 - A_\ell$. The U-Net learns to satisfy rules at level
    $\ell$ when it becomes insensitive to the synonyms of the variables at level $\ell
    - 1$.


    # E.4 ADDITIONAL RESULTS


    # E.4.1 Hierarchical representations in the U-Net


    In Figure 57, we test the hypothesis that the U-Net learns to represent together
    inputs that differ by low-level synonyms, i.e., the choice of low-production rules.
    To do so, we introduce a transformation operator $R_\ell \mathbf{x}$, which modifies
    a given data set by resetting all choices of production rules from level $\ell$.
    This is equivalent to substituting all tuples at depth $\ell - 1$ with a synonym.
    We define the relative sensitivity $S_{k,\ell}$ of the pre-activations $a_k$ at
    layer $k$ to the transformation $R_\ell$:


    ```

    $S_{k,\ell} = \frac{\mathbf{E}_{\mathbf{x}} ||a_k(\mathbf{x}) - a_k(R_\ell(\mathbf{x}))||^2}{\mathbf{E}_{\mathbf{x}}
    ||a_k(\mathbf{x}) - a_k(\mathbf{y})||^2}} \quad (404)$

    ```


    Here, the numerator measures how much the activations change when synonym substitutions
    are applied at depth $\ell$, while the denominator normalizes by the overall variability
    of activations across different data points. A low value of $S_{k,\ell}$ indicates
    that the network is invariant to synonym substitutions at depth $\ell$, implying
    that it has learned the corresponding compositional rule.'
