  md: "# C.2 BELIEF PROPAGATION EQUATIONS\n\nSince each sequence $x \neq \bar{x}$\
    \ the association $y \\leftarrow \bar{x}$ is done randomly, independently of $\\\
    Delta_{xx}$, then from Equation 289g, we have $\\langle\\psi(y,x)\rangle_{y\\\
    leftarrow x} \\approx 1/v$. More precisely, since we have associated the reference\
    \ sequence $\bar{x}$ to $\tilde{y}$:\n\n```\n$$\\Psi_y = \\langle\\psi(y,x)\\\
    rangle_{y\\leftarrow x} = \\frac{m-1}{mv-1}\\delta_{y,\\tilde{y}} + \\frac{m}{mv-1}(1-\\\
    delta_{y,\\tilde{y}}). \\quad (292)$\n```\n\nTherefore:\n\n```\n$$\\langle\\tilde{\\\
    psi}(y)\\rangle_\\psi = \\delta_{\tilde{y},y}B(0) + \\Psi_y \\sum_{k=1}^s B(k)\
    \ \\left( \\sum_{x\\in S} \\Delta_{xx}=k} 1 \\right) \\quad (293)$$\\n\\n = \\\
    delta_{\tilde{y},y}B(0) + \\Psi_y \\sum_{k=1}^s B(k) \\langle n_k\\rangle_S,$\n\
    ```\n\nwhere $n_k$ is the number of sequences $x \\in S$ having Hamming distance\
    \ $\\Delta_{xx}=k$ from $x$. Since the sequences are sampled randomly, the numbers\
    \ $n_1, ..., n_s$ are distributed according a multivariate hypergeometric distribution,\n\
    \n```\n$P(n_1, ..., n_s) = \\frac{\\prod_{k=1}^s \\binom{v-1}{n_k}}{\\binom{mv-1}{s}}\
    \ \\quad (294)$\n```\n\nwhich averages over\n\n```\n$$\\langle n_k\\rangle_S =\
    \ \\frac{mv-1}{vs-1} \\left( \\frac{s}{k} \\right) (v-1)^k = f \\binom{s}{k}(v-1)^k,\
    \ \\quad (295)$\n```\n\nwith\n\n```\n$f = \\frac{mv-1}{vs-1}. \\quad (296)$\n\
    ```\n\nTherefore:\n\n```\n$$\\langle\\tilde{\\psi}(y)\\rangle_\\psi = \\delta_{\t\
    ilde{y},y}B(0) + f \\Psi_y \\sum_{k=1}^s B(k) \\left( \\frac{s}{k} \\right) (v-1)^k.\
    \ \\quad (297)$\n```\n\nFrom the beliefs Equation 286, we see that\n\n```\n$$\\\
    sum_{k=1}^s B(k) \\left( \\frac{s}{k} \\right) (v-1)^k = \\sum_{k=1}^s B(k) \\\
    left( \\frac{s}{k} \\right) (1-\\epsilon) \\left( 1 + \\frac{\\epsilon}{v} \\\
