- pgno: 285
  md: 'from a random initialization. Both the base models achieve non-trivial or moderate
    accuracy on the majority of benchmark tasks, using both non-linear and linearized
    fine-tuning dynamics.


    These findings reinforce the intuition that non-pretrained models are not failing
    in task arithmetic due to their inability to learn the task initially. Instead,
    as argued earlier, the primary reason for the failure of non-pre-trained models
    in task arithmetic is their lack of weight disentanglement.


    Interestingly, the performance of the randomly-initialized large model is generally
    poorer compared to the base models. This observation can be attributed to the
    models'' tendency to overfit the training data, which is more likely to occur
    when a model has larger capacity.'
