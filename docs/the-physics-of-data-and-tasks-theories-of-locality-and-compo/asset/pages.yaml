  md: '# A RACE BETWEEN MEMORIZATION AND GENERALIZATION


    [Yoo+23; Kad+23b; Gu+25] interpret memorization as an overfitting phenomenon driven
    by the large capacity of overparameterized networks. [Kad+23b] shows that underized
    models on disjoint training sets learn the same score function, therefore generalizing
    by sampling the same target distribution; contrast, overparameterized models memorize
    their respective data. [LDQ24; WV24] find that during their initial phases, overparameterized
    diffusion models have an inductive bias towards learning a Gaussian approximation
    of data. This process achieves a primitive form of partial generalization by capturing
    some data''s low-dimensional structure before the model begins to fully memorize
    the training points. Our results extend this viewpoint to later training stages
    and higher-order data statistics. Additionally, we quantify the timescale at which
    models transform from generalizing to memorizing.


    # THEORY OF DIFFUSION


    Diffusion models


    Under mild assumptions on the data distribution, diffusion models achieve a sample
    complexity scaling exponentially with data dimension [BMR20; OAS23]. The sampling
    and memorization process has been studied for Gaussian mixtures and linear manifolds
    using the empirical score function [Bir+24; Amb23; Ach+24; Ach+25; LC24]. Learning
    the empirical score function was studied in [Cu+23; SCK3; HRX24]. The memorization-generalization
    trade-off in terms of model capacity with random features was studied in [GVM2].
    Generalization bounds for early-stopped features learning simple functions were
    developed in [Li+23]. [BM23; Amb23; Bir+24] show for Gaussian mixtures the existence
    of a characteristic noise level during the diffusion process where the single
    modes merge into one. In [Bir+24], another noise scale is identified, corresponding
    to short diffusion times, where the backward process collapses into the single
    data points, associated with memorization. [KG24] studies generalization in diffusion
    models through the inductive bias of translational equivariance and locality.
    [Fav+25] show that UNet diffusion models sequentially learn different levels of
    the grammatical rules, with a sample complexity polynomial in data.


    # OVERFITTING IN SUPERVISED LEARNING VS. DIFFUSION MODELS

    Although the dynamics of first generalizing then overfitting to the training data
    is also observed in some supervised learning settings [ASS20; Nak+19] – where
    recent theoretical progress has been made [MU25] – these problems have fundamental
    differences with memorization in diffusion models, i.e., learning the empirical
    score. For instance, in a typical regression task, a model fits a target function
    whose observations are assumed to be corrupted by external,'
