  md: "# THE ROLE OF DEPTH AND SPATIAL ADAPTIVITY\n\nMore specifically, we investigate\
    \ the generalization properties of deep CNNs with non-overlapping patches and\
    \ no pooling (defined in Figure 2 for an illustration). These networks are trained\
    \ on a target function $f^*$ via empirical minimization of the mean squared loss.\
    \ We consider the infinite-width limit of the networks (Section 3.3), where the\
    \ parameters change infinitesimally over training, thus the network coincides\
    \ with the corresponding Neural Tangent Kernel (NTK). Thus, generalization is\
    \ fully characterized by the spectrum of the integral operator of the kernel:\
    \ in simple terms, the projections on the eigenfunctions with larger eigenvalues\
    \ can be learned — to error with fewer training points (e.g., Bach [Bac21]).\n\
    \nSPECTRA (Theorem 3.3.1). Due to the network topology, hidden neurons in each\
    \ layer depend only on the scale of the input referred to as the neuron's receptive\
    \ field (highlighted by colored boxes in Figure 2, left panel). We show that the\
    \ NTK eigenfunctions of a CNN of depth $L+1$ can be organized into sectors indexed\
    \ by the layer index $l=1,...,L$ (Theorem 3.3.1). Each sector consists of eigenfunctions\
    \ depending only on the receptive fields of the neurons of the hidden layer. By\
    \ $d_{eff}(l)$ the scale of the receptive fields of neurons in the $l$-th layer,\
    \ the eigenfunctions of the $l$-th sector are functions of $d_{eff}$ variables.\
    \ We characterize the asymptotic decay of the eigenfunctions in the polynomial\
    \ degree of the corresponding eigenfunctions (Theorem 3.3.1), and show this decay\
    \ is governed by $d_{eff}(l)$. Consequently, the eigenfunctions with the largest\
    \ eigenvalues — the easiest to learn — are those that are supported on small,\
    \ localized subsets of the input and have low polynomial degree. This spectral\
    \ structure is our main technical contribution, and all of our conclusions follow\
    \ from it.\n\nSPATIAL ADAPTIVITY (Corollary 3.4.0.1). We leverage the spectral\
    \ characterization to prove that deep CNNs can adapt to the scale of the target\
    \ function (Section 3.4). By applying rigorous bounds from the theory of kernel\
    \ ridge regression [CDV7] (reviewed in the first paragraph of Section 3.4), we\
    \ prove that when learning with the kernel of a CNN and optimal regularization,\
    \ the error depends on the effective dimensionality of the target. In particular,\
    \ if $f^*$ depends only on a localized group of $d_{eff}$ input variables, then\
    \ the generalization error $\\mathcal{E}(P) \\sim P^{-\beta}$ with $\beta \\ge\
    \ \\mathcal{O}(1/d_{eff})$ (Corollary 3.4.0.1, see Figure 2 for a typical representation).\
    \ This is consistent with non-rigorous results from the replica method for the\
    \ ridgeless case [BCP20; Lou+21b].\n\n(Section 3.5)."
