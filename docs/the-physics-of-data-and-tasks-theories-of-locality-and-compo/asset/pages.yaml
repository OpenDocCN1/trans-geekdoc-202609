    $p_0$ depends on the noise level $\epsilon$ as $p_0 = 1-\epsilon/v$. In the large
    limit $D \to \infty$, the probability $p_D$ of reconstructing the class is given
    by the fixed points of $F(p)$. For RHM measures such as $p_\ell$ undergoes the
    phase transition, $F(p)$ has three points: two attractive ones, corresponding
    to $p=1/v$ and $p=1$, and a repulsive one, corresponding to the non-trivial solution
    of $p^*=F(p^*)$ with $p^* \in (0,1)$. $p^*$ corresponds to a critical noise level
    $\epsilon^*=1-p^*$.


    In the vicinity of $\epsilon^*$ and the limit $L \to \infty$, we can estimate
    the typical distance over which taken changes are corrected by computing the number
    of layers $\ell$ after which the upward probability of reconstructing the latent
    variables $p_\ell$ approaches one of the two fixed points $p=1$ and $p=1/v$. This
    corresponds to the number of layers required to escape the repulsive fixed point
    $p^*$.


    Given the iterative map of Equation 80, we can linearize it around the fixed point
    $p^*$ and iterate for $\ell$ layers,


    ```

    $\Delta p_{\ell} = \left( \frac{dF(p)}{dp} \right|_{p^*} \right)^{\ell} \Delta
