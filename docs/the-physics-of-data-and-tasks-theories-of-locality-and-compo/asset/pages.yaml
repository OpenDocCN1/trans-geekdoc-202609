  md: '# C.2 BELIEF PROPAGATION EQUATIONS


    ![](img/86150bd6d44cb578b97e3eba954b7be2_220_0.png)


    Figure 42: Tree-graph connecting the higher-level feature Y to the lower-level
    features $X_{1,...,n}$ according to the rules $\psi$. The upward messages $v(Y)$
    are computed from the upward messages $v^+(X_i)$ coming from the nodes $X_i$,
    connected to $Y$ through the rule $\psi$ (panel a). The downward messages $v^-(x_i)$,
    instead, are computed from the downward messages $v^-(y)$ coming from $Y$ and
    the upward messages $v^+(x_i)$ coming from the nodes $X_{i-2,...,s}$ connected
    to $X_i$ through the rule $\psi$ (panel b).


    # C.2.1 e-process


    In this process, we consider a reference configuration at the leaves variables
    $X_i^{(0)} = \hat{X}_i$, that we like to reconstruct, given a noisy observation
    of it. As a result of noise addition, our belief in the correct sequence is corrected
    by $\epsilon \in [0,1]:


    > $$X_i^{(0)} = \hat{X}_i \text{ with belief } 1 - \epsilon \n X_i^{(0)} \text{
    uniform over alphabet with belief } \epsilon. $ (284)$


    Therefore, the initialization condition of the upward BP messages at a leaf node
    $X_i^{(0)}$ is


    > $$\begin{cases} v_t(\hat{X}_i) &= 1 - \epsilon + \epsilon/v, \ v_t(X_i \neq
    \hat{X}_i) &= \epsilon/v \end{cases}$ $ (285)$


    where $v$ is the corresponding alphabet size. The initialization condition at
    the root node $X^{(L)}$, that corresponds to the messages $v^{(L)}$ for that node,
    is uniform over the alphabet $\mathcal{A}$, so the algorithm has no bias on any
    specific class.


    # C.2.1.1 Upward iteration


    We consider the upward iteration when going from the bottom layer to the one above
    it. Let $X_1,...,X_s$ denote a tuple at the bottom level which is associated with
    the reference values $\hat{X}_i$. This tuple is connected to the higher level
    feature Y via a set of rules $\phi$ (Figure 42). According to $\psi$, the association
    from the reference low-level sequence $X_1,...,X_s$ is given by


    $\tilde{y} \to \hat{X}_1,...,\hat{X}_s.$'
