  md: "# LOCALITY DEFEATS THE CURSE OF DIMENSIONALITY\n\nHere, $x$ denotes a $d$-dimensional\
    \ input, and $x_i$ represents the $i$-path of $x = \\{x_1, \\dots, x_{t-1}\\}$,\
    \ of length $t < d$. The indices $i$ belong to a subset $\\mathcal{P}$ of $\\\
    {1, \\dots, d\\}$. The functions $g_i$ and $g$ are random functions, with smoothness\
    \ governed by an exponent $a_i$. For instance, such functions can be realized\
    \ by randomly initialized one-hidden-layer networks. $f^{LC}$ corresponds to the\
    \ output of a *locally connected network* (LCN) [Fuk75; Le+85], where inputs are\
    \ first decomposed into smaller patches before processing, while $f^{CN}$ characterizes\
    \ networks imposing invariance to input shifts by weight sharing, under an appropriate\
    \ choice of $\\mathcal{P}$.\n\nOur objective is to compute the learning curve\
    \ $\beta$ achieved by a student performing kernel regression. Specifically, the\
    \ student kernel embodies a prior on the true function described by the teacher\
    \ in Equation 20, albeit different from the teacher in terms of filter size ($s$)\
    \ and smoothness ($a_s$). This model includes infinite-width-one-hidden-layer\
    \ neural networks in the lazy training regime as a special case [JGH18; Du+19;\
    \ Lee+19; Aro19].\n\nIn this chapter, we analyze a teacher-student model, where\
    \ the teacher is a Gaussian field with covariance $K_T(x, x')$, possessing a filter\
    \ size $t$ and a smoothness exponent $a_t > 0$. Kernel regression is implemented\
    \ by a student with corresponding parameters $s$ and $a_s > 0$. Our main contributions\
    \ are as follows.\n\nUsing recent findings based on the method from statistical\
    \ physics for generalization in kernel methods [BCP20; CBF21; Lou+21a], we derive\
    \ the learning curve exponent. We establish that $\beta = a_s/s$ when $t \\leq\
    \ s$ and $a_s \\leq 2(a_t + s)$. Although this result is not rigorous in general,\
    \ it is for Gaussian fields when data are sampled from a lattice [GW20], and it\
    \ corresponds to a provable lower bound on the error when teacher and student\
    \ are matched [MW81]. We systematically verify our theoretical predictions through\
    \ numerical experiments performing ridge regression across various filter sizes\
    \ $t, s$, and input dimensions $d$. Furthermore, leveraging the recent work of\
    \ Jacob et al. [Le+23] and a Gaussian assumption, we obtain a rigorous estimate\
    \ of $\beta$ for ridge regression when the ridge parameter decreases with the\
    \ size of the training set. Crucially, the exponent depends only on $s$ and is\
    \ independent of $d$, explicitly demonstrating that using local filters on compositional\
    \ data allows circumventing the curse of dimensionality.\n\nCollectively"
