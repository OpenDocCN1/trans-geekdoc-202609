- pgno: 4
  md: '# RESUMÉ


    Les réseaux de neurones ont connu un succès remarquable, mais notre compréhension
    de leur mode d''apprentissage reste limitée. Ces modèles peuvent apprendre à partir
    de données de haute dimension, ce qui est en général statistiquement intraitable
    en raison de la malédiction de la dimensionnalité. Ce paradoxe apparent suggère
    que les données apprises peuvent posséder une structure latente sous-jacente.
    Quelle est la nature de cette structure ? Comment les réseaux de neurones l''encodent-ils
    et l''explitent-ils, et quel est son impact aux performances – par exemple, la
    généralisation s''améliore-t-elle avec le nombre d''exemples d''entraînement ?
    Cette thèse aborde ces questions en étudiant les rôles de la et de la compositionnalité
    dans les données, les tâches et les représentations issues de l''apprentissage
    profond.


    Nous commençons à analyser les réseaux de neurones convolutifs dans la limite
    d''infini. À l''aide d''outils de la physique statistique et de la théorie de
    l''apprentissage, nous caractérisons leurs capacités de généralisation et montrons
    qu''ils peuvent surmonter la limite de la dimensionnalité si la fonction est locale,
    en s''adaptant à une échelle spatiale.


    Nous nous intéressons aux structures complexes auxquelles sont composées hiérarchiquement,
    avec des éléments de grande échelle construits à partir de caractéristiques à
    plus petite échelle. Nous modélisons de telles données à l''aide de simples grammaires
    hors-contexte probabilistes – des modèles graphiques d''autre utilisés pour décrire
    des domaines tels que le langage et les images. Dans ce cadre, nous étudions comment
    les modèles génératifs par diffusion produisent de nouvelles données en assemblant
    des caractéristiques apprises à partir d''exemple. Cette théorie de la composition
    prédit une transition de phase dans le processus génératif, que nous confirmons
    empiriquement dans les modalités image et langage, qui soutiennent l''hypothèse
    d''une structure compositionnelle des données naturelles. Nous démontrons que
    le nombre d''exemples nécessaires à l''apprentissage de ces grammaires croît polynomialement
    avec la dimension des données, fournissant ainsi un mécanisme par lequel les modèles
    de diffusion évitent la malédiction de la dimensionnalité apprenant à composer
    de nouvelles données de manière hiérarchique. Ces résultats offrent une base théorique
    à la compréhension de la généralisation chez les modèles génératifs, et, en fin
    de compte, de leur capacité à devenir créatifs.'
  merge: -1
  img_proc: true
- pgno: 5
  md: 'Enfin, nous explorons comment les tâches et les compétences elles-mêmes peuvent
    être localisées et composées dans l''espace des poids du modèle. En particulier,
    nous montrons empiriquement que des directions distinctes dans l''espace des poids
    de grands modèles entraînés sont associées à des zones sémantiques spécifiques
    et localisées dans l''espace des fonctions, et comment cette structure modulaire
    permet une arithmétique des tâches et l''édition de modèles à grande échelle.


    **MOTS-CLÉS** Apprentissage profond, généralisation, lois d''échelle, structure
    des données, localité, compositionnalité, modèles graphiques probabilistes, réseaux
    convolutifs, modèles de diffusion.'
