  md: '# APPENDIX: A RACE BETWEEN MEMORIZATION AND GENERALIZATION


    # F.1 EXPERIMENTAL DETAILS


    # F.1.1 Vision diffusion models


    IDDPM In our experiments, we utilize Improved Denoising Diffusion Probabilistic
    Models (IDDPMs) for image generation on the CIFAR-10 and CelebA datasets, following
    the codebase of Improved DDPMs [ND21]: https://github.com/openai/improved-diffusion.
    Specifically, we train IDDPMs with 256 and 128 channels for CIFAR-10 and respectively.
    Our models are implemented using a U-Net architecture with attention layers and
    3 resolution blocks. We use 4,00 diffusion steps, a cosine noise schedule, a learning
    rate of $10^{-4}$, and a batch size of 128. Training is performed for 262,144
    steps using a hybrid objective [ND21] and the Adam optimizer with drift of 0.3.


    STABLE DIFFUSION We-tune Stable Diffusion v2.1 using the codebase https://github.com/somepago/DCR
    from [Som+22; Som+23]. The model is pre-trained on LAION-2B [Sch+22] and consists
    of a diffusion U-Net architecture with frozen text and autoencoder components.
    We-tune the U-Net for 262,144 steps with 8,192 images from the LAION-10 dataset
    at resolution $256 \times 256$, using a batch size of 16. We employ a constant
    learning rate of $5 \times 10^{-6}$ with 5,000 warm-up steps and a single image-caption
    pair per datapoint.


    # F.1.2 Language diffusion models


    MD4 Our experiments leverage the codebase of MD4 [Shi+24], available at https://github.com/google-deepmind/md4.
    MD4 is a masked diffusion model that progressively transforms tokens into a special
    [MASK] token as training progresses. Specifically, at each timestep $t$, each
    non-masked token has a probability $\beta t$ of being replaced by [MASK]. The
    forward transition process for this model can be formally described using a one-hot
    encoding of the $|V| + 1$ states, where the transition matrix is defined as:


    ```

    $Q_t = (1 - \beta_t)I + \beta_t e_M$.

    ```


    1 https://huggingface.co/stabilityai/stable-diffusion-2-1'
