  md: '# B.2 RFK AND NTK OF DEEP CONVOLUTIONAL NETWORKS


    B.2 RFK AND NTK OF DEEP CONVOLUTIONAL NETWORKS


    This appendix gives the functional forms of the RFK and NTK of hierarchical CNNs.
    We refer the reader to [Aro+19] for the derivation.


    # Definition B.2.1 (RFK and NTK of hierarchical CNNs). Let $x, y \in \mathcal{M}^{PS}
    = \prod_{l=1}^{L} \mathcal{S}^{l-1}$. Denote tuples of the kind $i_l i_{l+1} \dots
    i_m$ with $i_l \to m$ for $m \geq 1$. For each tuple $i_l \to L+1$, note with
    $t_{i_l \to L+1}$ the scalar product over the $s$-dimensional patches of $x$ and
    $y$ identified by the same tuple, i.e


    ```

    $t_{i_l \to L+1} = x_{i_l \to L+1} \cdot y_{i_l \to L+1}. \quad \quad (202)$

    ```


    For $1 \leq l \leq L+1$, with $\{t_{i_l \to i_j}\}_{j=l+1}^L$ the sequence of
    $t^s$ obtained by letting the indices of the tuple $i_l$ vary in their respective
    range. Consider a hierarchical CNN with $L$ hidden layers, filter sizes $(s_1,
    \dots, s_L)$, $p_l \geq 1$ and all the the weights $w_j^{(l)}, w_{i_l \to i_{l+1}}^{(l-1)}$
    initialized as Gaussian random numbers with zero mean and variance.


    RFK. The RFK (or covariance kernel) is a function $K^{(L+1)}_{RFK}$ of the $p_1$
    and scalar products $t_{i_1 \to i_2}$, which can be obtained recursively as follows.
    With $\kappa_1(t) = (\pi - \arccos t)t \sqrt{1-t^2} / \pi$,


    ```

    $\kappa^{(1)}_{RFK}(\{t_{i_1 \to i_2}\}) = \kappa_1(t_{i_1 \to i_2}),\n\nkappa^{(l)}_{RFK}(\{t_{i_l
    \to i_j}\}_{j=l+1}^L) = \kappa_1 \left(\\frac{1}{s_l} \sum_{i_l} \kappa^{(l-1)}_{RFK}(\{t_{i_l
    \to i_j}\}_{j=l+2}^L)\right), \forall i \in [2 \ \dots \ L] if \ L > 1;\n\n\kappa^{(L)}_{RFK}(\{t_{i_L
    \to i_{L+1}}\}) = \frac{1}{p_L} \sum_{i_L} \kappa^{(L-1)}_{RFK}(\{t_{i_L \to i_{L+1}}\})
    . \quad \quad (203)$

    ```


    NTK. The NTK of the same hierarchical CNN is also a function of the $p_1=d/s$
    scalar products $t_{i_1 \to i_2}, t_{i_l \to i_{l+1}}$ which can be obtained recursively
    as follows. With $\kappa_0(t) = (\pi - \arccos t) / \pi$,


    ```

    $\kappa^{(1)}_{NTK}(\{t_{i_l \to i_{l+1}}\}) = \kappa_1(t_{i_l \to i_{l+1}}) +
    \kappa_0(t_{i_l \to i_{l+1}}),\n\n\kappa^{(l)}_{NTK}(\{t_{i_l \to i_j}\}_{j=l+1}^L)
    = \kappa^{(l-1)}_{NTK}(\{t_{i_l \to i_{l+1}}\}) + \frac{1}{s_l} \sum_{i_l} \kappa^{(l-1)}_{NTK}(\{t_{i_l
    \to i_j}\}_{j=l+2}^L),\\n\n\times \kappa_0 \left(\frac{1}{s_l} \sum_{i_l} \kappa^{(l-1)}_{RFK}(\{t_{i_l
    \to i_{l+1}}\}))\right), \forall i \in [2 \ \dots \ L] if \ L > 1;\n\n\kappa^{(L+1)}_{NTK}(\\{t_{i_L
    \to i_{L+1}}\}) = \frac{1}{p_L} \sum_{i_L} \kappa^{(L)}_{NTK}(\\{t_{i_L \to i_{L+1}}\})
    . \quad \quad (204)$

    ```


