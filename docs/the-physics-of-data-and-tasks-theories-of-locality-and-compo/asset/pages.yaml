  md: '# 4


    # A PHASE TRANSITION IN THE DIFFUSION

    PROCESS


    In this part of the thesis, we study compositionality in the context of deep generative
    models, specifically diffusion models, and explore how they might leverage the
    compositional and hierarchical nature of data. These models learn to generate
    novel, complex data by composing and assembling features learned from examples,
    much like a writer combines words to form sentences? While idea is intuitive,
    its formal and empirical validation presents a significant scientific challenge.


    This chapters present evidence that diffusion models [SD+15; Hja20; SE+20] do
    operate compositionally, generating images by assembling features across different
    hierarchical levels during the diffusion process. We first provide quantitative,
    empirical evidence of these compositional effects in the denoising diffusion process
    of natural images. We then develop a theoretical framework, based on synthetic
    compositions and hierarchically structured models of data, to explain these observations.


    Diffusion models operate by progressively adding noise to data as time increases
    (the forward process) and then learning to reverse this to generate new classes.
    By adding a finite amount of noise to an image and then denoising, we observe
    that: (i) at low noise levels, only low-level features of the image are modified;
    (ii) at a critical noise threshold, the probability that the denoised output belongs
    to the same class of the original datrum drops sharply to the level of chance;
    (iii) beyond this critical point, high-level features from the original image
    can surprisingly persist and recombine to compose elements of entirely new classes.


    While the first observation is intuitive and has been noted previously [Hja20],
    the sharp phase transition and the subsequent recombination of elementary features
    are surprising. We will demonstrate that these phenomena can be precisely theoretically
    explained using synthetic generative models of data with a built-in hierarchical
    and compositional structure, inspired by concepts from formal grammars and statistical
    physics [Cag24]. Within this framework, we show that the Bayes-optimal denoising
    process can be computed using


    Parts of this chapter have been previously published in:

    Schlocchi, A., Favero, A. and Wyart, M., 2025. A Phase Transition in Diffusion
    Models Reveals the Hierarchical Nature of Data. In Proceedings of the National
    Academy of Sciences (PNAS), 122 (1), e240879121.


    57'
