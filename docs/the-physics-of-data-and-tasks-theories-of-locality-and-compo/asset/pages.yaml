  md: "# CONNECTION TO MASKED LANGUAGE DIFFUSION 233\n\nCONNECTION TO MASKED LANGUAGE\
    \ MODELS: MDLMs leveraging a masked diffusion approach where the training objective\
    \ is a weighted average of classical masked language modeling (MLM) losses:\n\n\
    ```\n$L_{\\text{NELBO}} = \\mathbb{E}_q \\int_0^1 \\frac{\\alpha'_t}{1-\\alpha'_t}\
    \ \\log(x_t^\theta(z_t), x^t) dt, \\quad (384)$\n```\n\nwhere $x_t^\theta(z_t)$:\
    \ The $\\ell$-th token in the original sequence, the neural network's prediction\
    \ for the $\\ell$-th token given the noisy sequence $z_t$. The summation runs\
    \ over all tokens in the sequence, establishing a connection between MDLMs and\
    \ BERT-style encoders equipping them with generative capabilities.\n\nWe employ\
    \ the MDLM proposed in [Sah+24] to conduct the forward-backward experiments by\
    \ random texts of a fixed token length from the WikiText2 database, fixing a fraction\
    \ of the tokens $t$, and then performing the backward diffusion process by the\
    \ masked sequence as the initial point for the MDLM model.\n\n# D.3.2 Examples\
    \ of Test Samples for the Forward-Backward Experiments\n\nBelow, provide examples\
    \ of texts generated by the forward-backward process using MDLM seeded from WikiText2\
    \ examples for different masking processes. Selected samples were shown in the\
    \ main text in Figure 14 (a). We dub the test results after the forward-backward\
    \ process as U-turn samples. As can be seen by the color coding, blocks of words\
    \ change together after the denoising process, as the paragraphs themselves change\
    \ along the phase transition. In blue we denote tokens that have changed their\
    \ value after the backward process, while in green masked tokens that have returned\
    \ to their initial value. Red indicates the changes in the final texts. It can\
    \ be seen that for small masking fractions as $t/T = 0.1$, most of the tokens\
    \ do not change after masking, while the amount of changed tokens far exceeds\
    \ the unchanged ones near the phase transition at $t/T = 0.5$, hinting at the\
    \ long-range correlations emerging."
