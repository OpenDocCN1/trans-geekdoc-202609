    \ \\right)^s \\right] = 1 - B(0), \\quad (298)$\n```\n\nwhich gives\n\n```\n$$\\\
    langle\\tilde{\\psi}(y)\\rangle_\\psi = \\delta_{\tilde{y},y}B(0) + f \\Psi_1\
