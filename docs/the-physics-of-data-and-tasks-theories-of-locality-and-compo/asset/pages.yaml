  md: "# 1.2 GENERALIZATION IN DEEP LEARNING\n\npoor generalization. Instead, they\
    \ frequently achieve zero training error, perfectly interpolating the training\
    \ data, while simultaneously generalizing well to new examples. In fact, the deep\
    \ networks used in practice, thanks to their capacity, easily classify random\
    \ labels perfectly [Zha+17] and still perform well on structured data. This contradicts\
    \ classical expectations and signals a breakdown of traditional theory in the\
    \ overparameterized regime.\n\nOne striking phenomenon is this double descent\
    \ [Spi+19; Bel+19; Nak+19]: the generalization error first increases with model\
    \ complexity – predicts but, then, crossing the interpolation threshold (where\
    \ the model perfectly fits the data), it begins to decrease. This reveals a second,\
    \ unaccounted for by classical bounds. These observations have prompted the search\
    \ for new theoretical tools to understand learning in highly overparameterized\
    \ models.\n\n# 1.2.2 Infinite-width networks\n\nOne tool is the infinite-width\
    \ limit of neural networks. As the number of neurons per layer grows, the network's\
    \ behavior simplifies and, in certain regimes, becomes analytically tractable.\n\
    \nINFINITE-WIDTH AT INITIALIZATION When the weights of a network as in Equation\
    \ 1 are initialized with i.i.d. Gaussian entries with zero mean and unit variance,\
    \ taking the limit of all hidden layers makes the network to behave like a sample\
    \ centered from a convolutional Gaussian function that can be computed recursively\
    \ [Neae96; WRO06; Lee+17]. This was extended to convolutional architectures in\
    \ the same limit, leading to a covariance that depends on the specific architecture\
    \ [Nov+19].\n\nLEARNING IN THE INFINITE-WIDTH REGIME When with gradient descent,\
    \ wide networks can reach a global minimum while keeping the parameters very close\
    \ to their random initialization $\theta_0$. In other words, in this lazy regime,\
    \ the network remains close to its linearization throughout training [JGH18; Du+18;\
    \ Lee+19; Aro+19; COB+19].\n\n```\n$f(x\\theta) \\approx fin(x\\theta_0) = f(x\\\
    theta_0) + (\\theta - \\theta_0)^T \\nabla f(x\\theta_0).\\quad (7)$\n```\n\n\
    Learning is thus reduced to a kernel method with deterministic kernel known as\
    \ the Neural Tangent Kernel (NTK);\n\n1 Kernel methods are algorithms that, given\
    \ a kernel function $K(x,x')$ – a similarity measure between inputs $x$ and $x'$\
    \ – learn a kernel function of the form $f(x) = \\sum_{i=1}^p a_i K(x_i, x)$ with\
    \ learning coefficients $\\{a_i\\}_{i\\in\\mathbb{p}}$ that fit the training data.\
    \ We will give more background on kernels in Chapter 2.\n\n![](img/86150bd6d44cb578b97e3eba954b7be2_22_0.png)"
