  md: '# 5.3 EXPERIMENTS ON NATURAL LANGUAGE AND IMAGE DATA


    forward-backward diffusion. Therefore, it is natural to ask whether any model
    of data displaying spatial correlations, even without a hierarchical structure,
    exhibits the same phenomenology of the RHM in the forward-backward diffusion.


    In Section D.2, we show that this is not the case. In particular, having a Gaussian
    random field model with a covariance having a power-law decaying spectrum. This
    induces spatial correlations in the field that decays algebraically with the distance.
    We show that performing forward-backward diffusion at different inversion times
    $t$ results in a variation field having a correlation length that increases monotonically
    with $t$ and is maximal at the final time $t=T$. This behavior contrasts sharply
    with the hierarchical data studied here, where the growing length scale occurs
    in correspondence with a phase transition at finite inversion time $t^*$.


    In fact, the mechanisms behind the dynamical correlations are different. For Gaussian
    random fields, the noise of diffusion acts as a low-pass filter, which defines
    a characteristic scale below which a mode is reconstructed in the backward process.
    For hierarchically structured data, instead the spatial correlations in the changes
    are associated with latent variables at different levels of the hierarchy. Therefore,
    a diverging correlation length is present only when the reconstruction probability
    of the root node (i.e., the class) undergoes a phase transition.


