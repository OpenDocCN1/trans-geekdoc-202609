  md: "# APPENDIX: TASK COMPOSITIONALITY IN WEIGHT SPACE\n\nNORMALIZED ACCURACIES\
    \ IN TASK ADDITION. Table 5 shows the normalized accuracies after editing models\
    \ by adding the sum of the task vectors on 8 tasks $\\tau = \\sum \\tau_i$. Here,\
    \ the normalization is performed with respect to the single-task accuracies achieved\
    \ by the model fintuned on each task. Mathematically,\n\n```\n$$\\text{Normalized\
    \ accuracy} = \\frac{1}{T} \\sum_{t=1}^{T} \\frac{\\text{acc}[f(x; \\theta_0 +\
    \ \\sum_{t'} \\tau_{t'})]}{\\text{acc}[f(x; \\theta_0 + \\tau_t)]}$  (422)\n```\n\
    \nDISENTANGLEMENT ERROR. To compute the disentanglement visualizations of Figure\
    \ 30 we compute the value of $\\hat{Z}(a1,a2)$ on a $20 \\times 20$ grid of evaluated\
    \ values in $[-3,3] \\times [-3,3]$. To estimate the disentanglement error, we\
    \ use a random subset of 2,048 points for each dataset.\n\nNTK ENFIGEN ESTIMATION.\
    \ We use the finite-width NTK implementation from the forchut library of PyTorch\
    \ [Pas-19] to compute the $K_{NTK}$ matrices described in Section 8.5.1. In particular,\
    \ we use a random subset of 200 training points for each dataset and compute the\
    \ singular value decomposition (SVD) of $K_{NTK}$ to estimate the entries of $\\\
    phi_i$ on each dataset. As described in Bordelen et al. [BCP20], and to avoid\
    \ a high memory footprint, we use a set of singular vectors for each output class,\
    \ estimating one kernel matrix per output log. Figure 33 shows the values of $\\\
    hat E_{oc}(x)$ for each class with a different line. However, there is little\
    \ variability of the NTK among classes, and all curves appear superposed in the\
    \ figure.\n\n# G.2 SPECTRAL ANALYSIS OF LINEARIZED MODELS\n\nIn this section,\
    \ we present the formal statement and proof of Proposition 1. Additionally, we\
    \ delve deeper into the question of eigenfunction localization is a necessary\
    \ condition for task arithmetic and provide analytical examples with exactly-diagonalizable\
    \ NTKs to support our claim.\n\nProposition 6 (Formal version of Proposition 1).\
    \ Suppose that the functions $\\{f_t^i\\}_{t\\in[T]}$ belong to the RKHS of the\
    \ kernel $k$ and their coefficients in the eigenbasis are $\\{c_{t,\\\rho}_{\\\
    rho\\in\\mathbb{N}}\\}_{t\\in[T]}$. If $\\forall t,\\rho$, either $c_{t,\\\rho}=0$\
    \ or $\\text{supp}(\\phi_\rho) \\subseteq D_t$, then the kernel $k$ has task arithmetic\
    \ property with respect to $\\{f_t\\}_{t\\in[T]}$ and $\\{D_t\\}_{t\\in[T]}$.\n\
    \nProof. The task arithmetic property requires that $\\forall t' \\in [T], \\\
    forall x \\in D_{t'}, \\sum_{t\\in[T]} f_t^*(x) = f_{t'}^*(x)$. Representing the\
    \ task functions in the kernel basis, we have\n\n```\n$$\\forall t \\in [T], \\\
    forall x \\in D_t, \\sum_{t\\in[T]} \\sum_{\\rho\\in\\mathbb{N}} c_{t,\\\rho}\
    \ \\phi_\rho(x) = \\sum_{\\rho\\in\\mathbb{N}} c_{t',\\rhorho} \\phi_\rho(x).$\
    \ (423)\n```"
  merge: -1
  img_proc: true
- pgno: 280
  md: "# G.2 Spectral analysis of linearized models 265\n\nThis condition can be rewritten\
    \ as\n\n```\n$D_{\\rho} \\left(\\sum_{t\\in\\mathcal{T}} \\sum_{\rho\\in\\mathcal{N}}\
    \ c_{t,\\rho} \\phi_{\rho}(x)\\right)^2 dx = 0. \\quad (424)$\n```\n\nIf, for\
    \ each $t$, the eigen own corresponding to non-zero coefficients are supported\
    \ within a subset of $D_t$ and all domains $D_t$ are disjoint, then all the sums\
    \ inside the integral in Equation 424 become zero inside $D_{\rho}$, and thus\
    \ the proof is complete.\n\nAs discussed in Section 8.5.1, eigenfunction localization\
    \ is generally not a necessary condition to achieve task arithmetic. However,\
    \ we now show that if the eigenfunctions are linearly independent across the different\
    \ tasks, then the localization property becomes a necessary condition for task\
    \ arithmetic. The proposition presented before formalizes this concept.\n\n+ \
    \  **Proposition 7.** Suppose that the task functions $\\{f_t\\}_{t\\in\\mathcal{T}}$\
    \ belong to the RKHS of the kernel $k$ and their coefficients in the kernel eigenbasis\
    \ $\\{c_{t,\\rho}\\\\}_{rho\\in\\mathcal{N}}$. Furthermore, let the kernel eigenfunctions\
    \ be either zero or linearly independent over each domain $D_t$. The kernel $k$\
    \ has the task arithmetic property with respect to $\\{f_t\\}_{t\\in\\mathcal{T}}$\
    \ and $\\{D_t\\}_{t\\in\\mathcal{T}}$ if and only if $\\forall t, \\rho$, $c_{t,\\\
    rho}=0$ or $\\text{supp}(c_{t,\\rho}) \\subseteq D_t$.\n\nThe initial steps of\
    \ the proofs follow those of integral in Equation 424. Due to the linear independence\
    \ of the non-zero kernel eigenfunctions on $D_t$, for this integral to be zero,\
    \ we have two possibilities:\ni) all coefficients $\\{c_{t,\\rho}\\}_{t\\in\\\
    mathcal{T},\\rho\\in\\mathcal{N}}$ must be zero or ii) the eigenfunctions corresponding\
    \ to non-zero coefficient $c_{t',\\rho}$ ($t \\neq t'$) must be zero in $D_t$.\
    \ Since the proposition is valid for any set of functions, condition (ii) must\
    \ not hold. Furthermore, since Equation 424 is valid $\\forall t' \\in [ \\mathcal{T}\
    \ ]$, it follows that $D_{\\rho} = \\cup_{t\\in\\mathcal{T}, t\\neq t'} D_t$ are\
    \ zero. Consequently, these eigenfunctions are only supported in $D_t$ or a subset\
    \ thereof.\n\nIn order to understand the implications of this proposition, it\
    \ is useful to examine simple data geometries and architectures for which the\
    \ NTK can be analytically diagonal. For instance, when data is uniformly distributed\
    \ on a ring or a torus, the NTK of fully-connected and convolutional neural networks\
    \ at initialization can be diagonalized with the Fourier series [Non-19; CFW23;\
    \ FCW21]. Fourier atoms are linearly independent over any interval [Cc6] and not\
    \ localized. Consequently, according to Proposition 7, these architectures cannot\
    \ perform task arithmetic within such settings. straightforward calculation aligns\
    \ with the observation that task arithmetic emerges as a property of pre-training\
    \ and is not inherently present at initialization, as we numerically demonstrated\
    \ for CLIP models in Section 8.5.2."
