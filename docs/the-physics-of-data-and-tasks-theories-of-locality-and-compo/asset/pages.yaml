  md: "# 8.3 WEIGHT DISENTANGLEMENT\n\nWith Property 1. In Section 8.4, we will use\
    \ this fact to devise a new way to enhance task arithmetic.\n\n# 8.3 WEIGHT DISENTANGLEMENT\n\
    \nIf the linear regime is not necessary to explain task arithmetic, what are the\
    \ necessary conditions that allow it? In this section, we argue that the only\
    \ necessary condition to perform task arithmetic with a model f is that the model\
    \ is disentangled with respect to the set of fine-tuning tasks.\n\n**Property\
    \ 3** (disentanglement). A parametric function $f : \\mathcal{X} \\rightarrow\
    \ \\mathcal{Y}$ is disentangled with respect to a set of task vectors $\\mathcal{T}\
    \ = \\{\tau_i\\}_{i\\in[mathcal{T}]}$ and the corresponding supports $\\mathcal{D}\
    \ = \\{D_i\\}_{i\\in[mathcal{T}]}$ if\n\n```\n$f(\\mathbf{x};\\theta_0 + \\sum_{i=1}^T\
    \ \\alpha_i\\tau_i) = \\sum_{i=1}^T g_i(\\mathbf{x};\\alpha_i\\tau_i) + g_0(\\\
    mathbf{x}),$\n```\n\nwhere $g_i(\\mathbf{x};\\alpha_i\\tau_i)=0$ for $\\mathbf{x}\
    \ \\notin D_i$ and $i=1,...,T$, and $g_0(\\mathbf{x})=0$ for $\\mathbf{x} \\in\
    \ \\bigcup_{i\\in[mathcal{T}]} D_i.$.\n\nIn essence, this definition captures\
    \ that the function f can be decomposed as a sum of spatially-located components,\
    \ i.e., vanishing outside a spatial region, whose functional variation is entirely\
    \ captured by $\\tau_i$ (see Figure 28). Moreover, it is trivial to see that satisfying\
    \ disentanglement is equivalent to satisfying task arithmetic as Property 1 on\
    \ one can easily write Equation 91 as\n\n```\n$f(\\mathbf{x};\\theta_0 + \\sum_{i=1}^T\
    \ \\alpha_i\\tau_i) = \\sum_{i=1}^T f(\\mathbf{x};\\alpha_i\\tau_i)(\\mathbf{x}\
    \ \\notin \\bigcup_{i\\in[mathcal{T}]} D_i) \\n\\+ f(\\mathbf{x};\\theta_0)(\\\
    mathbf{x} \\in \\bigcup_{i\\in[mathcal{T}]} D_i),\n```\n\nand identify $g_i(\\\
    mathbf{x};\\alpha_i\\tau_i) = f(\\mathbf{x};\\alpha_i\\tau_i)(\\mathbf{x} \\in\
    \ D_i)$ and $g_0(\\mathbf{x}) = f(\\mathbf{x};\\theta_0)(\\mathbf{x} \\in D_i)$.\
