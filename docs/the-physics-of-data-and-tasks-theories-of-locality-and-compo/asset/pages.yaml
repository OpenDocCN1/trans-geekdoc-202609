    \ Nonetheless, these models fail to account for essential phenomena observed in\
    \ practice, such as the benefits of depth and the emergence of hierarchical representations.\n\
    \nBEYOND LOW-RANK: REAL-WORLD STRUCTURE Real signals exhibit a complex structure.\
    \ A key example is equivariance or invariance with respect to group actions. Translational\
    \ symmetry in images is a canonical example: if the pixels of a cat shift by a\
    \ few locations, it is still a cat. Convolutional neural networks hard-wire by\
    \ weight sharing, eliminating redundant degrees of freedom.\n\nMore subtle forms\
    \ of invariance, such as stability under deformations, e.g., diffeomorphisms,\
    \ have also been proposed as mechanisms by which networks effectively reduce the\
    \ data dimension [BM13; Mal16]. Recent work, mostly in the kernel regime, quantifies\
    \ how invariances influence sample complexity. For example, Mei et al. [MMM21]\
    \ show that translation-invariant kernels yield modest gains in generalization.\
    \ More generally, Betti et al. [BB21] prove that invariant kernels over symmetry\
    \ groups improve sample complexity by a factor equal to the group size—a non-negligible\
    \ sufficient gain for overcoming the curse of dimensionality. In some cases, such\
    \ as permutations or local translations (which approximate deformations), this\
    \ gain can be exponential, hinting at the importance of deformation stability\
    \ over the curse for image recognition.\n\nAnother pervasive property is spatial\
    \ locality. In many modalities, including vision and language, correlations decay\
    \ with distance: the dominant interactions are local. This implies that, for some\
    \ tasks, it is enough to focus on small neighborhoods (e.g., image patches or\
    \ n-grams in language). For instance, CNNs exploit this by restricting the receptive\
    \ field of neurons to local regions, enabling efficient extraction of salient\
    \ patterns. Furthermore, when long-range dependencies are present, they often\
    \ organize hierarchically across multiple scales: from edges to textures to objects\
    \ in images, or"
