  md: '# 1.4 DEEP LEARNING TODAY


    15


    Recent years have witnessed a qualitative transformation in how deep neural networks
    are trained and deployed. What began as a collection of supervised learning pipelines
    has evolved into a paradigm dominated by colossal, self-supervised models capable
    of acquiring general-purpose abstractions with minimal human supervision.


    From task-specific models to general-purpose systems.


    # 1.4.1 Pretraining, scaling, and emergence


    The advent of large-scale self-supervised learning – encompassing training, modeling,
    and next-token language modeling [Che+20; Rad+21; Dev+19] – has fundamentally
    reshaped the deep learning landscape. These techniques allow models to learn and
    transferable representations from massive corpora of unlabeled data, enabling
    them to generalize across a broad range of tasks. This evolution has been catalyzed
    by the discovery of neural scaling laws [Kap+20; Hen+20], which show that model
    performance improves predictably with increased capacity and training data.


    Importantly, these are not merely quantitative. As models are scaled, qualitatively
    novel behaviors emerge. One prominent example is zero-shot generalization, where
    models can previously solve tasks without any parameter updates. In many cases,
    these models require only a prompt or a few examples at inference time, as shown
    in in-context learning [Bro20]. Techniques further enhance this capacity by allowing
    model behavior with natural language tasks, making task adaptation more robust
    and reliable. Developments suggest that large models go beyond learning patterns;
    they appear to internalize abstract representations of tasks themselves.


    Zero-shot: solve tasks without training.


    In-context learning: learn from prompts.


    On the architectural front, these are often accompanied by a departure from strong,
    domain-specific inductive biases. For instance, vision transformers (ViTs) [Dos+21]
    replace convolutional layers with attention layers, yet still match or exceed
    the performance of CNNs despite being structurally constrained. This trend toward
    more general-purpose architectures, capable of handling multiple modalities, hints
    at an universality across seemingly disparate domains.


    # 1.4.2 Model editing and composition


    Despite the power of pre-trained models, their representations are typically static.
    Adapting these models to new tasks [Zhu+20; Ilh+22; Ilh+23], preferences [Ouy+22;
    Lu+22; RL+22], or robustness requirements [Wor+22; San+21; Oj+21a] have traditionally
    relied on expensive strategies such as joint fine-tuning [Zhu+20],'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# INTRODUCTION


    reinforcement learning with human feedback (RLHF) [Ouy+22], or iterative prompt
    engineering. Beyond the costs, these methods risk catastrophic forgetting, where
    performance on previously learned tasks deteriorates [MC80; Fre99; Wor+22b].


    Current research explored more scalable and effective alternatives based on model
    editing and composition. Rather than retraining from scratch, these methods manipulate
    the weights of models to induce new behaviors while preserving existing capabilities
    (e.g., [Illh+23; AHS52; Illh+22; Wor+22b; Wor+22a; Li+22; MR21; Fra20]). A particularly
    intriguing discovery is the presence of compositional structure in weight space.
    The differences between pretrained and fine-tuned weights – so-called task vectors
    – can be algebraically combined [Ill+23]. For example, adding task vectors from
    two fine-tuned models to a shared base model can yield a new multitask model with
    combined functionality, subtracting a task vector can effectively cause the model
    to ''forget'' a specific capability.


    This observation suggests that models may represent tasks and skills in a way
    that supports composition, like word embeddings encode semantic relationships
    via vector arithmetic.


    # 1.4.3 Questions


    These findings raise important questions that resonate with the broader themes
    in this thesis. If tasks can be composed algebraically in model space, what is
    the structure underlies this ability? Is it merely a consequence of large models
    operating in a near-linear regime, like the aforementioned NTK limit? How are
    distinct skills represented and isolated within the vast parameter space to avoid
    destructive interference when combined?


    A possibility is that task compositionality is a consequence of modularity: large
    models may implicitly learn distinct modules or systems that can be reused and
    recombined across tasks. This raises further questions about the origins of such
    a structure. Is this inherent property of certain architectures, or is it an emergent
    phenomenon that arises from the pre-training process itself? Under what conditions
    does task composition emerge, and what role do model scale and the pre-training
    objective play?


    Such modular organization would provide a potential antidote to the curse of dimensionality.
    Rather than requiring exponentially more data to cover every scenario, models
    could generate novel behaviors by composing a finite set of reusable components.
    Understanding this mechanism is crucial for building more efficient and adaptable
    models.


    We will study task compositionality and propose answers to these questions in
    Part IV.'
