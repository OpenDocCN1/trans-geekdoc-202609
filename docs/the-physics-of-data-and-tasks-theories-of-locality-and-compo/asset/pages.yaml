  md: '# 1.2 GENERALIZATION IN DEEP LEARNING


    substantially during training. As a result, neurons adapt to the structure of
    the data, and the network learns features – a phenomenon entirely absent in the
    NTK limit. This setting is known as the *feature learning regime*, or alternatively,
    the *mean-field limit*.


    The dynamics in this regime is no longer linear. Instead, it can be described
    in terms of a time-evolving density over parameters, yielding a hydrodynamic description
    although interacting particle systems under a potential. This feature-learning
    regime captures richer behavior, including data-dependent representation learning.
    Crucially, it offers a path toward understanding how networks can overcome the
    curse of dimensionality through ‘discovering’ structure from data.


    Theoretical progress in this direction has been primarily limited to two-layer
    networks [MMN18; RVE18; CB18; SS20]. Recent work has extended this framework to
    deeper architectures [Ngu19]. Yet, generalization in this regime remains difficult
    to analyze and typically requires stronger, data-dependent assumptions.


    # 1.2.3 Role of data structure in high-dimensional learning


    As discussed in Section 1.1, learning in high dimensions is, in general, statistically
    intractable. Under minimal regularity assumptions – as Lipschitz continuity –
    the generalization error decays only as $E(P) \sim p^{-1/d}$ [LB02; Wai] becomes
    prohibitive as the dimension grows. Nevertheless, modern networks are able to
    learn high-dimensional tasks with remarkable efficiency. This apparent paradox
    suggests that real-world data distributions are far from generic and possess rich
    internal structure.


    **GLOBAL SMOOTHNESS** A classical structural assumption is that the function $f$
    to be learned belongs to a Sobolev space – that is, it has $m$ square-integrable
    derivatives. In this case, generalization rates scale as $E(P) \sim p^{-m/d}$
    (e.g., [Bac21]). However, this scaling overcomes the curse of dimensionality when
    $m \ll d$, a condition that is implausible in practice.


    **MANIFOLD HYPOTHESIS** An alternative assumption posits that data lie on a $d_M$-dimensional
    manifold embedded in $\mathbb{R}^d$, with $d_M \ll d$. In this case, the sample
    complexity depends on $d_M$ rather than $d$, e.g., [Kpo11; SGW20; HS21]. However,
    empirical studies show that the intrinsic dimension $d_M$ can remain large in
    practice – in the tens or hundreds for visual data [Pop21]. Thus, the manifold
    hypothesis alone does not fully explain the efficiency of deep learning.


    Moreover, both smoothness and low intrinsic dimension can be effectively exploited
    by isotropic kernel methods, which lack'
