- pgno: 113
  md: '# 6.4 NATURAL DATA


    In this section, we investigate whether the hierarchical learning dynamics trained
    on the RHM also emerge in diffusion models on natural data, such as language and
    images. Since both modalities have an inherent compositional structure – where
    words sentences object forms merge – we expect their learning process to progress
    hierarchically as training time or dataset size increases.


    # 6.4.1 Language diffusion models


    We consider MD4 [Shi24], a state-of-the-art masked diffusion model with absorbing
    state for discrete data such as language, as described in Section 3. We train
    MD4 from scratch using a standard GPT-like transformer architecture with 12 layers
    (≈ 165M parameters) on OpenWebText corpus [GC19]. The model is trained for a full
    epoch on the training split (≈ 10^9 tokens) using the same hyperparameters as
    Shi et al. [Shi24]. We save checkpoints at different stages and generate approximately
    10⁴ tokens per model. Figure 20 presents text samples generated at various training
    times. Notice how, as the number of examples increases, the generated text exhibits
    higher coherence. In particular, the intermediate checkpoint (≈ 10⁷ tokens) correctly
    as words but fails to generate coherent sentences, similar to what we observed
    in our synthetic experiments in Section 6.2. At a qualitative level, this mechanism
    resembles children acquire language: first recognizing and grounding sounds into
    syllables, forming words, which are gradually combined into meaningful phrases.


    We confirm this result quantitatively by measuring the token-token correlation
    function of the generated text (Figure 20), as done for the RHM in Figure 17 (c).
    Remarkably, the text generated by networks trained on more tokens displays significantly
    longer-range correlations, implying larger-scale coherence. In Section E.4, we
    provide an alternative measure based on measuring perplexity conditioned to contexts
    of varying length to confirm this.


    # 6.4.2 Vision diffusion models


    For image data, we consider Improved Denoising Diffusion Probabilistic Models
    (DDPMs) [ND21]. Specifically, we train a U-Net model architecture [RFB15; Sal+17]
    with multi-head attention layers [Vas17a] (≈ 120M parameters). The model is trained
    for 10 epochs on ImageNet 64 × 64 using the same hyperparameters as Nichol and
    Dhariwal [ND21]. We save model checkpoints at different training steps and use
    them to generate 10⁴ images per model.'
