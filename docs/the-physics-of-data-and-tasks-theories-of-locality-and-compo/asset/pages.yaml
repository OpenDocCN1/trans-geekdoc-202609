    # G.3.1 Fine-tuning accuracies


    In Figure 76, we report the single-task accuracies achieved by different CLIP
    models before fine-tuning (referred to as *zero-shot*), after fine-tuning with
    different dynamics (referred to as *non-linear FT* and linear FT), and after linearizing
    the non-linearly fine-tuned models (post-hoc linearization).


    These results demonstrate that non-linear fine-tuning consistently achieves the
    highest accuracy, indicating a *non-linear advantage*. However, an interesting
    observation is that the gap between non-linear, and post-hoc linearized models
    diminishes as the model size increases. This trend can be explained by the fact
    that larger models, which are more over-parameterized, inherently induce a stronger
    kernel behavior during fine-tuning. As a result, they tend to stay closer to the
    NTK approximation, closing the gap with linearized models.


    # G.3.2 Detailed results on task addition


    In addition to the results presented in Table 5 in the main text, we report in
    Figure 77 the absolute accuracies of different CLIP models on the single tasks
    (*zero-shot*) and after performing task addition with different strategies (non-linear
    fine-tuning, post-hoc linearization, and linear fine-tuning).


    ![](img/86150bd6d44cb578b97e3eba954b7be2_282_0.png)


    For all models and all datasets, except SUN397 [Xia+16], we observe that linearized
    task addition achieves the highest accuracies. Interestingly, as commented in
    the main text, the gap in linear and non-linear task vectors decreases while increasing
    the size of the model. This observation aligns with the previous observation that
    fine-tuning with larger models is better approximated by the NTK description.'
