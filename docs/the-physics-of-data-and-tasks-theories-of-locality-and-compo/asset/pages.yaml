  md: "# APPENDIX: PROBING HIDDEN HIERARCHIES IN DATA\n\n![](img/86150bd6d44cb578b97e3eba954b7be2_243_0.png)\n\
    \n**Figure 53:** Masking diffusion in the RHM: reconstructing of a (latent) node\
    \ as a function of the inversion time t. This is proportional to the masking fraction\
    \ $t/T$. The probability is averaged over the nodes at a given layer. The probability\
    \ of reconstructing a leaf node (layer 0) decreases smoothly, while the probability\
    \ of reconstructing the root node (layer 10), which is the datum sum, shows a\
    \ sharper decay at a critical time $t^* = 0.2-0.3T$. This sharp decay is expected\
    \ to become a step-like transition in the limit of infinite depth $L \\to \\infty$.\
    \ For RHM parameters $\\omega=36, \\beta_t=2, L=10$, averaged over 10 diffusion\
    \ trajectories per initial data $x_0$.\n\n# D.2.1 Forward-backward coefficients\
    \ in Fourier space\n\nGiven the independence of the Fourier coefficients $X(k)$,\
    \ we apply the diffusion dynamics to each Fourier coefficient independently. The\
    \ noise process is given by:\n\n```\n$X(k) = \\sqrt{1-\\beta_t}X(k)_{t-1} + \\\
    sqrt{\beta_t}\\eta, \\quad \\eta \\sim \\mathcal{N}(0,1),$\n```\n\nfor $t=1,2,...,T$,\
    \ where $\\beta_t$ are the diffusion coefficients and $\\eta$ are independent\
    \ standard Gaussian variables. By enrolling the recursion, the forward dynamics\
    \ can be expressed as\n\n```\n$X(k)_t = \\sqrt{\\bar{\\alpha}_t}X(k)_0 + \\sqrt{1-\\\
    \bar{\\alpha}_t}\\bar{\\eta}, \\quad \\bar{\\eta} \\sim \\mathcal{N}(0,1),$\n\
    ```\n\nwhere $\\bar{\\alpha}_t = \\prod_{i=1}^t (1-\\beta_i)$. We then reverse\
    \ the process at time $t$, following the backward:\n\n```\n$X(k)_{t-1} = \\frac{1}{\\\
    sqrt{\\bar{\\alpha}_t}}(X(k)_t + \\bar{\beta}_t\\nabla_{X(k)}(X(k)_t)) + \\sqrt{\\\
    bar{\beta}_t}z, \\quad z \\sim \\mathcal{N}(0,1),$\n```\n\nwhere $q(X(k)_t)$ is\
    \ marginal probability density of $X(k)_t$ in the forward process and $\\nabla_{X(k)}\\\
    log q(X(k)_t$ is the corresponding score function."
