- pgno: 158
  md: 'The perspective of this thesis has been that of a physicist approaching a complex
    system: seeking to identify the fundamental principles and symmetries that govern
    its behavior. We have argued that for deep learning, two key principles are locality
    and compositionality. By understanding how neural networks find and exploit these
    structures at various levels of abstraction, we move closer to a principled and
    predictive science of artificial intelligence. In particular, the frameworks and
    concepts developed here – from the quantitative impact of locality on generalization,
    the compositional dynamics of generative models, to the notion of weight disentanglement
    – provide new tools and a new language dissecting the success of deep learning.
    As we continue to build larger and more capable models, a deep understanding of
    these foundational principles will not merely be an academic pursuit but an essential
    prerequisite for creating AI systems that are robust, interpretable, and universally
    useful.'
