  md: '# APPENDIX: LOCALITY DEFEATS THE CURSE OF DIMENSIONALITY


    # A-4 PROOF OF THEOREM 2.4.1


    Theorem A.4.1 (Theorem 2.4.1 in the main text). Let $K_T$ be a d-dimensional convolutional
    kernel with a translationally-invariant t-dimensional constituent and leading
    nonanalyticity at the origin controlled by the exponent $a_t > 0$. Let $K_S$ be
    a d-dimensional convolutional or local student kernel with a translationally-invariant
    $s$-dimensional constituent, and with nonanalyticity at the origin controlled
    by the exponent $a_s > 0$. Assume, in addition, that if kernels have nonoverlapping
    patches then $s \ge 1$ is an integer multiple of $t$; and that are uniformly distributed
    on a d-dimensional torus. Then, the following asymptotic equivalence holds in
    the limit $P \to \infty$,


    ```

    $B(P) \sim P^{-\beta}, \quad \beta = a_s/t.$

    ```


    Proof. For the sake of clarity, we start with the proof in the nonoverlapping-patches
    case, and extend it to the overlapping-patches case. Since $K_T$ and $K_S$ have
    translationally-invariant-constituent kernels and data are uniformly distributed
    on a d-dimensional torus, the kernels can be diagonalized in Fourier space. Let
    us start by considering a convolutional student: because of the constituent kernel''s
    isotropy, the Fourier coefficients $\Lambda_k^{(s)}$ of $K_S$ depend on $|k|$.
    Notice the superscript indicating the dimensionality of the student constituents.
    In particular, $\Lambda_k^{(s)}$ is a decreasing function of $k$ and, for large,
    $\Lambda_k \sim k^{-(s+s)}$. Then, $B(P)$


    ```

    $B(P) = \sum_{(|k|<k(P))} \mathbb{E}[|c_k|^2],$

    ```


    where $k(P)$ is defined as the wavevector modulus of the P-th eigenvalue and $\mathbb{E}[|c_k|^2]$
    denotes the variance of the target coefficients in the student eigenbasis. $k(P)$
    is such that there are exactly P eigenvalues with $k \le k(P)$,


    ```

    $P = \sum_{(|k|<k(P))} 1 \sim \frac{d^dk}{(2\pi)^d} \theta(k, P(P)-k) = \frac{\pi^{s/2}}{(2\pi)^s
    \Gamma(s/2+1)} k_T(P)^s$,

    ```


    i.e., $k_T(P) \sim P^{1/s}$.


    By denoting the eigenfunctions of the student with $\Phi_k^{(s)}$, the superscript
    (s) indicating the dimensionality of the constituent plane waves,


    ```

    $\mathbb{E}[|c_k|^2] = \int_{[0,1]^d} d^dx \Phi_k^{(s)}(\mathbf{x}) \int_{[0,1]^d}
    d^dy \Phi_k^{(s)}(\mathbf{y}) \mathbb{E}[f^*(\mathbf{x})f^*(\mathbf{y})]$

    ```


    ```

    = \int_{[0,1]^d} d^dx \Phi_k^{(s)}(\mathbf{x}) \int_{[0,1]^d} d^dy \Phi_k^{(s)}(\mathbf{y})
    K_T(\mathbf{x},\mathbf{y}).

    ```'
