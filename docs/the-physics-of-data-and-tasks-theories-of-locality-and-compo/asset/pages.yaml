    # 5.2.1 Mean-field theory of the ε-process of the RHM


    The average correlation $C_\ell(\epsilon)$ can be computed by the $\epsilon$-process
    of the RHM through a mean-field approximation. This mean-field approach consists
    of computing the average BP messages at each layer $\ell$ which is performed over
    the possible realizations of the RHM rules. Let''s consider two leaf nodes $h_i^{(0)}$
    and $h_j^{(0)}$ connected to the common ancestor $h_\ell^{(\ell)}$ through the
    nodes $h_l^{(\ell-1)}$ and $h_m^{(\ell-1)}$ (see Figure 11 for an illustration).
    Their spin variables are therefore $\sigma_i^{(0)}$, $\sigma_j^{(0)}$, $\sigma_l^{(\ell-1)}$
    and $\sigma_m^{(\ell-1)}$, where we omit the $\epsilon$ to lighten the notation.
    Given the tree structure, the joint probability distribution $P(\sigma_i^{(0)},
    \sigma_j^{(0)})$ can be written as


    ```

    $P(\sigma_i^{(0)}, \sigma_j^{(0)}) = \sum P(\sigma_i^{(0)}|\sigma_l^{(\ell-1)})
    P(\sigma_j^{(0)}|\sigma_m^{(\ell-1)}) P(\sigma_l^{(\ell-1)}, \sigma_m^{(\ell-1)})
    (78)$

    ```


    Each element in the sum of Equation 78 can be written in terms of BP messages,
    and its value can be computed by averaging over the realizations of RHM rules.
    The average of $P(\sigma_i^{(0)}|\sigma_l^{(\ell-1)})$ and $P(\sigma_j^{(0)}|\sigma_m^{(\ell-1)})$
    can be represented as a $2 \times 2$ matrix $\mathbf{T}^{(\ell-1)}$ depending
    on the layer $\ell - 1$. Similarly, the average of the joint probability $P(\sigma_l^{(\ell-1)},
    \sigma_m^{(\ell-1)})$ is a $2 \times 2$ matrix $C^{(\ell-1)}$. In the mean-field
    approximation, we neglect the fluctuations of these quantities. Therefore we compute
    the average probability $P(\sigma_i^{(0)}, \sigma_j^{(0)})$ by substituting the
    elements in the product of Equation 78 with their means. For spin variables $i$
    and $j$ at distance $l_\ell$, we have


    ```

    $C(\sigma_i^{(0)}, \sigma_j^{(0)}) = \mathbf{T}^{(\ell-1)} C^{(\ell-1)} \mathbf{T}^{(\ell-1)}
    (79)$

    ```


    All the expressions for the above quantities are reported in Section D.1.2. With
    a similar procedure, we can compute the average marginal probability $P(\sigma^{(0)})$.
    From these, we obtain the average correlation function $C_\ell(\epsilon)$ at each
    noise level $\epsilon$.'
