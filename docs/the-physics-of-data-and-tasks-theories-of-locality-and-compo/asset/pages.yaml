  md: "# INTRODUCTION\n\nBeyond the fixed biases of CNNs, a deeper question is whether\
    \ networks can learn useful structure from data - such as locality, hierarchy,\
    \ or variance - without being hard-wired into the architecture. What kinds of\
    \ data structures allow neural networks to overcome the curse of dimensionality\
    \ through feature learning, and how does this manifest in practice? Can models\
    \ automatically discover modular or compositional patterns in their inputs, and\
    \ if so, how does this affect their generalization efficiency?\nWe will address\
    \ such questions in Parts II and III of this thesis.\n\n# DEEP GENERATIVE MODELING\n\
    \n# 1.3 unsupervised learning\n\nThe goal of unsupervised learning is to uncover\
    \ the underlying structure of data without access to labels or supervision. This\
    \ is particularly relevant in generative modeling, where we aim to learn a model\
    \ that captures the probability distribution of natural data and can generate\
    \ new, realistic samples from.\n\nReal-world data distributions are complex and\
    \ usually unknown. A common approach is to approximate the true data distribution\
    \ $p_{data}(x)$ with a parameterized model $p_{\theta}(x)$, typically a deep neural\
    \ network. The parameters $\theta$ are learned by maximizing the likelihood of\
    \ the data:\n\n```\n$$\\int p_{data}(x) \\log p_{\theta}(x)dx.$ (12)\n```\n\n\
    In practice, we approximate $p_{data}$ by the empirical distribution over a dataset,\
    \ $\\hat{p}_{data}(x) = P^{-1}\\sum_{i=1}^{P}\\delta(x-x_i)$, yielding a training\
    \ objective that seeks to assign high probability to observed samples. Once trained,\
    \ such a model can be used to sample new data.\n\n# 1.3.2 Score-based diffusion\
    \ models\n\nA breakthrough in generative modeling comes from score-based diffusion\
    \ models, which draw inspiration from non-equilibrium physics [SD+15; HJA20; SEI19;\
    \ Son+20].\n\nThese models define a *forward process* that progressively corrupts\
    \ data, transforming an unknown distribution into a simple, known one by adding\
    \ noise. For instance, in the case of images, this can be implemented as an independent\
    \ random walk per pixel, gradually turning the image into noise. A *backward process*\
    \ is then defined as the reversal of this trajectory: starting from pure noise,\
    \ the model learns to recover naturalistic data.\n\nFormally, the diffusion process\
    \ is defined by a stochastic differential equation (SDE):\n\n```\n$dx = f(x,t)dt\
