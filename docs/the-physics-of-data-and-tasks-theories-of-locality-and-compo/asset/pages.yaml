- pgno: 244
  md: "# D.2 GAUSSIAN RANDOM FIELD MODEL 229\n\nGiven the forward process, $q(X(k)_t)$\
    \ is Gaussian and the score function can be computed explicitly:\n\n```\n$$\\\
    nabla_{X(k)} \\log q(X(k)_t) = -\\frac{X(k)_t}{\tilde{a}_t^2 + 1 - \tilde{a}_t}\
    \ \\quad (372)$\n```\n\n# D.2.2 Mode retrieval\n\nOur goal is to determine which\
    \ Fourier coefficients are retrieved after the reverse process. Specifically,\
    \ we want to compute the $k$ for the distance between the coefficient obtained\
    \ at the end of the backward process $X(k,t)_0 \\sim p(\\\\X(k)_t)$ with the starting\
    \ coefficient $X(k)_0$ is small:\n\n```\n$|\\X(k,t)_0 - X(k)_0| \\le 1. \\quad\
    \ (373)$\n```\n\nThus, we consider the signal-to-noise ratio (SNR) for each mode\
    \ $k$\n\n```\n$SNR(\\kappa, t) = \\frac{\\kappa^*}{\\tilde{a}_t - 1}. \\quad (374)$\n\
    ```\n\nwhere $k = ||\\kappa||$. Define the critical wavevector magnitude $\\kappa^*$\
    \ where $SNR(\\kappa^*, t) = 1$:\n\n```\n$$\\kappa^* = (\\tilde{a}_t^{-1} - 1)^{-1/a}\
    \ \\quad (375)$\n```\n\nModes with $\\kappa < \\kappa^*$ (low-frequency modes)\
    \ have SNR $> 1$ and can be retrieved, while modes with $\\kappa > \\kappa^*$\
    \ (high-frequency modes) have SNR $> 1$ are dominated by the noise in the forward\
    \ dynamics and cannot be reconstructed.\n\n# D.2.3 Correlation analysis\n\nWe\
    \ seek to compute the correlation of the changes after reverting the process at\
    \ time $t$. $x(u,t)$ denote the field obtained after reverting the diffusion process\
    \ at time $t$, at position $u$. In particular, $x(\\cdot,0)$ denote the starting\
    \ random field. Define the difference field $z(u,t) = x(u,t)-x(u,0)$. Both the\
    \ fields are Gaussian, also $z(\\cdot,t)$ is Gaussian.\n\nWe are interested in\
    \ the following spatial correlation function:\n\n```\n$C(r, t) = \\mathbb{E}[z(u,t)^2z(0,t)^2],\
    \ \\quad (376)$\n```\n\nwhere $r = ||u||$. Using Wick's theorem, we have\n\n```\n\
    $C(r, t) = \\mathbb{E}[z(u,t)z(u,t)] \\mathbb{E}[z(0,t)z(0,t)] + 2\\mathbb{E}[z(u,t)z(0,t)]^2.\
    \ \\quad (377)$\n```\n\nThe first term is a constant independent of $r$, while\
    \ the second term captures the spatial dependence."
  merge: -1
  img_proc: true
