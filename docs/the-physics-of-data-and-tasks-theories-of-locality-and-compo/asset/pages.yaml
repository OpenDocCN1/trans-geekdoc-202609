  md: '# A RACE BETWEEN MEMORIZATION AND GENERALIZATION


    the training set size. In the appendix, we provide a theoretical argument for
    kernel methods – including kernels corresponding to infinite-width neural networks
    – showing that a generic empirical score at fixed, low diffusion noise is learned
    with a training time proportional to the training set size.


    We study a discrete diffusion model trained to learn a simple probabilistic context-free
    grammar, where the number of training steps or samples required to generalize
    is known to be polynomial in the sequence length. We show that for moderate training
    set sizes, the diffusion model only learns the lowest levels of the hierarchical
    grammar rules – corresponding to partial generalization before starting to memorize.
    For larger training set sizes, the onset of memorization appears after perfect
    total generalization is achieved. These results lead to a phase diagram for memorization
    and generalization as a function of sample complexity and time.


    On the theoretical level, these findings call for a review of the view of generalization
    in diffusion models as being determined by model capacity, showing that generalization
    arises *during training* in overparameterized diffusion models.


    On the practical level, our results suggest that early stopping and dataset-size-aware
    training protocols may be optimal strategies for preserving generalization and
    avoiding memorization as the size of diffusion models is scaled up. In fact, meeting
    privacy and copyright requirements with principled procedures is of utmost importance
    for the deployment of generative AI, in contrast to heuristic procedures that
    lack quantitative grounding [Doc+22; VKB23; CLX24].


    # 7.1 LEARNING THE SCORE FUNCTION


    Denoising diffusion models are generative models that sample from a data distribution
    by reversing a noise addition process [SD+15; HJA20; SE19; Son+20]. Learning the
    reverse process is equivalent to learning the *score function*, which is proportional
    to the conditional expectation $E[\epsilon|x_0]$. The loss $L$ to learn the score
    function requires an integral over the data distribution $p_0$, which in practice
    is estimated by a Monte Carlo sampling from $P$ training examples $\{\hat{x}_0^{(i)}\}_{i=1}^P$,
    associated with the empirical distribution $\hat{p}_0(x) = \dots$. Therefore,
    perfectly minimizing the empirical loss corresponds to learning the empirical
    score function, which generates $\hat{p}_0$. As a result, diffusion models would
    only generate data of the training set, corresponding to *memorization*. Their
    generalization abilities,杀死, derive from not perfectly minimizing the empirical
    loss.'
