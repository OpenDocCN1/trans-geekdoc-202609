    at which it departs from the critical behavior defines the correlation length
    $\xi$. By matching the distance $r$ with $\xi$ given by Equation 82 and $C(r,\epsilon)$
    with $\epsilon^*, a$, the different correlation functions fit on a single curve.
    This implies that the power-law scaling $\xi \sim |\Delta e|^{-r}$ of Equation
    82 describes well the peaking of the correlation length around the class transition.
    For this choice of RHM parameters, $v \approx 1.78$. The exponent $a = 1$ is obtained
    by fitting the critical distance $C(r, \epsilon^*) \sim r^{-a}$ from the data.


    Collecting the values of $P(h_i^{(0)},h_j^{(0)})\phi$ into a $2 \times 2$ matrix
    $P(h_i^{(0)},h_j^{(0)})$, we obtain


    $P(h_i^{(0)},h_j^{(0)}) = T^{(z-1)}\mathcal{C}(z-1)T^{(z-1)}. \quad (368)


    In the language of the variables introduced in Section 5.2, the probability of
    reconstructing a variable $h_i^{(0)} = \bar{a}_i$ is the probability that $\sigma_i^{(0)}
    = +1$, while $h_i^{(0)} \neq \bar{a}_i$ coincides with $\sigma_i^{(0)} = -1$.


    # D.2 GAUSSIAN RANDOM FIELD MODEL


    Consider $u$ in $[-1,1]$. Let $X(u)$ denote a centered Gaussian random field defined
    over this domain with translational-invariant isotropic covariance function $C(u,u'')$.
    Specifically, the field satisfies $\mathbb{E}[X(u)] = 0$ and $\mathbb{E}[X(u)X(u'')]
    = K(u,u'') = c(||u-u''|)$, where $c$ is a function depending only on the Euclidean
    distance $\|u-u''||$.


    Assume that the Fourier coefficients $C(k)$ of $c(||u-u''|)$ satisfy, for large
    $\|k||$, $C(k) = \gamma ||k||^{-a} + o(||k||^{-d})$, as $\|k|| \to \infty$, with
    $0<a<d$. This implies that the Fourier coefficients $X(k)$ are independent Gaussian
    random variables, $X(k) \sim \mathcal{N}(0,\sigma_k^2)$ with $\sigma_k^2 \sim
    ||k||^{-a}$.'
