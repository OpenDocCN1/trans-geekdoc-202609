    # Training CNNs in Presence of JPEG Compression:

    Multimedia Forensics vs Computer Vision


    Sara Mandelli, Nico Bononetti, Paolo Bagastini, Stefano Tubaro

    Dipartimento di Informatica, Informazione e Biogegneria

    Politecnico di Milano, Leonardo da Vinci 32, 2033 Milano, Italy


    Abstract—Convolutional Neural Networks (CNNs) have proven very accurate in computer
    vision image classification tasks that require visual inspection (e.g., object
    recognition, face detection, etc.). Motivated by these astonishing results, researchers
    have started using CNNs to solve image problems (e.g., forgery detection). However,
    in computer vision, image classification methods typically rely on visual cues
    easily detectable by humans. Conversely, forensics rely on invisible traces under
    analysis. For this reason, training a CNN to solve forensics tasks requires some
    special care (e.g., resampling, compression, etc. can hinder forensics). We compare
    CNN training between computer vision and forensics image classifications. Specifically,
    we consider the effects when generating a training dataset in order to prevent
    losing generalization, whether it is possible to ignore these effects for computer
    vision tasks.


    and defection [10], [11] are just examples of problems where accurate solutions
    are nowadays based on the use of CNNs. However, despite forensic and computer
    vision tasks share similarities, they also have differences. On one hand, forensics
    are often hard to solve through purely-based methods as computer vision tasks.
    As an example, considering an image tampering detection problem, defining a complete
    model accommodating for all image forgery operations is far from being practical.
    The other hand tasks cannot be typically solved by visual humans. As an example,
    it is impossible to tell how many compression steps an image has gone through
    for the shooting, even if the image quality is extremely high.


    # I. INTRODUCTION


    Thanks to the increasing availability of digital data and computational resources,
    CNNs have greatly outperformed other methods for a wide variety of tasks in different
    fields [1], [2]. For instance, they have used outstanding results to solve various
    computer vision problems such as object recognition in the case of object detection
    [3], image segmentation [4], image retrieval [5] and many others. These tasks
    are categorized by two properties: (i) they are extremely challenging to solve
    using a model-based solution (ii) it is hard to define properties that are image
    hidden in order to give a class); they can be reasonably solved by well humans
    through visual inspection (i.e. a human can see the object or scene clearly, given
    the quality of the image analysis is under detect). In other words, we know what
    we are looking for, but we cannot describe it as easily.


    The rise of CNN-based overlaid solutions over classical methods. In the last few
    years, also the forensics community has started replacing more classical detectors
    with CNN-based ones. Camera model identification [6], [7], image tampering localization
    [8], [9]


    The impossibility of extracting forensic information by simple visual inspection
    is due to the fact that forensics are often hidden in the details of the image
    analysis. For instance, forensic information can be hidden in components, in frequency
    and noise-like signals which affect a CNN for a forensic task or for a forensic
    one can be different. As an example, we expect that typical image compression
    and enhancements do not affect our object detection tasks (used as an adversarial
    attack) [12]. In the other words, the class of an image that is compressed, cropped,
    or undergoes remains the same and the operator can still recognize the object.
    Conversely, it is hard to tell whether processing operations on forensics affect
    as we do not easily understand which are the important cues that a CNN can capture.


    In this paper, we specifically focus on compression introduced by training a CNN
    for forensic tasks. JPEG is the most used image compression standard and is well-known
    to forensics. We analyze the effect of using JPEG compression with the consequence
    of JPEG compression with different quality factors during training and testing
    of a CNN. We compare two results on for forensic tasks (i.e., camera model identification
    and detection of synthetically generated images) based on two computer vision
    tasks (i.e., image classification on ImageNet [13] and Lsun [14] datasets). For
    each task, we use different CNNs in order to avoid biases due to some specific
    architectures.


