    # JPEG 压缩存在下的 CNN 训练：

    多媒体取证 vs 计算机视觉


    Sara Mandelli, Nico Bononetti, Paolo Bagastini, Stefano Tubaro

    计算机、信息与生物工程系

    米兰理工大学，Leonardo da Vinci 32, 2033 米兰, 意大利


    摘要—卷积神经网络（CNNs）在需要视觉检查的计算机视觉图像分类任务中（如物体识别、人脸检测等）已证明其具有极高的准确性。受这些惊人结果的启发，研究人员开始使用
    CNN 来解决图像问题（如伪造检测）。然而，在计算机视觉中，图像分类方法通常依赖于人类易于检测的视觉线索。相反，取证依赖于分析中不可见的痕迹。由于这种原因，训练
    CNN 来解决取证任务需要一些特殊处理（例如，重采样、压缩等可能会损害取证）。我们比较了计算机视觉和取证图像分类之间的 CNN 训练。具体而言，我们考虑了在生成训练数据集以防止丢失泛化能力时的影响，以及对于计算机视觉任务，是否可以忽略这些影响。


    伪造和篡改 [10], [11] 只是如今准确解决方案基于 CNN 的问题的几个示例。然而，尽管取证和计算机视觉任务具有相似性，但它们也存在差异。一方面，取证任务往往难以通过计算机视觉任务那样的纯基于的方法来解决。例如，考虑图像篡改检测问题，定义一个能够容纳所有图像伪造操作的完整模型是非常不实际的。另一方面，任务通常无法通过人类视觉解决。例如，即使图像质量极高，也无法判断图像在拍摄过程中经历了多少压缩步骤。


    # I. 引言


    得益于数字数据和计算资源可用性的增加，CNN 在不同领域的各种任务中表现已远优于其他方法 [1], [2]。例如，它们已用卓越的结果解决了各种计算机视觉问题，如物体检测中的物体识别
    [3]、图像分割 [4]、图像检索 [5] 等许多其他。这些任务根据两个属性分类：(i) 使用基于模型的解决方案来解决极具挑战性；(ii) 很难定义图像隐藏的属性以给出分类；它们可以通过人类良好的视觉检查得到合理的解决（即，在图像分析质量低于检测水平的情况下，人类可以清楚地看到物体或场景）。换句话说，我们知道在寻找什么，但无法容易地描述它。


    基于 CNN 的叠加解决方案相对于传统方法的兴起。在过去的几年里，取证社区也开始用基于 CNN 的检测器取代传统的检测器。相机模型识别 [6], [7]，图像篡改定位
    [8], [9]


    无法通过简单的视觉检查提取取证信息，是因为取证信息通常隐藏在图像分析的细节中。例如，取证信息可以隐藏在分量、频率和噪声信号中，这些信号会影响用于取证任务的
    CNN，或者对取证任务的影响可能不同。例如，我们预计典型的图像压缩和增强不会影响我们的物体检测任务（用作对抗攻击）[12]。换句话说，被压缩、裁剪或经过处理的图像类别保持不变，操作者仍然可以识别出物体。相反，很难判断对取证的处理操作是否会产生影响，因为我们并不容易理解
    CNN 可以捕到的哪些是重要线索。


    在本文中，我们特别关注了为取证任务训练 CNN 时引入的压缩。JPEG 是最常用的图像压缩标准，在取证领域为人所知。我们分析了在 CNN 的训练和测试期间使用具有不同质量因子的
    JPEG 压缩的影响。我们比较了在取证任务（即相机模型识别和合成生成图像检测）上，基于两个计算机视觉任务（即在 ImageNet [13] 和 Lsun [14]
    数据集上的图像分类）的结果对比。对于每个任务，我们使用不同的 CNN 以避免由于某些特定架构导致的偏置。


    WIFS 2020, 2020年12月6-9日, 美国纽约。

    ©2020 IEEE.


    为取证任务训练 CNN 的结果需要一些 care（细心），而这种关注在计算机视觉任务中是不必要的。


    通过预先计算 DCT 系数来简化它。在 [28] 中，作者利用 CNN 方法对 JPEG 压缩图像进行对比度调整。CNN 在源设备识别方面已成功优于传统检测器。在
    [29] 中，提出了一种基于 CNN 的去噪方法来代替传统检测器以提升属性性能，而在 [30] 中，使用 CNN 学习像素级的相机指纹和图像噪声方法。生成对抗网络（GANs）和
    DeepFakes [31] 等此类技术的增长，最近专注于同一任务的密度监督。在 [32] 中，作者展示了 GAN 如何在生成的图像中留下不同的痕迹，使调查人员能够检测它们。在
    [33] 中考虑了学习新类型 GAN 的问题。[10] 中提出了一种检测 DeepFakes 的残差神经网络，而在 [11] 中，通过带有注意力机制的网络来实现同一任务，通过不同的处理技术（包括
    JPEG 压缩）。


    我们希望这种方法对于从业人员和研究人员有帮助，以便他们在取证场景中使用强大的数据驱动方法。我们也希望我们的实验能促进该领域的研究。


    # II. 背景


    JPEG 是最常用的压缩方案之一，其工作原理如下。图像被分为 8x8 不重叠块，通过离散余弦变换 (DCT) 计算每个块的系数并转换为整数值。量化步骤会导致信息损失。较低的质量因子表示更强的量化，导致最终解码图像质量较低。量化值随后转换为二进制流。在解码时，二进制流被解码，块通过逆
    DCT 系数在像素域中重建。


    JPEG 留下的特殊痕迹在取证领域已研究多年。8x8 块留下的伪影可以被用来判断图像是否经过了 JPEG 压缩 [15]。众周知量化系数影响锐边缘的方式。这可以通过对齐和未对齐的
    JPEG 压缩来利用 [16], [17]。另一种，[19], [20] 提出了基于首数字逻辑的方法来检测多次压缩。同一任务通过非局部性在 [21] 中完成，对于双重压缩的初级量化步骤通过
    DCT 的统计建模进行估计。JPEG 压缩流水线在定义上有多个自由度（量化规则、量化矩阵对应质量因子等），还可以区分不同的实现（即使用的软件）[23],


    为了调查用于多媒体和计算机视觉任务的 JPEG CNN，我们考虑了两个真实场景作为案例研究：(i) 数据集分析相对于原始 JPEG 图像；(ii) 数据集以未知质量因子进行了压缩。对每个场景的详细描述。


    # A. JPEG 偏移


    在社交网络上共享和上传照片时，经常发生图像在不考虑原始的情况下被裁剪。事实上，这种操作是由大多数用户注意裁剪区域的像素坐标执行的，因为防止 JPEG 压缩图像在未识别真实
    8x8 网格像素的情况下被裁剪更为重要。如果随后将图像保存为 JPEG，则原始图像就丢失了。


    # B. 多媒体取证中的 CNN


    在过去的几年里，遵循新领域的共同趋势，CNN 的性能优于传统检测器。相机模型识别在 [7], [25] 中被检测，其中通过 CNN 从图像中提取深度特征，然后输入基于模型的算法进行分类任务。在
    [26], [27] 中，作者展示了如何训练 CNN 来检测 JPEG 压缩，


    # B. JPEG 压缩的质量因子


    当使用 CNN 解决问题时，JPEG 偏移可能会特定任务产生问题。在第四节中，我们使用了取证图像和计算机视觉任务进行实验。


