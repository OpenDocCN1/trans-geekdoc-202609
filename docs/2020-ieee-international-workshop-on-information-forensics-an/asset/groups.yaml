    ## IV. 实验设置


    ### A. 数据集


    为了对 JPEG 压缩对取证和视觉问题的影响提供足够通观点，我们根据以下内容考虑两个任务：


    **多媒体取证。** 在取证方面，我们处理两个问题：(i) 相机模型识别，即识别图像的来源；(ii) 从原始照片中检测 CNN 生成的图像。如果说第一个问题已经成熟，那么由于基于
    CNN 技术生成的虚假内容图像视频广泛传播，后者在近年来占据了主导地位。为了研究这些问题，我们使用了文献中常用的数据集。对于相机模型识别，我们利用了 Vision
    [35] 中的数据集，考虑了 28 种可用相机模型。对于每个相机模型，我们使用自然图像（每个模型），每个图像提取 10 个大小为 512 x 512 像素的补丁。考虑到
    CNN 生成图像的情况，我们使用生成/原始图像对作为 CNN 生成图像类别（例如，AppleOrange, SummerWinter [36]）。具体来说，我们从类别中选择图像，每张图像提取一个补丁并调整大小为
    224 x 224 像素。


    **计算机视觉。** 对于常见的视觉任务，我们考虑了图像对象识别，即学习将对象分类为描绘特定主体。我们研究了 CNN 在两个数据集上的分类性能。第一个数据集选取自著名的
    ImageNet 数据库 [13]。第二个数据集选取自 Lsun 数据集 [14]。从 20 个不同类别的图像中进行选择。在这两种情况下，我们每张图像提取一个补丁，共同分辨率为
    224 x 224 像素。详细而言，ImageNet 和 Luns 的每类封装了约 1000 和 2000 张图像。


    ### B. 训练与评估


    我们研究了四个网络。其中两个网络选取自最近提出的 EfficientNet 模型集 [37]，它们在视觉和取证任务中均表现出优结果。我们选择 EfficientNetB0
