  md: '# V. RESULTS


    JPEG-grid misalignment, Fig. 1 reports for the problems of camera model identification
    (a), CNN-generated image detection (b) and image classification on the extracted
    subsets of ImageNet (c) and Lsan (d) databases.


    Considering multimedia forensics, we notice that being careful of the JPEG grid
    alignment of the extracted patches is paramount for achieving accuracy. When we
    train on JPEG-aligned patches and test on JPEG compressed, accuracy drops significantly.
    This is especially true for model-generated images (Fig. 1a), where all CNNs report
    accuracy above 0.88, except for the case of training on JPEG-aligned images and
    testing on random copies.


    On the contrary, if we consider the vision tasks (Fig. 1c and 1d), training/or
    testing on patches with or without the grid does not change the achieved results
    in a systematic way. Results are almost uniform for all the networks. Because
    that CNNs are really capturing some information related to visual cues which are
    not hindered by a simple JPEG-grid misalignment.


    Quality factor of JPEG compression. 2, 3, 4 and 5 depict related investigations
    on the JPEG quality factor for EfficientNetB0, EfficientNetB4, ResNet50 and XceptionNet5.


    In these experiments, we notice that multimedia forensics suffers from JPEG quality
