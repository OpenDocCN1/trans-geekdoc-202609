    Factors, indeed, training on augmented data with Q = 99 allows some amount of
    above alignment and accepts results only when the test factor matches the one.
    On the contrary, as JPEG factor decreases, results present a flat behavior for
    all the possible test Q. This phenomenon occurs or is rarely encountered in vision
    tasks, where the dynamic range of output is much more than the average value in
    all examples. This proves that vision tasks are not influenced by training/specific
    JPEG configurations, and results maintain accurate when the image is preserved
    and objects remain detectable.


    # VI. CONCLUSIONS


    In this work, we studied the effect of JPEG compression on CNNs applied to multimedia
    forensics. In particular, we considered the effectiveness of training and testing
    under different quality factors. We compared the results to those obtained in
    the same conditions on two vision tasks.


    Results show that CNNs are extremely delicate in the multimedia forensics scenario.
    If we train a CNN on uncompressed images, it fail when applied to compressed ones.
    If we train a CNN only considering a specific JPEG-grid alignment, vision tasks
    involving analysis and identification are significantly more robust in JPEG compression,
    given that image visual quality remains decent.


    In the light of these results, we will pay particular attention whenever we train
    a CNN or other more sophisticated data-driven'
