    # IV. EXPERIMENTAL SETUP


    # A. Datasets


    In order to provide a sufficiently general idea of the impact of JPEG compression
    on forensics and vision problems, we consider two tasks as per


    **Multimedia Forensics.** Regarding forensics, we tackle two problems: (i) camera
    model identification, i.e., identifying the source quality of an image; (ii) detection
    of CNN-generated images from original photographs. If the first problem is maturing,
    the latter taking the lead in recent years due to the widespread distribution
    of images and videos with fake content produced by CNN-based technologies. To
    investigate these problems, we use well known datasets available in the literature.
    For camera model identification, we exploit datasets from the Vision [35], considering
    the 28 available camera models. For each camera model, we use the natural images
    (per model), extracting 10 patches per image with a size of 512 x 512 pixels.
    Considering the case of CNN-generated images, we use pairs of generated/original
    images for CNN-generated image categories (e.g., AppleOrange, SummerWinter [36]).
    Specifically, we select images from category, extracting one patch per image and
    resizing to 224 x 224 pixels.


    **Computer Vision.** For every common vision task, we consider image object recognition,
    i.e., learning to classify objects to the specific subject depicted. We investigate
    classification performance of CNNs over two datasets. The first dataset is selected
    from the well known ImageNet database [13]. The second dataset is selected from
    Lsun dataset [14]. From images from 20 different categories are selected. In both
    cases, we extract one patch per image, with a common resolution of 224 x 224 pixels.
    In detail, we pack around 1000 and 2000 images per class for ImageNet and Luns,


    # B. Training and evaluation


    We investigate four networks. Two networks are selected from the recently proposed
    EfficientNet of models [37], which exhibit very good results in both vision and
    forensics tasks. We select EfficientNetB0 and EfficientNetB4 as the models. The
    other networks are known as ResNet50 [38] and XceptionNet [39


    Following a common procedure in CNN training, we initialize the networks using
    those trained on ImageNet. All CNNs are trained using cross-entropy loss and Adam
    optimizer with default parameters. The learning rate is initialized to 0.001 and
    decreased by a factor of 10 when the loss does not decrease for 10 epochs. Training
    stops if does not decrease for more than 20 epochs, we pick the best model using
    validation set.


    Concerning the dataset split, we keep 80% of the images for training (divided
    in 85%/15% training and validation sets), leaving the remaining 20% for evaluation.
    All experiments are performed on the set-closed scenario, i.e., a given query,
    the correct category index is identified with the accuracy. After the answer is
    received, the prediction, the highest CNN score is measured with the accuracy.
    The average accuracy per category as evaluated


    All tests are run on a workstation equipped with one Intel® Gold 6224 (8 Cores
    @ 3.30 GHz, RAM 256 GB), NVIDIA RTX 3090 (CUDA Cores @ 1350, 24 GB), running Ubuntu
    18.04.2. We use Albumentations [40] as data augmentation for compressing images
    in JPEG, while we use PyTorch [41] as Deep Learning framework. The code is available
    at https://github.com/polyphonic/pytorch-forensics-vc-


    # C. Experiments


    The four tasks and networks have been tested for considering the impact of two
    JPEG compression aspects.


    **JPEG-midalignment.** In this experiment, for training and testing, we consider
    the two problems as the $8 \times 8$ JPEG grid which starts from the top-left
    pixel; (ii) images are not aligned with the JPEG grid, which starts from any pixel
    position. To simulate this, effect, we compress images using a quality factor
    of 100. This guarantees that images maintain their visual quality in any way.
    To obtain image patches matching the JPEG level, we select patches by cropping
    the images in a $8 \times 8$ grid. To obtain patches not aligned with the grid,
    we extract them in random methods.


    # Quality factor of JPEG compression.


    In this experiment, we consider that evaluation images may be compressed with
    different quality factors $QF \in \{50, 60, 70, 80, 90, 95, 99\}$. We perform
