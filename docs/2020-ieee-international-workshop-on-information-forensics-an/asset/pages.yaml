    # II. BACKGROUND


    JPEG is one of the most widely used compression scheme it works as follows. Images
    are partitioned into 8x8 non-overlapping pixel blocks, DCT Discrete Cosine Transform
    (DCT) is computed for each block coefficients transformed into integer values
    by the selected quantization and quality factor. The quantization step is causing
    information loss. A lower quality factor indicates stronger quantization, then
    lower quality of the final decoded image. Quantized values are then converted
    into a binary stream by lossless coding. At decoding, the binary stream is decoded,
    blocks are reconstructed by inverse DCT coefficients and the image is re-built
    in the pixel domain.


    JPEG leaves peculiar traces that have been studied in the forensics for many years.
    The 8x8 blocks leaving characteristic blocking artifacts that can be exploited
    to tell whether an image underwent JPEG compression [15]. It is also known that
    quantization coefficients affect the way sharp edges depend on the properties
    of an image one has. This can be exploited by aligned and non-aligned JPEG compressions
    [16], [17], [18]. Alternatively, of [19], [20] propose methods based on the first
    digits'' logic to detect multiple compressions. The same task is accomplished
    in [21] by means of nonlocality, which is prone to the negative nature of history.
    Primary quantization step in double compression is estimated by statistical modeling
    of DCT in [22]. The JPEG compression pipeline has reveal several degrees of freedom
    in its definition (the quantization rule, the quantization matrix corresponds
    to a quality factor, etc.), it is also possible to distinguish between implementations
    (i.e., different software used for the compression) [23],


