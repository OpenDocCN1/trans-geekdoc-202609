    # A. JPEG Misalignment


    While sharing and uploading a photo over social networks, it often happens that
    images are cropped without their origin. As a matter of fact, this operation is
    performed by most of users paying attention to the pixel coordinates of the cropped
    area, as it is more important to prevent the present pictures that JPEG-compressed
    images are cropped without the 8x8 grid pixel character identified by true. If
    the image is then further saved as JPEG, the original one is lost.


