- pgno: 7
  md: '# Introduction


    Endoscopic sleeve gastroplasty (ESG) is a minimally invasive endoscopic procedure
    to produce weight loss in patients who have been unresponsive to dietary and lifestyle
    modifications. It was first introduced by Abu Dayyeh et al. in 2013. [1] Since
    then, ESG has witnessed rapid growth and has some advantages over traditional
    bariat surgery, i.e., laparoscopic sleeve gastrectomy, by the ability to achieve
    similar outcomes with a shorter procedure time and comparable major adverse affect
    rate with SG as defined by previous literature. [2, 3] ESG involves reducing the
    size of the gastric reservoir using a fullthickness endoscopic suturing device.
    [4] At 12 months, ESG resulted in total body weight loss and excess body weight
    loss of 16% and 60%, respectively. [5] Previous comparisons demonstrated an equivalent
    morbidity risk and non-inferiority in weight loss after 12 months between ESG
    and SG. [6] Recent data on ESG and LSG showed they were comparable regarding major
    adverse effects: However, they had a greater incidence of 30-day readmissions
    and reinterventions. [2]


    Because ESG is a contemporary procedure, providers may have a lower threshold
    for reintervention due to unfamiliarity with the postcedural course resulting
    in higher reintervention rates than SG. [2] While factors associated with reintervention
    following SG have been explored previously, factors associated with reintervention
    following ESG have not been investigated. [2, 7] In a meta-analysis by Mohan et
    al., the pooled rate of adverse events after ESG was 2.9%. [8] The most common
    AEs include pain, nausea, upper gastrointestinal bleeding, leak or fluid collection,
    pulmonary embolism, and pneumoperitoneum. [9] Although most AEs can be managed
    conservatively, severe AEs, including gastric or peptic leak or fluid collections,
    may require additional intervention.


    In this study, we aimed to develop a risk stratification score that helps determine
    the individualized preoperative risk of reintervention within 30 days following
    ESG.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# Materials and Methods:


    The present study utilized the Metabolic and Bariatric Surgery Accreditation Quality
    Improvement Program (MBSAQIP) database, the largest bariatric-specific database
    worldwide with procedure dates between January 2016 and December 2021. [10] All
    88 accredited bariatric centers report data from all bariatric interventions performed
    at respective centers to MBSAQIP. The MBSAQIP database includes pre-operative,
    intra-operative, and post-operative variables, including patient comorbidities
    and 30-day postoperative outcomes. Due to privacy concerns, the MBSAQIP database
    does not report hospital locations, patient identifiers, or physician data. Only
    complete cases are included in the database. MBSAQIP registry performs regular
    audits and excludes centers with poor 30-day follow-up rates (below 80%) or greater
    than a 5% disagreement rate. [11]


    # Study Population


    This study utilized the MBSAQIP database 2016-2021 to identify patients who underwent
    Endoscopic sleeve gastrostomy (ESG). A intervention was defined as an endoscopic,
    surgical, or radiologic intervention procedure completed following ESG within
    30 days of the primary procedure. [12] These also included any interventional
    radiology or surgical interventions as previously defined. [12] Cases were excluded
    if age was less than 18, underweight (BMI < 30), incomplete data, miscoded, and
    those undergoing revision or conversion procedures. [13] Potential clinical variables
    in the database were assessed a priori based on scientific knowledge and predictors
    identified in recent literature. [2] Variables with missing data were excluded.
    A correlation matrix was used to evaluate all explanatory variables for collinearity
    (Supplementary File 1). Variables with a correlation coefficient > 0.7 were excluded
    if present. The candidate risk factors include demographics (i.e., age, body mass
    index, gender), clinical variables, laboratory data (i.e., albumin, hematocrit,
    and creatinine), and comorbidity data (i.e., history of thromboembolism, myocardial
    infarction, etc.). All 26 candidate variables can be found in Table 1.'
