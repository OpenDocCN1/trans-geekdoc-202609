- pgno: 11
  md: '# ESGRS = (1.6xlhistory of foregut surgery -0.80xlfemale gender + 0.80x preoperative
    AC use + 0.49x hypertension + 0.48x ASA score≥ 2 + 4.41) / 7.81 x 100


    In this formula, for all variables, yes equals 1, and no equals 0.


    The 10-fold cross-validated mean AUC (cvMean) of the LASSO predicted model (Figure
    I) was 0.74(Bootstrap Bias Correct 95%CI: 0.70, 0.78), which correlated to a 74%
    probability of model predicting recurrence after ESGRS within 30 days. 10-fold
    Cross-validation involves randomly dividing the set of observations into ten groups
    of approximately equal size. The first group is treated as a validation set, and
    the method fixes the remaining nine groups.


    The cut-off for this score was determined by the Youden index, which maximizes
    the sum (addition) of sensitivity and specificity of each available cut-off and
    selects the maximum sum. [17] For ESGRS, the optimal cut point was 67.9 (high
    risk versus low risk), with a sensitivity of 0.76 and specificity of 0.71. An
    ESGRS ≥67.9 had a 76.1% positive predictive value (95% CI: 74.7%–77.5%), and an
    ESGRS <67.9 had a 61% negative predictive value (95% CI: 59%–62.4%).


    The calibration belt plot reported no significant miscalibration at the 95% and
    99% confidence levels (Figure 2). A calibration belt indicates if the predictive
    model is overfitting the study sample at different confidence intervals and assessing
    goodness of fit. The calibration belt''s performance is superior to the Hosmer–Lemeshow
    C test for assessing goodness of fit. [18] If the predictive model does not over
    the derivation sample, which means good applicability to external samples, it
    should demonstrate a non-significant P-value on the calibration plot. In our analysis,
    ESGRS, the predictive model probabilities'
