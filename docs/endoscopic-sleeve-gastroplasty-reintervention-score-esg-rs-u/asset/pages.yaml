    # Results


    A total of 3583 patients were included in the present analysis. The demographic
    and clinical

    characteristics are shown in Table 1. The 30-day endoscopic reintervention rate
    for ESG cases was 3.3%,

    even out of the 26 predictors were retained by LASSO regression for predicting
    30-day reintervention,

    with a mean lambda of 0.003, including eleven variables were selected by LASSO,
    including the history

    of foregut surgery, preoperative anticoagulation (AC) use, female gender, long
    term steroid use, history of

    percutaneous coronary intervention, ASA score >=2,hypertension, preoperative GERD
    diagnosis, history

    de deep venous thrombosis, preoperative albumin, and hematocrit (table 2)


    After multivariable logistic regression, five variables were statistically significant,
    including the history

    of foregut surgery (OR 4.98, 95% CI 3.08–8.06, P < 0.001), preoperative AC use
    (OR 2.22, 95% CI

    1.10–4.51, P = 0.02), female gender (OR 0.44; 95% CI 0.29–0.68; P = 0.01), ASA
    score >=2(OR 1.62,

    95% CI 1.03–2.52, P = 0.03), and hypertension (OR 1.63, 95% CI 1.11–2.40, P =
    0.01)(Supplementary

    file 2).


    Using this multivariable model, a risk score, named ESGRS, was inferred using
    the above factors

    weighted by their regression coefficients in the multivariable logistic regression
    model (Table 2). The

    following formula developed the ESGRS.'
