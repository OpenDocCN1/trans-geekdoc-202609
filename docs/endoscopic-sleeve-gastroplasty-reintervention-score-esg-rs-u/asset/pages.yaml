- pgno: 1
  md: '# Predicting 30-Day Reintervention RISK after Endoscopic Sleeve Gastroplasty
    using Machine Learning


    # Methods and Cohort


    **Dataset**: 3,583 patients from the MBSAQIP database (2016-2021)


    **Method**: LASSO penalized regression for predictor selection, multivariate analysis
    for ESG-RS generation


    ![](img/7cba93ff56616bb855b7727edcaa3846_1_0.png)


    # Results


    **11 variables selected, 5 key factors influencing reintervention risk:


    +   - History of foregut surgery

    - Preoperative AC use

    - Female gender

    - ASA score >= 2

    - Hypertension


    **Model performance**: AUC = 0.74 (95% CI: 0.70, 0.78)


    **Optimal cut point**: 67.9 (high risk vs. low risk); Sensitivity: 0.76, Specificity:
    0.71


    # Conclusion


    The ESG-RS aids clinicians in preoperative risk stratification and helps identify
    patients at a higher risk of reintervention, enabling better decision-making and
    patient management.


