- pgno: 13
  md: 'size (odds ratio) is smallest without significance (Supplementary file 2).
    Moreover, their exclusion from the final model used to generate ESGRS did not
    change its predictive ability (Supplementary file 2).


    While the adverse effect profile of ESG is favorable compared to laparoscopic
    gastrectomy and Roux-en-Y bypass, patients with high ESGRS should be considered
    for closer monitoring. [23, 24] The variables from our study that are associated
    increased risk of reintervention have previously been identified as risk factors
    for post-surgical complications. [25, 26, 27, 28, 29] Stratification and education
    of patients using a scoring system before ESG based on these variables can help
    predict and thereby prevent future complications, including reintervention.


    There are certain limitations to this study. While we used pre-op predictors to
    derive the risk scoring system, additional predictors, like hospital-level information,
    were omitted that could have improved the AUC. The AUC between 0.7-0.8 has good
    predictability and internal validity; however, there is a need for external validity
    to optimize its precision in making clinical judgments. Since the study is limited
    to patients from North America, it may have limited generalizability for the world.
    It is unclear which procedures were conducted by a gastroenterologist and which
    were performed by a surgeon to determine if this could contribute to the probability
    of requiring further intervention.


    Certain variables may be significantly associated with reintervention but may
    lack predictive power and hence be excluded after LASSO regression. Moreover,
    a database does not have information on centers or volume of cases performed in
    a center and therefore the factor pertaining to the ‘volume’ of ESG procedures
    a center performs’ is not feasible to be considered in the present study. MBSAQIP
    center designation as an indirect proxy based on the overall volume of bariatric
    cases. Despite the limitations above, we utilized a vigorous 10-fold cross-validation
    for internal validation, which delivers a lower bias of estimates than split-sample
    validation, resulting in more predictions. [14] Despite being a retrospective
    database, the longitudinal structure of the data confirmed temporality.'
