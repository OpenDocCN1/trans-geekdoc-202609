- pgno: 9
  md: '# Statistical analysis:


    We utilized the "pmsample" command in STATA to compute the minimum sample size
    to develop a new multivariable prediction model with a binary outcome; the expected
    C-statistic was 0.95, and the number of potential inclusions in the new prediction
    model was 26. The minimum sample size required for the ESGRS was 2032. The least
    absolute shrinkage and selection operator (LASSO) penalized regression was utilized
    to determine the adequate predictors of 30-day reintervention. LASSO selects a
    subset of predictors by shrinking the coefficients of the minor contributive variables
    to zero, thereby excluding them from the model. The tuning parameter lambda, which
    determines the coefficient shrinkage, was selected by cross-validation. [14] Independent
    odds ratios (ORs) of LASSO-selected variables were assessed, and the predictors
    identified by LASSO regression analysis were entered into multivariable logistic
    regression models. We utilized backward stepwise selection to select variables
    with a P-value below 0.05, for the final multivariable logistic regression model.
    Any variables with P-values <0.05 were excluded from the final risk score model,
    as done previously. [15] A 10-fold cross-validation generated a pragmatic estimation
    of the model''s predictive performance (area under the curve (AUC)) in new cases
    since it prevents excessively optimistic estimates of predictive performance in
    overlooked cases. [14] The AUC''s value indicated the model''s ability to predict
    30-day reintervention. An AUC of 0.5 to 0.6 indicates unsatisfactory discrimination,0.6-0.7
    indicates satisfactory, 0.7 to 0.8 is good, 0.8 to 0.9 is very good, and more
    than 0.9 is excellent. [16] We also generated Bias-corrected bootstrapped (BC)
    95% confidence intervals for the AUC.


    The model-predicted and actual 30-day reintervention agreement was evaluated via
    calibration belt plots. This allows a visual inspection of any difference of observed
    frequencies significantly to expected probabilities and the direction of miscalibration.
    [17] A calibration test indicating if any deviations from the bisector [45° line
    of perfect fit] were significant was also included in the calibration belt plot.
    [18, 19] The Brier score, a variance measurement between the predicted and the
    observed outcome, was used to'
  merge: -1
  img_proc: true
