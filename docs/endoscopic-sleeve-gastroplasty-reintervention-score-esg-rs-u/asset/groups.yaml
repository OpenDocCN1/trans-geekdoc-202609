    # 基于监督机器学习的内镜胃管形成术再干预评分 (ESG-RS)


    ## 摘要


    ### 背景与目的


    内镜胃管形成术 (ESG) 后的再干预。我们开发并内部验证了一个评分 (ESG-RS)，用于预测 30 天内的个体再干预风险。


    ### 方法


    我们使用了来自减重手术质量改进计划 (MBSAQIP) 数据库（2016-2021）的 3,583 名接受 ESG 患者的数据。利用最小收缩和选择算 (LASSO)
    回归选择预测因子。将 LASSO 提取的变量纳入多因素分析以生成 ESG-RS。


    ### 结果


    LASSO 选择了 11 个变量。影响再干预风险的五个关键因素是：前胃手术史、术前 AC 使用、女性、ASA 评分 >= 2 以及高血压。模型性能显示为 0.74
    (95% CI: 0.70, 0.78)。ESG-RS 的最佳截断点为 67.9（高风险 vs. 低风险），灵敏度为 0.76，特异性为 0.71。


    ### 结论


    ESG-RS 有助于临床医生进行术前风险分层，并帮助识别再干预风险较高的患者，从而实现更好的决策和患者管理。


    **关键词：** 胃形成术；质量改进；再干预；风险评估；机器学习；测试预测价值


    # 引言


    内镜胃管形成术 (ESG) 是一种微创手术，用于对饮食和生活方式改变无反应的患者减肥。它由 Dayyeh 等于 2013 年首次引入。以来，ESG 经历了快速增长，由于其更短的手术时间和相当的事件发生率，相比传统的减重手术（如腹镜胃管切除术）具有某些优势。ESG
    涉及使用全层内镜缝合装置缩小胃容量。在 12 个月后，ESG 导致总体重减轻和超重减轻分别为 16% 和 60%。之前的比较显示，SG 后的并发症风险相当，且在减轻方面具有非劣势性。最近关于
    ESG 和 LSG 的数据显示，两者相当，但 30 天内入院和再干预的比例更高。由于 ESG 是项新技术，医疗人员可能因为不熟悉过程而降低干预阈值，导致再干预率高于
    SG。虽然 SG 再干预相关的因素此前已探讨，但 ESG 再干预相关的因素尚未被研究。'
