    大小（优势值比）在无显著性时最小（补充文件 2）。此外，将它们排除在生成 ESGRS 的最终模型之外并未改变其预测能力（补充文件 2）。


    虽然与镜下胃切除术和 Roux-en-Y 胃绕道术相比，ESG 的副作用特征较良好，但对于高 ESGRS 分数的患者，应考虑进行更密切的监测。[23, 24]
    我们研究中与再次干预风险增加相关的变量，此前已被确定为术后并发症的风险因素。[25, 26, 27, 28, 29] 基于这些变量，使用评分系统在 ESG
    之前对患者进行分层和教育，有助于预测并从而防止未来的并发症，包括再次干预。


    本研究存在某些局限性。虽然我们使用了术前预测因子来推导风险评分系统，但遗了一些额外的预测因子，例如医院级信息，这些因素本提高 AUC。0.7-0.8 之间的
    AUC 具有良好的预测能力和内部效度；然而，需要外部效度来优化其在临床判断中的精确度。由于研究局限于北美患者，其对全球的普适性可能有限。目前不清楚哪些手术是由胃肠科医生执行，哪些是由外科医生执行，以确定这是否会增加需要进一步干预的概率。某些变量可能与再次干预显著相关，但可能预测能力，因此在
    LASSO 回归后被排除。此外，数据库没有 MBSQIP 中心认证的信息，因此与“ESG 执行量”相关的因素在目前的研究中无法予以考虑。尽管存在上述局限性，我们使用了有力的
    10 折交叉验证进行内部验证，这比分样本验证提供了更低的估计偏差，产生了更多的预测。尽管这是一项回顾性研究，但数据的纵向结构证实，在减重手术病例的总量上，ESGRS
    分数可以提高对患者 30 天内再次干预风险的认知；未来需要纵向研究来观察前瞻性地处理已识别因素是否能减轻 30 天内内镜再次干预的需求。


