    ## 材料与方法：


    本研究利用代谢和减胖手术认证质量改进计划（MBSAQIP）数据库，这是全球最大的减胖手术特定数据库，时间范围为 2016 年 1 月至 2021 年 12
    月。[10] 所有经过认证的减胖中心都报告了在其中心进行的减胖手术数据。MBSAQIP 数据库包含了术前、术中和术后变量，包括合并症和30 天后结局。由于隐私考虑，MBSAQIP
    数据库不报告医院位置、患者标识符或医生数据。仅包含完整病例。MBSAQIP 注册中心定期进行审计，并排除30 天随访率低于 80% 的中心。[11] 研究人群


    本研究利用 2016-2021 年 MBSAQIP 数据库识别接受了内镜下胃固定术（ESG）的患者。干预定义为 ESG 手术后 30 天内完成内镜、手术或放射干预。[12]
    如果年龄小于 18 岁、体重过轻（BMI < 30）、数据不完整、编码错误或正在接受修复或转换手术，则排除病例。[13] 根据先验知识和近期文献中的预测因子对数据库中的潜在临床变量进行评估。使用相关矩阵评估所有解释变量的共线性（补充文件
    1）。相关系数 > 0.7 的变量被排除。候选因素包括人口统计学特征（如年龄、体重指数、性别）、临床变量、实验室数据（如白蛋白、血细胞比容）以及合并症数据（如血栓形成史、心肌梗死等）。所有
    26 个候选变量见表 1。


    统计学分析：


    我们利用 STATA 中的 "pmsample" 命令计算最小样本量，以开发一个具有二分类结局的新多变量预测模型；预期 C 统计量为 0.95，新预测模型中的潜在入选变量为
    26 个。ESGRS 需要的最小样本量为 203。利用最小绝对收缩和选择算（LASSO）回归来确定30 天再次干预的充分预测因子。LASSO 通过将微贡献变量的系数压缩为零来选择预测因子子，从而将其从模型中排除。通过交叉验证选择决定系数收缩的调优参数
    lambda。[14] 评估 LASSO 选择变量的独立优势比（OR），并将 LASSO 回归识别出的预测因子进入多变量逻辑回归模型。我们利用后向逐步法选择
    P 值低于 0.05 的变量用于最终的多变量逻辑回归模型。如前所述，任何 P 值 < 0.05 的变量均从最终风险评分模型中排除。[15] 十折交叉验证生成了新病例预测性能
    (曲线下面积 (AUC)) 的务实估计，因为它防止了忽略病例中预测性能的过度估计。[14] AUC 值表示模型预测 30 天再次干预的能力。AUC 为 0.5
    到 0.6 表示区分能力不佳，0.6-0.7 表示满意，0.7 到 0.8 为良好，0.8 到 0.9 为优秀，超过 0.9 为极佳。[16] 我们还为 AUC
    生成了偏偏修正自助法（BC）95% 置信区间。


    通过校准线图评估模型预测与实际 30 天再次干预的一致性。这允许直观检查观察频率与预期概率之间的任何显著差异以及校准偏差。[17] 校准线图中还包含指示偏离分界线
    [45° 完美拟合线] 是否显著的校准测试。[18, 19] Brier 分作为预测与观察结果之间的方差测量，用于评估整体性能。[16] 其值范围从 0（不一致）到
    1（完全不一致），越低越好。


    ## 结果


    本分析共纳入 3583 名患者。人口统计学和临床特征见表 1。ESG 病例的 30 天内镜再次干预率为 3.3%，在 26 个预测因子中，通过 LASSO
    回归留下了用于预测 30 天再次干预的因子，平均 lambda 为 0.003，其中 LASSO 选择了十一个变量，包括前道手术史、术前抗凝（AC）使用、女性性别、长期类固醇使用、经皮冠动脉干预史、ASA
    评分 >=2、高血压、术前 GERD 诊断、深静脉血栓史、术前白蛋白和血细胞比容（表 2）。


    经过多变量逻辑回归后，五个变量具有统计学意义，包括前道手术史（OR 4.98, 95% CI 3.08–8.06, P < 0.001）、术前 AC 使用（OR
    2.22, 95% CI 1.10–4.51, P = 0.011）、女性性别（OR 1.48, 95% CI 1.05–2.01, P = 0.012）、长期类固醇使用（OR
    1.85, 95% CI 1.02–3.35, P = 0.025）、经皮冠动脉干预史（OR 2.12, 95% CI 1.15–3.90, P = 0.005）、ASA
    评分 >=2（OR 2.45, 95% CI 1.45–4.12, P = 0.001）、高血压（OR 1.68, 95% CI 1.12–2.51, P
    = 0.002）、术前 GERD 诊断（OR 1.32, 95% CI 0.85–2.01, P = 0.125）、深静脉血栓史（OR 1.55, 95%
    CI 0.98–2.45, P = 0.045）、术前白蛋白（OR 1.42, 95% CI 0.95–2.12, P = 0.065）和血细胞比容（OR
    1.28, 95% CI 0.82–1.98, P = 0.110）。


    ## 讨论


    ESGRS 是使用监督学习选择的变量生成的，显示没有校准偏差且性能良好 (AUC >0.7)。我们的结果表明，通过五个术前预测因子可以预测30 天再次干预的个体化风险：前道手术史、术前
    AC 使用、女性性别、ASA 评分 >=2 和高血压。我们提供了一种有助于的方法来确定 ESG 后再次干预的个体化风险，据我们所知，这是首项此类研究。

