    # Endoscopic sleeve gastroplasty-reintervention score (ESG-RS) using supervised
    machine learning


    ## Abstract


    ### Background and Aims


    Reintervention following Endoscopic sleeve gastroplasty (ESG). We developed and
    internally validated a score (ESG-RS) that determines the individualized preoperative
    risk of reintervention within 30 days.


    ### Methods


    We used data from a sample of 3,583 patients who underwent ESG in the Bariatric
    Surgery Quality Improvement Program (MBSAQIP) database (2016-2021). Least Shrinkage
    and Selection Operator (LASSO) penalized regression was utilized to select the
    best predictors. The variables extracted by LASSO regression were entered into
    multivariate analysis to generate ESG-RS.


    ### Results


    Eleven variables were selected by LASSO regression. Five key factors influencing
    reintervention risk were: history of foregut surgery, preoperative AC use, female
    gender, ASA score >= 2, and hypertension. The model performance showed an AUC
    of 0.74 (95% CI: 0.70, 0.78). The optimal cut point for ESG-RS was 67.9 (high
    risk vs. low risk), with a sensitivity of 0.76 and specificity of 0.71.


    ### Conclusion


    The ESG-RS aids clinicians in preoperative risk stratification and helps identify
    patients at a higher risk of reintervention, enabling better decision-making and
    patient management.


    **Keywords:** Gastroplasty; Quality Improvement; reintervention; Risk Assessment;
    Machine Learning; Predictive Value of Tests


    # Introduction


    Endoscopic sleeve gastroplasty (ESG) is a minimally invasive procedure to produce
    weight loss in patients who have been unresponsive to dietary and lifestyle modifications.
    It was first introduced by Dayyeh et al. in 2013. Since then, ESG has witnessed
    rapid growth and has some advantages over traditional bariat surgery, i.e., laparoscopic
    sleeve gastrectomy, by the ability to achieve similar outcomes with shorter procedure
    time and comparable adverse event rate. ESG involves reducing the size of the
    gastric reservoir using a full thickness endoscopic suturing device. At 12 months,
    ESG resulted in total body weight loss and excess body weight loss of 16% and
    60%, respectively. Previous comparisons demonstrated equivalent morbidity risk
    and non-inferiority in weight loss after SG. Recent data on ESG and LSG showed
    they were comparable but had a greater incidence of 30-day readmissions and reinterventions.
    Because ESG is a contemporary procedure, providers may have a lower threshold
    for reintervention due to unfamiliarity with the procedural course resulting in
    higher reintervention rates than SG. While factors associated with reintervention
    following SG have been explored previously, factors associated with reintervention
    following ESG have not been investigated.

