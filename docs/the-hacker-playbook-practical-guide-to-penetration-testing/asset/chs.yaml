  ![](img/00170.jpeg)\n\n**图 104 - 社会工程学工具包**\n\n### 凭据收割器\n\n\n\nSET 加载完成后，我通常采用两种常见方法。第一种是凭证收集器。这是创建一个看起来像认证页面的虚假页面，诱使用户输入其凭证。SET\
  \ 中有许多不同的方法，我建议你花时间研究一下，但我通常是在寻找账户信息。\n\n要生成一个虚假页面，请按以下步骤操作：\n\n1.  (社会工程学攻击)\n\
  2.  (网站攻击向量)\n3.  (凭证收集器)\n4.  (站点克隆器)\n5.  选择 IP 或主机以接收 POST 回传数据\n6.  选择要克隆的站点（示例：`https://accounts.google.com/ServiceLogin`）\n\
  \n如果受害者访问该 IP 或 URL，他们将看到类似以下内容：\n\n![](img/00171.jpeg)\n\n图 105 - 伪造的 Google 认证页面与\
