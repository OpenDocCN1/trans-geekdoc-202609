  3.  Java Applet 攻击方法\n4.  Web 模板\n5.  输入 NAT 信息和主机 IP\n6.  选择你的模板\n7.  Windows Reverse_TCP\
  \ Meterpreter\n8.  后门可执行文件 -> 保留默认端口\n\n如果一切配置正确，你应该会看到类似下图的内容：\n\n![](img/00172.jpeg)\n\
  \n图 106 - 成功的反向 Shell\n\n现在，如果受害者访问你创建的 URL，他们将看到一个 JAVA 验证屏幕。此 URL 通常通过电子邮件或同形异义域名发送。\n\
