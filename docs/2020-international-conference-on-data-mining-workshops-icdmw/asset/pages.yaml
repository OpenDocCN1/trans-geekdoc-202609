    # IV. EXPERIMENT RESULTS


    Many experiments were conducted to evaluate the effectiveness of the proposed
    model. The purpose of these experiments is to evaluate our model and compare it
    with other-of-the-art models. The performance of the model is measured by F measure.
    In addition, we pair-test to verify the significance.


    # A. Datasets


