    # II. RELATED WORK


    # A. Opinion Mining


    Opinion mining (also as sentiment analysis) refers to the use of natural language
    processing and text analysis to systematically identify, extract, quantify, and
    analyze subjective features and subjective opinions. Opinion is widely used to
    collect customer reviews and social media. Opinion mining contains the goal (entity)
    of opinion, the attributes of the goal that is aimed at, and the sentiment (polarity)
    of positive or neutral opinion [11], [12].


