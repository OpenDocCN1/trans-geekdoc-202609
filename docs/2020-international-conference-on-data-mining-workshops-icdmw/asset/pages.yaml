    decision framework to identify the boundary firstly. Then we classify reviews
    into three regions in the first stage: positive, negative, and uncertain. Then
    we split the uncertain boundary into positive and negative regions. This three-way
    decision framework provides an elegant way to integrate fuzzy logic and deep learning
