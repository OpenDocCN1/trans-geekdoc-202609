    # C. Discovery Knowledge


    Discovered knowledge can be presented in different forms, such as terms, patterns,
    phrases, concepts, rules, or ontologies. Some of them are combined with others
    to increase the accuracy.


    For knowledge discovery based methods are used with high method [13]. Pattern
    mining can discovering sequences that frequently co-occur in a customer review,
    and what set of terms can represent the discovered knowledge effectively. Frequent
    and closed patterns are frequently employed and reused in a dataset [13]. Selecting
    relevant reviews is vital efficiency of generating the features without losing
    any item [15]. In order to enhance the efficiency of pattern identification several
    techniques: frequent pattern mining [16], closed pattern mining [17], top closed
    pattern mining [18]. Closed patterns were used for handling number of frequent
    patterns. A closed pattern is also a frequent pattern but it is not the exactly
    same content. Therefore, the computational time of finding closed patterns may
    be reduced and can also reduce the number of frequent patterns.


    Fuzzy Logic can be used to extract knowledge from text data where uncertainties
    are used to be with. Fuzzy Formal Concept Analysis (FFCA) [7] is a way to combine
    fuzzy logic and Formal Concept Analysis (FCA) to represent the uncertainties in
    data. A technique based on lattice theory [20]. Formal concept is used to define
    the relationships between objects and attributes in a domain.


