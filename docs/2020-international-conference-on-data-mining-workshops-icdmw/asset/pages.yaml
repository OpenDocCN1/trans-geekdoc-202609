    In this paper, we also developed a method to classify the uncertainty boundary
    (B) as the data is not linearly separable. In this paper, we assume that it is
    possible to map the data to a higher-dimensional space resulting in a linearly
    separable set. There are many methods to do this. For instance, we use a transformation
    function $\phi(x_1, x_2, ..., x_n) = (x_1^2, x_2^2, ..., x_n^2)$, which is likely
    to fixit the dependency between features. In this paper we use word embedding
    to describe the feature. It can find a high dimensional space. We use word embedding
    models which map each vocabulary to a vector of real numbers. In this work we
    use word2vec model [52] in which each word was encoded by 88 dimension, that is,


    ```

    $\phi(x_1, x_2, ..., x_n) = (x_1^2, x_2^2, ..., x_n^2)$

    ```


    for all $w \in \Omega$, $x$ are real numbers.

    To solve the issue, in this paper, we integrate word embedding and the terms that
    we selected (with fuzzy values) from the forments of the items content; and then
    use a CNN classifier to classify the uncertainty boundary.

    CNN consists of input layer, two convolution layers, max-pooling layers, and a
    fully connected layer with softmax as the activation function, which is a typical
    CNN architecture compared to standard CNN architecture [31]. This architecture
    has achieved high accuracy through CNN


    architecture of Kim. The outputs of new word embedding are fed to the CNN for
    the input layer. The first convolution layer consists of 100 features with filter
    size 4. The second convolution layer has 50 features with filter size 7. The stride
    in each convolution layer is 1 as we are using lag. A max-pooling layer followed
    each convolution layer. The pool size used in the max-pooling layers was 3. We
    used regularization with dropout constraint on the weights, with 50 epochs. The
    output of each convolution layer was computed using a non-linear function; in
    our case we used the hyperbolic function.


