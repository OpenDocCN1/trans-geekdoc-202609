    ## C. Results


    In order to evaluate the effects of the proposed model, we compare results with
    existing classification methods in Table V and VI. It indicates that the proposed
    model has the best performance in the two datasets compared with: FFCM [55], CNN
    [31], SVM [54], SCN [61] and Attention Network [56]. In Table VI we have not included
    CNN [31] and SCN [61] because these models were not evaluated with ebook reviewer
    dataset. The results in Table VI and Table VII show that the proposed model is
    better than the baseline models. It has shown from Table VII model is more significant
    than CNN and Attention Network which is greater > 0.5.


    It can significantly improve the performance of binary classification in terms
    of F-measure. The results indicate that the proposed three-way framework performs
    binary classification of user reviews with high accuracy.


    The contributions made by the proposed framework are as follows:


    - An innovative statistical feature selection method (combination of three feature
    selection methods bmx2, ICF and Uni) is proposed to retrieve fuzzy concepts.

    - An effective classifier is introduced using fuzzy concepts to classify into
    three regions: positive, negative, and neutral.


    One future direction is to explore the effects of semantic text data on the same
    architecture. Semantic structure might help exploit the additional representation
    of fuzzy concepts and investigate the impact of semantic patterns in fuzzy concepts
    in opinion mining.


