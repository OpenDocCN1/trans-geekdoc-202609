    # 2020年数据挖掘国际会议工作坊 (ICDMW)


    ## 三分类中模糊逻辑与深度学习的集成


    D.L.C.S. Subhashmi¹,,2,3,4, Yuefeng Li¹,,5, Jinglan Zhang¹6, Ajantha S. Atukorale²,,7

    ¹澳大利亚科技大学

