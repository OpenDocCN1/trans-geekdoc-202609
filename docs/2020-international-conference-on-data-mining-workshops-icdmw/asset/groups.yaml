    by adjusting their values (e.g., frequency to one).

    After many experimental results, we found that there is a critical problem for
    fuzzy logic to make binary decisions when the fuzzy similarity values of two categories
    are very close. To solve this research issue, in this paper we propose a three-way
    decision framework to identify the boundary firstly. Then we classify reviews
    into three regions in the first stage: positive, negative, and uncertain. Then
    we split the uncertain boundary into positive and negative regions. This three-way
    decision framework provides an elegant way to integrate fuzzy logic and deep learning
    in a single umbrella. Many approaches that come with deep learning use feature
    selection [9], [10]. To find more specific features, we use three feature selection.
    For deep learning, we use textual features (e.g., using word2vec, word embedding,
    to generate a vector of words). This process requires a large collection of documents
    about the given topic; normally the large collection is not designed specifically
    for this opinion classification task. Therefore, the input to a deep learning
    algorithm describes more general knowledge for the opinion classification. Also,
    deep learning cannot deal with uncertainties in features; therefore, it is very
    hard to produce satisfactory results for this three-way decision framework. Moreover,
    we also propose a new feature selection method, and then fuzzy formulas (higher-level
    concepts). The selected concepts are from the discovered patterns. The selected
    concepts are also used for the three-way decision framework to classify reviews
    into three regions in the first stage. After that, in the second stage, we integrate
    word embedding vectors with the selected concepts and identify the difference
    between vectors and their mean value.


    classification with a new feature selection model and a three-way decision framework.
    It presents a two-stage feature selection model to integrate an uncertainty processing
    model (e.g., fuzzy composition) and deep learning using a three-way decision framework.
    This research contributes new feature selection model and a three-way decision
    framework for opinion classification. To conduct a comprehensive evaluation of
    the proposed framework, we select state-of-the-art methods for performance comparison.
    We evaluated on the two datasets and the proposed model achieved improved performance
    on F-measure (the F-measure value 94.67 and 97.44% in review and ebook review
    datasets),


