    ## C. 结果


    为了评估所提模型的效果，我们在表 V 和 VI 中将其与现有分类方法进行了比较。结果表明，与 FFCM [55]、CNN [31]、SVM [54]、SCN
    [61] 以及注意力网络 [56] 相比，表 VI 中我们未包含 CNN [31] 和 SCN [61]，因为这些模型未在电子书数据集上评估。表 VI 和表
    VII 的结果显示所提模型优于基准模型，且大于 0.5。


    它在 F 值方面显著提升了二分类的性能。结果表明所提的三路框架实现了高准确率的二分类。


    所提框架的贡献如下：


    - 提出了一种创新的特征选择方法（bmx2, ICF 和 Uni 方法），用于检索模糊概念。

    - 引入了一种有效的分类器，使用模糊概念将其分为三个区域：正面、负面和中性。


    未来的一个方向是探索语义数据对相同架构的影响。语义结构可能有助于模糊概念的额外表示，并调查模糊概念中语义模式的影响。


