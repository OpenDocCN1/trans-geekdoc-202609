    **Abstract—**The problem of uncertainty is a challenging issue to solve in opinion
    mining. Existing models using machine learning algorithms are unable to identify
    uncertainty within online customer reviews of bound boundary uncertainties. Many
    researchers have developed fuzzy models to solve this problem. However, the degree
    of uncertainty remains uncertain. There is a big uncertainty between positive
    and negative opinions. Frequently used words may be non-relevant. This paper proposes
    a three-based framework that integrates fuzzy concepts and deep learning. Many
    experiments were conducted using movie review and customer datasets. Experimental
    results show that the proposed method is effective for identifying opinions and
    can show high F-measure for two benchmark dataset.


    **Index Terms—**Opinion Mining, Fuzzy Logic, Three-way Decisions, Classification,
    Deep Learning


    # # I. INTRODUCTION


    The decision-making process for analyzing customer reviews using machine learning
    algorithms has become a challenge [1]. Today, large numbers of opinions and reviews
    are available on the Internet. However, online customers find it to make decisions
    based on reliable or unreliable customer reviews before they make decisions. The
    quality of online reviews varies. At the same time, organizations generate useful
    information from customer reviews using text mining techniques. This concept is
    known as sentiment analysis or opinion mining [2]. Many models have been proposed
    in recent years for opinion mining [3], [4]. However, because of uncertainty and
    lack of consensus within the wide range of reviews used today, these models may
    create unexpected results in some cases [5]. Therefore, the ability to handle
    uncertainty is important in opinion classification models.


    The concept of uncertainty refers to unclear and uncertain opinions. The ability
    to handle uncertainty is important in opinion classification models [5]. When
    it comes to opinion classification models, the mechanism for managing these uncertainties
    is a challenging task [6] as a result of user behavior. Uncertain opinions create
    a challenge to be automatically dealt with these techniques to enhance the performance
    of machine learning algorithms. For example, a customer''s resolution for a camera
    “the sound quality does not fix”. These frequent features may be positive or negative
    opinions. However, machine learning algorithms do not know how to use them properly;
    it is very difficult to decide the relevant category. In this case, it is hard
    to decide the category with the uncertainty. For instance, if the review is “ok”
    or “fine” then the review is “not far” than “fine”. Also, uncertainties are a
    hard issue in opinion mining since many frequently words are used to be non-relevant.
    Therefore, when we use patterns or link certain features to show a possible solution
    for uncertain opinions, with other methods may be used and define a specific method
    may be used to make a right decision.


    Fuzzy logic is used to solve the problem of uncertainties in opinion mining [5],
    [7], [8]. It represents uncertainties of fuzzy using fuzzy values between zero
    and one. Fig. 2 shows the process of how to reduce the impact of noisy features
    by using fuzzy logic. In the figures, opinion “fine” and “ok” were frequently
    used as positive and negative categories. These are noisy features. They also
    have large weights, which are not useful for understanding the difference between
    the positive and negative categories. By using fuzzy composition, we can use the
    large range of noisy features to “I” if they are greater than 1”. The advantage
    of fuzzy composition is to reduce impact of noisy features, e.g. OK and fine in
    Fig. 1 and Fig. 2. Fuzzy composition can reduce their impacts


