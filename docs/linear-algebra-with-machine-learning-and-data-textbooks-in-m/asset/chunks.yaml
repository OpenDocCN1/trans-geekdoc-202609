    \ \\\\end{array} \\right)\\left( \\begin{array}{l} a_{0} \\\\ a_{1} \\\\ \\vdots\
    \ \\\\ a_{n} \\\\ \\\\end{array} \\right) = \\\\left( \\begin{array}{l} {f(x_{0})}\
    \ \\\\\\\\ {f(x_{1})} \\\\\\\\ \\vdots \\\\\\\\ {f(x_{n})} \\\\\\\\ \\\\end{array}\
    \ \\right)} \\\\ \\\\\\end{array}$$\n\n为了使该系统有唯一解，**范德蒙德行列式**\n\n"
