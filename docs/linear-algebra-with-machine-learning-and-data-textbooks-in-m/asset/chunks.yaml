    \ were used to create a model within each subset of the domain; however, you might\
    \ note that a linear function or other function fits the data better. In this\
    \ case, shown in [Example 6.11](#chapter6.xhtml#exam6_11), subsets of the domain\
    \ can still be determined in order to develop a decision tree; however, within\
    \ these subdomains other regression techniques, such as those presented in [Chapters\
    \ 4](#chapter4.xhtml) and [5](#chapter5.xhtml), may be employed.\n\n![Figure 6.18\
    \ An Example of a Regression Tree Model for Poverty Rates in the U.S. (2001–2020)\
    \ \\[32\\].](images/fig6_18.jpg)\n\n[Figure 6.18](#chapter6.xhtml#b6fig6_18) An\
    \ Example of a Regression Tree Model for Poverty Rates in the U.S. (2001–2020)\
    \ \\[[32](#refbib.xhtml#refbib32)\\].\n\n## 6.3 Random Decision Trees and Forests\n\
    \nData scientists tend to be less interested in a single experiment that generates\
    \ data and more interested in a model for a family of experiments of data. These\
    \ families are called **ensembles**. In this section, we will take a look at ensembles\
    \ of decision trees.\n\nA **random forest** is a classification algorithm consisting\
    \ of several decision trees. In data analytics, a random forest consists of choosing\
    \ random samples of data, training sets, from a larger data set, in order to create\
    \ a decision tree, each tree produces an outcome, and a final outcome is determined\
    \ based on majority voting. This technique is a type of **bagging** technique.\n\
    \nSo for example let's say that you choose four random training sets, with replacement,\
    \ and create a decision tree to classify the data into one of four class as seen\
    \ in [Figure 6.19](#chapter6.xhtml#fig6_19). Given data, not within the training\
    \ set, these decision trees can be used to place the data into classes, where\
    \ the final classification can be made based on a majority rules decision. An\
    \ additional example of random forest implementation can be see in the Case Study\
    \ in [Section 6.5](#chapter6.xhtml#sec6_5).\n\n![Figure 6.19 Example Random Forest.](images/fig6_19.jpg)\n\
    \n[Figure 6.19](#chapter6.xhtml#b6fig6_19) Example Random Forest.\n\n## 6.4 CASE\
    \ STUDY: Entropy of Wordle\n\nThe goal of Wordle is to come up with a secret five\
    \ letter word within six guesses. Whether your game of the day is Wordle, Quordle,\
    \ or even Octordle, you may have a go to word or set of words as part of a personal\
    \ strategy to find the word or words of the day. You might think to use many vowels\
    \ and start your game off with the initial guess “adieu”, or introduce common\
    \ letters and try an initial guess like “snort”, or finally you might be a risk\
    \ taker and go for a word that has uncommon letters that you would like to eliminate\
    \ like “zesty”.\n\nAlthough the actual Wordle game uses colored green, yellow,\
    \ and gray squares to represent particular qualities to the guess, the following\
    \ colored squares will be used in this analysis\n\n![](images/pg229_1.jpg)\n\n\
    There are roughly 13,000 five letter words that are acceptable in the Wordle game\
    \ and about 15900 five-letter words found in the word bank at GitHub link 41.\n\
    \nSo how can we use entropy to choose our words wisely? A player that chooses\
    \ a word like **ZESTY** for the first guess and gets the Z correct and in the\
    \ correct location reduces the word choice list to 1200. According to the Scrabble\
    \ dictionary, roughly 9% of five-letter words start with the letter Z.\n\nThus\
    \ if we chose to make a decision purely based on whether the first letter is a\
    \ Z, the information gained by playing *ZESTY* with this outcome is\n\n$$\\\\\
    begin{array}{r} {IG = 1 - .09 \\\\cdot log\\_{2}(.09) - .91 \\\\cdot log\\_{2}(.91)\
    \ \\\\approx 1.44.} \\\\\\\\ \\\\end{array}$$  \n\nHowever, if one wishes to make\
    \ a decision based on whether the Y was correct, it is important to note that\
    \ there are 1254 five-letter words ending with Y. A decision made based on a correctly\
    \ placed Y at the end of the word provides an\n\n$$\\\\begin{array}{r} {IG = 1\
    \ - \\\\left( \\\\frac{1254}{13000} \\\\right) \\\\cdot log\\_{2}\\\\left( \\\\\
    frac{1254}{13000} \\\\right) - \\\\left( \\\\frac{11746}{13000} \\\\right) \\\\\
    cdot log\\_{2}\\\\left( \\\\frac{11746}{13000} \\\\right) \\\\approx 1.19.} \\\
    \\\\\\ \\\\end{array}$$  \n\nNotice that the larger the probability of an event\
    \ occurring, the smaller the information gain if the event occurs. In order to\
    \ pick the best guess, it is helpful to choose the word with the smallest entropy\
    \ and thus largest information gained. In this case study, we show a simplified\
    \ version of what one might do.\n\nFrom a beginning guess word, such as *ZESTY*,\
    \ one might wish to find the probability of each outcome occurring. [Figure 6.20](#chapter6.xhtml#fig6_20)\
    \ shows the probability of a word ending with a certain letter. Notice that a\
    \ five-letter word with the S occurring in the last spot is most likely and thus\
    \ would produce the least information gained, while one ending in B or Z would\
    \ provide a large information gain.\n\n![Figure 6.20 Probability of a five-letter\
    \ word ending in a certain letter.](images/fig6_20.jpg)\n\n[Figure 6.20](#chapter6.xhtml#b6fig6_20)\
    \ Probability of a five-letter word ending in a certain letter.\n\nIf you did\
    \ not want to focus on just one letter of your guess when making decisions, you\
    \ could look at the probability of outcomes occurring, such as in [Figure 6.21](#chapter6.xhtml#fig6_21).\
    \ The overall distribution of outcomes for the guesses *ZESTY* and *TARES* can\
    \ be seen in [Figure 6.22](#chapter6.xhtml#fig6_22).\n\n![Figure 6.21 Probability\
    \ of specific outcomes occurring with a guess of ZESTY.](images/fig6_21.jpg)\n\
    \n[Figure 6.21](#chapter6.xhtml#b6fig6_21) Probability of specific outcomes occurring\
    \ with a guess of *ZESTY*.\n\n![Figure 6.22 Probability Distribution for Outcomes\
    \ Given the Guess ZESTY (TOP) and TARES (BOTTOM).](images/fig6_22.jpg)\n\n[Figure\
    \ 6.22](#chapter6.xhtml#b6fig6_22) Probability Distribution for Outcomes Given\
    \ the Guess *ZESTY* (TOP) and *TARES* (BOTTOM).\n\nNotice that the probability\
    \ distribution for the guess *ZESTY* is taller and thinner than that for the guess\
    \ *TARES*. The probability of an event occurring and the entropy associated with\
    \ the event are inversely proportional. Thus the closer the distribution is to\
    \ uniform, flat, the more information is provided by the guess.\n\nWe use the\
    \ heights of the bars in the simplified probability distribution shown in [Figure\
    \ 6.22](#chapter6.xhtml#fig6_22) as the probabilities for the entropy of the guess.\
    \ Using the simplified distribution from Python code found at GitHub link 42,\
    \ the entropy, or the expected information value, for the guesses *ZESTY* and\
    \ *TARES* are approximately 2.6 and 3.24 respectively.\n\nSo if you did start\
    \ your game with a guess of *ZESTY* and got an outcome of\n\n![](images/ufig6_4.jpg)\n\
    \nwhat would your next guess be?\n\nzapas, zapus, zarfs, ziffs, zills, zincs,\
    \ zings, zoism, zooks, zooms, zoons, zoris, zulus, zunis\n\nPython and R code\
    \ for this case study can be found at Github link 37 and 39 respectively.\n\n\
    ## 6.5 CASE STUDY: Bird Call Identification"
