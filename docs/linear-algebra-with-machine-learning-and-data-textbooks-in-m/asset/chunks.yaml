    \nGithub links 44 and 46 provide Python and R syntax for this case study.\n\n\
    ## 7.8 CASE STUDY: Random Matrices in Gene Interaction\n\nIn reality, genes do\
    \ not act in isolation within the body but interact within a common cellular environment.\
    \ This could be a dominant gene interaction, a complementary gene interaction,\
    \ or a supplementary gene interaction. Scientists have known for some time that\
    \ some genetic diseases result from mutations of a single gene. These diseases\
    \ are called **monogenetic diseases**. **Multigenetic diseases** results from\
    \ genetic mutations of more than one gene that interact with one another. This\
    \ process is called **epistatis**. Knowledge about gene-gene interactions can\
    \ give us a better understanding about hereditary diseases [[29](#refbib.xhtml#refbib29)].\n\
    \nThere are many databases related to gene-gene interaction. For this case study,\
    \ we use data from The Cancer Network Galaxy [[5](#refbib.xhtml#refbib5)], which\
    \ focuses on gene-gene interaction related to cancer. The Cancer Network Galaxy\
    \ has 256 data sets with 22,820 genes and their interactions represented. In this\
    \ case study, we focus on one such data set focusing on mRNA expression of 131\
    \ cancer cell lines that can be found at Github link 49; however, a larger model\
    \ incorporating multiple data sets is encouraged for future study.\n\n[Figure\
    \ 7.15](#chapter7.xhtml#fig7_15) shows a graphical depiction of a subgraph of\
    \ interactions between genes in the dataset.\n\n![Figure 7.15 Visualization of\
    \ a small subset of gene-gene interactions in the Cancer Network Galaxy.](images/fig7_15.jpg)\n\
    \n[Figure 7.15](#chapter7.xhtml#b7fig7_15) Visualization of a small subset of\
    \ gene-gene interactions in the Galaxy.\n\nFor this case study, assume that there\
    \ are `n` genetic makers, `G`[`1`]`, `G`[`2`], …, `G`[`n`] measured on `m` subjects.\
    \ In the provided data set there an identified parent gene and child gene. A relationship\
    \ matrix `M` is created such that if parent gene `G`[`i`] is related to child\
    \ gene `G`[`j`] then `M`[`i`,`j`]=1. Otherwise `M`[`i`,`j`]=0. Note that the matrix\
    \ `M` is a sparse matrix with many entries equal to 0. Also notice that the matrix\
    \ `M` may not be symmetric.\n\nWe define the sample correlation matrix\n\n$$\\\
    \\begin{array}{r} {W = \\\\frac{1}{n - 1}MM^{T}.}\\\\ \\\\end{array}$$\n\nIn addition,\
    \ if `λ`[`i`] and `λ`[`j`] are consecutive eigenvalues of `W`, [Figure 7.16](#chapter7.xhtml#fig7_16)\
    \ shows the distribution of the spacing between eigenvalues.\n\n![Figure 7.16\
    \ Distribution of Eigenvalue Spacing for the Gene-Gene Interaction Matrix.](images/fig7_16.jpg)\n\
    \n[Figure 7.16](#chapter7.xhtml#b7fig7_16) Distribution of Eigenvalue Spacing\
    \ for the Gene-Gene Interaction Matrix.\n\nNotice that the distribution seen in\
    \ [Figure 7.16](#chapter7.xhtml#fig7_16) follows a Rayleigh distribution similar\
    \ to that seen with Wigner Surmise. One can also see that the distribution of\
    \ the eigenvalues of the gene-gene interaction covariance matrix follows a more\
    \ symmetric distribution in [Figure 7.17](#chapter7.xhtml#fig7_17). If more data\
    \ from [[5](#refbib.xhtml#refbib5)] were integrated, we would begin to see Wigner's\
    \ Semicircle Law displayed.\n\n![Figure 7.17 Distribution of Eigenvalues of Gene-Gene\
    \ Interaction Matrix.](images/fig7_17.jpg)\n\n[Figure 7.17](#chapter7.xhtml#b7fig7_17)\
    \ Distribution of Eigenvalues of Gene-Gene Interaction Matrix.\n\nIn order to\
    \ further study gene-gene interaction to random matrices, you may consult Github\
    \ links 45 and 47 for Python and R.\n\n## 7.9 Exercises\n\n*   Find the condition\
    \ number of `A = \\begin{pmatrix} -0.1 & -1 \\\\ 0 & 1 \\end{pmatrix}`.\n*   Verify\
    \ that the Bauer-Fike Theorem holds for\n    $$\\begin{array}{l} {A = \\left(\\\
    begin{array}{ll} 4 + i & 0 \\\\ 3 + i & 1 \\end{array}\\right)\\text{~~}E = \\\
    left(\\begin{array}{ll} -0.1 & 0.8 \\\\ -0.01 & 0 \\end{array}\\right).}\\\\ \\\
    \\end{array}$$\n    Recall that $|a + bi| = \\sqrt{a^{2} + b^{2}}`.\n*   (Coding)\
    \ The following commands can be used to visualize the pseudospectrum of a matrix\
    \ `A` using Python.\n\n```python\nimport numpy as np\nimport matplotlib.pyplot\
    \ as plt\nfrom scipy.linalg import svdvals, schur\n```\nGraph the pseudospectrum\
    \ of\n$$\\begin{array}{l} {A = \\left(\\begin{array}{ll} -0.1 & -1 \\\\ 0 & 1\
    \ \\end{array}\\right)}\\\\ \\\\end{array}$$\n*   1. If `H` is a 4 ×��4 GOE find\
    \ the probability distribution of the mean eigenvalues.\n    2. (Coding) Write\
    \ code to generate 10000 4 ×��4 GOE matrices and calculate the mean of the eigenvalues\
    \ of each GOE. Use these values to plot the probability distribution of the mean\
    \ eigenvalues and compare it to your answer in part a.\n*   Determine which of\
    \ the follow matrices are Hermitian.\n    1. $\\begin{pmatrix} 4 - 2i & -8 + 12i\
    \ \\\\ -8 + 12i & 36 - 16i \\end{pmatrix}$\n    2. $\\begin{pmatrix} 1 & 1 + i\
    \ \\\\ 1 - i & 1 \\end{pmatrix}$\n    3. $\\begin{pmatrix} 1 & 2 \\\\ 2 & 3 \\\
    end{pmatrix}$\n*   Let `A = \\begin{pmatrix} \\frac{1 + i}{2} & -\\frac{1 + i}{2}\
    \ \\\\ \\\\ \\frac{1}{\\sqrt{2}} & \\frac{1}{\\sqrt{2}} \\end{pmatrix}`. Determine\
    \ if `A` is a unitary matrix.\n*   (Coding) Using either Python or R, generate\
    \ a population of `N=100` people that have all the same initial value `V=1000`.\
    \ Write a loop, where the time step represents trading periods, and keep track\
    \ of each person's value under the following conditions.\n    1. Random trading\
    \ with one person at each time step, total value between the traders is shared\
    \ equally between the traders.\n    2. Random trading with one person at each\
    \ time step, total value between the traders is shared where the percent split\
    \ is also generated.\n    3. Each person is given a random initial value between\
    \ `V=100` and `V=1000`. Random trading with one person at each step. The person\
    \ of greater value gets 75% of the total value between the traders and the lesser\
    \ get 25%.\n"
