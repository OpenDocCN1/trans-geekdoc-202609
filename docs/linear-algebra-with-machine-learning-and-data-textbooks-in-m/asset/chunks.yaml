    然后，从易感状态到恢复状态的预期时间可以通过公式得出：


    $$\\begin{array}{l} {N = {(I - Q)}^{- 1} = \\left( \\begin{array}{ll} 50 & 0.
    \\\\ 25 & 25 \\ \\end{array} \\right).} \\\\ \\end{array}$$


    因此，我们可以预计一个人处于易感状态 50 天，然后处于感染状态 25 天，最后达到永久康复。


    让我们扩展流行病模型，增加一个额外的状态：易感且社交距离（SS）。我们假设仍然存在不社交距离的易感个体（S）；但是，对于那些采取社交距离的人，传染给其他概率要低得多，而且康复的人会在未来决定采取社交距离。


    使用转移矩阵


    $$\\begin{array}{l} {T = \\left( \\begin{array}{llll} S & {SS} & I & R \\\\ 0.9
    & 0. & 0. & 0 \\\\ 0. & 0.99 & 0 & 0. \\\\ 0.1 & 0.01 & 0.96 & 0. \\\\ 0. & 0.
    & 0.04 & 1 \\\\ \\end{array} \\right)} \\\\ \\end{array}$$


    这种行为可以在图 2.9 中看到。在这个模型中，一个不社交距离的易感者平均会在 10 天内感染，而采取社交距离的易感者预计需要大约 100 天才会感染疾病。


    ![图 2.9 社交距离下 SIR 模型下的疾病增长。](img/fig2_9.jpg)


    图 2.9 社交距离下 SIR 模型下的疾病增长。


    如果我们从出生率（fertility）的角度来看该模型（其中出生率追踪产生新增病例的数量）以及转移（transition），那么人口可以描述为：


    $$\\begin{array}{r} {P = F + T,} \\\\ \\end{array}$$


    其中 `F` 是代表类别之间出生率的矩阵，`T` 代表类别之间的转移。如果 (`I` − `T`)^( − 1) 存在，我们可以确定净繁殖价值 `n`，[7\]


    $$\\begin{array}{r} {n = \\rho({(I - T)}^{- 1}F)} \\\\ \\end{array}$$


    以及指数增长率 `ρ`(`P`)。


    ## 2.4 案例研究：文本分析与自动纠错


    在第 3 章中，我们将探索数据压缩技术以便对文本进行比较分析。在这里我们通过对简·奥斯汀（Jane Austen）的作品进行小型文本分析，探索马尔可夫链应用于文本分析的不同方法。


    简·奥斯汀的文本中有 13,000 多对唯一的词组合，我们仅通过转移矩阵探索了其中几个。


