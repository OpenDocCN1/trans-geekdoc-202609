    $$\\\\begin{array}{r} \\\\left. 1\\\\rightarrow 1,\\\\, 2\\\\rightarrow 3,\\\\\
    , 3\\\\rightarrow 4,\\\\,\\\\text{~}4\\\\rightarrow 2 \\\\right. \\\\ \\\\end{array}$$\n\
    and the ordering of the four numbers is (1,3,4,2).\n\nA **permutation matrix**,\
