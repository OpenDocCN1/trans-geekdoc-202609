- fmt: "\nMany times, species identification techniques require capture and release.\
    \ A less invasive species identification technique is to record the calls of the\
    \ species, in this case birds, and look for similarities. In this case study,\
    \ we are given data from several bird calls, found at Github link 43, in order\
    \ to develop a model for the classification of species of birds. In particular,\
    \ we wish to identify the call of the Sri Lankan Junglefowl, the national bird\
    \ of Sri Lanka, among other bird calls from Sri Lanka. A larger database of bird\
    \ calls can be found at [[[43](#refbib.xhtml#refbib43)]].\n\nIt is important to\
    \ note that, in reality, this type of data could consist of data blocks from very\
    \ different times in the birds calling cycle. Therefore, one bird's call may just\
    \ be a translated version of another's. Additionally, certain birds could be closer\
    \ or calling louder, and thus the scale on the call may not be significant in\
    \ the identification of the species.\n\nWhat might be more important to observe\
    \ is the dominant frequencies present in the call. In this case study, we discuss\
    \ how to transform data into a frequency domain for this type of analysis.\n\n\
    Given a discrete data set `y[1]`, `y[2]`, ..., `y[n]`, the **Discrete Fourier\
    \ Transform** is defined as\n\n$$\\begin{array}{r} {F_{k} = {\\sum\\limits_{j\
    \ = 1}^{n - 1}y_{j}}e^{\\frac{- 2\\pi i}{n}kj}.} \\\\\\\\ \\end{array}$$  \n\n\
    [Figure 6.24](#chapter6.xhtml#fig6_24) shows the frequency distribution for several\
    \ Sri Lankan junglefowl calls. For more information about Fourier analysis see\
    \ [[[28](#refbib.xhtml#refbib28)]].\n\n![Figure 6.23 Visualization of soundwaves\
    \ of two different Sri Lankan Junglefowl.](images/fig6_23.jpg)\n\n[Figure 6.23](#chapter6.xhtml#b6fig6_23)\
    \ Visualization of soundwaves of two different Sri Lankan Junglefowl.\n\n![Figure\
    \ 6.24 Visualization of Frequencies in Sri junglefowl calls from Figure 23.](images/fig6_24.jpg)\n\
    \n[Figure 6.24](#chapter6.xhtml#b6fig6_24) Visualization of Frequencies in Lanka\
    \ junglefowl calls from 23.\n\nFrom this, one might wish to study what the peak\
    \ frequencies are, or the width between peak frequencies, among other characteristics.\
    \ If `p[1]` and `p[2]` are the two frequencies, 1K as the units, occurring the\
    \ most in the call, [Figure 6.25](#chapter6.xhtml#b6fig625) shows `p[1]` versus\
    \ absolute relative increase between `p[1]` and `p[2]`.\n\n![Figure 6.25 Visualization\
    \ of four outcomes from different training sets, jungle fowl denoted by ∘.](images/fig6_25.jpg)\n\
    \n[Figure 6.25](#chapter6.xhtml#b6fig625) Visualization of four outcomes from\
    \ different training sets, jungle fowl denoted by ∘.\n\n$$\\begin{array}{r} {\\\
    left| \\frac{p_{1} - p_{2}}{p_{1}} \\right|.}\\\\ \\end{array}$$  \n\nThe dashed\
    \ lines in [Figure 6.25](#chapter6.xhtml#b6fig625) might be considered as criteria\
    \ for a decision tree. Given this information, a bird call with a peak frequency\
    \ of 20K and an absolute relative increase of 9Hz WOULD identify as Sri Lankanfowl\
    \ while a bird call with a peak frequency of 25K and an absolute relative increase\
    \ of 30Hz WOULD NOT identify as Sri Lankanfowl. Github links 38 and 40 provide\
    \ Python and R code for this case.\n\n## 6.6 Exercises\n\n*   Given the data in\
    \ [Figure 6.26](#chapter6.xhtml#fig626) and root condition, `x > 0`,\n    1. Find\
    \ the entropy and information gained for the root criteria `x > 0`.\n    2. Determine\
    \ a root condition that will create a child node.\n    3. Create a decision tree\
    \ which maximizes information gain at each stage with the root condition `x >\
    \ 0`.\n*   Spotify training data in [Table 6.6](#chapter6.xhtml#tbl66) shows loudness\
    \ and acoustic factors for several songs. Use techniques presented in [Example\
    \ 6.10](#chapter6.xhtml#exam610) to determine a regression tree.\n\n*   [Table\
    \ 6.7](#chapter6.xhtml#tbl67) shows a training data set from a disease database\
    \ based on burden by cause [[[41](#refbib.xhtml#refbib41)]].\n\n| Country | Year\
    \ | Self harm | Substance abuse disorders | Interpersonal violence |\n| :--- |\
    \ :--- | :--- | :--- | :--- |\n| Sri Lanka | 2019 | 3.47 | 1.091 | 0.87 |\n\n\
    1. Create a regression tree to model interpersonal violence versus self-harm.\n\
    2. If the self measure is placed into 3 categories: Category 1 (low), Category\
    \ 2 (medium), and Category 3 (high), create a decision tree.\n3. Use the graph\
    \ in b to categorize.\n4. Use the graph in c to predict.\n5. Discuss why random\
    \ forest may produce better results than a decision tree using the dataset found\
    \ at Github link 5.\n\n## 7. Introduction to Random Matrices\n\nSo far, we have\
    \ used matrices with fixed values to model scenarios. Here we will explore the\
    \ idea of matrices whose entries are determined at random. For example, a 3x3\
    \ matrix, `X`, with entries that are randomly distributed with a standard normal,\
    \ `N(0,1)`, is a **random matrix**.\n\n```\nX = \\begin{pmatrix} 0.290226 & 0.91635\
    \ & 0.099847 \\\\ 0.882873 & -0.615393 & -0.902417 \\\\ -0.097429 & 0.855375 &\
    \ -0.665516 \\end{pmatrix}\n```\n\nThe matrix `X` is not symmetric; however, matrices\
    \ such as `XX^T` and `X + X^T` will always be symmetric with real eigenvalues.\
    \ A $n \\times n$ matrix, `M`, with entries `m[i,j]` is called a **Wigner matrix**\
    \ if the entries `m[i,j]` for $1 \\le i \\le j \\le n$ are i.i.d.\n\nIn this section,\
    \ we will focus on random matrices whose entries come from a Gaussian distribution,\n\
    \n$$\\begin{array}{l} {X = \\left( \\begin{array}{lllll} X_{1,1} & X_{1,2} & X_{1,3}\
    \ & \\ldots & X_{1,n} \\\\ X_{2,1} & X_{2,2} & X_{2,3} & \\ldots & X_{2,n} \\\\\
    \ X_{3,1} & X_{3,2} & X_{3,3} & \\ldots & X_{3,n} \\\\ \\vdots & \\ddots & \\\
    ddots & \\ddots & \\vdots \\\\ X_{m,1} & X_{m,2} & X_{m,3} & \\ldots & X_{m,n}\
    \ \\end{array} \\right),} \\\\\\\\ \\end{array}$$\n\nwhere $X[i,j] \\sim N(\\\
    mu, \\sigma^2)$ are i.i.d, $1 \\le i \\le m, 1 \\le j \\le n$.\n"
