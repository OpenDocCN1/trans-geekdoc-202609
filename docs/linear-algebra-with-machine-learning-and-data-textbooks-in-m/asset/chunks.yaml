    }$ 且 $r_{2} = \\left\\{ \\frac{1}{\\sqrt{2}},\\frac{1}{\\sqrt{2}} \\right\\}$。那么\
    \ $||r[1]|| = ||r[2]|| = 1$ 且 $r[1]\\cdot r[2] = 0$。同样的，$c_{1} = \\left\\{ \\\
    frac{1 + i}{2},\\frac{1}{\\sqrt{2}} \\right\\}$ 且 $c_{2} = \\left\\{ - \\frac{1\
    \ + i}{2},\\frac{1}{\\sqrt{2}} \\right\\}$则 $||c[1]|| = ||c[2]|| = 1$ 但 $c[1]\\\
