    在用 HMM（隐马尔可夫模型）求解解码问题时，我们希望找到给定观测序列 `O` 下出现概率最大的隐藏序列 `H^*`。更具体地说，解码的目标是确定：


    $$\begin{array}{r} {H^{\*} = argmax_{H}P(H|O).} \\\\ \end{array}$$


    注意，`argmax[H]P(H|O)` 是给定观测序列 `O` 的情况下，所有可能的 `H^′` 中隐藏序列 `H` 的最大概率。


    在研究解码问题时，我们将同时使用正向/反向算法（Forward/Backward Algorithm）和 `Viterbi Algorithm`。


    ## 应用正向/反向算法


    定义


    $$\begin{aligned} {\gamma{(H_{t})}^{k}} & {= P(H_{t} = k|O,\lambda)} \\ & {= \frac{P(H_{t}
    = k,O|\lambda)}{P(O|\lambda)}} \\ & {= \frac{\alpha{(H_{t})}^{k}\beta{(H_{t})}^{k}}{P(O|\lambda)}}
    \\ & {= \frac{\alpha{(H_{t})}^{k}\beta{(H_{t})}^{k}}}{\alpha(H_{n}) \cdot \beta(H_{n})}}
    \\ \end{aligned}$$


    与正向/反向算法类似，Viterbi Algorithm 仍然需要转移矩阵 `T`、发射矩阵 `E`，以及隐藏随机变量的初始概率分布 `π`。我们首先思考
    `Viterbi Algorithm` 的递归思想。


    假设观测到的随机变量序列为 `O[1]`、`O[2]`、…… `O[n]`，隐藏的随机变量序列为 `H[1]`、`H[2]`、…… `H[n]`。


    另一个重要的事实是，条件概率 `P(H|O)` 与联合概率 `P(H, O)` 成正比：


    $$\begin{array}{r} {P(H|O)P(O) = P(H,\ O)} \\\\ \end{array}$$


    因此，如果我们找到了使联合概率 `P(H, O)` 最大化的隐藏序列，该序列也将使条件概率 `P(H|O)` 最大化。


    $$\begin{aligned} H^{\*} & {= argmax_{H_{i},1 \leq i \leq n}P(H_{i}|O_{i})} \\
    & {= argmax_{H_{i},1 \leq i \leq n}P(H_{i},O_{i})} \\ & {= argmax_{H_{i},1 \leq
    i \leq n - 1}P(O_{i}|H_{i})P(H_{i}|H_{i - 1})P(H_{i - 1}|O_{i - 1}).} \\ \end{aligned}$$


    因此，如果 `p[i]` = `P(H[i]|O[i])`，那么：


    $$\begin{array}{r} {p_{i} = H^{\*} = argmax_{H_{i},1 \leq i \leq n}{\prod\limits_{i
    = 2}^{n - 1}P}(O_{i}|H_{i}){\prod\limits_{i = 2}^{n}P}(H_{i}|H_{i - 1})p_{1}.}
    \\\\ \end{array}$$


    算法真正想要找到的是该似然度最大化的隐藏序列。通过回顾 Viterbi Algorithm 矩阵和图 2.5 中的递归路径，反向选择概率最大的隐藏状态。因此，最可能的隐藏序列
    `M` 是：


    $$\begin{array}{r} {\left\{...\right\}} \\ \end{array}$$


    Viterbi Algorithm 是一种广泛使用的算法。对于那些在个人设备上使用语音或文字识别的人，Viterbi Algorithm 可用于解码你想要通信的内容。


    ### 2.2.3 学习问题


    在似然度问题和解码问题中，模型被假设是固定的。即我们知道初始概率 `π`、转移矩阵 `T` 和发射矩阵 `E`。


    这种类型的问题——学习问题，需要一种能够帮助确定模型 `λ = (T, E, π)` 的算法。在本节中，我们将讨论 `Baum-Welch Algorithm`。


    给定观测状态序列 `O = (O[1], O[2], ..., O[n])` 称为训练序列（training sequence），以及一个隐藏序列 `H =
    (H[1], H[2], ..., H[n])`，Baum-Welch Algorithm 将找到另一个隐藏序列 `H′`，使得：


    $$\begin{array}{r} {P(O|H^{\prime}) \geq P(O|H).} \\\\ \end{array}$$


    在 Baum-Welch Algorithm 下，这并不适用于所有 `H`。注意：


    $$\begin{array}{r} {{\sum\limits_{t = 1}^{T - 1}\gamma_{t}}(i)} \\ \end{array}$$


    是来自 `H[i]` 的期望转移次数，而


    $$\begin{array}{r} {{\sum\limits_{t = 1}^{T - 1}\xi^{t}}(i)} \\ \end{array}$$


    是从 `H[i]` 到 `H[j]` 的期望转移次数。


    让我们通过一个例子让 Baum-Welch Algorithm 运行起来。Baum-Welch Algorithm 是机器学习中用于模型的期望极大化算法（Expectation
    Maximization algorithms）类别中的一种方法。许多类似于 Baum-Welch 的梯度方法也是为了类似的目标开发的。


    ## 2.3 案例研究：传染病的传播


    2019 年，世界爆发了全球性流行病，这导致许多人开始思考传染病传播背后的数学原理。许多疾病（如 COVID-19）简单可以用 SIR 模型进行建模，人类分为三类：`S`（易感者）、`I`（感染者）和
    `R`（康复者）。还有更复杂的模型提供了临时免疫、隔离甚至死亡。


    我们将在本案例研究中探索这些模型。此外，大多数传染病模型采用随机连续时间马尔可夫模型；在本案例中，我们将关注离散时间模型。


    我们从基础 SIR 模型开始。该模型的底层假设是出生和死亡率相等。我们假设该模型的时间步是天；但也可以根据其他时间单位调整参数。


    如果马尔可夫链的状态为 `X[1]`、`X[2]`、……：


    $$\begin{array}{r} {P(X_{t} = R|X_{t - 1} = R) = 1} \\\\ \end{array}$$


    那么在免疫保证的情况下，恢复是一个吸收状态。截至 2020 年 5 月，人们希望存在某种临时免疫，但来自中国疫情的证据表明，如果存在，其寿命也是短暂的。我们首先假设没有采取社交距离，并且可能存在基于抗体的部分免疫，但这种免疫并不是保证的。


    转移矩阵的一个示例：


    $$\begin{array}{l} {T = \left( \begin{array}{lll} S & I & R \\ 0.99998 & 0. &
    0.0014286 \\ 0.00002 & 0.998 & 0. \\ 0. & 0.002 & 0.928571 \\ \end{array} \right)}
    \\\\ \end{array}$$


    产生了图 2.7 所示的感染传播。


    ![图 2.7 简单 SIR 模型下的疾病增长。](img/fig_7.jpg)


    图 2.7 简单 SIR 模型下的疾病增长。


    传染数数 `R[0]` 是一个病例在整个易感人群中产生的预期二次病例数。正数数数表明存在爆发的可能性，而负的 `R[0]` 则表示爆发是不可能的。


    $$\begin{array}{r} {R_{0} = \frac{\text{感染率}}{\text{预期疾病长度}}} \\\\ \end{array}$$


    在最简单的模型中，`R[0]`可以通过感染率 `r[0]` 和预期的感染长度 `L` 来估算，其中：


    $$\begin{array}{r} {R_{0} \approx 1 + r_{0}L.} \\\\ \end{array}$$


    因此，对于图 2.7 中所示的模型，如果我们估计 `r[0]` ≈ .017 且 `L` = 21 天，则 `R[0]` ≈ 1.357。


    相反，如果存在免疫，使得恢复作为吸收状态，可能会看到如图 2.8 所示的行为。


    ![图 2.8 具有免疫的 SIR 模型下的疾病增长。](img/fig_8.jpg)


    图 2.8 具有免疫的 SIR 模型下的疾病增长。


