    ## 7.4 高斯正交系


    在本节中，我们考虑具有复数元素的随机矩阵。记住，如果 `z` = `a` + `ib`，则 $\overline{z} = a - ib$ 是 `z` 的**复共轭**。如果
    `A` 是一个方矩阵，那么 `\overline{A}` 的元素是 `A` 中每个对应元素的复共轭。


    如果方矩阵 `A` 满足，则称其为**厄尔米特**（Hermitian）：


    $$\beginbegin{array}{r} {{\\overline{A}}^{T} = A.} \\\\ \\end{array}}$$


    `\overline{A}}^{T}` 称为 `A` 的**共轭转置**。


    如果可逆方矩阵 `A` 满足，则是**酉矩阵**：


    $$\\begin{array}{r} {{\\overline{A}}^{T} = A^{- 1}.} \\\\ \\end{array}}$$


    每一个厄 矩阵 `H` 都可以通过酉矩阵 `U` 对角化，所得对角矩阵 `D` 将具有实数元素。也就是说，如果 `H` 是一个厄尔米特矩阵，则存在一个酉矩阵
    `U` 使得


    $$\\begin{array}{r} {D = U^{- 1}HU,} \\\\ \\end{array}}$$


    其中 `D[i, i]` ∈ $\mathbb{R}$。


    $$\\begin{array}{l} {H = \\left( \\begin{array}{ll} 1 & {2 + 3I} \\\\ {2 - 3I}
    & 4 \\\\ \\end{array} \\right)\{~{~~}U = \\left( \\begin{array}{ll} {(2 - 3i)\\sqrt{\\frac{1}{26}
    - \\frac{3}{26\\sqrt{61}}}} & \\frac{\\sqrt{61} + 3}{\\sqrt{6\\sqrt{61} + 122}}
    \\\\ {( - 2 + 3i)\\sqrt{\\frac{1}{26} + \\frac{3}{26\\sqrt{61}}}} & \\frac{\\sqrt{61}
    - 3}{\\sqrt{122 - 6\\sqrt{61}}} \\\\ \\end{array} \\right)} \\\\ \\end{array}}$$


    其中 `U` 的列是 `H` 的单位特征向量，则有


    $$\\begin{array}{l} {U^{- 1}HU = \\left( \\begin{array}{ll} {\\frac{1}{2}\\left(
    {\\sqrt{61} + 5} \\right)} & 0 \\\\ 0 & {\\frac{1}{2}\\left( {5 - \\sqrt{61}}
    \\right)} \\\\ \\end{array} \\right) = D.} \\\\ \\end{array}}$$


    `U` 是酉矩阵，`D` 的对角线元素是 `H` 的实特征值。


    将引理 4 中的类似思路应用于厄尔米特矩阵 `H` 的概率密度与 `D = U^{-1}HU` 相同，因此与 `H` 的特征值直接相关。


    如果 `H[i, i]` ∼ $N(0, 1)$ 且上三角元素 $H_{i,j}$ $\sim N(0, \frac{1}{2}) + iN(0, \frac{1}{2})$
    对于 $1 \le i \le n$，则该随机厄尔米特矩阵是**高斯正交系 (GUE)**。标准 GUE 为：


    $$\\begin{array}{r} {H = \\frac{X + {\\overline{X}}^{T}}{2},} \\\\ \\end{array}}$$


    其中 `X[i, i]` ∼ $N(0, 1)$ 且 $X_{i,j}$ $\sim N(0, \frac{1}{2})$ 对于 $1 \le i \le
    n$。


    类似于高斯正交系（GOE），如果我们从 GUE 定义一个 $2 \times 2$ 随机矩阵：


    $$\\begin{array}{l} {X = \\left( \\begin{array}{ll} X_{1} & X_{2} + X_{3}i \\\\
    X_{2} - X_{3}i \\\\ \\end{array} \\right),} \\\\ \\end{array}}$$


    带有 i.i.d 随机变量 `X[1], X[4]` ∼ $N(0,1)$ 且 $X_{2}, X_{3}$ $\sim N(0,\frac{1}{2})$，则
    `X` 的特征值为


    $$\\begin{array}{r} {\\frac{1}{2}Tr(X) \\pm \\sqrt{(X_{1} - X_{4})^{2} + 4{(X_{2}
    + X_{3}i)^{2}}}, \\\\ \\end{array}}$$


    且特征值的平均值为 $\frac{1}{2}(X_{1} + X_{4}) \sim N(0,\frac{1}{2})$。


    定理 18 中的结论并不适用于所有非 GOE 或 GUE 的随机矩阵。图 7.7 显示了非厄尔米特、非对称随机矩阵特征值的实部与虚部。


    ![图 7.7 2×2 非酉矩阵特征值的实部与虚部](img/fig7_7)


    本章最后一个系是高斯辛交系，它关注具有四元数的随机元素。


    ## 7.5 高斯辛交系


    **四元数**是一个线性组合：


    $$\\begin{array}{r} {q = a \\cdot 1 + bi + cj + dk,} \\\\ \\end{array}}$$


    其中 $a, b, c, d \in \mathbb{R}$ 且 $i, j, k$ 是四元数单位：


    $$\\begin{array}{r} {i^{2} = j^{2} = k^{2} = i \\cdot k = -1.} \\\\ \\end{array}}$$


    四元数集记为 $\mathbb{H}$。


    四元数 `q` 的复共轭也可以定义为：


    $$\\begin{array}{r} {\\overline{q} = a \\cdot 1 - bi - cj - dk.} \\\\ \\end{array}}$$


    类似于 $\mathbb{C}^n$ 中的元素，如果 `q = (q[1], q[2], ..., q[n])` 和 `p = (p[1], p[2], ...,
    p[n])` 在 $\mathbb{H}^n$ 中，则


    $$\\begin{array}{r} {< p, q > = \\sum_{i = 1}^{n}\\overline{p}_{i}}q_{i},} \\\\
    \\end{array}}$$


    因此 `q` 的范数为：


    $$\\begin{array}{r} {||q|| = q\\overline{q} = \\overline{q}q = a^{2} + b^{2} +
    c^{2} + d^{2}.} \\\\ \\end{array}}$$


    形式为的 $2 \times 2$ 矩阵 `Q`：


    $$\\begin{array}{l} {Q = \\left( \\begin{array}{ll} z & w \\ -\\overline{w} &
    \\overline{z} \\\\ \\end{array} \\right),} \\\\ \\end{array}}$$


    其中 `z` 和 `w` 是复数，则被称为**实四元数**矩阵。正四元数的标准基元素 1, `i`, `j` 和 `k` 一样，作为 $2 \times 2$
    矩阵：


    $$\\begin{array}{l} {V_{1} = \\left( \\begin{array}{ll} 1 & 0 \\\\ 0 & 1 \\\\
    \\end{array} \\right), V_{2} = \\left( \\begin{array}{ll} i & 0 \\\\ 0 & -i \\\\
    \\end{array} \\right),} \\\\ \\end{array}}$$


    （此处应有 $V_3, V_4$ 定义）

    $$\\begin{array}{l} {V_{3} = \\left( \\begin{array}{ll} 0 & j \\\\ -j & 0 \\\\end{array}
    \\right), V_{4} = \\left( \\begin{array}{ll} 0 & k \\\\ -k & 0 \\\\ \\end{array}
    \\right),} \\\\ \\end{array}}$$


    可以作为四元数集合的基，其中元素具有四元数性质。


