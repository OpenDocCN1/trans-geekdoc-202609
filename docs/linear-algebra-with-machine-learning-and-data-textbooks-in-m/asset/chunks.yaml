    \ first kind, are an orthogonal set of functions. Both the Chebyshev polynomials\
    \ of the first kind and the Hermite polynomials are popular families of functions\
    \ used for interpolating, or curve fitting, of data.\n\n## 4.3 Newton's Difference\n\
    \n[Section 4.1](#chapter4.xhtml#sec4_1) presents Lagrange interpolating polynomials\
    \ which fit exactly to a given set of interpolating points. In fact, given an\
    \ unknown function `f(x)` and `n+1` interpolating points, `x[0]<x[1]<…x[n]`, there\
    \ is a unique polynomial `f(x)` that\n\n$$\\begin{array}{r} {\\\\hat{f}(x_{j})\
    \ = f(x_{j}),\\\\ 0 < j < n.}$$\n\nIn this section, we present several closed\
    \ forms for the Newton interpolating polynomial, `f(x)`. Let `\\hat{f_{1}}(x)\
    \ = a_{0}` and\n\n$$\\begin{aligned} {\\\\hat{f\\_{n}}(x)} & = a_{0} + a_{1}(x\
    \ - x_{0}) + a_{2}(x - x_{0})(x - x_{1}) + \\\\ldots + a_{n}(x - x_{0})\\cdots(x\
    \ - x_{n})} \\\\ & = a_{0} + \\\\sum_{j = 1}^{n}a_{j}}{\\prod_{i = 0}^{j - 1}(x\
    \ - x_{i})}}\\end{aligned}$$\n\nwhere\n\n$$\\begin{array}{r} {a_{j} = \\\\frac{f(x_{j})\
    \ - {\\\\hat{f\\_{j - 1}}(x_{j})}}{\\prod_{i = 0}^{j - 1}(x - x_{i})}} \\\\\\\\\
    end{array}$$\n\nYou might have noticed that Newton's interpolating polynomials\
    \ are defined recursively. That is, the definition of the `n`^(th) degree polynomial,\
    \ `f[n](x)`, depends on `f[1](x)`,…,`f[n-1](x)`. We can also write Newton's interpolating\
    \ polynomials, recursively, in terms of Newton's divided differences.\n\n### 4.3.1\
    \ Newton's Interpolation via Divided Difference\n\nThe first Newton's divided\
    \ difference between `x[i]` and `x[j]`, denoted\n\n$$\\begin{array}{r} {f\\lbrack\
    \ x_{i},x_{j}\\,}} \\\\\\\\end{array}$$  \n\nis the slope of the tangent line\
    \ between `(x[i], f(x[i]))` and `(x[j], f(x[j]))`,\n\n$$\\begin{array}{r} {f\\\
    lbrack x_{i},x_{j}\\rbrack = \\\\frac{f(x_{i}) - f(x_{j})}{x_{i} - x_{j}}.} \\\
    \\\\\\end{array}$$  \n\nSimilarly, `n+1` points `x[0]<x[1]<…x[n]` can be used\
    \ to find the second divided difference,\n\n$$\\begin{array}{r} {f\\lbrack x_{0},x_{1},\\\
    \\ldots,x_{n}\\rbrack = \\\\frac{f\\\\lbrack x_{0},x_{1},\\\\ldots,x_{n - 1}\\\
    \\rbrack - f\\\\lbrack x_{1},x_{2},\\\\ldots,x_{n}\\\\rbrack}{x_{0} - x_{n}}.}\
    \ \\\\\\\\ \\\\end{array}$$  \n\nTypically, Newton's divided differences are presented\
    \ in a table similar to the one seen in [Table 4.1](#chapter4.xhtml#tbl4_1).\n\
    \n[Table 4.1](#chapter4.xhtml#b4tbl_1) Divided Difference where `Δx` = 1.\n\n\
