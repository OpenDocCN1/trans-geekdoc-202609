  trans: "\n\n![图 7.13 平均协方差与协方差矩阵的最大特征值。](img/fig7_13.jpg)\n\n图 7.13 平均协方差与协方差矩阵的最大特征值。\n\
    \n为了创建一个最优组合，人们可能希望最大化`Sharpe ratio` [38]，\n\n$$\\\\begin{array}{r} {\\\\frac{\\\
    text{Portfolio~return}}{\\text{Portfolio~risk}} = \\\\frac{W^{T}r(t)}{\\sqrt{W^{T}\\\
    \\Sigma(t)W}},} \\\\ \\\\end{array}$$\n\n其中 `r`(`t*) 是每个资产的预期收益，`Σ`(`t*) 是这些收益的预测协方差矩阵。还可能希望仅优化预期收益\
    \ `W`^(*T*)*`r`(`t*)`。\n\n图 7.14 显示了 `W`^(*T*)*`r`(`t*)` 和夏普比率在整个时间范围内的最大值情况。注意最大值大约每\
    \ 20 天出现一次。\n\n![图 7.14 W^{T}r(t) 随时间的变化。](img/fig7_14.jpg)\n\n图 7.14 `W`^(*T*)*`r`(`t*)\
    \ 随时间的变化。\n\nGithub 链接 44 和 46 提供了案例研究的 Python 和 R 语法。\n\n## 7.8��案例研究：基因相互作用中的随机矩阵\n\
    \n现实中，基因在体内并非孤立起，而是在共同的细胞环境中相互作用。这可能是显性基因相互作用、互补基因相互作用或补充基因相互作用。科学家早就知道某些遗传疾病是由单基因突变引起的。这些疾病被称为**单基因遗传疾病**。**多基因疾病**是由多个相互相互作用的基因发生遗传突变引起的。这一过程被称为**上位性**（epistatis）。关于基因间相互作用的知识可以让我们更好地理解遗传性疾病\
    \ [29]。\n\n有许多与基因间相互作用相关的数据库。在本案例研究中，我们使用了来自 Cancer Network Galaxy [5] 的数据，它专注于与癌症相关的基因间相互作用。Cancer\
    \ Network Galaxy 拥有 256 个数据集，代表了 22,820 个基因及其相互作用。在案例研究中，我们关注其中一个数据集，重点关注 131\
    \ 行癌细胞系的 mRNA 表达，可以在 Github 链接 49 中找到；但鼓励在未来的研究中使用包含多个数据集的大模型。\n\n图 7.15 显示了数据集中基因相互作用子图的图形描述。\n\
    \n![图 7.15 Cancer Network Galaxy 中基因间相互作用小子集的可视化。](img/fig7_15.jpg)\n\n图 7.15\
    \ Galaxy 中基因间相互作用小子集的可视化。\n\n在本案例研究中，假设在 `m` 个受试者测量了 `n` 个遗传标记物 `G`[`1`]`, `G`[`2`]`,\
    \ …, `G`[`n`]。在提供的数据集中，识别出了父基因和子基因。创建一个关系矩阵 `M`，如果父基因 `G`[`i`] 与子基因 `G`[`j`] 相关，则\
    \ `M`[`i`,`j`]=1。否则 `M`[`i`,`j`]=0。注意矩阵 `M` 是一个稀疏矩阵，许多元素为 0。同样注意矩阵 `M` 可能不对称。\n\
    \n我们定义样本相关矩阵\n\n$$\\\\begin{array}{r} {W = \\\\frac{1}{n - 1}MM^{T}.}\\\\ \\\\\
    endend{array}$$\n\n此外，如果 `λ`[`i`] 和 `λ`[`j`] 是 `W` 的连续特征值，图 7.16 显示了特征值间距的分布。\n\
    \n![图 7.16 基因间相互作用矩阵的特征值间距分布。](img/fig7_16.jpg)\n\n图 7.16 基因间相互作用矩阵的特征值间距分布。\n\
    \n注意 图 7.16 中看到的分布遵循类似于 Wigner 猜想（Wigner Surmise）的瑞利分布。还可以看到，在 图 7.17 中，基因间相互作用协方差矩阵的特征值分布遵循更加对称。如果整合来自\
    \ [5] 的更多数据，我们将开始看到 Wigner 半圆律的呈现。\n\n![图 7.17 基因间相互作用矩阵的特征值分布。](img/fig7_17.jpg)\n\
    \n图 7.17 基因间相互作用矩阵的特征值分布。\n\n为了进一步研究基因间相互作用到随机矩阵，你可以参考 Github 链接 45 和 47 的 Python\
    \ 和 R 代码。\n\n## 7.9⃃练习\n\n*   求 `A = \\begin{pmatrix} 0.1 & -1 \\\\ 0 & 1 \\end{pmatrix}`\
    \ 的条件数。\n*   验证 Bauer-Fike 定理对于\n    $$\\begin{array}{l} {A = \\left(\\begin{array}{ll}\
    \ 4 + i \\\\ 3 + i \\end{array}\\right)\\text{~}E = \\left(\\begin{array}{ll}\
    \ 0.1 & 0.8 \\\\ -0.01 & 0 \\end{array}\\right)}\\}\\\\ \\\\end{array}$$\n*  \
    \ （编码）使用 Python 通过以下命令可视化矩阵 `A` 的伪谱：\n\n```python\nimport numpy as np\nimport\
    \ matplotlib.pyplot as plt\nfrom scipy.linalg import svdvals, schur\n```\n绘制 $$\\\
    begin{array}{l} {A = \\left(\\begin{array}{ll} 0.1 & -1 \\\\ 0 & 1 \\end{array}\\\
    right)}\\\\end{array}$$\n*   1. 如果 `H` 是 4×4 GOE，求其平均特征值的分布。\n    2. （编码）编写代码生成\
    \ 10000 个 4×4 GOE 矩阵并计算每个 GOE 的特征值平均值。使用这些值绘制平均特征值的分布图，并与 a 小题答案进行对比。\n*   判断下列矩阵哪些是厄尔特矩阵：\n\
    \    1. $\\begin{pmatrix} 4 - 2i & -8 + 12i \\\\ -8 + 12i & 36 - 16i \\end{pmatrix}$\n\
    \    2. $\\begin{pmatrix} 1 & 1 + i \\\\ 1 - i & 1 \\end{pmatrix}$\n    3. $\\\
    begin{pmatrix} 1 & 2 \\\\ 2 & 3 \\end{pmatrix}$\n*   令 `A = \\begin{pmatrix} \\\
    frac{1 + i}{2} & -\\frac{1 + i}{2} \\\\ \\frac{1}{\\sqrt{2}} & \\frac{1}{\\sqrt{2}}\
    \ \\end{pmatrix}`。判断 `A` 是否为酉矩阵。\n*   （编码）使用 Python 或 R，生成一个 `N=100` 个人的群体，他们的初始值均为\
    \ `V=1000`。编写一个循环，其中时间步代表交易期，并在以下条件下跟踪每个人的价值：\n    1. 在每个时间步随机与一个人进行交易，交易者之间的总价值平分。\n\
    \    2. 在每个时间步随机与一个人进行交易，交易者之间的总价值按生成的百分比进行分配。\n    3. 每个人赋予一个 `V=100` 到 `V=1000`\
    \ 之间的随机初始值。在每一步随机与一个人进行交易。价值较高者获得交易总价值的 75%，价值较低者获得 25%。\n\n"
