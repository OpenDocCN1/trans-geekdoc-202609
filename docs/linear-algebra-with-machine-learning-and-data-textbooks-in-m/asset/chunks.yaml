    \ = \\frac{1 - 2}{2} = -0.5$ | |\n| `f[x[2]] = 2` | | | |\n| | `f[x[2], x[3]]\
    \ = 2` | | |\n| | | $f[x_{2},x_{3},x_{4}] = \\frac{2 - 3}{2} = -0.5$ | |\n| `f[x[3]]\
