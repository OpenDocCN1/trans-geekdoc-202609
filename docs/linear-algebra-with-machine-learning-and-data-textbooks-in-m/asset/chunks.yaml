  trans: "\n\n图 4.11 显示了以 3 个标准差宽度带为中心的年度黑人逮捕率，以及相对于该数据集以 3 个标准差宽度带为中心的年度白人逮捕率。这表明两个数据集之间非常遥远。人们可以考虑对这一案例研究进行统计假设检验。\n\
    \n![图 4.11 数据 \\pm \\, 3\\sigma 带带](img/fig4_11.jpg)\n\n图 4.11 数据 ± 3σ 带带。\n\n\
    本案例研究的示例 Python 和 R 代码可以在 Github 链接 27 和 30 中找到。\n\n## 4.9 案例研究：高等教育数据的插值\n\n\
    高等教育机构面临许多与多样性、公平性和包容性相关的问题。高等教育是社会流动的关键途径。遗憾的是，高等教育的入学和获得程度仍然存在种族和民族差异 [33]。\n\
    \n在这项研究中，我们仔细观察了高等教育的成功如何与学费和导师指导相关。\n\n表 4.6 中找到的数据是美国高等教育协会《高等教育中的种族和民族报告》提供的数据集\
    \ [18]。\n\n表 4.6 按种族划分的高等教育成功指标。\n\n| | | x[1] | x[2] | x[3] | y |\n| --- | ---\
    \ | --- | --- | --- |\n| 种族和 | 12 年级 | 百比 | 全职 | 百比 |\n| 民族 | 数学熟练程度 | 入学人数 |\
    \ 教职 | 毕业人数 |\n| 亚洲人 | 37.5 | 57.21 | 9.5 | 30.7 |\n| --- | --- | --- | --- |\
    \ --- |\n| 黑人或非洲裔美国人 | 6.83 | 36.33 | 5.7 | 15.3 |\n| 西班牙裔或拉丁裔 | 11.25 | 38.32\
    \ | 4.8 | 12.2 |\n| 白人 | 28.21 | 41.86 | 72.6 | 23.75 |\n\n在这项研究中，我们将研究如何使用表 4.6\
    \ 中的因素来预测毕业率和未来的成功。\n\n设\n\n$$\\begin{array}{l} {A = \\left( \\begin{array}{llll}\
    \ 1 & 37.5 & 57.21 & 9.5 \\\\ 1 & 6.83 & 36.33 & 5.7 \\\\ 1 & 11.25 & 38.32 &\
    \ 4.8 \\\\ 1 & 28.21 & 41.86 & 72.6 \\\\ \\end{array} \\right)} \\\\ \\end{array}$$\
    \  \n\n$$\\begin{array}{l} {{(A^{T}A)^{- 1}A^{T}\\left( \\begin{array}{l} 30.7\
    \ \\\\ 15.3 \\\\ 12.16 \\\\ 23.75 \\\\ \\end{array} \\right) = \\left( \\begin{array}{l}\
    \ {-131.767} \\\\ {-2.59432} \\\\ 4.44338 \\\\ 0.588323 \\\\ \\end{array} \\right)}\
    \ \\\\ \\end{array}$$  \n\n和\n\n$$\\begin{aligned} \\hat{gradrate} & {= - 131.767\
    \ - 2.59432x_{1} + 4.44338x_{2} + 0.588323x_{3}} \\\\ {SSE} & {= 9.4110^{-23}.}\
    \ \\\\ \\end{aligned}$$\n\n毕业并不是成功的唯一标准。毕业后的成功衡量标准可能考虑了债务以及学生偿还债务的能力。\n\n表 4.7\
    \ 与贷款相关的数据。\n\n| x[4] | y[2] |\n| --- | --- |\n| 获取学位的百分比 | 欠款金额 |\n| 6.6 | 45.6\
    \ |\n| 12 | 105.5 |\n| 15 | 69.7 |\n| 58.5 | 53.5 |\n\n我们希望创建一个三次插值器 $h(x)$，使用借款百分比来预测欠款金额，但我们没有关于导数的任何信息。这种策略通过估计点之间的斜率来效果更好。我们还假设最后两个点的导数保持相同。表\
    \ 4.8 估计的 $h'(x)$。\n\n| x[4] | 近似 $h'(x[4])$ |\n| --- | --- |\n| 6.6 | $\\frac{105.5\
    \ - 45.6}{12 - 6.6} = 11.0926$ |\n| 12 | $\\frac{69.7 - 105.5}{15 - 12} = -11.9333$\
    \ |\n| 15 | $\\frac{53.5 - 69.7}{58.5 - 15} = -0.3714$ |\n\n在这里我们采用差分法。表 4.9 差分表。\n\
