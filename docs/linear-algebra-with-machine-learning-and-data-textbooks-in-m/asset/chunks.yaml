  trans: "\n\n$$\\begin{array}{l} {A = \\left( \\begin{array}{lllll} a_{1,1} & a_{1,2}\
    \ & a_{1,3} & \\ldots & a_{1,m} \\\\ a_{2,1} & a_{2,2} & a_{2,3} & \\ldots & a_{2,m}\
    \ \\\\ \\vdots & \\ddots & \\ddots & \\ddots & \\vdots \\\\ a_{n,1} & a_{n,2}\
    \ & a_{n,3} & \\ldots & a_{n,n} \\\\ \\end{array} \\right).} \\\\ \\end{array}$$\
    \  \n\n`A` 的维度为 $n \\times m$。如果矩阵的行数等于列数，则该矩阵为**方阵**。\n\n矩阵加法是逐元素的。也就是说，如果 `A`\
    \ 和 `B` 是维度相同的矩阵，那么 $(A + B)[i, j] = a[i, j] + b[i, j]$。\n\n如果希望将矩阵的每个元素乘以一个常数（也称为标量），这被称为标量乘法。\n\
    \n`A` 的转置记为 $A^{(T)}$，是一个 $m \\times n$ 矩阵，其中\n\n$$\\begin{array}{r} {A_{i,j}^{T}\
    \ = A_{j,i}.} \\\\ \\end{array}$$  \n\n如果 $A = A^{(T)}$，则矩阵 `A` 是**对称矩阵**。\n\n\
    两个维度相同的矩阵 `A` 和 `B` 的**哈达玛乘积**（也称为逐元素乘积）为：\n\n$$\\begin{array}{r} {A^{\\circ}B,}\
    \ \\\\ \\end{array}$$  \n\n其中 $A^{\\circ}B$ 的第 $(i, j)$ 个元素为 $a[i, j]b[i, j]$。\n\
    \n为了让 $m \\times n$ 矩阵 `A` 右侧乘以矩阵 `B`，`B` 的行数必须等于矩阵 `A` 的列数。也就是说，`B` 必须是某个自然数\
    \ $p$ 的 $n \\times p$ 矩阵。\n\n![](img/mathfm_14.jpg)\n\n乘积 `AB` 的元素为\n\n$$\\begin{array}{r}\
    \ {AB_{i,j} = \\sum_{k = 1}^{n}a_{i,k}b_{k,j}.} \\\\ \\end{array}$$  \n\n**单位矩阵**\
    \ `I` 是一个满足以下条件的方阵：\n\n$$\\begin{array}{r} {I_{i,j} = 1\\text{ 若 } i = j,\\text{否则为\
    \ 0.}} \\\\ \\end{array}$$  \n\n如果 `A` 是一个 $m \\times n$ 矩阵且 `I` 是 $m \\times\
    \ m$ 单位矩阵，那么\n\n$$\\begin{array}{r} {AI = IA = A.} \\\\ \\end{array}$$  \n\n如果\
    \ `A` 是一个方阵，我们也可以讨论 `A` 的幂，其中 $A² = A \\cdot A$ 且矩阵的指数规则成立。\n\n$$\\begin{aligned}\
    \ A^{r + s} & = A^{r} \\cdot A^{s} \\\\ {(A^{r})^{s} & = A^{rs}} \\\\ \\end{aligned}$$\
    \  \n\n在线代数的许多应用中，问题的目标是求解方程组 $Ax = b$ 中的 `x`，其中 `A` 是一个 $n \\times n$ 矩阵，`x`\
    \ 和 `b` 是 $n \\times 1$ 矩阵，也称为 $\\mathbb{R}^n$ 中的向量。\n\n如果 `A` 是**可逆的**（也称为**非奇异的**），则存在矩阵\
    \ $A^{-1}$ 使得\n\n$$\\begin{array}{r} {A^{-1} \\cdot A = A \\cdot A^{-1} = I} \\\
    \\ \\end{array}$$  \n\n如果 `A` 不可逆，我们称 `A` 是**奇异的**。\n\n一个含有 $n$ 个变量的 $m$ 元方程组\n\
    \n$$\\begin{aligned} {a_{1,1}x_{1} + a_{1,2}x_{2} + \\ldots + a_{1,n}x_{n}} &\
    \ = b_{1} \\\\ {a_{2,1}x_{1} + a_{2,2}x_{2} + \\ldots + a_{2,n}x_{n}} & = b_{2}\
    \ \\\\ & \\vdots \\\\ {a_{m,1}x_{1} + a_{m,2}x_{2} + \\ldots + a_{m,n}x_{n}} &\
    \ = b_{m}} \\\\ \\end{aligned}$$\n\n可以写成矩阵形式 $Ax = b$，其中 `A` 是一个 $m \\times n$\
    \ 矩阵，`x` 和 `b` 是 $m \\times 1$ 矩阵。如果 `A` 是方阵且可逆，则方程组 $Ax = b$ 有唯一解 `x`。如果 `A`\
    \ 不是方阵或不可逆，则方程组可能无解或有无穷多解。\n\n方阵 `A` 的**行列式**将矩阵映射到一个实数，即 $|A|$。计算行列式有多种方法，包括针对小矩阵的代数子展开，例如\n\
    \n$$\\left| \\begin{array}{ll} a_{1,1} & a_{1,2} \\\\ a_{2,1} & a_{2,2} \\end{array}\
    \ \\right| = a_{1,1}a_{2,2} - a_{1,2}a_{2,1}$$\n\n为了对 $n \\times n$ 矩阵 `A` 进行代数子展开，选择某一行\
    \ $i$ 或某一列 $j$ 进行展开。那么\n\n$$|A| = \\sum_{j=1}^{n} (-1)^{i+j}a_{i,j}M_{i,j}$$\n\
    \n其中 $M_{i,j}$ 是 $(i, j)$ 子式，它是删除 `A` 的第 $i$ 行和第 $j$ 列后得到的 $(n-1) \\times (n-1)$\
    \ 子矩阵的行列式。\n\n"
- fmt: "\nBoth [Chapters 4](#chapter4.xhtml) and [5](#chapter5.xhtml) focus on predictive\
    \ models. Where [Chapter 4](#chapter4.xhtml) focuses more on traditional interpolation\
    \ techniques such as Chebyshev, Hermite, and Lagrange interpolation, [Chapter\
    \ 5](#chapter5.xhtml) steps back and takes a quick look at probability theory\
    \ and matrix calculus before connecting the material from [Chapter 4](#chapter4.xhtml)\
    \ to machine learning and neural network techniques. In these sections, some knowledge\
    \ of calculus is helpful, since there is a focus on optimizing cost functions.\
    \ Again, a good understanding of technology is important in [Chapter 5](#chapter5.xhtml),\
    \ as iterative methods become significantly important in neural network techniques.\n\
    \n[Chapter 6](#chapter6.xhtml) focuses on implementing the concepts of previous\
    \ chapters in decision trees. Several different takes on decision trees will be\
    \ presented in this chapter, including decision tree regression, Fourier transformations,\
    \ and random forests.\n\nFinally, many models are built around random matrices;\
    \ the focus is on [Chapter 7](#chapter7.xhtml). The discussion in [Chapter 7](#chapter7.xhtml)\
    \ relies heavily on probability theory, introduced in [Chapter 5](#chapter5.xhtml),\
    \ and knowledge of eigenvalues and eigenvectors. In [Chapter 7](#chapter7.xhtml),\
    \ the `Kroenecker product`, also called the `tensor product` is also used.\n\n\
    If `A` is an `m` × `n` matrix and `B` is a `p` × `q` matrix then the Kroenecker\
    \ product,\n\n$$\\begin{array}{l} {A \\otimes B = \\left( \\begin{array}{lll}\
    \ {a_{1,1}B} & \\ldots & {a_{1,n}B} \\\\ \\vdots & & \\vdots \\\\ {a_{m,1}B} &\
    \ \\ldots & {a_{m,n}B} \\\\ \\end{array} \\right).} \\\\ \\end{array}$$  \n\n\
    A matrix `A` is `skew-symmetric` if `A`^(`T`*)℄= − `A`. In [Chapter 7](#chapter7.xhtml),\
    \ we specifically employ the Kronecker product of a skew-symmetric matrix with\
    \ the identity matrix as is seen in [Example 0.6](#chapter101.xhtml#exam0_6).\n\
    \nThroughout the text, readers are encouraged to use a critical eye when it comes\
    \ to ethics of data analytics. Additionally, when choosing a model, the reader\
    \ should take into account the application in order to chose the most meaningful\
    \ model in context.\n\n# 1 Graph Theory\n\nDOI: [10.1201/9781003025672-1](https://doi.org/10.1201/9781003025672-1)\n\
    \n## 1.1 Basic Terminology\n\nWhen studying data, data scientists are most concerned\
    \ with the relationships or connections between the pieces of data in a network.\
    \ In this chapter, we explore those networks in terms of graph theory and see\
    \ how these ideas tie back to data science and linear algebra.\n\nA `graph`, `G`,\
    \ can be represented by a set of `vertices` or `nodes`, `V`, and a set of `edges`,\
    \ `E`, where each edge in `E` connects two vertices in `V`.\n\nThe number of vertices\
    \ in a graph, `G`, is called the `order` of the graph and is denoted by `|V|`.\
    \ The number of edges in a graph, `G`, is called the `size` and is denoted by\
    \ `|E|`.\n\nAn edge is said to be `incident` to vertices `v[i]` and `v[j]` if\
    \ it connects the two vertices. We call vertices `v[i]` and `v[j]` `endpoints`\
    \ of this edge.\n\nVertex `v[i]` is said to be `adjacent` to vertex `v[j]` if\
    \ there is an edge incident to both vertex `v[i]` and vertex `v[j]`. The `degree`\
    \ of a vertex is the number of incident edges to that vertex.\n\nNotice that in\
    \ the graph in [Figure 1.1](#chapter1.xhtml#fig1_1), `|V|` = 6 and `|E|` = 12.\
    \ Vertex `v[4]` is adjacent to every other vertex while `v[1]` is adjacent to\
    \ `v[2]`, `v[3]`, and `v[4]`, and thus `degree(v[1])`℄= 3 and `degree(v[4])`℄= 5.\n\
    \n![Figure 1.1 |V| = 6,|E| = 12, degree (v_{1}) = 3, and degree (v_{4}) = 5.](images/fig1_1.jpg)\n\
    \n[Figure 1.1](#chapter1.xhtml#b1fig1_1) `|V|` = 6, `|E|` = 12, degree (`v[1]`)℄= 3,\
    \ and degree (`v[4]`)℄= 5.\n\nAn edge with only one endpoint is called a `loop`.\n\
    \nNotice that if a vertex is adjacent to itself via a loop, that edge contributes\
    \ two edges to the degree of that vertex. The `handaking theorem` emphasizes that\
    \ each edge is incident to two vertices, which may not be unique, and is counted\
    \ twice when calculating the sum of the degrees of the graph. If two or more edges\
    \ have the same endpoints, they are called `multiple edges`.\n\n[Figure 1.2](#chapter1.xhtml#fig1_2)\
    \ shows a graph with multiple edges between `v[1]` and `v[2]` and a loop from\
    \ `v[3]` to itself. Vertex `v[3]` has a degree of 4, where the loop from `v[3]`\
    \ to itself contributes two edges to the degree of `v[3]`. Vertices `v[1]` and\
    \ `v[2]` both have a degree of 3. The multiple edges between `v[1]` and `v[2]`\
    \ contribute 2 edges to the degree of both `v[1]` and `v[2]`.\n\n![Figure 1.2\
    \ Example of a graph with a loop and multiple edges.](images/fig1_2.jpg)\n\n[Figure\
    \ 1.2](#chapter1.xhtml#b1fig1_2) Example of a graph with a loop.\n\nA `subgraph`\
    \ of graph `G` is another graph containing a subset of vertices from `V` and all\
    \ of the edges from `E` that connect pairs of vertices. There are many subgraphs\
    \ of the graph displayed in [Figure 1.1](#chapter1.xhtml#fig1_1); one example\
    \ can be seen in [Figure 1.3](#chapter1.xhtml#fig1_3).\n\n![Figure 1.3 Example\
    \ of a subgraph of the graph in 1.1.](images/fig1_3.jpg)\n\n[Figure 1.3](#chapter1.xhtml#b1fig1_3)\
    \ Example of a subgraph of the graph in `V`.\n\nFor each graph, there is a corresponding\
    \ `adjacency matrix`, `A`, where\n\n$$\\begin{array}{l} {A_{i,j} = \\left\\{ \\\
    begin{array}{ll} {1,} & \\text{if~vertex}v_{i}\\text{is~adjacent~to~vertex}v_{j},}\
    \ \\\\ {0,} & \\text{otherwise}} \\end{array} \\right\\} \\\\ \\end{array}$$\n\
    \nNotice the loop in [Figure 1.4a](#chapter1.xhtml#fig1_4) from vertex `v[1]`\
