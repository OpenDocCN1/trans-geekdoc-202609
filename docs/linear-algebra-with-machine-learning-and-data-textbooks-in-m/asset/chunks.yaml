    \ confirmed positive cases on day *t*, where *t* = 1, 2, …, *T*. Thus the probability\
    \ density function of *Y*[*t*] is\n\n$$\\\\begin{array}{r} {L(Y\\_{t}|\\\\, t,\\\
    \\, a\\_{0},\\\\, a\\_{1}) = {\\\\prod\\\\limits\\_{t = 1}^{T}\\\\frac{{(a\\_{0}\
    \ + a\\_{1}t)}^{Y\\_{t}}}{Y\\_{t}!}}e^{- (a\\_{0} + a\\_{1}t)},} \\\\\\\\ \\\\\
    end{array}$$  \n\nwhere the mean\n\n$$\\\\begin{array}{r} {E(Y\\_{t}|\\\\, t,\\\
    \\, a\\_{0},\\\\, a\\_{1}) = \\\\lambda = \\\\ln(a\\_{0} + a\\_{1}t).} \\\\\\\\\
    \ \\\\end{array}$$  \n\nThe data for this Case Study is from the open source data\
    \ site provided by the Ontario government on over 500000 confirmed cases of COVID-19\
    \ in Ontario in 2020 and 2021 \\[[27](#refbib.xhtml#refbib27)\\]. For this case\
    \ study, a small sample of this data is displayed. The reader is encouraged to\
