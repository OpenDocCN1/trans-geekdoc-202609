    0 & 0 & 0 & 1 & 0 & 0 \\ {MIZ} & 0 & 0 & 0 & 0 & 0 & 1 & 0 \\ {SC} & 0 & 0 & 0
    & 0 & 0 & 0 & 1 \\ {VAN} & 0 & 0 & 0 & 0 & 0 & 0 & 0 \\ \\end{array} \\right)}
    \\\\ \\end{array}$$


    Directed graphs can also be used to visualize a `decision tree` or `neural network`.

