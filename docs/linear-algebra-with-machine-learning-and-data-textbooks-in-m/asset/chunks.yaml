    \ 且均值向量为\n\n$$\\begin{array}{l} {{\\widetilde{\\mu}}_{C_{1}} = \\left( \\begin{array}{ll}\
    \ {- 0.404322} & {- 0.433172} \\\\ {- 0.423223} & {- 0.419999} \\\\ {- 0.468211}\
    \ & {- 0.0258423} \\\\ {- 0.423255} & 0.795089 \\\\ {- 0.508958} & 0.0559352 \\\
    \\ \\end{array} \\right)\\text{~and~}{\\widetilde{\\mu}}_{C_{2}} = \\left( \\\
    begin{array}{ll} {- 0.393657} & 0.00717916 \\\\ {- 0.494921} & {- 0.587535} \\\
    \\ {- 0.433602} & {- 0.161582} \\\\ {- 0.437483} & 0.792504 \\\\ {- 0.469771}\
    \ & 0.0240795 \\\\ \\end{array} \\right).} \\\\ \\end{array}$$\n\n投影到向量 `v` = {0.0001464,−0.01026}\
    \ 生成了 图 3.18。\n\n![图 3.18 将类别投影到 v。](img/fig3_18.jpg)\n\n图 3.18 将类别投影到 `v`。\n\n\
    注意，通过这种投影，这两个类别并没有完全地定义良好且分离；然而，类别之间仍然存在一些明显的区别。\n\n相似的思想也可以应用于手写样本和其他图像识别问题。\n\
    \n与本案例研究相关的 Python 和 R 代码分别可以在 GitHub 链接 20 和 22 中找到。\n\n## 3.9 练习\n\n*   定义具有标准矩阵的变换\
    \ `T[A]`:ℝ²→ℝ²\n\n    $$\\begin{array}{l} {A = \\left( \\begin{array}{ll} 1 &\
    \ 3 \\\\ 2 & 4 \\\\ \\end{array} \\right).} \\\\ \\end{array}$$\n\n    1.  画出标准基向量\
