    \\vdots \\\\ 0 & 0 & 0 & 0 & \\\\ldots & {n(n - 1)} \\\\ 0 & 0 & 0 & 0 & \\\\\
    ldots & 0 \\\\ 0 & 0 & 0 & 0 & \\\\ldots & 0 \\\\\\\\end{array} \\\\right), \\\
    \\left. \\\\\\\\end{array}$$  \n\n以及 `n` × `n` `Hermite differential operator`（米特微分算子）为\n\
    \n$$\\begin{array}{l} \\\\left. \\\\frac{d^{2}}{d^{2}x} - 2x\\\\frac{d}{dx}\\\\\
    rightarrow\\\\left( \\begin{array}{llllll} 0 & 0 & 2 & 0 & \\\\ldots & 0 \\\\\
    \ 0 & {- 2} & 0 & 6 & \\\\ldots & 0 \\\\ 0 & 0 & {- 4} & 0 & \\\\ldots & 0 \\\\\
    \ \\\\ldots & \\\\vdots & \\\\vdots & \\\\vdots & \\\\vdots & \\\\ldots \\\\ 0\
    \ & 0 & 0 & 0 & \\\\ldots & {n(n - 1)} \\\\ 0 & 0 & 0 & 0 & \\\\ldots & 0 \\\\\
    \ 0 & 0 & 0 & 0 & \\\\ldots & {- 2n} \\\\\\\\end{array} \\\\right). \\\\left.\
    \ \\\\\\\\end{array}$$  \n\n如果 `λ[0]` ≥ `λ[1]` ≥ … ≥ `λ[n]` 是 `n` × `n` 阶算子 $\\\
    frac{d^{2}}{d^{2}x} - 2x\\frac{d}{dx}$ 的特征值，对应的特征向量为 `v[0]`、 `v[1]`、 … `v[n]`，那么第\
    \ `k` 次米特多项式的系数对应于特征向量 `v[2*k*]`。\n\n![图 4.3 [-2, 2]上的前 5 个米特多项式。](images/fig4_3.jpg)\n\
    \n图 4.3 [−2, 2] 上的前 5 个米特多项式。\n\n米特多项式也可以使用递归定义生成：\n\n$$\\begin{array}{r} {H\\\
