    $$\begin{array}{r} {p(y\_{i}|\\, x\_{i},\\, a\_{0},\\, a\_{1}) = \frac{1}{\\sqrt{2\pi
    s^{2}}}e^{- \frac{{(y\_{i} - (a\_{0} + a\_{1}x\_{i}))}^{2}}{2s^{2}}}.} \\ \end{array}$$


    Recall that since `Y[1]`, `Y[2]`, …, `Y[n]` are i.i.d. random variables, their
    joint probability distribution, which we will call `L(a[0], a[1])` is


    $$\begin{array}{r} {{\\prod\\limits\_{i = 1}^{n}p}(y\_{i}|\\, x\_{i},\\, a\_{0},\\,
    a\_{1}).} \\ \end{array}}$$


    Before we take the derivative of `L(a[0], a[1])`, in order to find values for
    `a[0]` and `a[1]` that maximize `L(a[0], a[1])`, it is important to note that
    it is often more convenient to work with the **log-likelihood** function, `LL(a[0],
    a[1])`, because you then end up taking derivatives of sums of functions rather
    than products of functions.


    Recall that extremal values, maximums and minimums, can occur at critical points,
    where the derivative of a function is equal to 0.


    $$\begin{aligned} {LL(a\_{0},\\, a\_{1})} & = \log\left( {{\\prod\\limits\_{i
    = 1}^{n}p}(y\_{i}|\\, x\_{i},\\, a\_{0},\\, a\_{1})} \right)} \\ & = {\\sum\\limits\_{i
    = 1}^{n}\\log}(p(y\_{i}|\\, x\_{i},\\, a\_{0},\\, a\_{1}))} \\ & = {\\sum\\limits\_{i
    = 1}^{n}\\log}\left( {\\frac{1}{\\sqrt{2\pi s^{2}}}e^{- \frac{{(y\_{i} - (a\_{0}
    + a\_{1}x\_{i}))}^{2}}{2s^{2}}}} \right) \\ & = n\log\left( \frac{1}{\\sqrt{2\pi
    s^{2}}} \right) - \frac{1}{2s^{2}}{\\sum\\limits\_{i = 1}^{n}}{(y\_{i} - (}}a\_{0}
    + a\_{1}x\_{i}))^{2}} \\ & = - \frac{n\log(2\pi)}{2} - 2n\log(s) - \frac{1}{2s^{2}}{\\sum\\limits\_{i
    = 1}^{n}}{(y\_{i} - (}}a\_{0} + a\_{1}x\_{i}))^{2}.} \\ \end{aligned}$$


    Determining values, `a[0]` and `a[1]`, that maximize `L(a[0], a[1])` is equivalent
    to determining values, `a[0]` and `a[1]`, that maximize `L(a[0], a[1])` since
    `log(x)` is an increasing function.


    $$\begin{array}{r} \frac{\partial LL(a\_{0},a\_{1})}{\partial a\_{1}} = - \frac{1}{s^{2}}{\\sum\\limits\_{i
    = 1}^{n}x\_{i}}(y\_{i} - (a\_{0} + a\_{1}x_{i})) = 0} \\ \end{array}$$


    when


    $$\begin{aligned} a_{1} &= \frac{{\\sum\\limits\_{i = 1}^{n}x\_{i}y\_{i}}}{\\sum\\limits\_{i
    = 1}^{n}x_{i}}} \\ = \frac{{\\sum\\limits\_{i = 1}^{n}(x_{i} - \overline{x})(y_{i}
    - \overline{y})}{\\sum\\limits\_{i = 1}^{n}(x_{i} - \overline{x})^{2}} \\ \end{aligned}$$


    Similarly,


    $$\begin{array}{r} \frac{\partial LL(a\_{0},a\_{1})}{\partial a\_{0}} = - \frac{1}{s^{2}}{\\sum\\limits\_{i
    = 1}^{n}}(y\_{i} - (a\_{0} + a\_{1}x_{i})) = 0} \\ \end{array}$$


    when


    $$a_{0} = \frac{1}{n}{\\sum\\limits\_{i = 1}^{n}y\_{i}} - \frac{a_{1}}{n}{\\sum\\limits\_{i
    = 1}^{n}x_{i}} = \overline{y} - a_{1}\overline{x}.$$


    In matrix form,


    $$\begin{array}{l} \left( \begin{array}{l} a_{0} \\ a_{1} \\end{array} \right)
    = (X^{T}X)^{- 1}X^{T}Y, \\ \end{array}$$


    where


    $$\begin{array}{l} X = \left( \begin{array}{ll} 1 & x_{1} \\ 1 & x_{2} \\ \vdots
    & \vdots \\ 1 & x_{n} \\end{array} \right)\text{and}~Y = \left( \begin{array}{l}
    y_{1} \\ y_{2} \\ \vdots \\ y_{n} \\end{array} \right). \\ \end{array}$$


    A **Poisson regression model**, or log-linear model assumes that the random variables,
    `Y[i]`, are identically distributed Poisson random variables, `Y[i] ~ Poisson(λ)`.


    Since `λ > 0`, we can determine `log(λ)`. We will assume that


    $$\begin{array}{r} log(\lambda) = a_{0} + a_{1}x. \\ \end{array}$$


    $$\begin{aligned} p(y\_{i}|x_{i},a_{0},a_{1}) &= {\\prod\\limits\_{i = 1}^{n}e^{-
    \lambda}}\frac{\lambda^{y_{i}}}{y_{i}!}} \\ LL(a_{0},a_{1}) &= \log\left( {{\\prod\\limits\_{i
    = 1}^{n}e^{- \lambda}}\frac{\lambda^{y_{i}}}{y_{i}!}} \right) \\ & = {\\sum\\limits\_{i
    = 1}^{n} -}\lambda + y_{i} \cdot log(\lambda) - log(y_{i}!)} \\ & = {\\sum\\limits\_{i
    = 1}^{n} -}e^{(a_{0} + a_{1}x_{i})} + y_{i} \cdot (a_{0} + a_{1}x_{i}) - log(y_{i}!).
    \\ \end{aligned}$$


    Taking partial derivatives,


    $$\begin{array}{r} \frac{\partial LL(a\_{0},a\_{1})}{\partial a\_{0}} = {\\sum\\limits\_{i
    = 1}^{n} -}e^{(a_{0} + a_{1}x_{i})} + y_{i} = 0.} \\ \end{array}$$


    Similarly,


    $$\begin{array}{r} \frac{\partial LL(a\_{0},a\_{1})}{\partial a\_{1}} = {\\sum\\limits\_{i
    = 1}^{n} -}x_{i}e^{(a_{0} + a_{1}x_{i})} + x_{i}y_{i}.} \\ \end{array}$$


    In matrix form,


    $$\begin{array}{l} X = \left( \begin{array}{ll} 1 & x_{1} \\ 1 & x_{2} \\ \vdots
    & \vdots \\ 1 & x_{n} \\end{array} \right)\text{and}~Y = \left( \begin{array}{l}
    y_{1} \\ y_{2} \\ \vdots \\ y_{n} \\end{array} \right). \\ \end{array}$$


    $$\begin{array}{l} \left( \begin{array}{l} a_{0} \\ a_{1} \\end{array} \right)
    = (X^{T}X)^{- 1}X^{T}Y, \\ \end{array}$$


    where *W* is the diagonal matrix


    $$\begin{array}{l} W = \left( \begin{array}{llll} e^{(a_{0} + a_{1}x_{1})} & 0
    & \ldots & 0 \\ 0 & e^{(a_{0} + a_{1}x_{2})} & \ldots & 0 \\ \vdots & \vdots &
    \ddots & \vdots \\ 0 & 0 & \ldots & e^{(a_{0} + a_{1}x_{n})} \\end{array} \right),
    \\ \end{array}$$


    Using the Hessian matrix, the *i**th* iterative estimate of *A*, is


    $$\begin{array}{r} A^{(i)} = A^{(i - 1)} - H_{LL}{(A^{(i - 1)})}^{- 1}\nabla LL(A^{(i
    - 1)}).} \\ \end{array}$$

