    # Acknowledgments


    I want to thank the faculty of Elon University and in particular Elon Mathematics
    and Statistics Department for always being on innovative teaching. Many students
    have also contributed to the success of this project through undergraduate research.
    I wish to thank Amy Moore, Abby Weber, Matthew Davenport, Rachel Dietert, Katie
    Everitt, Lauren Hanchar, Mary Hermes, Xuan Huynh, Adam Jockle, Gautam Kotwal,
    Clayton McLamb, Maia Sirabian, Sarina Smith, William Tunis, Ashley Vann, and Parker
    Verlander.


    In addition, I would like to recognize the support for this text from Elon University''s
    Research and Development program.


    # Preface


    This text is meant to be used for a second course in applications of Linear Algebra
    to Data Analytics, with a supplemental chapter on Decision Trees. Throughout the
    text a basic knowledge of a first Linear Algebra course is assumed; however, an
    overview of key concepts is presented here and as needed.


    Knowledge of mathematical techniques related to data analytics, and exposure to
    interpretation of results within a data analytics context, are particularly valuable
    for students studying mathematics. Each chapter of this text takes the reader
    through several case studies using real world data. Some study applications address
    gerrymandering issues, modeling the spread of disease, digital facial recognition,
    and racial inequities in higher education. Readers are encouraged to replicate
    results from the presented case studies.


    The text can be considered in two different but overlapping general data analytics
    categories: clustering and interpolation. [Chapters 1](#chapter1.xhtml) and [3](#chapter3.xhtml)
    focus on eigenvalues and singular values, as well as their associated vectors,
    that are of key importance in clustering techniques, such as Principal Component
    Analysis. [Chapters 4](#chapter4.xhtml) through [6](#chapter6.xhtml) focus on
    techniques specific to interpolation models. Integrated throughout this text,
    the reader will also find many machine learning techniques of interest, such as
    hidden Markov chains in [Chapter 2](#chapter2.xhtml), neural networks in [Chapter
    5](#chapter5.xhtml), decision trees and forests in [Chapter 6](#chapter6.xhtml),
    and random matrices in [Chapter 7](#chapter7.xhtml). Following each chapter is
    a short exercise set in which students are encouraged to use technology to apply
    their expanding knowledge of linear algebra.


    # Introduction


    In this introduction, we give an overview of background expectations. Also, for
    those who are looking to use this book for a first course in Mathematical Methods
    in Data Analytics, an overview of necessary Linear Algebra concepts is presented
    here and embedded throughout the text.


    The entire text is focused on applications of Linear Algebra in Data Analytics,
    so we begin with a quick overview of matrix algebra. Matrix `A` has entry `a[i,
    j]` in row `i` and column `j`.

