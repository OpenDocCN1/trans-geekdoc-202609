    由于奇异值在确定数据方差中的重要性，我们必须确定在模型中包含多少主成分，`p`。实现此点的最佳方法是检查相关矩阵并忽略相关矩阵中的小奇异值，这些值通常显著小于
    1。


    在确定集成了所有 `k` 个因素的最小二乘回归模型时，我们希望确定 `b`，其中


    $$\begin{array}{r} {b = {(X^{T}X)}^{- 1}X^{T}y.} \\\\ \end{array}$$


    为了遵循这一步骤，`X` 必须是一个正交矩阵，因此 `X`^(*T*)*X` 是对角矩阵。


    遗憾的是，大多数数据集是相关的，因此 `X` 不是正交矩阵。这导致大多数数据科学家采用某种变量选择，从而将 `X` 中的 `k` 个相关变量替换为 `p`
    个不相关变量，用一个 `n` × `p` 矩阵 `X̃` 表示。


    主成分回归模型 `ŷ` = `X̃**`b`* 可以通过将使用的主成分减少到 `p` < `k` 来确定，使得 `X̃` = `Ũ` 和


    $$\begin{array}{r} {b = {({\widetilde{X}}^{T}\widetilde{X})}^{- 1}{\widetilde{X}}^{T}y.}
    \\\\ \end{array}$$


    ## 3.6 线性判别分析


    与主成分分析类似，**线性判别分析** (LDA) 用于降维。PCA 侧重于确定主成分轴（即数据方差最大的轴），而线性判别分析还试图最大化数据中簇或类的离散程度。


    需要注意的是，很多情况下 PCA 的数据最初可能没有聚类成类；但在聚类分析（LCA）中，必须最初在数据中识别出类别。


    线性判别分析的思想是选择一种投影，在扩展已知类别的同时，最小化每个类内部的散射程度（或扩散度）。


    假设你在 ℝ² 中有两类数据，并希望将数据投影到一条直线上。如果类别确实是唯一的，那么选择投影的直线在类间离散度方面会产生差异。


    例如，在图 3.9 中，用圆圈和方形表示的两类数据投影到 `x`-轴和直线 `y` = `2x`* 并没有很好地扩展这两类，而投影到直线 `y` = −���*`x`*（见图
    3.10）则完全分离了这两类数据。


    ![图 3.9 投影到 x 轴和直线 y = 2x 的示例。](img/fig3_9.jpg)


    图 3.9 投影到 `x`-轴和直线 `y` = `2x`* 的示例。


    ![图 3.10 投影到直线 y = - x 的示例。](img/fig3_10.jpg)


    图 3.10 投影到直线 `y` = −���*`x`* 的示例。


    假设有 `n` 个类，`C*[1]``C*[2]`、 … `C*[*n]`，其中第 `i`^(th) 类的类的大小为 `N*[i*]`。此外，假设代表对象的每个向量
    `x` 有 `m` 个条目，且投影线由单位向量 `v` 表示。


    那么


    $$\begin{array}{r} {\\text{~projection~of~}x\\text{~onto~}v = \frac{< v,\\, x
    >v}{||v||^{2}}} \\\\ \end{array}$$


    以及 `x` 到原点的距离为


    $$\begin{array}{r} {v^{T}x.} \\\\ \end{array}$$


    定义 `μ̃*[i*]` 为类 `C*[i*]` 中的向量到向量 `v` 投影的平均值。因此


    $$\begin{array}{r} {{\widetilde{\mu}}\_{i} = {\\sum\\limits\_{x \\in C\_{i}}\\frac{v^{T}x}{N\_{i}}}
    = v^{T}{\sum\\limits\_{x \\in C\_{i}}\\frac{x}{N\_{i}}} = v^{T}\mu\_{i},} \\\\
    \end{array}$$


    其中 `μ*[i*]` 是类 `C*[i*]` 中向量的平均值。


    给定两个类 `C*[1]` 和 `C*[2]`，我们希望选择一种投影来最大化


    $$\begin{array}{r} {|\\widetilde{\mu\_{1}} - \\widetilde{\mu\_{2}}|} \\\\ \end{array}$$


    以最大化类别的扩展；然而，这并不能最小化类内部的扩展。线性判别分析的目标是找到一个考虑了这些这些标准的向量 `v`。为了实现这一点，我们将最大化目标函数


    $$\begin{aligned} {J(v)} &= \\frac{{(\\widetilde{\mu\_{1}} - \\widetilde{\mu\_{2}})}^{2}}{{\sum\\limits\_{x
    \\in C\_{1}}v^{T}x - \\widetilde{\mu\_{1}})}^{2}} +\\sum\\limits\_{x \\in C\_{2}}v^{T}x
    - \\widetilde{\mu\_{2}})}^{2}}} &= \\frac{{(v^{T}\\mu_{1} - v^{T}\\mu_{2}})}^{2}}{{\sum\\limits\_{x
    \\in C\_{1}}v^{T}x - \\widetilde{\mu\_{1}})}^{2}} +\\sum\\limits\_{x \\in C\_{2}}v^{T}x
    - \\widetilde{\mu\_{2}})}^{2}.} \\end{aligned}$$


    定义类内散射为


    $$\begin{array}{r} {S\_{W} = {\\sum\\limits\_{i = 1}^{n}{\sum\\limits\_{x \\in
    C\_{i}}{(x - \\mu_{i}){(x - \\mu_{i})}^{T}}}} \\\\ \end{array}$$


    类间散射为


    $$\begin{array}{r} {S\_{B} = (\\mu_{1} - \\mu_{2}){(\mu_{1} - \\mu_{2})}^{T}.}
    \\\\ \end{array}$$


    那么，


    $$\begin{array}{r} {J(v) = \frac{v^{T}S_{B}v}{v^{T}S_{W}}} \\\\ \end{array}$$


    为了最大化 `J(v)`，我们确定 $\frac{\partial J}{\partial v} = 0$。


    $$\begin{array}{r} {\\frac{\partial J}{\partial v} = \\frac{(2S_{B}v)(v^{T}S_{W}v)
    - (2S_{w}v)(v^{T}S_{B}v)}{{(v^{T}S_{W}})^{2}}} = 0} \\\\ \end{array}$$


    当 `C*[B]*v`(`v^{T}`)*`C*[W]*v`)− (`v^{T}`)*`C*[B]*v`)=0 时，上述等式成立。


    也就是说，我们希望找到 `v` 使得


    $$\begin{array}{r} {S_{B}v - \frac{(S_{W}v)(v^{T}S_{B}v)}{v^{T}S_{W}}} = 0.} \\\\
    \end{array}$$


    如果 `C*[W]` 是可逆的且 `\lambda = \frac{(v^{T}S_{B}v)}{v^{T}S_{W}}`，则 `C*[W]^{-1}C*[B]*v=\lambda
    v`，其中 `v` 是矩阵 `C*[W]^{-1}C*[B]` 对应的特征向量，`\lambda` 是特征值。


    由于 `C*[B]` 的定义，思考此问题的另一种方式是：对于任何向量 `v`，`C*[B]*v` 的方向与 `μ*[1]`−`μ*[2]` 相同。因此，我们希望确定
    `v`使得


    $$\begin{array}{r} {v = S_{W}^{-1}(\mu_{1} - \\mu_{2})} \\\\ \end{array}$$


    本节描述的概念可以推广到具有 `n` 个类的数据集。


    1. 找到每个类 `C*[i]`（2 ≤ i ≤ n），找到平均向量，


    $$\mu_{i} = {\\sum\\limits\_{v \\in C_{i}}\\frac{v}{N_{i}}} \\\\ \end{array}$$


    2. 构造类内散射向量 `C*[W]`，其中 `C*[W]` 的条目为


    $$\begin{array}{r} {{\\sum\\limits\_{i = 1}^{n}{\sum\\limits\_{x \\in C\_{i}}{(x
    - \\mu_{i}){(x - \\mu_{i})}^{T}}}}.} \\\\ \end{array}}$$


    3. 构造类间散射矩阵 `C*[B]`，其中 `C*[B]` 的条目为


    $$\begin{array}{r} {{\\sum\\limits\_{i = 1}^{n}N_{i}}(\mu_{i} - \\mu),}} \\\\
    \end{array}}$$


    其中 `μ` 是所有样本的平均值。


    4. 确定 `C*[W]^{-1}C*[B]` 的特征向量 `v`。


    ## 3.7 案例研究：数字人文


    数字人文学者关注语义以及在特定语境下经常使用或使用的词汇。在这个案例研究中，我们将关注故事不同版本中存在或缺失的特征，以确定故事的起源。


    《星丈夫的故事》是美洲原住民部落中广为人知的传说。《星丈夫的故事》的基本形式[45]讲述了两个女孩在晚上露外睡觉的故事。在户外时，她们看到了两颗星星，每个女孩都希望希望能与星星结婚。当她们醒来时，两人都被运送到了天堂，并如所愿与星星结婚。其中一个星丈夫是一个年轻人，另一个是一个老年人。女孩们在一个时刻开始在天堂挖掘并挖了一个洞，最终她们用绳子降到了地面。


