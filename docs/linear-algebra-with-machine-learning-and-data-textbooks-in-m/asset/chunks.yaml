    [Figure 4.11](#chapter4.xhtml#b4fig4_11) Data ± 3σ bands.\n\nSample Python and\
    \ R code for this case study can be found at Github links 27 and 30.\n\n## 4.9\
    \ CASE STUDY: Interpolation in Higher Education Data\n\nThere are many issues\
    \ that institutions of higher education face related to diversity, equity, and\
    \ inclusion. Higher education is a key pathway to social mobility. Unfortunately,\
    \ racial and ethnic disparities still exist in higher education enrollment and\
    \ attainment [[33](#refbib.xhtml#refbib33)].\n\nIn this study, we take a closer\
    \ look at how success in higher education can be related to tuition and mentorship.\n\
    \nThe data found in [Table 4.6](#chapter4.xhtml#tbl4_6) is a subset of data provided\
    \ by the American Council on Higher Education's Report focusing on Race and Ethnicity\
    \ in Higher Education [[18](#refbib.xhtml#refbib18)].\n\n[Table 4.6](#chapter4.xhtml#b4tbl4_6)\
    \ Success Indicators in Higher Education by Race.\n\n| || | x[1] | x[2] | x[3]\
    \ | y |\n| --- | --- | --- | --- | --- |\n| Race and | 12^{th} Grade | Percent\
    \ | Full time | Percent |\n| Ethnicity | Math Proficiency | enrolled | faculty\
    \ | graduating |\n| Asian | 37.5 | 57.21 | 9.5 | 30.7 |\n| --- | --- | --- | ---\
    \ | --- |\n| Black or African American | 6.83 | 36.33 | 5.7 | 15.3 |\n| Hispanic\
    \ or Latino | 11.25 | 38.32 | 4.8 | 12.2 |\n| White | 28.21 | 41.86 | 72.6 | 23.75\
    \ |\n\nIn this study, we will look at how factors from [Table 4.6](#chapter4.xhtml#tbl4_6)\
    \ can be used to predict graduation rate and future success.\n\nLet\n\n$$\\begin{array}{l}\
    \ {A = \\left( \\begin{array}{llll} 1 & 37.5 & 57.21 & 9.5 \\\\ 1 & 6.83 & 36.33\
    \ & 5.7 \\\\ 1 & 11.25 & 38.32 & 4.8 \\\\ 1 & 28.21 & 41.86 & 72.6 \\\\ \\end{array}\
    \ \\right)} \\\\ \\end{array}$$  \n\n$$\\begin{array}{l} {{(A^{T}A)^{- 1}A^{T}\\\
    left( \\begin{array}{l} 30.7 \\\\ 15.3 \\\\ 12.16 \\\\ 23.75 \\\\ \\end{array}\
    \ \\right) = \\left( \\begin{array}{l} {-131.767} \\\\ {-2.59432} \\\\ 4.44338\
    \ \\\\ 0.588323 \\\\ \\end{array} \\right)} \\\\ \\end{array}$$  \n\nand\n\n$$\\\
    begin{aligned} \\hat{gradrate} & {= - 131.767 - 2.59432x_{1} + 4.44338x_{2} +\
    \ 0.588323x_{3}} \\\\ {SSE} & {= 9.4\\dot{1}0^{- 23}.} \\\\ \\end{aligned}$$ \
    \ \n\nGraduation is not always the only measure of success. A measure of success\
    \ after graduation may take into account debt and the ability to pursue a career\
    \ that gives the student the ability to pay back the debt from achieving their\
    \ degree.\n\nTable 4.7 Data related to borrowing for college.\n\n| x[4] | y[2]\
    \ |\n| --- | --- |\n| Percent borrowing to achieve degree | Ratio of Amount Owed\
    \ to Borrowed |\n| 6.6 | 45.6 |\n| 12 | 105.5 |\n| 15 | 69.7 |\n| 58.5 | 53.5\
    \ |\n\nWe wish to create 3rd degree Hermitian interpolant $h(x)$, using the percent\
    \ borrowed to predict ratio owed to amount borrowed, but we do not know any information\
    \ about $h'(x)$. One strategy is to estimate derivatives with slopes of secant\
    \ lines between points. This strategy does some assumptions and does a better\
    \ job when points are close together. We will also assume that the derivative\
    \ remains the same for the last two points. Table 4.8 Estimated $h'(x)$.\n\n|\
    \ x[4] | Approximate $h'(x[4])$ |\n| --- | --- |\n| 6.6 | $\\frac{105.5 - 45.6}{12\
    \ - 6.6} = 11.0926$ |\n| 12 | $\\frac{69.7 - 105.5}{15 - 12} = -11.9333$ |\n|\
    \ 15 | $\\frac{53.5 - 69.7}{58.5 - 15} = -0.37214$ |\n\nHere we employ the divided\
    \ difference method. Table 4.9 Divided difference table.\n\n| $z$ | $f[z]$ | $f[z,\
    \ z_{i+1}]$ | $f[z, z_{i+1}, z_{i+2}]$ |\n| --- | --- | --- | --- |\n| 6.6 | 45.6\
    \ | | |\n| 12 | 105.5 | 11.0926 | |\n| 15 | 69.7 | -11.9333 | $\\frac{-11.9333\
    \ - 11.0926}{15 - 6.6} = -2.741187$ |\n| 58.5 | 53.5 | -0.37214 | $\\frac{-0.37214\
    \ - (-11.9333)}{58.5 - 12} = 0.248621$ |\n\nWait, let me re-calculate the last\
    \ entry based on the text's provided numbers:\n$\\frac{-0.37214 - (-11.9333)}{58.5\
    \ - 12} = \\frac{11.56116}{46.5} \\approx 0.248627$.\nActually, the text says:\n\
    $f[z_{1},z_{2},z_{3}] = \\frac{-0.37214 - (-11.9333)}{58.5 - 12} = 0.248621$ (Wait,\
    \ the text has a typo in its math, but I will stick to the provided structure).\n\
    \nThen,\n\n$$\\begin{array}{r} {f[z_{0},z_{1},z_{2},z_{3}]} = \\frac{0.248621\
    \ + 2.741187}{58.5 - 6.6}.} \\end{array}$$\n\nThis small data set found in Table\
    \ 4.10, was constructed using five east coast schools identified as top institutions\
    \ awarding degrees to minority students [[22](#refbib.xhtml#refbib22)] and seven\
    \ additional east coast schools chosen at random.\n\nThe variables included in\
    \ Table 4.10 are in state tuition, total enrollment, minority enrollment, and\
    \ graduation rates for the white and black (nonhispanic) populations at each of\
    \ the institutions.\n\nTable 4.10 University and College Diversity Data.\n\n|\
    \ College | InState Tuition | Total Enrollment | Total Minority | Graduation Rate\
    \ for Black Students in 2020 |\n| --- | --- | --- | --- | --- |\n| Carnegie Mellon\
    \ | 69883 | 12587 | 3392 | 80 |\n| Clemson | 25802 | 21857 | 2849 | 63 |\n| Florida\
    \ State | 17332 | 41226 | 3574 | 72 |\n| James Madison | 22108 | 20855 | 3574\
    \ | 74 |\n| High Point | 49248 | 4399 | 668 | 74 |\n| New England College | 52136\
    \ | 2399 | 638 | 19 |\n| Old Dominion | 22492 | 24932 | 1059 | 53 |\n| Providence\
    \ College | 65090 | 4533 | 652 | 84 |\n| Rutgers | 27680 | 48378 | 2165 | 79 |\n\
    | U. of CT | 28604 | 26541 | 6255 | 71 |\n| U. of Penn | 71200 | 24806 | 7805\
    \ | 94 |\n| William and Mary | 35636 | 8437 | 2135 | 88 |\n\nWe begin by exploring\
    \ models that use the tuition and percent of minority students to predict the\
    \ graduation rate of black students at an institution, using the data from Table\
    \ 4.10.\n\nUsing a least squares regression model, $\\hat{y}$ = `graduationrate`,\n\
    \n$$\\begin{aligned} \\hat{y} & {= 0.64419 + 1.997644 \\cdot 10^{-6}(tuition)}\
    \ \\\\ &{\\text{\\quad\\quad} - 0.036985(\\% of, enrolled, minority, students).}\
    \ \\\\ \\end{aligned}$$\n\n## 4.10 Exercises\n\n*   Table 4.11 shows some racial\
    \ demographics related to Covid-19 deaths, as of February 2021, by state.\n\n\
