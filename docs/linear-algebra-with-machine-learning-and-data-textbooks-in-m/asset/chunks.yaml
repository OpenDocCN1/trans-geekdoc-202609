  trans: "\n\n基尼纯度（Gini Impurity）的范围从 0 到 1，值越高，决策树节点的非纯度就越高。该指标仅用于衡量分类数据。对于定量或连续数据，必须使用其他指标。\n\
    \n理解基尼纯度的另一种思考方式是：如果 `P` 是一个概率矩阵，当 `i` = `j` 时 `P`[`i`, `j`] = `p`[`i]`，否则 `P`[`i`,\
    \ `j`] = `0`。那么\n\n$$\\\\begin{array}{r} {Gini\\, impurity = Tr(I - P^{2}).} \\\
    \\\\\\ \\end{array}$$\n\n### 6.1.1 决策树回归\n\n典型的线性回归模型通过线性方式分离数据，而决策树模型则用于分离非线性分离的数据。线性分离数据集与非线性分离数据集的可视化对比可以参见图\
    \ 6.7。\n\n在这一节中，我们将重点关注：(1) 作为分类问题的决策树线性回归，以及 (2) 作为回归模型的决策树。之后，我们将简要探讨如何将这些思想与第\
    \ 4 章中探索的内容相结合，以创建更好的模型。\n\n由于决策树线性回归关注的数据通常是线性不可分的，因此所讨论的数学算法本质上是递归的，从树的根开始。\n\
    \n在使用决策树确定聚类或线性回归模型时，留出一组数据作为测试数据集是非常重要的。我们将通过一个与图 6.9 数据相关的示例遵循该递归算法的步骤。\n\n\
    ![图 6.9 决策树分类示例的训练集。](img/fig6_9.jpg)\n\n图 6.9 决策树分类示例的训练集。\n\n我们从一个训练好的决策树开始，其根节点包含我们的整个测试数据集和一个划分特征。\n\
    \n对于如图 6.10 所示的根节点，注意我们首先包含了所有的数据点。在根节点条件（在本例中为 `x`[1] > 2）下，根据根节点条件为真（True）还是假（False）来包含子节点。\n\
    \n![图 6.10 分类示例的决策树示例，使用了图 6.9 中的训练数据。](img/fig6_10.jpg)\n\n图 6.10 分类示例的决策树示例，使用了图\
    \ 6.9 中的训练数据。\n\n在做出第一次决策后，右子节点仅包含来自单一类别的数据。我们称这种节点为**纯节点（pure node）**。注意图 6.9\
    \ 中的右侧第一个子节点不是纯节点。\n\n如果给定一些不在该训练集中的数据，例如 (2, 1) 和 (0.5, 3)，那么我们就可以遵循决策树来决定将这些数据点放在哪个类别中。\n\
    \n由于所有子节点都是纯的，因此 (2, 1)→ ● 和 (0.5, 3) → [此处为阴影符号图形]。\n\n在这个示例中，划分训练数据的条件有很多种选择，我们现在讨论如何最好选择这些条件。\n\
    \n一种方法是使用**贪心算法（greedy algorithm）**，通过暴力穷法考虑各种条件。遗憾的是，这种算法可能仍然无法确定最佳划分，因为一旦确定了根节点的条件，算法就不会返回树上层。\n\
    \n贪心算法的步骤包括：\n\n*   设置一个产生接近 1 的基尼纯度的根节点条件（在上面的示例中，对于 `x`[1] > 2，基尼纯度为 1）\n* \
    \  对于每个可能的划分规则，计算 `IG`，\n\n    $$\\\\begin{array}{r} {Information\\,Gain = Entropy(parent)\
    \ - {\\\\sum\\\\limits\\\\_{i}w_{i}}Entropy(child).} \\\\\\\\ \\end{array}$$\n\
    \n    对于图 6.11 所示的数据，根节点条件为 `x`[1] > 2，子节点条件见表 6.2。\n*   选择一个使信息增益 `IG` 最大化的新条件。\n\
    \n    纯子节点将产生 0 的熵。理想情况下，我们应该选择更小的网格和更多样的条件；然而，在表 6.2 提供的选项中，存在三个纯子节点。\n\n   \
    \ 在表 6.2 给出的选项中，下一个条件的最佳选择是 `x`[1] > 4。\n*   重复步骤 1-3。\n\n    有了新的父节点和条件 `x`[1]\
    \ > 4，关注关注区域\n\n    $$\\\\begin{array}{r} {0 \\leq x_{0} \\leq 4,\\\\, 2} \\end{array}$$\n\
    \n    该父节点的熵为 0.95。\n\n    条件 `x`[1] > 1 和 `x`[1] > 3 的信息增益分别为：\n\n    $$\\begin{aligned}\
    \ &0.95 - \\frac{3}{8} \\left( \\frac{2}{5} \\right) + \\frac{2}{5} \\left( \\\
    frac{3}{8} \\right) \\right) \\cdot \\frac{3}{8} \\\\ &= 0.1378 \\end{aligned}$$\n\
    \n    ![图 6.11 使用训练数据的分类示例决策树示例。](img/fig6_11.jpg)\n\n    图 6.11 使用图 6.9 中训练数据的分类示例决策树示例。\n\
    \n    表 6.2 基于图 6.9 的划分和所得熵增益示例。\n\n    | 条件 || 划分, `S[1]` | `S[1]` 的熵 | `S[2]`\
    \ 的熵 | IG |\n    | --- | --- | --- | --- | --- |\n    | 2 | (3,2), (7,1) | 0.97\
    \ | 0.54 | 0.295 |\n    | 3 | (6,3), (4,0) | 0.92 | 0.76 | 0.22 |\n    | 4 | (8,3),\
    \ (2,0) | 0.85 | 0.28 | 0.28 |\n    | 5 | (5,3), (5,0) | 0.95 | 0.41 | 0.41 |\n\
    \n    一种专注于单个变量 `x`[`i]` 并与阈值 `b` 进行比较的决策树（如 `x`[0] > 4 或 `x`[1] > 2）被称为**单变量决策树（univariate\
    \ decision tree）**。\n\n    一种基于变量或属性的线性组合约束并与阈值 `b` 进行比较的决策树（如 2*x`[0] + 4*x`[1]\
    \ > 6 和 $\\frac{7}{4}x_{0} - x_{1} > 8$）被称为**斜向决策树（oblique decision tree）**。\n\
    \n    斜向决策树具有以下形式的约束：\n\n$$\\\\begin{array}{r} {Ax > b.} \\\\\\\\ \\end{array}$$\n\
    \n    直为止，我们的决策树示例都关注分类或分类。相似的技术也可以用于回归目的。当我们为了回归目的使用这些算法时，可以将回归问题设想为分类问题，或者结合决策树和线性回归技术。\n\
    \n    示例 6.9 展示了如何将回归问题转换为分类问题以便使用决策树算法。\n\n### 6.2 回归树\n\n在上一节中，决策树用于预测分类或离散结果的依赖值。**回归树（regression\
    \ tree）**使用相似的技术来预测可能取连续值的依赖值。\n\n在回归树中，我们以与决策树相同的方式对领域创建节点约束，创建子集。一旦创建了这些子集，就会在每个子集中创建一个回归模型。\n\
    \n常见的做法是让 `ŷ` 等于子集内结果的平均值。正如我们通过示例开始讨论分类一样，我们对回归也是这样做的。\n\n"
- fmt: '

    It may seem best to create such small partitions that each partition contains
    exactly one training point; however, this can lead to larger errors in your model.
    We call this issue `overfitting`.


    If we validate a model, to see how well it does, with the entire data set, and
    realize that there is an overfitting mistake, then `pruning` the tree will be
    required. This requires eliminating some of the leaf layers in order to allow
    for less constraints related to partitioning the data.


    In [Example 6.10](#chapter6.xhtml#exam6_10), constant functions were used to create
    a model within each subset of the domain; however, you might note that a linear
    function or other function fits the data better. In this case, shown in [Example
    6.11](#chapter6.xhtml#exam6_11), subsets of the domain can still be determined
    in order to develop a decision tree; however, within these subdomains other regression
    techniques, such as those presented in [Chapters 4](#chapter4.xhtml) and [5](#chapter5.xhtml),
    may be employed.


    ![Figure 6.18 An Example of a Regression Tree Model for Poverty Rates in the U.S.
    (2001–2020) \[32\].](images/fig6_18.jpg)


    [Figure 6.18](#chapter6.xhtml#b6fig6_18) An Example of a Regression Tree Model
    for Poverty Rates in the U.S. (2001–2020) \[[32](#refbib.xhtml#refbib32)\].


    ## 6.3 Random Decision Trees and Forests


    Data scientists tend to be less interested in a single experiment that generates
    data and more interested in a model for a family of experiments of data. These
    families are called `ensembles`. In this section, we will take a look at ensembles
    of decision trees.


    A `random forest` is a classification algorithm consisting of several decision
    trees. In data analytics, a random forest consists of choosing random samples
    of data, training sets, from a larger data set, in order to create a decision
    tree, each tree produces an outcome, and a final outcome is determined based on
    majority voting. This technique is a type of `bagging` technique.


    So for example let''s say that you choose four random training sets, with replacement,
    and create a decision tree to classify the data into one of four class as seen
    in [Figure 6.19](#chapter6.xhtml#fig6_19). Given data, not within the training
    set, these decision trees can be used to place the data into classes, where the
    final classification can be made based on a majority rules decision. An additional
    example of random forest implementation can be see in the Case Study in [Section
    6.5](#chapter6.xhtml#sec6_5).


    ![Figure 6.19 Example Random Forest.](images/fig6_19.jpg)


    [Figure 6.19](#chapter6.xhtml#b6fig6_19) Example Random Forest.


    ## 6.4 CASE STUDY: Entropy of Wordle


    The goal of Wordle is to come up with a secret five letter word within six guesses.
    Whether your game of the day is Wordle, Quordle, or even Octordle, you may have
    a go to word or set of words as part of a personal strategy to find the word.

