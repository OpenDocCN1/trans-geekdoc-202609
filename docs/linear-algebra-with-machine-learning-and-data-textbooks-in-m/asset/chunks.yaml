- fmt: "\nWe will apply the concepts of eigenvalues and eigenvectors to another matrix\
    \ that is important in data science, the **Laplacian matrix**. The Laplacian matrix,\
    \ `L`, affiliated with an `n` × `n` adjacency matrix, `A`, is defined such that\n\
    \n$$\\\\begin{array}{l} {L_{ij} = \\left\\{ \\begin{array}{ll} d_{i} & {\\text{if~}i\
    \ = j,} \\\\\\\\ {- A_{ij}} & {\\text{if~}i \\neq j,} \\\\\\\\ \\end{array}~ \\\
    right.} \\\\\\\\ \\end{array}$$  \n\nwhere `d[i]` is the degree of vertex `i`.\n\
    \nThe **normalized Laplacian matrix**, ℒ, is defined as ℒ =℄`T L T` such that\
    \ `T` is a diagonal matrix with $T_{ii} = \\frac{1}{\\sqrt{d_{i}}}$.\n\nThe Laplacian\
    \ matrix for simple weighted graphs is very similar to unweighted graphs. In a\
    \ weighted graph, the entries of the adjacency matrix\n\n$$\\\\begin{array}{l}\
    \ {A_{ij} = \\left\\{ \\begin{array}{ll} w_{ij} & {\\text{when~vertex~}i\\text{~and~j\\\
    text{~are~adjacent}} \\\\\\\\ 0 & \\text{otherwise} \\\\\\\\ \\end{array}~ \\\
    right.} \\\\\\\\ \\end{array}$$  \n\nwhere `w[i j]` is the weight of the edge\
    \ that is incident to vertices `i` and `j`. The degree of vertex `i`, `d[i]`  = ∑`w[i\
    \ j]`.\n\nUnlike the Laplacian matrices described thus far, the Laplacian matrix\
    \ for a simple directed graph would not be a symmetric matrix. With this in mind,\
    \ `d[i]` is equal to the outdegree of the vertex.\n\nThe Laplacian matrix has\
    \ significant applications in **spectral graph theory**.\n\nSpectral graph theory\
    \ is related to clustering and ranking of vertices based on the study of eigenvalues\
    \ and eigenvectors of the Laplacian matrix. We will focus our attention here on\
    \ simple connected undirected graphs and their symmetric adjacency matrix counterparts.\n\
    \nThe Laplacian matrix, `L`, associated with graph `G` will have `n` eigenvalues,\
    \ `λ[1]`  ≤ `λ[2]`  ≤ …  `λ[n]`. The eigenvectors associated with `λ[i]`  = 0\
    \ are the indicators of the graph's connected components.\n\nThe second smallest\
    \ eigenvalue, `λ[2]`, is called the **algebraic connectivity of the graph** or\
    \ the **Fiedler value** [[12](#refbib.xhtml#refbib12)], denoted `a(G)`, and the\
    \ corresponding eigenvector is called the **characteristic valuation** or **Fiedler\
    \ vector**.\n\nThe Fiedler value represents the algebraic connectivity of the\
    \ graph associated with the adjacency matrix. Note that `a(G)`  > 0 if and only\
    \ if `G` is connected, and the further the Fiedler value is from 0 the more connected\
    \ the graph is.\n\nNotice, in [Figure 1.14](#chapter1.xhtml#fig1_14), that the\
    \ top graph is disconnected with two components and thus the Laplacian has an\
    \ eigenvalue of zero multiplicity 2. A graph that is connected will have a Laplacian\
    \ with an eigenvalue equal to zero of multiplicity 1, as seen in all the the top\
    \ graph in [Figure 1.14](#chapter1.xhtml#fig1_14). As the graphs in [Figure 1.14](#chapter1.xhtml#fig1_14)\
    \ get more connected, the Fiedler value increases.\n\n![Figure 1.14 Examples of\
    \ Graphs, their Laplacian, and Eigenvalues.](images/fig1_14.jpg)\n\n[Figure 1.14](#chapter1.xhtml#b1fig1_14)\
    \ Examples of Graphs, their Laplacian, and Eigenvalues.\n\nIt is also interesting\
    \ to notice that a **complete graph** of `n` vertices, `K[n]`, will have Laplacian\
    \ with an eigenvalue equal to `n` multiplicity `n`  − 1 and an eigenvalue equal\
    \ to 0 multiplicity 1. The Fiedler value and vector of the normalized Laplacian\
    \ matrix can be interpreted in a similar manner to that of the Laplacian matrix.\n\
    \nIf one wishes to partition an undirected graph into two subgraphs, the Fiedler\
    \ theorem defines a way to do so while minimizing the number of edges cut when\
    \ doing so.\n\nThe `i`^(th) value in the Fiedler vector is called the **valuation**\
    \ of vertex `i` in graph `G`.\n\nIn application, the Fiedler vector is particularly\
    \ helpful in clustering data that is related to a weighted simple graph. Note\
    \ that the adjacency matrix must be symmetric in order to apply this partitioning.\n\
    \nThere are spectral clustering techniques that can be applied to non-symmetric\
    \ Laplacian matrices such as that corresponding to the directed graph in [Example\
    \ 1.9](#chapter1.xhtml#exam1_9). These techniques will be explored further in\
    \ [Chapter 2](#chapter2.xhtml).\n\nOne technique is to use a symmetric matrix,\
    \ such as the **Gramian matrix** `S`  = `A A^T` or `A`  + `A^T`, instead of the\
    \ original adjacency matrix and the Laplacian matrix affiliated with that symmetric\
    \ matrix.\n\nWe can use similar techniques when trying to cluster weighted and\
    \ directed graphs.\n\nSo why does the Fiedler vector work in clustering data into\
    \ subgroups? We take a moment here to explore the theory behind this. A **quadratic\
    \ form** of a symmetric matrix `A` is a function on ℝ(`n`) where `Q[A](x)`  = `x^T\
    \ A`, or\n\n$$\\\\begin{array}{r} {Q_{A}(x_{1},x_{2},\\ldots,x_{n}) = {\\sum\\\
    limits_{i \\\\leq j}a_{ij}}x_{j}.} \\\\\\\\ \\end{array}$$\n\nA real symmetric\
    \ n×n matrix, `A` is called\n\n1. **Positive definite** if `x^T A > 0` for all\
    \ `x`∈ℝ(`n`),\n2. **Positive semidefinite** if `x^T A ≥ 0` for all `x`∈ℝ(`n`),\n\
    3. **Negative definite** if `x^T A < 0` for all `x`∈ℝ(`n`),\n4. **Negative semidefinite**\
    \ if `x^T A ≤ 0` for all `x`∈ℝ(`n`).\n\nThe Laplacian matrix, `L`, associated\
    \ with non-negative (real) symmetric matrix is real positive semidefinite matrix\
    \ and thus has non-negative eigenvalues. In addition, `Le=0`, where `e=1` and\
    \ since `G` is connected, `e` is the only solution to `x^TL=0`.\n\nUnder the fixed\
    \ point characterization of eigenvalues, `Ax=λx`, if `|λ| < 1`,\n\n$$\\\\begin{array}{r}\
    \ {lim_{k\\\\rightarrow\\infty}A^{k}x = lim_{k\\\\rightarrow\\infty}\\\\lambda^{k}x\
    \ = \\overset{\\rightarrow}{0}.} \\\\\\\\ \\end{array}$$\n\nIn application, `λ=1`\
    \ is of particular interest as `Ax=x` the values of the corresponding eigenvector,\
    \ `x`, remain fixed when multiplied by the matrix `A`. Similarly, if `|λ|=1`,\
    \ there exists a positive integer `k` such that\n\n$$\\\\begin{array}{r} {A^{k}x\
    \ = x} \\\\\\\\ \\end{array}$$\n\nand thus the values of `x` remain fixed when\
    \ multiplied by the matrix `A^k`. We call the eigenvector, `x`, the **steady state\
    \ vector**.\n\nSpectral clustering is dependent on the **Spectral Theorem** and\
    \ another characterization of eigenvalues, the optimization characterization.\n\
    \nThe optimization characterization of eigenvalues looks at **Rayleigh Quotient**\n\
    \n$$\\\\begin{array}{r} {R(x) = \\frac{x^{T}Ax}{x^{T}x}.} \\\\\\\\ \\end{array}$$\n\
    \nFrom [Theorem 4](#chapter1.xhtml#theo1_4), we can conclude that `λ[1]` minimizes\
    \ `R(x)` and `λ[n]` maximizes `R(x)`.\n\nFor the n×n Laplacian matrix, `L`, of\
    \ a connected graph, `G`, with eigenvalues 0=`λ[1]`  < `λ[2]`  ≤ …  `λ[n]`,\n\n\
    $$\\\\begin{array}{r} {\\\\lambda_{2} = a(G) = min_{x \\\\neq 0,||x|| = 1,x\\\\\
    bot e}\\\\frac{x^{T}Lx}{x^{T}x}.} \\\\\\\\ \\end{array}$$\n\nNow if the main goal\
    \ is to partition the vertices in a graph, `G`, into two subsets, `G[1]` and `G[2]`,\
    \ one might wish to do this without cutting through a large number of edges of\
    \ the graph. We will measure how well we do this by defining the subset of vertices\
    \ `V[1]` and the boundary of `V[1]`,\n\n$$\\\\begin{array}{r} {\\\\partial(V_{1})\
    \ = \\left\\{ (v_{1},\\\\, v_{2}),\\\\, v_{1} \\\\in V_{1},\\\\, v_{2} \\\\in\
    \ V\\\\backslash V_{2} \\\\right.} \\\\\\\\ \\end{array}$$\n\nThe **isoperimetric\
    \ ratio** [2,3] of `V[1]`, `θ(V[1])`, is defined as\n\n$$\\\\begin{array}{r} {\\\
    \\theta(V_{1}) = \\frac{|\\\\partial(V_{1})|}{|V_{1}|}.} \\\\\\\\ \\end{array}$$\n\
    \nThe **isoperimetric number** of a graph, `θ[G]`, is the minimum isoperimetric\
    \ ratio over all sets of at most half of the vertices. That is\n\n$$\\\\begin{array}{r}\
    \ {\\\\theta_{G} = \\min_{|V_{1}| \\\\leq \\\\frac{|V|}{2}}\\\\frac{|\\\\partial(V_{1})|}{|V_{1}||V_{2}|}.}\
    \ \\\\\\\\ \\end{array}$$\n\n## 1.4 CASE STUDY: Applications in Sport Ranking\n\
    \nThere are several ways to incorporate the score differential of games into a\
    \ sports ranking. We explore a few of these here.\n"
  raw: "We will apply the concepts of eigenvalues and eigenvectors to another matrix\
    \ that is important in data science, the **Laplacian matrix**. The Laplacian matrix,\
    \ *L*, affiliated with an *n* × *n* adjacency matrix, *A*, is defined such that\n\
    \n$$\\\\begin{array}{l} {L\\_{ij} = \\\\left\\\\{ \\\\begin{array}{ll} d\\_{i}\
    \ & {\\\\text{if~}i = j,} \\\\\\\\ {- A\\_{ij}} & {\\\\text{if~}i \\\\neq j,}\
    \ \\\\\\\\ \\\\end{array}~ \\\\right.} \\\\\\\\ \\\\end{array}$$  \n\nwhere *d*[*i*]\
    \ is the degree of vertex *i*.\n\nThe **normalized Laplacian matrix**, ℒ, is defined\
    \ as ℒ = *T**L**T* such that *T* is a diagonal matrix with $T\\_{ii} = \\\\frac{1}{\\\
    \\sqrt{d\\_{i}}}$.\n\nThe Laplacian matrix for simple weighted graphs is very\
    \ similar to unweighted graphs. In a weighted graph, the entries of the adjacency\
    \ matrix\n\n$$\\\\begin{array}{l} {A\\_{ij} = \\\\left\\\\{ \\\\begin{array}{ll}\
    \ w\\_{ij} & {\\\\text{when~vertex~}i\\\\text{~and~}j\\\\text{~are~adjacent}}\
    \ \\\\\\\\ 0 & \\\\text{otherwise} \\\\\\\\ \\\\end{array}~ \\\\right.} \\\\\\\
    \\ \\\\end{array}$$  \n\nwhere *w*[*i**j*] is the weight of the edge that is incident\
    \ to vertices *i* and *j*. The degree of vertex *i*, *d*[*i*] = ∑*w*[*i**j*].\n\
    \nUnlike the Laplacian matrices described thus far, the Laplacian matrix for a\
    \ simple directed graph would not be a symmetric matrix. With this in mind, *d*[*i*]\
    \ is equal to the outdegree of the vertex.\n\nThe Laplacian matrix has significant\
    \ applications in **spectral graph theory**.\n\nSpectral graph theory is related\
    \ to clustering and ranking of vertices based on the study of eigenvalues and\
    \ eigenvectors of the Laplacian matrix. We will focus our attention here on simple\
    \ connected undirected graphs and their symmetric adjacency matrix counterparts.\n\
    \nThe Laplacian matrix, *L*, associated with graph *G* will have *n* eigenvalues,\
    \ *λ*[1] ≤ *λ*[2] ≤ … ≤ *λ*[*n*]. The eigenvectors associated with *λ*[*i*] = 0\
    \ are the indicators of the graph's connected components.\n\nThe second smallest\
    \ eigenvalue, *λ*[2], is called the **algebraic connectivity of the graph** or\
    \ the **Fiedler value** \\[[12](#refbib.xhtml#refbib12)\\], denoted *a*(*G*),\
    \ and the corresponding eigenvector is called the **characteristic valuation**\
    \ or **Fiedler vector**.\n\nThe Fiedler value represents the algebraic connectivity\
    \ of the graph associated with the adjacency matrix. Note that *a*(*G*) > 0 if\
    \ and only if *G* is connected, and the further the Fiedler value is from 0 the\
    \ more connected the graph is.\n\nNotice, in [Figure 1.14](#chapter1.xhtml#fig1_14),\
    \ that the top graph is disconnected with two components and thus the Laplacian\
    \ has an eigenvalue of zero multiplicity 2. A graph that is connected will have\
    \ a Laplacian with an eigenvalue equal to zero of multiplicity 1, as seen in all\
    \ but the top graph in [Figure 1.14](#chapter1.xhtml#fig1_14). As the graphs in\
    \ [Figure 1.14](#chapter1.xhtml#fig1_14) get more connected, the Fiedler value\
    \ increases.\n\n![Figure 1.14 Examples of Graphs, their Laplacian, and Eigenvalues.](images/fig1_14.jpg)\n\
    \n[Figure 1.14](#chapter1.xhtml#b1fig1_14) Examples of Graphs, their Laplacian,\
    \ and Eigenvalues.\n\nIt is also interesting to notice that a **complete graph**\
    \ of *n* vertices, *K*[*n*], will have Laplacian with an eigenvalue equal to *n*\
    \ multiplicity *n* − 1 and an eigenvalue equal to 0 multiplicity 1. The Fiedler\
    \ value and vector of the normalized Laplacian matrix can be interpreted in a\
    \ similar manner to that of the Laplacian matrix.\n\nIf one wishes to partition\
    \ an undirected graph into two subgraphs, the Fiedler theorem defines a way to\
    \ do so while minimizing the number of edges cut when doing so.\n\nThe *i*^(th)\
    \ value in the Fiedler vector is called the **valuation** of vertex *i* in graph\
    \ *G*.\n\nIn application, the Fiedler vector is particularly helpful in clustering\
    \ data that is related to a weighted simple graph. Note that the adjacency matrix\
    \ must be symmetric in order to apply this partitioning.\n\nThere are spectral\
    \ clustering techniques that can be applied to non-symmetric Laplacian matrices\
    \ such as that corresponding to the directed graph in [Example 1.9](#chapter1.xhtml#exam1_9).\
    \ These techniques will be explored further in [Chapter 2](#chapter2.xhtml).\n\
    \nOne technique is to use a symmetric matrix, such as the **Gramian matrix** *S* = *A**A*^(*T*)\
    \ or *A* + *A*^(*T*), instead of the original adjacency matrix and the Laplacian\
    \ matrix affiliated with that symmetric matrix.\n\nWe can use similar techniques\
    \ when trying to cluster weighted and directed graphs.\n\nSo why does the Fiedler\
    \ vector work in clustering data into two subgroups? We take a moment here to\
    \ explore the theory behind this concept.\n\nA **quadratic form** of a symmetric\
    \ matrix *A* is a function on ℝ^(*n*) where *Q*[*A*](*x*) = *x*^(*T*)*A**x*, or\n\
    \n$$\\\\begin{array}{r} {Q\\_{A}(x\\_{1},x\\_{2},x\\_{3},\\\\ldots,x\\_{n}) =\
    \ {\\\\sum\\\\limits\\_{i \\\\leq j}a\\_{ij}}x\\_{i}x\\_{j}.} \\\\\\\\ \\\\end{array}$$\
    \  \n\nA real symmetric *n* × *n* matrix, *A* is called\n\n1.  **Positive definite**\
    \ if *x*^(*T*)*A**x* > 0 for all *x* ∈ ℝ^(*n*),\n\n2.  **Positive semidefinite**\
    \ if *x*^(*T*)*A**x* ≥ 0 for all *x* ∈ ℝ^(*n*),\n\n3.  **Negative definite** if\
    \ *x*^(*T*)*A**x* < 0 for all *x* ∈ ℝ^(*n*),\n\n4.  **Negative semidefinite**\
    \ if *x*^(*T*)*A**x* ≤ 0 for all *x* ∈ ℝ^(*n*).\n\nThe Laplacian matrix, *L*,\
    \ associated with a non-negative (real) symmetric matrix is a real positive semidefinite\
    \ matrix and thus has all non-negative eigenvalues. In addition, *L*.*e* = 0,\
    \ where $e = \\\\overset{\\\\rightarrow}{1}$ and since *G* is connected, *e* is\
    \ the only solution to *x*^(*T*)*L**x* = 0.\n\nUnder the fixed point characterization\
    \ of eigenvalues, *A**x* = *λ**x*, if |*λ*| < 1,\n\n$$\\\\begin{array}{r} {lim\\\
    _{k\\\\rightarrow\\\\infty}A^{k}x = lim\\_{k\\\\rightarrow\\\\infty}\\\\lambda^{k}x\
    \ = \\\\overset{\\\\rightarrow}{0}.} \\\\\\\\ \\\\end{array}$$  \n\nIn application,\
    \ *λ* = 1 is of particular interest as *A**x* = *x* the values of the corresponding\
    \ eigenvector, *x*, remain fixed when multiplied by the matrix *A*. Similarly,\
    \ if |*λ*| = 1, there exists a positive integer *k* such that\n\n$$\\\\begin{array}{r}\
    \ {A^{k}x = x} \\\\\\\\ \\\\end{array}$$  \n\nand thus the values of *x* remain\
    \ fixed when multiplied by the matrix *A*^(*k*). We call the eigenvector, *x*,\
    \ the **steady state vector**.\n\nSpectral clustering is dependent on the **Spectral\
    \ Theorem** and another characterization of eigenvalues, the optimization characterization.\n\
    \nThe optimization characterization of eigenvalues looks at the **Rayleigh Quotient**\n\
    \n$$\\\\begin{array}{r} {R(x) = \\\\frac{x^{T}Ax}{x^{T}x}.} \\\\\\\\ \\\\end{array}$$\
    \  \n\nFrom [Theorem 4](#chapter1.xhtml#theo1_4), we can conclude that *λ*[1]\
    \ minimizes *R*(*x*) and *λ*[*n*] maximizes *R*(*x*).\n\nFor the *n* × *n* Laplacian\
    \ matrix, *L*, of a connected graph, *G*, with eigenvalues 0 = *λ*[1] < *λ*[2] ≤ … ≤ *λ*[*n*],\n\
    \n$$\\\\begin{array}{r} {\\\\lambda\\_{2} = a(G) = min\\_{x \\\\neq 0,||x|| =\
    \ 1,x\\\\bot e}\\\\frac{x^{T}Lx}{x^{T}x}.} \\\\\\\\ \\\\end{array}$$  \n\nNow\
    \ if the main goal is to partition the vertices in a graph, *G*, into two subsets,\
    \ *G*[1] and *G*[2], one might wish to do this without cutting through a large\
    \ number of edges of the graph. We will measure how well we do this by defining\
    \ the subset of vertices *V*[1] and the boundary of *V*[1],\n\n$$\\\\begin{array}{r}\
    \ {\\\\partial(V\\_{1}) = \\\\left\\\\{ (v\\_{1},\\\\, v\\_{2}),\\\\, v\\_{1}\
    \ \\\\in V\\_{1},\\\\, v\\_{2} \\\\in V\\\\backslash V\\_{2} \\\\right\\\\}.}\
    \ \\\\\\\\ \\\\end{array}$$  \n\nThe **isoperimetric ratio** \\[2,3\\] of *V*[1],\
    \ *θ*(*V*[1]), is defined as\n\n$$\\\\begin{array}{r} {\\\\theta(V\\_{1}) = \\\
    \\frac{|\\\\partial(V\\_{1})|}{|V\\_{1}|}.} \\\\\\\\ \\\\end{array}$$  \n\nThe\
    \ **isoperimetric number** of a graph, *θ*[*G*], is the minimum isoperimetric\
    \ ratio over all sets of at most half of the vertices. That is\n\n$$\\\\begin{array}{r}\
    \ {\\\\theta\\_{G} = \\\\min\\_{|V\\_{1}| \\\\leq \\\\frac{|V|}{2}}\\\\frac{|\\\
    \\partial(V\\_{1})|}{|V\\_{1}||V\\_{2}|}.} \\\\\\\\ \\\\end{array}$$  \n\n## 1.4 CASE\
    \ STUDY: Applications in Sport Ranking\n\nThere are several ways to incorporate\
    \ the score differential of games into a sports ranking. We explore a few of these\
    \ here."
