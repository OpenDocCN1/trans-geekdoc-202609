    & 0 & 0 \\\\ 0 & 0.36 & 0.21 & 0.21 & 0.50 & 0.29 & 0.07 & 0..6.  .46   \\ \\
    \\ \\ \\end{array} \\right)} \\ \\end{array}$$ 对于这项小型研究，我们假设转移矩阵中的词就是简·奥斯汀作品中所有的词。用于创建奥斯汀作品所有词对数据库的
