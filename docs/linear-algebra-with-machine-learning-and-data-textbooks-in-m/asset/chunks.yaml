  trans: "\n\n许多情况下，物种识别技术需要捕获和释放。一种性较小的物种识别技术是记录物种（在本例中为鸟类）的鸣声并寻找相似之处。在这个案例研究中，我们获得了来自\
    \ Github 链接 43 的几段鸟鸣数据，以便开发一个用于鸟类物种分类的模型。特别是，我们希望在斯里兰的其他鸟鸣中，识别出斯里兰丛丛鸡（斯里兰的国鸟）的鸣声。更大的鸟鸣声数据库可以在\
    \ [[43]] 中找到。\n\n需要注意的是，在现实中，这类类型的数据可能包含来自鸟类鸣叫周期中非常不同时间的数据块。因此，一只鸟的叫声可能只是另一只鸟的翻译版本。此外，某些鸟可能距离更近或叫声更大，因此鸣声的尺度在物种识别中可能并不显著。\n\
    \n更重要的观察指标可能是鸣声中存在的主频。在这个案例研究中，我们将讨论如何将此类数据转换到频域以进行此类分析。\n\n给定离散数据集 `y[1]`, `y[2]`,\
    \ ..., `y[n]`，**离散傅里叶变换**定义为\n\n$$\\begin{array}{r} {F_{k} = {\\sum\\limits_{j\
    \ = 1}^{n - 1}y_{j}}e^{\\frac{- 2\\pi i}{n}kj}.} \\\\\\\\ \\end{array}}$$  \n\n\
    图 6.24 显示了几段斯里兰丛鸡鸣声的频率分布。关于傅里叶分析的更多信息，请参见 [[28]]。\n\n![图 6.23 两只不同斯里兰丛鸡声波可视化。](img/fig6_23.jpg)\n\
    \n图 6.23 两只不同斯里兰丛鸡声波可视化。\n\n![图 6.24 来自图 23 的斯里兰丛鸡鸣声频率可视化。](img/fig6_24.jpg)\n\
    \n图 6.24 来自 23 的斯里兰丛鸡鸣声频率可视化。\n\n基于此，人们可能想研究峰值频率、峰值频率之间的宽度或其他特征。如果 `p[1]` 和 `p[2]`\
    \ 是以 K 为单位的在鸣声中出现频率最高的两个频率，图 6.25 显示了 `p[1]` 与 `p[1]` 和 `p[2]` 之间绝对相对增量的关系。\n\n\
    ![图 6.25 不同训练集的四种结果可视化，丛鸡用 ∘ 表示。](img/fig6_25.jpg)\n\n图 6.25 不同训练集的四种结果可视化，丛鸡用\
    \ ∘ 表示。\n\n$$\\begin{array}{r} {\\left| \\frac{p_{1} - p_{2}}{p_{1}} \\right|.}\\\
    \\ \\end{array}}$$  \n\n图 6.25 中的虚线可以被视为决策树的准则。根据这些信息，峰值频率为 20K 且绝对增量为 9Hz 的鸟鸣将被识别为斯里兰丛鸡，而峰值频率为\
    \ 25K 且绝对增量为 30Hz 的鸟鸣则不会被识别为斯里兰丛鸡。Github 链接 38 和 40 提供了此案例的 Python 和 R 代码。\n\n\
    ## 6.6 练习\n\n*   给定图 6.26 中的数据和根条件 `x > 0`，\n    1. 计算根准则 `x > 0` 的熵和信息增益。\n \
    \   2. 确定一个可以创建子节点的根条件。\n    3. 创建一个决策树，在根条件 `x > 0` 的情况下使每个阶段的信息增益最大化。\n*   表\
    \ 6.6 中的 Spotify 训练数据显示了几首歌的响度和声学因素。使用示例 6.10 中介绍的技术来确定回归树。\n\n*   表 6.7 显示了基于病因负担的疾病数据库训练数据集\
    \ [[41]]。\n\n| 国家 | 年份 | 自残 | 物质滥用障碍 | 人际暴力 |\n| :--- | :--- | :--- | :--- | :---\
    \ |\n| 斯里兰卡 | 2019 | 3.47 | 1.091 | 0.87 |\n\n1. 创建一个回归树来建立人际暴力与自残的模型。\n2. 如果将自残分为三个类别：类别\
    \ 1（低）、类别 2（中）和类别 3（高），创建一个决策树。\n3. 使用图 b 进行分类。\n4. 使用图 c 进行预测。\n5. 讨论使用 Github\
    \ 链接 5 中的数据集随机森林可能更好。\n\n## 7 随机矩阵简介\n\n到目前为止，我们使用固定值的矩阵来模拟场景。在这里我们将探索元素随机定的矩阵。例如，一个具有标准正态分布\
    \ `N(0,1)` 随机分布元素的 3x3 矩阵 `X` 是一个**随机矩阵**。\n\n```\nX = \\begin{pmatrix} 0.290226\
    \ & 0.91635 & 0.099847 \\\\ 0.882873 & -0.615393 & -0.902417 \\\\ -0.097429 &\
    \ 0.855375 & -0.665516 \\end{pmatrix}\n```\n\n矩阵 `X` 不是对称的；但像 `XX^T` 和 `X + X^T`\
    \ 这样的矩阵总是对称的且具有实特征值。如果 $1 \\le i \\le j \\le n$ 的元素 `m[i,j]` 是独立同分布的则 $n \\times\
    \ n$ 矩阵 `M` 称为**维矩阵（Wigner matrix）**。\n\n在本节中，我们将关注元素来自高斯分布的随机矩阵，\n\n$$\\begin{array}{l}\
    \ {X = \\left( \\begin{array}{lllll} X_{1,1} & X_{1,2} & X_{1,3} & \\ldots & X_{1,n}\
    \ \\\\ X_{2,1} & X_{2,2} & X_{2,3} & \\ldots & X_{2,n} \\\\ X_{3,1} & X_{3,2}\
    \ & X_{3,3} & \\ldots & X_{3,n} \\\\ \\vdots & \\ddots & \\ddots & \\ddots & \\\
    vdots \\\\ X_{m,1} & X_{m,2} & X_{m,3} & \\ldots & X_{m,n} \\end{array} \\right),}\
    \ \\\\\\\\ \\end{array}$$\n\n其中 $X[i,j] \\sim N(\\mu, \\sigma²)$ 是独立同分布的，$1 \\\
    le i \\le m, 1 \\le j \\le n$。\n\n"
- fmt: "\nTypically, random matrices of importance in application fall into three\
    \ general categories based on whether their entries are real, complex, or quaternionic\
    \ random variables. In this chapter, we will be focusing on these three types\
    \ of random matrices and the behavior of their eigenvalues.\n\nBefore taking a\
    \ deep dive into these three families of random matrices, we will explore the\
    \ effects of randomness on the stability of algorithms in linear algebra.\n\n\
    ## 7.2 Stability\n\nWe have learned that, in linear algebra, if a matrix `A` is\
    \ an invertible matrix then the system `Ax = b` has a unique solution,\n\n$$\\\
    begin{array}{r} {x = A^{- 1}b.} \\\\\\\\ \\end{array}$$\n\nHowever, when dealing\
    \ with a random matrix, `A + E`, such that `E[i, j] ~ N(μ, σ²)` , computational\
    \ solutions may be incorrect or may not exist, typically due to round off error.\n\
    \nThe **condition number** of a matrix, `A`, `κ(A)`, is a number that represents\
    \ how fast a solution, `x`, to the linear system `Ax = b` is changing with changes\
    \ in `b`.\n\n$$\\begin{array}{l} {\\kappa(A) = \\left\\{ \\begin{array}{ll} {||A||\
    \ \\cdot ||A^{- 1}||,} & {\\text{~if~}A\\,\\text{is~invertible~}}} \\\\\\\\ {\\\
    infty,} & {\\text{~otherwise}\\{.}} \\\\\\\\ \\end{array}~ \\right.} \\\\\\\\\
    \ \\end{array}$$\n\nWhen dealing with a matrix with a higher condition number,\
    \ the accuracy of results will be lower in solving problems related to the matrix.\
    \ This includes the stability of the eigensystem of the matrix.\n\nThe **pseudospectrum**\
    \ of a matrix `A` is the family of eigenvalues of `A + E`.\n\nTypically data scientists\
    \ deal with matrices that have errors, also called **noisy matrices**. Because\
    \ of this, the pseudospectrum of noisy matrices are of particular interest.\n\n\
    ![Figure 7.1 Visualization of a pseudospectrum.](images/fig7_1.jpg)\n\n[Figure\
    \ 7.1](#chapter7.xhtml#b7fig7_1) Visualization of a pseudospectrum.\n\n![Figure\
    \ 7.2 Visualization of a pseudospectrum, \\sigma^{2} = 0,\\text{\\textbackslash}.01,\\\
    text{\\textbackslash}.25.](images/fig7_2.jpg)\n\n[Figure 7.2](#chapter7.xhtml#b7fig7_2)\
    \ Visualization of a pseudospectrum, `σ² = 0, .01, .25.`\n\nThroughout the rest\
    \ of this chapter, we take a look at families of random matrices and their respective\
    \ eigenvalues.\n\n## 7.3 Gaussian Orthogonal Ensemble\n\nModels for a family of\
    \ matrices of data are referred to as **matrix ensembles**.\n\nRecall from [Chapter\
    \ 5](#chapter5.xhtml), that if `X` and `Y` are i.i.d. random variables where `X,\
    \ Y ~ N(μ, σ²)` then the joint distribution of `X` and `Y`,\n\n$$\\begin{array}{r}\
    \ {\\left. f_{XY}(x,y) \\right.\\sim N\\left( {\\mu,\\frac{\\sigma^{2}}{2}} \\\
    right).} \\\\\\\\ \\end{array}$$ \n\nIn this section, we wish to look at the distribution\
    \ of linear combinations of `X` and `Y`, such as `X + Y` or $\\frac{X}{2}$, where\
    \ `X` and `Y` are random matrices, and the eigenvalues associated with them.\n\
    \nIf `X` is a random matrix where `X[i, j] ~ N(0, 1)`, then\n\n$$\\begin{array}{r}\
    \ {H = \\frac{X + X^{T}}{2}} \\\\\\\\ \\end{array}$$\n\nis a symmetric random\
    \ matrix, and the probability distribution of such a symmetric matrix is called\
    \ the **Gaussian Orthogonal Ensemble (GOE)**.\n\nThe previous two lemmas tell\
    \ us about the joint distribution of the elements of a GOE matrix. More interestingly,\
    \ we will further explore the distribution of the eigenvalues and spacing of eigenvalues\
    \ of random matrices from the GOE.\n\nFor a general 2×2 random matrix from the\
    \ GOE,\n\n$$\\begin{array}{l} {X = \\left( \\begin{array}{ll} X_{1} & X_{2} \\\
    \\ X_{2} & X_{3} \\\\ \\end{array} \\right),} \\\\\\\\ \\end{array}$$\n\nwhere\
    \ `X[1],X[3] ~ N(0, 1)` and $\\left. X_{2} \\right.\\sim N(0,\\,\\frac{1}{2})$\
    \ are i.i.d. The eigenvalues of `X` are\n\n$$\\begin{array}{r} {\\frac{1}{2}Tr(X)\
    \ \\pm \\sqrt{{(X_{1} - X_{3})}^{2} + 4X_{2}^{2}}.} \\\\\\\\ \\end{array}$$\n\n\
    Thus the mean of the eigenvalues is `X[1] + X[3]`. The probability density function\
    \ of `X[1]+X[3] ~ N(0, 2)`, which can be seen in [Figure 7.3](#chapter7.xhtml#fig7_3).\n\
    \n![Figure 7.3 Distribution of mean of eigenvalues in 2×2 GOE.](images/fig7_3.jpg)\n\
    \n[Figure 7.3](#chapter7.xhtml#b7fig7_3) Distribution of mean of eigenvalues in\
    \ `2×2 GOE.`\n\n![Figure 7.4 Distribution of eigenvalues of 100×100 GOE, visualizing\
    \ Wigner's Semicircle Law.](images/fig7_4.jpg)\n\n[Figure 7.4](#chapter7.xhtml#b7fig7_4)\
    \ Distribution of eigenvalues in `100×100 GOE matrices, visualizing Wigner's Semicircle\
    \ Law.`\n\nThe **Marchenko-Pastur Quarter-Circle Law** is the analogous property\
    \ for singular values of a matrix.\n\n![Figure 7.5 Distribution of singular values\
    \ of 100×100 GOE matrices, visualizing Marchenko-Pastur Quarter-Circle Law.](images/fig7_5.jpg)\n\
    \n[Figure 7.5](#chapter7.xhtml#b7fig7_5) Distribution of singular values of `100×100\
    \ GOE matrices, visualizing Marchenko-Pastur Quarter-Circle Law.`\n\nScientists\
    \ and data scientists are even more interested in the distribution of the spacing\
    \ between individual eigenvalues of a matrix. Wigner attempted to compare the\
    \ spacing between heavy nuclei and the spacing between eigenvalues of GOE matrices.\
    \ This theory, called **Wigner's surmise**, describes a phenomenon called ‘level\
    \ repulsion’. In spatially bound system, particles can only have discrete amounts\
    \ of energy, which tend to cluster in a general sense. In general, Wigner's surmise\
    \ states that the probability density function of eigenvalue spacings, `S`, of\
    \ a random GOE matrix follows a Rayleigh distribution.\n\n$$\\begin{array}{r}\
    \ {p(s) = P(S = s) = \\frac{s^{2}}{k^{2}}e^{\\frac{- s^{2}}{2k^{2}}}, \\\\\\\\\
    \ \\end{array}$$\n\nwhere `k` is a scale parameter for the distribution. Since\
    \ entries of such matrices are random variables and not fixed numbers, we must\
    \ investigate techniques to theoretically determine probability distribution of\
    \ the eigenvalues. We dig deeper into the theoretical aspects of Wigner's surmise\
    \ for 2×2 GOE matrices.\n\nIf we define a 2×2 random matrix from the GOE,\n\n\
    $$\\begin{array}{l} {X = \\left( \\begin{array}{ll} X_{1} & X_{2} \\\\ X_{2} &\
    \ X_{3} \\\\ \\end{array} \\right),} \\\\\\\\ \\end{array}$$\n\nwhere `X[1],X[3]\
    \ ~ N(0, 1)` are i.i.d and $\\left. X_{2} \\right.\\sim N(0,\\frac{1}{2})$, the\
    \ eigenvalues of `X` are\n\n$$\\begin{array}{r} {\\frac{1}{2}Tr(X) \\pm \\sqrt{{(X_{1}\
    \ - X_{3})}^{2} + 4X_{2}^{2}}.} \\\\\\\\ \\end{array}$$\n\nLet $s = \\lambda_{1}\
    \ - \\lambda_{2} = \\sqrt{(X_{1} - X_{3}^{2}) + 4X_{2}^{2}}$. The probability\
    \ density function for `s`,\n\n$$\\begin{aligned} {p(s)} & = \\frac{1}{2\\pi^{3/2}}{\\\
    int_{- \\infty}^{\\infty}{\\int_{- \\infty}^{\\infty}{\\int_{- \\infty}^{\\infty}e^{\\\
    frac{- (X_{1}^{2} + 2X_{2}^{2} + X_{3}^{2})}{2}}}}dX_{1}dX_{2}dX_{3}} \\\\ & {\\\
    text{\\quad\\quad}\\delta(d - \\sqrt{{(X_{1} - X_{3})}^{2} + 4X_{2}^{2}})}} \\\
    \\\\\\ \\end{aligned}$$\n\nA visualization of `p(s)` can be seen in [Figure 7.6](#chapter7.xhtml#fig7_6).\n\
    \n![Figure 7.6 Example distribution of Wigner Surmise with 2 ×2 GOE distribution.](images/fig7_6.jpg)\n\
    \n[Figure 7.6](#chapter7.xhtml#b7fig7_6) Example distribution of Wigner Surmise\
    \ with `2×2 GOE distribution.`\n\nWith a change of variables,\n\n$$\\begin{aligned}\
    \ {X_{1} - X_{3}} & = r\\cos(\\theta), \\\\ {X_{1} + X_{3}} & = \\eta, \\\\ X_{2}\
    \ & = r\\sin(\\theta)/2, \\\\\\\\ \\end{aligned}$$ \n\nwe get,\n\n$$\\begin{array}{l}\
    \ {J = \\left| \\begin{array}{lll} {\\cos(\\theta)/2} & {- r\\sin(\\theta)/2}\
    \ & {1/2} \\\\ {- \\cos(\\theta)/2} & {r\\sin(\\theta)/2} & {1/2} \\\\ {\\sin(\\\
    theta)/2} & {\\cos(\\theta)/2} & 0 \\\\ \\end{array} \\right| = - r/4,} \\\\\\\
    \\ \\end{array}$$\n"
