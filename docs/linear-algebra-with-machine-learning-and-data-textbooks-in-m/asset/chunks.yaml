    phi(X) = \\frac{w_{1}}{(X - \\mu_{1})^{T}(X - \\mu_{1})} + \\frac{w_{2}}{(X -\
    \ \\mu_{2})^{T}(X - \\mu_{2})}}$$\n\n  with the SSE cost function to determine\
    \ which category resembles `f[1]` and `f[2]`.\n\n# Decision Trees and Random Forests\n\
    \nDOI: [10.1201/978103025672](https://doi.org/10.1201/978103025672)\n\nWhile previous\
    \ chapters focus on techniques for making a single decision, this chapter focuses\
    \ on ways to make series of decisions to best categorize data.\n\n## 6.1 Decision\
    \ Trees\n\nA `decision tree` is a recursive partitioning of choices represented\
    \ by a tree. A `decision tree` is similar to a flow chart and can be applied in\
    \ variety of venues. The general form of a decision tree can be seen in [Figure\
    \ 6.1](#chapter6.xhtml#fig_1).\n\n```\nFigure 6.1 General Form of a Decision Tree.\n\
    ```\n\n[Figure 6.1](#chapter6.xhtml#b6fig_1_1)\n\nLet's begin with an example\
    \ of a decision tree applied to logic statement. Typically decision trees are\
    \ used for classification and regression analysis. A `classification tree` is\
    \ a decision tree where each node, or vertex, has a binary decision connected\
    \ to it based on whether attribute is present. The top node, also called `root`,\
    \ represents the presence of all possible attributes, and each `child` node is\
    \ subdivision of the node above, also called `parent` node. A `child` node may\
    \ be successor decision node or final outcome, called `leaf` node. A decision\
    \ tree can also be used to divide quantitative data into regions.\n\nBut all decisions\
    \ are created equally. [Figures 6.2](#chapter6.xhtml#fig_2) and [6.5](#chapter6.xhtml#fig_5)\
    \ show two different decision trees for `A \\cap (B \\cup C)`, which one you prefer?\n\
    \n```\nFigure 6.5 Another decision tree for logic statement A \\cap (B \\cup C).\n\
    ```\n\n[Figure 6.5](#chapter6.xhtml#b6fig_5) Another decision tree for logic statement\
    \ `A \\cap (B \\cup C)`. Given the choice, it is best to choose a `root` node\
    \ to split a decision in a way that provides more clarity after the split. A decision\
    \ tree defined over a domain of categorical attributes can be converted into a\
    \ numerical function. Many times, data scientists will wish to determine such\
    \ functions that measure the closeness of the data to the desired outcome. There\
    \ are several standard criteria that used. In [Section 5.6](#chapter5.xhtml#sec5_6),\
    \ cross-entropy was used in order to make decisions about handwritten digits.\
    \ `Entropy` and the `Gini index` are some examples of splitting functions.\n\n\
    ### Entropy\n\nIf `Y` is a random event, then the `uncertainty` of `Y = y` occurring\
    \ can be measured by\n\n$$\\begin{array}{r} {\\log_{2}\\left(\\frac{1}{P(Y = y)}\\\
    right)} = - \\log_{2}(P(Y = y))}$$\n\n```\nFigure 6.6 Uncertainty of a random\
    \ event Y \\sim N(0,1).\n```\n\nFigure 6.6 Uncertainty of a random event `Y \\\
    sim N(0,1)`. The `entropy` of a random event `Y` is the expected uncertainty.\
    \ That is, if `Y` is a discrete random variable, then\n\n$$\\begin{array}{l} {Entropy(Y)\
    \ = E\\left( {- log_{2}\\left( {P\\left( {Y = y} \\right)} \\right)} \\right)\
    \ = - \\sum_{y}P(Y = y)\\log_{2}(P(Y = y))}$$\n\nand if `Y` is a continuous random\
    \ variable,\n\n$$\\begin{array}{r} {Entropy(Y) = - \\int_{-\\infty}^{\\infty}P(Y\
    \ = y)\\log_{2}(P(Y = y)), dy.}$$\n\nFor a dataset `S`, entropy, `Entropy(S)`,\
    \ is a measure of homogeneity within the dataset. If there are classes `C[1]`,\
    \ `C[2]`, ..., `C[n]` of data in `S` then\n\n$$\\begin{array}{r} {Entropy(S) =\
    \ \\sum_{C_{i}} -P(C_{i})\\log_{2}(P(C_{i})).}$$\n\nIf the entropy related to\
    \ a decision tree is 0 then the data is completely homogenous and if there is\
    \ a clear 50-50 split in the data then the entropy will be equal to 1. For example,\
    \ in [Figure 6.7](#chapter6.xhtml#fig_7), in the graph to the left, `L[1]`, splits\
    \ the two classes and thus, `Entropy(S)` = 1. In the graph on the right, roughly\
    \ half of each class is on either side of `L[1]` and thus the entropy would between\
    \ 0 and 1.\n\n```\nFigure 6.7 Example of Linearly Separable and Non-Separable\
    \ Data Sets.\n```\n\n[Figure 6.7](#chapter6.xhtml#b6fig_7) Example of Linearly\
    \ Separable and Non-Separable Data Sets.\n\n### Gini Impurity\n\nAnother indicator\
    \ of strong splits in decisions is the `Gini Impurity` measure. The idea behind\
    \ the `Gini Impurity` measure is to determine the probability that the nodes are\
    \ chosen in a way that random sample of data is classified incorrectly.\n\n$$\\\
    begin{aligned} {Gini Impurity} = \\sum_{i=1}^{n}p_{i}(1 - p_{i}) \\\\ = 1 - \\\
    sum_{i=1}^{n}p_{i}^{2}} \\end{aligned}$$\n\nwhere `P = (p[1], p[2], ..., p[n])`\
    \ and `p[i]` is the probability that an object is classified in class `i = 1,\
    \ 2, ..., n`. For example, assume we randomly select 10 data points as in [Figure\
    \ 6.8](#chapter6.xhtml#fig_8), with two categories. If a decision criteria in\
    \ Node 1 creates a split shown by Nodes 2 and 3, we can then see that the\n\n\
    $$\\begin{array}{r} {\\text{Gini Impurity of Node}, 2 = 1 - \\frac{3}{4}^{2} -\
    \ \\frac{1}{4}^{2} = \\frac{3}{8}}} \\end{array}$$\n\n```\nFigure 6.8 Example\
    \ of decision criteria splitting.\n```\n\n[Figure 6.8](#chapter6.xhtml#b6fig_8)\
    \ Example of decision criteria splitting.\n\n$$\\begin{array}{r} {\\text{whereas\
    \ the Gini Impurity of Node}, 3 = 1 - \\frac{1}{3}^{2} - \\frac{2}{3}^{2} = \\\
    frac{4}{9}.}} \\end{array}$$\n"
