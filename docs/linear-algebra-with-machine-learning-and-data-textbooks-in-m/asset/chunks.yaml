  trans: "\n\n注意，矩阵 `A` 是可约的，当且仅当存在一个置换矩阵可以将 `A` 转化为块上三角形式时。\n\n注意示例 2.2 中与邻接矩阵 `A[1]`\
    \ 和 `A[2]`对应的图（如图 2.1\n\n图 2.1 与示例 2.2 相关的图。\n\n如果方矩阵 `A` 的所有元素均为非负，则称为**非负矩阵**，记作\
    \ `A` ≥ 0；如果它的所有元素均为正，则称为**正矩阵**，记作 `A` > 0。\n\n如果存在整数 `k` > 0 使得 `A^(*k*)` 是正矩阵，则称矩阵\
    \ `A` 为**原始矩阵**。如果对于所有的 (`i`, `j`)，都存在一个 `k` 使得 `A*i*, *j*` > 0，则称该矩阵为不可约矩阵。\n\
    \n以下定理——佩尔昂-弗罗比斯定理（Perron-Frobenius theorem），是研究离散概率行为（也称为**随机过程**）关于不可约矩阵特征值和特征向量的关系的基础。\n\
    \n佩尔昂还贡献了一个略有不同的定理，该定理依赖于矩阵是原始的而非不可约。\n\n当矩阵是非负但既非原始也不可约时，`λ[PF]` 的重数可能大于 1。\n\
    \n将佩尔昂-弗罗比斯定理应用于示例 2.3 中的矩阵 `A`，`λ[PF]` = `ρ(*A*)` = 6，对应的单位特征向量为\n\n$$\\\\begin{array}{r}\
    \ {\\\\left\\\\{ {\\\\frac{2}{\\sqrt{229}},\\\\\\,\\frac{9}{\\sqrt{229}},\\\\\\\
    ,\\frac{12}{\\sqrt{229}}} \\\\right\\\\}.} \\\\\\\\ \\\\end{array}$$  \n\n同样，图\
    \ 1.8 所示的犯罪网络矩阵也是不可约的，`λ[PF]` = 4.032，对应的单位特征向量为\n\n$$\\\\begin{array}{r} {\\\\\
    left\\\\{ 0.267,\\\\, 0.305,\\\\, 0.163,\\\\, 0.285,\\\\, 0.353,\\\\, 0.324,\\\
    \\, 0.272,\\\\, 0.348,\\\\, 0.322,\\\\, 0.447 \\\\right\\\\}.} \\\\\\\\ \\\\end{array}$$\n\
    \n## 2.1 马尔可夫链基础\n\n一个**随机过程**是随时间索引的随机变量序列，可以是连续或离散的。我们在这里考虑一种被称为**马尔可夫链**的离散随机过程，其中\n\
    \n$$\\begin{array}{r} {P(X_{n} = x_{n}|X_{1} = x_{1},\\\\,\\\\ldots,\\\\ X_{n\
    \ - 1} = x_{n - 1}) = P(X_{n} = x_{n}|X_{n - 1} = x_{n - 1}). \\\\\\\\ \\\\end{array}}$$\n\
    \n也就是说，当前状态的概率仅取决于之前的状态；没有发生其他状态。这种性质被称为**无记忆性**。\n\n马尔可夫链有一个对应的**转移矩阵**。转移矩阵\
    \ `M` 是一个概率矩阵，其中 `M[*i*, *j*]` 是状态 `j` 转移到状态 `i` 的概率，\n\n$$\\begin{array}{r} {M_{i,j}\
    \ = P(X_{n} = i,\\\\ X_{n - 1} = j).} \\\\\\\\ \\end{array}$$\n\n给定转移矩阵，有几种方法可以开始分析状态的长期行为。\n\
    \n一种方法是对每个状态的初始值做出假设，创建一个初始向量 `π`。然后通过应用转移矩阵的幂来找到长期行为：\n\n$$\\begin{array}{r}\
    \ {lim_{k\\\\rightarrow\\\\infty}\\, M^{k}\\\\pi.} \\\\\\\\ \\end{array}}$$\n\n\
    利用佩尔昂-弗罗比斯定理的一般情况，假设模最大的特征值 `λ[PF]` 有一个单位特征向量 `v`。\n\n如果 `M` 是一个带有元素 `M[*i*, *j*]`\
    \ 的 `n \\times n` 转移矩阵，那么\n\n$$\\begin{array}{r} {\\\\lambda_{PF}v = Mv = \\\\\
    sum\\\\limits_{j = 1}^{n}M_{i,j}.} \\\\\\\\ \\end{array}}$$\n\n因此 `λ_{PF}vv^{T}\
    \ = {\\\\sum\\\\limits_{j = 1}^{n}M_{i,j}} = 1` 且 `λ[PF]` = 1。此外，\n\n$$\\begin{array}{r}\
    \ {lim_{n\\\\rightarrow\\\\infty}\\, X_{n} = lim_{n\\\\rightarrow\\\\infty}\\\
    , M^{n}v = lim_{n\\\\rightarrow\\\\infty}\\,\\\\lambda_{PF}^{n}v = v.} \\\\\\\\\
    \ \\end{array}}$$\n\n向量 `\\frac{v}{\\\\sum\\\\limits_{i}v_{i}}}` 将为马尔可夫链的长期行为提供一个比例向量。\n\
    \n通常，如果 `X[1], `X[2],  `X[*n*]` 是马尔可夫链中的状态，那么如果 `X[*i*]` 满足\n\n$$\\begin{array}{r}\
    \ {P(X_{i} = x_{i}|X_{i - 1} = x_{i}) = 1,}$$ \n\n则它是**吸收态**，否则该状态被称为**暂态**。\n\
    \n如果有 `q` 个暂态和 `r` 个吸收态，可以对马尔可夫链的状态重新编号，通过置换转移矩阵的行和列将转移矩阵变为形式：\n\n$$\\begin{array}{l}\
    \ {\\\\left( \\begin{array}{ll} Q & 0 \\\\ R & I \\\\\\\\end{array} \\\\right),}\
    \ \\\\\\\\ \\end{array}$$\n\n其中 `q \\times q` 矩阵 `Q` 代表暂态之间的转移，`r \\times r` 矩阵\
    \ `I` 代表吸收，`q \\times r` 矩阵 `R` 代表从暂态到吸收态的转移，而 `r \\times q` 矩阵 `0` 表示无法从吸收态移动到暂态。\n\
    \n通过将转移矩阵转化为这种形式，我们可以利用马尔可夫链研究中的另一个重要矩阵——**基础矩阵**：\n\n$$\\begin{array}{r} {N =\
    \ {\\\\sum\\\\limits_{n = 0}^{\\infty}Q^{n}}} \\\\\\\\ \\end{array}$$\n\n回想级级数的学习，函数\
    \ `\\frac{1}{1 - x}` 为中心的泰勒级数（也称为麦劳林级数）为 `\\sum\\\\limits_{n = 0}^{\\infty}x^{n}`。同样，如果马尔可夫链至少有一个吸收态，则\
    \ `I−Q` 可逆，其逆矩阵为 `N = {\\\\sum\\\\limits_{n = 0}^{\\infty}Q^{n}}`。\n\n基础矩阵 `N`\
    \ 的第 `(*i*, *j*)^(th)` 个元素表示在马尔可夫链从 `X[*i*]` 开始的情况下，留在状态 `X[*j*]` 的期望时间。\n\n##\
    \ 2.2 隐藏马尔可夫模型\n\n当我们根据概率确定事件序列时，马尔可夫链非常有帮助。然而，有时我们希望进行预测但这些概率并不明确或未被观测。在这种情况下，我们说有一个**隐藏马尔可夫模型\
    \ (HMM)**。我们从一个示例开始：\n\n示例 2.8 中提出的问题是隐藏马尔可夫模型解决的问题之一。这些问题分为三大类：\n\n1. **似然问题——给定模型确定观测序列的概率。**\n\
    2. **解码问题——给定观测序列确定最可能的事件序列。**\n3. **学习问题——给定观测序列确定最可能的模型（带参数）。**\n\n### 2.2.1\
    \ 似然问题\n\n由于我们需要使用先验信息在隐藏马尔可夫模型中进行某些推理，因此深入理解**贝叶斯定理**（Bayes Theorem）至关重要。\n\n\
    如果两个事件 `X[1]` 和 `X[2]` 满足，则它们是**互斥的**：\n\n$$\\begin{array}{r} {X_{1} \\\\cap X_{2}\
    \ = \\\\varnothing.} \\\\\\\\ \\end{array}$$\n\n如果事件 `X[1], `X[2],  `X[*n*]` 满足，则它们是**完备的**：\n\
    \n$$\\begin{array}{r} {\\\\cup\\\\limits_{i = 1}^{n}X_{i} = S,} \\\\\\\\ \\end{array}$$\n\
    \n其中 `S` 是所有可能结果的集合。\n\n"
- fmt: "\nIn solving the decoding problem with a HMM, we wish to find the most likely\
    \ hidden sequence `H^*` of occurring given an observation sequence, `O`. More\
    \ specifically, the goal of decoding is to determine\n\n$$\\begin{array}{r} {H^{\\\
    *} = argmax_{H}P(H|O).} \\\\\\\\ \\end{array}$$  \n\nNote that `argmax[H]P(H|O)`\
    \ is the maximum probability of a hidden sequence, `H`, over all possible `H^′`s,\
    \ given an observation sequence `O`.\n\nWe will employ both the Forward/Backward\
    \ Algorithm and the `Viterbi Algorithm` in our investigation of the decoding problem.\n\
    \n## Applying the Forward/Backward Algorithm\n\nDefine\n\n$$\\begin{aligned} {\\\
    gamma{(H_{t})}^{k}} & {= P(H_{t} = k|O,\\lambda)} \\\\ & {= \\frac{P(H_{t} = k,O|\\\
    lambda)}{P(O|\\lambda)}} \\\\ & {= \\frac{\\alpha{(H_{t})}^{k}\\beta{(H_{t})}^{k}}{P(O|\\\
    lambda)}} \\\\ & {= \\frac{\\alpha{(H_{t})}^{k}\\beta{(H_{t})}^{k}}}{\\alpha(H_{n})\
    \ \\cdot \\beta(H_{n})}} \\\\ \\end{aligned}$$  \n\nSimilar to the Forward/Backward\
    \ Algorithm, the Viterbi Algorithm still requires knowledge of the the transition\
    \ matrix, `T`, and the emissions matrix, `E`, as well as `π`, the initial probability\
    \ distribution of the hidden random variables. We begin by thinking through the\
    \ recursive idea of `Viterbi Algorithm`.\n\nAssume that the observed sequence\
    \ of random variables is `O[1]`, `O[2]`, …, `O[n]` and the hidden sequence of\
    \ random variables is `H[1]`, `H[2]`, …, `H[n]`.\n\nAn additional important fact\
    \ is that the conditional probability `P(H|O)` is proportional to the joint probability\
    \ `P(H, O)`,\n\n$$\\begin{array}{r} {P(H|O)P(O) = P(H,\\ O)} \\\\\\\\ \\end{array}$$\
    \  \n\nand thus if we find the hidden sequence that maximizes the joint probability,\
    \ `P(H, O)`, this sequence will also maximize the conditional probability, `P(H|O)`.\n\
    \n$$\\begin{aligned} H^{\\*} & {= argmax_{H_{i},1 \\leq i \\leq n}P(H_{i}|O_{i})}\
    \ \\\\ & {= argmax_{H_{i},1 \\leq i \\leq n}P(H_{i},O_{i})} \\\\ & {= argmax_{H_{i},1\
    \ \\leq i \\leq n - 1}P(O_{i}|H_{i})P(H_{i}|H_{i - 1})P(H_{i - 1}|O_{i - 1}).}\
    \ \\\\ \\end{aligned}$$  \n\nThus if `p[i]` = `P(H[i]|O[i])`, then\n\n$$\\begin{array}{r}\
    \ {p_{i} = H^{\\*} = argmax_{H_{i},1 \\leq i \\leq n}{\\prod\\limits_{i = 2}^{n\
    \ - 1}P}(O_{i}|H_{i}){\\prod\\limits_{i = 2}^{n}P}(H_{i}|H_{i - 1})p_{1}.} \\\\\
    \\\\ \\end{array}$$  \n\nKalu really wishes to find the hidden sequence that maximizes\
    \ this likelihood. Revisiting the Viterbi Algorithm matrix and the recursive paths\
    \ in [Figure 2.5](#chapter2.xhtml#fig2_5), choose the hidden states with the largest\
    \ probabilities working backwards. Thus the most likely hidden sequence `M` is\n\
    \n$$\\begin{array}{r} {\\\\left\\{ \\text{Bullish},\\,\\text{Bullish},\\,\\text{Bullish}\
    \ \\right\\}} \\\\\\\\ \\end{array}$$  \n\nThe Viterbi Algorithm is a widely used\
    \ algorithm. For those of you who use speech or hand writing recognition on your\
    \ personal devices, the Viterbi Algorithm may be used to decipher what you are\
    \ trying to communicate.\n\n### 2.2.3 The Learning Problem\n\nIn both the likelihood\
    \ and the decoding problems, the model was assumed and fixed. That is, we knew\
    \ the initial probabilities, `π`, the transmission matrix, `T`, and emission matrix,\
    \ `E`.\n\nThis final type of problem, the learning problem, requires an algorithm\
    \ that will help determine the optimal model `λ = (T, E, π)`. In this section,\
    \ we will discuss the `Baum-Welch Algorithm`.\n\nGiven an initial sequence of\
    \ observed states `O = (O[1], O[2], ..., O[n])`, called the `training sequence`,\
    \ and a hidden sequence `H = (H[1], H[2], ..., H[n])`, the Baum-Welch Algorithm\
    \ will find another hidden sequence `H′` such that\n\n$$\\begin{array}{r} {P(O|H^{\\\
    prime}) \\geq P(O|H).} \\\\\\\\ \\end{array}$$  \n\nIdeally, we wish to find `H′`\
    \ such that `P(O|H′) ≥ P(O|H)` for all `H`, however, that is not guaranteed under\
    \ the Baum-Welch Algorithm. Note that\n\n$$\\begin{array}{r} {{\\sum\\limits_{t\
    \ = 1}^{T - 1}\\gamma_{t}}(i)} \\\\\\\\ \\end{array}$$  \n\nis the expected number\
    \ of transitions from `H[i]` and\n\n$$\\begin{array}{r} {{\\sum\\limits_{t = 1}^{T\
    \ - 1}\\xi^{t}}(i)} \\\\\\\\ \\end{array}$$  \n\nis the expected number of transitions\
    \ from `H[i]` to `H[j]`.\n\nLet's put the Baum-Welch Algorithm in action through\
    \ an example. Baum-Welch Algorithm is just one method in a larger category of\
    \ `Expectation Maximization algorithms` that are generally used in machine learning\
    \ to produce models. There are a variety of `gradient methods` like Baum-Welch\
    \ that have been developed with similar goals in mind.\n\n## 2.3 CASE STUDY: Spread\
    \ of Infectious Disease\n\nIn 2019, the world broke out into an international\
    \ pandemic which led many to think more closely about the mathematics behind the\
    \ spread of infectious diseases. Many diseases, like COVID-19, in simple terms\
    \ would be modeled with SIR models, with humans in three categories, `S` (Susceptible),\
    \ `I` (Infectious), and `R` (Recovered). There are more complex models that provide\
    \ for temporary immunity, quarantine, or even death.\n\nWe will explore a variety\
    \ of these in this case study. In addition, most infectious disease models would\
    \ implement a stochastic continuous-time Markov model; however we will focus on\
    \ discrete time models in this particular case.\n\nWe begin with the basic SIR\
    \ model. This model has the underlying assumption that birth and death occur at\
    \ roughly the same rate throughout time. We will also assume that the time step\
    \ in this model is days; however, parameters could be adjusted for other units\
    \ of time.\n\nIf the states of the Markov chain are `X[1]`, `X[2]`, …,\n\n$$\\\
    begin{array}{r} {P(X_{t} = R|X_{t - 1} = R) = 1} \\\\\\\\ \\end{array}$$  \n\n\
    then recovery is an absorbing state which would happen in a case when immunity\
    \ is guaranteed. As of May 2020, there were hopes that some temporary immunity\
    \ existed but evidence from the outbreak in China showed that if it did exist\
    \ it was short lived. We begin by assuming that social distancing is not in place\
    \ and that there may be some partial immunity based on antibodies but that it\
    \ is not guaranteed.\n\nOne example of a transition matrix,\n\n$$\\begin{array}{l}\
    \ {T = \\left( \\begin{array}{lll} S & I & R \\\\ 0.99998 & 0. & 0.0014286 \\\\\
    \ 0.00002 & 0.998 & 0. \\\\ 0. & 0.002 & 0.928571 \\\\ \\end{array} \\right)}\
    \ \\\\\\\\ \\end{array}$$  \n\nproduces a spread of infection shown in [Figure\
    \ 2.7](#chapter2.xhtml#fig2_7).\n\n![Figure 2.7 Growth of disease under a simple\
    \ SIR model.](images/fig2_7.jpg)\n\n[Figure 2.7](#chapter2.xhtml#b2fig2_7) Growth\
    \ of disease under a simple SIR model.\n\nThe reproduction number, `R[0]`, is\
    \ the expected number of secondary cases that one case would produce in an entire\
    \ susceptible population. A positive reproduction number is indicative of a possible\
    \ probability of outbreak, while a negative `R[0]` indicates that an outbreak\
    \ is not possible.\n\n$$\\begin{array}{r} {R_{0} = \\frac{\\text{infection rate}}{\\\
    text{the expected disease length}}} \\\\\\\\ \\end{array}$$  \n\nIn the simplest\
    \ models, `R[0]` can be estimated by the rate of infection, `r[0]`, and the estimated\
    \ length of the infection, `L`, where\n\n$$\\begin{array}{r} {R_{0} \\approx 1\
    \ + r_{0}L.} \\\\\\\\ \\end{array}$$  \n\nThus for the model shown in [Figure\
    \ 2.7](#chapter2.xhtml#fig2_7), if we estimate `r[0]` ≈ .017 and `L` = 21 days\
    \ then `R[0]` ≈ 1.357.\n\nIf instead, immunity is present and thus recovery acts\
    \ as an absorbing state, one might see a behavior such as in [Figure 2.8](#chapter2.xhtml#fig2_8).\n\
    \n![Figure 2.8 Growth of disease under SIR model with immunity.](images/fig2_8.jpg)\n\
    \n[Figure 2.8](#chapter2.xhtml#b2fig2_8) Growth of disease under SIR model with\
    \ immunity.\n\nIn this case, let's assume that the transition matrix is\n\n$$\\\
    begin{array}{l} {T = \\left( \\begin{array}{lll} S & I & R \\\\ 0.98 & 0 & 0 \\\
    \\ 0.02 & 0.96 & 0 \\\\ 0 & 0.04 & 1 \\\\ \\end{array} \\right)} \\\\\\\\ \\end{array}$$\
    \  \n"
