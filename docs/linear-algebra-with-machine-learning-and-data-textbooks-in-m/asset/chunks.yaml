    # 公平原则


    公平性是指所有选区拥有等数量选民的原则。在理想情况下，如果选区内的任意两点之间的线段完全位于选区内，则该选区是紧凑的。请记住，普查区块（census blocks）、区块组（groups）和三角区（tracts）通常不是紧凑的，因此这些对象的包含可能会导致某个选区不符合这一属性。当以不自然的方式违反紧凑性时，可能会变成更严重的问题。2011
    年北卡罗来纳州选区重划分图被判定为违宪，特别是在 `District 12` 附近，这可以从图 1.19


    ![图 1.19 2011 年北卡罗来纳州选区重划分图 [26].](images/fig1_19.jpg)


    图 1.19 2011 年北卡罗来纳州选区重划分图 [26]。


    ## 确定普查区块的相邻性


    选区划分的一些问题在于确定相邻的普查区块。如图 1.20 所示，相邻的普查区块编号可能不是连续的。例如，普查区块 2003 和 2009 是相邻的。


    ![图 1.20 北卡罗来纳州夏洛特的普查区块和区块示例](img/fig1_20.jpg)


    图 1.20 北卡罗来纳州夏洛特的普查区块和区块示例。


    区块显然并非通过整个边相邻，可能会沿着多个边相邻。那么问题变成了，在一个州有数千个普查区块的情况下，我们如何确定普查区块是否相邻，以及我们如何优先考虑可能比其他关系重要的相邻关系。


    ## 案例研究：图表示


    在这个案例研究中，我们将关注图 1.20 的一个非常小的部分，即普查区块 2000 到 2015。考虑此问题的一种方法是基于共享的周边界创建一个图以及相应的邻接矩阵。


    图 1.21 中的边代表图 1.20 中普查区块之间的共享边。从顶点 `i` 到顶点 `j` 的权重，代表普查区块 `i` 与普查区块 `j` 共享的边界比例，是邻接矩阵
    `A[E]` 的第 `(i, j)` 项。


    ![图 1.21 示例普查区块的无权图表示](img/fig1_21.jpg)


    图 1.21 示例普查区块的无权图表示。


    ## 邻接矩阵分析


