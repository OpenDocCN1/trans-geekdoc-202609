    \ &= f^{(k)}(x_{i}),0 \\leq k \\leq p. \\end{aligned}$$\n\n根据定义，`h(x)` 有 $(n+1)(p+1)$\
    \ 个约束，因此我们需要寻找一个 $(n+1)(p+1)-1$ 阶的多项式来满足这些要求。\n\n在对埃尔米特多项式进行一般陈述之前，我们来看一个例子。\n\
