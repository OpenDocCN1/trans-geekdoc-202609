    lbrack x_{0},x_{1},x_{2},x_{3}\\rbrack \\\\\\\\end{aligned}$$  \n\n![Figure 4.4\
    \ Data with \\hat{f_{1}}(x),\\\\,\\\\hat{f_{2}}(x),\\\\,\\\\hat{f_{3}}(x) from\
