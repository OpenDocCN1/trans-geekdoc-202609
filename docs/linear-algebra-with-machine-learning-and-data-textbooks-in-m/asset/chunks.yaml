    \nWe begin with an overview of vector and inner product spaces since orthogonality\
    \ is pertinent in the discussion of further topics in the chapter.\n\n## 3.1 Vector\
    \ and Inner Product Spaces\n\nA set of vectors, *V*, under defined vector addition\
    \ and scalar multiplication is called a **vector space** if the following properties\
    \ hold.\n\n1.  *V* is closed under vector addition.\n\n2.  *V* is closed under\
