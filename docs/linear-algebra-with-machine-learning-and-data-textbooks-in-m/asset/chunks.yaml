    \ {n(n - 1)a\\_{n - 2}} \\\\ 0 \\\\ 0 \\\\\\\\end{array} \\right).} \\\\\\\\ \\\
    \\end{array}$$  \n\n利用这些思想，我们将 `A` 的一阶导算子引入为：\n\n$$\\begin{array}{l} \\\\left.\
    \ \\\\frac{d}{dx}\\\\rightarrow\\\\left( \\begin{array}{llllll} 0 & 1 & 0 & 0\
    \ & \\\\ldots & 0 \\\\ 0 & 0 & 2 & 0 & \\\\ldots & 0 \\\\ \\\\vdots & \\\\ddots\
    \ & \\\\ddots & \\\\ddots & \\\\ddots & \\\\vdots \\\\ 0 & 0 & 0 & 0 & \\\\ldots\
    \ & n \\\\\\\\end{array} \\\\right), \\\\left. \\\\\\\\end{array}$$  \n\n`A` 的二阶导算子为\n\
    \n$$\\begin{array}{l} \\\\left. \\\\frac{d^{2}}{d^{2}x}\\\\rightarrow\\\\left(\
    \ \\begin{array}{llllll} 0 & 0 & 2 & 0 & \\\\ldots & 0 \\\\ 0 & 0 & 0 & 6 & \\\
