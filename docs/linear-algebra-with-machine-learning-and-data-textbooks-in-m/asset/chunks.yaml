  trans: "\n第 4 章和第 5 章都关注预测模型。第 4 章更多地关注传统的插值技术，如切比雪夫、埃米特和格朗日插值，而第 5 章退后一步，快速回顾了概率论和矩阵计算，然后将第\
    \ 4 章的内容连接到机器学习和神经网络技术。在这些章节中，一些微积分知识将会有帮助，因为重点是优化代价函数。同样，在第 5 章中对技术的良好理解至关重要，因为迭代方法在神经网络技术中变得非常重要。\n\
    \n第 6 章侧重于在决策树中实现之前章节的概念。本章将介绍决策树的几种不同处理方法，包括决策树回归、傅里叶变换和随机森林。\n\n最后，许多模型是随机矩阵构建的；重点在于第\
    \ 7 章。第 7 章的讨论严重依赖于在第 5 章中引入的概率论以及特征值和特征向量的知识。在第 7 章中，还使用了`Kronecker 积`（也称为`张量积`）。\n\
    \n如果 `A` 是一个 `m` × `n` 矩阵且 `B` 是一个 `p` × `q` 矩阵，那么 Kronecker 积为：\n\n$$\\begin{array}{l}\
    \ {A \\otimes B = \\left( \\begin{array}{lll} {a_{1,1}B} & \\ldots & {a_{1,n}B}\
    \ \\\\ \\vdots & & \\vdots \\\\ {a_{m,1}B} & \\ldots & {a_{m,n}B} \\\\ \\end{array}\
    \ \\right).} \\\\ \\end{array}$$  \n\n如果 `A`^(`T`*)℄= − `A`，则矩阵 `A` 是`反对对称的`。在第\
    \ 7 章中，我们专门使用了反对对称矩阵与单位矩阵的 Kronecker 积，如示例 0.6 所示。\n\n在全文中，鼓励读者在涉及数据分析伦理时使用批判性眼光。此外，在选择模型时，读者应该考虑应用情况，以便在语境中选择最有意义的模型。\n\
    \n# 1 图论\n\nDOI: [10.1201/9781003025672-1](https://doi.org/10.1201/9781003025672-1)\n\
    \n## 1.1 基础术语\n\n在研究数据时，数据科学家最关注网络中数据点之间的关系或连接。在本章中，我们将从图论的角度探索这些网络，并看这些思想如何回归数据科学和线性代数。\n\
    \n一个图 `G` 可以由一组`顶点`（或节点）`V` 和一组`边``E` 来表示，其中 `E` 中的每条边都连接 `V` 中的两个顶点。\n\n图 `G`\
    \ 中的顶点数量被称为图的`阶`，用 `|V|` 表示。图 `G` 中的边数量被称为`大小`，用 `|E|` 表示。\n\n如果一条边连接两个顶点 `v[i]`\
    \ 和 `v[j]`，则称该边与这两个顶点`关联`。我们称顶点 `v[i]` 和 `v[j]` 为该条边的`端点`。\n\n如果存在一条边同时关联于顶点 `v[i]`\
    \ 和顶点 `v[j]`，则称顶点 `v[i]` 与顶点 `v[j]`是`相邻`的。一个顶点的`度`是与该顶点关联的边数。\n\n注意，在图 1.1 的图中，`|V|` = 6，`|E|` = 12。顶点\
    \ `v[4]` 与其他所有顶点相邻，而 `v[1]` 与 `v[2]`、`v[3]` 和 `v[4]` 相邻，因此 `degree(v[1])`℄= 3，`degree(v[4])`℄= 5。\n\
    \n![图 1.1 |V| = 6,|E| = 12, degree (v_{1}) = 3, and degree (v_{4}) = 5.](img/fig1_1.jpg)\n\
    \n图 1.1 `|V|` = 6， `|E|` = 12，度 (`v[1]`)℄= 3，且度 (`v[4]`)℄= 5。\n\n只有一个端点的边被称为`自环`。\n\
    \n注意，如果一个顶点通过自环与自身相邻，那么这条边对该顶点的度贡献了两条边。`握手定理`强调每条边都关联两个顶点（这两个顶点可能不是唯一的），在计算图的度之和时，它会被计算两次。如果两条或更多边具有相同的端点，它们被称为`重边`。\n\
    \n图 1.2 显示了 `v[1]` 与 `v[2]` 之间的两条边。`v[1]` 与 `v[2]`、`v[3]` 和 `v[4]` 相邻，因此 `degree(v[1])`℄= 3，`degree(v[4])`℄= 5。`v[1]`\
    \ 与 `v[2]` 之间的两条边对 `v[1]` 的度贡献了 2。\n\n![图 1.2 重边。](img/fig1_2.jpg)\n\n图 1.2 `v[1]`\
    \ 与 `v[2]` 之间的两条边。\n\n只有一个只有一个端点..........\n\n。\n\n图 的`子图` 是包含 `V` 中一个子集的图，[图\
    \ 1.3 所示。\n\n![  1.3。](img/fig113.jpg)\n\n图 1.3 `图 1.3`。\n\n对于每个图，都有对应的`邻接矩阵``A`，其中\n\
    \n$$\\begin{array}{l} {A_{i,j} = 1, & \\text{如果顶点}_{i}\\text{相邻于顶点}_{j,} \\\\\
    \ {0,} & \\text{否则}} \\end{array}$$\n\n如果 `A`^(`T`*)℄= − `A`。在第 7 章中，我们专门使用了反对对称矩阵与单位矩阵的\
    \ Kronecker 积，如示例 0.6 所示。\n\n在全文中，鼓励读者在涉及数据分析伦理时使用批判性眼光。此外，在选择模型时，读者应该考虑应用情况，以便在语境中选择最有意义的模型。\n\
