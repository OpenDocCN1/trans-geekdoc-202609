    \ | % of Cases that are | % of Population | % of Cases that are |\n| --- | ---\
    \ | --- | --- | --- |\n| | that is white | from the white population | that is\
    \ black | from the black population |\n| CA | .36 | .20 | .05 | .04 |\n"
