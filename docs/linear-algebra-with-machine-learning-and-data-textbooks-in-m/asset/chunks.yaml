    left( \\begin{array}{ll} {\\cos(\\theta)} & {-sin(\\theta)} \\\\ {\\sin(\\theta)}\
    \ & {\\cos(\\theta)} \\end{array} \\right)v_{1},} u_{2} = T_{A}\\left( \\begin{array}{ll}\
