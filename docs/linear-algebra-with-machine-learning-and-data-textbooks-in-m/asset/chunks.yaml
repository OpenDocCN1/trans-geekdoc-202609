    \ \\\\\\\\ \\\\end{array}$$  \n\nIn the simplest models, *R*[0] can be estimated\
    \ by the rate of infection, *r*[0], and the estimated length of the infection,\
    \ *L*, where\n\n$$\\\\begin{array}{r} {R\\_{0} \\\\approx 1 + r\\_{0}L.} \\\\\\\
    \\ \\\\end{array}$$  \n\nThus for the model shown in [Figure 2.7](#chapter2.xhtml#fig2_7),\
    \ if we estimate *r*[0] ≈ .017 and *L* = 21 days then *R*[0] ≈ 1.357.\n\nIf instead,\
    \ immunity is present and thus recovery acts as an absorbing state, one might\
    \ see a behavior such as in [Figure 2.8](#chapter2.xhtml#fig2_8).\n\n![Figure\
    \ 2.8 Growth of disease under SIR model with immunity.](images/fig2_8.jpg)\n\n\
    [Figure 2.8](#chapter2.xhtml#b2fig2_8) Growth of disease under SIR model with\
    \ immunity.\n\nIn this case, let's assume that the transition matrix is\n\n$$\\\
