    \n为了更详细地观察米特多项式，我们来看多项式的导数：\n\n$$\\begin{array}{r} {y = a\\_{0} + a\\_{1}x + \\\
    \\ldots + a\\_{n}x^{n}.} \\\\\\\\ \\\\end{array}$$  \n\n如果\n\n$$\\begin{array}{l}\
    \ {A = \\\\left( \\begin{array}{l} a\\_{0} \\\\ a\\_{1} \\\\ \\\\vdots \\\\\\\\\
    \ a\\_{n} \\\\ \\\\end{array} \\right),} \\\\\\\\ \\\\end{array}$$  \n\n![图 4.2\
    \ [-1, 1]上的前 5 个第一类切比多项式。](images/fig4_2.jpg)\n\n图 4.2 [-1, 1] 上的前 5 个第一类切比多项式。\n\
    \n那么我们记作\n\n$$\\begin{array}{l} {\\\\frac{dA}{dx} = \\\\left( \\begin{array}{l}\
    \ a\\_{1} \\\\ {2a\\_{2}} \\\\ \\\\vdots \\\\ {na\\_{n - 1}} \\\\ 0 \\\\\\\\end{array}\
    \ \\right)} \\\\\\\\ \\\\end{array}$$  \n\n以及\n\n$$\\begin{array}{l} {\\\\frac{d^{2}A}{dx^{2}}\
