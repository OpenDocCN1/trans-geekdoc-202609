    ![Figure 1.9 Directed Graph for SEC-East Football Example.](images/fig1_9.jpg)


    Figure 1.9 Directed Graph for SEC-East Football Example.


    In the case of a directed graph, the adjacency matrix may not be symmetric. For
    example, since Florida defeated Kentucky, Florida is adjacent to Kentucky but
    Kentucky is not adjacent to Florida.


