    在由下式定义的内积下\n\n$$\\begin{array}{r} {< f(x),\\\\, g(x) > = {\\\\int_{-\\infty}^{\\\
    \\infty}e^{- x^{2}}}f(x)\\, dx,}\n\n米特多项式与第一类切比多项式一样，是一组正交函数。第一类切比多项式和米特多项式都是用于插值或曲线拟合的常用族。\n\
    \n## 4.3 牛顿差分\n\n4.1 节介绍了适用于给定插值点的拉格日插值项式。事实上，给定一个未知函数 `f(x)` 和 `n+1` 个插值点 `x[0]<x[1]<…x[n]`，存在唯一的多项式\
    \ `f(x)` 使得\n\n在本节中，我们给出了牛顿插值项式的闭式形式：\n\n$$\\begin{aligned} \\hat{f}(x) &= a_{0}\
    \ \\\\ \\hat{f_{n}}(x) & = a_{0} + a_{1}(x - x_{0}) + a_{2}(x - x_{0})(x - x_{1})\
    \ + \\ldots + a_{n}(x - x_{0})\\cdots(x - x_{n-1}) = a_{0} + \\\\sum_{j = 1}^{n}a_{j}\\\
    end{aligned}$$\n\n其中\n\n$$\\begin{array}{r} {a_{j} = \\\\frac{f(x_{j}) - \\\\\
    hat{f_{j - 1}}(x_{j})}{x_{j} - x_{j-1}}}$$end{array}$$\n\n你可能注意到牛顿插值项式是递归定义的。也就是说，第\
    \ `n` 阶多项式 `fn` 取决于 `f1`、`fn-1`。我们也可以用牛顿差分递归地表示牛顿插值项式。\n\n### 4.3.1 差分插值\n\n`x[i]`\
    \ 和 `x[j]` 之间的阶牛顿差分记作\n\n$$\\begin{array}{r} {f\\lbrack x_{i},x_{j}\\,}}$$ 是`(x[i],\
    \ f(i))` 和 `(x[j], f(j))` 之间的切线斜率。同样，`n+1` 个点 `x[0]<x[1]<…x[n]` 可用于找到二阶差分\n\n\
    $$\\begin{array}{r} {f\\lbrack x_{0},x_{1},\\\\ldots,x_{n}\\rbrack = \\\\frac{f\\\
    lbrack x_{0},x_{1},\\\\ldots,x_{n - 1}\\rbrack - f\\lbrack x_{1},x_{2},\\\\ldots,x_{n}\\\
    rbrack}{x_{0} - x_{n}}}}\\end{array}$$ \n\n通常，牛顿差分以类似于表 4.1 的表格形式给出。\n\n表 4.1\
