    Given a transformation `Y` = `Y(X)`, where `X` and `Y` are of the same dimension,
    the `Jacobian` is


    $$\begin{array}{r} {|J| = \\frac{\partial Y}{\partial X}} \\ \\end{array}$$


    If instead, `y` = `f(X)` is a scalar function of matrix


    $X = \begin{pmatrix} x\_{11} & x\_{12} & \\cdots & x\_{1n} \\ x\_{21} & x\_{22}
