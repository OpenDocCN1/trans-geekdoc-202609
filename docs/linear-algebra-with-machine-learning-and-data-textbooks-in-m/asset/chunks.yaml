- fmt: "\nBecause of the significance of the singular values in determining variance\
    \ in the data, we must determine how many principal components, `p`, to include\
    \ in the model. The best way to do this is by inspecting the correlation matrix\
    \ and omitting small singular values of the correlation matrix, which typically\
    \ have values significantly less than 1.\n\nIn determining a least square regression\
    \ model with all `k` factors integrated into the model, we wish to determine `b`,\
    \ where\n\n$$\\begin{array}{r} {b = {(X^{T}X)}^{- 1}X^{T}y.} \\\\\\\\ \\end{array}$$\n\
    \nIn order to follow this procedure, `X` must be an orthogonal matrix, and thus\
    \ `X`^(*T*)*X` is diagonal.\n\nUnfortunately, most datasets are correlated and\
    \ thus `X` is not an orthogonal matrix. This leads most data scientists to proceed\
    \ with some sort of variable selection and thus replacing the `k` correlated variables\
    \ of `X` with `p` uncorrelated variables, represented by an `n` × `p` matrix `X̃`.\n\
    \nThe Principal Component Regression model `ŷ` = `X̃**`b`* can be determined\
    \ by reducing the principal components used to `p` < `k` such that `X̃` = `Ũ`\
    \ and\n\n$$\\begin{array}{r} {b = {({\\widetilde{X}}^{T}\\widetilde{X})}^{- 1}{\\\
    widetilde{X}}^{T}y.} \\\\\\\\ \\end{array}$$\n\n## 3.6 Linear Discriminant Analysis\n\
    \nLike Principal Component Analysis, **Linear Discriminant Analysis** (LDA) is\
    \ used for dimension reduction. While PCA focuses on determining the principal\
    \ component axes, those axes that maximize the variance of the data, Linear Discriminant\
    \ Analysis also attempts to maximize the spread of the clusters or classes in\
    \ the data.\n\nSomething to note is that many times with PCA the data may not\
    \ be originally clustered into classes; however, it is necessary with LCA to originally\
    \ be identifying classes in the data. \n\nThe idea behind Linear Discriminant\
    \ Analysis is to choose a projection that will spread out the known classes while\
    \ minimizing the scatter, or spread, within each class.\n\nImagine that you have\
    \ two classes of data in ℝ² and you wish to project the data onto a line. If the\
    \ classes are indeed unique, the choice of line on which you choose to project\
    \ does make a difference in terms of between class spread.\n\nFor example, in\
    \ [Figure 3.9](#chapter3.xhtml#fig3_9), the projection of the two classes of data,\
    \ represented by circles and squares, onto the `x`-axis and the line `y` = `2x`*\
    \ do not do a great job of spreading out the two classes, whereas a projection\
    \ onto the line `y` = −���*`x`*, seen in [Figure 3.10](#chapter3.xhtml#fig3_10),\
    \ completely separates the two classes.\n\n![Figure 3.9 Example of projection\
    \ onto the x-axis and the line y = 2x.](images/fig3_9.jpg)\n\n[Figure 3.9](#chapter3.xhtml#b3fig3_9)\
    \ Example of projection onto the `x`-axis and the line `y` = `2x`*.\n\n![Figure\
    \ 3.10 Example of projection onto the line y = - x.](images/fig3_10.jpg)\n\n[Figure\
    \ 3.10](#chapter3.xhtml#b3fig3_10) Example of projection onto the line `y` = −���*`x`*.\n\
    \nLet's assume that there are `n` classes, `C*[1]`,`C*[2]`, …, `C*[*n]`, where\
    \ the `i`^(th) class is of size `N*[i*]`. In addition, assume that each vector,\
    \ `x`, representing an object, has `m` entries and that the line of projection\
    \ will be represented by the unit vector `v`.\n\nThen the\n\n$$\\begin{array}{r}\
    \ {\\\\text{~projection~of~}x\\\\text{~onto~}v = \\\\frac{< v,\\\\, x >v}{||v||^{2}}}\
    \ \\\\\\\\ \\end{array}$$\n\nand the distance that `x` is from the origin is\n\
    \n$$\\begin{array}{r} {v^{T}x.} \\\\\\\\ \\end{array}$$\n\nDefine `μ̃*[i*]` as\
    \ the mean of the projections of vectors in classes `C*[i*]` onto the vector `v`.\
    \ Thus\n\n$$\\begin{array}{r} {{\\widetilde{\\mu}}\\_{i} = {\\\\sum\\\\limits\\\
    _{x \\\\in C\\_{i}}\\\\frac{v^{T}x}{N\\_{i}}} = v^{T}{\\sum\\\\limits\\_{x \\\\\
    in C\\_{i}}\\\\frac{x}{N\\_{i}}} = v^{T}\\mu\\_{i},} \\\\\\\\ \\end{array}$$\n\
    \nwhere `μ*[i*]` is the mean of the vectors in class `C*[i*]`.\n\nGiven two classes\
    \ `C*[1]` and `C*[2]`, we wish to choose a projection that maximizes\n\n$$\\begin{array}{r}\
    \ {|\\\\widetilde{\\mu\\_{1}} - \\\\widetilde{\\mu\\_{2}}|} \\\\\\\\ \\end{array}$$\n\
    \nin order to maximize the spread of the classes; however, this does not minimize\
    \ the spread within classes. The objective of Linear Discriminant Analysis is\
    \ to find a vector `v` that takes each of these criteria into account. In order\
    \ to do this, we will maximize the objective function\n\n$$\\begin{aligned} {J(v)}\
    \ &= \\\\frac{{(\\\\widetilde{\\mu\\_{1}} - \\\\widetilde{\\mu\\_{2}})}^{2}}{{\\\
    sum\\\\limits\\_{x \\\\in C\\_{1}}v^{T}x - \\\\widetilde{\\mu\\_{1}})}^{2}} +\
    \ {\\\\sum\\\\limits\\_{x \\\\in C\\_{2}}v^{T}x - \\\\widetilde{\\mu\\_{2}})}^{2}}}\
    \ \\\\ &= \\\\frac{{(v^{T}\\\\mu_{1} - v^{T}\\\\mu_{2})}^{2}}{{\\sum\\\\limits\\\
    _{x \\\\in C\\_{1}}v^{T}x - \\\\widetilde{\\mu\\_{1}})}^{2}} + {\\\\sum\\\\limits\\\
    _{x \\\\in C\\_{2}}v^{T}x - \\\\widetilde{\\mu\\_{2}})}^{2}}}.} \\\\end{aligned}$$\n\
    \nDefine the within class scatter,\n\n$$\\begin{array}{r} {S\\_{W} = {\\\\sum\\\
    \\limits\\_{i = 1}^{n}{\\sum\\\\limits\\_{x \\\\in C\\_{i}}{(x - \\\\mu_{i}){(x\
    \ - \\\\mu_{i})}^{T}}}} \\\\\\\\ \\end{array}$$\n\nand the between class scatter\
    \ as\n\n$$\\begin{array}{r} {S\\_{B} = (\\\\mu_{1} - \\\\mu_{2}){(\\mu_{1} - \\\
    \\mu_{2})}^{T}.} \\\\\\\\ \\end{array}$$\n\nThen,\n\n$$\\begin{array}{r} {J(v)\
    \ = \\\\frac{v^{T}S\\_{B}v}{v^{T}S\\_{W}}} \\\\\\\\ \\end{array}$$\n\nIn order\
    \ to maximize `J(v)`, we determine where `\\frac{\\partial J}{\\partial v} = 0`.\n\
    \n$$\\begin{array}{r} {\\\\frac{\\partial J}{\\partial v} = \\\\frac{(2S\\_{B}v)(v^{T}S\\\
    _{W}v) - (2S\\_{w}v)(v^{T}S\\_{B}v)}{{(v^{T}S\\_{W}})^{2}}} = 0} \\\\\\\\ \\end{array}$$\n\
    \nwhen `C*[B]*v`(`v^{T}`)*`C*[W]*v`) − (`C*[W]*v`(`v^{T}`)*`C*[B]*v`) =0.\n\n\
    That is, we wish to find `v` such that\n\n$$\\begin{array}{r} {S\\_{B}v - \\\\\
    frac{(S\\_{W}v)(v^{T}S\\_{B}v)}{v^{T}S\\_{W}}} = 0.} \\\\\\\\ \\end{array}$$\n\
    \nIf `C*[W]` is invertible and `\\lambda = \\frac{(v^{T}S\\_{B}v)}{v^{T}S\\_{W}}`,\
    \ `C*[W]^{-1}C*[B]*v=\\lambda v` and `v` is the eigenvector associated with matrix\
    \ `C*[W]^{-1}C*[B]` and eigenvalue `\\lambda`.\n\nAnother way to think about this,\
    \ due to the definition of `C*[B]`, is that for any vector `v`, `C*[B]*v` points\
    \ in the same direction as `μ*[1]` − `μ*[2]`. Therefore, we wish to determine\
    \ `v` such that\n\n$$\\begin{array}{r} {v = S\\_{W}^{- 1}(\\mu_{1} - \\\\mu_{2}).}\
    \ \\\\\\\\ \\end{array}$$\n\nThe concepts described in this section can be generalized\
    \ for a dataset with `n` classes.\n\n1. Find each class `C*[i]`, 2 ≤ `i` ≤ `n`,\
    \ find the mean vector,\n\n$$\\begin{array}{r} {\\\\mu_{i} = {\\\\sum\\\\limits\\\
    _{v \\\\in \\, C_{i}}\\\\frac{v}{N\\_{i}}} \\\\\\\\ \\end{array}}$$\n\n2. Construct\
    \ the within class scatter vector `C*[W]`, where the entries of `C*[W]` are\n\n\
    $$\\begin{array}{r} {{{\\sum\\\\limits\\_{i = 1}^{n}{\\sum\\\\limits\\_{x \\\\\
    in C\\_{i}}{(x - \\\\mu_{i}){(x - \\\\mu_{i})}^{T}}}}.} \\\\\\\\ \\end{array}}$$\n\
    \n3. Construct the between-class scatter matrix `C*[B]`, where the entries of\
    \ `C*[B]` are\n\n$$\\begin{array}{r} {{{\\sum\\\\limits\\_{i = 1}^{n}N\\_{i}}(\\\
    mu_{i} - \\\\mu),}} \\\\\\\\ \\end{array}}$$\n\nwhere `μ` is the mean of all of\
    \ the samples.\n\n4. Determine the eigenvector `v` of `C*[W]^{-1}C*[B]`.\n\n##\
    \ 3.7 CASE STUDY: Digital Humanities\n\nSome digital humanists focus on semantics\
    \ and words that are regularly used or used in a particular context. In this case\
    \ study, we will focus on characteristics of different versions of a story that\
    \ are present or absent in order to determine the story's origin.\n\nThe Star\
    \ Husband Tale was a widely known tale among Native American tribes. The basic\
    \ form of the Star Husband Tale [[45](#refbib.xhtml#refbib45)] tells of two girls\
    \ who are sleeping out in the open during the night. While outside, they see two\
    \ stars, and each girl makes a wish to be married to a star. When they awake,\
    \ both have been transported to the heavens and are married to the stars as they\
    \ wished. One of the star husbands is a young man, and the other is an older man.\
    \ The girls at one point start digging in the heavens and make a hole, and they\
    \ eventually lower themselves down to earth using a rope.\n"
