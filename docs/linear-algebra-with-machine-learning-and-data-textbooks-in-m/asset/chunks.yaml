    # 7Random Matrices and Covariance Estimate\n\nDOI: [10.1201/9781003025672-7](https://doi.org/10.1201/9781003025672-7)\n\
    \n## 7.1 Introduction to Random Matrices\n\nSo far, we have used matrices with\
    \ fixed values to model scenarios in data science. Here we will explore the idea\
    \ of matrices whose entries are determined at random from a probability density\
    \ function. Such a matrix is called a **random matrix** and each entry is consider\
    \ to be a random variable.\n\nFor example, we can define a 3 × 3 matrix, *X*,\
    \ with entries that are randomly distributed with a standard normal distribution,\
    \ *N*(0, 1). One example of a random matrix, *X*, such that *X*[*i*, *j*] ∼ *N*(0, 1)\
    \ is\n\n$$\\\\begin{array}{l} {X = \\\\left( \\\\begin{array}{lll} 0.290226 &\
    \ 0.91635 & 0.0998479 \\\\\\\\ 0.882873 & {- 0.615393} & {- 0.902417} \\\\\\\\\
    \ {- 0.0974429} & {- 0.855375} & {- 0.665516} \\\\\\\\ \\\\end{array} \\\\right).}\
    \ \\\\\\\\ \\\\end{array}$$  \n\nThe matrix *X* is not symmetric; however, matrices\
    \ such as *X**X*^(*T*) and *X* + *X*^(*T*) will always be symmetric matrices with\
    \ real eigenvalues.\n\nA *n* × *n* matrix, *M*, with entries *m*[*i*, *j*] is\
    \ a called a **Wigner matrix** if the entries of *M*, *m*[*i*, *j*] for 1 ≤ *i* ≤ *j* ≤ *n*,\
    \ are randomly i.i.d.\n\nIn this section, we will focus on random matrices whose\
    \ entries come from a Gaussian distribution,\n\n$$\\\\begin{array}{l} {X = \\\\\
    left( \\\\begin{array}{lllll} X\\_{1,1} & X\\_{1,2} & X\\_{1,3} & \\\\ldots &\
    \ X\\_{1,n} \\\\\\\\ X\\_{2,1} & X\\_{2,2} & X\\_{2,3} & \\\\ldots & X\\_{2,n}\
    \ \\\\\\\\ X\\_{3,1} & X\\_{3,2} & X\\_{3,3} & \\\\ldots & X\\_{3,n} \\\\\\\\\
    \ \\\\vdots & \\\\ddots & \\\\ddots & \\\\ddots & \\\\vdots \\\\\\\\ X\\_{m,1}\
    \ & X\\_{m,2} & X\\_{m,3} & \\\\ldots & X\\_{m,n} \\\\\\\\ \\\\end{array} \\\\\
    right),} \\\\\\\\ \\\\end{array}$$  \n\nwhere *X*[*i*, *j*] ∼ *N*(*μ*, *σ*²) are\
    \ i.i.d, 1 ≤ *i* ≤ *m*, 1 ≤ *j* ≤ *n*."
