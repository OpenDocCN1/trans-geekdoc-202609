- fmt: "\nIf the population of country `A` is twice as large as the population of\
    \ country `B`, and we randomly sample four citizens from the combined countries,\
    \ use hidden markov chains to determine the probability that they are from countries\
    \ AABB given that their status is SIRS.\n\n![](images/ufig2_1.jpg)\n\n* After\
    \ thinking about [Example 2.14](#chapter2.xhtml#exam2_14), determine the following\n\
    \    1. `P`(`O[1]` = `Sad`)\n    2. `P`(`O[1]` = `Sad`, `O[2]` = `Sad`)\n    3.\
    \ `P`(`O[1]` = `Sad`, `O[2]` = `Sad`, `O[3]` = `Happy`)\n    4. The maximum likelihood\
    \ of the observation sequence {Sad`, `Sad`, `Happy`} occurring.\n    5. The most\
    \ likely hidden sequence given that Rath is {Sad`, `Sad`, `Happy`}.\n\n* In the\
    \ theme of attempting to find the best model, use the information from [Example\
    \ 2.16](#chapter2.xhtml#exam2_16), apply the Baum-Welch Algorithm one additional\
    \ time in order to find a new model `λ` = (`π`, `T`, `E`).\n\n* Doctors are trying\
    \ to determine the original genetic making up of their patients given mutated\
    \ DNA sequences collected from biopsied patients. You are given a mutated DNA\
    \ sequence, `ATG` where, A (adenine), C (cytosine), G (guanine), and T (thymine).\
    \ The transmission matrix, `T`, and emissions matrix, `E`, are as follows.\n\n\
    $$\\begin{array}{l} {T = E = \\left( \\begin{array}{lllll} & A & C & G & T \\\\\
    \ A & .40 & .225 & .400 & .252 \\\\ C & .20 & .325 & .100 & .223 \\\\ G & .15\
    \ & .300 & .200 & .177 \\\\ T & .25 & .150 & .300 & .348 \\\\ \\end{array} \\\
    right)} \\\\ \\end{array}$$\n\nIn addition, assume that the four state, A, C,\
    \ G, and T, are equally likely. Determine the likelihood of the observation sequence\
    \ `ATG` using the forward algorithm.\n\n* Using the information from Exercise\
    \ 7 and the Forward/Backward algorithm, find the most likely original molecular\
    \ structure of the genetic code with the four possible hidden state, A (adenine),\
    \ C (cytosine), G (guanine), and T (thymine).\n\n# 3SVD and PCA\n\nDOI: [10.1201/9781003025672-3](https://doi.org/10.1201/9781003025672-3)\n\
    \nLike [Chapter 1](#chapter1.xhtml), this chapter on clustering techniques and\
    \ their application to data science. [Chapter 1](#chapter1.xhtml) relies heavily\
    \ on powers of matrices, eigenvalues, and eigenvectors, which are only relevant\
    \ for square matrices. This chapter digs deeper into techniques that are more\
    \ practical in terms, not imposing the limitation that matrices must be square.\n\
    \nWe begin with an overview of vector and inner product spaces since orthogonality\
    \ is pertinent in the discussion of further topics in the chapter.\n\n## 3.1 Vector\
    \ and Inner Product Spaces\n\nA set of vectors, `V`, under defined vector addition\
    \ and scalar multiplication is called a **vector space** if the following properties\
    \ hold.\n\n1. `V` is closed under vector addition.\n2. `V` is closed under scalar\
    \ multiplication.\n3. For all `u` and `v` in `V`, `u` + `v` = `v` + `u`。\n4. For\
    \ all `u,v` and `w` in `V`,\n$$\\begin{array}{r} {(u + v) + w = u + (v + w).}\
    \ \\\\ \\end{array}$$\n5. There exists an unique additive identity in `V`.\n6.\
    \ Every vector `u` ∈ `V` has an additive inverse  − `u` ∈ `V`。\n7. For each vector\
    \ `u` ∈ `V`, 1 ⋅ `u` = `u`。\n8. For all `u` and `v` in `V` and scalar `k`, `k`(`u` + `v`) = `k`**u* + `k`**v`。\n\
    9. For all `u` in `V` and scalars `k` and `l`, (`k` + `l`)*u` = `k`**u* + `l`**u`。\n\
    10. For all `u` and `v` in `V` and scalar `k`, `k`(*l`)*u`.\n\nAn **inner product**\
    \ on a set `V` is a function that maps pairs (`x`, `y`) ∈ `V`× `V` to a number\
    \ `<x`, `y>` while satisfying the following properties:\n\n1. For all `v` ∈ `V`,\
    \ `<v`, `v>` ≥ 0 and `<v`, `v>` = 0 if and only if $v = \\overset{\\rightarrow}{0}$.\n\
    2. For all `u,v`, and `w` ∈ `V`, `<u`, `v>` + `<u`, `w>` = `<u`, `w>`.\n3. For\
    \ all `u`, `v` ∈ `V` and scalars `k`, `<k`u`, `v>` = `<u`, `v>`.\n4. For all `u`,\
    \ `v` ∈ `V`, `< u,v > = \\overline{v,u>}$.\n\nA vector space with a defined inner\
    \ is called an **inner product space**. In an inner product space, `V`, a set\
    \ of vectors is called **orthogonal** if for each pair of vectors `v` and `w`\
    \ in `V`,\n$$\\begin{array}{r} {< v,w > = 0}$$\n\nIf a set of vectors in `V` is\
    \ orthogonal and each vector is a unit vector, then the set is called **orthonormal**.\n\
    \n## 3.2 Singular Values\n\nWhen studying data in which each data point has a\
    \ large number of attributes, it may be helpful to be able to reduce or compress\
    \ the number of attributes. That is, we may start with data points in ℝ(`n`) and\
    \ want to project the data points into ℝ(`m`) where `n`>m`.\n\nIn order to do\
    \ so, it is important to reflect on which of the `n` attributes are significant\
    \ to the data set. We begin this investigation with a review of some linear algebra\
    \ terms, linear independence, span, and an interpretation of the visual aspects\
    \ of eigenvectors.\n\nRecall that a set of vectors `{v[1],`v[2],…,`v[m]}` is **linearly\
    \ independent** if and only if the system of equations\n$$\\begin{array}{r} {k_{1}v_{1}\
    \ + k_{2}v_{2} + \\cdots + k_{m}v_{m} = \\overset{\\rightarrow}{0}} \\end{array}$$\n\
    has only the trivial solution, `k[1]` = `k[2]` = ⋯= `k[m]` = 0. Otherwise, we\
    \ say that the set is **linearly dependent**. If the vectors `v[1],`v[2],…,`v[m]` ∈ℝ(`n`),\
    \ then this system can be written as\n$$\\begin{matrix} & {Ax = b} \\\\ {\\begin{pmatrix}\
    \ v_{1} & v_{2} & \\cdots & v_{m} \\\\ \\end{pmatrix}\\begin{pmatrix} k_{1} \\\
    \\ k_{2} \\\\ \\vdots \\\\ k_{m} \\\\ \\end{pmatrix}} & {= \\begin{pmatrix} 0\
    \ \\\\ 0 \\\\ \\vdots \\\\ 0 \\\\ \\end{pmatrix}.} \\end{matrix}$$\n\nThis is\
    \ equivalent to saying that the matrix `A`, whose columns are `v[1],`v[2],…,`v[m]`,\
    \ is invertible.\n\nIf `w` is a vector in ℝ(`n`) and there exists constant `k[1],`k[2],…,`k[m]`\
    \ such\n$$\\begin{array}{r} {w = k_{1}v_{1} + k_{2}v_{2} + \\cdots + k_{m}v_{m},}\
    \ \\end{array}$$\nwe say that `w` can be written as a **linear combination** and\
    \ is in the **span** of the vectors `v[1],`v[2],…,`v[m]`.\n\nThe set `S` = {*v[1],`v[2],…,`v[m]}`\
    \ is a **basis** for a vector space `V` if `S` is linearly dependent and if every\
    \ vector in `V` is in the span of `S`.\n\nLet `A` be an *n* × *n* matrix and `T[A]`ℝ(`n`)→ℝ(`n`)\
    \ be a linear transformation with standard matrix `A`, defined as `T[A](x)` = `A*x`.\
    \ Then, based on the definition of an eigenvalue `λ`, any basis vector `x` for\
    \ the eigenspace corresponding to the eigenvector `λ`, will be dilated or contracted\
    \ by a factor of `λ` under the transform `T[A]`; however, the direction of `x`\
    \ will remain unchanged.\n"
