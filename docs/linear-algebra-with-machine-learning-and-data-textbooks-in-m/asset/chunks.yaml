    ## 7.6 Random Matrices and the Relationship to the Covariance


    There are some particular random matrices of interest that we will explore in
    this section. We first define a real symmetric $m \times m$ random matrix


    $$\begin{array}{r} {M = XX^{T} = {\sum\limits\_{j = 1}^{n}X_{j}}X_{j}^{T}} \end{array}$$


    where $X$ is a $m \times n$ random matrix, with columns $X[j]$, $1 \leq j \leq
    n$, are formed from independent samples of size $m$ from i.i.d. random variables.
    The matrix $M$ is called a **real Wishart matrix**. If these random variables
    are Gaussian each with mean 0 and covariance


    $$\begin{array}{r} {\Sigma = {\sum{(X - \overline{X})}}{(X - \overline{X})}^{T},}
    \end{array}$$


    then $M$ is a **Gaussian Wishart matrix** and is denoted $W[p](n, \Sigma)$, and
    has a probability distribution,


    $$\begin{array}{r} {f(M) = \frac{1}{{(2\pi)}^{mn/2}\Gamma_{p}(\frac{n}{2})|\Sigma|^{n/2}}|M|^{(n
    - p - 1)/2}e^{- \frac{1}{2}Tr(\Sigma^{- 1}M)}} \end{array}$$


    Here $\Gamma[p](n)$ is the multivariate gamma function.


    $$\begin{array}{r} {\Gamma(x) = {\int_{0}^{\infty}y^{x - 1}}e^{- y}dy.} \end{array}$$


    Notice that since $M$ is symmetric, all of the eigenvalues, $\lambda[1], \lambda[2],
    \dots, \lambda[m]$ of $M$ are real.


    In [Section 3.5](#chapter3.xhtml#sec3_5), we talked about the covariance and correlation
    matrices. Given a data set, $X$, the empirical covariance matrix can be found
    by finding


    $$\begin{array}{r} {XX^{T}.} \end{array}$$


    The empirical covariance matrix is different than the true, statistical, correlation
    matrix, $C$. If there are a large number of observation then, in fact, the empirical
    covariance matrix will be to the true covariance matrix.


    ## 7.7 CASE STUDY: Finance and Brownian Motion


    In this case study, we will discuss how the covariance and correlation matrices
    relate to random matrices through a financial lens.


    The unconditional probability distribution for any traded financial commodity
    (such as stocks, currencies, interest rates) is far from a Gaussian distribution.
    This unconditional probability distribution tends to follow a distribution similar
    to a **Rayleigh distribution** or more generally a **power law** distribution,
    called the **Tracy-Widom distribution**.


    The general form of a Rayleigh probability density function is


    $$\begin{array}{r} {f(x) = \frac{x}{\sigma^{2}}e^{\frac{- x^{2}}{2\sigma^{2}}},,
    0 \leq x < \infty,} \end{array}$$


    where $E(X) = \sigma\sqrt{\frac{\pi}{2}}$ and $Var(X) = \left( \frac{4 - \pi}{2}
    \right)\sigma^{2}$.


    Some examples of this probability distribution can be see in [Figure 7.8](#chapter7.xhtml#fig7_8).


    ![Figure 7.8 Examples of Rayleigh Distributions with different scaling factors.](images/fig7_8.jpg)


    [Figure 7.8](#chapter7.xhtml#b7fig7_8) Examples of Rayleigh Distributions with
    different scaling factors.


    The largest eigenvalue of a random Gaussian Ensemble matrix and its corresponding
    eigenvector can be interpreted as the collective response of the market to external
    factors, so it can be compared with the market index.


