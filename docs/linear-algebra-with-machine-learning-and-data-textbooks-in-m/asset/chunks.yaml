    \ 2.2 Hidden Markov Models\n\nMarkov chains are extremely helpful when we wish\
    \ to determine a sequence of events based on probabilities of observed behaviors.\
    \ However, there are times when we wish to make predictions but these probabilities\
    \ are not already clear or observed. In this case, we say that we have a **Hidden\
    \ Markov Model, HMM**. We begin with an example,\n\nThe question posed in [Example\
    \ 2.8](#chapter2.xhtml#exam2_8) is one of three common questions that are addressed\
    \ by hidden Markov models. These questions fit into three general categories\n\
    \n1.  **The Likelihood Problem—determining the probability of an observation sequence\
    \ given a model**.\n\n2.  **The Decoding Problem—determining the most likely sequence\
    \ of events given an observation sequence**.\n\n3.  **The Learning Problem—determining\
    \ the most likely model (with parameters) given the observation sequence.**\n\n\
    ### 2.2.1 The Likelihood Problem\n\nBecause we will have to use prior information\
    \ to make some inferences in a hidden markov model, a strong understanding of\
    \ **Bayes Theorem** is essential.\n\nTwo events, *X*[1] and *X*[2], are **mutually\
    \ exclusive** if\n\n$$\\\\begin{array}{r} {X\\_{1} \\\\cap X\\_{2} = \\\\varnothing.}\
