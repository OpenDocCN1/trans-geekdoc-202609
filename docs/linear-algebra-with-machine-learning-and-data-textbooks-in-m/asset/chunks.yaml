    在更实际术语中，正如本章前面提到的，隐马尔可夫模型经常用于语音和手写字识别。智能手机内置了软件可以在你输入文本时建议单词并自动纠正单词。


    我们将在这个案例研究中深入探讨隐马尔可夫链如何应用于自动纠错或自动补全。假设我们观察的词集（即我们查看的文本中的词）是：


