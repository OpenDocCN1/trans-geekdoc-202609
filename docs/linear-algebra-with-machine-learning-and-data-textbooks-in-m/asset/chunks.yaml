    ## 5.7 案例研究：泊松回归与计数\n\n假设一个实验包括在 `T` 时间段内每天统计确认的 COVID-19 病例数。\n\n定义 `Y`[`t]`\
    \ 为第 `t` 天新增确病例数的随机变量，其中 `t`=1,2,…`T`。因此 `Y`[`t]` 的概率密度函数为\n\n$$L(Y\\_{t}| t,\
    \ a_{0}, a_{1}) = \\prod\\limits\\_{t = 1}^{T}\\frac{(a_{0} + a_{1}t)^{Y_{t}}}{Y_{t}!}e^{-(a_{0}\
    \ + a_{1}t)}$$\n\n其中均值 $$E(Y\\_{t}| t, a_{0}, a_{1}) = \\lambda = a_{0} + a_{1}t).$$\n\
    \n该案例研究的数据来自安大略政府网站，涵盖了 2020 年和 2021 年的 500,000 例 COVID-19 病例。这里显示了该数据的一个样本。鼓励读者进一步探索这些数据。表\
