    \\\\ \\\\vdots \\\\\\\\ {f\\\\lbrack x\\_{n}\\\\rbrack} \\\\\\\\ \\\\end{array}\
    \ \\\\right).} \\\\\\\\ \\\\end{array}$$  \n\n## 4.4 Chebyshev Interpolation\n\
    \nFor the interpolating techniques presented in this chapter thus far, we have\
    \ assumed that interpolating points are given. There are instances where you are\
    \ able to choose the interpolating points or that equally spaced interpolating\
    \ points can be transformed onto another set of points.\n\n**Chebyshev interpolation**\
    \ is a method when *n* interpolating points are located at the **Chebyshev nodes**,\
    \ the roots of the *n*^(th) degree Chebyshev polynomial of the first kind, *T*[*n*](*x*),\n\
    \n$$\\\\begin{array}{r} {x\\_{k} = cos\\\\left( \\\\frac{(2k + 1)\\\\pi}{2n} \\\
    \\right),k = 0,\\\\, 1,\\\\, 2,\\\\,\\\\ldots,\\\\, n - 1.} \\\\\\\\ \\\\end{array}$$\
    \  \n\nAn *n*^(th)\\-degree polynomial, *p*(*x*), interpolating a function *f*(*x*),\
    \ can be written as the sum of Chebyshev polynomials of the first kind,\n\n$$\\\
    \\begin{array}{r} {p(x) = \\\\frac{1}{2}c\\_{0}T\\_{0}(x) + {\\\\sum\\\\limits\\\
    _{i = 1}^{n}c\\_{i}}T\\_{i}(x),} \\\\\\\\ \\\\end{array}$$  \n\nwhere\n\n$$\\\\\
    begin{array}{r} {c\\_{i} = \\\\frac{2}{n}{\\\\sum\\\\limits\\_{k = 0}^{n}f}(x\\\
    _{k})T\\_{i}(x\\_{k}).} \\\\\\\\ \\\\end{array}$$  \n\n![Figure 4.5 Example of\
    \ Chebyshev interpolation of f(x) = \\\\frac{1}{1 + x^{2}}.](images/fig4_5.jpg)\n\
    \nFigure 4.5 Example of Chebyshev interpolation of $f(x) = \\\\frac{1}{1 + x^{2}}$.\n\
    \nIt is important to note that Chebyshev interpolation is traditionally meant\
    \ to be conducted on the interval \\[ − 1, 1\\] since the roots of the Chebyshev\
    \ polynomials are on the unit circle. Thus, if you intended to use Chebyshev interpolation\
    \ on an interval \\[*a*, *b*\\] you must first create a linear transformation\n\
    \n$$\\\\begin{array}{r} \\\\left. \\\\mathcal{T}:\\\\lbrack - 1,\\\\, 1\\\\rbrack\\\
    \\rightarrow\\\\lbrack a,\\\\, b\\\\rbrack,\\\\text{~where~}u( - 1) = a\\\\text{~and~}u(1)\
    \ = b. \\\\right. \\\\\\\\ \\\\end{array}$$  \n\nIf *u* = *α**x* + *β* then\n\n\
    $$\\\\begin{array}{r} {a = - \\\\alpha + \\\\beta,b = \\\\alpha + \\\\beta} \\\
    \\\\\\ \\\\end{array}$$  \n\nand $u = \\\\frac{b - a}{2}x + \\\\frac{b + a}{2}$.\n\
    \n![Figure 4.6 Example of Chebyshev interpolation of f(x) = e^{x} on \\\\lbrack\
    \ - 1,\\\\, 3\\\\rbrack.](images/fig4_6.jpg)\n\nFigure 4.6 Example of Chebyshev\
    \ interpolation of *f*(*x*) = *e*^(*x*) on \\[ − 1, 3\\].\n\nIt may seem obscure\
    \ to be able to choose interpolation points at the Chebyshev nodes; however, Chebyshev\
    \ interpolation is used extensively in numerical analysis, particularly in creating\
    \ filters, due to it's ability to minimize **Runge's phenomenon**.\n\nRunge's\
    \ phenomenon occurs with polynomial interpolants of high degree over a set of\
    \ equally spaced interpolation points. Runge's phenomenon is when the interpolant\
    \ matches the desired function or data extremely well in the middle of the interpolation\
    \ interval and begins to oscillate at the edges of the interval. This phenomena\
    \ should be considered when deciding to increase the degree of your polynomial\
    \ interpolant. An example of Runge's phenomenon can be seen in [Figure 4.7](#chapter4.xhtml#fig4_7).\n\
    \n![Figure 4.7 Example of Runge's phenomenon with f(x) = \\\\frac{1}{1 + 25x^{2}}\
    \ on \\\\lbrack - 1,\\\\, 1\\\\rbrack with 5th and 9th degree interpolants.](images/fig4_7.jpg)\n\
    \n[Figure 4.7](#chapter4.xhtml#b4fig4_7) Example of Runge's phenomenon with $f(x)\
    \ = \\\\frac{1}{1 + 25x^{2}}$ on \\[ − 1, 1\\] with 5^(th) and 9^(th) degree interpolants.\n\
    \n## 4.5 Hermite Interpolation\n\nThus far we have been focusing on creating an\
