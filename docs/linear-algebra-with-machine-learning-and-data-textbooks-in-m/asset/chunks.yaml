    \ \\vdots \\\\\\\\ {f\\\\lbrack x\\_{n}\\\\rbrack} \\\\\\\\ \\\\end{array} \\\
    right)} \\\\ \\\\\\end{array}$$\n\n### 4.4. 切雪比插值\n\n对于本章为止介绍的插值技术，我们假设插值点是给定的。某些情况下，你可以选择插值点，或者等间距插值点可以转换为另一组点。\n\
