  trans: "\n通常，应用中具有重要意义的随机矩阵根据其元素是实数、复数还是四元数随机变量，分为三大类。在本章中，我们将关注这三种类型的随机矩阵以及它们特征值的行为。\n\
    \n在深入研究这三类随机矩阵之前，我们将探索随机性对线性代数算法稳定性的影响。\n\n## 7.2 稳定性\n\n我们已经学习过，在线性代中，如果矩阵 `A`\
    \ 是可逆矩阵，那么方程 `Ax = b` 有唯一解，\n\n$$\\begin{array}{r} {x = A^{- 1}b.} \\\\\\\\ \\\
    end{array}$$\n\n然而，当处理随机矩阵 `A + E` 时，其中 `E[i, j] ~ N(μ, σ²)`，计算解可能是错误的或不存在的，通常是由于舍入误差引起的。\n\
    \n矩阵 `A` 的**条件数** `κ(A)` 是一个表示线性方程 `Ax = b` 的解 `x` 随 `b` 的变化而变化速度的数值。\n\n$$\\\
    begin{array}{l} {\\kappa(A) = \\left\\{ \\begin{array}{ll} {||A|| \\cdot ||A^{-\
    \ 1}||,} & {\\text{~if~}A\\,\\text{is~invertible~}}} \\\\\\\\ {\\infty,} & {\\\
    text{~otherwise}\\{.}} \\\\\\\\ \\end{array}~ \\right.} \\\\\\\\ \\end{array}$$\n\
    \n在处理条件数较高的矩阵时，求解与该矩阵相关的问题，结果的准确性会较低。这包含了矩阵特征系统的稳定性。\n\n矩阵 `A` 的**伪谱**（pseudospectrum）是\
    \ `A + E` 的特征值族。\n\n通常，数据科学家处理带有误差的矩阵，也称为**噪声矩阵**。正因如此，噪声矩阵的伪谱具有特别的研究价值。\n\n![图\
    \ 7.1 伪谱的可视化。](img/fig7_1.jpg)\n\n图 7.1 伪谱的可视化。\n\n![图 7.2 伪谱的可视化，\\sigma^{2}\
    \ = 0,\\text{\\textbackslash}.01,\\text{\\textbackslash}.25.](img/fig7_2.jpg)\n\
    \n图 7.2 伪谱的可视化，`σ² = 0, .01, .25.`\n\n在本章的剩余部分，我们将观察随机矩阵族及其各自的特征值。\n\n## 7.3 高斯正交系\n\
    \n数据矩阵族模型被称为**矩阵系**（matrix ensembles）。\n\n回想第 5 章，如果 `X` 和 `Y` 是独立同分布随机变量，其中 `X,\
    \ Y ~ N(μ, σ²)`，那么 `X` 和 `Y` 的联合分布为：\n\n$$\\begin{array}{r} {\\left. f_{XY}(x,y)\
    \ \\right.\\sim N\\left( {\\μ,\\frac{\\sigma^{2}}{2}} \\right).} \\\\\\\\ \\end{array}}$$\
    \ \n\n在本节中，我们希望观察 `X` 和 `Y` 的线性组合分布，例如 `X + Y` 或 $\\frac{X}{2}$，其中 `X` 和 `Y` 是随机矩阵，以及与它们相关的特征值。\n\
    \n如果 `X` 是一个满足 `X[i, j] ~ N(0, 1)` 的随机矩阵，那么\n\n$$\\begin{array}{r} {H = \\frac{X\
    \ + X^{T}}{2}} \\\\\\\\ \\end{array}$$\n\n是一个对称随机矩阵，这种对称随机矩阵的概率分布被称为**高斯正交系 (GOE)**。\n\
    \n之前的两个引理告诉我们关于 GOE 矩阵元素的联合分布。有趣的是，我们将进一步探索 GOE 随机矩阵的特征值及其特征值间距。\n\n对于一个来自 GOE\
    \ 的通用 2×2 随机矩阵，\n\n$$\\begin{array}{l} {X = \\left( \\begin{array}{ll} X_{1} &\
    \ X_{2} \\\\ X_{2} & X_{3} \\end{array} \\right),} \\\\\\\\ \\end{array}$$\n\n\
    其中 `X[1],X[3] ~ N(0, 1)` 且其元素是独立同分布的，`X` 的特征值为：\n\n$$\\begin{array}{r} {\\frac{1}{2}Tr(X)\
    \ \\pm \\sqrt{(X_{1} - X_{3})}^{2} + 4X_{2}^{2}}} \\\\\\\\ \\end{array}$$\n\n\
    因此，`X` 的均值可以在图 7.3 中看到。\n\n![图 7.3 2×2 随机矩阵特征值的分布。](img/fig7_3.jpg)\n\n图 7.3 2×2\
    \ 随机矩阵特征值的分布。\n\n![图 7.4 GOE 随机矩阵特征值的分布。](img/fig7_4.jpg)\n\n图 7.4 GOE 随机矩阵特征值的分布。\n\
    \n**Marchenko-Pastur 定律**（Marchenko-Pastur Law）是来自 GOE 的随机矩阵的一种性质。\n\n![图 7.5\
    \ GOE 矩阵的奇异值的可视化。](img/fig7_5.jpg)\n\n图 7.5 GOE 矩阵的奇异值的可视化。\n\n科学家们对 GOE 矩阵的特征值分布更感兴趣。Wigner\
    \ 判据（Wigner's criterion）描述了特征值间的能级排斥（level repulsion）。在这种情况下，Wigner 判据指出特征值的间距分布遵循：\n\
    \n$$\\begin{array}{r} {p(s) = \\frac{s^{2}}{k^{2}}e^{\\frac{- s^{2}}{2k^{2}}}}\
    \ \\\\\\\\ \\end{array}$$\n\n其中 `k` 是一个尺度参数。\n\n"
