    \ and is denoted by |*E*|.\n\nAn edge is said to be **incident** to vertices *v*[*i*]\
    \ and *v*[*j*] if it connects the two vertices. We call vertices *v*[*i*] and\
    \ *v*[*j*] **endpoints** of this edge.\n\nVertex *v*[*i*] is said to be **adjacent**\
    \ to vertex *v*[*j*] if there is an edge incident to both vertex *v*[*i*] and\
    \ vertex *v*[*j*]. The **degree** of a vertex is the number of incident edges\
    \ to that vertex.\n\nNotice that in the graph in [Figure 1.1](#chapter1.xhtml#fig1_1),\
    \ |*V*| = 6 and |*E*| = 12. Vertex *v*[4] is adjacent to every other vertex while\
