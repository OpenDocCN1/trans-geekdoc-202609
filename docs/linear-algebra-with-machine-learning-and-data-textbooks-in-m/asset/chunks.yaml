    # 致谢


    我要感谢埃隆大学的教职员工，特别是数学系的创新教学。许多学生通过本科研究为项目的成功做出了贡献。感谢 Amy Moore, Abby Weber, Matthew
    Davenport, Rachel Dietert, Katie Everitt, Lauren Hanchar, Mary Hermes, Xuan Huynh,
    Adam Jockle, Gautam Kotwal, Clayton McLamb, Maia Sirabian, Sarina Smith, William
