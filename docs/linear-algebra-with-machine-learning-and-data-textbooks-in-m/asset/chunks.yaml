    \ generated using the recursive definition\n\n$$\\\\begin{array}{r} {H\\_{n}(x)\
    \ = xH\\_{n - 1}(x) - nH\\_{n - 2}(x),} \\\\\\\\ \\\\end{array}$$  \n\nUnder the\
    \ inner product defined by\n\n$$\\\\begin{array}{r} {< f(x),\\\\, g(x) > = {\\\
    \\int\\_{- \\\\infty}^{\\\\infty}e^{- x^{2}}}f(x)g(x)\\\\, dx,} \\\\\\\\ \\\\\
    end{array}$$  \n\nthe Hermite polynomials, like the Chebyshev polynomials of the\
    \ first kind, are an orthogonal set of functions.\n\nBoth the Chebyshev polynomials\
    \ of the first kind and the Hermite polynomials are popular families of functions\
    \ used for interpolating, or curve fitting, of data.\n\n## 4.3 Newton's Divided\
    \ Difference\n\n[Section 4.1](#chapter4.xhtml#sec4_1) presents Lagrange interpolating\
    \ polynomials which fit exactly to a given set of interpolating points. In fact,\
    \ given an unknown function *f*(*x*) and *n* + 1 interpolating points, *x*[0] < *x*[1] < … < *x*[*n*],\
    \ there is a unique polynomial *f̂*(*x*) such that\n\n$$\\\\begin{array}{r} {\\\
    \\hat{f}(x\\_{j}) = f(x\\_{j}),\\\\, 0 < j < n.} \\\\\\\\ \\\\end{array}$$  \n\
    \nIn this section, we present several closed forms for the **Newton's interpolating\
    \ polynomial**, *f̂*(*x*).\n\nLet $\\\\hat{f\\_{1}}(x) = a\\_{0}$ and\n\n$$\\\\\
    begin{aligned} {\\\\hat{f\\_{n}}(x)} & {= a\\_{0} + a\\_{1}(x - x\\_{0}) + a\\\
    _{2}(x - x\\_{0})(x - x\\_{1}) + \\\\ldots + a\\_{n}(x - x\\_{0})(x - x\\_{1})\\\
    \\cdots} \\\\\\\\ & {\\\\text{\\\\quad\\\\quad}(x - x\\_{n})} \\\\\\\\ & {= a\\\
    _{0} + {\\\\sum\\\\limits\\_{j = 1}^{n}a\\_{j}}{\\\\prod\\\\limits\\_{i = 0}^{j\
    \ - 1}{(x - x\\_{i})}},} \\\\\\\\ \\\\end{aligned}$$  \n\nwhere\n\n$$\\\\begin{array}{r}\
    \ {a\\_{j} = \\\\frac{f(x\\_{j}) - {\\\\hat{f}}\\_{j - 1}(x\\_{j})}{\\\\prod\\\
    \\limits\\_{i = 0}^{j - 1}{(x\\_{j} - x\\_{i})}}.} \\\\\\\\ \\\\end{array}$$ \
    \ \n\nYou might have noticed that Newton's interpolating polynomials are defined\
    \ recursively. That is, that the definition of the *n*^(th) degree polynomial,\
    \ *f̂*[*n*](*x*), depends on *f̂*[1](*x*), …, *f̂*[*n* − 1](*x*).\n\nWe can also\
    \ write Newton's interpolating polynomials, recursively, in terms of **Newton's\
    \ divided differences**.\n\n### 4.3.1 Newton's Interpolation via Divided Difference\n\
    \nThe first **Newton's divided difference** between *x*[*i*] and *x*[*j*], denoted\n\
    \n$$\\\\begin{array}{r} {f\\\\lbrack x\\_{i},x\\_{j}\\\\rbrack,} \\\\\\\\ \\\\\
    end{array}$$  \n\nis the slope of the tangent line between (*x*[*i*], *f*(*x*[*i*]))\
    \ and (*x*[*j*], *f*(*x*[*j*])),\n\n$$\\\\begin{array}{r} {f\\\\lbrack x\\_{i},x\\\
    _{j}\\\\rbrack = \\\\frac{f(x\\_{i}) - f(x\\_{j})}{x\\_{i} - x\\_{j}}.} \\\\\\\
    \\ \\\\end{array}$$  \n\nSimilarly, *n* + 1 points *x*[0] < *x*[1] < … < *x*[*n*]\
    \ can be used to find the second divided difference,\n\n$$\\\\begin{array}{r}\
    \ {f\\\\lbrack x\\_{0},x\\_{1},\\\\ldots,x\\_{n}\\\\rbrack = \\\\frac{f\\\\lbrack\
    \ x\\_{0},x\\_{1},\\\\ldots,x\\_{n - 1}\\\\rbrack - f\\\\lbrack x\\_{1},x\\_{2},\\\
    \\ldots,x\\_{n}\\\\rbrack}{x\\_{0} - x\\_{n}}.} \\\\\\\\ \\\\end{array}$$  \n\n\
    Typically, Newton's divided differences are presented in a table similar to the\
    \ one seen in [Table 4.1](#chapter4.xhtml#tbl4_1).\n\n[Table 4.1](#chapter4.xhtml#b4tbl4_1)\
    \ Divided Difference where *Δ**x* = 1.\n\n| *f*\\[*x*[0]\\] = 3 ||  ||  ||  |\n\
    \n| --- | --- | --- | --- |\n\n|  || *f*\\[*x*[0], *x*[1]\\] =  − 1 ||  ||  |\n\
    \n|  ||  || $f\\\\lbrack x\\_{0},x\\_{1},x\\_{2}\\\\rbrack = \\\\frac{- 3 + 1}{2}\
    \ = - 1$ ||  |\n\n| *f*\\[*x*[1]\\] = 2 ||  ||  ||  |\n\n|  || *f*\\[*x*[1], *x*[2]\\\
    ] =  − 3 ||  || $f\\\\lbrack x\\_{0},x\\_{1},x\\_{2},x\\_{3}\\\\rbrack = \\\\\
    frac{4.5 + 1}{3}$ |\n\n| *f*\\[*x*[2]\\] =  − 1 ||  ||  ||  |\n\n|  ||  || $f\\\
    \\lbrack x\\_{1},x\\_{2},x\\_{3}\\\\rbrack = \\\\frac{6 + 3}{2} = 4.5$ ||  |\n\
    \n|  || *f*\\[*x*[3], *x*[2]\\] = 6 ||  ||  |\n\n| *f*\\[*x*[3]\\] = 5 ||  ||\
    \  ||  |\n\nApplying the concepts of divided difference, Newton's interpolating\
    \ polynomials can be written as\n\n$$\\\\begin{aligned} {\\\\hat{f\\_{1}}(x)}\
    \ & {= a\\_{0} + a\\_{1}(x - x\\_{0}) = f(x\\_{0}) + (x - x\\_{0})f\\\\lbrack\
    \ x\\_{0},x\\_{1}\\\\rbrack} \\\\\\\\ {\\\\hat{f\\_{2}}(x)} & {= a\\_{0} + (x\
    \ - x\\_{0})f\\\\lbrack x\\_{0},x\\_{1}\\\\rbrack + (x - x\\_{0})(x - x\\_{1})f\\\
    \\lbrack x\\_{0},x\\_{1},x\\_{2}\\\\rbrack} \\\\\\\\ {\\\\hat{f\\_{3}}(x)} & {=\
    \ a\\_{0} + (x - x\\_{0})f\\\\lbrack x\\_{0},x\\_{1}\\\\rbrack + (x - x\\_{0})(x\
    \ - x\\_{1})f\\\\lbrack x\\_{0},x\\_{1},x\\_{2}\\\\rbrack} \\\\\\\\ & {+ (x -\
    \ x\\_{0})(x - x\\_{1})(x - x\\_{2})f\\\\lbrack x\\_{0},x\\_{1},x\\_{2},x\\_{3}\\\
    \\rbrack} \\\\\\\\ \\\\end{aligned}$$  \n\n![Figure 4.4 Data with \\\\hat{f\\\
    _{1}}(x),\\\\,\\\\hat{f\\_{2}}(x),\\\\,\\\\hat{f\\_{3}}(x) from Example 4.5.](images/fig4_4.jpg)\n\
    \nFigure 4.4 Data with $\\\\hat{f\\_{1}}(x),\\\\,\\\\hat{f\\_{2}}(x),\\\\,\\\\\
    hat{f\\_{3}}(x)$ from [Example 4.5](#chapter4.xhtml#exam4_5).\n\nNotice that the\
    \ Newton's interpolating polynomials can be written as a linear system as well."
