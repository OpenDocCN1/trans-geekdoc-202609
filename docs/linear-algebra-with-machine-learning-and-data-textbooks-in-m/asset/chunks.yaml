    \ 更新 d 部分的权重。\n\n* 示例 5.25 使用高斯激活函数估计人脸识别的类别。使用 示例 5.25 中给出的数据、`W^((0)) = {.1,.9}`\
    \ 以及激活函数\n\n  $$\\begin{array}{r} {\\phi(X) = \\frac{w_{1}}{(X - \\mu_{1})^{T}(X\
    \ - \\mu_{1})} + \\frac{w_{2}}{(X - \\mu_{2})^{T}(X - \\mu_{2})}}$$\n\n  配合 SSE\
    \ 损失函数来确定哪个类别更类似于 `f[1]` 和 `f[2]`。\n\n# 决策树与随机森林\n\nDOI: [10.1201/978103025672](https://doi.org/10.1201/978103025672)\n\
    \n之前的章节专注于做出单一决策的技术，而本章专注于如何通过一系列决策来对数据进行最佳分类。\n\n## 6.1 决策树\n\n`决策树` 是由树表示的选择性选择的递归划分。`决策树`类似于流程图，可以应用于各种场合。决策树的一般形式可以在图\
    \ 6.1 中看到。\n\n```\nFigure 6.1 决策树的一般形式。\n```\n\n图 6.1\n\n让我们从一个应用于逻辑语句的决策树开始。通常决策树用于分类和回归分析。`分类树`是一种决策树，其中每个节点（或顶点）根据属性是否存在，连接着一个二分类决策。顶部节点也称为`根节点(root)`，代表所有可能属性的存在，每个`子节点`是上方节点的细分，也称为`父节点(parent)`。`子节点`可以是后继决策节点，也可以是最终结果，称为`叶子节点(leaf)`。决策树也可以用于将定量数据划分为区域。\n\
    \n并非所有决策都是同等的。图 6.2 和 6.5 展示了两个针对 `A \\cap (B \\cup C)` 的不同决策树，你更喜欢哪一个？\n\n```\n\
    Figure 6.5 针对逻辑语句 A \\cap (B \\cup C) 的另一个决策树。\n```\n\n图 6.5 针对逻辑语句 `A \\cap (B\
    \ \\cup C)` 的另一个决策树。在选择的情况下，最好选择一个`根节点`来划分决策，以便在划分后提供更高的清晰度。定义在类别属性域上的决策树可以转换为数值函数。很多时候，数据科学家希望确定此类函数来衡量数据与预期结果的接近程度。有几种标准标准被使用。在第\
    \ 5.6 节中，交叉熵用于对手写数字做出决策。`熵(Entropy)`和`吉尼指数(Gini index)`是一些划分函数的例子。\n\n### 熵\n\n\
    如果 `Y` 是一个随机事件，那么 `Y` 发生的`不确定性`可以通过以下方式衡量：\n\n$$\\begin{array}{r} {\\log_{2}\\\
    left(Y\\right)} = -}$$\n\n```\nFigure 6.6 随机事件 Y \\sim N(0,1) 的不确定性。\n```\n\n\
    如果 `Y` 是离散随机变量，那么 `Y` 的期望不确定性为：\n\n$$\\begin{array}{l} {Entropy(Y) = E\\left(\
    \ \\log_{2}(Y)\\right) \\right)} \\\\ \\end{array}$$\n\n如果 `Y` 是连续随机变量，那么 `Y`\
    \ 的不确定性为：\n\n$$\\begin{array}{r} {Entropy(Y) = - \\int_{-\\infty}^{\\infty}P(y)\\\
    log_{2}P(y)dy}$$\n\n对于数据集 `S`，`Entropy(S)` 是均匀性的衡量标准。如果类别 `C[1]`, `C[2]`, ...,\
    \ `C[n]` 在 `S` 中，则\n\n$$\\begin{array}{r} {Entropy(S) = \\sum_{C_{i}}P(C_{i})}$$\n\
    \n如果与决策树相关的熵为 0，则数据是完全同质的；如果存在 50-50 的划分，则熵将等于 1。例如，在图 6.7 中，左侧的 `L[1]` 划分了两个类别，因此\
    \ `Entropy(S)` = 1。在右侧的图中，`L[1]` 左右各占一半，因此熵介于 0 和 1 之间。\n\n### 吉尼纯度\n\n决策强划分的另一个指标是`吉尼纯度(Gini\
    \ Impurity)`度量。`吉尼纯度`度量的思想是确定节点选择的方式导致随机样本分类错误的概率。\n\n$$\\begin{aligned} {Gini\
    \ Impurity} = \\sum_{i=1}^{n}p_{i}(1 - p_{i}) \\\\ = 1 - \\sum_{i=1}^{n}p_{i}^{2}}\
    \ \\end{aligned}$$\n\n其中 `P = (p[1], p[2], ..., p[n])` `p[i]` 是对象分类为类别 `i = 1,\
    \ 2, ..., n` 的概率。例如，假设我们在图 6.8 中随机选择了 10 个数据点，分为两个类别。如果节点 1 中的决策标准产生了由节点 2 和 3\
    \ 显示的划分，我们可以看到：\n\n$$\\begin{array}{r} {\\text{Gini Impurity of Node}, 2 = 1 -\
    \ \\frac{3}{4}^{2} - \\frac{1}{4}^{2} = \\frac{3}{8}}} \\end{array}$$\n\n而节点 3\
    \ 的吉尼纯度为\n\n$$\\begin{array}{r} {\\text{whereas the Gini Impurity of Node}, 3\
    \ = 1 - \\frac{1}{3}^{2} - \\frac{2}{3}^{2} = \\frac{4}{9}.}} \\end{array}$$\n\
    \n"
- fmt: "\nThe Gini Impurity ranges from 0 to 1 and the higher the value the more impure\
    \ the nodes of the decision tree are. This measure is only used for measuring\
    \ categorical data. Other measures must be used for quantitative or continuous\
    \ data.\n\nAnother way to think about the Gini impurity measure is that if `P`\
    \ is a probability matrix where `P`[`i`, `j`] = `p`[`i`] when `i` = `j` and `P`[`i`,\
    \ `j`] = `0` otherwise. Then\n\n$$\\\\begin{array}{r} {Gini\\\\, impurity = Tr(I\
    \ - P^{2}).} \\\\\\\\ \\end{array}$$\n\n### 6.1.1 Decision Trees Regression\n\n\
    Typical linear regression models work to linearly separate data, whereas decision\
    \ tree models work to separate data that is not linearly separable. A visualization\
    \ of a linearly separable set of data versus one which is not linearly separable\
    \ can be seen in [Figure 6.7](#chapter6.xhtml#fig6_7).\n\nIn this section, we\
    \ will focus on (1) Decision Tree Linear Regression as a categorization problem\
    \ and (2) Decision Trees as a regression model. Later, we will take a brief look\
    \ at how one might combine these ideas with those explored in [Chapter 4](#chapter4.xhtml)\
    \ to create even better models.\n\nSince the data that will be the focus of decision\
    \ tree linear regression is typically linearly non-separable, the mathematical\
    \ algorithm discussed is recursive in nature, starting at the root of the tree.\n\
    \nWhen using decision trees to determine clustering or linear regression models,\
    \ it is important to hold back a set of data for a test data set for learning\
    \ purposes. We will follow the steps of this recursive algorithm with an example\
    \ related to the data in [Figure 6.9](#chapter6.xhtml#fig6_9).\n\n![Figure 6.9\
    \ Training set for decision tree categorization example.](images/fig6_9.jpg)\n\
    \n[Figure 6.9](#chapter6.xhtml#b6fig6_9) Training set for decision tree categorization\
    \ example.\n\nWe begin with a trained decision tree with a root node containing\
    \ our entire test data set and a splitting feature.\n\nWith a root node as seen\
    \ in [Figure 6.10](#chapter6.xhtml#fig6_10), notice that we begin by including\
    \ all of the data points. Under the root condition, in this case `x`[1] > 2, child\
    \ nodes are included based on whether the root condition is True or False.\n\n\
    ![Figure 6.10 Example decision tree for categorization example, using training\
    \ data in Figure 6.9.](images/fig6_10.jpg)\n\n[Figure 6.10](#chapter6.xhtml#b6fig6_10)\
    \ Example decision tree for categorization example, using training data in [Figure\
    \ 6.9](#chapter6.xhtml#fig6_9).\n\nAfter this first decision, the right child\
    \ node only has data from a single category. We call this node a **pure node**.\
    \ Notice that the first child node on the right in [Figure 6.9](#chapter6.xhtml#fig6_9)\
    \ is not a pure node.\n\nIf we are given some data not in this training set, for\
    \ example, (2, 1) and (0.5, 3), then we can follow the decision tree to decide\
    \ which category to place these data points.\n\nSince all of the child nodes are\
    \ pure, (2, 1)→ ● and (0.5, 3) → shaded bullet figure here.\n\nIn this example,\
    \ there were many choices for conditions to split the training data, we discuss\
    \ now how we best choose these conditions.\n\nOne way to do so is with a **greedy\
    \ algorithm** in which conditions are considered by brute force. Unfortunately,\
    \ this algorithm may still not determine the best splitting as once a condition\
    \ on a root is determined the algorithm does not go back up the tree.\n\nThe steps\
    \ for the greedy algorithm include:\n\n*   Setting a root condition that produces\
    \ a Gini impurity close to 1 (In the above example, for `x`[1] > 2, the Gini impurity\
    \ is 1)\n*   For each possible splitting rule, calculate `IG`,\n\n    $$\\\\begin{array}{r}\
    \ {Information\\\\, Gain = Entropy(parent) - {\\\\sum\\\\limits\\\\_{i}w_{i}}Entropy(child).}\
    \ \\\\\\\\ \\end{array}$$\n\n    For the data shown in [Figure 6.11](#chapter6.xhtml#fig6_11),\
    \ with root condition `x`[1] > 2, the child conditions are shown in [Table 6.2](#chapter6.xhtml#tbl6_2).\n\
    *   Choose a new condition that maximizes the information gain, `IG`.\n\n    A\
    \ pure child will produce an entropy of 0. Ideally, we would choose a smaller\
    \ grid and larger variety of conditions; however, with the choices presented in\
    \ [Table 6.2](#chapter6.xhtml#tbl6_2), three pure child nodes exists.\n\n    The\
    \ best choice for the next condition from those presented in [Table 6.2](#chapter6.xhtml#tbl6_2)\
    \ is `x`[1] > 4.\n*   Repeat Steps 1-3.\n\n    With a new parent node and condition\
    \ `x`[1] > 4, focus on the region\n\n    $$\\\\begin{array}{r} {0 \\leq x_{0}\
    \ \\leq 4,\\\\, 2} \\end{array}$$\n\n    The entropy of this parent node is 0.95.\n\
    \n    The condition `x`[1] > 1 and `x`[1] > 3 have an information gain of\n\n\
    \    $$\\begin{aligned} &0.95 - \\frac{3}{8} \\left( \\frac{2}{5} \\right) + \\\
    frac{2}{5} \\left( \\frac{3}{8} \\right) \\right) \\cdot \\frac{3}{8} \\\\ &=\
    \ 0.1378 \\end{aligned}$$\n\n    respectively.\n\n    ![Figure 6.11 Example of\
    \ decision tree for categorization example, using training data.](images/fig6_11.jpg)\n\
    \n    [Figure 6.11](#chapter6.xhtml#b6fig6_11) Example of decision tree for categorization\
    \ example, using training data in [Figure 6.9](#chapter6.xhtml#fig6_9).\n\n  \
    \  [Table 6.2](#chapter6.xhtml#tbl6_2) Example of splits and entropy gained based\
    \ on [Figure 6.9](#chapter6.xhtml#fig6_9).\n\n    | Condition || Split, `S[1]`\
    \ | Entropy for `S[1]` | Entropy for `S[2]` | IG |\n    | --- | --- | --- | ---\
    \ | --- |\n    | 2 | (3,2), (7,1) | 0.97 | 0.54 | 0.295 |\n    | 3 | (6,3), (4,0)\
    \ | 0.92 | 0.76 | 0.22 |\n    | 4 | (8,3), (2,0) | 0.85 | 0.28 | 0.28 |\n    |\
    \ 5 | (5,3), (5,0) | 0.95 | 0.41 | 0.41 |\n\nA decision tree that employs constraints\
    \ that focus on one variable, `x`[`i`], at a time and compares the variable to\
    \ a threshold value `b`, such as `x`[0] > 4 or `x`[1] > 2, is called a **univariate\
    \ decision tree**.\n\nA decision tree that is developed from constraints that\
    \ are linear combination of the variables, or attributes, and compares to a threshold\
    \ value `b`, such as 2*x`[0] + 4*x`[1] > 6 and $\\\\frac{7}{4}x_{0} - x_{1} >\
    \ 8$, is called an **oblique decision tree**.\n\nAn oblique decision tree has\
    \ constraints of the form\n\n$$\\\\begin{array}{r} {Ax > b.} \\\\\\\\ \\end{array}$$\n\
    \nThus far, our examples of decision tree algorithms focus on categorization or\
    \ classification. Similar techniques can be used for regression purposes as well.\
    \ When using these algorithms for regression purposes, we can envision the regression\
    \ problem as a classification problem, or a combination of decision trees and\
    \ linear regression techniques can be employed.\n\n[Example 6.9](#chapter6.xhtml#exam6_9)\
    \ shows how a regression problem can be transformed into a classification problem\
    \ in order to use decision tree algorithms.\n\n### 6.2 Regression Trees\n\nIn\
    \ the previous section, decision trees were used to predict either a classification\
    \ or dependent value with discrete outcomes. A **regression tree** uses similar\
    \ techniques to predict dependent values which may take on continuous values.\n\
    \nIn a regression tree, we create node constraints with restrictions on the domain\
    \ in the same way that we would in a decision tree, creating subsets within the\
    \ domain. Once these subsets are created a regression model is created within\
    \ each subset.\n\nA common practice is to let `ŷ` be equal to the average of\
    \ the outcomes within each subset. Just as we begun the discussion of classification\
    \ with decision trees with an example, we do the same with regression.\n"
  raw: "The Gini Impurity ranges from 0 to 1 and the higher the value the more impure\
    \ the nodes of the decision tree are. This measure is only used for measuring\
    \ categorical data. Other measures must be used for quantitative or continuous\
    \ data.\n\nAnother way to think about the Gini impurity measure is that if *P*\
    \ is a probability matrix where *P*[*i*, *j*] = *p*[*i*] when *i* = *j* and *P*[*i*, *j*] = 0\
    \ otherwise. Then\n\n$$\\\\begin{array}{r} {Gini\\\\, impurity = Tr(I - P^{2}).}\
    \ \\\\\\\\ \\\\end{array}$$  \n\n### 6.1.1 Decision Trees Regression\n\nTypical\
    \ linear regression models work to linearly separate data, whereas decision tree\
    \ models work to separate data that is not linearly separable. A visualization\
    \ of a linearly separable set of data versus one which is not linearly separable\
    \ can be seen in [Figure 6.7](#chapter6.xhtml#fig6_7).\n\nIn this section, we\
    \ will focus on (1) Decision Tree Linear Regression as a categorization problem\
    \ and (2) Decision Trees as a regression model. Later, we will take a brief look\
    \ at how one might combine these ideas with those explored in [Chapter 4](#chapter4.xhtml)\
    \ to create even better models.\n\nSince the data that will be the focus of decision\
    \ tree linear regression is typically linearly non-separable, the mathematical\
    \ algorithm discussed is recursive in nature, starting at the root of the tree.\n\
    \nWhen using decision trees to determine clustering or linear regression models,\
    \ it is important to hold back a set of data for a test data set for learning\
    \ purposes. We will follow the steps of this recursive algorithm with an example\
    \ related to the data in [Figure 6.9](#chapter6.xhtml#fig6_9).\n\n![Figure 6.9\
    \ Training set for decision tree categorization example.](images/fig6_9.jpg)\n\
    \n[Figure 6.9](#chapter6.xhtml#b6fig6_9) Training set for decision tree categorization\
    \ example.\n\nWe begin with a trained decision tree with a root node containing\
    \ our entire test data set and a splitting feature.\n\nWith a root node as seen\
    \ in [Figure 6.10](#chapter6.xhtml#fig6_10), notice that we begin by including\
    \ all of the data points. Under the root condition, in this case *x*[1] > 2, child\
    \ nodes are included based on whether the root condition is True or False.\n\n\
    ![Figure 6.10 Example decision tree for categorization example, using training\
    \ data in Figure 6.9.](images/fig6_10.jpg)\n\n[Figure 6.10](#chapter6.xhtml#b6fig6_10)\
    \ Example decision tree for categorization example, using training data in [Figure\
    \ 6.9](#chapter6.xhtml#fig6_9).\n\nAfter this first decision, the right child\
    \ node only has data from a single category. We call this node a **pure node**.\
    \ Notice that the first child node on the right in [Figure 6.9](#chapter6.xhtml#fig6_9)\
    \ is not a pure node.\n\nIf we are given some data not in this training set, for\
    \ example, (2, 1) and (0.5, 3), then we can follow the decision tree to decide\
    \ which category to place these data points.\n\nSince all of the child nodes are\
    \ pure, (2, 1)→  ● and (0.5, 3)→  shaded bullet figure here.\n\nIn this example,\
    \ there were many choices for conditions to split the training data, we discuss\
    \ now how we best choose these conditions.\n\nOne way to do so is with a **greedy\
    \ algorithm** in which conditions are considered by brute force. Unfortunately,\
    \ this algorithm may still not determine the best splitting as once a condition\
    \ on a root is determined the algorithm does not go back up the tree.\n\nThe steps\
    \ for the greedy algorithm include:\n\n*   Setting a root condition that produces\
    \ a Gini impurity close to 1 (In the above example, for *x*[1] > 2, the Gini impurity\
    \ is 1)\n\n*   For each possible splitting rule, calculate *IG*,\n\n    $$\\\\\
    begin{array}{r} {Information\\\\, Gain = Entropy(parent) - {\\\\sum\\\\limits\\\
    _{i}w\\_{i}}Entropy(child).} \\\\\\\\ \\\\end{array}$$  \n\n    For the data shown\
    \ in [Figure 6.11](#chapter6.xhtml#fig6_11), with root condition *x*[1] > 2, the\
    \ child conditions are shown in [Table 6.2](#chapter6.xhtml#tbl6_2).\n\n*   Choose\
    \ a new condition that maximizes the information gain, *IG*.\n\n    A pure child\
    \ will produce an entropy of 0. Ideally, we would choose a smaller grid and larger\
    \ variety of conditions; however, with the choices presented in [Table 6.2](#chapter6.xhtml#tbl6_2),\
    \ three pure child nodes exists.\n\n    The best choice for the next condition\
    \ from those presented in [Table 6.2](#chapter6.xhtml#tbl6_2) is *x*[1] > 4.\n\
    \n*   Repeat Steps 1-3.\n\n    With a new parent node and condition *x*[1] > 4,\
    \ focus on the region\n\n    $$\\\\begin{array}{r} {0 \\\\leq x\\_{0} \\\\leq\
    \ 4,\\\\, 2 \\\\leq x\\_{1} \\\\leq 4.} \\\\\\\\ \\\\end{array}$$  \n\n    The\
    \ entropy of this new parent node is 0.95.\n\n    The condition *x*[0] > 1 and\
    \ *x*[1] > 3 have an information gain of\n\n    $$\\\\begin{aligned} & {0.95 -\
    \ log\\_{2}\\\\left( \\\\frac{3}{6} \\\\right) \\\\cdot \\\\frac{6}{8} = 1.95\\\
    \\text{~and~}} \\\\\\\\ & {.95 - \\\\left( {\\\\frac{3}{5}log\\_{2}\\\\left( \\\
    \\frac{3}{5} \\\\right) + \\\\frac{2}{5}log\\_{2}\\\\left( \\\\frac{2}{5} \\\\\
    right)} \\\\right) \\\\cdot \\\\frac{5}{8} - \\\\left( {\\\\frac{1}{3}log\\_{2}\\\
    \\left( \\\\frac{1}{3} \\\\right) + \\\\frac{2}{3}log\\_{2}\\\\left( \\\\frac{2}{3}\
    \ \\\\right)} \\\\right) \\\\cdot \\\\frac{3}{8}} \\\\\\\\ & {= 2.13078} \\\\\\\
    \\ \\\\end{aligned}$$  \n\n    respectively.\n\n![Figure 6.11 Example of decision\
    \ splitting for categorization example, using training data in Figure 6.9.](images/fig6_11.jpg)\n\
    \n[Figure 6.11](#chapter6.xhtml#b6fig6_11) Example of decision splitting for categorization\
    \ example, using training data in [Figure 6.9](#chapter6.xhtml#fig6_9).\n\n[Table\
    \ 6.2](#chapter6.xhtml#b6tbl6_2) Example initial splits and corresponding entropy\
    \ and information gained based on training data in [Figure 6.9](#chapter6.xhtml#fig6_9).\n\
    \n| Condition || Split, *S*[1], *S*[2] || Entropy for *S*[1] || Entropy for *S*[2]\
    \ || IG |\n\n| --- | --- | --- | --- | --- |\n\n| *x*[0] > 1 || (3,0), (7,3) ||\
    \ 0 ||  − .3*l**o**g*[2](.3) − .7*l**o**g*[2](.7)≈ 0.88 || $1 - \\\\frac{3}{13}\
    \ \\\\cdot 0$$- \\\\frac{10}{13} \\\\cdot 0.88 \\\\approx$ 0.32 |\n\n| --- | ---\
    \ | --- | --- | --- |\n\n| *x*[0] > 2 || (3,1), (7,2) || 0.81 || 0.76 || 0.225\
    \ |\n\n| *x*[0] > 3 || (6,3), (4,0) || 0.92 || 0 || 0.36 |\n\n| *x*[0] > 4 ||\
    \ (8,3), (2,0) || 0.85 || 0 || 0.28 |\n\n| *x*[1] > 3 || (3,2), (7,1) || 0.97\
    \ || 0.54 || 0.295 |\n\n| *x*[1] > 4 || (5,3), (5,0) || 0.95 || 0 || 0.41 |\n\n\
    A decision tree that employs constraints that focus on one variable, *x*[*i*],\
    \ at a time and compares the variable to a threshold value *b*, such as *x*[0] > 4\
    \ or *x*[1] > 2, is called a **univariate decision tree**.\n\nA decision tree\
    \ that is developed from constraints that are linear combination of the variables,\
    \ or attributes, and compares to a threshold value *b*, such as 2*x*[0] + 4*x*[1] > 6\
    \ and $\\\\frac{7}{4}x\\_{0} - x\\_{1} > 8$, is called an **oblique decision tree**.\n\
    \nAn oblique decision tree has constraints of the form\n\n$$\\\\begin{array}{r}\
    \ {Ax > b.} \\\\\\\\ \\\\end{array}$$  \n\nThus far, our examples of decision\
    \ tree algorithms focus on categorization or classification. Similar techniques\
    \ can be used for regression purposes as well. When using these algorithms for\
    \ regression purposes, we can envision the regression problem as a classification\
    \ problem, or a combination of decision trees and linear regression techniques\
    \ can be employed.\n\n[Example 6.9](#chapter6.xhtml#exam6_9) shows how a regression\
    \ problem can be transformed into a classification problem in order to use decision\
    \ tree algorithms.\n\n## 6.2 Regression Trees\n\nIn the previous section, decision\
    \ trees were used to predict either a classification or dependent value with discrete\
    \ outcomes. A **regression tree** uses similar techniques to predict dependent\
    \ values which may take on continuous values.\n\nIn a regression tree, we create\
    \ node constraints with restrictions on the domain in the same way that we would\
    \ in a decision tree, creating subsets within the domain. Once these subsets are\
    \ created a regression model is created within each subset.\n\nA common practice\
    \ is to let *ŷ* be equal to the average of the outcomes within each subset. Just\
    \ as we begun the discussion of classification with decision trees with an example,\
