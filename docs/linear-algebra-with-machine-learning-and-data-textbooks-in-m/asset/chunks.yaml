  trans: "\n\n在图 5.6 中，展示了一个损失函数。函数的`gradient`（也称为变化率或一阶导数）是函数变化的速率。注意在点 `a` 处，函数是递减的，因此梯度为负。\n\
    \n![图 5.6 损失函数梯度可视化。](img/fig5_6.jpg)\n\n图 5.6 损失函数梯度可视化。\n\n**如果函数是递减的，则梯度为负。**\n\
    \n同样，注意在图 5.6 中的点 `c` 处，函数向正方向变化。最重要的是，函数在最小值（或最大值）处的变化率，即虚线的斜率（在图 5.6 上），为零。\n\
    \n**如果函数是递增的，则梯度为正。**\n\n**当梯度为零时，函数达到最优值（最小值或最大值）。**\n\n因此，人们可以通过计算函数的`gradient`并找到优化损失函数的值（也称为`parameters`）来确定使函数最小的值。\n\
    \n如果 `SSE` 是损失函数，我们将 `SSE` 相对于系数 `a`[`i`]的梯度标记为\n\n$$\\\\begin{array}{r} {\\\\\
    frac{\\\\partial SSE}{\\partial a\\_{i}}.} \\\\\\\\ \\\\end{array}}$$  \n\n如果\
    \ $\\hat{y} = \\hat{f(x)} = a_{0} + a_{1}x + a_{2}x^{2} + \\ldots a_{n}x^{n}$，则\n\
    \n$$\\\\begin{aligned} {SSE} & {= {(y - (a_{0} + a_{1}x + a_{2}x^{2} + \\ldots\
    \ a_{n}x^{n}))}^{2}} \\\\\\\\ \\\\frac{\\\\partial SSE}{\\partial a\\_{0}} & {=\
    \ - 2(y - (a_{0} + a_{1}x + a_{2}x^{2} + \\ldots a_{n}x^{n})) = - 2(y - \\hat{y})}\
    \ \\\\\\\\ \\\\frac{\\\\partial SSE}{\\partial a\\_{1}} & {= - 2x(y - (a_{0} +\
    \ a_{1}x + a_{2}x^{2} + \\ldots a_{n}x^{n})) = - 2x(y - \\hat{y})} \\\\\\\\ &\
    \ \\\\vdots \\\\\\\\ \\\\frac{\\\\partial SSE}{\\partial a\\_{2}} & {= - 2x^{n}(y\
    \ - \\hat{y}).} \\\\\\\\ \\\\end{aligned}$$  \n\n梯度下降算法包括：\n\n1. 使用 `n` 个插值点创建一个插值函数\
    \ `ŷ` = `f̂`(`x`)。 \n   确定的系数 `a`[`i`], 0 ≤ `i` ≤ `n` 在此算法中被称为`weights`。首先对每个系数进行一个合理的猜测，并选择一个损失函数，例如\
    \ `SSE`。\n\n2. 对于每个系数 `a`[`i`]，确定梯度\n\n   $$\\\\begin{array}{r} {\\\\frac{\\\\\
    partial SSE}{\\partial a\\_{i}} = {\\\\sum\\\\limits\\_{j = 0}^{n}{(y\\_{j} -\
    \ \\hat{y\\_{j}})}}{(x\\_{j})}^{i}.} \\\\\\\\ \\\\end{array}}$$  \n\n3. 考虑到学习率\
    \ `r`，调整 `weights`，\n\n   $$\\\\begin{array}{r} {\\\\text{new~}a\\_{i} = a\\_{i}\
    \ + r\\\\frac{\\\\partial SSE}{\\partial a\\_{i}}.} \\\\\\\\ \\\\end{array}}$$\
    \  \n\n4. 重复步骤 2-4 以更新系数并接近最小 `SSE`。\n\n![图 5.8 示例 5.15 梯度下降多次迭代的数据和三次插值函数。](img/fig5_8.jpg)\n\
    \n图 5.8 示例 5.15 梯度下降多次迭代的数据和三次插值函数。\n\n梯度下降方法也可以用矩阵方程的形式表示。如果插值函数是一个 `n` 次多项式\n\
    \n$$\\\\begin{array}{r} {\\\\hat{y} = a_{0} + a_{1}x + \\ldots + a_{n}x^{n},}\
    \ \\\\\\\\ \\\\end{array}}$$  \n\n则 `SSE` 代代价函数可以写为\n\n$$\\\\begin{array}{r} {SSE\
    \ = {(XA - Y)}^{T}(XA - Y),\\\\{~where~}} \\\\\\\\ \\\\end{array}}$$  \n\n$$\\\
    \\begin{array}{l} {X = \\left( \\begin{array}{lllll} 1 & x_{0} & x_{0}^{2} & \\\
    ldots & x_{0}^{n} \\\\ 1 & x_{1} & x_{1}^{2} & \\ldots & x_{1}^{n} \\\\ \\\\vdots\
    \ & \\\\ddots & \\\\ddots & \\\\ddots & \\\\vdots \\\\ 1 & x_{n} & x_{n}^{2} &\
    \ \\ldots & x_{n}^{n} \\\\ \\\\end{array} \\right),\\\\, A = \\left( \\begin{array}{l}\
    \ a_{0} \\\\ a_{1} \\\\ \\\\vdots \\\\ a_{n} \\\\ \\\\end{array} \\right),} \\\
    \\\\\\ \\\\end{array}$$  \n\n$$\\\\begin{array}{l} {and\\\\, Y = \\left( \\begin{array}{l}\
    \ y_{0} \\\\ y_{1} \\\\ \\\\vdots \\\\ y_{n} \\\\ \\\\end{array} \\right).} \\\
    \\\\\\ \\\\end{array}$$  \n\n梯度为\n\n$$\\\\begin{array}{r} {\\\\frac{\\\\partial\
    \ SSE}{\\partial A} = X^{T}(XA - Y), \\\\\\\\ \\\\end{array}}$$  \n\n如果 `r` 是学习率，则\n\
    \n$$\\\\begin{array}{r} {A_{i}^{(j + 1)} = A_{i}^{(j)} - r\\\\frac{\\\\partial\
    \ SSE}{\\partial a\\_{i}}, \\\\\\\\ \\\\end{array}}$$  \n\n其中 `A`[`i`]`^(j + 1)`\
    \ = `A`[`i`]`^(j)` - `r`$\\\\frac{\\\\partial SSE}{\\partial a\\_{i}}$（此处截断）。\n\
    \n"
