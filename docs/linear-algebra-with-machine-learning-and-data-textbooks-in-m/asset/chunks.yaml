    `X` 和 `Y` 是两个随机变量，`X` 和 `Y` 的联合分布记为 `fXY`，


    $$\begin{array}{r} {f_{XY}(x,y) = P(X = x \cap Y).}$$


    如果 `X` 和 `Y` 是连续随机变量（等等，文中说是“连续随机变量”），还可以查看条件分布，探索在随机变量 `X` 已发生的情况下随机变量 `Y` 发生的概率。


    对于离散随机变量：

    $$\begin{array}{r} {f_{Y|X}(y|x) = P(Y = y|x) = \frac{P(Y = y \cap x)}{P(x)}}
    \\ \\ \end{array}}$$


    对于连续随机变量：

    $$\begin{array}{r} {f_{Y|X}(y|x) = P(Y \leq y|x) = \frac{P(Y \leq y \cap x)}{P(X
    \leq x)} \\ \\ \end{array}}$$


    两个随机变量 `X` 和 `Y` 是独立的，如果


    $$\begin{array}{r} {P(X = x \cap y) = P(x)P(y)}$$


    因此 `P(Y=y|X=x)=P(y)`。如果一组随机变量具有相同的分布，它们被称为独立同分布 (i.i.d.)；如果 `X[1]`、`X[2]`…`X[n]`
    是离散随机变量，则联合分布函数


    $$\begin{array}{r} {f(X_{1}, X_{2},\ldots, X_{n}) = {\sum\limits_{x_{1}, x_{2},\ldots,
    x_{n}}}P(X_{1} = x_{1}) \cdot P(X_{2} = x_{2})\cdots P(X_{n} = x_{n}),} \\ \\
    \end{array}}$$


    而如果 `X[1]`、`X[2]`…`X[n]` 是连续随机变量，则联合分布函数


    $$\begin{aligned} & {f(X_{1}, X_{2},\ldots, X_{n})} & {\text{\quad\quad} = {\int_{x_{1},
