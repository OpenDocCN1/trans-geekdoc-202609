    \ {\\\\phi(X) = \\\\frac{w\\_{1}}{{(X - \\\\mu\\_{1})}^{T}(X - \\\\mu\\_{1})}\
    \ + \\\\frac{w\\_{2}}{{(X - \\\\mu\\_{2})}^{T}(X - \\\\mu\\_{2})}} \\\\\\\\ \\\
    \\end{array}$$  \n\n    with the SSE cost function to determine which category\
    \ most resembles the images represented by *f*[1] and *f*[2].\n\n# 6Decision Trees\
    \ and Random Forests\n\nDOI: [10.1201/9781003025672-6](https://doi.org/10.1201/9781003025672-6)\n\
    \nWhile previous chapters focus on techniques for making a single decision or\
    \ model, this chapter focuses on ways to make a series of decisions that can incorporate\
    \ previous techniques in order to best categorize data.\n\n## 6.1 Decision Trees\n\
    \nA **decision tree** is a recursive partitioning of choices represented by a\
    \ tree graph. A decision tree is similar to a flow chart and can be applied in\
    \ a variety of venues. The general form of a decision tree can be seen in [Figure\
    \ 6.1](#chapter6.xhtml#fig6_1).\n\n![Figure 6.1 General Form of a Decision Tree.](images/fig6_1.jpg)\n\
    \n[Figure 6.1](#chapter6.xhtml#b6fig6_1) General Form of a Decision Tree.\n\n\
    Let's begin with an example of a decision tree applied to a logic statement.\n\
    \nTypically decision trees are used for classification tasks and regression analysis.\
    \ A **classification tree** is a decision tree where each node, or vertex, has\
    \ a binary decision connected to it based on whether an attribute is present or\
    \ not. The top node, also called the **root**, in a classification tree represents\
    \ the presence of all possible attributes, and each **child** node that is a subdivision\
    \ of the node above it, also called the **parent** node.\n\nA child node may be\
    \ a successor decision node or a final outcome, called the **leaf** node.\n\n\
    A decision tree can also be used to divide quantitative data into regions or clusters.\n\
    \nBut not all decisions are created equally. [Figures 6.2](#chapter6.xhtml#fig6_2)\
    \ and [6.5](#chapter6.xhtml#fig6_5) show two different decision trees for *A* ∩ (*B* ∪ *C*),\
    \ which one do you prefer?\n\n![Figure 6.5 Another decision tree for logic statement\
    \ A \\\\cap (B \\\\cup C).](images/fig6_5.jpg)\n\n[Figure 6.5](#chapter6.xhtml#b6fig6_5)\
    \ Another decision tree for logic statement *A* ∩ (*B* ∪ *C*).\n\nGiven the choice,\
    \ it is best to choose a root node to split a decision in a way that provides\
    \ more clarity after the split.\n\nA decision tree defined over a domain of categorical\
    \ attributes can be converted into a discrete numerical function. Many times,\
    \ data scientists will wish to determine such functions that establish criteria\
    \ to measure the closeness of the data to the desired outcome. There are several\
    \ standard criteria that are used.\n\nIn [Section 5.6](#chapter5.xhtml#sec5_6),\
    \ cross-entropy was used in order to make decisions about handwritten digits.\
    \ **Entropy** and the **Gini index** are some examples of splitting functions.\n\
    \n### Entropy\n\nIf *Y* is a random event, then the **uncertainty** of *Y* = *y*\
    \ occurring can be measured by\n\n$$\\\\begin{array}{r} {log\\_{2}\\\\left( \\\
    \\frac{1}{P(Y = y)} \\\\right) = - log\\_{2}(P(Y = y)).} \\\\\\\\ \\\\end{array}$$\
    \  \n\n![Figure 6.6 Uncertainty of a random event \\\\left. Y \\\\right.\\\\sim\
    \ N(0,1).](images/fig6_6.jpg)\n\nFigure 6.6 Uncertainty of a random event *Y* ∼ *N*(0, 1).\n\
    \nThe **entropy** of a random event *Y* is the expected uncertainty. That is,\
    \ if *Y* is a discrete random variable, then\n\n$$\\\\begin{array}{l} {Entropy(Y)\
    \ = E\\\\left( {- log\\_{2}\\\\left( {P\\\\left( {Y = y} \\\\right)} \\\\right)}\
    \ \\\\right) = - \\\\sum\\\\limits\\_{y}P(Y = y)log\\_{2}(P(Y = y))} \\\\\\\\\
    \ \\\\end{array}$$  \n\nand if *Y* is a continuous random variable,\n\n$$\\\\\
    begin{array}{r} {Entropy(Y) = - {\\\\int\\_{- \\\\infty}^{\\\\infty}P}(Y = y)log\\\
    _{2}(P(Y = y))\\\\, dy.} \\\\\\\\ \\\\end{array}$$  \n\nFor a dataset *S*, entropy,\
    \ *E**n**t**r**o**p**y*(*S*), is a measure of homogeneity within the dataset.\n\
    \nIf there are classes *C*[1], *C*[2], …, *C*[*n*] of data in *S* then\n\n$$\\\
    \\begin{array}{r} {Entropy(S) = {\\\\sum\\\\limits\\_{C\\_{i}} -}P(C\\_{i})log\\\
    _{2}(P(C\\_{i})).} \\\\\\\\ \\\\end{array}$$  \n\nIf the entropy related to a\
    \ decision tree is 0 then the data is completely homogenous and if there is a\
    \ clear 50-50 split in the data then the entropy will be equal to 1.\n\nFor example,\
    \ in [Figure 6.7](#chapter6.xhtml#fig6_7), in the graph to the left, the line\
    \ *L*[1], splits the two classes and thus, *E**n**t**r**o**p**y*(*S*) = 1. In\
    \ the graph on the right, roughly half of each class is on either side of line\
    \ *L*[1] and thus the entropy would lie somewhere between 0 and 1.\n\n![Figure\
    \ 6.7 Example of Linearly Separable and Non-Separable Data Sets.](images/fig6_7.jpg)\n\
    \n[Figure 6.7](#chapter6.xhtml#b6fig6_7) Example of Linearly Separable and Non-Separable\
    \ Data Sets.\n\nAnother indicator of strong splits in decisions is the Gini Impurity\
    \ measure.\n\n### Gini Impurity\n\nThe idea behind the Gini Impurity measure is\
    \ to determine the probability that the nodes are chosen in a way that a random\
    \ sample of data is classified incorrectly.\n\n$$\\\\begin{aligned} {Gini\\\\\
    , Impurity} & {= {\\\\sum\\\\limits\\_{i = 1}^{n}p\\_{i}}(1 - p\\_{i})} \\\\\\\
    \\ & {= 1 - {\\\\sum\\\\limits\\_{i = 1}^{n}p\\_{i}^{2}}} \\\\\\\\ \\\\end{aligned}$$\
    \  \n\nwhere *P* = (*p*[1], *p*[2], …, *p*[*n*]) and *p*[*i*] is the probability\
    \ that an object is classified in class *i* = 1, 2, …, *n*.\n\nFor example, assume\
    \ we randomly select 10 data points as in [Figure 6.8](#chapter6.xhtml#fig6_8),\
    \ with two categories. If a decision criteria in Node 1 creates a split shown\
    \ by Nodes 2 and 3, we can then see that the\n\n$$\\\\begin{array}{r} {\\\\text{Gini~Impurity~of~Node}\\\
    \\,\\\\, 2 = 1 - \\\\frac{3}{4}^{2} - \\\\frac{1}{4}^{2} = \\\\frac{3}{8}} \\\\\
    \\\\ \\\\end{array}$$  \n\n![Figure 6.8 Example of decision criteria splitting.](images/fig6_8.jpg)\n\
    \n[Figure 6.8](#chapter6.xhtml#b6fig6_8) Example of decision criteria splitting.\n\
    \n$$\\\\begin{array}{r} {\\\\text{whereas~the~Gini~Impurity~of~Node}\\\\, 3 =\
    \ 1 - \\\\frac{1}{3}^{2} - \\\\frac{2}{3}^{2} = \\\\frac{4}{9}.} \\\\\\\\ \\\\\
    end{array}$$  "
