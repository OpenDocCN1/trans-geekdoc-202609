  trans: "\n\n我们将特征值和特征向量的概念应用于另一个在数据科学中重要的矩阵，即**拉普拉斯矩阵（Laplacian matrix）**。与 `n`\
    \ × `n` 邻接矩阵 `A` 相关的拉普拉斯矩阵 `L` 定义如下：\n\n$$\\begin{array}{l} {L_{ij} = \\left\\\
    { \\begin{array}{ll} d_{i} & {\\text{if~}i = j,} \\\\\\\\ {- A_{ij}} & {\\text{if~}i\
    \ \\neq j,} \\\\\\\\ \\end{array}~ \\right.} \\\\\\\\ \\end{array}}$$  \n\n其中\
    \ `d[i]` 是顶点 `i` 的度。\n\n**归一化拉普拉斯矩阵** ℒ 定义为 ℒ℄=℄`T L T`，其中 `T` 是对角矩阵，$T_{ii} =\
    \ \\frac{1}{\\sqrt{d_{i}}}$。\n\n简单加权图的拉普拉斯矩阵与无权图非常相似。在加权图中，邻接矩阵的元素为：\n\n$$\\begin{array}{l}\
    \ {A_{ij} = \\left\\{ \\begin{array}{ll} w_{ij} & {\\text{when~vertex~}i\\text{~and~j\\\
    text{~are~adjacent}} \\\\\\\\ 0 & \\text{otherwise} \\\\\\\\ \\end{array}~ \\\
    right.} \\\\\\\\ \\end{array}}$$\n\n其中 `w[i j]` 是连接顶点 `i` 和 `j` 的边的权重。顶点 `i` 的度\
    \ `d[i]`  = ∑`w[i j]`。\n\n与目前描述拉普拉斯矩阵不同，简单有向图的拉普拉斯矩阵不是对称矩阵。考虑到这一点，`d[i]` 等于顶点的出度。\n\
    \n拉普拉斯矩阵在**谱图理论（spectral graph theory）**中有重要应用。\n\n谱图理论通过研究拉普拉斯矩阵的特征值和特征向量对顶点进行聚类和排序。我们将重点关注简单连通无向图及其对应的对称邻接矩阵。\n\
    \n与图 `G` 相关的拉普拉斯矩阵 `L` 将具有 `n` 个特征值，`λ[1]`  ≤ `λ[2]`  ≤ …  `λ[n]`。与 `λ[i]`  = 0\
    \ 相关的特征向量是图连通分量的指示器。\n\n第二小的特征值 `λ[2]` 称为**图代数连通性（algebraic connectivity of the\
    \ graph）**或**Fiedler 值（Fiedler value）** [12]，记为 `a(G)`，对应的特征向量称为**特征值**或**Fiedler\
    \ 向量**。\n\nFiedler 值代表与邻接矩阵相关的图代数连通性。注意，`a(G)`  > 0 当且仅当 `G` 是连通的，Fiedler 值越离\
    \ 0 远，图的连通性越高。\n\n注意在图 1.14，顶部的图是不连通的，有两个分量，因此拉普拉斯矩阵有一个重数为 2 的零特征值。连通图的拉普拉斯矩阵具有一个重数为\
    \ 1 的零特征值，如图 1.14 中上方图所示。随着图 1.14 中图连通性的增强，Fiedler 值随之增加。\n\n![图 1.14 图示例、其拉普拉斯矩阵和特征值。](img/fig1_14.jpg)\n\
    \n图 1.14 图示例、其拉普拉斯矩阵和特征值。\n\n同样有趣的是，具有 `n` 个顶点的**完全图（complete graph）** `K[n]`\
    \ 的拉普拉斯矩阵将具有重数为 `n` 的零特征值和一个重数为 1 的零特征值。归一化拉普拉斯矩阵的 Fiedler 值和向量可以以类似于拉普拉斯矩阵的方式解释。\n\
    \n如果希望将无向图划分为两个子图，Fiedler 定理定义了一种在划分时最小化切分边数的方法。Fiedler 向量中的第 `i` 个值称为图 `G` 中顶点的**赋值（valuation）**。\n\
    \n在应用中，Fiedler 向量对于加权简单图的聚类特别有用。注意为了应用此划分，邻接矩阵必须是对称的。谱聚类技术可以应用于非对称拉普拉斯矩阵，如示例 1.9\
    \ 中的有向图。这些技术将在第 2 章中进一步探讨。\n\n一种技术是使用对称矩阵，例如**Gram 矩阵（Gramian matrix）** `S`=`A^T`，而不是原始的邻接矩阵和拉普拉斯矩阵。在尝试聚类加权有向图时，可以使用类似的技术。\n\
    \n为什么 Fiedler 向量在数据聚类中有效？我们花点时间探索背后的理论。对称矩阵 `A` 的**二次型（quadratic form）**是 ℝ(`n`)\
    \ 上的一个函数 `QA`  = `x^T A`，或者\n\n$$\\begin{array}{r} {Q_{A}(x_{1},x_{2},\\ldots,x_{n})\
    \ = {\\sum_{i \\leq j}a_{ij}}x_{j}.} \\\\\\\\ \\end{array}$$\n\n一个实数 n×n 对称矩阵\
    \ `A` 称为：\n\n1. **正定（Positive definite）**，如果对于 `x`∈ℝ(`n`)，`x^T A > 0`；\n2. **正半定（Positive\
    \ semidefinite）**，如果对于 `x`∈ℝ(`n`)，`x^T A ≥ 0`；\n3. **负定（Negative definite）**，如果对于\
    \ `x`∈ℝ(`n`)，`x^T A < 0`；\n4. **负半定（Negative semidefinite）**，如果对于 `x`∈ℝ(`n`)，`x^T\
    \ A ≤ 0`。\n\n与非负（实）对称矩阵相关的拉普拉斯矩阵 `L` 是正半定矩阵，因此具有非负特征值。此外，`Le=0`，其中 `e=1`，且由于 `G`\
    \ 是连通的，`e` 是 `x^TL=0` 的唯一解。\n\n在特征值的固定点描述 `Ax=λx` 下，如果 `|λ| < 1`，\n\n$$\\begin{array}{r}\
    \ {lim_{k\\rightarrow\\infty}A^{k}x = lim_{k\\rightarrow\\infty}\\lambda^{k}x\
    \ = \\overset{\\rightarrow}{0}.} \\\\\\\\ \\end{array}}$$\n\n在应用中，`λ=1` 特别感兴趣，因为\
    \ `Ax=x`，对应的特征向量 `x` 在乘以矩阵 `A` 时不变。同样，如果 `|λ|=1`，则存在正整数 `k` 使得\n\n$$\\begin{array}{r}\
    \ {A^{k}x = x} \\\\\\\\ \\end{array}$$\n\n因此 `x` 的值在乘以矩阵 `A^k` 时不变。我们将特征向量 `x`\
    \ 称为**稳态向量（steady state vector）**。\n\n谱聚类依赖于**谱定理（Spectral Theorem）**和特征值的另一种描述——优化描述。\n\
    \n特征值的优化描述关注**瑞利商（Rayleigh Quotient）**：\n\n$$\\begin{array}{r} {R(x) = \\frac{x^{T}Ax}{x^{T}x}.}\
    \ \\\\\\\\ \\end{array}}$$\n\n根据定理 4，我们可以得出 `λ[1]` 最小 `R(x)` 而 `λ[n]` 最大 `R(x)`\
    \ 的结论。\n\n对于连通图 `G` 的 n×n 拉普拉斯矩阵 `L`，其特征值为 0=`λ[1]`  < `λ[2]`  ≤ …  `λ[n]`，\n\n\
    $$\\begin{array}{r} {\\\\lambda_{2} = a(G) = min_{x \\neq 0,||x|| = 1,x\\\\bot\
    \ e}\\frac{x^{T}Lx}{x^{T}x}.} \\\\\\\\ \\end{array}$$\n\n现在主要目标是将图 `G` 中的顶点划分为两个集合\
    \ `G[1]` 和 `G[2]`，可能希望在切割过多边的情况下进行。我们将通过定义顶点集 `V[1]` 及其边界 `V[1]` 来衡量效果：\n\n$$\\\
    begin{array}{r} {\\\\partial(V_{1}) = \\left\\{ (v_{1},\\\\, v_{2}),\\\\, v_{1}\
    \ \\in V_{1},\\\\, v_{2} \\in V\\\\backslash V_{2} \\\\right.} \\\\\\\\ \\end{array}}$$\n\
    \n`V[1]` 的**等周分率（isoperimetric ratio）** [2,3] `θ(V[1])` 定义为：\n\n$$\\begin{array}{r}\
    \ {\\\\theta(V_{1}) = \\frac{|\\\\partial(V_{1})|}{|V_{1}|}.} \\\\\\\\ \\end{array}}$$\n\
    \n图 `G` 的**等周常数（isoperimetric number）** `θ[G]` 是所有顶点数不超过一半集合的最小等周分率。即\n\n$$\\\
    begin{array}{r} {\\\\theta_{G} = \\min_{|V_{1}| \\\\leq \\\\frac{|V|}{2}}\\\\\
    frac{|\\\\partial(V_{1})|}{|V_{1}||V_{2}|}.} \\\\\\\\ \\end{array}$$\n\n"
