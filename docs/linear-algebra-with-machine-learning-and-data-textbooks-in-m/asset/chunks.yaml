    {(PZ)}^{T}\\Sigma^{- 1}(PZ)/2}}}|\\Sigma|^{1/2}dZ} \\ & {\\text{\quad\\quad} =
    {(2\\pi)}^{n/2}|\\Sigma|^{1/2}}} \\ \\end{aligned}$$


    Using the same transformation,


    $$\begin{array}{r} {{(2\\pi)}^{- mn/2}|\\Sigma^{- 1/2}{\\int\_{\mathbf{R}^{\mathbf{mn}}}X}e^{-
    {(X - \\mu)}^{T}\\Sigma^{- 1}(X - \\mu)/2dX = \\mu.} \\ \\end{array}$$

