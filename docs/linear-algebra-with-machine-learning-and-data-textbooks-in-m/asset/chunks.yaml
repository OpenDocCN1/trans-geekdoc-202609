    \ *u* and *v* in *V* and scalar *k*, *k*(*l**u*) = (*k**l*)*u*.\n\nAn **inner\
    \ product** on a set *V* is a function that maps order pairs (*x*, *y*) ∈ *V* × *V*\
    \ to a number  < *x*, *y*\\> while satisfying the following properties:\n\n1.\
    \  For all *v* ∈ *V*,  < *v*, *v*\\>  ≥ 0 and  < *v*, *v* >  = 0 if and only if\
    \ $v = \\\\overset{\\\\rightarrow}{0}$.\n\n2.  For all *u,v*, and *w* ∈ *V*,  < *u*, *v* + *w* >  =  < *u*, *v* >  +  < *u*, *w*\\\
    >.\n\n3.  For all *u*, *v* ∈ *V* and scalars *k*,  < *k**u*, *v* >  =  < *u*, *k**v* >  = *k* < *u*, *v*\\\
    >.\n\n4.  For all *u*, *v* ∈ *V*, $< u,v > = \\\\overline{<v,u>}$.\n\nA vector\
    \ space with a defined inner project is called an **inner product space**.\n\n\
    In an inner product space, *V*, a set of vectors is called **orthogonal** if for\
    \ each pair of vectors *v* and *w* in *V*,\n\n$$\\\\begin{array}{r} {< v,w > =\
    \ 0.} \\\\\\\\ \\\\end{array}$$  \n\nIf a set of vectors in *V* is orthogonal\
    \ and each vector is a unit vector, then the set is called **orthonormal**.\n\n\
    ## 3.2 Singular Values\n\nWhen studying data in which each data point has a large\
    \ number of attributes, it may be helpful to be able to reduce or compress the\
    \ number of attributes. That is, we may start with data points in ℝ^(*n*) and\
    \ want to project the data points into ℝ^(*m*) where *n* > *m*.\n\nIn order to\
    \ do so, it is important to reflect on which of the *n* attributes are significant\
    \ to the data set. We begin this investigation with a review of some key linear\
    \ algebra terms, linear independence, span, and basis, and an interpretation of\
    \ the visual aspects of eigenvectors.\n\nRecall that a set of vectors {*v*[1], *v*[2],…, *v*[*m*]}\
    \ is **linearly independent** if and only if the system of equations\n\n$$\\\\\
    begin{array}{r} {k\\_{1}v\\_{1} + k\\_{2}v\\_{2} + \\\\cdots + k\\_{m}v\\_{m}\
    \ = \\\\overset{\\\\rightarrow}{0}} \\\\\\\\ \\\\end{array}$$  \n\nhas only the\
    \ trivial solution, *k*[1] = *k*[2] = ⋯ = *k*[*m*] = 0. Otherwise, we say that\
    \ the set is **linearly dependent**. If the vectors *v*[1], *v*[2], …, *v*[*m*] ∈ ℝ^(*n*),\
    \ then this system can be written as\n\n$$\\\\begin{matrix} & {Ax = b} \\\\\\\\\
    \ {\\\\begin{pmatrix} v\\_{1} & v\\_{2} & \\\\cdots & v\\_{m} \\\\\\\\ \\\\end{pmatrix}\\\
    \\begin{pmatrix} k\\_{1} \\\\\\\\ k\\_{2} \\\\\\\\ \\\\vdots \\\\\\\\ k\\_{m}\
    \ \\\\\\\\ \\\\end{pmatrix}} & {= \\\\begin{pmatrix} 0 \\\\\\\\ 0 \\\\\\\\ \\\\\
    vdots \\\\\\\\ 0 \\\\\\\\ \\\\end{pmatrix}.} \\\\\\\\ \\\\end{matrix}$$  \n\n\
    This is equivalent to saying that the matrix *A*, whose columns are *v*[1], *v*[2], …, *v*[*m*],\
    \ is invertible.\n\nIf *w* is a vector in ℝ^(*n*) and there exists constant *k*[1], *k*[2], …, *k*[*m*]\
    \ such\n\n$$\\\\begin{array}{r} {w = k\\_{1}v\\_{1} + k\\_{2}v\\_{2} + \\\\cdots\
    \ + k\\_{m}v\\_{m},} \\\\\\\\ \\\\end{array}$$  \n\nwe say that *w* can be written\
    \ as a **linear combination** and is in the **span** of the vectors *v*[1], *v*[2], …, *v*[*m*].\n\
    \nThe set *S* = {*v*[1], *v*[2],…, *v*[*m*]} is a **basis** for a vector space\
    \ *V* if *S* is linearly dependent and if every vector in *V* is in the span of\
    \ *S*.\n\nLet *A* be an *n* × *n* matrix and *T*[*A*]:ℝ^(*n*)→ℝ^(*n*) be a linear\
    \ transformation with standard matrix *A*, defined as *T*[*A*](*x*) = *A**x*.\
    \ Then, based on the definition of an eigenvalue *λ*\n\n$$\\\\begin{array}{r}\
    \ {Ax = \\\\lambda x,} \\\\\\\\ \\\\end{array}$$  \n\nany basis vector *x* for\
    \ the eigenspace corresponding to the eigenvector *λ*, also called an eigenvector\
    \ corresponding *λ*, will be dilated or contracted by a factor of *λ* under the\
    \ transform *T*[*A*]; however, the direction of *x* will remain unchanged.\n\n\
    Recall that the **span** of a vector in ℝ² is any vector that lies on the same\
    \ line as the original vector. Most vectors will not remain on their own span\
    \ under a linear transformation such as *T*[*A*].\n\nAn example of a vector, it's\
    \ span, and the vector under *T*[*A*](*x*) can be seen in [Figure 3.2](#chapter3.xhtml#fig3_2).\
    \ Note that the eigenvectors of *A*, *x*[1] = {1,1} and *x*[2] = {1,0} will remain\
    \ on in their span under *T*[*A*](*x*).\n\n![Figure 3.2 An example of a vector,\
    \ it's span, and the vector under T\\_{A}(x).](images/fig3_2.jpg)\n\n[Figure 3.2](#chapter3.xhtml#b3fig3_2)\
    \ An example of a vector, it's span, and the vector under *T*[*A*](*x*).\n\nWe\
    \ have seen the importance of eigenvalues and eigenvectors in application in [Chapters\
    \ 1](#chapter1.xhtml) and [2](#chapter2.xhtml). If a matrix is not square, no\
    \ such values can be determined. In this chapter, we will introduce **singular\
    \ values**, the analogous values to eigenvalues for non-square matrices, and their\
    \ importance in data science."
