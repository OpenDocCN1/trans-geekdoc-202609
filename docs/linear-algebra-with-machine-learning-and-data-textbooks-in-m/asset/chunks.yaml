    x\_{22}\\partial x\_{21}} & \\frac{\partial^{2}y}{\partial x\_{22}^{2}} & \\cdots
    & \\frac{\partial^{2}y}{\partial x\_{22}\\partial x\_{2n}} \\ \\vdots & \\ddots
    & \\ddots & \\vdots \\ \\frac{\partial^{2}y}{\partial x\_{nn}\\partial x\_{n1}}
    & \\frac{\partial^{2}y}{\partial x\_{nn}\\partial x\_{n2}} & \\cdots & \\frac{\partial^{2}y}{\partial
    x\_{nn}^{2}} \\ \\end{array} \\right).} \\ \\end{array}$$


    If `y` = `f(X)` is a scalar function where `X` = (`x[1]`, …, `x[n]`), we define
    the `ordinary differential` as


    $$\begin{array}{r} {df = {\\sum\\limits\_{i = 1}^{n}\\frac{\partial f}{\partial
    x\_{i}}}dx\_{i}.} \\ \\end{array}$$


    Whereas, if `X` = [`x[i*`, *j*]` is an `m` × `n` matrix, then we define the `matrix
    differential` as


    $$\begin{array}{l} {dX = \\left( \\begin{array}{llll} {dx\_{11}} & {dx\_{12}}
    & \\cdots & {dx\_{1n}} \\ {dx\_{21}} & {dx\_{22}} & \\cdots & {dx\_{2n}} \\ \\vdots
    & \\ddots & \\ddots & \\vdots \\ {dx\_{m1}} & {dx\_{m2}} & \\cdots & {dx\_{mn}}
    \\ \\end{array} \\right).}


    The matrix differential satisfies the properties of a linear operator,


    `d(kX) = kdX,` and `d(X + Y) = dX + dY,`

    where `k` is a scalar and additionally satisfies the chain rule


    `d(XY) = (d(X))Y + Xd(Y),`

    if `X` and `Y` are conforming matrices.


    ### 5.2.2 Matrix Integration


    If `A` is a matrix of scalar functions and one wishes to integrate with respect
    to a scalar variable, `x`,


    $$\begin{array}{r} {\\int A\, dx = {\\int a_{ij}},} \\ \\end{array}$$


    however, if `f(x)` is a vector function there are instances when one might want
    to perform a transformation `x` = `g(y)`, then


    $$\begin{array}{r} {\\int f(x)dx = {\\int f(y)) \\cdot |det(y)|}dy,$$


    where the absolute value of determinant of Jacobian associated with transformation
    `g(y)`.


    If `f(X)` is a matrix function and we wish to perform a matrix transformation
    `Y` = `g(X)`, then


    $$\begin{array}{r} {\\int f(X)dx = {\\int f(g^{-1}(Y))|det(J)|}dY.$$


    Another matrix of importance in the integration of matrices is the square `Vandonde
    matrix`.


    The `Vandonde matrix` plays an important role in signal processing and distribution
    theory. In this chapter, this is applicable as we wish to find probability distributions
    and expected values for matrices.


    For example, we may wish to determine the following integral, which is related
    to finding the joint probability distribution of normal distributions with mean
    `μ` and variance `σ²`, `X[i]` ∼ `N(μ, σ²)`, `i` = 1, 2, *n*,


    $$\begin{array}{r} {\\int\_{-infty}^{\infty}\\ldots}{\\int\_{-infty}^{\infty}{\\int\_{-infty}^{\infty}e^{-
    {(X\_{1} - \\mu)}^{T}\\Sigma^{- 1}(X\_{1} - \\mu)/2}}}\\, dX\_{1}dX\_{2}\ldots
    dX\_{n},}} \\ \\end{array}$$


    where


    $$\begin{array}{l} {\\Sigma = \\left( \\begin{array}{lllll} \\sigma\_{1}^{2} &
    {cov(X\_{1},X\_{2})} & {cov(X\_{1},X\_{3})} & \\ldots & {cov(X\_{1},X\_{n})} \\
    {cov(X\_{1},X\_{2})} & \\sigma\_{2}^{2} & {cov(X\_{2},X\_{3})} & \\ldots & {cov(X\_{2},X\_{n})}
    \\ \\vdots & \\ddots & \\ddots & \\ddots & \\vdots \\ {cov(X\_{1},X\_{n})} & {cov(X\_{2},X\_{n})}
    & \\ldots & {cov(X\_{n - 1},X\_{n})} & \\sigma\_{n}^{2} \\ \\end{array} \\right).}
    \\ \\end{array}$$


    We may make the transformation `y[i*`, *j*]` = `x[i*`, *j*] - μ[ij]`, then the
    integral becomes


    $$\begin{array}{r} {\\int\_{-infty}^{\infty}\\ldots}{\\int\_{-infty}^{\infty}{\\int\_{-infty}^{\infty}e^{-
    {(Y)}^{T}\\Sigma^{- 1}(Y)/2}}}dY,} \\ \\end{array}$$


    however, if you make the transformation `Z` = `P^{-1}Y` where `P(T)Σ^{-1}P = I`,
    then


    $$\begin{array}{r} {|det(J)| = |det(P)| = |\\Sigma|^{1/2}} \\ \\end{array}$$


