    $$\\\\begin{array}{r} {O = (O\\_{1},\\\\, O\\_{2},\\\\, O\\_{3}),} \\\\\\\\ \\\
    \\end{array}$$  \n\nwhere *O*[*i*] represents the sentiment in Trump's tweet at\
    \ time *i* in the three month sequence and\n\n$$\\\\begin{array}{r} {H = (H\\\
    _{1},\\\\, H\\_{2},\\\\, H\\_{3}),} \\\\\\\\ \\\\end{array}$$  \n\nwhere *H*[*i*]\
    \ represents the difference between closing and opening on the *i*^(th) month\
    \ of the three month sequence. Notice that\n\n$$\\\\begin{array}{r} {E \\\\cdot\
    \ T \\\\cdot \\\\pi = (0.55697,\\\\, 0.44303)\\\\text{~and~}E \\\\cdot T^{2} \\\
    \\cdot \\\\pi = (0.547758,\\\\, 0.452242)} \\\\\\\\ \\\\end{array}$$  \n\nand\
    \ thus the most likely scenario in that Trump's three month tweet sentiment will\
    \ be\n\n$$\\\\begin{array}{r} {\\\\text{(Bullish,~Bullish,~Bullish)}\\\\text{.}}\
    \ \\\\\\\\ \\\\end{array}$$  \n\nAdditionally, the unit eigenvector, *v*, associated\
    \ with *λ*[*P**F*], for *E*.*T*,\n\n$$\\\\begin{array}{r} {v = (0.553097,\\\\\
    , 0.446903).} \\\\\\\\ \\\\end{array}$$  \n\nThus, over a long period of time,\
    \ it is much more likely that the monthly sentiment for Trump's tweets is Bullish,\
    \ based on the given data.\n\nMore importantly, one might wish to know, if Trump's\
    \ monthly tweets are of a certain observation sequence, such as (Bullish, Bullish,\
    \ Bullish), what is happening in the market?\n\nIn this case Viterbi's Algorithm\
    \ can be followed. A diagram of Viterbi's Algorithm can be found in [Figure 2.11](#chapter2.xhtml#fig2_11)\
    \ which shows that if Trump's three month tweet sentiment is (Bullish, Bearish,\
    \ Bullish) the most likely hidden sequence of the market is\n\n$$\\\\begin{array}{r}\
    \ {\\\\text{~(Up,~Down,~Up)~with~probability~}.2523.} \\\\\\\\ \\\\end{array}$$\
    \  \n\n![Figure 2.11 Viterbi's Algorithm for three month marker trends based on\
    \ tweets.](images/fig2_11.jpg)\n\n[Figure 2.11](#chapter2.xhtml#b2fig2_11) Viterbi's\
    \ Algorithm for three month marker trends based on tweets.\n\nFinally, we wish\
    \ to find the best model. We begin by assuming that\n\n$$\\\\begin{array}{r} {O\
    \ = (Bullish,\\\\, Bullish,\\\\, Bullish),} \\\\\\\\ \\\\end{array}$$  \n\nthe\
    \ first three states in [Table 2.3](#chapter2.xhtml#tbl2_3), then\n\n$$\\\\begin{aligned}\
    \ {\\\\alpha{(H\\_{1})}^{U}} & {= \\\\frac{5}{11},\\\\,\\\\,\\\\,\\\\,\\\\alpha{(H\\\
    _{1})}^{D} = \\\\frac{1}{11},} \\\\\\\\ {\\\\alpha{(H\\_{2})}^{U}} & {= \\\\frac{1}{33},\\\
    \\,\\\\,\\\\,\\\\,\\\\alpha{(H\\_{2})}^{D} = \\\\frac{16}{55},} \\\\\\\\ {\\\\\
    alpha{(H\\_{3})}^{U}} & {= \\\\frac{49}{198},\\\\,\\\\,\\\\,\\\\alpha{(H\\_{3})}^{D}\
    \ = \\\\frac{4}{825},} \\\\\\\\ \\\\end{aligned}$$  \n\n$$\\\\begin{aligned} {\\\
    \\beta{(H\\_{3})}^{U}} & {= 1,\\\\,\\\\,\\\\,\\\\,\\\\,\\\\beta{(H\\_{3})}^{D}\
    \ = 1,} \\\\\\\\ {\\\\beta{(H\\_{2})}^{U}} & {= \\\\frac{9}{150},\\\\,\\\\,\\\\\
    beta{(H\\_{2})}^{D} = \\\\frac{5}{6},} \\\\\\\\ {\\\\beta{(H\\_{1})}^{U}} & {=\
    \ \\\\frac{2449}{4500},\\\\,\\\\beta{(H\\_{1})}^{D} = \\\\frac{49}{900}.} \\\\\
    \\\\ \\\\end{aligned}$$  \n\nNote that these values tell us that\n\n$$\\\\begin{array}{r}\
    \ {P(O|\\\\lambda) = {\\\\sum\\\\limits\\_{k}\\\\alpha}{(H\\_{3})}^{k} = 0.2523.}\
    \ \\\\\\\\ \\\\end{array}$$  \n\nUsing this information, we determine\n\n$$\\\\\
    begin{array}{r} {\\\\gamma{(H\\_{1})}^{(U,D)} = \\\\left\\\\{ 0.98038431,\\\\\
    , 0.01961569 \\\\right\\\\},} \\\\\\\\ \\\\end{array}$$  \n\n$$\\\\begin{array}{r}\
    \ {\\\\gamma{(H\\_{2})}^{(U,D)} = \\\\left\\\\{ 0.03923139,\\\\, 0.96076861 \\\
    \\right\\\\},} \\\\\\\\ \\\\end{array}$$  \n\n$$\\\\begin{array}{r} {\\\\gamma{(H\\\
    _{3})}^{(U,D)} = \\\\left\\\\{ 0.98078463,\\\\, 0.01921537 \\\\right\\\\},} \\\
    \\\\\\ \\\\end{array}$$  \n\n$$\\\\begin{aligned} {\\\\xi\\_{t}(i,j)} & {= P(H\\\
    _{t} = j,H\\_{t + 1} = i|O,\\\\lambda)} \\\\\\\\ & {= \\\\alpha(H\\_{i})E\\_{H\\\
    _{t + 1},j}T\\_{i,j}\\\\beta(H\\_{t + 1})} \\\\\\\\ \\\\end{aligned}$$  \n\nand\
    \ the new model is *π*^(*n**e**w*) = {0.98038431, 0.01961569}.\n\n$$\\\\begin{array}{l}\
    \ {T^{new} = \\\\left( \\\\begin{array}{ll} 0.51020408 & 1 \\\\\\\\ 0.48979592\
    \ & 0 \\\\\\\\ \\\\end{array} \\\\right),\\\\, E^{new} = \\\\left( \\\\begin{array}{ll}\
    \ 0.96153846 & 0.01960784 \\\\\\\\ 0.03846154 & 0.98039216 \\\\\\\\ \\\\end{array}\
    \ \\\\right).} \\\\\\\\ \\\\end{array}$$  \n\nKeep in mind that this is just one\
    \ iteration of the Baum-Welch algorithm.\n\nPython and R code related to this\
    \ case study can be found at Github links 14 and 15, respectively.\n\n## 2.6 Exercises\n\
    \n*   Determine which of the following matrices are primitive or irreducible.\n\
