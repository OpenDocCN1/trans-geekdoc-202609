    ### 4.3. Newton''s Interpolation via the Vandermonde Matrix


    We can also write Newton''s divided differences in terms of the Vandermonde matrix.
    In order to do so, we introduce the concept of LU-decomposition so that we can
    later decompose the Vandermonde matrix in this context.


    Let `A` be a square matrix. If `A` can be written in terms of a lower triangular
    matrix, `L`, with diagonal entries equal to 1, and an upper triangular matrix,
    `U`, such that


    $$\begin{array}{r} {A = LU} \\ \\end{array}$$


    then we say that `A` has a LU-decomposition.


    If a matrix `A` has a LU-decomposition, `L` and `U` can be determined by finding
    a sequence of matrices `L[0]`, `L[1]`, …, `L[k]`, such that


    $$\begin{array}{r} {L\_{k} \cdot \cdot L\_{1}L\_{0}A = U,} \\ \\end{array}$$


    where `L[i]` is a lower triangular elementary matrix, 0 ≤ `i` ≤ `k`. Then


    $$\begin{array}{r} {L = L\_{0}^{- 1}\ldots L\_{k}^{- 1}.} \\ \\end{array}$$


    Note that `V` is a nonsingular matrix as long as `x[i]`, 0 ≤ `i` ≤ `n−1` are unique.
    We wish to determine coefficients `a` = {`a[0]`, `a[1]`, …, `a[n]`} such that


    $$\begin{array}{r} {Va = \hat{f}.} \\ \\end{array}$$


    We can use the LU decomposition of the Vandermonde matrix `V` to find the divided
    differences,


    $$\begin{array}{l} {f\\lbrack x\_{0},x\_{1},\\ldots,x\_{i}\\rbrack = U\_{i,i}^{-
    1}L^{- 1}\\left( \begin{array}{l} {f\\lbrack x\_{0}\\rbrack} \\\\ {f\\lbrack x\_{1}\\rbrack}
    \\\\ \vdots \\\\ {f\\lbrack x\_{n}\\rbrack} \\\\ \\end{array} \right)} \\ \\end{array}$$


    ### 4.4 Chebyshev Interpolation


    For the interpolating techniques presented in this chapter thus far, we have assumed
    that interpolating points are given. There are instances where you are able to
    choose the interpolating points or that equally spaced interpolating points can
    be transformed onto another set of points.


    **Chebyshev interpolation** is a method when `n` interpolating points are located
    at the **Chebyshev nodes**, the roots of the $n^{th}$ degree Chebyshev polynomial
    of the first kind, `T[n](x)`,


    $$\begin{array}{r} {x_{k} = cos\\left( \frac{(2k + 1)\pi}{2n} \right),k = 0,\\,
    1,\\, 2,\\,\\ldots, n - 1.} \\ \\end{array}$$


    An $n^{th}$-degree polynomial, `p(x)`, interpolating a function `f(x)`, can be
    written as the sum of Chebyshev polynomials of the first kind,


    $$\begin{array}{r} {p(x) = \frac{1}{2}c\_{0}T_{0}(x) + {\\sum\\limits\_{i = 1}^{n}c\_{i}}T\_{i}(x),}
    \\ \\end{array}}$$


    where


    $$\begin{array}{r} {c\_{i} = \frac{2}{n}{\\sum\\limits\_{k = 0}^{n}f}(x\_{k})T\_{i}(x\_{k}).}
    \\ \\end{array}}$$


    ![Figure 4.5 Example of Chebyshev interpolation of f(x) = \frac{1}{1 + x^{2}}.](images/fig4_5.jpg)


    Figure 4.5 Example of Chebyshev interpolation of $f(x) = \frac{1}{1 + x^{2}}$.


    It is important to note that Chebyshev interpolation is traditionally meant to
    be conducted on the interval $[-1, 1]$ since the roots of the Chebyshev polynomials
    are on the unit circle. Thus, if you intended to use Chebyshev interpolation on
    an interval $[a, b]$ you must first create a linear transformation


    $$\begin{array}{r} \\left. \mathcal{T}:\\lbrack - 1,\\, 1\\rbrack\\rightarrow\\lbrack
    a,\\, b\\rbrack,\\text{where~}u( 1) = a\\text{~and~}u(1) = b. \\right. \\ \\end{array}}$$


    If $u=\alpha x+\beta$ then


    $$\begin{array}{r} {a = - \alpha + \beta,b = \alpha + \beta} = \frac{b - a}{2}$$


    ![Figure 4.6 Example of Chebyshev interpolation of f(x) = e^{x} on [-1, 3].](images/fig4_6.jpg)


    Figure 4.6 Example of Chebyshev interpolation of $f(x)=e^{x}$ on $[-1, 3]$.


    It may seem obscure to be able to choose interpolation points at the Chebyshev
    nodes; however, Chebyshev interpolation is used extensively in numerical analysis,
    particularly in creating filters, due to its ability to minimize **Runge''s phenomenon**.


    Runge''s phenomenon occurs with polynomial interpolants of high degree over a
    set of equally spaced points. Runge''s phenomenon is when the interpolant matches
    the desired function or data well in the middle and begins to oscillate at the
    edges. This phenomena should be considered when deciding the degree of your interpolant.
    An example of Runge''s phenomenon can be seen in Figure 4.7.


    ![Figure 4.7 Example of Runge''s phenomenon with f(x) = \frac{1}{1 + 25x^{2}}
    on [-1, 1] with 5th and 9th degree interpolants.](images/fig4_7.jpg)


    Figure 4.7 Example of Runge''s phenomenon with $f(x) = \frac{1}{1 + 25x^{2}}$
    on $[-1, 1]$ with $5^{th}$ and $9^{th}$ degree interpolants.


    ### 4.5 Hermite Interpolation


    Thus far we have been focusing on creating an interpolating function just on interpolating
    points. **Hermite interpolation** constructs a interpolating function that involves
    both function and derivative values.


    Like Lagrange interpolation, a hermite interpolating function `h(x)`, requires
    that, for an unknown function `f(x)`, `h(x)` matches `f(x)` and its first $p$
    derivatives on a set of $n+1$ data points.


    That is,


    $$\begin{aligned} {h(x_{i})} &= f(x_{i}),\text{for~}0 \leq i \leq n \\ {h^{(k)}(x_{i})}
    &= f^{(k)}(x_{i}),\text{for~}0 \leq i \leq n,0 \leq p.}$$


    By definition `h(x)` has $(n+1)(p+1)$ constraints imposed on it and thus we will
    be seeking a polynomial of $(n+1)(p+1)-1$ degree to satisfy all of these requirements.


    We begin with an example before making general statements around hermite polynomials.


    If we wish to concern ourselves with exploring only those Hermite interpolating
    functions that satisfy conditions up through the first derivative, `h(x[i])=f(x[i])`
    and `h''(x[i])=f''(x[i])`, we can write such Hermite interpolating functions in
    terms of Newton''s divided difference if the known points `(x[i], f''(x[i]))`
    are treated as interpolating points as well.


    ### 4.6 Least Squares Regression


    This section focuses on determining interpolating polynomials satisfying


