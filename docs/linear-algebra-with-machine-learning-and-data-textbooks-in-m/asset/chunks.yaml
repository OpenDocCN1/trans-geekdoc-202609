    \ + a_{1}(x - x_{0}) + a_{2}(x - x_{0})(x - x_{1}) + a_{3}(x - x_{0})(x - x_{1})(x\
    \ - x_{2}) = f(x_{0}) + (x - x_{0})f\\lbrack x_{0},x_{1}\\rbrack + (x - x_{0})(x\
