    | EQR | 0.0182311 | 0.0180786 | 0.00277923 | -0.00156236 | -0.000869036 | 0.0121644
    |

    | UAL | 0.00757293 | -0.0236652 | 0.0115209 | -0.0122937 | 0.019143 | 0.0143075
    |


    首先，我们将计算每只股票连续交易日的**对数收益率**。


    $$\begin{array}{r} {\log(return) = \log\left( \frac{p_{i}}{p_{i - 1}} \right)}}
    \end{array}$$


    其中 $p[i]$ 代表第 $i$ 个交易日的指数。然后我们对每只股票的交易数据进行归一化，减去均值并除以标准差。


    ![图 7.11 美国航空 2013 年 2 月至 2018 年 2 月的对数收益率。](img/fig7_11.jpg)


    图 7.11 美国航空 2013 年 2 月至 2018 年 2 月。


    在这个案例研究中，我们将研究限制在代表 6 天期间的小相关数据集上。一个 $6 \times 6$ 的 `stock` × `log(return)` 矩阵
    $X$ 可以从表 7.2 中的数据定义。注意，该矩阵使用了 6 只股票在第一个 6 天期间（第 1 天到第 6 天）的对数收益率。类似的矩阵可以从第 2 天到第
    7 天创建，通常股票价格观测值为 $M$ 天，则矩阵将具有 $M$ 列，代表从第 $i$ 天到第 $i+M$ 天。


    对于每个连续 $M$ 天，我们可以创建一个相关矩阵：


    $$\begin{array}{r} {W = \frac{XX^{T}}{M}}} \end{array}$$


    并确定相关矩阵 $W$ 的特征值。注意 $W$ 是一个 Wishart 矩阵。


    图 7.12 使用来自表 7.2 2013 年 2 月至 2018 年 2 月股票的更大数据集，显示了 $W$ 最大特征值的分布，可以在 Github 链接
    48 找到。


    ![图 7.12 相关矩阵的最大特征值分布。](img/fig7_12.jpg)


    图 7.12 相关矩阵的最大特征值分布。


    一个联系 6 天期间对数收益的协方差矩阵，也可以帮助我们理解表 7.11 中股票的行为。


    我们还可以观察 $W$ 的最大特征值随时间的变化与平均协方差的关系。注意图 7.13 中的行为相似性。


