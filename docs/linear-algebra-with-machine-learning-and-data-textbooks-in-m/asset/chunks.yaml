    \ measure \U0001D4AB:ℰ→\\[0,1\\] where \U0001D4AB(\U0001D4AE) = 1.\n\nA **random\
    \ variable**, *X*, is a function on the sample space. A **discrete random variable**\
    \ is a random variable whose sample space is countable, finite, or infinite. A\
    \ **continuous random variable** is one in which the sample space is uncountable.\n\
    \nIf *X* is a discrete random variable,\n\n\U0001D4AB(\U0001D4B3) = \U0001D4AB\
    (\U0001D4B3 = *x*)  \n\nis called a **probability distribution function**.\n\n\
    For a discrete random variable, *X*, the **cumulative distribution function**,\n\
    \n$$\\\\begin{array}{r} {D(x) = P(X \\\\leq x\\_{k}) = {\\\\sum\\\\limits\\_{i\
    \ = 1}^{k}P}(X = x\\_{i}),} \\\\\\\\ \\\\end{array}$$  \n\nwhere the sample space\
    \ *S* = {*x*[1],*x*[2],…,*x*[*k*],…,*x*[*n*]}.\n\nThe **expected value**, or mean,\
    \ of a discrete random variable, *X*,\n\n$$\\\\begin{array}{r} {E(X) = {\\\\sum\\\
    \\limits\\_{i = 1}^{n}x\\_{i}} \\\\cdot P(X = x\\_{i}),} \\\\\\\\ \\\\end{array}$$\
    \  \n\nand the variance of a discrete random variable,\n\n$$\\\\begin{array}{r}\
    \ {Var(X) = E(X^{2}) - {(E(X))}^{2} = {\\\\sum\\\\limits\\_{i = 1}^{n}x\\_{i}^{2}}\
    \ \\\\cdot P(X = x\\_{i}) - \\\\left( {{\\\\sum\\\\limits\\_{i = 1}^{n}x\\_{i}}\
    \ \\\\cdot P(X = x\\_{i})} \\\\right)^{2}.} \\\\\\\\ \\\\end{array}$$  \n\n![Figure\
    \ 5.1 Binomial Distribution representing the number of heads in 10 flips of a\
    \ fair coin.](images/fig5_1.jpg)\n\n[Figure 5.1](#chapter5.xhtml#b5fig5_1) Binomial\
    \ Distribution representing the number of heads in 10 flips of a fair coin.\n\n\
