    With just inputs and one output, the neural network, in its simplest form as it
    is visualized in [Figure 5.10](#chapter5.xhtml#fig5_10), is called a `perceptron`.
    The perceptron is not a very interesting case of a neural network as we can accomplish
    the same thing with the techniques provided in previous sections of this chapter,
    writing `y = WX`, where `X` incorporates the inputs and the constant, bias term.


    ![Figure 5.10 Visualization of a perceptron.](images/fig5_10.jpg)


    [Figure 5.10](#chapter5.xhtml#b5fig5_10) Visualization of a perceptron.


    If `W = {w[1], w[2],..., w[n]}` are the weights, then we can think of this as
    a linear combination of basis vectors, functions. For example, if `h[1](x) = 1`
    and `h[2](x) = x`,


    $$\begin{array}{r} {\\hat{y} = w_{1}h_{1}(x) + w_{2}h_{2}(x)} \\\\ \end{array}$$


    is a linear model. Similarly, if one wished to use a quadratic function as the
    model, then the basis vectors would be


    $$\begin{array}{r} {\\left\\\{ 1,\\, x,\\, x^{2} \\right\\}.} \\\\ \end{array}$$


    The concept of neural networks becomes much more interesting when there is a `hidden
    layer`, `S`, adding to the complexity between the input and output values.


    Like the gradient descent method, we start with a random guess for `W` and adjust
    the weights iteratively.


    In addition, an `activation function`, can be incorporated such that


    $$\begin{array}{r} {S = \phi(WX),\\text{~and~}y = \\overline{W}S,} \\\\ \end{array}$$


    $\overline{W}$ is an updated weight matrix found after `S` is determined. There
    are a variety of activation techniques, which will be discussed in detail in [Sections
    5.5.2](#chapter5.xhtml#sec5_5_2) and [5.5.3](#chapter5.xhtml#sec5_5_3).


    We begin with a simple example based on a binary decision, and then we will see
    how this applies to the interpolation problem.


    Machine learning works to adjust the weights and threshold in order to minimize
    errors. In addition, when using neural networks for an interpolation problem,
    typically a smoothing activation function, `ϕ(WX)`, is applied at each step.


    ### 5.5.1 The Learning Process


    The most important aspect of neural networks is the ability to learn. In the context
    of interpolation, this can be interpreted such that at each step the weights,
    `w[i]`, `i = 1,...n`, and `${\overline{w}}_{j},j = 1,\ldots m`, are adjusted to
    minimize the error.


    ![Figure 5.11 Example of General Neural Network with Activation Function.](images/fig5_11.jpg)


    Figure 5.11 Example of General Neural Network with Activation Function.


    After applying the activation function, `ϕ(S) = ϕ(WX)`, the Gradient Descent method
    can be applied to find optimal weights that minimize the SSE or any other cost
    function.


    When an activation function is applied with learning rate, `r`, and the SSE as
    the cost function,


    $$\begin{array}{r} {\\text{new~}w_{i} = w_{i} - r\\frac{\\partial SSE}{\partial
    w_{i}}.} \\\\ \end{array}$$


    ### 5.5.2 Sigmoid Activation Functions


    There are many different activation functions that you can use for `ϕ(x)`. The
    activation function, or transfer function, is the transformation function that
    creates the output nodes. Thus, the choice of activation function can have a large
    impact on the performance of the neural network.


    Activation functions are typically differentiable. This is because, in a learning
    process integrating a technique such as gradient descent, occurs after the activation
    function is applied. We will introduce four possible activation functions here
    and show you how they perform.


    Typical smoothing functions from `regularization` can be used for `ϕ(x)`. The
    first activation function of interest is the `SoftMax function`, where


    $$\begin{array}{r} {\\phi(x_{k}) = \frac{e^{x_{k}}}{\sum\\limits\_{i = 1}^{n}e^{x_{i}}},}
    \\\\ \end{array}$$


    and the partial derivative of `ϕ(x[k])` with respect to `x[k]` is


    $$\begin{array}{r} {\\frac{\\partial\\phi(x_{k})}{\partial x_{k}} = \frac{e^{x_{k}}}{\sum\\limits\_{i
    = 1,i \\neq k}^{n}e^{x_{i}}}}{{({\sum\\limits\_{i = 1}^{n}e^{x_{i}}})}^{2}}.}
    \\\\ \end{array}$$


    Another common activation function is called the `logistic sigmoid neuron function`.


    $$\begin{array}{r} {\\phi(X) = \frac{1}{1 + e^{- (WX)}}.} \\\\ \end{array}$$


    The benefit of using the logistic sigmoid neuron function is that all output values
    will be between 0 and 1, and thus are good predictors related to probability.


    [Figure 5.12](#chapter5.xhtml#fig5_12) gives you a general idea of how the sigmoid
    activation function acts within a neural network, and [Figure 5.13](#chapter5.xhtml#fig5_13)
    shows an example of a logistic sigmoid neuron function.


    ![Figure 5.12 Neural network with sigmoid activation function.](images/fig5_12.jpg)


    [Figure 5.12](#chapter5.xhtml#b5fig5_12) Neural network with sigmoid activation
    function.


    ![Figure 5.13 Logistic function centered at x = 1.](images/fig5_13.jpg)


    [Figure 5.13](#chapter5.xhtml#b5fig5_13) Logistic function centered at `x = 1`.


    [Figure 5.14](#chapter5.xhtml#b5fig5_14) shows `S`, `ϕ(S)`, and the original data.
    Note that in Example 5.2, weights were imposed on `S`.


    ![Figure 5.14 ϕ(S).](images/fig5_14.jpg)


    [Figure 5.14](#chapter5.xhtml#b5fig5_14) `S`, `ϕ(S)`.


    Another commonly used activation function is `hyperbolic tangent`,


    $$\begin{array}{r} {\\phi(x) = \end{array}$$


    the `hyperbolic tangent` function.


    ![Figure 5.15 ϕ(x) = tanh(x).](images/fig5_15.jpg)


    [Figure 5.15](#chapter5.xhtml#b5fig5_15) `ϕ(x) = tanh(x)`.


    If we choose an activation function like `ϕ(x)`,


    $$\begin{array}{r} {\\phi = \end{array}$$


    then we are allowing output values to be positive and negative.


    ![Figure 5.16 Data from Example 5.21 and Tanh(0.29869 + 0.46122x).](images/fig5_16.jpg)


    [Figure 5.16](#chapter5.xhtml#b5fig5_16) Data from Example 5.21 and `Tanh(0.29869
    + 0.46122x)`.


    Finally, one of the most used activation functions is the `rectified linear unit`,
    `ReLU`. Defined as


    $$\begin{array}{l} {\\phi(x) = \\left\\\{ \begin{array}{ll} {0,} & {x < 0} \\\\
    {x,} & {x \\geq 0} \\\\ \end{array}~ \\right.} \\\\ \end{array}$$


    Notice that the `ReLU` activation function is not differentiable at `x = 0` and


    $$\begin{array}{l} {\\phi^{\\prime}(x) = \\left\\\{ \begin{array}{ll} {0,} & {x
    < 0} \\\\ \\text{undefined,} & {x = 0} \\\\ {1,} & {x > 0} \\\\ \end{array}~ \\right.}
    \\\\ \end{array}$$


    ![Figure 5.17 ReLu activation function.](images/fig5_17.jpg)


    Figure 5.17 ReLu activation function.


    The `ReLU` activation function is the most commonly used activation function because
    of it''s accuracy while remaining easy to use and train.


    Additionally, the `ReLU` activation function is used to manage the interaction
    between input, dependent variables. For example, if there are two input variables,
    `x[1]` and `x[2]`, an activation function `ϕ` acts on the input variables, `ϕ(w[1]x[1]
    + w[2]x[2])`. Let''s assume that `w[1] = w[2] = 1`, then


    $$\begin{array}{l} {\\phi(w_{1}x_{1} + w_{2}x_{2}) = \\left\\\{ \begin{array}{ll}
    {0,} & {x_{1} < |x_{2}|} \\\\ {x_{1} + x_{2},} & {x_{1} \geq |x_{2}|} \\\\ \end{array}~
    \\right.} \\\\ \end{array}}$$


    Note that if both `x[1] > |x[2]| > 0` then both input variables contribute to
    the output.

