    如果我们使用整个数据集对模型进行验证以观察性能，并发现存在过拟合错误，那么就需要对树进行`pruning`（剪枝）。这需要消除某些叶节点层，以减少对数据划分的限制。


    在示例 6.10 中，使用了常数函数在域的每个子集内创建模型；但你可能会注意到线性函数或其他函数更拟合数据。在这种情况下，如示例 6.11 所示，仍然可以确定域的子集以开发决策树；但在这些子域内，可以采用在第
    4 章和第 5 章中介绍的其他回归技术。


