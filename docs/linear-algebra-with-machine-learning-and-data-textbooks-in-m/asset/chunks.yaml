    ![图 3.13 森林部落的可视化](img/fig3_13)


    图 3.13 森林部落的可视化。


    ## 3.8 案例研究：使用 PCA 和 LDA 进行人脸识别


    执法人员每天都要处理人脸识别问题。假设你收到一组犯罪照片和一张新照片。你的任务是确定哪张新照片最像。在这个案例研究中，我们将使用每张照片的像素数据对照片进行聚类；但请记住，人脸识别中许多因素人类专家可能做得更好。这些包括性别、发型变化甚至拍摄的位置。图
    3.14 显示了 10 个人的头部照。在最近的一个案件中，拍到了两个嫌疑人的照片；但照片分辨率很差。他们的照片是图 3.14 中的 5 号和 10 号。


    ![图 3.14 用于人脸识别的 10 张头部照](img/fig3_14)


    图 3.14 用于人脸识别的 10 张头部照 [14]。你的任务是确定图 3.14 中 1-4 和 6-9 号头部照中的哪一个人像嫌疑人；如果你能将搜索缩小到子类别，可以查看较小的照片子集来寻找嫌疑人。图
    3.14 中 1-4 号每个头部照中间的九字节像素表示可以在矩阵 `A` 的列中找到。我们将使用每张照片中心的小版本图像数据进行此案例研究，数据可以在 Github
    链接 24 中找到。


    $$\begin{array}{l} {A = \left( \begin{array}{lllll} 97 & 125 & 106 & 172 & 238
    \\ 96 & 93 & 100 & 185 & 239 \\ 81 & 72 & 93 & 200 & 240 \\ 87 & 70 & 103 & 171
    & 235 \\ 95 & 54 & 97 & 187 & 236 \\ 86 & 55 & 88 & 203 & 237 \\ 48 & 58 & 100
    & 169 & 232 \\ 67 & 47 & 96 & 187 & 233 \\ 90 & 51 & 87 & 203 & 234 \\ \end{array}
    \right.} \end{array}$$


    使用 `A^(T)*A` 的两个最大的主成分来构建 `Ũ`，我们可以在 ℝ² 中可视化这些照片的表示形式，如图 3.15 所示，与最大主成分相关的特征向量项位于
    x 轴上，与第二大主成分相关的项位于 y 轴上。


    ![图 3.15 基于 PCA 的照片 1-5 可视化](img/fig3_15)


    图 3.15 基于 PCA 的照片 1-5 可视化。


    不幸的是，如果你最初无法将 `B` 缩小到子类，通过 PCA 可能无法轻易检测出这些特征，正如 `B` 矩阵包含了每个照片的九数据点一样。


    $$\begin{array}{l} {B = \left( \begin{array}{ll} 0.24 & 0.47 \\ 0.17 & 0.4 \\
    0.31 & 0.49 \\ 0.13 & 0.08 \\ 0.23 & 0.36 \\ 0.43 & 0.24 \\ 0.44 & 0.26 \\ 0.14
    & 0.13 \\ 0.43 & 0.25 \\ 0.41 & 0.2 \end{array} \right)} \end{array}$$


    一个我们可以从图 3.16 中看到，5 号嫌疑人不再最像 1-4 号。然而，如果每个嫌疑人有超过 10000 个像素，如图 3.17 所示，通过 PCA 就能识别出组之间的更多区别。这些数据可以在
    Github 链接 25 中找到。


    ![图 3.16 只有 9 个像素的数据数据](img/fig3_16)


    图 3.16 只有 9 个像素的数据数据。


    ![图 3.17 有超过 10000 个像素的嫌疑人](img/fig3_17)


    图 3.17 有超过 10000 个像素的嫌疑人。


