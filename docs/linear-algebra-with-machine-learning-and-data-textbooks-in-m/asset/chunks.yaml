- fmt: "\nIn [Figure 5.6](#chapter5.xhtml#fig5_6), a loss function is pictured. The\
    \ `gradient` (also called the rate of change or first derivative) of the function\
    \ is the rate at which the function is changing. Notice that at point `a`, the\
    \ function is decreasing, thus the gradient is negative.\n\n![Figure 5.6 Visualization\
    \ of the gradient of a loss function.](images/fig5_6.jpg)\n\n[Figure 5.6](#chapter5.xhtml#b5fig5_6)\
    \ Visualization of the gradient of a loss function.\n\n**If the function is decreasing\
    \ then the gradient is negative.**\n\nSimilarly, notice that at point `c` in [Figure\
    \ 5.6](#chapter5.xhtml#fig5_6), the function is changing in a positive direction.\
    \ Most importantly, the rate at which the function is changing at a minimum (or\
    \ maximum), the slope of the dashed line (on [Figure 5.6](#chapter5.xhtml#fig5_6)),\
    \ is zero.\n\n**If the function is increasing then the gradient is positive.**\n\
    \n**A function reaches an optimum value (either a minimum or maximum) when the\
    \ gradient is zero.**\n\nThus, one can determine the values that minimize a function\
    \ by calculating the `gradient` of the function and finding the values, also called\
    \ `parameters`, that optimize the loss function.\n\nIf `SSE` is the loss function\
    \ then we denote the gradient of `SSE` with respect to the coefficient `a`[`i`]\
    \ as\n\n$$\\\\begin{array}{r} {\\\\frac{\\\\partial SSE}{\\partial a\\_{i}}.}\
    \ \\\\\\\\ \\\\end{array}$$  \n\nIf $\\hat{y} = \\hat{f(x)} = a_{0} + a_{1}x +\
    \ a_{2}x^{2} + \\ldots a_{n}x^{n}$, then\n\n$$\\\\begin{aligned} {SSE} & {= {(y\
    \ - (a_{0} + a_{1}x + a_{2}x^{2} + \\ldots a_{n}x^{n}))}^{2}} \\\\\\\\ \\\\frac{\\\
    \\partial SSE}{\\partial a\\_{0}} & {= - 2(y - (a_{0} + a_{1}x + a_{2}x^{2} +\
    \ \\ldots a_{n}x^{n})) = - 2(y - \\hat{y})} \\\\\\\\ \\\\frac{\\\\partial SSE}{\\\
    partial a\\_{1}} & {= - 2x(y - (a_{0} + a_{1}x + a_{2}x^{2} + \\ldots a_{n}x^{n}))\
    \ = - 2x(y - \\hat{y})} \\\\\\\\ & \\\\vdots \\\\\\\\ \\\\frac{\\\\partial SSE}{\\\
    partial a\\_{2}} & {= - 2x^{n}(y - \\hat{y}).} \\\\\\\\ \\\\end{aligned}$$  \n\
    \nThe Gradient Descent Algorithm consists of:\n\n1. Creating a interpolant, `ŷ` = `f̂`(`x`),\
    \ using `n` interpolating points. \n   The coefficients, `a`[`i`], 0 ≤ `i` ≤ `n`,\
    \ that are determined are called `weights` in this algorithm. Begin by making\
    \ a good guess for each of the coefficients and choosing a loss function, such\
    \ as `SSE`.\n\n2. For each coefficient, `a`[`i`], determine the gradient\n\n \
    \  $$\\\\begin{array}{r} {\\\\frac{\\\\partial SSE}{\\partial a\\_{i}} = {\\\\\
    sum\\\\limits\\_{j = 0}^{n}{(y\\_{j} - \\hat{y\\_{j}})}}{(x\\_{j})}^{i}.} \\\\\
    \\\\ \\\\end{array}}$$  \n\n3. Adjust the `weights` taking into consideration\
    \ a learning rate, `r`,\n\n   $$\\\\begin{array}{r} {\\\\text{new~}a\\_{i} = a\\\
    _{i} + r\\\\frac{\\\\partial SSE}{\\partial a\\_{i}}.} \\\\\\\\ \\\\end{array}$$\
    \  \n\n4. Repeat Steps 2-4 to update the coefficients and approach a minimum `SSE`.\n\
    \n![Figure 5.8 Example 5.15 data and cubic interpolants for several iterations\
    \ of gradient descent.](images/fig5_8.jpg)\n\n[Figure 5.8](#chapter5.xhtml#b5fig5_8)\
    \ Example 5.15 data and cubic interpolants for several iterations of gradient\
    \ descent.\n\nGradient Descent methods can be written in terms of matrix system\
    \ as well. If the interpolation function is an `n`^(th) degree polynomial\n\n\
    $$\\\\begin{array}{r} {\\\\hat{y} = a_{0} + a_{1}x + \\ldots + a_{n}x^{n},} \\\
    \\\\\\ \\\\end{array}}$$  \n\nthen the `SSE` cost function can be written as\n\
    \n$$\\\\begin{array}{r} {SSE = {(XA - Y)}^{T}(XA - Y),\\\\{~where~}} \\\\\\\\\
    \ \\\\end{array}}$$  \n\n$$\\\\begin{array}{l} {X = \\left( \\begin{array}{lllll}\
    \ 1 & x_{0} & x_{0}^{2} & \\ldots & x_{0}^{n} \\\\ 1 & x_{1} & x_{1}^{2} & \\\
    ldots & x_{1}^{n} \\\\ \\\\vdots & \\ddots & \\ddots & \\ddots & \\\\vdots \\\\\
    \ 1 & x_{n} & x_{n}^{2} & \\ldots & x_{n}^{n} \\\\ \\\\end{array} \\right),\\\\\
    , A = \\left( \\begin{array}{l} a_{0} \\\\ a_{1} \\\\ \\\\vdots \\\\ a_{n} \\\\\
    \ \\\\end{array} \\right),} \\\\\\\\ \\\\end{array}$$  \n\n$$\\\\begin{array}{l}\
    \ {and\\\\, Y = \\left( \\begin{array}{l} y_{0} \\\\ y_{1} \\\\ \\\\vdots \\\\\
    \ y_{n} \\\\ \\\\end{array} \\right).} \\\\\\\\ \\\\end{array}$$  \n\nThe gradients\
    \ are\n\n$$\\\\begin{array}{r} {\\\\frac{\\\\partial SSE}{\\partial A} = X^{T}(XA\
    \ - Y), \\\\\\\\ \\\\end{array}}$$  \n\nand if `r` is the learning rate then\n\
    \n$$\\\\begin{array}{r} {A_{i}^{(j + 1)} = A_{i}^{(j)} - r\\\\frac{\\\\partial\
    \ SSE}{\\partial a\\_{i}}, \\\\\\\\ \\\\end{array}}$$  \n\nwhere `A`[`i`]`^(j\
    \ + 1)` = `A`[`i`]`^(j)` - `r`$\\\\frac{\\\\partial SSE}{\\partial a\\_{i}}$ (where\
    \ text cuts off).\n"
