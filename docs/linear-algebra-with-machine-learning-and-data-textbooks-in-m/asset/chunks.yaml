    \ a transition matrix,\n\n$$\\\\begin{array}{l} {T = \\\\left( \\\\begin{array}{lll}\
    \ S & I & R \\\\\\\\ 0.99998 & 0. & 0.0714286 \\\\\\\\ 0.00002 & 0.998 & 0. \\\
    \\\\\\ 0. & 0.002 & 0.928571 \\\\\\\\ \\\\end{array} \\\\right).} \\\\\\\\ \\\\\
    end{array}$$  \n\nproduces a spread of infection shown in [Figure 2.7](#chapter2.xhtml#fig2_7).\n\
    \n![Figure 2.7 Growth of disease under a simple discrete SIR model.](images/fig2_7.jpg)\n\
    \n[Figure 2.7](#chapter2.xhtml#b2fig2_7) Growth of disease under a simple discrete\
