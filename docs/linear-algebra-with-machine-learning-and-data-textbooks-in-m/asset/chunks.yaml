    \ matrices relate to random matrices through a financial lens.\n\nThe unconditional\
    \ probability distribution for any traded financial commodity (such as stocks,\
    \ currencies, interest rates) is far from a Gaussian distribution. This unconditional\
    \ probability distribution tends to follow a distribution similar to a **Rayleigh\
    \ distribution** or more generally a **power law** distribution, called the **Tracy-Widom\
    \ distribution**.\n\nThe general form of a Rayleigh probability density function\
    \ is\n\n$$\\\\begin{array}{r} {f(x) = \\\\frac{x}{\\\\sigma^{2}}e^{\\\\frac{-\
    \ x^{2}}{2\\\\sigma^{2}}},\\\\, 0 \\\\leq x < \\\\infty,} \\\\\\\\ \\\\end{array}$$\
    \  \n\nwhere $E(X) = \\\\sigma\\\\sqrt{\\\\frac{\\\\pi}{2}}$ and $Var(X) = \\\\\
    left( \\\\frac{4 - \\\\pi}{2} \\\\right)\\\\sigma^{2}$.\n\nSome examples of this\
    \ probability distribution can be see in [Figure 7.8](#chapter7.xhtml#fig7_8).\n\
    \n![Figure 7.8 Examples of Rayleigh Distributions with different scaling factors.](images/fig7_8.jpg)\n\
    \n[Figure 7.8](#chapter7.xhtml#b7fig7_8) Examples of Rayleigh Distributions with\
    \ different scaling factors.\n\nThe largest eigenvalue of a random Gaussian Ensemble\
    \ matrix and its corresponding eigenvector can be interpreted as the collective\
    \ response of the market to external factors, so it can be compared with the market\
    \ index.\n\nIf *H* is a GUE random matrix, [Figure 7.9](#chapter7.xhtml#fig7_9)\
    \ shows an example of what the distribution of maximum eigenvalues of *H* would\
    \ look like.\n\n![Figure 7.9 Distribution of maximum eigenvalues of a GUE matrix.](images/fig7_9.jpg)\n\
    \n[Figure 7.9](#chapter7.xhtml#b7fig7_9) Distribution of maximum eigenvalues of\
    \ a GUE matrix.\n\nStocks have quite a bit of randomness in their volatility which\
    \ can been seen in the three airline stock trends seen in [Figure 7.10](#chapter7.xhtml#fig7_10).\
    \ [Table 7.1](#chapter7.xhtml#tbl7_1) shows a small subset of the data for these\
    \ three airline stocks, where columns represent the trading days and rows for\
    \ the different stocks. The stocks in this problem are correlated.\n\n![Figure\
    \ 7.10 American, Delta, and United Airline stock closing prices February 2013–February\
    \ 2018.](images/fig7_10.jpg)\n\n[Figure 7.10](#chapter7.xhtml#b7fig7_10) American,\
    \ Delta, and United Airline stock closing prices February 2013–February 2018.\n\
    \n[Table 7.1](#chapter7.xhtml#b7tbl7_1) Sample of Closing Prices for Stocks (Feb\
    \ 2013–Feb 2018).\n\n| AAL || 14.75 || 14.46 || 14.27 || 14.66 || 13.99 || 14.5\
    \ |\n\n| --- | --- | --- | --- | --- | --- | --- |\n\n| ABBV || 36.25 || 35.85\
    \ || 35.42 || 35.27 || 36.57 || 37.58 |\n\n| CBG || 24.19 || 24.13 || 24.26 ||\
    \ 24.5 || 24.7 || 24.28 |\n\n| DAL || 14.62 || 14.69 || 14.5 || 14.78 || 14.24\
    \ || 14.45 |\n\n| EQR || 55.44 || 56.46 || 57.49 || 57.65 || 57.56 || 57.51 |\n\
    \n| UAL || 26.31 || 26.51 || 25.89 || 26.19 || 25.87 || 26.37 |\n\nWe begin by\
    \ manipulating the data in [Table 7.1](#chapter7.xhtml#tbl7_1), as we have done\
    \ in other data sets throughout the text. Here we apply a logarithmic transformation\
    \ of the daily returns, which can be seen in [Table 7.2](#chapter7.xhtml#tbl7_2).\n\
    \n[Table 7.2](#chapter7.xhtml#b7tbl7_2) Sample of Logarithmic Returns for Stocks\
    \ (Feb 2013–Feb 2018).\n\n| AAL || \\-0.0198569 || \\-0.0132268 || 0.0269633 ||\
    \ \\-0.0467799 || 0.0358059 || \\-0.0166902 |\n\n| --- | --- | --- | --- | ---\
    \ | --- | --- |\n\n| ABBV || \\-0.0110958 || \\-0.0120669 || \\-0.00424389 ||\
    \ 0.0361955 || 0.0272438 || 0.0161017 |\n\n| CBG || \\-0.00248344 || 0.00537302\
    \ || 0.00984421 || 0.00813013 || \\-0.0171503 || 0.00902015 |\n\n| DAL || 0.00477654\
    \ || \\-0.0130183 || 0.0191263 || \\-0.03722 || 0.0146395 || \\-0.0104349 |\n\n\
    | EQR || 0.0182311 || 0.0180786 || 0.00277923 || \\-0.00156236 || \\-0.000869036\
    \ || 0.00121644 |\n\n| UAL || 0.00757293 || \\-0.0236652 || 0.0115209 || \\-0.0122937\
    \ || 0.019143 || 0.0143075 |\n\nFirst, we will calculate the **logarithmic returns**\
    \ for consecutive trading days for each stock.\n\n$$\\\\begin{array}{r} {\\\\\
    log(return) = \\\\log\\\\left( \\\\frac{p\\_{i}}{p\\_{i - 1}} \\\\right),} \\\\\
    \\\\ \\\\end{array}$$  \n\nwhere *p*[*i*] represents the price index on trading\
    \ day *i*. Then we normalize the trading data for each stock, subtracting the\
    \ mean and dividing by the standard deviation.\n\n![Figure 7.11 Logarithmic returns\
    \ for American Airline stock February 2013–February 2018.](images/fig7_11.jpg)\n\
    \nFigure 7.11 Logarithmic returns for American Airline stock February 2013–February\
    \ 2018.\n\nIn this case study, we will limit our study to small correlated data\
    \ sets representing a 6 day period. A 6 × 6, *s**t**o**c**k* × *l**o**g*(*r**e**t**u**r**n*),\
    \ matrix, *X*, can be defined from the data in [Table 7.2](#chapter7.xhtml#tbl7_2).\
    \ Notice that this matrix uses the logarithmic returns of the 6 stocks over the\
    \ first six day period, Day 1 through Day 6. A similar matrix can be created from\
    \ Day 2 through Day 7 and in general in the stock price observations are taken\
    \ for *M* days then the matrix will have *M* columns representing Day *i* through\
    \ Day *i* + *M*.\n\nFor each *M* consecutive days, we can create the correlation\
    \ matrix\n\n$$\\\\begin{array}{r} {W = \\\\frac{XX^{T}}{M},} \\\\\\\\ \\\\end{array}$$\
    \  \n\nand determine the eigenvalues of the correlation matrix *W*. Notice that\
    \ *W* is a Wishart matrix.\n\n[Figure 7.12](#chapter7.xhtml#fig7_12) shows the\
    \ distribution of the largest eigenvalue of *W* using a larger dataset from the\
    \ stocks in [Table 7.2](#chapter7.xhtml#tbl7_2) from February 2013 to February\
    \ 2018, which can be found at Github link 48.\n\n![Figure 7.12 Distribution of\
    \ Largest Eigenvalues for the Correlation Matrix.](images/fig7_12.jpg)\n\n[Figure\
    \ 7.12](#chapter7.xhtml#b7fig7_12) Distribution of Largest Eigenvalues for the\
    \ Correlation Matrix.\n\nA covariance matrix relating the log returns over a 6\
    \ day period, can also help us understand the behaviors of stocks in Table 7.11.\n\
    \nWe can also look at how the largest eigenvalues of *W* throughout time are related\
    \ to the average covariance as well. Notice the behavior similarities in [Figure\
    \ 7.13](#chapter7.xhtml#fig7_13)."
