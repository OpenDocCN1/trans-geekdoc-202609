    0.01 & 0.03 \\\\ 1 & 0 & 0.04 & 0.05 \\\\ 0 & 0.04 & 0.12 & 0.06 \\\\ 0 & 0.04
    & 0 & 0.03 \\\\ 0 & 0.04 & 0.12 & 0.06 \\\\ 0 & 0.08 & 0.01 & 0.08 \\\\ 0 & 0
    & 0.02 & 0.04 \\\\ 0 & 0.46 & 0 & 0.02 \\\\ 0 & 0.12 & 0 & 0.06 \\\\ 0 & 0.21
    & 0.39 & 0.26 \\\\end{array} \\right),} \\ \\ \\end{array}$$


    如上述矩阵列所示。为了生成我们的句子，我们可以选择使用这些概率运行模拟来选择词序列，或者根据这些概率选择最可能出现的句子：


