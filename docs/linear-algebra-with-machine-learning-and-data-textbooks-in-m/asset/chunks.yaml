  raw: "Both [Chapters 4](#chapter4.xhtml) and [5](#chapter5.xhtml) focus on predictive\
    \ models. Where [Chapter 4](#chapter4.xhtml) focuses more on traditional interpolation\
    \ techniques such as Chebyshev, Hermite, and Lagrange interpolation, [Chapter\
    \ 5](#chapter5.xhtml) steps back and takes a quick look at probability theory\
    \ and matrix calculus before connecting the material from [Chapter 4](#chapter4.xhtml)\
    \ to machine learning and neural network techniques. In these sections, some knowledge\
    \ of calculus is helpful, since there is a focus on optimizing cost functions.\
    \ Again, a good understanding of technology is important in [Chapter 5](#chapter5.xhtml),\
    \ as iterative methods become significantly important in neural network techniques.\n\
