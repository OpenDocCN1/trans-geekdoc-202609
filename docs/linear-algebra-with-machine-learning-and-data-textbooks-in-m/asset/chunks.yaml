    \ if\n\n$$\\\\begin{array}{r} {\\\\cup\\_{i = 1}^{n}X\\_{i} = S,} \\\\\\\\ \\\\\
    end{array}$$  \n\nwhere *S* is the set of all possible outcomes.\n\nLike we saw\
    \ in [Example 2.10](#chapter2.xhtml#exam2_10), finding the probability of an observation\
    \ sequence given a model is a type of likelihood problem. The **Forward/Backward\
    \ Algorithm** is an algorithm to solve this in general using hidden Markov models.\n\
    \nNow that we have used the Forward Algorithm to compute the probability of the\
    \ joint observed states, we can use the **Backward Algorithm** to determine marginal\
    \ probabilities *P*(*H*[*t*] = *k*|*O*).\n\n### 2.2.2 The Decoding Problem"
