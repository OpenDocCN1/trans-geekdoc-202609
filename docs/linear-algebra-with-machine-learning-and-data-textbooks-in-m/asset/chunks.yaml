    # 4 插值


    DOI: [10.1201/9781003025672-4](https://doi.org/10.1201/9781003025672-4)


    在第 3 章中，我们查看了一种回归方法，即使用线性判别分析。在第 4 章和第 5 章中，我们将重点关注创建优化给定代价函数的回归模型的数学学习技术。


    在本章中，我们假设存在一个未知函数 `f(x)`，并且你已经提供了该函数在 `n`  + 1 个不同点上的值。这些点 `x[0]` < `x[1]` < ⋯
    < `x[n]` 被**插值点**，它们可以是等距的，也可以不等距的。


    在整个章节中，我们将**插值因子**或**插值函数** `f̂(x)`称为用于对给定插值点建模的函数。


    关于什么是理想的插值函数有许多观点。理想情况下，给定一组较大的插值点，随机选择一些插值点作为用于开发模型的数据的**训练集**，而其余数据则用作**测试集**来测试模型的准确性。


    许多插值因子仅用于预测给定插值点处的值。这类插值问题的目标是找到一个函数 `f̂(x)`，使得：


    $$\begin{array}{r} {\hat{f}(x_{j}) = f(x_{j})\text{~for~all}~0 \leq j.}$$


    尽管模型在给定点处非常准确，但拉格朗插值函数和埃米插值函数在尝试外推或预测给定点附近时缺乏灵活性。


    为了更高的灵活性，学习系统整合了**正则化**，这是一种平滑数据的技术。第 5 章中介绍的神经网络方法包含了梯度下降优化技术。请记住，最佳模型并不是唯一的。在本章中，我们将讨论每个模型的优缺点。在语境中分析你的模型很重要。


    ## 4.1 拉格朗插值


    拉格朗插值因子 `P(x)` 是通过 `n`  + 1 个已知插值点 `(x[0], f(x[0]))`, `(x[1], f(x[1]))`, ⋯, `(x[n],
    f(x[n]))` 的 `n` 次多项式，并满足 `x[0]` < `x[1]` < ⋯ < `x[n]` 的约束：


    $$\begin{array}{r} {P(x) = \sum_{j = 0}^{n}P_{j}(x),}$$


    其中，


    $$\begin{array}{r} {P_{j}(x) = \prod_{k = 0,k \neq j}^{n}f(x_{j})\frac{x - x_{k}}{x_{j}
    - x_{k}}}$$


    也可以从范德蒙行列的角度考虑拉格朗插值。**范德蒙矩阵** `V` 是如下形式的方阵：


    $$\begin{array}{l} {V = \left( \begin{array}{l} 1 & x & x^{2} & \ldots & x^{n}
    \\ 1 & x_{0} & x_{0}^{2} & \ldots & x_{0}^{n} \\ 1 & x_{1} & x_{1}^{2} & \ldots
    & x_{1}^{n} \\ \vdots & \vdots & \vdots & \vdots \\ 1 & x_{n} & x_{n}^{2} & \ldots
    & x_{n}^{n} \end{array} \right)}$$


    注意在给定 `n`  + 1 个插值点 `x[0]`, `x[1]`, ⋯, `x[n]` 时创建一个 `n` 次拉格朗插值多项式时：


    $$\begin{array}{r} {P_{j}(x) = \sum_{j = 0}^{n}( - 1)^{j}}f(x_{j})\frac{|V_{j}|}{|V|}}$$


    其中


    $$\begin{array}{l} {V^* = \left( \begin{array}{l} 1 & x & x^{2} & \ldots & x^{n}
    \\ 1 & x_{0} & x_{0}^{2} & \ldots & x_{0}^{n} \\ 1 & x_{1} & x_{1}^{2} & \ldots
    & x_{1}^{n} \\ \vdots & \ddots & \ddots & \vdots \\ 1 & x_{n} & x_{n}^{2} & \ldots
    & x_{n}^{n} \end{array} \right),}$$


    $$\begin{array}{l} {V_{0} = \left( \begin{array}{l} 1 & x & x^{2} & \ldots & x^{n}
    \\ 1 & x_{1} & x_{1}^{2} & \ldots & x_{1}^{n} \\ 1 & x_{2} & x_{2}^{2} & \ldots
    & x_{2}^{n} \\ \vdots & \ddots & \ddots & \vdots \\ 1 & x_{n} & x_{n}^{2} & \ldots
    & x_{n}^{n} \end{array} \right),}$$


    $$\begin{array}{l} {V_{1} = \left( \begin{array}{l} 1 & x & x^{2} & \ldots & x^{n}
    \\ 1 & x_{0} & x_{0}^{2} & \ldots & x_{0}^{n} \\ 1 & x_{2} & x_{2}^{2} & \ldots
    & x_{2}^{n} \\ \vdots & \ddots & \ddots & \vdots \\ 1 & x_{n} & x_{n}^{2} & \ldots
    & x_{n}^{n} \end{array} \right),}$$


    通常情况下


    $$\begin{array}{l} {V_{k} = \left( \begin{array}{l} 1 & x & x^{2} & \ldots & x^{n}
    \\ 1 & x_{0} & x_{0}^{2} & \ldots & x_{0}^{n} \\ \vdots & \ddots & \ddots & \vdots
    \\ 1 & x_{k - 1} & x_{k - 1}^{2} & \ldots & x_{k - 1}^{n} \\ 1 & x_{k + 1} & x_{k
    + 1}^{2} & \ldots & x_{k + 1}^{n} \\ \vdots & \ddots & \ddots & \vdots \\ 1 &
    x_{n} & x_{n}^{2} & \ldots & x_{n}^{n} \end{array} \right).} \\end{array}$$


    注意在 `V[k]` 中 `x` 未包含在矩阵内。


    ## 4.2 正交多项式


    本章介绍的若干插值技术依赖于特殊的函数族。本节重点关注这些特殊族与线性代数概念之间的联系。


    在 3.1 节中，我们回顾了内积的概念。我们在这里看到这些概念应用于函数族。


    有很多由特殊形式矩阵生成的正交函数族。


    如下形式的方阵：


    $$\begin{array}{l} \left( \begin{array}{lllllll} x & 1 & 0 & \ldots & 0 & 0 \\
    1 & {2x} & 1 & \ldots & 0 & 0 \\ 0 & 1 & {2x} & 1 & \ldots & 0 \\ \vdots & \ddots
    & \ddots & \ddots & \vdots & \vdots \\ 0 & \ldots & 0 & 0 & 1 & {2x} \end{array}
    \right) \\end{array}$$


    是一种特殊的**三对角矩阵**，其行列式可以递归地视为：


    $$\begin{array}{r} {T_{n + 1}(x) = 2xT_{n} - T_{n - 1},} \\ \end{array}$$


    `T0` = 1，`T1` = `x`，且 `T2` = 2*x*² − 1。这类多项式被称为第一类切比夫多项式，当我们将域限制在[ − 1, 1]并使用定义的内积时，它是正交的：


    $$\begin{array}{r} {< f(x),\\, g(x) > = {\int\_{- 1}^{1}(1 - x^{2})}^{- 1/2}}f(x)g(x)dx.}
    \\ \end{array}$$


    第一类切比夫多项式也可以定义为：


    $$T_{n}(x) = {\sum_{m = 0}^{\lfloor{n/2}\rfloor}\begin{pmatrix} n \\ {2m} \\ \end{pmatrix}}x^{n
    - 2m}(x^{2} - 1)^{m}.$$


