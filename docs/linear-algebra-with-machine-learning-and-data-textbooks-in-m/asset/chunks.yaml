    y}{\partial x\_{ij}},} \\ \\\\end{array}$$


    where `E[`i*`, *j*]` = 1 and all other entries are zero and `∇y` is called the
    `gradient matrix`.


    The `Hessian matrix`, `H[y]`, is a square matrix of second order partial derivatives.


    $$\begin{array}{l} {H\_{y} = \\left( \\begin{array}{llll} \\frac{\partial^{2}y}{\partial
    x\_{11}^{2}} & \\frac{\partial^{2}y}{\partial x\_{11}\\partial x\_{12}} & \\cdots
