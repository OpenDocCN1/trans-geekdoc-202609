    注意图 3.1，在变换 `T``A` 下的网格线不再正交。如果变换后的网格线保持正交，我们称这种变换后的网格为**正交网**。


    ## 3.3 奇异值分解


    奇异值一词与给定矩阵到奇异矩阵的距离有关。我们将在矩阵的**奇异值分解 (SVD)** 背景下探索奇异值的概念。


    `n−` 向量空间 `W` 中向量 `v` 的**正交分量**为 `v[w]` 和 `v[w^⊥]`，其中 `v[w]` ∈ `W` 且 `v[w^⊥]`
    ∈ `W^⊥`，并且 `v` = `v[w]` + `v[w^⊥]`。


    给定 `W` 的正交基 `{v[1]`, `v[2]`,⋯, `v[n]}`，


    $$\begin{array}{r} {v_{w} = Proj_{W}(v) = < v_{1},v > v_{1} + < v_{2},v > v_{2}
    + \cdots + < v_{n},v > v_{n}.} \\\\ \end{array}$$


    利用上述理论并结合示例 3.2 中的可视化，对于 ℝ² 中的任何向量 `x`，`x` = (`v[1]` ⋅ `x`)`v[1]` + (`v[2]` ⋅
    `x`)`v[2]`，其中 `v[1]` 和 `v[2]` 是 ℝ² 的标准基向量。因此，


    $$\begin{array}{r} {Ax = A(v_{1} \cdot x)v_{1} + A(v_{2} \cdot x)v_{2} = u_{1}\sigma_{1}(v_{1}
    \cdot x) + u_{2}\sigma_{2}(v_{2} \cdot x),} \\\\ \end{array}$$


    其中 `σ[i]`，1 ≤ `i` ≤ `n` 是 `A` 的奇异值。


    注意到对于 ℝ² 中的任意两个向量 `u` 和 `w`，`u` ⋅ `w` = `u^(T)`w，我们可以说：


    $$\begin{array}{r} {Ax = u_{1}\sigma_{1}(v_{1}^{T}x) + u_{2}\sigma_{2}(v_{2}^{T}x).}
    \\\\ \end{array}$$


    更一般的，一个 `m × n` 矩阵 `A` 可以分解为乘积：


    $$\begin{array}{r} {A = U\Sigma V^{T}} \\\\ \end{array}$$


    其中 `U` 是一个 `m × m` 正交矩阵，其列构成了 ℝ(`m*`) 的正交基；`V` 是一个 `n × n` 正交矩阵，其列构成了 ℝ(`n*`)
    的正交基；且 `Σ[i**i]` = `σ[i]`，其他情况下 `σ[i**j]` = 0。


    由于矩阵 `A` 的奇异值与对称矩阵 `A^(T)*A`（格拉姆矩阵）的特征值相关，注意以下性质非常重要。


    回顾第 2 章，所有对称矩阵都是正交对角化的。因此，对于任何 `m × n` 矩阵 `A`，`S = A^(T)*A` 是一个 `n × n` 对称矩阵，我们可以找到一个正交矩阵
    `P` 使得


    $$\begin{array}{r} {S = PDP^{T}.} \\\\ \end{array}$$


    这显示了 `S` 的特征值与 `A` 的奇异值之间有趣的对齐关系。假设 `S` 的特征值为 `λ[1]` ≥ `λ[2]` ≥ …… ≥ `λ[n]`，且
    `A` 对应的奇异值为 `σ[1]` ≥ `σ[2]` ≥ …… ≥ `σ[n]`。那么：


    $$\begin{aligned} S & {= PDP^{T} = {\sum\limits_{i = 1}^{n}\lambda_{i}}v_{i}v_{i}^{T}}
    \\\\ A & {= U\Sigma V^{T} = {\sum\limits_{i = 1}^{n}\sigma_{i}}u_{i}v_{i}^{T}.}
    \\\\ \end{aligned}$$


    ## 3.4 使用主成分分析 (PCA) 进行数据压缩


    在数据科学中，你可能希望以各种方式对 `m` 条记录的 `n` 个属性进行比较。有很多聚类技术，但在所有这些技术中，数据科学家可能对数据可视化感兴趣。为了实现这一点，应该考虑如何将数据从
    ℝ(`n*`) 转换到 ② 或³。


    思考这个问题的一种是，你正在将数据从 ℝ(`n*`) 投影到另一个空间，例如 ② 或³。


    ![图 3.4 从 \mathbb{R}^{3} 投影到 \mathbb{R}^{2} 的示例](img/fig3_4)


    图 3.4 投影到 ℝ² 的示例。


    我们可以通过限制重构原始矩阵的奇异值数量来使用 SVD。记得，如果 `A` 是一个 `m × n` 矩阵，那么 `A` 的奇异值分解 `A=UΣV^(T)`
    中的奇异值为 `σ[1]`、`σ[2]`、`σ[n]`，`Σ` 是一个 `m × n` 矩阵，使得 `Σ[ii]` = `σ[i]`。


    如果数据科学家希望将数据从 ℝ(`n*`) 转换到 ℝ(`q*`)，他们可以确定 `q` 个主特征值并定义一个 `q × n` 矩阵 `Σ`，使得 ${\widetilde{\sum}_{ii}}
    = \sigma_{i}$。


    反之，矩阵 `U` 将变为一个 `m × q` 矩阵，其中对于 1 ≤ `i` ≤ `m` 和 1 ≤ `j` ≤ `q`，`U[i, j]` = `U[i,
    j]`。`U` 的行是 ℝ(`q*`) 中的向量，是主成分分析 (PCA) 的关注重点。数据科学家应用 PCA 的原因有很多。示例 3.8 展示了 PCA
    如何应用于数字人文，特别是与文学相关的领域。


    ## 3.5 PCA、协方差和相关性


    在研究具有许多变量的大数据集时，我们可能希望确定数据中的模式，以及是否存在与其他变量有强相关性的变量。在本节中，我们将研究如何使用 PCA 来创建**协方差矩阵**和**相关系数矩阵**。


    数据集 `A` 的协方差矩阵捕捉了多变量数据中的方差和线性相关。协方差是衡量 `m` 条记录的 `n` 个属性共同变化程度的指标。注意 `Cov(A)[i,
    i]` 表示方差 `σ[i]`²。


    $$\begin{array}{r} {Cov(A) = \left( \begin{array}{lllll} {\sum\frac{x_{1}^{2}}}
    & {\sum\frac{x_{1}x_{2}}} & {\sum\frac{x_{1}x_{3}}} & \cdots & {\sum\frac{x_{1}x_{m}}}
    \\ {\sum\frac{x_{2}x_{1}}} & {\sum\frac{x_{2}^{2}}} & {\sum\frac{x_{2}x_{3}}}
    & \cdots & {\sum\frac{x_{2}x_{m}}} \\ {\sum\frac{x_{3}x_{1}}} & {\sum\frac{x_{3}x_{2}}}
    & {\sum\frac{x_{3}^{2}}} & \cdots & {\sum\frac{x_{3}x_{m}}} \\ \vdots & \vdots
    & \vdots & \ddots & \vdots \\ {\sum\frac{x_{m}x_{1}}} & {\sum\frac{x_{m}x_{2}}}
    & {\sum\frac{x_{m}x_{3}}} & \cdots & {\sum\frac{x_{m}^{2}}} \end{array} \right).}
    \\\\ \end{array}$$


    我们从仅两个变量的示例开始，以直理解如何使用矩阵建模方差。PCA 可用于分解协方差矩阵，并保留最重要的奇异值。


    与数据集 `A` 相关的**相关系数矩阵** `Cor(A)` 只是协方差矩阵的缩放：


    $$\begin{array}{r} {Cor(A)_{i,j} = \frac{Cov(A)_{i,j}}{\sqrt{Cov(A)_{i,i}Cov(A)_{j,j}}}}
    \\\\ \end{array}$$


    对于 `i` ≠ `j`，当 `i` = `j` 时 `Cor(A)[i, j]` = 1。如果变量量级不同，考虑使用相关矩阵而非协方差矩阵来研究数据是一个很好的主意。这些思想可以通过主成分分析扩展到多元回归技术，通常被称为**主成分回归**。与示例
    3.9 不同（该示例中只有一个因变量 `x` 和一个自变量 `y`，且 `y = ax + b + e`，其中 `e` 表示残差误差），可以在具有 `k`
    个自变量的复杂模型中使用主成分回归。在这种情况下，模型变为：


    $$\begin{array}{r} {y = Xb} \\\\ \end{array}$$


    其中 `y` 是一个 `n × 1` 向量，`X` 是一个 `n × k` 矩阵。在寻找协方差和相关矩阵之前，应该考虑对数据进行零中心化或标准化。


