    & \\ddots & \\vdots \\ \\frac{\partial^{2}y}{\partial x\_{nn}\\partial x\_{n1}}
    & \\frac{\partial^{2}y}{\partial x\_{nn}\\partial x\_{n2}} & \\cdots & \\frac{\partial^{2}y}{\partial
    x\_{nn}^{2}} \\ \\end{array} \\right).} \\ \\end{array}$$


    如果 `y` = `f(X)` 是一个标量函数，其中 `X` = (`x[1]`, …, `x[n]`)，我们定义 `全微分`（ordinary differential）为


    $$\begin{array}{r} {df = {\\sum\\limits\_{i = 1}^{n}\\frac{\partial f}{\partial
    x\_{i}}}dx\_{i}.} \\ \\end{array}$$


    然而，如果 `X` = [`x[i*`, *j*]` 是一个 `m` × `n` 矩阵，则我们定义 `矩阵微分`（matrix differential）为


    $$\begin{array}{l} {dX = \\left( \\begin{array}{llll} {dx\_{11}} & {dx\_{12}}
    & \\cdots & {dx\_{1n}} \\ {dx\_{21}} & {dx\_{22}} & \\cdots & {dx\_{2n}} \\ \\vdots
    & \\ddots & \\ddots & \\vdots \\ {dx\_{m1}} & {dx\_{m2}} & \\cdots & {dx\_{mn}}
    \\ \\end{array} \\right).}


    矩阵微分满足线性算符的性质，


    `d(kX) = kdX,` 且 `d(X + Y) = dX + dY,`

    其中 `k` 是标量。


    ### 5.2 矩阵积分


    如果 `A` 是一个矩阵，且对于标量变量 `x` 进行积分：


    $$\begin{array}{r} {\\int A\, dx} \\ \\end{array}$$


    然而，如果 `f(x)` 是一个函数，且想要通过变换 `y=g(x)` 进行积分，则根据雅可比行列的绝对值进行变量替换：


    $$\begin{array}{r} {\\int f(x)dx = {\\int f(g^{-1}(y))|J|}dy}} \\ \\end{array}$$


    其中雅可比矩阵 $|det(J)| = \left| \det \left( \frac{\partial y_i}{\partial x_j} \right)
    \right|$。如果 `f(X)` 是一个函数，且想要通过变换 `Y=g(X)` 进行积分，根据雅可比行列的绝对值 $|det(J)|$：


    $$\begin{array}{r} {\\int f(X)dX = {\\int f(g^{-1}(Y))|det(J)|}dY}} \\ \\end{array}$$


    雅可比矩阵 $|det(J)|$ 在概率分布中非常重要。在本章中，当我们希望对矩阵进行积分时，例如，我们可能想要确定均值为 `μ`，方差为 `σ²` 的联合分布，`X[i]` ∼ `N(μ,
    σ²)`：


    $$\begin{array}{r} {\\int\_{-infty}^{\infty}\ldots{\\int_{-\infty}^{\infty}{\\int_{-\infty}^{\infty}e^{-
    {(X - \\mu)}^{T}\\Sigma^{- 1}(X - \\mu)/2}}}dX\_{1}dX\_{2}\ldots dX_{n},}} \\
    \\end{array}$$


    使用相同的变换，


    $$\begin{array}{r} {{(2\\pi)}^{- mn/2}|\\Sigma^{- 1/2}{\\int\_{\mathbf{R}^{\mathbf{mn}}}X}e^{-
    {(X - \\mu)}^{T}\\Sigma^{- 1}(X - \\mu)/2dX = \\mu.} \\ \\end{array}$$




