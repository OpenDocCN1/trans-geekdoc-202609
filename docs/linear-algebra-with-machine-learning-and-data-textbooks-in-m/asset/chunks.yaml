    # 4 Interpolation


    DOI: [10.1201/9781003025672-4](https://doi.org/10.1201/9781003025672-4)


    In [Chapter 3](#chapter3.xhtml), we took a look at one type of regression, using
    Linear Discriminant Analysis. In [Chapters 4](#chapter4.xhtml) and [5](#chapter5.xhtml),
    we will focus on mathematical learning techniques for creating regression models
    that optimize a given cost function.


    In this chapter, we will assume that there is an unknown function, `f(x)`, and
    that you have been provided the values of this function at `n`  + 1 distinct points.
    These points, `x[0]` < `x[1]` < ⋯ < `x[n]`, called the **interpolation points**
    can be equidistant or not.


    Throughout the chapter, we will refer to the **interpolant** or the **interpolating
    function**, `f̂(x)`, as the function chosen to model the given interpolation points.


    There are several thoughts around what makes an ideal interpolating function.
    Ideally, given a large set of interpolation points, some of the interpolation
    points are chosen at random to serve as the **training set** of data used to develop
    the model, while the rest of the data is used as a **testing set** to test the
    accuracy of the model.


    Many interpolants serve only to predict the value at the given interpolation points.
    The goal of this type of interpolation problem is to find a function, `f̂(x)`,
    such that


    $$\begin{array}{r} {\hat{f}(x_{j}) = f(x_{j})\text{~for~all~}0 \leq j \leq n.}
    \\ \end{array}$$


    Although very accurate at the given points, these models, such as the Lagrange
    interpolation functions, and the Hermitian interpolation functions lack flexibility
    when attempting to extrapolate or predict near the given points but not within
    the given set.


    For more flexibility, learning systems integrate **regularization**, a technique
    for smoothing across the data. The neural network methods presented in [Chapter
    5](#chapter5.xhtml) incorporate optimization techniques called gradient descent.


    Keep in mind that there is not one solution for best model. Throughout this chapter,
    we will be discussing advantages and disadvantages of each model. It is important
    that you analyze your model in context.


    ## 4.1 Lagrange Interpolation


    A Lagrange interpolant, `P(x)`, is an `n`th degree polynomial passing through
    `n`  + 1 known interpolation points, (`x[0], f(x[0])`, (`x[1], f(x[1])`, ⋯, (`x[n],
    f(x[n])`) where `x[0]` < `x[1]` < ⋯ < `x[n]`, with the additional constraint that


    $$\begin{array}{r} {P(x) = \sum_{j = 0}^{n}P_{j}(x),} \\ \end{array}$$


    where,


    $$\begin{array}{r} {P_{j}(x) = \prod_{k = 0,k \neq j}^{n}f(x_{j})\frac{x - x_{k}}{x_{j}
    - x_{k}}.} \\end{array}$$


    One can also think of Lagrange interpolant in terms of Vandermonde determinants.
    The **Vandermonde matrix**, `V`, is a square matrix of form


    $$\begin{array}{l} {V = \left( \begin{array}{l} 1 & x_{0} & x_{0}^{2} & \ldots
    & x_{0}^{n} \\ 1 & x_{1} & x_{1}^{2} & \ldots & x_{1}^{n} \\ 1 & x_{2} & x_{2}^{2}
    & \ldots & x_{2}^{n} \\ \vdots & \vdots & \vdots & \vdots \\ 1 & x_{n} & x_{n}^{2}
    & \ldots & x_{n}^{n}. \end{array} \right)} \\end{array}$$


    Notice that given `n`  + 1 interpolation points, `x[0]`, `x[1]`, ⋯, `x[n]`, when
    creating a `n`th Lagrange interpolating polynomial,


    $$\begin{array}{r} {P_{j}(x) = \sum_{j = 0}^{n}( - 1)^{j}}f(x_{j})\frac{|V_{j}|}{|V^*|},}
    \\end{array}$$


    where


    $$\begin{array}{l} {V^* = \left( \begin{array}{l} 1 & x_{0} & x_{0}^{2} & \ldots
    & x_{0}^{n} \\ 1 & x_{1} & x_{1}^{2} & \ldots & x_{1}^{n} \\ 1 & x_{2} & x_{2}^{2}
    & \ldots & x_{2}^{n} \\ \vdots & \ddots & \ddots & \vdots \\ 1 & x_{n} & x_{n}^{2}
    & \ldots & x_{n}^{n}. \end{array} \right),} \\end{array}$$


    $$\begin{array}{l} {V_{0} = \left( \begin{array}{l} 1 & x & x^{2} & \ldots & x^{n}
    \\ 1 & x_{1} & x_{1}^{2} & \ldots & x_{1}^{n} \\ 1 & x_{2} & x_{2}^{2} & \ldots
    & x^{n} \\ \vdots & \ddots & \ddots & \vdots \\ 1 & x_{n} & x_{n}^{2} & \ldots
    & x_{n}^{n}. \end{array} \right),} \\end{array}$$


    $$\begin{array}{l} {V_{1} = \left( \begin{array}{l} 1 & x & x^{2} & \ldots & x^{n}
    \\ 1 & x_{0} & x_{0}^{2} & \ldots & x_{0}^{n} \\ 1 & x_{2} & x_{2}^{2} & \ldots
    & x_{2}^{n} \\ \vdots & \ddots & \ddots & \vdots \\ 1 & x_{n} & x_{n}^{2} & \ldots
    & x_{n}^{n}. \end{array} \right),} \\end{array}$$


    and in general


    $$\begin{array}{l} {V_{k} = \left( \begin{array}{l} 1 & x & x^{2} & \ldots & x^{n}
    \\ 1 & x_{0} & x_{0}^{2} & \ldots & x_{0}^{n} \\ \vdots & \ddots & \ddots & \vdots
    \\ 1 & x_{k - 1} & x_{k - 1}^{2} & \ldots & x_{k - 1}^{n} \\ 1 & x_{k + 1} & x_{k
    + 1}^{2} & \ldots & x_{k + 1}^{n} \\ \vdots & \ddots & \ddots & \vdots \\ 1 &
    x_{n} & x_{n}^{2} & \ldots & x_{n}^{n}. \end{array} \right).} \\end{array}$$


    Notice that in `V[k]` the `x[k]` is not included in the matrix.


    ## 4.2 Orthogonal Families of Polynomials


    Several of the interpolation techniques presented in this chapter depend on special
    families of functions. This section focuses on the connection between these special
    families and linear algebra concepts.


    In [Section 3.1](#chapter3.xhtml#sec3_1), we reviewed the concept of an inner
    product. We see those concepts applied here to families of functions.


    There are a variety of families of orthogonal functions that are generated from
    matrices of special forms.


    Square matrices of the form


    $$\begin{array}{l} \left( \begin{array}{lllllll} x & 1 & 0 & \ldots & 0 & 0 \\
    1 & {2x} & 1 & \ldots & 0 & 0 \\ 0 & 1 & {2x} & 1 & \ldots & 0 \\ \vdots & \ddots
    & \ddots & \ddots & \vdots & \vdots \\ 0 & \ldots & 0 & 0 & 1 & {2x} \\ \end{array}
    \right) \\end{array}$$


    are a special type of **tridiagonal matrix**, whose determinants can be viewed
    recursively as


    $$\begin{array}{r} {T_{n + 1}(x) = 2xT_{n} - T_{n - 1},} \\ \end{array}$$


    `T[0](x)` = 1, `T[1](x)` = `x`, and `T[2](x)` = 2*x*² − 1.


    This family of polynomials is called the **Chebyshev polynomials** of the first
    kind and is orthogonal when we restrict to the domain to [ − 1, 1] with the defined
    inner product


    $$\begin{array}{r} {< f(x),\\, g(x) > = {\int\_{- 1}^{1}(1 - x^{2})}^{- 1/2}}f(x)g(x)dx.}
    \\ \end{array}$$


    The Chebyshev polynomials of the first kind can also be defined by


    $$T_{n}(x) = {\sum_{m = 0}^{\lfloor{n/2}\rfloor}\begin{pmatrix} n \\ {2m} \\ \end{pmatrix}}x^{n
    - 2m}(x^{2} - 1)^{m}.$$

