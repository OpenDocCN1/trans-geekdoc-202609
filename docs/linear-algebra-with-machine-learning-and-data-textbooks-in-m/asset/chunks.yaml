    # Equity Principles


    Equity is the principle that all districts have an equivalent number of voters.
    In an ideal situation, districts are compact if given any two points in the district
    the line segment between these points remains completely in the district. Keep
    in mind that census blocks, groups, and tracts are typically not compact and thus
    the inclusion of these objects, in total, may cause a district to fail this property.
    Failure to meet the property of compactness can become more of an issue when it
    occurs in an unnatural manner. Failure to meet compactness in the 2011 North Carolina
    Congressional redistricting map was voted unconstitutional, particularly around
    `District 12`, which can be seen in [Figure 1.19](#chapter1.xhtml#fig1_19).


    ![Figure 1.19 2011 North Carolina Congressional Redistricting Map [26].](images/fig1_19.jpg)


    [Figure 1.19](#chapter1.xhtml#b1fig1_19) 2011 North Carolina Congressional Redistricting
    Map [[26](#refbib.xhtml#refbib26)].


    ## Determining Adjacency of Census Blocks


    Some of the issues with districting come down to determining adjacent census blocks.
    As you can see in [Figure 1.20](#chapter1.xhtml#fig1_20), adjacent census blocks
    may not have consecutive numbers. For example, census blocks 2003 and 2009 are
    adjacent.


    ![Figure 1.20 Sample of census blocks and block number in Charlotte, NC.](images/fig1_20.jpg)


    [Figure 1.20](#chapter1.xhtml#b1fig1_20) Sample of census blocks and block number
    in Charlotte, NC.


    Blocks are also clearly not adjacent by an entire edge or may be adjacent along
    multiple edges. The question then becomes, given that there are thousands of census
    blocks in a state, how do we determine if census blocks are adjacent, and how
    do we prioritize adjacencies that may be more important than others.


    ## Case Study: Graph Representation


    In this case study, we will focus on a very small section of [Figure 1.20](#chapter1.xhtml#fig1_20),
    census blocks 2000 through 2015. One way to think about this problem is to create
    a graph, and corresponding adjacency matrix, based on perimeter shared.


    The edges in [Figure 1.21](#chapter1.xhtml#fig1_21) represent a shared edge between
    census blocks in [Figure 1.20](#chapter1.xhtml#fig1_20). The weight from vertex
    `i` to vertex `j`, representing the fraction of the boundary of census block `i`
    shared with census block `j`, is the `(i, j)`^(th) entry of adjacency matrix,
    `A[E]`.


    ![Figure 1.21 Unweighted graph representation of sample census blocks.](images/fig1_21.jpg)


    [Figure 1.21](#chapter1.xhtml#b1fig1_21) Unweighted graph representation of sample
    census blocks.


