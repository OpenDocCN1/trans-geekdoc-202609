    Notice in [Figure 3.1](#chapter3.xhtml#fig3_1) that the grid lines under transformation
    `T`[`A`](`x`) are no longer orthogonal. If the transformed grid lines remain orthogonal
    then we call this transformed grid an **orthogonal grid**.


    ## 3.3 Singular Value Decomposition


    The term singular value relates to the distance of the given matrix to a singular
    matrix. We will explore the concept of singular values in the context of the **Singular
    Value Decomposition (SVD)** of a matrix.


    The **orthogonal components** of a vector `v` in a `n−` dimensional vector space
    `W` are `v[w]` and `v[w^⊥]` where `v[w]` ∈ `W` and `v[w^⊥]` ∈ `W^⊥` and `v` =
    `v[w]` + `v[w^⊥]`.


    Given an orthonormal basis `{v[1]`, `v[2]`,⋯, `v[n]}` for `W`,


    $$\beginbegin{array}{r} {v_{w} = Proj_{W}(v) = < v_{1},v > v_{1} + < v_{2},v >
    v_{2} + \cdots + < v_{n},v > v_{n}.} \\\\ \end{array}$$


    Using the theory above, and the visualization from [Example 3.2](#chapter3.xhtml#exam3_2),
    for any vector `x` in ℝ², `x` = (`v[1]` ⋅ `x`)`v[1]` + (`v[2]` ⋅ `x`)`v[2]`, where
    `v[1]` and `v[2]` are the standard basis vectors for ℝ². Thus,


    $$\begin{array}{r} {Ax = A(v_{1} \cdot x)v_{1} + A(v_{2} \cdot x)v_{2} = u_{1}\sigma_{1}(v_{1}
    \cdot x) + u_{2}\sigma_{2}(v_{2} \cdot x),} \\\\ \end{array}$$


    where `σ[i]`, 1 ≤ `i` ≤ `n` are the singular values of `A`.


    Noting that for any two vectors `u` and `w` in ℝ², `u` ⋅ `w` = `u^(T)`w, we can
    say that


    $$\begin{array}{r} {Ax = u_{1}\sigma_{1}(v_{1}^{T}x) + u_{2}\sigma_{2}(v_{2}^{T}x).}
    \\\\ \end{array}$$


    More generally, a `m × n` matrix `A`, can be decomposed into the product


    $$\begin{array}{r} {A = U\Sigma V^{T}} \\\\ \end{array}$$


    where `U` is a `m × m` orthogonal matrix whose columns form an orthonormal basis
    for ℝ(`m*`) and `V` is a `n × n` orthogonal matrix whose columns form an orthonormal
    basis for ℝ(`n*`) and `Σ[i**i]` = `σ[i]` and `σ[i**j]` = 0 otherwise.


    Since the singular values of a matrix, `A`, are related to the eigenvalues of
    the symmetric matrix `A^(T)*A`, the Gramian matrix, it is important to note the
    following property.


    Recall from [Chapter 2](#chapter2.xhtml) that all symmetric matrices are orthogonally
    diagonalizable. Thus for any `m × n` matrices `A`, `S = A^(T)*A` is a `n × n`
    symmetric matrix and we can find an orthogonal matrix `P` such that


    $$\begin{array}{r} {S = PDP^{T}.} \\\\ \end{array}$$


    This shows an interesting alignment between eigenvalues of `S` and singular values
    of `A`. Assume that the eigenvalues of `S` are `λ[1]` ≥ `λ[2]` ≥ …… ≥ `λ[n]` and
    the corresponding singular values of `A` are `σ[1]` ≥ `σ[2]` ≥ …… ≥ `σ[n]`. Then,


    $$\begin{aligned} S & {= PDP^{T} = {\sum\limits_{i = 1}^{n}\lambda_{i}}v_{i}v_{i}^{T}}
    \\\\ A & {= U\Sigma V^{T} = {\sum\limits_{i = 1}^{n}\sigma_{i}}u_{i}v_{i}^{T}.}
    \\\\ \end{aligned}$$


    ## 3.4 Compression of Data Using Principal Component Analysis (PCA)


    In data science, you may wish to compare `m` records with `n` attributes in a
    variety of ways. There are many clustering techniques, but in all of these techniques
    the data scientist might be interested in visualizing the data. In order to do
    this, one should consider how to transform their data from ℝ(`n*`) to ② or³.


    One way to think about this is that you are projecting your data from ℝ(`n*`)
    into another space, such as ② or³.


    ![Figure 3.4 Example of a projection from \mathbb{R}^{3} into \mathbb{R}^{2}.](images/fig3_4)


    Figure 3.4 Example of a projection into ℝ².


    We can do this using SVD by limiting the number of singular values to reconstruct
    the original matrix. Recall that if `A` is a `m × n` matrix then the singular
    value decomposition of `A=UΣV^(T)` with singular values `σ[1]`, `σ[2]`, `σ[n]`,
    `Σ` is a `m × n` matrix such that `Σ[ii]` = `σ[i]`.


    If a data scientist wishes to transform the data from ℝ(`n*`) to ℝ(`q*`), then
    they could determine the `q` dominant eigenvalues and define a `q × n` matrix
    `Σ` such that ${\widetilde{\sum}_{ii}} = \sigma_{i}$.


    In turn, matrix `U` would then become a `m × q` matrix, where `U[i, j]` = `U[i,
    j]` for 1 ≤ `i` ≤ `m`, 1 ≤ `j` ≤ `q`. The rows of `U` are vectors in ℝ(`q*`) and
    are the focus of Principal Component Analysis (PCA). There are many reasons why
    a data scientist may apply PCA. [Example 3.8](#chapter3.xhtml#exam3_8) shows how
    PCA can be applied to the digital humanities, particularly related to literature.


    ## 3.5 PCA, Covariance, and Correlation


    When studying large data sets with many variables, we may wish to determine patterns
    in the data and if there are variables that have a strong correlation with another.
    In this section, we will look at how PCA can be used to create a **covariance
    matrix** and **correlation matrix**.


    The covariance matrix of a data set `A`, `Cov(A)`, captures the variance and linear
    correlation in multivariate data. Covariance is a measure of how much `m` records
    of data, each with `n` attributes or pieces of information, change together.


    Note that `Cov(A)[i, i]` represents the variance, `σ[i]²`, in the `ith` data record.


    $$\begin{array}{l} {Cov(A) = \left( \begin{array}{lllll} {\sum\frac{x_{1}^{2}}{N}}
    & {\sum\frac{x_{1}x_{2}}{N}} & {\sum\frac{x_{1}x_{3}}{N}} & \ldots & {\sum\frac{x_{1}x_{m}}{N}}
    \\ {\sum\frac{x_{2}x_{1}}{N}} & {\sum\frac{x_{2}^{2}}{N}} & {\sum\frac{x_{2}x_{3}}{N}}
    & \ldots & {\sum\frac{x_{2}x_{m}}{N}} \\ {\sum\frac{x_{3}x_{1}}{N}} & {\sum\frac{x_{3}x_{2}}{N}}
    & {\sum\frac{x_{3}^{2}}{N}} & \ldots & {\sum\frac{x_{3}x_{m}}{N}} \\ \vdots &
    \vdots & \vdots & \ddots & \vdots \\ {\sum\frac{x_{m}x_{1}}{N}} & {\sum\frac{x_{m}x_{2}}{N}}
    & {\sum\frac{x_{m}x_{3}}{N}} & \ldots & {\sum\frac{x_{m}^{2}}{N}} \\ \end{array}
    \right).} \\\\ \end{array}$$


    We begin with an example in just two variables to get a sense of how variance
    can be modeled using matrices. Principal Component Analysis can be used to decompose
    the covariance matrix, limiting the singular values to the ones that are most
    significant.


    The **correlation matrix** associated with a data set, `A`, `Cor(A)`, is just
    a scaling of the covariance matrix,


    $$\begin{array}{r} {Cor(A)_{i,j} = \frac{Cov(A)_{i,j}}{Cov(A)_{i,i}Cov(A)_{j,j}}}
    \\\\ \end{array}$$


    for `i` ≠ `j` and `Cor(A)[i, j]` = 1 if `i` = `j`.


    It is a good idea to consider using the correlation matrix to study your data,
    rather than the covariance matrix, if your variables are in scales of different
    magnitudes. These ideas can be expanded to multiple regression techniques using
    Principal Component Analysis, more commonly called **Principal Component Regression**.
    Unlike [Example 3.9](#chapter3.xhtml#exam3_9), where there was only one dependent
    variable, `x`, and one independent variable, `y`, and `y = ax + b + e`, with `e`
    representing the errors in the residuals, it is possible to use principal component
    regression in a more complex model with `k` independent variables. In this case,
    the model becomes


    $$\begin{array}{r} {y = Xb} \\\\ \end{array}$$


    where `y` is an `n × 1` vector, `X` is an `n × k` matrix. Like [Example 3.9](#chapter3.xhtml#exam3_9),
    one should consider zero-centering or standardizing the data before finding the
    covariance and correlation matrices.

