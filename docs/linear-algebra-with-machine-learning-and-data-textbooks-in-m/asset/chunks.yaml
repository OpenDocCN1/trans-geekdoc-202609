    ## 7.4 Gaussian Unitary Ensemble


    In this section, we consider random matrices with complex entries. Recall that
    if `z` = `a` + `ib` then $\overline{z} = a - ib$ is the **complex conjugate**
    of `z`. If `A` is a square matrix, then the entries of `\overline{A}` are the
    complex conjugate of each corresponding entry in `A`.


    A square matrix, `A`, is called **Hermitian** if


    $$\beginbegin{array}{r} {{\\overline{A}}^{T} = A.} \\\\ \\end{array}}$$


    `\overline{A}}^{T}` is called the **conjugate transpose** of `A`.


    An invertible square matrix, `A`, is **unitary** if


    $$\\begin{array}{r} {{\\overline{A}}^{T} = A^{- 1}.} \\\\ \\end{array}}$$


    Every Hermitian matrix, `H`, is diagonalizable with a unitary matrix, `U`, and
    the resulting diagonal matrix, `D`, will have real entries. That is if `H` is
    a Hermitian matrix then there exists a unitary matrix `U` such that


    $$\beginbegin{array}{r} {D = U^{- 1}HU,} \\\\ \\end{array}}$$


    where `D[i, i]` ∈ $\mathbb{R}$.


    $$\\begin{array}{l} {H = \\left( \\begin{array}{ll} 1 & {2 + 3I} \\\\ {2 - 3I}
    & 4 \\\\ \\end{array} \\right)\\{~{~~}U = \\left( \\begin{array}{ll} {(2 - 3i)\\sqrt{\\frac{1}{26}
    - \\frac{3}{26\\sqrt{61}}}} & \\frac{\\sqrt{61} + 3}{\\sqrt{6\\sqrt{61} + 122}}
    \\\\ {( - 2 + 3i)\\sqrt{\\frac{1}{26} + \\frac{3}{26\\sqrt{61}}}} & \\frac{\\sqrt{61}
    - 3}{\\sqrt{122 - 6\\sqrt{61}}} \\\\ \\end{array} \\right)} \\\\ \\end{array}}$$


    where the columns of `U` are the unit eigenvectors of `H`, then


    $$\\begin{array}{l} {U^{- 1}HU = \\left( \\begin{array}{ll} {\\frac{1}{2}\\left(
    {\\sqrt{61} + 5} \\right)} & 0 \\\\ 0 & {\\frac{1}{2}\\left( {5 - \\sqrt{61}}
    \\right)} \\\\ \\end{array} \\right) = D.} \\\\ \\end{array}}$$


    `U` is a unitary matrix and the main diagonal entries of `D` are the real eigenvalues
    of `H`.


    Applying this idea with similar ideas to that in [Lemma 4](#chapter7.xhtml#lemm7_4),
    the probability density of a Hermitian matrix, `H`, is the same as that for `D
    = U^{− 1}HU*`, and thus is directly related to the probability density of the
    eigenvalues of `H`.


    A random Hermitian matrix is a matrix in the **Gaussian Unitary Ensemble (GUE)**
    if `H[i, i]` ∼ $N(0, 1)$ and the upper triangular entries $\left. H_{i,j} \right.\sim
    N\left( {0,\\,\\frac{1}{2}} \right) + iN\left( {0,\\,\\frac{1}{2}} \right)$, for
    $1 \le i \le j \le n$. The standard GUE,


    $$\\begin{array}{r} {H = \\frac{X + {\\overline{X}}^{T}}{2},} \\\\ \\end{array}}$$


    where `X[i, i]` ∼ $N(0, 1)$ and $\left. X_{i,j} \right.\sim\mathbf{N}\left( {0,\\,\\frac{1}{2}}
    \right) + i\mathbf{N}\left( {0,\\,\\frac{1}{2}} \right)$ for $1 \le i \le j \le
    n$.


    Like the Gaussian Orthogonal Ensemble, if we define a $2 \times 2$ random matrix
    from GUE,


    $$\\begin{array}{l} {X = \\left( \\begin{array}{ll} X_{1} & X_{2} + X_{3}i \\\\
    X_{2} - X_{3}i & X_{4} \\\\ \\end{array} \\right),} \\\\ \\end{array}}$$


    with i.i.d random variables `X[1], X[4]` ∼ $N(0,1)$ and $\left. X_{2}, X_{3} \right.\sim
    N(0,\frac{1}{2})$, the eigenvalues of `X` are


    $$\\begin{array}{r} {\\frac{1}{2}Tr(X) \\pm \\sqrt{(X_{1} - X_{4})^{2} + 4{(X_{2}
    + X_{3}i)^{2}}}, \\\\ \\end{array}}$$


    and the mean of the eigenvalues is $\frac{1}{2}(X_{1} + X_{4}) \sim N(0,\frac{1}{2})$.


    The result presented in [Theorem 18](#chapter7.xhtml#theo18) is not necessarily
    true for all random matrices which are not GOE or GUE. [Figure 7.7](#chapter7.xhtml#fig_7)
    shows the real versus imaginary part of mean eigenvalue of a non-Hermitian, non-symmetric,
    random matrix.


    ![Figure 7.7 The Real vs Imaginary parts of mean eigenvalue of a 2×2 Non-Hermitian
    Matrix](images/fig7_7)


    The final ensemble of this chapter is the Gaussian Symplectic Ensemble, which
    focuses on random entries who are quaternion nature.


    ## 7.5 Gaussian Symplectic Ensemble


    A **quaternion** is a linear combination


    $$\\begin{array}{r} {q = a \\cdot 1 + bi + cj + dk,} \\\\ \\end{array}}$$


    where `a`, `b`, `c`, and `d` $\in \mathbb{R}$ and `i`, `j`, and `k` are the quaternion
    units,


    $$\\begin{array}{r} {i^{2} = j^{2} = k^{2} = i \\cdot k = -1.} \\\\ \\end{array}}$$


    The set of quaternions is denoted $\mathbb{H}$.


    The complex conjugate for a quaternion, `q`, can also be defined


    $$\\begin{array}{r} {\\overline{q} = a \\cdot 1 - bi - cj - dk.} \\\\ \\end{array}}$$


    Similar to elements in $\mathbb{C}^n$, if `q = (q[1], q[2], ..., q[n])` and `p
    = (p[1], p[2], ..., p[n])` are in $\mathbb{H}^n$ then


    $$\\begin{array}{r} {< p, q > = \\sum_{i = 1}^{n}\\overline{p}_{i}}q_{i},} \\\\
    \\end{array}}$$


    and thus the norm of `q`,


    $$\\begin{array}{r} {||q|| = q\\overline{q} = \\overline{q}q = a^{2} + b^{2} +
    c^{2} + d^{2}.} \\\\ \\end{array}}$$


    A $2 \times 2$ matrix, `Q`, of the form


    $$\\begin{array}{l} {Q = \\left( \\begin{array}{ll} z & w \\\\ -\\overline{w}
    & \\overline{z} \\\\ \\end{array} \\right),} \\\\ \\end{array}}$$


    where `z` and `w` are complex numbers is called a **real quaternion** matrix.
    Just like the standard basis elements of the quaternions, are 1, `i`, `j` and
    `k`, as $2 \times 2$ matrices


    $$\\begin{array}{l} {V_{1} = \\left( \\begin{array}{ll} 1 & 0 \\\\ 0 & 1 \\\\
    \\end{array} \\right), V_{2} = \\left( \\begin{array}{ll} i & 0 \\\\ 0 & -i \\\\
    \\end{array} \\right),} \\\\ \\end{array}}$$


    $$\\begin{array}{l} {V_{3} = \\left( \\begin{array}{ll} 0 & 1 \\\\ -1 & 0 \\\\
    \\end{array} \\right),\\{~{~~}V_{4} = \\left( \\begin{array}{ll} 0 & i \\\\ i
    & 0 \\\\ \\end{array} \\right),} \\\\ \\end{array}}$$


    can serve as a basis for the set of real quaternion matrices where


    $$\\begin{array}{r} {Q = aV_{1} + bV_{2} + cV_{3} + dV_{4}.} \\\\ \\end{array}}$$


    We will see how real quaternion matrices are related to the next ensemble presented,
    the Gaussian Symplectic Ensemble.


    A matrix `A` is **skew-symmetric** if


    $$\\begin{array}{r} {A^{T} = - A} \\\\ \\end{array}}$$


    A **symplectic** matrix `M` is a $2n \times 2n$ matrix such that if $S = \begin{pmatrix}
    0 & I_{n} \\\\ -I_{n} & 0 \\\\end{pmatrix}$ is a real skew-symmetric matrix then


    $$\\begin{array}{r} {M^{T}SM = S.} \\\\ \\end{array}}$$


    If `X` is a $2n \times 2n$ matrix with entries `X[i, j]` ∼ $N(0, \sigma^2) + iN(0,
    \sigma^2)$ and `X[i, j]` are i.i.d. then we define


    $$\\begin{array}{r} {H = \\frac{X + {\\overline{X}}^{T} - S{(X + {\\overline{X}}^{T})^{T}S}{4}}
    \\\\ \\end{array}}$$


    as a **Gaussian Symplectic Ensemble (GSE)**, where $S = \begin{pmatrix} 0 & I_{n}
    \\\\ -I_{n} & 0 \\\\end{pmatrix}$.


    We have seen three different types of matrix ensembles. You can find a deep dive
    into the joint distributions of elements of the GOE and that of the eigenvalues
    of the GOE in [Section 7.3](#chapter7.xhtml#sec7_3). In general if `β` = 1, 2,
    and 4, represent the GOE, GUE, and GSE, the joint distribution of the elements
    from a random matrix, `X`, are of the form


    $$\\begin{array}{r} {\\frac{1}{2^{n/2}}\\frac{1}{\\pi^{n/2 + n(n - 1)\\beta/4}}e^{-
    ||X||\_{F}^{2}}} \\\\ \\end{array}}$$


    where || ⋅ ||[*F*] represents the **Frobenius norm**,

