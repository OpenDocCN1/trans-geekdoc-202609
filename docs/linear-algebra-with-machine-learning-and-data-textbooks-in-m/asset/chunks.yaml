    \ 开始。\n\n使用这个猜测，\n\n$$\\begin{array}{ll} LL(A^{(0)}) &= \\{ - 372768., - 5.45396\
    \ \\times 10^{6} \\} \\\\ H(A^{(0)}) &= \\left( \\begin{array}{ll} 445954. & 6.2404\
    \ \\times 10^{6} \\\\ 6.2404 \\times 10^{6} & 8.98843 \\times 10^{7} \\end{array}\
    \ \\right) \\\\ A^{(1)} &= \\{ 5.03667, 0.49285 \\} \\\\ \\end{array}$$\n\n在这个案例中，$$\\\
    lambda = 5.03667 + 0.49285t.$$这些信息也可以用于确定 2020 年 4 月中安大略的 $R_0$。\n\n## 5.8 习题\n\
    \n*   给定 $y = \\begin{pmatrix} y_{1} \\\\ y_{2} \\end{pmatrix}$ $x = \\begin{pmatrix}\
