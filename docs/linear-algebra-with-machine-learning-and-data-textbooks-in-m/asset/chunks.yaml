    ## [Table 2.4](#chapter2.xhtml#b2tbl2_4) S & P 500 index behavior trends.


    | Date | Opening | Date | Opening | Trend |

    | --- | --- | --- | --- | --- |

    | 10/2/2019 | 2924.78 | 10/3/2019 | 2885.37 | D |

    | --- | --- | --- | --- | --- |

    | 11/1/2019 | 3050.72 | 11/4/2019 | 3078.95 | U |

    | 12/2/2019 | 3143.85 | 12/3/2019 | 3087.40 | D |

    | 1/9/2020 | 3266.03 | 1/10/2019 | 3281.81 | U |

    | 2/4/2020 | 3280.61 | 2/5/2020 | 3324.90 | U |

    | 3/9/2020 | 2863.89 | 3/10/2020 | 2813.47 | D |

    | 4/8/2020 | 2685 | 4/9/2020 | 2776.98 | U |

    | 5/13/2020 | 2865.86 | 5/14/2020 | 2794.54 | D |

    | 6/5/2020 | 3163.84 | 6/8/2020 | 3199.92 | U |

    | 7/21/2020 | 3268.52 | 7/22/2020 | 3254.86 | D |

    | 8/24/2020 | 3418.09 | 8/25/2020 | 3435.95 | U |


    A larger dataset of Trump tweets about the stock market can be found at Github
    link 18.


    In this example, we will use the sentiment of Trump tweets in order to predict
    the change from opening to closing behavior in the S & P 500 index. We will assume
    that stock behaviors are monthly; however, in a real-life model with a much larger
    data set, a similar analysis should be done with daily trends. The data from [Table
    2.3](#chapter2.xhtml#tbl2_3) is used to create the transmission matrix


    $$

    \begin{array}{l} {T = \begin{array}{l} {Up} \\ {Down} \\ \end{array}\left( \begin{array}{ll}
    {Up} & {Down} \\ \frac{1}{5} & 1 \\ \frac{4}{5} & 0 \\ \end{array} \right).}

    \end{array}

    $$


    and the emission matrix


    $$

    \begin{array}{l} {E = \begin{array}{l} {Bull} \\ {Bear} \\ \end{array}\left( \begin{array}{ll}
    U & D \\ \frac{5}{6} & \frac{1}{5} \\ \frac{1}{6} & \frac{4}{5} \\ \end{array}
    \right).}

    \end{array}

    $$


    In addition,


    $$

    \begin{array}{r} {\pi = (P(Up), P(Down)) = \left( \frac{6}{11},\frac{5}{11} \right).}

    \end{array}

    $$


    We begin by studying three month, or quarter, trends and finding the most likely
    observation sequence


    $$

    \begin{array}{r} {O = (O_{1}, O_{2}, O_{3}),}

    \end{array}

    $$


    where `O` represents the sentiment in Trump''s tweet at time `i` in three month
    sequence


    $$

    \begin{array}{r} {H = (H_{1}, H_{2}, H_{3}),}

    \end{array}

    $$


    where `H` represents the difference between closing and opening on the `i`th month
    of the three month sequence. Notice that


    $$

    \begin{array}{r} {E \cdot \pi = (0.55697,0.44303)\text{and } E \cdot T^{2} \cdot
    \pi = (0.547758,0.452242)}

    \end{array}

    $$


    and thus the most likely scenario in Trump''s three month sentiment will be


    $$

    \begin{array}{r} {\text{(Bullish,Bullish,Bullish)}}\end{array}

    $$


    Additionally, the unit eigenvector `v`, associated with `λ`, for `E`:


    $$

    \begin{array}{r} {v = (0.553097,0.446903).}

    \end{array}

    $$


    Thus, over a long period of time, it is much likely that the monthly sentiment
    for Trump''s tweets is Bullish, based on the given data. More importantly, one
    might wish to know, if Trump''s monthly tweets are of a certain observation sequence,
    such as (Bullish, Bullish, Bullish), what is happening in the market?


    In this case Viterbi''s Algorithm can be followed. A diagram of Viterbi''s Algorithm
    can be found in [Figure 2.11](#chapter2.xhtml#fig2_11) which shows that if Trump''s
    three month sentiment is (Bullish, Bearish, Bullish) the most likely hidden sequence
    of the market is


    $$

    \begin{array}{r} {\text{(Up,Down,Up)~with probability}.2523.}

    \end{array}

    $$


    ![Figure 2.11 Viterbi''s Algorithm for three month trends based on tweets.](images/fig2_11.jpg)


    [Figure 2.11](#chapter2.xhtml#b2fig211) Viterbi''s Algorithm for three month trends
    based on tweets.


    Finally, we wish to find the best model. We begin by assuming that


    $$

    \begin{array}{r} {O = (Bullish,Bullish,Bullish),}

    \end{array}

    $$


    the first three states in [Table 2.3](#chapter2.xhtml#tbl2_3), then


    $$

    \begin{aligned} {\alpha(H_{1})^{U} = \frac{5}{11},\alpha(H_{1})^{D} = \frac{1}{11},}
    \\ {\alpha(H_{2})^{U} = \frac{1}{33},\alpha(H_{2})^{D} = \frac{16}{55},} \\ {\alpha(H_{3})^{U}
    = \frac{49}{198},\alpha(H_{3})^{D} = \frac{4}{825},}

    \end{aligned}

    $$


    $$

    \begin{aligned} {\beta(H_{3})^{U} = 1,\beta(H_{3})^{D} = 1,} \\ {\beta(H_{2})^{U}
    = \frac{9}{150},\beta(H_{2})^{D} = \frac{5}{6},} \\ {\beta(H_{1})^{U} = \frac{2449}{4500},\beta(H_{1})^{D}
    = \frac{49}{900}.}


    \end{aligned}

    $$


    Note that these values tell us that


    $$

    \begin{array}{r} {P(O|\lambda) = \sum\limits_{k}\alpha(H_{3})^{k} = 0.2523.}

    \end{array}

    $$


    Using this information, we determine


    $$

    \begin{array}{r} {\gamma(H_{1})^{(U,D)} = \left\{0.553097,0.446903\right\}}

    \end{array}

    $$


    $$

    \begin{array}{r} {\gamma(H_{2})^{(U,D)} = \left\{0.960769,0.039231\right\}}

    \end{array}

    $$


    $$

    \begin{array}{r} {\gamma(H_{3})^{(U,D)} = \left\{0.980784,0.019216\right\}}

    \end{array}

    $$


    $$

    \begin{aligned} {\xi_{t}(i,j) = P(H_{t}=i,H_{t+1}=j|O,\lambda) = \frac{\alpha_{t}(i)a_{ij}\beta_{t+1}(j)}{\sum_{k}\alpha_{t}(k)a_{kj}\beta_{t+1}(k)}}

    \end{aligned}

    $$


    and the new model is `pi`:


    $$

    \begin{array}{l} {T^{new} = \begin{array}{l} {Up} \\ {Down} \\ \end{array}\left(
    \begin{array}{ll} {Up} & {Down} \\ \frac{1}{5} & 1 \\ \frac{4}{5} & 0 \\ \end{array}
    \right).}

    \end{array}

    $$


    $$

    \begin{array}{l} {E^{new} = \begin{array}{l} {Bull} \\ {Bear} \\ \end{array}\left(
    \begin{array}{ll} U & D \\ \frac{5}{6} & \frac{1}{5} \\ \frac{1}{6} & \frac{4}{5}
    \\ \end{array} \right).}

    \end{array}

    $$

