    ## 5.2 矩阵微积分简介


    正如我们在上一节看到的，有时必须通过积分从概率密度函数确定累积分布函数。此外，由于本章重点是优化，理解与微分相关的某些主题是非常重要的，重点关注如何将这些概念应用于矩阵。


    ### 5.2.1 矩阵微分


    给定一个标量向量 $X = \begin{pmatrix} x_{1} \\ x_{2} \\ \vdots \\ x_{n} \\ \end{pmatrix}$
    和函数向量


    $$\begin{array}{l} {Y = \left( \begin{array}{l} {f_{1}\left( {x_{1},x_{2},\cdots,x_{n}}
    \right)} \\ {f_{2}\left( {x_{1},x_{2},\cdots,x_{n}} \right)} \\ \vdots \\ {f_{m}\left(
    {x_{1},x_{2},\cdots,x_{n}} \right)} \\\\ \end{array} \right),} \\ \\ \end{array}$$


    `Y`  respect 标量 `x[i]` (1≤`i`≤`n`) 的导数是


    $$\begin{array}{r} {\\frac{\partial Y}{\partial x_{i}} = \left( {\\frac{\partial
    f_{1}}{\partial x_{i}},\frac{\partial f_{2}}{\partial x_{i}},\ldots,\\frac{\partial
    f_{m}}{\partial x_{i}}} \right)} \\ \\ \end{array}}$$


