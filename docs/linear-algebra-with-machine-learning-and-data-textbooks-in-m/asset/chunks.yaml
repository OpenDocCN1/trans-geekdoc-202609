    \ Most importantly, the rate at which the function is changing at a minimum (or\
    \ maximum), the slope of the dashed line (on [Figure 5.6](#chapter5.xhtml#fig5_6)),\
    \ is zero.\n\n**If the function is increasing then the gradient is positive.**\n\
    \n**A function reaches an optimum value (either a minimum or maximum) when the\
    \ gradient is zero.**\n\nThus, one can determine the values that minimize a function\
    \ by calculating the **gradient** of the function and finding the values, also\
    \ called **parameters**, that optimize the loss function.\n\nIf **SSE** is the\
    \ loss function then we denote the gradient of SSE with respect to the coefficient\
    \ *a*[*i*] as\n\n$$\\\\begin{array}{r} {\\\\frac{\\\\partial SSE}{\\\\partial\
    \ a\\_{i}}.} \\\\\\\\ \\\\end{array}$$  \n\nIf $\\\\hat{y} = \\\\hat{f(x)} = a\\\
    _{0} + a\\_{1}x + a\\_{2}x^{2} + \\\\ldots a\\_{n}x^{n}$, then\n\n$$\\\\begin{aligned}\
    \ {SSE} & {= {(y - (a\\_{0} + a\\_{1}x + a\\_{2}x^{2} + \\\\ldots a\\_{n}x^{n}))}^{2}}\
    \ \\\\\\\\ \\\\frac{\\\\partial SSE}{\\\\partial a\\_{0}} & {= - 2(y - (a\\_{0}\
    \ + a\\_{1}x + a\\_{2}x^{2} + \\\\ldots a\\_{n}x^{n})) = - 2(y - \\\\hat{y})}\
    \ \\\\\\\\ \\\\frac{\\\\partial SSE}{\\\\partial a\\_{1}} & {= - 2x(y - (a\\_{0}\
    \ + a\\_{1}x + a\\_{2}x^{2} + \\\\ldots a\\_{n}x^{n})) = - 2x(y - \\\\hat{y})}\
    \ \\\\\\\\ & \\\\vdots \\\\\\\\ \\\\frac{\\\\partial SSE}{\\\\partial a\\_{2}}\
    \ & {= - 2x^{n}(y - \\\\hat{y}).} \\\\\\\\ \\\\end{aligned}$$  \n\nThe Gradient\
    \ Descent Algorithm consists of\n\n1.  Creating a interpolant, *ŷ* = *f̂*(*x*),\
    \ using *n* interpolating points.\n\n    The coefficients, *a*[*i*], 0 ≤ *i* ≤ *n*,\
    \ that are determined are called the *weights* in this algorithm. Begin by making\
    \ a good guess for each of the coefficients and choosing a loss function, such\
    \ as SSE.\n\n2.  For each coefficient, *a*[*i*], determine the gradient\n\n  \
    \  $$\\\\begin{array}{r} {\\\\frac{\\\\partial SSE}{\\\\partial a\\_{i}} = {\\\
    \\sum\\\\limits\\_{j = 0}^{n}{(y\\_{j} - \\\\hat{y\\_{j}})}}{(x\\_{j})}^{i}.}\
    \ \\\\\\\\ \\\\end{array}$$  \n\n3.  Adjust the weights taking into consideration\
    \ a learning rate, *r*,\n\n    $$\\\\begin{array}{r} {\\\\text{new~}a\\_{i} =\
    \ a\\_{i} + r\\\\frac{\\\\partial SSE}{\\\\partial a\\_{i}}.} \\\\\\\\ \\\\end{array}$$\
    \  \n\n4.  Repeat Steps 2-4 to update the coefficients and approach a minimum\
    \ *SSE*.\n\n![Figure 5.8 Example 5.15 data and cubic interpolants for several\
    \ iterations of gradient descent.](images/fig5_8.jpg)\n\n[Figure 5.8](#chapter5.xhtml#b5fig5_8)\
    \ Example 5.15 data and cubic interpolants for several iterations of gradient\
    \ descent.\n\nGradient Descent methods can be written in terms of matrix system\
    \ as well. If the interpolation function is an *n*^(th) degree polynomial\n\n\
    $$\\\\begin{array}{r} {\\\\hat{y} = a\\_{0} + a\\_{1}x + \\\\ldots + a\\_{n}x^{n},}\
    \ \\\\\\\\ \\\\end{array}$$  \n\nthen the SSE cost function can be written as\n\
    \n$$\\\\begin{array}{r} {SSE = {(XA - Y)}^{T}(XA - Y),\\\\text{~where~}} \\\\\\\
    \\ \\\\end{array}$$  \n\n$$\\\\begin{array}{l} {X = \\\\left( \\\\begin{array}{lllll}\
    \ 1 & x\\_{0} & x\\_{0}^{2} & \\\\ldots & x\\_{0}^{n} \\\\\\\\ 1 & x\\_{1} & x\\\
    _{1}^{2} & \\\\ldots & x\\_{1}^{n} \\\\\\\\ \\\\vdots & \\\\ddots & \\\\ddots\
    \ & \\\\ddots & \\\\vdots \\\\\\\\ 1 & x\\_{n} & x\\_{n}^{2} & \\\\ldots & x\\\
    _{n}^{n} \\\\\\\\ \\\\end{array} \\\\right),\\\\, A = \\\\left( \\\\begin{array}{l}\
    \ a\\_{0} \\\\\\\\ a\\_{1} \\\\\\\\ \\\\vdots \\\\\\\\ a\\_{n} \\\\\\\\ \\\\end{array}\
    \ \\\\right),} \\\\\\\\ \\\\end{array}$$  \n\n$$\\\\begin{array}{l} {and\\\\,\
    \ Y = \\\\left( \\\\begin{array}{l} y\\_{0} \\\\\\\\ y\\_{1} \\\\\\\\ \\\\vdots\
    \ \\\\\\\\ y\\_{n} \\\\\\\\ \\\\end{array} \\\\right).} \\\\\\\\ \\\\end{array}$$\
    \  \n\nThe gradients are\n\n$$\\\\begin{array}{r} {\\\\frac{\\\\partial SSE}{\\\
    \\partial A} = X^{T}(XA - Y),} \\\\\\\\ \\\\end{array}$$  \n\nand if *r* is the\
    \ learning rate then\n\n$$\\\\begin{array}{r} {A\\_{i}^{(j + 1)} = A\\_{i}^{(j)}\
    \ - r\\\\frac{\\\\partial SSE}{\\\\partial a\\_{i}},} \\\\\\\\ \\\\end{array}$$\
    \  \n\nwhere *A*[*i*]^((*j*)) is the *i*^(th) entry of the *j*^(th) iteration\
    \ of *A*.\n\n$$\\\\begin{array}{l} {\\\\left( \\\\begin{array}{l} \\\\frac{\\\\\
    partial SSE}{\\\\partial a\\_{0}} \\\\\\\\ \\\\\\\\ \\\\frac{\\\\partial SSE}{\\\
    \\partial a\\_{1}} \\\\\\\\ \\\\\\\\ \\\\frac{\\\\partial SSE}{\\\\partial a\\\
    _{2}} \\\\\\\\ \\\\\\\\ \\\\frac{\\\\partial SSE}{\\\\partial a\\_{3}} \\\\\\\\\
    \ \\\\end{array} \\\\right) = \\\\left( \\\\begin{array}{l} 20 \\\\\\\\ 56 \\\\\
    \\\\ 92 \\\\\\\\ 200 \\\\\\\\ \\\\end{array} \\\\right).} \\\\\\\\ \\\\end{array}$$\
    \  \n\nThus if the learning rate *r* = .01,\n\n$$\\\\begin{array}{l} {A^{(1)}\
    \ = \\\\left( \\\\begin{array}{llll} {- 4} & 7 & 7 & {- 4} \\\\\\\\ \\\\end{array}\
    \ \\\\right) - .01\\\\left( \\\\begin{array}{l} 20 \\\\\\\\ 56 \\\\\\\\ 92 \\\\\
    \\\\ 200 \\\\\\\\ \\\\end{array} \\\\right) = \\\\left( \\\\begin{array}{l} {-\
    \ 4.2} \\\\\\\\ 6.44 \\\\\\\\ 6.08 \\\\\\\\ {- 6.} \\\\\\\\ \\\\end{array} \\\\\
    right).} \\\\\\\\ \\\\end{array}$$  \n\nAs you can tell from [Examples 5.15](#chapter5.xhtml#exam5_15)\
    \ and [5.16](#chapter5.xhtml#exam5_16), the Gradient Descent method can be computational\
    \ expensive. That is, that for each iteration of the Gradient Descent method,\
    \ computations have to be made on each data point.\n\nIn traditional gradient\
    \ descent methods, the gradient (or derivative) of the loss function must be calculated\
    \ for each interpolating point. This can be computationally hard. For example,\
    \ in [Example 5.16](#chapter5.xhtml#exam5_16), there are only six data points\
    \ with four partial derivatives in one iteration. After just four interactions,\
    \ there are almost 100 calculations. If a dataset contained 10,000 points and\
    \ one wished to use gradient descent to model the data with a cubic polynomials,\
    \ each iteration would take 40,000 calculations.\n\n**Stochastic Gradient Descent**\
    \ is one way to make computational improvements to these methods. When employing\
    \ Stochastic Gradient Descent, the gradient is calculated, on each iterative step,\
    \ at a random point or small random set of points called a **mini-batch**.\n\n\
    Additionally, keep in mind that depending on the loss function, the gradient descent\
    \ method is also not guaranteed to converge, so it is important to think carefully\
    \ about both the learning rate, *r*, and the loss function that you are using.\
    \ [Figure 5.9](#chapter5.xhtml#fig5_9) shows both an example in which the method\
    \ converges and diverges.\n\n![Figure 5.9 Examples of the gradient descent method\
    \ converging (left) and diverging (right).](images/fig5_9.jpg)\n\n[Figure 5.9](#chapter5.xhtml#b5fig5_9)\
    \ Examples of the gradient descent method converging (left) and diverging (right).\n\
    \nThe gradient descent method is just one method of neural network. In the next\
    \ section, we explore the concepts of neural networks more broadly.\n\n## 5.5 Introduction\
    \ to Neural Networks\n\n**Neural networks** are powerful tools in data science\
    \ that focus on relationships in data. It is interesting to note that neural networks\
    \ are based on the systems in the brain. In the brain, neurons receive information,\
    \ or data, from other neurons. This system of neurons is connected by axons, where\
    \ some neurons are more connected that other neurons to the network.\n\nThere\
    \ are two general types of neural networks, **unsupervised neural networks** that\
    \ try to predict an output given a set of input data and **supervised neural networks**\
    \ where both the input data and output data is know. In a supervised neural network,\
    \ the known output data can be used to determine the accuracy of the neural network.\n\
    \nIn an unsupervised neural network, a neuron can be viewed as receiving a set\
    \ of inputs, {*x*[1], *x*[2],…, *x*[*n*]}, to predict one output, *y*. Each input\
    \ is associated with a weighted connection between it and the output. We will\
    \ represent the matrix of weights as *W*. Data also naturally has bias or noise;\
    \ we represent this bias with the vector *b*."
