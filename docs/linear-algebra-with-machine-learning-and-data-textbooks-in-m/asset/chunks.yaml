    = 1}^{n}\\log}(p(y\_{i}|\\, x\_{i},\\, a\_{0},\\, a\_{1}))} \\ & = {\\sum\\limits\_{i
    = 1}^{n}\\log}\left( {\\frac{1}{\\sqrt{2\pi s^{2}}}e^{- \frac{{(y\_{i} - (a\_{0}
    + a\_{1}x\_{i}))}^{2}}{2s^{2}}}} \right) \\ & = n\log\left( \frac{1}{\\sqrt{2\pi
    s^{2}}} \right) - \frac{1}{2s^{2}}{\\sum\\limits\_{i = 1}^{n}}{(y\_{i} - (}}a\_{0}
    + a\_{1}x\_{i}))^{2}} \\ & = - \frac{n\log(2\pi)}{2} - 2n\log(s) - \frac{1}{2s^{2}}{\\sum\\limits\_{i
    = 1}^{n}}{(y\_{i} - (}}a\_{0} + a\_{1}x\_{i}))^{2}.} \\ \end{aligned}$$


    由于 `log(x)` 是递增函数，确定使 `L(a[0], a[1])` 最大化的 `a[0]` 和 `a[1]` 值等同于确定使 `L(a[0], a[1])`
    最大化的 `a[0]` 和 `a[1]` 值。


    $$\begin{array}{r} \frac{\partial LL(a\_{0},a\_{1})}{\partial a\_{1}} = - \frac{1}{s^{2}}{\\sum\\limits\_{i
    = 1}^{n}x\_{i}}(y\_{i} - (a\_{0} + a\_{1}x_{i})) = 0} \\ \end{array}$$


    当


    $$\begin{aligned} a_{1} &= \frac{{\\sum\\limits\_{i = 1}^{n}x\_{i}y\_{i}}}{\\sum\\limits\_{i
    = 1}^{n}x\_{i}}} \\ = \frac{{\\sum\\limits\_{i = 1}^{n}(x\_{i} - \overline{x})(y\_{i}
    - \overline{y})}{\\sum\\limits\_{i = 1}^{n}(x\_{i} - \overline{x})^{2}} \\ \end{aligned}$$


    同样，


    $$\begin{array}{r} \frac{\partial LL(a\_{0},a\_{1})}{\partial a\_{0}} = - \frac{1}{s^{2}}{\\sum\\limits\_{i
    = 1}^{n}}(y\_{i} - (a\_{0} + a\_{1}x_{i})) = 0} \\ \end{array}$$


    当


    $$a_{0} = \frac{1}{n}{\\sum\\limits\_{i = 1}^{n}y\_{i}} - \frac{a_{1}}{n}{\\sum\\limits\_{i
    = 1}^{n}x\_{i}} = \overline{y} - a_{1}\overline{x}.$$


    以矩阵形式，


    $$\begin{array}{l} \left( \begin{array}{l} a_{0} \\ a_{1} \\end{array} \right)
    = (X^{T}X)^{- 1}X^{T}Y, \\ \end{array}$$


    其中


    $$\begin{array}{l} X = \left( \begin{array}{ll} 1 & x_{1} \\ 1 & x_{2} \\ \vdots
    & \vdots \\ 1 & x_{n} \\end{array} \right)\text{且}~Y = \left( \begin{array}{l}
    y_{1} \\ y_{2} \\ \vdots \\ y_{n} \\\end{array} \right). \\ \end{array}$$


    **泊松回归模型**或对数线性模型假设变量 `Y[i]` 是同分布的泊松随机变量 `Y[i] ~ Poisson(λ)`。


    由于 `λ > 0`，我们可以确定 `log(λ)`。我们假设


    $$\begin{array}{r} log(\lambda) = a_{0} + a_{1}x. \end{array}$$


    $$\begin{aligned} p(y\_{i}|x_{i},a_{0},a_{1}) &= {\\prod\\limits\_{i = 1}^{n}e^{-
    \lambda}}\frac{\lambda^{y_{i}}}{y_{i}!}} \\ LL(a_{0},a_{1}) &= \log\left( {{\\prod\\limits\_{i
    = 1}^{n}e^{- \lambda}}\frac{\lambda^{y_{i}}}{y_{i}!}} \right) \\ & = {\\sum\\limits\_{i
    = 1}^{n} -\lambda + y_{i} \cdot log(\lambda) - log(y_{i}!)} \\ & = {\\sum\\limits\_{i
    = 1}^{n} -e^{(a_{0} + a_{1}x_{i})} + y_{i} \cdot (a_{0} + a_{1}x_{i}) - log(y_{i}!).
    \\ \end{aligned}$$


    求偏导，


    $$\begin{array}{r} \frac{\partial LL(a_{0},a_{1})}{\partial a_{0}} = {\\sum\\limits\_{i
    = 1}^{n} -e^{(a_{0} + a_{1}x_{i})} + y_{i} = 0.} \\ \end{array}$$


    同样，


    $$\begin{array}{r} \frac{\partial LL(a_{0},a_{1})}{\partial a_{1}} = {\\sum\\limits\_{i
    = 1}^{n} -x_{i}e^{(a_{0} + a_{1}x_{i})} + x_{i}y_{i}.} \\ \end{array}$$


    以矩阵形式，


    $$\begin{array}{l} X = \left( \begin{array}{ll} 1 & x_{1} \\ 1 & x_{2} \\ \vdots
    & \vdots \\ 1 & x_{n} \\\end{array} \right)\text{且}~Y = \left( \begin{array}{l}
    y_{1} \\ y_{2} \\ \vdots \\ y_{n} \\\end{array} \right). \\ \end{array}$$


    $$\begin{array}{l} \left( \begin{array}{l} a_{0} \\ a_{1} \\\end{array} \right)
    = (X^{T}X)^{- 1}X^{T}Y, \\ \end{array}$$


    其中 *W* 是对角矩阵


    $$\begin{array}{l} W = \left( \begin{array}{llll} e^{(a_{0} + a_{1}x_{1})} & 0
    & \ldots & 0 \\ 0 & e^{(a_{0} + a_{1}x_{2})} & \ldots & 0 \\ \vdots & \vdots &
    \ddots & \vdots \\ 0 & 0 & \ldots & e^{(a_{0} + a_{1}x_{n})} \\\end{array} \right),
    \\ \end{array}$$


    使用海森矩阵，*A* 的第 *i* 次迭代估计值为：


    $$\begin{array}{r} A^{(i)} = A^{(i - 1)} - H_{LL}{(A^{(i - 1)})}^{- 1}\nabla LL(A^{(i
    - 1)}).} \\ \end{array}$$


