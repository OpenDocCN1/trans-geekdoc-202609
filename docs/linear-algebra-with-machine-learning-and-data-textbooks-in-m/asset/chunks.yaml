    end{array}}$$\n\n使得平方和 $SSE = \\sum_{j = 0}^{n}(\\hat{f}(x_{j}) - f(x_{j}))^{2}$\
    \ 最小的插值多项式。上面的系统可以写线性方程组：\n\n$$\\begin{array}{l} {\\\\left( \\begin{array}{llll}\
