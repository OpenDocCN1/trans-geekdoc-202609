    7. The matrix is a count of actual against predicted sentences. The matrix shows
    that; TP, TN, FP and FN are; 40, 81, 21, 17 for POA-LSTM (10), 83, 38, 24, 14
    for POA-LSTM (15), 74, 49, 13, 24 for POA-LSTM (20), 81, 40, 22, 16 for POA-LSTM
    (25), 78, 41, 21, 19 for POA-LSTM (30) and 83, 38, 24, 14 for LSTM (30).


    Fig. 8 presents the results of the developed model on the performance metrics
    calculated by the TP, FP and FN values obtained in the confusion matrices in Fig.
    7. The accuracy, precision, recall and F1 of the developed models are; for POA-LSTM
