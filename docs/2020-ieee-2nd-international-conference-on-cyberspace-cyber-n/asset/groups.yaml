    Input: Sentiment data; LSTM model

    Output: Optimal sentiment; Best model


    +   I. Data collection and pre-processing

    II. Feature selection

    III. Feature extraction

    IV. LSTM design

    V. POA parameters initialization and population generation

    VI. Select parameters randomly and utilize scout location

    VII. Train and LSTM model

    VIII. Evaluate the fitness of each scout, scout location and normalize scores

    IX. Repeat the search space until stopping criterion is reached

    X. Select best scout location and posteriorization in the next

    XI. Train the best LSTM model using new locations

    XII. Evaluate the fitness of appropriate and best posterior location

    XIII. Repeat until no better location is found

    XIV. Train the best LSTM model using new locations

    XV. Evaluate the fitness of appropriate and best posterior location. For each
    scout, divide the curve range by the number of posteriorists

    XVI. If all regions within the search space have not been explored, XVII. Select
    a scout location

    XVIII. Repeat steps v-xi and update the global best posterior location

    IX. Else, return the global-best posterior

    XX. Return best model

    XXI. Stop


