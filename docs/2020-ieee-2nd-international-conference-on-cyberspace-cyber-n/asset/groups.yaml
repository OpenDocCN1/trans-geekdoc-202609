    从数学上，LSTM 的数学表示如下：[23]:

    $f_t = \sigma(W_f x_t + U_f h_{t-1} + b_f)$

    $i_t = \sigma(W_i x_t + U_i h_{t-1} + b_i)$

    $\tilde{c}_t = anh(W_c x_t + U_c h_{t-1} + b_c)$

    $c_t = f_t \odot c_{t-1} + i_t \odot \tilde{c}_t$

    $o_t = \sigma(W_o x_t + U_o h_{t-1} + b_o)$

    $h_t = o_t \odot anh(c_t)$


    其中 $W$ 和 $U$ 是参数，$b$ 是偏置，$x_t$ 和 $h_t$ 分别是 LSTM 时间的输入和隐藏状态，而 $i_t$、$o_t$ 和 $f_t$
    分别是激活门输入、输出和遗忘门。最后，$\sigma$ 和 $C_t$ 是 sigmoid 函数和记忆单元状态。


