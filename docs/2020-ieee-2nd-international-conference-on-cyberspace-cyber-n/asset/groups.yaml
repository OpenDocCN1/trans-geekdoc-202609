    with 100 nodes are 71.62%, 78.26%, 73.44%, and 76.19% respectively. The POA-LSTM
    (20) is better than the other models based on the accuracy, precision, recall,
    and F-score. while POA-LSTM (15) outperforms other models in terms of accuracy,
    recall, and F-score. Overall, the optimized models perform better than the un-optimized
    LSTM model in terms of all of the metrics measured. This could be attributed to
    training the LSTM model with optimal parameters selected by the POA optimizer.


    ![](img/958604c68ccd723d8738236ae47572bc_4_0.png)


    Table I: POA-LSTM optimization


    | Population Size | Optimal Learning Rate | Optimal Hidden Nodes | Optimal Fitness
    Value |

    | :--- | :--- | :--- | :--- |

    | 10 | 0.01 | | 0.761 |

    | 15 | 0.02 | | 0.761 |

    | 20 | 0.18 | | 0.7736 |

    | 25 | 0.01-37 | 5 | 0.81 |

    | 30 | 0.02-21 | 1 | 0.7484 |


    ## V. CONCLUSION AND FUTURE DIRECTION


    In this paper, an optimized sentiment analysis using Population Optimization Algorithm
    (POA) and LSTM deep learning model. The learning rate and node size of the LSTM
    were tested on the customer''s sentences from a product from Amazon. Also, the
    population size of the algorithm was optimized. This showed that LSTM perform
    better than unoptimized LSTM for sentiment analysis. Furthermore, the POA is capable
    of being used as parameter optimizer.


    In future, other sentiment datasets will be explored to evaluate the effectiveness
    of the developed models. Also, other optimization algorithms as PSO, GOA and BA
    will be used to determine their optimization effects on the LSTM model.

