    # V. CONCLUSION AND FUTURE DIRECTION


    In this paper, an optimized sentiment analysis using Population Optimization Algorithm
    (POA) and LSTM deep learning model. The learning rate and node size of the LSTM
    were tested on the customer''s sentences from a product from Amazon. Also, the
    population size of the algorithm was optimized. The result indicated that the
    optimized LSTM performed better in terms of accuracy, precision, recall and F1-score
    than the LSTM. The model optimized the optimal learning rate was found to be 0.02
    and an optimal node size of 37 was obtained using POA with 20 parallists. This
    showed that LSTM can perform better than unoptimized LSTM for sentiment analysis.
    Furthermore, the POA is capable of being used as parameter optimizer.


    In future, other sentiment datasets will be explored to evaluate the effectiveness
    of the developed models. Also, other optimization algorithms as PSO, GOA and BA
    will be used to determine their optimization effects on the LSTM model.'
