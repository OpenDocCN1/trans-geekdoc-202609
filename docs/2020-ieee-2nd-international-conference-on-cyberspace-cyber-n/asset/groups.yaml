    ## II. 相关工作


    ### A. 情感分析


    由于情感分析在生活各个领域的重要性，其研究在多年来不断增长。情感分析可以根据某些标准进行分类，包括：技术、使用的数据集结构和评分水平 [12]。图显示了情感分析的若干类别。实现情感分析的各种方式：


    i. 基于机器学习的：这涉及在部署之前使用现有数据集训练情感分析模型 [12]。


    ii. 基于规则的：从数据中提取信息，并尝试根据单词策略对其进行评估。有不同的规则，如否定词、成语、字典和情感 [13]。


    其部署是行的 [23]。深度学习能够处理有监督和无监督问题 [24]。卷积神经网络 (CNN)、深层信神经网络 (DBN) 和循环神经网络 (RNN) 都是解决语音识别、自然语言处理
    (NLP) 和人脸识别等计算机视觉等挑战性问题的常用深度学习模型。尽管取得了成功，但确定模型中的参数和隐藏层数量仍然是深度学习的最大挑战 [25]。


    情感分析是一个可以使用深度学习解决的挑战性问题。深度学习的特点包括处理排列在几层中的特征以转换和提取。[13] Wang 等人 [10] 提出了一种耦合与名词
    (DCAN) 神经模型。该技术的关键在于对情感的形容词和名词描述以及随后的情感分析。[11] 我们提出了一种基于 LSTM-CNN 的深度神经网络模型，它利用
    word2vec 和语言嵌入来成功分类情感或提取特征。


    在 [27] 中，双注意力-双 LSTM 改进了情感分析。性能遵循通过离散化从左右上下文获取的注意力来获得的范式。添加了许多方法来帮助合并关注焦点。在 [9]
    中，提出了一个 DNN 分别用于文档表示和情感分析。Ahmad 等人 [47] 提交了用于微博客和新闻分类的集成方法的分析。在 [8] 中，在分类其情感时提出了用户特征和偏好。


