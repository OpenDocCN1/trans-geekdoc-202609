    by the socio-cultural life style of pastoralist. It mimics the behaviour of pastoralist
    for quality pasture, environment for their livestock. In POA, the search agent
    is called the $i^{th}$ pastoralist and $\hat{P} ={\hat{P}_1, \hat{P}_2, \dots,
    \hat{P}_n\}$ where D is the domain of problem. The process is made up of two phases:
    scouting; pastoralist move with larger step size; and the best scout moves to
    camp. In the splitting phase, pastoralist move is characterized by shorter step
    size. Herding pastoralist to split to minimize local optimum entropy [20]. The
    initial location of the $i^{th}$ pastoralist is given in Equation (7) the location
    of the $j^{th}$ pastoralist is given in Equation (8) and the evolution continues
    until maximum criteria is reached [22].


