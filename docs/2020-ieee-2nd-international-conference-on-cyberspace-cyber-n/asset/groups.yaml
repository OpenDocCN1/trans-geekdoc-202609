    XXI. 停止


    ## B. 性能评估


    使用了准确率、精确率和 F1 分数指标来评估开发的 POA-LSTM 情感分析模型的性能。它们的数学表示如下：


    - 准确率 (Accuracy)


    这是所有识别样本占所有样本的比例，公式如下：


    ```

    Accuracy = \frac{TP + TN}{TP + FN + FP} \times 100% (13)

    ```


    - 精确率 (Precision)


    精确率是正确识别的数据比例，公式如下：


    ```

    Precision = \frac{TP}{TP + FP} \times 100% (14)

    ```


    - 召率 (Recall)


    这代表数据中所有样本中正确识别的正面情感。公式如下：


    ```

    Recall = \frac{TP}{TP + FN} \times 100% (15)

    ```


    - F1 分数 (F1 Score)


    公式如下：


    ```

    F1 = 2 \times \frac{Precision \cdot Recall}{Precision + Recall} (16)

    ```


    ## IV. 结果与讨论


    展示并讨论了所有执行的实验结果。图 6 显示了种群大小为 10、15、20 和 30 时 POA-LSTM 的收敛曲线。曲线表示了每个种群大小的最优适应度值和收敛速率。结果显示，当种群大小为
    20 时，算法收敛并获得 0.7736 的最优值，与其他种群大小相比，这是最佳值。当种群大小为 10、15 和 25 时，适应度值为 0.761，且当种群数量增加时降低到
