    # A. Proposed Model Implementation Steps


    Designed POA-LSTM and LSTM models by setting appropriate parameters of the LSTM
    model, such as number of epochs, learning rate, hidden nodes size, number of layers
    and sequences. The input model hidden nodes and learning rate are the two parameters
    that were optimized by POA. Also, the parameters of the POA, number of postiorist
    or population size was investigated.


    Six models were trained using 70% of the dataset and tested using the remaining
    data. The optimized POA-LSTM for 10, 15, 20, 25 and 30 hidden nodes, while the
    sixth model is the LSTM model. The fitness function (F) used by the algorithm
    for fitness estimation is the mean squared error given:


    ```

    F = \frac{TP + TN}{TP + FN + FP} (12)

    ```


    Where, TP, FP and FN stands for rightly identified sentiments, rightly identified
    negative sentiments, wrongly identified negative sentiments and wrongly identified
    positive sentiments. Fig. 5 represents the steps in implementing the developed
    POA-LSTM sentiment analysis.


