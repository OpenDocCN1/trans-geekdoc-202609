    # IV. RESULTS AND DISCUSSION


    The results for all experiments performed are presented and discussed. Fig 6 shows
    the convergence curves of the POA-LSTM for population size of 10, 15, 20, and
    30. The curve indicates the optimum fitness value and the rate for each population
    size. The result shows that at a population size of 20, the algorithm converges
    obtaining an optimum value of 0.7736 which is the best value compared to other
    population size. At population size of 10, 15 and 25, the fitness value is 0.761
    and reduces to 0.7484 when the population size was increased. The optimal learning
    rate and number of hidden nodes for 10, 15, 20 and 30 are; 0.01, 0.02, 0.18, 0.01-37,
    0.01-5 and 0.02-21 as shown in Table 1.


