    ## A. 提议模型的实现步骤


    通过设置 LSTM 模型的适当参数（如轮次数数、学习率、隐藏节点大小、层数和序列），设计了 POA-LSTM 和 LSTM 模型。输入模型的隐藏节点和学习率是经
    POA 优化的两个参数。此外，还研究了 POA 参数、后验数量或种群大小。


    使用数据集的 70% 训练了六个模型并使用剩余数据进行测试。针对 10、15、20、25 和 30 个隐藏节点优化了 POA-LSTM，而第六个模型是 LSTM
    模型。算法用于适应度估计的适应度函数（F）为给定均方误差：


    ```

    F = \frac{TP + TN}{TP + FN + FP} (12)

    ```


    其中，TP、FP 和 FN 分别代表正确识别的情感、正确识别的负面情感、错误识别的负面情感（注）。图 5 展示了开发的 POA-LSTM 情感分析的实现步骤。


    **算法 2：POA-LSTM 情感分析算法**

    输入：情感数据；LSTM 模型

