    (30) 为 83, 38, 24, 14。


    图 8 展示了开发的模型在图 7 混淆矩阵中获得的 TP、FP 和 FN 值计算出的性能指标上的结果。开发模型的准确率、精确率、召回率和 F1 分数如下：对于
    POA-LSTM (10)，值分别为 76.10%、79.21% 和 80.81%；POA-LSTM (15) 模型分别为 76.1%、85.57%、77.55%
    和 81.37%；POA-LSTM (20) 模型值分别为 77.6%、76.29%、85.09% 和 80.44%；POA-LSTM (25) 模型分别为
    76.10%、76.84%、83.51% 和 81%；POA-LSTM (30) 模型为 74.84%、78.79%、80.41% 和 79.59%。


    最后，使用 100 个节点训练的 LSTM 模型获得的准确率、召回率和 F1 分数分别为 71.62%、78.26%、73.44% 和 76.19%。POA-LSTM
    (20) 在准确率、精确率、召回率和 F1 分数上优于其他模型；而 POA-LSTM (15) 在准确率、召回率和 F1 分数方面表现更好。这归功于使用 POA
    优化器选择的最优参数训练 LSTM 模型。


