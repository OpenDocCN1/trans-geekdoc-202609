    $S_i = rand(L_i, U_i) \eta_i$ (7)

    $S''_j = (S_j - S_i) \zeta + \eta_j$ (8)

    $S''_j$ is the new location of the $j^{th}$ pastoralist, $P_i$ is the best pastoralist
    so far, $e$ is the energy of the $j^{th}$ pastoralist ($e \in \{-1,1\}$) and $\eta_j$
    is the step size of the $j^{th}$ pastoralist (\eta \in (0,0.001)$) and $\zeta$
    is a positive constant that represents the number of scouts moves faster than
