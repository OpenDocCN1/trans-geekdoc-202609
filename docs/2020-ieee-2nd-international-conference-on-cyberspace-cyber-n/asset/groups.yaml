    Accuracy, precision and f1 score metrics were used to evaluate the performance
    of the developed POA-LSTM sentiment analysis model. They are represented mathematically
    as:


    +   * Accuracy


    This is the ratio of all identified samples over all samples and is given:


    +   * TP / TN


    ```

    Accuracy = \frac{TP + TN}{TP + FN + FP} \times 100% (13)

