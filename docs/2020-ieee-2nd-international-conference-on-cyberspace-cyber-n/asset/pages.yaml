  md: 'sample of the cluster dataset obtained from amazon. After data collection,
    the users post be preprocessed to transform it from their raw into a form which
    enables machine algorithms to understand. Preprocessing also provides the opportunity
    to remove noise from the data which can give more accurate learning. The preprocessing
    steps are:


    +   * Removal of URLs

    * Elimination of all breaks

    * Tokenize the dataset (converting a sequence of strings into tokens/words with
    an de-identified meaning).


    After data preprocessing, the features required by the learning algorithm are
    extracted. There are two different approaches for text representation; word vector
    representation which represents each word in a document as a vector of N-dimensions.
    This approach does not capture semantic information the ways are arranged. It
    is only concerned with the occurrence of words. The second approach adopted in
    this paper is word embeddings.


    # A. Proposed Model Implementation Steps


    Designed POA-LSTM and LSTM models by setting appropriate parameters of the LSTM
    model, such as number of epochs, learning rate, hidden nodes size, number of layers
    and sequences. The input model hidden nodes and learning rate are the two parameters
    that were optimized by POA. Also, the parameters of the POA, number of postiorist
    or population size was investigated.


    Six models were trained using 70% of the dataset and tested using the remaining
    data. The optimized POA-LSTM for 10, 15, 20, 25 and 30 hidden nodes, while the
    sixth model is the LSTM model. The fitness function (F) used by the algorithm
    for fitness estimation is the mean squared error given:


    ```

    F = \frac{TP + TN}{TP + FN + FP} (12)

    ```


    Where, TP, FP and FN stands for rightly identified sentiments, rightly identified
    negative sentiments, wrongly identified negative sentiments and wrongly identified
    positive sentiments. Fig. 5 represents the steps in implementing the developed
    POA-LSTM sentiment analysis.


    Algorithm 2: POA-LSTM Sentiment. Analysis Algorithm

    Input: Sentiment data; LSTM model

    Output: Optimal sentiment; Best model


    +   I. Data collection and pre-processing

    II. Feature selection

    III. Feature extraction

    IV. LSTM design

    V. POA parameters initialization and population generation

    VI. Select parameters randomly and utilize scout location

    VII. Train and LSTM model

    VIII. Evaluate the fitness of each scout, scout location and normalize scores

    IX. Repeat the search space until stopping criterion is reached

    X. Select best scout location and posteriorization in the next

    XI. Train the best LSTM model using new locations

    XII. Evaluate the fitness of appropriate and best posterior location

    XIII. Repeat until no better location is found

    XIV. Train the best LSTM model using new locations

    XV. Evaluate the fitness of appropriate and best posterior location. For each
    scout, divide the curve range by the number of posteriorists

    XVI. If all regions within the search space have not been explored, XVII. Select
    a scout location

    XVIII. Repeat steps v-xi and update the global best posterior location

    IX. Else, return the global-best posterior

    XX. Return best model

    XXI. Stop


    # B. Performance Evaluation


    Accuracy, precision and f1 score metrics were used to evaluate the performance
    of the developed POA-LSTM sentiment analysis model. They are represented mathematically
    as:


    +   * Accuracy


    This is the ratio of all identified samples over all samples and is given:


    +   * TP / TN


    ```

    Accuracy = \frac{TP + TN}{TP + FN + FP} \times 100% (13)

    ```


    +   * Precision


    The precision is the fraction of data that were rightly identified and is given
    as:


    ```

    Precision = \frac{TP}{TP + FP} \times 100% (14)

    ```


    +   * Recall


    This represents the rightly identified positive sentiment over all samples in
    the data. It is given as:


    ```

    Recall = \frac{TP}{TP + FN} \times 100% (15)

    ```


    +   * F1 Score


    This is the given:


    ```

    F1 = 2 \times \frac{Precision \cdot Recall}{Precision + Recall} (16)

    ```'
