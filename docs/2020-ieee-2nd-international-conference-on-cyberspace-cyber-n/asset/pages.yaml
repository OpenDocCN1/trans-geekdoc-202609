  md: 'Pastoralist Optimization Algorithm (POA) is a novel heuristic method inspired
    by the socio-cultural life style of pastoralist. It mimics the behaviour of pastoralist
    for quality pasture, environment for their livestock. In POA, the search agent
    is called the $i^{th}$ pastoralist and $\hat{P} ={\hat{P}_1, \hat{P}_2, \dots,
    \hat{P}_n\}$ where D is the domain of problem. The process is made up of two phases:
    scouting; pastoralist move with larger step size; and the best scout moves to
    camp. In the splitting phase, pastoralist move is characterized by shorter step
    size. Herding pastoralist to split to minimize local optimum entropy [20]. The
    initial location of the $i^{th}$ pastoralist is given in Equation (7) the location
    of the $j^{th}$ pastoralist is given in Equation (8) and the evolution continues
    until maximum criteria is reached [22].


    ```

    $P_i = {P_1, P_2, \dots, P_n}$ (6)

    ```


    ```

    $S_i = rand(L_i, U_i) \eta_i$ (7)

    $S''_j = (S_j - S_i) \zeta + \eta_j$ (8)

    $S''_j$ is the new location of the $j^{th}$ pastoralist, $P_i$ is the best pastoralist
    so far, $e$ is the energy of the $j^{th}$ pastoralist ($e \in \{-1,1\}$) and $\eta_j$
    is the step size of the $j^{th}$ pastoralist (\eta \in (0,0.001)$) and $\zeta$
    is a positive constant that represents the number of scouts moves faster than
    herds. The best scout location ($S_0$) is initialized as the camp. Splitting by
    her herd size is marked using Equation (9) and after each split, the herd is divided.

    ```


    ```

    $P_k = P_k + rand(0, r) \times e * \eta_k$ (9)

    ```


    ```

    $r'' = rP$ (10)

    ```


    Where $r''$ is the new location of the $k^{th}$ pastoralist, $P_k$ is the best
    pastoralist so far, $r$ is a random number and $e$ is the energy of the $k^{th}$
    pastoralist ($e \in \{-1,1\}$) and $\eta_k$ is the step size of the $k^{th}$ pastoralist
    (\eta \in (0,0.001)$). Also, $r''$ is the camp radius of current iteration, and
    is the status of previous iteration. If all herds have been explored, and if all
    locations have been explored, the best camp is retained and the herd location
    is returned as the global optimum solution, so the process is repeated with the
    new scout location determined using Equation (11).

    $S''_i = rand(L_i, U_i) - S_i$


    Where $S''_i$ is the new location, $L_i$ and $U_i$ are the lower and upper limit
    of the search space respectively. POA was developed using evolutionary strategy
    and has been very successful when tested on numerical optimization and combinatorial
    optimization problems. Other variants of POA have been proposed [21]. Fig. 3 shows
    POA steps.


    # Algorithm 1: Pastoralist Optimization Algorithm

    Input: POA Parameters; Search space

    Output: Optimal Solution


    +   I. Start

    II. Initialize POA parameters

    III. Select pastoralist randomly and initialize scout location

    IV. Evaluate the fitness of each scout, update locations and normalize scouts
    locations within the search space until maximum criteria is reached

    V. Select best camp location

    VI. Evaluate of pastoralist and determine pastoralist within a camp

    VII. Split pastoralist to different locations within camp and fitness of pastoralist

    VIII. Repeat pastoralist until maximum iteration is reached. For each, divide
    the current camp by number of best pastoralist

    IX. Update location

    X If regions within the search space have not been explored, Update location

    X. Stop


