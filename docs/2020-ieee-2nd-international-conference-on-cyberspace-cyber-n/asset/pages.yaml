    **Abstract—** Users usually express their sentiment online regarding purchased
    products. The computational study of people''s feelings and thoughts towards entities
    is known as sentiment analysis. Long-Short-Term Memory (LSTM) is one of the most
    common deep learning models for solving sentiment analysis problems. However,
    they possess some drawbacks as long training time, memory cost and overfitting
    on generated parameters. Hence, there is a need to optimize LSTM parameters for
    enhanced sentiment analysis. This paper proposes a developed Pastoralist Optimization
    Algorithm (POA) for enhanced sentiment analysis. The model was used to analyze
    sentiments of customers retrieved from Amazon product reviews. The result shows
    an optimal accuracy, precision, recall and F1 measure of 77.36%, 86.50%, 76.29%,
    and 80.44% when compared with other models. It was also observed that 20 pastoralist
    population size performs better than other models with 10, 15, 25 and 30 population
    size.


    **Keywords—** Sentiment Analysis, Natural Language Processing (NLP), Deep Learning,
    Pastoralist Optimization Algorithm


    # I. INTRODUCTION


    In today''s world of high volume of information, data, values or opinions are
    being shared in the websites of social media or e-services in the raw of data.
    However to work with such raw data methods are required. This study describes
    peoples'' opinion concerning products, and other characteristics. Sentiment analysis
    is systematically identified, quantify and extract effective states and subjective
    information. It is used in Web, text data, and for information retrieval [1]–2],
    computer, social sciences and so on. To analyze sentiments, objects and characteristics,
    viewpoints holder, and direction are the three that are used. Sentiment Analysis
    involves some challenges such as object recognition, orientation classification,
    and feature


    Deep Learning (DL), an advanced machine learning model has solved some of the
    challenges brought about by lack of vocabulary resources and the improvement of
    sentiment classification in this field. DL has been successful in solving challenging
    problems in the field of artificial intelligence. Its success, determining the
    appropriate layers, number of variables a hidden size, still training is the greatest
    challenge of deep learning [25]. The algorithm has been very successful in solving
    combinatorial problems therefore is a good candidate for the DL models for sentiment
    analysis.


    In this paper, an optimized sentiment analysis model using deep learning (LSTM)
    and POA for was proposed. The model will be tested on datasets from social interactions
    of users. When developed, the model will implement sentiment analysis tasks by
    improving the LSTM model and present opportunity to analyze members and product
    from the opposite perspective. This makes the sentiment analysis an ideal tool
    for expanding product order and market business analysis


    The rest of the paper is organized as follows: The II section presents the works
    that are connected to the field. This comprises of sentiment analysis, review
    deep learning and POA. The methods and research objectives are presented. Section
    IV is a presentation of the expected results and Section V, the conclusion is
    presented.


