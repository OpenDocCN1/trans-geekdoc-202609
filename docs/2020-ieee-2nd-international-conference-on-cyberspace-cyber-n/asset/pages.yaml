  md: '# IV. RESULTS AND DISCUSSION


    The results for all experiments performed are presented and discussed. Fig 6 shows
    the convergence curves of the POA-LSTM for population size of 10, 15, 20, and
    30. The curve indicates the optimum fitness value and the rate for each population
    size. The result shows that at a population size of 20, the algorithm converges
    obtaining an optimum value of 0.7736 which is the best value compared to other
    population size. At population size of 10, 15 and 25, the fitness value is 0.761
    and reduces to 0.7484 when the population size was increased. The optimal learning
    rate and number of hidden nodes for 10, 15, 20 and 30 are; 0.01, 0.02, 0.18, 0.01-37,
    0.01-5 and 0.02-21 as shown in Table 1.


    The confusion matrices for the five POA-LSTM and LSTM models are shown in Fig.
    7. The matrix is a count of actual against predicted sentences. The matrix shows
    that; TP, TN, FP and FN are; 40, 81, 21, 17 for POA-LSTM (10), 83, 38, 24, 14
    for POA-LSTM (15), 74, 49, 13, 24 for POA-LSTM (20), 81, 40, 22, 16 for POA-LSTM
    (25), 78, 41, 21, 19 for POA-LSTM (30) and 83, 38, 24, 14 for LSTM (30).


    Fig. 8 presents the results of the developed model on the performance metrics
    calculated by the TP, FP and FN values obtained in the confusion matrices in Fig.
    7. The accuracy, precision, recall and F1 of the developed models are; for POA-LSTM
    (10), the values are 76.10%, 79.21%, and 80.81% respectively; for POA-LSTM (15)
    model are 76.1%, 85.57%, 77.55%, and 81.37% respectively; for POA-LSTM (20) model
    values are 77.6%, 76.29%, 85.09%, and 80.44% respectively; for POA-LSTM (25) model
    are 76.10%, 76.84%, 83.51%, and 81% respectively; POA-LSTM (30) model are 74.84%,
    78.79%, 80.41%, and 79.59%.


    Finally, the accuracy, recall, and F-score achieved by the LSTM model trained
    with 100 nodes are 71.62%, 78.26%, 73.44%, and 76.19% respectively. The POA-LSTM
    (20) is better than the other models based on the accuracy, precision, recall,
    and F-score. while POA-LSTM (15) outperforms other models in terms of accuracy,
    recall, and F-score. Overall, the optimized models perform better than the un-optimized
    LSTM model in terms of all of the metrics measured. This could be attributed to
    training the LSTM model with optimal parameters selected by the POA optimizer.


    ![](img/958604c68ccd723d8738236ae47572bc_4_0.png)


