    Import required libraries.


    1. from keras.applications.densenet import DenseNet201, preprocess\_input


    2. from keras.preprocessing import image


    3. from keras.preprocessing.image import ImageDataGenerator


    4. from keras.models import Model


    Set the hyper-parameters and image size details.


    5. img\_rows=224


    6. img\_cols=224


    7. channel=3


    8. epochs=25


    9. batch\_size=32


    Load a DenseNet model without the dense layer, which is also called classifier.


    10. DenseNet201 = DenseNet201(input\_shape=\[img\_rows, img\_cols, channel\],
    weights=‘imagenet’, include\_top=False)


    Basically, this step creates the model architecture similar to the DenseNet201
    architecture. Further, the trained weights on “imagenet” are also borrowed. Finally,
    with “include\_top=False”, the final dense layer is eliminated from the DenseNet201
    architecture.


    Now, the layers in the newly created architecture are made non-trainable.


    11. for layer in DenseNet201.layers:


    12. layer.trainable = False


    By making the layers of the model non-trainable, during the model training process,
    weights associated with these layers will not be updated, and the weights borrowed
    from “imagenet” will be used for the final model. This will reduce the training
    computational requirements drastically.


    Now, flatten the convolutional layer and convert the image representations into
    a 1D vector.


    13. x = Flatten()(DenseNet201.output)


    Finally, a dense layer is added to the architecture, with the number of output
    neurons equal to the number of folders in the dataset, which is equal to the number
    of classes. Softmax activation is used since it’s a multi-class classification
    problem.


    14. prediction = Dense(len(folders), activation=‘softmax’)(x)


    Create a model object with input as DenseNet201 model input, and output as the
    prediction layer output.


    15. model\_tl = Model(inputs=DenseNet201.input, outputs=prediction)


    Look at the final model summary.


    16. model\_tl.summary()


