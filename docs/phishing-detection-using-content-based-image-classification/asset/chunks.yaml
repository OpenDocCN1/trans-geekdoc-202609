    ### Summary


    In this chapter, we have observed how the same data points represented in higher-dimensional
    space are represented using lower dimensional planes of 50, 100 and 500 dimensions.
    Further, the new data points with lower dimensions will be fed into the classification
    model for performing the image classification task.


    # 7 Feature Fusion Techniques


    DOI: [10.1201/9781003217381-7](https://doi.org/10.1201/9781003217381-7)


    Features from images can be extracted using handcrafted techniques like HOG (Li
    et al., 2016), SURF (Bay et al., 2006), SIFT (Wu et al., 2013), DAISY (Tola et
    al., 2010), and so on. Features can be extracted using SOTA CNN models like Inception
    (Szegedy et al., 2015), RestNet (He et al., 2016), DenseNet (Huang et al., 2017),
    and so on. Now, these features are extracted from the same image, just that they
    are different representations of the same image extracted using different techniques.
    Every feature representation extracted from an image using various techniques
    has its own strength. Some representations can perform better than others when
    it comes to classifying images. In this chapter, we will see how we can fuse different
    image representations, to generate even more robust representations of an image.


    ## Structure


    In this chapter, we will cover the following topics:


    *   Basics of feature fusion technique


    *   Different combinations of image representations


    *   Different feature fusion approaches


    *   Classification model using fused features


    ## Objective


    After studying this chapter, you should be able to fuse features generated using
    different image representation techniques. You will be aware of how features can
    be fused in a combination of two and three different representations. Additionally,
    you will learn how to fuse features both horizontally and vertically. Finally,
    classification models will be created for all different fused features.


    ## Basics of Feature Fusion Technique


    Feature fusion (Gao & Chen, 2017) is a technique to concatenate the features extracted
    from the same image, but using different algorithms. In our study, since we will
    extract features from the same set of images using different CNN applications,
    we will experiment with fusing the features extracted from CNN applications, and
    evaluate if fusing the features extracted from different algorithms results in
    better performance as compared to results obtained from the individual CNN application
    features.


    In previous chapters, we extracted features from the CNN applications and used
    those features to build a classifier; hence we will experiment with fusion of
    these features. Features extracted from an image are basically a representation
    of the image. Using various techniques to extract features from the same image
    is basically different feature representations of the same image.


    Feature fusion is the technique to merge, either horizontally or vertically, the
    various representations of the image to form a different feature representation
    of the same image.


    We experimented with fusing features extracted using various CNN applications
    like VGGNet, ResNet, DenseNet, and so on. We fused the features formed after treating
    class imbalance using SMOTE (Chawla et al., 2002). Additionally, we also experimented
    with fusing features after dimensionality reduction using PCA.


    Since features extracted from different CNN models are of different dimensions,
    vertical fusion of those features cannot be performed. Hence, vertical fusion
    was performed only for PCA’d data, as we convert the features to the same dimensions
    while performing PCA. In our experiment, we reduced the dimensions of all the
    extracted features to 50, 100, 500 dimensions.


