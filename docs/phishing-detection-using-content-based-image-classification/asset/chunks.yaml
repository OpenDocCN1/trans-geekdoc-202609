    ### 总结


    在本章中，我们首先对图像进行增强，然后使用 VGGNet、DenseNet、ResNet 等最先进的卷积神经网络进行转移学习。还提供了 DenseNet 实现的
    Python 代码。此外，还给出了其他架构的实验结果，供在表中比较模型性能。后续章节将进行特征提取和表示学习，利用这些模型提取特征，并将提取的特征输入机器学习模型进行分类。最后，将创建并比较所有实验的性能指标，以选出表现最佳的模型。


    # 5 Feature Extraction and Representation Learning


    DOI: [10.1201/9781003217381-5](https://doi.org/10.1201/9781003217381-5)


    一个端到端的卷积神经网络由两个主要组成部分组成。卷积层对图像进行卷积并生成图像的各种表示。一旦这些向量表示被生成，它们将被输入分类层进行最终分类任务。分类层可以是机器学习模型或深度神经网络模型，具体取决于您的选择或实验结果。


    特征可以通过 SIFT (Wu et al., 2013)、SURF (Bay et al., 2006)、DAISY (Tola et al., 2010)
    等技术手动从图像中提取，或者可以通过已知卷积核、其权重已定义的方式手动卷积。此外，CNN 可以用于训练网络自动学习卷积核的最佳权重。


    ## 结构


    本章将涵盖以下主题：


    *   使用表示学习进行分类


    *   使用 SMOTE 处理类别失衡


    *   使用机器学习算法构建分类层


    *   评估各实验的性能


    ## 目标


    学习完本章后，您应能理解如何通过转移学习从图像中提取特征，其中使用 Inception (Szegedy et al., 2015)、ResNet (He
    et al., 2016)、DenseNet (Huang et al., 2017) 等最先进的卷积神经网络架构。此外，您还将学习如何将提取的特征（图像的向量表示）输入分类模型进行分类。最后，将创建并比较所有实验的性能指标，以选出表现最佳的模型。


    ## 使用表示学习进行分类


