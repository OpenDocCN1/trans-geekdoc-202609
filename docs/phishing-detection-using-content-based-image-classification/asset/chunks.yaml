    5. 为了在网站上尝试多种图像描述符，需要大量标记数据和巨大的资源容量来构建基于神经网络的高级分类模型，因为图像处理计算成本高昂。


    ## 技术比较


    根据文献综述，在防钓鱼技术中，尤其是像素级方法（本研究的重点），通常会探索三种不同的方法。


    1. 提取网站的各种特征，包括网页上的图像和文本，并基于预定义规则决定该网站是钓鱼网站还是非钓鱼网站。


    2. 从网站图像中提取基于图像的特征，并创建网站的视觉签名。根据比较结果决定该网站是钓鱼网站还是非钓鱼网站。


    3. 提取网站的图像特征，并将转换后的特征作为机器学习算法的输入，构建分类模型，以判断该网站是钓鱼网站还是非钓鱼网站。


    ## 使用图像处理技术进行防钓鱼检测的总结


