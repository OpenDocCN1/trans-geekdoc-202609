    ### Fusing PCA’d Features Horizontally Extracted from the Last Convolution Layer
    and Class Imbalance Treatment in a Combination of Two CNN Models


    Fusing PCA’d data will result in the same dimensional data for all the applications,
    since after PCA treatment of the data, all the feature arrays from different applications
    are now of the same dimension ([Figure 7.3](#c7.xhtml#f7.3)).


    ![FIGURE 7.3 Horizonal feature fusion of PCA treated data for two CNN applications.](images/fig7.3.jpg)


    **FIGURE 7.3** Horizonal feature fusion of PCA treated data for two CNN applications.


    For example, features are extracted from the Xception or VGG16 applications; after
    PCA the dimensions of the data are the same for both of them. In the case of reducing
    the dimensions to 50, both the arrays have 50 columns now.


    Hence, fusing them with each other will result in the same dimensional data for
    all applications. Additionally, since they are horizontally fused, the number
    of records will remain the same, in this case 6000, but the number of columns
    will be added based on the number of applications fused, which is 2 in this case.


