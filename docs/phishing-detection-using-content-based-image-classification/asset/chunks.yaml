    build a new model with different datasets. Basically, the whole architecture of
    the already built CNN application is reused, along with trained parameters such
    as weights, biases, kernels, and so on, without the need for retraining them for
    a new custom image dataset. This reduces the computational requirement of building
    a CNN application, and also allows the user to use tried-and-tested learned parameters
    for obtaining optimum results from a different set of images.


    ### Transfer the Learning up to the Last Fully Connected Layer


    In this approach, the transfer learning technique is utilized to classify images.
    As per Figure 4.1, trained images from the Phish-IRIS dataset are ingested into
    the CNN application using the transfer learning technique, with the final classification
    layer being replaced for classifying it among the 15 classes (Figure 4.1).


    ![FIGURE 4.1 Transfer learning end-to-end flow.](img/fig4.1.jpg)


    **FIGURE 4.1** Transfer learning end-to-end flow.


    ## Transfer Learning Implementation in Python


    Keras library comes with APIs to include various CNN architectures for a quick
    implementation of transfer learning in Python. Table 4.1 lists the API import
    statement for the CNN architectures.


    **TABLE 4.1** Keras API Import Statements for CNN Architectures


    | Architecture || Keras API |

    | --- | --- |

    | Xception || from keras.applications.xception import Xception |

    | --- | --- |

    | VGG16 || from keras.applications.vgg16 import VGG16 |

    | VGG19 || from keras.applications.vgg19 import VGG19 |

    | ResNet50 || from keras.applications.resnet50 import ResNet50 |

    | ResNet101 || from keras.applications.resnet import ResNet101 |

    | ResNet152 || from keras.applications.resnet import ResNet152 |

    | ResNet50V2 || from keras.applications.resnet_v2 import ResNet50V2 |

    | ResNet101V2 || from keras.applications.resnet_v2 import ResNet101V2 |

    | ResNet152V2 || from keras.applications.resnet_v2 import ResNet152V2 |

    | InceptionV3 || from keras.applications.inception_v3 import InceptionV3 |

    | InceptionResNetV2 || from keras.applications.inception_resnet_v2 import InceptionResNetV2
    |

    | MobileNet || from keras.applications.mobilenet import MobileNet |

    | MobileNetV2 || from keras.applications.mobilenet_v2 import MobileNetV2 |

    | DenseNet121 || from keras.applications.densenet import DenseNet121 |

    | DenseNet169 || from keras.applications.densenet import DenseNet169 |

    | DenseNet201 || from keras.applications.densenet import DenseNet201 |


    Import required libraries.


    1. `from keras.applications.densenet` import `DenseNet201`, `preprocess_input`


    2. `from keras.preprocessing` import `image`


    3. `from keras.preprocessing.image` import `ImageDataGenerator`


    4. `from keras.models` import `Model`


    Set the hyper-parameters and image size details.


    5. `img_rows`=224


    6. `img_cols`=224


    7. `channel`=3


    8. `epochs`=25


    9. `batch_size`=32


    Load a DenseNet model without the dense layer, which is also called classifier.


    10. `DenseNet201` = `DenseNet201`(input_shape=[`img_rows`, `img_cols`, `channel`],
    weights=''imagenet'', include_top=False)


    Basically, this step creates the model architecture similar to the DenseNet201
    architecture. Further, the trained weights on “imagenet” are also borrowed. Finally,
    with “include_top=False”, the final dense layer is eliminated from the DenseNet201
    architecture.


    Now, the layers in the newly created architecture are made non-trainable.


    11. `for` layer in `DenseNet201`.layers:


    12. `layer`.`trainable` = False


    By making the layers of the model non-trainable, during the model training process,
    weights associated with these layers will not be updated, and the weights borrowed
    from “imagenet” will be used for the final model. This will reduce the training
    computational requirements drastically.


    Now, flatten the convolutional layer and convert the image representations into
    a 1D vector.


    13. `x` = `Flatten`()( `DenseNet201`.output)


    Finally, a dense layer is added to the architecture, with the number of output
    neurons equal to the number of folders in the dataset, which is equal to the number
    of classes. Softmax activation is used since it’s a multi-class classification
    problem.


    14. `prediction` = `Dense`(len(folders), activation=''softmax'')(x)


    Create a model object with input as `DenseNet201` model input, and output as the
    prediction layer output.


    15. `model_tl` = `Model`(inputs=`DenseNet201`.input, outputs=`prediction`)


    Look at the final model summary.


    16. `model_tl`.summary()


    Since `DenseNet` is a very deep model, only the last few layers of the model and
    the trainable parameter description are displayed.


    ![](img/inline4.1.jpg)


    It can be seen that the total parameters in the model are 19,733,199, but the
    trainable parameters are only 14,11,215. This is because other than the last dense
    layer, all other layers are non-trainable.

