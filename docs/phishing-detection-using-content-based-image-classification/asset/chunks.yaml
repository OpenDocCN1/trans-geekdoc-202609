    ## Performance Metrics


    This is a multi-classification problem where we intend to classify brands of the
    14 phishing websites and one class for legitimate websites.


    To derive the performance metrics of a multi-class classification problem, let’s
    first understand the performance metrics for any binary classification problem.


    For the binary classification task, we will consider images in all the brand folders
    as “phish”, meaning positive class, and images in the “other” folder as “not-phish”,
    meaning negative class.


    Upon building a confusion matrix for binary classification results, we can see
    all the possible combinations for the two-class classification (binary) problem
    as depicted in [Table 3.3](#c3.xhtml#t3.3).


    **TABLE 3.3** Confusion Matrix for Binary Classification


    |   || Predicted Phishing || Predicted Legitimate |


    | --- | --- | --- |


    | Actual phishing || TP || FN |


    | --- | --- | --- |


    | Actual legitimate || FP || TN |


    To understand this, let’s first understand TN, TP, FN and FP in the phishing detection
    context.


    *   TN (True Negative) – Number of “not-phish” (legitimate) websites classified
    as “not-phish”.


    *   FN (False Negative) – Number of “not-phish” (legitimate) websites classified
    as “phish”.


    *   FP (False Positive) – Number of “phish” websites classified as “not-phish”
    (legitimate).


    *   TP (True Positive) – Number of “phish” websites classified as “phish”.


    For the phishing detection binary classification, it would be important to consider
    the following:


    1.  Rate of correct classifications, that is, phishing websites classified as
    “phish” and legitimate websites classified as “not-phish”, which as per definition
    is the accuracy of the classifier.


    2.  Rate of phishing websites that the classifier is able to classify among the
    total phishing websites in the dataset, which as per the definition is TPR.


    3.  Rate of legitimate websites that the classifier classifies as “phish”, which
    as per definition is FPR.


    Hence, for such kinds of binary classification, we need to consider accuracy,
    TPR, FPR and F1 score.

