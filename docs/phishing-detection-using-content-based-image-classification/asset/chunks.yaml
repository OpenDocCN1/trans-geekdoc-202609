- raw: 'However, if computers are enabled to drive a car, such as in the case of self-driving
    cars, they are able to not only match but also far surpass human capabilities.
    It is because computers can have a 360-degree view of the road, see blind spots,
    and so on, which we cannot replicate.


    Now, meeting and surpassing human vision capabilities are good, but training the
    computers to interpret something that human eyes simply cannot, like detecting
    a phishing website rather than a legitimate one, is better. Human eyes can be
    deceived by phishing websites since they look absolutely similar to their legitimate
    counterparts. Hence, humans get easily trapped in phishing attacks, but using
    computer vision techniques, we can train the computer to extract features from
    the image of the phishing website, and train a model to differentiate a phishing
    website from a legitimate one.


    ## Structure


    In this chapter, we will cover the following topics:


    *   Basics of digital image processing


    *   Basics of extracting features using OpenCV


    ## Objective


    After studying this chapter, you should be aware of the basics of digital image
    processing. You will be familiar with image filtering concepts and how to extract
    relevant features from images for further processing.


    ## Basics of Digital Image Processing


    To understand digital image processing, it’s imperative to first understand what
    a digital image is. When an image is captured, certain information about the object
    in the image is captured by the camera or a similar device that can capture the
    image. When the image is processed, the information captured is extracted and
    then processed.


    ### What Is a Digital Image?


    A picture element, usually called “pixels”, is the smallest element of a digital
    image. An image is an arrangement of pixels in n dimensions.


    There are two color schemes in an image:


    1.  Grayscale image


    2.  RGB (color) image


    Grayscale images are what we call black and white images. In such images, each
    pixel has only one layer. And each pixel has a number associated with it. If it’s
    an 8-bit pixel, the number ranges from 0 to 255. And the number represents intensity,
    for example the greater the number, the more the intensity. Hence, 0 represents
    black, and 255 represents white. Hence, a grayscale image can be represented by
    a single matrix.


    For an RGB image, each pixel has three layers. One layer for red, one for green
    and one for blue. All other colors can be created by adding these three colors
    in different intensities. Hence, every pixel in an image can be represented with
    three numbers in each layer of RGB. And hence a color image can be represented
    by three matrices, one for each layer, with different intensities for each color.


    Based on this understanding, if a pixel is defined as a tuple of three elements,
    wherein the first element is the intensity of red in a pixel, the second element
    is the intensity of green in a pixel and the third element is the intensity of
    blue in a pixel, then a pixel which is red in color can be defined as (255,0,0),
    which means that the intensity of red is 255 and the intensities of green and
    blue are 0. Hence, this pixel is pure red. Similarly, a pure green pixel can be
    defined as (0,255,0), and a pure blue pixel can be defined as (0,0,255) ([Figure
    9.1](#c9.xhtml#f9.1)).


    ![FIGURE 9.1 Pixel layers within digital images.](images/fig9.1.jpg)


    **FIGURE 9.1** Pixel layers within digital images.


    Since an image is a collection of pixels, every image can be defined as a matrix
    of pixel values. To understand this better, look at [Figure 9.2](#c9.xhtml#f9.2).


    ![FIGURE 9.2 Pixel representation of a greyscale image.](images/fig9.2.jpg)


    **FIGURE 9.2** Pixel representation of a greyscale image.


    As you can see, what we see as a whole image, the computer sees as a pixel representation.
    The number in the pixel representation is the intensity of white in that particular
    pixel in the image. Since it’s a grayscale image, there is just one channel, and
    hence one number in that pixel position. In the case of a color image, there will
    be three numbers in each pixel position, representing the intensity of red, blue
    and green in their respective channels.


    ### Loading and Displaying Images


    The first and foremost thing to be done for a computer to process the image is
    to load the image in the computer memory, which basically means loading the matrix
    holding the pixel values of the image into the memory.


    To do so, let’s first import the required libraries.


    1. from matplotlib import pyplot as plt


    2. import cv2


    Read the image using the imread method in the opencv library.


    3. image\_loc=“einstein.png”


    4. image = cv2.imread(image\_loc)


    5. image.shape


    Note the shape of the image, which is represented as (height, width, channel),
    which means height at index 0, width at index 1 and channel at index 2.


    (1034, 968, 3)


    Hence, the image is read as a matrix of size (1034, 968), which basically means
    that the image has a height of 1034 pixels and a width of 968 pixels, and there
    are three such matrices, one for each channel of RGB. To understand it better,
    let’s plot the image and check the height and the width along the x and y axes.


    But before we plot the image, let’s first understand a small caveat related to
    the opencv imread module. When the image is read using the imread module, the
    matrix loaded in the image object is loaded as a numpy array.


    This array has 1034 rows, which is the height of the image.


    1. print(len(image))


    1034


    If we just look at the first row of this matrix, it will contain 968 columns,
    which is the width of the image.


    1. print(len(image\[0\]))


    968


    Hence, an individual pixel will represent three values, one for each RGB channel.


    1. image\[0\]\[0\]


    array(\[30, 31, 29\], dtype=uint8)


    However, the opencv library by default reads the image as BGR channel. So, the
    pixel value represented above basically means that the first pixel of the image
    has the value of 30 in the blue channel, 31 in the green channel and 29 in the
    red channel.


    Hence, for further processing, there is a need to correct this channel values
    setting in the numpy array, which holds the image pixel values, which is done
    using the below code line.


    1. image = cv2.cvtColor(image, cv2.COLOR\_BGR2RGB)


    Now, if we check the pixel values representation with the array, it will show
    in the RGB format, which means that the pixel values of each channel remain the
    same, but they are arranged differently. Earlier it was \[B = 30, G = 31, R =
    29\] and after conversion it became \[R = 29, G = 31, B = 30\].


    1. image\[0\]\[0\]


    array(\[29, 31, 30\], dtype=uint8)


    Let’s now plot the image to check the pixel arrangements in the x and y axes ([Figure
    9.3](#c9.xhtml#f9.3)).


    ![FIGURE 9.3 Pixel representation of a digital image.](images/fig9.3.jpg)


    **FIGURE 9.3** Pixel representation of a digital image.


    2. plt.imshow(image)


    3. plt.title(“Einstein”)


    4. plt.grid(False)


    5. plt.show()


    So, we can see that the image has 1034 pixels vertically along the y axis, which
    is termed as height, and 968 pixels horizontally along the x axis, which is termed
    as width, and at every pixel there are three values, one value for the red channel,
    one value for the green channel and one value for the blue channel.


    Hence, the total number of pixel values across the three channels of the image
    is equal to


    *   1034 × 968 × 3 = 30,02,736


    So, what a human eye sees as just an image, a computer sees as 30,02,736 numbers
    arranged in a defined order.


