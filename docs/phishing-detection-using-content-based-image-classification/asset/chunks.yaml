- raw: "For a Phish-IRIS dataset, as can be seen in [Table 3.1](#c3.xhtml#t3.1), the\
    \ number of images available for the “other” class is 400, whereas images available\
    \ for all the rest of the classes is in the range of 50–150. This is clearly an\
    \ imbalanced distribution of the data in individual classes. Hence, the data must\
    \ be treated for the class imbalance before being used for the model training\
    \ purpose.\n\n#### Adding Synthetic Data Using SMOTE\n\nThe imbalanced dataset\
    \ is handled by either undersampling the majority class or oversampling the majority\
    \ class. Both approaches have their own pros and cons. Among the more advanced\
    \ techniques which are widely used for class imbalance treatment is the Synthetic\
    \ Minority Over-sampling Technique (SMOTE).\n\nThis technique, proposed by Chawla\
    \ et al. (2002), works by first placing all the data points of the dataset in\
    \ the n-dimensional plane, and then using the K-nearest neighbor algorithm, by\
    \ which it generates synthetic data points for the minority class.\n\nSince, for\
    \ a multi-class classification, the maximum number of records for a given class,\
    \ in this case the “other” class, is 400, synthetic data will need to be added\
    \ to all the other classes to make their numbers 400. Since there are 15 classes\
    \ in total, after applying the oversampling technique of SMOTE the total number\
    \ of records in each class will become 400, making the total number of training\
    \ data 6000, that is 400 × 15.\n\n[Table 5.3](#c5.xhtml#t5.3) demonstrates the\
    \ training data array dimensions after applying SMOTE for various CNN applications.\n\
    \n**TABLE 5.3** Training Data Dimensions after Applying SMOTE\n\n| Application\
    \ || Image Size  \n\n(128, 128, 3)  \n\n || Image Size  \n\n(256, 256, 3)  \n\n\
    \ |\n\n| --- | --- | --- |\n\n| Xception || (6000, 32768) || (6000, 131072) |\n\
    \n| --- | --- | --- |\n\n| VGG16 || (6000, 8192) || (6000, 32768) |\n\n| VGG19\
    \ || (6000, 8192) || (6000, 32768) |\n\n| ResNet50V2 || (6000, 32768) || (6000,\
    \ 131072) |\n\n| ResNet101V2 || (6000, 32768) || (6000, 131072) |\n\n| ResNet152V2\
    \ || (6000, 32768) || (6000, 131072) |\n\n| InceptionV3 || (6000, 8192) || (6000,\
    \ 73728) |\n\n| InceptionResNetV2 || (6000, 6144) || (6000, 55296) |\n\n| MobileNet\
    \ || (6000, 16384) || (6000, 65536) |\n\n| MobileNetV2 || (6000, 20480) || (6000,\
    \ 81920) |\n\n| DenseNet121 || (6000, 16384) || (6000, 65536) |\n\n| DenseNet169\
    \ || (6000, 26624) || (6000, 106496) |\n\n| DenseNet201 || (6000, 30720) || (6000,\
    \ 122880) |\n\n## SMOTE Python Implementation\n\nInput data will be the features\
    \ extracted in the previous stage using various CNN architectures.\n\n1. SIZE=512\n\
    \n2. data\\_dir=“../feature\\_extractor/last\\_layer/”+str(SIZE)+”/”\n\n3. out\\\
    _dir=“last\\_layer/”+str(SIZE)+”/”\n\nWe will create a Python list with all the\
    \ CNN architectures to extract the image features.\n\n1. list\\_of\\_architectures\
    \ = \\[\n\n2.   “Xception”,\n\n3\\.    “VGG16”,\n\n4\\.    “VGG19”,\n\n5\\.   \
    \ “ResNet50”,\n\n6\\.    “ResNet101”,\n\n7\\.    “ResNet152”,\n\n8\\.    “ResNet50V2”,\n\
    \n9\\.    “ResNet101V2”,\n\n10\\.   “ResNet152V2”,\n\n11\\.   “InceptionV3”,\n\
    \n12\\.   “InceptionResNetV2”,\n\n13\\.   “MobileNet”,\n\n14\\.   “MobileNetV2”,\n\
    \n15\\.   “DenseNet121”,\n\n16\\.   “DenseNet169”,\n\n17\\.   “DenseNet201”\n\n\
    18.\n\n19.\\]\n\nThe below function will load the features extracted by the respective\
    \ CNN architecture, and then will apply the SMOTE algorithm to produce synthetic\
    \ data points for the classes that are less in number with respect to other dominant\
    \ classes in the dataset.\n\nFor example, the “other” class has 400 images, and\
    \ that is the most dominant number of images for a particular class in the dataset.\
    \ So, synthetic images will be created for all other classes so that the final\
    \ number of images for each class will become 400. So, the “PayPal” class has\
    \ 121 images, hence 279 synthetic images will be generated for the “PayPal” class.\
    \ And the same will be followed for all other classes.\n\n1. def getSMOTE(model):\n\
    \n2\\.      X\\_SMOTE = np.load(data\\_dir+model+”\\_train\\_images.npy”)\n\n\
    3\\.        y\\_train = np.load(data\\_dir+’/train\\_labels.npy’)\n\n4.\n\n5\\\
    .         *\\# SMOTE*\n\n6\\.         from imblearn.over\\_sampling import SMOTE\n\
    \n7\\.         oversample = SMOTE()\n\n8\\.      X\\_train\\_SMOTE, y\\_train\\\
    _SMOTE = oversample.fit\\_resample(X\\_SMOTE, y\\_train)\n\n9.\n\n10\\.   np.save(out\\\
    _dir+model+”\\_X\\_train\\_SMOTE”, X\\_train\\_SMOTE)\n\n11.     np.save(out\\\
    _dir+model+”\\_y\\_train\\_SMOTE”, y\\_train\\_SMOTE)\n\nNow, the above function\
    \ is called iteratively for all the CNN architectures using the list which is\
    \ created before.\n\n1. for arch in list\\_of\\_architectures:\n\n2\\. getSMOTE(arch)\n\
    \nAt the end of the loop, all the features extracted using various CNN architectures\
    \ will have an augmented number of datapoints.\n\n## Machine Learning Classifier\n\
    \nFeatures extracted from all the CNN architectures are then ingested into the\
    \ machine learning classifiers as a multi-class classification problem.\n\nCreate\
    \ a list of all CNN architectures for which we have extracted features and want\
    \ to build a classifier.\n\n1. list\\_of\\_architectures = \\[\n\n2.    “Xception”,\n\
    \n3.    “VGG16”,\n\n4.    “VGG19”,\n\n5.    “ResNet50”,\n\n6.    “ResNet101”,\n\
    \n7.    “ResNet152”,\n\n8.    “ResNet50V2”,\n\n9.    “ResNet101V2”,\n\n10.   “ResNet152V2”,\n\
    \n11.   “InceptionV3”,\n\n12.   “InceptionResNetV2”,\n\n13.   “MobileNet”,\n\n\
    14.   “MobileNetV2”,\n\n15.   “DenseNet121”,\n\n16.   “DenseNet169”,\n\n17.  \
    \ “DenseNet201”\n\n18.\n\n19.\\]\n\nCreate a list of machine learning algorithms\
    \ that we will use to build a classifier.\n\n1. list\\_of\\_classifiers = \\[\n\
    \n2\\.    “RF”,\n\n3\\.    “SVM”\n\n4.\\]\n\nCreate a list of sizes for which\
    \ images are resized and features extracted.\n\n1. list\\_of\\_size = \\[\n\n\
    2.    128,\n\n3\\.    256,\n\n4\\.    512\n\n5.\\]\n\nSet some variables.\n\n\
    1. layer = ”last\\_layer”\n\n2. preprocessing\\_technique = ”smote”\n\nCreate\
    \ a reusable data reading function.\n\n1. def getData(model, image\\_size):\n\n\
    2.     train\\_data\\_dir=“../class\\_imabalance/” + layer + ”/” + str(image\\\
    _size)+”/”\n\n3.     test\\_data\\_dir=“../feature\\_extractor/” + layer + ”/”\
    \ + str(image\\_size)+”/”\n\n4.     X\\_train=np.load(train\\_data\\_dir+model+”\\\
    _X\\_train\\_SMOTE.npy”)\n\n5.     y\\_train=np.load(train\\_data\\_dir+model+”\\\
    _y\\_train\\_SMOTE.npy”)\n\n6\\.     X\\_test=np.load(test\\_data\\_dir+model+”\\\
    _test\\_images.npy”)\n\n7\\.     y\\_test=np.load(test\\_data\\_dir+”test\\_labels.npy”)\n\
    \n8\\.     return X\\_train, y\\_train, X\\_test, y\\_test\n\nCreate a reusable\
    \ label encoder reader function.\n\n1. def getLabelEncoder(layer, image\\_size):\n\
    \n2\\.   label\\_encoder\\_location = ”../feature\\_extractor/” + layer + ”/”\
    \ + str(image\\_size)+”/”\n\n3\\.   label\\_encoder = np.load(label\\_encoder\\\
    _location+’label\\_encoder.npy’)\n\n4\\.   return label\\_encoder\n\nCreate a\
    \ reusable function.\n\n1. def getClassificationMetrics(test\\_labels, prediction):\n\
    \n2.   from sklearn.metrics import confusion\\_matrix\n\n3.   test\\_label\\_list=list(np.unique(test\\\
    _labels))\n\n4.   cnf\\_matrix = confusion\\_matrix(test\\_labels, prediction,labels=test\\\
    _label\\_list)\n\n5\\.   np.set\\_printoptions(precision=2)\n\n6.\n\n7\\.   *\\\
    # Plot non-normalized confusion matrix*\n\n8.   plt.figure(figsize=(8,8))\n\n\
    9\\.   plot\\_confusion\\_matrix(cnf\\_matrix, classes=test\\_label\\_list,\n\n\
    10\\.   title=‘Confusion matrix, without normalization’)\n\n11.\n\n12.\n\n13\\\
    .    from sklearn import metrics\n\n14.\n\n15\\.    accuracy = round(metrics.accuracy\\\
    _score(test\\_labels, prediction),3)\n\n16\\.    precision = round(metrics.precision\\\
    _score(test\\_labels, prediction, average=‘weighted’),3)\n\n17\\.    recall =\
    \ round(metrics.recall\\_score(test\\_labels, prediction, average=‘weighted’),3)\n\
    \n18\\.    f1\\_score = round(metrics.f1\\_score(test\\_labels, prediction, average=‘weighted’),3)\n\
    \n19.\n\n20.\n\n21\\.    FP = cnf\\_matrix.sum(axis=0) - np.diag(cnf\\_matrix)\n\
    \n22\\.    FN = cnf\\_matrix.sum(axis=1) - np.diag(cnf\\_matrix)\n\n23\\.    TP\
    \ = np.diag(cnf\\_matrix)\n\n24\\.    TN = cnf\\_matrix.sum() - (FP + FN + TP)\n\
    \n25.\n\n26\\.    *\\# Sensitivity, hit rate, recall, or true positive rate*\n\
    \n27\\.    TPR = round((TP/(TP+FN)).mean(),3)\n\n28\\.    *\\# Specificity or\
    \ true negative rate*\n\n29\\.    TNR = round((TN/(TN+FP) ).mean(),3)\n\n30\\\
    .    *\\# Precision or positive predictive value*"
  fmt: "\nFor a Phish-IRIS dataset, as can be seen in [Table 3.1](#c3.xhtml#t3.1),\
    \ the number of images available for the “other” class is 400, whereas images\
    \ available for all the rest of the classes is in the range of 50–150. This is\
    \ clearly an imbalanced distribution of the data in individual classes. Hence,\
    \ the data must be treated for the class imbalance before being used for the model\
    \ training purpose.\n\n### Adding Synthetic Data Using SMOTE\n\nThe imbalanced\
    \ dataset is handled by either undersampling the majority class or oversampling\
    \ the majority class. Both approaches have their own pros and cons. Among the\
    \ more advanced techniques which are widely used for class imbalance treatment\
    \ is the Synthetic Minority Over-sampling Technique (SMOTE).\n\nThis technique,\
    \ proposed by Chawla et al. (2002), works by first placing all the data points\
    \ of the dataset in the n-dimensional plane, and then using the K-nearest neighbor\
    \ algorithm, by which it generates synthetic data points for the minority class.\n\
    \nSince, for a multi-class classification, the maximum number of records for a\
    \ given class, in this case the “other” class, is 400, synthetic data will need\
    \ to be added to all the other classes to make their numbers 400. Since there\
    \ are 15 classes in total, after applying the oversampling technique of SMOTE\
    \ the total number of records in each class will become 400, making the total\
    \ number of training data 6000, that is 400 × 15.\n\n[Table 5.3](#c5.xhtml#t5.3)\
    \ demonstrates the training data array dimensions after applying SMOTE for various\
    \ CNN applications.\n\n**TABLE 5.3** Training Data Dimensions after Applying SMOTE\n\
    \n| Application || Image Size  \n\n(128, 128, 3)  \n\n || Image Size  \n\n(256,\
    \ 256, 3)  \n\n |\n\n| --- | --- | --- |\n\n| Xception || (6000, 32768) || (6000,\
    \ 131072) |\n\n| --- | --- | --- |\n\n| VGG16 || (6000, 8192) || (6000, 32768)\
    \ |\n\n| VGG19 || (6000, 8192) || (6000, 32768) |\n\n| ResNet50V2 || (6000, 32768)\
    \ || (6000, 131072) |\n\n| ResNet101V2 || (6000, 32768) || (6000, 131072) |\n\n\
    | ResNet152V2 || (6000, 32768) || (6000, 131072) |\n\n| InceptionV3 || (6000,\
    \ 8192) || (6000, 73728) |\n\n| InceptionResNetV2 || (6000, 6144) || (6000, 55296)\
    \ |\n\n| MobileNet || (6000, 16384) || (6000, 65536) |\n\n| MobileNetV2 || (6000,\
    \ 20480) || (6000, 81920) |\n\n| DenseNet121 || (6000, 16384) || (6000, 65536)\
    \ |\n\n| DenseNet169 || (6000, 26624) || (6000, 106496) |\n\n| DenseNet201 ||\
    \ (6000, 30720) || (6000, 122880) |\n\n### SMOTE Python Implementation\n\nInput\
    \ data will be the features extracted in the previous stage using various CNN\
    \ architectures.\n\n1. SIZE=512\n\n2. data_dir=“../feature_extractor/last_layer/”+str(SIZE)+”/”\n\
    \n3. out_dir=“last_layer/”+str(SIZE)+”/”\n\nWe will create a Python list with\
    \ all the CNN architectures to extract the image features.\n\n1. list_of_architectures\
    \ = [\n\n2. “Xception”,\n\n3. “VGG16”,\n\n4. “VGG19”,\n\n5. “ResNet50”,\n\n6.\
    \ “ResNet101”,\n\n7. “ResNet152”,\n\n8. “ResNet50V2”,\n\n9. “ResNet101V2”,\n\n\
    10. “ResNet152V2”,\n\n11. “InceptionV3”,\n\n12. “InceptionResNetV2”,\n\n13. “MobileNet”,\n\
    \n14. “MobileNetV2”,\n\n15. “DenseNet121”,\n\n16. “DenseNet169”,\n\n17. “DenseNet201”\n\
    \n18.\n\n19.\n\nThe below function will load the features extracted by the respective\
    \ CNN architecture, and then will apply the SMOTE algorithm to produce synthetic\
    \ data points for the classes that are less in number with respect to other dominant\
    \ classes in the dataset.\n\nFor example, the “other” class has 400 images, and\
    \ that is the most dominant number of images for a particular class in the dataset.\
    \ So, synthetic images will be created for all other classes so that the final\
    \ number of images for each class will become 400. So, the “PayPal” class has\
    \ 121 images, hence 279 synthetic images will be generated for the “PayPal” class.\
    \ And the same will be followed for all other classes.\n\n1. def getSMOTE(model):\n\
    \n2. X_SMOTE = np.load(data_dir+model+”_train_images.npy”)\n\n3. y_train = np.load(data_dir+’/train_labels.npy’)\n\
    \n4.\n\n5. # SMOTE\n\n6. from imblearn.over_sampling import SMOTE\n\n7. oversample\
    \ = SMOTE()\n\n8. X_train_SMOTE, y_train_SMOTE = oversample.fit_resample(X_SMOTE,\
    \ y_train)\n\n9.\n\n10. np.save(out_dir+model+”_X_train_SMOTE”, X_train_SMOTE)\n\
    \n11. np.save(out_dir+model+”_y_train_SMOTE”, y_train_SMOTE)\n\nNow, the above\
    \ function is called iteratively for all the CNN architectures using the list\
    \ which is created before.\n\n1. for arch in list_of_architectures:\n\n2. getSMOTE(arch)\n\
    \nAt the end of the loop, all the features extracted using various CNN architectures\
    \ will have an augmented number of datapoints.\n\n### Machine Learning Classifier\n\
    \nFeatures extracted from all the CNN architectures are then ingested into the\
    \ machine learning classifiers as a multi-class classification problem.\n\nCreate\
    \ a list of all CNN architectures for which we have extracted features and want\
    \ to build a classifier.\n\n1. list_of_architectures = [\n\n2. “Xception”,\n\n\
    3. “VGG16”,\n\n4. “VGG19”,\n\n5. “ResNet50”,\n\n6. “ResNet101”,\n\n7. “ResNet152”,\n\
    \n8. “ResNet50V2”,\n\n9. “ResNet101V2”,\n\n10. “ResNet152V2”,\n\n11. “InceptionV3”,\n\
    \n12. “InceptionResNetV2”,\n\n13. “MobileNet”,\n\n14. “MobileNetV2”,\n\n15. “DenseNet121”,\n\
    \n16. “DenseNet169”,\n\n17. “DenseNet201”\n\n18.\n\n19.\n\nCreate a list of machine\
    \ learning algorithms that we will use to build a classifier.\n\n1. list_of_classifiers\
    \ = [\n\n2. “RF”,\n\n3. “SVM”\n\n4.\n\n]\n\nCreate a list of sizes for which images\
    \ are resized and features extracted.\n\n1. list_of_size = [\n\n2. 128,\n\n3.\
    \ 256,\n\n4. 512\n\n5.\n\n]\n\nSet some variables.\n\n1. layer = ”last_layer”\n\
    \n2. preprocessing_technique = ”smote”\n\nCreate a reusable data reading function.\n\
    \n1. def getData(model, image_size):\n\n2. train_data_dir=“../class_imabalance/”\
    \ + layer + ”/” + str(image_size)+”/”\n\n3. test_data_dir=“../feature_extractor/”\
    \ + layer + ”/” + str(image_size)+”/”\n\n4. X_train=np.load(train_data_dir+model+”_X_train_SMOTE.npy”)\n\
    \n5. y_train=np.load(train_data_dir+model+”_y_train_SMOTE.npy”)\n\n6. X_test=np.load(test_data_dir+model+”_test_images.npy”)\n\
    \n7. y_test=np.load(test_data_dir+”test_labels.npy”)\n\n8. return X_train, y_train,\
    \ X_test, y_test\n\nCreate a reusable label encoder reader function.\n\n1. def\
    \ getLabelEncoder(layer, image_size):\n\n2. label_encoder_location = ”../feature_extractor/”\
    \ + layer + ”/” + str(image_size)+”/”\n\n3. label_encoder = np.load(label_encoder_location+’label_encoder.npy’)\n\
    \n4. return label_encoder\n\nCreate a reusable function.\n\n1. def getClassificationMetrics(test_labels,\
    \ prediction):\n\n2. from sklearn.metrics import confusion_matrix\n\n3. test_label_list=list(np.unique(test_labels))\n\
    \n4. cnf_matrix = confusion_matrix(test_labels, prediction,labels=test_label_list)\n\
    \n5. np.set_printoptions(precision=2)\n\n6.\n\n7. # Plot non-normalized confusion\
    \ matrix\n\n8. plt.figure(figsize=(8,8))\n\n9. plot_confusion_matrix(cnf_matrix,\
    \ classes=test_label_list,\n\n10. title=‘Confusion matrix, without normalization’)\n\
    \n11.\n\n12.\n\n13. from sklearn import metrics\n\n14.\n\n15. accuracy = round(metrics.accuracy_score(test_labels,\
    \ prediction),3)\n\n16. precision = round(metrics.precision_score(test_labels,\
    \ prediction, average=‘weighted’),3)\n\n17. recall = round(metrics.recall_score(test_labels,\
    \ prediction, average=‘weighted’),3)\n\n18. f1_score = round(metrics.f1_score(test_labels,\
    \ prediction, average=‘weighted’),3)\n\n19.\n\n20.\n\n21. FP = cnf_matrix.sum(axis=0)\
    \ - np.diag(cnf_matrix)\n\n22. FN = cnf_matrix.sum(axis=1) - np.diag(cnf_matrix)\n\
    \n23. TP = np.diag(cnf_matrix)\n\n24. TN = cnf_matrix.sum() - (FP + FN + TP)\n\
    \n25.\n\n26. # Sensitivity, hit rate, recall, or true positive rate\n\n27. TPR\
    \ = round((TP/(TP+FN)).mean(),3)\n\n28. # Specificity or true negative rate\n\n\
    29. TNR = round((TN/(TN+FP) ).mean(),3)\n\n30. # Precision or positive predictive\
    \ value\n"
  trans: "\n对于 Phish-IRIS 数据集，如 Table 3.1 所示，\"其他\" 类的图像数量为 400，而其余所有类的图像数量在 50–150\
    \ 之间。这显然是各类数据的不平衡分布。因此，在用于模型训练前，必须对数据进行类不平衡处理。\n\n### 使用 SMOTE 添加合成数据\n\n不平衡数据集可以通过下采样多数类或上采样多数类来处理。这两种方法各有优缺点。在处理类不平衡时，广泛使用的更高级技术是\
    \ Synthetic Minority Over-sampling Technique（SMOTE）。\n\n该技术由 Chawla 等人于 2002 年提出，其工作原理是先将数据集中的所有数据点置于\
    \ n 维平面中，然后使用 K 最近邻算法，为少数类生成合成数据点。\n\n由于多类分类中，某一类（在此为 \"其他\" 类）的记录最大数量为 400，因此需要为其他所有类添加合成数据，使它们的数量达到\
    \ 400。由于总共有 15 个类别，应用 SMOTE 上采样技术后，每个类别的记录数将变为 400，训练数据总数变为 6000（即 400 × 15）。\n\
    \nTable 5.3 展示了在不同 CNN 应用中应用 SMOTE 后训练数据数组维度。\n\n**TABLE 5.3** 应用 SMOTE 后训练数据维度\n\
    \n| Application || Image Size  \n\n(128, 128, 3)  \n\n || Image Size  \n\n(256,\
    \ 256, 3)  \n\n |\n\n| --- | --- | --- |\n\n| Xception || (6000, 32768) || (6000,\
    \ 131072) |\n\n| --- | --- | --- |\n\n| VGG16 || (6000, 8192) || (6000, 32768)\
    \ |\n\n| VGG19 || (6000, 8192) || (6000, 32768) |\n\n| ResNet50V2 || (6000, 32768)\
    \ || (6000, 131072) |\n\n| ResNet101V2 || (6000, 32768) || (6000, 131072) |\n\n\
    | ResNet152V2 || (6000, 32768) || (6000, 131072) |\n\n| InceptionV3 || (6000,\
    \ 8192) || (6000, 73728) |\n\n| InceptionResNetV2 || (6000, 6144) || (6000, 55296)\
    \ |\n\n| MobileNet || (6000, 16384) || (6000, 65536) |\n\n| MobileNetV2 || (6000,\
    \ 20480) || (6000, 81920) |\n\n| DenseNet121 || (6000, 16384) || (6000, 65536)\
    \ |\n\n| DenseNet169 || (6000, 26624) || (6000, 106496) |\n\n| DenseNet201 ||\
    \ (6000, 30720) || (6000, 122880) |\n\n### SMOTE Python 实现\n\n输入数据为前一阶段使用各种 CNN\
    \ 架构提取的特征。\n\n1. SIZE=512\n\n2. data_dir=“../feature_extractor/last_layer/”+str(SIZE)+”/”\n\
    \n3. out_dir=“last_layer/”+str(SIZE)+”/”\n\n我们将创建一个包含所有 CNN 架构的 Python 列表，用于提取图像特征。\n\
    \n1. list_of_architectures = [\n\n2. “Xception”,\n\n3. “VGG16”,\n\n4. “VGG19”,\n\
    \n5. “ResNet50”,\n\n6. “ResNet101”,\n\n7. “ResNet152”,\n\n8. “ResNet50V2”,\n\n\
    9. “ResNet101V2”,\n\n10. “ResNet152V2”,\n\n11. “InceptionV3”,\n\n12. “InceptionResNetV2”,\n\
    \n13. “MobileNet”,\n\n14. “MobileNetV2”,\n\n15. “DenseNet121”,\n\n16. “DenseNet169”,\n\
    \n17. “DenseNet201”\n\n18.\n\n19.\n\n下面的函数会加载相应 CNN 架构提取的特征，并使用 SMOTE 算法为相对于其他占主导地位类别较少的类别生成合成数据点。\n\
    \n例如，“其他”类有 400 张图像，它是数据集中某一类别图像数量最多的。因此，将为其他所有类别创建合成图像，使每个类别的图像数量达到 400。例如，“PayPal”类有\
    \ 121 张图像，因此将为“PayPal”类生成 279 张合成图像。其余类别也将按此方式处理。\n\n1. def getSMOTE(model):\n\
    \n2. X_SMOTE = np.load(data_dir+model+”_train_images.npy”)\n\n3. y_train = np.load(data_dir+’/train_labels.npy’)\n\
    \n4.\n\n5. # SMOTE\n\n6. from imblearn.over_sampling import SMOTE\n\n7. oversample\
    \ = SMOTE()\n\n8. X_train_SMOTE, y_train_SMOTE = oversample.fit_resample(X_SMOTE,\
    \ y_train)\n\n9.\n\n10. np.save(out_dir+model+”_X_train_SMOTE”, X_train_SMOTE)\n\
    \n11. np.save(out_dir+model+”_y_train_SMOTE”, y_train_SMOTE)\n\n下面的循环会遍历在之前创建的列表中的所有\
    \ CNN 架构：\n\n1. for arch in list_of_architectures:\n\n2. getSMOTE(arch)\n\n循环结束后，所有使用不同\
    \ CNN 架构提取的特征的数据点数量都将被增强。\n\n### 机器学习分类器\n\n从所有 CNN 架构中提取的特征将输入到机器学习分类器中，作为多类分类问题。\n\
    \n创建包含所有提取特征且希望构建分类器的 CNN 架构列表。\n\n1. list_of_architectures = [\n\n2. “Xception”,\n\
    \n3. “VGG16”,\n\n4. “VGG19”,\n\n5. “ResNet50”,\n\n6. “ResNet101”,\n\n7. “ResNet152”,\n\
    \n8. “ResNet50V2”,\n\n9. “ResNet101V2”,\n\n10. “ResNet152V2”,\n\n11. “InceptionV3”,\n\
    \n12. “InceptionResNetV2”,\n\n13. “MobileNet”,\n\n14. “MobileNetV2”,\n\n15. “DenseNet121”,\n\
    \n16. “DenseNet169”,\n\n17. “DenseNet201”\n\n18.\n\n19.\n\n创建用于构建分类器的机器学习算法列表。\n\
    \n1. list_of_classifiers = [\n\n2. “RF”,\n\n3. “SVM”\n\n4.\n\n]\n\n创建图像缩放和特征提取的大小列表。\n\
    \n1. list_of_size = [\n\n2. 128,\n\n3. 256,\n\n4. 512\n\n5.\n\n]\n\n设置一些变量。\n\n\
    1. layer = ”last_layer”\n\n2. preprocessing_technique = ”smote”\n\n创建可重用的数据读取函数。\n\
    \n1. def getData(model, image_size):\n\n2. train_data_dir=“../class_imabalance/”\
    \ + layer + ”/” + str(image_size)+”/”\n\n3. test_data_dir=“../feature_extractor/”\
    \ + layer + ”/” + str(image_size)+”/”\n\n4. X_train=np.load(train_data_dir+model+”_X_train_SMOTE.npy”)\n\
    \n5. y_train=np.load(train_data_dir+model+”_y_train_SMOTE.npy”)\n\n6. X_test=np.load(test_data_dir+model+”_test_images.npy”)\n\
    \n7. y_test=np.load(test_data_dir+”test_labels.npy”)\n\n8. return X_train, y_train,\
    \ X_test, y_test\n\n创建可重用的标签编码器读取函数。\n\n1. def getLabelEncoder(layer, image_size):\n\
    \n2. label_encoder_location = ”../feature_extractor/” + layer + ”/” + str(image_size)+”/”\n\
    \n3. label_encoder = np.load(label_encoder_location+’label_encoder.npy’)\n\n4.\
    \ return label_encoder\n\n创建可重用的函数。\n\n1. def getClassificationMetrics(test_labels,\
    \ prediction):\n\n2. from sklearn.metrics import confusion_matrix\n\n3. test_label_list=list(np.unique(test_labels))\n\
    \n4. cnf_matrix = confusion_matrix(test_labels, prediction,labels=test_label_list)\n\
    \n5. np.set_printoptions(precision=2)\n\n6.\n\n7. # Plot non-normalized confusion\
