  trans: '

    -   [GoldPhish](https://wiki.example.org/goldphish) 是一种基于图像的启发式反钓鱼机制，它还使用网页的截图。它利用
    OCR 技术（Optical Character Recognition Wikipedia，未注明日期）从网页标志中提取文本。提取品牌名称后，GoldPhish
    使用 Google 的 PageRank 算法获取使用标志提取文本的前五个网页。随后，可疑网页域名会与 Google 搜索 API 返回的前五个域名进行比较；如果可疑网站域名与这五个域名中的任何一个不匹配，则该网站被判定为钓鱼网站。


    GoldPhish 与其他基于图像比较的处理机制不同，因为它不在本地存储任何数据，而是实时通过 Google API 提取信息。但这种方法的缺点是它依赖于
    OCR 服务提供商，同时也依赖于 Google 的 PageRank 算法。


    GoldPhish 使用 OCR 技术提取网页标志，而 Verilogo（Wang, 2010）则使用 SIFT 图像描述符（Lowe, 2004）提取给定可疑网站的标志。


    Verilogo 不仅使用 SIFT 描述符提取标志，还部署多层次钓鱼检测机制。如果提取的网站标志在本地存储库中不匹配任何标志，则假定该网站为合法，因为没有可比较的数据，用户因此可以继续访问该网站。因此，Verilogo
    的钓鱼检测能力仅限于其存储库中已有合法标志的品牌。


    此外，如果标志与存储库中的现有标志匹配，则会启用两个额外的检测层：首先是网站的 DNS 查找，其次是键盘输入，这本质上属于启发式方法。


    Rao & Ali（2015）描述了一种方案，其中使用计算机视觉技术 SURF 描述符（Bay et al., 2006）来提取合法和可疑网站的歧视性关键点描述符，并在相似度阈值的基础上显示对可疑网站进一步检查的警告。


    另一种基于比较的钓鱼检测应用利用对比上下文直方图（CCH）描述符（Chen et al., 2009）来比较可疑网页与真实网页的相似度。在该方法中，步骤 1
    通过 CCH 描述符提取可疑网站的特征并与本地存储的特征进行比较；步骤 2 则根据预定义的相似度阈值（本例为 0.6）决定是钓鱼还是非钓鱼。


    与之类似，Bozkir & Sezer（2016）利用 HOG 图像描述符比较可疑网站的图像特征与本地存储的合法网站特征。具体而言，HOG 特征从高度易受攻击的网站图像中提取，并将这些网站的视觉签名存储在本地存储库中；在运行时，提取可疑网站的相同
    HOG 特征，并将其视觉签名与本地存储库中合法网站的视觉签名进行比较，从而判断网站是钓鱼还是合法。


    ### 基于机器学习的技术


    我们接下来讨论基于机器学习的钓鱼检测分类机制。与比较式方法不同，比较式方法会将提取的特征与本地存储的合法特征进行比较；而基于机器学习的方法则从这些特征中使用一些机器学习算法提取模式，并构建分类模型，用于实时钓鱼检测。


    一种方法是 PhishIRIS（Dalgic et al., 2018），它利用 MPEG7（Rayar, 2017）及类似的紧凑视觉描述符（CVD）、可扩展色彩描述符（SCD）、色彩布局描述符（CLD）、CEDD、模糊色彩和文本直方图（FCTH）以及联合复合描述符（JCD）。部分上述描述符通过融合多个描述符实现，如本章（Chatzichristofis
    et al., 2010）所述。本文讨论了在早期融合、后期融合和分布式图像检索中 Compact Composite Descriptor 的行为。


    这些图像描述符从网站快照中提取，转换为特征向量，并输入到支持向量机（SVM）和随机森林（RF）等机器学习算法中，以判断网站是合法还是钓鱼。


    Dalgic et al.（2018）开发了一个开源数据集，包含 14 种高度钓鱼的品牌的网站图像，俗称 Phish‑IRIS（Phish‑IRIS 数据集
    – 小规模多类钓鱼网页截图档案，未注明日期）。


    Eroğlu et al.（2019）探索使用 GIST 和 LBP 特征来确定钓鱼网页的品牌。在此研究中，GIST 和 LBP 特征被提取并输入到 SVM、随机森林（RF）和
    XGBoost 等机器学习算法中进行分类。GIST 描述符关注图像中物体的轮廓，而 LBP 描述符为每个像素分配两个代码，并通过比较中心像素与邻近像素来分析局部补丁的纹理。利用这两个图像描述符，研究者采用了两种特征提取方案：(1)
    整体方案和 (2) 多级补丁方案。


    在整体方案中，特征向量使用完整的网站图像生成；在多级补丁方案中，图像被划分为多个补丁（如 2 × 2 和 3 × 3），提取特征后输入三个基于 SVM、随机森林和
    XGBoost 的分类器。评估指标包括准确率、假阳率、真阳率和 F1 分数。在所有对不同机器学习模型的迭代中，GIST 与 XGBoost 的组合表现最准确且最快。每次评估约需
    1.5 秒，使该模型适合作为浏览器插件用于实时检测。


    Bozkır 与 Aydos（2019）探讨使用 SIFT（Wu et al., 2013）和 DAISY（Tola et al., 2010）特征来确定钓鱼网页的品牌。通过
    SIFT 和 DAISY 提取的特征向量进一步与视觉词袋（BOVW）融合，并输入 SVM、XGBoost 和随机森林（RF）分类器进行分类。SIFT 结合
    400 个 BOVW 输入 XGBoost，可获得最佳的准确率、真阳率、假阳率和 F1 分数。


    ### 钓鱼检测使用网站图像的主要挑战


    使用仅网站图像进行钓鱼检测的主要挑战包括：


    1. 钓鱼网站在视觉上与其合法对应物高度相似，整个合法网站的 HTML 可能被用于构建钓鱼网站。但通常钓鱼者不会这样做，因为已经存在基于 HTML 比较的检测机制。如果他们真的这样做，就会在起始阶段就被捕获。


    2. 为比较而存储大量合法图像视觉签名需要巨大的数据存储库，并且在维护和扫描时也需要定期更新该数据存储库。


    3. 为了比较网站图像中的文本基础视觉签名，需要依赖第三方工具，如 OCR 工具、Google API 等。


    4. 为了提取可用于后续域名比对的钓鱼网站品牌，必须在构建机器学习模型时考虑感兴趣区域以及各种图像不变性。

