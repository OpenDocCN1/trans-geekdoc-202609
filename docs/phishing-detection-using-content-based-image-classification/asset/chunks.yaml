- raw: "Dr. Das has carried out collaborative research with professionals from companies\
    \ like Philips-Canada, Cognizant Technology Solutions and TCS. His keen interest\
    \ in the application of machine learning and deep learning techniques for designing\
    \ computer-aided diagnosis systems has resulted in joint publications of research\
    \ articles with professors and researchers from various universities abroad, including\
    \ the College of Medicine, University of Saskatchewan, Canada; Faculty of Electrical\
    \ Engineering and Computer Science, VSB Technical University of Ostrava, Ostrava,\
    \ Czech Republic; and Cairo University, Giza, Egypt. He has filed and published\
    \ two Indian patents consecutively during the year 2018 and 2019 and has over\
    \ 40 international publications to date with reputed publishers like IEEE, Springer,\
    \ Emerald and Inderscience. He has also authored three books in the domain of\
    \ content-based image classification and has edited three volumes to date with\
    \ IGI Global, CRC Press and De Gruyter, Germany. He has chaired several sessions\
    \ in International Conferences on Artificial Intelligence and Machine Learning\
    \ as a domain expert.\n\nDr. Rik Das has served as an invited speaker in various\
    \ national and international technical events, conclaves, meetups and refresher\
    \ courses on data analytics, artificial intelligence, machine learning, deep learning,\
    \ image processing and e-learning organized and hosted by prominent bodies like\
    \ the University Grants Commission (Human Resource Development Centre), the Confederation\
    \ of Indian Industry (CII), Software Consulting Organizations, MHRD initiative\
    \ under Pandit Madan Mohan Malviya National Mission on Teachers and Teaching,\
    \ IEEE Student Chapters and Computer Science/Information Technology Departments\
    \ of leading universities.\n\nDr. Rik Das has a YouTube channel “Curious Neuron”\
    \ to disseminate free knowledge and information to larger communities in the domain\
    \ of machine learning, research and development and open source programming languages.\
    \ He is always open to discussing new research and project ideas for collaborative\
    \ work and techno-managerial consultancies.\n\n# 1 Phishing and Cybersecurity\n\
    \nDOI: [10.1201/9781003217381-1](https://doi.org/10.1201/9781003217381-1)\n\n\
    Phishing is a cybercrime intended to trap innocent web users into a counterfeit\
    \ website, which is visually similar to its legitimate counterpart. Initially,\
    \ users are redirected to phishing websites through various social and technical\
    \ routing techniques. Unaware of the illegitimacy of the website, the users may\
    \ then provide their personal information such as user id, password, credit card\
    \ details or bank account details, to name a few. The phishers use such information\
    \ to steal money from banks, damage a brand’s image or even commit graver crimes\
    \ like identity theft. Although many phishing detection and prevention techniques\
    \ are available in the existing literature, the advent of smart machine learning\
    \ and deep learning methods has widened their scope in the cyber-security world.\n\
    \n## Structure\n\nIn this chapter, we will cover the following topics:\n\n*  \
    \ Basics of phishing in cybersecurity\n\n*   Phishing detection techniques \n\n\
    \    *   List (whitelist/blacklist)-based\n\n    *   Heuristics (predefined rules)-based\n\
    \n    *   Visual similarity-based\n\n*   Race between phishers and anti-phishers\n\
    \n*   Computer vision-based phishing detection approach\n\n## Objective\n\nAfter\
    \ studying this chapter, you should know what phishing is and how it affects everyone\
    \ who has a web footprint. You will learn about the various ways phishers attack\
    \ web users and how users can protect themselves from phishing attacks. You will\
    \ also know the various phishing detection mechanisms that play a vital role in\
    \ protecting web users from phishing attacks.\n\n## Basics of Phishing in Cybersecurity\n\
    \nPhishing is a term derived from fishing, by replacing “f” with “ph”, but contextually\
    \ they mean the same (*Phishing Definition & Meaning | What Is Phishing?*, n.d.).\
    \ Just as fish get trapped in fishing nets, so too are innocent web users being\
    \ trapped by phishing websites. Phishing websites are counterfeit websites that\
    \ are visually similar to their legitimate counterparts. Web users are redirected\
    \ to phishing websites by various means. [Figure 1.1](#c1.xhtml#f1.1) depicts\
    \ the various techniques employed by phishers to circulate spam messages that\
    \ contain links to phishing websites.\n\n![FIGURE 1.1 Types of phishing attacks.](images/fig1.1.jpg)\n\
    \n**FIGURE 1.1** Types of phishing attacks.\n\nJain and Gupta (2017) stated that\
    \ spreading infected links is the starting point of any phishing attack. Once\
    \ users have received the infected links in their inbox through any of the phishing\
    \ attack mechanisms shown in [Figure 1.1](#c1.xhtml#f1.1), whether they click\
    \ on those links or not depends on the users’ awareness. Hence, at the outset,\
    \ user awareness is the most important, yet most ignored, anti-phishing mechanism.\n\
    \nBut to protect users from phishing attacks, anti-phishers have explored many\
    \ technical anti-phishing mechanisms by considering even novice and technically\
    \ inept users.\n\n## Phishing Detection Techniques\n\nPhishing detection mechanisms\
    \ are broadly categorized into four groups, as depicted in [Figure 1.2](#c1.xhtml#f1.2)\
    \ (Khonji et al., 2013):\n\n![FIGURE 1.2 Phishing detection mechanisms.](images/fig1.2.jpg)\n\
    \n**FIGURE 1.2** Phishing detection mechanisms.\n\n1.  List (whitelist/blacklist)-based\n\
    \n2.  Heuristics (pre-defined rules)-based\n\n3.  Visual similarity-based\n\n\
    4.  AI/ML-based\n\n### List (Whitelist/Blacklist)-Based\n\nIn a list-based anti-phishing\
    \ mechanism, a whitelist and blacklist of URLs are created and are compared against\
    \ a suspicious website URL to conclude whether the website under scrutiny is a\
    \ phishing website or a legitimate one (Jain & Gupta, 2016) (Prakash et al., 2010).\n\
    \nThere are various limitations with the list-based approach, namely:\n\n1.  It\
    \ is dependent on a third-party service provider that captures and maintains such\
    \ lists, like Google safe browsing API (*Google Safe Browsing | Google Developers*,\
    \ n.d.).\n\n2.  Adding a newly deployed phishing website to the white/blacklist\
    \ is a process that takes time. First such a website has to be identified, and\
    \ then it has to be listed. Since the average lifetime of a phishing website is\
    \ 24–32 hours, hence zero-day phishing attacks, this is a serious limitation (*Zero-Day\
    \ (Computing) – Wikipedia*, n.d.).\n\n### Heuristics (Pre-Defined Rules)-Based\n\
    \nIn heuristic-based approaches, various website features like image, text, URL\
    \ and DNS records are extracted and used to build a rule-based engine or a machine\
    \ learning-based classifier to classify a given website as phishing or legitimate.\
    \ Although heuristic-based approaches are among quite effective anti-phishing\
    \ mechanisms, some of their drawbacks have been pointed out by Varshney et al.\
    \ (2016):\n\n1.  The time and computational resources required for training are\
    \ too high.\n\n2.  Heuristic-based applications cannot be used as a browser plugin.\n\
    \n3.  The approach would be ineffective once scammers discovered the key features\
    \ that can be used to bypass the rules.\n\n### Visual Similarity-Based\n\nVisual\
    \ similarity-based techniques are very useful in detecting phishing since phishing\
    \ websites look similar to their legitimate counterparts. These techniques use\
    \ visual features like text content, text format, DOM (Document Object Model)\
    \ features, CSS features, website images, etc., to detect phishing. Here, DOM-,\
    \ CSS-, HTML tags- and pixel-based features are compared to their legitimate counterparts\
    \ in order to make a decision."
  fmt: "\nDr. Das has carried out collaborative research with professionals from companies\
    \ like Philips-Canada, Cognizant Technology Solutions and TCS. His keen interest\
    \ in the application of machine learning and deep learning techniques for designing\
    \ computer-aided diagnosis systems has resulted in joint publications of research\
    \ articles with professors and researchers from various universities abroad, including\
    \ the College of Medicine, University of Saskatchewan, Canada; Faculty of Electrical\
    \ Engineering and Computer Science, VSB Technical University of Ostrava, Ostrava,\
    \ Czech Republic; and Cairo University, Giza, Egypt. He has filed and published\
    \ two Indian patents consecutively during the year 2018 and 2019 and has over\
    \ 40 international publications to date with reputed publishers like IEEE, Springer,\
    \ Emerald and Inderscience. He has also authored three books in the domain of\
    \ content-based image classification and has edited three volumes to date with\
    \ IGI Global, CRC Press and De Gruyter, Germany. He has chaired several sessions\
    \ in International Conferences on Artificial Intelligence and Machine Learning\
    \ as a domain expert.\n\nDr. Rik Das has served as an invited speaker in various\
    \ national and international technical events, conclaves, meetups and refresher\
    \ courses on data analytics, artificial intelligence, machine learning, deep learning,\
    \ image processing and e-learning organized and hosted by prominent bodies like\
    \ the University Grants Commission (Human Resource Development Centre), the Confederation\
    \ of Indian Industry (CII), Software Consulting Organizations, MHRD initiative\
    \ under Pandit Madan Mohan Malviya National Mission on Teachers and Teaching,\
    \ IEEE Student Chapters and Computer Science/Information Technology Departments\
    \ of leading universities.\n\nDr. Rik Das has a YouTube channel “Curious Neuron”\
    \ to disseminate free knowledge and information to larger communities in the domain\
    \ of machine learning, research and development and open source programming languages.\
    \ He is always open to discussing new research and project ideas for collaborative\
    \ work and techno-managerial consultancies.\n\n# 1 Phishing and Cybersecurity\n\
    \nDOI: [10.1201/9781003217381-1](https://doi.org/10.1201/9781003217381-1)\n\n\
    Phishing is a cybercrime intended to trap innocent web users into a counterfeit\
    \ website, which is visually similar to its legitimate counterpart. Initially,\
    \ users are redirected to phishing websites through various social and technical\
    \ routing techniques. Unaware of the illegitimacy of the website, the users may\
    \ then provide their personal information such as user id, password, credit card\
    \ details or bank account details, to name a few. The phishers use such information\
    \ to steal money from banks, damage a brand’s image or even commit graver crimes\
    \ like identity theft. Although many phishing detection and prevention techniques\
    \ are available in the existing literature, the advent of smart machine learning\
    \ and deep learning methods has widened their scope in the cyber-security world.\n\
    \n## Structure\n\nIn this chapter, we will cover the following topics:\n\n* Basics\
    \ of phishing in cybersecurity\n\n* Phishing detection techniques\n\n    * List\
    \ (whitelist/blacklist)-based\n\n    * Heuristics (predefined rules)-based\n\n\
    \    * Visual similarity-based\n\n* Race between phishers and anti-phishers\n\n\
    * Computer vision-based phishing detection approach\n\n## Objective\n\nAfter studying\
    \ this chapter, you should know what phishing is and how it affects everyone who\
    \ has a web footprint. You will learn about the various ways phishers attack web\
    \ users and how users can protect themselves from phishing attacks. You will also\
    \ know the various phishing detection mechanisms that play a vital role in protecting\
    \ web users from phishing attacks.\n\n## Basics of Phishing in Cybersecurity\n\
    \nPhishing is a term derived from fishing, by replacing “f” with “ph”, but contextually\
    \ they mean the same (*Phishing Definition & Meaning | What Is Phishing?*, n.d.).\
    \ Just as fish get trapped in fishing nets, so too are innocent web users being\
    \ trapped by phishing websites. Phishing websites are counterfeit websites that\
    \ are visually similar to their legitimate counterparts. Web users are redirected\
    \ to phishing websites by various means. [Figure 1.1](#c1.xhtml#f1.1) depicts\
    \ the various techniques employed by phishers to circulate spam messages that\
    \ contain links to phishing websites.\n\n![FIGURE 1.1 Types of phishing attacks.](images/fig1.1.jpg)\n\
    \n**FIGURE 1.1** Types of phishing attacks.\n\nJain and Gupta (2017) stated that\
    \ spreading infected links is the starting point of any phishing attack. Once\
    \ users have received the infected links in their inbox through any of the phishing\
    \ attack mechanisms shown in [Figure 1.1](#c1.xhtml#f1.1), whether they click\
    \ on those links or not depends on the users’ awareness. Hence, at the outset,\
    \ user awareness is the most important, yet most ignored, anti-phishing mechanism.\n\
    \nBut to protect users from phishing attacks, anti-phishers have explored many\
    \ technical anti-phishing mechanisms by considering even novice and technically\
    \ inept users.\n\n## Phishing Detection Techniques\n\nPhishing detection mechanisms\
    \ are broadly categorized into four groups, as depicted in [Figure 1.2](#c1.xhtml#f1.2)\
    \ (Khonji et al., 2013):\n\n![FIGURE 1.2 Phishing detection mechanisms.](images/fig1.2.jpg)\n\
    \n**FIGURE 1.2** Phishing detection mechanisms.\n\n1. List (whitelist/blacklist)-based\n\
    \n2. Heuristics (pre-defined rules)-based\n\n3. Visual similarity-based\n\n4.\
    \ AI/ML-based\n\n### List (Whitelist/Blacklist)-Based\n\nIn a list-based anti-phishing\
    \ mechanism, a whitelist and blacklist of URLs are created and are compared against\
    \ a suspicious website URL to conclude whether the website under scrutiny is a\
    \ phishing website or a legitimate one (Jain & Gupta, 2016) (Prakash et al., 2010).\n\
    \nThere are various limitations with the list-based approach, namely:\n\n1. It\
    \ is dependent on a third-party service provider that captures and maintains such\
    \ lists, like Google safe browsing API (*Google Safe Browsing | Google Developers*,\
    \ n.d.).\n\n2. Adding a newly deployed phishing website to the white/blacklist\
    \ is a process that takes time. First such a website has to be identified, and\
    \ then it has to be listed. Since the average lifetime of a phishing website is\
    \ 24–32 hours, hence zero-day phishing attacks, this is a serious limitation (*Zero-Day\
    \ (Computing) – Wikipedia*, n.d.).\n\n### Heuristics (Pre-Defined Rules)-Based\n\
    \nIn heuristic-based approaches, various website features like image, text, URL\
    \ and DNS records are extracted and used to build a rule-based engine or a machine\
    \ learning-based classifier to classify a given website as phishing or legitimate.\
    \ Although heuristic-based approaches are among quite effective anti-phishing\
    \ mechanisms, some of their drawbacks have been pointed out by Varshney et al.\
    \ (2016):\n\n1. The time and computational resources required for training are\
    \ too high.\n\n2. Heuristic-based applications cannot be used as a browser plugin.\n\
    \n3. The approach would be ineffective once scammers discovered the key features\
    \ that can be used to bypass the rules.\n\n### Visual Similarity-Based\n\nVisual\
    \ similarity-based techniques are very useful in detecting phishing since phishing\
    \ websites look similar to their legitimate counterparts. These techniques use\
    \ visual features like text content, text format, DOM (Document Object Model)\
    \ features, CSS features, website images, etc., to detect phishing. Here, DOM-,\
    \ CSS-, HTML tags- and pixel-based features are compared to their legitimate counterparts\
    \ in order to make a decision.\n"
  trans: "\nDr. Das 与来自 Philips-Canada、Cognizant Technology Solutions 和 TCS 等公司的专业人士合作开展了研究。他对利用机器学习和深度学习技术设计计算机辅助诊断系统的兴趣，促成了与国外多所大学（包括加拿大萨斯喀彻温大学医学院、捷克奥斯特拉瓦技术大学电气工程与计算机科学学院、埃及开罗大学）的教授和研究人员共同发表研究文章。他在\
    \ 2018 年和 2019 年连续申请并发表了两项印度专利，目前已有超过 40 篇国际出版物，发表于 IEEE、Springer、Emerald 和 Inderscience\
    \ 等知名出版社。他还在内容基于图像分类领域撰写了三本专著，并与 IGI Global、CRC Press 和 De Gruyter（德国）合著三卷书。作为人工智能和机器学习领域的专家，他主持了多个国际会议的会议环节。\n\
    \nDr. Rik Das 受邀在各类国家和国际技术活动、研讨会、聚会和数据分析、人工智能、机器学习、深度学习、图像处理、电子学习等主题的 refresher\
    \ courses 中担任演讲嘉宾，这些活动由人力资源发展中心（University Grants Commission）、印度工业联合会（Confederation\
    \ of Indian Industry, CII）、软件咨询组织、Pandit Madan Mohan Malviya National Mission\
    \ on Teachers and Teaching（MHRD）倡议、IEEE 学生分会以及知名大学计算机科学/信息技术系等主要机构组织和主办。\n\nDr.\
    \ Rik Das 拥有一个名为 “Curious Neuron” 的 YouTube 频道，用于向机器学习、研究与开发以及开源编程语言领域的更大社区免费传播知识和信息。他始终乐于讨论新的研究和项目想法，开展协作工作以及技术-管理咨询。\n\
    \n# 1 Phishing and Cybersecurity\n\nDOI: [10.1201/9781003217381-1](https://doi.org/10.1201/9781003217381-1)\n\
    \nPhishing 是一种网络犯罪，旨在诱骗无辜的网络用户访问伪造网站，该网站在外观上与其合法 counterpart 相似。最初，用户通过各种社交和技术路由技术被重定向到\
    \ phishing 网站。 unaware of the illegitimacy of the website, the users may then\
    \ provide their personal information such as user id, password, credit card details\
    \ or bank account details, to name a few. The phishers use such information to\
    \ steal money from banks, damage a brand’s image or even commit graver crimes\
    \ like identity theft. \n\n虽然现有文献中已有许多 phishing 检测和防范技术，但智能机器学习和深度学习方法的出现扩大了它们在网络安全领域的范围。\n\
    \n## Structure\n\n本章将涵盖以下主题：\n\n* 基础 phishing 在网络安全中的概念\n\n* Phishing 检测技术\n\n\
    \    * 列表（白名单/黑名单）基于\n\n    * 启发法（预定义规则）基于\n\n    * 视觉相似性基于\n\n* 防范者与攻击者之间的竞争\n\
    \n* 计算机视觉基的 phishing 检测方法\n\n## Objective\n\n学习本章后，你应了解什么是 phishing 以及它如何影响所有拥有网络足迹的人。你将学习到攻击者以各种方式攻击网络用户的方式，以及用户如何保护自己免受\
    \ phishing 攻击。你还将了解在保护网络用户免受 phishing 攻击方面发挥关键作用的各种 phishing 检测机制。\n\n## Basics\
    \ of Phishing in Cybersecurity\n\nPhishing 这个词源自于 fishing，把 “f” 替换为 “ph”，在语境中含义相同（*Phishing\
    \ Definition & Meaning | What Is Phishing?*, n.d.）。就像鱼被钓网捕获一样，无辜的网络用户也被 phishing\
    \ 网站捕获。Phishing 网站是与合法 counterpart  visually similar 的假网站。用户通过多种方式被重定向到 phishing\
    \ 网站。Figure 1.1 展示了 phishers 用来传播包含 phishing 链接的垃圾信息的各种技术。\n\n![FIGURE 1.1 Types\
    \ of phishing attacks.](img/fig1.1.jpg)\n\n**FIGURE 1.1** Types of phishing attacks.\n\
    \nJain and Gupta (2017) 表示，传播受感染链接是任何 phishing 攻击的起点。一旦用户通过 Figure 1.1 所示的任何 phishing\
    \ 攻击机制收到受感染的链接，无论他们是否点击该链接，都取决于用户的认知。因此，从一开始，用户认知是最重要且最常被忽视的防范机制。\n\n为了保护用户免受\
    \ phishing 攻击，防范者探索了许多技术防范机制，即使是对新手和技术能力较弱的用户也适用。\n\n## Phishing Detection Techniques\n\
    \nPhishing 检测机制大致分为四类，如 Figure 1.2 所示（Khonji et al., 2013）：\n\n![FIGURE 1.2 Phishing\
    \ detection mechanisms.](img/fig1.2.jpg)\n\n**FIGURE 1.2** Phishing detection\
    \ mechanisms.\n\n1. List (whitelist/blacklist)-based\n\n2. Heuristics (pre-defined\
    \ rules)-based\n\n3. Visual similarity-based\n\n4. AI/ML-based\n\n### List (Whitelist/Blacklist)-Based\n\
    \n在列表基于防范机制中，创建 URL 白名单和黑名单，并将可疑网站 URL 与之比对，以判断该网站是 phishing 网站还是合法网站（Jain & Gupta,\
    \ 2016） (Prakash et al., 2010)。\n\n该方法的局限性包括：\n\n1. 依赖第三方服务提供商（如 Google Safe Browsing\
    \ API *Google Safe Browsing | Google Developers*，n.d.）来捕获和维护这些列表。\n\n2. 将新部署的\
    \ phishing 网站加入白/黑名单需要时间。首先需识别该网站，然后将其加入列表。由于 phishing 网站的平均生命周期为 24–32 小时，零日\
    \ phishing 攻击因此成为严重限制（*Zero-Day (Computing) – Wikipedia*，n.d.）。\n\n### Heuristics\
    \ (Pre-Defined Rules)-Based\n\n在启发法基于的方法中，从图像、文本、URL 和 DNS 记录等网站特征中提取信息，并用于构建基于规则的引擎或机器学习分类器，以判断给定网站是\
    \ phishing 还是合法。虽然启发法是较为有效的防范机制，但 Varshney et al. (2016) 指出其缺点：\n\n1. 训练所需的时间和计算资源过高。\n\
    \n2. 启发法应用无法作为浏览器插件使用。\n\n3. 一旦骗子发现可以用于绕过规则的关键特征，该方法将失效。\n\n### Visual Similarity-Based\n\
    \n视觉相似性技术在检测 phishing 方面非常有用，因为 phishing 网站与其合法 counterpart  visually similar。这些技术利用文本内容、文本格式、DOM（文档对象模型）、CSS、网站图像等视觉特征进行检测。通过比较\
    \ DOM、CSS、HTML 标签及像素等特征与合法网站的特征，做出检测决策。\n\n"
