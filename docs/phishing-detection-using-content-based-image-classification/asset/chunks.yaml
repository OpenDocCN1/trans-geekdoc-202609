    size of 128×128 and 3 channels (RGB).


    Normalize the pixel values.


    1. # convert from integers to floats*


    2. trainX = train_images.astype(''float32'')


    3. testX = test_images.astype(''float32'')


    4. # normalize to range 0-1*


