    in the RGB format, which means that the pixel values of each channel remain the
    same, but they are arranged differently. Earlier it was \[B = 30, G = 31, R =
    29\] and after conversion it became \[R = 29, G = 31, B = 30\].


    1. image\[0\]\[0\]


    array(\[29, 31, 30\], dtype=uint8)


    Let’s now plot the image to check the pixel arrangements in the x and y axes (Figure
    9.3).


    ![FIGURE 9.3 Pixel representation of a digital image.](img/fig9.3.jpg)


    **FIGURE 9.3** Pixel representation of a digital image.


    2. plt.imshow(image)


    3. plt.title(“Einstein”)


    4. plt.grid(False)


    5. plt.show()


    So, we can see that the image has 1034 pixels vertically along the y axis, which
    is termed as height, and 968 pixels horizontally along the x axis, which is termed
    as width, and at every pixel there are three values, one value for the red channel,
    one value for the green channel and one value for the blue channel.


    Hence, the total number of pixel values across the three channels of the image
    is equal to


    *   1034 × 968 × 3 = 30,02,736


    So, what a human eye sees as just an image, a computer sees as 30,02,736 numbers
    arranged in a defined order.


