    | DenseNet201 || (1313, 30720) || (1313, 122880) || (1539, 30720) || (1539, 122880)\
    \ |\n\n### Handling Class Imbalance\n\nClass imbalance is a situation wherein\
    \ data in each class are non-uniformly distributed in the dataset for training\
    \ the model. This may result in the model skewing toward the class which has the\
    \ maximum number of records available for the training, as the model has more\
    \ records available to learn from that one particular class. Hence, features from\
    \ that particular class take precedence in the learning of the model. This results\
    \ in various anomalies in the model training process, and hence data must be pre-processed\
    \ and handled for the class imbalance before ingesting it into the model training\
    \ process."
