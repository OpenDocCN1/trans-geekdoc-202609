    ### Label Encoding for Machine Learning Classifier


    Since machine learning classifiers only work with numerical label values, we used
    Python library sklearn’s LabelEncoder module to convert the categorical labels
    into numerically encoded label arrays.


    Label encoding Python implementation:


    1. from sklearn.preprocessing import LabelEncoder


    2. le = LabelEncoder()


    3. le.fit(train_labels)


    4. trainY_le = le.transform(train_labels)


    5. testY_le = le.transform(test_labels)


    ### One Hot Encoding for Deep Learning Classifier


    Since deep learning classifiers only work with one-hot encoded labels, we used
    Python library sklearn’s LabelBinarizer module to convert the labels into one-hot
    encoded label arrays.


    Label Binarizer Python implementation.


    1. from sklearn.preprocessing import LabelBinarizer


    2. lb = LabelBinarizer()


    3. lb.fit(train_labels)


    4. trainY_lb = lb.transform(train_labels)


    5. testY_lb = lb.transform(test_labels)


