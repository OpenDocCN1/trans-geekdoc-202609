    \n### Summary\n\nIn this chapter, we experimented with fused features generated\
    \ by combining image representations in a combination of two and three CNN architectures.\
    \ Additionally, features were fused both horizontally and vertically before feeding\
    \ them into different classification models.\n\n# 8 Comparison of Phishing Detection\
    \ Approaches\n\nDOI: [10.1201/9781003217381-8](https://doi.org/10.1201/9781003217381-8)\n\
    \nThis chapter looks into the implementation outcomes of the various approaches\
    \ and techniques used for building and evaluating the phish-IRIS dataset-based\
    \ classification model. Numerous classification models within each suggested approach\
    \ are built and experimented with various combinations with data dimensions and\
    \ fusions. In this chapter, a comparison of how each approach has performed and\
    \ how they perform against state-of-the-art performance with this dataset is conducted.\n\
    \n## Classification Approaches\n\nTable 8.1 lists all the different approaches\
    \ suggested in this book.\n\n**TABLE 8.1** Description of All the Classification\
    \ Approaches Proposed in This Book\n\n| Approaches || Description |\n| --- | ---\
    \ |\n| Approach 1 || Traditional CNN with image size of (128, 128, 3) and (256,\
    \ 256, 3) |\n| Approach 2 || Transfer the learning till last fully connected layer\
    \ |\n| Approach 3 || Transfer the learning till last convolution layer, extract\
    \ features and SMOTE, and implement a machine learning classifier |\n\n"
