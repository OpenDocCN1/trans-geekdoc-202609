    The “other” folder contains the images of all the legitimate websites. Since this
    is not a comparison-based approach, the “other” folder contains images of brands
    other than the 14 brands chosen for phishing website images. Also, since most
    websites on the internet are legitimate websites, the addition of this “other”
    folder makes this dataset an open-set, since the images in this folder have no
    common color scheme or edge structure that characterizes its own class.


    Another important feature of this dataset is that it is not a comparison-based
    modeling dataset. For example, there is a folder for the “Amazon” brand which
    contains Amazon phishing website images. There is no folder corresponding to Amazon’s
    legitimate website images. Basically, the model will not be trained to differentiate
    between a phish Amazon image and a legitimate Amazon image. On the contrary, the
    other folder contains images of the websites which are not part of those 14 phishing
    brands.


    If there is no “other” folder in the dataset, then it means that this dataset
    belongs to the 14 brands. With the inclusion of the “other” folder, this dataset
    becomes an open dataset, meaning this dataset can be used to train a model not
    only to detect the 14 phishing brands, but also to classify any website as phishing
    or legitimate.


    There are 1313 training and 1539 testing web pages in the dataset, which are already
    separated into two different folders. Since images of individual brands are stored
    in the folder named by brand, images are considered as labeled.


    The size of the images ranges from 700 pixels to 1280 pixels in terms of both
    width and height. Hence, there is a need to resize the images and bring them all
    to the same size format.


    As can be seen in [Table 3.1](#c3.xhtml#t3.1), the “other” folder contains far
    more images than brand-specific images. Also, since it is a multi-class classification
    problem, class imbalance is visible in the dataset. Hence, there is a need to
    incorporate class imbalance techniques like SMOTE (Chawla et al., 2002).


    ## Classification Using CNN


    At the outset, a traditional CNN application will be designed and built with optimized
    hyperparameters to produce the best results within the computational limitations,
    to set a baseline of the performance.


    Within this approach, various convolution layers will be built, features from
    which will be flattened and ingested into densely fully connected layers and trained
    for building the best classification model.


    ## CNN Implementation


    The Phish-IRIS data are structured in such a way that there are two folders: train
    and val. All images specific to a particular brand are stored in the folder named
    by the brand. The same structure is followed in both folders.


