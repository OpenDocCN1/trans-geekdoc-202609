    \ or contact the Copyright Clearance Center, Inc. (CCC), 222 Rosewood Drive, Danvers,\
    \ MA 01923, 978-750-8400. For works that are not available on CCC please contact\
    \ [mpkbookspermissions@tandf.co.uk](http://mpkbookspermissions@tandf.co.uk)\n\n\
    *Trademark notice*: Product or corporate names may be trademarks or registered\
    \ trademarks and are used only for identification and explanation without intent\
    \ to infringe.\n\nISBN: 9781032108537 (hbk)  \n\nISBN: 9781032265025 (pbk)  \n\
    \nISBN: 9781003217381 (ebk)\n\nDOI: [10.1201/9781003217381](http://doi.org/10.1201/9781003217381)\n\
    \nTypeset in Times  \n\nby Deanta Global Publishing Services, Chennai, India\n\
    \n# Preface\n\nPhishing is one of the most prominent cybercrimes which has posed\
    \ significant threat to transactions over the world wide web. Visual similarity\
    \ of a forged website to its genuine counterpart often misleads web users to fall\
    \ prey to this malicious activity. Hence, it has become imperative to build awareness\
    \ about the basics of phishing within cybersecurity domains and to identify the\
    \ different techniques used by phishers to attack web users. It is evident that\
    \ the various anti-phishing initiatives have instigated a race between phishers\
    \ and anti-phishers, leading to constant innovation by both parties to stay ahead\
    \ in the game.\n\nThe popularity of machine learning and deep learning techniques\
    \ has leveraged the research using image processing-based phishing detection techniques.\
    \ Researchers have faced various challenges in detecting phishing using website\
    \ images. A tabular comparison and summary of various related works is discussed\
    \ in this volume to provide a clear historical perspective for phishing detection.\
    \ Open-source programming languages like Python have implemented several Convolutional\
    \ Neural Network (CNN)-based phishing detection statistical models. A step-by-step\
    \ guide to building a CNN Model is discussed to make the reader familiar with\
    \ assorted approaches to preventing phishing. Creation of the transfer learning-based\
    \ CNN model using various off-the-shelf CNN architectures has proved to be useful\
    \ in deep learning-based phishing detection. Robust feature extraction from website\
    \ images using representation learning is also explored to design useful descriptors\
    \ for identifying duplicate websites. The ground-up approach of extracting image\
    \ representations is implemented using various off-the-shelf CNN architectures\
    \ like VGGNet, ResNet, DenseNet, and so on. Machine learning models are created\
    \ using pre-processed image features and performance comparison between various\
    \ models.\n\nFinally, feature dimension reduction and fusion-based techniques\
    \ are explored for creating strong feature vectors to implement content-based\
    \ image classification-based phishing detection. The diversified approaches discussed\
    \ in this book provide the reader with a 360° overview and a stepping stone to\
    \ experience this interdisciplinary domain of phishing detection using image content\
    \ of the websites.\n\nThis book is intended for graduates and undergraduates from\
    \ assorted backgrounds such as data science, network security and research, software\
    \ developers and as a reference book for scientists, researchers, lecturers, and\
    \ tutors, as well as for academic and corporate libraries.\n\nShekhar Khandelwal\n\
    \nRik Das\n\n# Authors\n\n![](images/inline0.1.jpg)\n\n**Shekhar Khandelwal**\
    \ is a Data Scientist and works with Ernst & Young (EY), Bangalore, India for\
    \ the Data & Analytics team. He has extensive experience of around 15 years in\
    \ the industry, and has worked across every sphere of the software development\
    \ life cycle. He has worked as a product developer, industry solutions developer,\
    \ data engineer, data scientist and Cloud developer. Previously, he worked for\
    \ IBM Software Labs, where he also got a chance to work for industrial IoT-based\
    \ IBM cognitive product development and client deployment using various Watson\
    \ tools and technologies. He is an industry leader solving challenging computer\
    \ vision, NLP and predictive analytics-based problems using machine learning and\
    \ deep learning.\n\n![](images/inline0.2.jpg)\n\n**Dr. Rik Das** is currently\
    \ a Lead Software Engineer in Computer Vision Research at Siemens Advanta, India.\
    \ Previously he was with Xavier Institute of Social Service, Ranchi, as an Assistant\
    \ Professor for the Post Graduate Program in Information Technology.\n\nDr. Das\
    \ has over 17 years of experience in industrial and academic research. He was\
    \ professionally associated with many leading universities and institutes in India,\
    \ including Narsee Monjee Institute of Management Studies (NMIMS) (deemed-to-be-university),\
    \ Globsyn Business School and Maulana Abul Kalam Azad University of Technology.\n\
    \nDr. Das has a Ph.D. (Tech.) in Information Technology from the University of\
    \ Calcutta. He has also received his M.Tech. (Information Technology) from the\
    \ University of Calcutta after his B.E. (Information Technology) from the University\
    \ of Burdwan, West Bengal, India.\n\nDr. Das has over 18 years of professional\
    \ experience in the IT industry and traditional academia and with EduTech companies\
    \ and has carried out collaborative research with various leading universities\
    \ and institutes in India and abroad. He has an early career stint in Business\
    \ Development and Project Marketing with Great Eastern Impex Pvt. Ltd., Zenith\
    \ Computers Ltd. and so on.\n\nDr. Rik Das is appointed as a “Distinguished Speaker”\
    \ by the Association of Computing Machinery (ACM), New York, for a tenure of three\
    \ years initiating from July2020. He was featured in uLektz Wall of Fame as one\
    \ of the “Top 50 Tech Savvy Academicians in Higher Education across India” for\
    \ the year 2019. He is also a Member of the International Advisory Committee of\
    \ AI-Forum, UK.\n\nDr. Das is awarded “Professional Membership” of the “Association\
    \ of Computing Machinery (ACM)”, New York, for the year 2020–2021. He is the recipient\
    \ of the prestigious “InSc Research Excellence Award” hosted in the year 2020.\
    \ Dr. Das is conferred with the Best Researcher Award at International Scientist\
    \ Awards on Engineering, Science and Medicine for the year 2021. He is also the\
    \ recipient of the Best Innovation Award in the Computer Science category at UILA\
    \ Awards 2021."
