    \ CNN applications |\n\n| Approach 8 || Apply RF and SVM on the best performing\
    \ model from all the above approaches for an image size of (512, 512, 3) |\n\n\
    ## Evaluation of Classification Experiments\n\nImages in the phish-IRIS dataset\
    \ are resized into three different dimensions: (128, 128, 3), (256, 256, 3) and\
    \ (512, 512, 3). Features are extracted utilizing CNN applications like VGGNet,\
    \ DenseNet, and so on, for all the image sizes. Additionally, dimensionality reduction\
    \ and feature fusion of the extracted features are done to build numerous classification\
    \ models. [Table 8.2](#c8.xhtml#t8.2) lists all the best performing models within\
    \ each approach experimented in this book. The table is sorted by recall (TPR)\
    \ value against each experiment.\n\n**TABLE 8.2** Comparison of the Best Performing\
    \ Models within Different Approaches\n\n| Approach || Model || Recall || F1 ||\
    \ Image  \n\nSize  \n\n || Classifier |\n\n| --- | --- | --- | --- | --- | ---\
    \ |\n\n| **8** || **DenseNet201** || **0.908** || **0.909** || **512** || **SVM**\
    \ |\n\n| --- | --- | --- | --- | --- | --- |\n\n| 3 || DenseNet201 || 0.903 ||\
    \ 0.903 || 256 || SVM |\n\n| 3 || DenseNet201 || 0.897 || 0.89 || 256 || RF |\n\
    \n| 4 || VGG19\\_ResNet152V2\\_DenseNet201 || 0.897 || 0.893 || 256 || RF |\n\n\
    | 5 || DenseNet201\\_500 || 0.897 || 0.896 || 256 || SVM |\n\n| 4 || Xception\\\
