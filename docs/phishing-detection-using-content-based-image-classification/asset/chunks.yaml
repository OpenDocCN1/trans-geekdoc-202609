    # 4 Transfer Learning Approach in Phishing Detection


    DOI: [10.1201/9781003217381-4](https://doi.org/10.1201/9781003217381-4)


    Building a basic neural network from scratch is a good way to define baseline
    accuracy. However, we need to improve the network by using a more complicated
    and deeper architecture. Alternatively, we can use previously defined architectures
    that have already proved their efficacy in image classification, with the architectures
    usually applied on image datasets like imagenet, coco, etc. Through the approach
    of transfer learning, you can utilize such previously built architectures and
    retrain the model for your specific dataset. Additionally, you can choose not
    to retrain the model and instead just use the previously learned weights and biases.


    ## Structure


    In this chapter, the following topics will be covered:


    *   Classification using transfer learning


    *   Python implementation of transfer learning


    *   Performance assessment of CNN models


    ## Objective


    After studying this chapter, you should be able to understand what transfer learning
    is, and how it’s important to use previously discovered neural networks architectures
    and/or their learned parameters. You will also see the implementation of Python
    for this purpose. Assessing the performance of the model will let you choose the
    most appropriate CNN architecture for your problem statement.


    ## Classification Using Transfer Learning


    Transfer learning techniques allow reuse of already trained CNN applications to
    build a new model with different datasets. Basically, the whole architecture of
    the already built CNN application is reused, along with trained parameters such
    as weights, biases, kernels, and so on, without the need for retraining them for
    a new custom image dataset. This reduces the computational requirement of building
    a CNN application, and also allows the user to use tried-and-tested learned parameters
    for obtaining optimum results from a different set of images.


    ### Transfer the Learning up to the Last Fully Connected Layer


    In this approach, the transfer learning technique is utilized to classify images.
    As per [Figure 4.1](#c4.xhtml#f4.1), trained images from the Phish-IRIS dataset
    are ingested into the CNN application using the transfer learning technique, with
    the final classification layer being replaced for classifying it among the 15
    classes ([Figure 4.1](#c4.xhtml#f4.1)).


    ![FIGURE 4.1 Transfer learning end-to-end flow.](images/fig4.1.jpg)


    **FIGURE 4.1** Transfer learning end-to-end flow.


    ## Transfer Learning Implementation in Python


    Keras library comes with APIs to include various CNN architectures for a quick
    implementation of transfer learning in Python. [Table 4.1](#c4.xhtml#t4.1) lists
