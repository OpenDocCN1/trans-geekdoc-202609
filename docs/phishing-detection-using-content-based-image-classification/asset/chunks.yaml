- raw: 'Accuracy means how accurate is the classifier to classify phishing websites
    as “phish” class and legitimate websites as “not-phish” class. Accuracy is the
    ratio of all the correct classifications against the total images in the dataset.


    |   ACC \=   TP + TN   TP + TN + FP + FN     ||  |


    | --- | --- |


    TPR is the measure of the number of phishing websites correctly classified as
    “phish” among the total phishing images in the dataset. TPR is also termed as
    Recall.


    |   TPR \=   TP   TP + FN     ||  |


    | --- | --- |


    FPR is the measure of the number of legitimate websites classified as “phish”
    out of the total legitimate website images in the dataset.


    |   FPR \=   FP   FP + TN     ||  |


    | --- | --- |


    Another important performance metric that we will calculate here will be F1 score.
    F1 score is the harmonic mean of Recall (REC) and Precision (PRE).


    |   PRE \=   TP   TP + FP     ||  |


    | --- | --- |


    |   REC \= TPR \=   TP   FN + TP     ||  |


    | --- | --- |


    |   F1 \= 2 .   PRE .REC   PRE + REC     ||  |


    | --- | --- |


    In case of multi-class classification, the definition of all the metrics remains
    the same; however, the way they have to be inferred is different.


    Precision in the multi-class context would mean the number of web pages detected
    as a particular class, which actually belongs to that class. No other class is
    detected for that phishing brand. This would not be a good measure in case of
    detecting phishing websites, because it may miss out on detecting a lot of phishing
    websites as “phish”, but still would show a high value. For example, in the below
    confusion matrix, out of 27 Adobe web pages, only 11 web pages are classified
    correctly.


    For the confusion matrix depicted in [Figure 3.2](#c3.xhtml#f3.2), precision for
    “Adobe” is 100% as all the websites predicted as “Adobe” are actually Adobe, but
    there are many Adobe web pages that are detected as other brands. So, ideally
    the model does a very poor job detecting the right brand of the website. However,
    whatever brand the model detects will be almost correct.


    ![FIGURE 3.2 Confusion matrix example 1.](images/fig3.2.jpg)


    **FIGURE 3.2** Confusion matrix example 1.


    Recall, on the other hand, actually tells, for a given brand, how many of their
    web pages are detected correctly. For example, in the confusion matrix depicted
    in [Figure 3.3](#c3.xhtml#f3.3), out of 27 Adobe web pages, 21 web pages are classified
    correctly.


    ![FIGURE 3.3 Confusion matrix example 2.](images/fig3.3.jpg)


    **FIGURE 3.3** Confusion matrix example 2.


    Also, the mathematical formula for the calculation of the FP, FN, TP and TN for
    the multi-class classification through the values in the confusion matrix will
    be different from that of the binary classification. For the binary classification,
    values will be available in the respective cell of the confusion matrix as shown
    in [Table 3.3](#c3.xhtml#t3.3). However, for the multi-class classification, those
    values will be calculated using Python numpy library as below:


    |   FP \= cnf\_matrix .sum(axis=0) − np .diag   cnf\_matrix     ||  |


    | --- | --- |


    As per the formula for calculating FP, first all the images predicted as “Adobe”
    are to be calculated. For example, as per the confusion matrix in [Figure 3.3](#c3.xhtml#f3.3),
    we first add all the images which are predicted as “Adobe”, which is 27. Then
    we need to subtract the number of images that are actually “Adobe”, which is 21.
    Hence, FP for “Adobe” class is 27 − 21 = 6. This actually means that six images
    are predicted as “Adobe”, but are not. And similarly, FP for all the other classes
    is calculated.


    |   FN \= cnf\_matrix .sum(axis \= 1) − np .diag   cnf\_matrix     ||  |


    | --- | --- |


    As per the above formula for FN, we need to first calculate the number of all
    the images that are actually “Adobe”, which as per the confusion matrix in [Figure
    3.3](#c3.xhtml#f3.3) is 27. But as can be seen in the confusion matrix, out of
    the 27 actual “Adobe” images, 5 images are predicted as “other” class and one
    image is predicted as “PayPal” class.


    |   TP \= np .diag   cnf\_matrix     ||  |


    | --- | --- |


    TP basically means the number of images that were predicted correctly. As can
    be seen in the confusion matrix in Figure 3.11, all the images in the diagonal
    of the matrix are the ones that are predicted correctly.


    |   TN \= cnf\_matrix .sum() −   FP + FN + TP     ||  |


    | --- | --- |


    Further, the formula to calculate accuracy, precision, recall and so on will remain
    the same as in the binary classification.


    ## Building a Convolutional Neural Network Model


    Import required libraries.


    1. import tensorflow as tf


    2. from keras.models import Sequential


    3. from keras.layers import Convolution2D, MaxPooling2D, Dense, Flatten, Dropout,
    BatchNormalization, Activation


    Build a CNN architecture with three convolutional layers.


    1.  model = Sequential()


    2.  model.add(Convolution2D(32, (3, 3), input\_shape=(img\_rows, img\_cols, 3),
    padding=‘valid’))


    3.  model.add(Activation(‘relu’))


    4.  model.add(MaxPooling2D(pool\_size=(2, 2)))


    5.


    6.  model.add(Convolution2D(32, (3, 3), padding=‘valid’))


    7.  model.add(Activation(‘relu’))


    8.  model.add(MaxPooling2D(pool\_size=(2, 2)))


    9.


    10. model.add(Convolution2D(64, (3, 3), padding=‘valid’))


    11. model.add(Activation(‘relu’))


    12. model.add(MaxPooling2D(pool\_size=(2, 2)))


    Flatten the layer to convert the image representation after three convolutional
    layers into a 1D vector.


    13.model.add(Flatten())


    Ingest the 1D vector image representation into a fully connected dense layer for
    classification.


    14. model.add(Dense(64))


    15. model.add(Activation(‘relu’))


    16. model.add(Dropout(0.5))


    Finally, add an output layer with 15 neurons for 15 classes for classification.


    17. model.add(Dense(15))


    18. model.add(Activation(‘softmax’))


    Compile the model against accuracy, precision and recall performance metrics.


    19. model.compile(loss=‘categorical\_crossentropy’,


    20. optimizer=‘rmsprop’,


    21. metrics=\[‘accuracy’, tf.keras.metrics.Precision(), tf.keras.metrics.Recall()\])


    Print the model architecture summary.


    1. model.summary()


    ![](images/inline3.2.jpg)


    Set the epochs and batch size for the model training.


    1. epochs = 25


    2. batch\_size = 128


    Train the model.


    3. history = model.fit(trainX, trainY\_lb, batch\_size = batch\_size, epochs =
    epochs, verbose = 1, validation\_data = (testX, testY\_lb))


    ![](images/inline3.3.jpg)


    Compare the predicted labels with actual labels.


    4. y\_pred = model.predict\_classes(testX)


    5. print(“Actual Labels : ”, testY\_le)


    6. print(“Predicted Labels : ”, y\_pred)


    *   Actual Labels : \[ 3 3 3 ... 14 14 14\]


    *   Predicted Labels : \[11 11 11 ... 14 14 14\]


    Build a classification report.


    7. print(‘Classification Report’)


    8. print(classification\_report(testY\_le, y\_pred, target\_names=list(np.unique(test\_labels)))


    ![](images/inline3.4.jpg)


    Since data are unevenly distributed among the classes, the macro average from
    the classification report gives better performance metrics. As can be seen from
    the classification report, the macro average for precision is 69%, for recall
    is 58% and for accuracy is 61%.


    Build a confusion matrix for better visibility of predicted and actual classes.


    Reusable function to generate and plot the confusion matrix.


    1.  from \_\_future\_\_ import print\_function, division


    2.  from builtins import range, input


    3.  import itertools


    4.  import numpy as np


    5.  import matplotlib.pyplot as plt


    6.  from matplotlib.pyplot import figure


    7.


    8.


    9.  def plot\_confusion\_matrix(cm, classes,


    10. normalize=False,


    11. title=‘Confusion matrix’,


    12. cmap=plt.cm.Blues):


    13. “““


    14. This function prints and plots the confusion matrix.


    15. Normalization can be applied by setting \`normalize=True\`.


    16. “““


    17. if normalize:


    18. cm = cm.astype(‘float’) / cm.sum(axis=1)\[:, np.newaxis\]


    19. print(“Normalized confusion matrix”)


    20. else:


    21. print(‘Confusion matrix, without normalization’)


