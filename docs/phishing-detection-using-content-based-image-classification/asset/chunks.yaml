    ### Fusing PCA’d Features Vertically Extracted from the Last Convolution Layer
    and Class Imbalance Treatment in a Combination of Two CNN Models


    In this section, we will discuss the vertical fusion of the PCA’d data for all
    the applications in a combination of two CNN applications. With the same argument
    as explained in the section where fusion of PCA’d data is performed, fusing them
    among each other will result in the same dimensional data for all the applications
    ([Figure 7.5](#c7.xhtml#f7.5)).


    ![FIGURE 7.5 Vertical feature fusion of PCA treated data for two CNN applications.](images/fig7.5.jpg)


    **FIGURE 7.5** Vertical feature fusion of PCA treated data for two CNN applications.


    Additionally, since they are vertically fused, the number of columns will remain
