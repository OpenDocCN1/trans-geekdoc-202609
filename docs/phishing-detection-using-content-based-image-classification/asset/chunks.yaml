    features = feature_extractor.reshape(feature_extractor.shape[0], -1)\n\nX_test_feature\
    \ = model.predict(x_test)\nX_test_features = X_test_feature.reshape(X_test_feature.shape[0],\
    \ -1)\n\nnp.save(out_dir + \"DenseNet121_train_images\", features)\nnp.save(out_dir\
    \ + \"DenseNet121_test_images\", X_test_features)\n\n我们同样使用 DenseNet169 和 DenseNet201\
    \ 架构提取特征。\n\n最后，所有特征均使用各种 CNN 架构提取，这些特征是从通过调整图像大小到 128×128、256×256 和 512×512 的原始像素值中提取出来的，并保存到磁盘（见\
    \ Figure 5.2）。\n\n![FIGURE 5.2 图像特征数组的磁盘排列。](img/fig5.2.jpg)\n\n**FIGURE 5.2**\
    \ 图像特征数组的磁盘排列。\n\n**TABLE 5.2** 使用各种 CNN 应用提取训练集和测试集特征维度。\n\n| 应用 | 训练图像尺寸 | 测试图像尺寸\
    \ |\n| --- | --- | --- |\n| (128, 128, 3) | (256, 256, 3) | (128, 128, 3) | (256,\
    \ 256, 3) |\n| Xception | (1313, 32768) | (1313, 131072) | (1539, 32768) | (1539,\
    \ 131072) |\n| VGG16 | (1313, 8192) | (1313, 32768) | (1539, 8192) | (1539, 32768)\
    \ |\n| VGG19 | (1313, 8192) | (1313, 32768) | (1539, 8192) | (1539, 32768) |\n\
    | s | (1313, 32768) | (1313, 131072) | (1539, 32768) | (1539, 131072) |\n| ResNet101V2\
    \ | (1313, 32768) | (1313, 131072) | (1539, 32768) | (1539, 131072) |\n| ResNet152V2\
    \ | (1313, 32768) | (1313, 131072) | (1539, 32768) | (1539, 131072) |\n| InceptionV3\
    \ | (1313, 8192) | (1313, 73728) | (1539, 8192) | (1539, 73728) |\n| InceptionResNetV2\
    \ | (1313, 6144) | (1313, 55296) | (1539, 6144) | (1539, 55296) |\n| MobileNet\
    \ | (1313, 16384) | (1313, 65536) | (1539, 16384) | (1539, 65536) |\n| MobileNetV2\
    \ | (1313, 20480) | (1313, 81920) | (1539, 20480) | (1539, 81920) |\n| DenseNet121\
    \ | (1313, 16384) | (1313, 65536) | (1539, 16384) | (1539, 65536) |\n| DenseNet169\
    \ | (1313, 26624) | (1313, 106496) | (1539, 26624) | (1539, 106496) |\n| DenseNet201\
    \ | (1313, 30720) | (1313, 122880) | (1539, 30720) | (1539, 122880) |\n\n### 处理类别失衡\n\
    \n类别失衡是指数据集中每个类别的数据分布不均，导致训练模型时某一类的样本数量远多于其他类别。这可能导致模型偏向拥有更多训练样本的类别，因为该类别提供了更多的学习数据。因此，该类别的特征在模型学习中占主导地位，从而在训练过程中产生各种异常。因此，在将数据输入模型训练过程之前，必须对类别失衡进行预处理和处理。\n\
    \n"
