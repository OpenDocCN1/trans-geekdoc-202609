- raw: "| Approach 4 || Horizontal fusion of the features extracted in Approach 3\
    \ in a combination of two and three CNN applications |\n\n| Approach 5 || PCA\
    \ of the features extracted in Approach 3 and implement a machine learning classifier\
    \ |\n\n| Approach 6 || Horizontal fusion of the features extracted in Approach\
    \ 5 in a combination of two and three CNN applications |\n\n| Approach 7 || Vertical\
