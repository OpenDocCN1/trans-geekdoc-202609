    \ in a local datastore, which is used as a baseline for comparing similar features\
    \ from the websites under scrutiny. And based on the comparison result, the phishing\
    \ website is classified. Another approach is machine learning- or deep learning\
    \ classifier-based, where image features of phishing and legitimate webpages are\
    \ extracted and used to build a classifier for phishing detection.\n\n## Race\
    \ between Phishers and Anti-Phishers\n\nPhishers are continually upgrading their\
    \ skills and devising new and innovative ways to bypass all the security layers\
    \ and deceive innocent users. For example, many heuristic-based approaches validate\
    \ if the website under suspicion is SSL-enabled or not, to determine whether it\
    \ is a legitimate website or a phishing website. However, nowadays, the number\
    \ of phishing websites hosted on HTTPS is also increasing significantly.\n\nSimilarly,\
    \ for other significant predictors of a phishing website, phishers may find ways\
    \ to bypass all the rules employed to detect phishing, which is evident from the\
    \ upward trend of phishing attacks attempted in recent years. Hence, if phishers\
    \ find a way to bypass list-based, heuristic-based and hybrid anti-phishing detection\
    \ mechanisms, to redirect the users to the phishing website, then the image processing-based\
    \ anti-phishing techniques play a vital role in providing the final security layer\
    \ to the web users. In this book, we propose numerous machine learning and deep\
    \ learning methods that manually extract features using computer vision techniques\
    \ for phishing detection. However, there are two major limitations of these methods.\
    \ First, these methods utilize a comparison-based technique that requires creating\
    \ a large datastore of baseline values of legitimate websites. Second, these methods\
    \ rely on manual hand-crafted feature extraction techniques.\n\n# 2 Image Processing-Based\
    \ Phishing Detection Techniques\n\nDOI: [10.1201/9781003217381-2](https://doi.org/10.1201/9781003217381-2)\n\
    \nStudies and statistics suggest that phishing is still a pressing issue in the\
    \ world of cybercrime. Despite all the research, innovations and developments\
    \ made in phishing detection mechanisms, revenue losses through phishing attacks\
    \ are humongous, and therefore there is a pressing need to continue research on\
    \ various aspects of phishing, as anti-phishers are in an arms race with phishers.\
    \ And in order to win this race, anti-phishers need to think outside the box and\
    \ close all the doors before phishers enter users’ premises for theft.\n\nAssume\
    \ that phishers are able to make users bypass all the list-based, heuristic-based\
    \ and user awareness-based approaches, and finally made the user to land on the\
    \ phishing website. At this stage, by analyzing the website image, using image\
    \ processing techniques to classify whether the website in question is legitimate\
    \ or phishing, can be considered as a final resort to warn users for phishing\
    \ attack.\n\nAdditionally, list-based approaches cannot protect users from zero-day\
    \ attacks, and heuristics-based approaches are only good until phishers decipher\
    \ the underlying rules, because once they discover the underlying rules, they\
    \ find a way to bypass them. Hence, image processing techniques can provide a\
    \ last resort for the user’s protection.\n\n## Structure\n\nIn this chapter, we\
    \ will cover the following topics:\n\n*   Image processing-based phishing detection\
    \ techniques \n\n    *   Comparison-based techniques\n\n    *   Machine learning-based\
    \ techniques\n\n*   Challenges in phishing detection using website images\n\n\
    *   Comparison of techniques\n\n*   Summary of phishing detection using image\
    \ processing techniques\n\n## Objective\n\nAfter studying this chapter, you will\
    \ know various anti-phishing techniques previously invented and deployed using\
    \ image processing approaches for detecting phishing. You will also understand\
    \ the related technological challenges and limitations. Additionally, you will\
    \ be provided with a detailed comparison of all the techniques previously implemented\
    \ for detecting phishing.\n\n## Image Processing-Based Phishing Detection Techniques\n\
    \nImage processing-based phishing detection has offered two different solutions.\
    \ These solutions can be categorized as comparison-based or machine learning-based.\
    \ In both categories, the feature vector for certain image descriptors from the\
    \ image of a suspicious website is extracted. Now, for comparison-based solutions,\
    \ the difference in the visual appearance of the website in question is compared\
    \ with their legitimate counterpart and is calculated. Based on a certain threshold\
    \ for their visual difference, it is concluded whether the website in question\
    \ is phishing or not.\n\nIn the first category of solutions, the visual signatures\
    \ of a legitimate website are stored in a local database, and the visual signatures\
    \ of the suspicious website are extracted in runtime. Then the visual signatures\
    \ of the suspicious website are compared with those available in the datastore.\
    \ Based on the similarity score, the suspicious website is classified as legitimate\
    \ or fake.\n\n### Comparison-Based Techniques\n\nRosiello et al. (2007) proposed\
    \ a layout similarity-based approach using the DOM of the web page for detecting\
    \ phishing called DOMAntiPhish.\n\nIn this approach, the details of the DOM in\
    \ the form of a vector are stored in the cache of the system, and when a user\
    \ enters the same credentials in another website, again the DOM vectors are extracted\
    \ from the new website and are compared with those stored in the system cache.\
    \ If the information matches a certain threshold value, then the domain is compared,\
    \ and if the domain matches, it’s considered a legitimate website. But if the\
    \ domain doesn’t match, then it’s considered a phishing website, which must have\
    \ copied the DOM content of the legitimate website and deployed it on a different\
    \ domain. Such techniques have their own limitations in terms of their effectiveness\
    \ and scaling capabilities, as they only compare the DOM details already stored\
    \ on the system. But the takeaway from this approach is comparison of the domain\
    \ of the suspicious website once the phishing alarm is raised; in this case, suspicion\
    \ is raised through DOM comparison.\n\nSimilarly, various solutions utilize other\
    \ visual features of the suspicious website to extract and compare with the already-stored\
    \ legitimate website profile to detect phishing.\n\nPhishZoo (Afroz & Greenstadt,\
    \ 2011) is one such solution that uses URL, text contents, SSL (Secure Socket\
    \ Layer) certificates, images (especially logo) on the web page, HTML contents\
    \ and scripts. In this approach, a local datastore is maintained, which stores\
    \ the URL, SSL, images, HTML contents and scripts metadata of the legitimate websites.\
    \ During runtime, similar details are extracted from the website to which the\
    \ user navigates, and if matching URL and SSL are found in the local datastore,\
    \ then the website is declared legitimate. If they don’t match, then other details\
    \ like image and HTML contents are matched. If a match is not found, then the\
    \ website is declared legitimate, otherwise it is declared as phishing, since\
    \ all other contents match but not the URL and the SSL.\n"
  trans: "\n在基于像素的技术中，网络钓鱼检测主要通过两大类方法实现。一种方法是比较可疑网站图像的视觉签名与已存储的合法网站视觉签名。例如，手工制作的图像特征如\
    \ `SIFT` (Scale Invariant Feature Transform) (Lowe, 2004)、`SURF` (Speeded Up Robust\
    \ Features) (Bay et al., 2006)、`HOG` (Histogram of Oriented Gradient) (Li et al.,\
    \ 2016)、`LBP` (Local Binary Patterns) (Nhat & Hoang, 2019)、`DAISY` (Tola et al.,\
    \ 2010) 和 `MPEG7` (Rayar, 2017) 从合法网站中提取并存储在本地数据库中，作为比较网站下审查的相似特征的基准。根据比较结果，钓鱼网站被分类。另一种方法是基于机器学习或深度学习分类器，其中钓鱼和合法网页的图像特征被提取并用于构建钓鱼检测分类器。\n\
    \n## Race between Phishers and Anti-Phishers\n\n钓鱼者不断提升技能，并不断发明新颖的方法来绕过所有安全层，欺骗无辜用户。例如，许多基于启发式的方法会验证可疑网站是否启用\
    \ SSL，以判断其是合法网站还是钓鱼网站。然而，近年来，托管在 HTTPS 上的钓鱼网站数量也显著增加。\n\n同样，对于钓鱼网站的其他重要指标，钓鱼者可能会想方设法绕过所有用于检测钓鱼的规则，这在近年来钓鱼攻击尝试的上升趋势中已显而易见。因此，如果钓鱼者找到绕过列表式、启发式和混合反钓鱼检测机制的方法，将用户引导至钓鱼网站，那么基于图像处理的反钓鱼技术在为网页用户提供最终安全层方面发挥着重要作用。本书提出了多种手动提取特征的计算机视觉技术的机器学习和深度学习方法用于钓鱼检测。然而，这些方法存在两个主要局限性。第一，这些方法采用比较技术，需要创建大量合法网站基准值的本地数据库。第二，这些方法依赖于手动制作的特征提取技术。\n\
    \n# 2 Image Processing-Based Phishing Detection Techniques\n\nDOI: [10.1201/9781003217381-2](https://doi.org/10.1201/9781003217381-2)\n\
    \n研究和统计表明，钓鱼仍是网络犯罪领域的紧迫问题。尽管在钓鱼检测机制方面进行了大量研究、创新和发展，但钓鱼攻击导致的收入损失巨大，因此继续在钓鱼的各个方面进行研究刻不容缓，反钓鱼者与钓鱼者处于军备竞赛之中。为了在这场竞争中获胜，反钓鱼者需要跳出常规思维，在钓鱼者进入用户领域进行盗窃之前封闭所有入口。\n\
    \n假设钓鱼者能够让用户绕过列表式、启发式和用户意识基于的所有方法，最终使用户登录钓鱼网站。此时，通过分析网站图像，利用图像处理技术判断该网站是否合法或钓鱼，可以被视为最后手段，提醒用户钓鱼攻击。\n\
    \n此外，列表式方法无法保护用户免受零日攻击，启发式方法仅在钓鱼者尚未破解底层规则时有效，因为一旦他们发现规则，就会找到绕过它们的方法。因此，图像处理技术可以为用户的最后防护提供保障。\n\
    \n## Structure\n\n本章将覆盖以下主题：\n\n*   图像处理基础钓鱼检测技术 \n\n    *   比较式技术 \n\n    * \
    \  机器学习基础技术 \n\n*   使用网站图像进行钓鱼检测的挑战\n\n*   技术比较\n\n*   使用图像处理技术进行钓鱼检测的总结\n\n##\
    \ Objective\n\n在学习本章后，你将了解之前使用图像处理方法开发和部署的各种反钓鱼技术。你还将理解相关的技术挑战和局限性。此外，你将获得对所有已实施钓鱼检测技术的详细比较。\n\
    \n## Image Processing-Based Phishing Detection Techniques\n\n图像处理基础钓鱼检测提供了两种不同的解决方案。这两种方案可以分为比较式或机器学习式。在这两类中，从可疑网站图像中提取特定图像描述符的特征向量。对于比较式解决方案，需要将当前网站的视觉外观与其合法对照者进行比较并计算差异。根据某个视觉差异的阈值，判断该网站是否为钓鱼网站。\n\
    \n在第一类解决方案中，合法网站的视觉签名存储在本地数据库中，而可疑网站的视觉签名在运行时提取。然后将可疑网站的视觉签名与数据库中的签名进行比较。根据相似度得分，可疑网站被分类为合法或伪造。\n\
    \n### Comparison-Based Techniques\n\nRosiello et al. (2007) 提出了一种基于网页 DOM 相似度的方法，称为\
    \ DOMAntiPhish。\n\n在该方法中，DOM 详情以向量形式存储在系统缓存中，当用户在另一个网站使用相同凭据登录时，再次从新网站提取 DOM 向量并与系统缓存中的内容进行比较。如果信息符合一定阈值，则比较域名，域名匹配则视为合法网站；如果域名不匹配，则视为钓鱼网站，这意味着它复制了合法网站的\
    \ DOM 内容并在不同域名上部署。该技术在有效性和可扩展性方面存在局限，因为它仅比较系统中已存储的 DOM 细节。但其收获是：一旦通过 DOM 比较引发钓鱼警报，就需要比较可疑网站的域名；在此情况下，警报是通过\
    \ DOM 比较触发的。\n\n同样，许多解决方案利用可疑网站的其他视觉特征进行提取和比对，以检测钓鱼。\n\nPhishZoo (Afroz & Greenstadt,\
    \ 2011) 是一种此类解决方案，它使用 URL、文本内容、SSL 证书、网页图像（尤其是标志）、HTML 内容和脚本。该方法维护一个本地数据库，存储合法网站的\
    \ URL、SSL、图像、HTML 内容和脚本元数据。在运行时，从用户访问的网站中提取类似信息，如果在本地数据库中找到匹配的 URL 和 SSL，则该网站被声明为合法。如果它们不匹配，则会比对图像和\
    \ HTML 内容。如果未找到匹配，则网站被声明为合法；否则，由于除 URL 和 SSL 外所有内容匹配，网站被判定为钓鱼，因为 URL 和 SSL 不匹配。\n\
    \n"
