    ### Various Experimentations Using CNN


    The three high-level approaches we are going to experiment with in this study
    are traditional CNN, transfer learning and representation learning.


    **Traditional CNN**


    In this approach, we will build a custom CNN model with convolution layers and
    fully connected dense layers.


    **Transfer Learning**


    In this approach, learned parameters of CNN architectures till the last fully
    connected layer are used, and an added softmax layer is added for classification.


    **Representation Learning**


    1.  Features extracted from the last convolution layer and class balancing using
    SMOTE.


    2.  Features extracted from the last convolution layer and class balancing using
    SMOTE and with horizontal feature fusion.


    3.  Features extracted from the last convolution layer and class balancing using
    SMOTE and dimensionality reduction using PCA.


    4.  Features extracted from the last convolution layer and class balancing using
    SMOTE and dimensionality reduction using PCA with horizontal and vertical feature
    fusion.


    ## Summary


    Computer vision-based methods for phishing detection have numerous advantages
    over other traditional approaches. Since they depend on the screenshot of the
    website, computer vision-based methods are robust web page content manipulation
    methods used by phishers and are invariant from HTML versions. Most importantly,
    it works well on zero-hour attacks. In the next chapter, we will build a basic
    Convolutional Neural Network (CNN) classification model to classify the brand
    of the website images.


    # 3 Implementing CNN for Classifying Phishing Websites


    DOI: [10.1201/9781003217381-3](https://doi.org/10.1201/9781003217381-3)


    In the world of computer vision, classifying images into pre-defined classes has
    solved many complex problem statements. In this process, features extracted from
    images can be used to train a neural network to classify images. Classifying dogs,
    cats, airplanes, cars, and so on, are the most common implementations of computer
    vision. However, the network can be built to classify the brand of the website
    images. In this chapter, we will build a traditional Convolutional Neural Network
    (CNN) to classify website images as either phishing or non-phishing using an open
    dataset.


    ## Structure


    In this chapter, we will cover the following topics:


    *   Build a CNN model for image classification


    *   Classify phishing website images to their respective brands


    *   Define performance metrics


    ## Objective


    After studying this chapter, you should be able to build a basic convolutional
    neural network. You should be able to build a neural network to classify images
    into pre-defined classes. You will also learn how to validate the model and how
    to calculate the accuracy of the model. For a classification task, a few more
    metrics other than accuracy must be calculated to assess the performance of the
    model, which largely depends on the problem statement.


    ## Data Selection and Pre-Processing


    The Phish-IRIS dataset is generated by Dalgic et al. (2018) and is made publicly
    available (*Phish-IRIS Dataset – A Small Scale Multi-Class Phishing Web Page Screenshots
    Archive*, n.d.) for further exploring phishing detection techniques using phishing
    website images. It is a labeled dataset readily available for research work. The
    dataset comprises 2852 screenshots of websites containing images from 14 highly
    phished brands in their respective folders and images from legitimate web pages
    in one other folder. So overall it is a multi-class dataset with (14 + 1) classes.
    The data is collected from March to May 2018.


    [Table 3.1](#c3.xhtml#t3.1) shows the list of brands whose phishing web page images
    are present in the dataset along with the information of the number of images
    for each brand.


