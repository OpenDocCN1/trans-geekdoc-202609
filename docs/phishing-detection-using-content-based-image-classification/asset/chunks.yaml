    \n我们遵循了类似的过程，使用 ResNet101、ResNet152、ResNet50V2、ResNet101V2 和 ResNet152V2 提取特征。\n\
    \n## InceptionV3\n\nfrom keras.applications.inception_v3 import InceptionV3\n\n\
