    2.  Extracting image-based features from the website images and creating a visual
    signature of the website. Based on the comparison result it is decided whether
    the website in question is phish or not-phish.


    3.  Extracting image features of the websites and using the transformed features
    as an input to the machine learning algorithm to develop a classification model,
    which can classify whether the website in question is phish or not-phish.


