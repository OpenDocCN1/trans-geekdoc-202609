  trans: '

    准确率表示分类器将钓鱼网站分类为“钓鱼”类以及合法网站分类为“不钓鱼”类的准确程度。准确率是正确分类的总数占数据集中总图像数量的比例。


    |   ACC \=   TP + TN   TP + TN + FP + FN     ||  |


    | --- | --- |


    TPR 是衡量在数据集中所有钓鱼图像中，正确分类为“钓鱼”的钓鱼网站数量的比例。TPR 也称为召回率。


    |   TPR \=   TP   TP + FN     ||  |


    | --- | --- |


    FPR 是衡量在数据集中所有合法网站中，被错误分类为“钓鱼”的合法网站数量的比例。


    |   FPR \=   FP   FP + TN     ||  |


    | --- | --- |


    另一个重要的性能指标是 F1 分数。F1 分数是召回率（REC）和精确率（PRE）的调和平均数。


    |   PRE \=   TP   TP + FP     ||  |


    | --- | --- |


    |   REC \= TPR \=   TP   FN + TP     ||  |


    | --- | --- |


    |   F1 \= 2 .   PRE .REC   PRE + REC     ||  |


    | --- | --- |


    在多类分类中，所有指标的定义保持不变，但推导方式不同。


    在多类情境下，精确率的含义是：被检测为某一特定类别且实际属于该类的网页数量。对于钓鱼网站检测来说，这并不是一个理想的度量，因为可能会漏掉很多被标记为“钓鱼”的网站，但仍会显示出高值。例如，在下面的混淆矩阵中，27
    个 Adobe 网页中仅有 11 个被正确分类。


    对于 Figure 3.2 所示的混淆矩阵，Adobe 的精确率为 100%，因为所有被预测为“Adobe”的网站实际上都是 Adobe，但有很多 Adobe
    网页被误判为其他品牌。因此，模型在正确识别网站品牌方面表现很差。不过，模型所检测到的任何品牌基本上都是正确的。


    ![FIGURE 3.2 Confusion matrix example 1.](img/fig3.2.jpg)


    **FIGURE 3.2** Confusion matrix example 1.


    相反，召回率告诉我们，对于某个品牌，其网页被正确检测的数量。例如，在 Figure 3.3 所示的混淆矩阵中，27 个 Adobe 网页中有 21 个被正确分类。


    ![FIGURE 3.3 Confusion matrix example 2.](img/fig3.3.jpg)


    **FIGURE 3.3** Confusion matrix example 2.


    此外，计算多类分类中混淆矩阵的 FP、FN、TP 和 TN 的公式与二类分类不同。二类分类的数值直接位于混淆矩阵的相应单元格中，如 Table 3.3 所示；而多类分类则通过
    Python numpy 库计算：


    |   FP \= cnf\_matrix .sum(axis=0) − np .diag   cnf\_matrix     ||  |


    | --- | --- |


    根据 FP 公式，首先计算所有被预测为“Adobe”的图像数量。例如，在 Figure 3.3 中，预测为“Adobe”的图像总数为 27。然后减去实际为“Adobe”的图像数量，即
    21。因此，Adobe 类别的 FP 为 27 − 21 = 6。这意味着有 6 个图像被预测为“Adobe”，但实际上不是。


    |   FN \= cnf\_matrix .sum(axis \= 1) − np .diag   cnf\_matrix     ||  |


    | --- | --- |


    根据 FN 公式，首先需要计算实际为“Adobe”的图像总数，即 27。观察混淆矩阵可知，在 27 个实际“Adobe”图像中，有 5 个被预测为“其他”类，1
    个被预测为“PayPal”类。


    |   TP \= np .diag   cnf\_matrix     ||  |


    | --- | --- |


    TP 表示预测正确的图像数量。如 [Figure 3.11] 所示，矩阵对角线上的元素是预测正确的图像。


    |   TN \= cnf\_matrix .sum() −   FP + FN + TP     ||  |


    | --- | --- |


    准确率、精确率、召回率等计算公式与二类分类相同。


