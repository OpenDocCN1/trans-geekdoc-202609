    \ || 0.869 || 0.884 || 256 || NN |\n\n| 6 || VGG16\\_MobileNetV2\\_100 || 0.855\
    \ || 0.853 || 128 || RF |\n\n| 7 || VGG16\\_MobileNetV2\\_100 || 0.855 || 0.853\
    \ || 128 || RF |\n\n| 7 || VGG16\\_MobileNetV2\\_DenseNet169\\_100 || 0.85 ||\
    \ 0.847 || 128 || RF |\n\n| 2 || DenseNet169 || 0.791 || 0.825 || 128 || NN |\n\
    \nAs can be seen in [Table 8.2](#c8.xhtml#t8.2), the classifier built from features\
    \ extracted using DenseNet201 for the image size of (512, 512, 3) performed exceptionally\
    \ well when trained using the SVM classification algorithm.\n\nFor a multi-class\
    \ classification model, the performance of the DenseNet201-based model against\
    \ each class is shown in [Figure 5.1](#c5.xhtml#f5.1), and the confusion matrix\
    \ is shown in [Figure 5.2](#c5.xhtml#f5.2) ([Figures 8.1](#c8.xhtml#f8.1) and\
    \ [8.2](#c8.xhtml#f8.2)).\n\n![FIGURE 8.1 Performance metrics for DenseNet201\
    \ against each class.](images/fig8.1.jpg)\n\n**FIGURE 8.1** Performance metrics\
    \ for DenseNet201 against each class.\n\n![FIGURE 8.2 Confusion matrix for DenseNet201.](images/fig8.2.jpg)\n\
    \n**FIGURE 8.2** Confusion matrix for DenseNet201.\n\n### Comparison of the Best\
    \ Performing Model with the State-of-the-Art Technique\n\nState-of-the-art performance\
    \ of a machine learning-based classifier for the phish-IRIS dataset provided in\
    \ their official site (*Phish-IRIS Dataset – A Small Scale Multi-Class Phishing\
    \ Web Page Screenshots Archive*, n.d.) is explored to compare the best performing\
    \ model implemented in this chapter, as shown in [Table 8.3](#c8.xhtml#t8.3).\n\
    \n**TABLE 8.3** Comparison of Best Models with SOTA\n\n| Metrics || Phish-IRIS\
    \ SOTA || DenseNet201-SVM-512 |\n\n| --- | --- | --- |\n\n| True positive rate\
    \ || 90.60% || 90.80% |\n\n| --- | --- | --- |\n\n| False positive rate || 8.50%\
    \ || 1.20% |\n\n| F1 – measure || 90.50% || 90.60% |\n\nPerformance metrics of\
    \ all the approaches conducted in this study as per [Table 8.2](#c8.xhtml#t8.2),\
    \ along with the state-of-the-art results against True Positive Rate (Recall)\
    \ values, are shown in [Figure 8.3](#c8.xhtml#f8.3).\n\n![FIGURE 8.3 Comparison\
    \ based on recall among all approaches and SOTA.](images/fig8.3.jpg)\n\n**FIGURE\
    \ 8.3** Comparison based on recall among all approaches and SOTA.\n\nPerformance\
    \ metrics of all the approaches conducted in this study as per [Table 8.2](#c8.xhtml#t8.2),\
    \ along with the state-of-the-art results against F1 score values, are shown in\
    \ [Figure 8.4](#c8.xhtml#f8.4).\n\n![FIGURE 8.4 Comparison based on F1 score among\
    \ all approaches and SOTA.](images/fig8.4.jpg)\n\n**FIGURE 8.4** Comparison based\
    \ on F1 score among all approaches and SOTA.\n\nAs can be seen from Figures 5.4\
    \ and 5.5, the results yielded by SVM over features extracted via the DenseNet201\
    \ CNN model for the image size of (512, 512, 3) exceed the state-of-the-art performance\
    \ for this dataset.\n\n### Summary\n\nThe evaluation of a classification model\
    \ requires an understanding of the problem statement so that relevant performance\
    \ metrics can be chosen. In the case of phishing detection, True Positive Rate\
    \ is a better evaluation metric, which means that it is more important for the\
    \ classification model to predict all of the phishing websites as “phishing”,\
    \ even if that results in classifying few legitimate websites as “phishing”. At\
    \ the same time, it is also important for a classification model to limit the\
    \ number of legitimate websites as “phishing”; hence False Positive Rate is another\
    \ important metric for evaluation. Based on the relevant performance metrics,\
    \ the results of the various approaches implemented in this book are analyzed.\
    \ It has been observed that the DenseNet201 model, when trained on an image size\
    \ of (512, 512, 3) using SVM, produces the best results. Additionally, the best\
    \ performing model is compared against the state-of-the-art performance of the\
    \ dataset used in this study.\n\n# 9 Basics of Digital Image Processing\n\nDOI:\
    \ [10.1201/9781003217381-9](https://doi.org/10.1201/9781003217381-9)\n\nVision\
    \ is the most important capability that helps us navigate the physical world.\
    \ We all know that when light falls on an object and gets reflected, the reflection\
    \ is picked up by the eye, and the information about the object is passed to the\
    \ brain, the biological neural network, which finally deciphers the object in\
    \ view. This helps us differentiate between various objects, such as a car and\
    \ a motorcycle. It helps us to drive the car on a busy road.\n\nComputer vision\
    \ also follows a similar mechanism as biological vision. With the advancement\
    \ in computer vision technology, computers can now view the physical world as\
    \ we do, and can solve similar problems as a human does.\n\nAs humans, we solve\
    \ various kinds of problems on a day-to-day basis, without even appreciating the\
    \ incredible cognitive capability of the human body and the brain. With computer\
    \ vision technology, we envisage replicating similar capabilities in computers\
    \ as in humans. In some cases, we replicate the human capabilities, in others\
    \ we augment the human capabilities and in still others we surpass the human capabilities.\n\
    \nWith our vision, we are capable of differentiating between a dog, a cat and\
    \ a person. With computer vision, and by using artificial neural networks, the\
    \ computer can be trained to do the same. This comes under the category of computers\
    \ replicating human capabilities."
