    # 5 Feature Extraction and Representation Learning\n\nDOI: [10.1201/9781003217381-5](https://doi.org/10.1201/9781003217381-5)\n\
    \nAn end-to-end convolutional neural network comprises two major components. A\
    \ convolutional layer convolves an image and generates various representations\
    \ of the image. Once those vector representations are generated, they are fed\
    \ into a classification layer for the final classification task. The classification\
    \ layer can be either a machine learning model or a deep neural network model,\
    \ based on your choice or on the result of your experimentations.\n\nFeatures\
    \ can be manually extracted from images by using techniques like SIFT (Wu et al.,\
    \ 2013), SURF (Bay et al., 2006), DAISY (Tola et al., 2010), and so on, or can\
    \ be manually convolved using known kernels, weights of which are already defined.\
    \ Further, CNNs can be used to train the network to automatically learn the optimum\
    \ weights of the kernels used for the convolution process.\n\n## Structure\n\n\
    In this chapter, we will cover the following topics:\n\n*   Classification using\
    \ representation learning\n\n*   Treating class imbalance using SMOTE\n\n*   Building\
    \ a classification layer using machine learning algorithms\n\n*   Performance\
    \ assessment of various experimentations\n\n## Objective\n\nAfter studying this\
    \ chapter, you should be able to understand how features are extracted from images\
    \ using transfer learning, wherein state-of-the-art CNN architectures like Inception\
    \ (Szegedy et al., 2015), ResNet (He et al., 2016), DenseNet (Huang et al., 2017),\
    \ and so on will be used. Further, you will also learn how to use the extracted\
    \ features, which are vector representations of the images to be fed into a classification\
    \ model for classifying their classes. Lastly, performance metrics for all the\
    \ experimentations will be created and compared to pick the best performing model.\n\
    \n## Classification Using Representation Learning"
