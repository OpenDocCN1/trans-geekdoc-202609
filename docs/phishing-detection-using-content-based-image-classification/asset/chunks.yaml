    ### Summary


    In this chapter, we extracted pixel values from images as a numpy array. Then,
    with those pixel values ingested into state-of-the-art CNN models, features are
    extracted using various CNN models. Then imbalance class treatment is performed
    on the extracted feature dataset. Further, those features were used to train Random
    Forest and Support Vector Machine classification models. In the subsequent chapter,
    we will perform dimensionality reduction of the features extracted using CNN models
    in this chapter and will then use the extracted features to train the RF and SVM
    classification models.


    # 6 Dimensionality Reduction Techniques


    DOI: [10.1201/9781003217381-6](https://doi.org/10.1201/9781003217381-6)


    Principal Component Analysis (PCA) is the most prevalent dimensionality reduction
    technique. Any point in an n-dimensional space can be represented in a lower-dimensional
    plane using PCA. The advantages of reducing dimensions of the data points are
    many. Some of the important advantages of data compression are lower storage requirements,
    reduced computational time and cost and eliminating redundant features. Once features
    are extracted from images, the dimensions of those image vector representations
    can be reduced using PCA before feeding them into a classification layer.


    ## Structure


    In this chapter, we will cover the following topics:


    *   Basics of dimensionality reduction


    *   PCA implementation using Python


    *   Performance assessment of various experimentations


    ## Objective


    After studying this chapter, you should be aware of how the dimensionality reduction
    technique can be quickly implemented on data points using PCA and its implementation
    in Python.


    ## Dimensionality Reduction Using PCA


    We will also experiment with dimensionality reduction of the feature vectors extracted
    in the previous sections and retrain the classification model to validate if reducing
    the dimensions of the extracted features improves the result ([Figure 6.1](#c6.xhtml#f6.1)).


    ![FIGURE 6.1 Classification using dimensionality reduction overview.](images/fig6.1.jpg)


    **FIGURE 6.1** Classification using dimensionality reduction overview.


    ### PCA Python Implementation


    1. from sklearn.decomposition import IncrementalPCA


    2. pca = IncrementalPCA(n\_components=n\_components)


    3. X\_train = pca.fit\_transform(X\_train)


    4. X\_test = pca.transform(X\_test)


    Before X\_train and X\_test are ingested in the model for training and testing,
    respectively, they are PCA’d using the Python PCA implementation. Hence, for the
    classification process to remain intact, just the X\_train and X\_test data are
    transformed from their original features to PCA’d features.


    Basically, even if the data dimensions are different when the features are extracted
    using various CNN applications, after PCA treatment, all the data are converted
    to the same dimensions. [Table 6.1](#c6.xhtml#t6.1) demonstrates the dimensions
