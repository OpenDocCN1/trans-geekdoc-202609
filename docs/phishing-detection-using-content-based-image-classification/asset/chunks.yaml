    | 5 || MobileNet\\_500 || 0.884 || 0.88 || 128 || SVM |\n\n| 4 || VGG19\\_DenseNet169\
    \ || 0.884 || 0.883 || 128 || RF |\n\n| 5 || DenseNet169\\_100 || 0.883 || 0.88\
    \ || 256 || RF |\n\n| 6 || MobileNetV2\\_DenseNet169\\_DenseNet201\\_100 || 0.88\
    \ || 0.881 || 256 || RF |\n\n| 5 || MobileNet\\_100 || 0.877 || 0.874 || 128 ||\
    \ RF |\n\n| 7 || VGG16\\_DenseNet169\\_100 || 0.875 || 0.871 || 256 || RF |\n\n\
    | 6 || VGG16\\_DenseNet169\\_100 || 0.875 || 0.871 || 256 || RF |\n\n| 6 || MobileNet\\\
    _MobileNetV2\\_DenseNet201\\_100 || 0.873 || 0.873 || 128 || RF |\n\n| 7 || VGG16\\\
