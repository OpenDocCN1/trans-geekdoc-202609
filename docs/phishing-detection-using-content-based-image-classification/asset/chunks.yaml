    \ data array. So, as can be seen in [Table 5.1](#c5.xhtml#t5.1), there are 1313\
    \ rows in the train data array, meaning 1313 rows in the train label array, with\
    \ one label corresponding to each data record.\n\n## Feature Extraction Using\
    \ CNN Off-the-Shelf Architectures\n\nIn the previous step, raw pixel values are\
    \ extracted from the images and stored as numpy arrays.\n\nIn this step, the raw\
    \ pixel values of the images will be used to create representations of the images\
    \ using various off-the-shelf CNN architectures like VGGNet, ResNet, DenseNet,\
    \ Inception, Exception, and so on.\n\nFirst, load the required Python libraries.\n\
    \n1. import numpy as np\n\n2. import matplotlib.pyplot as plt\n\n3. import glob\n\
    \n4. import cv2\n\n5. import os\n\n6. import seaborn as sns\n\n7. from keras.models\
    \ import Model, Sequential\n\n8. from keras.layers import Dense, Flatten, Conv2D,\
    \ MaxPooling2D\n\n9. from keras.layers.normalization import BatchNormalization\n\
    \nData extracted from the previous step will be used as the input for this step.\
    \ Hence, set the input and output data directory locations.\n\n1. SIZE = 512\n\
    \n2. data_dir=“../../data_extractor/”+str(SIZE)+”/”\n\n3. out_dir=str(SIZE)+”/”\n\
    \n4. print(os.listdir(data_dir))\n\n['train_images.npy', 'test_images.npy', 'test_labels.npy',\
    \ 'train_labels.npy']\n\nLoad the raw pixel value data arrays.\n\n1. train_images\
    \ = np.load(data_dir+’/train_images.npy’)\n\n2. test_images = np.load(data_dir+’/test_images.npy’)\n\
    \n3. train_labels= np.load(data_dir+’/train_labels.npy’)\n\n4. test_labels = np.load(data_dir+’/test_labels.npy’)\n\
    \nThe labels are in a raw text format; hence they need to encode the labels from\
    \ text to integers using the sklearn LabelEncoder module.\n\n1. from sklearn import\
    \ preprocessing\n\n2. le = preprocessing.LabelEncoder()\n\n3. le.fit(train_labels)\n\
    \n4. train_labels_encoded = le.transform(train_labels)\n\n5. test_labels_encoded\
    \ = le.transform(test_labels)\n\nPickle the label encoder for future inverse encoding\
    \ of labels to text for plotting a confusion matrix and classification reports.\n\
    \n6. *#pickle the label encoder*\n\n7. np.save(out_dir+’label_encoder.npy’, le.classes_)\n\
    \nRename the datasets to standard naming conventions used for machine learning\
    \ processing.\n\n1. x_train, y_train, x_test, y_test = train_images, train_labels_encoded,\
    \ test_images, test_labels_encoded\n\nNormalize the pixel values to bring them\
    \ between 0 and 1.\n\n1. x_train, x_test = x_train / 255.0, x_test / 255.0\n\n\
    Save the train and test labels to disk.\n\n1. np.save(out_dir+”train_labels”,\
    \ y_train)\n\n2. np.save(out_dir+”test_labels”, y_test)\n\nNext, we will extract\
    \ features using various off-the-shelf CNN architectures.\n\n## Xception\n\n1.  from\
    \ keras.applications.xception import Xception\n\n2.\n\n3.  *# Load model without\
    \ classifier/fully connected layers*\n\n4.  model = Xception(weights=‘imagenet’,\
    \ include_top=False, input_shape=(SIZE, SIZE, 3))\n\n5.\n"
  trans: "\n表示学习技术允许用户从各种卷积层中提取特征，然后将这些特征输入到用户选择的分类模型中，无论是机器学习还是深度学习分类器。\n\n在本研究中，我们将使用各种预设的\
    \ CNN 应用（如`VGGNet`、`ResNet`、`MobileNet`、`DenseNet`、`Xception`、`Inception`等）通过表示学习方法提取特征，然后构建`RF`和`SVM`分类模型，用于对\
    \ 15 个类别进行分类（Figure 5.1）。\n\n![FIGURE 5.1 Classification using representation\
    \ learning overview.](img/fig5.1.jpg)\n\n**FIGURE 5.1** Classification using representation\
    \ learning overview.\n\n### 数据准备\n\n作为数据准备的第一步，图像被转换为 NumPy 数组。提取的图像数组将进一步通过转移学习技术输入卷积层以提取特征。\n\
    \n## 转换图像为 NumPy 数组\n\n首先，我们将图像转换为 NumPy 数组。训练和测试数据的图像数组将保存为带有.npy 扩展名的 NumPy\
    \ 文件，以便后续处理。\n\n使用 Python 的 OpenCV 和 NumPy 库将图像转换为 NumPy 数组。训练和验证文件夹中的图像尺寸各不相同，尺寸范围在宽度和高度之间为\
    \ 700 像素到 1280 像素。因此，需要调整图像大小，使所有图像保持相同的尺寸格式。基本上，图像尺寸越大，图像中可用的像素越多，从而可以从图像中提取更多低层次特征。但通过缩小图像尺寸，像素会被压缩，从而可以从图像中提取更多高层次特征。\n\
    \n由于计算限制，我们决定将图像转换为大小为(128, 128, 3)和(256, 256, 3)的数组，并研究图像尺寸是否会影响在提取图像相关特征以实现有效分类时的模型性能。\n\
    \n为此，我们将使用 Python OpenCV 库。\n\n1. import os\n\n2. import glob\n\n3. import cv2\n\
    \n设置数据目录和输出目录位置。设置 size 变量为 512，用于将图像调整为 512×512 数组。\n\n4. SIZE = 512\n\n5. data_dir=“../../../data/phishIRIS/”\n\
    \n6. out_dir=str(SIZE)+”/”\n\n通过遍历训练和测试数据集文件夹中的每个文件夹，创建训练和测试数据数组。\n\n7. *# train*\n\
    \n8.  train_images = []\n\n9.  train_labels = []\n\n10. for directory_path in\
    \ glob.glob(data_dir+”train/\\*”):\n\n11.    train_label = directory_path.split(“/”)\\\
    [-1\\]\n\n12.    for img_path in glob.glob(os.path.join(directory_path, ”\\*.\\\
    *”)):\n\n13.     img = cv2.imread(img_path, cv2.IMREAD_COLOR)\n\n14.     img =\
    \ cv2.resize(img, (SIZE, SIZE))\n\n15.     img = cv2.cvtColor(img, cv2.COLOR_RGB2BGR)\n\
    \n16.     train_images.append(img)\n\n17.     train_labels.append(train_label)\n\
    \n18.\n\n19. train_images = np.array(train_images)\n\n20. train_labels = np.array(train_labels)\n\
    \n21.\n\n22.\n\n23. *# test*\n\n24. test_images = []\n\n25. test_labels = []\n\
    \n26. for directory_path in glob.glob(data_dir+”val/\\*”):\n\n27.  test_label\
    \ = directory_path.split(“/”)\\[-1\\]\n\n28.  for img_path in glob.glob(os.path.join(directory_path,\
    \ ”\\*.\\*”)):\n\n29.     img = cv2.imread(img_path, cv2.IMREAD_COLOR)\n\n30.     img\
    \ = cv2.resize(img, (SIZE, SIZE))\n\n31.     img = cv2.cvtColor(img, cv2.COLOR_RGB2BGR)\n\
    \n32.     test_images.append(img)\n\n33.     test_labels.append(test_label)\n\n\
    34.\n\n35. test_images = np.array(test_images)\n\n36. test_labels = np.array(test_labels)\n\
    \n保存数组到磁盘。\n\n37. np.save(out_dir+”train_images”, train_images)\n\n38. np.save(out_dir+”test_images”,\
    \ test_images)\n\n39. np.save(out_dir+”train_labels”, train_labels)\n\n40. np.save(out_dir+”test_labels”,\
    \ test_labels)\n\n图像可以调整到任意尺寸，相应的 NumPy 数组可以从图像中提取。保存在磁盘上的图像将具有.npy 扩展名，表示 NumPy\
    \ 数组。\n\nTable 5.1 显示在将图像调整到(128, 128)和(256, 256)高度和宽度尺寸后，训练数据和测试数据的维度。\n\n**TABLE\
    \ 5.1** 训练数据和测试数据图像数组维度\n\n| 数据 || 维度  \n\n(128, 128)  \n\n || 维度  \n\n(256, 256)\
    \  \n\n |\n\n| --- | --- | --- |\n\n| 训练数据 || (1313, 128, 128, 3) || (1313, 256,\
    \ 256, 3) |\n\n| --- | --- | --- |\n\n| 训练标签 || (1313,) || (1313,) |\n\n| 测试数据\
    \ || (1539, 128, 128, 3) || (1539, 256, 256, 3) |\n\n| 测试标签 || (1539,) || (1539,)\
    \ |\n\n总共有 1313 张训练图像和 1538 张测试图像。由于图像是彩色图像，通道数为三，分别代表 R(红)、G(绿)和 B(蓝)通道。\n\n\
    训练和测试标签数组包含与相应图像数据在数组中存储的顺序相同的文件夹名称。如 Table 5.1 所示，训练数据数组有 1313 行，意味着训练标签数组也有\
    \ 1313 行，每一行对应一条数据记录。\n\n## 使用 CNN 预设架构进行特征提取\n\n在前一步，原始像素值从图像中提取并保存为 NumPy 数组。\n\
    \n在此步骤中，图像的原始像素值将用于使用各种预设 CNN 架构（如 VGGNet、ResNet、DenseNet、Inception、Exception\
    \ 等）创建图像的表示。\n\n首先，加载所需的 Python 库。\n\n1. import numpy as np\n\n2. import matplotlib.pyplot\
    \ as plt\n\n3. import glob\n\n4. import cv2\n\n5. import os\n\n6. import seaborn\
    \ as sns\n\n7. from keras.models import Model, Sequential\n\n8. from keras.layers\
    \ import Dense, Flatten, Conv2D, MaxPooling2D\n\n9. from keras.layers.normalization\
    \ import BatchNormalization\n\n前一步提取的数据将作为本步骤的输入。因此，设置输入和输出数据目录位置。\n\n1. SIZE\
    \ = 512\n\n2. data_dir=“../../data_extractor/”+str(SIZE)+”/”\n\n3. out_dir=str(SIZE)+”/”\n\
    \n4. print(os.listdir(data_dir))\n\n['train_images.npy', 'test_images.npy', 'test_labels.npy',\
    \ 'train_labels.npy']\n\n加载原始像素值数据数组。\n\n1. train_images = np.load(data_dir+’/train_images.npy’)\n\
    \n2. test_images = np.load(data_dir+’/test_images.npy’)\n\n3. train_labels= np.load(data_dir+’/train_labels.npy’)\n\
    \n4. test_labels = np.load(data_dir+’/test_labels.npy’)\n\n标签为原始文本格式，因此需要使用 sklearn\
    \ 的 LabelEncoder 模块将文本标签编码为整数。\n\n1. from sklearn import preprocessing\n\n2. le\
    \ = preprocessing.LabelEncoder()\n\n3. le.fit(train_labels)\n\n4. train_labels_encoded\
    \ = le.transform(train_labels)\n\n5. test_labels_encoded = le.transform(test_labels)\n\
    \n将标签编码器序列化以便以后用于将标签反向编码为文本，用于绘制混淆矩阵和分类报告。\n\n6. *#pickle the label encoder*\n\
    \n7. np.save(out_dir+’label_encoder.npy’, le.classes_)\n\n将数据集重命名为机器学习处理中使用的标准命名约定。\n\
    \n1. x_train, y_train, x_test, y_test = train_images, train_labels_encoded, test_images,\
    \ test_labels_encoded\n\n2. x_train, x_test = x_train / 255.0, x_test / 255.0\n\
    \n3. np.save(out_dir+”train_labels”, y_train)\n\n4. np.save(out_dir+”test_labels”,\
    \ y_test)\n\n接下来，我们将使用各种预设 CNN 架构提取特征。\n\n## Xception\n\n1.  from keras.applications.xception\
    \ import Xception\n\n2.\n\n3.  *# Load model without classifier/fully connected\
    \ layers*\n\n4.  model = Xception(weights=‘imagenet’, include_top=False, input_shape=(SIZE,\
    \ SIZE, 3))\n\n"
