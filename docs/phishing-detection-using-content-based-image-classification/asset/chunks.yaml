    ### 多种实验设置


    本研究将尝试三种高层次的方法：传统 CNN、迁移学习和表征学习。


    **传统 CNN**


    在该方法中，我们将构建一个自定义 CNN 模型，包含卷积层和全连接密集层。


    **迁移学习**


    在该方法中，使用到 CNN 架构的最后全连接层之前的已学参数，并添加一个 softmax 层用于分类。


    **表征学习**


    1. 从最后卷积层提取特征并使用 SMOTE 对类进行平衡。


    2. 从最后卷积层提取特征并使用 SMOTE 对类进行平衡，同时进行水平特征融合。


    3. 从最后卷积层提取特征并使用 SMOTE 对类进行平衡，同时使用 PCA 进行维度降低。


    4. 从最后卷积层提取特征并使用 SMOTE 对类进行平衡，同时使用 PCA 进行维度降低，并进行水平和纵向特征融合。


    ## 总结


    基于计算机视觉的防钓鱼方法相较于其他传统方法具有诸多优势。由于它们依赖于网站的截图，计算机视觉方法能够抵御钓鱼者对网页内容的操纵，并且不受 HTML 版本的影响。最重要的是，它们能够应对零时段攻击。在下一章节，我们将构建一个基本的卷积神经网络（CNN）分类模型，用于识别网站图像的品牌。


    # 3 实现 CNN 以分类防钓鱼网站


    DOI: [10.1201/9781003217381-3](https://doi.org/10.1201/9781003217381-3)


    在计算机视觉领域，将图像分类到预定义类别已解决了许多复杂的问题。在这个过程中，从图像中提取的特征可以用于训练神经网络进行图像分类。常见的实现包括分类狗、猫、飞机、汽车等。然而，网络也可以被构建用于分类网站图像。本章，我们将使用一个公开数据集，构建传统的卷积神经网络（CNN）来分类网站图像为钓鱼网站或非钓鱼网站。


    ## 结构


    本章将涵盖以下主题：


    * 构建用于图像分类的 CNN 模型


    * 将防钓鱼网站图像分类到相应的品牌


    * 定义性能指标


    ## 目标


    学习本章后，您应能够构建一个基础卷积神经网络。您应能够构建神经网络以将图像分类到预定义类别中。您还将学习如何验证模型以及如何计算模型的准确率。对于分类任务，除了准确率外，还需要计算几个其他指标来评估模型性能，这主要取决于问题描述。


    ## 数据选择与预处理


    Phish-IRIS 数据集由 Dalgic 等人（2018）生成，并公开发布（*Phish-IRIS Dataset – A Small Scale Multi-Class
    Phishing Web Page Screenshots Archive*，n.d.），用于进一步利用网站图像进行防钓鱼技术研究。该数据集为研究人员提供了标记的数据，便于研究防钓鱼技术。数据集包含
    2852 张包含 14 个高度钓鱼品牌及其截图的网页图像，以及一个包含合法网页的文件夹。因此，它是一个多类数据集，共有 (14 + 1) 类。数据收集时间为
    2018 年 3 月至 5 月。


