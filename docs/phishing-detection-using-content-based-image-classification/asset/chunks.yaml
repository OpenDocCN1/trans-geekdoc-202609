- raw: 'One of the noticeable heuristic-based anti-phishing mechanisms that also uses
    images of a web page is GoldPhish (Dunlop et al., 2010), which uses OCR technology
    (*Optical Character Recognition Wikipedia*, n.d.) to extract text from the logo
    of a web page. Once the brand name is extracted, GoldPhish uses Google’s PageRank
    algorithm to get the top five web pages using the extracted text from the logo.
    Then the suspicious web page domain is compared with the top five domains returned
    from the Google search API, and if the suspicious website domain does not match
    with any of the five domains, then it’s declared a phishing website.


    GoldPhish is different from other comparison-based image processing mechanisms
    since it stores no data in any local datastore; it instead uses Google APIs to
    extract information at runtime. But the downside of this approach is that it is
    dependent on OCR technology service providers and is also dependent on Google’s
    PageRank algorithm.


    GoldPhish utilizes OCR technology to extract the logo of the web page, while Verilogo
    (Wang, 2010) uses a SIFT image descriptor (Lowe, 2004) to extract the logo of
    the given suspicious website.


    Verilogo not only extracts the logo using a SIFT descriptor, but also deploys
    multi-level phishing detection mechanisms. If the logo of the extracted website
    does not match any logo in the local datastore, the website is assumed legitimate,
    since there is no data available for comparison, and hence the user is allowed
    to continue on the website. Therefore the phishing detection capability of Verilogo
    is limited only to the brands whose legitimate logos are stored in the datastore.


    Furthermore, if the logo matches with the existing logo in the datastore, two
    more levels of detection are employed: first the DNS lookup of the website, and
    second, the keypress, which basically comes under the heuristics approach.


    One such solution is described in this chapter (Rao & Ali, 2015), where a computer
    vision technique called SURF descriptors (Bay et al., 2006) is used to extract
    discriminative key point descriptors of both legitimate and suspicious websites,
    and based on the similarity threshold, a warning for further inspection of the
    suspicious website is displayed.


    Another comparison-based phishing detection application utilizes Contrast Context
    Histograms (CCH) descriptors (Chen et al., 2009) to compare the similarity degree
    between suspicious and authentic web pages. In this approach, in step 1, features
    of suspicious websites are extracted using CCH descriptors and are compared with
    those stored locally. And in step 2, the decision of phish or not-phish is established
    based on a pre-defined similarity threshold, which in this case is 0.6.


    Along similar lines, where image descriptors of the suspicious websites are compared
    with some locally stored legitimate website descriptors, is the one which utilizes
    HOG image descriptors to detect phishing (Bozkir & Sezer, 2016). Basically, HOG
    features of the highly vulnerable websites’ images are extracted, and visual signatures
    of those websites are stored in a local datastore. And during runtime, the same
    HOG features of the suspicious websites are extracted, and the similar visual
    signature of the suspicious website is compared with their legitimate counterpart
    websites’ visual signatures in the local datastore. And based on this comparison,
    the website is classified as phishing or legitimate.


    ### Machine Learning-Based Techniques


    We next discuss the machine learning-based classification mechanism for phishing
    detection. Similar to the comparison-based approach, features are extracted from
    website images. However, unlike comparison-based approaches, wherein the extracted
    features are compared with the locally stored legitimate features, here patterns
    are extracted from those features using some machine learning algorithms, and
    a classification model is built, which is used for phishing detection in real
    time.


    One such approach is PhishIRIS (Dalgic et al., 2018), which utilizes MPEG7 (Rayar,
    2017) and MPEG7 like Compact Visual Descriptors (CVD), Scalable Colour descriptor
    (SCD), Colour Layout Descriptor (CLD), CEDD, Fuzzy Colour and Textual Histogram
    (FCTH) and Joint Composite Descriptors (JCD). Some of the aforementioned descriptors
    are extracted by the fusion of multiple descriptors, as described in this chapter
    (Chatzichristofis et al., 2010). It discusses the behavior of Compact Composite
    Descriptor in Early Fusion, Late Fusion and Distributed Image retrieval.


    The aforementioned image descriptors are extracted from the website snapshot,
    transformed into feature vectors and fed into machine learning algorithms like
    Support Vector Machine (SVM) and Random Forest (RF) to classify the website as
    legitimate or phishing.


    Dalgic et al. (2018) developed an open-source dataset which comprises website
    images of 14 different highly phished brands, popularly known as Phish-IRIS (*Phish-IRIS
    Dataset – A Small Scale Multi-Class Phishing Web Page Screenshots Archive*, n.d.).


    Eroğlu et al. (2019) explore GIST and LBP features to determine the brand of the
    phishing web pages. In this study, GIST and LBP features are extracted and input
    into machine learning algorithms like SVM, RF and XGB for the classification task.
    The GIST descriptor focuses on the outline of an object in the image. The LBP
    descriptor identifies each pixel with two codes and analyses the textures of a
    local patch by comparing the central pixel to neighboring pixels. Using these
    two image descriptors, the researchers used two feature extraction schemes: (1)
    holistic and (2) multi-level patches.


    In a holistic scheme, the feature vector is generated using the full website image.
    And in a multi-level patches scheme, the image is divided into multiple patches
    like 2 × 2 and 3 × 3 patches and features are extracted and fed into three machine
    learning classifiers built using SVM, Random Forest and XGBoost algorithms. The
    results are evaluated based on accuracy, false positive rate, true positive rate
    and F1 score metrics. Among all the iterations on different ML models, GIST with
    XGBoost appears to be the most accurate and the fastest. Each evaluation takes
    around 1.5 seconds, which makes this model fit to be deployed as a plugin on a
    web browser for real-time detection.


    Bozkır and Aydos (2019) explore the SIFT (Wu et al., 2013) and DAISY (Tola et
    al., 2010) features to determine the brand of the phishing web pages. The feature
    vector extracted via SIFT and DAISY is further fused with the bag of visual words
    (BOVW) and fed into SVM, XGB and RF classifiers for the classification. SIFT with
    400 BOVW fed into XGBoost results in the optimum evaluation metrics of accuracy,
    TPR, FPR and F1 score.


    ## Challenges in Phishing Detection Using Website Images


    The major challenges in phishing detection using only website images are:


    1.  Since phishing websites are built visually similar to their legitimate counterparts,
    the whole HTML of a legitimate website may be used to build a phishing website.
    But usually phishers will not do so, because phishing detection mechanisms based
    on HTML comparison are already in place. Hence, if they do this, they will be
    caught right at the outset.


    2.  Storing a huge corpus of legitimate image visual signatures for comparison
    needs a huge datastore for maintaining and scanning, plus regular updates of such
    datastore.


    3.  In order to compare the text-based visual signatures of the website image
    in question, their legitimate counterparts depend on third-party tools like OCR
    tools, Google API, and so on.


    4.  In order to extract the brand of the phishing website, which can be later
    used to compare the domain with the legitimate website, region of interest and
    various image invariances have to be factored in to build a machine learning model
    accordingly.'
