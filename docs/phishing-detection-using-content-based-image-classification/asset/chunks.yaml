    In a holistic scheme, the feature vector is generated using the full website image.
    And in a multi-level patches scheme, the image is divided into multiple patches
    like 2 × 2 and 3 × 3 patches and features are extracted and fed into three machine
    learning classifiers built using SVM, Random Forest and XGBoost algorithms. The
    results are evaluated based on accuracy, false positive rate, true positive rate
    and F1 score metrics. Among all the iterations on different ML models, GIST with
    XGBoost appears to be the most accurate and the fastest. Each evaluation takes
    around 1.5 seconds, which makes this model fit to be deployed as a plugin on a
    web browser for real-time detection.


    Bozkır and Aydos (2019) explore the SIFT (Wu et al., 2013) and DAISY (Tola et
    al., 2010) features to determine the brand of the phishing web pages. The feature
    vector extracted via SIFT and DAISY is further fused with the bag of visual words
    (BOVW) and fed into SVM, XGB and RF classifiers for the classification. SIFT with
    400 BOVW fed into XGBoost results in the optimum evaluation metrics of accuracy,
    TPR, FPR and F1 score.


    ## Challenges in Phishing Detection Using Website Images


    The major challenges in phishing detection using only website images are:


    1. Since phishing websites are built visually similar to their legitimate counterparts,
    the whole HTML of a legitimate website may be used to build a phishing website.
    But usually phishers will not do so, because phishing detection mechanisms based
    on HTML comparison are already in place. Hence, if they do this, they will be
    caught right at the outset.


    2. Storing a huge corpus of legitimate image visual signatures for comparison
    needs a huge datastore for maintaining and scanning, plus regular updates of such
    datastore.


    3. In order to compare the text-based visual signatures of the website image in
    question, their legitimate counterparts depend on third-party tools like OCR tools,
    Google API, and so on.


    4. In order to extract the brand of the phishing website, which can be later used
    to compare the domain with the legitimate website, region of interest and various
    image invariances have to be factored in to build a machine learning model accordingly.

