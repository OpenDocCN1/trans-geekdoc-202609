  \ 6000），但列数会根据拼接的应用数量增加，这里为 2。\n\nPython 实现技术。\n\n1. import tensorflow as tf\n\n\
  2. def getData(model1, model2, image_size, n_component):\n\n3.  X_data_dir= \"../pca/\"\
