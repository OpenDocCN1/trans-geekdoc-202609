  \ 30720) | (1313, 122880) | (1539, 30720) | (1539, 122880) |\n\n### 处理类别失衡\n\n类别失衡是指数据集中每个类别的数据分布不均，导致训练模型时某一类的样本数量远多于其他类别。这可能导致模型偏向拥有更多训练样本的类别，因为该类别提供了更多的学习数据。因此，该类别的特征在模型学习中占主导地位，从而在训练过程中产生各种异常。因此，在将数据输入模型训练过程之前，必须对类别失衡进行预处理和处理。\n\
  \n\n\n\n对于 Phish-IRIS 数据集，如 Table 3.1 所示，\"其他\" 类的图像数量为 400，而其余所有类的图像数量在 50–150\
  \ 之间。这显然是各类数据的不平衡分布。因此，在用于模型训练前，必须对数据进行类不平衡处理。\n\n### 使用 SMOTE 添加合成数据\n\n不平衡数据集可以通过下采样多数类或上采样多数类来处理。这两种方法各有优缺点。在处理类不平衡时，广泛使用的更高级技术是\
  \ Synthetic Minority Over-sampling Technique（SMOTE）。\n\n该技术由 Chawla 等人于 2002 年提出，其工作原理是先将数据集中的所有数据点置于\
  \ n 维平面中，然后使用 K 最近邻算法，为少数类生成合成数据点。\n\n由于多类分类中，某一类（在此为 \"其他\" 类）的记录最大数量为 400，因此需要为其他所有类添加合成数据，使它们的数量达到\
  \ 400。由于总共有 15 个类别，应用 SMOTE 上采样技术后，每个类别的记录数将变为 400，训练数据总数变为 6000（即 400 × 15）。\n\n\
  Table 5.3 展示了在不同 CNN 应用中应用 SMOTE 后训练数据数组维度。\n\n**TABLE 5.3** 应用 SMOTE 后训练数据维度\n\n\
  | Application || Image Size  \n\n(128, 128, 3)  \n\n || Image Size  \n\n(256, 256,\
  \ 3)  \n\n |\n\n| --- | --- | --- |\n\n| Xception || (6000, 32768) || (6000, 131072)\
