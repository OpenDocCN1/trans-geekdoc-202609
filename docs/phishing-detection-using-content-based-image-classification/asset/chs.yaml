  \ signifies the best results in the table. |\n\n| --- |\n\n## 总结\n\n在本章中，我们首先对图像进行增强，然后使用\
  \ VGGNet、DenseNet、ResNet 等最先进的卷积神经网络进行转移学习。还提供了 DenseNet 实现的 Python 代码。此外，还给出了其他架构的实验结果，供在表中比较模型性能。后续章节将进行特征提取和表示学习，利用这些模型提取特征，并将提取的特征输入机器学习模型进行分类。最后，将创建并比较所有实验的性能指标，以选出表现最佳的模型。\n\
  \n## 5 Feature Extraction and Representation Learning\n\nDOI: [10.1201/9781003217381-5](https://doi.org/10.1201/9781003217381-5)\n\
  \n一个端到端的卷积神经网络由两个主要组成部分组成。卷积层对图像进行卷积并生成图像的各种表示。一旦这些向量表示被生成，它们将被输入分类层进行最终分类任务。分类层可以是机器学习模型或深度神经网络模型，具体取决于您的选择或实验结果。\n\
  \n特征可以通过 SIFT (Wu et al., 2013)、SURF (Bay et al., 2006)、DAISY (Tola et al., 2010)\
  \ 等技术手动从图像中提取，或者可以通过已知卷积核、其权重已定义的方式手动卷积。此外，CNN 可以用于训练网络自动学习卷积核的最佳权重。\n\n### 结构\n\
  \n本章将涵盖以下主题：\n\n*   使用表示学习进行分类\n\n*   使用 SMOTE 处理类别失衡\n\n*   使用机器学习算法构建分类层\n\n*\
  \   评估各实验的性能\n\n### 目标\n\n学习完本章后，您应能理解如何通过转移学习从图像中提取特征，其中使用 Inception (Szegedy et\
  \ al., 2015)、ResNet (He et al., 2016)、DenseNet (Huang et al., 2017) 等最先进的卷积神经网络架构。此外，您还将学习如何将提取的特征（图像的向量表示）输入分类模型进行分类。最后，将创建并比较所有实验的性能指标，以选出表现最佳的模型。\n\
  \n### 使用表示学习进行分类\n\n\n\n\n表示学习技术允许用户从各种卷积层中提取特征，然后将这些特征输入到用户选择的分类模型中，无论是机器学习还是深度学习分类器。\n\
  \n在本研究中，我们将使用各种预设的 CNN 应用（如`VGGNet`、`ResNet`、`MobileNet`、`DenseNet`、`Xception`、`Inception`等）通过表示学习方法提取特征，然后构建`RF`和`SVM`分类模型，用于对\
  \ 15 个类别进行分类（Figure 5.1）。\n\n![FIGURE 5.1 Classification using representation learning\
  \ overview.](img/fig5.1.jpg)\n\n**FIGURE 5.1** Classification using representation\
  \ learning overview.\n\n#### 数据准备\n\n作为数据准备的第一步，图像被转换为 NumPy 数组。提取的图像数组将进一步通过转移学习技术输入卷积层以提取特征。\n\
  \n## 转换图像为 NumPy 数组\n\n首先，我们将图像转换为 NumPy 数组。训练和测试数据的图像数组将保存为带有.npy 扩展名的 NumPy 文件，以便后续处理。\n\
  \n使用 Python 的 OpenCV 和 NumPy 库将图像转换为 NumPy 数组。训练和验证文件夹中的图像尺寸各不相同，尺寸范围在宽度和高度之间为 700\
  \ 像素到 1280 像素。因此，需要调整图像大小，使所有图像保持相同的尺寸格式。基本上，图像尺寸越大，图像中可用的像素越多，从而可以从图像中提取更多低层次特征。但通过缩小图像尺寸，像素会被压缩，从而可以从图像中提取更多高层次特征。\n\
  \n由于计算限制，我们决定将图像转换为大小为(128, 128, 3)和(256, 256, 3)的数组，并研究图像尺寸是否会影响在提取图像相关特征以实现有效分类时的模型性能。\n\
  \n为此，我们将使用 Python OpenCV 库。\n\n1. import os\n\n2. import glob\n\n3. import cv2\n\
