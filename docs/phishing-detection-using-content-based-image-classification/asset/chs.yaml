- "# \n内容基于图像分类的网络钓鱼检测\n\n\n![](img/cover.jpg)\n\n\n## Preface\n\nPhishing is one\
  \ of the most prominent cybercrimes which has posed significant threat to transactions\
  \ over the world wide web. Visual similarity of a forged website to its genuine\
  \ counterpart often misleads web users to fall prey to this malicious activity.\
  \ Hence, it has become imperative to build awareness about the basics of phishing\
  \ within cybersecurity domains and to identify the different techniques used by\
  \ phishers to attack web users. It is evident that the various anti-phishing initiatives\
  \ have instigated a race between phishers and anti-phishers, leading to constant\
  \ innovation by both parties to stay ahead in the game.\n\nThe popularity of machine\
  \ learning and deep learning techniques has leveraged the research using image processing-based\
  \ phishing detection techniques. Researchers have faced various challenges in detecting\
  \ phishing using website images. A tabular comparison and summary of various related\
  \ works is discussed in this volume to provide a clear historical perspective for\
  \ phishing detection. Open-source programming languages like Python have implemented\
  \ several Convolutional Neural Network (CNN)-based phishing detection statistical\
  \ models. A step-by-step guide to building a CNN Model is discussed to make the\
  \ reader familiar with assorted approaches to preventing phishing. Creation of the\
  \ transfer learning-based CNN model using various off-the-shelf CNN architectures\
  \ has proved to be useful in deep learning-based phishing detection. Robust feature\
  \ extraction from website images using representation learning is also explored\
  \ to design useful descriptors for identifying duplicate websites. The ground-up\
  \ approach of extracting image representations is implemented using various off-the-shelf\
  \ CNN architectures like VGGNet, ResNet, DenseNet, and so on. Machine learning models\
  \ are created using pre-processed image features and performance comparison between\
  \ various models.\n\nFinally, feature dimension reduction and fusion-based techniques\
  \ are explored for creating strong feature vectors to implement content-based image\
  \ classification-based phishing detection. The diversified approaches discussed\
  \ in this book provide the reader with a 360° overview and a stepping stone to experience\
  \ this interdisciplinary domain of phishing detection using image content of the\
  \ websites.\n\nThis book is intended for graduates and undergraduates from assorted\
  \ backgrounds such as data science, network security and research, software developers\
  \ and as a reference book for scientists, researchers, lecturers, and tutors, as\
  \ well as for academic and corporate libraries.\n\nShekhar Khandelwal\n\nRik Das\n\
