  \ Positive Rate 是更合适的评估指标，这意味着分类模型更应将所有网络钓鱼网站预测为“网络钓鱼”，即使这会导致少量合法网站被错误分类为“网络钓鱼”。同时，模型也应尽量减少将合法网站误判为“网络钓鱼”，因此\
  \ False Positive Rate 也是重要的评估指标。基于相关的性能指标，本文分析了所实现的各种方法的结果。观察到，DenseNet201 模型在图像尺寸为(512,\
  \ 512, 3)并使用 SVM 进行训练时，表现最佳。此外，最佳模型还与所使用数据集的最先进的性能进行了比较。\n\n## 9 数字图像处理基础\n\nDOI:\
  \ [10.1201/9781003217381-9](https://doi.org/10.1201/9781003217381-9)\n\n视觉是帮助我们导航物理世界的最重要能力。我们都知道，当光落在物体上并被反射时，反射被眼睛捕捉，信息随后传递到大脑，生物神经网络最终解码视野中的物体，使我们能够区分汽车和摩托车等不同物体，并在繁忙道路上驾驶汽车。\n\
  \n计算机视觉也遵循类似的机制。随着计算机视觉技术的发展，计算机现在可以像人类一样观察物理世界，并解决类似的人类的问题。\n\n作为人类，我们每天解决各种问题，却并未意识到人体和大脑所展现的惊人认知能力。通过计算机视觉技术，我们设想在计算机上复制类似的人类能力。在某些情况下，我们复制人类能力；在其他情况下，我们增强人类能力；在仍其他情况下，我们超越人类能力。\n\
  \n通过视觉，我们能够区分狗、猫和人。通过计算机视觉和人工神经网络，计算机可以被训练做到同样任务。这属于计算机复制人类能力的范畴。\n\n\n\n\n然而，如果计算机被赋予驾驶汽车的能力，例如在自动驾驶汽车的情况下，它们不仅能够匹配而且还能远超人类的能力。这是因为计算机可以拥有道路的\
  \ 360 度视野，能够看到盲点等，而人类无法复制这些能力。\n\n现在，虽然提升计算机的视觉能力是好事，但更进一步，训练计算机去解释人眼根本无法识别的事物，例如检测钓鱼网站而非合法网站，是更好的选择。人眼可以被钓鱼网站欺骗，因为它们看起来与真实对应物几乎完全相同。因此，人类很容易陷入钓鱼攻击，但利用计算机视觉技术，我们可以训练计算机从钓鱼网站的图像中提取特征，并训练模型区分钓鱼网站和合法网站。\n\
  \n## Structure\n\nIn this chapter, we will cover the following topics:\n\n*   Basics\
  \ of digital image processing\n\n*   Basics of extracting features using OpenCV\n\
  \n## Objective\n\nAfter studying this chapter, you should be aware of the basics\
  \ of digital image processing. You will be familiar with image filtering concepts\
  \ and how to extract relevant features from images for further processing.\n\n##\
  \ Basics of Digital Image Processing\n\nTo understand digital image processing,\
  \ it’s imperative to first understand what a digital image is. When an image is\
  \ captured, certain information about the object in the image is captured by the\
  \ camera or a similar device that can capture the image. When the image is processed,\
  \ the information captured is extracted and then processed.\n\n### What Is a Digital\
  \ Image?\n\nA picture element, usually called “pixels”, is the smallest element\
  \ of a digital image. An image is an arrangement of pixels in n dimensions.\n\n\
  There are two color schemes in an image:\n\n1.  Grayscale image\n\n2.  RGB (color)\
  \ image\n\nGrayscale images are what we call black and white images. In such images,\
  \ each pixel has only one layer. And each pixel has a number associated with it.\
  \ If it’s an 8-bit pixel, the number ranges from 0 to 255. And the number represents\
  \ intensity, for example the greater the number, the more the intensity. Hence,\
  \ 0 represents black, and 255 represents white. Hence, a grayscale image can be\
  \ represented by a single matrix.\n\nFor an RGB image, each pixel has three layers.\
  \ One layer for red, one for green and one for blue. All other colors can be created\
  \ by adding these three colors in different intensities. Hence, every pixel in an\
  \ image can be represented with three numbers in each layer of RGB. And hence a\
  \ color image can be represented by three matrices, one for each layer, with different\
  \ intensities for each color.\n\nBased on this understanding, if a pixel is defined\
  \ as a tuple of three elements, wherein the first element is the intensity of red\
  \ in a pixel, the second element is the intensity of green in a pixel and the third\
  \ element is the intensity of blue in a pixel, then a pixel which is red in color\
  \ can be defined as (255,0,0), which means that the intensity of red is 255 and\
  \ the intensities of green and blue are 0. Hence, this pixel is pure red. Similarly,\
  \ a pure green pixel can be defined as (0,255,0), and a pure blue pixel can be defined\
  \ as (0,0,255) (Figure 9.1).\n\n![FIGURE 9.1 Pixel layers within digital images.](img/fig9.1.jpg)\n\
  \n**FIGURE 9.1** Pixel layers within digital images.\n\nSince an image is a collection\
  \ of pixels, every image can be defined as a matrix of pixel values. To understand\
  \ this better, look at Figure 9.2.\n\n![FIGURE 9.2 Pixel representation of a greyscale\
  \ image.](img/fig9.2.jpg)\n\n**FIGURE 9.2** Pixel representation of a greyscale\
  \ image.\n\nAs you can see, what we see as a whole image, the computer sees as a\
  \ pixel representation. The number in the pixel representation is the intensity\
  \ of white in that particular pixel in the image. Since it’s a grayscale image,\
  \ there is just one channel, and hence one number in that pixel position. In the\
  \ case of a color image, there will be three numbers in each pixel position, representing\
  \ the intensity of red, blue and green in their respective channels.\n\n### Loading\
  \ and Displaying Images\n\nThe first and foremost thing to be done for a computer\
  \ to process the image is to load the image in the computer memory, which basically\
  \ means loading the matrix holding the pixel values of the image into the memory.\n\
  \nTo do so, let’s first import the required libraries.\n\n1. from matplotlib import\
  \ pyplot as plt\n\n2. import cv2\n\nRead the image using the imread method in the\
  \ opencv library.\n\n3. image_loc=“einstein.png”\n\n4. image = cv2.imread(image_loc)\n\
  \n5. image.shape\n\nNote the shape of the image, which is represented as (height,\
  \ width, channel), which means height at index 0, width at index 1 and channel at\
  \ index 2.\n\n(1034, 968, 3)\n\nHence, the image is read as a matrix of size (1034,\
  \ 968), which basically means that the image has a height of 1034 pixels and a width\
  \ of 968 pixels, and there are three such matrices, one for each channel of RGB.\
  \ To understand it better, let’s plot the image and check the height and the width\
  \ along the x and y axes.\n\nBut before we plot the image, let’s first understand\
  \ a small caveat related to the opencv imread module. When the image is read using\
  \ the imread module, the matrix loaded in the image object is loaded as a numpy\
  \ array.\n\nThis array has 1034 rows, which is the height of the image.\n\n1. print(len(image))\n\
  \n1034\n\nIf we just look at the first row of this matrix, it will contain 968 columns,\
  \ which is the width of the image.\n\n1. print(len(image\\[0\\])\n\n968\n\nHence,\
  \ an individual pixel will represent three values, one for each RGB channel.\n\n\
  1. image\\[0\\]\\[0\\]\n\narray(\\[30, 31, 29\\], dtype=uint8)\n\nHowever, the opencv\
  \ library by default reads the image as BGR channel. So, the pixel value represented\
  \ above basically means that the first pixel of the image has the value of 30 in\
  \ the blue channel, 31 in the green channel and 29 in the red channel.\n\nHence,\
  \ for further processing, there is a need to correct this channel values setting\
  \ in the numpy array, which holds the image pixel values, which is done using the\
  \ below code line.\n\n1. image = cv2.cvtColor(image, cv2.COLOR_BGR2RGB)\n\nNow,\
  \ if we check the pixel values representation with the array, it will show in the\
  \ RGB format, which means that the pixel values of each channel remain the same,\
  \ but they are arranged differently. Earlier it was \\[B = 30, G = 31, R = 29\\\
  ] and after conversion it became \\[R = 29, G = 31, B = 30\\].\n\n1. image\\[0\\\
  ]\\[0\\]\n\narray(\\[29, 31, 30\\], dtype=uint8)\n\nLet’s now plot the image to\
  \ check the pixel arrangements in the x and y axes (Figure 9.3).\n\n![FIGURE 9.3\
  \ Pixel representation of a digital image.](img/fig9.3.jpg)\n\n**FIGURE 9.3** Pixel\
  \ representation of a digital image.\n\n2. plt.imshow(image)\n\n3. plt.title(“Einstein”)\n\
  \n4. plt.grid(False)\n\n5. plt.show()\n\nSo, we can see that the image has 1034\
  \ pixels vertically along the y axis, which is termed as height, and 968 pixels\
  \ horizontally along the x axis, which is termed as width, and at every pixel there\
  \ are three values, one value for the red channel, one value for the green channel\
  \ and one value for the blue channel.\n\nHence, the total number of pixel values\
  \ across the three channels of the image is equal to\n\n*   1034 × 968 × 3 = 30,02,736\n\
  \nSo, what a human eye sees as just an image, a computer sees as 30,02,736 numbers\
  \ arranged in a defined order.\n\n## References\n\nDOI: [10.1201/9781003217381-10](https://doi.org/10.1201/9781003217381-10)\n\
