  \ X_test, y_test\n\n### 水平拼接 PCA 特征：从最后卷积层提取的特征与类失衡处理，结合两个 CNN 模型\n\n拼接 PCA 特征后，所有应用的数据维度相同，因为\
  \ PCA 处理后，来自不同应用的特征数组维度相同（Figure 7.3）。\n\n![FIGURE 7.3 水平特征拼接 PCA 处理后的数据，用于两个 CNN\
