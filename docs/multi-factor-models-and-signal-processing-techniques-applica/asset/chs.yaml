  \ 2.5 节中介绍。\n\n### 2.3.2. 子空间方法\n\n金融应用中，获取 `latent factors` 最常用的方法是主成分分析（PCA），它对协方差矩阵进行特征分解。在本节中，我们假设协方差矩阵是已知或通过任何方法估计的（如\
