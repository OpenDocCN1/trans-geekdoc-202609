  \ 3.15. 要点\n\n本节概述了涉及 LSE 和 KF 的章节中最重要的结果。\n\n### 最小二法估计 (LSE)\n\nLSE 隐含假设收益、因子、alpha\
  \ 和 beta 之间存在线性回归，跨越特定的观测窗口 (t, h) = {l，使得 t – h + 1 ≤ l ≤ t}；这种回归称为 LSE“块”测量方程，如下：\n\
  \n3.75 ![image](img/img_10_135.jpg)\n\nLSE 块回归的输入是：窗口内一个特定收益的值 ![image](img/Inline_136_13.jpg)以及包含在[h,\
  \ K + 1]“因子矩阵”中的因子 ![image](img/Inline_136_14)，带有![image](img/Inline_136_15)。因子也被称为回归变量。LSE\
  \ 回归的未知数或参数是假设在窗口内为常数的 alpha 和 beta。它们填充了列向量 `θ`[`t`,*h]`，其中`θ'`[`t`,*h]` = ![image](img/Inline_136_16)。LSE\
  \ 回归的残差为`ε`[`t`,*h]`，其带有![image](img/Inline_136_17)。\n\nLSE ![image](img/Inline_136_19)最小化了测量（收益）向量\
  \ `r`[`t`,*h]`与其基于因子的线性近似（即 G[`t`,*h]` `ξ`）之间的差异（凸）平方欧几范数。假设[h, K + 1]矩阵 G[`t`,*h]`是满秩的，LSE\
  \ 解是唯一的，我们有：\n\n[3.76] ![image](img/img_2_136.jpg)\n\nLSE ![image](img/Inline_137_5)是`θ`[`t`,*h]`的无偏估计，但当矩阵(G′\
  \ G)[[`t`,*h]`病态时，其方差可能会变得很大。这发生在其最小特征值变得太小时。在后一种情况下，LSE 必须进行“正则化”以限制![image](img/Inline_137_6.jpg)的大小（该主题在第\
  \ 4 章讨论）。\n\n\n\n\nKF 结构具有两个启用特征，这些特征自然地导致了对参数向量 `θ`[`t*]`（其分量为 alpha 和 betas）的递归估计\
  \ ![image](img/Inline_137_11.jpg)。这两个关键特性在 LSE 模型中是欠缺的。\n\n首先，与 LSE 不同，KF 结构利用了“瞬时”测量方程（涉及收益率、因子、alpha\
  \ 和 betas）。KF 不需要像 LSE 那样对数据进行窗口处理：`LSE` [方程 \\[3.75\\]](#c03.xhtml#eqn75) 是块方程而不是瞬时测量方程。事实上，KF\
  \ 观测（收益率）方程采用以下“瞬时”形式：\n\n```\n[\\[3.77\\]](#c03.xhtml#eqn_77) ![image](img/img_12_136.jpg)\n\
  ```\n\n带有 ![image](img/Inline_137_15.jpg)和 ![image](img/Inline_137_16.jpg)。其次，KF\
  \ 结构依赖于一个驱动 `θ`[`t*]` 动态演化的递归方程。这被称为状态递归方程（`θ`[`t*]` 是前一个值 `θ`[`t*−1]` 的函数）。LSE\
  \ 模型中不存在的递归方程可以从物理学、计量经济学、金融学等定律推导出，也可以直观地假设。在后一种常见的情况下，其形式必须是简洁的。简单的直观“状态递归”方程如下：\n\
