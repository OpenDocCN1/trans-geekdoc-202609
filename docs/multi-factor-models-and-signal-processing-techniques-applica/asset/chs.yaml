  \ [FOR 10]）。常用的值 `α` = 3 对应于 0.13% 的双侧置信区间。\n\n在 `l¹`-正则化情况下（见方程 4.22），如果检测到异常值（如果\
  \ OD 检验 `H`[1] (`α`) 通过验证），则 `δ` 的值范围从 0 到 2![images](img/Inline_149_2.jpg)。在实践中，`δ`\
  \ 应该接近 0 且永远不会趋于其上限，而该上限是非常宽松的。如图 4.1 所示，`δ` 越小，二次形式的正则化程度越低，这允许估计潜在的极值。相反，`δ` 的高值会将异常值减至零，从而扩展了底层分布的支持域。OD\
  \ 步骤绕过了选择合适正则化参数值的这一棘手问题。\n\n在 `l²`-正则化情况下，异常值的估计值仍然取决于所选择的 `δ` 值。当需要推导 [4.23] 的闭式表达式（如在\
  \ [4.24] 中）并确保良好的数学性质（如可微且连续函数）时，文献中通常优选 `l²`-正则化。在本节中，我们主要关注 `l¹`-正则化，是因为用于表示尖峰收益的加性项\
  \ `v[t]` 具有稀疏性。\n\n## 4.4.2 rgKF 性能\n\n为了说明为什么在任何情况下都应该应用 `rgKF`，本节讨论了在故意被稀疏异常值污染的模拟数据上\
  \ `rgKF-l¹` 和 `l²` 的性能。模拟数据与 [3.51] 中的数据相似，即双因子模型（包括标普 500 股票指数和 10 年期美债）和分段常数参数\
  \ `w[t]`。\n\n## 4.5 应用于对冲基金收益的异常检测\n\n我们示例的目标是解释使用 `rgKF` 算法移除异常值的重要性。收益的多因子分解有助于我们理解收益的哪部分来自市场，哪部分是特定的（见表\
  \ 4.2）。如果观测值中出现异常值且模型没有考虑它们，那么市场暴露估计值可能是完全虚假的。`rgKF` 算法通过简单过滤异常值避免了这些估计的污染。在实践中，投资组合经理可能会使用多因子方法来对冲特定或所有市场风险。错误的估计可能导致在做出最优对冲组合时做出某些不当决策。\n\
  \n\n\n\n\n本节涉及在真实的对冲基金数据上应用 `rgKF(NG, l¹)` 以检测离群值的可能出现。我们对“全球宏观”（`Global macro`）对冲基金的收益进行了分析。此类基金的经理在货币、债务、股票或大宗商品上建立方向性头寸，也可能选择结合多头和空头进行对冲的相对头寸。对冲基金数据来自对冲基金研究（HFR）数据库\
  \ `[RES]`。这些收益为月末收益，时间范围从 1998 年 1 月到 2010 年 6 月（即 150 个月）。\n\n我们选择了由 Fung 和 Hsieh\
  \ (F&H) `[HSI]` 的八个风险因子，这些因子由作者 `[FUN 01]` 选取并构建，用于解释趋势跟踪型对冲基金。这些因子现在被广泛应用于对冲基金分析的文献中。它们每月报价一次，并存储在每个月末\
  \ `t` 的 `f[*t*]` 中。读者可以参阅第 2.2.3 节获取这些因子的更详细描述。\n\n**图 4.3** 展示了 `rgKG(NG,l¹)` 检测、估计和过滤观测收益时间序列中某些点的能力，这些点可能被视为对冲基金的特定事件、离群值、异常情况或流动性问题。如图\
  \ 4.3 上方的图表所示，当离群值出现时，产生的 `β` 的 KF 估计值会跳跃到之前值的四或五倍，而市场并未发生特殊事件。\n\n**图 4.3.** HFR\
  \ 数据库中单个趋势跟踪型对冲基金（OSV Currency Fund）的离群值检测与估计。离群值对基金风险敞口的影响可以在上方图中观察到：KF 未过滤掉 `rgKF(NG,l¹)`\
  \ 估计的峰值，并对市场风险给出了错误的估计（见色板部分）。\n\n![images](img/img_4_152.jpg)\n\n# 4.6. 结论\n\n\
  本章介绍了一类名为 `rgKFs` 的新算法，这些算法被用于检测和估计标准 KF 观测方程中可能出现的外源离群值。受 Mattingley 和 Boyd `[MAT\
  \ 10]` RKF 的启发（该方法利用了 `l¹` 正则化步骤），我们在 RKF 的递归方程中引入了一个简单但高效的检测步骤。该解决方案是解决 `l¹` 正则化参数值适应的方法之一：当在\
  \ KF 的创新项中检测到离群值时，正则化参数的值将被设置为一个值，该值使基于 `l¹` 的优化问题能够估计出峰值的振幅。我们还测试了基于 `l²` 的正则化项，该项的解是闭式形式。\n\
  \n在合成数据上获得的结果显示，处理正则化参数选择的 `rgKF(NG,l¹)` 获得了最佳性能。在分析对冲基金收益的背景下，`rgKF(NG,l¹)` 可以帮助风险经理动态且准确地估计对冲基金的敞口，而对于这些基金除了观测收益外没有任何其他信息。通过将离群值解释为流动性问题，我们的算法将非常有助于根据“流动性质量”对基金进行分类，并从监管角度做出准确决策。\n\
