  \n### 2.7.1.2. 特征值分布：随机矩阵理论\n\n统计理论通常假设维度是常数，或者 `T/N → ∞`。数量 `q = T/N` 可以被解释为平均样本量。遗憾的是，当\
  \ `q` 较小时，即使 `T` 很大，大样本性质也会失效。随机矩阵理论是处理这类高维数据的分支，主要关注随机生成矩阵的特征值。一个重要结果是，在独立同分布元素的假设下，特征值的分布收敛于特定法则，该法则不取决于矩阵元素的分布，而主要取决于\
  \ `q`。\n\n由于 SCM [221] 是随机矩阵（见公式 2.26 和 2.30），RMT 的结果适用于正态分布数据。在数据为广义椭分布的情况下，如果我们使用\
  \ SCM，RMT 的结果不再适用，但通过使用估计器可能会发现一些证据。关于广义椭分布和协方差矩阵估计器的结果可于 [TYL 83]、[TYL 87a] 和 [TYL\
  \ 87b] 中找到，这些文献显示对于此类分布，估计器对应于 M 估计。\n\n本节关注 RMT 的基础。读者可以参考 [FRA 04]、[POT 05]、[HAR\
  \ 07] 和 [BAI 10] 获取更完整、更先进的描述。\n\n假设我们在标准化收益率矩阵上计算 SCM，如公式 2.4 所示。所得估计协方差矩阵 S 具有假设方差为\
  \ `σ²` 的随机元素。那么，在 `T, N → ∞` 的极限下，保持 `q = T/N ≥ 1` 恒定，S 的特征值密度为：\n\n\\[2.52\\] ![images](img/img_9.jpg)\n\
  \n其中最大和最小特征值为：\n\n\\[2.53\\] ![images](img/img_10.jpg)\n\n\n\n且 `(*x* − *a*)^([+])\
  \ = *max*(0, *x* − *a*)`。密度 `ρ*(*λ*)` 被称为 Marčenko–Pastur 密度 [MAR 67, PAS 11]。图\
  \ 2.6 显示了不同 *q* = *T*/*N* 值下的 Marčenko–Pastur 密度形状。\n\n**图 2.6。** *q* = 1, 2, 5\
  \ 时的 Marčenko–Pastur 密度。\n\n![images](img/img_3_76.jpg)\n\n如图 2.7–2.9 所示，即使对于较小的矩阵，理论极限密度也能很好地逼近实际密度。在这三幅图中，比率\
  \ *q* = *T*/*N* 分别等于于 5、2 和 1。\n\n正如各项研究中所提到的，尽管密度具有肥尾特征，但 Marčenko–Pastur 密度是随机向量相关矩阵特征值密度的很好的近似。因此，问题在于如何选择显著特征值，然后确定模型的阶数或因子数量，并解释相应的特征向量。后者与观测数据有关，例如，有人指出，对应于最大特征值的特征向量代表了市场因子，因为它涵盖了收益率方差的大部分。其他特征向量可以像\
  \ [DAR 11] 中做的那样与市场中的观测时间序列进行比较。\n\n**图 2.7。** 使用 i.i.i. 随机正态收益率通过 (*T* = 5,000*,\
  \ *N* = 1,000*) 和 (*T* = 500*, *N* = 100*) 计算出的 *q* = 5 时 SCM 的特征值分布。相应的 Marčenko–Pastur\
  \ 密度叠加在。\n\n![images](img/img_3_77.jpg)\n\n在更通用的设定下，显著特征值的选择通过阈值程序完成：所有大于某个数值 `λ*`\
  \ 的特征值被认为是有信息的，否则特征值与噪声有关。为了重构滤波后的协方差矩阵估计或构造相应的特征因子，可以将所有噪声相关的特征值替换为常数。这导致通过总和对特征值进行归一化。然后，通过其对角化的逆过程得到去噪后的协方差矩阵估计。\n\
  \n让我们回想一下，每个特征值对应资产组合的方差。一个非常小的特征值意味着存在一个样本外方差极小的资产组合，这可能是不现实的。\n\n**图 2.8.** 使用\
  \ i.i.i. 随机正态收益率通过 (*T* = 2,000*, *N* = 1,000*) 和 (*T* = 500*, *N* = 250*) 计算出的\
  \ *q* = 2 时 SCM 的特征值分布。相应的 Marčenko–Pastur 密度叠加在。\n\n![images](img/img_3_78.jpg)\n\
