  \ 算法用于由以下模型的数据：\n\n\\[2.36\\] ![images](img/img_6_69.jpg)\n\n其中 `A(θ)` 是一个 `m ×\
  \ n` 范德蒙德矩阵，`x[t]` 是表示观测信号 `y[t]` 的 `n` 维向量，而 `e[t]` 是均值为零的 `m` 维白高斯噪声。模型中，未知参数是\
  \ `θ` 中的 `n < m` 个到达角，因此问题是：(1) 估计源的数量 `n`，通常假设它是固定的；(2) 估计幅度：当向量 `θ` 估计出来后，使用极大似然估计\
  \ (MLE) 方法估计幅度；(3) 使用协方差矩阵的特征值分解来估计 `θ`。\n\ny 的协方差矩阵因此：\n\n\\[2.37\\] ![images](img/img_3_70.jpg)\n\
  \n其中上标 `H` 是转置和共轭操作，`M[x] = IE(xx^(H))` 是 `n × n` 信号自相关矩阵，`σ²` 是噪声方差。假设存在 `n < m`\
  \ 个信号，那么与最大的 `n` 个特征值对应的 `n` 个特征向量定义了信号子空间![images](img/U.gif)[v]。由于信号子空间与噪声子空间正交，最强频率对应于函数的峰值：\n\
  \n\\[2.38\\] ![images](img/img_6_70.jpg)\n\n\n\nMUSIC 算法假设样本数 `m` 和源数是已知的，其效率通过最小方差（由\
  \ Cramér–Rao 下限 – CRLB 给出）[CRA 46] 与 MUSIC 估计方差的比率来衡量，即 `eff = V ar[CRLB]/V[music]`。\n\
