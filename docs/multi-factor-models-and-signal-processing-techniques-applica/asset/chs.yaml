  \ 是 `N` × `N` 的矩阵，由对应于 `N` 个特征值的特征向量组成，`Γ` 是 `N` × `N` 的对角矩阵。我们假设最大的 *K* 个特征值存储在\
  \ `Γ[K]` 中。\n\n\\[2.7] ![images](img/img_14.jpg)\n\n以及\n\n\\[2.8] ![images](img/img_17.jpg)\n\
  \n因此 [[2.6]](#c02.xhtml#eqn6) 可以很容易地重写为：\n\n\\[2.9] ![images](img/img_5.jpg)\n\n\
  在许多应用中，*K* 与模型阶数相关：假设观测来自 *K < N* 个源，剩余的 *N − K* 个源被认为是噪声。例如，MUSIC 算法（多信号分类算法）[STO\
  \ 89, STO 97, TRE 02] 常用于确定天线阵的数量以及到达角度。由 *K* 个最大特征值定义的信号空间与噪声空间（*N − K* 个最小特征值）正交，因此将观测投影到信号空间上可以检测信号。\n\
  \n\n\n\n\n确定 `K`（即公共因子数量）是因子模型的关键任务之一。在对协方矩阵估计进行特征值分解后，最简单的步骤是选取最大的 `K` 个特征值，因为存在各种测试来判断某个特征值是否足够：\n\
