  \n\n\n\n\n由于投资组合经理的下注是持续进行的，跟踪这些下注对短期组合表现的影响可能很有趣。战术性组合配置决策依赖于组合经理对风险溢价（对因子的下注）的短期预测，因此也可以使用线性因子模型进行捕捉，但具有随时间变化的敞口。由于信息是随机到达的，且战术性投注被假设是对新信息的响应，我们预计风险因素的敞口会随时间随机演变。在这种情况下，公式\
  \ 1.4 变为：\n\n![images](img/img_3_32.jpg)\n\n其中 `B[*t*]`（分别对应 `α[*t*]`）表示资产对因子（分别对应\
  \ alpha）随时间变化的敞口。风险因素敞口不是直接观测的，必须从 `r[*t*]` 中过滤出来。\n\n让我们考虑一个对冲基金组合（或对冲基金基金）。接下来的章节将使用对冲基金来提供实证说明。尽管趋势非常明显有利于更高的透明度，但投资者并不能系统地获取对冲基金的完整组成及其随时间的演变。对冲基金经理本身并不总是拥有其底层投资风险因素敞口的完整视图，因此也无法完全了解他们隐式所做的下注。当底层基金的交易频率远高于其报告频率时（即嵌入风险可能与特定日期的显示风险大不相同），或者头寸的数量和多样性使得难以得出准确的聚合因子敞口时，情况更为如此。对冲基金经理所显式（在组合层面）和隐式（在底层层面）进行的战术性投注可能会相互累加或相互抵消。因此，使用基于收益的风格分析允许我们通过同时捕捉和评估这两种影响，缓解基于持仓的方法的主要缺点之一。\n\
  \n这个例子表明，这种基于收益的风格分析必须结合随时间变化的参数进行，以便从组合收益中过滤出长期和短期投注。\n\n## 1.3.2. 最优组合配置\n\n让我们考虑一个由\
  \ `N` 个风险资产组成的组合，其收益为 `r[*i,t*]`，`i = 1, …, N*`，且 `N` 较大。根据马科维茨的 [MAR 52] 理论，通过对资产收益协方差矩阵\
  \ `Σ[r]` 求逆可以获得最优的多样化组合。该矩阵是未知的，我们必须通过观测值 `r[*i,t*]`，`i = 1, …, N`, `t = 1, …, T*`\
  \ 来估计它，例如使用经验协方差矩阵：\n\n![images](img/img_3_33.jpg)\n\n其中 `r[*t*] = [r*[1,t], …*,\
  \ r[*N,t*]` 是资产收益向量。如果维度 `t` 小于 `N`，则 ![images](img/Inline_34_5.jpg) 不是可逆的，无法计算最优的马科维茨组合。此外，即使在\
  \ `N` 小于 `T` 的情况下，该经验协方差矩阵的行列也可能接近零，当我们尝试用通常算法求逆时可能会遇到数值问题。特别是当 `N` 小于 `T` 时。\n\n\
  ## 1.4. 如何构建因子模型？\n\n### 1.4.1. 因子选择\n\n因子选择问题在金融文献中并不新奇。主要问题涉及使用过多或过少因子的之间的微妙平衡。一方面，当我们使用公式\
  \ [1.4] 估计因子敞口时，增加过多的因子会降低回归因子的效率。另一方面，使用过少的因子也有错过相关性结构的重要风险。这引发了一个问题：是否可以构建一种因子选择方法，让我们只考虑适当的因子。\n\
  \n第一种解决方案是使用一组预定义的观测因子，这些因子在金融文献中已根据其解释收益截面的能力被记录。这些因子用于在 1.3.1 节的风格分析中构建长期和短期基准。在\
  \ 1.3.2 节中，为大量风险资产计算最优组合配置时，它们也被用于降低协方差矩阵的维度。如果我们在风格分析中遗漏了一些风险因子，长期和短期基准都是错误的，组合经理的增值将无法正确计算。特别是，我们可能会将风险调整后的收益解释为经理的能力，而忽略了重要的风险敞口。在组合配置示例中，遗漏的因子意味着特异风险项之间存在相关性。由于在计算最优组合时没有考虑这些相关性，我们低估了组合风险，或者说，我们夸大了多样化效应。\n\
  \n另一种解决方案是使用统计方法从资产收益分布（特别是协方差矩阵）中过滤出能够解释收益截面的不可观测因子。尽管这种方法从统计角度来看很有吸引力，但从金融角度来看也有许多缺点。首先，通常很难给这些统计因子给出经济学解释。其次，因子表示不是唯一的，一组给定因子的任何线性组合都定义了一个等效的因子模型。第三，，因子分解通常是随时间变化的，因此难以解释。这两种方法将在第\
  \ 2 章中详细描述。\n\n### 1.4.2. 参数估计\n\n\n\n\n一旦选择了一组因素，参数估计就由计算因子暴露口的数值值组成。当参数不随时间变化时，可以根据残差属性使用最小二乘法（LS）来计算这些估计值。然而，无论是在\
  \ 1.3.1 节的风格分析中还是 1.3.2 节的最优投资组合配置问题中，参数都可能随时间变化，必须使用更复杂的统计过滤方法（例如参见 \\[BOL 09,\
  \ PAT 13\\]），如灵活最小二乘法\\[KAL 89, MAR 04\\]、卡尔曼滤波（KF）\\[RON 08a, RON 08b, RAC 10\\\
  ]或马尔可夫切换模型\\[BIL 12\\]。\n\nLS 估计量总可以在滚动窗口上计算，并在每次获取新数据时进行更新。这提供了一个估计量的时间序列，它们随后具有随时间变化的行为。然而，这种方法在参数随时间平滑变化时虽然是有用的的，但在发生巨大变化时可能会产生误导。使用滚动窗口\
  \ LS 计算的风格分析可能会错过投资组合经理决定的突然风格转换。相反，当风格漂移较小和/或分步实施时，这种估计方法提供了非常好的结果。\n\nKF 方法定义上更具反应性，理论上可以捕捉快速的风格转换。然而，这种方法只有在相关因素用于[方程\
  \ \\[1.4\\]](#c01.xhtml#eqn4) 时才效果良好。事实上，对残差收益统计行为所做的假设更具约束性，任何失败都会对过滤后的时间变化暴露产生巨大影响。例如，当残差收益不遵循高斯分布时。LS\
  \ 和 KF 之间的共同点和差异在第 3 章中讨论，KF 的增强版本在第 4 章中讨论。\n\n## 1.5. 历史视角\n\n自从 Treynor \\[TRE\
  \ 62\\]、Sharpe \\[SHA 64\\]、Lintner \\[LIN 65\\] 和 Mossin \\[MOS 66\\] 在 20 世纪世纪\
  \ 60 年代开发出资本资产定价模型（CAPM）以来，因子模型一直是实证金融领域研究的焦点。\n\n### 1.5.1. CAPM 和 Sharpe 市场模型\n\
