  \n# 3.8. 为什么选择 KF 以及哪种设置？\n\n### 3.8.1. LSE 方法不提供递归估计\n\n粗略而言（细节将在第 3.10 节介绍），LSE\
  \ 和 KF 都利用与未知参数 `θ[t]` 连接的测量值 `r[t]`（见 \\[3.27\\]），根据最小平方距离准则找到其最佳估计 ![image](img/Qcap.gif)[*t*]\
  \ 。在限制在因子模型问题的范围内，`r[t]` 是任何资产的标量收益，`θ[t]` 是 `(K + 1)` 维列向量，收集了资产的 alpha 和暴露率（betas）（为了简单起见，去掉了指向资产的下标）。\\\
  [3.27\\] 的另外两个部分与之前的部分相同。LSE 的一个问题是估计 ![image](img/Qcap.gif)[*t*] 缺乏递归性。我们所说的递归是指从上一个估计\
  \ ![image](img/Inline_96_3.jpg) 显式更新新的估计 ![image](img/Inline_96_2.jpg)。如 3.3.2 节所述，在滑动窗口\
  \ `(*t, h*)` 上运行 LSE 打开了一条允许实时更新估计的路径，但它本身并不是递归估计器。\n\n估计的递归性具有优点。最重要的优势是估计及其准确性的跟踪能力。如果测量过程的主要驱动因素和真参数的演变从时间\
  \ `t − 1` 到时间 `t` 没有发生显著变化，那么新估计应该密切复制之前的估计，节省大量的处理负担。此外，如果真参数的新值和/或新的测量值与之前的情况偏离，则更新的估计应该立即反映这种变化。实时追踪，因此递归性在航空航空、自动监控和监测、汽车和火车控制、语音和图像（多媒体）处理\
  \ \\[FUK 90, BAR 93, KAY 93, DUV 94, KAY 98\\]、重症监护、计量经济学和定量金融等领域至关重要。\n\n测量（方程\
  \ \\[3.27\\]](#c03.xhtml#eqn27)）没有产生参数的递归性。因此，为了建立递归估计，KF 需要依赖一个驱动真参数演变的递归方程，而且该方程必须提前已知以便纳入估计推导中。估计的递归性将由未知真参数的递归性引起。这是\
  \ LSE 和 KF 设置之间的区别。\n\n### 3.8.2. 状态空间模型及其递归组件\n\n该递归方程也称为状态方程，是微分方程的离散时间版本。它可以是“自然的”或“直观的”。如果是自然的，它来自著名的物理定律（力学、热力学、电磁学、光学等）和化学，这些定律通过微分方程描述了现象及其关键变量。我们邀请读者检查\
  \ \\[BAR 93, KAY 93, KAY 98, NOR 04\\] 中提供的许多示例。如果无法利用特定的定律，仍然可以对参数演变假设一个“直观的行为描述”，这是\
  \ KF 的基石。\n\n### KF 状态空间模型/设置\n\n参数 `θ[t]` 的演变，状态递归方程：\n\n[\\[3.26\\]](#c03.xhtml#eqn_26)\
  \ ![image](img/img_4_96.jpg)\n\n测量–观测方程：\n\n[\\[3.27\\]](#c03.xhtml#eqn27) ![image](img/img_7_96.jpg)\n\
  \n没有特定的经济或金融定律可以产生 alpha 的递归方程。（此处重复了多次，已去重）\n\n![image](img/Inline_95_5.jpg) 没有特定的经济或金融定律可以产生\
  \ alpha 的递归方程。\n\n\n\n\n[\\[3.30\\]](#c03.xhtml#eqn_30) ![image](img/img_10_98.jpg)\n\
  \n[公式 \\[3.30\\]](#c03.xhtml#eqn30) 代表“创新性”（正交）属性：状态噪声的每次更新都为参数演化带来了纯粹的创新。如 3.11\
  \ 节和 3.12 节所示，马尔可夫属性和创新属性共同驱动了卡尔曼滤波（KF）的架构。\n\n# 3.10. KF 的目标是什么？\n\n给定截至时间 `t`\
  \ 的观测值 {`r`[`k`], 1 ≤ `k` ≤ `t`} 以及由 [公式 \\[3.26\\]](#c03.xhtml#eqn26) 和 [\\[3.27\\\
  ]](#c03.xhtml#eqn27) 描述的状态空间设置（模型），KF 的目标是通过最小化均方误差（MSE），推导出不可观测状态或参数 `θ`[`t`],\
  \ `t` ≥ 1 的*递归且线性*估计（关于线性性，请见后文的第二个和三个注释）![image](img/Inline_100_4.jpg)。![image](img/Inline_100_5.jpg)\
  \ 的第二个下标 `q` 代表用于估计 `θ`[`t`], `t` ≥ 1 的观测空间 ![image](img/Inline_100_6.jpg) 时间窗口的结束。如果问题限于\
  \ KF，则 `q` = `t`。对于本书未涉及的卡尔曼预测和平滑，我们分别会有 `q` < `t` 和 `q` > `t`。\n\n### KF 目标：\n\n\
  \\[3.31\\] ![image](img/img_8_99.jpg)\n\n基于最小均方误差（MMSE）最优性准则：\n\n[\\[3.32\\]](#c03.xhtml#eqn_32)\
  \ ![image](img/img_11_99.jpg)\n\n在 [公式 \\[3.32\\]](#c03.xhtml#eqn32) 中，![image](img/Inline_100_14.jpg)\
  \ 表示由随机变量 {`r`[1], …*, `r`[`t`]} 跨的观测空间 ![image](img/Rt1.jpg) 中的任何元素，MMSE 准则的几何和欧几里得解释请参见\
  \ 3.14 节。\n\n**注释 3.2.** 估计的递归性是由状态的递归 [公式 \\[3.26\\]](#c03.xhtml#eqn26) 和连续马尔可夫属性\
  \ \\[3.29\\] 自然产生的。\n\n**注释 3.3.** 为了简单以及方便初学者，我们将 KF 的目标设定为递归 MMSE 估计，从而将最优搜索限制在直观的“类距离”或类几何二阶准则（见\
  \ 3.14 节）。几何路径跳过了基于条件概率密度的概率或贝叶斯呈现形式。概率推导需要冗长的介绍极大*后验*方法和正态条件概率 PDF 的详细属性，这将是以牺牲对\
  \ KF 结构、行为和性能的直观快速理解为代价的。\n\n**注释 3.4.** 在概率（贝叶斯）方法和高斯假设下，估计相对于观测值和上一个估计的线性性是优化过程的结果。本章采用的基于\
  \ MMSE 的呈现需要说明估计的结构。此后限制在线性算子上，以便产生与概率推导完全相同的解。\n\n# 3.11. KF 是如何工作的（针对用户和程序员）？\n\
  \n### 3.11.1. 算法摘要\n\n3.10 节所述问题的解决在 3.14 节中详细介绍。此后，我们描述并解释 KF 解决方案的递归结构，这是 KF 用户和程序员都应该理解的。从时间\
  \ `t` − 1 到时间 `t`（`t` ≤ 1）的一个*完整递归 KF 步骤*包含两个部分。事实上，如图 3.2 所示，KF 完全步骤一方面更新（alphas\
  \ 和 betas），从 ![image](img/Inline_101_7.jpg) 到 ![image](img/Inline_102_2.jpg)，另一方面更新相关的\
  \ KF“准确性”矩阵，从 ![image](img/Inline_102_3.jpg) 开始，被称为 *KF*(`n`/`q`) 创新，![image](img/Inline_102_4.jpg)。准确性矩阵无非当前\
  \ KF 创新的协方差矩阵。其动态范围的缩小跟踪了准确性的提高，从而使 KF 估计更接近目标参数 `θ`[`t`]。\n\n**1) 初始化 `t` = 0**\n\
  \nKF 按照以下方式初始化：\n\n[\\[3.33\\]](#c03.xhtml#eqn_33) ![image](img/img_7_101.jpg)\n\
  \n从时间 `t` − 1 到时间 `t`（`t` ≤ 1）：全 递归处理分为 (1) 预测（称为先验更新）和 (2) 修正（称为后验更新），见图 3.2。\n\
  \n**2) 预测，从 (`t` − 1|`t` − 1) 到 (`t`|`t`)**\n\n预测是由递归状态模型 [公式 \\[3.26\\]](#c03.xhtml#eqn26)\
  \ 驱动的 KF 唯一递归步骤。预测步骤分为预测滤波，计算新状态 ![image](img/Inline_102_2.jpg) 来自上一个估计 ![image](img/Inline_102_3.jpg)，以及预测准确性处理见\
  \ \\[3.3】，用于刷新准确性矩阵。\n\n**3) 修正，从 (`t` − 1|`t` − 1) 到 (`t`|`t`)**\n\n修正由更新的观测值 `r`[`t`]\
  \ 触发（见图 3.2）。在计算所谓的卡尔曼增益后（见 \\3.36），修正子步骤计算 ![image \\[3.37]。修正准确性处理评估 S[`t`]。\n\
  \n### 3.11.2. KF 递归方程的初始化\n\n与需要选择初始值的算法类似，估计准确性和算法收敛速度之间存在权衡。取决于初始值，递归算法将更快或更慢地收敛到真实值。\n\
  \n如[公式 \\[3.33\\]](#c03.xhtml#eqn_33)所示，状态空间模型的参数需要初始化。向量 ![image](img/Inline_104_5.jpg)\
  \ 的初始值必须根据问题的知识以及该向量代表的内容进行设置。在因子模型的情况下，*θ* 代表投资组合对某些市场因子的暴露，因此其值大多在 -1 到 +1 之间。因此，将\
  \ ![image](img/Inline_104_6.jpg) 初始化为零是非常合理的。\n\n\n\n\n估计误差方差的初始值也与 `θ` 相关，且不应太小：如果是这样，卡尔曼增益也将很小，对于[方程\
  \ \\[3.37\\]](#c03.xhtml#eqn37)，![image](img/Inline_104_8.jpg) 的修正值将保持接近预测值 ![image](img/Inline_104_9.jpg)。那么，如果\
  \ `θ` 的真实值不接近初始值，该算法将永远无法达到这些真实值，因为它始终会提议某些接近初始值的值。\n\n此外，如果 ![image](img/Inline_104_11.jpg)\
  \ 被初始化为一个过大的值，那么该算法收敛到真实值的速度将比将 ![image](img/Inline_104_12.jpg) 设置为更合适的值时要慢。\n\n\
  在我们的情况下，我们可以将 ![image](img/Inline_105_2.jpg) 设置为 1 或 1.5，因为我们希望从 0 达到潜在值范围的最低和最高边界（−1\
  \ 和 +1）。\n\n状态空间模型的另外两个参数 ![image](img/Inline_105_4.jpg) 和 ![image](img/Inline_105_5.jpg)\
