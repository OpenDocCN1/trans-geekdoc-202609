  \ (`k` + 1) 个特征值与第 `k` 个特征值的比值：\n\n\\[2.13\\] ![images](img/img_7_59.jpg)\n\n显然，这些测试的结果将取决于所选的\
  \ `η`[1] 或 `η`[2] 的值。更通用的标准可能有用，目前出现了两类标准：(1) 传统标准和 (2) 基于大面板数据定义的、更特定于因子模型识别的标准。\n\
  \n## 2.4.1 信息准则\n\n用于检测 `K` 值的第一类测试被称为顺序假设 (SH) 检验或球性检验，源自统计学领域（参见 [AND 63]）。目标是找到\
  \ `N` - `K` 个最小特征值相等假设与仅 `N` - `K` - 1 个最小特征值相等假设之间的似然比。Anderson [AND 63] 显示，对于\
  \ `T` ![images](img/great.gif)*N*，`N` - `K` 个最小特征值聚集在一个小值 `s`²附近，并证明充分统计量为：\n\n\\\
  [2.14\\] ![images](img/img_2_60.jpg)\n\n该比率使用了 `N` - `d` 个最小特征值的算术平均值与 `N` - `d`\
  \ 个最小特征值的几何平均值的比。如果 `N` - `d` 个最小特征值相等，则 `L`(`d`) = 0。渐近地，统计量 [2.14] 对应于 `χ`²((`N`\
  \ - `d`)² - 1)分布，因此给定置信区间和顺序检验，可以确定 `d` 的值。\n\n第二类测试在 `L`(`d`) 中增加了一个考虑模型自由度的惩罚函数。这产生了一个需要最小化的关于\
