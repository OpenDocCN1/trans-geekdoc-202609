  在本章中，假设 `K` 个因子 `f[t,k]`（1 ≤ `k` ≤ `K`）已通过选择。LSE（最小二乘法）和 KF（卡尔曼滤波）是众多方法，允许对给定的因子估计\
  \ `θ[t]`。这种估计表示为 ![image](img/Qcap.gif)*t*。\n\nLSE 和 KF 有两个主要共同点：首先，它们共享相同的观测[方程\
  \ [3.3]](#c03.xhtml#eqn3)。其次，它们的优化准则和后续解可以用相似的方式进行解释，涉及特定的欧距离平方（“二阶”）。对于两者，几何意义有助于理解方法的工作原理以及如何推导出最优解。\n\
  \nLSE 和 KF 之间存在根本区别。得益于上述输入的“瞬时和递归处理”，KF 提供了一种递归估计 ![image](img/Inline_86_2)，可以自然地表示为\
  \ ![image](img/Inline_86_3)的函数。与 KF 不同，LSE 的“跟踪能力”（*例如对冲基金等动态投资风格*）有限，因为它基于“块处理”且不产生递归估计。与瞬时处理相反，块处理需要访问多个（而不仅仅是一个）测量值和因子值来获得估计。\n\
