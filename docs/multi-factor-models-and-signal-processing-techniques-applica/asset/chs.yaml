  \n## 1.6. 术表\n\n### 波动率 (Volatility)\n\n资产 `a` 的波动率 `σ` 指在特定时间跨度内连续复合收益率的标准差。波动率通常以年化形式表示：如果使用每日（或每周）收益率计算波动率\
  \ `σ`，且认为一年由 250 个工作日（或 52 周）组成，那么年化波动率将等于 ![images](img/Inline_42_5.jpg)(或，![images](img/Inline_042_5.jpg)。\n\
  \n### 风险 (Risk)\n\n持有资产 `a` 的风险可以通过 `a` 的波动率来量化。\n\n### 无风险利率 (Risk-free rate)\n\
  \n零风险投资的理论收益率；无风险利率通常表示为 `r[f]`，代表投资者在不承担任何风险的情况下对任何投资所期望的最低收益。这通常被认为是任何风险较高投资至少应获得的下限，因为承担任何风险的回报应该比无风险投资更高。\n\
  \n### 预期（超额）收益 (Expected (excess) return)\n\n资产 `a` 的预期收益是未来预期的收益，通过 `IE(r[a])`\
  \ 计算。预期超额收益是 `a` 的超过无风险利率（或任何其他市场指标）的预期收益：`IE(r[a]) - r[f]`。\n\n### 风险溢价 (Risk premium)\n\
  \n资产 `a` 的风险溢价是 `a` 的超过无风险利率的预期收益，即 `IE(r[a]) - r[f]`。\n\n### 零成本组合 (Zero-cost portfolio)\n\
  \n零成本组合是指权重和为零的组合。例如，资产 `a` 的超额收益 `IE(r[a]) - r[f]` 就是一个零成本组合。它将 100%投资于 `a`，-100%投资于无风险利率。以\
  \ `r[f]` 借入的资金被投资于 `a`。由于投资者必须支付以 `r[f]` 借款的利息，他/她期望其在 `a` 中的投资能获得高于 `r[f]` 的回报。\n\
  \n### 可交易组合 (Tradable portfolio)\n\n如果一个组合是零成本组合，则称该组合是可交易的。\n\n### 投资组合多元化 (Portfolio\
  \ diversification)\n\n组合多元化是指向组合中添加更多投资，以减少单项投资固有的风险。它增加了盈利的可能性，或至少避免损失。通常情况下，多元化程度越高，风险和收益就越低。为了多元化而向组合中添加更多投资涉及将组合细分为许多较小的投资。如果组合规模增加而不是保持不变，组合的风险可能不会减少，特别是当添加的资产之间不相关时。这是一个关于多元化对组合方差之益的非常简单的例子。如果组合中的\
  \ `N` 个资产互不相关且具有相同的方差 `σ²`，则通过以等比例 `1/N` 持有所有资产使组合方差最小。此时，组合方差等于 `σ²/N`，随 `N` 单调减少。因此，即使添加的资产是不相关的，组合方差也会降低。当组合中加入负相关资产时，多元化的益处会放大。现代多元化的理解可以追溯到\
  \ 20 世纪 50 年代 Harry Markowitz [MAR 52] 的工作。\n\n### 市场组合 (Market portfolio)\n\n市场组合是一个完全多元化的组合，代表了整个市场的演变。在因子模型框架下，完全多元化的组合允许纯因子结构，即没有额外特异性风险的因子结构。\n\
  \n### 市场有效性 (Market efficiency)\n\n如果市场中资产的价格反映了所有可用信息，则认为市场是有效的。\n\n### 市场均衡 (Market\
  \ equilibrium)\n\n当需求量与供给量平衡时，发生市场均衡。在这种情况下，除非需求或供给发生变化，否则价格应该保持不变。\n\n### 套利 (Arbitrage)\n\
  \n套利是指获得无风险利润的可能性。\n\n### 市值 (Market capitalization)\n\n市值，也称为 `MC` 或 `cap.` (`MC`)，是公司发行股数乘以价格。它衡量公司的规模。它每天变化（`P`）。例如，在\
  \ 2010 年 10 月，市值最大的六家公司是（`T$` 代表万，`B$` 代表十）：\n\n1. 巴西电信 (Telecom Brasil)，市值为 `T$57`\
  \ 和 `B$99`\n2. 埃克森美孚 (Exxon Mobil)，市值为 `T$337.69` 和 `B$66.32`\n3. 苹果 (Apple)，市值为\
  \ `T$282.77` 和 `B$309.52`\n4. 中国石油 (PetroChina)，市值为 `T$229.20` 和 `B$125.23`\n5.\
  \ 宝拓 (BHP Billiton)，市值为 `T$224.83` 和 `B$80.81`\n6. 微软 (Microsoft)，市值为 `T$219.97`\
  \ 和 `B$25.42`。\n\n# 第 2 章\n\n# 因子选择\n\n## 2.1. 引言\n\n因子的模型时，需要确定因子的性质和数量。文献中可以区分两种方法：经验启发式方法和涉及子空间方法并产生所谓特征因子的统计学方法。\n\
  \n实证研究通常比较这两种方法（见 [CHE 93, CON 95, CHA 98, DAR 11]），并大多强调特征因子在预期属性（不相关因子）和其包含的解释百分比方面的优越性。然而，特征因子很难与观测宏观因子联系起来，这在某种程度上降低了它们对从业者的吸引力。\n\
  \n本章结构如下：2.2 节关注经验启发式方法，并介绍了文献中常用的三个参考模型。2.3 节中，我们介绍了统计方法。与需要观测数据先验知识的因子选择不同，纯统计方法从观测收益的时间序列中提取一组较小的隐含特征因子，这些因子解释了数据的大部分信息。问题变成了确定模型的阶。2.4\
  \ 节描述了来自信息论的一些经典技术。2.5–2.7 节是补充章节，为该方法的相关问题提供一些，例如数据的协方差估计、该方法与子空间方法的相似性以及该方法在大面板数据中的扩展。\n\
  \n## 2.2. 定性知识\n\n在经验启发式方法中，因子的性质和数量是根据对市场状况的先验考虑决定的。因子是观测的市场风险因子，通过主观选择纳入模型中。\n\
  \n\n\n文献中关于该主题已有大量研究，因此，在本节中，我们展示了三个主要的参考模型：Fama 和 French 的因子模型 [FAM 93]、Chen *等*\
  \ 模型 [CHE 86] ——这两个模型是为解释美国股票市场风险开发的；以及 Fung 和 Hsieh 的基于风险的因子模型 [FUN 01, HSI]，这是一个为了解释趋势跟踪型对冲基金所承担风险而的模型。\n\
  \n### 2.2.1 Fama 和 French 模型\n\nFama 和 French 的三因子模型 [FAM 93] 是资本资产定价模型（CAPM）的扩展。Fama\
  \ 和 French 观察到`small caps` 和`value` 股票经常优于市场，因此他们在 Sharpe 的市场模型中增加了两个因子：用于`small\
  \ minus big`（市值，`MC`）的 `SMB`，反映了小股相对于大股的相对表现；以及用于`high minus low`（账面市值）的 `HML`，反映了高价值相对于低价值股票的相对表现。`MC`\
  \ 提供了有关公司规模的信息（等于股票价格乘以发行股数）。账面市值与公司的会计价值相关（等于公司的 `MC` 除以该公司所有股票的会计价值）。\n\n例如，`SMB`\
  \ 因子可以在时间 `t` 按如下方式构建，针对长度为 `T` 的固定时期（从 `t` – `T` 到 `t`）：\n\n– 考虑股票市场中一个巨大的股票池，例如取\
  \ `t` 时的罗素 2000 股票指数的成份股；– 对于池中的每只股票，获取其从 `t` – `T` 到 `t` 的 `MC`；– 对于每个日期，根据其相对\
  \ `MC` 对股票进行排序；– 为了获得小股相对于大股的表现，为每个日期计算一个等权（或按市值加权）的组合，该组合由 `MC` 低于（相应地高于）特定值的股票组成；–\
  \ 然后计算 `SMB` 因子收益，即小 `MC` 组合与大 `MC` 组合之间的收益差。\n\n该步骤与构建 `HML` 因子的过程相同，但基于股票的账面市值值而非其\
  \ `MC` 值。\n\n这种方法被晨星（Morningstar）等用于使用五星级网格对股票和共同基金进行评分¹。\n\nCarhart 的四因子模型 [CAR\
  \ 97] 是 Fama 和 French 三因子模型 [FAM 93] 的扩展，包含一个动量因子。该模型证明可以解释股票基金平均收益和风险调整后收益的持续性。\n\
  \n### 2.2.2 Chen 等模型\n\nChen *等* [CHE 86] 模型是套利定价理论（APT）框架下的一个特例。通过研究美国市场的股票，作者识别了一组对解释预期收益具有显著意义的经济状态变量：工业生产、风险溢价的变化、收益率曲线的扭曲、意外通胀的衡量标准，以及这些变量在\
  \ във波动期间通胀的变化。虽然市值加权股票指数解释了大部分收益，但它对市场的影响并不显著。\n\n### 2.2.3 Fung 和 Hsieh 的基于风险的因子模型\n\
  \nFung 和 Hsieh 的基于风险的因子模型 [FUN 01, HSI] 是为了解释趋势跟踪型对冲基金所承担风险的模型。与 Fama 和 French 模型不同，该模型仅包含宏观经济因子。Fung\
  \ 和 Hsieh 的八个风险因子可在作者的网页上找到（参见 [HSI]），并从 1994 年 1 月起每月引用。表 2.1 提供了这些因子的某些基本统计。越来越多的文献致力于寻找准确的因子（参见\
  \ AGA 00, AGA 00b, AGA 04, AGA 09, SAD 10），其中最著名的模型之一是趋势跟踪模型：\n\n1) 三个趋势跟踪风险因子是特定的组合，用于描述不同的资产类别：i)\
  \ `PTFSCOM`，代表特定商品组合的收益；ii) `PTFSBD`，代表特定债券组合的收益；以及 iii) `PTFSFX`，代表特定外汇组合的收益；2)\
  \ 两个面向股票的风险因子基于股票指数：i) `SP500`，代表标准普尔 500 股票指数的总收益，以及 ii) `EquitySizeSpread` 代表美国股票中最小市值的表现，即大罗素\
  \ 2000 指数总收益与 `SP500` 之间的差值；3) 两个面向债券的风险因子代表债券市场：i) `Bond10y` 是 10 年期国债收益率的每月变化，以及\
  \ ii) `CreditSpread` 是穆迪 Baa 级收益率减 10 年期国债收益率的每月变化；4) 最近新增的新兴市场因子：i) `MXEF`，代表摩根士丹资本国际（MSCI）新兴市场指数的总收益。\n\
  \nFung 和 Hsieh 的八个风险因子可在作者的网页上找到（参见 [HSI]），并从 1994 年 1 月起每月引用。表 2.1 提供了这些因子的某些基本统计。这些统计数据包括：年化收益、年化波动率、年化收益与年化波动率之比（称为夏普比率）、期间内的最小和最大月收益，以及收益分布的偏度和峰度。\n\
  \n\n\n\n作为说明，图 2.1 展示了如果在 1993 年 12 月在每个因子上都投资了 100，这些因子的演变情况；图 2.2 代表了根据 1994 年\
  \ 1 月至 2012 年 12 月的每月因子收益计算出的这些因子之间的相关矩阵。可以区分出两组负相关因子：第一组由 `SP500`、`EquitySizeSpread`、`MXEF`\
  \ 和 `Bond10y` 组成，它们与其他四个因子呈负相关。此外，在每组内部，我们观察到因子之间存在非常弱的（正或负）相关性，但两个基于股票的风险因子（正相关性约为\
  \ 60%）以及两个与债券相关的风险因子（负相关性约为 45%）除外。\n\n**图 2.2。** *Fung 和 Hsieh 从 1993 年 12 月到 2012\
  \ 年 12 月底的八个风险因子的经验相关矩阵（见彩色版章节）*\n\n![images](img/img_3_53.jpg)\n\n宏观经济因子天然具有相关性。为了避免不同资产类别因子收益之间的相关性，可以通过逐步回归技术\
  \ [AGA 00b] 来选择因子：根据因子的相对判别能力，一个接一个从模型中引入或移除因子。使用其上升式版本时，首先选择单一最佳因子，然后将其与每个其他变量配对，选择次优因子，依此类推。模型的阶数不断增加，直到添加新因子不再提高前一个模型的判别能力为止。使用其下降式版本时，初始模型包含所有预选因子，并一个接一个地移除最差的因子，直到移除剩余因子中的一个不再提高前一个模型的判别能力为止。\n\
  \n## 2.3. 基于特征因子的定量方法\n\n在本节中，我们用 `eigenfactors` 表示通过对收益协方差矩阵进行特征向量分解从观测中获得的因子。在实证量化金融的文献中，`eigenfactors`\
  \ 可以被视为特殊的 `latent factors`（潜在因子），它们是通过收益线性组合得到的向量的子集。当对于可能驱动研究数据的经济因子没有*先验*知识时，通常会使用此类方法，并且具有显著的特性，即产生正交因子，特别是当使用子空间方法推导此类因子时。\n\
  \n在统计学文献中，最常用的方法是因子分析法（Factor Analysis）和主成分分析法（PCA）。此类方法主要用于降低观测矩阵的维度，它们使用相关矩阵的特征向量分解，并产生构建为收益线性组合的成分。最重要的结果是，通过仅保留少数选定的、关联特征值最高的特征向量，就可以以高准确率近似原始数据。因此，困难在于确定选择阈值。该问题的这部分将在\
  \ 2.4 节中讨论。\n\n### 2.3.1. 符号\n\n假设收益存储在 `T` × `N` 的矩阵 `R` 中，其中 `N` 列代表按规律频率采样的 `T`\
