  \ 导致：\n\n\\[3.48\\] ![image](img/img_2_109.jpg)\n\n# 3.13 实践\n\n本节是本章的应用部分。我们将研究三个不同的案例：\n\
  \n(1) 一个玩具示例，其中合成观测收益类似于两个观测已知因子（标普 500 指数和美国 10 年期债券）的线性组合；(2) 一个用于准确对冲特定投资组合系统风险的单因子模型（第\
  \ 3.13.2 节），然后 (3) 一个用于分析和分解 Fung 和 Hsieh [FUN 01] 定义的趋势跟踪对冲基金对多种市场风险敞口的多因子模型（第\
  \ 3.13.3 节）。\n\n## 3.13.1 合成数据上的估计方法比较\n\n### 3.13.1.1 数据描述\n\n在这个示例中，我们根据 1997\
  \ 年 9 月 10 日至 2012 年 12 月 19 日期间（约 15 年，`T` = 3,986 个每日数据），使用两个市场因子和考虑了 beta 的给定理论参数\
  \ ![image](img/Inline_110_12.jpg) 生成合成观测收益 `r[t]`。两个市场因子是：\n\n– 微标普 500 指数第一个通用期货的每日收益，记为\
  \ ![image](img/Inline_110_15.jpg)；– 美国 10 年期国债第一个通用期货的每日收益，记为 ![image](img/Inline_110_15.jpg)。\n\
  \n\n\n分段常数参数的估计结果所示图 3.6。总的来说，SW-OLS 和 KF 对参数 `w`[`t]` 的变化反应相当良好。需要注意的是，KF 的估计方差低于\
  \ SW-OLS，特别是当 SW-OLS 使用较小的窗口长度时。此外，正如预期的那样，SW-OLS 的估计值比 KF 的估计值更具滞后。\n\n**图 3.6。**\
  \ *对于方程 [3.51] 的合成和噪声收益率，SW-OLS (`h` = 21, 126, 252) 与 KF 的对比，该方程具有如 [3.52] 中定义的分段常数参数\
  \ `w`[`t]`（参见彩色版章节）*\n\n![image](img/img_3_114.jpg)\n\n在实践中，投资组合经理不会如此剧烈地调整其组合。这种情况虽然是极端的，但凸显了\
  \ KF 在动态环境中的跟踪能力。它证实了人们对这类滤波技术的日益增长的兴趣，用于动态对冲投资组合，或估计对冲收益中的非线性和动态风险敞口。\n\n下一个示例侧重于单因子模型，该模型用于对一个真实管理的多头印度股票组合进行动态对冲。目标是准确估计该管理组合相对于基准指数（Nifty\
  \ 指数）的敞口。\n\n## 3.13.2 基于单因子模型的市场风险对冲\n\n让我们在本节中假设观测到的收益率 `r`[`t]` 是多头股票组合的收益率。投资组合经理选择一部分股票进行投资，并根据他/她自己的市场直觉或投资委员会的决定来定义配置。\n\
  \n多头股票组合的构建和管理通常是为了优于给定的股票指数，这通常会导致组合收益率与股票指数本身之间存在很强的历史相关性。此类投资的预期是提供比股票指数收益更高的表现，这可能归于经理选择股票的能力，这些股票能够带来优于基准收益的某些\
  \ `α`。\n\n鉴于这种设定，我们可以观察到市场风险完全没有被对冲。多头策略并不预期会对市场中出现的任何风险进行对冲，而只是提供比给定基准更好的表现。\n\n\
  在必须对冲市场风险的情况下，我们必须回答：“投资组合对市场的依赖程度有多少？”\n\n正如因子模型所解释的，如果存在单一的市场风险（基准股票指数），则可以使用单因子模型将组合收益率与市场联系起来：\n\
  \n![image](img/img_7_15.jpg)\n\n其中 `α`[`t]` 是随时间变化的“Alpha”，`β`[`t]` 是投资组合对单因子 `f`[`t]`\
  \ 随时间变化的敞口，且 `f`[`t]` 具有前一节描述的属性。\n\n在这一应用中，多头股票组合的收益率是由资产经理管理的印度股票组合的收益率。经理根据自由裁量方法，基于对公司资产负债表相关的基本数字进行深度分析以及一系列财务比率来选择部分股票。所选的名称主要是增长型公司，经理坚信这些公司被低估了并且具有高水平的未来增长。每只股票在组合中都会保留一段时间，从一个月到几个月不等。组合包含\
  \ 15 到 30 只股票。该组合的净资产值（`NAV`）所示图 3.7，其中设置的初始值为 1000。收益已扣除所有费用（包括交易成本、管理费和绩效费），不包含任何现金。在图\
  \ 3.7 中，也报告了 BSE200 指数的 `NAV`。BSE200 指数是由印度股票市场市值最大的 200 只股票组成的指数。\n\n**图 3.7。**\
  \ *多头印度股票组合价格及两个参考指数：BSE200 指数和 Nifty 指数*\n\n![image](img/img_3_116.jpg)\n\n印度股票市场非常特殊：即使\
  \ BSE200 指数每日报价，但没有该指数的期货合约报价。只有最小 Nifty 指数的期货合约在交易，因此即使选择 BSE200 指数作为投资组合表现的基准参考，也不可能通过做空\
  \ BSE200 指数的期货合约来对冲组合。因此，单因子 `f` 是 Nifty 指数，用于计算模型参数的时间序列是通用 Nifty 指数期货的时间序列，这是一个经过展期调整的时间序列。\n\
  \n对冲程序呈现如下：\n\n- 在每个计算时间 `t`，使用方法 M 估计参数 `α`[`t]` 和 `β`[`t]`，如有必要，使用固定窗口长度。\n- 随后将估计的\
  \ `β`[`t]` 值用作反映组合过去收益率与因子过去收益率之间线性关系的参数：给定在 `t` 时对于 `[t, t + 1]` 期间需要对冲的组合的比例，我们将调整之前的做空期货合约数量\
  \ `q`[`t-1,t]`。\n- 在 `t` 时要做空的期货合约数量在 `[t, t + 1]` 范围内由 `q`[`t,t+1]` = Round(...)给出，在此方程中，`Round()`\
  \ 将值取整为整数，`NAV`[`t]` 表示 `t` 时的组合 `NAV`，而 `CV`[`t]` 表示 `t` 时期货合约的价值，等于其价格乘以该合约的一个点。\n\
  \n对冲程序在下文中所示：\n\n取决于用于估计 `β` 值的方法，产生的对冲组合将具有不同的行为，考虑到估计可能是滞后的、动态的或带有离群值的。\n\n**图\
  \ 3.8。** *多头组合对所选市场因子 Nifty 期货估计敞口的对比：a) 代表 beta 的动态估计，b) 和 c) 展示了在使用 RKF 或 rgKF-1（见第\
  \ 4 节）时的估计峰值*\n\n![image](img/img_2_118.jpg)\n\n\n\n结果如图图 3.10 所示，并比较了通过比例 Nifty\
  \ 指数期货进行对冲的纯多印度股票组合的净资产价值（NAV），这些期货价值由常数系数 OLS、63 天 SW-OLS、`KF`、`RKF` 或 `rgKF` 决定——详细介绍请参见第\
  \ 4 章。\n\n从实践角度来看，`KFs` 更为受欢迎，因为它能够对参数进行动态估计。在时间 `t` 时，对过去的唯一认知被完全总结在 `t − 1` 时给出的上组信息中，且无需指定任何窗口长度。此外，`KF`\
  \ 的方程引入了模型参数的动态演化，这为我们实际不了解的事物提供了一些 `a priori`（先验）信息。\n\n图 3.10. 通过比例 nifty 指数期货进行对冲的纯多印度股票组合的净资产价值，其计算方法分别为：(1)\
  \ 整个期间的 OLS，(2) 窗口期为 3 个月的 SW-OLS，(3) 卡尔曼滤波（KF），(4) 鲁棒卡尔曼滤波（RKF）以及 (5) 过滤掉异常值的卡尔曼滤波正则版本。经典的\
  \ `KF` 及其各种版本与组合对冲成本相比，似乎更为准确。\n\n![image](img/img_2_120.jpg)\n\n图 3.10 显示了 `RKF`\
  \ 和 `rgKF` 的结果。`KF` 方程假设状态和观测误差服从条件高斯分布，这在存在异常值时会失效。这些版本的 `KF` 考虑了观测方程中的异常值，`KF`\
  \ 递归方程经过正则化，因此对异常值具有鲁棒性。这些方法将在第 4 章介绍。\n\n### 3.13.3 使用多因子模型的对冲基金分析\n\n对冲基金（HF）行业的风险分析受到了关注，因为人们注意到，根据构造并公认\
  \ `HF` 收益具有非常特定的特征，例如肥尾和非对称分布、类期权收益以及动态风险敞口。\n\n使用多因子模型允许我们通过一组被选为非线性相关的变量来分解观测收益，并带来多维度的见解。选择合适因子的粗略任务已在第\
  \ 2 章讨论过。在该示例中，我们关注估计方法，并使用了八个 Fung 和 Hsieh 风险因子 `[HSI`。\n\n#### 3.13.3.1 Fung 和\
  \ Hsieh 风险因子\n\n第 2 章描述的 Fung 和 Hsieh 的八个风险因子 `[HSI]` 以 1994 年 1 月至 2012 年 12 月的每月数据为频率，包括：\n\
  \n– 三个`趋势`风险因子：`PTFSBD`（基于债券的风险因子）、`PTFSFX`（基于货币的风险因子）和 `PTFSCOM`（基于商品的风险因子）；–两个`股票型`风险因子：`SP500`（标准普尔\
  \ 500 指数）和 `EquitySizeSpread`（规模差异因子，表示为罗素 2000 指数每月总收益与 `SP500` 收益之间的差值）；–两个`债券型`风险因子：`bond10y`（10\
  \ 年期国债期限收益率的每月变化）和 `CreditSpread`（穆迪 Baa 级收益率每月变化与 `bond10y` 之间的差值）；–一个`新兴市场`风险因子：`MXEF`（摩根士丹国际新兴市场指数）。\n\
  \n这些因子存储在每个时间 `t` 的 `f[t]` 中，作为 `[1.4]` 的输入。\n\n#### 3.13.3.2 对冲基金数据\n\nFung 和 Hsieh\
  \ 的八个风险因子最初是为了解释趋势跟踪型基金，因此我们选择了`方向性`对冲基金，例如`全球宏观`对冲基金。全球宏观对冲基金经理可能在货币、债务、股票或商品上采取方向性头寸，也可能选择结合`多头`与`空头`相互对冲的`相对价值`头寸。\n\
  \n我们说明了不同估计方法在一个名为 Aequam Diversified Fund 的趋势跟踪对冲基金上的表现，该基金自 2010 年 12 月 17 日以来由\
  \ Aequam Capital 管理。该基金是一个系统的 `HF`，对债券期货、股票指数期货、外汇期货和商品期货进行多头和空头操作。该基金自 2012 年 6\
  \ 月起是一个 UCITS IV 基金，是一个每周审计的基金，管理资产规模（AUM）约为 2000 万美元。尽管该基金于 2010 年开放，但我们可以获取其自\
  \ 2004 年以来的历史和回测表现。系统基金具有这种特殊性：回测表现是可靠的，因为商品交易顾问（CTA）和系统基金运行的设计流程与基金投入后运行的流程完全相同。此外，管理期货为基金提供了高流动性。\n\
