    ## **2.7.1.** ***Large panel data criteria***


    AIC, BIC and MDL are not consistent when both cross-sectional and time dimension
    increase. Bai and Ng \[BAI 02\] developed an asymptotic theory for the *approximate*
    factor models of Chamberlain and Rothschild \[CHA 83\] with large panel data.
    This results in consistent estimators (the so-called *IC*[*p*] and *PC*[*p*] estimators)
    that compute the number of eigenvalues larger than a threshold value, specified
    by a chosen penalty function. Onatski \[ONA 06\] modified these estimators by
    computing the threshold from the empirical distribution of the eigenvalues. In
    a similar context, Ahn and Horenstein \[AHN 09\] proposed the eigenvalue ratio
    (ER) and the growth ratio (GR) estimators, obtained simply by maximizing the ratio
    of two adjacent eigenvalues. Recent advances in the field of random matrix theory
    (RMT), which provides mathematical tools to characterize the empirical eigenvalue
    distribution for many symmetric matrices \[ELD 05\], can also be used in this
    context \[POT 05\].


