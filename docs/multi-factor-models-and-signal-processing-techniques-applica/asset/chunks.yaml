    Huber’s `M`-estimator is defined for the specific weighting function `u`:


    \[2.33\] ![images](images/img_14_66.jpg)


    where `I1(x)` is the indicator function defined by `I1(x) = 1` if `x` is verified,
    0 otherwise.


    Huber’s estimator is then a solution to:


    \[2.34\] ![images](images/img_19_66.jpg)


    Function [2.33] is shown in [Figure 2.4](#c24). Parameters `a` and `β` are adjustable:
    `a` allows us to control the percentage of data to be attenuated and `β` allows
    us to control the distance between the asymptotic value of the estimator and its
    theoretical value. If `a` is large, then Huber’s estimator behaves like the SCM:
    it means that the amount of data to be considered as outliers or outside the main
    distribution is negligible, so that all the samples are taken into account in
    the estimation. On other hand, if `a` is small, then Huber’s estimator tends toward
    the fixed point (FP) estimator. The latter is described hereafter.


    [Figure 2.4](#c24). Weighting function `u` of the Huber’s M-estimator when `a
    = 0.4` and `β = 0.5` ![images](images/img_37.jpg)


