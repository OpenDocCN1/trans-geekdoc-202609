  trans: '

    分段常数参数的估计结果所示图 3.6。总的来说，SW-OLS 和 KF 对参数 `w`[`t]` 的变化反应相当良好。需要注意的是，KF 的估计方差低于 SW-OLS，特别是当
    SW-OLS 使用较小的窗口长度时。此外，正如预期的那样，SW-OLS 的估计值比 KF 的估计值更具滞后。


    **图 3.6。** *对于方程 [3.51] 的合成和噪声收益率，SW-OLS (`h` = 21, 126, 252) 与 KF 的对比，该方程具有如
    [3.52] 中定义的分段常数参数 `w`[`t]`（参见彩色版章节）*


    ![image](img/img_3_114.jpg)


    在实践中，投资组合经理不会如此剧烈地调整其组合。这种情况虽然是极端的，但凸显了 KF 在动态环境中的跟踪能力。它证实了人们对这类滤波技术的日益增长的兴趣，用于动态对冲投资组合，或估计对冲收益中的非线性和动态风险敞口。


    下一个示例侧重于单因子模型，该模型用于对一个真实管理的多头印度股票组合进行动态对冲。目标是准确估计该管理组合相对于基准指数（Nifty 指数）的敞口。


    ## 3.13.2 基于单因子模型的市场风险对冲


    让我们在本节中假设观测到的收益率 `r`[`t]` 是多头股票组合的收益率。投资组合经理选择一部分股票进行投资，并根据他/她自己的市场直觉或投资委员会的决定来定义配置。


    多头股票组合的构建和管理通常是为了优于给定的股票指数，这通常会导致组合收益率与股票指数本身之间存在很强的历史相关性。此类投资的预期是提供比股票指数收益更高的表现，这可能归于经理选择股票的能力，这些股票能够带来优于基准收益的某些
    `α`。


    鉴于这种设定，我们可以观察到市场风险完全没有被对冲。多头策略并不预期会对市场中出现的任何风险进行对冲，而只是提供比给定基准更好的表现。


    在必须对冲市场风险的情况下，我们必须回答：“投资组合对市场的依赖程度有多少？”


    正如因子模型所解释的，如果存在单一的市场风险（基准股票指数），则可以使用单因子模型将组合收益率与市场联系起来：


    ![image](img/img_7_15.jpg)


    其中 `α`[`t]` 是随时间变化的“Alpha”，`β`[`t]` 是投资组合对单因子 `f`[`t]` 随时间变化的敞口，且 `f`[`t]` 具有前一节描述的属性。


    在这一应用中，多头股票组合的收益率是由资产经理管理的印度股票组合的收益率。经理根据自由裁量方法，基于对公司资产负债表相关的基本数字进行深度分析以及一系列财务比率来选择部分股票。所选的名称主要是增长型公司，经理坚信这些公司被低估了并且具有高水平的未来增长。每只股票在组合中都会保留一段时间，从一个月到几个月不等。组合包含
    15 到 30 只股票。该组合的净资产值（`NAV`）所示图 3.7，其中设置的初始值为 1000。收益已扣除所有费用（包括交易成本、管理费和绩效费），不包含任何现金。在图
    3.7 中，也报告了 BSE200 指数的 `NAV`。BSE200 指数是由印度股票市场市值最大的 200 只股票组成的指数。


    **图 3.7。** *多头印度股票组合价格及两个参考指数：BSE200 指数和 Nifty 指数*


    ![image](img/img_3_116.jpg)


    印度股票市场非常特殊：即使 BSE200 指数每日报价，但没有该指数的期货合约报价。只有最小 Nifty 指数的期货合约在交易，因此即使选择 BSE200
    指数作为投资组合表现的基准参考，也不可能通过做空 BSE200 指数的期货合约来对冲组合。因此，单因子 `f` 是 Nifty 指数，用于计算模型参数的时间序列是通用
    Nifty 指数期货的时间序列，这是一个经过展期调整的时间序列。


    对冲程序呈现如下：


    - 在每个计算时间 `t`，使用方法 M 估计参数 `α`[`t]` 和 `β`[`t]`，如有必要，使用固定窗口长度。

    - 随后将估计的 `β`[`t]` 值用作反映组合过去收益率与因子过去收益率之间线性关系的参数：给定在 `t` 时对于 `[t, t + 1]` 期间需要对冲的组合的比例，我们将调整之前的做空期货合约数量
    `q`[`t-1,t]`。

    - 在 `t` 时要做空的期货合约数量在 `[t, t + 1]` 范围内由 `q`[`t,t+1]` = Round(...)给出，在此方程中，`Round()`
    将值取整为整数，`NAV`[`t]` 表示 `t` 时的组合 `NAV`，而 `CV`[`t]` 表示 `t` 时期货合约的价值，等于其价格乘以该合约的一个点。


    对冲程序在下文中所示：


    取决于用于估计 `β` 值的方法，产生的对冲组合将具有不同的行为，考虑到估计可能是滞后的、动态的或带有离群值的。


    **图 3.8。** *多头组合对所选市场因子 Nifty 期货估计敞口的对比：a) 代表 beta 的动态估计，b) 和 c) 展示了在使用 RKF 或
    rgKF-1（见第 4 节）时的估计峰值*


    ![image](img/img_2_118.jpg)

    '
