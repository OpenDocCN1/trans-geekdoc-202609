    using rolling window LS can miss a sudden style rotation decided by the portfolio
    manager. On the contrary, this estimation method provides very good results when
    style drifts are small and/or implemented step by step.


    The KF approach is by definition more reactive and can capture in theory quick
    style rotations. However, this approach works well only when the relevant factors
    are used in [equation \[1.4\]](#c01.xhtml#eqn4). Indeed, assumptions made up of
    the statistical behavior of the residual returns are more constraining, and any
    failure can have a huge impact of the filtered time-varying exposures. It is,
    for example, the case when residual returns do not follow a Gaussian distribution.
    Commonalities and discrepancies between LS and KF are discussed in Chapter 3,
    and an enhanced version of KF is discussed in Chapter 4.


    # 1.5. Historical perspective


    Factor models have been the focus of numerous studies in empirical finance since
    Treynor \[TRE 62\], Sharpe \[SHA 64\], Lintner \[LIN 65\] and Mossin \[MOS 66\]
    developed the capital asset pricing model (CAPM) in the 1960s.


    ## 1.5.1. CAPM and Sharpe’s market model


    CAPM lays the foundation for all the existing factor models. It gives the theoretical
    equilibrium relationship that should occur between the returns and the risks of
    individual assets with regard to the market returns.


    Its conception is based on two fundamental financial concepts: market equilibrium
    that occurs if the amount of demand is balanced by the amount of supply (represented
    by the market portfolio), and, as a result, the mean-variance efficiency of the
    market portfolio.


