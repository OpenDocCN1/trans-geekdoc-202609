    the style analysis, both long- and short-term benchmarks are misspecified, and
    the portfolio manager’s added value is not correctly calculated. In particular,
    we can interpret positive risk-adjusted returns as a manager’s skills and omit
    an important risk exposure. In the portfolio allocation example, omitted factors
    imply residual correlations between idiosyncratic risk terms. As these correlations
    are not taken into account in the calculation of the optimal portfolio, we underestimate
    the portfolio risk or, in other words, we overestimate the diversification effect.


    A second solution is to use statistical approaches to filter from the asset returns
    distribution (and, in particular, the covariance matrix) unobservable factors
    that are able to explain the cross-section of returns. If this approach seems
    appealing to a statistical point of view, it has also many drawbacks from a financial
    point of view. First, it is, in general, difficult to give an economic interpretation
    of these statistical factors. Second, the factor representation is not unique,
    and any linear combination of a given set of factors defines an equivalent factor
    model. Third, the factor decomposition is, in general, time-varying and then difficult
    to interpret. Both approaches are described in detail in Chapter 2.


    ## 1.4.2. Parameters estimation

