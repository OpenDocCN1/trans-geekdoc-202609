    # 3.14. KF 更新方程的几何推导


    ## 3.14.1. MSE 准则与 MMSE 求解的几何解释


    关于 KF 的介绍和推导在论文和书中随处可见。在本介绍章节，我们没有遵循依赖条件概率密度的概率或贝叶斯方法（这种方法通常会让想理解 `KF` 更新来源的初学者望而却步），而是建立了一个
    `KF` 的完整几何基础，这更接近直觉和欧几里得知识，也是大多数研究生读者的共同常识。


    为此，第一步是对问题陈述 [3.32] 和 `t` − 1 时的 `MMSE` 准则给出几何解释。事实上，第 3.11 节给出的 `KF` 更新取决于 `t`
    − 1 时的之前的估计值。


    在图 3.16 中，平面代表观测空间 ![image](img/Inline_128_6.jpg)，由随机变量 {`r`[1], …, `r`[`t`]^(−1)}
    跨越。![image](img/Inline_128_7.jpg) 任何 ![image](img/Inline_128_8.jpg) 的向量元素都与 ![image](img/Inline_128_9.jpg)
    线性相关，并由属于平面的虚箭头表示。通常，`t` − 1 时的状态 `θ`[`t`−1] 不属于观测平面，因此包含了一部分与随机变量 {`r`[1], …,
    `r`[`t`−1]} 不相关（在统计上正交）的统计信息。


    `MSE`，即 ![image](img/Inline_128_11.jpg)，从几何上看可以看作图 3.16 中用虚线画的“差向量” ![image](img/Inline_128_13.jpg)
    的欧几里得范数平方 ![image](img/Inline_128_12.jpg)，即 ![image](img/Inline_128_14.jpg)。因此，最小的
    `MSE` 与 ![image](img/Inline_128_15.jpg) 的最小几何平方范数相关，当元素 `ξ`[|t`−1] 与 `θ`[`t`−1]
    在观测平面 ![image](img/Inline_128_16.jpg)上的正交投影重合时，如图 3.16 所示：


