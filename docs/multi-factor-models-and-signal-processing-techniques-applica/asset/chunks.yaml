    ![images](images/img_4_27.jpg)

    ```


    with `NAV`[`i,0]` = 100 (end of January 2003).


    ## 1.2.2 Factor representation


    A factor model is a multivariate regression linking the returns of a set of risky
    assets to several factors. We focus our attention on linear factor models where
    the relationship between factors and returns is linear.


    Factors represent fundamental data, statistical factors or specific portfolios.
    Fundamental data are specified using economic theory and the knowledge of financial
    markets and include macroeconomic variables such as the inflation rate, the unemployment
    rate and the gross national product. Typically, macroeconomic variables are correlated.


    To select uncorrelated factors, empirical dimension reduction techniques, such
    as factor analysis (FA) or principal component analysis (PCA), are performed on
    the covariance matrix of the returns of the risky assets. It gives rise to `eigenfactors`
    arising from an eigenvalue decomposition of the covariance matrix.


    However, factors can be substituted by specific portfolios, especially if they
    represent different strategies that an investor can pursue at a low cost. The
    factors represent the various sources of risk present in the market to which an
    investor is exposed.


    We now introduce the following linear factor model specification. The returns
    of a set of `N` risky assets indexed by `i` = 1, …,*, `N` are assumed to be wide-sense
    stationary, and can be expressed, for `t` = 1, …,*, `T*`, by:


    ```

    ![images](images/img_6_28.jpg)

    ```


    where:


    – `r[t]` = `[r[1],t], …,*, r[N,t]]′` is the `N`-dimensional vector of the risky
    asset returns at time `t`; – `f[t]` = `[f[1,t], …,*, f[K,t]]′` is the `K`-dimensional
    vector of values of `common risk factors` at `t` whose covariance matrix is `Σ[f]`
    ; `B` = `[b[1], …, b^K]` is a `N` × `K` matrix where each element `b[i,k]` defines
    the exposure (or sensitivity) of the asset `i` to risk factor `k`. The sensitivities
    of asset `i` to the `K` factors are the `K`-dimensional row-vector `b[i]` = `[b[i,1],
    …,*, b[i,K]]`. It is also referred to as `beta`; – `α` = `[α[1], …, α[N]]′` denotes
    the `N`-dimensional vector of intercepts and is called `alpha`; and – `[t]` =
    `[ε[1,t], …,*, ε[N,t]]′` is the `N`-dimensional vector of zero-mean asset-specific
    returns whose covariance matrix is `Σ[ε]`. In `4`, the unknown `N` × (`K` + 1)
    matrix of parameters is `Θ` = `[θ[1], …, θ[N]]′` = `αB` and the inputs of the
    model are `r[t]` and `f[t]`. Let `ε[i]` = `[ε[i,1], …,*, ε[i,t]]′` and `f[k]`
    = `[f[k,1], …,*, f[k,T]]′` denote the `t`-dimensional vectors of, respectively,
    the residual returns of asset `i` and the values of factor `k`.


    Additional assumptions are made for `4`:


    A1) The residual returns are uncorrelated with each of the factors: `ε[i,k]` =
    0 for `i` = 1, …, `N*`, `k` = 1, …, `K*`.

    A2) The residual returns are temporally uncorrelated: `ε[i,t]` = 0 for `t[1]`
    ≠ `t[2]`.

    A3) The residual returns are uncorrelated, that is `Σ[ε]` is a diagonal matrix.


    Assumption A3 means that the only sources of correlation among asset returns are
    those that arise from their exposures to the factors and the covariances among
    the factors. Residuals of asset returns are assumed to be unrelated to each other
    and hence `specific` to each asset. In other words, the risk associated with the
    residual return is `idiosyncratic` to the asset.


    Note that the covariance matrix of the asset returns specified by `4` is:


    ```

    5 ![images](images/img_2_30.jpg)

    ```


    The right-hand side of `5` consists of two distinct terms: `BΣ[f]′` is called
    `systematic risk`, that is the risk explained by the `K` common factors and also
    known as `non-diversifiable risk`, `beta risk` or `market risk`.


    The second term, `Σ[ε]`, is called `idiosyncratic risk`, also known as `diversifiable
    risk` or `asset-specific risk` and is totally specific to the assets.


    As opposed to the `non-diversifiable systematic risk`, an investor has the possibility
    to reduce the amount of the `asset-specific risk` by properly diversifying his
    (or her) investments. Note also that `Σ[f]` is diagonal when `eigenfactors` are
    selected.


    When `N` is large, using `5` helps to narrow down the dimensionality to estimate
    the covariance matrix `Σ[r]`. On one hand, the number of terms that must be estimated
    reduces significantly and on the other hand, `K < t` usually meets the requirement
    to obtain an invertible estimated covariance matrix.


    # 1.3 Why factor models in finance?


    ## 1.3.1 Style analysis


    Let us consider a portfolio of `n` risky assets whose returns are `r[i,t]`, `i`
    = 1, …, `N*`. The portfolio returns are denoted by `r[p,t]` and are obtained from
    `r[i,t]`, `i` = 1, …, `N*` by the following formula:


    ```

    ![images](images/img_11_30.jpg)

    ```


    where `r[t]` = `[r[1,t], …,*, r[N,t]]′` and `a` = `[a[1], …, a[N]]′` is the vector
    of (fixed) weights of assets in the portfolio. The distribution of `r[p,t]` depends
    directly on the joint distribution of the vector `r[t]`, which can be considered
    as the factors explaining the portfolio performance. However, these factors can
    be highly correlated and/or unobserved (when we do not know the portfolio manager
    investment universe). A more parsimonious and tractable representation is then
    obtained using a small number of observed factors correlated with the portfolio
    performance. However, we must consider in this case the potential error made in
    explaining portfolio returns with a set of “common” factors. This explains why
    we introduce error terms in the linear factor representation.


    A given portfolio allocation basically reflects the portfolio manager’s bets.
    If we assume that these bets remain unchanged over the whole observation period,
    then the approach described above is relevant. However, from a practical standpoint,
    these bets are in general time-varying. The portfolio manager reallocates his/her
    portfolio on a continuous basis, and only the average exposure to factors is obtained
    through this classical return-based style analysis (see [SHA 92] for greater details
    on this approach). The linear combination of factors exposures and their respective
    performance gives then the strategic or long-term portfolio benchmark. The value
    added by the portfolio manager (or market timing ability) is then defined as the
    return difference between this portfolio returns and the strategic long-term benchmark
    (see [DAR 12]).

