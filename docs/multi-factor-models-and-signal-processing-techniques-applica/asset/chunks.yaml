    Once a set of factors is chosen, parameters estimation consists of computing numerical
    values of factors exposures. When parameters are not time-varying, least squares
    (LS) approaches can be used to compute these estimators, depending on the residual
    properties. However, both in the style analysis of section 1.3.1 and the optimal
    portfolio allocation problem of section 1.3.2, parameters can be time-varying
    and more complex statistical filtering approaches must be used (see e.g. \[BOL
    09, PAT 13\]) such as the Flexible Least Squares \[KAL 89, MAR 04\], the Kalman
    filter (KF) \[RON 08a, RON 08b, RAC 10\] or Markov switching regimes \[BIL 12\].


    The LS estimator can always be computed on rolling windows, updated each time
    we get new data. This provides a time series of estimators that have then a time-varying
    behavior. However, this approach, if useful when changes in parameters over time
    are smooth, can be misleading when big changes occur. A style analysis computed
    using rolling window LS can miss a sudden style rotation decided by the portfolio
    manager. On the contrary, this estimation method provides very good results when
    style drifts are small and/or implemented step by step.


    The KF approach is by definition more reactive and can capture in theory quick
    style rotations. However, this approach works well only when the relevant factors
    are used in [equation \[1.4\]](#c01.xhtml#eqn4). Indeed, assumptions made up of
    the statistical behavior of the residual returns are more constraining, and any
    failure can have a huge impact of the filtered time-varying exposures. It is,
    for example, the case when residual returns do not follow a Gaussian distribution.
    Commonalities and discrepancies between LS and KF are discussed in Chapter 3,
    and an enhanced version of KF is discussed in Chapter 4.


    # 1.5. Historical perspective


    Factor models have been the focus of numerous studies in empirical finance since
    Treynor \[TRE 62\], Sharpe \[SHA 64\], Lintner \[LIN 65\] and Mossin \[MOS 66\]
    developed the capital asset pricing model (CAPM) in the 1960s.


    ## 1.5.1. CAPM and Sharpe’s market model


    CAPM lays the foundation for all the existing factor models. It gives the theoretical
    equilibrium relationship that should occur between the returns and the risks of
    individual assets with regard to the market returns.


    Its conception is based on two fundamental financial concepts: market equilibrium
    that occurs if the amount of demand is balanced by the amount of supply (represented
    by the market portfolio), and, as a result, the mean-variance efficiency of the
    market portfolio.


    Given the risk-free rate `r`[*f`] and the risk `σ`[*m`] of the market portfolio
    `m`, the CAPM stipulates that the returns we expect from individual assets in
    excess of `r`[*f`] are given in proportion to the excess returns expected from
    the market, as follows:


    \[1.6\] ![images](images/img_8_37.jpg)


    where ![images](images/Inline_39_2.jpg)is related to the amount of risk given
    by `i`, with `γ`[*im`] being the covariance between `r`[*i`] and `r`[*m*]. Larger
    values of `β`[*i`] correspond to larger expected return and larger risk for asset
    `i`. The term `(IE(r[m,t]) - r[f])` is called market risk premium.


    In practice, the unknown parameter `β`[*i`] is estimated through the following
    univariate regression using historical data for the asset returns, the market
    portfolio and the risk-free rate:


    \[1.7\] ![images](images/img_4_38.jpg)


    where ![images](images/e.gif)[*i,t*] satisfies `IE([images](images/e.gif)[i,t*])
    = 0`. Additional parameter `α`[*i`] is the asset alpha. The strict form of \[1.6\]
    specifies that alpha must be zero and that deviation from zero is the result of
    temporary disequilibrium. With `α`[*i] = 0` in \[1.7\], this model coincides with
    Sharpe’s market model that is an output of \[1.6\]. The market portfolio is usually
    replaced by a major standard equity index (such as the S&P500) since Black \[BLA
    72\] has shown that in market equilibrium, such market-value weighted indices
    are always efficient. The parameter `α`[*i`] can be used to perform fitted performance
    analysis (see \[DAR 10\]).


    CAPM results can be represented by the so-called security market line (SML) as
