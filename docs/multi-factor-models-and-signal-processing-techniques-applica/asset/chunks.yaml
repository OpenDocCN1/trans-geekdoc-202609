    ### A1.1. 高斯分布


    #### A1.1.1. 高斯向量（具有多元高斯密度）


    如果一个 `N` 维随机向量 `x` 服从高斯分布，则其概率密度完全由它的前两个中心矩刻画，即其均值 `μ = IE[x]` 和满秩（可逆）协方差矩阵 ![images](img/Inline_157.jpg)，其表达式如下：


    \[A1.1\] ![images](img/img_7.jpg)


    其中 `|Σ` 表示协方差矩阵 `Σ`。


    #### A1.1.2. 具有相同方差的白高斯向量


    向量 `x` 被称为“白”的，如果其分量 `x[*k]` (`1 ≤ k ≤ N`) 是独立的。这意味着随机变量之间是不相关的。如果一个高斯向量具有相同的方差，则其协方差矩阵正比于
    `N` 单位矩阵。这表明 `x` 是白的。概率密度仅取决于 `N` 参数，即均值和方差。


    #### A1.1.3. 高斯变量


    当 `N = 1` 时，`A1.1` 变为高斯变量概率密度：


    \[A1.3\] ![images](img/img_158.jpg)


