    \n[**Table 3.2.**](#c03.xhtml#tab3-2) *Averaged statistics and correlation for\
    \ the eight risk factors of Fung and Hsieh and Aequam Diversified Fund. Computation\
    \ of the statistics is made on monthly returns from January 2004 to December 2012*\n\
    \n![image](images/img_3_123.jpg)\n\n[**Figure 3.11.**](#c03.xhtml#Fig_11) *Time\
    \ series evolution of the eight risk factors of Fung and Hsieh and Aequam Diversified\
    \ Fund given a base 100 in December 2003 and compounding the monthly returns*\n\
    \n![image](images/img_5_123.jpg)\n\n[**Figure 3.12.**](#c03.xhtml#Fig_12) *Estimated\
    \ and observed hedge fund returns for Aequam Diversified Fund (see color plate\
    \ section)*\n\n![image](images/img_2_124.jpg)\n\n[Figure 3.12(b)](#c03.xhtml#Fig12)\
    \ represents the evolution, in a logarithmic scale, of the absolute relative error\
