    # Appendix


    ## Some Probability Densities


    ### A1.1. Gaussian distribution


    #### A1.1.1. Gaussian vector (with a multivariate Gaussian density)


    If an `N`-dimensional random vector `x` is Gaussian distributed, then its probability
    density is fully characterized by its two first centered moments, its mean `μ
    = IE[x]` and its full-rank (invertible) covariance matrix ![images](images/Inline_157_6.jpg)
    whose expression is as follows:


    \[A1.1\] ![images](images/img_7_156.jpg)


    where `|Σ|` denotes the determinant of the covariance matrix `Σ`. It is usually
    denoted by ![images](images/Appendix_image001.gif).


    #### A1.1.2. White Gaussian vector with iso-variance components


    The vector `x` is said to be “white” if its `N` components `x[*k*]`, `1 ≤ k ≤
    N` are independent. This implies that random variables are uncorrelated. If a
    random vector is Gaussian, sharing the same variance, then its covariance matrix
    is proportional to the `N` identity matrix. It follows that `x` is white. The
    probability density depends only on `N` parameters, which are the mean and the
    variance. In particular, if `x` is zero mean, the variance is `σ²`.


    #### A1.1.3. Gaussian variable


    If `N = 1`, then `A1.1` becomes the Probability Density of a Gaussian variable:


    \[A1.3\] ![images](images/img_158.jpg)


    # A1.2. χ² distribution


    #### A1.2.1. χ² probability density


    A random variable `x` is `χ²`-distributed with `ν` degree of freedom if, and only
    if, its probability density is given by:


    \[A1.4\] ![images](images/img_8.jpg)


    where `Γ(**)` is the gamma function defined for all complex number `z` by:


    \[A1.5\]](#Appendix.xhtml#eqn5) ![images](images/img_28.jpg)


    In particular, we have `IE(x) = ν` and `V ar(x) = 2ν`.


    #### A1.2.2. A χ² variable is the sum of squared Gaussian variables


    If we consider `N` i.i.d. Gaussian random variables `x[*i]`, with mean `μ[*i]`
    and variance `σ[*i]`, for `i = 1, … , N`, then:


    \[A1.6\] ![images](images/img_7.jpg)


    Following the central limit theorem, as soon as `N` is large (`N > 100`), the
    distribution of the random variable `y` may be approximated by a Gaussian distribution
    with mean `N` and variance `2N`.


    # A1.3. Student’s t-distribution


    #### A1.3.1. Student’s t-probability density


    The Student’s `t`-distribution of a random variable `t` is characterized by a
    single parameter `ν ≥ 0` and is given by:


    \[A1.7\] ![images](images/img_13.jpg)


    It is usually denoted as `t ~ t(ν)`. In particular, we have `IE(t) = 0` for `ν
    > 1`, `IE(t)` undefined for `ν = 1` and infinite for `ν ≤ 2`. The function `Γ(**)`
    is given in [equation \[A1.5\]](#Appendix.xhtml#eqn5).


    #### A1.3.2. A Student’s t variable is the ratio between a Gaussian-distributed
    variable and a χ²-distributed variable


