    - 索引\n- 图表\n\n![image](img/img_1.jpg)\n\n# 前言\n\n随着电子市场的爆发以及量化模型在交易、订单执行和风险管理中的广泛应用，金融市场已从几十年前的低技术环境演变为如今市场参与者经常采用先进数据技术的环境。由于需要分析的海量数据带来的运营限制，产生了对智能数据和建模的需求。\n\
    \n与传统的组合理论工具（主要基于组合损失分布的静态分析）相比，基于随机过程的模型允许风险经理获得一个动态的、更真实的组合风险视角，并随着新信息的披露进行动态更新。然而，使用此类动态模型是有代价的：我们需要更先进的工具来对这些模型进行估计、模拟和分析。在工程领域已使用已的工具（例如\
    \ `KF`），尽管某些风险管理专业人士并不熟悉，但在超越静态设置时，这些工具被证明是十分重要的。\n\n同时，高维模型的使用带来了新的估计问题：在许多资产配置问题中，只有几年的时间（即数百个每日观测值）来估计描述数百甚至数千风险因子演变的参数。在这种背景下，传统的估计方法（如主成分分析和基础协方差分析）无法保持一致性，并产生意料之外（且有偏差的！）结果。随机矩阵理论等工具最初用于核物理中模拟复杂原子核能级，最近被用于探索此类估计偏差并提出克服它们的方法。\n\
    \n凭借作为具有深厚研究和技术背景的量化风险专业人士的双重身份，Serge Darolles、Patrick Duvaut 和 Emmanuelle Jay\
    \ 出色地介绍了一系列优秀的高级信号处理工具和统计模型。这些工具以自成体系的方式解决了上述某些问题，其深度对于从事量化风险管理的学生和专业人士来说是易于理解的。\n\
    \n![image](img/img_2.jpg)\n\n![image](img/img_3.jpg)\n\n"
