    #### A1.2.1. χ² 密度


    随机变量 `x` 以 `ν` 为自由度服从 χ² 分布，当且仅当其概率密度给出：


    \[A1.4\] ![images](img/img_8.jpg)


    其中 `Γ(**)` 是对复数 `z` 定义的：


    \[A1.5\]](#Appendix.xhtml#eqn5) ![images](img/img_28.jpg)


    特别地，我们有 `IE(x) = ν` 且 `V ar(x) = 2ν`。


    #### A1.2.2. χ² 变量是高斯变量的和


    如果我们考虑 `N` 个独立分布（i.i.d.）的高斯随机变量 `x[*i]`，其均值为 `μ[*i]`，方差为 `σ[*i]`（`i = 1, …, N`），则：


    \[A1.6\] ![images](img/img_7.jpg)


    根据中心极限定理，当 `N` 足够大（`N > 100`）时，随机变量 `y` 的分布可以用均值为 `N`、方差为 `2N` 的高斯分布近似。


    # A1.3. t 分布


    #### A1.3.1. t 分布


    随机变量 `t` 的 t 分布由单一参数 `ν ≥ 0` 刻画并给出：


    \[A1.7\] ![images](img/img_13.jpg)


    它通常记为 `t ~ t(ν)`。特别地，当 `ν > 1` 时 `IE(t) = 0`，`ν = 1` 时 `IE(t)` 未定义，`ν ≤ 2` 时为无穷。函数
    `Γ(**)` 在[公式 \[A1.5\]](#Appendix.xhtml#eqn5) 中给出。


    #### A1.3.2. t 变量是高斯分布变量与 χ²分布变量的比值


