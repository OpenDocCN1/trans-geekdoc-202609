    # Conclusion


    As mentioned in the introduction, our objective in this book is to adapt the QUANT(ITATIVE)
    tools to the new financial world characterized by noisy data, enhanced risk controls
    and an increasing demand for more transparency. Throughout this book, the classic
    linear factor model is our benchmark to prove how the statistical signal processing
    (SSP) techniques can help in solving this task. Keeping a “user friendly” framework
    that gives an intuitive explanation of most of the stylized facts empirically
    observed, we show that more complex phenomena, such as nonlinearities or liquidity
    issues, can be taken into account to obtain robust results.


    Of course, this robust treatment has a cost in terms of complexity. Kalman filter
    estimators must replace least squares estimators; regularization techniques have
    to be implemented to treat the noisy impact of illiquidity on asset returns. But
    SSP gives us a proven technical framework, which is easy to adapt in our context.
    We have shown in the different chapters how factor selection and parameter estimation
    can be done to get these robust results that we are targeting.


    Most of our empirical illustrations come from the asset management industry, and
    in particular the hedge fund industry. Linear factor models and style analysis
    could in theory give a good answer, as is the case for mutual funds. However,
    hedge fund returns, and their particularities, nonlinearity in particular, encourages
    us to adapt the basic linear setup by considering either nonlinear factors or
    time-varying linear exposures to risk factors. The first approach has a main drawback.
    By introducing nonlinearities in the model, we answer to the demand for transparency
    by using tools that cannot be considered as “usual practices” in the industry.
    The second approach gives a more “user friendly” solution as it corresponds to
    an intuitive extension of the current practices.


