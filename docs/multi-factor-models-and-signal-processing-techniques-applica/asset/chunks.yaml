    \ illustrates the evolution of the eight risk factors of Fung and Hsieh and Aequam\
    \ Diversified Fund given a base 100 in December 2003.\n\n### 3.13.3.3. *Estimation\
    \ methods results*\n\nWe compare in this section the results of the estimation\
    \ of the exposures of the Aequam Diversified Fund for the SW-OLS with 24 months,\
    \ the KF and the rgKF.\n\n[Figure 3.12](#c03.xhtml#Fig12) displays the tracking\
    \ performance for Aequam Diversified fund using Fung and Hsieh factors. They have\
