    # Chapter 1

    # Factor Models and General Definition


    ## 1.1. Introduction


    Today, the linear factor model is a benchmark in portfolio management theory [MAR
    52, LIN 65]. A geometrical presentation of both methods enables us to understand
    their objectives, usage, performance, and limitations in a practical way, especially
    to the attention of readers from finance and business backgrounds. The whole derivation
    of `KF` is provided in Chapter 3 appendix, still along a geometrical fashion.
    These two methods are basic tools in SSP.


    Chapter 4 contents are the most advanced from SSP standpoint and share results
    at the edge (at the time the book is written) of relevant research about `KF`
    regularization to handle some impulsive and non-Gaussian markets behaviors. Spectacular
    improvement with respect to traditional `KF` is obtained and illustrated on market
    data.


    ## 1.2. What are factor models?


    ### 1.2.1. Notations


    We first consider a set of `N` risky assets, indexed `i = 1, …, N`. We denote
    by `s[*i,t*]` the price of asset `i` at time `t`, and `r[*t*]` the corresponding
    return for the period (`t − 1`). This return is defined by:


    ```

    ![image](images/Inline_21_3.jpg)

    ```


    If prices are observed on a daily (respectively, weekly, etc.) basis, then `r[*t*]`
    represents daily (respectively, weekly, etc.) returns. We then denote by `μ[*i*]`
    the expected return of asset `i`, and ![image](images/Inline_21_4.jpg) its variance:


    ```

    ![image](images/Inline_21_4.jpg)

    ```


    The variance ![sig2.gif](or the volatility `σ[*i*]`) is often used to measure
    the risk relative to the asset `i`. The greater the volatility, the greater the
    risk. The covariance `σ[*i,j*] = Cov(r[*i*], r[*j*])` between assets `i` and `j`
    will be useful to compute the risk of a portfolio of several assets.


    As opposed to risky assets, we also consider a risk-free asset that gives a return
    `r[*f*]`, called the risk-free rate (supposed to be constant). In practice, short-term
    government securities such as US Treasury Bills are used as a proxy for the risk-free
    asset; this results in a non-constant `r[*f*]`.


    The expected excess return (or risk premium) of asset `i` is the return we can
    expect from asset `i` in excess of `r[*f*]`, that is


    ```![image](images/Inline_22_2.jpg) own```


    and is the premium relative to the risk taken when investing in asset `i`.


    According to Markowitz’s [MAR 52] theory of *mean-variance efficiency*, investors
    (should) therefore require a higher expected return for holding a more risky asset
    and want to earn the highest possible return for a level of risk they are willing
    to take. A portfolio is said to be mean-variance efficient if we cannot create
    another portfolio with a greater expected return and the same variance of returns
    (or another portfolio with a lower variance and the same expected return).


    [Figure 1.1] illustrates the time series evolution of three risky assets in comparison
    to an asset that is a proxy for the risk-free asset. Their mean-variance trade-offs
    are given in [Table 1.1].

