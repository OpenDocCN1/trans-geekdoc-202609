    作为说明，图 2.1 展示了如果在 1993 年 12 月在每个因子上都投资了 100，这些因子的演变情况；图 2.2 代表了根据 1994 年 1 月至
    2012 年 12 月的每月因子收益计算出的这些因子之间的相关矩阵。可以区分出两组负相关因子：第一组由 `SP500`、`EquitySizeSpread`、`MXEF`
    和 `Bond10y` 组成，它们与其他四个因子呈负相关。此外，在每组内部，我们观察到因子之间存在非常弱的（正或负）相关性，但两个基于股票的风险因子（正相关性约为
    60%）以及两个与债券相关的风险因子（负相关性约为 45%）除外。


    **图 2.2。** *Fung 和 Hsieh 从 1993 年 12 月到 2012 年 12 月底的八个风险因子的经验相关矩阵（见彩色版章节）*


    ![images](img/img_3_53.jpg)


    宏观经济因子天然具有相关性。为了避免不同资产类别因子收益之间的相关性，可以通过逐步回归技术 [AGA 00b] 来选择因子：根据因子的相对判别能力，一个接一个从模型中引入或移除因子。使用其上升式版本时，首先选择单一最佳因子，然后将其与每个其他变量配对，选择次优因子，依此类推。模型的阶数不断增加，直到添加新因子不再提高前一个模型的判别能力为止。使用其下降式版本时，初始模型包含所有预选因子，并一个接一个地移除最差的因子，直到移除剩余因子中的一个不再提高前一个模型的判别能力为止。


    # 2.3. 基于特征因子的定量方法


    在本节中，我们用 `eigenfactors` 表示通过对收益协方差矩阵进行特征向量分解从观测中获得的因子。在实证量化金融的文献中，`eigenfactors`
    可以被视为特殊的 `latent factors`（潜在因子），它们是通过收益线性组合得到的向量的子集。当对于可能驱动研究数据的经济因子没有*先验*知识时，通常会使用此类方法，并且具有显著的特性，即产生正交因子，特别是当使用子空间方法推导此类因子时。


    在统计学文献中，最常用的方法是因子分析法（Factor Analysis）和主成分分析法（PCA）。此类方法主要用于降低观测矩阵的维度，它们使用相关矩阵的特征向量分解，并产生构建为收益线性组合的成分。最重要的结果是，通过仅保留少数选定的、关联特征值最高的特征向量，就可以以高准确率近似原始数据。因此，困难在于确定选择阈值。该问题的这部分将在
    2.4 节中讨论。


