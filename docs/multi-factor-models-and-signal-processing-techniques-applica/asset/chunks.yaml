    In a more general setting, selection of the significant eigenvalues is done through
    a thresholding procedure: all eigenvalues above some number `λ*` are considered
    informative, otherwise eigenvalues relate to noise. To reconstruct a filtered
    covariance matrix estimate or to construct the corresponding eigenfactors, all
    noise-related eigenvalues may be replaced with a constant. This yields to renormalize
    the eigenvalues by the total sum. Then, the denoised covariance matrix estimate
    is obtained by the inverse procedure of its diagonalization.


    Let us recall that each eigenvalue relates to the variance of a portfolio of assets.
    A very small eigenvalue means that there exists a portfolio of assets with very
    small out-of-sample variance, which is probably not realistic.


