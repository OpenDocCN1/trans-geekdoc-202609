    `l²`-正则化。在本节中，我们主要关注 `l¹`-正则化，是因为用于表示尖峰收益的加性项 `v[t]` 具有稀疏性。


    ## 4.4.2 rgKF 性能


    为了说明为什么在任何情况下都应该应用 `rgKF`，本节讨论了在故意被稀疏异常值污染的模拟数据上 `rgKF-l¹` 和 `l²` 的性能。模拟数据与 [3.51]
    中的数据相似，即双因子模型（包括标普 500 股票指数和 10 年期美债）和分段常数参数 `w[t]`。


    ## 4.5 应用于对冲基金收益的异常检测


    我们示例的目标是解释使用 `rgKF` 算法移除异常值的重要性。收益的多因子分解有助于我们理解收益的哪部分来自市场，哪部分是特定的（见表 4.2）。如果观测值中出现异常值且模型没有考虑它们，那么市场暴露估计值可能是完全虚假的。`rgKF`
    算法通过简单过滤异常值避免了这些估计的污染。在实践中，投资组合经理可能会使用多因子方法来对冲特定或所有市场风险。错误的估计可能导致在做出最优对冲组合时做出某些不当决策。


