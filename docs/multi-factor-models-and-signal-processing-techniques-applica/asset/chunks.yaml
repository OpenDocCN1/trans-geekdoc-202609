    # 3.15. 要点


    本节概述了涉及 LSE 和 KF 的章节中最重要的结果。


    ### 最小二法估计 (LSE)


    LSE 隐含假设收益、因子、alpha 和 beta 之间存在线性回归，跨越特定的观测窗口 (t, h) = {l，使得 t – h + 1 ≤ l ≤ t}；这种回归称为
    LSE“块”测量方程，如下：


    3.75 ![image](img/img_10_135.jpg)


    LSE 块回归的输入是：窗口内一个特定收益的值 ![image](img/Inline_136_13.jpg)以及包含在[h, K + 1]“因子矩阵”中的因子
    ![image](img/Inline_136_14)，带有![image](img/Inline_136_15)。因子也被称为回归变量。LSE 回归的未知数或参数是假设在窗口内为常数的
    alpha 和 beta。它们填充了列向量 `θ`[`t`,*h]`，其中`θ''`[`t`,*h]` = ![image](img/Inline_136_16)。LSE
    回归的残差为`ε`[`t`,*h]`，其带有![image](img/Inline_136_17)。


    LSE ![image](img/Inline_136_19)最小化了测量（收益）向量 `r`[`t`,*h]`与其基于因子的线性近似（即 G[`t`,*h]`
    `ξ`）之间的差异（凸）平方欧几范数。假设[h, K + 1]矩阵 G[`t`,*h]`是满秩的，LSE 解是唯一的，我们有：


    [3.76] ![image](img/img_2_136.jpg)


    LSE ![image](img/Inline_137_5)是`θ`[`t`,*h]`的无偏估计，但当矩阵(G′ G)[[`t`,*h]`病态时，其方差可能会变得很大。这发生在其最小特征值变得太小时。在后一种情况下，LSE
    必须进行“正则化”以限制![image](img/Inline_137_6.jpg)的大小（该主题在第 4 章讨论）。


