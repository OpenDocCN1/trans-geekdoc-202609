    A substantial amount of work is available on the subject in the literature, so,
    in this section, we present three major reference models: the factor model of
    Fama and French [FAM 93], the Chen *et al.* model [CHE 86] – two models developed
    to explain the risks in the US equity market, and the risk-based factor model
    of Fung and Hsieh [FUN 01, HSI], a model adapted to explain the risks bourne by
    the trend-follower hedge funds.


    ## 2.2.1 Fama and French model


    The three-factor model of Fama and French [FAM 93] is an extension to the capital
    asset pricing model (CAPM). Observing that `small caps` and `value` stocks outperformed
    the market on a regular basis, Fama and French included two additional factors
    to Sharpe’s market model: `SMB` for `small minus big` (market capitalization,
    `MC`), which reflects the relative performance of the small versus large caps
    stocks, and `HML` for `high minus low` (book-to-market value), which reflects
    the relative performance of the high-valued versus the low-valued stocks. `MC`
    gives information about the size of the firm (equal to the stock price times the
    number of its outstanding shares). Book-to-market ratio is related to the accounting
    value of the firm (equal to the `MC` of the firm divided by the accounting value
    of all the firm’s shares).


    For example, `SMB` factor may be constructed at time `t` as follows, for a fixed
    period of time of length `T` (from `t` – `T` to `t`):


    – consider a large universe of stocks in the equity market, for example take the
    constituents of the Russel 2000 equity Index at `t`; – for each stock in the universe,
    get its `MC` from `t` – `T` to `t`; – for each date, rank the stocks according
    to their relative `MC`; – to obtain the relative performance of the small versus
    the large caps stocks, compute, for each date, an equi-weighted (or a market cap
    weighted) portfolio composed of the stocks having an `MC` lower (respectively
    bigger) than a specific value; – `SMB` factor returns are then computed as the
    difference between the returns of the small `MC` portfolio and the big `MC` portfolio.


    The procedure is identical to construction of the `HML` factor but is based on
    the values of the book-to-market value of the stocks instead of their `MC` values.


    This approach is used, for example, by Morningstar to rate stocks and mutual funds
    using a five stars grid[¹](#c02.xhtml#fnt1).


    The four-factor model of Carhart [CAR 97] is an extension of the three-factor
    model of Fama and French [FAM 93], including a momentum factor. The model is shown
    to explain persistence in equity mutual funds’ mean and risk-adjusted returns.


    ## 2.2.2 The Chen et al. model


    The Chen *et al*. [CHE 86] model is a particular case in the arbitrage pricing
    theory (APT) framework. Studying the stocks in the US market, the authors identified
    a set of economic state variables that were significant in explaining the expected
    stock returns: industrial production, changes in the risk premium, twists in the
    yield curve, measures of unanticipated inflation and changes in inflation during
    high volatile periods for these variables. Whereas a value-weighted stock equity
    index explains a significant portion of the returns, it has an insignificant influence
    on the market.


    ## 2.2.3 The risk-based factor model of Fung and Hsieh


    The risk-based factor model of Fung and Hsieh [FUN 01, HSI] is a model adapted
    to explain the risks bourne by the trend-follower hedge funds. As opposed to the
    Fama and French model, this model contains only macro-economic factors. The eight
    risk factors of Fung and Hsieh are available on the author’s webpage (see [HSI])
    and are quoted monthly from January 1994. [Table 2.1](#c02.xhtml#tab1) gives some
    basic statistics on these factors. A growing body of literature is devoted to
    finding accurate factors (see AGA 00, AGA 00b, AGA 04, AGA 09, SAD 10), and one
    of the most famous models is the trend-follower:


    1) three trend-following risk factors, which are specific portfolios, allow for
    the characterization of different asset classes: i) `PTFSCOM`, representing the
    returns of a specific portfolio in commodities, ii) `PTFSBD`, representing the
    returns of a specific portfolio in bonds, and iii) `PTFSFX`, representing the
    returns of a specific portfolio in foreign exchange; 2) two equity-oriented risk
    factors, which are based on equity indices: i) `SP500`, representing the total
    return of the Standard and Poors 500 equity index, and ii) `EquitySizeSpread`
    represents the performance of the smallest MC in the US Equities as being the
    difference between the total returns of the large Russel 2000 index and `SP500`;
    3) two bond-oriented risk factors, representing the bond market: i) `Bond10y`
    is the monthly change in 10-year treasury maturity yield, and ii) `CreditSpread`
    is the monthly change in Moody’s Baa yield less 10-year treasury maturity yield;
    4) the recently added emerging market factor: i) `MXEF`, representing the total
    returns of the Morgan Stanley Capital International (MSCI) emerging market index.


    The eight risk factors of Fung and Hsieh are available on the author’s webpage
    (see [HSI]) and are quoted monthly from January 1994. [Table 2.1](#c02.xhtml#tab1_1)
    gives some basic statistics on these factors. These statistics are: the annualized
    return, the annualized volatility, the ratio between annualized return and the
    annualized volatility (denoted as the Sharpe ratio), the minimum and the maximum
    monthly returns on the period, and the skewness and the kurtosis of the return
    distribution.

