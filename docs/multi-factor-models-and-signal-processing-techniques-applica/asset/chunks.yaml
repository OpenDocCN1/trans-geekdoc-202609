    When the Gaussian assumption is not verified, then the SCM estimate may be corrupted
    by outliers and deviate from optimality so that methods using a robust approach
    for estimation should be preferred. Robustness of an estimator may be quantified
    by stable estimation results when the observed data deviate more or less slightly
    from the assumed model within a relatively large confidence interval. The literature
    in robust methods for estimation is large and was probably first stated in the
    1960’s by John Wilder Tukey [TUK 60, TUK 62]. Peter J. Huber in [HUB 64] and [HUB
    67] considered that given a distribution model, the true distribution lies in
    a neighborhood of the model, which may describe a theoretical approach for robustness.
    The `M`-estimators are therefore introduced as a generalization of the maximum
    likelihood approach, which considers that the assumed model may be erroneous.
    In the same manner, Huber’s `gross error model` assumes that within a perfectly
    known distribution `G`, a piece of datum, say 0 ≤ `![images](images/e.gif)` ≤
    1, comes from an unknown distribution `H`, so that the complete characterization
    of the datum is given by distribution `F = (1 − ![images](images/e.gif))*G + ![images](images/e.gif)*
    H`.


    In the following section, we discuss the family of the so-called `M`-estimators
    [HUB 64, HUB 77, MAR 76], which offers an alternative to the classical SCM and
    comes also from the maximum likelihood theory [CON 02, GIN 02].


