    从实践角度来看，`KFs` 更为受欢迎，因为它能够对参数进行动态估计。在时间 `t` 时，对过去的唯一认知被完全总结在 `t − 1` 时给出的上组信息中，且无需指定任何窗口长度。此外，`KF`
    的方程引入了模型参数的动态演化，这为我们实际不了解的事物提供了一些 `a priori`（先验）信息。


    图 3.10. 通过比例 nifty 指数期货进行对冲的纯多印度股票组合的净资产价值，其计算方法分别为：(1) 整个期间的 OLS，(2) 窗口期为 3 个月的
    SW-OLS，(3) 卡尔曼滤波（KF），(4) 鲁棒卡尔曼滤波（RKF）以及 (5) 过滤掉异常值的卡尔曼滤波正则版本。经典的 `KF` 及其各种版本与组合对冲成本相比，似乎更为准确。


    ![image](img/img_2_120.jpg)


    图 3.10 显示了 `RKF` 和 `rgKF` 的结果。`KF` 方程假设状态和观测误差服从条件高斯分布，这在存在异常值时会失效。这些版本的 `KF`
    考虑了观测方程中的异常值，`KF` 递归方程经过正则化，因此对异常值具有鲁棒性。这些方法将在第 4 章介绍。


    ### 3.13.3 使用多因子模型的对冲基金分析


    对冲基金（HF）行业的风险分析受到了关注，因为人们注意到，根据构造并公认 `HF` 收益具有非常特定的特征，例如肥尾和非对称分布、类期权收益以及动态风险敞口。


    使用多因子模型允许我们通过一组被选为非线性相关的变量来分解观测收益，并带来多维度的见解。选择合适因子的粗略任务已在第 2 章讨论过。在该示例中，我们关注估计方法，并使用了八个
    Fung 和 Hsieh 风险因子 `[HSI`。


    #### 3.13.3.1 Fung 和 Hsieh 风险因子


    第 2 章描述的 Fung 和 Hsieh 的八个风险因子 `[HSI]` 以 1994 年 1 月至 2012 年 12 月的每月数据为频率，包括：


    – 三个`趋势`风险因子：`PTFSBD`（基于债券的风险因子）、`PTFSFX`（基于货币的风险因子）和 `PTFSCOM`（基于商品的风险因子）；–两个`股票型`风险因子：`SP500`（标准普尔
    500 指数）和 `EquitySizeSpread`（规模差异因子，表示为罗素 2000 指数每月总收益与 `SP500` 收益之间的差值）；–两个`债券型`风险因子：`bond10y`（10
    年期国债期限收益率的每月变化）和 `CreditSpread`（穆迪 Baa 级收益率每月变化与 `bond10y` 之间的差值）；–一个`新兴市场`风险因子：`MXEF`（摩根士丹国际新兴市场指数）。


    这些因子存储在每个时间 `t` 的 `f[t]` 中，作为 `[1.4]` 的输入。


    #### 3.13.3.2 对冲基金数据


    Fung 和 Hsieh 的八个风险因子最初是为了解释趋势跟踪型基金，因此我们选择了`方向性`对冲基金，例如`全球宏观`对冲基金。全球宏观对冲基金经理可能在货币、债务、股票或商品上采取方向性头寸，也可能选择结合`多头`与`空头`相互对冲的`相对价值`头寸。


    我们说明了不同估计方法在一个名为 Aequam Diversified Fund 的趋势跟踪对冲基金上的表现，该基金自 2010 年 12 月 17 日以来由
    Aequam Capital 管理。该基金是一个系统的 `HF`，对债券期货、股票指数期货、外汇期货和商品期货进行多头和空头操作。该基金自 2012 年 6
    月起是一个 UCITS IV 基金，是一个每周审计的基金，管理资产规模（AUM）约为 2000 万美元。尽管该基金于 2010 年开放，但我们可以获取其自
    2004 年以来的历史和回测表现。系统基金具有这种特殊性：回测表现是可靠的，因为商品交易顾问（CTA）和系统基金运行的设计流程与基金投入后运行的流程完全相同。此外，管理期货为基金提供了高流动性。


    表 3.2 给出了八个风险因子以及 Aequam Diversified Fund 的基本统计数据。这些统计数据是使用每月（月末到）收益计算的。图 3.11
    展示了以 2003 年 12 月的 100 为基准，Fung 和 Hsieh 的八个风险因子以及 Aequam Diversified Fund 的演变情况。


    #### 3.13.3.3 估计方法


    在本节中我们比较了分别使用 24 个月的 `SW-OLS`、`KF` 和 `rgKF` 对 Aequam Diversified Fund 进行估计的结果。图
    3.12 显示了该 `HF` 使用 Fung 和 Hsieh 因子的跟踪性能。`SW-OLS`、`KF` 和 `rgKF` 实现了几乎相同的性能，而 `SW-OLS`
    与观测时间序列相差甚远。


    图 3.13–3.15 显示了分别使用 24 个月窗口的 `SW-OLS`、`KF` 和 `rgKF` 对 Aequam Diversified Fund
    估计的随时间变化的敞口。


