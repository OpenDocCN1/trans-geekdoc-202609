    其中 `u[i,t]` 代表通常假设下的均值残差误差。与 `CAPM` 不同，`APT` 未提供关于 `K`因子性质的任何信息。


    # 1.6. 术表


    ### 波动率 (Volatility)


    资产 `a` 的波动率 `σ` 指在特定时间跨度内连续复合收益率的标准差。波动率通常以年化形式表示：如果使用每日（或每周）收益率计算波动率 `σ`，且认为一年由
    250 个工作日（或 52 周）组成，那么年化波动率将等于 ![images](img/Inline_42_5.jpg)(或，![images](img/Inline_042_5.jpg)。


    ### 风险 (Risk)


    持有资产 `a` 的风险可以通过 `a` 的波动率来量化。


    ### 无风险利率 (Risk-free rate)


    零风险投资的理论收益率；无风险利率通常表示为 `r[f]`，代表投资者在不承担任何风险的情况下对任何投资所期望的最低收益。这通常被认为是任何风险较高投资至少应获得的下限，因为承担任何风险的回报应该比无风险投资更高。


    ### 预期（超额）收益 (Expected (excess) return)


    资产 `a` 的预期收益是未来预期的收益，通过 `IE(r[a])` 计算。预期超额收益是 `a` 的超过无风险利率（或任何其他市场指标）的预期收益：`IE(r[a])
    - r[f]`。


    ### 风险溢价 (Risk premium)


    资产 `a` 的风险溢价是 `a` 的超过无风险利率的预期收益，即 `IE(r[a]) - r[f]`。


    ### 零成本组合 (Zero-cost portfolio)


    零成本组合是指权重和为零的组合。例如，资产 `a` 的超额收益 `IE(r[a]) - r[f]` 就是一个零成本组合。它将 100%投资于 `a`，-100%投资于无风险利率。以
    `r[f]` 借入的资金被投资于 `a`。由于投资者必须支付以 `r[f]` 借款的利息，他/她期望其在 `a` 中的投资能获得高于 `r[f]` 的回报。


    ### 可交易组合 (Tradable portfolio)


    如果一个组合是零成本组合，则称该组合是可交易的。


    ### 投资组合多元化 (Portfolio diversification)


    组合多元化是指向组合中添加更多投资，以减少单项投资固有的风险。它增加了盈利的可能性，或至少避免损失。通常情况下，多元化程度越高，风险和收益就越低。为了多元化而向组合中添加更多投资涉及将组合细分为许多较小的投资。如果组合规模增加而不是保持不变，组合的风险可能不会减少，特别是当添加的资产之间不相关时。这是一个关于多元化对组合方差之益的非常简单的例子。如果组合中的
    `N` 个资产互不相关且具有相同的方差 `σ²`，则通过以等比例 `1/N` 持有所有资产使组合方差最小。此时，组合方差等于 `σ²/N`，随 `N` 单调减少。因此，即使添加的资产是不相关的，组合方差也会降低。当组合中加入负相关资产时，多元化的益处会放大。现代多元化的理解可以追溯到
    20 世纪 50 年代 Harry Markowitz [MAR 52] 的工作。


    ### 市场组合 (Market portfolio)


    市场组合是一个完全多元化的组合，代表了整个市场的演变。在因子模型框架下，完全多元化的组合允许纯因子结构，即没有额外特异性风险的因子结构。


    ### 市场有效性 (Market efficiency)


    如果市场中资产的价格反映了所有可用信息，则认为市场是有效的。


    ### 市场均衡 (Market equilibrium)


    当需求量与供给量平衡时，发生市场均衡。在这种情况下，除非需求或供给发生变化，否则价格应该保持不变。


    ### 套利 (Arbitrage)


    套利是指获得无风险利润的可能性。


    ### 市值 (Market capitalization)


    市值，也称为 `MC` 或 `cap.` (`MC`)，是公司发行股数乘以价格。它衡量公司的规模。它每天变化（`P`）。例如，在 2010 年 10 月，市值最大的六家公司是（`T$`
    代表万，`B$` 代表十）：


    1. 巴西电信 (Telecom Brasil)，市值为 `T$57` 和 `B$99`

    2. 埃克森美孚 (Exxon Mobil)，市值为 `T$337.69` 和 `B$66.32`

    3. 苹果 (Apple)，市值为 `T$282.77` 和 `B$309.52`

    4. 中国石油 (PetroChina)，市值为 `T$229.20` 和 `B$125.23`

    5. 宝拓 (BHP Billiton)，市值为 `T$224.83` 和 `B$80.81`

    6. 微软 (Microsoft)，市值为 `T$219.97` 和 `B$25.42`。


    # 第 2 章


    # 因子选择


    ## 2.1. 引言


    因子的模型时，需要确定因子的性质和数量。文献中可以区分两种方法：经验启发式方法和涉及子空间方法并产生所谓特征因子的统计学方法。


    实证研究通常比较这两种方法（见 [CHE 93, CON 95, CHA 98, DAR 11]），并大多强调特征因子在预期属性（不相关因子）和其包含的解释百分比方面的优越性。然而，特征因子很难与观测宏观因子联系起来，这在某种程度上降低了它们对从业者的吸引力。


    本章结构如下：2.2 节关注经验启发式方法，并介绍了文献中常用的三个参考模型。2.3 节中，我们介绍了统计方法。与需要观测数据先验知识的因子选择不同，纯统计方法从观测收益的时间序列中提取一组较小的隐含特征因子，这些因子解释了数据的大部分信息。问题变成了确定模型的阶。2.4
    节描述了来自信息论的一些经典技术。2.5–2.7 节是补充章节，为该方法的相关问题提供一些，例如数据的协方差估计、该方法与子空间方法的相似性以及该方法在大面板数据中的扩展。


    ## 2.2. 定性知识


    在经验启发式方法中，因子的性质和数量是根据对市场状况的先验考虑决定的。因子是观测的市场风险因子，通过主观选择纳入模型中。

