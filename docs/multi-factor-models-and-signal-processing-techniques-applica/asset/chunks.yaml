- raw: "The resulting estimations of the piecewise constant parameter are given in\
    \ [Figure 3.6](#c03.xhtml#Fig6). Overall, SW-OLS and KF react quite well to the\
    \ changes in parameter *w*[*t*]. It should be noted that the variance of the estimation\
    \ is lower for the KF than for SW-OLS, especially when SW-OLS is used with small\
    \ window lengths. Moreover and as expected, the SW-OLS estimates are more lagged\
    \ than the KF estimates.\n\n[**Figure 3.6.**](#c03.xhtml#Fig_6) *Comparison of\
    \ the SW-OLS (h* = 21, 126, 252*) and KF for the synthetic and noisy returns of\
    \ equation* \\[3.51\\] *having a piecewise constant parameter w[*t*] as defined\
    \ in \\[3.52\\] (see color plate section)*\n\n![image](images/img_3_114.jpg)\n\
    \nIn practice, portfolio managers do not turn their portfolio so sharply. This\
    \ case is extreme but highlights the tracking capabilities of the KF in a dynamic\
    \ environment. It confirms the growing interest in such filtering techniques to\
    \ dynamically hedge a portfolio or to estimate the nonlinear and dynamic exposures\
    \ in hedge returns.\n\nThe next example is focused on a single-factor model applied\
    \ to hedge dynamically a truly managed long-only Indian equity portfolio. The\
    \ objective is to accurately estimate the exposure of the managed portfolio to\
    \ its reference index, the Nifty Index.\n\n## **3.13.2.** ***Market risk hedging\
    \ given a single-factor model***\n\nLet us assume in this section that the observed\
    \ returns *r*[*t*] are the returns of a long-only equity portfolio. The portfolio\
    \ manager selects a subset of stocks in which to invest and define an allocation\
    \ either based on his/her own market feeling or resulting from an investment committee.\n\
    \nA long-only equity portfolio is usually constructed and managed in order to\
    \ over-perform a given stock index that often results in a strong historical correlation\
    \ between the returns of the portfolio and the stock index itself. What is expected\
    \ from such an investment is to deliver a performance which is larger than the\
    \ performance given by the stock index, and this may be due to the manager’s skills\
    \ to select stocks which will deliver some *α* over the performance of the benchmark.\n\
    \nGiven this setup, we can observe that the market risk is not hedged at all.\
    \ The long-only strategy is not expected to be hedged against any risk arising\
    \ in the market, but only to deliver a better performance than a given benchmark.\n\
    \nIn the case where the market risk has to be hedged, we have to answer to “how\
    \ much the portfolio is market-dependent?”\n\nAs explained by the factor model,\
    \ if there is a single market risk (the benchmark stock index), then a single-factor\
    \ model may be used to link the portfolio returns to the market returns:\n\n![image](images/img_7_115.jpg)\n\
    \nwhere *α*[*t*] is the time-varying “alpha”, *β*[*t*] is the time-varying exposure\
    \ of the portfolio to the single factor *f*[*t*], and *![images](images/e.gif)*[*t*]\
    \ has the properties described in the previous section.\n\nIn this application,\
    \ the returns of the long-only equity portfolio are the returns of an Indian equity\
    \ portfolio managed by an asset manager in India. The manager selects a subset\
    \ of equity stock according to a discretionary approach based on an in-depth analysis\
    \ of the fundamental numbers related to the balance sheet of the companies and\
    \ on a set of specific financial ratios. The selected names are mainly growth\
    \ companies for which the manager has a strong belief that these companies are\
    \ under-valued and have a high level of future growth. Each name is kept in the\
    \ portfolio for a given period, from 1 month to several months. The portfolio\
    \ comprises between 15 and 30 names at a time. The net asset value (NAV) of this\
    \ portfolio is shown in [Figure 3.7](#c03.xhtml#Fig7), where an initial value\
    \ of 1, 000 is set. The returns are net of all fees, including trading costs,\
    \ management fees, and performance fees and do not include any cash management.\
    \ In [Figure 3.7](#c03.xhtml#Fig7), the NAV of the BSE200 Index is also reported.\
    \ BSE200 Index is an index composed by the 200 biggest market capitalizations\
    \ quoted in the Indian equity market.\n\n[**Figure 3.7.**](#c03.xhtml#Fig_7) *Long-only\
    \ Indian equity portfolio price and two reference stock indices, the BSE200 Index\
    \ and the Nifty Index*\n\n![image](images/img_3_116.jpg)\n\nThe Indian equity\
    \ stock market is very specific: even if the BSE200 Index is quoted on a daily\
    \ basis, there are no future contracts quoted for this index. Only future contracts\
    \ on the smallest Nifty Index are traded, so that even if the BSE200 Index is\
    \ chosen as the benchmark reference for the performance of the portfolio, it will\
    \ not be possible to hedge the portfolio by shorting future contracts on the BSE200\
    \ Index. The single-factor *f* is therefore the Nifty Index and the time series\
    \ used to compute the model parameters is the time series of the generic Nifty\
    \ Index futures, which is a roll-adjusted time series.\n\nThe hedging procedure\
    \ is presented in the following:\n\n– At each computing time *t*, parameters *α*[*t*]\
    \ and *β*[*t*] are estimated with method M given, if necessary, a fixed window\
    \ length. – The value of the estimated *β*[*t*] is then used as the parameter\
    \ that reflects the linear dependence between the past returns of the portfolio\
    \ and the past returns of the factor: we will then adjust the previous quantity\
    \ *q*[*t*−1,*t*] of futures contracts to short, given the required proportion\
    \ of the portfolio to be hedged at *t* for the period \\[*t, t* + 1\\]. The quantity\
    \ of futures contracts to short at *t* for the time range \\[*t, t* + 1\\] is\
    \ then given by *q*[*t,t*+1] = *Round* (![image](images/Inline_118_5.jpg)) and\
    \ the adjustment of the hedge quantity is given by *q*[*t,t*+1] − *q*[*t*−1,*t*]\
    \ . In this equation, *Round*(.) rounds off the value to the lowest integer value,\
    \ *NAV*[*t*] denotes the NAV of the portfolio at time *t* and *CV*[*t*] denotes\
    \ the value of the futures contracts at time *t*, equal to its price time the\
    \ value of one point of this contract, and ![image](images/Inline_118_6.jpg)is\
    \ the estimated value of the *β* at time *t*. \n\nDepending on the method used\
    \ to estimate the value of *β*, the resulting hedged portfolio will have different\
    \ behavior, given the fact that the estimation might be lagged, dynamic or jittered\
    \ with residual outliers.\n\n[**Figure 3.8.**](#c03.xhtml#Fig_8) *Comparison of\
    \ the estimated exposure of the L/O portfolio to the selected market factor, the\
    \ Nifty future: a) represents the dynamic estimates of the beta and b) and c)\
    \ present the estimated spikes if using an RKF or an rgKG-l*¹ *as presented in\
    \ Chapter 4*\n\n![image](images/img_2_118.jpg)\n\n[Figure 3.8](#c03.xhtml#Fig8)\
    \ shows the different results obtained for the estimations of the beta using either\
    \ a SW-OLS (21 and 252 days), a KF, a Robust Kalman Filter (RKF) with *δ* = 0.3\
    \ and a regularized version of the KF (rgKF-*l*¹) with *δ*[*t*] = 0.01 (see Chapter\
    \ 4 for a detailed description of both these algorithms). Estimating the exposure\
    \ of the portfolio with a short window length and the OLS yields to very noisy\
    \ estimates. The longer window gives apparently lagged and too smoothed values.\
    \ The reference will therefore be the KF results which are more reactive to the\
    \ beta changes than the SW-OLS and much less noisy. If we compare KF results with\
    \ the results from more advanced techniques which filter the potential specific\
    \ events, say first RKF and then rgKF-*l*¹, combined with the final hedged portfolios\
    \ and the resulting cumulative costs (see [Figure 3.9](#c03.xhtml#Fig9)), then\
    \ rgKF-*l*¹ seems to be more efficient and gives more convenient and reliable\
    \ exposures of the portfolio to the market factor.\n\n[**Figure 3.9.**](#c03.xhtml#Fig_9)\
    \ *Cumulative costs induced by shorting nifty Index Futures to hedge the L/O portfolio\
    \ according to each of the estimation method used*\n\n![image](images/img_3_119.jpg)"
  fmt: '

    The resulting estimations of the piecewise constant parameter are given in [Figure
    3.6](#c03.xhtml#Fig6). Overall, SW-OLS and KF react quite well to the changes
    in parameter `w`[`t`]`. It should be noted that the variance of the estimation
    is lower for the KF than for SW-OLS, especially when SW-OLS is used with small
    window lengths. Moreover and as expected, the SW-OLS estimates are more lagged
    than the KF estimates.


    [**Figure 3.6.**](#c03.xhtml#Fig_6) *Comparison of the SW-OLS (`h` = 21, 126,
    252) and KF for the synthetic and noisy returns of equation [3.51] having a piecewise
    constant parameter `w`[`t]` as defined in [3.52] (see color plate section)*


    ![image](images/img_3_114.jpg)


    In practice, portfolio managers do not turn their portfolio so sharply. This case
    is extreme but highlights the tracking capabilities of the KF in a dynamic environment.
    It confirms the growing interest in such filtering techniques to dynamically hedge
    a portfolio or to estimate the nonlinear and dynamic exposures in hedge returns.


    The next example is focused on a single-factor model applied to hedge dynamically
    a truly managed long-only Indian equity portfolio. The objective is to accurately
    estimate the exposure of the managed portfolio to its reference index, the Nifty
    Index.


    ## 3.13.2 Market risk hedging given a single-factor model


    Let us assume in this section that the observed returns `r`[`t]` are the returns
    of a long-only equity portfolio. The portfolio manager selects a subset of stocks
    in which to invest and define an allocation either based on his/her own market
    feeling or resulting from an investment committee.


    A long-only equity portfolio is usually constructed and managed in order to over-perform
    a given stock index that often results in a strong historical correlation between
    the returns of the portfolio and the stock index itself. What is expected from
    such an investment is to deliver a performance which is larger than the performance
    given by the stock index, and this may be due to the manager’s skills to select
    stocks which will deliver some `α` over the performance of the benchmark.


    Given this setup, we can observe that the market risk is not hedged at all. The
    long-only strategy is not expected to be hedged against any risk arising in the
    market, but only to deliver a better performance than a given benchmark.


    In the case where the market risk has to be hedged, we have to answer to “how
    much the portfolio is market-dependent?”


    As explained by the factor model, if there is a single market risk (the benchmark
    stock index), then a single-factor model may be used to link the portfolio returns
    to the market:


    ![image](images/img_7_15.jpg)


    where `α`[`t]` is the time-varying “alpha”, `β`[`t]` is the time-varying exposure
    of the portfolio to the single factor `f`[`t`], and `f`[`t]` has the properties
    described in the previous section.


    In this application, the returns of the long-only equity portfolio are the returns
    of an Indian equity portfolio managed by an asset manager. The manager selects
    a subset of equity according to a discretionary approach based on an in-depth
    analysis of the fundamental numbers related to the balance sheet of the companies
    and on a set of financial ratios. The selected names are mainly growth companies
    for which the manager has a strong belief that these companies are under-valued
    and have a high level of future growth. Each name is kept in the portfolio for
    a given period, from one month to several months. The portfolio comprises between
    15 and 30 names. The net asset value (`NAV`) of this portfolio is shown in [Figure
    3.7](#c03.xhtml#Fig7), where an initial value of 1000 is set. The returns are
    net of all fees, including trading costs, management fees, and performance fees
    and do not include any cash. In [Figure 3.7](#c03.xhtml#Fig7), the `NAV` of the
    BSE200 Index is also reported. BSE200 Index is an index composed by 200 biggest
    capitalizations in Indian equity market.


    [**Figure 3.7.**](#c03.xhtml#Fig_7) *Long-only Indian equity portfolio price and
    two reference indices, the BSE200 Index and Nifty Index*


    ![image](images/img_3_116.jpg)


    The Indian equity stock market is very specific: even if BSE200 Index is quoted
    on a daily basis, there are no future contracts quoted for this index. Only future
    contracts on smallest Nifty Index are traded, so that even if BSE200 Index is
    chosen as the benchmark reference for the performance of the portfolio, it will
    not be possible to hedge the portfolio by shorting future contracts on BSE200
    Index. The single-factor `f` is therefore the Nifty Index and the time series
    used to compute the model parameters is the time series of the generic Nifty Index
    futures, which is a roll-adjusted time series.


    The hedging procedure is presented in the following:


    - At each computing time `t`, parameters `α`[`t]` and `β`[`t]` are estimated with
    method M, if necessary, a fixed window length.

    - The value of the estimated `β`[`t]` is then used as the parameter that reflects
    the linear dependence between the past returns of the portfolio and the past returns
    of the factor: we will then adjust the previous quantity `q`[`t-1,t]` of futures
    contracts to short, given the required proportion of the portfolio to be hedged
    at `t` for the period `[t, t + 1]`.

    - The quantity of futures contracts to short at `t` for the time range `[t, t
    + 1]` is then given by `q`[`t,t+1] = Round(...)` and the adjustment of the hedge
    quantity is given by `q`[`t,t+1] - q`[`t-1,t]`. In this equation, `Round()` rounds
    off the value to the lowest integer, `NAV`[`t]` denotes the `NAV` of the portfolio
    at time `t`, and `CV`[`t]` denotes the value of the futures contracts at time
    `t`, equal to its price time the value of one point of this contract.


    Depending on the method used to estimate the value of `β`, the resulting hedged
    portfolio will have different behavior, given the fact that the estimation might
    be lagged, dynamic or jittered with residual outliers.


    [**Figure 3.8.**](#c03.xhtml#Fig_8) *Comparison of the estimated exposure of the
    L/O portfolio to the selected market factor, the Nifty future: a) represents the
    dynamic estimates of the beta and b) and c) present the estimated spikes if using
    an RKF or an rgKF-1 as presented in Chapter 4*


    ![image](images/img_2_118.jpg)


    [Figure 3.8](#c03.xhtml#Fig8) shows the different results obtained for the estimations
    of the beta using either a SW-OLS (21 and 252 days), a KF, a Robust Kalman Filter
    (RKF) with `δ` = 0.3 and a regularized version of the KF (`rgKF-1`) with `δ`[`t]`
    = 0.01 (see Chapter 4 for a detailed description of both these algorithms). Estimating
    the exposure of the portfolio with a short window length and the OLS yields to
    very noisy estimates. The longer window gives apparently lagged and too smoothed
    values. The reference will therefore be the KF results which are more reactive
    to the beta changes than the SW-OLS and much less noisy. If we compare KF results
    with the results from more advanced techniques which filter the potential specific
    events, say first RKF and then `rgKF-1`, combined with the final hedged portfolios
    and the resulting cumulative costs (see [Figure 3.9](#c03.xhtml#Fig9)), then `rgKF-1`
    seems to be more efficient and gives more convenient and reliable exposures of
    the portfolio to the market factor.


    [**Figure 3.9.**](#c03.xhtml#Fig_9) *Cumulative costs induced by shorting nifty
    Index Futures to hedge the L/O portfolio according to each of the estimation method
    used*


    ![image](images/img_3_119.jpg)

