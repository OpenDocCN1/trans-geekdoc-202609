    文献中关于该主题已有大量研究，因此，在本节中，我们展示了三个主要的参考模型：Fama 和 French 的因子模型 [FAM 93]、Chen *等* 模型
    [CHE 86] ——这两个模型是为解释美国股票市场风险开发的；以及 Fung 和 Hsieh 的基于风险的因子模型 [FUN 01, HSI]，这是一个为了解释趋势跟踪型对冲基金所承担风险而的模型。


    ## 2.2.1 Fama 和 French 模型


    Fama 和 French 的三因子模型 [FAM 93] 是资本资产定价模型（CAPM）的扩展。Fama 和 French 观察到`small caps`
    和`value` 股票经常优于市场，因此他们在 Sharpe 的市场模型中增加了两个因子：用于`small minus big`（市值，`MC`）的 `SMB`，反映了小股相对于大股的相对表现；以及用于`high
    minus low`（账面市值）的 `HML`，反映了高价值相对于低价值股票的相对表现。`MC` 提供了有关公司规模的信息（等于股票价格乘以发行股数）。账面市值与公司的会计价值相关（等于公司的
    `MC` 除以该公司所有股票的会计价值）。


    例如，`SMB` 因子可以在时间 `t` 按如下方式构建，针对长度为 `T` 的固定时期（从 `t` – `T` 到 `t`）：


    – 考虑股票市场中一个巨大的股票池，例如取 `t` 时的罗素 2000 股票指数的成份股；– 对于池中的每只股票，获取其从 `t` – `T` 到 `t`
    的 `MC`；– 对于每个日期，根据其相对 `MC` 对股票进行排序；– 为了获得小股相对于大股的表现，为每个日期计算一个等权（或按市值加权）的组合，该组合由
    `MC` 低于（相应地高于）特定值的股票组成；– 然后计算 `SMB` 因子收益，即小 `MC` 组合与大 `MC` 组合之间的收益差。


    该步骤与构建 `HML` 因子的过程相同，但基于股票的账面市值值而非其 `MC` 值。


    这种方法被晨星（Morningstar）等用于使用五星级网格对股票和共同基金进行评分¹。


    Carhart 的四因子模型 [CAR 97] 是 Fama 和 French 三因子模型 [FAM 93] 的扩展，包含一个动量因子。该模型证明可以解释股票基金平均收益和风险调整后收益的持续性。


    ## 2.2.2 Chen 等模型


    Chen *等* [CHE 86] 模型是套利定价理论（APT）框架下的一个特例。通过研究美国市场的股票，作者识别了一组对解释预期收益具有显著意义的经济状态变量：工业生产、风险溢价的变化、收益率曲线的扭曲、意外通胀的衡量标准，以及这些变量在
    във波动期间通胀的变化。虽然市值加权股票指数解释了大部分收益，但它对市场的影响并不显著。


    ## 2.2.3 Fung 和 Hsieh 的基于风险的因子模型


    Fung 和 Hsieh 的基于风险的因子模型 [FUN 01, HSI] 是为了解释趋势跟踪型对冲基金所承担风险的模型。与 Fama 和 French 模型不同，该模型仅包含宏观经济因子。Fung
    和 Hsieh 的八个风险因子可在作者的网页上找到（参见 [HSI]），并从 1994 年 1 月起每月引用。表 2.1 提供了这些因子的某些基本统计。越来越多的文献致力于寻找准确的因子（参见
    AGA 00, AGA 00b, AGA 04, AGA 09, SAD 10），其中最著名的模型之一是趋势跟踪模型：


    1) 三个趋势跟踪风险因子是特定的组合，用于描述不同的资产类别：i) `PTFSCOM`，代表特定商品组合的收益；ii) `PTFSBD`，代表特定债券组合的收益；以及
    iii) `PTFSFX`，代表特定外汇组合的收益；2) 两个面向股票的风险因子基于股票指数：i) `SP500`，代表标准普尔 500 股票指数的总收益，以及
    ii) `EquitySizeSpread` 代表美国股票中最小市值的表现，即大罗素 2000 指数总收益与 `SP500` 之间的差值；3) 两个面向债券的风险因子代表债券市场：i)
    `Bond10y` 是 10 年期国债收益率的每月变化，以及 ii) `CreditSpread` 是穆迪 Baa 级收益率减 10 年期国债收益率的每月变化；4)
    最近新增的新兴市场因子：i) `MXEF`，代表摩根士丹资本国际（MSCI）新兴市场指数的总收益。


    Fung 和 Hsieh 的八个风险因子可在作者的网页上找到（参见 [HSI]），并从 1994 年 1 月起每月引用。表 2.1 提供了这些因子的某些基本统计。这些统计数据包括：年化收益、年化波动率、年化收益与年化波动率之比（称为夏普比率）、期间内的最小和最大月收益，以及收益分布的偏度和峰度。

