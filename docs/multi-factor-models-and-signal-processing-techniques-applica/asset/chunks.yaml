    由于 ![image](img/Inline_95_11.jpg)当 `ξ` ≠ `ξ^(op*)` 时正定且满秩，因此 ![image](img/Inline_95_12.jpg)接近最优值。这证实了代价函数的凸曲率。


    # 3.8. 为什么选择 KF 以及哪种设置？


    ## 3.8.1. LSE 方法不提供递归估计


    粗略而言（细节将在第 3.10 节介绍），LSE 和 KF 都利用与未知参数 `θ[t]` 连接的测量值 `r[t]`（见 \[3.27\]），根据最小平方距离准则找到其最佳估计
    ![image](img/Qcap.gif)[*t*] 。在限制在因子模型问题的范围内，`r[t]` 是任何资产的标量收益，`θ[t]` 是 `(K + 1)`
    维列向量，收集了资产的 alpha 和暴露率（betas）（为了简单起见，去掉了指向资产的下标）。\[3.27\] 的另外两个部分与之前的部分相同。LSE
    的一个问题是估计 ![image](img/Qcap.gif)[*t*] 缺乏递归性。我们所说的递归是指从上一个估计 ![image](img/Inline_96_3.jpg)
    显式更新新的估计 ![image](img/Inline_96_2.jpg)。如 3.3.2 节所述，在滑动窗口 `(*t, h*)` 上运行 LSE 打开了一条允许实时更新估计的路径，但它本身并不是递归估计器。


    估计的递归性具有优点。最重要的优势是估计及其准确性的跟踪能力。如果测量过程的主要驱动因素和真参数的演变从时间 `t − 1` 到时间 `t` 没有发生显著变化，那么新估计应该密切复制之前的估计，节省大量的处理负担。此外，如果真参数的新值和/或新的测量值与之前的情况偏离，则更新的估计应该立即反映这种变化。实时追踪，因此递归性在航空航空、自动监控和监测、汽车和火车控制、语音和图像（多媒体）处理
    \[FUK 90, BAR 93, KAY 93, DUV 94, KAY 98\]、重症监护、计量经济学和定量金融等领域至关重要。


    测量（方程 \[3.27\]](#c03.xhtml#eqn27)）没有产生参数的递归性。因此，为了建立递归估计，KF 需要依赖一个驱动真参数演变的递归方程，而且该方程必须提前已知以便纳入估计推导中。估计的递归性将由未知真参数的递归性引起。这是
    LSE 和 KF 设置之间的区别。


    ## 3.8.2. 状态空间模型及其递归组件


    该递归方程也称为状态方程，是微分方程的离散时间版本。它可以是“自然的”或“直观的”。如果是自然的，它来自著名的物理定律（力学、热力学、电磁学、光学等）和化学，这些定律通过微分方程描述了现象及其关键变量。我们邀请读者检查
    \[BAR 93, KAY 93, KAY 98, NOR 04\] 中提供的许多示例。如果无法利用特定的定律，仍然可以对参数演变假设一个“直观的行为描述”，这是
    KF 的基石。


    ### KF 状态空间模型/设置


    参数 `θ[t]` 的演变，状态递归方程：


    [\[3.26\]](#c03.xhtml#eqn_26) ![image](img/img_4_96.jpg)


    测量–观测方程：


    [\[3.27\]](#c03.xhtml#eqn27) ![image](img/img_7_96.jpg)


    没有特定的经济或金融定律可以产生 alpha 的递归方程。（此处重复了多次，已去重）


    ![image](img/Inline_95_5.jpg) 没有特定的经济或金融定律可以产生 alpha 的递归方程。

