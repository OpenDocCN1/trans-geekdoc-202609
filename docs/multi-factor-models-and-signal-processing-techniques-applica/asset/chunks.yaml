- raw: 'This section deals with applying rgKF(NG, *l*¹) on real hedge fund data to
    detect the potential occurrence of outliers. We conduct the analysis on returns
    of *Global macro* hedge funds. Managers of such funds take directional positions
    in currencies, debt, equities or commodities and may also elect to take relative
    positions combining long positions paired off against short positions. Hedge fund
    data come from the hedge fund research (HFR) database \[RES\]. The returns are
    end-of-month returns, available from January 1998 to June 2010 (i.e. for 150 months).


    We choose the eight risk factors of Fung and Hsieh (F&H) \[HSI\], selected and
    constructed by the authors \[FUN 01\] to explain trend-follower hedge funds. These
    factors are now widely used in the literature of hedge fund analysis. They are
    quoted on a monthly basis and stored in f[*t*] at each end-of-month *t*. The reader
    may refer to section 2.2.3 for a more detailed description of these factors.


    [Figure 4.3](#c04.xhtml#fig4_3) illustrates the capability of the rgKG(NG,*l*¹)to
    detect, estimate and filter some points in the observed returns time series, which
    might be considered as a hedge fund’s specific events, outliers, irregularities
    or illiquidity issues. As can be seen on the top graph in [Figure 4.3](#c04.xhtml#fig4_3),
    when an outlier occurs, then the resulting KF estimations of *β* suddenly jump
    to four or five times their previous values whereas no special event occurs in
    the market.


    **[Figure 4.3.](#c04.xhtml#fig4-3)** *Outliers detection and estimation for a
    single trend-follower hedge funds of the database HFR (OSV Currency Fund). Impact
    of outliers on the fund’s exposures can be observed on the top graph: KF does
    not filter the rgKF(NG,l*¹ *) estimated spikes and gives incorrect estimations
    of the market risks (see color plate section)*


    ![images](images/img_4_152.jpg)


    # **4.6. Conclusion**


    This chapter has presented a new family of algorithms named rgKFs that have been
    derived to *detect and estimate* exogenous outliers that might occur in the observation
    equation of a standard KF. Inspired from the RKF of Mattingley and Boyd \[MAT
    10\], which makes use of a *l*¹\-regularization step, we introduce a simple but
    efficient detection step in the recursive equations of the RKF. This solution
    is one means by which to solve the problem of adapting the value of the *l*¹\-regularization
    parameter: when an outlier is detected in the innovation term of the KF, the value
    of the regularization parameter is set to a value that will let the *l*¹\-based
    optimization problem estimate the amplitude of the spike. We have also tested
    an *l*²\-based regularization term for which the solution is known in a closed
    form.


    The results obtained on synthetic data show that the best performance is achieved
    by the rgKF(NG,*l*¹) that handles the choice of the regularization parameter.
    In the context of analyzing hedge funds returns, the rgKF(NG,*l*¹) could help
    risk managers to dynamically and accurately estimate the exposures of hedge funds
    for which they do not have any other information except the observed returns.
    Interpreting outliers as illiquidity issues, our algorithms would therefore be
    very useful to classify funds according to their “illiquidity quality” and to
    make accurate decisions from a regulation point of view.


