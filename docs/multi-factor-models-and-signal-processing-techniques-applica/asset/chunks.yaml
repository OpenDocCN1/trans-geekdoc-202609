    \ estimate, the simplest procedure is to select the *K* largest eigenvalues given\
    \ that various tests exist for determining if an eigenvalue is large:\n\n1) Looking\
    \ at the percentage of the total power contained in **λ**[*k*] : \n\n\\[2.12\\\
    ] ![images](images/img_4_59.jpg)\n\n2) Computing the ratio of the (*k* + 1)th\
    \ eigenvalue to the *k*th eigenvalue which has been declared to be large: \n\n\
    \\[2.13\\] ![images](images/img_7_59.jpg)\n\nIt is obvious that the result of\
    \ these tests will depend on the values chosen for *η*[1] or *η*[2]. More general\
    \ criteria might be useful and two families of criteria appear: (1) the traditional\
    \ and (2) those defined on large panel data and more specific to the factor model\
    \ identification.\n\n## **2.4.1.** ***Information criteria***\n\nThe first category\
    \ of tests to detect the value of *K* are referred to as sequential hypothesis\
    \ (SH) tests or sphericity tests, originating from the statistical field (see\
    \ \\[AND 63\\]). The objective is to find the likelihood ratio between the hypothesis\
    \ that the *N* − *K* smallest eigenvalues are equal versus the hypothesis that\
    \ only the *N* − *K* − 1 smallest eigenvalues are equal. Anderson \\[AND 63\\\
    ] showed that for *T* ![images](images/great.gif)*N*, the *N* − *K* smallest eigenvalues\
    \ clustered all around a small value *s*² and showed that a sufficient statistic\
    \ is:\n\n\\[2.14\\] ![images](images/img_2_60.jpg)\n\nThis ratio uses the ratio\
    \ of the arithmetic mean of the *N* − *d* smallest eigenvalues to the geometric\
    \ mean of the *N* − *d* smallest eigenvalues. If the *N* − *d* smallest eigenvalues\
    \ are equal, then *L*(*d*) = 0. Asymptotically, statistics \\[2.14\\] correspond\
    \ to a *χ*²((*N* − *d*)² − 1)-distributed variable, so that given a confidence\
    \ interval and sequential tests a value for *d* can be determined.\n\nA second\
    \ category of tests adds a penalty function to *L*(*d*) which takes into account\
    \ the degree of freedom of the model. It results in a function of *d* to be minimized\
    \ and the classical Akaike information criteria (AIC) and minimum description\
    \ length (MDL) tests can be written in such a way, that is *L*(*d*) + *p*(*d*)\
