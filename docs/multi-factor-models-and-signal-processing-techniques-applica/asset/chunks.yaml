    # 3.8. Why KF and which setup?


    ## 3.8.1. *LSE method does not provide a recursive estimate*


    Coarsely (details will follow in section 3.10), both LSE and KF leverage measurements
    *r*[*t*] that are connected to an unknown parameter *θ*[*t*], see \[3.27\], to
    find its best estimate ![image](images/Qcap.gif)[*t*] based on a minimum squared
    distance criterion. Limited to the scope of the factor model problem, *r*[*t*]
    is the scalar return of any asset and *θ*[*t*] is the (*K* + 1)-dimensional column
    vector collecting the alpha and exposures (betas) of the asset (for the sake of
    simplicity the subscript referring to the asset has been dropped). The two other
    components of \[3.27\] have the same meaning as in the previous sections. One
    issue with LSE arises from the absence of recursivity of the estimate ![image](images/Qcap.gif)[*t*].
    By recursivity, we mean the explicit updating of the new estimate ![image](images/Inline_96_2.jpg)from
    the previous estimate ![image](images/Inline_96_3.jpg)Operating the LSE across
    a sliding window (*t, h*), as described in section 3.3.2, opens a path that allows
    an update on the fly of the estimate but is not a recursive estimator *per se*.


    Recursivity of the estimate bears virtues. The most important advantage is the
    tracking capability of both the estimate and its accuracy. If the main drivers
    of the measuring process and the evolution of the true parameter have not significantly
    changed from time *t* − 1 to time *t*, then the new estimate should closely replicate
    the previous estimate, saving a lot of processing burden. In addition, if the
    new value of the true parameter and/or the new measurements depart significantly
    from the previous situation, then the updated estimate should reflect the change
    instantaneously. Real-time tracking and thus recursivity is essential in aeronautics,
    automatic surveillance and monitoring, car and train control, speech and image
    (multimedia) processing \[FUK 90, BAR 93, KAY 93, DUV 94, KAY 98\], intensive
    care medicine, econometrics and quantitative finance, etc.


    The measurement ([equation \[3.27\]](#c03.xhtml#eqn27)), yields no recursivity
    of the parameter. Therefore, to build a recursive estimate, KF needs to rely on
    a recursive equation that drives the true parameter evolution and, moreover, that
    equation has to be known ahead to be included in the estimate derivation. Recursivity
    of the estimate will be induced by the recursivity of the true unknown parameter.
    This is the key difference between LSE and KF setups.


    ## 3.8.2. *The state space model and its recursive component*


    This recursive equation, also called the state equation, is a discrete time version
    of a differential equation. It can be “natural” or “intuitive”. If natural, it
    comes from the well-known laws of physics (mechanics, thermodynamics, electromagnetism,
    optics, etc.) and chemistry that describe phenomena along with their key variables
    by differential equations. We invite the reader to check the many examples provided
    in \[BAR 93, KAY 93, KAY 98, NOR 04\]. If no particular law can be leveraged,
    it is still possible to postulate an “intuitive behavioral description” of the
    parameter evolution that is a key stone of KF.


    *KF state-space model/set up*


    Evolution of the parameters *θ*[*t*], state recursive equation:


    [\[3.26\]](#c03.xhtml#eqn_26) ![image](images/img_4_96.jpg)


    Measurement–observation equation:


    [\[3.27\]](#c03.xhtml#eqn_27) ![image](images/img_7_96.jpg)


    No particular law of economics or finance yields a recursive equation of the alphas
    and exposures of any given asset. An intuitive evolution model has thus to be
    introduced. The simplest model leads to the fewest number of extra-parameters
    to be tuned and exhibits the easiest rationale to understand. The simplest and
    most parsimonious recursive model is given by [equation \[3.26\]](#c03.xhtml#eqn26).
    It assumes that the new “state” of the parameter at time *t* is equal to the previous
    “state” at time *t* − 1 plus another component, the state noise w[*t*], that is
    statistically orthogonal (uncorrelated) to the previous state. This means that,
    to describe the new state, we have to fully innovate w.r.t. the statistical information
    contained in the previous state.


    ## 3.8.3. *Parsimony and orthogonality assumptions*


    Orthogonality (see also section 3.9) and parsimony are easy to achieve if we choose
    a zero-mean, Gaussian and white state noise with uncorrelated components, that
    is IE ![image](images/Inline_98_2.jpg)with *δ*\[0\] = 1 and *δ*\[*k*\] = 0, *k*
    ≠ 0, otherwise.


    Consequently, the state equation depends only on one scalar parameter, that is
    ![image](images/Inline_98_4.jpg)because the Gaussian probability density function
    depends only on the first- and second-order moments (see Appendix A1.1). The other
    KF model assumptions are summarized below. In keeping with the parsimony feature,
    both the observation noise and the initial state are also assumed Gaussian and
    white.


    *Summary of KF model assumptions*


    ![image](images/img_6_97.jpg)


    # 3.9. What are the main properties of the KF model?


    ## 3.9.1. *Self-aggregation feature*


    The two key properties of the KF model formalize the main features of recursivity,
    parsimony and orthogonality mentioned in section 3.8. They are both based on the
    explicit writing of the parameter *θ*[*t*] as a function of the state noise w[*t*]
    and the initial value *θ*[0]. It is straightforward to derive from \[3.26\] the
    following relationship:


    [\[3.28\]](#c03.xhtml#eqn_28) ![image](images/img_10_97.jpg)


    [Equation \[3.28\]](#c03.xhtml#eqn28) means, for instance, that the sole value
    of *θ*[*t*−1] self-aggregates the knowledge of the whole series {*θ*[0], *θ*[1],
    …, *θ*[*t*−1]}.


    ## 3.9.2. *Markovian property*


    The self-aggregation feature is leveraged in the so-called “Markovian” property
    described in [equation \[3.29\]](#c03.xhtml#eqn29) and states that the Probability
    Density Function (PDF) of *θ*[*t*] conditional to its whole past is the same as
    its PDF conditional to its most recent value *θ*[*t*−1]. The Markovian property
    expresses the recursivity feature at the probability density level of the parameter.


    [\[3.29\]](#c03.xhtml#eqn_29) ![image](images/img_4_98.jpg)


    [Equation \[3.29\]](#c03.xhtml#eqn29) can also be interpreted in terms of parsimony,
    because we need to propagate *θ*[*t*−1] only to sample the next value.


    ## 3.9.3. *Innovation property*


    As w[*t*] is white, it is statistically orthogonal to all the previous state noise
    samples {w[1], …, w[*t*−1], }. By “statistically orthogonal”, we mean uncorrelated,
    that is IE\[w[*t*] w′[*n*]\] = 0, *t* ≠ *n*, where 0 designates the zero matrix.
    In what follows, the symbol ![images](images/parallel.gif)will stand for “statistical
    orthogonality”.


