    ### 2.7.1.2. *Eigenvalue distribution test: random matrix theory*


    Statistical theory usually presumes a constant number of dimensions or at least
    *T* /*N* → ∞. The quantity *q* = *T*/*N* can be interpreted as average sample
    size per dimension or as effective sample size. Unfortunately, large sample properties
    fail if *q* is small even if *T* is large. RMT is a branch of statistical physics
    that deals with this case of high-dimensional data. RMT is mainly concerned with
    the distribution of eigenvalues of randomly generated matrices. An important result
    is that under the hypothesis of independent and identically distributed matrix
    elements, the distribution of the eigenvalues converges to a specified law that
    does not depend on the distribution of the matrix elements but primarily on *q*
    = *T*/*N*.


    Since the SCM \[2.21\] is a random matrix (see [equations \[2.26\]](#c02.xhtml#eqn26)
    and [\[2.30\]](#c02.xhtml#eqn30)), the results of RMT can be applied in the case
    of normally distributed data. In cases where the data are generalized elliptically
    distributed, the results of RMT are no longer applicable if we use the SCM, but
    may find some evidence by using the spectral estimator instead. Results on generalized
    elliptical distributions and the spectral estimator of the covariance matrix can
    be found in \[TYL 83\], \[TYL 87a\] and \[TYL 87b\] where it is shown that for
    such distributions the spectral estimator corresponds to an *M*\-estimator.


    This section focuses on the basis of the RMT. The reader may refer to \[FRA 04\],
    \[POT 05\], \[HAR 07\] and \[BAI 10\] for a more complete and advanced description
    of the RMT.


