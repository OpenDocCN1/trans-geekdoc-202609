    and [4.25](#c04.xhtml#equ4_25)–[4.26](#c04.xhtml#equ4_26) are similar to the RKF
    recursive equations as `RKF` is a particular case of `rgKF`.


    The OD step [4.18] presented above is a classical non-Gaussian test. It allows
    for incorporating the recursive prediction and correction equations for the first
    two moments of the innovation process (mean and variance) and has thus the advantage
    of keeping the recursive property of the original `KF`.


    Parameter `α` of the hypothesis tests [4.19] and [4.20] is often around 3 but
    may be chosen as an `α`-quantile of the Gaussian distribution. For example, if
    we aim at detecting an outlier within a 1% confidence interval, then `α` is such
    that ![images](images/Inline_148_18.jpg)which is `α` = 2.5758 (such values can
    be found in the statistical tables like in [FOR 10]). The often used value of
    `α` = 3 corresponds to a double confidence interval of 0.13%.


    In the `l¹`-regularization case ([equation [4.22](#c04.xhtml#equ4_22)), and if
    an outlier is detected (if the OD-test `H`[1] (`α`) is verified), then the value
    for `δ` ranges from 0 to 2![images](images/Inline_149_2.jpg)In practice, `δ` should
    be close to 0 and will never tend to its upper bound, which is very generous.
    As shown in [Figure 4.1](#c04.xhtml#fig4_1), the smaller is `δ` and the less regularized
    is the quadratic form, which allows for estimating potential extreme values. On
    the contrary, a high value of `δ` reduces the outlier value to zero, extending
    therefore the support of the underlying distribution. The OD step bypasses the
    tricky problem of choosing a convenient value for the regularization parameter.


    In the `l²`-regularization case, the estimated value for the outlier still depends
    on the chosen value for `δ`. The `l²`-regularization is often preferred in the
    literature when closed-form expressions of [4.23] need to be derived (like in
    [4.24]) and to insure good mathematical properties such as a differentiable and
    continuous function. In this section, we are mainly interested in the `l¹`-regularization
    because of the sparsity of the additive term `v[t]` that is supposed to represent
    spiky returns.


