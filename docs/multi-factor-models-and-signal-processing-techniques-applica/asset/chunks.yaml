    \[3.22\]，一阶项为零）给出：


    \[3.24\] ![image](img/img_2_94.jpg)


    在 \[3.24\]中![image](img/Inline_95_5.jpg)表示 `K+1`、`K + 1` 海森矩阵，即 ![image](img/Inline_95_6.jpg)我们从
    \[3.22\] 得到 ![image](img/Inline_95_7)\= 2 (G′G)[(*t,h*)]。代入 \[3.24\]得到：


