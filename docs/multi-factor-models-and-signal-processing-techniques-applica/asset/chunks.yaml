    can be summarized in the following steps:


    [\[4.12\]](#c04.xhtml#equ4-12) ![images](images/img_4_146.jpg)


    \[4.13\] ![images](images/img_6_146.jpg)


    \[4.14\] ![images](images/img_8_146.jpg)


