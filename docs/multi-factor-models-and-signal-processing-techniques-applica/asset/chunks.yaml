    # Chapter 1


    # Factor Models and General Definition


    # **1.1. Introduction**


    Today, the linear factor model is a benchmark in portfolio management theory \[MAR
    52, LIN 65\], and arbitrage pricing theory (APT) \[ROS 76, ROL 80\]. In practice,
    factor models are also used widely to understand the cross-section dispersion
    of asset returns, whatever the asset class is. Even in the hedge fund industry,
    where returns feature high nonlinearity, this approach is largely implemented,
    in general with some improvement such as nonlinear factors or time-varying parameters.
    This chapter introduces not only the common version of linear factor models but
    also discusses its limits and the developments described in the following chapters
    of this book.


    In section 1.2, we introduce the different notations and discuss the model and
    its structure. We list in section 1.3 the reasons why factor models are generally
    used in finance, and discuss the limits of this approach. Section 1.4 describes
    the different steps in the building of factor models, i.e. factor selection and
    parameter estimation. This section is a direct introduction to Chapter 2 for the
    factor selection step, and Chapters 3 and 4 for the parameter estimation step.
    Finally, section 1.5 concludes the chapter by giving a historical perspective
    on the use of factor models in finance.


    # **1.2. What are factor models?**


    ## **1.2.1.** ***Notations***


    We first consider a set of *N* risky assets, indexed *i* = 1*, …, N*. We denote
    by *s[*i,t*]* the price of the asset *i* at time *t*, and *r*[*i,t*] the corresponding
    return for the period (*t* − 1*, t*). This return is defined by:


    \[1.1\] ![images](images/img_6_25.jpg)


    If prices are observed on a daily (respectively, weekly, monthly, etc.) basis,
    then *r*[*i,t*] represents daily (respectively, weekly, monthly, etc.) returns.
    We then denote by *μ*[*i*] the expected return of asset *i*, and ![images](images/sig2.gif)²
    its variance:


    \[1.2\] ![images](images/img_8_25.jpg)


    The variance ![images](images/sig2.gif)(or the volatility σ[*i*]) is often used
    to measure the risk relative to the asset *i*. The greater the volatility, the
    greater is the risk. The covariance *σ*[*i,j*] = *Cov*(*r*[*i,t*]*, r*[*j,t*])
    between assets *i* and *j* will be useful to compute the risk of a portfolio of
    several assets.


    As opposed to risky assets, we also consider a risk-free asset that gives a return
    *r*[*f*], called the risk-free rate (supposed to be constant). In practice, short-term
    government securities such as US Treasury Bills are used as a proxy for the risk-free
    asset; this results in a non-constant *r*[*f*].


    The expected excess return (or risk premium) of asset *i* is the return we can
    expect from asset *i* in excess of *r*[*f*], that is


    \[1.3\] ![images](images/img_2_26.jpg)


    and is the premium relative to the risk taken when investing in asset *i*.


    According to Markowitz’s \[MAR 52\] theory of *mean-variance efficiency*, investors
    (should) therefore require a higher expected return for holding a more risky asset
    and want to earn the highest possible return for a level of risk that they are
    willing to take. A portfolio is said to be mean-variance efficient if we cannot
    create another portfolio with a greater expected return and the same variance
    of returns (or another portfolio with a lower variance and the same expected return).


    [Figure 1.1](#c01.xhtml#fig1) illustrates the time series evolution of three risky
    assets in comparison to an asset that is a proxy for the risk-free asset. Their
    mean-variance trade-offs are given in [Table 1.1.](#c01.xhtml#tab1)'
