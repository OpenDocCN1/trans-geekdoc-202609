    ![image](img/Inline_108_7.jpg)，协方差矩阵 `S[t|t−1]` 变得“小”（例如接近零矩阵）时，卡尔曼增益范数也会大幅降低。在这种情况下，由于滤波器已经收敛于解，增益消失，任何新的测量都不会显著提高估计。在后一种情况下，KF
    的可靠性主要取决于预测分量 ![image](img/Inline_104_9.jpg)


