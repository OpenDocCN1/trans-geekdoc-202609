- raw: 'By drawing on their professional experience in quantitative modeling to achieve
    the right level of technical sophistication, Serge, Patrick and Emmanuelle have
    succeeded in covering a variety of relevant concepts without sacrificing the technical
    details necessary for a serious implementation: multi-factor models, advanced
    estimation methods based on random matrix theory, filtering algorithms and regularization
    methods for identification of latent risk factors. The use of these tools in risk
    management and asset allocation is nicely illustrated through examples using financial
    data.


    I trust that the hard work done by the authors will benefit a wide range of readers
    across academic and professional circles and act as an incentive for readers to
    delve into the vast research literature on statistical modeling in finance. *Bonne
    lecture!*


    Rama CONT


    London


    June 2013


    # Introduction


    # I.1. Digital society and new paradigms in fund management


    The massive digitization of all our activities from entertainment to all public
    and economical domains marks the era of the digital society. This latter generates
    an overwhelming amount of data, measured in zetta (10^(21)) bytes.


    This phenomenon called *Big Data* impacts the finance sphere as well. The so-called
    *five Vs* need to be handled by fund management companies: volume, velocity, variety,
    visualization and value. Moreover, the 2008 mortgage crisis and its macroeconomic
    effects had two major consequences that make the situation even more difficult
    for fund managers. First, these large amounts of data are highly *hectic* (non-stationary),
    even more unpredictable and noisy. Second, the fund management paradigm has been
    shifted from an “abstruse gain race” at any risk to being able to control the
    risks (draw down) while securing a minimum gain, with a maximum transparency.


    One way to address the above mentioned challenging issues is to provide fund managers
    with appropriate and “user friendly” QUANT(ITATIVE) tools that are market driven.
    This is where Factor Models, Statistical Signal Processing (SSP) and Multi-factor
    Models and Signal Processing Techniques come into play.


    # I.2. Statistical signal processing and factor models in finance


    The linear factor model is nowadays a benchmark in portfolio management theory
    and in the understanding of asset returns, even in the hedge fund industry where
    returns may have high nonlinearities. The idea is to relate a large number and
    variety of returns to a few relevant *factors*, up to Gaussian errors that cannot
    be described solely by the factors. The factors thus drive and parsimoniously
    explain the *spatial correlation between* assets, while the errors are *idiosyncratic
    to each* asset.


    Factors need to be chosen and/or identified first, then the parameters of the
    linear model that connect them to the assets, such as the *alphas* (gains) and
    the *betas* (assets exposures) have to be estimated and tracked. Based on a linear
    regression fed by market data, linear factor models are thus suitable for all
    the requirements listed above of friendliness to the users, transparency and as
    being market driven.


    Statistical signal processing (SSP) methods allow us to access both the factors
    and the model parameters, in a very noisy, highly unpredictable and hectic environment.
    SSP methods have proved their ergonomy, efficiency and practicality in highly
    hostile and changing conditions in the past few decades when applied to medical
    diagnostics, non-destructive testing of nuclear plants, aircrafts, cars and in
    boosting both the performance and the robustness of mobile phones, with some top
    achievements in the 4G Long Term Evolution (LTE) standards.


    The aim of this book is to share the same when dealing with fund management and
    more specifically when facing the identification of linear factor models. While
    application of SSP to finance has been ongoing for a few years, it is still a
    big challenge due to the difficulty of relying on joint expertise in fund management,
    statistical signal processing and being at the crossroad of Academia and Business,
    to make the recent results of research usable for fund managers.


    # I.3. Multiexpertise team of authors


    The three authors’ complementary expertise and experience meet the challenging
    above mentioned conditions. First, the three of them have both academia and business
    experience. Second, two of them are experienced fund managers, while the third
    was an executive of a US company involved in asset capitalization. Moreover, the
    three authors have been working together many years, as partners of the same Company
    QAMLab^©, involved in quantitative solutions for fund management. It is worth
    mentioning that the authors’ expertise range from mathematical finance to SSP.


    This book is thus the outcome of such a unique pluridisciplinary and market-oriented
    expertise.


    # I.4. Book positioning and targeted readers


    The book targets three worldwide audiences. First, graduate students of Business,
    Finance, Management Masters, including, of course, MBAs who would like to understand
    how SSP methods can leverage linear factor models in the complicated and hectic
    digital asset management activities of the emerging digital society. Second, SSP
    grad students who would like to ramp up in quantitative finance following familiar
    tracks of least squares, Kalman filtering (KF) and more advanced tools based on
    most recent regularized Kalman approaches. Third, qualitative fund managers who
    are eager to add to their daily management softwares and practices, several standalone
    and/or end-to-end SSP methods in order to enhance and boost their own management
    style, in a very practical, transparent and market-oriented manner.


    The book material is unique since it presents QUANT tools as practical answers
    to market driven issues faced by fund managers. First in the associated chapters,
    the SSP material is introduced from the users’ stand-point, answering the questions,
    why do we need these tools, how do they work, how do we use them, how can they
    be tuned to the real data? The derivations of the results are provided in appendices
    and can be skipped for user-only readers. On the other hand, SSP skillful audience
    can access quickly this advanced material. Second, numerous examples and real
    market data are used through the whole book to better understand the SSP methods
    and their pluses when dealing with linear factor models. Finally, highlights emphasize
    the most relevant contents at the end of each chapter, to allow quick access.


    It is important to note that the book contents were already taught by all the
    authors, both in finance and Information Science Masters. Feedback from the students
    has thus been a valuable input to improve the clarity and the depth of the writing.


    # I.5. Book organization


    The book is organized into four chapters.


    Chapter 1 introduces the factor model foundations of the whole book, the equations,
    the notations, the main concepts, the origin, the applications, etc. While most
    of it can be skipped by readers familiar with fund management, it is nevertheless
    valuable to check it to master the model that will be used in the remainder of
    the book.


    Chapter 2 presents qualitative and quantitative ways to choose the factors. While
    qualitative approaches leverage pure markets know-how, quantitative methods are
    based on the so-called *eigenfactors*, derived from the eigen-decomposition of
    the returns covariance matrix. Statistical methods to select the “optimum” number
    of factors are also detailed. Even SSP readers can enrich their knowledge by grasping
    the connection between eigen-methods and the determination of the appropriate
    number of factors.'
