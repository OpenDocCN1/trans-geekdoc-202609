    By drawing on their professional experience in quantitative modeling to achieve
    the right level of technical sophistication, Serge, Patrick and Emmanuelle have
    succeeded in covering a variety of relevant concepts without sacrificing the technical
    details necessary for a serious implementation: multi-factor models, advanced
    estimation methods based on random matrix theory, filtering algorithms and regularization
    methods for identification of latent risk factors. The use of these tools in risk
    management and asset allocation is nicely illustrated through examples using financial
    data.


    I trust that the hard work done by the authors will benefit a wide range of readers
    across academic and professional circles and act as an incentive for readers to
    delve into the vast research literature on statistical modeling in finance. *Bonne
    lecture!*


