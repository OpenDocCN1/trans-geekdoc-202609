    ## [3.2] ![image](img/img_2_84.jpg)


    如果我们在大小为 `K` + 1 的向量 `g′[t] = [1 f[t,1] f[t,2] … f[t,K]]` 中聚合了 `K` 个因子 `f[t,k]`（1
