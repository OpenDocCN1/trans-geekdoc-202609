    through a stepwise regression technique \[AGA 00b\]: the factors are entered or
    removed from the model, one at a time, depending on their relative discriminant
    power. Used in its ascending version, the single best factor is chosen first,
    then paired with each of the other variables, and the second best factor is chosen,
    and so on. The order of the model increases until adding a new factor does not
    improve the discriminant power of the previous model. Used in its descending version,
    the initial model contains all the pre-selected factors and removes, one at a
    time, the worst factor, until removing one of the remaining factors does not improve
    the discriminant power of the previous model.


    # **2.3. Quantitative methods based on eigenfactors**


    In this section, we denote by *eigenfactors* the factors obtained from the observations
    using the eigenvector decomposition of the covariance matrix of the returns. In
    the literature on empirical quantitative finance, *eigenfactors* might be viewed
    as special *latent factors* that are a subset of vectors obtained from linear
    combinations of returns. Such methods are often used when there is no *a priori*
    knowledge on the economic factors that may drive the data under study and give
    the remarkable property of yielding to orthogonal factors especially when subspace
    methods are used to derive such factors.


    In the statistical literature, the most frequently used methods are the Factor
    Analysis method and the Principal Component Analysis (PCA) method. Mainly used
    in order to reduce the dimensionality of the matrix of observations, such methods
    use the eigenvector decomposition of the correlation matrix and yield to components
    that are constructed as linear combinations of returns. The most important result
    is that the original data may be approximated with a high percentage of accuracy
    by keeping only a few eigenvectors that are selected such that their associated
    eigenvalues are the highest. The difficulty is therefore to determine the selection
    threshold. This part of the problem is discussed in section 2.4.


