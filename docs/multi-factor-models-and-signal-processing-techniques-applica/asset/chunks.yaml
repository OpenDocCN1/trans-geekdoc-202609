    the `M`-estimator of `Σ` is defined as the solution of the following equation:


    \[2.32\] ![images](images/img_4_66.jpg)


    where the function `u(.)` may follow the following conditions [MAR 76]:


    1) `u(s)` is non-negative, non-increasing and continuous for `s ≥ 0`; 2) Defining
    `ψ(s) = su(s)`, ∀`s ≥ 0`, `ψ(.)` is bounded with `K = sup[s≥0] ψ(s)`; 3) `ψ` is
    non-decreasing and is strictly increasing in the interval where `ψ < K`; 4) There
    exists `s[0]` such that ![images](images/Inline_67_11.jpg)> `N^`.


