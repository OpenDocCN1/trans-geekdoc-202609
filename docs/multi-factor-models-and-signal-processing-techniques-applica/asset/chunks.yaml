    # 因子模型与一般定义


    ## 1.1. 引言


    旨在估计因子模型中 $\alpha$ 和 $\beta$ 的最小二乘法和卡尔曼算法是第 3 章的重点。这两种方法的几何展示使我们能够直观的方式理解其目标、用途、性能和局限性，特别是对于金融和商业背景的读者。`KF`
    的完整推导过程在第 3 章附录中给出，同样采用几何方式。这两种方法是 SSP 中的基本工具。


    第 4 章的内容从 SSP 的角度来看是最先进的，并分享了关于 `KF` 正则化相关研究（在本书编写时）的前沿结果，用以处理某些脉冲性和非高斯市场行为。与传统的
    `KF` 相比，在市场数据上取得了显著的改进并在此了说明。


    ## 1.2. 什么是因子模型？


    ### 1.2.1. 符号


    我们首先考虑一组 $N$ 个风险资产，索引为 $i = 1, \dots N$。我们用 $s[*i,t*]$ 表示 $t$ 时刻资产 $i$ 的价格，$r[*t*]$
    表示相应的收益率（$t-1$）。这种收益率定义为：


    ```

    ![image](img/Inline_21_3.jpg)

    ```


    如果是以每日（或每周）观测价格，那么 $r[*t*]$ 代表每日（或每周）收益率。我们用 $\mu[*i*]$ 表示资产 $i$ 的期望收益，而 ![image](img/Inline_21_4.jpg)
    是其方差：


    ```

    ![image](img/Inline_21_4.jpg)

    ```


    方差（或波动率 $\sigma[*i*]$）通常被用来衡量相对于 $i$ 的风险。波动率越大，风险越大。资产 $i$ 和 $j$ 之间的协方差 $\sigma[*i,j*]
    = \text{Cov}(r[*i*], r[*j]*])$ 对计算组合风险有用。


    与风险资产相反，我们还考虑了一种产生收益 $r[*f*]$ 的无风险资产（假设为常数）。在实践中，短期政府证券（如国债）被用作无风险资产的代理；这导致 $r[*f*]$
    非常数。


    期望超额收益（或风险溢价）是我们预期从资产 $i$ 获得的超过 $r[*f*]$ 的收益，即


    ```![image](img/Inline_22_2.jpg) 所有```


    它是相对于投资资产 $i$ 所承担风险的溢价。


    根据马科维茨 [MAR 52] 的*均方效率*理论，投资者因此要求更高的风险资产提供更高的期望收益，并希望在他们愿意承担的风险水平内获得尽可能高的收益。一个组合被认为是均方有效的，如果我们无法创建另一个具有更高期望收益且相同收益率方差的组合（或者具有相同期望收益但更低方差的组合）。


    [图 1.1] 展示了三个风险资产相对于无风险代理资产的时间序列演变。它们的均方权衡见[表 1.1]。


