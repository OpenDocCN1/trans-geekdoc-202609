    # 1.6. Glossary


    ### Volatility


    The volatility `σ` of an asset `a` refers to the standard deviation of the continuously
    compounded returns of `a` within a specific time horizon. Volatility is usually
    expressed in annualized terms: if the volatility `σ` is computed using daily (respectively,
    weekly) returns and if we consider that a year is made us of 250 business days
    (respectively, 52 weeks), then the annualized volatility will be equal to ![images](images/Inline_42_5.jpg)(respectively,
    ![images](images/Inline_042_5.jpg).


    ### Risk


    The risk of holding an asset `a` may be quantified by the volatility of `a`.


    ### Risk-free rate


    The theoretical rate of return of an investment with zero risk; the risk-free
    rate, commonly denoted `r[f]`, represents the minimum return an investor expects
    for any investment when taking no risk. This is often considered as a lower bound
    of what should at least give any riskier investment since bearing any risk should
    be more remunerating than a risk-free investment.


    ### Expected (excess) return


    The expected return of an asset `a` is the return on `a` expected in the future
    and is computed by `IE(r[a])`. The expected excess return is the expected return
    on `a` in excess of the return given by the risk-free rate (or by any other market
    measure): `IE(r[a]) - r[f]`.


    ### Risk premium


    The risk premium of an asset `a` is the expected return on `a` in excess of the
    risk-free rate, that is `IE(r[a]) - r[f]`.


    ### Zero-cost portfolio


    A zero-cost portfolio is a portfolio for which the weights add up to zero. For
    example, the excess return of an asset `a`, that is `IE(r[a]) - r[f]` is a zero-cost
    portfolio. It invests 100% in `a` and -100% in the risk-free rate. The amount
    borrowed at `r[f]` is invested in `a`. As the investor will have to pay the interest
    for borrowing money at `r[f]`, he/she would therefore expect to receive more than
    `r[f]` in return for his/her investment in `a`.


    ### Tradable portfolio


    A portfolio is said to be tradable if it is a zero-cost portfolio.


    ### Portfolio diversification


    Diversifying a portfolio is the act of adding more investments to one’s portfolio
    to reduce the risk inherent in any one investment. It increases the possibility
    of making a profit, or at least avoiding a loss. In general, the broader the diversification,
    the less is the risk and the return. Adding more investments to the portfolio
    for diversification involves subdividing the portfolio among many smaller investments.
    If the portfolio’s size increases instead of remaining constant, the portfolio’s
    risk may not decrease especially if the assets added in the portfolio are uncorrelated.
    Here is a very simple example of diversification benefits on the variance of the
    portfolio. If the `N` assets in the portfolio are mutually uncorrelated and have
    identical variances `σ²`, portfolio variance is minimized by holding all assets
    in the equal proportions `1/N`. Then, the portfolio variance equals `σ²/N` that
    is monotonically decreasing in `N`. So, even if the added assets are uncorrelated,
    the portfolio variance decreases. Benefits of diversification amplify when adding
    negatively correlated assets in the portfolio. The modern understanding of diversification
    dates back to the work of Harry Markowitz [MAR 52] in the 1950s.


    ### Market portfolio


    A market portfolio is a perfectly well-diversified portfolio and represents the
    evolution of the market as a whole. In the factor model framework, a perfectly
    diversified portfolio admits a pure factor structure, that is a factor structure
    where there is no additional idiosyncratic risk.


    ### Market efficiency


    The market is said to be efficient if the price of the assets in the market reflects
    all information available.


    ### Market equilibrium


    The market equilibrium occurs if the amount of demand is balanced by the amount
    of supply. In this condition, the prices should tend not to change unless demand
    or supply change.


    ### Arbitrage


    Arbitrage is the possibility of a risk-free profit at.


    ### Market capitalization


    Market capitalization, also known as `MC` or `cap.` (`MC`), is the number of outstanding
    shares of a firm times its price. It measures the size of the firm. It changes
    every day (`P`). For example, in October 2010, the six largest `MC` were (`T$`
    for trillions and `B$` for billions):


    1. Telecom Brasil with `T$57` and `B$99`

    2. Exxon Mobil with `T$337.69` and `B$66.32`

    3. Apple with `T$282.77` and `B$309.52`

    4. PetroChina with `T$229.20` and `B$125.23`

    5. BHP Billiton with `T$224.83` and `B$80.81`

    6. Microsoft with `T$219.97` and `B$25.42`.


    # Chapter 2


    # Factor Selection


    ## 2.1. Introduction


    The use of factor models requires the determination of the nature and the number
    of the factors. Two approaches can be distinguished in the literature: the empirical
    *ad hoc* approach and the statistical approach which involve subspace methods
    and lead to the socalled `eigenfactors`.


    Empirical studies generally compare the two approaches (see [CHE 93, CON 95, CHA
    98, DAR 11]) and mostly emphasize the superiority of eigenfactors over macro-economic
    factors regarding their expected properties (uncorrelated factors) and the percentage
    of the explained part they contain. Eigenfactors are nevertheless difficult to
    relate to observed macro-economic factors which lower in a certain sense their
    attractiveness to practitioners.


    This chapter is organized as follows: section 2.2 focuses on the empirical *ad
    hoc* approach and presents three reference models that are widely used in the
    literature. In section 2.3, we present the statistical approach. As opposed to
    empirical factor selection where *a priori* knowledge on the observed data is
    required, the purely statistical approach extracts a smaller group of implicit
    eigenfactors from the time series of the observed returns which explain a large
    amount of information contained in the data. The problem is then to determine
    the order of the resulting model. Some classical techniques, arising from the
    information theory, are described in section 2.4. Sections 2.5–2.7 are complementary
    sections giving some light on related problems to this approach such as the estimation
    of the covariance matrix of the data, the similarity of the approach with subspace
    methods and the extension of this approach to large panel data.


    ## 2.2. Qualitative know-how


    In an empirical *ad hoc* approach, the nature and the number of factors are chosen
    with some *a priori* consideration of the market conditions. The factors are observable
    market risk factors and are included in the model through a discretionary choice.

