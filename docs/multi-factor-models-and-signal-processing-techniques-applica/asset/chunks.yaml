    [\[3.3]](#c03.xhtml#eqn_3) ![image](img/img_5_84.jpg)


    （单位资产的）收益率 `r[t]`（用更通用的方式称为观测、测量或响应）是模型 [3.3] 的第一个输入。“因子” `g[t,k]`（0 ≤ `k` ≤ `K`，其中
    `g[t,0] = 1`，`g[t,k] = f[t,k]` 对于 `k` ≠ 0）在线性回归框架中通常被称为回归变量，是单位资产模型的其他输入。


    ### 3.2.2 单位收益的 Alpha 和 Beta 估计


    在本章中，假设 `K` 个因子 `f[t,k]`（1 ≤ `k` ≤ `K`）已通过选择。LSE（最小二乘法）和 KF（卡尔曼滤波）是众多方法，允许对给定的因子估计
    `θ[t]`。这种估计表示为 ![image](img/Qcap.gif)*t*。


    LSE 和 KF 有两个主要共同点：首先，它们共享相同的观测[方程 [3.3]](#c03.xhtml#eqn3)。其次，它们的优化准则和后续解可以用相似的方式进行解释，涉及特定的欧距离平方（“二阶”）。对于两者，几何意义有助于理解方法的工作原理以及如何推导出最优解。


    LSE 和 KF 之间存在根本区别。得益于上述输入的“瞬时和递归处理”，KF 提供了一种递归估计 ![image](img/Inline_86_2)，可以自然地表示为
    ![image](img/Inline_86_3)的函数。与 KF 不同，LSE 的“跟踪能力”（*例如对冲基金等动态投资风格*）有限，因为它基于“块处理”且不产生递归估计。与瞬时处理相反，块处理需要访问多个（而不仅仅是一个）测量值和因子值来获得估计。


    这些点在 3.3–7 节详细介绍了基于块处理的 LSE，3.8–12 节介绍了基于递归和瞬时处理的 KF。


    # 3.3 LSE 设置


    ### 3.3.1 当前观测窗口和块处理


    LSE 方法要求我们定义一个“当前观测”窗口，以限制块处理的时间索引。当前观测窗口表示为 `(t, h)`，其中 `t` 代表当前时刻（即窗口结束），`h`
    是该窗口包含时刻数。我们有 `(t, h) = {l}`：`t − h + 1 ≤ l ≤ t`。我们将 `h` 称为窗口长度。


    ### 3.3.2 LSE 回归


    由于 LSE 利用了响应 `r[l]` 和回归变量 ![image](img/glcap.gif)（`l ∈ (t, h)`）的块处理，LSE 隐式假设 Alpha
    和 Beta 参数向量在观测窗口 `(t, h)` 上具有某个值 `θ[t,h]`。这允许根据[方程 [3.3]](#c03.xhtml#eqn3) 的所谓“LSE
    回归”生成 `l ∈ (t, h)` 的测量值 `r[l]`：


    \[3.4] ![image](img/img_2_86.jpg)


    LSE 回归 [3.4] 可以以“块”的形式重写，因为它有助于定义 LSE 目标并推导其解：


    [\[3.5]](#c03.xhtml#eqn_5) ![image](img/img_5_86.jpg)


    在[方程 [3.5]](#c03.xhtml#eqn5) 中，我们有 ![image](img/Inline_87_8)、![image](img/Inline_87_9)
    和 ![image](img/Inline_87_10)。LSE “块回归”聚合了 `h` 个收益过程 `r[l]` 实例。


    **假设 3.1.** 假设窗口长度 `h` 远大于未知数量 `K + 1`，即 `h ![image](img/great.gif)+1`，且 `[h,
    K + 1]` 矩阵 `G[t,h]` 是满秩的（等于 `K + 1`）。


    # 3.4 LSE 目标和标准


    LSE ![image](img/Inline_87_14) 在所有可能的实值 `(K + 1)` 维向量 `ξ` 中实现了差异 `r[t,h] = G[t,h]ξ`
    的欧范数平方 `||[l]||2` 最小：


    [\[3.6]](#c03.xhtml#eqn_6) ![image](img/img_15_86.jpg)


    项 `G[t,h]ξ` 可以被视为跨当前观测窗口 `(t, h)` 构建的响应向量 `r[t,h]` 的估计 ![image](img/Inline_87_18)。因此，如果我们表示
    ![image](img/Inline_87_19)1 ≤ k ≤ K+1，矩阵 `G[t,h]` 的 `K + 1` 个列向量（也称为列因子），项 `G[t,h]ξ`
    可以重写为 ![image](img/Inline_88_2)的线性组合，即：


    \[3.7] ![image](img/img_3_87.jpg)


    因此，正如 [3.6] 所定义的，LSE ![image](img/Inline_88_9) 帮助我们构建 ![image](img/Inline_88_7)
    的线性组合，在几何意义上最拟合测量值 `r[l]`。该解的几何解释在 3.6 节详细介绍。需要注意的是，LSE 优化标准并没有对解 ![image](img/Inline_88_8)
    任何限制，特别是 ![image](img/Inline_88_9) 的幅度可能会很大，从而导致不可靠的响应![image](img/Inline_10)。在这种情况下，LSE
    必须进行正则化（见第 4 章）。


    # 3.5 LSE 如何工作（对于 LSE 用户和程序员）


    如果 `G[t,h]` 是满秩的，那么 ![image](img/Inline_87_13) 是可逆的，且 LSE 需要对整个观测窗口 `(t, h)` 进行块处理（见
    [3.8] 的推导）。


    根据 [3.8] 的显式形式，基于下一个观测窗口 `(t + 1, h)` 的计算需要经过整个块处理，即计算 ![image](img/Inline_88_20)的这两个实体。后两个实体没有表现出任何递归属性，允许将
    ![image](img/Inline_89_2) 仅作为当前 LSE ![image](img/Inline_3) 的函数。这实际上是 LSE 的一个主要局限性。


    # 3.6 LSE 解的解释


    ### 3.6.1 偏差和方差


    将 LSE 回归 [3.5] 代入 LSE 解 [3.8]，揭示了估计 ![image](img/Inline_88_9) 与未知 `θ[t,h]` 之间的关系：


    [\[3.9]](#c03.xhtml#eqn_9) ![image](img/img_8_88.jpg)


    [方程 [3.9]](#c03.xhtml#eqn9) 证明是偏差和方差评估的关键。确实，根据 [3.9]，LSE ![image](img/Inline_88_9)
    的偏差 `B(![image](img/Inline_13))` 定义为零，因为观测噪声向量 `∈[t,h]` 为均值。这意味着平均而言，LSE 与真实参数重合。但偏差仅反映了
    ![image](img/Inline_89_14) 的一阶矩，随后显示了 LSE 质量的狭隘视角。


