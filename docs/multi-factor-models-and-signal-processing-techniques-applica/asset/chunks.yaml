    [Equation \[3.30\]](#c03.xhtml#eqn30) stands for the “innovation” (orthogonal)
    property: each update of the state noise brings pure innovation to the parameter
    evolution. As detailed in sections 3.11 and 3.12, both the Markovian and innovation
    properties drive the architecture of the KF.


    # 3.10. What is the objective of KF?


    Given the measurements up to time `t`, {`r`[`k`], 1 ≤ `k` ≤ `t`} AND the state-space
    setup (model) described by [equations \[3.26\]](#c03.xhtml#eqn26) and [\[3.27\]](#c03.xhtml#eqn27),
    KF aims at deriving a *recursive and linear* (regarding linearity, see the second
    and third notes hereafter) estimate ![image](images/Inline_100_4.jpg)of the unobservable
    state or parameter `θ`[`t`], `t` ≥ 1 based on the minimization of the mean square
    error (MSE). The second subscript `q` of ![image](images/Inline_100_5.jpg)stands
    for the end of the time window of the observation space ![image](images/Inline_100_6.jpg)used
    to estimate `θ`[`t`], `t` ≥ 1. If the problem is limited to KF, then `q` = `t`.
    For Kalman prediction and smoothing, not addressed in this book, we would have
    `q` < `t` and `q` > `t` respectively.


    ### KF objectives:


    \[3.31\] ![image](images/img_8_99.jpg)


    Based on minimum mean square error (MMSE) optimality criterion:


    [\[3.32\]](#c03.xhtml#eqn_32) ![image](images/img_11_99.jpg)


    In [equation \[3.32\]](#c03.xhtml#eqn32), ![image](images/Inline_100_14.jpg)designates
    any element of the observation space ![image](images/Rt1.jpg)spanned by the random
    variables {`r`[1], …*, `r`[`t`]}, see section 3.14 for the geometrical and Euclidian
    interpretation of MMSE criterion.


    **NOTE 3.2.** The recursivity of the estimate is naturally induced by the recursivity
    of the state [equation \[3.26\]](#c03.xhtml#eqn26) and the consecutive Markovian
    property \[3.29\].


    **NOTE 3.3.** For the sake of simplicity and for the benefit of newcomers, we
    have positioned the objectives of KF as a recursive MMSE estimate, limiting thus
    the optimality search to an intuitive “distance-like” or geometrical-like second-order
    criterion (see section 3.14). The geometrical path skips the probabilistic or
    Bayesian presentation, based on conditional probability densities. Probabilistic
    derivation requires a lengthy introduction of maximum *a posteriori* methods and
    detailed properties of normal conditional PDFs, at the expense of the intuitive
    and quick understanding of KF structure, behavior and performance.


    **NOTE 3.4.** In the probabilistic (Bayesian) approach and under Gaussian assumptions,
    linearity of the estimate w.r.t. both the measurements and the previous estimate
    is a consequence of the optimization process. The MMSE-based presentation undertaken
    in this chapter needs to specify the structure of the estimate. It is limited
    hereafter to linear operators in order to lead exactly to the same solution as
    the probabilistic derivation.


    # 3.11. How does the KF work (for users and programmers)?


    ## 3.11.1. Algorithm summary


    Resolution of the problem stated in section 3.10 is detailed in section 3.14.
    Hereafter, we describe and interpret the recursive structure of the KF solution
    that should be well understood by both KF users and programmers. One *full recursive
    KF step* from time `t` − 1 to time `t`, with `t` ≤ 1, is twofold. Indeed, as displayed
    in [Figure 3.2](#c03.xhtml#Fig2), the KF full step updates, on the one hand, the
    (alphas and betas), from ![image](images/Inline_101_7.jpg)to ![image](images/Inline_102_2.jpg)and,
    on the other hand, the associated KF “accuracy” matrix, from ![image](images/Inline_102_3.jpg)is
    called the *KF*(`n`/`q`) innovation,![image](images/Inline_102_4.jpg)The accuracy
    matrix is nothing but the covariance matrix of the current KF innovation. The
    decrease of its dynamic range tracks the accuracy improvement and thus the convergence
    of the KF estimate closer to the targeted parameter `θ`[`t`].


    **1) Initialization `t` = 0**


    KF is initialized in the following manner:


    [\[3.33\]](#c03.xhtml#eqn_33) ![image](images/img_7_101.jpg)


    From time `t` − 1 to time `t`, with `t` ≤ 1: full KF recursive processing breaks
    into (1) prediction (also called *a priori* update) and (2) correction (also called
    *a posteriori* update), see [Figure 3.2](#c03.xhtml#Fig2).


    **2) Prediction, from (`t` − 1|`t` − 1) to (`t`|`t` − 1)**


    Prediction is the sole recursive step of KF induced by the recursive state model
    given [equation \[3.26\]](#c03.xhtml#eqn26). The prediction step are split into
    prediction filtering that computes the new state ![image](images/Inline_102_2.jpg)from
    the previous estimate ![image](images/Inline_102_3.jpg)and prediction accuracy
    processing, see \[3.3\], that refreshes the accuracy matrix.


    **3) Correction, from (`t` − 1|`t` − 1) to (`t`|`t`)**


    Correction is triggered by the capture of updated measurement `r`[`t`] (see [Figure
    3.2](#c03.xhtml#Fig2)). After the calculation of the so-called Kalman gain, see
    \[3.36\], the correction filtering sub-step computes ![image](images/Inline_103_2.jpg)see
    \[3.37\]. The correction accuracy processing evaluates S[`t`].


    ## 3.11.2. Initialization of the KF recursive equations


    Similar to several algorithms where initial values have to be chosen, there is
    a trade-off to make between the estimation accuracy and the convergence speed
    of the algorithm. Depending of the initial values, recursive algorithms will converge
    more or less quickly toward the true values.


    As stated in [equation \[3.33\]](#c03.xhtml#eqn_33), the parameters of the space-state
    model have to be initialized. The initial values of the vector ![image](images/Inline_104_5.jpg)have
    to be set regarding the knowledge of the problem and what represents this vector.
    In the case of factor model, *θ* accounts for the exposures of the portfolio to
    some market factors, so that their values are mostly comprised between −1 and
    +1. Initializing ![image](images/Inline_104_6.jpg)with zeros is therefore very
    plausible.

