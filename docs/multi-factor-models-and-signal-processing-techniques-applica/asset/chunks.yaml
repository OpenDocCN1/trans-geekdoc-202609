    Foreword


    With the irruption of electronic markets and the widespread use of quantitative
    models for trading, order execution and risk management, financial markets have
    evolved from the low-tech environment where they started from a few decades ago
    to the one where market participants routinely employ advanced data processing
    techniques to analyze large data flows in real time and feed the results into
    trading algorithms and risk management systems. Operational constraints arising
    from the sheer volume of data to be analyzed have created the need for intelligent
    data processing and modeling methods and parsimonious models whose estimation
    and simulation is feasible in the high-dimensional settings represented by the
    large number of risk factors involved in risk decisions.


    In this context, advanced tools and methods from signal processing – the branch
    of science and engineering that deals with the modeling and analysis of complex
    streams of data – are increasingly used to analyze financial data and estimate
    the statistical models used by portfolio managers and risk managers.


    In contrast to the traditional toolkit of portfolio theory, which is mostly based
    on *static* analysis of portfolio loss distributions, the use of models based
    on stochastic process allows risk managers a dynamic, and more realistic, view
    of portfolio risk which is dynamically updated as new information is revealed.
    However, the use of such dynamic models comes at a price: we need more advanced
    tools to estimate, simulate and analyze portfolio risk in these models. Tools
    that have long been used in engineering, such as the Kalman filter, but may be
    unfamiliar to some risk management professionals, turn out to be relevant when
    moving beyond the static setting.


    Simultaneously, the use of high-dimensional models entail new estimation problems:
    in many asset allocation problems, one has a few years (so, a few hundreds of
    daily observations) to estimate the parameters describing the evolution of hundreds,
    if not thousands, of risk factors. In this context, traditional estimation methods,
    such as principal component analysis and basic covariance analysis, fail to be
    consistent and yield unexpected (and biased!) results **. . .** Tools such as
    random matrix theory, initially developed in nuclear physics to model the energy
    levels of complex nuclei, have been recently used to explore such estimation biases
    and propose methods for overcoming them.


    Leveraging on their double profile of quantitative risk professionals with a strong
    research and technical background, Serge Darolles, Patrick Duvaut and Emmanuelle
    Jay have done an excellent job in presenting a nice selection of advanced signal
    processing tools and statistical models that address some of these points in a
    self-contained manner, at a level accessible to students and professionals involved
    with quantitative risk management.'
