    The so-called FP estimate ![images](images/Inline_68.jpg)of `Σ` is defined as
    a FP of function `f[N,Σ]` such that:


    [2.35](#c02.xhtml#eqn35)


    \[2.35\] ![images](images/img_77.jpg)


    where ![images](images/Inline_69_2)positive definite with ![images](images/Inline_69_3)matrices
    with elements in ![images](images/Inline_69_3)}.


    [Equation 2.35](#c02.xhtml#eqn35) or equation ![images](images/Inline_69_8)has
