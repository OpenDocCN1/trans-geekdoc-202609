  trans: '


    确定 `K`（即公共因子数量）是因子模型的关键任务之一。在对协方矩阵估计进行特征值分解后，最简单的步骤是选取最大的 `K` 个特征值，因为存在各种测试来判断某个特征值是否足够：


    1) 查看包含在 `λ`[`k`]中的总功率的百分比：


    \[2.12\] ![images](img/img_4_59.jpg)


    2) 计算被声明为大的第 (`k` + 1) 个特征值与第 `k` 个特征值的比值：


    \[2.13\] ![images](img/img_7_59.jpg)


    显然，这些测试的结果将取决于所选的 `η`[1] 或 `η`[2] 的值。更通用的标准可能有用，目前出现了两类标准：(1) 传统标准和 (2) 基于大面板数据定义的、更特定于因子模型识别的标准。


    ## 2.4.1 信息准则


    用于检测 `K` 值的第一类测试被称为顺序假设 (SH) 检验或球性检验，源自统计学领域（参见 [AND 63]）。目标是找到 `N` - `K` 个最小特征值相等假设与仅
    `N` - `K` - 1 个最小特征值相等假设之间的似然比。Anderson [AND 63] 显示，对于 `T` ![images](img/great.gif)*N*，`N`
    - `K` 个最小特征值聚集在一个小值 `s`²附近，并证明充分统计量为：


    \[2.14\] ![images](img/img_2_60.jpg)


    该比率使用了 `N` - `d` 个最小特征值的算术平均值与 `N` - `d` 个最小特征值的几何平均值的比。如果 `N` - `d` 个最小特征值相等，则
    `L`(`d`) = 0。渐近地，统计量 [2.14] 对应于 `χ`²((`N` - `d`)² - 1)分布，因此给定置信区间和顺序检验，可以确定 `d`
    的值。


    第二类测试在 `L`(`d`) 中增加了一个考虑模型自由度的惩罚函数。这产生了一个需要最小化的关于 `d` 的函数，经典的赤池信息准则 (AIC) 和最小描述长度
    (MDL) 检验可以写成如下，即 `L`(`d`) + `p`(`d`) [TRE 02, RIS 78]。


    ### 2.4.1.1 赤池信息准则


    Akaike [AKA 74] 引入了一种广为人知的基于信息论准则，即 AIC。该测试可以方便地写为：


    \[2.15\] ![images](img/img_8_60.jpg)


    因此通过最小化 [2.15]，我们得到 AIC 估计值 ![images](img/ch02_image001.gif)：


    \[2.16\] ![images](img/img_11_60.jpg)


    已经证明 AIC 是不一致的，并且在渐近上于高估源的数量。然而，对于较小的 `T`，与 MDL 获得的结果相比，AIC 通常具有更高的正确结果的概率。


    ### 2.4.1.2 最小描述长度


    MDL 与 AIC 的区别在于添加到 Anderson 充分统计量 `L`(`d`) 中的惩罚函数值不同：


    \[2.17\] ![images](img/img_4_61.jpg)


    因此通过最小化 [2.17]，我们得到 MDL 估计值 ![images](img/Inline_62_7.jpg)：


    \[2.18\] ![images](img/img_8_61.jpg)


    与 AIC 相，MDL 估计在维度上是一致的，即当 `T` → ∞ 时，MDL 估计接近 `K`。在实践中，MDL 优于 AIC 和贝叶斯信息准则 (BIC)。


    ## 2.5 附录 1：协方矩阵估计


    空间方法需要计算观测值的协方矩阵，通常通过样本协方矩阵 (SCM) 进行估计。SCM 是多元高斯假设下极大似然法的解，但在收益存在离群值的情况下缺乏稳健性。在本节中，我们首先给出样本均值和
    SCM 的表达式及其属性，然后介绍一组稳健估计量，即 `M`-估计量。


    **图 2.3.** 在确定一组大小为 `N` = 72、长度为 `T` = 144 的月收益的因子数量时，AIC 和 MDL 的比较。MDL 更清晰地指示了数据集中的截点（`K`
    = 6 个因子），而 AIC 是单调递减函数 ![images](img/img_2_62.jpg)


    ### 2.5.1 样本均值


    样本均值提供了向量均值的无偏且一致估计，其通过其值的算术平均值计算：


    \[2.19\] ![images](img/img_5_62.jpg)


    其中 1[`T`] 表示一个 `T` 维的全 1 向量。该估计量为：


    ![images](img/img_2_63.jpg)


    如果观测向量是高斯向量，则它与极大似然估计量一致。


    ### 2.5.2 样本协方矩阵


    在高斯情况下，`Σ` 的极大似然估计 ![images](img/Inline_64_6.jpg) 为：


    \[2.20\] ![images](img/img_7_69.jpg)


    该估计量为：


    ![images](img/img_10.jpg)


    因此，如果我们定义 ![images](img/Inline_64.jpg)，则 `S` 是所谓的 SCM，我们有：


    \[2.21\] ![images](img/img_14.jpg)


    \[2.22\] ![images](img/img_15.jpg)


    \[2.23\] ![images](img/img_17.jpg)


    注释 1. 如果观测值为零均或均值向量 `μ` 已知，则协方矩阵的极大似然估计 ![images](img/Inline_64_20) 是无偏的。


    一些渐近结果：


    \[2.24\] ![images](img/img_2.jpg)


    \[2.25\] ![images](img/img_4.jpg)


    2.26 ![images](img/img_6.jpg)


    在 [2.25] 中，`r` 表示 `Σ` 的秩（如果矩阵满秩，则 `r` = `N`）。![images](img/Inline_65_9) 是参数为 `N`
    和 `T` - 1 的 Hotelling 平方统计 [HOT 31]。由 Harold Hotelling 开发的 Hotelling 平方统计是 t 检验的推广，常用于多元假设检验。当随机变量
    ![images](img/Inline_65_10) 时，![images](img/Inline_65_11)，其中 `F`[`p,n`-`p`+`1`]
    是参数为 `p` 和 `n`p+1 的 `F` 分布，也称为 Snedecor `F` 分布（见附录 A1.4 和 A1.5）。


    高斯情况：如果观测值为多元高斯 ![images](img/N.gif)(`μ`, `Σ`)，则 ![images](img/Inline_65_13) 和
    ![images](img/Inline_65_14) 通过最小化得到：


    \[2.27\] ![images](img/img_15.jpg)


    当 (`T` - 1) ≥ `N` 且 `V` = (`T` -1)`S` 时。由于最后一项是正的，我们只需要最小化：


    \[2.28\] ![images](img/img_18.jpg)


    然后我们有：


    \[2.29\] ![images](img/img_2.jpg)


    2.30 ![images](img/img_4.jpg)


    \[2.31\] ![images](img/img_6.jpg)


    其中 Wishart 分布(`n`, `A`) 表示参数为 `n` 和 `A` 的 Wishart 分布（详见附录 A1.6 或 [BIL 99]）。


