    summarized in the previous set of information given in `t − 1` without any specification
    of a window length. Moreover, the equations of the `KF` introduce a dynamic evolution
    of the model parameters, which brings some `a priori` information about what we
    actually do not know.


    [Figure 3.10.](#c03.xhtml#Fig_10) NAVs of a long-only Indian equity portfolio
    hedged by a proportion of nifty Index futures computed with (1) OLS over the whole
    period, (2) SW-OLS with a window length of 3 months, (3) a Kalman Filter, (4)
    a Robust Kalman Filter and (5) a regularized version of the Kalman filter, which
    filters out outliers. The classical `KF` and its various versions seem to be the
    more accurate versus the cost of hedging a portfolio.


    ![image](images/img_2_120.jpg)


    [Figure 3.10](#c03.xhtml#Fig10) shows the results for a `RKF` and a `rgKF`. `KF`
    equations assume conditionally Gaussian-distributed state and observation errors
    that are invalidated in the presence of outliers. These versions of `KF` account
    for outliers in the observation equation and the `KF` recursive equations are
    then regularized and therefore robust to outliers. These methods are presented
    in Chapter 4.


    ### 3.13.3 Hedge fund style analysis using a multi-factor model


    Analyzing the risks in the hedge fund (HF) industry has gained interest because
    it has been Noting that, by construction and in keeping with recognized that `HF`
    returns have very specific characteristics, such as heavy tail and asymmetric
    distributions, option-like payoffs and dynamic risk exposures.


    Using multi-factor models allows us to decompose the observed returns on a set
    of several variables, selected as being nonlinearly dependent and bringing multiple
    insights. The rough task of selecting appropriate factors has been discussed in
    Chapter 2. In that example, we focused on the estimation methods and use the eight
    Fung and Hsieh risk factors `[HSI`.


    #### 3.13.3.1 Fung and Hsieh risk factors


    The eight risk factors of Fung and Hsieh `[HSI]`, as described in Chapter 2, were
    quoted on a monthly basis from January 1994 to December 2012 and include:


    – three `trend-following` risk factors: `PTFSBD`, a bond-based risk factor; `PTFSFX`,
    a currency-based risk factor, and `PTFSCOM`, a commodity-based risk factor; –
    two `equity-oriented` risk factors: `SP500`, the Standard & Poors 500 index, and
    `EquitySizeSpread`, the size spread factor expressed as the difference between
    the Russell 2000 index monthly total returns and the `SP500` returns; – two `bond-oriented`
    risk factors: `bond10y`, the monthly change in the 10-year treasury constant maturity
    yield, and `CreditSpread`, the difference between the monthly change in the Moody’s
    Baa yield and `bond10y`; – one `emerging market` risk factor: `MXEF`, the Morgan
    Stanley Capital International (MSCI) emerging market index.


    These factors are stored in `f[t]` at each time `t` as inputs for `[1.4]`.


    #### 3.13.3.2 Hedge fund data


    The eight risk factors of Fung and Hsieh were initially built to explain trend-follower
    funds, so we select `directional` HFs such as `global macro`-hedge funds. Global
    macro-hedge fund managers may take directional positions in currencies, debt,
    equities or commodities, and may also elect to take `relative value` positions
    combining `long` positions paired off against `short` positions.


    We illustrate the performance of the different estimation methods on a trend-follower
    hedge fund, named Aequam Diversified Fund, which has been managed by Aequam Capital
    since 17 December 2010. The fund is a systematic `HF` taking long and short positions
    on futures on bonds, futures on stock indices, futures on foreign exchange and
    futures on commodities. The fund has been a UCITS IV Fund since June 2012 and
    is a weekly audited fund with around M$20 of assets under management (AUM). Even
    though this fund was opened in 2010 we have access to its historical and backtested
    performance since 2004. Systematic funds have this specificity: backtested performance
    is reliable because Commodity Trading Advisor (CTA) and systematic funds run a
    designed process which is exactly the same as the process which is run once the
    fund is invested. Moreover, managing futures offers a high liquidity to the fund.


    [Table 3.2](#c03.xhtml#tab3_2) gives some basic statistics for the eight risk
    factors and for Aequam Diversified Fund. These statistics are computed using monthly
    (end month-to-end month) returns. [Figure 3.11](#c03.xhtml#Fig11) illustrates
    the evolution of the eight risk factors of Fung and Hsieh and Aequam Diversified
    Fund given a base 100 in December 2003.


    #### 3.13.3.3 Estimation methods


    We compare in this section the results of the estimation of Aequam Diversified
    Fund using respectively `SW-OLS` with 24 months, a `KF` and `rgKF`. [Figure 3.12](#c03.xhtml#Fig12)
    displays the tracking performance of the `HF` using Fung and Hsieh factors. `SW-OLS`,
    `KF` and `rgKF` achieve almost the same performance whereas `SW-OLS` is a long
    way from the observed time series.


    [Figures 3.13](#c03.xhtml#Fig13)–[3.15](#c03.xhtml#Fig15) show the estimated time-varying
    exposures for Aequam Diversified Fund using respectively a `SW-OLS` with a 24
    month-long window, a `KF` and a `rgKF`.

