    正如各项研究中所提到的，尽管密度具有肥尾特征，但 Marčenko–Pastur 密度是随机向量相关矩阵特征值密度的很好的近似。因此，问题在于如何选择显著特征值，然后确定模型的阶数或因子数量，并解释相应的特征向量。后者与观测数据有关，例如，有人指出，对应于最大特征值的特征向量代表了市场因子，因为它涵盖了收益率方差的大部分。其他特征向量可以像
    [DAR 11] 中做的那样与市场中的观测时间序列进行比较。


    **图 2.7。** 使用 i.i.i. 随机正态收益率通过 (*T* = 5,000*, *N* = 1,000*) 和 (*T* = 500*, *N*
    = 100*) 计算出的 *q* = 5 时 SCM 的特征值分布。相应的 Marčenko–Pastur 密度叠加在。


    ![images](img/img_3_77.jpg)


    在更通用的设定下，显著特征值的选择通过阈值程序完成：所有大于某个数值 `λ*` 的特征值被认为是有信息的，否则特征值与噪声有关。为了重构滤波后的协方差矩阵估计或构造相应的特征因子，可以将所有噪声相关的特征值替换为常数。这导致通过总和对特征值进行归一化。然后，通过其对角化的逆过程得到去噪后的协方差矩阵估计。


    让我们回想一下，每个特征值对应资产组合的方差。一个非常小的特征值意味着存在一个样本外方差极小的资产组合，这可能是不现实的。


    **图 2.8.** 使用 i.i.i. 随机正态收益率通过 (*T* = 2,000*, *N* = 1,000*) 和 (*T* = 500*, *N*
    = 250*) 计算出的 *q* = 2 时 SCM 的特征值分布。相应的 Marčenko–Pastur 密度叠加在。


    ![images](img/img_3_78.jpg)


    **图 2.9。** 使用 i.i.i. 随机正态收益率通过 (*T* = 500*, *N* = 500*) 和 (*T* = 200, *N* = 200*)
    计算出的 *q* = 1 时 SCM 的特征值分布。相应的 Marčenko–Pastur 密度叠加在。


