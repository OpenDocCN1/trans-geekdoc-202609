    [公式 \[3.30\]](#c03.xhtml#eqn30) 代表“创新性”（正交）属性：状态噪声的每次更新都为参数演化带来了纯粹的创新。如 3.11 节和
    3.12 节所示，马尔可夫属性和创新属性共同驱动了卡尔曼滤波（KF）的架构。


    # 3.10. KF 的目标是什么？


    给定截至时间 `t` 的观测值 {`r`[`k`], 1 ≤ `k` ≤ `t`} 以及由 [公式 \[3.26\]](#c03.xhtml#eqn26)
    和 [\[3.27\]](#c03.xhtml#eqn27) 描述的状态空间设置（模型），KF 的目标是通过最小化均方误差（MSE），推导出不可观测状态或参数
    `θ`[`t`], `t` ≥ 1 的*递归且线性*估计（关于线性性，请见后文的第二个和三个注释）![image](img/Inline_100_4.jpg)。![image](img/Inline_100_5.jpg)
    的第二个下标 `q` 代表用于估计 `θ`[`t`], `t` ≥ 1 的观测空间 ![image](img/Inline_100_6.jpg) 时间窗口的结束。如果问题限于
    KF，则 `q` = `t`。对于本书未涉及的卡尔曼预测和平滑，我们分别会有 `q` < `t` 和 `q` > `t`。


    ### KF 目标：


    \[3.31\] ![image](img/img_8_99.jpg)


    基于最小均方误差（MMSE）最优性准则：


    [\[3.32\]](#c03.xhtml#eqn_32) ![image](img/img_11_99.jpg)


    在 [公式 \[3.32\]](#c03.xhtml#eqn32) 中，![image](img/Inline_100_14.jpg) 表示由随机变量 {`r`[1],
    …*, `r`[`t`]} 跨的观测空间 ![image](img/Rt1.jpg) 中的任何元素，MMSE 准则的几何和欧几里得解释请参见 3.14 节。


    **注释 3.2.** 估计的递归性是由状态的递归 [公式 \[3.26\]](#c03.xhtml#eqn26) 和连续马尔可夫属性 \[3.29\] 自然产生的。


    **注释 3.3.** 为了简单以及方便初学者，我们将 KF 的目标设定为递归 MMSE 估计，从而将最优搜索限制在直观的“类距离”或类几何二阶准则（见 3.14
    节）。几何路径跳过了基于条件概率密度的概率或贝叶斯呈现形式。概率推导需要冗长的介绍极大*后验*方法和正态条件概率 PDF 的详细属性，这将是以牺牲对 KF
    结构、行为和性能的直观快速理解为代价的。


    **注释 3.4.** 在概率（贝叶斯）方法和高斯假设下，估计相对于观测值和上一个估计的线性性是优化过程的结果。本章采用的基于 MMSE 的呈现需要说明估计的结构。此后限制在线性算子上，以便产生与概率推导完全相同的解。


