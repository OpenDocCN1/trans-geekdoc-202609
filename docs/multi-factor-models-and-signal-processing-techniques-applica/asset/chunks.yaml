    # **3.15. Highlights**


    This section gives a summary of the most important outcomes of the chapter dealing
    with LSE and KF.


    #### ***Least squares estimation (LSE)***


    LSE implicitly assumes that a linear regression holds between the returns, the
    factors, the alpha and the betas, across a certain observation window, (*t, h*)
    = {*l,* such that: *t* − *h* + 1 ≤ *l* ≤ *t*}; this regression is also called
    the LSE “block” measurement equation, it is as follows:


    [\[3.75\]](#c03.xhtml#eqn_75) ![image](images/img_10_135.jpg)


    The inputs of the LSE block regression are: the values of one specific return
    within the window ![image](images/Inline_136_13.jpg)and the factors contained
    in the \[*h, K* + 1\] “factor matrix”, ![image](images/Inline_136_14.jpg)with
    ![image](images/Inline_136_15.jpg)Factors are also named the regressors. The unknown
    or the parameters of the LSE regression are the alpha and betas that are assumed
    constant across the window. They filled up the column-vector *θ*[(*t*,*h*)] with
    *θ*′[(*t*,*h*)] = ![image](images/Inline_136_16.jpg)The residual of the LSE regression
    is *є*[(*t*,*h*)] with ![image](images/Inline_136_17.jpg)


    The LSE ![image](images/Inline_136_19.jpg)minimizes the (convex) square Euclidian
    norm of the difference between the measurement (return) vector r[(*t*,*h*)] and
    its linear approximation based on the factors, that is G[(*t*,*h*)] *ξ*. Assuming
    that the \[*h, K* + 1\] matrix G[(*t*,*h*)] is full rank, the LSE solution is
    unique and we have:


    \[3.76\] ![image](images/img_2_136.jpg)


    The LSE ![image](images/Inline_137_5.jpg)is an unbiased estimate of *θ*[(*t*,*h*)]
    but its variance may become large when the matrix (G′ G)[(*t*,*h*)] is ill conditioned.
    This happens if its minimum eigenvalue becomes too small. In this latter situation,
    the LSE has to be “regularized” to limit the magnitude of ![image](images/Inline_137_6.jpg)(this
    topic is addressed in Chapter 4). The term ![image](images/Inline_137_7.jpg)is
    the orthogonal projection of the return vector r[(*t*,*h*)] into the space spanned
    by the columns of the factor matrix G[(*t*,*h*)]. The LSE ![image](images/Inline_137_8.jpg)operates
    in a block processing fashion and is not recursive. It has thus limited tracking
    capabilities.


