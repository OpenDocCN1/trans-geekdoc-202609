    \[4.16\] ![images](images/img_12_146.jpg)


    \[4.17\] ![images](images/img_14_146.jpg)


    \[4.18\] ![images](images/img_16_146.jpg)


    \[4.19\] ![images](images/img_18_146.jpg)


    \[4.20\] ![images](images/img_20_146.jpg)


    Outlier estimation


    \[4.21\] ![images](images/img_23_146.jpg)


    [\[4.22\]](#c04.xhtml#equ4-22) ![images](images/img_1_147.jpg)


    \[4.23\] ![images](images/img_2_147.jpg)


    ![images](images/img_4_147.jpg)


    \[4.24\] ![images](images/img_5_147.jpg)


    [\[4.25\]](#c04.xhtml#equ4-25) ![images](images/img_7_147.jpg)


    [\[4.26\]](#c04.xhtml#equ4-26) ![images](images/img_9_147.jpg)


    \[4.27\] ![images](images/img_11_147.jpg)


    \[4.28\] ![images](images/img_13_147.jpg)


    [Equations \[4.12\]](#c04.xhtml#equ4_12)–[\[4.15\]](#c04.xhtml#equ4_15), [\[4.22\]](#c04.xhtml#equ4_22)
    and [\[4.25\]](#c04.xhtml#equ4_25)–[\[4.26\]](#c04.xhtml#equ4_26) are similar
    to the RKF recursive equations as RKF is a particular case of rgKF.


    The OD step \[4.18\] presented above is a classical non-Gaussian test. It allows
    for incorporating the recursive prediction and correction equations for the first
    two moments of the innovation process (mean and variance) and has thus the advantage
    of keeping the recursive property of the original KF.


    Parameter *α* of the hypothesis tests \[4.19\] and \[4.20\] is often around 3
    but may be chosen as an *α*\-quantile of the Gaussian distribution. For example,
    if we aim at detecting an outlier within a 1% confidence interval, then *α* is
    such that ![images](images/Inline_148_18.jpg)which is *α* = 2.5758 (such values
    can be found in the statistical tables like in \[FOR 10\]). The often used value
    of *α* = 3 corresponds to a double confidence interval of 0.13%.


    In the *l*¹\-regularization case ([equation \[4.22\]](#c04.xhtml#equ4_22)), and
    if an outlier is detected (if the OD-test *H*[1] (*α*) is verified), then the
    value for *δ* ranges from 0 to 2![images](images/Inline_149_2.jpg)In practice,
    *δ* should be close to 0 and will never tend to its upper bound, which is very
    generous. As shown in [Figure 4.1](#c04.xhtml#fig4_1), the smaller is *δ* and
    the less regularized is the quadratic form, which allows for estimating potential
    extreme values. On the contrary, a high value of *δ* reduces the outlier value
    to zero, extending therefore the support of the underlying distribution. The OD
    step bypasses the tricky problem of choosing a convenient value for the regularization
    parameter.


    In the *l*²\-regularization case, the estimated value for the outlier still depends
    on the chosen value for *δ*. The *l*²\-regularization is often preferred in the
    literature when closed-form expressions of \[4.23\] need to be derived (like in
    \[4.24\]) and to insure good mathematical properties such as a differentiable
    and continuous function. In this section, we are mainly interested in the *l*¹\-regularization
    because of the sparsity of the additive term *v*[*t*] that is supposed to represent
    spiky returns.


    ## **4.4.2.** ***rgKF performance***


    To demonstrate why rgKF should be applied in any case, this section discusses
    the performance of the rgKF-*l*¹ and *l*² on simulated data intentionally corrupted
    by sparse outliers. The simulated data are similar to the data presented in \[3.51\],
    that is a two-factor model (including the S&P500 Equity Index and the T-Bond 10y)
    and piecewise constant parameters *w*[*t*] and (1 − *w*[*t*]). The difference
    is that we use the end-of-month returns of the two factors in this example (instead
    of daily data) to match the sampling frequency of the Fung and Hsieh factors and
    the hedge fund returns used in the next section. Spikes are then intentionally
    added to the observations and are generated according to a Bernoulli– Gaussian
    process occurring at five random instant times in the time series. When occurring,
    the spikes are sampled from a Gaussian density of variance 0.25, which is approximately
    10 times higher than the average variance of the two factors (the average daily
    numbers of [Table 3.1](#c03.xhtml#tab3_1) times![images](images/Inline_150_2.jpg)–
    to get monthly equivalent numbers – compared to![images](images/Inline_150_3.jpg)give
    a ratio of around 10).


    [Figure 4.2](#c04.xhtml#fig4_2) illustrates and compares the performance of the
    KF and the rgKF, when an NG(3)-test is applied followed by, respectively, an *l*²\-and
    an *l*¹\-regularization. We set *δ*[*l*2] = 0.5 and *δ*[*l*1] = 0.01. Left-hand
    side graphs are for the non-spiky data and the right-hand side graphs are for
    the spiky data. The results are obvious: KF delivers the most reliable estimates
    when no outlier is added and the rgKF-*l*¹ results are very close to the KF results.
    When outliers appear, KF fails to track the parameters whereas rgKF shows good
    performance. As expected, rgKF-*l*² will depend on the fixed value of *δ*: when
    *δ* is small, then a too large set of data is considered as outlier; when *δ*
    increases, outliers are not regularized and perturb the estimation of the parameters.
    In this case, *δ*[*l*2] = 0.5 seemed to be a good intermediate trade-off and we
    decided to show only one example for the sake of clarity. On its side, rgKF-*l*¹
    does very well and is close to the KF results.


    In conclusion, rgKF-*l*¹ should be a substitute for any other method in estimating
    the dynamic parameters of factor models. Generally, we do not have so much *a
    priori* information about the presence of outliers. KF already exhibits better
    tracking abilities than sliding window ordinary least squares (SW-OLS) but it
    will always lead to spurious results if at least one outlier or extreme event
    occurs. If the outliers are not filtered from the recursive equations, then what
    should be considered as specific events might be considered as systematic events,
    which is obviously misleading.


    **[Figure 4.2.](#c04.xhtml#fig4-2)** *Performance of KF, rgKF-l*² *and rgKF-l*¹
    *on synthetic monthly returns using a two-factor model (S&P500 and US TBond 10y)
    and piecewise constant parameters (see model* \[3.51\] *applied on monthly returns).
    On the right-hand side graphs, spikes are randomly added in the observations.
    rgKF-l*¹ *is therefore the most adapted algorithm*


    ![images](images/img_2_150.jpg)


    # **4.5. Application to detect irregularities in hedge fund returns**


    The goal of our example is to explain the importance of removing outliers using
    rgKF algorithms. A multi-factor decomposition of the returns helps us to understand
    which part of the returns comes from the market and which part is specific (as
    shown in [Table 4.2](#c04.xhtml#tab4_2)). If outliers appear in the observations
    and if the model does not take them into account, then market exposure estimates
    can be totally spurious. rgKF algorithms avoid the contamination of these estimates
    by simply filtering outliers. In practice, portfolio managers may use multi-factor
    approaches to hedge one specific or all market risks. Bad estimates can lead to
    some inappropriate decisions being made concerning the optimal hedging portfolio.


    **[Table 4.2.](#c04.xhtml#tab4-2)** *Breakdown of asset returns and risks into
    systematic and idiosyncratic components.* Σ*[*f*] is the covariance matrix of
    the factors*


    ![images](images/img_5_151.jpg)'
