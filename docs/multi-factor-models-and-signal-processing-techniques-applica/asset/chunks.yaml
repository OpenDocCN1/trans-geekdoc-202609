    be interesting to track their impacts on the portfolio performance in the short
    term. Tactical portfolio allocation decisions rely on short-term portfolio manager’s
    forecasts of risk premia (bets on factors) and can, as a result, also be captured
    using a linear factor model, but with time-varying exposures. Since information
    arrives randomly, and tactical bets are assumed to be responses to new information,
    we expect the exposure to risk factors to evolve randomly over time. [Equation
    \[1.4\]](#c01.xhtml#eqn4) in this case becomes:


    ![images](images/img_3_32.jpg)


    where B[*t*] (respectively, *α*[*t*] ) denotes the time-varying exposure of assets
    to factors (respectively, alpha). Risk factor exposures are not directly observed
    and must be filtered from **r**[*t*].


    Let us consider the case of a portfolio of hedge funds (or fund of hedge funds).
    Hedge funds are used in the following chapters to give empirical illustrations.
    Although the trend is very clearly toward more transparency, investors do not
    systematically have access to the full composition of hedge funds, and their evolution
    over time. Fund of hedge fund managers themselves do not always have a complete
    view of the risk factor exposures of their underlying investments, and, as a result,
    of the bets they implicitly make. This is all the more true when the trading frequency
    of the underlying funds is significantly higher than their reporting frequency
    (i.e. embedded risks can be dramatically different from those shown at a specific
    date), or when the number and the diversity of positions make it difficult to
    come up with accurate aggregated factor exposures. Tactical bets explicitly (at
    the portfolio level) and implicitly (at the underlying level) made by the fund
    of hedge fund manager can alternatively add up or cancel each other. Using a return-based
    style analysis therefore allows us to mitigate one of the main shortcomings of
    holding-based approaches, by capturing and assessing both effects concomitantly.


    This example shows that this return-based style analysis must be done with time-varying
    parameter to filter from portfolio returns both long-term and short-term bets.


    ## **1.3.2.** ***Optimal portfolio allocation***


    Let us consider a portfolio of *N* risky assets whose returns are *r*[*i,t*]*,
    i* = 1*, …, N*, with *N* large. According to Markowitz’s \[MAR 52\] theory, optimal
    diversified portfolios are obtained by inverting the covariance matrix of asset
    returns Σ[r]. This matrix is unknown, and we have to estimate it from observations
    *r*[*i,t*]*, i* = 1*, …, N, t* = 1*, …, T* by using, for example, the empirical
    covariance matrix:


    ![images](images/img_3_33.jpg)


    where r[*t*] = \[*r*[1,t], …*, r*[*N,t*]\]′ is the vector of asset returns. If
    the dimension *t* is lower than *N*, then ![images](images/Inline_34_5.jpg)is
    not invertible, and the optimal Markovitz’s portfolios cannot be computed. Moreover,
    even in the case where *N* is lower than *T*, this empirical covariance matrix
    can have a determinant close to zero, and we can encounter numerical problems
    when trying to invert it with the usual algorithms. This is, in particular, the
    case when correlations between assets are high. Factor models can be used to manage
    these high correlations and therefore give an alternative to the direct numerical
    inversion approach.


    Let us develop these computations in the very simple case \[1.4\]. We assume in
    the following that the risk-free rate is set to zero and excess risky asset returns
    r[*t*] satisfy the following linear single risk factor model:


    ![images](images/img_7_33.jpg)


    where the unobserved single factor *f*[*t*] is assumed to be Gaussian ![images](images/Inline_34_9.jpg)and
    ![images](images/e.gif)[*i,t*]*, i* = 1*, …, N* have Gaussian distribution ![images](images/Inline_34_10.jpg).
    The expected excess return is IE(*r*[*i,t*]) = *b*[*i*] *m*[*f*] and the idiosyncratic
    risk ![images](images/Inline_34_11.jpg)The systematic source of risk (i.e. the
    unobserved single factor) creates an additional individual risk equal to ![images](images/Inline_35_2.jpg)but
    also a covariance between excess returns of two different assets:


    ![images](images/img_3_34.jpg)


    for *i* ≠ *j*. This covariance term can lead to correlation close to 1 when the
    systematic risk is high relative to the idiosyncratic risk. However, we can compute
    explicitly the mean-variance optimal allocation. The vector of efficient allocations
    in the *N* risky assets is indeed proportional to:


    ![images](images/img_5_34.jpg)


    where r[*t*] = \[*r*[1,t], …*, r*[*N,t*]\]′. Using the factor structure, we can
    explicit the two first moments of r[*t*] and get the following closed-form formula:


    ![images](images/img_7_34.jpg)


    where B = \[*b*[1], …*, b*[*N*] \]′. We then obtain the efficient allocation by
    estimating the parameters involved in the previous formula, without having to
    numerically invert the covariance matrix.


    In this example, the single factor is unobserved and then must be filtered from
    asset returns, or replaced by a proxy that is able to explain all the correlation
    structure observed between risky assets.


    # **1.4. How to build factor models?**


    ## **1.4.1.** ***Factor selection***


    The factor selection problem is not new in the financial literature. The main
    issue is related to the delicate balance between using too many or too few factors.
    On the one hand, adding too many factors lowers the regressors efficiency when
    we estimate factor exposures using [equation \[1.4\]](#c01.xhtml#eqn4). On the
    other hand, working with too few factors also has an important risk of missing
    the correlation structure observed between asset returns. This raises the question
    whether it is possible to build a factor selection methodology allowing us to
    consider only the appropriate factors.


    The first solution consists of using a predefined set of observable factors, already
    documented in the financial literature for their ability to explain the cross-section
    of asset returns. These factors are used to build long- and short-term benchmarks
    in the style analysis of section 1.3.1. They are also used to reduce the dimension
    of the covariance matrix, when optimal portfolio allocation must be computed for
    a large set of risky assets in section 1.3.2. If we miss some risk factors in
    the style analysis, both long- and short-term benchmarks are misspecified, and
    the portfolio manager’s added value is not correctly calculated. In particular,
    we can interpret positive risk-adjusted returns as a manager’s skills and omit
    an important risk exposure. In the portfolio allocation example, omitted factors
    imply residual correlations between idiosyncratic risk terms. As these correlations
    are not taken into account in the calculation of the optimal portfolio, we underestimate
    the portfolio risk or, in other words, we overestimate the diversification effect.


    A second solution is to use statistical approaches to filter from the asset returns
    distribution (and, in particular, the covariance matrix) unobservable factors
    that are able to explain the cross-section of asset returns. If this approach
    seems appealing to a statistical point of view, it has also many drawbacks from
    a financial point of view. First, it is, in general, difficult to give an economic
    interpretation of these statistical factors. Second, the factor representation
    is not unique, and any linear combination of a given set of factors defines an
    equivalent factor model. Third, the factor decomposition is, in general, time-varying
    and then difficult to interpret. Both approaches are described in detail in Chapter
    2.


    ## **1.4.2.** ***Parameters estimation***'
