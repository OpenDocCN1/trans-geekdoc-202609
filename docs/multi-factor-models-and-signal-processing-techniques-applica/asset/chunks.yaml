- raw: 'In the framework of tracking or estimating unobserved processes, usually solved
    with KF or one of its extensions, such exogenous outliers are referred to as *additive
    outliers* or *AOs* \[FOX 72, RUC 10\] and occur in the observation. Endogenous
    outliers that may affect the innovations of the state equation are called *innovative
    outliers* or *IOs* and are beyond the scope of this book. Recursive least squares
    can serve to deal with AOs applying a Huber weight function \[MAR 06\] to the
    innovation error in the KF recursive equation. We can also penalize the KF by
    introducing an *l*¹\- or *l*²\-regularization term. Regularization usually offers
    good results but requires the determination of the regularization parameter introduced
    to limit the amplitude of the solution. The search for the optimal regularization
    parameter has no ideal solution and each existing method (e.g. cross-validation,
    generalized cross-validation \[CRA 79\], maximum *a posteriori* estimation \[PAN
    11\], Bernouilli-Gaussian assumption or Markov Chain Monte Carlo (MCMC) methods
    \[AND 97\]) is relevant to the problem under study. Regularization is widely used
    in statistical signal processing (e.g. in basis pursuit, compressed sensing, signal
    recovery and wavelet thresholding), in statistics with ridge regressions and Least
    Absolute Shrinkage and Selection Operator (LASSO) algorithm or fused LASSO \[TIB
    96\] and is also very useful in decoding linear codes or geophysics problems.
    In finance, *l*¹\-regularization also applies in the context of portfolio optimization
    \[JAG 03, BRO 08, DEM 09\].


    In this chapter, we first discuss a robust Kalman filter (RKF) as presented in
    \[MAT 10\], whose performance depends on the value of the regularization parameter,
    and then propose an alternative methodology to the choice of the regularization
    parameter by introducing an outlier *detection* step in the recursive equations
    of the KF. Detecting first the presence of the outliers is equivalent to implicitly
    choosing the value of the regularization parameter and remains valid even if there
    is no outlier.


    This chapter is organized as follows: section 4.3 discusses the RKF as described
    in \[MAT 10\]. The family of *detection and estimation* algorithms that we introduce
    to handle exogenous outliers is discussed in section 4.4. Section 4.5 deals with
    the application of our algorithm to detect irregularities in hedge fund returns.


    # **4.2. Preamble: statistical evidence on the KF recursive equations**


    If we have a look to the recursive equations of the KF (summarized in the table
    below), we clearly realize that the observation *r*[*t*], the unknown and unobserved
    states *θ*[*t*] and the innovation are Gaussian processes. If a large error measurement
    (most often considered an outlier) occurs at *t*, the observation *r*[*t*] is
    then corrupted as well as the innovation term. It will yield to an erroneous correction
    for ![images](images/eqn1.gif)whereas the accuracy matrix S[t/t] and the Kalman
    gain z[*t*] will not be impacted. The error will spread along the recursions especially
    if the error variance is fixed.


    ![images](images/img_4_142.jpg)


    In such a case, the state-space model may be extended with an additional term
    in the observation equation, which will be taken into account in the recursive
    estimates. The following section describes how to deal with such an extended model
    and discusses the RKF (see \[MAT 10\]).


    # **4.3. Robust KF**


    ## **4.3.1.** ***RKF description***


    The setup of the RKF introduces an additional term in \[3.27\] to capture outliers
    that may appear in the observations. The extended state-space model is written
    as follows \[MAT 10\]:


    \[4.1\] ![images](images/img_2_143.jpg)


    \[4.2\] ![images](images/img_4_143.jpg)


    The basic assumptions are the same as for the state-space model \[3.27\] and *v*[*t*]
    is a stochastic impulse process, for example a Bernoulli–Gaussian process, suitable
    for modeling unknown sensor failures, measurement outliers or even intentional
    jamming. As with the standard KF (where *v*[*t*] = 0), the objective of the problem
    stated in \[4.1\] and \[4.2\] is to derive recursive estimate![images](images/Inline_144_7.jpg)of
    the unobservable parameter *θ*[*t*], given the measurement *r*[*t*] and the observed
    variables g[*t*] up to time *t*, based on the minimization of the mean-square
    error (MSE)![images](images/Inline_144_8.jpg).


    In the presence of the non-Gaussian outlier *v*[*t*], the optimum recursive estimate
    cannot be explicitly derived and moreover may be nonlinear. An elegant alternative
    consists of regularizing the KF quadratic cost function by adding a *l*^(*q*)
    -penalty (*l*¹ in RKF).


    The RKF algorithm consists of following steps:


    [\[4.3\]](#c04.xhtml#equ4-3) ![images](images/img_11_143.jpg)


    \[4.4\] ![images](images/img_13_143.jpg)


    \[4.5\] ![images](images/img_13_143b.jpg)


    \[4.6\] ![images](images/img_17_143.jpg)


    [\[4.7\]](#c04.xhtml#equ4-7) ![images](images/img_19_143.jpg)


    \[4.8\] ![images](images/img_21_143.jpg)


    Regularization ![images](images/Inline_144_8a.jpg)is a solution of min*[vt] C*(*v[t]
    ,δ*)


    [\[4.9\]](#c04.xhtml#equ4-9) ![images](images/img_2_144.jpg)


    with


    \[4.10\] ![images](images/img_5_144.jpg)


    \[4.11\] ![images](images/img_7_144.jpg)


    [Equations \[4.3\]](#c04.xhtml#equ4_3)–[\[4.7\]](#c04.xhtml#equ4_7) are similar
    to the KF recursive equations. [Equation \[4.9\]](#c04.xhtml#equ4_9) is referred
    to as a *regularized regression* and is equivalent to the LASSO setup \[TIB 96,
    OSB 00\]. Given an appropriate value of *δ*, minimizing *C*(*v*[*t*] *,δ*) is
    equivalent to both detecting and estimating *v*[*t*] . The *l*¹ -norm will reduce
    the value of *v*[*t*] to zero for high values of *δ* and consider a non-zero value
    of *v*[*t*] with a small value of *δ* (see [Figure 4.1](#c04.xhtml#fig4_1) for
    an illustration). Jointly detecting and estimating ![images](images/Inline_144_8a.jpg)depends
    therefore on the good choice of *δ*, which has to be tuned such that the sparsity
    of *v*[*t*] coincides with the sparsity seen through the observations. If the
    value of *δ* is inappropriate, then many false alarms are generated. In \[TIB
    96\], the author observes that the search for *δ* can be restricted to the range![images](images/Inline_145_10.jpg)In
    practice, the upper bound seems to be very generous \[SCH 05\], but it can be
    adaptive and specific to the observed variable.


    # **4.4. rgKF: the rgKF(NG,*l^q*)**


    ## **4.4.1.** ***rgKF description***


    Hereafter, we propose a family of algorithms called regularized Kalman filters
    or rgKF(OD, E-*l*^(*q*) ) that includes an outlier detection (OD) step followed
    by an *l*^(*q*) (*q* > 0) estimation step (E-*l*^(*q*) ). OD stands for the name
    of the detection method, for example if OD = *NG*(*α*), then a non-Gaussian deviation
    test is applied with a threshold extreme value *α*.


    **[Figure 4.1.](#c04.xhtml#fig4-1)** *Effect of the l*¹ *\-regularization term
    on the shape of a quadratic form to be minimized*


    ![images](images/img_3_145.jpg)


    In the following, we consider only *q* = 1, 2. RKF, which consists of a single
    and joint detection/estimation step, falls into the *l*¹\-regularization approach
    and is equivalent to rgKF(*l*¹, E-*l*¹). [Table 4.1](#c04.xhtml#tab4_1) summarizes
    these algorithms.


    The rgKF is a simple and efficient algorithm. Based on the fact that *v*[*t*]
    is an AO in the observations, it is obvious that the innovation![images](images/Inline_146_6.jpg)in
    \[4.5\] should contain *v[t]* if *v[t]* occurs at time *t*. Moreover, the observation
    error![images](images/Inline_146_8.jpg)is assumed to be a Gaussian random variable
    with a fixed variance![images](images/Inline_146_9.jpg). If *v*[*t*] occurs at
    time *t*, then![images](images/Inline_146_10.jpg)should not lie in the range space
