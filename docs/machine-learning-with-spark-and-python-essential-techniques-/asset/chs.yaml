  \ FN, 'TN = ', TN)\n> \n> TP = tpr[42] * P; FN = P - TP; FP = fpr[42] * N; TN =\
  \ N - FP\n> \n> print('\\nThreshold Value =   ', thresh[42])\n> print('TP = ', TP,\
  \ 'FP = ', FP)\n> print('FN = ', FN, 'TN = ', TN)\n> \n> Printed Output:\n> Best\
  \ Value of Misclassification Error =  0.22115384615384615\n> Best alpha for Misclassification\
  \ Error =  0.017686244720179392\n> \n> Best Value for AUC =  0.8686727965078481\n\
  > Best alpha for AUC   =   0.020334883589342524\n> \n> Confusion Matrices for Different\
  \ Threshold Values\n> \n> Threshold Value =    0.21560082129001007\n> TP =  61.00000000000001\
  \ FP =  11.0\n> FN =  49.99999999999999 TN =  86.0\n> \n> Threshold Value =    -0.09435189216167568\n\
  > TP =  89.0 FP =  23.0\n> FN =  22.0 TN =  74.0\n> \n> Threshold Value =    -0.3223693818719528\n\
  > TP =  100.0 FP =  40.0\n> FN =  11.0 TN =  57.0 \n> ```\n\n图 5.5 中的图表显示有多个点达到了相同的最小值。当你有选择时，一个好的做法是选择性能与\
  \ α 关系图中最左侧的点。这是因为右侧的点更倾向于过拟合。选择更靠左的解更为保守。这样部署时的错误与交叉验证中看到的错误匹配的几率会更大。\n\n![图 5.5：样本外分类器误分类性能](img/c05f005.png)\n\
  \n**图 5.5**：样本外分类器误分类性能\n\n衡量分类器性能的另一种方法是 AUC。AUC 的优势在于，在最大化 AUC 时，无论你打算在何处操作系统——无论你想要不同类型错误率大致相等，还是倾向于将错误偏向某一类型——你最终都能获得最佳性能。严格来说，最大化\
  \ AUC 并不能保证你在特定错误率下获得最优性能。对比由 AUC 选择的模型与通过最小化总体错误率选择的模型，并观察曲线的形状，有助于你对解决方案建立信心，并让你大致了解通过更彻底的优化还能获得多少性能提升。\n\
  \n\n\n\n清单 5-4 中展示的 AUC 计算使用了来自 `sklearn.metrics` 包的 `roc_curve` 和 `roc_auc_score`\
  \ 程序。生成 AUC 与 α 曲线的过程与误分类错误率的过程类似，不同之处在于将预测列和真实值传递给 `roc_auc_score` 程序以生成 AUC 数值。这些数值随后被绘制在图\
  \ 5.6 中。生成的曲线看起来大致像是倒置的误分类错误率曲线——之所以倒置，是因为 AUC 越大越好，而误分类错误率越小越好。清单 5-4 末尾的打印输出显示，基于误分类错误率的最优模型位置与基于\
  \ AUC 的最优模型位置并不完全相同，但两者相距不远。图 5.7 展示了使 AUC 最大化的分类器的 ROC 曲线。\n\n![Figure 5.6: Out-of-sample\
  \ classifier AUC performance](img/c05f006.png)\n\n**图 5.6**：样本外分类器 AUC 性能\n\n![Figure\
  \ 5.7: Receiver operating characteristic for best performing classifier](img/c05f007.png)\n\
  \n**图 5.7**：表现最佳分类器的接收者操作特征曲线\n\n在您的问题中，某些错误的代价可能比其他错误高昂，这会促使您希望将结果偏向代价较低的错误，远离代价高昂的错误。对于岩石与地雷的问题，将未爆地雷错误分类为岩石的代价，可能远高于将岩石错误分类为地雷的代价。\n\
  \n一种系统的处理方法是使用混淆矩阵，这在第 3 章中已有讨论。根据 `roc_curve` 程序的输出构建混淆矩阵相对容易。ROC 曲线上的点对应不同的阈值。点\
  \ (1,1) 对应阈值设置极低、以至于所有点都被分类为地雷的极端情况。这使得真正例率和假正例率均等于 1；分类器正确识别了所有正例，但也将所有负例都判断错误了。将阈值设得高于所有点则得到图表的另一端。要了解数据点如何在混淆矩阵的各个格子之间移动的详细情况，需要选取一些阈值并打印出结果。清单\
  \ 5-4 展示了从阈值范围的四分位数内部（即不包括端点）选取的三个阈值。设置较高的阈值会导致假正例少、假反例多。设置较低的阈值则表现相反。将阈值设在中间则能较为平衡地权衡这两类错误。\n\
  \n您可以通过为每种错误类型关联成本，并找到使总成本最小化的阈值，来获得最佳阈值。打印输出中的三个混淆矩阵可以作为该方法如何运作的示例。如果假正例和假反例的成本均为\
  \ 1 美元，中间的表格（对应阈值 -0.0455）给出的总成本为 46 美元，而较高阈值给出 68 美元，较低阈值给出 54 美元。然而，如果假正例成本为 10\
  \ 美元、假反例成本为 1 美元，较高阈值给出 113 美元，中间给出 226 美元，较低给出 504 美元。您可能希望以更细的粒度测试更多阈值。要使该方法正常工作，您需要将成本控制在合理的大致范围内，并确保正例和负例的百分比与您在实际案例中将看到的相匹配。岩石与地雷的示例是在实验室环境中设置的，可能无法代表港口中实际的岩石与地雷数量。通过过采样某一类别——即复制某一类别中的部分样本，使比例与您预期在部署中看到的相匹配——这很容易修正。\n\
  \n岩石与地雷训练集中的数据分布均衡。也就是说，正例和负例的数量大致相同。在某些数据集中，一类样本可能比另一类多得多。例如，互联网广告的点击次数仅占广告展示次数的一小部分（不足\
  \ 1%）。通过过度代表数量较少的样本，使比例更接近相等，您可能会获得更好的训练结果。您可以通过复制部分数量较少的案例，或移除部分数量较多的案例来实现这一点。\n\
  \n交叉验证能为您提供部署该系统时将看到的性能的可靠估计。如果交叉验证指示的性能不够好，您将不得不努力改进它。例如，您可以尝试在“多变量回归：预测葡萄酒口味”一节中使用的基扩展方法。您也可以检查产生最差错误的案例，看看能否辨别出某种模式，无论它们是数据录入错误，还是可以添加另一个变量来解释为何它们会被严重误判。如果误差满足您问题的需求，您将希望在整个数据集上训练一个模型用于部署。下一节将介绍该过程。\n\
  \n### 构建用于部署的岩石与地雷分类器\n\n与葡萄酒质量案例研究一样，下一步是在完整数据集上重新训练模型，并提取对应于最佳 alpha 的系数——即通过交叉验证估计的、使样本外误差最小化的那个\
  \ alpha。清单 5-5 展示了实现此过程的代码。\n\n#### 清单 5-5：在岩石与地雷数据上训练的 ElasticNet 系数轨迹——rocksVMinesCoefCurves.py\n\
  \n\n\n\n> ```\n> __author__ = 'mike_bowles'\n> \n> from Read_Fcns import list_read_rvm\n\
