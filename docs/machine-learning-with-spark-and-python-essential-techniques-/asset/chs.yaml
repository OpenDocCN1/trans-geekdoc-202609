  Listing 7-4 中的打印输出显示随机森林的 RMSE 误差为 2.07。这比梯度提升在经过少量调优后显示的结果要低。这两种方法之间可能几乎没有性能差异。它已经相当低了（0.06\
  \ ~ 3%）。这些差异对您可能很重要。另一方面，随机森林不需要大量调优，因此它能在更少的开发时间内得出答案。\n\n数据集中的属性之一是鲍鱼的性别。鲍鱼的性别有三种可能的值：雄性、雌性和幼体（尽管鲍鱼在幼年期性别不确定）。因此，性别属性是一个三值因子变量。在数据集中，性别属性是三个字符变量之一：`M`、`F`\
  \ 或 `I`。对该属性进行编码的程序部分以一个填充了两个浮点零的列表开始。如果属性值为 `M`，则第一个列表元素更改为 `1.0`。如果属性值为 `F`，则第二个列表元素更改为\
  \ `1.0`。否则，列表保留两个零（即属性值为 `I` 时）。然后，新的两元素列表替换旧的字符变量，并用于构建随机森林模型。\n\n### 评估性能和编码变量的重要性\n\
