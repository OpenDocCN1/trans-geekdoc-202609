  \n![Figure 2.22: Correlation heat map for the glass problem](img/c02f022.png)\n\n\
  **Figure 2.22**: 玻璃问题的相关性热力图\n\n## 使用 PySpark 理解大型数据集\n\n理解大型数据集与小型数据集的唯一区别在于大型数据集更大。为什么这会是个问题？首先，它们可能大到无法放入内存，甚至可能无法放入硬盘。这使得数据检查变得困难。`PySpark`\
  \ 正是为此而生。\n\n`PySpark` 基本上允许您将本章中看到的技术应用于真正的大型数据集。而且所需的代码非常简单。后台有大量复杂的活动来支撑其运行，但从数据科学家的角度来看，这相当直观。\n\
  \n将大型数据集放到计算集群上可能会带来一些麻烦。有多种方法可以完成此任务。亚马逊、谷歌、微软和 Databricks 等云计算供应商提供服务，使数据上传到云端并在\
  \ Spark 上运行变得更加容易。具体流程因供应商而异，并随着技术发展而变化。总体而言，这些流程正变得越来越易用。由于两个原因，目前如何上传数据的描述超出了本书的范围：存在多种依赖供应商的方法，且这些方法正在不断变化。\n\
  \n在后续示例中，您将看到数据集在云端启动并运行后如何进行机器学习。该方法是将您在 Python 中运行的数据集转换为 `PySpark` 数据集，然后使用 `PySpark`\
  \ 机器学习工具。\n\nListing 2-18 中的代码展示了如何使用 `PySpark` 生成与 Listings 2-11、2-14 和 2-16 中相同的统计摘要。即使数据集分布在多台计算机上，这些计算也会在整个数据集上进行。\n\
