  \ = None\n> maxFeat = 8 # 尝试调整\n> \n> num_iterations = 50 # 每次训练 10 棵额外的树，共 50 次\n\
  > trees_per_iteration\n> rocksVMinesRFModel = RandomForestClassifier(n_estimators=\n\
  > trees_per_iteration,  \n>                         max_depth=depth, \n>       \
  \                  max_features=maxFeat,\n>                         oob_score=False,\
  \ \n>                         random_state=531, \n>                         warm_start=True)\n\
  > \n> auc = [] # 累积 AUC 分数\n> \n> for iters in range(num_iterations):\n>   \n> \
  \    rocksVMinesRFModel.fit(xTrain,yTrain)\n>     rocksVMinesRFModel.n_estimators\
  \ += trees_per_iteration\n> \n>     # 在测试集上累积 AUC\n>     prediction = rocksVMinesRFModel.predict_proba(xTest)\n\
  >     aucCalc = roc_auc_score(yTest, prediction[:,1:2])\n>     auc.append(aucCalc)\n\
  > \n> print(\"AUC\" )\n> print(auc[-1])\n> \n> \n> # 绘制训练和测试误差与集成中树的数量的关系图\n> num_trees\
  \ = [i * trees_per_iteration for i in range(num_iterations)]\n> plt.plot(num_trees,\
  \ auc)\n> plt.xlabel('集成中树的数量')\n> plt.ylabel('ROC 曲线下面积 - AUC')\n> plt.title('随机森林的\
  \ AUC 性能')\n> #plt.ylim([0.0, 1.1*max(mseOob)])\n> plt.savefig('rvm_rf_auc_performance_v_num_trees.png',\
  \ dpi=500)\n> plt.show()\n> \n> # 绘制特征重要性\n> featureImportance = rocksVMinesRFModel.feature_importances_\n\
  > \n> # 按最大重要性归一化\n> featureImportance = featureImportance / featureImportance.max()\n\
  > \n> # 绘制前 30 个重要特征\n> idxSorted = np.argsort(featureImportance)[30:60]\n> idxTemp\
  \ = np.argsort(featureImportance)[::-1]\n> print(idxTemp)\n> barPos = np.arange(idxSorted.shape[0])\
  \ + .5\n> plt.barh(barPos, featureImportance[idxSorted], align='center')\n> plt.yticks(barPos,\
  \ rocksVMinesNames[idxSorted])\n> plt.xlabel('变量重要性')\n> plt.title('随机森林的变量重要性')\n\
  > plt.savefig('RVM_variable_importance_rf.png', dpi=500)\n> plt.show() \n> \n> #\
  \ 绘制最佳版本的 ROC 曲线\n> fpr, tpr, thresh = roc_curve(yTest, list(prediction[:,1:2]))\n\
  > ctClass = [i*0.01 for i in range(101)]\n> \n> plt.plot(fpr, tpr, linewidth=2)\n\
  > plt.plot(ctClass, ctClass, linestyle=':')\n> plt.xlabel('假正率')\n> plt.ylabel('真正率')\n\
  > plt.title('随机森林岩石与地雷 ROC 曲线')\n> plt.savefig('rocksVMines_roc_rf.png', dpi=500)\n\
  > plt.show()\n> \n> # 选取一些阈值并计算最佳预测的混淆矩阵\n> # 注意 GBM 预测值不在 (0, 1) 范围内\n> # 在第 25、50\
  \ 和 75 百分位处选取阈值\n> idx25 = int(len(thresh) * 0.25)\n> idx50 = int(len(thresh) *\
  \ 0.50)\n> idx75 = int(len(thresh) * 0.75)\n> \n> # 计算总点数、总正例和总负例\n> totalPts =\
  \ len(yTest)\n> P = sum(yTest)\n> N = totalPts - P\n> \n> print('')\n> print('不同阈值的混淆矩阵')\n\
  > \n> 打印输出：\n> AUC\n> 0.9452332657200812\n> \n> 不同阈值的混淆矩阵\n> \n> 阈值 =    0.724\n\
  > TP =  0.3492063492063492 FP =  0.015873015873015872\n> FN =  0.19047619047619047\
  \ TN =  0.4444444444444444\n> \n> 阈值 =    0.63\n> TP =  0.4603174603174603 FP =\
  \  0.031746031746031744\n> FN =  0.07936507936507936 TN =  0.42857142857142855\n\
  > \n> 阈值 =    0.516\n> TP =  0.5079365079365079 FP =  0.15873015873015872\n> FN\
  \ =  0.031746031746031744 TN =  0.30158730158730157 \n> ```\n\n### 确定随机森林分类器的性能\n\
  \n图 7.11 展示了 AUC 与树的数量的关系图。该图看起来与你之前见过的涉及均方误差或误分类误差的图是**倒置**的。对于均方误差和误分类误差，越小越好。对于\
  \ AUC，1.0 是完美的，0.5 是完全糟糕的。因此，对于 AUC，越大越好，你要寻找的不是图中的**谷底**，而是**峰值**。图 7.11 显示峰值出现在图的左侧。然而，由于随机森林仅减少方差而不会过拟合，该峰值可归因于随机波动。正如本章前面的一些回归问题一样，最佳模型选择是包含所有树的模型，其性能对应曲线最右侧的点。\n\
  \n![图 7.11：岩石与地雷模型中随机森林的变量重要性估计](img/c07f011.png)\n\n**图 7.11**：岩石与地雷模型中随机森林的变量重要性估计\n\
  \n![图 7.12：岩石与地雷模型中随机森林的变量重要性估计](img/c07f012.png)\n\n**图 7.12**：岩石与地雷模型中随机森林的变量重要性估计\n\
  \n图 7.12 绘制了随机森林地雷探测器中最重要的 30 个变量的重要性。地雷探测问题中的不同属性对应声纳信号的不同频率，因此对应不同的波长。如果让你为这个问题设计机器学习，你的下一步可能是确定这些变量对应的波长，并将这些波长与测试集和训练集中岩石和地雷的特征尺寸进行比较。这能帮助你建立对模型的信心和理解。\n\
  \n图 7.13 展示了随机森林实现的 ROC 曲线。模型获得了非常高的 AUC，ROC 曲线相应地也非常好。它虽然没有完全贴合左上角，但非常接近。\n\n![图\
  \ 7.13：随机森林岩石与地雷模型的接收者操作特征曲线 (ROC)](img/c07f013.png)\n\n**图 7.13**：随机森林岩石与地雷模型的接收者操作特征曲线\
  \ (ROC)\n\n## 使用 Python 集成方法解决多类分类问题\n\n`XGBoost` 中的梯度提升和随机森林包以及 Python `sklearn`\
  \ 库都能构建二分类和多类分类模型。这两类模型之间存在一些自然的差异。一是标签（`y`）取更多的值。梯度提升和随机森林包的讨论描述了指定标签的方式。对于具有 `nClass`\
  \ 个不同类别的分类问题，标签取从 0 到 `nClass – 1` 的整数值。类别数量的另一种体现是各种预测方法的输出。预测类别的预测方法生成与标签相同的整数值。预测概率的方法生成\
  \ `nClass` 个可能类别的概率。\n\n另一个明显不同的领域是性能指标的指定。误分类误差仍然适用，你将看到示例代码使用它来衡量样本外性能。当类别超过两个时，AUC\
  \ 的使用变得更加复杂，权衡不同错误类型也变得更具挑战性。\n\n### 处理类别不平衡\n\n\n\n\n本节代码将使用“使用 Python 梯度提升检测未爆地雷”和“构建随机森林模型检测未爆地雷”两节中应用的分类器，但需要针对玻璃数据进行调整。一个重要的区别是玻璃数据是不平衡的。“不平衡”意味着某些类别的样本数量明显多于其他类别。你将在代码清单中看到每种玻璃类型的样本数量。有些类型的样本相对较多（70\
  \ 多个），而有些类型的玻璃代表性不足。其中有一种类型仅有 9 个样本。\n\n类别不平衡有时会导致问题，因为对代表性不足的类别进行随机采样，可能导致样本中的比例与原始数据中的比例截然不同。例如，玻璃数据中某一类别仅有\
  \ 9 个样本。如果你想进行 10 折交叉验证，其中一个测试折叠将没有该类别的样本。为避免这些问题，代码采用了一种称为*分层采样*的过程。在此情况下，这意味着数据根据标签进行分离（分层），然后对每个组进行采样，以在每个类别内获得训练集和测试集。随后，将特定类别的训练集合并为一个训练集，其各类别比例与原始数据完全匹配。下一节中的梯度提升代码通过使用\
  \ `sklearn` 的 `StratifiedKFold` 包来实现这一点。随机森林代码则展示了如何自行构建分层。\n\n### 使用梯度提升对玻璃进行分类\n\
  \nListing 7-7 使用 `XGBoost` 构建模型对玻璃进行分类。这是一个多类分类问题。Listing 7-7 中的代码还展示了如何从多个不同的参数组合中构建网格搜索以寻找最佳参数值。网格搜索的基本思路是为若干参数选择一些值，然后遍历所有可能的组合以找到最佳组合。代码使用一个名为\
  \ `grid_dict` 的字典来存放被调整的参数。每个参数名作为键，字典为每个键保存一个值列表。随后，一个 `for` 循环遍历所有可能的值组合列表。代码展示了如何使用\
  \ Python 的 `itertools` 包从列表字典中生成组合列表。\n\n随着网格搜索迭代的进行，当发现表现更好的参数组合时，对应最佳性能的参数值会被更新。随后，使用最佳参数集重新训练模型，并打印训练性能和测试性能。Listing\
  \ 7-7 中演示的过程将帮助你自动化寻找最适合你问题的最佳模型的过程。\n\n#### Listing 7-7：构建梯度提升模型以区分不同类型的玻璃——glass_gbm.py\n\
  \n\n\n> ```\n> __author__ = 'mike_bowles'\n> \n> from math import sqrt, fabs, exp\n\
  > import matplotlib.pyplot as plt\n> from sklearn.metrics import roc_auc_score,\
  \ roc_curve, confusion_matrix\n> from sklearn.model_selection import StratifiedKFold\n\
  > import numpy as np\n> from Read_Fcns import list_read_glass\n> import xgboost\
  \ as xgb\n> from itertools import product\n> \n> # 读取玻璃数据\n> names, xNum, labels,\
  \ yOneVAll = list_read_glass()\n> \n> glassNames = np.array(['RI', 'Na', 'Mg', 'Al',\
  \ 'Si', 'K', 'Ca', 'Ba', 'Fe',\n>                        'Type'])\n> \n> # x 矩阵的行数和列数\n\
  > nrows = len(xNum)\n> ncols = len(xNum[1])\n> \n> # 标签为 1 到 7 的整数，没有 4 的样本。\n>\
  \ # gb 要求从 0 开始的连续整数\n> newLabels = []\n> labelSet = set(labels)\n> labelList =\
  \ list(labelSet)\n> labelList.sort()\n> nlabels = len(labelList)\n> for l in labels:\n\
  >     index = labelList.index(l)\n>     newLabels.append(index)\n> \n> X = np.array(xNum)\n\
  > y = np.array(newLabels)\n>   \n> # 类别分布：\n> # 旧标签     新标签     样本数量\n> # 1    \
  \          0               70\n> # 2              1               76\n> # 3    \
  \          2               17\n> # 5              3               13\n> # 6    \
  \          4               9\n> # 7              5               29\n> #\n> \n>\
  \ n_fold = 5\n> \n> # 由于某些类别样本较少，使用分层采样\n> # 分层采样产生的测试集类别概率与完整数据匹配\n> skf = StratifiedKFold(n_splits=n_fold)\n\
  > skf.get_n_splits(xNum, newLabels)\n> \n> \n> # 设置待搜索参数 - 两个示例\n> grid_dict = {'colsammple_bytree':\
  \ [0.5, 0.7, 1.0], \n>              'learning_rate':[0.1, 0.5, 1.0], \n>       \
  \       'max_depth':[3,4], \n>              'alpha':[0]}\n> grid_dict = {'colsammple_bytree':\
  \ [0.7], \n>              'learning_rate':[0.001], \n>              'max_depth':[3,4,5,6],\
  \ \n>              'alpha':[0]}\n> # 用于记录最佳值\n> best_test_err = 1.0\n> \n> # 使用\
  \ itertools product 函数进行简单的网格搜索\n> for colsample_bytree, learning_rate, max_depth,\
  \ alpha \\\n>              in list(product(*grid_dict.values())):\n> \n>     params\
  \ = {'objective':'multi:softmax', \n>               'num_class': 6, \n>        \
  \       'colsample_bytree': colsample_bytree,\n>               'subsample': 0.5,\n\
  >               'learning_rate': learning_rate, \n>               'n_estimators':\
  \ 300, \n>               'max_depth': max_depth, \n>               'alpha': alpha,\
  \ \n>               'verbosity':1}\n> \n>     clf_model = xgb.XGBClassifier(**params)\n\
  >     results_list = []\n>     for idx_train, idx_test in skf.split(X, y):\n>  \
  \   \n>         x_test = X[idx_test]\n>         y_test= y[idx_test] \n>        \
  \ x_train = X[idx_train]\n>         y_train = y[idx_train]\n>     \n>         clf_model.fit(x_train,\
  \ y_train, \n>                eval_set=[(x_train, y_train), (x_test, y_test)], \n\
  >                eval_metric='merror', \n>                verbose=False)\n>    \
  \     results_list.append(clf_model.evals_result())\n> \n>     train_err = [eval['validation_0']['merror']\
  \ for \\ \n>                           eval in results_list]\n>     test_err = [eval['validation_1']['merror']\
  \ for \\ \n>                           eval in results_list]\n> \n>     train_err_array\
  \ = np.array(train_err)\n>     test_err_array = np.array(test_err)\n> \n>     train_avg\
  \ = np.mean(train_err_array, axis = 0)\n>     test_avg = np.mean(test_err_array,\
  \ axis = 0)\n> \n>     print('colsample_bytree=', colsample_bytree, 'learning_rate=',\n\
  >           learning_rate, 'max_depth=',max_depth, \n>           'alpha=', alpha,\
  \ 'avg error=', np.amin(test_avg))\n>     \n>     if np.amin(test_avg) < best_test_err:\n\
  >         best_params = [colsample_bytree, learning_rate, max_depth, alpha]\n> \n\
  > # 使用最佳值重新训练\n> [colsample_bytree, learning_rate, max_depth, alpha] = best_params\
  \ \n> \n> params = {'objective':'multi:softmax', \n>          'num_class': 6, \n\
  >          'subsample': 0.5, \n>          'colsample_bytree': colsample_bytree,\n\
  >          'learning_rate': learning_rate, \n>          'n_estimators': 300,\n>\
  \          'max_depth': max_depth,  \n>          'alpha': alpha, \n>          'verbosity':1}\n\
  > \n> clf_model = xgb.XGBClassifier(**params)\n> results_list = []\n> for idx_train,\
  \ idx_test in skf.split(X, y):\n>     \n>     x_test = X[idx_test]\n>     y_test=\
  \ y[idx_test]\n>     x_train = X[idx_train]\n>     y_train = y[idx_train]\n>   \
  \   \n>     clf_model.fit(x_train, y_train, \n>                  eval_set=[(x_train,\
  \ y_train), (x_test, y_test)], \n>                  eval_metric='merror', verbose=False)\
  \ \n>     results_list.append(clf_model.evals_result())\n> \n> train_err = [eval['validation_0']['merror']\
  \ for eval in results_list]\n> test_err = [eval['validation_1']['merror'] for eval\
  \ in results_list]\n> \n> train_err_array = np.array(train_err)\n> test_err_array\
  \ = np.array(test_err)\n> \n> train_avg = np.mean(train_err_array, axis = 0)\n>\
  \ test_avg = np.mean(test_err_array, axis = 0)  \n>   \n> print('\\nFinal training\
  \ error', train_avg[-5:])\n> print('Final test error', test_avg[-5:])\n> \n> plt.plot(train_avg)\n\
  > plt.plot(test_avg)\n> plt.xlabel('Number of Trees in Ensemble')\n> plt.ylabel('Multiclass\
  \ Error')\n> plt.title('Train and Test Errors')\n> plt.savefig('glassXGB_train_test_merror.png',\
  \ dpi=500)\n> plt.show()\n> \n> 打印输出：\n> colsample_bytree= 0.7 learning_rate= 0.001\
  \ max_depth= 3 alpha= 0 avg\n>     error= 0.3361334\n> colsample_bytree= 0.7 learning_rate=\
  \ 0.001 max_depth= 4 alpha= 0 avg \n>     error= 0.3211646\n> colsample_bytree=\
  \ 0.7 learning_rate= 0.001 max_depth= 5 alpha= 0 avg \n>     error= 0.3115134\n\
  > colsample_bytree= 0.7 learning_rate= 0.001 max_depth= 6 alpha= 0 avg \n>     error=\
  \ 0.3115134\n> \n> 最佳参数下的性能：\n> Final train error [0.1086792 0.1086792 0.1074956\
  \ 0.1074956 0.1086652]\n> Final test error [0.3115134 0.3115134 0.3115134 0.3115134\
  \ 0.3115134] \n> ```\n\n值得注意的是，在 Listing 7-7 的搜索过程中，最佳参数选择包括了对参数`colsample_bytree`的搜索。该参数在代码清单中打印的优化过程中被固定为`0.7`，但你会看到`grid_dict`在清单中有两个不同的定义。只有第二个定义在程序执行时生效，但第一个版本作为前序运行。那个版本的`grid_dict`包含了`colsample_bytree`的一系列可能性。参数`colsample_bytree`控制着用于生长每棵树的特征随机采样。如果该参数设置为`1.0`，则使用所有特征。如果设置为`0.7`，则每次构建新树时随机选择\
  \ 70%的参数。这正逐渐接近随机森林基学习器，在随机森林中，每个分裂点都会随机选择一部分特征。在达到最佳性能模型的过程中，通常值得在某个阶段对这些参数进行一些实验。\n\
  \n### 确定梯度提升模型在玻璃分类上的性能\n\nFigure 7.14 展示了随着树被添加到集成中，梯度提升分类器性能如何提升。最佳性能出现在图表的最右端。这表明可能需要添加更多树，或者稍微增加学习率以提高性能。\n\
