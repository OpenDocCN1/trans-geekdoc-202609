  \ 50 百分位数）。矩形的顶部和底部分别标记了第 25 百分位数和第 75 百分位数。你可以将打印摘要中的数字与箱线图中的水平线进行比较以确认这一点。在箱体上方和下方，你会看到小的水平刻度，即所谓的须线。这些线绘制在箱体上方和下方\
  \ 1.4 倍四分位距的位置。四分位距是第 75 百分位数与第 25 百分位数之间的差值。换句话说，箱体顶部到上须线的距离是箱体高度的 1.4 倍。须线的 1.4\
  \ 倍间距是可调的；请参阅箱线图文档。你会注意到在某些情况下，须线比 1.4 倍间距更近。在这些情况下，数据值并未延伸至计算出的须线位置。在这些情况下，须线放置在最极端的数据点处。在其他情况下，数据延伸至计算出的须线位置相当远的距离之外。这些点可被视为异常值。\n\
  \n![图 2.9：鲍鱼数据集实数型属性的箱线图](img/c02f009.png)\n\n**图 2.9**：鲍鱼数据集实数型属性的箱线图\n\n图 2.9\
  \ 中的箱线图比打印数据更快、更直观地识别异常值，但 rings 属性（最右侧的箱线图）上的刻度导致其他属性被压缩（使其难以看清）。解决此问题的一种方法是直接移除较大刻度的属性。结果如图\
  \ 2.10 所示。但这种方法并不令人满意，因为它无法很好地实现自动化或扩展。\n\n![图 2.10：鲍鱼数据集实数型属性的箱线图](img/c02f010.png)\n\
  \n**图 2.10**：鲍鱼数据集实数型属性的箱线图\n\n清单 2-11 代码的最后一部分在绘制箱线图前对所有数据列进行了归一化。这里的*归一化*是指将每一列进行中心化和缩放，使得属性\
  \ 1 的一个单位意味着与属性 2 的一个单位相同的含义。数据科学中的许多算法和操作都需要这种类型的归一化。例如，K 均值聚类基于数据行之间的向量距离来构建簇。距离是通过将一个点减去另一个点并求平方来测量的。如果单位不同，数值距离也会不同。去杂货店的距离如果用英里衡量可以是\
  \ 1，如果用英尺衡量则是 5,280。清单 2-11 中所示的归一化将变量调整为均值为 0、标准差为 1。这是一种非常常见的归一化。归一化的计算利用了 `summary()`\
  \ 函数生成的数字。结果绘制在图 2.11 中。\n\n![图 2.11：归一化后的鲍鱼属性箱线图](img/c02f011.png)\n\n**图 2.11**：归一化后的鲍鱼属性箱线图\n\
  \n请注意，归一化为标准差 1.0 并不意味着所有数据都落在 -1.0 和 +1.0 之间。它或多或少地将箱体的下边缘和上边缘分别置于 -1.0 和 +1.0\
  \ 处，但大部分数据位于这些边界之外。\n\n### 回归问题的平行坐标图——可视化鲍鱼问题的变量关系\n\n下一步是了解属性之间以及属性与标签之间的关系。对于岩石与矿石数据，颜色编码的平行坐标图以图形方式描绘了这些关系。该方法需要一些修改才能适用于鲍鱼问题。岩石与矿石是一个分类问题。该问题的平行坐标图根据数据行的真实分类对代表数据行的线条进行颜色编码。这有助于可视化预测目标与预测变量之间的关系。鲍鱼问题是一个回归问题，因此此示例中的颜色编码需要是对应于较高或较低目标值的色调。要为真实值分配色调，真实值需要被压缩到区间\
  \ \\[0.0, 1.0\\] 内。清单 2-12 使用 pandas `summary()` 函数生成的最小值和最大值来实现这一点。图 2.12 显示了结果。\n\
  \n#### 清单 2-12：鲍鱼数据的平行坐标图 — abaloneParallelPlot.py\n\n```\n__author__ = 'mike_bowles'\n\
  \nfrom math import exp\nfrom Read_Fcns import pd_read_abalone\n\nabalone = pd_read_abalone()\n\
  \n#get summary to use for scaling\nsummary = abalone.describe()\nmin_rings = summary.iloc[3,7]\n\
  max_rings = summary.iloc[7,7]\nnrows = len(abalone.index)\n\nfor i in range(nrows):\n\
  \    #plot rows of data as if they were series data\n    data_row = abalone.iloc[i,1:8]\n\
  \    label_color = (abalone.iloc[i,8] - min_rings) / (max_rings - \\\n        min_rings)\n\
  \    data_row.plot(color=plt.cm.RdYlBu(label_color), alpha=0.5)\n\nplt.xlabel(\"\
  Attribute Index\")\nplt.ylabel((\"Attribute Values\"))\nplt.show()\n\n#renormalize\
  \ using mean and standard variation, then compress\n# with logit function\n\nmean_rings\
  \ = summary.iloc[1,7]\nsd_rings = summary.iloc[2,7]\n\nfor i in range(nrows):\n\
  \    #plot rows of data as if they were series data\n    data_row = abalone.iloc[i,1:8]\n\
  \    norm_target = (abalone.iloc[i,8] - mean_rings)/sd_rings\n    label_color =\
  \ 1.0/(1.0 + exp(-norm_target))\n    data_row.plot(color=plt.cm.RdYlBu(label_color),\
  \ alpha=0.5) \n\nplt.xlabel(\"Attribute Index\")\nplt.ylabel((\"Attribute Values\"\
  ))\nplt.show() \n```\n\n![图 2.12：鲍鱼数据的颜色编码平行坐标图](img/c02f012.png)\n\n**图 2.12**：鲍鱼数据的颜色编码平行坐标图\n\
  \n图 2.12 中的平行坐标图展示了鲍鱼年龄（贝壳环数）与用于预测年龄的可用属性之间的直接关系。生成此图所用的颜色刻度范围从非常深的红褐色，经过较浅的色调、黄色、浅蓝色，到非常深的蓝色。图\
  \ 2.11 中的箱线图显示，最大值和最小值与大部分数据相距甚远。这产生了压缩刻度的效果，使大部分数据在颜色刻度上处于中间范围。尽管如此，图 2.12 表明每个属性与每个样本测得的环数之间存在显著相关性。相似的色调在多个属性的相似值处聚集在一起。这种相关性表明你将能够构建一个准确的预测模型。与属性和目标之间总体有利的相关性相反，一些淡蓝色的线条混杂在图表较深橙色区域中，表明存在一些难以正确预测的样本。\n\
  \n\n\n更改颜色映射有助于在不同目标值层级上可视化关系。Listing 2-11 代码的最后一部分使用了你在箱线图中看到的归一化方法。这种归一化并不能使所有值都适配在\
  \ 0 和 1 之间。首先，生成的值包含同样多的负值和正值。Listing 2-11 中的程序采用 logit 变换将值映射到 (0, 1) 区间。logit\
  \ 变换由 Equation 2.5 所示表达式给出。该函数的图形如 Figure 2.13 所示。\n\n![Figure 2.13: Graph of the\
  \ logit function (logitCurve.png)](img/c02f013.png)\n\n**Figure 2.13**: Graph of\
  \ the logit function (logitCurve.png)\n\n![Equation 2.5: Using logit transform for\
  \ soft range compression](img/c02-disp-0005.png)\n\n**Equation 2.5**: Using logit\
  \ transform for soft range compression\n\n该函数的图形如 Figure 2.13 所示。正如你所见，logit 变换将大负值映射到\
  \ 0（近似），大正值映射到 1（近似）；将 0 映射到 0.5。你将在 Chapter 4 中再次看到 logit 函数，它在将线性函数关联到概率方面起着关键作用。\n\
  \nFigure 2.14 展示了这些步骤的结果。这些变换使得可用的完整色彩范围得到了更好的利用。请注意，在较浅蓝色的示例中混杂着几条较深的蓝色线（对应环数较多的样本），甚至在\
  \ Whole Weight 和 Shucked Weight 区域的图表中出现了黄色和浅红色的样本。这表明这些属性可能不足以正确预测老年样本的年龄（环数）。幸运的是，其他一些属性（Diameter\
  \ 和 Shell Weight）能更好地正确排序深蓝色线条。这些观察结果在后续分析预测误差时将大有裨益。\n\n![Figure 2.14: Parallel\
  \ coordinate plot for the abalone data](img/c02f014.png)\n\n**Figure 2.14**: Parallel\
  \ coordinate plot for the abalone data\n\n### How to Use a Correlation Heat Map\
  \ for Regression—Visualize Pair-Wise Correlations for the Abalone Problem\n\n最后一步是查看各属性之间以及属性与目标之间的相关性。Listing\
  \ 2-13 展示了生成鲍鱼数据相关性热力图和相关性矩阵的代码。这些计算遵循了针对岩石与地雷数据所概述的相同方法，但有一个重要区别：因为鲍鱼问题要求进行实数预测，相关性计算可以在相关性矩阵中包含目标变量。\n\
  \n#### Listing 2-13: Correlation Calculations for the Abalone Data — abaloneCorrHeat.py\n\
  \n```\n__author__ = 'mike_bowles'\n\nabalone = pd_read_abalone()\n\n#calculate correlation\
  \ matrix\ncorr_mat = DataFrame(abalone.iloc[:,1:9].corr())\n#print correlation matrix\n\
  print(corr_mat)\n   \n#visualize correlations using heatmap\nplt.pcolor(corr_mat)\n\
  plt.show()\nPrinted Output:  \n   \n                 Length  Diameter    Height\
