  \ before sampling  = ', abalone_sp_df.count())\n> abalone_smaller = abalone_sp_df.sample(0.5)\n\
  > print('Number of rows after sampling   = ', abalone_smaller.count())\n> \n> Printed\
  \ Output:\n> Number of rows before sampling  =  4177\n> Number of rows after sampling\
  \   =  2058 \n> ```\n\n任何数据集都可以被采样，并对样本进行检查、绘图、热力图绘制等。自然而然的问题是这些样本是否具有代表性。通过抽取多个样本，您可以对此有所了解。\n\
  \n## 摘要\n\n本章向您介绍了几种深入研究新数据集的工具，帮助您理解如何着手构建预测模型。这些工具从简单地了解数据集的大小和形状、确定属性和标签的类型开始。关于数据集的这些事实将帮助您规划数据预处理和预测模型训练的路径。本章还涵盖了几种不同的统计研究，可帮助您了解数据集。这些包括简单的描述性统计（均值、方差和分位数）以及二阶统计，如属性之间的相关性、属性与标签之间的相关性。属性与二元标签的相关性需要一些不同于实数（回归标签）的技术。本章还介绍了几种可视化技术。一种是\
  \ Q-Q 图，用于直观显示数据中的异常值行为。另一种是平行坐标图，用于直观显示属性与标签之间的关系。所有这些都应用于本书其余部分中用于演示所涵盖算法并进行比较的问题。\n\
  \n## 参考文献\n\n1.  Gorman, R. P. , and Sejnowski, T. J. (1988). UCI Machine Learning\
  \ Repository. `https://archive.ics.uci.edu/ml/datasets/Connectionist+Bench+%28Sonar%2C+Mines+vs.+Rocks%29`.\
  \ Irvine, CA: University of California, School of Information and Computer Science.\n\
  \n# 第 3 章：预测模型构建：平衡性能、复杂性与大数据\n\n本章讨论影响机器学习模型性能的因素。本章为不同类型的机器学习问题中*性能*提供了技术定义。例如，在电子商务应用中，良好的性能可能意味着返回正确的搜索结果或展示网站访问者经常点击的广告；在遗传学问题中，可能意味着分离出导致遗传性疾病的少数基因。本章描述了针对这些不同问题的相关性能度量。\n\
  \n选择和拟合预测算法的目标是实现最佳可能性能。实现性能目标涉及三个因素：问题的复杂性、所采用预测模型的复杂性，以及可用数据的数量和丰富度。\n\n\n\n\n\
  在本章中，你将了解到：在复杂问题上实现高性能需要复杂的模型，但复杂的模型需要大量、丰富的数据集来进行充分训练。当你的问题不太复杂，或者可用数据不多时，一个不太复杂的模型将是最佳选择。这个过程涉及两件事。首先，你需要复杂度易于调整的模型；其次，你需要一种衡量其性能的方法。本章将针对一些特定示例讨论这两件事，并特别关注性能度量。后续章节将更详细地介绍特定的预测模型。\n\
  \n本章包含一些可视化示例，演示问题与模型复杂性之间的关系，随后提供用于设计和开发的技术指南。\n\n## 基本问题：理解函数逼近\n\n本书涵盖的算法解决一类特定的预测问题。这类问题的问题陈述包含两类变量：\n\
  \n*   你试图预测的变量（例如，网站访问者是否会点击广告）\n*   可用于进行预测的其他变量（例如，访问者的人口统计特征或在网站上的过往行为）\n\n这类问题被称为\
  \ `function approximation problems`（函数逼近问题），因为目标是构建一个模型，根据第二类变量生成对第一类变量的预测，即将其作为第二类变量的函数。\n\
  \n在函数逼近问题中，设计者从一组已知正确答案的历史示例入手。例如，历史网络日志文件会指示访问者在看到广告时是否点击了该广告。数据科学家接下来必须寻找可用于构建预测模型的其他数据。例如，为了预测网站访问者是否会点击广告，数据科学家可能会尝试使用访问者在看到广告前浏览的其他页面。如果用户在网站上注册过，过去的购买记录或浏览页面数据可能可用于进行预测。\n\
  \n被预测的变量有许多不同的名称，如 `target`（目标）、`label`（标签）和 `outcome`（结果）。用于进行预测的变量有各种称呼，如 `predictors`（预测变量）、`regressors`（回归变量）、`features`（特征）和\
  \ `attributes`（属性）。本书中这些术语交替使用，这在一般实践中也是如此。确定用于预测的属性被称为 `feature engineering`（特征工程）。数据清洗和特征工程占据了数据科学家\
  \ 80% 到 90% 的时间。\n\n特征工程通常需要一个手动的、迭代的过程来选择特征、确定最佳潜力并尝试不同的特征组合。本书涵盖的算法为每个属性分配数值重要性值。这些值指示属性在进行预测中的相对重要性。该信息有助于加快特征工程过程。\n\
  \n### 处理训练数据\n\n数据科学家从训练集开始算法开发。训练集由结果示例和数据科学家选择的特征集组成。训练集包含两类数据：\n\n*   你想要预测的结果\n\
  *   可用于进行预测的特征\n\n表 3.1 提供了一个训练集示例。最左列包含结果（网站访问者是否点击了链接）以及用于预测访问者将来是否会点击链接的特征。\n\
  \n**表 3.1**：示例训练集\n\n| 结果：点击了链接 | 特征 1：性别 | 特征 2：在网站上的花费 | 特征 3：年龄 |\n| --- | ---\
  \ | --- | --- |\n| 是 | M | 0 | 25 |\n| 否 | F | 250 | 32 |\n| 是 | F | 12 | 17 |\n\
  \n预测变量值（即特征、属性等）可以按矩阵形式排列（参见 公式 3.1）。本书使用的符号约定如下。预测变量表将称为 `X`，其形式如下：\n\n![公式 3.1：预测变量集的符号](img/c03-disp-0001.png)\n\
  \n**公式 3.1**：预测变量集的符号\n\n参考 表 3.1 中的数据集，`x_11` 为 M（性别），`x_12` 为 0.00（在网站上的花费），`x_21`\
  \ 为 F（性别），依此类推。\n\n有时为了方便，需要引用某个特定示例的所有属性值。为此，`x_i`（带单个索引）将指代 `X` 的第 *i* 行。对于 表\
  \ 3.1 中的数据集，`x_2` 将是一个包含值 F、250、32 的行向量。\n\n严格来说，`X` 不是一个矩阵，因为预测变量可能并非都是同一类型的变量。一个合规的矩阵包含类型完全相同的变量。然而，预测变量有不同的类型。以预测广告点击为例，预测变量可能包括网站访问者的人口统计数据。这些数据可能包括婚姻状况和年收入等。年收入是实数，而婚姻状况是分类变量。这意味着婚姻状况不支持加法或乘法等算术运算，且\
  \ `single`（未婚）、`married`（已婚）和 `divorced`（离婚）之间不存在序关系。`X` 中某一列的条目类型相同，但类型可能因列而异。\n\
  \n婚姻状况、性别或居住州等属性有几种不同的称呼。它们可能被称为 `factor`（因子）或 `categorical`（分类）。用数字表示的年龄或收入等属性被称为\
  \ `numeric`（数值型）或 `real-valued`（实值型）。这两类属性的区别很重要，因为某些算法可能无法处理其中一类。例如，线性方法（包括本书涵盖的方法）要求属性为数值型。你将看到的\
  \ PySpark 算法要求所有特征均为数值型。第 4 章“惩罚线性回归”涵盖线性方法，将展示将分类变量转换（或编码）为数值型以便将线性方法应用于包含分类变量的问题的方法。你还将学习使用\
  \ PySpark 函数将分类变量编码为数值型。\n\n与 `X` 中每一行对应的目标值排列成一个列向量 `Y`（参见 公式 3.2），如下所示：\n\n![公式\
  \ 3.2：目标向量的符号](img/c03-disp-0002.png)\n\n**公式 3.2**：目标向量的符号\n\n\n\n目标 $y_i$ 对应于\
  \ $x_i$——即 X 的第 *i* 行中的预测变量。参考表 3.1 中的数据，$y_1$ 为 Yes，$y_2$ 为 No。\n\n目标可以有几种不同的形式。例如，它们可以是实数，就像目标是预测客户将花费多少钱时那样。当目标为实数时，该问题称为*回归问题*。线性回归意味着使用线性方法来解决回归问题。（本书涵盖了线性和非线性回归方法。）\n\
  \n如果目标是双值的，如表 3.1 所示，该问题称为*二分类问题*。预测客户是否会点击广告就是一个二分类问题。如果目标包含若干个离散值，则该问题为*多分类问题*。预测客户会点击几个广告中的哪一个将是一个多分类问题。\n\
  \n基本问题是找到一个预测函数 `pred()`，它利用属性来预测结果（参见公式 3.3）：\n\n![Equation 3.3: Basic equation\
  \ for making predictions](img/c03-disp-0003.png)\n\n**公式 3.3**：进行预测的基本方程\n\n函数 `pred()`\
  \ 使用属性 $x_i$ 来预测 $y_i$。本书介绍了一些用于生成函数 `pred()` 的当前最佳方法。这些算法可在各种平台上使用。在本书中，你将看到如何在\
  \ Python 和 PySpark 中使用它们。如果你需要用另一种语言实现它们，你获得的理解将同样适用。\n\n### 评估预测模型的性能\n\n良好的性能意味着利用属性\
  \ $x_i$ 生成的预测接近 $y_i$，但“接近”在不同问题中有不同的含义。对于 $y_i$ 为实数的回归问题，性能通过均方误差 (MSE) 或平均绝对误差\
  \ (MAE) 等指标来衡量（参见公式 3.4）：\n\n![Equation 3.4: Performance measure for a regression\
  \ problem](img/c03-disp-0004.png)\n\n**公式 3.4**：回归问题的性能度量\n\n在回归问题中，目标（$y_i$ 和 $x_i$\
  \ 均为实数），因此将误差描述为它们之间的数值差异是合理的。公式 3.4 中的 MSE 对误差进行平方并对数据集求平均，以得出总体误差水平的度量。MAE 对误差的绝对值求平均（参见公式\
  \ 3.5），而不是对误差的平方求平均。\n\n![Equation 3.5: Another performance measure for regression](img/c03-disp-0005.png)\n\
  \n**公式 3.5**：回归的另一种性能度量\n\n如果问题是分类问题，则必须使用其他一些性能度量。最常用的之一是误分类误差——即函数 `pred()` 预测错误的样本所占的比例。“不同类型问题的性能度量”一节展示了如何计算误分类率。\n\
  \n为了使我们的函数 `pred()` 在预测中发挥作用，必须有某种方法来预测它在新样本到达时将产生什么水平的误差。在新数据上——即未参与开发函数 `pred()`\
  \ 的数据——性能如何？本章介绍了估算新数据性能的最佳方法。\n\n本节介绍了本书将要解决的基本预测问题类型，并描述了构建这些预测模型等同于构建一个将属性（或特征）映射到预测结果的函数。它还概述了如何评估这些预测中的误差。执行这些步骤会导致几个复杂问题。本章剩余部分将描述这些复杂问题、如何应对它们，以及在问题约束和可用数据条件下如何得出最佳模型。\n\
  \n## 驱动算法选择和性能的因素——复杂性与数据\n\n有几个因素会影响预测算法的整体性能。这些因素包括问题的复杂性、所用模型的复杂性以及可用训练数据的数量。以下各节描述了这些因素如何相互关联以决定性能。\n\
  \n### 简单问题与复杂问题的对比\n\n本章前一节描述了量化性能的几种方法，并强调了新数据性能的重要性。设计预测模型的目标是在新样本（如您网站的新访客）上做出准确预测。作为一名实践数据科学家，您会希望获得算法性能的估计，以便设定客户预期并比较不同算法。预测建模的最佳实践要求您从训练集中保留一些数据。这些保留的样本具有相关标签，可以与在剩余数据上训练的模型产生的预测进行比较。统计学家将此技术称为*样本外误差*，因为它是未用于训练的数据上的误差。（本章后面的“测量预测模型的性能”一节将更详细地介绍此过程的机制。）重要的是，唯一算数的性能是模型在针对新样本运行时的性能。\n\
  \n\n\n### 影响性能的因素：问题复杂度与数据规模\n\n影响性能的因素之一是待解决问题的复杂度。图 3.1 展示了一个二维空间中相对简单的分类问题。图中有两组点：深色点和浅色点。深色点随机抽样自以\
  \ (1,0) 为中心、两个维度方差均为 1 的二维高斯分布。浅色点同样抽样自方差相同但以 (0,1) 为中心的高斯分布。该问题的属性是图中的两个坐标轴：$x_1$\
  \ 和 $x_2$。分类任务是在 $x_1$, $x_2$ 平面上划定边界，将浅色点与深色点分开。在这种情况下，最好的做法是在图中画一条 45 度线——即 $x_1$\
  \ 等于 $x_2$ 的那条线。从精确的概率意义上讲，这是该问题的最优分类器。因为一条直线就能最好地分开浅色和深色点，所以线性分类器的表现将不亚于非线性分类器。本书介绍的线性方法能完美解决此问题。\n\
  \n![Figure 3.1: A simple classification problem](img/c03f001.png)\n\n**图 3.1**：一个简单的分类问题\n\
  \n图 3.2 描绘了一个更复杂的问题。图 3.2 中的点是通过随机抽样生成的。与生成 图 3.1 的随机抽样过程的主要区别在于，图 3.2 中的点是从多个分布中抽取的：浅色点来自几个分布，深色点来自另外几个不同的分布。这被称为*混合模型*。总体目标基本相同：在\
  \ $x_1$, $x_2$ 平面上划定边界以分开浅色点和深色点。然而在 图 3.2 中，显然线性边界无法像曲线那样很好地分离这些点。第 6 章“集成方法”中介绍的集成方法能很好地解决此问题。\n\
  \n![Figure 3.2: A complicated classification problem](img/c03f002.png)\n\n**图 3.2**：一个复杂的分类问题\n\
  \n然而，决策边界的复杂度并非影响线性或非线性方法性能优劣的唯一因素。另一个重要因素是数据集的大小。图 3.3 说明了这一性能要素。图 3.3 中绘制的点是 图\
  \ 3.2 中数据的 1% 子样本。\n\n在 图 3.2 中，数据量足以直观呈现分隔浅色和深色点集的曲线边界。数据减少时，这些点集在视觉上不易辨别，此时线性模型的表现可能等同于或优于非线性模型。数据越少，边界越难以可视化，也越难以计算。这直观地演示了拥有大量数据的价值。如果底层问题复杂（例如为个别购物者个性化响应），复杂模型配合大量数据可产出准确结果。但如果模型不复杂（如\
  \ 图 3.1 所示），或数据不足（如 图 3.3 所示），线性模型可能给出最佳答案。\n\n![Figure 3.3: A complicated classification\
  \ problem without much data](img/c03f003.png)\n\n**图 3.3**：数据稀疏时的复杂分类问题\n\n### 简单模型与复杂模型的对比\n\
  \n上一节通过可视化对比了简单问题与复杂问题。本节描述用于解决这些问题的各类模型有何不同。直觉上认为复杂模型应拟合复杂问题，但上一节的可视化示例表明，数据集大小可能决定简单模型在复杂问题上的拟合效果优于复杂模型。\n\
  \n另一个重要概念是：现代机器学习算法生成的是模型族，而非单一模型。本书涵盖的算法每个都能生成成百上千个不同复杂度的模型。总体而言，第 6 章介绍的集成方法产出的模型比\
  \ 第 4 章的线性方法更复杂，但这两类方法都会生成不同复杂度的多个模型。（这一点将在详细讲解线性技术的 第 4 章 和集成技术的 第 6 章 中变得更清晰。）\n\
  \n图 3.4 展示了拟合上一节简单问题的线性模型。图 3.4 中的线性模型由 `glmnet` 算法生成（详见 第 4 章）。该线性模型大致将数据对半分开。图中的直线由\
  \ 公式 3.6 给出。\n\n![Figure 3.4: Linear model fit to simple data](img/c03f004.png)\n\
  \n**图 3.4**：拟合简单数据的线性模型\n\n![Equation 3.6: Linear model fit to simple problem](img/c03-disp-0006.png)\n\
  \n**公式 3.6**：拟合简单问题的线性模型\n\n这条线非常接近 $x_2$ 等于 $x_1$ 的直线，从概率意义上讲这是最优边界。从视觉直觉上看，该边界也很合理。对这个简单问题拟合更复杂的模型不会提升性能。\n\
  \n\n\n一个具有更复杂决策边界的更复杂问题，为复杂模型提供了超越简单线性模型的机会。图 3.5 展示了拟合非线性决策边界数据的线性模型。在这种情况下，线性模型会将本应为浅色的区域误分类为深色，反之亦然。\n\
  \n![Figure 3.5: Linear model fit to complex data](img/c03f005.png)\n\n**图 3.5**：拟合复杂数据的线性模型\n\
  \n图 3.6 展示了复杂模型处理复杂数据时能好到什么程度。用于生成此决策边界的模型是一个集成（集合），包含 1,000 棵使用梯度提升算法构建的二元决策树。（梯度提升决策树将在第\
  \ 6 章中详细介绍。）非线性决策边界曲线被用来更好地划分深色点更密集的区域和浅色点更密集的区域。\n\n人们很容易得出结论：最佳方法是对复杂问题使用复杂模型，对简单问题使用简单模型。但是，你必须考虑问题的另一个维度。正如上一节所述，你必须考虑数据集大小。图\
  \ 3.7 和 3.8 展示了来自一个复杂问题的 1% 数据。图 3.7 展示了拟合该数据的线性模型，图 3.8 展示了拟合该数据的集成模型。数一下被误分类的点数。数据集中有\
  \ 100 个点。图 3.7 中的线性模型误分类了 11 个点，误分类率为 11%。复杂模型误分类了 8 个，误分类率为 8%。它们的性能大致相当。\n\n![Figure\
  \ 3.6: Ensemble model fit to complex data](img/c03f006.png)\n\n**图 3.6**：拟合复杂数据的集成模型\n\
  \n![Figure 3.7: Linear model fit to small sample of complex data](img/c03f007.png)\n\
  \n**图 3.7**：拟合复杂数据小样本的线性模型\n\n![Figure 3.8: Ensemble model fit to small sample of\
  \ complex data](img/c03f008.png)\n\n**图 3.8**：拟合复杂数据小样本的集成模型\n\n#### 驱动预测算法性能的因素\n\
  \n这些结果解释了人们对大数据量的热情。对复杂问题进行准确预测需要大量数据。但数据量并不是一个足够精确的衡量标准。数据的形状也很重要。\n\n公式 3.1 将预测变量数据描述为一个矩阵，具有若干行（高度）和若干列（宽度）。矩阵中的条目数是行数与列数的乘积。当数据用于预测建模时，行数和列数之间存在一个重要区别。增加一列意味着增加一个新属性。增加一行意味着获得现有属性的一个额外历史样本。为了理解新行的影响与新列的影响有何不同，请考虑一个将公式\
  \ 3.1 中的属性与公式 3.2 中的标签相关联的线性模型。\n\n假设一个以下形式的模型（见公式 3.7）：\n\n![Equation 3.7: Linear\
  \ relation between attributes and outcomes](img/c03-disp-0007.png)\n\n**公式 3.7**：属性与结果之间的线性关系\n\
  \n此处，`xi` 是一行属性，是待确定的系数列向量。向属性矩阵增加一列会增加一个需要确定的系数。这个增加的系数也称为 `自由度`。增加另一个自由度意味着使模型更复杂。前面的例子表明，使模型更复杂需要更多数据。因此，通常从行数与列数的比率——即纵横比——来思考问题。生物数据集和自然语言处理数据集就是例子，它们之所以很大是因为拥有大量列，但有时它们不够大，无法让复杂建模方法发挥良好性能。在生物学中，基因组数据集可以轻松包含\
  \ 10,000 到 50,000 个属性。即使有数万个单独实验（数据行），基因组数据集可能也不足以训练复杂的集成模型。线性模型可能给出同等或更好的性能。基因组数据成本高昂。一个实验（行）的成本可能高达\
  \ 5,000 美元，使得完整数据集的成本高达 5,000 万美元。文本收集和存储相对便宜，但也可能比基因组数据更宽。在某些自然语言处理问题中，属性是单词，行是文档。属性矩阵中的条目是单词在文档中出现的次数。列数是文档集合的词汇量大小。取决于预处理（例如，移除\
  \ `a`、`and` 和 `of` 等常用词），词汇量可以从几千到几万不等。当 n-gram 与单词一起被计数时，文本的属性矩阵会变得非常宽。N-gram 是指紧挨着出现（或足够接近以形成短语）的两个、三个或四个单词的组合。当两个、三个或四个单词的组合也被计数时，自然语言处理的属性空间可以增长到超过一百万个属性。再一次，线性模型可能比更复杂的集成模型给出同等或更好的性能。\n\
  \n#### 选择算法：线性还是非线性？\n\n你刚才看到的可视化示例，让你对线性和非线性预测模型之间的性能权衡有了一些了解。当数据集的列多于行，或者底层问题简单时，线性模型更可取。对于数据行数远多于列数的复杂问题，非线性模型更可取。一个额外因素是训练时间。快速线性技术的训练速度比非线性技术快得多。（在我们介绍完第\
  \ 4 章和第 6 章中描述的技术并完成一些示例后，你将有更多依据来做出此决定。）\n\n选择非线性模型（例如集成方法）意味着要训练许多不同复杂度的模型。例如，生成图\
  \ 3.6 中决策边界的集成模型，是在训练过程中生成的大约一千个不同模型中的一个。这些模型具有各种不同的复杂度。其中一些与图 3.6 中直观可见的边界相比，只能给出粗糙得多的近似。选择生成图\
  \ 3.6 中决策边界的模型，是因为它在样本外数据上表现最好。这一过程适用于许多现代机器学习算法。示例将在“选择模型以平衡问题复杂度、模型复杂度和数据集大小”一节中介绍。\n\
  \n本节使用了可视化的数据集和分类器解决方案，旨在让你直观地掌握影响你构建的预测模型性能的因素。通常，你将使用性能的数值度量，而不是依赖图片。下一节将介绍生成预测模型数值性能度量的方法和注意事项，以及如何利用这些度量来估计模型部署时将达到的性能。\n\
  \n\n\n\n## 预测模型性能度量\n\n本节涵盖与预测模型性能度量相关的两大领域。第一个领域是针对不同类型问题可使用的不同度量指标（例如，回归问题使用 `MSE`，分类问题使用误分类错误率）。在文献中（以及机器学习竞赛中），你还会看到诸如受试者工作特征曲线（`ROC`\
  \ 曲线）和曲线下面积（`AUC`）之类的度量。此外，这些概念对于优化性能也很有用。\n\n第二大领域由用于收集样本外误差估计的技术组成。回想一下，样本外误差旨在模拟新数据上的误差。在设计实践中，使用这些技术来比较不同算法，并为给定的问题复杂度和数据集大小选择最佳模型复杂度，这是一个重要环节。该过程将在本章后面详细讨论，并在本书其余部分的示例中加以应用。\n\
  \n### 不同类型问题的性能度量\n\n回归问题的性能度量相对简单直接。在回归问题中，目标值和预测值都是实数。误差自然定义为目标值与预测值之间的差值。生成误差的统计摘要以便进行比较和诊断非常有用。最常用的摘要是均方误差（`MSE`）和平均绝对误差（`MAE`）。清单\
  \ 3.1 对比了 `MSE`、`MAE` 和均方根误差（`RMSE`，即 `MSE` 的平方根）的计算。\n\n#### 清单 3.1：MSE、MAE 和 RMSE\
  \ 的对比——regressionErrorMeasures.py\n\n```\n__author__ = 'mike_bowles'\nfrom math\
  \ import sqrt\n\n#here are some made-up numbers to start with\ntarget = [1.5, 2.1,\
  \ 3.3, -4.7, -2.3, 0.75]\nprediction = [0.5, 1.5, 2.1, -2.2, 0.1, -0.5]\n\nerror\
  \ = []\nfor i in range(len(target)):\n    error.append(target[i] - prediction[i])\n\
  \n#print the errors\nprint(\"Errors \",)\nprint(error, '\\n')\n\n#calculate the\
  \ squared errors and absolute value of errors\nsquaredError = []\nabsError = []\n\
  for val in error:\n    squaredError.append(val*val)\n    absError.append(abs(val))\n\
  \n\n#print squared errors and absolute value of errors\nprint(\"Squared Error\"\
  )\nprint(squaredError, '\\n')\n\nprint(\"Absolute Value of Error\")\nprint(absError,\
  \ '\\n')\n\n#calculate and print mean squared error MSE\nprint(\"MSE = \", sum(squaredError)/len(squaredError))\n\
  \n#calculate and print square root of MSE (RMSE)\nprint(\"RMSE = \", sqrt(sum(squaredError)/len(squaredError)))\n\
  \n#calculate and print mean absolute error MAE\nprint(\"MAE = \", sum(absError)/len(absError))\n\
  \n#compare MSE to target variance\ntargetDeviation = []\ntargetMean = sum(target)/len(target)\n\
  for val in target:\n    targetDeviation.append((val - targetMean)*(val - targetMean))\n\
  \n#print the target variance\nprint(\"Target Variance = \", sum(targetDeviation)/len(targetDeviation))\n\
  \n#print the target standard deviation (square root of variance) \nprint(\"Target\
  \ Standard Deviation = \", sqrt(sum(targetDeviation)/\n                      len(targetDeviation)))\n\
  \nPrinted Output:\nErrors \n[1.0, 0.6000000000000001, 1.1999999999999997, -2.5,\
  \ -2.4, 1.25] \n\nSquared Error\n[1.0, 0.3600000000000001, 1.4399999999999993, 6.25,\
  \ 5.76, 1.5625] \n\nAbsolute Value of Error\n[1.0, 0.6000000000000001, 1.1999999999999997,\
  \ 2.5, 2.4, 1.25] \n\nMSE = 2.72875\nRMSE = 1.651892853668179\nMAE = 1.4916666666666665\n\
  Target Variance = 7.570347222222222\nTarget Standard Deviation = 2.7514263977475797\
  \ \n```\n\n该示例首先为目标值和预测值设定了一些编造的数字。首先，它通过简单的减法计算误差；然后展示 `MSE`、`MAE` 和 `RMSE` 的计算过程。请注意，`MSE`\
  \ 的数量级与 `MAE` 和 `RMSE` 显著不同。这是因为 `MSE` 的单位是平方单位。因此，`RMSE` 通常是一个更实用的计算数值。清单底部计算了目标值的方差（均方差）和标准差（方差的平方根）。这些量分别可用于与预测误差的\
  \ `MSE` 和 `RMSE` 进行比较。例如，如果预测误差的 `MSE` 大致等于目标方差（或 `RMSE` 大致等于目标标准差），则预测算法表现不佳。你可以用目标均值的简单计算来替代预测算法，效果也差不多。清单\
  \ 3.1 中的误差其 `RMSE` 约为目标标准差的一半。这是相当不错的性能。\n\n除了计算误差的汇总统计量外，有时为了分析误差的来源和大小，查看误差直方图或尾部行为（分位数或十分位数边界）、正态度等也很有用。有时这些调查能提供关于误差来源和潜在性能改进的见解。\n\
  \n分类问题需要不同的处理方法。分类问题的方法通常围绕误分类错误率展开——即被错误分类的样本所占比例。例如，假设分类问题在于预测网站访客面前待展示链接的点击与否。通常，分类算法可以以概率形式呈现预测结果，而非硬性的“点击”与“不点击”决策。本书涉及的算法均输出概率。\n\
  \n这之所以有用，原因如下。如果点击与否的预测以概率给出——例如 80% 的点击概率（相应地 20% 的不点击概率）——数据科学家可以选择用 50% 作为阈值来决定展示或不展示该链接。然而在某些情况下，较高或较低的阈值会产生更好的最终结果。\n\
  \n例如，假设问题是欺诈检测（针对信用卡、自动清算所[支票]、保险理赔等）。基于欺诈与否的决策采取的行动是：让呼叫中心代表介入交易，或是放行交易。任一决策都涉及成本。如果介入，会产生呼叫中心成本和客户反应成本。如果不介入，则面临潜在欺诈的成本。如果采取行动的成本相对于不采取行动的成本非常低，则总成本最小化对应的阈值相对较低。更多交易会被标记为需介入。\n\
  \n但你在哪里为打断客户结账、要求客户致电持卡人服务才能继续划定界限呢？当你的预测算法指示交易有 20%、50% 还是 80% 的概率是欺诈时，你会进行干预吗？如果将干预阈值设为\
  \ 20%，你会更频繁地介入——防范更多欺诈交易——但也会激怒更多客户，让许多呼叫中心代表忙个不停。也许将阈值设高一些（如 80%）并接受更多欺诈会更好。\n\n\
  \n\n\n一种有用的思考方式是将可能的结果排列成所谓的*混淆矩阵*（confusion matrix）或*列联表*（contingency table）（`http://en.wikipedia.org/wiki/Confusion_matrix`）。图\
  \ 3.9 展示了一个列联矩阵的示例。列联表中的数字代表基于上一段讨论的阈值选择的性能。图 3.9 中的列联矩阵总结了针对 135 个测试样本进行预测的结果，该预测采用了特定的阈值概率选择。该矩阵有两列，代表可能的预测结果。它还有两行，代表每个样本的真实情况（标签）。因此，测试集中的每个样本都可以被分配到表格中的四个单元格之一。图\
  \ 3.9 中描绘的两种分类是“点击”和“不点击”，适用于广告选择。根据所解决的具体问题，这些也可能对应“欺诈”和“非欺诈”，或其他配对。\n\n左上角的单元格包含预测为点击且与标签（真实情况）匹配的样本。这些被称为*真阳性*（true\
  \ positive），通常缩写为 TP。左下角框中的条目对应预测为阳性（点击）但真实情况为阴性（不点击）的样本。这些被称为*假阳性*（false positive），缩写为\
  \ FP。矩阵的右列包含预测为不点击的样本。右上角的样本在真实情况下是点击，被称为*假阴性*（false negative），缩写为 FN。右下角的样本预测为不点击且与真实结果一致。它们被称为*真阴性*（true\
  \ negative），缩写为 TN。\n\n![图 3.9：混淆矩阵示例](img/c03f009.png)\n\n**图 3.9：混淆矩阵示例**\n\n\
  当概率阈值改变时会发生什么？考虑极端值。如果概率阈值设置为 0.0，无论模型预测什么概率，都会被指定为点击。所有样本都落在左列。右列全为 0。TP 的数量会上升到\
  \ 17。FP 的数量会上升到 118。如果 FP 没有成本且真阴性（TN）没有奖励，那可能是一个不错的选择，但不需要预测算法就能假设每个输入样本都是点击。同样，如果\
  \ FN 没有成本且 TP 没有收益，阈值可以设置为 1.0，使所有样本都被分类为不点击。这些极端情况有助于理解，但在部署系统中并无用处。以下示例展示了如何为岩石与地雷数据集构建分类器的过程。\n\
  \n岩石与地雷数据集提出了一个问题：构建一个分类器，利用声纳数据判断海底物体是岩石还是地雷。（关于该数据集更详尽的讨论和探索，请参见第 2 章“通过理解数据来理解问题”。）清单\
  \ 3.2 展示了在岩石与地雷数据集上训练简单分类器并预测其性能的 Python 代码。\n\n#### 清单 3.2：在岩石与地雷数据集上训练的分类器性能度量——classifierPerformance:RocksVMines.py\n\
  \n\n\n\n## 岩石与矿石分类：线性回归模型分析\n\n###### 代码实现\n\n```python\n__author__ = 'mike_bowles'\n\
  \nfrom Read_Fcns import list_read_rvm\nimport numpy as np\nimport random\nfrom sklearn\
  \ import datasets, linear_model\nfrom sklearn.metrics import roc_curve, auc\nimport\
  \ matplotlib.pyplot as plt\n\n\ndef confusionMatrix(predicted, actual, threshold):\n\
  \    if len(predicted) != len(actual):\n        return -1\n    tp = 0.0\n    fp\
  \ = 0.0\n    tn = 0.0\n    fn = 0.0\n    for i in range(len(actual)):\n        if\
  \ actual[i] > 0.5:  # 标签为 1.0 的样本（正例）\n            if predicted[i] > threshold:\n\
  \                tp += 1.0  # 正确预测为正例\n            else:\n                fn +=\
  \ 1.0  # 错误预测为负例\n        else:  # 标签为 0.0 的样本（负例）\n            if predicted[i]\
  \ < threshold:\n                tn += 1.0  # 正确预测为负例\n            else:\n      \
  \          fp += 1.0  # 错误预测为正例\n    rtn = [tp, fn, fp, tn]\n    return rtn\n\n\
  #### 使用 scikit-learn 包执行线性回归\n#### 从 uci.edu 数据仓库读取岩石与矿石数据集\nxList, labels = list_read_rvm()\n\
  \n#### 将属性和标签划分为训练集和测试集（2/3 和 1/3）\nindices = range(len(xList))\nxListTest = [xList[i]\
  \ for i in indices if i % 3 == 0]\nxListTrain = [xList[i] for i in indices if i\
  \ % 3 != 0]\nlabelsTest = [labels[i] for i in indices if i % 3 == 0]\nlabelsTrain\
  \ = [labels[i] for i in indices if i % 3 != 0]\n\n#### 构建训练和测试数据数组\nxTrain = np.array(xListTrain)\n\
  yTrain = np.array(labelsTrain)\nxTest = np.array(xListTest)\nyTest = np.array(labelsTest)\n\
  \n#### 检查形状以查看其结构\nprint(\"Shape of xTrain array\", xTrain.shape)\nprint(\"Shape\
  \ of yTrain array\", yTrain.shape)\nprint(\"Shape of xTest array\", xTest.shape)\n\
  print(\"Shape of yTest array\", yTest.shape)\n\n#### 训练线性回归模型\nrocksVMinesModel\
  \ = linear_model.LinearRegression()\nrocksVMinesModel.fit(xTrain, yTrain)\n\n####\
  \ 生成样本内误差的预测值\ntrainingPredictions = rocksVMinesModel.predict(xTrain)\nprint(\"\\\
  nSome values predicted by model\", trainingPredictions[0:5], \\\n      trainingPredictions[-6:-1])\n\
  \n#### 生成训练集预测的混淆矩阵（样本内\nconfusionMatTrain = confusionMatrix(trainingPredictions,\
  \ yTrain, 0.5)\n#### 选取阈值并生成混淆矩阵条目\ntp = confusionMatTrain[0]\nfn = confusionMatTrain[1]\n\
  fp = confusionMatTrain[2]\ntn = confusionMatTrain[3]\n\nprint(\"\\ntp = \" + str(tp)\
  \ + \"\\tfn = \" + str(fn) + \"\\n\" + \"fp = \" + \\\n      str(fp) + \"\\ttn =\
  \ \" + str(tn) + '\\n')\n\n#### 生成样本外数据的预测值\ntestPredictions = rocksVMinesModel.predict(xTest)\n\
  \n#### 根据样本外数据的预测生成混淆矩阵\nconMatTest = confusionMatrix(testPredictions, yTest, 0.5)\n\
  \n#### 选取阈值并生成混淆矩阵条目\ntp = conMatTest[0]\nfn = conMatTest[1]\nfp = conMatTest[2]\n\
  tn = conMatTest[3]\nprint(\"tp = \" + str(tp) + \"\\tfn = \" + str(fn) + \"\\n\"\
  \ + \"fp = \" + \\\n      str(fp) + \"\\ttn = \" + str(tn) + '\\n')\n\n#### 生成样本内\
  \ ROC 曲线\n\nfpr, tpr, thresholds = roc_curve(yTrain, trainingPredictions)\nroc_auc\
  \ = auc(fpr, tpr)\nprint('AUC for in-sample ROC curve: %f' % roc_auc)\n\n#### 绘制\
  \ ROC 曲线\nplt.clf()\nplt.plot(fpr, tpr, label='ROC curve (area = %0.2f)' % roc_auc)\n\
  plt.plot([0, 1], [0, 1], 'k--')\nplt.xlim([0.0, 1.0])\nplt.ylim([0.0, 1.0])\nplt.xlabel('False\
  \ Positive Rate')\nplt.ylabel('True Positive Rate')\nplt.title('In sample ROC rocks\
  \ versus mines')\nplt.legend(loc=\"lower right\")\nplt.show()\n\n#### 生成样本外 ROC\
  \ 曲线\nfpr, tpr, thresholds = roc_curve(yTest, testPredictions)\nroc_auc = auc(fpr,\
  \ tpr)\nprint('AUC for out-of-sample ROC curve: %f' % roc_auc)\n\n#### 绘制 ROC 曲线\n\
  plt.clf()\nplt.plot(fpr, tpr, label='ROC curve (area = %0.2f)' % roc_auc)\nplt.plot([0,\
  \ 1], [0, 1], 'k--')\nplt.xlim([0.0, 1.0])\nplt.ylim([0.0, 1.0])\nplt.xlabel('False\
  \ Positive Rate')\nplt.ylabel('True Positive Rate')\nplt.title('Out-of-sample ROC\
  \ rocks versus mines')\nplt.legend(loc=\"lower right\")\nplt.show()\n```\n\n######\
  \ 运行结果\n\n```\nShape of xTrain array (138, 60)\nShape of yTrain array (138,)\nShape\
  \ of xTest array (70, 60)\nShape of yTest array (70,)\n\nSome values predicted by\
  \ model [-0.10240253 0.42090698 0.38593034 \n0.36094537 0.31520494] [1.11094176\
  \ 1.12242751 0.77626699 1.02016858\n0.66338081]\n\ntp = 68.0  fn = 6.0\nfp = 7.0\
  \   tn = 57.0\n\ntp = 28.0  fn = 9.0\nfp = 9.0   tn = 24.0\n\nAUC for in-sample\
  \ ROC curve: 0.979519\n```\n\n\n\n\n代码的第一部分从加州大学欧文分校（UCI）数据存储库读取输入数据，然后将其格式化为用于标签的列表和用于属性的列表的列表。下一步是将数据（标签和属性）分成两个子集：包含三分之一数据的测试集，和包含另外三分之二数据的训练集。标记为\
  \ `test` 的数据不会用于训练分类器，而是会在分类器训练完成后保留用于评估性能。这一步模拟了分类器在部署后对新数据示例的行为。稍后，本章将讨论各种不同的留出数据方法以及对新数据性能进行估计的方法。\n\
  \n通过将原始数据集中的标签 M（代表 mine，地雷）和 R（代表 rock，岩石）转换为数值——1.0 对应地雷，0.0 对应岩石——然后使用普通最小二乘回归拟合线性模型来训练分类器。这是一种相当简单易懂且易于实现的方法，通常能产生与稍后讨论的更复杂算法非常相似的性能。Listing\
  \ 3.2 中的程序使用 `scikit-learn` 中的线性回归类来训练普通最小二乘模型。然后使用训练好的模型在训练集和测试集上生成预测。\n\n代码打印出预测值的一些代表性数值。线性回归模型生成的数字大多在\
  \ 0.0 到 1.0 的区间内，但并非完全如此。这些预测值并不完全是概率。它们仍可通过与阈值比较来生成预测分类。函数 `confusionMatrix()`\
  \ 生成混淆矩阵的数值，类似于 Figure 3.9。它接受预测值、相应的实际值（标签）和一个阈值作为输入。它将预测值与阈值比较，以确定将每个示例分配到混淆矩阵的“预测为正”还是“预测为负”列。它使用实际值将示例分配到混淆矩阵的相应行。\n\
  \n可以从混淆矩阵中读出每个阈值对应的错误率。总错误数是 FP（假正例）和 FN（假反例）之和。示例代码生成了样本内数据和样本外数据的混淆矩阵，并将两者都打印出来。样本内数据的误分类错误率约为\
  \ 8%，样本外数据约为 26%。通常，样本外性能会比样本内性能差。它也能更具代表性地反映新示例的预期误差。\n\n当阈值改变时，误分类错误率也会随之变化。Table\
  \ 3.2 展示了误分类错误率如何随着决策阈值的变化而变化。表中的数字基于样本外结果。这通常适用于本书中表征性能的数字。任何样本内错误都会附带警告标签：“警告：这些是样本内错误。”如果目标是最小化误分类错误，最佳阈值为\
  \ 0.25。\n\n**表 3.2**：误分类错误对决策阈值的依赖关系\n\n| 决策阈值 | 误分类错误率 |\n| --- | --- |\n| 0.0\
  \ | 28.6% |\n| 0.25 | 24.3% |\n| 0.5 | 25.7% |\n| 0.75 | 30.0% |\n| 1.0 | 38.6%\
  \ |\n\n最佳阈值可能是使误分类错误最小化的那个。然而，有时一种错误类型的代价比另一种高。例如，假设在岩石与地雷的问题中，派遣潜水员进行目视检查的成本是 100\
  \ 美元，而如果未清除地雷，未爆地雷造成的预期伤亡和财产损失成本为 1,000 美元。FP 成本 100 美元，FN 成本 1,000 美元。基于这些假设，Table\
  \ 3.3 总结了不同阈值下错误的美元成本。将地雷误判为岩石（并将其留在原地威胁健康安全）的较高成本将决策阈值推低至零。这意味着会有更多 FN，但它们的代价不那么高昂。更彻底的分析可以包括与\
  \ TP（真正例）和 TN（真反例）相关的成本。例如，TP 可能包含清除地雷的成本，以及因清除地雷而带来的 +1,000 美元收益。如果这些数字在你的问题中可用（或可合理估算），你最好利用它们来得出更好的阈值。\n\
  \n**表 3.3**：不同决策阈值下的错误成本\n\n| 决策阈值 | 假反例成本 | 假正例成本 | 总成本 |\n| --- | --- | --- |\
  \ --- |\n| 0.0 | 1,000 | 1,900 | 2,900 |\n| 0.25 | 3,000 | 1,400 | 4,400 |\n| 0.5\
  \ | 9,000 | 900 | 9,900 |\n| 0.75 | 18,000 | 300 | 18,300 |\n| 1.00 | 26,000 | 100\
  \ | 26,100 |\n\n请注意，总 FP 与 FN 的相对成本取决于数据集中正例和反例的比例。岩石与地雷数据集拥有相同数量的正例和反例（地雷和岩石）。这大概是由实验方案决定的。实际部署中遇到的正例和反例比例可能不同。如果部署时的数字可能不同，你需要做一些调整以适应实际使用中的比例。\n\
  \n数据科学家可能没有可用的成本数据，但可能仍希望用一种方法来表征分类器的整体性能，而不是使用特定决策阈值下的误分类错误率。一种常用的技术称为*受试者工作特征曲线*（ROC\
  \ 曲线）（`http://en.wikipedia.org/wiki/Receiver_operating_characteristic`）。\n\nROC\
  \ 这个名字源于其最初的应用——处理雷达接收机的回波以确定敌机的有无。ROC 曲线生成单个图表来汇总所有这些不同的列联表。ROC 曲线绘制真正例率（简称 TPR）与假正例率（FPR）的关系。TPR\
  \ 是被正确分类为正例的正例比例（参见 Equation 3.8）。FPR 是 FP 相对于实际反例总数的比率（参见 Equation 3.9）。用列联表的元素表示，这些公式如下：\n\
  \n![Equation 3.8: True positive rate](img/c03-disp-0009.png)\n\n**公式 3.8**：真正例率\n\
  \n![Equation 3.9: False positive rate](img/c03-disp-0010.png)\n\n**公式 3.9**：假正例率\n\
  \n作为一个简单的思想实验，考虑使用一个极低的决策阈值。对于极低的值，每个示例都被预测为正例。这使得 TPR 为 1.0。因为所有东西都被分类为正例，所以没有\
  \ FN（FN 为 0.0）。这也使得 FPR 为 1.0，因为没有东西被分类为负例（TN 为 0.0）。然而，当决策阈值设得非常高时，TP 等于零，因此 TPR\
  \ 也是零，FP 也是零，因为没有东西被分类为正例。因此，FPR 也是零。以下两个图是使用 `pylab` 的 `roc_curve()` 和 `auc()`\
  \ 函数绘制的。Figure 3.10 显示了基于样本内数据的 ROC 曲线性能。Figure 3.11 显示了基于样本外数据的 ROC 曲线。\n\n\n\n\
  \n### ROC 曲线与 AUC\n\n通过随机判定岩石或矿石运行的分类器的 ROC 曲线，在图表上形成一条从左下角到右上角的对角线。该线通常被绘制在 ROC\
  \ 曲线上作为参考基准。对于完美的分类器，ROC 曲线从 (0, 0) 直线上升到 (0, 1)，然后水平延伸至 (1, 1)。毫不奇怪，图 3.10（基于样本内数据）比\
  \ 图 3.11（基于样本外数据）更接近完美。分类器的 ROC 曲线越接近左上角，其性能越好。如果 ROC 明显低于对角线，通常意味着数据科学家在某处搞反了符号，应仔细检查代码。\n\
  \n![Figure 3.10: In-sample ROC for rocks-versus-mines classifier](img/c03f010.png)\n\
  \n**图 3.10**：岩石与矿石分类器的样本内 ROC 曲线\n\n![Figure 3.11: Out-of-sample ROC for rocks-versus-mines\
  \ classifier](img/c03f011.png)\n\n**图 3.11**：岩石与矿石分类器的样本外 ROC 曲线\n\n图 3.10 和 3.11\
  \ 还展示了曲线下面积（AUC）数值。顾名思义，AUC 即 ROC 曲线下的面积。完美分类器的 AUC 为 1.0，随机猜测的 AUC 为 0.5。图 3.10\
  \ 和 3.11 的 AUC 值再次证明：基于训练集误差（样本内数据）的性能估计会高估实际性能。样本内数据的 AUC 为 0.98，样本外数据的 AUC 为 0.85。\n\
  \n用于衡量二分类器性能的某些方法同样适用于多分类器。误分类错误率依然适用，混淆矩阵也同样有效。ROC 曲线和 AUC 也存在多分类的推广形式。¹\n\n####\
  \ 模拟已部署模型的性能\n\n前一节的示例演示了：为了获得模型部署后预期性能的有用估计，必须在未包含于训练集的数据上测试性能。示例将可用的标记数据分成了两个子集。其中一个子集称为*训练集*，包含约三分之二的可用数据，用于拟合普通最小二乘模型。第二个子集包含剩余的三分之一数据，称为*测试集*，仅用于确定性能（模型训练期间不使用）。这是机器学习中的标准程序。\n\
  \n测试集大小通常占数据的 25% 到 35%，尽管没有关于大小的硬性规定。需牢记一点：随着训练数据集规模缩小，训练模型的性能会下降。从训练集中分出过多数据可能会损害最终性能。\n\
  \n另一种保留数据的方法称为 *n 折交叉验证*。图 3.12 示意性地展示了如何使用 n 折交叉验证将数据集划分为训练集和测试集。数据集被分成 *n* 个大小大致相等的不相交集合。图中\
  \ *n* 为 5。需对数据进行多轮训练和测试。第一轮中，第一块数据被保留用于测试，其余 `n-1` 块用于训练。第二轮中，第二块数据被保留用于测试，其他 `n-1`\
  \ 块用于训练。此过程持续进行，直到所有数据都被保留过一次（如 图 3.12 所示的五折示例，共五次）。\n\n![Figure 3.12: N-fold cross-validation](img/c03f012.png)\n\
  \n**图 3.12**：N 折交叉验证\n\nn 折交叉验证过程可产生预测误差的估计值，并拥有多个误差样本，从而能估计误差的误差界。它能在训练集中保留更多数据，通常能带来更低的泛化误差和更好的最终性能。例如，若选择\
  \ 10 折交叉验证，则每轮训练仅保留 10% 的数据用于测试。n 折交叉验证的这些优势是以更长的训练时间为代价的。采用固定保留集的方法具有训练更快的优势，因为它只需对训练数据进行一次遍历。当\
  \ n 折交叉验证的训练时间难以忍受，且可用训练数据量大到保留集中的额外数据不会对性能产生不利影响时，采用固定保留集可能是更好的选择。\n\n另一点需注意：样本应具有整个数据集的代表性。前一节示例中使用的抽样方案并非随机抽样，而是每隔三个数据点取一个样本。在数据中均匀分布样本通常效果良好。但必须避免以引入训练集和测试集偏差的方式进行抽样。例如，若给定的数据是按采样日期排序的每日一次采样数据，则应避免编码七折交叉验证并每隔七个点采样一次。\n\
  \n若研究现象具有异常统计特性，抽样可能需要严格控制。可能需要小心保留测试样本中的统计特性。例如预测欺诈或广告点击等罕见事件。建模目标事件极其罕见，随机抽样可能导致测试集中过度或不足地代表这些事件，从而导致性能估计出错。分层抽样（`http://en.wikipedia.org/wiki/Stratified_sampling`）将数据划分为单独抽样后再重新组合的独立子集。当标签为罕见事件时，可能需要分别对欺诈样本和正常样本进行抽样，然后将它们合并作为测试集，以匹配训练集，更重要的是匹配模型将要应用的新数据。\n\
  \n模型训练和测试完成后，最佳实践是将训练集和测试集重新合并为单一数据集，并在更大的数据集上重新训练模型。样本外测试过程已给出预期预测误差的良好估计。保留部分数据正是为此目的。在更多数据上训练，模型性能和泛化能力会更好。部署的模型应在所有数据上进行训练。\n\
  \n本节为您提供了量化预测模型性能的工具。下一节将向您展示如何用数值比较取代您在“驱动算法选择和性能的因素——复杂性与数据”一节中看到的模型与问题复杂性的直观图形比较。这种替换使得部分选择过程实现机械化成为可能。\n\
  \n### 实现模型与数据的和谐\n\n\n\n\n本节使用普通最小二乘法（OLS）回归来说明几个问题。首先，它说明了 OLS 有时会*过拟合*问题。过拟合意味着训练数据上的误差与测试数据上的误差之间存在显著差异，正如你在上一节中看到的，OLS\
  \ 被用于解决岩石与地雷的分类问题。其次，它介绍了两种克服 OLS 过拟合问题的方法。这些方法将培养你的直觉，并为第 4 章中更深入介绍的惩罚线性回归方法奠定基础。此外，克服过拟合的方法具有一个大多数现代机器学习算法共有的特性。现代算法生成多个复杂度各异的模型，然后利用样本外表现来平衡模型复杂度、问题复杂度和数据集丰富度，从而决定部署哪个模型。这一过程将在本书的其余部分反复使用。\n\
  \n普通最小二乘法回归是一般机器学习算法的一个良好原型。它是一种具有训练过程和部署过程的监督算法。在某些情况下它会过拟合。它与其他更现代的函数逼近算法共享这些特性。然而，OLS\
  \ 缺少现代算法的一项重要特性。在其原始公式（最熟悉的公式）中，没有在过拟合时“减速”的手段。这就像有一辆只能全速行驶的汽车（在宽阔的道路上很棒，但在狭窄的环境中很难使用）。幸运的是，自高斯和勒让德\
  \ 200 多年前发明普通最小二乘法回归以来，已经有了大量的研究成果。本节介绍了两种调整普通最小二乘法回归“油门”的方法。一种称为*前向逐步回归*；另一种称为*岭回归*。\n\
  \n### 选择模型以平衡问题复杂度、模型复杂度和数据集大小\n\n几个示例将说明现代机器学习技术如何调整以最佳地拟合给定的问题和数据集。第一个示例是对普通最小二乘法回归的一种修改，称为前向逐步回归。其工作原理如下。回顾公式\
  \ 3.1 和 3.2，它们定义了待解决的问题（参见此处的公式 3.10 和 3.11，它们重复了那些公式）。向量 `Y` 包含标签。矩阵 `X` 包含用于预测标签的属性。\n\
  \n![Equation 3.10: Vector of numeric labels](img/c03-disp-0011.png)\n\n**公式 3.10**：数值标签向量\n\
  \n![Equation 3.11: Matrix of numeric attributes](img/c03-disp-0012.png)\n\n**公式\
  \ 3.11**：数值属性矩阵\n\n如果这是一个回归问题，那么 `Y` 是一个实数列向量，线性问题就是寻找一个权重列向量和一个标量 0（参见公式 3.12）。\n\
  \n![Equation 3.12: Vector of coefficients for linear model](img/c03-disp-0013.png)\n\
  \n**公式 3.12**：线性模型的系数向量\n\n选择 的值，使得 `Y` 能被良好地近似（参见公式 3.13）。\n\n![Equation 3.13:\
  \ Approximating labels as linear function of attributes](img/c03-disp-0014.png)\n\
  \n**公式 3.13**：将标签近似为属性的线性函数\n\n如果 `X` 的列数与行数相同，且 `X` 的列是独立的（不是彼此的线性倍数），则 `X` 可逆，\
  \ 可以替换为 `=`。一个系数向量 将使线性拟合完全精确地拟合标签。这好得令人难以置信。问题在于过拟合（即在训练数据上获得极佳性能，却无法在新数据上复现）。在实际问题中，这不是一个好的结果。过拟合的根源是\
  \ `X` 中包含太多的数据列。答案可能是去除 `X` 的某些列。然而，去除某些列涉及决定去除多少列以及去除哪些列。暴力方法称为*最佳子集选择*。\n\n####\
  \ 使用前向逐步回归控制过拟合\n\n以下代码概述了最佳子集选择的算法。基本思想是对列数施加一个约束（假设为 `nCol`），然后取 `X` 的所有包含该数量列的子集，执行普通最小二乘法回归，找出具有最小样本外误差的\
  \ `nCol` 子集，增加 `nCol`，然后重复。该过程产生一个列表，包含最佳的单列子集、双列子集，直到完整的矩阵 `X`（全列子集）。它还给出了每个子集的性能。下一步是决定部署单列版本、双列版本等。但这相对容易；只需选择误差最小的那个：\n\
  \n```\nInitialize: Out_of_sample_error = NULL\nBreak X and Y into test and training\
  \ sets\nfor i in range(number of columns in X):\n  for each subset of X having i+1\
  \ columns:\n     fit ordinary least squares model\n     Out_of_sample_error.append(least\
  \ error amoung subsets containing\n        i+1 columns)\nPick the subset corresponding\
  \ to least overall error\n```\n\n最佳子集选择的问题在于，即使对于适度数量的属性（`X` 的列），它也需要过多的计算。例如，10\
  \ 个属性会导致 ![images](img/c03-i0027.png)<math display=\"inline\" overflow=\"scroll\"\
  \ xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msup><mn>2</mn><mn>10</mn></msup><mo>=</mo><mn>1</mn><mo>,</mo><mn>000</mn></mrow></math>\
  \ 个子集。有几种技术可以避免这种情况。以下代码展示了前向逐步回归的过程。前向逐步回归的思路是从单列子集开始，然后在给定最佳单列的情况下，找到要追加的最佳第二列，而不是评估所有可能的双列子集。前向逐步回归的伪代码如下：\n\
  \n```\nInitialize: ColumnList = NULL\nOut-of-sample-error = NULL\nBreak X and Y\
  \ into test and training sets\nFor number of column in X:\n  For each trialColumn\
  \ (column not in ColumnList):\n    Build submatrix of X using ColumnList + trialColumn\n\
  \    Train OLS on submatrix and store RSS Error on test data\n    ColumnList.append(trialColumn\
  \ that minimizes RSS Error)\n    Out-of-sample-error.append(minimum RSS Error)\n\
  ```\n\n最佳子集选择和前向逐步回归具有相似的过程。它们训练一系列模型（单列的若干个、双列的若干个，以此类推）。它们产生一个参数化的模型族（所有线性回归，参数化为列数）。模型复杂度各异，最终模型根据样本外误差性能从该模型族中选择。\n\
  \n代码清单 3.3 展示了在葡萄酒数据集上实现前向逐步回归的 Python 代码。\n\n##### 代码清单 3.3：前向逐步回归：葡萄酒质量数据——fwdStepwiseWine.py\n\
