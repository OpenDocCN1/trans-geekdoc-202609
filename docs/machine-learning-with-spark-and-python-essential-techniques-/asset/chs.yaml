  Whole weight    0.925261  0.925452  0.819221      1.000000     0.969405\nShucked\
  \ weight  0.897914  0.893162  0.774972      0.969405     1.000000\nViscera weight\
  \  0.903018  0.899724  0.798319      0.966375     0.931961\nShell weight    0.897706\
  \  0.905330  0.817338      0.955355     0.882617\nRings           0.556720  0.574660\
  \  0.557467      0.540390     0.420884\n \n                 Viscera weight  Shell\
  \ weight     Rings  \nLength                0.903018      0.897706  0.556720  \n\
  Diameter              0.899724      0.905330  0.574660  \nHeight               \
  \ 0.798319      0.817338  0.557467  \nWhole weight          0.966375      0.955355\
  \  0.540390  \nShucked weight        0.931961      0.882617  0.420884  \nViscera\
  \ weight        1.000000      0.907656  0.503819  \nShell weight          0.907656\
  \      1.000000  0.627574  \nRings                 0.503819      0.627574  1.000000\
  \   \n```\n\nFigure 2.15 展示了相关性热力图。在该图中，红色表示高相关性，蓝色代表弱相关性。目标变量（贝壳环数）位于最后一项，即热力图的顶行和最右列。这些位置的蓝色值意味着属性与目标之间的相关性较弱。浅蓝色对应目标与\
  \ Shell weight 之间的相关性。这证实了你在平行坐标图中所见。Figure 2.15 中其他非对角单元格的红色值表明属性之间高度相关。这在一定程度上与平行坐标图所呈现的画面相矛盾，在平行坐标图中，目标与属性之间的对应关系在视觉上似乎相当紧密。Listing\
  \ 2-13 给出了相关性的数值。\n\n在本节中，你已经了解了如何将针对分类问题（岩石与地雷）描述的工具修改为适用于回归问题（鲍鱼）。所有修改都源于这两类问题的基本区别——回归问题的标签是实数，而二分类问题的标签是双值。下一节将对一个具有全数值属性的回归问题进行相同的研究。因为是回归问题，本节用于鲍鱼问题的相同工具均可使用。因为拥有全数值属性，所有属性都可以纳入研究，如相关性分析和沿实数线绘图。\n\
