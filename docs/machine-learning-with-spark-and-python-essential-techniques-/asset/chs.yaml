  \n**图 7.5**: 梯度提升鲍鱼年龄模型的训练和测试性能\n\n图 7.6 显示了梯度提升的变量重要性。请注意，经过数值编码的性别变量位于列表底部。你将看到它们在随机森林中也占据底部位置。\n\
  \n本节已经讲解了预测鲍鱼年龄——通过切开贝壳并在显微镜下计算年轮数来确定。可用于预测的测量值是其他更容易测量的量，如贝壳重量、去壳重量和动物性别。由于在鲍鱼生命的某些阶段性别无法确定，因此性别变量有三个值。本节演示了如何处理该变量的编码，并演示了它如何与梯度提升模型配合工作。你将在“使用\
  \ PySpark 集成方法预测鲍鱼年龄”一节中再次看到这一点。\n\n![Figure 7.6: Gradient boosting estimates of\
