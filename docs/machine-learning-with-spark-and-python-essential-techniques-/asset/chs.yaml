  \ MSE 与树的数量关系\n\n### 梯度提升总结\n\n本节展示了梯度提升的运作原理，并演示了如何控制其行为以获得最佳性能。本节讨论了改变步长、树的深度和树的数量的影响。你已经看到梯度提升如何避免了装袋法在浅树上遇到的偏差错误。装袋法和提升法在原理上的基本区别在于，提升法持续监控其累积误差，并将该残差用于后续训练。这种差异解释了为什么梯度提升仅在问题的各属性之间存在显著交互作用时才需要树的深度。\n\
  \n## 随机森林\n\n随机森林算法由已故的伯克利教授 Leo Breiman 和 Adele Cutler 开发。随机森林通过在数据子集上训练来生成其模型序列。这些子集是从完整训练集中随机抽取的。选择子集的一种方式是以与\
  \ Breiman 的自助聚合算法相同的方式，对行进行有放回的随机采样。另一个随机因素是，随机森林集成中各个树的训练集并不包含所有属性，而是也随机选取属性的一个子集。清单\
  \ 6-8 使用 Python `DecisionTreeRegression` 近似实现了随机森林。\n\n#### 清单 6-8：带随机属性选择的装袋法——wineRF.py\n\
  \n```\n__author__ = 'mike-bowles'\n\nimport numpy as np\nfrom sklearn import tree\n\
  from sklearn.tree import DecisionTreeRegressor\nfrom numpy.random import choice\n\
  from math import sqrt\nimport matplotlib.pyplot as plt\nfrom Read_Fcns import list_read_wine\n\
  \n##### 将数据读入可迭代对象\nnames, xList, labels = list_read_wine()\nxArray = np.array(xList)\n\
  yArray = np.array(labels)\n\nnrows = len(xList)\nncols = len(xList[0])\n\n#####\
  \ 取固定测试集，占样本的 30%\nindices = list(range(nrows))\nnSample = int(nrows * 0.30)\nidxTest\
  \ = choice(indices, nSample, replace=False)\nidxTrain = [idx for idx in indices\
  \ if not(idx in idxTest)]\n\n##### 定义测试集和训练集的属性及标签集\nxTrain = xArray[idxTrain]\n\
  xTest = xArray[idxTest]\nyTrain = yArray[idxTrain]\nyTest = yArray[idxTest]\nidx_Train\
  \ = list(range(len(xTrain)))\n\n##### 在训练数据的随机子集上训练一系列模型\n##### 将模型收集在列表中，并随着列表增长检查组合模型的误差\n\
  \n##### 要生成的最大模型数量\nnumTreesMax = 30\n\n##### 树的深度 - 通常取较高值\ntreeDepth = 12\n\n\
  ##### 选定每个模型将使用多少属性。\n##### 作者建议回归问题使用 1/3\nnAttr = 4\n\n##### 初始化一个列表以保存模型\nmodelList\
  \ = []\nindexList = []\npredList = []\nn_bag = int(0.5 * len(yTrain))\n   \nfor\
  \ iTrees in range(numTreesMax):\n\n    modelList.append(DecisionTreeRegressor(max_depth=treeDepth))\n\
  \n    # 随机采样属性\n    idx_attr = choice(list(range(ncols)), nAttr, replace=False)\n\
  \    \n    # 对训练行进行随机采样 - 装袋法\n    idx_bag = choice(idx_Train, n_bag, replace=True)\n\
  \  \n\n    # 构建训练集\n    xRfTrain = xTrain[idx_bag, ]\n    xRfTrain = xRfTrain[:,\
  \ idx_attr]\n    yRfTrain = yTrain[idx_bag]\n\n    modelList[-1].fit(xRfTrain, yRfTrain)\n\
  \n    # 将 xTest 限制为训练时选定的属性\n    xRfTest = xTest[:,idx_attr]\n    \n    latestOutSamplePrediction\
  \ = modelList[-1].predict(xRfTest)\n    predList.append(latestOutSamplePrediction)\n\
  \n\n##### 从前 \"n\" 个模型构建累积预测\nrmse = []\nallPredictions = []\n\nfor iModels in range(len(modelList)):\n\
  \    \n    prediction_i = np.zeros_like(predList[0]) \n    for i in range(iModels):\
  \ \n        prediction_i += predList[i] / float(iModels + 1)\n\n    allPredictions.append(prediction_i)\n\
  \    errors = yTest - prediction_i\n    rmse.append(sqrt(np.average(errors * errors)))\n\
  \nnModels = [i + 1 for i in range(len(modelList))]\n\nplt.plot(nModels,rmse)\nplt.axis('tight')\n\
  plt.xlabel('集成中的树的数量')\nplt.ylabel('均方根误差')\nplt.title('随机森林 RMSE - 深度 = ' + str(treeDepth))\n\
  plt.savefig('rf_wine_depth_' + str(treeDepth) + '.png', dpi=500)\nplt.ylim((0.0,\
  \ max(rmse)))\nplt.show()\n   \nprint('树的数量 = ', numTreesMax)\nprint('树的深度 = ',\
  \ treeDepth)\nprint('最小 RMSE = ', min(rmse))\n\n打印输出：\n\n树的数量 = 30\n树的深度 = 1\n最小\
  \ RMSE = 0.7554878119435257\n\n树的数量 = 5\n树的深度 = 30\n最小 RMSE = 0.6924346211106107\n\
  \n树的数量 = 12\n树的深度 = 30\n最小 RMSE = 0.6396042882586701 \n```\n\n### 随机森林：装袋法加随机属性子集\n\
  \n清单 6-5 中所示示例在葡萄酒质量数据集上进行训练。之前用于说明装袋法和梯度提升算法的简单单属性示例不适用于随机森林。该示例只有一个属性。对单个项目进行随机抽取是没有意义的。清单\
  \ 6-5 中的代码看起来很像装袋法的代码。在 `iTrees` 循环之前，两者唯一的区别是指定了一个名为 `nAttr` 的变量。属性的随机抽取需要知道要选择多少属性。原始论文的作者建议回归问题使用三分之一的属性数量（分类问题使用属性数量的平方根）。在\
  \ `iTrees` 循环内部，对属性矩阵的行进行随机采样——就像装袋法一样。还对属性矩阵的列进行无放回随机抽取（如果将列表的列表转换为 numpy 数组，那将是行和列）。然后训练一棵树，并用它对样本外数据进行预测。\n\
  \n清单 6-5 中实现的内容与随机森林算法有所不同。清单 6-5 中的算法随机选取属性子集，并用该子集训练一棵树。Breiman 的原始版随机森林算法则为树中的每个节点选取不同的随机属性集。实现\
  \ Breiman 的原始版算法需要访问树生长算法的内部结构。尽管如此，该示例仍能让人对算法的运作方式有所了解。有人认为在每个节点上对属性进行随机抽取并没有太大优势。\n\
  \n### 随机森林性能驱动因素\n\n\n\n\n### 图 6.25–6.27：随机属性选择下的 MSE 与树的数量关系\n\n图 6.25 至 6.27\
  \ 展示了随机属性选择的加入如何影响集成中包含的树的数量与 MSE 曲线之间的关系。\n\n图 6.25 显示了单个树为深度 1 树时的结果。这幅图与 Bagging\
  \ 非常相似，因为集成并没有显著提升性能。深度 1 的树主要导致偏差误差，而非方差误差。偏差无法通过平均化来消除。\n\n![Figure 6.25: MSE\
  \ versus number of trees for bagging + random attribute selection—Depth 1 trees](img/c06f025.png)\n\
  \n**图 6.25**：Bagging + 随机属性选择下的 MSE 与树的数量关系——深度 1 树\n\n![Figure 6.26: MSE versus\
  \ number of trees for bagging + random attribute selection—Depth 5 trees](img/c06f026.png)\n\
  \n**图 6.26**：Bagging + 随机属性选择下的 MSE 与树的数量关系——深度 5 树\n\n![Figure 6.27: MSE versus\
  \ number of trees for bagging + random attribute selection—Depth 12 trees](img/c06f027.png)\n\
  \n**图 6.27**：Bagging + 随机属性选择下的 MSE 与树的数量关系——深度 12 树\n\n图 6.26 显示了使用深度 5 树时的 MSE\
  \ 曲线。现在 Bagging 加随机属性选择带来的方差减少开始显现出一些性能。这种组合带来的改进获得了与其他演示方法相似的性能。\n\n图 6.27 显示，使用深度\
  \ 12 的树可以获得略微更多的性能提升。\n\n### 随机森林总结\n\n随机森林是 Bagging 与二叉树基学习器随机属性选择修改的结合体。这些差异看似不大，但它们赋予了随机森林与\
  \ Bagging 和梯度提升截然不同的性能特征。一些结果表明，随机森林在宽稀疏属性空间（如文本挖掘问题中出现的空间）中具有优势。随机森林比梯度提升更容易并行化，因为各个基学习器可以相互独立地进行训练，而梯度提升中每个基学习器都需要前面基学习器的结果。\n\
  \n这些差异意味着，如果你需要从数据中榨取尽可能多的性能，你可能想要在梯度提升之外，尝试随机森林。\n\n## 总结\n\n本章介绍了基本集成算法的一些背景知识。它解释了集成方法由两层算法组成。集成方法训练成百上千个被称为*基学习器*的低层算法。高层算法控制基学习器的训练，使它们的模型彼此相对独立，从而使组合它们能够降低组合模型的方差。对于\
  \ Bagging，高层算法是对训练集进行自助采样，并在这些样本上训练基学习器。对于梯度提升，高层算法在每个阶段对输入数据进行采样，并在其上训练一个基学习器。使用梯度提升时，训练每个基学习器的目标是所有早期基学习器累积产生的误差。随机森林是将\
  \ Bagging 作为高层算法，并结合经过修改的二叉决策树版本作为基学习器的组合。随机森林中的基学习器是二叉树，在这些树中，每个节点的分裂点决策被限制在可用属性的随机样本上，而不是考虑每次分裂时的所有属性。Python\
  \ 中可用的梯度提升包允许你将随机森林基学习器与梯度提升结合使用。你将在下一章“使用 Python 构建集成方法”中看到这种用法。\n\n本章为每个高层算法编写了代码，并展示了随机森林基学习器的模拟实现。编写这些代码的目的是让你理解每个算法内部运作的机制。其背后的想法是，你将更好地理解这些算法的\
  \ Python 包的选项、输入变量、名义起始值等。下一章将使用可用的 Python 包来生成一些解决方案，这些问题是你之前用惩罚线性回归解决过的。\n\n##\
  \ 参考文献\n\n1.  Panda Biswanath, Joshua S. Herbach, Sugato Basu, and Roberto J. Bayardo.\
