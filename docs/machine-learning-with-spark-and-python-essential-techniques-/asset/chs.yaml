  \ \n```\n\n### 使用梯度提升评估性能和编码变量的重要性\n\n清单 7-3 中的打印输出显示了梯度提升在鲍鱼数据上的表现。GBM 在没有进行大量调优的情况下，就将测试数据上的误差降到了\
  \ 2.13。所做的调优表明，限制用于树训练的特征似乎有帮助。看看你能否通过进一步调优来改进这些结果。你可以在本书的在线代码库中找到相关代码。你可以在 Python\
  \ 笔记本中运行它，也可以使用每个代码块的单独函数。在本章后面的“使用梯度提升对玻璃进行分类”一节中，你将看到如何实现网格搜索以自动化调优过程。尝试在该问题中实现这一点以加快你的调优过程。图\
  \ 7.5 显示了随着集成中树的增加，训练误差和测试误差是如何衰减的。这是另一个已经趋于平稳的案例。降低学习率可能会有所帮助。\n\n![Figure 7.5:\
