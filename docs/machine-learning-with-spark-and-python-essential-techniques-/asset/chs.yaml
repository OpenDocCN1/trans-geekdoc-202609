  \n###### 结果分析\n\n[图 5.12 展示了逻辑回归生成的系数。系数已按从小到大的顺序排列，以便更好地直观显示数值范围。按特征编号排序也可能很有用，特别是在本例中，顺序对应于从\
  \ `V0` 到 `V59` 持续增加的声纳频率。通过修改代码以不按大小排序来绘制曲线，测试你对代码的理解。\n\n![图 5.12：岩石与矿山的 PySpark\
  \ 有序系数图](img/c05f012.png)\n\n**图 5.12**：岩石与矿山的 PySpark 有序系数图\n\n图 5.13 展示了 PySpark\
  \ 逻辑回归模型的 ROC 曲线。正如打印出的 AUC 和一些具体预测所证实的那样，性能看起来相当不错。\n\n![图 5.13：预测岩石与矿山的 PySpark\
  \ 模型 ROC 曲线](img/c05f013.png)\n\n**图 5.13**：预测岩石与矿山的 PySpark 模型 ROC 曲线\n\n本节展示了如何使用\
  \ PySpark 逻辑回归，并介绍了用于执行所需数据转换的 PySpark `Pipeline` 框架。`Pipeline` 使代码结构相当整洁有序，并避免了为所有中间步骤构思新的\
  \ DataFrame 名称。下一节将展示如何使用 `StringIndexer` 对分类特征进行编码。这与在标签上使用 `StringIndexer` 略有不同。\n\
  \n### 在 PySpark 模型中引入分类变量：预测鲍鱼年龄\n\n本节将展示如何为鲍鱼问题构建回归模型。在鲍鱼数据上进行回归的唯一棘手部分在于 `sex`\
  \ 变量有三个值，因为未成熟的鲍鱼没有性别。性别只有在它们成熟时才会发育。因此，`sex` 变量有三个可能的值——`M`、`F` 和 `I`（代表 indeterminate\
  \ 或 immature）。我们有两个复杂因素需要理清。\n\n一个是分类变量（`sex`）首先会被索引。`StringIndexer` 会识别出有三个值。对于标签，索引器的输出可以直接使用，但这不适用于特征。如果我们只是在一列中放入\
  \ 0、1、2 来表示 `M`、`F` 或 `I`，那么算法会推断这些值之间存在顺序关系（1 > 0，2 > 1 等）。\n\n在 清单 5-10 中，分类变量（`sex`）的每个值都被分配了自己的列。`M`\
  \ 的列对于雄性样本为 1，对于其他样本为 0。这被称为*独热编码*。在 PySpark 中，跟在 `StringIndexer` 后面的 `OneHotEncoder`\
  \ 将执行此转换。\n\n第二个复杂因素是进行独热编码的列应该从传递给回归算法的数据中排除。原始变量会被一个行向量替换。在本例中，行向量有两个变量，每个可能的性别减一，因为其中一个变量值（例如\
  \ `M`）可以用全零来表示。清单 5-10 经历了以下过程。它将特征分离为分类特征和数值特征。对于每个分类变量，它运行 `StringIndexer` 和 `OneHotEncoder`\
  \ 转换，然后将该过程生成的向量与数值变量一起作为输入包含在向量组装过程中。然后该过程就是一个熟悉的回归过程。\n\n\n\n\n\n#### 清单 5.10：独热编码分类特征：鲍鱼数据——`abalone_data_spark.py`\n\
