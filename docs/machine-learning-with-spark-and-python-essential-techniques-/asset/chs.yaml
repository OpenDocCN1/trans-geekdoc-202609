  only showing top 5 rows\nR Squared on test data = 0.424898 \n```\n\n### 使用元参数优化的多类逻辑回归\n\
  \n本节介绍几个新要素。其中之一是使用字符串索引器转换多类问题中的标签。另一个是将 PySpark 逻辑回归用于多类问题。这些都是基于你已见内容的适度延伸。另一个新要素是使用参数网格搜索来确定元参数（如\
  \ ElasticNet 参数和正则化参数）的最佳值。\n\n该多类问题的基本编码（[清单 5-11）与 清单 5-9 中二分类问题的编码看起来相同。它适用于标签在单列中表示的情况，该列指示由字符串索引器分配给它们的编号。\n\
  \n参数搜索通过使用 `CrossValidator` 和 `ParameterGridBuilder` 来完成。代码展示了如何为正则化参数和 ElasticNet\
  \ 参数提供待搜索的值。最后，读出由交叉验证结果确定的最佳值。搜索确实带来了改进。\n\n#### 清单 5.11：构建并优化用于玻璃分类的 PySpark 模型的代码——`glass_log_regress_spark.py`\n\
  \n\n\n\n> ```\n> __author__ = 'mike_bowles'\n> \n> # Import sparksession \n> from\
