  > \n> \n> spark = SparkSession.builder.appName(\"glass_mc_log_regress\").getOrCreate()\n\
  > \n> # read glass data into pandas data frame and create spark df\n> glass_df =\
  \ pd_read_glass()\n> \n> # Create spark dataframe for glass data\n> glass_sp_df\
