  \n## Summary\n\n本章演示了惩罚回归的使用以及许多用于预测建模的通用工具。本章展示了几种您将经常遇到的不同类型的问题。这些包括回归、二分类和多分类。本章使用体现各种不同风格惩罚回归的\
  \ Python 包来完成这些任务。此外，本章还演示了解决您遇到的建模问题所需的几种工具的使用。这些包括将因子变量编码为数值的技术、使用二分类器解决多分类问题的技术，以及扩展线性方法以预测属性与结果之间非线性关系的技术。\n\
  \n本章还演示了多种量化预测模型性能的方法。回归问题最容易量化，因为它们的误差自然可以用实数来表示。分类问题可能更复杂。您看到了分类性能被量化为误分类错误率、接收者操作特征曲线下面积和经济成本。您应该选择最接近以您的实际目标（业务目标、科学目标等）衡量性能的方法。\n\
  \n随后，本章介绍了许多不同的问题设置（多分类、分类变量、回归、分类），并展示了如何使用 PySpark 构建解决方案。此外，本章还涵盖了一系列用于构建模型和评估其性能的工具。您将在\
  \ Chapter 6 中再次看到许多相同的工具，届时我们将把它们与集成模型一起使用。\n\n## References\n\n1.  P. Cortez, A.\
  \ Cerdeira, F. Almeida, T. Matos, and J. Reis. (2009). “Modeling Wine Preferences\
  \ by Data Mining from Physicochemical Properties.” *Decision Support Systems*, Elsevier,\
  \ 47(4):547–553.\n\n2.  T. Hastie, R. Tibshirani, and J. Friedman. (2009). *The\
  \ Elements of Statistical Learning: Data Mining, Inference, and Prediction*. 2nd\
  \ ed. Springer-Verlag, New York.\n\n3.  J. Friedman, T. Hastie, and R. Tibshirani.\
  \ (2010). “Regularization Paths for Generalized Linear Models via Coordinate Descent.”\
  \ *Journal of Statistical Software*, 33(1).\n\n4.  K. Bache and M. Lichman. (2013).\
  \ UCI Machine Learning Repository. Irvine, CA: University of California, School\
  \ of Information and Computer Science. `http://archive.ics.uci.edu/ml`.\n\n# Chapter\
  \ 6: Ensemble Methods\n\n集成方法源于这样一个观察：如果模型之间相对独立，多个模型的性能优于单个模型。一个正确率为 55% 的分类器仅属于平庸水平，但如果您拥有\
  \ 100 个正确率均为 55% 的分类器，它们大多数正确的概率将跃升至 82%。（请自行搜索“cumulative binomial probability”并尝试一些数字。）\n\
  \n获得一组相对独立模型的一种方法是使用不同的机器学习算法。例如，您可以使用支持向量机、线性回归、K 近邻、二叉决策树等构建模型。但很难通过这种方式获得非常长的模型列表。此外，这很繁琐，因为不同模型具有需要单独调整的不同参数，且可能对输入数据有不同要求。因此，模型需要单独编码。这无法满足生成数百或数千个模型的需求（您很快就会这样做）。\n\
  \n因此，集成方法的关键在于开发一种算法方法，生成大量相对独立的模型，然后将它们组合成一个集成。在本章中，您将学习最流行的方法是如何实现这一点的。本章将讲解最流行的集成方法的机制，概述算法的基本结构，并通过\
  \ Python 代码演示这些算法，以帮助您深入理解其工作原理。\n\n集成方法采用两层算法层次结构。低层算法称为*基学习器*。基学习器是一种单一的机器学习算法，用于生成将被聚合到集成中的所有模型。本章将主要使用二叉决策树作为基学习器。上层算法操纵基学习器的输入，使其生成的模型相对独立。相同的算法如何生成不同的模型？有几种广泛使用的上层算法。它们被称为*Bagging*、*Boosting*\
  \ 和*随机森林*。（严格来说，随机森林是上层算法与二叉决策树特定修改的结合体。您将在“Random Forests”一节中看到更多详细信息。）\n\n\n\n\
  ## 二叉决策树\n\n许多不同的算法都可以作为基学习器——二叉决策树、支持向量机等——但从实际应用来看，二叉决策树是最广泛使用的。它们是你将在项目中使用的开源和商业软件包中的基学习器。集成模型是由数百或数千棵二叉决策树组成的集合，这些集成模型的许多特性都是从二叉决策树继承而来的。因此，本章将从二叉决策树简介开始。\n\
  \n二叉决策树通过让属性经历一系列二元（是/否）决策来运作。每个决策会导致两种可能性之一：要么进入另一个决策，要么得出一个预测。一个训练好的树的例子将有助于巩固这一概念。在理解训练结果后，你将学习训练是如何工作的。\n\
  \n清单 6-1 展示了使用 scikit-learn 的 `DecisionTreeRegressor` 包为葡萄酒质量数据构建二叉决策树的代码。图 6.1\
  \ 描绘了由清单 6-1 生成的训练好的树。\n\n#### 清单 6-1：构建决策树预测葡萄酒质量——wineTree.py\n\n```\n__author__\
  \ = 'mike-bowles'\n\nimport numpy\nfrom sklearn import tree\nfrom sklearn.tree import\
  \ DecisionTreeRegressor\nfrom sklearn.tree import export_graphviz\nfrom sklearn.externals.six\
  \ import StringIO  \nfrom IPython.display import Image \nfrom math import sqrt\n\
  import matplotlib.pyplot as plot\nfrom Read_Fcns import list_read_wine\nimport pydotplus\n\
  \n#read data into iterable\nnames, xList, labels = list_read_wine()\n\nwineTree\
  \ = DecisionTreeRegressor(max_depth=3)\nwineTree.fit(xList, labels)\n\nf = StringIO()\n\
  export_graphviz(wineTree, out_file=f, filled=True, rounded=True,\n        special_characters=True)\n\
  graph = pydotplus.graph_from_dot_data(f.getvalue()) \nImage(graph.create_png())\n\
  #Note: You'll need to install pydotplus to draw this graph.\n##### conda install\
  \ -c conda-forge pydotplus \n```\n\n![图 6.1：用于确定葡萄酒质量的决策树](img/c06f001.png)\n\n\
  **图 6.1**：用于确定葡萄酒质量的决策树\n\n图 6.1 展示了在葡萄酒质量数据上训练产生的一系列决策。训练好的树的框图显示了许多方框，在决策树术语中称为\
  \ `nodes`（节点）。节点分为两类：节点要么向数据提出一个是/否问题，要么是为最终落入其中的样本分配预测值的终端节点。终端节点通常被称为 `leaf`（叶）节点。在图\
  \ 6.1 中，终端节点是图底部那些没有分支或进一步决策节点的节点。\n\n### 二叉决策树如何生成预测\n\n当一个观测值或行被传递给非终端节点时，该行回答节点的问题。如果回答是，该属性行被传递给当前节点下方左侧的叶节点。如果回答否，该属性行被传递给当前节点下方右侧的叶节点。该过程递归继续，直到该行到达终端（即叶）节点，在那里为该行分配一个预测值。叶节点分配的值是所有最终落入该叶节点的训练观测值结果的平均值。\n\
  \n虽然在这棵树中，第二个决策在树的两个分支中都涉及变量 `X[9]`，但这两个决策可以针对不同的属性。（例如，见第三层决策。）\n\n看顶部节点，称为 `root`（根）节点。该节点提出问题\
  \ `X[10] <= 10.525`。在二叉决策树中，重要的变量会被尽早分裂（或靠近树顶），因此决策树认为变量 `X[10]`，即酒精含量，很重要。在这方面，它与第\
  \ 5 章“使用惩罚线性方法构建预测模型”中的惩罚线性回归一致，后者也认为酒精含量是决定葡萄酒质量最重要的因素。\n\n图 6.1 中的树被称为深度为 3。树的深度定义为沿树中最长路径向下必须做出的决策数量。“树的训练等于分裂点选择”部分的训练讨论将向你展示，所有通往终端节点的路径没有理由必须长度相同（就像在图\
  \ 6.1 中那样）。\n\n你现在对训练好的树的样子有了一定了解，也看到了如何使用训练好的树进行预测。现在你将看到树是如何被训练的。\n\n### 如何训练二叉决策树\n\
  \n了解树如何训练的最简单方法是看一个简单的例子。清单 6-2 展示了给定一个实数属性预测实数标签的例子。该数据集是在代码中创建的（所谓的合成数据）。基本思想是单个属性\
  \ `x` 在 -0.5 和 +0.5 之间有 100 个等间距值。标签向量 `y` 等于特征向量 `x`，并加上一些随机噪声。\n\n#### 清单 6-2：为简单回归问题训练决策树——simpleTree.py\n\
  \n\n\n##### 树训练等于分裂点选择\n\n```python\n__author__ = 'mike-bowles'\n\nimport numpy\
  \ as np\nimport matplotlib.pyplot as plt\nfrom sklearn import tree\nfrom sklearn.tree\
  \ import DecisionTreeRegressor\nfrom sklearn.externals.six import StringIO\nfrom\
  \ sklearn.tree import export_graphviz\nfrom IPython.display import Image \nimport\
  \ pydotplus\n\n##### 构建一个简单的数据集，y = x + 随机噪声\nnPoints = 100\n\n##### 用于绘图的 x 值\n\
  x = np.linspace(-0.5, 0.5, nPoints)\ntree_depth = 2\n\n##### y（标签）在 x 值基础上添加了随机噪声\n\
  ##### 设置随机种子\nnp.random.seed(1)\ny = x + np.random.randn(nPoints) * 0.1\n\nplt.plot(x,\
  \ y)\nplt.axis('tight')\nplt.xlabel('x') \nplt.ylabel('y')\nplt.title('标签 (y) 与特征\
  \ (x) 的可视化')\nplt.savefig('Labels_versus_attribute_visualization_ex.png', dpi=500)\n\
  plt.show()\n\nx_feat = x.reshape([-1, 1])\nsimpleTree = DecisionTreeRegressor(max_depth=tree_depth)\n\
  simpleTree.fit(x_feat, y)\n\n##### 绘制树 -- 此代码块需要在独立的单元格中运行\nf = StringIO()\nexport_graphviz(simpleTree,\
  \ out_file=f, filled=True, rounded=True, \n         special_characters=True)\ngraph\
  \ = pydotplus.graph_from_dot_data(f.getvalue()) \nImage(graph.create_png())\n\n\
  ##### 将树的预测与真实值进行比较\n\nyHat = simpleTree.predict(x_feat)\n\nplt.figure()\nplt.plot(x,\
  \ y, label='真实 y')\nplt.plot(x, yHat, label='树预测 ', linestyle='--')\nplt.legend(bbox_to_anchor=(1,\
  \ 0.2))\nplt.axis('tight')\nplt.xlabel('x')\nplt.ylabel('预测值与实际值')\nplt.title('实际值与预测值的比较\
  \ - 深度 = ' + str(tree_depth))\nplt.savefig('simpleTreeActuaVPrediction_' + str(tree_depth)\
  \ + '.png', \n            dpi=500)\nplt.show()\n\n##### 绘制树\nf = StringIO()\nexport_graphviz(simpleTree,\
  \ out_file=f, filled=True, rounded=True, \n      special_characters=True)\ngraph\
  \ = pydotplus.graph_from_dot_data(f.getvalue()) \nImage(graph.create_png())\n\n\n\
  ##### 分裂点计算 - 尝试每一个可能的分裂点以找到最佳分裂点\nsse = []\nxMin = []\nfor i in range(1, nPoints):\n\
  \    # 根据分裂点将 y 数组分为左侧和右侧的点\n    lh_array = y[0:i]\n    rh_array = y[i:]\n   \n\
  \    # 计算各侧的平均值\n    lhAvg = np.average(lh_array)\n    rhAvg = np.average(rh_array)\n\
  \n    # 计算左侧、右侧和总和的平方误差和\n    lhSse = np.sum((lh_array - lhAvg) * (lh_array - lhAvg))\n\
  \    rhSse = np.sum((rh_array - rhAvg) * (rh_array - rhAvg))\n\n    # 将左右误差之和加入误差列表\n\
  \    sse.append(lhSse + rhSse)\n   \nplt.plot(x[1:], sse)\nplt.xlabel('x 分裂点值')\n\
  plt.ylabel('平方误差和')\nplt.title('平方误差和与分裂点位置的关系')\nplt.savefig('Error_vs_split_pt_location.png',\
  \ dpi=500)\nplt.show() \n```\n\n图 6.2 绘制了标签 `y` 与单个属性 `x` 的关系。正如预期的那样，`y` 大致遵循 `x`\
  \ 但带有一些随机性。\n\n![图 6.2: 简单示例的标签与属性关系](img/c06f002.png)\n\n**图 6.2**：简单示例的标签与属性关系\n\
  \n### 分裂点选择如何影响预测\n\n清单 6-2 的第一步是运行 scikit-learn 的回归树包并指定深度为 1。该过程的结果如 图 6.3 所示。图\
  \ 6.3 展示了深度为 1 的树的框图。深度为 1 的树也称为*树桩*。根节点的单一决策是将属性值与 -0.071 进行比较。这个数字称为*分裂点*，因为它将数据分成两组。决策节点发出的两个框表明，100\
  \ 个输入样本中有 43 个沿树的左分支向下，剩余 57 个样本沿右分支向下。如果属性值小于分裂点，则树的预测值为框图中指示的 value 值——大约为 -0.3。\n\
  \n![图 6.3: 简单问题深度 1 树的框图](img/c06f003.png)\n\n**图 6.3**：简单问题深度 1 树的框图\n\n查看训练好的树的另一种方式是观察其预测值与标签真实值的对比。由于这个简单的合成问题只有一个属性，将训练好的树生成的预测值与实际值一起绘制，可以初步了解这个简单树的训练过程。图\
  \ 6.4 中显示的预测值遵循一个简单的规则。预测是属性的阶跃函数。阶跃发生在分裂点处。\n\n![图 6.4: 简单示例中预测值与实际值相对于属性的比较](img/c06f004.png)\n\
  \n**图 6.4**：简单示例中预测值与实际值相对于属性的比较\n\n### 选择分裂点的算法\n\n指定这棵简单树只需要三个量：分裂点的值，以及当预测落入两个可能的点组中的任意一组时所赋予的预测值。获得这些量的过程发生在树的训练期间。具体工作原理如下。树的训练旨在最小化其预测的平方误差。首先假设分裂点已知。一旦分裂点确定，分配给两个组的值也就确定了。每组的平均值是使均方误差最小化的单一量。这就只剩下如何确定分裂点的问题了。清单\
  \ 6-2 中有一小段代码演示了确定分裂点的过程。该过程是尝试每一个可能的分裂点。具体做法是将数据分成两组，用各组的平均值近似每组，然后计算由此产生的平方误差和。\n\
  \n图 6.5 展示了平方误差和如何随分裂点位置变化。训练决策树意味着穷举搜索所有可能的分裂点，以确定哪一个能使平方误差和最小化。正如你所见，在数据集大致中点处存在一个明确的最小值。你也可以看到由于引入的噪声导致的一些随机变化。你可能也会想到，随着数据量增加，部分随机性会变得平滑。你将在本章后面关于装袋法的部分看到这一点的演示。\n\
  \n![图 6.5: 每个可能分裂点位置产生的平方误差和](img/c06f005.png)\n\n**图 6.5**：每个可能分裂点位置产生的平方误差和\n\n\
  ### 多变量树训练——选择哪个属性进行分裂？\n\n如果问题有不止一个属性怎么办？那么算法会检查所有属性的所有可能分裂点，看哪个分裂点能给每个属性带来最佳的平方误差和，进而确定哪个属性能给出总体最小值。\n\
  \n这种分裂点计算是训练决策树计算周期的主要消耗所在——延伸而言，也是训练树集成模型计算周期的主要消耗所在。如果用于分裂的属性没有重复值，则每个数据点（减一）都有一个分裂点需要检查。\n\
  \n\n\n\n随着数据集变大，分裂点计算的数量与数据集大小成正比。被检查的分裂点也可能变得极其接近。为超大数据集设计的算法允许分裂点检查比数据的原始粒度粗得多。论文“PLANET:\
  \ Massively Parallel Learning of Tree Ensembles with MapReduce”中阐述了一种方法，概述了 Google\
  \ 工程师在大数据集上构建决策树算法所采取的方法。正如论文中提到的，他们想要决策树算法以便实现梯度提升（本章后面将学习的集成算法之一）。\n\n#### 递归分裂以增加树深度\n\
  \nListing 6-2 展示了随着树深度从 1 增加到 2，预测曲线发生的变化。生成的预测曲线如 Figure 6.6 所示，树的框图如 Figure 6.7\
  \ 所示。预测曲线不再是单个阶跃，而是有三个阶跃。第二组分裂点的确定方式与第一组相同。树中的每个节点处理由其上方分裂确定的点子集。每个节点的分裂点旨在最小化其下方两个节点中的平方误差之和。Figure\
  \ 6.6 中的曲线用更精细的阶跃函数逼近实际曲线。更大的树深度会产生更精细的阶跃，并对训练数据有更高的保真度。这种情况会无限持续下去吗？\n\n![Figure\
  \ 6.6: Prediction using depth 2 tree](img/c06f006.png)\n\n**Figure 6.6** (#c06.xhtml#R_c06-fig-0006):\
  \ Prediction using depth 2 tree\n\n![Figure 6.7: Block diagram for depth 2 tree](img/c06f007.png)\n\
  \n**Figure 6.7** (#c06.xhtml#R_c06-fig-0007): Block diagram for depth 2 tree\n\n\
  随着分裂的继续，最深节点中的样本数量减少。这可能导致分裂在达到指定深度之前终止。如果一个节点中只有一个样本，分裂当然无法继续。树训练算法通常有一个参数，用于控制要分裂的最小样本量。节点中的小样本量可能导致预测结果的高方差。\n\
  \n### 二叉树的过拟合\n\n上一节展示了如何训练任意深度的二叉决策树。二叉树会过拟合吗？本节讨论如何测量和调节二叉树的过拟合。二叉树过拟合的机制与你在 Chapter\
  \ 4 “惩罚线性回归” 和 Chapter 5 中看到的不同，但你会在症状和过拟合测量方法上看到一些相似之处。你将看到二叉树具有参数（例如树深度和最小叶节点大小），可用于调节模型复杂度，这与你在\
  \ Chapter 4 和 Chapter 5 中看到的过程类似。\n\n#### 用二叉树测量过拟合\n\nFigure 6.8 展示了将树深度增加到 6 时会发生什么。在\
  \ Figure 6.8 中，很难分辨真实值与预测值的区别。预测几乎跟随每一个锯齿变化。这开始暗示模型正在过拟合数据。数据生成方式表明，最佳预测应为预测值等于属性值。添加到属性中的噪声是不可预测的，但预测却跟随了标签因噪声偏离属性值的情况。合成数据提供了知道正确答案的便利。\n\
  \n用二叉树查看过拟合的另一种方式是考虑树中终端节点的数量与可用数据量的对比。生成 Figure 6.8 所示预测的树深度为 6。这意味着它有 64 个终端节点\
  \ (2⁶)。数据集中有 100 个点。这意味着许多点是终端节点的唯一占有者，因此它们的预测值精确匹配其观测值。难怪预测图会匹配由噪声引起的摆动。\n\n![Figure\
  \ 6.8: Prediction using depth 6 tree](img/c06f008.png)\n\n**Figure 6.8** (#c06.xhtml#R_c06-fig-0008):\
  \ Prediction using depth 6 tree\n\n#### 平衡二叉树复杂度以获得最佳性能\n\n在实际问题中，可以执行交叉验证来控制过拟合。Listing\
  \ 6-3 展示了在不同深度的树上针对该简单问题运行的 10 折交叉验证。代码清单显示了两个循环。外层循环为内层交叉验证循环定义树深度。内层循环划分数据并进行\
  \ 10 次迭代以计算样本外误差。每个深度的均方误差 (MSE) 结果绘制在 Figure 6.9 中。\n\n![Figure 6.9: Out-of-sample\
  \ error versus tree depth for simple problem](img/c06f009.png)\n\n**Figure 6.9**\
  \ (#c06.xhtml#R_c06-fig-0009): Out-of-sample error versus tree depth for simple\
  \ problem\n\n#### Listing 6-3 (#c06.xhtml#R_c06-fea-0003): Cross-Validation at a\
  \ Range of Tree Depths—simpleTreeCV.py\n\n```\n__author__ = 'mike-bowles'\n\nimport\
  \ numpy as np\nimport matplotlib.pyplot as plt\nfrom sklearn import tree\nfrom sklearn.tree\
  \ import DecisionTreeRegressor\n\n\n#Build a simple data set with y = x + random\n\
  nPoints = 1000\n\n#x values for plotting\nx = np.linspace(-0.5, 0.5, nPoints)\n\
  x_feat = x.reshape([-1,1])\n\n#y (labels) has random noise added to x-value\n#set\
  \ seed\nnp.random.seed(1)\ny = x + np.random.randn(nPoints) * 0.1\n\n#perform 10-fold\
  \ x-val to see what tree depth works best.\nnrow = nPoints\ndepthList = [1, 2, 3,\
  \ 4, 5, 6, 7]\nxvalMSE = []\nnxval = 10\n\nfor iDepth in depthList:\n\n    #build\
  \ x-val loop to fit tree and evaluate on out of sample data\n    oosMSE = 0.0\n\
  \    for ixval in range(nxval):\n\n        #Define test and training index sets\n\
  \        idxTest = [a for a in range(nrow) if a%nxval == ixval%nxval]\n        idxTrain\
  \ = [a for a in range(nrow) if a%nxval != ixval%nxval]\n\n        #Define test and\
  \ training attribute and label sets\n        xTrain = x_feat[idxTrain]\n       \
  \ xTest = x_feat[idxTest]\n        yTrain = y[idxTrain]\n        yTest = y[idxTest]\n\
  \n        #train trees of various depths and accumulate test errors\n        treeModel\
  \ = DecisionTreeRegressor(max_depth=iDepth)\n        treeModel.fit(xTrain, yTrain)\n\
  \   \n        treePrediction = treeModel.predict(xTest)\n        error = yTest -\
  \ treePrediction\n\n        oosMSE += np.average(error * error) / nxval\n\n    #average\
  \ the squared errors and accumulate by tree depth\n\n    xvalMSE.append(oosMSE)\n\
  \nplt.plot(depthList, xvalMSE)\nplt.axis('tight')\nplt.xlabel('Tree Depth' )\nplt.ylabel('Mean\
  \ Squared Error')\nplt.title('MSE versus Tree Depth - '+ str(nPoints) + ' pts')\n\
  plt.savefig('CV_Perf_vs_Tree_depth-' + str(nPoints) +  '.png', dpi=500)\nplt.show()\
  \ \n```\n\n树深度是调节二叉树模型复杂度的一种方式。它的效果类似于 Chapter 4 和 Chapter 5 中惩罚回归模型中的系数惩罚。更大的树深度使模型能够以增加复杂度为代价从数据中提取更复杂的行为。Figure\
  \ 6.8 显示，对于 Listing 6-2 中的合成问题，深度 3 给出了最佳的 MSE 性能。该深度在复现潜在关系和过拟合问题之间做出了最佳权衡。\n\n\
  \n\n回顾第 3 章“预测模型构建：平衡性能、复杂度与大数据”，最优模型复杂度是数据集大小的函数。这个合成数据问题提供了一个演示该原理的机会。图 6.10 展示了如果将数据点数量增加到\
  \ 1000，最优模型复杂度和性能会如何变化。\n\n![图 6.10：1000 个数据点下的样本外 MSE 与树深度关系](img/c06f010.png)\n\
  \n**图 6.10**：1000 个数据点下的样本外 MSE 与树深度关系\n\n你可以通过将清单 6-3 中的变量`nPoints`改为`1000`来自行运行绘图。增加数据会导致两个结果：首先，最佳树深度从\
  \ 3 增加到 4。增加的数据支持更复杂的模型。其次，MSE 略微下降。增加的深度允许在真实模型的阶梯近似中使用更精细的步长。这种模型保真度的提高正是大数据集令人兴奋的地方。\n\
  \n### 分类和分类特征的修改\n\n为了让你完整了解决策树是如何训练的，我们还需要讨论几个细节。其中之一是：这如何用于分类问题？之前用于判断分裂的标准——MSE——仅适用于回归问题。正如你在本书其他地方所见，分类问题有不同于回归问题的优劣指标。有几种优劣指标可用于分类问题，以替代\
  \ MSE 来判断分裂。你已经熟悉的一种是误分类误差。另外两种常用的度量是基尼不纯度度量和信息增益。更多信息请参见`http://en.wikipedia.org/wiki/Decision_tree_learning#Gini_impurity`。这另外两种度量与误分类误差具有略微不同的属性，但在概念上并无不同。\n\
  \n最后一个细节是如何基于分类属性而非数值属性训练树。树中的（非终端）节点提出一个是/否问题。对于数值变量，问题的形式是给定属性是否小于某个参数。将分类变量分成两个子集，包含尝试将类别划分为两组的每一种可能分法。如果类别为\
  \ A、B 和 C，可能的分裂有：A 在第一组而 B 和 C 在第二组，B 在第一组而 A 和 C 在第二组，以此类推。在某些情况下，一些数学结果可以简化这一过程。\n\
  \n本节提供了二元决策树的一些背景知识。二元决策树本身就是一个合法的预测工具，值得研究，但在此概述它们的主要目的是作为集成方法的背景，后者包含大量二元决策树。你将看到，使用单个树时出现的一些问题（需要调整的多个参数、结构不稳定性、大树过拟合）在成百上千棵树组合时会退居次要地位。这正是开发集成方法的初衷，它们具有显著的鲁棒性、易于训练且准确。接下来的章节将逐一讨论三种主要的集成方法。\n\
  \n## Bootstrap 聚合：“Bagging”\n\nBootstrap 聚合由 Leo Breiman 开发。该方法始于选择一个基学习器。这里将使用二元决策树作为基学习器来实现该方法。随着方法的推进，你会看到其他机器学习算法也可用作基学习器。二元决策树是合乎逻辑的选择，因为它们自然地建模具有复杂决策边界的问题，但二元决策树可能表现出过大的性能方差。通过组合大量基于树的模型可以克服方差。\n\
  \n### Bagging 算法如何工作？\n\nBootstrap 聚合算法使用所谓的*bootstrap*样本。Bootstrap 样本常用于从适度大小的数据集生成样本统计量。一个（非参数）bootstrap\
  \ 样本是从数据集中有放回地随机选择若干元素（即 bootstrap 样本可以包含原始数据中某一行的多个副本）。Bootstrap 聚合从训练数据集中获取若干个\
  \ bootstrap 样本，然后在每个样本上训练一个基学习器。对于回归问题，将生成的模型进行平均。对于分类问题，模型可以进行平均，也可以基于不同类别的百分比生成概率。清单\
  \ 6-4 展示了将 bagging 算法应用于本章开头介绍的合成问题的代码。\n\n该代码保留 30%的数据用于测量样本外性能，而不是使用交叉验证。参数`numTreesMax`决定集成中包含的最大树数量。代码构建从第\
  \ 1 棵树、前 2 棵树、前 3 棵树，以此类推，直到`numTreesMax`棵树的模型，以观察准确率如何随集成中包含的树的数量而变化。代码将训练好的模型存储在列表中，并将保留用于样本外误差测试的数据的预测结果存储起来。\n\
  \n#### 清单 6-4：Bootstrap 聚合算法——simpleBagging.py\n\n\n\n\n```python\n__author__ =\
  \ 'mike-bowles'\n\nimport numpy as np\nimport matplotlib.pyplot as plt\nfrom sklearn\
  \ import tree\nfrom sklearn.tree import DecisionTreeRegressor\nfrom math import\
  \ floor\nfrom numpy.random import choice\n\n\n##### 构建一个简单的数据集，y = x + 随机噪声\nnPoints\
  \ = 1000\n\n##### 用于绘图的 x 值\nx = np.linspace(-0.5, 0.5, nPoints)\nx_feat = x.reshape([-1,\
  \ 1])\n\n##### y（标签）在 x 值基础上添加了随机噪声\n##### 设置随机种子\nnp.random.seed(1)\ny = x + np.random.randn(nPoints)\
  \ * 0.1\n\n##### 取固定测试集，占样本的 30%\nindices = list(range(nPoints))\nnSample = int(nPoints\
  \ * 0.30)\nidxTest = choice(indices, nSample, replace=False)\nidxTest.sort()\nidxTrain\
  \ = [idx for idx in indices if not (idx in idxTest)]\n\n##### 定义测试集和训练集的属性与标签\n\
  xTrain = x_feat[idxTrain]\nxTest = x_feat[idxTest]\nyTrain = y[idxTrain]\nyTest\
  \ = y[idxTest]\nidx_Train = list(range(len(xTrain)))\n\n##### 在训练数据的随机子集上训练一系列模型\n\
  ##### 将模型收集在列表中，并检查随着列表增长组合模型的误差\n\n##### 要生成的最大模型数量\nnumTreesMax = 20\n\n#####\
  \ 树的深度 - 通常取较高值\ntreeDepth = 1\n\n##### 初始化一个列表来保存模型\nmodelList = []\npredList =\
  \ []\n\n##### 随机装袋法抽取的样本数量\nnBagSamples = int(len(xTrain) * 0.5)\n\nfor iTrees in\
  \ range(numTreesMax):\n    # 取装袋样本并定义训练集\n    idxBag = choice(idx_Train, nBagSamples,\
  \ replace=True)\n    xTrainBag = xTrain[idxBag]\n    yTrainBag = yTrain[idxBag]\n\
  \n    modelList.append(DecisionTreeRegressor(max_depth=treeDepth))\n    modelList[-1].fit(xTrainBag,\
  \ yTrainBag)\n\n    # 使用最新模型进行预测并添加到预测列表中\n    latestPrediction = modelList[-1].predict(xTest)\n\
  \    predList.append(latestPrediction)\n\n\n##### 从前 \"n\" 个模型构建累积预测\nmse = []\n\
  allPredictions = []\n\nfor iModels in range(len(modelList)):\n    prediction_i =\
  \ np.zeros_like(predList[0])\n    for i in range(iModels):\n        prediction_i\
  \ += predList[i] / float(iModels + 1)\n\n    allPredictions.append(prediction_i)\n\
  \    errors = yTest - prediction_i\n    mse.append(np.average(errors * errors))\n\
  \nnModels = [i + 1 for i in range(numTreesMax)]\n\nplt.plot(nModels, mse)\nplt.axis('tight')\n\
  plt.xlabel('集成模型中的树的数量')\nplt.ylabel('均方误差')\nplt.ylim((0.0, max(mse)))\nplt.title('MSE\
  \ 与集成树数量的关系 - 深度 = ' + str(treeDepth))\nplt.savefig('bagging_mse_vs_nTrees_' + str(treeDepth)\
  \ + '.png', dpi=500)\nplt.show()\n\nplotList = [0, 9, 19]\nfor iPlot in plotList:\n\
  \    plt.plot(xTest, allPredictions[iPlot], label=str(iPlot))\nplt.plot(xTest, yTest,\
  \ linestyle=\"--\")\nplt.legend()\nplt.axis('tight')\nplt.xlabel('x 值')\nplt.ylabel('预测值')\n\
  plt.title('预测曲线形状 - 深度 = ' + str(treeDepth))\nplt.savefig('bagging_response_curve_vs_nTrees_'\
  \ + str(treeDepth) + '.png', dpi=500)\nplt.show()\n\nprint('最小 MSE')\nprint(min(mse))\n\
  ```\n\n打印输出：\n\n`treeDepth = 1` 时\n最小 MSE\n0.0277111866174121\n\n`treeDepth = 5`\
  \ 时\n最小 MSE\n0.012089941293578658\n\n该代码生成两张图。一张展示了随着集成中包含的树越来越多，MSE 如何变化。第二张展示了第一棵树的预测、前\
  \ 10 棵树的平均预测和前 20 棵树的平均预测之间的对比。该对比图类似于单属性函数下预测曲线与实际标签的对比图。\n\n图 6.11 展示了 MSE 随树数量增加而变化的情况。误差大致在\
  \ 0.025 左右趋于稳定。这并不是一个特别好的模型。添加的噪声标准差为 0.1。预测算法能达到的最佳 MSE 是该标准差的平方，即 0.01。本章早先训练的单棵二叉树接近\
  \ 0.01。为什么这个更复杂的算法表现反而不佳？\n\n![图 6.11：装袋集成中 MSE 与树数量的关系](img/c06f011.png)\n\n**图\
  \ 6.11**：装袋集成中 MSE 与树数量的关系\n\n#### 装袋性能——偏差与方差\n\n查看 图 6.12 可以深入了解问题所在，并提出一个重要观点，因为这与其他问题也息息相关。图\
  \ 6.12 展示了单棵树预测、10 棵树预测和 20 棵树预测。单棵树的预测很容易辨别，因为只有一个阶跃。10 棵和 20 棵树的预测叠加了多棵略有不同的树，因此它们在第一棵树所采取的单个阶跃附近呈现出一系列更精细的阶跃。多棵树的阶跃点并不完全在同一位置，因为它们是在不同的数据样本上训练的，这导致分裂点存在一些随机性。但这种随机性仅在图表中心附近的一个相对较小的邻域内抖动分裂点。因此，最终的集成模型没有看到太多的多样性，因为集成中的所有树大致都认同单个分裂点应该放在哪里。\n\
  \n![图 6.12：作为属性函数的预测值与实际标签对比](img/c06f012.png)\n\n**图 6.12**：作为属性函数的预测值与实际标签对比\n\
  \n存在两类误差：偏差和方差。考虑用一条直线去拟合一条蜿蜒曲线。获取更多数据可以减少用于拟合的数据中噪声的影响，但更多数据无法将直线变成蜿蜒曲线。随着数据点增加而不减小的误差称为*偏差误差*。将深度为\
  \ 1 的树拟合到该合成问题上就存在偏差误差。所有分裂点都选在数据中心附近，导致模型在数据边缘处准确率下降。\n\n深度为 1 的树产生的偏差误差源于基础模型过于简单并共享一个共同的局限性。装袋法减少的是模型间的方差。但对于深度为\
  \ 1 的树，它得到的是偏差误差，这无法通过平均来消除。解决该问题的方法是使用深度更大的树。\n\n图 6.13 展示了深度为 5 的树在集成中 MSE 随树数量变化的曲线。深度为\
  \ 5 的树的 MSE 略小于 0.01（可能是由于噪声数据的随机性），性能明显优于深度为 1 的树。\n\n图 6.14 展示了基于第一棵树、前 10 棵树和前\
  \ 20 棵树的预测图。单棵树的预测与其他预测截然不同，因为它有许多尖锐的尖峰，即犯下严重错误的地方。换句话说，它具有高方差。其他单棵树无疑表现出类似的性能。但当它们平均后，方差降低了；代表装袋算法预测的曲线变得平滑得多，也更接近真实答案。\n\
  \n![图 6.13：深度为 5 的树的 MSE 与树数量关系](img/c06f013.png)\n\n**图 6.13**：深度为 5 的树的 MSE 与树数量关系\n\
  \n![图 6.14：深度为 5 的树的预测值与实际标签对比](img/c06f014.png)\n\n**图 6.14**：深度为 5 的树的预测值与实际标签对比\n\
  \n#### 装袋法在多变量问题上的表现\n\n\n\n\n\nListing 6-5 展示了装袋法算法在预测葡萄酒质量任务中的应用。葡萄酒示例演示了与你在合成数据中看到的相同原则。这些原则在\
  \ Figures 6.15 到 6.17 中体现得最为明显，这些图表来自于使用不同参数设置运行 Listing 6-4 的结果。\n\n### Listing\
  \ 6-5：使用装袋法预测葡萄酒质量——wineBagging.py\n\n```\n__author__ = 'mike-bowles'\n\nimport\
  \ numpy as np\nfrom sklearn import tree\nfrom sklearn.tree import DecisionTreeRegressor\n\
  from numpy.random import choice\nfrom math import sqrt\nimport matplotlib.pyplot\
  \ as plt\n\nfrom Read_Fcns import list_read_wine\n\n##### 将数据读入可迭代对象\nnames, xList,\
  \ labels = list_read_wine()\nxArray = np.array(xList)\nyArray = np.array(labels)\n\
  \nnrows = len(xList)\nncols = len(xList[0])\n\n\n##### 取固定测试集，占样本的 30%\nindices\
  \ = list(range(nrows))\nnSample = int(nrows * 0.30)\nidxTest = choice(indices, nSample,\
  \ replace=False)\nidxTrain = [idx for idx in indices if not(idx in idxTest)]\n\n\
  ##### 定义测试集和训练集的属性及标签集\nxTrain = xArray[idxTrain]\nxTest = xArray[idxTest]\nyTrain\
  \ = yArray[idxTrain]\nyTest = yArray[idxTest]\nidx_Train = list(range(len(xTrain)))\n\
  \n##### 在训练数据的随机子集上训练一系列模型\n##### 将模型收集在列表中，并检查随着列表增长组合模型的误差\n\n##### 要生成的最大模型数量\n\
  numTreesMax = 100\n\n##### 树的深度 - 通常取较高值\ntreeDepth = 12\n\n##### 初始化一个列表以保存模型\n\
  modelList = []\npredList = []\n\n##### 随机装袋法要抽取的样本数量\nnBagSamples = int(len(xTrain)\
  \ * 0.5)\n  \nfor iTrees in range(numTreesMax):\n    idxBag = choice(range(len(xTrain)),\
  \ nBagSamples, replace=True)\n    xTrainBag = xTrain[idxBag]\n    yTrainBag = yTrain[idxBag]\n\
  \n    modelList.append(DecisionTreeRegressor(max_depth=treeDepth))\n    modelList[-1].fit(xTrainBag,\
  \ yTrainBag)\n\n    # 使用最新模型进行预测并添加到预测列表中\n    latestPrediction = modelList[-1].predict(xTest)\n\
  \    predList.append(latestPrediction)\n\n\n##### 从前 \"n\" 个模型构建累积预测\n##### 从前 \"\
  n\" 个模型构建累积预测\nrmse = []\nallPredictions = []\n\nfor iModels in range(len(modelList)):\n\
  \    \n    prediction_i = np.zeros_like(predList[0]) \n    for i in range(iModels):\
  \ \n        prediction_i += predList[i] / float(iModels + 1)\n\n    allPredictions.append(prediction_i)\n\
  \    errors = yTest - prediction_i\n    rmse.append(sqrt(np.average(errors * errors)))\n\
  \n\nnModels = [i + 1 for i in range(numTreesMax)]\n\n\nplt.plot(nModels,rmse)\n\
  plt.axis('tight')\nplt.xlabel('Number of Tree Models in Ensemble')\nplt.ylabel('Root\
  \ Mean Squared Error')\nplt.ylim((0.0, max(rmse)))\nplt.title('RMS Error vs Ensemble\
  \ Size - Depth = ' + str(treeDepth))\nplt.savefig('bagging_wine_' + str(treeDepth)\
  \ + '.png', dpi=500)\nplt.show()\n\nprint('With Tree Depth = ', treeDepth)\nprint('With\
  \ Number of Trees = ', numTreesMax)\nprint('Minimum RMSE = ', min(rmse))\n\nPrinted\
  \ Output: \n\nWith Tree Depth = 1\nWith Number of Trees = 30\nMinimum RMSE = 0.7440534935904853\n\
  \  \nWith Tree Depth = 5\nWith Number of Trees = 30\nMinimum RMSE = 0.6540549863025144\n\
  \nWith Tree Depth = 12\nWith Number of Trees = 100\nMinimum RMSE = 0.5727542363996668\
  \ \n```\n\n![Figure 6.15: Predicting wine quality with Bagging on depth 1 trees](img/c06f015.png)\n\
  \n**Figure 6.15：** 在深度为 1 的树上使用装袋法预测葡萄酒质量\n\n![Figure 6.16: Predicting wine quality\
  \ with Bagging on depth 5 trees](img/c06f016.png)\n\n**Figure 6.16：** 在深度为 5 的树上使用装袋法预测葡萄酒质量\n\
  \n![Figure 6.17: Predicting wine quality with Bagging on depth 12 trees](img/c06f017.png)\n\
  \n**Figure 6.17：** 在深度为 12 的树上使用装袋法预测葡萄酒质量\n\nFigure 6.15 展示了随着装袋集成中包含的树越来越多，MSE\
  \ 是如何变化的。在葡萄酒质量数据上，树桩（深度为 1 的树）的集成相比单棵树，其 MSE 几乎没有改善。葡萄酒数据上缺乏改善的情况比合成数据上要显著得多。这可能有几个原因。一种可能是葡萄酒质量数据边缘处的误差比合成数据更显著。另一种可能是变量间的交互作用在葡萄酒数据中更为重要。\n\
  \n合成数据只有一个变量，因此不存在变量间的交互作用。葡萄酒数据有多个属性，因此属性组合在一起可能比其单独贡献之和更重要。如果你走路绊倒了，那可能不重要。如果你在悬崖边缘行走，那可能也不重要。但如果你在悬崖边缘行走时绊倒了，那可能就很重要了。这两个条件需要结合起来考虑。深度为\
  \ 1 的树只能考虑单个属性，因此无法解释变量之间的强交互作用。\n\n### 装袋法需要树的深度来保证性能\n\nFigure 6.16 展示了当树的深度均为\
  \ 5 时，MSE 如何随树的数量变化。装袋集成随着树的增加显示出明显的改善。由此产生的性能远好于装袋深度为 1 的树。这种改善表明，或许更大的树深度会带来进一步的改善。\n\
  \nFigure 6.17 展示了当树的深度为 12 时，装袋集成中 MSE 与树数量的关系。除了使用更深的树之外，集成运行了 100 棵树而不是 30 棵，以更好地了解通过为装袋集成训练更多树可以获得多少性能改进。Figure\
  \ 6.17 显示了三次运行中最低的 MSE。\n\n### 装袋法总结\n\n现在你已经看到了一个集成方法的初步示例。装袋法清晰地展示了集成方法通用的两层层次结构。严格来说，装袋法是定义一系列由基学习器求解的子问题，然后对其预测进行平均的高层算法。构成装袋集成的各个单独问题，是通过对原始训练数据进行随机自助采样（bootstrap\
  \ sampling）得到的。装袋法降低了单个二叉树表现出的方差。为了使装袋法正常工作，装袋集成中的树需要生长到足够的深度。\n\n装袋法作为集成方法的一个良好入门，因为它相对容易理解，且相对容易演示其方差降低特性。接下来介绍的两种算法是梯度提升和随机森林。它们采用不同的方法构建集成，并表现出比装袋法某些优势。我认识的大多数当前从业者首先使用梯度提升或随机森林，并不经常使用装袋法。\n\
  \n## 梯度提升\n\n\n\n\n## 梯度提升\n\n梯度提升是由斯坦福大学教授 Jerome Friedman 开发的，他还开发了用于求解 ElasticNet\
  \ 问题的坐标下降算法（见第 4 章和第 5 章）。梯度提升通过在集成中的每棵树上使用不同的标签进行训练，然后将这些树组合起来，从而开发出一组基于树的模型集成。对于目标是最小化\
  \ MSE 的回归问题，每棵后续的树都是在前几棵树集合留下的误差上进行训练的。关于算法的推导，请参阅本章末尾“参考文献”部分。理解梯度提升工作原理最简单的方法是查看一些实现该算法的代码。\n\
  \n### 梯度提升算法的基本原理\n\n清单 6-6 详细介绍了本章前面介绍的合成问题的梯度提升算法。代码的早期部分使用前面的过程来构建合成数据集。\n\n\
  #### 清单 6-6：简单问题的梯度提升——simpleGBM.py\n\n```python\n__author__ = 'mike-bowles'\n\n\
  import numpy as np\nimport matplotlib.pyplot as plt\nfrom sklearn import tree\n\
  from sklearn.tree import DecisionTreeRegressor\nfrom math import floor\nfrom numpy.random\
  \ import choice\n\n##### Build a simple data set with y = x + random\nnPoints =\
  \ 1000\n\n##### x values for plotting\nx = np.linspace(-0.5, 0.5, nPoints)\nx_feat\
  \ = x.reshape([-1, 1])\n\n##### y (labels) has random noise added to x-value\n#####\
  \ set seed\nnp.random.seed(1)\ny = x + np.random.randn(nPoints) * 0.1\n\n##### take\
  \ fixed test set 30% of sample\nindices = list(range(nPoints))\nnSample = int(nPoints\
  \ * 0.30)\nidxTest = choice(indices, nSample, replace=False)\nidxTest.sort()\nidxTrain\
  \ = [idx for idx in indices if not (idx in idxTest)]\n\n##### Define test and training\
  \ attribute and label sets\nxTrain = x_feat[idxTrain]\nxTest = x_feat[idxTest]\n\
  yTrain = y[idxTrain]\nyTest = y[idxTest]\nidx_Train = list(range(len(xTrain)))\n\
  \n##### train a series of models on random subsets of the training data\n##### collect\
  \ models in a list and check error of composite as list grows\n\n##### maximum number\
  \ of models to generate\nnumTreesMax = 30\n\n##### tree depth - typically at the\
  \ high end\ntreeDepth = 5\n\n##### initialize a list to hold models\nmodelList =\
  \ []\npredList = []\neps = 0.3\n\n##### initialize residuals to be the labels y\n\
  residuals = yTrain\n\nfor iTrees in range(numTreesMax):\n\n    modelList.append(DecisionTreeRegressor(max_depth=treeDepth))\n\
  \    modelList[-1].fit(xTrain, residuals)\n\n    # make prediction with latest model\
  \ and add to list of predictions\n    latestInSamplePrediction = modelList[-1].predict(xTrain)\n\
  \n    # use new predictions to update residuals\n    residuals -= eps * latestInSamplePrediction\n\
  \n    latestOutSamplePrediction = modelList[-1].predict(xTest)\n    predList.append(latestOutSamplePrediction)\n\
  \n\n##### build cumulative prediction from first \"n\" models\nmse = []\nallPredictions\
  \ = []\nfor iModels in range(len(modelList)):\n\n    # add the first \"iModels\"\
  \ of the predictions and multiply by eps\n    prediction_i = np.zeros_like(predList[0])\n\
  \    for i in range(iModels):\n        prediction_i += predList[i] * eps\n\n   \
  \ allPredictions.append(prediction_i)\n    errors = yTest - prediction_i\n    mse.append(np.average(errors\
  \ * errors))\n\nnModels = [i + 1 for i in range(len(modelList))]\n\nplt.plot(nModels,\
  \ mse)\nplt.axis('tight')\nplt.xlabel('Number of Models in Ensemble')\nplt.ylabel('Mean\
  \ Squared Error')\nplt.title('Error vs Ensemble Size - Depth = ' + str(treeDepth))\n\
  plt.savefig('simple_gbm_error_vs_trees_' + str(treeDepth) + str(eps) +\n       \
  \     '.png', dpi=500)\nplt.ylim((0.0, max(mse)))\nplt.show()\n\nplotList = [0,\
  \ 3, 29]\nlineType = [':', '-.', '--']\nplt.figure()\nfor i in range(len(plotList)):\n\
  \    iPlot = plotList[i]\n    textLegend = 'Prediction with ' + str(iPlot + 1) +\
  \ ' Trees'\n    plt.plot(xTest, allPredictions[iPlot], label=textLegend,\n     \
  \        linestyle=lineType[i])\nplt.plot(xTest, yTest, label='True y Value', alpha=0.25)\n\
  plt.legend(bbox_to_anchor=(1, 0.3))\nplt.axis('tight')\nplt.xlabel('x value')\n\
  plt.ylabel('Predictions')\nplt.title('Actual vs Predictions - Depth= ' + str(treeDepth))\n\
  plt.savefig('simple_gbm_real_vs_pred_' + str(treeDepth) + str(eps) +\n         \
  \   '.png', dpi=500)\nplt.show()\n```\n\n### 梯度提升的参数设置\n\n第一个看起来不熟悉的是关于设置梯度提升集成中训练的单个树的深度参数的注释。梯度提升不同于装袋法和随机森林，因为它除了能降低方差外，还能降低偏差。梯度提升有一个有用的特性：它通常使用树桩（stumps，即深度为\
  \ 1 的树）也能达到与使用更深层树同样低的 MSE 值。对于梯度提升而言，树的深度仅在变量之间存在显著交互作用时才需要增加。通过增加树深度获得的性能提升，可以作为衡量你的问题中变量交互作用程度的一个指标。\n\
  \n接下来看起来略有不同的是名为 `eps` 的变量定义。这是一个步长控制变量，如果你熟悉优化问题，可能对这类变量不陌生。梯度提升采取梯度下降步骤，与其他梯度下降过程一样，如果步长过大，优化可能会发散而不是收敛。如果步长过小，该过程可能需要太多的迭代次数。在生成一些结果后，本章将讨论如何调整步长\
  \ `eps`。\n\n代码中下一个不熟悉的元素是名为 `residuals` 的变量定义。*残差* 通常用来表示预测误差（即观测值减去预测值）。梯度提升算法将对其标签预测进行一系列改进。在每一步中，残差都会重新计算。在过程开始时，梯度提升将预测值初始化为空（或零）值，因此残差等于观测标签。\n\
  \n### 梯度提升如何迭代生成预测模型\n\n`iTrees` 循环开始时使用属性训练一棵树，但训练目标是残差而不是标签。只有在第一次遍历时才使用原始标签作为训练目标。后续遍历获取训练生成的预测值，并从残差中减去其\
  \ `eps` 倍，然后再进行训练。如前所述，残差的减少相当于梯度下降，乘以步长控制参数 `eps` 的目的是确保迭代过程收敛。代码使用固定的留出集来测量样本外性能，然后绘制\
  \ MSE 随训练树数量变化的函数图，以及显示预测值与单个属性关系的函数图。\n\n### 从梯度提升中获得最佳性能\n\n第一组图表（见图 6.18 和图 6.19）显示了\
  \ `eps = 0.1` 和 `treeDepth = 1` 时的 MSE 与树数量关系图以及预测函数图。图 6.18 显示误差平滑下降，在训练 30 棵树后达到约\
  \ 0.014，且 MSE 仍在下降，表明通过训练更多树还可以进一步降低。\n\n![Figure 6.18: MSE versus number of trees\
  \ for synthetic problem—eps = 0.1, treeDepth = 1](img/c06f018.png)\n\n**图 6.18**：合成问题的\
  \ MSE 与树数量关系图——eps = 0.1，treeDepth = 1\n\n\n\n\n#### 梯度提升模型的预测与属性值关系\n\n图 6.19 展示了三个梯度提升模型的预测值与属性值的关系——一个仅训练一棵树，一个训练\
  \ 15 棵树，一个训练 30 棵树。仅包含单棵树的模型看起来像是决策树入门部分所见树模型的简化版。正如所述，它确实是一棵在标签上训练的深度为 1 的树，然后乘以\
  \ `0.1`——即 `eps` 的值。使用 10 棵树构建的模型变得更有趣。该模型很好地近似了正确答案——图中 45 度的直线。包含 10 棵树的模型正确预测了大约一半的范围，并将左右两侧预测为常数。包含\
  \ 30 棵树的模型在整个数据边缘处进一步接近良好的近似。这与装袋法使用树桩时表现出的行为截然不同。\n\n![Figure 6.19: Gradient boosting\
  \ predictions versus attribute value problem—eps = 0.1, treeDepth = 1](img/c06f019.png)\n\
  \n**图 6.19** (#c06.xhtml#R_c06-fig-0019): 梯度提升预测值与属性值问题——eps = 0.1, treeDepth =\
  \ 1\n\n装袋法无法超越使用浅层树为彼此差别不大的问题构建预测时固有的偏差误差。梯度提升以相同方式开始，但随着它开始减少数据中间的误差，它开始更多地关注出错的区域。这将分裂点移动到了有错误的区域。这一过程无需增加树深度即可得出良好的近似。\n\
  \n改变控制训练的参数会发生什么？图 6.20 和 6.21 展示了如果树深度为 5 时图景如何变化。图 6.20 中的 MSE 图显示，随着树的数量增加，MSE\
  \ 平滑下降，趋势相似。训练 30 棵深度为 5 的树后，MSE 值非常接近完美（0.01）——比深度为 1 的树更低。该图未显示的是训练时间。树的每一层训练时间大致相同。在每一层，都必须比较所有可能的分裂点的\
  \ MSE。一棵深度为 5 的树所需时间是五棵深度为 1 的树的五倍。公平的比较应是：深度为 1 的树训练 150 棵后达到的误差，与深度为 5 的树训练 30\
  \ 棵后的误差相比。\n\n![Figure 6.20: MSE versus number of trees for synthetic problem—eps\
  \ = 0.1, treeDepth = 5](img/c06f020.png)\n\n**图 6.20** (#c06.xhtml#R_c06-fig-0020):\
  \ 合成问题的 MSE 与树数量关系——eps = 0.1, treeDepth = 5\n\n![Figure 6.21: Gradient boosting\
  \ predictions versus attribute value problem—eps = 0.1, treeDepth = 5](img/c06f021.png)\n\
  \n**图 6.21** (#c06.xhtml#R_c06-fig-0021): 梯度提升预测值与属性值问题——eps = 0.1, treeDepth =\
  \ 5\n\n图 6.21 明显反映了用于构建梯度提升集成的更深层树。即使是基于单棵树的第一次预测，也显示出属性整个范围内的一些结构。基于 15 棵树和 30\
  \ 棵树的模型在数据边缘处仍表现出较高的误差水平。\n\n图 6.22 和 6.23 展示了随着步长参数 `eps` 增加时发生的情况。图 6.22 显示了步长参数（此处命名为\
  \ `eps`）过大时的典型行为。MSE 与树数量的图表急剧下降，但随后在右侧再次上升。最小值位于图表左侧，靠近三分之一处。你需要调整 `eps`，使最小值位于或接近图表的右边缘。这通常能获得更好的性能。\n\
  \n作为属性函数的预测图显示，与使用 `eps=0.1` 的两个版本相比，其偏离正确 45% 线的尖峰波动更多。总体而言，深度为 1 的树版本表现最佳。看起来训练更多树可能会改善深度为\
  \ 1 模型在边缘处的性能，从而为梯度提升得出最佳答案。\n\n![Figure 6.22: MSE versus number of trees for synthetic\
  \ problem—eps = 0.3, treeDepth = 5](img/c06f022.png)\n\n**图 6.22** (#c06.xhtml#R_c06-fig-0022):\
  \ 合成问题的 MSE 与树数量关系——eps = 0.3, treeDepth = 5\n\n![Figure 6.23: Gradient boosting\
  \ predictions versus attribute value problem—eps = 0.3, treeDepth = 5](img/c06f023.png)\n\
  \n**图 6.23** (#c06.xhtml#R_c06-fig-0023): 梯度提升预测值与属性值问题——eps = 0.3, treeDepth =\
  \ 5\n\n#### 多变量问题上的梯度提升\n\n清单 6-7 展示了将梯度提升应用于预测葡萄酒质量的任务。除使用葡萄酒数据集作为输入外，清单 6-7 中的代码与用于简单合成数据集的代码非常相似。\n\
