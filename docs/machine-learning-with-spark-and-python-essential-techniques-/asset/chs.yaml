  > ```\n\nListing 5-5 中的代码结构与 Listing 5-4 类似，不同之处在于没有交叉验证循环。寻找系数时的 `alpha` 值是硬编码的，直接来自\
  \ Listing 5-4 生成的结果。生成了两个 `alpha` 值：一个使分类错误最小化，另一个使 AUC 最大化。使 AUC 最大化的 `alpha` 稍大且略微更保守。它位于使分类错误最小化的值的左侧，因此略微更保守。程序打印的系数列在代码底部。在\
  \ 60 个系数中，有 20 多个为 0。在此次运行中（与交叉验证程序中一样），`l1_ratio` 变量被设置为 `0.8`，这通常比 Lasso 回归（对应\
  \ `l1_ratio` 为 `1.0`）产生更多的系数。\n\n列表底部打印了两个变量重要性度量。一个是随着 `alpha` 向下递减时变量进入解的顺序。另一个排序是根据最优解处系数的大小。正如结合葡萄酒质量数据所讨论的，这些排序仅在属性归一化时才有意义。这两种不同的变量排序之间存在一定程度的一致性，但并不完全一致。例如，变量\
  \ `V48`、`V11`、`V35`、`V44` 和 `V3` 在两个列表中都相对靠前，但 `V10` 出现在第一个列表的顶部，而在基于系数大小的排序中则靠后得多。显然，当系数惩罚非常大以至于算法只允许单个属性时，`V10`\
  \ 很重要；但当系数惩罚收缩到允许包含多个属性的程度时，属性 `V10` 的重要性趋于平稳并有所下降，因为其他属性被加入了组合中。\n\n通常，物体对波长与其特征尺寸同阶的波反射最强。地雷（金属圆柱体）具有长度和直径——与岩石相比，反射的特征尺寸相对较少且较长，岩石的性质更具分形特征，反射更宽范围的波长。由于数据集中的所有属性值均为正（功率电平），人们可能会预期对应低频的波长会获得正系数，而对应高频的波长会获得负系数。你可以看到，这种差分很容易导致过拟合数据，并建立一个在该数据集上表现极好但泛化能力差的模型。交叉验证过程确保模型不会过拟合，前提是训练数据在统计上与模型部署时将遇到的数据相似。交叉验证中看到的错误将与部署中的错误相匹配，程度取决于部署中遇到的地雷和岩石的性质和比例与训练数据中的匹配程度。\n\
  \nFigure 5.8 绘制了在完整岩石与地雷数据集上训练的 ElasticNet 回归模型的系数曲线。这些曲线强调了可用属性相对重要性的复杂性和变化性。\n\
  \n![Figure 5.8: Coefficient curves for ElasticNet trained on rocks versus mines\
  \ data](img/c05f008.png)\n\n**Figure 5.8**：在岩石与地雷数据上训练的 ElasticNet 的系数曲线\n\n\n\n\
  \n正如第 4 章所述，分类的替代方法是使用惩罚逻辑回归，而非惩罚回归。清单 5-5 展示了惩罚逻辑回归的实现代码，用于构建岩石与地雷数据的分类器。该清单及其相关结果突出了这两种方法的异同。算法差异体现在迭代结构上。逻辑回归方法涉及使用属性的线性函数来计算每个训练样本为岩石或地雷的概率和似然。（更多关于逻辑回归的背景及相关方程的详细推导，请参见`http://en.wikipedia.org/wiki/Logistic_regression`。）非惩罚逻辑回归的算法称为*迭代重加权最小二乘法*（IRLS）。名称源于算法的性质（参见`http://en.wikipedia.org/wiki/Iteratively_reweighted_least_squares`）。它根据训练集中每个样本的概率估计推导权重。给定权重后，问题转化为加权最小二乘回归问题。该过程必须迭代进行，直到概率（及相应权重）不再变化。基本上，逻辑回归的\
  \ IRLS 在第 4 章中你看到的（非逻辑）惩罚回归算法基础上增加了另一层迭代。\n\n读取变量并归一化后，程序初始化逻辑回归及其惩罚版本核心的权重和概率。每次惩罚参数递减时，这些概率和权重都必须与系数（β）一起估计。你会在代码中看到一些变量名添加了`IRLS`字母，以表示它们与\
  \ IRLS 迭代层相关。估计概率的迭代位于λ递减的循环内部，并包裹着对β进行坐标下降迭代的循环。\n\n更新细节比普通（非逻辑）惩罚回归算法稍复杂。一是 IRLS\
  \ 带来的权重。权重和概率是逐个输入样本计算的。代码中用`p`和`w`表示。权重对*属性乘以残差*和*属性平方*等乘积求和的影响也需收集。这些用类似`sumWxx`的变量表示，它是一个列表，包含权重乘以各属性平方的和。另一复杂点是残差现在是标签、概率，以及（更熟悉的）属性及其系数（β）的函数。\n\
  \n代码运行后生成变量排序和系数曲线，以便与非逻辑惩罚回归生成的结果比较。逻辑变换导致非线性尺度变化，使系数直接对比变得困难。普通和逻辑回归（无论是否惩罚）都生成系数向量，再将（相同的）属性乘以它们并与阈值比较。阈值次要，因可在训练后确定（如前所示）。因此，β的整体尺度不如其分量间的相对大小重要。判断相对大小的一种方法是观察两种方法引入新变量的顺序。通过对比清单\
  \ 5-5 和清单 5-4 的打印输出可见，两方法在前八个属性的排序上完全一致。接下来的八个变量中，有七个为两列表共有，只是顺序略有不同。再下八个大致相同。两方法的排序总体吻合度良好。\n\
  \n另一问题是哪种性能更好。评估需对惩罚逻辑回归运行交叉验证。你已具备工具和代码执行此操作。清单 5-6 中的代码未针对速度优化，但在岩石与地雷问题上运行时间不长。\n\
  \n#### 清单 5-6：在岩石与地雷数据上训练的惩罚逻辑回归——rvmGlmnet2.py\n\n\n\n\n> ```\n> __author__ = 'mike_bowles'\n\
  > \n> from Read_Fcns import list_read_rvm\n> from math import sqrt, exp, fabs\n\
  > import matplotlib.pyplot as plt\n> import numpy as np\n> from sklearn.preprocessing\
  \ import StandardScaler\n> \n> # 定义几个工具函数\n> def S(z,gamma):\n>     if gamma >=\
  \ fabs(z):\n>         return 0.0\n>     if z > 0.0:\n>         return z - gamma\n\
  >     else:\n>         return z + gamma\n> \n> def Pr(b0,b,x):\n>     \"\"\"\n>\
  \     :param b0: 偏置值\n>     :param b: 系数的 np 列矩阵\n>     :param x: 特征矩阵\n>     :return:\
  \ 概率的列矩阵\n>     \"\"\"\n>     # 计算名义值\n>     sum = b0 + np.dot(x, b)\n>     p =\
  \ (1.0/(1.0 + np.exp(-sum))).reshape([-1, 1])\n>     w = (p * (1.0 - p)).reshape([-1,\
  \ 1])\n> \n>     # 极值处理\n>     idxSmall = np.abs(p) < 1e-5\n>     idxLarge = np.abs(1.0\
  \ - p) < 1e-5\n> \n> \n>     p[idxSmall] = 0.0\n>     w[idxSmall] = 1e-5\n>    \
  \ p[idxLarge] = 1.0\n>     w[idxLarge] = 1e-5\n>     return p, w\n> \n> # 从 uci\
  \ 仓库读取数据并整理\n> xNum, labels = list_read_rvm()\n> \n> nrow = len(xNum)\n> ncol =\
  \ len(xNum[1])\n> \n> alpha = 1.0\n>   \n> # 标准化特征\n> xScaler = StandardScaler()\n\
  > xNormalized = xScaler.fit_transform(xNum)\n> \n> \n> # 不标准化标签，但计算平均值\n> labels\
  \ = np.array(labels).reshape([-1, 1])\n> meanLabel = np.mean(labels)\n> sdLabel\
  \ = np.std(labels)\n> \n> # 初始概率为 1 的频率\n> p = meanLabel\n> w = p * (1.0 - p)\n\
  > z = (labels - p) / w\n> sumWxz = np.sum(w * xNormalized * z, axis=0)\n> maxWxz\
  \ = np.amax(np.abs(sumWxz))\n> \n> # lambda 的起始值\n> lam = maxWxz / alpha\n> \n>\
  \ \n> \n> # 此 lambda 值对应 beta = 全 0 列表\n> # 初始化系数向量 beta\n> beta = np.zeros([ncol,\
  \ 1])\n> beta0 = 0.0\n> \n> # 初始化每一步 beta 的矩阵\n> betaMat = beta.copy()\n> \n> beta0List\
  \ = [0.0]\n> \n> \n> # 开始迭代\n> nSteps = 100\n> lamMult = 0.93 # 100 步使 lambda 减少\
  \ 1000 倍 \n>                #（作者推荐）\n> nzList = []\n> for iStep in range(nSteps):\n\
  >     # 减小 lambda\n>     lam = lam * lamMult\n> \n> \n>     # 使用 beta 的增量变化来控制内层迭代\n\
  > \n>     # 将中间循环的 beta 值设为外层值\n>     # 这些值用于计算权重和概率\n>     # 内层值用于计算惩罚回归更新\n> \n\
  >     # 遍历数据以计算迭代所需的数据平均值\n>     # 初始化累加器\n>   \n>     betaIRLS = beta.copy()\n\
  >     beta0IRLS = beta0\n>     distIRLS = 100.0\n>     # 中间循环：在固定 IRLS 权重和概率下计算新的\
  \ beta\n>     iterIRLS = 0\n>     while distIRLS > 0.01:\n>         iterIRLS +=\
  \ 1\n>         iterInner = 0\n> \n>         betaInner = betaIRLS.copy()\n>     \
  \    beta0Inner = beta0IRLS\n>         distInner = 100.0\n>         while distInner\
  \ > 0.01:\n>             iterInner += 1\n>             if iterInner > 100: break\n\
  >             p, w = Pr(beta0IRLS, betaIRLS, xNormalized)\n>             z = (labels\
  \ - p) / w + beta0IRLS + np.dot(xNormalized, \n>                      betaIRLS)\n\
  >             # 遍历属性并逐个更新\n>             # 记录起始值以供比较\n>             betaStart =\
  \ betaInner.copy()\n>             for iCol in range(ncol):\n>                 r\
  \ = (z - beta0Inner - np.dot(xNormalized, \n>                        betaInner)).reshape([-1,\
  \ 1])\n>                 xTemp = xNormalized[:, iCol].reshape([-1, 1])\n>      \
  \           sumWxr = np.sum(w * xTemp * r)\n>                 sumWxx = np.sum(w\
  \ * xTemp * xTemp)\n>                 sumWr = np.sum(w * r)\n>                 sumW\
  \ = np.sum(w)\n>                 avgWxr = sumWxr / nrow\n>                 avgWxx\
  \ = sumWxx / nrow\n> \n>                 beta0Inner = beta0Inner + sumWr / sumW\n\
  >                 uncBeta = sumWxr + sumWxx * betaInner[iCol, 0]\n>            \
  \     betaInner[iCol, 0] = S(uncBeta, lam * alpha) / (sumWxx \n>               \
  \                 + lam * (1.0 - alpha))\n> \n>             sumDiff = np.sum(np.abs(betaInner\
  \ - betaStart))\n>             sumBeta = np.sum(np.abs(betaInner))\n>          \
  \   distInner = sumDiff/sumBeta\n> \n>         # print(iStep, iterIRLS, iterInner)\n\
  >         print('\\r', 'Step', iStep, 'IRLS iteration', iterIRLS, 'Inner \n>   \
  \                           iteration', iterInner, end='')\n>         # 如果退出内层 while\
  \ 循环，则设置 betaMiddle = betaMiddle 并\n>         # 再次运行中间循环。\n> \n>         # 检查 betaMiddle\
  \ 的变化以判断 IRLS 是否收敛\n>         a = np.sum(np.abs(betaIRLS - betaInner))\n>      \
  \   b = np.sum(np.abs(betaIRLS)) \n>         distIRLS = a / (b + 0.0001)\n>    \
  \     dBeta = betaInner - betaIRLS\n>         gradStep = 1.0\n>         temp = betaIRLS\
  \ + gradStep * dBeta\n>         betaIRLS = temp\n> \n>     beta = betaIRLS.copy()\n\
  >     beta0 = beta0IRLS\n>     betaMat = np.concatenate((betaMat, beta.copy()),\
  \ axis=1)\n>     beta0List.append(beta0)\n> \n>     nzBeta = [index for index in\
  \ range(ncol) if beta[index] != 0.0]\n>     for q in nzBeta:\n>         if not(q\
  \ in nzList):\n>             nzList.append(q)\n> \n> # 为 xNum 的列编造名称\n> names =\
  \ ['V' + str(i) for i in range(ncol)]\n> nameList = [names[nzList[i]] for i in range(len(nzList))]\n\
  > \n> print('\\n', nameList)\n> for i in range(ncol):\n>     # 绘制每个属性的 beta 值范围\n\
  >     nSteps = betaMat.shape[1]\n>     coefCurve = betaMat[i, :].reshape([-1, 1])\n\
  >     xaxis = range(nSteps)\n>     plt.plot(xaxis, coefCurve)\n> \n> plt.xlabel(\"\
  Steps Taken\")\n> plt.ylabel(\"Coefficient Values\")\n> plt.savefig('rocksVMinesGlmnet2.png',\
  \ dpi=500)\n> plt.show() \n> ```\n\n图 5.9 展示了使用惩罚逻辑回归对岩石与地雷数据的系数曲线。如前所述，由于两种方法中逻辑函数的差异，系数的尺度与普通惩罚回归不同。普通回归试图拟合一条直线来逼近值为\
  \ 0.0 和 1.0 的目标。逻辑回归则通过拟合一条直线来逼近“log odds ratio（对数几率比）”，从而预测类别成员的概率。假设 `p` 是某样本对应地雷类别的预测概率。那么几率比就是比率\
  \ `p / (1 - p)`。对数几率比是几率比的自然对数。当 `p` 的范围是 0 到 1 时，`p` 的对数几率比范围是从负无穷到正无穷。对数几率非常大且为正的情况，对应于模型非常确信该样本属于地雷类别的情况。而非常大的负数则对应岩石类别。\n\
  \n![图 5.9：在岩石与地雷数据上训练的 ElasticNet 惩罚逻辑回归的系数曲线](img/c05f009.png)\n\n**图 5.9**：在岩石与地雷数据上训练的\
  \ ElasticNet 惩罚逻辑回归的系数曲线\n\n因为这两种方法预测的量截然不同，预测的尺度差异很大，系数也随之不同。但正如两个程序的打印输出所示，变量进入解中的顺序非常相似，且系数曲线显示，最先进入解中的前几个属性的符号是相同的。\n\
  \n## 多分类：犯罪现场玻璃样本分类\n\n\n\n\n您在上一节中看到的岩石与地雷问题是一个**二分类问题**，因为标签和预测值仅取两个可能值之一（正在处理的声纳回波是来自岩石还是地雷的反射？）。如果标签和预测值可以取两个以上的值，该问题称为**多分类问题**。本节将使用惩罚线性回归来解决玻璃样本分类问题。正如第\
  \ 2 章中更详细描述的那样，玻璃数据集包含 214 个 6 种不同类型玻璃样本的 9 项物理化学测量值（折射率和化学成分测量值）。该问题旨在利用物理化学测量值来判断给定样本属于这六种类型中的哪一种。其应用场景是犯罪和事故现场的法医分析。该数据集来自\
  \ UCI 数据仓库，该数据集的网页引用了一篇使用支持向量机解决同一问题的论文。在查看了解决此问题的代码后，本节将把其性能与支持向量机方法进行比较。\n\n清单\
  \ 5-7 给出了解决此问题的代码。\n\n### 清单 5-7：带惩罚线性回归的多分类：犯罪现场玻璃样本分类——glassENetRegCV.py\n\n```\n\
  __author__ = 'mike-bowles'\n\nfrom Read_Fcns import list_read_glass\nfrom math import\
  \ sqrt, fabs, exp, log\nimport matplotlib.pyplot as plt\nfrom sklearn.preprocessing\
  \ import StandardScaler\nfrom sklearn.linear_model import LogisticRegressionCV\n\
  import numpy as np\n\n#define custom cv folds\ndef custom_cv_folds(X, nFolds):\n\
  \    n = X.shape[0]\n    i = 0\n    while i < nFolds:\n       idxTest = np.array([it\
  \ for it in range(n) if it%nFolds == i])\n       idxTrain = np.array([it for it\
  \ in range(n) if it not in idxTest])\n       yield idxTrain, idxTest\n       i +=\
  \ 1\n\n#read in glass data\nnames, xNum, labels, yOneVAll = list_read_glass()\n\n\
  #use StandardScaler to normalize data\nxScaler = StandardScaler()\nxNormalized =\
  \ xScaler.fit_transform(xNum)\n\n#define custom x-val folds to insure labels are\
  \ balanced across folds\ncustom_cv = custom_cv_folds(xNormalized, 9)\n\nglassModel\
  \ = LogisticRegressionCV(Cs=20, \n             cv=custom_cv, \n             multi_class='ovr').fit(xNormalized,\
  \ labels)\n\n#Note - LogisticRegressionCV uses inverse the usual reg param.  \n\
  Cs = np.array(glassModel.Cs_)\n\n#Average accuracy for each label across cross-validation\
  \ folds\nkeys = list(glassModel.scores_.keys())\nxvalScores = np.zeros([len(Cs),\
  \ len(keys)])\nfor ikey in range(len(keys)):\n    key = keys[ikey]\n    xvalScores[:,\
  \ ikey] = np.average(np.transpose(np.array(glassModel.\n                    scores_[key])),\
  \ axis=1)\n    \n   \n\n##### Display results\nplt.figure()\nplt.plot(Cs, xvalScores,\
  \ ':')\nplt.plot(Cs, xvalScores.mean(axis=1),\n         label='Average accuracy\
  \ for each glass type', linewidth=2)\n\nplt.semilogx()\nplt.legend()\nax = plt.gca()\n\
  \nplt.xlabel('C')\nplt.ylabel('Average Accuracy')\nplt.axis('tight')\nplt.savefig('glassMulticlassLogisticRegression.png',\
  \ dpi=500)\nplt.show()\n\n#print val alpha that minimizes the Cv-error for each\
  \ glass type\nprint(\"C values that maximize accuracy for each type \\n\",glassModel.C_)\n\
  print(\"Maximum Accuracy for each type \\n\", np.amax(xvalScores, axis=0))\n\nPrinted\
  \ Output:\nC values that maximize accuracy for each type \n [4.28133240e+00 5.45559478e+02\
  \ 1.00000000e-04 3.35981829e-02\n  2.97635144e+01 5.45559478e+02]\n  \nMaximum Accuracy\
  \ for each type \n [0.784219   0.69746377 0.92049114 0.94404187 0.98611111 0.97181965]\
  \ \n```\n\n请看一下玻璃数据的标签。您会看到标签由整数玻璃类型组成。每一行都有一个整数，反映与该行化学测量值相关的玻璃类型。这正是 `sklearn`\
  \ 逻辑回归包所需的形式：单列，包含每个不同类别的唯一标识符。\n\n特征经过了归一化处理，但正如上一节中的 `glmnet` 代码一样，逻辑回归使用标签的方式不会从归一化中获益。\n\
  \n图 5.10 显示了每个玻璃类别的交叉验证误差作为惩罚参数 `C` 的函数。对于这个 `sklearn` 逻辑回归包，惩罚参数不同于我们在其他地方见到的。它是常规惩罚参数的倒数。`C`\
  \ 从左向右变大。较大的 `C` 值对应于对惩罚的权重较小。正则化参数 `C` 的最佳值因玻璃类型而异。选择能为您的问题提供最佳整体性能的值。这将取决于您对每个类别性能的重视程度。\n\
  \n![图 5.10：使用惩罚线性回归进行玻璃分类的误分类错误率](img/c05f010.png)\n\n**图 5.10** (#c05.xhtml#R_c05-fig-0010)：使用惩罚线性回归进行玻璃分类的误分类错误率\n\
  \n图 5.10 显示了误分类错误率与惩罚参数递减步数的关系图。图中显示，与图左侧边缘最简单的模型相比，在最小值处有显著改进。表现最差的类别准确率约为 70%，即错误率约为\
  \ 30%。您可以尝试基扩展来改进结果。在接下来介绍集成方法的章节中，您将看到其他一些方法。\n\n## 使用 PySpark 进行线性回归和分类\n\n本节将重现您已经见过的几个问题，但将使用\
  \ `PySpark`，这意味着您将看到的代码示例可以在数百或数千个处理器上同时运行。这将使您能够在海量数据集上构建模型。本节将通过各种示例，向您展示如何使用\
  \ `PySpark` mllib 包解决回归、二分类和多分类问题。您将看到各种您已经熟悉的算法和分析技术：惩罚回归、变量归一化、交叉验证等。\n\n`PySpark`\
  \ 的一些计算序列乍看之下可能有点奇怪。由于 `PySpark` 旨在处理分布在多台机器上的数据，它使用可以一次处理一行数据的数据转换，无论数据存储和处理在何处。您将看到其运作方式，稍加练习，这些操作就会成为您熟悉的工具。\n\
  \n本节将展示四个问题：预测葡萄酒口感、将声纳目标分类为岩石或地雷、预测鲍鱼壳的年轮数、以及根据化学成分识别玻璃类型。选择这些问题是为了演练 `PySpark`\
  \ 中您需要了解的几个特性。我们将在深入每个问题时讨论每个问题所突出的特性。\n\n### 使用 PySpark 预测葡萄酒口感\n\n第 3 章“在海量数据集上使用\
  \ PySpark 训练惩罚回归模型”一节中介绍了使用 `PySpark` 解决葡萄酒口感预测问题。本节将增加在构建模型前归一化变量的功能，以便利用系数指示变量重要性。第\
  \ 3 章中该节的目的是展示 `PySpark` 代码的简洁性及其与 `sklearn` Python 代码的相似性。本节将讨论 `PySpark` 代码中的每个操作。清单\
  \ 5-8 显示了使用归一化特征预测葡萄酒口感的代码。\n\n\n\n\n#### 清单 5-8：使用 PySpark 惩罚回归确定葡萄酒口味预测中的变量重要性——wine_variable_importance:spark.py\n\
  \n```\n__author__ = 'mike_bowles'\n\n##### 导入 sparksession \nfrom pyspark.sql import\
  \ SparkSession\nfrom pyspark.ml.feature import VectorAssembler\nfrom pyspark.ml.regression\
  \ import LinearRegression\nimport matplotlib.pyplot as plt\nfrom pyspark.ml.feature\
  \ import StandardScaler\nimport pandas as pd\nfrom pandas import DataFrame\nfrom\
  \ Read_Fcns import pd_read_wine\n\nspark = SparkSession.builder.appName(\"regress_wine_data\"\
  ).getOrCreate()\n\n##### 将鲍鱼数据作为 pandas 数据框读入并创建 Spark 数据框。\nwine_df = pd_read_wine()\n\
  \n##### 为葡萄酒数据创建 spark 数据框\nwine_sp_df = spark.createDataFrame(wine_df)\nprint('Column\
  \ Names for initial data frame\\n', wine_sp_df.columns, \n       '\\n\\n')\n\nvectorAssembler\
  \ = VectorAssembler(inputCols = ['fixed acidity', \\\n    'volatile acidity', 'citric\
  \ acid', 'residual sugar', 'chlorides', \\\n    'free sulfur dioxide', 'total sulfur\
  \ dioxide', 'density', 'pH', \\\n                    'sulphates', 'alcohol'], outputCol\
  \ = 'features')\nv_wine_df = vectorAssembler.transform(wine_sp_df)\n  \n##### 对特征调用\
  \ StandardScaler\nscaler = StandardScaler(inputCol=\"features\", \n     outputCol=\"\
  scaledFeatures\")\nscalerModel = scaler.fit(v_wine_df)\n\n##### 将每个特征归一化为单位标准差。\n\
  scaledData = scalerModel.transform(v_wine_df)\n\n##### scaledData 包含单个原始特征以及\n#####\
  \ 原始特征和缩放特征的向量化版本\nscaledData.show()\n\nvwine_df = scaledData.select(['scaledFeatures',\
  \ 'quality'])\n\nsplits = vwine_df.randomSplit([0.66, 0.34])\nxTrain_sp = splits[0]\n\
  xTest_sp = splits[1]\n\n##### alpha 列表 从大到小，以及用于存储结果的空列表\nalphaList = [0.1**i for\
  \ i in [0,1, 2, 3, 4, 5, 6]]\nwt_list = []\nintercept_list = []\nrmsError = []\n\
  \nfor alph in alphaList:\n    wine_ridge_sp = LinearRegression(featuresCol = \"\
  scaledFeatures\", \\\n        labelCol='quality', maxIter=100, regParam=alph, \\\
  \n        elasticNetParam=0.0)\n    wine_ridge_sp_model = wine_ridge_sp.fit(xTrain_sp)\n\
  \    test_result = wine_ridge_sp_model.evaluate(xTest_sp)\n    \n    rmsError.append(test_result.rootMeanSquaredError)\n\
  \    coef = wine_ridge_sp_model.coefficients.toArray()\n    wt_list.append(coef)\n\
  \    intercept_list.append(wine_ridge_sp_model.intercept)\n\nprint('{:18}'.format(\"\
  RMS Error\"), \"alpha\") \nfor i in range(len(rmsError)):\n    print(rmsError[i],\
  \ alphaList[i])\n\n##### 根据表现最佳的 alpha (index=2) 的系数幅度对属性排序\n\nlen_coef = len(wt_list[0])\n\
  ordered_idx = sorted(zip(range(len_coef), wt_list[2]), key=lambda x:\n         \
  \              -abs(x[1]))\nprint('\\n\\nAttributes ordered by coef magnitude----------')\n\
  [print(wine_sp_df.columns) for (a,b) in ordered_idx]\n \n \n##### 绘制样本外误差与 alpha\
  \ 的曲线\nx = range(len(rmsError))\nplt.plot(x, rmsError, 'k')\nplt.xlabel('-log(alpha)')\n\
  plt.ylabel('Error (RMS)')\nplt.savefig('linear_regression_w_spark.png', dpi=500)\n\
  plt.show()\n\n打印输出： \nColumn names for initial data frame\n ['fixed acidity', 'volatile\
  \ acidity', 'citric acid', 'residual sugar',\n'chlorides', 'free sulfur dioxide',\
  \ 'total sulfur dioxide', 'density',\n'pH', 'sulphates', 'alcohol', 'quality']\n\
  \nColumn names for transformed data set\n[fixed acidity, volatile acidity, citric\
  \ acid, residual sugar,\nchlorides, free sulfur dioxide, total sulfur dioxide, density,\n\
  pH, sulphates, alcohol, quality, features, scaledFeatures]\n\nNote: Printout of\
  \ data frame can be seen by running Ch5 code notebook \nin this book's code repo\n\
  \nRMS Error          alpha\n0.6464799847389207 1.0\n0.6173125740380354 0.1\n0.6174096728881342\
  \ 0.010000000000000002\n0.6178333051859206 0.0010000000000000002\n0.6178884012227639\
  \ 0.00010000000000000002\n0.6178940680418457 1.0000000000000003e-05\n0.617894636333235\
  \ 1.0000000000000004e-06\n\nAttributes ordered by coef magnitude----------\nalcohol\n\
  volatile acidity\nsulphates\ntotal sulfur dioxide\nchlorides\npH\nfree sulfur dioxide\n\
  density\ncitric acid\nresidual sugar\nfixed acidity \n```\n\n该过程的第一步是启动一个 `SparkSession`。该会话被命名为\
  \ \"`regress_wine_data`\"。第二步是将数据集读入 pandas 数据框，然后将其转换为 PySpark 数据框。回想一下，数据框是一个矩形数据数组，类似于矩阵，不同之处在于特定的数据框列可能与另一列不是相同的数据类型。数据框列可以是字符串变量，例如岩石与矿石数据中的标签列，其中标签为\
  \ `M` 和 `R` 分别表示矿石或岩石。在矩阵中，变量都是同一类型，通常是实数。数据框对于处理统计数据非常有用，因为数据集很少全是实数。Python 和 PySpark\
  \ 都引入了数据框正是出于这个原因。\n\nPySpark 代码中的下一个操作是 `VectorAssembler`。这需要一些解释。PySpark 采用的前提是：机器学习问题的输入示例可以被描述为一个实值特征的行向量和一个关联的标签。对于葡萄酒数据，特征都是实数，因此它们自然符合这一前提，而标签都是单个实数口味评分。标签也符合该前提。您可能会想到鲍鱼数据，其中性别属性取值为\
  \ `M`、`F` 和 `I`，或者您见过的标签不是实数的分类问题。后面的章节将展示如何转换这些情况以符合这一前提。\n\n通常，您用于训练模型的数据可能来自一个大得多的数据框中的几列。因此，第一步是组装将用于预测的实数向量。对于葡萄酒数据，这就像将所需特征列的列标题放入一个字符串变量列表中一样简单。这就是您在\
  \ `VectorAssembler` 函数调用中看到的内容。变量 `inputCols` 被设置为特征名称列表。`VectorAssembler` 中的 `outputCol`\
  \ 变量被设置为您选择的名称，用于命名将作为特征矩阵的行向量列。您将经常看到输出名称“features”。从概念上讲，PySpark 将跟踪一个名为 `features`\
  \ 的行向量列。后面的示例将向您展示这些列条目的一些样本（即特征矩阵的样本行）。\n\n现在 `VectorAssembler` 已定义，下一步是将此转换应用于原始数据框并将其分配给新数据框。新数据框将与旧数据框几乎相同，只是会添加一个名为\
  \ `features` 的新列。\n\n\n\n\n下一步是标准化特征。这需要几个步骤。首先是实例化一个 `StandardScaler()` 函数（在代码中命名为\
  \ `scaler`）并定义输入和输出列。输入列是 `features`，即之前定义的行向量列。第二步是在 `VectorAssembler` 之后对数据集调用\
  \ `scaler.fit()`，以便有一个 `features` 列可供操作。`fit()` 函数会将 `features` 列中的每个单独特征转换为零均值、单位方差。在第\
  \ 2 章的清单 2.11 中，你已经看到归一化操作需要遍历每一列来确定其均值和标准差，然后减去均值并除以标准差。`fit()` 函数计算均值和标准差，而 `transform()`\
  \ 函数执行减法和除法运算。这些操作的结果显示在清单 5-8 的输出部分。最终 `scaledData` 数据帧的列标题显示了 `features` 和 `scaledFeatures`\
  \ 列。显示的输出不包含任何实际的特征值。输出过于繁杂，无法以页面格式打印。你可以通过运行 Jupyter Notebook 生成输出，该 Notebook 可在本书的代码仓库中找到。\n\
  \n现在数据已标准化，拟合 ElasticNet 惩罚线性模型的其余过程相当直接：首先定义训练-测试集划分，然后选择一系列惩罚参数。惩罚参数作为 0.1 的幂次生成。ElasticNet\
  \ 参数选为 0.0，这给出了岭回归。运行完流程后，样本外 MSE 表表明索引为 2 的惩罚参数是最佳选择。（注意，由于随机训练-测试划分的不同，该值会略有波动。）所有系数都已存储，因此使用索引\
  \ 2 对应的系数集对特征进行排序并打印结果（图 5.11）。\n\n![图 5.11：PySpark 模型性能与正则化参数的关系](img/c05f011.png)\n\
  \n**图 5.11**：PySpark 模型性能与正则化参数的关系\n\n本示例中模型构建过程的总体流程应该很熟悉，类似于你迄今为止看到的 Python 示例。新元素是使用\
  \ PySpark 执行这些熟悉操作的机制和语法。此处的示例实现了特征标准化，部分原因是这是一个你可能想要使用的过程，部分是为了说明在 PySpark 中对数据执行一系列转换的过程是如何工作的。下一节将介绍我们的基本二分类示例：岩石与地雷。\n\
  \n### 使用 PySpark 进行逻辑回归：岩石与地雷\n\n本节将介绍一个与上一节非常相似的过程。它将包括用于生成 `features` 列的 `VectorAssembler`\
  \ 等。会有几个不同之处。它将使用 `LogisticRegression` 包而不是 `LinearRegression` 包。它将使用 `StringIndexer`\
  \ 将岩石与地雷问题中的 `M` 和 `R` 转换为 PySpark `LogisticRegression` 所需的分类标签。最后，此处的代码将使用 PySpark\
  \ Pipeline 框架来完成所需的转换序列。在前一个示例中，转换是一次应用一步，命名生成的数据帧，然后用于下一步。这可能会变得有些重复。Pipeline 框架使流程更加整洁。\n\
  \n第一步与之前相同：启动 PySpark 会话，将数据读入 pandas 数据帧，将其转换为 PySpark 数据帧，并生成一个列名列表，这些列名将作为特征传递给\
  \ `VectorAssembler`。然后是 `StringIndexer`。\n\n`StringIndexer` 作用于标签列 `V60`。它将 `M`\
  \ 和 `R` 转换为 0 和 1。`StringIndexer` 作用于字符串值。它确定有多少个唯一值，并从 0 开始为数量最多的值分配索引编号，然后按数量从多到少的顺序继续向下分配。在本例中，两个类别的样本量相同。\n\
  \n使用 Pipeline 框架需要定义一系列定义步骤顺序的“阶段”。这些阶段累积在一个列表中。列表中的第一个操作是 `StringIndexer` 的实例化，在清单\
  \ 5-9 中称为 `label_string_idx`。第二个是 `VectorAssembler` 的实例化，它组装了特征列 `V0` 到 `V59`。\n\
  \n接下来，创建 `pipeline` 作为 `Pipeline` 类的实例。对其应用 `fit()` 以学习字符串索引。如果包含标准化，那也将作为 fit 过程的一部分完成。拟合后的模型称为\
  \ `pipelineModel`，然后用于转换输入数据。为最终数据帧选择的列以模式形式打印，打印输出显示了来自字符串索引器的标签、向量化特征以及为简洁起见被截断的原始变量。你可以通过运行本书代码仓库中的\
  \ Jupyter Notebook 获取完整列表。\n\n接下来的步骤基本不言自明。`LogisticRegression` 中的 `maxIter` 参数是一个新元素。逻辑回归通常通过迭代过程求解，随着迭代的进行结果会改进。每次迭代都需要对整个数据集进行一次遍历。对于大到需要使用\
  \ PySpark 的数据集，这可能花费的时间比你想要的要多。因此，要谨慎地增加迭代次数。你可以先尝试将其设为 10 运行几遍，然后增加两倍，看看是否能显著提高分类性能。在此过程中请留意云计算费用。\n\
  \n#### 清单 5-9：用于训练岩石与地雷问题 PySpark 模型的代码——rocksVMines_spark.py\n\n\n\n\n##### PySpark\
  \ 逻辑回归：岩石与矿山分类\n\n###### 代码实现\n\n```python\n__author__ = 'mike_bowles'\n\n#######\
  \ Import sparksession\nfrom pyspark.sql import SparkSession\nfrom pyspark.ml.feature\
  \ import VectorAssembler\nimport matplotlib.pyplot as plt\nfrom pyspark.ml.feature\
  \ import OneHotEncoderEstimator, StringIndexer, VectorAssembler\nfrom pyspark.ml.classification\
  \ import LogisticRegression\nimport pandas as pd\nfrom pandas import DataFrame\n\
  from Read_Fcns import pd_read_rvm\nfrom pyspark.ml import Pipeline\nfrom pyspark.ml.evaluation\
  \ import BinaryClassificationEvaluator\n\n\nspark = SparkSession.builder.appName(\"\
  log_regress_rvm\").getOrCreate()\n\n####### read in abalone data as pandas data\
  \ frame and create Spark data frame.\nrvm_df = pd_read_rvm()\n\n####### Create spark\
  \ dataframe for wine data\nrvm_sp_df = spark.createDataFrame(rvm_df)\nprint('Column\
  \ Names', rvm_sp_df.columns, '\\n\\n')\n\ncols = rvm_sp_df.columns\n\nassembler_inputs\
  \ = ['V0', 'V1', 'V2', 'V3', 'V4', 'V5', 'V6', 'V7',\n'V8', 'V9', 'V10', 'V11',\
  \ 'V12', 'V13', 'V14', 'V15', 'V16', 'V17',\n'V18', 'V19', 'V20', 'V21', 'V22',\
  \ 'V23', 'V24', 'V25', 'V26',\n'V27', 'V28', 'V29', 'V30', 'V31', 'V32', 'V33',\
