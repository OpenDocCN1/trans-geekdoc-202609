  \ X 矩阵（以列表的列表形式）中提取选定的列。然后，它将 X 矩阵和标签向量分割为训练集和测试集。之后，代码遵循前面的算法描述。算法的一次遍历从解中包含的属性子集开始。对于第一次遍历，此子集为空。对于后续遍历，该子集包括在早期遍历中逐个选择的属性。每次遍历选择单个新属性添加到属性子集中。要添加的属性是通过测试每个未包含的属性来选择的，以查看哪一个在添加到子集后产生最佳性能。依次将每个属性添加到属性子集中，并使用普通最小二乘法拟合具有生成的属性子集的线性模型。对于测试的每个属性，都会测量样本外性能。产生最佳均方根（RSS）误差的测试属性将被添加到属性集中，并捕获相关的\
  \ RSS 误差。\n\n图 3.13 绘制了作为回归中包含的属性数量函数的 RMSE。误差随属性增加而减少，直到包含 9 个属性时达到最小，之后略有增加。\n\
