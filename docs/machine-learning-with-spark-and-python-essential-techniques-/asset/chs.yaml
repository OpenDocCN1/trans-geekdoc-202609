  \n在本节中，你已经了解了如何为多类别预测问题构建`RandomForestClassifier`模型。截至撰写本文时，PySpark 版本的`GBTClassifier`不支持多类别问题，因此此处未包含梯度提升模型。\n\
  \n## 总结\n\n本章演示了作为`XGBoost`、`Python sklearn`和`PySpark`包可用的集成方法。示例展示了这些方法在各种不同类型问题上的建模应用。本章还涵盖了回归、二分类和多类别分类问题，并讨论了这些主题的变体，例如为`XGBoost`、`Python`和`PySpark`集成方法编码分类变量作为输入，以及分层采样。这些示例涵盖了你在实践中可能遇到的许多问题类型。\n\
  \n这些示例还演示了集成算法的一些重要特性——这也是它们成为数据科学家首选的原因。集成方法使用相对容易——它们没有太多需要调优的参数，能提供变量重要性数据以帮助模型开发的早期阶段，并且通常能达到可实现的最佳性能。\n\
