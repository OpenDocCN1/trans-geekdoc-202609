  \n##### 使用 PySpark 集成方法预测鲍鱼年龄\n\n本节采用上一节中相同的 `GBTRegressor` 和 `RandomForestRegressor`。主要区别在于数据准备阶段。`sex`\
  \ 属性是一个三值分类变量，需要进行独热编码才能在上述包中使用。Listing 7-11 详细演示了该过程，并实例化了一个 `GBTRegressor` 模型。结果在代码末尾打印输出。输出结果展示了引入向量组装器输出前后的模式对比。请特别注意，特征向量在第二个模式中作为新增列出现。\n\
