  plt.boxplot(array3)\nplt.xlabel(\"Attribute Index\")\nplt.ylabel((\"Quartile Ranges\
  \ - Normalized \"))\nplt.show()\n```\n\nPrinted Output:\n```\n  Sex  Length  Diameter\
