  \ dpi=500)\nplt.show()\n\n\n打印输出：\nMisclassification Error\n0.2272727272727273\n\
  \nConfusion Matrix\n[[17  2  1  0  0  1]\n [ 2 18  1  2  0  0]\n [ 2  0  4  0  0\
  \  0]\n [ 0  1  0  3  0  0]\n [ 0  1  0  0  2  0]\n [ 0  2  0  0  0  7]] \n```\n\
  \n该代码生成随机森林模型，并绘制训练进度和变量重要性图。它还会打印出一个混淆矩阵，显示预测模型如何处理数据总体中的每个类别。它展示了预测器将每个类别中多少样本映射到正确类别，以及多少映射到错误类别。如果分类器完美无缺，矩阵中不应有非对角线元素。\n\
  \n### 确定随机森林模型在玻璃分类上的性能\n\nFigure 7.15 展示了随着集成中包含的树越来越多，随机森林的性能如何提升。曲线通常随树的增加而下降。随着树的增加，改进率逐渐降低。在图表停止的位置，改进已大幅放缓。\n\
  \n![Figure 7.15: The overall performance of random forests](img/c07f015.png)\n\n\
  **Figure 7.15**：随机森林的整体性能\n\n![Figure 7.16: The relative importance of the variables\
  \ used by random forest](img/c07f016.png)\n\n**Figure 7.16**：随机森林所用变量的相对重要性\n\n\
  Figure 7.16 是一个条形图，显示了随机森林所用变量的相对重要性。图表显示许多变量的性能大致相当。这种行为不寻常。在许多情况下，变量重要性在前几个变量后就会迅速下降。本问题包含多个同等重要的变量。\n\
  \n## 使用 PySpark 集成包解决回归问题\n\n本节将回顾您在全书中看到的示例，并演示如何使用 PySpark 中可用的集成方法为每个示例构建模型。本节结合了您在第\
  \ 5 章中学到的内容以及您刚刚看到的关于使用集成方法构建模型的内容。在 PySpark 中使用集成方法涉及与您在第 5 章中看到的完全相同的数据准备步骤，并使用您在本章中迄今为止学到的相同梯度提升和随机森林算法。PySpark\
  \ 的梯度提升和随机森林算法具有您之前见过的相同可调参数。一旦数据像在第 5 章中那样准备就绪，只需学习一些符号和变量名的细微差别即可。\n\n\n\n\nPySpark\
  \ 中的数据准备仅取决于数据集。无论您选择使用惩罚线性回归还是梯度提升，PySpark 回归包接受的输入都是相同的。下一节“使用 PySpark 集成方法预测葡萄酒口感”将演示，只需更改极少数几行代码，即可从使用梯度提升切换到使用随机森林。后续章节涵盖的其余问题（鲍鱼、岩石与地雷、玻璃分类）将包含梯度提升示例的数据准备，并在单独的代码清单中给出随机森林的代码。\n\
  \n从第 5 章中介绍的 PySpark 示例中，您已经看到 PySpark 中的数据准备比 Python 中的 `numpy` 或 `pandas` 更复杂。另一方面，从用户的角度来看，集成算法更简单。它们没有像您在\
  \ `XGBoost` 或 `sklearn` 随机森林中看到的那么多选项。PySpark 的用户界面更简单，因为在分布式环境中对算法进行编程要难得多，因此要像本章前面学习的那些包那样提供那么多可调功能要困难得多。\n\
  \n梯度提升和随机森林的特性足够相似，可以在一个描述中涵盖，仅在极少数存在差异的地方加以说明。\n\n首先，实例化模型后，用于训练和进行预测的函数是 `fit()`\
  \ 和 `transform()`。`fit` 函数的唯一参数是用于训练的数据帧。正如您在第 5 章中所见，输入的 PySpark 数据帧同时携带特征集和标签。`transform`\
  \ 函数也接受单个参数，通常是用于训练的数据帧的测试版本。\n\n### 使用 PySpark 集成方法预测葡萄酒口感\n\n清单 7-9 逐步介绍了构建数据帧的过程，该数据帧将用于训练和测试\
  \ PySpark 梯度提升模型。您将熟悉在第 5 章中看到的向量组装器。您在这里看到的代码与之前完全相同，一直到实例化 `GBTRegressor` 模型为止。实例化过程指定数据帧中的哪些列将作为特征和标签，并定义任何梯度提升模型所需的训练参数——集成中的树的数量、这些树的深度、从训练集中抽取用于训练每棵树的随机子样本的大小，以及学习率。在\
  \ PySpark 梯度提升模型中，树的数量称为 `maxIter`，树的深度称为 `maxDepth`，子样本大小称为 `subsamplingRate`，学习率称为\
  \ `stepSize`。它们的功能与您在本章前面看到的 `XGBoost` 模型中的功能相同。生成预测只需两步。首先，`transform` 函数使用训练好的模型将测试数据帧转换为预测结果。下一步实例化一个\
  \ `RegressionEvaluator`，它从转换输出中定义预测列和真实列，并选择一个回归指标。您将看到两个不同的评估器——一个用于生成均方根误差，另一个用于生成解释方差（R\
  \ 平方）。此处显示的性能为 0.739。您从之前的研究中知道这可以改进。尝试调整参数以获得更好的结果。\n\n#### 清单 7-9：使用 PySpark GBM\
  \ 预测葡萄酒质量——wine_taste_pred_spark_gbm.py\n\n```\n__author__ = 'mike_bowles'\n\n#Import\
  \ sparksession \nfrom pyspark.sql import SparkSession\nfrom pyspark.ml.feature import\
  \ VectorAssembler\nfrom pyspark.ml.regression import GBTRegressor\nfrom pyspark.ml.evaluation\
  \ import RegressionEvaluator\nimport matplotlib.pyplot as plt\n\nspark = SparkSession.builder.appName(\"\
  regress_wine_data\").getOrCreate()\n\n#read in abalone data as pandas data frame\
  \ and create Spark data frame. \nimport pandas as pd\nfrom pandas import DataFrame\n\
  from Read_Fcns import pd_read_wine\n\nwine_df = pd_read_wine()\n\n#Create spark\
  \ dataframe for wine data\nwine_sp_df = spark.createDataFrame(wine_df)\nprint('Column\
  \ Names', wine_sp_df.columns, '\\n\\n')\n\nvectorAssembler = VectorAssembler(inputCols\
  \ = ['fixed acidity', \\\n    'volatile acidity', 'citric acid', 'residual sugar',\
  \ 'chlorides', \\\n    'free sulfur dioxide', 'total sulfur dioxide', 'density',\
  \ 'pH', \\\n                    'sulphates', 'alcohol'], outputCol = 'features')\n\
  v_wine_df = vectorAssembler.transform(wine_sp_df)\nvwine_df = v_wine_df.select(['features',\
  \ 'quality'])\n\n\nsplits = vwine_df.randomSplit([0.66, 0.34])\nx_train_sp = splits[0]\n\
  x_test_sp = splits[1]\n   \n \ngbt = GBTRegressor(featuresCol = 'features', \n \
  \                  labelCol = 'quality', \n                   maxIter=100, \n  \
  \                 maxDepth=5, \n                   subsamplingRate=0.5, \n     \
  \              stepSize=0.1)  \n\ngbt_model = gbt.fit(x_train_sp)\ngbt_predictions\
  \ = gbt_model.transform(x_test_sp)\ngbt_predictions.select('prediction', 'quality').show(5)\n\
  \n\n\ngbt_evaluator1 = RegressionEvaluator(\n          labelCol=\"quality\", \n\
  \          predictionCol=\"prediction\", \n          metricName=\"rmse\")\nrmse\
  \ = gbt_evaluator1.evaluate(gbt_predictions)\ngbt_evaluator2 = RegressionEvaluator(\n\
  \         labelCol=\"quality\", \n         predictionCol=\"prediction\", \n    \
  \     metricName=\"r2\")\nr2 = gbt_evaluator2.evaluate(gbt_predictions)\n\nprint(\"\
  Root Mean Squared Error (RMSE) on test data = %g\" % rmse)\nprint('R-squared on\
  \ test data =', r2)\n\nPrinted Output:\nColumn Names ['fixed acidity', 'volatile\
  \ acidity', 'citric acid', \n              'residual sugar', 'chlorides', 'free\
  \ sulfur dioxide', \n              'total sulfur dioxide', 'density', 'pH', 'sulphates',\
  \ \n              'alcohol', 'quality'] \n\n\n+-----------------+-------+\n|   \
  \    prediction|quality|\n+-----------------+-------+\n|5.888749136462941|     \
  \ 4|\n|6.160043612129055|      6|\n|4.770216506879649|      5|\n|5.238104393216513|\
  \      5|\n|3.957840392301747|      4|\n+-----------------+-------+\nonly showing\
  \ top 5 rows\n\nRoot Mean Squared Error (RMSE) on test data = 0.739396\nR-squared\
  \ on test data = 0.18213112569257273 \n```\n\n清单 7-10 展示了如何使用 PySpark 随机森林构建预测葡萄酒口感的模型。数据准备与清单\
  \ 7-9 中使用 GBM 的方法完全相同。随机森林使用默认参数运行——即 `numTrees=20` 和 `maxDepth=5`。尝试更改这些参数，看看它们对性能和运行时间有何影响。性能评估采用与清单\
  \ 7-9 中梯度提升相同的方法。随机森林易于调优（几乎不需要调优），使其成为一个简单的首选。梯度提升有时能提供更好的性能，但需要更多的工作和计算时间。\n\n\
