  \n*Mike Bowles，硅谷，2019 年*\n\n# 作者简介\n\n**Dr. Michael Bowles** (Mike) 拥有机械工程学士和硕士学位、仪器学\
  \ ScD 学位以及 MBA 学位。他曾在学术界、技术界和商界工作。Mike 目前与那些人工智能或机器学习对其成功至关重要的公司合作。他以管理团队成员、顾问或顾问等不同身份为这些公司服务。他还在\
  \ UC Berkeley 和 Hacker Dojo（位于加利福尼亚州山景城的联合办公空间和初创企业孵化器）教授机器学习课程。\n\nMike 出生于俄克拉荷马州，在那里获得了学士和硕士学位，随后在东南亚工作一段时间后前往剑桥攻读\
  \ ScD 学位，毕业后获得 MIT 的 C. Stark Draper Chair 职位。Mike 离开波士顿前往南加州的 Hughes Aircraft Company\
  \ 从事通信卫星工作，随后在 UCLA 完成 MBA 学位后搬到旧金山湾区，担任两家成功的风险投资支持的初创公司的创始人兼 CEO。\n\n\n\n\n\nMike\
  \ 仍积极参与技术和初创企业相关工作。近期项目包括在工业检测和自动化、金融预测、基于分子图结构预测生物学结果以及金融风险估计中应用机器学习。他曾参与人工智能和机器学习领域公司的尽职调查工作。可通过\
  \ `mbowles.com` 联系 Mike。\n\n## 关于技术编辑\n\n**James York-Winegar** 是 Accenture Enkitec\
  \ Group 的基础设施首席顾问。James 通过帮助从初创公司到大型企业的各种规模公司弥合系统管理与数据科学之间的鸿沟，协助它们管理数据生命周期。他以物理学起家，曾在超级计算机上进行大规模量子化学模拟，随后投身技术领域。他拥有伯克利大学的数据科学硕士学位。\n\
