- "## Spark 与 Python 机器学习：预测分析核心技术\n\n\n\n## 简介\n\n从数据中提取可操作信息正在以直接影响程序员的方式改变现代商业的结构。其中一种方式是对新编程技能的需求。市场分析师预测，到\
  \ 2018 年，对拥有高级统计和机器学习技能人才的需求将比供应量多出 140,000 到 190,000 人。这意味着具备相应技能的人将获得优厚的薪水，并拥有广泛的有趣项目选择。另一个影响程序员的发展是统计学和机器学习核心工具开发的进步。这使程序员不必在每次想尝试新算法时都亲自编写复杂的算法。在通用编程语言中，Python\
  \ 开发者一直处于前沿，构建了最先进的机器学习工具，但拥有工具与能够高效使用工具之间存在差距。\n\n程序员可以通过多种途径获得关于机器学习的通用知识：在线课程、许多写得很好的书籍等。其中许多提供了优秀的机器学习算法综述及其使用示例，但由于可用的不同算法太多，很难在综述中涵盖它们使用的细节。\n\
  \n这给实践者留下了一个空白。可用算法的数量要求做出选择，而初涉机器学习的程序员可能无法胜任这些选择，除非尝试过几种；同时，这也让程序员自行填补这些算法在整体问题构建和解决背景下的使用细节。\n\
  \n\n\n\n\n## 本书旨在弥合这一差距\n\n本书采用的方法是将所涵盖的算法限制在两个算法家族中，这两个家族已被证明能为各种各样的问题提供最优性能。这一断言得到了以下事实的支持：它们在机器学习竞赛中占据主导地位；在新开发的机器学习工具包中被早早纳入；以及在比较研究中的表现（详见第\
  \ 1 章“用于预测的两大核心算法”）。将关注点局限于两个算法家族，使得深入讲解其运行原理成为可能，并能详细演示多个示例，展示这些算法如何应用于不同结构的问题。\n\
  \n本书主要依靠代码示例来说明所讨论算法的运行原理。我在加州大学伯克利分校、Galvanize、新哈芬大学和 Hacker Dojo 讲授课程时发现，程序员通过查看简单的代码演示来掌握原理，通常比看数学公式更容易上手。\n\
  \n本书聚焦于 `Python`，因为它在功能性和包含机器学习算法的专用包之间提供了良好的融合。`Python` 是一种常用语言，以生成紧凑、可读性强的代码而著称。这一特性促使许多领先公司采用\
  \ `Python` 进行原型设计和部署。`Python` 开发者拥有庞大的同行开发者社区、开发工具、扩展库等支持。`Python` 也广泛应用于工业应用和科学编程。它拥有许多支持机器学习等计算密集型应用的包，且汇集了领先的机器学习算法（因此你无需亲自编写它们）。与\
  \ `R` 或 `SAS`（统计分析系统）等专业统计语言相比，`Python` 是一种更好的通用编程语言。其机器学习算法集合包含许多顶尖算法，且仍在不断扩展。\n\
  \n### 本书适合的读者\n\n本书面向希望将机器学习纳入技能栈的 `Python` 程序员，无论是为了特定项目，还是为了保持工具箱的时效性。也许工作中出现了一个需要机器学习的新问题。如今机器学习在新闻中曝光率极高，将其列在简历上是一项有用的技能。\n\
  \n本书为 `Python` 程序员提供以下内容：\n\n*   机器学习所解决的基本问题描述\n*   若干最先进的算法\n*   这些算法的运行原理\n*\
  \   规定、设计和验证机器学习系统的流程步骤\n*   流程与算法的示例\n*   可直接修改实验的代码\n\n要轻松读完本书，你的主要背景要求包括理解编程或计算机科学，以及具备读写代码的能力。代码示例、库和包均为\
  \ `Python`，因此本书对 `Python` 程序员最为实用。在某些情况下，本书会讲解算法核心部分的代码以演示运行原理，随后使用包含该算法的 `Python`\
  \ 包将其应用于实际问题。对程序员而言，阅读代码往往能像数学公式对其他人一样，直观地掌握算法。一旦建立起理解，示例将使用功能完善的 `Python` 包（包含错误检查、输入输出处理、模型的成熟数据结构、融合训练模型的预测方法等对高效使用至关重要的特性）。\n\
  \n除了编程背景，一定的数学和统计知识将帮助你更轻松地掌握内容。数学要求包括本科水平的微分学（知道如何求导以及一点线性代数）、矩阵表示法、矩阵乘法和矩阵求逆。这些主要用于推导本书所涵盖的某些算法。很多时候，这仅涉及对简单函数求导或进行基本的矩阵运算。能在概念层面跟上推导过程，有助于你理解算法。理解推导步骤能帮助你洞悉算法的优劣势，并判断哪种算法可能是特定问题的最佳选择。\n\
  \n本书还用到一些概率论和统计学基础。要求包括具备本科水平的概率论基础，以及均值、方差、相关性等概念。如果某些概念生疏了，你随时可以通过阅读代码来理解。\n\n\
  本书涵盖两大类机器学习算法：惩罚线性回归（如岭回归和 Lasso）和集成方法（如随机森林和梯度提升）。每个家族都包含可解决回归和分类问题的变体。（你将在本书早期了解分类与回归的区别。）\n\
  \n已熟悉机器学习且仅对其中某一家族感兴趣的读者，可直接跳转至讲解该家族的两章。每种方法各分配两章——一章讲原理，一章讲在不同类型问题上的应用。惩罚线性回归见第\
  \ 4 章“惩罚线性回归”和第 5 章“使用惩罚线性方法构建预测模型”。集成方法见第 6 章“集成方法”和第 7 章“使用 Python 构建集成模型”。为了熟悉算法应用章节中涉及的问题，你可能会发现浏览第\
  \ 2 章“通过理解数据来理解问题”很有帮助，该章涉及数据探索。想从头到尾系统学习机器学习的初学者，可能希望等到后面章节看问题解决方案时，再回头研读第 2 章。\n\
  \n### 本书内容概览\n\n如前所述，本书涵盖两个算法家族，它们是相对较新的发展成果，且仍处于活跃研究中。它们都依赖于并一定程度上取代了早期技术。\n\n\
  惩罚线性回归代表了在改进普通最小二乘回归的持续研究中的一个较新发展。惩罚线性回归有几个特性使其成为预测分析的首选。它引入了一个可调参数，使得在过拟合和欠拟合之间平衡最终模型成为可能。它还能给出各输入变量对预测相对重要性的信息。这两个特性对开发预测模型的过程至关重要。此外，惩罚线性回归在某些问题类别中能产出最佳预测性能，特别是欠定问题以及具有极多输入参数的问题，如基因学和文本挖掘。而且，坐标下降法近期取得了巨大发展，使得训练惩罚线性回归模型变得极快。\n\
  \n为帮助你理解惩罚线性回归，本书回顾了普通线性回归及其其他扩展，如逐步回归。希望这些内容能帮助建立直觉。\n\n\n\n\n\n## 集成方法：强大的预测分析工具\n\
  \n集成方法是目前可用的最强大的预测分析工具之一。它们能够对极其复杂的行为进行建模，特别是针对那些严重过定的问题，这在许多基于 Web 的预测问题中很常见（例如返回搜索结果或预测广告点击率）。许多资深数据科学家因其卓越的性能，将集成方法作为首选尝试。它们使用起来相对简单，并且还能根据预测性能对变量进行排序。\n\
  \n集成方法的发展路径与惩罚线性回归平行。惩罚线性回归是为克服普通回归的局限性而演变而来的，而集成方法则是为克服二叉决策树的局限性而演变而来的。相应地，本书对集成方法的介绍涵盖了一些关于二叉决策树的背景知识，因为集成方法继承了二叉决策树的一些特性。了解这些有助于建立对集成方法的直觉。\n\
  \n### 首版出版以来的变化\n\n自首版出版以来的三年里，`Python` 已更稳固地确立了其作为数据科学主要语言的地位。`Spark` 等大数据平台或 `TensorFlow`\
  \ 和 `Torch` 等深度学习平台的开发者均采用了 `Python` 接口，以触达最广泛的数据科学家群体。首版中强调的两大类算法依然备受青睐，现已作为 `PySpark`\
  \ 的一部分提供。\n\n这种结合之美在于：在真正海量的数据集上构建机器学习模型所需的代码，并不比在较小数据集上所需的代码更复杂。\n\n`PySpark` 体现了若干重要进展，使得通过相对简单、易读易写的\
  \ `Python` 代码即可调用功能强大的机器学习工具。在本书首版撰写时，在超大数据集上构建机器学习模型需要启动数百个处理器，这要求掌握大量的数据中心流程和编程知识。过程繁琐，坦白说效果并不理想。`Spark`\
  \ 架构的开发正是为了解决这一难题。\n\n`Spark` 使得轻松租用并使用大量处理器进行机器学习成为可能。`PySpark` 增加了 `Python` 接口。结果是在\
  \ `PySpark` 中运行机器学习算法的代码，并不比运行纯 `Python` 版本的程序复杂多少。首版重点关注的算法依然是广泛使用的宠儿，且已在 `Spark`\
  \ 中可用。因此，在书中添加 `PySpark` 示例与 `Python` 示例并列，以帮助读者熟悉 `PySpark`，这显得很自然。\n\n在本版中，所有代码示例均采用\
  \ `Python 3`，因为 `Python 2` 即将停止支持；除了以文本形式提供代码外，代码还以每章一个 `Jupyter` 笔记本的形式提供。笔记本代码执行后将绘制出您在图表中看到的图形和表格。\n\
  \n### 本书结构安排\n\n本书遵循您处理新预测问题时的基本顺序。开始阶段涉及理解数据并确定如何构建问题，随后尝试算法并衡量性能。在此序列中，本书会随遇随解地概述各步骤的方法和理由。第\
  \ 1 章 更详细地描述了本书涵盖的问题类型和使用的方法。本书使用 UC Irvine 数据仓库的若干数据集作为示例，第 2 章 展示了一些可用于深入了解新数据集的方法和工具。第\
  \ 3 章“预测模型构建：平衡性能、复杂性与大数据”探讨了预测分析的困难及应对技术。它概述了问题复杂性、模型复杂性、数据集大小与预测性能之间的关系。它讨论了过拟合以及如何可靠地检测过拟合。它还谈论了不同类型问题的性能指标。第\
  \ 4 章 和 第 5 章 分别介绍惩罚线性回归的背景及其在 第 2 章 探讨问题中的应用。第 6 章 和 第 7 章 介绍集成方法的背景与应用。\n\n###\
  \ 使用本书所需环境\n\n要运行书中的代码示例，您需要安装 `Python 3.x`、`SciPy`、`numpy`、`pandas`、`scikit-learn`\
  \ 和 `PySpark`。由于交叉依赖和版本问题，这些包可能难以安装。为简化安装，我使用了 Continuum Analytics（`http://continuum.io/`）提供的这些包的免费发行版。其\
  \ `Anaconda` 产品可免费下载，包含 `Python 3.x` 及运行本书代码所需的所有包（甚至更多）。我已在 `Ubuntu 14.04 Linux`\
  \ 上运行示例，但未在其他操作系统上尝试。\n\n`PySpark` 需要 `Linux` 环境。如果您不在 `Linux` 上运行，运行示例最简单的方法可能是使用虚拟机。`Virtual\
  \ Box` 是一款免费开源的虚拟机——按照说明下载 `Virtual Box`，然后安装 `Ubuntu 18.05` 并使用 `Anaconda` 安装 `Python`、`PySpark`\
  \ 等。您只需使用 VM 来运行 `PySpark` 示例。非 Spark 代码可在任何能打开 `Jupyter` 笔记本的地方运行。\n\n### 本书读者支持\n\
  \n书籍代码库中的源代码可帮助您加快学习进度。各章节包含安装说明，以便您在阅读的同时进行编码。\n\n#### 源代码\n\n在学习本书示例时，您可以选择手动输入所有代码，或使用随书附带的源代码文件。本书使用的所有源代码均可从\
  \ `http://www.wiley.com/go/pythonmachinelearning2e` 下载。您会发现源代码中的代码片段伴随一个下载图标和注释，指明程序名称，以便您知晓其可下载并在下载文件中轻松定位。\n\
  \n除了以文本形式提供代码外，代码还包含在 `Python` 笔记本中。如果您知道如何运行 `Jupyter` 笔记本，可以逐单元格运行代码。输出将显示在笔记本中，图形将被绘制，打印输出将出现在代码块下方。\n\
  \n下载代码后，只需用您喜欢的压缩工具解压即可。\n\n#### 如何联系出版社\n\n如果您认为在本书中发现了错误，请告知我们。John Wiley & Sons\
  \ 深知为客户提供准确内容的重要性，但即使尽了最大努力，错误仍可能发生。\n\n如需提交可能的勘误，请发送邮件至我们的客户服务团队 `wileysupport@wiley.com`，主题行请注明“Possible\
  \ Book Errata Submission”（可能的图书勘误提交）。\n\n# 第 1 章：进行预测的两大核心算法\n\n本书专注于机器学习过程，因此仅涵盖少数最高效且最广泛使用的算法。它不提供机器学习技术的综述。因为综述中可能包含的许多算法并未被从业者实际使用。\n\
  \n\n\n\n## 为什么这两种算法如此有用？\n\n有几个因素使得惩罚线性回归和集成方法成为一个有用的组合。简单来说，它们将在实践中遇到的绝大多数预测分析（函数逼近）问题上提供最优或近似最优的性能，包括大数据集、小数据集、宽数据集、高瘦数据集、复杂问题和简单问题。这一断言的证据可以在\
  \ Rich Caruana 及其同事的两篇论文中找到：\n\n*   “An Empirical Comparison of Supervised Learning\
  \ Algorithms”，作者 Rich Caruana 和 Alexandru Niculescu-Mizil¹\n*   “An Empirical Evaluation\
  \ of Supervised Learning in High Dimensions”，作者 Rich Caruana、Nikos Karampatziakis\
  \ 和 Ainur Yessenalina²\n\n在这两篇论文中，作者选择了多种分类问题，并应用多种不同的算法来构建预测模型。这些模型在未包含在训练中的测试数据上运行，然后根据算法在问题上的表现对研究中包含的算法进行排名。第一项研究比较了\
  \ 9 种不同的基础算法在 11 个不同机器学习（二元分类）问题上的表现。研究中使用的问题来自各个领域，包括人口统计数据、文本处理、模式识别、物理学和生物学。**表\
  \ 1.1** 列出了研究中使用的数据集，名称与研究作者给出的相同。表格显示了每个数据集可用于预测结果的属性数量，以及正例所占的百分比。\n\n**表 1.1**：机器学习比较研究中问题的概况\n\
  \n| DATA SET NAME | NUMBER OF ATTRIBUTES | % OF EXAMPLES THAT ARE POSITIVE |\n|\
  \ --- | --- | --- |\n| Adult | 14 | 25 |\n| Bact | 11 | 69 |\n| Cod | 15 | 50 |\n\
  | Calhous | 9 | 52 |\n| Cov_Type | 54 | 36 |\n| HS | 200 | 24 |\n| Letter.p1 | 16\
  \ | 3 |\n| Letter.p2 | 16 | 53 |\n| Medis | 63 | 11 |\n| Mg | 124 | 17 |\n| Slac\
  \ | 59 | 50 |\n\n分类问题中的*正例*是指结果为正的实验（输入数据集中的一行数据）。例如，如果分类器旨在确定雷达回波信号是否表明飞机的存在，那么正例就是雷达视野中确实有飞机的那些回波。*正例*一词源于这种结果代表存在或不存在这类示例。其他例子包括医学检测中疾病的存在或不存在，或纳税申报中作弊的存在或不存在。\n\
  \n并非所有分类问题都涉及存在或不存在。例如，通过机器阅读文本或分析手写样本来确定作者的性别有两个类别——男性和女性——但不存在一方是另一方不存在的情况。在这些情况下，“正例”和“负例”标签的分配有一定的随意性。正负标签的分配可以是任意的，但一旦选定就必须始终如一地使用。\n\
  \n第一项研究中的一些问题，某一类别的示例比另一类别多得多。这些被称为*不平衡*问题。例如，`Letter.p1` 和 `Letter.p2` 这两个数据集提出了密切相关的问题，即在各种字体中正确分类打印的大写字母。`Letter.p1`\
  \ 的任务是在标准字母混合中正确分类字母 *O*。`Letter.p2` 的任务是正确分类 *A–M* 与 *N–Z*。**表 1.1** 中显示的正例百分比反映了这一差异。\n\
  \n**表 1.1** 还显示了每个数据集中的“属性”数量。属性是你可用来进行预测的变量。例如，为了预测飞机是否准时到达目的地，你可能会纳入航空公司名称、飞机型号和年份、目的地机场降水量、航路沿线风速和风向等属性。拥有大量可用于预测的属性既是福也是祸。与预测结果直接相关的属性是福；与结果无关的属性则是祸。区分福祸属性需要数据。**第\
  \ 3 章** “预测模型构建：平衡性能、复杂性和大数据”将更详细地讨论这一点。\n\n**表 1.2** 显示了本书涵盖的算法在研究中与其他算法相比的表现。**表\
  \ 1.2** 显示了针对**表 1.1** 中列出的每个问题，哪些算法显示了前五名的性能得分。本书涵盖的算法完整拼写为：提升决策树、随机森林、装袋决策树和逻辑回归。前三者属于集成方法。研究进行时惩罚回归尚未完全开发，因此未被评估。逻辑回归是其近亲，用于衡量回归方法的成功程度。研究中使用的\
  \ 9 种算法每种都应用了 3 种不同的数据缩减技术，共 27 种组合。前五名约代表性能得分的前 20%。`Covt` 行旁边的数据表明，提升决策树算法排名第一和第二，随机森林算法排名第四和第五，装袋决策树算法排名第三。在未涵盖算法进入前五名的情况下，`Other`\
  \ 列会显示条目。出现在那里的算法包括 *k-近邻* (KNN)、*人工神经网络* (ANN) 和 *支持向量机* (SVM)。\n\n**表 1.2**：本书涵盖的算法在不同问题上的比较表现\n\
  \n| ALGORITHM | BOOSTED DECISION TREES | RANDOM FORESTS | BAGGED DECISION TREES\
  \ | LOGISTIC REGRESSION | OTHER |\n| --- | --- | --- | --- | --- | --- |\n| Covt\
  \ | 1, 2 | 4, 5 | 3 | | |\n\n\n\n\n### 算法性能对比表\n\n| 数据集 | 成人 | LTR.P1 | LTR.P2 |\
  \ MEDIS | SLAC | HS | MG | CALHOUS | COD | BACT |\n| :--- | :--- | :--- | :--- |\
  \ :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| **属性数/类别** | 1, 4 / 2 / 3,\
  \ 5 | 1 | 1, 2 / 4, 5 | 1, 3 / 5 | 1, 2, 3 / 4, 5 | 1, 3 | 2, 4, 5 / 1, 3 | 1, 2\
  \ / 5 / 3, 4 | 1, 2 / 3, 4, 5 | 2, 5 / 1, 3, 4 |\n| **算法** | SVM, KNN | SVM, KNN\
  \ | SVM | ANN | | ANN | | | | |\n\n逻辑回归在表 1.2 中仅在一种情况下获得前五名。原因在于这些数据集的属性较少（最多 200\
  \ 个），相对于样本数（每个数据集 5,000 个）而言。数据量足以解析如此少属性的模型，而训练集又足够小，训练时间不算过长。\n\n正如你将在第 3 章以及第\
  \ 5 章“使用惩罚线性方法构建预测模型”和第 7 章“使用 Python 构建集成模型”中的示例所见，当属性众多而样本或训练时间不足以训练更复杂的集成模型时，惩罚回归方法相对于其他算法表现最佳。\n\
  \nCaruana 等人在 2008 年进行了一项新研究，探讨属性数量增加时这些算法的对比情况，即它们在大数据上的表现如何。许多领域的属性数量远超第一项研究中的数据集。例如，基因组学问题拥有数万个属性（每个基因一个属性），文本挖掘问题可拥有数百万个属性（每个不同单词或单词对一个属性）。表\
  \ 1.3 展示了线性回归和集成方法随属性增长的表现。表 1.3 显示了第二项研究中各算法的排名。表格展示了各算法在每个问题上的单独表现，最右列显示了各算法在所有问题上的平均得分排名。研究中的算法分为两组：上组算法将在本书中介绍，下组则不涉及。\n\
  \n表 1.3 中的问题按属性数量排序，范围从 761 到 685,569。线性（逻辑）回归在研究使用的 11 个测试用例中有 5 个位居前三。这些优异成绩集中在较大的数据集上。注意，提升决策树（表\
  \ 1.3 中用 `BSTDT` 表示）和随机森林（用 `RF` 表示）算法仍表现靠前，它们在这些问题上的总分分别排名第一和第二。\n\n本书涵盖的算法除原始预测性能外还有其他优势。本书介绍的惩罚线性回归模型的一大优势是训练速度快。在大规模问题上，训练速度可能成为瓶颈。某些问题的模型训练可能耗时数天或数周，这在开发早期需要迭代寻找最佳方案时尤为难以接受。除了训练极快，部署后的线性模型还能极快地生成预测——足以胜任高频交易或互联网广告插入。研究表明，惩罚线性回归在许多情况下能提供最佳答案，即使不是最佳也能接近顶尖水平。\n\
  \n此外，这些算法使用起来相对容易。它们没有太多可调参数，具有定义良好、结构清晰的输入类型，能解决回归和分类中的多种问题。在开始新问题后一两小时内，通常就能整理好输入数据并生成首个训练模型及性能预测。\n\
  \n它们最重要的特性之一是能指示哪些输入变量对预测最重要。这被证明是机器学习算法中极其宝贵的特性。预测模型开发中最耗时的步骤之一是所谓的“特征选择”或“特征工程”，即数据科学家选择用于预测结果的变量。通过按重要性对特征排序，本书涵盖的算法减少了开发过程中的猜测，使流程更加确定。\n\
  \n### 什么是惩罚回归方法？\n\n惩罚线性回归是“普通最小二乘”（`OLS`）回归的衍生形式——这是高斯和勒让德约 200 年前开发的方法。惩罚线性回归方法旨在克服\
  \ `OLS` 回归的一些基本局限。`OLS` 的基本问题是有时会过拟合。可将 `OLS` 视为拟合一条穿过一组点的线，如图 1.1 所示。这是一个简单的预测问题：给定单个属性\
  \ `x`，预测目标值 `y`。例如，仅用身高预测男性薪资。身高对男性薪资略有预测力（但对女性无效）。\n\n![图 1.1：普通最小二乘拟合](img/c01f001.png)\n\
  \n**图 1.1：普通最小二乘拟合**\n\n图 1.1 中的点代表男性薪资与身高的关系。图中的线代表该预测问题的 `OLS` 解。在某种意义上，这条线是基于身高预测男性薪资的最佳模型。数据集包含六个点。假设数据集只有两个点。想象存在一个类似图\
  \ 1.1 的点群体，但你无法看到所有点。也许生成它们成本太高，如前所述的基因数据。有足够的人类可用于分离罪魁祸首基因，问题在于因成本原因你没有许多人的基因序列。\n\
  \n\n\n\n\n### 模拟数据点减少的影响\n\n为了在简单示例中模拟这种情况，假设不是给定六个点，而是只给出了这六个点中的两个。这将如何改变拟合这些点的直线的性质？这取决于你恰好得到哪两个点。要了解这会产生多大影响，从图\
  \ 1.1 中任选两个点，并想象一条穿过它们的直线。图 1.2 展示了从图 1.1 中成对点可能穿过的几条直线。请注意，根据点的选择不同，这些直线的变化有多大。\n\
  \n![Figure 1.2: Fitting lines with only two points](img/c01f002.png)\n\n**图 1.2**：仅用两个点拟合直线\n\
  \n### 自由度与数据量的关系\n\n用两个点拟合一条直线的问题在于，数据量不足以支撑该模型的自由度。一条直线有两个自由度。拥有两个自由度意味着有两个独立参数唯一确定一条直线。你可以想象抓住平面上的一条直线，在平面上上下滑动它，或扭转它以改变其斜率。因此，垂直位置和斜率是相互独立的。它们可以单独改变，而它们共同完全指定了一条直线。直线的自由度可以用几种等价的方式表示（例如它在\
  \ y 轴上的截距及其斜率、直线上的两个点等）。所有这些直线的表示都需要两个参数来指定。\n\n当自由度的数量等于点的数量时，预测效果不佳。这些直线会穿过用于绘制它们的点，但用不同点对绘制的直线之间存在很大差异。你不能对自由度数量与数据集中点数量相等的预测抱有太大信心。图\
  \ 1.1 中的图表有六个点，并拟合了一条直线（两个自由度）穿过它们。即六个点对应两个自由度。确定导致遗传性状况的基因这一思维实验说明了：可供选择的基因越多，就需要更多的数据，才能从\
  \ 20,000 个左右可能的人类基因中分离出病因。这 20,000 个不同的基因代表了 20,000 个自由度。即使来自 20,000 个不同人的数据也不足以得到可靠的答案，在许多情况下，合理研究范围内所能负担的只是来自\
  \ 500 人左右的样本。这就是惩罚线性回归可能成为最佳算法选择的地方。\n\n惩罚线性回归提供了一种系统的方法，将自由度减少至与可用数据量和底层现象的复杂性相匹配。这些方法已成为自由度极高问题的热门选择。它们是遗传学问题的首选算法，因为那里的自由度（即基因数量）可能高达数万；也适用于文本分类等问题，那里的自由度可能超过一百万。第\
  \ 4 章“惩罚线性回归”将详细介绍这些方法的工作原理、演示算法机制的示例代码，以及使用可用 Python 包实现机器学习系统的流程示例。\n\n### 什么是集成方法？\n\
  \n本书涵盖的另一类算法是集成方法。集成方法的基本思想是构建一大群不同的预测模型，然后组合它们的输出——通过对输出求平均或采用多数表决（投票）。单个模型称为*基学习器*。计算学习理论的一些结果表明，如果基学习器仅比随机猜测略好，只要有足够数量的独立模型，集成的性能就可以非常好。\n\
  \n推动集成方法发展的问题之一是观察到某些特定的机器学习算法表现出不稳定性。例如，向数据集添加新数据可能导致生成的模型或其性能发生剧烈变化。二叉决策树和传统神经网络就表现出这种不稳定性。这种不稳定性导致模型性能的高方差，而对许多模型进行平均可以被视为降低方差的一种方法。关键在于如何生成大量独立模型，特别是当它们都使用相同的基学习器时。第\
  \ 6 章“集成方法”将详细介绍如何做到这一点。这些技术非常巧妙，且其基本操作原理相对容易理解。以下是即将介绍内容的预览。\n\n应用最广泛的集成方法采用二叉决策树作为其基学习器。二叉决策树通常如图\
  \ 1.3 所示。\n\n![Figure 1.3: Binary decision tree example](img/c01f003.png)\n\n**图\
  \ 1.3**：二叉决策树示例\n\n图 1.3 中的树在顶部接收一个称为 `x` 的实数作为输入，然后使用一系列二元（双值）决策来决定针对 `x` 应输出什么值。第一个决策是\
  \ `x` 是否小于 5。如果答案是“否”，二叉决策树将输出上部决策框“否”分支下方圆圈中指示的值 4。`x` 的每一个可能值都会导致树输出某个值 `y`。图\
  \ 1.4 绘制了输出（`y`）作为树输入（`x`）的函数图。\n\n![Figure 1.4: Input-output graph for the binary\
  \ decision tree example](img/c01f004.png)\n\n**图 1.4**：二叉决策树示例的输入-输出图\n\n这一描述引出了一个问题：比较值（例如\
  \ `x < 5`？）和输出值（树底部圆圈中的值）从何而来？这些值来自于在输入数据上训练二叉树。该训练算法不难理解，将在第 6 章中介绍。此时需要注意的重要一点是，给定数据后，训练好的二叉决策树中的值是固定的。生成树的过程是确定性的。获得不同模型的一种方法是对训练数据进行随机抽样，并在这些随机子集上进行训练。该技术称为*装袋法*（*Bagging*，*bootstrap\
  \ aggregating* 的简称）。它提供了一种生成大量略有不同的二叉决策树的方法。然后对这些树求平均（或针对分类器进行投票）以得出最终结果。第 6 章将更详细地描述这一技术和其他更强大的技术。\n\
  \n### 如何决定使用哪种算法\n\n\n\n\n\n### 表 1.4：惩罚线性回归与集成算法的高层权衡\n\n表 1.4 对这两类算法进行了简要对比。惩罚线性回归方法的优势在于训练速度极快。在大型数据集上，训练时间可能长达数小时、数天甚至数周。在得到可部署的解决方案之前，通常需要进行多次训练。漫长的训练时间会阻碍大型问题的开发与部署。惩罚线性方法的快速训练特性使其显而易见地更有用——因为更快意味着更好。视具体问题而定，这些方法相较于集成方法可能存在一定的性能劣势。第\
  \ 3 章 将深入探讨惩罚回归更适用的问题类型，以及集成方法更适用的问题类型。即使在惩罚线性方法性能不如集成方法的情况下，它们有时也可以作为开发过程中的有用第一步。\n\
  \n**表 1.4** [#c01.xhtml#R_c01-tbl-0004]：惩罚线性回归与集成算法的高层权衡\n\n| | 训练速度 | 预测速度 | 问题复杂度\
  \ | 处理宽属性 |\n| --- | --- | --- | --- | --- |\n| **惩罚线性回归** | + | + | – | + |\n|\
  \ **集成方法** | – | – | + | – |\n\n在开发早期，为了特征选择、特征工程以及巩固数学问题陈述，需要进行多次训练迭代。决定将什么作为预测模型的输入可能需要一些时间和思考。有时这显而易见，但通常需要一些迭代。把能找到的所有东西都扔进去通常不是一个好方案。\n\
  \n通常需要通过试错来确定模型的最佳输入。例如，如果你试图预测网站访问者是否会点击广告链接，你可能会尝试使用访问者的人口统计数据。也许这无法给你所需的准确率，于是你尝试结合访问者在网站上的过往行为数据——访问者过去点击过什么广告，或者购买过什么产品。也许增加访问者来你网站前所在网站的数据会有帮助。这些问题会引出一系列实验，你在其中加入新数据，观察其是有害还是有益。这种迭代无论是在数据处理还是模型训练方面，通常都很耗时。惩罚线性回归通常比集成方法快，时间差异可能成为开发过程中的关键因素。\n\
  \n例如，如果训练集量级为千兆字节，惩罚线性回归的训练时间可能在 30 分钟量级，而集成方法可能需要 5 或 6 小时。如果特征工程过程需要 10 次迭代来选择最佳特征集，仅计算时间就相差一天与一周。因此，一个有用的流程是在开发早期、特征工程等阶段训练惩罚线性模型。这能让数据科学家对哪些变量有用、重要有直观感受，并为后续开发中与其他算法的对比提供基准性能。\n\
  \n除了训练时间优势，惩罚线性方法生成预测的速度也比集成方法快得多。生成预测涉及使用训练好的模型。惩罚线性回归的训练模型只是一个实数列表——每个用于预测的特征对应一个。涉及的浮点运算次数等于用于预测的变量数量。对于高频交易或互联网广告插入等高度时间敏感的预测场景，计算时间决定了盈亏。\n\
  \n对于某些问题，线性方法可能给出与集成方法相当甚至更好的性能。有些问题不需要复杂的模型。第 3 章 详细阐述了问题复杂度的本质，以及数据科学家如何平衡问题复杂度、预测模型复杂度和数据集规模以获得最佳可部署模型。基本思路是：在不复杂的问题上，以及可用数据不足的问题上，线性方法可能比更复杂的集成方法取得更好的整体性能。基因数据很好地说明了这类问题。\n\
  \n普遍认为基因数据量巨大。按字节计算，基因数据集确实很大；但就生成准确预测而言，它们并不大。为理解这一区别，考虑以下思想实验。假设有两个人，一个患有遗传性疾病，另一个没有。如果你有他们的基因序列，能确定是哪个基因导致了该疾病吗？显然不可能，因为两人之间会有许多基因差异。那么需要多少人？至少需要与基因数量相当的人的基因序列，考虑到测量噪声，甚至需要更多。人类大约有\
  \ 20,000 个基因（视计数方式而定），每个数据点成本约 1,000 美元。因此，仅拥有在完美测量下足以解析疾病的数据就需要 2,000 万美元。\n\n\
  这种情况与本章前面讨论的“用两个点拟合一条线”非常相似。模型的自由度需要少于数据点数量。数据集规模通常需要是模型自由度的倍数。因为数据集规模固定，所以模型的自由度需要可调。涉及惩罚线性回归的章节将展示这种可调性是如何内置于惩罚线性回归中的，以及如何利用它实现最优性能。\n\
  \n第 3 章 将更详细地探讨为何某种算法比另一种更适合特定问题。这与问题的复杂度及算法固有的自由度有关。线性模型训练迅速，且通常能达到与非线性集成方法相当的性能，尤其是在可用数据受限时。鉴于其训练极快，在早期特征选择和对特定问题可达性能的粗略估计时，训练线性模型往往很方便。本书涉及的线性模型能提供变量重要性信息，辅助特征选择过程。集成方法在数据充足时通常性能更好，也能给出某种间接的相对变量重要性度量。\n\
  \n### 构建预测模型的流程步骤\n\n使用机器学习需要多种不同技能。一是编程技能，本书不涉及。其他技能关乎如何训练并部署合适的模型，这些正是本书关注的内容。这些其他技能包括哪些？\n\
  \n\n\n\n最初，问题通常以某种模糊的基于语言的术语陈述，例如“向网站访问者展示他们可能点击的链接”。要将其转化为一个可工作的系统，需要用具体的数学术语重述问题，寻找用于预测的数据，然后训练一个预测模型，该模型将预测网站访问者点击可用于展示的链接的可能性。用数学术语陈述问题，意味着对将从可用数据源中提取哪些特征以及如何构建这些特征做出假设。\n\
  \n如何着手解决一个新问题？首先，你需要浏览可用数据，以确定哪些数据可能对预测有用。“浏览数据”意味着对数据运行各种统计检验，以了解数据揭示了什么以及它们与你试图预测的目标有何关联。直觉可以在一定程度上指导你。你还可以量化结果，并测试潜在预测特征与这些结果的相关程度。第\
  \ 2 章“通过理解数据来理解问题”将针对本书其余部分中用于表征和比较算法的数据集，详细讲解这一过程。\n\n通过某种方式，你开发出一组特征，并开始训练你所选择的机器学习算法。这将产生一个训练好的模型并评估其性能。接下来，你需要考虑对特征集进行更改，包括添加新特征或移除一些被证明无用的特征，或者可能更换不同类型的训练目标（也称为\
  \ `target`），以查看是否能提高性能。你将对各种设计决策进行迭代，以确定是否有提升性能的可能。你可以挑选出表现最差的示例，然后尝试确定这些示例是否有某种共同点。这可能会引出另一个要添加到预测过程中的特征，或者可能导致你将数据分叉，并在不同人群上训练不同的模型。\n\
  \n本书的目标是让你熟悉这些过程，以便你能自信地完成这些开发步骤。这要求你在构建问题并开始提取用于训练和测试算法的数据时，熟悉不同算法所需的输入数据结构。该过程通常包括以下几个步骤：\n\
  \n1.  提取并组装用于预测的特征。\n2.  开发用于训练的目标。\n3.  训练模型。\n4.  在测试数据上评估性能。\n\n机器学习不仅仅需要熟悉几个包。它需要理解并实践开发可部署模型所涉及的过程。本书旨在赋予你这种理解。它假设读者具备基本的大学数学知识以及一些概率和统计的基本概念，但不预设读者有机器学习背景。同时，它旨在为读者提供针对广泛问题类别的最佳算法，而不一定是调查所有机器学习算法或方法。有些算法虽然有趣，但由于各种原因不常被使用。例如，可能它们扩展性不好，也许它们无法提供关于内部运作机制的洞察，也许它们难以使用，等等。例如，众所周知，梯度提升（本书涵盖的算法之一）在在线机器学习竞赛中以巨大优势领先获胜。一些算法之所以更常被从业者使用，是有充分理由的，如果你读完本书后能理解这些理由，本书就算成功。\n\
  \n### 界定机器学习问题\n\n开始机器学习竞赛的工作，模拟了真实的机器学习问题。竞赛会提供简短的描述（例如，宣布一家保险公司希望更好地预测其汽车保单的赔付率）。作为参赛者，你的第一步是打开数据集，查看可用数据，并确定预测需要采取何种形式才有用。对数据的检查将直观地让你了解数据代表什么以及它们与手头的预测任务有何关联。数据可以提供关于方法选择的洞察。图\
  \ 1.5 描绘了从目标的通用语言陈述出发，逐步转变为可作为机器学习算法输入的数据排列的过程。\n\n![Figure 1.5: Framing a machine\
  \ learning problem](img/c01f005.png)\n\n**图 1.5**：界定机器学习问题\n\n“让我们获得更好结果”这种笼统的陈述，首先必须转化为可衡量和可优化的具体目标。对于网站所有者，具体性能指标可能是提高点击率或增加销售额（或更高的贡献毛益）。下一步是组装数据，使其能够预测给定客户点击各种链接或购买各种在线提供产品的可能性。图\
  \ 1.5 将这些数据描绘为一个属性矩阵。对于网站示例，它们可能包括访问者查看过的其他页面或访问者过去购买过的商品。除了用于预测的属性外，此类问题的机器学习算法还需要正确答案来进行训练。这些在图\
  \ 1.5 中标记为 `targets`。本书涵盖的算法通过检测过去行为中的模式来学习，但重要的是它们不能仅仅记住过去的行为；毕竟，客户可能不会重复购买昨天买过的东西。第\
  \ 3 章将详细讨论这种不记忆化训练的过程。\n\n通常，问题表述的几个方面可以有多种处理方式。这导致在界定问题、选择和训练模型以及生成性能估计之间进行一些迭代。图\
  \ 1.6 描绘了这一过程。\n\n![Figure 1.6: Iteration from formulation to performance](img/c01f006.png)\n\
  \n**图 1.6**：从表述到性能的迭代\n\n问题可能附带具体的定量训练目标，或者部分工作可能是提取这些数据（称为 `targets` 或 `labels`）。例如，考虑构建一个自动交易证券的系统。要进行自动交易，第一步可能是预测证券价格的变化。价格很容易获得，因此概念上很简单，即利用历史数据构建训练示例，其中未来的价格变化是已知的。但即使这样也涉及选择和实验。未来价格变化可以用几种不同的方式计算。变化可以是当前价格与\
  \ 10 分钟后价格的差值。也可以是当前价格与 10 天后价格的变化。也可以是当前价格与未来 10 分钟内最高/最低价格的差值。价格变化可以用一个双状态变量来表征，取值为“上涨”或“下跌”，具体取决于\
  \ 10 分钟后价格是高于还是低于当前价格。每一种选择都会导致一个预测模型，预测结果将用于决定是买入还是卖出证券。需要一些实验来确定最佳选择。\n\n### 特征提取与特征工程\n\
  \n\n\n\n### 决定用于预测的变量\n\n决定用于预测的变量也可能涉及实验。这个过程称为*特征提取*和*特征工程*。\n\n**特征提取**是从自由形式的排列（如文档或网页中的单词）中获取数据，并将它们排列成数字的行和列的过程。例如，垃圾邮件过滤问题始于电子邮件的文本，可能会提取诸如文档中大写字母的数量、全大写单词的数量、文档中“buy”一词出现的次数以及其他被选中以突出垃圾邮件和非垃圾邮件之间差异的数字特征等内容。\n\
  \n**特征工程**是操作和组合特征以得出更有信息量特征的过程。构建证券交易系统涉及特征提取和特征工程。特征提取将决定使用什么来预测价格。过去的价格、相关证券的价格、利率以及从新闻稿中提取的特征，都已被纳入各种公开讨论的交易系统中。此外，证券价格还有一些具有名称的工程特征，如随机指标、`MACD`（*移动平均收敛发散*）和\
  \ `RSI`（*相对强弱指数*），它们基本上是过去价格的函数，其发明者认为这些函数在证券交易中很有用。\n\n开发出一组合理的特征后，您可以训练一个像本书所述的预测模型，评估其性能，并决定是否部署该模型。通常，您会想要更改所用的特征，哪怕只是为了确认模型的性能是否达标。确定使用哪些特征的一种方法是尝试所有组合，但这可能非常耗时。不可避免地，您将面临提高性能但也要快速投入使用训练模型的相互竞争的压力。本书讨论的算法具有在生成预测时提供每个属性效用指标的有益特性。一次训练过程将生成特征排名，以指示其相对重要性。此信息有助于加快特征工程过程。\n\
  \n模型训练过程（每次尝试基线特征集时开始）也涉及一个过程。现代机器学习算法（如本书所述）训练类似 100 到 5,000 个不同的模型，这些模型必须筛选出单个模型用于部署。生成如此多模型的原因是提供各种复杂程度的模型。这使得可以选择最适合问题和数据集的模型。您不想要过于简单的模型，否则会牺牲性能；但也不想要过于复杂的模型，否则会过拟合问题。拥有各种复杂程度的模型，可以让您挑选一个恰到好处的模型。\n\
  \n### 确定训练模型的性能\n\n模型的拟合度由其在未用于训练模型的数据上的表现决定。这是一个重要的步骤，概念上很简单。只需留出一些数据。不要在训练中使用它们。训练完成后，使用留出的数据来确定算法的性能。本书讨论了几种系统性的留出数据的方法。不同方法有不同的优势，主要取决于训练数据的大小。尽管听起来很简单，但人们总能想出复杂的方法让测试数据“泄露”到训练过程中。该过程结束时，您将获得一个算法，它将筛选传入的数据并为您做出准确的预测。随着条件变化改变底层统计特性，它可能需要监控。\n\
  \n## 章节内容与依赖关系\n\n不同的读者可能希望根据他们的背景以及是否有时间理解基本原理，采取不同的路径阅读本书。图 1.7 展示了书中各章节之间的相互依赖关系。\n\
  \n![图 1.7：章节之间的相互依赖关系](img/c01f007.png)\n\n**图 1.7**：章节之间的相互依赖关系\n\n**第 2 章** 介绍了将用作问题示例的各种数据集，以说明算法的使用，并根据性能和其他特征比较算法。解决新机器学习问题的起点是深入研究数据集，以更好地理解它，并了解其问题和特性。**第\
  \ 2 章** 的部分目的是演示 Python 中可用于数据探索的一些工具。您可能想浏览 **第 2 章** 中的一些但并非所有示例，以熟悉该过程，然后在稍后深入研究解决方案示例时再回到\
  \ **第 2 章**。\n\n**第 3 章** 解释了机器学习问题中的基本权衡，并介绍了贯穿全书的几个关键概念。一个关键概念是预测问题的数学描述。展示了分类和回归问题之间的基本区别。**第\
  \ 3 章** 还介绍了使用样本外数据来确定预测模型性能的概念。样本外数据是指未包含在模型训练中的数据。良好的机器学习实践要求开发者对预测模型部署时的性能给出可靠的估计。这需要从训练集中排除一些数据，并用它们来模拟新数据。本书描述了这一要求的原因、实现方法以及不同方法之间的权衡。另一个关键概念是存在许多系统性能度量指标。**第\
  \ 3 章** 概述了这些方法并讨论了它们之间的权衡。已经熟悉机器学习的读者可以浏览本章并扫描代码示例，而不必仔细阅读并运行代码。\n\n**第 4 章** 展示了训练惩罚回归模型算法的核心思想。本章介绍了基本概念，并展示了算法是如何推导出来的。**第\
  \ 3 章** 中介绍的一些示例被用来激发惩罚线性回归方法及其求解算法的动机。本章运行了求解惩罚线性回归训练的核心算法代码。**第 4 章** 还解释了线性回归方法的几种扩展。其中一种扩展展示了如何将因子变量编码为实数，以便应用线性回归方法。线性回归只能用于预测变量为实数的问题；即用于预测的量必须是数值型的。许多实际且重要的问题都有像“单身、已婚或离婚”这样的变量，它们有助于进行预测。为了在线性回归模型中纳入此类变量（称为*分类变量*），已经设计出了将分类变量转换为实数变量的方法。**第\
  \ 4 章** 涵盖了这些方法。此外，**第 4 章** 还展示了（称为*基扩展*）从非线性回归中获得非线性函数的方法。有时基扩展可以用来从线性回归中榨取更多的性能。\n\
  \n\n\n\n\n### 第 5 章\n\n第 5 章 将 第 4 章 中开发的惩罚回归算法应用于 第 2 章 中概述的许多问题。本章概述了实现惩罚回归方法的\
  \ Python 包，并使用它们来解决问题。目标是涵盖足够广泛的问题，以便从业者能找到一个与他们面前要解决的问题相近的问题。除了量化和比较预测性能外，第 5 章\
  \ 还考察了训练算法的其他特性。变量选择和变量排序对于理解至关重要。这种理解将有助于加快新问题的开发速度。\n\n### 第 6 章\n\n第 6 章 介绍集成方法。由于集成方法最常基于二叉决策树，因此第一步是理解训练和使用二叉决策树的原理。集成方法的许多特性都是直接从二叉决策树继承而来的。建立这种理解后，本章将解释本书涵盖的三种主要集成方法。它们的通用名称分别是\
  \ Bagging（装袋法）、Boosting（提升法）和 Random Forest（随机森林）。对于每一种方法，都概述了其运行原理，并开发了核心算法的代码，以便您理解其运行原理。\n\
  \n### 第 7 章\n\n第 7 章 使用集成方法解决 第 2 章 中的问题，然后比较已开发的各种算法。比较涉及多个要素。预测性能是比较的一个要素。训练所需时间和性能是另一个要素。所有涵盖的算法都给出变量重要性排序，并且跨几种不同算法在给定问题上比较了这些信息。\n\
  \n根据我的经验，在向程序员和计算机科学家教授机器学习时，我发现代码示例对某些人比数学更有效。这里采用的方法是提供一些数学、算法草图和代码示例来说明重点。讨论的几乎所有方法都可以在书中附带的代码和网站上找到。其意图是提供可修改的代码，帮助您尽快在自己的问题上上手运行。\n\
  \n## 总结\n\n本章给出了您将能够解决的问题类型的规范，以及构建预测模型的过程步骤描述。本书重点关注两个算法家族。限制所涵盖算法的数量，可以更彻底地解释这些算法的背景及其使用机制。本章展示了一些比较性能结果，以说明选择这两个特定家族的理由。本章讨论了这两个家族不同的优势和特点，并描述了倾向于选择其中一个家族的问题类型。\n\
  \n本章还列出了开发预测模型的过程步骤，并详细阐述了每一步的权衡和结果。建议使用未包含在模型训练中的数据来生成预测模型的性能估计。\n\n本书的目标是让几乎没有机器学习经验的程序员达到这样一个程度：他们感觉有能力且自如地将机器学习融入项目中。本书并不广泛调查大量算法。相反，它涵盖了几个最佳算法，它们能为您提供性能、灵活性和清晰度。一旦您了解这些算法的工作原理并积累了一些使用经验，就会发现它们易用且快捷。它们将使您能够解决各种各样的问题，而无需费心调试即可训练好模型，并能让您洞察其性能来源。\n\
  \n## 参考文献\n\n1. Caruana, Rich, and Alexandru Niculescu-Mizil. \"An Empirical Comparison\
  \ of Supervised Learning Algorithms.\" *Proceedings of the 23rd International Conference\
  \ on Machine Learning*. ACM, 2006.\n\n2. Caruana, Rich, Nikos Karampatziakis, and\
  \ Ainur Yessenalina. \"An Empirical Evaluation of Supervised Learning in High Dimensions.\"\
  \ *Proceedings of the 25th International Conference on Machine Learning*. ACM, 2008.\n\
  \n# 第 2 章：通过理解数据来理解问题\n\n一个新的数据集（问题）就像一个包裹着的礼物。它充满了希望和期待，期待您解决它后能创造奇迹。但在您打开它之前，它仍然是个谜。本章旨在打开您的新数据集，以便您看清里面的内容，了解能用这些数据做什么，并开始思考如何利用它构建模型。\n\
  \n本章有两个目的。一是让您熟悉稍后将作为示例的数据集，这些示例展示了不同类型的问题，您将使用在 第 4 章 “惩罚线性回归” 和 第 6 章 “集成方法” 中学到的算法来解决它们。另一个目的是演示\
  \ Python 中可用于数据探索的一些工具。\n\n本章使用一个简单示例来回顾机器学习数据集的一些基本问题结构、术语和特征。本节介绍的语言将在本书其余部分中使用。建立通用语言后，本章逐一介绍几种不同类型的函数逼近问题。这些问题说明了机器学习问题的常见变体，以便您在遇到时能识别出这些变体，知道如何处理它们（并拥有相应的代码示例）。\n\
  \n## 新问题的剖析\n\n本书涵盖的算法从一个充满数字的矩阵（或表格）开始，可能还包含一些字符变量。表 2.1 中的示例建立了一些术语，并用二维表格表示了一个小型机器学习数据集。该表格将为您提供数据集的心智图像，以便您对“对应属性的列”或“对应单个样本的行”等引用感到熟悉。在本例中，预测分析问题在于预测个人在未来一年在网上购书的花费。\n\
  \n**表 2.1**：机器学习问题的数据\n\n| USERID | 属性 1 | 属性 2 | 属性 3 | 标签 |\n| --- | --- | ---\
  \ | --- | --- |\n| 001 | 6.5 | Male | 12 | $120 |\n| 004 | 4.2 | Female | 17 | $270\
  \ |\n| 007 | 5.7 | Male | 3 | $75 |\n| 008 | 5.8 | Female | 8 | $600 |\n\n数据按行和列排列。每一行代表一个单独的案例（也称为\
  \ `instance`、`example` 或 `observation`）。表 2.1 中的列被赋予了指定，指示它们将在机器学习问题中扮演的角色。指定为属性的列将用于预测购书花费。在指定为标签的列中，您将看到每位顾客去年在购书上的花费。\n\
  \n\n\n\n在表 2.1 中，一行代表一个单独的客户，该行中的数据都与该个体相关。第一列称为`UserID`，包含每行（案例）唯一的标识符。唯一标识符可能存在于你的问题中，也可能不存在。例如，网站通常用用户\
  \ ID 标记站点访问者，该 ID 在其访问期间与其关联。如果用户未在网站注册，则同一用户每次访问都会获得不同的 ID。该 ID 通常分配给每个观察值，这将是你要构建的预测主体。第\
  \ 2、3、4 列称为`Attributes`，而不是给出更具体的名称，如`Height`或`Gender`。关键在于突出它们在预测过程中的作用。`Attributes`是关于案例的可用数据，将用于进行预测。\n\
  \n`Labels`是你想要预测的事物。在本例中，`UserID`是一个简单的数字，`Attribute 1`是身高，`Attribute 2`是性别，`Attribute\
  \ 3`是该人去年阅读的书籍数量。`Labels`列下包含该个体去年在网上购书花费的金额。这些不同类别的数据将扮演什么角色？机器学习算法如何利用用户 ID、属性和标签？简短的回答是：你忽略用户\
  \ ID。你使用属性来预测标签。\n\n唯一 ID 用于记账目的，允许你回溯到特定案例可用的其他数据。通常，唯一 ID 不会直接用于机器学习算法。`Attributes`是你选择用于进行预测的事物。`Labels`是机器学习算法将用来构建预测模型的观察结果。\n\
  \n`User ID`通常不用于进行预测，因为它太具体了。它仅与单个示例相关。机器学习的诀窍在于构建一个能泛化到新案例的模型（而不仅仅是记忆过去的案例）。为了实现这一点，算法的推导必须强制其关注不止一行数据。排除用户\
  \ ID 的一个可能例外是：当用户 ID 为数字且按用户注册顺序分配时。基本上，在这种情况下它指示注册日期，可能很有用，因为 ID 相近的用户在相似时间注册，可以以此为依据视为一组。\n\
  \n构建预测模型的过程称为*训练*。该过程的进行方式取决于算法，后续章节将介绍细节，但通常是迭代的。算法假设属性和标签之间存在预测关系，观察其犯下的错误，进行一些修正，然后对该过程进行迭代，直到获得一个可靠的模型。许多技术细节将在后面解决，但这就是基本思想。\n\
  \n## 不同类型的属性和标签驱动建模选择\n\n表 2.1 中显示的属性有两种不同类型：数值变量和分类（或因子）变量。`Attribute 1`（身高）是数值变量，也是最常见的属性类型。`Attribute\
  \ 2`是性别，由`Male`或`Female`条目表示。这种类型的属性称为*分类*或*因子*变量。分类变量的特性是其各个值之间没有顺序关系。`Male < Female`没有意义（尽管争论了几个世纪）。分类变量可以是双值的，如`Male`、`Female`，也可以是多值的，如州（`AL`、`AK`、`AR`\
  \ … `WY`）。关于属性可以划分其他区别（例如整数与浮点数），但它们对机器学习算法的影响不一样。原因在于许多机器学习算法仅接受数值属性；它们无法处理分类或因子变量。惩罚回归算法仅处理数值属性。支持向量机、核方法和\
  \ k-近邻算法也是如此。第 4 章将介绍将分类变量转换为数值变量的方法。变量的性质将决定你的算法选择以及开发预测模型的方向，因此这是面对新问题时需要关注的事项之一。\n\
  \n标签也存在类似的二分法。表 2.1 中显示的标签是数值型的：个体去年在网上购书花费的金额。但在其他问题中，标签也可能是分类的。例如，如果表 2.1 的任务是预测哪些个体明年将花费超过\
  \ 200 美元，问题就会改变，解决问题的方法也会改变。预测哪些客户将花费超过 200 美元的新问题将有新的标签。新标签将取两个值之一。表 2.2 显示了表 2.1\
  \ 中给出的标签与基于逻辑命题`Spending > $200`的新标签之间的关系。表 2.2 中显示的新标签取两个值之一——`True`或`False`。\n\
  \n**表 2.2**（#c02.xhtml#R_c02-tbl-0002）：数值目标与分类目标\n\n| TABLE 1 LABELS | >$200? |\n\
  | --- | --- |\n| $120 | False |\n| $270 | True |\n| $75 | False |\n| $600 | True\
  \ |\n\n当标签为数值型时，该问题称为*回归问题*。当标签为分类型时，该问题称为*分类问题*。如果分类目标仅取两个值，该问题称为*二元分类问题*。如果取两个以上的值，则称为*多类分类问题*。\n\
  \n在许多情况下，问题类型的选择取决于设计者。你刚才看到，通过简单转换标签，本示例问题可以从回归问题转换为二元分类问题。这些是你在解决问题时可能做出的权衡。例如，分类目标可能更好地支持在两个行动方案之间做出决策。\n\
  \n分类问题也可能比回归问题更简单。考虑例如仅有一条等高线（如 100 英尺等高线）的地形图与每 10 英尺就有一条等高线的地形图之间的复杂性差异。单条等高线将地图分为高于\
  \ 100 英尺和低于 100 英尺的区域，包含的信息比更详细的等高线地图少得多。分类器试图计算单条分割等高线，而不考虑远离决策边界的行为，而回归则试图绘制整张地图。\n\
  \n## 关于新数据集需要注意的事项\n\n作为初步检查数据的一部分，你需要确定数据集的许多其他特征。以下是一个清单，以及一系列了解数据集的步骤，旨在让你熟悉数据并规划预测模型开发的步骤。这些都是简单的检查，但直接影响你的后续步骤。此外，该过程能让你开始探索数据并了解其属性。\n\
  \n**以下是需要检查的项目**\n\n*   行数和列数\n*   分类变量的数量及每个变量的唯一值数量\n*   缺失值\n*   属性和标签的汇总统计量\n\
  \n\n\n\n首先要检查的事情之一是数据的大小和形状。将数据读入列表的列表中；然后外层列表的维度是行数，内层列表之一的维度是列数。下一节将展示这一方法在某个数据集上的具体应用，该数据集稍后将用于说明将要开发的算法的特性。\n\
  \n流程中的下一步是确定每行中有多少缺失值。按行逐行进行的原因是，处理缺失值最简单的方法是丢弃不完整的实例（至少有一个缺失值的样本）。在许多情况下，这会使结果产生偏差，但仅有少数不完整的样本不会造成实质性差异。通过统计含有缺失数据的行数（除了缺失条目总数之外），你就能知道如果使用这种简单方法，必须丢弃数据集的多大比例。\n\
  \n如果你有大量行（收集网络数据时可能会这样），与你拥有的可用数据行数相比，你损失的行数可能很少。如果你在处理生物学问题，数据获取昂贵且属性很多，你可能无法承担丢弃数据的代价。在这种情况下，你必须想办法填补缺失值，或者使用能够处理缺失值的算法。填补缺失值称为\
  \ `imputation`（插补）。插补缺失数据最简单的方法是使用每行条目的平均值来填充缺失条目。一种更复杂的方法是使用 第 4 章 和 第 6 章 中介绍的预测方法之一。要使用预测方法，你需要将含有缺失值的属性列视为标签。在进行此过程之前，请务必移除原始问题的标签。\n\
  \n接下来的几节将演示此处概述的流程，并介绍一些表征数据集的方法，以帮助你决定如何着手建模过程。\n\n## 分类问题：利用声纳探测未爆水雷\n\n本节将逐步介绍在开始深入研究分类问题时可能进行的几项检查。它从简单的大小和形状测量、数据类型报告、缺失值计数等开始。然后转向数据的统计特性，以及属性之间、属性与标签之间的相互关系。该数据集来自\
  \ UC Irvine 数据存储库 [参考文献 1988]。这些数据源自一些实验，旨在确定声纳是否可用于探测军事行动后遗留在港口中的未爆水雷。声纳信号是所谓的\
  \ `chirped signal`（调频信号/啁啾信号）。这意味着信号频率在声脉冲持续时间内上升（或下降）。数据集中的测量值代表声纳接收机在返回信号的不同点收集到的功率测量值。大约一半样本中声纳照射的是岩石，另一半照射的是形状类似水雷的金属圆柱体。该数据集名为“Rocks\
  \ versus Mines”（岩石与水雷）。\n\n### “岩石与水雷”数据集的物理特征\n\n处理新数据集的第一件事是确定其大小和形状。清单 2-1 展示了用于确定\
  \ UC Irvine 数据存储库中“Rocks versus Mines”数据集（即岩石与水雷数据）大小和形状的代码。本章稍后你将了解更多关于该数据集的信息，并且全书将在介绍算法时使用它作为示例。在这种情况下，确定行数和列数的过程非常简单。该文件以逗号分隔，一个实验的数据占据一行文本。这使得读取一行、按逗号分隔符拆分、并将生成的列表堆叠成一个包含整个数据集的外层列表变得非常容易。\n\
  \n#### 清单 2-1：评估新数据集规模 — rockVmineSummaries.py\n\n```\n__author__ = 'mike_bowles'\n\
  \n#read data from uci data repository\nxList = list_read_rvm()\n  \nprint('Number\
  \ of Rows of Data = ' + str(len(xList)))\nprint('Number of Columns of Data = ' +\
  \ str(len(xList[1])))\n\nPrinted Output:\nNumber of Rows of Data = 208\nNumber of\
  \ Columns of Data = 61 \n```\n\n正如示例输出所示，该数据集有 208 行（行数）和 61 列（每行字段数）。这有什么区别？行数和列数对后续步骤有多方面影响。首先，整体规模能让你大致了解训练时间会有多长。对于像岩石与水雷数据这样小的数据集，训练时间将少于一分钟，这将便于你迭代训练和调整的过程。如果数据集增长到\
  \ 1,000 x 1,000，惩罚线性回归的训练时间将增长到几分之一分钟，而集成方法则需要几分钟。当数据集达到数万行和列时，惩罚线性回归的训练时间将扩展到 3\
  \ 或 4 小时，集成方法则为 12 到 24 小时。较大的训练时间会影响你的开发时间，因为你需要迭代多次。\n\n关于行数和列数的第二个重要观察是，如果数据集的列数远多于行数，你可能更有可能通过惩罚线性回归获得最佳预测，反之亦然。第\
  \ 3 章 “预测模型构建：平衡性能、复杂性与大数据” 以及稍后你将运行的示例将让你更好地理解为什么会这样。\n\n检查清单的下一步是确定有多少列数据是数值型与分类型。清单\
  \ 2-2 展示了针对岩石与水雷数据集实现此目的的代码。该代码遍历每一列，统计数值型条目（`int` 或 `float`）、非空字符串条目以及空条目的数量。结果显示前\
  \ 60 列全为数值，最后一列全为字符串。这些字符串值即为标签。通常，分类变量以字符串形式呈现，如此例所示。在某些情况下，二值分类变量会呈现为 0、1 数值变量。\n\
  \n#### 清单 2-2：确定属性性质 — rockVmineContents.py\n\n\n\n\n\n### 岩石与地雷数据集的统计摘要\n\n在确定哪些属性是分类属性、哪些是数值属性之后，你需要获取数值变量的描述性统计信息，以及每个分类属性中唯一类别的计数。清单\
  \ 2-3 给出了这两个过程的一些示例。\n\n#### 清单 2-3：数值与分类属性的汇总统计 — rVMSummaryStats.py\n\n```\n__author__\
  \ = 'mike_bowles'\nimport numpy as np\n\n#read data from uci data repository\nxList\
  \ = list_read_rvm()\n \nnrow = len(xList)\nncol = len(xList[1])\n\ntype = [0]*3\n\
  colCounts = []\n\n#generate summary statistics for column 3 (e.g.)\ncol = 3\ncolData\
  \ = []\nfor row in xList:\n    colData.append(float(row[col]))\n\ncolArray = np.array(colData)\n\
  colMean = np.mean(colArray)\ncolsd = np.std(colArray)\nprint(\"Mean = \" + '\\t'\
  \ + str(colMean) + '\\t\\t' +\n            \"Standard Deviation = \" + '\\t ' +\
  \ str(colsd))\n\n\n#calculate quantile boundaries\nntiles = 4\n\npercentBdry = []\n\
  \nfor i in range(ntiles+1):\n    percentBdry.append(np.percentile(colArray, i*(100)/ntiles))\n\
  \nprint(\"\\nBoundaries for 4 Equal Percentiles\")\nprint(percentBdry)\nprint(\"\
  \ \\n\")\n```\n\n**打印输出：**\n\n```\nMean =      0.053892307692307684            \
  \ \nStandard Deviation =       0.04641598322260027 \n\nBoundaries for 4 Equal Percentiles\n\
  [0.0058, 0.024375, 0.04405, 0.0645, 0.4264]\n \n \nBoundaries for 10 Equal Percentiles\
  \ \n\n[0.0058, 0.0141, 0.022740000000000003, 0.027869999999999995, 0.03622, \n0.04405,\
  \ 0.050719999999999, 0.0599599999999999, 0.07794000000000001, \n0.10836, 0.4264]\n\
  \ \n \nUnique Label Values\n{'M', 'R'}\n\nCounts for Each Value of Categorical Label\n\
  ['M', 'R']\n[111, 97] \n```\n\n代码的第一部分选取一列数值数据，然后为其生成一些统计信息。第一步是计算所选属性的**均值**和**标准差**。了解这些将为你在开发模型时建立直觉提供基础。\n\
  \n代码的下一部分用于寻找**离群值**。其工作原理如下。假设你试图判断以下数字列表中是否存在离群值：`[0.1, 0.15, 0.2, 0.25, 0.3,\
  \ 0.35, 0.4, 4]`。此示例特意构造了一个离群值。最后一个数字（`4`）与其他数字相比显然超出了量级。\n\n揭示此类不匹配的一种方法是将一组数字划分为百分位数。例如，第\
  \ 25 百分位包含最小的 25% 的数据。第 50 百分位包含最小的 50% 的数据。可视化这些分组形成过程的最简单方法是想象数据已按数值顺序排序。前面列表中的数字已按数值顺序排列。这使得很容易看出百分位边界的位置。一些常用的百分位数有特殊的名称。将集合划分为相等的四分之一、五分之一和十分之一所定义的百分位数分别称为`四分位数`、`五分位数`和`十分位数`。\n\
  \n对于前面的列表，因为列表已排序且包含八个元素，所以很容易定义四分位数。第一四分位数包含 `0.1` 和 `0.15`，以此类推。请注意这些四分位数的宽度。第一四分位数的范围是\
  \ `0.5`（`0.15–0.1`）。第二四分位数大致相同。然而，最后一个四分位数的范围是 `4.6`，这是其他四分位数范围的 100 倍。\n\n你可以在清单\
  \ 2-3 中计算出的四分位边界中看到类似的行为。首先程序计算四分位数。这显示出上四分位数比其他四分位数宽得多。为了更确定，还计算了十分位边界，同样表明上十分位异常宽。由于分布在尾部通常会变稀疏，因此一定程度的变宽是正常的。\n\
  \n#### 使用分位数-分位数图可视化离群值\n\n更详细地研究离群值的一种方法是，将相关数据的分布与某些合理的分布进行绘图对比，以查看相对数值是否匹配。清单\
  \ 2-4 展示了如何使用 Python 函数 `probplot` 来帮助确定数据集是否存在离群值。生成的图表显示了数据中经验百分位数相关的边界与高斯分布相同百分位数的边界之间的比较。如果被分析的数据来自高斯分布，绘制的点将落在一条直线上。图\
  \ 2.1 显示，岩石与地雷数据第 4 列的几个点距离该直线非常远。这意味着岩石与地雷数据的尾部包含的样本比高斯密度的尾部更多。\n\n#### 清单 2-4：岩石与地雷数据第\
  \ 4 个属性的分位数-分位数图 — qqplotAttribute.py\n\n\n\n\n\n```python\n__author__ = 'mike_bowles'\n\
  import numpy as np\n\nimport scipy.stats as stats\n\n#read rocks v mines data\n\
  xList = list_read_rvm()\nnrow = len(xList)\nncol = len(xList[1])\n\ntype = [0]*3\n\
  colCounts = []\n\n#generate summary statistics for column 3 (e.g.)\ncol = 3\ncolData\
  \ = []\nfor row in xList:\n    colData.append(float(row[col]))\n\n\nstats.probplot(colData,\
  \ dist=\"norm\", plot=plt)\nplt.show() \n```\n\n![Figure 2.1: Quantile-quantile\
  \ plot of attribute 4 from rocks versus mines data](img/c02f001.png)\n\n**Figure\
  \ 2.1**：岩石与矿山数据中属性 4 的分位数-分位数图\n\n如何利用这些信息？异常值可能会给模型构建或预测带来麻烦。在该数据集上训练好模型后，你可以检查模型产生的误差，看这些误差是否与这些异常值相关。如果相关，则可以采取措施进行修正。例如，你可以复制表现不佳的样本，迫使它们得到更充分的代表。你可以将它们隔离出来，作为一个单独的类别进行训练。如果它们代表的是一种异常情况，且在模型部署后将要面对的数据中不会出现，你也可以将它们从数据中剔除。一个合理的流程可能是在探索阶段生成四分位数边界，并标记潜在的异常值，以了解问题可能有多严重（或者根本不严重）。然后在评估性能数据时，使用分位数-分位数（Q-Q）图来确定哪些点应被称为异常值，以便用于误差分析。\n\
  \n### 分类属性的统计特征描述\n\n上述过程适用于数值属性。但分类属性怎么办？你需要检查它们有多少个类别，以及每个类别有多少个样本。了解这些有几个原因。性别属性只有两个可能值（男性和女性），但如果该属性是美国的州，就会有\
  \ 50 个可能的类别。随着属性数量的增加，处理它们的复杂性也会增加。大多数二叉树算法（集成方法的基础）都限制了能处理的类别数量。由 Breiman 和 Cutler（该算法的发明者）编写的流行\
  \ Random Forests 包将类别数量限制在 32 个。如果某个属性有超过 32 个类别，你就需要对它们进行聚合。\n\n稍后你会看到，训练涉及随机抽取数据子集并在其上训练一系列模型。例如，假设类别是美国的州，而爱达荷州只有两个样本。随机抽取训练样本可能一个爱达荷州的样本也抽不到。你需要在问题发生前就发现这类问题，以便加以解决。对于爱达荷州的这两个样本，你可以将它们与蒙大拿州或怀俄明州合并，可以复制它们，或者可以管理随机抽取过程，以确保抽到爱达荷州的样本（这一过程称为*分层抽样*）。\n\
  \n### 如何使用 Python Pandas 对岩石与矿山数据集进行汇总\n\nPython 包 pandas 可以帮助自动化数据检查和处理过程。它在数据检查和预处理的早期阶段特别有用。pandas\
  \ 包使得将数据读入一种称为*数据框*的专用数据结构成为可能。数据框是仿照 CRAN-R 中同名数据结构建模的。\n\n你可以把数据框想象成 **Table 2.1**\
  \ 所示的表格或矩阵状结构。数据框的行代表单个案例（实验、样本、测量），列代表特定属性。该结构类似矩阵，但不是矩阵，因为不同列中的元素可能属于不同类型。从形式上讲，矩阵定义在一个域上（如实数、二进制数、复数），矩阵中的所有条目都是该域的元素。对于统计问题，矩阵过于局限，因为统计样本通常包含混合的不同类型。\n\
  \n**Table 2.1** 中的简单示例在 Attribute 1 列中有实数值，在 Attribute 2 列中有分类变量，在 Attribute 3 列中有整数变量。在同一列内，条目类型相同，但不同列之间类型不同。数据框结构支持通过索引访问单个元素，这大致类似于访问\
  \ Python `numpy` 数组或列表的列表中的条目。同样，索引切片可用于访问数组中的整行或整列。此外，pandas 数据框还支持通过名称访问行和列。这非常方便，特别是在列数较少到中等的情况下。（搜索“pandas\
  \ introduction”将提供许多链接，指导你了解 pandas 的基本用法。）\n\n**Listing 2-5** 展示了如何简单地从 UC Irvine\
  \ 数据存储库网站读取岩石与矿山 CSV 文件。清单中显示的输出是从实际输出中截取的。你可以通过自行运行代码获得完整版本。\n\n#### Listing 2-5:\
  \ 使用 Python pandas 读取和汇总数据 — pandasReadSummarize.py\n\n\n\n\n\n> ```\n> __author__\
  \ = 'mike_bowles'\n> \n> #read rocks versus mines data into pandas data frame\n\
  > rocksVMines = pd_read_rvm()\n> \n> #print head and tail of data frame\n> print(rocksVMines.head())\n\
  > print(rocksVMines.tail())\n> \n> #print summary of data frame\n> summary = rocksVMines.describe()\n\
  > print(summary)\n> ```\n\n读取文件后，程序的第一部分会打印出数据集的前几行和后几行。请注意，所有前几行的示例都带有 R 标签，而后几行的示例带有\
  \ M 标签。在这个数据集中，所有的 R 都排在前面，所有的 M 都排在后面。在检查数据时要注意这类情况。你将在后续章节看到，确定模型质量需要对数据进行采样。数据存储方式中的结构可能需要纳入你后续采样方法的考量中。代码片段的最后一部分打印出了数据集中实值列的摘要统计。\n\
  \nPandas 使得自动计算均值、方差和分位数成为可能。请注意，`describe` 函数生成的摘要本身就是一个数据帧，因此你可以自动化筛选包含异常值属性的过程。为此，你可以比较不同分位数之间的差异，如果某属性的任意差异与该属性的其他差异相比超出了比例尺度，则标记该属性。输出中显示的属性表明，其中几个存在异常值。值得进一步查看涉及异常值的行数。它们可能都来自少数几个示例。这可以指出需要更仔细检查的数据。\n\
  \n## 可视化岩石与地雷数据集的属性\n\n可视化有时能让你洞察到在数字表格中难以发现的数据规律。本节介绍几种你可能会觉得有用的可视化方法。其中一些可视化在分类问题和回归问题中略有不同。你将在介绍鲍鱼数据集和红酒质量数据集的章节中看到这些方法的回归变体。\n\
  \n### 使用平行坐标图进行可视化\n\n一种适用于属性数量超过几个的问题的可视化方法称为*平行坐标图*。图 2.2 展示了平行坐标图的构建过程。图右侧的数字向量代表机器学习数据集中一行属性数据。该数字向量的平行坐标图显示在图\
  \ 2.2 的折线图中。折线图绘制了每个属性的值与其索引的关系。整个数据集的平行坐标图为数据集中每一行属性绘制一条线。基于标签的颜色编码可以帮助你看清属性值与标签之间某些类型的系统性关系。将一行的实值属性绘制在其属性索引上。（搜索“parallel\
  \ coordinates”并查看维基百科页面以获取更多示例。）\n\n![Figure 2.2: Constructing a parallel coordinates\
  \ plot](img/c02f002.png)\n\n**图 2.2**：构建平行坐标图\n\n清单 2-6 展示了该过程在岩石与地雷数据集上的应用。图 2.3\
  \ 显示了生成的折线图。线条根据其标签进行颜色编码：R（岩石）为蓝色，M（地雷）为红色。有时这种类型的图会显示出类别之间清晰的分离区域。著名的“Iris 数据（鸢尾花数据）”显示出非常清晰的分离，机器学习算法将利用这一点进行分类。对于岩石与地雷数据集，折线图中没有明显的极度清晰的分离，但存在一些蓝色和红色分离的区域。在图表底部，蓝色略微突出，在属性索引\
  \ 30 到 40 的范围内，蓝色比红色稍高一些。这类洞察有助于解释和验证训练模型做出的预测。\n\n#### 清单 2-6：用于实值属性可视化的平行坐标图 —\
  \ linePlots.py\n\n> ```\n> __author__ = 'mike_bowles'\n> \n> #read rocks versus\
  \ mines data into pandas data frame\n> rocksVMines = pd_read_rvm()\n> \n> for i\
  \ in range(208):\n>     #assign color based on color based on \"M\" or \"R\" labels\n\
  >     if rocksVMines.iat[i,60] == \"M\":\n>         pcolor = \"red\"\n>     else:\n\
  >         pcolor = \"blue\"\n> \n>     #plot rows of data as if they were series\
  \ data\n>     dataRow = rocksVMines.iloc[i,0:60]\n>     dataRow.plot(color=pcolor,\
  \ alpha=0.5)\n>   \n> plt.xlabel(\"Attribute Index\")\n> plt.ylabel((\"Attribute\
  \ Values\"))\n> plt.show() \n> ```\n\n![Figure 2.3: Parallel coordinates graph of\
  \ rocks versus mines attributes](img/c02f003.png)\n\n**图 2.3**：岩石与地雷属性的平行坐标图\n\n\
  ### 可视化属性与标签之间的相互关系\n\n\n\n\n你可能想问数据的另一个问题是各个属性之间是如何相互关联的。快速了解成对关系的一种方法是将带标签的属性进行交叉绘图。清单\
  \ 2-7 展示了为几对代表性属性生成交叉图所需的内容。这些交叉图（也称为散点图）能让你看出成对变量之间的关联程度。\n\n#### 清单 2-7：属性成对交叉绘图\
  \ — corrPlot.py\n\n```\n__author__ = 'mike_bowles'\n\n#将岩石与地雷数据读入 pandas 数据框\nrocksVMines\
  \ = pd_read_rvm()\n\n#计算实值属性之间的相关性\ndataRow2 = rocksVMines.iloc[1,0:60]\ndataRow3\
  \ = rocksVMines.iloc[2,0:60]\n\nplt.scatter(dataRow2, dataRow3)\n\n\nplt.xlabel(\"\
  第 2 个属性\")\nplt.ylabel((\"第 3 个属性\"))\nplt.show()\n   \ndataRow21 = rocksVMines.iloc[20,0:60]\n\
  \nplt.scatter(dataRow2, dataRow21)\n\n\nplt.xlabel(\"第 2 个属性\")\nplt.ylabel((\"\
  第 21 个属性\"))\nplt.show() \n```\n\n图 2.4 和 2.5 展示了来自岩石与地雷数据集的两对属性的散点图。岩石与地雷的属性是声纳回波的样本。声纳信号被称为*调频*波形，因为它是一个从低频开始并在脉冲持续时间内频率升高的脉冲。岩石与地雷数据集中的属性是反射自岩石或地雷的声波的时间样本。这些返回的声学信号在时间和频率之间具有与发射信号相同的关系。岩石与地雷数据中的\
  \ 60 个属性是在 60 个不同时间（因此也是 60 个不同频率）下采集的回波样本。你会预期相邻属性比在时间上分离的属性更具相关性，因为相邻时间样本之间的频率差别不大。\n\
  \n![图 2.4：岩石与地雷属性 2 和 3 的交叉图](img/c02f004.png)\n\n**图 2.4**：岩石与地雷属性 2 和 3 的交叉图\n\
  \n这种直觉在图 2.4 和 2.5 中得到了验证。图 2.4 中散点图的点比图 2.5 中的点更紧密地聚集在一条直线周围。如果你想培养关于数值相关性与散点图形状之间关系的直觉，只需搜索“相关性”并查看出现的维基百科页面。那里展示了一些散点图及其关联的数值相关性。基本上，如果散点图中的点沿着一条细直线分布，则两个变量高度相关；如果它们形成一团点，则它们不相关。\n\
  \n![图 2.5：岩石与地雷属性 2 和 21 的交叉图](img/c02f005.png)\n\n**图 2.5**：岩石与地雷属性 2 和 21 的交叉图\n\
  \n你可以应用相同的原则来绘制每个属性与目标之间的相关性。对于目标是实数的问题（回归问题），这些图看起来与图 2.4 和 2.5 非常相似。岩石与地雷数据集是一个分类问题。目标只有两个值。你可以遵循相同的通用过程。\n\
  \n清单 2-8 展示了绘制目标与属性 35 之间散点图的代码。在图 2.3 的平行坐标图中，索引值 35 附近显示出岩石和地雷（红线和蓝线）有一定的分离，因此选用属性\
  \ 35 作为展示与目标相关性的示例。目标与该索引值附近的某个属性之间的相关性也应显示出一定的分离。图 2.6 和 2.7 绘制了结果。\n\n#### 清单\
  \ 2-8：分类目标与实值属性之间的相关性 — targetCorr.py\n\n```\n__author__ = 'mike_bowles'\nfrom random\
  \ import uniform\n\n#将岩石与地雷数据读入 pandas 数据框\nrocksVMines = pd_read_rvm() \n   \n\
  #将目标转换为数值\ntarget = []\nfor i in range(208):\n    #根据 \"M\" 或 \"R\" 标签分配 0 或 1 目标值\n\
  \    if rocksVMines.iat[i,60] == \"M\":\n        target.append(1.0)\n    else:\n\
  \        target.append(0.0)\n\n    #将数据行绘制为序列数据\ndataRow = rocksVMines.iloc[0:208,35]\n\
  plt.scatter(dataRow, target)\n\nplt.xlabel(\"属性值\")\nplt.ylabel(\"目标值\")\nplt.show()\n\
  \n#\n#为了改善可视化效果，此版本对点进行轻微抖动\n# 并使其具有一定透明度\ntarget = []\nfor i in range(208):\n \
  \   #根据 \"M\" 或 \"R\" 标签分配 0 或 1 目标值\n    # 并添加一些抖动\n    if rocksVMines.iat[i,60]\
  \ == \"M\":\n        target.append(1.0 + uniform(-0.1, 0.1))\n    else:\n      \
  \  target.append(0.0 + uniform(-0.1, 0.1))\n\n    #将数据行绘制为序列数据\ndataRow = rocksVMines.iloc[0:208,35]\n\
  plt.scatter(dataRow, target, alpha=0.5, s=120)\n\nplt.xlabel(\"属性值\")\nplt.ylabel(\"\
  目标值\")\nplt.show() \n```\n\n这些图展示了如果你创建一个与 R 或 M 目标列表对应的列表，但将 M 替换为 1，R 替换为 0，会发生什么。然后你可以绘制如图\
  \ 2.6 所示的散点图。图 2.6 凸显了交叉图的一个常见问题。当被绘制的变量之一只取少量离散值时，点会重叠在一起。如果数量很多，你只会得到一条粗粗的深色线，无法感知点沿线的分布情况。\n\
  \n![图 2.6：目标-属性交叉图](img/c02f006.png)\n\n**图 2.6**：目标-属性交叉图\n\n![图 2.7：带点抖动和部分不透明度的目标-属性交叉图](img/c02f007.png)\n\
  \n**图 2.7**：带点抖动和部分不透明度的目标-属性交叉图\n\n清单 2-8 中的代码通过两个小改动生成了第二个图，以克服这个问题。向每个点添加一个小随机数，这些点原本只取少量离散值（本例中为目标值）。目标值由构造决定只能是\
  \ 0 或 1。在代码中，你会看到添加的随机数在 -0.1 和 0.1 之间均匀分布。这将点分开，但不会分得太远以至于混淆两条线。其次，点以 `alpha=0.5`\
  \ 绘制，使其仅部分不透明。这样，任何重叠绘制都会在散点图中显示为加深的区域。你可能需要微调这些数字，以使图表展示你所需的信息。\n\n图 2.7 展示了这两项改动的效果。注意上带点的左端属性\
  \ 35 的浓度略高，而下带点从右到左分布更均匀。上带点对应地雷，下带点对应岩石。你可以通过测试属性 35 是大于还是小于 0.5 来为该问题构建一个分类器。如果大于\
  \ 0.5 则判为岩石，如果小于 0.5 则判为地雷。属性 35 小于 0.5 的示例包含更高浓度的地雷而非岩石，而属性 35 大于 0.5 的示例包含较低密度的地雷，因此你的表现会比随机猜测好得多。\n\
  \n\n\n\n### 两个属性（或一个属性与目标）之间的相关程度可以使用皮尔逊相关系数来量化\n\n皮尔逊相关系数针对两个等长向量 `u` 和 `v` 定义如下（参见公式\
  \ 2.1 和 2.2）。首先从 `u` 的所有元素中减去 `u` 的平均值（参见公式 2.3），对 `v` 执行相同操作。\n\n![公式 2.1:  向量\
  \ u 的元素](img/c02-disp-0001.png)\n\n**公式 2.1**:  向量 u 的元素\n\n![公式 2.2:  u 中各条目的平均值](img/c02-disp-0002.png)\n\
  \n**公式 2.2**:  u 中各条目的平均值\n\n![公式 2.3:  从 u 中的每个元素减去平均值](img/c02-disp-0003.png)\n\
  \n**公式 2.3**:  从 u 中的每个元素减去平均值\n\n对于第二个向量 `v`，以定义 `Δu` 对应向量 `u` 的相同方式定义向量 `Δv`。\n\
  \n然后 `u` 和 `v` 之间的皮尔逊相关性如公式 2.4 所示。\n\n![公式 2.4:  皮尔逊相关系数的定义](img/c02-disp-0004.png)\n\
  \n**公式 2.4**:  皮尔逊相关系数的定义\n\n清单 2-9 展示了该函数的 Python 实现，用于计算图 2.3 和 2.5 中绘制的属性对的相关性。相关性数值与绘制的数据一致。索引编号接近的属性具有比间隔较远的属性相对更高的相关性。\n\
  \n#### 清单 2-9: 属性 2 对 3 和属性 2 对 21 的皮尔逊相关性计算 — corrCalc.py\n\n```python\n__author__\
  \ = 'mike_bowles'\nfrom math import sqrt\nfrom Read_Fcns import pd_read_rvm\nfrom\
  \ scipy.stats.stats import pearsonr \n\nrocksVMines = pd_read_rvm()\n\n#calculate\
  \ correlations between real-valued attributes\ndataRow2 = np.array(rocksVMines.iloc[1,0:60])\n\
  dataRow3 = np.array(rocksVMines.iloc[2,0:60])\ndataRow21 = np.array(rocksVMines.iloc[20,0:60])\n\
  \nmean2 = 0.0; mean3 = 0.0; mean21 = 0.0\nnumElt = len(dataRow2)\nfor i in range(numElt):\n\
  \    mean2 += dataRow2[i]/numElt\n    mean3 += dataRow3[i]/numElt\n    mean21 +=\
  \ dataRow21[i]/numElt\n\nvar2 = 0.0; var3 = 0.0; var21 = 0.0\nfor i in range(numElt):\
  \ \n    var2 += (dataRow2[i] - mean2) * (dataRow2[i] - mean2)/numElt\n    var3 +=\
  \ (dataRow3[i] - mean3) * (dataRow3[i] - mean3)/numElt\n    var21 += (dataRow21[i]\
  \ - mean21) * (dataRow21[i] - mean21)/numElt\n\ncorr23 = 0.0; corr221 = 0.0\nfor\
  \ i in range(numElt):\n    corr23 += (dataRow2[i] - mean2) * \\\n              (dataRow3[i]\
  \ - mean3) / (sqrt(var2*var3) * numElt)\n    corr221 += (dataRow2[i] - mean2) *\
  \ \\\n               (dataRow21[i] - mean21) / (sqrt(var2*var21) * numElt)\n\nprint('Correlation\
  \ between attribute 2 and 3')\nprint(corr23, '\\n')\n\n\nprint('Correlation between\
  \ attribute 2 and 21')\nprint(corr221, '\\n')\n\nprint('Now that you see how the\
  \ calculation is done, using the python \\\npearsonr function will save you time')\n\
  print(pearsonr(dataRow2, dataRow3))\n\nPrinted Output:\nCorrelation between attribute\
  \ 2 and 3\n0.7709381211911223 \n\nCorrelation between attribute 2 and 21\n0.46654808078868865\
  \ \n\nNow that you see how the calculation is done, using the python pearsonr \n\
  function will save you time\n(0.7709381211911221, 5.79499196668097e-13) \n```\n\n\
  ### 使用热力图可视化属性与标签的相关性\n\n计算相关性并打印它们或绘制交叉图对于少量相关性效果很好，但很难从大量数字表格中掌握规律，如果问题有 100 个属性，也很难将所有交叉图挤在一页上。\n\
  \n检查大量属性相关性的一种方法是计算属性对的皮尔逊相关系数，将这些相关性排列成一个矩阵，其中第 `i`、`j` 个条目是第 `i` 个属性和第 `j` 个属性之间的相关性，然后在热力图中绘制它们。清单\
  \ 2-10 给出了制作此图的代码。图 2.8 显示了该图。对角线上的浅色区域确认了索引上彼此接近的属性具有相对较高的相关性。如前所述，这是由于数据生成方式造成的。相近的索引以短时间间隔相互采样，因此具有相似的频率。相似的频率以类似的方式从目标反射（以此类推）。\n\
  \n#### 清单 2-10: 直观呈现属性相关性 — sampleCorrHeatMap.py\n\n```python\n__author__ = 'mike_bowles'\n\
  \n#read rocks versus mines data into pandas data frame\nrocksVMines = pd_read_rvm()\n\
  \n#calculate correlations between real-valued attributes\n\ncorMat = DataFrame(rocksVMines.corr())\n\
  \n#visualize correlations using heatmap\nplt.pcolor(corMat)\nplt.show() \n```\n\n\
  ![图 2.8: 显示属性交叉相关性的热力图](img/c02f008.png)\n\n**图 2.8**: 显示属性交叉相关性的热力图\n\n属性之间的完全相关（相关性\
  \ = 1）意味着你可能犯了错误，两次包含了同一事物。一组属性之间的极高相关性（成对相关性 > 0.7）称为 `multicollinearity`（多重共线性），可能导致不稳定的估计。与目标的相关性则另当别论。拥有与目标相关的属性通常表明存在预测关系。\n\
  \n### 理解岩石与地雷数据集过程的总结\n\n在理解岩石与地雷数据集的过程中，本节介绍了许多工具供你用于获取对数据集的理解和直觉。本节详细阐述了它们的推导和使用，使其清晰明了。后续章节将使用这些相同的工具来检查本书将用于开发机器学习算法的其他数据集。既然你现在已经熟悉了数据检查的工具，后续章节将仅在因问题性质不同而需要修改工具的范围内对工具进行评论。\n\
  \n## 含因子变量的实值预测：你的鲍鱼多大了？\n\n你所见到的用于理解探测未爆地雷问题的大多数工具都可以应用于回归问题。给定物理测量值预测鲍鱼的年龄，提供了此类问题的一个示例。鲍鱼属性还包括一个因子变量属性，这将说明因子变量所涉及的差异。\n\
  \n鲍鱼数据集提出了通过进行若干测量来预测鲍鱼年龄的问题。通过切开贝壳并计数生长环，可以获得鲍鱼年龄的精确读数，这很像通过数年轮来判断树龄。对于研究鲍鱼种群的科学家来说，问题是切片贝壳并在显微镜下计数年轮既昂贵又耗时。如果能进行简单的物理测量，如长度、宽度、重量等，然后使用预测模型处理这些测量值并准确确定鲍鱼的年龄，那将更加方便且经济。预测分析有无数科学应用，学习机器学习的好处之一就是能够为一系列有趣的不同问题做出贡献。\n\
  \n\n\n\n\n数据可通过 UC Irvine 数据存储库获取。该数据集的 URL 为 `http://archive.ics.uci.edu/ml/machine-learning-databases/abalone/abalone.data`。数据集为不带列标题的逗号分隔文件，列名在单独文件中。Listing\
  \ 2-11 将鲍鱼数据集读入 pandas 数据框，并运行了与“分类问题：利用声呐探测未爆地雷”中相同的部分分析。对于岩石与地雷数据集，因数据性质列名较为通用；而鲍鱼数据集各列含义明确，对建立直观理解至关重要。因此代码中将列名直接复制粘贴并附加到数据集，帮助理解后续机器学习算法如何进行预测。可用于构建预测模型的列包括：Sex、Length、Diameter、Height、Whole\
  \ Weight、Shucked Weight、Viscera Weight、Shell Weight 和 Rings。最后一列 Rings 需通过锯开外壳并在显微镜下计数获得，这是监督学习问题的典型安排：拥有已知答案的特殊数据集，以构建在答案未知时能生成预测的模型。\n\
  \n除了展示生成摘要的代码，Listing 2-11 还显示了摘要的打印输出。第一部分打印数据集的头部和尾部，输出中仅显示头部以节省空间（运行代码时两者均可见）。数据框大部分为浮点数。第一列包含动物性别，取值为\
  \ M（雄性）、F（雌性）、I（不确定）。鲍鱼性别非出生时确定，而是成熟后才定，因此幼年鲍鱼性别不确定。性别为三值分类变量，需特殊处理。某些算法仅处理实值属性（如支持向量机、K\
  \ 近邻、惩罚线性回归，见第 4 章）。第 4 章 讨论了将分类变量转换为实值变量的技术以适用这些算法。Listing 2-11 还展示了实值属性的逐列统计摘要。\n\
  \n#### Listing 2-11：读取并汇总鲍鱼数据集 — abaloneSummary.py\n\n```\n__author__ = 'mike_bowles'\n\
