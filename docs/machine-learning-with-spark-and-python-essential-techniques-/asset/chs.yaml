  \n### 为 Python 随机森林回归输入对鲍鱼性别进行编码\n\n清单 7-4 展示了训练随机森林模型以根据鲍鱼的重量、贝壳大小等数据预测鲍鱼年龄的步骤。该问题的目标是根据各种物理测量值（鲍鱼各部分的重量、尺寸等）预测鲍鱼的年龄。这使得它成为一个回归问题，适用于前两节中用于构建预测葡萄酒口味评分模型的算法。\n\
  \n#### 清单 7-4: 训练随机森林模型预测鲍鱼年龄——abalone_rf.py\n\n\n\n> ```\n> __author__ = 'mike_bowles'\n\
