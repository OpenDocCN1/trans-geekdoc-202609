  \n## 多类分类问题：那是什么类型的玻璃？\n\n多类分类与二元分类类似，区别在于有多个可能的离散结果，而不仅仅是两个。回想一下，探测未爆炸地雷的问题涉及两种可能的结果：声纳照射的物体是岩石还是地雷。根据化学成分测量值确定葡萄酒口感的问题有几种可能的结果（口感评分从\
  \ 3 到 8）。但对于葡萄酒问题，评分之间存在顺序关系。评分为 5 的葡萄酒比评分为 3 的好，但比评分为 8 的差。对于多类问题，结果之间不存在顺序感。本节描述的玻璃问题提供了一个多类问题的示例。\n\
  \n在本节中，玻璃问题展示了各种类型玻璃的化学成分。该问题的目标是确定玻璃的用途。可能的玻璃类型包括建筑窗户玻璃、车辆窗户玻璃、玻璃容器等。确定玻璃类型的动机是法医鉴定。在事故或犯罪现场，会有玻璃碎片，确定其来源有助于判断谁有过错或谁实施了犯罪。清单\
  \ 2-16 显示了生成玻璃数据集摘要的代码。图 2.20 显示了归一化数据的箱线图。箱线图显示有相当数量的极端值。\n\n![图 2.20：玻璃数据的箱线图](img/c02f020.png)\n\
