  \n**图 3.14**：使用前向逐步回归生成的实际口味评分与预测值对比\n\n\n\n\n图 3.15 展示了使用前向逐步回归预测葡萄酒口感评分时的预测误差直方图。有时误差直方图会呈现两个或更多离散的峰值。也许它会在图表的最右侧或最左侧出现一个小峰值。在这种情况下，可能可以找到误差中不同峰值的解释，并通过添加一个新属性来降低预测误差，该属性解释了数据点属于哪一组。\n\
  \n![图 3.15：使用前向逐步回归预测葡萄酒口感的误差直方图](img/c03f015.png)\n\n**图 3.15**：使用前向逐步回归预测葡萄酒口感的误差直方图\n\
  \n你需要注意该输出的几个方面。首先，让我们重述一下这个过程。该过程是训练一族模型（在本例中，是在 X 的列子集上训练的普通线性回归）。这系列模型是参数化的（在本例中，由线性模型中使用的属性数量参数化）。选择用于部署的模型是为了最小化样本外误差。纳入解决方案的属性数量可以称为\
  \ `complexity parameter`（复杂度参数）。具有较大复杂度参数的模型拥有更多自由参数，比复杂度较低的模型更容易过拟合数据。\n\n还要注意，属性已根据其预测质量的重要性进行了排序。在列编号列表和相关的属性名称列表中，列表中的第一个是首先被选中的属性，第二个是其次，以此类推。使用的属性会以一个漂亮的有序列表形式输出。这是机器学习技术的一项重要且理想的特性。机器学习任务的早期阶段主要涉及寻找（或构建）用于预测的最佳属性集。拥有按重要性对属性进行排序的技术有助于这一过程。本书中开发的其他算法也将具备这一特性。\n\
  \n最后一个观察点是关于从机器学习技术生成的模型族中挑选模型。模型越复杂，其泛化能力越差。最好倾向于选择复杂度较低的模型。前面的例子表明，第 9 个（最佳）模型和第\
  \ 10 个模型之间的性能几乎没有下降（第 4 位有效数字发生了变化）。最佳实践是移除那些属性，即使它们在第 4 位有效数字上表现更好，以保持保守策略。\n\n\
  #### 通过惩罚回归系数控制过拟合——岭回归\n\n本节介绍另一种修改普通最小二乘回归的方法，以控制模型复杂度并避免过拟合。该方法作为惩罚线性回归的初步介绍。你将在第\
  \ 4 章中看到更多相关内容。\n\n普通最小二乘回归旨在寻找标量 $\\beta_0$ 和向量 $\\beta$，使其满足（参见公式 3.14）。\n\n![公式\
  \ 3.14：OLS 最小化问题](img/c03-disp-0015.png)\n\n**公式 3.14**：OLS 最小化问题\n\n表达式 `argmin`\
  \ 意为“使表达式最小化的 $\\beta_0$ 和 $\\beta$ 的值”。得到的系数 $\\beta_0^*, \\beta^*$ 即为普通最小二乘解。最佳子集回归和前向逐步回归通过限制使用的属性数量来抑制普通回归。这等同于施加一个约束，即向量\
  \ $\\beta$ 中的某些条目等于零。另一种方法称为*系数惩罚回归*。系数惩罚回归通过使所有系数变小（而不是使其中一些变为零）来实现相同目的。系数惩罚线性回归的一种版本称为*岭回归*。公式\
  \ 3.15 展示了岭回归的问题公式化。\n\n![公式 3.15：岭回归最小化问题](img/c03-disp-0016.png)\n\n**公式 3.15**：岭回归最小化问题\n\
  \n公式 3.15 与普通最小二乘法（公式 3.14）的区别在于增加了 $\\alpha \\beta^T \\beta$ 项。$\\beta^T \\beta$\
  \ 项是 $\\beta$（系数向量）的欧几里得范数的平方。变量 $\\alpha$ 是该问题公式化中的复杂度参数。如果 $\\alpha = 0$，问题就变成了普通最小二乘回归。当\
  \ $\\alpha$ 变大时，$\\beta$（系数向量）趋近于零，只有常数项 $\\beta_0$ 可用于预测标签 $y_i$。scikit-learn 中提供了岭回归。清单\
  \ 3.5 展示了使用岭回归解决葡萄酒口感回归问题的代码。\n\n##### 清单 3.5：使用岭回归预测葡萄酒口感——ridgeWine.py\n\n\n\n\
  > ```\n> __author__ = 'mike_bowles'\n> \n> from Read_Fcns import list_read_wine\n\
  > import numpy as np \n> from sklearn import datasets, linear_model\n> from math\
  \ import sqrt\n> import matplotlib.pyplot as plt\n> \n> # 将数据读入列表\n> names, xList,\
  \ labels = list_read_wine()\n> \n> # 将属性和标签划分为训练集和测试集\n> indices = range(len(xList))\n\
  > xListTest = [xList[i] for i in indices if i%3 == 0 ]\n> xListTrain = [xList[i]\
  \ for i in indices if i%3 != 0 ]\n> labelsTest = [labels[i] for i in indices if\
  \ i%3 == 0]\n> labelsTrain = [labels[i] for i in indices if i%3 != 0]\n> \n> xTrain\
  \ = np.array(xListTrain); yTrain = np.array(labelsTrain)\n> xTest = np.array(xListTest);\
  \ yTest = np.array(labelsTest)\n> \n> alphaList = [0.1**i for i in [0,1, 2, 3, 4,\
  \ 5, 6]]\n> \n> rmsError = []\n> for alph in alphaList:\n>     wineRidgeModel =\
  \ linear_model.Ridge(alpha=alph)\n>     wineRidgeModel.fit(xTrain, yTrain)\n>  \
  \   rmsError.append(np.linalg.norm((yTest-wineRidgeModel.\\\n>                 \
  \            predict(xTest)), 2)/sqrt(len(yTest)))\n> \n> print('{:18}'.format(\"\
  RMS Error\"), \"alpha\") \n> for i in range(len(rmsError)):\n>     print(rmsError[i],\
  \ alphaList[i])\n> \n> # 绘制样本外误差随 alpha 变化的曲线\n> x = range(len(rmsError))\n> plt.plot(x,\
  \ rmsError, 'k')\n> plt.xlabel('-log(alpha)')\n> plt.ylabel('Error (RMS)')\n> plt.show()\n\
  > \n> # 为最佳 alpha 值绘制样本外误差直方图\n> # 以及实际值与预测值的散点图\n> # 找出对应最小值的索引，用对应的 alpha 值重新训练\n\
  > # 使用生成的模型对样本外数据进行预测\n> indexBest = rmsError.index(min(rmsError))\n> alph = alphaList[indexBest]\n\
  > wineRidgeModel = linear_model.Ridge(alpha=alph)\n> wineRidgeModel.fit(xTrain,\
  \ yTrain)\n> errorVector = yTest-wineRidgeModel.predict(xTest)\n> plt.hist(errorVector)\n\
  > plt.xlabel(\"Bin Boundaries\")\n> plt.ylabel(\"Counts\")\n> plt.show() \n> \n\
  > plt.scatter(wineRidgeModel.predict(xTest), yTest, s=100, alpha=0.10)\n> plt.xlabel('Predicted\
  \ Taste Score')\n> plt.ylabel('Actual Taste Score')\n> plt.show() \n> ```\n\n回想一下，前向逐步回归算法生成了一系列不同的模型——第一个模型包含一个属性，下一个包含两个属性，依此类推，直到最终模型包含所有属性。岭回归的代码也有一系列模型。不同之处在于，岭回归模型序列具有不同的\
  \ $\\alpha$ 值，而不是不同数量的属性——$\\alpha$ 是决定对 $\\beta$ 施加惩罚严重程度的参数。$\\alpha$ 序列的构建是按\
  \ 10 的幂次递减的。一般来说，你会希望让它们按指数级递减，而不是按固定增量递减。该范围需要相当宽泛，且可能需要一些实验来确定。\n\n图 3.16 绘制了\
  \ RMSE 作为岭复杂度参数 $\\alpha$ 函数的图表。参数从左侧的最大值排列到右侧的最小值。惯例是将最不复杂的模型显示在图表左侧，最复杂的模型显示在右侧。该图表显示的特性与前向逐步回归大致相同。误差大体相当，但略微倾向于前向逐步回归。\n\
  \n![图 3.16：使用岭回归进行葡萄酒质量预测的误差](img/c03f016.png)\n\n**图 3.16**：使用岭回归进行葡萄酒质量预测的误差\n\
  \n清单 3.6 显示了岭回归的输出。数字表明岭回归的特性与前向逐步回归大致相同。数字略微倾向于前向逐步回归。\n\n##### 清单 3.6：岭回归输出\n\n\
  > ```\n> RMS Error alpha\n> (0.65957881763424564, 1.0)\n> (0.65786109188085928,\
  \ 0.1)\n> (0.65761721446402455, 0.010000000000000002)\n> (0.65752164826417536, 0.0010000000000000002)\n\
  > (0.65741906801092931, 0.00010000000000000002)\n> (0.65739416288512531, 1.0000000000000003e-05)\n\
  > (0.65739130871558593, 1.0000000000000004e-06) \n> ```\n\n图 3.17 显示了岭回归预测器在葡萄酒口味数据上训练得到的实际口味评分与预测口味评分的散点图。图\
  \ 3.18 显示了预测误差的直方图。\n\n![图 3.17：使用岭回归生成的实际口味评分与预测值对比](img/c03f017.png)\n\n**图 3.17**：使用岭回归生成的实际口味评分与预测值对比\n\
  \n你可以将同样的通用方法应用于分类问题。“预测模型性能度量”一节讨论了几种量化分类器性能的方法。概述的方法包括使用误分类误差、将经济成本与各种预测结果相关联，以及使用\
  \ ROC 曲线下面积（AUC）来量化性能。该节使用普通最小二乘回归构建了一个分类器。清单 3.7 显示了遵循同一总体计划的 Python 代码。它不使用 OLS，而是使用岭回归作为构建岩石与地雷分类器的回归方法（带有复杂度调节参数），并使用\
  \ AUC 作为分类器的性能度量。清单 3.7 中的程序与使用岭回归进行葡萄酒口味预测类似。最大的区别在于，该程序将测试数据上的预测值和测试标签作为输入传递给\
  \ scikit-learn 包中的 `roc_curve` 程序。这使得计算每次训练过程中的 AUC 变得容易。这些值被累积起来，打印出的值如 清单 3.8\
  \ 所示。\n\n![图 3.18：使用岭回归进行葡萄酒口味预测误差的直方图](img/c03f018.png)\n\n**图 3.18**：使用岭回归进行葡萄酒口味预测误差的直方图\n\
  \n##### 清单 3.7：使用岭回归进行岩石与地雷分类——classifierRidgeRocksVMines.py\n\n\n\n\n#### Python\
  \ 代码示例：岭回归分类岩石与矿山数据\n\n```python\n__author__ = 'mike_bowles'\n\nimport numpy as\
  \ np\nfrom Read_Fcns import list_read_rvm\nfrom sklearn import datasets, linear_model\n\
  from sklearn.metrics import roc_curve, auc\nimport matplotlib.pyplot as plt\n  \n\
  ##### read data from uci data repository\nxList, labels = list_read_rvm()\n\n#####\
  \ divide attribute label vector into training and test sets (2/3, 1/3)\nindices\
  \ = range(len(xList))\nxListTest = [xList[i] for i in indices if i%3 == 0 ]\nxListTrain\
  \ = [xList[i] for i in indices if i%3 != 0 ]\nlabelsTest = [labels[i] for i in indices\
  \ if i%3 == 0]\nlabelsTrain = [labels[i] for i in indices if i%3 != 0]\n\nxTrain\
  \ = np.array(xListTrain); yTrain = np.array(labelsTrain)\nxTest = np.array(xListTest);\
  \ yTest = np.array(labelsTest)\n\nalphaList = [0.1**i for i in [-3, -2, -1, 0, 1,\
  \ 2, 3, 4, 5]]\n\naucList = []\nfor alph in alphaList:\n    rocksVMinesRidgeModel\
  \ = linear_model.Ridge(alpha=alph)\n    rocksVMinesRidgeModel.fit(xTrain, yTrain)\n\
  \    fpr, tpr, thresholds = roc_curve(yTest, rocksVMinesRidgeModel.\\\n        \
  \            predict(xTest))\n    roc_auc = auc(fpr, tpr)\n    aucList.append(roc_auc)\n\
  \nprint('{:18}'.format(\"AUC\"), \"alpha\") \nfor i in range(len(aucList)):\n  \
  \  print(aucList[i], alphaList[i])\n\n##### plot auc values versus alpha values\n\
  x = [-3, -2, -1, 0, 1, 2, 3, 4, 5]\nplt.plot(x, aucList)\nplt.xlabel('-log(alpha)')\n\
  plt.ylabel('AUC')\nplt.show()\n\n##### visualize the performance of the best classifier\n\
  indexBest = aucList.index(max(aucList))\nalph = alphaList[indexBest]\nrocksVMinesRidgeModel\
  \ = linear_model.Ridge(alpha=alph)\nrocksVMinesRidgeModel.fit(xTrain, yTrain)\n\n\
  ##### scatter plot of actual vs predicted\nplt.scatter(rocksVMinesRidgeModel.predict(xTest),\
  \ yTest, \\\n            s=100, alpha=0.25)\nplt.xlabel(\"Predicted Value\")\nplt.ylabel(\"\
  Actual Value\")\nplt.show() \n```\n\nListing 3.8 显示了 AUC 及其相关的 alpha（系数惩罚的乘数）。\n\
  \n#### Listing 3.8：使用岭回归进行岩石与矿山分类模型的输出\n\n```\nAUC alpha\n(0.84111384111384113,\
  \ 999.9999999999999)\n(0.86404586404586403, 99.99999999999999)\n(0.9074529074529073,\
  \ 10.0)\n(0.91809991809991809, 1.0)\n(0.88288288288288286, 0.1)\n(0.8615888615888615,\
  \ 0.010000000000000002)\n(0.85176085176085159, 0.0010000000000000002)\n(0.85094185094185093,\
  \ 0.00010000000000000002)\n(0.84930384930384917, 1.0000000000000003e-05) \n```\n\
  \nAUC 值接近 1 表示性能极佳。接近 0.5 的值则效果不佳。因此，AUC 的目标是使其最大化，这与前面示例中最小化 MSE 不同。AUC 在 $\\alpha=1.0$\
  \ 处显示出一个相当尖锐的峰值。数字和图表显示，相对于 $\\alpha=1.0$，性能有相当显著的下降。回想一下，随着 alpha 变小，解会趋近于无约束线性回归问题的解。Alpha\
  \ 值小于 1.0 时性能的下降表明，无约束解的表现不如岭回归好。在前一节“衡量预测模型的性能”中，你看到了无约束普通最小二乘法的结果。样本内数据的 AUC 为\
  \ 0.98，样本外数据为 0.85——非常接近使用 alpha 相对较小（1E-5）的岭回归所得的 AUC。岭回归显著提高了性能。\n\n这里的问题是，岩石与矿山问题的属性空间有\
  \ 60 个属性宽，而完整数据集包含 208 行数据。移除 70 个作为留出数据的样本后，有 138 行数据可用于训练。这比属性数量多出两倍多，但无约束（普通最小二乘法）解仍然会过拟合数据。这种情况可能适合尝试\
  \ 10 折交叉验证。这将导致每折仅留出 20 个样本（数据集的 10%），并可能显示出随之而来的性能改进。这种方法将在第 5 章“使用惩罚线性方法构建预测模型”中介绍。\n\
  \nFigure 3.19 绘制了 AUC 作为 alpha 参数函数的图。这直观地演示了通过对系数向量的欧几里得长度施加约束来降低普通最小二乘解复杂度的价值。\n\
  \nFigure 3.20 显示了该分类器实际分类与预测的散点图。该图与葡萄酒预测的散点图具有相似的特征。由于实际结果的数量是离散的，散点图由两行水平点组成。\n\
  \n![Figure 3.19: AUC for the rocks-versus-mines classifier using ridge regression](img/c03f019.png)\n\
  \n**Figure 3.19**：使用岭回归的岩石与矿山分类器的 AUC\n\n![Figure 3.20: Plot of actual versus prediction\
  \ for the rocks-versus-mines classifier using ridge regression](img/c03f020.png)\n\
  \n**Figure 3.20**：使用岭回归的岩石与矿山分类器的实际值与预测值图\n\n本节介绍并探讨了普通最小二乘回归的两种扩展。这些作为训练和平衡现代预测模型过程的说明。此外，这些扩展有助于引入更通用的惩罚回归方法，这些方法将在第\
  \ 4 章中解释，并用于解决第 5 章中的各种问题。\n\n#### 在极大数据集上使用 PySpark 训练惩罚回归模型\n\nListing 3.9 演示了你在\
  \ Listing 3.5 和随后的性能表和图表中看到的葡萄酒岭回归的 PySpark 实现。两者之间的相似性有助于你了解，一旦掌握了使用这些技术的基础知识，它们对你来说是多么容易上手。还有一些值得指出和讨论的细节差异。\n\
  \n普通 Python 版本和 PySpark 版本的大纲是相同的：\n\n*   读取数据并将其分为训练集和测试集。\n*   定义一系列惩罚参数（alpha），用于生成不同复杂度的模型。\n\
  *   为每个 alpha 值构建模型，并通过在留出的测试数据上运行它们来确定其性能。\n\nPySpark 版本的代码结构是从 Python 版本复制粘贴而来的。\n\
  \n两者之间的差异可以分为几类。一些差异是由底层代码结构的差异决定的。例如，在 Python 版本中，为葡萄酒模型指定了一个命名对象，且 `.fit()` 函数对其进行训练。在\
  \ PySpark 版本中，模型类型及其参数被赋予一个名称，而 `.fit()` 函数将训练好的模型返回到另一个不同的命名对象中。经过一点练习，你就会熟悉这些语法上的细微差别。\n\
  \n\n\n\n数据集大小的差异导致了一些其他差异。例如，PySpark 版本暴露了一个 `maxIter` 变量，用于控制遍历数据的次数，以实现对最终答案的收敛。这是因为当数据集足够大时，计算时间在时间或金钱上可能变得负担沉重。这对\
  \ Python 版本来说不太成问题。另一个例子是 PySpark 代码中将输入定义为来自输入数据集的指定列的部分。在葡萄酒数据集这种列已为构建预测模型而选定的场景下，这似乎显得奇怪。在许多实际问题中，用于预测的数据是更大数据集的一部分，可能也是你为获得最佳答案而进行实验的一部分。如果数据集很大，复制它们的存储空间成本可能太高，因此\
  \ PySpark 允许你从更大的数据框中选择列。\n\n算法实现的差异可能导致答案的差异。正如你在 图 3.21 中所见，性能与正则化参数曲线的整体形状大致相同。但正如你从打印输出中所见，数值上存在差异。这些差异很小，且它们在相同的正则化参数值处达到最低值（这正是你要寻找的）。\n\
  \n##### 代码清单 3.9：葡萄酒数据上岭回归的 Spark 实现——`linear_regression_w_spark.py`\n\n```\n__author__\
  \ = 'mike_bowles'\n\n#Import sparksession \nfrom pyspark.sql import SparkSession\n\
  from pyspark.ml.feature import VectorAssembler\nfrom pyspark.ml.regression import\
  \ LinearRegression\nimport matplotlib.pyplot as plt\n\nspark = SparkSession.builder.appName(\"\
  regress_wine_data\").getOrCreate()\n\n#read in abalone data as pandas data frame\
  \ and create Spark data frame.  \nimport pandas as pd\nfrom pandas import DataFrame\n\
  from Read_Fcns import pd_read_wine\n\nwine_df = pd_read_wine()\n\n#Create spark\
  \ dataframe for wine data\nwine_sp_df = spark.createDataFrame(wine_df)\nprint('Column\
  \ Names', wine_sp_df.columns, '\\n\\n')\n\nvectorAssembler = VectorAssembler(inputCols\
  \ = ['fixed acidity', \\\n    'volatile acidity', 'citric acid', 'residual sugar',\
  \ 'chlorides', \\\n    'free sulfur dioxide', 'total sulfur dioxide', 'density',\
  \ 'pH', \\\n                    'sulphates', 'alcohol'], outputCol = 'features')\n\
  v_wine_df = vectorAssembler.transform(wine_sp_df)\nvwine_df = v_wine_df.select(['features',\
  \ 'quality'])\n\n\nsplits = vwine_df.randomSplit([0.66, 0.34])\nxTrain_sp = splits[0]\n\
  xTest_sp = splits[1]\n\nalphaList = [0.1**i for i in [0,1, 2, 3, 4, 5, 6]]\n\nrmsError\
  \ = []\nfor alph in alphaList:\n    wine_ridge_sp = LinearRegression(featuresCol\
  \ = 'features', \\\n        labelCol='quality', maxIter=100, regParam=alph, \\\n\
  \        elasticNetParam=0.0)\n    wine_ridge_sp_model = wine_ridge_sp.fit(xTrain_sp)\n\
  \    test_result = wine_ridge_sp_model.evaluate(xTest_sp)\n    rmsError.append(test_result.rootMeanSquaredError)\n\
  \nprint('{:18}'.format(\"RMS Error\"), \"alpha\") \nfor i in range(len(rmsError)):\n\
  \    print(rmsError[i], alphaList[i])\n\n#plot curve of out-of-sample error versus\
  \ alpha\nx = range(len(rmsError))\nplt.plot(x, rmsError, 'k')\nplt.xlabel('-log(alpha)')\n\
  plt.ylabel('Error (RMS)')\nplt.savefig('linear_regression_w_spark.png', dpi=500)\n\
  plt.show()\n\nPrinted Output:\nColumn Names ['fixed acidity', 'volatile acidity',\
  \ 'citric acid', \n'residual sugar', 'chlorides', 'free sulfur dioxide', \n'total\
  \ sulfur dioxide', 'density', 'pH', 'sulphates', 'alcohol', \n'quality'] \n\n\n\
  RMS Error             alpha\n0.6581102654673014 1.0\n0.6290665424695905 0.1\n0.6265318770170585\
  \ 0.010000000000000002\n0.6263116678129375 0.0010000000000000002\n0.6262902244707693\
  \ 0.00010000000000000002\n0.6262880862875198 1.0000000000000003e-05\n0.6262878725310369\
  \ 1.0000000000000004e-06 \n```\n\n![图 3.21：使用 PySpark 版本岭回归的葡萄酒质量预测误差](img/c03f021.png)\n\
  \n**图 3.21**：使用 PySpark 版本岭回归的葡萄酒质量预测误差\n\n## 总结\n\n本章涵盖了几个主题，为后续内容奠定了基础。首先，本章提供了问题复杂度和模型复杂度的可视化演示，并讨论了这些因素以及数据集大小如何共同决定给定问题上的预测性能。易于调整的模型复杂度和随之而来的性能度量，使你能够为你的问题找到这些要素的最佳平衡。本章首先回顾了与不同问题类型（回归、分类和多分类）相关的多种预测性能度量指标。这些涵盖了作为函数逼近问题一部分而出现的大多数问题类型。本章描述了两种估算新数据性能的方法（留出法和\
  \ n 折交叉验证）。本章介绍了一个概念框架，其中机器学习技术生成一系列具有不同复杂度的参数化模型族，然后根据样本外性能选择其中一个进行部署。基于普通最小二乘回归的修改（前向逐步回归和岭回归）的几个例子实例化了该概念框架。\n\
  \n你还看到了 Python 和 PySpark 工作流的相似之处。这应该让你对将所学应用于超大数据集充满信心。大数据集确实增加了一些棘手的困难，但构建和调优模型的算法过程非常相似。\n\
  \n## 参考文献\n\n1.  1．David J. Hand and Robert J. Till (2001). A Simple Generalization\
  \ of the Area Under the ROC Curve for Multiple Class Classification Problems. Machine\
  \ Learning, 45(2), 171–186.\n\n# 第 4 章 惩罚线性回归\n\n正如你在 第 3 章 “预测模型构建：平衡性能、复杂度与大数据”\
  \ 中所见，要让线性回归在实践中发挥作用，需要对普通最小二乘算法进行一些操作。普通最小二乘回归无法节制其对所有可用数据的使用以尝试最小化训练数据上的误差。第 3\
  \ 章 说明了这种情况可能导致模型在测试数据上的表现比在训练数据上差得多。第 3 章 展示了普通最小二乘回归的两种扩展：前向逐步回归和岭回归。这两种方法都涉及审慎地减少普通最小二乘可用的数据量，并利用样本外误差度量来确定多少数据量能产生最佳性能。\n\
  \n逐步回归开始时让普通最小二乘回归仅使用一个属性列进行预测，并选取最好的一个。然后通过递归地向模型中已使用的属性列添加单个额外的属性列来进行。\n\n岭回归引入了一种不同类型的约束。岭回归对系数的大小施加惩罚以收缩解。岭回归和前向逐步回归在示例问题上都比普通最小二乘法（OLS）表现更好。\n\
  \n\n\n\n### 惩罚线性回归：规范线性回归以实现最优性能\n\n本章开发了一系列扩展方法，用于控制普通最小二乘法（OLS）固有的过拟合问题。本章讨论的方法称为*惩罚线性回归*。惩罚线性回归涵盖了几种算法，它们的运作方式与第\
  \ 3 章介绍的方法相似。岭回归是惩罚线性回归算法的一个具体示例。岭回归通过惩罚回归系数平方和来规范过拟合。其他惩罚回归算法使用不同形式的惩罚。本章将解释惩罚方法如何决定解的性质以及关于解的可用信息类型。\n\
  \n### 为什么惩罚线性回归方法如此有用\n\n有几个特性使得惩罚线性回归方法极其有用，包括以下几点：\n\n*   模型训练极快\n*   提供变量重要性信息\n\
  *   部署时评估极快\n*   在各种问题上表现可靠——特别是在属性矩阵行数不比列数大得多，或者矩阵稀疏的情况下\n*   稀疏解（即更简约的模型）\n* \
  \  法规可能要求使用线性模型\n\n以下是这些特性对您作为机器学习模型设计者的意义。\n\n#### 极快的系数估计\n\n训练时间之所以重要，有几个原因。其中一个原因是构建模型的过程是迭代的。您会发现训练是特征选择和特征工程过程的一部分。您会挑选一些看似合理的特征，训练模型，在样本外数据上评估它，想要更好的性能，做一些更改，然后再试一次。如果基础训练能快速完成，您就不会浪费太多时间在等待答案时喝咖啡（并获得降低咖啡因摄入的健康益处）。这使得开发过程更快。训练时间重要的另一个原因是，您可能需要重新训练模型以使其在条件变化时保持有效。如果您在对推文分类，可能需要跟上词汇的变化。如果您在为金融市场交易训练模型，条件总是在变化。即使不进行特征重构，训练所花费的时间也将决定您对变化条件的响应速度。\n\
  \n#### 变量重要性信息\n\n本书涵盖的两类算法都能生成变量重要性信息。变量重要性信息包含您选择用于建模的每个属性的排名。排名告诉您模型对每个属性的重视程度与其他属性相比如何。排名高的属性对模型预测的贡献大于排名低的属性。这对多种原因至关重要。首先，它帮助您在特征工程过程中剔除变量。好的特征会浮到列表顶端，不那么好的则会沉到低端。除了帮助特征工程外，了解哪些变量驱动预测有助于您理解模型并向他人解释（您的老板、客户、公司的主题专家等）。在重要属性符合预期的程度上，这会让他们对模型讲得通充满信心。如果某些排名令人惊讶，您可能会对问题获得新见解。关于相对重要性的讨论可以为您的开发团队提供新思路，指明在哪里寻找性能改进。\n\
  \n快速训练和变量重要性这两个特性使惩罚回归成为尝试新问题时的首选算法。这些算法帮助您快速掌握问题全貌，并了解哪些特征将会有用。\n\n#### 部署时评估极快\n\
  \n在某些问题场景中，快速评估是关键性能指标。在某些电子市场（例如互联网广告和自动化交易）中，谁先得到答案谁就赢得生意。在许多其他应用中（例如垃圾邮件过滤），时间可能很关键，虽然不是绝对的通过/失败标准。很难有模型能在评估速度上超越线性模型。预测计算所需的操作数量是每个属性一次乘法和一次加法。\n\
  \n#### 可靠性能\n\n*可靠性能*意味着惩罚线性方法将为各种形状和大小的问题生成合理的答案。在某些问题上，它们将达到可用的最佳性能。在某些情况下，它们可能需要一点技巧才能超越其他竞争者。本章将讨论一些可用于提高惩罚线性模型性能的技术。第\
  \ 6 章“集成方法”将重访此主题，并解释一些将惩罚线性回归与集成方法结合使用以提高性能的方法。\n\n#### 稀疏解\n\n*稀疏解*意味着模型中的许多系数为零。这意味着不需要那么多的乘法和求和运算。更重要的是，稀疏模型（即非零系数较少的模型）易于解释。当某些模型系数乘以特征的结果为零时，很容易看出哪些属性在驱动模型的预测。\n\
  \n#### 问题可能要求线性模型\n\n使用惩罚线性回归的最后一个原因是线性模型可能是解决方案的要求。保险赔付计算就是一个要求使用线性模型的例子，其中赔付公式通常是合同的一部分，规定了变量及其系数。一个包含一千棵树、每棵树有一千个参数的集成模型，几乎不可能用英语写出来。药物测试是另一个监管机构要求线性形式进行统计推断的领域。\n\
  \n#### 何时使用集成方法\n\n不使用惩罚线性回归的主要原因是您可能通过其他技术（如集成方法）获得更好的性能。正如第 3 章所述，集成方法在复杂问题（例如高度不规则的决策面）且拥有足够数据以解决问题复杂性时表现最佳。此外，用于衡量变量重要性的集成方法可以提供关于属性与预测之间关系的更多信息。例如，集成方法将给出二阶（及更高阶）信息，说明哪些变量对组合在一起比其单独重要性之和更重要。该信息实际上有助于从惩罚回归中榨取更多性能。您将在第\
  \ 6 章中阅读更多相关内容。\n\n### 惩罚线性回归：规范线性回归以实现最优性能\n\n正如第 3 章所述，本书解决的一类问题称为*函数逼近*。为函数逼近问题训练模型的起点是一个包含若干示例或实例的数据集。每个实例都有一个结果（也称为*目标*、*标签*、*终点*等）和若干用于预测结果的属性。第\
  \ 3 章给出了一个简单的说明性示例。这里以稍作修改的形式重复，见表 4.1。\n\n**表 4.1**：示例训练集\n\n| 结果 | 特征 1 | 特征 2\
  \ | 特征 3 |\n| --- | --- | --- | --- |\n| 2013 年花费 ($) | 性别 | 2012 年花费 ($) | 年龄 |\n\
  | 100 | M | 0.0 | 25 |\n| 225 | F | 250 | 32 |\n| 75 | F | 12 | 17 |\n\n\n\n\n在本表中，结果（2013\
  \ 年的花费）为实数值——这使其成为一个回归问题。性别属性（特征 1）为双值，使其成为一个分类（或因子）属性。其他两个属性为数值型。函数逼近问题的目标是（1）建立一个将属性与结果相关联的函数，以及（2）在某种意义上最小化误差。第\
  \ 3 章讨论了可用于量化总体误差的一些替代误差表征。\n\n如表 4.1 所示类型的数据集，通常由一个包含结果的列向量（表 4.1 中的第一列）和包含属性的其他列（第一列之后的三个特征列）来表示。属性是用于预测结果的可用信息。数据科学家通常将表\
  \ 4.1 中的这种数据结构称为`dataframe`。在`dataframe`中，一列中的数据类型均相同：实数、整数、字符串变量，有时也包括布尔值。你可以在\
  \ Python pandas 和 PySpark 中（以及 R 编程语言中）找到`dataframe`。`dataframe`的形状与矩阵相同，但矩阵包含的元素均为相同的数值类型：实数、整数或布尔值。矩阵不能混合实数和分类变量。\n\
  \n这里有一个重要的观点。线性方法仅适用于数值数据。表 4.1 中的数据包含非数值数据，因此线性方法无法直接用于所示数据。幸运的是，将表 4.1 中的数据转换（或编码）为数值数据相对简单。在存在两个不同类别的情况下（如表\
  \ 4.1 中，可能性为 M 或 F），你可以用`0.0`替代 M，用`1.0`替代 F，然后进行线性回归。你将在“将非数值属性纳入线性方法”一节中学习一种将分类属性编码为数值属性的更通用技术。\n\
  \n鉴于所有属性均为实数（无论是在初始问题公式中，还是通过将分类属性编码为实数），线性回归问题的数据可以用两个对象表示：`Y`和`X`，其中`Y`是结果的列向量，`X`是实值属性的矩阵。公式\
  \ 4.1 展示了如何用单个大写字母`Y`来表示一列数字`y_i`。\n\n![公式 4.1：结果向量](img/c04-disp-0001.png)\n\n\
  **公式 4.1**：结果向量\n\n在表 4.1 给出的示例中，`Y`是标记为 Outcomes 的列。公式 4.2 展示了如何用单个大写字母`X`来表示一个数字矩阵（矩形网格）`x_ij`。\n\
  \n![公式 4.2：属性矩阵](img/c04-disp-0002.png)\n\n**公式 4.2**：属性矩阵\n\n在表 4.1 给出的示例中，`X`是排除\
  \ Outcomes 列后剩下的列集合。\n\n来自`Y`的第`i`个元素`y_i`与`X`的第`i`行来自同一个实例。`X`的第`i`行将用单下标的`x_i`表示，并由`x_i\
  \ = (x_i1, x_i2, ..., x_im)`给出。普通最小二乘回归问题在于最小化`y_i`与线性函数`x_i`之间的误差，即`X`的第`i`行属性（即寻找一个实数向量`β`，如公式\
  \ 4.3 所定义，以及一个标量`β_0`），使得来自`Y`的每个元素`y_i`均可由公式 4.4 近似。\n\n![公式 4.3：模型系数β向量](img/c04-disp-0003.png)\n\
  \n**公式 4.3**：模型系数β向量\n\n![公式 4.4：X 与 Y 预测值之间的线性关系](img/c04-disp-0004.png)\n\n**公式\
  \ 4.4**：`X`与`Y`预测值之间的线性关系\n\n你或许能利用你的专业知识找到`β`的值。例如在表 4.1 中，你可能估计人们在 2013 年的花费比\
  \ 2012 年多 10%，购买额随年龄每增长一年增加 10 美元，甚至新生儿也会购买 50 美元的书籍。这给出了一个预测图书支出的方程，如公式 4.5 所示。\n\
  \n![公式 4.5：预测图书支出](img/c04-disp-0006.png)\n\n**公式 4.5**：预测图书支出\n\n\n\n公式 4.5 未使用\
  \ Gender 变量，因为它是一个分类变量。（这将在“将非数值属性纳入线性方法”中介绍，目前暂时忽略。）公式 4.5 生成的预测值与表 4.1 中的 Outcomes（实际数值）并不完全匹配。这个简单模型存在一些误差，模型通常都会有。\n\
  \n#### 训练线性模型：最小化误差及其他\n\n手动寻找 `β` 的值通常不是最佳途径，尽管如果你能做到，这始终是一个很好的合理性检验。在许多问题中，问题的规模或变量之间的相互关系使得猜测\
  \ `β` 成为不可能。因此，采取的方法是通过求解一个最小化问题来寻找属性上的乘数（即 `β`）。该最小化问题旨在找到使平均平方误差最小（但非零）的 `β` 值。\n\
  \n使公式 4.4 两边完全相等通常意味着模型过拟合。公式 4.4 的右侧是你将要训练的预测模型。基本上，它表明要进行预测，你需要获取每个属性，乘以其对应的 beta，对这些乘积求和，再加上一个常数。*训练模型*意味着找到组成向量\
  \ `β` 和常数 `β₀` 的数值。*误差*定义为 `yᵢ` 的实际值与公式 4.4 给出的预测值 `ŷᵢ` 之间的差值。使用平均平方误差将个别误差归约为一个待最小化的单一数值。选择误差的平方是因为无论误差是正还是负，其平方均为正，且平方函数便于某些数学运算。普通最小二乘回归问题的表述则变为寻找满足公式\
  \ 4.6 的 `β₀*, β*`（上标 * 表示这些是 `β` 的最佳值）。\n\n![公式 4.6：OLS 的最小化问题](img/c04-disp-0007.png)\n\
  \n**公式 4.6：OLS 的最小化问题**\n\n符号 `argmin` 意为“使以下表达式最小化的自变量”。求和针对各行进行，其中一行包含属性值和对应的标签。`(...)`²\
  \ 内的表达式是 `yᵢ` 与用于近似它的线性函数之间的误差。对于 2013 年图书支出的预测值，求和内的表达式将是 Outcome 列中的值减去根据公式 4.4\
  \ 计算出的预测值。\n\n用英语表述，公式 4.6 表示向量 beta star 和常数 beta zero star 是使期望预测平方误差最小化的值——即所有数据行\
  \ `i = 1, …, n` 上 `yᵢ` 与属性行预测值 `ŷᵢ` 之间的平均平方误差。公式 4.5 中的最小化产出了该回归模型的普通最小二乘值。这个机器学习模型是一个实数列表——即包含在向量\
  \ `β*` 中的数值和数值 `β₀*`。\n\n##### 在 OLS 表述中添加系数惩罚\n\n惩罚线性回归问题的数学表述与公式 4.5 非常相似。你在第\
  \ 3 章中看到的岭回归，就是惩罚线性回归的一个例子。岭回归在公式 4.5 所述的基本普通最小二乘问题中添加了一个惩罚项。岭回归的惩罚项如公式 4.7 所示。\n\
  \n![公式 4.7：施加于系数的惩罚](img/c04-disp-0008.png)\n\n**公式 4.7：施加于系数的惩罚**\n\n公式 4.6 中的\
  \ OLS 问题是选择 `β` 以最小化平方误差之和。惩罚回归问题将公式 4.7 中的系数惩罚添加到公式 4.6 的右侧。随后，最小化过程被迫在最小化平方预测误差和最小化系数平方值这两个相互冲突的目标之间取得平衡。单独最小化平方系数之和很容易，只需令所有系数为零即可。但这会导致巨大的预测误差。同样，OLS\
  \ 解单独最小化预测误差，但可能导致巨大的系数惩罚，具体取决于 `λ` 有多大。\n\n\n\n\n#### 为什么这讲得通？\n\n为了帮助建立一些直观理解，说明为什么这讲得通，请考虑一下你在第\
  \ 3 章中看到的子集选择过程。使用子集选择通过丢弃某些属性（或者等价地将它们的系数设为零）来消除过拟合。惩罚回归做的是同样的事情，但它不是像子集选择那样将少数属性的系数一直降到零，而是减小*所有*系数的大小，从而减弱*所有*属性的影响。一些极限情况也将有助于形象化理解这种方法。\n\
  \n参数 `λ` 的取值范围可以是 0 到正无穷大之间的任何值。如果 `λ = 0`，惩罚项消失，问题退化为普通最小二乘问题。如果 `λ → ∞`，对 `β`\
  \ 的惩罚变得极其严厉，以至于迫使它们全部变为零。（但请注意，`β₀` 不包含在惩罚项中，因此预测值变成一个与 `x` 无关的常数。）\n\n正如你在第 3 章的示例中所见，岭惩罚的效果类似于排除某些属性。该过程是为公式\
  \ 4.6 所示的惩罚版最小化问题生成一整族解。这意味着针对各种不同的 `λ` 值求解惩罚最小化问题。然后在样本外数据上测试这些解，并使用使样本外误差最小化的解来进行现实世界的预测。第\
  \ 3 章使用岭回归演示了这一系列步骤。\n\n##### 其他有用的系数惩罚——曼哈顿距离和弹性网\n\n岭惩罚并非可用于惩罚回归的唯一有用惩罚。任何向量长度的度量都可以。你可以用多种方式衡量向量的长度。使用不同的长度度量会改变解的重要特性。岭回归采用了欧几里得几何度量（即*平方\
  \ β*之和）。另一种称为 Lasso 回归的有用算法采用*绝对 β*之和或 L1 度量。这种度量也称为出租车度量或*曼哈顿距离*，因为它是出租车受限于曼哈顿方格街道网格所行驶的距离。Lasso\
  \ 回归具有一些有用的特性。\n\n岭回归和 Lasso 回归的区别在于它们用于惩罚 `β`（线性系数向量）的长度度量不同。岭回归使用平方欧几里得距离——即 `β`\
  \ 各分量平方之和。Lasso 使用 `β` 各分量绝对值之和。Lasso 惩罚由公式 4.8 给出。\n\n![Equation 4.8: Equation\
  \ for Lasso coefficient penalty](img/c04-disp-0009.png)\n\n**公式 4.8**：**Lasso 系数惩罚公式**\n\
  \n双竖线称为范数符号。它们用于表示向量和算子等事物的大小。范数符号右侧的下标 1 表示 `L₁` 范数，即绝对值之和。你也会看到它写作小写的 `l₁`。带下标\
  \ 2 的范数符号表示平方值之和的平方根——欧几里得距离。这些不同的系数惩罚函数会导致解中出现一些重要且有用的变化。主要区别之一是 Lasso 系数向量 `β*`\
  \ 是稀疏的，意味着对于中等到较大的 `λ` 值，许多系数为零。相比之下，岭回归的 `β*` 是完全填充的（即所有系数均非零）。\n\n##### 为什么 Lasso\
  \ 惩罚会导致稀疏系数向量\n\n图 4.1 和 4.2 说明了这种稀疏性特性如何直接源于系数惩罚函数的形式。这些图针对的是一个具有两个属性的问题：`x1` 和\
  \ `x2`。\n\n![Figure 4.1: Optimum solutions with sum squared coefficient penalty](img/c04f001.png)\n\
  \n**图 4.1**：平方系数惩罚下的最优解\n\n图 4.1 和 4.2 都包含两组曲线。一组是同心椭圆，代表公式 4.6 中的普通最小二乘误差。椭圆代表恒定平方和误差曲线。你可以把它们想象成地面上椭圆形洼地的地形图。越靠近中心的椭圆误差越小，就像洼地的海拔越靠近底部越低一样。洼地的最低点标记为\
  \ `x`。点 `x` 标记了普通最小二乘解——即在没有系数惩罚时解所在的位置。\n\n![Figure 4.2: Optimum solutions with\
  \ sum absolute value coefficient penalty](img/c04f002.png)\n\n**图 4.2**：绝对值系数惩罚下的最优解\n\
  \n\n\n\n图 4.1 和 4.2 中的其他曲线组分别代表 公式 4.7 和 4.8 中的系数惩罚——即岭回归惩罚和 Lasso 惩罚。\n\n在 图 4.1\
  \ 中，代表系数惩罚的曲线是以原点为中心的圆。当 $\\beta_1$ 和 $\\beta_2$ 的平方和为常数时，这些点的集合构成一个圆。恒定惩罚曲线的形状取决于所用距离度量的性质——平方和惩罚函数对应圆（在高维空间中称为超球面或\
  \ $L_2$ 球），绝对值之和惩罚对应菱形（或 $L_1$ 球）。较小的圆（或菱形）对应距离函数的较小值。形状由惩罚函数的性质决定，但与每条曲线关联的值由非负参数\
  \ $\\lambda$ 决定。\n\n假设 图 4.1 中的两条曲线分别对应内圆和外圆的 $\\beta_1² + \\beta_2²$ 等于 1.0 和 2.0。那么如果\
  \ $\\lambda = 1$，这两个圆关联的惩罚分别为 1 和 2。如果 $\\lambda = 10$，关联的惩罚分别为 10 和 20。图 4.2 中的菱形同理。增大\
  \ $\\lambda$ 会增加 图 4.2 中同心菱形关联的惩罚。\n\n对应预测误差平方和的椭圆环，随着环远离图中用 *x* 标记的无约束最小值而变大。如\
  \ 公式 4.7 所示，最小化这两个函数之和需要在预测误差的最小值和系数惩罚的最小值之间做出妥协。较大的 $\\lambda$ 值会将妥协点拉向惩罚的最小值（所有系数为零）。较小的\
  \ $\\lambda$ 值会将最小值拉向无约束的最小预测误差（图 4.1 和 4.2 中的 *x*）。\n\n平方系数惩罚之和与绝对值系数惩罚之和的区别在此变得重要。公式\
  \ 4.7 或 4.8 的总体最小值将始终位于恒定惩罚曲线与平方预测误差曲线相切的点上。图 4.1 和 4.2 展示了说明这种相切性的两个示例。这里的关键点在于：在\
  \ 图 4.1 中，随着 $\\lambda$ 变化并移动最小值点，平方和惩罚（圆）的相切点通常不在任一坐标轴上。$\\beta_1$ 和 $\\beta_2$\
  \ 均不为零。相比之下，在 图 4.2 中，绝对值惩罚的相切点在一系列解中始终“卡”在 $\\beta_2$ 轴上。沿 $\\beta_2$ 轴，$\\beta_1\
  \ = 0$。\n\n\n\n稀疏系数向量是算法告诉你可以完全忽略某些变量的方式。当 $\\lambda$ 变得足够小时，$\\beta_2$ 和 $\\beta_1$\
  \ 的最佳值将脱离 $\\beta_2$ 轴，且两者均为非零。较小的惩罚即可使 $\\beta_1$ 变为非零这一事实，给 $\\beta_2$ 和 $\\beta_1$\
  \ 确立了顺序。在某种意义上，$\\beta_2$ 比 $\\beta_1$ 更重要，因为它在更大的 $\\lambda$ 值下获得非零系数。请记住，这些系数乘以属性。如果对应某属性的系数为零，算法即在告诉你该属性不如获得非零系数的属性重要。通过从大到小扫描\
  \ $\\lambda$，你可以按重要性对所有属性排序。下一节将通过具体问题演示这一点，并展示 Python 代码，在求解 Equation 4.8 的过程中明确属性间的重要性比较。\n\
  \n##### ElasticNet 惩罚融合了 Lasso 和 Ridge\n\n在了解如何计算这些系数之前，你还需要知道惩罚回归问题的另一种广义表述。这称为\
  \ ElasticNet 表述。ElasticNet 表述的惩罚回归问题，是使用 Ridge 惩罚和 Lasso 惩罚的可调混合。ElasticNet 引入了另一个参数\
  \ $\\alpha$，用于参数化总惩罚中 Ridge 惩罚所占的比例和 Lasso 惩罚所占的比例。端点 $\\alpha=1$ 对应全 Lasso 惩罚、无\
  \ Ridge 惩罚。端点 $\\alpha=0$ 对应全 Ridge 惩罚。\n\n在 ElasticNet 表述中，必须同时指定 $\\lambda$ 和\
  \ $\\alpha$ 才能求解线性模型的系数。通常的做法是选定一个 $\\alpha$ 值，然后求解一系列 $\\lambda$ 的值。稍后你将看到这样做的计算原因。在许多情况下，$\\\
  alpha=1$ 与 $\\alpha=0$ 或某个中间 $\\alpha$ 值之间没有巨大的性能差异。有时差异会很大，因此你最好检查几个不同的 $\\alpha$\
  \ 值，以确保不会无谓地牺牲性能。\n\n### 求解惩罚线性回归问题\n\n在前一节中，你了解到确定惩罚线性回归模型等同于求解一个优化问题。许多通用数值优化算法可求解\
  \ Equations 4.6、4.8 和 ElasticNet 中的优化问题，但惩罚线性回归问题的重要性促使研究人员开发了专用算法，能极快地生成解。本节介绍这些算法的基础并运行代码，以便你理解每种算法的机制。本节讲解两种算法的机制：*最小角回归*（LARS）和\
  \ `glmnet`。选择这两种是因为它们可以相互关联，也能关联到你已见过的一些方法，如 Ridge 回归和前向逐步回归。此外，它们训练速度极快，且作为 Python\
  \ 包的一部分可用。第 5 章“使用惩罚线性方法构建预测模型”将使用包含这些算法的 Python 包来探索示例问题。\n\n#### 理解最小角回归及其与前向逐步回归的关系\n\
  \n一种非常快、非常巧妙的算法是由 Bradley Efron、Trevor Hastie、Iain Johnstone 和 Robert Tibshirani\
  \ 开发的最小角回归（LARS）算法（`http://en.wikipedia.org/wiki/Least-angle_regression`）。LARS 算法可理解为对你在\
  \ 第 3 章 中看到的前向逐步算法的一种改进。前向逐步算法总结如下：\n\n**前向逐步回归算法**\n\n*   将所有 $\\beta$ 初始化为零。\n\
  \n**每一步**\n\n*   计算使用已选变量后的残差（误差）。\n*   确定哪个未用变量最能解释残差，并将其加入模型。\n\nLARS 算法非常相似。主要区别在于\
  \ LARS 不会无保留地纳入每个新属性，而只是部分纳入。LARS 算法总结如下：\n\n**最小角回归算法**\n\n*   将所有 $\\beta$ 初始化为零。\n\
  \n**每一步**\n\n*   确定哪个属性与残差的相关性最大。\n*   若相关性为正，则以微小量增加该变量的系数；若为负，则以微小量减少。\n\n\n\n\
  ##### LARS 算法\n\nLARS 算法解决的问题与前面列出的那些略有不同。然而，它生成的解通常与 Lasso 相同，即使存在差异，差异也相对较小。深入研究\
  \ LARS 算法的原因在于它与 Lasso 和前向逐步回归关系非常密切，且 LARS 算法易于概述，代码实现也相对紧凑。通过阅读 LARS 的代码，你将理解更通用的\
  \ ElasticNet 求解器内部的工作原理。更重要的是，你将看到伴随惩罚回归求解器的各种问题及其变通方法。实现 LARS 算法的代码如 代码清单 4.1 所示。\n\
  \n代码主要分为三个部分，此处简要描述，随后将详细讨论：\n\n*   以列表形式读取数据和表头。\n*   标准化属性和标签。\n*   求解组成解的系数（`β₀*,\
  \ β*`）。\n\n###### 代码清单 4.1：用于预测葡萄酒口感的 LARS 算法——larsWine2.py\n\n```\nfrom Read_Fcns\
  \ import list_read_wine\nimport numpy as np\nfrom sklearn import datasets, linear_model\n\
  from sklearn.preprocessing import StandardScaler\n\nfrom math import sqrt\nimport\
  \ matplotlib.pyplot as plt\n\n####### 将葡萄酒数据读入列表\nnames, xList, labels = list_read_wine()\n\
  \n####### 标准化特征\nxScaler = StandardScaler()\nxNormalized = xScaler.fit_transform(xList)\n\
  nrows, ncols = xNormalized.shape\n  \n####### 标准化标签\nlabelScaler = StandardScaler()\n\
  labelNormalized = labelScaler.fit_transform(np.array(labels).reshape(\n        \
  \  [-1,1]))\n\n####### 初始化系数向量 beta\nbeta = np.zeros([ncols, 1])\n\n####### 初始化每一步的\
  \ beta 矩阵\nbetaMat = beta.copy()\n\n####### 初始化列表以累积已使用的特征\nnzList = []\n\n#######\
  \ 步数和步长\nnSteps = 350\nstepSize = 0.004\n\nfor i in range(1, nSteps):\n  \n    #\
  \ 计算残差\n    residuals = labelNormalized - np.dot(xNormalized, beta)\n    \n    #\
  \ 属性列与残差之间的相关性\n    corr = np.mean(xNormalized * residuals, axis=0) \n  \n    #\
  \ 定位与残差相关性幅度最大的特征\n    iStar = np.argmax(np.abs(corr))\n    corrStar = corr[iStar]\n\
  \  \n    # 增加或减少对应的系数 (beta)\n    # 相关性为正则增加，为负则减少\n    beta[iStar] += stepSize\
  \ * corrStar / abs(corrStar)\n    betaMat= np.concatenate( (betaMat, beta.copy()),\
  \ axis=1)\n\n    # 形成非零系数列表并累积新增的系数\n    nzBeta = [index for index in range(ncols)\
  \ if beta[index] != 0.0]\n    for q in nzBeta:\n        if (q in nzList) == False:\n\
  \            nzList.append(q)\n\nnameList = [names[nzList[i]] for i in range(len(nzList))]\n\
  \nprint(betaMat.shape)\nprint(nameList)\nfor i in range(ncols):\n    # 绘制每个属性的 beta\
  \ 值范围\n    coefCurve = betaMat[i,:].reshape([-1,])\n    xaxis = range(nSteps)\n\
  \    plt.plot(xaxis, coefCurve) \n\nplt.xlabel(\"Steps Taken\")\nplt.ylabel((\"\
  Coefficient Values\"))\n#plt.savefig('larsWine2.png', dpi=500)\nplt.show()\n\n打印输出：\n\
  (11, 350)\nalcohol, volatile acidity, sulphates, total sulfur dioxide, chlorides,\n\
  fixed acidity, pH, free sulfur dioxide, citric acid, residual sugar,\ndensity \n\
  ```\n\n第一步是读取表头、属性值和标签。此处使用普通的 Python 列表作为这些数据结构。\n\n第二步是标准化属性。所用的标准化方法与你在 第 2 章\
  \ “通过理解数据来理解问题” 中看到的相同。在 第 2 章 中，属性标准化是为了将属性置于可比较的尺度上，以便它们能方便地绘图并充分占据同一尺度。出于大致相同的原因，标准化通常作为惩罚线性回归的第一步。属性需要具有相同的尺度，以便系数值的选择仅基于哪个属性最有用，而非基于哪个属性具有最有利的尺度。作为说明，若距离属性以微米为单位，与以公里为单位的同一属性相比，只需一个非常小的系数就能在标签上产生巨大差异。标准化对于从惩罚回归中获得合理结果至关重要。\n\
  \nLARS 算法的每一步都会按固定量增加其中一个 `β`。如果属性具有不同的尺度，这个固定增量对不同属性意味着不同的事情。此外，更改某个属性的尺度（例如从英里改为英尺）会导致结果不同。基于这些原因，惩罚线性回归包通常使用你在\
  \ 第 2 章 中看到的通用标准化方法进行标准化。它们将数据标准化为零均值（通过减去均值）和单位标准差（通过除以标准差）。包通常会提供不标准化的选项，但我从未听说过不标准化的充分理由。\n\
  \n第三个也是最后一个部分求解 `β₀*, β*`。因为算法在标准化变量上运行，所以不需要截距 `β₀*`。截距通常用于解释标签与加权属性之间的任何差异。因为所有属性都已标准化为零均值，它们之间没有偏移量，因此\
  \ `β₀*` 没有任何作用。请注意，初始化了两个与 beta 相关的列表。一个称为 `beta`，其元素数量与属性数量相同——每个属性一个权重。另一个是一个类矩阵的列表的列表，将存放\
  \ LARS 算法每一步的 beta 列表。这触及了惩罚线性回归以及现代机器学习算法的一个关键概念。\n\n#### LARS 如何生成数百个复杂度各异的模型\n\
  \n\n\n\n现代机器学习算法总体而言，特别是惩罚线性回归，生成的是一族解，而非单一解。请回顾 公式 4.6 和 4.8。这些公式左侧是 `β`，右侧全是由问题可用数据固定的数值，只有一个例外。在\
  \ 公式 4.6 和 4.8 中，有一个参数 `λ` 需要通过其他方式确定。正如在讨论这些公式时指出的，当 `λ = 0` 时，问题退化为普通最小二乘回归；当\
  \ `λ → ∞` 时，`β* → 0`。因此，公式 4.6 和 4.8 所述问题中的 `β` 取决于参数 `λ`。\n\nLARS 算法不显式处理 `λ` 值，但效果相同。LARS\
  \ 算法从 `β` 等于零开始，然后将一个小增量加到能使误差减少最多的那个 `β` 上。所加的小增量会使 `β` 绝对值之和增加该增量的大小。如果增量很小，且用在最好的属性上，该过程的效果等同于求解\
  \ 公式 4.8 中的最小化问题。你可以在 清单 4.1 中追踪这一过程的演变。\n\n基本迭代仅仅是 `nSteps` 循环开头的几行代码。迭代的起点是 `β`\
  \ 的一个值。第一次遍历时，它们全设为零。后续遍历时，它们来自上一次遍历的结果。迭代分两步。首先，用 `β` 计算残差。*残差* 指观测结果与预测结果之差。本例中，预测方法是将每个属性乘以\
  \ `β` 中对应的元素，然后求和。第二步是求每个属性与残差的相关性，以确定哪个属性对减小残差（误差）贡献最大。两个变量的相关性是它们偏离各自均值的乘积，再除以各自标准差进行归一化。\n\
  \n互为缩放版本的变量，其相关性为 +1 或 -1，取决于它们之间的缩放是正还是负。如果两个变量相互独立变化，其相关性为零。维基百科相关性页面 `http://en.wikipedia.org/wiki/Correlation_and_dependence`\
  \ 给出了变量间具有其他程度相关性的很好示例。名为 `corr` 的列表包含每个属性的计算结果。你可能会注意到，严格来说，代码省略了均值、残差和归一化属性的标准差计算。之所以可行，是因为属性已归一化为标准差均为\
  \ 1，且结果值将用于寻找最大相关性，所有值乘以一个常数不会改变其顺序。\n\n计算出相关性后，确定哪个属性与残差的相关性最大（绝对值最大）就很简单了。`β`\
  \ 列表中对应的元素增加一小量。若相关性为正则增量为正，否则为负。然后用 `β` 的新值重新运行迭代。\n\nLARS 算法的净结果是 图 4.3 所示的系数曲线。查看这些曲线的方法是：想象图中“步数”轴上的一个点。此时，一条垂直线将穿过所有系数曲线。垂直线与系数曲线的交点处的值，即为\
  \ LARS 算法演变该步骤下的系数。若用 350 步生成曲线，则有 350 组系数。每一组都针对某个 `λ` 值优化了 公式 4.8。这就引出了该用哪一组的问题。稍后将解决该问题。\n\
  \n![图 4.3：葡萄酒数据上 LARS 回归的系数曲线](img/c04f003.png)\n\n**图 4.3**：葡萄酒数据上 LARS 回归的系数曲线\n\
  \n注意，前 25 步左右，只有一个系数非零。这是 Lasso 回归固有的稀疏性。最先离开零的系数是酒精含量；有一段时间，它是 LARS 回归唯一使用的变量。随后第二个变量加入。这一过程持续到所有变量都被用于解中。系数离开零的顺序可作为变量重要性排序的指示。如果必须丢弃一个变量，你会想丢弃最后加入的，而不是最先加入的。\n\
  \n#### 从 LARS 生成的数百个模型中选择最佳模型\n\n现在你有了 350 个可能的解，用于根据葡萄酒的化学性质预测其口感评分。如何选择最佳模型？要决定使用哪条曲线，需确定这\
  \ 350 个选择各自的表现。正如 第 3 章 所述，*性能* 指在样本外数据上的表现。第 3 章 概述了几种从训练过程中保留数据以评估性能的方法。清单 4.2\
  \ 展示了执行 10 折交叉验证以确定最佳部署系数集的代码。\n\n十折交叉验证是将输入数据分成 10 个大致相等的组，移除其中一组，用其余数据训练，然后在被移除的组上测试。通过循环遍历所有\
  \ 10 组并逐个移除它们进行测试，可以得到误差及其变异性的良好估计。\n\n##### 清单 4.2：用于确定最佳系数集的 10 折交叉验证——larsWineCV.py\n\
  \n\n\n\n\n> ```\n> __author__ = 'mike-bowles'\n> \n> from Read_Fcns import list_read_wine\n\
  > import numpy a np\n> from sklearn import datasets, linear_model\n> from math import\
  \ sqrt\n> import matplotlib.pyplot as plt\n> \n> #read data into iterable\n> names,\
  \ xList, labels = list_read_wine()\n> \n> #Normalize columns in x and labels\n>\
  \ nrows = len(xList)\n> ncols = len(xList[0])\n> \n> #read wine data into lists\n\
  > names, xList, labels = list_read_wine()\n> \n> #Normalize features\n> xScaler\
  \ = StandardScaler() \n> xNormalized = xScaler.fit_transform(xList)\n> nrows, ncols\
  \ = xNormalized.shape\n> \n> #Normalize labels\n> labelScaler = StandardScaler()\n\
  > labelNormalized = labelScaler.fit_transform(np.array(labels).reshape( \\\n>  \
  \                 [-1,1]))\n> \n> #Build cross-validation loop to determine best\
  \ coefficient values.\n> \n> #number of cross validation folds\n> nxval = 10\n>\
  \ \n> #number of steps and step size\n> nSteps = 350\n> stepSize = 0.004\n> \n>\
  \ #initialize accumulator for errors\n> mean_sq_err = np.zeros([nSteps,1])\n> \n\
  > for ixval in range(nxval):\n>     #Define test and training index sets\n>    \
  \ idxTest = [a for a in range(nrows) if a%nxval == ixval]\n>     idxTrain = [a for\
  \ a in range(nrows) if a%nxval != ixval]\n> \n>     #Define test and training attribute\
  \ and label sets\n>     xTrain = xNormalized[idxTrain, :] \n>     xTest = xNormalized[idxTest]\
  \ \n>     labelTrain = labelNormalized[idxTrain] \n>     labelTest = labelNormalized[idxTest]\
  \ \n> \n>     #Train LARS regression on Training Data\n>     nrowsTrain = len(idxTrain)\n\
  >     nrowsTest = len(idxTest)\n> \n>     #initialize a vector of coefficients beta\n\
  >     beta = np.zeros([ncols, 1])\n>   \n>   for iStep in range(nSteps):\n>    \
  \   #calculate residuals\n>       residuals = labelTrain - np.dot(xTrain, beta)\n\
  > \n>       #correlation between attribute columns and residual\n>       corr =\
  \ np.mean(xTrain * residuals, axis=0) \n> \n>       #locate feature w largest magnitude\
  \ correlation with residuals\n>       iStar = np.argmax(np.abs(corr))\n>       corrStar\
  \ = corr[iStar]\n>   \n>       #update coefficients \n>       beta[iStar] += stepSize\
  \ * corrStar / abs(corrStar)\n>     \n>       #calculate out of sample squared errors\n\
  >       err = labelTest - np.dot(xTest, beta)\n>       mean_sq_err[iStep,0] += np.mean(err*err)\
  \ / float(nxval)\n>     \n> cvCurve = mean_sq_err\n> \n> minPt = np.argmin(cvCurve)\n\
  > minMse = cvCurve[minPt]\n> print(\"Minimum Mean Square Error\", minMse)\n> print(\"\
  Index of Minimum Mean Square Error\", minPt)\n> \n> xaxis = range(len(cvCurve))\n\
  > plt.plot(xaxis, cvCurve)\n> \n> plt.xlabel(\"Steps Taken\")\n> plt.ylabel((\"\
  Mean Square Error\"))\n> #plt.savefig('larsWineCV.png', dpi=500)\n> plt.show() \n\
  > ```\n\n##### 用于模型选择的 Python 代码中的交叉验证机制化\n\n清单 4.2 中的代码开头与 清单 4.1 中的代码类似。差异在循环\
  \ `nxval` 次的交叉验证循环处变得清晰。在本例中 `nxval = 10`，但也可以设置为其他值。关于使用多少折的权衡在于：折数较少意味着你在较少的数据上进行训练。如果你采用\
  \ 5 折，则每次训练都会留出 20% 的数据。如果你采用 10 折，则只留出 10%。正如你在 第 3 章 中所见，在较少数据上训练会导致算法所能达到的准确率下降。然而，折数越多意味着需要更多次地遍历训练过程。就训练所需的时钟或日历时间而言，这可能会很繁琐。\n\
  \n在交叉验证循环之前，初始化了一个误差列表。该误差列表将包含 LARS 算法演进过程中每一步的误差列表。它将累积所有 10 个交叉验证折中每一步的误差。在交叉验证循环内部，你将看到训练集和测试集的定义。除非有特殊原因，我通常使用取模函数来定义这些集合。例如，有时你可能需要进行所谓的*分层抽样*。假设你正试图在不平衡的数据上构建分类器，因此某个类别的样本非常少。你希望训练集能代表完整的数据集。你可能需要按类别隔离数据，以便类别在样本内和样本外数据中都有代表。\n\
  \n你可能更倾向于使用随机函数来定义训练集和测试集。你需要注意数据集中是否存在任何模式，这些模式会与抽样过程产生不利的相互作用（即观测值不可交换）。例如，如果数据是在工作周内每天采集的，那么结合五折交叉验证使用取模函数可能会导致一个集合包含所有的周一，另一个包含所有的周二，依此类推。\n\
  \n##### 在每个交叉验证折上累积误差并评估结果\n\n一旦定义了训练集和测试集以及一些常量，LARS 算法的迭代就开始了。这与 清单 4.1 中定义的过程非常相似，但有两个重要的区别。首先，算法的基本迭代是在训练集上而非完整数据集上进行的；其次，在每次迭代的每一步以及每个交叉验证折中，当前的\
  \ `β` 值会与测试属性和测试标签一起用于确定该步骤在测试集上的误差。你将在交叉验证循环底部看到该计算。每次更新 `β` 时，都会将其应用于测试数据，并将误差累积到“error”中相应的列表中。然后对\
  \ error 中的每个列表进行平方和求平均，这是一件简单的事。这将生成一条在所有 10 个交叉验证折上平均的每次迭代的均方误差（MSE）曲线。\n\n你可能会担心测试数据是否被正确使用。时刻警惕测试数据泄露到训练过程中始终很重要。有许多方法会让人误以为自己没有违反这一必要性。在本例中，你会注意到测试数据未用于\
  \ `β` 增量的计算。那里只使用了训练数据。\n\n##### 模型选择和训练序列的实际考量\n\nLARS 迭代步数与 MSE 的曲线如 图 4.4 所示。这条曲线呈现出一种相当常见的模式。它在整个范围内或多或少单调递减。严格来说，正如程序相关打印输出所示，它在\
  \ 311 步左右确实有一个最小值点。但图表显示该最小值相当平缓，不够尖锐。在某些情况下，这条曲线会在某处有一个尖锐的最小值，并在最小值的左右两侧显著上升。你利用交叉验证的结果来决定\
  \ LARS 生成的 350 个解中哪一个应用于预测。在本例中，最小值位于第 311 步。第 311 组 `β` 将是用于部署的系数。当对部署哪个最佳解存在歧义时，通常最好部署更保守的解。对于惩罚回归，更保守意味着系数值更小的那个。按照惯例，样本外性能通常将复杂度较低的模型描绘在左侧，复杂度较高的模型描绘在右侧。复杂度较低的模型具有更好的泛化误差；即它们在新数据上的表现更可预测。更保守的模型将是样本外性能图中更靠左侧的那个。\n\
  \n\n\n\n![Figure 4.4: Cross-validated mean square error for LARS on wine data](img/c04f004.png)\n\
  \n**Figure 4.4**: Cross-validated mean square error for LARS on wine data\n\n本节对\
  \ LARS 算法和交叉验证过程的描述，是先在整个数据集上训练算法，然后再进行交叉验证。在实践中，你可能会先运行交叉验证，然后再在整个数据集上训练算法。交叉验证的目的是确定你能达到的\
  \ MSE（或其他指标）性能水平，并了解你的数据集能支撑多复杂的模型。如果你还记得，第 3 章讨论了数据集大小和模型复杂度的问题。交叉验证（或其他把数据留出以获得可靠性能估计的过程）正是你确定将要部署的模型的最佳复杂度的方法。你确定的是复杂度，而不是具体的模型（即不是具体的\
  \ `β` 集合）。正如你在清单 4.2 中所见，使用 10 折交叉验证，你实际上已经训练了 10 个模型，但无法从这 10 个模型中做出选择。最佳实践是在完整数据集上训练，并利用交叉验证结果来决定部署哪个模型。在清单\
  \ 4.2 所示示例中，交叉验证在训练过程的第 311 步给出了 0.59 的最小 MSE。Figure 4.5 中的系数曲线是在完整数据集上训练的。深入讨论交叉验证的动机在于不知道\
  \ Figure 4.5 中表示的 350 组系数中的哪一组应该被部署。交叉验证给出了 MSE 的可靠估计，并告诉我们要部署在完整数据集上训练得到的第 311\
  \ 个模型。\n\n![Figure 4.5: Plot of S() function](img/c04f005.png)\n\n**Figure 4.5**:\
  \ Plot of `S()` function\n\n#### 使用 Glmnet：极快且极通用\n\nglmnet 算法由斯坦福大学的 Jerome Friedman\
  \ 教授及其同事于 2010 年开发。glmnet 算法求解 ElasticNet 问题。回顾一下，ElasticNet 问题包含一个惩罚函数的推广，该函数同时包含\
  \ Lasso 惩罚（绝对值之和）和岭回归惩罚（平方和）。ElasticNet 有一个参数 `λ`，用于确定系数惩罚相对于拟合误差的惩罚程度。它还有一个参数，用于确定惩罚接近岭回归（`α=0`）还是\
  \ Lasso（`α=1`）。glmnet 算法产生完整的系数曲线，类似于 LARS 算法。LARS 算法通过将系数量子累积到 `β` 中来推动曲线向前，而 glmnet\
  \ 算法则通过稳步减小 `λ` 来推动系数曲线向前。Equation 4.9 展示了 Friedman 论文中的关键方程——求解 ElasticNet 方程的系数的关键迭代方程。\n\
  \n![Equation 4.9: Coordinate-wise update for glmnet](img/c04-disp-0010.png)\n\n\
  **Equation 4.9**: Coordinate-wise update for glmnet\n\nEquation 4.9 是 Friedman 论文中\
  \ Equation 5 和 Equation 8 的组合（供想深究数学细节的读者参考）。它看起来很复杂，但稍加审视就会发现它与你在上一节看到的 LARS 方法有一些相似之处和联系。\n\
  \n##### Glmnet 和 LARS 算法机制的比较\n\nEquation 4.9 给出了 `β` 的基本更新方程。LARS 的更新方程是“找到与残差相关性幅度最大的属性，并按一个小的固定量增加（或减少）其系数”。更新后的\
  \ Equation 4.9 稍微复杂一些。它使用箭头而不是等号。箭头意味着类似“映射为”的意思。注意 `βⱼ~` 出现在箭头的两边。箭头右边是 `βⱼ~` 的旧值，箭头左边（箭头指向的方向）是\
  \ `βⱼ~` 的新值。经过 Equation 4.9 推断的迭代的若干次遍历后，`βⱼ~` 停止变化。（更准确地说，变化变得微不足道。）一旦 `βⱼ~` 停止变化，算法就为给定的\
  \ `λ` 和 `α` 值找到了解。该移动到系数曲线上的下一个点了。\n\n首先要注意求和内部的表达式 `xᵢⱼ rᵢ`。对 `i` 求和 `xᵢⱼ rᵢ`（即对数据行求和）得出第\
  \ `j` 个属性与残差之间的相关性。回想一下，在 LARS 回归中，算法的每一步都会将每个属性与残差进行相关性计算。在 LARS 算法中，这些相关性会被检验以查看哪个属性与残差的相关性最大，然后增加相应属性的系数。使用\
  \ glmnet 算法时，相关性的用法略有不同。\n\n\n\n\n在 `glmnet` 中，残差之间的相关性被用来计算每个系数的大小应改变多少。但在导致 ![images](img/c04-i0067.png)<math\
  \ display=\"inline\" overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\"\
  \ xmlns:xlink=\"http://www.w3.org/1999/xlink\"><mrow><msubsup><mrow><mi>&#946;</mi></mrow><mrow><mi>j</mi></mrow><mrow><mo>~</mo></mrow></msubsup></mrow></math>\
  \ 发生变化之前，结果会先通过函数 `S()`。函数 `S()` 是 Lasso 系数收缩函数。它绘制在 图 4.5 中。正如你在 图 4.5 中所见，如果第一个输入小于第二个，输出为零。如果第一个输入大于第二个，输出为第一个输入减去第二个输入后的值。这被称为软限幅器。\n\
  \n清单 4.3 展示了 `glmnet` 算法的代码。你可以在代码中看到如何使用 公式 4.9（用于更新 *β *'*s*）来生成 ElasticNet 系数曲线。清单\
  \ 4.3 中的代码标注了 Friedman 论文中的公式编号。该论文非常通俗易懂，如果你感兴趣，可以参考它以获取更多数学细节。\n\n##### 初始化和迭代\
  \ Glmnet 算法\n\n迭代从一个较大的 λ 值开始。它从一个足以使所有 β 's 为零的 λ 值开始。你可以通过参考 公式 4.9 来了解如何计算 λ\
  \ 的起始值。公式 4.9 中的函数 `S()` 如果其第一个输入（![images](img/c04-i0070.png)<math display=\"inline\"\
  \ overflow=\"scroll\" xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"\
  http://www.w3.org/1999/xlink\"><msub><mi>x</mi><mrow><mi>i</mi><mi>j</mi></mrow></msub><msub><mi>r</mi><mi>i</mi></msub></math>\
  \ 的相关性）小于第二个输入——λα，则输出为零。迭代开始时所有 *β *'*s* 都等于零，因此残差等于原始标签。用于确定起始 lambda 的代码计算每个属性与标签之间的相关性，找到幅度最大的一个，然后求解使最大相关性恰好等于\
  \ λα 的 λ 值。这是导致所有 β 为零的最大 λ 值。\n\n然后迭代通过减小 λ 开始。这是通过将 λ 乘以一个略小于 1 的数来实现的。Friedman\
  \ 建议选择乘数使得 ![images](img/c04-i0075.png)<math display=\"inline\" overflow=\"scroll\"\
  \ xmlns=\"http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><msup><mrow><mi>&#955;</mi></mrow><mrow><mn>100</mn></mrow></msup><mo>=</mo><mn>0.001</mn></mrow></math>。这给出的值大约为\
  \ 0.93。如果算法运行很长时间仍未收敛，则需要使 λ 的乘数更接近 1。在 Friedman 的代码中，实现这一机制的方法是将步数从 100 增加到（例如）200，这样将起始\
  \ λ 减少到其起始值的 0.001 需要 200 步。在 清单 4.3 中，你可以直接控制乘数。系数曲线如 图 4.6 所示。\n\n###### 清单 4.3：Glmnet\
  \ 算法——glmnetWine2.py\n\n```\n__author__ = 'mike_bowles'\n\nfrom Read_Fcns import\
  \ list_read_wine\nimport numpy as np\nfrom sklearn import datasets, linear_model\n\
  from math import sqrt\nimport matplotlib.pyplot as plt\nfrom sklearn.preprocessing\
  \ import StandardScaler\n\ndef S(z, gamma):\n    if gamma >= abs(z):\n        return\
  \ 0.0\n    return (z / abs(z)) * (abs(z) - gamma)\n\n####### 将葡萄酒数据读入属性行列表和标签列表\n\
  names, xList, labels = list_read_wine()\nnrows = len(xList)\nncols = len(xList[0])\n\
  \n####### 归一化 x \nxScaler = StandardScaler()\nxNormalized = xScaler.fit_transform(xList)\n\
  \n####### 归一化标签\nyScaler = StandardScaler()\nlabelNormalized = yScaler.fit_transform(np.array(labels).reshape(\n\
  \                   [-1, 1]))\n\n####### 选择 alpha 参数的值\nalpha = 1.0\n\n####### 定义迭代参数\n\
  nSteps = 100\nlamMult = 0.93 # 100 步使 lambda 减少 1000 倍\n\n####### 遍历数据一次以确定恰好抑制所有系数为零的\
  \ lambda 值\nxy = np.mean(xNormalized * labelNormalized, axis=0)\nmaxXY = np.amax(np.abs(xy))\n\
  lam = maxXY / alpha  # 起始 lambda 值\n\n####### 初始化系数向量 beta\nbeta = np.zeros([ncols,\
  \ 1])\n\n####### 初始化每一步的 beta 矩阵\nbetaMat = beta.copy()\n\n####### 开始迭代\nnzList\
  \ = [] # 按进入顺序排列的 betas\n\nfor iStep in range(nSteps):\n    # 减小 lambda 使某个系数变为非零\n\
  \    lam = lam * lamMult\n\n    deltaBeta = 100.0\n    eps = 0.01\n    iterStep\
  \ = 0\n    betaInner = beta.copy()\n    while deltaBeta > eps:\n        iterStep\
  \ += 1\n        if iterStep > 100: break\n\n        # 循环遍历属性并一次更新一个\n        # 记录起始值用于比较\n\
  \        betaStart = betaInner.copy()\n        for iCol in range(ncols):\n     \
  \       residual = labelNormalized - np.dot(xNormalized, betaInner)\n          \
  \  xjr = np.mean(xNormalized[:, iCol].reshape([-1, 1]) * \\\n                  \
  \  residual)\n            uncBeta = xjr + betaInner[iCol] \n            betaInner[iCol]\
  \ = S(uncBeta[0], lam * alpha) / (1 + \\\n                                     \
  \       lam * (1 - alpha))\n\n        sumDiff = np.sum(np.abs(betaInner - betaStart))\n\
  \        sumBeta = np.sum(np.abs(betaInner))\n        deltaBeta = sumDiff / sumBeta\n\
  \  \n    print('\\r', 'Step', iStep, 'Iteration', iterStep, end='')\n    beta =\
  \ np.array(betaInner.copy()).reshape([-1, 1])\n\n    # 将新确定的 beta 添加到列表\n    betaMat\
  \ = np.concatenate((betaMat, beta.copy()), axis=1)\n\n    # 跟踪 betas 变为非零的顺序\n \
  \   nzBeta = [index for index in range(ncols) if beta[index] != 0.0]\n    for q\
  \ in nzBeta:\n\n        if (q in nzList) == False:\n            nzList.append(q)\n\
  \n####### 打印出有序的 beta 列表\nnameList = [names[nzList[i]] for i in range(len(nzList))]\n\
  print('\\n\\n', nameList)\n\nnPts = betaMat.shape[1]\n\nfor i in range(ncols):\n\
  \    # 绘制每个属性的 beta 值范围\n    coefCurve = betaMat[i,:].reshape([-1,])\n    xaxis\
  \ = range(nSteps + 1)\n    plt.plot(xaxis, coefCurve)\nplt.xlabel(\"Steps Taken\"\
  )\nplt.ylabel((\"Coefficient Values\"))\n####### plt.savefig('glmnetWine2.png',\
  \ dpi=500)\nplt.show()\n\n打印输出：\nStep 99 Iteration 1\n\nalcohol, volatile acidity,\
  \ sulphates, total sulfur dioxide, chlorides, \nfixed acidity, pH, free sulfur dioxide,\
  \ residual sugar, citric acid,\ndensity \n```\n\n![图 4.6：用于预测葡萄酒口感的 glmnet 模型系数曲线](img/c04f006.png)\n\
  \n**图 4.6**：用于预测葡萄酒口感的 glmnet 模型系数曲线\n\n图 4.6 展示了由 清单 4.3 生成的系数曲线。这些曲线的特性看起来与 LARS\
  \ 生成并在 图 4.3 中显示的曲线相似——相似但不完全相同。LARS 和 Lasso 通常给出相同的曲线，但有时会给出略有不同的结果。判断哪一个更优的唯一方法是将它们都应用于样本外数据进行测试，看哪一个表现最好。\n\
  \n\n\nLasso 模型的测试和部署过程与 LARS 模型相同。请使用 第 3 章 中描述的方法之一对样本外数据进行测试（例如 n 折交叉验证）。利用样本外数据的结果确定最优模型复杂度。然后在完整数据集上训练以构建系数曲线，并根据样本外测试的结果，在系数曲线中选出最优步骤。\n\
  \n本节介绍了两种求解定义惩罚线性回归模型的最小化问题的方法。您已经了解了这两种方法在算法层面是如何工作的，它们之间有何关联，以及实现它们的代码是什么样子的。这应该能为您使用\
  \ Python 中实现这些算法的软件包打下坚实基础。这也使您处于有利位置，能够理解下一节将介绍的各种模型扩展，以及您将在 第 5 章 中看到的示例中使用的扩展。\n\
  \n### 将线性回归扩展到分类问题\n\n到目前为止，开发重点一直放在回归问题上——即预测结果取实数值的问题。如何将讨论过的方法应用于分类问题——即结果取两个（或更多）离散值（如“点击”或“不点击”）的问题？有几种方法可以将您目前所见的内容扩展以涵盖分类问题。\n\
  \n#### 使用惩罚回归求解分类问题\n\n对于二元分类问题，通过将二元结果编码为实数，通常能获得良好的结果。这一简单过程将两个二元值中的一个编码为 `1`，另一个编码为\
  \ `0`（或 `+1` 和 `-1`）。通过这种简单的安排，标签列表变成了实数列表。例如，结果“点击”和“不点击”变为 `1.0` 或 `0.0`。然后就可以使用前面讨论的算法。尽管存在更复杂的方法，但这通常是一个很好的替代方案。这种简单的编码方法通常比更复杂的方法训练得更快，这一点可能很重要。\n\
  \n清单 4.4 给出了一个示例，展示如何在岩石与地雷数据集中，用数字 `0` 或 `1` 标签替代类别成员身份，从而将分类问题转化为普通回归问题。您可能还记得在\
  \ 第 2 章 中，岩石与地雷数据集呈现了一个分类问题。该数据集源于一项实验，旨在确定声纳是否可用于探测水中遗留的未爆地雷。除了地雷，其他各种物体也会反射声纳的声波。预测问题在于判断反射波来自未爆地雷，还是来自海底岩石。\n\
  \n实验中的声纳使用了所谓的**调频波形**。调频波形是指在发射的声纳脉冲持续时间内，频率上升（或下降）的波形。岩石与地雷数据集中的 `60` 个属性是在 `60`\
  \ 个不同时间点对返回脉冲进行采样得到的，这些时间点对应于调频脉冲中的 `60` 个不同频率。\n\n清单 4.4 演示了如何将分类标签 `R` 和 `M` 转换为\
  \ `0.0` 和 `1.0`，从而将问题转化为普通回归问题。随后代码使用 LARS 算法构建分类器。清单 4.4 对完整数据集进行了一次遍历。正如上一节所讨论的，您需要使用交叉验证或其他留出法来选择最优模型复杂度。第\
  \ 5 章 将介绍这些设计步骤以及在该数据集上的性能比较。此处的重点是让您了解如何将已经见过的回归工具应用于分类问题。\n\n##### 清单 4.4：通过为二元标签分配数值将分类问题转化为普通回归问题——larsRocksVMines.py\n\
  \n```\n__author__ = 'mike_bowles'\nfrom Read_Fcns import list_read_rvm\nfrom math\
  \ import sqrt\nimport matplotlib.pyplot as plt\nimport numpy as np\nfrom sklearn.preprocessing\
  \ import StandardScaler\n\n#define function for producing coef curves\ndef lars_coef_curves(xNormalized,\
  \ labelNormalized, nSteps, stepSize):\n    nrows, ncols = xNormalized.shape\n  \
  \  \n    beta = np.zeros([ncols, 1])\n    betaMat = beta.copy()\n    \n    for i\
  \ in range(1, nSteps):\n        \n        #calculate residuals\n        residuals\
  \ = labelNormalized - np.dot(xNormalized, beta)\n        \n        #correlation\
  \ between attribute columns and residual\n        corr = np.mean(xNormalized * residuals,\
  \ axis=0) \n        \n        #locate feature w largest magnitude correlation with\
  \ residuals\n        iStar = np.argmax(np.abs(corr))\n        corrStar = corr[iStar]\n\
  \        \n        #increment or decrement corresponding coefficient (beta)\n  \
  \      #increment if corr is + decrement if it's - \n        beta[iStar] += stepSize\
  \ * corrStar / abs(corrStar)\n        betaMat= np.concatenate( (betaMat, beta.copy()),\
  \ axis=1)\n        \n        #form list of non-zero coefficients and accumulate\
  \ new ones\n        nzBeta = [index for index in range(ncols) if beta[index]\\\n\
  \                 != 0.0]\n        for q in nzBeta:\n            if (q in nzList)\
  \ == False:\n                nzList.append(q)\n    return betaMat, nzList\n\n#read\
  \ data from uci data repository\nxNum, labels = list_read_rvm()\n\nxNum = np.array(xNum)\n\
  labels = np.array(labels)\n\n#number of rows and columns in x matrix\nnrow, ncol\
  \ = xNum.shape\n\n#normalize features\nxScaler = StandardScaler()\nxNormalized =\
  \ xScaler.fit_transform(xNum)\n\n#Normalize labels\nyScaler = StandardScaler()\n\
  labelNormalized = yScaler.fit_transform(labels.reshape([-1, 1]))\n\n#number of steps\
  \ to take\nnSteps = 350\nstepSize = 0.004\nprint('shapes', xNormalized.shape, labelNormalized.shape)\n\
  \nbetaMat, nzList = lars_coef_curves(xNormalized, labelNormalized, \\\n        \
  \                 nSteps, stepSize)\n\n#make up names for columns of xNum\nnames\
  \ = ['V' + str(i) for i in range(ncol)]\nnameList = [names[nzList[i]] for i in range(len(nzList))]\n\
  \nprint(nameList)\nfor i in range(ncol):\n    #plot range of beta values for each\
  \ attribute\n    coefCurve = betaMat[i,:].reshape([-1,])\n    xaxis = range(nSteps)\n\
  \    plt.plot(xaxis, coefCurve)\n\nplt.xlabel(\"Steps Taken\")\nplt.ylabel((\"Coefficient\
  \ Values\"))\n#plt.savefig('larsRocksVMines.png', dpi=500)\nplt.show() \n\n打印输出：\n\
  shapes (208, 60) (208, 1)\n'V10', 'V48', 'V44', 'V11', 'V35', 'V51', 'V20', 'V3',\
  \ 'V21', 'V15', \n'V43', 'V0', 'V22', 'V45', 'V53', 'V27', 'V30', 'V50', 'V58',\
  \ 'V46', \n'V56', 'V28', 'V39' \n```\n\n图 4.7 展示了 LARS 算法生成的系数曲线。它们在特性上类似于您在葡萄酒口感预测问题中看到的曲线。然而，曲线更多，因为岩石与地雷数据集拥有更多属性。（岩石与地雷数据有\
  \ `60` 个属性和 `208` 行数据。）根据 第 3 章 的讨论，您可能会预期最优解不会使用所有属性。您将在 第 5 章 中看到这种权衡的结果，该章重点介绍此问题及其他问题的解决方案，以及不同方法之间的比较。\n\
  \n![图 4.7：通过转换标签求解的岩石与地雷分类问题的系数曲线](img/c04f007.png)\n\n\n\n**图 4.7**：通过转换为标签求解的岩石与地雷分类问题的系数曲线\n\
  \n另一种方法是从问题中两种结果的可能性角度来构建问题。这将引出所谓的*逻辑回归*。`glmnet` 算法可以置于该框架中，Friedman 的原始论文详细阐述了\
  \ `glmnet` 的逻辑回归版本及其向多类问题（具有两个以上离散结果的问题）的扩展。你将在第 5 章中看到该算法二分类和多分类版本的应用。\n\n####\
  \ 处理具有两个以上结果的分类问题\n\n某些问题需要在多个备选方案中做出决定。例如，假设你向网站访问者展示多个链接。访问者可能会点击任意一个链接，点击返回按钮，或完全退出网站。存在多个备选方案，它们不像整数葡萄酒口味评分那样有序。4\
  \ 分的口味评分自然位于 3 分和 5 分之间，如果改变某个属性（如酒精度）使评分从 3 变为 4，进一步改变该属性似乎很可能使评分继续沿同一方向变化。而网站访问者采取的替代行为没有这种顺序。这被称为多分类问题。\n\
  \n你总是可以使用二分类算法来处理多分类问题。该技术称为*一对其余*或*一对其他*，名称暗示了该方法的工作原理。基本上，你将多分类问题构建为若干个二分类问题。对于该示例，你可以预测访问者是离开网站还是选择其他选项。另一个二分类问题是预测用户是点击返回按钮还是采取其他可用选项。你最终将得到与备选结果数量相同的二分类问题。所有二分类器都给出数值，如清单\
  \ 4.4 中的 LARS 分类器。具有最大一对其余值的结果即为胜出者。第 5 章针对玻璃数据集实现了此方法，该数据集有六种不同的可能结果。\n\n#### 理解基扩展：在非线性问题上使用线性方法\n\
  \n从本质上讲，线性方法假设分类和回归预测可以表示为设计者可用属性的线性组合。如果你有理由怀疑线性模型不够用怎么办？你可以通过所谓的基扩展，让线性模型处理强非线性。基扩展背后的基本思想是，你问题中的非线性可以用属性的多项式（或属性的其他非线性函数之和）来近似；然后你可以添加原始属性幂次的属性，让线性方法确定多项式的最佳系数集。\n\
  \n要具体了解其工作原理，请查看清单 4.5 中的代码。清单 4.5 从葡萄酒口味数据集开始。如果你记得的话，本章前面生成的线性模型都发现酒精度是决定葡萄酒口味的最重要属性。你可能会想到这种关系可能不是一条直线，而是在酒精度非常高和非常低时会趋于平缓。\n\
  \n清单 4.5 展示了如何验证这一想法。\n\n##### 清单 4.5：葡萄酒口味预测的基扩展——wineBasisExpansion.py\n\n```\n\
  __author__ = 'mike-bowles'\n\nfrom Read_Fcns import list_read_wine\nimport matplotlib.pyplot\
  \ as plt\nfrom math import sqrt, cos, log\n\n#read wine data\nnames, xList, labels\
  \ = list_read_wine()\n\n#extend the alcohol variable - the last column in that attribute\
  \ matrix\nxExtended = []\nalchCol = len(xList[1])\n\n\nfor row in xList:\n    newRow\
  \ = list(row)\n    alch = row[alchCol - 1]\n    newRow.append((alch - 7) * (alch\
  \ - 7)/10)\n    newRow.append(5 * log(alch - 7))\n    newRow.append(cos(alch))\n\
  \    xExtended.append(newRow)\n\nnrow = len(xList)\nv1 = [xExtended[j][alchCol -\
  \ 1] for j in range(nrow)]\n\nfor i in range(4):\n    v2 = [xExtended[j][alchCol\
  \ - 1 + i] for j in range(nrow)]\n    plt.scatter(v1,v2)\n\nplt.xlabel(\"Alcohol\"\
  )\nplt.ylabel((\"Extension Functions of Alcohol\"))\nplt.show()\n```\n\n代码像以前一样读取数据。在读取数据之后（并在归一化之前），代码遍历读取的数据行，向行中添加几个新元素，然后将新的扩展行追加到一组新属性中。追加的新元素都是原始数据中酒精度属性的函数。例如，第一个新属性是\
  \ `((alch - 7) * (alch - 7)/10)`，其中 `alch` 是该行的酒精度。引入常数 `7` 和 `10` 是为了让生成的新属性都能在一张图上漂亮地绘制。基本上，新属性是酒精度的平方。\n\
  \n该过程的下一步是获取扩展后的属性集，并使用本章已开发的工具（或其他可用的构建线性模型的方法）构建线性模型。无论使用哪种算法构建线性模型，该模型都将包含每个属性（包括新属性）的乘数（或系数）。如果扩展中使用的函数都是原始变量的幂次，则线性模型会产生原始变量多项式函数的系数。通过为扩展选择不同的函数，可以构建其他函数序列。\n\
  \n图 4.8 说明了新属性（和原始属性）对原始属性的函数依赖关系。你可以看到扩展中所选函数的平方、对数和正弦行为。\n\n![图 4.8：生成用于扩展葡萄酒属性会话的函数](img/c04f008.png)\n\
  \n**图 4.8**：生成用于扩展葡萄酒属性会话的函数\n\n#### 将非数值属性纳入线性方法\n\n\n\n\n##### 带分类变量的惩罚线性回归\n\n\
  惩罚线性回归（以及其他线性方法）要求属性为数值型。如果你的问题包含一些非数值属性（也称为分类或因子属性）该怎么办？一个常见的例子是性别属性，其可能取值为男性和女性。将分类变量转换为数值型的标准方法是将它们编码为几个新的属性数据列。如果一个属性有\
  \ `N` 个可能的值，它将按如下方式编码为 `N - 1` 个新的数据列。用 `N - 1` 个数据列分别对应 `N` 个属性中的 `N - 1` 个。在每一行中，如果该行取分类变量的第\
  \ `i` 个可能值，则在第 `i` 列输入 `1`。其他列填入零。如果该行取分类变量的第 `N` 个值，则所有条目均为零。\n\n###### 代码清单 4.6：为惩罚线性回归编码分类变量——鲍鱼数据——larsAbalone.py\n\
  \n```python\n__author__ = 'mike_bowles'\n\nfrom Read_Fcns import list_read_abalone\n\
  import matplotlib.pyplot as plt\nfrom math import sqrt\nfrom sklearn.preprocessing\
  \ import StandardScaler\n\n####### read abalone data\nxList, labels = list_read_abalone()\n\
  \nnames = ['Sex', 'Length', 'Diameter', 'Height', 'Whole weight', \\\n         'Shucked\
  \ weight', 'Viscera weight', 'Shell weight', 'Rings']\n\n####### code three-valued\
  \ sex attribute as numeric\nxCoded = []\nfor row in xList:\n    # first code the\
  \ three-valued sex variable\n    codedSex = [0.0, 0.0]\n    if row[0] == 'M': codedSex[0]\
  \ = 1.0\n    if row[0] == 'F': codedSex[1] = 1.0\n\n    numRow = [float(row[i])\
  \ for i in range(1, len(row))]\n    rowCoded = list(codedSex) + numRow\n    xCoded.append(rowCoded)\n\
  \nnamesCoded = ['Sex1', 'Sex2', 'Length', 'Diameter', 'Height', \\\n           \
  \   'Whole weight', 'Shucked weight', 'Viscera weight', 'Shell weight', \\\n   \
  \           'Rings']\n\nnrows = len(xCoded)\nncols = len(xCoded[1])\n\n####### Normalize\
  \ features (w coded 3-valued sex)\nxScaler = StandardScaler()\nxNormalized = xScaler.fit_transform(xCoded)\n\
  \n##### Normalize labels\nyScaler = StandardScaler()\nlabelNormalized = yScaler.fit_transform(np.array(labels).reshape([-1,\
  \ 1]))\n\n####### initialize matrix of betas at each step\nbetaMat = []\nbetaMat.append(list(beta))\n\
  \n####### number of steps to take\nnSteps = 500\nstepSize = 0.01\n\nbetaMat, nzList\
  \ = lars_coef_curves(xNormalized, labelNormalized, \\\n           nSteps, stepSize)\n\
  \nnameList = [namesCoded[nzList[i]] for i in range(len(nzList))]\n\nprint(nameList)\n\
  for i in range(ncols):\n    # plot range of beta values for each attribute\n   \
  \ coefCurve = betaMat[i,:].reshape([-1,])\n    xaxis = range(nSteps)\n    plt.plot(xaxis,\
  \ coefCurve)\n\nplt.xlabel(\"Steps Taken\")\nplt.ylabel((\"Coefficient Values\"\
  ))\nplt.savefig('larsAbalone.png', dpi=500)\nplt.show()\n\nPrinted Output:\n['Shell\
  \ weight', 'Height', 'Sex2', 'Shucked weight', 'Diameter', 'Sex1',\n 'Whole weight',\
  \ 'Viscera weight']\n```\n\n第一个属性是鲍鱼的性别，取三个值。当鲍鱼处于幼年期时，其性别无法确定，因此第一列的条目为 `M`、`F`\
  \ 和 `I`。\n\n与各列关联的变量名显示在一个名为 `names` 的 Python 列表中。对于鲍鱼数据集，这些名称并非来自数据的第一行，而是来自 UC\
  \ Irvine 网站上的一个单独文件。列表中的第一个变量是 `Sex`——动物的性别。列表中的最后一个变量是 `Rings`。这些是贝壳环，通过切开贝壳并在显微镜下数环来计数。环的数量本质上代表了鲍鱼的年龄。该问题的目标是训练一个回归系统，利用更容易、更省时且成本更低的测量值来预测\
  \ `Rings`。\n\n`Sex` 属性的编码是在属性矩阵归一化之前完成的。该过程是构建两列来表示三个可能的值。构建的逻辑是：如果对应行来自雄性（`M`），则第一列为\
  \ `1`，否则为零。第二列对雌性（`F`）为 `1`。如果样本是幼体（`I`），则两列均为零。替换 `Sex` 的新列被命名为 `Sex1` 和 `Sex2`。\n\
  \n完成此编码后，属性矩阵便包含全数值，随后的示例流程与前面的示例相同。它将变量归一化为零均值和单位标准差，然后应用前面介绍的 `LARS` 算法来生成系数曲线。打印输出显示了变量进入惩罚线性回归解的顺序。你会观察到，编码\
  \ `Sex` 的两列均出现在解中。\n\n图 4.9 显示了将 `LARS` 应用于此问题所得的系数曲线。第 5 章将深入探讨针对该问题的不同方法的性能表现。\n\
  \n![图 4.9：在编码分类变量的鲍鱼数据上训练 LARS 得到的系数曲线](img/c04f009.png)\n\n**图 4.9**：在编码分类变量的鲍鱼数据上训练\
  \ LARS 得到的系数曲线\n\n本节讨论了惩罚回归的几种扩展，拓宽了其效用范围，可涵盖广泛的问题类别。本节描述了一种简单且经常有效的方法，将分类问题转化为普通回归问题。还讨论了如何将二分类器转化为多分类器。接着讨论了如何通过添加作为旧属性非线性函数的新属性，利用线性回归对非线性行为进行建模。最后，本节展示了如何将分类变量转化为实值变量，以便在分类变量上训练线性算法。这种转换分类变量的方法不仅适用于线性回归，对其他线性方法（如支持向量机）也很有用。\n\
  \n## 总结\n\n\n\n\n\n## Chapter Objectives\n\nThis chapter aims to lay the foundation\
  \ for you to confidently understand and use the Python packages that implement the\
  \ algorithms described here. The chapter characterizes the nature of the input data\
  \ set as: a column vector of outcomes to be predicted, and a table of attributes\
  \ for prediction. Chapter 3 demonstrated that predictive models need to adjust their\
  \ complexity to achieve optimal performance for a given problem complexity and data\
  \ set size. Chapter 3 also showed some ways to introduce tuning parameters into\
  \ linear regression. This chapter builds on that context by introducing several\
  \ minimization problems in which a tunable coefficient penalty is added to the error\
  \ penalty of least squares regression. As demonstrated, this tunable penalty on\
  \ the magnitude of linear coefficients suppresses coefficients to a greater or lesser\
  \ extent, thereby adding complexity adjustment. You saw how to use error on out-of-sample\
  \ data to tune the complexity of the generated model to achieve optimal performance.\n\
  \nThe chapter describes the workings of two modern algorithms for solving penalized\
  \ regression minimization problems, and the Python code implementing the main features\
  \ of these algorithms, so that you have concrete instances of the algorithmic cores\
  \ to make the workings clearer. The ordinary regression problem (numeric features\
  \ and numeric target) serves as the exemplar for in-depth coverage of the algorithms.\
  \ The chapter shows several extensions to broaden use cases to cover binary classification\
  \ problems, multi-class classification problems, problems with non-linear relationships\
  \ between attributes and outcomes, and problems containing non-numeric features.\n\
  \nChapter 5 will use the Python packages implementing these algorithms to run a\
  \ series of examples chosen to exercise a variety of different problem characteristics\
  \ to solidify these concepts. Based on what you learn in this chapter, the various\
  \ parameters and methods in the Python packages will become easy to understand.\n\
  \n## References\n\n1. Bradley Efron, Trevor Hastie, Iain Johnstone, and Robert Tibshirani\
  \ (2004). “Least Angle Regression.” *Annals of Statistics*, 32(2), 407–499.\n2.\
  \ Jerome H. Friedman, Trevor Hastie, and Rob Tibshirani (2010). “Regularization\
  \ Paths for Generalized Linear Models via Coordinate Descent.” *Journal of Statistical\
  \ Software*, vol. 33, issue 1, Feb 2010.\n\n# Chapter 5 Building Predictive Models\
  \ with Penalized Linear Methods\n\nChapter 2 looked at many different data sets\
  \ with the aim of understanding the data sets, the relationships between the various\
  \ attributes and the labels, and the nature of the problems faced. This chapter\
  \ selects those data sets again to demonstrate, through case studies, the process\
  \ of building predictive models using the penalized linear methods you saw in Chapter\
  \ 4 \"Penalized Linear Regression\". Typically, model building will be divided into\
  \ two or more parts.\n\nYou may recall from Chapter 4 that building a model using\
  \ penalized linear regression involves two steps. The first step is to run cross-validation\
  \ to determine the best achievable out-of-sample performance and identify the model\
  \ that achieves that performance. Determining achievable performance contains the\
  \ hard design work, and in many examples in this chapter, only this step is shown.\
  \ The second step is to train on the entire data set to depict the coefficient paths.\
  \ The purpose of training on the entire data set is to obtain the best estimate\
  \ of the model coefficients. But this does not change your estimate of error, which\
  \ is the measure of performance.\n\nThis chapter exercises many different types\
  \ of problems: regression problems, classification problems, problems with categorical\
  \ attributes, and problems where the label has a non-linear dependence on the attributes.\
  \ It examines basis expansions to see if they can improve predictive performance.\
  \ In each case, the goal is to complete the steps you need to take to obtain a deployable\
  \ linear model, and to consider some alternative paths to ensure you have squeezed\
  \ out all potential performance.\n\n## Python Packages for Penalized Linear Regression\n\
  \nThe examples in Chapter 4 used Python versions of the training algorithms involved:\
  \ `LARS` and Coordinate Descent with `ElasticNet` penalty. The purpose of using\
  \ Python code in Chapter 4 was to show how the algorithms work to deepen your understanding\
  \ of them. Fortunately, you do not have to rewrite these algorithms every time you\
  \ want to use them.\n\n`scikit-learn` has packages implementing `Lasso`, `LARS`,\
  \ and `ElasticNet` regression. There are several advantages to using these packages.\
  \ One is reducing the lines of code you need to write and debug. Another huge advantage\
  \ is that they are much faster than the code in Chapter 4. The `scikit-learn` packages\
  \ leverage practices such as not computing correlations for unused attributes to\
  \ reduce computation. You will find they execute very fast when running these packages.\n\
  \nYou can find the packages used in this chapter in `sklearn.linear_model`. The\
  \ link `http://scikit-learn.org/stable/modules/classes.html#module-sklearn.linear_model`\
  \ lists the models used here. Note that several models have two forms. For example,\
  \ there is both `linear_model.ElasticNet` and `linear_model.ElasticNetCV`. These\
  \ two models correspond to the two tasks discussed at the beginning of this chapter.\
  \ The Python package `linear_model.ElasticNet` is used to compute coefficient paths\
  \ on the entire data set, while `linear_model.ElasticNetCV` performs cross-validation\
  \ runs to generate out-of-sample performance estimates. Having both forms is very\
  \ convenient.\n\nThese two versions basically use the same input objects (two NumPy\
  \ arrays—one attribute array, one label array). In some cases, you cannot use the\
  \ cross-validation version because you need very specific control over the contents\
  \ of the training and test sets for each fold:\n\n*   If your problem has a categorical\
  \ attribute with a value that occurs very infrequently, you may need to control\
  \ sampling so that attribute is evenly distributed across folds.\n*   If you want\
  \ an error metric other than the *Mean Squared Error* (`MSE`) provided by the CV\
  \ packages, you may also need access to individual fold data to compile error statistics\
  \ tailored to your problem. You might prefer *Mean Absolute Error* (`MAE`) because\
  \ it better matches the penalty you will pay for errors in the real problem.\n*\
  \   Another example needing per-fold access to error statistics is using linear\
  \ regression to solve classification problems. As described in Chapter 3 \"Building\
  \ Predictive Models: Balancing Performance, Complexity, and Big Data\", standard\
  \ error metrics for classification problems include misclassification error rate\
  \ or *Area Under the ROC Curve* (`AUC`). You will see this specifically in the \"\
  Rocks vs. Mines\" and \"Glass Classification\" case studies in this chapter.\n\n\
  \n\n\n在查看这些包并开始考虑使用它们时，有几点需要注意。首先，其中一些（但并非全部）会在拟合模型前自动归一化属性。其次，scikit-learn 包对变量的命名方式与第\
  \ 4 章和 Friedman 的论文不同。第 4 章使用变量 `λ` 表示系数惩罚的乘数，用变量 `α` 表示 ElasticNet 惩罚中 Lasso 惩罚与岭惩罚的比例。scikit-learn\
  \ 包用 `α` 代替 `λ`，用 `l1_ratio` 代替 `α`。后文将采用 scikit-learn 包使用的符号表示法。\n\n## 多元回归：预测葡萄酒口感\n\
  \n正如第 2 章“通过理解数据来理解问题”所述，葡萄酒口感数据集来自 UC Irvine 数据存储库（`http://archive.ics.uci.edu/ml/datasets/Wine+Quality`）。该数据集包含\
  \ 1,599 款葡萄酒的化学分析数据，以及品酒师小组给出的平均口感评分。预测问题是根据化学成分数据预测口感。化学成分数据由 11 种不同化学属性的数值测量组成——酒精含量、pH\
  \ 值、柠檬酸等。请参阅第 2 章对这些数据的探索，或查看 UC Irvine 网站上的数据集页面以获取更多信息。\n\n预测葡萄酒口感是一个回归问题，因为目标是预测质量评分，这是一个\
  \ 0 到 10 之间的整数。数据集仅包含 3 到 8 之间的评分示例。由于仅给出整数评分，也可以将此问题视为多类分类问题。多类问题将有六种可能的分类（3 到\
  \ 8 的整数）。这将忽略不同评分之间存在的顺序关系（例如，5 分比 6 分差，比 4 分好）。回归是更自然的问题建模方式，因为它保留了顺序关系。\n\n考虑如何建模问题的另一种方式是对比回归问题与多类分类问题所附带的不同误差度量。回归误差函数是平均平方误差。当真实口感为\
  \ 3 时，预测为 5 对累积误差的贡献大于预测为 4。多类问题的误差度量是分类错误的示例数量。使用该度量时，如果真实口感为 3，预测为 5 或 4 对累积误差的贡献相同。回归似乎更自然，但我不知道有什么方法能证明它会产生更优的性能。唯一的验证方法是两者都尝试。在“多类分类：对犯罪现场玻璃样本进行分类”部分，你将看到如何处理多类分类问题。随后你可以回来尝试多类方法，看看效果是更好还是更差。你将使用什么误差度量？\n\
  \n### 构建并测试预测葡萄酒口感的模型\n\n构建模型的第一步是生成一些样本外性能指标，以查看它们是否满足性能要求。清单 5-1 展示了执行 10 折交叉验证并绘制结果的代码。`sklearn.linear_model`\
  \ 包中的 `LassoCV` 完成了将数据划分为交叉验证折、在每折的样本内数据上运行 Lasso 建模过程、在一系列权重惩罚参数（`alpha`）值上测试样本外性能的所有工作。请查阅\
  \ sklearn 文档以了解所需参数的默认值。至少你可能需要提供折数并设置 `normalize=True`。默认情况下不归一化数据。图 5.1 和 图 5.2\
  \ 分别展示了运行代码时归一化与不归一化的结果。你可以通过运行本书代码中的 Python 笔记本来自行生成这两个图形。只需在 '`normalize=True`'\
  \ 和 '`normalize=False`' 之间切换 `normalize` 参数，相应的绘图将出现在代码的结果单元格中。\n\n![图 5.1：归一化数据的样本外误差——葡萄酒口感数据上的\
  \ Lasso 模型](img/c05f001.png)\n\n**图 5.1**：归一化数据的样本外误差——葡萄酒口感数据上的 Lasso 模型\n\n![图\
  \ 5.2：未归一化数据的样本外误差——葡萄酒口感数据上的 Lasso 模型](img/c05f002.png)\n\n**图 5.2**：未归一化数据的样本外误差——葡萄酒口感数据上的\
  \ Lasso 模型\n\n#### 清单 5-1：使用交叉验证估算 Lasso 建模葡萄酒口感的样本外误差——wineLassoCV.py\n\n```\n\
  __author__ = 'mike-bowles'\n\nfrom Read_Fcns import list_read_wine\nimport numpy\n\
  from sklearn import datasets, linear_model\nfrom sklearn.linear_model import LassoCV\n\
  from math import sqrt\nimport matplotlib.pyplot as plt\n  \n#read data into iterable\n\
  names, xList, labels = list_read_wine()\n\n#Use LassoCV class from sklearn.linear_model\n\
  #sklearn lasso class includes a normalization option, so \n#normalization isn't\
  \ required\n#to get the unnormalized version of the curves just change\n#normalize=True\
  \ to normalize=False\nwineModel = LassoCV(cv=10, normalize=True).fit(xList, labels)\n\
  \n##### Display results\nplt.figure()\nplt.plot(wineModel.alphas_, wineModel.mse_path_,\
  \ ':')\nplt.plot(wineModel.alphas_, wineModel.mse_path_.mean(axis=-1), \n      \
  \   label='Average MSE Across Folds', linewidth=2)\nplt.axvline(wineModel.alpha_,\
  \ linestyle='--', \n        label='CV Estimate of Best alpha')\nplt.semilogx()\n\
  plt.legend()\nax = plt.gca()\nax.invert_xaxis()\nplt.xlabel('alpha')\nplt.ylabel('Mean\
  \ Square Error')\nplt.axis('tight')\n#plt.savefig('wineLassoCVNormalized.png', dpi=500)\n\
  plt.show()\n\n#print out the value of alpha that minimizes the Cv-error\nprint(\"\
  alpha Value that Minimizes CV Error\", wineModel.alpha_)\nprint(\"Minimum MSE  \"\
  , min(wineModel.mse_path_.mean(axis=-1)))\nPrinted Output:\n\nNormalized Version:\n\
  alpha Value that Minimizes CV Error 0.00029358033516\nMinimum MSE   0.4339376197674394\n\
  \nUnnormalized Version:\nalpha Value that Minimizes CV Error  0.0052692947038\n\
  Minimum MSE   0.4393606730929137 \n```\n\n清单 5-1 中的性能指标显示，如果数据保持未归一化状态，性能会略微下降。然而，图\
  \ 5.2 中 CV 误差与 `alpha` 的关系图与图 5.1 有着根本不同。该图呈现波浪状特征，这是由于保持 X 未缩放导致的尺度混杂引起的。发生的情况是：算法选取了一个需要相应小系数的大变量。如果该变量与\
  \ Y 高度相关，或者该变量与 Y 相关性低但尺度大，就会出现这种情况。算法会使用一个略微劣质的变量进行几次迭代，直到 `α`（以前称为 `λ`）变得足够小以允许更好的变量进入，此时误差会急剧下降。这说明应归一化\
  \ X，或者对不归一化保持警惕。这样能获得更好的模型。\n\n### 部署前在完整数据集上训练\n\n\n\n清单 5-2 展示了在整个数据集上训练的代码。如前所述，在整个数据集上训练的原因是为了获得用于部署的最佳系数集。交叉验证给出了部署模型性能的估计，并提供了产生最佳性能的\
  \ α 值。清单 5-2 中的程序做两件事。它在归一化数据上训练模型，以便可视化系数曲线并评估变量重要性。变量重要性使用应用于归一化数据的系数来确定哪些变量最重要。但您可能希望拥有可以直接应用于自然状态数据的系数。这正是在清单末尾调用的\
  \ Lasso 包内部完成归一化时所得到的结果。Lasso 包与大多数其他惩罚回归包一样，将接受具有自然缩放的数据。如果您采用该包的归一化数据选项，该包将在内部对数据进行归一化并计算系数。然后，它将把系数转换回您应用于未归一化数据所需的形式。您将在清单末尾看到这些系数。相对于归一化数据的系数曲线如图\
  \ 5.3 所示。\n\n#### 清单 5-2：在完整数据集上进行 Lasso 训练——wineLassoCoefCurves.py\n\n```\n__author__\
  \ = 'mike-bowles'\n\nfrom Read_Fcns import list_read_wine\nimport numpy as np\n\
  from sklearn import datasets, linear_model\nfrom sklearn.linear_model import LassoCV,\
  \ lasso_path, Lasso\nfrom sklearn.preprocessing import StandardScaler\nfrom math\
  \ import sqrt\nimport matplotlib.pyplot as plt\n\n#read data \nnames, xList, labels\
  \ = list_read_wine()\n\n#First let's see the coefficient curves for the full data\
  \ set and get a\n#feel for variable importance\n#For variable importance you'll\
  \ need to normalize the variables before\n#fitting otherwise the models will \n\
  #return coefficients relative to full scale variables which is what you\n#need for\
  \ applying the model\n#but to determine importance you need coefficients on normalized\n\
  #features. \n#lasso_path doesn't have a built-in normalize option\nalphas, coefs,\
  \ _  = lasso_path(StandardScaler().fit_transform(xList), \n        labels,  return_models=False)\n\
  \nplt.xlabel('alpha')\nplt.ylabel('Coefficients')\nplt.semilogx(alphas,coefs.T)\n\
  plt.axis('tight')\nax = plt.gca()\nax.invert_xaxis()\nplt.savefig('wineLassoCoefCurves.png',\
  \ dpi=500)\nplt.show()\nnattr, nalpha = coefs.shape\n\n#find coefficient ordering\n\
  nzList = []\nfor iAlpha in range(1,nalpha):\n    coefList = list(coefs[: ,iAlpha])\n\
  \    nzCoef = [index for index in range(nattr) if coefList[index] \n         !=\
  \ 0.0]\n    for q in nzCoef:\n        if not(q in nzList):\n            nzList.append(q)\n\
  \nprint(\"Features Ordered by How Early They Enter the model:\")\n_ = [print(names[nzList[i]])\
  \ for i in range(len(nzList))]\n\n\n#find coefficients corresponding to best alpha\
  \ value = 0.00029358033\nalphaStar = 0.00029358033516075065\nindexLTalphaStar =\
  \ [index for index in range(100) if alphas[index] >\n       alphaStar]\nindexStar\
  \ = max(indexLTalphaStar)\n\n#here's the set of coefficients to deploy\ncoefStar\
  \ = list(coefs[:,indexStar])\n\n##### The coefficients on normalized attributes\
  \ give another slightly \n##### different ordering\nabsCoef = [abs(a) for a in coefStar]\n\
  \n#sort by magnitude\ncoefSorted = sorted(absCoef, reverse=True)\n\nidxCoefSize\
  \ = [absCoef.index(a) for a in coefSorted if not(a == 0.0)]\n\nprint('\\nFeatures\
  \ ordered by coefficient size on normalized features:')\n_ = [print(names[idxCoefSize[i]])\
  \ for i in range(len(idxCoefSize))]\n \n  \nlasso_model = linear_model.Lasso(alpha=0.00029358033516075065,\
  \ \n       normalize=True)\nlasso_model.fit(xList, labels)\n\nprint('\\nCoefficient\
  \ relative to natural features (from model trained\n      on normalized features)')\n\
  _ = [ print(a, '\\t', b) for (a,b) in zip(names, lasso_model.coef_)]\n\n打印输出：\n\
  Features Ordered by How Early They Enter the Model:\n\"alcohol\"\n\"volatile acidity\"\
  \n\"sulphates\"\n\"total sulfur dioxide\"\n\"chlorides\"\n\"fixed acidity\"\n\"\
  pH\"\n\"free sulfur dioxide\"\n\"residual sugar\"\n\"citric acid\"\n\"density\"\n\
  \nFeatures ordered by coefficient size on normalized features:\n\"alcohol\"\n\"\
  volatile acidity\"\n\"sulphates\"\n\"total sulfur dioxide\"\n\"chlorides\"\n\"pH\"\
  \n\"free sulfur dioxide\"\n\"fixed acidity\"\n\"citric acid\"\n\"density\"\n\"residual\
  \ sugar\"\n\nCoefficient relative to natural features (from model trained on\nnormalized\
  \ features)\n\"fixed acidity\"             0.0\n\"volatile acidity\"         -1.0281352611594459\n\
  \"citric acid\"              -0.0\n\"residual sugar\"            0.0\n\"chlorides\"\
  \                -1.5880563981842544\n\"free sulfur dioxide\"       0.0014678661905409881\n\
  \"total sulfur dioxide\"     -0.002355585750391008\n\"density\"                \
  \  -0.0\n\"pH\"                       -0.3458236199282011\n\"sulphates\"       \
  \          0.7946569090063523\n\"alcohol\"                   0.28388450021384204\
  \ \n```\n\n![图 5.3：用于预测葡萄酒质量的 Lasso 训练系数曲线](img/c05f003.png)\n\n**图 5.3**：用于预测葡萄酒质量的\
  \ Lasso 训练系数曲线\n\n清单 5-2 中的打印输出展示了以两种不同方式计算的变量重要性。一种方法是根据变量在 α 减小时变为非零的早晚顺序对变量进行排序。这仅在归一化数据时才有意义。第一个获得非零系数的变量最重要，第二个次之，依此类推。您将在清单\
  \ 5-2 的打印输出中看到按该顺序列出的变量。确定变量重要性的第二种方法是查看在交叉验证中产生最佳性能的 α 值处系数的大小。同样，这种排序仅在变量归一化时才有意义。该列表也显示在清单\
  \ 5-2 的打印输出中。通常，这两种方法在最重要的变量及其排序上是一致的。这两种方法在某些不太重要的变量上存在分歧。这是正常的。列表越往后，重要性排名越不稳定。由于所有变量最终都会进入模型，第一种方法给所有变量都提供了排名。第二种方法使用最佳\
  \ α 值处的系数，这意味着某些系数可能为零。\n\n排序中有一个有趣的怪癖。您会看到 `fixed acidity` 在由系数值生成的列表中排在倒数第四位，并且从系数值可以看出，`fixed\
  \ acidity` 在交叉验证选择的模型中系数为 `0.0`。但根据那种重要性度量，`fixed acidity` 排在倒数第六位。仔细观察系数曲线。您会看到\
  \ `fixed acidity` 的系数曾短暂地变为非零。正如您在系数图中所见，它是第六个这样做的变量。但它又回归到零，并在最佳系数集中被另一个变量 `free\
  \ sulphur dioxide` 取代。要看到这种级别的细节，最好在 Jupyter 笔记本中运行该程序，您可以从本书的代码页面获取。它会将图像存储为高分辨率\
  \ PNG 文件，您可以将其放大以查看细节。\n\n\n\n程序硬编码了在交叉验证中产生最佳结果的 α 值。代码中的版本是使用归一化属性和标签训练出的最佳 alpha。将其中任意一个改为非归一化都会改变相应的最佳\
  \ α 值。将 Y 改为非归一化会使其按 1.2 的因子变化，该因子源于将标准差归一化为 1.0（如前文在归一化与非归一化标签的 MSE 差异背景下所讨论的）。硬编码的\
  \ α 值用于识别对应于最佳交叉验证结果的系数向量。\n\n### 基展开：通过从旧变量创建新变量来提升性能\n\n第 4 章 讨论了以旧属性函数的形式添加新属性。这样做的目的是查看是否能提升性能。清单\
  \ 5-3 展示了如何向葡萄酒数据中添加两个新属性。\n\n#### 清单 5-3：使用样本外误差评估预测葡萄酒质量的新属性——wineExpandedLassoCV.py\n\
  \n```\n__author__ = 'mike-bowles'\n\nfrom Read_Fcns import list_read_wine\nimport\
  \ numpy as np\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn import\
  \ datasets, linear_model\nfrom sklearn.linear_model import LassoCV\nfrom math import\
  \ sqrt\nimport matplotlib.pyplot as plt\n\n##### read data into iterable\nnames,\
  \ xList, labels = list_read_wine()\n\n##### append two new attributes - square of\
  \ last term (alcohol) and product\n##### of alcohol and volatile acidity\nfor i\
  \ in range(len(xList)):\n    alcElt = xList[i][-1]\n    volAcid = xList[i][1]\n\
  \    temp = list(xList[i])\n    temp.append(alcElt*alcElt)\n    temp.append(alcElt*volAcid)\n\
  \    xList[i] = list(temp)\n\n##### check the new dimensions\nprint('New number\
  \ of attributes   ', len(xList[0]))\n\n#add new names to variable list\nnames.append(\"\
  alco²\")\nnames.append(\"alco*volAcid\")\n  \n##### Normalize columns in x and labels\n\
  ##### Note: be careful about normalization.  Some penalized regression \n##### packages\
  \ include it\n##### and some don't.\n\nxScaler = StandardScaler()\nxNormalized =\
  \ xScaler.fit_transform(xList)\n\n##### Normalize labels\nyScaler = StandardScaler()\n\
  yNormalized = yScaler.fit_transform(np.array(labels).reshape([\n         -1,1])).reshape([-1])\n\
  \n#normalized lables\nY = np.array(yNormalized)\n\n#Normalized Xs\nX = np.array(xNormalized)\n\
  \n#Call LassoCV from sklearn.linear_model\nwineModel = LassoCV(cv=10).fit(X, Y)\n\
  \n##### Display results\n\nplt.figure()\nplt.plot(wineModel.alphas_, wineModel.mse_path_,\
  \ ':')\nplt.plot(wineModel.alphas_, wineModel.mse_path_.mean(axis=-1),\n       \
  \  label='Average MSE Across Folds', linewidth=2)\nplt.axvline(wineModel.alpha_,\
  \ linestyle='--',\n            label='CV Estimate of Best alpha')\nplt.semilogx()\n\
  plt.legend()\nax = plt.gca()\nax.invert_xaxis()\nplt.xlabel('alpha')\nplt.ylabel('Mean\
  \ Square Error')\nplt.axis('tight')\nplt.savefig('wineExpandedLassoCV.png', dpi=500)\n\
  plt.show()\n\n#print out the value of alpha that minimizes the Cv-error\nprint(\"\
  alpha Value that Minimizes CV Error  \",wineModel.alpha_)\nprint(\"Minimum MSE \
  \ \", min(wineModel.mse_path_.mean(axis=-1)))\n\nPrinted Output:\nNew number of\
  \ attributes    13\n\nalpha Value that Minimizes CV Error   0.020612103466917726\n\
  Minimum MSE   0.6666999823938234 \n```\n\n关键步骤发生在读取属性并将其转换为浮点数之后。十几行代码获取每一行属性，提取出对应酒精度和挥发性酸度度量的两个变量，然后追加*酒精度的平方*和*酒精度乘以挥发性酸度的乘积*。之所以选择这些变量，是因为从在解中更重要的变量入手是合理的。彻底寻找可能的改进可能包括多次尝试顶层变量的组合。\n\
  \n结果表明，添加这些新变量略微降低了性能。稍微搜索一下可能会合成出一些能产生有用差异的新变量。你可以为这个例子绘制系数曲线，看看新变量是否在最优解中替换了任何重要的旧变量。该信息可能会引导你用这些新的合成变量代替旧变量。\n\
  \n图 5.4 显示了使用扩展属性集训练的 Lasso 的交叉验证误差曲线。交叉验证曲线的特性与未进行基展开时的曲线没有实质性差异。\n\n![图 5.4：使用扩展特征集在葡萄酒质量数据上训练的\
  \ Lasso 交叉验证误差曲线](img/c05f004.png)\n\n**图 5.4**：使用扩展特征集在葡萄酒质量数据上训练的 Lasso 交叉验证误差曲线\n\
  \n本节演示了在结果为实数的问题（回归问题）上使用惩罚回归方法。下一节展示在结果为双值的问题上使用惩罚线性回归方法。代码将类似于本节所见，一些技术（如基展开）可用于分类问题。主要区别在于分类问题的性能评分方式。\n\
  \n## 二分类：使用惩罚线性回归检测未爆地雷\n\n第 4 章 讨论了如何将惩罚线性回归用于分类问题，并为岩石与地雷问题建立了流程。本节详细介绍了如何使用惩罚线性回归方法解决二分类问题。本节结合了\
  \ Python 的 `ElasticNet` 包。你可能还记得在 第 4 章 中，`ElasticNet` 包含一个更通用的惩罚函数，该函数将 Lasso 和岭回归惩罚函数作为特例。这使得可以观察分类器性能如何随惩罚函数的变化而变化。解决问题的步骤如下：\n\
  \n1.  将二分类问题转化为回归问题。通过在类别结果取两个值之一时分配 0.0，取另一个值时分配 1.0，构建一个实数标签的结果向量。\n\n2.  执行交叉验证。交叉验证变得稍微复杂一些，因为你需要为每一折计算一个误差量。Scikit-learn\
  \ 有一些方便的工具来简化这些计算。\n\n第一步（在 第 4 章 中概述）是通过用实数标签替换分类标签，将二分类问题转化为回归问题。岩石与地雷问题本质上是利用声纳建立一个系统来检测海底的未爆地雷。你可能还记得在\
  \ 第 2 章 的数据探索中，该数据集包含从岩石和金属圆柱体（形状像地雷）返回的信号的数字化版本。目标是建立一个预测系统，能够处理数字化信号，正确识别物体是岩石还是地雷。数据集包含\
  \ 208 个实验。其中 111 个是地雷，97 个是岩石。数据集宽 60 列。前 60 列包含数字化的声纳回波。最后一列包含 M 或 R，取决于物体是岩石还是地雷。这\
  \ 60 列数字是该问题的属性。回归问题也需要数字标签。第 4 章 中概述的一种方法是通过给两种情况中的一种分配数字 1，另一种分配 0 来构建数字标签列。清单\
  \ 5-4 初始化一个名为 `labels` 的空列表，并为每一行 M 追加 1.0，为每一行 R 追加 0.0。\n\n\n\n### 使用弹性网络回归构建二分类分类器\n\
  \n已具备数值型属性和数值型标签，一切就绪，可使用惩罚线性回归的回归版本。下一步是执行交叉验证，以估计样本外性能并确定惩罚参数 α 的最佳值。对于该问题，交叉验证需要构建一个交叉验证循环来包裹训练和测试过程。为什么要构建交叉验证循环，而不是使用\
  \ Python 中可用的交叉验证包（如本章前面葡萄酒质量示例中使用的那个）？\n\n回归的交叉验证基于 MSE（均方误差）。这对于回归问题完全合理，但不适用于分类问题。正如第\
  \ 3 章所述，分类问题的性能表征方式与回归问题不同。第 3 章讨论了多种表征性能的方法。一种自然的方式是测量误分类样本的百分比。另一种方式是测量 AUC（曲线下面积）。请参阅第\
  \ 3 章或维基百科页面 `http://en.wikipedia.org/wiki/Receiver_operating_characteristic` 以复习\
  \ AUC 度量。测量这两者中的任一指标都要求你能访问每个交叉验证折叠中的预测值和标签。你无法仅凭折叠的 MSE 摘要来判断误分类误差。\n\n交叉验证循环将数据分割为训练集和测试集，然后调用\
  \ Python 的 `enet_path` 方法在训练部分数据上完成训练。有两个输入参数不同于默认值。一个是 `l1_ratio`，设置为 `0.8`。该参数决定惩罚中系数绝对值之和所占的比例。值\
  \ 0.8 意味着惩罚函数由 80% 的绝对值之和和 20% 的平方和组成。另一个非默认参数是 `fit_intercept`，设置为 `False`。代码使用了归一化的标签和归一化的属性。因为这些均为零均值，所以无需计算截距项。仅当属性和标签之间存在常数偏移时才需要截距。通过使用归一化标签消除对截距项的需求，使预测计算更简洁。归一化标签的唯一缺点是使\
  \ MSE 计算相对于回归问题不那么有意义，但对于分类问题，反正也不会使用该性能指标。\n\n在每个折叠中，训练完成后，生成的系数用于为该折叠的样本外数据生成预测。代码通过\
  \ `numpy.dot` 函数、该折叠的样本外属性数据和该折叠的系数来实现。两个 NumPy 数组的类矩阵乘法产生另一个二维数组，其行对应该折叠样本外测试数据的行，列对应\
  \ `enet_path` 生成的模型序列（即系数向量序列和对应的 α 序列）。这些每个折叠的预测矩阵被拼接在一起（想象将它们垂直堆叠），样本外标签也是如此。然后，在运行结束时，这些逐折叠的样本外结果汇总可以轻松高效地处理，以生成每个模型的性能数据并选择用于部署的模型复杂度（α）。\n\
  \nListing 5-4 使用两个指标生成比较。第一个是误分类误差。第二个是*接收者操作特征曲线*（ROC）下面积。预测矩阵的每一列代表针对一组模型系数的全部样本外数据生成的预测。由于每一行在且仅在一个折叠中被保留，因此所有数据都在每一列中得到体现。误分类比较逐列考虑预测数据和逐折叠累积的样本外标签（代码中称为\
  \ `yOut`）。将每个预测与固定阈值（本例中为 0.0）比较以确定预测分类。然后将预测分类与 `yOut` 中对应的条目比较，以判断预测分类是否正确。\n\n\
  #### Listing 5-4：使用弹性网络回归构建二分类（两类）分类器——rocksVMinesENetRegCV.py\n\n\n\n\n> ```\n\
  > __author__ = 'mike_bowles'\n> \n> from Read_Fcns import list_read_rvm\n> from\
  \ math import sqrt, fabs, exp\n> import matplotlib.pyplot as plt\n> from sklearn.preprocessing\
  \ import StandardScaler\n> from sklearn.linear_model import enet_path\n> from sklearn.metrics\
  \ import roc_auc_score, roc_curve\n> import numpy as np\n> \n> # 从 UCI 数据仓库读取数据\n\
  > xNum, labels = list_read_rvm()\n> \n> # x 矩阵的行数和列数\n> nrow = len(xNum)\n> ncol\
  \ = len(xNum[1])\n> \n> # 使用 StandardScaler 归一化数据\n> xScaler = StandardScaler()\n\
  > xNormalized = xScaler.fit_transform(xNum)\n> \n> yScaler = StandardScaler()\n\
  > labelsNormalized = yScaler.fit_transform(np.array(labels).\n> reshape([-1, 1])).reshape([-1])\n\
  > \n> # 交叉验证折数\n> nxval = 10\n> \n> \n> for ixval in range(nxval):\n>     # 定义测试集和训练集索引集合\n\
  >     idxTest = [a for a in range(nrow) if a%nxval == ixval%nxval]\n>     idxTrain\
  \ = [a for a in range(nrow) if a%nxval != ixval%nxval]\n> \n>     # 定义测试集和训练集的属性与标签集合\n\
  >     xTrain = numpy.array([xNormalized[r] for r in idxTrain])\n>     xTest = numpy.array([xNormalized[r]\
  \ for r in idxTest]) \n>     labelTrain = numpy.array([labelsNormalized[r] for r\
  \ in idxTrain])\n>     labelTest = numpy.array([labelsNormalized[r] for r in idxTest])\n\
  > \n>     alphas, coefs, _ = enet_path(xTrain, labelTrain, l1_ratio=0.8,\n> fit_intercept=False,\
  \ return_models=False)\n> \n>     # 将系数应用于测试数据以生成预测并累积\n>     if ixval == 0:\n>\
  \         pred = numpy.dot(xTest, coefs)\n>         yOut = labelTest\n>     else:\n\
  >         # 累积预测结果\n>         yTemp = numpy.array(yOut)\n>         yOut = numpy.concatenate((yTemp,\
  \ labelTest), axis=0)\n> \n>         # 累积预测结果\n>         predTemp = numpy.array(pred)\n\
  >         pred = numpy.concatenate((predTemp, numpy.dot(xTest, coefs)),\n> axis\
  \ = 0)\n> \n> \n> # 计算误分类错误率\n> misClassRate = []\n> _, nPred = pred.shape\n> for\
  \ iPred in range(1, nPred):\n>     predList = list(pred[:, iPred])\n>     errCnt\
  \ = 0.0\n>     for irow in range(nrow):\n>         if (predList[irow] = 0.0) and\
  \ (yOut[irow] >= 0.0):\n>             errCnt += 1.0\n>         elif (predList[irow]\
  \ >= 0.0) and (yOut[irow] < 0.0):\n>             errCnt += 1.0\n>     misClassRate.append(errCnt/nrow)\n\
  > \n> # 寻找用于绘图和打印的最小值点\n> minError = min(misClassRate)\n> idxMin = misClassRate.index(minError)\n\
  > pltAlphas = list(alphas[1:len(alphas)])\n> \n> plt.figure()\n> plt.plot(plotAlphas,\
  \ misClassRate, label='Misclassification Error Across\n> Folds', linewidth=2)\n\
  > plt.axvline(plotAlphas[idxMin], linestyle='--',\n>             label='CV Estimate\
  \ of Best alpha')\n> plt.legend()\n> plt.semilogx()\n> ax = plt.gca()\n> ax.invert_xaxis()\n\
  > plt.xlabel('alpha')\n> plt.ylabel('Misclassification Error') \n> plt.axis('tight')\n\
  > plt.show()\n> \n> # 计算 AUC。\n> idxPos = [i for i in range(nrow) if yOut[i] > 0.0]\n\
  > yOutBin = [0] * nrow\n> for i in idxPos: yOutBin[i] = 1\n> \n> auc = []\n> for\
  \ iPred in range(1, nPred):\n>     predList = list(pred[:, iPred])\n>     aucCalc\
  \ = roc_auc_score(yOutBin, predList)\n>     auc.append(aucCalc)\n> \n> maxAUC =\
  \ max(auc)\n> idxMax = auc.index(maxAUC)\n> \n> plt.figure()\n> plt.plot(plotAlphas,\
  \ auc, label='AUC Across Folds', linewidth=2)\n> plt.axvline(plotAlphas[idxMax],\
