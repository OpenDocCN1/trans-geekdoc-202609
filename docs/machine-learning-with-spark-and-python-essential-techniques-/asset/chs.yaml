  \ *第 35 届国际超大型数据库会议论文集*。检索自 `http://research.google.com/pubs/pub36296.html`。\n\n\
  2.  Leo Breiman. (1994 年 9 月). \"Bagging Predictors.\" *技术报告第 421 号*。加州大学伯克利分校统计系。检索自\
  \ `http://statistics.berkeley.edu/sites/default/files/tech-reports/421.pdf`。\n\n\
  3.  Leo Breiman. (2001). \"Random Forests. *Machine Learning*,\" *45*:5–32. 检索自\
  \ `https://www.stat.berkeley.edu/~breiman/randomforest2001.pdf`。\n\n4.  J.H. Friedman.\
  \ (2001). \"Greedy Function Approximation: A Gradient Boosting Machine.\" *Annals\
  \ of Statistics*, *29*(5):1189–1232. 检索自 `http://statweb.stanford.edu/~jhf/ftp/trebst.pdf`。\n\
  \n5.  J.H. Friedman. (2002). \"Stochastic Gradient Boosting.\" *Computational Statistics\
  \ and Data Analysis*, *38*(4):367–378. 检索自 `http://statweb.stanford.edu/~jhf/ftp/stobst.pdf`。\n\
  \n# 第 7 章：使用 Python 构建集成模型\n\n本章使用多个可用的 Python 包来构建预测模型，采用的是你在第 6 章“集成方法”中看到的集成算法。用于说明这些算法的问题在第\
  \ 2 章“通过理解数据来理解问题”中已介绍。你在第 5 章“使用惩罚线性方法构建预测模型”中看到了如何使用惩罚线性回归为它们构建预测模型。本章使用集成方法来解决相同的问题。这将使你能够从包的易用性、集成方法与惩罚线性回归可达到的准确性、训练时间对比等方面来比较这些算法和可用的\
  \ Python 包。本章末尾展示了你已熟悉的各种算法的汇总对比。\n\n## 使用 Python 集成包解决回归问题\n\n接下来的几个节演示了可用 Python\
  \ 包在构建集成模型中的应用。你将看到第 6 章中学到的知识付诸实践。第 6 章中解释的方法将用于第 2 章中探讨的一系列问题，然后用于演示第 5 章中惩罚线性回归的应用。使用相同的问题使得沿多个维度比较此处涵盖的算法成为可能，包括原始性能、训练时间和易用性。本章还涵盖了可用的\
  \ Python 包。第 6 章给出的背景知识有助于你理解 Python 包为何以这种方式构建，并帮助你看到如何从这些方法中获得最大收益。本节将介绍各种不同的问题类型，从回归问题开始。\n\
  \n### 使用梯度提升预测葡萄酒口感\n\n\n\n\n#### 使用 GradientBoostingRegressor 的类构造函数\n\n要查阅 XGBoost\
  \ Python 版本的文档，请搜索 \"xgboost python api\"。查看标题为 \"Python API Reference\"（Python\
  \ API 参考）的部分。在该部分中，你会找到 \"Core Data Structure\"（核心数据结构）。它定义了 XGBoost 为内存和速度优化而使用的一种专用输入数据结构。你会看到一个名为\
  \ `DMatrix()` 的函数，它接受特征和标签作为 numpy 数组，并返回所需的数据结构。下一节（清单 7-1）中的代码示例将向你展示这有多么易用。\n\
  \n接下来是学习 API 和 scikit-learn API 的描述，它们定义了训练函数、交叉验证训练，以及类 scikit-learn 的回归器和分类器类。对于这些，你需要为各种控制训练过程的参数提供值。通过搜索问题，你几乎可以找到任何问题的答案。\n\
  \n以下列表描述了你需要熟悉的参数和方法，并在适当的地方给出了一些关于选择和权衡的评论。你需要了解这些才能入门（文档中有更长的列表）：\n\n*   `max_depth`\
  \ (`int`)——基学习器的最大树深度。\n*   `learning_rate` (`float`)——提升学习率。\n*   `n_estimators`\
  \ (`int`)——要拟合的树的数量。\n*   `verbosity` (`int`)——冗长程度。有效值为 `0`（静默）到 `3`（调试）。\n*  \
  \ `objective` (`string` 或 `callable`)——指定学习任务及相应的学习目标。这基本上是在训练过程中被最小化的损失函数。对于回归问题，通常的选择是\
  \ `'reg:squarederror'`；对于二分类问题，则是 `'binary:logistic'`。文档的 \"learning parameters\"\
  （学习参数）部分概述了其他选择。\n*   `booster` (`string`)——指定使用哪种 booster：`gbtree`、`gblinear` 或\
  \ `dart`。这里你只会看到 `gbtree` 的用法，但我鼓励你尝试其他一些类型。\n*   `n_jobs` (`int`)——用于运行 XGBoost\
  \ 的并行线程数（替代 `nthread`）。\n*   `subsample` (`float`)——用于逐棵树构建的数据采样比例。\n\n    接下来的三个参数通过为每棵树、每层或每个节点随机选取特征子集，将集成中的树变为随机森林树。\n\
  \n*   `colsample_bytree` (`float`)——构建每棵树时的列采样比例。\n*   `colsample_bylevel` (`float`)——每层的列采样比例。\n\
  *   `colsample_bynode` (`float`)——每次分裂的列采样比例。\n*   `reg_alpha` (`float` [xgb 的 `alpha`])——权重上的\
  \ L1 正则项。\n*   `reg_lambda` (`float` [xgb 的 `lambda`])——权重上的 L2 正则项。\n*   `seed`\
  \ (`int`)——随机数种子。（已弃用，请使用 `random_state`。）\n*   `random_state` (`int`)——随机数种子（替代\
  \ `seed`）。\n\n使用 XGBoost 进行建模的过程是：实例化 `XGBRegressor` 或 `XGBClassifier`，并提供将定义训练和评估过程的参数值。然后你将在该对象上调用一系列类函数。你将经常看到的包括\
  \ `fit()`，它将触发训练和相关输出；`predict()`，它将使用训练好的模型生成预测；以及 `feature_importances()`，它将给出特征重要性的估计。这些足以让你入门了。\n\
  \n对于新用户来说，为梯度提升设置参数可能有点令人困惑。以下列表建议了梯度提升的参数设置和调整序列：\n\n1.  从默认设置开始，但设置 `subsample=0.5`。训练一个模型，并观察集成中树的数量与样本外\
  \ (OOS) 性能的曲线。在第一次和后续运行后，观察 OOS 性能曲线的形状。\n2.  如果图表右端的 OOS 性能正在快速提升，则增加 `n_estimators`\
  \ 或增加 `learning_rate`。\n3.  如果图表右端的 OOS 性能正在快速恶化，则减小 `learning_rate`。\n4.  一旦 OOS\
  \ 性能曲线在其整个长度上都有所改善（或仅非常轻微地恶化），并在图表右侧趋于平稳，尝试调整 `max_depth` 和 `max_features`。\n\n\
  #### 使用 GradientBoostingRegressor 实现回归模型\n\n清单 7-1 展示了为葡萄酒质量数据集构建梯度提升模型所需的内容。\n\n\
  ### 清单 7-1：构建梯度提升模型预测葡萄酒质量——wine_gbm.py\n\n\n\n\n> ```\n> __author__ = 'mike_bowles'\n\
  > \n> import numpy as np\n> from sklearn.metrics import mean_squared_error\n> from\
  \ Read_Fcns import list_read_wine\n> from math import sqrt\n> import matplotlib.pyplot\
  \ as plt\n> import xgboost as xgb\n> \n> # 从 UCI 网站读取葡萄酒质量数据\n> names, xList, labels\
  \ = list_read_wine() \n> names = [x.replace('\\\"', '') for x in names]\n> print(names)\n\
  > \n> nrows = len(xList)\n> ncols = len(xList[0])\n> \n> X = np.array(xList)\n>\
  \ y = np.array(labels)\n> \n> n_fold = 5\n> \n> idx_array = np.array(range(len(y))).reshape([-1,\
  \ 1])\n> params = {\"objective\":\"reg:linear\",\n>         'colsample_bytree':\
  \ 0.4,\n>         'learning_rate': 0.02, \n>         'n_estimators': 500,\n>   \
  \      'max_depth': 4, \n>         'alpha': 10, \n>         'verbosity':1}\n> \n\
  > reg_model = xgb.XGBRegressor(**params)\n> results_list = []\n> for i_fold in range(n_fold):\n\
  >     idx_test = idx_array[np.mod(idx_array, n_fold) == i_fold]\n>     idx_train\
  \ = idx_array[np.mod(idx_array, n_fold) != i_fold]\n>     x_test = X[idx_test]\n\
  >     y_test= y[idx_test]\n>     x_train = X[idx_train]\n>     y_train = y[idx_train]\n\
  >   \n>     reg_model.fit(x_train, y_train, eval_set=[(x_train, y_train), \n>  \
  \       (x_test, y_test)], eval_metric='rmse', verbose=False)\n>     results_list.append(reg_model.evals_result())\n\
  > \n> train_err = [eval['validation_0']['rmse'] for eval in results_list]\n> test_err\
  \ = [eval['validation_1']['rmse'] for eval in results_list]\n> \n> train_err_array\
  \ = np.array(train_err)\n> test_err_array = np.array(test_err)\n> \n> train_avg\
  \ = np.mean(train_err_array, axis = 0)\n> test_avg = np.mean(test_err_array, axis\
  \ = 0)\n> \n> print('Final training rmse', train_avg[-5:])\n> print('Final test\
  \ rmse', test_avg[-5:])\n> \n> plt.plot(train_avg)\n> plt.plot(test_avg)\n> plt.xlabel('Number\
  \ of Trees in Ensemble')\n> plt.ylabel('RMSE')\n> plt.title('Train and Test Errors')\
  \ \n> plt.savefig('wineXGB_train_test_rmse.png', dpi=500)\n> plt.show()\n> \n> #\
  \ 在完整数据集上重新训练以计算重要性\n> data_matrix = xgb.DMatrix(data=X, label=y, feature_names=names[0:-1])\n\
  > params = {\"objective\":\"reg:linear\",'colsample_bytree': 0.4,\n>      'learning_rate':\
  \ 0.02, 'n_estimators': 500, 'max_depth': 4, \n>      'alpha': 10, 'silent':1}\n\
  > \n> wine_xg = xgb.train(params=params, dtrain=data_matrix,\n>      num_boost_round=500)\n\
  > xgb.plot_importance(wine_xg)\n> plt.rcParams['figure.figsize'] = [5, 5]\n> plt.savefig('wineGBM_variable_importance.png',\
  \ dpi=500)\n> plt.show()\n> \n> \n> 打印输出：\n> ['fixed acidity', 'volatile acidity',\
  \ 'citric acid', 'residual sugar',\n> 'chlorides', 'free sulfur dioxide', 'total\
  \ sulfur dioxide', 'density',\n> 'pH', 'sulphates', 'alcohol', 'quality']\n> Final\
  \ training rmse [0.4301812 0.4299654 0.4296578 0.429428 0.4292482]\n> Final test\
  \ rmse [0.5996246 0.5995986 0.599513 0.5995322 0.5994808] \n> ```\n\n第一部分代码读取数据集，将属性矩阵与目标值分离，转换为\
  \ NumPy 数组，然后形成训练集和测试集。下一步是定义一个名为 `params` 的 Python 字典。该字典包含定义 GBM 模型所需的参数值。其中一些参数或多或少是标准的，而另一些则会因问题而异。第一个参数是\
  \ `objective` 函数。由于这是一个回归问题，`reg:linear` 是此处的常用选择。如果你遇到标签呈指数分布的问题（无负值，正值拥挤在零附近，较大值分布稀疏），则可以尝试逻辑回归。\n\
  \n定义参数后，下一步是实例化模型对象。此处的训练循环执行 5 折交叉验证。训练集和测试集的索引在列表推导式中定义，用于为每一折定义相应的训练集和测试集。然后，通过在名为\
  \ `reg_model` 的 `xgb.XGBRegressor` 对象上调用 `fit` 函数来训练模型。`fit` 函数中定义的 `eval_set` 参数被选为一对列表。一对是训练特征集及其对应标签。另一对是测试数据的类似组合。`eval_metric='rmse'`\
  \ 告诉 `fit` 函数将模型预测应用于特征，然后计算两者之间的均方根误差（RMSE）。它对测试数据遵循相同的过程。\n\nXGBoost 机制将一个字典传递给\
  \ `reg_model.evals_result()`。这些字典中的每一个都包含在交叉验证的每一折中，随着树被添加到集成中而逐点生成的训练和测试 RMSE。这使得使用列表推导式跨交叉验证折聚合结果、将生成的数组列表转换为二维\
  \ NumPy 数组，并计算集成增长每个阶段的平均训练和测试误差变得容易。\n\n清单中的最后一部分代码在完整数据集上训练一个新模型。重新训练使用 XGBoost\
  \ 的 `train` 函数完成。这具有略微不同的特性，尽管底层机制相同。使用 `train` 函数不需要实例化类对象。它是一个函数调用。该函数调用要求输入数据（训练集和测试集）采用\
  \ XGBoost 的 `DMatrix` 数据结构。你可以看到，此过程仅需一行代码即可接受 NumPy 数组作为输入。\n\n#### 评估梯度提升模型的性能\n\
  \n图 7.1 和 清单 7-1 中的打印输出显示，梯度提升获得略低于 0.6 的 RMS 误差。你将在下一节看到，随机森林获得大致相同的结果。这种情况经常发生，但也存在差异显著的问题，因此你可能想两者都试试以确保万无一失。图\
  \ 7.1 中的图表显示，样本外误差在 x 轴中途变平。有时通过略微降低学习率并重新训练，可以榨出更多性能。不妨试试看能得到什么结果。\n\n![图 7.1：梯度提升葡萄酒模型的训练和测试性能](img/c07f001.png)\n\
  \n**图 7.1**：梯度提升葡萄酒模型的训练和测试性能\n\n图 7.2 显示了作为梯度提升实现一部分确定的变量重要性。请注意，酒精含量是第二重要的变量。与你在惩罚线性回归中看到的相比，它与挥发性酸度互换了位置。\n\
  \n![图 7.2：梯度提升测量的变量重要性](img/c07f002.png)\n\n**图 7.2**：梯度提升测量的变量重要性\n\n### 构建随机森林模型预测葡萄酒口感\n\
  \n随机森林不作为 XGBoost 的一部分提供，但 scikit-learn 拥有优秀的随机森林包。竞争表现的证据以及过去几年开发工作的相对强度表明，梯度提升在性能上比随机森林具有优势。但随机森林毫无疑问更容易使用。如果你遵循布雷曼（发明者）的建议，将树生长到全深并取平均。你可以调整用于训练的数据集采样比例，也可以调整每次分裂可用的特征数量，但性能通常是这两个因素的弱函数。相比之下，梯度提升具有学习率、两个正则化参数、树深度等众多参数。如果你想要快速得到答案，随机森林是个不错的选择。\n\
  \n\n\n\n#### Python scikit-learn ensemble 模块包含用于回归问题的随机森林算法\n\n该模块还包含梯度提升算法。首先，本节解释实例化\
  \ `RandomForestRegressor` 类成员所需的参数。然后，本节使用 `RandomForestRegressor` 类为葡萄酒口味数据训练随机森林模型，并探索模型的性能。\n\
  \n### 构建 RandomForestRegressor 对象\n\n以下是 `sklearn.ensemble.RandomForestRegressor`\
  \ 的类构造函数：\n\n```\nsklearn.ensemble.RandomForestRegressor(n_estimators=10, criterion=\n\
  'mse', max_depth=None, min_samples_split=2, min_samples_leaf=1,\nmax_features= 'auto',\
  \ max_leaf_nodes=None, bootstrap=True, \noob_score=False, n_jobs=1, random_state=None,\
  \ verbose=0, \nmin_density=None, compute_importances=\nNone)\n```\n\n以下描述参考了 sklearn\
  \ 文档，但仅涵盖您最可能想要更改的参数值。对于这些参数，列表描述了如何选择默认值的替代方案。要查看此处未涵盖的参数的描述，请参阅 sklearn 包文档。以下列表描述了这些参数：\n\
  \n#### `n_estimators`\n\n*integer, optional (default = 10)*\n\n这是集成中树的数量。如果您编码正确，默认值可以使用，但通常您需要超过\
  \ 10 棵树才能获得最佳性能。您可以尝试不同的数量，以了解需要多少棵树。正如本书始终强调的，合适的模型复杂度（树的深度和树的数量）取决于底层问题的复杂性以及您拥有的数据量。一个好的起点是\
  \ 100–500。\n\n#### `max_depth`\n\n*integer or None, optional (default=None)*\n\n\
  如果此参数设置为 `None`，则树将生长直到所有叶节点要么是纯净的，要么包含的样本少于 `min_samples_split` 个。作为指定树深度的替代方案，您可以使用\
  \ `max_leaf_nodes` 来指定树中的叶节点数量。如果您指定了 `max_leaf_nodes`，则 `max_depth` 将被忽略。将 `max_depth`\
  \ 设置为 `auto` 并生长全深度树可能具有性能优势。这也伴随着与全深度树相关的训练时间成本。如果您需要多次训练运行来完成建模过程，可能需要尝试不同的深度。\n\
  \n#### `min_samples_split`\n\n*integer, optional (default=2)*\n\n包含样本数少于 `min_samples_split`\
  \ 的节点将不会被分裂。分裂较小的节点是过拟合的来源。\n\n#### `min_samples_leaf`\n\n*integer, optional (default=1)*\n\
  \n如果分裂导致节点包含的样本数少于 `min_samples_leaf`，则不会进行该分裂。此参数的默认值导致该参数被忽略，这通常没问题——特别是在您对数据集进行前几次训练运行时。您可以从几个方面考虑为该参数选择一个有意义的值。一是分配给叶节点的值是该叶节点中样本的平均值，如果叶节点中有不止一个样本，您将获得方差更低的平均值。另一种考虑该参数的方式是将其作为控制树深度的替代方法。\n\
  \n#### `max_features`\n\n*integer, float or string, optional (default=None)*\n\n\
  寻找最佳分裂时考虑的特征数量取决于 `max_features` 设置的值以及问题中的特征数量。将问题中的特征数量称为 `nFeatures`。则：\n\n*\
  \   如果 `max_features` 的类型是 `int`，则在每次分裂时考虑 `max_features` 个特征。注意：`max_features >\
  \ nFeatures` 会抛出错误。\n*   如果 `max_features` 的类型是 `float`，则 `max_features` 是要考虑的特征比例：`int(max_features\
  \ * nFeatures)`。\n*   可能的字符串值包括以下内容：\n\n```\nauto max_features=nFeatures\nsqrt max_features=sqrt(nFeatures)\n\
  log2 max_features=log2(nFeatures)\nIf max_features=None, then max_features=nFeatures.\n\
  ```\n\nBreiman 和 Cutler 建议对回归问题使用 `sqrt(nFeatures)`。答案通常对 `max_features` 不太敏感，但该参数可能有一些影响，因此您需要测试一些替代值。\n\
  \n#### `random_state`\n\n*int, RandomState instance, or None (default=None)*\n\n\
  *   如果类型是 `integer`，该整数将用作随机数生成器的种子。\n*   如果 `random_state` 是 `RandomState` 的实例，则该实例将用作随机数生成器。\n\
  *   如果 `random_state` 为 `None`，则随机数生成器是 `numpy.random` 使用的 `RandomState` 实例。\n\n\
  `RandomForestRegressor` 有几个属性，包括组成集成的训练好的树。有一个 predict 方法将使用训练好的树进行预测，因此您通常不会直接访问那些树。您会想要访问变量\
  \ `feature_importances_`。以下是描述：\n\n#### `feature_importances_`\n\n这是一个数组，其长度等于问题中的特征数量（前文称为\
  \ `nFeatures`）。数组中的值为正浮点数，表示相应属性的相对重要性。`importances` 由 Breiman 在随机森林原始论文中发明的程序确定。基本思想是，一次随机打乱每个属性的值，并确定模型预测准确性的变化。预测准确性受损越大，该属性越重要。\n\
  \n以下是所用方法的描述：\n\n#### `fit(XTrain, yTrain, sample_weight=None)`\n\n`XTrain` 是属性值的数组。它有\
  \ `nInstances` 行和 `nFeature` 列。`yTrain` 是目标值数组。`y` 也有 `nInstances` 行。在本章您将看到的示例中，`yTrain`\
  \ 将只有一列，但该方法可以拟合具有不同目标的多个模型。为此，`y` 将有 `nTargets` 列——每组结果一列。`sample_weight` 使得为训练数据中的每个实例分配不同的权重成为可能。它可以采取两种形式之一。默认值\
  \ `None` 导致所有输入实例权重相等。要对每个实例应用不同的权重，`sample_weight` 应为具有 `nInstances` 行和一列的数组。\n\
  \n#### `predict(XTest)`\n\n`XTest` 是用于生成预测的属性值数组。输入 `predict()` 的数组与用于 `fit()` 方法训练的数组具有相同数量的列，但可以有不同数量的行，包括可能只有一行。`predict()`\
  \ 输出中的行与训练中使用的目标数组 `y` 中的行具有相同的形式。\n\n### 使用 RandomForestRegressor 对葡萄酒口味建模\n\n\
  Listing 7-2 展示了如何使用 sklearn 版本的随机森林算法构建集成模型来预测葡萄酒口味。\n\n\n\n\n代码从 UCI 数据存储库读取葡萄酒数据集；进行一些处理以将属性、标签和属性名称放入列表中；并按\
  \ `RandomForestRegressor` 所需的输入格式将列表转换为 numpy 数组。将这些输入对象设为 numpy 数组形式的一个额外好处是，它允许使用\
  \ sklearn 工具 `train_test_split` 来构建输入的训练版本和测试版本。代码将 `random_state` 设置为指定的整数值，而不是让随机数生成器选取一个不可重复的内部值。这样做是为了让你在运行代码时，能得到与此处展示的结果相同的图表和数值。在开发过程中设置\
  \ `random_state` 也很方便，因为结果中的随机性可能会掩盖你所做的更改。在实际模型训练期间，你可能想要将 `random_state` 设置为其默认值\
  \ `None`。固定 `random_state` 会固定留出集，因此，重复的参数调整和重新训练可能会开始在你的留出集上过度训练。\n\n代码的下一步是定义一个集成规模列表，以生成性能图表，展示性能如何随集成中树的数量变化而变化。为了生成详细的图表，清单\
  \ 7-2 中选择的数字从训练 10 棵树开始，然后获取结果并分批训练更多树。分增量训练使你能看到误差与树数量曲线的形状。这样你就可以衡量最终模型需要多少棵树。清单\
  \ 7-2 中的代码展示了如何使用 `warm_start` 参数，以便在添加新树时累积训练。\n\n#### 清单 7-2：构建随机森林预测葡萄酒质量——wine_rf.py\n\
  \n```\n__author__ = 'mike_bowles'\n\nimport numpy as np\nfrom sklearn.model_selection\
  \ import train_test_split\nfrom sklearn.ensemble import RandomForestRegressor\n\
  from sklearn.metrics import mean_squared_error\nimport matplotlib.pyplot as plt\n\
  from Read_Fcns import list_read_wine\nfrom math import sqrt\n\n\n##### 从 UCI 网站读取葡萄酒质量数据\n\
  names, xList, labels = list_read_wine()\n\nnrows = len(xList)\nncols = len(xList[0])\n\
  \nX = np.array(xList)\ny = np.array(labels)\nwineNames = np.array(names)\n\n#####\
  \ 取固定留出集，占数据行的 30%\nxTrain, xTest, yTrain, yTest = train_test_split(X, y, test_size=0.30,\
  \ \n        random_state=531)\n\n##### 针对不同森林规模训练随机森林 - 观察 mse 如何变化\nrmseOos = []\
  \ \ndepth = None  # None - 给出最大深度树，可尝试限制\nmaxFeat  = 4 # 可尝试调整\n\nnum_iterations\
  \ = 50 # 训练 10 棵额外的树 50 次\ntrees_per_iteration = 10\n\nwineRFModel = RandomForestRegressor(n_estimators=trees_per_iteration,\n\
  \                      max_depth=depth, \n                      max_features=maxFeat,\
  \ \n                      oob_score=False, \n                      random_state=531,\
  \ \n                      warm_start=True)\n\nfor iters in range(num_iterations):\n\
  \    wineRFModel.fit(xTrain,yTrain)\n    wineRFModel.n_estimators += trees_per_iteration\n\
  \    \n    # 累积测试集上的 mse\n    prediction = wineRFModel.predict(xTest)\n    rmseOos.append(sqrt(mean_squared_error(yTest,\
  \ prediction)))\n\n\nprint(\"RMSE\" )\nprint(min(rmseOos))\nprint(rmseOos[-1])\n\
  \n##### 绘制训练和测试误差随集成中树数量变化的曲线\nnum_trees = [i * trees_per_iteration for i in range(num_iterations)]\n\
  plt.plot(num_trees, rmseOos)\nplt.xlabel('Number of Trees in Ensemble')\nplt.ylabel('Root\
  \ Mean Squared Error')\nplt.title('RF Performance vs Number of Trees')\nplt.savefig('wine_rf.png',\
  \ dpi=500)\nplt.show()\n\n##### 绘制特征重要性\nfeatureImportance = wineRFModel.feature_importances_\n\
  \n##### 按最大重要性归一化\nfeatureImportance = featureImportance / featureImportance.max()\n\
  sorted_idx = np.argsort(featureImportance)\nbarPos = np.arange(sorted_idx.shape[0])\
  \ + .5\nplt.barh(barPos, featureImportance[sorted_idx], align='center')\nplt.yticks(barPos,\
  \ wineNames[sorted_idx])\nplt.xlabel('Variable Importance')\nplt.subplots_adjust(left=0.2,\
  \ right=0.9, top=0.9, bottom=0.1)\nplt.title('Relative Importance of Features')\n\
  plt.savefig('wine_rf_var_imp.png', dpi=500)\nplt.show()\n   \n打印输出\nRMSE\n0.5618291717498893\n\
  0.5644169041290903 \n```\n\n影响训练的大多数参数是在实例化 `RandomForestRegressor` 对象的构造函数中设置的。在这种情况下，对构造函数的调用非常简单。唯一没有保留默认值的参数是\
  \ `max_features` 参数。默认值 (`None`) 会导致在树的每个节点都考虑所有特征，这意味着它实际上是在实现装袋法，因为不涉及属性的随机选择。\n\
  \n实例化 `RandomForestRegressor` 对象后，下一步是调用 `fit()` 方法并传入训练集作为参数。完成此操作后，使用测试集的属性调用\
  \ `predict()` 方法会生成预测值，这些预测值可以与测试集标签进行比较。清单中的代码使用 sklearn.metrics 函数 `mean_squared_error`\
  \ 来计算预测误差。生成的均方误差数字被收集在一个列表中，然后绘制出来。图 7.3 显示了生成的图表。\n\n![图 7.3：随机森林葡萄酒质量模型的训练和测试性能](img/c07f003.png)\n\
  \n**图 7.3**：随机森林葡萄酒质量模型的训练和测试性能\n\n均方误差的最小值和最后一个值也会被打印并在 清单 7-2 底部复制。请注意，最后一个值比最小值略高。我更倾向于信任最后一个（较高的）值而不是最小值。随机森林通过平均越来越多的某种程度上独立的高方差树来最小化方差。从概念上讲，误差应该单调下降。在它没有单调下降的程度上，这些变化是随机波动。到\
  \ 图 7.3 中图表的末尾，图表已经变得或多或少是平坦的。开始附近的最小值很可能是随机波动，而非可实现的性能。\n\n#### 可视化随机森林回归模型的性能\n\
  \n图 7.3 中的曲线展示了随机森林算法的方差减少特性。随着树的增加，误差水平下降，曲线中的统计波动量也随之减少。\n\n随机森林会生成每个变量对预测准确性重要性的估计。清单\
  \ 7-2 提取数据成员 `feature_importances_`，将重要性值重新缩放到 `0` 和 `1` 之间，对生成的重要性值进行排序，然后在条形图中绘制它们。图\
  \ 7.4 显示了该图表。最重要的变量具有 `1.0` 的缩放重要性，是条形图中最顶端的条形。随机森林模型将酒精度排为最重要的特征，将挥发性酸度排为第二重要。这与梯度提升的结果相反，但与你在\
  \ 第 5 章 中看到的惩罚线性回归的结果相同。\n\n## 在 Python 集成模型中融入非数值属性\n\n\n\n非数值属性是指那些取若干个离散非数值值的属性。例如，人口普查记录拥有无数个非数值属性——已婚、单身、离婚等；家庭所在的州是另一个例子。非数值属性可以提高预测准确性，但\
  \ Python 集成方法需要数值输入。在第 4 章“惩罚线性回归”和第 5 章“使用惩罚线性方法构建预测模型”中，你已经看到了如何对因子变量进行编码，以便将其纳入惩罚线性回归。相同的技术在这里也适用。估算鲍鱼年龄的问题将作为一个示例来说明该技术。\n\
  \n![Figure 7.4: Variable importance estimated by random forest](img/c07f004.png)\n\
  \n**图 7.4**: 随机森林估算的变量重要性\n\n### 为 Python 梯度提升回归对鲍鱼性别进行编码\n\n假设你的问题有一个取 *n* 个值的属性。“美国州”取\
  \ 50 个值，“婚姻状况”取 3 个值。要对这个 *n* 值因子变量进行编码，你需要创建 *n* – 1 个新的哑属性。如果变量取其第 *i* 个值，则第 *i*\
  \ 个哑变量为 1，所有其他哑变量为 0。如果因子变量取其第 *n* 个值，则所有哑变量均为 0。鲍鱼数据将对此进行说明。清单 7-3 包含训练梯度提升模型的代码。\n\
  \n#### 清单 7-3: 训练梯度提升模型预测鲍鱼年龄——abalone_gbm.py\n\n```\n__author__ = 'mike_bowles'\n\
  \nimport matplotlib.pyplot as plt\nimport numpy as np \nfrom sklearn.metrics import\
  \ mean_squared_error\nfrom Read_Fcns import list_read_abalone\nimport xgboost as\
  \ xgb\n\n\n#read abalone data\nxList, labels = list_read_abalone()\n\nnames = ['Sex',\
  \ 'Length', 'Diameter', 'Height', 'Whole weight', \n'Shucked weight', 'Viscera weight',\
  \ 'Shell weight', 'Rings']\n\n#code three-valued sex attribute as numeric\nxCoded\
  \ = []\nfor row in xList:\n    #first code the three-valued sex variable\n    codedSex\
  \ = [0.0, 0.0]\n    if row[0] == 'M': codedSex[0] = 1.0\n    if row[0] == 'F': codedSex[1]\
  \ = 1.0\n\n    numRow = [float(row[i]) for i in range(1,len(row))]\n    rowCoded\
  \ = list(codedSex) + numRow\n    xCoded.append(rowCoded)\n\nnamesCoded = np.array(['Sex1',\
  \ 'Sex2', 'Length', 'Diameter', 'Height', \n        'Whole weight', 'Shucked weight',\
  \ 'Viscera weight', \n        'Shell weight', 'Rings'])\n\nnrows = len(xCoded)\n\
  ncols = len(xCoded[1])\n\n#form x and y into numpy arrays and make up column names\n\
  X = np.array(xCoded)\ny = np.array(labels)\n\ndata_dmatrix = xgb.DMatrix(data=X,label=y,\n\
  feature_names=namesCoded[0:(-1)])\n\n##### Train gradient boosting model to minimize\
  \ mean squared error\nparams = {\"objective\":\"reg:linear\",\n          'colsample_bytree':\
  \ 0.6,\n          'learning_rate': 0.02, \n          'max_depth': 5, \n        \
  \  'alpha': 0, \n          'silent':1}\n\ncv_results = xgb.cv(dtrain=data_dmatrix,\
  \ \n                    params=params, nfold=5,\n                    num_boost_round=500,\n\
  \                    early_stopping_rounds=50, \n                    metrics=\"\
  rmse\",\n                    as_pandas=True, seed=123) \n\nprint(cv_results.head())\n\
  print(cv_results.tail())\nplt1 = cv_results['train-rmse-mean']\nplt2 = cv_results['test-rmse-mean']\n\
  \nplt.plot(plt1)\nplt.plot(plt2)\nplt.xlabel('Number of Trees in Ensemble')\nplt.ylabel('RMSE')\n\
  plt.title('Train and Test Errors')\nplt.savefig('abaloneXGB_train_test_rmse.png',\
