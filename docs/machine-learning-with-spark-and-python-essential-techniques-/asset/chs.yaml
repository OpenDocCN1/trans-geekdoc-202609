  > plt.ylabel('Area Under the ROC Curve')\n> plt.axis('tight')\n> plt.show()\n> \n\
  > \n> # 绘制最佳版本的 ROC 曲线\n> fpr, tpr, thresh = roc_curve(yOutBin, list(pred[:, idxMax]))\n\
  > ctClass = [i*0.01 for i in range(101)]\n> \n> plt.plot(fpr, tpr, linewidth=2)\n\
  > plt.plot(ctClass, ctClass, linestyle=':')\n> plt.xlabel('False Positive Rate')\n\
  > plt.ylabel('True Positive Rate')\n> plt.show()\n> \n> print('Best Value of Misclassification\
  \ Error = ', misClassRate[idxMin])\n> print('Best alpha for Misclassification Error\
  \ = ', plotAlphas[idxMin])\n> \n> print('')\n> print('Best Value for AUC = ', auc[idxMax])\n\
  > print('Best alpha for AUC   =  ', plotAlphas[idxMax])\n> \n> print('')\n> print('Confusion\
  \ Matrices for Different Threshold Values\\n')\n>   \n> # 选取曲线上的某些点进行打印。共有 57 个点。\n\
  > # 极端值没有用处\n> # 在 14、28 和 42 处采样。使用计算出的 tpr 和 fpr 值\n> # 以及定义和阈值。\n> # 部分术语（例如参见维基百科\
  \ \"receiver operating curve\"）\n> \n> \n> P = len(idxPos)   # P = 正例数\n> N = nrow\
  \ - P      # N = 负例数\n> TP = tpr[14] * P  # TP = 真正例 = tpr * P\n> FN = P - TP  \
  \     # FN = 假负例 = P - TP\n> FP = fpr[14] * N   # FP = 假正例 = fpr * N\n> TN = N -\
  \ FP       # TN = 真负例 = N - FP\n> \n> print('Threshold Value =   ', thresh[14])\n\
  > print('TP = ', TP, 'FP = ', FP)\n> print('FN = ', FN, 'TN = ', TN)\n> \n> TP =\
