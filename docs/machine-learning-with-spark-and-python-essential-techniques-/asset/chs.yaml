  \n**图 7.8**：随机森林对鲍鱼模型中变量重要性的估计\n\n## 使用 Python 集成方法解决二分类问题\n\n本节涵盖两种基本类型的分类问题：二分类和多分类。二分类问题是指只有两种可能结果的问题。例如，这些结果可能是“点击了广告”或“未点击广告”。此处用于说明集成方法用法的示例是岩石与地雷问题，其任务是利用声纳回波来确定声纳扫描的物体是岩石还是地雷。\n\
  \n多分类问题是指具有两种以上可能结果的问题。根据化学成分对玻璃样本进行分类，用于说明针对此类问题使用 Python 集成方法的情况。\n\n### 使用 Python\
  \ 梯度提升检测未爆地雷\n\nListing 7-5 展示了使用 XGBoost 构建检测未爆地雷二分类器的代码。此示例使用 XGBoost 的函数式形式，以便将交叉验证作为训练的一部分来实现。您可能会注意到参数中几乎没有什么差别。差异体现在三个地方。一是目标函数需要从回归更改为分类。二是标签需要是二值的。三是性能评估指标需要更改。\n\
  \n\n\n#### 二分类的三个目标\n\n二分类有三个可用目标：`binary:logistic`、`binary:logitraw` 和 `binary:hinge`。清单\
  \ 7-5 中的代码使用了 `binary:logistic`。尝试在这些选项中切换，看看它们如何影响你获得的性能。这些选项有一些重要的区别。\n\n一种可能性是\
  \ `error` 或 `error@t`。梯度提升将计算两个类别中每个类别的类别概率估计。误差指标将预测概率与 0.5 阈值进行比较。高于 0.5 的预测将导致预测为\
  \ 1，低于 0.5 的预测将导致预测为 0。然后指标 `error` 会将相对于真实标签的错误累加起来。你的问题可能要求你对某一类错误比另一类错误更加谨慎。例如，分类为\
  \ 1 可能会导致一场危险的手术。将阈值上调将导致更少的 1 的预测。你可以通过使用 `error@0.6` 将阈值上调至 0.6。\n\n除了这些分类错误计数指标外，你还可以选择\
  \ `auc`（ROC 曲线下面积）作为指标。该指标值越大越好，其优点是不需要选取阈值。还有 `aucpr`，即精确率-召回率曲线下面积。清单 7-5 使用了\
  \ `auc`。\n\n#### 清单 7-5：构建梯度提升模型以区分水下地雷与岩石——rocks_v_mines_gbm.py\n\n```python\n\
  __author__ = 'mike_bowles'\n\nfrom math import sqrt, fabs, exp\nimport matplotlib.pyplot\
  \ as plt\nfrom sklearn.metrics import roc_auc_score, roc_curve\nimport numpy as\
  \ np\nfrom Read_Fcns import list_read_rvm\nimport xgboost as xgb\n\n##### 从 uci\
  \ 数据仓库读取数据\nxList, labels = list_read_rvm()\n\n\n##### x 矩阵中的行数和列数\nnrows = len(xList)\n\
  ncols = len(xList[1])\n\n##### 将 x 和 y 转换为 numpy 数组并编造列名\nX = np.array(xList)\n\
  y = np.array(labels)\nrocksVMinesNames = np.array(['V' + str(i) for i in range(ncols)])\n\
  \ndata_dmatrix = xgb.DMatrix(data=X, label=y,\n                    feature_names=rocksVMinesNames)\n\
  \n##### 训练梯度提升模型以最小化均方误差\nparams = {\"objective\": \"binary:logistic\",\n      \
  \    'colsample_bytree': 0.3,\n          'learning_rate': 0.5,\n          'max_depth':\
  \ 5,\n          'lambda': 1.0,\n          'alpha': 0,\n          'silent': 1}\n\n\
  \ncv_results = xgb.cv(dtrain=data_dmatrix,\n                    params=params, nfold=5,\n\
  \                    num_boost_round=200,\n                    early_stopping_rounds=100,\n\
  \                    metrics=\"auc\",\n                    as_pandas=True, seed=123)\n\
  \nprint(cv_results.head())\nprint(cv_results.tail())\nplt1 = cv_results['train-auc-mean']\n\
  plt2 = cv_results['test-auc-mean']\n\nplt.plot(plt1)\nplt.plot(plt2)\nplt.xlabel('Number\
  \ of Trees in Ensemble')\nplt.ylabel('AUC')\nplt.title('Train and Test Performance')\n\
  plt.savefig('rvmXGB_train_test_rmse.png', dpi=500)\nplt.show()\n\n打印输出：\nBest AUC\n\
  0.940052\n\n   train-auc-mean  train-auc-std  test-auc-mean  test-auc-std\n0   \
  \     0.969936       0.009852       0.839870      0.080966\n1        0.996107  \
  \     0.001422       0.873191      0.061629\n2        0.999883       0.000143  \
  \     0.885021      0.053079\n3        0.999971       0.000058       0.895060  \
  \    0.042255\n4        1.000000       0.000000       0.900222      0.049393\n \
  \   train-auc-mean  train-auc-std  test-auc-mean  test-auc-std\n95             1.0\
  \            0.0       0.938621      0.041431\n96             1.0            0.0\
  \       0.938641      0.042119\n97             1.0            0.0       0.939091\
  \      0.041444\n98             1.0            0.0       0.939582      0.042113\n\
  99             1.0            0.0       0.940052      0.042141\n```\n\nXGBoost 分类器的打印输出显示最佳\
  \ AUC 为 0.94。考虑到完美性能为 1.0，这是一个相当不错的数字。\n\n### 确定梯度提升分类器的性能\n\n图 7.9 绘制了两条曲线。一条是训练集上的\
  \ AUC。另一条是测试数据上的 AUC。这两条曲线都是针对集成中的树的数量绘制的，以展示性能如何随着树的数量增加而变化（或者等价地说，随着采取更多梯度步骤而变化；每一步都会导致训练一棵额外的树）。\n\
  \n![图 7.9：梯度提升玻璃分类模型的训练和测试性能](img/c07f009.png)\n\n**图 7.9** (#c07.xhtml#R_c07-fig-0009)：梯度提升玻璃分类模型的训练和测试性能\n\
  \n图 7.10 绘制了梯度提升地雷探测器中最重要变量的变量重要性。图 7.10 中的变量重要性难以直观评估，因为它们不像其他数据集中出现的贝壳重量或酒精含量那样容易识别。在这种情况下，这些对应于声纳从目标反弹回来的不同频率。如果我们有原始数据和实验条件，我们可能能够识别岩石和地雷上的特征，这些特征将对应于最重要特征的波长。如果这是你正在处理的问题，那可能是一个很好的研究方向。\n\
  \n在本节中，你已经看到了如何使用集成方法来解决二分类问题。在大多数方面，将集成方法应用于二分类问题与回归问题是相同的。你还了解到，构建用于分类和回归的集成模型之间的许多差异，源于这两类问题在度量误差和以其他方式表征误差方面的差异。\n\
  \n![图 7-10：梯度提升对岩石与地雷模型中变量重要性的估计](img/c07f010.png)\n\n**图 7-10** (#c07.xhtml#R_c07-fig-0010)：梯度提升对岩石与地雷模型中变量重要性的估计\n\
  \n下一节将展示如何将这些方法用于多类问题。\n\n### 使用 Python 随机森林探测未爆地雷\n\n以下列表显示了 `RandomForestClassifier`\
  \ 的构造函数及其参数。`RandomForestClassifier` 的大多数参数与 `RandomForestRegressor` 相同。`RandomForestRegressor`\
  \ 的参数已在使用 `RandomForestRegressor` 预测葡萄酒质量的部分中概述和讨论。本节仅重点介绍 `RandomForestClassifier`\
  \ 类中与其回归对应项不同的元素。\n\n第一个区别是用于判断分裂质量的标准。回顾第 6 章，训练树的过程涉及尝试所有可能的属性和每个属性的所有可能分裂点，然后选择能产生最佳分裂的属性和分裂点。对于回归树，分裂的质量是基于平方和误差来判断的。平方和误差不适用于分类问题。需要类似于误分类误差的东西。\n\
  \n以下是 `sklearn.ensemble.RandomForestClassifier` 的类构造函数：\n\n```python\nsklearn.ensemble.RandomForestClassifier(n_estimators=10,\
  \ criterion=\n'gini', max_depth=None, min_samples_split=2, min_samples_leaf=1,\n\
  max_features='auto', max_leaf_nodes=None, bootstrap=True, oob_score=\nFalse, n_jobs=1,\
  \ random_state=None, verbose=0, min_density=None,\ncompute_importances=None)\n```\n\
  \n以下描述了 `criterion` 参数：\n\n*   **criterion**\n\n    *字符串，可选（默认='gini'）*\n\n    可能的值包括以下内容：\n\
  \n    *   `gini`——使用基尼不纯度度量。\n    *   `entropy`——使用基于熵的信息增益。\n\n\n\n有关这两种节点不纯度度量的更多信息，请参阅维基百科上关于二叉决策树的页面：`http://en.wikipedia.org/wiki/Decision_tree_learning`。就实际应用而言，这种选择对集成性能影响不大。\n\
  \n分类树自然会根据落入各个叶节点的训练数据中不同类别的百分比，生成类别成员概率。根据您的应用场景，您可能希望直接使用这些概率作为答案，也可能希望将数量最多的类别的值作为落入该叶节点样本的预测结果返回。如果您打算调整与预测配合使用的阈值，则需要概率。对于生成曲线下面积（AUC），使用概率可以在接收者操作特征曲线（ROC）上获得更好的保真度。如果您想计算误分类错误，则需要将概率转换为特定类别的预测。\n\
  \n以下列表描述了这些方法：\n\n*   **`fit`**(X, y, sample_weight=None)\n\n    分类版本随机森林的参数说明仅在标签\
  \ y 的性质上有所不同。对于分类问题，标签为取值从 0 到类别数减 1 的整数。对于二分类问题，标签为 0 或 1。对于具有 `nClass` 个不同类别的多分类问题，它们是从\
  \ 0 到 `nClass – 1` 的整数。\n\n*   **`predict`**(X)\n\n    对于属性矩阵（二维 numpy 数组）X，此函数生成特定的类别预测。它产生一个与\
  \ X 行数相同的单列数组。每个条目都是一个预测类别，无论问题是二分类还是多分类。\n\n*   **`predict_proba`**(X)\n\n    此版本的预测函数生成一个二维数组。行数与\
  \ X 的行数匹配。列数等于被预测的类别数（例如二分类问题为两列）。每行中的条目是相关类别的概率。\n\n*   **`predict_log_proba`**(X)\n\
  \n    此版本的预测函数生成一个类似于 `predict_proba` 的二维数组。它显示的是概率的对数，而不是概率本身。\n\n#### 构建用于探测未爆地雷的随机森林模型\n\
  \nListing 7-8 展示了如何使用声纳构建随机森林模型来探测未爆地雷。数据设置和训练的整体结构应与本章前面及 Chapter 6 中的其他随机森林示例相似。差异源于分类问题的特性。首先，您会注意到标签是\
  \ 0 和 1。这是 `RandomForestClassifier` 的输入要求。接下来的差异在训练后评估测试集性能时显现。对于二分类问题，您可以选择使用 ROC\
  \ 曲线下面积（AUC）或误分类错误率。当 AUC 可用时，我通常倾向于使用它，因为它提供了一个总体性能度量。\n\n要计算 AUC，需使用 `predict()`\
  \ 函数的 `predict_proba` 版本。您无法使用已简化为特定类别的预测来获得有用的 ROC 曲线。（更准确地说，您计算出的 ROC 曲线上只有三个点：两个端点和中间的一个点。）sklearn\
  \ 度量工具使得计算 AUC 变得简单，只需几行代码。这些值被累积到一个列表中，以便绘制 AUC 性能随集成中树木数量变化的曲线。Listing 7-6 中的代码随后绘制\
  \ AUC 与树木数量的关系图、前 30 个最重要特征的特征重要性图，以及生成的最大集成的 ROC 曲线。代码的最后一部分选取三个不同的阈值水平，并打印出每个阈值水平的混淆矩阵。阈值水平选在三个四分位数边界，结果展示了随着阈值移动以偏向其中一个，假阳性和假阴性如何变化。\n\
  \n##### Listing 7-6：构建随机森林模型以区分水下地雷与岩石——rocks_v_mines_rf.py\n\n\n\n\n> ```\n> __author__\
  \ = 'mike_bowles'\n> \n> from math import sqrt, fabs, exp\n> import matplotlib.pyplot\
  \ as plt\n> from sklearn.model_selection import train_test_split\n> from sklearn.ensemble\
  \ import RandomForestClassifier\n> from sklearn.metrics import roc_auc_score, roc_curve\n\
  > import numpy as np\n> \n> # 从 UCI 数据仓库读取数据\n> xList, labels = list_read_rvm()\n\
  > \n> # x 矩阵中的行数和列数\n> nrows = len(xList)\n> ncols = len(xList[1])\n> \n> # 将 x\
  \ 和 y 转换为 numpy 数组并生成列名\n> X = np.array(xList)\n> y = np.array(labels)\n> rocksVMinesNames\
  \ = np.array(['V' + str(i) for i in range(ncols)])\n> \n> # x 矩阵中的行数和列数\n> nrows\
