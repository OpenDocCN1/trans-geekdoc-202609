  \ boosting glass classification model\n\n### 使用随机森林进行玻璃分类\n\n\n\nListing 7-8 遵循与检测地雷所用代码相似的大纲。在本示例中，采用了一种更手动的方法来处理类别不平衡，以便您可以直观地了解其工作原理。输入数据按类别分离，然后每个类别单独划分为\
  \ 70:30 的训练集和测试集。接着，各类别的训练集被汇总为一个整体训练集，测试集同理。\n\n#### Listing 7-8：构建随机森林模型以区分不同玻璃类型——glass\\\
  _rf.py\n\n```\n__author__ = 'mike_bowles'\n\nfrom math import sqrt, fabs, exp\n\
  import matplotlib.pyplot as plt\nfrom sklearn.metrics import accuracy_score, confusion_matrix,\
