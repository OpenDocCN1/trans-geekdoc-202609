  ##### 7              5               29\n# \n##### 抽取 30% 测试样本可能无法保持总体比例\n\n#####\
  \ 按标签进行分层抽样。\nxTemp = [xNum[i] for i in range(nrows) if newLabels[i] == 0]\nyTemp\
  \ = [newLabels[i] for i in range(nrows) if newLabels[i] == 0]\nxTrain, xTest, yTrain,\
  \ yTest = train_test_split(xTemp, yTemp,\ntest_size=0.30,\n                    \
  \                            random_state=531)\nfor iLabel in range(1, len(labelList)):\n\
  \    # 根据标签分离 x 和 y\n    xTemp = [xNum[i] for i in range(nrows) if newLabels[i]\
  \ == iLabel]\n    yTemp = [newLabels[i] for i in range(nrows) if newLabels[i] ==\
  \ \n                iLabel]\n\n    # 在分离出的示例子集上形成训练集和测试集\n    xTrainTemp, xTestTemp,\
  \ yTrainTemp, yTestTemp = train_test_split(xTemp, \n                           \
  \     yTemp, test_size=0.30, random_state=531)\n\n    # 累积\n    xTrain = np.append(xTrain,\
  \ xTrainTemp, axis=0)\n    xTest = np.append(xTest, xTestTemp, axis=0)\n    yTrain\
  \ = np.append(yTrain, yTrainTemp, axis=0)\n    yTest = np.append(yTest, yTestTemp,\
  \ axis=0)\n\nnum_iterations = 50\ntrees_per_iteration = 10\ndepth = None\nmaxFeat\
  \  = 4 # 尝试调整\n\nglassRFModel = ensemble.RandomForestClassifier(\n             \
  \          n_estimators=trees_per_iteration, \n                       max_depth=depth,\
  \ \n                       max_features=maxFeat,\n                       oob_score=False,\
  \ \n                       random_state=531, \n                       warm_start=True)\
  \    \n   \nmissCLassError = []\n\nfor iteration in range(num_iterations):\n   \
  \ \n    glassRFModel.fit(xTrain,yTrain)\n    glassRFModel.n_estimators += trees_per_iteration\n\
  \    \n    # 在测试集上累积 auc\n    prediction = glassRFModel.predict(xTest)\n    correct\
  \ = accuracy_score(yTest, prediction)\n  \n    missCLassError.append(1.0 - correct)\n\
  \nprint(\"Misclassification Error\" )\nprint(missCLassError[-1])\n\n##### 生成混淆矩阵\n\
  pList = prediction.tolist()\nconfusionMat = confusion_matrix(yTest, pList)\nprint('')\n\
