    - PHP is a scripting language that is especially suited for web development as\
    \ it can be embedded in HTML.\n- PHP code is executed server-side on The Cloud,\
    \ unlike JavaScript code that is executed client-side in the browser.\n- A web\
    \ server will first call upon the PHP engine to process PHP code before sending\
