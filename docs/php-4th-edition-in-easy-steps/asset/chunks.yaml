    **Making dates**


    ![image](images/pg100_1.jpg)


    The PHP **date()** function will return a date string when called, but requires
    a string argument to specify a format for the date string. This format string
    can comprise a series of letter options for date and time. For example, **date(
    ‘n/j/y’ )** might return “4/22/16”. Popular options are listed below along with
    a brief description:


    | **Option** || **Description** || **Example** |


    | --- | --- | --- |


    | **Y** || Year as four digits || 2023 |


    | **y** || Year as two digits || 14 |


    | **n** || Month as one or two digits || 7 |


    | **m** || Month as two digits || 07 |


    | **F** || Month full name || February |


    | **M** || Month name as three letters || Feb |


    | **j** || Day as one or two digits || 4 |


    | **d** || Day as two digits || 04 |


    | **l** || Weekday full name || Monday |


    | **D** || Weekday as three letters || Mon |


    | **S** || Ordinal suffix as two letters || th |


    | **H** || Hour in 24-hour format || 14 |


    | **i** || Minutes || 45 |


    | **s** || Seconds || 30 |


    | **a** || Ante or post meridiem || am |


    ![image](images/snake.jpg)


    The weekday full name option is a lowercase “L”.


    By default, the timezone is set to the Universal Time Clock (UTC) but you can
    set it to your own timezone by specifying it as an argument to the **date\_default\_timezone\_set()**
    function, and see the currently-set timezone with **date\_default\_timezone\_get()**.


    You may also create your own timestamp using the intelligent **strtotime()** function.
    This can accept a date string argument and return a timestamp that can be supplied
    as an optional second argument to the **date()** function. The argument specified
    to **strtotime()** can be a regular text date, such as “July 4, 2023”. Additionally,
    you can specify an argument such as “yesterday”, “+3months” or “next Wednesday”
    and the **strtotime()** function will try to figure it out and return an appropriate
    timestamp.


    ![image](images/hot.jpg)


    You can discover more **date()** function options in the PHP manual online at
    **[php.net/manual](http://www.php.net/manual)**


    ![image](images/1bl.jpg)Begin a PHP script with statements to display the current
    date, day, time and current default timezone


    **<?php**


    **echo ‘Date : ‘.date( ‘jS F Y’ ).’<br>’ ;**


    **echo ‘Day : ‘.date( ‘l’ ).’<br>’ ;**


    **echo ‘Time : ‘.date( ‘h:i:s a’ ).’<br>’ ;**


    **echo ‘Timezone : ‘.date\_default\_timezone\_get().’<hr>’ ;**


    ![image](images/commonbl.jpg)


