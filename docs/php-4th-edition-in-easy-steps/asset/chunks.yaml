    \ script that produced the results below when executed with various PHP configurations:\n\
    \n![image](images/pg23_2.jpg)\n\n**Summary**\n\n•PHP is a scripting language that\
    \ is especially suited for web development as it can be embedded in HTML.\n\n\
    •PHP code is executed server-side on The Cloud, unlike JavaScript code that is\
    \ executed client-side in the browser.\n\n•A web server will first call upon the\
