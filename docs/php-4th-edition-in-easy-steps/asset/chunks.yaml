    ## 评估逻辑


    ![image](img/pg50_1.jpg)


    PHP 脚本中最常用的逻辑运算符列于下表：


    | 运算符 |  |  | 操作 |

    | --- | --- | --- | --- |

    | `and` |  | `&&` | 逻辑与 |

    | `or` |  | `||` | 逻辑或 |

    | `xor` |  |  | 逻辑异或 |

    | `!` |  |  | 逻辑非 |


    逻辑运算符与具有 TRUE 或 FALSE 布尔值的操作数一起使用，或可转换为 TRUE 或 FALSE 的表达式。


    `and` 运算符将计算两个操作数，只有当两个操作数本身都为 TRUE 时才返回 TRUE。否则，`and` 运算符将返回 FALSE。这用于条件分支，其中
    PHP 脚本的方向由测试两个条件决定。如果两个条件都满足，脚本将沿某个方向进行，否则将采取不同方向。


    与需要两个操作数都为 TRUE 的 `and` 运算符不同，`or` 运算符将计算两个操作数，如果其中任一操作数本身为 TRUE，则返回 TRUE。如果两个操作数都不是
    TRUE，则 `or` 运算符将返回 FALSE。这对于在两个测试条件之一满足时执行操作很有用。


    `xor` 运算符将计算两个操作数，只有当其中一个操作数本身为 TRUE——但不是两者都为 TRUE 时才返回 TRUE。如果两个操作数都不是 TRUE，或者两个操作数都为
    TRUE，则 `xor` 运算符将返回 FALSE。


    `!` 逻辑 NOT 运算符是一个“单目”运算符——用于单个操作数之前。它返回给定操作数的反值，因此如果变量 `$var` 为 TRUE 值，则 `! $var`
    将返回 FALSE 值。`!` 运算符可用于在循环中通过类似 `$var = ! $var` 的语句切换变量的值。每次迭代时值都会反转，就像开关的开和关一样。


    ![image](img/hot.jpg)


    `&&` 运算符是 `and` 运算符的替代形式。同样，`||` 运算符是 `or` 运算符的替代形式。


    ![image](img/hot.jpg)


    术语“Boolean”指的是由英国数学家 George Boole（1815-1864）创立的逻辑思想体系。


    ![image](img/1g.jpg)

    创建一个有效的 HTML 文档，如 此处第 16 页 所列，然后在 body 部分插入 PHP 标签


    ```

