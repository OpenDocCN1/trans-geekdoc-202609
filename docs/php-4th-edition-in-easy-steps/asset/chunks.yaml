    ![image](images/pg98_1.jpg)


    PHP provides a number of built-in functions to conveniently format strings by
    manipulating their characters. The simple **strrev()** function accepts a single
    string argument and returns that string in reversed character order, so it reads
    back to front.


    The **strrpt()** function accepts two arguments to specify a string, and an integer
    of how many total times that string should be repeated in the string it will return.


    The **strpad()** function accepts three arguments to specify a string, a total
    length of the character string it will return, and a character or substring pattern
    with which to fill the difference between the original string and the specified
    returned string length. The padding will, by default, be added to the end of the
    original string but can be added to its start by adding a fourth argument using
