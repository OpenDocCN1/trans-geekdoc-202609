    \n![image](img/hot.jpg)\n\n此 `object.php` 脚本将在接下来的几页中随着新功能的加入而被修改。\n\n## 初始化成员\n\
    \n![image](img/pg110_1.jpg)\n\n程序可以通过声明类的多个实例轻松创建多个对象，并且每个对象可以通过其 setter 方法分配单独的值来具有唯一的属性。\n\
    \n通常将 setter 方法合并为一个接受每个私有变量参数的单一方法很方便。这意味着所有值都可以用程序中的单条语句分配，但该方法将包含多条语句。\n\n\
