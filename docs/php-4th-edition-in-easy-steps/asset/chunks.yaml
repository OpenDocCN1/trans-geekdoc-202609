- raw: "A byte comprises eight bits that can each contain a 1 or a 0 to store a binary\
    \ number, representing decimal values from 0 to 255. Each bit contributes a decimal\
    \ component only when that bit contains a 1. Components are designated right-to-left\
    \ from the “Least Significant Bit” (LSB) to the “Most Significant Bit” (MSB).\
    \ The binary number in the bit pattern below represents decimal 50.\n\n![image](images/pg52_1.jpg)\n\
    \n| **Bit No.** || **8  \n\nMSB** || **7** || **6** || **5** || **4** || **3**\
    \ || **2** |\n\n| --- | --- | --- | --- | --- | --- | --- | --- |\n\n| **Decimal**\
    \ || **128** || **64** || **32** || **16** || **8** || **4** || **2** |\n\n| **Binary**\
    \ || **0** || **0** || **1** || **1** || **0** || **0** || **1** |\n\nIt is possible\
    \ to manipulate individual parts of a byte using “bitwise” operators. Bitwise\
    \ operators allow evaluation and manipulation of specific bits within an integer.\n\
    \n| **Operator** || **Name** || **Binary number operation** |\n\n| --- | --- |\
    \ --- |\n\n| **|** || OR || Return a **1** in each bit where either of two compared\
    \ bits is a **1** Example: **1010 | 0101 = 1111** |\n\n| **&** || AND || Return\
    \ a **1** in each bit where both of two compared bits is a **1** Example: **1010\
    \ && 1100 = 1000** |\n\n| **~** || NOT || Return a **1** in each bit where neither\
    \ of two compared bits is a **1** Example: **~1010 = 0101** |\n\n| **^** || XOR\
    \ || Return a **1** in each bit where only one of two compared bits is a **1**\
    \ Example: **1010 ^ 0100 = 1110** |\n\n| **<<** || Shift left || Move each bit\
    \ that is a **1** a specified number of bits to the left Example: **0010 << 2\
    \ = 1000** |\n\n| **\\>>** || Shift right || Move each bit that is a **1** a specified\
    \ number of bits to the right Example: **1000 >> 2 = 0010** |\n\n![image](images/hot.jpg)\n\
    \nEach half of a byte is known as a “nibble” (4 bits). The binary Many numbers\
    \ in the examples in the table describe values stored in a nibble.\n\n![image](images/forget.jpg)\n\
    \nMany PHP programmers never use bitwise operators, but it is useful to understand\
    \ what they are and how they may be used.\n\nUnless programming for a device with\
    \ limited resources, there is seldom a need to utilize bitwise operators, but\
    \ they can be useful. For instance, the ^ (eXclusive OR) operator lets you exchange\
    \ values between two variables without the need for a third variable:\n\n![image](images/1g.jpg)Create\
    \ a valid HTML document, like the one listed [hereon page 16](#chapter01.xhtml#sec5),\
    \ then insert PHP tags into the body section\n\n**<?php**\n\n**\\# Statements\
    \ to be inserted here.**\n\n**?>**\n\n![image](images/commong.jpg)\n\nbitwise.php\n\
    \n![image](images/2g.jpg)Now, insert between the PHP tags statements to create\
    \ and initialize two variables with integer values\n\n**$x \\= 5 ; $y \\=10 ;**\n\
    \n![image](images/3g.jpg)Next, add a statement to display the assigned values\n\
    \n**echo “X : $x , Y : $y <br>” ;**\n\n![image](images/4g.jpg)Insert three XOR\
    \ statements to exchange the variable values by binary bit manipulation\n\n**$x\
    \ \\= $x ^ $y ;**\n\n**$y \\= $x ^ $y ;**\n\n**$x \\= $x ^ $y ;**\n\n![image](images/5g.jpg)Finally,\
    \ add a statement to display the manipulated values\n\n**echo “X : $x , Y : $y\
    \ <br>” ;**\n\n![image](images/6g.jpg)Save the document in your web server’s /htdocs\
    \ directory as bitwise.php then open the page via HTTP to see the XOR bitwise\
    \ magic\n\n![image](images/pg53_1.jpg)\n\n![image](images/snake.jpg)\n\nDo not\
    \ confuse bitwise operators with logical operators. Bitwise operators compare\
    \ binary numbers, whereas logical operators evaluate Boolean values.\n\n**Changing\
    \ values**\n\n![image](images/pg54_1.jpg)\n\nThe PHP ++ increment operator and\
    \ \\-- decrement operator alter the given number by 1 and return the resulting\
    \ new value. These are most often used to count iterations in a loop. The increment\
    \ operator increases the value by 1 and the decrement operator decreases the value\
    \ by 1. Each of these operators may appear either before or after the variable\
    \ containing the number to be changed – to different effect! When either of these\
    \ operators is placed before the variable (“prefixed”), they change the value\
    \ by 1 then return the modified value, but when they are placed after the variable\
    \ (“postfixed”) they return the current value, then change the value by 1:\n\n\
    ![image](images/1g.jpg)Create a valid HTML document, like the one listed [hereon\
    \ page 16](#chapter01.xhtml#sec5), then insert PHP tags into the body section\n\
    \n**<?php**\n\n**\\# Statements to be inserted here.**\n\n**?>**\n\n![image](images/commong.jpg)\n\
    \nchange.php\n\n![image](images/2g.jpg)Now, insert between the PHP tags statements\
    \ to create and initialize four variables with the same integer value\n\n**$a\
    \ \\= $b \\= $c \\= $d \\= 5 ;**\n\n![image](images/3g.jpg)Next, add statements\
    \ to change each of the values by 1 and display the new integers\n\n**echo “++A\
    \ : “. ++$a . “<br>--B : “. --$b .”<hr>“ ;**\n\n**echo “C++ : “. $c++ . “\\[now\
    \ C : “. $c .”\\]<br>“ ;**\n\n**echo “D-- : “. $d\\-- . “\\[now D : “. $d .”\\\
    ]<br>“ ;**\n\n![image](images/4g.jpg)Save the document in your web server’s /htdocs\
    \ directory as change.php then open the page via HTTP to see the results\n\n![image](images/pg54_2.jpg)\n\
    \n![image](images/hot.jpg)\n\nNotice how the . concatenation operator is used\
    \ here to form strings. You can also use the .= concatenating assignment operator\
    \ to append one string onto another string.\n\n**Grasping precedence**\n\nPHP\
    \ operator precedence determines how expressions are grouped for evaluation. For\
    \ example, the expression 1 + 5 \\* 3 evaluates to 16, not 18, because the \\\
    * multiplication operator has a higher precedence than the + addition operator.\
    \ Parentheses can be used to specify precedence, so that (1 + 5) \\* 3 evaluates\
    \ to 18. When operators have equal precedence, their “associativity” determines\
    \ how expressions are grouped. For example, the - subtraction operator is left-associative,\
    \ so 8 - 4 - 2 is grouped as (8 - 4) - 2 and evaluates to 2. The table below lists\
    \ common operators in order of precedence, with the highest-precedence ones at\
    \ the top. Operators on the same line have equal precedence, so operator associativity\
    \ determines how expressions are grouped.\n\n![image](images/pg55_1.jpg)\n\n|\
    \ **Operator** || **Associativity** |\n\n| --- | --- |\n\n| **\\*\\*** || **Right**\
    \ |\n\n| **++ -- ~** || **Right** |\n\n| **!** || **Right** |\n\n| **\\* / %**\
    \ || **Left** |\n\n| **\\+ - .** || **Left** |\n\n| **<< >>** || **Left** |\n\n\
    | **< <= > >=** || **None** |\n\n| **\\== != === !== <> <=>** || **None** |\n\n\
    | **&** || **Left** |\n\n| **^** || **Left** |\n\n| **|** || **Left** |\n\n| **&&**\
    \ || **Left** |\n\n| **||** || **Left** |\n\n| **??** || **Right** |\n\n| **?=**\
    \ || **Left** |\n\n| **\\=+= -= \\*= /= \\*\\*= .= %=  \n\n&= |= ^= <<= >>= =>**\
    \ || **Right** |\n\n| **and** || **Left** |\n\n| **xor** || **Left** |\n\n| **or**\
    \ || **Left** |\n\n| **,** || **Left** |\n\n![image](images/snake.jpg)\n\nThe\
    \ eagle-eyed will notice that the alternative forms of logical operators have\
    \ different levels of precedence. This can cause unexpected results in an expression\
    \ such as **$bool = true and false** versus the alternative **$bool = true &&\
    \ false**. Try each of these then do **var\\_dump($bool)** to see the difference.\n\
    \n**Summary**\n\n•Arithmetical operators can form expressions with operands for\
    \ addition +, subtraction \\-, multiplication \\*, division /, modulus %, and\
    \ exponentiation \\*\\*.\n\n•The assignment operator \\= can be combined with\
    \ any arithmetical operator to perform an arithmetical calculation then assign\
    \ the result.\n\n•Comparison operators can form expressions with operands for\
    \ equality \\==, inequality !=, identicality or not \\===, !==, greater \\>, less\
    \ <, greater, less or equal \\>=, <=, <=>.\n\n•The conditional operator ?: evaluates\
    \ an expression for a TRUE or FALSE Boolean value, then returns one of two specified\
    \ results depending on the evaluation.\n\n•The ?? null coalescing operator traverses\
    \ operands from left to right and returns the first value that is not null.\n\n\
    •Logical operators and, &&, or, || and xor form expressions evaluating two operands\
    \ and return a value of TRUE or FALSE."
  fmt: "\n# Byte and Bitwise Operators\n\n## Byte Representation\n\nA byte comprises\
    \ eight bits that can each contain a 1 or a 0 to store a binary number, representing\
    \ decimal values from 0 to 255. Each bit contributes a decimal component only\
    \ when that bit contains a 1. Components are designated right-to-left from the\
    \ “Least Significant Bit” (LSB) to the “Most Significant Bit” (MSB). The binary\
    \ number in the bit pattern below represents decimal 50.\n\n![image](images/pg52_1.jpg)\n\
    \n| **Bit No.** || **8**  \nMSB || **7** || **6** || **5** || **4** || **3** ||\
    \ **2** |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| **Decimal** ||\
    \ **128** || **64** || **32** || **16** || **8** || **4** || **2** |\n| **Binary**\
    \ || **0** || **0** || **1** || **1** || **0** || **0** || **1** |\n\n## Bitwise\
    \ Operators\n\nIt is possible to manipulate individual parts of a byte using “bitwise”\
    \ operators. Bitwise operators allow evaluation and manipulation of specific bits\
    \ within an integer.\n\n| **Operator** || **Name** || **Binary number operation**\
    \ |\n| --- | --- | --- |\n| `|` || OR || Return a `1` in each bit where either\
    \ of two compared bits is a `1` Example: `1010 | 0101 = 1111` |\n| `&` || AND\
    \ || Return a `1` in each bit where both of two compared bits is a `1` Example:\
    \ `1010 && 1100 = 1000` |\n| `~` || NOT || Return a `1` in each bit where neither\
    \ of two compared bits is a `1` Example: `~1010 = 0101` |\n| `^` || XOR || Return\
    \ a `1` in each bit where only one of two compared bits is a `1` Example: `1010\
    \ ^ 0100 = 1110` |\n| `<<` || Shift left || Move each bit that is a `1` a specified\
    \ number of bits to the left Example: `0010 << 2 = 1000` |\n| `>>` || Shift right\
    \ || Move each bit that is a `1` a specified number of bits to the right Example:\
    \ `1000 >> 2 = 0010` |\n\n![image](images/hot.jpg)\n\n## Nibble\n\nEach half of\
    \ a byte is known as a “nibble” (4 bits). The binary Many numbers in the examples\
    \ in the table describe values stored in a nibble.\n\n![image](images/forget.jpg)\n\
    \nMany PHP programmers never use bitwise operators, but it is useful to understand\
    \ what they are and how they may be used.\n\nUnless programming for a device with\
    \ limited resources, there is seldom a need to utilize bitwise operators, but\
    \ they can be useful. For instance, the `^` (eXclusive OR) operator lets you exchange\
    \ values between two variables without the need for a third variable:\n\n## XOR\
    \ Swap Example\n\n![image](images/1g.jpg)Create a valid HTML document, like the\
    \ one listed [hereon page 16](#chapter01.xhtml#sec5), then insert PHP tags into\
    \ the body section\n\n```\n<?php\n# Statements to be inserted here.\n?>\n```\n\
    \n![image](images/commong.jpg)\n\nbitwise.php\n\n![image](images/2g.jpg)Now, insert\
    \ between the PHP tags statements to create and initialize two variables with\
    \ integer values\n\n```\n$x = 5 ; $y =10 ;\n```\n\n![image](images/3g.jpg)Next,\
    \ add a statement to display the assigned values\n\n```\necho “X : $x , Y : $y\
    \ <br>” ;\n```\n\n![image](images/4g.jpg)Insert three XOR statements to exchange\
    \ the variable values by binary bit manipulation\n\n```\n$x = $x ^ $y ;\n$y =\
    \ $x ^ $y ;\n$x = $x ^ $y ;\n```\n\n![image](images/5g.jpg)Finally, add a statement\
    \ to display the manipulated values\n\n```\necho “X : $x , Y : $y <br>” ;\n```\n\
    \n![image](images/6g.jpg)Save the document in your web server’s `/htdocs` directory\
    \ as `bitwise.php` then open the page via HTTP to see the XOR bitwise magic\n\n\
    ![image](images/pg53_1.jpg)\n\n![image](images/snake.jpg)\n\nDo not confuse bitwise\
    \ operators with logical operators. Bitwise operators compare binary numbers,\
    \ whereas logical operators evaluate Boolean values.\n\n## Changing values\n\n\
    ![image](images/pg54_1.jpg)\n\nThe PHP `++` increment operator and `--` decrement\
    \ operator alter the given number by 1 and return the resulting new value. These\
    \ are most often used to count iterations in a loop. The increment operator increases\
    \ the value by 1 and the decrement operator decreases the value by 1. Each of\
    \ these operators may appear either before or after the variable containing the\
    \ number to be changed – to different effect! When either of these operators is\
    \ placed before the variable (“prefixed”), they change the value by 1 then return\
    \ the modified value, but when they are placed after the variable (“postfixed”)\
    \ they return the current value, then change the value by 1:\n\n![image](images/1g.jpg)Create\
    \ a valid HTML document, like the one listed [hereon page 16](#chapter01.xhtml#sec5),\
    \ then insert PHP tags into the body section\n\n```\n<?php\n# Statements to be\
    \ inserted here.\n?>\n```\n\n![image](images/commong.jpg)\n\nchange.php\n\n![image](images/2g.jpg)Now,\
    \ insert between the PHP tags statements to create and initialize four variables\
    \ with the same integer value\n\n```\n$a = $b = $c = $d = 5 ;\n```\n\n![image](images/3g.jpg)Next,\
    \ add statements to change each of the values by 1 and display the new integers\n\
    \n```\necho “++A : “. ++$a . “<br>--B : “. --$b .”<hr>“ ;\necho “C++ : “. $c++\
    \ . “[now C : “. $c .”]<br>“ ;\necho “D-- : “. $d-- . “[now D : “. $d .”]<br>“\
    \ ;\n```\n\n![image](images/4g.jpg)Save the document in your web server’s `/htdocs`\
    \ directory as `change.php` then open the page via HTTP to see the results\n\n\
    ![image](images/pg54_2.jpg)\n\n![image](images/hot.jpg)\n\nNotice how the `.`\
    \ concatenation operator is used here to form strings. You can also use the `.=`\
    \ concatenating assignment operator to append one string onto another string.\n\
    \n## Grasping precedence\n\nPHP operator precedence determines how expressions\
    \ are grouped for evaluation. For example, the expression `1 + 5 * 3` evaluates\
    \ to 16, not 18, because the `*` multiplication operator has a higher precedence\
    \ than the `+` addition operator. Parentheses can be used to specify precedence,\
    \ so that `(1 + 5) * 3` evaluates to 18. When operators have equal precedence,\
    \ their “associativity” determines how expressions are grouped. For example, the\
    \ `-` subtraction operator is left-associative, so `8 - 4 - 2` is grouped as `(8\
    \ - 4) - 2` and evaluates to 2. The table below lists common operators in order\
    \ of precedence, with the highest-precedence ones at the top. Operators on the\
    \ same line have equal precedence, so operator associativity determines how expressions\
    \ are grouped.\n\n![image](images/pg55_1.jpg)\n\n| **Operator** || **Associativity**\
    \ |\n| --- | --- |\n| `**` || **Right** |\n| `++ -- ~` || **Right** |\n| `!` ||\
    \ **Right** |\n| `* / %` || **Left** |\n| `+ - .` || **Left** |\n| `<< >>` ||\
    \ **Left** |\n| `< <= > >=` || **None** |\n| `== != === !== <> <=>` || **None**\
    \ |\n| `&` || **Left** |\n| `^` || **Left** |\n| `|` || **Left** |\n| `&&` ||\
    \ **Left** |\n| `||` || **Left** |\n| `??` || **Right** |\n| `?=` || **Left**\
    \ |\n| `= += -= *= /= **= .= %= &= |= ^= <<= >>= =>` || **Right** |\n| `and` ||\
    \ **Left** |\n| `xor` || **Left** |\n| `or` || **Left** |\n| `,` || **Left** |\n\
    \n![image](images/snake.jpg)\n\nThe eagle-eyed will notice that the alternative\
    \ forms of logical operators have different levels of precedence. This can cause\
    \ unexpected results in an expression such as `$bool = true and false` versus\
    \ the alternative `$bool = true && false`. Try each of these then do `var_dump($bool)`\
    \ to see the difference.\n\n## Summary\n\n• Arithmetical operators can form expressions\
    \ with operands for addition `+`, subtraction `-`, multiplication `*`, division\
    \ `/`, modulus `%`, and exponentiation `**`.\n\n• The assignment operator `=`\
    \ can be combined with any arithmetical operator to perform an arithmetical calculation\
    \ then assign the result.\n\n• Comparison operators can form expressions with\
    \ operands for equality `==`, inequality `!=`, identicality or not `===`, `!==`,\
    \ greater `>`, less `<`, greater, less or equal `>=`, `<=`, `<= >`.\n\n• The conditional\
    \ operator `?:` evaluates an expression for a TRUE or FALSE Boolean value, then\
    \ returns one of two specified results depending on the evaluation.\n\n• The `??`\
    \ null coalescing operator traverses operands from left to right and returns the\
    \ first value that is not null.\n\n• Logical operators `and`, `&&`, `or`, `||`\
    \ and `xor` form expressions evaluating two operands and return a value of TRUE\
    \ or FALSE.\n"
  trans: "\n# 字节和按位运算符\n\n## 字节表示\n\n一个字节包含八位，每位可以包含 1 或 0 来存储二进制数，表示从 0 到 255 的十进制值。每个位仅在该位包含\
    \ 1 时才贡献一个十进制分量。分量从右到左指定，从“最低有效位”（LSB）到“最高有效位”（MSB）。下面位模式中的二进制数表示十进制 50。\n\n![image](img/pg52_1.jpg)\n\
    \n| **位号** || **8**  \n最显著位 || **7** || **6** || **5** || **4** || **3** || **2**\
    \ |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| **十进制** || **128** ||\
    \ **64** || **32** || **16** || **8** || **4** || **2** |\n| **二进制** || **0**\
    \ || **0** || **1** || **1** || **0** || **0** || **1** |\n\n## 按位运算符\n\n可以使用“按位”运算符操作字节的各个部分。按位运算符允许对整数中的特定位进行求值和操作。\n\
    \n| **操作符** || **名称** || **二进制数运算** |\n| --- | --- | --- |\n| `|` || 或 || 在任一比较位为\
    \ `1` 的每个位中返回 `1` 示例：`1010 | 0101 = 1111` |\n| `&` || 与 || 在两个比较位均为 `1` 的每个位中返回\
    \ `1` 示例：`1010 && 1100 = 1000` |\n| `~` || 非 || 在两个比较位均不为 `1` 的每个位中返回 `1` 示例：`~1010\
    \ = 0101` |\n| `^` || 异或 || 在两个比较位中仅有一个为 `1` 的每个位中返回 `1` 示例：`1010 ^ 0100 = 1110`\
    \ |\n| `<<` || 左移 || 将每个为 `1` 的位向左移动指定数量的位 示例：`0010 << 2 = 1000` |\n| `>>` ||\
    \ 右移 || 将每个为 `1` 的位向右移动指定数量的位 示例：`1000 >> 2 = 0010` |\n\n![image](img/hot.jpg)\n\
    \n## 尼布尔\n\n字节的每一半称为“nibble”（半字节，4 位）。二进制的许多数字在表中的示例中描述了存储在 nibble 中的值。\n\n![image](img/forget.jpg)\n\
    \n许多 PHP 程序员从不使用按位运算符，但了解它们是什么以及如何使用是有用的。\n\n除非为资源有限的设备编程，否则很少需要使用按位运算符，但它们可能很有用。例如，`^`（eXclusive\
    \ OR）运算符允许您在两个变量之间交换值，而无需第三个变量：\n\n## XOR 交换示例\n\n![image](img/1g.jpg)创建一个有效的\
    \ HTML 文档，如 此处第 16 页 所列，然后在 body 部分插入 PHP 标签\n\n```\n<?php\n# Statements to be\
    \ inserted here.\n?>\n```\n\n![image](img/commong.jpg)\n\nbitwise.php\n\n![image](img/2g.jpg)现在，在\
    \ PHP 标签之间插入语句以创建并初始化两个整数值变量\n\n```\n$x = 5 ; $y =10 ;\n```\n\n![image](img/3g.jpg)接下来，添加一条语句来显示分配的值\n\
    \n```\necho “X : $x , Y : $y <br>” ;\n```\n\n![image](img/4g.jpg)插入三个 XOR 语句，通过二进制位操作交换变量值\n\
    \n```\n$x = $x ^ $y ;\n$y = $x ^ $y ;\n$x = $x ^ $y ;\n```\n\n![image](img/5g.jpg)最后，添加一条语句来显示操作后的值\n\
    \n```\necho “X : $x , Y : $y <br>” ;\n```\n\n![image](img/6g.jpg)将文档保存在 Web 服务器的\
    \ `/htdocs` 目录中，命名为 `bitwise.php`，然后通过 HTTP 打开页面以查看 XOR 位运算的魔力\n\n![image](img/pg53_1.jpg)\n\
    \n![image](img/snake.jpg)\n\n不要将按位运算符与逻辑运算符混淆。按位运算符比较二进制数，而逻辑运算符求值布尔值。\n\n## 更改值\n\
    \n![image](img/pg54_1.jpg)\n\nPHP `++` 自增运算符和 `--` 自减运算符将给定数字更改 1 并返回 resulting\
    \ 新值。这些最常用于循环中计数迭代。自增运算符将值增加 1，自减运算符将值减少 1。这些运算符中的每一个都可能出现在包含要更改的数字的变量之前或之后——效果不同！当这些运算符中的任一个放置在变量之前（“前缀”）时，它们先将值更改\
    \ 1 然后返回修改后的值，但当它们放置在变量之后（“后缀”）时，它们返回当前值，然后将值更改 1：\n\n![image](img/1g.jpg)创建一个有效的\
    \ HTML 文档，如 此处第 16 页 所列，然后在 body 部分插入 PHP 标签\n\n```\n<?php\n# Statements to be\
    \ inserted here.\n?>\n```\n\n![image](img/commong.jpg)\n\nchange.php\n\n![image](img/2g.jpg)现在，在\
    \ PHP 标签之间插入语句以创建并初始化四个变量，使其具有相同的整数值\n\n```\n$a = $b = $c = $d = 5 ;\n```\n\n\
    ![image](img/3g.jpg)接下来，添加语句以将每个值更改 1 并显示新的整数\n\n```\necho “++A : “. ++$a . “<br>--B\
    \ : “. --$b .”<hr>“ ;\necho “C++ : “. $c++ . “[now C : “. $c .”]<br>“ ;\necho\
    \ “D-- : “. $d-- . “[now D : “. $d .”]<br>“ ;\n```\n\n![image](img/4g.jpg)将文档保存在\
    \ Web 服务器的 `/htdocs` 目录中，命名为 `change.php`，然后通过 HTTP 打开页面以查看结果\n\n![image](img/pg54_2.jpg)\n\
    \n![image](img/hot.jpg)\n\n注意这里如何使用 `.` 串联运算符来形成字符串。您还可以使用 `.=` 串联赋值运算符将一个字符串附加到另一个字符串上。\n\
    \n## 理解优先级\n\nPHP 运算符优先级决定表达式如何分组以进行求值。例如，表达式 `1 + 5 * 3` 求值为 16，而不是 18，因为 `*`\
    \ 乘法运算符的优先级高于 `+` 加法运算符。可以使用括号指定优先级，以便 `(1 + 5) * 3` 求值为 18。当运算符具有相等优先级时，它们的“结合性”决定表达式如何分组。例如，`-`\
    \ 减法运算符是左结合的，所以 `8 - 4 - 2` 分组为 `(8 - 4) - 2` 并求值为 2。下表按优先级顺序列出常见运算符，优先级最高者位于顶部。同一行的运算符具有相等优先级，因此运算符结合性决定表达式如何分组。\n\
    \n![image](img/pg55_1.jpg)\n\n| **操作符** || **结合性** |\n| --- | --- |\n| `**` ||\
    \ **右** |\n| `++ -- ~` || **右** |\n| `!` || **右** |\n| `* / %` || **左** |\n| `+\
    \ - .` || **左** |\n| `<< >>` || **左** |\n| `< <= > >=` || **无** |\n| `== != ===\
    \ !== <> <=>` || **无** |\n| `&` || **左** |\n| `^` || **左** |\n| `|` || **左** |\n\
    | `&&` || **左** |\n| `||` || **左** |\n| `??` || **右** |\n| `?=` || **左** |\n|\
    \ `= += -= *= /= **= .= %= &= |= ^= <<= >>= =>` || **右** |\n| `and` || **左** |\n\
