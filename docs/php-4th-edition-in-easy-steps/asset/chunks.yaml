    For example, if you want to split a string into individual words, you can specify
    the space character as the delimiter token. The first part of the string, up to
    the delimiter token, will be returned by the function. Interestingly, the **strtok()**
    function remembers its position in the string, so subsequent calls need only specify
    the delimiter token to return the next part of the string, until no further delimiters
    are found. Splitting a string in this way can best be achieved using a loop to
    make subsequent calls to the **strtok()** function, until it reaches the end of
    the string.


