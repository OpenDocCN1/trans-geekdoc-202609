    ## 附加链接数据


    PHP 预定义的“超全局”变量，例如存储页面请求方法的 `$_SERVER` 数组变量和在用户退出前跨网站页面存储用户数据的 `$_SESSION` 数组变量，都可以在任何脚本的所有作用域中访问。


