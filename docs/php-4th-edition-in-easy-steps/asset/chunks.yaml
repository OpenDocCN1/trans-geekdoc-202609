    \ can be used for this purpose but the template named `php.ini-production` is\
    \ recommended as the default settings in that file are optimized for performance\
    \ and security. The OPcache extension is a file named `php_opcache.dll` located\
    \ in an “ext” folder within the PHP installation folder.\n\n![image](images/1b.jpg)\
    \ Navigate to your PHP installation folder then save a copy of the `php.ini-production`\
    \ file precisely as “php.ini”\n\n![image](images/common1b.jpg)\n\nphp.ini\n\n\
    ![image](images/2b.jpg) Next, open the `php.ini` file in a text editor such as\
    \ Windows’ Notepad app\n\n![image](images/3b.jpg) Now, at the end of the `php.ini`\
    \ file, add a line to specify the location of OPcache\n\n`zend_extension=C:\\\\\
    PHP\\\\ext\\\\php_opcache.dll`\n\n![image](images/4b.jpg) Then, add a line to\
    \ enable the OPcache extension\n\n`opcache.enable=1`\n\n![image](images/5b.jpg)\
    \ Save the file then restart the web server and examine the `phpinfo.php` output\
    \ to confirm OPcache is now Enabled\n\n![image](images/pg21_1.jpg)\n\n![image](images/6b.jpg)\
    \ Scroll down the Zend OPcache section to see that “Cache hits” and “Cache misses”\
    \ are both initially zero\n\n![image](images/pg21_2.jpg)\n\n![image](images/7b.jpg)\
    \ Load the `hello.php` file and re-examine the `phpinfo.php` output repeatedly\
    \ to see that “Cache misses” first increases to 1 then “Cache hits” increments\
    \ on successive occasions\n\n## Enabling JIT compilation\n\nThe OPcache extension,\
    \ described hereon pages 20-21, allows PHP to avoid repeated lexing, parsing,\
    \ and compiling, but a further performance improvement can be made using “Just\
    \ In Time” (JIT) compilation.\n\n![image](images/pg22_1.jpg)\n\nPHP’s JIT compilation\
    \ feature generates low-level CPU instructions in Assembly language code that\
    \ can be executed by many different CPU types. It transforms the OPcode into architecture-specific\
    \ machine code that can be executed directly by the system’s CPU.\n\nWhen PHP\
    \ code is first run, the OPcode being executed by the Zend VM is examined by PHP\
    \ to decide what would benefit from JIT compilation. Subsequent execution is performed\
    \ directly by the system’s CPU – bypassing the Zend VM.\n\n![image](images/pg22_2.jpg)\n\
    \nThe OPcache extension must first be enabled to use JIT compilation, and you\
    \ must specify in the PHP initialization file `php.ini` how much memory to allocate\
    \ for compiled code.\n\n![image](images/hot.jpg)\n\nJust In Time compilation is\
    \ a great new feature introduced in PHP 8.\n\n![image](images/1b.jpg) Open the\
    \ `php.ini` file in a text editor such as Windows’ Notepad app\n\n![image](images/common1b.jpg)\n\
    \nphp.ini\n\n![image](images/2b.jpg) Now, at the end of the `php.ini` file, add\
    \ a line to specify memory allocation of 100 megabytes for compiled code\n\n`opcache.jit_buffer_size=100M`\n\
    \n![image](images/3b.jpg) Save the file then restart the web server and examine\
    \ the `phpinfo.php` output to confirm JIT compilation is On\n\n![image](images/pg23_1.jpg)\n\
    \n![image](images/commonb.jpg)\n\nbench.php\n\nIt is anticipated that performance\
