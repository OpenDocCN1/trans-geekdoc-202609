    `$_SERVER[ ''PHP_SELF'' ]` is used by the example [hereon page 150](#chapter09.xhtml#sec75)
    to create a “sticky” HTML form.


    ![image](images/hot.jpg)


    `$_SERVER[ ''REQUEST_METHOD'' ]` is used by the example [hereon page 148](#chapter09.xhtml#sec74)
