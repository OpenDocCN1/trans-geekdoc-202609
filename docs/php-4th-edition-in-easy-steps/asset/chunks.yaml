  trans: "\n`<?php echo ‘First statement’ ; echo ‘Second statement’ ?>`\n\n![image](img/hot.jpg)\n\
    \n如果你愿意这样做，终止 PHP 块的最后一个语句也不会造成任何危害。\n\n## 注释规则\n\n在 PHP 脚本代码中添加注释通常是值得的，这样可以让他人更容易理解，或者在以后重新审视代码时让你自己更容易理解。PHP\
    \ 解析器会完全忽略所有空白和注释，因此你可以添加任意数量的注释，而不会对性能产生任何不利影响。\n\n单行注释可以以 `#` 井号字符开头，或者也可以以\
    \ `//` 双斜杠序列开头。\n\n多行（块）注释必须用 `/*` 和 `*/` 字符序列括起来，如 C 编程语言中所使用：\n\n```\n<?php\n\
    echo ‘First statement’ ; // A single-line comment.\n/* This is a multi-line comment\
    \  \ncontaining two lines of comment. */\necho ‘Second statement’ ;\necho ‘Final\
    \ statement’ ; # Another single-line comment.\n?>\n```\n\n![image](img/hot.jpg)\n\
    \n`//` 单行注释风格也用于 C++ 编程，而 `#` 单行注释风格也用于 Unix/Linux BASH shell 脚本。\n\n## 提高性能\n\
    \n![image](img/pg20_1.jpg)\n\n了解 PHP 引擎执行 PHP 代码时执行一系列操作是有用的：\n\n- **词法分析** –\
    \ 分析代码并生成一系列“tokens”。例如，标签 `<?php` 生成标记 `T_OPEN_TAG`，关键字 `echo` 生成标记 `T_ECHO`，而字符串\
    \ `\"Hello World!\"` 生成 `T_CONSTANT_ENCAPSED_STRING`。\n- **解析** – 将标记排列成“Abstract\
    \ Syntax Tree” (AST)。它表示应执行哪些操作。例如，打印两个数字相加结果的 AST 可能看起来像这样：\n\n```\noperation\
    \ => ECHO,\noperand => expression (\noperation => ADD,\noperand1 => 4,\noperand2\
    \ => 8\n)\n```\n- **编译** – 将抽象语法树翻译成指令性操作代码（“OPcode”）。这是在机器语言中的中间表示（IR）。\n- **执行**\
    \ – 在“Zend Virtual Machine” (VM) 上运行 OPcode。它解释 OPcode 以产生输出。\n\n每次执行 PHP 脚本时都执行所有这些步骤效率不高，因此\
    \ PHP 包含一个名为“OPcache”的扩展，可以启用以提高性能。OPcache 将 OPcodes 存储在内存中，因此词法分析、解析和编译只会在 PHP\
    \ 脚本首次执行时进行。随后，存储在内存中的低级中间表示可以立即在 Zend VM 上执行。\n\n![image](img/pg20_2.jpg)\n\n\
    要启用 OPcache，您需要编辑 PHP 的初始化文件。PHP 安装文件夹，例如 `C:\\\\PHP`，包含名为 `php.ini-development`\
    \ 和 `php.ini-production` 的文件，它们是初始化模板文件。启动时，PHP 会尝试查找并加载名为 `php.ini` 的初始化文件。可以使用任一模板文件的副本来实现此目的，但建议使用名为\
    \ `php.ini-production` 的模板，因为该文件中的默认设置针对性能和安全性进行了优化。OPcache 扩展是一个名为 `php_opcache.dll`\
    \ 的文件，位于 PHP 安装文件夹内的“ext”文件夹中。\n\n![image](img/1b.jpg) 导航到您的 PHP 安装文件夹，然后将 `php.ini-production`\
    \ 文件的副本精确保存为“php.ini”\n\n![image](img/common1b.jpg)\n\nphp.ini\n\n![image](img/2b.jpg)\
    \ 接下来，使用 Windows 的记事本等文本编辑器打开 `php.ini` 文件\n\n![image](img/3b.jpg) 现在，在 `php.ini`\
    \ 文件末尾添加一行以指定 OPcache 的位置\n\n`zend_extension=C:\\\\PHP\\\\ext\\\\php_opcache.dll`\n\
    \n![image](img/4b.jpg) 然后，添加一行以启用 OPcache 扩展\n\n`opcache.enable=1`\n\n![image](img/5b.jpg)\
    \ 保存文件然后重启 Web 服务器并检查 `phpinfo.php` 输出以确认 OPcache 现在已启用\n\n![image](img/pg21_1.jpg)\n\
    \n![image](img/6b.jpg) 向下滚动 Zend OPcache 部分，可看到“Cache hits”和“Cache misses”最初均为零\n\
    \n![image](img/pg21_2.jpg)\n\n![image](img/7b.jpg) 加载 `hello.php` 文件并反复重新检查 `phpinfo.php`\
    \ 输出，可看到“Cache misses”首先增加到 1，然后在后续访问中“Cache hits”递增\n\n## 启用 JIT 编译\n\n此处第 20-21\
    \ 页所述的 OPcache 扩展允许 PHP 避免重复的词法分析、解析和编译，但使用“Just In Time” (JIT) 编译可以进一步提高性能。\n\
    \n![image](img/pg22_1.jpg)\n\nPHP 的 JIT 编译功能生成可在许多不同 CPU 类型上执行的汇编语言代码中的低级 CPU\
    \ 指令。它将 OPcode 转换为可由系统 CPU 直接执行的特定于架构的机器代码。\n\n当 PHP 代码首次运行时，Zend VM 执行的 OPcode\
    \ 会被 PHP 检查以决定哪些部分适合 JIT 编译。后续执行直接由系统 CPU 执行——绕过 Zend VM。\n\n![image](img/pg22_2.jpg)\n\
    \n必须先启用 OPcache 扩展才能使用 JIT 编译，并且您必须在 PHP 初始化文件 `php.ini` 中指定为编译代码分配多少内存。\n\n![image](img/hot.jpg)\n\
    \n即时编译是 PHP 8 中引入的一个很棒的新功能。\n\n![image](img/1b.jpg) 使用 Windows 的记事本等文本编辑器打开 `php.ini`\
    \ 文件\n\n![image](img/common1b.jpg)\n\nphp.ini\n\n![image](img/2b.jpg) 现在，在 `php.ini`\
    \ 文件末尾添加一行以指定为编译代码分配 100 兆字节的内存\n\n`opcache.jit_buffer_size=100M`\n\n![image](img/3b.jpg)\
    \ 保存文件然后重启 Web 服务器并检查 `phpinfo.php` 输出以确认 JIT 编译已开启\n\n![image](img/pg23_1.jpg)\n\
    \n![image](img/commonb.jpg)\n\nbench.php\n\n预计在未来，对于 CPU 密集型任务（如人工智能（AI））而言，性能将变得更加重要。为了比较\
    \ OPcache 和 JIT 编译提供的性能改进，基准 PHP 脚本可能包含各种 CPU 密集型任务。此处未列出但包含在本書源代码存档中的 PHP 基准脚本在以各种\
    \ PHP 配置执行时产生了下面的结果：\n\n![image](img/pg23_2.jpg)\n\n## 摘要\n\n- PHP 是一种脚本语言，特别适合\
    \ Web 开发，因为它可以嵌入 HTML 中。\n- PHP 代码在云端服务器端执行，而不像 JavaScript 代码那样在浏览器客户端执行。\n- Web\
    \ 服务器会先调用 PHP 引擎处理 PHP 代码，然后再将响应发送到 Web 浏览器。\n- 通过在自己的计算机上安装 Web 服务器和 PHP 引擎，可以创建本地开发环境。\n\
    - `http://localhost` URL 是 `http://127.0.0.1` 数值 IP 地址的别名。\n- 访问 Abyss Web Server\
    \ 控制台需要您的用户名和密码，网址为 `http://localhost:9999`。\n- Web 服务器必须配置为识别脚本，以便通过设置接口、解释器和关联扩展参数将其定向到\
    \ PHP 引擎。\n- PHP 代码指令 `phpinfo()` 可用于提供包含您的 PHP 版本信息的网页。\n- PHP `echo` 指令会原样写入引号内包含的文本内容。\n\
    - 所有嵌入的 PHP 代码必须用 `<?php` 和 `?>` 标签括起来，以便 PHP 引擎识别。\n- PHP 语言中的每个语句都必须以 `;` 分号字符结尾。\n\
    - 单行注释可以以 `#` 井号字符开头或以 `//` 双斜杠序列开头。\n"
