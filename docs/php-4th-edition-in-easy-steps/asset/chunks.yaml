    **Inheriting properties**


    ![image](images/pg116_1.jpg)


    A PHP class can be created as a brand new class, like those in previous examples,
    or can be “derived” from an existing class. Importantly, a derived class inherits
    members of the parent (base) class from which it is derived – in addition to its
    own members.


    The ability to inherit members from a base class allows derived classes to be
    created that share certain common properties, which have been defined in the base
    class. For example, a “Polygon” base class may define width and height properties
    that are common to all polygons. Classes of “Rectangle” and Triangle” could be
    derived from the Polygon class – inheriting width and height properties, in addition
    to their own members defining their unique features.


    ![image](images/pg116_2.jpg)


    The virtue of inheritance is extremely powerful and is the second principle of
    Object Oriented Programming (OOP).


    A derived class declaration adds the extends keyword after its class name, followed
    by the name of the class from which it derives:


    ![image](images/1v.jpg)Begin a PHP script by declaring a base class named “Polygon”,
    which has two private variables initialized by the constructor, and has two public
    getter methods


    **<?php**


    **class Polygon**


    **{**


    **private $width , $height ;**


    **function \_\_construct( int $w \= 4 , int $h \= 5 )**


    **{**


    **$this->width \= $w ;**


    **$this->height \= $h ;**


    **}**


    **public function getWidth() { return $this->width ; }**


    **public function getHeight() { return $this->height ; }**


    **}**


    ![image](images/commonv.jpg)


    inheritance.php


    ![image](images/2v.jpg)After the Polygon class, declare a “Rectangle” class that
    derives from the Polygon class and adds a unique method


    **class Rectangle extends Polygon**


    **{**


    **public function area()**


    **{**


    **return ( $this->getWidth() \* $this->getHeight() ) ;**


    **}**


    **}**


    ![image](images/3v.jpg)After the Rectangle class, declare a “Triangle” class that
    derives from the Polygon class and adds a unique method


    **class Triangle extends Polygon**


    **{**


    **public function area()**


    **{**


    **return ( $this->getWidth() \* $this->getHeight() / 2 ) ;**


    **}**


    **}**


    ![image](images/4v.jpg)After the Triangle class, add two statements creating an
    instance of each derived class using default values


    **$rect \= new Rectangle() ;**


    **$trio \= new Triangle() ;**


    ![image](images/5v.jpg)Finally, add two statements to output the value returned
    by the unique method of each derived class


    **echo ‘Rectangle Area : ‘.$rect\->area().’<hr>’ ;**


    **echo ‘Triangle Area : ‘.$trio\->area() ;**


    **?>**


    ![image](images/6v.jpg)Save the document in your web server’s /htdocs directory
