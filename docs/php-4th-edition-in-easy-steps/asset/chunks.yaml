    \nThe data highlighted here is that of most interest. It can be retrieved using\
    \ each containing element name and attribute name.\n\n**Selecting components**\n\
    \n![image](images/pg184_1.jpg)\n\nHaving examined the response data retrieved\
    \ from OpenWeatherMap [hereon page 183](#chapter11.xhtml#load), selected components\
    \ can be dynamically incorporated into a PHP sticky form XML App:\n\n![image](images/1p.jpg)Begin\
    \ a PHP script by loading a page header file to provide a banner image\n\n**<?php**\n\
    \n**include( ‘includes/weather-header.html’ ) ;**\n\n![image](images/2p.jpg)Next,\
    \ add a conditional test to see if the page has been opened by form submission\n\
    \n**if( $\\_SERVER\\[ ‘REQUEST\\_METHOD’ \\] \\== ‘POST’ )**\n\n**{**\n\n**//\
    \ Statements to be inserted here (Steps 3-6).**\n\n**}**\n\n![image](images/commonp.jpg)\n\
    \nweather.php\n\n![image](images/3p.jpg)Inside the conditional test block, assign\
    \ parameter string values to four variables\n\n**$city \\= ( empty( $\\_POST\\\
    [ ‘city’ \\] ) ) ? ”New York”**\n\n**: $\\_POST\\[ ‘city’ \\] ;**\n\n**$units\
    \ \\= ‘imperial’ ;**\n\n**$mode \\= ‘xml’ ;**\n\n**$id \\= ‘28df3c64f387cf55026e0de3fb8beaa4’\
