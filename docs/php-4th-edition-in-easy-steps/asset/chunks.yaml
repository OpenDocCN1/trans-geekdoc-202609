    \n![image](img/commonv.jpg)\n\n`initializer.php`\n\n![image](img/2v.jpg) 在 `Dog`\
    \ 类声明中，用一个指定参数数据类型和默认值的单一组合 setter 方法替换三个 setter 方法\n\n```\npublic function setValues\n\
