    **Summary**


    •The fopen() function is used to create a filestream object and requires two arguments
    to specify a file name and a file mode.


    •It is good practice to provide an alternative with the die() function in case
    an attempt to create a filestream fails.


    •The fread() function is used to read a filestream created using the ‘r’ file
    mode, and the filesize() function can be used to specify the byte size of the
    file.


    •Upon completion of any file operation, the filestream must be destroyed by calling
    the fclose() function.


    •The fgets() function can be used to read a file line-by-line, and the feof()
    function can recognize the end of a file.


    •The fgetc() function can be used to read a file character-by-character and will
    return false at the end of the file.


    •Text can be written into a file by specifying the filestream and the file name
    as arguments to the fwrite() function.


    •The fwrite() function will overwrite existing text using the ‘w’ file mode but
    will append text when using the ‘a’ file mode.


    •The name of a function can be specified as the argument to the set\_error\_handler()
    function to nominate it as a custom error handler.


    •The error handler function is called when an error occurs or can be called explicitly
    using the trigger\_error() function.


    •An exception is thrown when a specific error condition occurs.


    •If an exception is not caught, PHP will treat it as a fatal error and issue an
    Uncaught Exception message.


    •A try code block is used to anticipate a specific error, and its associated catch
    block is used to determine how the script should proceed when that error occurs.


    •An Exception class object has getMessage(), getFile() and getLine() methods that
    can retrieve exception details.


    •A custom exception handler can be created as a derived class of the Exception
    class to provide custom exception methods.


