    ## 制作日期


    ![image](img/pg100_1.jpg)

    PHP `date()` 函数在调用时会返回一个日期字符串，但需要一个字符串参数来指定日期字符串的格式。此格式字符串可以包含一系列用于日期和时间的字母选项。例如，`date(
    ‘n/j/y’ )` 可能返回“4/22/16”。下面列出了常用选项以及简要说明：


    | 选项 | 描述 | 示例 |

    | --- | --- | --- |

    | Y | 四位数年份 | 2023 |

    | y | 两位数年份 | 14 |

    | n | 一或两位数月份 | 7 |

    | m | 两位数月份 | 07 |

    | F | 月份全名 | February |

    | M | 月份三字母名称 | Feb |

    | j | 一或两位数日期 | 4 |

    | d | 两位数日期 | 04 |

    | l | 星期全名 | Monday |

    | D | 星期三字母缩写 | Mon |

    | S | 序数后缀 | th |

    | H | 24 小时制小时 | 14 |

    | i | 分钟 | 45 |

    | s | 秒 | 30 |

    | a | 上午或下午 | am |


    ![image](img/snake.jpg)

    星期全名选项是小写的“L”。


    默认情况下，时区设置为通用时间时钟（UTC），但你可以通过将其指定为 `date_default_timezone_set()` 函数的参数来设置自己的时区，并使用
    `date_default_timezone_get()` 查看当前设置的时区。


    你也可以使用智能的 `strtotime()` 函数创建自己的时间戳。此函数可以接受一个日期字符串参数并返回一个时间戳，该时间戳可以作为 `date()`
    函数的可选第二个参数提供。指定给 `strtotime()` 的参数可以是常规文本日期，例如“July 4, 2023”。此外，你可以指定诸如“yesterday”、“+3months”或“next
    Wednesday”之类的参数，`strtotime()` 函数会尝试解析并返回适当的时间戳。


    ![image](img/hot.jpg)

    你可以在 PHP 手册在线上发现更多 `date()` 函数选项，网址为 [php.net 手册](http://www.php.net/manual)


    ![image](img/1bl.jpg)

    使用语句开始一个 PHP 脚本以显示当前日期、星期、时间以及当前默认时区


