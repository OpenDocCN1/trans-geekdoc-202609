    PHP variables can store various types of data so it is useful to clearly understand
    each data type in detail:


    •**string** – a series of characters in which each character is the size of one
    byte, up to a maximum length of 2GB. Strings enclosed in single quotes are treated
    as literals, whereas strings in double quotes will interpret special characters.


    •**int** – a non-decimal number between 2,147,483,648 and -2,147,483,647, specified
    as a decimal (10-based), hexadecimal (16-based – prefixed with 0x), or octal (8-based
    – prefixed with 0).


    •**float** – a floating-point decimal number or a number in exponential format.
    A float is also known as a “double”.


    •**bool** – an expression of a Boolean truth value, which may be only true or
    false.


    •**array** – an ordered map of multiple data values that associates keys to values.
    The keys are index numbered by default or may be explicitly-specified labels.


    •**object** – a class containing stored data properties and providing methods
    to process data.


    •**resource** – a reference to an external resource that is created and used by
    special functions.


    •**NULL** – a variable with no value whatsoever. It may have not been initialized,
    have been assigned the NULL constant, or have been nullified by the PHP unset()
    function.


