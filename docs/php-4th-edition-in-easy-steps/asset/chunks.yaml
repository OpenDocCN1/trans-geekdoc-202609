    # OpenWeatherMap XML Response Handling


    The response from OpenWeatherMap can be delivered as an XML file that may be written
    into the web server’s `/htdocs` folder using the PHP `asXml()` function to specify
    a filename. This can be examined in the web browser to discover the nature of
    the data retrieved, the XML element names, attribute names and structure:


    ![image](images/1p.jpg)

    Begin a PHP script by assigning string values to four variables, which will be
    used to set response parameters


    ```

    <?php

    $city \= ‘New York’ ;

    $units \= ‘imperial’ ;

    $mode \= ‘xml’ ;

    $id \= ‘28df3c64f387cf55026e0de3fb8beaa4’ ;

    ```


    ![image](images/commonp.jpg)


    param.php


    ![image](images/2p.jpg)

    Next, add a statement to build a request string using specified parameter values


    ```

    $request \=

    ‘http://api.openweathermap.org/data/2.5/forecast?’.

    ‘q=’.$city.’&units=’.$units.’&mode=’.$mode.’&APPID=’.$id ;

    ```


    ![image](images/3p.jpg)

    Now, add a statement to load XML data using the request string parameters, or
    quit


    ```

    $xml \= simplexml_load_file( $request )

    or die( ‘Unable to load data!’ ) ;

    ```


    ![image](images/4p.jpg)

    When a response is received, attempt to write the content as an XML file in the
    web server’s `/htdocs` directory


    ```

    try

    {

    $xml->asXml( ‘params.xml’ ) ;

    // Statement to be inserted here (Step 5).

    }

    catch( Exception $e )

    {

    echo ‘Error : ‘.$e->getMessage() ;

    }

    ```


    ![image](images/pg174_2.jpg)


    params.xml


    ![image](images/5p.jpg)

    Insert a statement to relocate the browser to view the newly created XML document


    ```

    header( ‘Location: params.xml’ ) ;

    ```


    ![image](images/6p.jpg)

    Save the PHP script in your web server’s `/htdocs` directory as `params.php` then
    open the page via HTTP to examine the XML content of the retrieved response


    ![image](images/pg183_1.jpg)


    ![image](images/forget.jpg)


    The response will only contain weather data for prevailing conditions.


    ![image](images/pg183_2.jpg)


    The data highlighted here is that of most interest. It can be retrieved using
    each containing element name and attribute name.


    ## Selecting components


    ![image](images/pg184_1.jpg)


    Having examined the response data retrieved from OpenWeatherMap [hereon page 183](#chapter11.xhtml#load),
    selected components can be dynamically incorporated into a PHP sticky form XML
    App:


    ![image](images/1p.jpg)

    Begin a PHP script by loading a page header file to provide a banner image


    ```

    <?php

    include( ‘includes/weather-header.html’ ) ;

    ```


    ![image](images/2p.jpg)

    Next, add a conditional test to see if the page has been opened by form submission


    ```

    if( $_SERVER[ ‘REQUEST_METHOD’ ] == ‘POST’ )

    {

    // Statements to be inserted here (Steps 3-6).

    }

    ```


    ![image](images/commonp.jpg)


    weather.php


    ![image](images/3p.jpg)

    Inside the conditional test block, assign parameter string values to four variables


    ```

    $city \= ( empty( $_POST[ ‘city’ ] ) ) ? ”New York”

    : $_POST[ ‘city’ ] ;

    $units \= ‘imperial’ ;

    $mode \= ‘xml’ ;

    $id \= ‘28df3c64f387cf55026e0de3fb8beaa4’ ;

    ```


    ![image](images/4p.jpg)

    Next, inside the conditional test block, insert a statement to build a request
    string using specified parameter values


    ```

    $request \=

    ‘http://api.openweathermap.org/data/2.5/weather?’.

    ‘q=’.$city.’&units=’.$units.’&mode=’.$mode.’&APPID=’.$id ;

    ```


    ![image](images/5p.jpg)

    Now, inside the conditional test block, insert a statement to load XML data using
    the parameters, or quit


    ```

    $xml \= simplexml_load_file( $request )

    or die( ‘Unable to load data!’ ) ;

    ```


    ![image](images/6p.jpg)

    Finally, insert statements to output retrieved data


    ```

    $icon \= ‘http://openweathermap.org/img/w/’.

    $xml->weather[ ‘icon’ ].’.png’ ;

    echo ‘<h1>Today in ‘.$xml->city[ ‘name’ ] ;

    echo ‘ it\’s ‘.$xml->weather[ ‘value’ ].

    ’<img src=’.$icon.’></h1>’ ;

    echo ‘<ul><li>Temperature : ‘.$xml->temperature[‘value’] ;

    echo ‘&deg; ‘.$xml->temperature[ ‘unit’ ] ;

    echo ‘<li>Wind : ‘.$xml->wind->speed[ ‘name’ ] ;

    echo ‘<li>Humidity : ‘.$xml->humidity[‘value’].’&#37;</ul>’ ;

    ```


    ![image](images/hot.jpg)


    Notice that a default city value is assigned in case the form is submitted without
    user input.


    ![image](images/hot.jpg)


    The value of the `icon` attribute is the name of a PNG image file. When concatenated
    to the path and `.png` file extension, it provides an appropriate weather image.


    ![image](images/7p.jpg)

    After the test block, add statements to create a form


    ```

    echo ‘<form method=”POST” action=”weather.php”>’ ;

    echo ‘<fieldset><legend>Enter City Name</legend>’ ;

    echo ‘<input type=”text” name=”city”>’ ;

    echo ‘<input type=”submit”

    name=”submission” value = ”Get Weather”>’ ;

    echo ‘</fieldset></form>’ ;

    ```


    ![image](images/8p.jpg)

    Finally, in the script, load a page footer file to display icons denoting the
    technologies employed by this app


    ```

    include( ‘includes/weather-footer.html’ ) ;

    ```


    ![image](images/pg181_1.jpg)


    weather-header.html


    weather-footer.html


    ![image](images/9p.jpg)

    Save the PHP script in your web server’s `/htdocs` directory as `weather.php`
    then open the page via HTTP and submit the form to see weather for the default
    New York location. Enter another city name and resubmit to see that city’s weather
    report


    ![image](images/pg185_1.jpg)


    ![image](images/pg181_3.jpg)


    iesweather.png


    tech.png


    ![image](images/pg185_2.jpg)


    ![image](images/forget.jpg)


    The `action` attribute specifies this script file to make the form sticky.


    ## Summary


    • XML elements must each have an opening and closing tag and be correctly nested
    to be well-formed.

    • PHP has an XML parser called `SimpleXML` that can load an XML document into
    memory as a hierarchical tree structure.

    • The `simplexml_load_file()` function creates a data structure of `SimpleXMLElement`
    objects.

    • The data structure of a `SimpleXML` object describes a parent-child relationship
    between outer and inner XML elements.

    • Each member of a `SimpleXML` data structure is a node.

    • Top-level nodes are direct child descendants of the `SimpleXML` object itself.

    • Nodes can be referenced using the `->` object operator to address each generation
    of the hierarchical tree structure.

    • The `children()` method returns all child nodes and can be used to loop through
    tree nodes to retrieve each node’s content.

    • Attributes can be referenced by stating the attribute name, within quotes, between
    brackets following the node name.

    • RSS feeds deliver regularly updated data in XML format.

    • XML feeds are typically XML documents containing a top-level `<channel>` element
    that encloses `<item>` elements.

    • Web Services may provide a static URL or an API that allows you to specify parameters
    in the URL request.

    • Parameter values are specified by an `=` character and are appended to a URL
    after a `?` and are separated by an `&`.

    • A `SimpleXML` object can be written as an XML file on the server using the `asXml()`
    function.

    • Selected components of a `SimpleXML` object can be dynamically incorporated
    into a PHP application.


    [![image](images/ibc1.jpg)](https://iescourses.com/)


    [![image](images/ibc.jpg)](http://www.ineasysteps.com)


    [![image](images/bcover.jpg)](http://www.ineasysteps.com)

