    \nIt does no harm to terminate the last statement of a PHP block if you wish to\
    \ do so.\n\n**Comment rules**\n\nIt is often worthwhile adding comments to your\
    \ PHP script code so it can be more easily understood by others, or by yourself\
    \ when revisiting your code later. All whitespace and comments are completely\
    \ ignored by the PHP parser so you can add as many comments as you like, without\
    \ any adverse effect on performance.\n\nSingle-line comments may begin with a\
    \ **#** hash character, or alternatively they may begin with a **//** double-slash\
    \ sequence.\n\nMulti-line (block) comments must be enclosed within **/\\*** and\
    \ **\\*/** character sequences, as used in the C programming language:\n\n**<?php**\n\
    \n**echo ‘First statement’ ; // A single-line comment.**\n\n**/\\* This is a multi-line\
    \ comment  \n\ncontaining two lines of comment. \\*/**\n\n**echo ‘Second statement’\
    \ ;**\n\n**echo ‘Final statement’ ; \\# Another single-line comment.**\n\n**?>**\n\
    \n![image](images/hot.jpg)\n\nThe **//** single-line comment style is also used\
    \ in C++ programming and the **#** single-line comment style is also used in Unix/Linux\
    \ BASH shell scripting.\n\n**Improving performance**\n\n![image](images/pg20_1.jpg)\n\
    \nIt is useful to understand that the PHP engine performs a sequence of operations\
    \ in order to execute your PHP code:\n\n•**Lexing** – analyzes the code and generates\
    \ a series of “tokens”. For example, the tag **<?php** generates the token **T\\\
    _OPEN\\_TAG**, the keyword **echo** generates the token **T\\_ECHO** and the string\
    \ **“Hello World!”** generates **T\\_CONSTANT\\_ENCAPSED\\_STRING**.\n\n•**Parsing**\
    \ – arranges the tokens into an “Abstract Syntax Tree” (AST). This represents\
    \ what operations should be performed. For example, the AST to print the result\
    \ of adding two numbers might look something like this:\n\n**operation => ECHO,**\n\
    \n**operand => expression (**\n\n**operation => ADD,**\n\n**operand1 => 4,**\n\
    \n**operand2 => 8**\n\n**)**\n\n•**Compiling** – translates the Abstract Syntax\
    \ Tree into instructional operation code (“OPcode”). This is an Intermediate Representation\
    \ (IR) in machine language.\n\n•**Executing** – runs the OPcode on the “Zend Virtual\
    \ Machine” (VM). This interprets the OPcode to produce output.\n\nPerforming all\
    \ these steps each time to execute a PHP script is not very efficient, so PHP\
    \ includes an extension named “OPcache” that can be enabled to improve performance.\
    \ OPcache stores OPcodes in memory so that lexing, parsing and compiling will\
    \ only be performed when the PHP script is first executed. Subsequently, the low-level\
    \ Intermediate Representation stored in memory can be executed on the Zend VM\
    \ immediately.\n\n![image](images/pg20_2.jpg)\n\nTo enable OPcache you will need\
    \ to edit PHP’s initialization file. The PHP installation folder, such as **C:\\\
    \\PHP**, contains files named **php.ini-development** and **php.ini-production**,\
    \ which are initialization template files. When starting, PHP tries to find and\
    \ load an initialization file named **php.ini**. A copy of either of the template\
    \ files can be used for this purpose but the template named **php.ini-production**\
    \ is recommended as the default settings in that file are optimized for performance\
    \ and security. The OPcache extension is a file named **php\\_opcache.dll** located\
    \ in an “ext” folder within the PHP installation folder.\n\n![image](images/1b.jpg)Navigate\
    \ to your PHP installation folder then save a copy of the **php.ini-production**\
    \ file precisely as “php.ini”\n\n![image](images/common1b.jpg)\n\nphp.ini\n\n\
    ![image](images/2b.jpg)Next, open the **php.ini** file in a text editor such as\
    \ Windows’ Notepad app\n\n![image](images/3b.jpg)Now, at the end of the **php.ini**\
    \ file, add a line to specify the location of OPcache\n\n**zend\\_extension=C:\\\
    \\PHP\\\\ext\\\\php\\_opcache.dll**\n\n![image](images/4b.jpg)Then, add a line\
    \ to enable the OPcache extension\n\n**opcache.enable=1**\n\n![image](images/5b.jpg)Save\
    \ the file then restart the web server and examine the **phpinfo.php** output\
    \ to confirm OPcache is now Enabled\n\n![image](images/pg21_1.jpg)\n\n![image](images/6b.jpg)Scroll\
    \ down the Zend OPcache section to see that “Cache hits” and “Cache misses” are\
    \ both initially zero\n\n![image](images/pg21_2.jpg)\n\n![image](images/7b.jpg)Load\
    \ the **hello.php** file and re-examine the **phpinfo.php** output repeatedly\
    \ to see that “Cache misses” first increases to 1 then “Cache hits” increments\
    \ on successive occasions\n\n**Enabling JIT compilation**\n\nThe OPcache extension,\
    \ described [hereon pages 20-21](#chapter01.xhtml#sec7), allows PHP to avoid repeated\
    \ lexing, parsing, and compiling, but a further performance improvement can be\
    \ made using “Just In Time” (JIT) compilation.\n\n![image](images/pg22_1.jpg)\n\
    \nPHP’s JIT compilation feature generates low-level CPU instructions in Assembly\
    \ language code that can be executed by many different CPU types. It transforms\
    \ the OPcode into architecture-specific machine code that can be executed directly\
    \ by the system’s CPU.\n\nWhen PHP code is first run, the OPcode being executed\
    \ by the Zend VM is examined by PHP to decide what would benefit from JIT compilation.\
    \ Subsequent execution is performed directly by the system’s CPU – bypassing the\
    \ Zend VM.\n\n![image](images/pg22_2.jpg)\n\nThe OPcache extension must first\
    \ be enabled to use JIT compilation, and you must specify in the PHP initialization\
    \ file **php.ini** how much memory to allocate for compiled code.\n\n![image](images/hot.jpg)\n\
    \nJust In Time compilation is a great new feature introduced in PHP 8.\n\n![image](images/1b.jpg)Open\
    \ the **php.ini** file in a text editor such as Windows’ Notepad app\n\n![image](images/common1b.jpg)\n\
    \nphp.ini\n\n![image](images/2b.jpg)Now, at the end of the **php.ini** file, add\
    \ a line to specify memory allocation of 100 megabytes for compiled code\n\n**opcache.jit\\\
    _buffer\\_size=100M**\n\n![image](images/3b.jpg)Save the file then restart the\
    \ web server and examine the **phpinfo.php** output to confirm JIT compilation\
    \ is **On**\n\n![image](images/pg23_1.jpg)\n\n![image](images/commonb.jpg)\n\n\
    bench.php\n\nIt is anticipated that performance will become more important in\
    \ the future for CPU-intensive tasks such as Artificial Intelligence (AI). To\
