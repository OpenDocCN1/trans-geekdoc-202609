    ## 按规则脚本编写


    ![image](img/pg18_1.jpg)


    ### 标签规则


    当 PHP 引擎从 Web 服务器接收输入时，它会从上到下读取输入，此过程称为“解析”。在解析过程中，PHP 引擎（又名解析器）会查找开始和结束的 `<?php`
    和 `?>` 标签，并理解这些标签之间的内容是它必须解释的脚本代码。 `<?php` 和 `?>` 标签之外的所有内容都将被完全忽略，这允许 PHP 文件具有混合内容，并允许
    PHP 代码嵌入 HTML 中，如下所示：


