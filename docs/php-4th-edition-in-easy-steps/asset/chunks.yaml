    ## Summary


    - The `if` keyword performs the basic conditional test that evaluates an expression
    for a Boolean value of `TRUE` or `FALSE`.

    - Statements within braces following the evaluation will only be executed when
    the expression is found `TRUE`.

    - Multiple expressions can be tested using the logical `&&` operator, or by nesting
    multiple `if` conditional tests.

    - The `else` keyword specifies statements to be executed when the expression evaluated
    by the `if` statement is found `FALSE`.

    - The `elseif` keyword is used to append an alternative expression to be evaluated
    and statements to be executed when `TRUE`.

    - Multiple `if`-`elseif`-`else` statements can often be performed more efficiently
    by a `switch` statement.

    - Each `case` statement specifies a value to be matched in a `switch` statement
    block and must end with a `break` keyword.

    - A `default` statement specifies code to be executed in the event that no matches
    are found within any `case` statements.

    - A `match` statement is a single expression that returns a value when it finds
    a match to its specified parameter.

    - A loop is a piece of code in a script that automatically repeats until a test
    expression becomes `FALSE`.

    - The PHP loop structures are `for`, `while`, `do while` and `foreach`.

    - A `for` loop structure specifies an initializer, a test expression and an updater
    that increments (or decrements) a counter.

    - An updater must always be included in the statement block of a `while` loop
    and a `do while` loop.

    - Unlike a `while` loop, a `do while` loop will always execute its statements
    at least once.

    - The `break` keyword can be used to prematurely terminate a loop when a specified
    condition is met.

    - The `continue` keyword can be used to skip a single iteration of a loop when
    a specified condition is met.


