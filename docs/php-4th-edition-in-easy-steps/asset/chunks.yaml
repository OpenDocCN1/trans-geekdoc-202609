    \n`$this->age \\= $yrs ;`\n\n`$this->weight \\= $lbs ;`\n\n`$this->color \\= $fur\
    \ ;`\n\n![image](img/4v.jpg) 在修改后的类定义之后，用对组合 setter 方法的单次调用替换对三个 setter 方法的调用\
