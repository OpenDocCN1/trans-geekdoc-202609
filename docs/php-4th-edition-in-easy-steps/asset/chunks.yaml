    # 生成表单


    *本章演示如何使用 PHP 脚本来处理 HTML 表单数据。*


    **执行操作**

    **检查已设置的值**

    **验证表单数据**

    **过滤数据**

    **发送隐藏数据**

    **处理提交**

    **制作粘性表单**

    **上传文件**

    **环绕表单**

    **附加链接数据**

    **摘要**


    ## 执行操作


    从网页上的 HTML 表单提交的数据处理可能是 PHP 脚本执行的任务中最基础的。


    ![image](img/pg138_1.jpg)


    HTML `<form>` 标签的 `action` 属性用于指定将处理（“处理”）表单数据的 PHP 脚本。此外，`<form>` 标签的 `method`
    属性用于指定数据如何发送到脚本——通常通过 POST 方法。因此，HTML 表单标签和属性可能如下所示：


    ```

    <form action="script.php" method="POST">

    ```


    PHP 提供了一个特殊的“超全局” `$_POST` 数组变量，用于存储通过 POST 方法提交的表单数据。它为每个提交的表单元素名称创建同名的数组元素，存储其包含的值。例如，使用此表单元素：


    ```

    <input type="text" name="email" >

    ```


    提交表单时，PHP 将创建一个名为 `$_POST[''email'']` 的数组元素，其中包含用户输入到该表单输入中的值。


    ![image](img/snake.jpg)


    这是区分大小写的，因此大写必须精确如所述——例如 `$_POST[''EMail'']` 或 `$_Post[''email'']` 是不正确的。


    为了便于识别，可以将与表单元素同名的 PHP 变量赋值为其对应 `$_POST` 数组元素中存储的值。然后，这些值可以在由操作处理程序脚本创建的响应页面中显示：


    ![image](img/1r.jpg)

    创建一个包含三个文本输入字段用于数据提交的 HTML 文档

    ```

    <form action="action_handler.php" method="POST">

    <dl>

    <dt>Name:

    <dd><input type="text" name="name">

    <dt>Email Address:

    <dd><input type="text" name="mail">

    <dt>Comments:

    <dd><textarea rows="5" cols="20" name="comment" >

    </textarea>

    </dl>

    <p><input type="submit" ></p>

    </form>

    ```

    ![image](img/commonr.jpg)


    `action.php`


    ![image](img/2r.jpg)

    现在，将文档保存在你的 Web 服务器的 `/htdocs` 目录中，命名为 `action.php`


    ![image](img/3r.jpg)

    接下来，创建一个包含脚本的 HTML 文档，用于将表单值赋给同名的 PHP 变量以输出

    ```

    <?php

    $name = $_POST[''name''] ;

    $mail = $_POST[''mail''] ;

    $comment = $_POST[''comment''] ;

    echo "<p>Thanks for this comment $name …</p>" ;

    echo "<p><i>$comment</i></p>" ;

    echo "<p>We will reply to $mail</p>" ;

    ?>

    ```

    ![image](img/commonr.jpg)


    `action_handler.php`


    ![image](img/4r.jpg)

    将文档保存在你的 Web 服务器的 `/htdocs` 目录中，命名为 `action_handler.php`，然后通过 HTTP 打开 `action.php`
    并提交一些数据，以查看它在 PHP 脚本生成的响应页面中显示


    ![image](img/pg139_1.jpg)


    ![image](img/pg139_2.jpg)


    ![image](img/hot.jpg)


    表单提交方法可以是“GET”或“POST”。`GET` 方法会将 name=value 对附加到 URL，但主要用于请求信息——例如检索数据库记录。`POST`
    方法可以提交更多数据，更安全，因为数据不会附加到 URL，并且主要用于执行操作时——例如更新数据库记录。因此，`POST` 方法是本书大多数示例的首选。


    ## 检查已设置的值


    PHP 可以使用内置的 `isset()` 函数轻松确保用户已向提交的 HTML 表单字段中输入数据。此函数以变量名作为参数，仅在该变量值不为 NULL 时返回
    TRUE——从而确保变量已用某个值“设置”。除非用户输入了值，否则空表单字段将为 NULL。


    ![image](img/pg140_1.jpg)

