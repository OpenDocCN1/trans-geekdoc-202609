  trans: "\n# 按引用传递\n\n如果你希望函数修改在函数调用中指定的变量所存储的数据，你必须按“引用”传递它。这允许函数直接操作原始数据。当按引用传递时，修改参数会影响变量中的原始数据。为了确保参数始终按引用传递给函数，只需在函数定义中参数名前加上\
