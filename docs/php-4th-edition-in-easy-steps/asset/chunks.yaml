- raw: '**interface *InterfaceName***


    **{**


    **// Method definitions only go here.**


    **}**


    ![image](images/forget.jpg)


    Method definitions in a interface declaration may also specify parameters.


    Each class that implements an interface must implement all the methods it defines
    by specifying their statements to be executed. A class is attached to an interface
    by including the implements keyword and interface name in its declaration, like
    this:


    **class *ClassName* implements *InterfaceName***


    **{**


    **// Method implementations go here.**


    **}**


    The previous example can be modified to embrace polymorphism by adding an interface
    and a single function.


    ![image](images/1v.jpg)Rename a copy of the previous example “inheritance.php”
    as a new program “polymorphism.php”


    ![image](images/commonv.jpg)


    polymorphism.php


    ![image](images/2v.jpg)Declare an interface named “Shape”, which contains a definition
    for the methods already implemented in the Rectangle and Triangle classes


    **interface Shape { public function area() ; }**


    ![image](images/3v.jpg)Edit the first line of the Rectangle and Triangle class
    declarations – to associate them with the interface


    **class Rectangle extends Polygon implements Shape**


    **class Triangle extends Polygon implements Shape**


    ![image](images/4v.jpg)After the class blocks, add a function that accepts an
    argument of the Shape type and calls its defined method


    **function getArea( Shape $shape )**


    **{ return $shape\->area() ; }**


    ![image](images/5v.jpg)Edit the two statements creating an instance of each derived
    class – to pass in argument values


    **$rect \= new Rectangle( 8 , 10 ) ;**


    **$trio \= new Triangle( 8 , 10 ) ;**


    ![image](images/6v.jpg)Finally, edit the two statements to output the value returned
    by the unique method of each derived class, by calling each method via the interface


    **echo ‘Rectangle Area : ‘.getArea( $rect ).’<hr>’ ;**


    **echo ‘Triangle Area : ‘.getArea( $trio ) ;**


    ![image](images/7v.jpg)Save the document in your web server’s /htdocs directory
    as polymorphism.php then open the page via HTTP to see the output via a polymorphic
    interface


    ![image](images/pg119_1.jpg)


    ![image](images/hot.jpg)


    What’s going on here?


    Each call to the new **getArea()** function passes an instance object as an argument.


    The **getArea()** function calls the **area()** method defined in the interface.


    The output is returned from the implementation of the **area()** method of the
    associated instance.


    **Chaining method calls**


    ![image](images/pg120_1.jpg)


    You may often want to call a method, or get a property, only if the result of
    one or more tested expressions are not null. This can quickly lead to deeply nested
    conditional tests, like these:


    **$country = null ;**


    **if( $session !== null )**


    **{**


    **$user = $session->user ;**


    **if ( $user !== null )**


    **{**


    **$address = $user->getAddress() ;**


    **if( $address !== null )**


    **{**


    **$country = $address->country ;**


    **}**


    **}**


    **}**


    ![image](images/hot.jpg)


    The **?->** nullsafe operator is a great new feature introduced in PHP 8.


    The same series of conditional tests can be made more concisely in a single chain
    using the PHP ?-> “nullsafe” operator, like this:


    **$country = $session?->user?->getAddress()?->country ;**


    The chain is evaluated from left to right. When the item at the left of the nullsafe
    operator evaluates to null, the execution of the entire chain stops immediately
    and the chain evaluates to null.


    ![image](images/1v.jpg)Begin a PHP script by declaring a class that assigns a
    null value to a property


    **class Session**


    **{**


    **public $user ;**


    **function construct() { $this->user \= null ; }**


    **}**


    ![image](images/commonv.jpg)


    nullsafe.php


    ![image](images/2v.jpg)Declare a class containing a method to return an object


    **class User**


    **{**


    **public function getAddress() { return new Address() ; }**


    **}**


    ![image](images/3v.jpg)Declare a class that assigns a string value to a property


    **class Address**


    **{**


    **public $country ;**


    **function construct() { $this->country \= ‘USA’ ; }**


    **}**


    ![image](images/4v.jpg)Then, create an instance of the class declared in Step
    1


    **$session \= new Session() ;**


    ![image](images/5v.jpg)Finally, add a chain statement without nullsafe operators
    that attempts to output the **string** property


    **$country \= $session\->user\->getAddress()->country ;**


    **echo ‘Location: ‘.$country ;**


    ![image](images/6v.jpg)Save the document in your web server’s /htdocs directory
    as nullsafe.php then open the page via HTTP to see the attempt fail with a fatal
    error message


    ![image](images/pg121_1.jpg)


    ![image](images/7v.jpg)Edit the chain statement in Step 5 to add nullsafe operators,
    then save the script and refresh the browser to see the attempt fail gracefully


    **$country \= $session?->user?->getAddress()?->country ;**


    ![image](images/pg121_2.jpg)


    ![image](images/8v.jpg)Edit the assignment in Step 1 to assign an object to the
    property, then save the script once more and refresh the browser to see the attempt
    succeed


    **function\_\_construct() { $this->user \= new User() ; }**


    ![image](images/pg121_3.jpg)


    ![image](images/hot.jpg)


    Skipping evaluation of the remainder of the chain when an item in a chain evaluates
    to **null** is known as “short circuiting”. When the item at the left hand side
    of the nullsafe operator does not evaluate to **null**, execution continues to
    evaluate the next item in the chain until the end of the chain is reached.


    **Summary**


    •A PHP class is a data structure that can contain both variables and functions
    in a single entity.


    •Classes are declared using the class keyword and can contain member variable
    properties and member function methods.


    •Access to class members from outside the class is controlled by the public, private
    or protected access specifier keywords.


    •Variable properties are encapsulated by declaring them private so their values
    can only be accessed by public methods.


    •In order to create an object you must declare an instance of a class data structure
    using the new keyword.


    •The special \-> object operator can be used to reference any visible class member.


    •Setter and getter methods can reference a member of the same class using the
    $this pseudo-variable.


    •The\_\_construct() constructor method is called when a class is created and can
    be used to initialize variable properties.


    •Adding public, private or protected access specifiers for constructor parameters
    can promote properties to the class.


    •The\_\_destruct() destructor method is called when a class is destroyed and can
    be used to execute final statements.


    •PHP has functions to interrogate classes, listing methods with get\_class\_methods()
    and variables with get\_class\_vars().


    •The three cornerstones of Object Oriented Programming are encapsulation, inheritance,
    and polymorphism.


    •A derived class declaration will include the extends keyword to specify a base
    class from which to inherit members.


    •An interface is declared using the interface keyword and the declaration may
    contain only method definitions.


    •A class is attached to an interface by including the implements keyword and interface
    name in its declaration.


    •Conditional tests for null values can be made concisely in a single chain using
    the PHP ?-> “nullsafe” operator.


    **8**


    **Handling files**


    ***This chapter demonstrates how to read and write files with PHP and how to deal
    with errors in scripts.***


