    ## Seeking truth


    ![image](images/pg58_1.jpg)


    The `if` keyword is used to perform the basic conditional test that evaluates
    a given expression for a Boolean value of TRUE or FALSE. Statements within braces
    following the evaluation will only be executed when the expression is found to
    be TRUE. When the expression is found to be FALSE, the PHP parser simply moves
    on to the next part of the script.


    The syntax of an `if` conditional test statement looks like this:


    ```

    if ( test-expression ) { statement-to-execute-when-true ; }

    ```


    There may be multiple statements to be executed when the test is TRUE but each
    statement must be terminated by a semi-colon:


    ```

    if ( test-expression )

    {

    statement-to-execute-when-true ;

    statement-to-execute-when-true ;

    statement-to-execute-when-true ;

    }

    ```


    ![image](images/hot.jpg)


    The `if` construct is one of the most important features in PHP, and in most other
    programming languages.


    Multiple expressions can be tested using the logical `&&` or `and` operator to
    ensure that following statements will only be executed when both expressions are
    found to be TRUE, like this:


    ```

    if ( ( test-expression ) && ( test-expression ) )

    {

    statement-to-execute-when-true ;

    statement-to-execute-when-true ;

    statement-to-execute-when-true ;

    }

    ```


    Alternatively, `if` conditional test statements can be nested to test multiple
    expressions so that statements will only be executed when all tests are found
    to be TRUE, like this:


    ```

    if ( test-expression )

    {

    if ( test-expression )

    {

    statement-to-execute-when-true ;

    statement-to-execute-when-true ;

    statement-to-execute-when-true ;

    }

    }

    ```


    ![image](images/hot.jpg)


    When the code to be executed is just a single statement, the braces may optionally
    be omitted, but you may prefer to always include the braces for consistency.


    Multiple `if` conditional test statements can be made to provide alternatives
    for the script to follow.


    ![image](images/1p.jpg) Between PHP tags, begin a script with a statement that
    initializes an integer variable


