    ![image](img/pg11_2.jpg)


    ![image](img/6b.jpg)

    在浏览器地址栏中输入 `http://localhost`，然后按 `Enter`——以查看默认的 Abyss “Welcome” 页面


    ![image](img/pg11_3.jpg)


    ![image](img/snake.jpg)


    如果您选择“Manual startup”选项，Abyss 标志将不会出现在系统托盘中以便于启动/停止控制和访问服务器控制台。相反，控制台可以通过浏览器在
    `http://localhost:9999` 或数字形式 `http://127.0.0.1:9999` 找到（“localhost”是 IP 地址 127.0.0.1
    的别名）。


    ![image](img/hot.jpg)


    在 Abyss 控制台中，单击“Configure”按钮，然后单击 General 图标，即可看到默认 HTTP 端口为 80，默认 Documents Path（您的网页所在位置）为
    `/htdocs`。


    ### 安装 PHP 引擎


    PHP 解释器“engine”，它在网页中实现 PHP 脚本，可作为免费下载提供给 Windows、macOS 和 Linux 操作系统，网址为 [php.net](http://www.php.net)


    ![image](img/php.jpg)


    有关 PHP 安装的进一步指导可在 [php.net/manual/en/install.php](http://www.php.net/manual/en/install.php)
    获取


    ![image](img/1b.jpg)

    打开 Web 浏览器并导航到 [php.net](http://www.php.net)


    ![image](img/2b.jpg)

    接下来，在页面菜单中选择 `Downloads` 项目——以打开“Downloads”页面


    ![image](img/pg12_1.jpg)


    ![image](img/3b.jpg)

    现在，选择要下载的软件包或选择 `Windows downloads` 链接——以打开“Windows binaries”页面


