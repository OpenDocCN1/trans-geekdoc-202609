    # PHP Cookie 处理


    ## 表单提交验证


    在收到表单提交后，PHP 脚本可以检查字段是否存在，并可能对其关联值进行验证。例如，`ctype_alnum()` 函数可用于简单确认值仅包含字母数字数据。


    验证通过后，`setcookie()` 函数可以存储已提交字段的名称和值。此外，还可以使用 `md5()` 函数对密码值进行哈希转换。成功完成后，脚本随后可以使用
    `header()` 函数指定该页面的 URL，从而将浏览器重定向到另一个页面：


    ![image](img/1g.jpg)使用一个函数开始 PHP 脚本以处理验证失败的情况


    ```

    <?php


    function reject( $entry )

    {

    echo “Invalid $entry <br>” ;

    echo ‘Please <a href=”cookie_form.html”>Log In</a>’ ;

    exit() ;

    }

    ```


    ![image](img/commong.jpg)


    `cookie_set.php`


    ![image](img/2g.jpg)接下来，添加一个条件测试块，为有效数据设置两个 Cookie，或调用函数处理失败尝试


    ```

    if( isset( $_POST[ ‘user’ ] ) )

    {

    $user = trim( $_POST[ ‘user’ ] ) ;

    if( !ctype_alnum( $user ) ) { reject( ‘User Name’ ) ; }

    if( isset( $_POST[ ‘pass’ ] ) )

    {

    $pass = trim( $_POST[ ‘pass’ ] ) ;

    if( !ctype_alnum( $pass ) ) { reject( ‘Password’ ) ; }

    else

    {

    setcookie( ‘user’ , $user , time()+3600 ) ;

    setcookie( ‘pass’ , md5( $pass ) , time()+3600 ) ;

    header( ‘Location: cookie_get.php’ ) ;

    }

    }

    }

    else { header( ‘Location: cookie_form.html’ ) ; }

    ?>

    ```


    ![image](img/3g.jpg)将文档保存到 Web 服务器的 `/htdocs` 目录中，命名为 `cookie_set.php`，然后参见 第
    162-163 页 了解如何检索存储的 Cookie 数据


    ![image](img/forget.jpg)


    `ctype_alnum()` 函数仅在其参数包含字母数字字符时才返回 true。


    ![image](img/hot.jpg)


    请注意此处如何使用 `time()` 函数获取当前时间，然后加上一个小时（以秒为单位）以将 Cookie 过期时间设置为一小时后。


    ![image](img/hot.jpg)


    如果直接打开脚本 URL，最终的 else 语句将重定向到 HTML 表单页面。


    ## 获取 Cookie


    ![image](img/pg162_1.jpg)


    一旦设置了 Cookie，它们就会自动分配给特殊的 PHP `$_COOKIE` 全局数组变量。脚本可以使用内置的 PHP `isset()` 函数检查单个
    Cookie 是否存在，以查找指定名称的 Cookie。当确认 Cookie 确实存在时，其值可以有意义地分配给常规脚本变量。这可能用于检索存储的用户名以在页面上输出。当所寻求的
    Cookie 不存在时，脚本可以为用户提供替代方案：


    ![image](img/1g.jpg)使用一个测试开始 PHP 脚本以查找 Cookie，并在成功时检索数据以输出


    ```

    <?php


    if( isset( $_COOKIE[ ‘user’ ] ) )

    {

    $user = $_COOKIE[ ‘user’ ] ;

    echo “<h1>Welcome $user !</h1><hr>” ;

    echo ‘<a href=”cookie_data.php”>View Cookie</a>’ ;

    }

    ```


    ![image](img/commong.jpg)


    `cookie_get.php`


    ![image](img/2g.jpg)接下来，为 Cookie 不存在时添加替代输出


    ```

    else

    {

    echo ‘Please <a href=”cookie_form.html”>Log In</a>’ ;

    }

    ?>

    ```


    ![image](img/3g.jpg)将文档保存到 Web 服务器的 `/htdocs` 目录中，命名为 `cookie_get.php`


    ![image](img/4g.jpg)现在，通过 HTTP 打开 HTML 表单 `cookie_form.html`（在此第 160 页创建）并按下提交按钮以查看登录尝试验证失败，因此不会设置
    Cookie


    ![image](img/pg162_2.jpg)


    ![image](img/5g.jpg)点击超链接返回 HTML 表单并输入有效的用户名，然后按下提交按钮再次查看登录尝试验证失败


    ![image](img/pg163_1.jpg)


    ![image](img/6g.jpg)再次返回 HTML 表单并输入有效的用户名和密码以查看验证成功


    ![image](img/pg163_2.jpg)


    ![image](img/7g.jpg)参见 第 164-165 页 了解如何查看 Cookie 中存储的数据，使用上面看到的超链接的 `cookie_data.php`
    目标


    ![image](img/forget.jpg)


    您还可以返回 HTML 表单并输入包含非字母数字字符的用户名或密码，以再次查看验证失败。


    ![image](img/hot.jpg)


    验证可以扩展。例如，它还可能允许下划线字符，并可能指定最小允许的密码长度。


    ## 查看 Cookie 数据


    ![image](img/pg164_1.jpg)


    特殊的 PHP `$_COOKIE` 全局数组变量以键值关联数组的形式存储 Cookie 名称和值。存储的内容可以通过遍历数组来查看所有名称和值，或使用 PHP
    `var_dump()` 函数来查看：


    ![image](img/1g.jpg)使用一个测试开始 PHP 脚本以查找是否设置了任何 Cookie，并在成功时检索所有存储的名称和值


    ```

    <?php


    if( count( $_COOKIE ) > 0 )

    {

    echo ‘<dl> ‘ ;

    foreach( $_COOKIE as $key => $value )

    {

    echo “<dt>Key: $key” ;

    echo “<dd>Value: $value” ;

    }

    echo ‘</dl><hr>’ ;

    var_dump( $_COOKIE ) ;

    }

    ```


    ![image](img/commong.jpg)


    `cookie_data.php`


    ![image](img/2g.jpg)接下来，为 Cookie 不存在时添加替代输出


    ```

    else

    {

    echo ‘Please <a href=”cookie_form.html”>Log In</a>’ ;

    }

    ?>

    ```


    ![image](img/3g.jpg)将文档保存到 Web 服务器的 `/htdocs` 目录中，命名为 `cookie_data.php`


    ![image](img/4g.jpg)现在，通过 HTTP 打开 HTML 表单 `cookie_form.html`（在此第 160 页）并输入有效的登录数据，然后在
    `cookie_get.php`（在此第 162 页）上点击链接以查看 Cookie 数据


    ![image](img/pg164_2.jpg)


    ![image](img/pg165_1.jpg)


    ![image](img/hot.jpg)


    您可以在任何时候调用 `setcookie()` 函数来创建新 Cookie 或覆盖现有 Cookie。


    ![image](img/5g.jpg)使用 Web 浏览器的设置菜单清除系统上存储的现有 Cookie


    ![image](img/pg165_2.jpg)


    ![image](img/6g.jpg)现在，使用 ![image](img/pg165_3.jpg)浏览器中的刷新按钮重新加载此页面并查看替代内容——确认
    Cookie 数据已被删除


    ![image](img/pg165_4.jpg)


    ![image](img/hot.jpg)


    PHP 手册描述了通过将 Cookie 的值设置为空且过期日期设为过去来删除 Cookie。例如，`setcookie($_COOKIE[''user''],
    '''', time()-3600)`。此外，还可以使用 `unset()` 函数销毁指定的变量。


    ## 提交会话数据


    ![image](img/pg166_1.jpg)


    用户数据只能在用户选择允许 Cookie 进入其系统时才存储在客户端计算机上的 Cookie 中。然而，许多用户更喜欢禁止 Cookie 以避免跟踪——但
    PHP 提供了更好的替代方案。使用 PHP，用户数据可以使用特殊的 `$_SESSION` 全局数组变量存储在服务器上。为了使 PHP 会话正常工作，每个
    PHP 页面必须在页面顶部调用内置的 `session_start()` 函数——在任何 HTML 标签之前！通过 POST 方法向服务器提交的 HTML
    表单会将字段数据分配给特殊的 PHP `$_POST` 全局数组变量，并且可以使用内置的 PHP `isset()` 函数查找各个提交字段。当确认字段存在时，其名称和值可以存储在会话变量中。这可能用于存储用户名和密码详细信息以在整个网站中使用，作为
    Cookie 存储的替代方案：


    ![image](img/1g.jpg)创建一个 HTML 文档并将此表单添加到其 body 部分，指定提交方法和 PHP 提交处理脚本的名称


    ```

    <form name = ”entry” method = ”POST”

    action = ”session_set.php”>

    <fieldset>

    <legend>For Name : Enter Only Letters</legend>

    ```

