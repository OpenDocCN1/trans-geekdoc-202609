    ## 包裹表单


    PHP 有用地允许将多个文件合并在一起以创建一个单一的网页。这意味着动态表单可以被静态页眉和页脚内容包围，这些内容可以轻松重复使用以在网站内创建其他页面。


    ![image](img/pg154_1.jpg)


    PHP `include()` 函数以要合并到网页中的另一个文件的 URL 作为其参数。通常，被包含的静态内容文件是 HTML，并且位于 Web 服务器 `/htdocs`
    目录内的 "includes" 文件夹中。


    PHP 还提供了一个 `require()` 函数，它的工作方式与 `include()` 函数类似，用于将其他文件合并到网页中，但略有不同。当 `include()`
    函数失败时，例如指定的文件找不到，会向浏览器发送警告，但脚本继续运行。当 `require()` 函数失败时，会打印错误但脚本会被停止。通常，`include()`
    函数合并静态 HTML 文件，而 `require()` 函数合并动态 PHP 脚本。


    重要的是，包含多个文件的网页的标题可以由 PHP 动态编写，以允许原本静态的 HTML 页眉内容具有最大灵活性：


