    ## How to Use This Book


    The examples in this book demonstrate features of the PHP scripting language,
    and the screenshots illustrate the actual results produced by the listed code
    examples. Certain colorization conventions are used to clarify the code listed
    in the steps…

    Components of the PHP language are colored blue, programmer-specified names are
    colored red, literal text and numeric values are black, and code comments are
    green, like this:


    ```

    <?php

    # Write the traditional greeting.

    $greeting = ‘Hello World!’ ;

    echo “<h1>$greeting</h1>” ;

    ?>

    ```


    Additionally, in order to identify each source code file described in the steps,
    a file icon and file name appears in the margin alongside the steps:


    ![image](images/pg6_1.jpg)


    ### Grab the Source Code


    For convenience, the source code files from all examples featured in this book
    are available in a single ZIP archive. You can obtain this archive by following
    these easy steps:


    ![image](images/1g1.jpg)Browse to **[www.ineasysteps.com](http://www.ineasysteps.com)**
    then navigate to Free Resources and choose the Downloads section

    ![image](images/2g1.jpg)Next, find PHP in easy steps, 4th edition in the list,
    then click on the hyperlink entitled All Code Examples to download the ZIP archive
    file

    ![image](images/3g1.jpg)Now, extract the archive contents to the web server’s
    `/htdocs` directory on your PC


    If you don’t achieve the result illustrated in any example, simply compare your
    code to that in the original example files you have downloaded to discover where
    you went wrong.


