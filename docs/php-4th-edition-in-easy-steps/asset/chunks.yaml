    **Handling errors**


    ![image](images/pg132_1.jpg)


    You can anticipate possible errors and terminate a running script when they occur
    using the die() function or the exit() function. Without this contingency, the
    default PHP error handler provides a useful but unsightly message when an error
    occurs. For example, fopen( ‘nonsuch.txt’ , ‘r’ ) to open a non-existing file:


    ![image](images/pg132_2.jpg)


    ![image](images/hot.jpg)


    The **die()** and **exit()** functions perform identical operations in PHP, but
    their terminology can have different appeals. For some, **die()** possibly seems
    more appropriate to quit when an error is detected, and **exit()** may seem more
    suitable to quit in other scenarios.


    It is not always desirable to terminate a script when an error occurs, but you
    can create a custom error handler to provide a more user-friendly message than
    that provided by the default PHP error handler. A custom error handler is simply
    a function with this syntax:


    **function error\_handler( *level , message , file , line , context* )**


    Only the first two parameters are required, the rest are optional. The first of
    these is a numerical value, representing a constant, indicating the severity of
    the error that has occurred:


    | **Level** || **Constant** || **Description** |


    | --- | --- | --- |


    | **2** || **E\_WARNING** || Non-fatal runtime error |


    | **8** || **E\_NOTICE** || Non-fatal possible error |


    | **256** || **E\_USER\_ERROR** || Fatal user-generated error |


    | **512** || **E\_USER\_WARNING** || Non-fatal user-generated error |


    ![image](images/hot.jpg)


    The basic error levels are listed in this table but the PHP manual lists many
    more (**[php.net/](http://www.php.net/) manual**).


    A custom error handler function is nominated to handle errors by specifying its
    function name as the argument to the built-in PHP set\_error\_handler() function.


    The error handler is called when an error occurs, or can be called explicitly
    using the trigger\_error() function to specify an error message as its argument.


    ![image](images/1b.jpg)Begin a PHP script by defining a custom error handler function
    to report an error level and error message


    **<?php**


    **function error\_handler( $level , $message )**


    **{**


    **switch( $level )**


    **{**


    **case 2 : $str \= ‘Warning!’ ; break ;**


    **case 8 : $str \= ‘Notice!’ ; break ;**


    **default : $str \= ‘Error!’ ;**


    **}**


    **echo “<b>$str</b><br>$message<hr>”;**


    **}**


    ![image](images/commonb.jpg)


