- raw: 'Unlike a variable, a constant cannot contain Boolean values of TRUE or FALSE,
    nor represent an object, nor a NULL empty value. Additionally, a constant cannot
    be changed as the script proceeds. This safeguards the constant value from accidental
    alteration and is good programming practice.


    Constant names are subject to the same naming conventions as variables, but it
    is traditional to use uppercase characters for constant names – to easily distinguish
    them from variable names. Constants are created using a define() function to specify
    the constant’s name and the value it will contain, like this:


    **define( *‘NAME’* , *value* ) ;**


    Most significantly, constant names are not prefixed by a $ dollar sign, so they
    cannot be included in mixed strings for display – as PHP cannot distinguish a
    constant name from a regular capitalized string. Consider these statements, for
    example:


    **define( ‘USER’ , ‘Mike’ ) ;**


    **echo “Hello USER”**


    …the output here is Hello USER, not Hello Mike as desired.


    In order to include a constant’s value in an output string it must be referenced
    separately and “concatenated” to the string with the PHP . concatenation operator,
    like this:


    **echo ‘Hello ‘ . USER ;**


    …the output here is now Hello Mike as desired.


    Array constants, in which all elements contain fixed data values, can also be
    created using the define() function, like this:


    **define( ‘WEEKDAYS’ , \[ ‘Mon’, ‘Tue’ , ‘Wed’ , ‘Thu’ , ‘Fri’ \] ) ;**


    Constants defined by the script author can be used just like the predefined constants
    that are built into PHP, such as PHP\_VERSION and PHP\_OS that describe the version
    and server operating system.


    ![image](images/hot.jpg)


    When creating a variable, always consider whether its value will ever change –
    if it will not, you should create a constant instead; for example, **define( ‘PI’
    , 3.14 ) ;**


    ![image](images/1r.jpg)Create a valid HTML document, like the one listed [hereon
    page 16](#chapter01.xhtml#sec5), then insert PHP tags into the body section


    **<?php**


    **\# Statements to be inserted here.**


    **?>**


    ![image](images/commonr.jpg)


    constant.php


    ![image](images/2r.jpg)Now, insert between the PHP tags a statement to create
    and initialize a constant


    **define( ‘USER’ , ‘Mike’ ) ;**


    ![image](images/3r.jpg)Add a statement to create and initialize an array constant


    **define( ‘PETS’ , \[ ‘Kitten’ , ‘Puppy’ , ‘Hamster’ \] ) ;**


    ![image](images/4r.jpg)Next, insert a statement to display two constant values
    in a concatenated string


    **echo ‘<p>Hello ‘ . USER . ‘ how is your ‘ . PETS\[1\] . ‘?</p>’ ;**


    ![image](images/5r.jpg)Insert a statement to display the predefined constant value
    of the PHP version in a concatenated string


    **echo ‘<p>You are using PHP version ‘ . PHP\_VERSION ;**


    ![image](images/6r.jpg)Finally, insert a statement to display the predefined constant
    value of the host operating system in a string


    **echo ‘ running on ‘ . PHP\_OS . ‘</p>’ ;**


    ![image](images/7r.jpg)Save the document in your web server’s /htdocs directory
    as constant.php then open the page via HTTP to see the results get displayed


    ![image](images/pg39_1.jpg)


    ![image](images/snake.jpg)


    You cannot include constants in mixed strings, or change their value, or begin
    their name with a dollar sign.


    ![image](images/forget.jpg)


    You should always use uppercase for constant names to easily differentiate them
    from variables in your code.


    **Exploring superglobals**


    PHP provides several predefined variables that are always globally available anywhere
    within any script. These are aptly known as “superglobals” and are described briefly
    here:


    •$GLOBALS – an associative array containing references to all variables that are
    currently defined in the global scope of the script, according to context. The
    variable names are the keys of this associative array – for example:


