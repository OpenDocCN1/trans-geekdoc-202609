    **{**


    **$this->age \= $yrs ;**


    **$this->weight \= $lbs ;**


    **$this->color \= $fur ;**


    **}**


    ![image](images/3v.jpg)Now, add a simple destructor method


    **function \_\_destruct() { echo ‘<hr>Object Destroyed.’ ; }**


