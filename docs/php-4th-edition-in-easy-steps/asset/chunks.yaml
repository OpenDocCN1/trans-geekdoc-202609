- raw: 'The Abyss Web Server must be configured to recognize PHP scripts and employ
    the PHP interpreter when it encounters them. This is achieved in the Abyss Console
    by associating the file extension “.php” as being PHP scripts, and by specifying
    the location of the PHP engine on your system to interpret them:


    ![image](images/1b.jpg)Enter **http://localhost:9999** into your browser address
    field to launch the Abyss Web Server Console, then click the **Configure** button
    – to open the Configuration page


    ![image](images/2b.jpg)Click on the ![image](images/pg14_2.jpg)**Scripting Parameters**
    icon – to open the Scripting Parameters page for editing


    ![image](images/3b.jpg)Ensure that the **Enable Scripts Execution** box is checked,
    then click the **Add** button in the Interpreters table – to open the Interpreters-Add
    page


    ![image](images/4b.jpg)Set the **Interface** parameter to “FastCGI (Local - Pipes)”


    ![image](images/5b.jpg)Set the **Interpreter** parameter to the PHP path location
    on your system of the **php-cgi.exe** file


    ![image](images/6b.jpg)Set the **Associated Extensions** parameter to “php”, so
    your configuration should look like that shown below:


    ![image](images/pg14_3.jpg)


    ![image](images/pg14_1.jpg)


    Further guidance on configuration of the Abyss Web Server is available online
    at **[aprelium.com/abyssws/start.html](http://www.aprelium.com/abyssws/start.html)**


    ![image](images/forget.jpg)


    To clarify the code examples in this book, components of the PHP language are
    colored **blue**, programmer-specified names are **red**, numeric and string data
    is **black**, and comments are **green**.


    ![image](images/forget.jpg)


    The **localhost** domain name is an alias for the domain IP address of **127.0.0.1**
    – so the Abyss Web Server Console can alternatively be addressed as **http://127.0.0.1:9999.**


    ![image](images/7b.jpg)Click the **OK** button to validate your new configuration


    ![image](images/8b.jpg)Click the **Restart** button that next appears, to apply
    the changes you have made to the Abyss configuration


    ![image](images/pg15_1.jpg)


    ![image](images/snake.jpg)


    Documents can only be interpreted by the PHP engine if served up by the web server
    using the HTTP protocol. You cannot simply open a PHP file in your browser directly.
    Always use the location **http://localhost/** to serve the examples in this book.


    The Abyss Web Server should now be running on your system, correctly configured
    to recognize that documents having the **.php** file extension should be interpreted
    by the PHP engine. Configuration can now be tested by creating a simple PHP script
    for service to your web browser by Abyss:


    ![image](images/1b.jpg)Open a plain text editor and exactly type the script below


    **<?php phpinfo() ;  ?>**


    ![image](images/commonb.jpg)


    phpinfo.php


    ![image](images/2b.jpg)Save the script as **phpinfo.php** in the Abyss document
    path directory, typically at **C:\\Abyss Web Server\\htdocs**


    ![image](images/3b.jpg)Exactly enter the location **http://localhost/phpinfo.php**
    into your web browser’s address field to see Abyss serve up a web page containing
    your PHP version information


    ![image](images/pg15_2.jpg)


    ![image](images/snake.jpg)


    PHP scripts are case-sensitive so you must copy the listed script using lowercase
