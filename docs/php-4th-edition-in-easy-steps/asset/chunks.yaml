    当 HTML 表单使用 POST 方法提交数据时，`$_POST` 数组会将提交的表单值存储在同名数组元素中。因此，名为“city”的提交字段的值可以使用
    `$_POST[''city'']` 访问。


    同样地，当数据使用 GET 方法提交时，`$_GET` 数组会将提交的值存储在命名数组元素中。因此，名为“id”的提交数据的值可以使用 `$_GET[''id'']`
    访问。这通常用于通过在 HTML 超链接锚点中将 name=value 对附加到 URL 来向脚本提交数据，如下所示：


    `<a href="www.example.com/script.php?id=1">`


