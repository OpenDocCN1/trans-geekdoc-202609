- raw: 'If you want a function to modify data stored in a variable, specified in a
    function call, you must pass it “by reference”. This allows the function to operate
    directly on the original data. Modifying the argument will affect the original
    data in the variable when it is passed by reference. To ensure that an argument
    is always passed to a function by reference, you need simply prefix an & ampersand
    before the parameter name in the function definition.


    ![image](images/1o.jpg)Begin a PHP script with a statement to initialize two variables
    with the same integer value


    **<?php**


    **$a \= $b \= 5 ;**


    ![image](images/commono.jpg)


    arguments.php


    ![image](images/2o.jpg)Next, define a function that accepts two integer arguments
    – one by value and the other by reference


    **function modify( int $val , int &$ref )**


    **{**


    **// Statements to be inserted here.**


    **}**


    ![image](images/3o.jpg)Now, insert statements to output the passed values, then
    increment those values and display the modified values


    **echo “Passed values : $val , $ref<br>” ;**


    **$val++ ;**


    **$ref++ ;**


    **echo “Incremented values : $val , $ref<hr>” ;**


    ![image](images/4o.jpg)After the function block, add a statement to call the function,
    passing the variable values as arguments


    **modify( $a , $b ) ;**


    ![image](images/5o.jpg)Finally, add a statement to display the values now stored
    in each variable


    **echo “Stored values : $a , $b” ;**


    **?>**


    ![image](images/6o.jpg)Save the document in your web server’s /htdocs directory
    as arguments.php then open the page via HTTP to see the argument and variable
    values


    ![image](images/pg77_1.jpg)


    ![image](images/forget.jpg)


    The **int** type description in this example specifies that only integer data
    values can be passed as arguments to the function.


    **Varying parameters**


    ![image](images/pg78_1.jpg)


    Default argument values can optionally be specified in a function definition by
    assignment to the parameter name, like this:


    **function *function\_name* ( $*arg\_1* , $*arg\_2* = “Default String” )**


    **{**


    ***statement-to-be-executed ;***


    ***statement-to-be-executed ;***


    ***statement-to-be-executed ;***


    **}**


    This allows a function call to be made that specifies either one or two argument
    values. If only one argument is specified, it is assigned to the first parameter
    and the default value is used by the second parameter. Where default values are
    specified for parameters, they must only appear in the parameter list following
    (to the right or) parameters that have no specified default value. Otherwise,
    a call without the correct total number of arguments would cause an error.


    ![image](images/snake.jpg)


    If multiple default values are specified there is currently no way to skip a parameter
    in a function call, to assign an argument value to a particular parameter.


    If you need to create a function that will accept an unknown number of arguments,
    PHP has a special **…** “splat” operator for that purpose. This can be used in
    a function definition, like this:


    **function *function\_name* ( …$*args* )**


    **{**


    ***statement-to-be-executed ;***


    ***statement-to-be-executed ;***


    ***statement-to-be-executed ;***


    **}**


    When the **…** splat operator is used to prefix a parameter name in a function
    definition, multiple arguments can be passed to that parameter to create an array.
    The array can be traversed like any other array to manipulate the passed in argument
    values.


    ![image](images/hot.jpg)


    The **…** splat operator is also sometimes known as the “scatter” operator.


    Additionally, the **…** splat operator can be used to “unpack” an array specified
    in a function call to pass its element values as individual arguments, like this:


    **function *function\_name* ( $*arg\_1* , $*arg\_2* , $*arg\_3* )**


    **{**


    **echo *$arg\_1* + *$arg\_2* + *$arg\_3* ;**


    **}**


    **$arr = \[ 1 , 2 , 3 \] ;**


    ***function\_name* ( …$arr ) ;           # Outputs 6**


    ![image](images/1o.jpg)Begin a PHP script by defining a function that provides
    default string values to its two parameters


    **<?php**


    **function drink( string $tmp \= ‘hot’ , string $flavor \= ‘tea’ )**


    **{**


    **// Statement to be inserted here.**


    **}**


    ![image](images/commono.jpg)


    parameters.php


    ![image](images/2o.jpg)Next, insert a statement to display its default values
    or passed in argument values


    **echo “Drinking $tmp $flavor.<br>” ;**


    ![image](images/3o.jpg)After the function block, add function calls that optionally
    pass string arguments


    **drink() ; drink( ‘iced’ ) ; drink( ‘cold’ , ‘lemonade’ ) ;**


    ![image](images/4o.jpg)Now, define a function that can accept multiple integer
    arguments and display their total value


    **function add( int …$numbers )**


    **{**


    **$total \= 0 ;**


    **foreach( $numbers as $num ) { $total +\= $num ; }**


    **echo “<hr>Total : $total” ;**


    **}**


    ![image](images/5o.jpg)Finally, after the function block add a statement to call
    the function in the previous step and pass three values


    **add( 1 , 2 , 3 ) ;**


    **?>**


    ![image](images/6o.jpg)Save the document in your web server’s /htdocs directory
    as parameters.php then open the page via HTTP to see the argument and default
    values


    ![image](images/pg79_1.jpg)


    ![image](images/hot.jpg)


    You can specify regular positional parameters before a parameter that accepts
    multiple arguments with the **…** splat operator. Only arguments that outnumber
    the positional elements will be added to the array of the final parameter.


    **Naming parameters**


    ![image](images/pg78_1.jpg)


    A function definition will typically include parameters that will require a caller
    to pass argument values to the function in the same order as the parameters are
    listed in the function definition. Consequently, these are known as “positional
    parameters”.


    PHP also supports “named parameters” that allow a caller to pass argument values
    to the function in any order. In this case, the call must specify each parameter
    name and argument value separated by a colon. The parameter name in the call is
    the parameter name specified in the function definition – but without the $ prefix.


    **function *function\_name* ( $*arg\_1* , $*arg\_2* )**


    **{**


    **echo *$arg\_1* + *$arg\_2 ;***


    **}**


    ***function\_name* ( *arg\_1* : ‘Hot’ , *arg\_2* : ‘Tea’ ) ;     # Outputs Hot
    Tea**


    ***function\_name* ( *arg\_2* : ‘Tea’ , *arg\_1* : ‘Hot’ ) ;     # Outputs Hot
    Tea**


    When a function definition specifies a default value for a parameter, and the
    caller does not pass an argument value for that parameter, the default value will
    be used just as when calling positional parameters.


    ![image](images/hot.jpg)


    Named parameters is a great new feature introduced in PHP 8.


    The use of named parameters can improve code readability and also allows a caller
    to pass argument values to specific parameters while assuming default values for
    other parameters. For example, given a function definition with two parameters
    that each have specified default values, a positional parameter call cannot specify
    an argument value for the second parameter alone. It can’t skip the first parameter.
    A named parameter call, on the other hand, can specify an argument value for the
    second parameter and assume the default value for the first parameter.


    ***function\_name* ( *arg\_2* : *arg\_value* ) ;**


    You can use both named parameters and positional parameters in a function call
    but all positional parameters must appear before named parameters within the call.
    Using a positional parameter after a named parameter in a function call will create
    an error, as the PHP parser cannot correctly assign the argument value.


    Additionally, the … splat operator can be used in a function definition to collect
    parameter names and values from a named parameter call, and their names will be
    preserved.


    ![image](images/1o.jpg)Begin a PHP script by defining a function that provides
    default string values to its two parameters


    **<?php**


    **function cook( string $prep \= ‘fried’ , string $food \= ‘rice’ )**


