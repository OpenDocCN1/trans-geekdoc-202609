    ## Summary


    • The PHP `set_cookie()` function can be used to store user data on the client
    machine for use across the pages of a website.

    • There should be at least three arguments supplied to the `set_cookie()` function
    to specify name, value and expiry time.

    • HTML form submissions via the POST method automatically assign field data to
    the PHP `$_POST` global array variable.

    • The `isset()` function can seek an element of a specified HTML field name within
    the `$_POST` global array.

    • The `ctype_alnum()` function can be used to confirm a value only contains alphanumeric
    data for validation.

    • A hash conversion can be made of a password value using the `md5()` function
    for encryption.

    • The PHP `header()` function can specify a Location:URL to relocate the browser.

    • Once cookies are set, they are automatically assigned to the special PHP `$_COOKIE`
    global array variable.

    • User data can be stored on the server in the PHP `$_SESSION` global array variable
    as an alternative to cookie storage.

    • To use sessions, each PHP page must call the `session_start()` function at the
    top of the page before any HTML tags.

    • HTML field data submitted to the `$_POST` global array can be assigned to a
    `$_SESSION` global variable array element.

    • The `ctype_alpha()` function can be used to confirm a value only contains alphabetic
    letter data for validation.

    • The `preg_match()` function can be used to confirm a value matches a specified
    pattern for validation.

    • Each session has a unique session ID number, which can be seen using the PHP
    `session_id()` function.

    • Session variables can be removed using the `unset()` function, and a session
    can be terminated using the `session_destroy()` function.

    • Stored content can be viewed using the `var_dump()` function and by looping
    through the `$_COOKIE` or `$_SESSION` arrays.


