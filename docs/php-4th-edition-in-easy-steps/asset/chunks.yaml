    ## Summary


    •A variable is a named container in which changeable data can be stored.


    •The value stored in a variable can be referenced using that variable’s name.


    •Variable names must begin with a `$` dollar sign, may comprise letters, numbers
    and underscore characters, and the first character after the `$` must only be
    a letter or an underscore.


    •A variable can store an integer number, floating-point number, text string, Boolean
    value, object, or `NULL` value.


    •A variable is initialized using the `=` assignment operator to assign an initial
    value to that variable.


    •A variable’s value can be displayed as part of a mixed string by enclosing the
    string and variable name in double quotes only.

