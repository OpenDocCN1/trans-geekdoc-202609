    ## 介绍 PHP


    最具吸引力的现代网站通过动态响应某些当前条件——用户名、一天中的时间、最新博客、购物车内容等——提供定制化的用户体验。许多这些动态网站都是使用 PHP 创建的。


    ![image](img/php.jpg)


    这是 PHP 项目的官方标志——PHP 的官方在线主页可在 [php.net](http://www.php.net) 找到


    ### 什么是 PHP?


    PHP 是一种广泛使用的通用脚本语言，尤其适合 Web 开发并且可以嵌入到 HTML 中。它由程序员 Rasmus Lerdorf 创建，作为维护其网站的一组脚本，于
    1995 年 6 月 8 日发布为“Personal Home Page Tools (PHP Tools) version 1.0”。


    该工具在 1997 年的版本 2 中得到扩展，并在次年的版本 3 中将名称更改为递归缩写“PHP: Hypertext Preprocessor”。2000
    年发布 PHP4 后，性能、可靠性和可扩展性得到改进，它由 Zend 引擎虚拟机提供支持。


    其后，PHP5 于 2004 年发布，由新的 Zend II 引擎驱动，并由 PHP 团队作为自由软件发布。计划中的实验版本 PHP6 旨在在整个 PHP
    中引入原生 Unicode 支持，但被放弃，而 PHP7 于 2015 年发布。PHP8 于 2020 年发布，提供“Just In Time”（JIT）编译以提高性能。如今，PHP
    已安装在超过 20 million 个网站和 1 million 台 Web 服务器上。


    ### 为什么 PHP 很受欢迎？


    • PHP 对新手来说极其简单，但为专业程序员提供了许多高级功能。


    • PHP 代码被包含在特殊的开始和结束处理标签中，允许您在“PHP 模式”中进出，以便在 HTML 文档中实现指令。


    • PHP 代码在服务器上执行（“server-side”），与在浏览器中执行的 JavaScript 代码（“client-side”）不同。客户端接收脚本运行的结果，而不知道底层代码是什么。最近，服务器端被称为“The
    Cloud”。


    ![image](img/elephant.jpg)


    这是“elePHPant”——PHP 项目的吉祥物，由 Vincent Pontier 设计。


    ### 了解云


    每当用户在浏览器中请求查看网页时，它会通过 HTTP 协议从 Web 服务器请求该页面并接收页面作为响应。如果网页包含 PHP 脚本，Web 服务器会先调用
    PHP 引擎处理代码，然后再将响应发送给 Web 浏览器：


    ![image](img/pg9_1.jpg)


    ![image](img/hot.jpg)


    HTTP（HyperText Transfer Protocol）是通用通信标准，允许连接到任何 Web 服务器的任何计算机在网络上访问文件。


    以下页面描述了如何通过在自己的计算机上安装以下服务器端技术来创建交互式网站的开发环境：


