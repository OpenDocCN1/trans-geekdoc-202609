    ->bark() ;`\n\n![image](img/13v.jpg) 将文档保存到你的 Web 服务器的 `/htdocs` 目录中，命名为 `initializer.php`，然后通过\
    \ HTTP 打开页面以查看由组合初始化方法设置的输出\n\n![image](img/pg111_1.jpg)\n\n![image](img/pg111_2.jpg)\n\
    \n![image](img/forget.jpg)\n\n你仍需在此处调用初始化方法，以便在不传递参数时将默认值分配给类变量。\n\n## 使用构造函数\n\
    \n![image](img/pg112_1.jpg)\n\n类变量成员可以通过一个特殊的“构造函数”方法进行初始化，该方法在每次创建类的实例时被调用。构造函数方法始终命名为\
    \ `__construct()`，并且可以接受参数来设置类变量的初始值。\n\n构造函数方法有一个配套的“析构函数”方法 – 当类的实例被销毁时调用。析构函数方法始终命名为\
    \ `__destruct()`。\n\n构造函数和析构函数方法没有返回值并且是自动调用的 – 它们不能显式调用，因此其声明不需要访问限定符。\n\n用于初始化类变量的值在创建对象的语句中传递给构造函数方法，放在对象名称后的括号中：\n\
