    ## Loading data


    There are many “Web Services” available online, which provide free data that can
    usefully be incorporated in your own web pages. Typical examples might supply
    live stock prices, the latest news stories, or current weather conditions.


    ![image](images/pg174_1.jpg)


    Most Web Services offer to supply data in the XML (eXtensible Markup Language)
    file format. This is designed to be both human-readable and machine-readable and
    is not reliant upon any single platform. For example, a Java program can send
    XML data over the internet to a .NET application, and vice versa.


    XML looks very much like HTML, but with XML you make up your own element names.
    The element tags surround content and may include attributes, as with HTML. It
    is important that each element has both opening and closing tags, and that elements
    are correctly nested for the XML document to be “well-formed”.


    ![image](images/pg174_3.jpg)


    ![image](images/snake.jpg)


    All XML documents must begin with an XML file type declaration – like the one
    shown here on line 1.


    ![image](images/pg174_2.jpg)


    `catalog.xml`


    ![image](images/hot.jpg)


    The `catalog.xml` file shown here will be used in the next few examples to demonstrate
    how to load XML data and how to access element values or attribute values.


    PHP provides an XML parser called “SimpleXML” that can load an XML document into
    memory as a hierarchical tree structure. The `simplexml_load_file()` function
    requires the XML file name and path to transform the document into a data structure
    comprising `SimpleXMLElement` objects. The data structure can then be explored
    using the `var_dump()` function.


    ![image](images/1p.jpg)Begin a PHP script with a statement to set a page title
    and to preserve text formatting


    ```

    <?php

    echo ''<title>PHP SimpleXML</title><pre>'' ;

    ```


    ![image](images/commonp.jpg)


    `catalog.php`


    ![image](images/2p.jpg)Next, add a statement to load the XML data or quit


    ```

    $xml = simplexml_load_file(''catalog.xml'')

    or die(''Unable to load data!'') ;

    ```


    ![image](images/3p.jpg)Now, display all the SimpleXMLElement objects


    ```

    var_dump($xml) ;

    ```


    ![image](images/4p.jpg)Save the document in your web server’s `/htdocs` directory
    as `catalog.php`, alongside the `catalog.xml` file, then open the page via HTTP
    to see the SimpleXMLElement objects


    ![image](images/pg175_1.jpg)


    ![image](images/hot.jpg)


    Notice that this data structure depicts an array named “book” that has five array
    elements – corresponding to the five XML <book> elements.


    ![image](images/forget.jpg)


    The ubiquitous nature of XML makes it ideal to transport data across the internet.


    ## Getting nodes


    ![image](images/pg176_1.jpg)


    The data structure contained in a `SimpleXML` object describes a parent-child
    relationship between outer and inner XML elements. Each member of the data structure
    is known as a “node”. The top-level nodes are direct child descendants of the
    SimpleXML object itself, so can be referenced using the object name, `->` object
    operator, and child node name. For example, `$object->child`. A child of the child
    node (grandchild) can be referenced by adding a further `->` object operator,
    and the grandchild node name, such as `$object->child->grandchild` and so on for
    each further generation:


    ![image](images/1p.jpg)Begin a PHP script with a statement to set a page title


    ```

    <?php

    echo ''<title>PHP SimpleXML</title>'' ;

    ```


    ![image](images/commonp.jpg)


    `nodes.php`


    ![image](images/2p.jpg)Add a statement to load the XML data or quit


    ```

    $xml = simplexml_load_file(''catalog.xml'')

    or die(''Unable to load data!'') ;

    ```


    ![image](images/3p.jpg)Next, retrieve the content of the “title” element that
    is a child of the first “book” element


    ```

    echo ''First book : ''.

    $xml->book[0]->title.'' in easy steps<br>'' ;

    ```


    ![image](images/4p.jpg)Now, retrieve the content of the “category” element that
    is a child of the first “book” element


    ```

    echo ''Language category : ''.$xml->book[0]->category ;

    ```


    ![image](images/5p.jpg)Save the document in your web server’s `/htdocs` directory
    as `nodes.php`, alongside the `catalog.xml` file, then open the page via HTTP
    to see the node content


    ![image](images/pg176_2.jpg)


    ![image](images/hot.jpg)


    As there are five “book” nodes on the same hierarchical level, in this example
    they are created as an array. Each node can therefore be individually referenced
    using its node name and array index number.


    ### Looping through nodes


    The `SimpleXML` object provides methods to work with the data contained within
    its data structure. Usefully, its `children()` method returns all child nodes
    and can be used to loop through the nodes to retrieve each node’s content:


    ![image](images/1p.jpg)Begin a PHP script with a statement to set a page title


    ```

    <?php

    echo ''<title>PHP SimpleXML</title>'' ;

    ```


    ![image](images/commonp.jpg)


    `nodes-loop.php`


    ![image](images/2p.jpg)Add a statement to load the XML data or quit


    ```

    $xml = simplexml_load_file(''catalog.xml'')

    or die(''Unable to load data!'') ;

    ```


    ![image](images/3p.jpg)Next, initialize an iteration counter at zero


    ```

    $counter = 0 ;

    ```


    ![image](images/4p.jpg)Now, add a loop to increment the counter and to display
    all “title” and “category” child node content


    ```

    foreach($xml->children() as $book)

    {

    $counter++ ;

    echo ''Book ''.$counter.'' : '' ;

    echo $book->title.'' in easy steps [''.$book->category.'']<hr>'' ;

    }

    ```

