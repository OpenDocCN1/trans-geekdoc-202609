- raw: 'Upon receiving a form submission, a PHP script can check for the presence
    of fields and might perform validation of their associated values. For example,
    the ctype\_alnum() function could be used to simply confirm that the values only
    contain alphanumeric data.


    Once validated, the setcookie() function can store the submitted fields’ names
    and values. Additionally, a hash conversion could be made of password values using
    the md5() function. On successful completion, the script can then relocate the
    browser to another page using the header() function to specify that page’s URL:


    ![image](images/1g.jpg)Begin a PHP script with a function to handle failed validation
    attempts


    **<?php**


    **function reject( $entry )**


    **{**


    **echo “Invalid $entry <br>” ;**


    **echo ‘Please <a href=”cookie\_form.html”>Log In</a>’ ;**


    **exit() ;**


    **}**


    ![image](images/commong.jpg)


    cookie\_set.php


    ![image](images/2g.jpg)Next, add a conditional test block to set two cookies for
    valid data, or call the function to handle failed attempts


    **if( isset( $\_POST\[ ‘user’ \] ) )**


    **{**


    **$user****\= trim( $\_POST\[ ‘user’ \] ) ;**


    **if( !ctype\_alnum( $user ) ) { reject( ‘User Name’ ) ; }**


    **if( isset( $\_POST\[ ‘pass’ \] ) )**


    **{**


    **$pass \= trim( $\_POST\[ ‘pass’ \] ) ;**


    **if( !ctype\_alnum( $pass ) ) { reject( ‘Password’ ) ; }**


    **else**


    **{**


    **setcookie( ‘user’ , $user , time()+3600 ) ;**


    **setcookie( ‘pass’ , md5( $pass ) , time()+3600 ) ;**


    **header( ‘Location: cookie\_get.php’ ) ;**


    **}**


    **}**


    **}**


    **else { header( ‘Location: cookie\_form.html’ ) ; }**


    **?>**


    ![image](images/3g.jpg)Save the document in your web server’s /htdocs directory
    as cookie\_set.php then see [herepages 162-163](#chapter10.xhtml#sec82) for how
    to retrieve the stored cookie data


    ![image](images/forget.jpg)


    The **ctype\_alnum()** function returns true only if its argument contains alphanumeric
    characters.


    ![image](images/hot.jpg)


    Notice how the **time()** function is used here to get the current time, then
    one hour is added (in seconds) to set the cookie expiration time one hour ahead.


    ![image](images/hot.jpg)


    The final **else** statement will relocate to the HTML form page if the script
    URL is opened directly.


    **Getting cookies**


    ![image](images/pg162_1.jpg)


    Once cookies are set, they are automatically assigned to the special PHP $\_COOKIE
    global array variable. A script can check for the presence of an individual cookie
    using the built-in PHP isset() function to seek a cookie of a specified name.
    When this confirms the cookie is indeed present, its value can usefully be assigned
    to a regular script variable. This might be used to retrieve a stored username
    for output on a page. Where a sought cookie is absent, the script can offer an
    alternative to the user:


    ![image](images/1g.jpg)Begin a PHP script with a test to find a cookie and retrieve
    data for output upon success


    **<?php**


    **if( isset( $\_COOKIE\[ ‘user’ \] ) )**


    **{**


    **$user \= $\_COOKIE\[ ‘user’ \] ;**


    **echo “<h1>Welcome $user !</h1><hr>” ;**


    **echo ‘<a href=”cookie\_data.php”>View Cookie</a>’ ;**


    **}**


    ![image](images/commong.jpg)


    cookie\_get.php


    ![image](images/2g.jpg)Next, add alternative output for when the cookie is absent


    **e**l**se**


    **{**


    **echo ‘Please <a href=”cookie\_form.html”>Log In</a>’ ;**


    **}**


    **?>**


    ![image](images/3g.jpg)Save the document in your web server’s /htdocs directory
    as cookie\_get.php


    ![image](images/4g.jpg)Now, open the HTML form cookie\_form.html (created [hereon
    page 160](#chapter10.xhtml#sec80)) via HTTP and push the submit button to see
    the login attempt fail validation, so no cookies are set


    ![image](images/pg162_2.jpg)


    ![image](images/5g.jpg)Click the hyperlink to return to the HTML form and enter
    a valid username, then push the submit button to see the login attempt fail validation
    again


    ![image](images/pg163_1.jpg)


    ![image](images/6g.jpg)Return to the HTML form once more and enter a valid username
    and password to see validation succeed


    ![image](images/pg163_2.jpg)


    ![image](images/7g.jpg)See [herepages 164-165](#chapter10.xhtml#sec83) for how
    to view data stored within cookies, using the cookie\_data.php target of the hyperlink
    seen above


    ![image](images/forget.jpg)


    You can also return to the HTML form and enter a username or a password that includes
    non-alphanumeric characters, to see validation fail again.


    ![image](images/hot.jpg)


    Validation could be extended. For example, it may also allow underscore characters
    and might specify a minimum permissible password length.


    **Viewing cookie data**


    ![image](images/pg164_1.jpg)


    The special PHP $\_COOKIE global array variable stores cookie names and values
    in an associative array of keys and values. Stored content can be viewed by looping
    through the array to see all names and values, or by using the PHP var\_dump()
    function:


    ![image](images/1g.jpg)Begin a PHP script with a test to find if any cookies are
    set and retrieve all stored names and values upon success


    **<?php**


    **if( count( $\_COOKIE ) > 0 )**


    **{**


    **echo ‘<dl> ‘ ;**


    **foreach( $\_COOKIE as $key \=> $value )**


    **{**


    **echo “<dt>Key: $key” ;**


    **echo “<dd>Value: $value” ;**


    **}**


    **echo ‘</dl><hr>’ ;**


    **var\_dump( $\_COOKIE ) ;**


    **}**


    ![image](images/commong.jpg)


    cookie\_data.php


    ![image](images/2g.jpg)Next, add alternative output for when cookies are absent


    **e**l**se**


    **{**


    **echo ‘Please <a href=”cookie\_form.html”>Log In</a>’ ;**


    **}**


    **?>**


    ![image](images/3g.jpg)Save the document in your web server’s /htdocs directory
    as cookie\_data.php


    ![image](images/4g.jpg)Now, open the HTML form cookie\_form.html ([herepage 160](#chapter10.xhtml#sec80))
    via HTTP and enter valid login data, then follow the link on cookie\_get.php ([herepage
    162](#chapter10.xhtml#sec82)) to see cookie data


    ![image](images/pg164_2.jpg)


    ![image](images/pg165_1.jpg)


    ![image](images/hot.jpg)


    You can call the **setcookie( )** function at any time to create a new cookie
    or overwrite an existing cookie.


    ![image](images/5g.jpg)Use the Settings menu on your web browser to clear existing
    cookies that are stored on your system


    ![image](images/pg165_2.jpg)


    ![image](images/6g.jpg)Now, use the ![image](images/pg165_3.jpg)Refresh button
    in your browser to reload this page and see the alternative content – confirming
    that the cookie data has been removed


    ![image](images/pg165_4.jpg)


    ![image](images/hot.jpg)


    The PHP manual describes the removal of a cookie by setting its value to empty
    and its expiration date to the past. For example, **setcookie($\_COOKIE\[ ‘user’
    \] , ‘‘ , time()-3600 )**. Additionally, the **unset()** function can be used
    to destroy a specified variable.


    **Submitting session data**


    ![image](images/pg166_1.jpg)


    User data can be stored in cookies on the client computer only if the user chooses
    to allow cookies onto their system. Many users prefer to disallow cookies, however,
    to avoid tracking – but PHP provides a better alternative. With PHP, user data
    can be stored on the server using the special $\_SESSION global array variable.
    In order for PHP sessions to work, each PHP page must call the built-in session\_start()
