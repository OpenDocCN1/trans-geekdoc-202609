    ### Submitting cookie data


    ![image](images/pg160_1.jpg)


    Data entered by a user is frequently required across multiple pages of a website.
    User data can conveniently be stored in small “cookie” files on the client machine,
    so the user need not tediously enter the same data repeatedly. The PHP `setcookie()`
    function makes it easy to create a cookie by specifying three arguments:


    `setcookie( name , value , expiry-time ) ;`


    When an HTML form is submitted to the server using the POST method, its field
    data is automatically assigned to the special PHP `$_POST` global array variable.
    A script can check for the presence of individual submission fields using a built-in
    PHP `isset()` function to seek an element of a specified HTML field name. When
    this confirms the field is indeed present, its name and value can usefully be
    stored in a cookie. This might be used to store username and password details
    for use across a website:


    ![image](images/1g.jpg) Create an HTML document and add this form to its body
    section, specifying submission method and the name of a PHP submission-handler
    script


    ```

    <form name = "entry" method = "POST"

    action = "cookie_set.php">

    <fieldset>

    <legend>Enter Only AlphaNumeric Characters</legend>

    Name : <input type = "text" name = "user" >

    Password : <input type = "password" name = "pass" >

    <br><br><input type = "submit" value = "Log In" >

    </fieldset>

    </form>

    ```


    ![image](images/pg160_2.jpg)


    cookie_form.html


    ![image](images/2g.jpg) Save the document in your web server’s `/htdocs` directory
    as `cookie_form.html` then open the page via HTTP to see the form


    ![image](images/pg160_3.jpg)


    ![image](images/hot.jpg)


    The `setcookie()` function can also accept arguments to specify visible path,
    domain, https security, and visibility for http access.


    ![image](images/snake.jpg)


    Storing passwords in cookies is not the most secure method but is used here merely
    to demonstrate how to use cookies to store data.


