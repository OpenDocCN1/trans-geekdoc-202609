    **Summary**


    •The PHP set\_cookie() function can be used to store user data on the client machine
    for use across the pages of a website.


    •There should be at least three arguments supplied to the set\_cookie() function
    to specify name, value and expiry time.


    •HTML form submissions via the POST method automatically assign field data to
    the PHP $\_POST global array variable.


    •The isset() function can seek an element of a specified HTML field name within
    the $\_POST global array.


    •The ctype\_alnum() function can be used to confirm a value only contains alphanumeric
    data for validation.


    •A hash conversion can be made of a password value using the md5() function for
    encryption.


    •The PHP header() function can specify a Location:URL to relocate the browser.


    •Once cookies are set, they are automatically assigned to the special PHP $\_COOKIE
    global array variable.


    •User data can be stored on the server in the PHP $\_SESSION global array variable
    as an alternative to cookie storage.


    •To use sessions, each PHP page must call the session\_start() function at the
    top of the page before any HTML tags.


    •HTML field data submitted to the $\_POST global array can be assigned to a $\_SESSION
    global variable array element.


    •The ctype\_alpha() function can be used to confirm a value only contains alphabetic
    letter data for validation.


    •The preg\_match() function can be used to confirm a value matches a specified
    pattern for validation.


    •Each session has a unique session ID number, which can be seen using the PHP
    session\_id() function.


    •Session variables can be removed using the unset() function, and a session can
    be terminated using the session\_destroy() function.


    •Stored content can be viewed using the var\_dump() function and by looping through
    the $\_COOKIE or $\_SESSION arrays.


    **11**


    **Adding Web Services**


    ***This chapter demonstrates how to incorporate XML data into PHP scripts.***


    [**Loading data**](#chapter11.xhtml#sec89)


    [**Getting nodes**](#chapter11.xhtml#sec90)


    [**Getting attributes**](#chapter11.xhtml#sec91)


    [**Including feeds**](#chapter11.xhtml#sec92)


    [**Setting parameters**](#chapter11.xhtml#sec93)


    [**Selecting components**](#chapter11.xhtml#sec94)


    [**Summary**](#chapter11.xhtml#sec95)


    **Loading data**


    There are many “Web Services” available online, which provide free data that can
    usefully be incorporated in your own web pages. Typical examples might supply
    live stock prices, the latest news stories, or current weather conditions.


    ![image](images/pg174_1.jpg)


    Most Web Services offer to supply data in the XML (eXtensible Markup Language)
    file format. This is designed to be both human-readable and machine-readable and
    is not reliant upon any single platform. For example, a Java program can send
    XML data over the internet to a .NET application, and vice versa.


    XML looks very much like HTML, but with XML you make up your own element names.
    The element tags surround content and may include attributes, as with HTML. It
    is important that each element has both opening and closing tags, and that elements
    are correctly nested for the XML document to be “well-formed”.


    ![image](images/pg174_3.jpg)


    ![image](images/snake.jpg)


    All XML documents must begin with an XML file type declaration – like the one
    shown here on line 1.


    ![image](images/pg174_2.jpg)


    catalog.xml


    ![image](images/hot.jpg)


    The **catalog.xml** file shown here will be used in the next few examples to demonstrate
    how to load XML data and how to access element values or attribute values.


    PHP provides an XML parser called “SimpleXML” that can load an XML document into
    memory as a hierarchical tree structure. The **simplexml\_load\_file()** function
    requires the XML file name and path to transform the document into a data structure
    comprising “SimpleXMLElement” objects. The data structure can then be explored
    using the **var\_dump()** function.


    ![image](images/1p.jpg)Begin a PHP script with a statement to set a page title
    and to preserve text formatting


    **<?php**


    **echo ‘<title>PHP SimpleXML</title><pre>’ ;**


    ![image](images/commonp.jpg)


    catalog.php


    ![image](images/2p.jpg)Next, add a statement to load the XML data or quit


    **$xml \= simplexml\_load\_file( ‘catalog.xml’ )**


    **or die( ‘Unable to load data!’ ) ;**


    ![image](images/3p.jpg)Now, display all the SimpleXMLElement objects


    **var\_dump( $xml ) ;**


    ![image](images/4p.jpg)Save the document in your web server’s **/htdocs** directory
    as **catalog.php**, alongside the **catalog.xml** file, then open the page via
    HTTP to see the SimpleXMLElement objects


    ![image](images/pg175_1.jpg)


    ![image](images/hot.jpg)


    Notice that this data structure depicts an array named “book” that has five array
    elements – corresponding to the five XML <book> elements.


    ![image](images/forget.jpg)


    The ubiquitous nature of XML makes it ideal to transport data across the internet.


    **Getting nodes**


    ![image](images/pg176_1.jpg)


    The data structure contained in a SimpleXML object describes a parent-child relationship
