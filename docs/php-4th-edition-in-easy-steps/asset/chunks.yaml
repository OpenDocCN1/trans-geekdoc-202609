    **Returning values**


    ![image](images/pg84_1.jpg)


    A custom PHP function can return a value to the caller by adding a statement using
    the return keyword, like this:


    **function *function\_name* ( )**


    **{**


    ***statement-to-be-executed ;***


    ***statement-to-be-executed ;***


    **return *value ;***


    **}**


    The return statement is optional and if omitted, functions will return a NULL
    value to the caller by default.


    Functions can only return a single item to the caller, so they cannot return multiple
    values. You can, however, assign multiple values to elements of an array and have
    a function return the single array to the caller, then unpack the values.


    A return statement can include an expression to be evaluated so its single result
    will be returned to the caller. For example:


    **function square( int $number )**


    **{**


    **return $number \* $number ;**


    **}**


    **echo square( 3 ) ;            # Outputs 9**


    To ensure a function will only return a value of a desired data type, the function
    declaration can, optionally, specify the return type description such as int,
    float, string, bool or array, like this:


    **function *function\_name* ( ) : int**


    **{**


    ***statement-to-be-executed ;***


    ***statement-to-be-executed ;***


    **return *value ;***


    **}**


    When a return data type is specified, a function that attempts to return an incorrect
    data type to the caller will result in an error.


