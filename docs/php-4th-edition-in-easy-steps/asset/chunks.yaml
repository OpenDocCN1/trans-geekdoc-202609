    \ `#` hash character, or alternatively they may begin with a `//` double-slash\
    \ sequence.\n\nMulti-line (block) comments must be enclosed within `/*` and `*/`\
    \ character sequences, as used in the C programming language:\n\n```\n<?php\n\
    echo ‘First statement’ ; // A single-line comment.\n/* This is a multi-line comment\
    \  \ncontaining two lines of comment. */\necho ‘Second statement’ ;\necho ‘Final\
    \ statement’ ; # Another single-line comment.\n?>\n```\n\n![image](images/hot.jpg)\n\
    \nThe `//` single-line comment style is also used in C++ programming and the `#`\
    \ single-line comment style is also used in Unix/Linux BASH shell scripting.\n\
    \n## Improving performance\n\n![image](images/pg20_1.jpg)\n\nIt is useful to understand\
    \ that the PHP engine performs a sequence of operations in order to execute your\
    \ PHP code:\n\n- **Lexing** – analyzes the code and generates a series of “tokens”.\
    \ For example, the tag `<?php` generates the token `T_OPEN_TAG`, the keyword `echo`\
    \ generates the token `T_ECHO` and the string `\"Hello World!\"` generates `T_CONSTANT_ENCAPSED_STRING`.\n\
    - **Parsing** – arranges the tokens into an “Abstract Syntax Tree” (AST). This\
    \ represents what operations should be performed. For example, the AST to print\
    \ the result of adding two numbers might look something like this:\n\n```\noperation\
    \ => ECHO,\noperand => expression (\noperation => ADD,\noperand1 => 4,\noperand2\
    \ => 8\n)\n```\n- **Compiling** – translates the Abstract Syntax Tree into instructional\
    \ operation code (“OPcode”). This is an Intermediate Representation (IR) in machine\
    \ language.\n- **Executing** – runs the OPcode on the “Zend Virtual Machine” (VM).\
    \ This interprets the OPcode to produce output.\n\nPerforming all these steps\
    \ each time to execute a PHP script is not very efficient, so PHP includes an\
    \ extension named “OPcache” that can be enabled to improve performance. OPcache\
    \ stores OPcodes in memory so that lexing, parsing and compiling will only be\
    \ performed when the PHP script is first executed. Subsequently, the low-level\
    \ Intermediate Representation stored in memory can be executed on the Zend VM\
    \ immediately.\n\n![image](images/pg20_2.jpg)\n\nTo enable OPcache you will need\
    \ to edit PHP’s initialization file. The PHP installation folder, such as `C:\\\
    \\PHP`, contains files named `php.ini-development` and `php.ini-production`, which\
    \ are initialization template files. When starting, PHP tries to find and load\
