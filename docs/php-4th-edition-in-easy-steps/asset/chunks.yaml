- raw: "The ability to read and write files located on the web server is useful to\
    \ log information and to provide page content. In order to process files, a “filestream”\
    \ object must first be created using the PHP fopen() function. This requires two\
    \ arguments to specify the name or path of the file and a file “mode”. The file\
    \ mode determines the nature of the operation to be performed and places the file\
    \ pointer at a suitable position within the file:\n\n| **File mode** || **Operation**\
    \ |\n\n| --- | --- |\n\n| r || Open an existing file to read  \n\nFile pointer\
    \ starts at the beginning of the file |\n\n| w || Discard all contents of an existing\
    \ file or create a new file if none exists  \n\nFile pointer starts at the beginning\
    \ of the file |\n\n| a || Open an existing file and preserve all contents  \n\n\
    File pointer starts at the end of the file |\n\n| r+ || Open a file to read from\
    \ or write to  \n\nFile pointer starts at the beginning of the file |\n\n| w+\
    \ || Open a file to write to or read from  \n\nDiscard all contents of an existing\
    \ file or create a new file if none exists  \n\nFile pointer starts at the beginning\
    \ of the file |\n\n| a+ || Open a file to read from or write to and preserve all\
    \ contents  \n\nFile pointer starts at the end of the file |\n\n![image](images/snake.jpg)\n\
    \nThe file mode specifier must appear within quote marks when supplied as an argument\
    \ to the **fopen()** function.\n\nIt is good practice to always provide an alternative\
    \ with the die() function in case the attempt to create a filestream fails.\n\n\
    ![image](images/hot.jpg)\n\nSpecify an explanatory message as an argument to the\
    \ **die()** function.\n\nWhen a filestream is created successfully, the file can\
    \ be read by specifying the filestream and byte size as arguments to the fread()\
    \ function. If the whole file is to be read it is convenient to use the filesize()\
    \ function to specify the byte size of the file to be read.\n\nUpon completion\
    \ of any file operation, the filestream must be destroyed by specifying it as\
    \ an argument to the fclose() function.\n\n![image](images/pg125_1.jpg)\n\n![image](images/pg125_2.jpg)\n\
    \nmanifesto.txt\n\n![image](images/1b.jpg)Begin a PHP script with statements that\
    \ attempt to open a plain text file for reading, or exit the script upon failure\n\
    \n**<?php**\n\n**$filestream \\= fopen( ‘manifesto.txt’ , ‘r’ )**\n\n**or** **die(\
    \ ‘Unable to open file!’ ) ;**\n\n![image](images/commonb.jpg)\n\nread.php\n\n\
    ![image](images/2b.jpg)Next, add a statement to read the text file upon success\
    \ and display its entire contents\n\n**echo fread( $filestream , filesize( ‘manifesto.txt’\
    \ ) ) ;**\n\n![image](images/3b.jpg)Now, remember to close the filestream\n\n\
    **fclose( $filestream ) ;**\n\n![image](images/4b.jpg)Save the document in your\
    \ web server’s /htdocs directory as read.php, alongside the plain text file to\
    \ be read, then open the page via HTTP to see the text file contents displayed\
    \ in the browser window\n\n![image](images/pg125_3.jpg)\n\n![image](images/forget.jpg)\n\
    \nUnlike a PHP block within an HTML document, a purely PHP script needs no closing\
    \ **?>** tag.\n\n![image](images/forget.jpg)\n\nNotice that the output here does\
    \ not maintain line endings – but the example [hereon page 126](#chapter08.xhtml#sec62)\
    \ does.\n\n**Reading lines**\n\n![image](images/pg126_1.jpg)\n\nOnce a “filestream”\
    \ object is created, its contents can be read one line at a time by specifying\
    \ the filestream as an argument to the PHP fgets() function. To read every line,\
    \ this function can be called repeatedly in a loop. The feof() function can determine\
    \ when the end of the file is reached and can end the loop:\n\n![image](images/pg126_2.jpg)\n\
    \n![image](images/forget.jpg)\n\nThe **feof()** function returns true when the\
    \ end of the file is reached.\n\n![image](images/1b.jpg)Begin a PHP script with\
    \ statements that attempt to open a plain text file for reading, or exit the script\
    \ upon failure\n\n**<?php**\n\n**$filestream \\= fopen( ‘manifesto.txt’ , ‘r’\
    \ )**\n\n**or** **die( ‘Unable to open file!’ ) ;**\n\n![image](images/commonb.jpg)\n\
    \nreadlines.php\n\n![image](images/2b.jpg)Next, add a loop to read the text file\
    \ line-by-line upon success and display its entire contents\n\n**while( !feof(\
    \ $filestream ) )**\n\n**{ echo fgets( $filestream ).’<br>’ ; }**\n\n![image](images/3b.jpg)Now,\
    \ remember to close the filestream\n\n**fclose( $filestream ) ;**\n\n![image](images/4b.jpg)Save\
    \ the document in your web server’s /htdocs directory as readlines.php, alongside\
    \ the plain text file to be read, then open the page via HTTP to see the text\
    \ file lines\n\n![image](images/pg126_3.jpg)\n\n![image](images/hot.jpg)\n\nThe\
    \ next to last line is not actually empty – it contains an invisible newline character.\n\
    \n**Reading characters**\n\n![image](images/pg127_1.jpg)\n\nOnce a “filestream”\
    \ object is created, its contents can be read one character at a time by specifying\
    \ the filestream as an argument to the PHP fgetc() function. To read every character,\
    \ this function can be called repeatedly in a loop. The fgetc() function will\
    \ return false when the end of the file is reached and can end the loop:\n\n![image](images/pg127_2.jpg)\n\
    \n![image](images/pg127_3.jpg)\n\ntitle.txt\n\n![image](images/1b.jpg)Begin a\
    \ PHP script with statements that attempt to open a plain text file for reading,\
    \ or exit the script upon failure\n\n**<?php**\n\n**$filestream \\= fopen( ‘title.txt’\
    \ , ‘r’ )**\n\n**o**r **die( ‘Unable to open file!’ ) ;**\n\n![image](images/commonb.jpg)\n\
    \nreadchars.php\n\n![image](images/2b.jpg)Next, add a loop to read the text file\
    \ character-by-character upon success and display its entire contents\n\n**while(\
    \ $char \\= fgetc( $filestream ) )**\n\n**{ echo $char.’ \\* ‘ ; }**\n\n![image](images/3b.jpg)Now,\
    \ remember to close the filestream\n\n**fclose( $filestream ) ;**\n\n![image](images/4b.jpg)Save\
    \ the document in your web server’s /htdocs directory as readchars.php, alongside\
    \ the plain text file to be read, then open the page via HTTP to see the file\
    \ characters\n\n![image](images/pg127_4.jpg)\n\n![image](images/forget.jpg)\n\n\
    The **fgetc()** function returns false when there are no more characters to get\
    \ from the stream.\n\n**Writing a file**\n\n![image](images/pg128_1.jpg)\n\nOnce\
    \ a “filestream” object has been created specifying a write mode, a text file\
    \ can be created. Text can be written into the file by specifying the filestream\
    \ and a file name to the PHP fwrite() function. To format the text, non-printing\
    \ invisible characters can also be written to create line breaks and tab spacing:\n\
    \n| **Character** || **Description** |\n\n| --- | --- |\n\n| **\\\\n** || Newline\
    \  \n\nMove to a new line down |\n\n| **\\\\r** || Carriage return  \n\nMove to\
    \ the beginning of the line |\n\n| **\\\\t** || Tab  \n\nMove along the line to\
    \ the next tab stop |\n\n![image](images/1b.jpg)Begin a PHP script with a statement\
    \ to assign text, including non-printing characters for formatting\n\n**<?php**\n\
    \n**$poem \\= “\\\\r\\\\n\\\\tI never saw a man who looked” ;**\n\n**$poem .=\
    \ “\\\\r\\\\n\\\\tWith such a wistful eye” ;**\n\n**$poem .= “\\\\r\\\\n\\\\tUpon\
    \ that little tent of blue” ;**\n\n**$poem .= “\\\\r\\\\n\\\\tWhich prisoners\
    \ call the sky” ;**\n\n![image](images/commonb.jpg)\n\nwrite.php\n\n![image](images/2b.jpg)Next,\
    \ assign a name for the file to be written\n\n**$filename \\= ‘poem.txt’ ;**\n\
    \n![image](images/3b.jpg)Attempt to create a plain text file for writing, or exit\
    \ the script upon failure\n\n**$filestream \\= fopen( $filename , ‘w’ )**\n\n\
    **or** **die( ‘Unable to open file!’ ) ;**\n\n![image](images/4b.jpg)Write the\
    \ file and display a confirmation of how many bytes have been written in total\n\
    \n**$num \\= fwrite( $filestream , $poem ) ;**\n\n**if( $num )**\n\n**{**\n\n\
    **echo “$num bytes written to $filename” ;**\n\n**}**\n\n![image](images/5b.jpg)Now,\
    \ remember to close the filestream\n\n**fclose( $filestream ) ;**\n\n![image](images/snake.jpg)\n\
    \nStrings containing non-printing characters must be enclosed within double quotes\
    \ so that PHP can interpret them.\n\n![image](images/6b.jpg)Save the document\
    \ in your web server’s /htdocs directory as write.php then open the page via HTTP\
    \ to see confirmation that the text file has been written\n\n![image](images/pg129_1.jpg)"
  fmt: "\n# Reading and Writing Files with PHP\n\nThe ability to read and write files\
    \ located on the web server is useful to log information and to provide page content.\
    \ In order to process files, a “filestream” object must first be created using\
    \ the PHP `fopen()` function. This requires two arguments to specify the name\
    \ or path of the file and a file “mode”. The file mode determines the nature of\
    \ the operation to be performed and places the file pointer at a suitable position\
    \ within the file:\n\n| File mode | Operation |\n| --- | --- |\n| r | Open an\
    \ existing file to read<br>File pointer starts at the beginning of the file |\n\
    | w | Discard all contents of an existing file or create a new file if none exists<br>File\
    \ pointer starts at the beginning of the file |\n| a | Open an existing file and\
    \ preserve all contents<br>File pointer starts at the end of the file |\n| r+\
    \ | Open a file to read from or write to<br>File pointer starts at the beginning\
    \ of the file |\n| w+ | Open a file to write to or read from<br>Discard all contents\
    \ of an existing file or create a new file if none exists<br>File pointer starts\
    \ at the beginning of the file |\n| a+ | Open a file to read from or write to\
    \ and preserve all contents<br>File pointer starts at the end of the file |\n\n\
    ![image](images/snake.jpg)\n\nThe file mode specifier must appear within quote\
    \ marks when supplied as an argument to the `fopen()` function.\n\nIt is good\
    \ practice to always provide an alternative with the `die()` function in case\
    \ the attempt to create a filestream fails.\n\n![image](images/hot.jpg)\n\nSpecify\
    \ an explanatory message as an argument to the `die()` function.\n\nWhen a filestream\
    \ is created successfully, the file can be read by specifying the filestream and\
    \ byte size as arguments to the `fread()` function. If the whole file is to be\
    \ read it is convenient to use the `filesize()` function to specify the byte size\
    \ of the file to be read.\n\nUpon completion of any file operation, the filestream\
    \ must be destroyed by specifying it as an argument to the `fclose()` function.\n\
    \n![image](images/pg125_1.jpg)\n\n![image](images/pg125_2.jpg)\n\n`manifesto.txt`\n\
    \n![image](images/1b.jpg)Begin a PHP script with statements that attempt to open\
    \ a plain text file for reading, or exit the script upon failure\n\n```php\n<?php\n\
    $filestream = fopen('manifesto.txt', 'r') or die('Unable to open file!');\n```\n\
    \n![image](images/commonb.jpg)\n\n`read.php`\n\n![image](images/2b.jpg)Next, add\
    \ a statement to read the text file upon success and display its entire contents\n\
    \n```php\necho fread($filestream, filesize('manifesto.txt'));\n```\n\n![image](images/3b.jpg)Now,\
    \ remember to close the filestream\n\n```php\nfclose($filestream);\n```\n\n![image](images/4b.jpg)Save\
    \ the document in your web server’s `/htdocs` directory as `read.php`, alongside\
    \ the plain text file to be read, then open the page via HTTP to see the text\
    \ file contents displayed in the browser window\n\n![image](images/pg125_3.jpg)\n\
    \n![image](images/forget.jpg)\n\nUnlike a PHP block within an HTML document, a\
    \ purely PHP script needs no closing `?>` tag.\n\n![image](images/forget.jpg)\n\
    \nNotice that the output here does not maintain line endings – but the example\
    \ [hereon page 126](#chapter08.xhtml#sec62) does.\n\n## Reading lines\n\n![image](images/pg126_1.jpg)\n\
    \nOnce a “filestream” object is created, its contents can be read one line at\
    \ a time by specifying the filestream as an argument to the PHP `fgets()` function.\
    \ To read every line, this function can be called repeatedly in a loop. The `feof()`\
    \ function can determine when the end of the file is reached and can end the loop:\n\
    \n![image](images/pg126_2.jpg)\n\n![image](images/forget.jpg)\n\nThe `feof()`\
    \ function returns true when the end of the file is reached.\n\n![image](images/1b.jpg)Begin\
    \ a PHP script with statements that attempt to open a plain text file for reading,\
    \ or exit the script upon failure\n\n```php\n<?php\n$filestream = fopen('manifesto.txt',\
    \ 'r') or die('Unable to open file!');\n```\n\n![image](images/commonb.jpg)\n\n\
    `readlines.php`\n\n![image](images/2b.jpg)Next, add a loop to read the text file\
    \ line-by-line upon success and display its entire contents\n\n```php\nwhile (!feof($filestream))\
    \ {\n    echo fgets($filestream).'<br>';\n}\n```\n\n![image](images/3b.jpg)Now,\
    \ remember to close the filestream\n\n```php\nfclose($filestream);\n```\n\n![image](images/4b.jpg)Save\
    \ the document in your web server’s `/htdocs` directory as `readlines.php`, alongside\
    \ the plain text file to be read, then open the page via HTTP to see the text\
    \ file lines\n\n![image](images/pg126_3.jpg)\n\n![image](images/hot.jpg)\n\nThe\
    \ next to last line is not actually empty – it contains an invisible newline character.\n\
    \n## Reading characters\n\n![image](images/pg127_1.jpg)\n\nOnce a “filestream”\
    \ object is created, its contents can be read one character at a time by specifying\
    \ the filestream as an argument to the PHP `fgetc()` function. To read every character,\
    \ this function can be called repeatedly in a loop. The `fgetc()` function will\
    \ return false when the end of the file is reached and can end the loop:\n\n![image](images/pg127_2.jpg)\n\
    \n![image](images/pg127_3.jpg)\n\n`title.txt`\n\n![image](images/1b.jpg)Begin\
    \ a PHP script with statements that attempt to open a plain text file for reading,\
    \ or exit the script upon failure\n\n```php\n<?php\n$filestream = fopen('title.txt',\
    \ 'r') or die('Unable to open file!');\n```\n\n![image](images/commonb.jpg)\n\n\
    `readchars.php`\n\n![image](images/2b.jpg)Next, add a loop to read the text file\
    \ character-by-character upon success and display its entire contents\n\n```php\n\
    while ($char = fgetc($filestream)) {\n    echo $char.' * ';\n}\n```\n\n![image](images/3b.jpg)Now,\
    \ remember to close the filestream\n\n```php\nfclose($filestream);\n```\n\n![image](images/4b.jpg)Save\
    \ the document in your web server’s `/htdocs` directory as `readchars.php`, alongside\
    \ the plain text file to be read, then open the page via HTTP to see the file\
    \ characters\n\n![image](images/pg127_4.jpg)\n\n![image](images/forget.jpg)\n\n\
    The `fgetc()` function returns false when there are no more characters to get\
    \ from the stream.\n\n## Writing a file\n\n![image](images/pg128_1.jpg)\n\nOnce\
    \ a “filestream” object has been created specifying a write mode, a text file\
    \ can be created. Text can be written into the file by specifying the filestream\
    \ and a file name to the PHP `fwrite()` function. To format the text, non-printing\
    \ invisible characters can also be written to create line breaks and tab spacing:\n\
    \n| Character | Description |\n| --- | --- |\n| `\\n` | Newline<br>Move to a new\
    \ line down |\n| `\\r` | Carriage return<br>Move to the beginning of the line\
    \ |\n| `\\t` | Tab<br>Move along the line to the next tab stop |\n\n![image](images/1b.jpg)Begin\
    \ a PHP script with a statement to assign text, including non-printing characters\
    \ for formatting\n\n```php\n<?php\n$poem = \"\\r\\n\\tI never saw a man who looked\"\
    ;\n$poem .= \"\\r\\n\\tWith such a wistful eye\";\n$poem .= \"\\r\\n\\tUpon that\
    \ little tent of blue\";\n$poem .= \"\\r\\n\\tWhich prisoners call the sky\";\n\
    ```\n\n![image](images/commonb.jpg)\n\n`write.php`\n\n![image](images/2b.jpg)Next,\
    \ assign a name for the file to be written\n\n```php\n$filename = 'poem.txt';\n\
    ```\n\n![image](images/3b.jpg)Attempt to create a plain text file for writing,\
    \ or exit the script upon failure\n\n```php\n$filestream = fopen($filename, 'w')\
    \ or die('Unable to open file!');\n```\n\n![image](images/4b.jpg)Write the file\
    \ and display a confirmation of how many bytes have been written in total\n\n\
    ```php\n$num = fwrite($filestream, $poem);\nif ($num) {\n    echo \"$num bytes\
    \ written to $filename\";\n}\n```\n\n![image](images/5b.jpg)Now, remember to close\
    \ the filestream\n\n```php\nfclose($filestream);\n```\n\n![image](images/snake.jpg)\n\
    \nStrings containing non-printing characters must be enclosed within double quotes\
    \ so that PHP can interpret them.\n\n![image](images/6b.jpg)Save the document\
    \ in your web server’s `/htdocs` directory as `write.php` then open the page via\
    \ HTTP to see confirmation that the text file has been written\n\n![image](images/pg129_1.jpg)\n"
  trans: "\n# 使用 PHP 读取和写入文件\n\n能够读取和写入位于 Web 服务器上的文件对于记录信息和提供页面内容非常有用。为了处理文件，必须首先使用\
    \ PHP `fopen()` 函数创建“filestream”对象。这需要两个参数来指定文件的名称或路径以及文件“mode”。文件模式决定要执行的操作性质，并将文件指针放置在文件内的合适位置：\n\
    \n| 文件模式 | 操作 |\n| --- | --- |\n| r | 打开已存在的文件进行读取<br>文件指针从文件开头开始 |\n| w | 丢弃现有文件的所有内容或如果不存在则创建新文件<br>文件指针从文件开头开始\
    \ |\n| a | 打开已存在的文件并保留所有内容<br>文件指针从文件末尾开始 |\n| r+ | 打开文件以便读取或写入<br>文件指针从文件开头开始\
    \ |\n| w+ | 打开文件以便写入或读取<br>丢弃现有文件的所有内容或如果不存在则创建新文件<br>文件指针从文件开头开始 |\n| a+ | 打开文件以便读取或写入并保留所有内容<br>文件指针从文件末尾开始\
    \ |\n\n![image](img/snake.jpg)\n\n当作为 `fopen()` 函数的参数提供时，文件模式说明符必须出现在引号内。\n\n\
    如果创建文件流的尝试失败，最好始终使用 `die()` 函数提供替代方案。\n\n![image](img/hot.jpg)\n\n将解释性消息指定为 `die()`\
    \ 函数的参数。\n\n当文件流成功创建后，可以通过将文件流和字节大小指定为 `fread()` 函数的参数来读取文件。如果要读取整个文件，使用 `filesize()`\
    \ 函数指定要读取的文件的字节大小会很方便。\n\n完成任何文件操作后，必须通过将其指定为 `fclose()` 函数的参数来销毁文件流。\n\n![image](img/pg125_1.jpg)\n\
    \n![image](img/pg125_2.jpg)\n\n`manifesto.txt`\n\n![image](img/1b.jpg)使用语句开始一个\
    \ PHP 脚本以尝试打开纯文本文件进行读取，或在失败时退出脚本\n\n```php\n<?php\n$filestream = fopen('manifesto.txt',\
