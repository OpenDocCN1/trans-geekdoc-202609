- raw: 'It is generally preferable to restrict parameters to accept only one specific
    data type, but sometimes you may want a parameter to allow calls to pass values
    of different data types. This is possible by specifying the acceptable data types
    in the function definition as a “union type”. This is pipe-separated list of PHP
    data types before the parameter name with this syntax:


    **function *function\_name* ( *type*|*type*|*type* $*arg* )**


    Similarly, multiple acceptable data types of the value returned from a function
    can be specified as a union type with a pipe-separated list in a function definition:


    **function *function\_name* ( *type*|*type* $*arg* ) : *type*|*type***


    Union types support all the PHP data types except for void, but does support the
    special null type. This means that a function can return a value of a specific
    data type or null. This is a fairly common requirement known as a “nullable union”
    . It can be specified as a pipe-separated list or with a shorthand notation:


    ***type*|null** or **?*type***


    ![image](images/hot.jpg)


    Union types is a great new feature introduced in PHP 8.


    The shorthand version can only be used with a single data type, not with a union
    type, and the null type can only be used as part of a union type.


    PHP also has a mixed pseudo type that allows a parameter or return value to be
    of any type except for void. It is equivalent to a union type that looks like
    this:


    **string|int|float|bool|null|array|object|callable|resource**


    The mixed pseudo type cannot be used in union with other types because it already
    represents all acceptable types. When no data type is explicitly specified for
    a parameter, PHP assumes the type to be mixed. When no data type is explicitly
    specified for a function’s return value, PHP assumes the type to be mixed or void.


    ![image](images/hot.jpg)


    The **callable** type is simply a type hint. It may be specified for a parameter
    that accepts a callable function.


    ![image](images/1o.jpg)Begin a PHP script by defining a function that can accept
    an integer or floating-point number as its argument, and can return either an
    integer or floating-point number


    **<?php**


    **function half( int|float $arg ) : int|float**


    **{**


    **// Statements to be inserted here.**


    **}**


    ![image](images/commono.jpg)


    union.php


    ![image](images/2o.jpg)Next, insert statements to call another function to describe
    the argument, and return half of its value


    **echo desc ( ‘<dt>Argument’ , $arg ) ;**


    **return $arg/2 ;**


    ![image](images/3o.jpg)Now, add the other function that will return a string describing
    the numerical argument value it receives


    **function desc( string $str, mixed $val ) : string**


    **{**


    **return $str.’ ‘.$val.’ - ‘.gettype( $val ) ;**


    **}**


    ![image](images/4o.jpg)Finally, add statements to call the functions, passing
    integer and floating-point values


    **echo desc( ‘<dd>Return’, half( 100 ) ).’<hr>’ ;**


    **echo desc( ‘<dd>Return’, half( 33 ) ).’<hr>’ ;**


    **echo desc( ‘<dd>Return’, half( 3.142 ) ) ;**


    **?>**


    ![image](images/5o.jpg)Save the document in your web server’s /htdocs directory
    as union.php then open the page via HTTP to see the integer and floating-point
    argument and return values


    ![image](images/pg87_1.jpg)


    ![image](images/hot.jpg)


    Union types can be used in all places where types can be specified – for parameters,
    return types, and for class properties in Object Oriented Programming (see [Chapter
    7](#chapter07.xhtml)).


    **Calling back**


    ![image](images/pg88_1.jpg)


    PHP allows you to create “anonymous” functions that have no name specified in
    the function definition. Like other functions, these can accept arguments if parameters
    are specified and they can optionally return a value when called. Unlike other
    function definitions, which are code constructs, an anonymous function definition
    is an expression. This means that each anonymous function definition must be terminated
    by a semicolon, like this:


    **function ( )**


    **{**


    ***statement-to-be-executed ;***


    ***statement-to-be-executed ;***


    **return *value ;***


    **} ;**


    ![image](images/snake.jpg)


    Don’t forget to add a terminating **;** semicolon after each anonymous function
    definition.


    On its own an anonymous function is of little use as, without a name, it cannot
    be called, but it can be useful in other ways:


    •Assigned to a variable, an anonymous function can be called using the variable
    name.


    •Passed as a callable argument to another function, an anonymous function can
    be called later as a “callback”.


    •Returned from a function, an anonymous function retains access to the returning
    function’s variables in “closure”.


    By assigning an anonymous function to a variable you do, in effect, give the function
    a name and can call it and pass it arguments as you would any other function –
    using the variable name. Similarly, when you pass an anonymous function to another
    function it can be called back and passed arguments as you would any other function
    – using the parameter name. The PHP use keyword and & ampersand prefix allow an
    anonymous function to reference a local variable in the returning function.


    ![image](images/1o.jpg)Begin a PHP script by assigning to a variable an anonymous
    function that accepts a single argument


    **<?php**


    **$hello \= function ( $user ) { echo “Hello $user!<br>” ; } ;**


    ![image](images/commono.jpg)


    callback.php


    ![image](images/2o.jpg)Next, add a statement that calls the anonymous function
    and passes a single argument


    **$hello( ‘Mike’ ) ;**


    ![image](images/3o.jpg)Now, define a regular function that accepts a single callable
    argument and calls that function passing a string


    **function greet( callable $anon )**


    **{**


    **$anon( ‘Carole Anne’ ) ;**


    **}**


    ![image](images/4o.jpg)Add a statement to call the function, defined in the previous
    step, passing the anonymous function that was assigned to a variable in the first
    step


    **greet( $hello ) ;**


    ![image](images/5o.jpg)Next, define another regular function that has one local
    variable and returns an anonymous function that references the local variable
    value


    **function meet() : callable**


    **{**


    **$time \= ‘morning’ ;**


    **return function( $name ) use( &$time )**


    **{ return “Good $time, $name!” ; } ;**


    **}**


    ![image](images/6o.jpg)Assign to a variable the function defined in the previous
    step then call that function, passing a string argument


    **$meeting \= meet() ;**


    **echo $meeting( ‘Susan’ ) ;**


    **?>**


    ![image](images/7o.jpg)Save the document in your web server’s /htdocs directory
    as callback.php then open the page via HTTP to see the returned values from anonymous
    functions


    ![image](images/pg75_1.jpg)


    ![image](images/forget.jpg)


    Remember to include the **&** ampersand prefix to create a reference to the variable
    value.


    ![image](images/hot.jpg)


    Notice that the final function call gets the **‘morning’** string from the parent
    scope.


    **Summary**


    •Custom functions allow PHP scripts to be modularized into sections of code that
    are easier to understand and maintain.


    •Function names must begin with a letter or underscore character and are not case-sensitive.


    •A function is defined by stating its name after the function keyword, then parentheses
    and braces containing statements.


    •A function accepting arguments is defined by including a comma-separated list
    of parameters within the parentheses.


    •Optionally, a function definition can specify the type of data to be passed from
    the caller before the parameter name.


    •Argument data is normally passed by value but can be passed by reference if the
    parameter name is given an & prefix.


    •Default argument values can optionally be specified in a function definition
    by assignment to the parameter name.


    •The … splat operator allows multiple arguments to be passed to a parameter in
    order to create an array.


    •Named parameters allow a caller to pass argument values to the function in any
    order.'
  fmt: "\n# Union Types\n\nIt is generally preferable to restrict parameters to accept\
    \ only one specific data type, but sometimes you may want a parameter to allow\
    \ calls to pass values of different data types. This is possible by specifying\
    \ the acceptable data types in the function definition as a “union type”. This\
    \ is pipe-separated list of PHP data types before the parameter name with this\
    \ syntax:\n\n`function function_name ( type|type|type $arg )`\n\nSimilarly, multiple\
    \ acceptable data types of the value returned from a function can be specified\
    \ as a union type with a pipe-separated list in a function definition:\n\n`function\
    \ function_name ( type|type $arg ) : type|type`\n\nUnion types support all the\
    \ PHP data types except for `void`, but does support the special `null` type.\
    \ This means that a function can return a value of a specific data type or `null`.\
    \ This is a fairly common requirement known as a “nullable union”. It can be specified\
    \ as a pipe-separated list or with a shorthand notation:\n\n`type|null` or `?type`\n\
    \n![image](images/hot.jpg)\n\nUnion types is a great new feature introduced in\
    \ PHP 8.\n\nThe shorthand version can only be used with a single data type, not\
    \ with a union type, and the `null` type can only be used as part of a union type.\n\
    \nPHP also has a `mixed` pseudo type that allows a parameter or return value to\
    \ be of any type except for `void`. It is equivalent to a union type that looks\
    \ like this:\n\n`string|int|float|bool|null|array|object|callable|resource`\n\n\
    The `mixed` pseudo type cannot be used in union with other types because it already\
    \ represents all acceptable types. When no data type is explicitly specified for\
    \ a parameter, PHP assumes the type to be `mixed`. When no data type is explicitly\
    \ specified for a function’s return value, PHP assumes the type to be `mixed`\
    \ or `void`.\n\n![image](images/hot.jpg)\n\nThe `callable` type is simply a type\
    \ hint. It may be specified for a parameter that accepts a callable function.\n\
    \n## Example\n\n![image](images/1o.jpg)Begin a PHP script by defining a function\
    \ that can accept an integer or floating-point number as its argument, and can\
    \ return either an integer or floating-point number\n\n```php\n<?php\nfunction\
    \ half( int|float $arg ) : int|float\n{\n    // Statements to be inserted here.\n\
    }\n```\n\n![image](images/commono.jpg)\n\n`union.php`\n\n![image](images/2o.jpg)Next,\
    \ insert statements to call another function to describe the argument, and return\
    \ half of its value\n\n```php\necho desc ( '<dt>Argument' , $arg ) ;\nreturn $arg/2\
    \ ;\n```\n\n![image](images/3o.jpg)Now, add the other function that will return\
    \ a string describing the numerical argument value it receives\n\n```php\nfunction\
    \ desc( string $str, mixed $val ) : string\n{\n    return $str.' '.$val.' - '.gettype(\
    \ $val ) ;\n}\n```\n\n![image](images/4o.jpg)Finally, add statements to call the\
    \ functions, passing integer and floating-point values\n\n```php\necho desc( '<dd>Return',\
    \ half( 100 ) ).'<hr>' ;\necho desc( '<dd>Return', half( 33 ) ).'<hr>' ;\necho\
    \ desc( '<dd>Return', half( 3.142 ) ) ;\n?>\n```\n\n![image](images/5o.jpg)Save\
    \ the document in your web server’s `/htdocs` directory as `union.php` then open\
    \ the page via HTTP to see the integer and floating-point argument and return\
    \ values\n\n![image](images/pg87_1.jpg)\n\n![image](images/hot.jpg)\n\nUnion types\
    \ can be used in all places where types can be specified – for parameters, return\
    \ types, and for class properties in Object Oriented Programming (see [Chapter\
    \ 7](#chapter07.xhtml)).\n\n# Calling back\n\n![image](images/pg88_1.jpg)\n\n\
    PHP allows you to create “anonymous” functions that have no name specified in\
    \ the function definition. Like other functions, these can accept arguments if\
    \ parameters are specified and they can optionally return a value when called.\
    \ Unlike other function definitions, which are code constructs, an anonymous function\
    \ definition is an expression. This means that each anonymous function definition\
    \ must be terminated by a semicolon, like this:\n\n```php\nfunction ( )\n{\n \
    \   statement-to-be-executed ;\n    statement-to-be-executed ;\n    return value\
    \ ;\n} ;\n```\n\n![image](images/snake.jpg)\n\nDon’t forget to add a terminating\
    \ `;` semicolon after each anonymous function definition.\n\nOn its own an anonymous\
    \ function is of little use as, without a name, it cannot be called, but it can\
    \ be useful in other ways:\n\n•Assigned to a variable, an anonymous function can\
    \ be called using the variable name.\n•Passed as a callable argument to another\
    \ function, an anonymous function can be called later as a “callback”.\n•Returned\
    \ from a function, an anonymous function retains access to the returning function’s\
    \ variables in “closure”.\n\nBy assigning an anonymous function to a variable\
    \ you do, in effect, give the function a name and can call it and pass it arguments\
    \ as you would any other function – using the variable name. Similarly, when you\
    \ pass an anonymous function to another function it can be called back and passed\
    \ arguments as you would any other function – using the parameter name. The PHP\
    \ `use` keyword and `&` ampersand prefix allow an anonymous function to reference\
    \ a local variable in the returning function.\n\n## Example\n\n![image](images/1o.jpg)Begin\
    \ a PHP script by assigning to a variable an anonymous function that accepts a\
    \ single argument\n\n```php\n<?php\n$hello \\= function ( $user ) { echo “Hello\
    \ $user!<br>” ; } ;\n```\n\n![image](images/commono.jpg)\n\n`callback.php`\n\n\
    ![image](images/2o.jpg)Next, add a statement that calls the anonymous function\
    \ and passes a single argument\n\n```php\n$hello( ‘Mike’ ) ;\n```\n\n![image](images/3o.jpg)Now,\
    \ define a regular function that accepts a single callable argument and calls\
    \ that function passing a string\n\n```php\nfunction greet( callable $anon )\n\
    {\n    $anon( ‘Carole Anne’ ) ;\n}\n```\n\n![image](images/4o.jpg)Add a statement\
    \ to call the function, defined in the previous step, passing the anonymous function\
    \ that was assigned to a variable in the first step\n\n```php\ngreet( $hello )\
    \ ;\n```\n\n![image](images/5o.jpg)Next, define another regular function that\
    \ has one local variable and returns an anonymous function that references the\
    \ local variable value\n\n```php\nfunction meet() : callable\n{\n    $time \\\
    = ‘morning’ ;\n    return function( $name ) use( &$time )\n    { return “Good\
    \ $time, $name!” ; } ;\n}\n```\n\n![image](images/6o.jpg)Assign to a variable\
    \ the function defined in the previous step then call that function, passing a\
    \ string argument\n\n```php\n$meeting \\= meet() ;\necho $meeting( ‘Susan’ ) ;\n\
    ?>\n```\n\n![image](images/7o.jpg)Save the document in your web server’s `/htdocs`\
    \ directory as `callback.php` then open the page via HTTP to see the returned\
    \ values from anonymous functions\n\n![image](images/pg75_1.jpg)\n\n![image](images/forget.jpg)\n\
    \nRemember to include the `&` ampersand prefix to create a reference to the variable\
    \ value.\n\n![image](images/hot.jpg)\n\nNotice that the final function call gets\
    \ the `'morning'` string from the parent scope.\n\n# Summary\n\n•Custom functions\
    \ allow PHP scripts to be modularized into sections of code that are easier to\
    \ understand and maintain.\n•Function names must begin with a letter or underscore\
    \ character and are not case-sensitive.\n•A function is defined by stating its\
    \ name after the `function` keyword, then parentheses and braces containing statements.\n\
    •A function accepting arguments is defined by including a comma-separated list\
    \ of parameters within the parentheses.\n•Optionally, a function definition can\
    \ specify the type of data to be passed from the caller before the parameter name.\n\
    •Argument data is normally passed by value but can be passed by reference if the\
    \ parameter name is given an `&` prefix.\n•Default argument values can optionally\
    \ be specified in a function definition by assignment to the parameter name.\n\
    •The `...` splat operator allows multiple arguments to be passed to a parameter\
    \ in order to create an array.\n•Named parameters allow a caller to pass argument\
    \ values to the function in any order.\n"
  trans: "\n# 联合类型\n\n通常最好将参数限制为仅接受一种特定数据类型，但有时您可能希望参数允许调用传递不同数据类型的值。这可以通过在函数定义中指定可接受的数据类型作为“联合类型”来实现。这是在参数名称之前使用此语法的\
    \ PHP 数据类型的以管道分隔的列表：\n\n`function function_name ( type|type|type $arg )`\n\n同样，函数返回值的多个可接受数据类型可以用函数定义中的以管道分隔的列表指定为联合类型：\n\
    \n`function function_name ( type|type $arg ) : type|type`\n\n联合类型支持除 `void` 之外的所有\
    \ PHP 数据类型，但确实支持特殊的 `null` 类型。这意味着函数可以返回特定数据类型的值或 `null`。这是一个相当常见的需求，被称为“可空联合”。它可以指定为以管道分隔的列表或使用简写表示法：\n\
    \n`type|null` or `?type`\n\n![image](img/hot.jpg)\n\n联合类型是 PHP 8 中引入的一个很棒的新特性。\n\
    \n简写版本只能与单个数据类型一起使用，而不能与联合类型一起使用，并且 `null` 类型只能作为联合类型的一部分使用。\n\nPHP 还具有 `mixed`\
    \ 伪类型，允许参数或返回值是除 `void` 之外的任何类型。它等同于如下所示的联合类型：\n\n`string|int|float|bool|null|array|object|callable|resource`\n\
    \n`mixed` 伪类型不能与其他类型一起在联合中使用，因为它已经代表了所有可接受的类型。当未为参数显式指定数据类型时，PHP 假定类型为 `mixed`。当未为函数的返回值显式指定数据类型时，PHP\
    \ 假定类型为 `mixed` 或 `void`。\n\n![image](img/hot.jpg)\n\n`callable` 类型只是一个类型提示。它可以为接受可调用函数的参数指定。\n\
    \n## 示例\n\n![image](img/1o.jpg)通过定义一个函数开始 PHP 脚本，该函数可以接受整数或浮点数作为其参数，并可以返回整数或浮点数\n\
    \n```php\n<?php\nfunction half( int|float $arg ) : int|float\n{\n    // Statements\
    \ to be inserted here.\n}\n```\n\n![image](img/commono.jpg)\n\n`union.php`\n\n\
    ![image](img/2o.jpg)接下来，插入语句调用另一个函数来描述参数，并返回其值的一半\n\n```php\necho desc ( '<dt>Argument'\
    \ , $arg ) ;\nreturn $arg/2 ;\n```\n\n![image](img/3o.jpg)现在，添加另一个函数，该函数将返回描述其接收到的数值参数值的字符串\n\
    \n```php\nfunction desc( string $str, mixed $val ) : string\n{\n    return $str.'\
    \ '.$val.' - '.gettype( $val ) ;\n}\n```\n\n![image](img/4o.jpg)最后，添加语句调用函数，传递整数和浮点值\n\
    \n```php\necho desc( '<dd>Return', half( 100 ) ).'<hr>' ;\necho desc( '<dd>Return',\
    \ half( 33 ) ).'<hr>' ;\necho desc( '<dd>Return', half( 3.142 ) ) ;\n?>\n```\n\
    \n![image](img/5o.jpg)将文档保存到 Web 服务器的 `/htdocs` 目录中，命名为 `union.php`，然后通过 HTTP\
    \ 打开页面以查看整数和浮点参数和返回值\n\n![image](img/pg87_1.jpg)\n\n![image](img/hot.jpg)\n\n\
    联合类型可以在所有可以指定类型的地方使用——用于参数、返回类型，以及面向对象编程中的类属性（参见 第 7 章）。\n\n# 回调\n\n![image](img/pg88_1.jpg)\n\
    \nPHP 允许您创建“匿名”函数，在函数定义中未指定名称。与其他函数一样，如果指定了参数，这些函数可以接受参数，并且在调用时可以可选地返回值。与其他函数定义（它们是代码结构）不同，匿名函数定义是一个表达式。这意味着每个匿名函数定义必须以分号结尾，如下所示：\n\
    \n```php\nfunction ( )\n{\n    statement-to-be-executed ;\n    statement-to-be-executed\
    \ ;\n    return value ;\n} ;\n```\n\n![image](img/snake.jpg)\n\n不要忘记在每个匿名函数定义后添加终止的\
    \ `;` 分号。\n\n单独使用时，匿名函数用处不大，因为没有名称无法调用，但它在其他方面可能很有用：\n\n•Assigned to a variable,\
    \ an anonymous function can be called using the variable name.\n•Passed as a callable\
    \ argument to another function, an anonymous function can be called later as a\
    \ “callback”.\n•Returned from a function, an anonymous function retains access\
    \ to the returning function’s variables in “closure”.\n\n通过将匿名函数分配给变量，您实际上为函数命名，可以像调用任何其他函数一样调用它并传递参数——使用变量名。同样，当您将匿名函数传递给另一个函数时，它可以被回调并像任何其他函数一样传递参数——使用参数名。PHP\
    \ `use` 关键字和 `&` 与号前缀允许匿名函数引用返回函数中的局部变量。\n\n## 示例\n\n![image](img/1o.jpg)通过将接受单个参数的匿名函数分配给变量开始\
    \ PHP 脚本\n\n```php\n<?php\n$hello \\= function ( $user ) { echo “Hello $user!<br>”\
    \ ; } ;\n```\n\n![image](img/commono.jpg)\n\n`callback.php`\n\n![image](img/2o.jpg)接下来，添加一条语句调用匿名函数并传递单个参数\n\
    \n```php\n$hello( ‘Mike’ ) ;\n```\n\n![image](img/3o.jpg)现在，定义一个接受单个可调用参数的常规函数并调用该函数传递字符串\n\
    \n```php\nfunction greet( callable $anon )\n{\n    $anon( ‘Carole Anne’ ) ;\n\
