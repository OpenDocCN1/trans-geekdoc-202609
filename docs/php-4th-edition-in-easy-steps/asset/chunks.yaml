    Where a web page contains PHP script, the web server will first call upon the
    PHP engine to process the code before sending the response to the web browser:


    ![image](images/pg9_1.jpg)


    ![image](images/hot.jpg)


    HTTP (HyperText Transfer Protocol) is the common communication standard that allows
    any computer connected to any web server to access files across the web.


    The ensuing pages describe how to create a development environment for interactive
    websites by installing the following server-side technologies on your own computer:


    • `Web Server` – Abyss Web Server X1


    • `PHP Engine` – PHP 8 (8.0.1)


