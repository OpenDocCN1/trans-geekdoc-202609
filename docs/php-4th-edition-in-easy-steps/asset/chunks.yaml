    # PHP Session Example


    ## Form


    ```html

    Name : <input type="text" name="user" >

    Password : <input type="password" name="pass" >

    <p>For Password : Enter Only A-Z a-z 0-9 . _ (Minimum 8 Characters)</p> <input
    type="submit" value="Log In">

    </fieldset>

    </form>

    ```


    ![image](images/pg160_2.jpg)


    `session_form.html`


    ![image](images/2g.jpg)

    Save the document in your web server’s `/htdocs` directory as `session_form.html`
    then open the page via HTTP to see the form


    ![image](images/pg166_2.jpg)


    ![image](images/snake.jpg)


    Session variables will only be accessible to a PHP script if the `session_start()`
    function has been called at the top of the page.


    ## Setting sessions


    Upon receiving a form submission, a PHP script can check for the presence of fields
    and might perform validation of their associated values. For example, the `ctype_alpha()`
    function could be used to confirm they contain only letters, and the `preg_match()`
    function could be used to confirm a value matches a specified pattern. Once validated,
    the submitted fields’ names and values can be assigned to elements of the `$_SESSION`
    global array variable. On successful completion, the script can relocate the browser
    to the next page using the `header()` function to specify that page’s URL:


    ![image](images/1g.jpg)

    Add an initial PHP script to make sessions available


    ```php

    <?php session_start(); ?>

    ```


    ![image](images/commong.jpg)


    `session_set.php`


    ![image](images/2g.jpg)

    Begin a PHP script to handle failed validation attempts


    ```php

    <?php

    function reject( $entry )

    {

    echo "Invalid $entry <br>" ;

    echo ''Please <a href="session_form.html">Log In</a>'' ;

    exit() ;

    }

    ```


    ![image](images/3g.jpg)

    Add a conditional test block to set two cookies for valid data, or call the function
    to handle failed attempts


    ```php

    if( isset( $_POST[''user''] ) )

    {

    $user = trim( $_POST[''user''] ) ;

    if( !ctype_alpha( $user ) ) { reject( ''User Name'' ) ; }

    if( isset( $_POST[''pass''] ) )

    {

    $pass = trim( $_POST[''pass''] ) ;

    if( !preg_match( ''/^[A-Za-z0-9._]{8,}$/'' , $pass ) )

    { reject( ''Password'' ) ; }

    else

    {

    $_SESSION[''user''] = $user ;

    $_SESSION[''pass''] = $pass ;

    header( ''Location: session_get.php'' ) ;

    }

    }

    } else { header( ''Location: session_form.html'' ) ; }

    ?>

    ```


    ![image](images/4g.jpg)

    Save the document in your web server’s `/htdocs` directory as `session_set.php`
    then see [here pages 168-169](#chapter10.xhtml#sec86) for how to retrieve data


    ![image](images/forget.jpg)


    The `ctype_alpha()` function returns true only if its argument contains letters.


    ![image](images/hot.jpg)


    The `preg_match()` function accepts a regular expression and a string argument.
    Regular expressions are beyond the remit of this book but you can precisely copy
    this example to allow the permissible password pattern described on the form.
    The password is left unencrypted in this example, to demonstrate later that the
    user password meets the specified requirements.


    ## Getting sessions


    ![image](images/pg168_1.jpg)


    Session data is accessible from the special `$_SESSION` global array variable
    after a call is made to the `session_start()` function. The PHP `isset()` function
    can seek an element of a specified name. When this confirms the element is present,
    its value can usefully be assigned to a regular script variable. This might be
    used to retrieve a stored username for output on a page. Where a sought element
    is absent, the script can offer an alternative to the user:


    ![image](images/1g.jpg)

    Add an initial PHP script to make sessions available


    ```php

    <?php session_start() ; ?>

    ```


    ![image](images/commong.jpg)


    `session_get.php`


    ![image](images/2g.jpg)

    Now, begin a PHP script to find a session variable and retrieve data for output
    upon success, or provide an alternative for when the session variable is absent


    ```php

    <?php

    if( isset( $_SESSION[''user''] ) )

    {

    $user = $_SESSION[''user''] ;

    echo "<h1>Welcome $user !</h1><hr>" ;

    echo ''<a href="session_data.php">View Session</a>'' ;

    }

    else

    { echo ''Please <a href="session_form.html">Log In</a>'' ; }

    ?>

    ```


    ![image](images/3g.jpg)

    Save the document in your web server’s `/htdocs` directory as `session_get.php`


    ![image](images/4g.jpg)

    Now, open the HTML form `session_form.html` (created [here on page 166](#chapter10.xhtml#sec84))
    via HTTP and push the submit button to see the login attempt fail validation


    ![image](images/pg168_2.jpg)


    ![image](images/5g.jpg)

    Return to the HTML form and submit a valid username, to see the login attempt
    fail validation again


    ![image](images/pg169_1.jpg)


    ![image](images/6g.jpg)

    Return to the HTML form once more and enter a valid username and password to see
    validation succeed


    ![image](images/pg169_2.jpg)


    ![image](images/7g.jpg)

    See overleaf how to view data stored in session variables, using the `session_data.php`
    target of the link seen above


    ![image](images/forget.jpg)


    You can also return to the HTML form and enter a password below the minimum length
    or containing invalid characters to see validation fail again.


    ![image](images/hot.jpg)


    Notice that the user in this example has added leading spaces before their name,
    but that’s okay – these will be removed by the `trim()` function used in the `session_set.php`
    script.


    ## Viewing session data


    The special PHP `$_SESSION` global array variable stores names and values in an
    associative array of keys and values. Stored content can be viewed by looping
    through the array to see all names and values, or by using the PHP `var_dump()`
    function. Additionally, each session has a unique session ID number, which can
    be seen using the PHP `session_id()` function.


    ![image](images/pg170_1.jpg)


    Set session variables can be removed by specifying their element name to the PHP
    `unset()` function, and a session can be completely terminated by calling the
    `session_destroy()` function:


    ![image](images/1g.jpg)

    Add an initial PHP script to make sessions available


    ```php

    <?php session_start(); ?>

    ```


    ![image](images/commong.jpg)


    `session_data.php`


    ![image](images/2g.jpg)

    Now, begin a PHP script to remove session variables, terminate a session, and
    confirm termination


    ```php

    <?php

    function kill_session()

    {

    unset( $_SESSION[''user''] ) ;

    unset( $_SESSION[''pass''] ) ;

    session_destroy() ;

    echo ''<hr>Session Destroyed<br>'' ;

    echo ''Session ID : ''.session_id().''<br>'' ;

    var_dump( $_SESSION ) ;

    }

    ```


    ![image](images/3g.jpg)

    Now, add a test to find if any session variables are set and retrieve all stored
    names and values


    ```php

    if( count( $_SESSION ) > 0 )

    {

    echo ''<dl> '' ;

    foreach( $_SESSION as $key => $value )

    {

    echo "<dt>Key: $key" ; echo "<dd>Value: $value" ;

    }

    echo ''</dl><hr>'' ;

    // Statements to be inserted here (Step 4).

    }

    ```


    ![image](images/4g.jpg)

    Insert statements to display the session ID and array, then call the function
    to terminate the session


    ```php

    echo ''Session ID : ''.session_id().''<br>'' ;

    var_dump( $_SESSION ) ;

    kill_session() ;

    ```


    ![image](images/forget.jpg)


    The uniqueness of each session allows variables to exist without conflict.


    ![image](images/hot.jpg)


    You can assign a new value to a session variable at any time to overwrite an existing
    stored value.


    ![image](images/5g.jpg)

    Add alternative output for when a session is absent


    ```php

    else

    { echo ''Please <a href="session_form.html">Log In</a>'' ; }

    ?>

    ```


    ![image](images/6g.jpg)

    Save the document in your web server’s `/htdocs` directory as `session_data.php`


    ![image](images/7g.jpg)

    Now, open the HTML form `session_form.html` ([here page 166](#chapter10.xhtml#sec84))
    via HTTP and enter valid login data, then follow the link on `session_get.php`
    ([here page 168](#chapter10.xhtml#sec86)) to see session data


    ![image](images/pg171_1.jpg)


