    ![image](img/5p.jpg)

    将文档保存在你的 Web 服务器的 `/htdocs` 目录中，命名为 `nodes-loop.php`，与 `catalog.xml` 文件并列，然后通过
    HTTP 打开页面以查看所有节点内容


    ![image](img/pg177_1.jpg)


    ![image](img/hot.jpg)


    ## 嵌套 foreach 循环

    嵌套 `foreach` 循环可用于遍历每个后代世代的子节点。


    ## 获取属性

    ![image](img/pg178_1.jpg)


    `SimpleXMLElement` 对象属性中包含的值可以通过在节点名称后、方括号之间用引号给出属性名称来引用。例如，`$object->child[''feature'']`
    访问顶级 “child” 元素的名为 “feature” 的属性中的值：


    ![image](img/1p.jpg)

    使用设置页面标题的语句开始一个 PHP 脚本


    ```

    <?php

    echo ‘<title>PHP SimpleXML</title>’ ;

    ```


    ![image](img/commonp.jpg)


    `attribs.php`


    ![image](img/2p.jpg)

    添加一条语句来加载 XML 数据或退出


    ```

    $xml = simplexml_load_file( ‘catalog.xml’ )

    or die( ‘Unable to load data!’ ) ;

    ```


    ![image](img/3p.jpg)

    接下来，检索第一个 “book” 元素的子元素 “title” 的内容


    ```

    echo ‘First book : ‘.

    $xml->book[0]->title.’ in easy steps<br>’ ;

    ```


    ![image](img/4p.jpg)

    现在，显示第一个 “book” 元素的子元素 “title” 的 “cover” 属性的值


    ```

    echo ‘Cover : ‘.$xml->book[0]->title[‘cover’].’<br>’ ;

    ```


    ![image](img/5p.jpg)

    使用上一步检索到的值来显示第一个 “book” 元素的封面图像


    ```

    echo ‘<img src=”’.$xml->book[0]->title[‘cover’].’”>’ ;

    ```


    ![image](img/6p.jpg)

    将文档保存在你的 Web 服务器的 `/htdocs` 目录中，命名为 `nodes.php`，与 `catalog.xml` 文件并列，然后通过 HTTP
    打开页面以查看属性值和图像


    ![image](img/pg178_2.jpg)


    ![image](img/pg178_3.jpg)


    ![image](img/forget.jpg)


    请注意，此处的每个属性值都是 `/htdocs/images` 目录中图像的路径和文件名。


    c.jpg


    ## 遍历属性

    `SimpleXML` 对象的 `children()` 方法再次可用于遍历节点，并在每次迭代时检索特定节点指定属性中的值：


    ![image](img/1p.jpg)

    使用设置页面标题的语句开始一个 PHP 脚本


    ```

    <?php

    echo ‘<title>PHP SimpleXML</title>’ ;

    ```


    ![image](img/commonp.jpg)


    `attribs-loop.php`


    ![image](img/2p.jpg)

    添加一条语句来加载 XML 数据或退出


    ```

    $xml = simplexml_load_file( ‘catalog.xml’ )

    or die( ‘Unable to load data!’ ) ;

    ```


    ![image](img/3p.jpg)

    接下来，将迭代计数器初始化为零


    ```

    $counter = 0 ;

    ```


    ![image](img/4p.jpg)

    现在，添加一个循环来递增计数器并显示其值，然后在每次迭代时检索属性值以显示图像


    ```

    foreach( $xml->children() as $book )

    {

    $counter++ ;

    echo ‘ ‘.$counter.’: ‘ ;

    echo ‘<img src=”’.$book->title[‘cover’].’”>’ ;

    }

    ```


    ![image](img/5p.jpg)

    将文档保存在你的 Web 服务器的 `/htdocs` 目录中，命名为 `attribs-loop.php`，与 `catalog.xml` 文件并列，然后通过
    HTTP 打开页面以在循环的每次迭代中查看计数器和图像的显示


    ![image](img/pg179_1.jpg)


    ![image](img/pg179_2.jpg)


    c.jpg

    go.jpg

    java.jpg

    php.jpg

    python.jpg


    ![image](img/hot.jpg)


    `SimpleXMLElement` 对象还提供了一个 `attributes()` 方法，该方法返回元素内所有属性名称和值的关联数组——例如，`$obj->child->attributes()`。


    ## 包含订阅源

    通过在 PHP 脚本中访问 XML 文档中的数据（正如前几页所述），我们可以轻松地整合来自外部源的数据。


    ![image](img/pg180_1.jpg)


    你可以在 [rssboard.org](http://www.rssboard.org) 在线了解更多关于 RSS 订阅源的信息


    许多 Web 服务以免费提供的 RSS（Rich Site Summary/Really Simple Syndication）订阅源形式提供。对 “rss
    feed directory” 进行在线搜索将提供多个网站，在这些网站上免费订阅源的链接被分类。RSS 订阅源以 XML 格式提供定期更新的数据。


    同样，一些 Web 服务也只是以 XML 或 JSON（JavaScript Object Notation）格式的 “feeds” 提供。


    FloatRates 网站提供大量有关货币汇率的免费订阅源，网址为 [www.floatrates.com/feeds.html](http://www.floatrates.com/feeds.html)
    这些订阅源以 XML（和 JSON）格式提供每日更新的汇率。例如，美元（USD）订阅源是位于 [`www.floatrates.com/daily/usd.xml`](http://www.floatrates.com/daily/usd.xml)
    的 XML 文档


    XML 订阅源通常是包含一个 `<channel>` 元素的文档，其中包含 `<item>` 元素，而这些元素又包含包含数据的嵌套内部元素：


    ![image](img/pg180_2.jpg)


    ![image](img/hot.jpg)


    你可以搜索免费的 RSS/XML 新闻订阅源，以便使用 PHP 提取定期更新的新闻条目。


    ![image](img/pg180_3.jpg)


    这里突出显示的标签可用于检索最感兴趣的数据。显示为折叠的每个 item 标签还包含 pubDate 和 inverseDescription，用来描述每个项目的元素。


    ![image](img/1p.jpg)

    使用加载来自外部订阅源的 XML 数据的语句开始一个 PHP 脚本，或退出


    ```

    <?php

    $url = ‘http://www.floatrates.com/daily/usd.xml’ ;

    $xml =

    simplexml_load_file( $url ) or die( ‘Unable to load data!’ ) ;

    ```


    ![image](img/commonp.jpg)


    `feed.php`


    ![image](img/2p.jpg)

    接下来，添加一条语句来加载页面头文件


    ```

    include( ‘includes/feed-header.html’ ) ;

    ```


    ![image](img/pg181_1.jpg)


    `feed-header.html`


    ![image](img/3p.jpg)

    现在，添加一条语句来显示发布日期


    ```

    echo ‘<p>’.$xml->pubDate.’</p>’ ;

    ```


    ![image](img/4p.jpg)

    然后，显示前五个汇率


    ```

    $i=1 ;

    foreach ( $xml->item as $item )

    {

    echo ‘<li>’.$item->inverseDescription ;

    $i++ ;

    if ($i > 5) break ;

    }

    ```


    ![image](img/5p.jpg)

    最后，添加一条语句来加载页面页脚文件


    ```

    include( ‘includes/feed-footer.html’ ) ;

    ```


    ![image](img/pg181_1.jpg)


    `feed-footer.html`


    ![image](img/6p.jpg)

    将文档保存在你的 Web 服务器的 `/htdocs` 目录中，命名为 `rss.php`，然后通过 HTTP 打开页面以查看汇率


    ![image](img/pg181_2.jpg)


    ![image](img/pg181_3.jpg)


    xml.png


    ## 设置参数

    一些 Web 服务提供静态 URL，如前例中的 FloatRates 订阅源，只需提供由内容提供商预先确定的 XML 数据。其他 Web 服务提供更灵活的
    API（应用程序编程接口），允许你在 URL 请求中指定参数，以确定将接收到的数据以及格式。


    ![image](img/pg182_1.jpg)


    在 [openweathermap.org](http://www.openweathermap.org) 了解更多关于 OpenWeatherMap 的信息并注册以获取你自己的
    ID 密钥。


    OpenWeatherMap 拥有一个免费的当前天气数据 API，可在 [`api.openweathermap.org/data/2.5/forecast`](http://api.openweathermap.org/data/2.5/forecast)
    找到 当前天气数据 API 允许你以多种形式请求天气数据。该 API 提供的参数包括：


    - `q` = 城市名称（或城市名称、国家代码）。

    - `units` = 公制（摄氏度）、英制（华氏度）或标准（开尔文，默认）温度刻度。

    - `mode` = xml、html 或 json（默认）格式。

    - `appid` = 必需的授权密钥，在 OpenWeatherMap 注册时免费提供。


    参数和必需的 `=` 值附加在 OpenWeatherMap URL 后的 `?` 之后，并用 `&` 分隔。

