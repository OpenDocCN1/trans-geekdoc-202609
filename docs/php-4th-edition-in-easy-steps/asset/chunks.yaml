- raw: "The response from OpenWeatherMap can be delivered as an XML file that may\
    \ be written into the web server’s **/htdocs** folder using the PHP **asXml()**\
    \ function to specify a filename. This can be examined in the web browser to discover\
    \ the nature of the data retrieved, the XML element names, attribute names and\
    \ structure:\n\n![image](images/1p.jpg)Begin a PHP script by assigning string\
    \ values to four variables, which will be used to set response parameters\n\n\
    **<?php**\n\n**$city \\= ‘New York’ ;**\n\n**$units \\= ‘imperial’ ;**\n\n**$mode\
    \ \\= ‘xml’ ;**\n\n**$id \\= ‘28df3c64f387cf55026e0de3fb8beaa4’ ;**\n\n![image](images/commonp.jpg)\n\
    \nparam.php\n\n![image](images/2p.jpg)Next, add a statement to build a request\
    \ string using specified parameter values\n\n**$request \\=**\n\n**‘http://api.openweathermap.org/data/2.5/forecast?’.**\n\
    \n**‘q=’.$city.’&units=’.$units.’&mode=’.$mode.’&APPID=’.$id ;**\n\n![image](images/3p.jpg)Now,\
    \ add a statement to load XML data using the request string parameters, or quit\n\
    \n**$xml \\= simplexml\\_load\\_file( $request )**\n\n**or die( ‘Unable to load\
    \ data!’ ) ;**\n\n![image](images/4p.jpg)When a response is received, attempt\
    \ to write the content as an XML file in the web server’s **/htdocs** directory\n\
    \n**try**\n\n**{**\n\n**$xml\\->asXml( ‘params.xml’ ) ;**\n\n**// Statement to\
    \ be inserted here (Step 5).**\n\n**}**\n\n**catch( Exception $e )**\n\n**{**\n\
    \n**echo ‘Error : ‘.$e\\->getMessage() ;**\n\n**}**\n\n![image](images/pg174_2.jpg)\n\
    \nparams.xml\n\n![image](images/5p.jpg)Insert a statement to relocate the browser\
    \ to view the newly created XML document\n\n**header( ‘Location: params.xml’ )\
    \ ;**\n\n![image](images/6p.jpg)Save the PHP script in your web server’s **/htdocs**\
    \ directory as **params.php** then open the page via HTTP to examine the XML content\
