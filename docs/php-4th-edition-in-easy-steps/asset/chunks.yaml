    ![image](img/hot.jpg)


    PHP 还有一个 `XOR`（exclusive `OR`）运算符，它执行 `AND NOT` 的等效求值。


    ![image](img/forget.jpg)


    请注意，`FALSE && FALSE` 的求值返回 `FALSE`——也许说明了“两错不等于一对”的轶事。


