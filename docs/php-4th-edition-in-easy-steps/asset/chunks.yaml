    **Initializing members**


    ![image](images/pg110_1.jpg)


    A program can easily create multiple objects simply by declaring multiple instances
    of a class, and each object can have unique attributes by assigning individual
    values with its setter methods.


    It is often convenient to combine the setter methods into a single method that
    accepts arguments for each private variable. This means that all values can be
    assigned with a single statement in the program, but the method will contain multiple
    statements.


    Optionally, each parameter can specify a permissible data type for each argument
    being passed, and may also usefully specify default values to each parameter:


