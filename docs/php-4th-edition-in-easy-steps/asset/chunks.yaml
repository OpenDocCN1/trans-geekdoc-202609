    ![image](images/5p.jpg)

    Save the document in your web server’s `/htdocs` directory as `nodes-loop.php`,
    alongside the `catalog.xml` file, then open the page via HTTP to see all node
    content


    ![image](images/pg177_1.jpg)


    ![image](images/hot.jpg)


    ## Nested foreach loops

    Nested `foreach` loops can be used to traverse child nodes of each descendant
    generation.


    ## Getting attributes

    ![image](images/pg178_1.jpg)


    Values contained within attributes of a `SimpleXMLElement` object can be referenced
    by stating the attribute name, within quotes, between brackets following the node
    name. For example, `$object->child[''feature'']` accesses the value within an
    attribute named “feature” of a top-level “child” element:


    ![image](images/1p.jpg)

    Begin a PHP script with a statement to set a page title


    ```

    <?php

    echo ‘<title>PHP SimpleXML</title>’ ;

    ```


    ![image](images/commonp.jpg)


    `attribs.php`


    ![image](images/2p.jpg)

    Add a statement to load the XML data or quit


    ```

    $xml = simplexml_load_file( ‘catalog.xml’ )

    or die( ‘Unable to load data!’ ) ;

    ```


    ![image](images/3p.jpg)

    Next, retrieve the content of the “title” element that is a child of the first
    “book” element


    ```

    echo ‘First book : ‘.

    $xml->book[0]->title.’ in easy steps<br>’ ;

    ```


    ![image](images/4p.jpg)

    Now, display the value of the “cover” attribute of the “title” element that is
    a child of the first “book” element


    ```

    echo ‘Cover : ‘.$xml->book[0]->title[‘cover’].’<br>’ ;

    ```


    ![image](images/5p.jpg)

    Use the value retrieved in the previous step to display a cover image for the
    first “book” element


    ```

    echo ‘<img src=”’.$xml->book[0]->title[‘cover’].’”>’ ;

    ```


    ![image](images/6p.jpg)

    Save the document in your web server’s `/htdocs` directory as `nodes.php`, alongside
    the `catalog.xml` file, then open the page via HTTP to see the attribute value
    and image


    ![image](images/pg178_2.jpg)


    ![image](images/pg178_3.jpg)


    ![image](images/forget.jpg)


    Notice that each attribute value here is the path and filename to an image in
    a directory at `/htdocs/images`.


    c.jpg


    ## Looping through attributes

    The `SimpleXML` object `children()` method can once again be used to loop through
    nodes and retrieve the value in a specified attribute of a particular node on
    each iteration:


    ![image](images/1p.jpg)

    Begin a PHP script with a statement to set a page title


    ```

    <?php

    echo ‘<title>PHP SimpleXML</title>’ ;

    ```


    ![image](images/commonp.jpg)


    `attribs-loop.php`


    ![image](images/2p.jpg)

    Add a statement to load the XML data or quit


    ```

    $xml = simplexml_load_file( ‘catalog.xml’ )

    or die( ‘Unable to load data!’ ) ;

    ```


    ![image](images/3p.jpg)

    Next, initialize an iteration counter at zero


    ```

    $counter = 0 ;

    ```


    ![image](images/4p.jpg)

    Now, add a loop to increment the counter and to display its value, then retrieve
    an attribute value on each iteration to display an image


    ```

    foreach( $xml->children() as $book )

    {

    $counter++ ;

    echo ‘ ‘.$counter.’: ‘ ;

    echo ‘<img src=”’.$book->title[‘cover’].’”>’ ;

    }

    ```


    ![image](images/5p.jpg)

    Save the document in your web server’s `/htdocs` directory as `attribs-loop.php`,
    alongside the `catalog.xml` file, then open the page via HTTP to see the counter
    and image displayed on each iteration of the loop


    ![image](images/pg179_1.jpg)


    ![image](images/pg179_2.jpg)


    c.jpg

    go.jpg

    java.jpg

    php.jpg

    python.jpg


    ![image](images/hot.jpg)


    A `SimpleXMLElement` object also provides an `attributes()` method that returns
    an associative array of all attribute names and values within an element – for
    example, `$obj->child->attributes()`.


    ## Including feeds

    With the ability to access data from XML documents within PHP scripts, as described
    on the previous pages, we can easily incorporate data from external sources.


    ![image](images/pg180_1.jpg)


    You can discover more about RSS feeds online at [rssboard.org](http://www.rssboard.org)


    Many Web Services are offered as freely available RSS (Rich Site Summary/Really
    Simple Syndication) feeds. An online search for “rss feed directory” will provide
    a number of websites where links to free feeds are categorized. RSS feeds deliver
    regularly updated data in XML format.


    Similarly, some Web Services are otherwise simply offered as “feeds” in XML or
    JSON (JavaScript Object Notation) format.


    The FloatRates website offers lots of free feeds with currency exchange information
    at [www.floatrates.com/feeds.html](http://www.floatrates.com/feeds.html) These
    provide exchange rates in XML (and JSON) format that are updated each day. For
    example, the US dollar (USD) feed is an XML document at [http://www.floatrates.com/daily/usd.xml](http://www.floatrates.com/daily/usd.xml)


    XML feeds are typically documents containing a `<channel>` element, enclosing
    `<item>` elements that, in turn, enclose nested inner elements containing data:


    ![image](images/pg180_2.jpg)


    ![image](images/hot.jpg)


    You can search for free RSS/XML news feeds to extract regularly updated news items
    with PHP.


    ![image](images/pg180_3.jpg)


    The tags highlighted here can be used to retrieve the data of most interest. The
    item tags shown collapsed each also contain pubDate and inverseDescription, elements
    describing each item.


    ![image](images/1p.jpg)

    Begin a PHP script with a statement to load XML data from an external feed, or
    quit


    ```

    <?php

    $url = ‘http://www.floatrates.com/daily/usd.xml’ ;

    $xml =

    simplexml_load_file( $url ) or die( ‘Unable to load data!’ ) ;

    ```


    ![image](images/commonp.jpg)


    `feed.php`


    ![image](images/2p.jpg)

    Next, add a statement to load a page header file


    ```

    include( ‘includes/feed-header.html’ ) ;

    ```


    ![image](images/pg181_1.jpg)


    `feed-header.html`


    ![image](images/3p.jpg)

    Now, add a statement to display the publication date


    ```

    echo ‘<p>’.$xml->pubDate.’</p>’ ;

    ```


    ![image](images/4p.jpg)

    Then, display the first five exchange rates


    ```

    $i=1 ;

    foreach ( $xml->item as $item )

    {

    echo ‘<li>’.$item->inverseDescription ;

    $i++ ;

    if ($i > 5) break ;

    }

    ```


    ![image](images/5p.jpg)

    Finally, add a statement to load a page footer file


    ```

    include( ‘includes/feed-footer.html’ ) ;

    ```


    ![image](images/pg181_1.jpg)


    `feed-footer.html`


    ![image](images/6p.jpg)

    Save the document in your web server’s `/htdocs` directory as `rss.php` then open
    the page via HTTP to see the rates


    ![image](images/pg181_2.jpg)


    ![image](images/pg181_3.jpg)


    xml.png


    ## Setting parameters

    Some Web Services provide a static URL, like the FloatRates feed in the previous
    example, that simply delivers XML data pre-determined by the content supplier.
    Other Web Services provide a more flexible API (Application Programming Interface)
    that allows you to specify parameters in the URL request to determine what data
    you will receive, and in which format.


    ![image](images/pg182_1.jpg)


    Discover more about OpenWeatherMap at [openweathermap.org](http://www.openweathermap.org)
    and sign up to receive your own ID key.


    OpenWeatherMap has a free Current Weather Data API that can be found at [http://api.openweathermap.org/data/2.5/forecast](http://api.openweathermap.org/data/2.5/forecast)
    The Current Weather Data API allows you to request weather data in many forms.
    The parameters provided by this API include:


    - `q` = city name (or city name, country code).

    - `units` = metric (Celsius), imperial (Fahrenheit), or standard (Kelvin, the
    default) temperature scale.

    - `mode` = xml, html, or json (the default) format.

    - `appid` = required authorization key, supplied free upon registration at OpenWeatherMap.


    The parameters and required `=` values are appended to the OpenWeatherMap URL
    after a `?` and are separated by `&`.

