    摘要


    ### 比较字符


    ![image](img/pg92_1.jpg)


    PHP 提供了许多内置函数来比较两个文本字符串。简单的 `strcmp()` 函数接受两个字符串参数进行比较，并根据结果返回三个整数值之一。当字符串完全匹配时，`strcmp()`
    将返回零。当第一个字符串参数大于第二个时，`strcmp()` 将返回 1，但当第一个字符串参数小于第二个时，`strcmp()` 将返回 -1。


    `strncmp()` 函数的工作方式类似，但接受第三个整数参数来指定要比较的字符串开头的字符数。


    `strcmp()` 和 `strncmp()` 函数在比较字符串时会区分大小写和大小写。当您希望忽略大小写时，可以改用替代的伴随函数 `strcasecmp()`
    和 `strncasecmp()`。


    ![image](img/snake.jpg)


    严格来说，`strcmp()` 的返回值将是正整数、零或负整数——但通常是 1、0 或 -1 的值。


    为了理解每个比较函数的返回结果，了解比较是如何实际进行的很有用。每个字符都有一个标准数值“ASCII”值，其中小写 a-z 的范围为 97-122，大写 A-Z
    的范围为 65-90。比较每个范围的第一个值，我们看到 “a” (97) 大于 “A” (65)。将这些作为参数提供，`strcmp()` 函数因此将返回
    1，因为第一个参数大于第二个参数。相反，如果您指定 “A” (65) 作为第一个参数，“a” (97) 作为第二个参数，则 `strcmp()` 函数将返回
    -1，因为第一个参数小于第二个参数。在字符串比较中，每个字符按顺序进行比较，以确保包含不同顺序的相同字符的字符串不会被错误地视为相等。例如，比较 “ABC”
    和 “BAC”，第一个字符 “A” (65) 小于第一个字符 “B” (66)，因此 `strcmp()` 函数将返回 -1，因为第一个参数小于第二个参数。


    ![image](img/hot.jpg)


    ASCII 是 American Standard Code for Information Exchange（信息交换美国标准代码）的缩写，它指定了通用标准字符编码方案。


    任何字符的 ASCII 值都可以通过将其作为参数指定给 PHP `ord()` 函数来找到，字符串的长度可以通过将其作为参数指定给 PHP `strlen()`
    函数来找到。


    ![image](img/1bl.jpg)使用语句初始化四个字符串值的变量开始一个 PHP 脚本


    ```

    <?php

    $str1 \= ‘PHP in easy steps’ ;

    $str2 \= ‘PHP in easy steps’ ;

    $str3 \= ‘PHP In Easy Steps’ ;

    $str4 \= ‘php in easy steps’ ;

    ```


    ![image](img/commonbl.jpg)


    characters.php


    ![image](img/2bl.jpg)接下来，添加语句来比较字符串


    ```

    echo “’$str1’ versus ‘$str2’ : “.strcmp($str1, $str2).’<br>’ ;

    echo “’$str1’ versus ‘$str3’ : “.strcmp($str1, $str3).’<br>’ ;

    echo “’$str1’ versus ‘$str4’ : “.strcmp($str1, $str4).’<hr>’ ;

    ```


    ![image](img/3bl.jpg)现在，添加一个不区分大小写的比较语句


    ```

    echo ‘Comparison Ignoring Case :<br>’ ;

    echo “’$str1’ versus ‘$str4’ : “.strcasecmp($str1, $str4) ;

    ```


    ![image](img/4bl.jpg)最后，添加一个循环来计算并显示第一个字符串的总 ASCII 代码值


    ```

    $total \= 0 ;

    for ( $i \= 0 ; $i < strlen( $str1 ) ; $i++ )

    {

    $total += ord( $str1\[ $i \] ) ;

    }

    echo “<hr>ASCII Total ‘$str1’ : $total” ;

    ?>

    ```


    ![image](img/5bl.jpg)将文档保存在 Web 服务器的 `/htdocs` 目录中，命名为 `characters.php`，然后通过 HTTP
    打开页面以查看字符串比较


    ![image](img/pg93_1.jpg)


    ![image](img/forget.jpg)


    字符顺序很重要，因为两个顺序不同的字符串的 ASCII 总和可能相等，但字符串不匹配。


    ### 搜索文本


    ![image](img/pg94_1.jpg)


    PHP 提供了许多内置函数来搜索字符串以查找指定的子字符串或单个字符。简单的 `strpos()` 函数接受两个参数来指定要搜索的字符串和要查找的子字符串。它将从字符串开头按顺序搜索以找到匹配项。当找到匹配项时，搜索停止，`strpos()`
    函数返回一个整数，即字符串中第一次出现匹配项开始的字符索引位置。当未找到匹配项时，`strpos()` 函数返回 FALSE。


    `strrpos()` 函数的工作方式类似，但返回从字符串末尾按相反顺序搜索时第一次出现匹配项开始的索引位置。


    其他 PHP 搜索函数可以返回搜索字符串的一部分，而不是指示匹配位置的索引号。


    `strstr()` 函数接受两个参数来指定要搜索的字符串和要查找的子字符串。它将从字符串开头搜索以找到匹配项。当找到匹配项时，搜索停止，`strstr()`
    函数返回从第一次出现匹配项开始的搜索字符串的剩余部分。当未找到匹配项时，`strstr()` 函数返回 NULL。


    ![image](img/snake.jpg)


    请注意，没有 `strrstr()`（`strstr()` 的伴随函数）来按相反顺序搜索。


    同样，在字符大小写不重要时，您可以使用伴随的 `stristr()` 函数进行不区分大小写的搜索。这将返回从第一次出现不区分大小写的匹配项开始的搜索字符串的剩余部分。


    `strchr()` 函数的工作方式类似，但接受两个参数来指定要搜索的字符串和要查找的单个字符。伴随的 `strrchr()` 函数从字符串末尾开始按相反顺序搜索。两者都返回从第一次出现匹配项开始的搜索字符串的剩余部分。


    您还可以通过将要搜索的字符串和要查找的子字符串指定为 `str_contains()`、`str_starts_with()` 和 `str_ends_with()`
    函数的参数来查找匹配项。这些函数根据搜索结果各返回一个布尔 TRUE 或 FALSE 值。返回值可以分配一个合适的字符串来描述结果。


    ![image](img/1bl.jpg)使用语句初始化一个字符串值的变量开始一个 PHP 脚本，然后报告其长度


    ```

    <?php

    $str \= ‘Most Users usually find PHP useful.’ ;

    echo “’$str’<br>String Length : “.strlen( $str ) ;

    ```

