    ![image](images/forget.jpg)


    Some countries prefer date order of M/D/Y while others prefer D/M/Y so you can
    choose your preferred date format options.


    **Encoding entities**


    ![image](images/pg102_1.jpg)


    There are two PHP functions available to encode HTML code, so that all characters
    of special significance or unusual characters are replaced by “entity” equivalents.
    The **htmlentities()** function encodes all characters below, which each have
    an entity equivalent:


    ![image](images/pg102_2.jpg)


    Unless you are concerned about non-English language characters, it is generally
    preferable to use the alternative **htmlspecialchars()** function to encode only
    characters of special HTML significance:


    •**&** ampersand – becomes **&amp;**


    •**“** double quote – becomes **&quot;**


    •**‘** single quote – becomes **&#039;**


    •**<** less than – becomes **&lt;**


    •**\>** greater than – becomes **&gt;**


    ![image](images/hot.jpg)


    Call the PHP function **get\_html\_translation\_table()** with the constant argument
    of **HTML\_ENTITIES** or **HTML\_SPECIALCHARS** to return an array of all represented
    characters.


    One good reason to encode HTML snippets with PHP is to prevent malicious JavaScript
    code being executed unintentionally by the web browser. Encoding HTML tags into
    entities ensures that the HTML **<script>** tag will not be recognized, so its
    JavaScript code contents will not be executed:


    ![image](images/1bl.jpg)Create a PHP script with statements to initialize a variable
    with an HTML snippet and display its value


    **<?php**


    **$html \= ‘<script>window.location=”index.html”</script>’ ;**


    **// Statement to be inserted here.**


    **echo $html ;**


    **?>**


    ![image](images/commonbl.jpg)


    encode.php


    ![image](images/2bl.jpg)Save the document in your web server’s **/htdocs** directory
    as **encode.php** then open the page via HTTP to hopefully see the HTML code snippet


    ![image](images/pg103_1.jpg)


    The browser has interpreted the code and relocated to the server’s index page
    because it recognized the HTML **<script>** tag.


    ![image](images/3bl.jpg)Return to the PHP script and insert a statement to encode
    special HTML characters


    **$html \= htmlspecialchars( $html ) ;**


    ![image](images/4bl.jpg)Save the edited document and reopen the page via HTTP
    again to see the HTML code snippet


    ![image](images/pg103_2.jpg)


    ![image](images/5bl.jpg)Use the **View Source** facility in your web browser to
    see the special character entity equivalents encoded by PHP


    ![image](images/pg103_3.jpg)


    ![image](images/hot.jpg)


    The PHP function **html\_entity\_decode()** can be used to unencode all entities
    back to their original character state.


    **Summary**


    •The PHP built-in string comparison functions **strcmp()**, **strncmp()**, **strcasecmp()**
    and **strncasecmp()** each typically return a result of 1 (greater), 0 (equal)
    or -1 (less).


    •String comparisons are based on the numerical ASCII value of each character,
    compared in sequence to account for order.


    •The ASCII value of any character can be found using **ord().**


    •The length of any string can be found using **strlen().**


    •The numerical index position of a substring within a searched string can be found
    using **strpos()** and **strrpos()** functions.


    •The search functions **strstr()**, **stristr()**, **strchr()** and **strrchr()**
    each return the remainder of a searched string on success.'
