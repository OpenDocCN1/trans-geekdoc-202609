  \ (CSRF)攻击。\n\n如果你不熟悉 CSRF 的原理，它是一种攻击类型，恶意第三方网站向你的网站发送更改状态的 HTTP 请求。关于基础 CSRF 攻击的绝佳解释可以[在此处找到](http://www.gnucitizen.org/blog/csrf-demystified/)。\n\
