  # 第 4 章\n\n## 数据库驱动的响应\n\n为了让我们的 Snippetbox Web 应用程序变得真正有用，我们需要一个地方来存储（或持久化）用户输入的数据，并能够在运行时动态查询此数据存储库。\n\
  \n我们可以为应用程序使用许多不同的数据存储——每种都有不同的优缺点——但我们将选择流行的关系型数据库 [MySQL](https://www.mysql.com/)。\n\
  \n在本节中，你将学习如何：\n\n* 安装数据库驱动，作为 MySQL 和你的 Go 应用程序之间的“中间人”。\n* 从你的 Web 应用连接到 MySQL\
  \ 具体而言，你将学习如何建立一个可重用的连接池）。\n* 创建一个独立的 `models` 包，使得你的数据库逻辑可复用并与 Web 应用解耦。\n* 使用\
  \ Go 的 `database/sql` 包中适当的函数执行不同类型的 SQL 语句，以及如何避免导致服务器资源耗尽的常见错误。\n* 通过正确使用占位符参数防止\
  \ SQL 注入攻击。\n* 使用事务，以便你能在一个原子操作中执行多个 SQL 语句。\n\n# 第 4.1 节\n\n### 设置 MySQL\n\n如果你正在跟着本教程操作，此时你需要在电脑上安装\
  \ MySQL。MySQL 官方文档包含了适用于所有类型操作系统的全面[安装说明](https://dev.mysql.com/doc/refman/8.0/en/installing.html)，但如果你使用的是\
  \ Mac OS，你应该能够通过以下命令安装：\n\n```bash\n$ brew install mysql\n```\n\n或者，如果你正在使用支持 `apt`\
  \ 的 Linux 发行版（如 Debian 和 Ubuntu），你可以通过以下命令安装：\n\n```bash\n$ sudo apt install mysql-server\n\
  ```\n\n在安装 MySQL 期间，可能会要求你为 `root` 用户设置密码。如果是的话，请记住它；你将在下一步中需要它。\n\n### 构建数据库脚架\n\
  \n一旦安装 MySQL，你就应该能够以 `root` 用户身份从终端连接到它。命令取决于你安装的 MySQL 版本。对于 MySQL 5.7 及更高版本，你应该可以通过输入以下内容进行连接：\n\
  \n```bash\n$ sudo mysql\nmysql>\n```\n\n但如果这不起作用，请尝试下面的命令，并输入你在安装期间设置的密码。\n\n```bash\n\
  $ mysql -u root -p\nEnter password:\nmysql>\n```\n\n连接后，我们需要做的第一件事是在 MySQL 中建立数据库以存储我们项目的所有数据。将以下命令复制并粘贴到\
  \ mysql 提示符中，使用 UTF8 编码创建一个新的 `snippetbox` 数据库。\n\n```sql\n-- 创建一个新的 UTF-8 `snippetbox`\
  \ 数据库。\nCREATE DATABASE snippetbox CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;\n\
  \n-- 切换到 `snippetbox` 数据库。\nUSE snippetbox;\n```\n\n然后复制并粘贴以下 SQL 语句创建一个新的 `snippets`\
  \ 表，用于存放我们应用程序的代码片段：\n\n```sql\n-- 创建一个新的 `snippets` 表。\nCREATE TABLE snippets (\n\
  \    id INTEGER PRIMARY KEY AUTO_INCREMENT,\n    title VARCHAR(100) NOT NULL,\n\
  \    content TEXT NOT NULL,\n    created DATETIME NOT NULL,\n    expires DATETIME\
  \ NOT NULL\n);\n\n-- 在 created 列上添加索引。\nCREATE INDEX idx_created ON snippets(created);\n\
  ```\n\n### 创建新用户\n\n从安全角度来看，在 Web 应用中以 `root` 用户身份连接 MySQL 不是一个好主意。相反，更好的做法是创建一个具有受限权限的数据库用户。\n\
  \n因此，当你仍连接到 MySQL 提示符时，运行以下命令创建一个新的 `web` 用户，该用户仅对数据库拥有 `SELECT` 和 `INSERT` 权限。\n\
  \n```sql\nCREATE USER 'web'@'localhost';\nGRANT SELECT, INSERT, UPDATE, DELETE ON\
  \ snippetbox.* TO 'web'@'localhost';\n-- 重要：请确保将 'pass' 替换为你选择的密码。\nALTER USER 'web'@'localhost'\
  \ IDENTIFIED BY 'pass';\n```\n\n完成后后，输入 `exit` 退出 MySQL 提示符。\n\n### 测试新用户\n\n现在你应该能够使用以下命令以\
  \ `web` 用户身份连接到 `snippetbox` 数据库。在提示输入时，输入你刚刚设置的密码。\n\n```bash\n$ mysql -D snippetbox\
  \ -u web -p\nEnter password:\nmysql>\n```\n\n如果权限工作正常，你应该发现你可以正确地在数据库上执行 `SELECT`\
  \ 和 `INSERT` 操作，但其他命令（如 `DROP TABLE` 和 `GRANT`）将失败。\n\n\n\n\n\n```\nmysql> SELECT\
  \ id, title, expires FROM snippets;\n+----+------------------------+---------------------+\n\
  | id | title                  | expires             |\n+----+------------------------+---------------------+\n\
  |  1 | An old silent pond     | 2023-04-05 07:20:05 |\n|  2 | Over the wintry forest\
  \ | 2023-04-05 07:20:05 |\n|  3 | First autumn morning   | 2022-04-12 07:20:05 |\n\
  +----+------------------------+---------------------+\n3 rows in set (0.00 sec)\n\
  \nmysql> DROP TABLE snippets;\nERROR 1142 (42000): DROP command denied to user 'web'@'localhost'\
  \ for table 'snippets'\n```\n\n# 第 4.2 章\n\n## 安装数据库驱动程序\n\n要在我们的 Go Web 应用程序中使用\
  \ MySQL，我们需要安装数据库驱动程序。它本质上充当了中间人，在 Go 和 MySQL 数据库之间进行命令翻译。\n\n你可以在 Go wiki 上找到[可用驱动程序列表](https://github.com/golang/go/wiki/SQLDrivers)，但对于我们的应用程序，我们将使用流行的\
  \ [`go-sql-driver/mysql`](https://github.com/go-sql-driver/mysql) 驱动。\n\n要下载它，进入你的项目目录并运行\
  \ `go get` 命令，如下：\n\n```\n$ cd $HOME/code/snippetbox\n$ go get github.com/go-sql-driver/mysql@v1\n\
  go: downloading github.com/go-sql-driver/mysql v1.6.0\n```\n\n注意这里，我们在包路径后加上了 `@v1`，表示我们想要下载主版本号为\
  \ 1 的[最新可用版本](https://github.com/go-sql-driver/mysql/releases) 软件包。\n\n在编写本文内容时，该版本是\
  \ `v1.6.0`，但你下载的版本可能是 `v1.6.1`、`v1.7.0` 或类似的版本——这没关系。因为 `go-sql-driver/mysql` 包使用[语义化版本](https://semver.org/)进行发布，因此任何\
  \ `v1.x.x` 版本都应该与书中的其余代码兼容。\n\n顺便提一下，如果你想不分版本号下载最新版本，可以简单地省略 `@version` 后缀，如下：\n\
  \n```\n$ go get github.com/go-sql-driver/mysql\n```\n\n或者，如果你想下载包的特定版本，可以使用完整的版本号。例如：\n\
  \n```\n$ go get github.com/go-sql-driver/mysql@v1.0.3\n```\n\n# 第 4.3 章\n\n## 模块与可复现构建\n\
  \n现在 MySQL 驱动程序已经安装，让我们来看 `go.mod` 文件（我们在书的开始时创建了它）。你应该看到一个新的 `require` 行，其中包含了已下载的驱动程序的包路径和确切版本号：\n\
  \n文件：`go.mod`\n\n```\nmodule snippetbox.alexedwards.net\n\ngo 1.18\n\nrequire github.com/go-sql-driver/mysql\
  \ v1.6.0\n```\n\n`go.mod` 中的这一新行本质上告诉了 Go 命令，当你从项目目录运行 `go run`、`go test` 或 `go\
  \ build` 等命令时，应该使用哪个精确版本的 `github.com/go-sql-driver/mysql`。在我们的情况下，它告诉 Go 我们始终想要使用\
  \ `v1.6.0` 版本。\n\n这使得在同一台机器上运行多个使用同一包的不同版本的项目变得简单。我们的项目使用 `v1.6.0` 版本的 MySQL 驱动，但你的电脑上可能有另一个使用\
  \ `v1.5.0` 的代码库，那是完全可以。\n\n你还会发现项目目录根目录下创建了一个名为 `go.sum` 的新文件。\n\n![](img/04.03-01.png)\n\
  \n此 `go.sum` 文件包含了代表所需包内容的加密哈希和。如果你打开它，应该看到类似这里的内容：\n\n文件：`go.sum`\n\n```\ngithub.com/go-sql-driver/mysql\
  \ v1.6.0 h1:BCTh4TKNUYmOmMUcQ3IipzF5prigylS7XXjEkfCHuOE=\ngithub.com/go-sql-driver/mysql\
  \ v1.6.0/go.mod h1:DCzpHaOWr8IXmIStZouvnhqoel9Qv2LBy8hT2VhHyBg=\n```\n\n`go.sum`\
  \ 文件并非设计供人类人工编辑，通常你不需要打开它。但它有两个实用的功能：\n\n*   如果你在终端中运行 `go mod verify` 命令，这将验证你机器上下载的包的哈希是否与\
  \ `go.sum` 中的项匹配，这样你就可以确认它们没有被修改过。\n\n    ```\n    $ go mod verify\n    all modules\
  \ verified\n    ```\n\n*   如果其他人需要下载项目的所有依赖项（他们可以通过运行 `go mod download` 实现），如果他们下载的包与文件之间存在任何不匹配，他们将收到错误。\n\
  \n# 第 4.4 章\n\n## 创建数据库连接\n\n现在 MySQL 数据库已经就绪，我们也安装了驱动程序，下一步自然是连接数据库。\n\n为了实现这一点，我们需要\
  \ Go 的 [`sql.Open()`](https://pkg.go.dev/database/sql/#Open) 函数，你可以这样使用它：\n\n```\n\
  // sql.Open() 函数初始化一个新的 sql.DB 对象，它本质上是\n// 数据库连接池。\ndb, err := sql.Open(\"mysql\"\
  , \"web:pass/snippetbox?parseTime=true\")\nif err != nil {\n    ...\n}\n```\n\n\
  关于这段代码有几点说明：\n\n*   `sql.Open()` 的第一个参数是驱动名称，第二个参数是数据源名称（有时称为连接字符串），它描述了如何连接到你的数据库。\n\
  \n*   数据源名称的格式取决于你使用的数据库和驱动。通常，你可以在特定驱动程序的文档中找到信息和示例。对于我们使用的驱动，你可以在[这里](https://github.com/go-sql-driver/mysql#dsn-data-source-name)找到文档。\n\
  \n*   上述 DSN 中的 `parseTime=true` 部分是驱动特定的参数，指示我们的驱动将 SQL `TIME` 和 `DATE` 字段转换为 Go\
  \ `time.Time` 对象。\n\n*   `sql.Open()` 函数返回一个 [`sql.DB`](https://pkg.go.dev/database/sql/#DB)\
  \ 对象。这不是一个数据库连接——它是一个多连接池。Go 会根据需要管理此池中的连接，通过驱动程序自动打开和关闭与数据库的连接。\n\n*   该连接池是并发访问安全的，因此你可以安全地在\
  \ Web 应用程序处理程序中使用它。\n\n\n\n\n\n*   连接池的设计目的是长久生存。在 Web 应用程序中，在 `main()` 函数中初始化连接池，然后将其传递给处理器（handlers）是正常做法。你不应该在短生命周期的处理器内部直接调用\
  \ `sql.Open()` —— 这会浪费内存和网络资源。\n\n### 在我们的 Web 应用程序中使用\n\n让我们来看看在实践中如何使用 `sql.Open()`。打开你的\
  \ `main.go` 文件并添加以下代码：\n\n文件：`cmd/web/main.go`\n\n```\npackage main\n\nimport (\n\
  \    \"database/sql\" // 新增导入\n    \"flag\"\n    \"log\"\n    \"net/http\"\n   \
  \ \"os\"\n\n    _ \"github.com/go-sql-driver/mysql\" // 新增导入\n)\n\n...\n\nfunc main()\
  \ {\n    addr := flag.String(\"addr\", \":4000\", \"HTTP 网络地址\")\n    // 为 MySQL\
  \ DSN 字符串定义一个新的命令行标志位。\n    dsn := flag.String(\"dsn\", \"web:pass@/snippetbox?parseTime=true\"\
  , \"MySQL 数据源名称\")\n    \n    flag.Parse()\n\n    infoLog := log.New(os.Stdout,\
  \ \"INFO\\t\", log.Ldate|log.Ltime)\n    errorLog := log.New(os.Stderr, \"ERROR\\\
  t\", log.Ldate|log.Ltime|log.Lshortfile)\n\n    // 为了保持 main() 函数整洁，我将创建连接池的代码\n\
  \    // 放在了下面的 openDB() 函数中。我们将从命令行标志\n    // 获取 DSN 并传递给 openDB()。\n    db, err\
  \ := openDB(*dsn)\n    if err != nil {\n        errorLog.Fatal(err)\n    }\n\n \
  \   // 我们还延迟了 db.Close() 调用，以便在 main() 函数退出\n    // 之前关闭连接池。\n    defer db.Close()\n\
  \n    app := &application{\n        errorLog: errorLog,\n        infoLog:  infoLog,\n\
  \    }\n\n    srv := &http.Server{\n        Addr:     *addr,\n        ErrorLog:\
  \ errorLog,\n        Handler:  app.routes(),\n    }\n\n    infoLog.Printf(\"Starting\
  \ server on %s\", *addr)\n    // 因为 err 变量已经在上面的代码中声明过了，我们在这里\n    // 需要使用赋值运算符\
  \ =，而不是使用 := ‘声明并赋值’\n    // 运算符。\n    err = srv.ListenAndServe()\n    errorLog.Fatal(err)\n\
  }\n\n// openDB() 函数封装了 sql.Open() 并为给定的 DSN\n// 返回一个 sql.DB 连接池。\nfunc openDB(dsn\
  \ string) (*sql.DB, error) {\n    db, err := sql.Open(\"mysql\", dsn)\n    if err\
  \ != nil {\n        return nil, err\n    }\n    if err = db.Ping(); err != nil {\n\
  \        return nil, err\n    }\n    return db, nil\n}\n```\n\n这段代码中有几点是有意思的：\n\n\
  *   注意看我们驱动程序的导入路径是以下划线为前缀的吗？这是因为我们的 `main.go` 文件没有调用驱动程序中的任何导出函数；我们只需要它的副作用（`init()`\
  \ 函数）。这是在使用数据库驱动程序时的一种常见模式。\n*   `sql.Open()` 函数实际上并没有建立到数据库的连接；它只是验证参数。第一个连接是在执行查询时或我们调用\
  \ `db.Ping()` 时才实际创建的。\n*   我们使用 `defer db.Close()` 来确保在 `main()` 函数退出时连接池能被正确关闭。\n\
  \n### 使用 SnippetModel\n\n为了在处理器中使用这个模型，我们需要在 `main()` 函数中建立一个新的 `SnippetModel` 结构体，然后通过\
  \ `application` 结构体将其依赖项注入——就像我们处理其他依赖项一样。\n\n\n\n\n\n```go\npackage main\n\nimport\
  \ (\n    \"database/sql\"\n    \"flag\"\n    \"log\"\n    \"net/http\"\n    \"os\"\
  \n\n    // Import the package we just created. You need to prefix this with\n  \
  \  // whatever module path you set up back in chapter 02.01 (Project Setup and Creating\n\
  \    // a Module) so that the import statement looks like this:\n    // \"{your-module-path}/internal/models\"\
  . If you can't remember what module path you \n    // used, you can find it at the\
  \ top of the go.mod file.\n    \"snippetbox.alexedwards.net/internal/models\" \n\
  \n    _ \"github.com/go-sql-driver/mysql\"\n)\n\n// 给 application 结构体添加 snippets\
  \ 字段。这将允许我们\n// 让 SnippetModel 对象对我们的处理程序可用。\ntype application struct {\n    errorLog\
  \ *log.Logger\n    infoLog  *log.Logger\n    snippets *models.SnippetModel\n}\n\n\
  func main() {\n    addr := flag.String(\"addr\", \":4000\", \"HTTP network address\"\
  )\n    dsn := flag.String(\"dsn\", \"web:pass@/snippetbox?parseTime=true\", \"MySQL\
  \ data source name\")\n\n    flag.Parse()\n\n    infoLog := log.New(os.Stdout, \"\
  INFO\\t\", log.Ldate|log.Ltime)\n    errorLog := log.New(os.Stderr, \"ERROR\\t\"\
  , log.Ldate|log.Ltime|log.Lshortfile)\n\n    db, err := openDB(*dsn)\n    if err\
  \ != nil {\n        errorLog.Fatal(err)\n    }\n    defer db.Close()\n\n    // 初始化一个\
  \ models.SnippetModel 实例并将其添加到\n    // application 依赖中。\n    app := &application{\n\
  \        errorLog: errorLog,\n        infoLog:  infoLog,\n        snippets: &models.SnippetModel{DB:\
  \ db},\n    }\n\n    srv := &http.Server{\n        Addr:     *addr,\n        ErrorLog:\
  \ errorLog,\n        Handler:  app.routes(),\n    }\n\n    infoLog.Printf(\"Starting\
  \ server on %s\", *addr)\n    err = srv.ListenAndServe()\n    errorLog.Fatal(err)\n\
  }\n\n...\n```\n\n***\n\n### 额外信息\n\n#### 这种结构的优势\n\n如果你后退一步看，可能会发现以这种方式设置项目的一些用处：\n\
  \n* **有清晰的关注点分离**。我们的数据库逻辑没有与处理程序（handlers）耦合，这意味着处理程序的职责被限于 HTTP 相关的事务（即验证请求和编写响应）。这将使得在未来编写紧凑、专注的单元测试变得更加容易。\n\
  \n* 通过通过创建一个自定义的 `SnippetModel` 类型并在其上实现方法，我们能够让模型成为一个单一且封装良好的对象，我们可以轻松地初始化它并将其作为依赖项传递给处理程序。同样，这使得代码更易于维护且可测试。\n\
  \n* 因为模型操作被定义为对象上的方法——在我们的案例中是 `SnippetModel`——所以我们有机会创建一个 `interface` 并为了单元测试之目的对其进行\
  \ mock（模拟）。\n\n* 最后，通过通过使用 `-dsn` 命令行标志，我们对运行时使用哪个数据库拥有完全的控制权。\n\n第 4.6 节。\n\n##\
  \ 执行 SQL 语句\n\n现在，让我们更新刚刚创建的 `SnippetModel.Insert()` 方法，使其在我们的 `snippets` 表中创建一个新记录，然后返回该新记录的整数\
  \ `id`。\n\n为了实现这一点，我们需要在数据库上执行以下 SQL 查询：\n\n```sql\nINSERT INTO snippets (title,\
  \ content, created, expires)\nVALUES(?, ?, UTC_TIMESTAMP(), DATE_ADD(UTC_TIMESTAMP(),\
  \ INTERVAL ? DAY))\n```\n\n注意在在此查询中，我们如何使用 `?` 字符来表示要插入数据库的数据占位符参数（placeholder parameters）。因为我们将使用数据最终将是来自表单的不可信的用户输入，因此使用占位符参数而不是在\
  \ SQL 查询中插值数据是一种良好的做法。\n\n### 执行查询\n\nGo 提供了三种不同的方法来执行数据库查询：\n\n* [`DB.Query()`](https://pkg.go.dev/database/sql/#DB.Query)\
  \ 用于返回多行的 `SELECT` 查询。\n\n* [`DB.QueryRow()`](https://pkg.go.dev/database/sql/#DB.QueryRow)\
  \ 用于返回单行的 `SELECT` 查询。\n\n* [`DB.Exec()`](https://pkg.go.dev/database/sql/#DB.Exec)\
  \ 用于不返回行的语句（例如 `INSERT` 和 `DELETE`）。\n\n所以，在我们的情况下，最适合这项工作的工具是 `DB.Exec()`。让我们深入尝试并演示如何在我们的\
  \ `SnippetModel.Insert()` 方法中使用它。我们稍后讨论细节。\n\n打开你的 `internal/models/snippets.go`\
  \ 文件并进行如下更新：\n\n文件：`internal/models/snippets.go`\n\n```go\npackage models\n\n...\n\
  \ntype SnippetModel struct {\n    DB *sql.DB\n}\n\nfunc (m *SnippetModel) Insert(title\
  \ string, content string, expires int) (int, error) {\n    // 编写我们想要执行的 SQL 语句。为了可读性，我将其分为两行。\n\
  \    stmt := `INSERT INTO snippets (title, content, created, expires)\n    VALUES(?,\
  \ ?, UTC_TIMESTAMP(), DATE_ADD(UTC_TIMESTAMP(), INTERVAL ? DAY))`\n\n    // 在数据库上使用\
  \ Exec 方法\n    result, err := m.DB.Exec(stmt, title, content, expires)\n    if err\
  \ != nil {\n        return 0, err\n    }\n\n    // 使用 LastInsertId() 方法获取 ID\n \
  \   id, err := result.LastInsertId()\n    if err != nil {\n        return 0, err\n\
  \    }\n\n    return int(id), nil\n}\n```\n\n让我们快速讨论一下 `DB.Exec()` 返回的 [`sql.Result`](https://pkg.go.dev/database/sql#Result)\
  \ 类型。它提供了两个方法：\n\n* `LastInsertId()` —— 返回自增列生成的整数。\n* `RowsAffected()` —— 返回影响的数。\n\
  \n此外，如果你不需要，忽略 `sql.Result` 返回值也是完全可以且常见的。例如：\n\n```go\n_, err := m.DB.Exec(stmt,\
  \ ...)\n```\n\n### 在处理程序中使用模型\n\n让我们回到具体场景，演示如何从我们的处理程序调用这段新代码。打开你的 `cmd/handlers.go`\
  \ 文件并更新 `snippetCreate` 处理程序：\n\n文件：`cmd/handlers.go`\n\n```go\npackage main\n\n\
  ...\n\nfunc (app *application) snippetCreate(w http.ResponseWriter, r *http.Request)\
  \ {\n    if r.Method != http.MethodPost {\n        w.Header().Set(\"Allow\", http.MethodPost)\n\
  \        app.clientError(w, http.StatusNotAllowed)\n        return\n    }\n\n  \
  \  // 创建一些持有虚拟数据的变量。我们会在构建\n    // 期间删除它们。\n    title := \"O snail\"\n    content\
  \ := \"O snail\\nClimb Mount Fuji,\\nBut slowly, slowly!\\n– Kobayashi Issa\"\n\
  \    expires := 7\n\n    // 将数据传递给 SnippetModel.Insert() 方法，接收\n    // 新记录的 ID\n\
  \    id, err := app.snippets.Insert(title, content, expires)\n    if err != nil\
  \ {\n        app.serverError(w, err)\n        return\n    }\n\n    // 将用户重定向到相关的\
  \ snippet 页面\n    http.Redirect(w, r, fmt.Sprintf(\"/snippet/view?id=%d\", id),\
  \ http.StatusSeeOther)\n}\n```\n\n启动应用程序，然后在另一个终端窗口中使用 curl 发送 `POST /snippet/create`\
  \ 请求，如下（注意 `-L` 标志指示 curl 自动跟随重定向）：\n\n```bash\n$ curl -iL -X POST http://localhost:4000/snippet/create\n\
  HTTP/1.1 303 See Other\nLocation: /snippet/view?id=4\nDate: Mon, 31 Jan 2022 16:36:18\
  \ GMT\nContent-Length: 0\n\nHTTP/1.1 200 OK\nDate: Mon, 31 Jan 2022 16:36:18 GMT\n\
  Content-Length: 40\nContent-Type: text/plain; charset=utf-8\n\nDisplay a specific\
  \ snippet with ID 4...\n```\n\n\n\n这一切运行得非常顺利。我们刚刚发送了一个 HTTP 请求，触发了我们的 `snippetCreate`\
  \ 处理器，该处理器继而调用了我们的 `SnippetModel.Insert()` 方法。这在数据库中插入了一条新记录并返回了该新记录的 ID。随后，我们的处理器发布了一个重定向到另一个\
  \ URL，并将 ID 作为查询字符串参数。\n\n你可以随时查看你 MySQL 数据库中的 `snippets` 表。你应该能看到一条 ID 为 `4` 的新记录，类似于下面：\n\
  \n```\nmysql> SELECT id, title, expires FROM snippets;\n+----+------------------------+---------------------+\n\
  | id | title                  | expires             |\n+----+------------------------+---------------------+\n\
  |  1 | An old silent pond     | 2023-04-05 07:20:05 |\n|  2 | Over the wintry forest\
  \ | 2023-04-05 07:20:05 |\n|  3 | First autumn morning   | 2022-04-12 07:20:05 |\n\
  |  4 | O snail                | 2022-04-12 07:32:45 |\n+----+------------------------+---------------------+\n\
  4 rows in set (0.00 sec)\n```\n\n***\n\n### 附加信息\n\n#### 占位参数\n\n在上面的代码中，我们使用占位参数构建了\
  \ SQL 语句，其中 `?` 作为我们想要插入的数据的占位符。\n\n使用占位参数构建查询（而不是字符串插值）的原因是为了帮助避免来自任何不可信的用户提供输入的\
  \ SQL 注入攻击。\n\n在底层，`DB.Exec()` 方法分三个步骤工作：\n\n1. 它使用提供的 SQL 语句在数据库上创建一个新的[预处理语句](https://en.wikipedia.org/wiki/Prepared_statement)。数据库解析并编译该语句，然后将其存储起来以待执行。\n\
  2. 在第二个独立的步骤中，`Exec()` 将参数值传递给数据库。随后，数据库使用这些参数执行预处理语句。因为参数是在语句编译后传输的，所以数据库将它们视为纯数据。它们无法改变语句的意图。只要原始语句不是源于不可信的数据，就不会发生注入。\n\
  3. 随后它会在数据库上关闭（或释放）该预处理语句。\n\n占位参数的语法取决于你使用的数据库。MySQL、SQL Server 和 SQLite 使用 `?`\
  \ 符号，但 PostgreSQL 使用 `$N` 符号。例如，如果你使用的是 PostgreSQL，你会这样写：\n\n```\n_, err := m.DB.Exec(\"\
  INSERT INTO ... VALUES ($1, $2, $3)\", ...)\n```\n\n第 4.7 节。\n\n## 单记录 SQL 查询\n\n\
  从数据库中 `SELECT` 单条记录的模式要稍微复杂一些。让我们通过更新 `SnippetModel.Get()` 方法来解释如何实现，使其根据 ID 返回一个特定的特定的代码片段。\n\
  \n要实现这一点，我们需要在数据库上运行以下 SQL 查询：\n\n```sql\nSELECT id, title, content, created, expires\
  \ FROM snippets\nWHERE expires > UTC_TIMESTAMP() AND id = ?\n```\n\n由于我们的 `snippets`\
  \ 表使用 `id` 列作为主键，此查询将始终返回恰好一条数据库行（或者什么都不返回）。该查询还包含了对过期时间的检查，以确保我们不会返回任何过期的代码片段。\n\
  \n注意看，我们再次对 `id` 值使用了占位参数吗？\n\n打开 `internal/models/snippets.go` 文件并添加以下代码：\n\n文件：`internal/models/snippets.go`\n\
  \n```go\npackage models\n\nimport (\n    \"database/sql\"\n    \"errors\" // 新导入\n\
  \    \"time\" \n)\n\n...\n\nfunc (m *SnippetModel) Get(id int) (*Snippet, error)\
  \ {\n    // 编写我们想要执行的 SQL 语句。再次，为了可读性，我将其分成了\n    // 两行。\n    stmt := `SELECT id,\
  \ title, content, created, expires FROM snippets\n    WHERE expires > UTC_TIMESTAMP()\
  \ AND id = ?`\n\n    // 使用连接池上的 QueryRow() 方法执行我们的\n    // SQL 语句，将不可信的 id 变量作为占位参数的值传入。\n\
  \    // 返回一个指向 sql.Row 对象的指针，该对象\n    // 持有来自数据库的结果。\n    row := m.DB.QueryRow(stmt,\
  \ id)\n\n    // 初始化一个新的零值 Snippet 结构体的指针。\n    s := &Snippet{}\n\n    // 使用 row.Scan()\
  \ 将 sql.Row 中每个字段的值复制到\n    // Snippet 结构体中对应的字段中。注意\n    // row.Scan 的参数是你想将数据拷贝入的位置的指针，\n\
  \    // 且参数的数量必须与你的语句返回的列数\n    // 完全一致。\n    err := row.Scan(&s.ID, &s.Title, &s.Content,\
  \ &s.Created, &s.Expires)\n    if err != nil {\n        // 如果查询没有返回行，则 row.Scan()\
  \ 将返回一个\n        // sql.ErrNoRows 错误。我们使用 errors.Is() 函数专门检查\n        // 该错误，并返回我们自己的\
  \ ErrNoRecord 错误\n        // （我们稍后会创建它）。\n        if errors.Is(err, sql.ErrNoRows)\
  \ {\n            return nil, ErrNoRecord\n        } else {\n            return nil,\
  \ err\n        }\n    }\n\n    // 如果查询成功，返回 Snippet。\n    return s, nil\n}\n```\n\
  \n作为旁带，你可能会疑惑为什么我们在 `SnippetModel.Get()` 方法中返回 `ErrNoRecord` 错误，而不是直接返回 `sql.ErrNoRows`。原因是为了帮助封装模型，使我们的应用程序不关注底层数据存储，也不依赖于特定的存储错误。\n\
  \n打开你的 `cmd/web/handlers.go` 文件并更新 `snippetView` 处理器，使其返回特定记录的数据：\n\n文件：`cmd/web/handlers.go`\n\
  \n```go\npackage main\n\nimport (\n    \"errors\" // 新导入\n    \"fmt\"\n    \"html/template\"\
  \n    \"net/http\"\n    \"strconv\"\n\n    \"snippetbox.alexwards.net/internal/models\"\
  \ // 新导入\n)\n\n...\n\nfunc (app *application) snippetView(w http.ResponseWriter,\
  \ r *http.Request) {\n    id, err := strconv.Atoi(r.URL.Query().Get(\"id\"))\n \
  \   if err != nil || id < 1 {\n        app.notFound(w)\n        return\n    }\n\n\
  \    // 使用 SnippetModel 对象的 Get 方法根据 ID 获取\n    // 特定记录的数据。如果没有找到匹配记录，\n    // 返回\
  \ 404 Not Found 响应。\n    snippet, err := app.snippets.Get(id)\n    if err != nil\
  \ {\n        if errors.Is(err, models.ErrNoRecord) {\n            app.notFound(w)\n\
  \        } else {\n            app.serverError(w, err)\n        }\n        return\n\
  \    }\n\n    // 将代码片段数据作为纯文本 HTTP 响应体。\n    fmt.Fprintf(w, \"%+v\", snippet)\n\
  }\n```\n\n让我们尝试一下。打开你的浏览器并访问 [`http://localhost:4000/snippet/view?id=1`](http://localhost:4000/snippet/view?id=1)。你应该能看到类似于下面的\
  \ HTTP 响应：\n\n![](img/04.07-01.png)\n\n\n\n\n\n你可能还想尝试请求一些已过期或不存在的代码片段（例如 `id=99`），以验证它们是否会返回\
  \ `404 Not Found` 响应：\n\n![](img/04.07-02.png)\n\n***\n\n### 附加信息\n\n#### 检查特定错误\n\
  \n在本章中，我们多次使用了 [`errors.Is()`](https://tip.golang.org/pkg/errors/#Is) 函数来检查错误是否匹配某个特定值。如下：\n\
  \n```\nif errors.Is(err, models.ErrNoRecord) {\n    app.notFound(w)\n} else {\n\
  \    app.serverError(w, err)\n}\n```\n\n在 Go 1.13 之前，执行此操作的惯用方法是使用相等运算符 `==` 来进行检查，如下：\n\
  \n```\nif err == models.ErrNoRecord {\n    app.notFound(w)\n} else {\n    app.serverError(w,\
  \ err)\n}\n```\n\n但是，虽然这段代码仍然可以编译，但现在使用 `errors.Is()` 函数更安全且更符合最佳实践。\n\n这是因为 Go\
  \ 1.13 引入了通过[包装错误](https://go.dev/blog/go1.13-errors#wrapping-errors-with-w) 为错误添加额外信息的能力。如果一个错误被包装了，就会创建一个完全新的错误值——这意味着无法使用普通的\
  \ `==` 相等运算符来检查原始底层错误的值。\n\n相比之下，`errors.Is()` 函数的工作原理是在检查匹配之前根据需要对错误进行解包。\n\n基本上，如果你运行的是\
  \ Go 1.13 或更高版本，请优先使用 `errors.Is()`。这是一种让你的代码面向未来的明智方法，并防止由于你（或你代码导入的任何包）在未来决定包装错误而导致的\
  \ bug。\n\n还有另一个函数 [`errors.As()`](https://tip.golang.org/pkg/errors/#As)，你可以用它来检查一个（可能被包装的）错误是否具有特定类型。我们将在本书后部分中使用它。\n\
  \n#### 单条记录查询简写\n\n我刻意让 `SnippetModel.Get()` 中的代码写得稍微冗长一些，有助于澄清并强调你的代码背后正在发生什么。\n\
  \n在实践中，你可以利用 `DB.QueryRow()` 的错误会延迟到调用 `Scan()` 才执行这一事实稍微缩短代码。这在功能上没有区别，但如果你愿意，完全可以重写代码看起来像这样：\n\
  \n```\nfunc (m *SnippetModel) Get(id int) (*Snippet, error) {\n    s := &Snippet{}\n\
  \    \n    err := m.DB.QueryRow(\"SELECT ...\", id).Scan(&s.ID, &s.Title, &s.Content,\
  \ &s.Created, &s.Expires)\n    if err != nil {\n        if errors.Is(err, sql.ErrNoRows)\
  \ {\n            return nil, ErrNoRecord\n        } else {\n             return\
  \ nil, err\n        }\n    }\n\n    return s, nil\n}\n```\n\n第 4.8 章。\n\n#### 多记录\
  \ SQL 查询\n\n最后，让我们来看执行返回多行的 SQL 语句的模式。我将通过更新 `SnippetModel.Latest()` 方法，使用以下 SQL\
  \ 查询返回最近创建的十个代码片段（只要它们还没有过期）：\n\n```\nSELECT id, title, content, created, expires\
  \ FROM snippets\nWHERE expires > UTC_TIMESTAMP() ORDER BY id DESC LIMIT 10\n```\n\
  \n打开 `internal/models/snippets.go` 文件并添加以下代码：\n\n文件：`internal/models/snippets.go`\n\
  \n```\npackage models\n\n...\n\nfunc (m *SnippetModel) Latest() ([]*Snippet, error)\
  \ {\n    // 写我们想要执行的 SQL 语句。\n    stmt := `SELECT id, title, content, created, expires\
  \ FROM snippets\n    WHERE expires > UTC_TIMESTAMP() ORDER BY id DESC LIMIT 10`\n\
  \n    // 使用连接池上的 Query() 方法来执行我们的\n    // SQL 语句。它返回一个 sql.Rows 结果集，包含\n    // 我们查询的结果。\n\
  \    rows, err := m.DB.Query(stmt)\n    if err != nil {\n        return nil, err\n\
  \    }\n    defer rows.Close()\n\n    var snippets []*Snippet\n\n    for rows.Next()\
  \ {\n        s := &Snippet{}\n        err := rows.Scan(&s.ID, &s.Title, &s.Content,\
  \ &s.Created, &s.Expires)\n        if err != nil {\n            return nil, err\n\
  \        }\n        snippets = append(snippets, s)\n    }\n\n    if err = rows.Err();\
  \ err != nil {\n        return nil, err\n    }\n\n    return snippets, nil\n}\n\
  ```\n\n### 在我们的处理器中使用模型\n\n回到你的 `cmd/web/handlers.go` 文件并更新 `home` 处理器以使用 `SnippetModel.Latest()`\
  \ 方法，将代码片段内容转到 HTTP 响应中。现在只需注释掉与模板渲染的代码，如下：\n\n文件：`cmd/web/handlers.go`\n\n```\n\
