  \ 或 `Laravel`），那么你可能熟悉 `debug` 模式的概念，在这种模式下，详细错误会显示给用户，而不是通用的 `Internal Server Error`\
  \ 消息。本次练习的目标是为我们的应用程序设置一个类似的 `debug` 模式，可以通过如下使用 `-debug` 标志来启用：\n\n```bash\n$ go\
  \ run ./cmd/web -debug\n```\n\n在调试模式下运行时，任何详细的错误和堆栈跟踪都应该在浏览器中显示，类似于：assets/img/17.01.png\n\
