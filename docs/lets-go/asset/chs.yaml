  \ 属性。\n\n默认情况下，我们正在使用的 `alexedwards/scs` 包始终会在 session cookie 上设置 `SameSite=Lax`。这意味着用户的浏览器将不会为任何[不安全的](https://tools.ietf.org/html/rfc7231#section-4.2.1)跨站请求发送（即\
  \ HTTP 方法为 `POST`、`PUT` 和 `DELETE` 的跨站请求）。\n\n只要我们的应用程序对任何更改状态的 HTTP 请求（如我们的*登录*、*注册*、*注销*和*创建代码片段*表单提交）使用\
  \ `POST` 方法，意味着如果这些请求是跨站的，session cookie 就不会被发送——这反过来意味着它们应该是免受 CSRF 攻击的。\n\n然而，`SameSite`\
  \ 属性仍然较新，全球范围内只有 [90% 的浏览器](https://caniuse.com/#feat=same-site-cookie-attribute)完全支持。因此，虽然我们可以将其作为防御措施（并且应该这样做），但我们不能依赖它来保护所有用户。\n\
  \n### 基于令牌的缓解措施\n\n为了降低所有用户的 CSRF 风险，我们还需要实现某种形式的[令牌检查](https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html#token-mitigation)。与会话管理和密码哈希一样，在这一方面有很多错误可以犯，因此，使用经过测试的第三方包可能比自己编写更安全。Go\
  \ Web 应用程序中停止 CSRF 攻击的两个最流行的包是 [`gorilla/csrf`](https://github.com/gorilla/csrf)\
  \ 和 [`justinas/nosurf`](https://github.com/justinas/nosurf)。它们都做了大致相同的事情，使用[双重提交\
  \ cookie](https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html#double-submit-cookie)\
  \ 模式来防止攻击。在这种模式下，会生成一个随机 CSRF 令牌并通过 cookie 发送给用户。然后，此 CSRF 令牌被添加到每个易受 CSRF 攻击的 HTML\
  \ 表单的隐藏字段中。当表单提交时，两个包都会使用某些中间件来检查隐藏字段和 cookie 值是否匹配。在这两个包中，我们书中选择使用 `justinas/nosurf`。我主要倾向于它，因为它是自包含的，没有任何依赖。如果你在跟随操作，可以像这样安装最新版本：\n\
  \n```bash\ngo get github.com/justinas/nosurf@v1\n```\n\n### 使用 nosurf 包\n\n要使用 `justinas/nosurf`，打开你的\
  \ `cmd/web/middleware.go` 文件并创建一个如下新的 `noSurf()` 中间件：\n\nFile: cmd/web/middleware.go\n\
  ```go\npackage main\n\nimport (\n    \"fmt\"\n    \"net/http\"\n\n    \"github.com/justinas/nosurf\"\
  \n)\n\n...\n\n// 创建一个 noSurf 中间件\nfunc noSurf(next http.Handler) http.Handler {\n\
  \    return nosurf.New(next, http.Cookie{\n        HttpOnly: true,\n        Path:\
  \     \"/\",\n        Secure:   true, // 如果使用 HTTPS 则应设置为 true\n        SameSite:\
  \ http.SameSiteLaxMode,\n    })\n}\n```\n*(注：由于原文提供的文本中代码块部分实际上是逻辑混乱且包含了多个代码的，我将基于原文文本结构进行翻译。)*\
