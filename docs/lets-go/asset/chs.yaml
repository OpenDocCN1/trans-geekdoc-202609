  \n# 第 14.2 章. 测试 HTTP 处理器和中间件\n\n让我们继续讨论对 HTTP 处理器进行单元测试的一些特定技术。\n\n到目前为止，我们为项目编写的所有处理器测试起来都有些复杂，为了引入相关概念，我倾向于从更简单的东西开始。\n\
  \n所以，如果你正在跟着操作，请进入你的 `handlers.go` 文件并创建一个新的 `ping` 处理器函数，该函数返回一个 `200 OK` 状态码和\
  \ `\"OK\"` 响应体。这种类型的处理器可能你希望用于服务器的状态检查或运行时间监控。\n\n### 文件：`cmd/web/handlers.go`\n\
  \n```go\npackage main\n\n...\n\nfunc ping(w http.ResponseWriter, r *http.Request)\
  \ {\n    w.Write([]byte(\"OK\"))\n}\n```\n\n在本章中，我们将创建一个新的 `TestPing` 单元测试，它：\n\n\
  * 检查 `ping` 处理器写入的响应状态码是否为 `200`。\n* 检查 `ping` 处理器写入的响应体是否为 `\"OK\"`。\n\n## 记录响应\n\
  \n为了帮助测试 HTTP 处理器，Go  [`net/http/httptest`](https://pkg.go.dev/net/http/httptest)\
  \ 包，它包含了一系列实用工具。\n\n其中一个工具是 [`httptest.ResponseRecorder`](https://pkg.go.dev/net/http/httptest/#ResponseRecorder)\
  \ 类型。这本质上是 `http.ResponseWriter` 的实现，它记录响应状态码、响应头和响应体，而不是将它们实际写入 HTTP 连接。\n\n因此，单元测试处理器的一种简单方法是创建一个新的\
  \ `httptest.ResponseRecorder` 对象，将其传递给处理器函数，然后在处理器返回后对其进行检查。\n\n让我们尝试这样做来测试 `ping`\
  \ 处理器函数。\n\n首先，遵循 Go 惯例创建一个新的 `handlers_test.go` 文件来存放测试……\n\n```bash\n$ touch cmd/web/handlers_test.go\n\
  ```\n\n然后添加以下代码：\n\n### 文件：`cmd/web/handlers_test.go`\n\n```go\npackage main\n\n\
  import (\n    \"bytes\"\n    \"io\"\n    \"net/http\"\n    \"net/http/httptest\"\
  \n    \"testing\"\n\n    \"snippetbox.alexedwards.net/internal/assert\"\n)\n\nfunc\
  \ TestPing(t *testing.T) {\n    // 初始化一个新的 httptest.ResponseRecorder.\n    rr :=\
  \ httptest.NewRecorder()\n\n    // 初始化一个新的伪的 http.Request.\n    r, err := http.NewRequest(http.MethodGet,\
  \ \"/\", nil)\n    if err != nil {\n        t.Fatal(err)\n    }\n\n    // 调用 ping\
  \ 处理器函数，传递\n    // httptest.ResponseRecorder 和 http.Request。\n    ping(rr, r)\n\n\
  \    // 调用 http.ResponseRecorder 的 Result() 方法来获取\n    // 由 ping 处理器生成的 http.Response。\n\
  \    rs := rr.Result()\n\n    // 检查 ping 处理器写入的状态码是否为 200。\n    assert.Equal(t,\
  \ rs.StatusCode, http.StatusOK)\n   \n    // 并且我们可以检查 ping 处理器写入的响应体\n    // 是否等于\
  \ \"OK\"。\n    defer rs.Body.Close()\n    body, err := io.ReadAll(rs.Body)\n   \
  \ if err != nil {\n        t.Fatal(err)\n    }\n    bytes.TrimSpace(body)\n\n  \
  \  assert.Equal(t, string(body), \"OK\")\n}\n```\n\n好了，保存文件，然后尝试带有详细输出标志再次运行 `go\
  \ test`。如下所示：\n\n```bash\n$ go test -v ./cmd/web/\n=== RUN   TestPing\n--- PASS:\
  \ TestPing (0.00s)\n=== RUN   TestHumanDate\n=== RUN   TestHumanDate/UTC\n=== RUN\
  \   TestHumanDate/Empty\n=== RUN   TestHumanDate/CET\n--- PASS: TestHumanDate (0.00s)\n\
  \    --- PASS: TestHumanDate/UTC (0.00s)\n    --- PASS: TestHumanDate/Empty (0.00s)\n\
  \    --- PASS: TestHumanDate/CET (0.00s)\nPASS\nok      snippetbox.alexedwards.net/cmd/web\
  \      0.003s\n```\n\n看起来看起来良好。我们可以看到我们新的 `TestPing` 测试正在运行并且没有任何问题地通过了。\n\n## 测试中间件\n\
  \n同样可以使用相同的通用模式对中间件进行单元测试。\n\n我们将通过为 `secureHeaders()` 中间件创建一个新的 `TestSecureHeaders`\
  \ 测试来演示，该中间件我们在本书早期 创建的。作为此测试的一部分，我们想要检查：\n\n* `secureHeaders()` 中间件是否在 HTTP 响应上设置了所有预期的响应头。\n\
  \n\n\n总而言之，对 HTTP 处理器和中间件进行单元测试的一种快速简单的方法，就是直接使用 `httptest.ResponseRecorder` 类型来调用它们。然后，你可以检查记录的响应的状态码、响应头和响应体，以确保它们的运行方式符合预期。\n\
  \n第 14.3 节。\n\n## 端到端测试\n\n在上一节中，我们讨论了孤立单元测试 HTTP 处理器的通用模式。\n\n但是——在大多数情况下——你的 HTTP\
  \ 处理器并不是孤立运行的。因此，在本章中，我们将解释如何对 Web 应用程序运行端到端测试，这些测试将涵盖你的路由、中间件和处理器。可以说，端到端测试比孤立的单元测试更能让你对应用程序是否运行正常充满信心。\n\
  \n为了说明这一点，我们将调整现的 `TestPing` 函数，使其对我们的代码运行端到端测试。具体来说，我们希望测试确保对应用程序的 `GET /ping`\
  \ 请求会调用 `ping` 处理器函数，并返回 `200 OK` 状态码和 `\"OK\"` 响应体。\n\n本质上，我们想要测试应用程序是否拥有如下路由：\n\
  \n| 方法 | 模式 | 处理器 | 操作 |\n| --- | --- | --- | --- |\n| … | … | … | … |\n| --- |\
  \ --- | --- | --- |\n| GET | /ping | ping | 返回 200 OK 响应 |\n\n### 使用 httptest.Server\n\
  \n对应用程序进行端到端测试的关键是使用 [`httptest.NewTLSServer()`](https://pkg.go.dev/net/http/httptest/#NewTLSServer)\
  \ 函数，它会启动一个 [`httptest.Server`](https://pkg.go.dev/net/http/httptest/#Server) 实例，我们可以向它发送\
  \ HTTPS 请求。\n\n整个模式有点复杂，不便于一次性解释，因此最好的方法可能是先通过编写代码来演示，然后我们再讨论细节。\n\n既然如此，回到你的 `handlers_test.go`\
  \ 文件并更新 `TestPing` 测试，使其如下所示：\n\n文件：`cmd/web/handlers_test.go`\n\n```go\npackage\
  \ main\n\nimport (\n    \"bytes\"\n    \"io\"\n    \"log\" // 新导入的包\n    \"net/http\"\
  \n    \"net/http/httptest\"\n    \"testing\"\n\n    \"snippetbox.alexedwards.net/internal/assert\"\
  \n)\n\nfunc TestPing(t *testing.T) {\n    // 创建我们应用程序结构体的新实例。现在，它只\n    // 包含了几个\
  \ mock 日志器（它们丢弃任何写入\n    // 它们的内容）。\n    app := &application{\n        errorLog:\
  \ log.New(io.Discard, \"\", 0),\n        infoLog:  log.New(io.Discard, \"\", 0),\n\
  \    }\n\n    // 然后我们使用 httptest.NewTLSServer() 函数创建一个新的测试\n    // 服务器，将 app.routes()\
  \ 方法返回的值作为服务器的\n    // 处理器传递进去。这会启动一个 HTTPS 服务器，在测试期间\n    // 在你本地机器上随机选择的端口上监听。\n\
  \    // 注意我们延迟了 ts.Close() 的调用，以便在测试\n    // 完成时关闭服务器。\n    ts := httptest.NewTLSServer(app.routes())\n\
  \    defer ts.Close()\n\n    // 测试服务器监听的网络地址包含在\n    // ts.URL 字段中。我们可以结合 ts.Client().Get()\
  \ 方法\n    // 向测试服务器发送 GET /ping 请求。这返回一个\n    // 包含响应的 http.Response 结构体。\n    rs,\
  \ err := ts.Client().Get(ts.URL + \"/ping\")\n    if err != nil {\n        t.Fatal(err)\n\
  \    }\n\n    // 然后我们可以使用之前的模式检查\n    // 响应状态码和体的值。\n    assert.Equal(t, rs.StatusCode,\
  \ http.StatusOK)\n\n    defer rs.Body.Close()\n    body, err := io.ReadAll(rs.Body)\n\
  \    if err != nil {\n        t.Fatal(err)\n    }\n    bytes.TrimSpace(body)\n\n\
  \    assert.Equal(t, string(body), \"OK\")\n}\n```\n\n关于这段代码，有几点需要指出和讨论。\n\n* 当我们调用\
  \ `httptest.NewTLSServer()` 初始化测试服务器时，我们需要传递一个 `http.Handler` 作为参数——这个处理器在测试服务器每次接收到\
  \ HTTPS 请求时都会被调用。在我们的用例中，我们传递了 `app.routes()` 方法的返回值，这意味着对测试服务器的请求将使用我们所有真实的应用程序路由、中间件和处理器。\n\
  \n    这是我们在书的早期章节在 `app.routes()` 方法中孤立所有应用程序路由所做工作的巨大优势。\n\n* 如果你正在测试 HTTP（而非 HTTPS）服务器，你应该使用\
  \ [`httptest.NewServer()`](https://pkg.go.dev/net/http/httptest/#NewServer) 函数来创建测试服务器。\n\
  \n* [`ts.Client()`](https://pkg.go.dev/net/http/httptest/#Server.Client) 方法返回测试服务器客户端——它的类型是\
  \ [`http.Client`](https://pkg.go.dev/net/http/#Client)——我们应该始终使用这个客户端向测试服务器发送请求。可以配置客户端来微调其行为，我们将在本章末尾解释如何操作。\n\
  \n* 你可能会奇怪为什么我们只设置了 `application` 结构体的 `errorLog` 和 `infoLog` 字段，而没有设置其他字段。原因是 `logRequest`\
  \ 和 `recoverPanic` 中间件需要日志器，而这些中间件被我们的应用程序用于每个路由上。在没有设置这两个依赖项的情况下运行此测试会导致 panic（崩溃）。\n\
  \n总之，让我们尝试一下新测试：\n\n```bash\n$ go test ./cmd/web/\n--- FAIL: TestPing (0.00s)\n\
  \    handlers_test.go:41: got 404; want 200\n    handlers_test.go:51: got: Not Found;\
  \ want: OK\nFAIL\nFAIL    snippetbox.alexedwards.net/cmd/web      0.007s\n```\n\n\
  如果你正在跟着教程操作，在这一点你会遇到失败。我们可以从测试输出看到 `GET /ping` 请求的响应是 `404` 状态码，而不是预期的 `200`。这是因为我们还没有在路由器中注册\
  \ `GET /ping` 路由。\n\n现在修复它：\n\n文件：`cmd/web/routes.go`\n\n```go\npackage main\n\n\
  ...\n\nfunc (app *application) routes() http.Handler {\n    router := httprouter.New()\n\
  \n    router.NotFound = http.HandlerFunc(func(w http.ResponseWriter, r *http.Request)\
  \ {\n        app.notFound(w)\n    })\n\n    fileServer := http.FileServer(http.FS(ui.Files))\n\
  \    router.Handler(http.MethodGet, \"/static/*filepath\", fileServer)\n\n    //\
  \ 添加一个新的 GET /ping 路由。\n    router.HandlerFunc(http.MethodGet, \"/ping\", ping)\n\
  \n    dynamic := alice.New(app.sessionManager.LoadAndSave, noSurf, app.authenticate)\n\
  \n    router.Handler(http.MethodGet, \"/\", dynamic.ThenFunc(app.home))\n    router.Handler(http.MethodGet,\
  \ \"/snippet/:id\", dynamic.ThenFunc(app.snippetView))\n    router.Handler(http.MethodGet,\
  \ \"/user/signup\", dynamic.ThenFunc(app.usersignup))\n    router.Handler(http.MethodPost,\
  \ \"/user/signup\", dynamic.ThenFunc(app.userSignupPost))\n    router.Handler(http.MethodGet,\
  \ \"/user/login\", dynamic.ThenFunc(app.userLogin))\n    router.Handler(http.MethodPost,\
  \ \"/user/login\", dynamic.ThenFunc(app.userLoginPost))\n\n    protected := dynamic.Append(app.requireAuthentication)\n\
  \n    router.Handler(http.MethodGet, \"/snippet/create\", protected.ThenFunc(app.snippetCreate))\n\
  \    router.Handler(http.MethodPost, \"/snippet/create\", protected.ThenFunc(app.snippetCreatePost))\n\
  \    router.Handler(http.MethodPost, \"/user/logout\", protected.ThenFunc(app.userLogoutPost))\n\
  \n    standard := alice.New(app.recoverPanic, app.logRequest, secureHeaders)\n \
  \   return standard.Then(router)\n}\n```\n\n再次运行测试，现在一切都应该通过了。\n\n```bash\n$ go\
  \ test ./cmd/web/\nok      snippetbox.alexedwards.net/cmd/web    0.008s\n```\n\n\
  ### 使用测试辅助函数\n\n我们的 `TestPing` 测试现在运行良好。但我们有一个很好的机会将部分部分代码提取到辅助函数中，当我们项目中添加更多端到端测试时，可以重复使用它们。\n\
  \n\n\n\n关于测试辅助方法的放置位置，并没有什么硬性规定。如果一个辅助方法仅在某个特定的 `*_test.go` 文件中使用，那么将它内联包含在该文件中并与你的测试放在一起可能是合理的。在光谱的另一端，如果你要在多个包的测试中使用某个辅助方法，那么你可能想将其放在一个名为\
  \ `internal/testutils`（或类似名称）的可重用包中，你的测试文件可以导入它。\n\n在我们的案例中，这些辅助方法将仅用于我们的 `cmd/web`\
  \ 包，我们将它们放在一个新的新的 `cmd/web/testutils_test.go` 文件中。\n\n如果你正在跟着教程操作，请现在就创建这个文件……\n\
  \n```\n$ touch cmd/web/testutils_test.go\n```\n\n然后添加以下代码：\n\n文件：`cmd/web/testutils_test.go`\n\
  \n```go\npackage main\n\nimport (\n    \"bytes\"\n    \"io\"\n    \"log\"\n    \"\
  net/http\"\n    \"net/http/httptest\"\n    \"testing\"\n)\n\n// 创建一个新的 newTestApplication\
  \ 辅助方法，它返回一个包含\n// Mock 依赖的 application 结构体实例。\nfunc newTestApplication(t *testing.T)\
  \ *application {\n    return &application{\n        errorLog: log.New(io.Discard,\
  \ \"\", 0),\n        infoLog:  log.New(io.Discard, \"\", 0),\n    }\n}\n\n// 定义一个自定义\
  \ testServer 类型，它嵌入了一个 httptest.Server 实例。\ntype testServer struct {\n    *httptest.Server\n\
  }\n\n// 创建一个新的 newTestServer 辅助方法，它初始化并返回\n// 我们自定义 testServer 类型的新实例。\nfunc newTestServer(t\
  \ *testing.T, h http.Handler) *testServer {\n    ts := httptest.NewTLSServer(h)\n\
  \    return &testServer{ts}\n}\n\n// 在我们的自定义 testServer 类型上实现 get() 方法。这使用\n// 测试服务器客户端对指定的\
  \ 路径发送 GET 请求，并返回\n// 响应状态码、头部和主体。\nfunc (ts *testServer) get(t *testing.T, urlPath\
  \ string) (int, http.Header, string) {\n    rs, err := ts.Client().Get(ts.URL +\
  \ urlPath)\n    if err != nil {\n        t.Fatal(err)\n    }\n\n    defer rs.Body.Close()\n\
  \    body, err := io.ReadAll(rs.Body)\n    if err != nil {\n        t.Fatal(err)\n\
  \    }\n    bytes.TrimSpace(body)\n\n    return rs.StatusCode, rs.Header, string(body)\n\
  }\n```\n\n本质上，这只是我们在本章已经编写的用于启动测试服务器并对其执行 `GET` 请求的代码的泛化。\n\n让我们回到 `TestPing` 处理器，并开始使用这些新的辅助方法：\n\
  \n文件：`cmd/web/handlers_test.go`\n\n```go\npackage main\n\nimport (\n    \"net/http\"\
  \n    \"testing\"\n\n    \"snippetbox.alexedwards.net/internal/assert\"\n)\n\nfunc\
  \ TestPing(t *testing.T) {\n    app := newTestApplication(t)\n\n    ts := newTestServer(t,\
  \ app.routes())\n    defer ts.Close()\n\n    code, _, body := ts.get(t, \"/ping\"\
  )\n\n    assert.Equal(t, code, http.StatusOK)\n    assert.Equal(t, body, \"OK\"\
  )\n}\n```\n\n再次，如果你运行测试，一切都应该通过通过。\n\n```\n$ go test ./cmd/web/\nok  snippetbox.alexedwards.net/cmd/web\
  \ 13s\n```\n\n这看起来进展得很顺利。我们有一个整洁的模式来启动测试服务器并对其进行 `GET` 请求。\n\n\n\n同样值得注意的是，当我们使用\
  \ `t.Errorf()` 函数将测试标记为失败时，它不会导致 `go test` 立即退出。你的所有其他测试（以及子测试）在失败后都会继续运行。\n\n如果你希望在第一次失败后立即终止测试，可以使用\
  \ `-failfast` 标志：\n\n```\n$ go test -failfast ./cmd/web\n```\n\n需要注意的是，`-failfast`\
  \ 标志只会停止*发生失败的包中的测试*。如果你正在多个多个包中运行测试（例如通过使用 `go test ./...`），那么其他包中的测试[将继续运行](https://github.com/golang/go/issues/33038)。\n\
  \n## 并行测试\n\n默认情况下，`go test` 命令以串行方式一个接一个地执行所有测试。当测试数量较少（像我们现在这样）且运行时非常快时，这是完全没有问题的。\n\
  \n但如果你有成百或上千个测试，总运行时间可能会累积到变得有意义的。在这种情况下，通过并行运行测试可以为你节省一些时间。\n\n你可以通过在测试开始时调用 `t.Parallel()`\
  \ 函数来指示该测试可以与其他测试并发运行。例如：\n\n```\nfunc TestPing(t *testing.T) {\n    t.Parallel()\n\
  \n    ...\n}\n```\n\n这里需要注意的是：\n\n*   使用 `t.Parallel()` 标记的测试将与其他并行测试并行运行——*仅与*其他并行测试并行运行。\n\
  \n*   默认情况下，同时运行的最大测试数量是 [GOMAXPROCS](https://pkg.go.dev/runtime/#pkg-constants)\
  \ 的当前值。你可以通过 `-parallel` 标志设置特定值来覆盖它。例如：\n\n    ```\n    $ go test -parallel 4 ./...\n\
  \    ```\n\n*   并不是所有测试都适合并行运行。例如，如果你有一个要求数据库表处于特定已知状态的集成测试，那么你就不希望它与其他操作同一个数据库表的测试并行运行。\n\
  \n## 启用竞态检测器\n\n`go test` 命令包含一个 `-race` 标志，可以在运行测试时启用 Go 的[竞态检测器](https://golang.org/doc/articles/race_detector.html)。\n\
  \n如果你正在测试的代码利用了并发，或者你正在并行运行测试，启用它可能是一个好主意，可以帮助标记你应用程序中存在的竞态条件。你可以这样使用它：\n\n```\n\
  $ go test -race ./cmd/web/\n```\n\n需要指出的是，竞态检测器只是一个工具，在测试期间运行时识别出数据竞态时对其进行标记。它不会对你的代码库进行静态分析，而且运行结果通过并不*确保*你的代码没有竞态条件。\n\
  \n启用竞态检测器还会增加测试的整体运行时间。因此，如果你在 TDD 工作流中频繁地运行测试，你可能倾向于只在提交前的测试运行中使用 `-race` 标志。\n\
  \n第 14.5 节。\n\n## Mock 依赖\n\n现在，我们已经解释了一些测试模式，我们将变得更加严肃，为我们的依赖编写测试。但首先，让我们聊聊依赖。\n\
  \n在整个项目中，我们将依赖注入到 `application` 结构体，如下：\n\n```go\ntype application struct {\n  \
  \  log      *log.Logger\n    session  *session.Session\n    snippets *models.SnippetStore\n\
  \    users    *models.UserStore\n}\n```\n\n在测试时，对这些项进行 mock 而比使用整个数据库是合理的。例如，我们将创建一个这样的\
  \ mock `application`：\n\n```go\ntype application struct {\n    log      *log.Logger\n\
  \    session  *session.Session\n    snippets *models.SnippetStore\n    users   \
  \ *models.UserStore\n}\n```\n\nmock 这些项的原因是为了避免在运行 `go test -v`（带详细模式）时阻塞我们的输出。例如：\n\
  \n```go\ntype application struct {\n    log      *log.Logger\n    session  *session.Session\n\
  \    snippets *models.SnippetStore\n    users    *models.UserStore\n}\n\nfunc newApplication(t\
  \ *testing.T) *application {\n    return &application{\n        log:      log.New(io.Discard,\
  \ \"\", 0),\n        session:  nil,\n        snippets: nil,\n        users:    nil,\n\
  \    }\n}\n```\n\n让我们从创建一个 `models.SnippetStore` 的 mock 开始。为了实现这一点，我们将创建一个实现我们的环境\
  \ `SnippetStore` 相同方法的简单结构体，但让这些方法返回一些虚拟数据。\n\n文件：internal/models/mocks/snippets.go\n\
  \n```go\npackage mocks\n\nimport (\n    \"time\"\n\n    \"snippetbox.alexedwards.net/models\"\
  \n)\n\nvar mockSnippet = &models.Snippet{\n    ID:      1,\n    Title:   \"An old\
  \ pond\",\n    Content: \"An old pond...\",\n    Created: time.Now(),\n    Expires:\
  \ time.Now(),\n}\n\ntype SnippetStore struct{}\n\nfunc (m *SnippetStore) Insert(title\
  \ string, content string, expires int) (int, error) {\n    return 2, nil\n}\n\n\
  func (m *SnippetStore) Get(id int) (*models.Snippet, error) {\n    switch id {\n\
  \    case 1:\n        return mockSnippet, nil\n    default:\n        return nil,\
  \ models.ErrNoRecord\n    }\n}\n\nfunc (m *SnippetStore) Latest() ([]*models.Snippet,\
  \ error) {\n    return []*models.Snippet{mockSnippet}, nil\n}\n```\n\n对我们的 `models.UserStore`\
  \ 执行同样的操作，如下：\n\n文件：internal/models/mocks/users.go\n\n```go\npackage mocks\n\nimport\
  \ (\n    \"snippetbox.alexedwards.net/models\"\n)\n\ntype UserStore struct{}\n\n\
  func (m *UserStore) Insert(name, email, password string) error {\n    switch email\
  \ {\n    case \"dupe@example.com\":\n        return models.ErrDuplicateEmail\n \
  \   default:\n        return nil\n    }\n}\n\nfunc (m *UserStore) Authenticate(email,\
  \ password string) (int, error) {\n    if email == \"alice@example.com\" && password\
  \ == \"pa$$word\" {\n        return 1, nil\n    }\n\n    return 0, models.ErrInvalidCredentials\n\
  }\n\nfunc (m *UserStore) Exists(id int) (bool, error) {\n    switch id {\n    case\
  \ 1:\n        return true, nil\n    default:\n        return false, nil\n    }\n\
  }\n```\n\n在构建的下一步，让我们回到 `testutils_test.go` 文件并更新 `newTestApplication()` 函数，使其创建一个包含所有测试所需依赖的\
  \ `application` 结构体。\n\n文件：cmd/web/testutils_test.go\n\n\n\n\n\n```go\npackage main\n\
  \nimport (\n    \"bytes\"\n    \"io\"\n    \"log\"\n    \"net/http\"\n    \"net/http/cookiejar\"\
  \n    \"net/http/httptest\"\n    \"testing\"\n    \"time\" // New import\n\n   \
  \ \"snippetbox.alexedwards.net/internal/models/mocks\" // New import\n\n    \"github.com/alexedwards/scs/v2\"\
  \    // New import\n    \"github.com/go-playground/form/v4\" // New import\n)\n\n\
  func newTestApplication(t *testing.T) *application {\n    // 创建模板缓存的实例。\n    templateCache,\
  \ err := newTemplateCache()\n    if err != nil {\n        t.Fatal(err)\n    }\n\n\
  \    // 以及一个表单解码器。\n    formDecoder := form.NewDecoder()\n\n    // 以及一个会话管理器实例。注意我们使用了与生产环境\n\
  \    // 相同的设置，但我们*没有*为会话管理器设置 Store。\n    // 如果没有设置 store，SCS 包将默认使用瞬态\n    // 内存存储，这对于测试是非常理想的。\n\
  \    sessionManager := scs.New()\n    sessionManager.Lifetime = 12 * time.Hour\n\
  \    sessionManager.Cookie.Secure = true\n\n    return &application{\n        errorLog:\
  \       log.New(io.Discard, \"\", 0),\n        infoLog:        log.New(io.Discard,\
  \ \"\", 0),\n        snippets:       &mocks.SnippetModel{}, // 使用 mock。\n      \
  \  users:          &mocks.UserModel{},    // 使用 mock。\n        templateCache:  templateCache,\n\
  \        formDecoder:    formDecoder,\n        sessionManager: sessionManager,\n\
  \    }\n}\n\n...\n```\n\n如果你现在尝试运行测试，它将由于以下错误而无法编译失败：\n\n```\n$ go test ./cmd/web\n\
  # snippetbox.alexedwards.net/cmd/web [snippetbox.alexedwards.net/cmd/web.test]\n\
  cmd/web/testutils_test.go:40:19: cannot use &mocks.SnippetModel{} (value of type\
  \ *mocks.SnippetModel) as type *models.SnippetModel in struct literal\ncmd/web/testutils_test.go:41:19:\
  \ cannot use &mocks.UserModel{} (value of type *mocks.UserModel) as type *models.UserModel\
  \ in struct literal\nFAIL    snippetbox.alexedwards.net/cmd/web [build failed]\n\
  FAIL\n```\n\n这是因为我们的 `application` 结构体期望的是 `models.SnippetModel` 和 `models.UserModel`\
  \ 实例的指针，但我们正在尝试使用 `mocks.SnippetModel` 和 `mocks.UserModel` 实例的指针。\n\n符合惯例的修复方法是修改我们的\
  \ `application` 结构体，使其使用同时由我们的 mock 模型和生产数据库模型所满足的接口。\n\n为了做到这一点，让我们回到 `internal/models/snippets.go`\
  \ 并创建一个新的 `SnippetModelInterface` 接口类型，它*描述了实际 SnippetModel 结构体拥有的方法*。\n\n文件：`internal/models/snippets.go`\n\
  \n```go\npackage models\n\nimport (\n    \"database/sql\"\n    \"errors\"\n    \"\
  time\"\n)\n\ntype SnippetModelInterface interface {\n    Insert(title string, content\
  \ string, expires int) (int, error)\n    Get(id int) (*Snippet, error)\n    Latest()\
  \ ([]*Snippet, error)\n}\n\n...\n```\n\n让我们也对 `UserModel` 结构体执行相同的操作：\n\n文件：`internal/models/users.go`\n\
  \n```go\npackage models\n\nimport (\n    \"database/sql\"\n    \"errors\"\n    \"\
  strings\"\n    \"time\"\n\n    \"github.com/go-sql-driver/mysql\"\n    \"golang.org/x/crypto/bcrypt\"\
  \n)\n\ntype UserModelInterface interface {\n    Insert(name, email, password string)\
  \ error\n    Authenticate(email, password string) (int, error)\n    Exists(id int)\
  \ (bool, error)\n}\n\n...\n```\n\n现在我们已经定义了这些接口类型，让我们更新 `application` 结构体以使用它们代替具体的\
  \ `SnippetModel` 和 `UserModel` 类型。如下：\n\n文件：`cmd/web/main.go`\n\n```go\npackage\
  \ main\n\nimport (\n    \"crypto/tls\"\n    \"database/sql\"\n    \"flag\"\n   \
  \ \"html/template\"\n    \"log\"\n    \"net/http\"\n    \"os\"\n    \"time\"\n\n\
  \    \"snippetbox.alexedwards.net/internal/models\"\n\n    \"github.com/alexedwards/scs/mysqlstore\"\
  \n    \"github.com/alexedwards/scs/v2\"\n    \"github.com/go-playground/form/v4\"\
  \n    _ \"github.com/go-sql-driver/mysql\"\n)\n\ntype application struct {\n   \
  \ errorLog       *log.Logger\n    infoLog        *log.Logger\n    snippets     \
  \  models.SnippetModelInterface // 使用我们新的接口类型。\n    users          models.UserModelInterface\
  \    // 使用我们新的接口类型。\n    templateCache  map[string]*template.Template\n    formDecoder\
  \    *form.Decoder\n    sessionManager *scs.SessionManager\n}\n\n...\n```\n\n如果你现在再次尝试运行测试，一切都应该正常工作。\n\
  \n```\n$ go test ./cmd/web\nok      snippetbox.alexedwards.net/cmd/web      0.008s\n\
  ```\n\n让我们停下来，反思一下我们做了什么。\n\n我们更新了 `application` 结构体，使得 `snippets` 和 `users` 字段不再是具体的类型\
  \ `*models.SnippetModel` 和 `*models.UserModel`，而是*接口*。\n\n只要对象拥有接口所需的方法，就可以交叉使用。真实的数据库模型（如\
  \ `models.SnippetModel`）和 mock 数据库模型（如 `mocks.SnippetModel`）都满足这些接口。\n\n### 测试 snippetView\
  \ handler\n\n准备就绪后，让我们为这些 mock 依赖的 `snippetView` handler 编写端到端测试。\n\n作为测试的一部分，我们\
  \ snippetView handler 中的代码将调用 `mock.SnippetModel.Get()` 方法。提醒你一下，这个 mock 方法除非 snippet\
  \ ID 为 `1`，否则它将返回 `models.ErrRecord` —— 此时它将返回以下 mock snippet：\n\n```go\nvar mockSnippet\
  \ = &models.Snippet{\n    ID:      1,\n    Title:   \"An old pond\",\n    Content:\
  \ \"An old pond...\",\n    Created: time.Now(),\n    Expires: time.Now(),\n}\n```\n\
  \n所以具体来说，我们要测试：\n\n1. 对于请求 `GET /snippet/view/1`，我们收到一个 `200 OK` 响应，并且 HTML 响应体中包含相关的\
  \ mock snippet。\n2. 对于所有其他到 `GET /snippet/view/*` 的请求，我们应该收到 `404 Not Found` 响应。\n\
  \n对于第一部分，我们想要检查请求体*包含*某些特定内容，而不是与之完全相等。让我们在我们的 `assert` 包中快速添加一个新的 `StringContains()`\
  \ 函数来帮助我们：\n\n文件：\n\n```go\npackage assert\n\nimport (\n    \"strings\" // 新导入\n\
  \    \"testing\"\n)\n\n...\n\nfunc StringContains(t *testing.T, actual, expectedSubstring\
  \ string) {\n    t.Helper()\n\n    if !strings.Contains(actual, expectedSubstring)\
  \ {\n        t.Errorf(\"got: %q; expected to contain: %q\", actual, expectedSubstring)\n\
  \    }\n}\n```\n\n然后打开 `cmd/web/handlers_test.go` 文件并创建一个新的 `TestSnippetView` 测试，如下：\n\
  \n文件：`cmd/web/handlers_test.go`\n\n\n\n\n\n```go\npackage main\n\n...\n\nfunc TestSnippetView(t\
  \ *testing.T) {\n    // Create a new instance of our application struct which uses\
  \ the mocked\n    // dependencies.\n    app := newTestApplication(t)\n\n    // Establish\
  \ a new test server for running end-to-end tests.\n    ts := newTestServer(t, app.routes())\n\
  \    defer ts.Close()\n\n    // Set up some table-driven tests to check the responses\
  \ sent by our\n    // application for different URLs.\n    tests := []struct {\n\
  \        name     string\n        urlPath  string\n        wantCode int\n      \
  \  wantBody string\n    }{\n        {\n            name:     \"Valid ID\",\n   \
  \         urlPath:  \"/snippet/view/1\",\n            wantCode: http.StatusOK,\n\
  \            wantBody: \"An old silent pond...\",\n        },\n        {\n     \
  \       name:     \"Non-existent ID\",\n            urlPath:  \"/snippet/view/2\"\
  ,\n            wantCode: http.StatusNotFound,\n        },\n        {\n         \
  \   name:     \"Negative ID\",\n            urlPath:  \"/snippet/view/-1\",\n  \
  \          wantCode: http.StatusNotFound,\n        },\n        {\n            name:\
  \     \"Decimal ID\",\n            urlPath:  \"/snippet/view/1.23\",\n         \
  \   wantCode: http.StatusNotFound,\n        },\n        {\n            name:   \
  \  \"String ID\",\n            urlPath:  \"/snippet/view/foo\",\n            wantCode:\
  \ http.StatusNotFound,\n        },\n        {\n            name:     \"Empty ID\"\
  ,\n            urlPath:  \"/snippet/view/\",\n            wantCode: http.StatusNotFound,\n\
  \        },\n    }\n\n    for _, tt := range tests {\n        t.Run(tt.name, func(t\
  \ *testing.T) {\n            code, _, body := ts.get(t, tt.urlPath)\n\n        \
  \    assert.Equal(t, code, tt.wantCode)\n\n            if tt.wantBody != \"\" {\n\
  \                assert.StringContains(t, body, tt.wantBody)\n            }\n  \
  \      })\n    }\n}\n```\n\n当你再次运行测试时，一切都应该通过通过，你将看到一些输出，包括新的 `TestSnippetView`\
  \ 测试，看起来大致如下：\n\n```\n$ go test -v ./cmd/web/\n=== RUN   TestPing\n--- PASS: TestPing\
  \ (0.00s)\n=== RUN   TestSnippetView\n=== RUN   TestSnippetView/Valid_ID\n=== RUN\
  \   TestSnippetView/Non-existent_ID\n=== RUN   TestSnippetView/Negative_ID\n===\
  \ RUN   TestSnippetView/Decimal_ID\n=== RUN   TestSnippetView/String_ID\n=== RUN\
  \   TestSnippetView/Empty_ID\n--- PASS: TestSnippetView (0.01s)\n    --- PASS: TestSnippetView/Valid_ID\
  \ (0.00s)\n    --- PASS: TestSnippetView/Non-existent_ID (0.00s)\n    --- PASS:\
  \ TestSnippetView/Negative_ID (0.00s)\n    --- PASS: TestSnippetView/Decimal_ID\
  \ (0.00s)\n    --- PASS: TestSnippetView/String_ID (0.00s)\n    --- PASS: TestSnippetView/Empty_ID\
  \ (0.00s)\n=== RUN   TestSecureHeaders\n--- PASS: TestSecureHeaders (0.00s)\n===\
  \ RUN   TestHumanDate\n=== RUN   TestHumanDate/UTC\n=== RUN   TestHumanDate/Empty\n\
  === RUN   TestHumanDate/CET\n--- PASS: TestHumanDate (0.00s)\n    --- PASS: TestHumanDate/UTC\
  \ (0.00s)\n    --- PASS: TestHumanDate/Empty (0.00s)\n    --- PASS: TestHumanDate/CET\
  \ (0.00s)\nPASS\nok      snippetbox.alexedwards.net/cmd/web      0.015s\n```\n\n\
  这里有一个新点需要指出：注意看子测试名称是如何被规范化（canonicalized）的？在测试输出中，子测试名称中的任何空格都已替换为下划线（并且任何非打印字符也会被转义）。\n\
  \n第 14.6 节。\n\n## 测试 HTML 表单（forms）\n\n在本节中，我们将为 `POST /user/signup` 路由添加端到端测试，该路由由我们的\
  \ `userSignupPost` 处理器处理。\n\n由于我们的应用程序执行了反 CSRF 检查，测试此路由变得稍微复杂了一些。我们向 `POST /user/signup`\
  \ 发出的任何请求都将收到 `400 Bad Request` 响应，*除非*请求包含有效的 CSRF 令牌和 cookie。为了绕过这一点，我们需要在测试中模拟真实用户的工作流，如下：\n\
  \n1.  发送一个 `GET /user/signup` 请求。这将回返回一个响应，其中响应头中包含 CSRF cookie，响应体中包含注册页面的 CSRF\
  \ 令牌。\n\n2.  从 HTML 响应正体中提取 CSRF 令牌。\n\n3.  发送一个 `POST /user/signup` 请求，使用我们在步骤\
  \ 1 中使用的相同 `http.Client`（这样它就会随 `POST` 请求自动传递 CSRF cookie），并在包含我们要测试的其他 `POST` 数据的同时，包含\
  \ CSRF 令牌。\n\n让我们首先在 `cmd/web/testutils_test.go` 文件中添加一个新的辅助函数，用于从 HTML 响应正体中提取\
  \ CSRF 令牌（如果存在的话）：\n\n文件：`cmd/web/testutils_test.go`\n\n```go\npackage main\n\n\
  import (\n    \"bytes\"\n    \"html\"\n    \"log\"\n    \"net/http\"\n    \"regexp\"\
  \n    \"testing\"\n\n    \"github.com/stretchr/testify/assert\"\n)\n\n// 定义一个正则表达式，从用户注册页面中捕获\
  \ CSRF 令牌值。\nvar csrfTokenRX = regexp.MustCompile(`<input type='hidden' name='csrf_token'\
  \ value='(.+)'>`)\n\nfunc extractCSRFToken(t *testing.T, body string) string {\n\
  \    matches := csrfTokenRX.FindStringmatch(body)\n    if len(matches) < 2 {\n \
  \       t.Fatal(\"no csrf token found in body\")\n    }\n\n    return html.UnescapeString(string(matches[1]))\n\
  }\n```\n\n现在工作已就绪，让我们回到 `cmd/web/handlers.test` 文件并创建一个新的 `TestUserSignup` 测试。首先，我们将执行这个\
  \ `GET /user/signup` 请求，然后提取并打印 CSRF 令牌。如下：\n\n文件：`cmd/web/handlers_test.go`\n\n\
  ```go\npackage main\n\nimport (\n    \"testing\"\n\n    \"github.com/stretchr/testify/assert\"\
  \n)\n\nfunc TestUserSignup(t *testing.T) {\n    // 创建包含模拟依赖的应用程序结构体并    // 设置测试服务器。\n\
  \    app := newTestApplication(t)\n    ts := newTestServer(t, app.routes())\n  \
  \  defer ts.Close()\n\n    // 发送 GET /user/signup 请求，然后从\n    // body 中提取 CSRF 令牌\n\
  \    _, _, body := ts.get(t, \"/user/signup\")\n    csrfToken := extractCSRFToken(t,\
  \ body)\n\n    // 使用 t.Logf 函数在测试输出中记录 CSRF 令牌值。\n    // t.Logf 函数的作用与 fmt.Printf\
  \ 相同，但会将提供的\n    // 消息写入测试输出。\n    t.Logf(\"CSRF token is: %q\", csrfToken)\n}\n\
  ```\n\n重要的是，你必须使用 `-v` 标志（启用详细输出）运行测试，才能看到 `t.Logf()` 函数的输出。\n\n让我们现在尝试：\n\n```\n\
  $ go test -v -run=\"TestUserSignup\" ./cmd/web/\n=== RUN   TestUserSignup\n    handlers_test.go:81:\
  \ CSRF token is: \"C92tcpQpL1n6aIUaF8XAonwy+YjcVnyaAaOvfkdl6vJqoNSbgaTtdBRC61pFMoGP2ojV+sZ1d0SUikah3REQ==\"\
  \n--- PASS: TestUserSignup (0.01s)\nPASS\nok      ./cmd/web      0.010s\n```\n\n\
  看起来运行良好。测试运行正常，并打印出了我们从响应体 HTML 中提取的 CSRF 令牌。\n\n现在回到 `cmd/web/testutils_test.go`\
  \ 文件，为我们的 `testServer` 类型创建一个新的 `postForm()` 方法，我们可以使用它向我们的测试服务器发送 `POST` 请求，并在请求体中包含特定的表单数据。\n\
  \n\n\n\n```go\npackage main\n\nimport (\n    \"bytes\"\n    \"html\"\n    \"io\"\
  \n    \"log\"\n    \"net/http\"\n    \"net/http/cookiejar\"\n    \"net/http/httptest\"\
  \n    \"net/url\" // 新导入\n    \"regexp\"\n    \"testing\"\n    \"time\"\n\n    \"\
  snippetbox.alexedwards.net/internal/models/mocks\"\n\n    \"github.com/alexedwards/scs/v2\"\
  \n    \"github.com/go-playground/form/v4\"\n)\n\n...\n\n// Create a postForm method\
  \ for sending POST requests to the test server. The\n// final parameter to this\
  \ method is a url.Values object which can contain any\n// form data that you want\
  \ to send in the request body.\nfunc (ts *testServer) postForm(t *testing.T, urlPath\
  \ string, form url.Values) (int, http.Header, string) {\n    rs, err := ts.Client().PostForm(ts.URL+urlPath,\
  \ form)\n    if err != nil {\n        t.Fatal(err)\n    }\n\n    // Read the response\
  \ body from the test server.\n    defer rs.Body.Close()\n    body, err := io.ReadAll(rs.Body)\n\
  \    if err != nil {\n        t.Fatal(err)\n    }\n    bytes.TrimSpace(body)\n\n\
  \    // Return the response status, headers and body.\n    return rs.StatusCode,\
  \ rs.Header, string(body)\n}\n```\n\n现在，最后，我们准备好添加一些**表驱动的子测试（table-driven sub-tests）**了，用来测试我们应用程序中\
  \ `POST /user/signup` 路由的行行为。具体来说，我们想要测试：\n\n*   有效的注册会返回 `303 See Other` 响应。\n\n\
  *   不带有效 CSRF 令牌的表单提交会导致返回 `400 Bad Request` 响应。\n\n*   无效的表单提交会导致返回 `422 Unprocessable\
  \ Entity` 响应并重新显示注册表单。这应该发生在以下情况： \n\n    *   姓名、电子邮件或密码字段为空。\n\n    *   邮箱格式不正确。\n\
  \n    *   密码长度小于 8 个字符。\n\n    *   邮箱地址已被占用。\n\n继续更新 `TestUserSignup` 函数来执行这些测试，如下所示：\n\
  \n文件：`cmd/web/handlers_test.go`\n\n```go\npackage main\n\nimport (\n    \"net/http\"\
  \n    \"net/url\" // 新导入\n    \"testing\"\n\n    \"snippetbox.alexedwards.net/internal/assert\"\
  \n)\n\n...\n\nfunc TestUserSignup(t *testing.T) {\n    app := newTestApplication(t)\n\
  \    ts := newTestServer(t, app.routes())\n    defer ts.Close()\n\n    _, _, body\
  \ := ts.get(t, \"/user/signup\")\n    validCSRFToken := extractCSRFToken(t, body)\n\
  \n    const (\n        validName     = \"Bob\"\n        validPassword = \"validPa$$word\"\
  \n        validEmail    = \"bob@example.com\"\n        formTag       = \"<form action='/user/signup'\
  \ method='POST' novalidate>\"\n    )\n\n    tests := []struct {\n        name  \
  \       string\n        userName     string\n        userEmail    string\n     \
  \   userPassword string\n        csrfToken    string\n        wantCode     int\n\
  \        wantFormTag  string\n    }{\n        {\n            name:         \"Valid\
  \ submission\",\n            userName:     validName,\n            userEmail:  \
  \  validEmail,\n            userPassword: validPassword,\n            csrfToken:\
  \    validCSRFToken,\n            wantCode:     http.StatusSeeOther,\n        },\n\
  \        {\n            name:         \"Invalid CSRF Token\",\n            userName:\
  \     validName,\n            userEmail:    validEmail,\n            userPassword:\
  \ validPassword,\n            csrfToken:    \"wrongToken\",\n            wantCode:\
  \     http.StatusBadRequest,\n        },\n        {\n            name:         \"\
  Empty name\",\n            userName:     \"\",\n            userEmail:    validEmail,\n\
  \            userPassword: validPassword,\n            csrfToken:    validCSRFToken,\n\
  \            wantCode:     http.StatusUnprocessableEntity,\n            wantFormTag:\
  \  formTag,\n        },\n        {\n            name:         \"Empty email\",\n\
  \            userName:     validName,\n            userEmail:    \"\",\n       \
  \     userPassword: validPassword,\n            csrfToken:    validCSRFToken,\n\
  \            wantCode:     http.StatusUnprocessableEntity,\n            wantFormTag:\
  \  formTag,\n        },\n        {\n            name:         \"Empty password\"\
  ,\n            userName:     validName,\n            userEmail:    validEmail,\n\
  \            userPassword: \"\",\n            csrfToken:    validCSRFToken,\n  \
  \          wantCode:     http.StatusUnprocessableEntity,\n            wantFormTag:\
  \  formTag,\n        },\n        {\n            name:         \"Invalid email\"\
  ,\n            userName:     validName,\n            userEmail:    \"bob@example.\"\
  ,\n            userPassword: validPassword,\n            csrfToken:    validCSRFToken,\n\
  \            wantCode:     http.StatusUnprocessableEntity,\n            wantFormTag:\
  \  formTag,\n        },\n        {\n            name:         \"Short password\"\
  ,\n            userName:     validName,\n            userEmail:    validEmail,\n\
  \            userPassword: \"pa$$\",\n            csrfToken:    validCSRFToken,\n\
  \            wantCode:     http.StatusUnprocessableEntity,\n            wantFormTag:\
  \  formTag,\n        },\n        {\n            name:         \"Duplicate email\"\
  ,\n            userName:     validName,\n            userEmail:    \"bob@example.com\"\
  ,\n            userPassword: validPassword,\n            csrfToken:    validCSRFToken,\n\
  \            wantCode:     http.StatusUnprocessableEntity,\n            wantFormTag:\
  \  formTag,\n        },\n    }\n\n    for _, tt := range tests {\n        t.Run(tt.name,\
  \ func(t *testing.T) {\n            form := url.Values{}\n            form.Add(\"\
  name\", tt.userName)\n            form.Add(\"email\", tt.userEmail)\n          \
  \  form.Add(\"password\", tt.userPassword)\n            form.Add(\"csrf_token\"\
  , tt.csrfToken)\n\n            code, _, body := ts.postForm(t, \"/user/signup\"\
  , form)\n\n            assert.Equal(t, code, tt.wantCode)\n\n            if tt.wantFormTag\
  \ != \"\" {\n                assert.StringContains(t, body, tt.wantFormTag)\n  \
  \          }\n        })\n    }\n}\n```\n\n如果你运行测试，你应该看到所有子测试都运行并通过了，类似于：\n\n```bash\n\
  $ go test -v -run=\"TestUserSignup\" ./cmd/web\n=== RUN   TestUserSignup\n=== RUN\
  \   TestUserSignup/Valid_submission\n=== RUN   TestUserSignup/Invalid_CSRF_Token\n\
  === RUN   TestUserSignup/Empty_name\n=== RUN   TestUserSignup/Empty_email\n=== RUN\
  \   TestUserSignup/Empty_password\n=== RUN   TestUserSignup/Invalid_email\n=== RUN\
  \   TestUserSignup/Short_password\n=== RUN   TestUserSignup/Duplicate_email\n---\
  \ PASS: TestUserSignup (0.01s)\n    --- PASS: TestUserSignup/Valid_submission (0.00s)\n\
  \    --- PASS: TestUserSignup/Invalid_CSRF_Token (0.00s)\n    --- PASS: TestUserSignup/Empty_name\
  \ (0.00s)\n    --- PASS: TestUserSignup/Empty_email (0.00s)\n    --- PASS: TestUserSignup/Empty_password\
  \ (0.00s)\n    --- PASS: TestUserSignup/Invalid_email (0.00s)\n    --- PASS: TestUserSignup/Short_password\
  \ (0.00s)\n    --- PASS: TestUserSignup/Duplicate_email (0.00s)\nPASS\nok      snippetbox.alexedwards.net/cmd/web\
  \      0.016s\n```\n\n## 14.7 集成测试\n\n运行带有模拟依赖的端到端测试是一件好事，但如果我们还能验证真实的数据库模型是否按预期工作，就能进一步增加对应用程序的信心。\n\
  \n为了做到这一点，我们可以对测试 MySQL 数据库运行集成测试，它模拟了生产数据库，但仅用于测试。\n\n作为一个演示，在本章中我们将设置一个集成测试以确保\
  \ `models.UserModel.Exists()` 方法正常工作。\n\n### 测试数据库的设置与销毁\n\n第一步是创建测试版本的 MySQL 数据库。如果你正在跟着操作，请从终端窗口以\
  \ `root` 用户身份连接 MySQL，并执行以下 SQL 语句创建一个新的 `test_snippetbox` 数据库和 `test_web` 用户：\n\
  \n```sql\nCREATE DATABASE test_snippetbox CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;\n\
  ```\n\n```sql\nCREATE USER 'test_web'@'localhost';\nGRANT CREATE, DROP, ALTER, INDEX,\
  \ SELECT, INSERT, UPDATE, DELETE ON test_snippetbox.* TO 'test_web'@'localhost';\n\
  ALTER USER 'test_web'@'localhost' IDENTIFIED BY 'pass';\n```\n\n完成完成后，让我们制作两个 SQL\
  \ 脚本：\n\n\n\n\n1. 一个初始化脚本，用于创建数据库表（以模拟我们的生产环境数据库）并插入一组已知的测试数据，以便我们在测试中使用它们。\n2.\
  \ 一个卸载脚本，用于删除数据库表和任何数据。\n\n这种思路是我们将在每个集成测试的开始和结束处调用这些脚本，这样测试数据库每次都会完全重置。这有助于确保我们在某次测试中对的任何更改都不会“泄露”并影响另一个测试的结果。\n\
  \n让我们在新的 `internal/models/testdata` 目录创建这些脚本，如下所示：\n\n```bash\n$ mkdir internal/models/testdata\n\
  $ touch internal/models/testdata/setup.sql\n$ touch internal/models/testdata/teardown.sql\n\
  ```\n\n文件: `internal/models/testdata/setup.sql`\n\n```sql\nCREATE TABLE snippets\
  \ (\n    id INTEGER NOT NULL PRIMARY KEY AUTO_INCREMENT,\n    title VARCHAR(100)\
  \ NOT NULL,\n    content TEXT NOT NULL,\n    created DATETIME NOT NULL,\n    expires\
  \ DATETIME NOT NULL\n);\n\nCREATE INDEX idx_snippets_created ON snippets(created);\n\
  \nCREATE TABLE users (\n    id INTEGER NOT NULL PRIMARY KEY AUTO_INCREMENT,\n  \
  \  name VARCHAR(255) NOT NULL,\n    email VARCHAR(255) NOT NULL,\n    hashed_password\
  \ CHAR(60) NOT NULL,\n    created DATETIME NOT NULL\n);\n\nALTER TABLE users ADD\
  \ CONSTRAINT users_uc_email UNIQUE (email);\n\nINSERT INTO users (name, email, hashed_password,\
  \ created) VALUES (\n    'Alice Jones',\n    'alice@example.com',\n    '$2a$12$NuTjWXm3KKntReFwyBVHyuf/to.HEwTy.eS206TNfkGfrHzHzGJSWG',\n\
  \    '2022-01-01 10:00:00'\n);\n```\n\n文件: `internal/models/testdata/teardown.sql`\n\
  \n```sql\nDROP TABLE users;\n\nDROP TABLE snippets;\n```\n\n好了，既然我们已经准备好了脚本，让我们创建一个新文件来存放用于集成测试的一些辅助函数：\n\
  \n```bash\n$ touch internal/models/testutils_test.go\n```\n\n并向其中添加一个 `newTestDB()`\
  \ 辅助函数，该函数将：\n\n* 为测试数据库创建一个新的 `*sql.DB` 连接池；\n* 执行 `setup.sql` 脚本以创建数据库表和虚拟数据；\n\
  * 注册一个“清理”函数，该函数将执行 `teardown.sql` 脚本并关闭连接池。\n\n文件: `internal/models/testutils_test.go`\n\
  \n```go\npackage models\n\nimport (\n    \"database/sql\"\n    \"os\"\n    \"testing\"\
  \n)\n\nfunc newTestDB(t *testing.T) *sql.DB {\n    // 为我们的测试数据库建立一个 sql.DB 连接池。由于我们的\n\
  \    // 初始化和卸载脚本包含了多个 SQL 语句，我们需要\n    // 在 DSN 中使用 \"multiStatements=true\" 参数。这指示\n\
  \    // 我们的 MySQL 驱动驱动支持在一次 db.Exec() 调用中\n    // 执行多个 SQL 语句。\n    db, err := sql.Open(\"\
  mysql\", \"user:pass@tcp(localhost:3306)/snippetbox?parseTime=true&multiStatements=true\"\
  )\n    if err != nil {\n        t.Fatal(err)\n    }\n\n    // 从文件读取初始化脚本并执行。\n \
  \   script, err := os.ReadFile(\"./testdata/setup.sql\")\n    if err != nil {\n\
  \        t.Fatal(err)\n    }\n    _, err = db.Exec(string(script))\n    if err !=\
  \ nil {\n        t.Fatal(err)\n    }\n\n    // 使用 t.Cleanup() 注册一个函数，当当前测试（或子测试）\n\
  \    // 完成时会自动调用。在这个函数中我们读取\n    // 卸载脚本并关闭池。\n    t.Cleanup(func() {\n        script,\
  \ err := os.ReadFile(\"./testdata/teardown.sql\")\n        if err != nil {\n   \
  \         t.Fatal(err)\n        }\n        _, err = db.Exec(string(script))\n  \
  \      if err != nil {\n            t.Fatal(err)\n        }\n\n        db.Close()\n\
  \    })\n\n    // 返回数据库池。\n    return db\n}\n```\n\n### 测试 UserModel 方法\n\n现在准备工作已完成，我们准备好为\
  \ `models.Exists()` 方法编写集成测试。我们知道 `setup.sql` 脚本创建了一个包含用户 ID `1` 和邮箱 `alice@example.com`\
  \ 的 `users` 表。所以我们要测试：\n\n* 调用 `models.Exists(1)` 返回 `true` 值和 `nil` 错误。\n* 使用其他用户\
  \ ID 调用 `models.Exists()` 返回 `false` 值和 `nil` 错误。\n\n让我们首先进入 `internal/assert` 包创建一个\
  \ `NilError()` 断言，用它来检查错误是否为 `nil`。如下：\n\n文件: `internal/assert/assert.go`\n\n```go\n\
  package assert\n\nfunc NilError(t *testing.T, actual error) {\n    t.Helper()\n\n\
  \    if actual != nil {\n        t.Errorf(\"got: %v; expected: nil\", actual)\n\
  \    }\n}\n```\n\n然后遵循 Go 的惯例，为我们的测试创建一个新的 `users_test.go` 文件，直接与测试代码一起：\n\n```bash\n\
  $ touch internal/models/users_test.go\n```\n\n并添加以下代码的 `TestUserModelExists` 测试：\n\
  \n文件: `internal/models/users_test.go`\n\n```go\npackage models\n\nimport (\n   \
  \ \"testing\"\n\n    \"snippetbox.alexedwards.net/internal/assert\"\n)\n\nfunc TestUserModelExists(t\
  \ *testing.T) {\n    // 设置表驱动测试和预期结果。\n    tests := []struct {\n        name   string\n\
  \        userID int\n        want   bool\n    }{\n        {\n            name: \
  \  \"Valid ID\",\n            userID: 1,\n            want:   true,\n        },\n\
  \        {\n            name:   \"Zero ID\",\n            userID: 0,\n         \
  \   want:   false,\n        },\n        {\n            name:   \"Non-existent ID\"\
  ,\n            userID: 2,\n            want:   false,\n        },\n    }\n\n   \
  \ for _, tt := range tests {\n        t.Run(tt.name, func(t *testing.T) {\n    \
  \        // 调用 newTestDB() 辅助函数获取测试数据库的\n            // 连接池。在这里调用（在 t.Run() 内部）意味着\n\
  \            // 每个子测试都会设置和卸载新的数据库表和数据。\n             db := newTestDB(t)\n\n    \
  \        // 创建 UserModel 的新实例。\n            m := UserModel{db}\n\n            //\
  \ 调用 UserModel.Exists() 方法并检查返回\n            // 值和错误是否匹配子测试的预期值。\n            exists,\
  \ err := m.Exists(tt.userID)\n\n            assert.Equal(t, exists, tt.want)\n \
  \           assert.NilError(t, err)\n        })\n    }\n}\n```\n\n如果你运行这个测试，一切都应该无问题地通过。\n\
  \n```bash\n$ go test -v ./internal/models\n=== RUN   TestUserModelExists\n=== RUN\
  \   TestUserModelExists/Valid_ID\n=== RUN   TestUserModelExists/Zero_ID\n=== RUN\
  \   TestUserModelExists/Non-existent_ID\n--- PASS: TestUserModelExists (1.02s)\n\
  \    --- PASS: TestUserModelExists/Valid_ID (0.33s)\n    --- PASS: TestUserModelExists/Zero_ID\
  \ (0.29s)\n    --- PASS: TestUserModelExists/Non-existent_ID (0.40s)\nPASS\nok \
  \     snippetbox.alexedwards.net/internal/models      1.023s\n```\n\n这里测试输出的最后一行值得提到。此测试的总运行时间（在我的情况下是\
  \ 1.023 秒）比我们之前的测试要长得多——之前的所有测试运行只需几毫秒。运行时间的这种大幅增加主要是由于我们在测试期间需要执行大量的数据库操作。\n\n\
  虽然对于单独运行此测试来说，等待 1 秒是一个完全可以的时间，但如果你对你的数据库运行数百个不同的集成测试，你可能经常需要等待几分钟而不是几秒钟让测试完成。\n\
  \n### 跳过耗时测试\n\n当你的测试运行时间很长时，你可能会决定在某些情况下跳过特定的耗时测试。例如，你可能决定只在提交更改才运行集成测试，而不是在开发过程中频繁运行。\n\
  \n跳过耗时测试的一种常见且习惯的方法是使用 `testing.Short()` 函数来检查 `go test` 命令中是否存在 `-short` 标志，如果存在，则调用\
  \ `t.Skip()` 方法跳过该测试。\n\n\n\n\n让我们快速更新 `TestUserModelExists` 测试，以便在*运行测试之前*执行此操作，如下所示：\n\
  \n文件：`internal/models/users_test.go`\n\n```go\npackage models\n\nimport (\n    \"\
  testing\"\n\n    \"snippetbox.alexedwards.net/internal/assert\"\n)\n\nfunc TestUserModelExists(t\
  \ *testing.T) {\n    // 如果运行测试时提供了 \"-short\" 标志，则跳过测试。\n    if testing.Short()\
  \ {\n        t.Skip(\"models: skipping integration test\")\n    }\n\n    ...\n}\n\
  ```\n\n然后尝试在启用 `-short` 标志的情况下运行我们的测试：\n\n```\n$ go test -v -short ./...\n=== RUN\
  \   TestPing\n--- PASS: TestPing (0.00s)\n=== RUN   TestSnippetView\n=== RUN   TestSnippetView/Valid_ID\n\
  === RUN   TestSnippetView/Non-existent_ID\n=== RUN   TestSnippetView/Negative_ID\n\
  === RUN   TestSnippetView/Decimal_ID\n=== RUN   TestSnippetView/String_ID\n=== RUN\
  \   TestSnippetView/Empty_ID\n--- PASS: TestSnippetView (0.01s)\n    --- PASS: TestSnippetView/Valid_ID\
  \ (0.00s)\n    --- PASS: TestSnippetView/Non-existent_ID (0.00s)\n    --- PASS:\
  \ TestSnippetView/Negative_ID (0.00s)\n    --- PASS: TestSnippetView/Decimal_ID\
  \ (0.00s)\n    --- PASS: TestSnippetView/String_ID (0.00s)\n    --- PASS: TestSnippetView/Empty_ID\
  \ (0.00s)\n=== RUN   TestUserSignup\n=== RUN   TestUserSignup/Valid_submission\n\
  === RUN   TestUserSignup/Invalid_CSRF_Token\n=== RUN   TestUserSignup/Empty_name\n\
  === RUN   TestUserSignup/Empty_email\n=== RUN   TestUserSignup/Empty_password\n\
  === RUN   TestUserSignup/Invalid_email\n=== RUN   TestUserSignup/Short_password\n\
  === RUN   TestUserSignup/Long_password\n=== RUN   TestUserSignup/Duplicate_email\n\
  --- PASS: TestUserSignup (0.01s)\n    --- PASS: TestUserSignup/Valid_submission\
  \ (0.00s)\n    --- PASS: TestUserSignup/Invalid_CSRF_Token (0.00s)\n    --- PASS:\
  \ TestUserSignup/Empty_name (0.00s)\n    --- PASS: TestUserSignup/Empty_email (0.00s)\n\
  \    --- PASS: TestUserSignup/Empty_password (0.00s)\n    --- PASS: TestUserSignup/Invalid_email\
  \ (0.00s)\n    --- PASS: TestUserSignup/Short_password (0.00s)\n    --- PASS: TestUserSignup/Long_password\
  \ (0.00s)\n    --- PASS: TestUserSignup/Duplicate_email (0.00s)\n=== RUN   TestSecureHeaders\n\
  --- PASS: TestSecureHeaders (0.00s)\n=== RUN   TestHumanDate\n=== RUN   TestHumanDate/UTC\n\
  === RUN   TestHumanDate/Empty\n=== RUN   TestHumanDate/CET\n--- PASS: TestHumanDate\
  \ (0.00s)\n    --- PASS: TestHumanDate/UTC (0.00s)\n    --- PASS: TestHumanDate/Empty\
  \ (0.00s)\n    --- PASS: TestHumanDate/CET (0.00s)\nPASS\nok      snippetbox.alexedwards.net/cmd/web\
  \      0.023s\n=== RUN   TestUserModelExists\n    users_test.go:10: models: skipping\
  \ integration test\n--- SKIP: TestUserModelExists (0.00s)\nPASS\nok      snippetbox.alexedwards.net/internal/models\
  \      0.003s\n?       snippetbox.alexedwards.net/internal/models/mocks        [no\
  \ test files]\n?       snippetbox.alexedwards.net/internal/validator   [no test\
  \ files]\n?       snippetbox.alexedwards.net/ui   [no test files]\n```\n\n注意上面输出中的\
  \ `SKIP` 注释？这确认了 Go 在本次运行中跳过了我们的 `TestUserModelExists` 测试。\n\n如果你愿意，可以尝试在不带 `-short`\
  \ 标志的情况下再次运行，你应该看到 `TestUserModelExists` 测试像正常一样执行。\n\n## 第 14.8 节。\n\n##  分析测试覆盖率\n\
  \n`go test` 工具的一个非常强大的特性是它为测试覆盖率提供的指标和可视化支持。\n\n尝试使用 `-cover` 标志运行我们项目中的测试，如下所示：\n\
  \n```\n$ go test -cover ./...\nok  \tsnippetbox.alexedwards.net/cmd/web\t0.022s\t\
  coverage: 46.1% of statements\n?   \tsnippetbox.alexedwards.net/internal/assert\t\
  [no test files]\nok  \tsnippetbox.alexedwards.net/internal/models\t1.081s\tcoverage:\
  \ 6.5% of statements\n?   \tsnippetbox.alexedwards.net/internal/models/mocks\t[no\
  \ test files]\n?   \tsnippetbox.alexedwards.net/internal/validator\t[no test files]\n\
  ?   \tsnippetbox.alexedwards.net/ui\t[no test files]\n```\n\n从结果中我们可以看到，`cmd/web`\
  \ 包中的语句有 46.1% 被执行了，而 `internal/models` 包的数字为 6.5%。\n\n我们可以通过 `-coverprofile` 标志获取更详细的覆盖率细分，如下：\n\
  \n```\n$ go test -coverprofile=/tmp/profile.out ./...\n```\n\n这将结果写入特定的位置（`/tmp/profile.out`）。然后你可以使用\
  \ `go cover` 命令来查看它，如下：\n\n```\n$ go cover -func=/tmp/profile.out\n```\n\n另一种更具可视化的查看覆盖文件的方法是使用\
  \ `-html` 标志而不是 `-func`。\n\n```\n$ go tool cover -html=/tmp/profile.out\n```\n\n\
  \n\n\n不再仅仅用绿色和红色高亮语句，使用 `-covermode=count` 可以让覆盖率配置文件记录每条语句在测试期间执行的精确次数。\n\n当在浏览器中查看时，执行频率频繁的语句将显示为更饱和的绿色，如下所示：\n\
  \n![](img/14.08-02.png)\n\n# 第 15 章\n\n## 结语\n\n本书中，我们显式地涵盖了许多主题，包括路由、模板、数据库操作、身份验证/授权、使用\
  \ HTTPS、使用 Go 的测试包等。\n\n但也有一些其他的、更含于无言的教训。我们用于实现功能所采用模式——以及我们项目代码的组织和相互链接的方式——都是你应该能够获取并应用到未来工作中的东西。\n\
  \n重要的是，我还希望这本书能传达这样一个信息：`你不需要框架就可以用 Go 构建 Web 应用`。Go 的标准库包含了你几乎需要的所有工具……即使对于中等复杂的应用程序也是如此。当你确实需要特定任务的帮助（例如会话管理、路由或密码哈希）时，有一些轻量级且专注的第三方包供你选择。\n\
  \n到此为止，如果你一直跟着本书编写代码，我建议你花一点时间回顾一下你目前编写的代码。在回顾过程中，确保你清楚每个代码库中每个部分的作用，以及它们是如何与整个项目相契合的。\n\
  \n你可能还想回到书中任何初次觉得难以理解的部分。例如，现在你对 Go 更加熟悉了，`http.Handler` 接口 章节可能会更容易消化。或者，现在你已经看到了我们的应用程序中是如何处理测试的，那么我们在设计数据库模型\
  \ 章节中做的决策可能就会迎刃合。\n\n如果你购买了这本书的专业版（`Professional Package`），我强烈建议完成第 17 章中的引导练习（就在本书的末尾，在本结论和附录之后）。这些练习应该帮助你巩固所学知识——通过半独立地完成它们，将在你再次在自己的项目中使用它们之前，对书中的模式和技术进行一些额外的练习。\n\
