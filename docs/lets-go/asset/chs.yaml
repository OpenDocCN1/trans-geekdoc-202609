- "# 出发吧\n\n\n\n\n# 前言\n\n![cover.png](img/cover.png)\n\n《Let's Go》将教你如何使用出色的编程语言\
  \ [Go](https://golang.org/) 构建快速、安全且易于维护的 Web 应用。\n\n本书的核心理念是帮助你*在做中学习*。我们将共同完成一个\
  \ Web 应用从零到端的构建——从组织工作空间，到会话管理、用户认证、服务器安全以及测试你的应用程序。\n\n通过这种方式构建完整的 Web 应用有许多优势。它能帮助你将所学的知识融入具体的场景中，展示代码库中不同部分是如何相互关联的，并迫使我们处理现实生活中编写软件时遇到的边缘情况和困难。从本质上说，你学到的东西比仅仅阅读\
  \ Go 的（优秀的）文档或独立的博客文章多得多。\n\n读完本书后，你将具备理解并使用 `Go` 构建自己的生产环境就 Web 应用的能力和信心。\n\n虽然你可以从头到尾阅读这本书，但它的设计专门是为了让你亲手跟随项目构建。\n\
  \n打开你的文本编辑器，祝你编程愉快！\n\n— Alex\n\n\n\n\n\n\n\n# 引言\n\n在本书中，我们将构建一个名为 `Snippetbox`\
  \ 的网络应用程序，它允许用户粘贴和分享文本片段——类似于 [Pastebin](https://pastebin.com/) 或 GitHub 的 [Gists](https://gist.github.com/)。在完成后，它看起来大概像这样：\n\
  \n\n我们的应用程序将从非常简单开始，只有一个网页。随着每个章节的进行，我们将逐步构建它，直到用户能够通过应用保存和查看片段。这将带我们学习许多主题，例如如何结构化项目、路由请求、操作数据库、处理表单以及安全地显示动态数据。\n\
  \n在书的后后部分，我们将添加用户账户，并限制应用程序，使得只有注册用户才能创建片段。这将带我们学习更高级的主题，如配置 `HTTPS` 服务器、会话管理、用户认证和\
  \ `middleware`。\n\n### 约定\n\n在本书中，代码块将以如下所示的银背景显示。如果代码特别长，无关部分可能会被省略号 `...` 替换。为了方便跟随，大多数代码块顶部都有一个标题栏，指示我们正在处理的文件名。\n\
  \n文件：`hello.go`\n\n```\npackage main\n\n... // 表示省略了某些现有代码。\n\nfunc sayHello() {\n\
  \    fmt.Println(\"Hello world!\")\n}\n```\n\n终端（命令行）指令将以黑色背景显示，并以美元符号 `$` 开头。这些命令可以在任何基于\
  \ Unix 的操作系统上运行，包括 Mac OSX 和 Linux。示例输出显示在命令下方的银区域，如下：\n\n```\n$ echo \"Hello world!\"\
  \nHello world!\n```\n\n如果你正在使用 Windows，应该将命令替换为相应的 DOS 命令，或者通过正常的 Windows GUI 界面该操作。\n\
  \n本书中的某些章节以*额外信息*部分结束。这些章节包含了与我们的应用程序构建不相关的信息，但对于了解它们仍然很重要（或者有时仅仅是有趣）。如果你是 Go 的初学者，可能想跳过这些部分，稍后再回来。\n\
  \n### 关于作者\n\n嘿，我是 Alex Edwards，一名全栈 Web 开发者兼作家。我住在奥地利的因斯布鲁克附近。\n\n我已经使用 Go 语言超过\
  \ 8 年，为自己和商业客户构建生产环境应用程序，并帮助世界各地的人提高 Go 技能。\n\n你可以在 [我的博客](https://www.alexedwards.net/blog/)（我在那里发布详细的教程）上看到我的更多文章，GitHub](https://github.com/alexedwards/)\
  \ 上的一些开源作品，你也可以在 [Instagram](https://www.instagram.com/) 上关注我。\n\n\n*本书中的信息仅供总体参考。尽管作者和出版者已尽一切确保书中所包含信息的准确性和完整性，但对于信息的准确性、可靠性、适用性或完整性，不作任何形式的明示或暗示的保证。*\n\
  \n# 1. 前提条件\n\n### 背景知识\n\n本书假设你对 [Go](https://tour.golang.org/welcome/) 有基础了解。如果你是\
  \ Go 的初学者，我建议你先学习 [Tour of Go](https://tour.golang.org/welcome/)。\n\n### Go 1.18\n\
  \n本书为 Go 1.18 设计。如果你已经安装了 Go，可以通过终端运行 `go version` 来检查版本。输出应该类似于：\n\n```\n$ go version\n\
  go1.18\n```\n\n### 其他软件\n\n如果你想跟随学习，应该确保电脑上安装了其他几个软件。它们是：\n\n- [`curl`](https://curl.haxx.se/)\
  \ 用于处理 HTTP 请求和响应。在 MacOS 和 Linux 上，它应该是预装的或可以在你的软件仓库中找到。否则，你可以从[此处](https://curl.haxx.se/download.html)\
  \ 下载最新版本。\n- 具有良好开发者工具的浏览器。我在本书中将使用 [Firefox](https://www.mozilla.org/en-US/firefox/new/)，但\
  \ Chromium、Chrome 或 Microsoft Edge 也可以。\n- 你喜欢的文本编辑器\n\n# 基础知识\n\n好了，让我们开始吧！在本书的第一部分中，我们将为项目奠定基础，并解释在后续应用程序构建过程中需要了解的主要原理。\n\
  \n你将学习如何：\n\n- 设置项目目录以符合 Go 的惯例。\n- 启动 Web 服务器并监听传入的 HTTP 请求。\n- 路由请求，根据请求路径将请求路由到不同的处理程序。\n\
  - 向用户发送不同的 HTTP 响应、头部和状态码。\n- 从 URL 查询字符串参数中获取并验证不可信的用户输入。\n- 结构化你的项目，以合理且可扩展的方式。\n\
  - 渲染 HTML 页面并使用模板继承使你的标记语言没有重复的样板代码。\n- 从你的应用程序提供静态文件，如图像、CSS 和 JavaScript。\n\n\n\
  \n\n\n在我们编写任何代码之前，你需要在计算机上创建一个名为 `snippetbox` 的目录，作为该项目的顶层“家”目录。我们在整本书中编写的所有 Go\
  \ 代码都将存储在这里，同时还有 HTML 模板和 CSS 文件等其他项目特定的资源。\n\n所以，如果你正在跟着这些教程操作，请打开终端并在你计算机的任何位置创建一个名为\
  \ `snippetbox` 的新项目目录。我将我的项目目录定位在 `$HOME/code` 下，但如果你愿意，也可以选择其他位置。\n\n```\n$ mkdir\
  \ -p $HOME/code/snippetbox\n```\n\n### 创建模块\n\n接下来你需要做的事情为你的项目选择一个模块路径。\n\n如果你还不熟悉\
  \ [Go modules](https://github.com/golang/go/wiki/Modules)，你可以将模块路径基本上看作是项目的规范名称或\
  \ `identifier`（标识符）。\n\n你可以选择[几乎任何字符串](https://golang.org/ref/mod#go-mod-file-ident)作为你的模块路径，但关注的重点是\
  \ `uniqueness`（唯一性）。为了避免未来与其他项目或标准库发生潜在的导入冲突，你需要选择一个全局唯一且不太可能被其他任何东西使用的模块路径。在 Go\
  \ 社区中，常见的约定是基于你拥有的 URL 来创建模块路径。\n\n在我的情况下，这个项目的一个清晰、简洁且`unlikely-to-be-used-by-anything-else`（不太可能被其他东西使用）的模块路径是\
  \ `snippetbox.alexedwards.net`，我将在书中中使用它。如果可能，你应该将其替换为你唯一的路径。\n\n现在我们确定了唯一的模块路径，下一步需要做是将项目目录转换为一个模块。\n\
  \n确保你处于目录根目录下，然后运行 `go mod init` 命令 —— 将你的模块路径作为参数传入，如下：\n\n```\n$ cd $HOME/code/snippetbox\n\
  $ go mod init snippetbox.alexedwards.net\ngo: creating new go.mod: module snippetbox.alexedwards.net\n\
  ```\n\n此时，你的项目目录看起来应该像下面的截图一样。注意已经创建的 `go.mod` 文件了吗？\n\n\n目前该文件中还没有什么内容，如果你在文本编辑器中打开它，它看起来应该是这样的（但最好是使用你自己的唯一模块路径）：\n\
  \nFile: `go.mod`\n\n```\nmodule snippetbox.alexedwards.net\n\ngo 1.18\n```\n\n我们稍会在书中后面详细讨论模块，但目前只需要知道，当你的项目目录根目录下存在一个有效的\
  \ `go.mod` 文件时，你的项目`就是一个一个模块`。将项目设置为模块有许多优势 —— 包括更方便地管理第三方依赖、[避免供应链攻击](https://go.dev/blog/supply-chain)，并确保未来对应用程序进行可复现的构建。\n\
  \n### 你好世界！\n\n在继续之前，让我们快速检查一切是否都设置正确。在你的项目目录中创建一个新的 `main.go`，并包含以下代码：\n\n```\n\
  $ touch main.go\n```\n\nFile: `main.go`\n\n```\npackage main\n\nimport \"fmt\"\n\
  \nfunc main() {\n    fmt.Println(\"Hello world!\")\n}\n```\n\n保存此文件，然后在终端中使用 `go\
  \ run .` 命令编译并执行当前目录下的代码。如果一切顺利，你将看到以下输出：\n\n```\n$ go run .\nHello world!\n```\n\
  \n* * *\n\n### 附加信息\n\n#### 可下载包的模块路径\n\n如果你正在创建一个可以被他人或其他程序下载并使用的项目，那么让你的模块路径等于代码可以下载的位置是一个良好的做法。\n\
  \n例如，如果你的包托管在 `https://github.com/foo/bar` 上，那么项目的模块路径应该是 `github.com/foo/bar`。\n\
  \n第 2.2 节。\n\n## Web 应用基础\n\n现在一切都已准备就，让我们制作 Web 应用程序的第一次迭代。我们将从三个绝对核心要素开始：\n\n\
  *   我们需要的第一个要素是处理器（handler）。如果你有 MVC 背景，可以将处理器看作是类似于控制器（controllers）。它们负责执行应用程序逻辑，并写入\
  \ HTTP 响应头和响应体。\n*   第二个组件是路由器（router，在 Go 术语中称为 `servemux`）。它存储了应用程序的 URL 模式与对应处理器之间的映射。通常情况下，你的应用程序会有一个包含所有路由的\
  \ `servemux`。\n*   最后我们需要的是一个 Web 服务器。Go 的伟大之处之一是，你可以`作为应用程序本身的一部分`建立 Web 服务器并监听传入的请求。你不需要像\
  \ Nginx 或 Apache 这样的外部第三方服务器。\n\n让我们在 `main.go` 文件中将这些组件组合起来，创建一个运行的应用程序。\n\nFile:\
  \ `main.go`\n\n```\npackage main\n\nimport (\n    \"log\"\n    \"net/http\"\n)\n\
  \n// 定义一个首页处理器函数，写入一个包含\n// \"Hello from Snippetbox\" 的字节片作为响应体。\nfunc home(w http.ResponseWriter,\
  \ r *http.Request) {\n    w.Write([]byte(\"Hello from Snippetbox\"))\n}\n\nfunc\
  \ main() {\n    // 使用 http.NewServeMux 函数初始化一个新的 mux，\n    // 然后为 \"/\" 模式注册 home\
  \ 函数。\n    mux := http.NewServeMux()\n    mux.HandleFunc(\"/\", home)\n\n    //\
  \ 使用 http.ListenAndServe()启动 Web 服务器。\n    // 我们传入两个参数：监听的 TCP 地址（在此例中为 \":4000\"\
  ）\n    // 以及我们创建的 mux。如果 ListenAndServe 返回错误，\n    // 我们使用 log.Fatal 函数记录错误并退出。\n\
  \    log.Println(\"Starting server on :4000\")\n    err := http.ListenAndServe(\"\
  :4000\", mux)\n    log.Fatal(err)\n}\n```\n\n当你运行这段代码时，它应该启动一个监听本地机器 4000 端口的 Web\
  \ 服务器。每当服务器收到新的 HTTP 请求时，它会将请求传递给 mux —— 然后 mux 会检查 URL 路径并分发。\n\n让我们尝试一下。保存 `main.go`\
  \ 文件，然后在终端中使用 `go run` 命令运行它。\n\n```\n$ cd $HOME/code/snippetbox\n$ go run .\n2022/01/29\
  \ 11:13:26 Starting server on :4000\n```\n\n服务器运行时，打开浏览器并尝试访问 [`localhost:4000`](http://localhost:4000/)。如果一切顺利，你应该看到一个类似这样的页面：\n\
  \n\n如果你回到终端窗口，可以通过键盘上的 `Ctrl+c` 停止服务器。\n\n* * *\n\n### 附加信息\n\n#### 网络地址\n\n传递给\
  \ `http.ListenAndServe()` 的 TCP 网络地址应该是 `\"主机:端口\"` 格式。如果你省略了主机（如我们使用的 `\":4000\"\
  `），则服务器将在你计算机的所有网络接口上监听。通常情况下，只有当你的计算机有多个网络接口且只想监听其中一个时，才需要在地址中指定主机。\n\n在其他 Go 项目或文档中，你有时会看到网络地址使用命名端口（如\
  \ `\":http\"` 或 `\":http-alt\"`）而不是数字。如果你使用命名端口，Go 在启动服务器时会尝试从 `/etc/services` 文件中查找相关的端口号，如果找不到匹配项则将返回错误。\n\
  \n\n\n\n\n它接受以空格分隔的 `.go` 文件列表、特定包的路径（其中 `.` 字符表示当前目录），或完整的模块路径。对于我们目前的应用程序，以下三个命令是完全等效的：\n\
  \n```\n$ go run .\n$ go run main.go\n$ go run snippetbox.alexedwards.net\n```\n\n\
  # 第 2.3 节\n\n## 路由请求\n\n只有一个路由的 Web 应用程序并不有趣……或者说没用！让我们再添加几个路由，让应用程序开始呈现如下结构：\n\n\
  | URL 模式 | 处理器 | 操作 |\n| --- | --- | --- |\n| / | home | 显示首页 |\n| /snippet/view\
  \ | snippetView | 显示特定的代码片段 |\n| /snippet/create | snippetCreate | 创建代码片段 |\n\n\
  重新打开 `main.go` 文件并按如下方式更新：\n\n文件：`main.go`\n\n```go\npackage main\n\nimport (\n\
  \    \"log\"\n    \"net/http\"\n)\n\nfunc home(w http.ResponseWriter, r *http.Request)\
  \ {\n    w.Write([]byte(\"Hello from Snippetbox\"))\n}\n\n// 添加一个 snippetView 处理器函数。\n\
  func snippetView(w http.ResponseWriter, r *http.Request) {\n    w.Write([]byte(\"\
  Display a specific snippet...\"))\n}\n\n// 添加一个 snippetCreate 处理器函数。\nfunc snippetCreate(w\
  \ http.ResponseWriter, r *http.Request) {\n    w.Write([]byte(\"Create a new snippet...\"\
  ))\n}\n\nfunc main() {\n    // 以之前完全相同的方式，将两个新的处理器函数和对应的\n    // URL 模式注册到 servemux\
  \ 中。\n    mux := http.NewServeMux()\n    mux.HandleFunc(\"/\", home)\n    mux.HandleFunc(\"\
  /snippet/view\", snippetView)\n    mux.HandleFunc(\"/snippet/create\", snippetCreate)\n\
  \n    log.Println(\"Starting server on :4000\")\n    err := http.ListenAndServe(\"\
  :4000\", mux)\n    log.Fatal(err)\n}\n```\n\n确保这些更改已保存，然后重启 Web 应用程序：\n\n```\n$\
  \ cd $HOME/code/snippetbox\n$ go run .\n2022/01/29 11:16:43 Starting server on :4000\n\
  ```\n\n如果你在 浏览器中访问以下链接，现在应该可以获得每个路由的相应响应：\n\n* [`http://localhost:4000/snippet/view`](http://localhost:4000/snippet/view)\n\
  \n\n* [`http://localhost:4000/snippet/create`](http://localhost:4000/snippet/create)\n\
  \n![](img/02.03-02.png)\n\n### 固定路径和子树模式\n\n现在两个新路由已经运行了，让我们来聊聊理论。\n\nGo 的 `servemux`\
  \ 支持两种不同类型的 URL 模式：`固定路径 (fixed paths)` 和`子树路径 (subtree paths)`。固定路径`不`以斜杠结尾，而子树路径`会`以斜杠结尾。\n\
  \n我们的两个新模式—— `\"/snippet/view\"` 和 `\"/snippet/create\"` 都是固定路径的示例。在 Go 的 `servemux`\
  \ 中，这类固定路径模式只有在请求的 URL 路径`精确`匹配固定路径时才会被匹配（并调用相应的处理器）。\n\n相比之下，我们的模式 `\"/\"` 是子树路径的示例（因为它以斜杠结尾）。另一个例子是类似于\
  \ `\"/static/\"` 的内容。只要请求 URL 路径的`开头`匹配子树路径，子树路径模式就会被匹配（并调用相应的处理器）。如果有助于理解，你可以将子树路径看作是在末尾有一个通配符，比如\
  \ `\"/**\"` 或 `\"/static/**\"`。\n\n这解释了为什么 `\"/\"` 模式表现得像是一个通配捕器。该模式本质上意味着`匹配单个斜杠，后面跟跟任何内容（或什么都没有）`。\n\
  \n### 限制根 URL 模式\n\n那么，如果你不想让 `\"/\"` 模式充当通配捕器怎么办？\n\n例如，在我们构建的应用程序中，我们希望当且仅当请求的\
  \ URL 路径精确匹配 `\"/\"` 时才显示首页。否则，我们想要返回 `404 not found` 响应。\n\n我们可以通过检查 `home` 处理器中的\
  \ `r.URL.Path` 来实现这一点：\n\n文件：`main.go`\n\n```go\npackage main\n\nimport (\n    \"\
  log\"\n    \"net/http\"\n)\n\nfunc home(w http.ResponseWriter, r *http.Request)\
  \ {\n    if r.URL.Path != \"/\" {\n        http.NotFound(w, r)\n        return\n\
  \    }\n    w.Write([]byte(\"Hello from Snippetbox\"))\n}\n\n// 添加一个 snippetView\
  \ 处理器函数。\nfunc snippetView(w http.ResponseWriter, r *http.Request) {\n    w.Write([]byte(\"\
  Display a specific snippet...\"))\n}\n\n// 添加一个 snippetCreate 处理器函数。\nfunc snippetCreate(w\
  \ http.ResponseWriter, r *http.Request) {\n    w.Write([]byte(\"Create a new snippet...\"\
  ))\n}\n\nfunc main() {\n    // 以之前完全相同的方式，将两个新的处理器函数和对应的\n    // URL 模式注册到 servemux\
  \ 中。\n    mux := http.NewServeMux()\n    mux.HandleFunc(\"/\", home)\n    mux.HandleFunc(\"\
  /snippet/view\", snippetView)\n    mux.HandleFunc(\"/snippet/create\", snippetCreate)\n\
  \n    log.Println(\"Starting server on :4000\")\n    err := http.ListenAndServe(\"\
  :4000\", mux)\n    log.Fatal(err)\n}\n```\n\n### 其他信息\n\n#### Servemux 的特性与细节\n\n\
  *   在 Go 的 `servemux` 中，较长的 URL 模式优于较短的模式。因此，如果 `servemux` 包含多个匹配的模式，它始终会将请求分发到最长模式对应的处理器。这样做的好处是你可以以任何顺序注册模式`而不会改变\
  \ servemux 的行为`。\n\n*   请求 URL 路径会自动清理。如果请求路径包含任何 `.` 或 `..` 元素或重复的斜杠，用户将自动重定向到等效的清理\
  \ URL。例如，如果用户访问 `/foo/bar/..//baz`，他们将被自动重定向 301 到 `/foo/baz。\n\n*   如果注册了一个子树路径并收到了该子树路径的`没有`结尾斜杠的请求，用户将自动被重定向\
  \ 301 到带有斜杠的子树路径。例如，如果你注册了子树路径 `/foo/`，则对 `/foo` 的任何请求将重定向到 `/foo/`。\n\n#### 主机名匹配\n\
  \n在 URL 模式中包含主机名是可能的。当在你想要将所有 HTTP 请求重定向到规范 URL，或者当你的应用程序作为多个网站或服务的后端时，这会非常有用。例如：\n\
  \n```go\nmux := http.NewServeMux()\nmux.HandleFunc(\"foo.example.org/\", fooHandler)\n\
  mux.HandleFunc(\"bar.example.org/\", barHandler)\nmux.HandleFunc(\"/baz\", bazHandler)\n\
  ```\n\n\n\n\n\n当涉及到模式匹配时，首先会检查任何特定于主机的模式，如果匹配，则会将请求派发给相应的处理器。只有在没有找到特定于主机的匹配时，才会检查非主机特定的定的模式。\n\
  \n## RESTful 路由又是怎样的？\n\n必须承认的是，Go 的 `servemux` 提供的路由功能相当轻量级。它不支持基于请求方法的路由，不支持包含变量的整洁版\
  \ URL，也不支持基于正则表达式的模式。如果你有使用 Rails、Django 或 Laravel 等框架的背景，你可能会发现这有些局限性……而且令你惊讶！\n\
  \n但不要让这让你望而却步。事实是，Go 的 `servemux` 仍然可以带你走得很远，并且对于许多应用程序来说是完全足够的。每当你需要更多功能时，有大量的第三方路由器可以用来替代\
  \ Go 的 `servemux`。我们将在书的后后部分介绍一些流行的选项。\n\n## 第 2.4 节。\n\n## 自定义 HTTP 请求头\n\n现在让我们更新应用程序，使得\
  \ `/snippet/create` 路由仅响应使用 `POST` 方法的 HTTP 请求，如下所示：\n\n| 方法 || 模式 || 处理器 || 操作\
  \ |\n| --- | --- | --- | --- |\n| ANY || / || home || 显示首页 |\n| ANY || /snippet/view\
  \ || snippetView || 显示特定片段 |\n| POST || /snippet/create || snippetCreate || 创建新片段\
  \ |\n\n进行此更改是重要的，因为——在我们稍后的应用程序构建中——对 `/snippet/create` 路由的请求将导致在数据库中创建一个新片段。在数据库中创建新片段是一个非幂等的操作，它会改变我们服务器的状态，因此我们应该遵循\
  \ [HTTP 良好实践](https://en.wikipedia.org/wiki/Hypertext_Transfer_Protocol#Request_methods)，并将此路由限制为仅对\
  \ `POST` 请求。\n\n但我现在想涵盖这一点的主要原因是，这是一个很好的借口，可以让我们讨论 HTTP 响应并解释如何自定义它们。\n\n### HTTP\
  \ 状态码\n\n让我们从更新我们的 `snippetCreate` 处理器开始，除非请求方法为 `POST`，否则它将发送 `405`（方法不允许）HTTP\
  \ 状态码。为了做到这一点，我们需要像所示使用 `w.WriteHeader()` 方法：\n\n文件：main.go\n\n```\npackage main\n\
  \n...\n\nfunc snippetCreate(w http.ResponseWriter, r *http.Request) {\n    // 使用\
  \ r.Method 检查请求是否在使用 POST。\n    if r.Method != \"POST\" {\n        // 如果不是，使用 w.WriteHeader()\
  \ 方法发送 405 状态\n        // 码并使用 w.Write() 方法写入 \"Method Not Allowed\"\n        //\
  \ 响应体。我们然后从函数返回，以便\n        // 后续代码不执行。\n        w.WriteHeader(405)\n        w.Write([]byte(\"\
  Method Not Allowed\"))\n        return\n    }\n\n    w.Write([]byte(\"Create a new\
  \ snippet\"))\n}\n\n...\n```\n\n尽管这个更改看起来很直接，但有几个我应该解释的细微差别：\n\n- 每个响应只能调用一次 `w.WriteHeader()`，并且在状态码写入之后就无法更改了。如果你尝试第二次调用\
  \ `w.WriteHeader()`，Go 将记录一个警告。\n- 如果你不显式地调用 `w.WriteHeader()`，那么第一次调用 `w.Write()`\
  \ 将自动向用户发送 `200 OK` 状态码。因此，如果你想发送非 200 的状态码，你必须在任何调用 `w.Write()` 之前调用 `w.WriteHeader()`。\n\
  \n让我们来看实际操作。重启服务器，然后打开第二个终端并使用 `curl` 向 `http://localhost:4000/snippet/create` 发送\
  \ `POST` 请求。你应该会得到一个带有 `200 OK` 状态码的 HTTP 响应，类似于：\n\n```\n$ curl -i -X POST http://localhost:4000/snippet/create\n\
  HTTP/1.1 200 OK\nDate: Sat, 29 Jan 2022 10:27:14 GMT\nContent-Length: 23\nContent-Type:\
  \ text/plain; charset=utf-8\n\nCreate a new snippet...\n```\n\n但如果你使用不同的请求方法——比如\
  \ `GET`、`PUT` 或 `DELETE`——你现在应该得到带有 `405 Method Not Allowed` 状态码的响应。例如：\n\n```\n\
  $ curl -i -X PUT http://localhost:4000/snippet/create\nHTTP/1.1 405 Method Not Allowed\n\
  Date: Sat, 29 Jan 2022 10:27:55 GMT\nContent-Length: 18\nContent-Type: text/plain;\
  \ charset=utf-8\n\nMethod Not Allowed\n```\n\n### 自定义请求头\n\n我们可以做的另一个改进是在 `405 Method\
  \ Not Allowed` 响应中包含一个 `Allow` 请求头，让用户知道特定 URL 支持哪些请求方法。\n\n我们可以通过使用 `w.Header().Set()`\
  \ 方法向响应头映射中添加新的请求头，如下：\n\n文件：main.go\n\n```\npackage main\n\n...\n\nfunc snippetCreate(w\
  \ http.ResponseWriter, r *http.Request) {\n    if r.Method != \"POST\" {\n     \
  \   // 使用 Header().Set() 方法向响应头映射中添加新的请求头，\n        // 如下所示：\n        w.Header().Set(\"\
  Allow\", \"POST\")\n        w.WriteHeader(405)\n        w.Write([]byte(\"Method\
  \ Not Allowed\"))\n        return\n    }\n\n    w.Write([]byte(\"Create a new snippet\"\
  ))\n}\n\n...\n```\n\n让我们再次实际操作看看。通过发送非 POST 请求到我们的 `snippet/create`  URL：\n\n```\n\
  $ curl -i -X PUT http://localhost:4000/snippet/create\nHTTP/1.1 405 Method Not Allowed\n\
  Allow: POST\nDate: Sat, 29 Jan 2022 10:29:12 GMT\nContent-Length: 18\nContent-Type:\
  \ text/plain; charset=utf-8\n\nMethod Not Allowed\n```\n\n注意响应现在包含了我们的 `Allow: POST`\
  \ 请求头？\n\n### http.Error 快捷方式\n\n如果你想发送非 200 状态码和纯文本响应体（如我们在上面的代码所示），那么是一个很好的机会使用\
  \ [`http.Error`](https://pkg.go.dev/net/http#Error）快捷函数。这是一个轻量级辅助函数，接收一个消息和一个状态码，然后在背后为我们调用\
  \ `w.WriteHeader()` 和 `w.Write()` 方法。\n\n让我们更新代码来使用它。\n\n文件：main.go\n\n```\npackage\
  \ main\n\n...\n\nfunc snippetCreate(w http.ResponseWriter, r *http.Request) {\n\
  \    if r.Method != \"POST\" {\n        w.Header().Set(\"Allow\", \"POST\")\n  \
  \      // 使用 http.Error() 函数发送 405 状态码和\n        // \"Method Not Allowed\" 字符串响应体。\n\
  \        http.Error(w, \"Method Not Allowed\", 405)\n        return\n    }\n\n \
  \   w.Write([]byte(\"Create a new snippet\"))\n}\n\n...\n```\n\n在功能方面这几乎相同。最大的区别在于我们现在将\
  \ `http.ResponseWriter` 传递给另一个函数，由它为用户发送响应。\n\n将 `http.ResponseWriter` 传递给其他函数的模式在\
  \ Go 中非常常见，我们在整本书中都会这样做。在实践中，像我们目前所做的直接使用 `w.Write()` 和 `w.WriteHeader()` 方法是非常稀少的。但我想提前介绍它们，因为它们是更高级（且有趣！）响应方式的基础。\n\
  \n### net/http 常量\n\n我们可以做的最后一个调整是使用 `net/http` 包中的常量处理 HTTP 方法和状态码，而不是自己编写字符串和整数。\n\
  \n具体来说，我们可以使用常量 `http.MethodPost` 代替字符串 `\"POST\"`，使用常量 `http.StatusMethodNotAllowed`\
  \ 代替整数 `405`。如下所示：\n\n文件：main.go\n\n```\npackage main\n\n...\n\nfunc snippetCreate(w\
  \ http.ResponseWriter, r *http.Request) {\n    if r.Method != http.MethodPost {\n\
  \        w.Header().Set(\"Allow\", http.MethodPost)\n        http.Error(w, \"Method\
  \ Not Allowed\", http.StatusMethodNotAllowed)\n        return\n    }\n\n    w.Write([]byte(\"\
  Create a new snippet\"))\n}\n\n...\n```\n\n\n\n\n使用这些常量是一个良好的习惯，因为它们有助于防止因拼写错误导致的运行时错误，而在\
  \ HTTP 状态码常量的情况下，它们还能帮助你的代码更加清晰并具有自文档性 —— 特别是在处理不常用的状态码时。\n\n### 额外信息\n\n#### 系统生成的头部信息和内容嗅探\n\
  \n在发送响应时，Go 会为你自动设置三个系统生成的头部：`Date`、`Content-Length` 和 `Content-Type`。\n\n`Content-Type`\
  \ 头部特别有意思。Go 会尝试通过使用 [`http.DetectContentType()`](https://pkg.go.dev/net/http/#DetectContentType)\
  \ 函数对响应体进行内容嗅探，从而为你设置正确的头部。如果该函数无法猜测内容类型，Go 将退而求其次设置 `Content-Type: application/octet-stream`。\n\
  \n`http.DetectContentType()` 函数通常工作得很好，但对于初 Go Go 开发者来说，一个常见的陷阱是它可以无法区分 JSON 和纯文本。因此，默认情况下，JSON\
  \ 响应将带有 `Content-Type: text/plain; charset=utf-8` 头部发送。你可以通过像这样手动设置正确的头部来防止这种情况发生：\n\
  \n```\nw.Header().Set(\"Content-Type\", \"application/json\")\nw.Write([]byte(`{\"\
  name\":\"Alex\"}`))\n```\n\n#### 操作头部 map\n\n在上面的代码中，我们使用 `w.Header().Set()` 向响应头部\
  \ map 添加了新头部。但还有 `Add()`、`Del()`、`Get()` 和 `Values()` 方法也可以可以使用它们来读取和操作头部 map。\n\
  \n```\n// 设置一个新的 cache-control 头部。如果已存在 \"Cache-Control\" 头部\n// 它将被覆盖。\nw.Header().Set(\"\
  Cache-Control\", \"public, max-age=31536000\")\n\n// 与此相反，Add() 方法会追加一个新的 \"Cache-Control\"\
  \ 头部并且\n// 可以多次调用。\nw.Header().Add(\"Cache-Control\", \"public\")\nw.Header().Add(\"\
  Cache-Control\", \"max-age=31536000\")\n\n// 删除 \"Cache-Control\" 头部的所有值。\nw.Header().Del(\"\
  Cache-Control\")\n\n// 获取 \"Cache-Control\" 头部的第一个值。\nw.Header().Get(\"Cache-Control\"\
  )\n\n// 获取 \"Cache-Control\" 头部所有值的切片。\nw.Header().Values(\"Cache-Control\")\n```\n\
  \n#### 头部规范化\n\n当你在头部 map 上使用 `Set()`、`Add()`、`Del()`、`Get()` 和 `Values()` 方法时，头部名称始终会使用\
  \ [`textproto.CanonicalMIMEHeaderKey()`](https://pkg.go.dev/net/textproto/#CanonicalMIMEHeaderKey)\
  \ 函数进行规范化。这会将首字母以及连字符后的任何字母转换为大写，并将其余字母转换为小写。这在实际中的意义是，当调用这些方法时，头部名称是*不区分大小写*的。\n\
  \n如果你避免这种规范化行为，可以直接编辑底层的头部 map（它的类型是 `map[string][]string`）。例如：\n\n```\nw.Header()[\"\
  X-XSS-Protection\"] = []string{\"1; mode=block\"}\n```\n\n#### 抑制系统生成的头部\n\n`Del()`\
  \ 方法不会移除系统生成的头部。要抑制这些头部，你需要访问底层 map 并将值设置为 `nil`。如果你想抑制 `Date` 头部，你需要写入：\n\n```\n\
  w.Header()[\"Date\"] = nil\n```\n\n#### 章节 2.5. URL 字符串\n\n既然谈到了路由，让我们更新一下 `snippetView`\
  \ 处理器，使其能够接收来自用户的 `id` 查询字符串，如下：\n\n| 方法 | 模式 | 处理器 | 操作 |\n| --- | --- | --- |\
  \ --- |\n| ANY | / | home | 显示首页 |\n| ANY | /snippet/view?id=1 | snippetView | 显示特定的代码片段\
  \ |\n| POST | /snippet/create | snippetCreate | 创建新的代码片段 |\n\n稍我们将使用这个 `id` 参数从数据库中选择特定的代码片段并显示给用户。但现在，我们只需读取\
  \ `id` 参数的值并将其与占位符插值。为了让这正常工作，我们需要更新 `snippetView` 函数来完成两件事：\n\n1. 它需要从 URL 字符串中获取\
  \ `id` 参数的值，我们可以使用 `r.URL.Query().Get()` 来实现。这将始终为参数返回一个字符串值，或者如果参数不存在则返回空字符串 `\"\
  \"`。\n2. 因为 `id` 参数是不可信的输入，我们应该对其进行验证，以确保它是正常且合理的。为了我们的 Snippet 应用程序，我们想要检查它是否包含一个正整数。我们可以通过尝试使用\
  \ `strconv.Atoi()` 函数将字符串值转换为整数，然后检查该值是否大于零。\n\n实现如下：文件：main.go\n\n```\npackage\
  \ main\n\nimport (\n    \"fmt\"\n    \"log\"\n    \"net/http\"\n    \"strconv\"\n\
  )\n\nfunc snippetView(w http.ResponseWriter, r *http.Request) {\n    // 从查询字符串中提取\
  \ id 参数的值，并尝试使用\n    // strconv.Atoi() 函数将其转换为整数。如果无法\n    // 转换为整数，或者值小于 1，我们返回\
  \ 404 页面未找到\n    // 响应。\n    id, err := strconv.Atoi(r.URL.Query().Get(\"id\"))\n\
  \    if err != nil || id < 1 {\n        http.NotFound(w, r)\n        return\n  \
  \  }\n\n    // 使用 fmt.Fprintf() 函数将 id 值插值到我们的响应中\n    // 并写入 http.ResponseWriter。\n\
  \    fmt.Fprintf(w, \"Display a specific snippet with %d...\", id)\n}\n```\n\n让我们尝试一下。重启应用程序，并尝试访问类似\
  \ `http://localhost:4000/snippet/view?id=123` 的 URL。你应该看到一个像这样的响应：\n\n\n你可能还想尝试访问一些\
  \ `id` 参数值无效或完全没有参数的 URL。例如：\n\n* `http://localhost:4000/snippet/view`\n* `http://localhost:4000/snippet/view?id=-1`\n\
  * `http://localhost:4000/snippet/view?id=foo`\n\n对于所有这些请求，你应该得到一个 `404 page not\
  \ 找到`响应。\n\n### io.writer 接口\n\n上面的代码在后台引入了另一个新东西。如果你查看 [`fmt.Fprintf()`](https://pkg.go.dev/fmt/#Fprintf)\
  \ 函数的文档，你会注意到它接受一个 `io.Writer` 作为第一个参数：\n\n```\nfunc Fprint(w io.Writer, format\
  \ string, a ...any) (n int, err error)\n```\n\n但我们传递的是我们的 `http.ResponseWriter`\
  \ 对象 —— 并且运行良好。\n\n我们之所以能够这样做是因为 `io.Writer` 类型是一个接口，而 `http.ResponseWriter` 对象实现了该接口，因为它有一个\
  \ `w.Write()` 方法。\n\n如果你是 Go 新手，那么[接口的概念](https://www.alexedwards.net/blog/interfaces-explained)\
  \ 可能会有点困惑，我不想现在在这里纠结它。你只需要知道——在实践中——任何看到 `io.Writer` 参数的地方，都可以传递你的 `http.ResponseWriter`\
  \ 对象。所写入的内容随后将作为 HTTP 响应的正文发送。\n\n### 章节 2.6. 项目结构与组织\n\n在我们向 `main.go` 文件中添加更多代码之前，现在是考虑如何组织和构建这个项目的好时机。\n\
  \n预先说明一下，在 Go 中构建 Web 应用程序没有单一的——甚至没有推荐的结构。这既是好事也是坏事。这意味着你对如何组织代码拥有自由和灵活性，但在决定最佳结构是什么时，也很容易陷入不确定性的兔子穴。\n\
  \n\n\n随着你 Go 经验的增加，你将逐渐感觉到哪些模式在不同情况下适合你。但作为一个起点，我能给你的最佳建议是`不要把事情复杂化`。只有在证明确实需要时，才努力尝试添加结构和复杂性。\n\
  \n对于这个项目，我们将实现一个遵循[流行的](https://github.com/thockin/go-build-template)且[经过验证的](https://peter.bourgon.org/go-best-practices-2016/#repository-structure)方法的大纲结构。这是一个非常扎实的起点，你应该能够在各种项目中复用这个通用结构。\n\
  \n如果你正在跟随操作，请确保你处于项目仓库的根目录下，并运行以下命令：\n\n```\n$ cd $HOME/code/snippetbox\n$ rm main.go\n\
  $ mkdir -p cmd/web internal ui/html ui/static\n$ touch cmd/web/main.go\n$ touch\
  \ cmd/web/handlers.go\n```\n\n现在，你的项目仓库结构看起来应该是这样的：\n\n让我们花一点时间讨论一下这些目录的用途。\n\n\
  *   `cmd` 目录将包含项目中可执行应用程序的`特定于应用程序`的代码。目前我们只有一个可执行应用程序——Web 应用——它将位于 `cmd/web` 目录下。\n\
  *   `internal` 目录将包含项目中使用的辅助`非特定于应用程序`的代码。我们将用它来存放可能重用的代码，例如验证辅助函数和项目的 SQL 数据库模型。\n\
  *   `ui` 目录将包含 Web 应用使用的`用户界面资源`。具体来说，`ui/html` 目录包含 HTML 模板，`ui/static` 目录包含静态文件（如\
  \ CSS 和图像）。\n\n*那么我们为什么要使用这种结构呢？*\n\n有两个巨大的好处：\n\n1.  它实现了 Go 代码与非 Go 资源之间的清晰分离。我们编写的所有\
  \ Go 代码将仅存在于 `cmd` 和 `internal` 目录下，留出项目根目录存放非 Go 资源，如 UI 文件、Makefile 和模块定义（包括我们的\
  \ `go.mod` 文件）。这使得在未来构建和部署应用程序时管理起来变得更容易。\n2.  如果你想在项目中添加另一个可执行应用程序，这种结构的扩展性非常好。例如，未来你可能想添加一个\
  \ CLI（命令行界面）来自动化某些管理任务。有了这种结构，你可以在 `cmd/cli` 下创建这个 CLI 应用程序，它将能够导入并复用你在 `internal`\
  \ 目录下编写的所有代码。\n\n### 重构你现有的代码\n\n让我们快速将已经编写的代码迁移到这个新结构中。\n\n文件：`cmd/web/main.go`\n\
  \n```\npackage main\n\nimport (\n    \"log\"\n    \"net/http\"\n)\n\nfunc main()\
  \ {\n    mux := http.NewServeMux()\n    mux.HandleFunc(\"/\", home)\n    mux.HandleFunc(\"\
  /snippet/view\", snippetView)\n    mux.HandleFunc(\"/snippet/create\", snippetCreate)\n\
  \n    log.Println(\"Starting server on :4000\")\n    err := http.ListenAndServe(\"\
  :4000\", mux)\n    log.Fatal(err)\n}\n```\n\n文件：`cmd/web/handlers.go`\n\n```\npackage\
  \ main\n\nimport (\n    \"fmt\"\n    \"net/http\"\n    \"strconv\"\n)\n\nfunc home(w\
  \ http.ResponseWriter, r *http.Request) {\n    if r.URL.Path != \"/\" {\n      \
  \  http.NotFound(w, r)\n        return\n    }\n\n    w.Write([]byte(\"Hello from\
  \ Snippetbox\"))\n}\n\nfunc snippetView(w http.ResponseWriter, r *http.Request)\
  \ {\n    id, err := strconv.Atoi(r.URL.Query().Get(\"id\"))\n    if err != nil ||\
  \ id < 1 {\n        http.NotFound(w, r)\n        return\n    }\n\n    fmt.Fprintf(w,\
  \ \"Display a specific snippet with ID %d...\", id)\n}\n\nfunc snippetCreate(w http.ResponseWriter,\
  \ r *http.Request) {\n    if r.Method != http.MethodPost {\n        w.Header().Set(\"\
  Allow\", http.MethodPost)\n        http.Error(w, \"Method Not Allowed\", http.StatusMethodNotAllowed)\n\
  \        return\n    }\n\n    w.Write([]byte(\"Create a new snippet...\"))\n}\n\
  ```\n\n现在，我们的 Web 应用在 `cmd/web` 目录下包含了`多个 Go 源代码文件`。要运行这些文件，我们可以如下地使用 `go run` 命令：\n\
  \n```\n$ cd $HOME/code/snippetbox\n$ go run ./cmd/web\n2022/01/29 12:02:26 Starting\
  \ server on :4000\n```\n\n* * *\n\n### 附加信息\n\n#### internal 目录\n\n需要指出的是，`internal`\
  \ 目录名称在 Go 中具有特殊的含义和行为：任何位于此目录下的包只能被`internal 目录的父级目录内部`的代码导入。在我们的情况下，这意味着任何位于 `internal`\
  \ 中的包都只能被我们 `snippetbox` 项目目录内部的代码导入。\n\n或者，从反面来看，这意味着 `internal` 下的任何包`无法被外部代码导入`。\n\
  \n#### HTML 模板渲染与继承\n\n现在我们已经创建了包含主页 HTML 的模板文件，下一个问题是*我们如何让主处理程序渲染它呢？*\n\n为了实现这一点，我们需要使用\
  \ Go 的 [`html/template`](https://pkg.go.dev/html/template/) 包，它提供了一系列用于安全解析 HTML\
  \ 模板的功能。我们可以使用该包中的函数解析并执行模板。\n\n我将进行演示。打开 `cmd/web/handlers.go` 文件并添加以下代码：\n\n文件：`cmd/web/handlers.go`\n\
  \n```\npackage main\n\nimport (\n    \"fmt\"\n    \"html/template\" // 新导入\n   \
  \ \"log\"           // 新导入\n    \"net/http\"\n    \"strconv\"\n)\n\nfunc home(w\
  \ http.ResponseWriter, r *http.Request) {\n    if r.URL.Path != \"/\" {\n      \
  \  http.NotFound(w, r)\n        return\n    }\n\n    // 使用 template.ParseFiles()\
  \ 函数将模板文件读取到\n    // 模板集中。如果发生错误，记录详细错误信息并使用\n    // http.Error() 函数向用户发送通用的 500\
  \ 内部错误\n    // 响应。\n    ts, err := template.ParseFiles(\"./ui/html/pages/home.tmpl\"\
  )\n    if err != nil {\n        log.Println(err.Error())\n        http.Error(w,\
  \ \"Internal Server Error\", 500)\n        return\n    }\n\n    // 然后我们使用模板集的 Execute()\
  \ 方法将\n    // 模板内容写入响应体。Execute() 的最后一个参数\n    // 代表我们想要传递的任何动态数据，目前我们\n    // 将其留为\
  \ nil。\n    err = ts.Execute(w, nil)\n    if err != nil {\n        log.Println(err.Error())\n\
  \        http.Error(w, \"Internal Server Error\", 500)\n    }\n}\n```\n\n\n...\n\
  \n需要注意的是，传递给 `template.ParseFiles()` 函数的文件路径必须是相对于当前工作目录的，或者是绝对路径。在上面的代码中，我将路径设置为相对于项目根目录的。\n\
  \n\n\n\n那么，既然如此，请确保你处于项目的根目录，并重启应用程序：\n\n```\n$ cd $HOME/code/snippetbox\n$ go run\
  \ ./cmd/web\n2022/01/29 12:06:02 Starting server on :4000\n```\n\n然后，在你的浏览器中打开 [`http://localhost:4000`](http://localhost:4000/)。你应该会发现\
  \ HTML 首页已经初具规模了。\n\n![](img/02.07-02.png)\n\n### 模板组合\n\n随着我们为这个 Web 应用添加更多页面，会有一些共享的、样板化的\
  \ HTML 标记是我们希望包含在每个页面中的——例如页眉、导航以及 `<head>` HTML 元素内部的元数据。\n\n为了避免重复输入并防止冲突，创建一个包含这些共享内容的\
  \ `base`（或 `master`）模板是一个好主意，然后我们可以将这些内容与各个页面的特定页面标记进行组合。\n\n现在去创建一个新的 `ui/html/base.tmpl`\
  \ 文件……\n\n```\n$ touch ui/html/base.tmpl\n```\n\n并添加以下标记（我们希望它们出现在每个页面上）：\n\n文件：`ui/html/base.tmpl`\n\
  \n```\n{{define \"base\"}}\n<!doctype html>\n<html lang='en'>\n    <head>\n    \
  \    <meta charset='utf-8'>\n        <title>{{template \"title\" .}} - Snippetbox</title>\n\
  \    </head>\n    <body>\n        <header>\n            <h1><a href='/'>Snippetbox</a></h1>\n\
  \        </header>\n        <main>\n            {{template \"main\" .}}\n      \
  \  </main>\n        <footer>Powered by <a href='https://golang.org/'>Go</a></footer>\n\
  \    </body>\n</html>\n{{end}}\n```\n\n如果你以前在其他语言中使用过模板引擎，那么希望这会让你觉得很熟悉。它本质上只是普通的\
  \ HTML，只是在双花括号 `{{ ... }}}` 中包含了一些额外的动作（actions）。\n\n在这里，我们使用 `{{define \"base\"\
  }}...{{end}}` 动作来定义一个名为 `base` 的独立命名模板，它包含了我们希望出现在每个页面上的内容。\n\n在这个内部，我们使用 `{{template\
  \ \"title\" .}}` 和 `{{template \"main\" .}}` 动作表示我们想在 HTML 的特定位置调用其他的命名模板（称为 `title`\
  \ 和 `main`）。\n\n现在让我们回到 `ui/html/pages/home.tmpl` 文件，并更新它以定义 `title` 和 `main` 命名模板，它们将包含首页的特定内容。\n\
  \n文件：`ui/html/pages/home.tmpl`\n\n```\n{{define \"title\"}}Home{{end}}\n\n{{define\
  \ \"main\"}}\n    <h2>Latest Snippets</h2>\n    <p>There's nothing to see here yet!</p>\n\
  {{end}}\n```\n\n完成这些后，下一步是更新你的 `home` 处理器中的代码，以便同时解析这两个模板文件，如下：\n\n文件：`cmd/web/handlers.go`\n\
  \n```go\npackage main\n\n...\n\nfunc home(w http.ResponseWriter, r *http.Request)\
  \ {\n    if r.URL.Path != \"/\" {\n        http.NotFound(w, r)\n        return\n\
  \    }\n\n    // 初始化一个包含两个文件路径的切片。需要注意的是\n    // 包含我们基础模板的文件必须是切片中的*第一个*文件。\n  \
  \  files := []string{\n        \"./ui/html/base.tmpl\",\n        \"./ui/html/pages/home.tmpl\"\
  ,\n    }\n\n    // 使用 template.ParseFiles() 函数读取文件并将模板\n    // 存储在模板集中。注意我们可以将文件路径切片\n\
  \    // 作为变长参数传递吗？\n    ts, err := template.ParseFiles(files...)\n    if err !=\
  \ nil {\n        log.Println(err.Error())\n        http.Error(w, \"Internal Server\
  \ Error\", 500)\n        return\n    }\n\n    // 使用 ExecuteTemplate() 方法将 \"base\"\
  \ 模板的内容\n    // 写入响应正文。\n    err = ts.ExecuteTemplate(w, \"base\", nil)\n    if\
  \ err != nil {\n        log.Println(err.Error())\n        http.Error(w, \"Internal\
  \ Server Error\", 500)\n    }\n}\n\n...\n```\n\n现在，我们的模板集不再直接包含 HTML，而是包含了 3 个命名模板——`base`、`title`\
  \ 和 `main`。我们使用 `ExecuteTemplate()` 方法告诉 Go，我们明确想要使用 `base` 模板的内容进行响应（这反过来又会调用我们的\
  \ `title` 和 `main` 模板）。\n\n可以重启服务器并尝试一下。你会发现它渲染的输出与之前相同（尽管 HTML 源码中动作所在的地方有一些额外的空白）。\n\
  \n### 嵌入部分组件 (partials)\n\n对于某些应用程序，你可能希望将某些 HTML 部分拆分成为部分组件，这些组件可以在不同的页面或布局中重用。为了说明这一点，让我们创建一个包含\
  \ Web 应用主导航栏的部分组件。\n\n创建一个新的 `ui/html/partials/nav.tmpl` 文件，包含一个名为 `\"nav\"` 的命名模板，如下：\n\
  \n```\n$ mkdir ui/html/partials\n$ touch ui/html/partials/nav.tmpl\n```\n\n文件：`ui/html/partials/nav.tmpl`\n\
  \n```\n{{define \"nav\"}}\n<nav>\n    <a href='/'>Home</a>\n</nav>\n{{end}}\n```\n\
  \n然后更新 `base` 模板，以便它调用 `nav` 部分组件：\n\n文件：`ui/html/base.tmpl`\n\n```\n{{define \"\
  base\"}}\n<!doctype html>\n<html lang='en'>\n    <head>\n        <meta charset='utf-8'>\n\
  \        <title>{{template \"title\" .}} - Snippetbox</title>\n    </head>\n   \
  \ <body>\n        <header>\n            <h1><a href='/'>Snippetbox</a></h1>\n  \
  \      </header>\n        <main>\n            {{template \"main\" .}}\n        \
  \    {{template \"nav\" .}}\n        </main>\n        <footer>Powered by <a href='https://golang.org/'>Go</a></footer>\n\
  \    </body>\n</html>\n{{end}}\n```\n\n最后，我们需要更新 `home` 处理器以包含 `nav` 部分组件：\n\n文件：`cmd/web/handlers.go`\n\
  \n```go\npackage main\n\n...\n\nfunc home(w http.ResponseWriter, r *http.Request)\
  \ {\n    if r.URL.Path != \"/\" {\n        http.NotFound(w, r)\n        return\n\
  \    }\n\n    // 初始化一个包含两个文件路径的切片。需要注意的是\n    // 包含我们基础模板的文件必须是切片中的*第一个*文件。\n  \
  \  files := []string{\n        \"./ui/html/base.tmpl\",\n        \"./ui/html/pages/home.tmpl\"\
  ,\n    }\n\n    // 使用 template.ParseFiles() 函数读取文件并将模板\n    // 存储在模板集中。注意我们可以将文件路径切片\n\
  \    // 作为变长参数传递吗？\n    ts, err := template.ParseFiles(files...)\n    if err !=\
  \ nil {\n        log.Println(err.Error())\n        http.Error(w, \"Internal Server\
  \ Error\", 500)\n        return\n    }\n\n    // 使用 ExecuteTemplate() 方法将 \"base\"\
  \ 模板的内容\n    // 写入响应正文。\n    err = ts.ExecuteTemplate(w, \"base\", nil)\n    if\
  \ err != nil {\n        log.Println(err.Error())\n        http.Error(w, \"Internal\
  \ Server Error\", 500)\n    }\n}\n\n...\n```\n\n一旦重启服务器，`base` 模板现在应该调用 `nav` 模板，你的首页看起来应该是这样：\n\
  \n![](img/02.07-03.png)\n\n### 更多信息\n\n#### block 动作\n\n在上面的代码中，我们使用了 `{{template}}`\
  \ 动作从一个模板调用另一个模板。但 Go 还提供了 `{{block}}...{{end}}` 动作，你可以使用它。它的作用类似于 `{{template}}`，但允许你在被调用的模板*在模板集中不存在*时指定默认内容。\n\
  \n当你希望提供某些默认内容（例如侧边栏），以便各个页面根据需要进行覆盖时，这非常有用。\n\n语法上，你可以这样使用它：\n\n```\n{{define \"\
  base\"}}\n    <h1>示例模板</h1>\n    {{block \"sidebar\" .}}\n        <p>我的默认侧边栏内容</p>\n\
  \    {{end}}\n{{end}}\n```\n\n但是——如果你愿意——你不需要 `{{block}}` 和 `{{end}}` 动作之间包含任何默认内容。在这种情况下，被调用的模板就像是“可选的”。如果模板在模板集中，它就会被渲染。如果不存在，则什么都不会显示。\n\
  \n#### 嵌入文件\n\nGo 1.16 引入了 [`embed`](https://pkg.go.dev/embed/) 包，它使得*将文件嵌入到 Go\
  \ 程序本身中，而不是从磁盘读取。\n\n目前，从磁盘读取我们的模板文件运行良好，而且在概念上比使用 `embed` 包更简单，但我们会在书后面的部分回顾这一点，并解释如何使用\
  \ `embed` 功能作为替代方案。\n\n第 2.8  \n\n提供静态文件\n\n\n\n\n现在，让我们通过向项目中添加一些静态 CSS 和图像文件，以及少量的\
  \ JavaScript 来高亮激活的导航项，从而改进主页的观和体验。\n\n如果你正在按照此教程操作，可以使用以下命令获取必要的文件并将它们提取到我们之前创建的\
  \ `ui/static` 文件夹中：\n\n```bash\n$ cd $HOME/code/snippetbox\n$ curl https://www.alexedwards.net/static/sb-v2.tar.gz\
  \ | tar -xvz -C ./ui/static/\n```\n\n现在你的 `ui/static` 目录内容应该像这样：\n\n![](img/02.08-01.png)\n\
  \n### `http.FileServer` 处理器\n\nGo 的 `net/http` 包内置了一个名为 [`http.FileServer`](https://pkg.go.dev/net/http/#FileServer)\
  \ 的处理器，你可以用它通过 HTTP 从特定目录提供文件。让我们为应用程序添加一个新路由，使得所有以 `\"/static/\"` 开头的请求都由它来处理，如下所示：\n\
  \n| 方法 | 模式 | 处理器 | 操作 |\n| --- | --- | --- | --- |\n| ANY | / | home | 显示主页 |\n\
  | ANY | /snippet/view?id=1 | snippetView | 显示特定的代码片段 |\n| POST | /snippet/create\
  \ | snippetCreate | 创建新的代码片段 |\n| ANY | /static/ | http.FileServer | 提供特定的静态文件 |\n\
  \n要创建一个新的 `http.FileServer` 处理器，我们需要像这样使用 [`http.FileServer()`](https://pkg.go.dev/net/http/#FileServer)\
  \ 函数：\n\n```go\nfileServer := http.FileServer(http.Dir(\"./ui/static/\"))\n```\n\
  \n当此处理器接收到请求时，它会移除 URL 路径开头的斜杠，然后在 `./ui/static` 目录中搜索对应的文件并发送给用户。\n\n因此，为了让它正常工作，我们必须在将其传递给\
  \ `http.FileServer` *之前*，从 URL 路径中去掉开头的 `\"/static\"`。否则，它将寻找一个不存在的文件，用户将收到 `404\
  \ page not found` 响应。幸运的是，Go 包含了一个专门用于此任务的辅助函数 [`http.StripPrefix()`](https://pkg.go.dev/net/http/#StripPrefix)。\n\
  \n打开你的 `main.go` 文件并添加以下代码，使文件最终看起来如下：\n\n文件：`cmd/web/main.go`\n\n```go\npackage\
  \ main\n\nimport (\n    \"log\"\n    \"net/http\"\n)\n\nfunc main() {\n    mux :=\
  \ http.NewServeMux()\n\n    // 创建一个从 \"./ui/static\" 目录提供文件的文件服务器。\n    // 注意传递给\
  \ http.Dir 函数的路径相对于项目\n    // 根目录的。\n    fileServer := http.FileServer(http.Dir(\"\
  ./ui/static/\"))\n\n    // 使用 mux.Handle() 函数将文件服务器注册为所有\n    // 以 \"/static/\"\
  \ 开头的 URL 路径的处理器。对于匹配的路径，\n    // 在请求到达文件服务器之前剥离 \"/static\" 前缀。\n    mux.Handle(\"\
  /static/\", http.StripPrefix(\"/static\", fileServer))\n\n    // 正常注册其他应用程序路由。\n\
  \    mux.HandleFunc(\"/\", home)\n    mux.HandleFunc(\"/snippet/view\", snippetView)\n\
  \    mux.HandleFunc(\"/snippet/create\", snippetCreate)\n\n    log.Println(\"Starting\
  \ server on :4000\")\n    err := http.ListenAndServe(\":4000\", mux)\n    log.Fatal(err)\n\
  }\n```\n\n完成后，重启应用程序并在浏览器中打开 [`http://localhost:4000/static/`](http://localhost:4000/static/)。你应该能在浏览器中看到\
  \ `static` 目录的文件列表。\n\n你可以自由访问 `http://localhost:4000/static/` 来浏览目录文件。例如，如果你访问\
  \ [`http://localhost:4000/static/css`](http://localhost:4000/static/css)，你应该能看到\
  \ `static` 目录的列表，如下：\n\n![](img/02.08-0.png)\n\n### 使用静态文件\n\n现在文件服务器工作正常了，我们可以更新\
  \ `html/base` 来使用静态文件：\n\n文件：`ui/html/base`\n\n```html\n{{define \"base\"}}\n<!doctype\
  \ html>\n<html lang='en'>\n<head>\n    <meta charset='utf-8'>\n    <title>{{template\
  \ \"title\"}} - Snippet</title>\n    <link rel=\"stylesheet\" href='/static/css'>\n\
  \    <link rel=\"icon\" href='/static/favicon.ico'>\n</head>\n<body>\n    <header>\n\
  \        {{template \"nav\"}}\n    </header>\n    <main>\n        {{template \"\
  main\"}}\n    </main>\n    <footer>\n        Powered by <a href='golang.org'>Go</a>\n\
  \    </footer>\n    <script src='/static/js'></script>\n</body>\n</html>\n{{end}}\n\
  ```\n\n确保保存更改，然后访问 `http://localhost:4000/`。你的主页现在应该是这样的：\n\n![](img/02.08-4.png)\n\
  \n### 附加信息\n\nGo 的文件服务器有一些值得注意的特性：\n\n- 它通过运行 [`path.Clean()`](https://pkg.go.dev/path#Clean)\
  \ 处理所有路径，这可以移除 URL 中的 `.` 和 `..` 元素，防止目录遍历攻击。\n- [Range 请求](https://benramsey.com/blog/2008/partial-content)\
  \ 是完全支持的。如果你的应用程序正在提供大文件，这非常有用。你可以使用 curl 请求 `logo.png` 的 100-199 字节来看看效果：\n\n```bash\n\
  $ curl -i -H \"Range: bytes=100-199\" http://localhost:4000/static/logo.png\nHTTP/1.1\
  \ 206 Partial Content\nAccept-Ranges: bytes\nContent-Length: 100\nContent-Range:\
  \ bytes 100-199\nContent-Type: image/png\nLast-Modified: Thu, 04 May 2017 13:07:52\
  \ GMT\nDate: Sat, 29 Jan 2022 14:33:59 GMT\n```\n\n- `Last-Modified` 和 `If-Modified-Since`\
  \ 头部是透明支持的。如果文件自上次请求以来没有更改，`http.FileServer` 将发送 `304 Not Modified` 状态码而不是文件。这有助于减少客户端和服务器的延迟和处理开销。\n\
  - `Content-Type` 根据文件名自动设置，使用了 [`mime.TypeByExtension()`](https://pkg.go.dev/mime#TypeByExtension)\
  \ 函数。如有必要，可以使用 [`mime.AddExtensionType()`](https://pkg.go.dev/mime#AddExtensionType)\
  \ 函数添加自己的扩展名和内容类型。\n\n#### 禁用目录列表\n\n\n\n\n\n如果你想禁用目录列表，有几种不同的方法可以采用。\n\n最简单的方法？在你想禁用的列表的特定目录中添加一个空的\
  \ `index.html` 文件。这样，该文件将取代目录列表被输出，用户将得到一个没有正文的 `200 OK` 响应。如果你想对 `./ui/static`\
  \ 下的所有目录都执行此操作，可以使用以下命令：\n\n```\n$ find ./ui/static -type d -exec touch {}/index.html\
  \ \\;\n```\n\n一个更复杂（但可以说更好）的解决方案是为 [`http.FileSystem`](https://pkg.go.dev/net/http/#FileSystem)\
  \ 创建一个自定义实现，并让它对任何目录都返回一个 `os.ErrNotExist` 错误。详细的解释和示例代码可以在[这篇博客文章](https://www.alexedwards.net/blog/disable-http-fileserver-directory-listings)中找到。\n\
  \n# 第 2.9 节。\n\n## `http.Handler` 接口\n\n在继续之前，我们应该涵盖涵盖一些理论知识。这有点复杂，所以如果你觉得这一章很难懂，不要担心。继续构建应用程序，等你对\
  \ Go 更熟悉后再回到这里看。\n\n在之前的章节中，我经常使用 handler（处理器）这个词，但没有解释它的真正含义。严格来说，我们所说的 handler\
  \ 是实现 [`http.Handler`](https://pkg.go.dev/net/http/#Handler) 接口的对象：\n\n```\ntype\
  \ Handler interface {\n    ServeHTTP(ResponseWriter, *Request)\n}\n```\n\n简单来说，这意味着要成为一个\
  \ handler，一个对象必须具有具有相同签名的 `ServeHTTP()` 方法：\n\n```\nServeHTTP(http.ResponseWriter,\
  \ *http.Request)\n```\n\n因此，在最简单的情况下，一个 handler 看起来像这样：\n\n```\ntype home struct\
  \ {}\n\nfunc (h *home) ServeHTTP(w http.ResponseWriter, r *http.Request) {\n   \
  \ w.Write([]byte(\"This is my home page\"))\n}\n```\n\n在这里我们有一个对象（在这种情况下是一个 `home`\
  \ 结构体，但它同样可以是字符串、函数或任何其他内容），我们在它上实现了一个签名名为 `ServeHTTP(http.ResponseWriter, *http.Request)`\
  \ 的方法。这就是创建一个 handler 所需的所有内容。\n\n你可以使用 `Handle` 方法将将其注册到 servemux 中，如下：\n\n```\n\
  mux := http.NewServeMux()\nmux.Handle(\"/\", &home{})\n```\n\n当这个 servemux 接收到针对\
  \ `/` 的 HTTP 请求时，它将调用 `home` 结构体的 `ServeHTTP()` 方法 —— 该方法随后写入 HTTP 响应。\n\n### Handler\
  \ 函数\n\n现在，为了实现一个 `ServeHTTP()` 方法而创建一个对象是冗长且有些困惑的。这就是为什么在实践中，更常见的方法是将 handlers\
  \ 写成普通函数（正如我们一直以来所的那样）。例如：\n\n```\nfunc home(w http.ResponseWriter, r *http.Request)\
  \ {\n    w.Write([]byte(\"This is my home page\"))\n}\n```\n\n但这个 `home` 函数只是一个普通函数；它没有\
  \ `ServeHTTP()` 方法。所以它本身并不是一个 handler。\n\n相反，我们可以使用 [`http.HandlerFunc()`](https://pkg.go.dev/net/http/#HandlerFunc)\
  \ 适配器将其转换为 handler，如下：\n\n```\nmux := http.NewServeMux()\nmux.Handle(\"/\", http.HandlerFunc(home))\n\
  ```\n\n`http.HandlerFunc()` 适配器的工作原理是自动为 `home` 函数添加一个 `ServeHTTP()` 方法。执行时，这个 `ServeHTTP()`\
  \ 方法只需简单地调用原始 `home` 函数的内容。这是一种迂回但方便的方法，可以将普通函数强制满足 `http.Handler` 接口。\n\n在整个项目中，我们一直使用\
  \ `HandleFunc` 方法来注册 handler。这是一种语法糖，可以将普通函数转换为满足 `http.Handler` 接口的 handler：\n\n\
  ```\nmux := http.NewServeMux()\nmux.HandleFunc(\"/\", home)\n```\n\n### 链接 handler\n\
  \n当这个 servemux 接收到针对 `/` 的 HTTP 请求时，它将调用 `home` 结构体的 `ServeHTTP()` 方法 —— 该方法反过来写入\
  \ HTTP 响应。\n\n在开始时，你可能注意到，[`ListenAndServe`](https://pkg.go.dev/net/http/#ListenAndServe)\
  \ 函数的第二个参数是 handler：\n\n```\nmux := http.NewServeMux()\nmux.Handle(\"/\", handler)\n\
  ```\n\n对于我来说，在运行时设置 handler 这种方式让事情变得简单了。\n\n事实上，实际上发生的情况是让 servemux 接收到针对 `/` 的\
  \ HTTP 请求时，它将调用 `home` 结构体的 `ServeHTTP()` 方法 —— 该方法反过来写入 HTTP 响应。\n\n### 请求并发处理\n\
  \n还有一点非常需要注意：所有传入的请求都在自己的 goroutine 中处理。虽然这有助于性能，但缺点是你需要注意并防止访问共享资源[竞态条件](https://www.alexedwards.net/understanding-mutexes)。\n\
  \n# 第 3 章。\n\n# 配置与错误处理\n\n在本书的这一部分中，我们将进行一些清理工作。我们不会添加很多新功能，而是专注于那些让管理应用程序更简单的改进。\n\
  \n你将学习如何：\n\n* 使用命令行标记在运行时设置应用程序配置。\n* 改进你的应用程序日志，包含更多信息，并根据类型（或级别）对其进行管理。\n* 以一种可扩展、类型安全的方式让你的处理器可以使用依赖。\n\
  * 集中错误处理，这样你就不需要重复代码。\n\n## 第 3.1 节。\n\n### 管理配置设置\n\n我们 Web 应用程序的 `main.go` 文件目前包含几个硬编码配置设置：\n\
  \n* 服务器监听的网络地址（当前为 `\":4000\"`）\n* 静态文件目录的文件路径（当前为 `\"./ui/static\"`）\n\n将这些硬编码是不理想的。配置设置与代码之间没有分离，我们无法在运行时更改设置（如果你在开发、测试和生产环境中需要不同的设置，这将很重要）。\n\
  \n在本章中，我们将开始改进这一点，并使服务器的网络地址可以在运行时配置。\n\n### 命令行标记\n\n在 Go 中，管理配置设置的一种常见且习惯的方法是在启动应用程序时使用命令行标记。例如：\n\
  \n```\n$ go run ./cmd/web -addr=\":80\"\n```\n\n从应用程序中接收并解析命令行标记的最简单方法是使用如下一行代码：\n\
  \n```\naddr := flag.String(\"addr\", \":4000\", \"HTTP network address\")\n```\n\
  \n\n\n\n让我们在应用程序中使用这一功能，并将硬编码的网络地址替换为命令行标记：\n\n文件内容：`cmd/web/main.go`\n\n```go\n\
  package main\n\nimport (\n    \"flag\" // 新增导入\n    \"log\"\n    \"net/http\"\n\
  )\n\nfunc main() {\n    // 定义一个名为 'addr' 的新命令行标记，默认值为 \":4000\"，\n    // 并带有一些简短的帮助文本，用于解释该标记控制的内容。\n\
  \    // 标记的值将在运行时存储在 addr 变量中。\n    addr := flag.String(\"addr\", \":4000\", \"\
  HTTP network address\")\n\n    // 重要的是，我们使用 flag.Parse() 函数来解析命令行标记。\n    // 它会读取命令行标记的值并将其赋值给\
  \ addr 变量。\n    // 你需要在在使用 addr 变量*之前*调用此函数，\n    // 否则它将始终包含默认值 \":4000\"。\n  \
  \  // 如果在解析过程中遇到任何错误，应用程序将终止。\n    flag.Parse()\n\n    mux := http.NewServeMux()\n\
  \n    fileServer := http.FileServer(http.Dir(\"./ui/static/\"))\n    mux.Handle(\"\
  /static/\", http.StripPrefix(\"/static\", fileServer))\n    \n    mux.HandleFunc(\"\
  /\", home)\n    mux.HandleFunc(\"/snippet/view\", snippetView)\n    mux.HandleFunc(\"\
  /snippet/create\", snippetCreate)\n\n    // flag.String() 函数返回的是指向标记值的指针，\n    //\
  \ 而不是值本身。因此，在使用它之前，我们需要对指针进行解引用\n    //（即在其前面加上 * 符号）。\n    // 注意，我们使用 log.Printf()\
  \ 函数将地址插值到日志消息中。\n    log.Printf(\"Starting server on %s\", *addr)\n    err := http.ListenAndServe(*addr,\
  \ mux)\n    log.Fatal(err)\n}\n```\n\n保存此文件并尝试在启动应用程序时使用 `-addr` 标记。你会发现服务器现在会在你指定的任何上上，如下所示：\n\
  \n```bash\n$ go run ./cmd/web -addr=\":9999\"\n2022/01/29 15:50:20 Starting server\
  \ on :9999\n```\n\n### 默认值\n\n命令行标记是完全可选的。例如，如果你在运行应用程序时不带 `-addr` 标记，服务器将回退到监听地址\
  \ `:4000`（这是我们指定的默认值）。\n\n```bash\n$ go run ./cmd/web \n2022/01/29 15:51:36 Starting\
  \ server on :4000\n```\n\n对于命令行标记使用什么作为默认值，并没有规定。我喜欢使用符合我开发环境的默认值，因为这在构建应用程序时可以节省我的时间和打字量。但因人而异（YMMV）。你可能更倾向于为生产环境设置默认值的安全方法。\n\
  \n### 类型转换\n\n在上面的代码中，我们使用了 `flag.String()` 函数来定义命令行标记。这样做的好处是将用户在运行时提供的任何值都转换为\
  \ `string` 类型。如果值*无法*转换为 `string`，则应用程序将记录错误并退出。\n\nGo 还有许多系列其他函数，包括 [`flag.Int()`](https://pkg.go.dev/flag/#Int)、[`flag.Bool()`](https://pkg.go.dev/flag/#Bool)\
  \ 和 [`flag.Float64()`](https://pkg.go.dev/flag/#Float64)。它们的工作方式与 `flag.String()`\
  \ 完全相同，只是它们会自动将命令行标记的值转换为相应的类型。\n\n### 自动帮助\n\n另一个很棒的功能是你可以使用 `-help` 标记列出应用程序所有可用的命令行标记及其对应的帮助文本。尝试一下：\n\
  \n```bash\n$ go run ./cmd/web -help\nUsage of /tmp/go-build3672328037/b001/exe/web:\n\
  \  -addr string\n        HTTP network address (default \":4000\")\n```\n\n总而言之，这看起来已经非常棒了。我们引入了一种为应用程序管理配置设置的惯用方法。\n\
  \n### 额外信息\n\n#### 环境变量\n\n如果你以前构建并部署过应用程序，你可能在考虑环境变量？将配置存储在环境变量中是可行的，这是一种[良好的实践](https://12factor.net/config)。例如，你可以使用\
  \ `addr` 环境变量来设置端口：\n\n```bash\n$ export ADDR=:9999\ngo run ./cmd/web\n2022/01/29\
  \ 15:54:29 Starting server on :9999\n```\n\n#### 布尔标记\n\n如果你想使用布尔标记，可以使用 `flag.Bool()`。例如：\n\
  \n```bash\n$ go run ./cmd/web -debug=true\n2022/01/29 15:55:00 Starting server on\
  \ :4000\n```\n\n#### 预存变量\n\n可以将命令行标记解析到预存变量的地址中。这里是一个粗略的示例：\n\n```go\ntype config\
  \ struct {\n    addr      string\n    staticDir string\n}\n\nvar cfg config\n\n\
  flag.StringVar(&cfg.addr, \"addr\", \":4000\", \"HTTP network address\")\nflag.StringVar(&cfg.staticDir,\
  \ \"static-dir\", \"./static\", \"Path to static assets\")\n\nflag.Parse()\n```\n\
  \n## 3.2 分级日志\n\n目前在 `main.go` 文件中，我们使用 [`log.Printf()`](https://pkg.go.dev/log/#Printf)\
  \ 和 [`log.Fatal()`](https://pkg.go.dev/log/#Fatal) 函数来输出消息。\n\n这两个函数都通过 Go 的标准日志器输出消息，该日志器默认会在消息前加上本地日期和时间，并将其写入标准标准错误流。`log.Fatal()`\
  \ 函数在写入消息后还会调用 `os.Exit(1)`，导致应用程序立即退出。\n\n在我们的应用程序中，我们可以将日志消息分为两个不同的类型——或级别。第一类型是*信息性*消息（例如\
  \ `\"Starting server on :4000\"`），第二类型是*错误*消息。\n\n```go\nlog.Printf(\"Starting server\
  \ on %s\", *addr) // 信息消息\nerr := http.ListenAndServe(*addr, mux)\nlog.Fatal(err)\
  \ // 错误消息\n```\n\n让我们通过添加一些*分级日志*功能来改进应用程序，以便以不同的方式管理信息和错误消息。具体来说：\n\n*   我们将信息消息加上\
  \ `\"INFO\"` 前缀，并将其输出到标准输出 (stdout)。\n*   我们将错误消息加上 `\"ERROR\"` 前缀，并将其输出到标准错误 (stderr)，同时带有调用日志器的相关文件名和行号（有助于调试）。\n\
  \n实现此功能有几种方法，但一种简单且清晰的方法是使用 [`log.New()`](https://pkg.go.dev/log/#New) 函数创建两个新的自定义日志器。\n\
  \n打开你的 `main.go` 文件并按如下方式更新：\n\n\n\n\n\n```go\npackage main\n\nimport (\n    \"\
  flag\"\n    \"log\"\n    \"net/http\"\n    \"os\" // 新导入\n)\n\nfunc main() {\n \
  \   addr := flag.String(\"addr\", \":4000\", \"HTTP network address\")\n    \n \
  \   flag.Parse()\n\n    // 使用 log.New() 创建一个用于写入信息信息的记录器。它接收\n    // 三个参数：写入日志的目标位置\
  \ (os.Stdout)，消息的字符串\n    // 前缀（INFO 后跟一个制表符），以及指示包含哪些\n    // 额外信息的标志（本地日期和时间）。注意，这些标志是\n\
  \    // 使用位或运算符 | 组合的。\n    infoLog := log.New(os.Stdout, \"INFO\\t\", log.Ldate|log.Ltime)\n\
  \n    // 以同样的方式创建一个用于写入错误信息的记录器，但使用 stderr 作为\n    // 目标，并使用 log.Lshortfile 标志来包含相关的\n\
  \    // 文件名和行号。\n    errorLog := log.New(os.Stderr, \"ERROR\\t\", log.Ldate|log.Ltime|log.Lshortfile)\n\
  \n    mux := http.NewServeMux()\n\n    fileServer := http.FileServer(http.Dir(\"\
  ./ui/static/\"))\n    mux.Handle(\"/static/\", http.StripPrefix(\"/static\", fileServer))\n\
  \n    mux.HandleFunc(\"/\", home)\n    mux.HandleFunc(\"/snippet/view\", snippetView)\n\
  \    mux.HandleFunc(\"/snippet/create\", snippetCreate)\n\n    // 使用这两个新记录器写入消息，而不是使用标准记录器。\n\
  \    infoLog.Printf(\"Starting server on %s\", *addr)\n    err := http.ListenAndServe(*addr,\
  \ mux)\n    errorLog.Fatal(err)\n}\n```\n\n好了……让我们尝试一下这些吧！\n\n继续运行应用程序，然后打开另一个终端窗口并尝试再次运行。这应该会产生一个错误，因为我们的服务器想要监听的网络地址（`:4000`）已经被被用了。\n\
  \n你在第二个终端中的日志输出看起来应该像这样：\n\n```\n$ go run ./cmd/web\nINFO    2022/01/29 16:00:50\
  \ Starting server on :4000\nERROR   2022/01/29 16:00:50 main.go:37: listen tcp :4000:\
  \ bind: address already in use\nexit status 1\n```\n\n注意这两个消息的前缀是不同的——这样它们在终端中可以被轻松区分——而且我们的错误消息还包含了调用记录器的文件名和行号（`main.go:37`）？\n\
  \n### 解耦日志记录\n\n像我们这样将消息记录到标准流（stdout 和 stderr）的一个大好处是，你的应用程序和日志记录之间是解耦的。应用程序本身并不关心日志的路由或存储，这可以让你根据不同的环境更方便地管理日志。\n\
  \n在开发期间，查看日志输出很容易的，因为标准流会显示在终端中。\n\n在分阶段或生产环境中，你可以将流重定向到最终目标以便查看和归档。该目标可以是磁盘文件，也可以是像\
  \ Splunk 这样的日志服务。无论如何，日志的最终目标由你的执行环境独立于应用程序进行管理。\n\n例如，我们可以在启动应用程序时这样将 stdout 和\
  \ stderr 流重定向到磁盘文件：\n\n```\n$ go run ./cmd/web >>/tmp/info.log 2>>/tmp/error.log\n\
  ```\n\n### http.Server 错误日志\n\n我们还需要对应用程序进行最后一次更改。默认情况下，如果 Go 的 HTTP 服务器遇到错误，它将使用标准记录器记录它。为了保持一致性，最好使用我们新的\
  \ `errorLog` 记录器。\n\n为了实现这一点，我们需要在 `http.Server` 结构体中使用我们新的 `errorLog` 记录器，而不是默认的。\n\
  \n如下：`cmd/web/main.go`\n\n```go\npackage main\n\nimport (\n    \"flag\"\n    \"\
  log\"\n    \"net/http\"\n    \"os\"\n)\n\nfunc main() {\n    addr := flag.String(\"\
  addr\", \":4000\", \"HTTP network address\")\n\n    flag.Parse()\n\n    infoLog\
  \ := log.New(os.Stdout, \"INFO\\t\", log.Ldate|log.Ltime)\n    errorLog := log.New(os.Stderr,\
  \ \"ERROR\\t\", log.Ldate|log.Ltime|log.Lshortfile)\n\n    mux := http.NewServeMux()\n\
  \n    fileServer := http.FileServer(http.Dir(\"./ui/static/\"))\n    mux.Handle(\"\
  /static/\", http.StripPrefix(\"/static\", fileServer))\n\n    mux.HandleFunc(\"\
  /\", home)\n    mux.HandleFunc(\"/snippet/view\", snippetView)\n    mux.HandleFunc(\"\
  /snippet/create\", snippetCreate)\n\n    infoLog.Printf(\"Starting server on %s\"\
  , *addr)\n    srv := &http.Server{\n        Addr:     *addr,\n        ErrorLog:\
  \ errorLog,\n        Handler:  mux,\n    }\n\n    err := srv.ListenAndServe()\n\
  \    errorLog.Fatal(err)\n}\n```\n\n### 额外信息\n\n到目前为止，我们使用了 `Println()`、`Printf()`\
  \ 和 `Fatal()` 来写入消息，但 Go 提供了其他值得熟悉的[方法](https://go.dev/log)。\n\n#### 并发日志记录\n\n\
  `log.New()` 创建的记录器也是安全的。但是，如果你有多个 goroutine，你需要担心竞态条件。\n\n#### 日志到文件\n\n正如上面所说的，我的建议是将输出重定向到文件。作为一个粗略的示例：\n\
  \n```go\nf, err := os.OpenFile(\"/tmp/info.log\", os.O_RDWR|os.O_CREATE, 0666)\n\
  if err != nil {\n    log.Fatal(err)\n}\ndefer f.Close()\n\ninfoLog := log.New(f,\
  \ \"INFO\\t\", log.Ldate|log.Ltime)\n```\n\n## 3.3 依赖注入\n\n我们的应用程序还有一个需要解决的日志记录问题。如果你打开\
  \ `handlers.go` 文件，你会发现 `home` 处理函数仍然使用 Go 的标准记录器写入错误，而不是我们想要的 `errorLog`。\n\n```go\n\
  func home(w http.ResponseWriter, r *http.Request) {\n    ...\n\n    ts, err := template.ParseFiles(files...)\n\
  \    if err != nil {\n        log.Println(err.Error()) // 这并没有在使用我们的记录器。\n     \
  \   http.Error(w, \"Internal Server Error\", 500)\n        return\n    }\n\n   \
  \ err = ts.ExecuteTemplate(w, \"base\", nil)\n    if err != nil {\n        log.Println(err.Error())\
  \ // 这并没有在使用我们的记录器。\n        http.Error(w, \"Internal Server Error\", 500)\n   \
  \ }\n}\n```\n\n这引发了一个很好的问题：*我们如何让 `main()` 中的新 `errorLog` 记录器对 `home` 可？*\n\n这个问题进一步泛化。大多数\
  \ Web 应用程序都有处理器需要的多个依赖项，例如数据库连接池、集中错误处理和模板缓存。我们真正想要回答的是：*我们如何让任何依赖项对我们的处理函数可用？*\n\
  \n有几种不同的方法](https://www.alexedwards.net/blog/organising-database-access)来实现这一点，最简单的是将依赖放在全局变量中。但通常，注入依赖的良好做法是将它们放入一个自定义的\
  \ `application` 结构体中，然后将你的处理函数定义为该结构体的方法。\n\n\n\n\n我将为你演示。\n\n打开你的 `main.go` 文件并按照所示所示一个新的\
  \ `application` 结构体：\n\n文件：`cmd/web/main.go`\n\n```go\npackage main\n\nimport (\n\
  \    \"flag\"\n    \"log\"\n    \"net/http\"\n    \"os\"\n)\n\n// 定义一个 application\
  \ 结构体来存放整个 web 应用程序的\n// 依赖项。目前我们只包含两个自定义日志记录器的字段，\n// 但随着构建的进行，我们将为其添加更多字段。\ntype\
  \ application struct {\n    errorLog *log.Logger\n    infoLog  *log.Logger\n}\n\n\
  \nfunc main() {\n    ...\n}\n```\n\n然后在 `handlers.go` 文件中更新你的处理程序函数，使它们成为针对 `application`\
  \ 结构体的方法……\n\n文件：`cmd/web/handlers.go`\n\n```go\npackage main\n\nimport (\n    \"\
  fmt\"\n    \"html/template\"\n    \"net/http\"\n    \"strconv\"\n)\n\n// 修改 home\
  \ 处理程序的函数签名，使其定义为针对\n// *application 的方法。\nfunc (app *application) home(w http.ResponseWriter,\
  \ r *http.Request) {\n    if r.URL.Path != \"/\" {\n        http.NotFound(w, r)\n\
  \        return\n    }\n\n    files := []string{\n        \"./ui/html/base.tmpl\"\
  ,\n        \"./ui/html/partials/nav.tmpl\",\n        \"./ui/html/pages/home.tmpl\"\
  ,\n    }\n\n    ts, err := template.ParseFiles(files...)\n    if err != nil {\n\
  \        // 因为 home 处理程序函数现在是 application 的方法\n        // 它可以访问它的字段，包括错误日志记录器。\n\
  \        // 我们将日志消息写入这里而不是标准日志记录器。\n        app.errorLog.Println(err.Error())\n\
  \        http.Error(w, \"Internal Server Error\", 500)\n        return\n    }\n\n\
  \    err = ts.ExecuteTemplate(w, \"base\", nil)\n    if err != nil {\n        //\
  \ 同时更新这里的代码以使用 application 结构体\n        // 中的错误日志记录器。\n        app.errorLog.Println(err.Error())\n\
  \        http.Error(w, \"Internal Server Error\", 500)\n    }\n}\n\n// 修改 snippetView\
  \ 处理程序的函数签名，使其定义为针对\n// *application 的方法。\nfunc (app *application) snippetView(w\
  \ http.ResponseWriter, r *http.Request) {\n    id, err := strconv.Atoi(r.URL.Query().Get(\"\
  id\"))\n    if err != nil || id < 1 {\n        http.NotFound(w, r)\n        return\n\
  \    }\n\n    fmt.Fprintf(w, \"Display a specific snippet with ID %d...\", id)\n\
  }\n\n// 修改 snippetCreate 处理程序的函数签名，使其定义为针对\n// *application 的方法。\nfunc (app *application)\
  \ snippetCreate(w http.ResponseWriter, r *http.Request) {\n    if r.Method != http.MethodPost\
  \ {\n        w.Header().Set(\"Allow\", http.MethodPost)\n        http.Error(w, \"\
  Method Not Allowed\", http.StatusMethodNotAllowed)\n        return\n    }\n\n  \
  \  w.Write([]byte(\"Create a new snippet...\"))\n}\n```\n\n最后，让我们在 `main.go` 文件中将这些内容连接起来：\n\
  \n文件：`cmd/web/main.go`\n\n```go\npackage main\n\nimport (\n    \"flag\"\n    \"\
