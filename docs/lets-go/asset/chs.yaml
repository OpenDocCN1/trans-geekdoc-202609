  \n第 4.9 章。\n\n#### 事务和其他细节\n\n##### database/sql 包\n\n正如你可能开始意识到的，`database/sql`\
  \ 包本质上在你的 Go 应用程序和 SQL 数据库之间提供了一个标准接口。\n\n只要你使用 `database/sql` 包，你编写的 Go 代码通常是可移植的，并且适用于任何类型的\
  \ SQL 数据库——无论是 MySQL、PostgreSQL、SQLite 还是其他。这意味着你的应用程序与你目前使用的数据库之间没有过度耦合，理论上你可以在未来更换数据库而无需重写所有代码（不考虑驱动程序特定的差异和\
  \ SQL 实现）。\n\n\n\n\n\n需要注意的是，虽然 `database/sql` 通常在为操作 SQL 数据库提供标准接口方面表现良好，但不同驱动程序和数据库的运行方式存在一些特殊之处。在使用新的驱动程序之前，仔细阅读其文档以了解任何奇异之处和边缘情况通常是一个好主意。\n\
  \n### 冗长性 (Verbosity)\n\n如果你是从 Ruby、Python 或 PHP 过来的，查询 SQL 数据库的代码可能会让你觉得有点冗长，尤其是习惯了处理抽象层或\
  \ ORM 的话。\n\n但冗长的优点是，我们的代码是非“魔法化”的；我们可以完全精确地理解并控制正在发生什么。随着时间的推移，你会发现构建 SQL 查询的模式会变得熟悉，并且可以从以前的工作中复制粘贴。\n\
  \n如果这种冗长性真的让你感到反感，你可能想要考虑尝试 [`jmoiron/sqlx`](https://github.com/jmoiron/sqlx) 包。它设计良好，并提供了一些很好的扩展，让\
  \ SQL 查询变得更快、更方便。另一个你可能想要考虑的新选项是 [`blockloop/scan`](https://github.com/blockloop/scan)\
  \ 包。\n\n### 管理空值 (Managing null values)\n\nGo 不太擅长的一点是管理数据库记录中的 `NULL` 值。\n\n假设我们\
  \ `snippets` 表中的 `title` 列在某一行中包含 `NULL` 值。如果我们查询该行，那么 `rows.Scan()` 将返回一个错误，因为它无法将\
  \ `NULL` 转换为字符串：\n\n```\nsql: Scan error on column index 1: unsupported Scan, storing\
  \ driver.Value type\n&lt;nil&gt; into type *string\n```\n\n粗略来说，修复此问题的方法是将正在扫描的字段从\
  \ `string` 更改为 `sql.NullString` 类型。请查看 [这个 gist](https://gist.github.com/alexedwards/dc3145c8e2e6d2fd6cd9)\
  \ 获取工作示例。\n\n但是，根据原则，最简单的方法是完全避免使用 `NULL` 值。在你的所有数据库列上设置 `NOT NULL` 约束（正如我们在本书中所做的那样），并根据需要设置合理的\
  \ `DEFAULT` 值。\n\n### 使用事务 (Working with transactions)\n\n重要的是，对 `Exec()`、`Query()`\
  \ 和 `QueryRow()` 的调用可以使用 `sql.DB` 连接池中的任何连接。即使你在代码中紧挨着调用了两次 `Exec()`，也不能保证它们将使用同一个数据库连接。\n\
  \n有时这将是不可接受的。例如，如果你使用 MySQL 的 `LOCK TABLES` 命令锁定了表，你必须在完全相同的连接上调用 `UNLOCK TABLES`\
  \ 以避免死锁。\n\n为了保证使用同一个连接，你可以将多个语句封装在事务中。以下是基本模式：\n\n```\ntype ExampleModel struct\
  \ {\n    DB *sql.DB\n}\n\nfunc (m *ExampleModel) ExampleTransaction() error {\n\
  \    // 在连接池上调用 Begin() 方法会创建一个新的 sql.Tx\n    // 对象，它代表正在进行的数据库事务。\n    tx, err\
  \ := m.DB.Begin()\n    if err != nil {\n        return err\n    }\n\n    // 延迟调用\
  \ tx.Rollback() 以确保它在函数返回之前\n    // 总是被调用。如果事务成功，在调用 tx.Rollback() 时它\n    // 已经提交，使得\
  \ tx.Rollback() 变成一个空操作。\n    // 否则，一旦发生错误，tx.Rollback() 将在函数返回前\n    // 回滚更改。\n\
  \    defer tx.Rollback()\n\n    // 在事务上调用 Exec()，传入你的语句和任何\n    // 参数。需要注意的是，tx.Exec()是在刚创建的\n\
  \    // 事务对象上调用的，而不是连接池。虽然我们\n    // 这里使用了 tx.Exec()，但你也可以以相同的方式\n    // 使用 tx.Query()\
  \ 和 tx.QueryRow()。\n    _, err = tx.Exec(\"INSERT INTO ...\")\n    if err != nil\
  \ {\n        return err\n    }\n\n    // 以完全相同的方式执行另一个事务。\n    _, err = tx.Exec(\"\
  UPDATE ...\")\n    if err != nil {\n        return err\n    }\n\n    // 如果没有错误，事务中的语句可以通过\
  \ tx.Commit()\n    // 方法提交到数据库。\n    err = tx.Commit()\n    return err\n}\n```\n\
  \n如果你想将多个 SQL 语句作为单个原子操作执行，事务也超级有用。只要在发生任何错误时使用 [`tx.Rollback()`](https://pkg.go.dev/database/sql/#Tx.Rollback)\
  \ 方法，事务就能确保以下情况：\n\n*   所有语句都成功执行；或\n\n*   没有任何语句被执行且数据库保持不变。\n\n### 预编译语句 (Prepared\
  \ statements)\n\n正如我之前提到的，`Exec()`、`Query()` 和 `QueryRow()` 方法在背后都使用预编译语句来帮助防止 SQL\
  \ 注入攻击。它们在数据库连接上设置一个预编译语句，使用提供的参数运行它，然后关闭预编译语句。\n\n这可能让人觉得相当低效，因为我们每次都在创建和重新创建相同的预编译语句。\n\
  \n在理论上，更好的方法可能是利用 [`DB.Prepare()`](https://pkg.go.dev/database/sql/#DB.Prepare)\
  \ 方法创建一次我们自己的预编译语句，并重用它。这对于复杂的 SQL 语句（例如那些具有多个 JOIN 的语句）以及非常频繁重复的语句（例如批量插入数万条记录）来说尤为真实。在这种情况下，重新准备语句的成本可能会对运行时间产生明显影响。\n\
  \n是在 Web 应用程序中使用自定义预编译语句的基本模式：\n\n```go\n// 我们需要一个地方来存储整个 Web 应用程序生命周期\n// 内预编译语句。一种巧妙的方法是与连接池\n\
  // 一起嵌入模型中。\ntype ExampleModel struct {\n    DB         *sql.DB\n    InsertStmt\
  \ *sql.Stmt\n}\n\n// 为模型创建一个构造函数，在其中我们设置\n// 预编译语句。\nfunc NewExampleModel(db *sql.DB)\
  \ (*ExampleModel, error) {\n    // 使用 Prepare 方法为当前连接池创建一个\n    // 预编译语句。这返回一个代表预编译\n\
  \    // 语句的 sql.Stmt 对象。\n    insertStmt, err := db.Prepare(\"INSERT INTO ...\"\
  )\n    if err != nil {\n        return nil, err\n    }\n\n    // 将其存储在模型对象中，与连接池一起。\n\
  \    return &ExampleModel{db, insertStmt}, nil\n}\n\n// 实现 ExampleModel 的任何方法都可以访问\n\
  // 预编译语句。\nfunc (m *ExampleModel) Insert(args...) error {\n    // 注意我们直接在预编译语句上调用\
  \ Exec\n    // 而不是连接池？预编译语句也支持\n    // Query 和 QueryRow 方法。\n    _, err := m.InsertStmt.Exec(args...)\n\
  \n    return err\n}\n\n// 在 Web 应用程序的 main 函数中，我们需要使用\n// 构造函数初始化 ExampleModel。\n\
  func main() {\n    db, err := sql.Open(...)\n    if err != nil {\n        errorLog.Fatal(err)\n\
  \    }\n    defer db.Close()\n\n    // 创建一个新的 ExampleModel 对象，它包含了预编译语句。\n    exampleModel,\
  \ err := NewExampleModel(db)\n    if err != nil {\n       errorLog.Fatal(err)\n\
  \    }\n\n    // 延迟调用预编译语句的 Close() 以确保它\n    // 在 main 函数终止之前被正确关闭。\n    defer\
  \ exampleModel.InsertStmt.Close()\n}\n```\n\n不过，有几点需要注意。\n\n预编译语句存在于*数据库连接*中。因此，由于\
  \ Go 使用多个数据库连接池，实际情况是第一次使用预编译语句（即 `sql.Stmt` 对象）时，它是在特定的数据库连接上创建的。`sql.Stmt` 对象随后会记住使用了池中的哪一个连接。下一次，`sql.Stmt`\
  \ 对象将尝试再次使用同一个数据库连接。如果该连接已关闭或正在使用（即非空闲），则将在将在另一个连接上重新准备。\n\n\n\n\n在重负载负载下，可能会在多个连接上创建大量的预处理语句。这可能导致语句被准备和重新准备的频率比你预期的要高——甚至会遇到服务器对语句数量的限制（在\
  \ MySQL 中，默认最大值为 16,382 个预处理语句）。\n\n代码也比不使用预处理语句要复杂。\n\n因此，在性能和复杂性之间需要进行权衡。与其他任何事情一样，你应该衡量实现自定义预处理语句的实际性能收益，以确定其是否值得。对于大多数情况，我建议使用常规的\
  \ `Query()`、`QueryRow()` 和 `Exec()` 方法——无需自己准备预处理语句——是一个合理的起点。\n\n# 第 5 章 动态 HTML\
  \ 模板\n\n在本书的这一节中，我们将集中于将 MySQL 数据库中的动态数据显示在适当的 HTML 页面。\n\n你将学习如何：\n\n*   以一种简单、可扩展且类型安全的方式将动态数据\
  \ 传递给你的 HTML 模板。\n*   使用 Go 的 `html/template` 包中的各种动作和函数 来控制动态数据的显示。\n*   创建模板缓存，使得你的模板不需要为每个\
  \ HTTP 请求都从磁盘读取。\n*   在运行时优雅地处理模板渲染错误。\n*   实现一种模式，用于向你的网页传递常用动态数据 而不重复代码。\n*  \
  \ 创建你自己的自定义函数，在 HTML 模板中格式化并显示数据。\n\n## 第 5.1 节 显示动态数据\n\n目前，我们的 `snippetView` 处理函数从数据库获取一个\
  \ `models.Snippet` 对象，然后将其内容以纯文本 HTTP 响应的形式输出。\n\n在这一节中，我们将更新代码，使数据显示在适当的 HTML 网页中，看起来大致如下：\n\
  \n![05.01-01.png](img/05.01-01.png)\n\n让我们从 `snippetView` 处理函数开始，添加一些代码来渲染一个新的 `view.tmpl`\
  \ 模板文件（我们稍后会创建它）。希望这对你在本书之前的内容中看起来很熟悉。\n\n文件：`cmd/web/handlers.go`\n\n```go\npackage\
  \ main\n\nimport (\n    \"errors\"\n    \"fmt\"\n    \"html/template\" // 取消注释\n\
  \    \"net/http\"\n    \"strconv\"\n\n    \"snippetbox.alexedwards.net/internal/models\"\
  \n)\n\n...\n\nfunc (app *application) snippetView(w http.ResponseWriter, r *http.Request)\
  \ {\n    id, err := strconv.Atoi(r.URL.Query().Get(\"id\"))\n    if err != nil ||\
  \ id < 1 {\n        app.notFound(w)\n        return\n    }\n\n    snippet, err :=\
  \ app.snippets.Get(id)\n    if err != nil {\n        if errors.Is(err, models.ErrNoRecord)\
  \ {\n            app.notFound(w)\n        } else {\n            app.serverError(w,\
  \ err)\n        }\n        return\n    }\n\n    // 初始化一个包含 view.tmpl 路径的切片，\n  \
  \  // 加上我们之前创建的基础布局和导航部分。\n    files := []string{\n        \"./ui/html/base.tmpl\"\
  ,\n        \"./ui/html/partials/nav.tmpl\",\n        \"./ui/html/pages/view.tmpl\"\
  ,\n    }\n\n    // 解析模板文件\n    ts, err := template.ParseFiles(files...)\n    if\
  \ err != nil {\n        app.serverError(w, err)\n        return\n    }\n\n    //\
  \ 然后执行它们。注意我们是如何将 snippet\n    // 数据（一个 models.Snippet 结构体）作为最后一个参数传递的。\n    err\
  \ = ts.ExecuteTemplate(w, \"base\", snippet)\n    if err != nil {\n        app.serverError(w,\
  \ err)\n    }\n}\n```\n接下来，我们需要创建 `view.tmpl` 文件，其中包含页面的 HTML 标记。但在在此之前，有一点理论需要我解释……\n\
  \n在你的 HTML 模板中，你传递的任何动态数据都由 `.`（称为 `dot`）表示。在这种特定情况下，`.` 的底层类型将是 `models.Snippet`\
  \ 结构体。当 `.` 的底层类型为结构体时，你可以通过在 `.` 后面跟上字段名来在模板中渲染任何导出字段的值。因此，由于我们的 `models.Snippet`\
  \ 结构体有一个 `Title` 字段，我们可以在模板中通过 `{{.Title}}` 来输出代码片段的标题。\n\n我将演示一下。在 `ui/html/pages/view.tmpl`\
  \ 创建新文件：\n\n```bash\ntouch ui/html/pages/view.tmpl\n```\n\n文件：`ui/html/pages/view.tmpl`\n\
  \n```html\n{{define \"title\"}}Snippet #.ID}}{{end}}\n\n{{define \"main\"}}\n  \
  \  <div class='snippet'>\n        <div class='metadata'>\n            <strong>{{.Title}}</strong>\n\
  \            <span>{{.ID}}</span>\n        </div>\n        <pre>code{{.Content}}</code></pre>\n\
  \        <div class='metadata'>\n            <time>Created: {{.Created}}</time>\n\
  \            <time>Expires: {{.Expires}}</time>\n        </div>\n    </div>\n{{end}}\n\
  ```\n\n如果你重启应用程序并在浏览器中访问 `http://localhost:4000/snippet/view?id=1`，你应该发现相关的代码片段已从数据库获取、传递到模板，并且内容被正确渲染。\n\
  \n![](img/05.01-02.png)\n\n### 渲染多条数据\n\n需要解释的一个重要点是，Go 的 `html/template` 包允许在渲染模板时传递一个——且仅一个动态数据项。但在实际应用中，通常有多个你想要在同一页面中显示的动态数据。\n\
  \n实现此点的轻量级且类型安全的方法是将你的动态数据封装在一个结构体中，该结构体充当数据的单一“持有结构体”。让我们创建一个新的 `cmd/web/templates.go`\
  \ 文件，包含一个 `templateData` 结构体来执行此操作。\n\n```bash\ntouch cmd/web/templates.go\n```\n\
  \n文件：`cmd/web/templates.go`\n\n```go\npackage main\n\nimport \"snippetbox.alexedwards.net/internal/models\"\
  \n\n// 定义一个 templateData 类型作为任何我们想要传递\n// 给 HTML 模板的动态数据的持有结构。\n// 目前它只包含一个字段，但随着构建的进展，我们将向其中添加更多。\n\
  type templateData struct {\n    Snippet *models.Snippet\n}\n```\n\n然后让我们更新 `snippetView`\
  \ 处理函数，在执行模板时使用这个新结构体：\n\n文件：`cmd/web/handlers.go`\n\n```go\npackage main\n\n...\n\
  \nfunc (app *application) snippetView(w http.ResponseWriter, r *http.Request) {\n\
  \    id, err := strconv.Atoi(r.URL.Query().Get(\"id\"))\n    if err != nil || id\
  \ < 1 {\n        app.notFound(w)\n        return\n    }\n\n    snippet, err := app.snippets.Get(id)\n\
  \    if err != nil {\n        if errors.Is(err, models.ErrNoRecord) {\n        \
  \    app.notFound(w)\n        } else {\n            app.serverError(w, err)\n  \
  \      }\n        return\n    }\n\n    files := []string{\n        \"./ui/html/base.tmpl\"\
  ,\n        \"./ui/html/partials/nav.tmpl\",\n        \"./ui/html/pages/view.tmpl\"\
  ,\n    }\n\n    ts, err := template.ParseFiles(files...)\n    if err != nil {\n\
  \        app.serverError(w, err)\n        return\n    }\n\n    // 创建一个持有代码片段数据的\
  \ templateData 结构体实例。\n    data := &templateData{\n        Snippet: snippet,\n \
  \   }\n\n    // 执行模板时传递 templateData 结构体。\n    err = ts.ExecuteTemplate(w, \"base\"\
  , data)\n    if err != nil {\n        app.serverError(w, err)\n    }\n}\n\n...\n\
  ```\n\n现在，我们的代码片段数据包含在 `templateData` 结构体的 `models.Snippet` 结构体中。要输出数据，我们需要像这样链接相应的字段名：\n\
  \n\n\n\n\n```\n{{define \"title\"}}Snippet #{{.Snippet.ID}}{{end}}\n\n{{define \"\
  main\"}}\n    <div class='snippet'>\n        <div class='metadata'>\n          \
  \  <strong>{{.Snippet.Title}}</strong>\n            <span>#{{.Snippet.ID}}</span>\n\
  \        </div>\n        <pre><code>{{.Snippet.Content}}</code></pre>\n        <div\
  \ class='metadata'>\n            <time>Created: {{.Snippet.Created}}</time>\n  \
  \          <time>Expires: {{.Snippet.Expires}}</time>\n        </div>\n    </div>\n\
  {{end}}\n```\n\n你可以自由重启应用程序并再次访问 `http://localhost:4000/snippet/view?id=1`。你应该能在浏览器中看到与之前相同的渲染页面。\n\
  \n***\n\n# 第 5.2 节 \n\n### 附加信息\n\n### 动态内容转义\n\n`html/template` 包会自动转义任何输出在 `{{\
  \ }}` 标签之间的数据。这种行为对于避免跨站脚本交叉（XSS）攻击非常有帮助，这也是为什么你应该使用 `html/template` 包而不是 Go 提供的更通用的\
  \ `text/template` 包的原因。\n\n作为一个转义的示例，如果你想要输出的动态数据是：\n\n```\n<span>{{\"<script>alert('xss\
  \ attack')</script>\"}}</span>\n```\n\n它将被无害地渲染为：\n\n```\n<span>&lt;script&gt;alert(&#39;xss\
  \ attack&#39;)&lt;/script&gt;</span>\n```\n\n`html/template` 包足够智能，可以根据上下文进行转义。它将根据数据渲染在页面中包含\
  \ HTML、CSS、Javascript 或 URI 的部分，使用相应的转义序列。\n\n### 嵌套模板\n\n非常重要的一，当你从一个模板调用另一个模板时，点（dot）需要显式地传递或通过管道（pipeline）传递给调用的模板。你通过在每个\
  \ `{{template}}` 或 `{{block}}` 动作的最后包含它来实现，如下：\n\n```\n{{template \"main\" .}}\n\
  {{block \"sidebar\" .}}{{end}}\n```\n\n作为一条原则，我的建议是养成一种习惯：每当你使用 `{{template}}` 或\
  \ `{{block}}` 动作调用模板时，始终对点进行管道操作，除非你有充分理由不这样做。\n\n### 调用方法\n\n如果你在 `{{ }}` 标签之间输出的类型定义了方法，你就可以调用这些方法（只要它们是导出的并且它们只返回一个值——或者一个值和一个错误）。\n\
  \n例如，如果 `.Snippet.Created` 的底层类型是 `time.Time`（确实如此），你可以通过调用它的 `Weekday()` 方法来渲染星期几的，如下：\n\
  \n```\n<span>{{.Snippet.Created.Weekday}}</span>\n```\n\n你也可以向方法传递参数。例如，你可以使用 `AddDate()`\
  \ 方法为时间增加六个月，如下：\n\n```\n<span>{{.Snippet.Created.AddDate 0 6 0}}</span>\n```\n\n\
  注意，这与 Go 中调用函数的语法不同——参数没有被括号包围，并且用单个空格分隔，而不是逗号。\n\n### HTML 注释\n\n最后，`html/template`\
  \ 包总是会移除你在模板中包含的任何 HTML 注释，包括任何条件注释。\n\n其原因是为了在渲染动态内容时帮助避免 XSS 攻击。允许条件注释意味着 Go 并不总是能够预测浏览器将如何解释页面中的标记，因此它不一定能够正确地转义一切。为了解决这个问题，Go\
  \ 简单地删除了所有的 HTML 注释。\n\n## 模板动作和函数\n\n在本节中，我们将查看 Go 提供的模板动作和函数。\n\n我们已经讨论过一些动作——`{{define}}`、`{{template}}`\
  \ 和 `{{block}}`——但还有三个你可以用于控制动态数据的动作——`{{if}}`、`{{with}}` 和 `{{range}}`。\n\n| 动作\
  \ | 描述 |\n| --- | --- |\n| `{{if .Foo}} C1 {{else}} C2 {{end}}` | 如果 `.Foo` 不为空，则渲染内容\
  \ C1，否则渲染内容 C2。 |\n| `{{with .Foo}} C1 {{else}} C2 {{end}}` | 如果 `.Foo` 不为空，则点设置为\
  \ `.Foo` 的值并渲染内容 C1，否则渲染内容 C2。 |\n| `{{range .Foo}} C1 {{else}} C2 {{end}}` | 如果\
  \ `.Foo` 的长度大于零，则遍历每个元素，将点设置为每个元素的值并渲染内容 C1。如果 `.Foo` 的长度为零，则渲染内容 C2。`.Foo` 的底层类型必须是数组、切片、map\
  \ 或通道。 |\n\n关于这些动作有几需要指出：\n\n- 对于所有三个动作，`{{else}}` 子句都是可选的。例如，你可以写 `{{if .Foo}}\
  \ C1 {{else}} C2 {{end}}`。\n- `html/template` 包还提供了一些函数，你可以使用它们为你的模板添加额外的逻辑。你可以找到函数的完整列表：\n\
  \n| 函数 | 描述 |\n| --- | --- |\n| `{{eq .Foo .Bar}}` | 如果 `.Foo` 等于 `.Bar` 则输出 true\
  \ |\n| `{{ne .Foo .Bar}}` | 如果 `.Foo` 不等于 `.Bar` 则输出 true |\n| `{{not .Foo}}` |\
  \ 输出 `.Foo` 的布尔取反 |\n| `{{or .Foo .Bar}}` | 如果 `.Foo` 不为空，则输出 `.Foo`；否则输出 `.Bar`\
  \ |\n| `{{index .Foo i}}` | 输出 `.Foo` 在索引 `i` 处的值 |\n| `{{printf \"%s-%s\" .Foo\
  \ .Bar}}` | 输出包含 `.Foo` 和 `.Bar` 的格式化字符串 |\n| `{{len .Foo}}` | 输出 `.Foo` 的长度作为整数\
  \ |\n| `{{$bar := len .Foo}}` | 将 `.Foo` 的长度赋值给模板变量 `$bar` |\n\n- 重要的是要理解 `with`\
  \ 和 `range` 动作会改变点的值。一旦你开始使用它们，点代表什么取决于你所处的位置。如果你想存储函数的结果并在模板的多个地方使用它，模板变量将特别有用。变量名必须以美元符号开头，并且仅能包含字母和数字。\n\
  \n### 使用 with 动作\n\n使用 `{{with}}` 动作的一个好机会是我们在上一章创建的 `view.tmpl` 文件。请按照所示更新它：\n\n\
  File: ui/html/pages/view.tmpl\n\n```\n{{define \"title\"}}Snippet #{{.Snippet.ID}}{{end}}\n\
  \n{{define \"main\"}}\n    {{with .Snippet}}\n    <div class='snippet'>\n      \
  \  <div class='metadata'>\n            <strong>{{.Title}}</strong>\n           \
  \ <span>#{{.ID}}</span>\n        </div>\n        <pre><code>{{.Content}}</code></pre>\n\
  \        <div class='metadata'>\n            <time>Created: {{.Created}}</time>\n\
  \            <time>Expires: {{.Expires}}</time>\n        </div>\n    </div>\n  \
  \  {{end}}\n{{end}}\n```\n\n现在，在 `{{with .Snippet}}` 和对应的 `{{end}}` 标签之间，点的值设置为\
  \ `.Snippet`。点本质上变成了 `models.Snippet` 结构，而不是父级的 `templateData` 结构。\n\n### 使用 if\
  \ 和 range 动作\n\n让我们在一个具体的示例中也使用 `{{if}}` 和 `{{range}}` 动作，并更新我们的主页以显示最新片段的表格，类似于这样：\n\
  \n![05.02-01.png](img/05.02-01.png)\n\n首先更新 `templateData` 结构体，使其包含一个用于持有片段切片的 `Snippets`\
  \ 字段，如下：\n\nFile: cmd/web/templates.go\n\n\n\n\n\n```go\npackage main\n\nimport\
  \ \"snippetbox.alexedwards.net/internal/models\"\n\n// 在 templateData struct 中包含一个\
  \ Snippets 字段。\ntype templateData struct {\n    Snippet  *models.Snippet\n    Snippets\
  \ []*models.Snippet\n}\n```\n\n然后更新 `home` 处理函数，以便从我们的数据库模型中获取最新的片段，并将它们传递给 `home.tmpl`\
  \ 模板：\n\n文件：`cmd/web/handlers.go`\n\n```go\npackage main\n\n...\n\nfunc (app *application)\
  \ home(w http.ResponseWriter, r *http.Request) {\n    if r.URL.Path != \"/\" {\n\
  \        app.notFound(w)\n        return\n    }\n\n    snippets, err := app.snippets.Latest()\n\
  \    if err != nil {\n        app.serverError(w, err)\n        return\n    }\n\n\
  \    files := []string{\n        \"./ui/html/base.tmpl\",\n        \"./ui/html/partials/nav.tmpl\"\
  ,\n        \"./ui/html/pages/home.tmpl\",\n    }\n\n    ts, err := template.ParseFiles(files...)\n\
  \    if err != nil {\n        app.serverError(w, err)\n        return\n    }\n\n\
  \    // 创建一个 templateData struct 实例，用于持有片段切片（slice of snippets）。\n    data := &templateData{\n\
  \        Snippets: snippets,\n    }\n\n    // 执行模板时传递 templateData struct。\n   \
  \ err = ts.ExecuteTemplate(w, \"base\", data)\n    if err != nil {\n        app.serverError(w,\
  \ err)\n    }\n}\n\n...\n```\n\n现在，让我们进入 `ui/html/pages/home.tmpl` 文件并更新它，使用 `{{if}}`\
  \ 和 `{{range}}` 动作在表格中显示这些片段。具体来说：\n\n- 我们想使用 `{{if}}` 动作来检查片段切片是否为空。如果为空，我们想显示\
  \ `\"There's nothing to see here yet!\"` 消息。否则，我们想渲染一个包含片段信息的表格。\n- 我们想使用 `{{range}}`\
  \ 动作遍历切片中的所有片段，在表格行中渲染每个片段的内容。\n\n以下是标记代码：\n\n文件：`ui/html/pages/home.tmpl`\n\n```html\n\
  {{define \"title\"}}Home{{end}}\n\n{{define \"main\"}}\n    <h2>Latest Snippets</h2>\n\
  \    {{if .Snippets}}\n     <table>\n        <tr>\n            <th>Title</th>\n\
  \            <th>Created</th>\n            <th>ID</th>\n        </tr>\n        {{range\
  \ .Snippets}}\n        <tr>\n            <td><a href='/snippet/view?id={{.ID}}'>{{.Title}}</a></td>\n\
  \            <td>{{.Created}}</td>\n            <td>#{{.ID}}</td>\n        </tr>\n\
  \        {{end}}\n    </table>\n    {{else}}\n        <p>There's nothing to see\
  \ here... yet!</p>\n    {{end}}\n{{end}}\n```\n\n确保所有文件都已保存，重启应用并在由于已保存（无需重启）在网络浏览器中访问\
  \ [`http://localhost:4000`](http://localhost:4000/)。如果一切都按计划进行，你应该看到一个看起来像这样的页面：\n\
  \n![](img/05.02-02.png)\n\n### 附加信息\n\n### 组合函数\n\n你可以在模板标签中组合多个函数，根据需要使用圆括号 `()`\
  \ 包围函数及其参数。\n\n例如，当 `Foo` 的长度大于 99 时，以下标签将渲染内容 `C1`：\n\n```go\n{{if (gt (len .Foo)\
  \ 99)}} C1 {{end}}\n```\n\n或者作为另一个例子，当 `.Foo` 等于 1 且 `.Bar` 小于或等于 20 时，以下标签将渲染内容\
  \ `C1`：\n\n```go\n{{if (and (eq .Foo 1) (le .Bar 20))}} C1 {{end}}\n```\n\n### 控制循环行为\n\
  \n在 `{{range}}` 动作内部，你可以使用 `{{break}}` 命令提前结束循环，并使用 `{{continue}}` 跳到下一次迭代。\n\n\
  ### 缓存模板\n\n为了避免在每次请求时重新解析模板文件，我们可以将它们缓存在一个映射（map）中。\n\n文件：`cmd/templates.go`\n\n\
  ```go\nfunc newTemplateCache() (map[string]*template.Template, error) {\n    cache\
  \ := make(map[string]*template.Template)\n\n    files := []string{\n        \"./ui/html/base.tmpl\"\
  ,\n        \"./ui/html/partials/nav.tmpl\",\n    }\n\n    pages, err := filepath.Glob(\"\
  ./ui/html/pages/*.tmpl\")\n    if err != nil {\n        return nil, err\n    }\n\
  \n    for _, page := range pages {\n        ts, err := template.ParseFiles(append(files,\
  \ page)...)\n        if err != nil {\n            return nil, err\n        }\n\n\
  \        cache[filepath.Base(page)] = ts\n    }\n\n    return cache, nil\n}\n```\n\
  \n\n\n\n此时，我们已经为每个页面准备了相关模板集合的内存缓存，并且我们的处理程序可以通过 `application` 结构体访问此缓存。\n\n现在让我们解决第二个问题：代码重复，并创建一个辅助方法，以便我们可以轻松地从缓存中渲染模板。\n\
  \n打开你的 `cmd/web/helpers.go` 文件并添加以下 `render()` 方法：\n\n文件：`cmd/web/helpers.go`\n\n\
  ```\npackage main\n\n...\n\nfunc (app *application) render(w http.ResponseWriter,\
  \ status int, page string, data *templateData) {\n    // 根据页面名称（如 'home.tmpl'）从缓存中检索相应的\n\
  \    // 模板集。如果缓存中不存在该名称的条目，\n    // 则创建一个错误并调用我们之前创建的 serverError() 辅助\n    // 方法并返回。\n\
  \    ts, ok := app.templateCache[page]\n    if !ok {\n        err := fmt.Errorf(\"\
  the template %s does not exist\", page)\n        app.serverError(w, err)\n     \
  \   return\n    }\n\n    // 写入提供的 HTTP 状态码（'200 OK', '400 Bad Request'\n    // 等）。\n\
  \    w.WriteHeader(status)\n\n    // 执行模板集并写入响应体。再次，如果发生\n    // 错误，我们就调用 serverError()\
  \ 辅助方法。\n    err := ts.ExecuteTemplate(w, \"base\", data)\n    if err != nil {\n\
  \        app.serverError(w, err)\n    }\n}\n```\n\n完成后，我们现在就可以看到这些更改带来的收益，并可以大幅简化处理程序中的代码：\n\
  \n文件：`cmd/web/handlers.go`\n\n```\npackage main\n\nimport (\n    \"errors\"\n  \
  \  \"fmt\"\n    \"net/http\"\n    \"strconv\"\n\n    \"snippetbox.alexedwards.net/internal/models\"\
  \n)\n\nfunc (app *application) home(w http.ResponseWriter, r *http.Request) {\n\
  \    if r.URL.Path != \"/\" {\n        app.notFound(w)\n        return\n    }\n\n\
  \    snippets, err := app.snippets.Latest()\n    if err != nil {\n        app.serverError(w,\
  \ err)\n        return\n    }\n\n    // 使用新的 render 辅助方法。\n    app.render(w, http.StatusOK,\
  \ \"home.tmpl\", &templateData{\n        Snippets: snippets,\n    })\n}\n\nfunc\
  \ (app *application) snippetView(w http.ResponseWriter, r *http.Request) {\n   \
  \ id, err := strconv.Atoi(r.URL.Query().Get(\"id\"))\n    if err != nil || id <\
  \ 1 {\n        app.notFound(w)\n        return\n    }\n\n    snippet, err := app.snippets.Get(id)\n\
  \    if err != nil {\n        if errors.Is(err, models.ErrNoRecord) {\n        \
  \    app.notFound(w)\n        } else {\n            app.serverError(w, err)\n  \
  \      }\n        return\n    }\n\n    // 使用新的 render 辅助方法。\n    app.render(w, http.StatusOK,\
  \ \"view.tmpl\", &templateData{\n        Snippet: snippet,\n    })\n}\n\n...\n```\n\
  \n如果你重启应用程序并尝试再次访问 [`http://localhost:4000`](http://localhost:4000/) 和 [`http://localhost:4000/snippet/view?id=1`](http://localhost:4000/snippet/view?id=1)，你应该会看到页面渲染方式与之前完全相同。\n\
  \n![](img/05.03-01.png)![](img/05.03-02.png)\n\n### 自动解析部分组件 (partials)\n\n在继续之前，让我们让\
  \ `templateCache()` 函数更灵活一些，使其自动解析 `ui/partials` 文件夹中的模板，而不仅仅是 `nav.tmpl`。这将为我们在未来想要添加部分组件时节省时间并避免潜在的错误。\n\
  \n文件：`cmd/web/templates.go`\n\n```go\nfunc (app *application) templateCache() (map[string]*template.Template,\
  \ error) {\n    cache := make(map[string]*template.Template)\n\n    pages, err :=\
  \ filepath.Glob(\"./ui/templates/*.tmpl\")\n    if err != nil {\n        return\
  \ nil, err\n    }\n\n    for _, page := range pages {\n        name := filepath.Base(page)\n\
  \        ts, err := template.New(name).ParseFiles(page)\n        if err != nil {\n\
  \            return nil, err\n        }\n\n        partials, err := filepath.Glob(\"\
  ./ui/partials/*.tmpl\")\n        if err != nil {\n            return nil, err\n\
  \        }\n\n        for _, partial := range partials {\n            _, err = ts.ParseFiles(partial)\n\
  \            if err != nil {\n                return nil, err\n            }\n \
  \       }\n\n        cache[name] = ts\n    }\n\n    return cache, nil\n}\n```\n\n\
  ## 5.4 捕捉运行时错误\n\n一旦我们开始为 HTML 添加动态行为，就会面临运行时错误的风险。\n\n让我们在 `view.tmpl` 中添加一个故意的错误看看会发生什么：\n\
  \n文件：`ui/html/pages/view.tmpl`\n\n```html\n{{define \"main\"}}\n    {{with .Snippet}}\n\
  \    <div class='snippet'>\n        <div class='metadata'>\n            <strong>{{.Title}}</strong>\n\
  \            <span>{{len}} <!-- Deliberate error -->\n        <pre>{{.Content}}</pre>\n\
  \        <div class='metadata'>\n            Created: {{.Created}}\n        </div>\n\
  \    </div>\n    {{end}}\n{{end}}\n```\n\n在上面的标记中，我们添加了 `{{len}}`，在 Go 中 `nil` 值没有长度，会导致错误。\n\
  \n尝试运行应用程序。你会发现它仍然可以编译：\n\n```bash\n$ go run ./cmd/web\nINFO    2022/02/01 10:20:21\
  \ Starting server on :4000\n```\n\n如果你使用 curl 请求 [`http://localhost:4000/snippet/view?id=1`](http://localhost:4000/snippet/view?id=1)，你会得到类似这样的响应：\n\
  \n```bash\n$ curl -i \"http://localhost:4000/snippet/view?id=1\"\nHTTP/1.1 200 OK\n\
  Date: Tue, 01 Feb 2022 09:20:49 GMT\nContent-Length: 762\nContent-Type: text/html;\
  \ charset=utf-8\n\n\n<!doctype html>\n<html lang='en'>\n    <head>\n        <meta\
  \ charset='utf-8'>\n        <title>Snippet #1 - Snippetbox</title>\n         \n\
  \        <link rel='stylesheet' href='/static/css/main.css'>\n        <link rel='shortcut\
  \ icon' href='/static/img/favicon.ico' type='image/x'>\n        \n        <link\
  \ rel='stylesheet' href='https://fonts.googleapis.com/css?family=Ubuntu+Mono:400,700'>\n\
  \    </head>\n    <body>\n        <header>\n            <h1><a href='/'>Snippetbox</a></h1>\n\
  \        </header>\n        \n        \n <nav>\n    <a href='/'>Home</a>\n</nav>\n\
  \n        <main>\n            \n    \n    <div class='snippet'>\n        <div class='metadata'>\n\
  \            <strong>An old silent pond</strong>\n            <span>#1</span>\n\
  \        </div>\n        Internal Server Error\n    </div>\n    </main>\n    </body>\n\
  </html>\n```\n\n这非常糟糕。我们的应用程序抛出了错误，但用户被错误地收回了 `200 OK` 响应。更糟糕的是，他们接收到了一个不完整的 HTML\
  \ 页面。\n\n为了修复这个问题，我们需要让模板渲染变成两个阶段的过程。首先，我们应该通过将模板写入缓冲区（buffer）来进行“尝试”渲染。如果失败了，我们可以向用户返回错误消息。但如果成功了，我们就可以将缓冲区的内容写入我们的\
  \ `http.ResponseWriter`。\n\n让我们更新 `render()` 辅助方法以使用这种方法：\n\n文件：`cmd/web/helpers.go`\n\
  \n\n\n```go\npackage main\n\nimport (\n    \"bytes\" // New import\n    \"fmt\"\n\
  \    \"net/http\"\n    \"runtime/debug\"\n)\n\n...\n\nfunc (app *application) render(w\
  \ http.ResponseWriter, status int, page string, data *templateData) {\n    ts, ok\
  \ := app.templateCache[page]\n    if !ok {\n        err := fmt.Errorf(\"the template\
  \ %s does not exist\", page)\n        app.serverError(w, err)\n        return\n\
  \    }\n\n    // Initialize a new buffer.\n    buf := new(bytes.Buffer)\n\n    //\
  \ Write the template to the buffer, instead of straight to the\n    // http.ResponseWriter.\
  \ If there's an error, call our serverError() helper\n    // and then return.\n\
  \    err := ts.ExecuteTemplate(buf, \"base\", data)\n    if err != nil {\n     \
  \   app.serverError(w, err)\n        return\n    }\n\n    // If the template is\
  \ written to the buffer without any errors, we are safe\n    // to go ahead and\
  \ write the HTTP status code to http.ResponseWriter.\n    w.WriteHeader(status)\n\
  \n    // Write the contents of the buffer to the http.ResponseWriter. Note: this\n\
  \    // is another time where we pass our http.ResponseWriter to a function that\n\
  \    // takes an io.Writer.\n    buf.WriteTo(w)\n}\n```\n\n重启应用程序并尝试再次发送请求。你现在应该会得到正确的错误信息和\
  \ `500 Internal Server Error` 响应。\n\n```\n$ curl -i \"http://localhost:4000/snippet/view?id=1\"\
  \nHTTP/1.1 500 Internal Server Error\nContent-Type: text/plain; charset=utf-8\n\
  X-Content-Type-Options: nosniff\nDate: Tue, 01 Feb 2022 09:30:33 GMT\nContent-Length:\
  \ 22\n\nInternal Server Error\n```\n\n太棒了。这看起来好多了。\n\n在进入下一个章节之前，回到 `view.tmpl`\
  \ 文件并删除那个故意遗留的错误：\n\n文件：`ui/html/pages/view.tmpl`\n\n```\n{{define \"title\"}}Snippet\
  \ #{{.Snippet.ID}}{{end}}\n\n{{define \"main\"}}\n    {{with .Snippet}}\n    <div\
  \ class='snippet'>\n        <div class='metadata'>\n            <strong>{{.Title}}</strong>\n\
  \            <span>#{{.ID}}</span>\n        </div\n        <pre><code>{{.Content}}</code></pre>\n\
  \        <div class='metadata'>\n            <time>Created: {{.Created}}</time>\n\
  \            <time>Expires: {{.Expires}}</time>\n        </div\n    </div\n    {{end}}\n\
  {{end}}\n```\n\n# 第 5.5 章\n\n## 常见的动态数据\n\n在某些 Web 应用中，可能存在你希望包含在多个——甚至是每个——网页中的常见动态数据。例如，你可能希望在所有带有表单的页面包含当前用户的用户名和头像，或者\
  \ CSRF 令牌。\n\n在案例中，让我们从简单的内容开始，假设我们想在每个页面的页脚包含当前年份。\n\n为了实现这一点，我们首先要在 `templateData`\
  \ 结构体中添加一个新的 `CurrentYear` 字段，如下所示：\n\n文件：`cmd/web/templates.go`\n\n```\npackage\
  \ main\n\n...\n\n// 为 templateData 结构体添加 CurrentYear 字段。\ntype templateData struct\
  \ {\n    CurrentYear int\n    Snippet     *models.Snippet\n    Snippets    []*models.Snippet\n\
  }\n\n...\n```\n\n下一步是为我们的应用程序添加一个 `newTemplateData()` 辅助方法，它将返回一个初始化了当前年份的 `templateData`\
  \ 结构体。\n\n我将演示：\n\n文件：`cmd/web/helpers.go`\n\n```go\npackage main\n\nimport (\n\
  \    \"bytes\"\n    \"fmt\"\n    \"net/http\"\n    \"runtime/debug\"\n    \"time\"\
  \ // New import\n)\n\n...\n\n// 创建一个 newTemplateData() 辅助函数，返回一个指向初始化了当前年份\n// templateData\
  \ 结构体的指针。注意，我们目前还没有使用\n// *http.Request 参数，但我们稍后会在书中用到。\nfunc (app *application)\
  \ newTemplateData(r *http.Request) *templateData {\n    return &templateData{\n\
  \        CurrentYear: time.Now().Year(),\n    }\n}\n\n...\n```\n\n然后，让我们更新 `home`\
  \ 和 `snippetView` 处理器以使用 `newTemplateData()` 辅助函数，如下：\n\n文件：`cmd/web/handlers.go`\n\
  \n```go\npackage main\n\n...\n\nfunc (app *application) home(w http.ResponseWriter,\
  \ r *http.Request) {\n    if r.URL.Path != \"/\" {\n        app.notFound(w)\n  \
  \      return\n    }\n\n    snippets, err := app.snippets.Latest()\n    if err !=\
  \ nil {\n        app.serverError(w, err)\n        return\n    }\n\n    // 调用 newTemplateData()\
  \ 辅助函数以获取包含 'default' 数据\n    // 的 templateData 结构体（目前只是当前年份），并将 snippets \n   \
  \ // 切片添加到其中。\n    data := app.newTemplateData(r)\n    data.Snippets = snippets\n\
  \n    // 像往一样将数据传递给 render() 辅助函数。\n    app.render(w, http.StatusOK, \"home.tmpl\"\
  , data)\n}\n\nfunc (app *application) snippetView(w http.ResponseWriter, r *http.Request)\
  \ {\n    id, err := strconv.Atoi(r.URL.Query().Get(\"id\"))\n    if err != nil ||\
  \ id < 1 {\n        app.notFound(w)\n        return\n    }\n\n    snippet, err :=\
  \ app.snippets.Get(id)\n    if err != nil {\n        if errors.Is(err, models.ErrNoRecord)\
  \ {\n            app.notFound(w)\n        } else {\n            app.serverError(w,\
  \ err)\n        }\n        return\n    }\n\n    // 执行同样的操作\n    data := app.newTemplateData(r)\n\
  \    data.Snippet = snippet\n\n    app.render(w, http.StatusOK, \"view.tmpl\", data)\n\
  }\n...\n```\n\n最后，我们需要做的最后一件事是更新 `ui/html/base.tmpl` 以在页脚显示年份，如下所示：\n\n文件：`ui/html/base.tmpl`\n\
  \n```html\n{{define \"base\"}}\n<!doctype html>\n<html lang='en'>\n    <head>\n\
  \        <meta charset='utf-8'>\n        <title>{{template \"title\" .}} - Snippetbox</title>\n\
  \        <link rel='stylesheet' href='/static/css/main.css'>\n        <link rel='shortcut\
  \ icon' href='/static/img/favicon.ico' type='image/x-icon'>\n        <link rel='stylesheet'\
  \ href='https://fonts.googleapis.com/css?family=Ubuntu+Mono:400,700'>\n    </head>\n\
  \    <body>\n        <header>\n            <h1><a href='/'>Snippetbox</a></h1>\n\
  \        </header>\n        {{template \"nav\" .}}\n        <main>\n           \
  \ {{template \"main\" .}}\n        </main>\n        <footer>\n            <!-- 更新页脚包含当前年份\
  \ -->\n            Powered by <a href='https://golang.org/'>Go</a> in {{.CurrentYear}}\n\
  \        </footer>\n        <script src=\"/static/js/main.js\" type=\"text/javascript\"\
  ></script>\n    </body>\n</html>\n{{end}}\n```\n\n如果你重启应用程序并访问 `http://localhost:4000/`\
  \ 首页，你现在应该能在页脚看到当前年份。如下：\n\n![](img/05.05-01.png)\n\n# 第 5.6 章\n\n## 自定义模板函数\n\n\
  在关于模板和动态数据的最后部分，我想解释如何创建你自己的并在 Go 模板中使用的自定义函数。\n\n为了说明这一点，让我们创建一个自定义的 `humanDate()`\
  \ 函数，它以易读的“人性化”格式如 `02 Jan 2022 at 15:04` 输出日期，而不是像我们现在这样以默认格式 `2022-01-02 15:04:00\
  \ +0000 UTC` 输出日期。\n\n实现这一操作主要有两个步骤：\n\n1.  我们需要创建一个包含自定义 `humanDate()` 函数的 `template.FuncMap`\
  \ 对象。\n2.  我们需要在解析模板之前，使用 `template.Funcs()` 方法来注册它。\n\n请在你的 `templates.go` 文件中添加以下代码：\n\
  \n\n\n\n\n\n```go\npackage main\n\nimport (\n    \"html/template\"\n    \"path/filepath\"\
  \n    \"time\" // 新导入\n\n    \"snippetbox.alexedwards.net/internal/models\"\n)\n\
  \n...\n\n// 创建一个 humanDate 函数，返回 time.Time 对象的格式化\n// 字符串表示。\nfunc humanDate(t time.Time)\
  \ string {\n    return t.Format(\"02 Jan 2006 at 15:04\")\n}\n\n// 初始化一个 template.FuncMap\
  \ 对象并存储在全局变量中。这\n// 本质上是一个字符串键映射，用于自定义模板函数名称\n// 与函数本身之间的查找。\nvar functions = template.FuncMap{\n\
  \    \"humanDate\": humanDate,\n}\n\nfunc newTemplateCache() (map[string]*template.Template,\
  \ error) {\n    cache := map[string]*template.Template{}\n\n    pages, err := filepath.Glob(\"\
  ./ui/html/pages/*.tmpl\")\n    if err != nil {\n        return nil, err\n    }\n\
  \n    for _, page := range pages {\n        name := filepath.Base(page)\n\n    \
  \    // template.FuncMap 必须在调用 ParseFiles() 方法之前\n        // 在模板集中注册。这意味着我们必须使用\
  \ template.New() 来\n        // 创建一个空的模板集，使用 Funcs() 方法注册\n        // template.FuncMap，然后像往一样解析文件。\n\
  \        ts, err := template.New(name).Funcs(functions).ParseFiles(\"./ui/html/base.tmpl\"\
  )\n        if err != nil {\n            return nil, err\n        }\n\n        ts,\
  \ err = ts.ParseGlob(\"./ui/html/partials/*.tmpl\")\n        if err != nil {\n \
  \           return nil, err\n        }\n\n        ts, err = ts.ParseFiles(page)\n\
  \        if err != nil {\n            return nil, err\n        }\n\n        cache[name]\
  \ = ts\n    }\n\n    return cache, nil\n}\n```\n\n在我们继续之前，我应该解释一下：自定义模板函数（例如我们的\
  \ `humanDate()` 函数）可以接受任意数量的参数，但它们*必须*只返回一个值。唯一的例外是如果你想作为第二个值返回一个 error，那样也是可以的。\n\
  \n现在我们可以像使用内置模板函数一样使用我们的 `humanDate()` 函数：\n\n文件：`ui/html/pages/home.tmpl`\n\n```html\n\
  {{define \"title\"}}Home{{end}}\n\n{{define \"main\"}}\n    <h2>Latest Snippets</h2>\n\
  \    {{if .Snippets}}\n     <table>\n        <tr>\n            <th>Title</th>\n\
  \            <th>Created</th>\n            <th>ID</th>\n        </tr>\n        {{range\
  \ .Snippets}}\n        <tr>\n            <td><a href='/snippet/view?id={{.ID}}'>{{.Title}}</a></td>\n\
  \            <!-- 在处使用新的模板函数 -->\n            <td>{{humanDate .Created}}</td>\n\
  \            <td>#{{.ID}}</td>\n        </tr>\n        {{end}}\n    </table>\n \
  \   {{else}}\n        <p>There are no snippets yet.</p>\n    {{end}}\n{{end}}\n\
  ```\n\n文件：`ui/html/pages/view.tmpl`\n\n```html\n{{define \"title\"}}Snippet{{end}}\n\
  \n{{define \"main\"}}\n    {{with .Snippet}}\n        <h1>{{.Title}}</h1>\n    \
  \    <p>Created: {{humanDate .Created}}</p>\n        <div>{{.Content}}</div>\n \
  \   {{else}}\n        <p>Snippet doesn't exist!</p>\n    {{end}}\n{{end}}\n```\n\
  \n\n\n\n这种模式的一种微调是在 `myMiddleware()` 间件内部使用匿名函数，如下：\n\n```go\nfunc myMiddleware(next\
  \ http.Handler) http.Handler {\n    return http.HandlerFunc(func(w http.ResponseWriter,\
  \ r *http.Request) {\n        // TODO: 在此处执行我们的间件逻辑...\n        next.ServeHTTP(w,\
  \ r)\n    })\n}\n```\n\n这种模式在实际中非常常见，如果你正在阅读其他应用程序或第三方包的源码，可能会经常看到它。\n\n## 间件的位置\n\
  \n需要说明的是，间件在处理器链（chain of handlers）中的位置将影响应用程序的行为。\n\n如果你将间件放置在链中 `servemux` 之前，那么它将作用于应用程序接收的每一个请求。\n\
  \n```\nmyMiddleware → servemux → application handler\n```\n\n一个很好的例子是记录请求的间件——因为这通常是你希望对*所有*（*all*）请求都这样做。\n\
  \n或者，你可以将间件放置在链中 `servemux` 之后——通过包装特定的应用程序处理器。这将导致你的间件只针对特定路由执行。\n\n```\nservemux\
  \ → myMiddleware → application handler\n```\n\n这种做法的例子类似于授权间件，你可能只想在特定路由上运行它。\n\n\
  随着书籍的进展，我们将如何在实践中实现这两项操作。\n\n第 6.2 节。\n\n## 设置安全头部\n\n让我们把上一节学的模式用起来，创建一个我们自己的间件，它会自动为每个响应添加以下\
  \ HTTP 安全头部，以符合[当前的 OWASP 指南](https://owasp.org/www-project-secure-headers)。\n\n\
  ```\nContent-Security-Policy: default-src 'self'; style-src 'self' fonts.googleapis.com;\
  \ font-src fonts.gstatic.com\nReferrer-Policy: origin-when-cross-origin\nX-Content-Type-Options:\
  \ nosniff\nX-Frame-Options: deny\nX-XSS-Protection: 0\n```\n\n如果你不熟悉这些头部，我将简要解释一下它们的作用。\n\
  \n- `Content-Security-Policy`（通常缩写为 `CSP`）头部用于限制网页页面资源（例如 JavaScript、图像、字体等）从何处加载。设置严格的\
  \ `CSP` 策略有助于防止各种跨站脚本攻击、点击劫持和其他代码注入攻击。\n\n`CSP` 头部及其工作原理是一个大话题，如果你以前没有遇到过，我建议阅读[这篇入门教程](https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP)。但在我们的案例中，该头部告诉浏览器可以从\
  \ `fonts.gstatic.com` 加载字体，从 `fonts.googleapis.com` 和 `self`（我们自己的源）加载样式表，然后`其他所有内容`仅从\
  \ `self`加载。内联 JavaScript 默认被阻止。\n\n- `Referrer-Policy` 用于控制当用户离开你的网页时，`Referer`\
  \ 头部中包含哪些信息。在我们的案例中，我们将值设置为 `origin-when-cross-origin`，这意味着[同源请求](https://developer.mozilla.org/en-US/docs/Web/Security/Same-origin_policy)将包含完整的\
  \ URL，但对于所有其他请求，URL 路径和任何查询字符串值等信息将被移除。\n\n- `X-Content-Type-Options: nosniff` 指示浏览器`不要`对响应的内容类型进行\
  \ MIME 类型嗅探，这反过来有助于防止[内容嗅探攻击](https://security.stackexchange.com/questions/7506/using-file-extension-and-mime-type-as-output-by-file-i-b-combination-to-dete/7531#7531)。\n\
  \n- `X-Frame-Options: deny` 用于帮助防止不支持 `CSP` 头的旧浏览器中的[点击劫持](https://developer.mozilla.org/en-US/docs/Web/Security/Types_of_attacks#click-jacking）攻击。\n\
  \n- `X-XSS-Protection: 0` 用于`禁用`对跨站脚本攻击的拦截。以前将此头部设置为 `X-XSS-Protection: 1; mode=block`\
  \ 是一种良好的实践，但当我们像这样使用 `CSP` 头部时，[建议](https://owasp.org/www-project-secure-headers/#x-xss-protection)是完全禁用此功能。\n\
  \n好了，让我们回到 Go 代码，并创建一个新的 `middleware.go` 文件。我们将用它来存放整本书中编写的所有自定义间件。\n\n```bash\n\
  $ touch cmd/web/middleware.go\n```\n\n然后打开它并使用我们在上一节引入的模式添加一个 `secureHeaders()`\
  \ 函数：\n\n文件：`cmd/web/middleware.go`\n\n```go\npackage main\n\nimport (\n    \"net/http\"\
  \n)\n\nfunc secureHeaders(next http.Handler) http.Handler {\n    return http.HandlerFunc(func(w\
  \ http.ResponseWriter, r *http.Request) {\n        // 注意：为了可读性，这里分成了多行。你\n     \
  \   // 不需要在你自己的代码中这样做。\n        w.Header().Set(\"Content-Security-Policy\",\n  \
  \          \"default-src 'self'; style-src 'self' fonts.googleapis.com; font-src\
  \ fonts.gstatic.com\")\n        w.Header().Set(\"Referrer-Policy\", \"origin-when-cross-origin\"\
  )\n        w.Header().Set(\"X-Content-Type-Options\", \"nosniff\")\n        w.Header().Set(\"\
  X-Frame-Options\", \"deny\")\n        w.Header().Set(\"X-XSS-Protection\", \"0\"\
  )\n\n        next.ServeHTTP(w, r)\n    })\n}\n```\n\n\n\n另外需要提到的一是，如果你在中间件函数中调用\
  \ `next.ServeHTTP()` *之前*调用了 `return`，那么链将停止执行，控制权将流回上游。\n\n例如，提前返回（early returns）的一个常见用例是身份验证中间件，它只在通过特定检查时才允许链继续执行。例如：\n\
  \n```\nfunc myMiddleware(next http.Handler) http.Handler {\n    return http.HandlerFunc(func(w\
  \ http.ResponseWriter, r *http.Request) {\n        // 如果用户未授权，发送 403 Forbidden 状态并\n\
  \        // 返回以停止执行链。\n        if !isAuthorized(r) {\n            w.WriteHeader(http.StatusForbidden)\n\
  \            return\n        }\n\n        // 否则，调用链中的下一个处理器。\n        next.ServeHTTP(w,\
  \ r)\n    })\n}\n```\n\n我们将在稍后章节使用这种“提前返回”模式来限制对应用程序某些部分的访问。\n\n### 调试 CSP 问题\n\n\
  虽然 CSP 头部确实*非常棒*，而且你绝对应该使用它们，但值得说的是，我曾花几个小时调试为什么某些功能没有按预期工作，结果发现是某个关键资源或脚本被我自己的\
  \ CSP 规则拦截了 \U0001F926。\n\n如果你正在开发一个使用 CSP 头部的项目（如本项目），我建议随身携带 浏览器开发者工具，并养成在遇到任何意外问题时尽早检查日志的习惯。在\
  \ Firefox 中，任何被拦截的资源将以错误形式显示在控制台日志中——类似于：\n\n![](img/06.02-01.png)\n\n第 6.3 节\n\n\
  ## 请求日志\n\n让我们继续同样的思路，添加一些中间件来*记录 HTTP 请求*。具体来说，我们将使用之前创建的*信息日志器*来记录用户的 IP 地址，以及正在请求的\
  \ URL 和方法。\n\n打开你的 `middleware.go` 文件并使用标准中间件模式创建一个 `logRequest()` 方法，如下所示：\n\n\
  文件：`cmd/web/middleware.go`\n\n```\npackage main\n\n...\n\nfunc (app *application)\
  \ logRequest(next http.Handler) http.Handler {\n    return http.HandlerFunc(func(w\
  \ http.ResponseWriter, r *http.Request) {\n        app.infoLog.Printf(\"%s - %s\
  \ %s %s\", r.RemoteAddr, r.Proto, r.Method, r.URL.RequestURI())\n\n        next.ServeHTTP(w,\
  \ r)\n    })\n}\n```\n\n注意这次我们是将中间件实现为 `application` 的一个方法吗？\n\n这样做是完全有效的。我们的中间件方法签名与之前相同，但因为它是针对\
  \ `application` 的方法，所以它*也*可以访问处理器依赖项，包括信息日志器。\n\n现在让我们更新 `routes.go` 文件，使得 `logRequest`\
  \ 中间件首先执行，并且针对所有请求执行，这样控制流（从左到右读取）看起来如下：\n\n```\nlogRequest ↔ secureHeaders ↔ servemux\
  \ ↔ application handler\n```\n\n文件：`cmd/web/routes.go`\n\n```\npackage main\n\n\
  import \"net/http\"\n\nfunc (app *application) routes() http.Handler {\n    mux\
  \ := http.NewServeMux()\n\n    fileServer := http.FileServer(http.Dir(\"./ui/static/\"\
  ))\n    mux.Handle(\"/static/\", http.StripPrefix(\"/static\", fileServer))\n\n\
  \    mux.HandleFunc(\"/\", app.home)\n    mux.HandleFunc(\"/snippet/view\", app.snippetView)\n\
  \    mux.HandleFunc(\"/snippet/create\", app.snippetCreate)\n\n    // 使用 logRequest\
  \ 中间件包装现有的链。\n    return app.logRequest(secureHeaders(mux))\n}\n```\n\n好了……让我们来试一下！\n\
  \n重启你的应用程序，浏览一下，然后检查你的终端。你应该会看到这样的日志输出：\n\n```\n$ go run ./cmd/web\nINFO    2022/02/06\
  \ 09:08:29 Starting server on :4000\nINFO    2022/02/06 09:08:31 127.0.1:45988 -\
  \ HTTP/1.1 GET /\nINFO    2022/02/06 09:08:31 127.0.1:45988 - HTTP/1.1 GET /static/css/main.css\n\
  INFO    2022/02/06 09:08:31 127.0.1:45988 - HTTP/1.1 GET /static/js/main.js\nINFO\
  \    2022/02/06 09:08:31 127.0.1:45988 - HTTP/1.1 GET /static/img/logo.png\nINFO\
  \    2022/02/06 09:08:31 127.0.1:45988 - HTTP/1.1 GET /static/img/favicon.ico\n\
  INFO    2022/02/06 09:08:34 127.0.1:45988 - HTTP/1.1 GET /snippet/view?id=2\n```\n\
  \n第 6.4 节\n\n## Panic 恢复\n\n在简单的 Go 程序中，[当你的代码发生](https://pkg.go.dev/builtin/#panic)会导致应用程序立即终止。\n\
  \n但我们的 Web 应用要复杂一些。Go 的 HTTP 服务器假设任何 panic 的影响都局限于处理该 HTTP 请求的 goroutine（[#02.09-the-handler-interface.xhtml\
  \ 每个请求都在自己的 goroutine 中处理]）。\n\n具体来说，发生 panic 后，我们的服务器会将堆栈跟踪打印到服务器错误日志，展开受影响 goroutine\
  \ 的堆栈（调用任何 defer 函数），并关闭底层 HTTP 连接。但重要的是，处理器中的任何 panic *都不会*导致你的服务器崩溃。\n\n*但如果某个处理器中发生了\
  \ panic，用户会看到什么？*\n\n让我们来看看并在 `home` 处理器中引入一个故意的 panic。\n\n文件：`cmd/web/handlers.go`\n\
  \n```\npackage main\n\n...\n\nfunc (app *application) home(w http.ResponseWriter,\
  \ r *http.Request) {\n    if r.URL.Path != \"/\" {\n        app.notFound(w)\n  \
  \      return\n    }\n\n    panic(\"oops! something went wrong\") // 故意的 panic\n\
  \n    snippets, err := app.Latest()\n    if err != nil {\n        app.serverError(w,\
  \ err)\n        return\n    }\n\n    data := app.newTemplateData(r)\n    data.Snippets\
  \ = snippets\n\n    app.render(w, http.StatusOK, \"home.tmpl\", data)\n}\n```\n\n\
  重启你的应用程序……\n\n```\n$ go run ./cmd/web\nINFO    2022/02/06 09:16:38 Starting server\
  \ on :4000\n```\n\n……从另一个窗口发送一个 HTTP 请求：\n\n```\n$ curl -i http://localhost:4000\n\
  curl: (52) Empty reply from server\n```\n\n不幸的是，由于 Go 关闭了连接，我们只得到了一个空响应。\n\n这对用户来说不是很好的体验。更合适更有意义的方法是发送一个带有\
  \ `500 Server Error` 状态的正确 HTTP 响应。\n\n实现这一点的一种巧妙方法是创建一个中间件来*恢复* panic 并调用我们的 `app.serverError()`\
  \ 辅助方法。为此，我们可以利用堆栈解除时 defer 函数总是被调用的事实。\n\n打开你的 `middleware.go` 文件并添加以下代码：\n\n文件：`cmd/web/middleware.go`\n\
  \n```go\npackage main\n\nimport (\n    \"fmt\" // 新导入\n    \"net/http\"\n)\n\n...\n\
  \nfunc (app *application) recoverPanic(next http.Handler) http.Handler {\n    return\
  \ http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n        // 创建一个\
  \ defer 函数（当发生 panic 时，\n        // Go 展开堆栈时它总是会被执行）。\n        defer func() {\n\
  \            // 使用内置的 recover 函数检查是否发生了\n            // panic。如果有的话……\n        \
  \    if err := recover(); err != nil {\n                // 在响应中设置 \"Connection:\
  \ close\" 头部。\n                w.Header().Set(\"Connection\", \"close\")\n     \
  \           // 调用 app.serverError 辅助方法返回 500\n                // 内部错误响应。\n     \
  \           app.serverError(w, fmt.Errorf(\"%s\", err))\n            }\n       \
  \ }()\n\n        next.ServeHTTP(w, r)\n    })\n}\n```\n\n关于此点有两个细节值得解释：\n\n*   在响应中设置\
  \ `Connection: Close` 头部充当了触发器，使 Go 的 HTTP 服务器在发送响应后自动关闭当前连接。它还通知用户连接*将被关闭*。注意：如果使用的协议是\
  \ HTTP/2，Go 将[自动](https://go-review.googlesource.com/c/net/+/121415/)从响应中剥离 `Connection:\
  \ Close` 头部（使其不格式错误）并发送一个 `GOAWAY` 帧。\n\n\n\n\n\n*   内置函数 `recover()` 返回的值类型为 `any`，其底层类型可以是\
  \ `string`、`error` 或其他类型——取决于传递给 `panic()` 的参数是什么。在我们的用例中，它是字符串 `\"oops! something\
  \ went wrong\"`。在上面的代码中，我们通过使用 `fmt.Errorf()` 函数创建一个新的 `error` 对象（其中包含 `any` 值的默认文本表示），将其归一化为\
  \ `error` 类型，然后将此 `error` 传递给辅助方法 `app.serverError()`。\n\n现在，让我们在 `routes.go` 文件中使用它，让它成为执行链中*第一个*被执行的内容（这样它就能涵盖后续所有中间件和处理器中发生的\
  \ panic）。\n\nFile: `cmd/web/routes.go`\n\n```go\npackage main\n\nimport \"net/http\"\
  \n\nfunc (app *application) routes() http.Handler {\n    mux := http.NewServeMux()\n\
  \n    fileServer := http.FileServer(http.Dir(\"./ui/static/\"))\n    mux.Handle(\"\
  /static/\", http.StripPrefix(\"/static\", fileServer))\n\n    mux.HandleFunc(\"\
  /\", app.home)\n    mux.HandleFunc(\"/snippet/view\", app.snippetView)\n    mux.HandleFunc(\"\
  /snippet/create\", app.snippetCreate)\n\n    // 使用 recoverPanic 中间件包装现有的链。\n   \
  \ return app.recoverPanic(app.logRequest(secureHeaders(mux)))\n}\n```\n\n如果你现在重启应用并请求主页，你应该能在发生\
  \ panic 之后看到一个格式良好的 `500 Internal Server Error` 响应，包括我们讨论过的 `Connection: close`\
  \ 头部。\n\n```bash\n$ go run ./cmd/web\nINFO    2022/02/06 09:20:10 Starting server\
  \ on :4000\n```\n\n```bash\n$ curl -i http://localhost:4000\nHTTP/1.1 500 Internal\
  \ Server Error\nConnection: close\nContent-Security-Policy: default-src 'self';\
  \ style-src 'self' fonts.googleapis.com; font-src fonts.gstatic.com\nContent-Type:\
  \ text/plain; charset=utf-8\nReferrer-Policy: origin-when-cross-origin\nX-Content-Type-Options:\
  \ nosniff\nX-Frame-Options: deny\nX-Xss-Protection: 0\nDate: Sun, 06 Feb 2022 08:20:27\
  \ GMT\nContent-Length: 22\n\nInternal Server Error\n```\n\n在继续之前，回到你的 `home` 处理器并从代码中移除故意的\
  \ panic。\n\nFile: `cmd/web/handlers.go`\n\n```go\npackage main\n\n...\n\nfunc (app\
  \ *application) home(w http.ResponseWriter, r *http.Request) {\n    if r.URL.Path\
  \ != \"/\" {\n        app.notFound(w)\n        return\n    }\n\n    snippets, err\
  \ := app.snippets.Latest()\n    if err != nil {\n        app.serverError(w, err)\n\
  \        return\n    }\n\n    data := app.newTemplateData(r)\n    data.Snippets\
  \ = snippets\n\n    app.render(w, http.StatusOK, \"home.tmpl\", data)\n}\n\n...\n\
  ```\n\n### 附加信息\n\n#### 其他 goroutine 中的 panic\n\n需要重要的是，`recoverPanic` 中间件只会恢复发生在同一个\
  \ goroutine 中的 panic。如果你启动了另一个 goroutine 并在其中发生了 panic，`recoverPanic` 中间件将无法捕获它，应用程序将会崩溃。\n\
  \n为了处理这种情况，你可以在 goroutine 内部使用 `recover()`，例如：\n\n```go\ngo func() {\n    defer\
  \ func() {\n        if r := recover(); r != nil {\n            // 处理 panic\n   \
  \     }\n    }()\n    // 可能会 panic 的代码\n}()\n```\n\n#### 可组合链\n\n在本章中，我想介绍可组合链（composable\
  \ chains）。我推荐它的是因为它允许你通过组合小型简单的函数来构建复杂的中间件链。例如，你可以创建一个这样的链：\n\n```go\nchain := middleware.New(recoverPanic,\
  \ logRequest, secureHeaders)\nreturn chain(mux)\n```\n\n随着应用程序的增长，路由变得越来越复杂，使用可组合链会让维护和测试变得容易得多。\n\
  \n---\n\n# 高级路由\n\n在本书的下一个章节中，我们将为应用程序添加一个 HTML 表单，以便用户可以创建片段。\n\n为了让其顺利运行，我们首先需要更新应用程序路由，以便对\
  \ `/snippet/create` 的请求根据请求方法进行不同的处理。具体而言：\n\n*   对于 `GET /snippet/create`，我们向用户显示添加新片段的\
  \ HTML 表单。\n*   对于 `POST /snippet/create`，我们处理这些表单数据，然后向数据库中插入一条新的 `snippet` 记录。\n\
  \n顺便我们还会进行另外两个与路由相关的改进：\n\n*   我们将限制所有其他仅返回信息的路由，使其仅支持 `GET` 请求。\n*   我们将使用[整整的\
  \ URL](https://en.wikipedia.org/wiki/Clean_URL)，使任何变量都包含在 URL 路径中（如 `/snippet/view/123`），而不是作为查询字符串（如\
  \ `/snippet/view?id=123`）。\n\n本质上，我们希望调整应用程序路由和处理器，使其最终看起来如下所示：\n\n| 方法 | 模式 | 处理器\
  \ | 操作 |\n| --- | --- | --- | --- |\n| GET | / | home | 显示主页 |\n| GET | /snippet/view/:id\
  \ | snippetView | 显示特定片段 |\n| GET | /snippet/create | snippetCreate | 显示创建新片段的 HTML\
  \ 表单 |\n| POST | /snippet/create | snippetCreatePost | 创建新片段 |\n| GET | /static/\
  \ | http.FileServer | 特定的静态文件 |\n\n\n\n\n\n正如我在书中前面的部分中提到的，Go 的 `servemux` 不支持基于方法的路由，也不支持包含变量的整洁\
  \ URL。虽然有一些[技巧](https://youtu.be/yi5A3cK1LNA?t=11m44s)可以用来绕过这一问题，但大多数人倾向于认为直接使用第三方包来帮助路由会更简单。\n\
  \n在本书的这一章节中，我们将：\n\n*   简要讨论几个出色的第三方路由器的特性。\n*   更新我们的应用程序以使用其中一个路由器，并演示如何使用基于方法的路由和整洁\
  \ URL。\n\n# 第 7.1 节。\n\n## 选择路由器\n\nGo 真的有数以百计的第三方路由器供选择。而且（幸运或不幸，取决于你的观点）它们的工作方式都都略有不同。它们拥有不同的\
  \ API、不同的路由匹配逻辑以及不同的行为特性。\n\n在我尝试过的所有第三方路由器中，有三个我推荐作为起点：[`julienschmidt/httprouter`](https://github.com/julienschmidt/httprouter)、[`go-chi/chi`](https://github.com/go-chi/chi)\
  \ 和 [`gorilla/mux`](https://github.com/gorilla/mux)。它们都拥有良好的文档、相当的测试覆盖率，并且与我们在书中使用的处理器和中间件的标准模式配合良好。\n\
  \n这三个路由器都支持基于方法的路由和整洁 URL，但除此之外，它们具有略有不同的行为和功能。你应该根据项目的具体需求在它们之间进行选择。\n\n总结：\n\n\
  *   `julienschmidt/httprouter` 是这三个包中最专注、轻量级且最快的，在遵循 HTTP 规范方面，它几乎是任何第三方路由器中最接近“完美”的。它会自动处理\
  \ `OPTIONS` 请求并正确发送 `405` 响应，还允许你为 `404` 和 `405` 响应设置自定义处理器。\n*   `go-chi/chi` 在功能上与\
  \ `httprouter` 相似，主要区别在于它还支持正则表达式路由模式以及使用特定中间件的路由“分组”。这种路由分组功能在需要管理大量路由和中间件的大型应用程序中非常有价值。\n\
  \    `chi` 的两个缺点是：它不会自动处理 `OPTIONS` 请求，并且在 `405` 响应中不会设置 `Allow` 标头。\n*   `gorilla/mux`\
  \ 是三个路由器中功能最全的。它支持正则表达式路由模式，并允许根据方案、主机和标头进行路由。它还是唯一支持自定义路由规则和路由“反转”（就像在 Django、Rails\
  \ 或 Laravel 中那样）的路由器。\n    `gorilla/mux` 主要缺点是相对缓慢且消耗内存——尽管对于我们这种数据库驱动的 Web 应用程序来说，对整个\
  \ HTTP 请求生命周期的影响可能很小。与 `chi` 一样，它也不处理 `OPTIONS` 请求，并且不在 `405` 响应中设置 `Allow` 标头。\n\
  \n总结：\n\n| 方法 | 模式 | 处理器 | 动作 |\n| :--- | :--- | :--- | :--- |\n| `GET` | `/` |\
  \ `home` | 显示首页 |\n| `GET` | `/snippet/:id` | `snippetView` | 显示特定的代码片段 |\n| `GET`\
  \ | `/snippet/create` | `snippetCreate` | 显示创建新代码片段的 HTML 表单 |\n| `POST` | `/snippet/create`\
  \ | `snippetCreatePost` | 创建新的代码片段 |\n| `GET` | `/static/*filepath` | `http.FileServer`\
  \ | 静态文件服务\n\n## 7.2. 整洁 URL 和基于方法的路由\n\n现在已经完成后，我们需要对 `handlers.go` 文件进行几处更改。请按照以下内容更新它：\n\
  \n文件：cmd/web/handlers.go\n\n\n\n\n```go\npackage main\n\nimport (\n    \"errors\"\
  \n    \"fmt\"\n    \"net/http\"\n    \"strconv\"\n\n    \"snippetbox.alexedwards.net/internal/models\"\
  \n\n    \"github.com/julienschmidt/httprouter\" // 新导入\n)\n\nfunc (app *application)\
  \ home(w http.ResponseWriter, r *http.Request) {\n    // 因为 httprouter 精确匹配 \"/\"\
  \ 路径，我们现在可以移除\n    // 此处理器中对 r.URL.Path != \"/\" 的手动检查。\n\n    snippets, err :=\
  \ app.snippets.Latest()\n    if err != nil {\n        app.serverError(w, err)\n\
  \        return\n    }\n\n    data := app.newTemplateData(r)\n    data.Snippets\
  \ = snippets\n\n    app.render(w, http.StatusOK, \"home.tmpl\", data)\n}\n\nfunc\
  \ (app *application) snippetView(w http.ResponseWriter, r *http.Request) {\n   \
  \ // 当 httprouter 解析请求时，任何具名参数的值\n    // 将存储在请求上下文中（request context）。我们将在本书后面的部分\n\
  \    // 详细讨论请求上下文，但目前只需知道你可以使用\n    // ParamsFromContext() 函数来获取一个包含这些参数\n    //\
  \ 名称和值的切片即可，如下文所示：\n    params := httprouter.ParamsFromContext(r.Context())\n\n\
  \    // 然后我们可以使用 ByName() 方法从切片中获取 \"id\" 具名\n    // 参数的值并像正常一样对其验证。\n    id, err\
  \ := strconv.Atoi(params.ByName(\"id\"))\n    if err != nil || id < 1 {\n      \
  \  app.notFound(w)\n        return\n    }\n\n    snippet, err := app.snippets.Get(id)\n\
  \    if err != nil {\n        if errors.Is(err, models.ErrNoRecord) {\n        \
  \    app.notFound(w)\n        } else {\n            app.serverError(w, err)\n  \
  \      }\n        return\n    }\n\n    data := app.newTemplateData(r)\n    data.Snippet\
  \ = snippet\n\n    app.render(w, http.StatusOK, \"view.tmpl\", data)\n}\n\n// 添加一个新的\
  \ snippetCreate 处理器，目前它返回一个占位\n// 响应。我们很快会更新它以显示 HTML 表单。\nfunc (app *application)\
  \ snippetCreate(w http.ResponseWriter, r *http.Request) {\n    w.Write([]byte(\"\
  Display the form for creating a new snippet...\"))\n}\n\n// 重命名此处理器为 snippetCreatePost。\n\
  func (app *application) snippetCreatePost(w http.ResponseWriter, r *http.Request)\
  \ {\n    // 检查请求方法是否为 POST 现在是多余的，可以\n    // 移除，因为这是由 httprouter 自动完成的。\n\n    title\
  \ := \"O snail\"\n    content := \"O snail\\nClimb Mount Fuji,\\nBut slowly, slowly!\\\
  n\\n– Kobayashi Issa\"\n    expires := 7\n\n    id, err := app.snippets.Insert(title,\
  \ content, expires)\n    if err != nil {\n        app.serverError(w, err)\n    \
  \    return\n    }\n\n    // 更新重定向路径以使用新的整洁 URL 格式。\n    http.Redirect(w, r, fmt.Sprintf(\"\
  /snippet/view/%d\", id), http.StatusSeeOther)\n}\n```\n\n最后，我们需要更新 `home.tmpl` 文件中的表格，以便\
  \ HTML 中的链接也使用新的整洁 URL 样式 `/snippet/view/:id`。\n\n```html\n{{define \"title\"}}首页{{end}}\n\
  \n{{define \"main\"}}\n    <h2>最新代码片段 (Latest Snippets)</h2>\n    {{if .Snippets}}\n\
  \     <table>\n        <tr>\n            <th>标题 (Title)</th>\n            <th>创建时间\
  \ (Created)</th>\n            <th>ID</th>\n        </tr>\n        {{range .Snippets}}\n\
  \        <tr>\n            <!-- 使用新的整洁 URL 样式 -->Use the new clean URL style-->\n\
  \            <td><a href='/snippet/view/{{.ID}}'>{{.Title}}</a></td>\n         \
  \   <td>{{humanDate .Created}}</td>\n            <td>#{{.ID}}</td>\n        </tr>\n\
  \        {{end}}\n    </table>\n    {{else}}\n        <p>这里暂无可视内容……还没有！(There's\
  \ nothing to see here... yet!)</p>\n    {{end}}\n{{end}}\n```\n\n完成这些操作后，重启应用程序，你现在应该能够通过整洁\
  \ URL 查看文本片段了。例如：[`http://localhost:4000/snippet/view/1`](http://localhost:4000/snippet/view/1)。\n\
  \n![](img/07.02-01.png)\n\n你还可以看到，使用不支持的 HTTP 方法的请求将遇到 `405 Method Not Allowed`\
  \ 响应。例如，尝试使用 curl 对相同的 URL 发起 `POST` 请求：\n\n```bash\n$ curl -i -X POST http://localhost:4000/snippet/view/1\n\
  HTTP/1.1 405 Method Not Allowed\nAllow: GET, OPTIONS\nContent-Security-Policy: default-src\
  \ 'self'; style-src 'self' fonts.googleapis.com; font-src fonts.gstatic.com\nContent-Type:\
  \ text/plain; charset=utf-8\nReferrer-Policy: origin-when-cross-origin\nX-Content-Type-Options:\
  \ nosniff\nX-Frame-Options: deny\nX-Strict-Transport-Security\n```\n\n### 更多信息\n\
  \n#### 冲突的路由模式\n\n重要的是，`httprouter` 不允许可能匹配相同请求的*冲突路由模式*。因此，例如，你不能注册一个如 `GET /foo/new`\
  \ 的路由以及另一个与之冲突的具名参数段或通配符参数路由——如 `GET /foo/:name` 或 `GET /foo/*name`。\n\n在大多数情况下，这是一件好事。因为不允许冲突路由，你不需要担心路由优先级规则，并且减少了应用程序中出现\
  \ Bug 和意外行为的风险。\n\n但如果你确实需要支持冲突路由（例如，为了向兼容可能需要完全复制现有应用程序的端点），那么我建议使用 `chi` 或 `gorilla/mux`\
  \ —— 它们都允许冲突路由。\n\n#### 自定义 httprouter 行为\n\n`httprouter` 包提供了一些配置选项，可以使用它们进一步自定义应用程序的行为，包括启用*斜杠重定向*和启用*自动\
  \ URL 路径清理*。\n\n有关可用设置的更多信息可以在[此处](https://pkg.go.dev/github.com/julienschmidt/httprouter?tab=doc#Router)找到。\n\
  \n#### RESTful 路由\n\n如果你有 Ruby-on-Rails、Laravel 或类似框架的背景，可能会疑惑为什么我们不把路由和处理器结构得更符合“RESTful”风格，并且看起来像这样：\n\
  \n\n\n\n\n| Method | Pattern | Handler | Action |\n| :--- | :--- | :--- | :--- |\n\
  | GET | `/snippets` | snippetIndex | 显示所有片段的列表 |\n| GET | `/snippets/:id` | snippetView\
  \ | 显示特定的片段 |\n| GET | `/snippets/new` | snippetNew | 显示用于创建新片段的 HTML 表单 |\n| POST\
  \ | `/snippets` | snippetCreate | 创建一个新片段 |\n| … | … | … | … |\n\n这里有几个原因。\n\n第一个原因是\
  \ `GET /snippets/:id` 和 `GET /snippets/new` 路由之间存在*冲突*——发往 `/snippets/new` 的 HTTP\
  \ 请求可能会同时匹配到这两个路由（此时发往 `/snippets/new` 的请求会被匹配到第一个路由，其中 `id` 的值被设置为字符串 `\"new\"\
  `）。如上文所述，`httprouter` 不允许冲突的路由模式，而且通常情况下避免它们也是一种良好的做法，因为它们是潜在的错误来源。\n\n第二个原因是，在\
  \ `/snippets/new` 上展示的 HTML 表单在提交时需要 POST 到 `/snippets`。这意味着当我们重新渲染 HTML 表单以显示任何验证错误时，用户浏览器中的\
  \ URL 也会变为 `/snippets`。至于你是否认为这是一个问题，则因人而异（YMMV）。大多数用户不会看 URL，但我认为从用户体验（UX）的角度来说，这有点笨拙且困惑——尤其是如果\
  \ `/snippets` 的 `GET` 请求通常渲染的是其他内容（如所有片段列表）。\n\n### Handler 命名\n\n我想强调的是，在 Go 中为你的\
  \ handler 命名没有对错之分。\n\n在这个项目中，我们将遵循一种约定：在任何处理 `POST` 请求的 handler 名称后加上单词“Post”。如下如下所示：\n\
  \n| Method | Pattern | Handler | Action |\n| :--- | :--- | :--- | :--- |\n| GET\
  \ | `/snippet/create` | snippetCreate | 显示用于创建新片段的 HTML 表单 |\n| POST | `/snippet/create`\
  \ | snippetCreatePost | 创建一个新片段 |\n\n或者，你也可以在显示表单的 handler 名称后加上单词“Form”或“View”，如下：\n\
  \n| Method | Pattern | Handler | Action |\n| :--- | :--- | :--- | :--- |\n| GET\
  \ | `/snippet/create` | snippetCreateForm | 显示用于创建新片段的 HTML 表单 |\n| POST | `/snippet/create`\
  \ | snippetCreate | 创建一个新片段 |\n\n甚至也可以在 handler 名称前加上单词“show”和“do”……\n\n| Method\
  \ | Pattern | Handler | Action |\n| :--- | :--- | :--- | :--- |\n| GET | `/snippet/create`\
  \ | showSnippetCreate | 显示用于创建新片段的 HTML 表单 |\n| POST | `/snippet/create` | doSnippetCreate\
  \ | 创建一个新片段 |\n\n基本上，在 Go 中你有自由去选择一种适合你且符合你思维习惯的命名规范。\n\n# 第 8 章：处理表单\n\n在本书的这一部分中，我们将关注允许\
  \ Web 应用程序的用户通过 HTML 表单创建新片段，表单看起来大致如下：\n\n![08.00-01.png](img/08.00-01.png)\n\n\
  处理此表单的高级工作流将遵循标准的 `Post-Redirect-Get` 模式，如下：\n\n1. 当用户向 `/snippet/create` 发起 `GET`\
  \ 请求时，将显示一个空白表单。\n2. 用户完成表单，并通过向 `/snippet/create` 发起的 `POST` 请求提交到服务器。\n3. 表单数据将由我们的\
  \ `snippetCreatePost` handler 进行验证。如果发生任何验证失败，表单将重新显示并突出显示相应的表单字段。如果通过了我们的验证检查，新片段的数据将添加到数据库中，然后我们将用户重定向到\
  \ `\"/snippet/view/:id\"`。\n\n在此过程中，你将学习到：\n\n* 如何解析并访问 `POST` 请求中发送的表单数据。\n* 对表单数据执行常用验证检查的一些技术。\n\
  * 一种用户友好的模式，用于提醒用户验证失败并使用之前提交的数据重新填充表单字段。\n* 如何通过使用用于表单处理和验证的辅助函数来保持你的 handler 整洁](#08.05-creating-validation-helpers.xhtml)。\n\
  \n## 第 8.1 节：设置 HTML 表单\n\n让我们先创建一个新的 `ui/html/pages/create.tmpl` 文件来存放表单的 HTML\
  \ 代码……\n\n```bash\n$ touch ui/html/pages/create.tmpl\n```\n\n……然后添加以下标记，使用我们在书中之前用过的相同模式：\n\
  \n文件：`ui/html/pages/create.tmpl`\n\n```html\n{{define \"title\"}}Create a New Snippet{{end}}\n\
  \n{{define \"main\"}}\n<form action='/snippet/create' method='POST'>\n    <div>\n\
  \        <label>Title:</label>\n        <input type='text' name='title'>\n    </div>\n\
  \    <div>\n        <label>Content:</label>\n        <textarea name='content'></textarea>\n\
  \    </div>\n    <div>\n        <label>Days until:</label>\n        <input type='text'\
  \ name='expires'>\n    </div>\n    <input type='submit' value='Publish'>\n</form>\n\
  {{end}}\n```\n\n目前还没有特别特殊。我们的 `main` 模板包含了三个值：`title`、`content` 和 `expires`（过期天数）。现在我们在导航栏中添加“Create\
  \ snippet”链接。\n\n文件：`ui/html/partials/nav.tmpl`\n\n```html\n{{define \"nav\"}}\n\
  <nav>\n    <a href='/'>Home</a>\n    <a href='/snippet/create'>Create snippet</a>\n\
  </nav>\n{{end}}\n```\n\n最后，我们需要更新 `snippetCreate` handler 以渲染新页面：\n\n文件：`cmd/web/handlers.go`\n\
  \n```go\n...\n\nfunc (app *application) snippetCreate(w http.ResponseWriter, r *http.Request)\
  \ {\n    data := app.newTemplateData(r)\n\n    app.render(w, http.StatusOK, \"create.tmpl\"\
  , data)\n}\n\n...\n```\n\n此时你可以启动应用程序并在浏览器中访问 `http://localhost:4000/snippet/create`。你应该看到一个这样的表单：\n\
  \n![08.01-01.png](img/08.01-01.png)\n\n## 第 8.2 节：解析表单数据\n\n感谢于我们之前在高级路由章节中所做的工作，任何\
  \ `POST /snippets/create` 请求已分发到我们的 `snippetCreatePost` handler。现在我们将更新此 handler\
  \ 以处理并使用提交的表单数据。\n\n在高级层面，我们可以将其分为两个不同的步骤。\n\n1. 首先，我们需要使用 `r.ParseForm()`(https://pkg.go.dev/net/http/#Request.ParseForm)\
  \ 方法解析请求体。该方法检查请求体格式是否正确，并将表单数据存储在请求的 [`r.PostForm`](https://pkg.go.dev/net/http/#Request.PostForm)\
  \ map 中。如果在解析时遇到任何错误（例如没有主体或主体太大无法处理），它将返回错误。`r.ParseForm()` 方法也是幂等的；可以在同一个请求上安全地多次调用而不产生副作用。\n\
  2. 然后我们可以通过使用 `r.PostForm.Get()` 方法获取 `r.PostForm` 中包含的表单数据。例如，我们可以通过 `r.PostForm.Get(\"\
  title\")` 获取标题 字段的值。如果表单中没有匹配的字段名，它将返回空字符串 `\"\"`，与书中之前处理查询参数的方式类似。\n\n打开你的 `cmd/web/handlers.go`\
  \ 文件并更新以包含以下代码：\n\n\n\n\n\n```go\npackage main\n\n...\n\nfunc (app *application)\
  \ snippetCreatePost(w http.ResponseWriter, r *http.Request) {\n    // 首先我们调用 r.ParseForm()，它会将\
  \ POST 请求体中的任何数据\n    // 添加到 r.PostForm 映射中。PUT 和 PATCH 请求也以相同的方式工作。\n    // 如果发生任何错误，我们使用\
  \ app.ClientError() 辅助函数\n    // 向用户发送 400 Bad Request 响应。\n    err := r.ParseForm()\n\
  \    if err != nil {\n        app.clientError(w, http.StatusBadRequest)\n      \
  \  return\n    }\n\n    // 使用 r.PostForm.Get() 方法从 r.PostForm 映射中\n    // 检索标题和内容。\n\
  \    title := r.PostForm.Get(\"title\")\n    content := r.PostForm.Get(\"content\"\
  )\n\n    // r.PostForm.Get() 方法始终将表单数据作为 *string* 返回。\n    // 然而，我们期望 expires 的值是一个数字，并希望在\n\
  \    // Go 代码中将其表示为整数。因此，我们需要使用 strconv.Atoi()\n    // 手动将表单数据转换为整数，如果转换失败，我们将发送\
  \ 400\n    // Request 响应。\n    expires, err := strconv.Atoi(r.PostForm.Get(\"expires\"\
  ))\n    if err != nil {\n        app.clientError(w, http.StatusBadRequest)\n   \
  \     return\n    }\n\n    id, err := app.snippets.Insert(title, content, expires)\n\
  \    if err != nil {\n        app.serverError(w, err)\n        return\n    }\n\n\
  \    http.Redirect(w, r, fmt.Sprintf(\"/snippet/view/%d\", id), http.StatusSeeOther)\n\
  }\n```\n\n好了，让我们尝试一下吧！重启应用程序并尝试在表单中填写代码片段的标题和内容，如下：\n\n![](img/08.02-01.png)\n\n\
  然后提交表单。如果一切运行正常，你应该会被重定向到一个显示新代码片段的页面，如下：\n\n![](img/08.02-02.png)\n\n***\n\n###\
  \ 附加信息\n\n#### `r.Form` 映射\n\n在上面的代码中，我们通过 `r.PostForm` 映射访问表单值。但另一种方法是使用（略有不同的）`r.Form`\
  \ 映射。\n\n`r.PostForm` 映射仅在 `POST`、`PATCH` 和 `PUT` 请求时填充，并包含请求体中的表单数据。\n\n相比之下，`r.Form`\
  \ 映射会在所有请求（无论其 HTTP 方法）时被填充，并包含任何请求体和任何查询字符串参数。因此，如果我们的表单提交到 `/snippet/create?foo=bar`，我们也可以通过调用\
  \ `r.Form.Get(\"foo\")` 获取 `foo` 参数的值。注意，在发生冲突时，请求体的值将优先于查询字符串参数。\n\n如果你的应用程序在 HTML\
  \ 表单和 URL 中发送数据，或者你有一个不不在乎参数传递方式的应用程序，那么使用 `r.Form` 映射可能会很有用。但在我们的情况下，这些情况并不适用。我们期望表单数据仅在请求体中发送，因此通过\
  \ `r.PostForm` 访问它是符合逻辑的。\n\n#### `FormValue` 和 `PostFormValue` 方法\n\n`net/http`\
  \ 包还提供了方法 [`r.FormValue()`](https://pkg.go.dev/net/http/#Request.FormValue) 和 [`r.PostFormValue()`](https://pkg.go.dev/net/http/#Request.PostFormValue)。这些本质上是快捷函数，它们会为你调用\
  \ `r.ParseForm()`，然后分别从 `r.Form` 或 `r.PostForm` 获取相应的字段值。\n\n我建议避免使用这些快捷方法，因为它们会`静默忽略任何由\
  \ r.ParseForm() 返回的错误`。这并不理想——意味着我们的应用程序可能会遇到错误并导致用户端失败，但没有反馈机制让他们知道。\n\n#### 多值字段\n\
  \n严格来说，我们上面使用的 `r.PostForm.Get()` 方法只返回特定表单字段的第一个值。这意味着你不能将它用于可能发送多个值的表单字段，例如复选框组。\n\
  \n```\n<input type=\"checkbox\" name=\"items\" value=\"foo\"> Foo\n<input type=\"\
  checkbox\" name=\"items\" value=\"bar\"> Bar\n<input type=\"checkbox\" name=\"items\"\
  \ value=\"baz\"> Baz\n```\n\n在这种情况下，你将需要直接处理 `r.PostForm` 映射。`r.PostForm` 映射的底层类型是\
  \ [`url.Values`](https://pkg.go.dev/net/url/#Values)，它的底层类型是 `map[string][]string`。因此，对于具有多个值的字段，你可以遍历底层映射来访问它们，如下：\n\
  \n```\nfor i, item := range r.PostForm[\"items\"] {\n    fmt.Fprintf(w, \"%d: Item\
  \ %s\\n\", i, item)\n}\n```\n\n#### 限制表单大小\n\n除非你发送多部分数据（即你的表单具有 `enctype=\"multipart/form-data\"\
  ` 属性），否则 `POST`、`PUT` 和 `PATCH` 请求体被限制为 10MB。如果超过此限制，`r.ParseForm()` 将返回错误。\n\n\
  如果你想更改此限制，可以使用 [`http.MaxBytesReader()`](https://pkg.go.dev/net/http/#MaxBytesReader)\
  \ 函数，如下：\n\n```go\n// 限制请求体大小为 4096 字节\nr.Body = http.MaxBytesReader(w, r.Body,\
  \ 4096)\n\nerr := r.ParseForm()\nif err != nil {\n    http.Error(w, \"Bad Request\"\
  , http.StatusBadRequest)\n    return\n}\n```\n\n在 `r.ParseForm()` 期间，只会读取请求体的前 4096\
  \ 字节。尝试读取超过此限制会导致 `MaxBytesReader` 返回错误，该错误会被 `r.ParseForm()` 暴露。\n\n此外——如果触发了限制——`MaxBytesReader`\
  \ 会在 `http.ResponseWriter` 上设置一个标记，指示服务器关闭底层 TCP 连接。\n\n## 8.3. 验证表单数据\n\n现在我们的代码中有一个明显的问题：我们没有以任何方式对来自表单的（不可的）用户输入进行验证。我们应该这样做以确保表单数据存在、类型正确，并符合我们的任何业务规则。\n\
  \n具体对于这个表单，我们希望：\n\n*   检查 `title` 和 `content` 字段是否为空。\n*   检查 `title` 字段长度是否超过\
  \ 100 个字符。\n*   检查 `expires` 值是否精确匹配我们允许的值之一（`1`、`7` 或 `365` 天）。\n\n所有这些检查都可以使用\
  \ Go 的 `if` 语句以及 Go [`strings`](https://pkg.go.dev/strings/) 和 [`unicode/utf8`](https://pkg.go.dev/unicode/utf8/)\
  \ 包中的各种函数来相当直接地实现。\n\n打开你的 `handlers.go` 文件并更新 `snippetCreatePost` 处理程序以包含适当的验证规则，如下：\n\
  \n文件：cmd/web/handlers.go\n\n\n\n\n\n```go\npackage main\n\nimport (\n    \"errors\"\
  \n    \"fmt\"\n    \"net/http\"\n    \"strconv\"\n    \"strings\"      // 新导入\n\
  \    \"unicode/utf8\" // 新导入\n\n    \"snippetbox.alexedwards.net/internal/models\"\
  \n\n    \"github.com/julienschmidt/httprouter\"\n)\n\n...\n\nfunc (app *application)\
  \ snippetCreatePost(w http.ResponseWriter, r *http.Request) {\n    err := r.ParseForm()\n\
  \    if err != nil {\n        app.clientError(w, http.StatusBadRequest)\n      \
  \  return\n    }\n\n    title := r.PostForm.Get(\"title\")\n    content := r.PostForm.Get(\"\
  content\")\n\n    expires, err := strconv.Atoi(r.PostForm.Get(\"expires\"))\n  \
  \  if err != nil {\n        app.clientError(w, http.StatusBadRequest)\n        return\n\
  \    }\n\n    // Initialize a map to hold any validation errors for the form fields.\n\
  \    fieldErrors := make(map[string]string)\n\n    // Check that the title value\
  \ is not blank and is not more than 100\n    // characters long. If it fails either\
  \ of those checks, add a message to the\n    // errors map using the field name\
  \ as the key.\n    if strings.TrimSpace(title) == \"\" {\n        fieldErrors[\"\
  title\"] = \"This field cannot be blank\"\n    } else if utf8.RuneCountInString(title)\
  \ > 100 {\n        fieldErrors[\"title\"] = \"This field cannot be more than 100\
  \ characters long\"\n    }\n\n    // Check that the Content value isn't blank.\n\
  \    if strings.TrimSpace(content) == \"\" {\n        fieldErrors[\"content\"] =\
  \ \"This field cannot be blank\"\n    }\n\n    // Check the the expires value matches\
  \ one of the permitted values (1, 7 or\n    // 365).\n    if expires != 1 && expires\
  \ != 7 && expires != 365 {\n        fieldErrors[\"expires\"] = \"This field must\
  \ equal 1, 7 or 365\"\n    }\n\n    // If there are any errors, dump them in a plain\
  \ text HTTP response and\n    // return from the handler.\n    if len(fieldErrors)\
  \ > 0 {\n        fmt.Fprint(w, fieldErrors)\n        return\n    }\n\n    id, err\
  \ := app.snippets.Insert(title, content, expires)\n    if err != nil {\n       \
  \ app.serverError(w, err)\n        return\n    }\n\n    http.Redirect(w, r, fmt.Sprintf(\"\
  /snippet/view/%d\", id), http.StatusSeeOther)\n}\n```\n\n好了，让我们尝试一下！重启应用程序，并尝试提交一个带有过长的片段标题和空白内容字段的表单，就像这样……\n\
  \n![](img/08.03-01.png)\n\n你应该能看到相应的验证失败消息的输出，如下所示：\n\n![](img/08.03-02.png)\n\n\
  # 第 8.4 节。\n\n## 显示错误并重新填充字段\n\n现在 `snippetCreatePost` 处理器正在对数据进行验证，下一个阶段是优雅地管理这些验证错误。\n\
  \n如果存在任何验证错误，我们需要重新显示 HTML 表单，高亮显示失败的字段，并自动重新填充之前提交的数据（这样用户就不需要再次输入了）。\n\n为了实现这一点，让我们先向\
  \ `templateData` 结构体添加一个新的的 `Form` 字段：\n\n文件：`cmd/web/templates.go`\n\n```go\npackage\
  \ main\n\nimport (\n    \"html/template\"\n    \"path/filepath\"\n    \"time\"\n\
  \n    \"snippetbox.alexedwards.net/internal/models\"\n)\n\n// 添加一个类型为 \"any\" 的\
  \ Form 字段。\ntype templateData struct {\n    CurrentYear int\n    Snippet     *models.Snippet\n\
  \    Snippets    []*models.Snippet\n    Form        any\n}\n\n...\n```\n\n我们将使用这个\
  \ `Form` 字段在重新显示表单时，将验证错误和之前提交的数据传回模板。\n\n接下来，回到 `cmd/web/handlers.go` 文件，定义一个新的\
  \ `snippetCreateForm` 结构体类型来存储表单数据和任何验证错误，并更新我们的 `snippetCreatePost` 处理器以使用它。\n\n\
  如下所示：\n\n文件：`cmd/web/handlers.go`\n\n```go\npackage main\n\n...\n\n// 定义一个 snippetCreateForm\
  \ 结构体来表示表单数据和\n// 表单字段的验证错误。注意，所有的结构体字段都刻意\n// 导出了（即以大写字母开头）。这是因为结构体字段必须\n// 导出才能被\
  \ html/template 包在渲染模板时进行读取。\ntype snippetCreateForm struct {\n    Title       string\n\
  \    Content     string\n    Expires     int\n    FieldErrors map[string]string\n\
  }\n\nfunc (app *application) snippetCreatePost(w http.ResponseWriter, r *http.Request)\
  \ {\n    err := r.ParseForm()\n    if err != nil {\n        app.clientError(w, http.StatusBadRequest)\n\
  \        return\n    }\n\n    // 正常地从表单中获取 expires 值。\n    expires, err := strconv.Atoi(r.PostForm.Get(\"\
  expires\"))\n    if err != nil {\n        app.clientError(w, http.StatusBadRequest)\n\
  \        return\n    }\n\n    // 创建一个 snippetCreateForm 实例，包含来自表单的值\n    // 以及用于验证错误的映射。\n\
  \    form := snippetCreateForm{\n        Title:       r.PostForm.Get(\"title\"),\n\
  \        Content:     r.PostForm.Get(\"content\"),\n        Expires:     expires,\n\
  \        FieldErrors: map[string]string{},\n    }\n\n    // 更新验证检查，以便它们作用于\n   \
  \ // form 实例。\n    if strings.TrimSpace(form.Title) == \"\" {\n        form.FieldErrors[\"\
  title\"] = \"This field cannot be blank\"\n    } else if utf8.RuneCountInString(form.Title)\
  \ > 100 {\n        form.FieldErrors[\"title\"] = \"This field cannot be more than\
  \ 100 characters long\"\n    }\n\n    if strings.TrimSpace(form.Content) == \"\"\
  \ {\n        form.FieldErrors[\"content\"] = \"This field cannot be blank\"\n  \
  \  }\n\n    if expires != 1 && expires != 7 && expires != 365 {\n        form.FieldErrors[\"\
  expires\"] = \"This field must equal 1, 7 or 365\"\n    }\n\n    // 如果存在任何验证错误，重新显示\
  \ create.tmpl 模板\n    // 并传入 Form 字段。注意我们在发送响应时\n    // 使用 422 Unprocessable Entity\
  \ 状态码。\n    if len(form.FieldErrors) > 0 {\n        data := app.newTemplateData(r)\n\
  \        data.Form = form\n        app.render(w, http.UnprocessableEntity, \"create.tmpl\"\
  , data)\n        return\n    }\n\n    // 我们还需要更新此行，将 snippetCreateForm\n    // 数据传递给我们的\
  \ Insert 方法。\n    id, err := app.snippets.Insert(form.Title, form.Content, form.Expires)\n\
  \    if err != nil {\n        app.serverError(w, err)\n        return\n    }\n\n\
  \    http.Redirect(w, r, fmt.Sprintf(\"/snippet/view/%d\", id), http.StatusSeeOther)\n\
  }\n```\n\n好了，现在当存在任何验证错误时，我们都会重新显示 `create.tmpl` 模板，通过模板数据的 `Form` 字段传入之前的数据和验证错误（`snippetCreateForm`）。\n\
  \n如果你愿意，现在可以运行程序，代码应该可以无错误编译。\n\n### 更新 HTML 模板\n\n接下来我们需要做的另一件事是更新我们的 `create.tmpl`\
  \ 模板，以显示验证错误并重新填充任何之前的数据。\n\n重新填充表单数据很容易——我们应该能够使用类似 `{{.Form.Title}}` 和 `{{.Form.Content}}`\
  \ 的标签进行渲染，就像我们在书中之前显示片段数据一样。\n\n对于验证错误，我们 `FieldErrors` 字段的底层类型是 `map[string]string`，它使用表单字段名作为键。对于映射，可以通过链链键名访问给定键的值。因此，例如，要在模板中渲染\
  \ `title` 字段的验证错误，我们可以使用标签 `{{.Form.FieldErrors.title}}`。\n\n考虑到这一点，让我们更新 `create.tmpl`\
  \ 文件，重新填充数据并显示每个字段的错误消息（如果存在的话）。\n\n文件：`ui/html/pages/create.tmpl`\n\n\n\n\n\n```go\n\
  {{define \"title\"}}创建新代码片段{{end}}\n\n{{define \"main\"}}\n<form action='/snippet/create'\
  \ method='POST'>\n    <div>\n        <label>Title:</label>\n        <!-- Use the\
  \ `with` action to render the value of .Form.FieldErrors.title\n        if it is\
  \ not empty. -->\n        {{with .Form.FieldErrors.title}}\n            <label class='error'>{{.}}</label>\n\
  \        {{end}}\n        <!-- Re-populate the title data by setting the `value`\
  \ attribute. -->\n        <input type='text' name='title' value='{{.Form.Title}}'>\n\
  \    </div>\n    <div>\n        <label>Content:</label>\n        <!-- Likewise render\
  \ the value of .Form.FieldErrors.content if it is not\n        empty. -->\n    \
  \    {{with .Form.FieldErrors.content}}\n            <label class='error'>{{.}}</label>\n\
  \        {{end}}\n        <!-- Re-populate the content data as the inner HTML of\
  \ the textarea. -->\n        <textarea name='content'>{{.Form.Content}}</textarea>\n\
  \    </div>\n    <div>\n        <label>Delete in:</label>\n        <!-- And render\
  \ the value of .Form.FieldErrors.expires if it is not empty. -->\n        {{with\
  \ .Form.FieldErrors.expires}}\n            <label class='error'>{{.}}</label>\n\
  \        {{end}}\n        <!-- Here we use the `if` action to check if the value\
  \ of the re-populated\n        expires field equals 365. If it does, then we render\
  \ the `checked`\n        attribute so that the radio input is re-selected. -->\n\
  \        <input type='radio' name='expires' value='365' {{if (eq .Form.Expires 365)}}checked{{end}}>\
  \ 一年\n        <!-- And we do the same for the other possible values too... -->\n\
  \        <input type='radio' name='expires' value='7' {{if (eq .Form.Expires 7)}}checked{{end}}>\
  \ 一周\n        <input type='radio' name='expires' value='1' {{if (eq .Form.Expires\
  \ 1)}}checked{{end}}> 一天\n    </div>\n    <div>\n        <input type='submit' value='Publish\
  \ snippet'>\n    </div>\n</form>\n{{end}}\n```\n\n希望这些标记以及我们对 Go 模板动作的使用是清晰的——这只是在使用了我们在书前面的部分见过并讨论过的技巧。\n\
  \n我们还有最后一件事需要做。如果我们现在尝试运行应用程序，当我们第一次访问 [`http://localhost:4000/snippet/create`](http://localhost:4000/snippet/create)\
  \ 表单时，将会得到一个 `500 Internal Server Error`。这是因为我们的 `snippetCreate` 处理器目前没有为 `templateData.Form`\
  \ 字段设置值，这意味着当 Go 尝试评估像 `{{with .Form.FieldErrors.title}}` 这样的模板标签时，将导致错误，因为 `Form`\
  \ 是 `nil`。\n\n让我们通过更新 `snippetCreate` 处理器来修复这个问题，使其初始化一个新的 `createSnippetForm` 并将其传递给模板，如下所示：\n\
  \n文件：`cmd/web/handlers.go`\n\n```go\npackage main\n\n...\n\nfunc (app *application)\
  \ snippetCreate(w http.ResponseWriter, r *http.Request) {\n    data := app.newTemplateData(r)\n\
  \n    // 初始化一个新的 createSnippetForm 并将其传递给模板。// 注意，这也是设置表单任何\n    // 默认值的绝佳机会在这里在这里我们设置了过期\n\
  \    // 时间的初始值为 365 天。\n    data.Form = snippetCreateForm{\n\n    app.render(w,\
  \ http.StatusOK, \"snippet/create\", data)\n}\n```\n\n重启应用程序并访问 `http://localhost:4000/snippet/create`。你应该能看到表单，并且“一年”单选框是被选中的。\n\
  \n\n\n\n\n```go\npackage main\n\nimport (\n    \"errors\"\n    \"fmt\"\n    \"net/http\"\
  \n    \"strconv\"\n\n    \"snippetbox.alexedwards.net/internal/models\"\n    \"\
  snippetbox.alexedwards.net/internal/validator\" // 新导入\n\n    \"github.com/julienschmidt/httprouter\"\
  \n)\n\n...\n\n// 显式的 FieldErrors 结构体字段，而是而是嵌入 Validator 类型。\n// 嵌入意味着我们的 snippetCreateForm\
  \ “继承”了 Validator \n// 类型的所有字段和方法（包括 FieldErrors 字段）。\ntype snippetCreateForm struct\
  \ {\n    Title               string \n    Content             string \n    Expires\
  \             int    \n    validator.Validator\n}\n\nfunc (app *application) snippetCreatePost(w\
  \ http.ResponseWriter, r *http.Request) {\n    err := r.ParseForm()\n    if err\
  \ != nil {\n        app.clientError(w, http.StatusBadRequest)\n        return\n\
  \    }\n\n    expires, err := strconv.Atoi(r.PostForm.Get(\"expires\"))\n    if\
  \ err != nil {\n        app.clientError(w, http.StatusBadRequest)\n        return\n\
  \    }\n\n    form := snippetCreateForm{\n        Title:   r.PostForm.Get(\"title\"\
  ),\n        Content: r.PostForm.Get(\"content\"),\n        Expires: expires,\n \
  \       // 从这里删除 FieldErrors 赋值。\n    }\n\n    // 因为 Validator 类型被 snippetCreateForm\
  \ 结构体嵌入，\n    // 我们可以直接在上面调用 CheckField() 来执行我们的验证检查。\n    // 如果检查结果为假，CheckField()\
  \ 将将提供的键和错误消息\n    // 添加到 FieldErrors 映射中。例如，在这里的\n    // 第一行中我们“检查 form.Title 字段是否为空”。在\n\
  \    // 第二行中，我们“检查 form.Title 字段的最大字符\n    // 长度为 100”，以此类推。\n    form.CheckField(validator.NotBlank(form.Title),\
  \ \"title\", \"此字段不能为空\")\n    form.CheckField(validator.MaxChars(form.Title, 100),\
  \ \"title\", \"此字段长度不能超过 100 个字符\")\n    form.CheckField(validator.NotBlank(form.Content),\
  \ \"content\", \"此字段不能为空\")\n    form.CheckField(validator.PermittedInt(form.Expires,\
  \ 1, 7, 365), \"expires\", \"此字段必须等于 1、7 或 365\")\n\n    // 使用 Valid() 方法查看是否任何检查失败了。如果失败了，\n\
  \    // 则像以前一样传递表单数据并重新渲染模板。\n    if !form.Valid() {\n        data := app.newTemplateData(r)\n\
  \        data.Form = form\n        app.render(w, http.StatusUnprocessableEntity,\
  \ \"create.tmpl\", data)\n        return\n    }\n\n    id, err := app.snippets.Insert(form.Title,\
  \ form.Content, form.Expires)\n    if err != nil {\n        app.serverError(w, err)\n\
  \        return\n    }\n\n    http.Redirect(w, r, fmt.Sprintf(\"/snippet/view/%d\"\
  , id), http.StatusSeeOther)\n}\n```\n\n所以这一切正井井条地变得非常完美。\n\n我们现在有了一个 `internal/validator`\
  \ 包，其中包含了可以在应用程序中复用的验证规则和逻辑，并且将来可以轻松扩展以包含额外的规则。表单数据和错误都整齐地封装在单个 `snippetCreateForm`\
  \ 结构体中——我们可以轻松地将其传递给模板——而且在模板中显示错误消息和重新填充数据的 API 既简单又一致。\n\n如果你愿意，现在可以重新运行应用程序了。如果一切顺利，你应该会发现表单和验证规则运行正常，且工作方式与之前完全相同。\n\
  \n第 8.6 节。\n\n## 自动表单解析\n\n我们可以简化处理函数的另一个方法是使用第三方包，如 [`go-playground/form`](https://github.com/go-playground/form)\
  \ 或 [`gorilla/schema`](https://github.com/gorilla/schema)，自动将表单数据解码到 `createSnippetForm`\
  \ 结构体中。使用自动解码器是完全可选的，但它可以帮助你节省时间和打字量——特别是当你的应用程序有很多表单，或者你需要处理一个非常大的表单时。\n\n在本章中，我们将查看如何使用\
  \ `go-playground/form` 包。如果你正在跟随学习，请按照以下方式安装它：\n\n```\n$ go get github.com/go-playground/form/v4@v4\n\
  go get: added github.com/go-playground/form/v4 v4.2.0\n```\n\n### 使用表单解码器\n\n为了让其工作，我们需要做的第一件事是在\
  \ `main.go` 文件初始化一个新的 [`*form.Decoder`](https://pkg.go.dev/github/com/go-playground/form?utm_source=godoc#Decoder)\
  \ 实例，并将其作为依赖提供给我们的处理函数。如下：\n\nFile: cmd/web/main.go\n\n```go\npackage main\n\nimport\
  \ (\n    \"database/sql\"\n    \"flag\"\n    \"html/template\"\n    \"log\"\n  \
  \  \"net/http\"\n    \"os\"\n\n    \"snippetbox.alexedwards.net/internal/models\"\
  \n\n    \"github.com/go-playground/form/v4\" // 新导入\n    _ \"github.com/sql-driver/mysql\"\
  \n)\n\n// 添加 formDecoder 字段以持有 Decoder 的指针。\ntype application struct {\n    errorLog\
  \      *log.Logger\n    infoLog       *log.Logger\n    snippets      *models.SnippetModel\n\
  \    templateCache map[string]*template.Template\n    formDecoder   *form.Decoder\n\
  }\n\nfunc main() {\n    addr := flag.String(\"addr\", \":4000\", \"HTTP 网络地址\")\n\
  \    dsn := flag.String(\"dsn\", \"web:pass@/snippetbox?parseTime=true\", \"MySQL\
  \ 数据源名称\")\n\n    flag.Parse()\n\n    infoLog := log.New(os.Stdout, \"INFO\\t\"\
  , log.Ldate|log.Ltime)\n    errorLog := log.New(os.Stderr, \"ERROR\\t\", log.Ldate|log.Ltime|log.shortfile)\n\
  \n    db, err := openDB(*dsn)\n    if err != nil {\n        errorLog.Fatal(err)\n\
  \    }\n    defer db.Close()\n\n    templateCache, err := newTemplateCache()\n \
  \   if err != nil {\n        errorLog.Fatal(err)\n    }\n\n    // 初始化解码器实例...\n\
  \    formDecoder := form.NewDecoder()\n\n    // 并将其添加到应用程序依赖中。\n    app := &application{\n\
  \        errorLog:      errorLog,\n        infoLog:       infoLog,\n        snippets:\
  \      &models.SnippetModel{DB: db},\n        templateCache: templateCache,\n  \
  \      formDecoder:   formDecoder,\n    }\n\n    srv := &http.Server{\n        Addr:\
  \     *addr,\n        ErrorLog: errorLog,\n        Handler:  app.routes(),\n   \
  \ }\n\n    infoLog.Printf(\"Starting server on %s\", *addr)\n    err = srv.ListenAndServe()\n\
  \    errorLog.Fatal(err)\n}\n\n```\n\n...\n```\n\n接下来进入 `cmd/web/handlers.go` 文件并更新它以使用这个新的解码器，如下：\n\
  \nFile: cmd/web/handlers.go\n\n```\n\n\n\n\n```go\npackage main\n\n...\n\n// 更新我们的\
  \ snippetCreateForm 结构体以包含结构体标签，告诉解码器\n// 如何将 HTML 表单值映射到不同的结构体字段。例如，\n// 我们在这里告诉解码器将名称为\
  \ \"title\" 的 HTML 表单输入的值\n// 在 Title 字段中。结构体标签 `form:\"-\"` \n// 告诉解码器在解码期间完全忽略该字段。\n\
  type snippetCreateForm struct {\n    Title               string `form:\"title\"\
  `\n    Content             string `form:\"content\"`\n    Expires             int\
  \    `form:\"expires\"`\n    validator.Validator `form:\"-\"`\n}\n\nfunc (app *application)\
  \ snippetCreatePost(w http.ResponseWriter, r *http.Request) {\n    err := r.ParseForm()\n\
  \    if err != nil {\n        app.clientError(w, http.StatusBadRequest)\n      \
  \  return\n    }\n\n    // 声明 snippetCreateForm 结构体的新空实例。\n    var form snippetCreateForm\n\
  \n    // 调用表单解码器的 Decode() 方法，传入当前请求\n    // 以及我们 snippetCreateForm 结构体的*指针*。这本质上\n\
  \    // 将来自 HTML 表单的相关值填充到我们的结构体。\n    // 如果出现问题，我们向客户端返回 400 Bad Request 响应。\n\
  \    err = app.formDecoder.Decode(&form, r.PostForm)\n    if err != nil {\n    \
  \    app.clientError(w, http.StatusBadRequest)\n        return\n    }\n\n    //\
  \ 然后正常地进行验证并使用数据...\n    form.CheckField(validator.NotBlank(form.Title), \"title\"\
  , \"此字段不能为空\")\n    form.CheckField(validator.MaxChars(form.Title, 100), \"title\"\
  , \"此字段不能超过 100 个字符\")\n    form.CheckField(validator.NotBlank(form.Content), \"\
  content\", \"此字段不能为空\")\n    form.CheckField(validator.PermittedInt(form.Expires,\
  \ 1, 7, 365), \"expires\", \"此字段必须等于 1, 7 或 365\")\n\n    if !form.Valid() {\n \
  \       data := app.newTemplateData(r)\n        data.Form = form\n        app.render(w,\
  \ http.StatusUnprocessableEntity, \"create.tmpl\", data)\n        return\n    }\n\
  \n    id, err := app.snippets.Insert(form.Title, form.Content, form.Expires)\n \
  \   if err != nil {\n        app.serverError(w, err)\n        return\n    }\n\n\
  \    http.Redirect(w, r, fmt.Sprintf(\"/snippet/view/%d\", id), http.StatusSeeOther)\n\
  }\n```\n\n希望你能够看到这种模式的用处。我们可以使用简单的结构体标签来定义 HTML 表单与“目标”数据字段之间的映射，而将表单数据解包到目标位置现在只需要我们编写几行代码——无论表单有多大。\n\
  \n重要的是，类型转换也会被自动处理。我们从上面的代码中看到这一点，其中 `expires` 值被自动映射到 `int` 数据类型。\n\n这确实非常棒。但存在一个问题。\n\
  \n当我们调用 `app.formDecoder.Decode()` 时，它需要一个*非空指针*作为目标终终地。如果我们尝试传入一个*不是*非空指针的内容，那么\
  \ `Decode()` 将返回一个 [`form.InvalidDecoderError`](https://pkg.go.dev/github.com/go-playground/form/v4#InvalidDecoderError)\
  \ 错误。\n\n如果发生这种情况，这是我们应用程序代码的关键问题（而不是由于输入错误的客户端错误）。因此，我们需要专门检查此错误并作为特殊情况进行处理，而不是仅仅返回\
  \ `400 Bad Request` 响应。\n\n### 创建一个 decodePostForm 辅助函数\n\n为了协助，让我们创建一个新的 `decodePostForm()`\
  \ 辅助函数，它执行三件事：\n\n*   在当前请求上调用 `r.ParseForm()`。\n*   调用 `app.formDecoder.Decode()`\
  \ 将 HTML 表单数据解包到目标终点。\n*   检查 `form.InvalidDecoderError` 错误，如果看到它，则触发 panic。\n\n\
  如果你正在跟着操作，请按照如下所示将此内容添加到你的 `cmd/web/helpers.go` 文件中\n\n文件：`cmd/web/helpers.go`\n\
  \n```go\npackage main\n\nimport (\n    \"bytes\"\n    \"errors\"\n    \"fmt\"\n\
  \    \"net/http\"\n    \"runtime/debug\"\n    \"time\"\n\n    \"github.com/go-playground/form/v4\"\
  \ // 新导入\n)\n\n...\n\n// 创建一个新的 decodePostForm() 辅助方法。这里的第二个参数 dst，\n// 是我们想要将表单数据解码到的目标终点。\n\
  func (app *application) decodePostForm(r *http.Request, dst any) error {\n    //\
  \ 在请求上调用 ParseForm()，就像我们在 createSnippetPost\n    // 处理函数中所的那样。\n    err := r.ParseForm()\n\
  \    if err != nil {\n        return err\n    }\n\n    // 在我们的解码器实例上调用 Decode，将目标终点作为\n\
  \    // 第一个参数传入\n    err = app.formDecoder.Decode(dst, r.PostForm)\n    if err !=\
  \ nil {\n        // 如果我们尝试使用无效的目标终点，Decode() 方法\n        // 将返回一个类型为 *form.InvalidDecoderError\
  \ 的错误。\n        var invalidDecoderError *form.InvalidDecoderError\n        if errors.As(err,\
  \ &invalidDecoderError) {\n            panic(invalidDecoderError)\n        }\n\n\
  \        // 对于其他错误，我们正常返回它们。\n        return err\n    }\n\n    return nil\n}\n```\n\
  \n完成这些后，我们可以对 `snippetCreatePost` 处理函数进行最后的简化。更新它使用 `decodePostForm` 并移除 `r.ParseForm()`\
  \ 调用，因此代码如下：\n\n文件：`cmd/web/handlers.go`\n\n```go\nfunc (app *application) snippetCreatePost(w\
  \ http.ResponseWriter, r *http.Request) {\n    var form snippetCreateForm\n\n  \
  \  err := app.decodePostForm(r, &form)\n    if err != nil {\n        app.clientError(w,\
  \ http.StatusBadRequest)\n        return\n    }\n\n    form.CheckField(validator.NotBlank(form.Title),\
  \ \"title\", \"此字段不能为空\")\n    form.CheckField(validator.MaxChars(form.Title, 100),\
  \ \"title\", \"此字段不能超过 100 个字符\")\n    form.CheckField(validator.NotBlank(form.Content),\
  \ \"content\", \"此字段不能为空\")\n    form.CheckField(validator.PermittedInt(form.Expires,\
  \ 1, 7, 365), \"expires\", \"此字段必须等于 1, 7 或 365\")\n\n    if !form.Valid() {\n \
  \       data := app.newTemplateData(r)\n        data.Form = form\n        app.render(w,\
  \ http.StatusUnprocessableEntity, \"create.tmpl\", data)\n        return\n    }\n\
  \n    id, err := app.snippets.Insert(form.Title, form.Content, form.Expires)\n \
  \   if err != nil {\n        app.serverError(w, err)\n        return\n    }\n\n\
  \    http.Redirect(w, r, fmt.Sprintf(\"/snippet/view/%d\", id), http.StatusSeeOther)\n\
  }\n```\n\n\n\n\n## 选择会话管理器\n\n在处理会话时，有许多[安全考虑](https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html)，正确的实现并非易事。除非你真的需要自己实现，否则使用现有的、经过良好测试的第三方包是个好主意。\n\
  \n根据项目需求，我建议使用 [`gorilla/sessions`](https://github.com/gorilla/sessions) 或 [`alexedwards/scs`](https://github.com/alexedwards/scs)。\n\
  \n*   `gorilla/sessions` 是 Go 语言中最为成熟且广为人知的会话管理包。它提供了简单易用的 API，并允许你将会话数据存储在客户端（通过签名和加密的\
  \ cookie）或服务器端（在 MySQL、PostgreSQL 或 Redis 等数据库中）。\n\n    但是——重要的一点——它没有提供更新会话 ID\
  \ 的机制（如果你使用其中一种服务端会话存储器，该机制对于降低[与会话固定攻击相关的风险](https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html#renew-the-session-id-after-any-privilege-level-change)\
  \ 是必要的）。\n\n*   `alexedwards/scs` 允许你仅在服务端存储会话数据。它支持通过中间件自动加载和保存会话数据，拥有良好的接口用于类型安全的数据操作，并且*允许*更新会话\
  \ ID。与 `gorilla/sessions` 类似，它也支持多种数据库（包括 MySQL、PostgreSQL 和 Redis）。\n\n总结来说，如果你想通过\
  \ cookie 在客户端存储会话数据，`gorilla/sessions` 是一个不错的选择；否则，由于能够更新会话 ID 功能，`alexedwards/scs`\
  \ 通常是更好的选择。\n\n对于此项目，我们已经设置好了 MySQL 数据库，因此我们将选择使用 `alexedwards/scs` 将会话数据存储在 MySQL\
  \ 服务端。\n\n如果你正在跟随操作，请确保你处于项目目录，并按照如下命令安装必要的包：\n\n```\n$ go get github.com/alexedwards/scs/v2@v2\n\
  go: downloading github.com/alexedwards/scs/v2 v2.5.0\ngo get: added github.com/alexedwards/scs/v2\
  \ v2.5.0\n\n$ go get github.com/alexedwards/scs/mysqlstore\ngo: downloading github.com/alexedwards/scs/mysqlstore\
  \ v0.0.0-20220216073957-c252878bcf5a\ngo get: added github.com/alexedwards/scs/mysqlstore\
  \ v0.0.0-20220216073957-c252878bcf5a\n```\n\n第 9.2 节。\n\n## 设置会话管理器\n\n在本章中，我将介绍设置和使用\
  \ `alexedwards/scs` 包的过程，但如果你打算在生产环境的应用中使用它，我建议阅读[文档](https://github.com/alexedwards/scs)\
  \ 和 [API 参考](https://pkg.go.dev/github/com/alexedwards/scs/v2)以熟悉其全部功能。\n\n我们需要做的第一件事是在\
  \ MySQL 数据库中创建一个 `sessions` 表，用于存储用户的会话数据。首先在终端窗口以 `root` 用户身份连接 MySQL，并执行以下 SQL\
  \ 语句来建立 `sessions` 表：\n\n```sql\nUSE snippetbox;\n\nCREATE TABLE sessions (\n  \
  \  token CHAR(43) PRIMARY KEY,\n    data BLOB NOT NULL,\n    expiry TIMESTAMP(6)\
  \ NOT NULL\n);\n\nCREATE INDEX sessions_expiry_idx ON sessions (expiry);\n```\n\n\
  在此表中：\n\n*   `token` 字段将包含每个会话的唯一、随机生成的标识符。\n\n*   `data` 字段将包含你想要在 HTTP 请求之间共享的实际会话数据。它以*二进制数据*的形式存储在\
  \ `BLOB`（二进制大对象）类型中。\n\n*   `expiry` 字段将包含会话的过期时间。`scs` 包会自动从 `sessions` 表中删除过期的会话，以防止其增长过大。\n\
  \n接下来，我们需要在 `main.go` 文件中建立一个会话管理器，并通过 `application` 结构体使我们的处理器可以访问它。会话管理器持有会话的配置设置，并提供了一些中间件和辅助方法来处理会话数据的加载和保存。\n\
  \n打开你的 `main.go` 文件并按如下所示更新：\n\n文件：`cmd/web/main.go`\n\n```go\npackage main\n\n\
  import (\n    \"database/sql\"\n    \"flag\"\n    \"html/template\"\n    \"log\"\
  \n    \"net/http\"\n    \"os\"\n    \"time\" // 新导入\n\n    \"snippetbox.alexedwards.net/internal/models\"\
  \n\n    \"github.com/alexedwards/scs/mysqlstore\" // 新导入\n    \"github.com/alexedwards/scs/v2\"\
  \         // 新导入\n    \"github.com/go-playground/form/v4\"\n    _ \"github.com/go-sql-driver/mysql\"\
  \n)\n\n// 为 application 结构体添加新字段\ntype application struct {\n    errorLog      \
  \ *log.Logger\n    infoLog        *log.Logger\n    snippets       *models.SnippetModel\n\
  \    templateCache  map[string]*template.Template\n    formDecoder    *form.Decoder\n\
  \    sessionManager *scs.SessionManager\n}\n\nfunc main() {\n    addr := flag.String(\"\
  addr\", \":4000\", \"HTTP 网络地址\")\n    dsn := flag.String(\"dsn\", \"web:pass@/snippetbox?parseTime=true\"\
  , \"MySQL 数据名称\")\n\n    flag.Parse()\n\n    infoLog := log.New(os.Stdout, \"INFO\\\
  t\", log.date|log.time)\n    errorLog := log.New(os.Stderr, \"ERROR\\t\", log.date|log.time|log.shortfile)\n\
  \n    db, err := openDB(*dsn)\n    if err != nil {\n        errorLog.Fatal(err)\n\
  \    }\n    defer db.Close()\n\n    templateCache, err := newTemplateCache()\n \
  \   if err != nil {\n        errorLog.Fatal(err)\n    }\n\n    formDecoder := form.NewDecoder()\n\
  \n    // 使用 scs.New() 函数初始化会话管理器。然后\n    // 配置其使用 MySQL 数据库作为会话存储，并设置 12 小时的\n \
  \   // 生命周期（在首次创建后 12 小时自动过期）。\n    sessionManager := scs.New()\n    sessionManager.Store\
  \ = mysqlstore.New(db)\n    sessionManager.Lifetime = 12 * time.Hour\n\n    // 将会话管理器添加到应用程序依赖中。\n\
  \    app := &application{\n        errorLog:       errorLog,\n        infoLog: \
  \       infoLog,\n        snippets:       &models.SnippetModel{DB: db},\n      \
  \  templateCache:  templateCache,\n        formDecoder:    formDecoder,\n      \
  \  sessionManager: sessionManager,\n    }\n\n    srv := &http.Server{\n        Addr:\
  \     *addr,\n        ErrorLog: errorLog,\n        Handler:  app.routes(),\n   \
  \ }\n\n    infoLog.Printf(\"Starting server on %s\", *addr)\n    err = srv.ListenAndServe()\n\
  \    errorLog.Fatal(err)\n}\n\n...\n```\n\n为了让会话正常工作，我们还需要用 [`SessionManager.LoadAndSave()](https://pkg.go.dev/github/com/alexedwards/scs/v2#SessionManager.LoadAndSave())\
  \ 方法提供的中间件包装我们的应用程序路由。该中间件会在每次 HTTP 请求和响应中自动加载和保存会话数据。\n\n需要注意的是，我们不需要该中间件作用于我们的*所有*应用程序路由。具体来说，我们不需要在\
  \ `/static/*filepath` 路由上使用它，因为该路由的作用只是提供静态文件，不需要任何状态行为。\n\n因此，由于由于，将会话中间件添加到现有的\
  \ `standard` 中间链中是不合理的。\n\n相反，让我们创建一个新的 `dynamic` 中间链，包含适用于我们动态应用程序路由的中间件。\n\n打开\
  \ `routes.go` 文件并按如下所示更新：\n\n文件：`cmd/web/routes.go`\n\n\n\n\n```go\npackage main\n\
  \nimport (\n    \"net/http\"\n\n    \"github.com/julienschmidt/httprouter\"\n  \
  \  \"github.com/justinas/alice\"\n)\n\nfunc (app *application) routes() http.Handler\
  \ {\n    router := httprouter.New()\n\n    router.NotFound = http.HandlerFunc(func(w\
  \ http.ResponseWriter, r *http.Request) {\n        app.notFound(w)\n    })\n\n \
  \   // Leave the static files route unchanged.\n    fileServer := http.FileServer(http.Dir(\"\
  ./ui/static/\"))\n    router.Handler(http.MethodGet, \"/static/*filepath\", http.StripPrefix(\"\
  /static\", fileServer))\n\n    // Create a new middleware chain containing the middleware\
  \ specific to our\n    // dynamic application routes. For now, this chain will only\
  \ contain the\n    // LoadAndSave session middleware but we'll add more to it later.\n\
  \    dynamic := alice.New(app.sessionManager.LoadAndSave)\n\n    // Update these\
  \ routes to use the new dynamic middleware chain followed by\n    // the appropriate\
  \ handler function. Note that because the alice ThenFunc()\n    // method returns\
  \ a http.Handler (rather than a http.HandlerFunc) we also\n    // need to switch\
  \ to registering the route using the router.Handler() method.\n    router.Handler(http.MethodGet,\
  \ \"/\", dynamic.ThenFunc(app.home))\n    router.Handler(http.MethodGet, \"/snippet/view/:id\"\
  , dynamic.ThenFunc(app.snippetView))\n    router.Handler(http.MethodGet, \"/snippet/create\"\
  , dynamic.ThenFunc(app.snippetCreate))\n    router.Handler(http.MethodPost, \"/snippet/create\"\
  , dynamic.ThenFunc(app.snippetCreatePost))\n\n    standard := alice.New(app.recoverPanic,\
  \ app.logRequest, secureHeaders)\n    return standard.Then(router)\n}\n```\n\n如果你现在运行该程序，你应该发现它编译完全无误，并且你的应用程序路由继续正常工作。\n\
  \n***\n\n### 额外信息\n\n#### 不使用 alice\n\n如果你没有使用 `justinas/alice` 包来帮助管理你的中间件链，那么你将需要使用\
  \ `http.HandlerFunc()` 适配器将你的处理函数（如 `app.home`）转换为 `http.Handler`，然后用会话中间件包裹它。如下：\n\
  \n```go\nrouter := httprouter.New()\nrouter.Handler(http.MethodGet, \"/\", app.sessionManager.LoadAndSave(http.HandlerFunc(app.home)))\n\
  router.Handler(http.MethodGet, \"/snippet/view/:id\", app.sessionManager.LoadAndSave(http.HandlerFunc(app.snippetView)))\n\
  // ... 等\n```\n\n第 9.3 章\n\n## 处理会话数据\n\n在本章中，让我们让会话功能运行起来，并使用它在 HTTP 请求之间持久化闪消息（flash\
  \ message），这是我们之前讨论过的。\n\n我们将从 `cmd/web/handlers.go` 文件开始，更新我们的 `snippetCreatePost`，使得如果且仅当代码创建成功，就会向用户的会话数据中添加闪消息。如下：\n\
  \n文件：`cmd/web/handlers.go`\n\n```go\npackage main\n\n...\n\nfunc (app *application)\
  \ snippetCreatePost(w http.ResponseWriter, r *http.Request) {\n    var form snippetCreateForm\n\
  \n    err := app.decodePostForm(r, &form)\n    if err != nil {\n        app.clientError(w,\
  \ http.StatusBadRequest)\n        return\n    }\n\n    form.CheckField(validator.NotBlank(form.Title),\
  \ \"title\", \"This field cannot be blank\")\n    form.CheckField(validator.MaxChars(form.Title,\
  \ 100), \"title\", \"This field cannot be more than 100 characters long\")\n   \
  \ form.CheckField(validator.NotBlank(form.Content), \"content\", \"This field cannot\
  \ be blank\")\n    form.CheckField(validator.PermittedInt(form.Expires, 1, 7, 365),\
  \ \"expires\", \"This field must equal 1, 7 or 365\")\n\n    if !form.Valid() {\n\
  \        data := app.newTemplateData(r)\n        data.Form = form\n        app.render(w,\
  \ http.StatusUnprocessableEntity, \"create.tmpl\", data)\n        return\n    }\n\
  \n    id, err := app.snippets.Insert(form.Title, form.Content, form.Expires)\n \
  \   if err != nil {\n        app.serverError(w, err)\n        return\n    }\n\n\
  \    // 使用 Put() 方法向会话数据中添加字符串值 (\"Snippet successfully \n    // created!)\" 和对应的键\
  \ (\"flash\")。\n    app.sessionManager.Put(r.Context(), \"flash\", \"Snippet successfully\
  \ created!\")\n\n    http.Redirect(w, r, fmt.Sprintf(\"/snippet/view/%d\", id),\
  \ http.StatusSeeOther)\n}\n```\n\n这看起来非常简单直接，但有几点需要指出：\n\n*   我们传递给 `app.sessionManager.Put()`\
  \ 的第一个参数是当前的请求上下文。我们将在书中后面详细讨论什么是请求上下文以及如何使用它，但现在你只需要将其视为会话管理器在处理函数处理请求临时临时信息的地方。\n\
  *   第二个参数（在我们案例中是字符串 `\"flash\"`）是我们要添加到会话数据中的特定消息的键。接下来，我们希望 `snippetView` 处理函数获取闪消息（如果存在），并传递给\
  \ HTML 模板。因为我们只想显示一次闪消息，所以我们希望从会话数据中获取并移除它。我们可以使用 [`PopString`](https://pkg.go.dev/github.com/alexedwards/scs/v2#SessionManager.PopString)\
  \ 方法同时完成这两个操作。如果会话数据中没有匹配的键，这将返回空字符串。\n\n我将演示：\n\n文件：`cmd/web/handlers.go`\n\n```go\n\
  package main\n\n...\n\nfunc (app *application) snippetView(w http.ResponseWriter,\
  \ r *http.Request) {\n    params := httprouter.ParamsFromContext(r.Context())\n\n\
  \    id, err := strconv.Atoi(params.ByName(\"id\"))\n    if err != nil || id < 1\
  \ {\n        app.notFound(w)\n        return\n    }\n\n    snippet, err := app.snippets.Get(id)\n\
  \    if err != nil {\n        if errors.Is(err, models.ErrNoRecord) {\n        \
  \    app.notFound(w)\n        } else {\n            app.serverError(w, err)\n  \
  \      }\n        return\n    }\n\n    // 使用 PopString() 方法获取 \"flash\" 键的值。\n \
  \   // PopString() 也会从会话数据中删除该键和值，因此它\n    // 像是一次性获取。如果用户没有会话，将创建一个新的空会话。\n   \
  \ flash := app.sessionManager.PopString(r.Context(), \"flash\")\n\n    data := app.newTemplateData(r)\n\
  \    data.Snippet = snippet\n\n    // 将闪消息传递给模板。\n    data.Flash = flash \n\n  \
  \  app.render(w, http.StatusOK, \"view.tmpl\", data)\n}\n\n...\n```\n\n如果你现在尝试运行程序，编译器将（正确地）抱怨\
  \ `Flash` 字段未在 `templateData` 结构体中定义。请按照以下方式添加：\n\n文件：`cmd/web/templates.go`\n\n\
  ```go\npackage main\n\nimport (\n    \"html/template\"\n    \"path/filepath\"\n\
  \    \"time\"\n\n    \"snippetbox.alexedwards.net/internal/models\"\n)\n\ntype templateData\
  \ struct {\n    CurrentYear int\n    Snippet     *models.Snippet\n    Snippets \
  \   []*models.Snippet\n    Form        any\n    Flash       string // 在 templateData\
  \ 结构体中添加 Flash 字段。\n}\n\n...\n```\n\n现在，我们可以更新 `base.tmpl` 文件来显示闪消息（如果存在的话）。\n\n\
  文件：`ui/html/base.tmpl`\n\n\n\n\n\n```go{{define \"base\"}}\n<!doctype html>\n<html\
  \ lang='en'>\n    <head>\n        <meta charset='utf-8'>\n        <title>{{template\
  \ \"title\" .}} - Snippetbox</title>\n        <link rel='stylesheet' href='/static/css/main.css'>\n\
  \        <link rel='shortcut icon' href='/static/img/favicon.ico' type='image/x-icon'>\n\
  \        <link rel='stylesheet' href='https://fonts.googleapis.com/css?family=Ubuntu+Mono:400,700'>\n\
  \    </head>\n    <body\n        <header>\n            <h1><a href='/'>Snippetbox</a></h1>\n\
  \        </header>\n        {{template \"nav\" .}}\n        <main>\n           \
  \ <!-- Display the flash message if one exists -->\n            {{with .Flash}}\n\
  \                <div class='flash'>{{.}}</div>\n            {{end}}\n         \
  \   {{template \"main\" .}}\n        </main>\n        <footer>\n            Powered\
  \ by <a href='https://golang.org/'>Go</a> in {{.CurrentYear}}\n        </footer>\n\
  \        <script src=\"/static/js/main.js\" type=\"text/javascript\"></script>\n\
  \    </body>\n</html>\n{{end}}\n```\n\n记住，`{{with .Flash}}` 块只有在 `.Flash` 的值不为空字符串时才会执行。因此，如果当前用户的会话（session）中没有\
  \ `\"flash\"` 键，结果就是这部分新的标记将根本不会显示。\n\n完成后，保存所有所有文件并重启应用程序。尝试像这样添加一个新的 snippet……\n\
  \n![](img/09.03-01.png)\n\n在重定向之后，你现在应该看到闪回消息（flash message）正在显示：\n\n![](img/09.03-02.png)\n\
  \n如果你尝试刷新页面，可以确认闪回消息不再显示了——它是针对当前用户在创建 snippet 后立即显示的一次次性消息。\n\n![](img/09.03-03.png)\n\
  \n### 自动显示闪回消息\n\n我们可以做的一个小改进（这将为我们在项目后期节省一些工作）是自动化闪回消息的显示，这样在下次渲染任何页面时，任何消息都会自动包含在内。\n\
  \n我们可以通过之前创建的 `newTemplateData()` 辅助方法将任何闪回消息添加到模板数据中来实现这一点，如下：\n\n文件：`cmd/web/helpers.go`\n\
  \n```go\npackage main\n\n...\n\nfunc (app *application) newTemplateData(r *http.Request)\
  \ *templateData {\n    return &templateData{\n        CurrentYear: time.Now().Year(),\n\
  \        // 如果存在闪回消息，则将其添加到模板数据中。\n        Flash:       app.sessionManager.PopString(r.Context(),\
  \ \"flash\"),\n    }\n}\n\n...\n```\n\n做出这一更改意味着我们不再需要在 `snippetView` 句处理器（handler）中检查闪回消息，代码可以恢复成如下所示：\n\
  \n文件：`cmd/web/handlers.go`\n\n```go\npackage main\n\n...\n\nfunc (app *application)\
  \ snippetView(w http.ResponseWriter, r *http.Request) {\n    params := router.ParamsFromContext(r.Context())\n\
  \n    id, err := strconv.Atoi(params.ByName(\"id\"))\n    if err != nil || id <\
  \ 1 {\n        app.notFound(w)\n        return\n    }\n\n    snippet, err := app.snippets.Get(id)\n\
  \    if err != nil {\n        if errors.Is(err, models.ErrNoRecord) {\n        \
  \    app.notFound(w)\n        } else {\n            app.serverError(w, err)\n  \
  \      }\n        return\n    }\n\n    data := app.newTemplateData(r)\n    data.Snippet\
  \ = snippet\n\n    app.render(w, http.StatusOK, \"view.tmpl\", data)\n}\n```\n\n\
  可以尝试运行应用程序并创建另一个 snippet。你应该发现闪回消息仍然有效。\n\n### 附加信息：会话管理的后台机制\n\n我想花一点时间来解析会话管理背后的某些“魔法”，并解释它们在后台是如何运作的。\n\
  \n如果你愿意，打开浏览器中的开发者工具，查看其中一个页面的 cookie 数据。你应该会在请求数据中看到一个名为 `session` 的 cookie，类似于：\n\
  \n![](img/09.03-04.png)\n\n这就是 `session cookie`（会话 cookie），它会在你的浏览器进行每次请求时发送回 Snippetbox\
  \ 应用程序。\n\n会话 cookie 包含 `session token`（会话令牌），也称为 `session ID`。session token 是一个高熵随机字符串，在我的情况下，值是\
  \ `y9y1-mXyQUAM6V59lXNjb_vSGkO7jy-KLdiA4`。需要强调的是，session token 仅仅是一个随机字符串。它本身并不携带或传达任何会话数据（例如我们在本章设置的闪回消息）。\n\
  \n接下来，你可能想打开终端连接到 MySQL，并对 `sessions` 表运行 `SELECT` 查询，以查找你在浏览器中看到的 session token。如下：\n\
  \n```sql\nmysql> SELECT * FROM sessions WHERE token = 'y9y1-mXyQUAM6V59lXNjb_vSGkO7jy-KLdiA4';\n\
  ```\n\n\n\n\n\n*   设置应用程序的基础知识，以便所有请求和响应都通过 HTTPS 安全地提供。\n*   对默认 TLS 设置进行一些合理的调整，以帮助保护用户信息安全，并保持我们的服务器运行快速。\n\
  *   如何在我们的服务器上设置连接超时时间以缓解慢速客户端攻击。\n\n# 第 10.1 节。\n\n## 生成自签名 TLS 证书\n\nHTTPS 本质上是通过\
  \ `TLS`（传输层安全协议）连接发送的 HTTP。由于数据是通过 `TLS` 连接发送的，因此数据经过了加密和签名，这有助于确保其在传输过程中的私密性和完整性。\n\
  \n如果你不熟悉这个术语，`TLS` 本质上是 `SSL`（安全套接层）的现代版本。由于安全性的考虑，`SSL` 现在已被正式弃用，但该名称在公众认知中仍然存在，并且经常与\
  \ `TLS` 互换使用。为了清晰和准确，我们在本书书中统一使用 `TLS` 术语。\n\n在我们的服务器开始使用 HTTPS 之前，我们需要生成一个 `TLS\
  \ 证书`。\n\n对于生产服务器，我建议使用 [Let’s Encrypt](https://letsencrypt.org/) 创建你的 `TLS 证书`，但为了开发目的，最简单的方法是生成自己的`自签名证书`。\n\
  \n自签名证书与普通的 `TLS 证书` 相同，它没有经过受信任的证书颁发机构签名。这意味着你的浏览器在第一次使用时会弹出警告，但它仍然会正确地加密 HTTPS\
  \ 流量，适用于开发和测试。\n\n方便的是，Go 标准库中的 `crypto/tls` 包包含一个 `generate_cert.go` 工具，我们可以用它轻松地创建自己的自签名证书。\n\
  \n如果你正在跟着操作，首先在项目仓库的根目录下创建一个新的 `tls`目录来存放证书，并进入该目录：\n\n```bash\n$ cd $HOME/code/snippetbox\n\
  $ mkdir tls\n$ cd tls\n```\n\n要运行 `generate_cert.go` 工具，你需要知道计算机上安装 Go 标准库源码的位置。如果你使用的是\
  \ Linux、macOS 或 FreeBSD 并遵循了[官方安装说明](https://golang.org/doc/install#install)，那么\
  \ `generate_cert.go` 文件应该位于 `/usr/local/go/src/crypto/tls`。\n\n如果你使用的是 macOS 并使用\
  \ Homebrew 安装了 Go，该文件可能位于 `/usr/local/Cellar/go/<version>/libexec/src/crypto/tls/generate_cert.go`\
  \ 或类似的路径。\n\n一旦你知道了它的位置，就可以像所示运行 `generate_cert.go` 工具：\n\n```bash\n$ go run /usr/local/go/src/crypto/tls/generate_cert.go\
  \ --rsa-bits=2048 --host=localhost\n2022/02/17 18:51:29 wrote cert.pem\n2022/02/17\
  \ 18:51:29 wrote key.pem\n```\n\n在后台，`generate_cert.go` 工具分两个阶段阶段工作：\n\n1.  首先，它生成一个\
  \ [2048 位](https://www.fastly.com/blog/key-size-for-tls)RSA 密钥对，这是一个密码学上安全的[公钥和私钥](https://en.wikipedia.org/wiki/Public-key_cryptography)。\n\
  2.  然后它将私钥存储在 `key.pem` 文件中，并为主机 `localhost` 生成一个包含公钥的自签名 TLS 证书 —— 它将公钥存储在 `cert.pem`\
  \ 文件中。私钥和证书都是 PEM 编码的，这是大多数 TLS 实现使用的标准格式。\n\n你的项目仓库现在看起来应该是这样：\n\n![](img/10.01-01.png)\n\
  \n大搞定！我们现在有了一个可以在开发期间使用的自签名 TLS 证书（以及相应的私钥）。\n\n# 第 10.2 节。\n\n## 运行 HTTPS 服务器\n\
  \n现在我们已经有了自签名 TLS 证书和相应的私钥，启动一个 HTTPS Web 服务器变得既美好又简单——我们只需要打开 `main.go` 文件，并将 `srv.ListenAndServe()`\
  \ 方法替换为 [`srv.ListenAndServeTLS()`](https://pkg.go.dev/net/http/#Server.ListenAndServeTLS)\
  \ 即可。\n\n修改你的 `main.go` 文件以匹配以下代码：\n\n文件：`cmd/web/main.go`\n\n```go\npackage main\n\
  \n...\n\nfunc main() {\n    addr := flag.String(\"addr\", \":4000\", \"HTTP network\
  \ address\")\n    dsn := flag.String(\"dsn\", \"web:pass@/snippetbox?parseTime=true\"\
  , \"MySQL data source name\")\n\n    flag.Parse()\n\n    infoLog := log.New(os.Stdout,\
  \ \"INFO\\t\")\n    errorLog := log.New(os.Stderr, \"ERROR\\t\")\n\n    db, err\
  \ := openDB(*dsn)\n    if err != nil {\n        errorLog.Fatal(err)\n    }\n   \
  \ defer db.Close()\n\n    templateCache, err := newTemplateCache()\n    if err !=\
  \ nil {\n        errorLog.Fatal(err)\n    }\n    ...\n    srv := &http.Server{\n\
  \        Addr:     *addr,\n        ErrorLog: errorLog,\n        Handler:  app.routes(),\n\
  \    }\n\n    infoLog.Printf(\"Starting server on %s\", *addr)\n    // 使用 ListenAndTLS()\
  \ 启动 HTTPS 服务器\n    err = srv.ListenAndServeTLS(\"./cert.pem\", \"./key.pem\")\n\
  \    errorLog.Fatal(err)\n}\n```\n\n当我们运行它时，我们的服务器仍然监听 4000 端口——唯一的区别是它是 HTTPS。\n\
  \n正常运行它：\n\n```bash\n$ cd $HOME/code/snippetbox\n$ go run ./cmd/web\nINFO    2022/02/17\
  \ 19:04:18 Starting server on :4000\n```\n\n如果你打开浏览器访问 [`localhost:4000/`](https://localhost:4000/)，可能会看到类似的浏览器警告。\n\
  \n![](img/10.02-01.png)\n\n*   如果你一样使用 Firefox，点击“高级”，然后“接受风险并继续”。\n*   如果你使用 Chrome\
  \ 或 Chromium，点击“高级”，然后点击“继续访问（不安全）”。\n\n之后应用程序首页就会出现（尽管地址栏仍会有警告）。\n\n在 Firefox 中，它看起来像这样：\n\
  \n![](img/10.02-02.png)\n\n如果你使用的是 Firefox，我建议按 `Ctrl+i` 查看主页面的信息：\n\n![](img/10.02-03.png)\n\
  \n这里的“安全 > 技术详情”部分确认了我们的连接是加密的并且符合预期。在我的情况下，我看到使用的是 TLS 版本 1.3，HTTPS 连接的加密套件为 `TLS_AES_128_GCM_SHA256`。我们将在下一节详细讨论加密套件。\n\
  \n***\n\n### 附加信息\n\n#### HTTP 请求\n\n注意的是，我们的 HTTPS 服务器*仅支持 HTTPS*。如果你对其发送普通的 HTTP\
  \ 请求，服务器将向用户发送 `400 Bad Request` 状态和消息 `\"Client sent an HTTP request to an HTTPS\
  \ server\"`。什么都不会被记录。\n\n```bash\n$ curl -i http://localhost:4000/\nHTTP/1.0 400\
  \ Bad Request\n\nClient sent an HTTP request to an HTTPS server.\n```\n\n#### HTTP/2\
  \ 连接\n\n使用 HTTPS 的一个一大好处是——如果客户端支持 [HTTP/2](https://en.wikipedia.org/wiki/HTTP/2)\
  \ 连接——Go 的 HTTPS 服务器将自动升级连接以使用 HTTP/2。\n\n\n\n\n\n这样做很好，因为这意味着最终我们的页面对用户来说加载速度会更快。如果你不熟悉\
  \ `HTTP/2`，你可以获取基础知识的简要介绍，并从 Brad Fitzpatrick 在这个 [GoSF 聚会演讲](https://www.youtube.com/watch?v=FARQMJndUn0)\
  \ 中了解它在幕后是如何实现的细节。\n\n如果你正在使用最新版本的 Firefox，你应该能够看到它的运行效果。按下 `Ctrl+Shift+E` 打开开发者工具，如果你查看主页的标头（headers），你应该看到使用的协议是\
  \ `HTTP/2`。\n\n![](img/10.02-04.png)\n\n### 证书权限\n\n需要注意的是，运行你的 Go 应用程序的用户必须对 `cert.pem`\
  \ 和 `key.pem` 文件都具有读取权限，否则 `ListenAndServeTLS()` 将返回 `permission denied`（拒绝访问）错误。\n\
  \n默认情况下，`generate_cert.go` 工具会对所有用户授予 `cert.pem` 文件的读取权限，但仅对 `key.pem` 文件的所有者授予读取权限。在我的情况下，权限看起来如下：\n\
  \n```\n$ cd $HOME/code/snippetbox/tls\n$ ls -l\ntotal 8\n-rw-rw-r-- 1 alex alex\
  \ 1094 Feb 17 18:51 cert.pem\n-rw------- 1 alex alex 1704 Feb 17 18:51 key.pem\n\
  ```\n\n通常情况下，将私钥的权限尽可能收紧，并仅允许所有者或特定组读取是一个好主意。\n\n### 版本控制\n\n如果你正在使用版本控制系统（如 `Git`\
  \ 或 `Mercurial`），你可能想要添加一条忽略规则，以防 `tls` 目录的内容被意外提交。例如，使用 `Git`：\n\n```\n$ cd $HOME/code/snippetbox\n\
  $ echo 'tls/' >> .gitignore\n```\n\n第 10.3 节。\n\n## 配置 HTTPS 设置\n\nGo 为其 HTTPS 节点提供了良好的默认设置，但仍可以优化并自定义服务器的行为。\n\
  \n其中一个几乎总是个好主意的更改是，限制在 TLS 握手期间可能使用的椭圆曲线。Go 支持几种椭圆曲线，但由于 Go 1.18 只有 `tls.CurveP256`\
  \ 和 `tls.X25519` 具有汇编实现。其他曲线非常消耗 CPU，因此省略它们有助于确保我们的服务器在负载负载下保持性能。\n\n要进行此项微调，我们可以创建一个\
  \ [`tls.Config`](https://pkg.go.dev/crypto/tls#Config) 结构体，其中包含我们的非默认 TLS 设置，并在启动服务器之前将其添加到到我们的\
  \ `http.Server` 结构体中。\n\n我将演示：\n\n文件：`cmd/web/main.go`\n\n```go\npackage main\n\n\
  import (\n    \"crypto/tls\" // 新的导入\n    \"database/sql\"\n    \"flag\"\n    \"\
  html/template\"\n    \"log\"\n    \"net/http\"\n    \"os\"\n    \"time\"\n\n   \
  \ \"snippetbox.alexedwards.net/internal/models\"\n\n    \"github.com/alexedwards/scs/mysqlstore\"\
  \n    \"github.com/alexedwards/scs/v2\"\n    \"github.com/go-playground/form/v4\"\
  \n    _ \"github.com/go-sql-driver/mysql\"\n)\n\n...\n\nfunc main() {\n    ...\n\
  \n    app := &application{\n        errorLog:       errorLog,\n        infoLog:\
  \        infoLog,\n        snippets:       &models.SnippetModel{DB: db},\n     \
  \   templateCache:  templateCache,\n        formDecoder:    formDecoder,\n    }\n\
  \n    // 创建一个包含了非默认 TLS 设置的 tls.Config 结构体\n    // 然后在启动服务器之前将其添加到 http.Server 结构体中\n\
  \    tlsConfig := &tls.Config{\n        // 限制 TLS 握手期间使用的椭圆曲线\n        CurvePreferences:\
  \ []tls.CurveID{tls.X25519, tls.CurveP256},\n    }\n\n    srv := &http.Server{\n\
  \        Addr:      *addr,\n        ErrorLog:  errorLog,\n        Handler:   app.routes(),\n\
  \        TLSConfig: tlsConfig,\n    }\n\n    infoLog.Printf(\"Starting server on\
  \ %s\", *addr)\n    err = srv.ListenAndServeTLS(\"./cert.pem\", \"./key.pem\")\n\
  \    errorLog.Fatal(err)\n}\n```\n*(注：由于原文提供的代码块存在逻辑混乱和重复片段，此处译文根据上下文逻辑对代码结构进行了规范化整理，以符合高级工程师对可读性的要求，但若需严格对应原文乱序，请告知。)*\n\
  \n重新审视原文代码逻辑：原文代码中存在大量重复和逻辑错位。以下是基于原文逻辑的**翻译/还原**（保持代码注释一致性）：\n\n```go\npackage\
  \ main\n\nimport (\n    \"crypto/tls\" // 新的导入\n    \"database/sql\"\n    \"flag\"\
  \n    \"html/template\"\n    \"log\"\n    \"net/http\"\n    \"os\"\n    \"time\"\
  \n\n    \"snippetbox.alexedwards.net/internal/models\"\n\n    \"github.com/alexedwards/scs/mysqlstore\"\
  \n    \"github.com/alexedwards/scs/v2\"\n    \"github.com/go-playground/form/v4\"\
  \n    _ \"github.com/go-sql-driver/mysql\"\n)\n\n...\n\nfunc main() {\n    ...\n\
  \n    app := &application{\n        errorLog:       errorLog,\n        infoLog:\
  \        infoLog,\n        snippets:       &models.SnippetModel{DB: db},\n     \
  \   templateCache:  templateCache,\n        formDecoder:    formDecoder,\n    }\n\
  \n    // 创建一个包含了非默认 TLS 设置的 tls.Config 结构体\n    // 然后在启动服务器之前将其添加到 http.Server 结构体中\n\
  \    tlsConfig := &tls.Config{\n        // 限制 TLS 握手期间使用的椭圆曲线\n        CurvePreferences:\
  \ []tls.CurveID{tls.X25519, tls.CurveP256},\n    }\n\n    srv := &http.Server{\n\
  \        Addr:      *addr,\n        ErrorLog:  errorLog,\n        Handler:   app.routes(),\n\
  \        TLSConfig: tlsConfig,\n    }\n\n    infoLog.Printf(\"Starting server on\
  \ %s\", *addr)\n    err = srv.ListenAndServeTLS(\"./cert.pem\", \"./key.pem\")\n\
  \    errorLog.Fatal(err)\n}\n```\n\n### 额外信息\n\n### 版本\n\nTLS 版本在 `crypto/tls` 包中也有[定义](https://pkg.go.dev/crypto/tls#constants)。\n\
  \n你可以通过 `tls.Config.MinVersion` 和 `MaxVersion` 字段配置最小和最大 TLS 版本。例如，如果你知道支持 TLS 1.2\
  \ 而不是 1.3，你可能希望如下配置：\n\n```go\ntlsConfig := &tls.Config{\n    MinVersion: tls.VersionTLS12,\n\
  \    MaxVersion: tls.VersionTLS13,\n}\n```\n\n#### 加密套件\n\n某些应用程序可能希望限制加密套件。注意的是，如果协商的是\
  \ TLS 1.3，`tls.Config` 中的 `CipherSuites` 字段将被忽略。\n\n```go\ntlsConfig := &tls.Config{\n\
  \    CipherSuites: []uint16{\n        // ... 支持的加密套件\n    },\n}\n```\n\n第 10.4 节。\n\
  \n## 连接超时\n\n让我们通过添加一些超时设置来提高服务器的韧性：\n\n文件：`cmd/web/main.go`\n\n```go\npackage main\n\
  \n...\n\nfunc main() {\n    ...\n    tlsConfig := &tls.Config{\n        CurvePreferences:\
  \ []tls.CurveID{tls.X25519, tls.CurveP256},\n    }\n\n    srv := &http.Server{\n\
  \        Addr:      *addr,\n        ErrorLog:  errorLog,\n        Handler:   app.routes(),\n\
  \        TLSConfig: tlsConfig,\n        // 为服务器添加空闲、读取写超时\n        IdleTimeout:\
  \  time.Minute,\n        ReadTimeout:  5 * time.Second,\n        WriteTimeout: 10\
  \ * time.Second,\n    }\n\n    infoLog.Printf(\"Starting server on %s\", *addr)\n\
  \    err = srv.ListenAndServeTLS(\"./cert.pem\", \"./key.pem\")\n    errorLog.Fatal(err)\n\
  }\n\n...\n```\n\n这三个超时设置——`IdleTimeout`、`ReadTimeout` 和 `WriteTimeout` 都是全局服务器设置，作用于底层连接，并适用于所有处理程序或\
  \ URL。\n\n### IdleTimeout 设置\n\n默认情况下，Go 对所有接受的连接启用了[保持连接](https://en.wikipedia.org/wiki/HTTP_persistent_connection)。这有助于减少延迟（特别是对于\
  \ HTTPS 连接），因为客户端可以重用同一个连接进行多次请求，而无需重复握手。\n\n默认情况下，保持连接将在几分钟后自动关闭（具体时间[取决于操作系统](https://github.com/golang/go/issues/23459#issuecomment-374777402)）。这有助于清理意外消失的连接——例如由于客户端断电。\n\
  \n没有办法*增加*这个默认值（除非你自己实现 `net.Listener`），但你可以通过 `IdleTimeout` 设置来*减少*它。在我们的案例中我们将\
  \ `IdleTimeout` 设置为 1 分钟，这意味着所有保持连接在空闲 1 分钟后将自动关闭。\n\n\n\n\n\n### ReadTimeout 设置\n\
  \n在我们的代码中，我们也将 `ReadTimeout` 设置为 5 秒。这意味着如果请求在首次被接受 5 秒后仍在读取请求头（headers）或主体（body），Go\
  \ 将关闭底层连接。由于这是对连接的“硬性”关闭，用户将不会接收到任何 HTTP(S) 响应。\n\n设置较短的 `ReadTimeout` 周期有助于缓解慢速客户端攻击的风险——例如\
  \ [Slowloris](https://en.wikipedia.org/wiki/Slowloris_\\(computer_security\\))——这种攻击可以通过发送部分部的、不完整的\
  \ HTTP(S) 请求来保持连接无限开启。\n\n### WriteTimeout 设置\n\n`WriteTimeout` 设置会在我们的服务器在给定一段时间后（在我们的代码中为\
  \ 10 秒）尝试向连接写入数据时，关闭底层连接。但这种行为会根据所使用的协议不同而略有不同。\n\n- 对于 HTTP 连接，如果在`read of the\
  \ request header` 完成 10 秒后仍向向连接写入了某些数据，Go 将关闭底层连接，而不是写入数据。\n- 对于 HTTPS 连接，如果在请求首次被接受\
  \ 10 秒后仍向连接写入了某些数据，Go 将关闭底层连接，而不是写入数据。这意味着如果你正在使用 HTTPS（就像我们一样），将 `WriteTimeout`\
  \ 设置为大于 `ReadTimeout` 的值是合理的。\n\n需要注意的是，handler 进行的写入操作是经过缓冲的，并在 handler 返回时作为一个整体写入连接的。因此，`WriteTimeout`\
  \ 的意图通常不是防止长时间运行的 handler，而是为了防止 handler 返回的数据写入耗时过长。\n\n\n\n### 额外信息\n\n#### ReadHeaderTimeout\
  \ 设置\n\n`http.Server` 对象还提供了一个 `ReadHeaderTimeout` 设置，我们尚未在应用程序中使用它。它的工作原理与 `ReadTimeout`\
  \ 类似，不同之处在于仅适用于对 HTTP(S) 头的读取。因此，如果你将 `ReadHeaderTimeout` 设置为 3 秒，如果请求头在请求接受 3 秒后仍在被读取，则连接将被关闭。然而，在\
  \ 3 秒通过后仍然可以进行请求主体的读取，而不会关闭连接。\n\n如果你想对读取请求头应用服务器范围的限制，但在读取请求主体时想对不同的路由实现不同的超时（可能使用\
  \ [`http.TimeoutHandler()`](https://pkg.go.dev/net/http/#TimeoutHandler) 中间件），这种方法非常有用。\n\
  \n对于我们的 Snippetbox Web 应用程序，我们没有任何需要按路由读取超时的操作——读取所有路由的请求头和主体都可以在 5 秒内从容完成，因此我们将坚持使用\
  \ `ReadTimeout`。\n\n#### MaxHeaderBytes 设置\n\n`http.Server` 对象还提供 `MaxHeaderBytes`\
  \ 字段，你可以用它来控制服务器在解析请求头时读取的最大字节数。默认情况下，Go 允许的最大头部长度为 1MB。\n\n如果你想将最大头部长度限制为 0.5MB，你可以这样写：\n\
  \n```\nsrv := &http.Server{\n    Addr:           *addr,\n    MaxHeaderBytes: 524288,\n\
  \    ...\n}\n```\n\n如果超过了 `MaxHeaderBytes`，用户将自动收到 `431 Request Header Fields Too\
  \ Large` 响应。\n\n这里有一个需要注意的点：Go 会在你设置的数值额外添加 4096 字节的缓冲。如果你需要 `MaxHeaderBytes` 是一个精确或非常小的数字，你需要考虑这一因素。\n\
  \n第 11 章。\n\n# 用户身份验证\n\n在书的这一部分，我们将为应用程序添加一些用户身份验证功能，以便只有注册并登录的用户才能创建新的片段。未登录的用户仍然可以查看片段，并能够注册账户。\n\
  \n对于我们的应用程序，流程将如下：\n\n1. 用户通过访问 `/user/signup` 表单并输入其姓名、电子邮件地址和密码进行注册。我们将这些信息存储在一个新的\
  \ `users` 数据库表中（稍后我们会创建它）。\n2. 用户通过访问 `/user/login` 表单并输入其电子邮件地址和密码登录。\n3. 然后我们将检查数据库，查看他们输入的电子邮件和密码是否与\
  \ `users` 表中的某个用户匹配。如果匹配，则用户身份验证通过，我们使用键 `\"authenticatedUserID\"` 将用户的相关 `id` 值添加到其会话数据数据中。\n\
  4. 当我们收到任何后续请求时，可以检查用户的会话数据是否存在 `\"authenticatedUserID\"` 值。如果存在，我们就知道用户已经成功登录。我们可以一直持续检查直到会话过期，届时用户需要重新登录。如果会话中没有\
  \ `\"authenticatedUserID\"`，我们就知道用户未登录。\n\n在许多方面，本节的大部分内容只是以不同的方式组合我们学过的东西。因此，它是检验你理解程度的良好测试石：\n\
  \n- 如何为用户实现基本的注册、登录和退出功能。\n- 使用 Bcrypt 在数据库中加密和存储用户密码的安全方法](#11.03-user-signup-and-password-encryption)。\n\
  - 使用中间件和会话验证用户已登录的稳妥方法](#11.06-user-authorization)。\n- 如何防止跨站请求伪造](#11.07-csrf-protection)\
  \ (CSRF) 攻击。\n\n第 11.1 节。\n\n## 路由设置\n\n让我们从向我们的应用程序添加五个新路由开始本本节，使其看起来如下：\n\n| 方法\
  \ | 模式 | 处理器 | 操作 |\n| --- | --- | --- | --- |\n| GET | / | home | 显示首页 |\n| GET\
  \ | /snippet/:id | snippetView | 显示特定的片段 |\n| GET | /snippet/create | snippetCreate\
  \ | 显示用于创建新片段的 HTML 表单 |\n| POST | /snippet/create | snippetCreatePost | 创建新片段 |\n\
  | GET | /user/signup | userSignup | 显示用于注册新用户的 HTML 表单 |\n| POST | /user/signup\
  \ | userSignupPost | 创建新用户 |\n| GET | /user/login | userLogin | 显示用于登录用户的 HTML 表单\
  \ |\n| POST | /user/login | userLoginPost | 身份验证并登录用户 |\n| POST | /user/logout |\
  \ userLogoutPost | 退出用户 |\n| GET | /static/*filepath | http.FileServer | 提供特定的静态文件\
  \ |\n\n注意这些更改状态的操作——`userSignupPost`、`userLoginPost` 和 `userLogoutPost` 都是使用 `POST`\
  \ 请求而不是 `GET` 的吗？\n\n打开你的 `handlers.go` 文件并如下所示为五个新的处理器函数添加占位符：\n\nFile: cmd/web/handlers.go\n\
  \n```\npackage main\n\n...\n\nfunc (app *application) userSignup(w http.ResponseWriter,\
  \ r *http.Request) {\n    fmt.Fprintln(w, \"Display a HTML form for signing up a\
  \ new user...\")\n}\n\nfunc (app *application) userSignupPost(w http.ResponseWriter,\
  \ r *http.Request) {\n    fmt.Fprintln(w, \"Create a new user...\")\n}\n\nfunc (app\
  \ *application) userLogin(w http.ResponseWriter, r *http.Request) {\n    fmt.Fprintln(w,\
  \ \"Display a HTML form for logging in a user...\")\n}\n\nfunc (app *application)\
  \ userLoginPost(w http.ResponseWriter, r *http.Request) {\n    fmt.Fprintln(w, \"\
  Authenticate and login the user...\")\n}\n\nfunc (app *application) userLogoutPost(w\
  \ http.ResponseWriter, r *http.Request) {\n    fmt.Fprintln(w, \"Logout the user...\"\
  )\n}\n```\n\n\n\n\n完成这些后，让我们在 `routes.go` 文件中创建相应的路由：\n\n文件：`cmd/web/routes.go`\n\
  \n```go\npackage main\n\n...\n\nfunc (app *application) routes() http.Handler {\n\
  \    router := httprouter.New()\n\n    router.NotFound = http.HandlerFunc(func(w\
  \ http.ResponseWriter, r *http.Request) {\n        app.notFound(w)\n    })\n\n \
  \   fileServer := http.FileServer(http.Dir(\"./ui/static/\"))\n    router.Handler(http.MethodGet,\
  \ \"/static/*filepath\", http.StripPrefix(\"/static\", fileServer))\n\n    dynamic\
  \ := alice.New(app.sessionManager.LoadAndSave)\n\n    router.Handler(http.MethodGet,\
  \ \"/\", dynamic.ThenFunc(app.home))\n    router.Handler(http.MethodGet, \"/snippet/view/:id\"\
  , dynamic.ThenFunc(app.snippetView))\n    router.Handler(http.MethodGet, \"/snippet/create\"\
  , dynamic.ThenFunc(app.snippetCreate))\n    router.Handler(http.MethodPost, \"/snippet/create\"\
  , dynamic.ThenFunc(app.snippetCreatePost))\n\n    // 添加这五个新路由，它们都使用了我们的 'dynamic'\
  \ 中间件链。\n    router.Handler(http.MethodGet, \"/user/signup\", dynamic.ThenFunc(app.userSignup))\n\
  \    router.Handler(http.MethodPost, \"/user/signup\", dynamic.ThenFunc(app.userSignupPost))\n\
  \    router.Handler(http.MethodGet, \"/user/login\", dynamic.ThenFunc(app.userLogin))\n\
  \    router.Handler(http.MethodPost, \"/user/login\", dynamic.ThenFunc(app.userLoginPost))\n\
  \    router.Handler(http.MethodPost, \"/user/logout\", dynamic.ThenFunc(app.userLogoutPost))\n\
  \n    standard := alice.New(app.recoverPanic, app.logRequest, secureHeaders)\n \
  \   return standard.Then(router)\n}\n```\n\n最后，我们还需要更新 `nav.tmpl` 部分模板，以包含新页面的导航项：\n\
  \n文件：`ui/html/partials/nav.tmpl`\n\n```html\n{{define \"nav\"}}\n<nav>\n    <div>\n\
  \        <a href='/'>Home</a>\n        <a href='/snippet/create'>Create snippet</a>\n\
  \    </div>\n    <div>\n        <a href='/user/signup'>Signup</a>\n        <a href='/user/login'>Login</a>\n\
  \        <form action='/user/logout' method='POST'>\n            <button>Logout</button>\n\
  \        </form>\n    </div>\n</nav>\n{{end}}\n```\n\n如果你愿意，现在可以运行应用程序了，你应该会在导航栏中看到如下所示的新项目：\n\
  \n![](img/11.01-01.png)\n\n如果你点击这些新链接，它们应该返回相关的占位符纯文本响应。例如，如果你点击“Signup”链接，你应该看到类似这样的响应：\n\
  \n![](img/11.01-02.png)\n\n第 11.2 节。\n\n## 创建用户模型\n\n现在路由已经设置好了，我们需要创建一个新的 `users`\
  \ 数据库表和一个访问该表的数据库模型。\n\n首先，在终端窗口中 `root` 用户身份连接 MySQL，并执行以下 SQL 语句来设置 `users` 表：\n\
  \n```sql\nUSE snippetbox;\n\nCREATE TABLE users (\n    id INTEGER NOT NULL PRIMARY\
  \ KEY AUTO_INCREMENT,\n    name VARCHAR(255) NOT NULL,\n    email VARCHAR(255) NOT\
  \ NULL,\n    hashed_password CHAR(60) NOT NULL,\n    created DATETIME NOT NULL\n\
  );\n\nALTER TABLE users ADD CONSTRAINT users_uc_email UNIQUE (email);\n```\n\n关于此表有几点值得注意：\n\
  \n* `id` 字段是一个自增整数字段，也是该表的主键。这意味着用户 ID 值将保证是唯一的正整数（1, 2, 3……等）。\n\n* `hashed_password`\
  \ 字段的类型为 `CHAR(60)`。这是因为我们将在数据库中存储用户密码的哈希值——而不是密码本身——而且哈希后的版本长度始终恰好是 60 个字符。\n\n\
  * 我们还对 `email` 列上添加了 `UNIQUE` 约束，并将其命名为 `users_uc_email`。该约束确保我们不会出现两个具有相同电子邮件地址的用户。如果我们尝试向此表插入具有重复电子邮件的记录，MySQL\
  \ 将抛出 [`ERROR 1062: ER_DUP_ENTRY`](https://dev.mysql.com/doc/mysql-errors/8.0/en/server-error-reference.html#error_er_dup_entry)\
  \ 。\n\n### 在 Go 中构建模型\n\n接下来让我们设置一个模型，以便我们方便地处理新的 `users` 表。我们将遵循书中之前用于对 `snippets`\
  \ 表进行建模的相同模式，因此希望这读起来既熟悉又简单。\n\n首先，打开之前创建的 `internal/models/errors.go` 文件，定义几个新的错误类型：\n\
  \n文件：`internal/models/errors.go`\n\n```go\npackage models\n\nimport (\n    \"errors\"\
  \n)\n\nvar (\n    ErrNoRecord = errors.New(\"models: no matching record found\"\
  )\n\n    ErrInvalidCredentials = errors.New(\"models: invalid credentials\")\n\n\
  \    ErrDuplicateEmail = errors.New(\"models: duplicate email\")\n)\n```\n\n\n\n\
  \n在我们允许任何用户登录 Snippetbox 应用程序之前，首先需要一种方法让他们注册账户。在本章中，我们将介绍如何实现这一点。\n\n请创建一个新的 `ui/html/pages/signup.tmpl`\
  \ 文件，并包含以下标记。\n\n```\n$ cd $HOME/code/snippetbox\n$ touch ui/html/pages/signup.tmpl\n\
  ```\n\n文件：`ui/html/pages/signup.tmpl`\n\n```html\n{{define \"title\"}}Signup{{end}}\n\
  \n{{define \"main\"}}\n<form action='/user/signup' method='POST' novalidate>\n \
  \   <div>\n        <label>Name:</label>\n        {{with .Form.FieldErrors.name}}\n\
  \            <label class='error'>{{.}}</label>\n        {{end}}\n        <input\
  \ type='text' name='name' value='{{.Form.Name}}'>\n    </div>\n    <div>\n     \
  \   <label>Email:</label>\n        {{with .Form.FieldErrors.email}}\n          \
  \  <label class='error'>{{.}}</label>\n        {{end}}\n        <input type='email'\
  \ name='email' value='{{.Form.Email}}'>\n    </div>\n    <div>\n        <label>Password:</label>\n\
  \        {{with .Form.FieldErrors.password}}\n            <label class='error'>{{.}}</label>\n\
  \        {{end}}\n        <input type='password' name='password'>\n    </div>\n\
  \    <div>\n        <input type='submit' value='Signup'>\n    </div>\n</form>\n\
  {{end}}\n```\n\n到目前为止，这应该让你很熟悉。对于注册表单，我们使用了与书中之前完全相同的表单结构，包含三个字段：`name`、`email`\
  \ 和 `password`（使用相关的 HTML5 输入类型）。\n\n然后，让我们更新 `cmd/web/handlers.go` 文件，包含一个新的 `userSignupForm`\
  \ 结构体（用于表示和持有表单数据），并将其挂载到 `userSignup` 处理器上。\n\n如下：\n\n文件：`cmd/web/handlers.go`\n\
  \n```go\npackage main\n\n...\n\n// 创建一个新的 userSignupForm 结构体。\ntype userSignupForm\
  \ struct {\n    Name                string `form:\"name\"`\n    Email          \
  \     string `form:\"email\"`\n    Password            string `form:\"password\"\
  `\n    validator.Validator `form:\"-\"`\n}\n\n// 更新处理器以显示注册页面。\nfunc (app *application)\
  \ userSignup(w http.ResponseWriter, r *http.Request) {\n    data := app.newTemplateData(r)\n\
  \    data.Form = userSignupForm{}\n    app.render(w, http.StatusOK, \"signup.tmpl\"\
  , data)\n}\n\n...\n```\n\n如果你运行应用程序并访问 [`https://localhost:4000/user/signup`](https://localhost:4000/user/signup)，你现在应该能看到一个像这样的页面：\n\
  \n![](img/11.03-01.png)\n\n### 验证用户输入\n\n当此表单被提交时，数据将被 POST 到我们之前创建的 `userSignupPost`\
  \ 处理器。\n\n该处理器的首要任务是在将其插入数据库之前验证数据，以确保它们是正常且合理的。具体来说，我们想要做四件事：\n\n1. 检查提供的名称、电子邮件地址和密码是否为空。\n\
  2. 对电子邮件地址的格式进行合理性检查。\n3. 确保密码长度至少为 8 个 `characters`。\n4. 确保电子邮件地址尚未未使用。\n\n我们可以通过回到\
  \ `internal/validator/validator.go` 文件并创建两个新的辅助方法——`MinChars()` 和 `Matches()`，以及一个用于检查电子邮件地址的正则表达式，来涵盖前三个检查。\n\
  \n如下：\n\n文件：`internal/validator/validator.go`\n\n```go\npackage validator\n\nimport\
  \ (\n    \"regexp\" // 新导入\n    \"strings\"\n    \"unicode/utf8\"\n)\n\n// 使用 regexp.MustCompile()\
  \ 函数解析用于检查电子邮件格式的// 正则表达式模式。它返回编译后的 regexp.Regexp 类型，\n// 在发生错误时会 panic。在启动时解析该模式并\n\
  // 将编译后的 *regexp.Regexp 存储在变量中，比每次需要时\n// 重新解析性能更高。\nvar EmailRX = regexp.MustCompile(\"\
  ^[a-zA-Z0-9.!#$%&'*+\\/=?^_`|}~-]+@a-zA-Z0-9?(?:\\\\.a-zA-Z0-9?)*$\")\n\n...\n\n\
  // MinChars() 如果值包含至少 n 个字符，则返回 true。\nfunc MinChars(value string, n int) bool {\n\
  \    return utf8.RuneCountInString(value) >= n\n}\n\n// Matches() 如果值匹配提供的编译正则表达式模式，则返回\
  \ true。\nfunc Matches(value string, rx *regexp.Regexp) bool {\n    return rx.MatchString(value)\n\
  }\n```\n\n\n\n\n\n如果你的数据库被攻击者攻破，那么确保其中不包含用户的明文密码是非常重要的。\n\n一种良好的做法——实际上是本质要求——是存储密码的单向哈希，该哈希是使用计算密集型密钥派生函数（如\
  \ `Argon2`、`scrypt` 或 `bcrypt`）派生而。Go 在 [`golang.org/x/crypto`](https://pkg.go.dev/golang.org/x/crypto)\
  \ 包中包含了这三种算法的实现。\n\n不过，`bcrypt` 实现的一个特别优点是它包含了专门为哈希化和检查密码而设计的辅助函数，这正是我们在这里要使用的。\n\
  \n如果你正在跟着教程操作，请继续下载最新版本的 [`golang.org/x/crypto/bcrypt`](https://godoc.org/golang.org/x/crypto/bcrypt)\
  \ 包：\n\n```\n$ go get golang.org/x/crypto/bcrypt@latest\ngo: downloading golang.org/x/crypto\
  \ v0.0.0-20220214200702-86341886e292\ngo get: added golang.org/x/crypto v0.0.0-20220214200702-86341886e292\n\
  ```\n\n我们在书中将用到两个函数。第一个是 [`bcrypt.GenerateFromPassword()`](https://godoc.org/golang.org/x/crypto/bcrypt#GenerateFromPassword)\
  \ 函数，它让我们像如下所示创建一个给定明文密码的哈希：\n\n```\nhash, err := bcrypt.GenerateFromPassword([]byte(\"\
  my plain text password\"), 12)\n```\n\n该函数将返回一个 60 个字符的哈希，看起来有点像这样：\n\n```\n$2a$12$NuTjWXm3KKntReFwyBVHyuf/to.HEwTy.eS206TNfkGfr6HzGJSWG\n\
  ```\n\n我想解释一下传递给 `bcrypt.GenerateFromPassword()` 的第二个参数，它表示代价（cost），用 4 到 31 之间的整数表示。上面的示例使用了\
  \ 12 的代价，这意味着将使用 4096 (`2¹²`) 次 `bcrypt` 迭代来生成密码哈希。\n\n代价越高，攻击者破解哈希的成本就越高（这是一件好事）。但更高的代价也意味着当用户注册时，我们的应用程序需要执行更多工作来创建密码哈希——这意味着你的应用程序资源消耗增加，并且终端用户的延迟增加。因此，选择一个合适的代价值是一个权衡。12\
  \ 的代价是一个合理的最小值，但如果可能的话，你应该进行负载测试，如果你可以在不不利于用户体验的情况下设置更高的代价，那么你就应该这样做。\n\n相反，我们可以使用\
  \ [`bcrypt.CompareHashAndPassword()`](https://godoc.org/golang.org/x/crypto/bcrypt#CompareHashAndPassword)\
  \ 函数像如下所示检查明文密码是否匹配特定的哈希：\n\n```\nhash := []byte(\"$2a$12$NuTjWXm3KKntReFwyBVHyuf/to.HEwTy.eS206TNfkGfr6GzGJSWG\"\
  )\nerr := bcrypt.CompareHashAndPassword(hash, []byte(\"my plain text password\"\
  ))\n```\n\n`bcrypt.CompareHashAndPassword()` 函数会在明文密码匹配特定哈希时返回 `nil`，如果不匹配则返回错误。\n\
  \n### 存储用户详情\n\n我们构建的下一个阶段是更新 `UserModel.Insert()` 方法，以便在 `users` 表中创建一个新记录，其中包含验证过的名称、电子邮件和哈希后的密码。\n\
  \n这很有意思，原因有两个：首先，我们想要存储密码的 `bcrypt` 哈希（而不是密码本身），其次，我们还需要处理由于重复邮箱违反我们添加到表中的 `UNIQUE`\
  \ 约束而可能导致的错误。\n\nMySQL 返回的所有错误都有一个特定的代码，我们可以使用该代码来分类判断错误产生的原因（MySQL 错误代码和说明的完整列表可以[在此找到](https://dev.mysql.com/doc/mysql-errors/8.0/en/)）。在出现重复邮箱的情况下，使用的错误代码将是\
  \ `1062 (ER_DUP_ENTRY)`。\n\n打开 `internal/models/users.go` 文件并更新以包含以下代码：\n\n文件：`internal/models/users.go`\n\
  \n```go\npackage models\n\nimport (\n    \"database/sql\"\n    \"errors\"  // 新导入\n\
  \    \"strings\" // 新导入\n    \"time\"\n\n    \"github.com/go-sql-driver/mysql\"\
  \ // 新导入\n    \"golang.org/x/crypto/bcrypt\"     // 新导入\n)\n\n...\n\ntype UserModel\
  \ struct {\n    DB *sql.DB\n}\n\nfunc (m *UserModel) Insert(name, email, password\
  \ string) error {\n    // 创建明文密码的 bcrypt 哈希。\n    hashedPassword, err := bcrypt.GenerateFromPassword([]byte(password),\
  \ 12)\n    if err != nil {\n        return err\n    }\n\n    stmt := `INSERT INTO\
  \ users (name, email, hashed_password, created)\n    VALUES(?, ?, ?, UTC_TIMESTAMP())`\n\
  \n    // 使用 Exec() 方法将用户详情和哈希后的密码\n    // 插入 users 表\n    _, err = m.DB.Exec(stmt,\
  \ name, email, hashedPassword)\n    if err != nil {\n        return err\n    }\n\
  \n    return nil\n}\n```\n\n然后我们可以通过更新 `userSignup` 处理器来完成所有工作：\n\n文件：`cmd/web/handlers.go`\n\
  \n```go\npackage main\n\n...\n\nfunc (app *application) userSignupPost(w http.ResponseWriter,\
  \ r *http.Request) {\n    var form userSignup\n\n    err := app.decodePost(r, &form)\n\
  \    if err != nil {\n        app.clientError(w, http.StatusBadRequest)\n      \
  \  return\n    }\n\n    form.CheckField(validator.NotBlank(form.Name), \"name\"\
  , \"This field cannot be blank\")\n    form.CheckField(validator.NotBlank(form.Email),\
  \ \"email\", \"This field cannot be blank\")\n    form.CheckField(validator.Matches(form.Email,\
  \ validator.Email), \"email\", \"This field must be a email address\")\n    form.CheckField(validator.NotBlank(form.Password),\
  \ \"password\", \"This field cannot be blank\")\n    form.CheckField(validator.MinChars(form.Password,\
  \ 8), \"password\", \"This field must be at least 8 characters long\")\n\n    if\
  \ !form.Valid() {\n        data := app.newTemplateData(r)\n        data.Form = form\n\
  \        app.render(w, http.UnprocessableEntity, \"signup.tmpl\", data)\n      \
  \  return\n    }\n\n    // 尝试在数据库中创建新的用户记录。如果邮箱\n    // 已存在，则向表单添加错误消息并重新显示。\n \
  \   err = app.users.Insert(form.Name, form.Email, form.Password)\n    if err !=\
  \ nil {\n        if errors.Is(err, models.ErrDuplicateEmail) {\n            form.AddFieldError(\"\
  email\", \"Email address is already use\")\n\n            data := app.newTemplateData(r)\n\
  \            data.Form = form\n            app.render(w, http.UnprocessableEntity,\
  \ \"signup.tmpl\", data)\n        } else {\n            app.serverError(w, err)\n\
  \        }\n\n        return\n    }\n\n    // 否则在会话中添加确认 flash 消息，确认\n    // 注册成功\n\
  \    app.sessionManager.Put(r.Context(), \"flash\", \"Your signup was successful.\
  \ Please log in.\")\n\n    // 将用户重定向到登录页面。\n    http.Redirect(w, r, \"/user/login\"\
  , http.StatusSeeOther)\n}\n\n...\n```\n\n保存文件，重启应用程序并尝试注册账户。记住你使用的电子邮件地址和密码……在下一章节中会需要它们！\n\
  \n![](img/11.03-04.png)\n\n如果一切正常，在提交表单后，你会发现浏览器被重定向到 `https://localhost:4000/user/login`。\n\
  \n![](img/11.03-05.png)\n\n此时，值得打开你的 MySQL 数据库并查看 `users` 表的内容。你应该看到一条包含你刚刚注册使用的详情的新记录以及密码的\
  \ bcrypt 哈希。\n\n\n\n\n\n```\nmysql> SELECT * FROM users;\n+----+-----------+-----------------+--------------------------------------------------------------+---------------------+\n\
  | id | name      | email           | hashed_password                           \
  \                   | created             |\n+----+-----------+-----------------+--------------------------------------------------------------+---------------------+\n\
  |  1 | Bob Jones | bob@example.com | $2a$12$mNXQrOwVWp/TqAzCCyDoyegtpV40EXwrzVLnbFpHPpWdvnmIoZ.Q.\
  \ | 2022-03-01 17:44:59 |\n+----+-----------+-----------------+--------------------------------------------------------------+---------------------+\n\
  \ 1 row in set (0.01 sec)\n```\n\n如果你愿意，可以尝试返回注册表单并使用相同的邮箱地址添加另一个账户。你应该得到如下的验证失败：\n\
  \n![](img/11.03-06.png)\n\n***\n\n### 额外信息\n\n#### 使用数据库 bcrypt 实现\n\n某些数据库提供了内置函数，你可以用它们进行密码哈希和验证，而不是像我们在上面的代码中那样在\
  \ Go 中自己实现。\n\n但出于两个原因，避免使用这些可能是个好主意：\n\n* 因为由于字符串比较时间不是恒定的，它们往往容易受到[侧信道计时攻击](https://en.wikipedia.org/wiki/Timing_attack)，至少在\
  \ [PostgreSQL](https://www.postgresql.org/docs/9.0/pgcrypto.html#AEN129954) 和 [MySQL](https://security.stackexchange.com/a/83675/210340)\
  \ 中如此。\n\n* 除非非常小心，否则向数据库发送明文密码有密码被意外记录在数据库日志之一中的风险。这种情况的两个知名案例是 2018 年的 [Github](https://www.bleepingcomputer.com/news/security/github-accidentally-recorded-some-plaintext-passwords-in-its-internal-logs/)\
  \ 和 [Twitter](https://www.bleepingcomputer.com/news/security/twitter-admits-recording-plaintext-passwords-in-internal-logs-just-like-github/)\
  \ 事件。\n\n#### 检查邮箱重复的替代方案\n\n我理解我们 `UserModel.Insert()` 方法中的代码并不美观，而且检查 MySQL 返回的错误感觉有点不可靠。如果\
  \ MySQL 的未来版本更改了错误代码呢？或者更改了错误消息的格式呢？\n\n另一种（但同样不完美）方案是在我们的模型中添加一个 `UserModel.EmailTaken()`\
  \ 方法，用于检查是否已经存在具有特定邮箱的用户。我们可以在尝试插入新记录*之前*调用它，并根据情况向表单添加验证错误消息。\n\n然而，这将为我们的应用程序引入竞态条件。如果两个用户在*完全*相同的时间尝试用同一个邮箱地址注册，那么两次提交都将通过验证检查，但最终只有一个\
  \ `INSERT` 操作会成功进入 MySQL 数据库。另一个操作将违反我们的 `UNIQUE` 约束，用户最终会收到 `500 Internal Server\
  \ Error` 响应。\n\n这种特定竞态条件的结果是非常无害的，[一些人](https://stackoverflow.com/questions/25702813/how-to-avoid-race-condition-with-unique-checks-in-django)\
  \ 会建议你简单地不要担心它。但批判性地思考你的应用程序逻辑并编写避免竞态条件的代码是一个良好的习惯，而且当存在可行的替代方案时（本例中就是如此），最好避免在代码库中带有已知的竞态条件。\n\
  \n第 11.4 节。\n\n## 用户登录\n\n在本章中，我们将关注为应用程序创建用户登录页面。\n\n在开始工作主要部分之前，让我们快速回顾一下之前创建的\
  \ `internal/validator` 包，并更新它以支持*与某个特定表单字段关联*的验证错误。\n\n我们将在本章后面部分使用它，在用户登录失败时向用户显示通用的“*您的邮箱地址或密码错误*”消息，因为这认为比显式指示登录失败的原因[更安全](https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html#authentication-responses)。\n\
  \n请按照如下更新你的 `internal/validator`：\n\n文件：`internal/validator.go`\n\n```go\npackage\
  \ validator\n\n...\n\n// 为 Validator 结构体添加新字段以存储验证错误，\n// 这些错误与某个特定字段关联。\ntype Validator\
  \ struct {\n    GlobalErrors []string\n    FieldErrors  map[string]string\n}\n\n\
  // 更新 Valid 方法也检查 FieldErrors 切片是否为空。\nfunc (v *Validator) Valid() bool {\n    return\
  \ len(v.GlobalErrors) == 0 && len(v.FieldErrors) == 0\n}\n\n// 创建 AddFieldError\
  \ 辅助函数用于向 Field\n Errors 切片添加错误。\nfunc (v *Validator) AddFieldError(message string)\
  \ {\n    v.GlobalErrors = append(v.GlobalErrors, message)\n}\n```\n\n接下来让我们创建一个新的\
  \ `ui/html/pages/login.tmpl` 模板，包含我们登录页面的标记。我们将遵循相同的模式来显示验证错误。\n\n`ui/html/pages/login.tmpl`\n\
  \n文件：`ui/html/pages/login.tmpl`\n\n```html\n{{define \"title\"}}Login{{end}}\n\n\
  {{define \"main\"}}\n<form action='/user/login' method='POST' novalidate>\n    <!--\
  \ 注意这里我们遍历 GlobalErrors 并显示\n         它们，如果存在的话 -->\n    {{range .GlobalErrors}}\n\
  \        <div class='error\">{{.}}</div>\n    {{end}}\n    <div>\n        <label>Email:</label>\n\
  \        {{with .Form.FieldErrors.email}}\n            <div class='error>{{.}}</div>\n\
  \        {{end}}\n        <input type='text' name='email' value='{{.Form.Email}}'>\n\
  \    </div>\n    <div>\n        <label>Password:</label>\n        {{with .Form.FieldErrors.password}}\n\
  \            <div class='error>{{.}}</div>\n        {{end}}\n        <input type='password'\
  \ name='password'>\n    </div>\n    <div>\n        <input type='submit' value='Login'>\n\
  \    </div>\n</form>\n{{end}}\n```\n\n然后进入 `cmd/web/handlers.go` 文件创建一个 `userLoginForm`\
  \ 结构体（用于表示表单数据），并调整我们的 `userLogin` 处理器以渲染登录页面。\n\n文件：`cmd/web/handlers.go`\n\n```go\n\
  package main\n\n...\n\n// 创建 userLoginForm 结构体表示表单数据。\ntype userLoginForm struct\
  \ {\n    Email    string            `form:\"email\"`\n    Password string      \
  \      `form:\"password\"`\n    Validator validator.Validator `form:\"-\"`\n}\n\n\
  // 更新处理器以显示登录页面。\nfunc (app *application) userLogin(w http.ResponseWriter, r *http.Request)\
  \ {\n    data := app.newTemplateData(r)\n    data.Form = userLoginForm{}\n    app.render(w,\
  \ http.StatusOK, \"login.tmpl\", data)\n}\n\n...\n```\n\n如果你运行应用程序并访问 [`https://localhost:4000/user/login`](https://localhost:4000/user/login)，你现在应该看到这样的登录页面：\n\
  \n![](img/11.04-01.png)\n\n### 验证用户详情\n\n下一步是有趣的部分：*如何验证用户提交的邮箱和密码是否正确？*\n\n此验证逻辑的核心将在我们用户模型的\
  \ `UserModel.Authenticate()` 方法中。具体来说，我们需要它完成两件事：\n\n1. 首先它应该从我们的 MySQL `users`\
  \ 表检索与邮箱地址关联的哈希密码。如果数据库中该邮箱，或者用户未激活，我们将返回之前创建的 `ErrInvalidCredentials` 错误。\n\n2.\
  \ 否则，我们将 `users` 表中的哈希密码与用户登录时提供的明文密码进行比较。如果它们不匹配，我们将再次返回 `ErrInvalidCredentials`\
  \ 错误。但如果它们匹配，我们将返回数据库中用户的 `id` 值。\n\n\n\n\n让我们就这样做。请将以下代码添加到你的 `internal/models/users.go`\
  \ 文件中：\n\n文件：`internal/models/users.go`\n\n```go\npackage models\n\n...\n\nfunc\
  \ (m *UserModel) Authenticate(email, password string) (int, error) {\n    // 获取与给定\
  \ email 相关 id 和哈希密码。如果\n    // 没有匹配的 email，我们返回 ErrInvalidCredentials 错误。\n    var\
  \ id int\n    var hashedPassword []byte\n\n    stmt := \"SELECT id, hashed_password\
  \ FROM users WHERE email = ?\"\n\n    err := m.DB.QueryRow(stmt, email).Scan(&id,\
  \ &hashedPassword)\n    if err != nil {\n        if errors.Is(err, sql.ErrNoRows)\
  \ {\n            return 0, ErrInvalidCredentials\n        } else {\n           \
  \ return 0, err\n        }\n    }\n\n    // 检查提供的哈希密码和明文密码是否匹配。\n    // 如果不匹配，我们返回\
  \ ErrInvalidCredentials 错误。\n    err = bcrypt.CompareHashAndPassword(hashedPassword,\
  \ []byte(password))\n    if err != nil {\n        if errors.Is(err, bcrypt.ErrMismatchedHashAndPassword)\
  \ {\n            return 0, ErrInvalidCredentials\n        } else {\n           \
  \ return 0, err\n        }\n    }\n\n    // 否则，密码正确。返回用户 ID。\n    return id, nil\n\
  }\n```\n\n我们的下一步是更新 `userLoginPost` 处理器，使其能够解析提交的登录表单数据并调用此 `UserModel.Authenticate()`\
  \ 方法。\n\n如果登录详情有效，我们还想将用户的 `id` 添加到他们的会数据中，这样对于未来的请求，我们就知道他们已经通过身份验证以及他们是哪个用户。\n\
  \n进入你的 `handlers.go` 文件并进行如下更新：\n\n文件：`cmd/web/handlers.go`\n\n```go\npackage main\n\
  \n...\n\nfunc (app *application) userLoginPost(w http.ResponseWriter, r *http.Request)\
  \ {\n    // 将表单数据解码到 userLoginForm 结构体中。\n    var form userLoginForm\n\n    err\
  \ := app.decodePostForm(r, &form)\n    if err != nil {\n        app.clientError(w,\
  \ http.StatusBadRequest)\n        return\n    }\n\n    // 对表单进行一些验证检查。我们检查 email\
  \ 和\n    // password 是否都提供，并且检查 email 地址的格式\n    // 以作为用户体验的优化（以防用户写错）。\n    form.CheckField(validator.NotBlank(form.Email),\
  \ \"email\", \"此字段不能为空\")\n    form.CheckField(validator.Matches(form.Email, validator.EmailRX),\
  \ \"email\", \"此字段必须是有效的电子邮箱地址\")\n    form.CheckField(validator.NotBlank(form.Password),\
  \ \"password\", \"此字段不能为空\")\n\n    if !form.Valid() {\n        data := app.newTemplateData(r)\n\
  \        data.Form = form\n        app.render(w, http.StatusUnprocessableEntity,\
  \ \"login.tmpl\", data)\n        return\n    }\n\n    // 检查凭据是否有效。如果无效，添加一条通用的\n\
  \    // 非字段错误消息并重新显示登录页面。\n    id, err := app.users.Authenticate(form.Email, form.Password)\n\
  \    if err != nil {\n        if errors.Is(err, models.ErrInvalidCredentials) {\n\
  \            form.AddNonFieldError(\"邮箱或密码不正确\")\n\n            data := app.newTemplateData(r)\n\
  \            data.Form = form\n            app.render(w, http.StatusUnprocessableEntity,\
  \ \"login.tmpl\", data)\n        } else {\n            app.serverError(w, err)\n\
  \        }\n        return\n    }\n\n    // 使用当前会话上的 RenewToken() 方法更改会话\n    //\
  \ ID。当用户的身份验证状态或权限级别改变时\n    //（例如登录和注销操作），生成新的会话 ID 是一项良好的做法。\n    err = app.sessionManager.RenewToken(r.Context())\n\
  \    if err != nil {\n        app.serverError(w, err)\n        return\n    }\n\n\
  \    // 将当前用户的 ID 添加到会话中，这样他们现在\n    // “已登录”。\n    app.sessionManager.Put(r.Context(),\
  \ \"authenticatedUserID\", id)\n\n    // 将用户重定向到创建代码片段的页面。\n    http.Redirect(w,\
  \ r, \"/snippet/create\", http.StatusSeeOther)\n}\n\n...\n```\n\n好了，让我们尝试一下吧！\n\n\
  重启应用程序并尝试提交一些无效的用户凭据……\n\n![](img/11.04-02.png)\n\n你应该得到一个非字段的验证错误消息，如下所示：\n\n![](img/11.04-03.png)\n\
  \n但当你输入一些正确的凭据（使用你在上一章中创建的用户邮箱地址和密码）时，应用程序应该登录你并将重定向到创建代码片段的页面，如下：\n\n![](img/11.04-04.png)![](img/11.04-05.png)\n\
  \n我们在过去的两个章节中涵盖了大量内容，所以让我们快速回顾一下目前的进展。\n\n*   用户现在可以使用 `GET /user/signup` 表单在网站注册。我们将注册用户的详情存储在\
  \ `users` 表中。\n*   注册用户可以使用 `GET /user/login` 表单进行身份验证并提供邮箱地址和密码。如果详情有效，我们将通过身份验证并将用户的\
  \ `id` 添加到会话数据中。\n\n\n\n太棒了。我们现在只需调用 `isAuthenticated()` 辅助函数，即可检查请求是否来自已验证（已登录）的用户。\n\
  \n下一步是找到一种将此信息传递给 HTML 模板的方法，这样我们就可以相应地切换导航栏的内容。\n\n这包含两个部分。首先，我们需要在 `templateData`\
  \ 结构体中添加一个新的 `IsAuthenticated` 字段：\n\n文件：`cmd/web/templates.go`\n\n```\npackage\
  \ main\n\nimport (\n    \"html/template\"\n    \"path/filepath\"\n    \"time\"\n\
  \n    \"snippetbox.alexedwards.net/internal/models\"\n)\n\ntype templateData struct\
  \ {\n    CurrentYear     int\n    Snippet         *models.Snippet\n    Snippets\
  \        []*models.Snippet\n    Form            any\n    Flash           string\n\
  \    IsAuthenticated bool // 为 templateData 结构体添加一个 IsAuthenticated 字段。\n}\n\n...\n\
  ```\n\n第二步是更新我们的 `newTemplateData()` 辅助函数，以便在每次渲染模板时，该信息都会自动添加到 `templateData` 结构体中。如下所示：\n\
  \n文件：`cmd/web/helpers.go`\n\n```\npackage main\n\n...\n\nfunc (app *application)\
  \ newTemplateData(r *http.Request) *templateData {\n    return &templateData{\n\
  \        CurrentYear:     time.Now().Year(),\n        Flash:           app.sessionManager.PopString(r.Context(),\
  \ \"flash\"),\n        // 将认证状态添加到模板数据中。\n        IsAuthenticated: app.isAuthenticated(r),\n\
  \    }\n}\n\n...\n```\n\n一旦完成，我们就可以更新 `ui/html/partials/nav.tmpl` 文件，使用 `{{if .IsAuthenticated}}`\
  \ 动作来切换导航链接，如下：\n\n文件：`ui/html/partials/nav.tmpl`\n\n```\n{{define \"nav\"}}\n<nav>\n\
  \    <div>\n        <a href='/'>首页</a>\n        <!-- 根据身份验证状态切换链接 -->\n        {{if\
  \ .IsAuthenticated}}\n            <a href='/snippet/create'>创建代码片段</a>\n       \
  \ {{end}}\n    </div>\n    <div>\n        <!-- 根据身份验证状态切换链接 -->\n        {{if .IsAuthenticated}}\n\
  \            <form action='/user/logout' method='POST'>\n                <button>注销</button>\n\
  \            </form>\n        {{else}}\n            <a href='/user/signup'>注册</a>\n\
  \            <a href='/user/login'>登录</a>\n        {{end}}\n    </div>\n</nav>\n\
  {{end}}\n```\n\n保存所有文件并尝试现在运行应用程序。如果你目前没有登录，你的应用程序首页应该像这样：\n\n![](img/11.06-01.png)\n\
  \n否则 —— 如果你已登录 —— 首页应该像这样：\n\n![](img/11.06-02.png)\n\n你可以随意尝试操作这些功能，并尝试登录和注销，直到你确信导航栏如你预期的那样发生了变化。\n\
  \n### 限制访问权限\n\n目前，我们为任何未登录的用户隐藏了“创建代码片段”导航链接。但未验证的用户仍然可以通过直接访问 [`https://localhost:4000/snippet/create`](https://localhost:4000/snippet/create)\
  \ 页面来创建新的代码片段。\n\n让我们修复这个问题，使得如果未验证的用户尝试访问 URL 路径为 `/snippet/create` 的任何路由，他们将重重定向到\
  \ `/user/login` 而不是。\n\n实现此点的最简单方法是通过某些中间件。打开 `cmd/web/middleware.go` 文件并创建一个新的\
  \ `requireAuthentication()` 中间件函数，遵循我们在书中较早之前 使用的模式：\n\n文件：`cmd/web/middleware.go`\n\
  \n```\npackage main\n\n...\n\nfunc (app *application) requireAuthentication(next\
  \ http.Handler) http.Handler {\n    return http.HandlerFunc(func(w http.ResponseWriter,\
  \ r *http.Request) {\n        // 如果用户未通过验证，将他们重定向到登录页面并\n        // 从中间件链返回，这样链中后续的处理程序就不会被执行。\n\
  \        if !app.isAuthenticated(r) {\n            http.Redirect(w, r, \"/user/login\"\
  , http.StatusSeeOther)\n            return\n        }\n\n        // 否则，设置 \"Cache-Control:\
  \ no-store\" 头部，使得\n        // 需要验证的页面不会存储在用户的浏览器缓存（或\n        // 其他中间缓存）中。\n  \
  \      w.Header().Add(\"Cache-Control\", \"no-store\")\n\n        // 调用链中的下一个处理程序。\n\
  \        next.ServeHTTP(w, r)\n    })\n}\n```\n\n我们现在可以将此中间件添加到我们的 `cmd/web/routes.go`\
  \ 文件中以保护特定路由。\n\n在我们情况下，我们将想要保护 `GET /snippet/create` 和 `POST /snippet/create` 路由。如果用户没有登录，对他们注销是没有意义的，因此在\
  \ `POST /user/logout` 路由上使用它也是合理的。\n\n为了帮助这一点，让我们将应用程序路由重新调整为两个“组”。\n\n第一组将包含我们的“未保护”路由并使用我们现有的\
  \ `dynamic` 中间件链。第二组将包含我们的“受保护”路由，并将使用一个新的 `protected` 中间件链 —— 由新的 `protected` 中间件链组成。\n\
  \n如下：\n\n文件：`cmd/web/routes.go`\n\n```\npackage main\n\n...\n\nfunc (app *application)\
  \ routes() http.Handler {\n    router := chirouter.New()\n\n    router.NotFound\
  \ = http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n        app.notFound(w)\n\
  \    })\n\n    fileServer := http.FileServer(http.Dir(\"./ui/static\"))\n    router.Handler(http.MethodGet,\
  \ \"/static/*\", http.StripPrefix(\"/static\", fileServer))\n\n    // 使用 \"dynamic\"\
  \ 中间件链的未保护路由。\n    dynamic := alice.New(app.sessionManager.LoadAndSave)\n\n    router.Handler(http.MethodGet,\
  \ \"/\", dynamic.ThenFunc(app.home))\n    router.Handler(http.MethodGet, \"/snippet/:id\"\
  , dynamic.ThenFunc(app.snippetView))\n    router.Handler(http.MethodGet, \"/user/signup\"\
  , dynamic.ThenFunc(app.userSignup))\n    router.Handler(http.MethodPost, \"/user/signup\"\
  , dynamic.ThenFunc(app.userSignup))\n    router.Handler(http.MethodGet, \"/user/login\"\
  , dynamic.ThenFunc(app.userLogin))\n    router.Handler(http.MethodPost, \"/user/login\"\
  , dynamic.ThenFunc(app.userPost))\n\n    // 受保护（仅限已登录）的应用程序路由，使用一个新的\n    // 中间件链，包含了\
  \ requireAuthentication。\n    protected := dynamic.Append(app.requireAuthentication)\n\
  \n    router.Handler(http.MethodGet, \"/snippet/create\", protected.ThenFunc(app.snippetCreate))\n\
  \    router.Handler(http.MethodPost, \"/snippet/create\", protected.ThenFunc(app.snippetPost))\n\
  \    router.Handler(http.MethodPost, \"/user/logout\", protected.ThenFunc(app.userLogout))\n\
  \n    standard := alice.New(app.recoverPanic, app.logRequest, secureHeaders)\n \
  \   return standard.Then(router)\n}\n```\n\n保存文件，重启应用程序并确保你已注销。\n\n然后尝试在浏览器中直接访问\
  \ `https://localhost:4000/snippet/create`。你会发现你被立即重定向到了登录表单。\n\n如果你喜欢，也可以通过 curl\
  \ 确认未验证的用户对于 `POST /snippet/create` 也会被重定向：\n\n```\n$ curl -ki -X POST https://localhost:4000/snippet/create\n\
  HTTP/2 303 \ncontent-security-policy: default-src 'self'; style-src 'self' fonts.googleapis.com;\
  \ font-src fonts.gstatic.com\nlocation: /user/login\nreferrer-policy: origin-when-cross-origin\n\
  vary: Cookie\nx-content-type-options: nosniff\nx-frame-options: deny\nx-xss-protection:\
  \ 0\ncontent-length: 0\ndate: Tue, 08 Mar 2022 11:28:05 GMT\n```\n\n* * *\n\n###\
  \ 其他信息\n\n#### 不使用 alice\n\n如果你没有使用 `justinas/alice` 包来管理你的中间件，那没关系 —— 你可以这样手动包装你的处理程序：\n\
  \n```\nrouter.Handler(http.MethodPost, \"/snippet/create\", app.sessionManager.LoadAndSave(app.requireAuthentication(http.HandlerFunc(app.snippetCreate))))\n\
  ```\n\n第 11.7 章. CSRF 保护\n\n\n\n\n\n在本章中，我们将介绍如何保护应用程序免受[跨站请求伪造](https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html)\
  \ (CSRF)攻击。\n\n如果你不熟悉 CSRF 的原理，它是一种攻击类型，恶意第三方网站向你的网站发送更改状态的 HTTP 请求。关于基础 CSRF 攻击的绝佳解释可以[在此处找到](http://www.gnucitizen.org/blog/csrf-demystified/)。\n\
  \n在我们的应用程序中，主要的风险如下：\n\n*   用户登录了我们的应用程序。我们的 session cookie 设置为持续 12 小时，因此即使他们离开应用程序，他们将保持登录状态。\n\
  *   随后，用户访问一个恶意网站，该网站包含某些代码，会向我们的 `POST /snippet/create` 端点发送跨站请求，以向我们的数据库中添加新的代码片段。session\
  \ cookie 将随此请求一起发送。\n*   由于请求包含了 session cookie，我们的应用程序会将该请求解释为来自已登录用户，并以该用户的权限处理请求。因此，在用户完全不知情的情况下，一个新的代码片段将被添加到我们的数据库中。\n\
  \n除了上述的“传统”CSRF 攻击（即以已登录用户的权限处理请求）外，你的应用程序可能还面临[登录和注销](https://stackoverflow.com/questions/6412813/do-login-forms-need-tokens-against-csrf-attacks)\
  \ CSRF 攻击的风险。\n\n### SameSite cookies\n\n我们可以防止 CSRF 攻击的一种缓解措施是确保在我们的 session cookie\
