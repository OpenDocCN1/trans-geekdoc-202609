  \ 属性。\n\n默认情况下，我们正在使用的 `alexedwards/scs` 包始终会在 session cookie 上设置 `SameSite=Lax`。这意味着用户的浏览器将不会为任何[不安全的](https://tools.ietf.org/html/rfc7231#section-4.2.1)跨站请求发送（即\
