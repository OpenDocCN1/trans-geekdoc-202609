  \ context）、如何使用它，以及何时适合使用它。\n*   如何在实践中使用请求上下文在你的各个处理器之间传递有关当前用户的信息。\n\n# 第 12.1\
  \ 节。\n\n## 请求上下文是如何工作的\n\n我们的中间件和处理器所处理的每一个 `http.Request` 内部都嵌入了一个 `context.Context`\
  \ 对象，我们可以利用它在请求的整个生命周期内存储信息。\n\n正如我之前暗示过的，在 Web 应用程序中，这种机制的一个常见用例是在你的中间件和其他处理器之间传递信息。\n\
  \n在我们的案例中，我们想要使用它来在某些中间件中检查用户是否通过了身份验证，如果通过了，则将此信息提供给我们所有的其他中间件和处理器。\n\n让我们先从理论开始，解释处理请求上下文的语法。然后，在下一章节中，我们将再次变得具体，并演示如何在应用程序中实际使用它。\n\
  \n### 请求上下文的语法\n\n向请求上下文中添加信息的的基础代码所示：\n\n```\n// 其中 r 是一个 *http.Request...\nctx\
  \ := r.Context()\nctx = context.WithValue(ctx, \"isAuthenticated\", true)\nr = r.WithContext(ctx)\n\
  ```\n\n让我们逐行分析这些行代码。\n\n*   首先，我们使用 `r.Context()` 方法从请求中获取*现有的*上下文，并将其赋值给变量 `ctx`。\n\
  *   然后，我们使用 `context.WithValue()` 方法创建一个现有上下文的*新副本*，其中包含键 `\"isAuthenticated\"`\
  \ 和值 `true`。\n*   最后，我们使用 `r.WithContext()` 方法创建一个包含我们新上下文的请求的*副本*。\n\n我还应该指出的是，为了清晰起见，我把那段代码片段写得比实际需要的要冗长一些。更典型的写法是这样的：\n\
  \n```\nctx = context.WithValue(r.Context(), \"isAuthenticated\", true)\nr = r.WithContext(ctx)\n\
  ```\n\n这就是你向请求上下文中添加数据的方法。但如何再次获取它呢？\n\n这里需要解释的关键点是，在底层，请求上下文的值是以类型 `any` 存储的。这意味着，从上下文中获取它们后，你需要在使用它们之前将它们断言为原始类型。\n\
  \n要获取一个值，我们需要使用 `r.Context().Value()` 方法，如下所示：\n\n```\nisAuthenticated, ok := r.Context().Value(\"\
  isAuthenticated\").(bool)\nif !ok {\n    return errors.New(\"could not convert value\
  \ to bool\")\n}\n```\n\n### 避免键冲突\n\n在上面的代码示例中，我使用字符串 `\"isAuthenticated\"` 作为从请求上下文中存储和检索数据的键（key）。但这种做法是不推荐的，因为存在这样一种风险：即你的应用程序所使用的其他第三方包可能也想要使用键\
  \ `\"isAuthenticated\"` 来存储数据——这会导致命名冲突。\n\n为了避免这种情况，良好的做法是为键创建一个你自定义的自定义类型。在我们的示例中，我们将这样做：\n\
  \n```\n// 为键定义一个自定义类型\ntype contextKey string\n\n// 创建一个该类型的常量\nconst isAuthenticatedContextKey\
  \ = contextKey(\"isAuthenticated\")\n\n// 从上下文中检索值\nisAuthenticated, ok := r.Context().Value(isAuthenticatedContextKey).(bool)\n\
  if !ok {\n    return errors.New(\"could not convert value to bool\")\n}\n```\n\n\
  ## 第 12.2 节。用于身份验证/授权的请求上下文\n\n现在，让我们创建一个 `authenticate()` 中间件，它将：\n\n1. 从会话中检索用户\
  \ ID。\n2. 检查数据库该 ID 是否存在。\n3. 使用 `true` 的 `isAuthenticatedContextKey` 更新请求上下文。\n\
  \n以下是代码：\n\nFile: cmd/web/middleware.go\n```go\npackage main\n\nimport (\n    \"\
  context\"\n    \"errors\"\n    \"fmt\"\n    \"net/http\"\n\n    \"github.com/justinas/nosurf\"\
  \n)\n\nfunc (app *application) authenticate(next http.Handler) http.Handler {\n\
  \    return http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n  \
  \      // 使用 GetInt 方法从会话中检索 authenticatedUserID 值。\n        // 如果会话中没有 \"authenticatedUserID\"\
  ，则正常调用\n        // 链中的下一个处理器。\n        id := app.sessionManager.GetInt(r.Context(),\
  \ \"authenticatedUserID\")\n        if id == 0 {\n            next.ServeHTTP(w,\
  \ r)\n            return\n        }\n\n        // 否则，我们检查数据库中是否存在该 ID 的\n      \
  \  // 用户。\n        exists, err := app.users.Exists(id)\n        if err != nil {\n\
  \            app.serverError(w, err)\n            return\n        }\n\n        //\
  \ 如果找到了匹配的用户，我们就知道该请求来自\n        // 数据库中存在的已身份验证用户。我们\n        // 创建请求的新副本（在请求上下文中包含值为\
  \ true 的\n        // isAuthenticatedContextKey），并将其赋值给 r。\n        if exists {\n\
  \            ctx := context.WithValue(r.Context(), isAuthenticatedContextKey, true)\n\
  \            r = r.WithContext(ctx)\n        }\n\n        // 调用链中的下一个处理器。\n    \
  \    next.ServeHTTP(w, r)\n    })\n}\n```\n\nFile: internal/models/users.go\n```go\n\
  package models\n\nimport (\n    \"database/sql\"\n)\n\n// ...\n\nfunc (m *UserModel)\
  \ Exists(id int) (bool, error) {\n    var exists bool\n\n    stmt := \"SELECT EXISTS(SELECT\
  \ 1 FROM users WHERE id = ?)\"\n\n    err := m.DB.QueryRow(stmt, id).Scan(&exists)\n\
  \    return exists, err\n}\n```\n\nFile: cmd/web/context.go\n```go\npackage main\n\
  \ntype contextKey string\n\nconst isAuthenticatedContextKey = contextKey(\"isAuthenticated\"\
  )\n```\n\n\n\n\n\n```go\npackage main\n\n...\n\nfunc (app *application) routes()\
  \ http.Handler {\n    router := httprouter.New()\n\n    router.NotFound = http.HandlerFunc(func(w\
  \ http.ResponseWriter, r *http.Request) {\n        app.notFound(w)\n    })\n\n \
  \   fileServer := http.FileServer(http.Dir(\"./ui/static/\"))\n    router.Handler(http.MethodGet,\
  \ \"/static/*filepath\", http.StripPrefix(\"/static\", fileServer))\n    \n    //\
  \ Add the authenticate() middleware to the chain.\n    dynamic := alice.New(app.sessionManager.LoadAndSave,\
  \ noSurf, app.authenticate)\n\n    router.Handler(http.MethodGet, \"/\", dynamic.ThenFunc(app.home))\n\
  \    router.Handler(http.MethodGet, \"/snippet/view/:id\", dynamic.ThenFunc(app.snippetView))\n\
  \    router.Handler(http.MethodGet, \"/user/signup\", dynamic.ThenFunc(app.userSignup))\n\
  \    router.Handler(http.MethodPost, \"/user/signup\", dynamic.ThenFunc(app.userSignupPost))\n\
  \    router.Handler(http.MethodGet, \"/user/login\", dynamic.ThenFunc(app.userLogin))\n\
  \    router.Handler(http.MethodPost, \"/user/login\", dynamic.ThenFunc(app.userLoginPost))\n\
  \n    protected := dynamic.Append(app.requireAuthentication)\n\n    router.Handler(http.MethodGet,\
  \ \"/snippet/create\", protected.ThenFunc(app.snippetCreate))\n    router.Handler(http.MethodPost,\
  \ \"/snippet/create\", protected.ThenFunc(app.snippetCreatePost))\n    router.Handler(http.MethodPost,\
  \ \"/user/logout\", protected.ThenFunc(app.userLogoutPost))\n\n    standard := alice.New(app.recoverPanic,\
  \ app.logRequest, secureHeaders)\n    return standard.Then(router)\n}\n```\n\n我们最后需要做的是更新\
  \ `isAuthenticated()` 辅助函数，使其不再检查会话数据，而是检查请求上下文（request context）来判断用户是否已身份。\n\n\
  我们可以这样做：\n\n文件：`cmd/web/helpers.go`\n\n```go\npackage main\n\n...\n\nfunc (app *application)\
  \ isAuthenticated(r *http.Request) bool {\n    isAuthenticated, ok := r.Context().Value(isAuthenticatedContextKey).(bool)\n\
  \    if !ok {\n        return false\n    }\n\n    return isAuthenticated\n}\n```\n\
  \n这里需要指出的是，如果请求上下文中没有 `isAuthenticatedContextKey` 键的值，或者底层值不是 `bool` 类型，那么该类型断言将会失败。在这种情况下，我们采取“安全”回退策略，并返回\
  \ `false`（即我们假设用户未通过验证）。\n\n如果你愿意，可以尝试再次运行应用程序。它应该能够正常编译，如果你以某个用户登录并在应用程序中浏览，它的工作方式应该和之前完全一样。\n\
  \n然后，如果你想，可以打开 MySQL 从数据库中删除你当前登录用户的记录。例如：\n\n```mysql\nmysql> USE snippetbox;\n\
  mysql> DELETE FROM users WHERE email = 'bob@example.com';\n```\n\n当你回到浏览器并刷新页面时，应用程序现在足够智能了。\n\
  \n### 附加信息\n\n#### 可选功能\n\nGo 1.16 的新功能之一是 `embed`，它允许你直接将文件和目录包含在二进制文件中。这对于分发需要静态资源的自包含应用程序特别有用。\n\
  \n在本节中，我们将讨论两个功能：`embedding`（嵌入）和 `generics`（泛型）。\n\n#### 使用嵌入文件\n\n为了说明如何使用 `embed`，首先创建一个\
  \ `ui/efs.go`：\n\n```bash\n$ touch ui/efs.go\n```\n\n然后添加以下代码：\n\n文件：`ui/efs.go`\n\
  \n```go\npackage ui\n\nimport (\n    \"embed\"\n)\n\n//go:embed \"html\" \"static\"\
  \nvar Files embed.FS\n```\n\n这里重要的一行是 `//go:embed \"html\" \"static\"`。它看起来像是一个注释，但实际上是一个特殊的指令。当我们的应用程序编译时，该指令指示\
  \ Go 存储这些文件。\n\n关于这一点有几个重要的细节我们需要解释：\n\n- 注释指令必须放置在你想要存储嵌入文件的变量上方。\n- 指令的通用格式为 `go:embed\
  \ <paths>`，在一个指令中指定多个路径是允许的。这些路径应该相对于包含该指令的源代码。\n- 你只能在包级别的全局变量上使用 `go:embed` 指令，而不能在函数或方法内部。如果你尝试在函数或方法中使用它，将在编译时得到错误\
  \ `\"go:embed cannot apply to var inside func\"`。\n- 如果路径是一个目录，则该目录下的所有文件都将被递归嵌入，但以\
  \ `.` 或 `_` 开头的文件除外。如果你想包含这些文件，应该使用 `all:` 前缀。\n- 路径不能包含 `.` 或 `..` ，也不能以 `/` 开始或结束。\n\
  - 路径分隔符应该始终使用斜杠，即使在 Windows 上也是如此。\n- 嵌入的文件系统始终根于包含 `go:embed` 指令的目录。因此在上面的示例中，我们的\
  \ `Files` 变量包含一个 `embed.FS` 嵌入文件系统，该文件系统的根是我们的 `ui` 目录。\n\n### 使用静态文件\n\n让我们更改应用程序，使其从嵌入文件系统提供静态\
  \ CSS、JavaScript 和图像文件，而不是在运行时从磁盘读取它们。\n\n\n\n\n\n```go\npackage main\n\nimport\
  \ (\n    \"net/http\"\n    \"io/fs\"\n    \"path/filepath\"\n    \"time\"\n\n  \
  \  \"snippetbox.alexedwards.net/internal/models\"\n    \"snippetbox.alexedwards.net/ui\"\
  \ // 新导入\n)\n\n...\n\nfunc newTemplateCache() (map[string]*template.Template, error)\
  \ {\n    cache := map[string]*template.Template{}\n\n    // 使用 fs.Glob() 获取 ui.Files\
  \ 嵌入文件系统中所有\n    // 匹配 'html/pages/*.tmpl' 模式的文件路径切片。这本质上\n    // 我们提供了应用程序所有的 'page'\
  \ 模板切片，\n    // 就像之前一样。\n    pages, err := fs.Glob(ui.Files, \"html/pages/*.tmpl\"\
  )\n    if err != nil {\n        return nil, err\n    }\n\n    for _, page := range\
  \ pages {\n        name := filepath.Base(page)\n\n        // 创建一个包含我们要解析的模板\n  \
  \      // 文件路径模式的切片。\n        patterns := []string{\n            \"html/base.tmpl\"\
  ,\n            \"html/partials/*.tmpl\",\n            page,\n        }\n\n     \
  \   // 使用 ParseFS() 代替 ParseFiles() 来解析来自\n        // ui.Files 嵌入文件系统的模板文件。\n  \
  \      ts, err := template.New(name).Funcs(functions).ParseFS(ui.Files, patterns...)\n\
  \        if err != nil {\n            return nil, err\n        }\n\n        cache[name]\
  \ = ts\n    }\n\n    return cache, nil\n}\n```\n\n如果你保存了文件并重启应用程序，你应该发现一切都能正常编译并运行。当你在浏览器中访问\
  \ `https://localhost:4000` 时，静态文件应该从嵌入文件系统中提供，一切看起来都很正常。\n\n![](img/13.01.png)\n\
  \n如果你愿意，你也可以直接导航到静态文件来检查它们仍然可用。例如，访问 `https://localhost:4000/static/main.css` 应该显示来自嵌入文件系统的网页\
  \ CSS 样式表。\n\n![](img/13.02.png)\n\n### 嵌入 HTML 模板\n\n接下来，让我们更新 `cmd/web/templates.go`\
  \ 文件，以便我们的模板缓存使用来自 `ui.Files` 的嵌入 HTML 模板，而不是磁盘上的模板。\n\n为了帮助我们，我们需要利用 Go 1.16 引入的用于处理文件系统的特殊功能：\n\
  \n- `fs.Glob()` 返回一个匹配 glob 通配符的文件路径切片。它与我们之前在书中使用的 `filepath.Glob()` 函数实际上相同，不同在于它作用于嵌入文件系统。\n\
  - `Template.ParseFS()` 可用于将嵌入文件系统中的 HTML 模板解析为模板集。这在本质上替换了我们之前使用的 `Template.ParseFiles()`\
  \ 和 `Template.ParseGlob()` 方法。`Template.ParseFiles()` 也是一个变长函数，它允许你在单次 `ParseFiles()`\
  \ 调用中解析多个模板。\n\n让我们在 `cmd/web/templates.go` 文件中使用这些功能：\n\n文件：cmd/web/templates.go\n\
  （见上方的代码块）\n\n\n\n\n我知道这听起来可能有点无聊，但泛型（generics）是一项新的语言特性，编写泛型代码的最佳实践仍在完善中。如果你在一个团队中工作，或者在公场合编写代码，你还需要记住，并不是所有的其他\
  \ Go 开发者都一定熟悉泛型代码是如何运作的。\n\n你并不 `需要` 使用泛型，不使用它也是完全可以的。\n\n但即使有这些限制，在某些场景下，编写泛型代码确实非常有用。广义地说，当出现以下情况，你可能想要考虑使用它：\n\
  \n*   你发现自己在为不同的数据类型编写重复的样板代码。这可能包括对切片（slices）、map 或通道（channels）的常用操作——或者对不同数据类型执行验证检查或测试断言的辅助函数。\n\
  *   你正在编写代码并发现自己正在使用 `any`（空 `interface{}`）类型。这的一个例子可能是当你创建一个需要处理不同类型的数据结构（如队列、缓存或链表）时。\n\
  \n相比之下，在以下情况下，你可能**不想要**使用泛型：\n\n*   如果它让你的代码更难理解或不够清晰。\n*   如果你需要处理的所有类型都拥有一共同的方法集——在这种情况下，定义并使用普通的\
  \ `interface` 类型会更好。\n*   仅仅 `因为你可以` 这样做。相反，请默认编写简单的非泛型代码，只有在 `实际上确实需要` 的时候再切换到泛型版本。\n\
  \n### 在我们的应用程序中使用泛型\n\n在书的下一节中，我们将开始为应用程序编写测试，在此过程中，我们将生成大量的重复样板代码。我们将利用 Go 的泛型功能来帮助管理这些代码，并创建一些泛型辅助函数来对不同数据类型执行测试断言。\n\
  \n但目前，我们的代码库中还没有什么可以通过泛型来获益。我们的应用程序已经可以运行——而且代码清晰、易读，没有多少泛型可以轻松消除的重复内容。\n\n也许唯一真正适合泛型化的我们\
  \ `internal/validator/validator.go` 文件中的 `PermittedInt()` 函数。\n\n让我们将其更改为泛型的 `PermittedValue()`\
  \ 函数，然后我们可以在每次需要检查用户提供的值是否在允许值集合中时都使用它——无论用户提供的值是 `string`、`int`、`float64` 还是任何其他\
  \ [comparable type](https://pkg.go.dev/builtin#comparable)。\n\n如下所示：\n\nFile: internal/validator/validator.go\n\
  \n```\npackage validator\n\n...\n\n// 将 PermittedInt() 替换为泛型的 PermittedValue() 函数。\n\
  // 如果类型为 T 的值等于变长参数 permittedValues \n// 之一，则返回 true。\nfunc PermittedValueT comparable\
  \ bool {\n    for i := range permittedValues {\n        if value == permittedValues[i]\
  \ {\n            return true\n        }\n    }\n    return false\n}\n```\n\n然后我们可以更新\
  \ `snippetCreatePost` 处理器，在验证检查中使用新的 `PermittedValue()` 函数，如下式所示：\n\nFile: cmd/web/handlers.go\n\
  \n```\npackage main\n\n...\n\nfunc (app *application) snippetCreatePost(w http.ResponseWriter,\
  \ r *http.Request) {\n    var form snippetCreateForm\n\n    err := app.decodePostForm(r,\
  \ &form)\n    if err != nil {\n        app.clientError(w, http.StatusBadRequest)\n\
  \        return\n    }\n\n    form.CheckField(validator.NotBlank(form.Title), \"\
  title\", \"This field cannot be blank\")\n    form.CheckField(validator.MaxChars(form.Title,\
  \ 100), \"title\", \"This field cannot be more than 100 characters long\")\n   \
  \ form.CheckField(validator.NotBlank(form.Content), \"content\", \"This field cannot\
  \ be blank\")\n```\n\n\n\n\n-   该测试只是普通的 Go 代码，它调用了 `humanDate()` 函数并检查结果是否符合我们的预期。\n\
  \n-   你的单元测试包含在一个签名名为 `func(*testing.T)` 的普通 Go 函数中。\n\n-   要使该函数成为一个有效的单元测试，该函数名**必须**以\
  \ `Test` 单词开头。通常，这之后会跟着你正在测试的函数、方法或类型的名称，以便一目了然地看出正在测试**什么**。\n\n-   你可以使用 [`t.Errorf()`](https://pkg.go.dev/testing/#T.Errorf)\
  \ 函数将测试标记为 `failed`（失败）并记录关于失败的描述性消息。需要注意的是，调用 `t.Errorf()` `不会停止测试的执行` —— 在你调用它之后，Go\
  \ 将像正常一样继续执行任何剩余的测试代码。\n\n让我们来试一下。保存文件，然后使用 `go test` 命令运行我们 `cmd/web` 包中的所有测试，如下所示：\n\
  \n```\n$ go test ./cmd/web\nok      snippetbox.alexedwards.net/cmd/web    0.005s\n\
  ```\n\n所以，这些很有用。输出中的 `ok` 表示该包中的所有测试（目前只有我们的 `TestHumanDate()` 测试）都通过了，没有任何问题。\n\
  \n如果你想查看更多细节，可以使用 `-v` 标志获取 `verbose`（详细）输出，从而精确看到正在运行哪些测试：\n\n```\n$ go test -v\
  \ ./cmd/web\n=== RUN   TestHumanDate\n--- PASS: TestHumanDate (0.00s)\nPASS\nok\
  \      snippetbox.alexedwards.net/cmd/web    0.007s\n```\n\n### 表驱动测试\n\n现在让我们扩展\
  \ `TestHumanDate()` 函数，以涵盖一些额外的测试用例。具体来说，我们将更新它来同时检查：\n\n1. 如果 `humanDate()` 的输入是[零值](https://pkg.go.dev/time/#Time.IsZero)，则它将返回空字符串\
  \ `\"\"`。\n\n2. `humanDate()` 函数的输出始终使用 UTC 时区。\n\n在 Go 中，运行多个测试用例的一种地道方法是使用表驱动测试。\n\
  \n本质上，表驱动测试的核心思想是创建一个包含输入和预期输出的测试用例“表格”，然后遍历这些表格，并在子测试中运行每个测试用例。你有几种方法可以这样设置，但一种常见的方法是在匿名结构体切片中定义你的测试用例。\n\
  \n我将演示：\n\n文件：`cmd/web/templates_test.go`\n\n```\npackage main\n\nimport (\n   \
  \ \"testing\"\n    \"time\"\n)\n\nfunc TestHumanDate(t *testing.T) {\n    // 创建一个匿名结构体切片，包含测试用例名称、\n\
  \    // 传递给 humanDate() 函数的输入 (tm 字段) 以及预期输出\n    // (want 字段)。\n    tests := []struct\
  \ {\n        name string\n        tm   time.Time\n        want string\n    }{\n\
  \        {\n            name: \"UTC\",\n            tm:   time.Date(2022, 3, 17,\
  \ 10, 15, 0, 0, time.UTC),\n            want: \"17 Mar 2022 at 10:15\",\n      \
  \  },\n        {\n            name: \"Empty\",\n            tm:   time.Time{},\n\
  \            want: \"\",\n        },\n        {\n            name: \"CET\",\n  \
  \          tm:   time.Date(2022, 3, 17, 10, 15, 0, 0, time.FixedZone(\"CET\", 1*60*60)),\n\
  \            want: \"17 Mar 2022 at 09:15\",\n        },\n    }\n\n    // 遍历测试用例。\n\
  \    for _, tt := range tests {\n        // 使用 t.Run() 函数为每个测试用例运行一个子测试。\n     \
  \   // 它的第一个参数是测试名称（用于在任何日志输出中标识 \n        // 子测试），第二个参数是一个包含每个用例实际测试逻辑的匿名函数。\n\
  \        t.Run(tt.name, func(t *testing.T) {\n            hd := humanDate(tt.tm)\n\
  \n            if hd != tt.want {\n                t.Errorf(\"got %q; want %q\",\
  \ hd, tt.want)\n            }\n        })\n    }\n}\n```\n\n好的，让我们运行它看看会发生什么：\n\n\
  ```\n$ go test -v ./cmd/web\n=== RUN   TestHumanDate\n=== RUN   TestHumanDate/UTC\n\
  === RUN   TestHumanDate/Empty\n    templates_test.go:44: got \"01 Jan 0001 at 00:00\"\
  ; want \"\"\n=== RUN   TestHumanDate/CET\n    templates_test.go:44: got \"17 Mar\
  \ 2022 at 10:15\"; want \"17 Mar 2022 at 09:15\"\n--- FAIL: TestHumanDate (0.00s)\n\
  \    --- PASS: TestHumanDate/UTC (0.00s)\n    --- FAIL: TestHumanDate/Empty (0.00s)\n\
  \    --- FAIL: TestHumanDate/CET (0.00s)\nFAIL\nFAIL    snippetbox.alexedwards.net/cmd/web\
  \      0.003s\n```\n\n所以在这里我们可以看到每个子测试的单独输出。正如你可能猜的那样，第一个测试用例通过了，但 `Empty` 和 `CET`\
  \ 测试都失败了。注意对于失败的测试用例 —— 我们在输出中包含了错误信息和文件名？\n\n让我们回到 `humanDate()` 函数并修复这两个问题：\n\n\
  文件：`cmd/web/templates.go`\n\n```\npackage main\n\n...\n\nfunc humanDate(t time.Time)\
  \ string {\n    // 如果时间为零值，则返回空字符串。\n    if t.IsZero() {\n        return \"\"\n\
  \    }\n\n    // 在格式化之前将时间转换为 UTC。\n    return t.UTC().Format(\"02 Jan 2006 at 15:04\"\
  )\n}\n\n...\n```\n\n当你重新运行测试时，一切都应该通过了：\n\n```\n$ go test -v ./cmd/web\n=== RUN\
  \   TestHumanDate\n=== RUN   TestHumanDate/UTC\n=== RUN   TestHumanDate/Empty\n\
  === RUN   TestHumanDate/CET\n--- PASS: TestHumanDate (0.00s)\n    --- PASS: TestHumanDate/UTC\
  \ (0.00s)\n    --- PASS: TestHumanDate/Empty (0.00s)\n    --- PASS: TestHumanDate/CET\
  \ (0.00s)\nok      snippetbox.alexedwards.net/cmd/web    0.007s\n```\n\n### 表驱动测试\n\
  \n现在让我们扩展 `TestHumanDate()` 函数以涵盖额外的测试用例。具体来说，我们将更新它来同时检查：\n\n1. 如果 `humanDate()`\
  \ 的输入是[零值](https://pkg.go.dev/time/#Time.IsZero)，则它返回空字符串 `\"\"`。\n\n2. `humanDate()`\
  \ 函数的输出始终使用 UTC 时区。\n\n在 Go 中，运行多个测试用例的一种地道方法是使用表驱动测试。\n\n本质上，表驱动测试的想法是创建一个包含输入和预期输出的测试用例“表格”，然后遍历这些表格，并在子测试中运行每个测试用例。你有几种方法可以这样设置，但一种常见的方法是在匿名结构体切片中定义你的测试用例。\n\
  \n我将演示：\n\n文件：`cmd/web/templates_test.go`\n\n```go\npackage main\n\nimport (\n \
  \   \"testing\"\n    \"time\"\n)\n\nfunc TestHumanDate(t *testing.T) {\n    // 创建一个匿名结构体切片，包含测试用例名称、\n\
  \    // 传递给 humanDate() 函数的输入 (tm 字段) 以及预期输出\n    // (want 字段)。\n    tests := []struct\
  \ {\n        name string\n        tm   time.Time\n        want string\n    }{\n\
  \        {\n            name: \"UTC\",\n            tm:   time.Date(2022, 3, 17,\
  \ 10, 15, 0, 0, time.UTC),\n            want: \"17 Mar 2022 at 10:15\",\n      \
  \  },\n        {\n            name: \"Empty\",\n            tm:   time.Time{},\n\
  \            want: \"\",\n        },\n        {\n            name: \"CET\",\n  \
  \          tm:   time.Date(2022, 3, 17, 10, 15, 0, 0, time.FixedZone(\"CET\", 1*60*60)),\n\
  \            want: \"17 Mar 2022 at 09:15\",\n        },\n    }\n\n    // 遍历测试用例。\n\
  \    for _, tt := range tests {\n        // 使用 t.Run() 函数为每个测试用例运行一个子测试。\n     \
  \   // 它的第一个参数是测试名称（用于在任何日志输出中标识 \n        // 子测试），第二个参数是一个包含每个用例实际测试逻辑的匿名函数。\n\
  \        t.Run(tt.name, func(t *testing.T) {\n            hd := humanDate(tt.tm)\n\
  \n            if hd != tt.want {\n                t.Errorf(\"got %q; want %q\",\
  \ hd, tt.want)\n            }\n        })\n    }\n}\n```\n\n好的，让我们运行它看看会发生什么：\n\n\
