    # The Grumpy Programmer''s Guide To Building Testable PHP Applications


    ## Chris Hartjes


    This book is for sale at [http://leanpub.com/grumpy-testing](http://leanpub.com/grumpy-testing)


    This version was published on 2013-10-15


    ![publisher''s logo](images/leanpub-logo.png)


    \*   \*   \*   \*   \*


    This is a [Leanpub](http://leanpub.com) book. Leanpub empowers authors and publishers
    with the Lean Publishing process. [Lean Publishing](http://leanpub.com/manifesto)
    is the act of publishing an in-progress ebook using lightweight tools and many
    iterations to get reader feedback, pivot until you have the right book and build
    traction once you do.


    \*   \*   \*   \*   \*


    © 2012 - 2013 Chris Hartjes


    ## Table of Contents


    *   [1 Copyright](#chap00.xhtml#leanpub-auto-copyright)

    *   [2 Thanks](#chap01.xhtml#leanpub-auto-thanks)

    *   [3 Testing Is Good, Testable Applications Are Better](#chap02.xhtml#leanpub-auto-testing-is-good-testable-applications-are-better)

    *   [4 Building Testable Applications is Hard](#chap03.xhtml#leanpub-auto-building-testable-applications-is-hard)

    *   [5 Environmental Consistency](#chap04.xhtml#leanpub-auto-environmental-consistency)

    *   [6 Static Code Analysis](#chap05.xhtml#leanpub-auto-static-code-analysis)

    *   [7 Decoupling Your Objects Using Dependency Injection](#chap06.xhtml#leanpub-auto-decoupling-your-objects-using-dependency-injection)

    *   [8 Like An Onion, Your Application Has Layers](#chap07.xhtml#leanpub-auto-like-an-onion-your-application-has-layers)

    *   [9 Shells and Sandboxes](#chap08.xhtml#leanpub-auto-shells-and-sandboxes)

    *   [10 Rebuilding Your Programming and Deployment Environments](#chap09.xhtml#leanpub-auto-rebuilding-your-programming-and-deployment-environments)

    *   [11 Continuous Integration Landscape For PHP Developers](#chap10.xhtml#leanpub-auto-continuous-integration-landscape-for-php-developers)

    *   [12 Infrastructure Debt](#chap11.xhtml#leanpub-auto-infrastructure-debt)

    *   [13 Fear is the mind-killer](#chap12.xhtml#leanpub-auto-fear-is-the-mind-killer)

    *   [14 Where Are The Tests?](#chap13.xhtml#leanpub-auto-where-are-the-tests)

    *   [15 Metatesting: Understanding Mock Objects](#chap14.xhtml#leanpub-auto-metatesting-understanding-mock-objects)

    *   [16 Advice From a Grumpy Programmer](#chap15.xhtml#leanpub-auto-advice-from-a-grumpy-programmer)


    ### 1 Copyright


    All content in this book, unless otherwise indicated, is (c) 2012 Chris Hartjes.
    In lieu of DRM for electronic copies of this book, I ask that readers respect
    my copyright and do not distribute portions of this book without my express written
    consent. If you help to organize a PHP users group please contact me about obtaining
    free copies to give away to your members.


    ISBN: 978-1-105-45488-2


    ### 2 Thanks


    First, I’d like to thank my technical reviewers. They caught all the details that
    I missed and made this guide what it is. So thanks to (in no particular order)
    Peter Meth, Joel Perras, Matthew Turland, and Remi Woler for their help. Better
    guides come from the input of others.


    Second, I’d like to thank those in the PHP community who are always pushing the
    envelope, always speaking loudly and clearly about the importance of best practices
    while trying to give back to the community at the same time. Those people inspired
    me to keep writing and speaking about topics that interest me and hopefully interest
    you. I may feel out of sync at times with the “mainstream” PHP community but if
    my online ranting and raving has inspired other programmers to step up their own
    game, then I am grateful I had an impact.


    Finally, I’d like to thank my wife Claire for sticking with me on my journey from
    a fresh-out-of-college newbie programmer to the well-rounded, well-seasoned, extremely
    grumpy programmer I am today. Thanks for putting up with the long hours that a
    programmer spends staring at screens instead of staring into their partner’s beautiful
    eyes. My wife is my partner in everything I do.


    As always, I welcome your comments about anything you see in this guide, any questions
    you have, or if you just want to get my thoughts on a wide variety of topics related
    to programming. And baseball too.


    This guide was built with the help of the awesome folks at [Leanpub](http://leanpub.com).
    My initial decision to do the guide as text with some [`AsciiDoc`](http://www.methods.co.nz/asciidoc/)
    markup turned out to make it easier to convert things into [`Markdown`](https://en.wikipedia.org/wiki/Markdown)
    as Leanpub required. I also used [`Pandoc`](http://johnmacfarlane.net/pandoc/)
    to tweak some of the content in the three bonus essays I have included in this
    guide.


    A big “thank you!” to Elizabeth Gauthier for the awesome cover. My wife commented
    on what an incredible likeness it is.


    Unfortunately, this guide is not aimed at the beginning programmer. Writing testable
    applications is a hard thing to do and requires that you already have a solid
    background in programming. This guide is targeted at intermediate-level programmers
    who have had some exposure to writing tests and want to push their skills to the
    next level.


    If you are looking for an introductory guide to writing unit tests I highly recommend
    the [`PHPUnit` documentation](http://www.phpunit.de/manual/3.6/en/phpunit-book.html).
    It will cover all the basics.


    I can be reached via email at chartjes@littlehart.net and on Twitter at @grmpyprogrammer.
    I blog on a regular basis at http://www.littlehart.net/atthekeyboard. Thanks for
    taking the time to check out the guide and I hope you find things that help you
    get a better handle on your ability to test your PHP applications.


    ### 3 Testing Is Good, Testable Applications Are Better


    There is no denying that the PHP world has finally caught up with other programming
    communities in terms of its attitude towards testing. As a result, you can find
    a lot of really good resources either online or in book form from your favourite
    retailer.


    Most of this information focuses on the actual writing of tests and strategies
    for the type of tests you need to write. What I found was missing from most of
    these resources was how to write applications that you could actually test. Sounds
    like something obvious, at least to me.


    There is an open secret out there: some applications can never be tested with
    automated testing tools. They’re built in such a manner that you couldn’t wrap
    anything beyond tests that examine the HTML output from it. That’s really a shame,
    because these sort of things don’t happen on purpose. Like technical debt in your
    code, it builds up over time and at some point you end up with an application
    that might as well be a black box: you put inputs into it and you get output back,
    and have no easy way to determine how to fix things if it sends you back something
    you don’t expect.


    But make no mistake: building a non-trivial testable application is something
    that actually takes experience. A lot of experience. You will mess up. You will
    need to refactor things at a later point, and will often find that refactoring
    to be painful when contrasted with the seemingly-simple feature request that you
    are trying to implement.


    I am a big believer in the power of automated testing to give you an application
    that is maintainable, extendible and performant. I don’t always get to work on
    applications that have made a commitment to be testable. It really is a different
    way of looking at the entire process of testing. It’s one thing to know how to
    write an assertion statement, or understand how to use mock objects to isolate
    components of a module that you are trying to test. It’s another to have to create
    an application that lets you test it from end to end.

