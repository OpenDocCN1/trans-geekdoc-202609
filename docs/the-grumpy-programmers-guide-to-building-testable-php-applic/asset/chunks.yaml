    \ sessions and `$_SERVER` immediately spring to mind. For `PHP` developers, interacting\
    \ with these things are second nature.\n\nBut this becomes a problem if you want\
    \ to build an application that can be tested via `CLI` (Command Line Interface)\
    \ tools like `PHPUnit`. You have to make sure that you are abstracting away any\
    \ access to web-specific information or functions so that your application will\
    \ actually work when modules from it are accessed from the `CLI`. Cookies come\
    \ to mind and I’m sure that with more research you will find more examples of\
    \ things that only live on the web.\n\nLet’s consider the example of your own\
    \ `ACL` implementation that I showed you before. If you recall, it requires that\
    \ you access the `request` object used in your application…which is tied to the\
    \ web. Then it requires a value that you stored in the `session`…which is usually\
    \ associated with the web but can be used in a `CLI` environment.\n\nAll hope\
    \ is not lost. In our first quick little refactoring we used dependency injection\
