- raw: "Mock objects are created specifically for the purpose of making testing easy.\
    \ At their most basic level you use them to replace an object that might need\
    \ to communicate with the “outside world” such as a database or a 3rd party API.\
    \ There are many different tools that can create mock objects for you (PHPUnit\
    \ has built-in [support for it](http://www.phpunit.de/manual/3.6/en/phpunit-book.html#test-doubles))\
    \ but others like to use Padraic Brady’s excellent [Mockery](https://github.com/padraic/mockery)\
    \ mock object framework.\n\nIn our hypothetical case we want to create a mock\
    \ object for our Facebook object. Here’s how you might do it:\n\n```\n<?php\n\
    // Inside your unit test\n$facebookMock = \\Mockery::mock(\n    '\\FacebookAPI\\\
    Facebook',\n    array(\n        'getEmail' => 'test@littlehart.net',\n       \
    \ 'getName' => 'Testy McTesterson'\n    )\n);\n\n$sessionContents['email'] = $facebookMock->getEmail();\n\
    $auth = new AuthUser($sessionContents);\n$this->assertTrue($auth->check());\n\
    ```\n\nNotice how effective the mock object is here. You get all the benefits\
    \ of having an object that matches one that your code is dependent on without\
    \ having to actually speak to Facebook in order to make a test. I believe that\
    \ is a win-win situation when it comes to testing.\n\nTesting your display logic\
    \ via automated tests is something that often generates blank stares when I talk\
    \ about it. “Why don’t you just test that stuff in a browser.” My usual answer\
    \ is along the lines of “because I’m a human and humans make mistakes and skip\
    \ things when they are testing a web page for the 100th time.” Luckily it doesn’t\
    \ take much work to capture the output of your PHP application for testing purposes.\n\
    \nHere’s a snippet from a controller in our sample application\n\n```\n<?php\n\
    include 'bootstrap.php';                                                     \
    \   \n\n...\n\necho $twig->render(\n    'index.html', \n    array(\n        'currentWeek'\
    \ => $currentWeek,\n        'currentResults' => $currentResults,\n        'currentRotations'\
    \ => $currentRotations,\n        'currentSchedules' => $currentSchedules,\n  \
    \      'franchises' => $franchises,\n        'rotationWeek' => $rotationWeek,\n\
    \        'scheduleWeek' => $scheduleWeek,\n        'standings' => $regularStandings,\
    \ \n    )\n);\n```\n\nUsing that same structure we could very easily write a test\
    \ that looks something like this\n\n```\n<?php\ninclude './test_bootstrap.php';\n\
    \nclass MainPageViewTest extends \\PHPUnit_Framework_TestCase\n{\n    protected\
    \ $_twig;\n\n    public function setUp()\n    {\n        // also include our libraries\
    \ installed using Composer\n        include APP_ROOT . 'vendor/.composer/autoload.php';\n\
