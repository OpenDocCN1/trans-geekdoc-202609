- raw: 'See, I’m having problems deciding WHAT to test. Let’s take a look at one project
    for example. We have a [self-hosted web service](http://www.sportsdb.org/sd/sportscaster)
    that we released under the GPL that we not only use ourselves for some clients
    but also use it to troubleshoot things as well. In terms of writing tests, I believe
    the best way to approach this is to write tests that speak directly to the Sportscaster
    “engine” using a known set of parameters and ensure that the output we get back
    matches what we expect. Is unit testing overkill for this? Very hard to say because
    we have an HTML front end that talks to a “gateway” that talks to an “engine”.
    I’m not the one who architected this, but I do have to make sure that it works
    properly. In this case I believe that “your tests should verify your application
    is outputting what you expect it to” is the best approach. Comments about this
    are totally welcome.


    For another project, I tried something that [integrated Selenium with PHPUnit](http://sebastian-bergmann.de/archives/631-Integrating-PHPUnit-with-Selenium.html),
    but it was so slow as to be totally useless. [Sportso](http://www.sportso.com)
    is a very visual application, one that is written in PHP and talks to an [XML
    database](http://exist.sourceforge.net), but presentation is really the key here.
    We need to make sure that we’re placing the right data into our XML documents
    but that part of the application is solid. In this case, I wish to have tests
    that simulate a user clicking around the application and using it. Then I can
    compare output again and make sure that things are showing up when and where I
    expect them to. I’m thinking the PHPUnit-Selenium bridge is a bad idea, and that
    I should instead just focus on Selenium. Again, comments on how to best approach
    this are also welcome. I cannot believe that Selenium is really this slow, so
    there must be something I am doing wrong.


    Also, I’ve thought about continuous integration. This [incredibly inspiring post
    about continuous deployment](http://timothyfitz.wordpress.com/2009/02/10/continuous-deployment-at-imvu-doing-the-impossible-fifty-times-a-day/)
    has me really thinking hard about how my changes actually get pushed up out of
    dev to production. We don’t have the resources to use a cluster of machines that
    IMVU appears to have, but when you think of the infrastructure and (more importantly)
    the practices in place, you just have to be in awe of it all. Just the \*scale\*
    of it is inspiring. If they can do this, I can certainly implement a very effective
    subset of this. There is really no reason other than laziness on my part to not
    do it. Harsh reality, to be sure.


    But the real problem is the political game that you inevitably end up fighting
    over bringing in what is usually a very radical concept: a commitment to testing
    as part of the development process. Especially when the developers are severely
    outnumbered. A lot of people seem to have a pathological fear of automated testing,
    saying things like “we can just quickly test it by hand”. Then when you see the
    errors being reported by users of your products, you can’t help but wonder “could
    we have caught this earlier?” Unless it’s a very obscure error involving a race
    condition or something, of course the answer is YES.


    I read a post from one of the main developers at justin.tv talking about why he
    felt [unit testing is useless](http://abstractstuff.livejournal.com/60388.html).
    While he is entitled to his opinion I can’t help but think that he really is doing
    TDD, but he just refuses to acknowledge it. Yes, ultimately, your users are the
    only ones who can tell you if your application is spitting out errors. But if
    you aren’t doing any rigorous testing of stuff BEFORE your users see it, I think
    you are taking chances with your business. My company is small (just 7 of us)
    so I’m so close to most aspects of the business I can really see the impact of
    certain decisions on the bottom line of the company. It’s not about finding bugs,
    which is what the justin.tv folks claim never happens with unit testing. It’s
    about making sure those bugs never happen in the first place.


    I have to say that I’ve never really delved into the world of post-deployment
    monitoring, so maybe I should start asking a few more questions of people who
    deal with that sort of thing. Again, the key is to make it automated and have
    it report when it finds things that are wrong. We have a very good [nagios](http://en.wikipedia.org/wiki/Nagios)
    infrastructure at work that alerts us to problems with not only servers being
    down, but stale and/or missing data for our customers. I guess the next logical
    step is figuring out ways to look at that mountain of server logs and making sense
    of the errors? Definitely something to think about the next time I get stuck on
    some programming problem at work and need a change of pace.


    I know I’ve been rambling a bit here, so let me pull some of this stuff back together
    to make it more cohesive:


    *   SSH tunneling to access resources that you cannot easily put a snapshot of
    into your dev environment. I recommend read-only access if you can do it, because
    if you need to do updates or deletes you should always work off a local copy


    *   TDD is a powerful yet still controversial tool that too many developers are
    still ignoring


    *   Automation is the key to really taking advantage of what you gain by going
    with TDD


    *   You need tools in place after deployment to see if your changes have had the
    desired effect


    ## 11 Continuous Integration Landscape For PHP Developers


    *This content originally appeared on my blog in 2010 and has been updated due
    to some changes in the tools themselves. I hope you find the information here
    helpful.*


    For those not familiar with the concept of [Continuous Integration](http://en.wikipedia.org/wiki/Continuous_integration),
    I can sum it up with one very glib phrase: it lets you break your code before
    you buy it. By this I mean, when combined with other programming practices like
    automated deployment and Test Driven Development, you get a chance to see if the
    code you’ve written \*today\* breaks anything you wrote \*yesterday\*.


    If I were to design a Continuous Integration (hereafter referred to as CI) system,
    what would it look like? Setting aside the one I use already (details on that
    later), I believe there are some key features it requires:


    *   Ability to integrate with your version control system


    *   Web interface for cross-platform access to results of build


    *   Ability to run your unit test suite and view the results


    *   Ability to deploy code wherever you want


    *   Ability to email results of test builds


    *   Must be able to automate all of this for you


    This is what I would call a non-trivial set of requirements.


    It also illustrates what became the biggest realization for me: you cannot have
    CI without writing tests (whether they are unit tests or integration tests), and
    you cannot have CI without the process of creating a “build” being triggered without
    any further action by the developer. Without a commitment to writing meaningful
    tests it definitely won’t work. It is my firm feeling that there \*is\* such a
    thing as pointless tests, and to me getting to 100% code coverage is often more
    about programmer ego.


    So, there are a few choices for PHP developers. You could use [phpUnderControl](http://phpundercontrol.org/),
    which is a plugin for [CruiseControl](http://cruisecontrol.sourceforge.net/),
    a Java-based tool. I took a look at it, saw all those XML configuration files
    and said “no thanks.” If you like screwing around with XML configuration files,
    then maybe this is the right tool for you. Me, I like my pointy-clicky interfaces.
    Or plain-text configuration files. Also targeted mostly at Java developers. My
    project was using PHP \*and\* Python, and needed to be able to support Java as
    well for a non-web project another developer was working on.'
  fmt: '

    # Testing Reflections


    See, I’m having problems deciding WHAT to test. Let’s take a look at one project
    for example. We have a [self-hosted web service](http://www.sportsdb.org/sd/sportscaster)
    that we released under the GPL that we not only use ourselves for some clients
    but also use it to troubleshoot things as well. In terms of writing tests, I believe
    the best way to approach this is to write tests that speak directly to the `Sportscaster`
    “engine” using a known set of parameters and ensure that the output we get back
    matches what we expect. Is unit testing overkill for this? Very hard to say because
    we have an HTML front end that talks to a “gateway” that talks to an “engine”.
    I’m not the one who architected this, but I do have to make sure that it works
    properly. In this case I believe that “your tests should verify your application
    is outputting what you expect it to” is the best approach. Comments about this
    are totally welcome.


    For another project, I tried something that [integrated Selenium with PHPUnit](http://sebastian-bergmann.de/archives/631-Integrating-PHPUnit-with-Selenium.html),
    but it was so slow as to be totally useless. [Sportso](http://www.sportso.com)
    is a very visual application, one that is written in PHP and talks to an [XML
    database](http://exist.sourceforge.net), but presentation is really the key here.
    We need to make sure that we’re placing the right data into our XML documents
    but that part of the application is solid. In this case, I wish to have tests
    that simulate a user clicking around the application and using it. Then I can
    compare output again and make sure that things are showing up when and where I
    expect them to. I’m thinking the `PHPUnit-Selenium` bridge is a bad idea, and
    that I should instead just focus on `Selenium`. Again, comments on how to best
    approach this are also welcome. I cannot believe that `Selenium` is really this
    slow, so there must be something I am doing wrong.


    Also, I’ve thought about continuous integration. This [incredibly inspiring post
    about continuous deployment](http://timothyfitz.wordpress.com/2009/02/10/continuous-deployment-at-imvu-doing-the-impossible-fifty-times-a-day/)
    has me really thinking hard about how my changes actually get pushed up out of
    dev to production. We don’t have the resources to use a cluster of machines that
    IMVU appears to have, but when you think of the infrastructure and (more importantly)
    the practices in place, you just have to be in awe of it all. Just the *scale*
    of it is inspiring. If they can do this, I can certainly implement a very effective
    subset of this. There is really no reason other than laziness on my part to not
    do it. Harsh reality, to be sure.


    But the real problem is the political game that you inevitably end up fighting
    over bringing in what is usually a very radical concept: a commitment to testing
    as part of the development process. Especially when the developers are severely
    outnumbered. A lot of people seem to have a pathological fear of automated testing,
    saying things like “we can just quickly test it by hand”. Then when you see the
    errors being reported by users of your products, you can’t help but wonder “could
    we have caught this earlier?” Unless it’s a very obscure error involving a race
    condition or something, of course the answer is YES.


    I read a post from one of the main developers at justin.tv talking about why he
    felt [unit testing is useless](http://abstractstuff.livejournal.com/60388.html).
    While he is entitled to his opinion I can’t help but think that he really is doing
    `TDD`, but he just refuses to acknowledge it. Yes, ultimately, your users are
    the only ones who can tell you if your application is spitting out errors. But
    if you aren’t doing any rigorous testing of stuff BEFORE your users see it, I
    think you are taking chances with your business. My company is small (just 7 of
    us) so I’m so close to most aspects of the business I can really see the impact
    of certain decisions on the bottom line of the company. It’s not about finding
    bugs, which is what the justin.tv folks claim never happens with unit testing.
    It’s about making sure those bugs never happen in the first place.


    I have to say that I’ve never really delved into the world of post-deployment
    monitoring, so maybe I should start asking a few more questions of people who
    deal with that sort of thing. Again, the key is to make it automated and have
    it report when it finds things that are wrong. We have a very good [nagios](http://en.wikipedia.org/wiki/Nagios)
    infrastructure at work that alerts us to problems with not only servers being
    down, but stale and/or missing data for our customers. I guess the next logical
    step is figuring out ways to look at that mountain of server logs and making sense
    of the errors? Definitely something to think about the next time I get stuck on
    some programming problem at work and need a change of pace.


    I know I’ve been rambling a bit here, so let me pull some of this stuff back together
    to make it more cohesive:

    *   `SSH` tunneling to access resources that you cannot easily put a snapshot
    of into your dev environment. I recommend read-only access if you can do it, because
    if you need to do updates or deletes you should always work off a local copy

    *   `TDD` is a powerful yet still controversial tool that too many developers
    are still ignoring

    *   Automation is the key to really taking advantage of what you gain by going
    with `TDD`

    *   You need tools in place after deployment to see if your changes have had the
    desired effect


    ## 11 Continuous Integration Landscape For PHP Developers


    *This content originally appeared on my blog in 2010 and has been updated due
    to some changes in the tools themselves. I hope you find the information here
    helpful.*


    For those not familiar with the concept of [Continuous Integration](http://en.wikipedia.org/wiki/Continuous_integration),
    I can sum it up with one very glib phrase: it lets you break your code before
    you buy it. By this I mean, when combined with other programming practices like
    automated deployment and Test Driven Development, you get a chance to see if the
    code you’ve written *today* breaks anything you wrote *yesterday*.


    If I were to design a Continuous Integration (hereafter referred to as `CI`) system,
    what would it look like? Setting aside the one I use already (details on that
    later), I believe there are some key features it requires:

    *   Ability to integrate with your version control system

    *   Web interface for cross-platform access to results of build

    *   Ability to run your unit test suite and view the results

    *   Ability to deploy code wherever you want

    *   Ability to email results of test builds

    *   Must be able to automate all of this for you


    This is what I would call a non-trivial set of requirements.


    It also illustrates what became the biggest realization for me: you cannot have
    `CI` without writing tests (whether they are unit tests or integration tests),
    and you cannot have `CI` without the process of creating a “build” being triggered
    without any further action by the developer. Without a commitment to writing meaningful
    tests it definitely won’t work. It is my firm feeling that there *is* such a thing
    as pointless tests, and to me getting to 100% code coverage is often more about
    programmer ego.


    So, there are a few choices for PHP developers. You could use [`phpUnderControl`](http://phpundercontrol.org/),
    which is a plugin for [`CruiseControl`](http://cruisecontrol.sourceforge.net/),
    a Java-based tool. I took a look at it, saw all those XML configuration files
    and said “no thanks.” If you like screwing around with XML configuration files,
    then maybe this is the right tool for you. Me, I like my pointy-clicky interfaces.
    Or plain-text configuration files. Also targeted mostly at Java developers. My
    project was using PHP *and* Python, and needed to be able to support Java as well
    for a non-web project another developer was working on.

    '
  trans: '

    # 测试反思


    你看，我在决定测试什么方面遇到问题。让我们以一个项目为例。我们有一个 [自托管 Web 服务](http://www.sportsdb.org/sd/sportscaster)，它在
    GPL 下发布，我们不仅自己为一些客户使用它，还用它来排查问题。就编写测试而言，我认为最好的方法是用一组已知参数直接针对 `Sportscaster` “引擎”
    编写测试，并确保返回的输出与我们预期的一致。对这种情况做单元测试是不是过度设计了？很难说，因为我们有一个 HTML 前端，它与“网关”通信，而“网关”又与“引擎”通信。我不是设计这个架构的人，但我必须确保它能正常工作。在这种情况下，我认为“你的测试应该验证应用程序输出的是你期望的内容”是最好的方法。对此的评论非常欢迎。


    对于另一个项目，我尝试了 [与 PHPUnit 集成 Selenium](http://sebastian-bergmann.de/archives/631-Integrating-PHPUnit-with-Selenium.html)，但速度慢到完全没用。[Sportso](http://www.sportso.com)
    是一个非常注重视觉的应用，它用 PHP 编写并与 [XML 数据库](http://exist.sourceforge.net) 通信，但在这里呈现才是关键。我们需要确保将正确的数据放入
    XML 文档中，但应用程序的这一部分是可靠的。在这种情况下，我希望有测试来模拟用户在应用程序中点击和使用。然后我可以再次比较输出，并确保事物在期望的时间和地点显示出来。我认为
    `PHPUnit-Selenium` 桥接是个坏主意，我应该只专注于 `Selenium`。再次强调，关于如何最好地处理此事的评论也非常欢迎。我不敢相信 `Selenium`
    真的会这么慢，所以一定是我做错了什么。


    另外，我也考虑过持续集成。这篇 [关于持续部署的极具启发性的文章](http://timothyfitz.wordpress.com/2009/02/10/continuous-deployment-at-imvu-doing-the-impossible-fifty-times-a-day/)
    让我认真思考我的更改是如何从开发环境推送到生产环境的。我们没有资源使用 IMVU 似乎拥有的机器集群，但当你想到基础设施（更重要的是）现有的实践时，你只能对这一切感到惊叹。仅仅是它的
    *规模* 就令人鼓舞。如果他们能做到这一点，我当然可以实现其中一个非常有效的子集。除了我自己的懒惰之外，真的没有任何理由不去做它。残酷的现实，毋庸置疑。


    但真正的问题是政治博弈，你不可避免地要为引入通常是一个非常激进的概念而斗争：把测试作为开发过程的一部分的承诺。尤其是在开发人员严重人手不足的情况下。很多人似乎对自动化测试有病态的恐惧，说着诸如“我们可以用手快速测试它”之类的话。然后当你看到用户报告的产品错误时，你不禁会想“我们本可以更早发现这个问题吗？”除非是一个涉及竞态条件之类的非常晦涩的错误，否则答案当然是肯定的。


    我读到 justin.tv 的一位主要开发者写的一篇文章，谈论他为什么认为 [单元测试毫无用处](http://abstractstuff.livejournal.com/60388.html)。虽然他有权持有自己的观点，但我忍不住认为他实际上是在做
    `TDD`，只是他拒绝承认这一点。是的，最终，只有你的用户才能告诉你你的应用程序是否在输出错误。但如果你在用户看到之前不对事物进行任何严格的测试，我认为你是在拿你的业务冒险。我的公司很小（只有我们
    7 个人），所以我非常接近业务的各个方面，我确实可以看到某些决策对公司底线的影响。这不是关于查找错误，这是 justin.tv 的人声称单元测试永远不会发生的事情。这是为了确保这些错误根本不会发生。


    我必须说，我从未真正深入研究过部署后监控的世界，所以也许我应该向处理这类事情的人多问几个问题。同样，关键是要使其自动化，并在发现问题时报告。我们在工作中有一个非常好的
    [nagios](http://en.wikipedia.org/wiki/Nagios) 基础设施，它会提醒我们服务器宕机以及客户数据陈旧和/或缺失的问题。我想下一步的逻辑是弄清楚如何查看那堆服务器日志并理解错误？下次我在工作中遇到编程问题需要换个思路时，绝对值得思考。


    我知道我在这里有点啰嗦，所以让我把这些内容重新整理一下，使其更连贯：

    *   `SSH` 隧道用于访问你无法轻松将其快照放入开发环境的资源。我建议如果可以的话使用只读访问，因为如果你需要进行更新或删除，你应该始终在本地副本上工作

    *   `TDD` 是一种强大但仍有争议的工具，太多开发人员仍在忽视它

    *   自动化是真正利用 `TDD` 所带来的好处的关键

    *   部署后你需要有工具来查看你的更改是否产生了预期效果


    ## 11 PHP 开发者的持续集成现状


    *本文最初于 2010 年发表在我的博客上，并因工具本身的一些变化而进行了更新。我希望这里的信息对你有所帮助。*


    对于不熟悉 [持续集成](http://en.wikipedia.org/wiki/Continuous_integration) 概念的人，我可以用一句话概括：它让你在购买前就破坏你的代码。我的意思是，当与其他编程实践如自动化部署和测试驱动开发结合时，你有机会看到你今天编写的代码是否破坏了你昨天编写的内容。


    如果我要设计一个持续集成（以下简称 `CI`）系统，它会是什么样子？撇开我已经在使用的那个系统不谈（稍后会详细介绍），我认为它需要一些关键特性：

    *   能够与你的版本控制系统集成

    *   跨平台访问构建结果的 Web 界面

    *   能够运行你的单元测试套件并查看结果

    *   能够将代码部署到任何你想要的地方

    *   能够通过电子邮件发送测试构建结果

    *   必须能够为你自动化所有这些操作


    我称之为一套不平凡的需求。


    它也说明了我最大的领悟：你不能没有编写测试（无论是单元测试还是集成测试）就拥有 `CI`，你也不能在没有开发者进一步操作的情况下触发创建“构建”的过程而拥有
    `CI`。如果没有对编写有意义测试的承诺，它肯定不会奏效。我坚信确实存在无意义的测试，而且对我来说，达到 100% 代码覆盖率往往更多的是程序员的自我表现。


    因此，PHP 开发者有几个选择。你可以使用 [`phpUnderControl`](http://phpundercontrol.org/)，它是一个 [`CruiseControl`](http://cruisecontrol.sourceforge.net/)
    的插件，后者是一个基于 Java 的工具。我看了一下，看到所有那些 XML 配置文件就说“算了”。如果你喜欢摆弄 XML 配置文件，那么这可能就是适合你的工具。我喜欢我的点选式界面。或纯文本配置文件。还主要针对
    Java 开发者。我的项目使用 PHP *和* Python，并且还需要能够支持 Java，因为另一位开发者正在进行一个非 Web 项目。

    '
