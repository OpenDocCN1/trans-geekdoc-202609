    ## 13 Fear is the mind-killer


    *This content orginally appeared on my blog in March 2011. It discusses how fear
    can prevent you from doing the necessary work to make your applications easy to
    test. Hope you enjoy it*


    Dune is probably my favourite science-fiction novel of all time. It’s in a cool
    setting, with some really well-designed characters, and is a sprawling epic in
    the way that sprawling epics should be. In that book, the main character Paul
    Atreides learns the ways of the mysterious Bene Gesserit through his mother. One
    of the things he learns is called the *litany against fear*, something they say
    to themselves whenever they are in danger:


    > *I must not fear.* Fear is the mind-killer. Fear is the little-death that brings
    total obliteration. I will face my fear. I will permit it to pass over me and
    through me. And when it has gone past I will turn the inner eye to see its path.
    Where the fear has gone there will be nothing. Only I will remain.


    Living on the bleeding edge of technology means you spend a lot of time trying
    to convince the people around you that this awesome bit of technology that you’ve
    noticed is worth investigating. I remember being mocked and dismissed over my
    thoughts on [memcached](http://www.memcached.org/) in 2003. And being mocked and
    dismissed on my thoughts on how valuable writing automated tests could be for
    an out-of-control code base in 2004. It’s now 2011 and both of those things are
    considered integral parts of best practices for web applications.


    Some of the problems I faced were due to an abrasive personality very early in
    my programming career (although some would argue that not much has changed) that
    resulted in ideas being rejected because of who the messenger was. Let’s be honest,
    we’ve all done that: dismissed information because of who was delivering it. I’ve
    gotten used to facing the uphill battle to get my particular set of programming
    practices accepted but it is a battle I’m winning.

    '
  trans: '

    你最终会发现你的开发人员都拥有略有不同的环境，这源于他们对软件包来源的选择或对组件版本偏好的不同。我通过自定义的 Homebrew 配方安装了 PHP 5.3.8，而我的其中一位同事则使用随
    OS-X Snow Leopard 提供的标准版 PHP。他使用的 MySQL 版本比我的还领先两个版本。看到多么容易不同步了吗？


    你有两个选择。第一个是专制的方案，即强制所有人使用相同的操作系统和相同的工具，以最大程度减少开发环境冲突的可能性。考虑到这会导致开发人员不满，我更倾向于一种更理性的做法：使用像
    [VMWare](http://www.vmware.com) 或 [VirtualBox](http://www.virtualbox.org) 这样的工具，让你的开发人员在完全相同的虚拟机上工作，同时给予他们自由选择自己喜爱的开发和调试工具的权利。


    此外，通过使用虚拟机，你可以鼓励开发人员大胆尝试并测试一些破坏性的操作，比如库升级或数据库变更。搞砸了？只需启动一台新的虚拟机再试一次。当你将其与良好的版本控制实践结合起来时，你应该能更快地从错误中恢复。


    只要确保花时间创建尽可能与生产系统完全一致的虚拟机。老实说，你的开发环境和生产环境之间的唯一区别应该是应用程序所操作的数据。甚至在自己的电脑上创建一个虚拟机集群来模拟包含应用服务器、数据库服务器和
    memcached 服务器的架构，也并不算太难。


    这也有助于让新开发人员快速上手。“哦，在做 Project Alpha？我会把 wiki 上可以下载该项目虚拟机的链接发给你。”


    查看 [Vagrant](http://vagrantup.com) ，这对希望在虚拟机中工作的开发人员来说是一个很棒的选择。


    因此，在为你的开发环境注入了一些结构之后，基础设施债务像购物狂的信用卡账单一样堆积的最后一个前沿领域就是：部署流程。


    我真的认为有一条规则：如果你的部署不能用一条命令完成，那么你就是做错了。如果你能把你在 shell 中执行的命令输入进去，那么你就可以把它们脚本化，这样就不用再重复输入了。如果你能脚本化部署，那么你就能自动化部署。如果你能自动化部署，那么你现在就拥有了一个一致且可重复的过程，每次部署时都会以相同的方式运行。


    在 [Moontoast](http://www.moontoast.com) ，我们已经实现了自动化部署。当我们将代码合并到 staging 和 production
    分支时，版本控制钩子会触发我们的部署工具。它会将代码检出到生产服务器上的正确位置。它运行需要执行的数据库迁移。它启动并重启应用程序使用的各种服务。简而言之，它做了我看到太多同事手动执行的事情。停止吧。通过让部署代码的过程成为一件无关紧要的事来清理你的基础设施债务。


    如果你想自动化你的部署流程，可以研究一下像 [Capistrano](https://github.com/capistrano/capistrano/wiki)
    或 [Phing](http://www.phing.info/trac/) 这样的工具，甚至可以使用像 [Jenkins](http://jenkins-ci.org)
    这样的工具，并利用其 Builds 的概念来自动化将最新代码变更推向生产的过程。


    注意我说的是流程，因为技术债务可能意味着你的应用程序足够脆弱（没有足够的测试和/或测试覆盖率），以至于你所做的更改可能会导致其行为不当甚至完全崩溃系统。这感觉并不好，所以通过投入时间自动化你的部署流程，你至少可以消除一个头痛的问题。


    我认为关于基础设施债务我想要传达的主要观点是，你真的需要审视超出单纯编码的流程。如果你发现自己不断在打“在我电脑上能运行”的仗，你很可能有严重的基础设施债务。如果你发现自己每次部署时都不断参考检查清单，你很可能有严重的基础设施债务。


    每当我提起这个话题时，我听到的借口很多都与我倡导编写测试并自动化执行这些测试时听到的借口相同。人们为什么会对这类事情如此抵触？


    我发现人们严重低估了完成一项任务所需的手工工作量。对很多人来说，是对失去控制的恐惧导致他们得出自动化部署不可信的结论，或者开发人员不应该有自由选择用于构建应用程序的工具。


    技术债务是真实存在的，毫无疑问。但基础设施债务也是如此。就像在生产环境中发现 bug 的成本高于在开发环境中发现一样，修复基础设施债务的成本也越来越高。只要想想消除开发环境之间不一致性所解决的大量问题。再加上在手动部署应用程序时消除人为错误的能力。你为什么不想要这个呢？


    开始偿还基础设施债务的决定并不容易，因为它通常需要许多人做出许多改变。大多数程序员都是习惯性动物，即使改变明显更好，他们也不喜欢改变。不要害怕改变，要害怕债务在你的代码库和基础设施中不断增长。它不会消失，也没有政府救助即将到来修复它。


