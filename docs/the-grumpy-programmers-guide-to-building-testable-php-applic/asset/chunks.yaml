    \ PHPUnit_Framework_TestCase\n{\n\n    public function testAlphaMunge()\n    {\n\
    \        $mockFoo = $this->getMockBuilder('Foo')\n            ->disableOriginalConstructor()\n\
    \            ->getMock();\n        $mockFoo->expects($this->atLeastOnce())\n \
    \           ->method('getDetails')\n            ->will($this->returnValue('1->2'));\n\
    \        $mockFoo->expects($this->atLeastOnce())\n            ->method('getId')\n\
    \            ->will($this->returnValue('1'));\n\n        // More test fun to come\n\
    \    }\n}\n```\n\nWhen you build a mock for use in your test, you generally have\
    \ to do two things:\n\n*   create a mock of the object itself\n\n*   tell it what\
    \ to do when specific methods are called\n\nWhat I’ve done here is pretty standard\
    \ EXCEPT for the use of that `disableOriginalConstructor()` method. Why is it\
    \ used? Well, sometimes when you are creating a mock of an object it will often\
    \ have a constructor that accepts parameters. I’m not testing to see if we can\
    \ create the object, I am merely trying to simulate some of the methods of that\
    \ object.\n\nOnce I’ve created the mock of the object, I then tell it what to\
    \ do when I make certain method calls. Clearly I’ve just pulled some arbitrary\
    \ values out of my ass for this example, but usually you can figure out what some\
    \ reasonable return values are supposed to be by, you know, actually looking at\
    \ the code you are mocking.\n\nSo what does our `Bar` object look like?\n\n```php\n\
    <?php\nclass Bar\n{\n    // Same drill, no need to show constructor details\n\
    \    \n    public function getStartDate()\n    {\n        return $this->_startDate;\n\
    \    }\n\n    public function getEndDate()\n    {\n        return $this->_endDate;\n\
    \    }\n}\n```\n\nTime to add a mock `Bar` to our test\n\n```php\n<?php\nclass\
    \ Test extends PHPUnit_Framework_TestCase\n{\n    public function testAlphaMunge()\n\
    \    {\n        $mockFoo = $this->getMockBuilder('Foo')\n            ->disableOriginalConstructor()\n\
    \            ->getMock();\n        $mockFoo->expects($this->atLeastOnce())\n \
    \           ->method('getDetails')\n            ->will($this->returnValue('1->2'));\n\
    \        $mockFoo->expects($this->atLeastOnce())\n            ->method('getId')\n\
    \            ->will($this->returnValue('1'));\n\n        $mockBar = $this->getMockBuilder('Bar')\n\
    \            ->disableOriginalConstructor()\n            ->getMock();\n      \
    \  $mockBar->expects($this->atLeastOnce())\n            ->method('getStartDate')\n\
    \            ->will($this->returnValue('2012-03-27'));\n        $mockBar->expects($this->atLeastOnce())\n\
    \            ->method('getEndDate')\n            ->will($this->returnValue('2012-04-09'));\n\
    \n        // More test fun to come\n    }\n}\n```\n\nA quick note about `$this->atLeastOnce()`:\
    \ when you mock the objects you can tell it how often you expect that method to\
    \ be called. I had a long discussion about this with our testing engineer Will\
    \ Parker after I posted the orginal version of this post.\n\nWe have multiple\
    \ options\n\n*   `$this->once()` - should be used only when you REALLY want that\
    \ method to be called once\n\n*   `$this->atLeastOnce()` - should be used when\
    \ you need to do it once but aren’t sure how many times\n\n*   `$this->any()`\
    \ - you really don’t care how many times it’s called\n\nIf you’re lazy, you’ll\
    \ go with `$this->any()` so you don’t have to worry about it. After a discussion\
    \ with Will, I have come to like the use of `$this->atLeastOnce()`. It’s not a\
    \ deal-breaker no matter which one you choose, a lot of it comes down to personal\
    \ preferences.\n\nSo now we have our two objects mocked. Now we can go back to\
    \ our test and add in the creation of our `Alpha` class, inject the two mocks\
    \ into the method we are testing, and check for expected results.\n"
  trans: "\n你会把项目押在别人写的复杂代码上，而这段代码你根本无法测试吗？也许我看问题的角度不对，因为我身处框架创建者的文化中，但我实在看不出为什么你不愿意提供测试来证明你的东西确实如你所说那样工作。测试证明代码的行为符合你的预期，而且可测试的代码通常也更容易随着时间的推移进行修改。在修改代码、运行单元测试，然后发现自己没有破坏任何东西时，有一种病态的愉悦感。\n\
    \n## 15 元测试：理解模拟对象\n\n*本文最初于 2012 年 3 月发表在我的博客上。*\n\n在 [卡普兰专业](http://kaplanprofessional.com)\
    \ 工作时，我很快学会欣赏的一件事就是非常庞大的单元测试和集成测试套件。我相信有 2000 多个测试，虽然代码覆盖率有所下降，但看到大多数项目的覆盖率仍在\
    \ 65%以上，仍然令人印象深刻。我们很快就会把它恢复到应有的水平。\n\n拥有如此庞大的测试阵列，我接受了关于编写真正认真对待单元测试的实时生产就绪代码的单元测试的真正含义的教育。我认为大多数开发者在进入测试驱动开发时遇到的最大问题是不理解如何高效地使用模拟对象。\n\
    \n如果你真的按照正确的方式编写单元测试，每个测试都专注于孤立地测试一个功能点，这意味着你将严重依赖模拟对象来使事情正常工作。我想出了一个示例场景，希望能很好地解释如何有效地使用模拟对象。\n\
    \n在这些示例中，我使用的是 `PHPUnit` 的 [内置支持](http://www.phpunit.de/manual/3.0/en/mock-objects.html)\
    \ 来进行模拟对象。在 Kaplan，我们的测试工程师告诉我他曾尝试使用 [`Mockery`](https://github.com/padraic/mockery)\
    \ ，但在使其与正在使用的依赖注入容器良好配合时遇到了问题（它是一个定制的 [`Pimple`](http://pimple.sensiolabs.org)\
    \ 版本）。对此无法反驳。除非我自己尝试 `Mockery`，看看它是否比使用 `PHPUnit` 自带的功能带来任何好处。\n\n所以这是我们的场景：我们有一个名为\
    \ `Alpha` 的类，其中包含一个名为 `munge()` 的方法。我们希望在单元测试中测试该方法。这个类看起来是什么样子的？\n\n```php\n\
    <?php\n\nclass Alpha\n{\n    // Omit code showing constructor...\n\n    public\
    \ function munge(Foo $foo, Bar $bar)\n    {\n        $fooDetails = $foo->getDetails();\n\
    \        $fooId = $foo->getId();\n\n        $barStartDate = $bar->getStartDate();\n\
    \        $barEndDate = $bar->getEndDate();\n\n        $source = \"{$fooId}|{$fooDetails}|{$barStartDate}|{$barEndDate}\"\
    ;\n        \n        return md5('rocksalt' . $source);\n    }\n}\n```\n\n我那爱挑剔的测试员眼光一看就立刻说“我们需要模拟那些\
    \ `Foo` 和 `Bar` 对象才能让这个测试工作。”首先我们需要看看 `Foo` 对象：\n\n```php\n<?php\nclass Foo \n\
    {\n    // Omit code showing how we construct a Foo object\n\n    public function\
    \ getId()\n    {\n        return $this->_id;\n    }\n\n    public function getDetails()\n\
    \    {\n        $tree = $this->_tree;\n        $branch = $this->_branch;\n\n \
    \       return $tree . '->' . $branch;\n    }\n}\n```\n\n看起来这个类代表系统中一个“`Foo`”对象。我省略了构造函数，因为它对我试图传授的课程来说并不重要。让我们假设我们可以通过某种映射器生成一个\
    \ `Foo` 对象。\n\n我们的 `Alpha->munge()` 方法期望传入一个 `Foo` 对象，并通过 `getDetails()` 和 `getId()`\
    \ 调用检索信息。让我们开始我们的测试并模拟它。\n\n```php\n<?php\nclass Test extends PHPUnit_Framework_TestCase\n\
    {\n\n    public function testAlphaMunge()\n    {\n        $mockFoo = $this->getMockBuilder('Foo')\n\
    \            ->disableOriginalConstructor()\n            ->getMock();\n      \
    \  $mockFoo->expects($this->atLeastOnce())\n            ->method('getDetails')\n\
    \            ->will($this->returnValue('1->2'));\n        $mockFoo->expects($this->atLeastOnce())\n\
    \            ->method('getId')\n            ->will($this->returnValue('1'));\n\
    \n        // More test fun to come\n    }\n}\n```\n\n当你为测试构建模拟对象时，通常需要做两件事：\n\n\
    *   创建对象本身的模拟\n\n*   告诉它在调用特定方法时该做什么\n\n我在这里做的事情相当标准，除了使用 `disableOriginalConstructor()`\
    \ 方法。为什么使用它呢？好吧，有时当你创建对象的模拟时，它通常会有接受参数的构造函数。我不是在测试是否可以创建对象，我只是试图模拟该对象的某些方法。\n\n\
    一旦我创建了对象的模拟，我就会告诉它在进行某些方法调用时该做什么。很明显，我只是为这个示例随意编造了一些值，但通常你可以通过，嗯，实际查看你正在模拟的代码来弄清楚一些合理的返回值应该是什么。\n\
    \n那么我们的 `Bar` 对象看起来是什么样子的？\n\n```php\n<?php\nclass Bar\n{\n    // Same drill,\
    \ no need to show constructor details\n    \n    public function getStartDate()\n\
    \    {\n        return $this->_startDate;\n    }\n\n    public function getEndDate()\n\
    \    {\n        return $this->_endDate;\n    }\n}\n```\n\n是时候在我们的测试中添加一个模拟 `Bar`\
    \ 了\n\n```php\n<?php\nclass Test extends PHPUnit_Framework_TestCase\n{\n    public\
    \ function testAlphaMunge()\n    {\n        $mockFoo = $this->getMockBuilder('Foo')\n\
    \            ->disableOriginalConstructor()\n            ->getMock();\n      \
    \  $mockFoo->expects($this->atLeastOnce())\n            ->method('getDetails')\n\
    \            ->will($this->returnValue('1->2'));\n        $mockFoo->expects($this->atLeastOnce())\n\
    \            ->method('getId')\n            ->will($this->returnValue('1'));\n\
    \n        $mockBar = $this->getMockBuilder('Bar')\n            ->disableOriginalConstructor()\n\
    \            ->getMock();\n        $mockBar->expects($this->atLeastOnce())\n \
    \           ->method('getStartDate')\n            ->will($this->returnValue('2012-03-27'));\n\
    \        $mockBar->expects($this->atLeastOnce())\n            ->method('getEndDate')\n\
    \            ->will($this->returnValue('2012-04-09'));\n\n        // More test\
    \ fun to come\n    }\n}\n```\n\n关于 `$this->atLeastOnce()` 的快速说明：当你模拟对象时，你可以告诉它你期望该方法被调用的次数。我在发布这篇文章的原始版本后，与我们的测试工程师\
    \ Will Parker 就此进行了长时间的讨论。\n\n我们有多个选项\n\n*   `$this->once()` - 只有当你真的希望该方法只被调用一次时才应使用\n\
    \n*   `$this->atLeastOnce()` - 当你需要它被调用一次但不确定调用次数时应使用\n\n*   `$this->any()` -\
    \ 你真的不在乎它被调用多少次\n\n如果你很懒，你会选择 `$this->any()`，这样就不用担心了。与 Will 讨论后，我开始喜欢使用 `$this->atLeastOnce()`。无论你选择哪一个，都不是决定性的，很多时候取决于个人偏好。\n\
    \n所以现在我们已经模拟了这两个对象。现在我们可以回到测试中，添加我们 `Alpha` 类的创建，将两个模拟对象注入到我们正在测试的方法中，并检查预期结果。\n"
