- raw: "So what is really the point? The point is that by sticking to these rules\
    \ as much as you can, you will reduce the friction when making changes to your\
    \ code and also make it easier to test, since you will be able to use mock objects\
    \ when really trying to test components in isolation.\n\nHowever, one of the downsides\
    \ of really embracing the Law of Demeter is that you will find yourself writing\
    \ a lot of “wrapper code”, code that takes what was passed to it and then hands\
    \ it off to some other function or object for processing.\n\nHow can we stay on\
    \ the positive side of LoD? It’s quite simple: we use Dependency Injection (hereafter\
    \ DI) to pass in the various objects and values that our classes need to get the\
    \ job done and don’t force them to assume anything about the dependencies we give\
    \ them except their public interfaces.\n\nThe method I prefer to use is called\
    \ Constructor Injection. Typically I will create a constructor for my object that\
    \ accepts all the dependencies it will require. This is easily accomplished by\
    \ creating a \\_\\_construct() method for your class. I think some code examples\
    \ are in order.\n\nIn our sample application, we are using two types of object\
    \ to interact with our data source. A Model object that provides a representation\
    \ of a single record in our database and a Data Mapper object that speaks to our\
    \ data source and in turn creates Model objects.\n\nNow, if I wasn’t concerned\
    \ about testability I would create one big object that performed all that functionality\
    \ for me. I’d create a connection to my database in the constructor and then write\
    \ methods that talk to the database and send me back the results I want. Makes\
    \ sense, right? Not from a testing perspective.\n\nIf we apply the Law of Demeter\
    \ here, by the rules our Model doesn’t need to know anything about a Mapper except\
    \ how to use it. That way we are free to do things like provide mock Mappers if\
    \ we really want to get down and dirty about testing things.\n\nSo what if I want\
    \ to test things out? If I’ve hard-coded the details and creation of my DB connection\
    \ in the constructor for my Mapper, then I cannot run any tests on a database\
    \ dedicated just to testing. Here’s a test showing why just a sprinkling of DI\
    \ lets you easily test your code.\n\n```\n<?php\n\ninclude 'test_bootstrap.php';\n\
    \nclass FranchiseModelTest extends \\PHPUnit_Framework_TestCase\n{\n    protected\
    \ $_conn;\n\n    public function setUp()\n    {\n        $this->_conn = new PDO(\n\
    \            'pgsql:host=localhost;dbname=ibl_stats', \n            'stats', \n\
    \            'st@ts=Fun'\n        ); \n    }\n\n    ...\n\n    public function\
    \ testSaveUpdatesDatabase()\n    {\n        $mapper = new IBL\\FranchiseMapper($this->_conn);\n\
    \        $franchise = new IBL\\Franchise();\n        $franchise->setId(25);\n\
    \        $franchise->setNickname('TST');\n        $franchise->setName('Test Team');\n\
    \        $franchise->setConference('Conference');\n        $franchise->setDivision('Division');\n\
    \        $franchise->setIp(0);\n        $mapper->save($franchise);\n\n       \
    \ // Update existing model\n        $franchise->setIp(35);\n        $mapper->save($franchise);\n\
    \        \n        // Reload Franchise record and compare them\n        $franchise2\
    \ = $mapper->findById($franchise->getId());\n        $this->assertEquals(35, $franchise2->getIp());\n\
    \n        // Clean up the franchise\n        $mapper->delete($franchise);\n  \
    \  }\n}\n```\n\nThis makes sense, right? Our Mapper doesn’t need to know the details\
    \ of creating a connection to the data source. It just needs to know that it has\
    \ been given a connection to use.\n\nTo further see this at work, you can even\
    \ look at the save() method for FranchiseMapper.\n\n```\n<?php\n\nnamespace IBL;\n\
    \nclass FranchiseMapper\n{\n    protected $_conn;\n    protected $_map = array();\n\
    \n    ...\n\n    public function save(\\IBL\\Franchise $franchise)\n    {\n  \
    \      if ($this->findById($franchise->getId())) {\n            $this->_update($franchise);\
    \ \n        } else {\n            $this->_insert($franchise); \n        }\n  \
    \  }\n\n    protected function _insert(\\IBL\\Franchise $franchise) \n    {\n\
    \        try {\n            $sql = \"\n                INSERT INTO franchises\
    \ \n                (nickname, name, conference, division, ip, id) \n        \
    \        VALUES(?, ?, ?, ?, ?, ?)\";\n            $sth = $this->_conn->prepare($sql);\n\
    \            $binds = array(\n                $franchise->getNickname(),\n   \
    \             $franchise->getName(),\n                $franchise->getConference(),\n\
    \                $franchise->getDivision(),\n                $franchise->getIp(),\n\
    \                $franchise->getId()\n            );\n            $sth->execute($binds);\n\
    \        } catch(\\PDOException $e) {\n            echo \"A database problem occurred:\
    \ \" . $e->getMessage(); \n        }\n    }\n\n    protected function _update(\\\
    IBL\\Franchise $franchise)\n    {\n        try {\n            $sql = \"\n    \
    \            UPDATE franchises \n                SET nickname = ?, \n        \
    \        name = ?, \n                conference = ?, \n                division\
    \ = ?, \n                ip = ? \n                WHERE id = ?\";\n          \
    \  $sth = $this->_conn->prepare($sql);\n            $fields = array(\n       \
    \         'nickname', \n                'name', \n                'conference',\
    \ \n                'division', \n                'ip', \n                'id'\n\
    \            );\n            $binds = array();\n\n            foreach ($fields\
    \ as $fieldName) {\n                $field = $this->_map[$fieldName];\n      \
    \          $getProp = (string)$field->accessor;\n                $binds[] = $franchise->{$getProp}();\n\
    \            }\n\n            $sth->execute($binds);\n        } catch(\\PDOException\
    \ $e) {\n            echo \"A database problem occurred: \" . $e->getMessage();\
    \ \n        }\n    }\n}\n```\n\nAgain, we’re telling our methods that “hey, here’s\
    \ an item that you need to use” and it knows only how to use it, not what the\
    \ internals look like.\n\nHere’s a scenario that might make more sense of how\
    \ to refactor code with some help from LoD and DI.\n\nImagine you’re creating\
    \ your own framework and you are writing an Access Control Layer (ACL for short)\
    \ component. For those not familiar with the idea, ACLs take a look at the resource\
    \ you are trying to access and compare it to the user level you currently have,\
    \ then tells you whether or not that user can access that resource. It might look\
    \ something like this:\n\n```\n<?php\n\nnamespace Grumpy;\n\nclass Acl {\n   \
    \ protected $_acls;\n\n    ...\n\n    public function accessAllowed()\n    {\n\
    \        $request = \\Grumpy\\Context::getRequest();\n\n        return ($this->_acls[$request->getUri()]\
    \ >= $_SESSION['user_level']); \n    }\n        \n}\n\n// Meanwhile inside your\
    \ controller\n\n$acl = new \\Grumpy\\Acl();\n\nif (!$acl->accessAllowed()) {\n\
    \    \\Grumpy\\View::render('access_denied.tmpl');\n} else {\n    \\Grumpy\\View::render('show_stolen_cc.tmpl');\n\
    }\n```\n\nWe’re pulling in our request object via a static method call, and we’re\
    \ getting user info right out of the session. Very common coding practices but\
    \ not testable at all. Let’s clean this up a bit.\n\n```\n<?php\n\nnamespace Grumpy;\n\
    \nclass Acl {\n    protected $_acls;\n    protected $_request;\n    protected\
    \ $_userLevel;\n    \n    ...\n\n    public function __construct($request, $userLevel)\n\
    \    {\n        ...\n\n        $this->_request = $request;\n        $this->_userLevel\
    \ = $userLevel;\n    }\n\n    ...\n\n    public function accessAllowed()\n   \
    \ {\n        return ($this->_acls[$this->_request->getUri()] \n            >=\
    \ $this->_userLevel); \n    }\n        \n}\n\n// Meanwhile inside your controller\n\
    \n$acl = new \\Grumpy\\Acl($this->request, $_SESSION['user_level']);\n\nif (!$acl->accessAllowed())\
    \ {\n    \\Grumpy\\View::render('access_denied.tmpl');\n} else {\n    \\Grumpy\\\
    View::render('show_stolen_cc.tmpl');\n}\n```\n\nNow that you’ve learned about\
    \ how to use Constructor Injection to pass dependencies into your objects, we\
    \ can explore cranking up the power level through the use of [Dependency Injection\
    \ Containers](http://fabien.potencier.org/article/12/do-you-need-a-dependency-injection-container),\
    \ hereafter referred to as a DIC."
  fmt: "\n# Law of Demeter 与 Dependency Injection\n\n## The Point of Following the\
    \ Rules\n\nSo what is really the point? The point is that by sticking to these\
    \ rules as much as you can, you will reduce the friction when making changes to\
    \ your code and also make it easier to test, since you will be able to use mock\
    \ objects when really trying to test components in isolation.\n\n## Downsides\
    \ of Embracing Law of Demeter\n\nHowever, one of the downsides of really embracing\
    \ the Law of Demeter is that you will find yourself writing a lot of “wrapper\
    \ code”, code that takes what was passed to it and then hands it off to some other\
    \ function or object for processing.\n\n## Staying on the Positive Side with Dependency\
    \ Injection\n\nHow can we stay on the positive side of `LoD`? It’s quite simple:\
    \ we use Dependency Injection (hereafter `DI`) to pass in the various objects\
    \ and values that our classes need to get the job done and don’t force them to\
    \ assume anything about the dependencies we give them except their public interfaces.\n\
    \n## Constructor Injection\n\nThe method I prefer to use is called Constructor\
    \ Injection. Typically I will create a constructor for my object that accepts\
    \ all the dependencies it will require. This is easily accomplished by creating\
    \ a `__construct()` method for your class. I think some code examples are in order.\n\
    \n## Sample Application: Model and Data Mapper\n\nIn our sample application, we\
    \ are using two types of object to interact with our data source. A `Model` object\
    \ that provides a representation of a single record in our database and a Data\
    \ Mapper object that speaks to our data source and in turn creates `Model` objects.\n\
    \nNow, if I wasn’t concerned about testability I would create one big object that\
    \ performed all that functionality for me. I’d create a connection to my database\
    \ in the constructor and then write methods that talk to the database and send\
    \ me back the results I want. Makes sense, right? Not from a testing perspective.\n\
    \nIf we apply the Law of Demeter here, by the rules our `Model` doesn’t need to\
    \ know anything about a `Mapper` except how to use it. That way we are free to\
    \ do things like provide mock `Mappers` if we really want to get down and dirty\
    \ about testing things.\n\n## Testing with Dependency Injection\n\nSo what if\
    \ I want to test things out? If I’ve hard-coded the details and creation of my\
    \ DB connection in the constructor for my `Mapper`, then I cannot run any tests\
    \ on a database dedicated just to testing. Here’s a test showing why just a sprinkling\
    \ of `DI` lets you easily test your code.\n\n```php\n<?php\n\ninclude 'test_bootstrap.php';\n\
    \nclass FranchiseModelTest extends \\PHPUnit_Framework_TestCase\n{\n    protected\
    \ $_conn;\n\n    public function setUp()\n    {\n        $this->_conn = new PDO(\n\
    \            'pgsql:host=localhost;dbname=ibl_stats', \n            'stats', \n\
    \            'st@ts=Fun'\n        ); \n    }\n\n    ...\n\n    public function\
    \ testSaveUpdatesDatabase()\n    {\n        $mapper = new IBL\\FranchiseMapper($this->_conn);\n\
    \        $franchise = new IBL\\Franchise();\n        $franchise->setId(25);\n\
    \        $franchise->setNickname('TST');\n        $franchise->setName('Test Team');\n\
    \        $franchise->setConference('Conference');\n        $franchise->setDivision('Division');\n\
    \        $franchise->setIp(0);\n        $mapper->save($franchise);\n\n       \
    \ // Update existing model\n        $franchise->setIp(35);\n        $mapper->save($franchise);\n\
    \        \n        // Reload Franchise record and compare them\n        $franchise2\
    \ = $mapper->findById($franchise->getId());\n        $this->assertEquals(35, $franchise2->getIp());\n\
    \n        // Clean up the franchise\n        $mapper->delete($franchise);\n  \
    \  }\n}\n```\n\nThis makes sense, right? Our `Mapper` doesn’t need to know the\
    \ details of creating a connection to the data source. It just needs to know that\
    \ it has been given a connection to use.\n\n## FranchiseMapper save() Method\n\
    \nTo further see this at work, you can even look at the `save()` method for `FranchiseMapper`.\n\
    \n```php\n<?php\n\nnamespace IBL;\n\nclass FranchiseMapper\n{\n    protected $_conn;\n\
    \    protected $_map = array();\n\n    ...\n\n    public function save(\\IBL\\\
    Franchise $franchise)\n    {\n        if ($this->findById($franchise->getId()))\
    \ {\n            $this->_update($franchise); \n        } else {\n            $this->_insert($franchise);\
    \ \n        }\n    }\n\n    protected function _insert(\\IBL\\Franchise $franchise)\
    \ \n    {\n        try {\n            $sql = \"\n                INSERT INTO franchises\
    \ \n                (nickname, name, conference, division, ip, id) \n        \
    \        VALUES(?, ?, ?, ?, ?, ?)\";\n            $sth = $this->_conn->prepare($sql);\n\
    \            $binds = array(\n                $franchise->getNickname(),\n   \
    \             $franchise->getName(),\n                $franchise->getConference(),\n\
    \                $franchise->getDivision(),\n                $franchise->getIp(),\n\
    \                $franchise->getId()\n            );\n            $sth->execute($binds);\n\
    \        } catch(\\PDOException $e) {\n            echo \"A database problem occurred:\
    \ \" . $e->getMessage(); \n        }\n    }\n\n    protected function _update(\\\
    IBL\\Franchise $franchise)\n    {\n        try {\n            $sql = \"\n    \
    \            UPDATE franchises \n                SET nickname = ?, \n        \
    \        name = ?, \n                conference = ?, \n                division\
    \ = ?, \n                ip = ? \n                WHERE id = ?\";\n          \
    \  $sth = $this->_conn->prepare($sql);\n            $fields = array(\n       \
    \         'nickname', \n                'name', \n                'conference',\
    \ \n                'division', \n                'ip', \n                'id'\n\
    \            );\n            $binds = array();\n\n            foreach ($fields\
    \ as $fieldName) {\n                $field = $this->_map[$fieldName];\n      \
    \          $getProp = (string)$field->accessor;\n                $binds[] = $franchise->{$getProp}();\n\
    \            }\n\n            $sth->execute($binds);\n        } catch(\\PDOException\
    \ $e) {\n            echo \"A database problem occurred: \" . $e->getMessage();\
    \ \n        }\n    }\n}\n```\n\nAgain, we’re telling our methods that “hey, here’s\
    \ an item that you need to use” and it knows only how to use it, not what the\
    \ internals look like.\n\n## Refactoring Example: Access Control Layer\n\nHere’s\
    \ a scenario that might make more sense of how to refactor code with some help\
    \ from `LoD` and `DI`.\n\nImagine you’re creating your own framework and you are\
    \ writing an Access Control Layer (`ACL` for short) component. For those not familiar\
    \ with the idea, `ACLs` take a look at the resource you are trying to access and\
    \ compare it to the user level you currently have, then tells you whether or not\
    \ that user can access that resource. It might look something like this:\n\n```php\n\
    <?php\n\nnamespace Grumpy;\n\nclass Acl {\n    protected $_acls;\n\n    ...\n\n\
    \    public function accessAllowed()\n    {\n        $request = \\Grumpy\\Context::getRequest();\n\
    \n        return ($this->_acls[$request->getUri()] >= $_SESSION['user_level']);\
    \ \n    }\n        \n}\n\n// Meanwhile inside your controller\n\n$acl = new \\\
    Grumpy\\Acl();\n\nif (!$acl->accessAllowed()) {\n    \\Grumpy\\View::render('access_denied.tmpl');\n\
    } else {\n    \\Grumpy\\View::render('show_stolen_cc.tmpl');\n}\n```\n\nWe’re\
    \ pulling in our request object via a static method call, and we’re getting user\
    \ info right out of the session. Very common coding practices but not testable\
    \ at all. Let’s clean this up a bit.\n\n```php\n<?php\n\nnamespace Grumpy;\n\n\
    class Acl {\n    protected $_acls;\n    protected $_request;\n    protected $_userLevel;\n\
    \    \n    ...\n\n    public function __construct($request, $userLevel)\n    {\n\
    \        ...\n\n        $this->_request = $request;\n        $this->_userLevel\
    \ = $userLevel;\n    }\n\n    ...\n\n    public function accessAllowed()\n   \
    \ {\n        return ($this->_acls[$this->_request->getUri()] \n            >=\
    \ $this->_userLevel); \n    }\n        \n}\n\n// Meanwhile inside your controller\n\
    \n$acl = new \\Grumpy\\Acl($this->request, $_SESSION['user_level']);\n\nif (!$acl->accessAllowed())\
    \ {\n    \\Grumpy\\View::render('access_denied.tmpl');\n} else {\n    \\Grumpy\\\
    View::render('show_stolen_cc.tmpl');\n}\n```\n\n## Dependency Injection Containers\n\
    \nNow that you’ve learned about how to use Constructor Injection to pass dependencies\
    \ into your objects, we can explore cranking up the power level through the use\
    \ of [Dependency Injection Containers](http://fabien.potencier.org/article/12/do-you-need-a-dependency-injection-container),\
    \ hereafter referred to as a `DIC`.\n"
  trans: "\n# 迪米特法则 与 依赖注入\n\n## 遵循规则的意义\n\n那么真正的意义是什么？意义在于，只要你尽可能地遵守这些规则，你就能在修改代码时减少阻力，并且使测试变得更容易，因为在真正尝试隔离测试组件时，你将能够使用模拟对象。\n\
    \n## 拥抱迪米特法则的弊端\n\n然而，真正拥抱迪米特法则的一个弊端是，你会发现自己写了大量“包装代码”，这种代码接收传入的内容，然后将其转交给其他函数或对象进行处理。\n\
    \n## 通过依赖注入保持积极面\n\n我们如何保持在 `LoD` 的积极面？其实很简单：我们使用依赖注入（以下简称 `DI`）来传入我们的类完成工作所需的各种对象和值，并且不强迫它们对我们提供的依赖做出任何假设，除了它们的公共接口。\n\
    \n## 构造函数注入\n\n我更喜欢使用的方法称为构造函数注入。通常我会为我的对象创建一个构造函数，接受它所需的所有依赖。这可以通过为你的类创建 `__construct()`\
    \ 方法轻松实现。我想一些代码示例是有必要的。\n\n## 示例应用：模型与数据映射器\n\n在我们的示例应用中，我们使用两种类型的对象与数据源交互。一个\
    \ `Model` 对象，它提供数据库中单条记录的表示形式，以及一个数据映射器对象，它与数据源通信并进而创建 `Model` 对象。\n\n现在，如果我不关心可测试性，我会创建一个执行所有这些功能的大对象。我会在构造函数中创建数据库连接，然后编写与数据库通信并将我想要的结果返回给我的方法。有道理，对吧？从测试角度来看可不是。\n\
    \n如果我们在这里应用迪米特法则，根据规则，我们的 `Model` 不需要知道有关 `Mapper` 的任何信息，除了如何使用它。这样我们就可以自由地做一些事情，比如在真正深入测试时提供模拟\
    \ `Mappers`。\n\n## 使用依赖注入进行测试\n\n那么如果我想测试一下怎么办？如果我在 `Mapper` 的构造函数中硬编码了 DB 连接的细节和创建方式，那么我无法在仅用于测试的数据库上运行任何测试。以下是一个测试，展示了仅仅撒上一点\
    \ `DI` 如何让你轻松测试代码。\n\n```php\n<?php\n\ninclude 'test_bootstrap.php';\n\nclass\
    \ FranchiseModelTest extends \\PHPUnit_Framework_TestCase\n{\n    protected $_conn;\n\
    \n    public function setUp()\n    {\n        $this->_conn = new PDO(\n      \
    \      'pgsql:host=localhost;dbname=ibl_stats', \n            'stats', \n    \
    \        'st@ts=Fun'\n        ); \n    }\n\n    ...\n\n    public function testSaveUpdatesDatabase()\n\
    \    {\n        $mapper = new IBL\\FranchiseMapper($this->_conn);\n        $franchise\
    \ = new IBL\\Franchise();\n        $franchise->setId(25);\n        $franchise->setNickname('TST');\n\
    \        $franchise->setName('Test Team');\n        $franchise->setConference('Conference');\n\
    \        $franchise->setDivision('Division');\n        $franchise->setIp(0);\n\
    \        $mapper->save($franchise);\n\n        // Update existing model\n    \
    \    $franchise->setIp(35);\n        $mapper->save($franchise);\n        \n  \
    \      // Reload Franchise record and compare them\n        $franchise2 = $mapper->findById($franchise->getId());\n\
    \        $this->assertEquals(35, $franchise2->getIp());\n\n        // Clean up\
    \ the franchise\n        $mapper->delete($franchise);\n    }\n}\n```\n\n这有道理，对吧？我们的\
    \ `Mapper` 不需要知道创建数据源连接的细节。它只需要知道它已被赋予一个可用的连接。\n\n## FranchiseMapper 的 save()\
    \ 方法\n\n为了进一步看到这一点的工作原理，你甚至可以查看 `FranchiseMapper` 的 `save()` 方法。\n\n```php\n<?php\n\
    \nnamespace IBL;\n\nclass FranchiseMapper\n{\n    protected $_conn;\n    protected\
    \ $_map = array();\n\n    ...\n\n    public function save(\\IBL\\Franchise $franchise)\n\
    \    {\n        if ($this->findById($franchise->getId())) {\n            $this->_update($franchise);\
    \ \n        } else {\n            $this->_insert($franchise); \n        }\n  \
    \  }\n\n    protected function _insert(\\IBL\\Franchise $franchise) \n    {\n\
    \        try {\n            $sql = \"\n                INSERT INTO franchises\
    \ \n                (nickname, name, conference, division, ip, id) \n        \
    \        VALUES(?, ?, ?, ?, ?, ?)\";\n            $sth = $this->_conn->prepare($sql);\n\
    \            $binds = array(\n                $franchise->getNickname(),\n   \
    \             $franchise->getName(),\n                $franchise->getConference(),\n\
    \                $franchise->getDivision(),\n                $franchise->getIp(),\n\
    \                $franchise->getId()\n            );\n            $sth->execute($binds);\n\
    \        } catch(\\PDOException $e) {\n            echo \"A database problem occurred:\
    \ \" . $e->getMessage(); \n        }\n    }\n\n    protected function _update(\\\
    IBL\\Franchise $franchise)\n    {\n        try {\n            $sql = \"\n    \
    \            UPDATE franchises \n                SET nickname = ?, \n        \
    \        name = ?, \n                conference = ?, \n                division\
    \ = ?, \n                ip = ? \n                WHERE id = ?\";\n          \
    \  $sth = $this->_conn->prepare($sql);\n            $fields = array(\n       \
    \         'nickname', \n                'name', \n                'conference',\
    \ \n                'division', \n                'ip', \n                'id'\n\
    \            );\n            $binds = array();\n\n            foreach ($fields\
    \ as $fieldName) {\n                $field = $this->_map[$fieldName];\n      \
    \          $getProp = (string)$field->accessor;\n                $binds[] = $franchise->{$getProp}();\n\
    \            }\n\n            $sth->execute($binds);\n        } catch(\\PDOException\
    \ $e) {\n            echo \"A database problem occurred: \" . $e->getMessage();\
    \ \n        }\n    }\n}\n```\n\n再次，我们告诉我们的方法“嘿，这里有一个你需要使用的项目”，它只知道如何使用它，而不知道内部是什么样的。\n\
    \n## 重构示例：访问控制层\n\n这里有一个场景，可能会更清楚地说明如何借助 `LoD` 和 `DI` 重构代码。\n\n想象一下，你正在创建自己的框架，并且正在编写一个访问控制层（简称\
    \ `ACL`）组件。对于不熟悉这个概念的人来说，`ACLs` 会查看你试图访问的资源，并将其与你当前拥有的用户级别进行比较，然后告诉你该用户是否可以访问该资源。它可能看起来像这样：\n\
    \n```php\n<?php\n\nnamespace Grumpy;\n\nclass Acl {\n    protected $_acls;\n\n\
    \    ...\n\n    public function accessAllowed()\n    {\n        $request = \\\
    Grumpy\\Context::getRequest();\n\n        return ($this->_acls[$request->getUri()]\
    \ >= $_SESSION['user_level']); \n    }\n        \n}\n\n// Meanwhile inside your\
    \ controller\n\n$acl = new \\Grumpy\\Acl();\n\nif (!$acl->accessAllowed()) {\n\
    \    \\Grumpy\\View::render('access_denied.tmpl');\n} else {\n    \\Grumpy\\View::render('show_stolen_cc.tmpl');\n\
    }\n```\n\n我们通过静态方法调用引入请求对象，并且直接从会话中获取用户信息。这是非常常见的编码实践，但完全不可测试。让我们稍微清理一下。\n\n```php\n\
    <?php\n\nnamespace Grumpy;\n\nclass Acl {\n    protected $_acls;\n    protected\
    \ $_request;\n    protected $_userLevel;\n    \n    ...\n\n    public function\
    \ __construct($request, $userLevel)\n    {\n        ...\n\n        $this->_request\
    \ = $request;\n        $this->_userLevel = $userLevel;\n    }\n\n    ...\n\n \
    \   public function accessAllowed()\n    {\n        return ($this->_acls[$this->_request->getUri()]\
    \ \n            >= $this->_userLevel); \n    }\n        \n}\n\n// Meanwhile inside\
    \ your controller\n\n$acl = new \\Grumpy\\Acl($this->request, $_SESSION['user_level']);\n\
    \nif (!$acl->accessAllowed()) {\n    \\Grumpy\\View::render('access_denied.tmpl');\n\
    } else {\n    \\Grumpy\\View::render('show_stolen_cc.tmpl');\n}\n```\n\n## 依赖注入容器\n\
    \n现在你已经了解了如何使用构造函数注入将依赖项传递到你的对象中，我们可以通过使用 [依赖注入容器](http://fabien.potencier.org/article/12/do-you-need-a-dependency-injection-container)，以下简称\
    \ `DIC`，来探索提升能力等级。\n"
