    \ = new \\Grumpy\\Acl($testRequest, $testUserLevel);\n        $response = $testAcl->accessAllowed();\n\
    \        $this->assertTrue($response);\n    }\n\n}\n```\n\n再说一次，光为了让测试通过而做额外的工作似乎有些多余，但它说明了确保你的代码解耦到根本不在乎运行环境这一点，实际上可以非常简单。\n\
    \n## 8 像洋葱一样，你的应用有层次\n\n我认为很明显，如果你想用任何自动化工具来测试你的应用程序，就必须将业务逻辑与显示逻辑分开。\n\n我们都曾构建过那种“一团乱麻”的应用。你知道的，就是两三个\
    \ PHP 脚本，把检查 `$_GET` 值、然后分支去执行 MySQL 查询、再进一步遍历结果集输出内容的代码混在一起。所有东西都在一个地方，但当你需要更新某样东西时却极其困难。而你当然会在服务器上直接进行现场更新。我就是那样的人。不要再那样做了。生活太短暂，工具也太多了，不再有借口了。\n\
    \n大多数 Web 应用框架通过鼓励使用 [模型-视图-控制器软件架构模式](http://en.wikipedia.org/wiki/Model-view-controller)\
    \ 来完成这项任务。为什么这是个好主意？因为它强制解耦应用程序的不同层。当然，除非框架本身构建不当。嘿，这种情况也会发生。\n\n因此向这些 Web 应用框架取经。即使你不打算使用其中任何一个，因为你在使用自制的珍贵雪花框架\
    \ (`PSF`)，至少要聪明地构建它，让你的业务逻辑在一个地方，请求-响应逻辑在另一个地方，显示逻辑在别处，这样你可以独立地处理它们。\n\n把这些东西看作你应用程序的层次。用食物作类比，你的模型，即代表应用程序将使用的数据的代码，是蛋糕的底层。你的控制器，它们作为特定请求的结果被调用，然后确定正确的响应应该是什么，是蛋糕的第二层，也许带一点馅。最后，你的展示层是蛋糕的糖霜和美味的配料。你希望能够随时对这些层次中的任何一个进行更改。\n\
    \n我已经能听到你说“但是 Chris，你真的有多常更改这类东西？”比我愿意承认的要频繁得多。没人能在构建应用程序时每次都做出正确的选择。现在，你可能会被困在一个特定的框架中，因为它需要很大的自律才能只使用你真正需要的框架部分。\n\
    \n你真正想要的是一个由精心制作、经过良好测试的可重用组件组成的应用程序，这些组件仅把框架作为胶水来让它们相互通信。我曾参与过一个名为 [Phix](http://www.phix-project.org)\
    \ 的开源项目，它试图帮助构建一套工具来鼓励这种确切类型的应用程序架构。但这不是关于 `Phix` 的指南。我们可以利用 `Phix` 背后的一些理念来帮助你。\n\
    \n如果你认真地为你的应用程序提供有用的测试，你必须遵循这条信条：\n\n> 如果你无法为它自动化测试，那么它就是坏的。\n\n我为什么这么说？如果没有一套好的测试，你真的不知道应用程序是否会按预期行为。当然，实现这一点有很多障碍。几乎所有这些都是因为开发者为问题选择了不正确的解决方案。这可能听起来很苛刻，但通常就是事实。我也不例外。\n\
    \n我认为测试数据模型是许多初级到中级测试人员犯错的一个领域。他们未能理解目标是确保你以预期的方式表示数据，并且能够将数据的生成与表示它的代码分开。\n\n\
    我可以诚实地告诉你，因为你已经读到我指南的这里：测试确实需要很多自律，你经常发现自己写的支持和脚手架代码与真正工作的代码一样多。个人而言，我认为其中大部分工作非常有用，因为它是对未来的预付款。所有这些额外的工作都是为了保护你的代码免受非预期后果的影响。换句话说，你希望你的测试能够检测到你在不知情的情况下破坏了什么。\n\
    \n这里有一个我称之为脚手架代码的例子，你需要它来支持提供价值的测试类型。在我们的测试应用程序中，我们必须生成排名。为此，我们在期望的日期范围内选择一系列\
    \ `Games` 对象，然后做很多工作来计算胜负场数，然后按胜率对该列表进行排序返回。\n\n现在，如果我想，该如何测试这个东西？正确的测试方法可能涉及创建一个数据\
    \ fixture 文件，其中包含序列化对象，代表我们希望从中生成排名的所有比赛。\n\n我们如何创建这个 fixture？\n\n```\n<?php\n\
    $conn = new PDO(\n    'pgsql:host=localhost;dbname=ibl_stats', \n    'stats',\
    \ \n    'st@ts=Fun'\n);\n\necho \"Collecting all games in our season...\\n\";\n\
    $gameMapper = new \\IBL\\GameMapper($conn);\n$allGames = $gameMapper->findAll();\n\
    echo \"Writing games objects into fixture file...\\n\";\nfile_put_contents('./fixtures/games.txt',\
    \ serialize($allGames));\necho \"Done\\n\";\n```\n\n既然我们有了 fixture，我们的测试看起来如何以确保我们的\
    \ `Standings` 模型按我们想要的方式工作？\n\n```\n<?php\n\n$testGames = unserialize(file_get_contents('./fixtures/games.txt'));\
    \  \n$conn = new \\PDO(\n    'pgsql:host=localhost;dbname=ibl_stats', \n    'stats',\
    \ \n    'st@ts=Fun'\n); \n$testFranchiseMapper = new \\IBL\\FranchiseMapper($conn);\n\
    $testStandings = new \\IBL\\Standings($testGames, $testFranchiseMapper);\n$testResults\
    \ = $testStandings->generateBasic();\n$this->assertTrue(count($testResults) >\
    \ 0);\n$testResult = $testResults['AC']['East'][0];\n$this->assertEquals(1, $testResult['teamId'],\
    \ 'Got expected team ID');\n$this->assertEquals(97, $testResult['wins'], 'Got\
    \ expected win total');\n$this->assertEquals(65, $testResult['losses'], 'Got expected\
    \ loss total');\n$this->assertEquals('--', $testResult['gb'], 'Got expected GB\
    \ total'); \n```\n\n还不错，第一次尝试来说，但你看到了这里的问题吗？我们使用的是真实的 `Franchise` mapper，而不是模拟的。那很重要，因为我们不应该实际连接到数据库来获取关于存在哪些\
    \ `Franchise` 的信息。那会使测试依赖于我们的数据库，而我们不希望这样。\n\n我们应该做的是创建一个另一个 fixture，传入我们所需的所有\
    \ `Franchise` 对象，然后在内部修改 `Standings` 模型本身，使其依赖于这些对象获取所需的信息。\n\n创建一个工具，根据数据库中的数据生成\
    \ `Franchise` fixture。\n"
