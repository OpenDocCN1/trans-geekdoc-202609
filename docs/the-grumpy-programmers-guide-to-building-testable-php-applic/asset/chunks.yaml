    \ the trouble of instantiating them just before you use them, and if you use a\
    \ container you can return an object that is already configured the way you need\
    \ it.\n\n## Abusing the Container\n\nIt is also very easy to abuse the user of\
    \ a DIC. Let’s say that you have an object called `Omega`, that has three dependencies\
    \ that you need to pass in:\n\n```\n<?php\n\nclass Omega\n{\n    protected $foo;\n\
