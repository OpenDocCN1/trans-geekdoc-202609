    ## 9 Shells 与 沙盒


    *这篇文章最初于 2009 年出现在我的博客上。它介绍了一种在 Python 和 Ruby 等语言中经常使用但在 PHP 中几乎被忽略的工具。希望你喜欢。*


    现在我成为了一名“重生”的测试人员，我开始从更高层次的角度审视我在工作中所做的测试。像 [SimpleTest](http://www.simpletest.org/)
    和 [PHPUnit](http://www.phpunit.de/) 这样的工具 *真的* 在做什么？它们提供了一种自动化运行测试的机制。类似的工具也存在于像
    [Django](http://www.djangoproject.com) 和 [Ruby on Rails](http://www.rubyonrails.org)
    这样的框架中。我无法代表 Django 发言，但 Rails 社区在测试工具和测试最佳实践方面做出了非常大的投入。但 Ruby 和 Python 提供的另一种非常强大的测试工具是
    PHP 所没有的。


    Ruby 和 Python 都提供了一个可从命令行运行的 [读取-求值-打印循环](http://en.wikipedia.org/wiki/REPL)，它允许人们做与传统测试工具相反的事情：允许你对代码进行交互式测试。我曾使用
    Python 中可用的 `REPL`（你知道，就是从命令行输入 `python`）来测试一个副项目中各种地理编码库的使用方法。我的 [最喜欢的 Ruby 程序员](http://gilesbowkett.blogspot.com/)
    在做事时总是使用 `irb`。


    从某种意义上说，`REPL` 是反自动测试。我认为如果 PHP 有一个好的 `REPL` 可用，测试最佳实践可能会更好地被采纳。也许 Alan Pinstein
    的 [iphp](http://github.com/apinstein/iphp) 项目中对一个好的 PHP `REPL` 抱有希望。我记得曾尝试继续几年前为
    `CakePHP` 创建的测试控制台的工作，很快意识到我需要的是一个 `REPL`。


    由于我没有通过摆弄 `eval` 来编写自己的有限 PHP 解析器的欲望（尽管说实话，我确实尝试过玩弄它，并意识到我根本不知道自己在做什么），测试控制台就此夭折了。此外，到底有多少
    PHP 开发者真的在命令行上使用 PHP？10%？1%？很难说，因为我关注的群体是自选择的，我确信他们大多数人都使用过命令行 PHP。在命令行上尝试使用它而不成为一名高级
    PHP 开发者是很困难的。


    我也很高兴得知（使用了一年之后才发现，至少）[eXist](http://exist-db.org/) 拥有自己的 `XQuery` `REPL`——他们称之为“沙盒”。这太棒了，因为我可以拿出我“6
    个月前写的，现在记不清是否还能工作”的 `XQuery` 脚本来测试它们。就像是你的 `RDBMS` 的命令行客户端。它甚至在我在尝试执行它们之前就会告诉我语法或格式错误。说到为开发者节省时间。


    对于像 `MySQL` 和 `Postgres` 这样的 `RDBMS` 是否存在类似的东西？想象一个在你 *输入时* 检查语法的交互式客户端。如果有这样东西，请告诉我！


    再一次，我看到我开始跑题了。重新回到正轨。


    所以，从测试的角度来看，很容易看出 shell 和沙盒如何成为必不可少的工具。例如，我见过的所有关于单元测试的好建议都明确提倡沙盒方法。你创建包含数据的夹具。你创建模拟对象来模拟可能具有破坏性的功能。你甚至可以为测试操作创建一个单独的数据库。很明显，这里的目标是创建一个与代码最终运行的环境相同但与“真实”环境分离的环境。


    另一方面，`REPL` 非常强大也非常危险。如果你不小心，很容易就会将数据插入到当前的生产环境而不是测试环境中。正如许多其他事情一样，权力是有代价的。当然，我可以运行一些代码来弄清楚如何使用，比如
    `SQLAlchemy`，但我最好确保自己没有向生产数据库写入数据。那就太傻了。


    我猜 PHP 没有易于使用的 `REPL` 的主要原因是它首先在网络上成长，其次才是命令行。Ruby 和 Python 首先在命令行上开始，然后才走向网络。我认为真的就是这么简单。PHP
    未来会得到一个被广泛接受的 `REPL` 吗？


    ## 10 重建你的编程和部署环境


    *本文的某些内容最初于 2009 年出现在我的博客上，并更详细地介绍了快速轻松地重建环境的概念背后的内容。希望你觉得有用。*


    我一直在密切关注人们在最佳实践和实际应用部署方面做了哪些事情。看看这些，我意识到自己最近有多松懈。这是孤身开发者为雇主进行持续、增量的编程所带来的压倒性倦怠吗？我是在讽刺（显然）但我越想想我是如何进行开发工作的，就越意识到我需要重新聚焦。


    所以，我的编程环境对我来说似乎还算正常。我在我的笔记本电脑上使用 [唯一的真编辑器(tm)](http://www.vim.org) 编写代码，那里安装了
    PHP、Python 和 Perl。由于我同时使用 `MySQL` 和 `Postgres`，它们也都在我的笔记本电脑上。有何奇怪，我的 MacBook 被塞满了
    4 GB 的 RAM？我通常运行几个 `Terminal.app` 实例和几个 [MacVim](http://code.google.com/p/mavcim)
    实例。我发现我经常使用 [Sequel Pro](http://www.sequelpro.com/) 和 [pgAdmin III](http://www.pgadmin.org/)，因为所有与体育数据相关的工作都需要我一点一点调整的大型查询。


    我还发现了一个我一直忽略但对开发工作来说是救星的强大工具。当你有一个应用程序需要处理的大型数据集，而将其复制到本地完全不切实际时怎么办？`SSH` 隧道来救援！


    ```

    ssh -fNg -L3308:localhost:3306 notchris@server.domain.com

    ```


    这创建了一个到我们其中一台生产机器（我们以 NHL 球队命名）上的 `MySQL` 服务器的隧道，然后我可以通过在端口 `3308` 上建立 `MySQL`
    连接来访问它。非常简单而且非常有效。我简直不敢相信我竟然忘了这件事。这种技术在使用像 `Sequel Pro` 这样的工具时效果很好，我们曾有一位 SQL
    顾问也是这样连接的。

