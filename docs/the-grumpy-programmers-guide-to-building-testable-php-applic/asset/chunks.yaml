    better to be [standing on the shoulders of giants](http://en.wikipedia.org/wiki/Standing_on_the_shoulders_of_giants)
    than to just stay only where you are comfortable.


    I guess the point I’m trying to get across is that you can use the *litany against
    fear* as a tool to motivate to truly analyze your reactions to situations. For
    example, I’m having a very hard time figuring out how to get Zend Framework +
    PHPUnit to adequately test the ability of an application at work to use Facebook
    Connect. I just can’t get it to do things with a regular request, for a bunch
    of reasons I’m unable to understand. I can’t peer inside the request to the extent
    I would like. I foresee having to drop down a level in the application and admit
    that I cannot test the request itself, but the code that is executed after control
    is returned to the application.


    Fear would say “give up because it’s too hard to properly test things”. The reality
    is that while I cannot test the *output* of the request, I can certainly test
    what is supposed to be going on behind the scenes. Tests like that are just as
    valuable as being able to capture the response from a request and verify that
    elements exist in the DOM as expected. Perhaps one day there will be better tools
    in PHP to accomplish this task. I know it can be done [using other tools](http://opensoul.org/blog/archives/2009/03/05/testing-facebook-with-cucumber/)
    and I’ll be honest here: it makes me bark out a few choice words about the state
    of PHP testing tools.


    # 14 Where Are The Tests?


    *This content originally appeared on my blog in October 2008 and is still very
    applicable today. Hope you enjoy it.*


    As a [project for work](http://sportso.com) gets ready for an alpha release, I’ve
    managed to eliminate all the serious bugs and now have some time for what should’ve
    been part of the project from the beginning: writing tests. As a lapsed tester,
    I always feel guilty about not writing tests when things start to get complicated
    with an application. Whenever you make a change, you have to point-and-click your
    way through the application to make sure that nothing has broken. I got tired
    of pointing-and-clicking, so I decided it was time to shut up and write some tests.
    Since I’m using Code Igniter instead of CakePHP for this project (did I mention
    that I inherited the project and couldn’t switch?) I started looking into the
    culture of testing surrounding Code Igniter. It’s weaker than a newborn baby.


    The built-in testing system is some weird mishmash of unit testing and “you have
    to create your own test results template”. WTF? You can’t be serious. So I quickly
    ignored that. Besides, the first set of tests were going to be using [PHPUnit](http://phpunit.de)
    combined with [Selenium](http://selenium.openqa.org/) so I could make the “acceptance
    testing” automated. As an aside to this, I remember speaking with Sebastian Bergmann
    (the driving force behind PHPUnit) at a conference maybe 3 years ago and him telling
    me that he knew someone was working on getting Selenium and PHPUnit to play nicely
    together. Anyway, it’s working just fine.


    So, next step was to see if I could use something other than the incredibly lame
    testing tools that Code Igniter came with. I found something called [fooStack](http://www.foostack.com/foostack/),
    that contained `CIUnit`. It lets you use PHPUnit with Code Igniter. Now we’re
    talking! Lickety split I had some unit tests for my models written. Well, after
    spending quite a lot of time screwing around with the tests and finding out the
    difference in relative paths between the application running via Apache and trying
    to test the models via the command line. Thanks to all those on Twitter who yelled
    “use `php_sapi_name` to figure out what environment you are in, you idiot!” at
    me.


    But all this got me to thinking: how do some other PHP frameworks stack up in
    terms of having tests?


    *   Code Igniter has ZERO tests for the framework itself. Perhaps I will mention
    this to my boss next time I’m asked to create a project from scracth. Hrm, guess
    I’ll have to trust that their code actually works the way it’s supposed to.


    *   Zend Framework (full disclosure: I was one of the original authors of the
    `Zend_Service_Audioscrobbler` component) has huge amounts of tests for the framework
    itself. In fact, any new contributions MUST have working tests submitted with
    it.


    *   CakePHP has lots of tests for the core, and I believe that I saw something
    in the changelog for CakePHP 1.2RC3 that indicated they were at 80% code coverage
    in terms of testing for the CakePHP core. Bug submissions for CakePHP are supposed
    to come with tests to prove that there is a repeatable problem.


    *   Symfony recently rewrote it’s core tests and created their own testing framework
    for it.


    So now when you start comparing frameworks to each other, I think it’s important
    you also consider how much effort has gone into creating tests for the core functionality
    of that framework. A well tested framework should mean far less surprises when
    using it. Given how many tools are out there to assist you in testing, I don’t
    think there are any excuses other than being totally lazy to not create tests
    for the core functionality of any application. Pay now, or pay later, but you
    will PAY to fix bugs in your application. Paying now is simply cheaper.

    '
  trans: '

    但对于新技术往往还有另一种反应。那种反应就是恐惧。对使用自己不熟悉的一套技术感到恐惧。对自动化系统部署可能未得到充分测试的代码感到恐惧。对投入精力去做短期收益很少但长期收益很多的事情感到恐惧。恐惧是思想的杀手，是你脑海中那个小声音在告诉你你不够好，你的想法很烂，你根本不知道自己在说什么。


    Seth Godin 谈到当一种技术被贴上死亡标签时，[真正酷的事情可以发生](http://sethgodin.typepad.com/seths_blog/2011/03/bring-me-stuff-thats-dead-please.html)。PHP
    正是被 Mr. Godin 提到的“路过型技术宅”们贴上了死亡标签，尽管事实上它在构建 Web 应用时仍然是一个定位良好的工具。与此同时，我能感觉到大脑中那股恐惧的刺痛。“不要被落下”它在我耳边低语。“放弃
    PHP 转投技术 X”它恳求我。当声音变得太大时，我开始背诵反恐祷文。PHP 本身仍有很多创新要做。PHP 的每个后续版本都在变得更快，并且（相当正确地）实现了让其他脚本语言变得有趣的功能。例证
    A？[匿名函数](http://ca.php.net/manual/en/functions.anonymous.php)，允许编写一些非常有趣的代码。它是最新[品种](http://lithify.me/)[的](https://github.com/symfony/symfony)[框架](https://github.com/zendframework/zf2)不可或缺的一部分。


    不要让恐惧决定你使用的技术。今天，我最擅长使用 PHP 构建 Web 应用，并加入一些 Javascript 来改善用户体验。明天，情况会有所不同。不是字面意义上的明天。你知道我的意思。我一直在技能集中添加
    Python、[Django](https://github.com/chartjes/ibl)、[Flask 和 Google App Engine](https://github.com/chartjes/liesitoldmykids)。坦率地说，对于像我这样走“样样通”职业道路的人来说，成为单生态系统（即仅限
    PHP）的专家风险很大。远比[站在巨人的肩膀上](http://en.wikipedia.org/wiki/Standing_on_the_shoulders_of_giants)更好，而不是只待在自己舒适的地方。


    我想我试图传达的重点是，你可以将*反恐祷文*作为一种工具来激励自己真正分析对情况的反应。例如，我很难弄清楚如何让 Zend Framework + PHPUnit
    充分测试工作中应用程序使用 Facebook Connect 的能力。我就是无法让它通过常规请求来执行操作，原因有很多我无法理解。我无法像我希望的那样深入查看请求。我预见到必须在应用程序中降一个层级，并承认我无法测试请求本身，只能测试控制权返回到应用程序后执行的代码。


    恐惧会说“放弃吧，因为正确地测试东西太难了”。现实是，虽然我无法测试请求的*输出*，但我当然可以测试幕后本应发生的事情。这样的测试与能够捕获请求的响应并验证
    DOM 中元素按预期存在一样有价值。也许有一天 PHP 中会有更好的工具来完成这项任务。我知道使用[其他工具](http://opensoul.org/blog/archives/2009/03/05/testing-facebook-with-cucumber/)可以做到这一点，我在这里坦白说：这让我对
    PHP 测试工具的现状忍不住骂上几句。


    # 14 测试在哪里？


    *这篇文章最初于 2008 年 10 月出现在我的博客上，今天仍然非常适用。希望你喜欢。*


    随着一个[工作项目](http://sportso.com)准备进行 Alpha 发布，我已经消除了所有严重 bug，现在有时间做本应从项目开始就包含的事情：编写测试。作为一名已淡出测试的测试者，每当应用程序变得复杂时，我总是对没有编写测试感到内疚。每当你做出更改时，你必须通过点按的方式遍历应用程序以确保没有东西被破坏。我厌倦了点按，所以我决定是时候闭嘴写一些测试了。由于我在这个项目中使用
    Code Igniter 而不是 CakePHP（我提到过我继承了这个项目并且无法更换吗？）我开始研究围绕 Code Igniter 的测试文化。它弱得像个新生儿。


    内置的测试系统是单元测试和“你必须自己创建测试结果模板”的某种奇怪混合体。WTF？你没在开玩笑吧。所以我很快就忽略了它。此外，第一批测试将使用 [PHPUnit](http://phpunit.de)
    结合 [Selenium](http://selenium.openqa.org/)，这样我就可以让“验收测试”自动化。顺便说一下，我记得大约 3 年前在一次会议上与
    Sebastian Bergmann（PHPUnit 背后的推动者）交谈，他告诉我他知道有人正在努力让 Selenium 和 PHPUnit 良好地协同工作。无论如何，它运行得很好。


    所以，下一步是看看我是否能使用 Code Igniter 自带的那种极其糟糕的测试工具以外的东西。我找到了一个叫做 [fooStack](http://www.foostack.com/foostack/)
    的东西，其中包含 `CIUnit`。它让你可以用 PHPUnit 与 Code Igniter 一起使用。现在我们说到点子上了！转眼间我就为我的模型编写了一些单元测试。好吧，在花了大量时间折腾测试并发现通过
    Apache 运行应用程序与通过命令行测试模型之间的相对路径差异之后。感谢 Twitter 上所有对我大喊“使用 `php_sapi_name` 来判断你所在的環境，你这个白痴！”的人。


    但这一切让我思考：其他一些 PHP 框架在测试方面表现如何？


    *   Code Igniter 本身的框架为零测试。也许下次被要求从零开始创建一个项目时我会向我的老板提及这一点。哼，看来我只能相信他们的代码实际上按预期工作。


    *   Zend Framework（完全披露：我是 `Zend_Service_Audioscrobbler` 组件的原始作者之一）为其框架本身拥有大量测试。事实上，任何新贡献都必须附带可工作的测试。


    *   CakePHP 为核心有大量测试，我相信我在 CakePHP 1.2RC3 的变更日志中看到过一些内容，表明它们在 CakePHP 核心测试方面的代码覆盖率达到了
    80%。CakePHP 的错误提交应该附带测试以证明存在可重复的问题。


    *   Symfony 最近重写了其核心测试并为其创建了自己的测试框架。


    所以现在当你开始比较框架彼此时，我认为你也应该考虑有多少精力投入到为该框架的核心功能创建测试。一个经过充分测试的框架在使用时应该意味着更少的意外。鉴于有这么多工具可以帮助你进行测试，我认为除了完全懒惰之外，没有任何借口不为任何应用程序的核心功能创建测试。现在付费，或以后付费，但你最终会为修复应用程序中的
    bug 付费。现在付费 simply 更便宜。

    '
