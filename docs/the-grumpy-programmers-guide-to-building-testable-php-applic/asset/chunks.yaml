    \ Bergmann.\n\nFound 2 exact clones with 52 duplicated lines in 1 files:\n\n \
    \ - AMF_Checkout.php:60-68\n    AMF_Checkout.php:576-584\n\n  - AMF_Checkout.php:88-132\n\
