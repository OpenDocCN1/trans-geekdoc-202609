- raw: "```\n<?php\nclass Test extends PHPUnit_Framework_TestCase\n{\n    public function\
    \ testAlphaMunge()\n    {\n        $mockFoo = $this->getMockBuilder('Foo')\n \
    \           ->disableOriginalConstructor()\n            ->getMock();\n       \
    \ $mockFoo->expects($this->atLeastOnce())\n            ->method('getDetails')\n\
    \            ->will($this->returnValue('1->2'));\n        $mockFoo->expects($this->atLeastOnce())\n\
    \            ->method('getId')\n            ->will($this->returnValue('1'));\n\
    \n        $mockBar = $this->getMockBuilder('Bar')\n            ->disableOriginalConstructor()\n\
    \            ->getMock();\n        $mockBar->expects($this->atLeastOnce())\n \
    \           ->method('getStartDate')\n            ->will($this->returnValue('2012-03-27'));\n\
    \        $mockBar->expects($this->atLeastOnce())\n            ->method('getEndDate')\n\
    \            ->will($this->returnValue('2012-04-09'));\n\n        $source = \"\
    1|1->2|2012-03-27|2012-04-09\";\n        $expectedMunge = md5('rocksalt' . $source);\n\
    \        \n        $testAlpha = new Alpha();\n        $munge = $testAlpha->getMunge($mockFoo,\
    \ $mockBar);\n\n        $this->assertEquals(\n            $expectedMunge,\n  \
    \          $munge,\n            'Munge value should match expected'\n        );\n\
    \    }\n}\n```\n\nAnd there you have it! A test for a specific method that uses\
    \ mocks to properly isolate functionality that is required for the test to work.\n\
    \nI hope this blog post makes things a lot clearer when it comes to understanding\
    \ the role of mocks when creating unit tests.\n\n## 16 Advice From a Grumpy Programmer\n\
    \nI know there is a lot of stuff in this guide for you to consider. Writing tests\
    \ is easy but creating a suite of tests that really helps protect you from regressions\
    \ and other problems is hard.\n\nThe scope of knowledge required to do this is\
    \ vast. This guide is really just scratching the surface of the topic of testing,\
    \ automation, continuous integration and deployment. There are numerous ways for\
    \ you to get there so don’t get discouraged that you have so many options.\n\n\
    Start slow and build out the pieces you really need first. The fancy stuff that\
    \ companies like [IMVU](http://www.startuplessonslearned.com/2009/06/why-continuous-deployment.html)\
    \ and [Etsy](http://codeascraft.etsy.com/) use didn’t get built overnight. It\
    \ took years to get there, and they made lots of mistakes along the way to find\
    \ the right set of tools and practices that worked for them.\n\nTake the time\
    \ and find the right set of tools for what you need. To reach the nerdvanna of\
    \ continuous deployment, all you need is this:\n\n*   a testing suite with enough\
    \ coverage to catch regressions\n\n*   ability to automatically run tests\n\n\
    *   ability to do automated deployments to a specified target\n\nThat’s really\
    \ it. Your journey towards this starts with the decision to write one test using\
    \ one set of tools, and it never really ends. You will find that when you make\
    \ the commitment to a “test-first” mentality that your code ends up being more\
    \ modular and simpler than before. That’s all you can really ask for."
