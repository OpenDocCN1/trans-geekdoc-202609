    used `CVS`) that ran a `syntax checker` on any code that got checked in. Predictably,
    something was broken because the version of `PHP` running on the `CVS` server
    was different from what we were using both in `development` and `production`,
    and a difference in extensions caused a problem. That is a story for another time.


    I also find that using a `post-commit` hook allows me to look at the code in the
    `staging` environment to find bugs that are caused by subtle differences between
    the `development` environment and `staging`. Today, I fixed one bug by using the
    new ternary shortcut available in `PHP 5.3`. Learn something new every day, is
    my motto.


    So, how does a build actually work? Here’s how I’ve set things up:


    1. A developer commits code to the `trunk` of the `SVN` repository. We don’t currently
    use `branches`, so I’d have to tweak things if we did work in `branches` and then
    merged things into `trunk`.

    2. `Jenkins` wakes up when it sees a `commit`, and checks the code out into a
    `workspace`.

    3. `Jenkins` then runs a list of `shell script` commands to do a bunch of things:
    run my `Doctrine` migration scripts, run my `PHPUnit` tests, run my `py.test`
    tests, then copy the code into place on the `staging` server.

    4. Create a bunch of `test` reports that can be viewed in `Jenkins` itself

    5. Send out an `email` to our tech mailing list telling people that a build has
    been triggered along with the results


    I have to say there is nothing that puts a smug feeling of satisfaction in my
    heart like seeing that a build was successful…and nothing that makes me curse
    quite as much as seeing that a build failed. But without those tests in place,
    then I would not find bugs that would’ve gone into production. Any bug making
    it into production is BAD, and although I often use gallows humour at work to
    try and deflect my internal anger at such a thing, it IS possible to do production
    pushes of new code that contain no errors.


    As a follow-up to this idea, I now have a policy that whenever a bug does get
    found in `staging` or `production`, I write a `test` to recreate the bug, and
    then put code into place to fix it. I have found that this has the interesting
    effect of giving you a bunch of `unit` and `integration` tests (thank you for
    the ability to test the output of `controllers` in `Zend_Framework` `PHPUnit`
    tests) that cover `edge cases` found by real users. Besides, you can get really
    lost going deep into the “we need to create `fixtures` so I can test stuff that
    manipulates dynamically-generated content” rabbit hole. I saw a `test` today that
    could benefit from the use of `fixtures`, instead of simply assuming that `data`
    will always be there. Your mileage will vary, but you have to understand that
    slavish devotion to `testing` does you no good if you’re not accomplishing the
    goal of producing a working `application` that meets the goals of the people who
    are actually, you know, using it.


    I hope this post helps you if you’re trying to decide whether or not to take the
    `CI` plunge. I have no regrets at the length of time it took me to get things
    to a happy place in terms of `Jenkins` configuration. The benefits of automated
    builds with the goal of protecting you from yourself more than outweighs a few
    afternoons of scratching your head and trying to figure out what is going on with
    `Jenkins` itself.


    ## 12 Infrastructure Debt


    *This content was originally a blog post from November 2011 that got some traction
    and ended up on Hacker News. It is directly related to the concepts that go into
    buliding testable applications. Hope you enjoy it.*


    You might have come across the term “`technical debt`”, used to describe the small
    mistakes that are made in your `code base` as the `application` grows and requirements
    change. You end up with a big tangled mess if you are not very careful about how
    you make those changes. If you’ve ever worked on an `application` where you were
    afraid to make changes for fear of breaking something, then you have run into
    `technical debt`.


    It’s very easy to build up `technical debt`: you put a quick `hack` in because
    you feel like you are under pressure to get a task accomplished. It takes courage
    to push back and say “no, damnit, I need time to fix this particular problem correctly!”.
    I understand, and it’s okay. We can hug it out if it will make you feel better.


    `Technical debt` can be dealt with via ruthless `refactoring` and wrapping your
    `application` in `tests` that poke and prod at the `edge cases` that your `application`
    deals with. But there is another type of debt you end up dealing with. One that
    is even more difficult to deal with and change. I call it `infrastructure debt`.


    `Infrastructure debt` is debt that you build up because you have not been paying
    attention to the process of creating the `environments` your `application` will
    exist in and have not been paying attention to the process of how your `code`
    gets from `development` into `production`. In my opinion, `infrastructure debt`
    is much more difficult to “pay off” than `technical debt`. Why? It is often very
    difficult for people to understand that it even exists.


    Before I go any further, if you are not using a `version control system` to keep
    track of changes to your `code`, then please stop reading and go and install one.
    Having versions of your files with extensions like `.1` and `.old` is the worst
    kind of `infrastructure debt` that you could possibly have. It’s the 2nd decade
    of the 21st century. `Version control` is an almost 40-years-old, well-understood
    concept. Nothing I suggest will work if you insist on acting like `version control`
    is of no use to you. Passing around `diff` patches is not `version control`, my
    friends. It’s denial. Don’t tell me just because people used to do it in the past
    that it’s okay now given all the available options. People used to think that
    the earth was flat once too.


    Let’s start with an easy `infrastructure debt` to pay off: inconsistency in `development
    environments`. These days it is pretty easy for someone to create a `development
    environment` for their `language` of choice along with associated components like
    `databases`. The problem? That it’s pretty easy for someone to create the `development
    environment` of their choice.

    '
  trans: '

    如果你偏爱 `PHP` 驱动方案的酷炫理念，可以看看 [`Xinc`](http://code.google.com/p/xinc/)。它通过 `PEAR`
    安装（这总是個好主意），但会连带拖入其他几个 `PHP` 组件。我不知道，只做 `PHP` 对我来说并无特别吸引力。


    某些组织也在使用 [`Buildbot`](http://en.wikipedia.org/wiki/BuildBot)，但搜索结果里满是人们讨论它对经验不足的程序员来说有多难用。它是用
    `Python` 编写的，所以如果你有合适的技能，就可以修改它来随心所欲地使用。


    最后，我选择了 [`Jenkins`](http://jenkins-ci.org)。和 `CruiseControl` 一样，它基于 `Java`，但这不是大问题，因为我们工作中的基础设施里已经有
    `Java`，而且还有更多小部分正在迁移到它上面。此外，`Jenkins` 具有我喜欢的那种架构：一个小而紧凑的核心，加上大量插件来添加我想要的功能。使用
    `Subversion`？添加插件。需要运行 [`py.test`](http://codespeak.net/py/dist/test/) 脚本？有插件。想查看你的
    `PHPUnit` 测试结果？也有插件。


    所以，不仅如此，我还可以编写一个在构建触发时运行的 `shell script`。在这种情况下，我使用的是 `post-commit` 触发器来启动构建，但如果我想要更教条一些，我会使用
    `pre-commit` 触发器，并在测试失败时使 `commit` 尝试失败。我记得年轻气盛的我曾在之前的雇主那里大发雷霆，当时在我们的 `CVS` 仓库（是的，我已经足够老到真的用过
    `CVS`）中放置了一个 `hook`，它会对任何签入的代码运行 `syntax checker`。可以预见的是，出现了问题，因为运行在 `CVS` 服务器上的
    `PHP` 版本与我们在 `development` 和 `production` 中使用的版本不同，扩展的差异导致了问题。那是另一个故事。


    我还发现使用 `post-commit` hook 允许我在 `staging` 环境中查看代码，以查找由 `development` 环境与 `staging`
    之间细微差异引起的错误。今天，我通过使用 `PHP 5.3` 中可用的新三元运算符快捷方式修复了一个错误。每天学点新东西，是我的座右铭。


    那么，构建实际上是如何工作的？以下是我的设置方式：


    1. 开发人员将代码提交到 `SVN` 仓库的 `trunk`。我们目前不使用 `branches`，所以如果我们在 `branches` 中工作然后合并到
    `trunk`，我就需要调整设置。

    2. 当 `Jenkins` 看到 `commit` 时就会唤醒，并将代码检出到 `workspace`。

    3. 然后 `Jenkins` 运行一系列 `shell script` 命令来做很多事情：运行我的 `Doctrine` 迁移脚本，运行我的 `PHPUnit`
    测试，运行我的 `py.test` 测试，然后将代码复制到 `staging` 服务器上。

    4. 创建一堆可在 `Jenkins` 本身中查看的 `test` 报告

    5. 向我们的技术邮件列表发送 `email`，通知人们构建已被触发以及结果


    我必须说，没有什么比看到构建成功更能让我感到自鸣得意的……也没有什么比看到构建失败更让我咒骂的了。但如果没有这些测试，我就不会发现本会进入生产环境的错误。任何进入生产环境的错误都很糟糕，而且尽管我在工作中经常使用绞刑架幽默来试图转移对这种事情的内心愤怒，但确实有可能进行生产推送的新代码不包含错误。


    作为这一想法的后续，我现在有一个政策：每当在 `staging` 或 `production` 中发现错误时，我都会编写一个 `test` 来重现该错误，然后放入代码来修复它。我发现这会产生有趣的效果，给你一大堆
    `unit` 和 `integration` 测试（感谢在 `Zend_Framework` `PHPUnit` 测试中能够测试 `controllers`
    输出的能力），这些测试涵盖了真实用户发现的 `edge cases`。此外，你可能会深陷“我们需要创建 `fixtures` 才能测试操作动态生成内容的东西”这个兔子洞。我今天看到一个
    `test` 可以从使用 `fixtures` 中受益，而不是简单地假设 `data` 总会存在。效果因人而异，但你必须明白，如果你没有实现生产出满足实际使用它的人目标的工作
    `application` 的目标，对 `testing` 的奴性奉献对你没有任何好处。


    我希望这篇文章能帮助你在决定是否要进行 `CI` 跨越时。我对花费的时间长度没有任何遗憾，以使 `Jenkins` 配置达到令人满意的状态。自动化构建的好处，其目标是保护你免受你自己的伤害，远远超过了几个下午挠头试图弄清楚
    `Jenkins` 本身发生了什么。


    ## 12 基础设施债务


    *这篇文章最初于 2011 年 11 月发布为博客文章，获得了关注并最终登上了 Hacker News。它与构建可测试应用程序的概念直接相关。希望你喜欢它。*


    你可能遇到过“`technical debt`”这个术语，用来描述随着 `application` 增长和需求变化而在你的 `code base` 中犯下的小错误。如果你不非常小心地进行这些更改，你最终会得到一个大乱摊子。如果你曾经在担心改动会破坏某些东西而不敢更改的
    `application` 上工作过，那么你就遇到了 `technical debt`。


    积累 `technical debt` 非常容易：你因为感到有压力要完成任务而放入一个快速的 `hack`。需要勇气来反驳并说“不，该死，我需要时间来正确修复这个问题！”。我理解，这没关系。如果拥抱能让你感觉更好，我们可以拥抱一下。


    `Technical debt` 可以通过无情的 `refactoring` 以及用 `tests` 包裹你的 `application` 来处理，这些 `tests`
    会刺探你的 `application` 处理的 `edge cases`。但你最终会处理另一种债务。那是一种更难以处理和改变的债务。我称之为 `infrastructure
    debt`。


    `Infrastructure debt` 是你因为没有关注创建 `application` 将存在的 `environments` 的过程，也没有关注你的
    `code` 如何从 `development` 进入 `production` 的过程而积累的债务。在我看来，`Infrastructure debt`
    比 `technical debt` 更难“偿还”。为什么？人们往往很难理解它甚至存在。


    在我继续之前，如果你没有使用 `version control system` 来跟踪对你的 `code` 的更改，请停止阅读并去安装一个。用 `.1` 和
    `.old` 这样的扩展名保存文件版本是你可能拥有的最糟糕的 `infrastructure debt`。现在是 21 世纪的第二个十年。`Version
    control` 是一个近 40 年历史、已被充分理解的概念。如果坚持认为 `version control` 对你毫无用处，我建议的任何东西都不会奏效。传递
    `diff` 补丁不是 `version control`，我的朋友们。那是否认。不要告诉我，仅仅因为过去人们这样做，现在在所有可用选项面前就没问题了。人们曾经也认为地球是平的。


    让我们从一个容易偿还的 `infrastructure debt` 开始：`development environments` 的不一致。如今，对于某人来说，为其选择的
    `language` 创建 `development environment` 以及相关的组件如 `databases` 变得相当容易。问题是什么？就是某人很容易创建自己选择的
    `development environment`。

    '
