    # 构建可测试的应用


    ## 引言


    我希望传达我对构建易于测试的应用的想法，并向你展示我用来让工作更轻松的一些技术。在本指南中，你将学习如何为你的应用创建合适的环境、一个名为 `Dependency
    Injection` 的编程概念，以及从命令行测试应用输出的一些最佳实践。


    我真的认为，Web 应用的最佳架构是构建小型代码模块，然后将它们集成在一起以解决更大的问题。没有其他灵丹妙药可以构建复杂系统。我曾遇到过一句老话（我找不到出处），它说：“简单系统可以表现出复杂行为，但复杂系统只能表现出简单行为”。


    保持你的模块、组件、库，无论你决定称它们为什么，都要小巧、可读，并且易于验证它们在隔离状态下或集成在一起时是否按预期工作。这样你将拥有一个非常容易编写测试的应用，并为你提供防止回归错误和其他意外道路颠簸的保护。


    目标始终如一：创建一个工作流程，缩短代码从你选择的文本编辑器到生产环境所需的时间，同时尽可能减少错误。


    ## 构建可测试的应用很困难


    如果你是一名 `PHP` 开发者有一段时间，你可能遇到过有人谈论测试代码的好处。[测试驱动开发 (TDD)](https://en.wikipedia.org/wiki/Test-driven_development)、[行为驱动开发
    (BDD)](https://en.wikipedia.org/wiki/Behaviour_driven_development) 和 [功能测试](https://en.wikipedia.org/wiki/Functional_testing)
    只是你可以使用的一些策略。不测试你的代码不应该是选项。


    我也曾在那里：我不相信为我的代码编写测试的价值。我熟悉人们给出的所有借口：


    *   “编写测试会让我变慢。”

    *   “我们为什么不能只在浏览器中手动测试应用？”

    *   “如果我不用写测试，这个功能早就完成了。”


    说实话，这些都只是借口。鉴于 `PHP` 开发者可用的工具，没有理由不为你的应用编写测试。即使是那些抵制你将单元测试包装在单个组件周围的重构努力的可怕“不可测试应用”，也可以在自动化环境中进行测试。


    投资自动化测试的理由很明显：在你的应用进入生产环境之前捕获的任何错误，与在生产环境中修复相比，在资源（金钱、开发时间）方面花费更少。在 [IBM 和 Microsoft
    关于 TDD 的研究](http://www.infoq.com/news/2009/03/TDD-Improves-Quality) 中，他们发现了一些有趣的信息。使用
    `TDD` 的项目比不使用 `TDD` 的项目完成时间长 20-40%。然而，生成的应用在生产环境中发现的错误少了 40-90%。如果你恰当地调整统计数据，20%
    的额外时间换取 90% 更少的错误听起来如何？谁能对这种交易说不？


    [`PHPUnit`](https://github.com/sebastianbergmann/phpunit/)，测试 `PHP` 代码的黄金标准，可以轻松集成到几乎任何项目中。通过
    [`PEAR`](http://pear.php.net) 安装它，在你的应用中为测试创建一个目录，然后开始编写它们。然而，有时并非如此简单。并非每个应用都已为测试做好准备。


    你是否使用第三方系统进行用户身份验证？你将不得不弄清楚如何模拟该系统的响应。你为与 Web 服务通信而硬编码了值？你将不得不提取它们并将它们放入配置文件中。现实是，一些应用在你甚至可以测试它们之前需要重构。


    在本指南中，我将向你展示如何构建一个真正可测试的应用。当然我们从零开始，所以更容易，但我也会展示重构可能不太适合测试的代码的替代方案。


    在每一章中，我们将涵盖不同的主题，这将提高你创建可为其创建测试的应用的能力。你可能遇到的一些问题很容易解决，而其他问题可能需要一些侵入性更改才能实现。


    为了说明我认为的创建易于测试的应用的一些最佳实践，我将创建一个示例应用，利用我建议的许多内容。该应用的代码可通过我的 [Github 账户](https://github.com/chartjes/building-testable-applications)
    找到


    我们的配套应用基于一个模拟棒球联盟的网站。我自 1997 年以来一直参加 [互联网棒球联盟](http://www.ibl.org)，并使用现在非常过时的
    [`CakePHP`](http://www.cakephp.org) 版本创建了该网站的这个版本。它确实完成了工作，但我一直想清理引擎盖下的东西并利用 `PHP
    5.3` 的一些功能。


    而不是复制整个应用，我提取了生成网站主页的那些部分。它可能是网站最复杂的面向公众的部分。它结合了多个模型的使用和相当复杂的模板使用。这是一个突出测试验证功能价值的绝佳候选。


    尽管多年来我获得了“框架先生”的声誉，我们在这里根本不会使用框架。我认为重要的是向你展示，尽管 `PHP` 框架世界中的大多数主要参与者使为使用它们构建的应用编写测试变得容易，但你可以为几乎任何应用包装测试。


    我使用了一组合并功能和设计模式。虽然我不沉迷于设计模式，但我相信对症下药。让我们看看我们使用的是什么：


    *   `PHP 5.3.8` 安装在 `OS-X 10.7.2` 上，使用修改后的 [`Homebrew`](http://notfornoone.com/2010/07/install-php53-homebrew-snow-leopard/)
    配方安装

    *   用于代码覆盖率报告的 [`Xdebug`](http://www.xdebug.org) 扩展

    *   用于提升 `PHP` 性能的 [`APC`](http://www.php.net/apc) 扩展

    *   用于模板的 [`Twig`](http://twig.sensiolabs.org)

    *   作为数据存储的 [`Postgres`](http://www.postgresql.org)

    *   [`Pimple`](http://pimple.sensiolabs.org)，一个依赖注入容器，用作应用其他部分所需的对象和值的注册表


    我还在我的 `MacBook` 上的 `Ubuntu 10.04` (`Lucid`) 虚拟机中测试了此应用。关于虚拟机在测试中的作用，将在后面的章节中详细介绍。


    对于应用架构，我决定为应用的每个部分采用 `Page Controller` 结构。如果你使用过框架，你使用的是具有 `Front Controller`
    结构的应用。这意味着每个请求都经过单个文件，然后框架本身解释请求并确定需要执行的控制器和操作对。


    如 [Jason Sweat 关于设计模式的精彩书籍](http://www.phparch.com/books/phparchitects-guide-to-php-design-patterns/)
    中所述的 `Data Mapper` 模式用于提供对数据库的访问。如果你认为可能需要更改你的数据存储，无论是迁移到集群解决方案还是切换到其中一种更新的 `NoSQL`
    选项，数据映射器将有助于使该更改更容易。

    '
