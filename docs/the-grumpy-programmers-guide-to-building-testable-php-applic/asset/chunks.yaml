- raw: 'In this guide I have only given you a glimpse at the tests that accompany
    our companion article. Please grab a copy of the code from Github and play around
    with the application and tests yourself. The code can be downloaded at [https://github.com/chartjes/building-testable-applications](https://github.com/chartjes/building-testable-applications)
    and I think having the source code will make a lot of the concepts outlined in
    this guide easier to understand.


    ## 5 Environmental Consistency


    When it really comes down to it, building your application in a way that it can
    be easily tested requires discipline and attention to detail. Lots of it. I tell
    you this because you have to do a lot of work before you’ve even written a line
    of code.


    Undisciplined developers end up experiencing a large number of problems that are
    really fixable. If you’ve ever come across the phrase “well, it worked for me
    on my computer / laptop / slice / EC2 instance” then you will understand what
    I’m getting at. I’ve uttered those words from time to time when 100% convinced
    that my environment wasn’t the problem.


    What can be done to help out with this problem? If you can do only one thing that
    is not related to code to help make your applications easier to test (automated
    or otherwise), make sure that the environment you develop your application in
    is as similar to the environment where it will be deployed as possible. The only
    difference between your development environment and your production environment
    should be the data you are manipulating.


    It is increasingly rare to come across an application that is more than just one
    PHP script that does not rely on other tools. Even look at the simplest programming
    stack available to us: LAMP, or Linux + Apache + MySQL + PHP. A project I am working
    on also includes [MongoDB](http://mongodb.org), [Redis](http://redis.io), APC,
    and [Memcached](http://memcached.org). I’m probably leaving out a few other minor
    components, but even that list shows how complex a relatively simple application
    can get. Whatever components you choose to use, it is vitally important you make
    sure that every environment is using the same one.


    The easiest way to accomplish this is to actually separate your development environment
    from whatever you are doing your development work on. This usually means you have
    two choices: use virtual machines locally or virtual machines remotely.


    My personal preference is to use virtual machines locally. Most modern computers
    can run a 512MB to 1GB virtual machine image without trouble. In fact, you would
    be surprised how responsive a 512MB virtual machine is when doing development
    work, even when running a few extras like MySQL and even Memcached. To do work
    on a local virtual machine, I feel like you really have two choices: [VMWare](http://www.vmware.com/)
    or [Virtualbox](https://www.virtualbox.org/)


    The only real difference between VMWare and Virtualbox is that while VMWare is
    free, it is not open source like Virtualbox. I prefer to use open source solutions
    so I go with Virtualbox. Use whatever tool you feel comfortable using, but they
    both accomplish the same task: letting you run a virtual machine containing the
    operating system of your choice on your own machine. For both choices there is
    an abundance of information on how to set things up so you can even locally edit
    code that is on the virtual machine.


    For VMWare folks, the most comprehensive link I could find on setting things up
    for you to do local development was this blog post about creating a development
    environment for [Drupal using VMWare Fusion and CentOS](http://janaksingh.com/blog/drupal-development-osx-vmware-fusion-and-centos-53-43).


    If you go the Virtualbox route I recommend the use of [Vagrant](http://vagrantup.com),
    a tool that uses Virtualbox to help you build and distribute virtualized environments.
    Once you have things configured just right (you can use tools like [Chef](http://www.opscode.com/chef/)
    or [Puppet](http://projects.puppetlabs.com/projects/puppet/)) you can create developer
    and production instances that can be shared between your team in order to develop
    and test your application. Why is this such a good approach? You can experiment
    with your application and simply trash it if you do things like accidentally delete
    the database or screw up a configuration file for one of the associated components
    your application relies on.


    You don’t have to use Chef and/or Puppet as Vagrant can just use a shell script
    as part of your provisioning process. Technical reviewer and physicist-turned-machine-language-programmer
    Joel Perras had this advice to offer me about Vagrant:


    > *   Use RVM to install the latest Ruby (1.9.3 as of right now), and then install
    Vagrant in its own gemset. This will save you a *lot* of trouble down the road.
    I once had to spend 1.5 days debugging a Vagrant install that would basically
    crash every time it loaded up, and it turned out to be an issue with the Ruby
    version that the developer was using which was different than the one that I had
    been testing it on. The irony of that wasn’t lost on us.


    > *   You don’t need to go crazy using Chef/Puppet for provisioning. Vagrant also
    supports a provisioning method that lets you point it to a shell script that will
    just be executed, so you can fill that simple text file with a few lines of `apt-get
    foo`, and that’ll let you get pretty far without needing the brain twist that
    is Chef/Puppet.


    Now, if you’re not comfortable messing around with virtual machines on your own
    desktop, a great fall-back option is to do your development work on a remote server.
    VPS accounts (Virtual Private Server) are great for this, along with using “cloud
    computing” services like [Rackspace](http://www.rackspace.com) or [Amazon’s AWS](http://aws.amazon.com/)
    to create remote environments that you can do your work in. My current employer
    has our development servers running on Amazon’s EC2 service.


    For those who are comfortable working from a CLI (Command Line Interface) doing
    your development work is as easy as connecting to the remote development instance
    using SSH and then editing code using your choice of editor designed for the CLI
    (Vim or Emacs, usually). For those not so comfortable working like that, with
    a little effort you can edit those files remotely if your GUI editor supports
    connections via SFTP or SSH. I have found that the performance hit from waiting
    to save those files remotely gets annoying real fast when you have to make all
    sorts of little changes. I did not find the experience of using [TextMate](http://macromates.com)
    along with [ExpanDrive](http://expandrive.com) an enjoyable one.


    My crankiness about network latency and how certain plugins for editors like [Vim](http://www.vim.org)
    and Textmate behave over a network connection aside, you should consider the advantages
    that the use of virtual machines for development work can give you. Distributing
    virtual machines configured for the needs of your application is the ultimate
    in consistency.


    We have also witnessed the rise of services like [Orchestra](http://orchestra.io)
    and [Zend PHP Cloud](http://www.zend.com/en/products/php-cloud/) for those looking
    for a managed, pre-configured environment to run their PHP applications in. I
    like these services because they actually help you in terms of consistency. Part
    of the reason is because they themselves have standardized what version of PHP
    they will support, what version of MySQL they will support, and other components
    they offer.


    The difference between something like this and services like EC2 or Rackspace
    is that you can’t really run a version of it in your local development environment.
    While I really like things like Orchestra and PHP Cloud, you have to be careful
    not to deviate too far from the versions being offered when setting up your development
    environment.'
  fmt: '

    In this guide I have only given you a glimpse at the tests that accompany our
    companion article. Please grab a copy of the code from Github and play around
    with the application and tests yourself. The code can be downloaded at [https://github.com/chartjes/building-testable-applications](https://github.com/chartjes/building-testable-applications)
    and I think having the source code will make a lot of the concepts outlined in
    this guide easier to understand.


    ## 5 Environmental Consistency


    When it really comes down to it, building your application in a way that it can
    be easily tested requires discipline and attention to detail. Lots of it. I tell
    you this because you have to do a lot of work before you’ve even written a line
    of code.


    Undisciplined developers end up experiencing a large number of problems that are
    really fixable. If you’ve ever come across the phrase “well, it worked for me
    on my computer / laptop / slice / `EC2` instance” then you will understand what
    I’m getting at. I’ve uttered those words from time to time when 100% convinced
    that my environment wasn’t the problem.


    What can be done to help out with this problem? If you can do only one thing that
    is not related to code to help make your applications easier to test (automated
    or otherwise), make sure that the environment you develop your application in
    is as similar to the environment where it will be deployed as possible. The only
    difference between your development environment and your production environment
    should be the data you are manipulating.


    It is increasingly rare to come across an application that is more than just one
    `PHP` script that does not rely on other tools. Even look at the simplest programming
    stack available to us: `LAMP`, or `Linux` + `Apache` + `MySQL` + `PHP`. A project
    I am working on also includes [`MongoDB`](http://mongodb.org), [`Redis`](http://redis.io),
    `APC`, and [`Memcached`](http://memcached.org). I’m probably leaving out a few
    other minor components, but even that list shows how complex a relatively simple
    application can get. Whatever components you choose to use, it is vitally important
    you make sure that every environment is using the same one.


    The easiest way to accomplish this is to actually separate your development environment
    from whatever you are doing your development work on. This usually means you have
    two choices: use virtual machines locally or virtual machines remotely.


    My personal preference is to use virtual machines locally. Most modern computers
    can run a 512MB to 1GB virtual machine image without trouble. In fact, you would
    be surprised how responsive a 512MB virtual machine is when doing development
    work, even when running a few extras like `MySQL` and even `Memcached`. To do
    work on a local virtual machine, I feel like you really have two choices: [`VMWare`](http://www.vmware.com/)
    or [`Virtualbox`](https://www.virtualbox.org/)


    The only real difference between `VMWare` and `Virtualbox` is that while `VMWare`
    is free, it is not open source like `Virtualbox`. I prefer to use open source
    solutions so I go with `Virtualbox`. Use whatever tool you feel comfortable using,
    but they both accomplish the same task: letting you run a virtual machine containing
    the operating system of your choice on your own machine. For both choices there
    is an abundance of information on how to set things up so you can even locally
    edit code that is on the virtual machine.


    For `VMWare` folks, the most comprehensive link I could find on setting things
    up for you to do local development was this blog post about creating a development
    environment for [Drupal using VMWare Fusion and CentOS](http://janaksingh.com/blog/drupal-development-osx-vmware-fusion-and-centos-53-43).


    If you go the `Virtualbox` route I recommend the use of [`Vagrant`](http://vagrantup.com),
    a tool that uses `Virtualbox` to help you build and distribute virtualized environments.
    Once you have things configured just right (you can use tools like [`Chef`](http://www.opscode.com/chef/)
    or [`Puppet`](http://projects.puppetlabs.com/projects/puppet/)) you can create
    developer and production instances that can be shared between your team in order
    to develop and test your application. Why is this such a good approach? You can
    experiment with your application and simply trash it if you do things like accidentally
    delete the database or screw up a configuration file for one of the associated
    components your application relies on.


    You don’t have to use `Chef` and/or `Puppet` as `Vagrant` can just use a shell
    script as part of your provisioning process. Technical reviewer and physicist-turned-machine-language-programmer
    Joel Perras had this advice to offer me about `Vagrant`:


    > *   Use `RVM` to install the latest Ruby (1.9.3 as of right now), and then install
    `Vagrant` in its own gemset. This will save you a *lot* of trouble down the road.
    I once had to spend 1.5 days debugging a `Vagrant` install that would basically
    crash every time it loaded up, and it turned out to be an issue with the Ruby
    version that the developer was using which was different than the one that I had
    been testing it on. The irony of that wasn’t lost on us.


    > *   You don’t need to go crazy using `Chef`/`Puppet` for provisioning. `Vagrant`
    also supports a provisioning method that lets you point it to a shell script that
    will just be executed, so you can fill that simple text file with a few lines
    of `apt-get foo`, and that’ll let you get pretty far without needing the brain
    twist that is `Chef`/`Puppet`.


    Now, if you’re not comfortable messing around with virtual machines on your own
    desktop, a great fall-back option is to do your development work on a remote server.
    `VPS` accounts (Virtual Private Server) are great for this, along with using “cloud
    computing” services like [`Rackspace`](http://www.rackspace.com) or [Amazon’s
    `AWS`](http://aws.amazon.com/) to create remote environments that you can do your
    work in. My current employer has our development servers running on Amazon’s `EC2`
    service.


    For those who are comfortable working from a `CLI` (Command Line Interface) doing
    your development work is as easy as connecting to the remote development instance
    using `SSH` and then editing code using your choice of editor designed for the
    `CLI` (`Vim` or `Emacs`, usually). For those not so comfortable working like that,
    with a little effort you can edit those files remotely if your GUI editor supports
    connections via `SFTP` or `SSH`. I have found that the performance hit from waiting
    to save those files remotely gets annoying real fast when you have to make all
    sorts of little changes. I did not find the experience of using [`TextMate`](http://macromates.com)
    along with [`ExpanDrive`](http://expandrive.com) an enjoyable one.


    My crankiness about network latency and how certain plugins for editors like [`Vim`](http://www.vim.org)
    and `TextMate` behave over a network connection aside, you should consider the
    advantages that the use of virtual machines for development work can give you.
    Distributing virtual machines configured for the needs of your application is
    the ultimate in consistency.


    We have also witnessed the rise of services like [`Orchestra`](http://orchestra.io)
    and [`Zend PHP Cloud`](http://www.zend.com/en/products/php-cloud/) for those looking
    for a managed, pre-configured environment to run their `PHP` applications in.
    I like these services because they actually help you in terms of consistency.
    Part of the reason is because they themselves have standardized what version of
    `PHP` they will support, what version of `MySQL` they will support, and other
    components they offer.


    The difference between something like this and services like `EC2` or `Rackspace`
    is that you can’t really run a version of it in your local development environment.
    While I really like things like `Orchestra` and `PHP Cloud`, you have to be careful
    not to deviate too far from the versions being offered when setting up your development
    environment.

    '
  trans: '

    在本指南中，我仅向你展示了伴随我们姊妹文章的测试的一瞥。请从 Github 获取代码副本并自行尝试应用程序和测试。代码可以从 [`github.com/chartjes/building-testable-applications`](https://github.com/chartjes/building-testable-applications)
    下载，我认为拥有源代码将使本指南中概述的许多概念更容易理解。


    ## 5 环境一致性


    说到底，以易于测试的方式构建你的应用程序需要纪律和对细节的关注。很多。我告诉你这一点，因为在你甚至写下第一行代码之前，你就必须做很多工作。


    缺乏纪律的开发者最终会遇到大量本可修复的问题。如果你曾经遇到过“好吧，在我的电脑 / 笔记本 / 切片 / `EC2` 实例上它能运行”的说法，那么你就会明白我的意思。当我
    100% 确信我的环境不是问题时，我也时不时会说出这些话。


    这个问题可以如何解决？如果你只能做一件与代码无关的事情来帮助使你的应用程序更易于测试（自动化或其他），请确保你开发应用程序的环境与部署它的环境尽可能相似。你开发环境和生产环境之间的唯一区别应该是你正在操作的数据。


    越来越少见的是遇到一个除了一个 `PHP` 脚本之外不依赖其他工具的应用程序。即使看看我们可用的最简单的编程栈：`LAMP`，即 `Linux` + `Apache`
    + `MySQL` + `PHP`。我正在进行的一个项目还包括 [`MongoDB`](http://mongodb.org)、[`Redis`](http://redis.io)、`APC`
    和 [`Memcached`](http://memcached.org)。我可能遗漏了一些其他次要组件，但即使是这个列表也显示了一个相对简单的应用程序可能变得多么复杂。不管你选择使用哪些组件，确保每个环境都使用相同的一个至关重要。


    实现这一点的最简单方法是实际上将你的开发环境与你进行开发工作的环境分开。这通常意味着你有两个选择：本地使用虚拟机或远程使用虚拟机。


    我个人更喜欢本地使用虚拟机。大多数现代计算机可以在没有任何问题地运行 512MB 到 1GB 的虚拟机镜像。事实上，当进行开发工作时，即使同时运行 `MySQL`
    和 `Memcached` 等一些额外组件，512MB 的虚拟机也会让你惊讶于其响应速度。要在本地虚拟机上工作，我觉得你真的只有两个选择：[`VMWare`](http://www.vmware.com/)
    或 [`Virtualbox`](https://www.virtualbox.org/)


    `VMWare` 和 `Virtualbox` 之间唯一的真正区别是，虽然 `VMWare` 是免费的，但它不像 `Virtualbox` 那样是开源的。我更喜欢使用开源解决方案，所以我选择
    `Virtualbox`。使用你感觉舒适的任何工具，但它们都完成相同的任务：在你自己的机器上运行包含你选择的 operating system 的虚拟机。对于这两种选择，都有大量信息说明如何设置，以便你甚至可以本地编辑虚拟机上的代码。


    对于 `VMWare` 用户，我能找到的最全面的关于为你设置本地开发的链接是这篇关于使用 VMWare Fusion 和 CentOS 创建 Drupal
    开发环境的博客文章 [使用 VMWare Fusion 和 CentOS 创建 Drupal 开发环境](http://janaksingh.com/blog/drupal-development-osx-vmware-fusion-and-centos-53-43)。


    如果你选择 `Virtualbox` 路线，我推荐使用 [`Vagrant`](http://vagrantup.com)，这是一个使用 `Virtualbox`
    帮助你构建和分发虚拟化环境的工具。一旦你将事物配置好（你可以使用像 [`Chef`](http://www.opscode.com/chef/) 或 [`Puppet`](http://projects.puppetlabs.com/projects/puppet/)
    这样的工具），你就可以创建开发人员和生产实例，这些实例可以在你的团队之间共享以开发和测试你的应用程序。为什么这是如此好的方法？你可以尝试你的应用程序，如果做类似意外删除数据库或搞砸应用程序所依赖的关联组件的配置文件的事情，只需将其丢弃即可。


    你不必使用 `Chef` 和/或 `Puppet`，因为 `Vagrant` 可以只使用 shell 脚本作为其配置过程的一部分。技术审阅者和物理学家转机器语言程序员
    Joel Perras 对 `Vagrant` 给了我以下建议：


    > *   使用 `RVM` 安装最新版本的 Ruby（截至目前为 1.9.3），然后在自己的 gemset 中安装 `Vagrant`。这将为你节省 *很多*
    以后的麻烦。我曾经花了 1.5 天调试一个 `Vagrant` 安装，每次加载时基本上都会崩溃，最后发现是开发者使用的 Ruby 版本与我测试时使用的版本不同。讽刺的是，我们并没有错过这一点。


    > *   你不需要为了配置而疯狂使用 `Chef`/`Puppet`。`Vagrant` 还支持一种配置方法，让你可以指向一个 shell 脚本，该脚本将被执行，因此你可以用几行
    `apt-get foo` 填充这个简单的文本文件，这将让你在不需要 `Chef`/`Puppet` 这种脑力扭曲的情况下走得很远。


    现在，如果你不习惯在自己的桌面上摆弄虚拟机，一个很好的后备选择是在远程服务器上进行开发工作。`VPS` 账户（虚拟专用服务器）非常适合此用途，同时使用“云计算”服务如
    [`Rackspace`](http://www.rackspace.com) 或 [亚马逊的 `AWS`](http://aws.amazon.com/)
    来创建你可以工作的远程环境。我的现任雇主将我们的开发服务器运行在 Amazon 的 `EC2` 服务上。


    对于习惯从 `CLI`（命令行界面）工作的用户，进行开发工作就像使用 `SSH` 连接到远程开发实例，然后使用你选择的为 `CLI` 设计的编辑器（通常是
    `Vim` 或 `Emacs`）编辑代码一样简单。对于不太习惯这样工作的人来说，只要你的 GUI 编辑器支持通过 `SFTP` 或 `SSH` 连接，经过一点努力你就可以远程编辑这些文件。我发现当你需要进行各种小改动时，等待远程保存文件带来的性能损失很快就会变得烦人。我并没有发现使用
    [`TextMate`](http://macromates.com) 配合 [`ExpanDrive`](http://expandrive.com) 的体验令人愉快。


    撇开我对网络延迟的牢骚以及某些编辑器插件如 [`Vim`](http://www.vim.org) 和 `TextMate` 在网络连接上的行为不谈，你应该考虑使用虚拟机进行开发工作所带来的优势。为你的应用程序需求配置的虚拟机的分发是最终的一致性。


    我们还见证了像 [`Orchestra`](http://orchestra.io) 和 [`Zend PHP Cloud`](http://www.zend.com/en/products/php-cloud/)
    这样的服务的兴起，它们为那些希望在托管的预配置环境中运行其 `PHP` 应用程序的人提供服务。我喜欢这些服务，因为它们实际上在一致性方面帮助了你。部分原因是它们本身已经标准化了将支持的
    `PHP` 版本、将支持的 `MySQL` 版本以及它们提供的其他组件。


    这种东西与 `EC2` 或 `Rackspace` 等服务之间的区别在于，你实际上无法在本地开发环境中运行它的一个版本。虽然我非常喜欢 `Orchestra`
    和 `PHP Cloud`，但在设置开发环境时，你必须小心不要偏离所提供的版本太远。

    '
