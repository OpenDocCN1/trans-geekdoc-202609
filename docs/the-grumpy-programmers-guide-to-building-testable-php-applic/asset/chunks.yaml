    \ of these resources was how to write applications that you could actually test.\
    \ Sounds like something obvious, at least to me.\n\nThere is an open secret out\
    \ there: some applications can never be tested with automated testing tools. They’re\
    \ built in such a manner that you couldn’t wrap anything beyond tests that examine\
    \ the HTML output from it. That’s really a shame, because these sort of things\
    \ don’t happen on purpose. Like technical debt in your code, it builds up over\
    \ time and at some point you end up with an application that might as well be\
    \ a black box: you put inputs into it and you get output back, and have no easy\
    \ way to determine how to fix things if it sends you back something you don’t\
    \ expect.\n\nBut make no mistake: building a non-trivial testable application\
    \ is something that actually takes experience. A lot of experience. You will mess\
