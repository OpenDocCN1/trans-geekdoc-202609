- raw: "Would you stake your project on complex code written by someone else that\
    \ is simply not testable by you? Perhaps I am not looking at it from the proper\
    \ distance because I am inside the framework-creator culture, but I can’t see\
    \ why you wouldn’t want to provide tests to prove your stuff actually works the\
    \ way you claim it does. Tests prove that the code is behaving the way you expect,\
    \ and code that is testable is also usually easier to modify as time goes on.\
    \ There is some sort of sick joy in making a change to code, running the unit\
    \ tests, and seeing that you didn’t break anything.\n\n## 15 Metatesting: Understanding\
    \ Mock Objects\n\n*This content originally appeared on my blog in March 2012.*\n\
    \nOne of the things that I have learned to quickly appreciate about working at\
    \ [Kaplan Professional](http://kaplanprofessional.com) is the very large suite\
    \ of unit and integration tests. I believe there are 2000+ tests, and although\
    \ there has been a dip in code coverage, it is still impressive to see coverage\
    \ levels for most things in the 65%+ range. We’ll get it back up to where it belongs\
    \ in no time.\n\nWith such an extensive array of tests, I have received an education\
    \ in what it really means to write unit tests for live, production-ready code\
    \ that really takes unit testing seriously. I think the biggest problem that most\
    \ developers face when getting into Test Driven Development is not understanding\
    \ how to efficiently use mock objects.\n\nIf you are really writing your unit\
    \ tests the way you should, each test is focusing on testing one bit of functionality\
    \ in isolation, which means that you will be heavily relying on mock objects to\
    \ make things work. I’ve come up with an example scenario that I hope goes a long\
    \ way to explaining how to effectively use mock objects.\n\nIn these examples\
    \ I am using PHPUnit’s [built-in support](http://www.phpunit.de/manual/3.0/en/mock-objects.html)\
    \ for mock objects. At Kaplan our testing engineer told me that he had tried to\
    \ use [Mockery](https://github.com/padraic/mockery) but there were problems getting\
    \ it to play nicely with the dependency injection container that is in use (it’s\
    \ a customized version of [Pimple](http://pimple.sensiolabs.org)). Can’t argue\
    \ with that. Not until I experiment with Mockery myself to see if it gains us\
    \ anything instead of using what comes with PHPUnit.\n\nSo here is our scenario:\
    \ we have a class called Alpha, that contains a method called munge(). We wish\
    \ to test that method in a unit test. what does this class look like?\n\n```\n\
    <?php\n\nclass Alpha\n{\n    // Omit code showing constructor...\n\n    public\
    \ function munge(Foo $foo, Bar $bar)\n    {\n        $fooDetails = $foo->getDetails();\n\
    \        $fooId = $foo->getId();\n\n        $barStartDate = $bar->getStartDate();\n\
    \        $barEndDate = $bar->getEndDate();\n\n        $source = \"{$fooId}|{$fooDetails}|{$barStartDate}|{$barEndDate}\"\
    ;\n        \n        return md5('rocksalt' . $source);\n    }\n}\n```\n\nMy grumpy\
    \ tester’s eye looks at that and immediately says “we will need to mock those\
    \ Foo and Bar objects to make this test work.” First we need to look at the Foo\
    \ object:\n\n```\n<?php\nclass Foo \n{\n    // Omit code showing how we construct\
    \ a Foo object\n\n    public function getId()\n    {\n        return $this->_id;\n\
    \    }\n\n    public function getDetails()\n    {\n        $tree = $this->_tree;\n\
    \        $branch = $this->_branch;\n\n        return $tree . '->' . $branch;\n\
    \    }\n}\n```\n\nSo it looks like this class represents one “Foo” object in the\
    \ system. I omitted the constructor as it’s not really important to the lesson\
    \ I’m trying to teach here. Let’s assume we have a way to generate a Foo object\
    \ via some sort of mapper.\n\nOur Alpha->munge() method expects to be passed in\
    \ a Foo object and to retrieve info via getDetails() and getId() calls. Let’s\
    \ start our test and mock that up.\n\n```\n<?php\nclass Test extends PHPUnit_Framework_TestCase\n\
    {\n\n    public function testAlphaMunge()\n    {\n        $mockFoo = $this->getMockBuilder('Foo')\n\
    \            ->disableOriginalConstructor()\n            ->getMock();\n      \
    \  $mockFoo->expects($this->atLeastOnce())\n            ->method('getDetails')\n\
    \            ->will($this->returnValue('1->2'));\n        $mockFoo->expects($this->atLeastOnce())\n\
    \            ->method('getId')\n            ->will($this->returnValue('1'));\n\
    \n        // More test fun to come\n    }\n}\n```\n\nWhen you build a mock for\
    \ use in your test, you generally have to do two things:\n\n*   create a mock\
    \ of the object itself\n\n*   tell it what to do when specific methods are called\n\
    \nWhat I’ve done here is pretty standard EXCEPT for the use of that disableOriginalConstructor()\
    \ method. Why is it used? Well, sometimes when you are creating a mock of an object\
    \ it will often have a constructor that accepts parameters. I’m not testing to\
    \ see if we can create the object, I am merely trying to simulate some of the\
    \ methods of that object.\n\nOnce I’ve created the mock of the object, I then\
    \ tell it what to do when I make certain method calls. Clearly I’ve just pulled\
    \ some arbitrary values out of my ass for this example, but usually you can figure\
    \ out what some reasonable return values are supposed to be by, you know, actually\
    \ looking at the code you are mocking.\n\nSo what does our Bar object look like?\n\
    \n```\n<?php\nclass Bar\n{\n    // Same drill, no need to show constructor details\n\
    \    \n    public function getStartDate()\n    {\n        return $this->_startDate;\n\
    \    }\n\n    public function getEndDate()\n    {\n        return $this->_endDate;\n\
    \    }\n}\n```\n\nTime to add a mock Bar to our test\n\n```\n<?php\nclass Test\
    \ extends PHPUnit_Framework_TestCase\n{\n    public function testAlphaMunge()\n\
    \    {\n        $mockFoo = $this->getMockBuilder('Foo')\n            ->disableOriginalConstructor()\n\
    \            ->getMock();\n        $mockFoo->expects($this->atLeastOnce())\n \
    \           ->method('getDetails')\n            ->will($this->returnValue('1->2'));\n\
    \        $mockFoo->expects($this->atLeastOnce())\n            ->method('getId')\n\
    \            ->will($this->returnValue('1'));\n\n        $mockBar = $this->getMockBuilder('Bar')\n\
    \            ->disableOriginalConstructor()\n            ->getMock();\n      \
    \  $mockBar->expects($this->atLeastOnce())\n            ->method('getStartDate')\n\
    \            ->will($this->returnValue('2012-03-27'));\n        $mockBar->expects($this->atLeastOnce())\n\
    \            ->method('getEndDate')\n            ->will($this->returnValue('2012-04-09'));\n\
    \n        // More test fun to come\n    }\n}\n```\n\nA quick note about $this->atLeastOnce():\
    \ when you mock the objects you can tell it how often you expect that method to\
    \ be called. I had a long discussion about this with our testing engineer Will\
    \ Parker after I posted the orginal version of this post.\n\nWe have multiple\
    \ options\n\n*   $this->once() - should be used only when you REALLY want that\
    \ method to be called once\n\n*   $this->atLeastOnce() - should be used when you\
    \ need to do it once but aren’t sure how many times\n\n*   $this->any() - you\
    \ really don’t care how many times it’s called\n\nIf you’re lazy, you’ll go with\
    \ $this->any() so you don’t have to worry about it. After a discussion with Will,\
    \ I have come to like the use of $this->atLeastOnce(). It’s not a deal-breaker\
    \ no matter which one you choose, a lot of it comes down to personal preferences.\n\
    \nSo now we have our two objects mocked. Now we can go back to our test and add\
    \ in the creation of our Alpha class, inject the two mocks into the method we\
    \ are testing, and check for expected results."
