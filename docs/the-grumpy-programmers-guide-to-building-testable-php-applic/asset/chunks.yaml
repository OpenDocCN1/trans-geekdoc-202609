- raw: "```\n<?php\n\n// Now here is our test case\n\ninclude 'test_bootstrap.php';\n\
    \nclass AclTest extends \\PHPUnit_Framework_TestCase\n{\n    ...\n \n    public\
    \ function testDashboardAcl()\n    {\n        // Create a mock object\n      \
    \  $testRequest = $this->getMock(\n            '\\Grumpy\\Request', \n       \
    \     array('getUri')\n        );\n\n        // Create our test response\n   \
    \     $testRequest\n            ->expects()\n            ->method('getUri')\n\
    \            ->with('/dashboard');\n\n        $testUserLevel = 3;\n        $testAcl\
    \ = new \\Grumpy\\Acl($testRequest, $testUserLevel);\n        $response = $testAcl->accessAllowed();\n\
    \        $this->assertTrue($response);\n    }\n\n}\n```\n\nAgain, it might seem\
    \ like extra work just to make a test pass but it illustrates how straight-forward\
    \ it really can be to ensure that your code is decoupled to the point where it\
    \ doesn’t even care what environment it is running in.\n\n## 8 Like An Onion,\
    \ Your Application Has Layers\n\nI think it is obvious that, if you are going\
    \ to be able to test your application with any sort of automated tool, you are\
    \ going to have to split up your business logic from your display logic.\n\nWe’ve\
    \ all built the application that is one big ball of mud. You know, two or three\
    \ PHP scripts that mash together code that checks the value of $\\_GET, then branches\
    \ off to do a MySQL query, then further loops through the result set outputting\
    \ things. All in one place, but tremendously difficult when you need to update\
    \ something. Which you, of course, do live on the server. I’ve been that guy.\
    \ Don’t be that guy any more. Life is too short and too many tools exist for you\
    \ to use that excuse any more.\n\nMost web application frameworks accomplish this\
    \ task by encouraging use of the [Model-View-Controller software architectural\
    \ pattern](http://en.wikipedia.org/wiki/Model-view-controller). Why is this a\
    \ good idea? Because it forces the decoupling of the different layers of your\
    \ application. Unless, of course, the framework itself is not built properly.\
    \ Hey, it happens.\n\nSo take your cue from these web application frameworks.\
    \ Even if you are not going to use one of them because you are using your home-spun\
    \ Precious Snowflake Framework (PSF) at least be smart and build it in such a\
    \ way that you have your business logic in one place, your request-response logic\
    \ in another, and your display logic somewhere else that you can work on them\
    \ in isolation.\n\nThink of these things as layers for your application. To use\
    \ a food analogy, your models, code that represents the data your application\
    \ will use, is the bottom layer of your cake. Your controllers, which are called\
    \ as the result of a specific request and then determine what the correct response\
    \ should be, are the second layer of your cake, maybe with a little filling. Finally,\
    \ your presentation layer is the frosting and delicious toppings for your cake.\
    \ You want to be able to make changes to any of these layers at any time.\n\n\
    I can already hear you saying “But Chris, how often do you really change things\
    \ like that?” More often than I would care to admit. Nobody makes the correct\
    \ choice every single time when they build an application. Now, you might end\
    \ up getting trapped within a particular framework because it requires a lot of\
    \ discipline to only use the parts of a framework that you really need.\n\nWhat\
    \ you really want is an application that consists of well-crafted, well-tested\
    \ reusable components that use a framework as simply the glue to get them to speak\
    \ to each other. I’ve been involved in an open source project known as [Phix](http://www.phix-project.org)\
    \ that is attempting to help build a set of tools to encourage this exact type\
    \ of architecture for your application. But this is not a guide about Phix. We\
    \ can use some of the philosophy behind Phix to help you.\n\nIf you’re serious\
    \ about providing useful tests for your application, you have to follow the mantra:\n\
    \n> If you can’t automate a test for it, then it’s broken.\n\nWhy do I say that?\
    \ If you don’t have a good set of tests then you really don’t know if the application\
    \ is going to behave in a way you expect. Of course there are many barriers to\
    \ making this happen. Almost all of them are because the developer has chosen\
    \ an incorrect solution for the problem. That might be a harsh thing to say, but\
    \ it is usually the truth. I am not an exception to this rule either.\n\nI think\
    \ that testing data models is one area where many beginner to intermediate testers\
    \ make mistakes. They fail to understand that the goal is to ensure that you are\
    \ representing your data in a way that you expect and that you are also able to\
    \ separate the generation of the data from the code that represents it.\n\nI can\
    \ be honest with you because you’ve read my guide this far: testing does take\
    \ a lot of discipline and you often find yourself writing as much support and\
    \ scaffolding code as code that actually works. Personally, I think that most\
    \ of this work is very useful because it is a down payment on the future. All\
    \ this extra work is an attempt to protect your code against unintended consequences.\
    \ In other words, you want your tests to detect if you’ve broken something without\
    \ knowing it.\n\nHere’s an example of what I call scaffolding code that you need\
    \ in order to support the types of tests that provide value. In our test application,\
    \ we have to generate standings. To do this we select a series of Games objects\
    \ across our desired date range, then do a bunch of work to figure out how many\
    \ wins and losses, and then return that list sorted by winning percentage.\n\n\
    Now, if I wanted to, how would I test this thing? The correct way to test it would\
    \ probably involve creating a data fixture file that contains serialized objects\
    \ that represent all the games we wish to generate standings from.\n\nHow do we\
    \ create that fixture?\n\n```\n<?php\n$conn = new PDO(\n    'pgsql:host=localhost;dbname=ibl_stats',\
    \ \n    'stats', \n    'st@ts=Fun'\n);\n\necho \"Collecting all games in our season...\\\
    n\";\n$gameMapper = new \\IBL\\GameMapper($conn);\n$allGames = $gameMapper->findAll();\n\
    echo \"Writing games objects into fixture file...\\n\";\nfile_put_contents('./fixtures/games.txt',\
    \ serialize($allGames));\necho \"Done\\n\";\n```\n\nSince we have the fixture,\
    \ what’s our test look like to make sure that our standings model is working the\
    \ way we want it to work?\n\n```\n<?php\n\n$testGames = unserialize(file_get_contents('./fixtures/games.txt'));\
    \  \n$conn = new \\PDO(\n    'pgsql:host=localhost;dbname=ibl_stats', \n    'stats',\
    \ \n    'st@ts=Fun'\n); \n$testFranchiseMapper = new \\IBL\\FranchiseMapper($conn);\n\
    $testStandings = new \\IBL\\Standings($testGames, $testFranchiseMapper);\n$testResults\
    \ = $testStandings->generateBasic();\n$this->assertTrue(count($testResults) >\
    \ 0);\n$testResult = $testResults['AC']['East'][0];\n$this->assertEquals(1, $testResult['teamId'],\
    \ 'Got expected team ID');\n$this->assertEquals(97, $testResult['wins'], 'Got\
    \ expected win total');\n$this->assertEquals(65, $testResult['losses'], 'Got expected\
    \ loss total');\n$this->assertEquals('--', $testResult['gb'], 'Got expected GB\
    \ total'); \n```\n\nOkay, not bad for a first pass, but do you see the problem\
    \ here? We are using a real Franchise mapper, instead of a mock one. That matters\
    \ because we shouldn’t have to actually talk to a database to get our information\
    \ about what Franchises exist. That would be making the test dependant on our\
    \ database, which we don’t want.\n\nWhat we should do is create another fixture\
    \ that passes in all the Franchise objects that we will need, and then alter the\
    \ Standings model itself internally to rely on those for any info that it wants.\n\
    \nCreate a tool that generates the Franchise fixture based on the data you have\
    \ in your database."
