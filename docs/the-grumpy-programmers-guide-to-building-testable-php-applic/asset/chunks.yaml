  fmt: "\n# Mock Objects and Testing Display Logic\n\n## Mock Objects for Testing\n\
    \nMock objects are created specifically for the purpose of making testing easy.\
    \ At their most basic level you use them to replace an object that might need\
    \ to communicate with the “outside world” such as a database or a 3rd party API.\
    \ There are many different tools that can create mock objects for you (`PHPUnit`\
    \ has built-in [support for it](http://www.phpunit.de/manual/3.6/en/phpunit-book.html#test-doubles))\
    \ but others like to use Padraic Brady’s excellent [`Mockery`](https://github.com/padraic/mockery)\
    \ mock object framework.\n\n## Creating a Facebook Mock Example\n\nIn our hypothetical\
    \ case we want to create a mock object for our `Facebook` object. Here’s how you\
    \ might do it:\n\n```\n<?php\n// Inside your unit test\n$facebookMock = \\Mockery::mock(\n\
    \    '\\FacebookAPI\\Facebook',\n    array(\n        'getEmail' => 'test@littlehart.net',\n\
    \        'getName' => 'Testy McTesterson'\n    )\n);\n\n$sessionContents['email']\
    \ = $facebookMock->getEmail();\n$auth = new AuthUser($sessionContents);\n$this->assertTrue($auth->check());\n\
    ```\n\nNotice how effective the mock object is here. You get all the benefits\
    \ of having an object that matches one that your code is dependent on without\
    \ having to actually speak to `Facebook` in order to make a test. I believe that\
    \ is a win-win situation when it comes to testing.\n\n## Testing Display Logic\n\
    \nTesting your display logic via automated tests is something that often generates\
    \ blank stares when I talk about it. “Why don’t you just test that stuff in a\
    \ browser.” My usual answer is along the lines of “because I’m a human and humans\
    \ make mistakes and skip things when they are testing a web page for the 100th\
    \ time.” Luckily it doesn’t take much work to capture the output of your `PHP`\
    \ application for testing purposes.\n\n### Controller Rendering Example\n\nHere’s\
    \ a snippet from a controller in our sample application\n\n```\n<?php\ninclude\
    \ 'bootstrap.php';                                                        \n\n\
    ...\n\necho $twig->render(\n    'index.html', \n    array(\n        'currentWeek'\
    \ => $currentWeek,\n        'currentResults' => $currentResults,\n        'currentRotations'\
    \ => $currentRotations,\n        'currentSchedules' => $currentSchedules,\n  \
    \      'franchises' => $franchises,\n        'rotationWeek' => $rotationWeek,\n\
    \        'scheduleWeek' => $scheduleWeek,\n        'standings' => $regularStandings,\
    \ \n    )\n);\n```\n\nUsing that same structure we could very easily write a test\
    \ that looks something like this\n\n### Automated Test Example\n\n```\n<?php\n\
    include './test_bootstrap.php';\n\nclass MainPageViewTest extends \\PHPUnit_Framework_TestCase\n\
    {\n    protected $_twig;\n\n    public function setUp()\n    {\n        // also\
    \ include our libraries installed using Composer\n        include APP_ROOT . 'vendor/.composer/autoload.php';\n\
    \n        // We are using Twig for templating\n        $loader = new \\Twig_Loader_Filesystem(APP_ROOT\
    \ . 'templates');\n        $this->_twig = new \\Twig_Environment($loader, array('debug'\
    \ => true));\n        $this->_twig->addExtension(new \\Twig_Extensions_Extension_Debug());\n\
    \    }\n\n    public function tearDown()\n    {\n        unset($this->_twig);\n\
    \    }\n\n    public function testMainPage()\n    {\n        $dbConn = new PDO(\n\
    \            'pgsql:host=localhost;dbname=ibl_stats', \n            'stats',\n\
    \            'st@ts=Fun'\n        );\n        // Load data that we will need for\
    \ the front page\n        $gameMapper = new \\IBL\\GameMapper($dbConn);\n    \
    \    $franchiseMapper = new \\IBL\\FranchiseMapper($dbConn);\n        $rotationMapper\
    \ = new \\IBL\\RotationMapper($dbConn);\n        $scheduleMapper = new \\IBL\\\
    ScheduleMapper($dbConn);\n\n        $games = unserialize(file_get_contents('./fixtures/games.txt'));\n\
    \        $franchises = unserialize(\n            file_get_contents('./fixtures/franchises.txt')\n\
    \        );\n        $standings = new \\IBL\\Standings($games, $franchises);\n\
    \        $regularStandings = $standings->generateRegular();\n        $currentWeek\
    \ = 27;\n        $currentGames = unserialize(\n            file_get_contents('./fixtures/games-27.txt')\n\
    \        );\n        $currentResults = $gameMapper->generateResults(\n       \
    \     $currentGames,\n            $franchises\n        );\n        $rotations\
    \ = unserialize(\n            file_get_contents('./fixtures/rotations-27.txt')\n\
    \        );\n        $currentRotations = $rotationMapper->generateRotations(\n\
    \            $rotations,\n            $franchises\n        );\n        $rawSchedules\
    \ = unserialize(\n            file_get_contents('./fixtures/raw-schedules-27.txt')\n\
    \        );\n        $franchiseMap = unserialize(\n            file_get_contents('./fixtures/franchise-mappings.txt')\n\
    \        );\n        $currentSchedules = $scheduleMapper->generate(\n        \
    \    $rawSchedules,\n            $franchiseMap\n        );\n\n        // Display\
    \ the data\n        $response = $this->_twig->render(\n            'index.html',\
    \ \n            array(\n                'currentWeek' => $currentWeek,\n     \
    \           'currentResults' => $currentResults,\n                'currentRotations'\
    \ => $currentRotations,\n                'currentSchedules' => $currentSchedules,\n\
    \                'franchises' => $franchises,\n                'rotationWeek'\
    \ => $currentWeek,\n                'scheduleWeek' => $currentWeek,\n        \
    \        'standings' => $regularStandings, \n            )\n        );\n     \
    \   $standingsHeader = \"Standings through week 27\";\n        $resultsHeader\
    \ = \"Results for week 27\";\n        $rotationsHeader = \"Rotations for Week\
    \ 27\";\n        $scheduleHeader = \"Schedule for Week 27\";\n        $rotation\
    \ = \"KC Greinke, CHN Lilly -2, CHN Wells -2\"; \n        $this->assertTrue(stripos($response,\
    \ $standingsHeader) !== false);\n        $this->assertTrue(stripos($response,\
    \ $resultsHeader) !== false);\n        $this->assertTrue(stripos($response, $rotationsHeader)\
    \ !== false);\n        $this->assertTrue(stripos($response, $scheduleHeader) !==\
    \ false);\n\n        // Look for a known team abbreviation\n        $this->assertTrue(stripos($response,\
    \ \"MAD\") !== false);\n\n        // Look for a specific rotation to appear\n\
    \        $this->assertTrue(stripos($response, $rotation) !== false);\n    }\n\
    }\n```\n\n## Verifying HTML Output\n\nSo what is the best way to look for the\
    \ data inside our HTML output? You have two options in my opinion.\n\n### String\
    \ Search Approach\n\nIf you’re looking for a specific string to appear in the\
    \ HTML output, like say a message that you successfully created a new widget,\
    \ then you are probably better off using `PHP`’s built-in string searching functions.\n\
    \n```\n<?php\n\n$standingsHeader = \"Standings through week 27\";\n$resultsHeader\
    \ = \"Results for week 27\";\n$rotationsHeader = \"Rotations for Week 27\";\n\
    $scheduleHeader = \"Schedule for Week 27\";\n$rotation = \"KC Greinke, CHN Lilly\
    \ -2, CHN Wells -2\"; \n$this->assertTrue(stripos($response, $standingsHeader)\
    \ !== false);\n$this->assertTrue(stripos($response, $resultsHeader) !== false);\n\
    $this->assertTrue(stripos($response, $rotationsHeader) !== false);\n$this->assertTrue(stripos($response,\
    \ $scheduleHeader) !== false);\n\n// Look for a known team abbreviation\n$this->assertTrue(stripos($response,\
    \ \"MAD\") !== false);\n\n// Look for a specific rotation to appear\n$this->assertTrue(stripos($response,\
    \ $rotation) !== false);\n```\n\n### Structured Output Verification\n\nIf you\
    \ are trying to make sure that your output is formatted in a specific way, you\
    \ should probably be looking to use a tool like `PHP`’s bulit-in `SimpleXML` functions\
    \ to load your output, create XML out of it (after all, HTML is really a subset\
    \ of XML) and then use the `xpath()` method. Learning [`XPath`](http://en.wikipedia.org/wiki/Xpath)\
    \ is not the easiest thing to do. I did a lot of work with it when I used to work\
    \ for a sports data integration company that provided XML data feeds. But if you\
    \ want to write a test to make sure that your error messages are being correctly\
    \ wrapped in the proper CSS class, well, there really isn’t any other way to make\
    \ it happen.\n\nSo if you wanted to look for, say, a specific `<div>` tag in the\
    \ output being generated, I think the test would look a little like this with\
    \ a little help from a third-party library called [`Zend_Dom_Query`](http://framework.zend.com/manual/en/zend.dom.query.html).\n"
  trans: "\n# 模拟对象与测试显示逻辑\n\n## 用于测试的模拟对象\n\n模拟对象是专门为使测试变得容易而创建的。在最基本层面上，你使用它们来替换可能需要与“outside\
    \ world”通信的对象，例如数据库或第三方 API。有许多不同的工具可以为你创建模拟对象（`PHPUnit` has built-in [支持它](http://www.phpunit.de/manual/3.6/en/phpunit-book.html#test-doubles)）但其他人喜欢使用\
    \ Padraic Brady’s excellent [`Mockery`](https://github.com/padraic/mockery) mock\
    \ object framework。\n\n## 创建 Facebook 模拟示例\n\n在我们的假设案例中，我们想要为我们的 `Facebook` 对象创建一个模拟对象。以下是你可以这样做的方式：\n\
    \n```\n<?php\n// Inside your unit test\n$facebookMock = \\Mockery::mock(\n   \
    \ '\\FacebookAPI\\Facebook',\n    array(\n        'getEmail' => 'test@littlehart.net',\n\
    \        'getName' => 'Testy McTesterson'\n    )\n);\n\n$sessionContents['email']\
    \ = $facebookMock->getEmail();\n$auth = new AuthUser($sessionContents);\n$this->assertTrue($auth->check());\n\
    ```\n\n注意这里模拟对象有多有效。你可以获得拥有一个与你的代码依赖的对象匹配的对象的全部好处，而无需实际与 `Facebook` 通信来进行测试。我认为在测试方面这是一种双赢的情况。\n\
    \n## 测试显示逻辑\n\n通过自动化测试来测试你的显示逻辑是我谈论时经常会让人一脸茫然的事情。“Why don’t you just test that\
    \ stuff in a browser.” 我通常的回答是“because I’m a human and humans make mistakes and\
    \ skip things when they are testing a web page for the 100th time.” 幸运的是，捕获你的\
    \ `PHP` 应用程序的输出用于测试目的并不需要太多工作。\n\n### 控制器渲染示例\n\n这是我们示例应用程序中控制器的一个片段\n\n```\n\
    <?php\ninclude 'bootstrap.php';                                              \
    \          \n\n...\n\necho $twig->render(\n    'index.html', \n    array(\n  \
