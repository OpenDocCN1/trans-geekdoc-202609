    class StandingsTest extends \\PHPUnit_Framework_TestCase\n{\n    public function\
    \ testGenerateRegular()\n    {\n        $data = file_get_contents('./fixtures/games.txt');\n\
    \        $testGames = unserialize($data);\n        $data = file_get_contents('./fixtures/franchises.txt');\n\
    \        $testFranchises = unserialize($data);\n        $testStandings = new \\\
    IBL\\Standings($testGames, $testFranchises);\n    \n        // Rest of the test\
    \ is the same\n    }\n}\n```\n\nI wasn’t kidding that it requires a lot of extra\
    \ code to support a test suite that does anything other than a very superficial\
    \ set of tests. At the same time, the gyrations often required to provide this\
    \ extra support gives you a very good (and often brutal) look at the design of\
    \ your code.\n\nIf you’ve noticed, I’m doing this using what people would normally\
    \ consider fixtures when doing unit testing. The most common method is to use\
    \ database fixtures and then pull in some sort of library that handles turning\
    \ those fixtures into data. You then are able to use some sort of mock object\
    \ that acts like a database connection as far as your tests are concerned.\n\n\
    There are times when you do need database fixtures. Maybe you cannot decouple\
    \ things in the way I have been able to. If you want to go the route of using\
    \ database fixtures then I recommend you take a look at [Phactory](http://phactory.org).\
    \ It provides a simpler, code-driven way to create database fixtures and is an\
    \ ideal fit if your application is using PDO.\n\nEither way, you have to be aware\
    \ of the drawbacks of using fixtures. When you change a test you will find yourself\
    \ having to change the fixtures as well. It also slows down your tests when it\
    \ has to load fixtures either the traditional way or my way of creating data objects.\
    \ The slower your tests, the more likely developers will try and skip running\
    \ the full test suite.\n\nFor this sample application, creating new data fixtures\
    \ if my tests change is simple because I wrote small scripts to actually create\
    \ them. Modify the fixture creation script, run it again, and I have a newly updated\
    \ data fixture. It’s certainly a lot easier than manually editing a large number\
    \ of XML files if your tests require different data.\n\nIn other words: be smart\
    \ about how much data you are importing for testing purposes. Chances are that\
    \ you do not need a complete data set, just a small slice of data in order to\
    \ validate functionality. If you can refactor your code to use objects instead\
    \ of mocking out database connections, that’s even better.\n\nHere’s another mantra\
    \ you should take to heart:\n\n> If it’s not yours, wrap it up.\n\nIf you are\
    \ using a 3rd-party API to do something like user authentication you will quickly\
    \ discover that it becomes very difficult to test. A typical scenario might be\
    \ where this 3rd-party API requires a redirect to their site where the user fills\
    \ out some information and then they are returned to your application with some\
    \ sort of token that says you are who you claim to be. Now this is good for you\
    \ because it removes the burden of managing those credentials yourself, but bad\
    \ because how do you test such a thing?\n\nYou might be lucky and the application\
    \ you are using has a way to capture the request and response cycle. The sample\
    \ application for this guide does not, so let’s think of how you could use something\
    \ like Facebook Connect.\n\nThe answer is, of course, that you place your use\
    \ of a 3rd party authentication service inside a wrapper. Stay with me as I explain\
    \ the logic.\n\nInstead of thinking “how do I create a test where I talk to Facebook”\
    \ you turn it on it’s head and say “how do I create a test for an authentication\
    \ service that uses Facebook Connect as it’s data source?”. I hope you can see\
    \ the difference.\n\nThe normal way of using Facebook Connect is that you use\
    \ their own SDK (or if you are a masochist you write your own [OAuth](http://en.wikipedia.org/wiki/Oauth)\
    \ implementation) which basically redirects the user to Facebook, where they enter\
    \ their login credentials for the site. If their credentials are good, they are\
    \ redirected back to your application along with a token that you then can use\
    \ to get information about the user.\n\nIn cases where I myself have used Facebook\
    \ Connect for authentication purposes I tend to store information about the user\
    \ in the session and then refer to it later. Here’s an example of what I mean:\n\
    \n```\n<?php\n// Assume $facebookUser is the object representing info about our\
    \ user\n\n$_SESSION['email'] = $facebookUser->getEmail();\n$_SESSION['name'] =\
    \ \n     $facebookUser->getFirstName() . \n     ' ' . \n     $facebookUser->getLastName();\n\
    \n// In other parts of the app when I need to check if the user is\n// authenticated\
    \ properly\n\nif (isset($_SESSION['email'])) {\n    // Execute the desired functionality\n\
    } else {\n    // Redirect user to log in with Facebook Connect\n}\n```\n\nAs an\
    \ aside, I tend to put the code that checks if a user is properly authenticated\
    \ in whatever structure best suits the framework I am using for the project. Some\
    \ frameworks make it easier than others to execute code in a controller before\
    \ it runs your action-specific code.\n\nHowever, if you look at my little sample\
    \ above you can see why that would be so difficult to test: we’re relying on having\
    \ information stored in the session. How could we attempt to fix this?\n\nThe\
    \ first thing we need to do is stop doing that direct check of the contents of\
    \ the session and create an object that handles the task of telling us if we are\
    \ authenticated or not.\n\n```\n<?php\n// New object that holds info about your\
    \ Authenticated user\n\nclass AuthUser\n{\n\n    ...\n\n    public function check()\n\
    \    {\n        return (isset($_SESSION['email']));\n    }\n}\n\n// Then in the\
    \ controller where you check authorization...\n\n$authUser = new AuthUser();\n\
    \nif ($authUser->check() === true) {\n    // Execute the desired functionality\n\
    } else {\n    // Redirect user to log in with Facebook Connect\n}\n```\n\nThat’s\
    \ better, but we’re still relying on a session being available. How can we reduce\
    \ that particular dependency?\n\n```\n<?php\n\nclass AuthUser\n{\n    protected\
    \ $_sessionObject;\n\n    public function __construct($sessionContents)\n    {\n\
    \        $this->_sessionContents = $sessionContents;\n    }\n   \n    public function\
    \ check()\n    {\n        return (isset($this->_sessionContents['email']));\n\
    \    }\n}\n```\n\nNow we’re making even more progress. Now let’s imagine we are\
    \ wanting to test some controller logic. In our sample application we are aiming\
    \ to be able to load controller code independently of the environment we are in.\
    \ This means that we have to make sure that we do not depend on the existence\
    \ of things like $\\_SESSION in this code.\n\nHowever there are also some additional\
    \ concerns. To run our test we do not want to have to worry about actually connecting\
    \ to Facebook in order to get info about the user. This is where the concept of\
    \ mock objects can be added to our toolkit."
