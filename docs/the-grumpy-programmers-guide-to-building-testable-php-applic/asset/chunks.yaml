- raw: 'You end up with your developers all having environments that are slightly
    different due to choice of source for packages or preferences on versions of components.
    I have PHP 5.3.8 via a custom Homebrew recipe while one of my co-workers has the
    stock version of PHP that comes with OS-X Snow Leopard. He has a version of MySQL
    that is two versions ahead of mine. See how easy it is to get out of sync?


    You have two options. The first one is the draconian one, where you force everyone
    to use the same operating system and the same tools to minimize the chances of
    conflicts between development environments. Given how that leads to developer
    unhappiness, I prefer a more sane approach: use tools like [VMWare](http://www.vmware.com)
    or [VirtualBox](http://www.virtualbox.org) to let your developers do their work
    on identical virtual machines while giving them the freedom to use the development
    and debugging tools of their own choosing.


    Also, by using a virtual machine you can encourage developers to push the envelope
    and test destructive things like library upgrades or database changes. Messed
    it up? Just fire up a new virtual machine and try again. When you combine it with
    good version control practices you should be able to recover from your mistakes
    even faster.


    Just make sure to take the time to create virtual machines that are as close to
    an exact match of your production systems as you can. Honestly, the only difference
    between your development environment and your production environment should be
    the data your application is manipulating. It’s not really that hard to even create
    a cluster of virtual machines on your own computer to simulate an architecture
    that has application servers, a database server and a memcached server.


    It also helps you to get new developers up to speed quickly. “Oh, working on Project
    Alpha? I’ll email you the link on the wiki where you can download the virtual
    machine for that project.”


    Check out [Vagrant](http://vagrantup.com) for a great option for developers wishing
    to do their work in a virtual machine.


    So, having injected some structure into your development environment there is
    really one last frontier where infrastructure debt builds up like the credit card
    bills of a shopaholic: deployment processes.


    I really think there is one rule: if you cannot do your deployments with one command
    then you are DOING IT WRONG. If you can type the commands you are doing into a
    shell then you can script them so you don’t have to type them in again. If you
    can script deployment, then you can automate deployment. If you can automate deployment
    then you now have a consistent and repeatable process that will behave the same
    way every single time you deploy.


    At [Moontoast](http://www.moontoast.com) we have automated deployment in place.
    When we merge code into our staging and production branches, a version control
    hook triggers our deployment tool. It checks out our code into it’s proper location
    on the production server. It runs database migrations that need to be done. It
    starts and restarts various services that are used by the application. In short,
    it does everything that I see far too many of my colleagues doing manually. Stop
    that. Clean up your infrastructure debt by making the process of deploying your
    code a non-event.


    If you want to automate your deployment process, examine tools like [Capistrano](https://github.com/capistrano/capistrano/wiki)
    or [Phing](http://www.phing.info/trac/) or you could even use a tool like [Jenkins](http://jenkins-ci.org)
    and use it’s concept of Builds to automate the process of taking your latest code
    changes into production.


    Note that I said the PROCESS, because technical debt might mean that your application
    is fragile enough (doesn’t have enough tests and/or test coverage) that the changes
    you made might cause it to behave improperly or even crash the system altogether.
    Not a good feeling, so by investing the time into automating your deployment process
    you can eliminate at least one headache.


    I think the main point I am trying to get across with respect to infrastructure
    debt is that you really need to examine your processes beyond just coding. If
    you find yourself constantly fighting the “works on my computer” battle, you likely
    have serious infrastructure debt. If you find yourself constantly referring to
    a checklist whenever you do a deployment, you likely have serious infrastructure
    debt.


    Whenever I bring this topic up, I hear many of the same excuses that I hear when
    I advocate a commitment to writing tests and automating the execution of those
    tests. What is it that people have against this sort of thing?


    I have found that people terribly underestimate the amount of manual work they
    do to accomplish a task. For many, it is a fear of losing control that leads them
    to conclude that automated deployment cannot be trusted, or that developers shouldn’t
    have the freedom to pick the tools that they use to build their applications.


    Technical debt is real, make no mistake. But so is infrastructure debt. Just like
    the cost of finding bugs in production is more than finding them in development,
    the cost of fixing infrastructure debt gets more and more expensive. Just think
    of the large number of problems solved by eliminating inconsistencies between
    development environments. Add to that the ability to eliminate user error during
    manual deployments of your application. Why would you not want to have this?


    The decision to start paying down your infrastructure debt is not an easy one,
    because it will often require many changes to be made by many people. Most programmers
    are creatures of habit and dislike change, even when it is obviously better. Don’t
    be scared of change, be scared of the debt growing in your code base and in your
    infrastructure. It won’t go away and there is no government bailout on the way
    to fix it.


    ## 13 Fear is the mind-killer


    *This content orginally appeared on my blog in March 2011. It discusses how fear
    can prevent you from doing the necessary work to make your applications easy to
    test. Hope you enjoy it*


    Dune is probably my favourite science-fiction novel of all time. It’s in a cool
    setting, with some really well-designed characters, and is a sprawling epic in
    the way that sprawling epics should be. In that book, the main character Paul
    Atreides learns the ways of the mysterious Bene Gesserit through his mother. One
    of the things he learns is called the *litany against fear*, something they say
    to themselves whenever they are in danger:


    > *I must not fear.* Fear is the mind-killer. Fear is the little-death that brings
    total obliteration. I will face my fear. I will permit it to pass over me and
    through me. And when it has gone past I will turn the inner eye to see its path.
    Where the fear has gone there will be nothing. Only I will remain.


    Living on the bleeding edge of technology means you spend a lot of time trying
    to convince the people around you that this awesome bit of technology that you’ve
    noticed is worth investigating. I remember being mocked and dismissed over my
    thoughts on [memcached](http://www.memcached.org/) in 2003. And being mocked and
    dismissed on my thoughts on how valuable writing automated tests could be for
    an out-of-control code base in 2004. It’s now 2011 and both of those things are
    considered integral parts of best practices for web applications.


    Some of the problems I faced were due to an abrasive personality very early in
    my programming career (although some would argue that not much has changed) that
    resulted in ideas being rejected because of who the messenger was. Let’s be honest,
    we’ve all done that: dismissed information because of who was delivering it. I’ve
    gotten used to facing the uphill battle to get my particular set of programming
    practices accepted but it is a battle I’m winning.'
