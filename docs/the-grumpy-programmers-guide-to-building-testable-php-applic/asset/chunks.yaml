    \ => $rotationWeek,\n        'scheduleWeek' => $scheduleWeek,\n        'standings'\
    \ => $regularStandings, \n    )\n);\n```\n\n使用相同的结构，我们可以非常轻松地编写一个看起来像这样的测试\n\n\
    ### 自动化测试示例\n\n```\n<?php\ninclude './test_bootstrap.php';\n\nclass MainPageViewTest\
    \ extends \\PHPUnit_Framework_TestCase\n{\n    protected $_twig;\n\n    public\
