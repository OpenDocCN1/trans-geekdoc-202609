    开始偿还基础设施债务的决定并不容易，因为它通常需要许多人做出许多改变。大多数程序员都是习惯性动物，即使改变明显更好，他们也不喜欢改变。不要害怕改变，要害怕债务在你的代码库和基础设施中不断增长。它不会消失，也没有政府救助即将到来修复它。


