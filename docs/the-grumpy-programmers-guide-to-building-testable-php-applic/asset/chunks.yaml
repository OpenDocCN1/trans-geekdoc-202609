    \ we needed outside of the `ACL` object itself. How could you deal with this if\
    \ your script is not running in the context of a web request?\n"
  trans: "\n# 依赖注入容器\n\n## 管理复杂对象\n\n在某个阶段，你的应用变得足够大，你会发现自己不仅要管理大量对象，还要管理复杂的对象。你可能会问自己如何为了依赖注入的目的移动这些对象。处理此问题的最佳方法是把你知道需要移动的对象放入容器中，然后在需要时简单地检索它们。\n\
    \n## Web 应用框架\n\n那么什么样的应用需要这种东西？能最大程度利用 DIC 的首选对象是 Web 应用框架。为什么？大多数框架都高度面向对象，并使用大量对象来完成任务。如果你把用户很可能需要频繁使用的对象放在容器中，可以让框架用户更容易使用。然后它们可以被检索以供以后使用，已经配置好并且准备就绪。\n\
    \n## 使用 Pimple 的示例\n\n考虑我们具有 `Model` 和 `Mapper` 结构的应用。我们可以使用容器来存储数据库连接对象，而不是每次都自己创建实例。在这里，我们将使用\
    \ `Pimple` 作为我们的 DIC。\n\n```\n<?php\n\n// Inside our bootstrap\n\n// Create our\
    \ container\n$container = new \\Pimple();\n\n// Inject our DB connection object\
    \ for later reuse\n$container['db_connection'] = function ($c) {\n    return new\
    \ PDO(\n        'pgsql:host=localhost;dbname=ibl_stats', \n        'stats',\n\
    \        'st@ts=Fun'\n    );\n};\n\n\n// Then in a controller somewhere...\n$mapper\
    \ = new IBL\\FranchiseMapper($container['db_connection']);\n```\n\n这种做法的好处是现在你的对象真的不需要知道任何关于它们正在使用的其他对象或参数的信息。如果你真的想对这种事情完全发疯，你可以在\
    \ `bootstrap` 中提前创建所有你的 `Mapper` 实例，然后在需要时直接从容器中取出它们。\n\n```\n<?php\n\n// In the\
    \ bootstrap, after having already added\n// in the database connection\n$container['franchise_mapper']\
    \ = function ($c) {\n    return new \\IBL\\FranchiseMapper($c['db_container']);\n\
    };\n$container['game_mapper'] = function ($c) {\n    return new \\IBL\\GameMapper($c['db_container']);\n\
    };\n```\n\n我并不是说这是最佳实践，但它说明了 DIC 的正确使用可以在很大程度上使你的应用程序符合德米特法则所倡导的原则。\n\n## 优点与注册表模式\n\
    \n那么，现在我们有了依赖注入容器，还能做什么呢？使用它！在很多方面，你也可以把它看作是“增强版注册表”。我通常使用充当信息注册表的组件。我存储在整个应用程序中需要持久保存的各种值，然后通过对这个\
    \ `registry` 或 `configuration` 对象或其他你想称呼它的调用来按需检索它们。\n\n使用容器来管理依赖的另一个原因是它创建了一个可以找到它们的地方。没有它，你的代码会充斥着在注入之前实例化这些依赖的请求。再次想象这样一个场景：你正在将数据映射器从使用\
    \ `Postgres` 作为后端切换到使用 `MongoDB` 的映射器：遍历所有代码并替换所有创建旧映射器并替换为新映射器的实例会有多痛苦？如果你使用容器，你只需要在\
    \ `bootstrap` 中更改它。\n\n能够在需要注入时提取依赖项，在尝试构建可测试的应用时很有帮助。它节省了你在每次使用前实例化它们的麻烦，而且如果你使用容器，你可以返回一个已经按你需要配置好的对象。\n\
    \n## 滥用容器\n\n使用 DIC 也很容易被滥用。假设你有一个名为 `Omega` 的对象，它有三个你需要传入的依赖项：\n\n```\n<?php\n\
    \nclass Omega\n{\n    protected $foo;\n    protected $bar;\n    protected $bizz;\n\
    \n    public function __construct($foo, $bar, $bizz)\n    {\n        $this->foo\
    \ = $foo;\n        $this->bar = $bar;\n        $this->bizz = $bizz; \n    }\n\
    }\n\n$dep1 = new Foo();\n$dep2 = new Bar();\n$dep3 = new Bizz();\n$newOmega =\
    \ new Omega($dep1, $dep2, $dep3);\n```\n\n你决定聪明地使用依赖注入容器来存储东西。然后你想“为什么我不直接传入容器，因为东西已经在里面了？”\n\
    \n```\n<?php\n\nclass Omega\n{\n    protected $foo;\n    protected $bar;\n   \
    \ protected $bizz;\n\n    public function __construct($container)\n    {\n   \
    \     $this->foo = $container['foo'];\n        $this->bar = $container['bar'];\n\
    \        $this->bizz = $container['biz']; \n    }\n}\n\n$container['foo'] = new\
    \ Foo();\n$container['bar'] = new Bar();\n$container['bizz'] = new Bizz();\n$newOmega\
    \ = new Omega($container);\n```\n\n现在，假设我被分配在正常的开发流程中审查这段代码。我会看一下并立即指出你现在已经将依赖注入容器与\
    \ `Omega` 耦合了。\n\n“如果以后你更改容器呢？那么你就必须遍历所有使用容器的现有代码并重新处理它们！”\n\n如果你要使用依赖注入容器（我强烈推荐在中等到大型复杂度的应用中使用），那么只把它当作容器对待，并在将依赖项注入对象之前从中检索它们。\n\
    \n依赖注入是我认为每个开发人员都需要理解的概念，即使他们更喜欢不使用它。我也认为依赖注入是创建可以以最低摩擦与其他对象集成对象的关键部分。\n\n## 测试、模拟对象与\
    \ CLI 兼容性\n\n你可以在测试中借助模拟对象来减少代码的紧密耦合。模拟对象的概念非常简单：你创建一个对象在测试中的依赖项的表示，然后只为该对象创建测试成功所需的那些功能。这里有一个示例，结合了模拟对象的使用，并确保你的代码可以在\
    \ Web 和 `CLI` 上运行。\n\n`PHP` 能够解决 Web 1.0 的问题并取得成功的部分原因在于它为 Web 而建。将此与常见的“竞争对手”如\
    \ `Python` 和 `Ruby` 对比，它们起初在服务器上运行，随着时间的推移建立了库和框架，使它们在 Web 应用中也能很好地工作。\n\n鉴于 `PHP`\
    \ 与创建网页紧密耦合，避免直接与语言中内置的那些 Web 特定功能对话需要付出努力。Cookies、sessions 和 `$_SERVER` 立刻浮现在脑海。对于\
    \ `PHP` 开发者来说，与这些东西的交互是第二天性。\n\n但如果你想构建一个可以通过 `CLI`（命令行界面）工具如 `PHPUnit` 进行测试的应用，这就成了一个问题。你必须确保抽象掉对\
    \ Web 特定信息或函数的任何访问，以便当模块从 `CLI` 访问时你的应用仍然可以正常工作。Cookies 浮现在脑海，我相信通过更多研究你会找到更多只存在于\
    \ Web 上的例子。\n\n让我们考虑一下我之前向你展示的你自己的 `ACL` 实现的例子。如果我没记错，它要求你访问应用中使用的 `request` 对象……这与\
    \ Web 绑定。然后它需要一个你存储在 `session` 中的值……这通常与 Web 相关，但在 `CLI` 环境中也可以使用。\n\n一切希望都未丧失。在我们第一次快速重构中，我们使用依赖注入将获取\
    \ `request` 对象和我们需要的来自 `session` 的值移到了 `ACL` 对象本身之外。如果你脚本不是在 Web 请求的上下文中运行，你会如何处理这种情况？\n"
