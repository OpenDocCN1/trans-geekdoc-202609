- raw: "Also note how I commented on the section of code where I am using a shortcut\
    \ to set the first alphanumeric character of my attribute lower case. I needed\
    \ this because the code takes something like setHomeTeamId and chops off the set\
    \ part. In order to match it, I need to change it into \\_homeTeamId to match\
    \ the coding standard for protected variables.\n\nSo now all my code meets the\
    \ Zend coding standard. Onto other things like seeing how messy this pretty-looking\
    \ code is.\n\nHaving updated my code until I got rid of all warnings having to\
    \ do with the FranchiseMapper code being up to the Zend standard, the next tool\
    \ to use is the [PHP Mess Detector](http://phpmd.org).\n\nThe job of this tool\
    \ is to examine the complexity of your code and make suggestions on how to fix\
    \ it. People create complex methods inside their code for the most innocent of\
    \ reasons, but (beating a dead horse here) complexity is the enemy of maintainability\
    \ and extendability. So, let’s take a look at what it says about FranchiseMapper.\n\
    \n```\nchartjes@yggdrasil [10:30:20] [~/Sites/local.ibl/lib/ibl] [master *]\n\
    -> % phpmd FranchiseMapper.php text codesize,design,naming,unusedcode\n\nFranchiseMapper.php:5\
    \ This class has too many methods, consider \n    refactoring it.\nFranchiseMapper.php:137\
    \ Avoid variables with short names like $id\n```\n\nAw, that’s no fun at all.\
    \ No real news to report there. But what if we use it on something a lot messier?\
    \ Here’s the same command run on a complex library for a work-related project\
    \ I did.\n\n```\n> % phpmd lib/vendor/Moontoast/RpcApi.php text \n    codesize,design,naming,unusedcode\n\
    RpcApi.php:12    The class RpcApi has an overall complexity of 77 which \n   \
    \ is very high. The configured complexity threshold is 50 \nRpcApi.php:12    The\
    \ class RpcApi has a coupling between objects value\n    of 14. Consider to reduce\
    \ to number of dependencies under 13\nRpcApi.php:27    Avoid unused parameters\
    \ such as '$params'.\nRpcApi.php:114   The method getProduct() has a Cyclomatic\
    \ Complexity of 14.\nRpcApi.php:114   The method getProduct() has an NPath complexity\
    \ of 655.\nRpcApi.php:114   Avoid really long methods.\nRpcApi.php:114   Avoid\
    \ variables with short names like $id\nRpcApi.php:234   Avoid unused parameters\
    \ such as '$params'.\nRpcApi.php:282   The method getStore() has a Cyclomatic\
    \ Complexity of 12.\nRpcApi.php:282   Avoid really long methods.\nRpcApi.php:302\
    \   Avoid unused local variables such as '$price'.\nRpcApi.php:303   Avoid unused\
    \ local variables such as '$previousPrice'.\nRpcApi.php:398   Avoid unused parameters\
    \ such as '$csc'.\nRpcApi.php:477   The method saveCart() has a Cyclomatic Complexity\
    \ of 26.\nRpcApi.php:477   The method saveCart() has an NPath complexity of 5644802.\n\
    RpcApi.php:477   Avoid really long methods.\nRpcApi.php:477   Avoid variables\
    \ with short names like $id\nRpcApi.php:588   Avoid excessively long variable\
    \ names like \n    $useBillingForShipping\nRpcApi.php:608   Avoid excessively\
    \ long variable names like \n    $shippingAddressObject\nRpcApi.php:671   Avoid\
    \ unused local variables such as '$gateway'.\nRpcApi.php:702   Avoid variables\
    \ with short names like $q\nRpcApi.php:707   Avoid variables with short names\
    \ like $mm\n```\n\nYou can see all kinds of places where you could make some improvements\
    \ to your code. The PHP Mess Detector web site has good documentation on what\
    \ all these messages mean, although some of them should be pretty self-explanatory.\n\
    \nMy personal experience with PHP Mess Detector is that it does an awesome job\
    \ of identifying places in my code where I’m trying to do too much in one method\
    \ or have come up with an algorithm that might be too complicated for the task\
    \ I’m asking it to do. It surprised me to see those complaints about unused parameters\
    \ and local variables, as I am usually very diligent about not doing stuff like\
    \ that.\n\nReducing the “mess” in your code will also go a long way to figuring\
    \ out the best way to actually test it.\n\nOne of the biggest temptations when\
    \ trying to “just get this done” is to slack off on your efforts to reuse code\
    \ or extract functionality into its own methods (or even own classes) and just\
    \ cut-and-paste code everywhere. [PHP Copy Paste Detector](https://github.com/sebastianbergmann/phpcpd)\
    \ will statically examine your code and identify lines in your code where you\
    \ appear to be repeating yourself, making it a candidate for refactoring that\
    \ code into a method of it’s own. Let’s see what it says about our trusty FranchiseMapper\n\
    \n```\n-> % phpcpd ./FranchiseMapper.php \nphpcpd 1.3.2 by Sebastian Bergmann.\n\
    \n0.00% duplicated lines out of 197 total lines of code.\n```\n\nFLAWLESS VICTORY.\
    \ Again, that’s pretty boring. Let’s take a look at another bit of code from a\
    \ work project, code that deals with handling [AMF (Action Message Format)](https://en.wikipedia.org/wiki/Action_Message_Format)\
    \ calls from a Flash file used to generate store fronts for an ecommerce site:\n\
    \n```\n-> % phpcpd lib/services/AMF_Checkout.php \nphpcpd 1.3.3 by Sebastian Bergmann.\n\
    \nFound 2 exact clones with 52 duplicated lines in 1 files:\n\n  - AMF_Checkout.php:60-68\n\
    \    AMF_Checkout.php:576-584\n\n  - AMF_Checkout.php:88-132\n    AMF_Checkout.php:602-646\n\
    \n7.21% duplicated lines out of 721 total lines of code.\n\nTime: 0 seconds, Memory:\
    \ 6.50Mb\n```\n\nThat’s a little better. The first bit of analysis worried me,\
    \ but 9 lines of duplicate code isn’t that bad. Closer inspection revealed that\
    \ it was the same set of ‘if’ statements being executed. I’ll think about whether\
    \ or not to extract that into a method of its own.\n\nThat second problem is worth\
    \ examining. Almost 50 lines of code have been duplicated. Definitely worth extracting\
    \ into it’s own method, to cut that down to just 50 lines of code. Less code means\
    \ less bugs…usually.\n\nI have found that the best way to use these tools is to\
    \ compliment your attempts to have well-organized code. If you find you are having\
    \ problems in generating code that is easily understood by others, these tools\
    \ can be used to identify places where friction is occurring in the code base.\n\
    \n## 7 Decoupling Your Objects Using Dependency Injection\n\nWhenever I encounter\
    \ a code base for the first time, my initial thought is about how I can test individual\
    \ components as I modify parts of the application to meet new requirements or\
    \ to fix bugs. In a perfect world, you will inherit an application with lots of\
    \ relevant tests and great code coverage.\n\nMost of the time you have an application\
    \ that is working…and no way to test components in isolation. That doesn’t mean\
    \ the application sucks, it just means it will be difficult to make changes without\
    \ the nagging feeling that you might have broken something else.\n\nMost PHP developers\
    \ are using object-oriented programming in their applications. You create objects\
    \ to accomplish certain tasks, and if you went with a Model-View-Controller design\
    \ pattern you are hopefully isolating your business logic in models, handling\
    \ your routing requests in your controllers, and displaying output in nicely marked-up\
    \ templates.\n\nThe problem with testing some of these things is the tendency\
    \ for most developers to create tightly-coupled objects that perform tasks that\
    \ often stray from their original purpose. So if you have a module of code that\
    \ you need to test, the first thing to look at is decoupling things.\n\nTo guide\
    \ you in your attempts to decouple your code and move it towards a scenario where\
    \ it consists of well-crafted modules that talk to each other via rainbows and\
    \ unicorn sightings, the first tool I offer you is the concept known as the [Law\
    \ of Demeter](http://en.wikipedia.org/wiki/Law_of_Demeter).\n\nOne of my all-time\
    \ favourite programming books [“The Pragmatic Programmer”](http://pragprog.com/book/tpp/the-pragmatic-programmer)\
    \ describes the Law of Demeter like this:\n\n> The Law of Demeter for functions\
    \ states that any method of an object should call only methods belonging to itself,\
    \ any parameters that were passed in to the method, any objects it created, and\
    \ any directly held component objects."
  fmt: "\nAlso note how I commented on the section of code where I am using a shortcut\
    \ to set the first alphanumeric character of my attribute lower case. I needed\
    \ this because the code takes something like `setHomeTeamId` and chops off the\
    \ `set` part. In order to match it, I need to change it into `_homeTeamId` to\
    \ match the coding standard for protected variables.\n\nSo now all my code meets\
    \ the `Zend` coding standard. Onto other things like seeing how messy this pretty-looking\
    \ code is.\n\nHaving updated my code until I got rid of all warnings having to\
    \ do with the `FranchiseMapper` code being up to the `Zend` standard, the next\
    \ tool to use is the [PHP Mess Detector](http://phpmd.org).\n\nThe job of this\
    \ tool is to examine the complexity of your code and make suggestions on how to\
    \ fix it. People create complex methods inside their code for the most innocent\
    \ of reasons, but (beating a dead horse here) complexity is the enemy of maintainability\
    \ and extendability. So, let’s take a look at what it says about `FranchiseMapper`.\n\
    \n```\nchartjes@yggdrasil [10:30:20] [~/Sites/local.ibl/lib/ibl] [master *]\n\
    -> % phpmd FranchiseMapper.php text codesize,design,naming,unusedcode\n\nFranchiseMapper.php:5\
    \ This class has too many methods, consider \n    refactoring it.\nFranchiseMapper.php:137\
    \ Avoid variables with short names like $id\n```\n\nAw, that’s no fun at all.\
    \ No real news to report there. But what if we use it on something a lot messier?\
    \ Here’s the same `phpmd` command run on a complex library for a work-related\
    \ project I did.\n\n```\n> % phpmd lib/vendor/Moontoast/RpcApi.php text \n   \
    \ codesize,design,naming,unusedcode\nRpcApi.php:12    The class RpcApi has an\
    \ overall complexity of 77 which \n    is very high. The configured complexity\
    \ threshold is 50 \nRpcApi.php:12    The class RpcApi has a coupling between objects\
    \ value\n    of 14. Consider to reduce to number of dependencies under 13\nRpcApi.php:27\
    \    Avoid unused parameters such as '$params'.\nRpcApi.php:114   The method getProduct()\
    \ has a Cyclomatic Complexity of 14.\nRpcApi.php:114   The method getProduct()\
    \ has an NPath complexity of 655.\nRpcApi.php:114   Avoid really long methods.\n\
    RpcApi.php:114   Avoid variables with short names like $id\nRpcApi.php:234   Avoid\
    \ unused parameters such as '$params'.\nRpcApi.php:282   The method getStore()\
    \ has a Cyclomatic Complexity of 12.\nRpcApi.php:282   Avoid really long methods.\n\
    RpcApi.php:302   Avoid unused local variables such as '$price'.\nRpcApi.php:303\
    \   Avoid unused local variables such as '$previousPrice'.\nRpcApi.php:398   Avoid\
    \ unused parameters such as '$csc'.\nRpcApi.php:477   The method saveCart() has\
    \ a Cyclomatic Complexity of 26.\nRpcApi.php:477   The method saveCart() has an\
    \ NPath complexity of 5644802.\nRpcApi.php:477   Avoid really long methods.\n\
    RpcApi.php:477   Avoid variables with short names like $id\nRpcApi.php:588   Avoid\
    \ excessively long variable names like \n    $useBillingForShipping\nRpcApi.php:608\
    \   Avoid excessively long variable names like \n    $shippingAddressObject\n\
    RpcApi.php:671   Avoid unused local variables such as '$gateway'.\nRpcApi.php:702\
    \   Avoid variables with short names like $q\nRpcApi.php:707   Avoid variables\
    \ with short names like $mm\n```\n\nYou can see all kinds of places where you\
    \ could make some improvements to your code. The PHP Mess Detector web site has\
    \ good documentation on what all these messages mean, although some of them should\
    \ be pretty self-explanatory.\n\nMy personal experience with PHP Mess Detector\
    \ is that it does an awesome job of identifying places in my code where I’m trying\
    \ to do too much in one method or have come up with an algorithm that might be\
    \ too complicated for the task I’m asking it to do. It surprised me to see those\
    \ complaints about unused parameters and local variables, as I am usually very\
    \ diligent about not doing stuff like that.\n\nReducing the “mess” in your code\
    \ will also go a long way to figuring out the best way to actually test it.\n\n\
    One of the biggest temptations when trying to “just get this done” is to slack\
    \ off on your efforts to reuse code or extract functionality into its own methods\
    \ (or even own classes) and just cut-and-paste code everywhere. [PHP Copy Paste\
    \ Detector](https://github.com/sebastianbergmann/phpcpd) will statically examine\
    \ your code and identify lines in your code where you appear to be repeating yourself,\
    \ making it a candidate for refactoring that code into a method of it’s own. Let’s\
    \ see what it says about our trusty `FranchiseMapper`\n\n```\n-> % phpcpd ./FranchiseMapper.php\
    \ \nphpcpd 1.3.2 by Sebastian Bergmann.\n\n0.00% duplicated lines out of 197 total\
    \ lines of code.\n```\n\nFLAWLESS VICTORY. Again, that’s pretty boring. Let’s\
    \ take a look at another bit of code from a work project, code that deals with\
    \ handling [AMF (Action Message Format)](https://en.wikipedia.org/wiki/Action_Message_Format)\
    \ calls from a Flash file used to generate store fronts for an ecommerce site:\n\
    \n```\n-> % phpcpd lib/services/AMF_Checkout.php \nphpcpd 1.3.3 by Sebastian Bergmann.\n\
    \nFound 2 exact clones with 52 duplicated lines in 1 files:\n\n  - AMF_Checkout.php:60-68\n\
    \    AMF_Checkout.php:576-584\n\n  - AMF_Checkout.php:88-132\n    AMF_Checkout.php:602-646\n\
    \n7.21% duplicated lines out of 721 total lines of code.\n\nTime: 0 seconds, Memory:\
    \ 6.50Mb\n```\n\nThat’s a little better. The first bit of analysis worried me,\
    \ but 9 lines of duplicate code isn’t that bad. Closer inspection revealed that\
    \ it was the same set of ‘if’ statements being executed. I’ll think about whether\
    \ or not to extract that into a method of its own.\n\nThat second problem is worth\
    \ examining. Almost 50 lines of code have been duplicated. Definitely worth extracting\
    \ into it’s own method, to cut that down to just 50 lines of code. Less code means\
    \ less bugs…usually.\n\nI have found that the best way to use these tools is to\
    \ compliment your attempts to have well-organized code. If you find you are having\
    \ problems in generating code that is easily understood by others, these tools\
    \ can be used to identify places where friction is occurring in the code base.\n\
    \n## 7 Decoupling Your Objects Using Dependency Injection\n\nWhenever I encounter\
    \ a code base for the first time, my initial thought is about how I can test individual\
    \ components as I modify parts of the application to meet new requirements or\
    \ to fix bugs. In a perfect world, you will inherit an application with lots of\
    \ relevant tests and great code coverage.\n\nMost of the time you have an application\
    \ that is working…and no way to test components in isolation. That doesn’t mean\
    \ the application sucks, it just means it will be difficult to make changes without\
    \ the nagging feeling that you might have broken something else.\n\nMost PHP developers\
    \ are using object-oriented programming in their applications. You create objects\
    \ to accomplish certain tasks, and if you went with a `Model-View-Controller`\
    \ design pattern you are hopefully isolating your business logic in models, handling\
    \ your routing requests in your controllers, and displaying output in nicely marked-up\
    \ templates.\n\nThe problem with testing some of these things is the tendency\
    \ for most developers to create tightly-coupled objects that perform tasks that\
    \ often stray from their original purpose. So if you have a module of code that\
    \ you need to test, the first thing to look at is decoupling things.\n\nTo guide\
    \ you in your attempts to decouple your code and move it towards a scenario where\
    \ it consists of well-crafted modules that talk to each other via rainbows and\
    \ unicorn sightings, the first tool I offer you is the concept known as the [Law\
    \ of Demeter](http://en.wikipedia.org/wiki/Law_of_Demeter).\n\nOne of my all-time\
    \ favourite programming books [“The Pragmatic Programmer”](http://pragprog.com/book/tpp/the-pragmatic-programmer)\
    \ describes the Law of Demeter like this:\n\n> The Law of Demeter for functions\
    \ states that any method of an object should call only methods belonging to itself,\
    \ any parameters that were passed in to the method, any objects it created, and\
    \ any directly held component objects.\n"
