  trans: "\n```\n<?php\ninclude 'test_bootstrap.php';\n\n$conn = new PDO(\n    'pgsql:host=localhost;dbname=ibl_stats',\
    \ \n    'stats', \n    'st@ts=Fun'\n);\necho \"Collecting all fixtures for our\
    \ league...\\n\";\n$mapper = new \\IBL\\FranchiseMapper($conn);\n$allFranchises\
    \ = $mapper->findAll();\necho \"Writing franchise objects into fixture file...\\\
    n\";\nfile_put_contents('./fixtures/franchises.txt', serialize($allFranchises));\n\
    echo \"Done\\n\";\n```\n\n现在，我们重写测试以使用新的 fixture，并测试我们的 `Standings` 模型是否接受 `Games`\
    \ 数组和 `Franchises` 数组作为构造函数参数。\n\n```\n<?php\ninclude './test_bootstrap.php';\n\
    \nclass StandingsTest extends \\PHPUnit_Framework_TestCase\n{\n    public function\
    \ testGenerateRegular()\n    {\n        $data = file_get_contents('./fixtures/games.txt');\n\
    \        $testGames = unserialize($data);\n        $data = file_get_contents('./fixtures/franchises.txt');\n\
    \        $testFranchises = unserialize($data);\n        $testStandings = new \\\
    IBL\\Standings($testGames, $testFranchises);\n    \n        // Rest of the test\
    \ is the same\n    }\n}\n```\n\n我并不是开玩笑，支持除非常表面的测试集之外的测试套件确实需要大量额外的代码。同时，提供这种额外支持时常常需要的各种迂回，也能让你非常好地（而且往往很残酷地）审视代码的设计。\n\
    \n如果你注意到了，我这样做使用的是人们在进行单元测试时通常认为的 fixtures。最常见的方法是使用数据库 fixtures，然后引入某种库来处理将这些\
    \ fixtures 转换为数据。这样你就可以使用某种 mock 对象，在测试看来它就像一个数据库连接。\n\n有时候你确实需要数据库 fixtures。也许你无法像我这样解耦事物。如果你想走使用数据库\
    \ fixtures 的路线，我建议你看看 [Phactory](http://phactory.org)。它提供了一种更简单、以代码驱动的方式来创建数据库\
    \ fixtures，如果你的应用程序使用 `PDO`，那将是理想的选择。\n\n无论哪种方式，你都必须意识到使用 fixtures 的缺点。当你更改测试时，你会发现自己也必须更改\
    \ fixtures。它还会减慢测试速度，因为无论是传统方式还是我通过创建数据对象的方式，都需要加载 fixtures。测试越慢，开发人员越有可能尝试跳过运行完整的测试套件。\n\
    \n对于这个示例应用程序，如果我的测试发生变化，创建新的数据 fixtures 很简单，因为我编写了小型脚本来实际创建它们。修改 fixture 创建脚本，再次运行它，我就有了更新后的数据\
    \ fixture。如果测试需要不同的数据，这肯定比手动编辑大量 `XML` 文件容易得多。\n\n换句话说：在为测试目的导入数据时要聪明。很可能你不需要完整的数据集，只需要一小部分数据来验证功能。如果你能重构代码以使用对象而不是模拟数据库连接，那就更好了。\n\
    \n这里还有一条你应该铭记的座右铭：\n\n> 如果不是你的，就把它封装起来。\n\n如果你使用第三方 API 来做用户认证之类的事情，你很快就会发现测试变得非常困难。一个典型的场景可能是这个第三方\
    \ API 需要重定向到他们的网站，用户在那里填写一些信息，然后他们带着某种令牌返回你的应用程序，证明你就是你声称的那个人。这对你来说是好事，因为它免除了你自己管理这些凭据的负担，但坏处是，你如何测试这样的东西？\n\
    \n你可能很幸运，所使用的应用程序有一种捕获请求和响应循环的方式。本指南的示例应用程序没有，所以让我们思考一下如何使用类似 `Facebook Connect`\
    \ 的东西。\n\n答案当然是，你将对第三方身份验证服务的使用放在一个包装器内部。跟我一起，我来解释这个逻辑。\n\n不要想“如何创建一个与 Facebook\
    \ 通信的测试”，而是反过来想“如何为一个使用 Facebook Connect 作为数据源的身份验证服务创建测试？”。我希望你能看出区别。\n\n使用 Facebook\
    \ Connect 的正常方式是使用他们自己的 SDK（或者如果你是受虐狂，你自己编写 `OAuth` 实现），它基本上会将用户重定向到 Facebook，在那里他们输入网站的登录凭据。如果凭据正确，他们将被重定向回你的应用程序，并附带一个令牌，你可以用它来获取有关用户的信息。\n\
    \n在我自己使用 Facebook Connect 进行身份验证的情况下，我倾向于将用户信息存储在 session 中，然后稍后引用它。以下是我所指的示例：\n\
    \n```\n<?php\n// Assume $facebookUser is the object representing info about our\
    \ user\n\n$_SESSION['email'] = $facebookUser->getEmail();\n$_SESSION['name'] =\
    \ \n     $facebookUser->getFirstName() . \n     ' ' . \n     $facebookUser->getLastName();\n\
    \n// In other parts of the app when I need to check if the user is\n// authenticated\
    \ properly\n\nif (isset($_SESSION['email'])) {\n    // Execute the desired functionality\n\
    } else {\n    // Redirect user to log in with Facebook Connect\n}\n```\n\n顺便说一下，我倾向于将检查用户是否已正确身份验证的代码放在最适合项目所用框架的结构中。有些框架比其他框架更容易在运行你的特定操作代码之前在控制器中执行代码。\n\
    \n然而，如果你看看我上面的小示例，你可以看到为什么那样测试会非常困难：我们依赖于 session 中存储的信息。我们该如何尝试修复这个问题？\n\n我们需要做的第一件事是停止直接检查\
    \ session 的内容，并创建一个对象来处理告知我们是否已通过身份验证的任务。\n\n```\n<?php\n// New object that holds\
    \ info about your Authenticated user\n\nclass AuthUser\n{\n\n    ...\n\n    public\
    \ function check()\n    {\n        return (isset($_SESSION['email']));\n    }\n\
    }\n\n// Then in the controller where you check authorization...\n\n$authUser =\
    \ new AuthUser();\n\nif ($authUser->check() === true) {\n    // Execute the desired\
    \ functionality\n} else {\n    // Redirect user to log in with Facebook Connect\n\
    }\n```\n\n这样更好，但我们仍然依赖于 session 的可用性。我们如何减少这种特定依赖？\n\n```\n<?php\n\nclass AuthUser\n\
    {\n    protected $_sessionObject;\n\n    public function __construct($sessionContents)\n\
    \    {\n        $this->_sessionContents = $sessionContents;\n    }\n   \n    public\
    \ function check()\n    {\n        return (isset($this->_sessionContents['email']));\n\
    \    }\n}\n```\n\n现在我们取得了更大的进展。现在让我们假设我们想要测试一些控制器逻辑。在我们的示例应用程序中，我们的目标是能够独立于我们所处的环境加载控制器代码。这意味着我们必须确保此代码不依赖于\
    \ `$_SESSION` 等事物的存在。\n\n然而还有一些额外的顾虑。为了运行我们的测试，我们不想担心实际连接到 Facebook 以获取有关用户的信息。这就是\
    \ `mock objects` 概念可以加入我们工具包的地方。\n"
