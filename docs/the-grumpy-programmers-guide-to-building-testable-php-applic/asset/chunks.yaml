- raw: "At some point your application becomes large enough that you will find yourself\
    \ having to manage not only a lot of objects, but complicated objects. You may\
    \ ask yourself how to move these objects around for the purposes of dependency\
    \ injection. The best way to handle this is to put the objects you know you will\
    \ need to move around into a container and then simply retrieve them when you\
    \ need them.\n\nSo what sorts of applications need things like this? The prime\
    \ candidate for getting the most use of a DIC is a web application framework.\
    \ Why? Most frameworks are heavily object oriented and use a large number of objects\
    \ to accomplish tasks. You can really make it easier for users of the framework\
    \ if you place objects that they are likely to need to use frequently inside the\
    \ container. They can then be retrieved for later use, already configured and\
    \ ready to go.\n\nConsider our application with its Model and Mapper structure.\
    \ We could use a container to store our database connection object instead of\
    \ always creating the instance ourselves. Here, we will use Pimple as our DIC.\n\
    \n```\n<?php\n\n// Inside our bootstrap\n\n// Create our container\n$container\
    \ = new \\Pimple();\n\n// Inject our DB connection object for later reuse\n$container['db_connection']\
    \ = function ($c) {\n    return new PDO(\n        'pgsql:host=localhost;dbname=ibl_stats',\
    \ \n        'stats',\n        'st@ts=Fun'\n    );\n};\n\n\n// Then in a controller\
    \ somewhere...\n$mapper = new IBL\\FranchiseMapper($container['db_connection']);\n\
    ```\n\nThe upside to this sort of thing is now your objects REALLY don’t need\
    \ to know anything about the other objects or parameters they are using. If you\
    \ really wanted to go completely nuts about this sort of stuff you could create\
    \ instances of all your Mappers ahead of time in the bootstrap and then just pull\
    \ them out of the container when you need them.\n\n```\n<?php\n\n// In the bootstrap,\
    \ after having already added\n// in the database connection\n$container['franchise_mapper']\
    \ = function ($c) {\n    return new \\IBL\\FranchiseMapper($c['db_container']);\n\
    };\n$container['game_mapper'] = function ($c) {\n    return new \\IBL\\GameMapper($c['db_container']);\n\
    };\n```\n\nI’m not saying that this is a best practice but it illustrates that\
    \ proper use of a DIC can go a long way towards making your application in line\
    \ with the principles espoused in the Law of Demeter.\n\nSo, what else can we\
    \ do with our dependency injection container now that we have it? Well, use it!\
    \ In many ways you can also look at this as a “registry on steroids”. I have typically\
    \ used components for frameworks that act as registries of information. I store\
    \ various values that I require persisted throughout the application and then\
    \ retrieve them as required through calls to this registry or configuration object\
    \ or whatever you want to call it.\n\nAnother reason to use a container for the\
    \ dependencies is that it creates one place where you can find them. Without it,\
    \ your code is littered with requests to instantiate those dependencies prior\
    \ to injection. Again, imagine the scenario where you are switching out a data\
    \ mapper from one that uses Postgres as the backend to one that uses MongoDB:\
    \ how much pain would it be to go through all your code and replace all the instances\
    \ where you create an old mapper and replace it with the new one? If you were\
    \ using a container, you only change it in your bootstrap.\n\nBeing able to extract\
    \ your dependencies when you need to inject them is helpful when trying to build\
    \ your testable application. It saves you the trouble of instantiating them just\
    \ before you use them, and if you use a container you can return an object that\
    \ is already configured the way you need it.\n\nIt is also very easy to abuse\
    \ the user of a DIC. Let’s say that you have an object called Omega, that has\
    \ three dependencies that you need to pass in:\n\n```\n<?php\n\nclass Omega\n\
    {\n    protected $foo;\n    protected $bar;\n    protected $bizz;\n\n    public\
    \ function __construct($foo, $bar, $bizz)\n    {\n        $this->foo = $foo;\n\
    \        $this->bar = $bar;\n        $this->bizz = $bizz; \n    }\n}\n\n$dep1\
    \ = new Foo();\n$dep2 = new Bar();\n$dep3 = new Bizz();\n$newOmega = new Omega($dep1,\
    \ $dep2, $dep3);\n```\n\nYou decide to be clever and use a dependency injection\
    \ container to store stuff in. Then you think “why don’t I just pass in the container\
    \ since the stuff is in there already?”\n\n```\n<?php\n\nclass Omega\n{\n    protected\
    \ $foo;\n    protected $bar;\n    protected $bizz;\n\n    public function __construct($container)\n\
    \    {\n        $this->foo = $container['foo'];\n        $this->bar = $container['bar'];\n\
    \        $this->bizz = $container['biz']; \n    }\n}\n\n$container['foo'] = new\
    \ Foo();\n$container['bar'] = new Bar();\n$container['bizz'] = new Bizz();\n$newOmega\
    \ = new Omega($container);\n```\n\nNow, let’s suppose further that I am the one\
    \ who is assigned to review this code as part of the normal development flow.\
    \ I would take a look at this and immediately point out that you have now coupled\
    \ your dependency injection container with Omega.\n\n“What happens if you ever\
    \ change the container? Then you have to go through all your existing code that\
    \ uses the container and rework it!”\n\nIf you are going to use a dependency injection\
    \ container (and I highly recommend doing so for an application of medium to large\
    \ complexity) then treat it as a container only, and retrieve your dependencies\
    \ from it before injecting them into your objects.\n\nDependency injection is\
    \ a concept that I think every developer needs to understand even if they prefer\
    \ not to use it. I also think that dependency injection is a critical part of\
    \ creating objects that can be integrated with other objects with the lowest amount\
    \ of friction.\n\nYou can reduce tight coupling of your code with some help from\
    \ mock objects in your tests. The concept of mock objects is a very simple one:\
    \ you create a representation of an object that is a dependency for your test\
    \ and then create just the functionality for that object that your test requires\
    \ in order to succeed. Here is an example that ties in the use of a mock object\
    \ and ensures that your code can run both on the web and the CLI.\n\nPart of the\
    \ reason for PHP’s success in tackling and solving the problems of Web 1.0 was\
    \ that it was built FOR the web. Contrast this with common “competitors” like\
    \ Python and Ruby, who started out on the server and over time have built up libraries\
    \ and frameworks that allow them to work just fine in web applications.\n\nGiven\
    \ that PHP is so tightly coupled with creating web pages, it requires effort to\
    \ avoid talking directly to all those awesome features built into the language\
    \ that are web-specific. Cookies, sessions and $\\_SERVER immediately spring to\
    \ mind. For PHP developers, interacting with these things are second nature.\n\
    \nBut this becomes a problem if you want to build an application that can be tested\
    \ via CLI (Command Line Interface) tools like PHPUnit. You have to make sure that\
    \ you are abstracting away any access to web-specific information or functions\
    \ so that your application will actually work when modules from it are accessed\
    \ from the CLI. Cookies come to mind and I’m sure that with more research you\
    \ will find more examples of things that only live on the web.\n\nLet’s consider\
    \ the example of your own ACL implementation that I showed you before. If you\
    \ recall, it requires that you access the request object used in your application…which\
    \ is tied to the web. Then it requires a value that you stored in the session…which\
    \ is usually associated with the web but can be used in a CLI environment.\n\n\
    All hope is not lost. In our first quick little refactoring we used dependency\
    \ injection to move grabbing the request object and the value from the session\
    \ that we needed outside of the ACL object itself. How could you deal with this\
    \ if your script is not running in the context of a web request?"
  fmt: "\n# Dependency Injection Container\n\n## Managing Complex Objects\n\nAt some\
