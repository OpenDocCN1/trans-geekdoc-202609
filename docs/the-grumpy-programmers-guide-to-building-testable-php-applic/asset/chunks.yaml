    \ wife commented on what an incredible likeness it is.\n\nUnfortunately, this\
    \ guide is not aimed at the beginning programmer. Writing testable applications\
    \ is a hard thing to do and requires that you already have a solid background\
    \ in programming. This guide is targeted at intermediate-level programmers who\
    \ have had some exposure to writing tests and want to push their skills to the\
    \ next level.\n\nIf you are looking for an introductory guide to writing unit\
