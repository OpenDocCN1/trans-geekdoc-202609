    \ $resultsHeader) !== false);\n        $this->assertTrue(stripos($response, $rotationsHeader)\
    \ !== false);\n        $this->assertTrue(stripos($response, $scheduleHeader) !==\
    \ false);\n\n        // Look for a known team abbreviation\n        $this->assertTrue(stripos($response,\
    \ \"MAD\") !== false);\n\n        // Look for a specific rotation to appear\n\
    \        $this->assertTrue(stripos($response, $rotation) !== false);\n    }\n\
    }\n```\n\n## 验证 HTML 输出\n\n那么在我的看法中，最好的查找我们 HTML 输出内部数据的方法是什么？你有两个选择。\n\n### 字符串搜索方法\n\
    \n如果你希望 HTML 输出中出现特定字符串，比如说你成功创建了一个新小部件的消息，那么你最好使用 `PHP` 的内置字符串搜索函数。\n\n```\n\
    <?php\n\n$standingsHeader = \"Standings through week 27\";\n$resultsHeader = \"\
    Results for week 27\";\n$rotationsHeader = \"Rotations for Week 27\";\n$scheduleHeader\
    \ = \"Schedule for Week 27\";\n$rotation = \"KC Greinke, CHN Lilly -2, CHN Wells\
    \ -2\"; \n$this->assertTrue(stripos($response, $standingsHeader) !== false);\n\
    $this->assertTrue(stripos($response, $resultsHeader) !== false);\n$this->assertTrue(stripos($response,\
    \ $rotationsHeader) !== false);\n$this->assertTrue(stripos($response, $scheduleHeader)\
    \ !== false);\n\n// Look for a known team abbreviation\n$this->assertTrue(stripos($response,\
    \ \"MAD\") !== false);\n\n// Look for a specific rotation to appear\n$this->assertTrue(stripos($response,\
    \ $rotation) !== false);\n```\n\n### 结构化输出验证\n\n如果你试图确保输出以特定方式格式化，你可能应该考虑使用像 `PHP`\
    \ 的内置 `SimpleXML` 函数这样的工具来加载输出，将其创建为 XML（毕竟 HTML 真的是 XML 的子集）然后使用 `xpath()` 方法。学习\
    \ [`XPath`](http://en.wikipedia.org/wiki/Xpath) 并不是最容易的事情。我在为一家提供 XML 数据馈送的体育数据集成公司工作时做了很多这方面的工作。但如果你想编写测试来确保错误消息被正确地包裹在适当的\
    \ CSS 类中，嗯，真的没有其他方法可以实现这一点。\n\n所以如果你想查找，比如说，生成的输出中的特定 `<div>` 标签，我认为测试看起来会像这样，有一点来自名为\
    \ [`Zend_Dom_Query`](http://framework.zend.com/manual/en/zend.dom.query.html)\
    \ 的第三方库的帮助。\n"
