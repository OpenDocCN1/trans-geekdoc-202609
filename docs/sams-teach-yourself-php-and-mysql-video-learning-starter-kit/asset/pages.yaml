- pgno: 38
  md: '# # Troubleshooting Your Installation


    If you have any problems during the installation of MySQL, the first place you
    should look is Appendix A, "Problems and Common Errors," in the MySQL Manual,
    which is located at http://dev.mysql.com/doc/refman/5.0/en/problems.html.


    The following are just a few of the common installation problems:


    +   - On Linux/UNIX and Mac OS X, incorrect permissions do not allow you to start
    the MySQL daemon. If this is the case, be sure that you have changed owners and
    groups to match those indicated in the installation instructions.


    +   - If you see the message Access denied when connecting to MySQL, be sure that
    you are using the correct username and password.


    +   - If you see the message Can '' t connect to server, make sure that the MySQL
    daemon is running.


    If you still have trouble after reading Appendix A in the MySQL Manual, sending
    an email to the MySQL mailing list (see http://lists.mysql.com/ for more information)
    will likely produce results. You can also purchase support contracts from MySQL
    AB.


    # # Basic Security Guidelines


    Regardless of whether you are running MySQL on Windows, Linux/UNIX, or Mac OS
    X, and whether you administer your own server or use a system provided to you
    by your Internet service provider, you must understand basic security guidelines.
    If you are accessing MySQL through your Internet service provider, there are several
    aspects of server security that you, as a non-root user, should not be able to
    modify or circumvent. Unfortunately, many Internet service providers pay no mind
    to security guidelines, leaving their clients exposed—and for the most part, unaware
    of the risk.


    # # Starting MySQL


    Securing MySQL begins with the server startup procedure. If you are not the administrator
    of the server, you won''t be able to change this, but you can certainly check
    it out and report vulnerabilities to your Internet service provider.'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'If your MySQL installation is on Linux/UNIX or Mac OS X, your primary concern
    should be the owner of the MySQL daemon—it should not be root. Running the daemon
    as a non-root user such as mysql or data - base limits the ability of malicious
    individuals to gain access to the server and overwrite files.


    > NOTE: You can verify the owner of the process using the ps (process status)
    command on your Linux/UNIX or Mac OS X system.


    If you see that MySQL is running as root on your system, immediately contact your
    Internet service provider and complain. If you are the server administrator, you
    should start the MySQL process as a non-root user or specify the preferred username
    in the startup command line:


    ```

    mysqld --user=non_root_user_name

    ```


    For example, if you want to run MySQL as user mysql, use this command:


    ```

    mysqld --user=mysql

    ```


    However, the recommended method for starting MySQL is through the mysqld_safe
    startup script in the bin directory of your MySQL installation:


    ```

    # bin/mysqld_safe --user=mysql &

    ```


    # Securing Your MySQL Connection


    You can connect to the MySQL monitor or other MySQL applications in several different
    ways, each of which has its own security risks. If your MySQL installation is
    on your own workstation, you have less to worry about than users who have to use
    a network connection to reach their server.


    If MySQL is installed on your workstation, your biggest security concern is leaving
    your workstation unattended with your MySQL monitor or MySQL GUI administration
    tool up and running. In this type of situation, anyone can walk over and delete
    data, insert bogus data, or shut down the server. Use a screensaver or lock screen
    mechanism with a password if you must leave your workstation unattended in a public
    area.


    If MySQL is installed on a server outside your network, the security of the connection
    should be of some concern. As with any transmission of data over the Internet,
    data can be intercepted. If the transmission is unencrypted, the person who intercepted
    the data can piece it together and use the information. Suppose that the unencrypted
    transmission is your MySQL login information—a rogue individual now has access
    to your database, masquerading as you.'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'One way to prevent this from happening is to connect to MySQL through a secure
    connection. Instead of using Telnet to reach the remote machine, use SSH. SSH
    looks and acts like Telnet, but all transmissions to and from the remote machine
    are encrypted. Similarly, if you use a Web-based administration interface, such
    as the highly recommended phpMyAdmin (see http://www.phpmyadmin.net/ for more
    information) or another tool used by your Internet service provider, access that
    tool over a secure HTTP connection.


    In the next section, you''ll learn about the MySQL privilege system, which helps
    secure your database even further.


    # Introducing the MySQL Privilege System


    The MySQL privilege system is always on. The first time you try to connect, and
    for each subsequent action, MySQL checks the following three things:


    +   - Where you are accessing from (your host)

    +   - Who you say you are (your username and password)

    +   - What you''re allowed to do (your command privileges)


    All this information is stored in the database called mysql, which is automatically
    created when MySQL is installed. There are several privilege-related tables in
    the mysql database:


    +   - columns_priv—Defines user privileges for specific fields within a table

    +   - db—Defines the permissions for all databases on the server

    +   - host—Defines the acceptable hosts that can connect to a specific database

    +   - procs_priv—Defines user privileges for stored routines

    +   - tables_priv—Defines user privileges for specific tables within a database

    +   - user—Defines the command privileges for a specific user'
  merge: -1
  img_proc: true
- pgno: 41
  md: "These tables will become more important to you later in this chapter as you\
    \ add a few sample users to MySQL. For now, just remember that these tables exist\
    \ and must have relevant data in them for users to complete actions.\n\n# The\
    \ Two-Step Authentication Process\n\nAs you've learned, MySQL checks three things\
    \ during the authentication process. The actions associated with these three things\
    \ are performed in two steps:\n\n+   1. MySQL looks at the host you are connecting\
    \ from and the username and password pair you are using. If your host is allowed\
    \ to connect, your password is correct for your username, and the username matches\
    \ one assigned to the host, MySQL moves to the second step.\n+   \n+   2. For\
    \ whichever SQL command you are attempting to use, MySQL verifies that you have\
    \ the ability to perform that action for that database, table, and field.\n\n\
    If step 1 fails, you'll see an error about it and you won't be able to continue\
    \ on to step 2. For example, suppose that you are connecting to MySQL with a username\
    \ of joe and a password of abc123 and you want to access a database called myDB.\
    \ You will receive an error message if any of those connection variables is incorrect\
    \ for any of the following reasons:\n\n+   - Your password is incorrect.\n+  \
    \ - Username joe doesn't exist.\n+   - User joe can't connect from localhost.\n\
    +   - User joe can connect from localhost but cannot use the myDB database.\n\n\
    You may see an error like the following:\n\n```\n# mysql -h localhost -u joe -pabc123\
    \ test\nError 1045: Access denied for user: 'joe@localhost' (Using password: YES)\n\
    ```\n\nIf user joe with a password of abc123 is allowed to connect from localhost\
    \ to the myDB database, MySQL will check the actions that joe can perform in step\
    \ 2 of the process. For our purposes, suppose that joe"
  merge: -1
  img_proc: true
- pgno: 42
  md: 'is allowed to select data but is not allowed to insert data.The sequence of
    events and errors would look like the following:


    ```

    # mysql -h localhost -u joe -pabc123 test

    Reading table information for completion of table and column

    names

    You can turn off this feature to get a quicker startup with -A


    Welcome to the MySQL monitor.  Commands end with ; or \\g.

    Your MySQL connection id is 12 to server version: 5.0.20-log

    Type ''help;'' or ''\\h'' for help. Type ''\\c'' to clear the buffer.


    mysql> SELECT * FROM test_table;

    +----+-------------+

    | id | test_field  |

    +----+-------------+

    |  1 | blah        |

    |  2 | blah blah   |

    +----+-------------+

    2 rows in set (0.0 sec)


    mysql> INSERT INTO test_table VALUES ('''', ''my text'');

    Error 1044: Access denied for user: ''joe@localhost'' (Using

    password: YES)

    ```


    Action-based permissions are common in applications with several levels of administration.
    For example, if you have created an application containing personal financial
    data, you might grant only SELECT privileges to entry-level staff members, but
    INSERT and DELETE privileges to executive-level staff with security clearances.


    # # Working with User Privileges


    In most cases when you are accessing MySQL through an Internet service provider,
    you will have only one user and one database available to you. By default, that
    user will have access to all tables in that database and will be allowed to perform
    all commands. In this case, the responsibility is yours as the developer to create
    a secure application through your programming.


    However, if you are the administrator of your own server, or if your Internet
    service provider allows you to add as many databases and users as you want as
    well as to modify the access privileges of your users, these next few sections
    will take you through the processes of doing so.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Adding Users


    Administering your server through a third-party application might afford you a
    simple method for adding users by using a wizard-like process or a graphical interface.
    However, adding users through the MySQL monitor is not difficult, especially if
    you understand the security checkpoints used by MySQL, which you just learned.


    The simplest method for adding new users is the GRANT command. By connecting to
    MySQL as the root user, you can issue one command to set up a new user. The other
    method is to issue INSERT statements into all the relevant tables in the mysql
    database, which requires you to know all the fields in the tables used to store
    permissions. This method works just as well but is more complicated than the simple
    GRANT command. The simple syntax of the GRANT command is shown here:


    ```

    GRANT privileges

    ON databasename.tablename

    TO username@host

    IDENTIFIED BY "password";

    ```


    The following are some of the common privileges you can grant. For a complete
    list, see the GRANT entry in the MySQL Manual at http://dev.mysql.com/doc/refman/5.0/en/grant.html.


    +   ■ ALL—Gives the user all common privileges


    +   ■ ALTER—User can alter (modify) tables, columns, and indexes


    +   ■ CREATE—User can create databases and tables


    +   ■ DELETE—User can delete records from tables


    +   ■ DROP—User can drop (delete) tables and databases


    +   ■ FILE—User can read and write files; this privilege is used to import or
    dump data


    +   ■ INDEX—User can add or delete indexes


    +   ■ INSERT—User can add records to tables


    +   ■ PROCESS—User can view and stop system processes; only trusted users should
    be able to do this


    +   ■ RELOAD—User can issue FLUSH statements; only trusted users should be able
    to do this


    +   ■ SELECT—User can select records from tables


    +   ■ SHUTDOWN—User can shut down the MySQL server; only trusted users should
    be able to do this


    +   ■ UPDATE—User can update (modify) records in tables'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'If, for instance, you want to create a user called john with a password of
    99hjcl5, with SELECT and INSERT privileges on all tables in the database called
    myDb, and you want this user to be able to connect from any host, use this command:


    ```

    GRANT SELECT, INSERT

    ON myDB.*

    TO john@"%"

    IDENTIFIED BY "99hjcl5";

    ```


    Note the use of two wildcards: * and %. These wildcards replace values. In this
    example, * replaces the entire list of tables and % replaces a list of all hosts
    in the known world—a very long list indeed.


    Here''s another example of adding a user with the GRANT command, this time to
    add a user called jane with a password of 45sdg11, with ALL privileges on a table
    called employees in the database called myCompany. This new user can connect only
    from a specific host:


    ```

    GRANT ALL

    ON myCompany.employees

    TO jane@janescomputer.company.com

    IDENTIFIED BY "45sdg11";

    ```


    If you know that janescomputer.company.com has an IP address of 63.124.45.2, you
    can substitute that address in the hostname portion of the command, as follows:


    ```

    GRANT ALL

    ON myCompany.employees

    TO jane@"63.124.45.2"

    IDENTIFIED BY "45sdg11";

    ```


    One note about adding users: Always use a password and make sure that the password
    is a good one!


    If you use the GRANT command to add users, the changes take immediate effect.
    To make absolutely sure of this, you can issue the FLUSH PRIVILEGES command in
    the MySQL monitor to reload the privilege tables.


    # # Removing Privileges


    Removing privileges is as simple as adding them; instead of the GRANT command,
    you use REVOKE. The REVOKE command syntax is as follows:


    ```

    REVOKE privileges

    ON databasename.tablename

    FROM username@hostname;

    ```'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'In the same way that you can grant permissions using INSERT commands, you can
    also revoke permissions by issuing DELETE commands to remove records from tables
    in the mysql database. However, this requires that you be familiar with the fields
    and tables, and it''s much easier and safer to use REVOKE.


    To revoke the ability for user john to INSERT items in the myCompany database,
    you would issue this REVOKE statement:


    ```

    REVOKE INSERT

    ON myDB.*

    FROM john@"%";

    ```


    Changes made to the data in the privilege tables happen immediately, but for the
    server to be aware of your changes, issue the FLUSH PRIVILEGES command in the
    MySQL monitor.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# Installing and Configuring Apache


    In this second of three installation-related chapters, you will install the Apache
    web server and familiarize yourself with its main components, including log and
    configuration files.


    # Current and Future Versions of Apache


    When you visit the Apache HTTPD server website at http://httpd.apache.org, you
    will see announcements for releases of the Apache 1.3.x, Apache 2.0.x, and Apache
    2.2.x versions. As you can imagine by the version numbers, Apache 1.3.x is the
    oldest of the three versions. The Apache Software Foundation maintains all three
    versions, but the features in Apache 2.2.x include greater support for filtering,
    caching, load balancing, and other system functions; it is the version used in
    this chapter. However, if you choose to install Apache 2.0.x or even Apache 1.3.x,
    all the PHP and MySQL code in this kit will still work as described. In fact,
    you will find a considerable number of hosting providers still using the Apache
    1.3.x version of the server, as well as others hosting the Apache 2.0.x version.
    If you have any issues with installing Apache 2.2.x as described in this chapter,
    try a previous version (for example, Apache 2.0.x); the installation instructions
    are remarkably similar. The installation instructions in this chapter refer to
    Apache HTTPD server version 2.2.8, which is the best available version of the
    software at the time of this writing.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'The Apache Software Foundation uses minor release numbers for updates containing
    security enhancements or bug fixes. Minor releases do not follow a set release
    schedule. When enhancements or fixes are added to the code and thoroughly tested,
    the Apache Software Foundation releases a new version with a new minor version
    number.


    It is possible that by the time you purchase this kit, the minor version number
    will have changed to 2.2.9 or beyond. If that is the case, you should read the
    list of changes, which is linked from the download area at http://httpd.apache.org/download.cgi,
    for any changes regarding the installation or configuration process, which makes
    up the bulk of this chapter.


    Although it is unlikely that any installation instructions will change between
    minor version updates, you should get in the habit of always checking the changelog
    of software that you install and maintain. If a minor version change does occur
    while you are reading this kit but the changelog notes no installation changes,
    simply make a mental note and substitute the new version number wherever it appears
    in the installation instructions and accompanying figures.


    # ## Installing Apache on Mac OS X


    Lucky you, Apache is already installed on Mac OS X! By default, the Apache server
    binary is located at /usr/sbin/httpd. Configuration files such as httpd.conf,
    the master configuration file for Apache, are in /etc/httpd. Because Apache is
    ready to go and fully prepared to use PHP, skip ahead to the “Apache Configuration
    File Structure” section to learn more about the Apache configuration file and
    how to use it.


    # ## Installing Apache on Windows


    Apache 2.2 runs on most Windows platforms and offers increased performance and
    stability over the Apache 2.0 and Apache 1.3 versions for Windows. You can build
    Apache from source, but because not many Windows users have compilers, this section
    deals with the MSI installer version.'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'Before installing Apache, you''ll probably want to make sure that you are not
    currently running a web server (for instance, a previous version of Apache, Microsoft
    Internet Information Services, or Microsoft Personal Web Server) on your machine.
    You might want to uninstall or otherwise disable existing servers. You can run
    several web servers, but they must run in different address and port combinations.


    Before downloading the installer, take a moment—a very important moment—and look
    for a statement on the downloads page (found at http://httpd.apache.org/download.cgi)
    that says “If you are downloading the Win32 distribution, please read these important
    notes.”The direct URL to these notes is http://www.apache.org/dist/httpd/binaries/win32/README.html.


    The Apache Software Foundation maintains this page for the benefit of Windows
    users who want to run a version of the Apache server. On this page, there are
    notes for nearly every flavor of Windows still in use, and it is in your best
    interest to read the information presented. I guarantee that if you are running
    Apache as either a production or development server, you find relevant information
    on the notes page.


    When you''re ready to begin the installation, look for the link labeled Win32
    Binary (MSI Installer). After you download the installer, double-click the file
    to start the installation process. You will get a welcome screen, as shown in
    Figure 3.1.


    ![](img/be3c5789b9e58d6dc55dc804718f15b4_48_0.png)


    FIGURE 3.1 The Windows installer welcome screen.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'Click Next to continue the installation process and you will be prompted to
    accept the Apache license. Basically the license says that you can do whatever
    you want with the software—including making proprietary modifications—except claim
    that you wrote it, but be sure to read the license so that you fully understand
    the terms.


    After you accept the license, the installer presents you with a brief introduction
    to Apache. Following that, it asks you to provide basic information about your
    computer, as shown in Figure 3.2. This includes the full network address for the
    server (for instance, mycomputer.mydomain.com) and the administrator''s email
    address. The server name is the name your clients will use to access your server,
    and the administrator email address is added to error messages so that visitors
    know how to contact you when something goes wrong.


    NOTE: If your machine does not have a full network address, use localhost or 127.0.0.1
    as the server name.


    Also on this screen, you are prompted to select which installation shortcuts should
    be installed—those for starting Apache as a service or those for starting Apache
    manually. Installing Apache as a service causes it to run every time Windows starts,
    and you can control it through the standard Windows service administration tools.
    Installing Apache for the current user requires you to start Apache manually and
    set the default port on which Apache listens to requests to 8080 (instead of 80).
    Select the appropriate radio button and click Next to continue.


    The next screen enables you to choose the type of installation: typical or custom.
    A typical installation means that Apache binaries and documentation are installed,
    but headers and libraries are not. This is the best option to choose unless you
    plan to compile your own modules.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '![](img/be3c5789b9e58d6dc55dc804718f15b4_50_0.png)


    FIGURE 3.2 The basic information screen.


    A custom installation enables you to choose whether to install header files or
    documentation. After selecting the target installation directory, which defaults
    to c:\Program Files\Apache Group, the program proceeds with the installation process.
    If everything goes well, it will present you with the final screen shown in Figure
    3.3.


    ![](img/be3c5789b9e58d6dc55dc804718f15b4_50_1.png)


    FIGURE 3.3 The successful installation screen.


    In the next section, you''ll learn about the Apache configuration file and eventually
    start up your new server.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Apache Configuration File Structure


    Apache keeps all its configuration information in text files. The main file is
    `httpd.conf`. This file contains directives and containers that enable you to
    customize your Apache installation. `Directives` configure specific settings of
    Apache, such as authorization, performance, and network parameters. `Containers`
    specify the context to which those settings refer. For example, authorization
    configuration can refer to the server as a whole, to a directory, or to a single
    file.


    # Directives


    The following rules apply for Apache directive syntax:


    +   - The directive arguments follow the directive name.

    +   - The directive arguments are separated by spaces.

    +   - The number and type of arguments vary from directive to directive; some
    have no arguments.

    +   - A directive occupies a single line, but you can continue it on a different
    line by ending the previous line with a backslash character (`\`).

    +   - The pound sign (#) should precede the directive, and must appear on its
    own line.


    The Apache server documentation offers a quick reference for directives at http://httpd.apache.org/docs/2.2/mod/quickreference.html.
    You''ll soon learn about some of the basic directives, but you should supplement
    your knowledge using the online documentation.


    The Apache documentation for directives typically follows this model:


    +   - **Description**—This entry provides a brief description of the directive.

    +   - **Syntax**—This entry explains the format of the directive options. Compulsory
    parameters appear in italics, optional parameters appear in italics and brackets.

    +   - **Default**—If the directive has a default value, it will appear here.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '+   Context—This entry details the containers or sections in which the directive
    can appear. The next section explains containers. The possible values are server
    config, virtual host, directory, and .htaccess.


    +   Override—Apache directives belong to different categories. The Override field
    specifies which directive categories can appear in .htaccess per-directory configuration
    files.


    +   Status—This entry indicates whether the directive is built in Apache (core),
    belongs to one of the bundled modules (base or extension, depending on whether
    they are compiled by default), is part of a multi-processing module (MPM), or
    is bundled with Apache but not ready for use in a production server (experimental).


    +   Module—This entry indicates the module to which the directive belongs.


    +   Compatibility—This entry contains information about which versions of Apache
    support the directive.


    Further explanation of the directive follows these entries in the documentation,
    and a reference to related directives or documentation might appear at the end.


    # Containers


    Directive containers, also called sections, limit the scope for which directives
    apply. If directives are not inside a container, they belong to the default server
    scope (server config) and apply to the server as a whole.


    These are the default Apache directive containers:


    +   <VirtualHost>—A VirtualHost directive specifies a virtual server. Apache enables
    you to host different websites with a single Apache installation. Directives inside
    this container apply to a particular website. This directive accepts a domain
    name or IP address and an optional port as arguments.


    +   <Directory>, <DirectoryMatch>—These containers allow directives to apply to
    a certain directory or group of directories in the file system. Directory containers
    take a directory or directory pattern argument. Enclosed directives apply to the
    specified directories and their subdirectories. The DirectoryMatch'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'container allows regular expression patterns to be specified as an argument.
    For example, the following allows a match of all second-level subdirectories of
    the www directory and made up of four numbers, such as a directory named after
    a year and month (0906 for September 2006):

    <DirectoryMatch "^/www.*/[0-9]{4}">


    +   ■ <Location>, <LocationMatch>—These containers allow directives to apply to
    certain requested URLs or URL patterns. They are similar to their Directory counterparts.
    LocationMatch takes a regular expression as an argument. For example, the following
    matches directories containing either "/my/data" or "/your/data":

    +   <LocationMatch "^/(\my;your)/data">


    +   ■ <Files>, <FilesMatch>—Similar to the Directory and Location containers,
    Files sections allow directives to apply to certain files or file patterns.


    Containers surround directives, as shown in Listing 3.1.


    ```

    LISTING 3.1 Sample Container Directives

    1: <Directory "/some/directory">

    2:   SomeDirective1

    3:   SomeDirective2

    4: </Directory>

    5: <Location "/downloads/*.html">

    6:   SomeDirective3

    7: </Location>

    8: <Files "\.(gif|jpg)">

    9:   SomeDirective4

    10: </Files>

    ```


    Sample directives SomeDirective1 and SomeDirective2 apply to the directory /some/directory
    and its subdirectories. SomeDirective3 applies to URLs referring to pages with
    the .html extension under the /downloads/ URL. SomeDirective4 will apply to all
    files with .gif or .jpg extensions.


    # Conditional Evaluation


    Apache provides support for conditional containers. Directives enclosed in these
    containers will be processed only if certain conditions are met.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '<IfDefine>—Directives in this container will be processed if a specific command-line
    switch is passed to the Apache executable. The directive in Listing 3.2 is processed
    only if the -DMyModule switch is passed to the Apache binary being executed. You
    can pass this directly or by modifying the apachectl script, as described in the
    “Apache-Related Commands” section later in this chapter.


    IfDefine containers also allow you to negate the argument. That is, directives
    inside a <IfDefine !MyModule> section—notice the exclamation point before the
    MyModule name—are processed only if no -DMyModule parameter is passed as a command-line
    argument.


    <IfModule>—Directives in an IfModule section will be processed only if the module
    passed as an argument is present in the web server. For example, Apache ships
    with a default httpd.conf configuration file that provides support for different
    MPMs. Only the configuration belonging to the MPM compiled into Apache will be
    processed, as you can see in Listing 3.3. The purpose of the example is to illustrate
    that only one of the directive groups will be evaluated.


    # LISTING 3.2 IfDefine Example


    ```

    1: <IfDefine MyModule>

    2: LoadModule my_module modules/libmy module.so

    3: </IfDefine>

    ```


    # LISTING 3.3 IfModule Example


    ```

    1: <IfModule prefork.c>

    2: StartServers 5

    3: MinSpareServers 5

    4: MaxSpareServers 10

    5: MaxClients 20

    6: MaxRequestsPerChild 0

    7: </IfModule>

    8:

    9: <IfModule worker.c>

    10: StartServers 3

    11: MaxClients 8

    12: MinSpareThreads 5

    13: MaxSpareThreads 10

    14: ThreadsPerChild 25

    15: MaxRequestsPerChild 0

    16: </IfModule>

    ```'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# # The ServerRoot Directive


    The ServerRoot directive takes a single argument: a directory path pointing to
    the directory where the server lives. All relative path references in other directives
    are relative to the value of ServerRoot. If you compiled Apache from source on
    Linux/UNIX, as described earlier in this chapter, the default value of ServerRoot
    is /usr/local/apache2. The ServerRoot for Mac OS X users defaults to /Library/WebServer.
    If you used the Windows installer, the ServerRoot is C:\Program Files\Apache Software
    Foundation\Apache 2.2\.


    # # Per-Directory Configuration Files


    Apache uses per-directory configuration files to allow directives to exist outside
    the main configuration file, httpd.conf. These special files can be placed in
    the filesystem. Apache will process the content of these files if a document is
    requested in a directory containing one of these files or any subdirectories under
    it. The contents of all the applicable per-directory configuration files are merged
    and processed. For example, if Apache receives a request for the /usr/local/apache2/htdocs/index.html
    file, it will look for per-directory configuration files in the /, /usr, /usr/local,
    /usr/local/apache2, and /usr/local/apache2/htdocs directories, in that order.


    > CAUTION: Enabling per-directory configuration files has a performance penalty.
    Apache must perform expensive disk operations looking for these files in every
    request, even if the files do not exist.


    Per-directory configuration files are called .htaccess by default. This is for
    historical reasons; they originally protected access to directories containing
    HTML files.


    The AccessFileName directive enables you to change the name of the per-directory
    configuration files from .htaccess to something else. It accepts a list of filenames
    that Apache will use when looking for per-directory configuration files.


    To determine whether you can override a directive in the per-directory configuration
    file, check whether the Context: field of the directive syntax definition that
    contains .htaccess. Apache directives belong to different groups, as specified
    in the Override field in the directive syntax description. Possible values for
    the Override field are as follows:


    +   - AuthConfig—Directives controlling authorization

    +   - FileInfo—Directives controlling document types

    +   - Indexes—Directives controlling directory indexing'
  merge: -1
  img_proc: true
- pgno: 56
  md: '+   - Limit—Directives controlling host access

    +   - Options—Directives controlling specific directory features


    You can control which of these directive groups can appear in per-directory configuration
    files by using the AllowOverride directive. AllowOverride can also take an All
    or a None argument. All means that directives belonging to all groups can appear
    in the configuration file. None disables per-directory files in a directory and
    any of its subdirectories. Listing 3.4 shows how to disable per-directory configuration
    files for the server as a whole. This improves performance and is the default
    Apache configuration.


    ```

    LISTING 3.4 Disabling Per-Directory Configuration Files

    1: <Directory />

    2: AllowOverride none

    3: </Directory>

    ```


    # Apache Log Files


    Apache includes two log files by default. The access_log file is for tracking
    client requests. The error_log file is for recording important events, such as
    errors or server restarts. These files don’t exist until you start Apache the
    first time. The names of the files are access.log and error.log in Windows platforms.


    # The access_log File


    When a client requests a file from the server, Apache records several parameters
    associated with the request, including the IP address of the client, the document
    requested, the HTTP status code, and the current time. Listing 3.5 shows sample
    log file entries.


    ```

    LISTING 3.5 Sample access_log Entries

    1: 127.0.0.1 - - [13/Apr/2008:08:33:25 -0700] "GET / HTTP/1.1"

    200 44

    2: 127.0.0.1 - - [13/Apr/2008:08:33:25 -0700] "GET /favicon.ico

    HTTP/1.1" 404 209

    ```'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# # The error_log File


    The error_log file includes error messages, startup messages, and any other significant
    events in the life cycle of the server. This is the first place to look when you
    have a problem with Apache. Listing 3.6 shows sample error_log entries.


    # ### LISTING 3.6 Sample error_log Entries


    ```

    1: Starting the Apache2.2 service [The Apache2.2 service is running.]

    2: Apache/2.2.8 (Win32) configured -- resuming normal operations

    3: [Sun Apr 13 08:29:34 2008] [notice] Server built: Jan 18 2008 00:37:19

    4: [Sun Apr 13 08:29:34 2008] [notice] Parent: Created child process 3504

    5: [Sun Apr 13 08:29:35 2008] [notice] Child 3504: Child process is running

    6: [Sun Apr 13 08:29:35 2008] [notice] Child 3504: Acquired the start mutex.

    ```


    # # Additional Files


    The httpd.pid file contains the process ID of the running Apache server. You can
    use this number to send signals to Apache manually, as described in the next section.
    The scoreboard file, the present configuration file on Linux/UNIX Apache, is used
    by the process-based MPMs to communicate with their children. In general, you
    do not need to worry about these files.


    # # Apache-Related Commands


    The Apache distribution includes several executables. This section covers only
    the server binary and related scripts.


    # # Apache Server Binary


    The name of the Apache executable is httpd in Linux/UNIX and Mac OS X, and apache.exe
    in Windows. It accepts several command-line options, some of which are described
    in Table 3.1. You can get a complete listing of options by typing /usr/local/apache2/bin/httpd
    -h on Linux/UNIX, by typing /usr/sbin/httpd -h on Mac OS X, or by typing apache.exe
    -h from a command prompt on Windows.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '| OPTION | MEANING |

    |---|---|

    | -D | Allows you to pass a parameter that can be used for <IfDefine> section
    processing |

    | -l | Lists compiled-in modules |

    | -v | Shows version number and server compilation time |

    | -f | Allows you to pass the location of httpd.conf if it is different from the
    compile-time default |


    After Apache is running, you can use the kill command on Linux/UNIX and Mac OS
    X to send signals to the parent Apache process. Signals provide a mechanism to
    send commands to a process. To send a signal, execute the following command:


    ```

    # kill -SIGNAL pid

    ```


    In this syntax, pid is the process ID and SIGNAL is one of the following:


    +   - HUP—Stop the server

    +   - USR1 or WINCH—Graceful restart; which signal to use depends on the underlying
    operating system

    +   - SIGHUP—Restart


    If you make some changes to the configuration files and you want them to take
    effect, you must signal Apache that the configuration has changed. You can do
    this by stopping and starting the server or by sending a restart signal. This
    tells Apache to reread its configuration.


    A normal restart can result in a momentary pause in service. A graceful restart
    takes a different approach: Each thread or process serving a client continues
    processing the current request, but when it finishes, it is killed and replaced
    by a new thread or process with the new configuration. This allows seamless operation
    of the web server with no down-time.


    On Windows, you can signal Apache using the apache.exe executable. Some commands
    are listed here:


    +   - apache.exe -k restart—Tells Apache to restart

    +   - apache.exe -k graceful—Tells Apache to do a graceful restart

    +   - apache.exe -k stop—Tells Apache to stop'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'You can access shortcuts to these commands in the Start menu entries that the
    Apache installer created. If you installed Apache as a service, you can start
    or stop Apache by using the Windows service interface: In Control Panel, select
    Administrative Tasks and then click the Services icon.


    # Apache Control Script


    Although it is possible to control Apache on Linux/UNIX using the httpd binary,
    it is recommended that you use the apachectl tool. The apachectl support program
    wraps common functionality in an easy-to-use script. To use apachectl, type the
    following:


    ```

    `# /usr/local/apache2/bin/apachectl command`

    ```


    In this syntax, *command* can be stop, start, restart, or graceful. You can also
    edit the contents of the apachectl script to add extra command-line options. Some
    OS distributions provide you with additional scripts to control Apache; please
    check the documentation included with your distribution.


    # Starting Apache for the First Time


    Before you start Apache, you should verify that the minimal set of information
    is present in the Apache configuration file, `httpd.conf`. The following sections
    describe the basic information needed to configure Apache and to start the server.


    # Check Your Configuration File


    You can edit the Apache `httpd.conf` file with your favorite text editor. In Linux/UNIX
    and Mac OS X, this probably means `vi` or `emacs`. In Windows, you can use Notepad
    or WordPad. You must remember to save the configuration file in plain text, which
    is the only format Apache will understand.


    There are only two parameters that you might need to change to enable you to start
    Apache for the first time: the name of the server and the address and port to
    which it is listening. The name of the server is the one Apache will use when
    it needs to refer to itself (for example, when redirecting requests).'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'Apache can usually figure out its server name from the IP address of the machine,
    but this is not always the case. If the server does not have a valid DNS (domain
    name service) entry, you might need to specify one of the IP addresses of the
    machine. If the server is not connected to a network (you might want to test Apache
    on a standalone machine), you can use the value 127.0.0.1, which is the loopback
    address. The default port value is 80. You might need to change this value if
    a server is already running in the machine at port 80 or if you do not have administrator
    permissions—on Linux/UNIX and Mac OS X systems, only the root user can bind to
    privileged ports (those with port numbers lower than 1024).


    You can change both the listening address and the port values with the Listen
    directive. The Listen directive takes either a port number or an IP address and
    a port, separated by a colon. If you specify only the port, Apache will listen
    on that port at all available IP addresses in the machine. If you provide an additional
    IP address, Apache will listen at only that address and port combination. For
    example, Listen 80 tells Apache to listen for requests at all IP addresses on
    port 80. Listen 10.0.0.1:443 tells Apache to listen at only 10.0.0.1 on port 443.


    The ServerName directive enables you to define the name the server will report
    in any self-referencing URLs. The directive accepts a DNS name and an optional
    port, separated by a colon. Make sure that ServerName has a valid value. Otherwise,
    the server will not function properly; for example, it will issue incorrect redirects.


    On Linux/UNIX and Mac OS X platforms, you can use the User and Group directives
    to specify which user and group IDs the server will run as. The nobody user is
    a good choice for most platforms. However, there are problems in the HP-UX platform
    with this user ID, so you must create and use a different user ID, such as www.


    # Starting Apache


    To start Apache on Linux/UNIX, change to the directory containing the apachectl
    script and execute the following command:


    ```

    # /usr/local/apache2/bin/apachectl start

    ```


    Mac OS X users can type the following at the prompt:


    ```

    # /usr/sbin/httpd

    ```'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'To manually start Apache on Windows, click the Start Apache in Console link
    in the Control Apache Server section, within the Apache HTTP Server 2.2 program
    group in the Start menu. If you installed Apache as a service, you must start
    the Apache service instead.


    If everything goes well, you can access Apache using a browser. A default installation
    page displays, such as the one shown in Figure 3.4. If you cannot start the web
    server or an error page appears instead, please consult the “Troubleshooting”
    section that follows. Make sure that you are accessing Apache in one of the ports
    specified in the Listen directive—usually port 80 or 8080.


    ![](img/be3c5789b9e58d6dc55dc804718f15b4_61_0.png)


    FIGURE 3.4 Apache default installation page.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Troubleshooting


    The following subsections describe several common problems that you might encounter
    the first time you start Apache.


    # Already an Existing Web Server


    If a server is already running on the machine and is listening to the same IP
    address and port combination, Apache will not be able to start successfully. You
    will get an entry in the error log file indicating that Apache cannot bind to
    the port:


    ```

    [crit] (48)Address already in use: make_sock: could not bind..[alert] no listening
    sockets available, shutting down

    ```


    To solve this problem, you need to stop the running server or change the Apache
    configuration to listen on a different port.


    # No Permission to Bind to Port


    You will get an error if you do not have administrator permissions and you try
    to bind to a privileged port (between 0 and 1024):


    ```

    [crit] (13)Permission denied: make_sock: could not bind to address 10.0.0.2:80
    [alert] no listening sockets available, shutting down

    ```


    To solve this problem, you must either log on as the administrator before starting
    Apache or change the port number (8080 is a commonly used nonprivileged port).


    # Access Denied


    You might not be able to start Apache if you do not have permission to read the
    configuration files or to write to the log files. You will get an error similar
    to the following:


    ```

    (13)Permission denied: httpd: could not open error log file

    ```


    This problem can arise if the user who built and installed Apache is different
    from the user trying to run it.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Wrong Group Settings


    You can configure Apache to run under a certain username and group. Apache has
    default values for the running server username and group. Sometimes the default
    value is not valid and you will get an error containing setgid: unable to set
    group id.


    To solve this problem on Linux/UNIX and Mac OS X, you must change the value of
    the Group directive in the configuration file to a valid value. Check the /etc/groups
    file for existing groups.'
  merge: -1
  img_proc: true
- pgno: 64
  md: "# # Installing and Configuring PHP\n\nIn this last of the three installation-related\
    \ chapters, you will acquire, install, and configure PHP and make some basic changes\
    \ to your Apache installation.\n\n# ## Current and Future Versions of PHP\n\n\
    The installation instructions in this chapter refer to PHP version 5.2.5, which\
    \ is the current version of the software.\n\n> NOTE: If you are already using\
    \ PHP 4.x.x in a production environment, or you want to stay with the 4.x.x development\
    \ tree, please visit the Installation and Configuration section of the PHP Manual\
    \ at http://www.php.net/install.\n> \n> Because PHP 5 has been in use for more\
    \ than three years and PHP 6 will likely become production-ready in 2009, the\
    \ status of PHP 4 is officially “end of life”—this means the PHP Group has not\
    \ made any updates to PHP 4 since December 31, 2007. For more information, visit:\
    \ http://www.php.net/archive/2007.php#2007-07-13-1.\n> \n> The code in this kit\
    \ assumes the use of PHP 5 and not PHP 4; in some instances, the code is no different\
    \ between the versions, but you should familiarize yourself with the difference\
    \ between the two versions so that you can make the appropriate adjustments."
