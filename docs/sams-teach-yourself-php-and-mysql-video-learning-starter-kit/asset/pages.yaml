- pgno: 7
  md: 'The complete text of the lessons in PDF—All the video lessons in this course
    are based on chapters from the print book *Sams Teach Yourself PHP in 10 Minutes*.
    So to help you out if you want to re-read a particular lesson or quickly look
    up a term or technique, we’ve included the full text of the book in easily searchable
    PDF format.


    # How The Course Is Organized


    Sams Teach Yourself PHP and MySQL Video Learning is organized into five parts,
    with each part made up of at least six video lessons designed to be completed
    in 10 minutes or less.


    # Part I: PHP Foundations


    The lessons in Part I introduce the basic building blocks of the PHP language:


    +   - Lesson 1: Getting to Know PHP. Introduces you to what PHP is all about and
    gives some simple examples to show how PHP is used inside a web page.

    +   - Lesson 2: Variables. Explains how you assign values to variables and demonstrates
    some simple expressions.

    +   - Lesson 3: Flow Control. Examines the conditional and looping constructs
    that allow you to control the flow of a PHP script.

    +   - Lesson 4: Functions. Explains how you can modularize and reuse a frequently
    used section of code as a function.

    +   - Lesson 5: Working with Numbers. Gives more detailed examples of numeric
    manipulations you can perform in PHP.

    +   - Lesson 6: Working with Strings. Examines the powerful set of functions that
    PHP provides to work with strings of text characters.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# # Part II: Using PHP to Work with Data


    The lessons in Part II examine in more detail the different types of data that
    can be manipulated by PHP:


    +   - **Lesson 7: Working with Arrays.** Explains how arrays work and examines
    the PHP functions that can manipulate this powerful data type.


    +   - **Lesson 8: Regular Expressions.** Shows how to perform complex string manipulation
    by using regular expressions.


    +   - **Lesson 9: Working with Dates and Times.** Examines how to use date and
    time values in a PHP script.


    +   - **Lesson 10: Using Classes.** Introduces you to object-oriented PHP and
    examines how you define and access a class in a script.


    +   - **Lesson 11: Processing HTML Forms.** Shows how you use PHP to process user-submitted
    input from an HTML form.


    +   - **Lesson 12: Generating Dynamic HTML.** Examines some techniques for creating
    HTML components on-the-fly from PHP.


    # # Part III: PHP and the Web Environment


    The lessons in Part III deal with using PHP specifically in the web environment:


    +   - **Lesson 13: Form Validation.** Examines some techniques for validating
    user-submitted input from an HTML form.


    +   - **Lesson 14: Cookies and Sessions.** Shows how to pass data between pages
    by using PHP sessions and how to send cookies to a user''s browser.


    +   - **Lesson 15: User Authentication.** Examines some techniques for validating
    user-submitted input from an HTML form.


    +   - **Lesson 16: Communicating with the Web Server.** Looks at ways in which
    PHP can interact with a web server.


    +   - **Lesson 17: Filesystem Access.** Examines the PHP functions that enable
    you to access a server''s filesystem.


    +   - **Lesson 18: Host Program Execution.** Examines the PHP functions that enable
    you to execute programs on the host system.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# # Part IV: Using MySQL with PHP


    Part IV looks at how PHP can communicate with databases such as MySQL, and also
    covers basic PHP administration and security techniques.


    +   - **Lesson 19: Using a MySQL Database.** Shows how to use a MySQL database
    for data storage and retrieval from PHP.

    +   - **Lesson 20: Database Abstraction.** Explains how you can access a database
    through an abstraction layer to make scripts more portable.

    +   - **Lesson 21: Running PHP on the Command Line.** Shows how you can use PHP
    as a powerful shell scripting language.

    +   - **Lesson 22: Error Handling and Debugging.** Discusses some techniques for
    finding and fixing bugs in scripts.

    +   - **Lesson 23: PHP Configuration.** Explains some of the popular configuration
    options that can be set at runtime to change the behavior of PHP.

    +   - **Lesson 24: PHP Security.** Discusses security issues in PHP scripts and
    shows how you can use Safe Mode on a shared web server.

    +   - **Lesson 25: Using PEAR.** Introduces the freely available classes that
    are available in the PHP Extension and Application Repository.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Using this Video Learning Kit


    The Sams Teach Yourself PHP and MySQL Video Learning Kit can be used in a variety
    of different ways, depending on what your learning needs and style might be.


    Watching the video lessons alone would provide a good, quick overview of the PHP
    language and the process of developing simple PHP and MySQL scripts. And the quizzes
    at the end of each lesson provide an easy way to quickly test yourself before
    you go on to the next lesson.


    Both the videos and the quizzes require nothing more than a DVD drive on your
    computer and a web browser with the Flash plugin installed.


    For the best, most complete experience, however, nothing beats learning by doing.
    The Learning Lab exercises in each lesson are designed to give the learner hands-on
    experience in a real, live (not simulated) web server environment.


    All that’s required for the Learning Lab exercises is either a web hosting service
    that provides you with access to PHP and to MySQL databases, or taking the time
    before you begin the lessons to set up a web server learning environment on your
    Windows PC or Mac using the software included on the DVD.


    # How to Watch the Videos


    The requirements for watching the video lessons in this kit are fairly straightforward:


    +   - Any kind of a Windows, Mac, or Linux PC with a DVD drive that’s capable
    of reading data DVDs.

    +   - A web browser, such as Microsoft Internet Explorer, Safari, or Mozilla Firefox.'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'NOTE: Make sure you''ve put the DVD in your computer''s DVD drive. The DVD
    will not run on a computer''s CD drive. Nor will it work in a DVD player designed
    for plugging into a TV for watching movies.


    The Adobe Flash Player plugin, which allows you to view Flash videos in your browser.
    If you can watch videos on YouTube, you should be all set.


    Once you''re sure you''ve got everything, you''re ready to get started:


    +   1. Insert the DVD from this package into your DVD drive on your computer.

    +   2. If the DVD main interface does not automatically start up, navigate to
    the DVD folder on your computer and double-click on the icon or file named Start
    (start.exe on Windows or start.app on Mac OS X).


    ![](img/be3c5789b9e58d6dc55dc804718f15b4_11_0.png)


    FIGURE 1.1 The DVD''s main interface.


    +   3. To watch the videos, choose the lesson you want to start with from the
    list of lessons on the left side of the window (Figure 1.1), and then click on
    the play button in the player window on the right side.

    +   4. To set up the learning environment software click on the "Install Software
    and Support" link in the lower left corner in the window.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# # How to Use the Learning Labs and Take the Quizzes


    After each video in complete you can optionally work through the Learning Lab
    exercises and take a short (not too hard) quiz to help assess what you''ve learned
    in that lesson.


    The Learning Lab exercises in this course require you to set up a web server learning
    environment either at a web hosting service or on your own computer (see the next
    section for detailed installation instructions).


    Once your learning environment is set up, the instructions for each exercise walk
    you through the process one step at a time.


    It''s usually recommended that you take the time to type in the needed code for
    each exercise—it''s generally thought that typing it in yourself helps you become
    more familiar with the details of how the code is structured and used. But if
    you''re just a terrible typist or if you want to speed things up a little, the
    complete code for the exercise is on the second tab in the browser windows, ready
    for cutting and pasting into your code editor.


    The quizzes after the exercises are relatively short and painless. After you make
    your choice, the program will tell you immediately if you''re correct or wrong.
    Your answers are not stored or compiled, so you can take the quizzes as often
    as you like, and guessing won''t count against you.


    # ## Setting up Your Learning Environment


    As mentioned above, to complete the exercises in the lessons you''ll need to have
    access to a web server environment running either on your own computer at home
    or on a web hosting service where you have access to the PHP scripting language
    and you can create and administer MySQL databases.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'Many web hosting services offer PHP and MySQL access for customers who need
    them. If you’re uncertain about this, inquire with your service whether they offer
    PHP and MySQL or not, and if so how to use them on your service.


    However, since you’re only going to be trying out simple exercises, and not presumably
    making your work available to the entire World Wide Web for now, a better solution
    for your learning environment might be to install the needed software on your
    computer using the DVD in this package. You don’t even need to be connected to
    the Internet to do this.


    Since the instructions for Windows PC and Macs are somewhat different, we’ve included
    quick step-by-step instructions in two separate sections, one for Windows and
    one for Mac OS X. Just choose the one that’s right for you.


    NOTE: The following installation guidelines are designed to get you up and running
    as quickly and efficiently as possible, using the software included on the DVD.


    Should you have difficulties along the way, or if you want to download the most
    recent versions of PHP, MySQL or Apache from the Internet, more detailed instructions,
    with extended explanatory and trouble-shooting information, are available in the
    chapters immediately following this one.


    # # Installing PHP, MySQL, and Apache on Windows


    The setup files included on the DVD are suitable for Windows XP, 2003, and Vista.
    Earlier versions of Windows are not supported.


    To launch the software installation program (Figure 1.10) doubleclick on the “Software”
    icon or file in the DVD’s main folder.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '![](img/be3c5789b9e58d6dc55dc804718f15b4_14_0.png)


    FIGURE 1.2 The Windows DVD installation menu.


    # Installing MySQL


    Click the button in the menu to begin installing MySQL 5.0. At the screen shown
    in Figure 1.3, click the Next button to continue.


    ![](img/be3c5789b9e58d6dc55dc804718f15b4_14_1.png)


    FIGURE 1.3 Beginning a MySQL installation on Windows.'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'The next few screens will contain general information regarding installation
    and the MySQL license. Read these screens and click the Continue button to move
    through them. The first important choice you will encounter is the installation
    type—typical, compact, or custom—as shown in Figure 1.4. A typical installation
    will do the job here, so leave the default item selected and click the Next button
    to continue installing.


    ![](img/be3c5789b9e58d6dc55dc804718f15b4_15_0.png)


    # FIGURE 1.4 MySQL installation type selection.


    When the installation is complete, continue to the MySQL Configuration Wizard
    to create a custom my.ini file tailored to your particular needs. To continue
    to the MySQL Configuration Wizard, check the Configure MySQL Server Now check
    box and click the Finish button, as shown in Figure 1.5.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '![](img/be3c5789b9e58d6dc55dc804718f15b4_16_0.png)


    FIGURE 1.5 MySQL has been installed; now continue to the MySQL Configuration Wizard.


    Select the appropriate configuration options presented on the several screens
    in the MySQL Configuration Wizard; for detailed explanations of these options
    consult the extended installation and configuration instructions in PDF on the
    DVD. When you have finished your configuration—which includes the addition of
    a password for the root user—the wizard will start the MySQL service.


    # ## Installing Apache


    Click the button in the Windows DVD installation menu to begin installing Apache
    2.2. At the screen shown in Figure 1.6, click the Next button to continue.


    You must accept the license terms on the next screen to continue the installation
    operation, after which you will see some release notes. Click the Next button
    after you read the notes and you will see a request for you to enter your server
    information, as shown in Figure 1.7.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '![](img/be3c5789b9e58d6dc55dc804718f15b4_17_0.png)


    # FIGURE 1.6 Beginning Apache installation on Windows.


    ![](img/be3c5789b9e58d6dc55dc804718f15b4_17_1.png)


    # FIGURE 1.7 Entering your Apache server details.


    Enter your server''s domain and hostname, and your email address.

    If you are installing on a personal workstation, use localhost and

    localdomain for your server information. Leave the radio button

    selected on the Recommended option to install Apache on port 80.


    The next screen asks you to choose a setup type, either typical or

    custom. The typical setup is just fine, so leave the radio button selected

    on that option and click Next to continue.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Then you have the opportunity to select the destination folder for the Apache
    files. By default this is C:\Program Files\Apache Software Foundation\Apache 2.2\—this
    location shouldn''t cause you any problems. If you want to change it, click the
    Change button before you click the Next button.


    Finally, Apache is ready to install. Click the Install button to start files copying
    to and setting up on your system.


    When the installation operation is complete, the Apache server and monitor program
    will start and you will see a new icon in your system tray.


    You can verify that Apache has started successfully by opening a web browser and
    visiting http://localhost/. The default Apache page will display, as shown in
    Figure 1.8.


    ![](img/be3c5789b9e58d6dc55dc804718f15b4_18_0.png)


    FIGURE 1.8 Apache default installation page.


    You can stop or restart the web server from the Apache Service Monitor or from
    the Windows Service Manager.


    # Installing PHP


    Click the option on the Windows DVD installation menu to install PHP 5.2; a zip
    archive will open, as shown in Figure 1.9.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '![](img/be3c5789b9e58d6dc55dc804718f15b4_19_0.png)


    # FIGURE 1.9 Beginning installation of PHP on Windows.


    Extract the contents of the zip archive to C:\php. Close this window when the
    extraction operation has finished.


    The installation process for PHP requires manual intervention to add the PHP module
    to Apache. Using File Explorer, open the Apache configuration directory—if you
    used the default location, it will be C:\Program Files\Apache Software Foundation\Apache
    2.2\conf—and edit httpd.conf. Look for a section that contains a number of LoadModule
    directives, some prefixed with a # sign. The last few lines of this section will
    look like this:


    ```

    LoadModule userdir_module modules/mod_userdir.so

    #LoadModule usertrack_module modules/mod_usertrack.so

    #LoadModule vhost_alias_module modules/mod_vhost_alias.so

    #LoadModule ssl_module modules/mod_ssl.so

    ```


    Add the following line to the LoadModule section to tell Apache to load the PHP
    module on startup:


    ```

    LoadModule php5_module c:/php/php5apache2_2.dll

    ```


    Additionally, add the following line to ensure that Apache knows where php.ini
    resides:


    ```

    PHPIniDir "C:/php/"

    ```


    Next, search for the AddType section with directives that look like this:


    ```

    AddType application/x-tar .tgz

    AddType image/x-icon .ico

    ```


    Add the following line to tell Apache to process any file ending with .php or
    .html as a PHP script. You can add more file extensions to this line separated
    by spaces if you choose:


    ```

    AddType application/x-httpd-php .php .html

    ```'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'We also need to make a version of php.ini available.To do this, first add your
    PHP directory to your Windows PATH. (This involves editing your system environment
    variables in Windows'' System Properties, so that C:\php is included as a value
    for the Path variable. If you''re not familiar with the process for doing this,
    try a web search or look up the following phrase in Windows Help:"Add or change
    the values of environment variables").


    Next, in the PHP installation directory, copy the php.ini -recommended file to
    php.ini. After making these changes, you must restart the Apache server—use the
    Apache Service Monitor or the Windows Service Manager.


    If you encounter problems starting Apache, check the system events log from Control
    Panel and then Administrative Tools to find the error message.


    Now we''re ready to check whether PHP is working.In the htdocs directory in your
    Apache directory, create a file called phpinfo.php containing the following lines:


    ```

    <?php

    phpinfo();

    ?>

    ```


    In your web browser, visit http://localhost/phpinfo.php and you should see a page
    giving lots of information on the PHP configuration.


    > **NOTE:** Should you have difficulties with any of the steps in this process,
    need more detailed instructions, and view extended explanatory and trouble-shooting
    information, see Chapters 2, 3, and 4.


    # # Installing PHP, MySQL, and Apache on Mac OS X


    The setup files included on the DVD are suitable for Mac OS X version 10.3 or
    later. Note that Apache is already installed, so no installation information is
    included here.


    To launch the software installation program (Figure 1.10) doubleclick on the "Software"
    icon or file in the DVD''s main folder.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '![](img/be3c5789b9e58d6dc55dc804718f15b4_21_0.png)


    # FIGURE 1.10 The Mac OS X DVD installation menu.


    # Installing MySQL


    Click the button in the Mac OS X DVD installation menu to begin installing MySQL
    5.0. At the screen shown in Figure 1.11, click the Continue button.


    ![](img/be3c5789b9e58d6dc55dc804718f15b4_21_1.png)


    # FIGURE 1.11 Beginning a MySQL installation operation on the Mac.'
  merge: -1
