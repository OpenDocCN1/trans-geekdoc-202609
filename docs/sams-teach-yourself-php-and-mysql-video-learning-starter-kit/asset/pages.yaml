- pgno: 68
  md: 'The PHP installation program has made all the necessary changes to your Apache
    configuration, so there''s nothing left for you to do except skip ahead to the
    “Testing Your Installation” section.


    # Installing PHP on Windows


    Installing PHP on Windows requires nothing more than downloading the distribution
    file. To download the PHP distribution files, go to the home of PHP, http://www.php.net/,
    and follow the link to the Downloads section. Grab the latest version of the zip
    package (not the installer) from the Windows Binaries section—for this example,
    we are using 5.2.5. Your distribution will be named something similar to php -VERSION.zip,
    where VERSION is the most recent release number.


    > NOTE: You might ask, “Why not the installer?” The answer is simple: There are
    quite a few restrictions in the automatic setup of the various files, extensions,
    and configurations. The restrictions cause you to do more work to “fix” the installation
    than if you installed it manually in the first place. This situation, combined
    with this author’s belief that you should understand how technologies are put
    together if you plan to use them, and the PHP Group’s own recommendation that
    “use of the installer isn’t the preferred method for installing PHP,” results
    in the instructions you will find in this chapter.


    After the file downloads to your system, double-click it to launch your unzipping
    software. The distribution is packed up with relative pathnames already in place,
    so extract the files to a new directory called C:\php\, where it will place all
    the files and subdirectories under that new directory.


    From this point, only two basic steps need to be performed:


    +   1. Add your PHP directory to your Windows PATH. If you do not know how to
    do this, see the corresponding FAQ in the PHP Manual at http://www.php.net/manual/en/
    faq.installation.php#faq.installation.addtopath.

    +   2. In the PHP installation directory, copy the php.ini -recommended file to
    php.ini. To get a basic version of PHP working with Apache, you’ll need to make
    a few minor modifications to the Apache configuration file.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# # Integrating PHP with Apache on Windows


    To ensure that PHP and Apache get along with one another, you need to add a few
    items to the httpd.conf configuration file. First, find a section that looks like
    this:


    ```

    ```

    # Example:

    # LoadModule foo_module modules/mod_foo.so

    #

    LoadModule access_module modules/mod_access.so

    ...

    #LoadModule ssl_module modules/mod_ssl.so

    ```

    ```


    At the end of this section, add the following:


    ```

    LoadModule php5_module C:/php/php5apache2_2.dll

    ```


    Additionally, add the following to ensure Apache knows where php.ini resides:


    ```

    PHPIniDir "C:/php/"

    ```


    Next, look for this section:


    ```

    ```

    #

    # AddType allows you to add to or override the MIME

    # configuration

    # file mime.types for specific file types.

    #

    ```

    ```


    > **NOTE:** If you have trouble getting Apache to read the correct php.ini file,
    look at the "Runtime Configuration" entry in the PHP Manual, which provides the
    list of locations searched for php.ini at http://www.php.net/manual/en/configuration.php.


    Add the following line:


    ```

    AddType application/x-httpd-php .php .html

    ```


    This statement ensures that the PHP engine will parse files that end with the
    .php and .html extensions. Your selection of filenames might differ.


    Save the httpd.conf file and then restart Apache. The server should start without
    warning; PHP is now part of the Apache web server.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# # php.ini Basics


    After you have compiled or installed PHP, you can still change its behavior with
    the php.ini file. On Linux/UNIX systems, the default location for this file is
    /usr/local/php/lib or the lib subdirectory of the PHP installation location you
    used at configuration time. On a Windows system, this file should be in the PHP
    directory or another directory as specified by the value of PHPIniDir in the Apache
    httpd.conf file.


    Directives in the php.ini file come in two forms: values and flags. Value directives
    take the form of a directive name and a value separated by an equal sign. Possible
    values vary from directive to directive. Flag directives take the form of a directive
    name and a positive or negative term separated by an equal sign. Positive terms
    include 1, On, Yes, and True. Negative terms include 0, Off, No, and False. Whitespace
    is ignored.


    You can change your php.ini settings at any time, but after you do, you’ll need
    to restart the server for the changes to take effect. At some point, take time
    to read through the php.ini file on your own to see the types of things that you
    can configure.


    # # Testing Your Installation


    The simplest way to test your PHP installation is to create a small test script
    that uses the phpinfo() function. This function will produce a long list of configuration
    information. Open a text editor and type the following line:


    ```

    <?php phpinfo(); ?>

    ```


    Save this file as phpinfo.php and place it in the document root of your web server—the
    htdocs subdirectory of your Apache installation or the /Library/WebServer/Documents
    directory on Mac OS X. Access this file using your web browser, and you should
    see something like what is shown in Figure 4.4.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '![](img/be3c5789b9e58d6dc55dc804718f15b4_71_0.png)


    # FIGURE 4.4 The results of phpinfo().


    The exact output of phpinfo() depends on your operating system, PHP version, and
    configuration options.


    # Getting Installation Help


    Help is always at hand on the Internet, particularly for problems concerning open
    source software. Wait a moment before you click the send button, however. No matter
    how intractable your installation, configuration, or programming problem might
    seem, chances are you are not alone. Someone has probably already answered your
    question.


    When you hit a brick wall, your first recourse should be to the official PHP site
    at http://www.php.net/ (particularly the annotated manual at http://www.php.net/manual/).
    If you still can''t find your answer, don''t forget that the PHP site is searchable.
    The advice you are seeking may be lurking in a press release or a Frequently Asked
    Questions file. You can also search the mailing list archives at http://www.php.net/search.php.
    These archives represent a huge information resource with contributions from many
    of the great minds in the PHP community. Spend some time trying out a few keyword
    combinations.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'If you are still convinced that your problem has not been addressed, you might
    well be doing the PHP community a service by exposing it. You can join the PHP
    mailing lists at http://www.php.net/mailing-lists.php. Although these lists often
    have high volume, you can learn a lot from them. If you are serious about PHP
    scripting, you should certainly subscribe to at least a digest list. After you''ve
    subscribed to the list that matches your concerns, consider posting your problem.


    When you post a question, it is a good idea to include as much information as
    possible (without writing a novel). The following items are often pertinent:


    +   - Your operating system

    +   - The version of PHP you are running or installing

    +   - The configuration options you chose

    +   - Any output from the configure or make commands that preceded an installation
    failure

    +   - A reasonably complete example of the code that is causing problems


    Why all these cautions about posting a question to a mailing list? First, developing
    research skills will stand you in good stead. A good researcher can generally
    solve a problem quickly and efficiently. Posting a naive question to a technical
    list often results in a wait rewarded only by a message or two referring you to
    the archives where you should have begun your search for answers in the first
    place.


    Second, remember that a mailing list is not analogous to a technical support call
    center. No one is paid to answer your questions. Despite this, you have access
    to an impressive pool of talent and knowledge, including that of some of the creators
    of PHP itself. A good question and its answer will be archived to help other coders.
    Asking a question that has already been answered several times just adds more
    noise.


    Having said this, don''t be afraid to post a problem to the list. PHP developers
    are a civilized and helpful breed, and by bringing a problem to the attention
    of the community, you might be helping others to solve the same problem.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# # The Basics of PHP Scripts


    **TIP:** A good website for finding PHP-friendly editors is at http://www.php-editors.com.


    Let''s jump straight in with a PHP script. To begin, open your favorite text editor.
    Like HTML documents, PHP files are made up of plain text. You can create them
    with any text editor, and most popular HTML editors provide at least some support
    for PHP.


    Type in the example in Listing 4.1 and save the file, using a name something like
    first.php.


    ```

    LISTING 4.1 A Simple PHP Script

    1: <?php

    2:    echo "<h1>Hello Web!</h1>";

    3: ?>

    ```


    If you are not working directly on the machine that will be serving your PHP script,
    you will need to use an FTP or SCP client to upload your saved document to the
    server. When the document is in place on the server, you should be able to access
    it using your browser. If all has gone well, you should see the script''s output.
    Figure 4.5 shows the output from the first.php script.


    ![](img/be3c5789b9e58d6dc55dc804718f15b4_73_0.png)


    FIGURE 4.5 Success:the output from first.php.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Beginning and Ending a Block of PHP Statements


    When writing PHP, you need to inform the PHP engine that you want it to execute
    your commands. If you don’t do this, the code you write will be mistaken for HTML
    and will be output to the browser. You can designate your code as PHP with special
    tags that mark the beginning and end of PHP code blocks. Table 4.1 shows four
    such PHP delimiter tags.


    | TAG STYLE | START TAG | END TAG |

    |---|---|---|

    | Standard tags | <?php | ?> |

    | Short tags | <? | ?> |

    | ASP tags | <% | %> |

    | Script tags | <script language="php"> | </script> |


    Of the tags in Table 4.1, only the standard and script tags are guaranteed to
    work on any configuration. You must explicitly enable the short and ASP-style
    tags in your php.ini file.


    To activate recognition for short tags, you must make sure that the short_open_tag
    switch is set to 0n in php.ini:


    ```

    Short_open_tag = On;

    ```


    To activate recognition for the ASP-style tags, you must enable the asp_tags setting
    in php.ini:


    ```

    asp_tags = On;

    ```


    After you have edited php.ini and restarted Apache, you should be able to use
    any of the four styles in your scripts. This is largely a matter of preference,
    although if you intend to include XML in your script, you should disable the short
    tags (<? ?>) and work with the standard tags (<?php ?>).


    Let’s run through some of the ways in which you can legally write the code in
    Listing 4.1. Given the configuration changes shown earlier, you can use any of
    the four PHP start and end tags that you have seen:


    ```

    <?

    Echo "Hello Web!";

    ?>

    ```


    > **NOTE:** To ensure portable, reusable code, it’s best to use the standard tags
    instead of short tags or ASP-style tags for the simple reason that server configurations
    are unique—use the standard style because you know you can count on it as part
    of any configuration.


    > **CAUTION:** The character sequence ?< tells an XML parser to expect a processing
    instruction and is therefore frequently included in XML documents. If you include
    XML in your script and have short tags enabled, the PHP engine is likely to confuse
    XML processing instructions and PHP start tags. Disable short tags if you intend
    to incorporate XML in your document.'
  merge: -1
  img_proc: true
- pgno: 75
  md: '```

    <?php

    echo "Hello Web!";

    ?>

    ```


    ```

    <%

    echo "Hello Web!";

    %>

    ```


    ```

    <script language="php">

    echo "Hello Web!";

    </script>

    ```


    You can also put single lines of code in PHP on the same line as the PHP start
    and end tags:


    ```

    <? echo "Hello Web!"; ?> .

    ```


    Now that you know how to define a block of PHP code, let’s take a closer look
    at the code in Listing 4.1 itself.


    # The echo Statement and print() Function


    Simply put, you use the echo statement to output data. In most cases, anything
    output by echo ends up viewable in the browser. Alternatively, you could have
    used the print() function in place of the echo statement. Using echo or print()
    is a matter of taste; when you look at other people’s scripts, you might see either
    used.


    Whereas echo is a statement, print() is a function. A function is a command that
    performs an action, usually modified in some way by data provided for it. Data
    sent to a function is almost always placed in parentheses after the function name.
    In this case, you could have sent the print() function a collection of characters,
    or a string. Strings must always be enclosed in quotation marks, either single
    or double, as in this example:


    ```

    <?

    print("Hello Web!");

    ?>

    ```


    The only line of code in Listing 4.1 ended with a semicolon. The semicolon informs
    the PHP engine that you have completed a statement.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'A statement represents an instruction to the PHP engine. Broadly, it is to
    PHP what a sentence is to written or spoken English. A sentence should usually
    end with a period; a statement should usually end with a semicolon. Exceptions
    to this rule include statements that enclose other statements and statements that
    end a block of code. In most cases, however, failure to end a statement with a
    semicolon will confuse the PHP engine and result in an error.


    # Combining HTML and PHP


    The script in Listing 4.1 is pure PHP. You can incorporate this into an HTML document
    by simply adding HTML outside the PHP start and end tags, as shown in Listing
    4.2.


    ```

    LISTING 4.2 A PHP Script Incorporated into HTML

    1: <html>

    2: <head>

    3: <title>A PHP script including HTML</title>

    4: </head>

    5: <body>

    6: <h1><?php echo "hello world"; ?></h1>

    7: </body>

    8: </html>

    ```


    As you can see, incorporating PHP code into a predominantly HTML document is simply
    a matter of typing in the code. The PHP engine ignores everything outside the
    PHP open and close tags. If you were to save the contents of Listing 4.2 as helloworld.php,
    place it in your document root, and then view it with a browser, as shown in Figure
    4.6, you would see the string hello world in a bold heading. If you were to view
    the document source, as shown in Figure 4.7, the listing would look exactly like
    a normal HTML document.


    You can include as many blocks of PHP code as you need in a single document, interspersing
    them with HTML as required. Although you can have multiple blocks of code in a
    single document, they combine to form a single script. Any variables defined in
    the first block will usually be available to subsequent blocks.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '![](img/be3c5789b9e58d6dc55dc804718f15b4_77_0.png)


    FIGURE 4.6 The output of helloworld .php as viewed in a browser.


    ![](img/be3c5789b9e58d6dc55dc804718f15b4_77_1.png)


    FIGURE 4.7 The output of helloworld .php as HTML source code.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# # Adding Comments to PHP Code


    Code that seems clear at the time you write it can seem like a hopeless tangle
    when you try to amend it six months later. Adding comments to your code as you
    write can save you time later on and make it easier for other programmers to work
    with your code.


    A _comment_ is text in a script that is ignored by the PHP engine.

    Comments can make code more readable or annotate a script.


    Single-line comments begin with two forward slashes (`//`)—the preferred style—or
    a single hash or pound sign (`#`).The PHP engine ignores all text between these
    marks and either the end of the line or the PHP close tag:


    ```

    // this is a comment

    # this is another comment

    ```


    Multiline comments begin with a forward slash followed by an asterisk (`/*`) and
    end with an asterisk followed by a forward slash (`*/`):


    ```

    /*

    * this is a comment

    * none of this will

    * be parsed by the

    * PHP engine

    */

    ```'
  merge: -1
  img_proc: true
