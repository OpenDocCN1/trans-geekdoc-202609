- pgno: 33
  md: '5. When you see the MySQL Configuration Wizard Welcome screen, click the Next
    button to go to the next step in the wizard. You will see two options for server
    configuration: Detailed and Standard. We will use the Detailed Configuration option
    so that you can see all the options available to you. If you decide to select
    the Standard Configuration option, you will have to manually modify the resulting
    my.ini file to achieve the configuration you want. Select the Detailed Configuration
    radio button and then click Next to continue.


    6. The next selection you must make is shown in Figure 2.7. In this step, you
    select the type of machine you are running: Developer Machine, Server Machine,
    or Dedicated MySQL Server Machine. Your selection on this screen determines the
    allotments for memory, disk, and processor usage. If you are using MySQL on your
    personal machine for testing purposes, select the Developer Machine option. If
    MySQL is running on a machine with other server software and can take up more
    system resources than if you were running it on your personal machine, select
    the Server Machine option. Select the Dedicated MySQL Server Machine option if
    MySQL is the primary service running on the machine and can take up the bulk of
    the system resources. After making your selection, click Next to continue.


    ![](img/be3c5789b9e58d6dc55dc804718f15b4_33_0.png)


