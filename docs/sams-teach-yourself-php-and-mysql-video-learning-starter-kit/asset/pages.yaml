- pgno: 65
  md: 'The PHP Group uses minor release numbers for updates containing security enhancements
    or bug fixes. Minor releases do not follow a set release schedule; when enhancements
    or fixes are added to the code and are thoroughly tested, the PHP Group releases
    a new version with a new minor version number.


    It is possible that by the time you purchase this kit, the minor version number
    will have changed, to 5.2.6 or beyond. If that is the case, you should read the
    list of changes at http://www.php.net/ChangeLog-5.php for any changes regarding
    the installation or configuration process that makes up the bulk of this chapter.


    Although it is unlikely that any installation instructions will change between
    minor version updates, you should get in the habit of always checking the changelog
    of software that you install and maintain. If a minor version change does occur
    while you are reading this kit but the changelog notes no installation changes,
    simply make a mental note and substitute the new version number wherever it appears
    in the installation instructions and accompanying figures.


    # # Installing PHP on Mac OS X


    There are a few different options for installing PHP with Apache on Mac OS X,
    including building from source as described in the previous section. However,
    the simplest method is to install PHP from a precompiled binary package, such
    as those found here (per the PHP Manual):


    +   - Entropy—http://www.entropy.ch/software/macosx/php/

    +   - Fink—http://www.finkproject.org/

    +   - MacPorts—http://www.macports.org/


    > > NOTE: If you would like to build PHP from the source and are comfortable with
    the Mac OS X operating system and using the terminal, feel free to follow the
    instructions in the PHP Manual, at http://www.php.net/manual/en/install.macosx.php.'
  merge: -1
  img_proc: true
