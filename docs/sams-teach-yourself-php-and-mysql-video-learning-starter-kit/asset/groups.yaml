    ## Before You Begin


    This Sams Teach Yourself Video Learning Kit is about the two web development technologies
    that are at the foundation of many of the world''s best, most popular websites
    and applications.


    PHP and MySQL are at work behind the scenes in everything from the most simple
    WordPress blog to huge sites like Facebook, Wikipedia, Digg, and Yahoo, with millions
    of subscribers and users worldwide.


    While the videos in this course most likely won''t show you how to develop the
    next Facebook or WordPress, they will give even non-programmers a solid understanding
    of how PHP and MySQL work and how you too can easily learn the basics of using
    PHP and MySQL, and begin to add interactivity and dynamic content to your own
    website, large or small.


    Before you get started watching the videos, however, we suggest that you first
    take a few minutes to review the material in this booklet. The information here
    will help you make sure you have all the equipment that''s needed to watch the
    videos and do the exercises, and it will help you make best use of all the unique
    features of these courses as well as the software that''s also on the DVD.


    ### About PHP and MySQL


    Both PHP and MySQL are open-source technologies. This means that they''re developed
    not by a single company that charges a fee for the use of their software, but
    by a community of developers from around the world who donate their time to the
    project. In return, anyone can use the software for free as long as they don''t
    try to claim ownership of the software and as long as they “give back” to the
    project any enhancements they may make to the product.


    PHP is what''s known as a scripting language, a form of a programming language
    that does not need to be compiled and therefore PHP programs—or code—generally
    can be read relatively easily by someone who understands the language''s basic
    rules and terms. PHP is most often used in web development, helping to make web
    pages more interactive and dynamic, displaying different pieces of information
    or data each time the script is run.


    The PHP code is typically embedded within an HTML page. When a particular HTML-based
    web page is opened in a browsers, the PHP script tells the web server to perform
    some specific task—for example, calculate and then display the current date and
    time, or pull up and display a customer''s account information.


    MySQL (pronounced My-Ess-Que-Ell) is a very fast, robust, relational database
    management system (RDBMS) that enables you to efficiently store, search, sort,
    and retrieve data.


    MySQL is also used most often in web development, and typically is found working
    alongside PHP, responding to requests for specific pieces of data from the PHP
    script (or storing away data too).


    Both PHP and MySQL are relatively easy for beginning web developers to learn at
    a fundamental level. Anyone who''s already familiar with HTML, and generally with
    how websites and servers work, should be able to understand and create basic PHP
    code after only a few lessons.


    ### About The Video Lessons


    Sams Teach Yourself Video Learning courses are designed not only for beginners,
    but also for busy, time-crunched people who aren''t able to devote the large blocks
    of time often required to take a full class on a subject, or to read some thick
    tome that covers everything in more detail than you''ll ever need.


    Each lesson in this course takes no more than 10 minutes to 1) watch the video
    tutorial, 2) try the hands-on examples in the lab section, and 3) take a short
    quiz to test yourself before moving on.


    The short video tutorials clearly explain key concepts, terms, and techniques,
    and are rich in diagrams and clear, real-world examples. Plus, you can stop, start,
    pause, or replay any part of the video you want, as often as you want, until you
    feel you really understand it.


    After you''ve watched the video tutorial, you then get to try it yourself and
    put what you''ve learned to work in a unique hands-on learning lab that helps
    you begin to develop real live programs that you can use on your own website.
    The software that you need to complete the exercises is included on the DVD. And
    as you continue to watch the lesson on your computer, you''re guided step-by-step
    through the process of creating your own usable code.


    Once you''re done trying things out in the learning lab each lesson ends with
    a short, easy quiz so you can test what you''ve learned before you go on to the
    next lesson.


    ### Who This Video Learning Kit is For


    This course is aimed at beginning web developers or designers who want to learn
    PHP, even if they don''t have any previous programming or scripting experience.


    It can also be used by someone who does have some previous programming experience
    but have not written for the Web before. This course would provide an understanding
    of the specifics of PHP, and how to apply general programming techniques to the
    Web environment.


    This course does not teach HTML. And although a thorough knowledge of HTML is
    not necessarily a prerequisite, the course does assume a basic understanding of
    how web pages are constructed, where they''re stored and maintained, and how a
    user interacts with them through a web browser.


    ### What''s on the DVD


    The DVD for Sams Teach Yourself PHP and MySQL Video Learning has several components—all
    accessible by either a Windows or a Mac computer:


    - 25 ten-minute video lessons—each made up of a short video tutorial, a hands-on
    learning lab for trying things out, and a short self-assessment quiz at the end.

    - Software for the learning labs—PHP, MySQL, the Apache web server, a script editing
    program, and code that you can cut-and-paste or customize in your own scripts.

