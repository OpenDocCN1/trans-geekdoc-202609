  - '[PAGE 19]


    ![](img/be3c5789b9e58d6dc55dc804718f15b4_19_0.png)


    # FIGURE 1.9 Beginning installation of PHP on Windows.


    Extract the contents of the zip archive to C:\php. Close this window when the
    extraction operation has finished.


    The installation process for PHP requires manual intervention to add the PHP module
    to Apache. Using File Explorer, open the Apache configuration directory—if you
    used the default location, it will be C:\Program Files\Apache Software Foundation\Apache
    2.2\conf—and edit httpd.conf. Look for a section that contains a number of LoadModule
    directives, some prefixed with a # sign. The last few lines of this section will
    look like this:


    ```

    LoadModule userdir_module modules/mod_userdir.so

    #LoadModule usertrack_module modules/mod_usertrack.so

    #LoadModule vhost_alias_module modules/mod_vhost_alias.so

    #LoadModule ssl_module modules/mod_ssl.so

    ```


    Add the following line to the LoadModule section to tell Apache to load the PHP
    module on startup:


    ```

    LoadModule php5_module c:/php/php5apache2_2.dll

    ```


    Additionally, add the following line to ensure that Apache knows where php.ini
    resides:


    ```

    PHPIniDir "C:/php/"

    ```


    Next, search for the AddType section with directives that look like this:


    ```

    AddType application/x-tar .tgz

    AddType image/x-icon .ico

    ```


    Add the following line to tell Apache to process any file ending with .php or
    .html as a PHP script. You can add more file extensions to this line separated
    by spaces if you choose:


    ```

    AddType application/x-httpd-php .php .html

    ```'
