    IDENTIFIED BY "45sdg11";

    ```


    如果你知道 janescomputer.company.com 的 IP 地址为 63.124.45.2，则可以在命令的主机名部分替换该地址，如下所示：


    ```

    GRANT ALL

    ON myCompany.employees

    TO jane@"63.124.45.2"

    IDENTIFIED BY "45sdg11";

    ```


    关于添加用户的一点说明：始终使用密码，并确保密码足够强！


    如果使用 GRANT 命令添加用户，更改会立即生效。为确保这一点，你可以在 MySQL 监视器中发出 FLUSH PRIVILEGES 命令以重新加载权限表。


    ### 删除权限


    删除权限与添加权限一样简单；不使用 GRANT 命令，而是使用 REVOKE。REVOKE 命令语法如下所示：


    ```

    REVOKE privileges

    ON databasename.tablename

    FROM username@hostname;

    ```


    就像可以使用 INSERT 命令授予权限一样，你也可以通过发出 DELETE 命令来从 mysql 数据库的表中删除记录，从而撤销权限。但是，这要求你熟悉字段和表，使用
    REVOKE 要简单和安全得多。


    要撤销用户 john 在 myCompany 数据库中插入项的权限，你将发出此 REVOKE 语句：


    ```

    REVOKE INSERT

    ON myDB.*

    FROM john@"%";

    ```


    对权限表中数据的更改会立即生效，但为了让服务器知道你的更改，请在 MySQL 监视器中发出 FLUSH PRIVILEGES 命令。


    ## 安装和配置 Apache


    在三个与安装相关的章节中的第二个章节中，你将安装 Apache Web 服务器并熟悉其主要组件，包括日志和配置文件。


    ### Apache 的当前和未来版本


    当你访问位于 http://httpd.apache.org 的 Apache HTTPD 服务器网站时，你将看到关于 Apache 1.3.x、Apache
    2.0.x 和 Apache 2.2.x 版本发布的公告。正如你从版本号所能想象的那样，Apache 1.3.x 是这三个版本中最古老的一个。Apache
    软件基金会维护所有三个版本，但 Apache 2.2.x 的功能包括对过滤、缓存、负载平衡和其他系统函数的更大支持；它是本章中使用的版本。但是，如果你选择安装
    Apache 2.0.x 甚至 Apache 1.3.x，本工具包中的所有 PHP 和 MySQL 代码仍将如描述般工作。事实上，你会发现相当多的托管提供商仍在使用
    Apache 1.3.x 版本的服务器，还有其他提供商托管 Apache 2.0.x 版本。如果你在按照本章描述安装 Apache 2.2.x 时遇到问题，请尝试之前的版本（例如，Apache
    2.0.x）；安装说明非常相似。本章中的安装说明是指 Apache HTTPD 服务器版本 2.2.8，这是撰写本书时可用的最佳版本。


    Apache 软件基金会使用次要版本号用于包含安全增强或错误修复的更新。次要版本不遵循固定的发布计划。当增强或修复添加到代码中并经过彻底测试后，Apache
    软件基金会会发布带有新次要版本号的新版本。


    有可能在你购买此工具包时，次要版本号已更改为 2.2.9 或更高版本。如果是这种情况，你应该阅读更改列表，该列表链接自位于 http://httpd.apache.org/download.cgi
    的下载区域，以了解有关安装或配置过程的任何更改（这构成了本章的主体部分）。


    虽然次要版本更新之间不太可能更改任何安装说明，但你应当养成始终检查所安装和维护的软件更改日志的习惯。如果在阅读本工具包期间确实发生了次要版本更改，但更改日志未注明安装更改，请在心中做个记录，并在安装说明及附带图中出现的地方替换为新版本号。


    ### 在 Mac OS X 上安装 Apache


    幸运的是，Apache 已预装在 Mac OS X 上！默认情况下，Apache 服务器二进制文件位于 /usr/sbin/httpd。配置文件（例如 httpd.conf，即
    Apache 的主配置文件）位于 /etc/httpd。因为 Apache 已准备就绪并完全支持使用 PHP，请跳转至“Apache 配置文件结构”部分，以了解有关
    Apache 配置文件及其用法的更多信息。


    ### 在 Windows 上安装 Apache


    Apache 2.2 可在大多数 Windows 平台上运行，并相对于适用于 Windows 的 Apache 2.0 和 Apache 1.3 版本提供了更高的性能和稳定性。你可以从源代码构建
    Apache，但由于并非许多 Windows 用户都有编译器，本节将介绍 MSI 安装程序版本。


    '
