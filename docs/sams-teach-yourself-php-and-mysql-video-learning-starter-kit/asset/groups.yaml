    \ `emacs`。在 Windows 上，可以使用“记事本”或“写字板”。必须记住以纯文本格式保存配置文件，这是 Apache 唯一能理解的格式。\n\n\
    要首次启动 Apache，可能只需更改两个参数：服务器名称以及监听的地址和端口。服务器名称是 Apache 在需要引用自身时会使用的名称（例如，重定向请求时）。Apache\
    \ 通常可以从计算机的 IP 地址推断出服务器名称，但并非总是如此。如果服务器没有有效的 DNS（域名服务）条目，可能需要指定计算机的某个 IP 地址。如果服务器未连接到网络（你可能希望在独立计算机上测试\
