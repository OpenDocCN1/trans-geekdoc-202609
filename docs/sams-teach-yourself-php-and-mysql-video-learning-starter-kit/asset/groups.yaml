    Also included in the installation package is the MySQL Startup Item installer.
    If you want MySQL to start automatically at system startup, install this additional
    package. Installation of the MySQL Startup Item follows the standard installation
    method just described—double-click the *.pkg file, select a destination disk,
    and allow the installation process to run to completion. After installing the
    MySQL Startup Item, use the following command in a terminal window to start MySQL:


    ```

    # sudo /Library/StartupItems/MySQLCOM/MySQLCOM start

    ```


    You might be asked to enter your account password. Press Ctrl+D to exit the shell
    after starting MySQL. After you have started MySQL, you can skip to the section
    called “Basic Security Guidelines” later in this chapter. If you had any issues
    with your installation, check the “Troubleshooting Your Installation” section.


    # Installing MySQL on Windows


    The MySQL installation process on Windows uses a standard Microsoft Windows Installer
    (MSI) file to walk you through the installation and configuration of MySQL on
    your Windows 2000, Windows XP, Windows Server 2003, or Windows Vista machine.
    Go to the MySQL downloads page at http://dev.mysql.com/downloads/mysql/5.0.html
    and look for the section titled Windows Downloads. Download the Windows Essentials
    file, which should have an .msi file extension. When this file has been downloaded,
    double-click it to begin the installation process.


    The following steps detail the installation of MySQL 5.0.20 on Windows using the
    Windows Essentials installer from MySQL AB. The installation sequence follows
    the same steps regardless of your Windows environment.


    > NOTE: Two other installation packages are available for Windows users—the Windows
    ZIP/Setup.EXE and Without Installer option. If you want to install either of these
    versions instead of the Windows Essentials version described here, be sure to
    read the descriptions and instructions in the MySQL Manual at http://dev.mysql.com/doc/refman/5.0/en/windows-choosing-package.html.'
