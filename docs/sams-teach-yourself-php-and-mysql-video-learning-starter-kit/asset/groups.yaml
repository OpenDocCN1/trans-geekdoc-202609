    and its subdirectories. SomeDirective3 applies to URLs referring to pages with
    the .html extension under the /downloads/ URL. SomeDirective4 will apply to all
    files with .gif or .jpg extensions.


    ## Conditional Evaluation


    Apache provides support for conditional containers. Directives enclosed in these
    containers will be processed only if certain conditions are met.

