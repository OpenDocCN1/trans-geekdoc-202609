    \ IP 地址的该端口上监听。如果提供其他 IP 地址，Apache 将仅监听该地址和端口组合。例如，Listen 80 告诉 Apache 在端口 80\
    \ 上监听所有 IP 地址的请求。Listen 10.0.0.1:443 告诉 Apache 仅监听 10.0.0.1 的端口 443。\n\nServerName\
    \ 指令允许你定义服务器在任何自引用 URL 中将报告的名称。该指令接受 DNS 名称和可选端口（两者之间用冒号分隔）。确保 ServerName 具有有效值。否则，服务器将无法正常工作；例如，它会发出错误的重定向。\n\
    \n在 Linux/UNIX 和 Mac OS X 平台上，可以使用 User 和 Group 指令来指定服务器以哪个用户 ID 和组 ID 运行。nobody\
    \ 用户是大多数平台的不错选择。但是，HP-UX 平台上存在此用户 ID 的问题，因此必须创建并使用不同的用户 ID，例如 www。\n\n## 启动 Apache\n\
    \n要在 Linux/UNIX 上启动 Apache，请切换到包含 apachectl 脚本的目录并执行以下命令：\n\n```\n# /usr/local/apache2/bin/apachectl\
    \ start\n```\n\nMac OS X 用户可以在提示符下键入以下内容：\n\n```\n# /usr/sbin/httpd\n```\n\n要在\
    \ Windows 上手动启动 Apache，请在“开始”菜单的“Apache HTTP Server 2.2”程序组的“控制 Apache 服务器”部分中，单击“控制台中启动\
    \ Apache”链接。如果将 Apache 安装为服务，则必须改为启动 Apache 服务。\n\n如果一切正常，可以使用浏览器访问 Apache。将显示默认安装页面，如图\
    \ 3.4 所示。如果无法启动 Web 服务器，或出现错误页面，请参阅以下的“疑难解答”部分。确保正在访问 Listen 指令中指定的端口之一——通常是端口\
    \ 80 或 8080。\n\n![](img/be3c5789b9e58d6dc55dc804718f15b4_61_0.png)\n\n图 3.4 Apache\
    \ 默认安装页面。\n\n## 疑难解答\n\n以下小节介绍首次启动 Apache 时可能遇到的几个常见问题。\n\n### 已存在的 Web 服务器\n\n\
    如果计算机上已有服务器在运行，并且正在监听相同的 IP 地址和端口组合，Apache 将无法成功启动。错误日志文件中会出现一条条目，指示 Apache 无法绑定到端口：\n\
    \n```\n[crit] (48)Address already in use: make_sock: could not bind..[alert] no\
    \ listening sockets available, shutting down\n```\n\n要解决此问题，需要停止运行中的服务器，或更改 Apache\
    \ 配置以在不同端口上监听。\n\n### 没有绑定端口的权限\n\n如果没有管理员权限且尝试绑定到特权端口（0 到 1024 之间），将收到错误：\n\n\
    ```\n[crit] (13)Permission denied: make_sock: could not bind to address 10.0.0.2:80\
    \ [alert] no listening sockets available, shutting down\n```\n\n要解决此问题，必须在启动 Apache\
    \ 之前以管理员身份登录，或更改端口号（8080 是常用的非特权端口）。\n\n### 访问被拒绝\n\n如果没有权限读取配置文件或写入日志文件，可能无法启动\
    \ Apache。将收到类似于以下的错误：\n\n```\n(13)Permission denied: httpd: could not open error\
    \ log file\n```\n\n如果构建和安装 Apache 的用户与尝试运行它的用户不同，可能会出现此问题。\n\n### 组设置错误\n\n可以配置\
    \ Apache 在特定用户名和组下运行。Apache 为运行服务器的用户名和组提供默认值。有时默认值无效，你会收到包含 setgid: unable to\
    \ set group id 的错误。\n\n要在 Linux/UNIX 和 Mac OS X 上解决此问题，必须将配置文件中 Group 指令的值更改为有效值。检查\
    \ /etc/groups 文件以查看现有组。\n\n## 安装和配置 PHP\n\n在三个与安装相关的章节的最后一章中，你将获取、安装和配置 PHP，并对\
    \ Apache 安装进行一些基本更改。\n\n### PHP 的当前版本和未来版本\n\n本章中的安装说明指的是 PHP 版本 5.2.5，这是该软件的当前版本。\n\
    \n> 注意：如果已在生产环境中使用 PHP 4.x.x，或希望继续使用 4.x.x 开发树，请访问 PHP 手册中的“安装和配置”部分：http://www.php.net/install。\n\
    > \n> 由于 PHP 5 已使用超过三年，且 PHP 6 可能会在 2009 年投入生产使用，PHP 4 的状态官方已为“生命周期结束”——这意味着 PHP\
    \ 组自 2007 年 12 月 31 日以来未对 PHP 4 进行任何更新。有关更多信息，请访问：http://www.php.net/archive/2007.php#2007-07-13-1。\n\
    > \n> 本工具包中的代码假设使用 PHP 5 而不是 PHP 4；在某些情况下，两个版本之间的代码没有区别，但你应该熟悉两个版本之间的差异，以便做出相应调整。\n\
    \n"
