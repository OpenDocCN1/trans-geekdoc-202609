    # Adding Users


    Administering your server through a third-party application might afford you a
    simple method for adding users by using a wizard-like process or a graphical interface.
    However, adding users through the MySQL monitor is not difficult, especially if
    you understand the security checkpoints used by MySQL, which you just learned.


    The simplest method for adding new users is the GRANT command. By connecting to
    MySQL as the root user, you can issue one command to set up a new user. The other
    method is to issue INSERT statements into all the relevant tables in the mysql
    database, which requires you to know all the fields in the tables used to store
    permissions. This method works just as well but is more complicated than the simple
    GRANT command. The simple syntax of the GRANT command is shown here:


    ```

    GRANT privileges

    ON databasename.tablename

    TO username@host

    IDENTIFIED BY "password";

    ```


    The following are some of the common privileges you can grant. For a complete
    list, see the GRANT entry in the MySQL Manual at http://dev.mysql.com/doc/refman/5.0/en/grant.html.


    +   ■ ALL—Gives the user all common privileges


    +   ■ ALTER—User can alter (modify) tables, columns, and indexes


    +   ■ CREATE—User can create databases and tables


    +   ■ DELETE—User can delete records from tables


    +   ■ DROP—User can drop (delete) tables and databases


    +   ■ FILE—User can read and write files; this privilege is used to import or
    dump data


    +   ■ INDEX—User can add or delete indexes


    +   ■ INSERT—User can add records to tables


    +   ■ PROCESS—User can view and stop system processes; only trusted users should
    be able to do this


    +   ■ RELOAD—User can issue FLUSH statements; only trusted users should be able
    to do this


    +   ■ SELECT—User can select records from tables


    +   ■ SHUTDOWN—User can shut down the MySQL server; only trusted users should
    be able to do this


    +   ■ UPDATE—User can update (modify) records in tables'
