    NOTE: Make sure you''ve put the DVD in your computer''s DVD drive. The DVD will
    not run on a computer''s CD drive. Nor will it work in a DVD player designed for
    plugging into a TV for watching movies.


    The Adobe Flash Player plugin, which allows you to view Flash videos in your browser.
    If you can watch videos on YouTube, you should be all set.


    Once you''re sure you''ve got everything, you''re ready to get started:


    +   1. Insert the DVD from this package into your DVD drive on your computer.

    +   2. If the DVD main interface does not automatically start up, navigate to
    the DVD folder on your computer and double-click on the icon or file named Start
    (start.exe on Windows or start.app on Mac OS X).


    ![](img/be3c5789b9e58d6dc55dc804718f15b4_11_0.png)


    FIGURE 1.1 The DVD''s main interface.


    +   3. To watch the videos, choose the lesson you want to start with from the
    list of lessons on the left side of the window (Figure 1.1), and then click on
    the play button in the player window on the right side.

    +   4. To set up the learning environment software click on the "Install Software
    and Support" link in the lower left corner in the window.'
  - '[PAGE 12]


    # # How to Use the Learning Labs and Take the Quizzes


    After each video in complete you can optionally work through the Learning Lab
    exercises and take a short (not too hard) quiz to help assess what you''ve learned
    in that lesson.


    The Learning Lab exercises in this course require you to set up a web server learning
    environment either at a web hosting service or on your own computer (see the next
    section for detailed installation instructions).


    Once your learning environment is set up, the instructions for each exercise walk
    you through the process one step at a time.


    It''s usually recommended that you take the time to type in the needed code for
    each exercise—it''s generally thought that typing it in yourself helps you become
    more familiar with the details of how the code is structured and used. But if
    you''re just a terrible typist or if you want to speed things up a little, the
    complete code for the exercise is on the second tab in the browser windows, ready
    for cutting and pasting into your code editor.


    The quizzes after the exercises are relatively short and painless. After you make
    your choice, the program will tell you immediately if you''re correct or wrong.
    Your answers are not stored or compiled, so you can take the quizzes as often
    as you like, and guessing won''t count against you.


    # ## Setting up Your Learning Environment


    As mentioned above, to complete the exercises in the lessons you''ll need to have
    access to a web server environment running either on your own computer at home
    or on a web hosting service where you have access to the PHP scripting language
    and you can create and administer MySQL databases.'
