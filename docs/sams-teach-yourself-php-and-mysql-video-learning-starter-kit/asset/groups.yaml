    - 您的操作系统

    - 您正在运行或安装的 PHP 版本

    - 您选择的配置选项

    - 在安装失败前出现的 configure 或 make 命令的任何输出

    - 导致问题的代码的一个相当完整的示例


    为什么要对向邮件列表发布问题有这么多谨慎之处？首先，培养研究技能将对您大有裨益。一名优秀的研究人员通常能快速而高效地解决问题。向技术列表发布一个幼稚的问题，通常只会等到一两条消息，这些消息会把您引导到存档中，而您本应从一开始就在存档中寻找答案。


    其次，请记住，邮件列表不等同于技术支持呼叫中心。没有人会因回答您的问题而获得报酬。尽管如此，您可以接触到一个令人印象深刻的人才和知识库，其中包括 PHP 本身的一些创建者。一个好问题及其答案将被存档，以帮助其他程序员。询问一个已经回答过好几遍的问题，只会增加更多噪音。


    话虽如此，不要害怕向列表发布问题。PHP 开发者是一个文明且乐于助人的群体，通过将问题提请社区关注，您可能正在帮助其他人解决相同的问题。


    ## PHP 脚本基础


    **提示：** 查找 PHP 友好型编辑器的好网站位于 http://www.php-editors.com。


    让我们直接上手一个 PHP 脚本。首先，打开您喜欢的文本编辑器。与 HTML 文档一样，PHP 文件由纯文本组成。您可以使用任何文本编辑器创建它们，大多数流行的
    HTML 编辑器至少为 PHP 提供一些支持。


    请键入清单 4.1 中的示例，并保存文件，文件名类似于 first.php。


    ```

    LISTING 4.1 A Simple PHP Script

    1: <?php

    2:    echo "<h1>Hello Web!</h1>";

    3: ?>

    ```


    如果您不是直接在将提供 PHP 脚本的机器上工作，则需要使用 FTP 或 SCP 客户端将保存的文档上传到服务器。文档放置到位后，您应该能够使用浏览器访问它。如果一切顺利，您应该能看到脚本的输出。图
    4.5 显示了 first.php 脚本的输出。


    ![](img/be3c5789b9e58d6dc55dc804718f15b4_73_0.png)


    图 4.5 成功：first.php 的输出。


    ## 开始和结束 PHP 语句块


    编写 PHP 时，您需要告知 PHP 引擎您希望它执行您的命令。如果不这样做，您编写的代码会被误认为是 HTML，并输出到浏览器。您可以使用标记代码块开始和结束的特殊标签，将代码指定为
    PHP。表 4.1 显示了四种这样的 PHP 分隔标签。


    | 标签样式 | 开始标签 | 结束标签 |

    |---|---|---|

    | 标准标签 | <?php | ?> |

    | 短标签 | <? | ?> |

    | ASP 标签 | <% | %> |

    | 脚本标签 | <script language="php"> | </script> |


    表 4.1 中的标签中，只有标准标签和脚本标签保证可以在任何配置下工作。您必须在 php.ini 文件中显式启用短标签和 ASP 样式标签。


    要激活短标签的识别，您必须确保 php.ini 中的 short_open_tag 开关设置为 On：


    ```

    Short_open_tag = On;

    ```


    要激活 ASP 样式标签的识别，您必须在 php.ini 中启用 asp_tags 设置：


    ```

    asp_tags = On;

    ```


    编辑 php.ini 并重新启动 Apache 后，您应该能够在脚本中使用任何一种风格。这在很大程度上是个人偏好的问题，尽管如果您打算在脚本中包含 XML，则应禁用短标签（<?
    ?>）并使用标准标签（<?php ?>）。


    让我们浏览一下编写清单 4.1 中代码的合法方式。鉴于前面所示的配置更改，您可以使用您见过的任何四个 PHP 开始和结束标签：


    ```

    <?

    Echo "Hello Web!";

    ?>

    ```


    > **注意：** 为了确保代码的可移植性和可重用性，最好使用标准标签，而不是短标签或 ASP 样式标签，原因很简单：服务器配置各不相同——使用标准样式，因为您知道它是任何配置的一部分，可以指望它。


    > **警告：** 字符序列 ?< 告诉 XML 解析器预期一条处理指令，因此经常出现在 XML 文档中。如果您在脚本中包含 XML 且已启用短标签，PHP
    引擎可能会将 XML 处理指令和 PHP 开始标签混淆。如果您打算在文档中加入 XML，请禁用短标签。


    ```

    <?php

    echo "Hello Web!";

    ?>

    ```


    ```

    <%

    echo "Hello Web!";

    %>

    ```


    ```

    <script language="php">

    echo "Hello Web!";

    </script>

    ```


    您也可以将 PHP 中的单行代码放在与 PHP 开始和结束标签相同的行上：


    ```

    <? echo "Hello Web!"; ?> 。

    ```


    现在您知道如何定义 PHP 代码块了，让我们更仔细地查看清单 4.1 本身的代码。


    ## echo 语句和 print() 函数


    简单来说，您使用 echo 语句来输出数据。在大多数情况下，由 echo 输出的任何内容最终都会显示在浏览器中。或者，您可以使用 print() 函数来代替
    echo 语句。使用 echo 或 print() 是个人喜好的问题；查看他人的脚本时，您可能会看到两者中的任一种。


    echo 是语句，而 print() 是函数。函数是执行操作的命令，通常会以某种方式根据为其提供的数据进行修改。发送到函数的数据几乎总是放在函数名后面的括号中。在此情况下，您可以将一组字符（即字符串）发送到
    print() 函数。字符串始终必须用引号括起来，可以是单引号或双引号，如本示例所示：


    ```

    <?

    print("Hello Web!");

    ?>

    ```


    清单 4.1 中唯一的一行代码以分号结尾。分号告知 PHP 引擎，您已完成一条语句。


    ## 组合 HTML 和 PHP


    清单 4.1 中的脚本是纯 PHP。您可以通过在 PHP 开始和结束标签之外添加 HTML，将其合并到 HTML 文档中，如清单 4.2 所示。


    ```

    LISTING 4.2 A PHP Script Incorporated into HTML

    1: <html>

    2: <head>

    3: <title>A PHP script including HTML</title>

    4: </head>

    5: <body>

    6: <h1><?php echo "hello world"; ?></h1>

    7: </body>

    8: </html>

    ```


    如您所见，将 PHP 代码合并到以 HTML 为主的文档中，只需键入代码即可。PHP 引擎会忽略 PHP 开始和结束标签之外的所有内容。如果您将清单 4.2
    的内容保存为 helloworld.php，将其放在文档根目录中，然后像图 4.6 所示在浏览器中查看，您会在粗体标题中看到字符串 hello world。如果您查看文档源代码，如图
    4.7 所示，该列表看起来就像一个普通的 HTML 文档。


    您可以在单个文档中包含任意数量的 PHP 代码块，并根据需要与 HTML 交错插入。虽然您可以在单个文档中拥有多个代码块，但它们合并形成一个单一脚本。在第一个块中定义的任何变量通常都可用于后续块。


    '
