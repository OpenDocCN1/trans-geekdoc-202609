  - '[PAGE 70]


    # # php.ini Basics


    After you have compiled or installed PHP, you can still change its behavior with
    the php.ini file. On Linux/UNIX systems, the default location for this file is
    /usr/local/php/lib or the lib subdirectory of the PHP installation location you
    used at configuration time. On a Windows system, this file should be in the PHP
    directory or another directory as specified by the value of PHPIniDir in the Apache
    httpd.conf file.


    Directives in the php.ini file come in two forms: values and flags. Value directives
    take the form of a directive name and a value separated by an equal sign. Possible
    values vary from directive to directive. Flag directives take the form of a directive
    name and a positive or negative term separated by an equal sign. Positive terms
    include 1, On, Yes, and True. Negative terms include 0, Off, No, and False. Whitespace
    is ignored.


    You can change your php.ini settings at any time, but after you do, you’ll need
    to restart the server for the changes to take effect. At some point, take time
    to read through the php.ini file on your own to see the types of things that you
    can configure.


    # # Testing Your Installation


    The simplest way to test your PHP installation is to create a small test script
    that uses the phpinfo() function. This function will produce a long list of configuration
    information. Open a text editor and type the following line:


    ```

    <?php phpinfo(); ?>

    ```


    Save this file as phpinfo.php and place it in the document root of your web server—the
    htdocs subdirectory of your Apache installation or the /Library/WebServer/Documents
    directory on Mac OS X. Access this file using your web browser, and you should
    see something like what is shown in Figure 4.4.'
