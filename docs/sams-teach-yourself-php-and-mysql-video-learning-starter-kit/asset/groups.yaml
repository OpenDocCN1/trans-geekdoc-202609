  mdcn: '

    安装包中还包含 MySQL 启动项安装程序。如果要让 MySQL 在系统启动时自动启动，请安装这个附加包。MySQL 启动项的安装遵循刚才描述的标准安装方法——双击
    *.pkg 文件，选择目标磁盘，并允许安装过程运行至完成。安装 MySQL 启动项后，在终端窗口中使用以下命令启动 MySQL：


    ```

    # sudo /Library/StartupItems/MySQLCOM/MySQLCOM start

    ```


    系统可能会要求您输入帐户密码。启动 MySQL 后，按 Ctrl+D 退出 shell。启动 MySQL 后，您可以跳转到本章后面的“基本安全准则”部分。如果安装过程中出现任何问题，请查看“排查您的安装”部分。


    ## 在 Windows 上安装 MySQL


    Windows 上的 MySQL 安装过程使用标准的 Microsoft Windows Installer (MSI) 文件，引导您在 Windows 2000、Windows
    XP、Windows Server 2003 或 Windows Vista 计算机上安装和配置 MySQL。转到 MySQL 下载页面 http://dev.mysql.com/downloads/mysql/5.0.html，查找标题为“Windows
    下载”的部分。下载 Windows 基础文件，该文件应具有 .msi 文件扩展名。下载该文件后，双击它以开始安装过程。


    以下步骤详细介绍了如何使用 MySQL AB 的 Windows 基础安装程序在 Windows 上安装 MySQL 5.0.20。无论您的 Windows
    环境如何，安装顺序都遵循相同的步骤。


    > 注意：Windows 用户还可使用另外两个安装包——Windows ZIP/Setup.EXE 和无安装程序选项。如果您想安装其中任何一个版本，而不是此处描述的
    Windows 基础版本，请务必阅读 MySQL 手册 http://dev.mysql.com/doc/refman/5.0/en/windows-choosing-package.html
    中的描述和说明。


    直接进入安装顺序（假设您已从 MySQL AB 网站下载了 Windows 基础安装程序），请执行以下步骤：


    - 1. 双击 *.msi 文件以开始安装顺序。您将看到 MySQL 安装向导的第一个屏幕，如图 2.4 所示。单击 Next 继续。


    ![](img/be3c5789b9e58d6dc55dc804718f15b4_31_0.png)


    图 2.4 Windows 上的 MySQL 安装向导第一步。


    - 2. 选择安装方式——典型、完整或自定义（参见图 2.5）。自定义选项允许您选择要安装的 MySQL 元素，而完整选项会安装 MySQL 的所有组件，这些组件范围从文档到基准测试套件。典型安装方式适用于大多数用户，因为它包含客户端、服务器以及用于常规管理
    MySQL 安装的众多工具。选择典型作为安装方式，并单击 Next 继续。


    ![](img/be3c5789b9e58d6dc55dc804718f15b4_32_0.png)


    图 2.5 选择安装类型。


    - 3. 在下一屏幕确认您的选择，并单击 Install 按钮继续。安装过程将接管并将文件安装到相应位置。


    - 4. 安装完成后，您可以选择继续进行 MySQL 配置向导。强烈建议使用此向导，因为它将根据您的特定需求创建自定义的 my.ini 文件。要继续进行 MySQL
    配置向导，请选中“立即配置 MySQL 服务器”复选框并单击 Finish 按钮，如图 2.6 所示。


    ![](img/be3c5789b9e58d6dc55dc804718f15b4_32_1.png)


    图 2.6 MySQL 已安装。现在继续进行 MySQL 配置向导。


    - 5. 当您看到 MySQL 配置向导欢迎屏幕时，单击 Next 按钮进入向导的下一步。您将看到两个服务器配置选项：详细和标准。我们将使用详细配置选项，以便您可以查看所有可用选项。如果您决定选择标准配置选项，则需要手动修改生成的
    my.ini 文件以实现所需的配置。选择详细配置单选按钮，然后单击 Next 继续。


    - 6. 下一步需做的选择如图 2.7 所示。在此步骤中，您选择正在运行的机器类型：开发者计算机、服务器计算机或专用 MySQL 服务器计算机。您在此屏幕上的选择决定了内存、磁盘和处理器使用的分配。如果您在个人计算机上将
    MySQL 用于测试目的，请选择开发者计算机选项。如果 MySQL 运行在带有其他服务器软件的计算机上，并且可以占用比在个人计算机上运行更多的系统资源，请选择服务器计算机选项。如果
    MySQL 是计算机上运行的主要服务并且可以占用大部分系统资源，请选择专用 MySQL 服务器计算机选项。做出选择后，单击 Next 继续。


    ![](img/be3c5789b9e58d6dc55dc804718f15b4_33_0.png)


    图 2.7 作为 MySQL 配置的一部分选择您的服务器类型。


    - 7. 下一个配置选项涉及数据库用途。选项包括多功能数据库（同时支持 InnoDB 和 MyISAM 存储引擎，资源在两者之间均匀分配）；事务型数据库（同时启用
    InnoDB 和 MyISAM，但将大部分服务器资源分配给 InnoDB）；以及仅非事务型数据库（禁用 InnoDB 并将所有资源应用于 MyISAM）。除非您确切知道数据库将用于什么，否则请选择多功能数据库单选按钮，并单击
    Next 继续。


    - 8. 如果您选择的数据库用途选项包含 InnoDB 存储引擎，则配置过程的下一步将允许您配置磁盘位置和存储阈值。默认值如图 2.8 所示，您可以单击 Next
    继续以确认，也可以更改这些设置，然后单击 Next 继续使用您的自定义设置。


    ![](img/be3c5789b9e58d6dc55dc804718f15b4_34_0.png)


    图 2.8 调整 InnoDB 存储引擎的磁盘使用选项。


    - 9. 下一个配置选项确定到 MySQL 服务器的并发连接数。您的设置将取决于网站或应用程序的流量和数据库用途。默认设置是决策支持 (DSS)/OLAP，最大并发连接数为
    100，平均假设为 20。在线事务处理 (OLTP) 选项最大并发连接数为 500，而手动设置允许您从下拉列表中选择或输入自己的值。做出选择并单击 Next
    继续。


    > 注意：请记住修改防火墙规则，以允许端口 3306 或您决定用于 MySQL 的任何端口上的流量。


    - 10. 配置顺序中的下一屏幕是网络选项。在此屏幕中，您将启用或禁用 TCP/IP 网络，以及配置用于连接到 MySQL 的端口号——默认值为 3306，但您可以选择任何未使用的端口。此屏幕上的另一个选项是启用或禁用严格模式；除非您知道自己在更改什么，否则建议启用严格模式。有关更多信息，请参见
