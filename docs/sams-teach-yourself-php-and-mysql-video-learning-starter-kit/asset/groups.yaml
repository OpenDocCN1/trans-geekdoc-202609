    ## Troubleshooting


    All the steps in these quick-start guidelines have been tested with the versions
    of the software supplied on the DVD in this package.


    If you experience installation problems, first check that you have followed the
    steps exactly as given here, and then try the extended installation and troubleshooting
    information found in the chapters immediately following this one. These chapters
    provide troubleshooting tips and links to additional sites that can help you work
