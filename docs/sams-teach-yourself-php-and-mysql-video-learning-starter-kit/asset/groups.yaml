    文件的请求，它将按顺序在 /、/usr、/usr/local、/usr/local/apache2 和 /usr/local/apache2/htdocs
    目录中查找每目录配置文件。


    > 注意：启用每目录配置文件会带来性能损失。Apache 必须在每个请求中执行昂贵的磁盘操作来查找这些文件，即使这些文件不存在。


    每目录配置文件默认名为 .htaccess。这是出于历史原因；它们最初保护包含 HTML 文件的目录的访问权限。


    AccessFileName 指令允许您将每目录配置文件的名称从 .htaccess 更改为其他名称。它接受一个文件名列表，Apache 在查找每目录配置文件时将使用该列表。


    要确定是否可以在每目录配置文件中覆盖指令，请检查包含 .htaccess 的指令语法定义中的 Context: 字段。Apache 指令属于不同的组，如指令语法描述中的
    Override 字段所示。Override 字段的可能值如下：


    - AuthConfig—控制授权的指令

    - FileInfo—控制文档类型的指令

    - Indexes—控制目录索引的指令

    - Limit—控制主机访问的指令

    - Options—控制特定目录功能的指令


    您可以使用 AllowOverride 指令来控制哪些指令组可以出现在每目录配置文件中。AllowOverride 也可以接受 All 或 None 参数。All
    表示属于所有组的指令都可以出现在配置文件中。None 禁用目录及其任何子目录中的每目录文件。Listing 3.4 显示如何为整个服务器禁用每目录配置文件。这可提高性能，也是
    Apache 的默认配置。


    ## Listing 3.4 禁用每目录配置文件


    ```

    1: <Directory />

    2: AllowOverride none

    3: </Directory>

    ```


    ## Apache 日志文件


    Apache 默认包含两个日志文件。access_log 文件用于跟踪客户端请求。error_log 文件用于记录重要事件，例如错误或服务器重启。这些文件在您首次启动
    Apache 之前不存在。在 Windows 平台上，这些文件的名称为 access.log 和 error.log。


    ### access_log 文件


    当客户端从服务器请求文件时，Apache 会记录与请求关联的几个参数，包括客户端的 IP 地址、请求的文档、HTTP 状态码和当前时间。Listing 3.5
    显示示例日志文件条目。


    ## Listing 3.5 示例 access_log 条目


    ```

    1: 127.0.0.1 - - [13/Apr/2008:08:33:25 -0700] "GET / HTTP/1.1"

    200 44

    2: 127.0.0.1 - - [13/Apr/2008:08:33:25 -0700] "GET /favicon.ico

    HTTP/1.1" 404 209

    ```


    ### error_log 文件


    error_log 文件包括错误消息、启动消息以及服务器生命周期中的任何其他重要事件。当您遇到 Apache 问题时，这是首先要查看的位置。Listing
    3.6 显示示例 error_log 条目。


    ## Listing 3.6 示例 error_log 条目


    ```

    1: Starting the Apache2.2 service [The Apache2.2 service is running.]

    2: Apache/2.2.8 (Win32) configured -- resuming normal operations

    3: [Sun Apr 13 08:29:34 2008] [notice] Server built: Jan 18 2008 00:37:19

    4: [Sun Apr 13 08:29:34 2008] [notice] Parent: Created child process 3504

    5: [Sun Apr 13 08:29:35 2008] [notice] Child 3504: Child process is running

    6: [Sun Apr 13 08:29:35 2008] [notice] Child 3504: Acquired the start mutex.

    ```


    ## 其他文件


    httpd.pid 文件包含正在运行的 Apache 服务器的进程 ID。您可以使用此编号手动向 Apache 发送信号，如下一节所述。记分板文件（在 Linux/UNIX
    Apache 上）由基于进程的 MPM 用于与其子进程通信。通常，您不需要担心这些文件。


    ## Apache 相关命令


    Apache 发行版包含多个可执行文件。本节仅涵盖服务器二进制文件和相关脚本。


    ### Apache 服务器二进制文件


    Apache 可执行文件在 Linux/UNIX 和 Mac OS X 上名为 httpd，在 Windows 上名为 apache.exe。它接受多个命令行选项，其中一些在表
    3.1 中有所描述。您可以通过在 Linux/UNIX 上输入 /usr/local/apache2/bin/httpd -h、在 Mac OS X 上输入
    /usr/sbin/httpd -h，或在 Windows 命令提示符下输入 apache.exe -h 来获取完整的选项列表。


    | 选项 | 含义 |

    |---|---|

    | -D | 允许您传递可用于 <IfDefine> 节处理的参数 |

    | -l | 列出已编译的模块 |

    | -v | 显示版本号和服务器编译时间 |

    | -f | 如果 httpd.conf 的位置不同于编译时默认值，则允许您传递其位置 |


    Apache 运行后，您可以在 Linux/UNIX 和 Mac OS X 上使用 kill 命令向父 Apache 进程发送信号。信号提供了一种向进程发送命令的机制。要发送信号，请执行以下命令：


    ```

    # kill -SIGNAL pid

    ```


    在此语法中，pid 是进程 ID，SIGNAL 是以下之一：


    - HUP—停止服务器

    - USR1 或 WINCH—优雅重启；使用哪个信号取决于底层操作系统

    - SIGHUP—重启


    如果您对配置文件进行了一些更改并希望其生效，则必须向 Apache 发出信号，指示配置已更改。您可以通过停止并启动服务器或发送重启信号来完成此操作。这会告诉
    Apache 重新读取其配置。


    正常重启可能会导致服务短暂中断。优雅重启采用不同的方法：为客户端服务的每个线程或进程继续处理当前请求，但完成后，它会被终止并由带有新配置的新线程或进程替换。这使得
    Web 服务器能够无缝运行，无需停机。


    在 Windows 上，您可以使用 apache.exe 可执行文件向 Apache 发送信号。以下是一些命令：


    - apache.exe -k restart—告诉 Apache 重启

    - apache.exe -k graceful—告诉 Apache 执行优雅重启

    - apache.exe -k stop—告诉 Apache 停止


    '
