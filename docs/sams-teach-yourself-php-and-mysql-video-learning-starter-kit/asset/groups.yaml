    ## 故障排除


    这些快速入门指南中的所有步骤均已在本软件包随附 DVD 上提供的软件版本上进行过测试。


    如果遇到安装问题，首先检查是否严格按照此处给出的步骤操作，然后尝试紧随本章后面章节中提供的扩展安装和故障排除信息。这些章节提供故障排除提示和指向其他网站的链接，可帮助您解决安装问题。


    ## 安装和配置 MySQL


    本章是三个与安装相关的章节中的第一个，您将在其中学习如何设置开发环境。我们将先处理 MySQL 安装，因为如果您打算将 MySQL 与 PHP 一起使用，构建
    PHP 模块需要 MySQL 安装的某些部分先完成。


    在本章中，您将学习：


    - 如何安装 MySQL

    - 运行 MySQL 的基本安全准则

    - 如何使用 MySQL 用户权限系统


    ## MySQL 的当前版本和未来版本


    本章中的安装说明引用的是 MySQL 5.0.51，这是该软件的当前生产版本。该版本号可读作“主要版本 5.0 软件的次要版本号 51”。MySQL AB（现已被
    Sun Microsystems 收购）是负责创建和分发 MySQL 的公司；该公司使用次要版本号用于包含安全增强或错误修复的更新。次要版本不遵循固定的发布计划；当增强功能或修复程序添加到代码中并经过彻底测试后，MySQL
    AB 会发布带有新次要版本号的新版本。


    有可能在您阅读本文时，次要版本号已更改为 5.0.52 或更高版本。如果是这种情况，您应该阅读 http://dev.mysql.com/doc/refman/5.0/en/news-5-0-x.html
    上的列表，了解有关安装或配置过程（即本章的主要内容）的任何更改。


    尽管次要版本更新之间不太可能更改任何安装说明，但您应养成始终检查所安装和维护的软件变更日志的习惯。如果发生次要版本更改，但变更日志未注明安装更改，只需在脑中记住，并在安装说明和随附图中出现的任何位置替换为新版本号即可。


    > 注意：在打印本文时，MySQL 5.1 很可能已正式发布。虽然我们不涵盖 MySQL 5.1 的增强功能，但此处或视频课程中涵盖的任何内容均未因 MySQL
    5.1 的发布而失效。换句话说，如果您选择安装 MySQL 5.1 而非 MySQL 5.0，您应该能够完成视频中的所有练习。有关 MySQL 5.0 和
    MySQL 5.1 之间更改的信息，请参阅 http://dev.mysql.com/doc/refman/5.1/en/mysql-nutshell.html。


    ## 如何获取 MySQL


    > 注意：Linux 发行版 CD 通常包含某种版本的开源 MySQL 软件，但这些版本通常比当前版本落后几个次要版本。


    MySQL AB（开发和维护 MySQL 数据库服务器的公司）在其网站 http://www.mysql.com/ 上分发 MySQL。所有平台的二进制分发版、Mac
    OS X 的安装程序包以及 Linux/UNIX 平台的 RPM 和源代码文件均可在该网站上找到。


    本章中的安装说明基于 MySQL AB 提供的官方 MySQL 5.0.x Community Server 分发版。所有文件均可从 http://dev.mysql.com/downloads/mysql/5.0.html
    下载，撰写时的当前版本可在 DVD 上找到。


    ## 在 Mac OS X 上安装 MySQL


    Mac OS X 上的 MySQL 安装过程相当简单——MySQL AB 的开发人员为 Mac OS X 创建了一个安装程序包。请访问 http://dev.mysql.com/downloads/mysql/5.0.html
    上的 MySQL 下载页面，查找标题为“Mac OS X 下载（包格式）”的部分。从那里，下载适合您系统的适当标准版本；您选择的版本将取决于您的 Mac OS
    X 版本（10.3、10.4 或 10.5）和架构（PowerPC、PowerPC 64 位或 Intel x86）。


    下载完成后，解压缩安装程序文件并双击 *.pkg 文件。按照以下安装步骤完成该过程：


    1. MySQL 安装程序会自动启动，如图 2.1 所示。单击“继续”进入下一步。


    ![](img/be3c5789b9e58d6dc55dc804718f15b4_28_0.png)


    图 2.1 Mac 版 MySQL 安装程序已启动。


    2. 接下来的几个屏幕包含有关安装和 MySQL 许可证的常规信息。阅读这些屏幕并单击“继续”以继续。


    3. 浏览完信息和许可证屏幕后，必须选择安装目标位置。选择相应的驱动器，如图 2.2 所示，然后单击“继续”按钮。


    ![](img/be3c5789b9e58d6dc55dc804718f15b4_29_0.png)


    图 2.2 选择安装位置。


    4. 下一个屏幕将验证您的安装位置选择，并要求您单击“安装”按钮以继续。此时，系统可能会提示您输入管理员用户名和密码，然后安装过程才会继续。继续后，让进程运行，直到您看到安装已完成，如图
    2.3 所示。


    ![](img/be3c5789b9e58d6dc55dc804718f15b4_29_1.png)


    图 2.3 MySQL 已安装。


