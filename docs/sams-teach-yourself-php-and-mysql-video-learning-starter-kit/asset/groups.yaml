  mdcn: "\n\n可以通过 Apache 安装程序创建的“开始”菜单条目访问这些命令的快捷方式。如果将 Apache 安装为服务，可以使用 Windows\
    \ 服务界面启动或停止 Apache：在控制面板中，选择“管理工具”，然后单击“服务”图标。\n\n## Apache 控制脚本\n\n尽管可以在 Linux/UNIX\
