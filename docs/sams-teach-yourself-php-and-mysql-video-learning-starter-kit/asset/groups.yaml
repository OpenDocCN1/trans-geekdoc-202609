    you will enable or disable TCP/IP networking as well as configure the port number
    used to connect to MySQL—the default is 3306, but you can use any unused port
    you choose. The other option on this screen is to enable or disable strict mode;
    enabling strict mode is recommended unless you know what you''re changing. See
    http://dev.mysql.com/doc/refman/5.0/en/server-sql-mode.html for more information.
    Make your selections and click Next to continue.


    +   11. After the Networking Options screen come the character set options. The
    default option is Standard Character Set, which results in Latin1 being used throughout
    your database. You can also select the Best Support for Multilingualism option,
    which results in UTF8 as the character set; UTF8 allows you to store multiple
    languages in a single character set. If you want to use a specific character set,
    select the Manual Selected Default Character Set radio button and then select
