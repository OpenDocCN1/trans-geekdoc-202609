    ## Apache 配置文件结构


    Apache 将所有配置信息保存在文本文件中。主文件是 `httpd.conf`。此文件包含指令和容器，使您可以自定义 Apache 安装。`Directives`
    配置 Apache 的特定设置，例如授权、性能和网络参数。`Containers` 指定这些设置所引用的上下文。例如，授权配置可以引用整个服务器、某个目录或单个文件。


    ## 指令


    以下规则适用于 Apache 指令语法：


    - 指令参数跟在指令名称之后。

    - 指令参数由空格分隔。

    - 参数的数量和类型因指令而异；有些指令没有参数。

    - 指令占据单行，但可以通过在前一行末尾使用反斜杠字符 (`\`) 在另一行上继续。

    - 井号 (#) 应位于指令之前，且必须独占一行。


    Apache 服务器文档在 http://httpd.apache.org/docs/2.2/mod/quickreference.html 提供了指令的快速参考。您很快将了解一些基本指令，但应使用在线文档来补充您的知识。


    Apache 指令文档通常遵循以下模型：


    - **说明**—此条目提供指令的简要描述。

    - **语法**—此条目解释指令选项的格式。必填参数以斜体显示，可选参数以斜体和括号显示。

    - **默认值**—如果指令有默认值，它将出现在此处。

    - 上下文—此条目详细说明指令可以出现在哪些容器或部分中。下一节将解释容器。可能的值为 server config、virtual host、directory
    和 .htaccess。

    - 覆盖—Apache 指令属于不同类别。覆盖字段指定哪些指令类别可以出现在 .htaccess 每目录配置文件中。

    - 状态—此条目指示指令是内置于 Apache（core）中，属于捆绑模块之一（base 或 extension，具体取决于是否默认编译），是多处理模块（MPM）的一部分，还是与
    Apache 捆绑但未准备好在生产服务器中使用（experimental）。

    - 模块—此条目指示指令所属的模块。

    - 兼容性—此条目包含关于哪些版本的 Apache 支持该指令的信息。


    文档中对指令的进一步解释紧随这些条目之后，文末可能会出现对相关指令或文档的引用。


    ## 容器


    指令容器（也称为部分）限制指令适用的范围。如果指令不在容器内，则它们属于默认服务器范围（server config）并应用于整个服务器。


    以下是默认的 Apache 指令容器：


    - <VirtualHost>—VirtualHost 指令指定一个虚拟服务器。Apache 使您可以使用单个 Apache 安装托管不同的网站。此容器内的指令适用于特定网站。该指令接受域名或
    IP 地址以及可选端口作为参数。

    - <Directory>, <DirectoryMatch>—这些容器允许指令应用于文件系统中的某个目录或目录组。Directory 容器采用目录或目录模式参数。封闭的指令适用于指定的目录及其子目录。DirectoryMatch
    容器允许将正则表达式模式指定为参数。例如，以下内容允许匹配 www 目录的所有二级子目录且由四个数字组成，例如以年份和月份命名的目录（0906 表示 2006
    年 9 月）：

    <DirectoryMatch "^/www.*/[0-9]{4}">


    - <Location>, <LocationMatch>—这些容器允许指令应用于某些请求的 URL 或 URL 模式。它们与 Directory 类似。LocationMatch
    将正则表达式作为参数。例如，以下内容匹配包含 "/my/data" 或 "/your/data" 的目录：

    <LocationMatch "^/(my|your)/data">


    - <Files>, <FilesMatch>—与 Directory 和 Location 容器类似，Files 部分允许指令应用于某些文件或文件模式。


    容器包围指令，如清单 3.1 所示。


    ```

    LISTING 3.1 Sample Container Directives

    1: <Directory "/some/directory">

    2:   SomeDirective1

    3:   SomeDirective2

    4: </Directory>

    5: <Location "/downloads/*.html">

    6:   SomeDirective3

    7: </Location>

    8: <Files "\.(gif|jpg)">

    9:   SomeDirective4

    10: </Files>

    ```


    示例指令 SomeDirective1 和 SomeDirective2 适用于目录 /some/directory 及其子目录。SomeDirective3
    适用于 /downloads/ URL 下具有 .html 扩展名的页面的 URL。SomeDirective4 将应用于所有具有 .gif 或 .jpg
    扩展名的文件。


    ## 条件求值


    Apache 提供对条件容器的支持。仅在满足某些条件时，才会处理封装在这些容器中的指令。


