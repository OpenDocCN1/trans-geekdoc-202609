    上的 PHP 邮件列表。尽管这些列表的流量通常很大，但您可以从中学到很多。如果您认真对待 PHP 脚本编写，您绝对应该至少订阅一个摘要列表。订阅与您关注的问题相匹配的列表后，考虑发布您的问题。


