    # II. METHODOLOGY


    In this paper, the research method is presented as follows: First, the existing
    literature in the field is surveyed and out. Second, current accidents are counted
    and analyzed, and the data are summarized statistically. Depth exploration is
    carried out on the basis of existing achievements in this paper. The specific
    content is arranged as follows:


    +   (1) On ecological damage assessment methods: The calculation of the ship damage
    caused by the oil spill in the marine area are arranged and summarized comprehensively.
    The research is classified on the basis of environmental, natural resource, and
    ecological damage. Once secondary characteristics are established, the theoretical
    framework of the method is sorted out in detail for comparison, and the correlation
    between the data and indicators is analyzed.


    +   (2) Establishment of indicators: Previous results are used as the object to
    analyze the relevant model influencing factors in the literature and specific
    methods in establishing indicators. The comprehensive indicator methods in the
    research are selected as the main methods in the research.


    +   (3) Detailed exploration on the measurement and evaluation of the oil spill
    accident: Based on the elements of previous events, multiple linear regression,
    radial basis function network, support vector machine learning, and other models
    are used to analyze the data and results, thereby confirming the correlation among
    the accidents. The data obtained by the neural network and other algorithms are
    proven on such basis. Finally, the results of all algorithms are compared to determine
    the most accurate and reasonable assessment method.


    By investigating the relevant literature, we found that the selection of reference
    criteria is essential to determine the selection. The selection should adhere
    to the principles of authenticity, elements, and practicality. In this paper,
    linear regression, BP artificial network, radial basis function network model,
    and support vector machine, which are the most valuable and reliable algorithms,
    are used for data analysis and results discussion. There are many cases in oil
    spill, and it is difficult to obtain consistent and relatively large amount of
