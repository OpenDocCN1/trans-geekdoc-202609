    # INTRODUCTION


    The marine environment is a system that contains various factors in the ocean
    and adjacent areas. It is an important part of the global ecological chain and
    changes the human life and production through a large amount of resources. The
    real-time impact of oil spills is a main source of marine pollution. Effective
    removal and preventive measures must be taken to control the scale and scope of
    pollution to minimize losses and damage. According to the principle of "polluter
    pays", the implementer of the damage and the involved IMF bust must abide by international
    conventions or relevant regulations. The stipulated of oil spill damage, economic
    and environmental compensation, the readiness and completeness of the compensation
    are significant impact on the effectiveness of oil control and environmental remediation.
    Local government departments, marine department, departments, ports and shipping,
    maritime courts, fisheries and aquaculture management, and other departments are
    involved in the elimination of oil pollution. Timely and reasonable compensation
    is an economic and legal issue that affects the


