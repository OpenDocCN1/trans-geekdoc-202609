    **Abstract:** Based on ship oil spills in recent decades, this work builds a rapid
    monetary assessment for damage caused by ship oil spill. By analyzing the sample
    data, five types of indicators (oil spill volume, oil area, product proportion,
    shoreline, shoreline type) have been selected to develop machine learning method
    for a quick evaluation and estimation of compensation amount of the oil damage.
    The results obtained with BP artificial neural network, RBF artificial neural
    network are compared. At the same time, multiple regression is used to analyze
    the degree of compensation amount of each index. Finally, the most model and influencing
    factors are identified to support the real world cases in future.


