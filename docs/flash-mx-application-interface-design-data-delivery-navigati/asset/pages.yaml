- pgno: 104
  md: "The curveTo command accepts four parameters. The final two parameters are the\
    \ actual coordinates we are drawing to, which you can see we have already determined\
    \ with our connX1, connX2, connY2 and y variables. The first two parameters are\
    \ the coordinates that the line curves toward. In our case, we pick a y position\
    \ halfway up our connector and an x position on the opposite side of center from\
    \ the curve, giving us a nice concave shape.\n\n![](img/50202c17d5022233f3e3ec60560e35aa_104_0.png)\n\
    \nTest your movie to see what we have made. Fun!\n\nYou might notice an unwanted\
    \ connector sticking out from our rootNode Chaos. Problem is, it doesn't have\
    \ a node to connect to (poor Chaos!), so we need to make sure it doesn't try.\
    \ We can fix it very quickly in our init method.\n\nAdd the following lines to\
    \ our NodeClass's init method:\n\n```\nif (this._name == \"rootNode\") {\n   \
    \ this.render();\n    return;\n}\n\nthis.createEmptyMovieClip(\"connector\", 1);\n\
    this.connX1 = connectorCos1 * this.radius;\nthis.connY1 = connectorSin1 * this.radius;\n\
    this.connX2 = connectorCos2 * this.radius;\nthis.connY2 = connectorSin2 * this.radius;\n\
    ```\n\nHere we have just done a quick check before we even add the connector movie\
    \ clip. If the node is the rootNode, it renders itself and exits the method.\n\
    \nThe rootNode will still run the drawConnector code unnecessarily, though, even\
    \ if it has no connector movie clip, so let's add one more line to our drawConnector\
    \ method:\n\n```\nNodeClass.prototype.drawConnector =\n    ->function() {\n  \
    \  if (this._name == \"rootNode\") { return\n    ->false };\n    var x = this._x\
    \ - this.parent._x;\n    var y = this._y - this.parent._y;\n```\n\nNow the rootNode\
    \ will immediately leave this function and not run the code. Test your movie to\
    \ see everything in effect.\n\n![](img/50202c17d5022233f3e3ec60560e35aa_104_1.png)"
  merge: -1
  img_proc: true
- pgno: 105
  md: "# One branch at a time\n\nIf you have played with it a bit, you might notice\
    \ that the system starts to slow down the more nodes you place on the stage. In\
    \ addition to that, some nodes might block others when the branches start to get\
    \ thick. To fix this problem, I decided to remove any “nieces” and “nephews” of\
    \ nodes that were being clicked on. That way, you could see the direct lineage,\
    \ but not the children of siblings. I felt this might speed things up as well\
    \ (Flash doesn’t like too many movie clips moving on the stage at once).\n\n![](img/50202c17d5022233f3e3ec60560e35aa_105_0.png)\n\
    \nWe are going to add another method to our NodeClass that will aid us in this\
    \ extra functionality. Let’s place the call to this new method inside our center\
    \ method. Since that is where extra nodes are added as children it makes sense\
    \ to remove the unnecessary nodes there:\n\n```\n```javascript\nNodeClass.prototype.center\
    \ = function() {\n    clearInterval(translateInt);\n    this.parent.removeSiblings(this);\n\
    \    this.showChildren();\n};\n```\n```\n\nSo a node will actually tell its parent\
    \ node to remove its siblings' children, which makes sense seeing as how a node\
    \ really has no direct knowledge of its sibling nodes. Let’s write the `removeSiblings`\
    \ method to see how we accomplish this.\n\nAfter the `NodeClass`'s `showChildren`\
    \ method, add the following new lines of code:\n\n```\n```javascript\nNodeClass.prototype.removeSiblings\
    \ =\nfunction(skip) {\n    var i = 0;\n    while (i < this.children.length) {\n\
    \    if (this.children[i] != skip) {\n    this.children[i].collapseChildren()\n\
    \    }\n    i++;\n    }\n}\n```\n```\n\n`removeSiblings` has a parent node run\
    \ through its children array (skipping the child that called the method). If a\
    \ child has a `children` array of its own, that means the children are currently\
    \ on the stage. It tells the child to remove those children by calling its `collapseChildren`\
    \ method, which we will write now.\n\nPlace this new method before our `removeSiblings`\
    \ method:\n\n```\n```javascript\nNodeClass.prototype.collapseChildren =\nfunction()\
    \ {\n    var i = 0;\n    while (i < this.children.length) {\n    if (this.children[i].children\
    \ != undefined) {\n    this.children[i].collapseChildren()\n    }\n    this.children[i].removeNode();\n\
    \    i++;\n    }\n    delete this.children;\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 106
  md: 'This is the function that we called in the previous method, which will remove
    the children of a node. You can see that it loops through its children array and
    calls the removeNode method (and if a child has children itself, then those children
    are removed as well). Once all of the children are removed, the children array
    is deleted, making way for the children to be attached again if the node is clicked.


    The only thing left to write is the removeNode method we just called. Place it
    after the removeSiblings method:


    ```

    NodeClass.prototype.removeNode = function() {

    var i = 0;

    while (i < this._parent.nodes.length) {

    if (this._parent.nodes[i] == this) {

    this._parent.nodes.splice(i, 1);

    break;

    }

    i++

    }

    this.removeMovieClip();

    }

    ```


    All this method does is loop through the tree''s node array to find reference
    to itself. Once it is found, it removes the reference and removes itself from
    the stage using removeMovieClip. That''s it.


    Test your movie now to see how removing the siblings'' children helps.


    ![](img/50202c17d5022233f3e3ec60560e35aa_106_0.png)


    # Spinning the tree


    Now we have a pretty nice system as it is. Never satisfied, however, I wanted
    to add rotation to our tree. Thankfully, due to the way we have set this up, it''s
    fairly easy. No need to use any 3D rotation math or transformation matrices –
    we have every node contained inside a movie clip and that means we only have to
    rotate the tree clip (thank goodness!). Since its registration point is at the
    center of the viewing window (where our clicked node is heading towards), it will
    look as though the tree is revolving around the node.


    First, we need to decide where to call the rotation code. It makes sense to add
    it to our center method inside of NodeClass, since that is where the rotation
    will need to begin when a node is clicked. Here is the amended method:


    ```

    NodeClass.prototype.center = function() {

    clearInterval(translateInt);

    clearInterval(rotateInt);

    this.parent.removeSiblings(this);

    this.showChildren();

    this._parent.tNodes = [];

    var x = -this.tx;

    var y = -this.ty;

    var z = -this.tZ;

    var i = 0;

    while (i < this._parent.nodes.length) {

    this._parent.nodes[i].setTranslate

    (x, y, z);

    i++;

    }

    translateInt = setInterval(this

    .parent, "translate", intervalTime);

    this.parent.startRotate(-this.angle);

    }

    ```


    Pretty easy to start out with, no? At the top, we clear any interval if a rotation
    is already happening (remember it will be called rotateInt). At the bottom we
    tell the _parent (tree) to rotate and we send the negative of this node''s angle
    property, which is basically the angle that tree will need to counter-rotate.'
  merge: -1
  img_proc: true
- pgno: 107
  md: "Go to the code layer where we wrote the tree.translate method and place this\
    \ method beneath it:\n\n```\n```\ntree.startRotate = function(amount) {\n    this.rot\
    \ = this._rotation;\n    this.degrees = amount*180/pi;\n    while (this.degrees\
    \ < -180 {\n        this.degrees += 360 };\n    while (this.degrees > 180) {\n\
    \        this.degrees -= 360 };\n    if (Math.abs(this.degrees - this.rot) > 180)\
    \ {\n        if (this.rot > 0) {\n            this.degrees += 360\n        } else\
    \ {\n            this.degrees -= 360\n        }\n    }\n    rotateInt = setInterval(this,\
    \ \"rotate\",\n        intervalTime);\n}\n```\n```\n\nThis code looks more confusing\
    \ than it actually is. Basically, I store the tree's current rotation in rot since\
    \ we will be adjusting this number during our animation and it needs to remain\
    \ separate from the actual property. This is because the value might need to go\
    \ beyond 180 or -180, which _rotation is never allowed to do (for instance, -190\
    \ will automatically be converted to 170). I store the degrees to rotate to in\
    \ the variable degrees (which I convert from radians). If the degrees value is\
    \ outside the range of -180 to 180, I adjust it. Once both degrees and rot are\
    \ within the same range, I find the shortest rotation amount between the two and\
    \ adjust degrees again if necessary. The adjustment is required in order to spin\
    \ in the right direction. For instance, if degrees is 170 and rot is -170, 20\
    \ degrees would be the shortest distance to spin to reach the proper angle, not\
    \ 340 degrees. In this case, 360 would be subtracted from degrees, leaving an\
    \ amount of -190, which would allow us to spin the 20 degrees from -170 to -190.\
    \ With rot and degrees set to be in the form we need them, I set an interval to\
    \ call tree's rotate method, which we will write now.\n\nPlace this method right\
    \ after the previous code:\n\n```\n```\ntree.rotate = function(amount) {\n   \
    \ this.rot -= (this.rot -\n        this.degrees)/intervals;\n    this._rotation\
    \ = this.rot;\n    if (Math.abs(this.rot - this.degrees) < 1) {\n        clearInterval(rotateInt);\n\
    \    }\n}\n```\n```\n\nAnother easing, motion-tweened animation. We just adjust\
    \ the rotation of our tree a little each interval call. Once we're close enough,\
    \ we clear the interval. Test your movie now to see the result.\n\n![](img/50202c17d5022233f3e3ec60560e35aa_107_0.png)\n\
    \nSee the problem? By rotating the tree we are also rotating each node, which\
    \ in turn causes the text to rotate into unreadable positions. What we need to\
    \ do is rotate the node graphic in the opposite direction as the tree. We'll create\
    \ one final method inside NodeClass to take care of this."
  merge: -1
  img_proc: true
- pgno: 108
  md: "Add this method after NodeClass's drawConnector method on the NodeClass layer:\n\
    \n```\nNodeClass.prototype.rotateGraphics = \\\n    function(degrees) {\n    \
    \    this.nodeGraphic._rotation = degrees;\n    }\n```\n\nHere we simply rotate\
    \ the graphic of the node. Easy. Now to call this method, we could simply place\
    \ a loop in the tree's rotate method that would run through its nodes. This would\
    \ be the easy thing to do. What I want to do, however, is show you a new way of\
    \ handling situations like this that perhaps is unnecessary in the current system,\
    \ but you might find invaluable later. We are going to create a custom event.\n\
    \nThere is an undocumented feature in Flash MX that will allow us to create our\
    \ own custom events in our movies (events like onEnterFrame or onMouseMove), and\
    \ then register objects to receive these custom events. For instance, you know\
    \ that every instance of a movie clip automatically receives notification every\
    \ time a frame is entered, and you can write a handler to run a function when\
    \ that event occurs:\n\n```\nmcInstance.onEnterFrame = function() {};\n```\n\n\
    In this case, the event is already defined and the movie clip is already set up\
    \ to receive notification of the event. Now imagine if you could define your own\
    \ events and decide which objects should receive notification when these events\
    \ are fired. This is now possible, and it only takes a few lines of code. So let's\
    \ give it a try!\n\nAdd this new line to the code immediately following the creation\
    \ of our tree movie clip, on the code layer:\n\n```\nthis.createEmptyMovieClip(\"\
    tree\", 0);\ntree._x = windowWidth*.5;\ntree._y = windowHeight*.5;\ntree.depth\
    \ = 15000;\ntree.setMask(mask);\n\nASBroadcaster.initialize(tree);\n```\n\nASBroadcaster\
    \ is an undocumented object that allows us to enable new objects to broadcast\
    \ events, which is what we would like tree to be able to do. The initialize method\
    \ gives this ability to tree. Now tree can define new events to broadcast to the\
    \ Flash movie.\n\nNow we need to actually broadcast our custom event, which we\
    \ will do every time we rotate our tree. Place these new lines in our tree.rotate\
    \ method:\n\n```\ntree.rotate = function(amount) {\n    this.rot -= (this.rot\
    \ -\n        this.degrees)/intervals;\n    this._rotation = this.rot;\n    if\
    \ (Math.abs(this.rot - this.degrees) < 1) {\n        clearInterval(rotateInt);\n\
    \    }\n    this.broadcastMessage(\"onRotate\", -\n        this._rotation);\n\
    }\n```\n\nSince we have initialized this object with ASBroadcaster, we can use\
    \ broadcastMessage to fire a custom event. Now every time the tree.rotate function\
    \ is called, it will send out the custom event onRotate to any object registered\
    \ to receive it. In addition, we send an additional parameter, this._rotation,\
    \ that can be used by the objects receiving the event.\n\nTwo more lines will\
    \ do everything we need for our new event to work. First, we need to have objects\
    \ that will receive this new event, and will hopefully act upon it.\n\nGo to the\
    \ NodeClass layer and add the following lines to the NodeClass's init method:\n\
    \n```\nthis._parent.addListener(this);\nthis.onRotate = this.rotateGraphics;\n\
    \nif (this._name == \"rootNode\") {\n    this.render();\n    return;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 109
  md: 'addListener adds this object (this node) as a listener for any event that tree
    (this_parent) will broadcast. On the next line, we assign a function for this
    custom event, in this case the rotateGraphics method we wrote just a few moments
    ago. Now, in addition to receiving notification of all of the standard movie clip
    events (enterFrame, mouseMove, load, and so on), our NodeClass instances will
    receive notification when the tree rotates as well, and they will use the onRotate
    handler when this event occurs.


    Test your movie now to see how the nodes know when to rotate their graphics. This
    ability to assign custom events can come in extremely handy – and is pretty fun
    to play around with, too!


    ![](img/50202c17d5022233f3e3ec60560e35aa_109_0.png)


    # # Taking it further


    What I''ve shown you in this chapter is how to build, manipulate and animate a
    branching structure. The finished file as was presented in this tutorial can be
    found in the download files as gods_tree_book.fla if you want to look at the code
    in its entirety. As you saw in the initial gods_tree.swf, I went on to build another
    level of functionality for this system by allowing the user to click on nodes
    to access additional information (plus I added spouse nodes to the system). All
    the code is commented, and I encourage you to open it up and take a look at how
    certain things were accomplished.


    In addition, imagine where you could take this concept and this file further.
    Although it works well to display branching information, and indeed that is what
    it was built for, I couldn''t help but think of some great games that could be
    built from this system, from a more sophisticated Whack-a-Mole to a Choose Your
    Own Adventure type interactive story. Instead of loading a single interface full
    of information, perhaps you could set the system up as a gallery where selecting
    a low-res image on a node loaded the higher-res full screen version. How about
    making the gallery system respond to the types of images that a user has previously
    chosen, loading similar or complementary images in the next generation? Maybe
    you could remove the user entirely and use some random generation and funky math
    to animate the nodes and the colors of the system to create some surrealistic
    Web-art. Or maybe I should stop giving my ideas away and beat you to the punch!'
  merge: -1
  img_proc: true
