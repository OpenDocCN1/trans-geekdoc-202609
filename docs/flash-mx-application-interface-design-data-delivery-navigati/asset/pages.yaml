- pgno: 100
  md: "We must give a lot of information to the children at the outset, and this is\
    \ where we do it. For each child, we first find the angle that we will be placing\
    \ it at. The way I determined this was to take 180 degrees (or pi radians, half\
    \ of a circle), divide that by the number of children plus 1 (so 3 children would\
    \ divide 180 up 4 times, giving us 45 degrees for each), multiplying this by whatever\
    \ iteration of the loop we are currently at (adding 1 so we don't place anything\
    \ at 0 degrees), then adding the current angle of the parent node. Whew!\n\nThe\
    \ rest of it is much more straightforward. After setting a variable to hold the\
    \ distance of the node from its parent on the x and y axes, I've created a new\
    \ object that I will pass with the attachMovie method, and attached to this object\
    \ all of the properties I need to give the child node, including all of the node\
    \ data (name, col, info, children and spouse), the node's parent node and the\
    \ node's angle. For coordinates, I've placed it at the same x and y position as\
    \ the current node, its parent, but I also gave it translated coordinates, which\
    \ will be its ending position, that are outside of the parent, based on the angle\
    \ I have determined multiplied by the distance I have determined. However, I went\
    \ ahead and set its final z coordinate to simply be 100 less than the parent's\
    \ z (100 since that was the value we gave childDepth above). Since we have given\
    \ the child node different translated coordinates than its current coordinates,\
    \ it will immediately upon creation move into its final position, giving us a\
    \ nice birthing effect.\n\nOne last thing to add to enable this new functionality,\
    \ and that's to tell Flash when to do all this. Jump back up to the init method\
    \ of our NodeClass and amend it as follows adding in the extra lines:\n\n```\n\
    ```actionscript\nlabel.text = \"\" + this.node.name + \"\";\nlabel._y = label.textHeight/2;\n\
    \nvar nb = this.nodeGraphic.nodeBack;\nnb.onPress = function() {\n    this._parent.parent.center();\n\
    };\nnb.onRollOver = function() {\n    rollOver_txt.text = parent.node.name;\n\
    };\nnb.onRollOut = function() {\n    rollOver_txt.text = \"\";\n};\nnb.useHandCursor\
    \ = 0;\n\nthis.render();\n```\n```\n\nnodeBack is the background graphic inside\
    \ nodeGraphic. We need to add the button functionality to this interior movie\
    \ clip since we will need separate functionality for the open button. Because\
    \ of the movie clip's nested nature, when we call the center method that we created\
    \ earlier we need to refer to _parent._parent to reach the node's timeline and\
    \ the method. I've also taken this opportunity to add some rollover effects to\
    \ the text field at the bottom of the interface.\n\nGo ahead and test your movie\
    \ and see what we've created so far. Not bad! We have a working, animating structure\
    \ already! Now all we need to do is some optimization and enhancements.\n\n![](img/50202c17d5022233f3e3ec60560e35aa_100_0.png)"
