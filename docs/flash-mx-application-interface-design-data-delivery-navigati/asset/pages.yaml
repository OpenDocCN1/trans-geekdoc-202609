- pgno: 76
  md: "We're almost there, but you can see we have a few problems that have cropped\
    \ up. First, the content is seen before the window is fully open, and second,\
    \ the content is not removed immediately when a new section is selected. Let's\
    \ take care of the first problem by adding a mask to reveal the content. We will\
    \ do this in our addContent code.\n\nPlace these lines at the end of the addContent\
    \ function, immediately after the formatting of tb:\n\n```\nthis.createEmptyMovieClip(\"\
    contentMask\", 50);\ncontent.setMask(this.contentMask);\n```\n\nThat's easy enough,\
    \ but all we actually have is an empty clip. We need to draw something inside\
    \ it to serve as our masked region. We will take care of this in the extendBottomSide\
    \ function, which is appropriate since this is where we want the mask to slowly\
    \ reveal the content.\n\nPlace these lines before the final if statement in the\
    \ extendBottomSide function:\n\n```\nthis.contentMask.clear();\nthis.contentMask.beginFill(0,\
    \ 0);\ndrawBox(this.contentMask, -mc.leftSide, -buttonHeight, -branchDown,\n->\
    \ mc.bottom);\nthis.contentMask.endFill();\n```\n\nNow we have something! The\
    \ box inside contentMask can be drawn with the drawBox function since we want\
    \ a rectangular mask for our content. As mc.bottom is adjusted a little each function\
    \ call, the mask will extend with the drawn borders to reveal more content.\n\n\
    One last thing to take care of, and that's the removal of previous content. This\
    \ can be accomplished with just a few extra lines within the selectMe function,\
    \ which is the point where we need previous content removed.\n\nAdd the following\
    \ line to the beginning of selectMe (still on the sections code layer). It can\
    \ be added anywhere before the first for loop.\n\n```\nthis._parent.content.removeMovieClip();\n\
    ```\n\nSo the content is removed. To take care of the mask as well, add the following\
    \ new line to the second for loop:\n\n```\nfor (var i in sectionButtons) {\n \
    \   if (sectionButtons[i].selected) {\n    sectionButtons[i].onEnterFrame = retractLeftSide;\n\
    \    sectionButtons[i].contentMask.removeMovieClip();\n    sectionButtons[i].btn.enabled\
    \ = 1;\n    delete sectionButtons[i].selected;\n    }\n```\n\nWith these additions,\
    \ test your movie and see what we've accomplished!\n\n![](img/50202c17d5022233f3e3ec60560e35aa_76_0.png)\n\
    \n![](img/50202c17d5022233f3e3ec60560e35aa_76_1.png)\n\n![](img/50202c17d5022233f3e3ec60560e35aa_76_2.png)\n\
    \n![](img/50202c17d5022233f3e3ec60560e35aa_76_3.png)\n\n![](img/50202c17d5022233f3e3ec60560e35aa_76_4.png)\n\
    \n![](img/50202c17d5022233f3e3ec60560e35aa_76_5.png)\n\n![](img/50202c17d5022233f3e3ec60560e35aa_76_6.png)"
  merge: -1
