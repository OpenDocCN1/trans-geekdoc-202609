- pgno: 261
  md: '# # FLASH MX APPLICATION & INTERFACE DESIGN


    Data delivery, navigation, and fun in Flash MX, XML, and PHP


    # ## Flash as the Ideal Medium


    If you have a hook on Flash, but are looking for inspiration as to what to use
    it for, just have a look at these interfaces.


    Using a blend of instructional and inspirational chapters, this book looks at
    Flash''s strengths – graphical dynamism, interactivity, back-end punch and multimedia
    delivery.


    +   - Make gorgeous sites in tiny files with the Drawing API

    +   - Look at the marriage of data and beauty with a Flash Family Tree

    +   - Create real-feel interfaces that mimic different media.

    +   - Make XML do the donkey-work in site structure

    +   - Ease up your navigation with PHP

    +   - Create an entire drawing application

    +   - Deliver video and make it interactive with Flash


    ...and so much more!


    # ## Who is this book for?


    This book is for people who want to hone their Flash skills to make their code
    really work for its supper. With one look at these inspiring interfaces, you''ll
    see that everything pitches in to the final design. It''s foxy and functional,
    and will show you some indispensable techniques.


    ![](img/50202c17d5022233f3e3ec60560e35aa_261_0.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_261_1.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_261_2.png)


