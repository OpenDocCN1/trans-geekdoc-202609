- pgno: 160
  md: "We're then setting the scroll position to be 0 (so the scrollbar is scrolled\
    \ to its absolute top). Then finally, we're setting two things in the title bar;\
    \ the number of files visible (items) and the path of that particular folder,\
    \ like in the top of this image:\n\n![](img/50202c17d5022233f3e3ec60560e35aa_160_0.png)\n\
    \nThat's the end of the loader2.onLoad function.\n\nWhen the Navigate up button\
