- pgno: 220
  md: '# # INTERACTIVE VIDEO: KARATE!


    ![](img/50202c17d5022233f3e3ec60560e35aa_220_0.png)


    Having a working knowledge of Flash puts us in a fortunate position. When having
    one of those late night discussions about things you''d love to do but have never
    gotten round to, a friend mentioned his wish to demonstrate his adeptness at karate
    to others in some kind of instructional film. This got me thinking. Would it be
    possible to use Flash to help him realize this aim? Flash MX''s new video capabilities
    have opened up endless possibilities, and my mind immediately started ticking
    over with ways to make this wish a reality. However, I knew the challenge would
    not simply be to get a video on the web. The site would have to be instructional,
    and what''s more, it needed to be easily updateable. After all, he wanted to be
    ultimately in control. Would it be possible to create an expandable interface
    to which he could prepare and add additional content, with a minimum amount of
    effort once the groundwork had been done? Not one to baulk at a challenge, I set
    to work.


    Little foot position diagrams are all well and good, but of course we wanted to
    add an extra dimension to this technique through the addition of some hardcore
    karate video action. Using Flash MX''s new capabilities to embed video into our
    Flash movies, combined with the traditional Flash techniques of vector based motion
    graphics, we can analyze video content and use Flash as an educational content
    producer, in this case to illustrate the performing of a kata. I set about this
    by creating two Flash movies. The first one would enable me to record a kata''s
    movements, and the second would be designed to play back this captured information
    as a karate tutorial movie. Our first movie is called *kata_record.fla* and our
    second *kata_play.fla*.


    The basic techniques of karate include stances and methods of blocking, kicking,
    punching, and striking. These techniques are combined during practice in choreographed
    patterns called katas (pronounced KAH tahs). We have all seen diagrams illustrating
    dance moves using a multitude of feet symbols and arrows. Although Flash would
    be adequately equipped to deliver a how to dance movie, outside of the *Strictly
    Ballroom* or *Billy Elliot* movie hype driven fads, who wants to dance? However,
    this idea of diagrammatic representation seemed to lend itself very well to my
    challenge, finding an effective way of demonstrating karate.


    So it happened that, one Friday night as the rest of the working world was winding
    down for the weekend, myself and a man dressed in white pajamas found ourselves
    in an abandoned kick boxing gym, armed only with a DV cam and a tripod.'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'We recorded the kata being performed a number of times, both from the front
    and side. It was decided that these were the two angles that gave most information
    to the viewer. We wanted to give the viewer a choice of views when watching the
    completed movie so it was important to think ahead and make sure that any footage
    that was going to be required was captured at this time.


    In our movie kata side the rei takes place at 2.2 seconds.


    ![](img/50202c17d5022233f3e3ec60560e35aa_221_0.png)


    Ideally, these two angles would have been recorded simultaneously using two DV
    cams – but we don''t live in an ideal world, and as I''m a true professional I''m
    used to working round technological and financial restraints. We filmed the kata
    being performed both towards the camera and then across the field of view. (Incidentally
    for the purposes of this project the exercise being performed is the Pinan Yondan
    kata, but then I guess you would have spotted that yourself.)


    In kata front it takes place at 1.15 seconds


    ![](img/50202c17d5022233f3e3ec60560e35aa_221_1.png)


    iMovie was used to capture the footage. This has the advantage of being simple
    to use, plus of course it was freely available to us as it comes as standard with
    all current Macs. (It is Mac only software but Movie Maker for Windows XP would
    do the same job if you were planning a similar project and needed to use a P.C.)


    Once the footage of the kata being performed from each angle was imported into
    iMovie, (and the two clips imaginatively named katafront and kataside) a little
    editing was required, as we needed to check that our two clips began and ended
    at the same point along the timeline.


    With the kata being an intricately choreographed routine the length of time it
    takes to perform each occasion is of a near identical duration. We needed to sync
    kataside with katafront. The first step in each kata is a bow, or rei, as it is
    known (educational, this, isn''t it?). We needed to have the rei taking place
    at exactly the same position on the timeline in each of our movies.


    A little simple mathematics showed me that I needed to remove 2.2 minus 1.15 seconds
    from kataside – 1.05 seconds. To do this we position the playhead at 1.05 seconds
    and then split the video clip. Edit > Split Video Clip at Playhead or Cmd / Ctrl-T.'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'I now had two video clips starting at exactly the same time before the kata
    starts, and, due to the tight choreography, finishing within fractions of a second
    of each other. I then trimmed the ends of our video so that I had two clips of
    identical length, one minute and two seconds long.


    I didn''t want to over complicate the movie clips with effects, but in order to
    make our end product seem a bit more professional I applied a simple Fade In and
    Fade Out to the beginning and end of both clips. This means that the final movie
    won''t have such a brutal change of appearance between being static and playing.


    ![](img/50202c17d5022233f3e3ec60560e35aa_222_0.png)


    iMovie can export movies in a range of formats. I chose to export the two clips
    as QuickTime (.mov) clips. Macromedia Flash MX has an advanced method of compressing
    video, built-in in the form of Sorenson Spark. This means it''s advantageous to
    keep movies at as high a quality as possible until they are imported into Flash.


    It is worth noting here that the video was exported as 25 Frames per second. The
    relevance of this becomes apparent once we import our movies into Flash.


    ![](img/50202c17d5022233f3e3ec60560e35aa_222_1.png)


    I now had my two movies, katafrontfql.mov and katasidefql.mov, each weighing in
    at a pretty hefty 224mb. (You can find lower quality versions of these clips in
    the download files, if you want to follow along with the development process.)
    Now obviously this is not the sort of file size we have come to associate with
    Flash design. Luckily Flash MX can help us to do something about this.


    We can now start to piece together our first Flash movie, kata_record.fla.


    With Flash launched the first thing to do is set our frame rate to match that
    of the video we are going to import. When we exported our QuickTime movie we made
    a point of noting that the frame rate was 25 fps, and we need to mirror this setting
    in the properties of our Flash movie. This can be done in the Properties palette,
    which should be visible by default when we launch Flash. We can also set the overall
    size of our Flash movie now. In order to have a nice big space to play with, go
    for a size of 700 x 420 pixels. Remember that Flash always resizes from the top
    left hand point of the stage – this can make it really important to think ahead
    when beginning Flash projects.'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'Let''s finally get a video clip into the Flash environment. Go to File > Import
    to Library and navigate through your directories to find the QuickTime movies.
    As both clips are essentially the same footage, shot from different angles, we
    could select either one. Our first movie will make use of just one of the views
    of our shot. I have selected katafrontfql.mov. A window appears asking whether
    we wish to embed the video within our Flash movie or link to it externally. We
    want to embed it.


    Sorenson Spark then launches from within Flash and the following window appears:


    ![](img/50202c17d5022233f3e3ec60560e35aa_223_0.png)


    This is where we slim down our video content to a far more manageable size.


    We can afford to lower the quality of our import to around the 80% mark, as this
    still gives us enough detail to analyze the video content.


    Our video does contain a fair degree of movement, although it is movement within
    a static environment. We have therefore gone straight down the middle and selected
    a Keyframe interval of 24.


    These two settings, Quality and Keyframe interval, do require a degree of trial
    and error to achieve results, as a little adjustment can give very different results.


    The Scale slider is where we reduce the video size from the ''large'' size that
    we exported from iMovie to the size we will eventually view it at. The video is
    going to make up approximately one third of our final movie''s screen width, so
    thinking of a final screen resolution of 1024 x 768 pixels, a scale of 40% makes
    sense.


    We don''t need to synchronize the video to the document frame rate as we have
    already adjusted the document to match the video.


    We can choose here whether or not to import the sound alongside our video. I have
    included the sound, as it is important to our end goal, the demonstration of karate.
    While performing the kata, sound plays an important part with the practitioner
    occasionally giving a yell called a kiai (pronounced KEE eye). However, as we
    know, sound is included at the expense of file size. Perhaps for Web presentation
    we should omit sound, but for this exercise I wanted to include it. You never
    know, this might end up being a best selling teach yourself karate CD-ROM.


    Once we press the OK button we have a bit of a wait while Sorenson Spark works
    its magic. Probably a good time to work on developing that one-inch punch you
    so desire.


    That should have stopped importing before you develop plans to take on Chuck Norris,
    and we can take a look at our new slimline video. Double clicking on my movie
    clip in the library shows me that Sorenson has managed to reduce my 224mb video
    to just 877k. Now that''s impressive! Obviously if you are working with lower
    quality versions these figures will differ, but it should give you an idea of
    the power of Sorenson Spark''s compression system.


    Before we can do anything else we need to put that embedded video into a movie
    clip. Create a new movie clip called video and rename the layer Video too. Drag
    a copy of katafrontfql.mov from the library to the stage and a box will appear,
    asking whether to insert enough frames to display the whole video. We don''t want
    to lose any of our video, so click yes.'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'While we are in our video movie clip there are a few more things we should
    do. A rectangular movie can look a bit harsh, and there is no reason for it to
    remain like this. Add two new layers above our video layer. Call the top one frame,
    and the other mask.


    Select the fill and cut it, select frame 1 in the mask layer and use the paste
    in place option to position it back where it was but a layer further down. This
    layer should then be turned into a mask and the video layer into a masked layer.


    ![](img/50202c17d5022233f3e3ec60560e35aa_224_0.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_224_1.png)


    Using the rectangle tool, with a corner radius setting of 15 points and a line
    thickness of 4, draw a box to match the size of the video clip. Don''t worry about
    the fill of the box obliterating the video as we are going to use the fill as
    a mask.


    Masking video content in Flash can be a very bad idea, as it is often an extravagant
    waste of bandwidth, but we are being careful here. We are only clipping the edge
    of our video, and as there is little movement around the edges of the clip, Flash
    is not having to process that much video that won''t be seen.


    ![](img/50202c17d5022233f3e3ec60560e35aa_224_2.png)


    Let''s take a sneaky preview of how our video looks with its fancy new frame.
    Leave the video movie clip and go to Scene 1. Drag an instance of video onto the
    main stage and then preview the movie.


    ![](img/50202c17d5022233f3e3ec60560e35aa_224_3.png)'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'Although we can see the results of the video editing and the mask, at the moment
    this is all very linear. Sure we can watch our video play again and again, but
    what happens if we want to stop and study a particular stance, or we miss a section
    and want to see it again without waiting for the whole kata to play right the
    way through once more? We need control.


    ![](img/50202c17d5022233f3e3ec60560e35aa_225_0.png)


    We are going to give our movie some basic video player style controls, which will
    allow us to control the playback of our video clip and to analyze exactly what
    is going on at any time.


    Create a new button movie clip and name it generic button. (Although it is ok
    to use any movie clip as a button in Flash MX, for simple controls such as this
    I still use the old style buttons, as I find them easier to create quickly.) Draw
    a square with rounded corners in the center of the stage. (Of course you could
    always just steal it from the library of the completed FLA in the download files.)


    ![](img/50202c17d5022233f3e3ec60560e35aa_225_1.png)


    Add a keyframe in the down frame and put the onion skin option on.


    ![](img/50202c17d5022233f3e3ec60560e35aa_225_2.png)


    The button in the down frame can now be scaled down, either dragged using the
    transform tool, or via the transform palette. The onion skin option allows us
    to monitor the difference between our up and down button states.


    ![](img/50202c17d5022233f3e3ec60560e35aa_225_3.png)


    To give another element of user feedback when pressing the button we can also
    add a little sound. Flash provides us with a wide assortment of sounds in its
    shared sounds library.


    I decided that Switch Small Plastic had the right kind of feel to it. Add a second
    layer to the button timeline and insert a blank keyframe at the down state. We
    can then drag an instance of Switch Small Plastic directly into that frame. When
    the button is pressed it will now give us a ''click'' noise.


    ![](img/50202c17d5022233f3e3ec60560e35aa_225_4.png)


    We will be able to use our newly created button for each of the video player functions.
    The scaling effect will give the impression of depth to our button by making it
    appear slightly further away when it is pressed, and the ''click'' sound will
    add to this sense of reality.


    We could then go ahead and drag all the buttons we are going to need onto the
    main stage, but let''s plan ahead and think as to how our buttons will be used.
    With our buttons loose on the stage we would have seven movie clips to concern
    ourselves with. If though, we put these buttons within another new movie clip,
    we will have the power to reposition all buttons at once, and refer to them as
    a single element within our ActionScript.


    Create another movie clip called controller. This will become our ''control panel''
    and house all the buttons that we are going to need to work with our video clip.
    In this new movie clip create a layer called buttons and drag an instance of our
    generic button onto the stage. We now need to duplicate this instance seven times
    using Cmd/CTRL-D.


    ![](img/50202c17d5022233f3e3ec60560e35aa_225_5.png)'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'Don''t worry too much about the position of the buttons for the moment, simply
    space them out slightly, then use then use the align and space tools to position
    them neatly so we can access each button individually.


    ![](img/50202c17d5022233f3e3ec60560e35aa_226_0.png)


    We need to know what each of our buttons does, so it''s time to add some labels
    to them. Create a new layer and call it text. On this layer create a static text
    box and type ''4789;''. This is not very informative text yet, but select it and
    change it from our default ''Arial'' font to ''Webdings'' and we have instant
    universally recognized video control symbols.


    ![](img/50202c17d5022233f3e3ec60560e35aa_226_1.png)


    Create a new static text box and cut and paste the ''rewind'' symbol to it, repeat
    this with ''fast forward'', and ''rewind to start''. We can leave play and pause
    in the same text box. This one may need to have the character spacing tweaked
    slightly to get the spacing right.


    ![](img/50202c17d5022233f3e3ec60560e35aa_226_2.png)


    These labels can now be placed on our buttons. Create some more for slow motion,
    advance one frame and reverse one frame.


    ![](img/50202c17d5022233f3e3ec60560e35aa_226_3.png)


    We could have created seven duplicates of our button within the library, and added
    text directly to each button, but I know that I''m fickle and often change elements
    as I progress through a project, so it''s better to leave my options open. If
    for example, we decide to use green text rather than black for our labels we have
    them all in one place, on one layer making it easy to select them all and transform
    them.


    Before we leave these buttons we need to give each instance its own name so that
    we can differentiate between them when we come to add functionality to them.


    Our buttons are named – from left to right – homeBut, rewindBut, playBut, ffwdBut,
    backFrameBut, slomoBut and forwardFrameBut.


    Retuning to our main stage, rename our only layer video and create a new layer
    called controls. Drag an instance of the controller movie clip to the main stage.
    Our movie now contains an instance of controller and one of video. These need
    to be given instance names. I''ve called them controls and video respectively.


    ![](img/50202c17d5022233f3e3ec60560e35aa_226_4.png)'
  merge: -1
  img_proc: true
- pgno: 227
  md: "We are now ready to start adding some functionality to our buttons. Add another\
    \ new layer to our main timeline. Rename this one Actions. All the code for our\
    \ Flash Movie is going to be housed on frame one of this layer, as is best practice\
    \ in Flash MX. We could attach functions directly to our buttons but keeping all\
    \ our code in one place makes it easier to see what's going on, and troubleshoot\
    \ should the need arise.\n\nWe can now test our movie and check that our play/pause\
    \ button successfully starts our video, pauses it and sets it playing again each\
    \ time it is pressed.\n\nThe most important button is our play/pause one, so let's\
    \ get that one working.\n\nThe forward and backward single frame button functions\
    \ are nice and simple so we'll get them out of the way next. Add this ActionScript\
    \ below the first code:\n\nMaking sure that frame1 on the Actions layer is selected,\
    \ bring up the Actions window.\n\nEnter this ActionScript:\n\n```\ncontrols.playBut.onRelease\
    \ = function() {\n  if (playing == false) {\n    video.play();\n    playing =\
    \ true;\n  } else {\n    video.stop();\n    playing = false;\n  }\n};\n```\n\n\
    ```\ncontrols.backFrameBut.onRelease = function() {\n  video.prevFrame();\n  playing\
    \ = false;\n};\n\ncontrols.forwardFrameBut.onRelease = function() {\n  video.nextFrame();\n\
    \  playing = false;\n};\n```\n\nThis code allows our button to function as both\
    \ a play and pause button. All our buttons will be within the controller movie\
    \ clip known as controls, so all our button scripts will begin with a similar\
    \ structure:\n\nThese two bits of code simply tell the video clip to go to either\
    \ the previous frame, or the next frame. Each function also includes the line\
    \ we first saw in our play/pause button (playing = false). This is important to\
    \ ensure that we have parity in the state that our buttons leave the video. Without\
    \ it, the play button would need to be clicked twice before it would function\
    \ as expected, as nothing would have told it that the video had in fact stopped\
    \ playing.\n\n```\ncontrols.nameBut.onRelease = function() {\n\n```\n\nNext we'll\
    \ attach a function to our rewind to start button. The ActionScript is similar\
    \ in structure to our back and forward frame buttons:\n\nWhen the button is released\
    \ Flash checks to see whether video is already playing or not and then acts accordingly.\
    \ We set a variable playing to show true when the video clip is playing and false\
    \ when stopped. This variable is set immediately after the video is told to play\
    \ or stop and therefore sets up the script for next time the button is pressed.\
    \ It is important to bear this in mind when we come to add functions to our other\
    \ buttons.\n\n```\ncontrols.homeBut.onRelease = function() {\n  video.gotoAndStop(1);\n\
    \  playing = false;\n};\n```\n\nThis time though, rather than just going back\
    \ a single frame, we are telling the video clip to return right to the beginning\
    \ at frame 1.\n\n![](img/50202c17d5022233f3e3ec60560e35aa_227_0.png)"
