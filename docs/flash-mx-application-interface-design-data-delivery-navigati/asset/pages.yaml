- pgno: 101
  md: "# # Masking backstage\n\nOne thing you might have noticed after the previous\
    \ section is that we are continuing to show our nodes when they either move off\
    \ the stage or when they are too small to be useful. We can take care of these\
    \ problems quickly with a little visibility check. We already have our visibility\
    \ range established by our hither and yon properties.\n\nStill in our NodeClass\
    \ layer, add this method to follow the render method:\n\n```\nNodeClass.prototype.checkVisibility\
    \ =\n-> function() {\n   this._visible = (this.z < this.yon &\n-> this.z > this.hither\
    \ && this.hitTest(window));\n   return this._visible;\n};\n```\n\nRemember adding\
    \ the window movie clip at the start of our code? It was simply a box with an\
    \ alpha fill of 0 so that it couldn't be seen. We used it initially to center\
    \ our tree within the viewing area. We can also use it, though, to test whether\
    \ our nodes are inside its boundaries or not. In this method, we make a quick\
    \ check to see if not only our nodes are in hither/yon range, but also if the\
    \ nodes are inside the window movie clip. We set the visibility of our node to\
    \ be true or false based on these conditions and return this Boolean value to\
    \ wherever we called the function. Now, of course, we need to call the function!\
    \ In the render method in NodeClass, add the following lines:\n\n```\nthis._xscale\
    \ = this._yscale = this.z *\n-> depthFactor*scaleFactor + 100;\nif (this.checkVisibility())\
    \ {\nthis.drawConnector();\n}\n```\n\nI went ahead and combined this new line\
    \ with an additional method we will write in a moment. Basically, we call the\
    \ checkVisibility method inside an if conditional check. If it returns true, we\
    \ will draw the connectors for the node. If it returns false, meaning the clip\
    \ is invisible, we do not need to waste processing power on the connectors.\n\n\
    Test your movie again to see the visibility check in action!\n\nWe're almost done\
    \ with our masking, but we still are able to see clips as they move outside of\
    \ the viewing window. They are not made invisible until they are completely outside,\
    \ so let's make a quick mask to clean this up.\n\nGo back to the code layer and\
    \ add these new lines to our script:\n\n```\nthis.createEmptyMovieClip(\"window\"\
    , 1000);\nwindow.beginFill(0, 0);\nwindow.lineTo(windowWidth, 0);\nwindow.lineTo(windowWidth,\
    \ windowHeight);\nwindow.lineTo(0, windowHeight);\nwindow.endFill();\nwindow.duplicateMovieClip(\"\
    mask\", 1);\n\nthis.createEmptyMovieClip(\"tree\", 0);\ntree._x = windowWidth*.5;\n\
    tree._y = windowHeight*.5;\ntree.depth = 15000;\ntree.setMask(mask);\n```\n\n\
    Since we already have a movie clip that's the same size as the viewing area, we\
    \ quickly duplicate it for purposes of a mask (it doesn't matter that the alpha\
    \ is 0 since alpha is not taken into account with masks). Once the tree is created,\
    \ we use setMask to have the mask movie clip mask the tree clip. Short and sweet,\
    \ and extremely effective! Test your movie once more to see the result.\n\n![](img/50202c17d5022233f3e3ec60560e35aa_101_0.png)\n\
    \n![](img/50202c17d5022233f3e3ec60560e35aa_101_1.png)\n\n![](img/50202c17d5022233f3e3ec60560e35aa_101_2.png)"
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Gooey connections


    In the render method above, we called the drawConnectors method, which we will
    use to connect each of the nodes with its parent. This is my favorite part of
    this project as it adds a real organic feel to the system as well as taking advantage
    of dynamic gradient fills. (I just love that new drawing API – so many new toys!)
    To achieve this effect, we will need to add some variables in other parts of the
    code to help us out.


    Go to the code layer and add these lines following the declaration of the pi variable:


    ```

    connectorSin1 = Math.sin(-pi/3);

    connectorCos1 = Math.cos(-pi/3);

    connectorSin2 = Math.sin(-pi*2/3);

    connectorCos2 = Math.cos(-pi*2/3);

    ```


    Each of the nodes will use these values to find the x and y position of the corners
    of the connectors (which we will use the drawing API to create). Instead of having
    to calculate these values for each node, we place them in variables that we can
    access later. These hold the sine and cosine of angles -60 and -120 degrees, which
    is where we will place each corner of the connector in relation to the center
    of the node graphic.


    With these values determined, we need to find the x and y points for each particular
    node. We will do this inside the init method for the NodeClass. Add the following
    lines to the end of the init method, but before the render call:


    ```

    this.createEmptyMovieClip("connector", 1);

    this.connX1 = connectorCos1 * this.radius;

    this.connY1 = connectorSin1 * this.radius;

    this.connX2 = connectorCos2 * this.radius;

    this.connY2 = connectorSin2 * this.radius;

    this.render();

    ```


    You can see that first we add an empty movie clip named connector that will hold
    our drawing. Next we calculate the x and y positions of our connector''s corners,
    based on our sine and cosine values multiplied by the radius of our graphic.


    ![](img/50202c17d5022233f3e3ec60560e35aa_102_0.png)


    Now it''s time to create the drawConnector method, which will take care of the
    drawing of our gooey connectors. Place the beginning of this new method after
    the checkVisibility method of our NodeClass:


    ```

    NodeClass.prototype.drawConnector =

    function() {

    var x = this._x - this.parent._x;

    var y = this._y - this.parent._y;

    this.connector.rotation =

    Math.atan2(y, x) * 180/pi - 90;

    var distance = Math.sqrt(x*x +

    y*y)*100/this._xscale - this.radius*.25;

    this.connector.clear();

    this.connector.moveTo(this.connX1,

    this.connY1);

    ```


    x and y are local variables that hold the distance of our node from its parent
    node on each axis. Using this, we can determine the angle at which we need to
    rotate our connector movie clip by sending the values to the Math.atan2 method
    (which we multiply by 180/pi to convert to degrees, and subtract 90 from since
    Flash views 0 degrees as east and not north, which is what we need).'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'The distance is the Pythagorean theorem at work, which is adjusted for our
    node''s current scale. Honestly, subtracting a quarter of the radius was a value
    I stumbled upon which worked perfectly. I spent a good deal of time racking my
    brain on why so I could provide you with an explanation, but sometimes you thank
    your good fortune and answer the question “Why does this work?” with the answer
    “Because it does.”


    The next two lines of code can be explained, though. We clear the connector of
    its previous drawing and move the “pen” to our starting x and y position.


    These two lines help determine the height of our drawing, which we will need for
    our gradient parameters. Place these lines directly after the previous code:


    ```

    ```

    y = -(distance + this.connY1);

    var gradientHeight = y - this.connY1;

    ```

    ```


    Our second y position is determined by adding the distance to the initial y position.
    We make this value negative as well, since the second corner of our connector
    is above the first corner.


    gradientHeight is then easily calculated by finding the difference of our first
    and second y values. This will be the total height of our gradient.


    Let''s create the gradient now with the following code, which should directly
    follow the previous lines:


    ```

    ```

    var colors = [this.node.col.connector,

    this.parent.node.col.connector];

    var alphas = [100, 100];

    var ratios = [70, 220];

    var matrix = {matrixType:"box",

    x:this.connX1, y:this.connY1, w:50,

    h:gradientHeight, r:pi/2};

    ```

    ```


    ```

    ```

    this.connector.beginGradientFill("linear",

    colors, alphas, ratios, matrix);

    ```

    ```


    beginGradientFill takes a number of parameters. First, we send the gradient type,
    which in our case is "linear" (you can also use "radial"). Next, we send three
    arrays of values. The colors array holds the colors of our node and parent node
    and the alphas array holds each color''s opacity. The ratios array is the location
    on the gradient where each specified color is at 100%. These values will be between
    0 and 255 (a hexidecimal percentage). I have placed the values to be 100% at 70
    for the node''s color and at 220 for the parent node''s color. This will mean
    that the gradient will actually only occur between these two values, which is
    near the middle of the connector.


    Finally, the matrix is an object containing a number of properties we need to
    send the beginGradientFill method. matrixType will always be box for this method
    of gradient (the alternative method to create a gradient would be a whole other
    lesson), the x and y are the starting point of the gradient in relation to the
    registration point of the movie clip (which we set at our connector''s first corner),
    the w and h are the width and height of our gradient (the width makes little difference
    for the linear gradient we are creating), and r is the radians we wish to rotate
    the gradient at, which I set to 90 degrees to turn the gradient onto its side.


    Wow! That''s some method! But when it''s all over and done we get a terrific effect.
    Speaking of all over and done, let''s finish up this drawConnector method so we
    can see it!


    The final lines draw the sides to our connector:


    ```

    ```

    this.connector.curveTo(-10, -distance*.5,

    this.connX1, y);

    this.connector.lineTo(this.connX2, y);

    this.connector.curveTo(10, -distance*

    .5, this.connX2, this.connY2);

    this.connector.endFill();

    }

    ```

    ```'
