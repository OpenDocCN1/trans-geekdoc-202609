- pgno: 119
  md: "# Importing and parsing the XML\n\nI started by creating a new movie, with\
    \ a white background. I set the stage dimensions to 750 pixels wide by 400 pixels\
    \ high, and the frame rate to 31 fps. The background colour is dark gray (#333333).\n\
    \nI then began to place the code in the first frame of the timeline.\n\nBefore\
    \ doing anything else, add this line of code to turn anti-aliasing off:\n\n```\n\
    _quality=\"LOW\"\n```\n\nThis makes things perform better and I prefer the look\
    \ of the lines without anti-aliasing.\n\nNow we can begin with the code proper.\
    \ First of all I created a constructor for a spinnerNav object, which would bring\
    \ in the XML, parse it and then create the first of our clusters:\n\n```\nfunction\
    \ spinnerNav() {\n    this.init()\n}\n\nspinnerNav.prototype = new MovieClip()\n\
    Object.registerClass(\"spinnerNavSymbol\", spinnerNav)\n```\n\nThis code makes\
    \ spinnerNav inherit from the movie clip object and then associates it with spinnerNavSymbol.\
    \ When an instance of spinnerNavSymbol is attached to the stage, it will automatically\
    \ become an instance of the spinnerNav class. At this point I also created a new\
    \ movie clip symbol, setting the linkage to export for ActionScript and giving\
    \ it the linkage ID spinnerNavSymbol. We'll just have this clip in the library,\
    \ as we'll be attaching it dynamically.\n\nI then added this code to create a\
    \ new instance of spinnerNav:\n\n```\nvar obj={\n    filename:\"structure.xml\"\
    ,\n    clusterRadius:100,\n    separator:210\n}\n\n_root.attachMovie(\"spinnerNavSymbol\"\
    ,\"spinnerNav\",1,obj)\n```"
  merge: -1
  img_proc: true
- pgno: 120
  md: "Here I create a generic object to pass to the spinnerNav as it is created.\
    \ First is the filename for the XML document I'm using. Then I have two other\
    \ parameters, the first of which, clusterRadius, is the radius of any particular\
    \ cluster, and the second, separator, is the distance between any two open clusters.\
    \ When the spinnerNav is created using attachMovie, obj is passed to it and all\
    \ of the values inside obj are copied into it.\n\nNow we continue with the methods\
    \ for our spinnerNav class. These methods will be placed after the Object.registerClass\
    \ line above. You may have noticed that in the constructor I created above, an\
    \ init method is called. That method will call another method, importXml:\n\n\
    ```\nspinnerNav.prototype.init = function() {\n    this.outputObject = {}\n  \
    \  this.importXml(this.fileName)\n}\n```\n\nAs well as calling importXml, the\
    \ init method also creates a generic object, outputObject, which will hold the\
    \ object structure created when parsing the XML. Next I created the importXml\
    \ method, which goes directly after the code above. It creates a new XML object,\
    \ called myStructure, and then assigns it various properties and methods:\n\n\
    ```\nspinnerNav.prototype.importXml = function(filename) {\n    this.myStructure\
    \ = new XML()\n    this.myStructure.ignoreWhite = true\n    this.myStructure.onLoad\
    \ = this.triggerParse\n    this.myStructure.parseNode = this.parseNode\n    this.myStructure.parent\
    \ = this\n    this.myStructure.load(this.filename)\n}\n```\n\nThe first property\
    \ is ignoreWhite, which will make the XML object ignore any white space, or formatting,\
    \ that might be present in our XML document. Then the triggerParse method is assigned\
    \ to the XML object's onLoad handler. This will be called when the XML object\
    \ has finished loading. The next method, parseNode, will be called to parse each\
    \ individual node and give it a parent property so that it knows where it has\
    \ been created and can send a message back when it has finished parsing. Finally\
    \ it calls the load method of the myStructure object, passing it the filename."
  merge: -1
  img_proc: true
- pgno: 121
  md: 'The triggerParse method that comes next is called when the XML object has loaded:
    .


    ```

    spinnerNav.prototype.triggerParse=function(success) {

    if(success) {

    this.parseNode(this.firstChild,this.parent.outputObject)

    this.parent.create()

    }

    }

    ```


    As it is assigned to the onLoad handler it will be passed a parameter which will
    be true if the XML has loaded and false if not. This parameter is checked to see
    if it is true before proceeding. Although I didn’t actually choose to, I could
    have displayed a message if the XML fails to load by adding in an else statement.


    Once the file has loaded successfully we call the parseNode method, passing it
    the firstChild of the XML document (the directors node in our case) and the name
    of the object we are putting the results of the parse into. Here’s the completed
    method, first storing the category name and then looping through the children,
    creating objects for them and storing them in kidsArray.


    ```

    spinnerNav.prototype.parseNode=function(xmlNode, currentObj) {

    currentObj.catName = xmlNode.attributes.name

    if(xmlNode.hasChildNodes()) {

    currentObj.kidsArray = []

    for(var i =0;i<xmlNode.childNodes.length;i++) {

    currentObj.kidsArray[i]={}

    this.parseNode(xmlNode.childNodes[i] , currentObj.kidsArray[i])

    }

    }

    }

    ```


    The parseNode method is what’s known as a **recursive** function. What this basically
    means is that it’s a function that calls itself. In practical terms what it does
    is to look at the children of the node it is parsing and then calls the same method
    for the children and so on and so forth. When it hits a node that has no children,
    it will slip back up to the parent and carry on. It can be slightly difficult
    to conceptualize what is happening here, so stepping through the process can help.
    Here’s a small XML document:


    ```

    <0>

    <0_0>

    </0_0>

    <0_1>

    <0_1_0/>

    <0_1_1/>

    </0_1>

    <0_2>

    </0_2>

    </0>

    ```'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'Now here''s how the recursive function would step through it. You can see how
    it''s moving top to bottom through all of the nodes in the structure.


    ```

    Parse node 0

    Node 0 has 3 children.

    Check node 0_0, the first child of node 0.

    Node 0_0 has no children. Slip back to node 0.

    Check node 0_1, the second child of node 0.

    Node 0_1 has two children.

    Check node 0_1_0, the first child of node 0_1.

    Node 0_1_0 has no children, slip back to node 0_1

    Check node 0_1_1, the second child of node 0_1.

    Node 0_1_1 has no children. Slip back to node 0_1

    Node 0_1 has no more children. Slip back to node 0

    Check node 0_2, the third child of node 0.

    Node 0_2 has no children. Slip back to node 0

    Node 0 has no more children. End parse.

    ```


    The benefit of using a recursive function is that it will cope with whatever we
    throw at it. We can use it to take whatever XML structure we want and parse it
    into an object structure containing all the information we need. One thing to
    be aware of whenever parsing XML like this is that the activity is all taking
    place in one frame. Flash will remain stalled on the frame until the loop finishes
    executing. With large data structures this can become a problem and is solved
    by breaking up the parsing across frames, but for our purposes here this is fine.


    So basically each time the parseNode method is called we have to do a number of
    things:


    +   - Retrieve the category name from the XML node and store it in the object
    we have been passed.

    +   - Check if the XML node has any children.

    +   - If it does have children, we create a new array in the object to store them
    in.

    +   - We then loop through the children.

    +   - For each child, we create a blank object to store the information in, and
    place it within the array of children.

    +   - We then call parseNode for the next node in the XML structure, passing it
    both this node and the new object we have created to store the results in.


    One thing to note is that I''ve used var i in the loop. The var is very important
    here as it means that each time the method is called, i is a local value and is
    not shared between calls. This serves as a marker so that after the method has
    been called for one of the childNodes, the value of i is still intact and the
    loop carries on from where it left off.'
  merge: -1
  img_proc: true
- pgno: 123
  md: "After the parse is complete we end up with an object structure containing all\
    \ the information we need – the name of each category and which categories are\
    \ within each other. For example with our original XML document, outputObject\
    \ has the catName directors, and an array containing five objects. These five\
    \ objects have their own catNames – Carpenter, Romero, Argento, Verhoeven and\
    \ Fuller. They have their own arrays of children.\n\nIf you run your movie at\
    \ this point, or spinner001.fla from the download files, and list variables (Debug\
    \ > List Variables) you’ll see the structure of nested objects that we’ve created.\n\
    \n# Creating the clusters\n\nNow that I have all of the pertinent information\
    \ in a convenient format, I need to embark on displaying it.\n\nAfter the parse\
    \ completes I call a create method. This deletes the XML from the memory, and\
    \ then attaches an instance of a new class clusterNode. It will finally call the\
    \ addKids method of the clusterNode, which will create the children of the node\
    \ and display them in a circle around the node.\n\n```\nspinnerNav.prototype.create\
    \ = function() {\n\tdelete this.myStructure\n\tvar obj = {\n\t\tmyObject:this.outputObject,\n\
    \t\t_x:120,\n\t\t_y:200,\n\t\tseparator:this.separator,\n\t\tclusterRadius:this.clusterRadius\n\
    \t}\n\tvar base = this.attachMovie(\"nodeSymbol\",\"baseNode\",1,obj)\n\tbase.addKids()\n\
    }\n```\n\nAs we attach the nodeSymbol we pass it a number of parameters. Firstly\
    \ we pass this.outputObject, which will be placed inside a property myObject.\
    \ The new node will use this to ascertain how many children it has. We also pass\
    \ it an _x and _y position, the values for the radius of each cluster, and the\
    \ distance between each cluster that we passed to the spinnerNav earlier."
  merge: -1
  img_proc: true
- pgno: 124
  md: "Next we need to create the clusterNode constructor, and set it up to inherit\
    \ from the MovieClip object. This is much the same as earlier:\n\n```\n```actionscript\n\
    function clusterNode() {\n this.init()\n}\nclusterNode.prototype = new MovieClip()\n\
    Object.registerClass(\"nodeSymbol\",clusterNode)\n```\n```\n\nWe also need to\
    \ create a new movie clip, nodeSymbol, which will be attached as an instance of\
    \ our class. For now, you can just draw a small square in it to represent the\
    \ node. Later we'll look at how to display the graphic and text for each node,\
    \ but first of all we're going to get the nodes plotted correctly.\n\nFirst we\
    \ create the init function:\n\n```\n```actionscript\nclusterNode.prototype.init\
    \ = function() {\n this.catName = this.myObject.catName\n this.kidsArray = this.myObject.kidsArray\n\
    \ this.segment = (2*Math.PI)/this.kidsArray.length\n this.kidMc = []\n}\n```\n\
    ```\n\nIn this function we retrieve some data from the object passed to it to\
    \ allow easier access to the array of children and the category name. We create\
    \ a property segment, which refers to the number of radians between each category\
    \ plotted around the node. A radian is basically an alternative way of measuring\
    \ angles. When Flash computes the cosine and sine of angles it uses radians, and\
    \ so it's easier to just use radians than working in degrees and converting back\
    \ and forth. A circle contains 2 times pi radians, so to calculate the angle between\
    \ n nodes around the edge of a circle we use 2*pi / n. Finally we create an array\
    \ kidMc which will contain the movie clips which instantiate each clusterNode\
    \ that we create.\n\nNow we write the addKids method, which will create all of\
    \ the children of the current node. In a moment we'll adjust this so that the\
    \ new nodes animate into position, but for now we'll just position them directly.\n\
    \n```\n```actionscript\nclusterNode.prototype.addKids = function() {\n for(var\
    \ i =0;i<this.kidsArray.length;i++) {\n var obj = {\n _x:Math.cos(this.segment\
    \ * i)*this.clusterRadius,\n _y:Math.sin(this.segment * i)*this.clusterRadius\n\
    \ }\n this.attachMovie(\"nodeSymbol\",\"kid\"+i,i,obj)\n }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 125
  md: "If you run the code like that, you'll see that it draws the main node in the\
    \ center, surrounded by five child nodes. We've plotted the nodes around the edge\
    \ by using basic trigonometry. Each point is positioned on the edge of a circle\
    \ with the radius clusterRadius at the angle this.segment * i. So on the x-axis\
    \ we take the cosine of the angle and multiply it by the radius, and on the y-axis\
    \ we do the same using the sine of the angle. The new movie clips are attached\
    \ within the original node, so all of the co-ordinates are relative to the center\
    \ point of the original node.\n\nWhile this does get the job done, it's not very\
    \ visually appealing. What we want instead is to create the nodes one at a time\
    \ and have them move to their target position around the edge of the original\
    \ node. We're going to need to write some more methods to do this.\n\n+   addKids\
    \ – triggers the addition and initializes counter variables. Informs its parent\
    \ node that it has opened. Sets the onEnterFrame handler to addNextKid.\n\n+ \
    \  addNextKid – if it has not already created all of its children it calls createChild\
    \ to create the next child.\n\n+   createChild – creates a new clusterNode object,\
    \ passing it all the relevant data. Calls the moveToPosition method for this new\
    \ node, passing the target radius to moveto.\n\n+   moveToPosition – stores the\
    \ target radius. Sets the onEnterFrame handler to rotateMe.\n\n+   rotateMe –\
    \ calls moveToTarget each frame. If moveToTarget returns true clears the onEnterFrame\
    \ handler.\n\n+   moveToTarget – gradually shifts the node's radian and radius\
    \ properties until they equal the target values, at the same time shifting the\
    \ node's position on stage. Returns true when it has reached the target.\n\nThat\
    \ looks like quite a lot of methods, but each one is a necessary part of the mechanism.\
    \ Generally we have one method to initiate an action, and then another method\
    \ that is called every frame to carry out that action over time and create the\
    \ motion, the animation.\n\nFirst of all we have the addKids method, new and improved\
    \ to replace the one we wrote before:\n\n```\nclusterNode.prototype.addKids =\
    \ function() {\n    this.kidCount = 0\n    this._parent.kidOpen = this\n    this.opening\
    \ = true\n    this.onEnterFrame = this.addNextKid\n}\n```"
  merge: -1
  img_proc: true
- pgno: 126
  md: "This is fairly simple – we're really just initializing a number of things.\
    \ We have `kidCount`, which is the number of children that have been created so\
    \ far, `kidOpen`, which is set in the `clusterNode`'s parent to indicate that\
    \ one of its children has sprouted its own children, and `opening`, which indicates\
    \ that the node is busy creating its children. The importance of these latter\
    \ two properties will become apparent later on, when we can click on nodes to\
    \ open them – we will be performing different actions depending on what the state\
    \ of the parent is. For example we don't want to be able to open a child node\
    \ until its parent has opened all of the node's siblings. Finally we assign `addNextKid`\
    \ to the `onEnterFrame` handler.\n\nThis method will move on to the next child\
    \ and create it:\n\n```\nclusterNode.prototype.addNextKid = function() {\n  this.g++\n\
    \  if(this.g%2 ==0){\n    if(this.kidCount<this.kidsArray.length){\n      this.createChild(this.kidCount)\n\
    \      this.kidCount++\n    }else{\n      delete this.onEnterFrame\n      this.opening\
    \ = false\n    }\n  }\n}\n```\n\nAll of the actions here are wrapped inside an\
    \ if statement. What we're doing is incrementing a counter variable, g. If g is\
    \ divisible by 2 we create the next child. This is just to create a slight delay\
    \ between the creation of each node, every other frame rather than every frame,\
    \ and is purely for aesthetic effect. We then check whether we have created all\
    \ of the child nodes, comparing `kidCount` with the length of `kidsArray`. If\
    \ we still have children to create we call `createChild`, if not we delete the\
    \ `onEnterFrame` handler and set `opening` to false.\n\nThen I created the `createChild`\
    \ method, which sets up a number of properties for the new node and then creates\
    \ it. When it has been created we call its `moveToPosition` method to send it\
    \ to the correct position:\n\n```\nclusterNode.prototype.createChild = function(num)\
    \ {\n  var obj = {\n    myObject : this.kidsArray[num],\n    separator : this.separator,\n\
    \    clusterRadius : this.clusterRadius,\n    kidNum : num,\n    radianTarg :\
    \ num * this.segment\n  }\n  var nooKid = this.attachMovie(\"nodeSymbol\",\"kid\"\
    +num,num+1,obj)\n  this.kidMcS[num]=nooKid\n  nooKid.moveToPosition(this.clusterRadius)\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 127
  md: "We're using the value num, which was the value of kidCount passed to the method,\
    \ to specify which entry in kidsArray contains the correct information for the\
    \ new node and also to calculate its target radian value, radianTarg. Once we've\
    \ attached the new clusterNode movie clip we put a reference to it, nooKid, in\
    \ the current node's kidMcs array. We'll be using this later. The moveToPosition\
    \ method is very simple:\n\n```\nclusterNode.prototype.moveToPosition = function(radius)\
    \ {\n    this.radiusTarg = radius\n    this.onEnterFrame = this.rotateMe.\n}\n\
    ```\n\nAll we are doing here is storing the radius value passed to it as radiusTarg\
    \ and then setting the onEnterFrame handler to rotateMe. It may seem that there's\
    \ not a lot of point storing the radius as this will always be the same value,\
    \ but we'll be using this later for when we want a node to shoot out and form\
    \ the hub of its own cluster. We'll be able to re-use the methods we have already\
    \ written, simply supplying a different radius value.\n\nSo now the new node will\
    \ call rotateMe every frame. This is another simple function:\n\n```\nclusterNode.prototype.rotateMe\
    \ = function() {\n    if(this.moveToTarget(1)) {\n        delete this.onEnterFrame\n\
    \    }\n}\n```\n\nIt will basically call moveToTarget until the node reaches the\
    \ target radian and radius values. The method call is in an if statement. What\
    \ this means is that if the method returns true then the actions within the if\
    \ statement will be executed, if not they won't. So when moveToTarget returns\
    \ true, the onEnterFrame handler will be deleted and the movie clip will stop\
    \ moving.\n\nYou might have noticed the value 1 is passed to the moveToTarget\
    \ method. This value is for tolerance. It represents the distance that the movie\
    \ clip must be from its target before it snaps to it and the method returns true.\
    \ This, again, is something we'll be using later, as we will not need as much\
    \ accuracy when the clusters close as when they open."
  merge: -1
  img_proc: true
- pgno: 128
  md: 'Now for the method that actually executes the motion:


    ```

    clusterNode.prototype.moveToTarget = function(tolerance) {

    this.radian += (this.radianTarg - this.radian)/3

    this.radius += (this.radiusTarg - this.radius)/6


    this.xt = Math.cos(this.radian) * this.radius

    this.yt = Math.sin(this.radian) * this.radius


    this.x += (this.xt - this.x)/6

    this.y += (this.yt - this.y)/6

    this._x = Math.round(this.x)

    this._y = Math.round(this.y)


    if(Math.abs(this.xt-this.x)<tolerance & Math.abs(this.yt-this.y)<tolerance) {

    this.radian = this.radianTarg

    this.radius = this.radiusTarg

    this.x = Math.cos(this.radian) * this.radius

    this.y = Math.sin(this.radian) * this.radius

    this._x = Math.round(this.x)

    this._y = Math.round(this.y)

    return true

    }

    }

    ```


    You could broadly see this method as containing four sections. Firstly we bring
    the node''s `radian` and radius values towards their target values by adding a
    fraction of the gap between them. We then calculate x and y targets for the clip
    based on these values. Next we move the node''s x and y properties towards those
    values in the same section. The final section of the method checks whether the
    x and y values are within the tolerance range of `xt` and `yt` – if they are,
    then the method returns `true`.


    Note that rather than working directly with `_x` and `_y` movie clip properties,
    we''re instead using x and y and then setting `_x` and `_y` as the rounded value
    of these properties. This is basically to deal with the problem that Flash has
    dealing with pixel fonts. If movie clips containing text fields are not placed
    on absolute pixels then the fonts blur, so we have to make sure that the `_x`
    and `_y` values we set are whole numbers. You might say that x and y are the **true**
    position of each node, whereas `_x` and `_y` are the **rendered** position of
    each node.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '![](img/50202c17d5022233f3e3ec60560e35aa_129_0.png)


    We use Math.abs to convert the distance, which may be positive or negative, into
    a positive (absolute) number to allow proper comparison. It should be noted that
    we could also implement different kinds of motion by altering this method. One
    could change it so that the nodes move to their targets with elasticity, or so
    that it uses the values determined from the radian and radius as the points to
    plot, rather than targets to move to. It would also be possible to have this method
    accept extra parameters to change the speed of motion under certain circumstances.


    If you test this so far, (it''s included in the download files as spinner002.fla),
    you should see the five children of the first node spiraling out from the center
    into position with a slight gap between them.


    ![](img/50202c17d5022233f3e3ec60560e35aa_129_1.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_129_2.png)


    The next stage will be to sort out the graphics for each node before moving on
    to the interactive element.


    ![](img/50202c17d5022233f3e3ec60560e35aa_129_3.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_129_4.png)'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# Drawing the node graphic


    For the node graphic we''re going to create a new movie clip, which we''ll call
    bg. We could use the drawing API to create this graphic, but I think it''s generally
    quicker to make changes to graphics and try stuff out within the authoring environment.
    Within bg we''re going to have three separate movie clips, left, right and mid.
    We''ll be able to resize the graphic without distortion by stretching the mid
    movie clip and then positioning the right movie clip at its right hand edge.


    So we have three new movie clips containing the following graphics:


    +   left

    +   - black rectangle, 1x19 px, placed with its top left at 0,0.

    +   - black square, 1x1 px, at 1,0.

    +   - pale green rectangle (#F1F4F0), 1x17 px, at 1,1.

    +   - black square, 1x1 px, at 1,18.


    +   right

    +   - black rectangle, 1x19 px, placed with its top left at 1,0.

    +   - black square, 1x1px, at 0,0.

    +   - mid green rectangle, (#CFDADC) 1x17 px, at 0,1.

    +   - black square, 1x1 px, at 0,18.


    +   mid

    +   - black rectangle, 50x1 px, at 0,0.

    +   - pale green rectangle(#F1F4F0), 50x1 px, at 0,1.

    +   - white rectangle, 50x15 px at 0,2.

    +   - mid green rectangle (#CFDADC), 50x1 px, at 0,17.

    +   - black rectangle, 50x1 px at 0,18.


    ![](img/50202c17d5022233f3e3ec60560e35aa_130_0.png)'
  merge: -1
  img_proc: true
- pgno: 131
  md: "Place these three movie clips inside bg and give them the instance names left,\
    \ mid and right, You can place them adjoining each other at 0,0 if you like, but\
    \ we're going to position them dynamically anyway so it doesn't really matter.\n\
    \nNext add another layer inside bg and create a text field, placing it at (0,0).\
    \ I've used a pixel font from minilm.com. set to 8pt. If you want to use a device\
    \ font then you should make sure that the font outlines are not embedded (Click\
    \ on the Character button and choose Embed Font Outlines For No Characters) and\
    \ set it to 9pt. An embedded pixel font is probably the best option, as motion\
    \ tends to suffer a little when using a device font. Set the font to dynamic text\
    \ and give it the instance name tf. Finally place an instance of the bg movie\
    \ clip inside nodeSymbol and name the instance bg.\n\nWe're going to create a\
    \ new draw method, which will put the category name inside the text field and\
    \ then calculate the width of the text to determine the size and positioning of\
    \ the background pieces. The draw method will be called from the init method:\n\
    \n```\nclusterNode.prototype.init = function() {\n    this.catName = this.myObject.catName\n\
    \    this.kidsArray = this.myObject.kidsArray\n    this.segment = (2*Math.PI)/this.kidsArray.length\n\
    \    this.kidMCs = []\n    this.draw()\n}\n```\n\nHere's the draw method, I'll\
    \ go through it section by section in a moment:\n\n```\nclusterNode.prototype.draw=function()\
    \ {\n    this.bg.tf.autoSize = true\n    this.bg.tf.text = this.catName\n    var\
    \ wid = this.bg.tf.textWidth + 10\n    this.bg.tf._x=this.bg.left._width + 2\n\
    \    this.bg.left._x = 0\n    this.bg.left._y = 0\n    this.bg.mid._x =this.bg.left._width\n\
    \    this.bg.mid._y = 0\n    this.bg.mid._width = wid - (this.bg.left._width+this.bg.right._width)\n\
    \    this.bg.right._x = wid - this.bg.right._width\n    this.bg.right._y = 0\n\
    \    this.bg._x = Math.round(wid/2)*-1\n    this.bg._y = Math.round(this.bg.mid._height/2)*-1\n\
    \    this.bg.swapDepths(1000)\n}\n```"
  merge: -1
  img_proc: true
- pgno: 132
  md: 'So first of all I set the text field''s `autoSize` to `true` so it will expand
    to accommodate any text we assign to it.


    I then set the text property to `this.catName`, in order to make sure that the
    text field is filled with the name of the category.


    I set a local variable `wid` to the width of the text in the text field plus 10
    extra pixels as a buffer around the edge of the text.


    I then position the text field just to the right of the `left` graphic.


    Next I position and scale the left, mid and right graphics based on the `wid`
    variable


    +   - The left graphic goes at (0,0)

    +   - The mid graphic is placed at the right edge of the left graphic and scaled
    to take up the whole of `wid` minus the width of the left and right graphics.

    +   - The right graphic is placed on the right hand side of the mid graphic, at
    `wid` minus its width.


    Then I position `bg` itself so that it has its center at the node''s center point.
    Note that we''re using `Math.round` to ensure that it is on a whole pixel.


    Finally I use `swapDepths` to position the graphic in front of any child nodes
    created. This becomes important when we draw lines from the children to the parent,
    which we''ll cover next. Test this now, or look at `spinner003.fla` from the download
    files, to see our node graphics display.


    ![](img/50202c17d5022233f3e3ec60560e35aa_132_0.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_132_1.png)'
  merge: -1
  img_proc: true
- pgno: 133
  md: "# Connecting lines\n\nDrawing lines connecting the children to their parents\
    \ is an important visual cue to signify their relationship and is pretty simple\
    \ to put in place. We're going to create a new method connectToParent to accomplish\
    \ this. This method needs to be called whenever a node moves and so a call to\
    \ it should be placed in the moveToTarget method:\n\n```\nclusterNode.prototype.moveToTarget\
    \ =\n    function(tolerance) {\n        this.radian += (this.radianTarg -\n  \
    \          this.radian)/3\n        this.radius += (this.radiusTarg -\n       \
    \     this.radius)/6\n\n        this.xt = Math.cos(this.radian) *\n          \
    \  this.radius\n        this.yt = Math.sin(this.radian) *\n            this.radius\n\
    \        this.x += (this.xt - this.x)/6\n        this.y += (this.yt - this.y)/6\n\
    \        this._x = Math.round(this.x)\n        this._y = Math.round(this.y)\n\
    \        this.connectToParent()\n\n        if(Math.abs(this.xt-this.x)<tolerance\n\
    \            & Math.abs(this.yt-this.y)<tolerance) {\n            this.radian\
    \ =this.radianTarg\n            this.radius =this.radiusTarg\n            this.x\
    \ = Math.cos(this.radian) *\n                this.radius\n            this.y =\
    \ Math.sin(this.radian) *\n                this.radius\n            this._x =\
    \ Math.round(this.x)\n            this._y = Math.round(this.y)\n            this.connectToParent()\n\
    \            return true\n        }\n    }\n```\n\nAll that connectToParent needs\
    \ to do is clear any previous lines, set a lineStyle and then draw a line. We're\
    \ using a fat green line:\n\n```\nclusterNode.prototype.connectToParent =\n  \
    \  function() {\n        this.clear()\n        this.moveTo(0, 0)\n        this.lineStyle(6,\
    \ 0xbac9b8)\n        this.lineTo(-this._x, -this._y)\n    }\n```\n\nSo first we\
    \ clear all lines, then we move the drawing position to 0,0 and then set a lineStyle.\
    \ We then move to the inverse of the node's current x and y position. This is\
    \ basically because if the node is at (100,100), that is 100 to the right of and\
    \ below the parent, then the parent is 100 to the left of and above the child,\
    \ that is at (-100,-100). If you run that now, or test spinner004.fla from the\
    \ download files, you'll see lines attaching each node to its parent. If you remove\
    \ the clear statement, you actually get quite an interesting effect with the lines\
    \ revealing the trajectory of the motion. If you then remove the moveTo statement\
    \ you get a slightly different effect.\n\n![](img/50202c17d5022233f3e3ec60560e35aa_133_0.png)\n\
    \n![](img/50202c17d5022233f3e3ec60560e35aa_133_1.png)"
  merge: -1
  img_proc: true
- pgno: 134
  md: "# Building in interaction\n\nNow that we have the basic mechanism for opening\
    \ the children of a node and displaying with the correct graphics we can start\
    \ on the interaction. The basics of this will be fairly simple. When the user\
    \ clicks on a node, all of the nodes will rotate around their hub and the selected\
    \ node will shoot out to the right. It will become more complicated when we have\
    \ to deal with closing nodes, and in particular having to close one node before\
    \ opening another, but first we'll just deal with the opening mechanism.\n\nThe\
    \ first thing we need to do is add a button action to each node. We'll do this\
    \ in the init method:\n\n```\nclusterNode.prototype.init = function() {\n    this.catName\
    \ = this.myObject.catName\n    this.kidsArray = this.myObject.kidsArray\n    this.segment\
    \ =\n    (2*Math.PI)/this.kidsArray.length\n    this.kidMcs = []\n    this.draw()\n\
    \    this.bg.onPress = function() {\n        this._parent.clickMe()\n    }\n}\n\
    ```\n\nWhen bg is clicked it calls clickMe in its parent, the node itself. For\
    \ now this method will just call another method, but we'll be using it later to\
    \ check a couple of conditions before acting:\n\n```\nclusterNode.prototype.clickMe=function()\
    \ {\n    this._parent.openChild(this)\n}\n```\n\nSo this calls the openChild method\
    \ in the node's parent, passing the name of the movie clip as an argument. In\
    \ the openChild method we first check if the argument already has one of its children\
    \ open. If it does we'll do nothing (for now). If not, we have to calculate the\
    \ number of radians that the clicked node will have to rotate to bring it to the\
    \ right hand side and adjust the radian targets of all of the child nodes accordingly.\
    \ Once the radian targets have been adjusted we call moveToPosition for all of\
    \ the child nodes. Note that the movie clip that was clicked, mc, passes separator\
    \ as an argument, the variable we defined at the start for the distance between\
    \ each cluster. This means that the node clicked will move further out to the\
    \ right than the other nodes.\n\n```\nclusterNode.prototype.openChild=function\
    \ (mc) {\n    if(this.kidOpen) {\n        //close kids first\n    }else{\n   \
    \     this.redoRadians (mc)\n        for(var i in this.kidMcs) {\n           \
    \ if(this.kidMcs[i]==mc) {\n                this.kidMcs[i].moveToPosition\n  \
    \              (this.separator)\n            }else{\n                this.kidMcs[i].moveToPosition\n\
    \                (this.clusterRadius)\n            }\n        }\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 135
  md: 'To calculate the number of radians that we need to rotate the nodes, we call
    another method, redoRadians. What this method does is calculates how far the clicked
    node''s radian target is from the right hand side and then increments all of the
    nodes'' targets by the same amount.


    ```

    clusterNode.prototype.redoRadians=function

    (mc) {

    var nearestHorizontal = Math.round

    (mc.radianTarg/(Math.PI*2))*Math.PI*2.

    var difference = nearestHorizontal -

    mc.radianTarg

    for(var i in this.kidMcS) {

    this.kidMcS[i].radianTarg +=difference

    }

    }

    ```


    The way the method is set up it will find the nearest horizontal – if the nearest
    horizontal is clockwise all the nodes will rotate clockwise, otherwise they will
    rotate counter-clockwise. Any radian on the right hand side will be a multiple
    of 2π, such as 4π, 8π, etc. If the clip''s current target is 4.5π then the closest
    horizontal would be 4π, if it''s 5.4π then the closest horizontal is 6π. So to
    calculate what the nearest horizontal for the clicked node is, we divide the current
    radian target by 2π, round the number, and then multiply by 2π.


    Once we''ve calculated this figure, we loop through all of the current node''s
    children and add that amount to their radian target (radianTarg) so that all the
    nodes are rotated by the same amount.


    If you run the code like that, or test spinner005.fla, you''ll see that as you
    click any node it will rotate its parent node, shooting out to the right, and
    then stop.


    ![](img/50202c17d5022233f3e3ec60560e35aa_135_0.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_135_1.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_135_2.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_135_3.png)'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'We can add a little extra code to make the sub-node open once it has reached
    its target. All we need to do to achieve this is add a few extra lines to the
    rotateMe method that controls the motion. Basically we just add a conditional
    which, when the node reaches its target, checks whether its target radius is equivalent
    to separator which indicates that it has been opened. If so, we call the node''s
    addKids method. We could add a separate property to indicate that the clip is
    sprouting, but it''s probably sufficient just to use the radius value for now:


    ```

    clusterNode.prototype.rotateMe=

    => function() {

    if(this.moveToTarget(1)) {

    delete this.onEnterFrame

    if(this.radiusTarg==this.separator){

    this.addKids()

    }

    }

    }

    ```


    If you run the code here, or check out spinner006.fla, you''ll see that once each
    node has sprouted to the right it then opens its own children. You can navigate
    all the way down the tree doing this, but at the moment it''s impossible to go
    back up. This is because the kidOpen property is set in the parent as soon as
    one of its child nodes opens its own children. Next we''ll work on making the
    tree close as well as open.


    ![](img/50202c17d5022233f3e3ec60560e35aa_136_0.png)'
  merge: -1
  img_proc: true
- pgno: 137
  md: "# Queuing actions\n\nThe next stage in building this interface is to allow\
    \ the user to move back up the tree to take an alternate path, to open a different\
    \ set of branches. This complicates matters somewhat. So far we have been able\
    \ to call open and have that branch open. What we need to implement here is a\
    \ mechanism whereby one clicks a node and it then checks if any of its siblings\
    \ are open. If they are open, then they must first be closed, and only when they\
    \ are closed can the selected node open. This is complicated further by the fact\
    \ that if the user has traversed far down the tree and then clicks to open a different\
    \ top-level category, the interface might have to close two or three clusters\
    \ before it can open the new top-level category.\n\nTo circumvent this situation\
    \ we have to build in a series of checks. When the user clicks to open a category\
    \ that already has one of its siblings open, we will have to first call a method\
    \ closeKids that will close the open node. We will also queue an action in the\
    \ parent node. When the child node has removed all of its children it will then\
    \ call this method that's waiting in the parent. The same thing will apply when\
    \ calling the closeKids method. If the child that is open has one of its own children\
    \ open then that will have to be closed first, and so on until you reach a node\
    \ with no open children.\n\nFirst of all then, we need to make modifications to\
    \ the openChild method:\n\n```\nclusterNode.prototype.openChild=function(mc) {\n\
    \ if(this.kidOpen) {\n this.setWait(this,\"openChild*\",mc)\n this.kidOpen.closeKids()\n\
    \ }else{\n this.redoRadians(mc)\n for(var i in this.kidMCs) {\n if(this.kidMCs[i]==mc)\
    \ {\n this.kidMCs[i].moveToPosition\n (this.separator)\n }else{\n this.kidMCs[i].moveToPosition\n\
    \ (this.clusterRadius)\n }\n }\n }\n}\n```\n\nNow when a node is told to open\
    \ one of its children and it already has a child open, it will do two things.\
    \ First of all it calls a setWait method, passing it three arguments. These correspond\
    \ to an object, a method name and a parameter to pass. We'll write this method\
    \ in a moment. After it has stored these, we then call the closeKids method in\
    \ the child that is already open.\n\n![](img/50202c17d5022233f3e3ec60560e35aa_137_0.png)"
  merge: -1
  img_proc: true
- pgno: 138
  md: "The setWait method just stores the arguments that it has been passed for later\
    \ use:\n\n```\nclusterNode.prototype.setWait =\n➤ function(obj,method,args) {\n\
    \    this.waitObj = obj\n    this.waitMethod = method\n    this.waitArgs = args\n\
    }\n```\n\nTo go with this we also create a checkWait method. When a node closes,\
    \ it will call this method in its parent. It basically checks if it has a method\
    \ waiting to be executed, a waitMethod, calls it and then deletes the method,\
    \ along with its corresponding object and argument:\n\n```\nclusterNode.prototype.checkWait\
    \ =\n➤ function() {\n    this.waitObj[this.waitMethod]\n    (this.waitArgs)\n\
    \    delete this.waitObj\n    delete this.waitMethod\n    delete this.waitArgs\n\
    }\n```\n\nThe procedure for closing a node's children will work in a similar way\
    \ to the addKids method we created earlier, in that it is one method that calls\
    \ a series of other methods:\n\n+   closeKids – initiates the closing. Checks\
    \ if any of its children have sprouted their own children. If so, it calls closeKids\
    \ for that node. If not, it checks that it has kids and then sets onEnterFrame\
    \ to closeNextKid.\n\n+   closeNextKid – this method decrements a counter and\
    \ calls closeMe for the next child node.\n\n+   closeMe – sets new targets for\
    \ the radius and radians so that it will move back to its parent. Sets onEnterFrame\
    \ to goClose.\n\n+   goClose – decrements alpha. Moves node towards its parent.\
    \ Calls the parent's removeChild method when it is close enough.\n\n+   removeChild\
    \ – this method is passed a number and the node removes the child corresponding\
    \ to that entry in the array. It decrements its kidCount. When kidCount reaches\
    \ zero, all the nodes have been closed and it calls allClosed.\n\n+   allClosed\
    \ – deletes kidOpen in the node's parent. Calls the parent's checkWait method."
  merge: -1
  img_proc: true
- pgno: 139
  md: "# So to start with, we write the closeKids method:\n\n```\nclusterNode.prototype.closeKids\
    \ =\n  function() {\n    if(this.kidOpen) {\n      this.setWait(this,\"closeKids\"\
    )\n      this.kidOpen.closeKids()\n    }else{\n      if(this.kidCount == 0) {\n\
    \        this.allClosed()\n      }else{\n        this.removeCount = this.kidCount\n\
    \        this.onEnterFrame =\n          this.closeNextKid\n      }\n    }\n  }\n\
    ```\n\nAs you can see, the first conditional checks if any of its children has\
    \ children open. If so, it calls closeKids for that child and stores closeKids\
    \ as its own wait function. When its child has closed and removed its child nodes,\
    \ it will then close and remove its own child nodes.\n\nIf none of its children\
    \ has children open, we first check that the current node has children open, in\
    \ case we click in the gap between a node starting to open and actually creating\
    \ the movie clips. If it doesn't, we call allClosed straight away.\n\nIf the node\
    \ does have children open, and none of its children has children open, then we\
    \ can go ahead and close it, setting the remove counter to the value of kidCount\
    \ and assigning closeNextKid to the enterFrame handler.\n\nThe closeNextKid method\
    \ is quite simple. It just decrements removeCount and then calls the closeMe method\
    \ for the next node in its kidsArray. When removeCount is less than zero, it removes\
    \ the method from the enterFrame handler:\n\n```\nclusterNode.prototype.closeNextKid\
    \ =\n  function() {\n    this.removeCount--\n    this.kidMcs[this.removeCount].closeMe()\n\
    \    if(this.removeCount < 0) {\n      delete this.onEnterFrame\n    }\n  }\n\
    ```\n\nThe closeMe method will be called for each node to be closed. It basically\
    \ sets new targets for the node's radian and radius values.\n\n```\nclusterNode.prototype.closeMe\
    \ =\n  function() {\n    this.radianTarg += 3\n    this.radiusTarg = 0\n    this.onEnterFrame\
    \ = this.goClose\n  }\n```\n\n![](img/50202c17d5022233f3e3ec60560e35aa_139_0.png)\n\
    \n![](img/50202c17d5022233f3e3ec60560e35aa_139_1.png)\n\n![](img/50202c17d5022233f3e3ec60560e35aa_139_2.png)"
  merge: -1
  img_proc: true
- pgno: 140
  md: "Setting `radiusTarg` is self-explanatory, while we add three to the node's\
    \ `radianTarg` (roughly equivalent to 180 degrees) so that it rotates as it closes\
    \ – purely an aesthetic consideration.\n\nOnce we've set the new targets, we set\
    \ the `onEnterFrame` handler to `goClose` which will handle the actual closing:\n\
    \n```\n```\nclusterNode.prototype.goClose = function() {\n    this._alpha-=10\n\
    \    if(this.moveToTarget(5)||\n    this._alpha<=10)\n    this._parent.removeChild(this.kidNum)\n\
    }\n```\n```\n\nAs we close each node we also reduce the alpha, making the effect\
    \ slightly smoother. Next we call `moveToTarget` which handles the actual motion\
    \ as earlier. Note that now we're passing it a value of 5 for tolerance, which\
    \ means that it will be judged to have reached its target when it is within 5\
    \ pixels of it on the x and y axes. Once the node is either within 5 pixels of\
    \ its parent node or its alpha is below 10, we call the `removeChild` method in\
    \ the parent node, passing the current node's `kidNum`.\n\nThe `removeChild` method\
    \ is straightforward. We remove the child node's movie clip and delete the corresponding\
    \ entry in the `kidMCs` array. After that, we decrement the parent's `kidCount`\
    \ value. When this value has reached zero all of its children will have been removed,\
    \ and so we then call the node's `allClosed` method.\n\n```\n```\nclusterNode.prototype.removeChild\
    \ =\n    function(num) {\n        this.kidMCs[num].removeMovieClip()\n       \
    \ delete this.kidMCs[num]\n        this.kidCount--\n        if (this.kidCount==0)\
    \ {\n            this.allClosed()\n        }\n    }\n```\n```\n\nOnce all of the\
    \ node's children have been closed, we then want to let the node's parent know\
    \ that it can execute any queued actions. This is what is accomplished in the\
    \ `allClosed` method:\n\n```\n```\nclusterNode.prototype.allClosed =\n    function()\
    \ {\n        delete this._parent.kidOpen\n        this._parent.checkWait()\n \
    \   }\n```\n```\n\nSo here we've done two things. Firstly we have removed the\
    \ parent's `kidOpen` property, and secondly, we have called the parent's `checkWait`\
    \ method, which executes any queued actions, either opening a different child\
    \ or closing itself.\n\nIf you test the movie at this point, or `spinner007.fla`,\
    \ you'll see that it's generally functioning correctly. The user can now click\
    \ on any node, whether or not its parent already has open children, and the interface\
    \ will go through the correct series of events to open the node.\n\n![](img/50202c17d5022233f3e3ec60560e35aa_140_0.png)"
  merge: -1
  img_proc: true
- pgno: 141
  md: "# Final polishing\n\nWhile in the course of most events this works fine, there\
    \ are still a couple of problems we have to deal with. The first is that if the\
    \ user clicks one of a node's children before all of the other children have been\
    \ created, the positioning is messed up. This happens because the instruction\
    \ to rotate all of the nodes is sent out before the final child / children are\
    \ created and so the final child / children are left in their original positions.\
    \ It's actually quite hard to do this, you would have to click just as the node\
    \ is shooting out from its parent after being created, but it's still best to\
    \ guard against this.\n\nCurrently nodes only check if they have queued actions\
    \ when their children have closed. To deal with this we need to add another call\
    \ to checkWait, this time after the node has created all of its children:\n\n\
    ```\nclusterNode.prototype.addNextKid =\nfunction() {\n    this.g++\n    if(this.g\
    \ % 2 == 0) {\n        if(this.kidCount <\n            this.kidsArray.length)\
    \ {\n            this.createChild(this.kidCount)\n            this.kidCount++\n\
    \        } else {\n            delete this.onEnterFrame\n            this.opening\
    \ = false\n            this.checkWait()\n        }\n    }\n}\n```\n\nThe second\
    \ problem is something we have not addressed yet, what to do when a node has its\
    \ children open and one clicks it. At present if you do this then it closes them\
    \ and immediately opens them up again – a bit of a redundant exercise. It would\
    \ be better if the open node closed its children and moved back towards its parent.\
    \ We'll implement that as well. Both of these things are fairly simple, just a\
    \ case of adding a couple of extra conditionals to the routines we already have.\n\
    \nBoth changes are implemented in the clickMe method. To solve the first problem,\
    \ we add a check to see if the parent node's opening property is true when the\
    \ child node is clicked. If it is then we do not open the node, but set the parent's\
    \ queued method to openChild:\n\n```\nclusterNode.prototype.clickMe=function(){\n\
    \    if(this.parent.opening){\n    this.parent.setWait\n    (this.parent,\"openChild*\"\
    ,this)\n    }else{\n    this.parent.openChild(this)\n    }\n}\n```\n\n![](img/50202c17d5022233f3e3ec60560e35aa_141_0.png)"
  merge: -1
  img_proc: true
- pgno: 142
  md: "That's the first problem solved. To deal with the second problem, we need to\
    \ add a second conditional to the clickMe method. This time we have to check if\
    \ the node has one of its children open. If it does then we need to close the\
    \ node and then queue an action to make the node move back into its parent cluster.\
    \ We'll also add another conditional to check that the node is not already open\
    \ before finally calling the openChild method:\n\nSo the `if` statement checks\
    \ if the node has an open child, and if so tells it to close and then move back.\n\
    \nThe `else` statement makes sure that the node does not already have open children\
    \ before opening it.\n\nIf you run the movie now, or check out `spinner008.fla`,\
    \ it should be more or less unbreakable.\n\n```\nclusterNode.prototype.clickMe=function()\
    \ {\n  if(this._parent.opening) {\n    this._parent.setWait\n    (this._parent,\"\
    openChild\",this)\n  }else{\n    if(this.kidOpen) {\n      this.setWait(this.kidOpen,\n\
    \      \"moveToPosition\",this.clusterRadius)\n      this.kidOpen.closeKids()\n\
    \    }else if(this.kidCount=1) {\n      this._parent.openChild(this)\n    }\n\
    \  }\n}\n```\n\n![](img/50202c17d5022233f3e3ec60560e35aa_142_0.png)"
  merge: -1
  img_proc: true
- pgno: 143
  md: '# Further thoughts


    So now we have a fully working interface. At this stage it would seem appropriate
    to discuss its strengths and weaknesses.


    I would say that in a number of senses it is successful as a navigation device.
    It is easy to use while still providing novelty. While the user might at first
    be unsure of what is going to happen when they click on one of the tags, it is
    fairly apparent that that is what they have to do. Upon clicking, the motion that
    ensues might initially feel odd, but I think that the logic of it shines through.
    Motion is the key to this. The transition between states underlines the logic
    of the interface. It feels quite solid and predictable, like a machine. The user
    is generally aware of both where they are and the alternative routes they could
    have taken.


    While looking at how the interface succeeds, it''s important to also acknowledge
    where the interface fails. While the interface can cope with most structures,
    if you needed to include 20 categories within another category, you''d quickly
    encounter problems with the labels overlapping each other. Already one can see
    this with some of the longer category names. You could try and circumvent this
    by having each node swapDepths when the user rolls over it, but that might look
    slightly odd and would not meet our aim of legibility.


    Also if the interface were more than four levels deep at any point, it would begin
    to move off the right of the screen. A fairly simple way of solving this would
    be to have whatever node is currently open centered on stage, and this might also
    be a fairly pleasing effect visually, adding to the sense of progression. I''ve
    included a basic file, called spinner_centered.fla, in the download files, demonstrating
    this with comments wherever I''ve added any code.


    A bigger concern is perhaps the size of the interface. With any interface occupying
    that much space on the screen, you''re in danger of detracting from whatever content
    there may be. This could possibly work if the content one was dealing with was
    in floating windows, or you could have the interface fold away when not in use.
    It would be possible, for instance, to have the subnodes that were not chosen
    fade out or retract when the navigation is not in use, leaving the nodes that
    were chosen as a breadcrumb.


    The beauty of this interface, as it stands, is that you could easily modify it
    to suit your own purposes, and that the aesthetics are separate from the data
    content. It shows how the use of XML can bring data dynamically into your interfaces,
    allowing you to play with the structure as much as you want.


    ![](img/50202c17d5022233f3e3ec60560e35aa_143_0.png)'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# Creating a file browser


    One of the greatest problems with web sites today is the lack of consistency in
    navigation. When we arrive at a site, there''s no guarantee that we''re going
    to know how to navigate around it. That''s okay if you''re willing to explore,
    but we have users out there who will run away screaming if they don''t immediately,
    intuitively understand how to operate our site.


    It was this thought that drove me to create the content of this chapter. I thought
    to myself, “most people know how to navigate the standard file system in most
    operating systems”. Display of icons, double-click to activate, scroll up and
    down through the items, and we’re set. It’s simple.


    So, I thought, why not bring that simplicity into a Flash movie? Why not set up
    my directory structures so that they’re logical, clear and intuitive? Then, build
    a Flash movie that loads the directory structure somehow, and lets the user navigate
    freely in a way that they’re used to.


    I set about doing this, and here is the finished result:


    ![](img/50202c17d5022233f3e3ec60560e35aa_144_0.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_144_1.png)'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'This folder happens to be filled with JPG images, which, when double-clicked,
    open up a little JPG viewer within the window:


    ![](img/50202c17d5022233f3e3ec60560e35aa_145_0.png)


    This is complete with zoom in / zoom out and download buttons.


    Alternatively, we can navigate to a location containing MP3 files:


    ![](img/50202c17d5022233f3e3ec60560e35aa_145_1.png)


    If we double-click on an MP3 file, an MP3 player opens:


    ![](img/50202c17d5022233f3e3ec60560e35aa_145_2.png)


    And then of course, if we find any text files, (with the extension .txt), then
    Flash opens up the text file in a text reader window:


    ![](img/50202c17d5022233f3e3ec60560e35aa_145_3.png)


    Any other file types, and by default, Flash will open them up in a blank browser
    window, via the getURL action.


    Navigation is, of course, accomplished with the use of folder icons, like so:


    ![](img/50202c17d5022233f3e3ec60560e35aa_145_4.png)


    Double-click on a folder, and we navigate into it, and its contents populate the
    window.'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'At the top of the screen is a status bar with several pieces of information,
    and interface items:


    ![](img/50202c17d5022233f3e3ec60560e35aa_146_0.png)


    These are, from left to right:


    +   - Navigate Up button – takes us up one level.

    +   - Current location – where we are in the site.

    +   - Number of items – tells us how many items (files/folders) are in this window.

    +   - File size – tells us how big the currently selected item is, in bytes.

    +   - File type – a filter for which type of files we’re allowing Flash to show
    us.


    This is, in effect, a complete file system-esque navigation interface, which can
    be intuitively understood by anyone with a basic understanding of computers. Of
    course, you can never quite account for every potential user out there, but in
    terms of my target audience, I’m confident that it is self-explanatory and simple.


    ![](img/50202c17d5022233f3e3ec60560e35aa_146_1.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_146_2.png)'
  merge: -1
