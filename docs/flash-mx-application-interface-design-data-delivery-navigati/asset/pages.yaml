- pgno: 54
  md: '# REAL FEEL INTERFACES


    Every popular piece of software has a bit of the ''real feel'' about it. Windows
    is called Windows because it pretends to open a bunch of windows. These windows
    pretend to have buttons on them, and those buttons pretend to depress when they
    are clicked on.


    It all feels pretty real, and it''s a good way of understanding all the code executions
    that are being performed. There is comfort in this familiarity.


    The Web represents, to an extent, a whole new unfamiliar world. Information is
    being presented in another medium, one that many people are not yet familiar or
    comfortable with. To help ease the transition into this new medium, designers
    have been taking advantage of what can be referred to as ''real feel'', by incorporating
    real-world metaphors into the design elements of the web site.


    When the Web was a purely textual medium, pages (note how already we referred
    to information on a computer monitor as a "page") contained a similar layout to
    a magazine or newspaper article. Footnotes and references became hyperlinks in
    the text, and so a new concept was introduced amidst the familiar. Even when graphics
    became an option, the periodical-style layout was still the norm, with each site
    looking more and more like a magazine transferred to your screen. Of course, early
    web designers using HTML were limited by the language.'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'And then along came Flash, and with it new possibilities in layout, navigation
    and design. We must now be careful, however, that we do not overwhelm the audience
    with all these possibilities and ideas at once. A dynamic new navigation system
    is useless if a user cannot figure it out. An interface built solely from your
    imagination and based on a Dali-like dream you had last night might be a wonder
    to look at, but if a user is too confused (or frightened!) to interact with it,
    then nothing further can be communicated. A great way to invite users to interact
    with your site is give them something they are already familiar with. This can
    range from items as simple as a graphic that looks like a 3D button that depresses
    when clicked, or something as standard as a control panel resembling VCR controls
    to manage playback of a movie, to something as quirky as a box of crayons to alter
    and customize the colors of a product. By offering such real-world items with
    functionality already familiar to the user, you can then bring in new and fresh
    ideas that the user can recognize and respond to with without feeling overwhelmed.


    ![](img/50202c17d5022233f3e3ec60560e35aa_55_0.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_55_1.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_55_2.png)'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Embracing the metaphor


    I will readily admit that I am not an abstract thinker. I gravitate more towards
    stories that focus on a strong plot, paintings and sculpture with realistic depictions
    and music with a discernable beat and melody. When I am creating, I am more productive
    when I have a literal theme to concentrate on and use as a catalyst for perhaps
    more abstract ideas. In such a way, I created the current version of my personal
    web site found at www.27Bobs.com, which is what we will be dissecting for the
    rest of this chapter.


    A good example of a metaphor is www.marvel.com, which features a section presenting
    online comic books using the metaphor of...well, comic books. Metaphors can be
    used for single elements or as themes for entire sites.


    ![](img/50202c17d5022233f3e3ec60560e35aa_56_0.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_56_1.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_56_2.png)


    Personally, I like to carry a metaphor throughout the entire site as it allows
    for more creativity by limiting the range in which to work. For instance, if someone
    tells me to draw a picture of anything, the complete freedom of subject matter
    doesn''t necessarily challenge me into creative corners, whereas if I am told
    to draw a picture of a castle, then immediately the mind starts playing with ideas
    and variations such as who (or what) owns the castle, the real or imaginary land
    it where might be located, or what elements the castle might have been built from.
    In the end I might draw a sand castle that a quixotic crab has chosen to inhabit
    and defend against the coming tide, which would not be an idea I would have come
    up with if I had not been given limitations.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Creating the metaphor


    With 27Bobs.com, my thought was to create an "unfinished" site – one that would
    display experiments, tutorials, games, images, odds and ends and anything else
    I wanted to put up, with the idea that I would continue to add more to it as time
    went on. I wanted the layout and the graphics to evoke this unfinished feeling,
    and so immediately began seeking a metaphor that I could use as a theme for the
    site.


    ![](img/50202c17d5022233f3e3ec60560e35aa_57_0.png)


    The previous version had been a bit too "crisp" for my current tastes, built from
    straight rectangles and smoothly ellipses. I knew I wanted something more seemingly
    haphazard and for a time played with the idea of simply sketching all of the elements
    with pencil and scanning them in, but then Flash MX was released and I found a
    new toy in the drawing API.


    ![](img/50202c17d5022233f3e3ec60560e35aa_57_1.png)


    One of my first drawing API experiments was building a 3D engine, and one of its
    variations was an engine to produce 3D "sketches", where several lines were randomly
    placed on a polygon''s edges. I''ve included the file sketch3D.swf in the download
    files, so you can have a look at this experiment.


    ![](img/50202c17d5022233f3e3ec60560e35aa_57_2.png)'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'I then adapted another early experiment of mine, a smart clip to animate biped
    symbols, but replaced body parts with movie clips that would redraw several sketch
    lines each frame. You can see the result in the file runner_sketch.swf.


    I liked the sketchy feel and decided that this is what I wanted to do with the
    site, which would be composed of basic boxes that expanded and contracted based
    on the section selected. As the boxes transformed, though, I wanted them to redraw
    using the sketchy animation I had been playing with as opposed to adjusting scale,
    so that it might appear as if the page was being redrawn each time the user made
    a selection.


    But what was my metaphor? Well, I had a sketchy feel and a site with little purpose
    other than to serve as my playground. It was a small step to find the metaphor
    of a sketchpad. The page would be my collection of Flash “sketches” – some complete,
    some in the process, some abandoned – made up of two colors, as my real-world
    sketchpad most usually is, though I would offer the user the ability to alter
    the two colors. The users, although presented with (hopefully) a different kind
    of site, would feel a bit familiar with the territory since they could apply their
    real-world knowledge to the metaphorical landscape. This left me free to create
    a new and exciting interface that I felt users would be comfortable exploring.


    ![](img/50202c17d5022233f3e3ec60560e35aa_58_0.png)'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# 27Bobs.com


    In this chapter, I am going to walk you through the majority of the code I used
    to create my site. If you open up 27Bobs_book_finished.swf from the download files,
    you will see the result of this tutorial, and the accompanying FLA has all of
    the code commented as well. There are certain things that I built into the finished
    version of the site that would be too difficult to fit into one chapter, such
    as the history list and the interface window that allows the user to adjust interface
    colors, although I included these additions in the file 27Bobs_further.swf so
    you can take a look, and hopefully gain some inspiration in how to move such a
    project forward. As it stands, we have plenty of code to examine, so let''s get
    going!


    # Movie preparations


    I have left the majority of work to be covered in this section, but there are
    a few items I prepared for us so that we may hit the ground running. If you open
    the file 27Bobs_start.fla from the download files you will see what I have set
    up in preparation for this exercise.


    First, you will notice that the stage is empty. The entire web site will be built
    from code, plus a few graphics that we will attach to the stage at run-time. Open
    the library to see how these graphics have been prepared.


    The logo movie clip (exported as logo) and its associated PNG are in their own
    folder. All of the other images that will be placed for each section as it opens
    are located in the section images folder, the exported symbols in the section
    images exported subfolder and the associated PNGs in the section images png subfolder.
    These images, including the logo, were prepared in Photoshop to appear as if roughly
    sketched with the same line width that we would be using for our boxed sections,
    then exported as PNGs with transparency so that we could alter the foreground
    color of the image in Flash without having to worry about a background.


    The final two items in the library are our exported font, called scriptFont, and
    an empty movie clip named subButtonSymbol, which we will use to extend the movie
    clip object. The font I have chosen to use as scriptFont in my finished version
    is QuillScript, though if you do not have the font or would like to use another,
    simply double-click on the font symbol in the library and pick another font in
    the drop-down list. Note that the file actually has Arial currently selected as
    the exported font so that readers without QuillScript installed won''t get a warning
    message. As we work through the tutorial, keep in mind that using a different
    font might mean some adjusting of a few variables to account for the different
    font size.


    The only other prepared feature in this movie is a layer of code on the main timeline
    (in fact, all of the code will be located on the first frame of the main timeline).
    Select the top layer, sections set up, and open your ActionScript editor to see
    the code included with the file. Basically, I have populated an array with objects
    containing information on all of the sections.


    ```

    sections = [];

    ```


    This line is where the array is created, then each individual section is an object
    pushed into this array:


    ```

    sections.push({name:"home and news", info:"", image:"home"});

    ```


    Here we have created an anonymous object with three properties, name, info and
    image, and pushed it into the sections array. name is obviously the name of the
    section, info is any text we wish to have placed in the textbox at the top left
    of the stage, and image is the name of the linkage identifier of the image symbol
    in the library to be used with this section. We then give one or two new properties
    to our anonymous object. For the first two sections, we fill a new property called
    textBlock, which will be a text field at the bottom left of the stage, with text:'
  merge: -1
  img_proc: true
- pgno: 60
  md: '```

    sections[0].textBlock = "Welcome to the

    new version of 27Bobs, updated to

    utilize some of the new features of Flash MX. ";

    sections[0].textBlock += "I thought the

    theme of a sketchbook or a drawing

    board for the new interface was appropriate ";

    sections[0].textBlock += "given the

    purpose of this site." + newline + newline;

    sections[0].textBlock += "Keep an eye out

    for Flash MX Studio, out in July from

    friends of ED. I contributed three

    chapters to this book in which I

    discuss the drawing API and using it to

    code 3D in Flash.";

    ```


    For later sections, I added a new property called links and filled it with information
    on hyperlinks for that section. First, a temporary array is created to hold a
    number of objects:


    ```

    links = [];

    links.push({title:"Cassie", url:"",

    info:"My first Flash experiment and a

    tribute to my favorite canine, who just

    happens to be the cutest dog... ever."});

    links.push({title:"Flupkets", url:"",

    info:"I''ve always been a big Jim Henson

    fan, so I was excited to attempt this

    interactivity experiment."});

    links.push({title:"MazeMaker", url:"",

    info:"I don''t recall what prompted this

    experiment, but I used a variation as a

    navigation tool in the first version of

    my site."});

    ```


    You can see that each index in the new.links array contains another anonymous
    object with three properties, title (the name of the link), url (which would contain
    the URL itself) and info (the information about the link that will be displayed
    on rollover). Once links has been filled with all of the link objects for that
    section, it is assigned to the links property for that section:


    ```

    sections[3].links = links;

    ```


    This is done for all of the sections of the site and can easily be updated when
    changes need to be made. I wanted to provide a file for you where all of the work
    was done in Flash to show how it''s possible. There are, of course, other ways
    to accomplish the same set-up. Included with the download files is 27Bobs_further.fla,
    which loads an XML file, sections_27Bobs.XML, containing all of the section information.
    If you are interested in seeing how to use XML to achieve the same state, I would
    encourage you to look at the files.


    That''s it for the preparation. I tried to do as little as possible beforehand
    so that I could really take you through the process of creating this site. So
    let''s get to it!


    ![](img/50202c17d5022233f3e3ec60560e35aa_60_0.png)'
