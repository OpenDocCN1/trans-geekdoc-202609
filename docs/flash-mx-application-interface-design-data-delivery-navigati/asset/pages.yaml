- pgno: 247
  md: 'So what next? The movies are modular enough to allow further kata movies to
    be imported and have the same techniques applied. This could be built up into
    a whole library of kata videos with diagrammatic foot sequences to accompany them.
    The Flash movies themselves can be pretty hefty, as even compressed video can
    take up quite a lot of file size, depending on the quality of the video, but these
    Flash movies could be run from a CD, or saved as a projector file and downloaded
    by the user to run as a stand-alone application.


    The techniques used in this exercise could be expanded endlessly, with the addition
    of more variables in the recording movie. We could add another set of symbols
    to indicate hand movements or have English translations of the named stances.


    There are many activities that could be treated in a similar way to this. Many
    sports that involve a technique based approach could be video taped and imported
    into Flash for analysis and visual annotation.


    Golf swings could be recorded and analyzed to improve technique.


    Key moves from football games could have ‘expert opinion’ style scribbles added
    to them.


    Outside the world of sports Flash could be used as a subtitling application, to
    translate foreign video clips perhaps as a language teaching aid.


    The concept could even be expanded to add animated characters to video clips,
    in a Mary Poppins or Scooby Doo style.


    As with so much in Flash, it is easy to see how you could continue to adapt and
    expand the techniques here for a wide variety of different uses.


    ![](img/50202c17d5022233f3e3ec60560e35aa_247_0.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_247_1.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_247_2.png)'
