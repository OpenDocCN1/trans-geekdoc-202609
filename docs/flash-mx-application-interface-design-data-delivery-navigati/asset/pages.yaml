- pgno: 159
  md: 'If this is the case, then we proceed with the big command:


    ```

    anchor.attachMovie("FFileInfoComponent",

    "file" add numpassed, numpassed + 10, {

    xpos : (numpassed % filesPerRow) *

    xspace + xadd, ypos :

    Math.floor(numpassed / filesPerRow) *

    yspace + yadd, fileName : this["file"

    add n], filePath : baseURL add "site/"

    add matchDir, fileSize : this["fsize"

    add n]});

    ```


    What does all this mean? It''s quite simple really. We have a movie clip on the
    main timeline called anchor, and we''re using the attachMovie command to attach
    all our instances of the FFileInfoComponent to it. This way, when we move anchor
    around the stage, all the files will move with it – a convenient scrolling tool.


    We''re creating instances of the FFileInfoComponent, with the names file0, file1,
    file2, file3, and so on. The next parameter is the depth level, which we''re setting
    to numpassed + 10, which means that the depth will be 10, 11, 12, 13, and so on.


    The third parameter in the attachMovie function is an object that contains initial
    values to be set in the new instance. We''re setting their initial xpos and ypos
    essentially like so:


    ```

    xpos = (numpassed % filesPerRow) * xspace + xadd;

    ypos = Math.floor(numpassed /

    filesPerRow) * yspace + yadd;

    ```


    We''re also passing in the filename, file path and the file size. Once the instance
    is created, we continue on until all the incoming data has been parsed. Then,
    we set numFilesLoaded to be numpassed, which will actually be the number of files
    passed in.


    We''re then setting the scroll properties of the scrollbar called filescroll,
    which will be used to move the files up and down, should the file list be longer
    than one screen. The setScrollProperties method takes three parameters:


    +   pageSize – this defines how big the ''thumb'' is (the square that we slide
    up and down). Its size depends on a ratio of the next two parameters.


    +   minPos – this is the value of the minimum location of the scrollbar. Usually,
    this is 0. This means that when the scrollbar is at the absolute top, and we use
    the getScrollPosition method, it''s this value that will be returned.


    +   maxPos – the opposite of minPos. This is the value at the absolute bottom
    of the scrollbar.


    If the minPos was 0, and the maxPos was 1, then the scrollbar would only have
    two possible values, 0 or 1, depending upon where the thumb was. In this case,
    we could say that the scrollbar itself is ''2'' in length. So, if we set the pageSize
    to be 1 then the thumb will take up exactly 50% of the scrollbar. If our minPos
    was 0 and our maxPos was 100, on the other hand, and our pageSize was still 1,
    then the thumb would be a hundredth of the size of the scrollbar.


    So, we set our scroll properties like so:


    ```

    filescroll.setScrollProperties(400, 0,

    Math.floor(numpassed / filesPerRow) *

    yspace + yadd - 300);

    anchor._y = 0;

    filescroll.setScrollPosition(0);

    titleBar.fileCount.text = numpassed add

    " items";

    titleBar.pathName.text = baseURL add

    matchDir;

    ```


    ![](img/50202c17d5022233f3e3ec60560e35aa_159_0.png)'
