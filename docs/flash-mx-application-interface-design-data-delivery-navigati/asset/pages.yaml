- pgno: 40
  md: 'Remember the row of buttons to the bottom left of the stage? Here the nested
    arrays contain information regarding the shape, color and alpha values of the
    buttons as well as the overall structure of the spiral shape. There is also an
    element that provides a string containing a label name for each of the buttons.


    We will return to these arrays later in the chapter as we look at pulling data
    from them through button interaction.


    The next block of code defines a prototype for drawing a shape, and in essence
    provides us with a new movie clip method called drawShape. This prototype is basically
    an extension of one I used in an earlier set of interface experiments that appeared
    in another friends of ED book called Fresh Flash – New design ideas with Flash
    MX. 10 arguments are passed to the function once it is called and these are used
    to produce an eight-sided shape – where each of the sides can vary between a straight
    line to an oblique or obtuse curve. Originally the prototype function was used
    to draw perfect circles made of 8 curves, something that Flash is not too accurate
    at doing with the standard 4.


    ```

    MovieClip.prototype.drawShape =

    function(xpos,ypos,radius,lWidth,lColor,

    fColor,fAlpha,distorta,distortb,kolor) {

    x = xpos;

    y = ypos;

    r = radius;

    u = r*distorta;

    v = r*distortb;

    this.lineStyle(lWidth,lColor,100);

    this.beginFill(fColor, fAlpha);

    this.moveTo(x-r, y);

    this.curveTo(x-r, y-u, x-v, y-v);

    this.curveTo(x-u, y-r, x, y-r);

    this.curveTo(x+u, y-r, x+v, y-v);

    this.curveTo(x+r, y-u, x+r, y);

    this.curveTo(x+r, y+u, x+v, y+v);

    this.curveTo(x+u, y+r, x, y+r);

    this.curveTo(x-u, y+r, x-v, y+v);

    this.curveTo(x-r, y+u, x-r, y);

    this.endFill();

    }

    ```


    Taking a look at the 10 parameters in order we have xpos and ypos, which define
    the x and y co-ordinates of the drawn shape relative to the _root or the movie
    clip it is drawn in. lWidth describes the thickness of the shape''s perimeter
    line, and lColor its color as a hexadecimal value. fColor and fAlpha describe
    the respective colour and alpha values of the shape''s fill. The parameters distorta
    and distortb are ratio values that affect the curve angles – for a perfect circle
    to be produced these need to be 0.4086 and 0.7071 respectively. The final parameter,
    kolor, is used to affect the final output color of the shape when the drawShape
    method is invoked. Note the use of this to define the scope within which the shape
    is drawn – it will be drawn inside the movie clip from which the drawShape method
    is invoked (or if called upon in the main timeline the shape will be drawn at
    the _root level). We will see how the newly defined drawShape method works in
    detail when we come to invoke it later in the second frame.


    The actual drawing of the shape is performed by the curveTo drawing method, which
    has four parameters. The curve is drawn from the current pen position (in this
    case defined by the moveTo drawing method) to the first two parameters representing
    the x and y position of the end of the curve. The second two parameters in the
    curveTo method represent a control point to which the line curves out. The additive
    and subtractive maths used to define these points in this prototype produce an
    eight-sided symmetrical curved shape.


    The rest of the code in frame 1 is concerned with textual elements that appear
    within the interface – the static and floating labels, and the dial-system describing
    a value of scale. Flash MX introduced a great new set of ActionScript objects
    and methods for dealing with our every textual need. We can create text fields
    on the fly and control them as we would any other movie clip, and we can give
    these text fields a range of properties and apply formatting in much the same
    way as you might do with style sheets in HTML. I could have added these text fields
    to the stage using the authoring environment but that would mean another library
    of symbols and we''ve avoided them so far so for the sake of purity why not carry
    on that way!'
  merge: -1
  img_proc: true
- pgno: 41
  md: "First off I created two TextFormat objects called Tformat and Uformat :\n\n\
    ```\n```\nTformat = new TextFormat();\nTformat.color = 0x660000;\nTformat.align\
    \ = \"center\";\nTformat.italic = true\n\nUformat = new TextFormat();\nUformat.color\
    \ = 0x993300\nUformat.align = \"center\";\nUformat.italic = true\n```\n```\n\n\
    The parameters for the createTextField method are as follows:\n\n+   - a string\
    \ identifier\n+   - the depth at which the text field is placed\n+   - the x and\
    \ y positions of the text field\n+   - the width and height of the text field\n\
    \nWhat this amounts to on screen is three invisible text fields waiting to be\
    \ populated with text.\n\nWe will apply our TextFormat objects to our text fields\
    \ in much the same way as we would use a CSS style sheet to control the style\
    \ formatting of text elements in an HTML document. This has the obvious advantage\
    \ of being the most efficient way of allowing changes to be made to groups of\
    \ text with the minimum of fuss. In both we define the particular color of our\
    \ text, and set the text to center within its text field. We then set the text\
    \ to be italicized.\n\nThe next six lines of code instruct Flash to create three\
    \ new text fields for our disposal and set the selectable property for each to\
    \ be false:\n\n```\n```\n_root.createTextField(\"titltext\",\n        700, 77,\
    \ 83, 100, 20);\n_root.titltext.selectable = false;\n_root.createTextField(\"\
    spiraltype\",\n        701, 237, 181, 100, 20);\n_root.spiraltype.selectable =\
    \ false;\n_root.createTextField(\"measurement\",\n        702, 437, 81, 100, 20);\n\
    _root.measurement.selectable = false;\n```\n```\n\nThe following block of ActionScript\
    \ is also used to create a text label, but this one is responsible for the floating\
    \ title label that we see whenever we roll over a button.\n\n```\n```\n_root.createEmptyMovieClip('label',\
    \ 1002);\n_root.label.createTextField(\"insidelabel\",\n        1003, -20, -30,\
    \ 85, 18);\n_root.label.insidelabel.background = true;\n_root.label.insidelabel.selectable\
    \ = false;\n_root.label.insidelabel.autosize = true;\n_root.label.onEnterFrame\
    \ = function() {\nysline = (_root._ymouse-this._y)*.2;\nthis._y += ysline;\nxslide\
    \ = (_root._xmouse-this._x)*.2;\nthis._x += xslide;\n_root.label.insidelabel.text\
    \ = _root.select;\n_root.label.insidelabel.setTextFormat (Uformat);\n};\n```\n\
    ```\n\nThe first line of this block of code creates an empty movie clip instance\
    \ named label at a depth of 1002. There is no magical reason why it's at a depth\
    \ of 1002, I just like to space my movie clips over a range of depths just in\
    \ case I need to place a new one at an intermediate depth between two others.\n\
    \nThe next line of code nests a text field called insidelabel inside our freshly\
    \ created empty movie clip."
  merge: -1
  img_proc: true
- pgno: 42
  md: "The subsequent three lines set some properties of the text field to be switched\
    \ on or off. The `background` is switched on, giving us a default white rectangle\
    \ in which to contain our text. The `selectable` property is set to `false` and\
    \ this prevents the cursor from changing from pointer to text-selectable if it\
    \ inadvertently rolls over the floating label. (Try commenting this line out and\
    \ you will see that it causes all sorts of problems if we leave the default setting\
    \ as on.) Next up is the `autosize` property, and we've set this to be on by giving\
    \ it the Boolean value of `true`. This essentially fits the text field snugly\
    \ around the text it contains – it resizes our white rectangular text container\
    \ depending on the number of characters the text field displays.\n\nFollowing\
    \ on, we see that the next line defines an `onEnterFrame` function that is used\
    \ to animate the floating label and update its contents as buttons are rolled\
    \ over. The first four lines of code in our callback function provide the sliding\
    \ inertia movement to the label so that the label floats towards the pointer in\
    \ the both the x and y axis. The line `_root.label.insidesize.text = _root.select;`\
    \ populates the text field with the value `root.select`, which as we will see\
    \ later is updated every time we roll over a button. The last line of code in\
    \ this block sets the text field to our previously defined Uformat text format.\n\
    \nThe last block of code in frame 1 is partly similar to the previous block, dealing\
    \ specifically with the 'size label' – this time the label is animated around\
    \ a circular path when a button is clicked, its final position on the path being\
    \ dependent upon the value it is displaying, `_root.size`:\n\n```\n_root.createEmptyMovieClip('sizelabel',\
    \ 993);\n_root.sizelabel.createTextField(\"insidesize\", 0, 0, 40, 30, 18);\n\
    _root.sizelabel.insidesize.selectable = false;\n_root.sizelabel.onEnterFrame =\
    \ function() {\n    this._x = 470 + Math.cos(degrees / 180 * Math.PI) * 75;\n\
    \    this._y = 140 + Math.sin(degrees / 180 * Math.PI) * 75;\n    if (count*10\
    \ < _root.size) degrees+=7;\n    count++;\n_root.dial.createEmptyMovieClip('indial',\
    \ -387);\nwith (_root.dial.indial) {\nlineStyle(1, 0xFFFFFF, 60);\nmoveTo(486,\
    \ 191);\nlineto(this._x+20, this._y+50);\n}\n_root.sizelabel.insidesize.text =\
    \ _root.size;\n_root.sizelabel.insidesize.setTextFormat(Tformat);\n}\n```\n\n\
    ![](img/50202c17d5022233f3e3ec60560e35aa_42_0.png)\n\n![](img/50202c17d5022233f3e3ec60560e35aa_42_1.png)\n\
    \n![](img/50202c17d5022233f3e3ec60560e35aa_42_2.png)\n\n![](img/50202c17d5022233f3e3ec60560e35aa_42_3.png)\n\
    \n![](img/50202c17d5022233f3e3ec60560e35aa_42_4.png)"
