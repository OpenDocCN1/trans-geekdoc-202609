    \ ],\n\t[ [ \"galaxy03\", \"unknown\", 290, \"100lightyears\" ], [ \"galaxy04\"\
    , \"unknown\", 300, \"100lightyears\" ] ] ];\n```\n\nThis 2 dimensional array\
    \ stores all the data regarding our spiral classification. Although far from being\
    \ the most robust or versatile method for holding data, it's a quick and simple\
    \ way of organizing data to be used/or called up by an interface. In this case\
    \ our link array contains 26 nested arrays, each containing 4 elements. The 4\
    \ elements in each array represent the spiral's name, its terminology (spiral\
    \ type), a quantity of scale and its unit of measurement of scale, in that order.\
    \ The data in these arrays will be used for a number of purposes – to locate a\
    \ specific JPG to load into the player, to give screen elements labels, and to\
    \ effect the positioning of parts of the interface during interaction. As you\
    \ will see this is a useful way of identifying a particular spiral in the list\
    \ along with any associated information.\n\nFollowing this we declare the contents\
    \ of a similarly defined 2 dimensional array, this time containing data used in\
    \ the configuration options of the interface:\n\n```\nvar conf = [ [ 0.4786, 0.4571\
    \ , \"reset\", 45, 5, 80 ],\n\t[ 0.0086, 0.7071 , \"config 01\", 250, 4.1, 70\
    \ ],\n\t[ 0.4086, 0.9071 , \"config 02\", 120, 5.2, 40 ],\n\t[ 0.786, 0.6571 ,\
    \ \"config 03\", 15, 9.8, 130 ],\n\t[ -0.9086, 0.8071 , \"config 04\", 45, 12,\
    \ 50 ],\n\t[ 0.0086, -0.7071 , \"config 05\", 210, 160, 90 ],\n\t[ 0.4086, 0.7071\
    \ , \"config 06\", 5, 260, 0 ],\n\t[ 0.1086, 0.7071 , \"config 07\", 30, 5, 80\
    \ ],\n\t[ 0.4086, 0.7071 , \"config 08\", 20, 4.4, 50 ],\n\t[ 0.2086, 0.9071 ,\
    \ \"config 09\", 45, 10.91, 100 ],\n\t[ -1.2086, -1.0071 , \"config 10\", 200,\
