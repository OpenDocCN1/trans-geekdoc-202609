- pgno: 228
  md: 'Only three buttons to go now. Next we will sort out our slow motion button.
    Here''s the ActionScript:


    ```

    controls.slomoBut.onPress = function() {

    video.stop();

    count = 0;

    video.onEnterFrame = function() {

    count++;

    if ((count % 5) == 0) {

    video.nextFrame();

    }

    };

    };

    controls.slomoBut.onRelease = function() {

    video.onEnterFrame = null;

    video.stop();

    playing = false;

    };

    ```


    It''s in two parts, as we are going to set it to function only when the button
    is actually pressed and held. The function is therefore set to run with an onPress
    event rather than the onRelease that the buttons have used up until now.


    The first couple of lines tell the video to stop running, then set a variable
    called count to zero. Next the code attaches a function to the video movie clip.
    This function is the one that gets the video to play its next frame only every
    5 frames. It does this by adding 1 to the variable count each frame then working
    out what''s left over when dividing count by 5. If this equals zero it moves the
    video to the next frame. As a zero result can only be achieved when count is a
    multiple of 5, the video can only advance every 5th frame. Setting this to 5 works
    fine with our minute long movie but depending on the video being played an alternative
    value may be more appropriate.


    When the button is released the second part of the ActionScript runs. This removes
    the function added to the video instance and stops the video at its current position.
    Again we have to remember to let the rest of the code know that the video is currently
    stopped with the playing = false line.


    The code for the rewind and fast forward buttons is similar to the slow motion
    one, in that it is in two parts, one part for press and one for release.


    ```

    controls.rewindBut.onPress = function() {

    video.onEnterFrame = function() {

    video.gotoAndStop(

    -> video._currentframe-10);

    };

    };

    controls.rewindBut.onRelease = function() {

    video.onEnterFrame = null;

    video.play();

    playing = true;

    };

    ```


    Once again the button press attaches, via an onEnterFrame, a function to every
    frame of the video instance. This function looks at the current frame, then goes
    to and stops 10 frames further back along the video clip''s timeline, where the
    function is played through once more.


    When the button is released the function is removed from the video instance and
    the video is left playing.


    The code for fast forward is uncannily similar:


    ```

    controls.ffwdBut.onPress = function() {

    video.onEnterFrame = function() {

    video.gotoAndStop

    -> (video._currentframe+10);

    };

    };

    controls.ffwdBut.onRelease = function() {

    video.onEnterFrame = null;

    video.play();

    playing = true;

    };

    ```


    ![](img/50202c17d5022233f3e3ec60560e35aa_228_0.png)'
  merge: -1
  img_proc: true
- pgno: 229
  md: "It's the same as the rewind code but the -10 is replaced with a +10 and the\
    \ button instance name changed from rewindBut, to, you guessed it, ffwdBut.\n\n\
    So there we have it, a nice body of ActionScript that has given us complete control\
    \ over our video clip. Test it out and make sure that you are happy with the speed\
    \ of slow motion, fast forward and rewind. If not the relevant code can be amended.\
    \ We will need to add further elements to some of the button code as we progress,\
    \ but the important thing at this stage is that the basic video control buttons\
    \ work.\n\n![](img/50202c17d5022233f3e3ec60560e35aa_229_0.png)\n\nWe want to have\
    \ the ability to annotate our video clip with both graphics and text. The text\
    \ will take the form of captions, which will be entered and recorded while reviewing\
    \ our video and then played back in the correct order while watching our video\
    \ back. To enter our captions we are going to need an input text box. This will\
    \ be positioned close to our buttons inside the controller movie clip.\n\nWe will\
    \ shortly require two further text boxes so create a new layer within the controller\
    \ movie clip and name it textboxes. Below our row of buttons create an input text\
    \ box, 200 x 25 pixels, and give it an instance name of caption. Set it to accept\
    \ 14pt Arial typeface and ensure it is left aligned. We want to have our text\
    \ box match the aesthetics of our movie. We can do this with a small block of\
    \ code, entered at the foot of our existing code.\n\n```\ncontrols.caption.border\
    \ = true;\ncontrols.caption.borderColor = 0x3399CC;\ncontrols.caption.textColor\
    \ = 0x000000;\ncontrols.caption.backgroundColor =\n 0x9CB5EF;\n```\n\nThis code\
    \ will give us an input text box with a border to match our other elements, black\
    \ text and a background to complement our overall color scheme. These changes\
    \ will not be visible until we preview our movie.\n\nNow we'll look at how we\
    \ can integrate our video with our initial idea of diagrammatic feet symbols.\
    \ The reason that Flash is such a relevant tool for delivering web content is\
    \ that it is vector based. This means that all elements within a Flash movie are\
    \ determined by a series of numbers, in the form of co-ordinates and degrees of\
    \ rotation for example. This mathematical approach keeps file size down, but in\
    \ this case we will use the function to help us to both record and set the position\
    \ of symbols simply using numbers.\n\nEach stance requires the feet to be in a\
    \ set position at a given point in time. What we therefore need to do is calculate\
    \ the position and rotation of each foot during the kata and then be able to represent\
    \ this data in diagrammatic form. We don't really want to have to deal with the\
    \ co-ordinates and rotations themselves, that is, not the actual numbers involved\
    \ anyway. We need a front end to provide an interface to help capture the information\
    \ we require."
  merge: -1
  img_proc: true
- pgno: 230
  md: 'Create a new graphic symbol called foot and draw a stylized foot. (Or if you''re
    not feeling very artistic, once again you could always steal it from the download
    files.) Karate takes place bare-footed so the shoe print graphic used in typical
    dance step diagrams has been replaced by a bare-footed version. The graphic needs
    keeping nice and small, the grid in our example is an 18 x 18px grid to give an
    idea of scale.


    ![](img/50202c17d5022233f3e3ec60560e35aa_230_0.png)


    Use this graphic in two new movie clips, footleft and ''footright'', footleft
    using the graphic as it was drawn and footright flipping it horizontally. We now
    have our pair of feet to use in our diagrams. Create a new layer, name it feet
    and drag an instance of each foot onto it.


    ![](img/50202c17d5022233f3e3ec60560e35aa_230_1.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_230_2.png)


    These feet need to be given an instance name each, so I''ve called them leftFoot
    and rightFoot respectively.


    Our feet need somewhere to perform, a karate mat if you like, so we shall create
    that next. Create another new movie clip called square and in it draw a square
    400 x 400 px. The feet movie clip will need to stand out against the color of
    the mat so choose a contrasting color for the fill. The mat should have its top
    left hand corner at the coordinate (0,0) as this will help when we come to position
    it on the main stage. As with corners on other graphics we have created, we have
    rounded the corners on our square, this time to 15px.


    ![](img/50202c17d5022233f3e3ec60560e35aa_230_3.png)


    Our feet need to stand on the mat so create a layer below the feet layer, and
    drag the square onto it, and give it an instance name of mat. Your stage should
    now look something like this:


    ![](img/50202c17d5022233f3e3ec60560e35aa_230_4.png)'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'We need to be able to both move and rotate our feet symbols and switch between
    these two options. We are therefore going to add further buttons to our controller,
    a rotate button and a move button. These buttons will be movie clip symbols rather
    than the button symbols we used for our video controls. The two buttons will sit
    next to each other to give the impression of a single switch so we need to make
    sure they fit neatly together.


    When our movie is being used, the video needs to be stopped, the feet positioned
    and any caption added before the insert instruction button is pressed. This could
    seem counter-intuitive, with the temptation to press the insert instruction button
    prematurely. To guide the user through the various steps in the correct order,
    (after all, the intention is to make this movie accessible to a relative novice)
    we will hide the insert instruction button till the video stops playing. This
    will be done with some code shortly.


    ![](img/50202c17d5022233f3e3ec60560e35aa_231_0.png)


    Open the controller symbol and drag an instance of the two new buttons onto the
    buttons layer. Move them into position and name the instances moveBut and rotateBut.


    ![](img/50202c17d5022233f3e3ec60560e35aa_231_1.png)


    In our controller movie clip add a dynamic text box to our textboxes layer. This
    should be called buttonText and positioned to the left of our insert instruction
    button. It should be set to multiline and be right aligned.


    We will be able to keep track of the number of instructions recorded through monitoring
    a variable we will create shortly called i. This will be displayed as a counter
    in our controller movie clip. Add a dynamic text box with an instance name of
    countDigit to the textboxes layer. It should have a variable name of i, and be
    set to display 20pt Arial. This box will be positioned over our insert instruction
    button. They will not be visible simultaneously so they can happily occupy the
    same position on the stage.


    Before we add functionality to these buttons we need to think about how the end
    movie is going operate. We''re going to use it to play back the video. When we
    decide that a stance needs adding we''ll stop the video at the correct point.
    The feet will need to be dragged into their correct positions and rotated to face
    the right direction. This information will then be recorded, before the video
    is advanced to the point that another stance needs adding where the process will
    repeat itself. Once all stances have been recorded they will need to be exported,
    ready for use in the playable version of the movie.


    ![](img/50202c17d5022233f3e3ec60560e35aa_231_2.png)


    Positioning these boxes can be tricky until we start previewing the movie so we
    should be prepared to move things around slightly. As we develop the rest of the
    movie we should be thinking about how our buttons are positioned. The video controls
    will be used together, so they are grouped. The insert caption text field, move
    and rotate buttons are also used in conjunction with each other so are grouped
    too. The insert instruction and export button can be positioned near each other
    too.


    Another two buttons are needed then, an insert instruction button and an export
    button. For these we can use the same buttons we used for our video controls.
    Add two of the generic button symbols to the buttons layer of controller. Name
    the instances recordBut and exportBut. The export button will only be used once
    in the recording process so to highlight its importance we have given it a red
    tint, and to make it harder to press accidentally it has been scaled down. A descriptive
    name has also been added.


    ![](img/50202c17d5022233f3e3ec60560e35aa_231_3.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_231_4.png)'
  merge: -1
  img_proc: true
- pgno: 232
  md: "We need to add some code to make use of our text fields and also set the insert\
    \ instruction button to hide when we don't want to see it. We will create two\
    \ functions to do this – setFocal and unsetFocal. Here is the ActionScript, it\
    \ should be added at the top of our code:\n\n```\nsetFocal = function () {\n\t\
    controls.buttonText.text = \"Insert\n\tInstruction\";\n\tcontrols.recordBut._visible\
    \ = true;\n\tcontrols.countDigit._visible = false;\n\tcontrols.caption.text =\
    \ \"Insert Caption\n\tHere\";\n\tSelection.setFocus(controls.caption);\n\tSelection.setSelection(0,\n\
    \t\tcontrols.caption.length);\n};\nunsetFocal = function () {\n\tcontrols.buttonText.text\
    \ = \"Number of\n\tSteps\";\n\tcontrols.recordBut._visible = false;\n\tcontrols.countDigit._visible\
    \ = true;\n\tcontrols.caption.text = \"\";\n};\n```\n\nThis code will be used\
    \ to show or hide, as well as add, descriptive text to either the insert instruction\
    \ button or instruction counter. It will also add and highlight some default text,\
    \ Insert Caption Here, to the text input box. We should then add these functions\
    \ to the code controlling our video. The new code is shown in bold.\n\n```\n//play\
    \ and pause\ncontrols.playBut.onRelease = function() {\n\tif (playing == false)\
    \ {\n\t\tvideo.play();\n\t\tplaying = true;\n\t\tunsetFocal();\n\t} else {\n\t\
    \tvideo.stop();\n\t\tplaying = false;\n\t}\n```\n\n```\nsetFocal();\n});\n//back\
    \ one frame\ncontrols.backFrameBut.onRelease = function() {\n\tvideo.prevFrame();\n\
    \tplaying = false;\n\tsetFocal();\n};\n//forward one frame\ncontrols.forwardFrameBut.onRelease\
    \ = function() {\n\tvideo.nextFrame();\n\tplaying = false;\n\tsetFocal();\n};\n\
    //rewind to start\ncontrols.homeBut.onRelease = function() {\n\tvideo.gotoAndStop(1);\n\
    \tplaying = false;\n\tunsetFocal();\n};\n//slow motion\ncontrols.slomoBut.onPress\
    \ = function() {\n\tvideo.stop();\n\tcount = 0;\n\tvideo.onEnterFrame = function()\
    \ {\n\t\tcount++;\n\t\tif ((count%5) == 0) {\n\t\t\tvideo.nextFrame();\n\t\t}\n\
    \t};\n\tunsetFocal();\n};\ncontrols.slomoBut.onRelease = function() {\n\tvideo.onEnterFrame\
    \ = null;\n\tvideo.stop();\n\tplaying = false;\n\tsetFocal();\n};\n//rewind\n\
    controls.rewindBut.onPress = function() {\n```"
