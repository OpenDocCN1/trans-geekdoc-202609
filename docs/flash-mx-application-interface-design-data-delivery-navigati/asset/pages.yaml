- pgno: 81
  md: '# Branding the site


    Of course, the last thing I need to add before the page is complete is my logo
    so people know where they''re at (hey, I have to take *some* credit for all my
    hard work!). I left a nice little space for the logo up right. Go to the variables
    layer for this final bit of code.


    Add the following lines after the creation of the bg movie clip:


    ```

    logo = sectionHolder.attachMovie("logo",

    "logo", 12);

    logo._x = 630 - sectionHolder._x;

    logo._y = 64;

    logo.onRelease = function() {

    getURL("mailto:toddyard@27Bobs.com") };

    logoColor = new Color(logo);

    logoColor.setRGB (currentColorScheme.foregr

    ound);

    ```


    That''s all it takes to place and color the logo, and give it an e-mail contact
    button functionality. And with that final touch, the page is complete. Congratulations!
    Test the final version to see how all your hard work paid off.


    # Conclusion


    My hope with this site was to create a unique interface that evoked a sense of
    a work in progress. The sketchy feel of the scribbles of chalk aided this since
    we are already used to chalk markings being temporary and utilized in the planning
    stages of a project. Here, the real world, tactile metaphor applied, and the use
    of a real feel interface to familiarize the user with the purpose and subject
    matter, helped me in getting across what I wanted to communicate in a playful
    way without alienating or overwhelming the user.


    When you are experimenting with interfaces and tools for navigation, I would invite
    you to explore incorporating metaphors to better communicate your ideas. Sometimes,
    the limitations you place on yourself by attempting to follow a theme will unlock
    creative ideas you would never have otherwise considered, in addition to giving
    users something familiar to grasp hold of as they are swept up in your imagination.


    ![](img/50202c17d5022233f3e3ec60560e35aa_81_0.png)'
