- pgno: 235
  md: "Then comes a section that tells the movie that if the export string has not\
    \ changed from how it was initialized above, to send \"No code\" to the output\
    \ window, but if there is code, to export it:\n\n```\nif (exportStr == \"\") {\n\
    \ttrace(\"No code.\");\n} else {\n\ttrace(exportStr);\n};\n};\n```\n\nThat is\
    \ the majority of the code needed to record and export the information required\
    \ to set our feet at the right place at the right time. We'll need some initialization\
    \ code, but we'll firstly deal with the buttons we created to enable interaction\
    \ with the recording and exporting functions.\n\nFirst is the code to attach the\
    \ record and export functions to the relevant button:\n\n```\ncontrols.exportBut.onRelease\
    \ = function() {\n\texportAll();\n};\ncontrols.recordBut.onRelease = function()\
    \ {\n\trecordCurrent();\n\tvideo.stop();\n};\n```\n\nThen comes some code to create\
    \ a new function to leave our move and rotate buttons in a faded state when not\
    \ active. The button that has called the function is then set to an alpha of 100\
    \ to indicate that it is the active one.\n\n```\nresetButtons = function () {\n\
    \tcontrols.moveBut._alpha = 50;\n\tcontrols.rotateBut._alpha = 50;\n\tthis._alpha\
    \ = 100;\n};\n```\n\n![](img/50202c17d5022233f3e3ec60560e35aa_235_0.png)\n\nThe\
    \ initial state of moveBut will be set later in the code.\n\nOnce the move button\
    \ is clicked it is highlighted through the resetButtons function:\n\n```\ncontrols.moveBut.onRelease\
    \ = function() {\n\tresetButtons.call(this);\n\tmoveFoot.call(leftFoot);\n\tmoveFoot.call(rightFoot);\n\
    };\n```\n\n![](img/50202c17d5022233f3e3ec60560e35aa_235_1.png)\n\nThe ability\
    \ to move the two feet is also activated through the next bit of code:\n\n```\n\
    moveFoot = function () {\n\tthis.onPress = function() {\n\t\tthis.startDrag(true,\
    \ mat._x, mat._y,\n\t\t\t(mat._x+mat._width),\n\t\t\t(mat._y+mat._height));\n\t\
    \tthis._alpha = 100;\n\t};\n\tthis.onRelease = function() {\n\t\tthis.stopDrag();\n\
    \t\tthis._alpha = 50;\n\t};\n};\n```"
