  md: "It's finally time to write the drawCrossOut method we have already referred\
    \ to twice, which also happens to be the last method for SubButton (and nearly\
    \ the last block in our tutorial!). Place this code after releaseScript:\n\n```\n\
    SubButton.prototype.drawCrossOut = function() {\n  var cross = this.createEmptyMovieClip(\"\
    crossOut\", 2);\n  cross.lineStyle(1, currentColorScheme.foreground, 100);\n \
    \ cross.moveTo(getRandom(10) - this.width, getRandom(10) -\n    buttonHeight/2);\n\
    \  cross.lineTo(getRandom(10) + this.width, getRandom(10) -\n    buttonHeight/2);\n\
    }\n```\n\nThis, of course, creates a new empty clip and draws a randomized line\
    \ through the link name. Easy enough. One final line now to complete our SubButton\
    \ code.\n\nPlace this line at the end of the code in the subButtons layer:\n\n\
    ```\nObject.registerClass(\"subButtonSymbol\", SubButton);\n```\n\nObject.registerClass\
    \ associates an exported library symbol with a particular class. In this case,\
    \ the symbol exported as subButtonSymbol (an empty clip in the library) is associated\
    \ with the SubButton class we just created as an extension of the MovieClip object.\
