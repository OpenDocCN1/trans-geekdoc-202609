- pgno: 157
  md: '# Setting it all up


    When the file browser first starts up, we initialize several variables and set
    properties about certain movie clips. Our initialization code, which is located
    on the Actions layer of the main timeline, looks like this:


    ```

    numFilesLoaded = 0;

    viewwindow._visible = false;

    textFilecontentmc._visible = false;

    mp3Player._visible = false;

    parentdir = new Array();

    dirlevel = 0;

    filesPerRow = 7;

    xspace = 75;

    yspace = 80;

    xadd = 8;

    yadd = 49;

    busy = false;

    ```


    We''re hiding the JPG viewer, text file viewer and MP3 player. We''re also creating
    the parentdir array (discussed in the previous section).


    In addition to this, we''re setting five variables:


    +   - filesPerRow – the number of file icons to display in one horizontal row
    on screen.

    +   - xspace – the amount of horizontal space between each FileInfoComponent instance.

    +   - yspace – the amount of vertical space between each row.

    +   - xadd – the amount to add to the _x position of each instance. Used to offset
    the files from the screen edge.

    +   - yadd – similar to xadd, but for the _y axis.


    ![](img/50202c17d5022233f3e3ec60560e35aa_157_0.png)


    We''re then setting the busy flag to false. This is used to determine when to
    ignore clicks, or process them.


    Next, we start defining the variables and objects that are necessary in order
    to facilitate our server communication:


    ```

    if (baseURL == undefined) baseURL =

    "http://www.mysite.com/";

    rootDir = matchDir = "";

    matchExt = "*";

    loader2 = new LoadVars();

    loader2.load (baseURL add

    "dirstuff.php?matchExt=" add matchExt

    add "&matchDir=" add matchDir);

    ```


    Here, we''re setting up the baseURL for our website, and defining the extension
    that we''re going to be matching against. When we set matchExt to "*" by default,
    this means we want to request all files. We''re also creating a LoadVars object,
    called loader2. Once it''s created, we immediately initiate a load, calling our
    dirstuff.php script, with the necessary parameters – matchExt and matchDir. These
    are the same parameters mentioned in the section of this chapter in which we covered
    the PHP script.


    When the data comes back from the server, the loader2 LoadVars object will trigger
    the callback function, onLoad. This is where all our component instances are created
    and laid out.'
