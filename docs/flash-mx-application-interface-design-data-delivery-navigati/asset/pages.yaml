    \ \"nanometers\" ], [ \"cochlea\", \"equiangular\", 45, \"millimeters\" ],\n\t\
    [ [ \"shell\", \"logarithmic\", 50, \"millimeters\" ], [ \"shells\", \"growth\"\
    , 60, \"millimeters\" ],\n\t[ [ \"zebra-shell\", \"growth\", 70, \"millimeters\"\
