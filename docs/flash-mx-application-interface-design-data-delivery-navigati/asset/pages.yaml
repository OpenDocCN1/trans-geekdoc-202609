- pgno: 112
  md: '# MAKING XML WORK FOR YOUR INTERFACE


    Having looked at the use of Flash in presenting data graphically, it''s a good
    idea to look at how other technologies can help Flash reach this end. This chapter
    is all about getting your interfaces fully intertwined with XML (eXtensible Markup
    Language) – something that''s going to allow it to function in a simpler, more
    logical way.


    The original idea I had for this interface was a kind of clustering application.
    The interface would bring in some XML data and then display that as a series of
    clusters, giving a graphical representation of the structure of the data. The
    difficulty with something like that is to provide an accurate representation of
    the structure while also maintaining legibility. It''s one thing to draw a series
    of clusters of dots to highlight different concentrations of data, but quite another
    to turn this into an effective navigation. One solution to this problem is that
    implemented by Inxight, which can be seen at www.inxight.com/map/, in which the
    various branches of the tree span out as you drag across them in a kind of fisheye
    effect. I''m not sure whether one would be able to produce something similar within
    Flash, at least not with the same smoothness, and I''m not sure that I''d be capable
    of the mathematics involved.


    ![](img/50202c17d5022233f3e3ec60560e35aa_112_0.png)'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'What I decided to go for instead was something perhaps a little more simple,
    but hopefully a bit more legible and usable. The basic premise I started with
    was that each node in the XML structure, each category if you will, would form
    the hub of a cluster, with each of the sub-categories grouped around the circumference.
    Rather than showing all of the nodes at once in a kind of fractal pattern this
    will show one path through the data at a time. While this means that we no longer
    have a picture of the overall structure of the data it will show us all of the
    alternate paths we could have taken while reaching a particular category. The
    following diagrams should make the process somewhat clearer. They demonstrate
    the thought process I went through in arriving at the final interface.


    The diagram on the left is the first one I made of just one open cluster. I realized
    fairly quickly that the positioning of text would be a problem. If one were to
    position the text consistently on one side of the node graphic there would be
    overlap with the line connecting the node to its parent. Positioning the text
    differently depending on which direction the node was pointing was a possibility
    but seemed somewhat clunky. The solution I came up with was to put each piece
    of text on top of the graphic, resizing the graphic to fit the proportions of
    the text.


    ![](img/50202c17d5022233f3e3ec60560e35aa_113_0.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_113_1.png)'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'When the user wants to see the contents of one of the child nodes, they click
    that node and it becomes the centre of a new cluster. The first problem one encounters
    is how to plot this. As you can see in the following diagram there is an overlap
    between the two separate clusters.


    Looking at the diagram below you might be able to anticipate a problem. If one
    clicked Ghosts of Mars on the Carpenter cluster, then that cluster would shoot
    back into the original cluster, obscuring those original choices. It would really
    just end up as a mess.


    The obvious solution to this seemed to be to move the sub-category away from its
    parent category before opening it. That way the two categories sit side by side
    without any overlap.


    One possible solution to this was to open up each node across a span of the circumference
    instead of distributing them around the whole circumference. For example, if the
    node was on the left of its parent, its children would open up on its left hand
    side across a small segment of the circle. This would be a similar sort of approach
    to the tree map discussed above. While this could be workable, I realized that
    overlap would again be a problem. If the nodes are plotted around a smaller portion
    of the circumference, they are quickly going to end up on top of each other.


    ![](img/50202c17d5022233f3e3ec60560e35aa_114_0.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_114_1.png)'
  merge: -1
  img_proc: true
- pgno: 115
  md: "Instead of opting for that solution I decided on something different. What\
    \ I hit upon was that overlap would not be a problem if the nodes all opened in\
    \ the same direction. This could be achieved by rotating the cluster so that the\
    \ node to be opened was always on the right hand side before opening it. This\
    \ not only circumvents the overlap issue, but also gives more of a sense of direction\
    \ – a sense of moving in one direction towards a goal. The movement from left\
    \ to right could be seen to connote progression in western culture, echoing the\
    \ way we read and write.\n\nSo in this case, the order of events that we have\
    \ is as follows:\n\n+   1. User clicks a node.\n+   \n+   2. All the nodes rotate\
    \ so that the selected category is on the right hand side.\n+   \n+   3. The selected\
    \ node shoots out to the right so that its children will be clear of its parent's\
    \ children.\n+   \n+   4. The children of the selected node appear around it.\n\
    \nWe'll think more about the precise mechanics of that later – for example what\
    \ to do if one of a node's children is open and we then click a different child.\
    \ First we'll look at the code we need to import an XML structure to display."
  merge: -1
  img_proc: true
