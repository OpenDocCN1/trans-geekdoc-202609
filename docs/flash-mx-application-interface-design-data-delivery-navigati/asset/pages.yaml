- pgno: 162
  md: '# PLANNING SITE STICKINESS


    We''ve had a look at a few methods of creating inspiring sites and interfaces,
    but “inspiring” can really only go so far in keeping your visitors interested.
    How do we go beyond that? One of the most desirable tricks in web design is how
    to make people come back to a site on a regular basis. In this chapter we’re going
    to look at creating a feature that is responsive to each individual user.


    Now of course there are lots and lots of ways that we could choose to represent
    this in our Flash movies, such as the simple but rather dry method of displaying
    a text field that says “It has been X days since your last visit”. However, I
    decided that I would be a bit more creative here, and use an organic concept,
    something that grows and shrinks according to environmental conditions, to show
    how often a user is coming back to your site.


    We’re going to use the idea of a houseplant that will start out with small brown
    leaves. If the user visits the site every day, their plant will grow and become
    a nice healthy green. In the course of creating this, we’ll look at some exciting
    new features of Flash MX that make our programming job a lot easier, some of which
    aren’t well documented (heck, some of them weren’t even mentioned in the original
    MX Help files at all!).


    ![](img/50202c17d5022233f3e3ec60560e35aa_162_0.png)'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# # User information and the shared object feature


    So, the problem: we need to track how often a user is coming back to our site.
    We can then use the drawing API to make a plant that will grow or shrink in size
    and change color, depending on how frequently the site is visited.


    So, how do we track and store this information? Well, I could batter you with
    a host of workable solutions: PHP, ASP, ColdFusion MX, PERL, or MySQL. While these
    could provide a very solid and robust solution to the problem at hand, it would
    in most instances require a whole lot more learning, and the possibility of having
    to install and configure some daunting server software in order to make the idea
    work.


    So why make things complicated and difficult for yourself when there''s an easier
    road to take? Follow me now, intrepid reader, into the mysterious world known
    as the **shared object**...


    This awesome new feature of Flash MX is hardly known about at all, much less written
    about in practical ways. You won''t find it in the documentation that came with
    the early releases of MX, and it''s because of this that you won''t find too many
    examples out there on how to use it either.


    Shared objects allow you to store data in several different forms in a special
    location on the user''s computer so you can easily retrieve that information at
    a later date. It''s the same as a cookie, only much, much more powerful.


    Now, one thing you should be aware of: when a user first encounters your site,
    the Flash Player alerts the user to the fact that the SWF wishes to save data
    to their machine with a shared object, and prompts the user to allow or disallow
    this to happen. If the user disallows it, you won''t be able to store and retrieve
    any information in your Flash movie. It''s not advisable to make your movies critically
    reliant on the shared object – ensure that if a user disallows the use of them
    on their machine your movie will still work alright.


    The movie we''re going to make will run ok without permission to use the shared
    object, but the plant won''t grow or shrink in size – the user will always just
    have a small brown plant on the stage of the movie. And, quite frankly, it''s
    all they deserve, after my hard work.


    ![](img/50202c17d5022233f3e3ec60560e35aa_163_0.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_163_1.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_163_2.png)'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# # Saving information using shared objects


    By using ActionScript to create a shared object, the Flash Player saves a small
    file on the user''s computer with a `.sol` extension. This file can be used to
    store all manner of information in the form of variable strings and numbers, arrays,
    and even objects like XML.


    At a glance, both saving and retrieving data from a shared object looks much the
    same. To save data to a shared object file, we write some ActionScript that looks
    like the following:


    ```

    ```actionscript

    savedObj = sharedObject.getLocal ("myFirstFlashCookie");

    savedObj.data.storedVariable = "hello world!";

    savedObj.data.storedNumber = 123456;

    savedObj.data.storedArray = myArray;

    savedObj.flush();

    ```

    ```


    You can replace the name of the `sharedObject` instance with anything you like.
    In this case it''s `savedObj`, and you can also replace the name of each property
    of the `sharedObject`, which in our case is `storedVariable`, `storedNumber`,
    and `storedArray`. What you cannot change is the `sharedObject` data, which appears
    in the middle part of each line. If you do change this, your `sharedObject` simply
    will not work.


    The last little line of code as seen above – `savedObj.flush();` tells the Flash
    Player to write the properties we specified and their values into the `sharedObject`
    file called `myFirstFlashCookie`. As you can see, you can store strings, numbers,
    arrays, almost anything you like inside the shared object. Cool, huh?


    To retrieve the information we stored using the previous piece of code, we write
    the following:


    ```

    ```actionscript

    retrievedObj = sharedObject.getLocal("myFirstFlashCookie");

    _root.myVar = retrievedObj.data.storedVariable;

    _root.myNumber = retrievedObj.data.storedNumber;

    _root.myArray = retrievedObj.data.myArray();

    ```

    ```


    Simple! First we save a property of the shared object called `storedVariable`
    to the `sharedObject` file on our computer, then when we retrieve the information
    from the file, we create a new variable called `_root.myVar`, whose value we make
    equal to `retrievedObj.storedVariable`.


    ![](img/50202c17d5022233f3e3ec60560e35aa_164_0.png)'
  merge: -1
  img_proc: true
- pgno: 165
  md: "# # Starting on the code\n\nAs a good start-out example, we’re going to use\
    \ this idea to store the time and date at which a user last visited the site,\
    \ and display our plant graphic growing or shrinking in size depending on how\
    \ frequently the user visits our site.\n\nOpen the file stickiness.fla from the\
    \ download files and select the empty movie clip named **plant** at the top left\
    \ of the stage. Go into Edit in Place mode. This movie clip (with an instance\
    \ name of plant or _root.plant) contains three layers, two of which actually contain\
    \ code. Let’s look at the shared objects by taking a look at the ActionScript\
    \ on the layer named Date Actions. This layer is the one we’ll use to store all\
    \ the code required to send and retrieve information about the visitor frequency.\n\
    \nWe start with the following piece of code on the Date Actions layer:\n\n```\n\
    myDate = new Date();\ncurrentTime = myDate.getTime();\n```\n\nUsing the built-in\
    \ Date object, we create a new instance of the Date object and call it myDate.\
    \ We then create a variable called currentTime and give it a value equal to the\
    \ getTime method of the Date object. The getTime method gets the current UTC (Universal\
    \ Time, or Greenwich Mean Time) time – the number of milliseconds that have elapsed\
    \ since January 1, 1970. We’re going to use this number to compare the time in\
    \ milliseconds between any two consecutive visits, in order to tell how long it\
    \ has been between visits for a user.\n\nNormally you would save data to a sharedObject\
    \ file before retrieving it, but in our particular case, we want to retrieve the\
    \ information from the shared object before we write to it, otherwise we’ll keep\
    \ overwriting the old date data with the new date data before we’ve had a chance\
    \ to make a comparison of the two. First we create a function called getLastVisit\
    \ which we execute to see when the user was at our site last:\n\n```\nfunction\
    \ getLastVisit() {\n retrievedObj = sharedObject.getLocal\n (\"timeHolder\");\n\
    \ lastVisited = retrievedObj.data.lastVisit;\n plantSize = retrievedObj.data.plantSize;\n\
    \ firstVisit = retrievedObj.data. firstVisit;\n timeDifference = Math.round\n\
    \ ((currentTime-lastVisited)/3600000);\n daysSinceLastVisit = Math.ceil\n (timeDifference/24);\n\
    }\n```\n\nThe function begins by creating a new instance of the shared object.\
    \ This instance has the name retrievedObj. So we create a new instance of the\
    \ sharedObject object, and get information from the sharedObject file called timeHolder.\n\
    \nWe then create some variables to temporarily store information from the retrieved\
    \ sharedObject. These are:\n\n+   - `lastVisited` – used to tell us in milliseconds\
    \ the time of the last visit.\n+   - `plantSize` – a number used to represent\
    \ how big or small the plant will be.\n+   - `firstVisit` – a Boolean used to\
    \ tell us whether this is the very first visit or not.\n+   - `timeDifference`\
    \ – gives us the number of hours in total since the last visit.\n+   - `daysSinceLastVisit`\
    \ – rounds up the number of days since the last visit.\n\nAfter this, we call\
    \ the function getLastVisit:\n\n```\ngetLastVisit ();\n```"
  merge: -1
  img_proc: true
- pgno: 166
  md: "Now that we’ve retrieved the information from the shared object with our function,\
    \ it’s time to do some calculations based on the numbers we’ve received.\n\nFirst\
    \ we need to check to see if our shared object file exists, confirming whether\
    \ or not the user has visited our site before. We do this using an if statement:\n\
    \n```\nif(!firstVisit) {\n  plantSize = 0;\n  daysSinceLastVisit = 0;\n  firstVisit\
    \ = 1;\n}\n```\n\nIt checks to see if a variable named firstVisit has any value\
    \ at all, rather than being undefined. In the function getLastVisit, we tell firstVisit\
    \ to equal retrievedObj.data.firstVisit. If the user has never been to the site\
    \ before, the shared object file timeHolder won’t exist on their computer, and\
    \ so when we try to retrieve the value of retrievedObj.firstVisit, it will be\
    \ undefined. If this is the first visit by the user, we set the variable plantSize\
    \ to 0, set the variable daysSinceLastVisit to 0, and the variable firstVisit\
    \ to 1.\n\nThe second if statement in our code on the Date Actions layer checks\
    \ to see how long it has been since the user’s last check, if they have been to\
    \ the site before:\n\n```\nif((daysSinceLastVisit == 0) &&\n  (plantSize < 50))\
    \ {\n  plantSize ++;\n} else if ((daysSinceLastVisit > 0) &&\n  (plantSize > 0))\
    \ {\n  plantSize -= daysSinceLastVisit;\n}\n```\n\nIt allows us to make the plant\
    \ either grow or shrink depending on when the user was here last. If the number\
    \ of days since the last visit was 0 (meaning the user was\n\nhere in the last\
    \ 24 hours), we’ll make the plant grow in size by a factor of 1 by saying plantSize++,\
    \ with a maximum size of 50. Otherwise, if the number of days since the last visit\
    \ is greater than 0 (meaning it’s been more than one day or 24 hour period since\
    \ the last visit), we’re going to penalize the user for not visiting often enough\
    \ and make their plant wilt in size and color by setting the variable plantSize\
    \ to decrease by one for every day it has been since they were here last.\n\n\
    Now that we have used all the information about the user’s last time of visit\
    \ to set the size of the plant accordingly, it’s time to save the current time\
    \ and a few other variables to the user’s sharedObject file so it can be accessed\
    \ the next time they visit our site. We do all this by writing a very short and\
    \ neat function called saveTime:\n\n```\nfunction saveTime() {\n  savedObj = sharedObject.getLocal\n\
    \  (\"timeHolder\");\n  savedObj.data.lastVisit = currentTime;\n  savedObj.data.plantSize\
    \ = plantSize;\n  savedObj.data.firstVisit = firstVisit;\n  savedObj.flush();\n\
    }\n```\n\nAgain, just like we did with the function getLastVisit, we create another\
    \ instance of the sharedObject object. To save confusion with the first instance\
    \ we created in getLastVisit, we’ll call this one savedObj. We’re going to set\
    \ three custom properties for the savedObj instance:\n\n+   savedObj.data.lastVisit\
    \ – the current UTC (Universal Time) time in milliseconds.\n\n+   savedObj.data.plantSize\
    \ – a number representing the new size of the plant.\n\n+   savedObj.data.firstVisit\
    \ – tells us that the user has visited the site before."
  merge: -1
  img_proc: true
- pgno: 167
  md: "The last line inside the function:\n\n```\nsavedObj.flush();\n```\n\nsaves\
    \ the data to the `sharedObject` file on the user's computer for retrieval the\
    \ next time they come back. We then execute the `saveTime` function by writing\
    \ on the next line:\n\n```\nsaveTime();\n```\n\n# Watering the leaves (or: Converting\
    \ RGB colors to Hex values)\n\nThe last function on this layer, `convertColors`,\
    \ is a neat little piece of code you might find useful in many other projects\
    \ as well. Let's take a look at the code and then talk about what it does:\n\n\
    ```\nfunction convertColors(varName, varR,\n   varG, varB) {\n   newR = varR.toString(16);\n\
    \   if (newR == 0) { newR=\"00\" };\n   newG = varG.toString(16);\n   if (newG\
    \ == 0) { newG=\"00\" };\n   newB = varB.toString(16);\n   if (newB == 0) { newB=\"\
    00\" };\n   this[varName] = (\"0x\" add newR add newG\n   add newB);\n}\n```\n\
    \nThis function allows us to dynamically create variables whose values are equivalent\
    \ to hex values – the letter / number combinations used on the web when referencing\
    \ colors. For example, #000000 is black, #FFCC00 is orange, and #FFFFFF is white.\
    \ By passing the RGB values of the colors we want to convert into the function,\
    \ we can output the hex value equivalent of those same RGB numbers and use them\
    \ in the drawing API. Doing this will allow us to dynamically change the color\
    \ of the plant from brown to green. Lush!\n\nInto the function `convertColors`\
    \ we'll pass a name for the variable we'll create, as well as three numerical\
    \ values representing the red, green, and blue values ranging between 0 and 255\
    \ that make up the color we want. Inside the function we create a temporary variable\
    \ for the red, green, and blue values, and convert them to base 16 using the `toString(16)`\
    \ method. Doing this converts the number to a string.\n\nFor example if we pass\
    \ the number 200 into the `string(16)` method for the variable `newR`, the string\
    \ `c8` is returned, and if we do the same for `newG` by passing in the number\
    \ 150, we get back the string `96`, and lastly of course we need a hex string\
    \ value for blue, so we pass a value of `0` into the function for `newB`, and\
    \ we get back `0`. Now seeing as we need a six character string for the hex color,\
    \ we do a small check on each new variable to see if the string returned equals\
    \ 0, and if it does we make it equal to `00`.\n\nLastly we dynamically create\
    \ the variable to store the final color.\n\nWe want our plant to start as a fairly\
    \ unhealthy looking brown color, and it's rather fortunate for us that the RGB\
    \ values for brown and the RGB values for a bright healthy green can be easily\
    \ transformed into a neat little formula that allows us to dynamically change\
    \ the color of the plant based on the frequency of user visits.\n\nThe RGB values\
    \ of the brown that we'll use are:\n\n+   - Red: 200\n+   - Green: 150\n+   -\
    \ Blue: 0\n\nAnd the RGB values for the healthy bright green are:\n\n+   - Red:\
    \ 150\n+   - Green: 200\n+   - Blue: 0"
  merge: -1
  img_proc: true
- pgno: 168
  md: 'As you can see, reducing the Red value and increasing the Green value of our
    plant by the variable `plantSize` as the user visits the site will conveniently
    turn the plant from brown to green!


    To execute the function and create a variable whose value is a hex string representing
    a color that we’ll use to color our plant, we write:


    ```

    convertColors("fillColor", (200-plantSize),

    ➥ (150+plantSize), 0);

    ```


    We end up with a variable named `fillColor` that has a string value of `0xC39B00`.
    Then we do the same again to store the color for the outline of the plant:


    ```

    convertColors("outlineColor", (150-

    ➥ plantSize), (100+plantSize), 0);

    ```


    which gives us a variable named `outlineColor`, which

    has a string value of `0x906A00`.


    So now we’ve created some variables to store the value of

    the outline and fill colors of the plant, and seeing as we’ve

    created this neat little function already, we may as well use

    it to create the colors for the pot that the plant sits in, by

    dynamically creating the variables `potFill` and

    `potColor`:


    ```

    convertColors("potOutline", 0, 102, 255);

    convertColors("potFill", 0, 153, 255);

    ```


    ![](img/50202c17d5022233f3e3ec60560e35aa_168_0.png)'
