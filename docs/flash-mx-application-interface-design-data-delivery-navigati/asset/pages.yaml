- pgno: 43
  md: 'The onEnterFrame callback function plots the size label in positions on the
    stage using a formula to describe points on a circle. The formula is:


    ```

    X position = Xposition of center point + Math.cos(degrees / 180 * Math.PI) * radius;

    Y position = Yposition of center point + Math.sin(degrees / 180 * Math.PI) * radius;

    ```


    The next conditional checks to see if a variable called count has reached 10 times
    the value of _root.sise. If it has, the animation of the size label around the
    circular path stops – so the final distance it moves around is dependent on the
    value of _root.sise. For every frame that passes, the label moves 7 degrees around
    the circular path and a value of 1 is added to the variable count.


    The next few lines of code in this block are responsible for the rendering of
    the ''hand'' of the dial that points to the size label. Inside a freshly created
    movie clip called indial a 1 pixel thick line is drawn from a center point and
    outwards towards a position relative to the size label – the end result is an
    animated hand that points to the size label.


    The line _root.sizelabel.insidesize.text = _root.sise; populates the text field
    with the value _root.sise – this value is derived from our dimensional array,
    as we will see later. The last line of code in this block sets the text field
    to our previously defined Tformat text format.


    # Frame 2


    If frame 1 was used primarily for setting things up ready to generate the interface,
    frame 2 is the part where the actual generation is accomplished. There is nothing
    to be seen on the screen until the commands in frame 2 have been carried out.


    The first block of code tells Flash to draw a rectangle the size of the stage
    and fill it with a deep red gradient – this will provide a backdrop for our interface.
    Again we put the drawing API to good use:


    ```

    _root.createEmptyMovieClip("background", -2000);

    with (_root.background) {

    colors = [0xD83D3D, 0x990000];

    alphas = [100, 100];

    ratios = [0, 0xFF];

    matrix = {matrixType:"box", x:100, y:100, w:200, h:200, r:(90/180)*Math.PI};

    beginGradientFill("linear", colors, alphas, ratios, matrix);

    moveto(0, 0);

    lineto(660, 0);

    lineto(660, 400);

    lineto(0, 400);

    lineto(0, 0);

    endFill();

    }

    ```'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'First we create an empty movie clip called background at a depth of -2000 to
    ensure nothing we generate later on appears below it, then we define four arrays
    which are default parameters for the beginGradientFill method applied to our background
    movie clip. These are, in order:


    +   * the colors array – our two colors through which our gradient will move

    +   * the alphas array – defining the alpha values of the two colors

    +   * the ratios array – containing color distributions

    +   * the matrix array – containing a string identifier, x and y positions, width
    and height and the relative rotation of the gradient.


    Note that the last element of the matrix array, the rotation, is measured in radians,
    so we must divide by 180 and multiply by PI in order to convert from the more
    universally understood measurement of degrees.


    The beginGradientFill method instructs Flash to proceed filling the area enclosed
    by any shape that occurs after the method has been invoked. In all the method
    uses 5 parameters, a string representing the type of gradient (either linear or
    radial) and the other four arrays we just discussed. A rectangle is then drawn
    using the moveTo and lineTo methods and the size of the stage. The gradient fill
    is terminated using endFill.


    Ok, so this deep red gradient could have been made using the drawing tools in
    the authoring environment and converted to a symbol and placed on the stage. Easier
    and quicker perhaps, yes, but the beauty of using the API version is that we can
    dynamically change the gradient in many ways as the user interacts with the interface.
    Perhaps we may want to change the gradient colors as the user makes a new selection?
    We can simply introduce a dynamic variable to the color array, which has got to
    be better than producing, say, ten gradient symbols, one for each selection. In
    fact this is one of the great reasons for producing an entire interface dynamically
    using the API. It makes it very easy to add dynamic elements that are governed
    by a few variables, that are in turn affected by choices the user makes. There
    is no conceivable reason why the whole interface couldn''t be built in this manner,
    where all the elements'' properties are affected by user interaction. We then
    have something of a chameleon interface that morphs as it is being navigated,
    hopefully engaging the user as he is directly participating in the interface''s
    structure and restructure.


    The following lines of code in frame 2 create an empty movie clip called dial
    ready to house the dial-system:


    ```

    _root.createEmptyMovieClip(''dial'', -88);

    _root.dial._visible = false;

    _root.sise = "";

    ```


    ![](img/50202c17d5022233f3e3ec60560e35aa_44_0.png)'
  merge: -1
  img_proc: true
- pgno: 45
  md: "The visibility of the newly created clip is set to false. The last line in\
    \ the block sets the variable _root.sise to equal an empty string.\n\nThe next\
    \ block of code in the sequence gets down to the nitty gritty of actually generating\
    \ the buttons in a spiral formation:\n\n```\nfor (i=0; i<link.length; i++) {\n\
    \t_root.createEmptyMovieClip('mc'+i, i);\n\twith (_root['mc'+i]) {\n\tdrawShape(i*1.4,\
    \ 0, 5+i/1.5, 1,\n\t=> 0xffffff, 0x666699*i/kolor, pha,\n\tcshape, dshape);\n\t\
    drawShape(i*1.4, 0, 2+i/4.5, 1,\n\t=> 0xffffff, 0x999900*i/5, pha,\n\tcshape,\
    \ dshape);\n\t_x = 375;\n\t_Y = 20+i*13;\n\t_rotation = i*rota;\n\t_alpha = 80;\n\
    \t}\n}\n```\n\nFirst up we've set a for loop to loop as many times as there are\
    \ first level arrays in the link array. length is a property of an array returning\
    \ the number of elements in the array, in this case 26. So we will have 26 buttons,\
    \ each corresponding to a second level array, containing all of our spiral data.\n\
    \nThe next line creates an empty movie clip as a container for our generated buttons.\
    \ Using the with statement to prevent us from having to rewrite the object's full\
    \ path for each of our applied methods, we instruct Flash to invoke the drawShape\
    \ method twice, drawing two concentric shapes (in this case the outcome is flower-shaped)\
    \ inside the freshly created empty 'movie clip. The arguments passed to the prototype\
    \ function have been discussed earlier – in this case the size, the fill color,\
    \ and relative position of the circles are dependent upon the position of mc's\
    \ generated sequence, a factor of the variable i. The alpha values of the buttons\
    \ are dependent upon the value of pha. The final shape of these buttons is also\
    \ dependent on the variables cshape and dshape. To make a perfect circle these\
    \ variables need to have the values of 0.4086 and 0.7071 respectively. It is also\
    \ worth noting that as well as being dependent on a factor of i, the fill color\
    \ of the first shape or circle is dependent on the variable kolor. The four variables\
    \ cshape, dshape, pha and kolor are the variables used by the bottom left row\
    \ of buttons to reconfigure the look of the interface – but more on that as we\
    \ get to it.\n\nThe last four lines of code in this block position mc in the x\
    \ and y axis and rotate it by a factor of i*rota. As we shall see, the variable\
    \ rota is also used in the reconfiguration of the interface using the bottom left\
    \ row of buttons. Finally we've set the alpha of mc+i to 80.\n\nStill within the\
    \ for loop the next thing to do is define our rollover callback function:\n\n\
    ```\n_root['mc'+i].onRollOver = function() {\n\tthis._alpha = 100;\n\tref = Number((this.name).substring(2));\n\
    \t_root.select = _root.link[ref][0];\n\t_root.label._visible = true;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 46
  md: "First up we have set the alpha of our rolled-over mc to 100. Previously when\
    \ we generated the button mc in the block of code we set the alpha to 80, so doing\
    \ this gives the button a rollover effect of becoming subtly highlighted. As you'll\
    \ see later, when we roll-out of our specific button mc the alpha will be set\
    \ back to 80.\n\nMoving on – the subsequent onRollOut function simply sets the\
    \ alpha of our button movie clip back to 80 and sets label's visibility back to\
    \ false.\n\n```\n_root['mc'+i].onRollOut = function() {\n    this._alpha = 80;\n\
    \    _root.label._visible = false;\n};\n```\n\nFollowing on we have set the value\
    \ of a new variable ref to the value of Number((this._name).substring(2)). This\
    \ equates to the third character in the string identifier for that particular\
    \ instance name, converted to the number data type. So this gives us a variable\
    \ representing which button has been rolled-over in the button sequence, basically\
    \ a number between 0 and 25, which will be very handy indeed.\n\nThe onRelease\
    \ function in the next block of code tells Flash to do a number of things – first\
    \ it draws shapes:\n\n```\n_root['mc'+i].onRelease = function() {\n    count =\
    \ 0;\n    degrees = -90;\n    _root.dial._visible = true;\n    _root.createEmptyMovieClip('shapes',\
    \ -1000);\n    with (_root.shapes) {\n        drawShape(486, 191, 57, 1, 0xFFCCCC,\n\
    \        0xFFCCCC, 40, cshape, dshape);\n        drawShape(286, 191, 57, 1, 0xFFCCCC,\n\
    \        0xFFCCCC, 40, cshape, dshape);\n        drawShape(486, 191, 134, 1, 0xFFCCCC,\n\
    \        0xFFCCCC, 40, cshape, dshape);\n        drawShape(286, 191, 100, 1, 0xFFCCCC,\n\
    \        0xFFCCCC, 40, cshape, dshape);\n    }\n}\n```\n\nMoving to the next line\
    \ we can see that the variable _root.select has been set to the value of _root.link[ref]\
    \ [0]; So we are using ref to reference the nested link array, in this case the\
    \ first element. For example if we rolled over button 9 in the sequence we will\
    \ be referencing the first element of the ninth nested array in the link array,\
    \ in this case returning the string shell.\n\nThis method is used extensively\
    \ throughout this example as a way of referencing data from our arrays corresponding\
    \ to the button that is being interacted with.\n\nThe next line sets label to\
    \ visible, and so our button label appears on the screen and floats around following\
    \ the pointer wherever it goes, as long as it is over a button. The onEnterFrame\
    \ call-back function for label defined in frame 1 keeps updating its contained\
    \ text with the value of _root.select for every frame that passes, thereby showing\
    \ the correct label at all times.\n\nThe variables count and degrees are set to\
    \ 0 and -90 respectively, and this essentially sets the hand of the dial and position\
    \ of the size label back to 12 o'clock as soon as a button is clicked. The dial\
    \ is made visible by setting the dial's visibility property to true.\n\n![](img/50202c17d5022233f3e3ec60560e35aa_46_0.png)"
  merge: -1
  img_proc: true
- pgno: 47
  md: 'Two sets of concentric shapes are then drawn using our prototype function,
    and these are used to house the spiral-type label and our dial-system.


    The next step is concerned with setting our empty labels, which we defined in
    frame 1, with textual data regarding the correspondingly clicked buttons:


    ```

    _root.sise = " "+_root.link[ref] [2];

    _root.titletext.text = select;

    titletext.setTextFormat (Tformat);

    _root.spiraltype.text = _root.link[ref] [1];

    spiraltype.setTextFormat (Tformat);

    _root.measurement.text = _root.link[ref] [3];

    measurement.setTextFormat (Tformat);

    ```


    As we already have a clicked-button reference number, ref, we can use it to retrieve
    corresponding elements from our dimensional link array just as we did before.
    For example _root.sise = ""+_root.link[ref] [2]; sets _root.sise to the value
    of the third element in the corresponding array in the dimensional link array,
    and adds a character space to the start. This value is then used by the sizelabel
    movie clip to produce the floating label on the far left of the stage indicating
    the size of the spiral. The titletext, spiraltype and measurement text fields
    are similarly given values using our ref variable to reference our link array.


    Going onwards, we now create a new empty movie clip called jpgframe, and in it
    we use our drawShape method to produce a frame holder, again consisting of concentric
    shapes, for our JPGs:


    ```

    _root.createEmptyMovieClip(''jpgframe'', 300);

    with (_root.jpgframe) {

    drawShape(130, 193, 82, 1, 0xFFCACA, 0xFFCCCC, 40,

    Math.random(1)*1.3, 0.7071);

    drawShape(130, 193, 52, 1, 0xFFCACA, 0xEF9790, 100,

    0.4086, 0.7071);

    }

    ```


    Notice that this time we have passed Math.random(1)*1.3 as an argument to the
    distorta parameter, and this has the effect of producing a random but somewhat
    ornate pink frame with a light border. Inside of this frame we''ve drawn a simple
    circle in which to house the relevant JPG.


    ![](img/50202c17d5022233f3e3ec60560e35aa_47_0.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_47_1.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_47_2.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_47_3.png)'
  merge: -1
  img_proc: true
- pgno: 48
  md: "Next up is the block of code that loads our particular JPG into its frame:\n\
    \n```\n```\ntoload = select+\".jpg\";\n_root.createEmptyMovieClip(\"jpgholder\"\
    , 301);\nwith (_root.jpgholder) {\n  _x = 91;\n  _y = 163;\n  loadMovie(toload);\n\
    }\n}\n```\n```\n\nFirst we set the variable toload to add together the value of\
    \ select (which will be set to the string name of one of our spirals) and .jpg.\
    \ Then inside a freshly created movie clip called jpgholder, placed in the correct\
    \ position on the stage, we load our JPG represented by toload.\n\nMoving onwards,\
    \ we come to the onEnterFrame function:\n\n```\n```\n_root['mc'+i].onEnterFrame\
    \ = function() {\n  this._rotation -= 6*(2-(_root._xmouse/200));\n}\n}\n```\n\
    ```\n\nThis simple line of code is responsible for the directional rotation of\
    \ our spiral interface, dependent on the x position of the mouse pointer. Because\
    \ of the specific spatial distribution of our buttons a rotation of the clips\
    \ brings about a pleasing 3 dimensional depth to our interface. It allows us to\
    \ twist our spiral around and reach buttons that are on the far side – the buttons\
    \ are partially transparent so we can see what's on the other side as the spiral\
    \ moves around.\n\nThe final curly bracket closes our for loop and within a small\
    \ fraction of a second all of the buttons generated have been given full functionality\
    \ by the attachment of the callback functions we have just described.\n\n![](img/50202c17d5022233f3e3ec60560e35aa_48_0.png)\n\
    \n![](img/50202c17d5022233f3e3ec60560e35aa_48_1.png)\n\n![](img/50202c17d5022233f3e3ec60560e35aa_48_2.png)"
  merge: -1
  img_proc: true
- pgno: 49
  md: "# The configurations interface\n\nI was going to leave it there, but then I\
    \ had the idea of adding an interface inside the interface – one that utilized\
    \ constructional variables (remember cshape, dshape, pha, kolor and rota?) to\
    \ affect the shape and colors of the buttons as well as the spiral configuration\
    \ of the main interface:\n\n```\nfor (j=0; j<conf.length; j++) {\n    _root.createEmptyMovieClip('nc'+j,\
    \ 100+j);\n    with (_root['nc'+j]) {\n        drawShape(0, 0, 7, 1, 0xffffff,\
    \ 0x666699*j/3.5, 40, 0.4086, 0.7071);\n        drawShape(0, 0, 3, 1, 0xffffff,\
    \ 0x999900*j/kolor, 30, 0.4086, 0.7071);\n        _x = 30+j*15;\n        _y =\
    \ 375;\n    }\n}\n_root['nc'+j].onRollOver = function() {\n    ref = Number((this._name).substring(2));\n\
    \    _root.select = \"\"+_root.conf[ref][2];\n    _root.label._visible = true;\n\
    \    this._xscale = this._yscale=110;\n}\n_root['nc'+j].onRollOut = function()\
    \ {\n    _root.label._visible = false;\n    this._xscale = this._yscale=100;\n\
    }\n_root['nc'+j].onrelease = function() {\n    cshape = _root.conf[ref][0];\n\
    \    dshape = _root.conf[ref][1];\n    rota = _root.conf[ref][3];\n    kolor =\
    \ _root.conf[ref][4];\n    pha = _root.conf[ref][5];\n    _root.jpgholder.unloadMovie(toload);\n\
    \    jpgframe.clear();\n    _root.titletext.text = \"\"; _root.spiraltype.text\
    \ = \"\";\n    _root.measurement.text = \"\"; _root.dial.visible = true;\n   \
    \ gotoAndPlay(2);\n}\n}\n```"
  merge: -1
  img_proc: true
- pgno: 50
  md: 'The configurations interface is very similar in nature to the spiral interface
    – it relies on a two dimensional array called conf to hold data that is passed
    to those constructional variables and uses the same method for referencing them.
    This time the buttons are arranged in a row at the bottom left of the stage –
    again the buttons are generated using the drawShape prototype. A new label name
    is given to each button as it is rolled-over, and this time the scaling of each
    button is increased by 10 percent, and reduced back to its original size on roll-out.
    When one of these buttons is clicked, the five constructional variables are set
    to values that I have found to produce interesting effects in terms of shape,
    color and formation. Try experimenting with different values in the conf array
    to see the vast range of geometrically exact and interesting shapes that arise.


    Within our onRelease function and after the setting of our configuration variables,
    we''ve asked Flash to unload our JPG using the unloadMovie method and clear the
    jpgframe movie clip using the clear method. We''ve set the visibility of _root.dial
    to true ready for the next instance of redrawing the ''hand'' and we''ve also
    set our label''s contents to equal empty strings, thereby removing all our content
    from the stage ready for the interface to be re-built to its newly selected configuration
    – and this we''ve done by simply instructing Flash to gotoAndPlay(2). So frame
    2 goes about generating the interface once again, this time using a new set of
    constructional variables to affect the final color, shape and configuration of
    the spiral.


    # Frame 3


    Frame 3 contains a humble stop, and so this is where our story ends.


    ![](img/50202c17d5022233f3e3ec60560e35aa_50_0.png)'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Onwards and tangents


    In this example I''ve used the Flash drawing API to generate all of the onscreen
    interface elements at runtime. I''ve shown how the basic API methods can be extended
    through the use of prototyping to provide us with methods for drawing more complex
    shapes. I''ve then utilized these shapes as buttons by attaching to them a sequence
    of event callback functions to provide user interactivity. Our data has been referenced
    from a couple of simple two-dimensional arrays – in fact the generated structure
    of the interface itself is also derived from these arrays. Textual information
    pulled from our arrays has been utilized by dynamically created and updated text
    fields. In all we have fairly tight piece of code weighing in at around 2.68 kilobytes
    and without a single symbol in sight.


    Aesthetically I think we have an interesting interface that is perhaps only a
    few steps away from acting as an animated database front-end. I hope there will
    be some degree of enjoyment in the twisting and turning of the interface, coupled
    with the ability to reconfigure the shape, color and structure of the final interface
    column. In the presentation of information I do think it''s to our advantage to
    provide experiential navigation – an interface that has an element of playfulness
    about it. I would encourage you to add more constructional variables to this system
    and play with the values of the existing ones, adding randomized variables and
    even pushing it to a point beyond functionality – for this kind of experimentation
    is the only way to break through into new ideas about user interaction and navigation.


    Technically, this simple system has some great advantages too, for updating a
    site would be made easy as all we would need to do is update our link array with
    new array elements containing the names of the new spirals and all their associated
    data. We then drop the new JPGs into the root folder and there we have it – the
    number of buttons in the spiral will always be the same as the number of elements
    in our array.


    ![](img/50202c17d5022233f3e3ec60560e35aa_51_0.png)'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'In terms of further development to this interface model I think there are many
    routes we might take. We might for example derive our structure and data from
    a more versatile system such as XML schema, or link it to a living database. We
    could perhaps extend the use of our constructional variables to allow online users
    to reconfigure the interface and leave a new configuration for subsequent users.
    Perhaps we could store information


    regarding the online use of the interface and evolve its structure related to
    that use – for example color coding according to the most frequently visited links.
    I think there are many ways we could link live dynamic data to the evolving interface
    structure – anything to avoid looking at the same formation of buttons again and
    again on repeated visits would be a good thing. All in all, as always, the amount
    of directions this interface could be taken in is endless. Experimentation is
    an end in itself.


    ![](img/50202c17d5022233f3e3ec60560e35aa_52_0.png)'
  merge: -1
  img_proc: true
