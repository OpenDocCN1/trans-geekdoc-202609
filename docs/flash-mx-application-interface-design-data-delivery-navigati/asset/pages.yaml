- pgno: 175
  md: '# The drawing API in a mini-application


    We''re now going to leave our plant for a little while and make our mini-application
    to generate the sub-arrays that store the data about each leaf, and take a look
    at how the drawing API works. Open the file named leafmaker.fla from the download
    files. On the stage in the main timeline, you''ll see three small movie clips
    that are colored red, yellow, and green – red to represent the stop point for
    the curve, green to represent the start point, and yellow to represent the control
    point for the curve.


    The first line of code inside the function creates an empty movie clip called
    arc on the main timeline on level 1, so we can draw inside it with the drawing
    API. To draw anything in Flash with ActionScript, you have to provide a movie
    clip for Flash to draw into, and an empty one made for just this purpose is generally
    considered best practice. When you create an empty movie clip, its x and y are
    set to 0,0 relative to the timeline that it exists in. In our case the timeline
    the empty movie clip exists in is the _root, so the movie clip will exist at 0,0
    of the main stage as well.


    The code on each movie clip and the buttons inside each movie clip are fairly
    basic and should be familiar to you. Suffice to say that all the code inside each
    movie clip''s button does is drag the movie clip and run the drawCurve function
    via a setInterval action when pressed, and stop the drag action when the movie
    clip is released. We also make sure that each movie clip sits on a whole pixel
    number when released, just so it makes our array output look tidier. The function
    named drawCurve inside the leafmaker.fla looks like:


    To draw a curve using ActionScript in Flash, the line has to have six parameters
    to begin with, and four for every line you draw in the clip after that. We''re
    going to be able to drag our curved leaf around the screen to change its shape,
    so we''re going to use the draggable movie clips'' x and y positions as the parameters
    to pass into the drawCurve function and thereby draw the curved line.


    ```

    function drawCurve() {

    _root.createEmptyMovieClip("arc", 1);

    thickness = 10;

    with (_root) {

    beginFill(0x33CC00, 60);

    lineStyle(1, 0x000000, 100);

    moveTo(_root.startMov.x, _root.startMov.y);

    curveTo(_root.ctrlMov.x,

    _root.ctrlMov.y, _root.endMov._x,

    _root.endMov.y);

    curveTo( (_root.startMov.x-thickness),

    (_root.startMov.y-(100+thickness)),

    (_root.startMov.x), (_root.startMov.y));

    endFill();

    }

    _root.myData = _root.leafName + "," +

    _root.leafDir + "," + "_root.leafNum + "," +

    _root.startMov.x + "," + "_root.startMov.y

    + "," + "_root.endMov.x + "," +

    _root.endMov.y + "," + "_root.ctrlMov.x

    + "," + "_root.ctrlMov.y + "," +

    _root.thickness;

    }

    ```


    Using a with action (similar to the old tellTarget action), we tell the _root.arc
    movie clip that we''re going to draw a line that is 1 pixel in width, with a line
    color that is black (0x000000 is Flash''s way of saying #000000 – the hex value
    of black), and the alpha for the line will be 100 percent. We then tell the movie
    clip to begin coloring in the leaf with beginFill, specifying the color and alpha
    of the fill.


    We then tell the drawing API to start at a specific position (relative to the
    0,0 of the movie clip being drawn in) by telling it to move to the x and y position
    of the green movie clip on the stage.


    Then we actually draw our first curved line. As we have already specified the
    starting place to draw the line by using the moveTo action, now we''re going to
    draw a curve to the point specified in the last two parameters, using the first
    two parameters in the curveTo action as the control point.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'We then draw our second curved line by using a little math to offset the control
    point by an arbitrary amount (you could probably tweak this line to achieve different
    results) and draw the line from the end point (the red movie clip) back to the
    start point (the green movie clip). After this, we end the fill.


    The last line of code outputs a string into a selectable text field on screen
    by concatenating the x and y positions of the green, red, and yellow movie clips,
    along with the other information we typed into the input fields. Just be sure
    to hit the button marked Generate Array whenever you make any changes.


    Once we have our leaf in the shape that we’d like to see it when it’s at full
    growth, all we have to do is copy the contents of the text field and paste it
    into the leafMap array in the appropriate place. You’ve then got the coordinates
    for every leaf that you want to make, without having to sit down and try work
    out in your head how and where each leaf will be and what it will look like.


    The values in the array that are outputted to screen in our mini-application are
    those of the leaf as you’d see it when the plant is fully grown (when the variable
    plantSize is equal to 50). For our leaf to start out smaller and grow to the finished
    size as we see it in the mini-application, you should do the following:


    +   - If the leaf curls out to the left, you must manually add 50 to the value
    of `_root.endMov.x`. For example if `_root.endMov.x` is 200 in the full-grown
    leaf, you must change the value of it to 250 in the `leafMap` array for that leaf.


    +   - If the leaf curls out to the right, you must manually remove 50 from the
    value of `_root.endMov.x`. For example if `_root.endMov.x` is 350 in the full-grown
    leaf, you must change the value of it to 300 in the `leafMap` array for that leaf.


    We’re going to use the above code as a basis for drawing and animating each leaf
    back in our main plant movie.


    ![](img/50202c17d5022233f3e3ec60560e35aa_176_0.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_176_1.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_176_2.png)


