- pgno: 236
  md: "Once a foot is pressed it can be dragged around the mat ~ the code after the\
    \ startDrag action constrains the feet to the mat. The alpha of each foot is increased\
    \ while it is pressed. Once released the foot returns to its faded state.\n\n\
    The feet need the ability to rotate too – that is what this code is for:\n\n```\n\
    controls.rotateBut.onRelease = function() {\n\t\tresetButtons.call(this);\n\t\t\
    rotateFoot.call(leftFoot);\n\t\trotateFoot.call(rightFoot);\n\t};\n```\n\nThe\
    \ code is similar to that which gave the ability to move the feet, but this time\
    \ gives the ability to rotate:\n\n```\nrotateFoot = function () {\n\tthis.onPress\
    \ = function() {\n\t\tthis._alpha = 100;\n\t\tmyX = this._x;\n\t\tthis.onEnterFrame\
    \ = function() {\n\t\t\tthis._rotation +=\n\t\t\t\tMath.round(_xmouse-myX);\n\t\
    \t};\n\t};\n\tthis.onReleaseOutside =\n\t\tthis.onRelease=function () {\n\t\t\t\
    this._alpha = 50;this.onEnterFrame =\n\t\t\t\tundefined);\n\t};\n};\n```\n\nAgain\
    \ the alpha is increased to 100 once a foot is pressed. The rotation function\
    \ works through getting the position of the foot on the x axis, then rotating\
    \ it depending on the mouse position from the foot. This can result in minus rotation\
    \ if the mouse is moved to the left, and plus rotation if the mouse is to the\
    \ right. As we will only see the static result of any rotation it does not matter\
    \ if the foot rotates as a plus or minus.\n\n![](img/50202c17d5022233f3e3ec60560e35aa_236_0.png)\n\
    \nWe then have the ActionScript that initializes the rest of the code through\
    \ creating the empty arrays and setting the move and rotate controls to their\
    \ default states:\n\n```\nvideo.stop();\nplaying = false;\nunsetFocal();\nchangeFrame\
    \ = new Array();\nrightPosX = new Array();\nleftPosX = new Array();\nrightPosY\
    \ = new Array();\nleftPosY = new Array();\nrightRot = new Array();\nleftRot =\
    \ new Array();\ncaption = new Array();\ncontrols.i = 0;\n```\n\n```\nleftFoot._alpha\
    \ = rightFoot._alpha=50;\nresetButtons.call(controls.moveBut);\nmoveFoot.call(leftFoot);\n\
    moveFoot.call(rightFoot);\ngridvis = false;\ngrid._visible = false;\ninfovis =\
    \ false;\ninfo._visible = false;\n```"
