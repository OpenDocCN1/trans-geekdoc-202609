- pgno: 8
  md: '# welcome


    # Flash as the Ideal Medium


    The days of Flash as a creative luxury are long gone. After months of downsizing,
    Flash creativity has been on a huge rationalization program. It is no longer enough
    to present animation in millions of colors and a hundred transparencies. It is
    no longer sufficient to provide interactivity and dynamism for their own sake.


    The purpose of this collection is to show how designers have taken Flash and made
    it work for its supper. What we discover is a series of creations that place Flash
    at the hub of cutting edge web content.


    The end result is a snapshot of Flash as the Ideal Medium.


    In these amazing examples we see the software pushed to its limits to create unbeatable
    applications – a collapsible family tree, an interactive video learning system,
    and a drawing tool, capable of running online!


    Beyond this we dip into the back-end capabilities to look at how to improve Flash
    still further. Some staple XML and PHP routines are brought in to add a bit of
    spice, while Flash''s mysterious sharedObject command is hunted down and tamed
    to create a hybrid Tamagotchi-style houseplant – perfectly suited to lure surfers
    back to your website!


    ![](img/50202c17d5022233f3e3ec60560e35aa_8_0.png)'
  merge: -1
  img_proc: true
