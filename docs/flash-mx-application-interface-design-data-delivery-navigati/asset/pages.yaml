- pgno: 237
  md: 'There is some additional code here too. This will be required for the final
    stage of our preliminary Flash movie.


    The final elements of this movie are aimed at making it simpler to use. The first
    is a grid, which we can turn on or off to help make it easier to position the
    feet in the correct position. This grid will be positioned over the mat.


    Create a new movie clip symbol called grid and draw a basic grid on it. The simplest
    way is to draw a hairline weight line and duplicate it 20 times or so. Drag the
    last duplicate to a position that will form the outer grid line, at least 400
    pixels distance from the first line. Use the Align tools to space them equally.
    Select all, duplicate once more and rotate this new set of lines through 90 degrees.
    (Alternatively you could use my grid from the library if you’re feeling lazy.)


    ![](img/50202c17d5022233f3e3ec60560e35aa_237_0.png)


    Drag this new clip onto the main stage, on a new layer above the mat layer, called,
    surprisingly, grid. Name the instance grid and then create a new layer above this
    one and drag an instance of square on to it. Position this instance of square
    exactly over the mat and then turn the layer into a mask, and the grid layer to
    a masked layer.


    We now need to create a button to both activate and


    deactivate this grid. Do this by adding another button to the controller movie
    clip, with some graphics on the text layer to indicate what it does. Name this
    button gridBut.


    ![](img/50202c17d5022233f3e3ec60560e35aa_237_1.png)


    We need another bit of ActionScript to add functionality to this button. As it
    is associated with a button, I have placed it before the insert and record mode.
    This just keeps things neater. The code checks to see whether the grid is already
    visible – if it is it turns it off, and if it isn’t it turns it on:


    ```

    controls.gridBut.onRelease = function() {

    if (_root.gridvis == false) {

    grid._visible = true;

    gridvis = true;

    } else {

    grid._visible = false;

    _root.gridvis = false;

    }

    };

    ```


    We want it off to begin with which is why we have


    ```

    gridvis = false;

    grid._visible = false;

    ```


    in the code that initializes everything at the foot of the ActionScript.'
  merge: -1
  img_proc: true
- pgno: 238
  md: "We want our karate expert to use this movie easily, so let's provide some basic\
    \ instructions in the form of an information panel. We will do this in a similar\
    \ way to the grid, by having a symbol that we can switch on and off. Create a\
    \ new movie clip symbol called information, and within a box provide basic instructions\
    \ on the use of this movie. Topics should include how to import a fresh video\
    \ clip and how then to insert instructions and export them. We can also use another\
    \ instance of the generic button to add a close button to the window. Scale it\
    \ down, add a standard 'x' and give it an instance name of closeBut.\n\nAdd yet\
    \ another generic button to the controller movie clip. Call this one infoBut and\
    \ add an 'i' for information to the text layer. We then need to add a little more\
    \ ActionScript to our body of code.\n\n![](img/50202c17d5022233f3e3ec60560e35aa_238_0.png)\n\
    \n+   ## To Add Instructions\n+   1. Whilst playing back the video press find\
    \ position for first stance and stop the video.\n+   2. Insert caption, then move\
    \ feel into new position, press rolele and rolate feel.\n+   3. Press Insert Instruction\
    \ button.\n+   4. Play video to next step and repeat process.\n+   5. Once all\
    \ instructions are entered press export, then copy code from the output window.\n\
    +   6. Paste code into text document and save as kata.as.\n+   \n+   ## To Replace\
    \ Video\n+   1. Double click on the current .mov file in the library.\n+   2.\
    \ Select new video to import.\n+   3. Open the video movie clip and drag the newly\
    \ imported video to the stage. Extend the timeline if necessary.\n\n```\ncontrols.infoBut.onRelease\
    \ = function() {\n  if (_root.infovis == false) {\n    info_.visible = true;\n\
    \    infovis = true;\n  } else {\n    info_.visible = false;\n    _root.infovis\
    \ = false;\n  }\n}\ninfo_.closeBut.onRelease = function() {\n  info_.visible =\
    \ false;\n  _root.infovis = false;\n};\n```\n\nThis code is essentially the same\
    \ as the code to get the grid functioning, but with grid replaced with info. The\
    \ second bit of the code activates the button on the info box itself.\n\nCreate\
    \ a new layer on our main timeline and call it info. This should be our uppermost\
    \ layer as it will appear on top of everything. On this layer we can position\
    \ our info box where we please. Give it an instance name of info.\n\nOne final\
    \ addition to our movie is the function to make our controls and video clip draggable.\
    \ This simply allows the user to position things where they want them. It's only\
    \ a few lines of code and helps to make the interface customizable.\n\n![](img/50202c17d5022233f3e3ec60560e35aa_238_1.png)\n\
    \nOn the controller movie clip add yet another generic button, this time calling\
    \ it dragBut. Create an icon for it too, as we need to know what all the buttons\
    \ do.\n\n![](img/50202c17d5022233f3e3ec60560e35aa_238_2.png)"
  merge: -1
  img_proc: true
- pgno: 239
  md: "This code simply allows the controller to be dragged around while the drag\
    \ button is pressed until the button is released:\n\n```\ncontrols.drag.onPress\
    \ = function() {\n    startDrag(controls);\n};\ncontrols.drag.onRelease = function()\
    \ {\n    stopDrag();\n};\n```\n\nThis next code allows us to drag the video around.\
    \ There is no need for a button as it is the only function the video clip needs\
    \ to have.\n\n```\nvideo.onPress = function() {\n    startDrag(video);\n};\nvideo.onRelease\
    \ = function() {\n    stopDrag();\n};\n```\n\nFinally, we can make our controller\
    \ look a little slicker, add a body to frame our buttons and generally neatent\
    \ it up. I've scaled down and dropped the alpha on the less important buttons\
    \ too.\n\n![](img/50202c17d5022233f3e3ec60560e35aa_239_0.png)\n\nAnd there we\
    \ have it. A Flash movie that we can use to generate an array containing all the\
    \ information we need to produce an interactive karate tutorial. The playback\
    \ movie will need creating next, but first we should use our recording movie to\
    \ capture some karate stances to play back.\n\nThe recording movie is used in\
    \ Flash's preview mode – if we published it and tried to play the resulting SWF,\
    \ we would not have the output window we need to copy our code from.\n\n![](img/50202c17d5022233f3e3ec60560e35aa_239_1.png)\n\
    \n![](img/50202c17d5022233f3e3ec60560e35aa_239_2.png)\n\n![](img/50202c17d5022233f3e3ec60560e35aa_239_3.png)"
  merge: -1
  img_proc: true
- pgno: 240
  md: "Once we have got to the end of our video clip, inserting instructions as we\
    \ go, we can press the export button to have the array we need generated in the\
    \ output window. This should then be copied to your clipboard. We need to create\
    \ a file that includes this information that our playback movie will be able to\
    \ make use of. The recommended file extension for saving ActionScript is .as.\
    \ Using TextEdit on a Mac, or Notepad on a PC, paste the contents of the clipboard\
    \ into an empty document and save this as kata.as. This should be in the same\
    \ folder as the FLA and SWF files we are creating.\n\n![](img/50202c17d5022233f3e3ec60560e35aa_240_0.png)\n\
    \nThe playback movie can utilize some of the elements we created for the recording\
    \ movie. The video movie clip, mat and feet all remain the same and the video\
    \ control elements of the controller movie clip will still be needed to play back\
    \ our now diagram-enhanced video.\n\nThere are a number of ways in which we can\
    \ make constructing the playback movie simpler. Perhaps the easiest is to save\
    \ our first movie, kata_record under a new name, kata_play, and then delete the\
    \ aspects we no longer require and adapt the others. This is the technique we\
    \ will document here.\n\nWe can safely delete the buttons that are linked to the\
    \ record functions – that's insert code, move, rotate and export, plus all the\
    \ code that accompanies them. The fast rewind and forward buttons will be superfluous\
    \ too. We also don't need the info box or the ability to drag the video clip,\
    \ so again any symbols or code associated with this can be removed.\n\nWhat we\
    \ do need are some new buttons in the controller movie clip. These are going to\
    \ move us forward and back one step, and toggle between the side video we prepared\
    \ earlier and the front video we have used until now. These buttons should have\
    \ instance names of forwardBut, backwardsBut and toggleBut respectively. Our new\
    \ slimmed down controller should look something like this.\n\n![](img/50202c17d5022233f3e3ec60560e35aa_240_1.png)\n\
    \nWe need to import our side view video. We do this just as we did the original\
    \ one, through the File > Import to library menu option. We should import this\
    \ with identical settings to the first video we brought into Flash.\n\nAs with\
    \ the front video, the side one needs to be housed in a symbol. If we duplicate\
    \ our current video symbol, calling it video side, we can replace the video on\
    \ the video layer with our freshly imported side view video.\n\nBack on the main\
    \ timeline, insert a new layer above the current video layer. Drag an instance\
    \ of video side to the stage, aligning it exactly with the existing video clip.\
    \ Call this instance videoside. We now need to add a function to our toggle button\
    \ so as to see either one view or the other. This is the code:\n\n```\ncontrols.toggleBut.onRelease\
    \ = function() {\n if (_root.fvvis == false) {\n video._visible = true;\n videoside._visible\
    \ = false;\n fvvis = true;\n } else {\n video._visible = false;\n videoside._visible\
    \ = true;\n _root.fvvis = false;\n }\n};\n```"
  merge: -1
  img_proc: true
- pgno: 241
  md: "It only allows one video view to be visible at a time, setting the alternative\
    \ each time the toggle view button is pressed.\n\nWe can use the same video controls\
    \ to control both video clips but we do need to add some extra lines to our existing\
    \ control code. Each time the code refers to video, we need to add a line to ensure\
    \ that the same action happens to videoside. If we did not do this, our video\
    \ clips would run out of sync, with one continuing to play while the other was\
    \ stopped.\n\nHere is the code, which is essentially the same as before with the\
    \ extra lines.\n\n```\ncontrols.playBut.onRelease = function() {\n  if (playing\
    \ == false) {\n    video.play();\n    videoside.play();\n    playing = true;\n\
    \  } else {\n    video.stop();\n    videoside.stop();\n    playing = false;\n\
    \  }\n};\n```\n\n```\ncontrols.backFrameBut.onRelease =\n▶ function() {\n  video.prevFrame();\n\
    \  videoside.prevFrame();\n  playing = false;\n};\n```\n\n```\ncontrols.forwardFrameBut.onRelease\
    \ =\n▶ function() {\n  video.nextFrame();\n  videoside.nextFrame();\n  playing\
    \ = false;\n};\n```\n\n```\ncontrols.homeBut.onRelease = function() {\n  video.gotoAndStop(1);\n\
    \  videoside.gotoAndStop(1);\n  playing = false;\n};\n\ncontrols.slomoBut.onPress\
    \ = function() {\n  video.stop();\n  count = 0;\n  video.onEnterFrame = function()\
    \ {\n    count++;\n    if ((count%5) == 0) {\n      video.nextFrame();\n    }\n\
    \  };\n  videoside.stop();\n  count = 0;\n  videoside.onEnterFrame = function()\
    \ {\n    count++;\n    if ((count%5) == 0) {\n      videoside.nextFrame();\n \
    \   }\n  };\n};\n\ncontrols.slomoBut.onRelease = function() {\n  video.onEnterFrame\
    \ = null;\n  videoside.onEnterFrame = null;\n  video.stop();\n  videoside.stop();\n\
    \  playing = false;\n};\n```"
  merge: -1
  img_proc: true
- pgno: 242
  md: "If we pick the play/pause button to look more closely at we can see that the\
    \ line videoside.play has been added after video.play(); and videoside.stop();\
    \ after video.stop ();.\n\n```\ncontrols.playBut.onRelease = function() {\n  if\
    \ (playing == false) {\n    video.play();\n    videoside.play();\n    playing\
    \ = true;\n  } else {\n    video.stop();\n    videoside.stop();\n    playing =\
    \ false;\n  }\n};\n```\n\nThis method has been repeated throughout the code. We\
    \ can now test the movie and see that using the toggle button flips us between\
    \ the front and side view videos.\n\n![](img/50202c17d5022233f3e3ec60560e35aa_242_0.png)\n\
    \n![](img/50202c17d5022233f3e3ec60560e35aa_242_1.png)"
  merge: -1
  img_proc: true
- pgno: 243
  md: "Next we need to make use of the arrays we created earlier. The first line of\
    \ the ActionScript for this movie should import our arrays. Importing these arrays\
    \ will ensure that they are in place for the rest of our code to refer to. We\
    \ have called it kata.as, so add this code to line 1 of our code. Remember to\
    \ ensure that the .as file is in the same directory as the Flash movie.\n\n```\n\
    #include \"kata.as\"\n```\n\nThe captions we recorded are going to be written\
    \ to a dynamic text box at the lower edge of the mat. Add a new layer above the\
    \ grid mask layer and call it text. Create a large dynamic text box with a variable\
    \ name of captionText across the bottom of the mat. Center align the text in it.\n\
    \n![](img/50202c17d5022233f3e3ec60560e35aa_243_0.png)\n\nWe can now add the code\
    \ that will deliver the information recorded in our first movie and stored in\
    \ kata.as. This will monitor the video movie clip and ensure that the feet graphics\
    \ and captions are played back at the correct time. This code is added above the\
    \ button code, and is similar to the recording code, in that it uses all the same\
    \ variables for position and rotation, this time though it is setting these variables\
    \ rather than recording them. Let’s take a look.\n\nThis function sets the position\
    \ and rotation of the feet at any recorded point and places the caption dynamically:\n\
    \n```\nsetFeetGraphic = function (changeNum) {\n\trightFoot._x = rightPosX[changeNum];\n\
    \trightFoot._y = rightPosY[changeNum];\n\tleftFoot._x = leftPosX[changeNum];\n\
    \tleftFoot._y = leftPosY[changeNum];\n\trightFoot._rotation = rightRot[changeNum];\n\
    \tleftFoot._rotation = leftRot[changeNum];\n\tcaption = caption[changeNum];\n\
    }\n```\n\nIt uses the same variables as the record movie.\n\nWe then have this\
    \ code to call positionLastFeet, a function created in the next piece of code:\n\
    \n```\npositionLastFeet(changeNum );\n});\n```\n\nWe want to show the feet position\
    \ immediately before the current one, which is known as change-1. This code creates\
    \ these feet, with a low alpha so we know which are previous and which are current\
    \ stances:\n\n```\npositionLastFeet = function (change) {\n\tif (change>0) {\n\
    \tlastrightFoot_visible = true;\n\tlastleftFoot_visible = true;\n\tlastrightFoot._alpha\
    \ = 20;\n\tlastleftFoot._alpha = 20;\n\tlastrightFoot._x = rightPosX[change-1];\n\
    \tlastrightFoot._y = rightPosY[change-1];\n\tlastleftFoot._x = leftPosX[change-1];\n\
    \tlastleftFoot._y = leftPosY[change-1];\n\tlastrightFoot._rotation =\n\trightRot\
    \ [change-1];\n\tlastleftFoot._rotation =\n\tleftRot [change-1];\n\t} else {\n\
    \tlastrightFoot._visible = false;\n\tlastleftFoot._visible = false;\n\t}\n};\n\
    ```\n\nThis will enable us to see where our feet are going to move from and to,\
    \ in relation to each other, rather than just giving us a disembodied pair of\
    \ feet with no reference to position. If there is no previous incarnation of the\
    \ feet, it makes the instance lastrightFoot and lastleftFoot invisible. There\
    \ is no need to know the last caption so this instruction is omitted from this\
    \ function."
  merge: -1
  img_proc: true
- pgno: 244
  md: '![](img/50202c17d5022233f3e3ec60560e35aa_244_0.png)


    To save a little on processor usage this function stops the onEnterFrame script
    from running. It also lets Flash know that video has stopped playing:


    ```

    stopPlayChecks = function () {

    _root.onEnterFrame = undefined;

    playing = false;

    };

    ```


    The following functions are those that our backBut and forwardBut buttons will
    call. previousInstruction checks to see that the current instruction is not the
    first, calls the stopPlayChecks function, then removes 1 from currentInstruction.
    It then positions the feet according to this instruction and moves both video
    clips to the correct frame.


    ```

    previousInstruction = function () {

    if (currentInstruction>0) {

    stopPlayChecks();

    currentInstruction--;

    setFeetGraphic(currentInstruction);

    video.gotoAndStop

    (changeFrame[currentInstruction]);

    videoside.gotoAndStop

    (changeFrame[currentInstruction]);

    }

    };

    ```


    Then come the functions singleCheck and playChecks, which work hand in hand monitoring
    the current frame number of the video movie clip and if necessary change the feet
    position using the setFeetGraphic function and then add one to currentInstruction.


    ```

    singleCheck = function (added) {

    toCheck = currentInstruction+added;

    if (video._currentframe ==

    changeFrame[_root.toCheck]) {

    setFeetGraphic(toCheck);

    _root.currentInstruction += added;

    }

    };

    ```


    ```

    playChecks = function () {

    _root.onEnterFrame = function() {

    singleCheck(1);

    }};

    ```


    We want playCheck to be functioning when the video is playing so we need to attach
    an extra line of code to PlayBut.


    ```

    controls.playBut.onRelease = function() {

    if (playing == false) {

    video.play();

    videoside.play();

    playChecks();

    playing = true;

    } else {

    video.stop();

    videoside.stop();

    playing = false;

    stopPlayChecks();

    }

    };

    ```'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'The second function, nextInstruction, will act as the previousInstruction function
    yet in reverse. We have to use a -1 with the currentInstruction if action, this
    is due to arrays starting at zero rather than one. The other difference is that
    the currentInstruction is added to rather than subtracted from.


    ```

    ```

    nextInstruction = function () {

    if (currentInstruction

    <changeFrame.length-1) {

    stopPlayChecks();

    currentInstruction++;

    setFeetGraphic(currentInstruction);

    video.gotoAndStop

    (changeFrame[currentInstruction]);

    videoside.gotoAndStop

    (changeFrame[currentInstruction]);

    }

    };

    ```

    ```


    Then we need the code that attaches our previously defined functions to the buttons
    that we added to the controller earlier.


    ```

    ```

    controls.forwardBut.onRelease = function() {

    nextInstruction();

    };

    controls.backBut.onRelease = function() {

    previousInstruction();

    };

    ```

    ```


    We need to add some final code to initialize the movie.


    We also need to initialize the movie to set one of the videos to visible and one
    to invisible, so this code needs to be the foot of the ActionScript.


    First we set the initial video to be the front view:


    ```

    ```

    fvvis = true;

    video._visible = true;

    videoside._visible = false;

    ```

    ```


    currentInstruction is set at -1, to act as our counter:


    ```

    ```

    currentInstruction = -1;

    ```

    ```


    The movie starts to check each frame for instructions with the playChecks function:


    ```

    ```

    playChecks ();

    ```

    ```


    We tell Flash that the video is playing:


    ```

    ```

    playing == true;

    ```

    ```


    Finally, four lines of code make sure that the previous stance is set to a lower
    depth than the current ones:


    ```

    ```

    rightFoot.swapDepths(3);

    leftFoot.swapDepths(4);

    duplicateMovieClip("rightFoot",

    "lastrightFoot", 1);

    "lastleftFoot", 2);

    ```

    ```


    This gives some added prominence to the current feet. We don''t want to trip ourselves
    up whilst trying to follow the steps.


    We then need to add the singlecheck function to our single frame forward and back
    button code.


    ```

    ```

    controls.backFrameBut.onRelease =

    function() {

    video.prevFrame();

    videoside.prevFrame();

    playing = false;

    singleCheck(-1);

    };

    controls.forwardFrameBut.onRelease =

    function() {

    video.nextFrame();

    videoside.nextFrame();

    playing = false;

    singleCheck(1);

    };

    ```

    ```'
  merge: -1
  img_proc: true
