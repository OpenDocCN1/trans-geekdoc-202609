- pgno: 79
  md: "These next two methods really go together, so I include them both in the next\
    \ block. Place these after the init method:\n\n```\n```javascript\nSubButton.prototype.rollOverScript\
    \ = function() {\n    this._parent.info.text\n        sections[currentSection].links[this.num].info;\n\
    \    this._parent.info._y = ((windowHeight*.5) -\n        this._parent.info.textHeight)/2;\n\
    \    this.clear();\n    this.lineStyle(1, currentColorScheme.foreground, 100);\n\
    \    drawRandomBox(this, -this.width, -buttonHeight, this.width, 0);\n}\n\nSubButton.prototype.rollOutScript\
    \ = function() {\n    this.clear()\n}\n```\n```\n\nrollOverScript first places\
    \ its link's information in the info text field and adjusts that text field's\
    \ position based on the amount of text. It then draws random borders around itself\
    \ in the same way that our random borders have been drawn throughout our code.\
    \ rollOutScript simply removes these borders.\n\nPlace releaseScript immediately\
    \ after rollOutScript:\n\n```\n```javascript\nSubButton.prototype.releaseScript\
    \ = function() {\n    if (sections[currentSection].visited == undefined) {\n \
    \       sections[currentSection].visited = [] };\n    if (sections[currentSection].visited[this.num]\
    \ != true) {\n        sections[currentSection].visited[this.num] = true;\n   \
    \     this.drawCrossOut();\n    }\n    if (sections[currentSection].links[this.num].url\
    \ != undefined) {\n        // getURL(sections[currentSection].links[this.num].url,\
    \ \"_blank\");\n    }\n}\n```\n```\n\nThe first line of code inside releaseScript\
    \ checks to see if the visited property of the current section exists yet, and\
    \ if it doesn't it creates it. It then checks to see if its corresponding index\
    \ inside this array has a true value, meaning it has already been visited. If\
    \ it finds it hasn't yet been visited, then a true value is placed into this index\
    \ and the drawCrossOut method is called to draw a line through the link name.\
    \ Finally, if a URL exists for the link, then the page is opened. Notice here\
    \ that I have commented out this line so you won't be given an error message that\
    \ the paths are not correct while you test this file."
