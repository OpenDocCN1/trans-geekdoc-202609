- pgno: 111
  md: '# My final thought


    Data. Boring, right? But why does it need to be? Often, the information that is
    being presented might be fascinating but it is being defeated by the way it is
    being presented. I encourage you to experiment with ways to better


    communicate your information, and more inventive and interesting ways to navigate
    through that information. We often learn by exploring, and Flash gives you amazing
    options to offer users an experience of accessing information in an incredible
    and enriching environment. Take advantage of it!


    ![](img/50202c17d5022233f3e3ec60560e35aa_111_0.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_111_1.png)


