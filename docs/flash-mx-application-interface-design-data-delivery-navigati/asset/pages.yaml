- pgno: 169
  md: '# Animating the plant


    Now we have set all this up, we can go ahead and animate our plant. The very last
    line of code on the Date Actions layer tells Flash to make the plant using a function
    called (funnily enough...) makeThePlant. The code looks like:


    ```

    makeThePlant();

    ```


    This invokes a function on the Plant Actions layer which uses the drawing API
    to draw and animate our plant.


    We now move up to the code on the Plant Actions layer in our plant movie clip.
    This might look complicated, and well... it is. Sort of. The reason some of the
    code looks verbose is that the plant movie clip is made to simply drag and drop
    on to the main timeline of any movie that you might be making, and it will work.
    Not only that, you can add or remove individual leaves on the plant in very little
    time at all, and as such the code can be said to be scalable and dynamic -- all
    the things we like in an efficient piece of code. That''s not to say that the
    ActionScript on the Plant Actions layer couldn''t be further refined (I''m fairly
    certain that it can), but I wrote it like this so it could be understood in a
    logical way and you''d learn about some great new features in MX ActionScript.


    First up inside the Plant Actions layer, we create a two-dimensional array --
    an array whose elements are made up of a series of other arrays. Think of it as
    a nested array, if you will. Our array map, or two-dimensional array looks like
    this:


    ```

    leafMap = new Array( ["leaf0", "left", 1,

    130, 300, 75, 200, 130, 230, 10], ["leaf1",

    "right", 2, 130, 300, 180, 225, 130,

    200,20], ["leaf2", "right", 3, 130, 300,

    140, 170, 130, 200, 20], ["leaf3", "left",

    4, 130, 300, 115, 180, 130, 200, 10],

    ["leaf4", "left", 5, 130, 300, 80, 200,

    135, 155, 20], ["leaf5", "left", 6, 130,

    300, 70, 230, 130, 200, 10],

    ["leaf6", "right", 7, 130, 300, 170,

    200, 130, 200, 20] );

    ```


    Let''s take it apart and see what makes it tick. Take a look at the first element
    of the array. If we were to do a trace on the first element, it''d look something
    like:


    ```

    trace( leafMap[0] );

    ```


    and it would output:


    ```

    "leaf0", "left", 1, 130, 300, 75, 200,

    130, 230, 10

    ```


    As you can see from this, the value of the first element in the array is... another
    array! That''s all there is to it. If we wanted to get the first element out of
    the sub-array that makes up the first element of our array, we''d do this:


    ```

    trace(leafMap[0][0]);

    ```


    and it would output:


    ```

    leaf0

    ```


    To get the next element in the first sub-array, we''d type:


    ```

    trace(leafMap[0][1]);

    ```


    and it would output:


    ```

    left

    ```


    What we''re effectively doing here is using an array to store a bunch of other
    sub-arrays containing unique information about each leaf inside it. So in this
    way, we have a "map" of what our plant is going to look like. The number of elements
    in the main array tells us how many leaves we''re going to make, and each element
    contains a sub-array which stores information about the name for each leaf move
    clip we''re going to generate, as well as the starting position of that leaf,
    the end point for each curve of the leaf, and so on.'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'The next piece of code takes us into Object-Oriented Programming territory.
    It''s beyond the scope of this chapter to go too far in-depth about OOP in Flash.
    Suffice to say you''re probably used to using built-in objects in Flash already.
    One of the more common built-in objects that you might be using is the MovieClip
    object, which has “properties” like MovieClip._x and MovieClip._y and MovieClip._name,
    and its own “methods” such as MovieClip.gotoAndPlay and MovieClip.stop. Some other
    objects that we''ve used so far in this movie are the sharedObject object, whose
    properties we define when we say savedObj.data.firstVist = “something”. We also
    used the Date object at the very beginning of this chapter when we got the time
    in milliseconds by calling the date method myDate.getTime().


    To expand OOP principles a little further, I''ll explain some of the more important
    terminology associated with OOP by once again using the MovieClip object as an
    example:


    +   We have the predefined Object itself, called the MovieClip object.


    +   When we create a new movie clip, we are actually making a new instance of
    that MovieClip object (hence why we give movie clips instance names).


    +   When we create a new movie clip, whether by duplicating one that already exists,
    or using the attachMovie command or the createEmptyMovieClip action, the code
    used to create the new MovieClip instance is called a constructor.


    +   The MovieClip object that is already built in to Flash has pre-defined properties,
    such as _x, _y, _name, _xscale, and _alpha.


    +   The MovieClip object also has its own methods, such as play, stop, startDrag,
    and loadMovie.


    As well as the built-in objects like MovieClip (buttons and text fields are now
    also objects in MX, each with their own properties and methods), we can also create
    our own custom objects to act as storage containers. Looking at our plant, we
    can see that the plant is made up of seven leaves, with each leaf having its own
    unique values in its properties. Let''s look at how we can take an object-oriented
    approach to storing information about a particular leaf instance.


    We start by writing down the type of information that we want to store for each
    leaf. We want to store things like:


    +   The name for the leaf instance.


    +   The direction the leaf curls in – whether left or right.


    +   The level that the movie clip for each leaf is sitting on.


    +   The thickness of the leaf.


    Now because there is no built-in object in Flash that stores this specific information
    about each leaf, we are going to create our own custom object. How do we do this?
    By writing, or defining, our own class which will act as a constructor for the
    object we are creating.


    ![](img/50202c17d5022233f3e3ec60560e35aa_170_0.png)'
  merge: -1
  img_proc: true
- pgno: 171
  md: "Looking at the ActionScript on the Plant Actions layer, the next piece of code\
    \ that we have in our movie creates our own custom class called Leaf, which in\
    \ turn creates a custom instance of the Leaf object when we call the class function\
    \ further on in the code. Inside the class constructor function we also define\
    \ which properties belong to the Leaf object as well. Let’s look at the code:\n\
    \n```\nLeaf = function ( name, dir, levelNum,\n    originX, originY, stopX, stopY,\n\
    \    controlX, controlY, thickness) {\n    this.name = name;\n    this.dir = dir;\n\
    \    this.levelNum = levelNum;\n    this.originX = originX;\n    this.originY\
    \ = originY;\n    if (dir == \"left\") {\n        this.stopX = stopX - plantSize;\n\
    \    } else if (dir == \"right\") {\n        this.stopX = stopX + plantSize;\n\
    \    }\n    this.stopY = stopY - plantSize;\n    this.controlX = controlX;\n \
    \   this.controlY = controlY;\n    this.thickness = thickness;\n    this.numStepsX\
    \ = Math.abs(((originX-\n    stopX)/100));\n    this.numStepsY = Math.abs(((originY-\n\
    \    stopY)/100));\n    this.ID = setInterval(drawLeaf, 10,\n    this.name, this.dir,\
    \ this.levelNum,\n    this.originX, this.originY, this.stopX,\n    this.stopY,\
    \ this.controlX,\n    this.controlY, this.thickness);\n};\n```\n\nEven though\
    \ the first line of the above code looks like a function, it is actually a class\
    \ definition which in turn constructs a custom object when the class is invoked.\
    \ The first line of code starts the class which will make the Leaf object, and\
    \ the following lines of ActionScript underneath\n\ndeclare and define the properties\
    \ that the Leaf object will have. We start each property declaration with a this\
    \ to denote that the property exists for each unique instance that is being created\
    \ – in other words, this instance that is being created.\n\nTake a look at the\
    \ arguments inside the class function (name, dir, levelNum, and so on). Each one\
    \ of these arguments represents an element in the sub-array which in turn makes\
    \ up our leafMap array. Let’s look again at the first element in the leafMap array:\n\
    \n```\n[\"leaf0\", \"left\", 1, 250, 400, 195, 300, 250,\n    330, 10]\n```\n\n\
    and another look at the arguments (or parameters) in our Leaf class constructor\
    \ function:\n\n```\n(name, dir, levelNum, originX, originY, stopX,\n    stopY,\
    \ controlX, controlY, thickness) {\n```\n\nYou’ve probably already guessed by\
    \ now that each element inside the leafMap sub-array corresponds exactly to an\
    \ argument inside the Leaf class definition. leaf0 corresponds to name, left corresponds\
    \ to dir and so on. Here is what all of these arguments are for and why they’re\
    \ here.\n\n+   - name – the name of the movie clip we’re going to draw inside\
    \ with the API.\n+   - dir – whether the leaf curls out to the left or to the\
    \ right of its starting point.\n+   - levelNum – the level that each leaf movie\
    \ clip is going to be on.\n+   - originX – the starting x position of the leaf\
    \ movie clip.\n+   - originY – the starting y position of the leaf movie clip.\n\
    \n![](img/50202c17d5022233f3e3ec60560e35aa_171_0.png)"
  merge: -1
  img_proc: true
- pgno: 172
  md: "+   - stopX – the end x point for the tip of each leaf.\n+   - stopY – the\
    \ end y point for the tip of each leaf.\n+   - controlX – the x position of the\
    \ control point for the curved outline of each leaf.\n+   - controlY – the y position\
    \ of the control point for the curved outline of each leaf.\n+   - thickness –\
    \ a number used to make each leaf thinner or thicker.\n\nWe're going to leave\
    \ the Leaf class for a moment and skip to the next function, called makeThePlant.\
    \ This is where we call the Leaf class constructor function to make new instances\
    \ of the Leaf object:\n\n```\nfunction makeThePlant () {\n movieHeight = _parent._height;\n\
    \ makePot ();\n for (x=0; x<(leafMap.length); x++) {\n   temp = \"leaf\"+x+\"\
    Obj\";\n   this[temp] = new Leaf (leafMap[x] [0],\n   -> leafMap[x] [1], leafMap[x]\
    \ [2],\n   -> leafMap[x] [3], leafMap[x] [4],\n   -> leafMap[x] [5], leafMap[x]\
    \ [6],\n   -> leafMap[x] [7], leafMap[x] [8],\n   -> leafMap[x] [9], leafMap[x]\
    \ [10]);\n }\n}\n```\n\nThe makeThePlant function firstly sets a variable called\
    \ movieHeight, which we'll use at the very end of the movie, then executes another\
    \ function called makePot, which creates the pot our plant sits in. We'll talk\
    \ about that function a bit later. As you can see, the next few lines of ActionScript\
    \ inside the makeThePlant function consist of a simple for loop that executes\
    \ or loops for as many elements as there are in the leafMap array. In this case\
    \ there are seven elements in the array. We can tell how many elements there are\
    \ by accessing the array method called length. If we do a trace on leafMap.length;\
    \ a value of 6 would be displayed in the output window.\n\n(Remember that arrays\
    \ start counting at 0, so the length of the array is actually 7 even though it\
    \ outputs 6).\n\nThe code inside the for loop is where the object-oriented approach\
    \ all starts to come together and hopefully makes some sense. To start with all\
    \ we do is create a temporary variable to store the instance name of the Leaf\
    \ object we're going to create. To avoid any confusion between the instance name\
    \ of the Leaf object we're creating, leaf[x]Obj, and the name of the movie clip\
    \ leaf[x] we'll need to create to draw the leaf in, we use the variable temp to\
    \ store a string that will look like leaf00bj the first time the loop is run,\
    \ and leaf10bj the next time, and so on.\n\nThe next line is where we create the\
    \ instance of the Leaf object by calling the Leaf class constructor, and we use\
    \ the variable temp to give that instance a name.\n\nTo summarize, what we've\
    \ done is made a new instance of the Leaf object, and called the first one in\
    \ the loop leaf00bj, the second one leaf10bj and so on until we have seven unique\
    \ instances of the custom Leaf object. When we say inside the loop:\n\n```\nthis[temp]\
    \ = new Leaf(leafMap[x] [0],\n```\n\nwhat we're actually doing is creating a new\
    \ instance of the Leaf object called leaf00bj, and by passing in all of the elements\
    \ from the corresponding sub-array in our leafMap array into the Leaf constructor\
    \ function, we give Leaf00bj a whole bunch of properties with unique values. After\
    \ doing this, we could do a trace on any or all of these properties like so:\n\
    \n```\ntrace(leaf00bj.name + \",\" + leaf00bj.dir);\n```\n\nThis would output:\n\
    \n```\nleaf0, left\n```"
