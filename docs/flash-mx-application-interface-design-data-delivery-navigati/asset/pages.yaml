- pgno: 214
  md: "# JPG scale tool\n\n![](img/50202c17d5022233f3e3ec60560e35aa_214_0.png)\n\n\
    The JPG scale tool contains quite a lot of code, but it can be easily broken down\
    \ into more manageable pieces. First though, let’s take a quick run though of\
    \ what the tool actually does. When you click and drag a JPG with the scale tool,\
    \ you get a freeform scaling effect. This means that if you drag along the x-axis,\
    \ but not the y, then you’ll scale the image only along the x-axis and vice versa:\n\
    \n![](img/50202c17d5022233f3e3ec60560e35aa_214_1.png)\n\nA nice side-effect of\
    \ the way this scaling is done is that you can also flip the image along either\
    \ of its axes by simply dragging past the origin in the opposite direction:\n\n\
    ![](img/50202c17d5022233f3e3ec60560e35aa_214_2.png)\n\nIf you don't want to deform\
    \ the image though, you can hold the SHIFT key down to constrain the proportions\
    \ of the image:\n\n![](img/50202c17d5022233f3e3ec60560e35aa_214_3.png)\n\nThis\
    \ will keep whatever proportions the image was in when you first clicked, so if\
    \ it was in a pretty strange shape already, then it will remain in a shape of\
    \ those proportions when you SHIFT-drag it.\n\nOK, hopefully you know pretty much\
    \ what effect we’re trying to create – now we just need to code it.\n\nThe first\
    \ thing to do, much like we did for the move tools, is to swap the depth of jamJar\
    \ with drawPad to ensure that the image is visible and easy to scale. We then\
    \ set up an onPress event handler:\n\n```\nfuncScaleTool = function () {\n   \
    \ jamJar.swapDepths(drawPad) ;\n    jamJar.onPress = function() {\n}\n```\n\n\
    Inside this, we store the mouse co-ordinates and the scale of the JPG container\
    \ clip:\n\n```\n_root.origx = _xmouse;\n_root.origiy = _ymouse;\n_root.oldxscale\
    \ = JPGContainer._xscale;\n_root.oldyscale = JPGContainer._yscale;\n```\n\nThe\
    \ reason that the JPG was nested in its own clip one layer deeper than the mask\
    \ is purely so that we can scale it properly. When you create an empty movie clip\
    \ using code, the registration point of that clip is automatically set to the\
    \ top-left corner. This is fine for most things, but a nightmare when you want\
    \ to scale that clip. Because you can only alter the movie clip that a JPG is\
    \ loaded into rather than the JPG itself, you end up with an effect where the\
    \ JPG appears to move away from you as it grows. This is due to the fact you’re\
    \ scaling it from its top-left corner rather than the center, and annoyingly there’s\
    \ no way to change the registration point of a movie clip using code. The way\
    \ to get around this is to nest the JPG within another clip and center it within\
    \ that clip. This means that you can scale the holding clip and give the effect\
    \ of the JPG scaling smoothly from its center. It’s a bit of a convoluted method,\
    \ but it works in the end."
  merge: -1
  img_proc: true
- pgno: 215
  md: "The next thing to do is to set an onEnterFrame event handler on the root. We'll\
    \ use this to update the image scale every frame. First of all, we create variables\
    \ to store the new xmouse and ymouse co-ordinates in the current frame, then we\
    \ store the difference between these current co-ordinates, and the original co-ordinates:\n\
    \n```\n_root.onEnterFrame = function() {\n  _root.newx = _xmouse;\n  _root.newy\
    \ = _ymouse;\n  _root.xdiff = _root.newx-_root.origx;\n  _root.ydiff = _root.newy-_root.origy;\n\
    }\n```\n\nWe now check the state of the shiftTog variable. We'll come to shiftTog\
    \ in a minute, but basically it tells us if the SHIFT key is being pressed or\
    \ not. If the SHIFT key isn't down, then we simply scale the image according to\
    \ the difference between the original mouse position and the current mouse position.\
    \ We also add the original image scale to this value. If we didn't do this, then\
    \ the scale would immediately be set to 0 every time we clicked the mouse – it\
    \ would still work, it just wouldn't be as nice an effect:\n\n```\nif (_root.shiftTog\
    \ == false) {\n  JPGContainer._xscale =\n    _root.xdiff+_root.oldxscale;\n  JPGContainer._yscale\
    \ =\n    _root.ydiff+_root.oldyscale;\n}\n```\n\nIf the SHIFT key is held down,\
    \ then we run through a slightly more difficult set of actions. To constrain the\
    \ proportions, we check both axes to see which is the greater difference in mouse\
    \ position – that is, which is currently the bigger scale – and then set the other\
    \ axis to equal that one. Let's run through the code for the x-axis and see what\
    \ happens:\n\n```\nif (_root.shiftTog == true) {\n  if (_root.xdiff>_root.ydiff)\
    \ {\n    _root.newx = _root._xmouse;\n    JPGContainer._xscale =\n      _root.xdiff+_root.oldxscale;\n\
    \    JPGContainer._yscale =\n      _root.xdiff+_root.oldyscale;\n  }\n}\n```\n\
    \nWe first check to see if xdiff is greater than ydiff, and if it is then we only\
    \ update the newx position, and we set both the x and the y-scale to equal the\
    \ x difference. Basically then, whenever the x-scale grows, the y-scale is set\
    \ to be exactly the same size. The code for the y-axis is exactly the same, but\
    \ with the x-axis constrained:\n\n```\nelse {\n  _root.newy = _root._ymouse;\n\
    \  JPGContainer._xscale =\n    _root.ydiff+_root.oldxscale;\n  JPGContainer._yscale\
    \ =\n    _root.ydiff+_root.oldyscale;\n}\n```\n\nWhen you're happy with the scale,\
    \ you release the mouse and the image is swapped back under the drawPad, and the\
    \ draw tools are set back to the default pencil tool:\n\n```\njamJar.onRelease\
    \ = jamJar.onReleaseOutside\n  = function () {\n    jamJar.swapDepths(drawPad);\n\
    \    _root.onEnterFrame = undefined;\n    _root.allButsOff();\n    _root.mainButDraw.gotoAndStop(2);\n\
    \    funcFreeDraw();\n    _root.help.text = \"Click and drag to\n    draw pencil\
    \ lines\";\n  };\n```"
  merge: -1
  img_proc: true
- pgno: 216
  md: "The last thing that we need to do is set up the `Listener` for the `SHIFT`\
    \ key. The `Listener` is an object called `shiftList`. We perform two checks with\
    \ the `shiftList` object. The first of these is to detect when a key is pressed,\
    \ and if it is `SHIFT` (defined as constant `Key.SHIFT`) then `shiftTog` is set\
    \ to true:\n\n```\nshiftList = new Object();\nshiftList.onKeyDown = function()\
    \ {\n    if (Key.isDown(Key.SHIFT)) {\n    _root.shiftTog = true;\n    }\n};\n\
    ```\n\nWhen a key up is detected, we also check to see if the `SHIFT` key is down.\
    \ This may seem a little odd, but it is just an extra check to catch any keys\
    \ that were pressed while the `SHIFT` key was down. If this check wasn't here\
    \ then if you held down `SHIFT`, but then pressed and released another key whilst\
    \ `SHIFT` was still down, `shiftTog` would be wrongly set to false:\n\n```\nshiftList.onKeyUp\
    \ = function() {\n    if (Key.isDown(Key.SHIFT)) {\n    } else {\n    _root.shiftTog\
    \ = false;\n    }\n};\n```\n\nHere, we only act if the key is not down. We now\
    \ just need to add the `Listener`, and initialize `shiftTog` to false:\n\n```\n\
    Key.addListener(shiftList);\n_root.shiftTog = false;\n};\n```\n\nThat's it, the\
    \ scaling code is over, and I bet it wasn't that bad after all. One thing worth\
    \ noting is that if you scale your images to massive proportions, then Flash may\
    \ start to slow down quite a bit. If you're sensible with your scaling though,\
    \ then this shouldn't be a problem.\n\n# General tools\n\n# t-shirt mask\n\n![](img/50202c17d5022233f3e3ec60560e35aa_216_0.png)\n\
    \nOne of the major delights about this application for me is the ability to preview\
    \ the hard (or not so hard) work that I've put into making a t-shirt. If you're\
    \ a little confused about what I mean by preview, I mean super-tidying it up –\
    \ killing all unnecessary lines and presenting the colored t-shirt against a pristine\
    \ white background.\n\nIf you can't see my enthusiasm and need convincing, then\
    \ take a journey of cheese with Mr. Miyage:\n\n\"Mask on...\":\n\n![](img/50202c17d5022233f3e3ec60560e35aa_216_1.png)\n\
    \n\"Mask off...\":\n\n![](img/50202c17d5022233f3e3ec60560e35aa_216_2.png)\n\n\
    I hope you can see that the masked article is luscious and ready to be printed.\n\
    \nOkay, enough excitement already! Now onto the technical stuff...\n\nThe masking\
    \ process involves a number of masks and, above all these, a drawn outline to\
    \ keep the shape. The outline is found on the stage and looks like this:\n\n![](img/50202c17d5022233f3e3ec60560e35aa_216_3.png)"
  merge: -1
  img_proc: true
- pgno: 217
  md: "Now onto the actual masking.\n\nFirstly, masking the main t-shirt is a little\
    \ more complex than the JPG masking, simply because it has more things to mask.\
    \ The main mask has to hide the content of drawPad, square and jamJar.\n\nIt might\
    \ seem like overkill, but there are three masks working here. The reason for this\
    \ is because Flash masks can only mask one item each. Of course, you can mask\
    \ more items by nesting them, but it’s not always possible and you do lose a little\
    \ control.\n\nEven though there are three masks, you’ll be glad to know that one\
    \ is reused. When we first loaded in a JPG (see the load JPG code), a mask was\
    \ created for it called newtee to prevent it going outside the t-shirt area and\
    \ engulfing the whole interface. When the main mask is applied, the newtee mask\
    \ is told to mask the whole jamJar movie clip – this being the JPG mask (_global.JPGM)\
    \ and the JPG (_global.JPGContainer).\n\nThe other two masks are hidden on the\
    \ main stage, called tshirt and tshirt2. Both of these are instances of tshirt_mask:\n\
    \n![](img/50202c17d5022233f3e3ec60560e35aa_217_0.png)\n\n# Here is the code for\
    \ the main mask:\n\n```\nfuncMainMask = function () {\n\tif (_root.maskOn == false)\
    \ {\n\t\t_root.square.setMask(_root.tshirt2);\n\t\tdrawPad.setMask(_root.tshirt);\n\
    \t\tjamJar.setMask(_root.newtee);\n\t\t_root.maskOn = true;\n\t} else if (_root.maskOn\
    \ == true) {\n\t\tdrawPad.setMask(drawPadMask);\n\t\tJPGContainer.setMask(_root.newtee);\n\
    \t\t_root.square.setMask(null);\n\t\t_root.maskOn = false;\n\t}\n};\n```\n\nA\
    \ lot of this is quite simple and incredibly similar to the JPG mask script, using\
    \ a toggle to switch the masks on or off, and check its current state. The only\
    \ difference here is that some masking is changed depending on the states. Here\
    \ are the actions that take place:\n\n+   - The mask of drawPad is changed from\
    \ drawPadMask – a square the size of the drawing area – to tshirt when the mask\
    \ is on.\n+   - square is masked by tshirt2, and is unmasked (null) when the mask\
    \ is off.\n+   - newtee is used as a mask for the parent of jamJar when the mask\
    \ is on, and masks JPGContainer when it is off.\n\nThat’s it for the masking code.\
    \ There is nothing to it that we haven’t seen before."
  merge: -1
  img_proc: true
- pgno: 218
  md: "# # Clear tool\n\n![](img/50202c17d5022233f3e3ec60560e35aa_218_0.png)\n\nThe\
    \ clear tool is what you use when it all goes wrong. It deletes everything that\
    \ you've done so far, and starts you off again with a blank canvas and a pencil.\
    \ That sounds a bit drastic, and it is, so as with all drastic actions, you get\
    \ a second chance to confirm if that was really what you wanted to do. This is\
    \ done with an alert box that jumps to the center of the stage with the following\
    \ options:\n\n![](img/50202c17d5022233f3e3ec60560e35aa_218_1.png)\n\nThe first\
    \ thing that happens when the button is pressed is that we attach the clearCheck\
    \ alert box from the Library and position it in the center of the stage:\n\n```\n\
    ```actionscript\nfuncClearTool = function () {\n    _root.attachMovie(\"clearCheck\"\
    ,\n        \"clearCheck\", 111111);\n    _root.clearCheck._x = (Stage.width/2);\n\
    \    _root.clearCheck._y = (Stage.height/2);\n}\n```\n```\n\nWe then set up the\
    \ actions for each of the buttons. The \"yes\" button clears the drawPad, erasing\
    \ all of the drawings, and also wipes the JPG mask layer, and unloads the JPG\
    \ image as well. After this thorough bit of vacuuming, it then turns on the free\
    \ draw tool, corrects the help text, and then deletes the alert box from the stage:\n\
    \n```\n```actionscript\n_root.clearCheck.yesBut.onRelease =\n    function() {\n\
    \    drawPad.clear();\n    JPG.clear();\n    JPG.unloadMovie();\n    _root.allButsOff();\n\
    \    _root.mainButDraw.gotoAndStop(2);\n    _root.funcFreeDraw();\n    _root.help.text\
    \ = \"Click and drag to\n    draw pencil lines\";\n    removeMovieClip(_root.clearCheck);\n\
    };\n```\n```\n\nThe \"no\" button skips the first three lines of erasing code,\
    \ but then carries on exactly the same as the \"yes\" button. It just resets the\
    \ drawing tools to free draw mode and deletes the alert box from the stage:\n\n\
    ```\n```actionscript\n_root.clearCheck.noBut.onRelease =\n    function() {\n \
    \   _root.allButsOff();\n    _root.mainButDraw.gotoAndStop(2);\n    _root.funcFreeDraw();\n\
    \    _root.help.text = \"Click and drag to\n    draw pencil lines\";\n    removeMovieClip(_root.clearCheck);\n\
    };\n```\n```\n\nIf you'd prefer, you could store the previous tool in a temporary\
    \ variable so that if you chose to cancel the clear command, you'd be returned\
    \ to your exact state before you pressed the clear button."
  merge: -1
  img_proc: true
- pgno: 219
  md: '# # Outro


    As much as this application is finished, it is still ripe for improvements. When
    I was showing this to various people, they all requested a tool that wasn’t present,
    from the ubiquitous undo option to a text tool to a shape tool. The reality is,
    development of this application is never-ending...


    The emphasis in my version is on creating basic designs and compositions. The
    limit on the tools encourages people to be more creative and resourceful.


    Any news and updates to this application will be posted online at www.pinderkaas.com/foed_tshirt.
    If you do use this on your website, or make any amendments or improvements, please
    let me know through the contact on the website – I’d love to see other people’s
    interpretations of it!


    Enjoy...


    ![](img/50202c17d5022233f3e3ec60560e35aa_219_0.png)'
