- pgno: 178
  md: 'Just to recap on the OOP theory that we touched on earlier, we are passing
    arguments into drawLeaf via the setInterval action which was created when we made
    an instance of the Leaf object. The first instance we created is called leaf00Obj.
    This instance has a property named dir (or leaf00Obj.dir in this example), which
    has a value that came from an element in the leafMap array. The leaf00Obj instance
    also had a property called ID (leaf00Obj.ID) which is a setInterval action. So
    by tracing back the arguments and variables we’re using inside the drawLeaf function,
    we can see that:


    +   The sub-array elements of the leafMap array are passed into the Leaf class
    constructor function.


    +   The Leaf class constructor uses those elements passed into it as arguments
    to dynamically create properties that exist in each unique instance of the Leaf
    object, created when the class constructor is invoked.


    +   Those same properties are then passed into the setInterval action for each
    object instance as arguments, which are in turn passed into the drawLeaf function.


    Why am I explaining this? So you know that when the object instance named leaf00Obj
    calls the drawLeaf function and passes a whole bunch of properties belonging to
    leaf00Obj into drawLeaf as arguments, what looks like a variable like dir inside
    drawLeaf – for example:


    ```

    if(dir=="left")

    ```


    is really in actual fact referring to the dir property of leaf00Obj, or leaf00Obj.dir
    – the object that called the drawLeaf function in the first place via the setInterval
    action. It is important to understand this in order to know how the function works.


    Because the math required to animate a curve that curls out to the left is slightly
    different to a curve that curls out to the right, we need these two if statements
    to make it all work properly. Inside each if statement we declare two new variables,
    endX and endY, which are used to make the end point in our curve (the same point
    that corresponded to the x and y of the red movie clip in our mini-application).
    Every time the function drawLeaf is called, it also calls the function moveLeaf.
    This new function returns into drawLeaf two variables in the form of an array
    with two elements – stepArray[0] and stepArray[1]. Every time moveLeaf is called,
    it increases the value of the returned array so that when we subtract these numbers
    from the starting point (originX) in the drawLeaf function, the leaf will appear
    to animate out to the left. In the case of a leaf whose direction is out to the
    right, we add the values of the returned array so that the leaf appears to animate
    out to the right.


    After we declare the new end point for the leaf by making endX and endY equal
    values returned from the function moveLeaf, we have another if statement that
    checks to see if the end point of the curve (endX and endY) has reached the stop
    point for curve. If it has, we then clear the setInterval for the leaf object
    that is calling the drawLeaf.


    We also have another if statement inside the previous ones, that checks once the
    leaf has stopped animating to see if the variable plantSize has reached a value
    greater than 25. If it has, we reward users for sticking with us, by making our
    plant grow some flowers.


    Here we call the function makeFlower and pass some arguments into it. Essentially
    what we’re doing is a cut-down version of drawLeaf in that the function makeFlower
    also creates some empty movie clips and draws a flower in each one. The function
    also puts the flower at the end point of the curve for the leaf that executed
    the function in the first place.'
  merge: -1
  img_proc: true
- pgno: 179
  md: "Now that we've gotten all those `if` statements out of the way, let's take\
    \ a look at the next chunk of code:\n\nThe very last bit of code for this function\
    \ stops the fill for the leaf by saying:\n\n```\ncreateEmptyMovieClip(name, levelNum);\n\
    with (_root.plant[name]) {\n    beginFill(fillColor, 100);\n    lineStyle(1, outlineColor,\
    \ 100);\n    moveTo(originX, originY);\n}\n```\n\n```\nendFill();\n}\nupdateAfterEvent();\n\
    }\n```\n\nDoes this look familiar? In essence this code is the same as the code\
    \ that appeared inside the drawCurve function in our mini-application, with two\
    \ minor differences. The first difference is that instead of hard-coding the colors\
    \ for the fill and the outline of the leaves, we're using the variables fillColor\
    \ and outlineColor – variables that we created in the convertColors function on\
    \ the Date Actions layer way back at the beginning of this chapter. The math required\
    \ to draw the curves for each leaf are slightly different, so we then have an\
    \ if/else statement that draws the curves differently depending on whether the\
    \ leaf curls out to the left or the right. The statement looks like:\n\nNotice\
    \ the line updateAfterEvent(); – this wasn't required in our mini-application\
    \ but we use it here for the following reason. The function drawLeaf is being\
    \ executed by every leaf object instance every 10 milliseconds – much much faster\
    \ than the frame rate of our movie. The built-in function updateAfterEvent tells\
    \ Flash to update the screen every time this line is executed, so our animation\
    \ will display much more smoothly. Try commenting out the line and run the movie\
    \ again. You'll see that it runs much differently, most likely a lot faster, but\
    \ a lot less smoothly because the screen is only updating in time with the movie\
    \ frame rate. Using the updateAfterEvent function in this particular movie will\
    \ most likely use up a fair bit of processor power, so if you're at all concerned\
    \ about users viewing this movie on low-end machines, you might want to comment\
    \ out this line of code, or adjust how often the setInterval actions for each\
    \ leaf are run. The animation of the plant will be more jumpy, but you'll save\
    \ on processor power.\n\n```\nif (dir == \"left\") {\n    curveTo(controlX, controlY,\
    \ endX, endY);\n    curveTo((originX+thickness),\n    (originY-(100+thickness))),\n\
    \    originX, originY);\n} else if (dir ==\"right\") {\n    curveTo(controlX,\
    \ controlY, endX, endY);\n    curveTo((originX-thickness),\n    (originY-(100+thickness))),\n\
    \    originX, originY);\n}\n```\n\nSo that's really the meat and potatoes of the\
    \ project. Here's a quick run down of the other functions that appear at the end\
    \ of the Plant Actions layer.\n\n![](img/50202c17d5022233f3e3ec60560e35aa_179_0.png)"
