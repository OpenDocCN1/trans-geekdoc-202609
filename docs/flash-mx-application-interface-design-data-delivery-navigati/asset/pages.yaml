    isbn: 1-903450-50-0

    price: $49.99

    publication date: january 2002


    Forget school math class, **Flash Math** is about fun. It''s what you do in your
    spare time - messing around with little ideas until the design takes over and
    you end up with something **beautiful**, **bizarre**, or just downright **brilliant**.
    It''s a book of iterative experiments, generative design; a book of inspiration,
    beautiful enough to leave on the coffee table, but **addictive** enough to keep
