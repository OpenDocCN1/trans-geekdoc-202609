- pgno: 77
  md: "# Providing links\n\nThere is only one final step before we are finished, and\
    \ that is to add the link buttons to our content. We are going to take a slightly\
    \ different route in creating these buttons than we have used for the rest of\
    \ the site. With these buttons, we are going to extend movie clips to hold all\
    \ of the functionality of the subsection buttons as additional methods. This is\
    \ fairly easy to do and can be wonderfully modular for future projects. Before\
    \ we code this, however, let's quickly write the code that will place these new\
    \ clips on the stage. Of course, this is done in the addContent function as well.\n\
    \nOK, brace yourself, because I'm giving it to you all in one blow. Place this\
    \ code after the formatting of the info text box and before the attaching of the\
    \ image, all inside the addContent function:\n\n```\nvar linksNum = sections[currentSection].links.length;\n\
    var rows = Math.ceil(linksNum/2);\nfor (var i = 0; i < rows; i++) {\n    var props\
    \ = {};\n    props._x = windowWidth*.25 + margin;\n    props._y = windowHeight*.6\
    \ + subButtonHeight*i;\n    props.num = i;\n    content.attachMovie(\"subButtonSymbol\"\
    , \"b\" + i, i+1, props);\n}\nfor (var i = rows; i < linksNum; i++) {\n    var\
    \ props = {};\n    props._x = windowWidth*.75 + margin;\n    props._y = windowHeight*.6\
    \ + subButtonHeight*(i-rows);\n    props.num = i;\n    content.attachMovie(\"\
    subButtonSymbol\", \"b\" + i, i+1, props);\n}\n```\n\nIt might seem like a lot,\
    \ but the two for loops are actually almost identical, so it's really not so bad.\
    \ The first two lines of code at the top take the number of links in the currentSection\
    \ and use this to determine the number of rows to place the subButtons in. The\
    \ two for loops then run through the first column of rows, then the second. For\
    \ each subButton attached, I first create a new local object called props. I place\
    \ in props the coordinate position at which I want to place the new subButton.\
    \ I also include a property called num, which holds the links index position for\
    \ this particular subButton (it will need this number later to access its information).\
    \ With props all set, I attach the subButton and send props as the initObject,\
    \ which is an optional fourth parameter for attachMovie that allows you to give\
    \ and set properties for a newly attached movie clip. By doing it this way, my\
    \ subButton is automatically placed at the position I need it.\n\nAll right, now\
    \ with that set up, we need to write the code that will control our subButtons."
