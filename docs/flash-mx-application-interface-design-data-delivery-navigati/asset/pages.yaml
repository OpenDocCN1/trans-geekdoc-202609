- pgno: 193
  md: "# Interface elements\n\n# Buttons\n\nAll of the main buttons in the interface\
    \ are based upon the same model, and are made to work with the same code. Each\
    \ button is made up very simply of two frames, with a stop action on the first\
    \ frame to stop it running away. The first frame is the normal button state, and\
    \ has a white background, and the second frame is the button 'pressed' state,\
    \ and has a yellow background.\n\nThe buttons all use the same code, so it makes\
    \ sense to have the same function attached to them in the initial set up function,\
    \ rather than repeating the same code in separate functions for each button. The\
    \ way to do this in Flash is to use the call action. Here's the free draw tool\
    \ function call as an example:\n\n```\nmainButCall.call(mainButDraw,\n  funcFreeDraw,\
    \ undefined, \"Click and drag\n  to draw pencil lines\", \"Pencil Tool\");\n```\n\
    \nmainButCall is the name of the button initialization function, and we'll look\
    \ at how it works in a second. We then pass five parameters to this function –\
    \ let's just have a quick look at what they mean:\n\n+   mainButDraw – this is\
    \ the name of the movie clip on the stage that the function is going to be attached\
    \ to.\n\n+   funcFreeDraw – this is the name of the function that we want that\
    \ button to run when it is clicked.\n\n+   undefined – this is an extra parameter\
    \ that we can pass to a function that will be called by the button. In the majority\
    \ of cases in this FLA this is undefined, and we only really use it with the fillDraw\
    \ function to tell it where to draw to.\n\n+   \"Click and drag to draw pencil\
    \ lines\" – this is the help text that will be displayed at the bottom of the\
    \ screen when the tool is being used.\n\n+   \"Pencil Tool\" – this is the help\
    \ text that will be displayed when the user rolls the mouse over the button.\n\
    \nNow we know what we'll be passing to the function, let's take a look at the\
    \ function and see what we do with each parameter. (Remember the first parameter\
    \ called above is the name of the movie clip that the call action uses to attach\
    \ the function to, therefore this parameter is not passed on to the function itself).\n\
    \n```\nmainButCall = function (funcName, pass,\n  helpText, rollText) {\n  this.onRelease\
    \ = function() {\n    allButsOff();\n    this.gotoAndStop(2);\n    funcName(pass);\n\
    \    _root.help.text =\n      _root.help.prev=helpText;\n  };\n  this.onRollOver\
    \ = function() {\n    _root.help.prev = _root.help.text;\n    _root.help.text\
    \ = rollText;\n  };\n  this.onRollOut = function() {\n    _root.help.text = _root.help.prev;\n\
    \  };\n};\n```\n\nWhen you click a button, the first thing that happens is that\
    \ a function is called to turn off all of the buttons. This is just a lazy way\
    \ of not having to store the previous tool that was used, and I'll explain how\
    \ it works in a bit. The next thing that happens is that the current button goes\
    \ to its second frame (with the yellow background) to show that it's been clicked.\
    \ It then calls the relevant function that's associated with it, and finally sets\
    \ the help text that will be displayed at the bottom of the screen while the tool\
    \ is being used. The help text is just a dynamic text box that is set whenever\
    \ a button is clicked or rolled over."
  merge: -1
  img_proc: true
- pgno: 194
  md: "We also set onRollOver and onRollOut states for each button. These just display\
    \ tool tips at the bottom of the screen whenever you roll over a button so that\
    \ you can see what it does. The original help text is stored in a temporary variable,\
    \ and then reset when the user rolls off the button.\n\nNow for a quick look at\
    \ the super-complicated function to turn off all of the buttons:\n\n```\nallButtonsOff\
    \ = function () {\n   mainButDraw.gotoAndStop(1);\n   mainButLine.gotoAndStop(1);\n\
    \   mainButCurve.gotoAndStop(1);\n   mainButFill.gotoAndStop(1);\n   mainButClear.gotoAndStop(1);\n\
    \   maskDrawBut.gotoAndStop(1);\n   mainButScale.gotoAndStop(1);\n   applyMaskBut.gotoAndStop(1);\n\
    \   moveMaskBut.gotoAndStop(1);\n   moveJPGBut.gotoAndStop(1);\n   mainMaskBut.gotoAndStop(1);\n\
    \   loadJPGBut.gotoAndStop(1);\n   tempLayer.clear();\n   drawPad.onPress = drawPad.onRelease\
    \ =\n     drawPad.onReleaseOutside = undefined;\n   _root.a1.removeMovieClip();\n\
    \   _root.a2.removeMovieClip();\n   _root.ctrl.removeMovieClip();\n};\n```\n\n\
    This basically just runs through every button and sets it to frame 1 – its off\
    \ state – and then clears the temporary drawing layer, and makes sure there are\
    \ no actions attached to the drawPad. The last thing that it does is to remove\
    \ the three point clips that we'll be using for the curve tool from the stage.\n\
    \nThe color chips for the brush, fill, and t-shirt background work on exactly\
    \ the same principle. When they're clicked on, they turn themselves on, and the\
    \ other color chips off. They then set a variable on the root to let the color\
    \ code know which chip it is affecting.\n\n# Brush sizes\n\n![](img/50202c17d5022233f3e3ec60560e35aa_194_0.png)\n\
    \nThe brush size, brush alpha, and fill alpha tools are very simple. Each is basically\
    \ just a holder for an input text box. Each text box has a variable attached to\
    \ it, so that whenever a new value is typed into a box, the appropriate variable\
    \ is updated. This variable is then called upon by the code whenever the brush\
    \ size or one of the alpha values needs to be known.\n\n# The color palette\n\n\
    Colors are required in this drawing application for three things – the brush color,\
    \ the fill color and the t-shirt color. The neatest and most intuitive way of\
    \ displaying the available colors is by drawing a palette. Let's look at how it\
    \ was done here.\n\n# Making the palette\n\nWhen I've worked with color in a similar\
    \ way to this before, I used bitshifting and found the whole process a little\
    \ laborious. So, I decided to cheat this time, and use a simple procedure that\
    \ I came up with when working with JavaScript rendered HTML tables (inspired by\
    \ the graphci.com 2002 tableart competition, www.graphci.com/tableart, which I\
    \ was asked to judge).\n\nThe full color range produced with this method is the\
    \ standard web-safe palette of 216 colors. I'm not saying that I necessarily conform\
    \ to this palette all the time, but it makes the coding a little easier here because\
    \ the range of colors to reproduce is smaller.\n\nHere's the palette (I always\
    \ find these rather fetching):\n\n![](img/50202c17d5022233f3e3ec60560e35aa_194_1.png)"
  merge: -1
  img_proc: true
- pgno: 195
  md: "Let's take a look at the code to produce this. Firstly, a function to define\
    \ before we get down to the meaty stuff.\n\n```\nfunction setHex(hexColor) {\n\
    \  this.col = new Color(this);\n  this.col.setRGB(hexColor);\n}\n```\n\nNext we\
    \ set up some variables:\n\n```\nrows = 0;\ncolumns = 0;\ncount = 0;\ncolumnCount\
    \ = 24;\n```\n\nThis function is used throughout the code, for setting the color\
    \ of the aforementioned tools. It is quite simple but can be used for almost anything.\
    \ This function is used with the call command, so this applies to the object calling\
    \ it. We'll see the practical use of it in the next section of code.\n\nThe function\
    \ sets up a new Color object, for the object requesting it, and then sets its\
    \ color to hexColor.\n\nSo where does hexColor come from? Well, this is where\
    \ the cheating comes in, and the next bit of code comes into use. Let's look at\
    \ it bit by bit.\n\nTo understand these variables, it's important to know how\
    \ the grid is made. It's drawn from top left to bottom right, writing row by row.\
    \ columnCount represents the amount of columns or cells in each row, and is used\
    \ later to check whether we should shift onto the next row. count is used as a\
    \ standard variable to add to the instance name of each attached square, whereas\
    \ columns and rows are used for drawing positions.\n\nWe then set up the three\
    \ for loops:\n\n```\nfor (redi=0; redi<colorLen; redi++) {\nfor (greeni=0; greeni<colorLen;\
    \ greeni++) {\nfor (bluesi=0; bluesi<colorLen; bluesi++) {\n```\n\nOK, the first\
    \ thing I wanted to do was to limit the color scheme to a web-safe palette, limiting\
    \ the input to certain hex values. For those of you not versed in these values,\
    \ these are 00, 33, 66, 99, CC and FF, and by taking any three of these to create\
    \ a combination, you know you'll have a web-safe color. Pure red, for example,\
    \ has a hex value of #FF0000 (made up of FF Red, 00 Green and 00 Blue).\n\nWe\
    \ use the length of the colors array, set as colorLen (6 for each in this case)\
    \ as the maximum amount. These three loops will run the code 6x6x6 times, giving\
    \ us the magic number of 216.\n\nWith this considered, I started by setting up\
    \ an array, containing all the web-safe hex values:\n\n```\ncolors = new Array(\"\
    00\", \"33\", \"66\", \"99\",\n\"CC\", \"FF\");\ncolorLen = colors.length;\n```\n\
    \nAfter this comes the code executed in the for loops:\n\n```\nattachMovie(\"\
    sq\", \"sq\"+count, count);\nif (columns == columnCount) {\n  columns = 0;\n \
    \ rows++;\n}\ncolumns++;\n```\n\nThe second line of code here simply gets the\
    \ amount of elements in the array. This is used with the following loops.\n\n\
    Remember that this code is run 216 times – it might sound like a lot, but it's\
    \ instantaneous.\n\n![](img/50202c17d5022233f3e3ec60560e35aa_195_0.png)"
  merge: -1
  img_proc: true
- pgno: 196
  md: 'OK, the first line here doesn''t require much explanation – it just fetches
    a tiny square from the library. Be sure to change the shape of this if you want
    to spice up the appearance of the palette, or if you just want bigger icons.


    The conditional if statement on the next line performs a check to see if the current
    columns variable (aka the current column position) is the same as columnCount.
    If they are the same, then columns is reset, and rows is incremented. This is
    the equivalent of the typewriter reaching the end of the line, and that pleasurable
    ‘bing’ before you shift it to a new row. Lastly, columns is then incremented.


    Then we have three lines to perform the all important positioning of the current
    square:


    ```

    current = _root ["sq"+count] ;

    current._x =columns* (current._width) +530 ;

    current._y = rows* (current._height) +380 ;

    ```


    The x and y positions are set according to the variables columns and rows, multiplied
    by the width or height of the current square. The added figures at the end of
    each equation are just a manually calculated amount to place the grid at a certain
    place on the stage.


    We then call the getMeColor function to set the current square as a button, and
    then store the hex value for this current square:


    ```

    getMeColor.call (current) ;

    current.hexy = "0x"+colors [redi] +

    colors [greeni] +colors [bluesi] ;

    ```


    getMeColor is applied to every cell in the color palette, and depending on which
    element is requesting a color – be it brush, fill or t-shirt – it simply changes
    the chip color for that option and stores these colors on _root.


    ![](img/50202c17d5022233f3e3ec60560e35aa_196_0.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_196_1.png)


    The next line uses the aforementioned arrays to create a color, and stores it
    in a variable called hexy within the current instance. One color is made of a
    value of red, green and blue, each extracting a value from the arrays, dependent
    on the position within the nested for loops. The color is prefixed by 0x, to define
    it as a hex value.


    hexy is used importantly later on, to get the color of a square from the palette.


    The next line uses the setHex function to set the color of the current square:


    ```

    setHex.call (current , current .hexy ) ;

    count++ ;

    }

    }

    ```


    Once all the for loops have run, the whole body of this code creates our web-safe
    color palette. As you can see, the code here isn’t that difficult, and although
    the palette creation is incredibly simple, it is also extremely neat and efficient.
    Sure, it’s cheating (because a more professional way would be to numerically calculate
    the colors, and then bitshift them along rather than piecing together the numbers
    in an array), but it saves all those painful conversions from one format to another,
    and evil math.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# The tools


    # The pencil tool


    ![](img/50202c17d5022233f3e3ec60560e35aa_197_0.png)


    The pencil tool is the standard scribble based-tool – no frills, no nothing. Put
    the pencil onto the paper, scribble, and if you can muster up the will power,
    take the pencil off the paper.


    I like to think of this pencil tool as the equivalent of what most people do to
    post-it notes on the telephone – the creative action of drawing a continuous line,
    which creates random shapes and ever increasing complexity.


    It will not come as a surprise that the pencil tool – aka the FreeDraw tool –
    is easily the most basic to code.


    The general principle from a Flash and usability perspective is:


    ```

    Press mouse button to begin drawing,

    Draw a continuous line,

    UNTIL...

    The mouse button is released,

    Stop drawing.

    ```


    Not exactly rocket science, for sure.


    Let''s break it down into tasty chunks. Starting at the top:


    ```

    funcFreeDraw = function () {

    _root.freeDraw = function() {

    if (_root.xmouse != oldX &&

    _root.ymouse != oldY) {

    ```


    After the function declarations is a conditional to check whether the last xmouse
    (oldX) and ymouse (oldY) readings are any different to the current ones. This
    check is performed just in case the user continues to hold down the mouse button
    without moving the cursor, and it saves Flash drawing on the same spot unnecessarily.


    If the last and current readings are different then the code begins:


    ```

    if (_root.penDown == 0) {

    drawPad.moveTo(_root._xmouse,

    _root._ymouse);

    _root.penDown = 1;

    } else {

    ```


    This code checks firstly to see if the pencil is not already held down. This is
    performed because we need to know if the user is already drawing, or has their
    pencil off the paper. If the pencil is off the paper, then it will start drawing
    from where the user clicks the mouse. From then on, you can draw freeform.


    The penDown state tells Flash if the pencil is currently touching the paper. Before
    you click to draw, it is set to 0, and after you''ve clicked it is set to 1. From
    now on, whilst the pencil is down, the following code will be run:


    ```

    if (_root.xmouse>tabletleft &&

    _root.xmouse<tableright) {

    oldX = _root.xmouse;

    }

    if (_root.ymouse>tablettop &&

    _root.ymouse<tabletbottom) {

    oldY = _root.ymouse;

    }

    ```


    The if statements on lines 1 and 4 here check to see if the pencil is drawing
    within the given area. (Remember that the global variables for the drawing boundary
    were defined at the start of the code.)'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'If the pencil is within these constraints, then oldX and oldY are updated to
    reflect the current mouse position on both axes.


    If the readings suggest that the positions are outside either axis, then oldX
    and/or oldY aren''t changed.


    We then need to draw the line itself:


    ```

    drawPad.lineStyle(

    _root.mainButBrushSize.bSize, _root.col,

    _root.mainButBrushAlpha.bAlpha);

    drawPad.lineTo(oldX, oldY);

    }

    };

    ```


    The first line here simply sets the lineStyle for drawing, taking attributes written
    from the brushes input boxes.


    The second line draws a line from the current mouse position to the end of the
    last line (oldX and oldY).


    The last section of code sets the functions to run on mouse button activity:


    ```

    drawPad.onPress = function() {

    _root.penDown = 0;

    freeDrawInterval = setInterval

    (function() { freeDraw(); }), 10);

    };

    ```


    The onPress code here simply defines the code that is carried out when the mouse
    button is pressed. The first thing that happens is that the penDown flag is set
    to 1, and this, if you remember from the start of the function above, tells Flash
    to perform a moveTo to the current mouse position.


    After this, a setInterval action is set, telling Flash to run the freeDraw function
    every 10 milliseconds. This is used as opposed to the onEnterFrame code because
    it runs a little more regularly. Sometimes onEnterFrame is affected by the frame
    rate and we want this to run regularly.


    Here''s the last of the code for the pencil tool:


    ```

    drawPad.onRelease =

    drawPad.onReleaseOutside=function () {

    clearInterval(freeDrawInterval);

    };

    };

    ```


    This batch of code is set to run in the event of an onRelease or onReleaseOutside.


    A word of warning here. When you write code like this using double declarations...


    ```

    me.onRelease = me.onReleaseOutside = function () {

    doThis();

    nowThis();

    }

    ```


    ... make sure you don''t reformat your code, as Flash tends to stick all the function
    code in one line and you end up with unreadable code like this:


    ```

    me.onRelease = me.onReleaseOutside = function () {doThis();nowThis();}

    ```


    It''s super-annoying, believe me...


    Anyway, back to the code. When the mouse is released, the setInterval method is
    cleared, and the drawing is stopped.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'That concludes the pencil tool, as I said, it''s not tricky to understand.
    It doesn''t use the preview instance, like the line or curve tools, and just draws
    straight onto the pad. If anything the pencil tool is incredibly crude and unsophisticated,
    but it is one of the tools that I''m more likely to use.


    It also rocks when you play with the brush thickness and alpha.


    You might find yourself using a virtual pad when you run out of paper, or if you
    suddenly become worried about the decline of the rainforests. See post_it.fla
    for the pencil tool in a post-it stylelee. Paul Davis eat your heart out.


    ![](img/50202c17d5022233f3e3ec60560e35aa_199_0.png)


    # Line tool


    ![](img/50202c17d5022233f3e3ec60560e35aa_199_1.png)


    There are two standard line drawing methods in drawing applications. The first
    is to click on a point to start the line, and then drag and release to fix the
    point where you want the line to end. The second method (sometimes called rubber-banding)
    is to click once to fix the first point, then click again to fix the second point,
    again to fix the third, and so on drawing out a continuous line. We chose to use
    the first method, but it would be a simple task to change the code to the second
    method if you preferred.


    ![](img/50202c17d5022233f3e3ec60560e35aa_199_2.png)


    The line drawing tool is similar in execution to the freehand drawing tool, but
    with an important difference – instead of drawing directly onto the drawPad layer,
    we instead draw onto a preview layer first, and then fix the line onto the drawPad
    when the mouse is released.


    The main line draw function is split into two parts, what happens when you press
    and drag the mouse on the drawPad, and what happens when you release it. Let''s
    look at the onPress actions first.'
  merge: -1
  img_proc: true
- pgno: 200
  md: "The initial thing we do is record the x and y positions of the mouse, and store\
    \ them as startX and startY:\n\n```\nfuncLineDraw = function () {\n    drawPad.onPress\
    \ = function() {\n        _root.startX = _root._xmouse;\n        _root.startY\
    \ = _root._ymouse;\n    };\n```\n\nWe then set up an onEnterFrame action on the\
    \ root so that we can update the position of the preview line every frame. We\
    \ place the event handlers on the root to ensure that they overwrite each other\
    \ and there's no chance of two being run at the same time. We defined a global\
    \ variable (tempLayer) for the position of the temporary layer earlier in the\
    \ code, so we'll use that throughout this function. The first thing that we need\
    \ to do every frame is to clear whatever was previously in the temporary layer\
    \ so that there's only ever one line on it:\n\n```\n_root.onEnterFrame = function()\
    \ {\n    tempLayer.clear();\n};\n```\n\nIf you remove this line you can make some\
    \ lovely patterns, but they're not really the effect we're after here:\n\nAfter\
    \ clearing the layer, we define the lineStyle according to the current settings,\
    \ and move the drawing position to the original coordinates set when we clicked\
    \ the mouse:\n\n```\ntempLayer.lineStyle(_root.mainButBrushSize.bSize,\n    _root.col,root.mainButBrushAlpha.bAlpha);\n\
    tempLayer.moveTo(_root.startX, _root.startY);\n```\n\nWe now run through a bit\
    \ of boundary checking code to make sure that we don't draw outside the drawPad.\
    \ This code is the same as it was for the pencil drawing tool – it checks to see\
    \ if we're over the boundaries, and if we're not then it sets a variable (_root.xM\
    \ & _root.yM) to hold the new mouse position, but if we are then it keeps the\
    \ old position. We then draw a line from the original coordinates to the new ones:\n\
    \n```\nif (_root._xmouse>tabletleft && _root._xmouse<tabletright) {\n    _root.xM\
    \ = _root._xmouse;\n}\nif (_root._ymouse>tablettop && _root._ymouse<tabletbottom)\
    \ {\n    _root.yM = _root._ymouse;\n}\ntempLayer.lineTo(_root.xM, _root.yM);\n\
    });\n```\n\n![](img/50202c17d5022233f3e3ec60560e35aa_200_0.png)\n\n![](img/50202c17d5022233f3e3ec60560e35aa_200_1.png)\n\
    \n![](img/50202c17d5022233f3e3ec60560e35aa_200_2.png)\n\n![](img/50202c17d5022233f3e3ec60560e35aa_200_3.png)"
  merge: -1
  img_proc: true
- pgno: 201
  md: 'This line is redrawn every frame, and we get a nice smooth line from the start
    point to wherever we move the mouse.


    When we release the mouse, we run through a similar set of actions, but we draw
    to the drawPad instead of to the tempLayer. First of all, we clear the tempLayer
    to delete the temporary line that we''d been using:


    ```

    drawPad.onRelease = drawPad.onReleaseOutside=function () {

    tempLayer.clear();

    }

    ```


    We then set the lineStyle of the drawPad, and draw a line from the original start
    point to the last mouse position points. We also set the _root.onEnterFrame handler
    to be undefined, as we''ve finished with it until next time we click the mouse.


    ```

    drawPad.lineStyle(_root.mainButBrushSize.bSize, _root.col, _root.mainButBrushAlpha.bAlpha);

    drawPad.moveTo(_root.startX, _root.startY);

    drawPad.lineTo(_root.xM, _root.yM);

    _root.onEnterFrame = undefined;

    });

    };

    ```


    And that''s all there is to the line tool. It''s very simple, but you can make
    some great effects with it:


    ![](img/50202c17d5022233f3e3ec60560e35aa_201_0.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_201_1.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_201_2.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_201_3.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_201_4.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_201_5.png)'
  merge: -1
  img_proc: true
- pgno: 202
  md: "# Curve tool\n\n![](img/50202c17d5022233f3e3ec60560e35aa_202_0.png)\n\nThe\
    \ curve tool is a little more complicated than the other drawing tools, but it's\
    \ still fairly straightforward. The actual drawing method is similar to the line\
    \ tool, in that we draw onto the same temporary layer first, and then fix it to\
    \ the drawPad when we're done. The main difference comes with the way curves are\
    \ actually drawn in Flash. For a straight line we only have two points, the start\
    \ and the end, but for a curve we have three points, the start anchor, the end\
    \ anchor, and the control point. Flash uses a Bezier drawing system, but for ease\
    \ of understanding we can substitute this for a trajectory metaphor.\n\nThe bird\
    \ then, is our control point. Whenever it moves and starts squawking again, you\
    \ throw another ball, the magnet pulls it in, and the shape of the curve changes.\
    \ As I said, this isn't exactly what happens in Flash but it should give you a\
    \ bit more of an understanding of why the curve is the shape that it is. The best\
    \ way to really understand it is to run the program and have a play with it.\n\
    \nOK, that's the theory dealt with, now on to the code. The first thing that we\
    \ do is to define a couple of functions, but I'm going to explain it in the order\
    \ that it happens, rather than the code order, so bear with me. The first thing\
    \ that happens when you click on the curve tool button is that you are asked to\
    \ click three points to set the initial positions of the anchor and control points.\n\
    \nImagine that you're standing in a big field with an unlimited pile of metal\
    \ balls by your side. About 20 feet away from you is a large and powerful magnet,\
    \ and whenever you throw a ball, it is pulled onto the magnet. You and the magnet\
    \ represent the anchor points of the curve, and the trajectory of the ball when\
    \ you throw it describes the shape of the curve. Now, to make this example even\
    \ weirder, imagine there's an annoying bird hovering in the air and squawking\
    \ at you. You throw a ball with the perfect power and accuracy to hit the bird,\
    \ but before it gets there, the magnet pulls the ball back to the ground:\n\n\
    There are three movie clips in the Library with the linkage names, a1, a2, and\
    \ ctrl – these are the simple circles that will represent our anchor and control\
    \ points. We first initialize the clickedPoints variable at 0, and then set up\
    \ an onRelease handler on drawPad. We then run through a simple series of if statements\
    \ to check if we're on our first, second, or third click. The actions we take\
    \ for each are pretty similar, so I'll only run through the first one:\n\n```\n\
    ```\nif (clickedPoints == 0) {\n  _root.attachMovie(\"a1\", \"a1\", 22220);\n\
    \  _root.a1._x = _xmouse;\n  _root.a1._y = _ymouse;\n  clickedPoints++;\n}\n```\n\
    ```\n\n![](img/50202c17d5022233f3e3ec60560e35aa_202_1.png)\n\nHere, we attach\
    \ the appropriate clip from the library and set its depth level. We then position\
    \ it according to the mouse position and increment the clickedPoints variable\
    \ to move on to the next one."
  merge: -1
  img_proc: true
- pgno: 203
  md: "Next, we draw the initial call onto the tempLayer, and change the help text\
    \ to explain what to do next:\n\n```\ndrawCurve.call(tempLayer, a1, ctrl, a2);\n\
    _root.help.text = \"Drag green anchor\npoints to position curve, then drag and\n\
    release control point to fix curve and\ncolor\";\n```\n\nFinally, we increment\
    \ clickedPoints once more, so that we don't create any more circles when we click,\
    \ and attach the previewCurve function to each of the movie clips:\n\n```\nclickedPoints++;\n\
    }\npreviewCurve.call(_root.a1);\npreviewCurve.call(_root.a2);\npreviewCurve.call(_root.ctrl);\n\
    };\n```\n\nOK, that's all of the initialization done – now we move on to updating\
    \ the preview curve each frame. Much of this code is similar to the line tool\
    \ code, so I'll skip over some of it and focus on the parts that have changed.\
    \ We set up the anchor points to be draggable, but constrained to the square drawing\
    \ tablet:\n\n```\npreviewCurve = function () {\n    this.onPress = function()\
    \ {\n        tempLayer.clear();\n        if (this != ctrl) {\n            this.startDrag(true,\
    \ tabletleft,\n            tablettop, tabletright,\n            tablebottom);\n\
    \        }\n    }\n}\n```\n\nThe control point is slightly different though:\n\
    \n```\nelse {\n    this.startDrag(true);\n}\n```\n\nIf we constrained that to\
    \ the square then you wouldn't be able to draw very big curves. To get around\
    \ this, we'll allow the control point to be dragged anywhere on the stage. The\
    \ curve itself will still be masked within the square so that it doesn't get all\
    \ over the interface, but you can now have a lot more control over the shape of\
    \ your curves. We'll get to what happens when you release it in just a second.\n\
    \nFirst though, we'll set an onEnterFrame handler on the root to redraw the curve\
    \ every frame:\n\n```\n_root.onEnterFrame = function() {\n    tempLayer.clear();\n\
    \    tempLayer.lineStyle\n    (_root.mainButBrushSizebSize, 0x000000, 100);\n\
    \    _root.point1x = _root.a1_.x;\n    _root.point1y = _root.a1_.y;\n    tempLayer.moveTo(_root.point1x,\n\
    \    _root.point1y);\n    tempLayer.curveTo(_root.ctrl_.x,\n    _root.ctrl_.y,\
    \ _root.a2_.x, _root.a2_.y);\n};\n```\n\nThis code is the same as that we used\
    \ for the line tool, the only difference being that we're using curveTo instead\
    \ of lineTo, and feeding it our extra set of coordinates. We set the preview curve\
    \ to always be black and 100% alpha so that you can clearly see the shape of the\
    \ curve that you're drawing."
  merge: -1
  img_proc: true
- pgno: 204
  md: "When we release the mouse, we also want different actions for the points. The\
    \ anchor points will just stop dragging, as they are already constrained to the\
    \ square, but the control point has some extra code:\n\n```\n```\nthis.onRelease\
    \ = this.onReleaseOutside =\nfunction () {\n    this.stopDrag();\n    if (this\
    \ == ctrl) {\n        drawCurve.call(drawPad, a1, ctrl, a2);\n        tempLayer.clear();\n\
    \        if (_root.ctrl._x > tabletright) {\n            _root.ctrl._x = tabletright;\n\
    \        }\n        if (_root.ctrl._x < tabletleft) {\n            _root.ctrl._x\
    \ = tabletleft;\n        }\n        if (_root.ctrl._y < tablettop) {\n       \
    \     _root.ctrl._y = tablettop;\n        }\n        if (_root.ctrl._y > tabletbottom)\
    \ {\n            _root.ctrl._y = tabletbottom;\n        }\n    }\n    _root.onEnterFrame\
    \ = undefined;\n});\n```\n```\n\n```\n```\ndrawCurve = function (clip1, control,\
    \ clip2) {\n    this.lineStyle\n    _root.mainButBrushSize.bSize,\n    _root.col,\n\
    \    _root.mainButBrushAlpha.bAlpha);\n    this.moveTo(clip1._x, clip1._y);\n\
    \    this.curveTo(control._x, control._y,\n    clip2._x, clip2._y);\n});\n```\n\
    ```\n\nThere is a glitch in the Flash curve drawing engine that you may see cropping\
    \ up from time to time. If the anchor points and the control point are all in\
    \ a straight line with both of the anchor points on one side, then the line drawn\
    \ will often go a bit strange, like this:\n\n![](img/50202c17d5022233f3e3ec60560e35aa_204_0.png)\n\
    \nWhen we release the control point, we first fix the curve onto the drawPad and\
    \ clear the tempLayer, but we then snap the position of the movie clip back so\
    \ that it's inside the square. We do this by simply checking if the control point\
    \ is outside of the square on each of its axes, and setting it back to the edge\
    \ of the square if it is. Finally, we undefine the root onEnterFrame handler.\n\
    \nThis shouldn't be too much of a problem though, as you'll normally be drawing\
    \ straight lines with the line tool, not the curve tool.\n\nThe last function\
    \ to explain for the curve tool is the actual drawCurve function. This function\
    \ very simply takes the positions of the three points, and draws the curve between\
    \ them, setting it to the correct lineStyle as it goes:"
  merge: -1
  img_proc: true
- pgno: 205
  md: '# Fill draw


    ![](img/50202c17d5022233f3e3ec60560e35aa_205_0.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_205_1.png)


    The fill draw tool is virtually the same as the pencil tool, with the added bonus
    of a lovely fill. The fill becomes cool when you change its alpha, so you can
    get a bit more depth.


    During the planning stage, I came up with the following structure:


    ```

    Press mouse button to begin drawing,

    Do a beginFill declaration,

    Draw a continuous line,

    UNTIL...

    The mouse button is released,

    Stop drawing,

    End the fill and close the shape.

    ```


    The problem with this is when you call the beginFill method while Flash draws,
    it fills continuously and creates some bizarre and irrational shapes. The general
    rationale with the beginFill and endFill methods is that if the shape drawn with
    lineTo is unfinished – not a complete shape – then Flash finishes the shape as
    it sees best and fills it.


    The problem with the live drawing attempt was that Flash was finishing and filling
    the shape at every interval, and this gave some crazy sharp geometric shapes,
    and loads of ugly extra lines where Flash finished the shape itself. The renditions
    this comes up with are bizarre wireframe and 3Desque, and are fun to play with,
    but impossible to actually make anything of much use in a drawing app. Unless
    you make a totally irrational and random drawing app of course (a bit like Auto-Illustrator!...).


    SpecDraw_fill.fla shows the general live fill drawing principle.


    To get over this live filling, I decided to store the drawing routine in an array
    from the onPress and draw and fill the shape onRelease. The stored drawing is
    drawn in a temporary movie clip, and then cleared when the mouse button is released.'
  merge: -1
  img_proc: true
- pgno: 206
  md: "So the tool resembles the pencil tool, until the mouse button is released and\
    \ the shape is redrawn and filled. By the way, rather than trust Flash's way of\
    \ completing a shape, I stored the initial xmouse and ymouse positions and did\
    \ a lineTo back to them after all the other strokes. Although Flash does this,\
    \ sometimes it is best to leave nothing to chance. This method overrides any possible\
    \ errors, and gives me peace of mind!\n\nThe first bit of code is very similar\
    \ to the code for the pencil tool:\n\n```\nfuncFillDraw = function (layerToDraw)\
    \ {\n\t_root.penDown = 1;\n\tdraw = function (layerToDraw) {\n\tif (_root.xmouse\
    \ != oldX &&\n\t_root.ymouse != oldY) {\n\tif (_root.penDown == 1) {\n\t_root.moveX\
    \ = _root.xmouse;\n\t_root.moveY = _root.ymouse;\n\tdrawPad.moveTo(moveX, moveY);\n\
    \t_root.penDown = 0;\n```\n\nThe main addition here is the storage of the initial\
    \ xmouse and ymouse positions in the variables moveX and moveY. As mentioned earlier,\
    \ these variables are used when redrawing the lines, and we need to finish the\
    \ shape correctly, and are also used to move to the start point before commencing\
    \ the redraw.\n\nThe next lines set up the tempLayer movie clip, ready for drawing\
    \ a preview shape:\n\n```\ntempLayer.lineStyle (_root.mainButBrushSize\n\t.bSize,\
    \ _root.col,\n\t_root.mainButBrushAlpha.bAlpha);\ntempLayer.moveTo(_root.moveX,\
    \ _root.moveY);\n} else {\n```\n\nThe same brush styles are used here, to give\
    \ the best and most authentic preview. The idea is to not let the user know that\
    \ this is happening, as they might be annoyed by the thought that their creative\
    \ strokes are being replicated by an automaton.\n\nThen comes another section\
    \ of code that should look familiar from studying the pencil tool:\n\n```\nif\
    \ (_root.xmouse>tabletleft &&\n\t_root.xmouse<tabletright) {\n\toldX = _root.xmouse;\n\
    }\n\nif (_root.ymouse>tablettop &&\n\t_root.ymouse<tabletbottom) {\n\toldY = _root.ymouse;\n\
    }\n\ntempLayer.lineTo(oldX, oldY);\n_root.xStore[_root.count] =\n\t_root.oldX;\n\
    _root.yStore[_root.count] =\n\t_root.oldY;\n_root.count++;\n}\n\n});\n```\n\n\
    After the boundary checks, a line is drawn on the temporary layer, and then oldX\
    \ and oldY are stored in the xStore and yStore arrays. These are the arrays used\
    \ to store the co-ordinates ready to redraw the previewed strokes made by the\
    \ user."
  merge: -1
  img_proc: true
- pgno: 207
  md: "We then set what happens when the user presses the mouse button, putting the\
    \ pen down:\n\n```\ndrawPad.onPress = function() {\n    _root.penDown = 1;\n \
    \   _root.count = 0;\n    _root.xStore = new Array();\n    _root.yStore = new\
    \ Array();\n\n    layerToDraw.lineStyle\n    (_root.mainButBrushSize.bSize,\n\
    \    _root.col,\n    _root.mainButBrushAlpha.bAlpha);\n    fillInterval = setInterval(function\
    \ ()\n    { _root.draw(layerToDraw); }, 10);\n};\n```\n\nMost of this will be\
    \ familiar from the pencil tool, with the exception of the array declarations.\
    \ Basically, each time the mouse button is pressed with this tool selected, the\
    \ array is reinitiated, deleting the previous version of it. This wipes the slate\
    \ clean of the last stored co-ordinates.\n\nNext comes the code for when the mouse\
    \ button is released:\n\n```\ndrawPad.onRelease = drawPad.\nonReleaseOutside=function\
    \ () {\n    _root.penDown = 0;\n    clearInterval(fillInterval);\n    tempLayer.clear();\n\
    };\n```\n\nAgain, this is old ground, with the exception of the clear method run\
    \ on the temporary layer. This is run because the next piece of code reproduces\
    \ the strokes from the stored arrays, so we no longer need the temporary layer.\n\
    \nNow for the interesting bit – this is the major difference between this tool\
    \ and the pencil tool:\n\n```\nlayerToDraw.beginFill(\n    _root.fillCol,\n  \
    \  _root.mainButFillAlpha.fAlpha);\nlayerToDraw.lineStyle\n    (_root.mainButBrushSize.bSize,\
    \ _root.col,\n    _root.mainButBrushAlpha.bAlpha);\nlayerToDraw.moveTo(_root.moveX,\n\
    \    _root.moveY);\nfor (d=0; d<_root.xStore.length; d++) {\n    layerToDraw.lineTo(_root.xStore[d],\n\
    \    _root.yStore[d]);\n}\nlayerToDraw.lineTo(_root.moveX, _root.moveY);\nlayerToDraw.endFill();\n\
    };\n```\n\nThese lines of code take all the stored co-ordinates and draw the same\
    \ shape that the user had previously drawn (but we had maliciously deleted with\
    \ the clear method). There is nothing too complicated here, it's standard array\
    \ storage, with values extracted with a for loop.\n\nThe first line sets up the\
    \ fill style with the all-important beginFill method, taking the color and alpha\
    \ from those set in the interface by the user. This is swiftly followed by the\
    \ lineStyle setup, also captured from the interface text boxes.\n\nThe next line\
    \ moves the drawing co-ordinates to the initial position defined at the press\
    \ and stored with moveX and moveY.\n\nThen a for loop is run, running the length\
    \ of the xStore array. The loop could be run from the yStore array, as they would\
    \ both give the same figure.\n\nWithin the loop is the drawing code, drawing a\
    \ continuous line from the last position (initially defined with the moveTo to\
    \ moveX and moveY) to the next position taken from the xStore and yStore arrays.\n\
    \nOnce the loop is finished, a line is drawn to the initial position (moveX and\
    \ moveY) to complete the shape, and the fill is ended with endFill."
  merge: -1
  img_proc: true
- pgno: 208
  md: '# Importing and masking a JPG


    When I think back to why I thought of making this drawing app, I suppose the new
    JPG loading functionality of MX inspired me. Although I think the ability to load
    JPGs on the fly makes Flash MX ‘mature’, the way that it works with them leaves
    a lot to be desired. Of all the functionality of the application, the JPG took
    the most testing – at times the head was banging against the wall.....


    # Load JPG tool


    ![](img/50202c17d5022233f3e3ec60560e35aa_208_0.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_208_1.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_208_2.png)


    There isn’t much to this tool on the face of things, but a great deal goes on
    here.


    # Issues with dynamic image loading


    Before we get onto the code for the load JPG tool, it’s worth looking at some
    of the issues with the dynamic image loading.


    +   1. Flash MX will only load non-progressive JPGs.


    That’s right, Flash refuses to work with progressive JPGs – it will load them
    but not display them – and any other standard image formats such as GIF or PNG.


    I know the reason behind this is down to the size of the Flash 6 plugin. The more
    formats supported, the bigger the plugin, and it is Macromedia’s intention to
    keep it small. Great for the consumer, a little disappointing for Flash developers.


    A way of getting around this is by using a server-side script to process the inputted
    JPG and re-export it as a non-progressive JPG image. This might involve some copyright
    issues though as you will have to fetch the image from the original URL location
    and place it on your server.


    +   2. Flash MX dynamic JPG loading seems to have issues with browser cache.


    During the testing phase of the application, I noticed that Flash seems to sometimes
    refuse to load JPGs when embedded in a browser.


    Even though Flash’s Test Movie mode and the Flash Player seem to work fine, when
    the Flash SWF is embedded in HTML and run in Internet Explorer, it seems to load
    one image and then refuses to load another image afterwards. Netscape seemed to
    work fine in tests though.


    I think this might be down to a problem caused by Internet Explorer’s caching
    system, and the fact that you can’t turn off caching on a PC. The reason I say
    this is because I tested the SWF on Mac IE 5 with the cache set to 0MB, and the
    whole thing worked fine, any higher and the issue returns.'
  merge: -1
  img_proc: true
- pgno: 209
  md: "However, if an image is already in cache – say another browser window has it\
    \ open – then the image will load in. With this in mind, a JavaScript pop-up solution\
    \ would work fine, that is, if you like windows popping up everywhere...\n\nAs\
    \ you can guess, this all makes for a pretty ugly situation. If you are testing\
    \ the SWF in a browser, don't hold your breath for a second image.\n\nA known\
    \ way to get around this caching is to send a query string with a random number\
    \ to a server-side script, preventing IE from caching it explicitly.\n\n# How\
    \ it works\n\nAfter all that evil, let's assess the functionality of the tool.\
    \ The load JPG tool works by opening a dialog box, which requests the URL or location\
    \ of a JPG image file. This location can be relative to the SWF's position, or\
    \ absolute, with web prefixes.\n\n![](img/50202c17d5022233f3e3ec60560e35aa_209_0.png)\n\
    \nIf you are testing the SWF offline, just stick a JPG in the same folder as the\
    \ SWF and call that in. It will save a bit of typing and downloading.\n\nOnce\
    \ the GO button has been clicked, the image is fetched (if it exists) and the\
    \ percentage loaded is displayed and updated.\n\nWhen the image has fully loaded,\
    \ the dialog disappears and the image is resized to 200 x 200 pixels, and positioned\
    \ at the center of the t-shirt, regardless of its original size. The JPG scale\
    \ tool was included to allow the user to resize the image.\n\nThe code is made\
    \ up of two primary functions – funcLoadJPG and loadImage. The former performs\
    \ all the graphic and progress duties, whilst the loadImage function does the\
    \ loading and completion tasks.\n\nThere is quite a lot of code here, but nothing\
    \ that we can't handle.\n\nFirst of all, we declare the function and call up the\
    \ dialog box:\n\n```\nfuncLoadJPG = function () {\n  _root.attachMovie(\"loadJPGBox\"\
    ,\n    >>\"loadJPGBox\", 111111);\n  _root.loadJPGBox._x = (Stage.width/2);\n\
    \  _root.loadJPGBox._y = (Stage.height/2);\n  Selection.setFocus\n  >>(\"_root.loadJPGBox.urlText\"\
    );\n}\n```\n\nloadJPGBox is pulled in from the Library and given the same name\
    \ on the stage. It is then positioned on the screen.\n\nThe next line gives the\
    \ urlText input field of the dialog box the text cursor's focus, using the Selection\
    \ object. This object is pretty useful for any input situation, where normally\
    \ the user would have to select a text box to proceed. This gives a degree of\
    \ automation, and allows immediate typing from the user.\n\nThis next bit of code\
    \ sets up the initial code for the GO button of the dialog box:\n\n```\n_root.loadJPGBox.goBut.onRelease\
    \ = function() {\n  JPG.unloadMovie();\n  _root.loadImage\n  >> (_root.loadJPGBox.urlText.text);\n\
    \  _root.loadJPGBox.\n  loadJPGBoxText.text = \"Please\n  >> wait... loading JPG\\\
    rIf nothing\n  >> happens for a long time,\\rplease\n  >> hit Cancel and try another\
    \ image\";\n  _root.loadJPGBox.goBut._visible =\n  >> false;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 210
  md: "The first thing that happens is that JPG is cleared. JPG is defined a little\
    \ later, but is basically the container for our loadMovie calls. The next line\
    \ calls the loadImage function – defined in a moment – sending the input of the\
    \ dialog text box.\n\nAfter this we set the text of the dialog box, informing\
    \ the user of the current status. By the way, if you've every wondered what the\
    \ \\r is here, it is basically a line break, the equivalent of <br> in HTML or\
    \ \\n in numerous other scripting languages.\n\nThe last line disappears the GO\
    \ button – as we don't need it any longer. It has fulfilled its aim and reason\
    \ for existence.\n\nThis next bit of code checks every frame to see if the image\
    \ has loaded before resetting the buttons, switching on the pencil tool and removing\
    \ the dialog box:\n\n```\n_root.loadJPGBox.onEnterFrame =\n    function () {\n\
    \    if (JPG.getBytesLoaded() ==\n        JPG.getBytesTotal() &&\n        JPG.getBytesTotal()\
    \ != 0) {\n        _root.allButsOff();\n        _root.mainButDraw.gotoAndStop(2);\n\
    \        _root.funcFreeDraw();\n        _root.help.text = \"Click and drag\n \
    \       to draw pencil lines\";\n        removeMovieClip(_root.loadJPGBox);\n\
    \    }\n});\n};\n```\n\nWe reset to the pencil tool simply because that's the\
    \ default tool, you could easily change it so that it defaulted to another tool\
    \ such as the JPG move tool if you'd prefer.\n\nThe reason the conditional is\
    \ like this....\n\n```\nif (JPG.getBytesLoaded() ==\n    JPG.getBytesTotal() &&\n\
    \    JPG.getBytesTotal() != 0) {\n```\n\n...is to check if the image has loaded\
    \ and if getBytesTotal is not equal to zero. Flash is often likely to be a little\
    \ slow on the uptake of the file coming in, and it might keep this value to zero\
    \ for a while, until it realizes that a file is on its way.\n\nWe then need to\
    \ set up the CANCEL button in the dialog box:\n\n```\n_root.loadJPGBox.cancelBut.onRelease\n\
    \    = function() {\n    _root.allButsOff();\n    _root.mainButDraw.gotoAndStop(2);\n\
    \    _root.funcFreeDraw();\n    _root.freeDraw(\"\");\n    _root.help.text = \"\
    Click and drag to\n    draw pencil lines\";\n    removeMovieClip(_root.loadJPGBox);\n\
    \    JPG.unloadMovie();\n    });\n```\n\nIf it's clicked, then the tools are reset,\
    \ the pencil tool is activated, the dialog removed and the content of JPG is unloaded.\
    \ Nothing too taxing here, but a necessary feature for the user.\n\nNow we move\
    \ on to the most important of the functions – the one that actually loads in the\
    \ JPG:\n\n```\nloadImage = function (imageFileName) {\n    JPG.loadMovie(imageFileName);\n\
    ```"
