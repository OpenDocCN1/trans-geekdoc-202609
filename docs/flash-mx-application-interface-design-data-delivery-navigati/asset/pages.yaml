- pgno: 212
  md: "# JPG masking\n\nThe appeal of the JPG masking in this application extends\
    \ past the standard square or shape mask. In this application, the user is able\
    \ to draw his own mask shape and then apply it to the loaded JPG.\n\nThis part\
    \ will be split into two sections – the first covers the drawing of the mask,\
    \ and the second applies the mask to the JPG image.\n\n# Drawing the mask\n\n\
    ![](img/50202c17d5022233f3e3ec60560e35aa_212_0.png)\n\nYou'll be glad to know\
    \ that we have already covered the tool required to draw the mask. The mask drawing\
    \ uses the fill draw tool code, but drawing to its own layer. The drawing movie\
    \ clip for this tool is set-up in the initialization for the whole movie:\n\n\
    ```\njamJar.createEmptyMovieClip(\"masker\", 503);\n```\n\nThis movie clip is\
    \ made global there too:\n\n```\n_global.JPGM = jamJar.masker;\n```\n\nThe reason\
    \ the user is limited to using a fill draw-esque tool is because strokes cannot\
    \ be used as masks, and therefore the line tool or pencil tool would be pretty\
    \ useless, so I made the decision during development to limit the tool to this.\n\
    \nNot only did it save me some coding – making a new tool – but it also gets the\
    \ user familiar with this and the fill draw tool at the same time. Neat deal.\n\
    \nOnce you have a mask shape drawn, you'll need something for it to mask....\n\
    \n# Applying the mask to the JPG\n\n![](img/50202c17d5022233f3e3ec60560e35aa_212_1.png)\n\
    \n![](img/50202c17d5022233f3e3ec60560e35aa_212_2.png)\n\n![](img/50202c17d5022233f3e3ec60560e35aa_212_3.png)\n\
    \nThe application of the mask to the image is switched on or off through one simple\
    \ function.\n\nThe general strategy here is to use the setMask method, and to\
    \ switch the mask on or off, depending on the last state. Here's the first bit\
    \ of code:\n\n```\nfuncApplyMask = function () {\n  _root.allButsOff();\n  _root.mainButDraw.gotoAndStop(2);\n\
    \  _root.funcFreeDraw();\n  _root.help.text = \"Click and drag to\n  -> draw pencil\
    \ lines\";\n}\n```"
  merge: -1
  img_proc: true
- pgno: 213
  md: '# JPG and mask move tools


    No, this isn''t a printing error. When this button is pressed, as well as the
    masking being done, the pencil tool is defaulted to. This is pretty much a standard
    action throughout the buttons.


    In the next chunk of code, we actually do something in the way of masking:


    ```

    if (_root.JPGMaskOn == false) {

    JPG.setMask(JPGM);

    _root.JPGMaskOn = true;

    } else if (_root.JPGMaskOn == true) {

    JPG.setMask(null);

    _root.JPGMaskOn = false;

    };

    ```


    Now that is more like it – something relevant. The conditionals here check to
    see if the mask is already applied or not using the JPGMaskOn variable. JPGMaskOn
    is initialized as being off.


    In either event, the mask is toggled on or off (using JPG.setMask (null) to remove
    it) and the JPGMaskOn variable is changed.


    In case you missed it, JPG was defined in the previous section on loading a JPG.


    As you can see, there is nothing fancy about this code, just toggling, and the
    superb setMask command.


    These tools are both very similar, so they can be covered at the same time. Without
    further ado, let''s take a look at the code. We first swap the depth of jamJar
    with the drawPad so that it''s above the drawings and you can see what you''re
    doing:


    ```

    funcMoveJPG = function () {

    jamJar.swapDepths(drawPad);

    };

    ```


    We then set up a couple of event handlers. When you click, then you begin dragging
    the JPG or mask, and when you release, you stop dragging it. It''s as simple as
    that:


    ```

    jamJar.onPress = function() {

    JPGContainer.startDrag();

    };

    jamJar.onRelease =

    jamJar.onReleaseOutside = function () {

    JPGContainer.stopDrag();

    };

    ```


    The last piece of code just swaps the depth back with the drawPad, and resets
    the drawing tools to use the free draw option:


    ```

    jamJar.swapDepths(drawPad);

    allButsOff();

    _root.mainButDraw.gotoAndStop(2);

    funcFreeDraw();

    };

    ```'
