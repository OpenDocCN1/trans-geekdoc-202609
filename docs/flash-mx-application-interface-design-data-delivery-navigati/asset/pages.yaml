- pgno: 78
  md: "Go to the subButtons layer (which should still be empty),\nand type the following\
    \ code:\n\n```\nSubButton = function() {\n    this.init();\n}\n\nSubButton.prototype\
    \ = new MovieClip();\n```\n\nThis is the way to extend a movie clip in Flash MX.\
    \ You\nsimply create a new class constructor function as I do in\nthe first line.\
    \ You then set the new class's prototype to be\nan instance of the MovieClip object.\
    \ Now any instance of\nyour new class will have all of the MovieClip's properties\n\
    and methods, plus anything you add to the new class. The\nonly method I have called\
    \ inside the constructor is the\ninit method for the class, so let's write this\
    \ now.\n\nPlace this code directly after the previous lines of code:\n\n```\n\
    SubButton.prototype.init = function() {\n    this.createTextField(\"label\", 0,\
    \ 0, 0, 0, 0);\n    this.label.setNewTextFormat(buttonTF);\n    this.label.autoSize\
    \ = \"center\";\n    this.label.embedFonts = 1;\n    this.label.selectable = 0;\n\
    \    this.label.text = sections[currentSection]\n    ▶ .links[this.num].title;\n\
    \    this.label._y -= this.label.textHeight*1.25;\n}\n```\n\nBy attaching this,\
    \ and all of the following methods of\nSubButton, to its prototype object, I have\
    \ enabled each\ninstance of SubButton to have access to these methods\nwithout\
    \ having to duplicate functions. This is the beginning\nof the init method, and\
    \ all these lines do is create and\nformat a text field that will display the\
    \ link's name. The\nname itself is found in the sections array, using this.num\n\
    (passed in the initObject, remember?) to access the\nproper link information.\n\
    \nContinuing on with the init method, type the following\nlines of code:\n\n```\n\
    this.width = this.label.textWidth/2 + 20;\n\nthis.onRollOver = this.rollOverScript;\n\
    this.onRollOut = this.onReleaseOutside\n▶ = this.onDragOut = this.rollOutScript;\n\
    this.onRelease = this.releaseScript;\n\nvar fill = this.createEmptyMovieClip(\"\
    fill\", 1);\nfill._x = buttonWidth/2;\nfill.beginFill(0,0);\ndrawBox(fill, -this.width,\
    \ - buttonHeight,\n▶ this.width, 0);\nfill.endFill();\n```\n\nThese lines give\
    \ our subButton all of its button abilities.\nFirst, we establish its width based\
    \ on the amount of text\n(plus a 20 pixel buffer). We then assign functions to\
    \ each\nof its button handlers – we'll write these in a moment.\nFinally, as we\
    \ did with our sectionButtons, we need to\ndraw a hit area for the user's mouse.\
    \ To do this, we create\na new movie clip called fill and place it in the center\
    \ of the\nbutton, using drawBox to draw a 0% opacity box around\nour button.\n\
    \nThe following lines complete our init function:\n\n```\nif (sections[currentSection]\n\
    ▶ .visited[this.num]) {\n    this.drawCrossOut()\n}\n```\n\nThis will draw a line\
    \ through a link that has already been\nvisited when a section is reopened. visited\
    \ will be the\nname of an array property of a section that will be created\nonce\
    \ a link in a section has been clicked on. Once the\narray is created, it will\
    \ store a true in the index of a link\nthat has been visited in that section,\
    \ so the next time the\nsection is opened, the line automatically appears drawn\n\
    through the previously visited link. We'll look at the\ndrawCrossOut method in\
    \ a moment, but let's first take\ncare of our rollOver functions."
