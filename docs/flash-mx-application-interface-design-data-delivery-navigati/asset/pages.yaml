- pgno: 147
  md: "# ## Planning the interface\n\nI designed this interface so that any aesthetic\
    \ aspect can be modified – the design of the background image, the file type icons,\
    \ the JPG and MP3 viewers and the text viewer can all be changed without affecting\
    \ the way the interface works. It's also easy to add functionality in order to\
    \ handle a new file type. It's as simple as adding to the double-click processing\
    \ routine, which we'll look at in a minute. This means we can create our own types\
    \ of files, icons and viewers, and the functionality of the entire site can be\
    \ enhanced, without breaking anything.\n\nSo I started my planning by thinking\
    \ about what function points would have to be added to Flash in order to make\
    \ all this happen.\n\n+   - Double-click functionality – Flash detects single-clicks\
    \ (press and release) but I needed to find out when something had been double-clicked.\n\
    \n+   - The ability to read the contents of web directories – this would have\
    \ to be accomplished using a PHP script on the Web server.\n\n+   - The FileInfoComponent\
    \ – this would be a generic component containing all the functionality and code\
    \ for handling a particular file type. This object would have to be given a file\
    \ name and location, and it must know how to respond to a double click, and what\
    \ to do with the file.\n\n+   - A general parser function – this would take the\
    \ contents of a folder and create one instance of the FileInfoComponent per file/subfolder\
    \ within that parent folder. This function must make all the FileInfoComponent\
    \ instances respond, in some way, to a scroll bar, to facilitate scrolling through\
    \ the files, should they be larger than one screen.\n\n+   - File type functionality\
    \ – this needed to be created so that our file types can be handled from within\
    \ the interface. I would design this for MP3, JPG and TXT.\n\n# ## Double-clicking\n\
    \nLet's get right into it and take a look at how we will accomplish the double-clicking\
    \ effect. This is a generic double-click handling function.\n\n```\nmyMovieClip.onMouseDown\
    \ = function()\n{\n   if (this.hitTest(_root._xmouse,\n   _root._ymouse, true))\n\
    \   {\n   this.g = getTimer();\n   if (this.firstclick != true || this.g >\n \
    \  (this.clicktime + doubleclickspeed))\n   {\n   this.firstclick = true;\n  \
    \ this.clicktime = this.g;\n   }\n   else\n   {\n   if (this.g < this.clicktime\
    \ +\n   this.doubleclickspeed)\n   {\n   }\n   this.firstclick = false;\n   }\n\
    \   }\n}\n```\n\nAs you can see, this function is triggered when the user presses\
    \ the mouse button, and what we're doing is performing a hitTest, to determine\
    \ if the mouse is over the movie clip when the mouse button is pressed. We're\
    \ using a movie clip as opposed to a button, as it's not really a button that\
    \ we're clicking, but an icon (like a file), which is better represented as a\
    \ movie clip.\n\nWhen something is double-clicked, we essentially measure the\
    \ time between the first mouse down and the second mouse down. If they fall within\
    \ a certain range (defined in the variable doubleclickspeed), that's considered\
    \ to be a double-click. If they fall outside that time range, then it was not\
    \ a double-click, but two single clicks instead, which do nothing."
  merge: -1
  img_proc: true
- pgno: 148
  md: 'We then make sure that it''s not the ‘first time’ clicking the button, or if
    it has been more than the defined amount of time since this button was last clicked.
    If so, then we set a flag, firstclick, to true and set the time of the current
    click in clicktime. If it was more than doubleclickspeed milliseconds since the
    last click, then we must consider the double-click to have timed out.


    Otherwise, if this was not the first click, and it still falls within the range
    of doubleclickspeed, then we can perform the function or code that we want to
    have happen on double-click. Once this code has been executed, we must set firstclick
    back to false again, so our icon is reset to unclicked and is ready for double-clicking.


    # Reading the contents of a Web directory


    One of the critical aspects of building this interface is actually reading the
    contents of a directory, or folder of some sort. When creating this interface,
    I wrote a PHP script, which reads the contents of a folder on a web site, and
    then returns that information as variables to Flash. Without this vital backbone,
    everything else would not run.


    You can find the PHP script in the download files, called dirstuff.php, ready
    for you to put onto your server and use, plus a file called script_expo.pdf which
    contains a more detailed explanation of the code if you want to dig deeper into
    the PHP side of things. Obviously a really detailed discussion of the PHP is a
    bit outside the scope of this chapter, but to briefly understand some key points:


    First, we must pass a few parameters to the script, and it will return to us a
    variable string of filenames, types and sizes.


    The parameters that the script expects are:


    +   - matchDir – this contains a relative directory from where we would like the
    file listings. If we


    specify images, for example, then all files returned by the script will be from
    the /images directory.


    +   - matchExt – the file extensions that we would like to display. If we only
    wanted GIF files to be sent back, then we would send matchExt as gif.


    For example, when we make a call to the script (which is called dirstuff.php),
    we pass parameters with a LoadVars object, like so:


    ```

    myLoadVars.load(base + "dirstuff.php?

    => matchDir=Tutorials&matchExt=");

    ```


    If we want all files to be returned, then matchExt can be set to *, or can be
    completely left out. When the files are returned, they’ll be sent back in a string
    of text, which is divided into name/variable pairs, like so:


    ```

    &file0=.&fsize0=512&file1=.&fsize1=

    => 512&file2=High Score List.link&

    => fsize2=48&file3=Hi Score Files.zip&

    => fsize3=159583&file4=FlashintheCan Game

    Talk.pop&fsize4=56&file5=Motion and

    Collision slides.swf&fsize5=15499&

    ```


    Each file is passed as a name, file0, file1, file2, and a size, fsize0, fsize1,
    fsize2. So, in this example, file 5 is called Motion and Collision slides.swf
    and it’s 15499 bytes in size.


    When this has happened, our directory contents, and the file sizes, have been
    successfully transmitted to Flash for use with our FileInfoComponent, and Flash
    file browser, which we will move on to building now.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# MX specific items


    So, now that we''re able to load in the contents of a web directory, we need to
    do some things on the Flash MX side. We''re going to be using a few important,
    and Flash MX specific items – components and the LoadVars object.


    In our file browser, we''re using a custom component called the FFileInfoComponent.
    Once instantiated and set up, each instance of this component is completely self-sufficient
    and will respond to double-clicks by performing a context-sensitive action, derived
    from the file extension of the attached file.


    For example, if the instance we click on is representative of a JPG image on the
    web server, then the component will activate a built-in JPG viewer. When an MP3
    file is double-clicked, then the component will activate a built-in Flash MX MP3
    player. In fact, we can extend it to handle just about any type of file we wish.
    By default, if the file type is unknown, then it will be opened up in a web browser
    window.


    To look at the FFileInfoComponent, let''s open up filebrowser.fla. From within
    there, open up the library and scroll down until you see the FileInfoComponent
    component.


    ![](img/50202c17d5022233f3e3ec60560e35aa_149_0.png)


    Double-click on the component in the library, or right-click and choose Edit.
    We''ll be presented with something that looks like this:


    ![](img/50202c17d5022233f3e3ec60560e35aa_149_1.png)


    Our component consists of four layers:


    +   The Actions layer contains all the code that makes this otherwise regular
    movie clip into a component.


    +   The selected layer contains a semitransparent blue movie clip that is used
    to indicate when a file is selected. When a file is clicked on, it will become
    selected, and this box will be made visible.


    +   The label layer contains a text field with the instance name ''label''. This
    is where the filename is drawn.


    +   The icon layer contains a movie clip, or asset, which is simply a multi-framed
    movie clip. If you want to look at this without moving layers around or looking
    in the library then lock the selected layer first and then double click on the
    icon. Each frame contains a different icon that corresponds to a file type. As
    support for more file types is added, then more frames will be added to this movie
    clip. It has an instance name, fileInfIcon.'
  merge: -1
  img_proc: true
- pgno: 150
  md: "The filetypes that this version has icons for are GIF, JPEG, MP3, PHP, HTML,\
    \ XML, TXT, ZIP, FLA, SWF, AS (ActionScript file), and directory, which uses an\
    \ icon of a folder. Any other file type uses a generic unknown icon.\n\nThe main\
    \ magic comes from the code that's attached to the Actions layer. Once we have\
    \ our directory read, and all our FileInfoComponents placed, it's up to each instance\
    \ to handle its own behaviors. Let's look at the functionality of the FileInfoComponent\
    \ itself, and then in the next section, we'll look at how it's all put together,\
    \ and how all the instances are created from the directory information returned\
    \ by the PHP script.\n\n# The FileInfoComponent actions\n\nAll the code in this\
    \ section comes from the Actions layer in the FileInfoComponent component itself.\
    \ Since we're creating a component, we need to define a base class that will handle\
    \ all the methods and properties associated with each instance. We're going to\
    \ tie this class to the physical FileInfoComponent movie clip, to ultimately create\
    \ FFileInfoComponent – notice the extra F at the beginning to denote our entire\
    \ component, rather than the instance.\n\nThe code begins like so:\n\n```\n#initclip\n\
    function FileInfoClass ()\n{\n    this.autoparse();\n    this.update();\n    this.amSelected\
    \ = false;\n    this.selectedBox._visible = false;\n    this.doubleclickspeed\
    \ = 300;\n}\n```\n\nThis is the constructor function, which is also used to define\
    \ the name of the class that we're tying to our movie clip. In this case, the\
    \ class is called FileInfoClass. Think of it like creating a new base object,\
    \ like String, Array, or Math – this class is FileInfoClass. We're using the\n\
    \n#initclip action to specify that we only want this definition code to be run\
    \ once, when the component itself is first loaded in the library, and not every\
    \ time an instance is created.\n\nWe'll see later that when each instance of the\
    \ FileInfoComponent is created, several variables are passed into it. These are:\n\
    \n+   - xpos – the x position of the instance.\n+   - ypos – the y position of\
    \ the instance.\n+   - filename – the actual name of the file, for example picture.jpg,\
    \ mysong.mp3.\n+   - filePath – the absolute path of the file, for example http://www.mysite.com/files/mysong.mp3\n\
    +   - fileSize – the size of the file in bytes.\n\nSince these variables are passed\
    \ in when the instance itself is created, the variables therefore exist when the\
    \ constructor function is called. There is also one more variable, picFrame, which\
    \ is assigned by default when the instance is created. In fact, if we look at\
    \ the library again, right click on the FileInfoComponent and choose Component\
    \ Definition, we can see that four variables are defined by default.\n\nThe variables\
    \ filename, filePath, picFrame and fileSize are set to default.txt, /, 1 and 0\
    \ respectively. However, these will not normally be used, as they're overwritten\
    \ in the attachMovie code that is used to create each instance. We'll look more\
    \ at this in the next section.\n\nSo, when an instance of the FileInfoComponent\
    \ is created, there are several initialization steps that we must perform, as\
    \ we saw in the constructor function."
  merge: -1
  img_proc: true
- pgno: 151
  md: "First, we're calling an internal method called autoparse. This is responsible\
    \ for analyzing the associated filename, and then setting the value of the picFrame\
    \ parameter to the correct frame of the fileInfoIcon movie clip.\n\nOnce we've\
    \ got a value for picFrame, we call update. This is a short function, and it simply\
    \ tells the fileInfoIcon to gotoAndStop at picFrame. This function also tells\
    \ the instance to set its _x and _y parameters to the xpos and ypos that were\
    \ set upon initialization. This will physically move the instance on screen. Finally,\
    \ update sets the value of the label to be the filename, stored in the fileName\
    \ variable.\n\nWhen a FileInfoComponent instance is clicked on, it becomes the\
    \ selected file. We have a flag attached to each instance called amSelected. Here,\
    \ we're setting it to false, indicating that it's not selected. This code will\
    \ make more sense shortly. Next, we're setting the visibility of the selectedBox\
    \ to false, and setting the parameter doubleclickspeed to 300. The selectedBox\
    \ is used to indicate which file is currently selected, and the doubleclickspeed\
    \ is used to indicate the maximum amount of time allowed for the second click\
    \ to follow after the first click, in order for it to be considered a successful\
    \ double-click.\n\nThe next line of code, after the constructor function, is this:\n\
    \n```\nFileInfoClass.prototype = new MovieClip();\n```\n\nThis is necessary in\
    \ order for the class to inherit all the events of the MovieClip object. Without\
    \ doing this, there'd be no tie between our class, and events like onMouseDown,\
    \ and onMouseMove.\n\nNext, we have the autoparse function:\n\n```\nFileInfoClass.prototype.autoparse\
    \ = function ()\n{\n    this.fTypes = new Object();\n    this.fTypes[\"BAK\"]\
    \ = 10;\n    this.fTypes[\"JPG\"] = 2;\n    this.fTypes[\"JPEG\"] = 2;\n    this.fTypes[\"\
    GIF\"] = 2;\n    this.fTypes[\"HTM\"] = 3;\n    this.fTypes[\"HTML\"] = 3;\n \
    \   this.fTypes[\"XML\"] = 3;\n    this.fTypes[\"TXT\"] = 4;\n    this.fTypes[\"\
    PHP\"] = 5;\n    this.fTypes[\"SWF\"] = 6;\n    this.fTypes[\"AS\"] = 6;\n   \
    \ this.fTypes[\"FLA\"] = 7;\n    this.fTypes[\"MP3\"] = 8;\n    this.fTypes[\"\
    ZIP\"] = 9;\n    this.fTypes[\"FOLDER\"] = 1;\n\n    var tExt = this.fileName.toUpperCase().\n\
    \    split(\".\")[1];\n    if (tExt == undefined &&\n    (this.filesize % 512)\
    \ == 0) tExt = \"FOLDER\";\n\n    this.picFrame = this.fTypes[tExt];\n\n    if\
    \ (isNaN(this.picFrame) ||\n    this.picFrame == undefined)\n    this.picFrame\
    \ = 10;\n}\n```\n\nThis function creates an object called fTypes with several\
    \ properties. Each property is actually a file extension (for example GIF, HTML,\
    \ ZIP, MP3) and each one has a value that corresponds to a frame in the fileInfoIcon\
    \ movie clip. (Note that I have included BAK for future compatibility – we may\
    \ later decide to include a BAK icon). What we do here is set tExt to be the uppercase\
    \ extension of the filename attached to this instance."
  merge: -1
  img_proc: true
- pgno: 152
  md: 'If the file has no extension, and its file size is an even division of 512,
    then it is most likely a folder. (This is to do with the way folders are stored...they''re
    not files, so they need only a fixed amount of room. In cases like this, they''re
    usually rounded up to the closest number that''s a power of 2, such as 128, 256,
    512, so that the storage takes up a whole even number of bytes.) In that case,
    we set the extension to FOLDER, so that we have something to compare with in the
    fTypes object.


    We''re then setting the picFrame property based on the extension with:


    ```

    this.picFrame = this.fTypes[tExt];

    ```


    In the case where there''s no matching extension, we set the picFrame to 10, because
    that''s the general image we use for an unknown file type.


    Next comes the other function we mentioned earlier, update:


    ```

    FileInfoClass.prototype.update = function () {

    this.fileInfoIcon.gotoAndStop(this.picFrame);

    this._x = this.xpos;

    this._y = this.ypos;

    this.label.text = this.fileName;

    }

    ```


    The update function, as discussed before, simply tells the fileInfoIcon to gotoAndStop(this.picFrame),
    sets the _x and _y position of the component, and sets the label to this.fileName.


    These functions are only ever declared once, because of the #initclip action,
    and therefore, all our functions are declared on the prototype object of the FileInfoClass
    class, hence the FileInfoClass.prototype before each function name.


    The next line of code, after this, is:


    ```

    Object.registerClass("FFileInfoComponent",

    FileInfoClass);

    ```


    This is where we tie our new class, FileInfoClass, to the actual component movie
    clip from the library. In the library, our component is configured to export with
    the linkage ID FFileInfoComponent. Here, we''re tying the class and the movie
    clip together, by using the registerClass method of the Object object. This is
    an important line of code. Without this, none of our instances would be alive
    – their code would not work. They would merely be static movie clips.


    Next, we have two functions, doSelect and doDeselect. As you might have guessed,
    these are responsible for setting the state of this instance to appear selected,
    or to remove this state by deselecting it:


    ```

    FileInfoClass.prototype.doSelect =

    function ()

    {

    this.amSelected = true;

    this.selectedBox._visible = true;

    _root.titleBar.fileSize.text =

    (this.fileSize) add " bytes";

    }

    ```


    ```

    FileInfoClass.prototype.doDeselect =

    function ()

    {

    this.amSelected = false;

    this.selectedBox._visible = false;

    }

    ```'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'We''re simply making the selectedBox visible or invisible, and setting a flag
    called amSelected to true or false. One more thing – when a file is selected,
    we want to display its file size at the top of the window. For this, we have a
    movie clip called titleBar, on the main timeline. While it might not be ideal
    for a component to depend on a movie clip outside of itself, this seemed like
    the easiest way to do it here. We could, if we were so inclined, write a function
    on the _root called updateDisplay. This function would take the file size as a
    parameter. Then, once a file is selected, we could call:


    ```

    _root.updateDisplay(this.filesize);

    ```


    and our updateDisplay would handle the file size in whatever way our specific
    application deems fit. We would have to write the updateDisplay function, something
    like this:


    ```

    updateDisplay = function(passedSize)

    {

    titleBar.fileSize.text = passedSize;

    }

    ```


    This way the component itself never has to refer to anything outside of itself
    except for the updateDisplay function. However, these improvements are up to you
    to take forward.


    Within this movie clip, there''s a text field with the instance name fileSize.
    We''re setting that text to be the size of the associated file, followed by the
    word bytes.


    Next, we have a series of ''getters'' and ''setters''. These are functions, which
    have the sole responsibility of setting the value of certain properties, or getting
    and returning the value of those properties. They go like so:


    ```

    FileInfoClass.prototype.setType = function (t)

    {

    this.picFrame = t;

    this.update();

    }

    .

    FileInfoClass.prototype.setFileName =

    => function (n)

    {

    this.fileName = n;

    this.update();

    }

    .

    FileInfoClass.prototype.setFilePath =

    => function (p)

    {

    this.filePath = p;

    this.update();

    }

    .

    FileInfoClass.prototype.getFileName =

    => function ()

    {

    return (this.fileName);

    }

    .

    FileInfoClass.prototype.getFilePath =

    => function ()

    {

    return (this.filePath);

    }

    .

    FileInfoClass.prototype.getType = function ()

    {

    return (this.picFrame);

    }

    ```


    They should be fairly self-explanatory. For the most part, we don''t call these
    functions directly – rather, methods of the FileInfoClass call these getters and
    setters for internal usage only. They''re essentially private functions.'
  merge: -1
  img_proc: true
- pgno: 154
  md: "This next function is the core functionality center of the FileInfoComponent.\
    \ This function, called handleFile, is responsible for performing the appropriate\
    \ action associated with each type of file when it is double-clicked. In essence,\
    \ this decides how to activate, or handle, the file when the user chooses to activate\
    \ it.\n\n```\nFileInfoClass.prototype.handleFile =\n    function()\n{\n    stopDrag();\n\
    \    if (this.picFrame == 1)\n    {\n        _root.parentdir[_root.dirlevel++]\
    \ =\n            _root.matchDir;\n        _root.matchDir += this.fileName add\n\
    \            \"/\";\n        _root.loader2.load(_root.baseURL add\n          \
    \  \"dirstuff.php?matchExt=\" add\n            _root.matchExt add \"&matchDir=\"\
    \n            add _root.matchDir);\n    }\n    else\n    {\n        var tname\
    \ = this.fileName.toUpperCase();\n        if (tname.indexOf(\".JPG\") > -1)\n\
    \        {\n            _root.viewwindow.visible = true;\n            var destfile\
    \ = this.filePath add\n                this.fileName;\n            _root.viewwindow.blankmc.\n\
    \                createEmptyMovieClip(\"holdermc\", 0);\n            _root.viewwindow.blankmc.holdermc.\n\
    \                _y = 14;\n            _root.viewwindow.blankmc.holdermc.\n  \
    \              loadMovie(destfile);\n            _root.viewwindow.destfile =\n\
    \                destfile;\n            _root.viewwindow.jpgtitle.text =\n   \
    \             this.filename;\n            _root.busy = true;\n        }\n    \
    \    else if (tname.indexOf(\".TXT\") > -1)\n        {\n            txt = new\
    \ XML();\n            txt.onData = function(dat)\n            {\n```\n\n```\n\
    _root.textfilecontentmc.\n    textfilecontent.text = dat;\n_root.textfilecontentmc._visible\
    \ =\n    true;\n_root.busy = true;\n}\nvar destfile = this.filePath add\n    this.fileName;\n\
    _root.textfilecontentmc.destfile =\n    destfile;\ntxt.load(destfile);\n}\nelse\
    \ if (tname.indexOf(\".MP3\") > -1)\n{\n    _root.mp3player._visible = true;\n\
    \    var destfile = this.filePath add\n        this.fileName;\n    _root.mp3player.streamSound\n\
    \        (destfile);\n}\nelse\n{\n    var destfile = this.filePath add\n     \
    \   this.fileName;\n    getURL (destfile, \"_blank\");\n}\n}\n```\n\nThis function\
    \ looks at the type of file associated with this FileInfoComponent instance, and\
    \ then responds to it accordingly.\n\nThe first type it looks for is a folder.\
    \ If an instance is set to be a folder, then it’s handled by forcing the entire\
    \ window to be redrawn, with the new path. First, we check to see that the file\
    \ type is a folder.\n\nIf it is, then we specify the new path by adding / and\
    \ this.fileName onto the current path, which is stored in the variable _root.matchDir.\
    \ We also store the name of the previous path (where we are moving from) in an\
    \ array called _root.parentdir. As we navigate deeper, we need to always know\
    \ the name of the previous path. So, we add it into this array, and then incrementing\
    \ a counter called _root.dirlevel. This way, we’re keeping a history of previous\
    \ locations."
  merge: -1
  img_proc: true
- pgno: 155
  md: 'Here''s the way that _root.parentdir would look after navigating in four levels.


    ```

    _root.parentdir[0] : http://www.mysite.com/siteroot/


    _root.parentdir[1] :

    http://www.mysite.com/siteroot/images/


    _root.parentdir[2] :

    http://www.mysite.com/siteroot/images/photos/


    _root.parentdir[3] :

    http://www.mysite.com/siteroot/images/photos/sunsets/

    ```


    At this point, _root.dirlevel would be 4.


    Later, we''ll see that when the Navigate Up button is pressed, we decrement _root.dirlevel,
    and then get the contents of the directory at _root.parentdir of the new _root.dirlevel.


    Once our new path is determined and placed in _root.matchDir, we call the PHP
    script to initiate the actual loading of the file structure data from the server,
    utilizing the parameters matchExt and matchDir.


    We''ll see later that loader2 is a LoadVars object, which is responsible for handling
    incoming data, and then completely formatting and laying out the FileInfoComponent
    instances for the new folder.


    Next, we have handlers for JPG, TXT and MP3 files.


    +   JPG – when we handle a JPG file, we''re setting a number of properties of
    a movie clip on the _root, called viewwindow. This is a simple movie clip that
    has zoom in/out features, as well as panning of images within its window. We''re
    using the loadMovie command to load the JPG directly, as Flash MX now supports
    this.


    +   TXT – when we double-click on a text file, we want to load the entire text
    file into a viewer window. This window is actually a movie clip called _root.textfilecontentmc.
    This contains a text field named textfilecontent, and a scroll bar so we can scroll
    through it. We''re using the XML object to load in the entire file as raw text,
    and then we''re displaying that text directly in the text field, without any parsing
    or processing.


    +   MP3 – we have a simple movie clip called mp3player, which is a self-contained
    streaming MP3 player that has stop and play capability built in, as well as time,
    title and position display. The player can be dragged around, and there''s a little
    hard-drive icon for people to click on if they want to download the MP3 file.


    In all three cases, we''re setting a variable called _root.busy to be true. This
    is required so that when the JPG, TXT, or MP3 windows are open, we cannot inadvertently
    click on a FileInfoComponent instance beneath it. The _root.busy flag is used
    in the onMouseDown function, as we''ll soon see.


    Lastly, there''s a ''catch all'', which handles any unknown file type by sending
    it to a blank web browser.'
  merge: -1
  img_proc: true
- pgno: 156
  md: "Next in our code, we have the onMouseDown function:\n\n```\nFileInfoClass.prototype.onMouseDown\
    \ = function()\n{\n    if (!root.busy)\n    {\n        this.offx = _root._xmouse\
    \ - this._x;\n        this.offy = _root._ymouse - this._y;\n\n        if (this.hitTest(root._xmouse,\n\
    \        _root._ymouse, true))\n        {\n            this.startDrag();\n   \
    \         this.doSelect();\n\n            root.mousepressed = true;\n        \
    \    root.mousestartx = root._xmouse;\n            root.mousestarty = root._ymouse;\n\
    \n            this.g = getTimer();\n\n            if (this.firstclick != true\
    \ ||\n            (this.g > (this.clicktime\n            + this.doubleclickspeed)))\n\
    \            {\n                this.firstclick = true;\n                this.clicktime\
    \ = this.g;\n            }\n            else\n            {\n                if\
    \ (this.g < this.clicktime +\n                this.doubleclickspeed)\n       \
    \         {\n                    this.handleFile();\n                }\n     \
    \           this.firstclick = false;\n            }\n        }\n        else\n\
    \        {\n            this.doDeselect();\n        }\n    }\n}\n```\n\nThis handles\
    \ the double-clicking that we discussed earlier. There are also a few key differences.\n\
    \nWe're making sure that the root.busy flag is not true – otherwise, this click\
    \ must be ignored. We're checking to see if the file itself is being clicked on,\
    \ via the hitTest method, and if so, we're calling our doSelect method. We're\
    \ also making it draggable by calling the startDrag method. When we press the\
    \ mouse button down, we want to also grab onto the file, and move it around, if\
    \ we so desire. Finally, if this is a double click, then we call the handleFile\
    \ method.\n\nIf the hitTest was false, then we call doDeselect. This means that\
    \ only one file will be selected at a time, because unless we're clicking on a\
    \ file, it'll deselect itself, and since we only have one mouse cursor on screen,\
    \ we'll only ever be hitTesting with one file (unless they're stacked on top of\
    \ each other, but then, startDrag will only drag one item at a time, anyway).\n\
    \nWe then have one more function:\n\n```\nFileInfoClass.prototype.onMouseUp =\
    \ function()\n{\n    this.stopDrag();\n    root.mousepressed = false;\n}\n```\n\
    \nWhen the mouse is released, we want to stop all dragging, and set the mousepressed\
    \ flag to false.\n\nLastly, we finish off with:\n\n```\n#endinitclip\n```\n\n\
    This indicates that this is the end of the class definition.\n\nNow we've seen\
    \ the code attached to the FileInfoComponent, and how to send the contents of\
    \ a directory with PHP, let's look at how to tie it all together, and parse the\
    \ variables to create the directory layout on screen."
