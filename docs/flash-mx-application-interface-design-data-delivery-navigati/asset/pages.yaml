- pgno: 99
  md: "Place this method directly after the NodeClass's translate method:\n\n```\n\
    ```javascript\nNodeClass.prototype.showChildren = function() {\n  var childrenNum\
    \ = this.node.children.length;\n  if (childrenNum < 1) { return false };\n  if\
    \ (this.children != undefined) { return false };\n  this.children = [];\n}\n```\n\
    ```\n\nshowChildren is what we called in our center method, that will – you guessed\
    \ it – show the node's children. Before we do this, we need to make a few checks\
    \ to make sure we have anything to show. The first thing we do is place the number\
    \ of children the node has into a variable, childrenNum. If this number is less\
    \ than 1, that means there are no children to show, and so we exit out of the\
    \ function. Second, we check to see if the children are already expanded. You\
    \ will see that as soon as we attach the children, we will store references to\
    \ these children in this node's children array. If this array already exists,\
    \ that means the children are attached and we do not need to continue, so we exit\
    \ the function. If we have made it this far, we go ahead and create the children\
    \ array and get ready to add the children.\n\nFinish off the showChildren method\
    \ with the following:\n\n```\n```javascript\nvar i = 0;\nwhile (i < childrenNum)\
    \ {\n  var angle = pi/(childrenNum+1) * (i+1) + this.angle;\n  var distance =\
    \ this.diameter*childDistance;\n  var props = {};\n  props.node = this.node.children[i];\n\
    \  props.parent = this;\n  props.angle = angle - pi/2;\n  props.x = this.x;\n\
    \  props.y = this.y;\n  props.tX = Math.cos(angle) * distance + this.tX;\n  props.tY\
    \ = Math.sin(angle) * distance + this.tY;\n  props.tZ = props.z = this.tZ - childDepth;\n\
    \  this.children.push(this._parent.attachMovie(\"nodeSymbol\",\n      this.node.children[i].name\
    \ + this._parent.depth,\n      this._parent.depth--, props));\n  i++;\n}\n}\n\
    ```\n```"
