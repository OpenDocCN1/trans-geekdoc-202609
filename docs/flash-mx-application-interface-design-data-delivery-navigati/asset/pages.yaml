    \ Navigate up button, is run:\n\n```\n```\n_root.matchDir = _root.parentdir[\n\
    \    _root.dirlevel];\n_root.loader2.load (_root.baseURL add\n\"dirstuff.php?matchExt=\"\
    \ add\n_root.matchExt add \"&matchDir=\" add\n_root.matchDir);\n```\n```\n\nThis\
    \ code moves back in the parentdir array, to the previous directory, and then\
    \ reissues the loader2.load function.\n\nNow, back to the scrolling. In order\
    \ to facilitate this – to bring it to life – we use the following code:\n\n```\n\
    ```\nfilescroll.setChangeHandler (\"scrolling\");\nscrolling = function()\n{\n\
    \    _root.anchor._y = -\n    filescroll.getScrollPosition();\n}\n```\n```\n\n\
    It's very simple, thanks to the use of anchor. We're telling the scrollbar to\
    \ call the function scrolling, whenever the thumb is moved, or 'scrolled'. By\
    \ taking the current scroll position (the value returned by the scrollbar) and\
    \ applying it to the _y parameter of the anchor, all our files will move up or\
    \ down, as the scrollbar is moved.\n\n# ## The rest\n\nThe remaining interface\
    \ items consist of the JPG viewer, the text file viewer and the MP3 player. As\
    \ cool as they are, however, they're not the focus of this chapter, which is supposed\
    \ to illustrate the cool file interface, and not get into players and viewers\
    \ as well. Feel free to explore and learn the code – it's all very simple. The\
    \ most complicated code is the MP3 player, which handles streaming and time display\
    \ in order to play properly. The other two – JPG and text file – are actually\
    \ controlled, for the most part, by the handleFile function in the FileInfoComponent\
