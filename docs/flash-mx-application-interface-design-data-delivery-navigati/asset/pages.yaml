- pgno: 61
  md: '# Movie variables


    The remaining time in this tutorial will be spent in the ActionScript editor,
    so stretch those typing fingers and then open up the editor if it is not already
    opened. Select the first frame of the variables layer to begin.


    We need to establish some values that we will use throughout our movie. Type the
    following into your ActionScript editor:


    ```

    stageWidth = Stage.width; //800

    stageHeight = Stage.height; //400

    sectionXPos = stageWidth*.8;

    halfButtonWidth = (stageWidth*.8)/5;

    buttonHeight = 25;

    subButtonWidth = halfButtonWidth*1.2;

    subButtonHeight = buttonHeight*1.2;

    ```


    The first two variables are the current dimensions of the stage, which we access
    through the Stage object. The sectionXPos variable holds the _x position of our
    section buttons at the right of the stage. The next four variables hold dimensions
    for our section buttons and subsection (or link) buttons. I''ve tried to make
    these all relative so that I could come back and quickly change a single value
    if I wished to alter dimensions for the site.


    Continue by adding these variables to our code:


    ```

    topSectionY = buttonHeight*1.5;

    branchDown = halfButtonWidth*1.3;

    extendedButton = halfButtonWidth*4.75;

    windowHeight = 400;

    windowWidth = extendedButton - branchDown;

    sectionButtons = [];

    ```


    topSectionY is the _y position that a section will move to when selected. branchDown
    is a bit less obvious, being the _x distance from the center of the section button
    where the main section window will open and drop down from. extendedButton is
    the distance across the stage a section button will extend to when selected. windowHeight
    and windowWidth are the dimensions of our opened section''s window. Finally, sectionButtons
    is an array that will hold references to all of our section buttons so that we
    may quickly loop through every button. The next piece of code holds all the information
    we will need to try different color schemes. Place this after the previous code:


    ```

    colorSchemes = {};

    colorSchemes.blackboard =

    {foreground:0xFFFFFF, background:0x000000};

    colorSchemes.chalkboard =

    {foreground:0xFFFFFF, background:0x003300};

    colorSchemes.blueprint =

    {foreground:0xFFFFFF, background:0x000033};

    colorSchemes.sketchpad =

    {foreground:0x000000, background:0xDDDDDD};

    colorSchemes.custom =

    {foreground:0x000055, background:0xDDDAA};

    currentColorScheme = colorSchemes.blackboard;

    ```


    I initially tried the site with white as a background color and black as the foreground,
    as you might find in a traditional sketchpad. As I developed the site further,
    I found it might resemble more of a chalkboard and so inverted the colors. This
    gave me the idea to provide a number of color schemes for the user, plus the ability
    to choose custom colors as well. As you can see, each scheme is a property of
    the colorSchemes object (blackboard, chalkboard, blueprint, sketchpad and custom).
    Each of these properties contains an object consisting of a foreground and background
    property. By changing the scheme then stored in the variable currentColorScheme,
    you can experiment with your own colors and schemes.'
  merge: -1
  img_proc: true
- pgno: 62
  md: "Now we have established our variables and color schemes, it’s time to place\
    \ a few movie clips on our stage to hold the actual graphics. This code is still\
    \ located on the variables layer:\n\n```\nthis.createEmptyMovieClip(\"sectionHolder\"\
    , 1);\n```\n\nsectionHolder is the clip that will hold all of the section buttons\
    \ themselves. I often like to place attached graphics into holders, rather than\
    \ adding them directly to the stage, because it gives more freedom for placing,\
    \ rotating and scaling the entire group if need arises.\n\nThe next movie clip\
    \ will serve as the background of our stage. Since we will be changing colors\
    \ dynamically, we can’t rely on the stage color itself. Instead we draw a box\
    \ around the stage, using the drawing API, and color it as needed:\n\n```\nthis.createEmptyMovieClip(\"\
    bg\", 0);\nbg.beginFill(currentColorScheme.background\n    , 100);\ndrawBox(bg,\
    \ 0, 0, stageWidth,\n    stageHeight);\nbg.endFill();\n```\n\nOK, the beginFill\
    \ (where we send a color and alpha value) and endFill lines might be familiar\
    \ to you if you have used the drawing API at all, but where does drawBox come\
    \ from? Well, since we will be drawing plenty of boxes in this movie, it’s best\
    \ that we place this in another function that we can easily call up over and over.\
    \ What we are sending to this new function are the clip in which to draw, and\
    \ the left, top, right and bottom boundaries for the box. Let’s take care of this\
    \ function now so you can see how we accomplish this.\n\nGo to the functions layer\
    \ of code (which should be empty) and type the following:\n\n```\ndrawBox = function(clip,\
    \ l, t, r, b) {\n    with(clip) {\n        moveTo(l, b);\n        lineTo(r, b);\n\
    \        lineTo(r, t);\n        lineTo(l, t);\n        lineTo(l, b);\n    }\n\
    }\n```\n\nAs simple as this function might seem, it will help us out tremendously.\
    \ Using the four boundaries sent, the function draws a box in the given clip.\
    \ Notice how we have kept the fill methods (as well as clear and lineStyle) outside\
    \ of the function so that we can handle these for differing clips. With that taken\
    \ care of, jump back to the variables layer so we can finish up there.\n\nBack\
    \ on the variables layer, we need to add the lines that will format all of our\
    \ text fields. Add these lines to follow the creation of the background graphic\
    \ (bg):\n\n```\nheadingTF = new TextFormat();\nheadingTF.align = \"right\";\n\
    headingTF.font = \"scriptFont\";\nheadingTF.size = 18;\nheadingTF.color = currentColorScheme.foreground;\n\
    \ninfoTF = new TextFormat();\ninfoTF.align = \"left\";\ninfoTF.font = \"scriptFont\"\
    ;\ninfoTF.size = 15;\ninfoTF.color = currentColorScheme.foreground;\n\nbuttonTF\
    \ = new TextFormat();\nbuttonTF.align = \"center\";\nbuttonTF.font = \"scriptFont\"\
    ;\nbuttonTF.size = 16;\nbuttonTF.color = currentColorScheme.foreground;\n```\n\
    \nHere we are using the new TextFormat object to provide formatting for our text\
    \ fields. Each formatting object has the same font, since we only exported one\
    \ from our library, though each has a different size and alignment. Notice too\
    \ how each establishes its color (which is the same for each) by looking in the\
    \ foreground property of the currentColorScheme. Since we set the currentColorScheme\
    \ to be blackboard, then that color will be white.\n\nIf you are using a font\
    \ other than QuillScript as your exported font, this is the area where you might\
    \ need to come back to adjust the font size. Simply alter each text format’s size\
    \ property if my values are not working for your choice of font.\n\nThat takes\
    \ care of all of our variables. Now it’s time to add the code that will actually\
    \ draw our buttons on our stage."
  merge: -1
  img_proc: true
- pgno: 63
  md: "# Drawing the buttons\n\nIt's frustrating typing a lot of code without seeing\
    \ any results, so let's write some code that will quickly show us a result and\
    \ reward us for our efforts so far. This will add new movie clips on the stage\
    \ to represent the section buttons at the right of the interface.\n\nGo to the\
    \ set up stage layer (which should be empty at this time) and type in the following:\n\
    \n```\nfor (i = 0; i < sections.length; i++) {\n    clip = sections[i].clip =\n\
    \    sectionHolder.createEmptyMovieClip\n    (\"sectionButton\" + i, i);\n   \
    \ sectionButtons.push(clip);\n    clip._y = ((i*2) * buttonHeight) +\n    buttonHeight*2;\n\
    \    clip._x = sectionXPos;\n}\n```\n\nWe start with a for loop to run through\
    \ the amount of sections we have already established in the section set-up layer.\
    \ For each of these sections we create a new movie clip and place a reference\
    \ to this movie clip in the new clip property of that section. We also place a\
    \ reference into a variable to make it easier to use in the rest of our code here.\
    \ The line following the clip's creation pushes a reference to the clip into the\
    \ sectionButtons array that we created earlier. The final two lines place the\
    \ clip on the stage. Although the _x position is the same for each clip, the _y\
    \ position changes based on the current iteration of the loop. It's not terribly\
    \ important how I arrived at this value, as it is simply a starting position from\
    \ which the clip will fall (and never be assigned again).\n\n![](img/50202c17d5022233f3e3ec60560e35aa_63_0.png)\n\
    \nThe next piece of code, to be placed immediately after the previous section,\
    \ adds and formats a text field in the sectionButton movie clip:\n\n```\nclip.createTextField(\"\
    label\", 0,\n    halfButtonWidth*.75, -buttonHeight/2,\n    0, 0);\nlabel = clip.label;\n\
    label.setNewTextFormat(headingTF);\nlabel.embedFonts = 1;\nlabel.autoSize = \"\
    right\";\nlabel.selectable = 0;\nlabel.text = sections[i].name;\nlabel._y -= label.textHeight/2;\n\
    ```\n\nTo understand how label is placed, we first need to look at how the sectionButton\
    \ graphic will be drawn. Basically, a border will be drawn from the center of\
    \ the sectionButton clip to the left and right (positive and negative _x) by halfButtonWidth,\
    \ and from 0 to -buttonHeight on the _y axis. So placing the label text field\
    \ at halfButtonWidth*.75 and -buttonHeight/2 puts it off on the far right on the\
    \ x axis and in the middle on the y axis. We give it a height and width of 0 since\
    \ in a few lines we set its autoSize property to right, meaning it will automatically\
    \ resize from the right depending on the text we place inside it. We also apply\
    \ the headingTF text format and embed the exported font so that it can be seen.\
    \ After disabling the text field's selectable property, which would allow the\
    \ user to select the text, we place the corresponding section's name in the text\
    \ property and adjust the y position based on the textHeight to keep the text\
    \ in the middle of our clip.\n\nThe next bit of code adds a new movie clip inside\
    \ of our sectionButton to hold any drawings we do with the drawing API. Place\
    \ it after the previous code:\n\n```\ndrawing = clip.createEmptyMovieClip\n(\"\
    drawing\", 2);\ndrawing.leftSide = halfButtonWidth;\ndrawBorders(drawing);\n```"
  merge: -1
  img_proc: true
- pgno: 64
  md: "After creating a new clip named drawing, we give it a variable to hold the\
    \ current left side of the drawing (right now, simply half of the sectionButton's\
    \ width from sectionButton center). This will change as we extend the left side\
    \ of the button to the left as the section opens. The next line is another function\
    \ I've added to encapsulate the code that we will use throughout. drawBorders\
    \ will add randomized borders to a movie clip. Let's jump back to our functions\
    \ code layer and add this new function now.\n\nIn the functions layer, immediately\
    \ following our drawBox function, write the following:\n\n```\n```\ndrawBorders\
    \ = function(clip) {\n  clip.clear();\n  clip.lineStyle(1,\n  > currentColorScheme.foreground,\
    \ 100);\n  drawRandomBox(clip, -clip.leftSide, -\n  > buttonHeight, halfButtonWidth,\
    \ 0);\n}\n```\n```\n\nIn this function, we accept a movie clip as a parameter\
    \ and clear it of any previous drawings, reset the lineStyle based on the current\
    \ color scheme's foreground color, and call a new function, drawRandomBox, sending\
    \ it the clip and its four boundaries. This function is similar to our earlier\
    \ drawBox function, but instead will draw a box with randomized borders. Let's\
    \ write the necessary code now.\n\nBelow the drawBox function, add the following\
    \ new function:\n\n```\n```\ndrawRandomBox = function(clip, l, t, r, b) {\n  with\
    \ (clip) {\n    for (var i = 0; i < 3; i++) {\n      moveTo(getRandom(10) + l,\n\
    \      > getRandom(10) + b);\n      lineTo(getRandom(10) + r,\n      > getRandom(10)\
    \ + b);\n      lineTo(getRandom(10) + r,\n      > getRandom(10) + t);\n      lineTo(getRandom(10)\
    \ + t,\n      > getRandom(10) + t);\n      lineTo(getRandom(10) + l,\n      >\
    \ getRandom(10) + b);\n    }\n  }\n}\n```\n```\n\nIn this function, we run through\
    \ a for loop three times and draw from and to randomized positions about the box's\
    \ boundaries. What's getRandom? Why, another function we're just about to write.\n\
    \nAdd this above the drawBox function, still on the functions layer:\n\n```\n\
    ```\ngetRandom = function(range) {\n  return Math.random()*range - range/2\n}\n\
    ```\n```\n\nPretty simple. We call this function and send a range in which to\
    \ find a randomized number. The function uses Math.random to find a number between\
    \ 0 and 1, multiplies this by our range so we have a number between 0 and our\
    \ range maximum, then we subtract half of our range so the final number returned\
    \ falls within the specified range but on either side of 0 (so a range of 10 will\
    \ return a number between -5 and 5). Now we have our drawBorders function call\
    \ complete and we can return to the set up stage layer to finish our script there.\n\
    \nAfter returning to the set up stage layer, add these lines to finish up the\
    \ for loop:\n\n```\n```\nbtn = clip.createEmptyMovieClip(\"btn\", 1);\nbtn.beginFill(0,\
    \ 0);\ndrawBox(btn, -halfButtonWidth,\n> -buttonHeight, halfButtonWidth, 0);\n\
    btn.endFill();\nbtn.onRollOver = sectionOver;\nbtn.onRollOut = btn.onReleaseOutside\
    \ =\n> btn.onDragOut = sectionOut;\nbtn.onRelease = function() {\n> selectMe.apply(this._parent)\
    \ };\n}\ndelete clip;\ndelete btn;\ndelete drawing;\ndelete labelHolder;\ndelete\
    \ label;\ndelete i;\n```\n```"
  merge: -1
  img_proc: true
- pgno: 65
  md: "btn will be the final movie clip inside of our sectionButton. We need this\
    \ clip for all of the actual button functionality, since at this time we only\
    \ have a text field and clip of line drawings. btn will serve as our solid hit\
    \ area for the user's mouse to click. To accomplish this, we call the drawBox\
    \ function, but only after setting the clip's fill alpha to 0. This will give\
    \ us a solid, rectangular hit area that's invisible to the user. The final lines\
    \ in the for loop assign the button actions, sectionOver, sectionOut and selectMe,\
    \ the third of which we will write in the next section (where we will discuss\
    \ the use of apply). After we close the for loop, we delete all of the unnecessary\
    \ variables we no longer need.\n\nFinally in this section, we will write the functions\
    \ that will control our rollover effects. Go to the sections code layer (which\
    \ should be empty at this time) and type the following:\n\n```\nsectionOver =\
    \ function() {\n    this.onEnterFrame = function() {\n        drawBorders(this._parent.drawing)};\n\
    }\n\nsectionOut = function() {\n    delete this.onEnterFrame\n}\n```\n\nThese\
    \ are two simple functions that are called when our section buttons are rolled\
    \ over and off. sectionOver has the clip call the drawBorders function on each\
    \ enterFrame event (sending the appropriate drawing clip. located on the parent's\
    \ timeline since the onEnterFrame lies on the btn timeline). sectionOut simply\
    \ deletes that handler.\n\nAll right! Test your movie now to see the section buttons\
    \ placed on the stage and their borders drawn and redrawn. A pretty nice beginning,\
    \ and it only gets more fun from here!\n\n![](img/50202c17d5022233f3e3ec60560e35aa_65_0.png)\n\
    \n![](img/50202c17d5022233f3e3ec60560e35aa_65_1.png)"
  merge: -1
  img_proc: true
- pgno: 66
  md: "# # Making the buttons bounce\n\nThe next section of code will deal with the\
    \ bouncing effect that occurs when one of the sectionButtons is selected. Here\
    \ you’ll notice we’ve got a whole bunch of real-feeling going on. We’ve got the\
    \ interface pretending to be a chalkboard, we’ve got areas that pretend to be\
    \ buttons, and now those buttons are going to pretend to be bouncy – all in the\
    \ name of making our user feel comfortable!\n\nThis is probably the toughest code\
    \ in this entire tutorial, so stick with me and we’ll make it through. It’s all\
    \ downhill from there!\n\nThe concept for this code is that each button will have\
    \ a ground and ceiling (usually another button), and it will look to these as\
    \ it’s falling or rising to determine when it needs to rebound. As a new section\
    \ is selected, the button selected will be moved from the stack of buttons bouncing,\
    \ and so a new order, with new ground and ceiling clips, will need to be determined.\
    \ The first thing we will need to do is add a few variables to the variables layer\
    \ to take care of the values driving the fall.\n\nGo to the variables layer and\
    \ add the following lines of code before our colorSchemes declaration:\n\n```\n\
    gravity = .6;\nbounceFactor = .1;\nbuttonEnergy = .5\n```\n\nAlthough it is all\
    \ fake physics that I employ (I practice a lot of “that looks good to me” physics),\
    \ I tried to name the variables to match their real-world functions. Therefore\
    \ gravity will control how quickly a section will fall. bounceFactor is how high\
    \ a button will rebound once it hits the ground (or another button). buttonEnergy\
    \ controls how quickly the buttons will come to rest after falling and bouncing.\n\
    \nNow add the following lines after the creation of the sectionHolder movie clip\
    \ (still on the variables layer):\n\n```\nwindowBottom = sectionHolder.\n\t createEmptyMovieClip(“ground”,\
    \ 500);\nwindowBottom._y = windowHeight*.95;\nwindowTop = sectionHolder.\n\t createEmptyMovieClip(“ceiling”,\
    \ 501);\nwindowTop._y = 0;\n```\n\nInside sectionHolder, I create two empty movie\
    \ clips to serve as position holders at the top and bottom of the window. When\
    \ the sectionButtons are finding the other buttons above and below them, these\
    \ two new clips will act as book ends so that each sectionButton has clips on\
    \ either side, including the sectionButtons at the top or bottom of the stack.\n\
    \nNow go to the sections code layer and place the following lines of code after\
    \ the sectionOut function:\n\n```\nselectMe = function() {\n\t delete this.btn.onEnterFrame;\n\
    \t this.btn.enabled = 0;\n\t this.onEnterFrame = moveUp;\n\t for (var i in sections)\
    \ {\n\t\t if (sections[i].clip == this) {\n\t\t\t currentSection = i;\n\t\t\t\
    \ break;\n\t\t }\n\t }\n}\n```\n\nselectMe will be called when a sectionButton\
    \ is clicked. The first thing it needs to do is to delete the drawBorders call\
    \ that is occurring on its btn’s onEnterFrame. It then disables the button so\
    \ that it can no longer be clicked. The moveUp function assigned to the sectionHolder’s\
    \ onEnterFrame will do exactly that – move the button up to the top of the screen.\
    \ We will write this function in a moment. Finally, the for in loop goes through\
    \ the sections array and finds the reference to the clip that was clicked so that\
    \ we can know what section has been selected. We store this index number in the\
    \ currentSection variable."
  merge: -1
  img_proc: true
- pgno: 67
  md: "If you look back to the code located in the set up stage layer where we called\
    \ this function in btn's onRelease handler, you will see that we incorporated\
    \ a rather odd way of calling the function:\n\n```\nbtn.onRelease = function()\
    \ {\n\tselectMe.apply(this._parent) };\n```\n\napply is an interesting new addition\
    \ in Flash MX that allows you to specify what clip is represented by this inside\
    \ a function. In the above example, I apply the selectMe function to the _parent\
    \ of btn, which is the sectionButton itself. Therefore in the code for selectMe,\
    \ any time this appears, it now refers to the sectionButton sent. In addition,\
    \ you can send parameters inside of an array, a process I will demonstrate shortly.\n\
    \nNext we need to find a reference to the sectionButton in the sectionButtons\
    \ array, which we will use to determine the ground and ceiling for each sectionButton.\
    \ Type this code after the previous lines:\n\n```\nfor (var i in sectionButtons)\
    \ {\n\tif (sectionButtons[i].selected) {\n\t\tsectionButtons[i].btn.enabled =\
    \ 1;\n\t\tdelete sectionButtons[i].selected;\n\t}\n\tif (sectionButtons[i] ==\
    \ this) {\n\t\tsectionButtons.splice(i, 1);\n\t\tsectionButtons.unshift(this);\n\
    \t\tthis.selected = 1;\n\t}\n}\n```\n\nBefore we search for this sectionButton's\
    \ reference, we first find the previously selected sectionButton so that we can\
    \ re-enable it. After this is accomplished, we find reference to this sectionButton\
    \ in the sectionButtons array and remove it from its position and place it at\
    \ the beginning instead using the built-in unshift method. We also give it a new\
    \ property, named selected, which will serve as a flag to find it when another\
    \ button is clicked (as you can see in the previous if statement).\n\nWith the\
    \ selected sectionButton placed safely in the first index of our sectionButtons\
    \ array, we can look at all of the other buttons and determine each one's ground\
    \ and ceiling clip. Write this code after the previous lines:\n\n```\nfor (var\
    \ i = 1; i < sectionButtons.length;\ni++) {\n\tif (i == sectionButtons.length-1)\
    \ {\n\t\tvar params = [windowBottom,\n\t\t\tsectionButtons[i-1], i]\n\t} else\
    \ if (i == 1) {\n\t\tvar params = [sectionButtons[i+1],\n\t\t\twindowTop, i]\n\
    \t} else {\n\t\tvar params = [sectionButtons[i+1],\n\t\t\tsectionButtons[i-1],\
    \ i]\n\t}\n\tinitFall.apply(sectionButtons[i], params);\n}\n```\n\nLooping through\
    \ our sectionButtons array, skipping the first index which contains the selected\
    \ section, we call the function initFall for each sectionButton. First, however,\
    \ we need to determine the two clips above and below each sectionButton so that\
    \ it will know its ground and ceiling. If you read the note above dealing with\
    \ the apply function, you will recall I mentioned that you can send parameters\
    \ as well inside an array. You can see that for each sectionButton, I create a\
    \ local array named params, which contains three indices."
  merge: -1
  img_proc: true
- pgno: 68
  md: "The first is the sectionButton's ground clip, the second is its ceiling, while\
    \ the third is simply its index position in the array. For the bottom sectionButton,\
    \ which will be located at the end of the sectionButtons array, the ground clip\
    \ will be the windowBottom clip that we created previously, located at the bottom\
    \ of the interface. For the top sectionButton (excluding the selected button),\
    \ we send windowTop as its ceiling so that it cannot bounce above the screen.\
    \ For the remaining sectionButtons, the sectionButton on either side of it in\
    \ the array serves as the top or bottom. Once params has been set for each, we\
    \ can apply the initFall function, sending the params on as a second argument.\n\
    \nOK. with this function we have named three other functions that we will need\
    \ to take care of: moveUp, initFall and fall. Let's take care of moveUp first,\
    \ since it is the simplest.\n\nWe will write initFall in a moment, but let's first\
    \ finish up the selectMe function.\n\nStill in the sections code layer, directly\
    \ beneath the selectMe function, add this new function:\n\n```\nmoveUp = function()\
    \ {\n    this._y -= (this._y - topSectionY)/2;\n    if (Math.abs(this._y - topSectionY)\
    \ < 1)\n    {\n        delete this.onEnterFrame;\n    }\n}\n```\n\nHere are the\
    \ final lines:\n\n```\nbuttonFallers = sectionButtons.slice(1);\nclearInterval(buttonFall);\n\
    buttonFall = setInterval\n\t(this.parent.parent, \"fall\", 20);\n}\n```\n\nThat's\
    \ pretty easy to deal with, isn't it? Each frame, the sectionButton is moved half\
    \ of the remaining distance to the top of the stage. When it is close enough,\
    \ the onEnterFrame is deleted. Now let's take care of the initFall function, which\
    \ we will place in the bouncing code layer.\n\nBy slicing from index 1 of sectionButtons\
    \ to its end, we effectively place all of the buttons that need to fall and bounce\
    \ inside a new array named buttonFallers. With that set, we create a new interval\
    \ call (after first clearing any previous calls that might still be being made)\
    \ that will call the fall function (yet to be written) on the parent_parent's\
    \ timeline, which works out to be the main timeline. We will call this function\
    \ every 20 milliseconds and give this call the identifier buttonFall, which we\
    \ can then use to clear the interval call (as we do in the previous line). Though\
    \ you might think that 20 milliseconds is a bit too often to call this function,\
    \ I found it gave the best results even after altering the gravity variable and\
    \ the frame rate.\n\nGo to the bouncing code layer, which should be empty at this\
    \ time, and type the following code:\n\n```\ninitFall = function(ground, ceiling,\
    \ place) {\n    var finalVicinity = windowBottom._y -\n    ((sectionButtons.length-1)-place)\n\
    \    *(buttonHeight*1.5));\n    if (this._y >= finalVicinity) { return false });\n\
    \    this.moving = 1;\n    this.velocity = 0;\n    this.energy = buttonEnergy;\n\
    \    this.ground = ground;\n    this.ceiling = ceiling;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 69
  md: "Even though the arguments sent to initFall were placed in an array, we do not\
    \ need to access them in such a way thanks to the nature of the apply function.\
    \ Instead, we simply have them separated into separate arguments. We place ground\
    \ and ceiling, which are references to other clips, in this sectionButtons's ground\
    \ and ceiling properties, and we initialize a few variables, moving (a Boolean\
    \ flag to determine whether the button is moving), velocity (its current rate)\
    \ and energy (which equals the buttonEnergy variable we set earlier).\n\nBefore\
    \ we set these properties, however, we make sure the button should be falling\
    \ at all. Basically, any sectionButtons that are already in their final resting\
    \ position needn't (and shouldn't) fall at all, so we quickly determine the general\
    \ whereabouts of that final position. By finding the button's place from the bottom\
    \ of the sectionButton's stack and multiplying this value by 1.5 the height of\
    \ the button (the height can vary thanks to the sketchy border) and then subtracting\
    \ this from the bottom of the interface represented by windowBottom, we can see\
    \ if the button is in the area where it will come to rest. If it is, then we exit\
    \ the function without initializing anything, which will leave its energy as undefined.\n\
    \nfall should be added directly after the initFall function, still on the bouncing\
    \ code layer:\n\n```\nfall = function() {\n  for (var i in sectionButtons) {\n\
    \    var which = sectionButtons[i];\n    if (which._yscale < 100) { which.\n \
    \     _yscale++ } else { which._yscale = 100 };\n    if (which._xscale > 100)\
    \ { which.\n      _xscale-- } else { which._xscale = 100 };\n  }\n}\n```\n\nThis\
    \ is the start of our fall function, which you will recall we set up to be called\
    \ at a set interval after a button had been clicked. These first few lines simply\
    \ run through all of the buttons and make sure they are at 100% scale, and if\
    \ they're not, adjust them a little each interval call.\n\n# Continuing with the\
    \ fall function:\n\n```\nfor (var i in buttonFallers) {\n  var which = buttonFallers[i];\n\
    \  which._y += which.velocity;\n  which.velocity += gravity;\n}\n```\n\nNow we\
    \ run through all of the buttons that are falling. We place a reference to the\
    \ current button in the variable which and adjust its _y position by its current\
    \ velocity, which could be positive or negative. We then adjust its velocity by\
    \ the gravity constant.\n\nHere is the biggest chunk of code from this function,\
    \ which deals with a button hitting its ground clip:\n\n```\nif (which._y > which.ground._y\
    \ -\n  which.ground._height) {\n  squish(which, which.ground);\n  which._y = which.ground._y\
    \ -\n  which.ground._height;\n  which.velocity *= -which.energy;\n  if (which.energy\
    \ < .1) {\n    delete which.moving;\n    delete which.energy;\n    delete which.velocity;\n\
    \    which._xscale = which._yscale = 100;\n    buttonFallers.splice(i, 1);\n \
    \ } else {\n    if (!which.ground.moving) {\n      which.energy -= bounceFactor\n\
    \    }\n  }\n}\n```\n\nIf the sectionButton is hitting its ground clip, it squishes\
    \ the two (a function we will write in a moment), absolutely places its _y position\
    \ so the two don't overlap, and reverses the button's direction. We then make\
    \ a check to see if all of the sectionButton's energy is depleted, which means\
    \ it should come to a rest. If it has lost all of its energy, it removes all of\
    \ the added properties, resets itself to 100% scale, and removes itself from the\
    \ buttonFallers array since it no longer is falling. However, if energy does remain\
    \ in the sectionButton, it checks to see if the ground clip was actually moving\
    \ up when they hit. If this is the case, nothing happens (no loss of energy),\
    \ but if not, then some energy is removed."
  merge: -1
  img_proc: true
- pgno: 70
  md: "Now that we have taken care of the ground clips, we need to do the same for\
    \ the ceiling clips. Place this code next:\n\n```\n```\nif (which._y + which.height\
    \ < which.ceiling._y) {\n  which._y = which.ceiling._y + which._height;\n  which.ceiling.energy\
    \ += bounceFactor;\n}\n```\n```\n\nThis is much simpler than the previous section.\
    \ Basically, if a button is hitting the clip above it, it readjusts its position\
    \ and adds some energy to the ceiling clip.\n\nThis last piece of code finishes\
    \ up our fall function:\n\n```\n```\nif (buttonFallers.length < 1) {\n  clearInterval(buttonFall);\n\
    }\n```\n```\n\nEach time a sectionButton comes to rest, it removes itself from\
    \ the buttonFallers array. Once all of the clips have been removed, the interval\
    \ call is cleared.\n\nTo complete the bouncing code, we need to code in one last\
    \ function, squish, an easy addition.\n\nAdd these lines directly after the fall\
    \ function, still on the bouncing code layer:\n\n```\n```\nsquish = function(one,\
    \ two) {\n  var totalEnergy = one.energy + two.energy;\n  one._yscale = two._yscale\
    \ = 100 -\n    (30*totalEnergy);\n  one._xscale = two._xscale = 100 +\n    (10*totalEnergy);\n\
    }\n```\n```\n\nWith squish, the total energy of the two colliding clips is used\
    \ to determine how much to scale those clips. The clips are actually squished\
    \ on the y axis and stretched on the x axis. The code at the top of our fall function\
    \ is what slowly returns the clips back to normal.\n\nIf you can believe it, only\
    \ one line remains to get our bouncing sections working. Go to the set up stage\
    \ layer and add this line at the very end. Basically, it will be the final line\
    \ of code before the stage is drawn the first time.\n\n```\n```\nselectMe.apply(sections[0].clip);\n\
    ```\n```\n\nThis will select the first section (home) automatically when the movie\
    \ starts. If you look back at the selectMe code, you will see that this is where\
    \ we called the initFall and fall functions, so selecting this clip sets the falling\
    \ in motion as the movie begins.\n\nTest your movie now to see the squishy, animated\
    \ chalk sections.\n\n![](img/50202c17d5022233f3e3ec60560e35aa_70_0.png)"
  merge: -1
  img_proc: true
- pgno: 71
  md: "# Adding the content\n\nWell, we now have a nice effect to enhance the otherwise\
    \ familiar menu on the right. Of course, now we need the menus to actually load\
    \ the content that they are advertising. We will take care of this with four functions\
    \ that will not only attach the content links, but also animate each section after\
    \ it has been clicked and moved to the top of the interface so that the content\
    \ can be revealed in a more engaging way.\n\nThe first item we need to address\
    \ is when to actually begin the animation and loading of content. I chose to initiate\
    \ these actions once a section had reached the top of the interface after being\
    \ clicked. In the sections code layer, alter the `moveUp` function to read (changes\
    \ in bold):\n\n```\nmoveUp = function() {\n  this._y -= (this._y - topSectionY)/2;\n\
    \  if (Math.abs(this._y - topSectionY) < 1) {\n    this.onEnterFrame = extendLeftSide;\n\
    \  }\n}\n```\n\nNow instead of merely deleting the `onEnterFrame`, we assign another\
    \ function to it named `extendLeftSide`. Let's write that function now.\n\nStill\
    \ on the sections code layer, add the following function directly after `moveUp`:\n\
    \n```\nextendLeftSide = function() {\n  this.drawing.leftSide += (extendedButton\
    \ - this.drawing.leftSide)/1.2;\n  drawBorders(this.drawing);\n  if (extendedButton\
    \ - this.drawing.leftSide < 1) {\n    addContent.apply(this);\n  }\n}\n```\n\n\
    There's really nothing here that you've not seen before, though you might be more\
    \ familiar with such easing animation code being used to adjust stage coordinates\
    \ (just as we used in `moveUp`). What we are easing here instead is the `leftSide`\
    \ property of our `sectionButton`. By calling the `drawBorders` function immediately\
    \ after, we have accomplished the animation of our extending button across the\
    \ stage. Once the left side of the stage has been reached (represented by `extendedButton`),\
    \ we call another function named `addContent`, which we will write in a moment.\
    \ First, go ahead and test your movie to see how these additions work.\n\nObviously,\
    \ one thing we have to deal with is retracting our extended sections, so let's\
    \ write that code next. Place this new function directly after `extendLeftSide`:\n\
    \n```\nretractLeftSide = function() {\n  this.drawing.leftSide -= (this.drawing.leftSide\
    \ - halfButtonWidth)/2;\n  if (this.drawing.leftSide - halfButtonWidth < 1) {\n\
    \    this.drawing.leftSide = halfButtonWidth;\n    delete this.onEnterFrame;\n\
    \  }\n  drawBorders(this.drawing);\n}\n```\n\nThis does the exact opposite of\
    \ our `extendLeftSide` function. Now we just need to call it when a new section\
    \ has been clicked, so the obvious place is in the `selectMe` function.\n\nAmend\
    \ the `selectMe` function as shown:\n\n```\nfor (var i in sectionButtons) {\n\
    \  if (sectionButtons[i].selected) {\n    sectionButtons[i].onEnterFrame = retractLeftSide;\n\
    \    sectionButtons[i].btn.enabled = 1;\n    delete sectionButtons[i].selected;\n\
    \  }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 72
  md: "So now when a new section is pressed, the previously selected section will\
    \ retract its left side. Test your movie to see how this works.\n\n![](img/50202c17d5022233f3e3ec60560e35aa_72_0.png)\n\
    \nAfter the retractLeftSide function, begin the addContent function that we called\
    \ earlier:\n\n```\naddContent = function() {\n    this.drawing.bottom = 0;\n \
    \   this.onEnterFrame = extendBottomSide;\n}\n```\n\nObviously this doesn't yet\
    \ add any content at all, but we will take care of that in a moment. In the meantime,\
    \ let's focus on the extendBottomSide function we just set to be called on the\
    \ onEnterFrame handler. This is what will take care of extending the window down\
    \ once the section button has extended to the left of the interface. Notice how\
    \ first we have set the bottom property, which represents the current position\
    \ of the bottom side, to 0. Let's take care of extendBottomSide to see how it\
    \ works.\n\nPlace this code immediately above the addContent function:\n\n```\n\
    extendBottomSide = function() {\n    var mc = this.drawing;\n    mc.bottom +=\
    \ ((windowBottom._y - topSectionY()) - mc.bottom)/1.2;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 73
  md: 'It starts off simple enough, using the same easing code we used in our previous
    functions to adjust the bottom side a little each call. The next bit of code will
    take care of the drawing itself.


    Place this code after the previous lines:


    ```

    with (mc) {

    clear();

    lineStyle(1, currentColorScheme.foreground, 100);

    for (var j = 0; j < 3; j++) {

    moveTo(getRandom(10) - leftSide, getRandom(10) - buttonHeight);

    lineTo(getRandom(10) + halfButtonWidth, getRandom(10) - buttonHeight);

    lineTo(getRandom(10) + halfButtonWidth, getRandom(10));

    lineTo(getRandom(10) - branchDown, getRandom(10));

    lineTo(getRandom(10) - branchDown, getRandom(10) + bottom);

    lineTo(getRandom(10) - leftSide, getRandom(10) + bottom);

    lineTo(getRandom(10) - leftSide, getRandom(10) - buttonHeight);

    }

    }

    ```


    We cannot call the drawBorders function in this case since now we are dealing
    with a polygon of six sides instead of four. The concept is still the same, however,
    despite the extra sides. We loop three times and draw randomized lines for each
    side as the bottom side of the window extends down. Now of course, we need to
    check when we reach the bottom.


    Type these lines to finish the extendBottomSide function:


    ```

    if ((windowBottom._y - topSectionY) - mc.bottom < 1) {

    delete this.onEnterFrame

    }

    ```


    Just as before, we check each function call to see when we are close enough to
    our destination to stop, at which point the onEnterFrame handler is removed. Test
    your movie now to see the result.


    ![](img/50202c17d5022233f3e3ec60560e35aa_73_0.png)'
  merge: -1
  img_proc: true
- pgno: 74
  md: "Well, now we can see where the content needs to be added, so let's take care\
    \ of that by adding the following lines to our addContent function as shown:\n\
    \n```\naddContent = function() {\n  this.drawing.bottom = 0;\n  this.onEnterFrame\
    \ = extendBottomSide;\n  var content = this._parent.createEmptyMovieClip(\"content\"\
    , 50);\n  var margin = sectionXPoss - extendedButton;\n  content.createTextField(\"\
    info\", 0, margin*1.6, windowHeight*.25,\n    ➤ windowWidth*.45, windowHeight*.45);\n\
    \  var info = content.info;\n  info.setNewTextFormat(infoTF);\n  info.embedFonts\
    \ = 1;\n  info.selectable = 0;\n  info.wordWrap = 1;\n  info.text = sections[currentSection].info;\n\
    \  info._y -= info.textHeight/2;\n}\n```\n\ncontent is a movie clip we add to\
    \ the main timeline (this._parent) that will hold all of the content. margin holds\
    \ the amount of space to the left of the open window, which will help us when\
    \ we start placing items. The text field we add is at the upper left of the window,\
    \ a quarter of the way down and about half the width and height of the window\
    \ itself. We give it all the necessary formatting, including the ability to wordwrap,\
    \ and place whatever info text we included with the section.\n\nNext, we're going\
    \ to attach and color the appropriate image for the section. Place this code immediately\
    \ following the last line above, but before addContent's closing bracket (this\
    \ code is all a part of addContent):\n\n```\nvar image = content.attachMovie(sections[currentSection].image,\n\
    \  ➤ \"image\", 500);\nimageColor = new Color(image);\nimageColor.setRGB(currentColorScheme.foreground);\n\
    image.onRollOver = function() { info.text = sections[currentSection].info };\n\
    image.useHandCursor = 0;\nimage._x = windowWidth*.65;\nimage._y = windowHeight*.1;\n\
    ```\n\nThis code is all fairly straightforward. We attach an image, color it based\
    \ on the foreground color, give it a button action to place the section info back\
    \ into the info text field upon rollOver, disable the hand cursor and finally\
    \ place the image at the upper right of the window.\n\n![](img/50202c17d5022233f3e3ec60560e35aa_74_0.png)\n\
    \n![](img/50202c17d5022233f3e3ec60560e35aa_74_1.png)\n\n![](img/50202c17d5022233f3e3ec60560e35aa_74_2.png)\n\
    \n![](img/50202c17d5022233f3e3ec60560e35aa_74_3.png)\n\n![](img/50202c17d5022233f3e3ec60560e35aa_74_4.png)\n\
    \n![](img/50202c17d5022233f3e3ec60560e35aa_74_5.png)"
  merge: -1
  img_proc: true
- pgno: 75
  md: 'Continuing with addContent, place this code after the previous image code (again,
    before addContent''s closing bracket):


    ```

    var midLine = content.createEmptyMovieClip("midLine", 250);

    midLine.lineStyle(1, currentColorScheme.foreground, 100);

    for (var i = 0; i < 4; i++) {

    midLine.moveTo(getRandom(10) + margin, getRandom(10) +

    windowHeight/2);

    midLine.lineTo(getRandom(10) + windowWidth + margin, getRandom(10)

    + windowHeight/2);

    }

