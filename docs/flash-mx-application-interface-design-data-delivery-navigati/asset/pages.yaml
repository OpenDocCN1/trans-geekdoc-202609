- pgno: 89
  md: 'Two stop actions make up the sole code in this clip, which is merely a shape
    tween from a circle to a rectangle and back to a circle. This is the animation
    that occurs when a node is opened and it transforms and covers the interface.
    If you select the rectangle on the stage, you will see that it is 110 x 80 pixels,
    which will scale up nicely to 550 x 400, the size of the viewing window we will
    be using. How convenient! So when a node is opened, we will need to scale it up
    to 500% to cover the window in its entirety. At that point, we will attach the
    nodeInterface to the stage, which is the next symbol we will look at.


    # The node interface


    Have a look inside the interface assets folder. It only contains three symbols,
    a graphic, interfaceBack, a movie clip, jumpTo, which simply contains a button
    and a text field, and the movie clip nodeInterface. Enter symbol editing mode
    for this final movie clip.


    ![](img/50202c17d5022233f3e3ec60560e35aa_89_0.png)


    This is the movie clip that is attached to the stage whenever a node is opened
    in the tree and its interface is accessed (something the finished file allows,
    but we won''t be covering in this tutorial). The movie clip is extremely straightforward,
    with a single stop action at its final frame being the only code. The tween is
    simply an alpha motion


    tween of the interfaceBack symbol (which is only a white rectangle). When a node
    is opened, you saw that its graphic tweens from a circle to a rectangle and scales
    to fill the stage. It will be at this point that this symbol, nodeInterface, is
    attached to the stage. The alpha tween produces a brief white flash that fades
    to slowly reveal the information we attach (in the form of a series of combo boxes).
    There are actually two things to note if you intend to adapt this project for
    your own purposes. First, this clip contains graphics that are 550 x 400 pixels
    in total, which is the size of the window I''ve chosen to display the tree (not
    the stage size necessarily). That way, as I said, when a node is opened, this
    interface will cover the viewing window in its entirety. Second, since this clip
    is attached to the stage dynamically, it is obviously separate from the node graphic
    and symbols, so you can easily create a different background and use it for your
    interface without the need to worry about how it will affect the nodes. It gives
    you some freedom to play.


    # The bevelBox


    The last folder to examine is the bevelBox assets folder. The bevelBox is a handy
    little clip that I use in the expanded interface window (so we will not be using
    it specifically in this tutorial, though it will be handy for you to know if you
    wish to look at the finished project). The way I have set it up, I can simply
    attach it and give it a size, using a custom setSize method, and it will automatically
    expand to that size (without scaling the border). I''ve set it up in a similar
    fashion to the way Macromedia created their components that expand without distorting
    the graphics. If you enter symbol editing mode for the symbol bevelBox itself
    (which you will notice is also exported), you will see how this was done.


    The movie clip only contains two layers, one of graphics, the other of code. The
    code is obviously what does all of the work, but since we have plenty of code
    to cover for the rest of the project I won''t go over the code contained here.
    Briefly, what I''ve done is create a custom class by extending the MovieClip object.
    The BevelBoxClass really only does two things: expands to a set size, and'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'makes itself draggable. We will create another custom class by extending the
    MovieClip object in the code later in this chapter, so I would encourage you to
    come back and take a look at this code then and apply your knowledge. It really
    is no different (and is actually much simpler) than the coding we are about to
    embark on, except for the existence of the #initclip and #endinitclip lines as
    the bookends of the code. All these lines do is allow us to place this code inside
    a movie clip as opposed to on our main timeline, and the code will still run before
    the movie begins, initializing our object.


    # The structure


    The last item that has been prepared for this project is the code in the layer
    named structure on the main timeline. If you select the frame in this layer and
    open your ActionScript editor, you will see the code I use to populate the tree.
    Since you will want to alter this for your own projects, it''s important that
    we look at it more closely so you understand how I accomplished it.


    First, we have three objects in which I store the color values for the nodes:


    ```

    chaosCol = {params:{ra:50, rb:32, ga:50,

    gb:-10, ba:50, bb:0}, connector:0x471D27};

    titansCol = {params:{ra:50, rb:17, ga:50,

    gb:34, ba:50, bb:36}, connector:0x38494B};

    olympiansCol = {params:{ra:50, rb:32, ga:50,

    gb:13, ba:50, bb:37}, connector:0x47344C};

    ```


    Each object contains two properties: params and connector. params holds another
    custom object containing values to send to the Color object''s setTransform method.
    We will use the params object to tint the nodes themselves. connector, on the
    other hand, contains a hexadecimal value that we will send to the beginGradientFill
    method when we draw our connectors with the drawing API.


    The rest of the lines of script in the structure layer deal with populating our
    tree. Let''s look at the first two lines of this code:


    ```

    chaos = {name:"Chaos", col:chaosCol};

    chaos.info = "This is where I would put information on Chaos."

    ```


    Each node in our tree will be an object holding at least three properties. The
    first property is the node''s name, the second is a reference to our custom coloring
    objects created above, and the third is any information we wish to have related
    about that node in its expanded interface.


    If you are not familiar with the number of ways to create custom objects, it''s
    important for you to know that all of the following methods accomplish the exact
    same thing:


    ```

    chaos = new Object();

    chaos.name = "Chaos";


    chaos = new Object();

    chaos["name"] = "Chaos";


    chaos = {};

    chaos.name = "Chaos";


    chaos = {};

    chaos["name"] = "Chaos";


    chaos = {name:"Chaos"};

    ```


    The way I have chosen is to give the object a name and color property on the first
    line, and an info property on the second. I felt this method was clear and easy
    to update, as well as keeping the number of lines at a manageable length.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'Now to build on this first object, which will be the patriarch for the entire
    tree, I added these lines:


    ```

    gaea = {name:"Gaea", col:titansCol};

    gaea.info = "This is where I would put information on Gaea."

    tartarus = {name:"Tartarus",

    col:chaosCol};

    tartarus.info = "This is where I would put information on Tartarus."

    eros = {name:"Eros", col:chaosCol};

    eros.info = "This is where I would put information on Eros."

    erebus = {name:"Erebus", col:chaosCol};

    erebus.info = "This is where I would put information on Erebus."

    chaos.children = [gaea, tartarus, eros,

    erebus];

    delete tartarus;

    delete eros;

    delete erebus;

    ```


    Each child is set up in the same way as its parent. Once all of the children of
    a parent node are created, we add them to the parent''s children array, which
    is a new property we create to hold the references. Once the references to the
    children are stored, we can delete those variables that we won''t use again. In
    this instance, we delete all of the children but the gaea object, since it will
    have children to store in a moment. If you continue on down through the code,
    you will see that this pattern is followed to the end. It is important that you
    understand that all of the variables we are using (such as gaea, tartarus, and
    eros) are just that — variables holding references to objects in memory, and not
    the objects themselves. Once an object has been stored in its parent''s children
    array and, if necessary, given its own children property full of object references,


    we can safely delete the variable. The objects themselves are not deleted, merely
    the variables referencing them. When we have completed storing the entire family,
    we will be left with only one variable, chaos, which will hold references to all
    of our objects within its many dimensions. The only other item to note is that
    if a node has a spouse, I add another property, as I do here with the cronus node:


    ```

    cronus.spouse = {name:"Rhea", col:titansCol};

    ```


    The spouse property contains an object holding a name and color as well.


    If you wished to build your own tree, you''d simply have to alter these properties,
    since the system to display the tree works independently of the information. You
    might also consider building the tree in XML and bringing it into and parsing
    it in Flash, which was a bit too much to cover in this already hefty chapter.
    Check out Jamie Macdonald''s chapter after this one to find out about XML structuring.
    You might want to have a go at blending the techniques! Included in the download
    files you will find gods_tree_XML.fla, uses XML. The SWF allows you to toggle
    between two trees, those of the Greek gods and the Norse gods, which are loaded
    from XML files when a button is clicked. The two files in which the information
    is stored, Greek_gods.XML and Norse_gods.XML, show how easy it is to structure
    and set up your own files to load into the interface. By adding additional elements
    to the tree, you could create added functionality. For instance, an image element
    might contain the file name of a JPG to load into the interface.


    # And now, the code


    Now we get to the good stuff! The code to generate and navigate this interface
    is broken down into two parts – the nodes themselves and everything else. The
    "everything else" is actually very slight, since most of the functionality is
    contained in the nodes themselves, so let''s do a little typing and take care
    of that right away.


    ![](img/50202c17d5022233f3e3ec60560e35aa_91_0.png)'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# Everything else


    This is where we will set up some global variables for our movie, including objects
    to control text formatting for our interface, dimensions, rate of animation and
    a few factors to control the 3D look of our nodes. We will also create the movie
    clips that will house and mask our tree.


    Select the first frame in the code layer on your main timeline and open up your
    ActionScript editor, typing the following:


    ```

    windowWidth = 550;

    windowHeight = 400;

    intervalTime = 40;

    intervals = 10;

    ```


    windowWidth and windowHeight hold the dimensions of our viewing window (which
    is actually smaller than the stage). intervalTime is the amount of milliseconds
    between interval calls in the movie. Nearly all of the animation for the tree
    is accomplished using setInterval as opposed to enterFrame events, so it''s good
    to have a variable here that we can quickly alter to change the rate of our animation.
    The final variable, intervals, is used for all of our easing motion tween functions.
    This interface uses the classic (and easy) Zeno''s paradox method of tweening,
    which means we simply divide the distance a clip is going to move by a certain
    number each frame. This variable contains that number. Using 10 means that a clip
    will travel a tenth of its remaining distance each frame.


    Next, here are four more variables for you to add directly following the previous
    four lines:


    ```

    childDistance = 2;

    childDepth = 100;

    scaleFactor = .4;

    pi = Math.PI;

    ```


    childDistance is a number we will multiply a parent''s diameter by to get a distance
    at which to place its children. childDepth is the distance on the z axis (remember,
    we''re doing 3D here, so z is perpendicular to your computer screen) between a
    parent and child node. scaleFactor is a variable I added to give more control
    over the appearance of a node. By altering this number you can make a node bigger
    or smaller on screen without going into all the 3D rendering code. Finally, I''ve
    placed the value for pi, which we will have access a lot in the code, into a variable,
    so that we don''t have to keep looking into the Math object each time, as this
    would slow us down a little.


    Next comes the font formatting for our movie. Type these lines to follow the previous
    code:


    ```

    nameTF = new TextFormat();

    nameTF.font = "sansFont";

    nameTF.align = "center";

    nameTF.size = 12;


    underlineTF = new TextFormat();

    underlineTF.underline = 1;


    infoTF = new TextFormat();

    infoTF.align = "left";


    titleTF = new TextFormat();

    titleTF.font = "titleFont";

    titleTF.size = 32;

    ```


    I love TextFormat objects, I really do. One thing that is rather neat is the fact
    that you can compound them. So if I add one TextFormat object to a text field
    that already has one applied, it will simply apply the extra formatting without
    wiping away the previous formatting (unless of course all the property values
    are different). This is the concept I use here. nameTF is my main TextFormat for
    my movie. It uses the sansFont I exported from the library, centers it and makes
    it 12 pts. The next two TextFormats merely add to that, one adding an underline
    and the other left aligning the text (which I use in the info box of the node
    interface). The final TextFormat is used for the titles of the nodes in the node
    interface.


    ![](img/50202c17d5022233f3e3ec60560e35aa_92_0.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_92_1.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_92_2.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_92_3.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_92_4.png)'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'The final piece of font formatting is necessary for the components I use:


    ```

    globalStyleFormat.textFont = "sansFont";

    globalStyleFormat.embedFonts = 1;

    ```


    The globalStyleFormat affects any components I use in the movie, in this case
    the combo box. I want the text to match the text elsewhere, so I change its font
    to be the font I exported from the library.


    The variables are now all set, so it''s time to start creating the movie clips
    we will need to make our interface run. Go ahead and add these lines directly
    after the text formatting code.


    ```

    this.createEmptyMovieClip("window", 1000);

    window.beginFill(0, 0);

    window.lineTo(windowWidth, 0);

    window.lineTo(windowWidth, windowHeight);

    window.lineTo(0, windowHeight);

    window.endFill();

    ```


    window is a movie clip that we are creating to cover the entirety of the viewing
    area of our tree. We will use this clip to center our tree, as well as to run
    hitTests on our nodes to make sure they are within the viewing area defined by
    the window (and if they aren''t, we will make them invisible). Using the drawing
    API, we draw a black box (0x000000 and 0 are equivalent) with a 0% opacity to
    cover the viewing area. The 0% opacity means that the window won''t be seen by
    the user, but Flash will know its dimensions. It''s also interesting to note that
    we only have to draw three sides of our box, as the endFill method will automatically
    close an open shape by drawing a line back to the starting position of the fill.


    The next movie clip to create is the actual tree itself. Place this code after
    the previous lines:


    ```

    this.createEmptyMovieClip("tree", 0);

    tree._x = windowWidth*.5;

    tree._y = windowHeight*.5;

    tree.depth = 15000;

    ```


    After creating an empty movie clip, we place it in the center of the viewing window.
    tree.depth is the depth level inside of tree where we will start placing the nodes.
    We will count down from this number, so each subsequent node will be placed beneath
    the previously placed node. Finally, although we will add more functionality to
    the tree later, let''s get the ball rolling with our nodes by placing the first
    one:


    ```

    tree.attachMovie("nodeSymbol", "rootNode",

    >> tree.depth --, {node:chaos}));

    delete chaos;

    ```


    We attach a nodeSymbol from the library to our tree, calling the instance rootNode,
    at the tree''s current depth, which we then decrement to make way for the next
    node. You will also see that we send an additional object with our attachMovie
    call as a fourth parameter. This is a new feature of Flash MX, which allows us
    to include an object containing properties and values that we wish to pass to
    our newly attached clip. You can use it to set a preexisting property, like _x
    or _y, or to create an entirely new property, which I do here by creating the
    property name node and setting it to the value of our chaos node from the structure
    layer. Once I''ve passed the value of chaos to the new node, I can delete the
    variable on the next line.


    For the time being, that''s all of the preparation we''ll need outside of our
    nodeSymbol code itself. Right now, testing your movie would reveal nothing, as
    all we have done is place a few empty movie clips on our stage. How about we make
    those movie clips do something?


    ![](img/50202c17d5022233f3e3ec60560e35aa_93_0.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_93_1.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_93_2.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_93_3.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_93_4.png)'
