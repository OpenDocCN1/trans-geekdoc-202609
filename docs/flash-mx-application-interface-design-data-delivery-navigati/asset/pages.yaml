- pgno: 177
  md: "# # Planting the plant!\n\nLet's go back to `stickiness.fla` and open up the\
    \ movie clip on the stage where all our code is. Click on the Plant Actions layer\
    \ and view the code there. Now to explain the `drawLeaf` function. It begins:\n\
    \n```\n```\nfunction drawLeaf (name, dir, levelNum,\n\toriginX, originY, stopX,\
    \ stopY,\n\tcontrolX, controlY, thickness) {\n```\n```\n\nRemember when we created\
    \ the instances of the `Leaf` class how we created a `setInterval` property called\
    \ `[objectName].ID` that would call the `drawLeaf` function every 10 milliseconds\
    \ to pass a whole bunch of arguments into the function every time it was called?\
    \ Each leaf instance is executing this function every 10 milliseconds and passing\
    \ its own values into the function each time as well. In this way we can re-use\
    \ the one function to make all seven leaves do slightly different things depending\
    \ on the arguments that are passed into it.\n\nThe first line of ActionScript\
    \ inside the function simply says:\n\n```\n```\nclear();\n```\n```\n\nThis action\
    \ tells Flash to clear anything previously drawn with the API. If you commented\
    \ this line out you'd see that every time the function is called, Flash keeps\
    \ drawing new lines as we'd expect, but it leaves on the stage any lines it has\
    \ drawn previously. You end up with some very weird looking leaves and a Flash\
    \ movie that runs rather slowly because of the amount of vector data it's constantly\
    \ trying to render.\n\nThe second line of code inside the function executes another\
    \ function called `moveLeaf` that is outside of `drawLeaf`:\n\n```\n```\nmoveLeaf((name+\"\
    Obj\"));\n```\n```\n\nWe'll talk about what `moveLeaf` does closer to the end\
    \ of the chapter.\n\nFollowing this are two `if` statements that are very similar\
    \ except for a few mathematical calculations that are performed in each statement:\n\
    \n```\n```\nif (dir == \"left\") {\n\tendX = originX - stepArray[0];\n\tendY =\
    \ originY - stepArray[1];\n\tif ((endX <= stopX) || (endY <= stopY)) {\n\t\ttemp\
    \ = eval(name + \"Obj\").ID;\n\t\tclearInterval(temp);\n\t\tif(plantSize > 25)\
    \ {\n\t\t\tmakeFlower(\"flower\" add name,\n\t\t\t\tlevelNum, endX, endY);\n\t\
    \t}\n\t}\n}\nif (dir == \"right\") {\n\tclear();\n\tendX = originX + stepArray[0];\n\
    \tendY = originY - stepArray[1];\n\tif ((endX >= stopX) || (endY <= stopY)) {\n\
    \t\ttemp = eval(name + \"Obj\").ID;\n\t\tclearInterval(temp);\n\t\tif(plantSize\
    \ > 25) {\n\t\t\tmakeFlower(\"flower\" add name,\n\t\t\t\tlevelNum, endX, endY);\n\
    \t\t}\n\t}\n}\n```\n```"
