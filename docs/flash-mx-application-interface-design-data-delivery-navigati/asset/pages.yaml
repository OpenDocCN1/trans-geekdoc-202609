- pgno: 94
  md: "# The node code\n\nNearly all of the work in this project rests on the rounded\
    \ little shoulders of the nodes themselves. The way we will handle this is by\
    \ using movie clips for their basic functionality, but then extending them to\
    \ hold the methods we will need to run this system. Let's get right into it so\
    \ you can see how this is done.\n\nThe first thing we will take care of is the\
    \ constructor function for our nodes, and the passing of necessary information\
    \ to each node created so that it displays itself correctly on the stage.\n\n\
    Go to the first frame of the NodeClass layer and type the following into the ActionScript\
    \ editor:\n\n```\nNodeClass = function() {\n   this.init();\n}\n\nNodeClass.prototype\
    \ = new MovieClip();\n\nNodeClass.prototype.focalLength = 600;\nNodeClass.prototype.hither\
    \ = -210;\nNodeClass.prototype.yon = 210;\n```\n\nThe first line of code looks\
    \ like any function declaration you might have used in the past. This is how class\
    \ constructors work in Flash. All we are doing is creating a function to hold\
    \ the methods, and the first method we call - the only method involved directly\
    \ in the constructor - is `this.init`, which we will write in a moment. The important\
    \ line to understand is the line of code that follows, in which we set the prototype\
    \ of the `NodeClass` to equal a new `MovieClip` instance. This is Flash's form\
    \ of inheritance, which allows us to use all of the properties and methods of\
    \ a movie clip for our `NodeClass` instances. The `prototype` property is a special\
    \ property of an object that holds all of its methods and properties. By storing\
    \ the methods and properties of `NodeClass` in its `prototype`, each instance\
    \ of `NodeClass` will have access to these without having to duplicate functions\
    \ and unnecessary code.\n\nIt is purely a personal choice which one of the following\
    \ lines of code you choose to use to create a function:\n\n```\nNodeClass = function()\
    \ {};\n\nfunction NodeClass() {};\n```\n\nI opt for the former, as I like to have\
    \ the name of the function at the beginning of the line – it makes it easier for\
    \ me to spot if I have a lot of functions.\n\nI should note, though, that the\
    \ latter method is more widely used, and if your background is in another programming\
    \ language, you will probably not care to change for ActionScript. If you choose\
    \ to write your functions in the style of the latter method, the code will run\
    \ exactly the same. Whichever method you choose, however, you should probably\
    \ remain consistent throughout your code.\n\nThe next three lines of code establish\
    \ three properties for our `NodeClass`. `focalLength` will be used in our perspective\
    \ formula when we render our nodes, and controls the amount of depth distortion,\
    \ similar to altering lenses on a camera. `hither` and `yon` are used as z positions\
    \ at which we make our nodes invisible. It makes sense when we draw our tree to\
    \ only show a certain range of nodes, so using these values we determine which\
    \ nodes are too big or too small. Notice again how we have attached these properties\
    \ to the `prototype` of `NodeClass` so that any instance will have access to these\
    \ values.\n\n![](img/50202c17d5022233f3e3ec60560e35aa_94_0.png)\n\n![](img/50202c17d5022233f3e3ec60560e35aa_94_1.png)\n\
    \n![](img/50202c17d5022233f3e3ec60560e35aa_94_2.png)\n\n![](img/50202c17d5022233f3e3ec60560e35aa_94_3.png)\n\
    \n![](img/50202c17d5022233f3e3ec60560e35aa_94_4.png)"
  merge: -1
  img_proc: true
- pgno: 95
  md: "The next method to write is the one we called in our constructor. This will\
    \ set up all of the graphics and values that our node will need to run initially:\n\
    \n```\nNodeClass.prototype.init = function() {\n  if (this._parent.nodes == undefined)\
    \ {\n    this._parent.nodes = []\n  }\n  this._parent.nodes.push(this);\n\n  this.attachMovie(\"\
    nodeGraphic\",\n    \"nodeGraphic\", 10);\n  this.diameter = this._width;\n  this.radius\
    \ = this.diameter/2;\n  var col = new Color(this.nodeGraphic);\n  col.setTransform(this.node.col.params);\n\
    ```\n\nThis is the start of our init method, which will be one of the longest\
    \ of our NodeClass, as we need to establish a number of things before our node\
    \ is functional. The first thing we want to do is store a reference to this node\
    \ (whichever node was just created) in an array located on the parent timeline,\
    \ in this case tree's timeline, since we are attaching all of the nodes to tree.\
    \ Before we do that, though, we need to make sure that the array exists, which\
    \ we take care of in the first line. If the array is undefined, we create a new\
    \ array instance. We then push a reference to this node into that array.\n\nThe\
    \ following line of code attaches the nodeGraphic on to the clip. I did it this\
    \ way for two reasons. First, we can easily swap out to another graphic if we\
    \ so desire, and second, we need to place the graphic at a higher depth than other\
    \ clips we will add to this node (like the connector). Once the graphic is attached,\
    \ we can find our diameter and radius based on that graphic. We will need these\
    \ for later operations.\n\nFinally, we color the graphic based on whatever color\
    \ parameters are stored in this node's node.col.params property. Remember that\
    \ when we create a node, as we did with our rootNode above, we will send with\
    \ it an additional property called node, which will store all of the information\
    \ that we established in our structure layer. It\n\nfollows then, that an instance\
    \ of NodeClass will have access to name, col, info, and sometimes children and\
    \ spouse in its node property.\n\nNow that we've placed and colored our node,\
    \ let's add the text field to display its name:\n\n```\nthis.nodeGraphic.createTextField\n\
    \  (\"name_txt\", 0, 0, 0, 0, 0);\n  var label = this.nodeGraphic.name_txt;\n\
    \  label.setNewTextFormat(nameTF);\n  label.border = 1;\n  label.background =\
    \ 1;\n  label.autoSize = \"center\";\n  label.selectable = 0;\n  label.embedFonts\
    \ = 1;\n  label.text = \"\" + this.node.name + \"\";\n  label._y -= label.textHeight/2;\n\
    ```\n\nThis text field will hold the name of our node, and we place it in the\
    \ center of our nodeGraphic movie clip, at 0,0, which are the third and fourth\
    \ parameters of the createTextField method. Notice that we also give it a width\
    \ and height of 0 and 0 (the fifth and sixth parameters). We can do this because\
    \ in a few lines we set the text field's autoSize property to center, which means\
    \ that the text field will automatically expand from the center to fit whatever\
    \ text we place inside. In the other lines that follow the text field's creation,\
    \ we turn on its border and background; we make sure it isn't selectable so the\
    \ I bar doesn't appear over it, and we embed the fonts so that we get the font\
    \ we included with our TextFormat (which we applied on the second line directly\
    \ following the createTextField). Finally, we place the node's name into the text\
    \ property of the text field (buffering it with spaces on each side) and adjust\
    \ its _y position based on the size of the text so that the text field will appear\
    \ centered in the node.\n\nThat was a lot of work for a text field! So let's just\
    \ add a line or two more so that we can see what we have created so far. Finish\
    \ up the init method with the following code:"
  merge: -1
  img_proc: true
- pgno: 96
  md: "```\nthis.render();\n}\n```\n\nrender is the next method we will create, which\
    \ will correctly place and scale our node based on its 3D coordinates. Let's write\
    \ the function now so we can test our movie.\n\nPlace this method directly after\
    \ the init method:\n\n```\nNodeClass.prototype.render = function() {\n\tvar depthFactor\
    \ = this.focalLength/\n\t\t(this.focalLength - this.z);\n\tthis.x = this.x * depthFactor;\n\
    \tthis.y = this.y * depthFactor;\n\tthis.xscale = this.yscale = this.z *\n\t\t\
    depthFactor * scaleFactor + 100;\n}\n```\n\nThis, you might be happy to know,\
    \ is the extent of the 3D calculations involved in this project. We don't have\
    \ time to go into much theory about what's occurring here, and if you've worked\
    \ with any 3D in Flash you will have already encountered similar methods. Suffice\
    \ it to say that this is a method which transforms our 3D coordinates (x, y, z)\
    \ into 2D coordinates on our screen. We simulate depth on the 2D screen by scaling\
    \ the movie clip and adjusting the _x and _y 2D properties based on the z 3D property\
    \ and the focalLength. Using this depthFactor, as I called it, we set the _x,\
    \ _y, _xscale and _yscale properties of our clip to make clips that are nearer\
    \ on the z axis appear larger and farther away from the 3D vanishing point at\
    \ (0, 0, 0). The scaling itself is determined by the z value multiplied by the\
    \ depthFactor. 100 is added to get the scale up into a workable range (since we\
    \ deal with negative z depths). scaleFactor is something I added to give a little\
    \ bit more freedom in how we display the nodes (we set this variable right near\
    \ the top of our code, on the code layer).\n\nThis is the final line we will need\
    \ for our NodeClass to work initially:\n\n```\nObject.registerClass(\"nodeSymbol\"\
    ,\n\tNodeClass);\n```\n\nregisterClass associates a movie clip symbol in our library\
    \ with a Class definition in our code. If you access the linkage properties of\
    \ the nodeSymbol in the library, you will see that I have already set it up to\
    \ export as nodeSymbol. With the registerClass line above, any nodeSymbol we attach\
    \ to the stage will automatically be an instance of our NodeClass.\n\nOK! Test\
    \ your movie. You should see our first node appear, all ready to go! Although\
    \ it might seem like that's a lot of preparation for a single node, the groundwork\
    \ for the entire tree has been set. It will now be small steps to making our tree\
    \ do some really cool things!\n\n![](img/50202c17d5022233f3e3ec60560e35aa_96_0.png)"
  merge: -1
  img_proc: true
- pgno: 97
  md: "# # Displaying children\n\nThe next section we will deal with is the display\
    \ of a node's children whenever it is clicked. We will create a few new methods\
    \ to take care of this feature. The first thing to consider is what we want to\
    \ have happen when a node is clicked on. In addition to simply showing a node's\
    \ children, we need to have the node that was selected move to the center of the\
    \ stage. Let's write that method first.\n\nPlace this method directly after the\
    \ render method (make sure it's above the Object.registerClass line, which should\
    \ always remain the final line in our NodeClass code):\n\n```\n```javascript\n\
    NodeClass.prototype.center = function() {\n    clearInterval(translateInt);\n\
    \    this.showChildren();\n    this._parent.tNodes = [];\n    var x = -this.tX;\n\
    \    var y = -this.tY;\n    var z = -this.tZ;\n    var i = 0;\n    while (i <\
    \ this._parent.nodes.length) {\n        this._parent.nodes[i].setTranslate(x,\
    \ y, z);\n        i++;\n    }\n    translateInt = setInterval(this._parent,\n\
    \        \"translate\", intervalTime);\n}\n```\n```\n\nThis method introduces\
    \ a number of new items that we will address in a moment. Skipping the first line\
    \ of code in the method for a moment, notice we are calling a new method showChildren,\
    \ which will take care of adding the necessary nodes for children. We then create\
    \ a new array on the _parent (tree) timeline called tNodes, which will hold references\
    \ to all the nodes we need to translate. The next three lines create three variables\
    \ to hold the distance this node will need to travel to reach (0, 0, 0). tX, tY,\
    \ and tZ will eventually hold translated coordinates, the ending position of a\
    \ node after movement. If a node is at (100, 100, -100), then it will need to\
    \ travel negative 100 on the x axis, negative 100 on the y axis and positive 100\
    \ on the\n\nz-axis to reach (0, 0, 0). That is what we store in the x, y and z\
    \ variables. Now, if every node retains its same relation to every other node,\
    \ it follows that each node will have to travel the same distance on each axis.\n\
    \nSo with these values decided, we call another new method for each node called\
    \ setTranslate. Using a while loop (which is slightly faster than the for loop),\
    \ we run through the _parent's node array, which stores references to all the\
    \ nodes (we took care of this in the init method) and have each node set up its\
    \ own translation. On the line that follows, we use setInterval to call the translate\
    \ method on the tree timeline (which we've yet to write). translate is what will\
    \ move the nodes at each interval.\n\nNow let's quickly look at the methods we\
    \ just called in center so you can see how they all work together.\n\nThe first\
    \ method to add is the NodeClass's setTranslate. Add these lines after the center\
    \ method:\n\n```\n```javascript\nNodeClass.prototype.setTranslate =\n  function(x,\
    \ y, z) {\n      this.tX += x;\n      this.tY += y;\n      this.tZ += z;\n   \
    \   if (this.tZ > this.yon || this.tZ <\n      this.hither) {\n          this.x\
    \ = this.tX;\n          this.y = this.tY;\n          this.z = this.tZ;\n     \
    \     this.render();\n      } else {\n          this._parent.tNodes.push(this)\n\
    \      }\n  }\n```\n```"
  merge: -1
  img_proc: true
- pgno: 98
  md: "setTranslate, as we saw above in the center method, is called for each node\
    \ when the tree needs to be translated. We send to this method the x, y and z\
    \ distance the node needs to travel, which we add on to the node's current translated\
    \ position. The next statements make sure that we need to animate a move at all.\
    \ Basically, we test to see if the ending z position for this node is going to\
    \ be outside our specified rendering range (as determined by hither and yon).\
    \ If it's not in the range, we set our x, y and z coordinates to equal our translated\
    \ coordinates and render the node in its final position (later, we'll add a visibility\
    \ check that will turn this node off since it's outside the range). If the node's\
    \ z position is inside the rendering range, we simply push a reference to the\
    \ node into the _parent timeline's tNodes array, which will hold all of the nodes\
    \ that need to be translated. Let's take care of that method now.\n\nYou need\
    \ to head back to the code layer for these lines, as they are not a part of the\
    \ NodeClass code. Place this method after the line tree.depth = 15000;:\n\n```\n\
    tree.translate = function() {\n    var i = 0;\n    while (i < this.tNodes.length)\
    \ {\n        this.tNodes[i].translate();\n        this.tNodes[i].render();\n \
    \       i++;\n    }\n    if (this.tNodes.length < 1) {\n        clearInterval(translateInt);\n\
    \    }\n}\n```\n\nThis one's pretty self-explanatory. Each time this function\
    \ is called (which is determined by our setInterval), tree runs through its list\
    \ of nodes and tells each one to translate and render itself. The nodes, once\
    \ they have reached their destination, will individually remove themselves from\
    \ the tNodes array. Once the array is empty, we clear the interval since the function\
    \ no longer needs to be called.\n\nAlright! One more method to cover to get our\
    \ translation happening. Go back to the NodeClass layer and place this new method\
    \ after the setTranslate method:\n\n```\nNodeClass.prototype.translate = function()\
    \ {\n    this.x -= (this.x - this.tX)/intervals;\n    this.y -= (this.y - this.tY)/intervals;\n\
    \    this.z -= (this.z - this.tZ)/intervals;\n    if (Math.abs(this.x - this.tX)\
    \ < 1 &&\n        Math.abs(this.y - this.tY) < 1 &&\n        Math.abs(this.z -\
    \ this.tZ) < 1) {\n        var i = 0;\n        while (i < this._parent.tNodes.length)\
    \ {\n            if (this._parent.tNodes[i] == this) {\n                this._parent.tNodes.splice(i,\
    \ 1);\n                break;\n            }\n            i++;\n        }\n  \
    \  }\n    this.x = this.tX;\n    this.y = this.tY;\n    this.z = this.tZ;\n}\n\
    ```\n\nAnd here's our easing animation code. Each time translate is called, the\
    \ node is moved a fraction of the distance it needs to travel on each axis. The\
    \ if conditional is there to determine when the current coordinates are close\
    \ enough to the ending coordinates. When that point is reached, we use a while\
    \ loop to find the node's position in its _parent.tNodes array. It removes itself\
    \ once found and sets its current coordinates to equal its ending translated coordinates.\
    \ If you look back up to tree's translate method, you will see that the next thing\
    \ that would occur is the rendering of the node. After that, since the node has\
    \ now been removed from tNodes, it would be done translating.\n\nThat should take\
    \ care of the translation, but what about attaching the children? Well, that's\
    \ what the final method in this section does."
  merge: -1
