- pgno: 82
  md: '# # A FLASH FAMILY TREE


    It''s almost certain you''ve faced the problem at some point.

    You want to draw up your family tree, but you can''t quite

    get it right. Then you regret starting the whole thing in

    permanent pen.


    Even with the advent of computer genealogy, things look

    a bit blocky. Sure it''s useful, but where''s the love in all that

    square data storage? What we need is beauty! A tree you

    can grow! Data you can bring in on a whim. It needs to be

    intuitive, and this is where Flash presents itself as the ideal

    medium.


    In this chapter we will look at how we can use Flash and a

    branching structure to help communicate and illustrate a

    large amount of related information without

    overwhelming the user. Flash, with an authoring

    environment that facilitates the combination of code and

    animated graphics, is a fantastic tool for the dynamic

    display of information. Let''s take a look at one exciting

    way to take advantage of that.


    ![](img/50202c17d5022233f3e3ec60560e35aa_82_0.png)'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Hierarchy of the gods


    I think the best way to begin this tutorial is to actually start at the end and
    show you the final project that we will be building in this chapter. Open up the
    file gods_tree.swf from the download files to see the end result, a branching
    hierarchical structure to display the gods and titans of Greek mythology. Have
    fun exploring the structure, by rotating and expanding the nodes to see how we
    could use such a system to display a large amount of information. Notice the gloopy
    connectors that stretch between the nodes, and how a smooth gradient can be drawn
    to ease color from a parent node to its child. Try opening a node to access more
    information and then using the combo boxes to navigate to a different node. Once
    you close the interface, the tree structure has been updated to your new position.
    Think about how you might go about structuring, drawing, expanding, and navigating
    such a system – then read on to see how I approached it.


    ![](img/50202c17d5022233f3e3ec60560e35aa_83_0.png)'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# # The process


    As often happens with projects and experiments, what started out as one idea quickly
    grew into another, shifting through a myriad of stages to finally arrive at the
    product that you have just been looking at. The original idea happened to be the
    construction of an interface that would allow the user to quickly and easily navigate
    through a family tree structure, like the one shown here of some early generations
    of the British Royal Family.


    The more I worked at it, however, the more I became aware of the anomalies that
    can occur in such a structure, such as multiple marriages (oh, that Henry VIII),
    interfilial marriages and the existence or nonexistance of ancestor information
    for spouses. There were quite a lot of if...then statements flying about and I
    realized that such a chapter would have to be a study in conditions and little
    more. Instead, I wanted to write a chapter about the display of such data and
    different ways of presenting it.


    In my job, I spend a lot of time inventing interesting methods to display data
    graphically. We are a visual society, and there is truth to the adage that a picture
    is worth a thousand words. Even more so, a picture is worth a thousand numbers
    – figures are much more easily understood when they are translated into a pictorial
    form. And so I create charts, graphs, timelines, and maps in order to communicate
    information more clearly. This is something that I wanted to accomplish with a
    branching family tree structure.


    ![](img/50202c17d5022233f3e3ec60560e35aa_84_0.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_84_1.png)'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'I''ll admit that I got a little lucky in that I hit upon my metaphor fairly
    early in the process. As I explained in the last chapter on real-feel interfaces,
    my creative process is all about metaphors. If I find one that at least pushes
    me in the right direction, even if it exists solely in my mind and not the finished
    project, I''m happy. With the family tree, one of the first things that came to
    mind was a molecular structure – the ultimate nuclear family! Anyone who has played
    with 3D in Flash should be familiar with the radial gradient spheres circling
    about. It was a subject I was well versed in from Flash 5, and one of my first
    Flash MX experiments with 3D was to build a molecule engine using the drawing
    API to draw the bonds and give the atoms cell-shading.


    I wasn''t certain at first, though, whether there needed to be any 3D involved
    with my family tree at all. Initially, I chose to “fake” the 3D by simply choosing
    smaller scales for each generation, similar to what you might find with fractal
    experiments in Flash.


    ![](img/50202c17d5022233f3e3ec60560e35aa_85_0.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_85_1.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_85_2.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_85_3.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_85_4.png)'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'The idea I planned to work with was to house all of the nodes in one movie
    clip, and each time I attached additional nodes for a new generation at a smaller
    scale, I''d zoom-in by scaling up the parent movie clip. One thing I hadn''t foreseen,
    however, was that if I kept scaling up, I''d eventually reach a scale that was
    too small for Flash to place new movie clips accurately. It became apparent that
    if I wanted to have each generation smaller than the previous (which I did) I''d
    have to resort to using 3D to get my desired effect.


    Along the way, I also decided that I wanted something a little different for the
    connectors or bonds between each node in the tree. As I worked more with the animation
    of each child from its parent, the nodes began to look more like cells that were
    splitting through something akin to mitosis. I thought it might be fun to create
    something a bit more organic in nature than the straight line bonds of my molecule
    engine. I''ve always been enthralled by the work of H.R. Giger and his work on
    transforming the usually cold, straight lines of sci-fi into his biomechanical
    vision. I too wanted to make something more fluid and organic, especially as this
    seemed to suit the nature of the data. And with the drawing API, why settle for
    straight lines when we can just as easily make curves?


    As a final piece of functionality for this system, I wanted to allow the user
    the ability to access more information from each node. One of the terrific advantages
    of displaying data on a computer, as opposed to paper, is that you can jump to
    additional pages of information instantaneously without losing your place within
    the structure. On paper, if I included extra information on each family member
    in a tree, in addition to the display of his or her relation to other family members,
    then anyone reading the chart would quickly become overwhelmed with the amount
    of information provided. In contrast, I wanted Flash to offer the user the ability
    to expand each node to display more information if they required it. In this way,
    I could cram as much data as users might need into one chart – without overloading
    them with information.


    Unfortunately, we don''t have the pages to cover the expanded interface in this
    chapter''s tutorial, but the fully commented finished version of the family tree
    is included in the download files. Once you have completed this chapter, if you
    are interested in taking the system further, I''d encourage you to open the file
    gods_tree.fla and have a look at what additional code is needed to complete the
    effect.


    ![](img/50202c17d5022233f3e3ec60560e35aa_86_0.png)'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# # The family tree that wasn''t


    If you have played around at all with the finished SWF, you might notice that
    there are certain things that take this system out of the category of true family
    tree. First and foremost, although I have included spouse nodes, you are unable
    to access them directly. In addition, the existence of a spouse node isn''t necessary
    to produce children (although, as I think on it, the situation would occur in
    real life with adoption by a single parent). Finally, I have not accounted for
    multiple spouses (and Zeus got around...).

    These weren''t oversights, but merely different directions I chose to take. I
    felt that the creation of a single node branching structure might be more useful
    for more projects. As it happened, I still (successfully, I believe) displayed
    a family tree, but you could quickly adapt this system for a menu, game, gallery,
    index, and so on. It''s all about modularity.


    # # The base FLA


    As you might imagine, there is a decent amount of code involved in creating this
    effect ("decent" is a less intimidating way of saying "a lot"), so I have prepared
    a base file that has all the elements we need to begin, including some of the
    code already prepared for you (just like on the best cooking shows!). Open up
    the file gods_tree_base.fla from the download files, and let''s go over these
    elements so you can see what we''re working with.


    # # The timeline


    ![](img/50202c17d5022233f3e3ec60560e35aa_87_0.png)


    The main timeline of the movie is fairly straightforward, consisting of five layers.
    The top three layers will hold our code, while the bottom two hold our graphics,
    which are already drawn and placed. The key layer contains the key information
    for our chart (which obviously applies specifically to this chart, so it would
    be the first thing to change if you were charting another family) as well as a
    dynamic text field at the lower left named rollOver_txt. This text field has titleFont*
    selected as its font, while the three to its right have sansFont* selected. The
    asterisk indicates that these are exported fonts, and when we look at the library
    in a moment you will see how I did this. Finally in our layer structure, the bottom
    layer, named back, contains the background image (goo.jpg) inside an unnamed movie
    clip instance.


    ![](img/50202c17d5022233f3e3ec60560e35aa_87_1.png)'
  merge: -1
  img_proc: true
