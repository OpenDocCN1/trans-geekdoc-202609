- pgno: 211
  md: 'After the declaration here, the JPG global is told to load in an image with
    the argument imageFileName. When loading JPGs into Flash, the loadMovie command
    is used.


    Then comes some code that will run every frame:


    ```

    _root.onEnterFrame = function() {

    if (JPG.getBytesLoaded() > 0) {

    _root.loadBoxPerc.text =

    (Math.floor((JPG.getBytesLoaded() /

    JPG.getBytesTotal()) * 100)) + "%";

    }

    if (JPG.getBytesLoaded() ==

    JPG.getBytesTotal() &&

    JPG.getBytesTotal() != 0) {

    ```


    It sets the percentage loaded text which appears in the dialog box, and checks
    if the image has fully loaded. The same conditional is performed here, to counteract
    Flash''s slow pick up of files.


    When the image is fully loaded, we then need some code to place it on the screen:


    ```

    JPG._width = 200;

    JPG._height = 200;

    JPG._x = -JPG.width/2;

    JPG._y = -JPG._height/2;

    JPG._visible = true;

    JPGContainer._x = _root.square._x;

    JPGContainer._y = _root.square._y;

    JPGContainer._xscale = 100;

    JPGContainer._yscale = 100;


    _root.onEnterFrame = undefined;

    duplicateMovieClip(_root.tshirt,

    "newtee", 600);

    JPGContainer.setMask(_root.newtee);

    });

    });

    });

    ```


    The JPG movie clip is resized to the forced 200 x 200 pixels, and the image is
    repositioned so that it is centered on the registration point (when images are
    loaded they are positioned by default at an absolute position of 0,0). It is repositioned
    so that the JPG scale tool can scale it from the center outwards.


    ![](img/50202c17d5022233f3e3ec60560e35aa_211_0.png)


    The next two lines of code position JPGContainer at the same position as square.
    square has a center registration point, so this action centers the JPG image in
    the middle of the t-shirt.


    JPGContainer is then reset to a scale of 100%, to reset any previous manipulation.


    The last couple of lines of code here set up a mask for the JPGContainer, so that
    the image doesn''t cover the interface when it is moved around.


    ![](img/50202c17d5022233f3e3ec60560e35aa_211_1.png)


    That''s it for the JPG loading stuff.


    The JPG element is extended later on in the chapter with the JPG scale tool and
    the dynamic masking...'
