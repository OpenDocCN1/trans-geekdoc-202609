    +   - publication date: september 2002


    This title provides the Flash MX designer with a rich reference for all things
    ActionScript-related. It features a designer-oriented A-Z reference of the ActionScript
    language, all appropriately demonstrated in FLAs on the accompanying CD. These
    examples illustrate ActionScript in context - that is, in the combinations that
    you''re likely to encounter them in the real world. The book also has substantial
