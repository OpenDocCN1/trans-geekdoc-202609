- pgno: 180
  md: "Moving down through the code after the drawLeaf function, we come across a\
    \ small but very important function called moveLeaf. The code looks like:\n\n\
    ```\nfunction moveLeaf(leafObject) {\n    this[leafObject].stepX +=\n    this[leafObject].numStepsX;\n\
    \    this[leafObject].stepY +=\n    this[leafObject].numStepsY;\n    stepArray\
    \ = Array(this[leafObject].stepX,\n    this[leafObject].stepY);\n    return stepArray;\n\
    }\n```\n\nThis function is actually called from inside drawLeaf. The name of the\
    \ leaf object instance (for example leaf10bj) that is executing drawLeaf and therefore\
    \ executing moveLeaf is passed into moveLeaf as an argument. Once this happens\
    \ we modify some of the properties of the leaf instance, these being stepX and\
    \ stepY (for example leaf10bj.stepX and leaf10bj.stepY). We increment each of\
    \ these values by the value of another property of the leaf instance, namely numSteps.\
    \ Back when we created each leaf object instance, on line 44 of the Plant Actions\
    \ layer, using the Leaf class, we added some properties to each instance called\
    \ numStepsX and numStepsY. The value of these variables was in effect a ratio\
    \ between the x position of the leaf when it was at its smallest, and the x position\
    \ of the end point of the leaf when it finished animating, and the same for the\
    \ y positions of where the end point for the leaf started and finished. What the\
    \ value of numStepsX and numStepsY allows us to do then is to move the x and y\
    \ of the end point of a leaf each time the function drawLeaf is executed in proportion\
    \ to each other, so that by the time the x position of the end point for a leaf\
    \ reaches its final resting place when the animation finishes, the y position\
    \ for the end point of the leaf is in the right place as well.\n\nNow because\
    \ we want to pass the new stepX and stepY properties of the leaf object back into\
    \ drawLeaf, we combine the two variables into a new array called stepArray, and\
    \ pass the values back into the function by writing:\n\n```\nreturn stepArray;\n\
    ```\n\nWhy do we need to put the two variables into an array before passing them\
    \ back into the drawLeaf function? Because you can only pass or 'return' one variable\
    \ or object with the return action. So we can't write:\n\n```\nreturn this[leafObject].stepX;\n\
    return this[leafObject].stepY;\n```\n\nas it would only return this[leafObject].stepX\
    \ to the function that called it. We sidestep this limitation by putting everything\
    \ we want to return to drawLeaf into an array, which is after all only one object.\n\
    \nThe second last function we come to in our code is a function called makePot,\
    \ and it looks like:\n\n```\nfunction makePot() {\n    createEmptyMovieClip(\"\
    pot\", 10);\n    with (pot) {\n        beginFill(potFill, 100);\n        lineStyle(1,\
    \ potOutline, 100);\n        moveTo(220, 360);\n        lineTo(280, 360);\n  \
    \      curveTo(290, 390, 270, 400);\n        lineTo(230, 400);\n        curveTo(210,\
    \ 390, 220, 360);\n        endFill();\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 181
  md: 'When we first execute the function makeThePlant, the next line of code in that
    function executes the function makePot. And the function does exactly that – it
    makes the pot that our plant sits in. We start by creating an empty movie clip,
    give it an instance name of pot and put it on level 10, so that it sits well in
    front of the seven leaves we made, which sit on levels 1-7. We then begin to fill
    the pot based on the color potFill we created with the convertColors function
    on the Date Actions layer. After this we draw a combination of curved and straight
    lines to form our pot, and end the fill at the end of the function.


    Then we use the drawing API to draw the flower (note that the colors are hard-coded
    in this function – you can just as easily go back to the Date Actions layer and
    create some variables to color the flowers just as we did for the leaves and the
    pot). We then scale the flower down to 1 percent, so that we can make it grow
    when the movie clip loads, and randomly rotate, the flower movie clip just to
    give the finished plant a bit of randomness.


    The very last function in our code is used to draw the flowers that go on the
    end of each leaf once the variable plantSize reaches a value greater than 25.


    After this we create an onLoad method for the flower movie clip that we just made:


    Even though this function is quite long, if you break it down into its subcomponents,
    there''s not much in it that we haven''t already talked about. We start by creating
    an empty movie clip to draw the flower in, and set the x and y position of the
    flower to be the same as the end point for the leaf that called this function:


    ```

    function makeFlower

    (name, levelNum, xPos, yPos) {

    this.createEmptyMovieClip(name,

    20+levelNum);

    this[name].xscale = this[name].yscale = 1;

    this[name]._x = xPos;

    this[name] ._Y = yPos;

    this[name].rotation =

    Math.round(Math.random()*360);

    with(this[name]) {

    beginFill(0xFFFFFF00, 100);

    lineStyle(1, 0xFFCC00, 100);

    moveTo(-2, -9);

    curveTo(-20, -17, -10, 1);

    curveTo(-19, 24, 0, 9);

    curveto(22, 18, 8, -2);

    curveTo(18, -26, -2, -9);

    endfill;

    }

    ```


    ```

    this[name].onLoad = function() {

    this.startX = this._x;

    this.num = 0;

    this.clicked = false;

    }

    ```


    This is effectively telling the movie clip that when it loads, it makes a variable
    named startX to remember where the movie clip''s x position is when the flower
    first loads, and another variable named clicked that is set to false to denote
    that the flower hasn''t been clicked on yet (we''re going to make the flower do
    something when you click on it).


    In Flash MX you can assign an onRelease action or an onRollver action to a movie
    clip, just as you would with a button, so this is what we do next:


    ```

    this[name].onRelease = function() {

    this.clicked = true;

    }

    ```


    In a nutshell, this tells the movie clip to do something when the movie clip is
    clicked on with the mouse – in this case change the variable named clicked from
    false (which we set when the movie clip first loaded using the onLoad method)
    to true.


    ![](img/50202c17d5022233f3e3ec60560e35aa_181_0.png)'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'The next piece of code creates an onEnterFrame method for the flower movie
    clip:


    ```

    ```

    this[name].onEnterFrame = function() {

    if(this._xscale < 50) {

    this._xscale = this._yscale++;

    }

    ```

    ```


    Inside this onEnterFrame method we then write an if statement that says to the
    flower: if the _xscale of the movie clip is less than 50%, make both the _xscale
    and the _yscale 1% larger, so that the flower will appear to grow in size over
    a few seconds in time.


    The original code used to draw the flower with the API makes the flower quite
    large, as it was simply too difficult working out the curves for the flower petals
    on a really small scale, so we make the flower start out at a scale of 1% of what
    it really is, then make it grow from within the onEnterFrame method up to 50%.


    A quick note on the onEnterFrame method as it''s being used in this example –
    those of you who are upgrading your skills from Flash 5 will recall that onEnterFrame
    clip events had to be written on the movie clip itself. This method is discouraged
    in MX, as you can now more conveniently put all of your code within the one frame
    on your timeline, and not on the individual symbol. This allows us to put all
    the ActionScript for an entire movie on one location on the timeline, and it saves
    us from having to click all over the stage on different buttons and movie clips
    in search of code that we want to change.


    Back to the onEnterFrame method of our flower movie clip, we then have another
    if statement that looks like:


    ```

    ```

    if (this.clicked == true) {

    this._x = xPos + (this.startX + (30 *

    Math.sin(this.num)) );

    this.num += 0.1;

    this._y += 2;

    this._rotation += 2;

    }

    ```

    ```


    What this little piece of code does is waits until the flower is clicked on, then
    moves the x position of the flower to the left or right of its original starting
    position. The code


    in the second line of this if statement keeps generating a series of numbers that
    varies between a negative and a positive number, which we add to the original
    x position of the flower, thereby making it sway from left to right.


    As we do all this, we increase the y position by 2 pixels each time, so that the
    flower appears to fall down to the bottom of the stage. We also increase the _rotation
    property of the flower by 2 degrees, just to create a slightly more organic motion
    as the flower falls.


    The next if statement in our makeFlower function is written like so:


    ```

    ```

    if (this._y > (movieHeight-6)) {

    this.clicked = false;

    this.enabled = false;

    }

    }

    ```

    ```


    All this does is tell the flower that if its y position is greater than the height
    of the plant movie clip, it should stop falling and stay still. It does this by
    changing the value of clicked back to false again. Remember that all the code
    responsible for making the flower fall is inside the previous if statement that
    only executes if the value of clicked is set to true. If you made your movie so
    that the plant looked like it was sitting on a ledge or table, and the ground
    was a lot further down than the height of the movie clip, just simply add the
    extra distance from the ledge to the ground to the variable movieHeight. By setting
    this.enabled to false in the last line of the above if statement, we effectively
    stop the flower from having the ability to be clicked on any more so that it can''t
    try and move again. Once a flower has come to rest you''ll see that it can''t
    be clicked on any more.


    After the makeFlower function, there''s an action that looks like:


    ```

    ```

    stop();

    ```

    ```


    Now let me tell you all about the stop action... only joking! That''s it, we''re
    done. Our plant grows smoothly, elegantly, and changes size and color according
    to how often we visit the site, and we''ve built it in such a way that we can
    easily change the colors of all the parts of the movie and add or remove leaves
    as we see fit. Nice work all round I say!


    ![](img/50202c17d5022233f3e3ec60560e35aa_182_0.png)'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# # A note about testing and debugging this movie


    You may or may not have noticed that inside the plant movie clip where all our
    code is, there is a layer called debug between the Plant Actions layer and the
    Date Actions layer, and that the layer has been turned into a Guide Layer. To
    better understand what I''m about to talk about, un-check the guide layer option
    by right-clicking/CTRL-clicking the layer and un-checking the Guide option.


    If you run your movie again, you''ll see several text fields on the stage that
    display some pertinent information. Of course I''m well aware that the trace action
    can be used to display the output of variables, and also that MX has some very
    complex debugging devices built in to the Player in the authoring environment
    – but none of these options work when viewing a SWF in a browser window or an
    .exe file. I like to output variables I want to watch into dynamic text fields
    on screen so I can trace the variables in a browser window. And once I''ve finished
    debugging my movie, all I have to do is turn the layer with the text fields into
    a Guide layer and the movie displays as per normal. This way I don''t have to
    keep adding and removing text fields every time I want to debug the movie.


    One more thing. If you wish to avoid opening, closing, and re-opening the plant
    movie in order to see it grow, there''s a line of code in the Date Actions layer
    on line 55 (//plantSize=26;) which you can uncomment and change the value of plantSize
    to between 0 and 50 if you want to see how the plant looks when it starts out
    and when it is at full growth. This won''t affect any of the values inside your
    stored sharedObject as the line is written after the sharedObject data is stored
    on your computer.


    There''s also some code on line 20 (//daysSinceLastVisit = 2;) that you can uncomment
    and change to force your plant to shrink in size (this will affect the data written
    to the sharedObject file on your computer). Doing this simulates not visiting
    the site for the amount of days you specify as the value of


    the variable daysSinceLastVisit. Just make sure line 55 is commented out if you
    do this, otherwise there might be some conflict in what you are hoping to see.


    # ## Other things to do with this concept


    This book is all about providing some inspiration when you design your interfaces.
    So please take some time after you''ve read this chapter to let all the code and
    concepts sink in, and try to come up with some of your own ideas about how to
    represent user-stickiness in your movies.


    One idea I had while building this FLA for the book was to use the plant not to
    represent individual user stickiness, but use it as a kind of graph that represented
    overall viewer statistics. Flash MX has some awesome new built-in features that
    allow you to easily detect all sorts of information about a user viewing your
    site. Using the built-in System Object, you can detect such things as: the language
    installed on the users'' computer (to give you a rough idea of what country users
    are coming from), the operating system they''re using, their screen resolution
    (very handy, that one), and many other user settings.


    You could also use a PHP script to fairly easily tell which browser and version
    that a user is running, as well as the URL they came from before visiting your
    site and a whole host of other information relevant to collecting global user
    statistics about your site. Your Flash movie could call the PHP script to retrieve
    this information in combination with settings gathered from the Flash System Object,
    and then send that information to a database for permanent storage on the server-side.
    Your plant could then retrieve this global information and act as a graph to display
    the statistics.


    If you ever decide to build something like this based on what you''ve learned
    in this chapter, please let me know as I''d love to see what you''ve done with
    the concept.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# A T-SHIRT DESIGNER


    All people can be creative, but I think a lot of people are scared to be. When
    faced with a blank canvas, a brush, and a selection of paints, a lot of people
    just freeze up. There''s something intimidating about the purity of a white page,
    and the permanence of putting paint on it.


    ![](img/50202c17d5022233f3e3ec60560e35aa_184_0.png)


    I wanted to create an application that would encourage people to play around with
    design in an informal environment. Rather than start from a white square then,
    I decided to begin with the familiar shape of a t-shirt, on which users could
    experiment with drawing a design of their choice. I chose a t-shirt because it''s
    somewhere where you often see photos, patterns, and logos, and it just happened
    to make nice pictures too.


    ![](img/50202c17d5022233f3e3ec60560e35aa_184_1.png)


    The end result is an application that I''m extremely proud of, providing the ability
    for all to create, and an interface that doesn''t take a manual to learn (of course,
    I could have included a manual...). The simplicity of the interface was one of
    the key considerations here, as I wanted it to appeal to a wide web audience of
    varying ability.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# Interface inspirations


    Here are some of my favorite programs and interfaces that have been an inspiration
    to the t-shirt application.


    # I ♥ BBC


    Yes, it''s true. Not the whole of the British Broadcasting Corporation (although
    I do love them dearly too), but the microcomputer model ''B'' released in 1982
    as part of their Computer Literacy Project. It was one of the many early computers
    that I cut my teeth on, and brings back many fond memories. Although I of course
    spent the majority of my time hard at work in Wordwise +, or typing in those beautiful
    BASIC programs, I also played a game or two every now and then. One of my favorite
    game series on the BBC was Repton by Superior Software. The game itself was an
    addictive puzzler starring a weird green lizard, but that''s not what I''m here
    to talk about. Each game in the series came with its own character editor and
    map designer, and these were worth the price of the software alone. The limitations
    imposed by the pixel grid led to some pretty strange sprite interpretations of
    photocopiers and Coke cans, but somehow they always looked OK when you saw them
    in the game. Of course we didn''t have a mouse at the time, so the cursor you
    can see in the screenshot was controlled purely by the keyboard. It just led to
    even more joy:


    ![](img/50202c17d5022233f3e3ec60560e35aa_185_0.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_185_1.png)'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'Another fun thing in Repton was drawing pictures in the map designer. You could
    do a self-portrait out of boulders and diamonds, and watch the whole thing fall
    apart in real-time when you played the level. Great days.


    For those of you who don''t fancy clearing the cobwebs of the attic, here is a
    modern Flash interpretation (with nearing resolution and all -- see SpecDraw.fla):


    The beeb was used for much more than gaming though. It also had some pretty sophisticated
    graphics commands, and image-programming abilities that are still better than
    what Flash has only just achieved. PLOT, MOVE, and GCOL, were my first experiences
    with the world of vectors, but to be perfectly honest, I don''t think I ever called
    them vectors back then. To me they were just lines. I actually made a pretty complicated
    (for me) drawing program with both line and pixel capabilities – admittedly it
    started off as an example program that came with a mouse, but I altered it enough
    to make it my own. Unfortunately, I can''t get a screenshot of this in the book
    because my beeb only works nowadays if I open it up and hold down the BASIC ROM
    when I turn it on, and even then it sometimes decides to just sit and beep at
    me instead of booting up. If anyone out there has a beeb in good working order
    that they want to get rid of, then I''ll be more than happy to give it a good
    home.


    # My drawing app (Spectrum ZX+)


    The affectionately titled Specy was superb for graphics. In essence, it is the
    lo-fi graphic lover''s dream, with it''s clashing colors and limited color palette.


    To say I pushed these graphic capabilities to their limit is talking rubbish.
    The best I could come up with (besides dodgy moiré patterns) was a drawing application,
    minus an interface. The drawing program resembled the classic etch-a-sketch tool:
    pen down... and still down. It was impossible to take the pen off the paper, but
    it had a groovy feel all the same, because sometimes limitations are good.


    It also tests your memory, guesswork and keypressing, when you try to calculate
    where you are going over a previously drawn line.


    ```

    // speccy draw by ken jokol / pinderkaos.com

    // movieclip inits

    _root.createEmptyMovieClip("root", 1);

    lines.lineStyle(1, 0x000000, 100);

    inc = 10;

    rightBound = 250;

    downBound = 190;

    currentX = 130;

    currentY = 80;

    lines.moveTo(currentX, currentY);

    // keys code

    checkDir = new Object();

    checkDir.onKeyDown = function() {

    if (Key.isDown(Key.LEFT)) {

    yAdd = 0;

    xAdd = -inc;

    }

    if (Key.isDown(Key.RIGHT)) {

    yAdd = 0;

    xAdd = inc;

    }

    if (Key.isDown(Key.DOWN)) {

    yAdd = inc;

    xAdd = 0;

    }

    if (Key.isDown(Key.UP)) {

    yAdd = -inc;

    xAdd = 0;

    }

    currentX += xAdd;

    currentY += yAdd;

    if (currentX>rightBound) {

    currentX = rightBound;

    }

    if (currentX<0) {

    currentX = 0;

    }

    if (currentY>downBound) {

    currentY = downBound;

    }

    if (currentY<0) {

    currentY = 0;

    }

    lines.lineTo(currentX, currentY);

    };

    Key.addListener(checkDir);

    ```'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'The Spectrum program had a pretty amazing way of saving the drawing with the
    `SAVE "" SCREEN$` command, which saved the current screen to cassette. The image
    was then reloaded, and redrawn bit-by-bit during loading, accompanied by the amazingly
    evil spectrum loading din. This made for one heckuva slideshow for the family.


    "Hey look Mom, another drawing of buildings," I said.


    "WHAT''S THAT SON?" she yelled over the racket.


    "NEVER MIND!" I screamed.


    (repeat until tape needs turning over or smell of dinner burning in oven starts
    filtering into the living room)


    ![](img/50202c17d5022233f3e3ec60560e35aa_187_0.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_187_1.png)


    # Degas Elite (Atari ST 520FM)


    Around the time of STOS, my joystick-controlled File Management system, and a
    friend''s (partially random and looped) INXS offering to the Public Domain, was
    a paint program called Degas Elite on the Atari ST.


    ![](img/50202c17d5022233f3e3ec60560e35aa_187_2.png)


    The thing that I remember most about Degas Elite wasn''t the interface itself,
    but the fact that my brother and I massacred the OutRun loading screen with it.
    It truly defined an era.


    The loading screen was littered with profanities and various other things, making
    OutRun impossible to play when our parents were around (ST games did take a pretty
    long time to load after all).


    "Where did you learn such words?" they might''ve asked, or "Where did you get
    such an awful game?" more likely, curbing all future software purchases.


    # Deluxe Paint (Amiga 1200)


    Deluxe Paint felt unique because of its frame-by-frame animation capability, which
    basically stinks in retrospect (compared to the mighty powers of Flash anyhow),
    but was liberating at the time.


    One highlight that sticks with me, purely for extreme effort and completeness,
    was my friend Mark''s rendition of his dog Jess catching a fly with her 30-inch
    tongue. It was truly swell seeing the eyes follow the fly round and round, before
    the tongue came out in a swift motion.'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# MacPaint (Macintosh)


    MacPaint has to win hands down for the interface, mad bitmap texture fills and
    for being in black & white (partly due to the Mac System 6 environment but more
    in the way of aesthetics – or so I like to believe).


    ![](img/50202c17d5022233f3e3ec60560e35aa_188_0.png)


    Not only did it define a generation for Mac users (like ‘The Grouch’ trash extension),
    but it had the most useable and spacious interface of any application of the time
    (MacPaint v2 didn’t have the same appeal though).


    I am impressed that the filetype is still supported nowadays, and I occasionally
    open it up when I can to fill random shapes with obscure textures.


    # Making a t-shirt app in Flash


    Apart from the beauty of the aforementioned technologies, this application was
    inspired by the Flash MX ability to dynamically import JPGs. Although the application
    uses a lot more of MX’s functionality – the drawing API for one – the original
    premise was to allow JPG manipulation on the fly.


    Before you start: Yes, I know you can do something more advanced than this if
    you use Photoshop, Illustrator, or even Flash. Not only does this SWF make the
    ability to design more accessible to John Doe web user, but it also strips us
    of the comforts of corporate-developed applications and takes us back to the basic
    toolset where design and composition are the most important assets.


    This is back to pen and paper stuff.


    ![](img/50202c17d5022233f3e3ec60560e35aa_188_1.png)


    When it came to selecting the tools, I started with a huge list, and broke it
    down as time permitted. The application was made over a few busy days, and although
    it seemed to be a constantly fluxing idea, I knew from the start what I wanted
    to do. I suppose the tools that made the application are rudimentary, but this
    is also part of the appeal – stripping away any complexity and letting the user
    be creative and unrestricted by the application. The beauty of it from an application
    point-of-view is that it can always grow in functionality and complexity.


    The application itself was built with modularity and expandability in mind, but
    could have been improved on given a little more time. The order of creation follows:


    +   - I built in the drawing capabilities first, so that I had a very rough drawing
    application.


    +   - I then added the colors, brush and fill options to complete this, adding
    essential interface elements as necessary.


    +   - The next step was to add the JPG and masking functionality, so all the creative
    capabilities were live.


    +   - I then finished up by adding the t-shirt mask, and the interface functionality.


    The result is as you can see, fully formed, but highly expandable with respect
    to tools and further options.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# Making the application


    The application is made up of a fairly basic interface on the right-hand side,
    and a large drawing space on the left with a t-shirt shape on it. There is also
    a ''help'' area beneath the interface that displays information on the tool that
    you''re currently using, and displays the purpose of a tool when you roll-over
    its button in the interface. Let''s take a quick look at the screen layout, and
    what each button does.


    ![](img/50202c17d5022233f3e3ec60560e35aa_189_0.png)


    +   - Pencil tool – the-standard free-draw tool for pencil lines. This is also
    the default tool.

    +   - Line tool – similar to the pencil, but for drawing straight lines.

    +   - Curve tool – for drawing Bezier curves, click and drag three points to define
    the shape.

    +   - Fill draw tool – for drawing filled shapes. Rather than a paint bucket,
    if you want to fill a shape then you have to draw that shape as you would with
    the pencil, and then release the mouse to fill the shape. If you don''t want a
    line around the fill, then either set the line to be the same color as the background,
    or set its alpha to zero.

    +   - Mask draw tool – this is similar to the fill draw tool, but it defines the
    shape for the mask that you will see the JPG through. You can draw more than one
    shape with this tool to create numerous windows into your image. The color and
    alpha settings of this tool make no difference to its effect.

    +   - JPG mask toggle button – this button simply toggles the JPG mask on and
    off. When it''s on, only the masked parts of the image are shown, and when it''s
    off, the complete image and mask are shown.

    +   - Mask move tool – this allows you to click on your JPG mask and drag it around
    to another position.

    +   - JPG move tool – this is similar to the mask move tool, but you move the
    JPG rather than the mask.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '**JPG scale tool** – this tool allows you to click and drag on a JPG to resize
    it. You can also hold the SHIFT key down while you''re dragging to constrain the
    proportions of the image.


    **Load JPG button** – this button will open up another box that allows you to
    enter the URL of a picture that you want to load into your image. You can only
    load one image per picture. When they are loaded in, the pictures are automatically
    resized to a square in the center of the t-shirt. Use the JPG scale tool to alter
    their size and proportions if needs be.


    ![](img/50202c17d5022233f3e3ec60560e35aa_190_0.png)


    **The color palette** – this is where you choose the colors to draw with. Make
    sure the right color chip is selected first, then choose a color and start drawing.


    **Toggle t-shirt mask button** – this toggles the main t-shirt mask on and off,
    hiding any extraneous elements that may have strayed over the edge of the shirt.


    The best way to look at how the application was made is to break down each individual
    tool and element of the interface. We''ll start with a few basics about the whole
    application.


    **Brush size** – allows you to change the size of the stroke/brush lines. 1 is
    normal, 100+ is big... very big


    **Brush and fill alpha** – both of these boxes allow you to enter a percentage
    of opacity for strokes or fills respectively. Try layering large brush strokes
    with low alphas... mmmm...


    ![](img/50202c17d5022233f3e3ec60560e35aa_190_1.png)


    **Brush, fill, and t-shirt color chips** – click once on these to select them
    (the selected one has a yellow center), and then click on a color in the palette
    to change to it. Changing the t-shirt color will have an immediate effect, the
    brush and fill colors will only come in to effect the next time you use one of
    the appropriate tools.


    ![](img/50202c17d5022233f3e3ec60560e35aa_190_2.png)'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# Initializing the movie


    Before we look at the rest of the movie, there are a few fundamental variables
    and movie clips that need to be initialized first.


    This drawing boundary is defined at the start of the whole code and is used by
    all of the drawing tools. Here are the global declarations:


    ```

    _global.tableleft = _root.square._x-(_root.square._width/2);

    _global.tableright = tableleft+_root.square._width;

    _global.tabletop = _root.square._y-(_root.square._height/2);

    _global.tablebottom = tabletop+_root.square._height;

    ```


    The tablet or drawing boundaries are defined as the space of the square movie
    clip located on the main stage. The equations here simply calculate the boundaries
    of square, and store them in four global variables. You''ll see these used throughout
    the code.


    The tempLayer global variable references the movie clip that is used for previewing
    some of the drawing tools.


    ```

    _root.createEmptyMovieClip("temporaryDrawLayer", 8000);

    _global.tempLayer = _root["temporaryDrawLayer"];

    ```


    We are using global variables to hold references to our main objects, so that
    we can quickly and easily refer to them in the code without having to type out
    full paths every time, and so that if we change the set up of the layer structure,
    or its name, at any time, then we only need to do so in one place in the code,
    rather than every single time the layer is referenced.


    drawPad stores all of the drawn elements created using the interface:


    ```

    _root.createEmptyMovieClip("drawingPad", 45000);

    _global.drawPad = _root.drawingPad;

    ```


    hitArea tells drawPad to use the square movie clip from the stage as a hit area:


    ```

    drawPad.hitArea = _root.square;

    ```


    ![](img/50202c17d5022233f3e3ec60560e35aa_191_0.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_191_1.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_191_2.png)


    ![](img/50202c17d5022233f3e3ec60560e35aa_191_3.png)'
