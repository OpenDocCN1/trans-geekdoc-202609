    \n假设你首先决定使用 `2` 号引脚来让你的 LED 灯闪烁。你有两个选择：要么在编码过程中手动应用该功能，要么使用变量。\n\n你会为变量命名并给它赋值。然后，在程序中，任何你需要引用该特定功能和引脚的地方，你都可以使用该变量。\n\
