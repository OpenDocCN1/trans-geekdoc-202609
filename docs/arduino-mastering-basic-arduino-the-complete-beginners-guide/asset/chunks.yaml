- raw: "To start off, you must connect your Arduino board to a computer using the\
    \ USB cable. The moment you so that, you may notice the LED with the label ‘ON’\
    \ next to it starts blinking furiously; this is the default program stored in\
    \ the board’s chip. What you will be doing to kick-start your Arduino is overriding\
    \ this default program, and making the LED blink on and off slowly, at 2-second\
    \ intervals.\n\nInstall the Drivers\n\nThis step is required if you are using\
    \ Windows 7, Vista or XP with an Arduino board for the first time. If you are\
    \ using another operating system, you can skip this section.\n\n1.  After you\
    \ plug in the board, Windows will start the driver installation process. However,\
    \ after a few moments, the process will fail.\n\n1.  Next you’ll need to click\
    \ on the Start Menu, and then click to open up the Control Panel.\n\n1.  Navigate\
    \ the Control Panel and go to System and Security. Click on System.\n\n1.  Once\
    \ the System window is up, click to open the Device Manager.\n\n1.  Look under\
    \ Ports (COM & LPT). Here, you should be able to see an open port named Arduino\
    \ UNO (COMxx). However, if for some reason there is no COM & LPT section, look\
    \ under Other Devices and search for Unknown Device.\n\n1.  Next, Right click\
    \ on the Arduino UNO (COmxx) or Unknown Device port and choose the Update Driver\
    \ Software option.\n\n1.  Select the Browse my computer for driver software option.\n\
    \n1.  Finally, find and select the driver file called arduino.inf, which can be\
    \ found in the Drivers folder of the Arduino Software download (note: NOT in the\
    \ FTDI USB Drivers sub-directory). Be aware that if you are using an older version\
    \ of the IDE (1.0.3 or older), you’ll need to select the Uno driver file named\
    \ Arduino UNO.inf.\n\n1.  From here, Windows will finish up the driver installation.\n\
    \nLaunch and Sketch\n\nOnce you have the Arduino IDE properly installed, you are\
    \ now ready to test drive your board with the first program. Before getting into\
    \ that, there are some things you need to know about writing code for Arduino.\
    \ The codes are known as sketches, written in C++.\n\nEvery sketch needs two void\
    \ type functions that do not return any value, setup() and loop(). The setup()\
    \ method is run once, just after the Arduino board is powered up and the loop()\
    \ method is run continuously afterwards. The setup() is where you want to do any\
    \ initialization steps, and loop() is for codes you want to run over and over\
    \ again.\n\nA basic sketch skeleton should look like this:\n\n|  void setup(){ } void\
    \ loop(){ } |\n\n| --- |\n\nNow, let’s give your first program a try:\n\n1.  Make\
    \ sure your board is plugged in, and launch the Arduino application\n\n1.  Open\
    \ the Blink example sketch. To do this simply go to: File > Examples > 1.Basics\
    \ > Blink\n\n1.  Select the Arduino board type you’re using by going to: Tools\
    \ > Board > your board type\n\n1.  Choose the serial/COM port that your Arduino\
    \ is attached to by going to: Tools > Port > COMxx \n\nIf you’re not certain which\
    \ of the serial devices is your Arduino board, have a look at the available ports,\
    \ then unplug your Arduino and check them again. It should be the one that disappeared\
    \ after you unplugged your board.\n\nUpload and Make it Blink!\n\nWith your Arduino\
    \ board connected, and the Blink sketch open, press the Upload button. Wait for\
    \ a few seconds; you should see the RX and TX LEDs of the board flashing as the\
    \ program is being uploaded. If the upload is successful, you will see the Done\
    \ Uploading message in the status bar of the Blink sketch. \n\nIf the whole process\
    \ is done correctly, the orange ‘ON’ LED should be blinking slowly. Congratulations!\
    \ You have successfully programmed your first Arduino.\n\nBut it doesn’t Work!\n\
    \nIf you followed all the steps above, but you can’t upload the sketch to your\
    \ Arduino for it to launch, it could be due to problems with one of the processes.\
    \ Try running through these troubleshooting measures:\n\n1.  Make sure you select\
    \ the right board under the Tools > Board menu. In case you choose to use another\
    \ board besides the UNO (as in the example), check the IC on the board. For instance,\
    \ newer Arduino Duemilanove boards come with an ATmega328, while older ones have\
    \ an ATmega168. So, make sure you select the right option.\n\n1.  Check that the\
    \ proper port is selected in the Tools > Serial Port menu.\n\n1.  Check to see\
    \ if the drivers for your board are properly installed in the Tools > Serial Port\
    \ menu in the Arduino IDE, with your board connected. There should be an additional\
    \ item that wasn’t there when your board is not plugged in.\n\nFirst Mission:\
    \ Light an LED!\n\nHaving successfully activated your Arduino, let’s try doing\
    \ a little bit more with it. The following is a common learning project suitable\
    \ for complete beginners in circuitry. For this task, you will need an LED and\
    \ your Arduino that has already been launched (following the previous instructions).\n\
    \n1.  Plug in your board.\n\n1.  Open another example sketch: File > Examples\
    \ > Basics > BareMinimum. This will open a new window with a simple sketch that\
    \ acts as the framework for your program.  \n\n1.  Connect the LED’s anode (the\
    \ longer pin) to pin 13 on the Arduino board, and the cathode (the shorter pin)\
    \ to the adjacent GND pin. \n\n1.  Under the setup() section of the sketch, add\
    \ the code: pinMode(13, OUTPUT);. This is the command that will run once to configure\
    \ the board and get it ready to do as you program.\n\n1.  Add the following under\
    \ the loop() section: digitalWrite(13, HIGH);. This sets the pin 13 as an output\
    \ pin with high voltage level (5 Volt).\n\nWhen complete, your sketch should look\
    \ like this:\n\n|  void setup(){pinMode(13, OUTPUT);} void loop(){digitalWrite(13,\
    \ HIGH);} |\n\n| --- |\n\nHit the Upload button and wait for the Done Uploading\
    \ message to show in the status bar. Voila! The LED should light up.\n\nChapter\
    \ 4\n\nArduino Survival Lingo\n\nAs you go about adding to your knowledge bank\
    \ about all things Arduino, you are bound to encounter some frequently used jargon.\
    \ This mini glossary of terms is by no means extensive, but it does help the beginner\
    \ understand the terms people often mention when they talk about Arduino, so that\
    \ you will not be totally at a loss.\n\n8-bit – The term refers to a Central Processing\
    \ Unit (CPU) that processes 8 bits of data as a single unit.\n\nAnalog – Describes\
    \ devices or systems that represent changing values as continuously variable physical\
    \ quantities. As humans, we perceive the world in analog, as everything we see\
    \ and hear is a continuous transmission of information (data) to our senses. An\
    \ example of an analog device is a record player, because it reads bumps and groves\
    \ from a vinyl record as a continuous signal. Analog data is more accurate than\
    \ digital data, but harder to manipulate and preserve. With Arduino boards, you\
    \ can use the analog pins to convert analog data to digital values.\n\nAVR – When\
    \ you work with electronics, you will encounter several meanings for this acronym.\
    \ In Arduino terms, it refers to the platforms environment, which is based on\
    \ Atmel Atmega micro-controllers. The AVR micro-controller was developed by Atmel\
    \ Corporation in 1996, by Alf-Egil Bogen and Vegard Wollan. The AVR acronym derives\
    \ from its developers and stands for Alf-Egil Bogen Vegard Wollan RISC micro-controller.\
    \ It is also known as Advanced Virtual RISC.\n\nC++ – Pronounced as ‘cee plus\
    \ plus’, it is a general-purpose programming language. You program an Arduino\
    \ board do stuff with C++, using the Arduino IDE.\n\nCPU – Stands for Central\
    \ Processing Unit and is also commonly referred to as the processor, a CPU is\
    \ the electronic circuitry within a computer that carries out the instructions\
    \ of a program.\n\nDigital – Information in digital is stored using a series of\
    \ 1s and 0s, known as binary code. Digital is the opposite of analog. Because\
    \ digital devices read only 1s and 0s, they can only approximate audio and video\
    \ signals. Unlike analog, digital data is easier to manipulate and store."
