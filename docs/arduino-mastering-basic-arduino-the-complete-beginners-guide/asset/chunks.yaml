  trans: '


    # Arduino 概念


    ### 驱动程序 (Driver)

    允许计算机与硬件或设备连接并通信的软件。如果没有正确的 `driver`，连接到计算机的硬件将无法正常工作。取决于你用于操作 Arduino 的操作系统，你可能需要为开发板安装
    `driver`。


    ### 环境 (Environment)

    在计算术语中，环境指的是硬件平台及其运行的操作系统的特定配置。


    ### 地线 (Ground)

    在电子工程中，地线是电路中测量电压的参考点或公共接线点。该术语也可以指电路连接的物理地面。在 Arduino 板板上，`GND` 引脚具有此用途。


    ### I/O

    输入/输出（input/output）的缩写，描述了向计算机传输数据以与外界交互的程序、操作或设备。例如，如果按下按钮（输入），灯泡就会亮起（输出）。


    ### LED

    发光二极管的缩写，是一种双极半导体光源。与其他光源相比，LED 许多优点，尺寸更小、寿命更长且功耗更低。在 Arduino 板板上，你会看到一些 LED 用于指示板板是否供电以及代码是否已上传。


    ### 微控制器 (Micro-controller)

    存在于单个集成电路中的计算机，经过编程以执行特定任务。微控制器是自动控制电子设备的背后，从手机、相机到洗衣机、微波炉以及机器人等。


    ### 开源 (Open-source)

    其源代码免费向公众提供使用或修改的程序。开源是开源倡议组织（OSI）拥有的认证标志，允许软件开发人员向公众自由共享他们的产品，以便进行改进和重新分发。与需要某种重新分发许可的商业软件不同，任何人都可以开源项目的开发和重新分发。


    ### 传感器 (Sensor)

    用于测量物理量并将其转换为电子信号的电子设备。多种类型的传感器用于测量物理属性，如温度、压力、距离、噪音、运动等。传感器通常是更复杂复杂的电子系统的组件。例如，如果你想制作一个数字温度计，你需要一个与
    Arduino 板板配套的温度传感器。


    ### 串口 (Serial port)

    用于向连接到计算机的设备（如调制解调器、打印机鼠标）发送数据的连接器。Arduino 板板必须连接到正确的串口才能正常上传代码。


    ### Sketch (程序)

    用于指 Arduino 程序的术语。编写用于命令 Arduino 的代码被称为 `sketch` 而不是简单的 `program`，因为 Arduino 平台的设计除了吸引工程师，还吸引艺术家和创意人士。根据创始者的说法，使用
    `sketch` 一词意味着一个可以探索、完善和开发的粗略想法——就像艺术或设计草图一样。因此，这会让非技术背景的人在使用 Arduino 时感到更有鼓励性，且不那么令人畏畏。


    ### 扩展板 (Shield)

    这是一种附加在 Arduino 之上以实现各种目的的电路板。它们之所以被称为这个，是因为它们像保护罩一样覆盖在 Arduino 板板的顶部。


    ### IDE (集成开发环境)

    运行以提供编程 Arduino 板板所需工具的软件应用程序。它包括源代码编辑器、构建自动化和调试器。它是一个开源软件，可以在 Arduino 官方网站（`www.arduino.cc`）下载。


    ### 脉冲宽度调制 (PWM)

    描述一种数字信号的术语，主要用于控制供给设备的功率量。


    ### 电压 (Voltage)

    两点之间的能量量，以标准单位 `V` 测量。


    # 资源


    ### 核心资源与进阶阅读

    无论你学习了什么，你在这个平台的旅程刚刚开始。这里列了一些由最受尊敬的权威编写的有用材料，帮助你继续前进。


    ### 绝对初学者

    #### Arduino 入门：开源电子 (Getting Started with Arduino: The Open Source Electronics)

    作者：Massimo Banzi 和 Michael Shiloh

    还有比从创始人之一那里更好地了解 Arduino 了？Massimo Banzi 是该平台的联合创始人。


    #### Arduino C 入门第二版：学习 C 语言编程 (Beginning C for Arduino, Second Edition: Learn
    C Programming)

    作者：Jack Purdum

    本书为之前没有微控制器或编程经验的人编写，非常适合初学者。你将获得对 C 语言的介绍，并简单地演示如何使用它。这本书源自作者 20 多年的教学经验，非常适合完全编程初学者。


    ### 将你的技能提升到新水平

    #### Arduino 编程进阶：深入学习 Sketch (Programming Arduino Next Steps: Going Further with
    Sketches)

    作者：Simon Monk

    电子大师 Simon Monk 在这本针对已经牢掌握编程的人的实用指南中，揭示了 Arduino 的专业编程秘密。这本书涵盖了 Arduino Uno、Leonardo
    和 Due。学习高级的 `sketching` 技术，将你的 Arduino 提升到新水平，包括互联网编程、实现串口通信最大化、内存管理、执行数字信号处理等。书中包含
    75 多个示例 sketch，均可下载。


    #### 从零开始学电子：通过破解、设计和发明进行学习 (Electronics from the Ground Up: Learn by Hacking,
    Designing, and Inventing)

    作者：Ronald Quan

    你对常见电子设备背后的复杂电路感兴趣吗？这本书将引导你通过分步实验，揭示电子电路是如何运作的。它还解释了组件、构造技术、基础测试设备、电路分析和故障排除。读完书后，你不仅掌握了设计定制电路的知识，还了破解和修改现有电路以满足你需求的能力。


    #### 恶魔天才的 30 个 Arduino 项目 (30 Arduino Projects for the Evil Genius)

    作者：Simon Monk

    想过制作一个摩斯密码翻译器吗？心率监测器？催眠器？或者一个键盘恶作剧？你可以通过这本 DIY 指南释放你的恶魔天才，它教你如何使用 Arduino Uno
    和 Arduino Leonardo 板板编程并构建一些非常迷人的项目。你将通过以下指南进行学习：每个项目都带有所需零件清单、带插图的分步说明，以及对项目背后科学原理的清晰解释。


    ### 趣味项目创意

    # Arduino 工作坊：65 个项目的上手入门 (Arduino Workshop: A Hands-On Introduction with 65 Projects)

    作者：John Boxall


