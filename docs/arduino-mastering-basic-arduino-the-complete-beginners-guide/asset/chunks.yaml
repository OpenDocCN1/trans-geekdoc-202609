- raw: "All that you are doing here is ensuring that Arduino is able to understand\
    \ the sketch and is able to follow the commands. Once you have run the “Verify”\
    \ command, the IDE will tell you whether it is verified or not in the message\
    \ box.\n\nYou will get a message stating “Done compiling” and that means that\
    \ you can upload the sketch to the board. It will give you the amount of memory\
    \ the sketch needs and the amount of memory the Arduino has.\n\nMistakes happen\
    \ and basic errors will come up during this stage. Perhaps you forgot to close\
    \ off the command properly and this prevents the sketch running properly.\n\n\
    The system will tell you when that is the case.\n\nIt will tell you which function\
    \ has a problem, it will list the area that it believes the error is in, and what\
    \ the nature of the problem is. It will even highlight what it believes to be\
    \ the problem area on the sketch itself.\n\nGetting Your Sketch to the Board and\
    \ Running It\n\nAs long as you are sure that your sketch is right, you can upload\
    \ it to the board. Your board will have to be connected to the USB port to do\
    \ this.\n\nYou can upload your sketch by using the “Upload” function. The IDE\
    \ is going to reverify the sketch before it uploads it.\n\nYou can check to see\
    \ that the board’s LED lighting blinks so that you know the computer is transferring\
    \ the information.\n\nOnce the upload is finished, as long as everything is correct,\
    \ your command should be run and you will see if the Arduino acts as you think\
    \ it should.\n\nChanging Sketches\n\nYou might want to tinker with your sketch\
    \ once you have run it and seen how it actually performs. Again, this is pretty\
    \ simple because it operates a lot like Microsoft Word.\n\nClick on the “Sketch”\
    \ button, go to the “Sketch Folder” option and click on it. It will bring up a\
    \ new window with the list of saved sketches.\n\nDouble-click on the one that\
    \ you want to change and the system will bring it up in the IDE window. You can\
    \ then edit it as you like.\n\nSave the amended sketch.\n\nChapter 3\n\nSignals\
    \ and the System\n\nPart of Arduino’s charm is that it can make sense of both\
    \ analog and digital inputs. It is able to interact with you and the world it\
    \ is in as a result. This can be useful when it comes to things like creating\
    \ sensors, etc. In this chapter, we will go through some of the useful things\
    \ you can do with the system in this regard.\n\nYou do need to have some sort\
    \ of knowledge about electronics in order to work through this chapter so, if\
    \ you do not, it will help to read up on the subject more. It can save a lot of\
    \ heartache and expense to do so.\n\nIf you are not sure what you are doing and\
    \ incorrectly connect components or use too much power for the system, you might\
    \ end up blowing the controller chip.\n\n“Getting Started in Electronics”, written\
    \ by Forrest Mims, is a good place to start off.\n\nYou need to find out what\
    \ voltage your controller will run on. This is usually about 5 volts. If you exceed\
    \ this voltage, you risk frying the chip.\n\nFor most boards, it is not the end\
    \ of the world if you do fry the chip because the chips are replaceable but it\
    \ is better to be safe than sorry.\n\nAnalog Pins and Digital Pins on Your Board\
    \  \n\nWe will deal with the standard Arduino board here.\n\nWe’ll start off with\
    \ a digital input pin – these are used to determine the presence of voltage on\
    \ the actual pin or the lack there of. The analog input pins, on the other hand,\
    \ are designed to determine what the range of voltage actually is.\n\nThe digitalRead\
    \ function will be input in the sketch as either “High” or “Low”. Essentially,\
    \ the former means that voltage is coming in to the pin and the latter means that\
    \ it is not. So, if you want the pin to measure whether or not there is a current\
    \ coming from a device connected to it, you must use the digitalRead function.\n\
    \nIf you want to measure voltage, on the other hand, you would use pinMode instead.\n\
    \nMost boards have 14 of these digital pins. The first two, numbers and 1, will\
    \ have the designations TX and RX. These pins are for the USB serial connection.\
    \ They should not be used for anything else.\n\nIf you find that you do not have\
    \ enough digital pins, you can instead use your analog pins.\n\nIf the standard\
    \ board is still not big enough, you can get yourself a mega board. It works in\
    \ much the same way as the standard one but it has a lot more pins.\n\nAnalog\
    \ values are completely different in that they vary on a continuous basis instead\
    \ of just having two levels – on and off. The volume control on your TV is a good\
    \ example of this – you can change the volume to any level along its range.\n\n\
    A lot of sensors out there give readings based on the differences in voltage.\
    \ You can use the function, analogRead in order to get the system to give you\
    \ a value based on the voltage it reads on one of the analog pins. You will be\
    \ able to tell not only if the pin is on or off but also how much voltage is running\
    \ through it.\n\nChapter 4\n\nIncorporating Sensors\n\nBefore we get onto the\
    \ actual sensors themselves, let’s take a look at setting up a workspace that\
    \ will work for you. You don’t need a huge space, unless you are working on a\
    \ particularly large project but you should have a space that you can dedicate\
    \ to the process.\n\nWhether this is a specific desk/ workbench or a whole room\
    \ in your house will depend on what you plan to build, how much time you will\
    \ devote to working on Arduino projects and how much space you currently have.\n\
    \nOne thing to bear in mind is that you will often be working with fiddly bits\
    \ and pieces and that your projects are going to require a good deal of concentration\
    \ on your part. Ideally speaking, you want a space where you can leave your work\
