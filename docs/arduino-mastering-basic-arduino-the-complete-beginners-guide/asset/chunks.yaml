  trans: '

    你在这里所做的一切都是为了确保 Arduino 能够理解程序（sketch）并执行指令。一旦你运行了 `Verify`（验证）命令，IDE 将在消息框中告诉你它是否通过了验证。


    你会收到一条显示“Done compiling”（编译完成）的消息，这意味着你可以将程序上传到开发板了。它会显示该程序所需的内存量以及 Arduino 拥有的内存总量。


    错误在所难免的，在这个阶段会出现一些基础错误。也许你忘记了正确关闭某个命令，这会导致程序无法正常运行。


    当发生这种情况时，系统会告知你。


    它会告诉你哪个函数存在问题，列出它认为错误所在的区域，以及问题的性质。它甚至会在程序本身上高亮它认为是有问题的区域。


    ## 将你的程序上传到开发板并运行


    只要你确定程序是正确的，就可以将其上传到开发板。为了实现这一点，你需要将开发板连接到 USB 端口。


    你可以使用 `Upload`（上传）功能来上传程序。IDE 在上传之前重新验证程序。


    你可以检查开发板上的 LED 灯是否在闪烁，这样你就知道电脑正在传输信息。


    一旦上传完成，只要一切正确，你的程序就就会运行，你就能看到 Arduino 的运行是否符合你的预期。


    ## 修改程序


    在你运行程序并看到它的实际表现后，你可能想对其进行调整。同样，这非常简单，因为它的操作非常类似于 Microsoft Word。


    点击 `Sketch`（程序）按钮，进入 `Sketch Folder`（程序文件夹）选项并点击它。它会弹出一个新窗口，列出已保存的程序。


    双击你想修改的程序，系统就会在 IDE 窗口中打开它。然后你可以按照自己的喜意进行编辑。


    保存修改后的程序。


    ## 第 3 章：信号与系统


    Arduino 的魅力之处在于它能够同时理解模拟和数字输入。结果是它能够与你以及它所处的世界进行交互。这在创建传感器等事情时非常有用。在本章中，我们将介绍你在这方面可以使用该系统进行的一些实用操作。


    你需要具备一些电子学知识才能完成本章内容，所以如果你不会，多读一下相关主题会有帮助。这可以节省大量的痛苦和费用。


    如果你不确定自己在做什么，错误地连接了组件，或者为系统提供了过高的功率，你可能会烧毁控制器芯片。


    由 Forrest Mims 编写《电子学入门》（Getting Started in Electronics）是一个很好的起点。


    你需要确定你的控制器在什么电压下运行。这通常是 5 特。如果你超过了这个电压，就有烧毁芯片的风险。


    对于大多数开发板来说，即使烧了芯片也不是末日，因为芯片是可以更换的，但防胜于未。


    ### 开发板上的模拟引脚和数字引脚


    我们在这里处理标准的 Arduino 开发板。


    我们将从数字输入引脚开始——这些引脚用于判断引脚上是否存在电压。相反，模拟输入引脚旨在确定电压的实际范围。


    `digitalRead` 函数在程序中的输入为“High”（高电平）或“Low”（低电平）。本质，前者意味着电压进入了引脚，后者意味着没有。所以，如果你想让引脚测量连接到它的设备是否有电流通过，你必须使用
    `digitalRead` 函数。


    相反，如果你想测量电压，你应该使用 `pinMode`。


    大多数开发板有 14 个这样的数字引脚。前两个（编号为 0 和 1）被标记为 `TX` 和 `RX`。这些引脚用于 USB 串口连接。它们不应用于其他地方。


    如果你发现数字引脚不够用，可以改用模拟引脚。


    如果标准开发板仍然不够大，你可以买一个 Mega 开发板。它的工作方式与标准版非常相似，但引脚要多得多。


    模拟值完全不同，因为它们是连续变化的，而不是只有两个水平——开启（on）和关闭（off）。你电视上的音量控制就是一个很好的例子——你可以将音量调节到其范围内的任何电平。


    许多传感器根据电压差给出读数。你可以使用 `analogRead` 函数让系统根据它在某个模拟引脚上读取的电压给你给出一个值。你不仅能判断引脚是开启还是关闭，还能知道流过它的电压有多少。


    ## 第 4 章：整合传感器


    在介绍传感器本身之前，让我们来看看如何设置一个实用的工作空间。除非你正在做一个特别大的项目，否则不需要巨大的空间，但你应该有一个可以工作的空间。


    无论是一个特定的桌子还是房子里的整个房间，取决于你计划做什么以及你目前有多少空间。


    需要记住的一点是，你经常处理细小的零件，而且你的项目需要大量的精力。理想情况下，你希望有一个空间可以在之后回到那里继续工作。如果你在半途停止，以后需要重新清理会非常麻烦。


    在决定将 Arduino 工作空间放在哪里时，请考虑以下因素：


    1. 舒适的椅子和一个尽可能干燥的地方。（因此，洗衣间可能不是好主意。）

    2. 一个坚固的工作台，可以为你的项目和工具提供足够的支撑。

    3. 手头有电源。

    4. 设置笔记本电脑或电脑的空间。

    5. 良好的照明和通风至关重要。

    6. 存放所有零件的空间——架子很有用。你需要各种存储物品来存放工具和零件。通常用于存放钉子、螺丝等硬件的抽屉会非常方便。尝试使用透明门的抽屉，或者仔细标记抽屉以使你的存储系统尽可能高效。

    7. 一个舒适的工作环境，特别是对于长时间的项目。例如，如果你在车库里留出一个空间，在深冬时那里足够温暖、让人舒适吗？

    8. 没有干扰的环境。你可以和家人隔离开来吗？选择家中交通繁忙的区域不利于你在构建 Arduino 项目和编写大量复杂代码时所需的专注力。

    '
