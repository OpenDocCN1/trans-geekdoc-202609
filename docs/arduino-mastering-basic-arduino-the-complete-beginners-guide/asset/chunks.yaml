    Chapter 2


    Creating and Saving Your Own Sketches


    Sketches are really just your instructions to your board. Now that you have some
    understanding of how the board works, you no doubt want to jump right in and get
    started with writing your own sketches.


    What you need to remember is that you will need to tell your board what to do,
    step by step. The board cannot think for itself or fill in the blanks when it
    comes to codes that have errors or missing information.


    Fortunately, with a little bit of planning, you can work around this.


    Project Planning Stages


    1.  Clear objectives: Start by clearing defining what it is that you want to get
    out of the sketch.


    1.  Write out the algorithm: This is where you list the instructions that you
    need in order to make your project a reality. This is a step by step set of instructions
    from start to finish.


    1.  Choose what hardware you are using: The hardware will need to be connected
    to the board and you need to figure out how to do that upfront.


    1.  Your sketch: Now you can actually get down to writing out the sketch. In this,
    you will give the Arduino clear and simple instructions on what it must do.


    1.  Connect everything: Now you can wire in the circuitry and hardware to the
    board.


    1.  Test for bugs: Does the project work as it should? If not, what errors can
    you pick up? Work through everything one step at a time again. It could be a problem
    with the sketch or the algorithm, it could be a problem with the way it was connected
    or it might even be a faulty component.


    How to Write Your Own Sketch


    Creating a basic sketch is easy if you approach it step by step. The sketch will
    run through each command in the order in which they appear so make sure that your
    steps are laid out in a logical sequence.


    To draw a parallel in the real world – deal with writing the sketch the same way
    you would approach teaching a young child to bring you their jacket. They don’t
    know anything.


    You have to explain to them where the jacket is. You have to tell them to fetch
    the jacket. You have to tell them how long it should take. You have to tell them
    to hand the jacket over to you, etc.


    In the same way, you have to tell your board what pins to use and what you have
    connected to them. You have to tell them what components you have added and what
    you want them to do.'
