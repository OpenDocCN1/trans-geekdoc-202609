    # 7. 电压调节器 – 顾其名，该组件控制进入 `Arduino` 板的电压量。它通过排除进入电路板的额外电压来发挥作用。但它也有局限性；它无法处理超过
    20 伏的电压。因此，特别提醒：不要使用大于 20 伏的电源！它会过载并损坏你的 `Arduino`。大多数型号的建议电压为 6 到 12 伏。


    ## 全家人桶


    为了满足用户的各种需求和挑战，`Arduino` 板自首次引入以来已经发生了巨大的变化。不仅仅是 8 位开发板，`Arduino` 还有为各种应用构建的开发板，从物联网（`IoT`）应用到可穿戴设备。当然，它们所有的都是开源的，这进一步赋予了用户构建衍生产品并根据特定需求进行定制的能力。以下是被认为最适合
    `Arduino` 初学者的几个选项：


    1.  `Arduino UNO (R3)` – `UNO` 通常被认为是决定性的 `Arduino` 板。它配备了入门所需的所有设备，具有 14 个数字输入/输出引脚
    –其中 6 个可以作为脉宽调制（`PWM`）输出 – 6 个模拟输入、一个 `USB` 连接、一个电源接口以及更多功能。只需将其连接到任何电源源（无论是通过
    `USB` 线连接到电脑、AC 转 DC 适配器还是电池），你就可以开始了。无论你的 `Arduino` 经验如何，选择 `UNO` 永远不会出错。


    2.  `Arduino Mega (2560)` – `Mega` 板比 `UNO` 高出几个档次，就像它的大哥一样。它拥有令人深刻的 54 个数字输入/输出引脚，其中
    14 个可以作为 `PWM` 输出，16 个模拟输入，加上你在 `UNO` 上找到的所有其他功能，且功能也相同。如果你有一个需要大量数字输入输出的项目（例如用于许多
    LED 灯或按钮），`Mega` 可能是适合这项任务的板。


    3.  `Arduino Leonardo` – `Leonardo` 板提供了一个更便宜、更简单的替代方案，它是第一个使用内置 `USB` 的微控制器的
    `Arduino` 开发板。由于其直接处理 `USB`，因此可以使用许多代码库允许开发板模拟计算机键盘、鼠标等。


    4.  `Arduino Mega ADK` – 这块板基本上是 `Arduino Mega` 板的特殊版本。它专门为与安卓智能手机接口而设计。


    5.  `LilyPad Arduino` – 考虑制作一件发光的猫服吗？`LilyPad` 是你需要的可穿戴电子纺织板。该板由工程师、书籍《Sew Electric》的合著者
    Leah Buechley 设计，这种创新的板具有大型连接焊盘和平坦的背面，允许使用导电线将其缝入衣服中。它甚至是可洗的！


    6.  `Arduino NG`, `Diecimila` 和 `duemilanove` – 统称为 `UNO` 的旧版本，这些板基本上是 `Arduino`
    的祖父。旧板缺少其他新板的一些关键功能。例如，`Diecimila` 和 `NG` 在 `USB` 端口旁边有一个跳线，需要手动选择 `USB` 或电池电源。`NG`
    在上传程序之前还需要按住 `Reset` 按钮几秒钟。但需要注意的是，旧板仍在被 `Arduino` 爱好者不断改进和改进。一旦你获得了更多关于 `Arduino`
    的知识和经验，它们值得研究。


    ## Genuino 是什么？！


    如果你在美国境外购买 `Arduino` 板，你可能会发现外观完全相同的 `Genuino` 板。别担心；你没有被仿制品产品欺骗！`Genuino` 是 `Arduino`
    的姐妹品牌，由同一团队创建，用于在美国境外销售的板子和产品。


    `Genuino` 品牌认证板子和产品的真实性，符合 `Arduino` 的开源硬件哲学。该品牌与亚洲、欧洲、南美、加拿大和非洲的市场领先制造商建立了联盟，使
    `Arduino` 硬件在全球范围内可用。


    你可以将 `Genuino` 板想象成住在国外的 `Arduino` 板的同形双胞。所有 `Genuino` 板与其对应的 `Arduino` 板具有相似的质量、组件和特性。因此，取决于你住在哪个地区，在购买
    `Arduino UNO` 时可能会发现 `Genuino UNO` 板。这没关系；你得到的仍然正品。


    但要注意，并不是所有的 `Arduino` 板（尤其是那些不为人知的）都有 `Genuino` 双胞胎。


    ## 你可以使用的其他东西


    `Arduino` 板本身不能做很多事情，因此你需要将它与其他东西连接。有很多硬件可以固定在上面（进一步阅读请参见第 5 章）。通过 `shields`（扩展板），你可以编写
    `Arduino` 连接到互联网、控制 `LCD` 屏幕、控制电机并提供蜂窝通信。此外，你还可以通过 `shields` 实现更多，它们是可以安装在 `Arduino`
    板顶部的预制电路板。


    ### 安装软件


    一旦你处理好了硬件，要要做的事情就是安装 `Arduino IDE`。这是你为微控制器编写代码并连接电路组件以实现功能所需的软件。你可以在 `Arduino`
    官方网站下载该软件：`www.arduino.cc`。


    下载后，将文件夹解压到计算机硬盘的某个位置，然后运行 `Arduino.EXE` 文件完成安装。现在，你已经准备好开始 `Arduino` 了！


    ## 第 3 章 迈出第一步！


    你有了 `Arduino` 板和软件；现在是时候开始正事了！在接下来的章节中，你将被引导逐步完成几项任务；你将用你的第一个代码测试 `Arduino` 软件和板，并完成一个点亮
    `LED` 的简单项目。对于给示例，将使用 `Arduino UNO (R3)` 板。然而，这些指令经过微调后适用于你选择的任何 `Arduino` 板。


    以下是你开始 `Arduino` 之旅所需的四件设备：


    1.  运行 Windows（XP 或更高版本）、Mac 或 Linux 操作系统的计算机，并安装了 `Arduino IDE`


    2.  一个 `Arduino` 微控制器（即电路板）


    3.  一根 `USB A-to-B` 线用于将 `Arduino` 板连接到计算机，或适用于你选择的板（注意某些板需要 `A-to-Mini-B` 线）


    4.  一个 `LED`


    ### 插入板子


    `Arduino` 板通过连接计算机 `USB`（通过 `USB` 接口）或外部电源（通过圆柱接口）供电。你需要将板连接到计算机以便使用 `Arduino
    IDE` 对其进行编程。一旦你完成编程且不需要连接——取决于你如何在项目中使用该板——你就可以选择使用墙电源供电了。


    '
