    实际上任何人都可以使用 `Arduino`。专家们确信可以在构建项目以及在在线社区与其他用户分享想法中获得乐趣。对于那些没有电路和微控制器编程经验的人来说，这个平台是学习和实验的绝佳选择。然而，在探索
    `Arduino` 的奇之处之前，建议你至少对这些基础概念有深入的：


    1. 电性和电路基础

    2. 电压、电流、电阻和欧姆定律

    3. 极性

    4. 集成电路 (ICs)

    5. 数字逻辑

    6. 模拟与数字的区别

    7. 基础计算机编程


    `Arduino` 受业余爱好者和专家共同喜爱的原因是，与其他平台和系统相比，它简化了处理微控制器的流程。起，将新代码加载到板上只需通过 `USB` 线缆即可，而不像之前的可编程电路板需要使用单独的硬件。此外，`Arduino`
    板与其他微控制器平台相比价格相对低廉，一些预装模块的费用低于 50 美元。如果这些优点还不够，以下是选择 `Arduino` 作为首选平台的更多原因：


    1. 跨平台 – `Arduino` 的 `IDE` 可运行在 `Windows`、`Macintosh OSX` 和 `Linux` 操作系统，而大多数微控制器系统仅兼容
    `Windows`。

    2. 简单的编程环境 – `Arduino IDE` 使用简化版的 `C++`，让初学者更容易学习编程，同时对高级用户也有足够的灵活性来发挥创意和抱负。

    3. 开源且可扩展的硬件 – `Arduino` 板的设计方案在知识共享许可下发布，允许电路设计师创建自己的模块版本并对其进行扩展和改进。

    4. 开源且可扩展的软件 – `Arduino IDE` 作为开源工具发布，经验程序员可以通过 `C++` 库对其进行扩展。你也可以通过 `Arduino`
    学习 `AVR-C` 编程语言，就像可以直接将 `AVR-C` 代码添加到 `Arduino` 程序中一样。

    5. 强大的社区支持 – 如果你是该平台的完全用户且不知道从何开始，由于 `Arduino` 的普及，可以在网上找到丰富的信息。你永远不会缺少学习资源，甚至可以找到可以直接运行的预代码项目（请参阅第
    5 章的 `Arduino` 资源）。


    ## Arduino 能为你做什么？


    `Arduino` 的设计初衷是创意和创新，无论经验水平如何。艺术家、设计师、电工、工程师、程序员和科学爱好者都可以使用它来创建交互式物体和环境。`Arduino`
    可以交互的东西包括电机、扬声器、`LEDs`、`GPS` 单元、摄像头、电视、智能手机甚至互联网。


    通过 `Arduino`，人们可以构建低成本的科学仪器、为机器人进行编程、构建建筑设计的交互原型、为乐器创建实验装置以研究声音、构建新的视频游戏硬件——这仅仅只是冰山一角！所以，无论你的项目涉及构建机器人、加热毯子、节日灯光展示还是占卜机，`Arduino`
    都可以作为你电子项目的基础。


    ## 在继续之前...


    为了表示感谢，我为你准备了一个很棒的惊喜


    ### 领取你的专属免费礼物！


    限时范围内，我提供了一本免费书籍的访问权限，这仅针对我的读者提供，在其他地方都找不到。不要错过这个机会。


    ## 第 2 章：开始使用 Arduino


    随着平台的不断扩展，你需要了解的是：


    ### Arduino 板的结构


    在开始操作之前，你需要了解一些功能。主 IC 在不同电路板之间有所不同：


    #### USB 和圆孔接口

    几乎所有的板子都有 `USB` 连接和一个圆孔接口（barrel jack）。


    #### 引脚

    引脚是你构建电路的地方。这里是你通常会看到的：


    * `GND`: `Ground`（地）的缩写，这些引脚用于你的电路接地。

    * `5V` 和 `3.3V`: 这些引脚分别提供 `5 Volts` 和 `3.3 Volts`。

    * `Analog`: 你可以在 `Analog In` 标签下找到这一排引脚。它们用于传感器读取信号并将这些信号转换为数字值。

    * `Digital`: 模拟引脚对面方的 `Digital` 标签下是用于数字输入和输出的引脚。例如，当按下按钮（输入）时，`LED` 点亮（输出）。

    * `PWM`: 在很多板子上，`Digital` 旁边有 `PWM` 标签。这意味着这些引脚可以作为普通的数字引脚，也可以用于一种名为脉宽调制（Pulse-Width
    Modulation）的信号。

    * `AREF`: `Analog Reference`（模拟参考）的缩写，这个引脚可以设置外部电压作为模拟引脚的上限（0 到 5 特之间），尽管它通常被闲置。


    #### 重置按钮

    这个按钮自而易见；按下它会将复位引脚接地，并重启加载到板子上的任何代码。然而，它的功能并不是将一切重置为初始状态并清除任何问题。


    #### 电源 LED 指示灯

    这是一个微型 LED，旁边有 `ON` 字样。当你将板接入电源时，它会亮起；如果没有亮，则意味着你必须重新检查电路，因为出了问题。


    #### 传输 (TX) 和 接收 (RX) LED

    不要与 0 和 1 数字引脚旁的 `TX` 和 `RX` 标记混淆，带有这些标记的 `LEDs` 在板子传输或接收数据时将提供视觉指示，例如当你向板子载入新程序时。


    '
