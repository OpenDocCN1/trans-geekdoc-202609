  trans: "\n\nISBN-10: 1593274483 / ISBN-13: 860-1200651553\n\n你认为自己已经掌握了 Arduino，并准备好尝试一些有趣的项目了吗？这本书将带你入门。你将学习到\
    \ Arduino 丰富的输入/输出扩展模块、显示器、电机、传感器、指示器等。每个项目都旨在巩固你所学的知识，并随着你学习的深入，复杂性也会不断增加。那么，你可以学习构建什么呢？例如，数字体温度计、电池检测器和\
    \ GPS 记录器等。还有一些有趣的内容可以学习，比如制作一个二进制知识问答游戏和一个电子骰子。\n\n# 缝纫电子完美 (Sew Electric Perfect)\n\
    \n作者 Leah Buechley, Kanjun Qiu 和 Sonja de Boer\n\nISBN-10: 0989795608 / ISBN-13:\
    \ 978-0989795609\n\n这本书由 `LilyPad Arduino` 板的创造者 Leah Buechley 合著，是一本结合了手工艺、电子学和编程来创作有趣项目的实战指南。学习如何使用\
    \ `LilyPad Arduino` 板制作互动玩具、发光时尚配件以及许多其他酷炫物品，并可以与朋友和家人分享。这对于教师向青少年介绍实用电子技术也是极佳的材料。\n\
    \n# 纺织信息：来自电子织物与教育世界的派遣 (Textile Messages: Dispatches From the World of E-Textiles\
    \ and Education)\n\n作者 Leah Buechley, Kylie Peppler, Michael Eisenberg 和 Yasmin\
    \ Kafai\n\nISBN-10: 143311920X / ISBN-13: 978-1433119200\n\n这本书是对电子织物（e-textiles）的简要介绍——这种软电路板可以将电子元件整合到服装和家具中。在\
    \ `Arduino` 家族中，`LilyPad` 板就是一种电子织物，这是一本从入门到中级的指南，可以教你如何充分利用你的 `LilyPad`。你将接触到一系列工具，无论你是教育者、爱好者还是设计师，都能让你通过电子织物进行学习和创作。\n\
    \n# 制作：可穿戴电子设备：设计、原型制作并穿上你自己的交互式服装\n\n作者 Kate Hartman\n\nISBN-10: 1449336515 /\
    \ ISBN-13: 978-1449336516 \n\n对于对计算感兴趣的人，以及想要构建融合这两个学科的创意项目的时尚设计师来说，这本书是必读的。你将学习到制作互动电子电路的工具、材料和技术，并在分步骤的指导下将它们嵌入衣物中。虽然书中没有专门介绍\
    \ `Arduino` 项目，但它将为你提供可以适用于 `Arduino` 平台的知识。所以，如果你曾想过制作会改变颜色以衬托肤色的衣服、显示下一班公交车何时到达的夹克、可以动态调整高度的鞋子以及许多其他酷炫的可穿戴物品，现在你可以了！\n\
    \n# Arduino 险险 (Adventures in Arduino)\n\n作者 Becky Stewart\n\nISBN-10: 1118948475\
    \ / ISBN-13: 978-1118948477\n\n如果你认识一个在电气工程和编程方面有潜力的孩子，把这本书送给他/她吧！这本书专为 11 到 15\
    \ 岁的初芽电工编写，是一本极好的 `Arduino` 入门资源。\n\n## 在线资源\n\n- [`www.arduino.cc/`](https://www.arduino.cc/)\
    \ - `Arduino` 官方网站，满足你的所有需求以及关于该平台的最新开发新闻。你可以在这里找到并加入 `Arduino` 论坛，与全球其他用户一起获取帮助并分享知识。\n\
    - [`www.cplusplus.com/`](http://www.cplusplus.com/) - 一个涵盖所有 C++ 内容的全面在线库。你可以了解\
    \ `Arduino` 运行的编程语言的历史、开发以及全方位的知识。 \n- [`www.ladyada.net/`](http://www.ladyada.net/)\
    \ - 学习电子学和电路的绝佳资源，几乎所有内容都是开源的。\n\n## 结论\n\n祝喜你完成了 `Arduino` 基础学徒培训，并成功完成了你的第一个\
    \ `Arduino` 项目！在书中，我希望我已经提供了你所需的所有信息，让你能够自信地面对未来。\n\n祝喜你完成了 `Arduino` 基础学徒培训，并成功完成了你的第一个\
