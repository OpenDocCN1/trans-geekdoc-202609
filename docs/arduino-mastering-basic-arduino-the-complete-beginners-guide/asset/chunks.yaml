  trans: '

    通常，你可以通过引脚的长度来识别正极 —— 正极引脚通常会更长。阴极的外壳通常会标记有一个扁平的区域。


    光的颜色以及它所需的电压将取决于二极管的制造方式。除了二极管之外，你还需要一个电阻以防止 LED 过快烧毁。


    像往常一样，仔细阅读你所选择的 LED 设备的数据表是一个好主意，以确保你获得的是最适合你特定项目的一个。LED 能够承受的最大电流非常重要，正向电压所需的值也一样。这对于你选择合适的电阻来使用尤为重要。


    你型板子上的引脚最大可以提供 `40 mA`。这对于你的标准 LED 是足够的，但对于那些运行亮度更高的 LED 来说还不够。你每个引脚上也只能运行一个一个
    LED。如果你需要增加电流，可以添加一个晶体管。


    多色 LED 在封装内会有多个一个 LED。这可能意味着你有更多的引脚组需要处理。数据表可以提供关于如何连接这些引脚的更多细节。


    对于带有集成芯片的 LED，你能做的事情是有限制的。在这些情况下，芯片会改变颜色，而这无法被 Arduino 板板覆盖。如果你在使用 `Pulse Wave
    Modulation`（脉冲调制），这些并不是最佳选择，因为芯片会不断重启。


    ### 最大引脚电流


    你还需要注意那些抽入功率超过了你芯片承受能力的 LED。芯片可以提供的 `mA` 电源量要远大于它实际上能够处理的量。在计算最大额定值时你需要考虑到这一点。


    如果你在这个坚持上不小心，你的 Arduino 芯片可能会被烧毁。


    ### LED 的实际应用


    Arduino 控制 LED 的开启或关闭已经没有更简单了。你会发现，连接 LED 并运行它的草图（sketch）是大多数关于该主题书籍包含的基础入门课程之一。


    #### 串联电阻

    需要控制流 LED 的电流以防止它们烧毁。某些 LED 封装内置了电阻。


    对于那些没有内置电阻的，你需要在每个引脚上连接一个电阻。为了给这项工作选择合适的电阻，你需要知道引脚将提供的电压、LED 的正向电压是多少以及你希望 LED
    有多大的电流。


    #### 音频输出

    Arduino 板板并不是真的为了自己产生声音而设计的。但如果将它们连接到扬声器，它们就可以发出声音。


    它只需通过发送产生振动的脉冲即可做到。振动是产生声音的原因。


    通过改变发送脉冲的速率，可以改变音调。较长的脉冲会产生较低频率的声音。


    Arduino 板板的软件确实有一个可以让它们发出声音的功能。你需要使用硬件中内置的定时器。标准板板无法同时运行超过一个音调（tone），而且当定时器被用于其他事情时你可能会遇到问题。


    预先知道这一点，你可以据此规划你的草图，并安排在产生音调的不同时间运行需要定时器的函数。


    然而，必须说，产生的音调范围非常有限，听起来很生硬且是计算机生成的。如果你想创作真正的音乐，你需要添加外部硬件。


    Arduino 非常擅长控制实际上可以播放音乐的设备。通过这种方法，你可以重现你想要的所有音符。


    你也可以使用 Arduino 控制用于发出声音的外部设备。


    # 第 6 章


    ## 实验板


    实验板是一种可以让你你的所有项目提升一或两个层次的技术。你只需要把一切都插上并寄希望于运气，但使用实验板会让一切更有条理。实验板通常是一个有很多孔的塑料板。


    当你使用实验板时，你会发现这些孔按行对齐的，同一行内的孔是连通的，但行与列之间的孔是不通的。这使得你可以方便地连接各种组件而不需要焊接。


    实验板通常带有背胶，这使得你可以将其固定在表面。


    在开始使用之前之前，你需要了解以下部分：


    1. **地线排**：你需要将其连接到地。这些插槽通常标记为黑色或蓝色。

    2. **电源排**：你需要将其连接到电源。这些插槽通常标记为红色。

    3. **终端排**：这些是用来插入 Arduino 或其他引脚的。

    4. **导线**：这些是用来连接不同区域的导线。


    如果你想使用导线，你只需要将一头插入其中一个孔中。如果你需要连接两个地方，就将另一头插入另一个孔中。在使用实验板时，要确保导线整齐以防止短路。


    实验板非常适合原型设计，因为你可以快速更改连接而无需焊接。通常，你会将 Arduino 的电源连接到实验板的电源排，将地连接到地线排。

    。

