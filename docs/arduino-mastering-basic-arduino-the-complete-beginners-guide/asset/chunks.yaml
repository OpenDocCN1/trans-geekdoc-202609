    and this will be sufficient to charge very small projects. In many cases, you
    need to have a separate power supply.

    5. **A set of screwdrivers**: You will be working with a range of components of
    varying sizes and descriptions. You will need a variety of star and flathead screwdrivers.

    6. **Helping Hands**: These are a little clamp that has a couple of alligator
    clips attached to connect to the board you are working with. They hold the board
    up and steady so that it is easier to work with. Some have a magnifying glass
    built into their design as well. These are hardly ever referred to in Arduino
    projects but they are an extremely helpful device.

    7. **Wire Strippers**: These are used to strip insulation from wires. There are
    many options ranging from cheap to expensive.

    8. **Needle-Nose pliers**: These are useful for working with fine components.

    9. **Angle Side Cutters**: These are useful for cutting wires.

    10. **Permanent marker and scrap paper**: These help you sketch out your projects
    before starting the actual construction.

    11. **Self-healing mat**: This protects your desk and provides a firm surface
    for cutting.


    ## Sensors and Your Arduino Board


    Incorporating sensors makes it possible for the Arduino board to measure things
    in its environment and/ or respond to them. Sensors help make the boards a lot
    more useful and this is one of the primary reasons people use the boards in the
    first place. The sensors read data and convert it into an electrical signal that
    the Arduino is able to read. The sensor itself will determine what data is read
    - the data produced is only as good as the sensor.


    A simpler sensor, like a `photoresistor`, is made of a substance that is designed
    to respond to changes in the environment. More complex sensors will incorporate
    a microcontroller into their design.


    In this chapter, we will deal with using sensors and how you can incorporate them
    into your Arduino designs.


    Sensors provide the Arduino board with information in one of the following ways:


    * **Digital On/ Off**: These tend to be more simple sensors, like tilt sensors.
    When conditions change, they will switch the pin on/ off. These will work in conjunction
    with the `digitalRead()` function.

    * **Analog**: These provide a signal that varies according the conditions that
    the sensor is experiencing. These will work in conjunction with the `analogRead()`
    function.

    * **Pulse width**: These are sensors that can measure things such as distance
    travelled. You would need to measure the duration of the pulse and so would need
    to use the `pulseIn()` function.

    * **Serial**: There are sensors that use a serial protocol to communicate values.
    These must be connected through the serial port and so you are limited in terms
    of how many you can add.

    '
  trans: '


    # 工作空间组织


    1. 一个不放置零食和饮料的区域。虽然想在工作区域吃东西很很有吸引力，但在大多数情况下，需要吃零食时最好去休息一下。在正在进行的项目上洒了食物或饮料可能是灾难性的。

    2. 让一切物品都保持整洁整齐。这意味着要有足够的抽屉等，以便你可以妥善地存放零件。凌乱的工作空间不利于高效进行项目。如果你必须浪费时间寻找组件，你可能会中断思路，并导致在项目上花费更长的时间。


    ## 值得考虑的工具


    这里有一些基础工具可以让你的生活变得简单得多。在开始你的 Arduino 项目之前，这里有一份需要考虑购买的工具列表：


    1. **万用表**：这并不总是会出现在你的 Arduino 项目清单中，但它能让你的体验少很多很多挫败感。万用表允许你测量电气电路中的许多东西，如电流、电压、电路是否完整等。通过万用表，你可以测试每个电子元件是否工作正常。当某些东西运行不符合预期时，它在故障排除方面也极其有用。

    2. **跳线线和几块面包板**：同样，这些并不总是严格必要的，也不是所有项目都需要的。然而，面包板可以让你测试提议布局变得容易得多，并查看其是否有效，而不必费力将电线焊在位置。面包板也有助于保持项目整洁整齐，并使创建正确的连接变得简单。除了面包板，你还需要跳线线——这些是让面包板上的连接成为可能的线。你需要找到硬芯跳线线来配合面包板使用，并寻找能够处理你的项目产生的电压的电线。

    3. **电烙铁**：面包板并不适用于所有项目，在这些情况下，你需要能够将组件焊接在位。例如，如果你觉得需要在项目中加入按钮，你将希望把它们的电线焊好。即使你打算将面包板永久地整合到项目中，你可能仍然需要将组件焊在位置。电烙铁很便宜，应该成为你工具箱的一部分。但这里有一个警告——它们非常烫。务必确保在加热时有一个安全的地方来支撑它们，并在用完后务必确保关掉电源。如果你要使用电烙铁，在急救箱里准备一个小型烫伤包包是必不可少的。

    4. **电源供应设备**：Arduino 确实有一点电量，这足以为非常小的项目充电。在很多情况下，你需要一个独立的电源。

    5. **一套螺丝刀**：你将处理各种尺寸和描述的组件。你需要各种十字形和一字形的螺丝刀。

    6. **万能夹（助手夹具）**：这是一种小夹子，上面带有几个鳄鱼夹，用于连接到你正在操作的板上。它们可以固定并支撑电路板，使其更容易操作。有些设计中还内置了放大镜。这些在
    Arduino 项目中很少被提到，但它们是极有帮助的设备。

    7. **剥线器**：这些用于剥除电线上的绝缘层。有很多从廉价到昂贵的各种选择。

    8. **尖嘴钳**：这些对于处理精细组件非常有用。

    9. **斜口剪**：这些对于剪断电线非常有用。

    10. **持久性标记笔和废纸**：这些可以帮助你在开始实际构建前勾画你的项目。

    11. **切割垫**：它可以保护你的桌子，并为切割提供一个坚固的表面。


    ## 传感器与你的 Arduino 板板


    引入传感器使得 Arduino 板板能够测量环境中的事物并或对其做出反应。传感器帮助开发板变得有用得多，这也是人们使用它们的主要原因之一。传感器读取数据并将其转换为
    Arduino 可读取的电信号。传感器决定决定读取什么数据——产生的数据取决于传感器本身。


    简单的传感器（如 `光敏电阻`）是由响应环境变化的物质制成的。更复杂的传感器会在设计中集成微控制器。


    在本章中，我们将处理传感器以及如何将其整合到你的 Arduino 设计中。


    传感器通过以下方式向 Arduino 板提供信息：


    * **数字开/关**：这些通常是简单的传感器，如倾斜传感器。当条件变化时，它们会切换引脚开启/关闭。这些将配合 `digitalRead()` 函数使用。

    * **模拟**：它们提供根据传感器经历的情况而变化的信号。这些将配合 `analogRead()` 函数使用。

    * **脉冲宽度**：这些是用于测量距离等内容的传感器。你需要测量脉冲的持续时间，因此需要使用 `pulseIn()` 函数。

    * **串口**：有些传感器使用串口协议来通信数值。它们必须通过串口连接，因此你能够添加的数量是的。


    '
