    # 第 1 章：使用 Arduino IDE


    让我们先看看 Arduino IDE 是什么。从打开 IDE 开始。它看起来像一个非常基础的文字处理器，分为以下区域：


    1. 命令区域

    2. 文本区域

    3. 消息窗口区域


    ## 命令区域


    命令区域是你找到图标、菜单项和标题栏的地方。标题栏显示 sketch（程序）的名称以及你正在运行的 Arduino IDE 版本。


    然后你将在下下文中讨论的菜单项和图标。


    ### 菜单项


    你的操作方式与使用 Microsoft Word 非常相似。点击菜单中的任何项目即可查看可用选项。


    1. **文件 (File)**：在此部分中，你将找到保存、加载和打印 sketch 的按钮。你还可以找到可以参考的示例 sketch。你还可以点击 `Preferences`（首选项）标签在这里设置你的偏好。

    2. **编辑 (Edit)**：在这里你会找到普通命令——搜索、复制和粘贴，就像在 Microsoft Word 中一样。

    3. **程序 (Sketch)**：这包含允许你在将 sketch 上传到板子之前对其验证的功能。它还有导入选项以及将你的 sketch 分类到文件夹的方法。

    4. **工具 (Tools)**：这里包含了许多不同的功能。你需要此部分来指定你拥有的 Arduino 板类型以及你将使用的 USB 端口。

    5. **帮助 (Help)**：这将帮助你学习使用 Arduino 以及你所使用的特定 IDE 版本。


    ### 图标


    图标位于菜单工具栏下方。总共六个。你可以悬停在每个图标上查看名称。这些是图标的内容及其功能：


    1. **验证 (Verify)**：如果你点击此处，你就可以判断 Arduino sketch 是否有效，以及编程中是否没有错误。

    2. **上传 (Upload)**：如果你点击此处，你可以先验证 sketch，然后将其上传到板子上。

    3. **新建 (New)**：这将允许你打开一个新的空白 sketch。它会在不同的窗口中打开。

    4. **保存 (Save)**：你可以使用此按钮保存当前打开的 sketch。如果你还没有命名，系统会要求你为 sketch 命名。

    5. **串口监视器 (Serial Monitor)**：如果你想打开一个可以从 IDE 传输数据到 Arduino 或反之的窗口，这就是该按钮。


    ## 文本区域


    这是你用来创建不同 sketch 的区域。这是你可以输入内容的区域。


    在左上角，你可以看到你正在处理的是哪个 sketch。如果你还没有命名 sketch，系统将默认使用当前日期。


    你像在文本编辑器中一样，在这里输入你的命令。


    ## 消息窗口区域


    这位于屏幕底部。屏幕底部的消息显示屏幕底部的消息。


    IDE 和板子


    这位于屏幕底部。屏幕底部的消息显示屏幕底部的消息。


    在继续之前


    为了表示感谢，我为你准备了一个巨大的惊喜。领取你的专属免费赠品！


    [=>点击此处了解更多信息！](http://eepurl.com/bM)


    过得愉快！

    Steve Gold


    # 第 2 章：创建和保存你的 sketch


    sketch 实际上只是你发给板子的指令。现在你已经对板子的工作原理有了些了解，你无疑想要跳上手开始编写你自己的 sketch。


    你需要记住的是，你需要逐步告诉板子要做什么。在遇到错误或信息时，板子无法自己思考或填补空白。


    ## 项目规划阶段


    1. **清晰的目标**：从清晰地定义你想得到的结果开始。

    2. **写出算法**：在这里你列出实现你的项目所需的指令。这是一组从开始到结束的逐步指令集。

    3. **选择你正在使用的硬件**：硬件需要连接到板子上，你需要提前考虑这一点。

    4. **你的 sketch**：现在你真的可以开始编写 sketch 了。在此过程中，你将给 Arduino 清晰且简单的指令，告诉它必须做什么。

    5. **连接一切**：现在你可以将电路和硬件接线到板子上。

    6. **测试 Bug**：项目是否按预期方式工作？如果没有，你能发现哪些错误？再次一步一步地处理所有事情。这可能是 sketch 或算法的问题，也可能是连接方式的问题，甚至可能是组件存在故障。


    ## 如何编写你自己的 sketch


    如果你按部就班的方法，创建一个基础 sketch 是很容易的。sketch 将按照命令出现的顺序运行每个命令，因此请确保你的步骤是按逻辑顺序排列的。


    在现实世界找一个类比——处理 sketch 的方式就像教导一个小孩子去给你拿外套一样。他们什么都不知道。


    你必须告诉他们外套在哪里。你必须告诉他们去拿外套。你必须告诉他们需要多长时间。你必须告诉他们把外套递给你，等等。


