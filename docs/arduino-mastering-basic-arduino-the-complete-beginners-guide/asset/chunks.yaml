  trans: "\n\n首先，你必须使用 USB 线将你的 Arduino 开发板连接到计算机。当你连接好时，你可能会发现旁边标有“ON”标签的 LED 开始剧烈闪烁；这是存储在开发板芯片中的默认程序。你启动\
    \ Arduino 时要执行的操作是覆盖这个默认程序，让 LED 以每 2 秒一次的间隔缓慢闪烁。\n\n## 安装驱动程序\n\n如果你是第一次在 Windows\
    \ 7、Vista 或 XP 系统上使用 Arduino 开发板，则需要执行此步骤。如果你使用的是其他操作系统，可以跳过本节。\n\n1. 插入开发板后，Windows\
    \ 将启动驱动程序安装过程。然而，在持续了片刻之后，该过程将会失败。\n2. 接下来你需要点击“开始”菜单，然后点击打开“控制面板”。\n3. 导航到控制面板并进入“系统和安全”。点击“系统”。\n\
    4. 打开“系统”窗口后，点击打开“设备管理器”。\n5. 查找 `端口 (COM & LPT)`。在这里，你应该能看到一个名为 `Arduino UNO\
    \ (COMxx)` 的打开端口。但是，如果由于某种原因没有 `COM & LPT` ，请查看`其他设备` 并搜索 `未知设备`。\n6. 接下来，右键点击\
    \ `Arduino UNO (COmxx)` 或 `未知设备` 端口，选择“更新驱动程序”选项。\n7. 选择“浏览我的电脑以查找驱动程序”选项。\n8.\
    \ 最后，找到并选择名为 `arduino.inf` 的驱动文件，它可以在 Arduino 下载包的 Drivers 文件夹中找到（注意：不在 FTDI USB\
    \ 驱动子目录下）。请注意，如果你使用的是旧版本的 IDE（1.0.3 或更高版本），你需要选择名为 `Arduino UNO.inf` 的 Uno 驱动文件。\n\
    9. 从这里，Windows 将完成驱动程序的安装。\n\n## 启动与 Sketch\n\n一旦正确安装了 Arduino IDE，你现在准备好用第一个程序测试你的开发板了。在在此之前，你需要了解一些为\
    \ Arduino 编写代码的知识。代码被称为 sketch（程序），用 C++ 编写。\n\n每个 sketch 都需要两个不返回任何值的 `void`\
    \ 类型函数：`setup()` 和 `loop()`。`setup()` 方法在 Arduino 开发板上电后运行一次，之后 `loop()` 方法会持续运行。`setup()`\
    \ 是你进行任何初始化步骤的地方，而 `loop()` 用于运行你想要反复执行的代码。\n\n一个基础的 sketch 骨架看起来如下：\n\n| `void\
    \ setup(){ } void loop(){ }` |\n\n现在，让我们尝试你的第一个程序吧：\n\n1. 确保你的开发板已插入，并启动 Arduino\
    \ 应用程序。\n2. 打开 Blink 示例 sketch。只需进入：`File > Examples > 1.Basics > Blink`。\n3.\
    \ 通过进入：`Tools > Board > 开发板类型` 选择你正在使用的 Arduino 开发板类型。\n4. 通过进入：`Tools > Port\
    \ > COMxx` 选择你的 Arduino 连接的串口/COM 端口。\n\n如果你不确定串口设备中哪一个是你的 Arduino 开发板，请查看可用端口，然后拔掉你的\
    \ Arduino 并再次检查它们。它应该是你拔掉开发板后消失的那个。\n\n## 上传并让它闪烁！\n\n在连接好 Arduino 开发板并打开 Blink\
    \ sketch 后，点击“上传”（Upload）按钮。等待几秒钟；你应该看到开发板上的 RX 和 TX LED 在程序上传时闪闪烁。如果上传成功，你将在\
    \ Blink sketch 的状态栏中看到 `Done Uploading` 消息。\n\n如果整个过程执行正确，橙色的“ON” LED 应该会缓慢闪烁。恭喜！你已成功编写了第一个\
    \ Arduino 程序。\n\n## 但它不起作用！\n\n如果你遵循了上述所有步骤，但无法将 sketch 上传到 Arduino 运行，可能是由于其中一个过程出现了问题。尝试运行这些故障排除措施：\n\
    \n1. 确保你在 `Tools > Board` 菜单下选择了正确的开发板。如果你选择了 UNO 以外的开发板（如示例所示），请检查板上的 IC。例如，较新的\
    \ Arduino Duemilanove 开发板带有 `ATmega328`，而旧的带有 `ATmega168`。因此，请确保你选择了正确的选项。\n2.\
    \ 检查 `Tools > Serial Port` 菜单中是否选择了正确的端口。\n3. 在连接开发板的情况下，检查 Arduino IDE 中 `Tools\
    \ > Serial Port` 菜单下你的开发板的驱动程序是否已正确安装。应该多出一个在未插入开发板时不存在的项目。\n\n## 第一个任务：点亮 LED！\n\
    \n成功激活你的 Arduino 后，让我们尝试用它做更多事情。以下是一个适合电路完全初学者的常见学习项目。对于此任务，你需要一个 LED 和一个已经启动的\
    \ Arduino（按照之前的说明）。\n\n1. 插入你的 Arduino。\n2. 打开另一个示例 sketch：`File > Examples >\
    \ Basics > BareMinimum`。\n3. 将 LED 的正极（长脚）连接到 `13`，将阴极（短脚）连接到 `GND`。\n4. 在 sketch\
    \ 的 `setup()` 部分添加代码：`pinMode(13, OUTPUT);`。这是配置开发板运行一次的命令。\n5. 在 `loop()` 部分添加：`digitalWrite(13,\
    \ HIGH);`。这将 `13` 设置为高电平（5）。\n\n完成后，你的 sketch 看起来像这样：\n\n```cpp\nvoid setup(){\n\
    \  pinMode(13, OUTPUT);\n}\nvoid loop(){\n  digitalWrite(13, HIGH);\n}\n```\n\n"
