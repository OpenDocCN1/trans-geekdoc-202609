    \ can simply be done with a `USB` cable, unlike previous programmable circuit\
    \ boards where a separate piece of hardware has to be used. It is also a plus\
    \ point that `Arduino` boards are relatively inexpensive compared to other micro-controller\
    \ platforms, with some pre-assembled modules costing less than $50. If those perks\
    \ are not enough, here are some more reasons why `Arduino` is the platform to\
    \ go for:\n\n1. Cross-platform – `Arduino`’s `IDE` runs on `Windows`, `Macintosh\
    \ OSX`, and `Linux` operating systems, whereas most micro-controller systems are\
    \ only compatible with `Windows`.\n2. Simple programming environment – The `Arduino\
    \ IDE` uses a simplified version of `C++`, making it easier for beginner to learn\
    \ how to program, yet flexible enough for advance users to get creative and ambitious\
    \ with.\n3. Open source and extensible hardware – `Arduino` board plans are published\
    \ under a Creative Common license, allowing circuit designers to create their\
    \ own version of the module, extending it and improving upon it.\n4. Open source\
    \ and extensible software – The `Arduino IDE` is published as open source tools\
    \ that experienced programmers can expand on, through `C++` libraries. You can\
    \ also learn the `AVR-C` programming language from `Arduino`, just as you can\
    \ also add `AVR-C` code directly into `Arduino` programs.\n5. Backed by a supportive\
    \ community – If you are absolutely new to the platform and don’t know where to\
    \ begin, there is a wealth of information to be found online due to the popularity\
    \ of `Arduino`. You will never run out of resources to learn from, and you can\
    \ even find pre-coded projects to work on right away (See Chapter 5 for `Arduino`\
    \ resources).\n\n## What can Arduino do for You?\n\n`Arduino` was designed with\
    \ the creative and innovative in mind, regardless of experience level. Artists,\
    \ designers, electricians, engineers, programmers and science enthusiasts can\
    \ use it to create interactive objects and environments. Among the things `Arduino`\
    \ can interact with include motors, speakers, `LEDs`, `GPS` units, cameras, `TVs`,\
    \ `smart-phones and even the internet.\n\nWith `Arduino`, one can build low cost\
    \ scientific instruments, do programming for robotics, build interactive prototypes\
    \ of architectural designs and create installations for musical instruments to\
    \ experiment with sound, build new video game hardware – and this is just the\
    \ tip of the iceberg! So, whether your project entails building a robot, a heating\
    \ blanket, a festive lighting display or a fortune-telling machine, `Arduino`\
    \ can serve as a base for your electronic projects.\n\n## Before You Continue...\n\
    \nAs a token of appreciation, I’ve included a great, surprise for you\n\n### Claim\
    \ Your Exclusive Free Gift!\n\nFor a limited time I’ve included access to a FREE\
    \ book which is ONLY available to my readers and can’t be found anywhere else.\
    \ Don’t miss your chance to get it.\n\n## Chapter 2: Getting Started with Arduino\n\
    \nAs the platform is ever expanding, what you need to know is:\n\n### Anatomy\
    \ of an Arduino Board\n\nBefore you start around, you need to know some features.\
    \ The main IC differs from board to board:\n\n#### USB and Barrel Jack\nAlmost\
    \ all boards have `USB` connection and a `barrel jack`. \n\n#### Pins\nThe pins\
    \ are where you construct circuits. Here is what you will normally find:\n\n*\
    \ `GND`: Short for `Ground`, these pins are used to ground your circuit.\n* `5V`\
    \ and `3.3V`: These pins supply `5 Volts` and `3.3 Volts`, respectively.\n* `Analog`:\
    \ You can identify this row of pins under the `Analog In` label. They are used\
    \ for reading signals from sensors, and convert those signals into digital values.\n\
    * `Digital`: Across from the analog pins, under the `Digital` label, are the pins\
    \ to be used for digital input and output. For example, when a button is pressed\
    \ (input), so that an `LED` lights up (output).\n* `PWM`: In a lot of boards,\
    \ there is the `PWM` label next to `Digital`. It means that the pins can be used\
    \ as normal digital pins, and also for a type of signal called Pulse-Width Modulation.\n\
    * `AREF`: A short for `Analog Reference`, this is the pin which can be used to\
    \ set an external voltage as the upper limit for the analog pins (between 0 and\
    \ 5 Volts), although it is mostly left alone.\n\n#### Reset button\nThis button\
    \ is self-explanatory; pushing it will connect the rest pin to ground, and restart\
    \ any code loaded onto the board. This does not, however, function to reset everything\
    \ to a clean slate and wipe away any problems.\n\n#### Power LED Indicator\nThis\
    \ is a tiny LED that can be identified with the word `ON` next to it. It will\
    \ light up when you plug the board into a power source, and if it doesn’t, it\
    \ means you have to re-check your circuit because something is wrong.\n\n####\
    \ Transmit (TX) and Receive (RX) LEDs\nNot to be confused with the `TX` and `RX`\
    \ markings by the 0 and 1 digital pins, the `LEDs` with these markings will give\
    \ you a visual indication whenever the board is transmitting or receiving data,\
    \ such as when you load a new program onto the board.\n"
