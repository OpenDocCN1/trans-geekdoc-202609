    - 第五章：核心资源与延伸阅读

    - 结论


    作者 Steve Gold 的留言


    ## 第一章：了解 Arduino


    2005 年，意大利的伊里亚交互设计学院（Ivrea Interaction Design Institute）启动了一个项目，创建一个用于构建各种电子项目的开源平台，被称为
    `Arduino`。该平台最初面向几乎完全没有电子或计算机编程背景的学生，但由于其易用性和对初学者的友好，最终在全球范围内获得了普及。


    自诞生以来多年，`Arduino` 吸引了各种经验水平的爱好者、艺术家、程序员、学生甚至黑客的关注和热情。作为一个开源平台，它在多元化用户社区的贡献下不断成长，这些用户不断突破其能力的极限。事实上，`Arduino`
    是成千上万个项目和应用的支柱，从日常物品到复杂的科学设备。


    `Arduino` 平台由两个部分组成：


    1. 硬件 – 一个物理可编程电路板，也称为微控制器。有不同类型的 `Arduino` 开发板（更多内容见于第二章）。


    2. 软件 – 运行在计算机上的集成开发环境 (IDE)，用于编写并将编程代码上传到物理板上。


    为什么选择 Arduino？


