    # Arduino


    ## 入门 Arduino：初学者终极指南


    ### Steve Gold


    ### 序言


    如果你对最简单的技术感到着迷，并经常对日常生活中无处不在的电子设备的工作原理感到好奇，你可能会在对 Arduino 进行实验和制作中发现乐趣。


    在所有开关开启就焕发生机的的核心——闪烁多种色彩的圣诞树灯、在触摸屏设备上打开的应用程序，以及加热食物的微波炉等——核心是一个微控制器，它被编程在激活时执行某些功能。Arduino
    是一个开源平台，由微控制器和编程软件组成。与大多数平台不同，Arduino 面向那些想要在电子领域发挥创造意的非电气专业人士，同时也具有足够的灵活性来适应工程专家。无论你之前在电子和编程方面的知识如何，它旨在易于上手、低成本且易于学习。


    本指南不会让你一夜之间成为 `Arduino` 专家——事实上，没有东西能做到。然而，你将从书中中学到这个惊人的多功能平台的基础知识，你还将有机会亲身体验它的功能。你将在引导下你了解
    `Arduino` 电路板的关键特性、开始工作的技术要求、如何启动你的第一个 `Arduino`、为了应付需要需要的重要术语，以及如何进一步深入。


    ---

