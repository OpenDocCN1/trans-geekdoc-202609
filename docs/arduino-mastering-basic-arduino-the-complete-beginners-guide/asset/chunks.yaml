- raw: "ISBN-10: 1593274483 / ISBN-13: 860-1200651553\n\nThink you’ve already got\
    \ the hang of Arduino and are ready to try some fun projects? This book will get\
    \ you started. You will learn the extensive range of Arduino’s input/output add-ons,\
    \ displays, motors, sensors, indicators, and more. Each project is designed to\
    \ reinforce what you have learnt, and they increase in complexity as you progress.\
    \ So, what can you learn to build? A digital thermometer, battery checker, and\
    \ a GPS logger, to name a few. There are also fun things to learn, like making\
    \ a binary quiz game and an an electronic dice.\n\n# Sew Electric Perfect\n\n\
    by Leah Buechley, Kanjun Qiu and Sonja de Boer\n\nISBN-10: 0989795608 / ISBN-13:\
    \ 978-0989795609\n\nCo-written by the creator of the LilyPad Arduino board, Leah\
    \ Buechley, this book is a hands-on guide that combines crafting, electronics\
    \ and programming to create fun projects. Learn to make interactive toys, light-up\
    \ fashion accessories and many other cool things using the LilyPad Arduino board\
    \ that can be shared with friends and family. This is also a great material for\
    \ teachers to introduce practical electronics to young students.\n\n# Textile\
    \ Messages: Dispatches From the World of E-Textiles and Education\n\nby Leah Buechley,\
    \ Kylie Peppler, Michael Eisenberg and Yasmin Kafai\n\nISBN-10: 143311920X / ISBN-13:\
    \ 978-1433119200\n\nThis book is a handy introduction to e-textiles – soft circuit\
    \ boards that can be used to incorporate electronic elements into clothing and\
    \ furniture. In the Arduino family, the LilyPad board is an e-textile, and this\
    \ is a beginner to intermediate guide that can show you how to make the most of\
    \ your LilyPad. You will be introduced to a collection of tools that enable anyone\
    \ to learn and create with e-textiles, whether you are an educator, hobbyist or\
    \ designer.\n\n# Make: Wearable Electronics: Design, prototype, and wear your\
    \ own interactive garments\n\nby Kate Hartman\n\nISBN-10: 1449336515 / ISBN-13:\
    \ 978-1449336516 \n\nFor those with interest in computing, and fashion designers\
    \ who want to build creative projects that fuse both disciplines, this book is\
    \ a must read. You will be introduced to tools, materials and techniques for making\
    \ interactive electronic circuits, and embedding them in articles of clothing\
    \ with step-by-step instructions. Although the book does not specifically feature\
    \ Arduino projects, it will equip you with knowledge that can be adapted to suit\
    \ the Arduino platform. So, if you ever wanted to build clothing that changes\
    \ color to complement your skin tone, a jacket that shows when the next bus is\
    \ arriving, shoes that dynamically shift your height, and many other cool wearable\
    \ items, now you can!\n\n#  \n\n# Adventures in Arduino\n\nby Becky Stewart\n\n\
    ISBN-10: 1118948475 / ISBN-13: 978-1118948477\n\nIf you know a kid who shows potential\
    \ in electrical engineering and programming, give this book to him or her! Written\
    \ specifically for the budding electrician, ages 11 to 15, this book is an excellent\
    \ Arduino introductory source.\n\nOnline Resources\n\n[https://www.arduino.cc/](https://www.arduino.cc/)\
    \ - The official Arduino website for all your needs and the latest development\
    \ news regarding the platform. Here is where you can find and join the Arduino\
    \ forum to get help and share knowledge with other users from all around the world.\n\
    \n[http://www.cplusplus.com/](http://www.cplusplus.com/) - A comprehensive online\
    \ library for all things C++. You can learn about the history, development and\
    \ the A-to-Zs of the programming language that Arduino runs on. \n\n[http://www.ladyada.net/](http://www.ladyada.net/)\
    \ - A wonderful resource to learn about electronics and circuitry, with nearly\
    \ all its content being open-sourced.\n\nConclusion\n\nCongratulations on completing\
    \ the Arduino basic apprenticeship and successfully navigating your first Arduino\
    \ project! In this book, I hope I have managed to give you all the information\
    \ you need to feel confident in your ability to move forward and try some more\
    \ difficult Arduino projects. Good luck!\n\nDon’t forget to scroll down for your\
    \ FREE GIFTS and for more info on my other books!\n\nA message from the author,\
    \ Steve Gold\n\nTo show my appreciation for your support, Id like to offer you\
    \ a couple of exclusive free gifts:\n\nFREE BONUS NUMBER 1!\n\nAs a free bonus,\
    \ I’ve included a preview of one of my other best-selling books directly after\
    \ this section. Enjoy!\n\nFREE BONUS NUMBER 2!\n\nFor a limited time I’ve also\
    \ included access to a FREE book which is ONLY available to my readers and can’t\
    \ be found anywhere else. Don’t miss your chance to get it, along with exclusive\
    \ access to more free books and exclusive discounts in the future! Simply follow\
    \ the link below for instant access:\n\n[\\=>Click HERE to learn more! <=](http://eepurl.com/bMxlLr)\n\
    \nALSO…\n\nBe sure to check out my other books. Scroll to the back of this book\
    \ for a list of other books written by me, along with download links.\n\nThank\
    \ you again for your support.\n\nSteve Gold\n\nBook Two Starts Here￼\n\n![Arduino\
    \ 2 Thumbnail.png](images/00002.jpeg)\n\nArduino\n\nTaking The Next Step With\
    \ Arduino: The Ultimate Beginner’s Guide - Part 2\n\nSteve Gold\n\nTable of Contents\n\
    \nIntroduction\n\nChapter 1: Working with the Arduino IDE\n\nThe Command Area\n\
    \nMenu Items\n\nThe Icons\n\nThe Text Area\n\nThe Message Window Area\n\nThe IDE\
    \ and the Board\n\nChapter 2: Creating and Saving Your Own Sketches\n\nProject\
    \ Planning Stages\n\nHow to Write Your Own Sketch\n\nComments\n\nThe Setup Function\n\
    \nThe Loop Function\n\nNotes on Saving Your Sketch\n\nVerifying Your Sketch\n\n\
    Getting Your Sketch to the Board and Running It\n\nChanging Sketches\n\nChapter\
    \ 3: Signals and the System\n\nAnalog Pins and Digital Pins on Your Board\n\n\
    Chapter 4: Incorporating Sensors\n\nSensing Movement\n\nChasing the Light\n\n\
    How to Detect Motion\n\nMeasuring Distance\n\nChapter 5: The Different Types of\
    \ Outputs\n\nDigital Output\n\nAnalog Output\n\nVarying the Levels of Light\n\n\
    Getting to Know Your LED\n\nMaximum Pin Current\n\nPractical Applications for\
    \ LEDs\n\nA Series Resistor\n\nAudio Output\n\nChapter 6: Breadboarding\n\nGetting\
    \ Grounded\n\nWhen You Need Jumper Wires\n\nChapter 7: Build Your Own Simple Robot\n\
    \nGetting the Support in Place\n\nAttaching the Arduino and the Breadboard\n\n\
    Your Robot’s Chariot Awaits\n\nWire Up Your Servo\n\nPlacing the Sensor\n\nI’ve\
    \ Got the Power\n\nKilling Your Robot\n\nConclusion\n\nA message from the author\n\
    \nIntroduction\n\nSo, you know a bit about Arduino already and you want to learn\
    \ more? You’ve played around with your first board and made the LED blink and\
    \ you’re now ready for something a little bit more advanced?\n\nThis book is for\
    \ someone who already knows something about Arduino and how it works. It is not\
    \ written for a beginner. It is for someone who wants to know more about creating\
    \ their own sketches, using the Arduino IDE and getting to grips with the various\
    \ types of hardware that you can add on.\n\nThis book goes through all this and\
    \ a lot more. We will work through this carefully and you will be given practical\
    \ advice and real world examples that you can draw upon.\n\nAnd, at the end of\
    \ the it all, you get to build a robot!\n\nWill you become an Arduino expert after\
    \ reading this book? Not quite – to do that would take reading through a few very\
    \ long books.\n\nWill you be able to fake being an expert? With your own home-made\
    \ robot at your side, what do you think?\n\nWill you get the grounding you need\
    \ to go on and learn more? What you will learn from this book are skills that\
    \ can be built on at a later stage. With Arduino, once you understand how to connect\
    \ up the circuits properly and how to program your creations, the sky really is\
    \ the limit.\n\nP.S. As a token of my appreciation, I have included a free gift\
    \ for you; no catch, no charge. Simply [click here](http://eepurl.com/bMxlLr)\
    \ for instant access.\n\n© Copyright 2017 by Eddington Publishing - All rights\
    \ reserved."
