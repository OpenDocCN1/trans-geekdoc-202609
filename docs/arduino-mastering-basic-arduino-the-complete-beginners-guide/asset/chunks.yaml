- raw: '1.  An area free of snacks and drinks. It is tempting to want to eat at your
    work area but, for the most part, it is better to take a break when you need a
    snack. Spilling food or drinks on the project you are working on can be disastrous.


    1.  Make it possible to keep everything neat and tidy. That means having enough
    drawers, etc. so that you can store your parts properly. Having an untidy workspace
    is not conducive to efficiently working on projects. If you have to waste time
    searching for components, you are likely to lose your train of thought and will
    have to take even longer on your projects.


    Tools to Consider


    There are some basic tools that will make your life a lot easier. Here is a list
    of the tools to consider getting before you embark on your Arduino projects:


    1.  A multimeter: This is not always something that you will see listed in your
    Arduino projects but it is something that will make your experience a lot less
    frustrating. A multimeter allows you to measure a range of things in an electrical
    circuit such as current voltage, whether the circuit is complete, etc. With the
    multimeter, you can test whether or not each of the electronic components is working
    as it should or not. It is also extremely useful when it comes to troubleshooting
    when something is not working as it should.


    1.  Jumper wires and a few breadboards: Again, these are not always strictly necessary
    and not called for in all projects. A breadboard, however, can make it a lot easier
    to test out your proposed layout and see if it works without having to go through
    all the trouble of soldering the wires n place. A breadboard is also useful in
    keeping your projects neat and tidy and makes it simpler to create the right connections.
    In addition to the breadboard, you will need jumper wires – these are what make
    the connections on the breadboard possible. You will need to find solid core jumpers
    to use with the breadboard and do look for wires that can handle the kind of voltage
    that your project will be generating.


    1.  A soldering iron: The breadboard is not suitable for all projects and, in
    those cases, you will need to be able to solder your components in place. Should
    you feel that you need to include buttons in your project, for example, you will
    want to solder the wires for them in place. Even if you are going to incorporate
    the breadboard into your project permanently, you might still need to solder components
    into place. Soldering irons are inexpensive and should form part of your toolkit.
    There is a caution here though – they get extremely hot. Always make sure that
    you have somewhere safe to support them while they are heating up and always make
    sure that you switch them off when you are done with them. Keeping a small burn
    kit in your First Aid kit is essential if you are going to be working with a soldering
    iron.


    1.  Something to supply power: The Arduino does have a little bit of a charge
    and this will be sufficient to charge very small projects. In many cases, you
    need to have a separate power supply.


    1.  A set of screwdrivers: You will be working with a range of components of varying
    sizes and descriptions. You will need a variety of star and flathead screwdrivers.


    1.  Helping Hands: These are a little clamp that has a couple of alligator clips
    attached to connect to the board you are working with. They hold the board up
    and steady so that it is easier to work with. Some have a magnifying glass built
    into their design as well. These are hardly ever referred to in Arduino projects
    but are an extremely helpful device.


    1.  Wire Strippers: These will be used to strip the wires of insulation and to
    cut different wires. There are tons of options on the market, ranging from cheap
    to very expensive. Aim for something in the middle – these will be used a lot
    and will last you a long time. If you choose one of the cheapest pairs, they are
    bound to be more trouble than they are worth.


    1.  Needle-Nose pliers: These are a great help when you need to work with fine
    wires and small objects. Have a couple of different sizes to handle a variety
    of different projects.


    1.  Angle Side Cutters: These are useful for those tougher to reach spots and
    good to cut leads or wire leading to your components.


    1.  A sharp craft knife and spare blades: There are going to be times when you
    need to cut through materials that you are using to house your projects in – like
    cardboard, etc. You need a sharp craft knife to help you in these instances. Always
    make sure that you have at least one spare blade so that you can replace worn
    blades immediately. You will know that your blade needs replacing when it starts
    to drag on the surface that you are cutting or makes uneven cuts. Also keep some
    Band-aids in your First-Aid box and take care when cutting with the blades. They
    can be very sharp.


    1.  A box cutter: A craft knife won’t be able to handle heavier materials so keep
    a box cutter and replacement blades on hand as well. The same safety precautions
    need to be applied.


    1.  A self-healing mat: This will be used in conjunction with the craft knife.
    It protects your desk or work table and gives you a firm surface to cut on.


    1.  A permanent marker, pencil and scrap paper: The permanent marker is for when
    you need to make permanent marks on something. The pencil and scrap paper are
    so that you can quickly sketch out your new projects – planning them on paper
    first helps you to think out where you will put everything and helps you to work
    out what the best design is. These designs don’t have to be draftsman quality
    but just a rough idea of how the components will fit together before you start
    on the actual construction. If you would prefer to make precision drawings, graph
    paper can come in very usefully.


    Sensors and Your Arduino Board


    Incorporating sensors makes it possible for the Arduino board to measure things
    in the it’s environment and/ or respond to them. Sensors help make the Arduino
    boards a lot more useful and this is one of the primary reasons people use the
    boards in the first place – to make simple machines to measure input.


    The sensors read the data they are meant to measure and convert this data into
    an electrical signal that the Arduino is able to read. The sensor itself will
    determine what data is read and produced - the data produced is only as good as
    the sensor.


    A simpler sensor, like a photoresistor, is made of a substance that is designed
    to respond to changes in the environment.


    More complex sensors will incorporate a microcontroller into their design.


    In this chapter, we will deal with using sensors and how you can incorporate them
    into your Arduino designs.


    Sensors provide the Arduino board with information in one of the following ways:


    1.  Digital On/ Off: These tend to be more simple sensors, like tilt sensors.
    When conditions change, they will switch the pin on/ off. There are no other variables.
    These will work in conjunction with the digitRead function.


    1.  Analog: These provide a signal that varies according the conditions that the
    sensor is experiencing. You could, for example, have a sensor that measures light
    conditions or sound levels. These will work in conjunction with the analogRead
    function.


    1.  Pulse width: These are sensors that can measure things such as distance travelled.
    You would need to measure the duration of the pulse related and so would need
    to use the pulsein function.


    1.  Serial: There are sensors that use a serial protocol to communicate values.
    These must be connected through the serial port and so you are limited in terms
    of how many you can add. You can add additional ports for this but that is beyond
    the scope of this book.'
