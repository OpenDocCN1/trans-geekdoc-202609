    \ \n\n### LED\nThe acronym for Light-Emitting Diode, a two-lead semiconductor\
    \ light source. LEDs have many advantages over other light sources, including\
    \ smaller sizes, longer lifespan and lower energy consumption. On the Arduino\
    \ board, you will notice some LEDs that indicate when the board is powered and\
    \ codes are uploaded.\n\n### Micro-controller\nA computer present in a single\
