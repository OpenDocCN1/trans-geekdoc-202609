- raw: "Practically anyone can use Arduino. Experts are sure to have fun with building\
    \ projects and sharing ideas with other users at online communities. For those\
    \ with no experience with circuits and micro-controller programming, the platform\
    \ is excellent for learning and experimenting. However, it is recommended that\
    \ before exploring the wonders of Arduino, you should at least have a firm understanding\
    \ of these fundamental concepts:\n\n1.  The basics of electricity and circuitry\n\
    \n1.  Voltage, current, resistance and Ohm’s law\n\n1.  Polarity\n\n1.  Integrated\
    \ circuits (ICs)\n\n1.  Digital logic\n\n1.  Analog versus Digital\n\n1.  Basic\
    \ computer programming\n\nWhat makes Arduino a favorite among amateurs and experts\
    \ alike is that, compared to other platforms and systems, it simplifies the process\
    \ of working with micro-controllers. For a start, loading new codes to the board\
    \ can simply be done with a USB cable, unlike previous programmable circuit boards\
    \ where a separate piece of hardware has to be used. It is also a plus point that\
    \ Arduino boards are relatively inexpensive compared to other micro-controller\
    \ platforms, with some pre-assembled modules costing less than $50. If those perks\
    \ are not enough, here are some more reasons why Arduino is the platform to go\
    \ for:\n\n1.  Cross-platform – Arduino’s IDE runs on Windows, Macintosh OSX, and\
    \ Linux operating systems, whereas most micro-controller systems are only compatible\
    \ with Windows.\n\n1.  Simple programming environment – The Arduino IDE uses a\
    \ simplified version of C++, making it easier for beginner to learn how to program,\
    \ yet flexible enough for advance users to get creative and ambitious with.\n\n\
    1.  Open source and extensible hardware – Arduino board plans are published under\
    \ a Creative Common license, allowing circuit designers to create their own version\
    \ of the module, extending it and improving upon it.\n\n1.  Open source and extensible\
    \ software – The Arduino IDE is published as open source tools that experienced\
    \ programmers can expand on, through C++ libraries. You can also learn the AVR-C\
    \ programming language from Arduino, just as you can also add AVR-C code directly\
    \ into Arduino programs.\n\n1.  Backed by a supportive community – If you are\
    \ absolutely new to the platform and don’t know where to begin, there is a wealth\
    \ of information to be found online due to the popularity of Arduino. You will\
    \ never run out of resources to learn from, and you can even find pre-coded projects\
    \ to work on right away (See Chapter 5 for Arduino resources).\n\nWhat can Arduino\
    \ do for You?\n\nArduino was designed with the creative and innovative in mind,\
    \ regardless of experience level. Artists, designers, electricians, engineers,\
    \ programmers and science enthusiasts can use it to create interactive objects\
    \ and environments. Among the things Arduino can interact with include motors,\
    \ speakers, LEDs, GPS units, cameras, TVs, smart-phones and even the internet.\n\
    \nWith Arduino, one can build low cost scientific instruments, do programming\
    \ for robotics, build interactive prototypes of architectural designs and create\
    \ installations for musical instruments to experiment with sound, build new video\
    \ game hardware – and this is just the tip of the iceberg! So, whether your project\
    \ entails building a robot, a heating blanket, a festive lighting display or a\
    \ fortune-telling machine, Arduino can serve as a base for your electronic projects.\n\
    \nBefore You Continue...\n\nAs a token of appreciation, I’ve included a great,\
    \ surprise for you\n\nClaim Your Exclusive Free Gift!\n\nFor a limited time I’ve\
    \ included access to a FREE book which is ONLY available to my readers and can’t\
    \ be found anywhere else. Don’t miss your chance to get it, along with exclusive\
    \ access to more free books and exclusive discounts in the future! Simply follow\
    \ the link below for instant access:\n\n[\\=>Click HERE to learn more! <=](http://eepurl.com/bMxlLr)\n\
    \nEnjoy!\n\nSteve Gold\n\nChapter 2\n\nGetting Started with Arduino\n\nAs the\
    \ Arduino platform is ever expanding, continuous learning is necessary as there\
    \ is always something new to discover. What you will learn in this chapter is\
    \ the bare minimum you need to know in order to get your feet wet. You will be\
    \ introduced to the basic Arduino components, what you will need and how to set\
    \ them up. Obviously, you are going to need the two essentials: an Arduino board\
    \ and the software installed (available free for download on the official Arduino\
    \ website).\n\nAnatomy of an Arduino Board\n\nBefore you start shopping around\
    \ for hardware, you need to know some basics about Arduino boards and their features.\
    \ There are several types of Arduino boards available for purchase, each with\
    \ different capabilities. Although they may differ in look and capabilities, you\
    \ will find most boards have the majority of these components in common:\n\n1.\
    \  USB and Barrel Jack – Every board will have a means for it to be connected\
    \ to a power source. Almost all Arduino boards come with USB connection, since\
    \ this is how you will be uploading codes onto them. You can also connect to a\
    \ wall power supply via the barrel jack. \n\n2\\. Pins – The boards’ pins are\
    \ where you construct circuits by connecting wires. There are several types of\
    \ pins on Arduino boards, each meant for a specific functions. Here is what you\
    \ will normally find:\n\n1.  GND: Short for Ground, these pins are used to ground\
    \ your circuit.\n\n1.  5V and 3.3V: These pins supply 5 Volts and 3.3 Volts of\
    \ power, respectively.\n\n1.  Analog: You can identify this row of pins under\
    \ the ‘Analog In’ label. They are used for reading signals from analog sensors,\
    \ and convert those signals into digital values.\n\n1.  Digital: Across from the\
    \ analog pins, under the ‘Digital’ label, are the pins to be used for digital\
    \ input and output. For example, telling when a button is pressed (input), so\
    \ that an LED lights up (output).\n\n1.  PWM: In a lot of Arduino boards, there\
    \ is the label (PWM~) next to ‘Digital’. It means that the pins can be used as\
    \ normal digital pins, and also for a type of signal called Pulse-Width Modulation\
    \ (see the glossary of terms in Chapter 4 for explanation).\n\n1.  AREF: A short\
    \ form for Analog Reference, this is the pin which can be used to set an external\
    \ voltage as the upper limit for the analog pins (between 0 and 5 Volts), although\
    \ it is mostly left alone.\n\n3\\. Reset button – This button is self-explanatory;\
    \ pushing it will connect the rest pin to ground, and restart any code loaded\
    \ onto the board. This is useful for testing your programmed codes multiple times.\
    \ It does not, however, functions to reset everything to a clean slate and wipe\
    \ away any problems.\n\n4\\. Power LED Indicator – This is a tiny LED that can\
    \ be identified with the word ‘ON’ next to it. It will light up when you plug\
    \ the board into a power source, and if it doesn’t, it means you have to re-check\
    \ your circuit because something is wrong.\n\n5\\. Transmit (TX) and Receive (RX)\
    \ LEDs – Not to be confused with the TX and RX markings by the 0 and 1 digital\
    \ pins, the LEDs with these markings will give you a visual indication whenever\
    \ the board is transmitting or receiving data, such as when you load a new program\
    \ onto the board.\n\n6\\. Main Integrated Circuit (IC) – This is the black piece\
    \ with metal legs that is attached to every board. It is basically the brains\
    \ of an Arduino board. The main IC differs from board to board, though most are\
    \ from the ATmega line of IC’s by the ATMEL company. It is important to know the\
    \ IC and board type before loading up a new program from the Arduino IDE. You\
    \ can usually find this information written on the top side of the IC."
