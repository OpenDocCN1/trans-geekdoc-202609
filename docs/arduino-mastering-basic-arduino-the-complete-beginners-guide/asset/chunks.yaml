    \n所以，它看起来像这样：\n\n```cpp\n/*\nClock Sketch by Name Created January 2017\nMade to\
    \ tell the time\n*/\n```\n\n现在进入“文件（File）”并点击“另存为（Save As）”。选择你要为程序起的名字并点击“确定（OK）”按钮。\n\
    \nArduino 程序扩展名为 `.ino`，但你不需要担心这一点——这会自动完成。\n\n一旦程序保存，你就可以在程序集（Sketchbook）中找到它并再次调用。\n\
