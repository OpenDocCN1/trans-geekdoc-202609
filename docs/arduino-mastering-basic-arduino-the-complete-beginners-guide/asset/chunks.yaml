- raw: 'Lay out the two servos and put them back to back lengthwise, with the shafts
    facing in opposite directions. Make sure that they are lined up properly.


    The servos should be laid on top of the battery pack, so that one shaft is on
    either side of the pack. You need to align them with the edge of the battery pack
    that has the wire leading out of it and with the wires of the servos hanging clear
    of the pack.


    So, if you are looking at it, the servo wires will be at the top edge of the battery
    pack, with the servos aligned to the same edge. The battery pack wire will be
    coming out of the right-hand side at the bottom. They will cover around about
    half of the battery pack and you will have space to put the breadboard next to
    the servos.


    When you have the alignment right, secure with double-sided tape.


    Make sure that the servos are firmly in place


    Your robot’s chassis is now done.


    Attaching the Arduino and the Breadboard


    Attaching the breadboard comes next. Fit it in place next to the servos so that
    it is snugly aligned with them. Tape the breadboard down using adhesive tape.


    The Arduino goes on next – it is going to be taped down directly on top of the
    servos. Try, as far as possible, to avoid too much overhang when it comes to the
    breadboard.


    Your Robot’s Chariot Awaits


    Now you get to make your robot mobile. Fit the wheels onto the shafts of the servos.
    It is going to require a bit of elbow grease – they are meant to fit on very snugly.


    You now need to add a caster so that the breadboard section doesn’t drag on the
    ground. The caster should fit neatly under the breadboard, ensuring that the robot
    has enough clearance in front.


    If the castors are not high enough, you can make yourself a spacer. This is easy
    to do – all you need is some scrap wood to make up the difference. Then attach
    the wood to the breadboard and attach the caster to the wood.


    Wire Up Your Servo


    You will need to find the long break away header. Cut away two of the 3-pin sections.
    Make sure that the plastic keeping the wires is properly centered. If not, you
    can gently move the plastic to rectify this.


    Plug the headers into your breadboard, in the row directly under the halfway point
    of the board, all the way over to the left-hand side. Place them in the same row
    but separate them by a hole. You can now connect up the servo wires to the headers.
    Make sure that the black wires are on the left-hand side when connecting them.


    Pick up the slack in the cord and fold it neatly. Use a small cable tie to keep
    the cord neat and out of the way.


    Now you need will need to use the jumpers to connect the headers to the Arduino
    and to the rails on the breadboard.


    Place a jumper that extends from the base of the header that the red wire is connected
    to, to the red rail on your board.


    Place a jumper that extends from the base of the header that the black wire is
    connected to, to the blue rail of the board.


    You now need to connect the Arduino. You will need longer jumpers to do this.
    Place a jumper that extends from the base of the header that the white wire is
    connected to, to the Arduino’s pins 12 and 13.


    Placing the Sensor


    Take the ultrasonic sensor and put in the center front of your robot. You are
    going to plug it into the body of your breadboard, not either of the rails.


    Use jumpers to wire the sensor’s VCC pin. Connect it to the red rail closest to
    it. This will power the sensor.


    Use jumpers to connect the sensor’s GND pin to the blue rail of breadboard. This
    will ground it.


    The last step is to get a longer jumper and connect the sensor’s Trig to pin 8
    on your Arduino and connect the sensor’s Echo to pin 9 on your Arduino.


    I’ve Got the Power


    It is not a good idea to use the Arduino’s pin to power the servos because they
    draw too much power. You can overcome this by attaching them directly to a battery
    pack – you can piggyback them on the same pack that you use for the Arduino or
    a new pack altogether.


    The servos will require four AA batteries. To make sure that you attach the cables
    correctly, you need to put the robot on its side with the power cord from the
    battery pack at the bottom. In other words, if the robot is facing forward, place
    it on its right side.


    Find the spring that is second from the left and attach the red wire to it. Find
    the last spring on the right and attach the black wire to it.


    Now take the two wires that you just connected to the battery springs and plug
    them into the back power rail of your servo.


    Take one of the black jumpers and connect one end to your Arduino’s GND pin and
    the other to the breadboard’s back GND rail.


    Now connect the breadboards GND rails using a jumper. (You are not to do this
    with the red rails, though.)


    Get a red jumper and wire it to the 5V pin on your Arduino board. Connect the
    other end to the breadboard’s front red rail.


    Killing Your Robot


    If you don’t add a kill switch, your robot is just going to keep on going until
    the batteries run flat.


    Get out the push button switch and position it across the gap that defines the
    center of the breadboard.


    Connect one half of the switch to the power rail on the front. Connect the other
    side to the GND rail using a 10kΩ resistor.


    Connect the side of the switch that has the resistor attached to your Arduino
    board’s number 2 pin.


    Now you are going to want to write a sketch that links each of the components
    and tells Arduino what to do with each.


    Writing the code to go along with the robot is likely to take longer than actually
    putting it together.


    You can download the sketch to run the robot from at [www.foxytronics.com/files/file/36-arduino-maze-solving-robot-code/](http://www.foxytronics.com/files/file/36-arduino-maze-solving-robot-code/)
    – it was created by Nathan House to work with the Funduino UNO Robotics Kit. If
    you have used a different kit, you can use this as an example for the kind of
    coding you will need to do.


    Conclusion


    There we go, all done. I hope you enjoyed this next step in your Arduino journey.
    I know that this is still only scratching the surface of what you can do with
    Arduino but you now have some more of the building blocks that you can learn from.


    Arduino is fun and it was always meant to be. It is there to make it easier to
    get your wildest ideas from the drawing board stage to a physical prototype.


    Knowing the basics of Arduino, like how to use, change and write your own sketches
    makes it possible for you to get your projects to work exactly right.


    Knowing techniques like breadboarding makes this process a whole lot easier for
    you.


    All in all, creating is about exploring, about pushing the limits of what you
    know and can do. Arduino is a great tool to help you do all those things.


    Good luck with it!


    Don’t forget to scroll down for your FREE GIFTS and for more info on my other
    books!


    A message from the author, Steve Gold


    To show my appreciation for your support, Id like to offer you a couple of exclusive
    free gifts:


    FREE BONUS NUMBER 1!


    As a free bonus, I’ve included a preview of one of my other best-selling books
    directly after this section. Enjoy!


    FREE BONUS NUMBER 2!


    For a limited time I’ve also included access to a FREE book which is ONLY available
    to my readers and can’t be found anywhere else. Don’t miss your chance to get
    it, along with exclusive access to more free books and exclusive discounts in
    the future! Simply follow the link below for instant access:


    [\=>Click HERE to learn more! <=](http://eepurl.com/bMxlLr)


    ALSO…


    Be sure to check out my other books. Scroll to the back of this book for a list
    of other books written by me, along with download links.


    Thank you again for your support.


    Steve Gold


    ##### FREE BONUS!: Preview Of “Elon Musk - The Biography of a Modern Day Renaissance
    Man”!


