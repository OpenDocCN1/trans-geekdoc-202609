    All that you are doing here is ensuring that Arduino is able to understand the
    sketch and is able to follow the commands. Once you have run the `Verify` command,
    the IDE will tell you whether it is verified or not in the message box.


    You will get a message stating “Done compiling” and that means that you can upload
    the sketch to the board. It will give you the amount of memory the sketch needs
    and the amount of memory the Arduino has.


    Mistakes happen and basic errors will come up during this stage. Perhaps you forgot
    to close off the command properly and this prevents the sketch running properly.


    The system will tell you when that is the case.


    It will tell you which function has a problem, it will list the area that it believes
    the error is in, and what the nature of the problem is. It will even highlight
    what it believes to be the problem area on the sketch itself.


    ## Getting Your Sketch to the Board and Running It


    As long as you are sure that your sketch is right, you can upload it to the board.
    Your board will have to be connected to the USB port to do this.


    You can upload your sketch by using the `Upload` function. The IDE is going to
    reverify the sketch before it uploads it.


    You can check to see that the board’s LED lighting blinks so that you know the
    computer is transferring the information.


    Once the upload is finished, as long as everything is correct, your command should
    be run and you will see if the Arduino acts as you think it should.


    ## Changing Sketches


    You might want to tinker with your sketch once you have run it and seen how it
    actually performs. Again, this is pretty simple because it operates a lot like
    Microsoft Word.


    Click on the `Sketch` button, go to the `Sketch Folder` option and click on it.
    It will bring up a new window with the list of saved sketches.


    Double-click on the one that you want to change and the system will bring it up
    in the IDE window. You can then edit it as you like.


    Save the amended sketch.


    ## Chapter 3: Signals and the System


    Part of Arduino’s charm is that it can make sense of both analog and digital inputs.
    It is able to interact with you and the world it is in as a result. This can be
    useful when it comes to things like creating sensors, etc. In this chapter, we
    will go through some of the useful things you can do with the system in this regard.


    You do need to have some sort of knowledge about electronics in order to work
    through this chapter so, if you do not, it will help to read up on the subject
    more. It can save a lot of heartache and expense to do so.


    If you are not sure what you are doing and incorrectly connect components or use
    too much power for the system, you might end up blowing the controller chip.


    “Getting Started in Electronics”, written by Forrest Mims, is a good place to
    start off.


    You need to find out what voltage your controller will run on. This is usually
    about 5 volts. If you exceed this voltage, you risk frying the chip.


    For most boards, it is not the end of the world if you do fry the chip because
    the chips are replaceable but it is better to be safe than sorry.


    ### Analog Pins and Digital Pins on Your Board


    We will deal with the standard Arduino board here.


    We’ll start off with a digital input pin – these are used to determine the presence
    of voltage on the actual pin or the lack there of. The analog input pins, on the
    other hand, are designed to determine what the range of voltage actually is.


    The `digitalRead` function will be input in the sketch as either “High” or “Low”.
    Essentially, the former means that voltage is coming in to the pin and the latter
    means that it is not. So, if you want the pin to measure whether or not there
    is a current coming from a device connected to it, you must use the `digitalRead`
    function.


    If you want to measure voltage, on the other hand, you would use `pinMode` instead.


    Most boards have 14 of these digital pins. The first two, numbers 0 and 1, will
    have the designations `TX` and `RX`. These pins are for the USB serial connection.
    They should not be used for anything else.


    If you find that you do not have enough digital pins, you can instead use your
    analog pins.


    If the standard board is still not big enough, you can get yourself a mega board.
    It works in much the same way as the standard one but it has a lot more pins.


    Analog values are completely different in that they vary on a continuous basis
    instead of just having two levels – on and off. The volume control on your TV
    is a good example of this – you can change the volume to any level along its range.


    A lot of sensors out there give readings based on the differences in voltage.
    You can use the function, `analogRead` in order to get the system to give you
    a value based on the voltage it reads on one of the analog pins. You will be able
    to tell not only if the pin is on or off but also how much voltage is running
    through it.


    ## Chapter 4: Incorporating Sensors


    Before we get onto the actual sensors themselves, let’s take a look at setting
    up a workspace that will work for you. You don’t need a huge space, unless you
    are working on a particularly large project but you should have a space that you
    can dedicate to the process.


    Whether this is a specific desk/ workbench or a whole room in your house will
    depend on what you plan to build, how much time you will devote to working on
    Arduino projects and how much space you currently have.


    One thing to bear in mind is that you will often be working with fiddly bits and
    pieces and that your projects are going to require a good deal of concentration
    on your part. Ideally speaking, you want a space where you can leave your work
    undisturbed to pick up later when you have time again. If you have to stop partway
    through a project, it can be very annoying to have to tidy everything away and
    then have to unpack it again when you want to get started again.


    Consider the following when deciding where to put your Arduino workspace:


    1. A comfortable chair and a place as free of humidity as possible. (The laundry
    room, therefore, may not be the best idea.)

    2. A good workbench that is solid and that will provide adequate support for your
    projects and tools.

    3. A good power outlet on hand.

    4. Space to set up your laptop or computer.

    5. Excellent lighting and good ventilation are essential.

    6. Storage space to keep all the parts in – shelves are a good thing to have.
    You will need various storage items to keep your tools and your parts in. A set
    of drawers that you would normally use to store hardware like nails, screws, etc.
    will come in very handy. Try for drawers that have clear fronts or be sure to
    label the drawers carefully to make your storage system as efficient as possible.

    7. A comfortable environment to work in, especially when it comes to longer projects.
    If you set aside a space in your garage, for example, will it be warm enough to
    be pleasant to work in during the dead of winter?

    8. A distraction-free environment. Can you cut yourself off from the rest of your
    family? Choosing a high-traffic area in your home is not conducive to the kind
    of concentration you will need to maintain when building your Arduino projects
    and writing lines and lines of complicated code.

    9. Some background music. It can help to have some background music playing to
    drown out extraneous noise in the background and to improve your enjoyment of
    the time spent on the Arduino projects.

    10. Access to the internet. You will need to be able to connect to the internet
    in order to easily be able to access plans, etc. If you have Wi-Fi, make sure
    that you will get a signal in your chosen workspace.

    11. Safety issues also need to be considered. Keep a small first aid kit on hand
    so that you can treat cuts, burns, etc. quickly and easily.

    12. If there are small kids in the house, it is a good idea to be able to keep
    your work area locked so that they cannot explore it and potentially hurt themselves.

