- raw: "Driver – A software that allows a computer to connect and communicate with\
    \ a hardware or device. Without the right driver, the hardware you connect to\
    \ a computer will not work properly. Depending on the operating system you are\
    \ using to work with your Arduino, you may need to install the driver for the\
    \ board.\n\nEnvironment – In computing jargon, the environment refers to a particular\
    \ configuration of a hardware platform and the operating system that it runs on.\n\
    \nGround – In electrical engineering, a ground is the reference point in an electrical\
    \ circuit from which voltages are measured or the common wiring point. The term\
    \ can also mean the literal earth where electrical circuits are connected to.\
    \ On the Arduino board, the GND pin serves this purpose.\n\nI/O – Short for input/output,\
    \ which describes a program, operation or device which transfers data to or from\
    \ a computer, to interact with the outside world. For example, if a button is\
    \ pressed (input), a light bulb goes on (output).\n\nLED – The acronym for Light-Emitting\
    \ Diode, a two-lead semiconductor light source. LEDs have many advantages over\
    \ other light sources, including smaller sizes, longer lifespan and lower energy\
    \ consumption. On the Arduino board, you will notice some LEDs that indicate when\
    \ the board is powered and codes are uploaded.\n\nMicro-controller – A computer\
    \ present in a single integrated circuit that is programmed to perform specific\
    \ tasks. Micro-controllers are the brains behind automatically controlled electronic\
    \ devices, from cell phones and cameras to washing machines and microwave ovens\
    \ to robots.\n\nOpen-source – A program whose source code is made freely available\
    \ to the public for use or modification. Open Source is a certification mark owned\
    \ by the Open Source Initiative (OSI) that allows software developers to freely\
    \ share their products with the public, so that it can be improved upon and redistributed.\
    \ Unlike commercial software, where some sort of redistribution licensing is required,\
    \ anyone can have a hand in developing and redistributing an open-source project.\n\
    \nSensor – Electronic devices used to measure physical quantities, and then convert\
    \ them into electronic signals. There are various different kinds of sensors for\
    \ measuring things in the physical, such as temperature, pressure, distance, noise,\
    \ motion etc. Sensors are normally components of more complex and sophisticated\
    \ electronic systems. If you want to built a digital thermometer, for instance,\
    \ you will need a temperature sensor that will go with your Arduino board.\n\n\
    Serial port – A connector that is used to send data to a device connected to a\
    \ computer, such as modems, printers, and mice. An Arduino board must be connected\
    \ to the right serial port for codes to be uploaded properly.\n\nSketch – A term\
    \ used to mean an Arduino program. A chunk of code written to command an Arduino\
    \ is called a ‘sketch’, rather than just a ‘program’, because the Arduino platform\
    \ was designed to appeal to artists and creative individuals in addition to engineers.\
    \ According to the founders, using the term ‘sketch’ would imply a rough idea\
    \ that can be explored, refined and developed – much like an art or design sketch.\
    \ As such, it will make using Arduino feel more encouraging and less daunting\
    \ to those who are not from a tech background.\n\nShield – This is a circuit board\
    \ that can be attached on top of an Arduino to accomplish a variety of purposes.\
    \ They are called this because they fit over the top of an Arduino board like\
    \ a protective shield.\n\nIDE (Integrated Development Environment) – The software\
    \ application that is run to provide you with the tools to program Arduino boards.\
    \ It includes a source code editor, build automation and debugger. It is an open-source\
    \ software available for download at the official Arduino website (www.arduino.cc).\n\
    \nPulse-Width Modulation (PWM) – A term describing a type of digital signal that\
    \ is used in a variety of applications. It is mainly used to control the amount\
    \ of power supplied to electrical devices.\n\nVoltage – The amount of energy between\
    \ two points of a circuit, measured with the standard unit, Volt (V).\n\nChapter\
    \ 5\n\nEssential Resources & Further Reading\n\nYou have learnt the basics of\
    \ Arduino and – if you have actually been following along with the instructions\
    \ – got a feel for what the platform can do firsthand. That was just the tip of\
    \ the iceberg, though; Arduino mastery takes time and dedication to keep building\
    \ upon what you have learnt. Furthermore, the open-source platform keeps on expanding\
    \ as more people take to using it. Whatever brought you to Arduino, your journey\
    \ with this exciting platform has just begun. Here is a list of useful materials,\
    \ written by some of the most respected authorities on Arduino, to help you move\
    \ ahead.\n\nFor Absolute Beginners\n\n# Getting Started with Arduino: The Open\
    \ Source Electronics Prototyping Platform\n\nby Massimo Banzi and Michael Shiloh\n\
    \nISBN-10: 1449363334 / ISBN-13: 978-1449363338\n\nWhat better way to get more\
    \ acquainted with Arduino than from one of the creators himself? Massimo Banzi\
    \ is the platform’s co-founder. This beginner-friendly book is written based on\
    \ his extensive experience in teaching, using, and building Arduino.\n\n# Beginning\
    \ C for Arduino, Second Edition: Learn C Programming for the Arduino Kindle Edition\n\
    \nby Jack Purdum Ph.D.\n\nISBN-10: 1484209419 / ISBN-13: 978-1484209417 \n\nWritten\
    \ for those who have no prior experience with micro-controllers or programming,\
    \ this guide is ideal for those who are starting their journey into programming.\
    \ You will get an introduction into C programming language, with a simple demonstration\
    \ of how it can be used on the Arduino family of micro-controllers. Drawn from\
    \ the author’s 20-plus years of university teaching, this book is perfect for\
    \ the complete programming beginner. It is engaging to read and assumes no prior\
    \ programming or hardware design experience of its readers, making learning enjoyable.\n\
    \nTake Your Skills to the Next Level\n\n# Programming Arduino Next Steps: Going\
    \ Further with Sketches\n\nby Simon Monk\n\nISBN-10: 0071830251 / ISBN-13: 978-0071830256\n\
    \n####  \n\n#### Electronics guru, Simon Monk reveals professional programming\
    \ secrets for Arduino in this practical guide for those who already have a firm\
    \ grasp of programming micro-controllers. This book covers the Arduino Uno, Leonardo,\
    \ and Due boards. Learn advanced ‘sketching’ techniques to take your Arduino to\
    \ the next level, including programming for the internet, maximizing serial communications,\
    \ managing memory, performing digital signal processing, and so much more. The\
    \ book features over 75 example sketches, all available for download.\n\n# Electronics\
    \ from the Ground Up: Learn by Hacking, Designing, and Inventing\n\nby Ronald\
    \ Quan\n\nISBN-10: 0071837280 / ISBN-13: 978-0071837286\n\nAre you fascinated\
    \ by the complex circuits behind common electronic devices? This book guides you\
    \ through step-by-step experiments that reveal how electronic circuits function.\
    \ It also explains components, construction techniques, basic test equipment,\
    \ circuit analysis, and troubleshooting. By the end of the book, you will not\
    \ only be armed with the know-how to design customs circuits, but also the ability\
    \ to hack and modify existing circuits to suit your needs.\n\n# 30 Arduino Projects\
    \ for the Evil Genius\n\nby Simon Monk\n\nISBN-10: 0071817727 / ISBN-13: 978-0071817721\n\
    \nEver want to build a Morse code translator? Pulse rate monitor? A Hypnotizer?\
    \ How about a keyboard prank? You can unleash your evil genius with this do-it-yourself\
    \ guide that shows you how to program and build some really fascinating projects\
    \ with the Arduino Uno and the Arduino Leonardo boards. You will learn from through\
    \ guides with checklists of required parts for each project, step-by-step instructions\
    \ with illustrations, and clear explanation of scientific principles behind the\
    \ projects.\n\nFun Project Ideas\n\n# Arduino Workshop: A Hands-On Introduction\
    \ with 65 Projects\n\nby John Boxall"
