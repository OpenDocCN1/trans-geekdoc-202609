- raw: 'If you enjoyed this book, I have a little bonus for you; a preview of one
    of my other books “Elon Musk - The Biography of a Modern Day Renaissance Man”.
    In this book, I take a closer look at exactly who Elon Musk is as well as examining
    the truly extraordinary accomplishments he has managed to achieve. Enjoy the free
    sample, and feel free to click on the purchase link below if you would like to
    learn more about this truly incredible individual!


    Introduction


    When actor Robert Downey Jr. signed on to portray Tony Stark (a.k.a. Iron Man),
    he suggested to director John Favreau that they meet up with Elon Musk. They have
    a task of bringing to life a superhero, and Musk is the closest there ever is
    to Marvel’s genius, billionaire, philanthropist in real life. The meeting was
    set and some of Musk’s characteristics went into RDJ’s portrayal of Tony Stark
    on screen, thus creating the memorable character that people come to know and
    love.


    In reality, there is far more to Musk’s life and person than can be personified
    by a fictional character. Sure, he does have a lot in common with Iron Man; he’s
    a prodigious tech genius and entrepreneur, with the capacity to make seemingly
    impossible ideas a reality. Like Tony Stark, he dreams, thinks and lives large,
    but that is where the similarity ends.


    Unlike his comic book counterpart, Elon Musk was not born into a life of luxury
    and ease. Despite showing potential for greatness as early as his preteens, his
    childhood and young adult life was filled with adversaries. To this day, Musk
    credits his early life struggles in helping him cultivate the indomitable spirit
    he is known for.


    Having made his mark in the field of IT, finance, sustainable energy, automotive,
    aerospace manufacturing and space exploration, it is an understatement to say
    that Musk has come a long way from his humble beginnings. He founded some of the
    most pioneering companies – Paypal, Tesla Motors, and SpaceX – and is almost single-handed
    responsible for each enterprise’s success. Whichever business he decided to dabble
    in, he brought with him a revolutionary idea which often ends up being a game-changer
    in the industry. Yet, he is far from done.


    His brilliant mind never ceased to think up grander innovations, even after numerous
    repeated successful endeavors. His ample and wild ambitions, it seems, are driven
    by grand visions of changing the world we live in. His agenda for the future includes
    filling the roads with more electric cars, powering the world with solar energy,
    colonizing neighboring planets and enabling people to cover great distances with
    a futuristic high-speed public transportation system.


    Most children would imagine of going outer space and travel to different cities
    in bullet-fast capsule pods, until those fantasies fade away in adulthood. Rarely
    are there individuals who dare to dream of living those fantasies that appropriately
    should stay within the realm of fiction. Elon Musk is among the exceptional few.


    Chapter 1


    The Beginnings Of Greatness


    Almost every success story of high-achieving individuals contain episodes highlighting
    their extraordinary iron will, critical thinking, propensity for hard work, and
    an unwavering belief that the impossible is not out of their reach. As one of
    the most brilliant minds who help shaped the global economy after at the dawn
    of the information age and tech boom in the late 20^(th) century, it is hardly
    surprising that Elon Musk displayed such distinctive personality traits at an
    incredibly young age.


    Elon Reeve Musk was born in June 28 of 1971, in Pretoria, Gauteng, South Africa.
    His father is a South African-born British electrical engineer, Errol Musk, and
    his mother is Canadian-English dietitian, Maye Musk. Elon is the eldest of their
    three children, followed by brother Kimbal and sister Tosca.


    Growing up in Pretoria, Elon’s early years were far from a picture perfect childhood.
    His parents divorced when he was 9 years-old, after which he lived mostly with
    his demanding and emotionally abusive father. At school, he endured harsh bullying
    by his peers. In one notable instance, he ended up hospitalized after being pushed
    down a flight of stairs. Such ordeals led Elon to find solace in the safest company
    available; his own thoughts and imagination which resided in the deep recesses
    of his prodigious mind.


    He would regularly immerse himself in reading as a means of escaping his troubles
    in the outside world. Encyclopedias and science fiction were among his favorite
    books; they added to his knowledge bank and encouraged his seemingly wild dreams
    of futuristic technology which had yet to become a reality. Often times, Elon
    would be caught daydreaming and lost in his own thoughts, ignoring the world around
    him in favor of the utopias in his imagination. Along with his innovative thoughts,
    Elon’s childhood experiences also contributed to him developing a high tolerance
    for hardship and an extraordinary work ethic; attributes which he is well known
    for and which have served him well in his life.


    His aptitude for technological innovations and entrepreneurship was evident when
    he began teaching himself computer programming at the tender age of 10. When he
    was just 12, he developed a spaceship shooter video game called, “Blastar", which
    he sold to a computer magazine for $500. After his first brush with success, Elon
    and his younger brother, Kimbal, hatched a plan to open an arcade near their school.
    Unfortunately, their enterprising plan had to be scrapped when their parents refused
    to provide the legal consent to obtain a business permit.


    In 1988, after graduating from Pretoria Boys High School at the age of 17, Elon
    made the momentous decision to leave his hometown for the United States, without
    the support of his parents. This would be the first step towards his hard-earned
    success. He was able to obtain Canadian citizenship through his mother a year
    later, and left South Africa for Montreal, Canada. There, he worked low-paying
    jobs and was living on the brink of poverty for a year.


    At the age of 19, he was accepted into Queens University in Kingston, Ontario
    for undergraduate studies in science. It was during his studies that he met Canadian
    author, Justine Musk, whom he would marry in 2000 and end up having six sons with.
    Their marriage lasted for only eight years, and Elon got married for the second
    time to British actress Talulah Riley. This marriage ended in divorce in 2014.


    Two years into his studies at Queens, Elon received a scholarship from The University
    of Pennsylvania (Penn) in America. He relocated to the US in 1992, following his
    transfer to Penn. In the following year, he earned his Bachelor of Science degree
    in Physics from Penn''s College of Arts and Sciences, and stayed back a year at
    Penn''s Wharton School to complete his studies for a Bachelor of Science degree
    in Economics.


    Throughout his college years, alongside his scientific studies, Elon took a keen
    interest in philosophical and religious literature. It was stated that his all-time
    favorite book is The Hitchhiker’s Guide to the Galaxy by Douglas Adams. It is
    through this immersion in both science and personal studies of humanities that
    Elon found his calling; he had the lofty ambition of wanting to contribute to
    projects that would change the world for the better.


    Consequently, his vision and entrepreneurial aspirations began taking shape, specifically
    in the areas of the internet, renewable energy and space exploration.


    [Click here to check out the rest of “Elon Musk - The Biography of a Modern Day
    Renaissance Man” on Amazon.](http://amzn.to/1MBnmB9)


    Or go to: [http://amzn.to/1MBnmB9](http://amzn.to/1MBnmB9)


    # Check Out My Other Books!


    ![Elon Musk - Biography-1.jpg](images/00004.jpeg)


    [Elon Musk - The Biography Of A Modern Day Renaissance Man](http://amzn.to/1MBnmB9)


    ![Elon Musk - Lessons.jpg](images/00005.jpeg)'
