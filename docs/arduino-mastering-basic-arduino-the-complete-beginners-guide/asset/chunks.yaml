    Arduino


    Getting Started With Arduino: The Ultimate Beginner’s Guide


    Steve Gold


    Introduction


    If are you fascinated by the simplest of technology, and often wonder about the
    inner workings of the electronic devices that are so ubiquitous in our daily lives,
    you are likely to find joy in experimenting and tinkering with Arduino.


    At the core of everything that comes to life at a flick of a switch – the Christmas
    tree lights that blink in multiple colors, the apps that open up on a touch screen
    device, and the microwave oven that heats up your food etc. – is a micro-controller,
    programmed to perform certain feats when activated. Arduino is an open-source
    platform that consists of a micro-controller and programming software. Unlike
    most platforms, Arduino was geared towards non-electricians who want to get creative
    with electronics, while also being flexible enough to accommodate engineering
    experts. It is meant to be accessible, low cost and easy to learn, regardless
    of your previous knowledge in electronics and programming.


    This guide will not make you an Arduino expert overnight – in fact, nothing can.
    What you will learn from this book however are the fundamentals of this amazingly
    versatile platform, and you’ll also have the opportunity to get a firsthand feel
    for what it can do. You will be guided through the key features of an Arduino
    circuit board, technical requirements to begin working, how to kick-start your
    first Arduino, important lingo you’ll need to know in order to get by, and how
    to proceed further in order to keep building upon what you have learnt.


    The information here is intended for the absolute beginner in electronics, circuitry
    and programming. If you have always wanted to learn how to build cool stuff with
    electronics yet are completely at loss as to how to get started, you now have
    all the information you’ll need at your fingertips in order to make your entry
    into the exciting world of Arduino. The rest is up to you!


    P.S. As a token of my appreciation, I have included a free gift for you; no catch,
    no charge. Simply [click here](http://eepurl.com/bMxlLr) for instant access.


