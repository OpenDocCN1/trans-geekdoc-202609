- raw: 'An alternative option is to see whether or not you can use a sensor from something
    that you have at home rather than buying a new one. An old gaming controller can
    be put to use quite well as it already has sensors incorporated into it. It might
    even be less expensive than buying the sensors on their own.


    If you do decide to jerry-rig device, you will have to write a sketch based on
    a device that produces the same kind of output. Check the specs for the device
    that you have bought or co-opted by looking at the data sheet. If you have lost
    the sheet, you will often be able to find more information in this regard online.


    Data sheets give you a lot more detail than the average user would really need.
    You want to check the information provided about the output signal and also check
    what voltage the sensor can take.


    If, for example, you have a device that can only stand up to 3.3 volts and you
    connect it to a pin that produces 5 volts, you will damage it.


    Making sensors useful to you can mean a lot of tweaking. You will need to interpret
    the data so that it is useful to you, and also make sure that it is put in the
    right context. You then also need to ensure that there is as little exposure to
    items that you don’t want measured as possible.


    These are things that you will learn how to do with time. You could, for example,
    take an average when it comes to readings instead of relying on just one or two.


    Sensing Movement


    Tilt sensors tend to be pretty simple in their construction. Basically all it
    usually is, is a box that has contacts on one of the ends. A ball is placed inside
    – if the ball makes contact with the contacts, the circuit is closed.


    If it is tilted away from the contacts, the circuit remains open. You will thus
    know which way the box has been tilted by determining whether or not the circuit
    is closed.


    You will see from the markings which way to orient the sensor.


    If you want the sensor to be sensitive to the slightest movement, you can orient
    the box so that the ball is just touching the contacts.


    If you really only want to know when there has been a major change, you can orient
    the ball in a position that is straight above, or under the senses. That way the
    ball will only change place if the whole box is upset.


    If you want to know whether or not the box has been shaken about, you can look
    at the length of time that position of the ball stayed the same for. Say, for
    example, that it stays in the same position for 10 minutes, it is clearly not
    being shaken. If, on the other hand, it tilts one way and then the other every
    few minutes, it likely is being shaken.


    There are a range of different sensors that can be applied in similar contexts.
    When you want to enter a shop, for example, a pressure pad signals the electronic
    doors to open.


    The sketch you write will be pretty simple as this is a basic On/ Off situation.


    Chasing the Light


    What if what you want is to see when the light levels have changed? Maybe you
    want to be able to switch the lights on when the room becomes too dark to see
    in.


    A simple solution is to connect an LDR or light dependent resistor. This detects
    changing levels in the light and responds by altering resistance. This can be
    measured by the board as a change in the levels of voltage.


    For this to work, the LDR would need to be connected to an analog pin and an LED
    light would need to be connected as well.


    Here it is important to know what the device you attach can do because there will
    never be a case when the voltage is not going to drop. This means that the voltage
    will never run up to the maximum that the power supply can handle.


    If you understand this out the outset, you can plan accordingly so that the results
    given are more accurate.


    A sketch like this will work for a number of different resistive sensors but you
    may need to change the resistor value to match the sensor better.


    The complexity of the sensor required would depend on what you actually want to
    monitor.


    How to Detect Motion


    There are many reasons why you might want to build a motion sensor – you could,
    for example, connect them to security lights so that the lights come on if motion
    is detected.


    Many easily obtainable sensors are easy to connect to your board. The key is in
    identifying the right pins to connect them to. You need to read through the data
    sheet that came with the sensor in order to find this information.


    When setting up your motion detectors, the key to getting the kind of results
    that you want is in positioning the sensor correctly. Take the example of the
    motion sensor being used to switch on security lights.


    If the sensor is placed aiming at the wrong level, you will pick up movement from
    family pets and kids as well and this can be annoying. Position the sensors high
    enough so that they are effective but also so that they don’t get triggered accidentally.


    Measuring Distance


    This is a fun application – you are going to measure the distance between the
    sensor and something else – like the nearest park car or a dog walking towards
    you.


    Again, reading the data sheet that comes with your sensor is imperative here.
    You need to determine what the maximum range for your sensor is.


    With ultrasonic sensors, the distance is measured by working out how long it has
    taken for the sound to echo back off the object in question.


    The ping is sent out when the sensor is activated. (In the code this is where
    the pin receives voltage for a couple of split-seconds. This triggers the sensor
    to create a pulse. This pulse is cut off when the return wave is detected.


    The system then works out how long it took the pulse to travel. It works out the
    distance by comparing this measurement to the speed of sound.


    Chapter 5


    The Different Types of Outputs


    It is when it comes to visual outputs that the Arduino really becomes fun to work
    with. The board can be used in conjunction with a number of different LED devices.


    Again, with visual output, you will use either digital or analog output.


    Digital Output


    Any pin that you use for input can be changed to give output instead. Essentially
    when it comes to digital output, there are two settings – Low or High. So you
    can choose to have the device on or off. This can be used to switch the lights
    on or off, for example.


    You will need to use the command, pinMode(outputPin), or pinMode(inputPin).


    Analog Output


    Here you have more range – if you want the lights to be dimmed gradually, for
    example, you will need to use the analogWrite function. This is accomplished through
    the use of Pulse Width Modulation – it is not actually an analog signal but it
    acts in much the same way.


    Pulse modulation will change up the time that the pulses are off in relation to
    the time that they are on. If you want a dimmer LED, for example, the pulses run
    for less time than they are off. If you want a brighter light, on the other hand,
    the pulses run for longer than the time than they are off.


    Because we are usually talking about microseconds here, the sensors in our own
    eyes will not be able to detect that the light is actually pulsing. It will look
    like a solid light.


    It is also important here to know that you won’t be able to use all the pins for
    analog output. On the standard Arduino board, you can only use the pins numbered
    3, 5 ,6, 10 and 11. If you have a Mega board, you can use all the pins from number
    2 through to number 13.


    If you try to use other pins with the analogWrite function, your sketch will not
    work.


    Varying the Levels of Light


    This is an easy way to create an interactive device. You can choose from single
    lights, arrays of LEDS and or numeric displays. Displays for graphics and text
    on LCDs have to be handled differently, though.


    Getting to Know Your LED


    An LED is a basic diode that has two different leads – the cathode and the anode.
    When the device is receiving more positive voltage on the anode than what is received
    on the cathode, light is emitted.'
