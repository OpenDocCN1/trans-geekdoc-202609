- raw: 'You can normally identify the anode by the length of the lead – this will
    generally be longer on the on the anode lead. The housing for the cathode is normally
    marked with a flattened area.


    What color the light is and what voltage it requires will differ depending on
    how the diode has been made. In addition to the diode, you will need a resistor
    to prevent the LED from burning out too quickly.


    As always, it is a good idea to read through the data sheet for the LED device
    that you have chosen to ensure that you get the one best suited to your particular
    project. The maximum current that the LED can handle is important, as are the
    values required in terms of forward voltage. This is especially important so that
    you can choose the right resistor to use.


    The pins on your board are able to give a maximum of 40 mA. This will work for
    your standard LEDs but won’t be enough for ones that run at a higher level of
    brightness. You will also only be able to run single LEDS off a single pin. If
    you need to increase the amount of current, a transistor can be added.


    Multicolor LEDs will have more than one LED in the package. This may mean that
    you have more sets of leads to work with. The data sheet will be able to give
    you more details on how these should be connected.


    There is a limit to what you can do when it comes to LEDS that have their own
    integrated chips. In these cases, the chip changes the colors and this cannot
    be overwritten by the Arduino board. If you are using a Pulse Wave Modulation,
    these are not the best choice because the chip will be constantly rebooted.


    Maximum Pin Current


    Where you also need to be careful is with LEDs that are able to draw in too much
    power for your chip. The chip can source a lot more mA of power than it is actually
    capable of handling. You need to take this into account when working out the maximum
    ratings.


    If you are not careful in this insistence, your Arduino chip could get fried.


    Practical Applications for LEDs


    Arduino couldn’t have made it simpler to switch an LED on or off. You will find
    that the connection of an LED and running the sketch for it is one of the basic
    beginner lessons that most books on the subject contain.


    A Series Resistor


    The current to the LED needs to be controlled to prevent them from burning out.
    Some LED packages come with built-in resistors.


    For those that do not, you will need to connect a resistor to each of the leads.
    In order to choose the right resistor for the job, you will need to know what
    voltage the pin will provide, what the forward voltage of the LED is and how much
    current you want the LED to have.


    Audio Output


    Arduino boards are not really built to produce sound themselves. If they are wired
    to a speaker though, they can make sounds.


    It can do this simply by sending out pulses that create vibrations. The vibrations
    are what causes the sound.


    The pitch can be altered by change the rate at which the pulses are sent out.
    A longer pulse will produce a lower frequency sound.


    The software for the Arduino boards does have a function that enables them to
    make sounds. You will need to use the timers built into the hardware. The standard
    boards are not able to run more than one tone simultaneously and you can run into
    problems when the timer is being used for something else.


    Knowing this upfront, you can plan your sketch accordingly and schedule functions
    that need to use the timer at a different time to when you are producing the tone.


    It must be said, however, that the tones that are produced are of a very limited
    range and will sound hard and computer-generated. If you want to create actual
    music, you are going to need to add in external hardware.


    Arduino is great at controlling the devices that can actually play music. Done
    this way round, you can recreate all the musical notes that you want.


    You can also use Arduino to control an external device that is built to make sound.


    Chapter 6


    Breadboarding


    Breadboarding is a technique that will take all your projects up a notch or two.
    You can just plug everything in and just hope for the best, but breadboarding
    adds that extra touch of organization that makes the design a lot more efficient.


    A breadboard is kind of like a story board in a movie – you can arrange the pieces
    of your project on it and see if they work together and make sense. The breadboard
    looks like a piece of plastic with a lot of holes in it.


    The breadboard is connected to your Arduino board and, instead of you having to
    solder the wires onto the pins, you plug them into the breadboard. This completes
    the circuit and allows you to test out the work you have done.


    The advantage is that it doesn’t have to be permanent – if you want to change
    something, all you have to do is to unplug the wires and plug them into their
    new spots.


    When you are happy with the work, you can record the layout, disconnect everything,
    remove the breadboard and solder everything in place or you can leave the breadboard
    as is.


    Breadboards are all pretty similar. You can refer to your data sheet to find out
    more about how yours operates but most will have the following components:


    1.  Ground bus strip: You can connect this to one of the GND pins on the Arduino.
    These strips will usually have black or blue markings.


    1.  Power bus strip: You will connect your power supply here in order to power
    your strip. There are normally two strips that are not connected. Most power strips
    will have red markings.


    1.  Terminal strips: These will be perpendicular in relation to your bus strips.


    1.  Conductors: These strips are there to show you where the connector wires have
    been placed. You won’t be able to see the wires, just the conductors.


    If you want to use the conductor, you will just plug the wire in one of the wires
    that need to be connected into one of the holes. Then connect the next wire in
    another of the holes along the same row.


    Solderless breadboards normally do come with a strip of adhesive on them. This
    makes it easy to attach and secure to your project.


    Getting Grounded


    When it comes to electronics, the two vital things that you need to know how to
    deal with are how to power your project and how to ground it.


    In an electrical circuit, the power wire controls where the electricity is sourced
    from and the ground wire controls where it returns to.


    With the breadboard, this distinction is easy because the power section and the
    ground section of boards each have their own bus strips. This makes it very easy
    to power your circuit.


    All you need to do is to plug the power supply into the relevant strip and the
    connect your ground bus strip up to your Arduino board’s GND pin.


    When You Need Jumper Wires


    When using a breadboard, you will usually use wires that are referred to as jumpers.
    All these are, are wires that are long enough to reach between the various connections.


    You can easily make your own - bearing in mind that a solid wire is better for
    this purpose because it has less of a tendency to fray.


    If you want to, you can buy premade jumpers. These have a connector pin already
    attached on either end. The advantage of buying the premade ones is that they
    will fit the holes in a breadboard perfectly and are built to be quite durable.


    It is advisable, especially when starting out, to get premade jumpers with the
    connections already in place. You can also get short jumpers that are specially
    designed to lay flat against the board and are angled accordingly and these are
    very useful.


    Chapter 7


    Build Your Own Simple Robot


    Let’s do something fun and cool – after all, that’s really what Arduino is all
    about. The project detailed below is a simple and made with the Funduino UNO Robotics
    Kit. The steps are basically the same for making any other robot so you can use
    a different kit or make up your own kit if you like.


    Getting the Support in Place


    Start by taking out the battery back. Put it face down, with the cable facing
    towards you.'
