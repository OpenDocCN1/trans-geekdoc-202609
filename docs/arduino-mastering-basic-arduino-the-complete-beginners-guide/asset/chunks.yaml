    Chapter 1


    Working with the Arduino IDE


    Let’s start by seeing what the Arduino IDE is all about. Start by opening up the
    IDE. It looks like a very basic word processor and is divided up into the following
    areas:


    1.  The Command Area


    1.  The Text Area


    1.  The Message Window Area


    The Command Area


    The command area is where you will find the icons, menu items and title bar. The
    title bar shows what the name of the sketch is and what version of the Arduino
    IDE you are running.


    Then you will find your menu items and icons as discussed below.


    Menu Items


    You work this in much the same way as you would Microsoft Word. Click on any item
    in the menu to see what options you have.


    1.  File: In this section you will find the buttons to save sketches, to load
    them and to print them. You will also be able to find example sketches that you
    can refer to. You will also be able to set your Preferences here by clicking on
    the Preferences tab.


    1.  Edit: Here you will find the normal commands – Search, Copy and Paste, just
    like in Microsoft Word.


    1.  Sketch: This includes functionality that allows you to verify your sketch
    before you take the step of uploading it to the board itself. It also has import
    options and a way to sort your sketches into folders.


    1.  Tools: There are a number of different functions included in here. You will
    need this section to specify the type of Arduino board you have and what USB port
    you’ll be using.


    1.  Help: This will enable you to get help using Arduino and the specific IDE
    version that you have.


    The Icons


    The icons are under the menu toolbar. There are six in total. You can hover over
    each of the icons to see the name. These are what the icons are and what they
    do:


    1.  Verify: If you click on here, you will be able to tell if the Arduino sketch
    is actually valid and that it is free of errors in the programming.


    1.  Upload: If you click on here, you will be able to verify the sketch first
    and then have it uploaded to the board.


    1.  New: This will enable you to open a new, blank sketch. It opens in a different
    window.


    1.  Save: You can save the sketch that is currently open using this button. You
    will be asked to name the sketch if you have not already done so.


    1.  Serial Monitor: This is the button if you want to open a window that can be
    used to transfer data from the IDE to the Arduino or back again.


    The Text Area


    This is the area that you will use to create the different sketches. This is the
    area that you can type in.


    At the top left-hand corner, you will be able to see what sketch you are working
    on is. If you haven’t named the sketch yet, the system will default to whatever
    the date is.


    You put in your commands here just like you would in a text editor.


    The Message Window Area


    This is towards the bottom of the screen. Messages that the IDE sends will show
    up in the area that is blacked out. There are a number of different messages that
    you will get. This is where the IDE will communicate whether or not a sketch is
    verified, what the status of the system is, etc.


    The IDE and the Board


    If you look at the bottom of the screen, next to where the IDE messages are displayed,
    you will see the type of Arduino board you have and also which port it is connected
    to.


