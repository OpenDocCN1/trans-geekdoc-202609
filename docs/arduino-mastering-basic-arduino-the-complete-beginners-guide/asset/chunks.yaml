- raw: 'Let’s say, for example, that you want to blink an LED light. You have to tell
    the system to switch the light on for, how long to leave it on for and then to
    switch it off.


    To start off with, make sure that the board is plugged in to the USB port on your
    computer.


    Open up the IDE and go to “Tools”. Make sure the correct port has been selected.
    This is just to confirm that the board is connected properly.


    Now you can start writing your sketch:


    Comments


    These are not actually for the board but more as a reminder to yourself. This
    will come in handy later when you are using a few different sketches. You can
    write in what the purpose of the sketch is. It doesn’t need to be too involved
    or complicated – just a reminder of what you created and why.


    It also helps to update the comments when you make changes – this will help you
    to keep track of whatever tweaking you have done.


    It is especially important to update the comments section if you think someone
    else is going to be making use of your sketch.


    If what you are writing will fit on one line, type in two forwards slashes immediately
    before your comment so that the board knows to ignore that text completely.


    So it could look like:


    // Clock Sketch by Name created January 2017


    If your comment won’t fit on one line, put a forward slash and asterisk on the
    line directly above the comment. When the comment is complete, move to the next
    line and repeat the slash and asterisk again.


    So, it could look like:


    /\*


    Clock Sketch by Name Created January 2017


    Made to tell the time


    \*/


    Now go to File and click on “Save As”. Choose what you are going to name the sketch
    and hit the “OK” button.


    Arduino sketches have the extension .ino appended to them but you don’t have to
    worry about doing this – it should be done automatically.


    Once the sketch has been saved, you will be able to call it up again by finding
    it in the Sketchbook.


    The Language Used by Arduino


    The language that you will use for coding will be familiar to you if you have
    done any work with C or C++. That said, you do not need to be an expert programmer
    to be able to use the code as the system is centered on making things simpler
    for you.


    Variables


    It can be useful to think of variables as something like a shopping basket. Each
    variable has content within it. You can look inside to see what you have in there,
    and can change out the contents for something else if you like.


    The variable is essentially what your “shopping basket” is going to be called.
    The variable is the name of container which holds a specific bit of data that
    it is possible to change or inspect.


    Using variables has a couple of different advantages – first off, code becomes
    easier to understand if you do and it also makes maintaining the code easier.


    Let’s say you first decide that you want to use the number 2 pin for blinking
    your LED light. You have two options. Either you could apply the function manually
    throughout your coding or you could use a variable instead.


    You would name the variable and then assign a value to it. Then, in the sketch,
    wherever you need to refer to that particular function and pin, you could use
    the variable instead.


    Now, this may seem like you are doing things the long way around but the advantage
    is that, should you want to move the function to another pin, all you would have
    to do is to adjust the coding where you have declared the variable. Had you done
    this the other way around, you would have to go to each line where the code appears
    and change each manually.


    You can also be creative when it comes to the name that you give the variable.
    This will make it a lot easier to remember what the actual function of the variable
    was. So you could, for example, call your variable, outputPin.


    The Setup Function


    Your next step, whatever sketch you are creating is to add in the “void setup()”
    function. Type in void setup () and then follow on the next line with braces and
    whatever instructions you want to add in.


    The difference with this function and other functions is that this will only be
    run once, at system start up or when the system is reset.


    Close the brackets on the next line.


    Include this even if you have no particular instructions for the system because
    the IDE will look for this when verifying the sketch and will return an error
    if it is not present.


    So it looks something like:


    void setup()


    {


    }


    Control Your Hardware


    Once the hardware has been connected, you need to tell the Arduino board what
    to do with it. If your hardware requires an electrical signal, it will need to
    be connected to a digital pin.


    You will need to tell that pin what it must do so it will look something like:


    {


    pinMode(2, OUTPUT); // this tells the number 2 pin that it is for output


    }


    What the above example is telling the pin to do is to generate a signal. You can
    set it up the other way around by replacing the word “input” to the word “output”.


    The part of the command is the instruction to the board – the semicolon is what
    tells the board that the command is ended. The text following the forward slashes
    are notes for your own benefit – you don’t have to add them if you don’t want
    to.


    Always save your work as you are going along.


    The Loop Function


    If you want to make the board do something over and over again, like blink an
    LED light, you need to add in a loop function. This lets the board know that it
    must repeat the instruction continuously until it is shut down or reset.


    This instruction should immediately follow the void setup() command and “pin”
    command, before you put new commands in.


    /\*


    LED Blinker


    by Name, created January 2017


    \*/


    void setup()


    {


    pinMode(2, OUTPUT); // this tells the number 2 pin that it is for output


    }


    void loop()


    {


    // Add in your main code:


    }


    Again, save your work.


    You will then tell the board exactly how often to blink the light, how long to
    blink it for and how long to pause it for.


    Notes on Saving Your Sketch


    When you save your sketch, choose a name that is short but meaningful to you.
    When you hit the save button, the IDE brings up the default save location as the
    Arduino folder created in your “My Documents”.


    You can save the sketches elsewhere if you like but only sketches saved in the
    default location will appear in the Sketchbook menu section. If you save sketches
    elsewhere, they may not be as easy to track down again at a later stage.


    Arduino does not allow you to use some characters, like spaces. If you try to
    use these, it will ignore these completely so do keep that in mind when naming
    your sketches.


    The samples that are provided with the software cannot be overwritten. You will
    need to change the filename in order to save any changes that you have made. This
    is a good thing because it keeps the samples free of any errors – if your changes
    don’t work, you can always revert to the originals again.


    If you do make changes, the system will ask whether or not the changes should
    be saved when you close the sketch off. It is better not to rely on these system
    reminders and save your work periodically to prevent data loss.


    If you are working on a sketch and have changed portions of it, but not saved
    them yet, you will see the § symbol behind the sketch’s name. As soon as you hit
    save, this will disappear.


    If you are tinkering with a sketch and want to be able to go back to previous
    version, you need to click on the “Save As” and give the amended sketch a different
    name so that you don’t overwrite the previous version.


    It does help to also verify the code as you are going along. That way, locating
    errors becomes a far easier task.


    If you upload the sketch to your board without saving it, you won’t be able to
    access it again. The sketches must be saved on your hard drive on your computer
    if you want to access them again later.


