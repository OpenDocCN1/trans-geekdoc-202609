    ## Chapter 1: Understanding Arduino


    In 2005, the Ivrea Interaction Design Institute in Italy started a project of
    creating an open-source platform to be used for building various electronic projects,
    known as `Arduino`. Originally geared towards students with little to no background
    in electronics or computer programming, the platform eventually gained worldwide
    popularity due to its accessibility and beginner-friendly features.


    Over the years since its inception, `Arduino` has garnered the attention and enthusiasm
    of hobbyists, artists, programmers, students and even hackers from all levels
    of experience. Being an open-source platform, it continues to grow with contributions
    from a diverse community of users that keep pushing the limits of its capabilities.
    In fact, `Arduino` has been the backbone behind thousands of projects and applications,
    from everyday objects to complex scientific equipment.


    The `Arduino` platform consists of two components:


    1. The hardware – A physical programmable circuit board, also known as the microcontroller.
    There are different types of `Arduino` boards (more on this in Chapter 2).


    2. The Software – The Integrated Development Environment (IDE) that runs on the
    computer, used for writing and uploading programming codes to the physical board.


    Why Go Arduino?

