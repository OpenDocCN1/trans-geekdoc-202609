    如果你喜欢这本书，我为你准备了一份小小的额外礼物：我的另一本书《埃隆·马斯克：当代文艺复兴之传》的预览。在书中，我更深入地审视了埃隆·马斯克究竟是谁，并考察了他所取得的真正非凡的成就。请享受免费样品，如果你想了解更多关于这位真正伟大的人，请随时点击下方的购买链接！


    # 引言


    当演员罗伯特·道尼 Junior（Robert Downey Jr.）接受饰演托尼·斯塔克（又名钢铁侠）时，他向导演约翰·法法扣（John Favreau）建议他们与埃隆·马斯克见面。他们的任务是赋予超级英雄生命，而马斯克是现实中最接近漫威那种天才、万富翁和慈善家的人。会面安排后，马斯克的一些特征被道尼在银幕上对托尼·斯塔克的刻画中，从而创造了人们所知并喜爱的记忆角色。


    现实中，马斯克的人生形象远比一个虚构角色所能体现的丰富得多。确实，他与钢铁侠有很多共同点；他是一个过禀的科技天才和企业家，有能力将看似不可能的想法变为现实。像托尼·斯塔克一样，他梦想、思考并生活得宏大，但相似性仅此于此。


    与漫画中的对应角色不同，埃隆·马斯克并非出生于奢华舒适的生活。尽管他在青少年时期早期就展现出了非凡的潜力，但他的童年和青少年时期却充满了逆境。直到今天，马斯克归功于早年的斗争帮助他培养了众所周知的不屈精神。


    在信息技术、金融、可持续能源、汽车、航空航天制造和太空探索领域留了自己的足迹后，说马斯克从谦卑的起点走了很远也是一种保守的说法。他创立了一些最具开创性的公司——`Paypal`、`Tesla
    Motors` 和 `SpaceX`——并几乎凭一之力负责每家企业的成功。无论他决定涉足哪个业务，他都会带去革命性的思想，这些思想往往会成为行业的规则改变者。然而，他远未结束。


    即使在经历了无数次反复成功的尝试后，他卓越的大脑从未停止构思更宏大的创新。看来，他充沛且狂野的野心是由改变我们生活世界的宏伟愿景驱动的。他的未来计划包括让道路充满更多电动汽车、用太阳能为世界提供动力、殖民邻行星，并让人们通过未来的高速公共交通系统跨越遥远的距离。


    大多数孩子都会想象进入太空，乘坐子弹般快速胶囊舱穿于不同的城市，直到这些幻想在成年后逐渐消逝。很少有人敢于梦想过那些本应只留在虚构领域中的幻想。埃隆·马斯克就属于这少数卓越的人之一。


    # 第一章：伟大的起点


    几乎每个高成就者的成功故事都包含这样的情节，凸显了他们非凡的钢铁意志、批判性思维、刻苦工作的倾向，以及对“不可能并非遥不可及”的坚定信念。作为`20^(th)`世纪末信息时代黎明和科技热潮后帮助塑造全球经济的最优秀大脑之一，埃隆·马斯克在如此年轻的年纪就表现出如此鲜明的个性特征，并不令人意外。


    埃隆·里夫·马斯克（Elon Reeve Musk）于 1971 年 6 月 28 日出生于南非豪尔登省的普特利亚。他的父亲是一位出生在南非的英国电气工程师
    `Errol Musk`，他的母亲是加拿大裔英国人营养师 `Maye Musk`。埃隆是他们三个孩子中的长子，随后是弟弟 `Kimbal`（金巴）和妹妹 `Tosca`（托斯卡）。


    在普特利亚长大，埃隆的早年生活远非完美的童年。当他 9 岁时父母离婚了，之后他大部分时间与要求严苛且在情感上虐待他的父亲住在一起。在学校里，他忍受同龄人的严厉欺凌。在一个著名的案例中，他因被推下楼梯而最终住院。这些磨难导致埃隆在最安全的伴侣中寻找慰藉；那就是存在于他那过禀大脑深处的自己的思想和想象。


    他会经常沉浸在阅读中，作为逃避外世界麻烦的手段。百科全书和科幻小说是他喜欢的书籍之一；这些书籍丰富了他的知识库，并鼓励了他那些尚未成为现实的看似狂野的未来技术梦想。经常，埃隆会被发现正在发呆，迷失在自己的思想中，忽视周围的世界，转而追求想象中的乌托邦。除了这些创新的思想，埃隆的童年经历也使他培养了对苦难的高耐力和非凡的工作伦理；这些特质是他广为人知的，并在他一生中受益匪浅。


    当他在 10 岁就开始自学计算机编程时，他在技术创新和创业方面的天赋已显而易见。当他才 12 岁时，他开发了一个名为“Blastar”的太空射击视频游戏，并以
    500 美元卖给一本电脑杂志。在第一次尝试成功后，埃隆和他的弟弟 `Kimbal` 计划在他们学校附近开一家游戏厅。不幸的是，由于父母拒绝提供获得营业执照的法律许可，他们积极进取的计划不得不被放弃。


    1988 年，在 17 岁从`普特利亚男中`（Pretoria Boys High School）毕业后，埃隆做出了离开家乡前往美国的重大决定，没有父母的支持。这将是他来之成功的第一步。一年后，他通过母亲获得了加拿大国籍，离开南非前往加拿大的蒙特利尔。在那里，他从事低薪工作，并在贫困边缘生活了一年。


    19 岁时，他被安大略省金斯顿的`皇后大学`（Queens University）录取攻读科学本科。正是在学习期间，他遇到了加拿大作家 `Justine Musk`（朱斯汀·马斯克），他们在
    2000 年结婚并有了六个儿子。他们的婚姻持续了八年，埃隆第二次嫁给了英国演员 `Talulah Riley`（塔拉拉·莱莉）。这段婚姻在 2014 年离婚结束。


    在皇后大学学习两年后，埃隆收到了美国宾夕法尼亚大学（Penn）的奖学金。他于 1992 年转学美国宾夕法尼亚大学。次年，他获得了宾夕法尼亚大学文科学学院的`物理学学士学位`，并在宾夕法尼亚大学沃顿学院（Penn''s
    Wharton School）多读了一年以完成`经济学学士学位`的学习。


    在整个大学期间，除了科学学习外，埃隆对哲学和宗教文学产生了浓厚的兴趣。据称，他一生中最喜欢的书是道格拉斯·亚当斯（Douglas Adams）写的《银河系游指南》。正是通过对科学和个人人文研究的双重沉浸，埃隆找到了他的使命；他拥有为改善世界的项目做出贡献的高远雄心。


    因此，他的愿景和创业志向在互联网、再生能源和太空探索领域开始成形。


    '
