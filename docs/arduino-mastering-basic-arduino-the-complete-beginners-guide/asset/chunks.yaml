  trans: '

    将两个舵器并排，沿长度方向背靠放置，轴心指向相反的方向。确保它们对齐良好。


    舵器应该放置在电池包上方，使一个轴分别位于电池包的两侧。你需要将它们与引出电线的电池包边缘对齐，并确保舵器的电线悬空，不接触电池包。


    所以，如果你从上方看，舵器的电线将位于电池包的顶部边缘，舵器对齐在同一边缘。电池包的线将从右侧底部出来。它们将覆盖电池包的大约一半，你会有空间在舵器旁边放置面包板。


    对齐无误后，用双面胶固定。


    确保舵器牢固地固定到位。


    你的机器人底盘现在已经完成了。


    ## 安装 Arduino 和面包板


    接下来是安装面包板。将其放置在舵器旁边，使其与舵器紧密对齐。使用胶带将面包板粘牢。


    接下来安装 Arduino – 它将直接胶粘在舵器上方。尽量避免面包板出现过多的悬空。


    ## 你的机器人的战车已就绪


    现在你可以让你的机器人移动起来。将轮子安装到舵机的轴上。这需要花费一点力气——因为它们设计得非常紧密。


    你现在需要添加一个万向轮，这样面包板部分就不会拖地。万向轮应该整齐地安装在面包板下方，确保机器人前方有足够的间隙。


    如果万向轮高度不够，你可以制作一个垫圈。这很容易——你只需要一些废木来补偿差值。然后将木板连接到面包板上，并将万向轮连接到木板上。


    ## 连接你的舵器


    你需要找到长排间式插针。切掉两个 3 针节。确保固定电线的塑料件处于正中位置。如果不是，你可以轻轻移动塑料件来纠正这一点。


    将插针插入面包板中，位置位于板子中间点正下方的一行，一直延伸到左侧。将它们放置在同一行，但中间隔开一个孔。你现在可以将舵器的电线连接到插针上。连接时，确保黑色电线在左侧。


    拾起电线的松弛部分并将其整齐地折叠。使用小扎带让电线保持整洁且不妨事。


    现在你需要使用跳线将插针连接到 Arduino 以及面包板上的导轨。


    放置一根跳线，从连接红色电线的插针底座连接到板子上的红色导轨。


    放置一根跳线，从连接黑色电线的插针底座连接到板子的蓝色导轨。


    你现在需要连接 Arduino。你需要更长的跳线来完成操作。放置一根跳线，从连接白色电线的插针底座连接到 Arduino 的 `12` 和 `13` 引脚。


    ## 放置传感器


    取出超声波传感器并将其放在机器人正前方。你要将其插入面包板的身体，而不是任何一个导轨。


    使用跳线连接传感器的 `VCC` 引脚。将其连接到离最近的红色导轨。这将为传感器供电。


    使用跳线将传感器的 `GND` 引脚连接到面包板的蓝色导轨。这将接地。


    最后一步是获取一根更长的跳线，将传感器的 `Trig` 连接到 Arduino 上的 `8` 引脚，并将传感器的 `Echo` 连接到 Arduino 上的
    `9` 引脚。


    ## 电源已


    使用 Arduino 引脚为舵机供电不是好主意，因为它们抽电流太大。你可以通过将其直接连接到电池包来解决这个问题——你可以与 Arduino 使用同一个电池包，也可以使用一个新的包。


    舵机需要四节 AA 电池。为了确保正确连接电线，你需要将机器人侧放，让电池包的电源线朝下。也就是说，如果机器人面向前方，请将其放在右侧。


    找到从左起第二个弹簧，并将红色电线连接上去。找到右侧最后一个弹簧，并将黑色电线连接上去。


    现在将你刚刚连接到电池弹簧的两根电线插入舵机的后部电源轨中。


    ## 停止你的机器人


    如果不添加停止开关，你的机器人将一直运行直到电池耗尽。


    取出推按开关并将其跨跨定义面包板中心的间隙。


    将开关的一半连接到前面的电源轨。使用一个 `10kΩ` 电阻将另一侧连接到 `GND` 导轨。


    将带有电阻的一侧连接到 Arduino 板上的 `2` 号引脚。


    现在你可能需要编写一个程序（sketch），将每个组件连接起来并告诉 Arduino 要做什么。

