  - 7. 电压调节器 – 顾其名，该组件控制进入 `Arduino` 板的电压量。它通过排除进入电路板的额外电压来发挥作用。但它也有局限性；它无法处理超过 20
    伏的电压。因此，特别提醒：不要使用大于 20 伏的电源！它会过载并损坏你的 `Arduino`。大多数型号的建议电压为 6 到 12 伏。
