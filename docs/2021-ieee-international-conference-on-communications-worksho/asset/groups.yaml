    **Abstract—Nowadays**, searching for parking is tedious and causing stress. Also,
    parking traffic leads to congestion, air pollution, and illegal parking in parking
    areas because the driver chooses the most nearest parking. Intelligent Transportation
    System (ITS) mainly focuses on roadside traffic and is generally considered. However,
    parking a vehicle consumes a major part of time. In this article, we have proposed
    Artificial Intelligence (AI) and Blockchain (BC) integrated architecture to predict
    parking availability and pricing rates based on vehicle type and time (i.e., demand).
    Our system provides various parking services, where vehicle type is connected
    to the BC Network, using smart contracts for management of driver''s preferences
    and requirements. We have ensured security and privacy and provide performance
    evaluation and analysis of the proposed model.


    **Index Terms**—Artificial intelligence, blockchain, parking pricing prediction,
    ethereum, IEEE


    # I. INTRODUCTION


    The exponential growth of vehicles in India from 2011 to 2020 (1) raises various
    troubling issues such as traffic congestion, road accidents, and time-consuming
    due to limited public space as well as inadequate parking management. These are
    on top to the priorities of transportation agencies and effective public publishing
    (2). This requires automation and intelligence to enhance the transportation system,
    which the Intelligent Transportation System (ITS) is a viable solution, which
    offers to improve traffic management (3). Conventional ITS focuses on road travelling
    issues, while parking management is also one of the major issues besides traffic
    congestion due to on-street parking. It consumes ≈ 40% of the total time spent
    for parking.


