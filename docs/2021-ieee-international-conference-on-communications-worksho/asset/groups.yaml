    # Blockchain and AI-integrated vehicle-based dynamic parking pricing scheme


    Dakshit Reetwahi¹, Rajesh Gupta¹, Student Member, IEEE, Aparna Kumari¹, Student
    Member, IEEE, Sandeep Tanwar³, Senior Member, IEEE, Department of Computer Science
    and Engineering, Institute of Technology. Nirma University, Ahmedabad, Gujarat,
    India *19nmce2@nirmau.ac.in, *18vphde31@nirmau.ac.in, *17fphde22@nirmau.ac.in,
    sandeep.tanwar@nirmau.ac.in


    **Abstract—Nowadays**, searching for parking is tedious and causing stress. Also,
    parking traffic leads to congestion, air pollution, and illegal parking in parking
    areas because the driver chooses the most nearest parking. Intelligent Transportation
    System (ITS) mainly focuses on roadside traffic and is generally considered. However,
    parking a vehicle consumes a major part of time. In this article, we have proposed
    Artificial Intelligence (AI) and Blockchain (BC) integrated architecture to predict
    parking availability and pricing rates based on vehicle type and time (i.e., demand).
    Our system provides various parking services, where vehicle type is connected
    to the BC Network, using smart contracts for management of driver''s preferences
    and requirements. We have ensured security and privacy and provide performance
    evaluation and analysis of the proposed model.


    **Index Terms**—Artificial intelligence, blockchain, parking pricing prediction,
    ethereum, IEEE


    # I. INTRODUCTION


    The exponential growth of vehicles in India from 2011 to 2020 (1) raises various
    troubling issues such as traffic congestion, road accidents, and time-consuming
    due to limited public space as well as inadequate parking management. These are
    on top to the priorities of transportation agencies and effective public publishing
    (2). This requires automation and intelligence to enhance the transportation system,
    which the Intelligent Transportation System (ITS) is a viable solution, which
    offers to improve traffic management (3). Conventional ITS focuses on road travelling
    issues, while parking management is also one of the major issues besides traffic
    congestion due to on-street parking. It consumes ≈ 40% of the total time spent
    for parking.


    ![](img/0f753980fc8b53ff3a6b207cde399cda_0_0.png)


    higher than the current price, then it will make my vehicle unnecessarily. The
    dynamic pricing sets base according to the available slots and distance from other
    parking vendors [7]. As the number of vehicles increases rapidly, the demand for
    parking is also increasing. So, the ITS has to manage the parking in such a scalability
    and parking needs.


    Recently, the researchers and computer scientists worked on the Parking Guidance
    and Information (PGI) system [8], which provides real-time information to the
    drivers for finding parking lot availability. Availability of parking and traffic
    details to the user can enhance the performance by reducing their searching time
    for parking. Implementing the dynamic pricing, which is based on ML algorithms,
    plays a major role in the prediction of parking space for on-street and off-street
    parking, so that drivers can reach the destination before reaching the place.


    AVs collect and sensitive information from vehicle networks exchanging ideal data
    can result in faster parking trips. AV systems are those to the users and management
    of information, where every time need access to Cloud for processing and intelligence
    [10]. This leads to latency due to the distance between the vehicle and server,
    which can be solved using Edge Computing (FC). FC is also decentralized information
    center, where intelligence is located at Local Area Network (LAN) [11]. Hence
    is located in data center but CCS and QQS for quick access, but this can lead
    to privacy and authentication issues. Because the malicious user can join with
    the network with a fake address and steal communicated data


    [12]. Also, the device needs to access another device (i.e., LAN server) for intelligence
    and processing, which may lead to latency.


    To meet an issue, Edge Computing (EC) is introduced, where intelligence is applied
    at the data source (i.e., closer to the edge user). EC reduces latency and enhances
    reliability by processing data at edge server and then results are stored at CCS
    for permanent storage. For large and complex data, edge servers require data storage
    capacity and processing power, which requires dedicated resources. If transferring
    data to the other device results in privacy issues, EC allows users to connect
    to the network and access service which is easy for a malicious user to theft
    information and mislead ITS. The attackers try to damage the system by controlling
    the communication path, passing invalid information into online transactions where
    an attacker can steal information such as account ID, online transaction ID as
    details. Centralized authority processes and raw data as valid data, so if data
    is compromised then it can damage the entire entity''s system. Such issues can
    be handled using authenticated access and strict data storage.


    Blockchain (BC) provides a decentralized connection between servers where transactions
    are distributed by implementing cryptography and public block hash [15]. BC-based
    parking prediction allows users to maintain tracking and sensing activities because
    BC eliminates third party (centralized) by introducing Smart Contract (SC) which
    includes rules and consensus to protect AV system from a malicious user. User
    parking service is connected to the BC network (BN) [16]. Each parking service
    provides a record and the right to validate transactions. Drivers and vehicles
    are verified using user ID and vehicle ID respectively, which protects the AV
    system. Malicious users need to have access to high-level benefits and crypto-currencies
    to be paid based on tasks such as Proof-of-Work (PoW), Proof-of-Stake (PoS), Byzantine.
    Thus, BC ensures safe communication among the entire BN [17].


    # A. Motivation


    Centralized AV services carry security, privacy and latency issues. Following
    are the main motivation for this survey paper:


    - 1. Current parking systems take considerably long time for predicting occupancy
    and rate of parking.

    - 2. Static pricing does not cope with the market condition because it can be
    higher or lower than the optimal value. While dynamic pricing generally changes
    according to the demand each up to the optimal value (i.e., price with higher
    demand and lower price with lower demand).

    - 3. Dynamic pricing also solves congestion issues by varying prices between the
    distance parking and location. PG system predicts parking slots availability so
    that users can occupy parking with basic rules and suitable pricing.

    - 4. Private BC enhances security and data integrity by restricting access and
    authentication to the BN. Also, the user needs to perform the pre-decided task
    to join the BN, thus the malicious user has fewer to harm the AV system.


    # B. Research Contributions


    - Article has been proposed for the importance of parking prediction and availability
    research.

    - We have proposed a distributed architecture for a fully automated Artificial
    Intelligence (AI) based trusted and secure management system.

    - This article highlights fair parking prediction distribution for managing congestion
    and peak time at parking areas.


    # II. SYSTEM MODEL AND ARCHITECTURE


    ![](img/0f753980fc8b53ff3a6b207cde399cda_1_0.png)


    System model (2) involves roles such as driver, parking service, which are connected
    to Ethereum Smart Contract (ESC) using potential communication for database management.
    The driver requests parking according to the location which is validated using
    user ID and stored on BC blockchain with hashing. The parking service acts as
    a block in BN and provides parking service location, position, and provides prices
    to drivers for fair and better pricing. The parking service is distributed de-central
    based on real-time demand.


    Here let $R = \{R_1, R_2, ..., R_p\}$, represent $p$ sets of parking service.
    These roles are associated with city $N$ number of parking areas, each associated
    with parking service, i.e., $\{P_1, P_2, ..., P_n\} \in R$. Parking area of any
    parking service can be driven by $\{D_1, D_2, ..., D_m\} \in \{V_1, V_2, ...,
    V_k\} \in S$. Constraints and mapping of entries are as follows:


    ```

    $f_1 : P \rightarrow D(n, m)$,n$f_2 : D \rightarrow V(k)$

    ```

