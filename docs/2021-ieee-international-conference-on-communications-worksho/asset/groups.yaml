    # III. PROPOSED ARCHITECTURE


    Traditional parking management systems suffer from traffic congestion, time pressure,
    and pollution because the users need to find parking manually is much difficult
    while requirement is high. In this paper, we propose an AI and BC-based integrated
    solution for security and performance of parking management. Fig. 3 shows that
    the proposed architecture consists of four layers as Driver layer, AI layer, BC
    layer. Parking service layer providing detail. The structure of such layers is


    # A. Driver layer


    The driver layer is the entry point of interaction with the system. The driver
    may have more than one heterogeneous vehicle (e.g., 2-wheeler, 3-wheeler, 4-wheeler),
    according to which price is decided. The driver can request the BC parking for
    reservation by providing vehicle id, vehicle type, arrival date and time, and
    location. The system identifies and predicts available lots in each parking area
    as per driver request. The system responds to this predicted information. By analyzing
    reliable preference, services, and price, the driver can confirm the reservation.
    Payment is performed using BC-based either, where the driver uses cryptographic
    wallet. This is encrypted using the private key, cryptography and time stamp.
    Drivers can make payment to the BC layer, which is validated by performing consensus
    mechanisms. After validation of payment, the driver can park the vehicle to the
    located spot


    AI layer to perform checking availability and predict prices according to the
    peak status and vehicle. This application searches for parking lot with the specific
    time and vehicle type which is processed by the algorithm to determine availability
    of parking and price based on demand and time. The algorithm will notify the user
    about the nearest parking area by analyzing the peers (i.e., other users) and
    rates based on demand and time. Pricing is applied at a data server where parking
    occupancy occurs. When a driver stays and checks availability for the parking
    lot, an AI-based algorithm process dataset and checks as per driver request. This
    dataset consists of vehicles such as date, time, locations, vehicle type, required
    services. For accurate prediction, the model is trained and tested based on previous
    data and the fusion matrix. The matrix shows the actual price and predicted price
    based on a result. Based on availability, system provides the driver with area
    locations and available lots with predicted price, according to which driver can
    choose suitable parking location. then the parking slot is represented as free.
    Also, if the user makes changes for booked parking then changes are increased
