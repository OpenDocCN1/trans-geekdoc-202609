    # III. 提议的架构


    传统的停车管理系统面临交通拥堵、时间压力和污染问题，因为当需求很高时，用户手动寻找停车场非常困难。在本文中，我们提出了一种基于 AI 和区块链（BC）的集成解决方案，以提高停车管理的安全性能。图
    3 所示，所提的架构由四层组成：司机层、AI 层、BC 层。停车服务层提供了详细说明。这些层的结构如下：


    # A. 司机层


    司机层是与系统交互的入口。司机可能拥有多个一个异质车辆（例如二轮车、三轮车、四轮车），根据此决定价格。司机可以通过提供车辆 ID、车辆类型、到达日期和位置来请求区块链停车预约。系统根据司机的请求识别并预测每个停车区域的可用车位。系统对这些预测信息做出响应。通过分析的偏好、服务和价格，司机可以确认预约。支付使用基于区块链的机制，司机使用加密钱包。这使用私钥、密码学和时间戳进行加密。司机可以向
    BC 层进行支付，通过执行共识机制进行验证。支付验证后，司机可以将车辆停在指定的地点。


    AI 层用于根据高峰状态和车辆执行可用性检查并预测价格。该应用程序搜索特定时间和车辆类型的停车场，并由算法处理以根据需求和时间确定停车可用性和价格。算法将通过分析对等（即其他用户）以及基于需求和时间的费率，通知用户最近的停车区域。定价应用于发生停车占用的数据服务器上。当司机停留并检查停车场的可用性时，基于
    AI 的算法处理数据集并根据司机的请求进行检查。该数据集包含日期、时间、位置、车辆类型、所需服务等车辆。为了准确预测，模型根据以前的数据和融合矩阵进行训练和测试。矩阵显示了基于结果的实际价格和预测价格。根据可用性，系统为司机提供区域位置和带有预测价格的可用位，司机据此可以选择合适的停车位置。然后车位被表示为空闲。此外，如果用户对已订停车做出更改，则更改将作为更改增加。数据保存在区块链上供以后使用。


