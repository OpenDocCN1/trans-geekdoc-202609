    # 集成区块链与人工智能的车辆动态停车定价方案


    Dakshit Reetwahi¹, Rajesh Gupta¹, Student Member, IEEE, Aparna Kumari¹, Student
    Member, IEEE, Sandeep Tanwar³, Senior Member, IEEE, Department of Computer Science
    and Engineering, Institute of Technology. Nirma University, Ahmedabad, Gujarat,
    India *19nmce2@nirmau.ac.in, *18vphde31@nirmau.ac.in, *17fphde22@nirmau.ac.in,
    sandeep.tanwar@nirmau.ac.in


    **摘要——如今**，寻找停车位既乏味又令人压力。由于驾驶员选择最近的停车位，停车交通会导致拥堵、空气污染以及停车区域违章。智能交通系统（ITS）主要关注路侧交通并通常被予以考虑。然而，停车消耗了大部分时间。在本文中，我们提出了一种集成人工智能（AI）和区块链（BC）架构，根据车辆类型和时间（即需求）预测停车可用性和定价率。我们的系统提供了多种停车服务，其中车辆类型连接到区块链网络，使用智能合约管理驾驶员的偏好和需求。我们确保了安全性和隐私，并对所提模型进行了性能评估和分析。


    **索引术**——人工智能，区块链，停车定价预测，以太坊，IEEE


    # I. 引言


    印度车辆从2011年至2020年的指数级增长（1）引发了各种令人困的问题，如交通拥堵、交通事故以及由于公共空间有限和停车管理不善导致的时间耗费。这些是交通机构和有效公共发布（2）中的首要考虑之事项。这需要自动化和智能化来增强交通系统，而智能交通系统（ITS）是一个可行的解决方案，提供了改进交通管理的方法（3）。传统的ITS聚焦于道路行驶问题，而除了路边停车导致的交通拥堵外，停车管理也是主要问题之一。它消耗了停车总时间的约
    40%。


    ![](img/0f753980fc8b53ff3a6b207cde399cda_0_0.png)


    如果价格高于当前价格，它将使我的车辆变得没有必要。动态定价根据可用空位以及与其他停车供应商的距离设定基准 [7]。随着车辆数量的快速增加，对停车的需求也在增加。因此，ITS
    必须根据这种扩展性和停车需求来管理停车。


    最近，研究人员和计算机科学家致力于停车引导和信息（PGI）系统 [8]，该系统为驾驶员提供寻找停车位可用性的实时信息。向用户提供停车可用性和交通详情可以通过减少他们寻找停车位的时间来提高性能。实施基于
    ML 算法的动态定价，在路边和路外停车位的预测中起着重要作用，以便驾驶员在到达地点之前到达目的地。


    自动驾驶车辆（AVs）从车辆网络收集敏感信息，交换理想数据可以带来更快的停车行程。AV 系统对于用户和信息管理而言，是每次都需要访问云端进行处理和智能化 [10]。这导致了由于车辆与服务器之间的距离产生的延迟，可以使用边缘计算（FC）解决。FC
    也是一个去中心化的信息中心，智能位于局域网（LAN）中 [11]。因此它位于数据中心，但为了快速访问使用了 CCS 和 QQS，这可能导致隐私和身份验证问题。因为恶意用户可以使用假地址加入网络并窃取通信数据


    [12]。此外，设备需要访问另一个设备（即 LAN 服务器）来获取智能和处理，这可能会导致延迟。


    为了解决这一问题，引入了边缘计算（EC），智能被应用于数据源（即靠近边缘用户）。EC 通过在边缘服务器处理数据减少延迟并增强可靠性，然后结果存储在 CCS
    中永久存储。对于大型复杂数据，边缘服务器需要存储容量和处理能力，这需要专用资源。如果将数据传输到其他设备会导致隐私问题，EC 允许用户连接到网络并访问服务，恶意用户可以容易窃取信息并误导
    ITS。攻击者试图通过控制通信路径破坏系统，向在线交易中传递无效信息，攻击者可以在那里窃取账户 ID、在线交易 ID 等信息。中心化机构处理原始数据作为有效数据，因此如果数据遭到破坏，可能会损坏整个实体的系统。此类问题可以使用认证访问和严格的数据存储来处理。


    区块链（BC）提供了服务器之间的去中心化连接，通过实现密码学和公共区块哈希分布交易 [15]。基于区块链的停车预测允许用户维护跟踪和感知活动，因为区块链通过引入智能合约（SC）消除了第三方（中心化），智能合约包含了规则和共识，以保护
    AV 系统免受恶意用户侵害。用户停车服务连接到区块链网络（BN） [16]。每项停车服务提供记录和验证交易的权利。驾驶员和车辆分别使用用户 ID 和车辆 ID
    进行验证，从而保护了 AV 系统。恶意用户需要拥有高级权限和加密货币，以便根据工作量证明（PoW）、权益证明（PoS）、拜占庭等任务获得支付。因此，BC 确保了整个
    BN 之间的安全通信 [17]。


    # A. 动机


    中心化的 AV 服务存在安全、隐私和延迟问题。以下是本综述论文的主要动机：


    - 1. 目前的停车系统预测占用率和费率花费大量时间。

    - 2. 静态定价无法应对市场状况，因为它可能高于或低于最优值。而动态定价通常根据需求变化达到最优值（即需求高时价格较高，需求低时较低）。

    - 3. 动态定价通过改变距离停车和位置之间的价格来解决拥堵问题。PG 系统预测停车位可用性，使用户可以使用基本规则和适当的价格占用停车位。

    - 4. 私有区块链通过限制对 BN 的访问和认证来增强安全性和数据完整性。此外，用户需要执行预设任务才能加入 BN，因此恶意用户损害 AV 系统的机会较少。


    # B. 研究贡献


    - 本文针对停车预测和可用性研究的重要性提出了建议。

    - 我们提出了一种基于全自动人工智能（AI）的受信且安全管理系统的分布式架构。

    - 本文强调了公平的停车预测分布，用于管理停车区域的拥堵和高峰。


    # II. 系统模型与架构


    ![](img/0f753980fc8b53ff3a6b207cde399cda_1_0.png)


    系统模型 (2) 涉及驾驶员、停车服务等角色，它们通过潜在通信连接到以太坊智能合约（ESC）用于数据库管理。驾驶员根据位置请求停车，使用用户 ID 进行验证并经过哈希处理存储在区块链（BC）上。停车服务作为
    BN 中的一个区块，提供停车服务位置、方位，并为驾驶员提供价格以实现公平和更好的定价。停车服务根据实时需求进行去中心化分布。


    这里 $R = \{R_1, R_2, ..., R_p\}$ 表示 $p$ 组停车服务。这些角色与城市 $N$ 个停车区域相关，每个区域与一个停车服务相关，即
    $\{P_1, P_2, ..., P_n\} \in R$。任何停车服务的停车区域都可以由 $\{D_1, D_2, ..., D_m\} \in \{V_1,
    V_2, ..., V_k\} \in S$ 驱动。条目的约束和映射如下：


    ```

    $f_1 : P \rightarrow D(n, m)$,n$f_2 : D \rightarrow V(k)$

    ```


