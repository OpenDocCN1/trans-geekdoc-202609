    # V. CONCLUSION


    The proposed article highlights the issues of the current centralized manual system
    for pricing prediction, such as high rushing time, illegal parking, security.
    To meet such challenges, we have proposed AI and BC-based solution which allows
    users to interact with parking service using the blockchain provider. The prices
    are based on vehicle type to ensure service convenience and maximize revenue.
    Prices get changed according to the demand (i.e., non-peak time or peak time)
    and availability. Payment transactions are secured using BC, where parking service
    validate and verify all transactions to enhance security and trust. We have also
    shown evaluation of model performance and results. In the future, we will optimize
    the blockchain operations for quick


