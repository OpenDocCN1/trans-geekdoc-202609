  dropdown-divider\"></div>\n                <a class=\"dropdown-item\" href=\"#\"\
  >Something else here</a>\n              </div>\n            </li>\n          </ul>\n\
  \        </div>\n      </nav>\n      <div class=\"container-fluid\">\n        <h1\
  \ class=\"mt-4\">Simple Sidebar</h1>\n        <p>The starting state of the menu\
  \ will appear collapsed on smaller screens, and will appear non-collapsed on larger\
