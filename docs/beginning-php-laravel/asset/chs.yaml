  \    </div>\n    <!-- /#page-content-wrapper -->\n  </div>\n  <!-- /#wrapper -->\n\
  \  <!-- Bootstrap core JavaScript -->\n  <script src=\"vendor/jquery/jquery.min.js\"\
  ></script>\n  <script src=\"vendor/bootstrap/js/bootstrap.bundle.min.js\"></script>\n\
  \  <!-- Menu Toggle Script -->\n  <script>\n    $(\"#menu-toggle\").click(function(e)\
  \ {\n      e.preventDefault();\n      $(\"#wrapper\").toggleClass(\"toggled\");\n\
  \    });\n  </script>\n</body>\n</html>\n```\n\n### 集成到 Laravel 项目\n\n在你偏好的编辑器中打开\
  \ inventory 项目（我使用 PHPStorm）。导航到 `resources > welcome.blade.php` 并将内容替换为上述 Bootstrap\
  \ 主题的源代码。\n\n请注意，如果你在浏览器中重新加载应用，它将显示为无样式状态（外观非常糟糕）。现在前往 Bootstrap 官网下载 Bootstrap\
  \ 4.3 编译版本。你可以直接将以下链接复制粘贴到浏览器中以下载：\n\n> https://github.com/twbs/bootstrap/releases/download/v4.3.1/bootstrap-4.3.1-dist.zip\n\
  \n解压 zip 文件，找到 `bootstrap.min.css` 文件，将其复制到项目目录下的 `public/css` 中；找到 `bootstrap.bundle.min.js`\
  \ 文件并将其复制到 `public/js`。Bootstrap 需要 jQuery 支持，因此在 `public/js` 下创建一个新文件 `jquery.min.js`，访问以下\
  \ URL 并将文件内容复制进去：\n\n> https://code.jquery.com/jquery-3.4.1.min.js\n\n### 更新资源引用\n\
  \n现在我们需要在 `welcome.blade.php` 页面中引用刚才添加的新 Bootstrap 和 jQuery 资源。为此，请替换旧的引用。\n\n\
  **替换 JavaScript 引用：**\n\n```html\n// Replace this\n<script src=\"vendor/jquery/jquery.min.js\"\
  ></script>\n<script src=\"vendor/bootstrap/js/bootstrap.bundle.min.js\"></script>\n\
  \n// With this\n<script src=\"{{ asset('js/jquery.min.js') }}\"></script>\n<script\
  \ src=\"{{ asset('js/bootstrap.bundle.min.js') }}\"></script>\n```\n\n**替换 CSS 引用：**\n\
  \n```html\n// Replace this\n<link href=\"vendor/bootstrap/css/bootstrap.min.css\"\
  \ rel=\"stylesheet\">\n\n// With this\n<link href=\"{{ asset('css/bootstrap.min.css')\
  \ }}\" rel=\"stylesheet\">\n```\n\n### 添加侧边栏自定义样式\n\n现在在 `public/css` 文件夹下创建一个新文件\
  \ `simple-sidebar.css` 并将以下内容粘贴到文件中。\n\n```css\nbody {\n  overflow-x: hidden;\n\
  }\n\n#sidebar-wrapper {\n  min-height: 100vh;\n  margin-left: -15rem;\n  -webkit-transition:\
  \ margin .25s ease-out;\n  -moz-transition: margin .25s ease-out;\n  -o-transition:\
  \ margin .25s ease-out;\n  transition: margin .25s ease-out;\n}\n\n#sidebar-wrapper\
  \ .sidebar-heading {\n  padding: 0.875rem 1.25rem;\n  font-size: 1.2rem;\n}\n\n\
  #sidebar-wrapper .list-group {\n  width: 15rem;\n}\n\n#page-content-wrapper {\n\
  \  min-width: 100vw;\n}\n\n#wrapper.toggled #sidebar-wrapper {\n  margin-left: 0;\n\
  }\n\n@media (min-width: 768px) {\n  #sidebar-wrapper {\n    margin-left: 0;\n  }\n\
  \  #page-content-wrapper {\n    min-width: 0;\n    width: 100%;\n  }\n  #wrapper.toggled\
  \ #sidebar-wrapper {\n    margin-left: -15rem;\n  }\n}\n```\n\n将旧的侧边栏 CSS 引用更改为刚创建的新引用。\n\
  \n```html\n// Replace this\n<link href=\"css/simple-sidebar.css\" rel=\"stylesheet\"\
  >\n\n// With this\n<link href=\"{{ asset('css/simple-sidebar.css') }}\" rel=\"stylesheet\"\
  >\n```\n\n现在欢迎页面应该能正常加载了。\n\n## 定义布局\n\n由于我们将在各页面间维护相似的视图，Laravel 为我们提供了一种定义主布局的方法，其他页面（称为子视图）可以从此扩展。这样，导航、头部样式、底部脚本或内容等可以保留在主视图中，扩展它的子视图可以根据我们的定义和需求来扩展和覆盖其中的某些部分。\n\
  \n\n\n\n## Laravel Blade 布局重构指南\n\n### 创建布局结构\n\n在 `resources/views` 目录下创建 `layout`\
  \ 文件夹，并在其中创建 `master.blade.php` 文件。将 `resources/views/welcome.blade.php` 的内容复制到该文件中。\n\
  \n### 提取头部模板\n\n从 `master.blade.php` 中提取 `<head>` 到 `</head>` 之间的内容。在 `layout` 目录下创建\
  \ `partials` 文件夹，并创建 `_header.blade.php` 文件，将提取的内容粘贴进去。\n\n```html\n// resources/views/layout/partials/_header.blade.php\n\
  \n<head>\n    <meta charset=\"utf-8\">\n    <meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1, shrink-to-fit=no\">\n    <meta name=\"description\" content=\"\
  \">\n    <meta name=\"author\" content=\"\">\n    <title>Simple Sidebar - Start\
  \ Bootstrap Template</title>\n    <link href=\"{{asset('css/bootstrap.min.css')}}\"\
  \ rel=\"stylesheet\">\n    <link href=\"{{asset('css/simple-sidebar.css')}}\" rel=\"\
  stylesheet\">\n</head>\n```\n\n> **注意**\n>\n> Laravel 使用 `Blade` 模板引擎。与其他流行的 PHP\
  \ 模板引擎不同，`Blade` 不限制你在视图中使用原生 PHP 代码。实际上，所有 `Blade` 视图都会被编译成原生 PHP 代码并缓存，直到被修改，这意味着\
  \ `Blade` 给应用程序增加的开销基本为零。`Blade` 视图文件使用 `.blade.php` 扩展名，通常存储在 `resources/views`\
  \ 目录中。\n>\n> 文件名前加下划线（`_header.blade.php`）是为了标记这是一个局部视图文件，不能独立使用。\n\n### 提取底部脚本模板\n\
  \n提取 `</body>` 标签附近的所有 `<script>` 标签，创建 `_footer.blade.php` 文件并将内容粘贴进去。\n\n```html\n\
  // resources/views/layout/partials/_footer.blade.php\n\n<!-- Bootstrap core JavaScript\
  \ -->\n<script src=\"{{asset('js/jquery.min.js')}}\"></script>\n<script src=\"{{asset('js/bootstrap.bundle.min.js')}}\"\
  ></script>\n\n<!-- Menu Toggle Script -->\n<script>\n    $(\"#menu-toggle\").click(function(e)\
  \ {\n        e.preventDefault();\n        $(\"#wrapper\").toggleClass(\"toggled\"\
  );\n    });\n</script>\n```\n\n### 提取侧边栏模板\n\n从主视图中提取 `Sidebar` 注释之间的内容，创建 `_sidenav.blade.php`\
  \ 文件并放入提取的内容。\n\n```html\n// resources/views/layout/partials/_sidenav.blade.php\n\
  \n<!-- Sidebar -->\n<div class=\"bg-light border-right\" id=\"sidebar-wrapper\"\
  >\n    <div class=\"sidebar-heading\">Start Bootstrap </div>\n    <div class=\"\
  list-group list-group-flush\">\n        <a href=\"#\" class=\"list-group-item list-group-item-action\
  \ bg-light\">Dashboard</a>\n        <a href=\"#\" class=\"list-group-item list-group-item-action\
  \ bg-light\">Shortcuts</a>\n        <a href=\"#\" class=\"list-group-item list-group-item-action\
  \ bg-light\">Overview</a>\n        <a href=\"#\" class=\"list-group-item list-group-item-action\
  \ bg-light\">Events</a>\n        <a href=\"#\" class=\"list-group-item list-group-item-action\
  \ bg-light\">Profile</a>\n        <a href=\"#\" class=\"list-group-item list-group-item-action\
  \ bg-light\">Status</a>\n    </div>\n</div><!-- /#sidebar-wrapper -->\n```\n\n###\
  \ 提取导航栏模板\n\n提取 `id=\"page-content-wrapper\"` 的 `div` 内部的导航栏，创建 `_navbar.blade.php`\
  \ 文件并放入内容。\n\n```html\n// resources/views/layout/partials/_navbar.blade.php\n\n\
  <nav class=\"navbar navbar-expand-lg navbar-light bg-light border-bottom\">\n  \
  \  <button class=\"btn btn-primary\" id=\"menu-toggle\">Toggle Menu</button>\n \
  \   <button class=\"navbar-toggler\" type=\"button\" data-toggle=\"collapse\" data-target=\"\
  #navbarSupportedContent\" aria-controls=\"navbarSupportedContent\" aria-expanded=\"\
  false\" aria-label=\"Toggle navigation\">\n        <span class=\"navbar-toggler-icon\"\
  ></span>\n    </button>\n    <div class=\"collapse navbar-collapse\" id=\"navbarSupportedContent\"\
  >\n        <ul class=\"navbar-nav ml-auto mt-2 mt-lg-0\">\n            <li class=\"\
  nav-item active\">\n                <a class=\"nav-link\" href=\"#\">Home <span\
  \ class=\"sr-only\">(current)</span></a>\n            </li>\n            <li class=\"\
  nav-item\">\n                <a class=\"nav-link\" href=\"#\">Link</a>\n       \
  \     </li>\n            <li class=\"nav-item dropdown\">\n                <a class=\"\
  nav-link dropdown-toggle\" href=\"#\" id=\"navbarDropdown\" role=\"button\" data-toggle=\"\
  dropdown\" aria-haspopup=\"true\" aria-expanded=\"false\">\n                   \
  \ Dropdown\n                </a>\n                <div class=\"dropdown-menu dropdown-menu-right\"\
  \ aria-labelledby=\"navbarDropdown\">\n                    <a class=\"dropdown-item\"\
  \ href=\"#\">Action</a>\n                    <a class=\"dropdown-item\" href=\"\
  #\">Another action</a>\n                    <div class=\"dropdown-divider\"></div>\n\
  \                    <a class=\"dropdown-item\" href=\"#\">Something else here</a>\n\
  \                </div>\n            </li>\n        </ul>\n    </div>\n</nav>\n\
  ```\n\n### 使用 `@include` 指令引入局部视图\n\n使用 `Blade` 模板的 `@include` 指令（类似 PHP 的 `include`\
  \ 函数）替换所有提取的部分。\n\n```blade\n// 替换头部标签位置\n@include('layout.partials._header')\n\n\
  // 替换侧边栏位置\n@section('sidenav')\n    @include('layout.partials._sidenav')\n@show\n\
  \n// 替换导航栏位置\n@section('navbar')\n    @include('layout.partials._navbar')\n@show\n\
  \n// 替换脚本标签位置\n@include('layout.partials._footer')\n```\n\n> **注意**\n>\n> `@section`\
  \ 指令允许我们定义可以在单独子视图中覆盖的区块。\n\n### 重构 `welcome.blade.php`\n\n将 `welcome.blade.php`\
  \ 的内容替换为以下代码：\n\n```blade\n@extends('layout.master')\n\n@section('content')\n  \
  \  // Content specific to this child page will appear here\n@endsection\n```\n\n\
  ### 完成主布局模板\n\n从主模板中提取 `class=\"container-fluid\"` 的 `div` 内部的所有内容，粘贴到 `welcome.blade.php`\
  \ 的 `content` 区块中，然后在主模板中用 `@yield('content')` 替换提取的位置。最终 `master.blade.php` 应如下所示：\n\
  \n```blade\n// resources/views/layout/master.blade.php\n\n<!DOCTYPE html>\n<html\
  \ lang=\"en\">\n@include('layout.partials._header')\n<body>\n<div class=\"d-flex\"\
  \ id=\"wrapper\">\n    @section('sidenav')\n        @include('layout.partials._sidenav')\n\
  \    @show\n    <div id=\"page-content-wrapper\">\n        @section('navbar')\n\
  \            @include('layout.partials._navbar')\n        @show\n        @yield('content')\n\
  \    </div>\n</div>\n@include('layout.partials._footer')\n</body>\n</html>\n```\n\
  \n### 页面标题动态化\n\n注意 `@yield('content')` 指令的用法，`content` 参数可以自定义（如 `child-page`），但在大多数情况下\
  \ `content` 即可满足需求，因为它只是用来引用子视图中将要放置的区块。\n\n我们也可以在 `<head>` 标签内使用 `@yield` 指令为每个子视图定义页面标题。\n\
  \n```blade\n// 替换此行\n<title>Simple Sidebar - Start Bootstrap Template</title>\n\n\
  // 替换为\n<title> Inventory App - @yield('page-title') </title>\n```\n\n### 最终的 `welcome.blade.php`\n\
  \n```blade\n@extends('layout.master')\n\n@section('page-title')\n    Welcome\n@endsection\n\
  \n@section('content')\n    <div class=\"container-fluid\">\n```\n\n\n\n\n## 简单侧边栏\n\
