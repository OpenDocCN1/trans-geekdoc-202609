  ```\n\n### 设置应用路由与控制器\n\n现在我们需要设置应用路由（位于 `routes/web.php`）并创建一个名为 `AppController.php`\
  \ 的控制器。在终端或 Git Bash 中运行：\n\n```bash\nphp artisan make:controller AppController\n\
  ```\n\n`AppController` 类将在 `app/Http/Controllers` 目录下生成。Laravel 允许你为控制器定义路由（基本上就是\
  \ URL），控制器随后渲染视图或返回数据——这些数据可能来自数据库，也可能不是；可能经过处理，也可能没有——并将其传递给视图（`.blade` 文件）进行渲染，或作为\
  \ JSON 数据端点返回。稍后你就会明白这一切。\n\n找到 `routes/web.php`，Laravel 允许我们在其中定义 Web 路由，将其全部内容替换为以下代码：\n\
  \n```php\n<?php\n\nAuth::routes();\n\nRoute::get('/', function () {\n    return\
  \ redirect()->route('inventory.home');\n});\n\nRoute::group(['prefix' => 'app',\
  \ 'middleware' => 'auth'], function ($route) {\n    $route->get('/', 'AppController@dashboard')->name('inventory.home');\n\
  });\n```\n\n#### 路由分组说明\n\n这里我们定义了一个路由组。Laravel 允许定义路由组，以便将相同的 URL 前缀、中间件及其他选项应用到组内的所有路由。在本例中，我们应用了前缀\
  \ `app` 和中间件 `auth`。该组内的所有 URL 都以 `/app` 开头，`auth` 中间件会阻止未登录用户访问组内的任何路由。同时注意 `name`\
  \ 方法允许我们给路由起一个易于记忆的别名，这里我们将渲染仪表盘的路由命名为 `inventory.home`，并在用户访问浏览器中的 `/` 路由时通过重定向引用了它。\n\
  \n> **Note**\n>\n> 中间件为过滤进入应用的 HTTP 请求提供了便捷机制。Laravel 的 `auth` 中间件验证应用用户是否已登录。如果未登录，用户将被重定向到登录页面；如果已登录，中间件将允许请求继续深入应用内部。Laravel\
  \ 自带了[多种中间件](https://laravel.com/docs/5.8/middleware)，你也可以自行创建额外的中间件。\n\nLaravel\
  \ 允许根据请求类型定义路由，包括 `get`、`post`、`put`、`delete` 和 `any` 等请求方法。查看页面适用 `get` 路由，提交表单适用\
  \ `post` 路由，更新表单适用 `put` 路由，删除数据库记录则适用 `delete` 路由。如果你是初学者这可能看起来很陌生，但其实这些只是 HTTP\
  \ 动词。\n\n以我们的 `/app` URL 定义为例，我们定义了一个 `get` 请求类型。当用户访问该 URL 时，会调用 `AppController`\
  \ 中的 `dashboard` 方法。\n\n```php\n$route->get('/', 'AppController@dashboard')->name('inventory.home');\n\
  ```\n\n另一个案例是定义 Laravel 路由的基本形式：传递一个闭包，可以返回视图、数据或重定向响应。在本例中，我们返回了一个重定向到应用仪表盘的响应。\n\
  \n```php\nRoute::get('/', function () {\n    return redirect()->route('inventory.home');\n\
  });\n```\n\n#### 添加控制器方法\n\n接下来打开 `AppController`，在 `AppController` 类中添加 `dashboard`\
  \ 方法：\n\n```php\npublic function dashboard()\n{\n    return view('dashboard');\n\
  }\n```\n\n现在如果你访问 `http://127.0.0.1:8000/app`，未认证用户会被重定向回登录页，因为我们的仪表盘路由受 `auth`\
  \ 中间件保护。\n\n在编辑器中打开以下两个文件：`Http/Controllers/Auth/LoginController.php` 和 `Http/Controllers/Auth/RegisterController.php`，将重定向\
  \ URL 属性从 `/home` 改为 `/app`，因为不再定义 `/home` 路由。\n\n你的文件应更新为如下所示：\n\n```php\nprotected\
  \ $redirectTo = '/app';\n```\n\n### Hello Laravel Migrations, Goodbye to Labouring\n\
  \n\n\n\n\n## Laravel 迁移\n\n你是否曾经不得不处理创建包含许多列的大量表的数据库？结果还得不时地更改架构？尝试在项目上协作有多容易？却没有简单的方法知道已存在什么架构，定义了什么关系或约束，并让每个人都能轻松保持相同版本的架构，而无需告诉他们添加什么或不添加什么，不得不费力劳作！Laravel\
  \ 迁移来拯救你了！\n\n正如 Laravel 文档所定义，迁移就像是你数据库的版本控制，允许你的团队轻松修改和共享应用程序的数据库架构。迁移通常与 Laravel\
  \ 的架构构建器搭配使用，以便轻松构建应用程序的数据库架构。如果你曾经不得不告诉队友手动向他们的本地数据库架构添加列，那么你就遇到了数据库迁移所要解决的问题。\n\
  \n我们稍后将创建迁移，但现在我们将运行现有的用户和密码迁移。要创建新的迁移，我们需要运行命令：\n\n```bash\nphp artisan make:migration\
  \ create_{复数表名}_table\n```\n\n// 例如：\n\n```bash\nphp artisan make:migration create_users_table\n\
  ```\n\n定义好列后，要运行现有迁移，只需运行：\n\n```bash\nphp artisan migrate\n```\n\n或者删除（回滚）最后一张表：\n\
  \n```bash\nphp artisan migrate:rollback\n```\n\n或者回滚数据库中的所有表并立即重新创建它们以清除现有数据，请运行：\n\
  \n```bash\nphp artisan migrate:reset\n```\n\n关于 Laravel 迁移还有很多内容，超出了本书的范围，但尽管如此，我们将涵盖其中大部分重要方面。访问\
  \ Laravel 官方文档 `https://laravel.com/docs/5.8/migrations` 了解更多。\n\n要迁移我们现有的用户迁移（随\
  \ Laravel 安装一起提供，位于 `database/migrations` 目录下），我们首先需要使用你最喜欢的任何数据库管理器创建一个名为 `inventory_app`\
  \ 的数据库，可以是通过命令行使用 mysql、phpmyadmin、sequelpro 或其他工具，接下来在你的 `inventory_app` 项目根目录下从编辑器中创建一个\
  \ `.env` 文件，并将已有 `.env.example` 的内容复制进去。\n\n最后编辑 `.env` 文件，将数据库连接的值更改为你的配置：\n\n\
  ```dotenv\nDB_CONNECTION=mysql\nDB_HOST=127.0.0.1\nDB_PORT=3306\nDB_DATABASE=inventory_app\n\
  DB_USERNAME=root\nDB_PASSWORD=mypassword\n```\n\n现在运行：\n\n```bash\nphp artisan migrate\n\
  ```\n\n从你的终端或 git bash 运行。如果你遇到错误 `Syntax error or access violation: 1231 Variable\
  \ 'sql_mode' can't be set to the value of 'NO_AUTO_CREATE_USER'`，只需从编辑器中找到文件 `config/database.php`，在第\
  \ 55 行 `engine=> null` 之后，粘贴这段代码片段，然后重新运行迁移：\n\n```php\n'modes' => [\n    'ONLY_FULL_GROUP_BY',\n\
  \    'STRICT_TRANS_TABLES',\n    'NO_ZERO_IN_DATE',\n    'NO_ZERO_DATE',\n    'ERROR_FOR_DIVISION_BY_ZERO',\n\
  \    'NO_ENGINE_SUBSTITUTION',\n],\n```\n\n### 关于 .env (DotEnv) 文件的一点说明\n\n`.env`\
  \ 文件包含应用程序设置的环境变量，它包含一行一个 `KEY=VALUE` 对。在你的 Laravel 项目代码中，你可以使用函数 `env('KEY')` 获取这些环境变量。\n\
  \nLaravel 的 `.env` 文件被包含以供使用，因此可以根据应用程序运行的环境轻松拥有不同的配置。这使你能灵活地为本地、预发布、生产环境，甚至不同开发者的机器设置不同的变量。\n\
  \n你的 `.env` 文件**不应**提交到应用程序的源代码控制中（例如 git），因为使用你应用程序的每个开发者/服务器可能需要不同的环境配置。此外，如果入侵者访问了你的源代码控制仓库，这将构成安全风险，因为任何敏感凭据都会暴露。\n\
  \n经验法则：如果你使用 git 进行版本控制，始终将 `.env` 添加到 `.gitignore` 中，以免你的凭据被推送到公众视野。\n\n### 登录\n\
  \n在继续之前，重要的是要知道一旦你更新了 `.env` 文件，就必须**重启**你的 Laravel 应用程序，因为每次你启动 Laravel 应用程序时都会加载环境变量，你必须重启它以加载新的更改。\n\
  \n停止终端上正在运行的 `php artisan serve` 命令并再次运行该命令。访问注册页面 `http://127.0.0.1:8000/register`\
  \ 创建一个账户，你将自动登录到应用程序仪表盘。\n\n## 构建仪表盘\n\n在本章中，我们将首先重构仪表盘、顶栏和侧边栏的视图，然后继续实现每个侧边栏功能。\n\
  \n以下是我们将要构建的功能列表：\n\n- 向已登录用户显示欢迎消息和可用库存的数量。\n- 创建库存。\n- 列出所有库存。\n- 如果库存是由已登录用户创建的，则编辑库存。\n\
  - 如果库存是由已登录用户创建的，则删除库存。\n- 回收站列出已删除的库存以及清空前剩余的时间。\n- 定时任务在库存进入回收站 3 分钟后清除过期库存。\n\
  \n### 侧边栏\n\n更改我们借用的 Bootstrap 主题中的占位符侧边栏内容。编辑你的 `resources/views/layout/partials/_sidenav.blade.php`\
