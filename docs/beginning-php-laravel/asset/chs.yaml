- "# PHP Laravel 入门指南\n\n\n\n## 关于作者\n\nOluwafemi Alofe 是一位经验丰富的软件工程师，拥有 7 年使用 Laravel\
  \ 构建可扩展 Web 应用程序的经验，自 4.2 版本早期发布以来便开始使用。他目前是一家金融科技初创公司的技术联合创始人（CTO）。\n\n## 简介\n\n\
  自 2011 年首次发布以来，Laravel 经历了指数级增长。2015 年，它成为 GitHub 上获得星标最多的 PHP 框架，并成为了全球众多初创公司和开发者的首选框架。\n\
  \nLaravel 是一个专注于简洁、清晰和高效完成工作的 MVC 框架。个人和公司用它构建从简单的业余项目到财富 500 强企业级应用的各种项目。\n\n根据\
  \ [`hackr.io/`](https://hackr.io/) 的数据，截至 2019 年，Laravel 仍然是前十大 Web 开发框架之一。\n\n\
  ### 适读人群\n\n本书面向希望开始使用 Laravel 构建应用程序的初学者，他们准备好通过构建一个涵盖 Laravel 框架大部分基础知识以及一些初看似乎令人望而生畏的高级功能的最小化项目，来快速上手实战。\n\
  \n有一定经验、寻求更好方式来设计中小型应用程序架构的中级用户也会发现本书大有裨益。\n\n### 你将学到什么\n\n本书将展示如何构建一个简单的库存应用程序。内容将涵盖\
  \ Blade 模板（我们将获取一个随机的 Bootstrap 主题并将其转换为可供所有页面扩展的精简模板）、用于注册和登录的认证、Eloquent ORM（展示不同的数据库表关系，包括软删除功能）、依赖注入、邮件设置与配置、路由类型、命名与分组，最后是任务调度与\
  \ Cron Jobs 以执行后台进程。\n\n最重要的是，你将学习如何通过遵循标准命名约定、最佳实践和编写 DRY（不要重复自己）代码来编写生产级质量的代码。\n\
  \n该项目的代码托管在 GitHub 上，地址如下：\n\n```\nhttps://github.com/slim12kg/Beginning-PHP-Laravel-Ebook-Code.git\n\
  ```\n\n> **注意**\n>\n> 招聘人员在寻找 Laravel 开发者时，会重点关注你使用该框架完整构建的项目数量。因此，建议你完整跟随本书学习，而不仅仅是克隆或\
  \ Fork 这个仓库。\n\n### 环境要求\n\n为了本书的目的，我们将使用 Laravel 5.4，因为它支持 PHP 版本 >= 5.6.4，该版本仍被大多数人广泛使用。如果你愿意，可以安装高于\
  \ 5.4 的版本，但不能低于该版本。\n\n请确保你的系统已安装 PHP 并启用了以下扩展：\n\n*   `OpenSSL PHP Extension`\n\
  *   `PDO PHP Extension`\n*   `Mbstring PHP Extension`\n*   `Tokenizer PHP Extension`\n\
  *   `XML PHP Extension`\n\n`Composer`（PHP 依赖管理器）必须全局安装在你的机器上，且需安装 MySql 或 MariaDB\
  \ 数据库（无论是随 Xampp 打包安装还是直接安装）。\n\n我将假设你使用的是 Unix 终端或 Windows Git Bash 来运行命令。\n\n\
  #### 资源\n\n*   [如何使用 GIT BASH 安装和运行 Laravel](https://www.youtube.com/watch?v=0rAW5eah7pw)\n\
  *   [在 Mac 上使用 Valet 安装 Laravel](https://www.youtube.com/watch?v=ErblOwpiopI)\n\
  *   [在 Ubuntu 上使用 Xampp 设置 Laravel](https://www.youtube.com/watch?v=3DeJCwmlOys)\n\
  *   [在 Linux 上设置 Laravel 5.4](https://www.youtube.com/watch?v=l-hM9KG4VSE&t=19s)\n\
  *   [Laravel 官方安装指南](https://laravel.com/docs/5.4/installation)\n*   [在 Windows\
  \ 上使用 Xampp 安装 Laravel 5](https://www.codementor.io/@magarrent/how-to-install-laravel-5-xampp-windows-du107u9ji)\n\
  \n> **注意**\n>\n> 为了不让初学者感到不知所措，我们将不遵循 TDD（测试驱动开发）流程。想了解更多关于 TDD 的信息，我[推荐阅读此文](https://github.com/slim12kg/Learn-Test-Driven-Design-In-Laravel)。\n\
  \n## Laravel 框架工作原理\n\n![](img/image00200.jpeg)\n\n图片来源：https://www.netsolutions.com\n\
  \nLaravel 是一个 MVC 框架，即模型、视图和控制器。模型用于在数据库中检索和存储信息，视图是在浏览器中渲染供最终用户查看的内容，而控制器是应用程序业务逻辑的处理场所，例如操作来自模型的数据并传递给视图。\n\
  \n> **注意**\n>\n> 如需深入理解，可阅读 https://laravel.com/docs/5.8/lifecycle 了解 Laravel 请求生命周期。\n\
  \n## 创建项目\n\n打开一个新的终端或命令行（Windows 操作系统用户使用 gitbash），导航到你的 Web 项目目录，然后运行以下命令来创建一个新的\
  \ Laravel 项目。请确保 `Composer` 已全局安装在你的机器上。\n\n```\ncomposer create-project --prefer-dist\
  \ laravel/laravel inventory-app \"5.4.*\"\n```\n\n接下来，创建一个名为 `inventory_app` 的数据库，并授予\
  \ root 用户或你选择的首选用户对该数据库的所有特权访问权限。\n\n一旦 `Composer` 命令运行完毕，且没有报错地完全安装了你的新 Laravel\
  \ 项目。从终端导航到新创建的 `inventory-app` 目录，然后运行命令 `php artisan serve` 以启动项目，使其可通过 Web 浏览器访问。\n\
  \n这是我在终端的 inventory-app 项目目录下运行 `php artisan serve` 命令的情况。\n\n```\noluwafemialofe@Oluwafemis-MacBook-Air\
  \ inventory-app : php artisan serve\n```\n\n你将获得如下输出，只需打开浏览器并访问输出的 URL 即可\n\n```\n\
  Laravel development server started: <http://127.0.0.1:8000>\n```\n\n你现在应该看到 Laravel\
  \ 默认的着陆页面了。\n\n恭喜，你已踏上成为 Laravel 工匠的征程 ⚔\n\n## 模板\n\n\n\n\n## 使用 StartBootstrap\
  \ Simple Sidebar 主题创建视图脚手架\n\n我们将使用 StartBootstrap Simple Sidebar Theme（一个免费的 Bootstrap\
  \ 4 基础模板）来创建我们的视图脚手架。你可以在此处找到它：[`blackrockdigital.github.io/startbootstrap-simple-sidebar`](https://blackrockdigital.github.io/startbootstrap-simple-sidebar/)。在页面上右键单击并选择“查看页面源代码”以复制\
  \ HTML 代码。\n\n### HTML 模板代码\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
  \  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1, shrink-to-fit=no\">\n  <meta name=\"description\" content=\"\"\
  >\n  <meta name=\"author\" content=\"\">\n  <title>Simple Sidebar - Start Bootstrap\
  \ Template</title>\n  <!-- Bootstrap core CSS -->\n  <link href=\"vendor/bootstrap/css/bootstrap.min.css\"\
  \ rel=\"stylesheet\">\n  <!-- Custom styles for this template -->\n  <link href=\"\
  css/simple-sidebar.css\" rel=\"stylesheet\">\n</head>\n<body>\n  <div class=\"d-flex\"\
  \ id=\"wrapper\">\n    <!-- Sidebar -->\n    <div class=\"bg-light border-right\"\
  \ id=\"sidebar-wrapper\">\n      <div class=\"sidebar-heading\">Start Bootstrap\
  \ </div>\n      <div class=\"list-group list-group-flush\">\n        <a href=\"\
  #\" class=\"list-group-item list-group-item-action bg-light\">Dashboard</a>\n  \
  \      <a href=\"#\" class=\"list-group-item list-group-item-action bg-light\">Shortcuts</a>\n\
  \        <a href=\"#\" class=\"list-group-item list-group-item-action bg-light\"\
  >Overview</a>\n        <a href=\"#\" class=\"list-group-item list-group-item-action\
  \ bg-light\">Events</a>\n        <a href=\"#\" class=\"list-group-item list-group-item-action\
  \ bg-light\">Profile</a>\n        <a href=\"#\" class=\"list-group-item list-group-item-action\
  \ bg-light\">Status</a>\n      </div>\n    </div>\n    <!-- /#sidebar-wrapper -->\n\
  \    <!-- Page Content -->\n    <div id=\"page-content-wrapper\">\n      <nav class=\"\
  navbar navbar-expand-lg navbar-light bg-light border-bottom\">\n        <button\
  \ class=\"btn btn-primary\" id=\"menu-toggle\">Toggle Menu</button>\n        <button\
  \ class=\"navbar-toggler\" type=\"button\" data-toggle=\"collapse\" data-target=\"\
  #navbarSupportedContent\" aria-controls=\"navbarSupportedContent\" aria-expanded=\"\
