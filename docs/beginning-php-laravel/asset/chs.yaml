  \n现在如果你刷新页面，它看起来已经像一个真正的 Laraventory 应用了。点击导航栏右侧的账户设置菜单，然后点击退出登录。你现在应该已经退出应用了。如果你在想，我们是怎么做到的？我马上就会解释。\n\
  \n### 退出登录\n\n从之前生成的认证脚手架中，Laravel 已经创建了路由和控制器来处理清除当前用户会话并将你重定向到登录页面。如果你在终端运行 `php\
  \ artisan route:list`，你将看到所有已注册路由的列表。\n\n请注意，从上面的代码片段可以看出，一旦用户点击退出登录按钮，我们添加了一个内联\
  \ JavaScript 来提交一个隐藏表单。它向退出登录路由发送一个 `POST` 请求，这是因为退出登录路由被注册为 POST 请求。\n\n此外，退出登录表单中还有一个\
  \ `csrf_field()` 函数，用于向表单和会话中添加一个带有 CSRF 令牌的输入字段，以防止跨站请求伪造。来自外部攻击者的任何提交到此表单的请求都无法通过，因为攻击者很难猜测用户会话中的\
  \ CSRF 令牌，从而无法通过 CSRF 中间件。\n\n该函数的输出看起来如下所示。检查表单以查看生成的隐藏输入，其值为 CSRF 令牌。\n\n```\n\
  <input type=\"hidden\" name=\"_token\" value=\"S50zdnqbwioh0VQN8OoETHecuBUKbRIRLAGs4TaI\"\
  >\n```\n\n---\n\n### 显示欢迎消息\n\n我们将向仪表盘添加一个通知消息，以便在用户登录时欢迎他们。打开 `resources/views/dashboard.blade.php`\
  \ 并更新其内容以匹配下方代码。\n\n```\n@extends('layout.master')\n\n@section('page-title')\n \
  \   Welcome\n@endsection\n\n@section('content')\n    <div class=\"container-fluid\"\
  >\n        <div class=\"alert alert-success mt-4\" role=\"alert\">\n           \
  \ <h4 class=\"alert-heading\">欢迎！</h4>\n            <p>{{auth()->user()->name}}，你已成功登录。我们的库存中有<strong>3</strong>件商品。</p>\n\
  \            <hr>\n        </div>\n    </div>\n@endsection\n```\n\n---\n\n你可以通过\
  \ `auth()->user()` 从 User 模型访问已登录用户的任何属性。如果你试图从一个未受 auth 中间件保护的路由访问已登录用户的详细信息，为了避免报错，你应该首先使用\
  \ `auth()->check()` 在 if 语句中检查用户是否已登录。\n\n`auth()` 函数由 Laravel 在你的每个页面中提供。这就是 Laravel\
  \ 让事情变得如此简单的程度。\n\n在进入下一节之前，让我们更新侧边栏上链接到仪表盘的 URL。打开 `resources/views/layout/partials/_sidenav.blade.php`\
  \ 并使用命名路由更新菜单中的仪表盘 URL。\n\n```\n<a href=\"{{route('inventory.home')}}\" class=\"\
  list-group-item list-group-item-action bg-light\">仪表盘</a>\n```\n\n---\n\n使用命名路由的另一个好处是，将来如果我们决定将仪表盘\
  \ URL 从 `/app` 改为 `/app/dashboard`，我们不需要去到处我们使用过该 URL 的地方进行修改。我们只需在路由文件中进行修改，因为命名路由引用了我们所做的更改，所以我们每次都能获取到新的\
  \ URL。可以把它看作数组中的键值对，键保持不变但值发生变化，既然我们引用的是数组键，每次都能获得更新后的值。\n\n### 创建库存\n\n让我分解允许已登录用户创建新库存的步骤。这将帮助你轻松跟进。我们将按以下顺序构建此功能：\n\
  \n*   创建库存迁移以生成 inventories 表\n*   为 inventories 表创建 Inventory 模型\n*   在模型中定义用户与多个库存之间的关系\n\
  *   创建 Inventory Controller 类\n*   定义 GET 路由以显示创建新库存页面\n*   在 `InventoryController`\
  \ 类中定义 create 方法\n*   创建一个与数据库字段匹配的表单\n*   定义 POST 路由以提交新库存\n*   为库存创建验证\n*   定义\
  \ store 方法以在数据库中创建条目\n*   重定向到新库存页面并显示成功通知\n\n废话不多说，让我们开始吧！好吗？\n\n要创建迁移，请运行：\n\n\
  ```\nphp artisan make:migration create_inventories_table --create=inventories\n\
  ```\n\n---\n\n`--create` 选项用于指示该迁移是否用于创建新表。要编辑现有表，则会传递 `--table` 选项。话虽如此，让我们向迁移中添加字段。Laravel\
  \ 为我们提供了创建不同数据类型的方法，例如 string、int、longText、boolean、带约束的外键等。\n\n对于我们的 inventories\
  \ 表，编辑位于 `database/migrations` 目录下的迁移文件，并更新 `up` 方法的内容以匹配下方代码。`up` 方法是在我们运行 migrate\
  \ 命令创建数据库时调用的，而 `down` 方法，你已经猜到了，是在我们运行回滚迁移命令以从数据库中删除表时调用的。\n\n```\n// up 方法\nSchema::create('inventories',\
  \ function (Blueprint $table) {\n    $table->increments('id');\n    $table->string('item');\n\
  \    $table->integer('quantity');\n    $table->integer('user_id');\n    $table->foreign('user_id')->references('id')->on('users');\n\
  \    $table->softDeletes();\n    $table->timestamps();\n});\n```\n\n---\n\n首先，`increments`\
  \ 方法使用 \"UNSIGNED INTEGER\" 等效类型创建一个自增的 ID 列（主键）。\n\n```\n$table->increments('id');\n\
  ```\n\n---\n\n`string` 方法创建一个 \"VARCHAR\" 等效的 ITEM 列。该方法可以接受第二个参数作为大小，默认为 255。\n\
  \n```\n$table->string('item');\n```\n\n---\n\n`integer` 方法创建一个 \"INTEGER\" 等效的 QUANTITY\
  \ 列。\n\n```\n$table->integer('user_id');\n```\n\n---\n\n`foreign` 方法用于指定外键约束，这些约束用于在数据库层面强制执行引用完整性。它引用\
  \ users 表上的 \"PRIMARY KEY\" ID。我们添加了 `user_id` 列，以便使用用户主键 ID 指定特定库存是由哪个用户创建的。\n\n\
  ```\n$table->foreign('user_id')->references('id')->on('users');\n```\n\n---\n\n\
  `softDeletes` 方法添加可为空的 `deleted_at` 列以支持软删除。这确保了一旦我们调用 Laravel 查询构建器的 delete 方法，当前时间戳将被添加到\
  \ inventories 表的该行上，而不是从表中删除该行。这将有助于我们构建回收站功能。\n\n```\n$table->softDeletes();\n\
  ```\n\n---\n\n\n\n\n\n`timestamps` 方法会添加可为空的 `created_at` 和 `updated_at` “TIMESTAMP”\
  \ 列。当创建新行时，`created_at` 列会使用当前时间戳进行更新，而 `updated_at` 则在行更新时进行更新。最后，从终端或 git bash\
  \ 运行 `migrate` 命令。\n\n```\nphp artisan migrate\n```\n\n现在我们的表已经创建完成，如果你调用 MYSQL\
  \ `DESCRIBE` 命令，我们的 `inventories` 表结构将如下所示。\n\n| Field | Type | Null | Key | Default\
  \ | Extra |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| id | int(10) unsigned\
  \ | NO | PRI | NULL | auto_increment |\n| item | varchar(255) | NO | | NULL | |\n\
  | quantity | int(11) | NO | | NULL | |\n| user_id | int(10) unsigned | NO | MUL\
  \ | NULL | |\n| deleted_at | timestamp | YES | | NULL | |\n| created_at | timestamp\
  \ | YES | | NULL | |\n| updated_at | timestamp | YES | | NULL | |\n\n现在让我们继续为 `inventories`\
  \ 表创建 Inventory 模型。\n\n### 创建 Inventory 模型并定义关系\n\nLaravel 模型代表其所对应的底层数据表的逻辑结构和关系。它允许你轻松查询表中的数据，以及插入新数据。每个表对应一个模型，这使你能够使用\
  \ Laravel ORM（对象关系映射）来与该表进行交互。\n\n要创建模型，Laravel 允许你使用 `artisan` 命令来完成。在终端或 git bash\
  \ 中运行此命令：\n\n```\nphp artisan make:model Inventory\n```\n\n在 `app` 目录下，你会找到 `Inventory.php`\
  \ 类。这是生成模型的默认存储位置。你可以将它们归组在 `app/Models` 目录或任何你想要的位置，但为保持简单，我们将其留在此处。\n\n接下来，让我们在模型中定义该表的关系。同样，Laravel\
  \ 允许我们在多个表上定义不同类型的关系。你可以在对应表的模型中使用 `hasMany` 方法定义一对多关系，使用 `hasOne` 方法定义一对一关系，使用\
  \ `belongsToMany` 方法定义多对多关系，以及其他几种关系。\n\n在我们的案例中，一个用户可以创建/拥有多个库存，反之，一个库存将属于一个用户，因此我们有用户\
  \ `hasMany` 库存和库存 `belongsTo` 用户。让我们在模型中定义这一点。\n\n> **注意**\n>\n> 要了解更多关于在数据库中创建不同列类型的可用方法，可以查看\
  \ [Laravel 文档](https://laravel.com/docs/5.4/migrations#creating-columns) 中的可用列类型。\n\
  \n在我们的 `app/User.php` 模型类中，添加 `inventories` 方法。\n\n```php\npublic function inventories()\n\
  {\n    return $this->hasMany(Inventory::class);\n}\n```\n\n打开 `app/Inventory.php`\
  \ 模型类以定义反向关系。\n\n```php\npublic function ownedBy()\n{\n    return $this->belongsTo(User::class);\n\
  }\n```\n\n此外，在库存模型类中，添加如下受保护属性 `guarded`。\n\n```php\nprotected $guarded = ['id'];\n\
  `\n\n暂时不要困惑。`guarded` 属性是 Laravel `Model` 类（我们的 `Inventory` 模型类继承自该类）已定义的一个继承受保护属性。Laravel\
  \ 允许你使用查询构造器，只需传入一个包含你想要插入的数据的数组，即可将数据批量赋值到数据库中。\n\n有时这可能很糟糕，因为恶意用户可能会猜测你表中的字段并注入有害数据传入你的数据库。因此，为了使某些重要字段免于被批量赋值，比如在我们的例子中的\
  \ `id` 字段（因为我们不希望有人插入他们自己的 id 并破坏我们的自增行为），我们只需使该字段不可批量赋值。最后，因为我们想要实现的软删除功能，我们为此引入了\
  \ `SoftDeletes` trait。\n\n你完整的 `Inventory` 模型类应如下所示：\n\n```php\n<?php\n\nnamespace\
  \ App;\n\nuse Illuminate\\Database\\Eloquent\\Model;\nuse Illuminate\\Database\\\
  Eloquent\\SoftDeletes;\n\nclass Inventory extends Model\n{\n    use SoftDeletes;\n\
  \n    protected $guarded = ['id'];\n\n    public function ownedBy()\n    {\n   \
  \     return $this->belongsTo(User::class);\n    }\n}\n```\n\n### 定义路由、Inventory\
  \ 控制器和请求验证\n\n让我们处理创建库存的业务逻辑。首先，运行 artisan 命令创建一个 Inventory 控制器。为此，请运行以下命令：\n\n\
  ```\nphp artisan make:controller InventoryController\n```\n\n在 `app/Http/Controllers`\
  \ 下，Laravel 将生成 `InventoryController.php` 类。编辑此文件并添加以下占位符方法。我们稍后会更新它们。\n\n```php\n\
  <?php\n\nnamespace App\\Http\\Controllers;\n\nuse Illuminate\\Http\\Request;\n\n\
  class InventoryController extends Controller\n{\n    public function createInventory()\n\
  \    {\n        return view('new-inventory');\n    }\n\n    public function storeInventory()\n\
  \    {\n        //validate & store in db\n    }\n\n    public function viewInventories()\n\
  \    {\n        //retrieve and list\n    }\n}\n```\n\n在我们的路由文件 `app/routes/web.php`\
  \ 中，添加创建、存储和查看库存的 URL。更新路由组以匹配下方内容：\n\n```php\nRoute::group(['prefix' => 'app',\
  \ 'middleware' => 'auth'], function ($route) {\n    $route->get('/', 'AppController@dashboard')->name('inventory.home');\n\
  \    $route->get('/create', 'InventoryController@createInventory')->name('inventory.create');\n\
  \    $route->post('/create', 'InventoryController@storeInventory')->name('inventory.store');\n\
  \    $route->get('/inventories', 'InventoryController@viewInventories')->name('inventory.all');\n\
  \    // 花括号中的值必须与我们要从中删除数据的表的模型匹配，因为这将允许 Laravel 知道要解析哪个类\n    $route->delete('/inventories/{inventory}/drop',\
  \ 'InventoryController@drop')->name('inventory.delete');\n});\n```\n\n接下来，让我们创建一个表单请求验证来验证发送到\
  \ `storeInventory` 方法的请求。我们将为即将创建的创建表单中用户输入的两个字段定义验证规则。一个经验法则是永远不要信任用户输入，并始终致力于验证它们。要创建我们的表单请求，请运行以下命令：\n\
  \n```\nphp artisan make:request StoreInventory\n```\n\n一个新类 `StoreInventory.php`\
  \ 将在 `app/Http/Requests` 目录下创建。编辑此文件。首先，在 `authorize` 方法下，将 `return false` 改为 `return\
  \ true`。现在让我们为表单中将包含的两个输入字段 `item` 和 `quantity` 定义规则。\n\n我们希望 `item` 字段始终为不超过 255\
  \ 个字符的字符串（这是 mysql `VARCHAR` 的最大长度，以避免 mysql 截断数据），`quantity` 字段应为整数，不允许超过 100（假设我们永远不想创建库存超过\
  \ 100 件的库存）。这两个字段均为必填。将 `rules` 方法中返回的空数组替换为下方内容：\n\n```php\nreturn [\n    'item'\
  \ => 'required|string|max:255',\n    'quantity' => 'required|int|max:100'\n];\n\
  ```\n\n> **注意**\n>\n> 要了解更多 Laravel 中可用的验证规则，请访问官方 Laravel 文档的 [可用验证规则](https://laravel.com/docs/5.4/validation#available-validation-rules)\
  \ 部分。\n\n### 创建库存表单和列出库存\n\n\n\n\n在 `app/resources/views` 目录下创建新文件 `new-inventory.blade.php`，该子视图将继承主布局并包含创建库存的表单。将以下代码复制到文件中：\n\
  \n```blade\n@extends('layout.master')\n\n@section('page-title')\n    New Inventory\n\
  @endsection\n\n@section('content')\n    <div class=\"container-fluid\">\n      \
  \  <div class=\"col-12 col-md-8 mt-4\">\n            <form method=\"POST\" action=\"\
  {{ route('inventory.store') }}\">\n                {{ csrf_field() }}\n        \
  \        <div class=\"form-group\">\n                    <label for=\"item\">Item</label>\n\
  \                    <input type=\"text\" value=\"{{ old('item') }}\" class=\"form-control\"\
  \ name=\"item\" id=\"item\" placeholder='e.g 32\" Television'>\n               \
  \     @if ($errors->has('item'))\n                        <small class=\"form-text\
  \ text-danger\">\n                            {{ $errors->first('item') }}\n   \
  \                     </small>\n                    @endif\n                </div>\n\
  \                <div class=\"form-group\">\n                    <label for=\"quantity\"\
  >Quantity</label>\n                    <input type=\"text\" value=\"{{ old('quantity')\
  \ }}\" class=\"form-control\" name=\"quantity\" id=\"quantity\" placeholder=\"e.g\
  \ 50\">\n                    @if ($errors->has('quantity'))\n                  \
  \      <small class=\"form-text text-danger\">\n                            {{ $errors->first('quantity')\
  \ }}\n                        </small>\n                    @endif\n           \
  \     </div>\n                <button type=\"submit\" class=\"btn btn-primary\"\
  >Create New Inventory</button>\n            </form>\n        </div>\n    </div>\n\
  @endsection\n```\n\n---\n\n在新库存视图中有几点需要注意：\n1. 表单向命名路由 `inventory.store` 提交 `POST`\
  \ 请求，我们之前在 `web.php` 文件中将其定义为 `POST` 路由。\n2. 你会注意到一个 `if` 语句检查字段是否未通过 `StoreInventory.php`\
  \ 规则中定义的验证。Laravel 会自动重定向回创建库存页面，并在请求中携带错误消息，因此我们的 `if` 语句检查字段错误是否存在并显示第一个验证失败的错误。\n\
  \n你的字段可能通过一条验证规则但未通过另一条，该规则的错误会被返回；但如果所有验证都通过，请求将继续执行下一个代码块。注意我们在 `value` 字段中使用了\
  \ `old('item')` 和 `old('quantity')`，当表单出错且页面重定向回时，这会获取用户输入的值，这样用户就不必在每次验证器重定向他们回去时重新输入所有值。\n\
  \n在此，我想谈谈一个非常有趣的话题，乍看之下可能会让人困惑，尤其是如果你是初学者的话。\n\n#### 依赖注入与控制器\n\n依赖注入是一种技术，其中一个对象为另一个对象提供其依赖项。“依赖项”是指可在另一个对象中使用的对象。例如，如果你有一个包含\
  \ `start`、`accelerate` 和 `horn` 方法的 `Car` 类，以及一个包含 `repair`、`setNextRepairDate`\
  \ 和 `testDrive` 方法的 `AutoShop` 类。你最初可能会想把属于 `AutoShop` 类的所有方法都塞进 `Car` 类里，但通过 DI（依赖注入），我们可以遵循\
  \ SOLID 设计模式中的单一职责原则。在我们的例子中，我们可以将 `Car` 对象注入到 `AutoShop` 类中，并在 `testDrive` 方法中调用\
  \ `accelerate` 方法，因为试驾汽车需要你加速汽车。\n\nLaravel 允许你通过控制器构造函数（构造函数注入）和控制器方法（方法注入）进行注入，这些将通过服务容器自动解析。下面我们将在\
  \ `store` 方法中注入 `StoreInventory` 对象，随后 Laravel 知道我们注入了一个 Form Request 类，将使用该类中的规则验证传入的请求。\n\
  \n别急着困惑！这只是 Laravel 开箱即用为我们提供的功能，这样我们就不必编写大量代码来执行所有这些操作。\n\n> **注意**\n>\n> 要了解更多关于依赖注入的信息，请访问\
  \ Laravel 文档 [此处](https://laravel.com/docs/5.4/controllers#dependency-injection-and-controllers)。\n\
  \n#### 库存列表视图\n\n在 `app/resources/views` 目录下创建新文件 `view-inventories.blade.php` 并粘贴以下代码。\n\
