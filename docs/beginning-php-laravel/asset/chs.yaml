  \ Blade 模板的 `@foreach` 指令遍历数组，并为每个条目显示项目、数量和操作按钮。这里有一个奇怪的地方需要注意，即 `method_field`\
  \ 用于表单方法伪造。\n\n\n\n## HTML 表单不支持 PUT、PATCH 或 DELETE 操作\n\n因此，当定义从 HTML 表单调用的 `PUT`、`PATCH`\
  \ 或 `DELETE` 路由时，你需要向表单添加一个隐藏的 `_method` 字段。`_method` 字段发送的值将被用作 HTTP 请求方法。\n\n\
  如果你现在刷新浏览器并点击“查看库存”菜单，将看到一个空表格。现在让我们进入数据库插入部分。\n\n### 更新 InventoryController\n\n\
  请更新 `InventoryController` 以匹配下面的代码，我将在之后详细解释。\n\n```php\n<?php\n\nnamespace App\\\
  Http\\Controllers;\n\nuse App\\Http\\Requests\\StoreInventory;\nuse App\\Inventory;\n\
  use Illuminate\\Http\\Request;\n\nclass InventoryController extends Controller\n\
  {\n    public $inventory;\n\n    public function __construct(Inventory $inventory)\n\
  \    {\n        $this->inventory = $inventory;\n    }\n\n    public function createInventory()\n\
  \    {\n        return view('new-inventory');\n    }\n\n    public function storeInventory(StoreInventory\
  \ $storeInventory)\n    {\n        $data = $storeInventory->only('item','quantity');\n\
  \        auth()->user()->inventory()->create($data);\n        $msg = 'New inventory\
  \ successfully added!';\n        return redirect()->route('inventory.all')->with('message',$msg);\n\
  \    }\n\n    public function viewInventories()\n    {\n        $inventories = $this->inventory->all();\n\
  \        return view('view-inventories',compact('inventories'));\n    }\n\n    /**\n\
  \     * @param Inventory $inventory\n     * @return \\Illuminate\\Http\\RedirectResponse\n\
  \     * @throws \\Exception\n     */\n    public function drop(Inventory $inventory)\n\
  \    {\n        $inventory->delete();\n        return redirect()->route('inventory.all')\n\
  \            ->with('message','New inventory successfully added!');\n    }\n}\n\
  ```\n\n---\n\n#### 导入类\n\n我们使用 PHP `use` 关键字导入了 `Inventory` 模型类和 `StoreInventory`\
  \ 表单请求类。\n\n```php\nuse App\\Http\\Requests\\StoreInventory;\nuse App\\Inventory;\n\
  ```\n\n---\n\n#### 依赖注入属性\n\n我们定义了属性 `$inventory` 来保存通过控制器注入的 `$inventory` 模型对象。\n\
  \n```php\npublic $inventory;\n\npublic function __construct(Inventory $inventory)\n\
  {\n    $this->inventory = $inventory;\n}\n```\n\n---\n\n#### 方法注入与表单验证\n\n这里我们对\
  \ `StoreInventory` 对象进行了方法注入。Laravel 会自动解析并检测它是否为表单请求，如果是则应用规则验证传入的数据，这再次体现了 Laravel\
  \ 试图让开发者生活更轻松。\n\n通常当用户提交表单时，你可以使用 PHP `$_POST` 或 `$_GET` 超全局变量访问请求数据。使用 Laravel，你可以从\
  \ `Request` 对象访问数据，该对象可注入到控制器构造函数或控制器方法中。在我们的 `storeInventory` 方法中，注入了 `StoreInventory`\
  \ 表单请求对象，它继承自 `Request` 类，因此我们不需要第二次注入 `Request` 对象即可从当前 HTTP 请求访问 GET 或 POST 数据。\n\
  \nLaravel 在请求类上提供了不同的方法来访问数据：`all()` 方法检索所有请求数据，`only()` 方法指定要检索的键，`get()` 方法访问请求参数。还有其他方法如\
  \ `except`、`intersect`、`input` 等。\n\n我们将通过用户-库存关系在库存模型上调用 `create()` 方法，这样外键 `user_id`\
  \ 将是当前登录用户。插入数据库后，我们将用户重定向到列出所有库存的页面，并显示成功通知消息。\n\n```php\npublic function storeInventory(StoreInventory\
  \ $storeInventory)\n{\n    $data = $storeInventory->only('item','quantity');\n \
  \   auth()->user()->inventory()->create($data);\n    $msg = 'New inventory successfully\
  \ added!';\n    return redirect()->route('inventory.all')->with('message',$msg);\n\
  }\n```\n\n---\n\n#### 查询所有库存\n\n这里我们通过调用库存模型的 `all()` 方法从数据库获取所有库存。还有其他方法，如 `latest()`\
  \ 以降序获取，`first()` 获取匹配 where 条件的第一行，`select()` 选择要返回的字段以及 `get()` 方法。Laravel 为我们提供了更多查询构建器，使从数据库查询数据变得方便，在大多数情况下你不必编写或尝试记住任何\
  \ SQL 查询。\n\n```php\npublic function viewInventories()\n{\n    $inventories = $this->inventory->all();\n\
  \    return view('view-inventories',compact('inventories'));\n}\n```\n\n---\n\n\
  ### 删除库存的两个概念\n\n关于删除库存，有两个概念我想进一步阐述。首先是我们如何定义路由以及如何在列表库存页面的循环中使用它。\n\n在路由定义中，URL\
  \ 的第二个片段是一个路由参数，将被替换为每个库存的 ID。它将由 `route()` 函数生成，我们只需将 ID 作为第二个参数传递给 `route()` 函数。你可以有多个路由参数，在这种情况下，按它们出现的顺序将参数作为数组传递给\
  \ `route()` 函数的第二个参数。\n\n此外，Laravel 还帮助实现了一种称为**路由模型绑定**的功能。当我们向路由注入 ID 时（如本例所示），Laravel\
  \ 会根据 URL 中的类型提示解析 Eloquent 模型，在我们的例子中是 `{inventory}`。简单来说，如果我们的 URL 是 `/inventories/1/drop`，Laravel\
  \ 将在库存模型（`inventories` 表）中查找 ID 为 1 的行并将其返回给控制器。\n\n```php\n// Route definition\n\
  $route->delete('/inventories/{inventory}/drop','InventoryController@drop')->name('inventory.delete');\n\
  \n// Route usage\n{{ route('inventory.delete',$inventory->id) }}\n```\n\n---\n\n\
  #### 控制器中的删除逻辑\n\n这里我们只需对要根据路由模型绑定注入的模型进行类型提示，并调用返回的模型对象上的 `delete()` 方法，这将删除 `inventories`\
  \ 表中对应的行。\n\n最后我们重定向到包含所有库存的页面并显示通知消息。\n\n```php\npublic function drop(Inventory\
  \ $inventory)\n{\n    $inventory->delete();\n    return redirect()->route('inventory.all')\n\
  \        ->with('message','New inventory successfully added!');\n}\n```\n\n---\n\
  \n### 显示通知消息\n\n在编辑器中打开 `resources/views/view-inventories.blade.php`，在开始的 `<table>`\
  \ 标签上方放置下面的代码片段，以显示从控制器闪存到会话中的通知消息。\n\n```blade\n@if(session()->has('message'))\n\
  \    <div class=\"alert alert-info\">\n        {{session('message')}} New inventory\
  \ successfully added!\n    </div>\n@endif\n```\n\n---\n\n### 测试功能\n\n在浏览器中刷新应用，如果已登出则重新登录，点击“新建库存”菜单然后提交空表单。你应该会被重定向回带有输入字段下错误提示的页面。\n\
  \n![表单验证错误](img/image00201.jpeg)\n\n现在填写表单并点击“创建新库存”按钮。你应该会被重定向到列出库存的页面并显示成功通知消息。\n\
  \n![创建成功提示](img/image00202.jpeg)\n\n继续创建任意数量的库存并删除一些。你应该会对我们取得的进展印象深刻。在继续“回收站”功能之前，让我们快速更新仪表盘以反映实际创建的库存数量。\n\
  \n### 更新 AppController\n\n更新 `AppController` 类以匹配下面的代码：\n\n```php\n<?php\n\nnamespace\
  \ App\\Http\\Controllers;\n\nuse App\\Inventory;\nuse Illuminate\\Http\\Request;\n\
  \nclass AppController extends Controller\n{\n    public function dashboard(Inventory\
  \ $inventory)\n    {\n        $count = $inventory->count();\n        return view('dashboard',compact('count'));\n\
  \    }\n}\n```\n\n---\n\n以及 `dashboard.blade.php` 文件的第 11 行。\n\n\n\n## 构建回收站功能\n\
  \n如果你在首选的数据库管理器（如 phpMyAdmin、MySQL Workbench 或 SqlePro）中打开数据库，你会注意到从前端删除的库存实际上仍然存在，只是\
  \ `deleted_at` 列不为 null。这是我们之前讨论的 Laravel 软删除的功能。\n\n让我们创建一个页面来列出所有已删除的库存，并提供恢复它们的操作。听起来很酷对吧？我们可以使用列表库存页面相同的内容，只需稍微编辑操作按钮：一个用于恢复，另一个用于永久删除。但首先，让我们添加额外的路由和控制器方法。\n\
  \n在删除路由后添加以下内容：\n\n```php\n$route->get('/inventories/{inventory}/restore', 'InventoryController@restoreItem')->name('inventory.restore');\n\
  $route->delete('/inventories/{inventory}/purge', 'InventoryController@purgeItem')->name('inventory.purge');\n\
  $route->get('/inventories/trash', 'InventoryController@viewTrash')->name('inventory.trash');\n\
  ```\n\n接下来，将这些路由的方法添加到 `InventoryController` 中。\n\n```php\npublic function viewTrash(Inventory\
  \ $inventory)\n{\n    $inventories = $inventory->onlyTrashed()->get();\n    return\
  \ view('trash', compact('inventories'));\n}\n\npublic function restoreItem($inventory)\n\
  {\n    if ($item = $this->inventory->withTrashed()->find($inventory)) {\n      \
  \  $item->restore();\n    }\n    return redirect()->route('inventory.all')->with('message',\
  \ 'Inventory successfully restored!');\n}\n\npublic function purgeItem($inventory)\n\
  {\n    if ($item = $this->inventory->withTrashed()->find($inventory)) {\n      \
  \  $item->forceDelete();\n    }\n    return redirect()->route('inventory.all')->with('message',\
  \ 'Inventory permanently deleted!');\n}\n```\n\n在恢复和永久删除项目的情况下，我们无法进行路由模型绑定，因为 Laravel\
  \ 认为此模型已从数据库中删除，因此它将始终返回未找到异常。换句话说，我们只需捕获包含库存 ID 的片段，然后使用 `withTrashed()` 方法强制软删除的模型出现在结果中。\n\
  \n在 `resources/views` 目录下创建一个新文件 `trash.blade.php`，并粘贴以下代码。\n\n```blade\n@extends('layout.master')\n\
  \n@section('page-title')\n    Trash\n@endsection\n\n@section('content')\n    <div\
  \ class=\"container-fluid\">\n        <div class=\"col-12 col-md-8 mt-4\">\n   \
  \         @if(session()->has('message'))\n                <div class=\"alert alert-info\"\
  >\n                    {{ session('message') }}\n                </div>\n      \
  \      @endif\n            <table class=\"table table-hover table-bordered\">\n\
  \                <thead>\n                    <tr>\n                        <th\
  \ scope=\"col\">#</th>\n                        <th scope=\"col\">Item</th>\n  \
  \                      <th scope=\"col\">Quantity</th>\n                       \
  \ <th scope=\"col\">Actions</th>\n                    </tr>\n                </thead>\n\
  \                <tbody>\n                    @foreach($inventories as $key => $inventory)\n\
  \                        <tr>\n                            <th scope=\"row\">{{\
  \ $key + 1 }}</th>\n                            <td>{{ $inventory->item }}</td>\n\
  \                            <td>{{ $inventory->quantity }}</td>\n             \
  \               <td>\n                                <a href=\"{{ route('inventory.restore',\
  \ $inventory->id) }}\" class=\"btn btn-outline-primary btn-sm\">Restore</a>\n  \
  \                              <a href=\"#\" class=\"btn btn-outline-danger btn-sm\"\
  \ onclick='event.preventDefault(); document.getElementById(\"delete-inventory-form-{{$key}}\"\
  ).submit();'>\n                                    Purge\n                     \
  \               <form id=\"delete-inventory-form-{{$key}}\" action=\"{{ route('inventory.purge',\
  \ $inventory->id) }}\" method=\"POST\" style=\"display: none;\">\n             \
  \                           {{ csrf_field() }}\n                               \
  \         {{ method_field('DELETE') }}\n                                    </form>\n\
  \                                </a>\n                            </td>\n     \
  \                   </tr>\n                    @endforeach\n                </tbody>\n\
  \            </table>\n        </div>\n    </div>\n@endsection\n```\n\n现在点击侧边栏上的\
  \ Trash 菜单以查看回收站中的项目，尝试永久删除或恢复项目，看看此功能如何工作。\n\n## 编辑库存\n\n编辑库存就像创建它一样简单。首先，我们需要创建一个用于编辑表单的\
  \ GET 路由（采用路由模型绑定实现），以及一个用于表单提交的 POST 路由。我们仍将使用 `StoreInventory` 请求验证类，因为适用相同的验证规则；当然，如果你想尝试添加新的验证规则，也可以创建一个新类。\n\
  \n我们将 `new-inventory.blade.php` 页面的内容复制到 `app/resources/edit-inventory.blade.php`\
  \ 文件中，然后进行一些调整。让我们快速完成吧！\n\n```php\n$route->get('/inventories/{inventory}/edit',\
  \ 'InventoryController@editInventory')->name('inventory.edit');\n$route->put('/inventories/{inventory}/edit',\
  \ 'InventoryController@updateInventory')->name('inventory.update');\n```\n\n打开 `view-inventories.blade.php`\
  \ 第 31 行，更新编辑操作的 href：\n\n```blade\n<a href=\"{{ route('inventory.edit', $inventory->id)\
  \ }}\" class=\"btn btn-outline-primary btn-sm\">Edit</a>\n```\n\n将这些方法添加到你的 `InventoryController`\
  \ 中，用于编辑和更新操作。\n\n```php\npublic function editInventory(Inventory $inventory)\n\
  {\n    return view('edit-inventory', compact('inventory'));\n}\n\n/**\n * @param\
  \ StoreInventory $storeInventory\n * @param Inventory $inventory\n * @return \\\
  Illuminate\\Http\\RedirectResponse\n */\npublic function updateInventory(StoreInventory\
  \ $storeInventory, Inventory $inventory)\n{\n    $inventory->update($storeInventory->only('item',\
  \ 'quantity'));\n    return redirect()->route('inventory.all')->with('message',\
  \ 'Inventory successfully updated!');\n}\n```\n\n最后编辑你的 `edit-inventory.blade.php`\
  \ 以匹配下方内容。\n\n```blade\n@extends('layout.master')\n\n@section('page-title')\n  \
