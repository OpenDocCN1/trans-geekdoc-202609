- raw: "        </div>  \n\n    </div>  \n\n@endsection |\n\n| --- |\n\nGo ahead to\
    \ edit one of your existing inventory, test if the validation works fine by emptying\
    \ the quantity field. Now change the previous value of the quantity field to a\
    \ new value then submit the form, you should be redirected to the list inventories\
    \ page with a  successful notification.\n\nIn my own case, I updated the quantity\
    \ for the Playstation from 4 to 6.\n\n![](Images/image00203.jpeg)\n\n#  \n\n#\
    \  \n\n#  \n\n# CRON JOB & Task Scheduling\n\nLaravel provides us with a way to\
    \ effortlessly, create command schedules within Laravel itself. If you have had\
    \ experience creating cron jobs on a server, you would realise how editing your\
    \ crontab file every now and then to add more tasks is not fluent enough. \n\n\
    When using the scheduler, only a single Cron entry is needed on your server, this\
    \ cron entry runs every minute and checks if any task is due then executes it.\
    \ Our task schedule is defined in the app/Console/Kernel.php file's schedule method.\n\
    \nOpen your Terminal and enter command \n\n| crontab -e |\n\n| --- |\n\nThis is\
    \ to edit your crontab file, paste the below command inside the opened file on\
    \ your terminal. In my own case, my project directory is placed inside my system\
    \ home/Sites directory, you should replace as seen below, also substitute path\
    \ to php bin, you can always find that out by running which php command from your\
    \ terminal.\n\n| //Replace with your directory path//Run which php command in\
    \ terminal to know path exec path  \n\n\\* \\* \\* \\* \\* /path-php-bin/php /path-to-inventory-app-directory/artisan\
    \ schedule:run >> /dev/null 2\\>&1  \n\n//Here is how mine looks like  \n\n\\\
    * \\* \\* \\* \\* /usr/local/bin/php ~/Sites/inventory-app/artisan schedule:run\
    \ >> /dev/null 2\\>&1 |\n\n| --- |\n\nThis will run the php artisan schedule command\
    \ every minute to check if there's any schedule due to be executed. You will soon\
    \ have a better understanding once we create our first Job.\n\nBy default for\
    \ Linux and Mac users, the vim editor will be launched to edit the file, If this\
    \ is your first experience with the vim editor and you are finding it difficult\
    \ to paste into the editor, press the escape key then i key on your keyboard,\
    \ paste the command and edit it to reflect your directory path, finally press\
    \ escape again and shift + colon key on the keyboard then enter wq and hit the\
    \ enter key. You will get the response crontab: installing new crontab.\n\n##\
    \ Defining a Job\n\nWe will define a job to check if an inventory has been in\
    \ the trash ( equivalent of  soft delete) for more than 3 mins then, force delete\
    \ it from the database. In real life we would probably check for items in trash\
    \ that have used more than 3 - 5 days but for this tutorial we can’t wait that\
    \ long, the same codebase for 3 minutes will work for 3 days check, you only need\
    \ to change the time difference.\n\nRun command below in your terminal\n\n|  php\
    \ artisan make:job ClearTrash |\n\n| --- |\n\nIf you check app/Jobs directory,\
    \ you will see the generated ClearTrash class. The handle method will hold the\
    \ code that will get executed, every minute to check if we have item in trash\
    \ deleted over 3 mins ago.\n\n| <?php  \n\nnamespace App\\\\Jobs;  \n\nuse App\\\
    \\Inventory;  \n\nuse DateInterval;  \n\nuse DateTime;  \n\nuse Illuminate\\\\\
    Bus\\\\Queueable;  \n\nuse Illuminate\\\\Queue\\\\SerializesModels;  \n\nuse Illuminate\\\
    \\Queue\\\\InteractsWithQueue;  \n\nuse Illuminate\\\\Contracts\\\\Queue\\\\ShouldQueue;\
    \  \n\nuse Illuminate\\\\Foundation\\\\Bus\\\\Dispatchable;  \n\nclass ClearTrash\
    \ implements ShouldQueue  \n\n{  \n\n    use Dispatchable, InteractsWithQueue,\
    \ Queueable, SerializesModels;  \n\n    /\\*\\*  \n\n     \\* Create a new job\
    \ instance.  \n\n     \\*  \n\n     \\*/  \n\n    public function \\_\\_construct()\
    \  \n\n    {  \n\n        //  \n\n    }  \n\n    /\\*\\*  \n\n     \\* Execute\
    \ the job.  \n\n     \\*  \n\n     \\* @param Inventory $inventory  \n\n     \\\
    * @return void  \n\n     \\* @throws \\\\Exception  \n\n     \\*/  \n\n    public\
    \ function handle(Inventory $inventory)  \n\n    {  \n\n        $now = new DateTime('now');\
    \  \n\n        $threeMinutesDiff = new DateInterval('PT03M');  \n\n        $threeMinutesAgo\
    \ = $now->sub($threeMinutesDiff)->format('Y-m-d H:i:s');  \n\n        $inventories\
    \ = $inventory->onlyTrashed()->where('deleted\\_at','<=',$threeMinutesAgo)->get();\
    \  \n\n        foreach($inventories as $inventory){  \n\n            $inventory->forceDelete();\
    \  \n\n        }  \n\n    }  \n\n} |\n\n| --- |\n\nOn your terminal from our inventory\
    \ project directory, run command \n\n| php artisan queue:listen |\n\n| --- |\n\
    \nThis command runs the queue worker that will process new jobs as they are pushed\
    \ onto the queue. In a real live scenario, we would be using a process monitor\
    \ such as Supervisor to ensure that the queue worker does not stop running permanently\
    \ in the background.\n\nTo confirm if this works, go ahead to delete an inventory,\
    \ view your trash to see if the item is in trash, wait for an additional 3 mins,\
    \ then refresh your trash. You will notice the trash is now empty and if you check\
    \ your database from your database manager, you won’t see it there either.\n\n\
    ## Sending Email\n\nSending email with Laravel can’t be more easier and fun. \
    \ Let us send an email to a user informing the user that items in trash has just\
    \ been cleared. \n\nLaravel supports both SMTP and PHP's \"mail\" function as\
    \ drivers for the sending of email. You may specify which one you're using throughout\
    \ your application here. By default, Laravel is set up for SMTP mail. Laravel\
    \ provides support for sending email via API or SMTP for the following service\
    \ providers; sendmail, mailgun, mandrill, amazon ses and sparkpost. I personally\
    \ prefer using mailgun, you can decide to use it or choose another service provider.\n\
    \nBut for the purpose of this tutorial, we would be using a fake smtp server called\
    \ [mailtrap.io](http://mailtrap.io). Open a free account, set it up and choose\
    \ Laravel as your framework then get your SMTP details as below and enter it into\
    \ the corresponding key in your .env. Changing to a live smtp server is as easy\
    \ as replacing the smtp details in your .env with the new one provided by the\
    \ service provider.\n\n![](Images/image00204.jpeg)\n\nIn the .env locate and replace\
    \ the value appropriately.\n\n| MAIL\\_DRIVER=smtp  \n\nMAIL\\_HOST=smtp.mailtrap.io\
    \  \n\nMAIL\\_PORT=2525  \n\nMAIL\\_USERNAME=33fcd1c32ab794  \n\nMAIL\\_PASSWORD=8a169e3a907b5d\
    \  \n\nMAIL\\_ENCRYPTION=null  \n\nMAIL\\_FROM\\_ADDRESS=notification@laraventory.com\
    \  \n\nMAIL\\_FROM\\_NAME=Laraventory |\n\n| --- |\n\nANytime you make changes\
    \ to your .env file, stop the current running php artisan serve command and run\
    \ it again. Next from your terminal, run the command below to create an email\
    \ and a markdown template  for the email.\n\n| php artisan make:mail TrashNotification\
    \ --markdown email/trash-notification |\n\n| --- |\n\nUnder app/Mail a TrashNotification\
    \ class to handle our email will be auto generated and under resources/views/email\
    \ the trash-notification.blade.php file with a placeholder markdown will also\
    \ be generated. \n\nUpdate the email template to show a better message, you can\
    \ likewise edit to your preference.\n\n| @component('mail::message')  \n\n\\#\
    \ Notification  \n\nThis is a friendly notification to notify you that I just\
    \ completed clearing the inventory trash.  \n\n@component('mail::button', \\['url'\
    \ => route('inventory.trash')\\])  \n\nView Trash  \n\n@endcomponent  \n\nThanks,<br\\\
    >  \n\n{{ config('app.name') }}  \n\n@endcomponent |\n\n| --- |\n\nFinally update\
    \ the ClearTrash.php class in the Jobs directory to send an email after clearing\
    \ the trash.\n\n| <?php  \n\nnamespace App\\\\Jobs;  \n\nuse App\\\\Inventory;\
    \  \n\nuse DateInterval;  \n\nuse DateTime;  \n\nuse Illuminate\\\\Bus\\\\Queueable;\
    \  \n\nuse Illuminate\\\\Queue\\\\SerializesModels;  \n\nuse Illuminate\\\\Queue\\\
    \\InteractsWithQueue;  \n\nuse Illuminate\\\\Contracts\\\\Queue\\\\ShouldQueue;\
    \  \n\nuse Illuminate\\\\Foundation\\\\Bus\\\\Dispatchable;  \n\nuse Illuminate\\\
    \\Support\\\\Facades\\\\Mail;  \n\nclass ClearTrash implements ShouldQueue  \n\
    \n{  \n\n    use Dispatchable, InteractsWithQueue, Queueable, SerializesModels;\
    \  \n\n    /\\*\\*  \n\n     \\* Create a new job instance.  \n\n     \\*  \n\n\
         \\*/  "
