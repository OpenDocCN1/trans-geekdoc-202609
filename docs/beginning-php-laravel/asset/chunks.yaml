    \    <button class=\"navbar-toggler\" type=\"button\" data-toggle=\"collapse\"\
    \ data-target=\"#navbarSupportedContent\" aria-controls=\"navbarSupportedContent\"\
    \ aria-expanded=\"false\" aria-label=\"Toggle navigation\">\n        <span class=\"\
    navbar-toggler-icon\"></span>\n    </button>\n    <div class=\"collapse navbar-collapse\"\
    \ id=\"navbarSupportedContent\">\n        <ul class=\"navbar-nav ml-auto mt-2\
    \ mt-lg-0\">\n            <li class=\"nav-item active\">\n                <a class=\"\
    nav-link\" href=\"#\">Home <span class=\"sr-only\">(current)</span></a>\n    \
    \        </li>\n            <li class=\"nav-item\">\n                <a class=\"\
    nav-link\" href=\"#\">Link</a>\n            </li>\n            <li class=\"nav-item\
    \ dropdown\">\n                <a class=\"nav-link dropdown-toggle\" href=\"#\"\
    \ id=\"navbarDropdown\" role=\"button\" data-toggle=\"dropdown\" aria-haspopup=\"\
    true\" aria-expanded=\"false\">\n                    Dropdown\n              \
    \  </a>\n                <div class=\"dropdown-menu dropdown-menu-right\" aria-labelledby=\"\
    navbarDropdown\">\n                    <a class=\"dropdown-item\" href=\"#\">Action</a>\n\
    \                    <a class=\"dropdown-item\" href=\"#\">Another action</a>\n\
    \                    <div class=\"dropdown-divider\"></div>\n                \
    \    <a class=\"dropdown-item\" href=\"#\">Something else here</a>\n         \
    \       </div>\n            </li>\n        </ul>\n    </div>\n</nav>\n```\n\n\
    ## 使用 `@include` 指令引入局部视图\n\n使用 `Blade` 模板的 `@include` 指令（类似 PHP 的 `include` 函数）替换所有提取的部分。\n\
    \n```blade\n// 替换头部标签位置\n@include('layout.partials._header')\n\n// 替换侧边栏位置\n@section('sidenav')\n\
    \    @include('layout.partials._sidenav')\n@show\n\n// 替换导航栏位置\n@section('navbar')\n\
    \    @include('layout.partials._navbar')\n@show\n\n// 替换脚本标签位置\n@include('layout.partials._footer')\n\
    ```\n\n> **注意**\n>\n> `@section` 指令允许我们定义可以在单独子视图中覆盖的区块。\n\n## 重构 `welcome.blade.php`\n\
    \n将 `welcome.blade.php` 的内容替换为以下代码：\n\n```blade\n@extends('layout.master')\n\n\
    @section('content')\n    // Content specific to this child page will appear here\n\
    @endsection\n```\n\n## 完成主布局模板\n\n从主模板中提取 `class=\"container-fluid\"` 的 `div`\
    \ 内部的所有内容，粘贴到 `welcome.blade.php` 的 `content` 区块中，然后在主模板中用 `@yield('content')`\
    \ 替换提取的位置。最终 `master.blade.php` 应如下所示：\n\n```blade\n// resources/views/layout/master.blade.php\n\
    \n<!DOCTYPE html>\n<html lang=\"en\">\n@include('layout.partials._header')\n<body>\n\
    <div class=\"d-flex\" id=\"wrapper\">\n    @section('sidenav')\n        @include('layout.partials._sidenav')\n\
    \    @show\n    <div id=\"page-content-wrapper\">\n        @section('navbar')\n\
    \            @include('layout.partials._navbar')\n        @show\n        @yield('content')\n\
    \    </div>\n</div>\n@include('layout.partials._footer')\n</body>\n</html>\n```\n\
    \n## 页面标题动态化\n\n注意 `@yield('content')` 指令的用法，`content` 参数可以自定义（如 `child-page`），但在大多数情况下\
    \ `content` 即可满足需求，因为它只是用来引用子视图中将要放置的区块。\n\n我们也可以在 `<head>` 标签内使用 `@yield` 指令为每个子视图定义页面标题。\n\
    \n```blade\n// 替换此行\n<title>Simple Sidebar - Start Bootstrap Template</title>\n\
    \n// 替换为\n<title> Inventory App - @yield('page-title') </title>\n```\n\n## 最终的\
    \ `welcome.blade.php`\n\n```blade\n@extends('layout.master')\n\n@section('page-title')\n\
    \    Welcome\n@endsection\n\n@section('content')\n    <div class=\"container-fluid\"\
    >\n```\n\n"
