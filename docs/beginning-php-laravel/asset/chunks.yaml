    \ \n\n@endsection |\n\n| --- |\n\nNow, we need to setup our app routes, located\
    \ at routes/web.php and create a controller called AppController.php. From your\
    \ terminal or git bash run\n\n| php artisan make:controller AppController |\n\n\
    | --- |\n\nA class of AppController will be generated in the app/Http/Controllers\
    \ directory. Laravel allows you define a route (url basically) for a controller\
    \ which in return renders a view or returns data, which maybe either be fetched\
    \ from the database or not, manipulated or not and in return passed  to a view(.blade\
    \ files) to be rendered or JSON data as an end point.  This will all be clear\
    \ to you shortly.\n\nLocate routes/web.php where Laravel allows us to define web\
    \ routes then override the whole content with the code below.\n\n| <?php  \n\n\
    Auth::routes();  \n\nRoute::get('/', function () {  \n\n    return redirect()->route('inventory.home');\
    \  \n\n});  \n\nRoute::group(\\['prefix' => 'app','middleware' => 'auth'\\],function($route){\
    \  \n\n    $route->get('/', 'AppController@dashboard')->name('inventory.home');\
    \  \n\n}); |\n\n| --- |\n\nWhat we did here is to define a group route. Laravel\
    \ allows us to define a group route so we can apply the same url prefix , middleware\
    \ and a few other options to all routes in that group. In our case we applied\
    \ a prefix of app and a middleware of auth.  All URL in this group starts with\
    \ /app prefix and the middleware auth prevent any user not logged to not be able\
    \ to access all route in this group, also notice the name function that allows\
    \ us give an alias name which can defined to be  easily memorizable,, in our case\
    \ we named the route that renders our dashboard  inventory.home  and referenced\
    \ it in a redirect when a user visits the / route from their browser.\n\n��Note\n\
    \nMiddleware provides a convenient mechanism for filtering HTTP requests entering\
    \ your application. Laravel auth middleware verifies the user of your application\
    \ is login. If the user is not, the user will be redirected to the login screen.\
    \ However, if the user is logged in, the middleware will allow the request to\
    \ proceed further into the application.There are [several middlewares](https://laravel.com/docs/5.8/middleware)\
    \ already shipped with Laravel or you can create additional middleware yourself.\n\
    \nLaravel allows you define routes based on the requests type, there are the get,\
    \ post, put, delete and any request methods. To view a page, the get route is\
    \ applicable, to submit a form the post route is applicable, to update a form\
    \ the put route is applicable and likewise for dropping a row in the database\
    \ the delete route is. If you are new to this it might look very strange but in\
    \ actual fact this are just http verbs.\n\nUsing our /app url definitions as a\
    \ case study, we defined a get  request type. When users visit the url the method\
    \ dashboard in AppController is called.\n\n| $route->get('/', 'AppController@dashboard')->name('inventory.home');\
    \ |\n\n| --- |\n\nAnother case study is a basic form of defining Laravel route,\
    \ by passing a Closure that can return a response in the form of a view, data\
    \ or redirect. In our case we returned a redirect to our app dashboard.\n\n| Route::get('/',\
    \ function () {  \n\n    return redirect()->route('inventory.home');  \n\n});\
    \ |\n\n| --- |\n\nNext open the AppController and add the method dashboard inside\
    \ the AppController Class.\n\n| public function dashboard()  \n\n{  \n\n    return\
    \ view('dashboard');  \n\n} |\n\n| --- |\n\nNow if you visit http://127.0.0.1:\
    \ 8000/app you will be redirected back to login if you are not authenticated,\
    \ now that the route to our dashboard is protected with the auth middleware.\n\
    \nOpen this two files, Http/Controllers/Auth/LoginController.php and Http/Controllers/Auth/RegisterController.php \
    \ in your editor and change the redirect url property from /home to /app since\
    \ there is no /home route defined again.\n\nYour files should be updated to look\
    \ like below\n\n| protected $redirectTo = '/app'; |\n\n| --- |\n\n## Hello Laravel\
    \ Migrations, Goodbye to Labouring"
