    \ </a\\>  \n\n              <div class=\"dropdown-menu dropdown-menu-right\" aria-labelledby=\"\
    navbarDropdown\"\\>  \n\n                <a class=\"dropdown-item\" href=\"#\"\
    \\>Action</a\\>  \n\n                <a class=\"dropdown-item\" href=\"#\"\\>Another\
