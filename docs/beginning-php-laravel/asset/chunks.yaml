    \  \n\n    </div>  \n\n@endsection |\n\n| --- |\n\nFew things to take note of\
    \ in our new inventory view, is one, the form submits a POST request to the named\
    \ route inventory.store which we defined earlier as a POST route in the web.php\
    \ file and  secondly you will notice an if else statement checking if the field\
    \ doesn’t pass the validation we defined in the StoreInventory.php rules, Laravel\
    \ automatically redirects back to the create inventory page with the error messages\
    \ in the request, so our if statement checks if the field error exists in shows\
    \ the first error that fails validation. \n\nYour field could pass one validation\
    \ rule and fail the other, the error for that rule would be returned but if all\
    \ validation passes, the request proceeds to execute the next code block. Notice\
    \ the use of old(‘item’) and old(‘quantity’) in our value field, what this does\
    \ is when we have an error in the form and the page redirects back, it gets the\
    \ value entered by the user into the field so user doesn’t have to retype all\
    \ the values everytime the validator redirects them back.\n\nWhile we are at this,\
    \ I would like to talk about a very interesting topic  that might seem confusing\
    \ at first especially if you are new to it.\n\n### Dependency Injection & Controllers\n\
    \nDependency injection is a technique whereby one object supplies the dependencies\
    \ of another object. A \"dependency\" is an object that can be used in another\
    \ object. For example if you have a class Car with methods start, accelerate and\
    \ horn, and another class AutoShop with methods repair, setNextRepairDate and\
    \ testDrive. You might initially be tempted to pack all methods that belong to\
    \ the AutoShop Class inside the Car class but with DI(Dependency Injection) we\
    \ can follow the Single Responsibility principle of the SOLID design pattern.\
    \ In our case we can inject the Car object into the AutoShop class and call the\
    \ accelerate method in the testDrive method, since test driving a car requires\
    \ you to accelerate the car.\n\nLaravel allows you to inject through the controller\
    \ constructor (Constructor Injection) and controller methods (Method Injection)\
    \ which will be automatically resolved via the service container. Below we would\
    \ be injecting the StoreInventory object in the store method, then Laravel knowing\
    \ that we injected a Form Request class will use the rule in the class to validate\
    \ the incoming request.\n\nDon’t get confused just yet! It's just what Laravel\
    \ provides for us outside the box so we don’t have to write multiple codes to\
    \ perform all this action. \n\n��Note\n\nTo learn more on Dependency Injection,\
    \ visit the laravel documentation [here](https://laravel.com/docs/5.4/controllers#dependency-injection-and-controllers).\n\
    \n### The List Inventory View\n\nCreate a new file view-inventories.blade.php\
    \ inside the app/resources/view directory and paste the below code.\n\n| @extends('layout.master')\
    \  \n\n@section('page-title')  \n\n    New Inventory  \n\n@endsection  \n\n@section('content')\
    \  \n\n    <div class\\=\"container\\-fluid\">  \n\n        <div class\\=\"col\\\
    -12 col\\-md\\-8 mt\\-4\">  \n\n            <table class\\=\"table table\\-hover\
    \ table\\-bordered\">  \n\n                <thead\\>  \n\n                <tr\\\
    >  \n\n                    <th scope\\=\"col\">#</th\\>  \n\n                   \
    \ <th scope\\=\"col\">Item</th\\>  \n\n                    <th scope\\=\"col\"\
    >Quantity</th\\>  \n\n                    <th scope\\=\"col\">Actions</th\\> \
    \ \n\n                </tr\\>  \n\n                </thead\\>  \n\n               \
    \ <tbody\\>  \n\n                @foreach($inventories as $key => $inventory)\
    \  \n\n                    <tr\\>  \n\n                        <th scope\\=\"\
    row\">{{$key + 1}}</th>  \n\n                        <td>{{$inventory->item}}</td>\
    \  \n\n                        <td>{{$inventory->quantity}}</td>  \n\n                       \
    \ <td>  \n\n                            <a href=\"#\" class\\=\"btn btn\\-outline\\\
    -primary btn\\-sm\">Edit</a\\>  \n\n                            <a href\\=\"#\"\
    \ class\\=\"btn btn\\-outline\\-danger btn\\-sm\" onclick\\='event.preventDefault();\
    \ document.getElementById(\"delete\\-inventory\\-form\\-{{$key}}\").submit();'>\
    \  \n\n                                Delete  \n\n                               \
    \ <form id=\"delete-inventory-form-{{$key}}\" action=\"{{ route('inventory.delete',$inventory->id)\
    \ }}\" method=\"POST\" style=\"display: none;\">  \n\n                                   \
    \ {{ csrf\\_field() }}  \n\n                                </form>  \n\n                           \
    \ </a>  \n\n                        </td>  \n\n                    </tr>  \n\n\
                    @endforeach  \n\n                </tbody>  \n\n            </table>\
    \  \n\n        </div>  \n\n    </div>  \n\n@endsection |\n\n| --- |\n\nNext update\
    \ your layout/partials/\\_sidenav.blade.php , so as to add the create and logout\
    \ routes for easy navigation.\n\n| <div class\\=\"bg\\-light border\\-right\"\
    \ id\\=\"sidebar\\-wrapper\">  \n\n    <div class\\=\"sidebar\\-heading\">{{config('app.name')}}</div>\
    \  \n\n    <div class\\=\"list\\-group list\\-group\\-flush\">  \n\n        <a\
    \ href\\=\"{{route('inventory.home')}}\" class=\"list\\-group-item list\\-group-item-action\
    \ bg-light\">Dashboard</a>  \n\n        <a href=\"{{route('inventory.all')}}\"\
    \ class=\"list\\-group-item list\\-group-item-action bg-light\">View Inventories</a>\
    \  \n\n        <a href=\"{{route('inventory.create')}}\" class=\"list\\-group-item\
    \ list\\-group-item-action bg-light\">New Inventory</a>  \n\n        <a href=\"\
    #\" class=\"list-group-item list-group-item-action bg-light\">Trash</a>  \n\n\
            <a href=\"#\" class\\=\"list\\-group\\-item list\\-group\\-item\\-action\
    \ bg\\-light\" onclick\\=\"event.preventDefault(); document.getElementById('logout\\\
    -form').submit();\">  \n\n            Logout  \n\n            <form id\\=\"logout\\\
    -form\" action\\=\"{{ route('logout') }}\" method=\"POST\" style=\"display: none;\"\
    >  \n\n                {{ csrf\\_field() }}                {{method\\_field('DELETE')}}\
    \  \n\n            </form>  \n\n        </a>  \n\n    </div>  \n\n</div> |\n\n\
    | --- |\n\nSoon you will see from our controller how the inventory array of objects,\
    \ containing a list of all   inventories in the database , is passed to our view.\
    \ We used blade template @foreach directive to loop through the array and display\
    \ the item, quantity and action buttons for each entry. One strange thing to note\
    \ here is the method\\_field which is used for Form Method Spoofing."
  fmt: "\n在 `app/resources/views` 目录下创建新文件 `new-inventory.blade.php`，该子视图将继承主布局并包含创建库存的表单。将以下代码复制到文件中：\n\
    \n```blade\n@extends('layout.master')\n\n@section('page-title')\n    New Inventory\n\
    @endsection\n\n@section('content')\n    <div class=\"container-fluid\">\n    \
    \    <div class=\"col-12 col-md-8 mt-4\">\n            <form method=\"POST\" action=\"\
    {{ route('inventory.store') }}\">\n                {{ csrf_field() }}\n      \
    \          <div class=\"form-group\">\n                    <label for=\"item\"\
    >Item</label>\n                    <input type=\"text\" value=\"{{ old('item')\
    \ }}\" class=\"form-control\" name=\"item\" id=\"item\" placeholder='e.g 32\"\
    \ Television'>\n                    @if ($errors->has('item'))\n             \
    \           <small class=\"form-text text-danger\">\n                        \
    \    {{ $errors->first('item') }}\n                        </small>\n        \
    \            @endif\n                </div>\n                <div class=\"form-group\"\
    >\n                    <label for=\"quantity\">Quantity</label>\n            \
    \        <input type=\"text\" value=\"{{ old('quantity') }}\" class=\"form-control\"\
    \ name=\"quantity\" id=\"quantity\" placeholder=\"e.g 50\">\n                \
    \    @if ($errors->has('quantity'))\n                        <small class=\"form-text\
    \ text-danger\">\n                            {{ $errors->first('quantity') }}\n\
    \                        </small>\n                    @endif\n              \
    \  </div>\n                <button type=\"submit\" class=\"btn btn-primary\">Create\
    \ New Inventory</button>\n            </form>\n        </div>\n    </div>\n@endsection\n\
    ```\n\n---\n\n在新库存视图中有几点需要注意：\n1. 表单向命名路由 `inventory.store` 提交 `POST` 请求，我们之前在\
    \ `web.php` 文件中将其定义为 `POST` 路由。\n2. 你会注意到一个 `if` 语句检查字段是否未通过 `StoreInventory.php`\
    \ 规则中定义的验证。Laravel 会自动重定向回创建库存页面，并在请求中携带错误消息，因此我们的 `if` 语句检查字段错误是否存在并显示第一个验证失败的错误。\n\
    \n你的字段可能通过一条验证规则但未通过另一条，该规则的错误会被返回；但如果所有验证都通过，请求将继续执行下一个代码块。注意我们在 `value` 字段中使用了\
    \ `old('item')` 和 `old('quantity')`，当表单出错且页面重定向回时，这会获取用户输入的值，这样用户就不必在每次验证器重定向他们回去时重新输入所有值。\n\
    \n在此，我想谈谈一个非常有趣的话题，乍看之下可能会让人困惑，尤其是如果你是初学者的话。\n\n### 依赖注入与控制器\n\n依赖注入是一种技术，其中一个对象为另一个对象提供其依赖项。“依赖项”是指可在另一个对象中使用的对象。例如，如果你有一个包含\
    \ `start`、`accelerate` 和 `horn` 方法的 `Car` 类，以及一个包含 `repair`、`setNextRepairDate`\
    \ 和 `testDrive` 方法的 `AutoShop` 类。你最初可能会想把属于 `AutoShop` 类的所有方法都塞进 `Car` 类里，但通过\
    \ DI（依赖注入），我们可以遵循 SOLID 设计模式中的单一职责原则。在我们的例子中，我们可以将 `Car` 对象注入到 `AutoShop` 类中，并在\
    \ `testDrive` 方法中调用 `accelerate` 方法，因为试驾汽车需要你加速汽车。\n\nLaravel 允许你通过控制器构造函数（构造函数注入）和控制器方法（方法注入）进行注入，这些将通过服务容器自动解析。下面我们将在\
    \ `store` 方法中注入 `StoreInventory` 对象，随后 Laravel 知道我们注入了一个 Form Request 类，将使用该类中的规则验证传入的请求。\n\
    \n别急着困惑！这只是 Laravel 开箱即用为我们提供的功能，这样我们就不必编写大量代码来执行所有这些操作。\n\n> **Note**\n>\n> 要了解更多关于依赖注入的信息，请访问\
    \ Laravel 文档 [此处](https://laravel.com/docs/5.4/controllers#dependency-injection-and-controllers)。\n\
    \n### 库存列表视图\n\n在 `app/resources/views` 目录下创建新文件 `view-inventories.blade.php`\
    \ 并粘贴以下代码。\n\n```blade\n@extends('layout.master')\n\n@section('page-title')\n\
    \    New Inventory\n@endsection\n\n@section('content')\n    <div class=\"container-fluid\"\
    >\n        <div class=\"col-12 col-md-8 mt-4\">\n            <table class=\"table\
    \ table-hover table-bordered\">\n                <thead>\n                   \
    \ <tr>\n                        <th scope=\"col\">#</th>\n                   \
    \     <th scope=\"col\">Item</th>\n                        <th scope=\"col\">Quantity</th>\n\
    \                        <th scope=\"col\">Actions</th>\n                    </tr>\n\
    \                </thead>\n                <tbody>\n                    @foreach($inventories\
    \ as $key => $inventory)\n                        <tr>\n                     \
    \       <th scope=\"row\">{{ $key + 1 }}</th>\n                            <td>{{\
    \ $inventory->item }}</td>\n                            <td>{{ $inventory->quantity\
    \ }}</td>\n                            <td>\n                                <a\
    \ href=\"#\" class=\"btn btn-outline-primary btn-sm\">Edit</a>\n             \
    \                   <a href=\"#\" class=\"btn btn-outline-danger btn-sm\" onclick='event.preventDefault();\
    \ document.getElementById(\"delete-inventory-form-{{ $key }}\").submit();'>\n\
    \                                    Delete\n                                \
    \    <form id=\"delete-inventory-form-{{ $key }}\" action=\"{{ route('inventory.delete',\
    \ $inventory->id) }}\" method=\"POST\" style=\"display: none;\">\n           \
    \                             {{ csrf_field() }}\n                           \
    \         </form>\n                                </a>\n                    \
    \        </td>\n                        </tr>\n                    @endforeach\n\
    \                </tbody>\n            </table>\n        </div>\n    </div>\n\
    @endsection\n```\n\n---\n\n接下来更新 `layout/partials/_sidenav.blade.php`，以添加创建和登出路由以便于导航。\n\
    \n```blade\n<div class=\"bg-light border-right\" id=\"sidebar-wrapper\">\n   \
    \ <div class=\"sidebar-heading\">{{ config('app.name') }}</div>\n    <div class=\"\
    list-group list-group-flush\">\n        <a href=\"{{ route('inventory.home') }}\"\
    \ class=\"list-group-item list-group-item-action bg-light\">Dashboard</a>\n  \
    \      <a href=\"{{ route('inventory.all') }}\" class=\"list-group-item list-group-item-action\
    \ bg-light\">View Inventories</a>\n        <a href=\"{{ route('inventory.create')\
    \ }}\" class=\"list-group-item list-group-item-action bg-light\">New Inventory</a>\n\
    \        <a href=\"#\" class=\"list-group-item list-group-item-action bg-light\"\
    >Trash</a>\n        <a href=\"#\" class=\"list-group-item list-group-item-action\
    \ bg-light\" onclick=\"event.preventDefault(); document.getElementById('logout-form').submit();\"\
    >\n            Logout\n            <form id=\"logout-form\" action=\"{{ route('logout')\
    \ }}\" method=\"POST\" style=\"display: none;\">\n                {{ csrf_field()\
    \ }}\n                {{ method_field('DELETE') }}\n            </form>\n    \
    \    </a>\n    </div>\n</div>\n```\n\n---\n\n很快你将从控制器中看到，包含数据库中所有库存列表的库存对象数组是如何传递给视图的。我们使用\
    \ Blade 模板的 `@foreach` 指令遍历数组，并为每个条目显示项目、数量和操作按钮。这里有一个奇怪的地方需要注意，即 `method_field`\
    \ 用于表单方法伪造。\n"
