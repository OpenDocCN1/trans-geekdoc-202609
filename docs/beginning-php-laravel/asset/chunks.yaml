    \   <h4 class=\"alert-heading\">欢迎！</h4>\n            <p>{{auth()->user()->name}}，你已成功登录。我们的库存中有<strong>3</strong>件商品。</p>\n\
    \            <hr>\n        </div>\n    </div>\n@endsection\n```\n\n---\n\n你可以通过\
    \ `auth()->user()` 从 User 模型访问已登录用户的任何属性。如果你试图从一个未受 auth 中间件保护的路由访问已登录用户的详细信息，为了避免报错，你应该首先使用\
    \ `auth()->check()` 在 if 语句中检查用户是否已登录。\n\n`auth()` 函数由 Laravel 在你的每个页面中提供。这就是\
    \ Laravel 让事情变得如此简单的程度。\n\n在进入下一节之前，让我们更新侧边栏上链接到仪表盘的 URL。打开 `resources/views/layout/partials/_sidenav.blade.php`\
    \ 并使用命名路由更新菜单中的仪表盘 URL。\n\n```\n<a href=\"{{route('inventory.home')}}\" class=\"\
    list-group-item list-group-item-action bg-light\">仪表盘</a>\n```\n\n---\n\n使用命名路由的另一个好处是，将来如果我们决定将仪表盘\
    \ URL 从 `/app` 改为 `/app/dashboard`，我们不需要去到处我们使用过该 URL 的地方进行修改。我们只需在路由文件中进行修改，因为命名路由引用了我们所做的更改，所以我们每次都能获取到新的\
    \ URL。可以把它看作数组中的键值对，键保持不变但值发生变化，既然我们引用的是数组键，每次都能获得更新后的值。\n\n## 创建库存\n\n让我分解允许已登录用户创建新库存的步骤。这将帮助你轻松跟进。我们将按以下顺序构建此功能：\n\
    \n*   创建库存迁移以生成 inventories 表\n*   为 inventories 表创建 Inventory 模型\n*   在模型中定义用户与多个库存之间的关系\n\
    *   创建 Inventory Controller 类\n*   定义 GET 路由以显示创建新库存页面\n*   在 `InventoryController`\
    \ 类中定义 create 方法\n*   创建一个与数据库字段匹配的表单\n*   定义 POST 路由以提交新库存\n*   为库存创建验证\n*  \
    \ 定义 store 方法以在数据库中创建条目\n*   重定向到新库存页面并显示成功通知\n\n废话不多说，让我们开始吧！好吗？\n\n要创建迁移，请运行：\n\
    \n```\nphp artisan make:migration create_inventories_table --create=inventories\n\
    ```\n\n---\n\n`--create` 选项用于指示该迁移是否用于创建新表。要编辑现有表，则会传递 `--table` 选项。话虽如此，让我们向迁移中添加字段。Laravel\
    \ 为我们提供了创建不同数据类型的方法，例如 string、int、longText、boolean、带约束的外键等。\n\n对于我们的 inventories\
    \ 表，编辑位于 `database/migrations` 目录下的迁移文件，并更新 `up` 方法的内容以匹配下方代码。`up` 方法是在我们运行 migrate\
    \ 命令创建数据库时调用的，而 `down` 方法，你已经猜到了，是在我们运行回滚迁移命令以从数据库中删除表时调用的。\n\n```\n// up 方法\n\
    Schema::create('inventories', function (Blueprint $table) {\n    $table->increments('id');\n\
    \    $table->string('item');\n    $table->integer('quantity');\n    $table->integer('user_id');\n\
    \    $table->foreign('user_id')->references('id')->on('users');\n    $table->softDeletes();\n\
    \    $table->timestamps();\n});\n```\n\n---\n\n首先，`increments` 方法使用 \"UNSIGNED\
    \ INTEGER\" 等效类型创建一个自增的 ID 列（主键）。\n\n```\n$table->increments('id');\n```\n\n---\n\
    \n`string` 方法创建一个 \"VARCHAR\" 等效的 ITEM 列。该方法可以接受第二个参数作为大小，默认为 255。\n\n```\n$table->string('item');\n\
    ```\n\n---\n\n`integer` 方法创建一个 \"INTEGER\" 等效的 QUANTITY 列。\n\n```\n$table->integer('user_id');\n\
    ```\n\n---\n\n`foreign` 方法用于指定外键约束，这些约束用于在数据库层面强制执行引用完整性。它引用 users 表上的 \"PRIMARY\
    \ KEY\" ID。我们添加了 `user_id` 列，以便使用用户主键 ID 指定特定库存是由哪个用户创建的。\n\n```\n$table->foreign('user_id')->references('id')->on('users');\n\
    ```\n\n---\n\n`softDeletes` 方法添加可为空的 `deleted_at` 列以支持软删除。这确保了一旦我们调用 Laravel 查询构建器的\
    \ delete 方法，当前时间戳将被添加到 inventories 表的该行上，而不是从表中删除该行。这将有助于我们构建回收站功能。\n\n```\n$table->softDeletes();\n\
    ```\n\n---\n\n"
