    # About the Author


    Oluwafemi Alofe is an experienced software engineer with 7 years of experience
    building scalable web applications using Laravel, since the early release of version
    4.2. He’s currently the Technical Co-Founder (CTO) at a Fintech startup.


    # Introduction


    Since its initial release in 2011, Laravel has experienced exponential growth.
    In 2015, it became the most starred PHP framework on GitHub and rose to the go-to
    framework for a lot of startups and developers across the globe.


    Laravel is an MVC framework that focuses on simplicity, clarity, and getting work
    done. People and companies are using it to build everything from simple hobby
    projects all the way to Fortune 500 companies.


    According to [https://hackr.io/](https://hackr.io/) Laravel still remains one
    of the top ten web development frameworks as of 2019.


    ## Who is this book for


    This book is aimed at beginners who are looking to start building applications
    using Laravel and are ready to get hands-on, pretty fast by building a minimal
    project that covers most of the Laravel framework basics and a few advanced features
    that might seem overwhelming to beginners at first.


    Intermediate users with some experience, seeking better ways to architect small
    to medium-sized applications will also find this book beneficial.


    ## What will you learn


    This book will show you how to build a simple inventory application. It will cover
    topics such as Blade Templating where we will be taking a random Bootstrap theme
    and converting it into a lean template which we can extend for all our pages,
    Authentication for our registration and login, Eloquent ORM to show you different
    database table relationships including a feature called soft deletes, Dependency
    Injection, Email setup and configuration, Routing types, naming and grouping and
    finally TASK SCHEDULING & CRON JOBS to perform background process.


    Most of all you will be learning how to write production-quality code by adhering
    to a standard naming convention, practices and writing DRY (Do not repeat yourself)
    codes.


    The code to this project is hosted and can be found on GitHub here:


    ```

    https://github.com/slim12kg/Beginning-PHP-Laravel-Ebook-Code.git

    ```


    > **Note**

    >

    > One thing recruiters look out for when searching for a Laravel developer is
    the number of projects you have completely built, using the framework. So it’s
    advisable to follow through with this book and not only clone or fork this repo.


    ## Requirements


    For the purpose of this book, we would be using Laravel 5.4 because of its support
    for PHP version >= 5.6.4 which is still mostly used by a lot of people. If you
    wish, you can go ahead to install a higher version than 5.4 but not lower.


    Ensure you have PHP installed on your system with the following extensions enabled:


    *   `OpenSSL PHP Extension`

    *   `PDO PHP Extension`

    *   `Mbstring PHP Extension`

    *   `Tokenizer PHP Extension`

    *   `XML PHP Extension`


    `Composer` (A PHP dependency manager) must be installed globally on your machine
    and MySql or MariaDB database either packaged with Xammp or directly installed.


    I will be assuming you are either using a Unix Terminal or Windows Git Bash to
    run commands.


    ### Resources


    *   [How to use GIT BASH to install and run Laravel](https://www.youtube.com/watch?v=0rAW5eah7pw)

    *   [Install Laravel on Mac with valet](https://www.youtube.com/watch?v=ErblOwpiopI)

    *   [Laravel setup on Ubuntu using Xampp](https://www.youtube.com/watch?v=3DeJCwmlOys)

    *   [Setting up Laravel 5.4 for Linux](https://www.youtube.com/watch?v=l-hM9KG4VSE&t=19s)

    *   [Official Laravel installation guide](https://laravel.com/docs/5.4/installation)

    *   [Install Laravel 5 on windows with Xampp](https://www.codementor.io/@magarrent/how-to-install-laravel-5-xampp-windows-du107u9ji)


    > **Note**

    >

    > So as not to overwhelm beginners we would not be following the TDD (Test Driven
    Development) process. To find out more about TDD I [recommend reading this](https://github.com/slim12kg/Learn-Test-Driven-Design-In-Laravel).


    # How the Laravel Framework Works


    ![](Images/image00200.jpeg)


    Image source: https://www.netsolutions.com


    Laravel is an MVC framework meaning Model, View & Controller. Our Model is used
    to retrieve and store information in the database, View is what renders in the
    browser that end-users can see while the Controller is where the business logic
    of the app is done e.g like manipulating data from the model and passing to the
    view.


    > **Note**

    >

    > For a deeper understanding, you can read https://laravel.com/docs/5.8/lifecycle
    about the Laravel request Lifecycle.


    # Create a Project


    Open a new terminal or command line (gitbash for window OS users), navigate to
    your web projects directory and run the below command to create a new Laravel
    project. Ensure `Composer` is installed globally on your machine.


    ```

    composer create-project --prefer-dist laravel/laravel inventory-app "5.4.*"

    ```


    Next, create a database called `inventory_app` and give all privileged access
    to the root user or a preferred user you choose to allow all access to this database.


    Once the `Composer` command is done running and has completely installed your
    new Laravel project without throwing errors. From your terminal, navigate to the
    newly created `inventory-app` directory, then run command `php artisan serve`
    to launch your project to be accessed via your web browser.


    This is me running the `php artisan serve` command from the inventory app project
    directory from my terminal.


    ```

    oluwafemialofe@Oluwafemis-MacBook-Air inventory-app : php artisan serve

    ```


    You will get an output like below, simply open your browser and visit the outputted
    URL


    ```

    Laravel development server started: <http://127.0.0.1:8000>

    ```


    You should now be presented with the Laravel default landing page.


    Congratulations, you are on your way to becoming a Laravel Artisan ⚔


    # Templating

