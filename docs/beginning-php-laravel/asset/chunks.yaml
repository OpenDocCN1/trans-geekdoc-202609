    \  \n\n    Welcome  \n\n@endsection  \n\n@section('content')  \n\n    <div class\\\
    =\"container\\-fluid\">  \n\n        <div class\\=\"alert alert\\-success mt-4\"\
    \ role\\=\"alert\">  \n\n            <h4 class\\=\"alert\\-heading\">Welcome!</h4\\\
    >  \n\n            <p\\>{{auth()->user()->name}}, you have successfully logged\
    \ in. There are<strong>3</strong> items in our inventory.</p>  \n\n           \
    \ <hr>  \n\n        </div>  \n\n    </div>  \n\n@endsection |\n\n| --- |\n\nYou\
    \ can access any attribute of a logged in user from the User model via auth()->user().\
    \ If you are trying to access a logged user details from a route that is not protected\
    \ by the auth middleware, to avoid getting an error you should first check if\
    \ the user is logged in by using auth()->check()  in an if statement.\n\nThe auth()\
    \ function is made available by Laravel in every of your pages.  That's how much\
    \ Laravel makes things easier for you.\n\nBefore we move into the next section,\
    \ let us update the url linking to the dashboard on the sidenav. Open resources/views/layout/partials/\\\
