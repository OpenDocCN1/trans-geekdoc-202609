    \ route.\n\n| <a href=\"{{route('inventory.home')}}\" class\\=\"list\\-group\\\
    -item list\\-group\\-item\\-action bg\\-light\">Dashboard</a\\> |\n\n| --- |\n\
    \nOne more benefit of using a named route, is that in the future if we decide\
    \ to change our dashboard url from /app to /app/dashboard we don't need to go\
    \ everywhere we used that url to make the changes, we only need to make the changes\
    \ in our route file, since the named route references the changes we made, we\
    \ always get the new url every time. See it like a key and value thing in an array\
    \ where the key is the same but value changes and since we reference the array\
    \ key we get the updated value every time.\n\n## Create Inventory\n\nLet me break\
    \ down the steps to allow logged in users create a new inventory, this will help\
    \ you follow through easily. We will be building this feature in the following\
    \ order:\n\n●         Create an inventories migration to generate the inventories\
    \ table\n\n●         Create an Inventory Model for the inventories table\n\n●        \
    \ Define relationship between a user and many inventories in our Model\n\n●        \
    \ Create an  Inventory Controller class\n\n●         Define a get route to display\
    \ the, create new inventory page\n\n●         Define a create method in the InventoryController\
    \ class\n\n●         Create a form with matching fields to our database\n\n●        \
    \ Define a post route to submit the new inventory\n\n●         Create validation\
    \ for our inventory\n\n●         Define a store method to create the entry into\
    \ the database\n\n●         Redirect to new inventory page and display a success\
    \ notification \n\nWithout much ado let us get started! Shall we?\n\nTo create\
    \ our migration, run\n\n| php artisan make:migration create\\_inventories\\_table\
    \ --create=inventories |\n\n| --- |\n\nThe \\--create option is to indicate whether\
    \ the migration is for a new table. To edit an existing table the \\--table option\
    \ will be passed instead. That being said, let us add fields to our migration,\
    \ Laravel provides us with methods to create different data types such as string,int,longText,boolean,foreign\
    \ key with constraint e.t.c.\n\nFor our inventories table, edit your migration\
    \ file located in the database/migrations directory and update the content of\
    \ the up method to match below. The up method is called when we run the migrate\
    \ command to create the database while the down method, you can guess already,\
    \ is called when we run the command to rollback our migration, to drop tables\
    \ from the database. \n\n| //up methodSchema::create('inventories', function (Blueprint\
    \ $table) {  \n\n            $table->increments('id');  \n\n            $table->string('item');\
    \  \n\n            $table->integer('quantity');  \n\n            $table->integer('user\\\
    _id');  \n\n            $table->foreign('user\\_id')->references('id')->on('users');\
    \  \n\n            $table->softDeletes();  \n\n            $table->timestamps();\
    \  \n\n        }); |\n\n| --- |\n\nTo start with, the increments method creates\
    \ an incrementing column  ID (primary key) using an \"UNSIGNED INTEGER\" equivalent.\
    \ \n\n| $table->increments('id'); |\n\n| --- |\n\nThe string method creates a\
    \ “VARCHAR”  equivalent column ITEM. This method can take a second argument of\
    \ the size, default is 255.\n\n| $table->string('item'); |\n\n| --- |\n\nThe integer\
    \ methods create an “INTEGER” equivalent column QUANTITY.\n\n|  $table->integer(user\\\
    _id); |\n\n| --- |\n\nThe foreign method is used to specify foreign key constraints,\
    \ which are used to force referential integrity at the database level. Which references\
    \ the “PRIMARY KEY” ID on the users table. We added the user\\_id column to specify\
    \ which inventory was created by a particular user using the user PRIMARY ID.\n\
    \n| $table->foreign('user\\_id')->references('id')->on('users'); |\n\n| --- |\n\
    \nThe softDeletes method adds nullable deleted\\_at columns for soft deletes.\
    \ What this does is ensure that once we call the laravel query builder delete\
    \ method, the current timestamp will be added to that row on the inventories table\
    \ instead of dropping the row from the table. This will aid us in building the\
    \ recycle bin feature.  \n\n|  $table->softDeletes(); |\n\n| --- |"
