    Inventory;\nuse DateInterval;\nuse DateTime;\nuse Illuminate\\Bus\\Queueable;\n\
    use Illuminate\\Queue\\SerializesModels;\nuse Illuminate\\Queue\\InteractsWithQueue;\n\
    use Illuminate\\Contracts\\Queue\\ShouldQueue;\nuse Illuminate\\Foundation\\Bus\\\
    Dispatchable;\n\nclass ClearTrash implements ShouldQueue\n{\n    use Dispatchable,\
    \ InteractsWithQueue, Queueable, SerializesModels;\n\n    /**\n     * Create a\
    \ new job instance.\n     *\n     * @return void\n     */\n    public function\
    \ __construct()\n    {\n        //\n    }\n\n    /**\n     * Execute the job.\n\
    \     *\n     * @param Inventory $inventory\n     * @return void\n     * @throws\
    \ \\Exception\n     */\n    public function handle(Inventory $inventory)\n   \
    \ {\n        $now = new DateTime('now');\n        $threeMinutesDiff = new DateInterval('PT03M');\n\
    \        $threeMinutesAgo = $now->sub($threeMinutesDiff)->format('Y-m-d H:i:s');\n\
    \        $inventories = $inventory->onlyTrashed()->where('deleted_at', '<=', $threeMinutesAgo)->get();\n\
    \n        foreach ($inventories as $inventory) {\n            $inventory->forceDelete();\n\
    \        }\n    }\n}\n```\n\nOn your terminal from our inventory project directory,\
    \ run command:\n\n```\nphp artisan queue:listen\n```\n\nThis command runs the\
    \ queue worker that will process new jobs as they are pushed onto the queue. In\
    \ a real live scenario, we would be using a process monitor such as `Supervisor`\
    \ to ensure that the queue worker does not stop running permanently in the background.\n\
    \nTo confirm if this works, go ahead to delete an inventory, view your trash to\
    \ see if the item is in trash, wait for an additional 3 mins, then refresh your\
    \ trash. You will notice the trash is now empty and if you check your database\
    \ from your database manager, you won't see it there either.\n\n## Sending Email\n\
    \nSending email with Laravel can't be more easier and fun. Let us send an email\
    \ to a user informing the user that items in trash has just been cleared.\n\n\
    Laravel supports both SMTP and PHP's \"mail\" function as drivers for the sending\
    \ of email. You may specify which one you're using throughout your application\
    \ here. By default, Laravel is set up for SMTP mail. Laravel provides support\
    \ for sending email via API or SMTP for the following service providers: `sendmail`,\
    \ `mailgun`, `mandrill`, `amazon ses` and `sparkpost`. I personally prefer using\
    \ `mailgun`; you can decide to use it or choose another service provider.\n\n\
    But for the purpose of this tutorial, we would be using a fake smtp server called\
    \ [mailtrap.io](http://mailtrap.io). Open a free account, set it up and choose\
    \ Laravel as your framework then get your SMTP details as below and enter it into\
    \ the corresponding key in your `.env`. Changing to a live smtp server is as easy\
    \ as replacing the smtp details in your `.env` with the new one provided by the\
    \ service provider.\n\n![](Images/image00204.jpeg)\n\nIn the `.env` locate and\
    \ replace the value appropriately.\n\n```\nMAIL_DRIVER=smtp\nMAIL_HOST=smtp.mailtrap.io\n\
    MAIL_PORT=2525\nMAIL_USERNAME=33fcd1c32ab794\nMAIL_PASSWORD=8a169e3a907b5d\nMAIL_ENCRYPTION=null\n\
    MAIL_FROM_ADDRESS=notification@laraventory.com\nMAIL_FROM_NAME=Laraventory\n```\n\
    \nAnytime you make changes to your `.env` file, stop the current running `php\
    \ artisan serve` command and run it again. Next from your terminal, run the command\
    \ below to create an email and a markdown template for the email.\n\n```\nphp\
    \ artisan make:mail TrashNotification --markdown email/trash-notification\n```\n\
    \nUnder `app/Mail` a `TrashNotification` class to handle our email will be auto\
    \ generated and under `resources/views/email` the `trash-notification.blade.php`\
    \ file with a placeholder markdown will also be generated.\n\nUpdate the email\
    \ template to show a better message, you can likewise edit to your preference.\n\
    \n```blade\n@component('mail::message')\n# Notification\n\nThis is a friendly\
    \ notification to notify you that I just completed clearing the inventory trash.\n\
    \n@component('mail::button', ['url' => route('inventory.trash')])\nView Trash\n\
    @endcomponent\n\nThanks,<br>\n{{ config('app.name') }}\n@endcomponent\n```\n\n\
    Finally update the `ClearTrash.php` class in the Jobs directory to send an email\
    \ after clearing the trash.\n\n```php\n<?php\n\nnamespace App\\Jobs;\n\nuse App\\\
    Inventory;\nuse DateInterval;\nuse DateTime;\nuse Illuminate\\Bus\\Queueable;\n\
    use Illuminate\\Queue\\SerializesModels;\nuse Illuminate\\Queue\\InteractsWithQueue;\n\
    use Illuminate\\Contracts\\Queue\\ShouldQueue;\nuse Illuminate\\Foundation\\Bus\\\
    Dispatchable;\nuse Illuminate\\Support\\Facades\\Mail;\n\nclass ClearTrash implements\
    \ ShouldQueue\n{\n    use Dispatchable, InteractsWithQueue, Queueable, SerializesModels;\n\
    \n    /**\n     * Create a new job instance.\n     *\n     * @return void\n  \
    \   */\n```\n"
  trans: "\n\n</div>\n\n</div>\n\n@endsection\n\n---\n\n请编辑您现有的库存之一，通过清空 `quantity`\
    \ 字段来测试验证是否正常工作。然后将 `quantity` 字段的先前值更改为新值并提交表单，您应该会被重定向到库存列表页面，并显示成功通知。\n\n在我的例子中，我将\
    \ Playstation 的数量从 4 更新为 6。\n\n![](img/image00203.jpeg)\n\n# CRON JOB 与任务调度\n\n\
    Laravel 为我们提供了一种在 Laravel 内部轻松创建命令调度的方法。如果您有在服务器上创建 cron job 的经验，您会意识到不时编辑 crontab\
    \ 文件以添加更多任务并不够流畅。\n\n使用调度器时，您的服务器上只需要一个 Cron 条目。该 Cron 条目每分钟运行一次，检查是否有任务到期，然后执行。我们的任务调度定义在\
    \ `app/Console/Kernel.php` 文件的 `schedule` 方法中。\n\n打开您的终端并输入命令：\n\n```\ncrontab\
    \ -e\n```\n\n这是用于编辑您的 crontab 文件。将下面的命令粘贴到终端打开的文件中。在我的例子中，我的项目目录位于系统的 `home/Sites`\
    \ 目录中；您应按如下所示替换。同时替换 php 可执行文件的路径，您可以随时通过在终端运行 `which php` 命令来查找。\n\n```\n//替换为您的目录路径\n\
    //在终端运行 which php 命令以了解执行路径\n* * * * * /path-php-bin/php /path-to-inventory-app-directory/artisan\
    \ schedule:run >> /dev/null 2>&1\n\n//这是我的配置示例\n* * * * * /usr/local/bin/php ~/Sites/inventory-app/artisan\
    \ schedule:run >> /dev/null 2>&1\n```\n\n这将每分钟运行一次 `php artisan schedule` 命令，以检查是否有待执行的调度。一旦我们创建第一个\
    \ Job，您很快就会有更好的理解。\n\n对于 Linux 和 Mac 用户，默认情况下将启动 `vim` 编辑器来编辑文件。如果这是您第一次使用 `vim`\
    \ 编辑器，并且发现难以粘贴内容，请按键盘上的 `escape` 键，然后按 `i` 键，粘贴命令并编辑以反映您的目录路径，最后再次按 `escape` 键，然后按\
    \ `shift + colon` 键，输入 `wq` 并按 `enter` 键。您将收到 `crontab: installing new crontab`\
    \ 的响应。\n\n## 定义 Job\n\n我们将定义一个 Job 来检查库存是否已在回收站中（相当于软删除）超过 3 分钟，如果是则强制将其从数据库中删除。在实际生活中，我们可能会检查回收站中超过\
    \ 3-5 天的项目，但为了本教程，我们无法等待那么久。3 分钟的代码库同样适用于 3 天的检查；您只需更改时间差即可。\n\n在终端中运行以下命令：\n\n\
    ```\nphp artisan make:job ClearTrash\n```\n\n如果您检查 `app/Jobs` 目录，将看到生成的 `ClearTrash`\
    \ 类。`handle` 方法将包含每分钟执行一次的代码，用于检查是否有 3 分钟前被删除的项目在回收站中。\n\n```php\n<?php\n\nnamespace\
    \ App\\Jobs;\n\nuse App\\Inventory;\nuse DateInterval;\nuse DateTime;\nuse Illuminate\\\
    Bus\\Queueable;\nuse Illuminate\\Queue\\SerializesModels;\nuse Illuminate\\Queue\\\
    InteractsWithQueue;\nuse Illuminate\\Contracts\\Queue\\ShouldQueue;\nuse Illuminate\\\
    Foundation\\Bus\\Dispatchable;\n\nclass ClearTrash implements ShouldQueue\n{\n\
    \    use Dispatchable, InteractsWithQueue, Queueable, SerializesModels;\n\n  \
    \  /**\n     * 创建一个新的 Job 实例。\n     *\n     * @return void\n     */\n    public\
    \ function __construct()\n    {\n        //\n    }\n\n    /**\n     * 执行 Job。\n\
    \     *\n     * @param Inventory $inventory\n     * @return void\n     * @throws\
    \ \\Exception\n     */\n    public function handle(Inventory $inventory)\n   \
    \ {\n        $now = new DateTime('now');\n        $threeMinutesDiff = new DateInterval('PT03M');\n\
    \        $threeMinutesAgo = $now->sub($threeMinutesDiff)->format('Y-m-d H:i:s');\n\
    \        $inventories = $inventory->onlyTrashed()->where('deleted_at', '<=', $threeMinutesAgo)->get();\n\
    \n        foreach ($inventories as $inventory) {\n            $inventory->forceDelete();\n\
    \        }\n    }\n}\n```\n\n从我们的库存项目目录在终端上运行命令：\n\n```\nphp artisan queue:listen\n\
    ```\n\n此命令运行队列工作进程，它将处理推送到队列上的新 Job。在真实的生产场景中，我们将使用诸如 `Supervisor` 之类的进程监视器，以确保队列工作进程不会永久停止在后台运行。\n\
    \n要确认这是否有效，请继续删除一个库存，查看您的回收站以查看该项目是否在回收站中，再等待 3 分钟，然后刷新您的回收站。您将注意到回收站现在是空的，如果您从数据库管理器检查数据库，也不会在那里看到它。\n\
    \n## 发送邮件\n\n使用 Laravel 发送邮件再简单不过了，而且很有趣。让我们发送一封邮件给用户，通知用户库存回收站刚刚已被清空。\n\nLaravel\
    \ 支持 SMTP 和 PHP 的 \"mail\" 函数作为发送邮件的驱动程序。您可以在此处指定在整个应用程序中使用哪一个。默认情况下，Laravel 设置为\
    \ SMTP 邮件。Laravel 为以下服务提供商提供通过 API 或 SMTP 发送邮件的支持：`sendmail`、`mailgun`、`mandrill`、`amazon\
    \ ses` 和 `sparkpost`。我个人更喜欢使用 `mailgun`；您可以决定使用它或选择另一个服务提供商。\n\n但为了本教程的目的，我们将使用一个名为\
    \ [mailtrap.io](http://mailtrap.io) 的假 SMTP 服务器。开设一个免费帐户，进行设置并选择 Laravel 作为您的框架，然后获取您的\
    \ SMTP 详细信息，如下所示，并将其输入到您的 `.env` 中对应的键中。切换到实时 SMTP 服务器就像用服务提供商提供的新详细信息替换 `.env`\
    \ 中的 SMTP 详细信息一样简单。\n\n![](img/image00204.jpeg)\n\n在 `.env` 中找到并适当替换值。\n\n```\n\
    MAIL_DRIVER=smtp\nMAIL_HOST=smtp.mailtrap.io\nMAIL_PORT=2525\nMAIL_USERNAME=33fcd1c32ab794\n\
    MAIL_PASSWORD=8a169e3a907b5d\nMAIL_ENCRYPTION=null\nMAIL_FROM_ADDRESS=notification@laraventory.com\n\
    MAIL_FROM_NAME=Laraventory\n```\n\n每当您更改 `.env` 文件时，停止当前正在运行的 `php artisan serve`\
    \ 命令并再次运行它。接下来，从终端运行以下命令以创建邮件和邮件的 markdown 模板。\n\n```\nphp artisan make:mail TrashNotification\
    \ --markdown email/trash-notification\n```\n\n在 `app/Mail` 下，将自动生成一个处理我们邮件的 `TrashNotification`\
    \ 类，在 `resources/views/email` 下，也将生成一个带有占位符 markdown 的 `trash-notification.blade.php`\
    \ 文件。\n\n更新邮件模板以显示更好的消息，您也可以根据喜好进行编辑。\n\n```blade\n@component('mail::message')\n\
    # 通知\n\n这是一条友好的通知，旨在通知您我刚刚完成了库存回收站的清理。\n\n@component('mail::button', ['url' =>\
    \ route('inventory.trash')])\n查看回收站\n@endcomponent\n\n谢谢，<br>\n{{ config('app.name')\
    \ }}\n@endcomponent\n```\n\n最后更新 Jobs 目录中的 `ClearTrash.php` 类，以便在清空回收站后发送邮件。\n\
    \n```php\n<?php\n\nnamespace App\\Jobs;\n\nuse App\\Inventory;\nuse DateInterval;\n\
    use DateTime;\nuse Illuminate\\Bus\\Queueable;\nuse Illuminate\\Queue\\SerializesModels;\n\
    use Illuminate\\Queue\\InteractsWithQueue;\nuse Illuminate\\Contracts\\Queue\\\
    ShouldQueue;\nuse Illuminate\\Foundation\\Bus\\Dispatchable;\nuse Illuminate\\\
    Support\\Facades\\Mail;\n\nclass ClearTrash implements ShouldQueue\n{\n    use\
    \ Dispatchable, InteractsWithQueue, Queueable, SerializesModels;\n\n    /**\n\
    \     * 创建一个新的 Job 实例。\n     *\n     * @return void\n     */\n```\n\n"
