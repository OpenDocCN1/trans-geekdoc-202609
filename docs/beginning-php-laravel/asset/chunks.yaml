    \ inventory you deleted from the frontend is still there, only that the deleted\\\
    _at column is not null. This a function of Laravel soft delete that we discussed\
    \ earlier.\n\nLet create a page to list all deleted inventories with an action\
    \ to restore them back. Sounds cool right? We can use the same content of the\
    \ list inventory page, with slight edit to the action buttons, one to restore\
