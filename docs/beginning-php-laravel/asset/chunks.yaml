- raw: "The timestamps method adds nullable created\\_at and updated\\_at “TIMESTAMP”\
    \ columns. The created\\_at column is updated with the current timestamp when\
    \ a new row is created, while the updated\\_at is updated when the row is updated.\
    \ Finally, run the migrate command from your terminal or git bash.\n\n| php artisan\
    \ migrate |\n\n| --- |\n\nNow that our table has been created, if you call the\
    \ MYSQL DESCRIBE command, our inventories table schema will look like below.\n\
    \n| +-----------+------------------+------+-----+----------+------------+-  \n\
    \n| Field     |  Type            | Null | Key | Default | Extra          |  \n\
    \n+-----------+------------------+------+-----+----------+------------+-  \n\n\
    | id        | int(10) unsigned | NO   | PRI | NULL    | auto\\_increment |  \n\
    \n| item      | varchar(255)     | NO  |     | NULL    |                |  \n\n\
    | quantity  | int(11)          | NO   |     | NULL    |                |  \n\n\
    | user\\_id   | int(10) unsigned | NO   | MUL | NULL    |                |  \n\
    \n| deleted\\_at| timestamp        | YES  |     | NULL    |                | \
    \ \n\n| created\\_at| timestamp        | YES  |     | NULL    |               \
    \ |  \n\n| updated\\_at| timestamp        | YES  |     | NULL    |               \
    \ |  \n\n+--------+---------------------+------+-----+----------+------------+-\
    \ |\n\n| --- |\n\nNow let's move on to creating an Inventory Model for the inventories\
    \ table\n\n##  \n\n## Create an Inventory Model & Define The Relationship\n\n\
    Laravel Model represents the logical structure and relationship of the underlying\
    \ data table it represents, it allows you to query for data in your tables easily,\
    \ as well as insert new ones. There is a Model to a table which enables you to\
    \ use the Laravel ORM (Object Relational Database) to interact with such a table.\n\
    \nIn order to create a Model, Laravel allows you to do using the artisan command.\
    \ Run this command on your terminal or git bash\n\n| php artisan make:model Inventory\
    \ |\n\n| --- |\n\nUnder the app directory you would find the Inventory.php class\
    \ there. This is the default location where generated models are stored, you can\
    \ group them in an app/model directory or wherever you desire, but to keep things\
    \ simple we would leave it here.  \n\nNext let us define the relationship on this\
    \ table in our model, again Laravel allows us to define different types of  relationships\
    \ on multiple tables. You can define a one to many relationship using the hasMany\
    \ method, or one to one using the hasOne method or many to many using the belongsToMany\
    \ method and several others in your table corresponding Model.\n\nIn our own case\
    \ a user can create/own multiple inventories and inversely an inventory will belong\
    \ to a user, so we have a user hasMany inventories and  an inventory belongsTo\
    \ a user. Let us define that in our model.\n\n��Note\n\nTo learn more about other\
    \ available methods for creating different columns types in your database, you\
    \ can checkout the available column types in the [Laravel docs](https://laravel.com/docs/5.4/migrations#creating-columns).\n\
    \nIn our app/User.php model class, add the method inventories.\n\n| public function\
    \ inventories()  \n\n{  \n\n   return $this\\->hasMany(Inventory::class);  \n\n\
    } |\n\n| --- |\n\nOpen app/Inventory.php model class, to define the opposite relationship.\n\
    \n| public function ownedBy()  \n\n{  \n\n     return $this\\->belongsTo(User::class);\
    \  \n\n} |\n\n| --- |\n\nAdditionally in the inventory model class, add a protected\
    \ property guarded as below.\n\n| protected $guarded  = \\['id'\\]; |\n\n| ---\
    \ |\n\nDon’t get confused just yet, the guarded property is an inherited protected\
    \ property already defined by the Laravel Model class, which our Inventory model\
    \ class extends. Laravel allows you, using the query builder to mass assign data\
    \ into the database, simply by passing an array of data you want to insert, which\
    \ will be inserted into the database.\n\nSometimes this can be bad, as a malicious\
    \ user can guess a field in your table and inject an harmful data to be passed\
    \ into your database, so in order to exempt some important field from being mass\
    \ assignable, like the id field in our own case, since we don’t want someone inserting\
    \ their own id and destroy our auto increment behaviour we simply make the field\
    \ not mass assignable. Lastly because of the soft delete feature we want to implement,\
    \ we included the SoftDelete trait for this purpose.\n\nYour entire Inventory\
    \ model class  should match below\n\n| <?php  \n\nnamespace App;  \n\nuse Illuminate\\\
    \\Database\\\\Eloquent\\\\Model;  \n\nuse Illuminate\\\\Database\\\\Eloquent\\\
    \\SoftDeletes;  \n\nclass Inventory extends Model  \n\n{    use SoftDeletes; \
    \ \n\n    protected $guarded  = \\['id'\\];  \n\n    public function ownedBy()\
    \  \n\n    {  \n\n        return $this\\->belongsTo(User::class);  \n\n    } \
    \ \n\n}  |\n\n| --- |\n\n##  \n\n##  \n\n## Defining the Route, Inventory Controller\
    \ & Request Validation\n\nLet us handle the business logic of creating our inventory.\
    \ First run the artisan command to create an Inventory Controller. To do so run\
    \ the command below\n\n| php artisan make:controller InventoryController |\n\n\
    | --- |\n\nUnder app/Http/Controllers the class InventoryController.php will be\
    \ generated by Laravel, edit this file and add the following placeholder method.\
    \ We will be updating them later.\n\n| <?php  \n\nnamespace App\\\\Http\\\\Controllers;\
    \  \n\nuse Illuminate\\\\Http\\\\Request;  \n\nclass InventoryController extends\
    \ Controller  \n\n{  \n\n    public function createInventory()  \n\n    {  \n\n\
           return view('new-inventory');  \n\n    }  \n\n    public function storeInventory()\
    \  \n\n    {  \n\n        //validate & store in db  \n\n    }  \n\n    public\
    \ function viewInventories()  \n\n    {  \n\n        //retrieve and list   \n\n\
        }  \n\n} |\n\n| --- |\n\nIn our route file app/routes/web.php add the url\
    \ to create, store and view our inventory. Update the route groups to match below\n\
    \n| Route::group(\\['prefix' => 'app','middleware' => 'auth'\\],function($route){\
    \  \n\n  $route->get('/', 'AppController@dashboard')        ->name('inventory.home'); \
    \ $route->get('/create', 'InventoryController@createInventory')        ->name('inventory.create'); \
    \ $route->post('/create', 'InventoryController@storeInventory')        ->name('inventory.store'); \
    \ $route->get('/inventories', 'InventoryController@viewInventories')        ->name('inventory.all');//The\
    \ value in the curly braces must match the model of the table we           are\
    \ deleting from as this will allow Laravel knows which class to resolve$route->delete('/inventories/{inventory}/drop','InventoryController@drop')       \
    \ ->name('inventory.delete');}); |\n\n| --- |\n\nNext let’s create a Form Request\
    \ Validation to validate the request sent to the  storeInventory method. We would\
    \ be defining rules to validate the input of the user entered from the create\
    \ form we would be creating shortly, one rule of thumb is to never trust users\
    \ input and always endeavour to validate them. To create our Form Request run\
    \ the below command\n\n| php artisan make:request StoreInventory |\n\n| --- |\n\
    \nA new class StoreInventory.php will be created under the app/Http/Requests directory.\
    \ Edit this file, first under the authorize method change return false to return\
    \ true now let us define rules for the two input fields item and quantity, that\
    \ will be in our form.\n\nWe want the item field to always be a string not more\
    \ than 255 characters which is the maxlength of mysql VARCHAR to avoid mysql truncating\
    \ the data and quantity field should be an integer, not more than 100 can be allowed\
    \ assuming we do not want to ever create an inventory with over 100 stock and\
    \ both fields are required. Replace the empty array returned in the rules method\
    \ with below\n\n| return \\[  \n\n            'item' => 'required|string|max:255',\
    \  \n\n            'quantity' => 'required|int|max:100'  \n\n        \\]; |\n\n\
    | --- |\n\n��Note\n\nTo learn more about other validation rules available in Laravel,\
    \ visit the [Available Validation Rules](https://laravel.com/docs/5.4/validation#available-validation-rules)\
    \ section of the official Laravel documentation.\n\n## Create Inventory Form &\
    \ List Inventories"
  fmt: "\nThe `timestamps` method adds nullable `created_at` and `updated_at` \"TIMESTAMP\"\
    \ columns. The `created_at` column is updated with the current timestamp when\
    \ a new row is created, while the `updated_at` is updated when the row is updated.\
    \ Finally, run the `migrate` command from your terminal or git bash.\n\n```\n\
    php artisan migrate\n```\n\nNow that our table has been created, if you call the\
    \ MYSQL `DESCRIBE` command, our `inventories` table schema will look like below.\n\
    \n| Field | Type | Null | Key | Default | Extra |\n| :--- | :--- | :--- | :---\
    \ | :--- | :--- |\n| id | int(10) unsigned | NO | PRI | NULL | auto_increment\
    \ |\n| item | varchar(255) | NO | | NULL | |\n| quantity | int(11) | NO | | NULL\
    \ | |\n| user_id | int(10) unsigned | NO | MUL | NULL | |\n| deleted_at | timestamp\
    \ | YES | | NULL | |\n| created_at | timestamp | YES | | NULL | |\n| updated_at\
    \ | timestamp | YES | | NULL | |\n\nNow let's move on to creating an Inventory\
    \ Model for the `inventories` table.\n\n## Create an Inventory Model & Define\
    \ The Relationship\n\nLaravel Model represents the logical structure and relationship\
    \ of the underlying data table it represents. It allows you to query for data\
    \ in your tables easily, as well as insert new ones. There is a Model to a table\
    \ which enables you to use the Laravel ORM (Object Relational Database) to interact\
    \ with such a table.\n\nIn order to create a Model, Laravel allows you to do so\
    \ using the `artisan` command. Run this command on your terminal or git bash:\n\
    \n```\nphp artisan make:model Inventory\n```\n\nUnder the `app` directory you\
    \ would find the `Inventory.php` class there. This is the default location where\
    \ generated models are stored. You can group them in an `app/Models` directory\
    \ or wherever you desire, but to keep things simple we would leave it here.\n\n\
    Next, let us define the relationship on this table in our model. Again, Laravel\
    \ allows us to define different types of relationships on multiple tables. You\
    \ can define a one-to-many relationship using the `hasMany` method, or one-to-one\
    \ using the `hasOne` method, or many-to-many using the `belongsToMany` method\
    \ and several others in your table corresponding Model.\n\nIn our own case, a\
    \ user can create/own multiple inventories and inversely an inventory will belong\
    \ to a user, so we have a user `hasMany` inventories and an inventory `belongsTo`\
    \ a user. Let us define that in our model.\n\n> **Note**\n>\n> To learn more about\
    \ other available methods for creating different column types in your database,\
    \ you can checkout the available column types in the [Laravel docs](https://laravel.com/docs/5.4/migrations#creating-columns).\n\
    \nIn our `app/User.php` model class, add the method `inventories`.\n\n```php\n\
    public function inventories()\n{\n    return $this->hasMany(Inventory::class);\n\
    }\n```\n\nOpen `app/Inventory.php` model class to define the opposite relationship.\n\
    \n```php\npublic function ownedBy()\n{\n    return $this->belongsTo(User::class);\n\
    }\n```\n\nAdditionally, in the inventory model class, add a protected property\
    \ `guarded` as below.\n\n```php\nprotected $guarded = ['id'];\n```\n\nDon't get\
    \ confused just yet. The `guarded` property is an inherited protected property\
    \ already defined by the Laravel `Model` class, which our `Inventory` model class\
    \ extends. Laravel allows you, using the query builder, to mass assign data into\
    \ the database, simply by passing an array of data you want to insert, which will\
    \ be inserted into the database.\n\nSometimes this can be bad, as a malicious\
    \ user can guess a field in your table and inject harmful data to be passed into\
    \ your database. So in order to exempt some important fields from being mass assignable,\
    \ like the `id` field in our own case (since we don't want someone inserting their\
    \ own id and destroy our auto increment behaviour), we simply make the field not\
    \ mass assignable. Lastly, because of the soft delete feature we want to implement,\
    \ we included the `SoftDeletes` trait for this purpose.\n\nYour entire `Inventory`\
    \ model class should match below:\n\n```php\n<?php\n\nnamespace App;\n\nuse Illuminate\\\
    Database\\Eloquent\\Model;\nuse Illuminate\\Database\\Eloquent\\SoftDeletes;\n\
    \nclass Inventory extends Model\n{\n    use SoftDeletes;\n\n    protected $guarded\
    \ = ['id'];\n\n    public function ownedBy()\n    {\n        return $this->belongsTo(User::class);\n\
    \    }\n}\n```\n\n## Defining the Route, Inventory Controller & Request Validation\n\
    \nLet us handle the business logic of creating our inventory. First, run the artisan\
    \ command to create an Inventory Controller. To do so, run the command below:\n\
    \n```\nphp artisan make:controller InventoryController\n```\n\nUnder `app/Http/Controllers`\
    \ the class `InventoryController.php` will be generated by Laravel. Edit this\
    \ file and add the following placeholder methods. We will be updating them later.\n\
    \n```php\n<?php\n\nnamespace App\\Http\\Controllers;\n\nuse Illuminate\\Http\\\
    Request;\n\nclass InventoryController extends Controller\n{\n    public function\
    \ createInventory()\n    {\n        return view('new-inventory');\n    }\n\n \
    \   public function storeInventory()\n    {\n        //validate & store in db\n\
    \    }\n\n    public function viewInventories()\n    {\n        //retrieve and\
    \ list\n    }\n}\n```\n\nIn our route file `app/routes/web.php`, add the url to\
    \ create, store and view our inventory. Update the route groups to match below:\n\
    \n```php\nRoute::group(['prefix' => 'app', 'middleware' => 'auth'], function ($route)\
    \ {\n    $route->get('/', 'AppController@dashboard')->name('inventory.home');\n\
    \    $route->get('/create', 'InventoryController@createInventory')->name('inventory.create');\n\
    \    $route->post('/create', 'InventoryController@storeInventory')->name('inventory.store');\n\
    \    $route->get('/inventories', 'InventoryController@viewInventories')->name('inventory.all');\n\
    \    // The value in the curly braces must match the model of the table we\n \
    \   // are deleting from as this will allow Laravel knows which class to resolve\n\
    \    $route->delete('/inventories/{inventory}/drop', 'InventoryController@drop')->name('inventory.delete');\n\
    });\n```\n\nNext, let's create a Form Request Validation to validate the request\
    \ sent to the `storeInventory` method. We would be defining rules to validate\
    \ the input of the user entered from the create form we would be creating shortly.\
    \ One rule of thumb is to never trust user input and always endeavour to validate\
    \ them. To create our Form Request, run the below command:\n\n```\nphp artisan\
    \ make:request StoreInventory\n```\n\nA new class `StoreInventory.php` will be\
    \ created under the `app/Http/Requests` directory. Edit this file. First, under\
    \ the `authorize` method, change `return false` to `return true`. Now let us define\
    \ rules for the two input fields `item` and `quantity` that will be in our form.\n\
    \nWe want the `item` field to always be a string not more than 255 characters\
    \ (which is the maxlength of mysql `VARCHAR` to avoid mysql truncating the data)\
    \ and `quantity` field should be an integer, not more than 100 can be allowed\
    \ (assuming we do not want to ever create an inventory with over 100 stock). Both\
    \ fields are required. Replace the empty array returned in the `rules` method\
    \ with below:\n\n```php\nreturn [\n    'item' => 'required|string|max:255',\n\
    \    'quantity' => 'required|int|max:100'\n];\n```\n\n> **Note**\n>\n> To learn\
    \ more about other validation rules available in Laravel, visit the [Available\
    \ Validation Rules](https://laravel.com/docs/5.4/validation#available-validation-rules)\
    \ section of the official Laravel documentation.\n\n## Create Inventory Form &\
    \ List Inventories\n"
