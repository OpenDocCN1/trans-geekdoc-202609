- raw: "Create a layout folder in resources/views and create a file called master.blade.php\
    \ then inside this file paste the content of  resources/views/welcome.blade.php.\
    \ After pasting in the content, now I want you to take out the content from the\
    \ opening and closing header tags, that is between <head> to </head> then create\
    \ a partials folder under the layout directory, create a \\_header.blade.php file\
    \ inside the partials folder and paste the content we took out between the head\
    \ tags from the master.blade.php inside \\_header.blade.php.\n\n| // resources/views/layout/partials/\\\
    _header.blade.php  \n\n<head\\>  \n\n    <meta charset=\"utf-8\"\\>  \n\n    <meta\
    \ name=\"viewport\" content=\"width=device-width, initial-scale=1, shrink-to-fit=no\"\
    \\>  \n\n    <meta name=\"description\" content=\"\"\\>  \n\n    <meta name=\"\
    author\" content=\"\"\\>  \n\n    <title\\>Simple Sidebar - Start Bootstrap Template</title\\\
    >  \n\n    <link href=\"{{asset('css/bootstrap.min.css')}}\" rel=\"stylesheet\"\
    \\>  \n\n      <link href=\"{{asset('css/simple-sidebar.css')}}\" rel=\"stylesheet\"\
    \\>  \n\n</head\\> |\n\n| --- |\n\n��Note\n\nLaravel uses the  Blade templating\
    \ engine. Unlike other popular PHP templating engines, Blade does not restrict\
    \ you from using plain PHP code in your views. In fact, all Blade views are compiled\
    \ into plain PHP code and cached until they are modified, meaning Blade adds essentially\
    \ zero overhead to your application. Blade view files use the .blade.php file\
    \ extension and are typically stored in the resources/views directory.\n\nNotice\
    \ the addition of underscore before the header file name, this is to mark that\
    \ this view is a partial file and can’t stand on its own. Next take out all the\
    \ script tags near the body close tag </body>, create a new file \\_footer.blade.php\
    \ and paste what you took out inside of it.  \n\n| // resources/views/layout/partials/\\\
    _footer.blade.php  \n\n<!-- Bootstrap core JavaScript -->  \n\n<script src=\"\
    {{asset('js/jquery.min.js')}}\"\\></script\\>  \n\n<script src=\"{{asset('js/bootstrap.bundle.min.js')}}\"\
    \\></script\\>  \n\n<!-- Menu Toggle Script -->  \n\n<script\\>  \n\n    $(\"\
    #menu-toggle\").click(function(e) {  \n\n        e.preventDefault();  \n\n       \
    \ $(\"#wrapper\").toggleClass(\"toggled\");  \n\n    });  \n\n</script\\> |\n\n\
    | --- |\n\nNext take out the content between the Sidebar comments from the master\
    \ view, create a new file called \\_sidebar.blade.php and place inside the content\
    \ you took out.\n\n| // resources/views/layout/partials/\\_sidenav.blade.php \
    \ \n\n<!-- Sidebar -->  \n\n    <div class=\"bg-light border-right\" id=\"sidebar-wrapper\"\
    \\>  \n\n        <div class=\"sidebar-heading\"\\>Start Bootstrap </div\\>  \n\
    \n        <div class=\"list-group list-group-flush\"\\>  \n\n            <a href=\"\
    #\" class=\"list-group-item list-group-item-action bg-light\"\\>Dashboard</a\\\
    >  \n\n            <a href=\"#\" class=\"list-group-item list-group-item-action\
    \ bg-light\"\\>Shortcuts</a\\>  \n\n            <a href=\"#\" class=\"list-group-item\
    \ list-group-item-action bg-light\"\\>Overview</a\\>  \n\n            <a href=\"\
    #\" class=\"list-group-item list-group-item-action bg-light\"\\>Events</a\\> \
    \ \n\n            <a href=\"#\" class=\"list-group-item list-group-item-action\
    \ bg-light\"\\>Profile</a\\>  \n\n            <a href=\"#\" class=\"list-group-item\
    \ list-group-item-action bg-light\"\\>Status</a\\>  \n\n        </div\\>  \n\n\
        </div\\><!-- /#sidebar-wrapper --> |\n\n| --- |\n\nAgain take out the navbar\
    \ inside the div with id page-content-wrapper, create a new file \\_navbar.blade.php\
    \ and place inside the content you took out, now your file should look like below.\n\
    \n| // resources/views/layout/partials/\\_navbar.blade.php  \n\n<nav class=\"\
    navbar navbar-expand-lg navbar-light bg-light border-bottom\"\\>  \n\n    <button\
    \ class=\"btn btn-primary\" id=\"menu-toggle\"\\>Toggle Menu</button\\>  \n\n\
        <button class=\"navbar-toggler\" type=\"button\" data-toggle=\"collapse\"\
    \ data-target=\"#navbarSupportedContent\" aria-controls=\"navbarSupportedContent\"\
    \ aria-expanded=\"false\" aria-label=\"Toggle navigation\"\\>  \n\n        <span\
    \ class=\"navbar-toggler-icon\"\\></span\\>  \n\n    </button\\>  \n\n    <div\
    \ class=\"collapse navbar-collapse\" id=\"navbarSupportedContent\"\\>  \n\n       \
    \ <ul class=\"navbar-nav ml-auto mt-2 mt-lg-0\"\\>  \n\n            <li class=\"\
    nav-item active\"\\>  \n\n                <a class=\"nav-link\" href=\"#\"\\>Home\
    \ <span class=\"sr-only\"\\>(current)</span\\></a\\>  \n\n            </li\\>\
    \  \n\n            <li class=\"nav-item\"\\>  \n\n                <a class=\"\
    nav-link\" href=\"#\"\\>Link</a\\>  \n\n            </li\\>  \n\n            <li\
    \ class=\"nav-item dropdown\"\\>  \n\n                <a class=\"nav-link dropdown-toggle\"\
    \ href=\"#\" id=\"navbarDropdown\" role=\"button\" data-toggle=\"dropdown\" aria-haspopup=\"\
    true\" aria-expanded=\"false\"\\>  \n\n                    Dropdown  \n\n               \
    \ </a\\>  \n\n                <div class=\"dropdown-menu dropdown-menu-right\"\
    \ aria-labelledby=\"navbarDropdown\"\\>  \n\n                    <a class=\"dropdown-item\"\
    \ href=\"#\"\\>Action</a\\>  \n\n                    <a class=\"dropdown-item\"\
    \ href=\"#\"\\>Another action</a\\>  \n\n                    <div class=\"dropdown-divider\"\
    \\></div\\>  \n\n                    <a class=\"dropdown-item\" href=\"#\"\\>Something\
    \ else here</a\\>  \n\n                </div\\>  \n\n            </li\\>  \n\n\
            </ul\\>  \n\n    </div\\>  \n\n</nav\\> |\n\n| --- |\n\nReplace all the\
    \ sections you took out, with the references to the new files you created and\
    \ moved the content to, using the blade template @include directive which is similar\
    \ to the php include function.\n\n| //Replace where we took out the header tag\
    \ with this  \n\n@include('layout.partials.\\_header')  \n\n//Replace where we\
    \ took out the side nav with this  \n\n@section('sidenav')  \n\n    @include('layout.partials.\\\
    _sidenav')  \n\n@show  \n\n //Replace where we took out the navbar with this \
    \ \n\n@section('navbar')  \n\n    @include('layout.partials.\\_navbar')  \n\n\
    @show  \n\n//Replace where we took out the script tags with this  \n\n@include('layout.partials.\\\
    _footer') |\n\n| --- |\n\n��Note\n\n@section directives allows us to define sections\
    \ we can override in individual child views, when we do. \n\nNow replace the content\
    \ of welcome.blade.php with code below, I will explain shortly.\n\n| @extends('layout.master')\
    \  \n\n@section('content')  \n\n    //Content specific to this child page will\
    \ appear here  \n\n@endsection |\n\n| --- |\n\nTake out the whole content inside\
    \ the div with the class container-fluid from the master template and paste it\
    \ in between the content section of the welcome.blade.php page, then replace where\
    \ you took out the div content with @yield(‘content’). Our master.blade.php should\
    \ now look like below.\n\n| // resources/views/layout/master.blade.php  \n\n<!DOCTYPE\
    \ html>  \n\n<html lang=\"en\"\\>  \n\n@include('layout.partials.\\_header') \
    \ \n\n<body\\>  \n\n<div class=\"d-flex\" id=\"wrapper\"\\>  \n\n    @section('sidenav')\
    \  \n\n        @include('layout.partials.\\_sidenav')  \n\n    @show  \n\n   \
    \ <div id=\"page-content-wrapper\"\\>  \n\n        @section('navbar')  \n\n           \
    \ @include('layout.partials.\\_navbar')  \n\n        @show  \n\n        @yield('content')\
    \  \n\n    </div\\>  \n\n</div\\>  \n\n@include('layout.partials.\\_footer') \
    \ \n\n</body\\>  \n\n</html\\> |\n\n| --- |\n\nNotice the use of @yield(‘content’)\
    \ directive, the content parameter inside the @yield directive, you can name it\
    \ any other thing you want, not necessarily content, e.g child-page,  but in our\
    \ case content is fine and will be for most cases, since it's just a parameter\
    \ to reference a section to be placed within a child view. Notice the welcome\
    \ page, you will see the use of the section there and in between the section we\
    \ place the content unique to the view which substitute the @yield directive in\
    \ the master view it extends.\n\nWe can also use a @yield directive inside the\
    \ head tag, to define page title for each child view.\n\n| //Replace this  \n\n\
    <title\\>Simple Sidebar - Start Bootstrap Template</title\\>  \n\n//With this\
    \  \n\n<title\\> Inventory App -  @yield('page-title') </title\\> |\n\n| --- |\n\
    \nOur welcome.blade.php view should look like below.\n\n| @extends('layout.master')\
    \  \n\n@section('page-title')  \n\n    Welcome  \n\n@endsection  \n\n@section('content')\
    \  \n\n    <div class=\"container-fluid\"\\>  "
  fmt: "\n# Laravel Blade 布局重构指南\n\n## 创建布局结构\n\n在 `resources/views` 目录下创建 `layout`\
    \ 文件夹，并在其中创建 `master.blade.php` 文件。将 `resources/views/welcome.blade.php` 的内容复制到该文件中。\n\
    \n## 提取头部模板\n\n从 `master.blade.php` 中提取 `<head>` 到 `</head>` 之间的内容。在 `layout`\
    \ 目录下创建 `partials` 文件夹，并创建 `_header.blade.php` 文件，将提取的内容粘贴进去。\n\n```html\n// resources/views/layout/partials/_header.blade.php\n\
    \n<head>\n    <meta charset=\"utf-8\">\n    <meta name=\"viewport\" content=\"\
    width=device-width, initial-scale=1, shrink-to-fit=no\">\n    <meta name=\"description\"\
    \ content=\"\">\n    <meta name=\"author\" content=\"\">\n    <title>Simple Sidebar\
    \ - Start Bootstrap Template</title>\n    <link href=\"{{asset('css/bootstrap.min.css')}}\"\
    \ rel=\"stylesheet\">\n    <link href=\"{{asset('css/simple-sidebar.css')}}\"\
    \ rel=\"stylesheet\">\n</head>\n```\n\n> **注意**\n>\n> Laravel 使用 `Blade` 模板引擎。与其他流行的\
    \ PHP 模板引擎不同，`Blade` 不限制你在视图中使用原生 PHP 代码。实际上，所有 `Blade` 视图都会被编译成原生 PHP 代码并缓存，直到被修改，这意味着\
    \ `Blade` 给应用程序增加的开销基本为零。`Blade` 视图文件使用 `.blade.php` 扩展名，通常存储在 `resources/views`\
    \ 目录中。\n>\n> 文件名前加下划线（`_header.blade.php`）是为了标记这是一个局部视图文件，不能独立使用。\n\n## 提取底部脚本模板\n\
    \n提取 `</body>` 标签附近的所有 `<script>` 标签，创建 `_footer.blade.php` 文件并将内容粘贴进去。\n\n```html\n\
    // resources/views/layout/partials/_footer.blade.php\n\n<!-- Bootstrap core JavaScript\
    \ -->\n<script src=\"{{asset('js/jquery.min.js')}}\"></script>\n<script src=\"\
    {{asset('js/bootstrap.bundle.min.js')}}\"></script>\n\n<!-- Menu Toggle Script\
    \ -->\n<script>\n    $(\"#menu-toggle\").click(function(e) {\n        e.preventDefault();\n\
    \        $(\"#wrapper\").toggleClass(\"toggled\");\n    });\n</script>\n```\n\n\
    ## 提取侧边栏模板\n\n从主视图中提取 `Sidebar` 注释之间的内容，创建 `_sidenav.blade.php` 文件并放入提取的内容。\n\n\
    ```html\n// resources/views/layout/partials/_sidenav.blade.php\n\n<!-- Sidebar\
    \ -->\n<div class=\"bg-light border-right\" id=\"sidebar-wrapper\">\n    <div\
    \ class=\"sidebar-heading\">Start Bootstrap </div>\n    <div class=\"list-group\
    \ list-group-flush\">\n        <a href=\"#\" class=\"list-group-item list-group-item-action\
    \ bg-light\">Dashboard</a>\n        <a href=\"#\" class=\"list-group-item list-group-item-action\
    \ bg-light\">Shortcuts</a>\n        <a href=\"#\" class=\"list-group-item list-group-item-action\
    \ bg-light\">Overview</a>\n        <a href=\"#\" class=\"list-group-item list-group-item-action\
    \ bg-light\">Events</a>\n        <a href=\"#\" class=\"list-group-item list-group-item-action\
    \ bg-light\">Profile</a>\n        <a href=\"#\" class=\"list-group-item list-group-item-action\
    \ bg-light\">Status</a>\n    </div>\n</div><!-- /#sidebar-wrapper -->\n```\n\n\
    ## 提取导航栏模板\n\n提取 `id=\"page-content-wrapper\"` 的 `div` 内部的导航栏，创建 `_navbar.blade.php`\
    \ 文件并放入内容。\n\n```html\n// resources/views/layout/partials/_navbar.blade.php\n\n\
    <nav class=\"navbar navbar-expand-lg navbar-light bg-light border-bottom\">\n\
    \    <button class=\"btn btn-primary\" id=\"menu-toggle\">Toggle Menu</button>\n\
    \    <button class=\"navbar-toggler\" type=\"button\" data-toggle=\"collapse\"\
    \ data-target=\"#navbarSupportedContent\" aria-controls=\"navbarSupportedContent\"\
    \ aria-expanded=\"false\" aria-label=\"Toggle navigation\">\n        <span class=\"\
    navbar-toggler-icon\"></span>\n    </button>\n    <div class=\"collapse navbar-collapse\"\
    \ id=\"navbarSupportedContent\">\n        <ul class=\"navbar-nav ml-auto mt-2\
    \ mt-lg-0\">\n            <li class=\"nav-item active\">\n                <a class=\"\
    nav-link\" href=\"#\">Home <span class=\"sr-only\">(current)</span></a>\n    \
    \        </li>\n            <li class=\"nav-item\">\n                <a class=\"\
    nav-link\" href=\"#\">Link</a>\n            </li>\n            <li class=\"nav-item\
    \ dropdown\">\n                <a class=\"nav-link dropdown-toggle\" href=\"#\"\
    \ id=\"navbarDropdown\" role=\"button\" data-toggle=\"dropdown\" aria-haspopup=\"\
    true\" aria-expanded=\"false\">\n                    Dropdown\n              \
    \  </a>\n                <div class=\"dropdown-menu dropdown-menu-right\" aria-labelledby=\"\
    navbarDropdown\">\n                    <a class=\"dropdown-item\" href=\"#\">Action</a>\n\
    \                    <a class=\"dropdown-item\" href=\"#\">Another action</a>\n\
    \                    <div class=\"dropdown-divider\"></div>\n                \
    \    <a class=\"dropdown-item\" href=\"#\">Something else here</a>\n         \
    \       </div>\n            </li>\n        </ul>\n    </div>\n</nav>\n```\n\n\
    ## 使用 `@include` 指令引入局部视图\n\n使用 `Blade` 模板的 `@include` 指令（类似 PHP 的 `include` 函数）替换所有提取的部分。\n\
    \n```blade\n// 替换头部标签位置\n@include('layout.partials._header')\n\n// 替换侧边栏位置\n@section('sidenav')\n\
    \    @include('layout.partials._sidenav')\n@show\n\n// 替换导航栏位置\n@section('navbar')\n\
    \    @include('layout.partials._navbar')\n@show\n\n// 替换脚本标签位置\n@include('layout.partials._footer')\n\
    ```\n\n> **注意**\n>\n> `@section` 指令允许我们定义可以在单独子视图中覆盖的区块。\n\n## 重构 `welcome.blade.php`\n\
    \n将 `welcome.blade.php` 的内容替换为以下代码：\n\n```blade\n@extends('layout.master')\n\n\
    @section('content')\n    // Content specific to this child page will appear here\n\
    @endsection\n```\n\n## 完成主布局模板\n\n从主模板中提取 `class=\"container-fluid\"` 的 `div`\
    \ 内部的所有内容，粘贴到 `welcome.blade.php` 的 `content` 区块中，然后在主模板中用 `@yield('content')`\
    \ 替换提取的位置。最终 `master.blade.php` 应如下所示：\n\n```blade\n// resources/views/layout/master.blade.php\n\
    \n<!DOCTYPE html>\n<html lang=\"en\">\n@include('layout.partials._header')\n<body>\n\
    <div class=\"d-flex\" id=\"wrapper\">\n    @section('sidenav')\n        @include('layout.partials._sidenav')\n\
    \    @show\n    <div id=\"page-content-wrapper\">\n        @section('navbar')\n\
    \            @include('layout.partials._navbar')\n        @show\n        @yield('content')\n\
    \    </div>\n</div>\n@include('layout.partials._footer')\n</body>\n</html>\n```\n\
    \n## 页面标题动态化\n\n注意 `@yield('content')` 指令的用法，`content` 参数可以自定义（如 `child-page`），但在大多数情况下\
    \ `content` 即可满足需求，因为它只是用来引用子视图中将要放置的区块。\n\n我们也可以在 `<head>` 标签内使用 `@yield` 指令为每个子视图定义页面标题。\n\
    \n```blade\n// 替换此行\n<title>Simple Sidebar - Start Bootstrap Template</title>\n\
    \n// 替换为\n<title> Inventory App - @yield('page-title') </title>\n```\n\n## 最终的\
    \ `welcome.blade.php`\n\n```blade\n@extends('layout.master')\n\n@section('page-title')\n\
    \    Welcome\n@endsection\n\n@section('content')\n    <div class=\"container-fluid\"\
    >\n```\n"
  trans: "\n\n# Laravel Blade 布局重构指南\n\n## 创建布局结构\n\n在 `resources/views` 目录下创建 `layout`\
