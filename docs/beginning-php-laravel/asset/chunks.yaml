- raw: "Have you ever had to deal with creating databases with a lot of tables having\
    \ many columns? Only for you to change the schema one time or the other? How easy\
    \ has it been trying to collaborate on a project and there is no easy way to know\
    \ what schema already exist or what relationship or constraint is defined and\
    \ have an easy way for everyone to keep the same version of schema without having\
    \ to tell them what to add or what not, having to labour! Laravel migrations to\
    \ the rescue!\n\nAs defined by Laravel documentation migrations are like version\
    \ control for your database, allowing your team to easily modify and share the\
    \ application's database schema. Migrations are typically paired with Laravel's\
    \ schema builder to easily build your application's database schema. If you have\
    \ ever had to tell a teammate to manually add a column to their local database\
    \ schema, you've faced the problem that database migrations solve.\n\nWe would\
    \ be creating migrations later, but for now we will be running the existing user\
    \ and password migrations. To create a new migration we need to run command\n\n\
    | php artisan make:migration create\\_{table name in plural}\\_table  \n\n// e.g\
    \  \n\nphp artisan make:migration create\\_users\\_table |\n\n| --- |\n\nTo run\
    \ existing migrations, after defining the columns, simply run\n\n| php artisan\
    \ migrate  |\n\n| --- |\n\nOr to drop(rollback) the last table \n\n| php artisan\
    \ migrate:rollback |\n\n| --- |\n\nOr to rollback all tables in a database and\
    \ create them back immediately to clear the existing data run.\n\n| php artisan\
    \ migrate:reset |\n\n| --- |\n\nThere are a lot of things to Laravel migrations,\
    \ that is beyond the scope of this book but nevertheless we would be covering\
    \ most of the important aspects to it . Visit Laravel official documentation https://laravel.com/docs/5.8/migrations\
    \ to learn more.\n\nTo migrate our existing user migration, already shipped with\
    \ your Laravel installation under database/migrations directory. We need to first\
    \ create a database called inventory\\_app using any of your most preferred database\
    \ manager, could be using mysql via command line, phpmyadmin, sequelpro or whatever,\
    \ next create a .env file in your inventory\\_app project root directory from\
    \ your editor and copy the content from already existing .env.example into it.\n\
    \nFinally edit the .env file and change the value of the database connection to\
    \ yours.\n\n| DB\\_CONNECTION=mysql  \n\nDB\\_HOST=127.0.0.1  \n\nDB\\_PORT=3306\
    \  \n\nDB\\_DATABASE=inventory\\_app  \n\nDB\\_USERNAME=root  \n\nDB\\_PASSWORD=mypassword\
    \ |\n\n| --- |\n\n Now run\n\n| php artisan:migrate |\n\n| --- |\n\nFrom your\
    \ terminal or git bash. If you are getting an error Syntax error or access violation:\
    \ 1231 Variable 'sql\\_mode' can't be set to the value of 'NO\\_AUTO\\_CREATE\\\
    _USER' , simply locate the file config/database.php from your editor, and on line\
    \ 55 after engine=> null, paste this snippet of code, then rerun your migration.\n\
    \n| 'modes'  => \\[  \n\n                'ONLY\\_FULL\\_GROUP\\_BY',  \n\n               \
    \ 'STRICT\\_TRANS\\_TABLES',  \n\n                'NO\\_ZERO\\_IN\\_DATE',  \n\
    \n                'NO\\_ZERO\\_DATE',  \n\n                'ERROR\\_FOR\\_DIVISION\\\
    _BY\\_ZERO',  \n\n                'NO\\_ENGINE\\_SUBSTITUTION',            \\\
    ], |\n\n| --- |\n\n## A Little About the .env(DotEnv) File\n\nenv file which contains\
    \ environment variables for your app settings, it contains a one row – one KEY=VALUE\
    \ pair. And within your Laravel project code you can get those environment variables\
    \ with function env('KEY').\n\nLaravel's .env file is included to use, so it's\
    \ easy to have a different configuration based on the environment your app is\
    \ running on. This gives you the flexibility to have different variables for local,\
    \ staging, production, and even different developers' machines.\n\nYour .env file\
    \ should not be committed to your application's source control (e.g git), since\
    \ each developer/server using your application could require a different environment\
    \ configuration. Furthermore, this would be a security risk in the event an intruder\
    \ gains access to your source control repository, since any sensitive credentials\
    \ would get exposed.\n\nRule of thumb, always add your .env to .gitignore if you\
    \ use git for your version control, so your credentials do not get pushed to public\
    \ eyes.\n\n## Login\n\nBefore we proceed it's important to know that once you\
    \ update your .env file, you have to reserve your Laravel application, this is\
    \ because everytime you serve a Laravel application the environment variable is\
    \ loaded and you would have to restart it to load the new changes.\n\nStop the\
    \ current php artisan serve command running on the terminal and run the command\
    \ again. Visit the registration page http://127.0.0.1:8000/register to create\
    \ an account and you will be automatically logged in to the app dashboard.\n\n\
    # Building The Dashboard\n\nIn this chapter we would start by restructuring the\
    \ view of our dashboard, topbar and sidenav, then move on to implement each of\
    \ the sidenav features.\n\nHere are the list of features we would be building\n\
    \n●         Show a welcome message to logged in users and the number of inventories\
    \ available.\n\n●         Create inventory.\n\n●         List all inventories.\n\
    \n●         Edit inventory if it was created by a logged in user.\n\n●        \
    \ Delete inventory if it was created by a logged in user.\n\n●         Trash listing\
    \ deleted inventory and how long left before clearing from trash.\n\n●        \
    \ Cron job to clear expired inventory from trash 3mins after in trash.\n\n## SideNav\n\
    \nChange the placeholder sidenav content from our borrowed bootstrap theme.  Edit\
    \ your resources/views/layout/partials/\\_sidenav.blade.php to match below.\n\n\
    | <div class\\=\"bg\\-light border\\-right\" id\\=\"sidebar\\-wrapper\">  \n\n\
        <div class\\=\"sidebar\\-heading\">{{config('app.name')}}</div>  \n\n    <div\
    \ class\\=\"list\\-group list\\-group\\-flush\">  \n\n        <a href\\=\"#\"\
    \ class\\=\"list\\-group\\-item list\\-group\\-item\\-action bg\\-light\">Dashboard</a\\\
    >  \n\n        <a href\\=\"#\" class\\=\"list\\-group\\-item list\\-group\\-item\\\
    -action bg\\-light\">View Inventories</a\\>  \n\n        <a href\\=\"#\" class\\\
    =\"list\\-group\\-item list\\-group\\-item\\-action bg\\-light\">New Inventory</a\\\
    >  \n\n        <a href\\=\"#\" class\\=\"list\\-group\\-item list\\-group\\-item\\\
    -action bg\\-light\">Trash</a\\>  \n\n        <a href\\=\"#\" class\\=\"list\\\
    -group\\-item list\\-group\\-item\\-action bg\\-light\">Logout</a\\>  \n\n   \
    \ </div\\>  \n\n</div\\> |\n\n| --- |\n\nNotice the use of config function to\
    \ get the app name defined in the .env file. We will be updating the APP\\_NAME\
    \ key to the value Laraventory in the .env file. Now re-serve the application\
    \ by stopping the current  php artisan serve command and rerunning it from the\
    \ terminal, so the server can load the new changes made.\n\n��Note\n\nIn blade\
    \ templating {{ config(‘app.name’)}} is the same as <?php echo config(‘app.name’)\
    \ ?> and <?php if( a == b) {  echo ‘True’ }else{ echo ‘False’ } is also same as\
    \ \n\n@if(a === b) {{‘True’}} @else {{‘False’}}. \n\nMore on using blade templating\
    \ https://laravel.com/docs/5.4/blade#displaying-data here.\n\n## NavBar \n\nChange\
    \ the placeholder navbar content from our borrowed bootstrap theme.  Edit your\
    \ resources/views/layout/partials/\\_navbar.blade.php to match below. \n\n| <nav\
    \ class\\=\"navbar navbar\\-expand\\-lg navbar\\-light bg\\-light border\\-bottom\"\
    >  \n\n    <button class\\=\"btn btn\\-primary\" id\\=\"menu\\-toggle\">☰</button\\\
    >  \n\n    <button class\\=\"navbar\\-toggler\" type\\=\"button\" data\\-toggle\\\
    =\"collapse\" data\\-target\\=\"#navbarSupportedContent\" aria\\-controls\\=\"\
    navbarSupportedContent\" aria\\-expanded\\=\"false\" aria\\-label\\=\"Toggle navigation\"\
    >  \n\n        <span class\\=\"navbar\\-toggler\\-icon\"></span\\>  \n\n    </button\\\
    >  \n\n    <div class\\=\"collapse navbar\\-collapse\" id\\=\"navbarSupportedContent\"\
    >  \n\n        <ul class\\=\"navbar\\-nav ml\\-auto mt\\-2 mt\\-lg\\-0\">  \n\n\
                <li class\\=\"nav\\-item dropdown\">  \n\n                <a class\\\
    =\"nav\\-link dropdown\\-toggle\" href\\=\"#\" id\\=\"navbarDropdown\" role\\\
    =\"button\" data\\-toggle\\=\"dropdown\" aria\\-haspopup\\=\"true\" aria\\-expanded\\\
    =\"false\">  \n\n                    Account Settings  "
  fmt: "\n# Laravel Migrations\n\nHave you ever had to deal with creating databases\
    \ with a lot of tables having many columns? Only for you to change the schema\
    \ one time or the other? How easy has it been trying to collaborate on a project\
    \ and there is no easy way to know what schema already exist or what relationship\
    \ or constraint is defined and have an easy way for everyone to keep the same\
    \ version of schema without having to tell them what to add or what not, having\
    \ to labour! Laravel migrations to the rescue!\n\nAs defined by Laravel documentation\
    \ migrations are like version control for your database, allowing your team to\
    \ easily modify and share the application's database schema. Migrations are typically\
    \ paired with Laravel's schema builder to easily build your application's database\
    \ schema. If you have ever had to tell a teammate to manually add a column to\
    \ their local database schema, you've faced the problem that database migrations\
    \ solve.\n\nWe would be creating migrations later, but for now we will be running\
    \ the existing user and password migrations. To create a new migration we need\
    \ to run command:\n\n```bash\nphp artisan make:migration create_{table name in\
    \ plural}_table\n```\n\n// e.g.\n\n```bash\nphp artisan make:migration create_users_table\n\
    ```\n\nTo run existing migrations, after defining the columns, simply run:\n\n\
    ```bash\nphp artisan migrate\n```\n\nOr to drop(rollback) the last table:\n\n\
    ```bash\nphp artisan migrate:rollback\n```\n\nOr to rollback all tables in a database\
    \ and create them back immediately to clear the existing data run:\n\n```bash\n\
    php artisan migrate:reset\n```\n\nThere are a lot of things to Laravel migrations,\
    \ that is beyond the scope of this book but nevertheless we would be covering\
    \ most of the important aspects to it. Visit Laravel official documentation `https://laravel.com/docs/5.8/migrations`\
    \ to learn more.\n\nTo migrate our existing user migration, already shipped with\
    \ your Laravel installation under `database/migrations` directory. We need to\
    \ first create a database called `inventory_app` using any of your most preferred\
    \ database manager, could be using mysql via command line, phpmyadmin, sequelpro\
    \ or whatever, next create a `.env` file in your `inventory_app` project root\
    \ directory from your editor and copy the content from already existing `.env.example`\
    \ into it.\n\nFinally edit the `.env` file and change the value of the database\
    \ connection to yours:\n\n```dotenv\nDB_CONNECTION=mysql\nDB_HOST=127.0.0.1\n\
    DB_PORT=3306\nDB_DATABASE=inventory_app\nDB_USERNAME=root\nDB_PASSWORD=mypassword\n\
    ```\n\nNow run:\n\n```bash\nphp artisan migrate\n```\n\nFrom your terminal or\
    \ git bash. If you are getting an error `Syntax error or access violation: 1231\
    \ Variable 'sql_mode' can't be set to the value of 'NO_AUTO_CREATE_USER'`, simply\
    \ locate the file `config/database.php` from your editor, and on line 55 after\
    \ `engine=> null`, paste this snippet of code, then rerun your migration:\n\n\
    ```php\n'modes' => [\n    'ONLY_FULL_GROUP_BY',\n    'STRICT_TRANS_TABLES',\n\
    \    'NO_ZERO_IN_DATE',\n    'NO_ZERO_DATE',\n    'ERROR_FOR_DIVISION_BY_ZERO',\n\
    \    'NO_ENGINE_SUBSTITUTION',\n],\n```\n\n## A Little About the .env (DotEnv)\
    \ File\n\n`.env` file which contains environment variables for your app settings,\
    \ it contains a one row – one `KEY=VALUE` pair. And within your Laravel project\
    \ code you can get those environment variables with function `env('KEY')`.\n\n\
    Laravel's `.env` file is included to use, so it's easy to have a different configuration\
    \ based on the environment your app is running on. This gives you the flexibility\
    \ to have different variables for local, staging, production, and even different\
    \ developers' machines.\n\nYour `.env` file should not be committed to your application's\
    \ source control (e.g git), since each developer/server using your application\
    \ could require a different environment configuration. Furthermore, this would\
    \ be a security risk in the event an intruder gains access to your source control\
    \ repository, since any sensitive credentials would get exposed.\n\nRule of thumb,\
    \ always add your `.env` to `.gitignore` if you use git for your version control,\
    \ so your credentials do not get pushed to public eyes.\n\n## Login\n\nBefore\
    \ we proceed it's important to know that once you update your `.env` file, you\
    \ have to reserve your Laravel application, this is because everytime you serve\
    \ a Laravel application the environment variable is loaded and you would have\
    \ to restart it to load the new changes.\n\nStop the current `php artisan serve`\
    \ command running on the terminal and run the command again. Visit the registration\
    \ page `http://127.0.0.1:8000/register` to create an account and you will be automatically\
    \ logged in to the app dashboard.\n\n# Building The Dashboard\n\nIn this chapter\
    \ we would start by restructuring the view of our dashboard, topbar and sidenav,\
    \ then move on to implement each of the sidenav features.\n\nHere are the list\
    \ of features we would be building:\n\n- Show a welcome message to logged in users\
    \ and the number of inventories available.\n- Create inventory.\n- List all inventories.\n\
    - Edit inventory if it was created by a logged in user.\n- Delete inventory if\
    \ it was created by a logged in user.\n- Trash listing deleted inventory and how\
    \ long left before clearing from trash.\n- Cron job to clear expired inventory\
    \ from trash 3mins after in trash.\n\n## SideNav\n\nChange the placeholder sidenav\
    \ content from our borrowed bootstrap theme. Edit your `resources/views/layout/partials/_sidenav.blade.php`\
    \ to match below:\n\n```html\n<div class=\"bg-light border-right\" id=\"sidebar-wrapper\"\
    >\n    <div class=\"sidebar-heading\">{{ config('app.name') }}</div>\n    <div\
    \ class=\"list-group list-group-flush\">\n        <a href=\"#\" class=\"list-group-item\
    \ list-group-item-action bg-light\">Dashboard</a>\n        <a href=\"#\" class=\"\
    list-group-item list-group-item-action bg-light\">View Inventories</a>\n     \
    \   <a href=\"#\" class=\"list-group-item list-group-item-action bg-light\">New\
    \ Inventory</a>\n        <a href=\"#\" class=\"list-group-item list-group-item-action\
