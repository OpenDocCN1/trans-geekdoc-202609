    >  \n\n                <a class=\"dropdown-item\" href=\"#\"\\>Something else\
    \ here</a\\>  \n\n              </div\\>  \n\n            </li\\>  \n\n         \
    \ </ul\\>  \n\n        </div\\>  \n\n      </nav\\>  \n\n      <div class=\"container-fluid\"\
    \\>  \n\n        <h1 class=\"mt-4\"\\>Simple Sidebar</h1\\>  \n\n        <p\\\
    >The starting state of the menu will appear collapsed on smaller screens, and\
    \ will appear non-collapsed on larger screens. When toggled using the button below,\
    \ the menu will change.</p\\>  \n\n        <p\\>Make sure to keep all page content\
    \ within the <code\\>#page-content-wrapper</code\\>. The top navbar is optional,\
    \ and just for demonstration. Just create an element with the <code\\>#menu-toggle</code\\\
    > ID which will toggle the menu when clicked.</p\\>  \n\n      </div\\>  \n\n\
        </div\\>  \n\n    <!-- /#page-content-wrapper -->  \n\n  </div\\>  \n\n  <!--\
    \ /#wrapper -->  \n\n  <!-- Bootstrap core JavaScript -->  \n\n  <script src=\"\
    vendor/jquery/jquery.min.js\"\\></script\\>  \n\n  <script src=\"vendor/bootstrap/js/bootstrap.bundle.min.js\"\
    \\></script\\>  \n\n  <!-- Menu Toggle Script -->  \n\n  <script\\>  \n\n    $(\"\
    #menu-toggle\").click(function(e) {  \n\n      e.preventDefault();  \n\n     \
    \ $(\"#wrapper\").toggleClass(\"toggled\");  \n\n    });  \n\n  </script\\>  \n\
    \n</body\\>  \n\n</html\\> |\n\n| --- |\n\nOpen the inventory project in your\
    \ preferred editor, I use PHPStorm.  Navigate to resources > welcome.blade.php\
    \ and replace the content with the source code of the bootstrap theme above.\n\
    \nNotice if you reload the app in your browser it will show without style which\
    \ looks very terrible, now head on to the official bootstrap website to download\
    \ bootstrap 4.3, the compiled version. \n\nYou can directly copy and paste the\
    \ link below into your browser to download it.\n\n| https://github.com/twbs/bootstrap/releases/download/v4.3.1/bootstrap-4.3.1-dist.zip\
    \ |\n\n| --- |\n\nExtract the zip files, locate bootstrap.min.css file, copy it\
    \ to your project directory under public/css, locate bootstrap.bundle.min.js file\
    \ and copy it to  public/js. Bootstrap needs jquery support, so create a new file\
    \ jquery.min.js under public/js and visit the url below in your browser and copy\
    \ the content inside the file.\n\n| https://code.jquery.com/jquery-3.4.1.min.js\
    \ |\n\n| --- |\n\nNow we need to reference the new bootstrap and jquery assets\
    \ we just added to our project on the welcome.blade.php page. In order to do so,\
    \ replace the old reference with a new one.\n\n| //Replace this  \n\n<script src=\"\
    vendor/jquery/jquery.min.js\"\\></script>  \n\n<script src=\"vendor/bootstrap/js/bootstrap.bundle.min.js\"\
    \\></script>  \n\n//With this  \n\n<script src=\"{{asset('js/jquery.min.js')}}\"\
    \\></script>  \n\n<script src=\"{{asset('js/bootstrap.bundle.min.js')}}\"\\></script>\
    \ |\n\n| --- |\n\n| //Replace this  \n\n<link href=\"vendor/bootstrap/css/bootstrap.min.css\"\
    \ rel=\"stylesheet\"\\>  \n\n//With this  \n\n<link href=\"{{asset('css/bootstrap.min.css')}}\"\
    \ rel=\"stylesheet\"\\> |\n\n| --- |\n\nNow create a new file simple-sidebar.css\
    \ under the public/css folder and paste the below content inside the file.\n\n\
    | body {  \n\n  overflow-x: hidden;  \n\n}  \n\n#sidebar-wrapper {  \n\n  min-height:\
    \ 100vh;  \n\n  margin-left: -15rem;  \n\n  \\-webkit-transition: margin .25s\
    \ ease-out;  \n\n  \\-moz-transition: margin .25s ease-out;  \n\n  \\-o-transition:\
    \ margin .25s ease-out;  \n\n  transition: margin .25s ease-out;  \n\n}  \n\n\
    #sidebar-wrapper .sidebar-heading {  \n\n  padding: 0.875rem 1.25rem;  \n\n  font-size:\
    \ 1.2rem;  \n\n}  \n\n#sidebar-wrapper .list-group {  \n\n  width: 15rem;  \n\n\
    }  \n\n#page-content-wrapper {  \n\n  min-width: 100vw;  \n\n}  \n\n#wrapper.toggled\
    \ #sidebar-wrapper {  \n\n  margin-left: 0;  \n\n}  \n\n@media (min-width: 768px)\
    \ {  \n\n  #sidebar-wrapper {  \n\n    margin-left: 0;  \n\n  }  \n\n  #page-content-wrapper\
    \ {  \n\n    min-width: 0;  \n\n    width: 100%;  \n\n  }  \n\n  #wrapper.toggled\
    \ #sidebar-wrapper {  \n\n    margin-left: -15rem;  \n\n  }  \n\n} |\n\n| ---\
    \ |\n\nChange the old reference of the sidebar css to the new one we just created.\n\
    \n| //Replace this  \n\n <link href=\"css/simple-sidebar.css\" rel=\"stylesheet\"\
    \\>  \n\n//With this  \n\n<link href=\"{{asset('css/simple-sidebar.css')}}\" rel=\"\
    stylesheet\"\\> |\n\n| --- |\n\nThe welcome page should load fine now.\n\n## Defining\
    \ a Layout\n\nSince we would be maintaining a similar view across pages, Laravel\
    \ provides us with a way to define a master layout where other pages, known as\
    \ child view can extend from. So things such as navigation, header styles, footer\
    \ script or content can remain in a master view where child view extending it\
    \ can extend and override some part of it, depending on how we define it and what\
    \ we want."
  fmt: "\n# 使用 StartBootstrap Simple Sidebar 主题创建视图脚手架\n\n我们将使用 StartBootstrap Simple\
    \ Sidebar Theme（一个免费的 Bootstrap 4 基础模板）来创建我们的视图脚手架。你可以在此处找到它：[https://blackrockdigital.github.io/startbootstrap-simple-sidebar](https://blackrockdigital.github.io/startbootstrap-simple-sidebar/)。在页面上右键单击并选择“查看页面源代码”以复制\
    \ HTML 代码。\n\n## HTML 模板代码\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
    \  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1, shrink-to-fit=no\">\n  <meta name=\"description\" content=\"\
    \">\n  <meta name=\"author\" content=\"\">\n  <title>Simple Sidebar - Start Bootstrap\
    \ Template</title>\n  <!-- Bootstrap core CSS -->\n  <link href=\"vendor/bootstrap/css/bootstrap.min.css\"\
    \ rel=\"stylesheet\">\n  <!-- Custom styles for this template -->\n  <link href=\"\
    css/simple-sidebar.css\" rel=\"stylesheet\">\n</head>\n<body>\n  <div class=\"\
    d-flex\" id=\"wrapper\">\n    <!-- Sidebar -->\n    <div class=\"bg-light border-right\"\
    \ id=\"sidebar-wrapper\">\n      <div class=\"sidebar-heading\">Start Bootstrap\
    \ </div>\n      <div class=\"list-group list-group-flush\">\n        <a href=\"\
    #\" class=\"list-group-item list-group-item-action bg-light\">Dashboard</a>\n\
    \        <a href=\"#\" class=\"list-group-item list-group-item-action bg-light\"\
    >Shortcuts</a>\n        <a href=\"#\" class=\"list-group-item list-group-item-action\
    \ bg-light\">Overview</a>\n        <a href=\"#\" class=\"list-group-item list-group-item-action\
    \ bg-light\">Events</a>\n        <a href=\"#\" class=\"list-group-item list-group-item-action\
    \ bg-light\">Profile</a>\n        <a href=\"#\" class=\"list-group-item list-group-item-action\
    \ bg-light\">Status</a>\n      </div>\n    </div>\n    <!-- /#sidebar-wrapper\
    \ -->\n    <!-- Page Content -->\n    <div id=\"page-content-wrapper\">\n    \
    \  <nav class=\"navbar navbar-expand-lg navbar-light bg-light border-bottom\"\
    >\n        <button class=\"btn btn-primary\" id=\"menu-toggle\">Toggle Menu</button>\n\
    \        <button class=\"navbar-toggler\" type=\"button\" data-toggle=\"collapse\"\
    \ data-target=\"#navbarSupportedContent\" aria-controls=\"navbarSupportedContent\"\
    \ aria-expanded=\"false\" aria-label=\"Toggle navigation\">\n          <span class=\"\
    navbar-toggler-icon\"></span>\n        </button>\n        <div class=\"collapse\
    \ navbar-collapse\" id=\"navbarSupportedContent\">\n          <ul class=\"navbar-nav\
    \ ml-auto mt-2 mt-lg-0\">\n            <li class=\"nav-item active\">\n      \
    \        <a class=\"nav-link\" href=\"#\">Home <span class=\"sr-only\">(current)</span></a>\n\
    \            </li>\n            <li class=\"nav-item\">\n              <a class=\"\
    nav-link\" href=\"#\">Link</a>\n            </li>\n            <li class=\"nav-item\
    \ dropdown\">\n              <a class=\"nav-link dropdown-toggle\" href=\"#\"\
    \ id=\"navbarDropdown\" role=\"button\" data-toggle=\"dropdown\" aria-haspopup=\"\
    true\" aria-expanded=\"false\">\n                Dropdown\n              </a>\n\
    \              <div class=\"dropdown-menu dropdown-menu-right\" aria-labelledby=\"\
    navbarDropdown\">\n                <a class=\"dropdown-item\" href=\"#\">Action</a>\n\
    \                <a class=\"dropdown-item\" href=\"#\">Another action</a>\n  \
    \              <div class=\"dropdown-divider\"></div>\n                <a class=\"\
    dropdown-item\" href=\"#\">Something else here</a>\n              </div>\n   \
    \         </li>\n          </ul>\n        </div>\n      </nav>\n      <div class=\"\
    container-fluid\">\n        <h1 class=\"mt-4\">Simple Sidebar</h1>\n        <p>The\
    \ starting state of the menu will appear collapsed on smaller screens, and will\
    \ appear non-collapsed on larger screens. When toggled using the button below,\
    \ the menu will change.</p>\n        <p>Make sure to keep all page content within\
    \ the `#page-content-wrapper`. The top navbar is optional, and just for demonstration.\
    \ Just create an element with the `#menu-toggle` ID which will toggle the menu\
    \ when clicked.</p>\n      </div>\n    </div>\n    <!-- /#page-content-wrapper\
    \ -->\n  </div>\n  <!-- /#wrapper -->\n  <!-- Bootstrap core JavaScript -->\n\
    \  <script src=\"vendor/jquery/jquery.min.js\"></script>\n  <script src=\"vendor/bootstrap/js/bootstrap.bundle.min.js\"\
    ></script>\n  <!-- Menu Toggle Script -->\n  <script>\n    $(\"#menu-toggle\"\
    ).click(function(e) {\n      e.preventDefault();\n      $(\"#wrapper\").toggleClass(\"\
    toggled\");\n    });\n  </script>\n</body>\n</html>\n```\n\n## 集成到 Laravel 项目\n\
    \n在你偏好的编辑器中打开 inventory 项目（我使用 PHPStorm）。导航到 `resources > welcome.blade.php` 并将内容替换为上述\
    \ Bootstrap 主题的源代码。\n\n请注意，如果你在浏览器中重新加载应用，它将显示为无样式状态（外观非常糟糕）。现在前往 Bootstrap 官网下载\
    \ Bootstrap 4.3 编译版本。你可以直接将以下链接复制粘贴到浏览器中以下载：\n\n> https://github.com/twbs/bootstrap/releases/download/v4.3.1/bootstrap-4.3.1-dist.zip\n\
    \n解压 zip 文件，找到 `bootstrap.min.css` 文件，将其复制到项目目录下的 `public/css` 中；找到 `bootstrap.bundle.min.js`\
    \ 文件并将其复制到 `public/js`。Bootstrap 需要 jQuery 支持，因此在 `public/js` 下创建一个新文件 `jquery.min.js`，访问以下\
    \ URL 并将文件内容复制进去：\n\n> https://code.jquery.com/jquery-3.4.1.min.js\n\n## 更新资源引用\n\
    \n现在我们需要在 `welcome.blade.php` 页面中引用刚才添加的新 Bootstrap 和 jQuery 资源。为此，请替换旧的引用。\n\n\
    **替换 JavaScript 引用：**\n\n```html\n// Replace this\n<script src=\"vendor/jquery/jquery.min.js\"\
    ></script>\n<script src=\"vendor/bootstrap/js/bootstrap.bundle.min.js\"></script>\n\
    \n// With this\n<script src=\"{{ asset('js/jquery.min.js') }}\"></script>\n<script\
    \ src=\"{{ asset('js/bootstrap.bundle.min.js') }}\"></script>\n```\n\n**替换 CSS\
    \ 引用：**\n\n```html\n// Replace this\n<link href=\"vendor/bootstrap/css/bootstrap.min.css\"\
    \ rel=\"stylesheet\">\n\n// With this\n<link href=\"{{ asset('css/bootstrap.min.css')\
    \ }}\" rel=\"stylesheet\">\n```\n\n## 添加侧边栏自定义样式\n\n现在在 `public/css` 文件夹下创建一个新文件\
    \ `simple-sidebar.css` 并将以下内容粘贴到文件中。\n\n```css\nbody {\n  overflow-x: hidden;\n\
    }\n\n#sidebar-wrapper {\n  min-height: 100vh;\n  margin-left: -15rem;\n  -webkit-transition:\
    \ margin .25s ease-out;\n  -moz-transition: margin .25s ease-out;\n  -o-transition:\
    \ margin .25s ease-out;\n  transition: margin .25s ease-out;\n}\n\n#sidebar-wrapper\
    \ .sidebar-heading {\n  padding: 0.875rem 1.25rem;\n  font-size: 1.2rem;\n}\n\n\
    #sidebar-wrapper .list-group {\n  width: 15rem;\n}\n\n#page-content-wrapper {\n\
    \  min-width: 100vw;\n}\n\n#wrapper.toggled #sidebar-wrapper {\n  margin-left:\
    \ 0;\n}\n\n@media (min-width: 768px) {\n  #sidebar-wrapper {\n    margin-left:\
    \ 0;\n  }\n  #page-content-wrapper {\n    min-width: 0;\n    width: 100%;\n  }\n\
    \  #wrapper.toggled #sidebar-wrapper {\n    margin-left: -15rem;\n  }\n}\n```\n\
    \n将旧的侧边栏 CSS 引用更改为刚创建的新引用。\n\n```html\n// Replace this\n<link href=\"css/simple-sidebar.css\"\
    \ rel=\"stylesheet\">\n\n// With this\n<link href=\"{{ asset('css/simple-sidebar.css')\
    \ }}\" rel=\"stylesheet\">\n```\n\n现在欢迎页面应该能正常加载了。\n\n# 定义布局\n\n由于我们将在各页面间维护相似的视图，Laravel\
    \ 为我们提供了一种定义主布局的方法，其他页面（称为子视图）可以从此扩展。这样，导航、头部样式、底部脚本或内容等可以保留在主视图中，扩展它的子视图可以根据我们的定义和需求来扩展和覆盖其中的某些部分。\n"
