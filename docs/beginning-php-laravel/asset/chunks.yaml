    \ bg-light\">Logout</a>\n    </div>\n</div>\n```\n\nNotice the use of `config`\
    \ function to get the app name defined in the `.env` file. We will be updating\
    \ the `APP_NAME` key to the value `Laraventory` in the `.env` file. Now re-serve\
    \ the application by stopping the current `php artisan serve` command and rerunning\
    \ it from the terminal, so the server can load the new changes made.\n\n> **Note**\n\
    >\n> In blade templating `{{ config('app.name') }}` is the same as `<?php echo\
    \ config('app.name') ?>` and `<?php if( a == b) { echo 'True' }else{ echo 'False'\
    \ }` is also same as `@if(a === b) {{ 'True' }} @else {{ 'False' }}`.\n> More\
    \ on using blade templating `https://laravel.com/docs/5.4/blade#displaying-data`\
    \ here.\n\n## NavBar\n\nChange the placeholder navbar content from our borrowed\
    \ bootstrap theme. Edit your `resources/views/layout/partials/_navbar.blade.php`\
    \ to match below:\n\n```html\n<nav class=\"navbar navbar-expand-lg navbar-light\
    \ bg-light border-bottom\">\n    <button class=\"btn btn-primary\" id=\"menu-toggle\"\
    >☰</button>\n    <button class=\"navbar-toggler\" type=\"button\" data-toggle=\"\
    collapse\" data-target=\"#navbarSupportedContent\" aria-controls=\"navbarSupportedContent\"\
    \ aria-expanded=\"false\" aria-label=\"Toggle navigation\">\n        <span class=\"\
    navbar-toggler-icon\"></span>\n    </button>\n    <div class=\"collapse navbar-collapse\"\
    \ id=\"navbarSupportedContent\">\n        <ul class=\"navbar-nav ml-auto mt-2\
    \ mt-lg-0\">\n            <li class=\"nav-item dropdown\">\n                <a\
    \ class=\"nav-link dropdown-toggle\" href=\"#\" id=\"navbarDropdown\" role=\"\
    button\" data-toggle=\"dropdown\" aria-haspopup=\"true\" aria-expanded=\"false\"\
    >\n                    Account Settings\n                </a>\n            </li>\n\
    \        </ul>\n    </div>\n</nav>\n```\n"
  trans: "\n\n# Laravel 迁移\n\n你是否曾经不得不处理创建包含许多列的大量表的数据库？结果还得不时地更改架构？尝试在项目上协作有多容易？却没有简单的方法知道已存在什么架构，定义了什么关系或约束，并让每个人都能轻松保持相同版本的架构，而无需告诉他们添加什么或不添加什么，不得不费力劳作！Laravel\
    \ 迁移来拯救你了！\n\n正如 Laravel 文档所定义，迁移就像是你数据库的版本控制，允许你的团队轻松修改和共享应用程序的数据库架构。迁移通常与 Laravel\
    \ 的架构构建器搭配使用，以便轻松构建应用程序的数据库架构。如果你曾经不得不告诉队友手动向他们的本地数据库架构添加列，那么你就遇到了数据库迁移所要解决的问题。\n\
    \n我们稍后将创建迁移，但现在我们将运行现有的用户和密码迁移。要创建新的迁移，我们需要运行命令：\n\n```bash\nphp artisan make:migration\
    \ create_{复数表名}_table\n```\n\n// 例如：\n\n```bash\nphp artisan make:migration create_users_table\n\
    ```\n\n定义好列后，要运行现有迁移，只需运行：\n\n```bash\nphp artisan migrate\n```\n\n或者删除（回滚）最后一张表：\n\
    \n```bash\nphp artisan migrate:rollback\n```\n\n或者回滚数据库中的所有表并立即重新创建它们以清除现有数据，请运行：\n\
    \n```bash\nphp artisan migrate:reset\n```\n\n关于 Laravel 迁移还有很多内容，超出了本书的范围，但尽管如此，我们将涵盖其中大部分重要方面。访问\
    \ Laravel 官方文档 `https://laravel.com/docs/5.8/migrations` 了解更多。\n\n要迁移我们现有的用户迁移（随\
    \ Laravel 安装一起提供，位于 `database/migrations` 目录下），我们首先需要使用你最喜欢的任何数据库管理器创建一个名为 `inventory_app`\
    \ 的数据库，可以是通过命令行使用 mysql、phpmyadmin、sequelpro 或其他工具，接下来在你的 `inventory_app` 项目根目录下从编辑器中创建一个\
    \ `.env` 文件，并将已有 `.env.example` 的内容复制进去。\n\n最后编辑 `.env` 文件，将数据库连接的值更改为你的配置：\n\n\
    ```dotenv\nDB_CONNECTION=mysql\nDB_HOST=127.0.0.1\nDB_PORT=3306\nDB_DATABASE=inventory_app\n\
    DB_USERNAME=root\nDB_PASSWORD=mypassword\n```\n\n现在运行：\n\n```bash\nphp artisan\
    \ migrate\n```\n\n从你的终端或 git bash 运行。如果你遇到错误 `Syntax error or access violation:\
    \ 1231 Variable 'sql_mode' can't be set to the value of 'NO_AUTO_CREATE_USER'`，只需从编辑器中找到文件\
    \ `config/database.php`，在第 55 行 `engine=> null` 之后，粘贴这段代码片段，然后重新运行迁移：\n\n```php\n\
    'modes' => [\n    'ONLY_FULL_GROUP_BY',\n    'STRICT_TRANS_TABLES',\n    'NO_ZERO_IN_DATE',\n\
    \    'NO_ZERO_DATE',\n    'ERROR_FOR_DIVISION_BY_ZERO',\n    'NO_ENGINE_SUBSTITUTION',\n\
    ],\n```\n\n## 关于 .env (DotEnv) 文件的一点说明\n\n`.env` 文件包含应用程序设置的环境变量，它包含一行一个 `KEY=VALUE`\
    \ 对。在你的 Laravel 项目代码中，你可以使用函数 `env('KEY')` 获取这些环境变量。\n\nLaravel 的 `.env` 文件被包含以供使用，因此可以根据应用程序运行的环境轻松拥有不同的配置。这使你能灵活地为本地、预发布、生产环境，甚至不同开发者的机器设置不同的变量。\n\
    \n你的 `.env` 文件**不应**提交到应用程序的源代码控制中（例如 git），因为使用你应用程序的每个开发者/服务器可能需要不同的环境配置。此外，如果入侵者访问了你的源代码控制仓库，这将构成安全风险，因为任何敏感凭据都会暴露。\n\
    \n经验法则：如果你使用 git 进行版本控制，始终将 `.env` 添加到 `.gitignore` 中，以免你的凭据被推送到公众视野。\n\n## 登录\n\
    \n在继续之前，重要的是要知道一旦你更新了 `.env` 文件，就必须**重启**你的 Laravel 应用程序，因为每次你启动 Laravel 应用程序时都会加载环境变量，你必须重启它以加载新的更改。\n\
    \n停止终端上正在运行的 `php artisan serve` 命令并再次运行该命令。访问注册页面 `http://127.0.0.1:8000/register`\
    \ 创建一个账户，你将自动登录到应用程序仪表盘。\n\n# 构建仪表盘\n\n在本章中，我们将首先重构仪表盘、顶栏和侧边栏的视图，然后继续实现每个侧边栏功能。\n\
    \n以下是我们将要构建的功能列表：\n\n- 向已登录用户显示欢迎消息和可用库存的数量。\n- 创建库存。\n- 列出所有库存。\n- 如果库存是由已登录用户创建的，则编辑库存。\n\
    - 如果库存是由已登录用户创建的，则删除库存。\n- 回收站列出已删除的库存以及清空前剩余的时间。\n- 定时任务在库存进入回收站 3 分钟后清除过期库存。\n\
    \n## 侧边栏\n\n更改我们借用的 Bootstrap 主题中的占位符侧边栏内容。编辑你的 `resources/views/layout/partials/_sidenav.blade.php`\
    \ 以匹配下方内容：\n\n```html\n<div class=\"bg-light border-right\" id=\"sidebar-wrapper\"\
    >\n    <div class=\"sidebar-heading\">{{ config('app.name') }}</div>\n    <div\
    \ class=\"list-group list-group-flush\">\n        <a href=\"#\" class=\"list-group-item\
    \ list-group-item-action bg-light\">Dashboard</a>\n        <a href=\"#\" class=\"\
    list-group-item list-group-item-action bg-light\">View Inventories</a>\n     \
    \   <a href=\"#\" class=\"list-group-item list-group-item-action bg-light\">New\
    \ Inventory</a>\n        <a href=\"#\" class=\"list-group-item list-group-item-action\
    \ bg-light\">Trash</a>\n        <a href=\"#\" class=\"list-group-item list-group-item-action\
    \ bg-light\">Logout</a>\n    </div>\n</div>\n```\n\n注意 `config` 函数的使用，用于获取在 `.env`\
    \ 文件中定义的应用名称。我们将在 `.env` 文件中将 `APP_NAME` 键的值更新为 `Laraventory`。现在通过停止当前的 `php artisan\
    \ serve` 命令并从终端重新运行它来重新启动应用程序，以便服务器可以加载所做的新更改。\n\n> **注意**\n>\n> 在 Blade 模板中 `{{\
    \ config('app.name') }}` 等同于 `<?php echo config('app.name') ?>`，而 `<?php if( a\
    \ == b) { echo 'True' }else{ echo 'False' }` 也等同于 `@if(a === b) {{ 'True' }} @else\
    \ {{ 'False' }}`。\n> 更多关于使用 Blade 模板的信息 `https://laravel.com/docs/5.4/blade#displaying-data`\
    \ 请看这里。\n\n## 导航栏\n\n更改我们借用的 Bootstrap 主题中的占位符导航栏内容。编辑你的 `resources/views/layout/partials/_navbar.blade.php`\
    \ 以匹配下方内容：\n\n```html\n<nav class=\"navbar navbar-expand-lg navbar-light bg-light\
    \ border-bottom\">\n    <button class=\"btn btn-primary\" id=\"menu-toggle\">☰</button>\n\
    \    <button class=\"navbar-toggler\" type=\"button\" data-toggle=\"collapse\"\
    \ data-target=\"#navbarSupportedContent\" aria-controls=\"navbarSupportedContent\"\
    \ aria-expanded=\"false\" aria-label=\"Toggle navigation\">\n        <span class=\"\
    navbar-toggler-icon\"></span>\n    </button>\n    <div class=\"collapse navbar-collapse\"\
    \ id=\"navbarSupportedContent\">\n        <ul class=\"navbar-nav ml-auto mt-2\
    \ mt-lg-0\">\n            <li class=\"nav-item dropdown\">\n                <a\
    \ class=\"nav-link dropdown-toggle\" href=\"#\" id=\"navbarDropdown\" role=\"\
    button\" data-toggle=\"dropdown\" aria-haspopup=\"true\" aria-expanded=\"false\"\
    >\n                    Account Settings\n                </a>\n            </li>\n\
    \        </ul>\n    </div>\n</nav>\n```\n\n"
