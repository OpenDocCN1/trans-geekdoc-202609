- raw: "HTML forms do not support PUT, PATCH or DELETE actions. So, when defining\
    \ PUT, PATCH or DELETE routes that are called from an HTML form, you will need\
    \ to add a hidden \\_method field to the form. The value sent with the \\_method\
    \ field will be used as the HTTP request method:\n\nIf you refresh your browser\
    \ now and click on the view inventories menu you will be presented with an empty\
    \ table. Now let's get to the inserting into database part.\n\nUpdate your InventoryController\
    \ to match below code, I will explain in details afterwards.\n\n| <?php  \n\n\
    namespace App\\\\Http\\\\Controllers;  \n\nuse App\\\\Http\\\\Requests\\\\StoreInventory;\
    \  \n\nuse App\\\\Inventory;  \n\nuse Illuminate\\\\Http\\\\Request;  \n\nclass\
    \ InventoryController extends Controller  \n\n{  \n\n    public $inventory;  \n\
    \n    public function \\_\\_construct(Inventory $inventory)  \n\n    {  \n\n       \
    \ $this\\->inventory = $inventory;  \n\n    }  \n\n    public function createInventory()\
    \  \n\n    {  \n\n        return view('new-inventory');  \n\n    }  \n\n       \
    \ public function storeInventory(StoreInventory $storeInventory)  \n\n    {       \
    \ $data = $storeInventory->only('item','quantity');  \n\n        auth()->user()-\\\
    >inventory()->create($data);        $msg = 'New inventory successfully added!';\
    \  \n\n        return redirect()->route('inventory.all')->with('message',$msg);\
    \  \n\n    }  \n\n    public function viewInventories()  \n\n    {  \n\n       \
    \ $inventories = $this\\->inventory->all();  \n\n        return view('view-inventories',compact('inventories'));\
    \  \n\n    }  \n\n    /\\*\\*  \n\n     \\* @param Inventory $inventory  \n\n\
         \\* @return \\\\Illuminate\\\\Http\\\\RedirectResponse  \n\n     \\* @throws\
    \ \\\\Exception  \n\n     \\*/  \n\n    public function drop(Inventory $inventory)\
    \  \n\n    {  \n\n        $inventory->delete();  \n\n        return redirect()->route('inventory.all')              \
    \ ->with('message','New inventory successfully added!');  \n\n    }  \n\n}  |\n\
    \n| --- |\n\nWe imported both the Inventory model class and StoreInventory Form\
    \ request class using PHP use keyword.\n\n| use App\\\\Http\\\\Requests\\\\StoreInventory;\
    \  \n\nuse App\\\\Inventory; |\n\n| --- |\n\nWe defined the property $inventory\
    \ to hold the $inventory model object which was injected through the controller.\n\
    \n|     public $inventory;  \n\n    public function \\_\\_construct(Inventory\
    \ $inventory)  \n\n    {  \n\n        $this\\->inventory = $inventory;  \n\n   \
    \ }  \n\n  |\n\n| --- |\n\nHere we did a method injection of the StoreInventory\
    \ object. Laravel will automatically resolve and detect if it’s a Form Request\
    \ then apply the rules to validate the incoming data, again this is Laravel trying\
    \ to make a developer life easier. \n\nUsually when a user submits a form, you\
    \ can access the request data using the php $\\_POST or $\\_GET  super global\
    \ variable, with Laravel you can access the data from the Request object which\
    \ you can inject into your controller constructor or controller methods. In our\
    \ storeInventory method the StoreInventory Form Request object is injected and\
    \ it extends the Request class, so we don’t need to inject the Request object\
    \ the second time, to access our  get or post data from the current http request.\n\
    \nLaravel provides us with different methods on the request class to access data.\
    \ There is method all to retrieve all data from request, method only to specify\
    \ keys to retrieve, method get to access request param. There are others such\
    \ as except, intersect ,input e.t.c. \n\nWe will call the create method on the\
    \ inventory model via the user-inventory relationship, this way the user\\_id\
    \ foriegn field will be the current logged in user. After inserting into the database,\
    \ we redirect users  to the list all inventories page with a successful notification\
    \ message displayed to them.\n\n|  public function storeInventory(StoreInventory\
    \ $storeInventory)  \n\n {  \n\n        $data = $storeInventory->only('item','quantity');\
    \  \n\n        auth()->user()->inventory()\\->create($data);  \n\n        $msg\
    \ = 'New inventory successfully added!';  \n\n        return redirect()->route('inventory.all')->with('message',$msg);\
    \  \n\n } |\n\n| --- |\n\nHere we are getting all inventories from the database,\
    \ by calling the all method from the inventory model.  There are other methods\
    \ such as latest to fetch them in ascending order, first to get the first row\
    \ matching a where condition, select to choose fields you want returned and get\
    \ method. Laravel provides us with many more query builders that makes it convenient\
    \ to query data from the database, you don’t have to write or try to remember\
    \ any SQL query in most cases, as I will be careful not to say never again.\n\n\
    | public function viewInventories()  \n\n{  \n\n    $inventories = $this\\->inventory->all();\
    \  \n\n    return view('view-inventories',compact('inventories'));  \n\n} |\n\n\
    | --- |\n\nThere are two concepts I would like to shed more light to when it comes\
    \ to deleting an inventory. First is how we defined our route and how we used\
    \ it in the loop of the list inventories page.\n\nIn our route definition, the\
    \ second segment of the URL is a route parameter that will be replaced with id\
    \ of each inventory. It will be generated by the route function, all we need do\
    \ is pass the id as a second parameter to the route function, you can have more\
    \ than one route parameter, and in that case pass an array with the parameters\
    \ in the other that they appear as the second parameter to the route function.\n\
    \nIn addition to that, Laravel helps do something called Route Model Binding.\
    \ When we inject an id to our route like we are doing in this case, Laravel resolves\
    \ the Eloquent Model, based on the type hint in the url, in our case {inventory}.\
    \ In simple english, if our URL is /inventories/1/drop, Laravel will look for\
    \ the row with id 1 from the inventory model (inventories table) and return it\
    \ to us in the controller.\n\n| //Route definition  \n\n$route->delete('/inventories/{inventory}/drop','InventoryController@drop')->name('inventory.delete');\
    \  \n\n//Route usage  \n\n{{ route('inventory.delete',$inventory->id) }} |\n\n\
    | --- |\n\nHere we just simply type hint the model to be injected based on the\
    \ route model binding, and we call the method delete on the model object returned\
    \ which in return delete the corresponding row in the inventories table.\n\nFinally\
    \ we redirect to the page with all inventories with a notification message.\n\n\
    | public function drop(Inventory $inventory)  \n\n{  \n\n   $inventory->delete();\
    \  \n\n   return redirect()->route('inventory.all')  \n\n               ->with('message','New\
    \ inventory successfully added!');  \n\n} |\n\n| --- |\n\nOpen the resources/views/view-inventories.blade.php\
    \ in your editor, and just above the opening table tag place the code snippet\
    \ below to display notification messages flashed into session from our controller.\n\
    \n| @if(session()->has('message'))  \n\n      <div class\\=\"alert alert\\-info\"\
    >  \n\n          {{session('message')}} New inventory successfully added!  \n\n\
          </div>  \n\n @endif |\n\n| --- |\n\nRefresh the app in the browser or login\
    \ back if you are logged out, click on the New Inventory menu then submit an empty\
    \ form. You should be redirected back with error showing under the input field.\n\
    \n![](Images/image00201.jpeg)\n\nNow fill the form and click on the create new\
    \ inventory button. You should be redirected to the list inventories page with\
    \ a successful notification message.\n\n![](Images/image00202.jpeg)\n\nGo ahead\
    \ to create as many as you want and delete a few. You should be impressed on how\
    \ far we have come. Before we move on to the Trash feature, let us quickly update\
    \ our dashboard to reflect the actual numbers of  inventories created.\n\nUpdate\
    \ the AppController class to match below\n\n| <?php  \n\nnamespace App\\\\Http\\\
    \\Controllers;  \n\nuse App\\\\Inventory;  \n\nuse Illuminate\\\\Http\\\\Request;\
    \  \n\nclass AppController extends Controller  \n\n{  \n\n    public function\
    \ dashboard(Inventory $inventory)  \n\n    {  \n\n        $count = $inventory->count();\
    \  \n\n        return view('dashboard',compact('count'));  \n\n    }  \n\n} |\n\
    \n| --- |\n\nAnd line 11 on the dashboard.blade.php file"
  fmt: "\n# HTML 表单不支持 PUT、PATCH 或 DELETE 操作\n\n因此，当定义从 HTML 表单调用的 `PUT`、`PATCH` 或\
    \ `DELETE` 路由时，你需要向表单添加一个隐藏的 `_method` 字段。`_method` 字段发送的值将被用作 HTTP 请求方法。\n\n\
    如果你现在刷新浏览器并点击“查看库存”菜单，将看到一个空表格。现在让我们进入数据库插入部分。\n\n## 更新 InventoryController\n\n\
    请更新 `InventoryController` 以匹配下面的代码，我将在之后详细解释。\n\n```php\n<?php\n\nnamespace App\\\
    Http\\Controllers;\n\nuse App\\Http\\Requests\\StoreInventory;\nuse App\\Inventory;\n\
    use Illuminate\\Http\\Request;\n\nclass InventoryController extends Controller\n\
    {\n    public $inventory;\n\n    public function __construct(Inventory $inventory)\n\
    \    {\n        $this->inventory = $inventory;\n    }\n\n    public function createInventory()\n\
    \    {\n        return view('new-inventory');\n    }\n\n    public function storeInventory(StoreInventory\
    \ $storeInventory)\n    {\n        $data = $storeInventory->only('item','quantity');\n\
    \        auth()->user()->inventory()->create($data);\n        $msg = 'New inventory\
    \ successfully added!';\n        return redirect()->route('inventory.all')->with('message',$msg);\n\
    \    }\n\n    public function viewInventories()\n    {\n        $inventories =\
    \ $this->inventory->all();\n        return view('view-inventories',compact('inventories'));\n\
    \    }\n\n    /**\n     * @param Inventory $inventory\n     * @return \\Illuminate\\\
    Http\\RedirectResponse\n     * @throws \\Exception\n     */\n    public function\
    \ drop(Inventory $inventory)\n    {\n        $inventory->delete();\n        return\
    \ redirect()->route('inventory.all')\n            ->with('message','New inventory\
    \ successfully added!');\n    }\n}\n```\n\n---\n\n### 导入类\n\n我们使用 PHP `use` 关键字导入了\
    \ `Inventory` 模型类和 `StoreInventory` 表单请求类。\n\n```php\nuse App\\Http\\Requests\\\
    StoreInventory;\nuse App\\Inventory;\n```\n\n---\n\n### 依赖注入属性\n\n我们定义了属性 `$inventory`\
    \ 来保存通过控制器注入的 `$inventory` 模型对象。\n\n```php\npublic $inventory;\n\npublic function\
    \ __construct(Inventory $inventory)\n{\n    $this->inventory = $inventory;\n}\n\
    ```\n\n---\n\n### 方法注入与表单验证\n\n这里我们对 `StoreInventory` 对象进行了方法注入。Laravel 会自动解析并检测它是否为表单请求，如果是则应用规则验证传入的数据，这再次体现了\
    \ Laravel 试图让开发者生活更轻松。\n\n通常当用户提交表单时，你可以使用 PHP `$_POST` 或 `$_GET` 超全局变量访问请求数据。使用\
    \ Laravel，你可以从 `Request` 对象访问数据，该对象可注入到控制器构造函数或控制器方法中。在我们的 `storeInventory` 方法中，注入了\
    \ `StoreInventory` 表单请求对象，它继承自 `Request` 类，因此我们不需要第二次注入 `Request` 对象即可从当前 HTTP\
    \ 请求访问 GET 或 POST 数据。\n\nLaravel 在请求类上提供了不同的方法来访问数据：`all()` 方法检索所有请求数据，`only()`\
    \ 方法指定要检索的键，`get()` 方法访问请求参数。还有其他方法如 `except`、`intersect`、`input` 等。\n\n我们将通过用户-库存关系在库存模型上调用\
    \ `create()` 方法，这样外键 `user_id` 将是当前登录用户。插入数据库后，我们将用户重定向到列出所有库存的页面，并显示成功通知消息。\n\
    \n```php\npublic function storeInventory(StoreInventory $storeInventory)\n{\n\
    \    $data = $storeInventory->only('item','quantity');\n    auth()->user()->inventory()->create($data);\n\
    \    $msg = 'New inventory successfully added!';\n    return redirect()->route('inventory.all')->with('message',$msg);\n\
    }\n```\n\n---\n\n### 查询所有库存\n\n这里我们通过调用库存模型的 `all()` 方法从数据库获取所有库存。还有其他方法，如 `latest()`\
    \ 以降序获取，`first()` 获取匹配 where 条件的第一行，`select()` 选择要返回的字段以及 `get()` 方法。Laravel 为我们提供了更多查询构建器，使从数据库查询数据变得方便，在大多数情况下你不必编写或尝试记住任何\
    \ SQL 查询。\n\n```php\npublic function viewInventories()\n{\n    $inventories =\
    \ $this->inventory->all();\n    return view('view-inventories',compact('inventories'));\n\
    }\n```\n\n---\n\n## 删除库存的两个概念\n\n关于删除库存，有两个概念我想进一步阐述。首先是我们如何定义路由以及如何在列表库存页面的循环中使用它。\n\
    \n在路由定义中，URL 的第二个片段是一个路由参数，将被替换为每个库存的 ID。它将由 `route()` 函数生成，我们只需将 ID 作为第二个参数传递给\
    \ `route()` 函数。你可以有多个路由参数，在这种情况下，按它们出现的顺序将参数作为数组传递给 `route()` 函数的第二个参数。\n\n此外，Laravel\
    \ 还帮助实现了一种称为**路由模型绑定**的功能。当我们向路由注入 ID 时（如本例所示），Laravel 会根据 URL 中的类型提示解析 Eloquent\
    \ 模型，在我们的例子中是 `{inventory}`。简单来说，如果我们的 URL 是 `/inventories/1/drop`，Laravel 将在库存模型（`inventories`\
    \ 表）中查找 ID 为 1 的行并将其返回给控制器。\n\n```php\n// Route definition\n$route->delete('/inventories/{inventory}/drop','InventoryController@drop')->name('inventory.delete');\n\
    \n// Route usage\n{{ route('inventory.delete',$inventory->id) }}\n```\n\n---\n\
    \n### 控制器中的删除逻辑\n\n这里我们只需对要根据路由模型绑定注入的模型进行类型提示，并调用返回的模型对象上的 `delete()` 方法，这将删除\
    \ `inventories` 表中对应的行。\n\n最后我们重定向到包含所有库存的页面并显示通知消息。\n\n```php\npublic function\
    \ drop(Inventory $inventory)\n{\n    $inventory->delete();\n    return redirect()->route('inventory.all')\n\
    \        ->with('message','New inventory successfully added!');\n}\n```\n\n---\n\
    \n## 显示通知消息\n\n在编辑器中打开 `resources/views/view-inventories.blade.php`，在开始的 `<table>`\
    \ 标签上方放置下面的代码片段，以显示从控制器闪存到会话中的通知消息。\n\n```blade\n@if(session()->has('message'))\n\
    \    <div class=\"alert alert-info\">\n        {{session('message')}} New inventory\
    \ successfully added!\n    </div>\n@endif\n```\n\n---\n\n## 测试功能\n\n在浏览器中刷新应用，如果已登出则重新登录，点击“新建库存”菜单然后提交空表单。你应该会被重定向回带有输入字段下错误提示的页面。\n\
    \n![表单验证错误](Images/image00201.jpeg)\n\n现在填写表单并点击“创建新库存”按钮。你应该会被重定向到列出库存的页面并显示成功通知消息。\n\
    \n![创建成功提示](Images/image00202.jpeg)\n\n继续创建任意数量的库存并删除一些。你应该会对我们取得的进展印象深刻。在继续“回收站”功能之前，让我们快速更新仪表盘以反映实际创建的库存数量。\n\
    \n## 更新 AppController\n\n更新 `AppController` 类以匹配下面的代码：\n\n```php\n<?php\n\nnamespace\
    \ App\\Http\\Controllers;\n\nuse App\\Inventory;\nuse Illuminate\\Http\\Request;\n\
    \nclass AppController extends Controller\n{\n    public function dashboard(Inventory\
    \ $inventory)\n    {\n        $count = $inventory->count();\n        return view('dashboard',compact('count'));\n\
    \    }\n}\n```\n\n---\n\n以及 `dashboard.blade.php` 文件的第 11 行。\n"
  trans: "\n# HTML 表单不支持 PUT、PATCH 或 DELETE 操作\n\n因此，当定义从 HTML 表单调用的 `PUT`、`PATCH`\
    \ 或 `DELETE` 路由时，你需要向表单添加一个隐藏的 `_method` 字段。`_method` 字段发送的值将被用作 HTTP 请求方法。\n\n\
    如果你现在刷新浏览器并点击“查看库存”菜单，将看到一个空表格。现在让我们进入数据库插入部分。\n\n## 更新 InventoryController\n\n\
    请更新 `InventoryController` 以匹配下面的代码，我将在之后详细解释。\n\n```php\n<?php\n\nnamespace App\\\
    Http\\Controllers;\n\nuse App\\Http\\Requests\\StoreInventory;\nuse App\\Inventory;\n\
    use Illuminate\\Http\\Request;\n\nclass InventoryController extends Controller\n\
    {\n    public $inventory;\n\n    public function __construct(Inventory $inventory)\n\
    \    {\n        $this->inventory = $inventory;\n    }\n\n    public function createInventory()\n\
    \    {\n        return view('new-inventory');\n    }\n\n    public function storeInventory(StoreInventory\
    \ $storeInventory)\n    {\n        $data = $storeInventory->only('item','quantity');\n\
    \        auth()->user()->inventory()->create($data);\n        $msg = 'New inventory\
    \ successfully added!';\n        return redirect()->route('inventory.all')->with('message',$msg);\n\
    \    }\n\n    public function viewInventories()\n    {\n        $inventories =\
    \ $this->inventory->all();\n        return view('view-inventories',compact('inventories'));\n\
    \    }\n\n    /**\n     * @param Inventory $inventory\n     * @return \\Illuminate\\\
    Http\\RedirectResponse\n     * @throws \\Exception\n     */\n    public function\
    \ drop(Inventory $inventory)\n    {\n        $inventory->delete();\n        return\
    \ redirect()->route('inventory.all')\n            ->with('message','New inventory\
    \ successfully added!');\n    }\n}\n```\n\n---\n\n### 导入类\n\n我们使用 PHP `use` 关键字导入了\
    \ `Inventory` 模型类和 `StoreInventory` 表单请求类。\n\n```php\nuse App\\Http\\Requests\\\
    StoreInventory;\nuse App\\Inventory;\n```\n\n---\n\n### 依赖注入属性\n\n我们定义了属性 `$inventory`\
    \ 来保存通过控制器注入的 `$inventory` 模型对象。\n\n```php\npublic $inventory;\n\npublic function\
    \ __construct(Inventory $inventory)\n{\n    $this->inventory = $inventory;\n}\n\
    ```\n\n---\n\n### 方法注入与表单验证\n\n这里我们对 `StoreInventory` 对象进行了方法注入。Laravel 会自动解析并检测它是否为表单请求，如果是则应用规则验证传入的数据，这再次体现了\
    \ Laravel 试图让开发者生活更轻松。\n\n通常当用户提交表单时，你可以使用 PHP `$_POST` 或 `$_GET` 超全局变量访问请求数据。使用\
    \ Laravel，你可以从 `Request` 对象访问数据，该对象可注入到控制器构造函数或控制器方法中。在我们的 `storeInventory` 方法中，注入了\
    \ `StoreInventory` 表单请求对象，它继承自 `Request` 类，因此我们不需要第二次注入 `Request` 对象即可从当前 HTTP\
    \ 请求访问 GET 或 POST 数据。\n\nLaravel 在请求类上提供了不同的方法来访问数据：`all()` 方法检索所有请求数据，`only()`\
    \ 方法指定要检索的键，`get()` 方法访问请求参数。还有其他方法如 `except`、`intersect`、`input` 等。\n\n我们将通过用户-库存关系在库存模型上调用\
    \ `create()` 方法，这样外键 `user_id` 将是当前登录用户。插入数据库后，我们将用户重定向到列出所有库存的页面，并显示成功通知消息。\n\
    \n```php\npublic function storeInventory(StoreInventory $storeInventory)\n{\n\
    \    $data = $storeInventory->only('item','quantity');\n    auth()->user()->inventory()->create($data);\n\
    \    $msg = 'New inventory successfully added!';\n    return redirect()->route('inventory.all')->with('message',$msg);\n\
    }\n```\n\n---\n\n### 查询所有库存\n\n这里我们通过调用库存模型的 `all()` 方法从数据库获取所有库存。还有其他方法，如 `latest()`\
    \ 以降序获取，`first()` 获取匹配 where 条件的第一行，`select()` 选择要返回的字段以及 `get()` 方法。Laravel 为我们提供了更多查询构建器，使从数据库查询数据变得方便，在大多数情况下你不必编写或尝试记住任何\
    \ SQL 查询。\n\n```php\npublic function viewInventories()\n{\n    $inventories =\
    \ $this->inventory->all();\n    return view('view-inventories',compact('inventories'));\n\
    }\n```\n\n---\n\n## 删除库存的两个概念\n\n关于删除库存，有两个概念我想进一步阐述。首先是我们如何定义路由以及如何在列表库存页面的循环中使用它。\n\
    \n在路由定义中，URL 的第二个片段是一个路由参数，将被替换为每个库存的 ID。它将由 `route()` 函数生成，我们只需将 ID 作为第二个参数传递给\
    \ `route()` 函数。你可以有多个路由参数，在这种情况下，按它们出现的顺序将参数作为数组传递给 `route()` 函数的第二个参数。\n\n此外，Laravel\
    \ 还帮助实现了一种称为**路由模型绑定**的功能。当我们向路由注入 ID 时（如本例所示），Laravel 会根据 URL 中的类型提示解析 Eloquent\
    \ 模型，在我们的例子中是 `{inventory}`。简单来说，如果我们的 URL 是 `/inventories/1/drop`，Laravel 将在库存模型（`inventories`\
    \ 表）中查找 ID 为 1 的行并将其返回给控制器。\n\n```php\n// Route definition\n$route->delete('/inventories/{inventory}/drop','InventoryController@drop')->name('inventory.delete');\n\
    \n// Route usage\n{{ route('inventory.delete',$inventory->id) }}\n```\n\n---\n\
    \n### 控制器中的删除逻辑\n\n这里我们只需对要根据路由模型绑定注入的模型进行类型提示，并调用返回的模型对象上的 `delete()` 方法，这将删除\
    \ `inventories` 表中对应的行。\n\n最后我们重定向到包含所有库存的页面并显示通知消息。\n\n```php\npublic function\
    \ drop(Inventory $inventory)\n{\n    $inventory->delete();\n    return redirect()->route('inventory.all')\n\
    \        ->with('message','New inventory successfully added!');\n}\n```\n\n---\n\
    \n## 显示通知消息\n\n在编辑器中打开 `resources/views/view-inventories.blade.php`，在开始的 `<table>`\
    \ 标签上方放置下面的代码片段，以显示从控制器闪存到会话中的通知消息。\n\n```blade\n@if(session()->has('message'))\n\
    \    <div class=\"alert alert-info\">\n        {{session('message')}} New inventory\
    \ successfully added!\n    </div>\n@endif\n```\n\n---\n\n## 测试功能\n\n在浏览器中刷新应用，如果已登出则重新登录，点击“新建库存”菜单然后提交空表单。你应该会被重定向回带有输入字段下错误提示的页面。\n\
    \n![表单验证错误](img/image00201.jpeg)\n\n现在填写表单并点击“创建新库存”按钮。你应该会被重定向到列出库存的页面并显示成功通知消息。\n\
    \n![创建成功提示](img/image00202.jpeg)\n\n继续创建任意数量的库存并删除一些。你应该会对我们取得的进展印象深刻。在继续“回收站”功能之前，让我们快速更新仪表盘以反映实际创建的库存数量。\n\
    \n## 更新 AppController\n\n更新 `AppController` 类以匹配下面的代码：\n\n```php\n<?php\n\nnamespace\
    \ App\\Http\\Controllers;\n\nuse App\\Inventory;\nuse Illuminate\\Http\\Request;\n\
    \nclass AppController extends Controller\n{\n    public function dashboard(Inventory\
    \ $inventory)\n    {\n        $count = $inventory->count();\n        return view('dashboard',compact('count'));\n\
    \    }\n}\n```\n\n---\n\n以及 `dashboard.blade.php` 文件的第 11 行。\n"
