    ```\n\n现在点击侧边栏上的 Trash 菜单以查看回收站中的项目，尝试永久删除或恢复项目，看看此功能如何工作。\n\n# Edit Inventory\n\
    \n编辑库存就像创建它一样简单。首先，我们需要创建一个用于编辑表单的 GET 路由（采用路由模型绑定实现），以及一个用于表单提交的 POST 路由。我们仍将使用\
    \ `StoreInventory` 请求验证类，因为适用相同的验证规则；当然，如果你想尝试添加新的验证规则，也可以创建一个新类。\n\n我们将 `new-inventory.blade.php`\
    \ 页面的内容复制到 `app/resources/edit-inventory.blade.php` 文件中，然后进行一些调整。让我们快速完成吧！\n\n\
    ```php\n$route->get('/inventories/{inventory}/edit', 'InventoryController@editInventory')->name('inventory.edit');\n\
    $route->put('/inventories/{inventory}/edit', 'InventoryController@updateInventory')->name('inventory.update');\n\
    ```\n\n打开 `view-inventories.blade.php` 第 31 行，更新编辑操作的 href：\n\n```blade\n<a href=\"\
    {{ route('inventory.edit', $inventory->id) }}\" class=\"btn btn-outline-primary\
    \ btn-sm\">Edit</a>\n```\n\n将这些方法添加到你的 `InventoryController` 中，用于编辑和更新操作。\n\n\
    ```php\npublic function editInventory(Inventory $inventory)\n{\n    return view('edit-inventory',\
    \ compact('inventory'));\n}\n\n/**\n * @param StoreInventory $storeInventory\n\
    \ * @param Inventory $inventory\n * @return \\Illuminate\\Http\\RedirectResponse\n\
    \ */\npublic function updateInventory(StoreInventory $storeInventory, Inventory\
    \ $inventory)\n{\n    $inventory->update($storeInventory->only('item', 'quantity'));\n\
    \    return redirect()->route('inventory.all')->with('message', 'Inventory successfully\
    \ updated!');\n}\n```\n\n最后编辑你的 `edit-inventory.blade.php` 以匹配下方内容。\n\n```blade\n\
