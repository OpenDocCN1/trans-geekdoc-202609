    \                    @endif\n                </div>\n                <button type=\"\
    submit\" class=\"btn btn-primary\">Update Inventory</button>\n            </form>\n\
    \        </div>\n    </div>\n@endsection\n```\n"
  trans: "\n# 构建回收站功能\n\n如果你在首选的数据库管理器（如 phpMyAdmin、MySQL Workbench 或 SqlePro）中打开数据库，你会注意到从前端删除的库存实际上仍然存在，只是\
    \ `deleted_at` 列不为 null。这是我们之前讨论的 Laravel 软删除的功能。\n\n让我们创建一个页面来列出所有已删除的库存，并提供恢复它们的操作。听起来很酷对吧？我们可以使用列表库存页面相同的内容，只需稍微编辑操作按钮：一个用于恢复，另一个用于永久删除。但首先，让我们添加额外的路由和控制器方法。\n\
    \n在删除路由后添加以下内容：\n\n```php\n$route->get('/inventories/{inventory}/restore', 'InventoryController@restoreItem')->name('inventory.restore');\n\
    $route->delete('/inventories/{inventory}/purge', 'InventoryController@purgeItem')->name('inventory.purge');\n\
    $route->get('/inventories/trash', 'InventoryController@viewTrash')->name('inventory.trash');\n\
    ```\n\n接下来，将这些路由的方法添加到 `InventoryController` 中。\n\n```php\npublic function viewTrash(Inventory\
    \ $inventory)\n{\n    $inventories = $inventory->onlyTrashed()->get();\n    return\
    \ view('trash', compact('inventories'));\n}\n\npublic function restoreItem($inventory)\n\
    {\n    if ($item = $this->inventory->withTrashed()->find($inventory)) {\n    \
    \    $item->restore();\n    }\n    return redirect()->route('inventory.all')->with('message',\
    \ 'Inventory successfully restored!');\n}\n\npublic function purgeItem($inventory)\n\
    {\n    if ($item = $this->inventory->withTrashed()->find($inventory)) {\n    \
    \    $item->forceDelete();\n    }\n    return redirect()->route('inventory.all')->with('message',\
    \ 'Inventory permanently deleted!');\n}\n```\n\n在恢复和永久删除项目的情况下，我们无法进行路由模型绑定，因为\
    \ Laravel 认为此模型已从数据库中删除，因此它将始终返回未找到异常。换句话说，我们只需捕获包含库存 ID 的片段，然后使用 `withTrashed()`\
    \ 方法强制软删除的模型出现在结果中。\n\n在 `resources/views` 目录下创建一个新文件 `trash.blade.php`，并粘贴以下代码。\n\
    \n```blade\n@extends('layout.master')\n\n@section('page-title')\n    Trash\n@endsection\n\
    \n@section('content')\n    <div class=\"container-fluid\">\n        <div class=\"\
    col-12 col-md-8 mt-4\">\n            @if(session()->has('message'))\n        \
    \        <div class=\"alert alert-info\">\n                    {{ session('message')\
    \ }}\n                </div>\n            @endif\n            <table class=\"\
    table table-hover table-bordered\">\n                <thead>\n               \
    \     <tr>\n                        <th scope=\"col\">#</th>\n               \
    \         <th scope=\"col\">Item</th>\n                        <th scope=\"col\"\
    >Quantity</th>\n                        <th scope=\"col\">Actions</th>\n     \
    \               </tr>\n                </thead>\n                <tbody>\n   \
    \                 @foreach($inventories as $key => $inventory)\n             \
    \           <tr>\n                            <th scope=\"row\">{{ $key + 1 }}</th>\n\
    \                            <td>{{ $inventory->item }}</td>\n               \
    \             <td>{{ $inventory->quantity }}</td>\n                          \
    \  <td>\n                                <a href=\"{{ route('inventory.restore',\
    \ $inventory->id) }}\" class=\"btn btn-outline-primary btn-sm\">Restore</a>\n\
    \                                <a href=\"#\" class=\"btn btn-outline-danger\
    \ btn-sm\" onclick='event.preventDefault(); document.getElementById(\"delete-inventory-form-{{$key}}\"\
    ).submit();'>\n                                    Purge\n                   \
    \                 <form id=\"delete-inventory-form-{{$key}}\" action=\"{{ route('inventory.purge',\
    \ $inventory->id) }}\" method=\"POST\" style=\"display: none;\">\n           \
    \                             {{ csrf_field() }}\n                           \
    \             {{ method_field('DELETE') }}\n                                 \
    \   </form>\n                                </a>\n                          \
    \  </td>\n                        </tr>\n                    @endforeach\n   \
    \             </tbody>\n            </table>\n        </div>\n    </div>\n@endsection\n\
    ```\n\n现在点击侧边栏上的 Trash 菜单以查看回收站中的项目，尝试永久删除或恢复项目，看看此功能如何工作。\n\n# 编辑库存\n\n编辑库存就像创建它一样简单。首先，我们需要创建一个用于编辑表单的\
