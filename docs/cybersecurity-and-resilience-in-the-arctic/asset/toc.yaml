  - 3. 海底电缆干扰作为一个国际法问题
- - '#'
  - 《联合国海洋公约》（UNCLOS）第15条强调了旗许可国在可能导致电缆损坏的特定活动中的权利；旗许可国确保电缆所有者对防止电缆损坏的损失提供补偿。例如，上述船长没有切断电缆而是弃船或为了防止电缆受损而承担风险，那么铺设电缆的旗许可国就有义务对遭受的损害进行补偿。考虑到电缆重大的意义，对于那些牺牲部分船舶来防止电缆损坏、且不利船舶和船员健康，这可能提供一种额外的安全。然而，对于铺缆船旗许可国，如果所有者的国籍与铺缆船旗许可国不同，且在该国没有资产，可能会导致额外的行政负担，反过来增强海事业在这些案例中的重要性。《海洋法公约》第15条规定的义务可以追溯到《公海公约》第29条以及7条。
