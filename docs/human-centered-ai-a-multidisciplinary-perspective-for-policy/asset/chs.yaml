  \ Approach. Human Rights Quarterly, *34*, 546–569.\n\n## 3 重新定义以人为中心的人工智能 *人工智能推荐引擎的人类影响*\n\
  \nOshri Bar-Gil\n\nBehavioral Science Research Institute, Israel\n\nDOI: [10.1201/9781003320791-5](https://dx.doi.org/10.1201/9781003320791-5)\n\
  \n### 引言\n\n近年来，信息流不断增长，我们在日常决策中不断被源源不断的信息轰炸。正如数字文化倡导者 Kevin Kelly 在其著作 *The Inevitable*（2016）中所说，这个星球上增长最快的数量是我们所产生的信息量。这些信息不仅存在于科技公司的服务器上，也在各个方向包围着我们。无论是新闻、社交媒体信息流，还是会议的议程和时间安排，都有太多信息淹没我们并要求我们的关注（Andrejevic,\
  \ 2013）。\n\nEvans et al. (2017, p. 36) 将可供性定义为对象/技术与用户之间用于行动的可能性，它能够在特定情境下使潜在的行为结果得以实现或受限。某些社会技术可供性，尤其是机器学习（`ML`）算法和大数据分析，承诺能够增强我们对信息的使用，并在信息处理和决策中“帮助”我们，使生活“更快”、更少压力且“无摩擦”（Rosa,\
  \ 2013; Virilio, 2005）。通常，这些可供性被组织在平台提供的服务中，这些服务运用 `ML` 算法应用于用户由平台本身精心策划和保存的数字数据分身。平台利用它来推荐，并可能影响用户的未来行动，通过直接或间接匹配广告来更好地对用户进行画像（Zuboff,\
  \ 2018）。这些推荐可能涉及最适合我们搜索的信息、我们想阅读的下一条新闻，以及音乐、商业等其他领域（Karakayali et al., 2018）。\n\n\
  本章基于一个大型研究项目，该项目利用 Google 产品和服务的用户评论，对利用平台化服务所导致的自我和自我概念的变化进行现象学探究（Bar-Gil, 2021）。研究中选定的平台是\
  \ Google 及其众多个性化基于人工智能的服务，这些服务作为推荐引擎，在过去十年中已成为我们的个人思维助手。\n\n\n\n\n\n当前创建个性化 AI 推荐引擎服务的努力，使用我们在各种服务中积累的个人数据作为我们的数据分身，以及我们信息处理和决策的原型。这些增强的自我服务可以被视为我们应对信息过载的当代超能力——讨论、思考、行动和决策的伙伴。\n\
  \n我们允许搜索引擎记住通往在线内容的链接和路径、单词的正确拼写，以及我们不敢向任何人询问的查询（Stephens-Davidowitz, 2017）。然而，Google\
  \ 不仅仅是一个搜索引擎；其基于 AI 的服务中包括一封电子邮件服务，该服务推荐自动但个性化的回复并过滤邮件信息流，以便引导我们的注意力和决策（Bullock,\
  \ 2017）。Google 的推荐引擎还建议 YouTube 上的下一个视频（Airoldi et al., 2016），筛选“可能很适合我们”的餐厅（Duong,\
  \ 2017），确定符合我们兴趣的新闻（Nayak, 2020），等等。我们使用 Google 地图推荐当前最佳路线（Wang, 2021），并且其与 Google\
  \ 日历的集成推荐出发时间，考虑交通拥堵，并在我们经过购物中心时提醒我们的购物清单（Umapathy, 2015）。\n\n平均而言，Google 用户每天与\
  \ Google 服务器通信超过 100,000 次（Hill, 2019）。\n\n虽然 Google 作为一家公司（Alphabet）和作为一项服务所产生的社会影响一直是众多书籍和研究的主题，但它如何影响我们——其服务的个人人类用户这一问题尚未得到充分探讨。如果我们希望打造一种以人为中心的人工智能（HCAI），它不仅能完成我们的任务，还能帮助我们蓬勃发展并实现更深层次的人类目标，那么这是一个关键问题。在本章中，我们将深入探讨这一主题，探索在平台化应用中使用\
  \ Google 推荐引擎对人类的影響，作为理解人工智能如何在信息时代的超技术世界中影响我们生活的基礎。\n\n本章将首先描述当代信息环境，然后描述适应这一环境的各种技术努力，其中包括使用外部“认知技术”如推荐引擎，并详细说明其对用户的潜在影响。通过将推荐引擎用户形象添加到经典的扩展认知思想实验中并探索其对行为、认知和决策的潜在影响，将解释和说明这些认知技术的潜在影响。从那里，本章将阐述意图、理性以及记忆模式的可能变化，以形成关于如何使人工智能更以人为中心的讨论，考虑到其对我们作为人类的影响。\n\
  \n### 新机遇\n\n今天的科技饱和环境被赋予了各种名称，例如第四次工业革命（Schwab, 2017）、第二次机器时代（Brynjolfsson & McAfee,\
  \ 2016）或晚期信息时代（Fuchs, 2008）。它们都指向信息传输的广泛增加，具有高速通信网络、增加的存储能力以及具有强大计算能力的先进算法（McAfee\
  \ & Brynjolfsson, 2017）。这些可供性为数字服务用户提供了新的机会，但也带来了更频繁、更迅速地做出决策的压力。据德国哲学家 Hartmut\
  \ Rosa (2013) 称，随着技术发展速度的加快，人类进入了加速循环。技术加速导致生活方式加快，这需要新的技术来应对这种加速，等等。\n\n据法国哲学家\
  \ Bernard Stiegler (1998) 称，自历史开始以来，人类一直使用各种人工辅助工具，或义肢，来应对人类认知的固有局限。法国现象学家 Maurice\
  \ Merleau-Ponty (1945/2002) 提出，外部扩展有时可以在物理或感知层面实现。例如，盲人的拐杖就展示了拐杖这一技术对象如何作为他身体感觉器官的延伸，为盲人提供额外的感官。认知科学领域的其他研究人员建议将各种技术辅助视为自我在实际身体之外的延伸（Menary,\
  \ 2010）。继他们之后，美国技术哲学家 Don Ihde (2009) 提出，像盲人的拐杖一样，技术不仅让我们对环境产生不同的感官感知，而且还改变了我们对世界的感知，包括我们如何思考自己。他经常使用的例子是显微镜。显微镜除了让我们看到微小颗粒外，还让我们意识到我们是由这些颗粒、细胞、细菌等组成的。继这些思想家和其他人之后，我们可以看到人工智能作为一种技术，可能用于增强我们的认知，但也改变我们对自己和世界的感知。\n\
  \n目前，HCAI 这一概念主要用于指实现人类和基本权利（Sigfrids et al., 2023）。然而，上述潜在影响要求扩大当前对 HCAI 是什么的定义。例如，Shneiderman\
  \ (2022) 将其定义为使用人工智能“服务于人类集体的需求”，通过理解“人类语言、情感、意图和行为”。其他人，如 Wang et al. (2021, p.\
  \ 1) 将其定义为设计和实施“人工智能技术以支持各种人类任务，同时考虑人类需求并保留人类控制。”\n\n#### AI 作为扩展认知辅助\n\n\n\n\n\n\
  意识哲学家安迪·克拉克和大卫·查默斯（1998）提出了“扩展心智”假说。他们认为我们不能简单地以皮肤和颅骨的边界作为我们心智或自我的界限。他们提出了一个思想实验，旨在检验个体的认知如何被扩展，以评估其想法的有效性。让我们想象两个角色，奥托和英加，他们都想去博物馆。英加可以通过查看地图并记住路线找到方向。奥托患有阿尔茨海默病，因此必须在纸上写下方向，然后按照指示到达目的地。这个思想实验以圆满结局结束，两位角色都到达了博物馆。分析他们的思维过程可以发现，英加仅依靠她的“生物”认知来记住计划路线并做出关于走哪条路的判断和决定。相比之下，奥托的认知是“扩展”的。他前往博物馆的旅程涉及使用外部“记忆技术”，即一张纸，来帮助他在沿途的转弯处进行审慎和决策。克拉克和查默斯认为，奥托使用铅笔和纸张来替代其生物记忆证明了人类能够借助外部技术进行思考。按照他们的发现，两种结果背后的认知决策过程是相同的，即使参与该过程的心智组成部分不同，甚至是外部的。为本章的核心主题服务，即理解使用推荐引擎对我们人类的影响，让我们在这个思想实验中加入娜迪亚这个角色。娜迪亚依靠\
  \ Google Maps 应用程序前往博物馆。当娜迪亚在应用中输入博物馆名称时，它会显示机构的位置，提供多条路线，并提示她选择其中一条，也许还会微妙地建议最佳路线。然后它会利用她手机的\
  \ GPS 引导她前进，在需要时进行路径修正，甚至预判潜在的“更好”路线。\n\n奥托使用记忆扩展与娜迪亚基于 Google Maps 的决策之间有什么区别？首先，奥托和英加在导航和定向时必须投入不同程度的专注注意力和有意的认知努力。看起来娜迪亚在注意力和意图方面任务更轻松。很容易想象她边走边逛，心思集中在寻找方向或定向以外的事物上——也许甚至在浏览社交媒体。随着谷歌对何时何地转弯的推荐中介她的旅程，她可能会失去一部分能动性或自主性。\n\
  \n自主性最显著的丧失可以用意图、理性和记忆的变化来解释。英加对所有决定都进行了审慎思考，首先是去博物馆，然后是随后的每个决定（是否绕路、向右转、直行）。奥托对自己事先设定的到达博物馆的意图感到满意，他提前选择并写下了路线，并在整个过程中坚持执行。另一方面，娜迪亚必须将应用程序与她事先想要参观博物馆的意图“同步”，但在此之后，她可以将导航决策或行动意图委托给应用程序并遵循其指示——走建议的路线并在适当时刻转弯。此外，如果娜迪亚是该应用程序的高级用户，它可能会通知她由于道路交通或博物馆排队时间比平时更长而需要提前出发。甚至有可能当娜迪亚建立了参观特定博物馆的先前意图时，谷歌向她展示了替代博物馆，甚至建议她修改意图，因为其他博物馆评分更高或更符合她的既往兴趣。这进一步削弱了她的有意决策。\n\
  \n另一个区别可能是对娜迪亚行为所赋予的理性程度。根据 Google Maps 的算法，为她确定的路径在她先前的经验和偏好方面是最准确的——节省距离、步行时间，甚至避免爬楼梯。这些基于算法规划的优化决策，结合了接近实时的情境感知，可能被当前社会标准视为更“理性”\
  \ (Fisher, 2020)，也许也被娜迪亚自己视为如此。\n\n我们暂时要考虑的最后一个区别是关于记忆——英加只使用她的生物记忆；奥托利用一张纸作为外部记忆。娜迪亚则依靠另一种类型的外部记忆，即\
  \ Google Maps 的空间“记忆”来确定她应该走哪条路线和路径。她选择的步行路径由谷歌实时进行了广泛检查，使用她手机上的 GPS，精度小于一米 (Milner,\
  \ 2016)。它被添加到谷歌档案中她的个人数字数据中，以及所有在此区域行走的人的路线选择中。娜迪亚将积极为谷歌用户贡献共享的、连接的记忆，正是这种记忆将引导他人的行动，就像它引导她一样。\n\
  \n这个思想实验中的例子展示了空间推荐引擎如何通过允许用户将其决策过程的部分委托出去而影响其用户。然而，这些变化不仅发生在空间领域，还发生在各种判断和决策中，这些判断和决策以类似的方式使用平台化的推荐引擎。为了向用户提供这些个性化服务，谷歌和其他技术平台创建了关于用户的“数据自我”，该数据自我旨在通过大量数据在平台上代表用户\
  \ (Van Dijck et al., 2018; Zuboff, 2018)。例如，我在谷歌服务中的个人数据文件包含超过 100 GB 的数据。\n\n这在将更多信息相关判断、决策和互动任务委托出去时产生了滚雪球效应。对技术的依赖增加以及基于自我表征数据的服务平台的发展不仅改变了我们获取知识的方式，也改变了我们在日常生活中评估知识、选择选项和处理知识的方式。一个人能够在现实世界或虚拟世界中行动的能力越来越多地被此类服务中介，几乎被控制。想想选择路线的决定有多少是你的，多少是算法的。如果没有谷歌服务，执行诸如查找信息、出行等各种任务会困难得多！经常有人迟到会把延迟归咎于“导航应用告诉他他会准时”，\n\
  \n### 意图\n\n\n\n\n\n简化关于自主性的哲学争论，可以将其视为个体自我决定或自我治理的能力（Pham et al., 2021）。从这一观点来看，主体性是指我们能够为自己选择什么是对错，而不受他人不当影响的能力。意图指的是行动背后的目的或目标。在此语境中，意图可被视为与主体性和自主性密切相关，因为它反映了个体做出选择并付诸行动的能力（Smith,\
  \ 2017）。上文提到的 Ihde (2009)认为，技术不仅仅帮助我们实现计划或改变我们做事的方式。它还影响这些计划形成过程本身——我们的意图。因此，正如思想实验所示，它削弱了使用者自主性和主体性。另一个例子可能是当用户开始搜索某个概念的信息时，却被谷歌搜索引擎的自动完成功能中途导向了不同的概念。\n\
  \n哲学家 John Searle (1983, p. 1)将意图定义为“某些心理状态和事件的特征，其在于它们指向、属于或代表某些其他实体和情境。”继其之后，Bratman\
  \ (1987)将意图聚焦为自我调节其互动和长期活动的手段。根据这些定义，我们可以看到，使用推荐引擎可能会改变我们的意图和心理状态，以及我们的自我调节。\n\n\
  至少，我们可以看到从意图在行动中——做、决定或思考某事——到使用为我们完成这一切的引擎的意图性行动的特定心理状态的委托。\n\n这使得这些服务对我们非常有用——我们甚至不必明确告诉它我们的意图是什么；它会提出“自己的”想法来满足它所理解的我们的愿望，成为“中介主体”，从而削弱了人类主体性（Pickering,\
  \ 2010）。\n\n### Rationality Engines\n\n我们倾向于遗忘、缺乏意识、处理速度受限、注意力不足以及规划能力薄弱，这些都是人类认知的特征。Herbert\
  \ Simon (1971)创造了“有限理性”一词，指的就是这些限制导致我们在解决问题和做决策时使用心理捷径，而非彻底的计算和准备。它指的是思维过程本身，我们试图尽可能少地使用心理资源，以及决策过程，该过程可能以计算、优化和准确的方式获得，也可能不是——从而反映了人类理性的局限性。\n\
  \n与人类有限理性相反，使用推荐引擎，例如 Nadia 用来选择去博物馆路线的谷歌导航服务，能够实现最优且精确的时间安排，精确到出发分钟级别。路线是在分析各种数据和偏好、创建替代方案并在清晰且可重复的算法逻辑下选择最合适的方案时计算出来的，该逻辑分析了大量数字信息以推荐决策（Doneson,\
  \ 2019）。\n\n从社会角度来看，随着算法推荐在我们日常生活中变得更加普遍，人们会认为它们更理性、更高效（Fisher, 2020）。人类用户无法比谷歌以更合理或更逻辑的方式做到这一点，但他们可以通过为平台的推荐引擎提供更多数据并将自主权委托给信息来更好地支持算法决策过程。所有这一切都是希望它能做出与他们相似的决策，考虑到所有已被提供并由复杂算法分析的历史数据，这些数据被认为更理性。使用这些产品也会影响用户如何看待自身的理性程度（Bar-Gil,\
  \ 2020）。用户认为使用推荐引擎使他们更理性、高效和精明。他们还认为这使他们能够“用更少做更多”，通过为决策节省认知资源，甚至利用有效算法来实现他们的意图。这在管理一种永远供不应求的资源时尤为明显：时间。例如，考虑谷歌日历服务如何自动协调会议（Asara,\
  \ 2016），旅行计划，甚至个人目标的实现，正如谷歌新目标驱动重新安排功能发布时所建议的：\n\n> 无论是阅读更多书籍、学习新语言，还是定期锻炼，实现目标都可能非常困难……因此，从今天开始，我们在\
  \ Google 日历中推出目标。只需添加一个个人目标——比如“每周跑步 3 次”——日历就会帮助你找到时间并坚持下去。\n\n> (Ramnath, 2016)\n\
  \n然而，这不仅仅是能够在不“浪费”时间进行计划和组织的情况下协调一切；谷歌日历甚至鼓励其用户更积极地完成任务，利用行为助推和提醒来引导注意力和决策以实现先前的意图，这就引出了问题：谁的议程为谁设定？算法的理性与效率对我们人类来说是好事吗？或者，也许，为了尊重我们的有限理性并允许人类自主，我们的\
  \ HCAI 系统需要做一些不同的事情？\n\n### Remembering in the Cloud\n\n\n\n\n\n随着意图和理性发生变化，我们也可以观察到记忆模式的变化。数字和云平台所实现的复杂、对话式和灵活的沟通模式的出现，以及个体-群体-社会关系先前配置的瓦解，要求我们以新的方式思考个体和社会记忆模式。记忆研究者\
  \ Andrew Hoskins (2017)称之为“连接性记忆”——通过各种数字应用、平台和网络，在实时中与他人增加连接和纠缠而产生的记忆模式。谷歌和其他平台提供的云端扩展记忆使用户不仅能够为共享集体记忆的形成做出贡献，还能为自身个体利益处理这些记忆内容（Ward\
  \ & Wegner, 2013）。考虑我们对扩展心智思想实验的版本——当导航应用的用户参考他们已行驶的路段时，他们对该路段的“记忆”被转化为特定地理位置的共享、连接记忆，这会影响他们以及尚未“体验”过该旅行路段的其他人如何选择移动。我们在此示例中强调的空间决策只是谷歌整个决策服务生态系统的一小部分，其中还包含视觉选择（Google\
  \ Photos）、语言选择（搜索引擎、Google Books 等）和视频选择（YouTube）。尽管谷歌的全球记忆是多样、分散且丰富的，但它也可以被检索、搜索、过滤、检查和算法处理。这些可供性为用户提供了自行处理信息或让谷歌服务或其他推荐引擎代为处理的选项。为了高效使用，我们将更大部分的记忆保存在云平台上，放手这些记忆以换取更多信息处理和决策，直到它们深深植根于我们记忆和思考的方式中（Sparrow\
  \ et al., 2011）。\n\n### 结论：推荐引擎对我们的影响——如何使推荐引擎以人为中心？\n\n虽然技术进步带来了令人兴奋的新机遇，但它也造成了难以应对的数据洪流。为了让我们的生活更轻松，并以更少的脑力和时间实现日常目标，我们转向技术来帮助我们思考。我们将一些认知过程和努力委托给那些组织在平台中的认知技术（Clowes,\
  \ 2015）。随着技术平台生态系统的增长并提供更多功能，我们将越来越多的认知过程委托出去，以帮助我们应对信息过载和日常变化。此过程的潜在益处众多，包括增加休闲时间、提高预见和组织能力、增强定向和导航技能、将我们最私密问题的答案置于指尖等。但这些是有代价的。它们改变了我们的思维过程，改变了我们在数字领域和现实世界中意图、理性、记忆等核心人类特质，削弱了我们的能动性和自主性。\n\
  \n#### 下一个前沿——将自己委托给生成式 AI 服务\n\n在撰写本章时，一项新技术出现了——用于文本（聊天）、图像、声音和视频的生成式 AI 模型，可以代表最初提示它们的人类用户创建内容（Browne,\
  \ 2022）。\n\n似乎将这些与我们的数据分身结合起来，可以创建一个强大的个人助理，在各种内容创作任务中非常有帮助，并为我们节省大量时间和“摩擦”。如果我们遵循本章的论点，它有可能升级所描述的委托过程，操纵我们的意图，并削弱人类在曾经被视为“创造性”的任务中的能动性和自主性。\n\
  \n#### 我们能否将这些影响视为以人为中心的 AI？\n\n推荐引擎的生态系统赋予用户在历史上任何其他时期都会被视为超能力的力量，一种实现人类（或至少是其数据分身）与机器融合的想法。然而，是否具有挑战性将这种赋权和扩展视为使我们“超人”，正如超人类主义者所声称的那样？借用尼采的说法，他是他们最喜欢的哲学家之一（Sorgner,\
  \ 2009），它是否真正以一种我们可以说 AI 是以人为中心的方式改善了人类体验？似乎基于 AI 的推荐引擎强调了尼采思想中的其他方面，例如“最后的人”（Nietzsche,\
  \ 1883/2006），特别是那些涉及更普遍的人类品质如懒惰、舒适欲望和低努力的部分。\n\nHCAI 不能被视为一种技术设计。它必须包括伦理、心理、社会、政治和法律方面，以分析其对个人和社会的深远影响。从这些领域挑战\
  \ HCAI 的概念是必要的，以便继续利用人工智能的奇妙力量，同时增强我们的人性部分，或至少最大程度地减少对其最关键的人性方面的潜在伤害，例如我们成为自主主体、有意识、发展并对自己和自己的行为负责的能力。如何培养这种思考？这将在本书的后续章节中更详细地介绍。\n\
