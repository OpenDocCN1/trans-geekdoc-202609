  \n## 18 Christina Colclough’s Commentary\n\nChristina Colclough\n\nThe Why Not Lab\n\
  \nDOI: [10.1201/9781003320791-21](https://dx.doi.org/10.1201/9781003320791-21)\n\
  \n**Please tell us more about your work**.\n\nMy main occupation is capacity building,\
  \ that is to say, I give workshops and courses for unions and governments around\
  \ the world. It can be courses for trade union leaders, negotiators, or organizers,\
  \ or it can be for wider audiences, but each course is tailor-made to the specific\
  \ organization I am working with.\n\nThese courses and workshops cover a significant\
  \ amount of content. We explain what digital technologies are, what data is, what\
  \ AI is, and so on and so forth. We also discuss how these new technologies affect\
  \ the world of work. And we give actionable examples. For instance, we explain that\
  \ in certain cases, it is possible to deduce what kind of instructions were given\
  \ to the algorithm that runs behind an automated hiring tool. In addition to that,\
  \ I sit on various boards around the world advising on issues related to the labor\
  \ market. I am also part of a team that develops tech for good, that is, technologies\
  \ that try to avoid the pitfalls of current digital technologies and, instead, empower\
  \ workers. Lastly, I do a fair amount of public speaking.\n\n**How do you define\
  \ human-centered AI, and why do you think it’s important, especially for workers,\
  \ which is your main preoccupation?**\n\nI have mixed feelings about that expression.\
  \ Ensuring that digital technologies benefit those they are intended to serve is\
  \ very important to me. But the concept of “human centeredness” is quite broad.\
  \ Not specifying what people we are recentering AI around or why we are recentering\
  \ AI around those people could lead to undesirable effects. We must not forget that\
  \ what is good for one group of humans could be absolutely horrible for another.\
  \ Moreover, human-centered AI could be used as a concept to perpetuate the status\
  \ quo. “Capitalist-human-centered AI,” so to speak, would be human-centric, but\
  \ it would not be AI for the benefit of all.\n\nBoth of the papers I have read—and\
  \ we will talk about them specifically in a minute—seem to suggest that “human-centered”\
  \ means that no AI systems should be brought into the world without consideration\
  \ for the people who will be affected by them. But as a standalone concept, I am\
  \ not sure human-centered AI will be able to achieve that.\n\nNevertheless, I do\
  \ believe that we should not introduce technology for the sake of technology and\
  \ that we should always consider the consequences of a given technology on those\
  \ it is going to affect. That way we can ensure that technology benefits those it\
  \ is intended to serve. That is a large part of what I do with my work on the governance\
  \ of digital technology.\n\n**Could you give me examples of how, in your opinion,\
  \ human-centered AI was implemented in some contexts and not implemented in others?**\n\
  \nWe are still at the beginning of this journey. But one example that comes to mind\
  \ when I think about human-centered AI is the Digital Bargaining Hub, a tool I have\
  \ developed with Public Services International, the global union for public-service\
  \ workers, and Professor Hannah Johnston at York University. The Hub is an online\
  \ database of collective bargaining clauses related to the digitalization of work.\n\
  \nOne thing the database shows is that workers are starting to negotiate around\
  \ data and the introduction of digital technologies in the workplace. I am glad\
  \ to see this is happening. It is a way for the Union movement to ensure that the\
  \ introduction of AI technologies does not come at the expense of providing decent\
  \ working conditions to workers.\n\nBut there are also gaps, especially with respect\
  \ to certain uses that are made of AI. For instance, AI not only has immediate impacts,\
  \ as in, your productivity goes down, your employer fires you; it could also have\
  \ long-term repercussions. For example, if an AI system determines that a worker’s\
  \ productivity is declining and that that worker is a 52-year-old woman with a BMI\
  \ of 30, and a long tenure in the company, the system might infer that this is a\
  \ generalizable “fact” against which future applicants with similar profiles will\
  \ be measured. This kind of future projection is an issue that unions are not grappling\
  \ with at the moment. If unions do not understand algorithmic inferences, of course,\
  \ they will not be able to put adequate guardrails in place. To prevent that, we\
  \ are aiming at helping unions by writing model clauses they should include in collective\
  \ bargaining agreements.\n\nThis is a good segue to a very important point that\
  \ was mentioned in Lévesque et al.’s article, and which I want to emphasize: it\
  \ takes two to tango. For meaningful negotiations to take place, both parties must\
  \ “know what they need to know.” And what the unions have found—especially those\
  \ that I have done a lot of in-depth training with—is that when they go to management\
  \ and ask for guardrails around the use of algorithmic inferences or the right to\
  \ opt out of the selling of data, they are met with a certain kind of bewilderment.\
  \ We tend to assume—and this goes for all of the literature on impact assessment\
  \ and audits—that management understands AI and other technologies rather well.\
  \ But it is not necessarily the case. In fact, one of the biggest mistakes many\
  \ people make is assuming that managers really understand the technologies they\
  \ are adopting or using.\n\n**You read two articles from the book: “Crafting human-centered\
  \ AI in workspaces for better work,” by Lévesque and his colleagues, and “Human-centered\
  \ AI for industry 5.0,” by Passalacqua and his colleagues. Could you tell me a bit\
  \ more about these papers and how they changed your point of view, the way you see\
  \ things?**\n\nReading these papers confirmed several things that I think all politicians\
  \ need to be reminded of. First of all, the framework presented in “Crafting human-centered\
  \ AI” is very interesting. I like that it proposes a way to measure the various\
  \ dimensions of the quality of work—or “better work,” as the authors call it. I\
  \ think that framework would be very helpful for politicians, as I mentioned, but\
  \ also for unions. However, the authors could have taken their argument about inclusive\
  \ governance a bit further. The framework works well to measure how AI systems can\
  \ impact good work “here-and-now,” but I would have liked to read more about how\
  \ they think it ties into inclusive governance.\n\n\n\n\n\n这又引出了我对这篇论文的另一个局限性。它对当下的影响描述得相当好，但并没有真正讨论人工智能的长期后果，尽管正如我前面提到的，在我看来，它们是工作数字化最危险、最具威胁性的方面之一。再举一个例子，自动化排班工具。它在短期内可能有利于工人，因为他们更改班次或申请更符合自身需求的排班会变得更容易。然而，这些系统正在收集大量数据，如果这些数据被用来推断员工的新信息，就可能产生长期的负面后果。例如，系统可能会得出结论：客户更喜欢说英式口音英语的员工。这种推断随后可能成为一种“可推广的事实”，最终会惩罚口音外来的工人——他们可能被解雇或被安排最差的班次。鉴于这些未来危害的严重程度，论文中讨论它们本会很有意思。\n\
  \n我读的第二篇文章《面向工业 5.0 的以人为本的人工智能》内容相当密集，跟踪其中呈现的各种模型也很复杂。但这一章证实了协同部署和协同设计确实会带来回报。而且它清楚地表明，组织不应简单地将技术强加给工人。相反，他们应该真正让工人参与技术项目。\n\
  \n话虽如此，我认为文章中缺少了一些重要内容。作者得出结论认为人工智能将改变所需的任务、岗位和技能，但他们没有提到谁应该负责对工人进行再培训和提升技能。例如，引入颠覆性技术的雇主是否应有义务持续培训受影响的工人，帮助他们在职业生涯中继续前行？目前的情况大多像是各行其是：任何人都可以颠覆工作，而没有人对总体影响承担任何责任。鉴于\
  \ Passalacqua 及其同事讨论了如何在与受影响人群合作的情况下引入颠覆性技术，提出政策建议或反思当工作和工人受到人工智能影响时谁对什么负责本会很有意思。\n\
  \n* **说到这个，你会对政策制定者和用户提出哪些可能的建议？在谈论以人为本的人工智能及其在工作环境中的实施时，他们真的应该关注哪 2-3 件事？**\n\n\
  我的第一个建议与我们刚才讨论的内容直接相关。引入强大技术如人工智能的雇主应承担“颠覆义务”，即他们应被迫为受这些工具影响的工人提供终身学习和职业发展机会。\n\n\
  我的第二个建议是强制性的包容性治理。目前，各国政府倾向于采用市场准入方式来监管人工智能。这种类型的监管严重依赖认证和标准。欧盟-美国贸易与技术委员会、七国集团、二十国集团和欧洲委员会似乎都同意以经合组织人工智能原则作为起点，并试图就人工智能认证和标准应包含的内容达成一致。然而，他们都没有讨论包容性治理的严格要求。\n\
  \n这真的令人失望。首先，认证机构（ISO、IEEE 等）99% 由行业主导。其次，你如何认证一种本质上是流动且可变的物？在我看来，唯一能证明这样做合理的办法是建立关于包容性和透明治理机制的制定与实施的强有力要求。如果不这样做，你如何确保其他所有法律——反歧视法、工时法等——得到尊重？例如，考虑一个有偏见的自动化招聘系统的情形。一家公司发现其使用的系统歧视年轻女性。他们要求系统开发商修复这个问题。开发商回复说：“我们可以用\
  \ 89% 的准确率做到这一点。”这可以吗？那剩下的 11% 呢？应建立包容性治理机制来做出这类决定：工人应参与其中，用于纠正问题的流程应向当局透明，等等。毕竟，归根结底，歧视是非法的，必须予以打击。\n\
  \n我还有一个最后的、我认为很重要的评论要做。我读的两篇文章都正确地指出人工智能可以让我们摆脱例行任务。然而，没有一篇认识到我们将被解放的这些例行任务在我们的生活中可能发挥着有益的作用。几年前我在七国集团时遇到过一位意大利教授，他说了一句话给我留下了深刻印象：“我们可能都讨厌工作中包含的例行任务，但它们使我们能够暂停大脑。”如果我们将工作优化到那些大脑暂停消失的地步，这对倦怠和压力会产生什么影响？我认为这位学者提出了一个非常有见地的观点。我们花了很多时间谈论自动化例行任务的好处，但这真的会有益吗？想想我们现在正在经历的。数字技术的指数级增长几乎与倦怠和压力相关疾病的指数级增长同步进行。\n\
  \n所以我认为，当我们谈论组织的颠覆义务时，我们确实应该花时间反思在数字世界中应如何看待“好工作”。我们是否应该实行四天工作制？我们是否应该重新分配工作时间和任务？我们是否应享有断联权？就我个人而言，我会全部都说“是”。\n\
  \n* **这让我想到，撰写文章的参考文献或转录对话是例行工作，确实有助于我为电池充电**。\n\n对我来说，是做我的会计或差旅报销。这些是我可以放点好音乐来做，并只是获得所需暂停的任务。法国作曲家德彪西以“音乐是音符之间所产生的东西”而闻名。我们绝不应忘记“我们的”音乐是在停顿中产生的。\n\
  \n## 19 Joseph Nsengimana 的评论\n\nJoseph Nsengimana\n\nMastercard Foundation Center\
  \ for Innovative Teaching and Learning\n\nDOI: [`10.1201/9781003320791-22`](https://dx.doi.org/10.1201/9781003320791-22)\n\
  \n* **人工智能可用于培训年轻人并打击失业，但同时也可能使工作岗位消失。我想你对等式的两方面都感兴趣？**\n\n绝对如此。我认为人工智能有潜力带来很多好处并创造教育和经济机会，但前提是我们现在做出正确的投资。因此，在中心，我们正试图弄清楚人工智能将如何影响培训、教育和就业创造。一旦我们了解了影响会是什么，我们就会问自己：“我们需要做什么？如何最好地应对这些挑战？”\n\
  \n现在，技术影响就业市场并非前所未有。从自动化到工业化，每一次新革命，每一次新技术的引入，都会对工作产生影响。现在的不同之处在于发生的速度。变化发生得如此之快，以至于很难领先于转型。这就是挑战：“我们如何利用这场快速转型帮助年轻人获得就业？”\n\
  \n* **本书的重点确实是以人为本的人工智能——这是一个并不总是定义得很好的概念。你如何定义它？**\n\n\n\n\n\n### 以人为本的 AI\n\n\
  对我而言，以人为本的 AI 完全关乎我们赋予正在进行中的变革的方向。我们知道变革将会发生，但我们如何确保它以造福人类、以造福整个社会的方式发生？这就是我对以人为本的\
  \ AI 的看法：系统以其所寻求支持或帮助者的需求、文化和经验为依据；系统在设计和实施上是透明的、可问责的，并旨在确保积极的结果超过负面影响。\n\n####\
  \ 我们很少谈论非洲正在发生的 AI 情况。我想，有某种程度上是因为我们对此了解不多。你能告诉我一两项你认为 AI 以以人为本的方式被使用的项目吗？\n\n你说得对。信息缺乏是非洲大陆以人为本的\
  \ AI 的主要挑战之一。AI 依赖可用的信息，而不幸的是，在非洲，目前并没有太多可以用来构建真正以人为本的 AI 系统的信息。如果能在大陆上开展更多关于 AI\
  \ 的研究——并且在大陆上产生更多数据，那就太好了。\n\n但就你的观点而言，教育领域有一些有趣的非洲倡议。采用 Poellhuber 等人文章中使用的术语《高等教育中的人工智能：机遇、问题与挑战》，他们更侧重于构建自适应学习工具，而非最先进的\
  \ AI，但仍然相关。例如，我曾与南非一家名为 Siyavula Education 的公司合作。他们创建了一个自适应平台来教授数学、物理和化学。其运作方式是系统引导学生，记录学生的反应，然后根据学生的反应调整教学内容。因此，Siyavula\
  \ 的平台在其自适应性上具有 AI 的某些元素。这对我来说似乎是一种相当有益的 AI 应用。我们已经看到，例如，学生在数学成绩上取得了巨大改善。我认为随着技术的成熟，我们会看到更多此类技术的应用，其影响也将更加有意义。\n\
  \n#### 你刚才提到你读过的一篇文章，即 Poellhuber 等人的文章。你对这篇文章和其他你读过的文章有什么看法？它们如何改变了你对 AI 的看法？\n\
  \n我读过的文章非常有信息量。我喜欢它们的写作方式。它们通俗易懂。非学术人士也能阅读并理解，我认为这很棒。尤其是考虑到 AI 已成为主流，我认为在公众中拥有这类文章很重要。很多人害怕\
  \ AI。而通常，这是因为他们不了解它。但这是一个问题，因为当人们害怕 AI 时，就有风险让他们的恐惧成为自我实现的预言：他们认为它很危险，所以不与技术互动，所以不产生数据，而\
  \ AI 系统最终变得危险。\n\n当我阅读 Poellhuber 等人的文章以及 Mele 等人的论文《面向参与式大学的基于 AI 的服务提供》时，我脑中浮现的就是这一点。我想，希望这能传达到更广泛的受众，让人们能够阅读它、从中获得灵感，并真正为以人为本的\
  \ AI 的开发和部署做出贡献。\n\n至于这些论文如何影响我对 AI 的看法，可以说它们强化了我已有的认知，即 AI 在教育中可以带来很多机遇。但文章也很好地指出了危险。例如，Poellhuber\
  \ 等人的文章谈到了 ChatGPT 以及它依赖截至 2021 年在互联网上可获得的信息这一事实，而当我回头看在那段时间内到底有多少错误信息……这很可怕……想想这就是在喂养任何\
  \ AI 系统的……这很可怕。\n\n#### 这些文章中是否有你没有看到但希望看到的东西？例如，他们没有涉及而你真的很担心的事情……\n\n有几件事引起了我的注意。首先，在结论中，Poellhuber\
  \ 等人问 AI 是否最终能够取代教师。虽然他们立即用明确的“不”来回答这个问题，但我觉得这个问题也许应该被不同地表述。很多人会带着这样一种先入为主的观念开始阅读论文：某种程度上，AI\
  \ 会削弱教师的作用。但当你提出这样一个问题时，即使只是修辞上的，你也在强化人们的先入之见。如果他们重新表述问题，改为问类似这样的问题：“AI 如何能够使教师更好地个性化教学，从而推动学习？”那么我认为他们就会避免强化人们的偏见。\n\
  \n其次，我喜欢 Mele 等人的文章，它谈到了大学在社会中的作用，但我对其中某一点感到困惑。作者认为大学正在出现一种新角色——它们现在必须与社会互动。我认为也许值得花点时间问一下：好吧，但这真的很新吗？大学一直都在做某种程度上影响社会的研究。我必须承认，我很难理解为什么现在才新。使命并不那么新。只是工具不同了。我看到的唯一新事物是技术的应用。我们只是在谈论新技术的一种应用。\n\
  \n#### 我想回到你之前提到的一点。你说构建像 ChatGPT 这样的大型语言模型需要大量在线信息。我们知道 ChatGPT 被大量英语和法语材料喂养，当然，但我想非洲语言的内容并不多。在多大程度上这是个问题，又该如何纠正？\n\
  \n我认为你一针见血。根本就没有足够高质量的信息可用。如果你看数据，真正*来自*大陆的是什么？涵盖大陆的数据……注意它来自哪里。这同样重要。谁写了现有的内容？他们是否真正理解大陆及其复杂性？\n\
  \n当你使用 ChatGPT 提问时，我认为你可以看到答案并不完全正确。你可以看到存在空白。更糟的是，正如 Poellhuber 等人提到的，不仅仅是信息不可用，这些\
  \ AI 模型在信息不可用时会编造答案。\n\n请注意，这不一定是技术本身的问题。问题出在我们使用的数据上。那么解决方案是什么？应由专家——*本地*专家，他们了解信息和\
  \ AI 将被使用的背景——进行更多研究、更多的数据生产和发布。我认为我们需要产生更多本地数据来抵消这一问题。\n\n再次，这就是为什么我说像你这本书中的文章如此重要，因为人们读得越多，他们就越能理解自己在为\
  \ AI 模型/平台生成数据方面的作用，而反过来，它们将提供更准确的回应。\n\n#### 你会对政策制定者、审计员、用户等提出什么建议，以加强我们社会中——尤其是非洲社会中——以人为本的\
  \ AI 的开发和实施？\n\n政策制定者或审计员应要求开发者提供更多透明度，他们应披露数据的来源、数据集中的内容，以及哪些关键要素在影响 AI 系统所做出的某些建议/决策中。我认为知道数据来自哪里将使人们能够决定是否可以信任\
  \ AI 系统提出的建议。因此，更多透明度将是我建议的首要内容。\n\n\n\n\n\n无论你是否喜欢，人工智能都将影响我们生活的方方面面。因此，让我们确保人们理解人工智能是什么以及它是如何工作的。以\
  \ ChatGPT 为例，它可以生成虚假信息，但信息的呈现方式如此令人信服，以至于你甚至不会质疑自己所读的内容。它会引用名言，提及几个你已经听说过的专家，如果你不了解它的工作原理，你就会相信它。但如果你了解它从哪里获取数据，如果你知道该技术的弊端，那么你就不会那么容易上当。因此，除了透明度之外，你还需要教育，让人们能够理解这些系统：应该期待什么，应该注意什么等等。因此，是的，教育是我会推荐的另一件事。\n\
  \n我的第三条建议更具全球性，并不一定专注于该大陆。它是关于伦理准则的。有很多人正在开发人工智能系统，而且会越来越多。他们受什么规则约束？现在，没有任何规则。每个人都在做自己想做的事。我们从人工智能发展的最前沿人士那里听到了关于其危险性的说法。因此，我认为有必要就这些系统的伦理准则达成一致。\n\
  \n# Section III Lessons Learned and Promising Practices\n\n## 20 A Human-Centered\
  \ Approach to AI Governance Operationalizing Human Rights through Citizen Participation²\n\
  \nKarine Gentelet\n\nUniversité du Québec en Outaouais, Gatineau, Québec, Canada\n\
  \nSarit K. Mizrahi\n\nUniversity of Ottawa, Ottawa, Ontario, Canada\n\nDOI: [10.1201/9781003320791-24](https://dx.doi.org/10.1201/9781003320791-24)\n\
  \n### Introduction\n\n人工智能（AI）的进步引发了人权侵犯的激增，这日益引起全球公民和政策制定者的关注（Raso et al., 2018）。旨在规范在线言论的算法反而审查与宗教、性多样性以及更广泛相关的内容（Penney\
  \ et al., 2018）。为检测癌症而开发的人工智能系统（Lashbrook, 2018；Madhusoodanan, 2021）或评估刑事被告飞行风险的系统对黑人存在偏见（Angwin\
  \ et al., 2016）。部署在高中的人脸识别技术将有色人种学生误识别为安全威胁（Simonite et Barber, 2019）。例子不胜枚举。边缘化社区反复且不成比例地受到人工智能技术名义上的人权侵犯的影响。\n\
  \n随着越来越多的研究表明迫切需要更加关注人工智能背景下尊重人权，众多举措正在进行中，以定义这些技术使用的治理工具。有些倡导负责任人工智能的伦理框架或原则（Council\
  \ of Europe；World Economic Forum；Germany, 2019；Australian Government, 2019）。其他人则试图开发工具，以在这些技术的构思、开发和部署过程中评估其对人权的影响（Government\
  \ of Canada；Metcalf et al., 2021）。然而，所有这些方法都只针对人工智能系统本身。它们既没有加强这些技术使用中的人权，也没有反思受影响个人的需求及其潜在救济。换句话说，这些举措解决的是技术挑战而非社会问题。\n\
  \n这种不足的主要原因是，直到最近，算法歧视的来源一直被认为在技术上（Crawford, 2021）。因此，去偏见算法的努力也依赖于技术解决方案：中和训练数据（Chander,\
  \ 2017），开发伦理人工智能（Council of Europe），或控制算法风险。\n\n要真正把握人工智能的歧视性影响，我们必须优先考虑一个超越评估这些技术影响的人工智能治理体系，而是将人权定位为总体合法化框架。正是这样一个体系，我们在我们的章节中提出——它通过关注人权作为*由他们为他们*动员的原则，使受人工智能系统使用影响的人们获得权力。我们首先将算法偏见置于其既有的社会背景中，说明这些偏见是如何在社会上（而非技术上）产生的，并且仅仅被人工智能放大。我们继续证明，目前为解决这一问题而青睐的规范性解决方案未能触及问题的根源。因为它们保护的是通过自上而下的流程定义的成果的权利，这些流程无法回应公民的\
  \ lived 经历，因此这些解决方案仍然无法为他们提供任何具体的保护；不允许他们以回应其需求的方式利用其人权。我们认为，要实现这一目标，需要我们重新塑造人工智能治理叙事，将人权定位为*运作性*原则——它包括人类及其生计的社会、经济和文化维度，同时同时推进一种以公民行动为基础的人工智能治理方法。这是一个支持公民积极、自愿和有意参与技术工具治理的体系；它允许因人工智能系统而权利受到侵犯的人们通过基于社会每个成员的能动性和自主性的具体参与过程和法律救济动员其\
  \ lived 经历（Chateauraynaud, 2021）。\n\n### Invisible Social Contexts\n\n人工智能通常在有利于主导霸权结构而损害其他叙事的环境中开发，以偏见而闻名（Crawford,\
  \ 2021）。这个问题部分归因于用于训练它们的数据，这些数据经常误代表在社会、文化和历史上被边缘化的群体（Zimmermann et al., 2020；Richardson\
  \ et al., 2019；Harrington, 2020）。虽然许多人建议“中和”算法训练所依据的数据以克服其明显的歧视倾向（Chander, 2017），但我们不能——在许多情况下——*去偏见*数据，因为它们源自歧视仍然根深蒂固的既有社会结构。而人工智能仅仅因为其对数据的过度重视而放大了这种偏见。\n\
  \n在某些情况下，少数群体在人工智能数据集中*代表不足*，从而导致他们在社会中*不可见*。例如，最近有人指出，旨在诊断黑色素瘤的医疗应用无法在皮肤较黑的人群中检测到它（Lashbrook,\
  \ 2018；Madhusoodanan, 2021）。虽然主要针对白人皮肤癌图像进行训练，但有色人种的代表不足并不是疏忽的结果。相反，这是因为缺乏皮肤较黑人群中黑色素瘤的类似图像，主要是由于他们获得医疗保健的机会不平等（Morosini,\
  \ 2021；O’Donnell et al., 2016）。因此，皮肤癌检测应用传播的偏见反映了既有的社会结构，这些结构在满足少数群体的需求和健康方面投入较少，从而导致他们的*不可视化*。\n\
  \n\n\n\n\n在其他情况下，少数群体在 AI 数据集中被 *过度代表* 的方式导致了他们在社会中的 *过度可见性*。例如，美国多家法院使用的风险评估算法（Equivant）就是这种情况。但\
  \ ProPublica 记者的调查导致发现该算法对黑人存在偏见，更有可能将黑人归类为高风险，而白人即使有更暴力、更严重的犯罪记录也不会如此（Angwin et\
  \ al., 2016）。而这种误算直接源于黑人在其训练数据中的 *过度代表*，这与他们在刑事司法系统中的过度代表密不可分（Raso et al., 2018）。\n\
  \n导致边缘群体在机器学习数据集中被错误表征的一个因素是，用于代表他们的數據取自大数据，在多个层面上收集，而完全不考虑其产生所处的社会背景（个人、地方、机构和国家层面）（Benjamin,\
  \ 2019; Noble, 2018）。此外，在为机器学习流程准备时，这些数据会根据各种分类（例如性别、社会经济地位或种族）进行标记和分类，但很少从交叉视角出发，而交叉视角实际上有助于连接人们生活体验的各个潜在维度。\n\
  \n例如，设想一位来自种族化群体的女性，她同时是单身母亲，并在 COVID-19 大流行期间担任医疗护理人员。算法对她数据的利用将无法捕捉其社会维度，因为它们与全球健康危机的背景脱节，因此无法捕捉到这些经历对她自身道路以及具有相似特征的女性道路的重大影响。因此，这一问题并非源于\
  \ AI 使用所带来的影响（Andrus et al., 2021）。而是源于数据的分类以及基于集体表征的指标选择（Zimmermann et al., 2020）。\n\
  \n虽然数据确实以个人为基础进行收集，但将特定社会经济指标之间建立联系的选择，是基于共同特征，而这些特征仍特定于社会组织模式（Delacroix, 2022:\
  \ 12）以及用于定义个人道路的指标，例如教育水平或犯罪记录。将这些指标联系起来在被机器学习算法操作化时可能产生矛盾的效果（同上），并可能对基于这些指标进行排序的人产生歧视性影响。此外，当这些数据集被用于次要目的时，它们便与产生它们的背景脱节。在对具有共同特征的大群体产生集体影响的情况下，记录这些系统性问题在机构层面的重要性变得至关重要，并确定这些社会偏见的根源以加以补救。\n\
  \n一旦我们意识到 AI 工具对整个人口的影响，继续延续仅存在于个人层面的责任模式就变得不切实际。相反，责任变得集体化，因为影响是社会性的，并且通过自动化变得系统化（Zimmermann\
  \ et al., 2020）。把握这一集体维度因此至关重要。然而，要做到这一点，我们必须首先以整体和全面的方式把握人的本质，首要考虑她的社会身份；根据她在社会中的位置对其身份进行情境化（Birhane,\
  \ 2017）。考虑有助于定义这一社会身份的社会生态系统至关重要（例如基于多种社会经济或种族化因素），以确定这些群体在算法使用下将受到多大程度的影响。不幸的是，这一集体维度在目前为解决\
  \ AI 系统的人权影响而开发的监管工具中并未得到充分体现。\n\n### 人权保护与 AI 规范方法之间的脱节\n\n随着社会对 AI 系统歧视倾向的认识不断提高（Shull,\
  \ 2018; Follows, 2021: 19），行业和政府都创建了规范框架，旨在确保其在设计、开发和部署时都以人权为导向。但必须做出一个重要的区分，即在以人权为导向的前提下制定的治理框架与\
  \ *作为* 人权保护权利之间的区别（Kennedy, 2022: 178）。而在忽视这一区分的情况下，目前为解决 AI 对人权的影响而青睐的规范框架仍无法为公民提供任何具体的保护。\n\
  \n这些框架通常有三种形式。第一种是伦理准则，它们在 AI 系统的创建中推进了一套应被尊重的价值观（Yeung et al., 2019; Council of\
  \ Europe, n.d.; World Economic Forum, n.d.; Germany, 2019; Australian Government,\
  \ 2019）。为了促进负责任的 AI，大多数伦理准则强调 AI 系统应具有透明性、可解释性和可质疑性（Germany, 2019; Australian government,\
  \ 2019; OECD; Malta Digital Innovation Authority; the Netherlands; Switzerland,\
  \ the Federal Council; European Commission）。公平、非歧视和正义也是普遍推崇的价值观（Germany, 2019; Australian\
  \ Government, 2019; OECD, 2019; The Netherlands, n.d.; Switzerland, The Federal\
  \ Council, n.d.; European Commission, 2019; China Daily, 2019）。在明确 AI 系统必须具有包容性和可及性的同时，大多数伦理准则承认算法偏见很难完全消除，只要求尽可能减少。\n\
  \n尽管所有这些价值观都值得称赞，但伦理准则仍难以实施。原因有三。首先，伦理原则在光谱上各不相同。虽然有些会重复出现，但情境和文化在定义伦理标准方面发挥着重要作用，而当前的方法未能考虑此类要素（Yeung\
  \ et al., 2019）。其次，这些准则寻求推进某些被认为可取的结果，但几乎不允许个人 *具体地* 享有其人权（Gentelet et Mizrahi,\
  \ 2021）。第三，伦理框架是自愿的行为准则，缺乏确保对人权侵犯承担责任的必要执行机制（Yeung et al., 2019）。这种方法常被批评者称为伦理洗白，除了推迟在\
  \ AI 领域制定具体人权保护之外几乎没有其他作用（Waldman, 2021）。换句话说，伦理框架使人 *看起来* 它们所倡导的价值观处于 AI 开发的最前沿，但这不过是烟雾弹。\n\
  \n\n\n\n\n### AI 监管的规范性方法\n\n第二种规范性 AI 监管方法是算法影响评估（“AIAs”），这是一种治理实践，旨在使 AI 系统传播的危害变得可见，并确保在部署前采取实际步骤纠正这些危害（Metcalf\
  \ et al., 2021）。它们由一份问卷组成，允许开发者测试特定算法的影响水平。被认为能够解决算法偏见问题，它正日益被推广为主要的 AI 治理工具（Karlin\
  \ et Corriveau, 2018；Kaminski et Malgieri, 2020）；Mantelero, 2018；Raji et al., 2020；Reisman\
  \ et al., 2018；Selbst, 2018；Government of Canada, n.d.)。\n\n尽管 AIAs 在寻求在部署前评估和解决算法危害方面似乎比伦理框架更具前瞻性，但它们在推进人权方面同样无效。原因在于\
  \ AIAs“并非中立的测量工具。\\[相反，\\] AIAs 核心的*影响*是*建构物*，它们充当了算法系统可能产生的、概念上往往不同的社会物质*危害*的*代理*”（Metcalf\
  \ et al., 2021：735）。这些工具以影响来定义危害，但经常被识别出的影响与受影响者的真实生活体验并不相关。\n\n例如，用于评估面部识别算法的 AIAs，会衡量其对人们获得平等服务能力的影响。只要年轻黑人女性与年长白人男性相比所接受的服务差异不超过\
  \ 10%，AI 系统就会被视为低风险（Kozlowska, 2021）。但该指标并未衡量边缘群体因面部识别算法持续误识别而常常遭受的潜在情感、心理、社会或经济危害（Johnson,\
  \ 2022）。从这个意义上说，AIAs 仅在保护个人免受*间接*影响而非*实际*危害方面发挥作用（Metcalf et al., 2021：735）。\n\n\
  通常被青睐用于监管 AI 的第三种规范性方法是立法。旨在在保护个人权利与企业利益之间创造合理的平衡，\n\n尽管*《AI 法案》*确实创建了一些有前景的举措，但其方法仍然根植于不平等。它允许\
  \ AI 系统在对人权的运营风险较低时部署。但低风险并不意味着*零风险*。在忽视风险在总体上较低但在特定群体和社区中不成比例地感受到的情况时（Leprince-Ringuet,\
  \ 2021），这种方法将一定程度的人权侵犯视为可接受，并将基本自由视为可谈判的（Access Now, 2021；Hidvegi et al., 2021）。因此，人权被侵犯这一事实本身并不一定赋予公民获得救济的权利（Liu,\
  \ 2019：77）。相反，只有在高风险 materializes 时，问责在这种监管机制下才更有可能（同上）。\n\n就其本身而言，以权利为基础的法规为公民创造特定权利，并强制组织遵守解决方案以确保这些权利得到尊重。但它们往往采取一刀切的方法，未能充分考虑社会挑战，使得许多公民难以动员所青睐的解决方案。例如，欧盟的*《通用数据保护条例》*（“GDPR”）。\n\
  \n虽然它们涵盖了很多内容，但这些解决方案中没有一个真正有效赋权公民。尽管似乎受我们珍视的道德 imperative 指导，但每一个框架都以其自身的方式充满了价值判断和规范性主张，即\
  \ AI 系统的特定影响是错误的，必须为社会利益而解决，或特定解决方案将满足每个人的需求（Kennedy, 2022：178）。但这种推理具有一定的主观性，这与权利论证不同。法律哲学家\
  \ Duncan Kennedy 指出，“诉诸权利的意义，提出它的原因”，“在于它不能被简化为一种单纯的‘价值判断’，即一种结果比另一种更好”（同上：184）。\n\
  \n保护人权，换句话说，并不意味着保障公民对特定结果的 entitlement。相反，它意味着保护公民对*能力*的 entitlement；为他们提供*实际*的可能性，以追求*他们*对*具体*享受其基本自由的方式的愿景，这些方式对他们而言是相关的（Nussbaum,\
  \ 2002；Sen, 1984）。正是在此关键节点上，当前的 AI 监管方法显得不足。虽然它们可能*受*人权*启发*，但并不完全*以*人权为基础。通过忽视将人权定位为总体合法化框架，它们未能创造出赋予公民以权力*具体*享受其人权、且方式对他们相关的人权能力\
  \ entitlement。\n\n### 公民参与作为实现社会正义的工具\n\n为应对 AI 系统侵犯人权而开发的许多工具都试图控制这些系统的*影响*。这种方法将人权置于\
  \ AI 生态系统的边缘，人权被视为“可能”受影响或处于风险中。从这一视角开发的解决方案主要关注被认为理想的结果；这些结果往往通过排斥公民的自上而下方法来定义，掩盖了他们生活经验的观点以及其身份的交叉性。这种角度不允许我们在任何充分意义上思考参与，也不支持允许公民参与以获得正义的过程。\n\
  \n我们所指的正义，是其整体意义上的正义，*qua* 社会正义——一项全球性原则，旨在促进公平、公正和平等，为他们提供采取行动并在权利被侵犯时要求救济的杠杆。因此，我们方法的目标是转变当前\
  \ AI 治理方法的叙事；摆脱脱离风险的身体化，专注于保护公民对结果的 entitlement，转向确保定义这些结果的*过程*，从而使我们更能识别出推进社会正义原则的具体解决方案。\n\
  \n为此，这些过程必须满足包容性和积极参与的三个条件。首先，它们必须采取措施`deconstruct` AI 影响的普遍主义表征。鉴于其巨大潜力，AI 技术被错误地呈现为具有普遍益处（Kalluri,\
  \ 2020）。要成功构想包容性和代表性的参与过程，至关重要的是解构这些普遍主义表征及其阻碍包容性的能力。换句话说，要考虑包容和参与，我们必须首先理解*排斥*。在这些排斥机制被承认其本质之前，提出避免重现类似结果的有效参与过程将是困难的。\n\
  \n\n\n\n\n从排斥的视角审视参与过程，使得能够考量社会语境并克服将人工智能系统的冲击视为普遍且无差别的倾向。用计算机科学家阿贝巴·比尔哈内的原话来说，理解必须优先于预测（Birhane,\
  \ 2017：6）。生活在[content]\n从排斥的视角审视参与过程，使得能够考量社会语境并克服将人工智能系统的冲击视为普遍且无差别的倾向。用计算机科学家阿贝巴·比尔哈内的原话来说，理解必须优先于预测（Birhane,\
  \ 2017：6）。生活在使用人工智能系统的社会中的群体持续经历着重大的社会、政治、文化或宗教歧视。这种系统性歧视极大地影响了他们参与社会的方式，限制了他们在本应鼓励其参与的空间中的自由。换句话说，这些空间并不回应这些群体的需求，并且常常忽视整合能够实现这一目标的目标。\n\
  \n但支持参与和促进包容并不仅依赖于理解排斥。它还需要在人们和群体所发展的各种语境中考虑这些语境所必需的工具的创造（Zimmermann et al., 2020）。在技术层面，界定语境可能是一项重大挑战，因为它需要理解这些语境的复杂性及其潜在维度（Suchman,\
  \ 2007）。这项练习需要对社会及其历史有深入的了解，可以通过咨询受影响者而非采取外部和概念化的方法来简化。这种方法将使我们能够从相关者的观点理解这些语境，同时同时考虑其个人特征的交叉性。这种*ex\
  \ ante*而非*ex post*的策略提供了确定人工智能对人权影响程度所必需的维度（Zimmermann et al., 2020），同时也使得创造一个以人为中心的过程成为可能，该过程整合了作为社会行动者的个人身份所依据的集体问题（Birhane,\
  \ 2021）。\n\n其次，要具有包容性和主动性，参与过程必须强化公民的能力。在当前的流程中，几乎没有为公民的声音和经验留下空间。但鉴于*他们*是受影响者，考虑社会影响对于其实际是什么而非我们可能预期的那样仍然至关重要。理解这些影响的现实/基层视角的关键因素是向公民作为对其自身生活的主人所拥有的专业知识给予尊重。只有通过这些公民的能动性——通过他们识别人工智能对其生计的影响的能力——社会才有可能解决其最具社会破坏性的影响。\n\
  \n并且，在这种意义上强化他们的能力也依赖于通过在人工智能语境中的权利教育来赋权公民，为他们提供表达其亲身经历的工具。权利教育有效地为群体或个人提供了定义不公正以符合基本权利体系的知识基础。为了知道哪些权利受到影响，他们必须意识到自己的权利是什么。在涉及控制力和人类能动性丧失的人工智能语境中（Delacroix,\
  \ 2022），权利教育实现了赋权行动者的目标。它通过赋予公民控制和行动以满足其需求并将自己投射为影响其问题的行动者和利益相关者的*capability*来支持包容并鼓励参与。\n\
  \n因此，他们参与的条件取决于他们掌握和了解识别和解决对其权利的侵犯所必需的工具。而且这种教育必须同样延伸到*digital*权利，以为个人提供把握人工智能语境中发挥作用的基本自由所必需的基础。不幸的是，围绕数字权利和人工智能的当前话语非常技术化，使得普通公民难以理解其与社会和文化权利的关联。这种缺乏意识导致他们放弃某些对生活有重要影响的数字权利。\n\
  \n从这个角度来看，强化他们的能力还涉及以他们能够理解的术语与潜在受影响群体交谈；以将*人权——*而非技术本身——作为核心参照点的术语交谈。人工智能语境中的人权风险目前是基于知识状态、技术以及其他可预见的特征（如人工智能系统的滥用或不遵守监管机制等）来预测的。但这种方法并没有为公民提供基于人工智能系统造成的他们所经历的不公正来定义风险的机会\n\
  \n而且，由于每个人的权利受到的影响并不相同，因此重要的是允许公民在不系统地将其与人工智能语境联系起来的情况下定义受影响的权利。个人面临的主要挑战之一是导致不公正感的亲身经历，他们最初无法将其与人工智能系统相关的人权风险联系起来，因为他们对所涉及的技术细节不够熟悉，无法确定哪些权利与这些系统相互作用。\n\
  \n允许从正义/不公正的视角识别人权影响可以避免这一陷阱，同时也在另外两个重要方面促进包容。首先，它让群体和个人参与定义最能解决他们在人工智能语境中面临的不公正的解决方案，这些不公正可能是结构性的或认识论性的，并对个人的道路产生深远影响（Rafanelli,\
  \ 2022）。例如，原住民组织已将数字主权（而非个人数据保护）确定为解决其在数据集中被错误表征所产生影响的更合适的解决方案（Gentelet et Bahary-Dionne,\
  \ 2022）。其次，它可以帮助识别在这些不公正中发挥作用的社会结构；这些结构被错误地标记为中立或不可见，而事实上它们有助于少数群体被排除在社会进程之外。因此，它也使得能够识别非技术性的系统性因素，这些因素早于数字技术的使用，但被人工智能对数据的过度重视所放大。\n\
  \n参与要有效、主动和深思熟虑所必需的第三个也是最后一个条件是，它必须回应动员的挑战。为了动员公民，至关重要的是提供能够实现其参与的有效工具。为了实现这一目标，这些工具必须能够逆转任何根植于不平等或歧视的过程，并支持\
  \ Chateauraynaud 所定义的*réversabilité*（Chateauraynaud, 2021：10）。这种可逆性使公民行动有效，从而使参与产生切实成果。\n\
  \n走向可逆性所必需的元素之一是承认公民社会在记录人权侵害并将其纳入人工智能治理中的重要作用。由于其与实地密切联系，公民社会组织\n\n\n\n\n\n如果公民社会缺乏行动所需的资源，那么边缘化社区的公民同样处于不利地位也就不足为奇了。因此，要让公民参与治理和监管流程，至关重要的一点是建立既可及又能在他们希望举报权利侵害时易于动员的结构。鉴于目前公民几乎没有直接的救济途径来挑战人工智能对人权的影响，确保公民能够获得问责机制——无论是民主的还是法律的——仍然至关重要。\n\
  \n然而，目前，大多数人工智能治理工具都是自上而下单方面设计的。它们主要集中于向开发者施压——而开发者在法律上并无能力解决这些问题——要求其遵守伦理和社会可接受的做法，特别是涉及公平的做法（Andrus\
  \ et al., 2021）。尽管国家和国际机构正在共同努力制定人工智能法规，但问责机制大多仅集中在宏观层面并可在宏观层面运作。\n\n但需要优先考虑的工具和获取途径必须存在于多个层级，建立一种包容性模式，该模式依赖于多种空间，使参与和问责成为可能。当前模式仅限于国家机构和高级当局的干预。创建可由非制度性行为者轻松动员的流程——由受影响的人或群体发起——将有助于以动态方式解读数据，使其产生意义并将其使用限制在数据产生所处的特定社会环境中（Ibid）。\n\
  \n例如，我们可以依靠现有的公民参与和咨询工具，这些工具已融入国家或市政治理的常规模式，而无需为人工智能问题创建专门的结构。因此，我们可以利用这些现有的低层级民主论坛和大会来纳入并让受人工智能使用影响的群体和个人参与其中。决策流程将采用公民熟悉的格式，问题将在社区层面以较小规模进行框架化。\n\
  \n就诉诸法院而言，可能相关的是扩大某些低强度法院的管辖权，例如小额索赔法院或行政法庭，以允许其审理与人工智能工具使用所引发的歧视以及社会、文化和经济权利侵害相关的案件。允许主要受这些问题影响的人通过提出他们所面临的不公正行为来向法院申诉，肯定有助于把握人工智能在宏观和国家层面所影响的不同权利之间的相互关联性。\n\
  \n但要使这一点成为可能，也必须结束当前法律上 *de facto* 社会、经济和文化权利与数字权利之间的疏离，使公民能够据此提出诉求。这样一来，与社会问题相关的权利侵害就可以被整合到可由公民、基层组织或公民社会直接动员的法律程序中。这些由公民在低强度法院中进行的程序，然后可以成为一个更大进程的第一步，该进程在国家和国际层面引发，并由公民自由监察员、人权委员会或专门法庭等机构进行，例如（Table\
  \ 20.1）。\n\nTable 20.1 Steps toward Citizen Participation\n\n| Deconstructing ||\
  \ Reinforcing || Mobilizing |\n| --- | --- | --- |\n| * Structural mechanisms of\
  \ exclusion; * Social and political contexts; * Socioeconomic determinants; * The\
  \ intersection between profiles and rights; * Technological universalism; * The\
  \ primacy of the expert word; * The relationship between the individual and the\
  \ collective. | * Human rights education; * The link between human rights and technological\
  \ rights; * The capabilities of those impacted to describe the harms; * Cooperation\
  \ across several levels by creating collaborative spaces. | * By working with civil\
  \ society; * By concentrating on human rights rather than technology; * By facilitating\
  \ the connection between rights and violations; * By speaking in terms of justice;\
  \ * Lived experiences as part of the process; * Existing democratic mechanisms of\
  \ governance and accountability; * Realistic approaches for access to courts and\
  \ other accountability mechanisms. |\n| --- | --- | --- |\n\n### Conclusion\n\n\
  将人权原则整合到人工智能治理中，归根结底是社会正义的问题。而要使人工智能治理回应社会正义原则——使其 *truly* 以人为本——它必须超越该技术的技术层面，并回应孕育算法偏见的既有社会结构。为解决算法不公而制定的规范性解决方案必须整合那些生活、道路和人权受此技术影响的公民的观点。虽然反思公平设计或更具社会敏感性的部署实践无疑是一个很好的起点，但这远远不够。原因在于，这种方法严格集中于开发解决人工智能影响的方案——以保护公民对特定结果的权利——同时却忽视了定义这些结果的\
  \ *process* 的重要性。\n\n要确定有效的解决方案，我们必须将当前关注点转向识别那些赋予公民能力参与定义算法工具部署方式的流程。必须为公民提供民主空间，使其能够参与这些工具的治理——定义解决方案并就这些技术将如何塑造他们的叙事做出决策。而将他们纳入这一进程必然要求以对他们有意义的术语使其可及，基于他们能够结合自身\
  \ lived experiences 掌握的人权语言：不公正的语言，其本质植根于人类尊严的概念，并用于涵盖人类身份的社会、经济和文化维度，同时也把握公民所经历的歧视性社会互动。\n\
  \n只有让公民参与治理和决策流程，我们才能定义出更适应社会现实的结果。因此，至关重要的是将我们对人工智能治理的方法重点从风险、结果和对特定结果的权利转移开来，并将我们的精力集中于开发包容性流程，通过这些流程我们可以共同定义我们的算法未来。虽然这样做可能会增加人工智能治理的复杂性，甚至可能导致一些不确定性，但维持现状在社会上是不可接受的。允许公民在人权框架的基础上参与定义人工智能如何塑造他们的叙事，仍是促进社会正义最有效的方式。而如果我们关注流程，适当的解决方案将适时显现。\n\
