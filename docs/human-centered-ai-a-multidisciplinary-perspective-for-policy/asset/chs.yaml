  \ Machinery。\n\n## 12 塑造以人为中心的人工智能于工作场所以实现更好的工作\n\nChristian Lévesque\n\nHEC Montréal,\
  \ Montréal, Québec, Canada\n\nCassandra Bowkett\n\nUniversity of Manchester, Manchester,\
  \ UK\n\nJulie (M.É.) Garneau\n\nUniversité du Québec en Outaouais, Gatineau, Québec,\
  \ Canada\n\nSara Pérez-Lauzon\n\nHEC Montréal, Montréal, Québec, Canada\n\nDOI:\
  \ [10.1201/9781003320791-15](https://dx.doi.org/10.1201/9781003320791-15)\n\n###\
  \ 引言\n\n工作的数字化涉及各种技术，包括人工智能（AI）和数字平台的使用。数字技术作为一个整体的技术和信息基础设施，用于捕获和管理数据以提高生产力、灵活性和成本降低，正在为一种新的生产和消费制度提供合法性。这些技术在工作场所的使用仍处于发展的早期阶段，对其对工作变革性影响的预测仍然不确定且存在争议（Krzywdzinski\
  \ et al., 2022）。\n\n数字技术随着工作世界中的参与者进行试验而演进，这些试验可能使工作变得更好或更差，并赋予或剥夺工人的权力，这是以人为中心的人工智能（HCAI）的一个关键维度。在人工智能领域，赋权通常与个体通过新技术的增强而获得的能力提升相关联（Shneiderman,\
  \ 2021）。我们希望超越这种个体化的方法，通过整合集体行动、参与性和包容性治理来实现赋权。\n\n本章建立在这样一个假设之上：技术既不是好也不是坏；也不是中立的。我们需要避免简单的二分法，而应专注于理解机构如何塑造工作的未来以及工人与新技术整体体验的方式。对于工人及其代表来说，一个核心问题是如何动员传统机构并发展新机构以创造包容性治理和更好的工作。我们提出，更好的工作可以缓解社会和经济风险，并增加工人的自主性以及他们通过有意义且熟练的工作表达自我的能力。这引发了这样一个问题：HCAI\
  \ 如何能带来赋予工人个人和集体权力、同时也为更好的社会创造条件的更好工作（Tasioulas, 2022）。\n\n本章的后续安排如下。下一节概述了我们的框架并回顾了关于人工智能与更好工作的现有文献。随后是对两个范例“工业\
  \ 4.0”和“平台工作”的分析。基于我们自己的材料和二手数据，我们对每个范例的工作质量、工人赋权和治理形式之间的相互作用进行了考察。下一节讨论了为更好工作和更好社会而进行的人工智能治理问题。结论部分对实现以人为中心的人工智能以获得更好工作的途径进行了反思。\n\
  \n### 为未来和更好的工作而使用人工智能\n\n\n\n\n\nAI 作为一种通用目的技术，可以有多种用途和溢出效应，并显著影响我们的思维和行动习惯。AI\
  \ 尽管是社会建构的，其产生的不同结果取决于社会环境和发展的背景。在工作世界中，AI 的部署有可能分裂并侵蚀就业关系制度的基础，这些基础建立在工作场所的统一性（车间、工厂、办公室）、工作时间的统一性（每周工作时间表、休息时间）以及行动的统一性（工作的集体组织）之上（Degryse,\
  \ 2020）。其结果可能是有偿劳动与自由劳动、工作与非工作之间界限的模糊，以及需要增强技能和高回报的工作与仅需要低技能和低回报的工作之间的界限模糊。\n\n\
  虽然这些裂痕的方向是特定于情境的，但在任何工作空间采用 AI 仍然是雇主的特权，与指挥和控制劳动的权利相关联。是否采用 AI 通常与生产战略和企业为降低成本或进入新市场而做出的决策相关联。工人和工会很少参与这些决策，而实施则通过具有雇员身份的工人的法律和合同从属关系得到合法化。然而，文献向我们表明，一旦采用，这些变化将在工作空间内进行谈判（Doellgast\
  \ & Wagner, 2022）。因此，通常所说的传统就业关系的非确定性仍然存在，这要求管理者获得工人的同意和合作（Bélanger & Edwards, 2007）。因此，无论是在正式还是非正式的从属关系下，管理层对工人的权力都是受约束的，并且围绕在工作中表现出的身体、认知和情感努力以及工作如何组织存在持续的谈判（Bélanger\
  \ & Edwards, 2013）。\n\n鉴于 AI 部署所带来的挑战和不确定性，工作世界中的行为者正处于一个漫长的实验期，这为新的治理形式（谁为谁决定什么？）打开了空间，这些形式仍在被争论和共同构建（Zuboff,\
  \ 2022）。关于 AI 和工作未来的讨论围绕两种广泛的方法而两极分化：技术中心主义和以人为本的方法（De Stefano, 2019）。技术中心主义方法是一种自上而下的过程，提倡以数据为中心，将专家和规范化知识的价值置于工人经验之上。以人为本的方法是一种自下而上的过程，更强调员工参与并重视他们的经验和隐性知识。它提倡一种\
  \ HCAI，在这种模式下，个人通过与技术的互动获得自主性和能力（Shneiderman, 2021）。\n\n我们的方法试图通过整合集体行动以及参与性和包容性治理来扩展这种个人化的\
  \ HCAI 概念，以实现赋权。我们通过将工人赋权与工作质量的构成性维度联系起来来实现这一点。\n\n工作质量问题在过去十年中引起了广泛关注，学者们提出了各种类型学和框架来把握数字化的背景下工作质量（Berg,\
  \ Green, Nurski, & Spencer, 2022; Guest, Knox, & Warhurst, 2022; Jarrahi et al.,\
  \ 2021）。这些类型学强调工作质量是复杂且多维的，但在需要考虑广泛的经济和非经济因素来评估“好工作”和“坏工作”方面存在显著共识（Guest et al.,\
  \ 2022; Warhurst & Knox, 2022）。借鉴这些类型学和 Murray et al. (2023) 的工作，我们阐述了工作质量的三个关键维度：风险、自主性和表达性。它们在\
  \ Figure 12.1 中有所体现。\n\n![Figure 12.1 Constitutive dimensions of the quality of\
  \ work.](img/fig12_1_B.jpg)\n\nFigure 12.1 Constitutive dimensions of the quality\
  \ of work.\n\n第一个维度指的是工作中的风险性质和程度，以及这些风险是被共同分担还是个体化。人们面临的风险以复杂的方式相互作用，可能是经济性的（例如，收入安全）、社会性的（例如，孤立或异化），或与身体和心理健康相关（例如，受伤、倦怠）。第二个维度指的是工人在工作组织、工作量和工作时间方面拥有的自主权和自由裁量权。工人在这些方面可能拥有更多或更少的自主权。第三个维度，表达性，指的是工人通过有意义的工作表达自己、发挥技能、表达关切并参与决策的能力。\n\
  \n从理论上讲，赋权的特点是工作空间提供社会和经济安全、自主性以及自由表达自我的可能性，而剥夺权力的空间则体现为不安全感水平高、工人在工作中自主性不大且较少能够表达自己的声音和关切。然而，在实践中，这三个维度以复杂且不均衡的方式相互交织。工人经历充满了矛盾的张力。增加工作时间自主性可能会损害工作与生活平衡和福祉，增加不健康的生活。减少任务自由裁量权可能会降低认知努力和风险，但也会增加工人异化。\n\
  \n这三个工作维度之间的关联在制度情境的工作空间中展开，在适当条件下，它们可以创造包容性和参与性治理的空间。根据 Floridi (2018:3)，“数字治理是为信息空间的适当发展、使用和管理而制定和实施政策、程序和标准的做法。”更简单地说，它关乎在数字世界中谁决定什么、为谁决定（Zuboff,\
  \ 2022）。我们的主要主张是，为了创造更好的工作和更好的社会，公共和非营利机构，如非政府组织和工会，必须被纳入数字工作的治理中。\n\n### I4.0 和平台工作下的工作质量\n\
  \n数字化和 AI 可以以多种方式影响工作和就业，但有两个典型例子吸引了研究人员的最多关注（Guest et al., 2022; Wood, 2021）：生产数字化，有时称为“工业\
  \ 4.0”，以及工作数字化，通常称为“零工工作”或“平台工作”。\n\n这些典型例子涉及不同的就业环境，前者涉及传统形式的就业，而后者涵盖传统上自雇或合同工，现在使用平台来调解供给和需求。借鉴我们在这两个典型例子中的自身材料和二手数据，我们在每个例子中考察工作质量、治理形式和工人赋权之间的相互作用。\n\
  \n#### 通过 I4.0 实现生产的数字化\n\n\n\n\n\n在 2011 年汉诺威工业博览会上推出并被誉为可能革新制造业和服务业的新范式（Kagermann,\
  \ Helbig, Hellinger, & Wahlster, 2013），工业 4.0：(I.40) 的概念意味着通过捕获和格式化数据以及系统和工作团队的互联来实现流程的同步。关于\
  \ I4.0 实施的一个关键问题是它是否会取代劳动力，还是在提高其能力的同时增强工人的任务。技术、工作组织实践和能力之间存在相互依存关系（Brynjolfsson,\
  \ Rock, & Syverson, 2019），并塑造了工作在风险、自主性和表达性方面的构成性维度。\n\n与 I4.0 相关最明显的风险是因失业而导致经济安全的风险。对雇主而言，I4.0\
  \ 是一种提高生产率和灵活性的方式，同时降低成本，包括劳动力成本；对工人而言，I4.0 是对工作和经济安全的威胁（Marenco & Seidl, 2021）。尽管关于数字技术是否会取代劳动力存在诸多争论（Doellgast\
  \ & Wagner, 2022），但经验证据表明其影响各不相同（Gautié et al., 2018；Stroud, Timperley, & Weinel,\
  \ 2020）。机器人技术的引入似乎不会减少总体就业，但会加剧两极分化，高工资/高技能工作和低工资/低技能工作均有所增加，而中间的中等收入/半熟练工作则减少（Dixon,\
  \ 2020）。如果 I4.0 对经济风险的影响是多样的，那么 I4.0 似乎为集体行动者改善健康和安全提供了新的可能性（Haipeter, 2020），降低身体/心理风险。在对加拿大汽车行业的研究中\
  \ Rutherford and Frangi (2020) 认为工人和工会代表已利用 I4.0 的实施来改善工作场所的人体工学。同样，Stroud, Timperley,\
  \ and Weinel (2020) 展示了工人及其代表如何利用新技术的引入来减少德国和意大利钢铁厂中的危险任务。\n\nI4.0 对工人自主性和自由裁量权的影响更为明显且不那么模棱两可。I4.0\
  \ 明显减少了工人对工作完成方式和工作节奏的自由裁量权（Butollo, Jurgens, & Krzywdzinski, 2018；Gautié, Ahlstrand,\
  \ Wright, & Green, 2018；Lévesque, Bowkett, Perez-Lauzon, & Emilien, 2021）。工人对工具、布局、设置和维修工作等关键生产决策的自主权被削弱，而算法管理加剧了这种决策权向程序员的转移。新的数字化工作系统实时收集制造数据，包括对工人绩效的测量，并利用这些大量数据做出决策、制定预测并监控工人的行为（Gautié\
  \ et al., 2018；Wood, 2021）。通过增加例行任务并限制工人对任务顺序和工作完成情况做出决定的能力，I4.0 限制了生产工人采取主动的机会。\n\
  \n这些工作组织的变化与员工对其工作赋予的意义相关，即工作是否具有意义和满足感，以及他们是否有机会发展和调动其技能和能力。Lévesque et al. (2021)\
  \ 强调了一种分化形式，创造了一些非常有吸引力和有意义的工作，以及许多枯燥和无意义的工作。Gautié et al. (2018) 在法国观察到类似的过程。虽然\
  \ I4.0 知识的编码性质倾向于减少有意义工作的比例，但工作过程的主观知识和经验仍然相关且重要（Bellandi, Chaminade, & Plechero,\
  \ 2020）。工人面临的一个关键挑战是对其默会和经验性知识的认可，而这些知识对生产率和竞争力至关重要。另一个类似的挑战涉及工人获取新技能和接受培训以提高其掌握与\
  \ I4.0 相关的认知技术能力的机会。问题在于重新塑造工作，使工人重新控制自己的生计并扩大其在新兴技术决策中的发言权（Yudken & Jacobs, 2021）。\n\
  \n在制造业中实施 I4.0 时，一个至关重要的因素是工人集体表达关切的可能性。在对美国、德国和意大利部署 I4.0 的比较研究中，Rutherford (2021)\
  \ 强调，美国的工人及其代表参与和影响 I4.0 的机会少于意大利和德国的同行。Gautié et al. (2018) 也强调了瑞典、法国和英国之间工人代表声音的差异。瑞典的工人代表对\
  \ I4.0 的实施具有更大的影响力。他们认为，强大的工会参与与工人自主性和技能的积极结果相关，而工会参与较弱时，则很少有积极结果。在德国，Krzywdzinski,\
  \ Gerst, and Butollo (2022) 认为，职工委员会在人工智能技术部署中的战略性参与只有在职工委员会强大并且能够识别企业规划中的问题时才有可能。而在其他案例中，如加拿大和丹麦，区域或行业等其他层面的治理机构可能使更具集体性的方法成为可能（Garneau,\
  \ Pérez-Lauzon, & Lévesque, 2023）。\n\n这些研究表明，行动者正在利用旧的和新的制度来塑造人工智能和未来工作的治理，寻求赋权工人，尽管这一过程在各国之间是不均衡的。\n\
  \n### 通过平台工作实现工作的数字化\n\n对于平台范例，我们关注 Uber，这是一家主要的网约车配送平台，因其对工作数字化的影响而受到研究人员和政策制定者的高度关注。作为一种应用，Uber\
  \ 寻求将消费者与司机联系起来，后者将为他们提供服务，例如交通运输。Uber 将自己定位为一家技术公司，通过其将司机与客户连接起来的应用程序。工会和工人的行动则将\
  \ Uber 视为“雇主”，挑战 Uber 对其司机的责任。这些挑战的范围涵盖了 Uber 如何将风险转移给司机，特别是与不遵守就业法规（薪酬、社会保障和福利）相关的风险，而\
  \ Uber 庞大的算法管理实践扩大了公司对司机自主性和表达性的控制，导致司机从属（Garneau & Bernier, 2023）。\n\n\n\n\n\n\
  在风险方面，Uber 通过倡导出租车行业的放松管制来塑造自身的竞争力，经常削弱对运营出租车数量的现有限制，或对服务在时间和地点方面的最低水平要求。Uber 的商业模式消除了前期成本（例如牌照），这有利于工人降低进入壁垒，并可为移民、青年和兼职工人提供便捷进入劳动力市场的途径。然而，放松管制在某些情况下会增加司机面临的风险，通过增加经济不稳定性，特别是在全职工作的司机中。\n\
  \nUber 通过将其司机归类为独立承包商，将风险（经济和社会）转嫁给司机，减少了其遵守就业法规（最低工资、假期工资和获取其他福利）的责任。因此，Uber 正在改变就业关系的构成（Aloisi,\
  \ 2022；Thelen, 2018）。工会对 Uber 放松管制行业和规避其就业责任的努力的集体回应通常使用法律途径。工会和零工工人团体认为 Uber 作为雇主对其司机负有责任，并已在包括美国、英国、法国、意大利和加拿大在内的多个国家尝试挑战\
  \ Uber 对司机的分类（Aloisi, 2022；Coiquaud & Morissette, 2020；Dubal, 2017）。这些努力在某些国家（例如德国）比其他国家（例如美国和加拿大）更为成功，（Thelen,\
  \ 2018）取决于国家制度和治理应对方式。\n\n在自主性方面，Uber 的平台使司机能够选择工作时间和地点。一些司机认为自己是企业家，利用 Uber 平台经营自己的业务，而另一些人则受益于能够兼职工作，或在其他责任之间安排工作。然而，Uber\
  \ 的算法管理工具在控制、无论是隐蔽还是公开地控制司机对任务裁量、工作量和强度的自主权方面是全面的。Uber 将不断波动且不透明的定价算法与隐蔽的算法推动和游戏化相结合，以鼓励司机在特定地点工作（例如动态定价）并工作更长时间（例如\
  \ Uber Pro、挑战）（Vasudevan & Chan, 2022）。这种工作的游戏化创造了一种“就位”劳动力（Wells, Attoh, & Cullen,\
  \ 2021），司机将其称为“磨工”，在预设地点长时间工作并重复执行任务以换取奖励，例如更高的报酬或工作标准（地点/价格/距离）更高的可见度（Vasudevan\
  \ & Chan, 2022）。其结果之一是工作强化。司机已发展出多种个人和集体应对方式以获得机动空间，并“玩弄”系统（Maffie, 2022a）。\n\n\
  尽管如此，在表达性方面，司机报告称与 Uber 单独行使发言权很困难。司机没有直线经理，呼叫中心支持外包且高度脚本化，尽管 Uber 的面对面司机支持中心更有效。Uber\
  \ 还通过强调客户评分来转变司机能力，更加重视司机的客户服务和情感劳动。一些司机欢迎这种向客户服务指标的转变。然而，糟糕的客户评分会影响司机的整体评分，并可能导致\
  \ Uber 停用司机账户（Chan, 2019；Rosenblat, 2018）。Uber 的算法还推动并强制司机超越常规，通常包括提供水或充电器等身体行为，以及提供高水平的客户服务（Chan,\
  \ 2019）。\n\n对于司机来说，虽然许多客户互动是积极的，但他们现在必须学会应对具有攻击性、种族主义或性虐待的客户，当他们依赖于维持客户评分时，这往往是一项艰难的任务，而且很难推翻负面评分（Maffie,\
  \ 2022b；Rosenblat & Stark, 2016）。在个人层面，司机经常选择退出平台，当他们无法行使发言权或试图通过发展其他收入形式（例如非法或独立出租车运营）来减少对\
  \ Uber 的依赖时（Maffie, 2022a）。在集体层面，司机和司机代表已使用法律系统（法院案件）并参与抗议、集会和公投，以游说采纳保护司机的公共政策，其中一些努力包括传统工会（Estlund\
  \ & Liebman, 2020；Vandaele, 2018；Wells et al., 2021）。\n\nUber 已能够 dismantle 传统劳动机构，而工人及其代表面临的挑战之一是更新和建立新的治理机构以实现更好的工作。\n\
  \n### HCAI for Better Work and … Better Society\n\n正如多项研究所强调的那样，在许多行业和国家，将 HCAI\
  \ 置于前沿仍有许多工作要做。在我们的两个典型案例中，I4.0 和平台工作，主导趋势更依赖于技术中心主义的方法，促进以数据为中心自上而下流程，赋予专家和规范化知识比工人经验更大的价值。这似乎不是实现更好工作的最佳途径。\n\
  \nI4.0 在制造业中的实施并未从根本上改变生产发生的地点（车间、工厂）、工作的统一时间（每周工作时间表、休息期）以及统一行动（工作的集体组织）（Degryse,\
  \ 2020）。然而，人工智能和算法管理正在分裂工作质量的构成维度。人工智能的实施依赖于劳动力市场的分割和风险的极化，加剧了“好”工作与“坏”工作之间的差距。I4.0\
  \ 有可能通过减少工人对任务顺序和工作完成情况的决策能力来重新定义工人的自主权。任务的标准化和企业的监控能力增强，同时限制工人拥有充实工作和发展技能和能力的可能性。\n\
  \n在平台典型案例中，Uber 案例中，工人认为他们对工作地点和时间有更大的自主权，但这是以牺牲工人集体性和统一行动（工作的集体组织）为代价的。在这里，Uber\
  \ 如何构建其商业模式并使用人工智能，基于其是一家科技公司而非雇主的理念，这对就业保护和监管产生了重大破坏性和破坏性影响。Uber 将雇主风险和责任转移给个人工人，增加不稳定性。为了保持对任务和工作的控制，Uber\
  \ 对司机进行大量监控和监视。对司机作为工人的缺乏认可减少了 Uber 为工人提供发言机制的责任。\n\n然而，存在大量实验，各种参与者参与设计和实施能够通过更好工作赋能工人的技术。这些实验发生在多个层面（工作场所、部门、区域、国家和超国家），在制度上有所定位，并根据人工智能治理而有所不同。\n\
  \n\n\n\n\n人工智能治理的层级和空间多种多样，并以独特的方式塑造了 HCAI 的定义以及其对未来工作的塑造。然而，越来越多的证据表明，仅靠企业和市场机构无法通过包容性和参与式的治理创造更好的工作条件。公共和非营利机构，如非政府组织、工会以及行业和区域中介组织，必须纳入数字治理中，以实现更好的工作。\n\
  \n当存在具有开放空间的强大机构以实现包容性和参与式治理时，HCAI 更有可能赋能个人和集体行动者。这在德国、瑞典和丹麦的多层级治理方法中尤为明显，但在加拿大和美国的特定地区和行业中也是如此。这两个国家以及其他机构较弱的国家面临的一个关键问题是如何扩大\
  \ HCAI 实验的规模。\n\n我们认为这是一个关键问题，不仅因为包容性和参与式治理可以带来更好的工作和赋能的工人，而且因为它可以通过减少不平等和增加团结来带来更好的社会（Acemoglu,\
  \ 2021; Tasioulas, 2022; Zuboff, 2022）。\n\n### 结论\n\n尽管使用在不断增加，工作场所中人工智能的应用仍处于发展的早期阶段，我们对治理形式、工作质量和工人赋能之间的相互作用的理解仍然有限。本章提出了一个框架来帮助我们开始分析这些相互联系，并将其应用于两个典型案例，即\
  \ I4.0 和平台工作。然而，需要更多的知识来理解人工智能如何带来更好的工作和更好的社会。在这些结束语中，我们提出了实现这一目标的三个途径。\n\n首先，鉴于人工智能对工作的影响各不相同，我们必须更全面地把握人工智能如何重塑工作的三个构成性维度（风险、自主性和表现力），以及数字化是否赋能或削弱工人。我们对两个典型案例的描述表明，这些维度以复杂且不均衡的方式与赋能相交。关于人工智能的叙述或辩论应聚焦于新技术是有利于少数人还是大多数劳动者。需要理清个人赋能与集体赋能之间的关系，并倡导一种集体方法来补充许多\
  \ HCAI 倡导者提出的现有个体化方法。\n\n其次，我们必须更全面地理解各种行为者如何通过新旧机构的实验来塑造这一数字时代工作的未来治理。这些实验过程可能涉及对旧治理机构的重组和再估值，以使其适应新的数字环境。它们也可能涉及对旧机构的\
  \ dismantling 和新机构的创建。关键问题是，这些拆解、重组和重新发明治理机构的过程是否具有包容性，并为公民社会和集体行动者，如工会，创造资源，使其能够胜任、创造性且自信地参与这些新技术的治理。\n\
  \n第三，所有利益相关者都需要认真理清更好工作与更好社会之间的联系。工作场所被视为参与构建美好生活的核心场所。然而，通过日益加剧的经济和社会不安全、去技能化和无意义的工作而导致的失权可能对社会团结和民主产生破坏性后果。需要制定具体的政策来改变激励机制并鼓励社会责任创新（Acemoglu\
  \ & Johnson, 2023）。虽然这看起来是一项艰巨的任务，但理清这一联系是推进重塑和重新思考数字技术以实现所有人更美好的未来的唯一途径。\n\n###\
