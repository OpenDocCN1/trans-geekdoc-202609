  ## 5 人本中心人工智能 HCAI 从概念审视到立法行动\n\nPierre Larouche\n\nUniversité de Montréal, Montréal,\
  \ Québec, Canada\n\nDOI: [10.1201/9781003320791-7](https://dx.doi.org/10.1201/9781003320791-7)\n\
  \n\n\n\n\n当 ChatGPT 在 2022 年秋季突然进入公众视野时，它吸引了人们的注意，并使一个在专业圈子中已讨论多年关于当前 AI 浪潮的法律应对方式的辩论变得突出。媒体上目前呼吁公共当局进行干预的呼声，正值专业辩论从长期的概念审视阶段转向具体立法行动之际。这一行动由欧盟牵头，其中提出了“人工智能法案”\n\
  \n本章将聚焦于从概念审视向具体法律行动过渡所带来的机遇与挑战。第一部分指出概念审视阶段的不足之处，这些不足必须在向具体法律行动过渡时得到克服。第二部分介绍了立法行动阶段的主要挑战，即对创新的应对方式选择。第三部分说明了《人工智能法案》如何应对这些不足并处理该挑战。第四部分将《人工智能法案》置于更广阔的背景中，以突出其全部影响。\n\
  \n### 概念审视阶段的不足\n\n在概念审视阶段，世界各地数百个团体和委员会深入研究了广义上被称为“人工智能与伦理”的问题。他们撰写了大量报告和研究，通常会得出旨在规范人工智能的一套伦理原则（Algorithm\
  \ Watch, 2020）。\n\n#### 人工智能作为“闪亮的物体”\n\n可以设想，关于人工智能存在某种“闪亮物体综合征”。人工智能与伦理的努力倾向于将人工智能视为法律或监管可以附着的独立对象，因此将其表述为“人工智能监管”并呼吁“监管人工智能”。然而人工智能并不是可以附加法律义务的自主实体\n\
  \n前一段可能看起来陈词滥调，但其含义并非如此。一旦达成共识，监管人工智能意味着监管企业、个人和公共当局在处理人工智能系统时的行为，那么笼罩在“人工智能监管”上的新颖光泽就会消散。人工智能监管开始类似于将技术发展整合到法律框架中的其他努力，以其社会和经济影响为依据。\n\
  \n规范上，以这种方式构想人工智能监管也是可取的，因为它更符合创新理论。\n\n#### blank page fallacy 白纸谬误\n\n一旦“人工智能监管”被理解为在现有行为主体和机制的框架内，对人工智能系统引入的最佳法律方法的发展，那么第二个不足之处就会清晰地显现出来。\n\
  \n太多的人工智能与伦理的努力似乎认为“监管人工智能”意味着从白纸开始，从零开始构建专门针对人工智能的新监管体系。这种误解的根源是多方面的。也许它反映了工程师和计算机科学家对法律的看法，即法律由直接针对特定情况的详细规则组成；缺乏此类规则就意味着法律真空。这与数字经济中普遍存在的假设相吻合，\n\
  \n白纸谬误也让人想起 1990 年代，Easterbrook/Lessig 关于是否需要制定专门的网络空间法律的辩论，使用了当时流行的术语。\n\n沿着同样的思路，尽管缺乏——如果不是完全没有——专门针对人工智能本身的具体规则，但由于人工智能嵌入在社会和经济关系中，正如前一标题所述，仍有大量法律可以适用于人工智能。详细探讨这些法律超出了本章范围，但足以简要提及其中一些，从大多数宪法和国际法中确立的基本权利文书开始。即使这些文书可能并不总是适用于所有关系，它们也表明了基本权利在我们社会中的重要性。同样，社会和经济互动的基础在私法的各个主要领域中得以阐述，包括合同、责任和财产法。一些更具体的法律体系也与人工智能的发展和开发尤其相关，例如知识产权法、竞争法，当然还有隐私和数据保护法。甚至可以大胆地说，在没有关于人工智能的任何立法举措的情况下，人工智能的法律框架最终会演变，因为现行法律会逐步适用于人工智能。然而这将是一个漫长的过程，由于法律有机增长的相对缓慢时间框架，注定会造成错误和错失机会。\n\
  \n因此真正的挑战不是从零开始构建人工智能监管，而是确定现行法律是否以及如何适合处理人工智能，然后根据情况对法律进行补充或完善。因此，这项工作更类似于更新一本旧版教科书，而不是从白纸写一本新书。当然，挑战并不因此而减弱：制定和实施人工智能的法律方法将需要学者、政策制定者和利益相关者在较长一段时间内付出重大努力。\n\
  \n事实上，作为一个不幸的副作用，白纸谬误使一些利益相关者能够淡化现行法律的重要性，并将关键实质性问题描绘得比实际情况更开放和不确定。“人工智能与伦理”这一标签在这方面也没有帮助，因为伦理通常被认为是可以进行辩论和讨论的。\n\
  \n更糟糕的是，允许辩论被框定为在空白法律页面上进行开放式的伦理讨论，对政策制定可能产生反效果，因为它为各种拖延战术打开了大门，这些战术旨在无限期延长讨论，而技术却以快速的速度不断进步。\n\
  \n当我们从概念审视阶段走向具体法律行动时，闪亮物体综合征和白纸谬误的影响应该会消散；然而，这两个不足之处将在处理制定人工智能法律方法中的关键问题之路上造成分心和延误。\n\
  \n### 主要挑战：宽容还是保护性方法\n\n从更广阔的视角来看，这两个不足之处——尤其是白纸综合征——反映了数字经济中盛行的创新文化，\n\n简而言之，数字经济是在对创新的宽容方法下发展起来的。在法律术语中，宽容的方法通常允许任何发明进入市场并转化为创新，仅受适用于一般法律（合同、责任等）的约束，这些法律在发明进入市场后才*a\
  \ posteriori*适用。*如果并且一旦*发明被证明会造成伤害，那么法律后果就会随之而来，必须采取纠正措施。在宽容的方法下，重点是避免第一类错误（假阳性），即由于不恰当的*a\
  \ priori*担忧而阻止发明进入市场。一旦这种法律框架被企业和用户文化所内化，这就转化为将发明尽快推出的冲动，即使它们后来需要“更新”，正如我们每天都能见证软件的情况一样。\n\
  \n\n\n\n\n与此相反，一些主要经济部门深陷于一种更具保护性的创新方法。从法律上讲，除非发明首先被证明符合必要的安全和无害标准，否则任何发明都不能推向市场。这就是制药和医疗器械法规以及航空法规的本质，仅举几例。在这种保护性方法下，重点更多地放在避免\
  \ II 类错误（假阴性）上，即由于 *a priori* 控制失败，发明最终被证明是有害的。当转化为企业文化时，这种保护性方法通常意味着产品开发团队在产品开发过程中尽可能彻底地评估造成伤害的风险。特别是，他们还试图预测和遏制发明的错误使用和恶意使用（误用和滥用）。这使得产品开发能够更顺畅地通过法律框架，直到发明最终投放市场。\n\
  \n在过去几十年中，随着数字技术向其他经济部门的扩散\n\n当然，融合后宽容方法的胜利击败了最初导致在融合前某个部门引入保护性方法的理由。它允许创造最初证明保护性方法合理的风险：产品在未经事先控制的情况下就推向市场，从而可能造成伤害。\n\
  \n因此，令人毫不意外的是，反对在人工智能方面偏离宽容方法的主要论点围绕着对创新的影响。引入对人工智能系统的更深入审查，尤其是如果在将其推向市场之前进行，则被视为扼制创新的万无一失的方法。\n\
  \n也许最令人信服的不为人工智能系统引入保护性方法的理由并不围绕创新，而是信息。人工智能是一种 notoriously 不透明的技术，即便对其设计者也是如此。要使监管机构达到做出允许或禁止特定人工智能系统的明确决定的所需信息水平，就需要其付出相当大的努力。即使在制药产品相对容易的信息环境中，市场授权程序也是漫长的（历时数年）且昂贵的（达到数十亿美元）。\n\
  \n就人工智能而言，宽容方法因此会从社会角度涉及过度冒险，而保护性方法则因信息问题而不可行。因此必须寻求妥协路径。它很可能来自“负责任创新”文献，其规范定义如下：\n\
  \n> 一种透明、互动的过程，通过该过程，社会行为者和创新者相互回应，以实现创新过程及其可市场化产品的（伦理）可接受性、可持续性和社会期望性（以便使科学和技术进步在我们社会中得到恰当嵌入）。\n\
  \n> \n> (von Schomberg, 2011; 7–9)\n\n负责任创新涉及将公共政策目标嵌入企业的研发和扩散过程，以及企业与社会行为者（也扩展到公共当局）之间的对话。与宽容或保护性方法相比，负责任创新意味着企业在监管生活中参与度更高。从企业的角度来看，这种参与是必要的，以确保其发明是可接受的（“信任”问题在人工智能的法律方法中发挥着核心作用）。从公共当局的角度来看，这是解决信息问题的最佳途径，尽管这意味着与企业分享监管负担（以一种复杂的共同监管形式）。这种方法已在\
  \ GDPR 中得到先行探索，其关于“隐私设计”和“默认隐私”的条款。(GDPR, 2016)\n\n### 首批立法倡议：欧盟人工智能法案和加拿大 C-27\
  \ 法案\n\n欧盟已在全球范围内就其人工智能法案提案率先采取行动，\n\n迄今为止的评论中，人工智能法案的分层风险为基础的结构吸引了最多的关注。风险水平是根据人工智能系统使用的目的来评估的。从本质上讲，一组有限的“人工智能实践”被认为危害如此之大，以至于被\
  \ outright 禁止。\n\n本章有限的范围不允许对人工智能法案进行全面审视。相反，我将重点关注人工智能法案如何反映前述讨论，即：\n\n* 通过将人工智能监管置于背景中并将监管附加到现有行为者和机制上而不是人工智能本身，避免光鲜对象综合征；\n\
  * 拒绝空白页谬误，倾向于依赖现有的法律和法律机构，然后将其扩展和塑造以适应人工智能；\n* 通过推动企业走向负责任创新，试图在宽容和保护性方法之间找到一条道路。\n\
  \n拟议的人工智能法案是典型的欧盟内部市场立法。它关注通过提出统一的监管框架来实现相关公共政策目标，从而确保人工智能系统在欧盟的自由流通。\n\n同样，人工智能法案也与其他欧盟立法相联系，并借鉴了现有的立法和监管技术。人工智能法案不是从零开始制定人工智能监管，而是寻求尽可能“规范化”人工智能的法律待遇。法案核心的高风险人工智能系统制度完美地说明了这一点。高风险人工智能系统部分由参考现有的欧盟立法来定义，这些立法规范被认为会造成风险的产品（例如，压力设备、个人防护设备、医疗器械、机动车辆等）：构成这些产品之一或其安全组件的人工智能系统自动被归类为高风险系统。此外，高风险人工智能系统提供者获得市场准入的法律机制直接取自欧盟针对风险产品的既定手册。提供者需要将其系统提交合规评估\n\
  \n最后，拟议的人工智能法案还试图为高风险人工智能系统的监管引入“负责任创新”方法。在这里，法案同样依赖于欧盟产品监管中经过验证的配方，\n\n与拟议的欧盟人工智能法案并行，加拿大也在辩论一项人工智能和数据法案（AIDA）的法案（Canada,\
  \ 2022）。\n\n### 人工智能法案在更广泛的背景下\n\n为了把握人工智能法案的全部影响，有必要将其置于自 2020 年以来一系列重大欧盟立法倡议的更广泛背景中。这些倡议包括\
  \ 2022 年的《数字服务法》（DSA），该法更新了规范在线中介的法律：在对本世纪初以来生效的责任豁免制度表示口头支持的同时（European Union,\
  \ 2020），DSA 对在线中介在其平台上流通的内容进行监管提出了更沉重的义务（European Union, 2022a）。也在 2022 年颁布的《数字市场法》（DMA）对大型平台（守门人）施加义务，以防止影响使用这些平台接触客户的企业的反竞争行为（European\
  \ Union, 2022b）。与人工智能法案并行，欧盟机构也在考虑一项《数据法案》提案（European Union, 2022c），以促进非个人数据在企业之间的自由流通，从而促进欧盟工业。\n\
  \n\n\n\n\n这些立法倡议的一个关键共同特征是，它们都适用于主要数字平台（通常被称为 GAFA\n\n此外，从这些倡议的字里行间可以看出一个整体的欧盟战略正在浮现，即欧盟旨在成为先行者，以便其立法在国外得到效仿并在全球范围内成为典范。\n\
  \n### 结论\n\n围绕人工智能法律方法的辩论现在正从概念审视阶段（人工智能与伦理）转向具体立法和监管行动的阶段。本章表明，在从一个阶段向另一个阶段过渡的过程中，概念阶段的两个主要缺陷正在得到解决。这些缺陷被称为“闪亮物体综合征”——即人工智能被视为一个独立的监管对象——以及“空白页谬误”——即假设监管人工智能的任务是从空白页开始。\n\
  \n在纠正这些缺陷的过程中，一个核心问题也被提出，即人工智能应置于对创新的宽容性方法还是保护性方法之下。这些方法通常会渗透到推动行业创新的文化中。作为起点，人工智能与数字经济相关联，而数字经济是在宽容性方法下蓬勃发展的。到目前为止，每当宽容性方法与保护性方法在两个部门融合时发生冲突时，宽容性方法在实践中都占据上风。人工智能将被设定为融合导致结果被认为是不理想的第一个案例；然而，保护性方法似乎也不合适。第三种途径可以在“负责任创新”概念中找到，即企业需要将公共政策目标内化并成为其自身监管的积极合作伙伴。\n\
  \n拟议的欧盟《人工智能法案》是全球首个重大的人工智能监管倡议。可以看出，《人工智能法案》避免了闪亮物体综合征和空白页谬误。《法案》还指向一种“负责任创新”方法，这将要求习惯于在宽容性创新方法下运营的企业在文化上进行重大改变。\n\
  \n从更广泛的背景来看，《人工智能法案》以及欧盟关于数字经济的其他主要立法倡议很可能成为其他司法管辖区的典范，或至少成为基准。它们指向一个漫长而迭代的过程，逐步制定和实施针对人工智能的现有法律、现有法律的延伸以及一些新法律的混合体。在所有阶段，行业参与——以协同监管的形式——不仅有用，而且对于确保法律的有效性至关重要，鉴于公共当局在人工智能方面面临严重的<|message|>信息不平衡。\n\
  \n### 注释\n\n1. 在本章全文中，对拟议《人工智能法案》的引用均指最新的主要稳定版本，即所谓的“总体方法”，该方法源于理事会对原始委员会提案的讨论：European\
