  \n## 22 迈向算法的社会可接受性\n\nMarina Teller⁴\n\nUniversité Côte d’Azur—GREDEG, Nice, France\n\
  \nDOI: [10.1201/9781003320791-26](https://dx.doi.org/10.1201/9781003320791-26)\n\
  \n### 引言：迈向一个由算法治理的世界\n\n法律与计算机科学是两个非常相近的学科。首先，法律是一种语言，它体现在代码行中，就像计算机科学一样。其次，法律表达了价值观以及其背后的逻辑。法律推理是三段论的结果，它将事实情境与规则相对照。这一过程本质上是算法式的。因此，法律与算法在形式和实质上都密切相关。这种接近性可能导致了人们对法律领域被算法逻辑颠覆的担忧。事实上，算法装置与人工智能系统的引入导致了法律的数字化，其更深层的雄心是想用技术标准取代法律规范（Teller,\
  \ 2020a）。\n\n这些争论不仅仅是技术性的。它们揭示了另一种更深层的、甚至是意识形态的、政治性的对抗。事实上，法律规则具有人类学功能：它确立了价值观，为诸如基本权利、自由、正义、自由意志和同意等概念保留了特殊地位。法律也是社会的镜像，并体现了其基本价值观。\n\
  \n技术对法律有何影响？很难概括这些影响，因为它们众多且分散。我们可以概括地说，法律被简化为一种理性方法，它将本质上属于人的体验简化为数据的处理。法律在数据处理的光照下被评估：事实上，个人被同化为*数据主体*，根据《通用数据保护条例》第\
  \ 4 条的术语，即数据提供者。我们所有生活体验的算法化催生了一种特殊的规制，学者们称之为“算法治理”（Rouvroy et al., 2013）。\n\n这种治理模式以技术和统计权力为基础。它产生了一种效果，即使法律主体作为人的资格被取消，只看到他是一个数据传输者，一个可溶于*大数据*的核算单位（Rouvroy,\
  \ 2018）。通过数据处理对人的管理随后改变了社会互动的规制，这就是主题的全部人类学维度。不要被算法的技术层面所迷惑：在代码之下，真正且本质上存在的是政治问题（Boddington,\
  \ 2020），这些问题并未清晰显现。这是专门讨论人工智能社会层面的学术文献中被忽视的一个方面：为了真正概念化以人为中心的 AI 的理念，有必要从治理的政治角度来考虑主体。治理事实上充当了通往社会生活中基本概念的门户，如共识、辩论、投票和集体审议。如果以人为中心的\
  \ AI 被定义为由人设计、为人和与人一起设计、并且最终设计目标是促进人类繁荣的系统，那么审视 AI 的治理就势在必行，特别是对于定义的最后一个方面：“与人一起”。\n\
  \n#### 什么是“算法统治”？\n\n算法的权力与市场和官僚制等传统规制力量竞争（Aneesh, n.d.）。学者们关注算法权力的制度维度，它被分析为一种由计算机代码引导的非官方反权力（Chrisley,\
  \ 2020）。\n\n这种新权力被称为“算法统治”或“algocracy”（Danaher, 2016），它改变了法律、执行与自由意志之间的关系。事实上，规则被嵌入计算机代码中，导致公民或权利主体对所涉问题的理解丧失（Kitchin,\
  \ 2017: 14）。在由算法编程治理的生态系统中，个人的自由和自主性会发生什么？遵守或不遵守规则的意图和意愿又如何？这种被视为算法无处不在和无所不能的“算法统治”，改变了决策本身的理念，而决策基于有意识和自愿的审议。自由和知情的决策在其本质上可能因这些催生了算法法的技术规则而受到质疑（G’Sell,\
  \ 2020: 86）。人们担心人工智能工具会超出其作为决策辅助的角色。它们有可能逐渐但肯定地成为决策的替代品（Teller, 2020b: 461）。\n\n\
  最后，算法规则高度技术化的性质使其更容易逃脱法治的控制。法律体系正在经历“算法转向”（Restrepo Amariles, 2020: 133），因此引发了基本问题：它与法治的民主模式相容吗？算法统治是民主和技术官僚的逻辑延续的一部分吗？它是否很自然地是“*下一步或下一次行动*”（Bersini,\
  \ 2018）？我们是否应该担心从“政变”滑向“*数据政变*”（*coup data*）（Basdevant, 2020: 46）？\n\n\n\n\n\n本章旨在探讨人工智能（AI）与法律之间的互动：更具体地说，它聚焦于\
  \ AI 在法律和社会领域的影响。正如马歇尔·麦克卢汉所说，“我们塑造工具，然后工具塑造我们。” 新技术如何影响我们的法律和政治体系？民主是否处于危险之中？事实上，新技术的引入对一个社会而言并非中立，这可能会同时影响多个不同类别的人：消费者、用户，但也包括公民。然而，个人从未被征询过，他们的意见也没有被考虑来评估与新技术相关的社会平衡。随着新技术的影响日益加剧，有必要确保公民在更大范围内的共识。技术现在正成为一个政治问题。如果我们希望确立以人为中心的人工智能原则作为对社会具有切实效果的有效原则，就有必要反思个人接受\
  \ AI 系统的条件。事实上，个人不仅仅是 AI 系统的用户；他们还是数据的提供者。因此，他们在 AI 的各个层面都处于核心地位。主要挑战在于建立一个框架，确保个人的意愿，通过给予他们表达意见和同意使用算法系统的机会。在一句话里，AI\
  \ 必须“与人一起”构想，而不仅仅是在数据科学家或大型科技公司的实验室内部。那就是为什么，为了全面理解以人为中心的人工智能的概念，有必要也关注其为社会所接受的条件。\n\
  \n本章将此问题称为“算法的社会可接受性”。我们提案的目的是重新思考我们法律规则的颁布流程，以加强必须主导任何规范发展的民主辩论条件 (Teller, 2022a)。因此，雄心在于从算法统治转向算法民主（“从算法统治到算法民主”部分），这意味着重新思考保证算法真正社会可接受性的条件（“迈向算法的社会可接受性”部分）。\n\
  \n### 从算法统治到算法民主\n\n算法已经殖民了我们日常生活中的每一个空间：广告、物联网、健康、交通、教育、公共行政、“智慧城市”、LegalTech、加密资产等。许多职业以及法律专业现在都面临着算法系统，这从根本上改变了治理方面的平衡。\n\
  \n法律框架在这里发挥着特殊作用：事实上，有必要从设计阶段重新思考人与算法之间的互动。这是确保一种特定形式的解释性、打开“黑箱”的基本条件。计算机代码的强制披露，如在算法透明度的背景下可能要求的那样，不足以解释算法逻辑。事实上，要理解一个算法系统的效果，有必要能够访问其内部逻辑（代码和数据库），以便例如检测可能的偏见。因此，法律框架至关重要，因为它也有助于确保上游的人为干预的可能性。这就是“人类担保”或人在回路概念的诞生。\n\
  \n因此，算法治理需要一个特定的法律框架（“一个特定的法律框架”部分）。事实上，如果算法可以无可争议地宣称效率，辩论首先必须集中在其合法性上（“效率 *versus*\
  \ 合法性”部分）。\n\n#### 一个特定的法律框架\n\n`复杂性的挑战`—在他的 *Traité d’algocracy* 中，计算机科学家 Hugues\
  \ Bersini (2023) 宣布，由于需要管理的复杂性和危机的多样性，公共政策的指导将越来越多地由算法系统主导：全球变暖、资源稀缺、移民流动、经济不平等、能源转型、共有物的分配、全球大流行等。(Bersini,\
  \ n.d.)。\n\n计算机科学将是唯一真正有效的回应，因为所有这些危机都有一个共同点：它们不可避免地需要在选择和偏好方面做出权衡（因此，选择能源密集型或节俭的做法，从生态角度看是美德还是被禁止的行为，设立可接种疫苗的人口类别以及根据什么优先顺序等）。这些权衡是复杂的，政策制定者会倾向于通过各种算法工具寻求帮助：推荐、建议、选择或约束的算法，旨在改进或优化。这些工具将基于预先设定的标准并即时地进行选择或决策。毫无疑问，这种对公共决策的完全自动化处理会引起抵制（我们希望如此）以及辩论（我们也希望如此）。\n\
  \n`思考算法治理`—我们注意到，在某些法律领域，监督或监管机构已经验证了这种“算法化”，并支持使用算法工具和人工智能系统。然而，AI 治理中的缺失环节已被学者指出\
  \ (UNESCO-Mila, 2023)，而该主题仍然复杂甚至具有颠覆性。监管机构甚至开始考虑改革某些治理规则。\n\n这在银行和金融部门尤其明显。因此，公共建议和白皮书直接针对算法的治理\
  \ (ACPR, 2020)，以便行为者整合新的问题：新的风险（网络风险以及与模型外包、托管或技术技能相关的风险）、新的审计任务和验证功能的修订（以整合“设计时”合规关切，即在算法设计期间，但也在算法系统的整个生命周期中，以便确保持续符合评估原则，例如适当的数据处理、不存在不稳定性以及系统决策解释的有效性）。\n\
  \n更根本的是，学者们已经明确指出，算法治理的基本问题涉及以一种新的方式思考法律，随着一种新的书写方式的出现，这种书写滋养了一个新的神话，即通过算法书写的唯一集合，在没有第三方和没有法律的情况下组织社会关系\
  \ (Garapon & Lassègue, 2018)。让我们更清楚地说出赌注：算法是对先于计算机编码而存在的选择的建模。这个选择是政治决策的问题，必须仍然是公共辩论的一部分。一条规则必须有效，但首先它必须是合法的。\n\
  \n#### 效率 *versus* 合法性\n\n\n\n\n\n### 以数据和市场为重点的法律框架\n算法决策在法律中已有很好的框架 (CNIL, 2017;\
  \ European Commission, 2021a, 2021b; European Commission, 2020)。在国家和国际层面，已对人工智能系统进行了大量监管工作。今天，与“黑箱效应”相关的风险已被很好地识别并受到谴责：偏见风险\
  \ (Bertail et al., 2019) 和歧视 (Crawford, 2013)，决策过程的不透明 (Burrell, 2016)，难以防范串谋风险\
  \ (Marty, 2017)，以及技术俘获和主权侵犯风险 (European Commission, 2022)。在欧洲法律中，立法者已围绕数据建立了强大的法律框架，包括通用数据保护条例\
  \ (European Parliament and Council, 2016)、非个人数据自由流动条例 (European Parliament and Council,\
  \ 2018)、网络安全条例 (European Parliament and Council, 2019a)，以及开放数据指令 (European Parliament\
  \ and Council, 2019b)。欧洲数字*单一市场*（DSM）的建设是通过一系列正在进行的文本或倡议进行的：*数字市场*法案 (European Parliament\
  \ and Council, 2020)、*数字服务*法案 (European Commission, 2020)，以及*数据治理法*（法案 (European\
  \ Parliament and Council, 2020)）。\n\n毫无疑问，立法者已认识到规范算法效应的必要性，更具体地说是它们对市场和个人数据的影响。然而，我们认为，在欧洲监管框架中仍相对较少涉及的一个维度是：基本权利以及基于算法人工智能系统的决策的程序合法性。\n\
  \n### 程序合法性之争\n规范算法系统的选择的合法性是一个非常重要的问题，它支撑着公众对技术的参与和信任。规则的合法性的一部分在于必须执行它的人的接受度。正如哈贝马斯所回顾的那样，“法律被要求作为政治调节和社会结构手段的程度越高，民主起源的法律必须承担的合法性负担就越大”\
  \ (Habermas, 1997)。\n\n规则必须在不同的对话场所和讨论论坛之间流通。这将使我们能够假定规范内容的理性性和被同意的性质 (Chevallier,\
  \ 2005)。因此，规范的合法性仍然取决于一个保证其社会可接受性的讨论过程。必须“公民能够随时将自己视为其所受法律的作者” (Habermas, 1997)。因此，挑战在于建立正式程序，以实现算法的真正社会可接受性。法律在这里找到了其应有的位置。\n\
  \n### 迈向算法的社会可接受性\n\n#### 法律的作用\n许多伦理宪章、宣言和其他“硬法”文本已出台以规范算法。我们的目标不是做一个回顾 (CAHAI\
  \ Secretariat, 2020)，而是质疑在这些各种文本中为算法合法性问题保留的位置。如前所述，这一问题对于充分把握以人为中心的人工智能的概念至关重要。然而，这一考量往往被忽视：辩论更集中于信任、伦理或责任等问题。合法性很少被提及。然而，公众辩论也必须从合法性的角度审视人工智能系统是至关重要的，因为算法统治是一个非常现实的动荡源：欧洲当局认为技术可能凌驾于基本权利的风险，因为“*鉴于某些应用或*\
  \ *人工智能的* *使用的侵入性*，可能出现当前关于人权、*民主和法治的* *框架不足以保护我们，或保护不及时*” (Council of Europe Study,\
  \ 2020)。因此，如果我们希望将公民置于问题的核心，就有必要就算法监管展开公众辩论。\n\n算法的社会可接受性首先可以通过法律规则实现。可以提出几种方法：传统上，我们可以在算法系统创建之后保障权利（章节“从基于风险的方法到基于权利的方法”）。我们也可以提出更具创新性的程序，在算法设计阶段就让公民参与：一种基于公民参与的自下而上的方法似乎是一个非常鼓舞人心的提议（章节“公民参与程序”）。\n\
  \n##### 从基于风险的方法到基于权利的方法\n\n###### “基于风险的方法”的局限性\n人工智能的监管正在我们眼前建立。欧洲议会和理事会关于人工智能协调规则的法规提案\
  \ (European Commission, 2021b) 旨在基于风险的方法来规范人工智能系统。该提案被视为一项法律和象征性的进步，使算法摆脱“无法无天”。尽管具有创新性，文本远非完美并引发担忧：事实上，提案的起点是人工智能系统，根据其风险进行分类，而不是人。个人维度，即权利和自由，并不是文本的锚点：无论是终端用户、单纯的数据主体，还是受人工智能系统影响的其他个人，提案中对受人工智能系统影响的人的任何提及的缺失都显得是一个盲点\
  \ (Teller, 2022b)。 欧洲数据保护委员会（2021） 对这种以技术为棱镜而牺牲个人的做法表示遗憾。\n\n###### 另一种方式：“基于权利的方法”\n\
  “基于权利”的监管 (Castets-Renard, 2020) 使法律能够重新回到算法统治问题的中心。目标是突出人工智能系统对基本权利构成的风险，远不止个人数据泄露\
  \ (Kaminski and G. Malgieri, 2019)。这一主题足够严肃，足以证明提出新权利和新的监管方法以保证算法系统的“可质疑性”的合理性。已提出若干建议，我们可以提及其中一些：设立国家审计平台，在独立公共机构的监督下测试代码；使用能够允许反事实评估的统计工具；最后，在任何算法流程投入流通之前推广影响研究机制。\n\
  \n###### 数字原则提案\n最近，欧洲委员会提出了一套数字原则框架 (European Commission, 2022)。这一方法很有趣，显示出方向的转变：立法者瞄准的已不再是市场或数据，而是个人。这将赋予公民新的权利，例如获得高质量连接、足够的数字技能，以及公平和非歧视的在线服务。这些原则将在广泛的社会辩论的背景下讨论，并可能由欧洲议会、理事会和委员会通过庄严的机构间宣言予以载入。\n\
  \n\n\n\n\n### 算法可解释性\n权利的执行需要对算法流程进行上游理解。正因如此，我们认为权利与原则的方法应辅以算法可解释性的一般原则，该原则整合了多个维度，包括可解释性和可审计性。这些概念源自工程学（Desmoulin-Canselier\
  \ & Le Métayer, 2020），并且不应与透明度混淆，透明度只是通过提供算法源代码来理解算法结果的一种（非常不完善）方式。可审计性表征了对算法进行分析和实证评估的实际可行性，其目标更广泛，不仅是为了对其预测提供解释，还为了根据其他标准（性能、稳定性、数据处理）对其进行评估。\n\
  \n专家仍在争论“可解释性”与“可解释性”之间的区别：“可解释性”概念通常与对算法如何工作进行技术性和客观的理解相关联（因此适用于审计参与的视角），而“可解释性”概念似乎更与技术性较弱的论述相关联（因此更适合面向消费者或个人）。算法可解释性的质量也取决于上下文。因此，要解释算法\
  \ `how` 工作以及 `why` 它做出此或彼决定，可以考虑多个解释层级，以兼顾接收者的性质（专业人士、客户、公众）。\n\n### 公民参与程序\n我们能否更进一步，超越主观权利的逻辑（赋予权利），让公民参与算法治理？这一提议可能令人惊讶，但美国学者（Desai\
  \ & Kroll, 2018）提醒我们，这种方法可能是有益的：在金融安全领域，立法者通过 2002 年的《萨班斯-奥克斯利法案》制定了规范举报人的程序。其目标是通过提供支持给检察机关，举报被认为非法的行为，从而鼓励私人行为者确保法律的正确适用（Desai\
  \ & Kroll, 2018）。在人工智能领域，该提议将包括依靠算法用户，不是为了举报缺陷，而是建立讨论程序，让他们参与其中（Castelluccia & Le\
  \ Métayer, 2019）。\n\n鉴于其对社会可能产生的重要影响，算法决策必须成为公共辩论的一部分。学者们开始反思确保高质量辩论的良好治理原则：这些讨论程序必须让所有利益相关者参与，包括各学科的专家、政策制定者、专业人士、非政府组织和公众。它们必须严格进行，并首先提出算法解决方案使用合法性的问题。\n\
  \n在某些情况下，可以考虑原则上禁止，在明显侵犯基本权利的情况下（Hannah-Moffat, 2013）（如公正审判和无罪推定）。这些提议听起来很有趣，但在实践中能否经受住考验？从这一角度来看，实地观察至关重要，有两个正在进行的项目值得提及：`CITICODE`\
  \ 项目和 `FARI` 研究所，两者都是布鲁塞尔计算机科学家 Hugues Bersini 发起的公民参与实验的实验室。\n\n#### CITICODE 和\
  \ FARI，公民参与的实验室\n“`算法必须保持开放，完全处于公共领域，使得理想情况下，每个人都可以保留自己的发言权和自己的代码行，即使笨拙，也可以编写`”\
  \ (Bersini, 2023)。将理论与实践相结合，Bersini 教授启动了 `CITICOD` 项目，该项目具体化了公民大规模参与软件设备开发。\n\n\
  该实验之所以有趣，是因为它使得能够确定适用于公民参与算法编写的治理规则。考虑了三个连续过程：选举过程（`谁可以参与该软件的编写以及如何参与？`）；教育过程（`如何让公民既掌握良好并详细理解问题，又掌握算法方法？`）；审议过程（`当其更新和持续改进至关重要时，如何进行这些代码的开发和维护？`）。\n\
  \n第二个实验是 `FARI` 研究所，\n\n这些项目有一个共同点，即代表制民主运作方式的重塑，其中定义它的三种权力必须在算法统治的光照下重新思考。这最终预示着“一种新的立法权力形式，通过这种形式，普通公民在专家（包括律师）和一些民选官员的陪同下，将质疑直到其软件体现的新强制机制，使社会能够更和谐地运作。”\
  \ 有必要仔细关注这些正在进行的实验的结果，它们开创了从算法统治向算法民主的真正过渡的前景。\n\n总之，我们认为，未来共同生活的状况将密切取决于引入新技术，特别是人工智能的条件的包围。共识和集体审议必须保持强大的价值观，不应在技术设计中消解。应认真考虑更好地适应人工智能用户的意愿和同意。这一方面对于定义以人为本的人工智能的概念至关重要，该概念旨在让个人参与算法决策过程，让他们有机会参与辩论、做出选择并表达自己。\n\
  \n### Notes\n1. “Indeed，对行为者相对于受影响人员施加的义务应更具体地源于对个人及其权利的保护。因此，EDPS 和 EDPS 敦促立法者在提案中明确说明受人工智能系统约束的人员可获得的权利和救济。\"\
  ]\n2. 有关这些提案的更详细分析，请参阅 Teller (2020b)。\n3. 提出四项提案如下：(1) 具有数字技能的公民和高度合格的数字专业人员，(2)\
  \ 安全、高效和可持续的数字基础设施；(3) 企业的数字化转型；以及 (4) 公共服务的数字化\n4. 这种方法由 ACPR (2020) 提出。根据受众的不同，解释将是简单、功能性的或技术性的。\n\
  5. 参见 `https://fari.brussels/` FARI 将很快通过公民小组征求公民参与，这是一个平台，公民不仅会被征求意见，还会被要求积极、定期参与不同的人工智能项目。\n\
  6. “我们必须决定，思考并编写所有人都知道的代码行，这些代码将帮助我们更好地生活。这就是为什么我提议并捍卫一种新的治理形式，在这种形式中，公民必须从一开始并在整个过程中参与编写本应约束和界定其行为的代码。这无疑是保证这种日益侵入性软件在我们出行组织和安全、我们子女学校选择、税收再分配和犯罪预防中的合法性和接受度的唯一途径”\
  \ (Bersini 2023)。\n\n### References\n\n\n\n\n\n### 参考文献\n\n* ACPR (2020). 金融部门人工智能算法的治理。\n\
