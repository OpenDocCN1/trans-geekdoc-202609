  \n未来地球加拿大，蒙特利尔，魁北克，加拿大\n\nDOI: [10.1201/9781003320791-14](https://dx.doi.org/10.1201/9781003320791-14)\n\
  \n人们普遍认为，气候变化、生物多样性丧失和土壤退化等全球可持续发展危机已对人类和地球造成严重负面影响，且影响会随时间加剧。应对这些复杂且相互关联的问题并非易事。政府间气候变化专门委员会已明确指出，应对气候变化需要在社会的各个领域进行迅速且前所未有的变革（IPCC,\
  \ 2018），并且“迈向气候韧性社会的进程需要变革性或深层次的系统性变革” (Pathak et al., 2022)。昆明-蒙特利尔全球生物多样性框架明确阐述了减少生物多样性威胁的紧迫需求，例如逐步淘汰有害补贴并加强生物多样性可持续利用的激励措施\
  \ (CBD COP-15, 2022)。联合国粮食及农业组织警告称，由集约化农业实践导致土壤迅速退化，对全球各地粮食安全和生态系统构成巨大威胁 (FAO, 2022)。\n\
  \n人工智能（AI）和机器学习（ML）具有巨大的潜力来帮助应对这些问题，例如，通过自动化向可再生能源的转变、优化供应链管理、监测生态系统健康、预测极端天气以便及早应对，以及实现精准农业和综合农业投入管理\
  \ (Rolnick et al., 2019; McLennon et al., 2021)。一份最新报告还发现，AI 在治理中可以发挥重要作用，通过动员数据、优化策略、改变行为并赋能公民\
  \ (Sustainability in the Digital Age, Future Earth, & Climate Works Foundation,\
  \ 2022)。AI 有潜力成为可持续发展的变革性工具，并推动系统变革中最有力的杠杆（见 Figure 11.1），由 Donella Meadows 所述，聚焦于规则、权力动态和思维模式\
  \ (Meadows, 1999)。然而，如果治理不当，AI 以及作为 AI 子集的 ML 存在加剧不平等、侵犯隐私和安全权利以及加速环境退化的合理担忧 (Luers\
  \ et al., 2020; Bohnsack et al., 2022)。在农业领域，农民互联网接入不足、数据可用性和利益分配不均、难以大规模推广 ML 模型，以及发展中国家缺乏足够受过培训的人员来开发、部署和维护\
  \ AI 应用等进一步挑战，使得 AI 难以实现其变革潜力 (Delgado et al., 2019)。\n\n![Figure 11.1 Visualizing\
  \ how AI and other digital innovations can unleash agricultural systems change.\
  \ This mapping of digitally empowered governance strategies along Donella Meadows’\
  \ levers of systems change (adapted from Meadows, 1999; Luers et al., 2020) informed\
  \ the development of the DISA project. Digital strategies that prioritize participation\
  \ and empowerment have the strongest potential to bring about systems change.](img/fig11_1_B.jpg)\n\
  \nFigure 11.1 Visualizing how AI and other digital innovations can unleash agricultural\
  \ systems change. This mapping of digitally empowered governance strategies along\
  \ Donella Meadows’ levers of systems change (adapted from Meadows, 1999; Luers et\
  \ al., 2020) informed the development of the DISA project. Digital strategies that\
  \ prioritize participation and empowerment have the strongest potential to bring\
  \ about systems change.\n\n在 AI 在社会情境中的所有潜在应用中，仍需以目的性、同理心和谦逊的态度对待 AI 和 ML 的使用，并促进包容性创新\
  \ (Ubalijoro et al., 2023)。这是必要的，以确保这些工具能够回应真正的社会需求并强调责任和包容性，遵守可持续发展目标的核心承诺“不让任何人掉队”\
  \ (United Nations System Chief Executives Board for Coordination, 2016)。以人为本的人工智能（HCAI）概念推动了此类方法。虽然学术界对定义尚未达成共识，但在实践中\
  \ HCAI 越来越被视为应对利益相关者群体多样化需求和期望的重要因素 (Chancellor et al., 2019)。\n\n在本章中，我们将 HCAI\
  \ 理解为一种开放、包容和参与式的 AI 设计和使用方法，它承认人类在确保技术以造福人类和地球的方式负责任部署中的作用（同上；Shneiderman, 2020）。明确地说，我们探讨了\
  \ HCAI 的四个指导原则——包容性数据管理、稳健的 AI 应用、对合作伙伴、项目和技术的信任，以及问责制体系。然后我们介绍了数据驱动的可持续农业洞察项目（DISA），该项目利用\
  \ ML 和 HCAI 方法支持卢旺达小农向再生农业转型。我们的目标是强调这些指导原则在该用例中的具体实践，并分享可更广泛应用于可持续发展和农业领域 HCAI\
  \ 设计时的经验教训。\n\n### 社会情境下 HCAI 的指导原则\n\n\n\n\n\n在应用的、社会情境中将 HCAI 付诸实践，需要在项目的早期阶段投入大量时间。HCAI\
  \ 必须包容多元观点，并在设计阶段起就提升边缘群体的声音。与一线利益相关者互动有助于促进人工智能开发者之间的理解以及相关社区内的学习，共同测试和共同开发数字工具，并对项目活动进行情境化并清晰传达（Sustainability\
  \ in the Digital Age, Future Earth, & ClimateWorks Foundation, 2022; Chuard et al.,\
  \ 2022），同时始终遵循 HCAI 指导原则。\n\n本文讨论的四项 HCAI 指导原则并非旨在全面，也并非相互排斥。相反，它们是从文献中涌现出的相关、可操作且相互关联的原则，可以为可持续性和农业这一复杂领域中的\
  \ HCAI 铺平道路。\n\n##### 指导原则 1：包容性数据管理\n\n机器学习模型的准确性取决于用于训练、评估和测试的数据质量。因此，收集、存储和使用数据的过程必须经过深思熟虑，才能使人工智能开发过程被视为以人为中心。学习不同框架、准则和原则对于促进以人为中心的有效和合乎道德的数据管理非常重要。由学术界和工业界利益相关者创建的\
  \ FAIR 原则指出，数据和数字资产应可发现、可访问、可互操作和可重用（Wilkinson et al., 2016）。作为对 FAIR 的批评回应，国际原住民数据主权利益集团制定了原住民数据治理的\
  \ CARE 原则——集体利益、控制权、责任和伦理（Research Data Alliance International Indigenous Data Sovereignty\
  \ Interest Group, 2019）。这些原则强调尊重所有相关利益相关者的权利和利益（Carroll et al., 2020）。全球农业与营养开放数据（GODAN）行为准则推进了一个共同设计的伦理框架，以促进农业数据负责任共享，涵盖数据隐私和安全、知识产权、数据质量和数据可访问性等议题（Ubalijoro\
  \ et al., 2021），这在国家法律缺失的情况下尤为关键。以尊重原住民和社区的权利、利益和价值观的方式推进人工智能的负责任发展也至关重要（Lewis et\
  \ al., 2020）。有趣的是，“17 Rooms Initiative” 的第 9 间室召集了一组数据科学家、发展专家和当地利益相关者，包括合著者 Éliane\
  \ Ubalijoro，他们原型化了一个数字数据合作社，并正在开发一份配套指南，支持数字资产的创建和所有权，以增强价值和自主权。\n\n#### 指导原则 2：稳健的人工智能应用\n\
  \n基于可访问和可复制的算法（Pineau et al., 2020）开发稳健的人工智能应用，其底层架构和假设对开发者和终端用户而言清晰可知（Margetis\
  \ et al., 2021）至关重要，鉴于算法输出可能产生的影响（Dietterich, 2017; Buolamwini et Gebru, 2018）。正如我们所知，人工智能完全依赖于用于训练算法的数据——数据必然是对现实的抽象化和有偏见的表征（LeCun\
  \ et al., 2015）。这些数据集往往缺乏足够的稳健性，无法让模型在所有场景下提供一致、高质量的输出。可以理解的是，机器学习模型预测中的错误会削弱信任；然而，这些错误很容易被忽略，因为可能出现的错误种类繁多而难以检测。一个例子是仅训练用于在农田中检测牛的计算机视觉算法。由于该数据集缺乏牛在其他位置的示例，算法推断农田是与牛的存在（或不存在）相关的重要特征（Beery\
  \ et al., 2018）。虽然牛可能不常出现在海滩环境中，但评估机器学习模型泛化到训练数据集之外的能力很重要，以确定其是否能在尽可能多的情境和条件下得出准确结论。更全面的系统随后可以指导机器学习科学家改进稳健性、评估部署、监控错误并随时间评估性能。\n\
  \n### 指导原则 3：对合作伙伴、项目和技术的信任\n\n在项目中参与和受影响者之间建立信任是 HCAI 的关键组成部分。这意味着建立对项目目标和流程的信任，以及对每个团队成员以集成、透明的方式交付其部分工作的相应能力的信任（Osburg\
  \ et Lohrmann, 2017; Schulz et Feist, 2021）。在训练机器学习模型之前，进行信任建设练习很重要，以促进公平、放大边缘群体的声音并赋能当地利益相关者。这些活动应确保所有相关利益相关者具备必要的理解能力，并能有意义地参与项目（Chuard\
  \ et al., 2022; Colfer et Prabhu, 2023）。这使得数字工具能够通过跨学科见解的整合而共同创造。另一个信任建设的机会来自于对数据集的优势和局限性的认识（Druce\
  \ et al., 2021），因为对算法性能能力及其适用条件的透明度，可以在工具部署周围建立一种审慎态度，从而随着时间的推移建立信任。信任可以通过在项目开发生命周期中建立可靠性、一致性（Lankton\
  \ et al., 2015）和敏捷性（Lien et al., 2021）来维持。\n\n### 指导原则 4：问责制体系\n\n\n\n\n\n问责制是 HCAI\
  \ 的关键组成部分，但实施问责制的方法尚未得到广泛研究。虽然 HCAI 的大量文献将问责制等同于透明度（例如，Lepri 等，2021），但数据、知识和方法方面的透明度可能不足以确保问责制（Gupta\
  \ 等，2020）。提高透明度确实有可能增强问责制，但在缺乏适当保障措施的情况下也可能带来风险（Luers 等，2020）。实施有意的问责制体系有助于解决透明度自动导致问责制的误导性假设。去中心化的问责结构通常更具响应性、包容性，并使当地合作者能够自主运作（Shah，2004）。非等级制的问责网络可以促进对问责制不同视角的共同理解并增强沟通（Bäckstrand，2008）。数据管理中的问责制与隐私和开放科学尤其相关（Young\
  \ 等，2019）。机器学习社区正在涌现新的工具来促进透明度和问责制，例如数据集的数据表（Gebru 等，2021）和用于模型报告的模型卡（Mitchell 等，2019）。这些工具有助于对数据进行情境化，使预期用途和局限性明确，并识别数据收集者。许可也可以增强问责制并在开源社区中标准化实践（使用各种可用的许可证，例如来自开源倡议）。\n\
  \n### 人本人工智能实践：数据驱动的可持续农业洞察项目\n\n为了说明这些原则的实际应用，我们介绍了一个于 2021 年启动的项目，即数据驱动的可持续农业洞察，或\
  \ DISA。目前，DISA 专注于卢旺达的小农户，他们占全国农户的 77.2%，大部分生活在每天不到 5 美元的收入水平（World Bank，2016）。在这种背景下，至关重要的是不仅要了解所面临的物理环境问题，包括土壤健康、生物多样性保护、水资源利用和温室气体排放，还要了解社会、文化和经济需求。\n\
  \nDISA 由来自 Future Earth Canada、Sustainability in the Digital Age、Mila—魁北克人工智能研究所、卢旺达综合发展区域研究中心、Planet\
  \ Labs 和 Leapr Labs 的合作伙伴财团领导，并在魁北克研究基金和 ClimateWorks Foundation 的支持下开展。DISA 项目团队是一个跨学科的领域专家团队，学科包括人工智能/机器学习、地理信息系统、农业和气候变化。DISA\
  \ 的目标是支持从资源密集型和掠夺性农业模式向知识密集型模式的转型，以推动气候韧性、净零和自然积极的经济。DISA 解决了为支持政策和投资框架的制定而需要强有力的数据驱动证据的需求。采用\
  \ HCAI 方法，DISA 项目团队正在努力将基于卫星图像训练的机器学习洞察与本地知识相结合，以建立卢旺达再生农业可行性的证据基础，目标是扩展到非洲其他地区。截至撰写时，已通过对\
  \ 815 个小农场的调查收集了地面实况数据。机器学习算法的开发正在进行中，用于划定农场边界的算法几乎已完成，用于检测再生农业实践的算法预计在未来几个月内推出。\n\
  \n#### 项目开发\n\n从最早阶段开始，DISA 就采用了参与式研究方法，符合 HCAI 的指导原则。该项目源于为期两年的协商过程，该过程建立在 Reimagining\
  \ Climate Governance 框架之上，该框架通过与全球近 100 名合作者的协商制定（Sustainability in the Digital\
  \ Age，Future Earth，& ClimateWorks Foundation，2022），以及促进数据使用以改善农业和粮食系统治理的工作（de Beer\
  \ 等，2022）。图 11.1 形象化了利用人工智能和其他数字工具来参与和赋能社区的重要性，其中参与和赋权有可能推动系统变革的最具影响力的杠杆。DISA 强调需要赋予小农户实施再生农业和利用数字工具所需的知识和技能。DISA\
  \ 团队正在努力为再生农业建立所需的严格数据驱动证据基础，并支持协调用于描述再生农业实践的不同术语，包括自然农法和保护性农业。\n\nDISA 的初始阶段涉及广泛的知识交流，由合著者\
  \ Éliane Ubalijoro 共同领导，以了解小农户面临的问题。这包括世界银行、GODAN 和 Rythu Sadhikara Samstha（安得拉邦政府）于\
  \ 2020 年 7 月 27 日举办的联合网络研讨会，旨在分享有关再生农业的知识。该网络研讨会旨在使这一知识为卢旺达的农民和政策制定者所用，尤其是在 COVID-19\
  \ 和气候变化带来的挑战背景下（India-Rwanda Knowledge Exchange on Natural Farming，2020）。在 2021\
  \ 年，Future Earth 支持非洲粮食主权联盟（AFSA）开展了一系列农业知识交流，交流对象为安得拉邦社区管理自然农法计划（APCNF）和非洲利益相关者，这促成了一个组织实践社区的发展。超过\
  \ 50 个代表非洲农民的组织参与了这些交流，他们听取了印度同行的证词，后者已转向再生农业。\n\n#### 应用四项指导原则\n\n##### 指导原则 1：包容性数据管理\n\
  \n农业的环境和社会问题因可用数据的限制以及关于可用数据如何管理以及用于何种目的的问题而加剧。由于该项目涉及获取大量包含有关农民、农场、作物和动物的敏感信息的數據，保护所收集数据的个人隐私至关重要。为了确保这些数据在项目期间及之后始终保持安全并免受潜在滥用，DISA\
  \ 的数据管理和治理计划以人为中心，基于前面强调的框架和行为准则。在公开分享项目成果以在卢旺达扩大工作规模至关重要与维护小农户隐私之间取得平衡是一个挑战，小农户的数据对于建立再生农业实践的证据基础至关重要。因此，明确向农民说明这一平衡并确保他们同意其数据的使用方式非常重要。通过这种方式，DISA\
  \ 团队将数据管理与实际项目设计相结合，使小农户的声音能够指导数据的收集和使用，将他们的福祉作为首要任务。\n\n##### 指导原则 2：稳健的 AI 模型\n\
  \n\n\n\n\nDISA 采用包容性的方法创建我们的数据集，使用来自全国各地的多样化数据点，并与当地农民合作收集。地面实况数据是通过在卢旺达由调查员进行的面对面\
  \ extensive 调查收集的。调查的开发是一个迭代过程，历经数月的磋商。这段时间被用来解决 DISA 的“鸡生蛋蛋生鸡”困境，例如 ML 团队在没有看到一些数据并进行测试之前，很难准确确定需要训练模型的信息，而其他团队成员则需要了解\
  \ ML 方面所需的信息，以便设计调查中包含的问题。同时也需要时间来支持 ML 团队充分理解当地背景，并在再生农业的使用方面建立直觉。\n\n调查收集了来自 APCNF\
  \ 采用的再生农业九项原则的信息（AFSA et APCNF, 2022）以及感兴趣的产出，如土壤肥力和土壤侵蚀。这些数据点被 ML 团队用来确定再生农业实践在规模上的程度。DISA\
  \ 团队将首先使用地面实况数据来训练 ML 模型，以识别再生农业的九项原则并将这些实践与产出变量相关联。该过程将涉及参与式研究，以确保 ML 模型产生与农民需求相关的可操作见解。在短期内，这些见解包括作物产量预测和对极端天气事件的韧性信息。下一步，DISA\
  \ 团队有兴趣探索创新的方法来绘制土壤有机碳图，该方法结合了遥感数据、机器学习模型和土壤光谱学（Vågen et al., 2018），以支持小农获得碳融资。\n\
  \n### 指导原则 3：对合作伙伴、项目和技术的信任\n\n在 DISA 的讨论中，始终围绕着就实现共同商定目标的最佳前进路径达成共识展开，这与 HCAI 的一个主要方面一致——通过合作和多样性建立信任。项目核心团队在数月内定期举行会议，锻造了牢固的伙伴关系，并使团队成员能够通过对话建立相互理解并使项目愿景和价值观保持一致。与其他组织的长期而有意义的接触，包括政府官员、当地非政府组织、私营部门组织、学术机构和资助组织，有助于建立信任并促进核心团队之外的创新合作。建立信任的一个主要挑战是为此所需的时间寻找资金，这一点至关重要，但可能被低估（Sustainability\
  \ in the Digital Age, Future Earth, & ClimateWorks Foundation, 2022）。\n\n与小农合作，DISA\
  \ 团队旨在通过能力建设和知识交流支持持续的学习机会。培训培训师项目，借鉴 APCNF 的积极经验，有可能在以受信任的当地模范农民为先导的情况下，随着时间的推移支持向再生农业实践过渡的指数级增长。最终，随着农民体验到再生农业的积极影响，我们希望这种信任会继续增长。\n\
  \n### 指导原则 4：问责制体系\n\nDISA 团队开始通过数据管理框架探索问责制体系，该框架优先考虑隐私和同意，并考虑到在与来自更边缘化社区的利益相关者互动时相关的权力动态。在收集地面实况数据时，由当地调查员口头提供一份针对小农关切和能力的知情同意书，并获得了卢旺达国家统计研究所的调查许可。该团队现在正在探索创建去中心化问责网络的选项。该网络将涉及一个清晰的非等级结构，涉及项目所有阶段的合作伙伴和相关利益相关者，借鉴治理文献中的关键见解（Shah,\
  \ 2004；Bäckstrand, 2008）。建立这种网络化安排的一个关键组成部分是与所有相互问责的群体建立信任关系。\n\n能力问题带来挑战，因为不可能对\
  \ 815 个受访农场的小农进行培训，使其能够批判性地评估 ML 算法的开发。在短期内，团队成员将从小农代表那里收集迭代反馈，针对 ML 研究和开发管道不同阶段的有针对性问题。例如，用当地农民团体验证边界检测算法是否按预期工作。DISA\
  \ 还与经验丰富的当地合作伙伴合作，他们可以帮助建立信任并确保问责（Sustainability in the Digital Age, Future Earth,\
  \ & ClimateWorks Foundation, 2022），包括当地农业非政府组织 Bridge2Rwanda、卢旺达农业委员会的农艺师以及农民合作社成员。共同创建和实施一个共享且可访问的基于网络的问责制体系，在可能的情况下明确成功指标，将是推进\
  \ DISA 项目中 HCAI 的下一步。\n\n### 结论\n\n前所未有的环境挑战正在创造集体行为改变的需求。在这种背景下，AI 可以成为一种有用的工具，为激励政策响应和行为改变所需的证据创造依据。HCAI\
  \ 是一种重要的方法，以确保 AI 开发具有包容性并从不同视角纳入适当的指导原则，尽管挑战仍然存在。\n\n实施 HCAI 的关键挑战是在项目所有成员之间建立和维持信任。这要求项目合作者在项目甚至开始之前定期和有意义地参与，有时需要数月时间，以讨论角色和责任的分工，并就他们希望如何合作达成一致。虽然对\
  \ HCAI 成功指标的讨论超出了本文的范围，但在项目早期共同制定 HCAI 的明确计划并将组成部分与可衡量的结果联系起来，为进一步加强信任和问责提供了更多机会。这些是未来采用\
  \ HCAI 方法的项目需要牢记的关键点。\n\n\n\n\n\nThe Reimagining Climate Governance in the Digital\
  \ Age initiative recognizes the need to integrate fragmented approaches across scales\
  \ to accelerate collective climate action and provide insights on creating sustainable,\
  \ inclusive climate solutions. It is critically important to deeply integrate the\
  \ cultural and social contexts in which technologies are developed and deployed\
  \ (Sustainability in the Digital Age, Future Earth, & ClimateWorks Foundation, 2022).\
  \ The field of AI is advancing rapidly, including developments like ChatGPT, for\
  \ example (OpenAI, 2023), but there is a need to amplify insights and accessibility\
  \ from the Global South, currently underrepresented due to biases and lack of training\
  \ data from certain countries. Furthermore, inclusive access to information and\
  \ emerging technologies that serve the needs of real people will be critical to\
  \ ensure that innovations in AI do not further deepen the digital divide but instead\
  \ contribute to bridging it (Ubalijoro et al., 2023). Future research is needed\
  \ to integrate insights from governance in adapting and evaluating guiding principles\
  \ for data stewardship, robustness, trust, and accountability into actionable, context-specific\
  \ frameworks. Sharing the work done in DISA to date and highlighting the challenges\
  \ faced is intended to assist others seeking to leverage HCAI for sustainability\
  \ and agriculture.\n\nDISA’s goal is to advance the exploration of outcomes of the\
  \ Reimagining Climate Governance in the Digital Age initiative to pave the way for\
  \ meaningful impacts on people and the planet in line with the 2030 Sustainable\
  \ Development Goals and COP15’s Kunming-Montreal Global Biodiversity Framework Target\
  \ 18, which calls for the elimination, reformation, or phasing out of harmful incentives\
  \ and subsidies for biodiversity in a way that is proportionate, just, fair, effective,\
  \ and equitable. Taking a human-centered approach to the use of AI in DISA is the\
  \ foundation of ensuring that this goal is achievable.\n\n### References\n\n* AFSA\
