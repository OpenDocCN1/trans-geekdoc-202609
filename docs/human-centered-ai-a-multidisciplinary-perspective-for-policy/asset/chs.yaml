  \n### 背景\n\n本书项目由蒙特利尔大学的学者 Catherine Régis 和 Jean-Louis Denis 发起，他们是 HAICU Lab 的联合负责人，以及大阪大学的学者\
  \ Atsuo Kishimoto，他是该实验室的成员之一。从一开始，他们就得到了 Maria Axente 的加入，她是英国负责任人工智能在工业领域的一位先驱实践者。HAICU\
  \ Lab 由世界大学 U7+ 联盟创立，该组织包括来自 6 大洲 20 个国家的 45 多家机构。实验室的使命是鼓励学术界与公共机构、企业和民间社会组织之间的合作。其目标是针对人工智能在社会中实施所带来的重大挑战和机遇，开发以人为本的应对措施——本质上，促进\
  \ `human-centered AI (HCAI)` 的创造和应用。\n\n本书的创作历时 16 个月。国际征文征集于 2022 年 3 月启动，并通过各种渠道传播。入选作者于\
  \ 2022 年秋季开始撰写其文章。投稿人受邀参加于 2023 年冬季举行的在线研讨会。这些论坛为与会者提供了提供和接受同行反馈的机会，并在他们各自的视角下交流关于\
  \ HCAI 作用的想法。在随后的几个月里，作者们——来自加拿大、法国、意大利、日本、新西兰、英国等 12 多个国家，以及计算机科学、教育、法律、管理、政治学、社会学等\
  \ 12 多个学科——撰写了论文的修订稿并收到了同行评审意见。因此，本书中体现了不同的学术传统和探究与论证方法。\n\n\n\n\n我们为本书增添了一系列与关键机构参与者的访谈（如\
  \ Partnership on AI 首席执行官 Rebecca Finlay；Mastercard Foundation 创新教学与学习中心主任 Joseph\
  \ Nsengimana；或为工会和政府提供服务的咨询公司 The Why Not Lab 主管 Christian Colclough），以丰富我们对各章节中探讨的人工智能的多种含义的理解，以及对未来挑战和机遇的理解。这一补充旨在为\
  \ HCAI 增加另一层讨论，并鼓励新兴的 HCAI 科学与监管者、开发者和各活动领域用户之间的互动讨论。最终手稿于 2023 年 7 月提交给出版社。\n\n\
  ### 人工智能的重要性\n\n我们周围的信息环境正因数字化与数字转型而迅速扩张。为了应对这一新的信息环境，人工智能已成为对信息进行分类、组织和快速识别我们所需内容的不可或缺的工具。然而，关于以往由人类执行的任务在多大程度上应或能被托付给人工智能的争论仍在持续。我们必须持续保持意识并反思我们将哪些责任委托给人工智能，哪些责任我们保留下来。特别是，我们对高风险决策，例如招聘、录取、贷款决策和法庭裁决完全交由机器数据处理的做法一直非常谨慎。已经观察到人工智能仅仅因为数据可用就被应用，而未考虑其对数据主体的益处。在这些情况下，“以人为中心的人工智能”概念应运而生，成为一种引人注目的方法。\n\
  \n各种策略和指南都强调了 HCAI 作为一个至关重要的目标。经合组织于 2019 年制定的五项原则中的第二项是“以人为本的价值观与公平”，其主张“人工智能行为者应在人工智能系统生命周期内尊重法治、人权和民主价值观”。在欧洲，人工智能高级别专家组于\
  \ 2019 年发布了《值得信赖的人工智能伦理准则》，其中宣布人工智能系统必须以人为中心。七项“值得信赖的人工智能”要求中的第一项是“人类自主与监督”，涵盖基本权利、人类自主和人类监督。此外，2018\
  \ 年发布的《蒙特利尔人工智能负责任发展宣言》将其十项原则锚定在人类福祉和尊重自主权的观念上，这与以人为中心的人工智能的理念深度共鸣。\n\n到 2020 年左右，全球、国家和企业层面已制定了众多人工智能伦理指南和原则。近年来，重点转向将这些原则转化为研究人员和员工日常实践。原则与实践之间的差距，通常被称为“实施差距”，是本书多章讨论的话题。如本介绍后面所述，实现\
  \ HCAI 在实践层面的具体条件在书中各处都有讨论。\n\n自 2022 年中以来，由于各公司发布了文本到文本、文本到图像和文本到音乐的生成式人工智能模型，人工智能变得显著更容易获取。现在，即使没有编程技能的个人也能利用人工智能生成文本和图像。生成式人工智能的快速普及迫使我们重新评估\
  \ HCAI 的概念。直到最近，人工智能技术主要通过预测和识别等任务来提高人类活动的效率，公众主要处于接收端。然而，生成式人工智能与以往的人工智能技术不同，它能够赋予普通人生成文本和图像的能力。虽然人工智能技术的这种民主化是一个积极的发展，但它也意味着潜在的滥用和误用的“民主化”。就此而言，需要更以人为中心的<|message|>\
  \ 设计。\n\n### 人工智能的定义和范围\n\nHCAI 的概念涵盖了众多方面，因此无法用单一、确定的解释来概括。一般而言，对 HCAI 的定义努力可分为以过程为中心和以结果为中心的方法。\n\
  \n以过程为中心的视角侧重于将人工智能置于人类控制之下。它强调尊重人类自主性和问责制的重要性，特别是在自动化决策以及欧盟《通用数据保护条例》 GDPR 中规定的“人类在环”原则方面。重点在于自主性和责任：人类可能会犯错，但只有人类才能为错误承担责任。\n\
  \n以结果为中心的观点欣赏人工智能系统满足人类需求和价值观或从人体工学角度来看用户友好的能力。这种视角与以人为中心的设计方法一致，该方法在产品和服务的设计中优先考虑终端用户。为了创建满足用户需求的产品，有利于在产品和服务开发的早期阶段就让潜在用户参与其中。因此，包容性的研发过程是必不可少的。即使以结果为导向，过程相关的人类价值观也很重要，而一种对人类以不可预测的方式不安全算法从\
  \ HCAI 的角度来看是不令人满意的。因此，过程和结果方法密切相关；关键区别在于哪个被视为目标，哪个是实现该目标的手段。最终，两者之间的区别可能不会显著改变为实现\
  \ HCAI 应强调的内容。\n\n#### 人工智能技术带来的潜在风险\n\n用于预测和识别的机器学习人工智能的开发过程如图 Figure I.1 所示。为了创建以人为中心的方法，正确收集训练数据至关重要，确保其无偏见，并审查模型的算法是否存在潜在偏见。还必须在高风险决策中引入人类监督，而不是盲目接受输出结果。例如，面部识别技术出现问题，当训练数据集中存在偏见导致算法偏见时，导致不同性别和种族的准确性差异，从而导致歧视性对待。作为回应，人们已努力重新评估训练数据、审计算法并限制某些面部识别输出的使用。\n\
  \n![Figure I.1 Flow diagram for the development of AI models used for prediction\
  \ and recognition.](img/figi_1_B.jpg)\n\nFigure I.1 Flow diagram for the development\
  \ of AI models used for prediction and recognition.\n\n对于生成式人工智能，图中的下半部分描绘了生成过程，该过程始于提示输入并以生成数据的创建结束。像\
  \ ChatGPT 这样的文本生成人工智能会产生模仿人类写作的句子，但在事实信息中已知会出现许多“幻觉”（即错误）。已经出现许多问题，因为输出被直接使用而未经过人工核实。还观察到此类输出往往反映并甚至放大现实世界的刻板印象和偏见。\n\
  \n#### 面向各利益相关者的 HCAI\n\n\n\n\n\n包容性的方法对于 HCAI 的实施至关重要，需要在治理中让多元化的利益相关者各司其职。同时，HCAI\
  \ 的概念和方针对广泛的利益相关者都有益处。通过其能动性，生态系统中的行动者影响着社会期望和社会规范将如何形成、推广或受到质疑，从而对 AI 生态系统内的决策和选择产生后果（Hallett\
  \ & Ventresca, 2006）。AI 生态系统的演变以及该领域创新发展的轨迹，是在多个分析层面——如社会、领域、组织和个人——的结构、活动和行动共同作用的结果（Scott,\
  \ 2013）。在这一生态系统中，权力与制衡权力（例如各群体施加的健康压力）是主要决定因素。在此我们探讨一些代表性利益相关者如何使用本书。\n\n### 政策制定者\n\
  \nAI 技术，包括生成式 AI，将继续进步并实施今天尚不可预测的技术。HCAI 的概念应适用于任何先进技术，并有助于制定法律、法规和使用指南，以及识别伦理、法律和社会问题。同时，HCAI\
  \ 还可以帮助政策制定者获得更准确的数据和预测；AI 分析和预测可以为政策决策提供依据，并帮助制定更有效的政策。\n\n### 行业从业者\n\n技术发展的速度往往超过法律和法规的修订。因此，仅遵守法律和法规是不够的。有必要不断地进行自我反思，评估业务活动是否符合\
  \ HCAI 的规范。为此，需要建立一个系统和适当的激励机制，使整个数据和技术生命周期都能够得到审查，从最初的内部研发审查到实施后的监控。本书的第二部分可作为参考，因为它为每个领域提供了单独的讨论。\n\
  \n### 研究人员\n\n随着生成式 AI 的普及，AI 产生重大社会影响的可能性日益增加，既有积极的也有消极的。HCAI 的方针可以有助于增强积极面并减轻消极面。研究人员必须将“以人为本”的概念纳入技术开发中，并评估\
  \ AI 的影响，提出合适的对策和缓解策略。对社会层面和伦理问题的研究可以提高 AI 技术的社会可接受性和可持续性。\n\n### 普通公众\n\n随着生成式\
  \ AI 的出现，普通公众成员可以成为 AI 的更积极使用者，而不仅仅是 AI 应用的被动接受者。因此，了解更多关于 AI、其机制和特征变得越来越重要。重要的是要知道，虽然像\
  \ ChatGPT 这样的聊天机器人可以用完整句子回应并且经过训练以模仿人类，但它们的行为可能并不像人类那样或不可靠。AI 素养也有助于最大限度地减少无恶意传播虚假信息的情况，并避免将\
  \ AI 系统拟人化。\n\n### 讨论的三个角度\n\n本书分为三部分。\n\n`Section I`，基础与定义部分，包含章节讨论并评估 HCAI 的众多含义，以及\
  \ HCAI 研究的主要趋势和方法。其中，`Vallor` 解释了负责任 AI 与 HCAI 之间的区别；阐述了 HCAI 是什么或不是什么的特征（例如讨论 ChatGPT\
  \ 是否是 HCAI 技术）；并解释了她为何对 AI 的未来“谨慎乐观”，同时批评了最近的工程文化。`Wójcik` 将算法不平等和社会排斥的根源归结于西方理性主义和个人主义观念，并认为\
  \ Ubuntu——一种将人的尊严置于人与他人和谐相处能力之上的撒哈拉以南非洲哲学——可能有助于构建 AI 的伦理和法律框架。`Bar Gil` 聚焦于推荐引擎——帮助管理信息洪流的机器学习算法。他以\
  \ Google 的推荐服务为研究对象，讨论 HCAI 对自我感知的关键概念的影响：自主性、主体性、理性和记忆。他的章节还简要讨论了生成式 AI。`Quintana`\
  \ 从用户体验的角度切入 HCAI。他审视了人类与机器之间以及伦理与用户体验设计之间的“交叉点”上的伦理挑战。`Larouche` 聚焦于将 AI 伦理转化为法律法规的方面。他首先指出了概念审查阶段的不足，然后讨论了立法行动阶段的挑战。近期关于\
  \ AI 的讨论在创新相关方面被组织为宽容与保护性方法的对比。最后，这些论点被应用于欧洲和加拿大的最新立法。`Malone` 从隐私的角度审视 HCAI，隐私是一个难以捉摸的概念。基于隐私概念的历史发展，作者审视了随着我们越来越多地让\
  \ AI 占据更多时间、注意力和信任，以及对 HCAI 的需求增加，隐私概念将如何发生变化。最后，`Pistilli` 讨论了通用大型语言模型（LLM），引用了若干伦理挑战并探讨了使\
  \ LLM 成为 HCAI 的潜在解决方案。在此过程中，强调了工程师与哲学家之间合作的必要性。综上所述，本书的 `Section I` 讨论了在各个领域考虑 HCAI\
  \ 实践时必须考虑的跨领域主题。它涵盖了算法不平等、推荐引擎、人机交互中的伦理挑战、将 AI 伦理转化为法律规范、隐私概念以及大型语言模型（LLMs）的最新发展等主题。\n\
  \n\n\n\n\n### 第二部分\n\n第二部分包含探讨不同群体和利益相关者在不同机构（司法系统、卫生系统、高等教育机构等）中 HCAI 的潜力和表征的章节。换句话说，它深入探讨了\
  \ HCAI 在社会活动特定领域中可能发挥的积极和消极作用。对 AI 生态系统的制度视角强调，技术发展及其在社会、组织和实践中嵌入的方式并非纯粹理性或对效率考虑的回应，而是由广泛的社会期望和规范塑造的（Hinings\
  \ et al., 2018）。激励结构、社会期望和规范是塑造新兴 AI 生态系统的重要因素。\n\nDaSilva、Denis 和 Regis 探讨了医疗保健领域，AI\
  \ 在该领域正日益在医疗保健系统的各个方面得到开发和部署。他们认为 HCAI 需要两种相互依存且相互作用的治理方法：（1）规范性方法，确保医疗保健行为者的利益在监管层面得到保护，以及（2）情境性方法，允许在实践层面理解、回应和适应这些利益。他们讨论了如何实际实施这一两步治理策略。\n\
  \nGarard 等人讨论了 HCAI 对可持续性和农业领域可能意味着什么，这对许多国家而言是一个非常重要领域。他们为此情境下的 HCAI 提出了四项指导原则：包容性数据管理、稳健的\
  \ AI 应用、对合作伙伴和技术的信任，以及问责制体系。他们以数据驱动的可持续农业洞察项目为例，展示了其建议的具体说明。\n\nOhya 解决了在司法领域，特别是司法系统实施\
  \ HCAI 的挑战。通过创造性的分析视角，作者解释了 AI 如何改变司法推理的基础，以及我们应要求 AI 系统在司法相关决策中具备什么，以确保尊重民主要求和基本权利。\n\
  \nLévesque 等人探讨了工作场所领域，AI 的变革性影响在该领域尚不确定且存在争议。他们提供了关于如何以 HCAI 促进更好工作的观点，包括提高工人的自主性。他们认为，除其他观点外，所有利益相关者都需要认真审视更好工作与更好社会之间的联系。通过日益增长的经济和社会不安全、技能退化以及无意义的工作而导致的失权，可能会对社会团结和民主造成破坏性后果。因此，需要制定改变激励措施并鼓励社会负责任创新的具体政策。\n\
  \nPoellhuber 及其同事讨论了 AI 在高等教育中的话题，该领域在生成式 AI 近期发布后一直处于许多公众辩论的前沿，展示了此类技术如何转变信息技能、方法技能和写作技能。具体而言，作者审视了\
  \ AI 在高等教育中具有重大潜力的三个领域：学习分析、自适应学习和生成式人工智能。对于这三个领域中的每一个，作者分析了它们增强教育体验的潜力，以及相关的局限性。\n\
  \n转向大学的具体现实，Mele 及其同事探讨了 HCAI 如何帮助大学推进他们确定的三个关键使命，即参与式教育、参与式研究和参与式社会。这种“参与式大学”将受益于基于\
  \ AI 的技术，通过研究和创新应对社会挑战，同时提高教育质量。\n\nKnott、Chakraborti 和 Pedreschi 深入探讨了备受争议且影响深远的社交媒体平台领域，AI\
  \ 在其中带来了众多机遇和挑战。他们解释说，AI 系统在社交媒体平台上主要运行两种类型：推荐系统和内容分类器。在这样的解释之后，他们最终将缺乏透明度确定为此类\
  \ AI 使用带来的主要问题，社交媒体平台必须将其作为优先事项解决，以确保其能够被视为以人为中心。\n\n最后，Rodriguez 接受了反思文化和艺术工作与\
  \ HCAI 之间相互作用的挑战，从名为 CHOM5KY vs CHOMSKY 的研究创作项目中汲取教训。在该项目中，访客与 AI 实体对话，以更好地理解 AI\
  \ 系统如何运作并重新思考其陷阱和机遇。本章以原创方式探讨了艺术工作在更好地传达 AI 现实以及培养人类探究、协作和创造技能方面的作用。\n\n总之，本书的第二部分提供了\
  \ AI 在一些关键活动领域可能发挥的挑战和机遇的部门性和跨部门性概述，并展示了 HCAI 不一定是“一刀切”的视角和方法，尽管存在一些强有力的共同特征，如与终端用户需求、权利和价值保持一致。它可以对情境敏感，因此需要根据其所嵌入的机构的独特现实及其相关行为者进行调整。\n\
  \n\n\n\n\n### 第三部分\n\n第三部分 包含关于经验教训和良好实践的章节，这些内容应为政策制定和政策创新提供参考。它涉及人工智能在各行业中 proliferate\
  \ 的公共政策影响。政策制定者在指导人工智能发展和确保人工智能应用与社会目标保持一致方面发挥着关键作用。此外，人工智能可以提升公共服务并放大政府和公共机构的政策能力。通过公共政策，可以实现人工智能的潜力。\n\
  \nDignum 和 Charisi 探讨了一个常被忽视的话题：人工智能如何做到以儿童为中心且尊重儿童，或他们所称的适龄系统。他们利用联合国儿童基金会开发或推广的框架和方法，提出依靠监管沙盒的生成潜力来支持面向儿童的人本中心人工智能的开发和部署。监管沙盒将基于证据的方法与社会和各部门固有的多元主义相结合，以创建人本中心人工智能。本章强调了为协助政策制定者开展工作而拥有相关且有效的工具和方法的重要性。\n\
  \nGentelet 和 Mizrahi 提出应摆脱当前广泛的规范性方法。他们建议放弃仅专注于改进技术本身的方法。在他们看来，去偏见人工智能需要认识到偏见和歧视是社会建构的。他们认为公民参与是确保人工智能保持以人为中心的解药。他们所说的公民参与基于保护和培育公民对能力的权利的需要。因此，用于规范人工智能的正确政策将基于确保真正和有效参与的战略和流程。再次强调，政策制定者拥有框架和方法来促进积极和生成的公民参与至关重要。\n\
  \nTeller 在她的章节中也倡导了类似的方法。分析欧洲委员会背景下的新兴法规，作者认为其基于风险的方法导致了一种自上而下的监管动态，对算法统治的力量无效。提出公众参与以提供法规的制定，使其受益于利益相关公众团体所发展的各种观点和看法。\n\
  \nPassalaqua 及其同事讨论了人工智能在塑造下一次工业革命中的作用。他们建议认真对待人工智能对工作的影响，并在人工智能在工业和制造业中发挥作用的复杂社会技术环境背景下评估人工智能。他们确定了工作场所人本中心人工智能的三个设计属性：工人或操作员的福祉、他们与技术的互动，以及系统绩效的贡献。他们提出一种以人为中心的设计方法，以支持在重大技术变革和转型背景下建立信任和人类能动性。建议在两个行业中应用该框架和方法。\n\
  \nZukeyama 等人研究了日本政府治理人工智能以造福公众和人类的方法。他们建议可以通过一种他们称之为敏捷治理的治理和监管的更新方法来实现人本中心人工智能。提出了敏捷治理的三个特征以促进人本中心人工智能：以目标为基础的监管而非以规则为基础的监管、多利益相关方对话，以及关注通过人工智能实现价值与人权发展之间的关系。最终，本章提出了一种政策制定者可以用来在各行业推广人本中心人工智能的方法。\n\
  \nKappenberger 和 Stuckenschmidt 也开发了一个以政策为导向的框架来规范人工智能。该框架基于在公共政策背景下识别人工智能及其使用的理想属性。框架围绕三个维度构建：前提层、过程层和产出层。该框架的应用可以支持实现三个理想的公共政策目标：提高效率、增强决策能力以及培育公民与政府的互动。提供了在交通监管领域应用该框架的案例。\n\
  \n最后，Axente 及其同事证明了三个实施差距解释了为什么包容性人工智能在组织中的采用并不更广泛：参与差距、转化差距和对话差距。他们的研究表明，要实现人本中心人工智能，采用企业需要建立并支持多元包容的团队；与广泛多元的利益相关者群体合作；并与其他组织分享最佳实践。\n\
  \n总之，本书的第三部分提供了资源，可帮助政策制定者在人工智能的大部分未探索的领域中航行。人工智能的不断 proliferate 和传播为政策制定者既带来机遇也带来挑战。一方面，人工智能可以增强政策能力。另一方面，人工智能可能带来需要适当监管的问题。无论情况如何，本节的章节都揭示了原则本身是不够的。框架、工具和方法对于正确规范人工智能、最大化其利益并最小化潜在风险是必要的。\n\
  \n我们希望读者会喜欢这本书。\n\n编辑，\n\nAtsuo, Catherine, Jean-Louis, Maria\n\n### 参考文献\n\n* Hallett,\
  \ T., & Ventresca, M. J. (2006). Inhabited institutions: Social interactions and\
  \ organizational forms in Gouldner’s Patterns of Industrial Bureaucracy. Theory\
  \ and Society, *35*, 213–236.\n* Hinings, B., Gegenhuber, T., & Greenwood, R. (2018).\
  \ Digital innovation and transformation: An institutional perspective. Information\
  \ and Organization, *28*(1), 52–61.\n* Scott, W.R. (2013). Institutions and Organizations:\
  \ Ideas, Interests, and Identities, SAGE.\n\n# 第一部分 人本中心人工智能研究中的意义、趋势和方法\n\n## 1\
  \ 定义人本中心人工智能 对 Shannon Vallor 的访谈\n\nShannon Vallor\n\n爱丁堡大学，苏格兰爱丁堡\n\nDOI: [10.1201/9781003320791-3](https://dx.doi.org/10.1201/9781003320791-3)\n\
  \n**你是以人为中心的人工智能领域的世界顶尖专家之一。你如何定义这一概念？人工智能要如何才算以人为中心？**\n\n我会将人本中心人工智能定义为由人设计、为人和与人共同设计，并且最终设计目标是促进人类繁荣的系统。这个定义中有多个组成部分，对吧？首先，技术的目标必须以人类为中心，具体来说是人们的*繁荣*以及人类作为人的利益。但过程也很重要。人工智能的设计、开发和部署需要由人类塑造和指导，这些人类牢记——并且与之对话——这项技术将与之互动的人类。\n\
  \n当然，没有技术不是由人类设计和开发的，但通常人类开发人工智能系统是为了让该系统服务于机构、经济、工业流程和市场。这本身并不是以人为中心的，对吧？所以仅仅让人类参与人工智能的设计和部署是微不足道的，因为所有技术都是以这种方式以人为中心的。人本中心人工智能真正关乎的是推动技术的人类与技术所指向中心的人类之间的对齐。\n\
  \n**人本中心人工智能的概念与其他在人工智能领域常用的概念有何不同？例如，它与“负责任的人工智能”有何不同？**\n\n\n\n\n\n显然这些理想之间存在相当大的重叠。但我认为它们的不同之处在于，责任的概念（这也是我现在正在研究的东西）在很大程度上关乎支撑例如社会信任的具体人际关系。因此，责任以及负责任的\
  \ AI 的概念，是关于人类使用他们手中的权力（或他们创造的权力）如何影响其他人的脆弱性——个人之间、人与组织之间、社区之间乃至更广泛的社会信任之间的关系。\n\
  \n我认为责任就是这样一种内在的社会实践，即赢得他人的信任，从而许可我们以可能影响他们的方式使用我们的权力。这是非常重要的一个话题，因为 AI 代表了人类手中一种新型的权力。它是一种影响着那些目前被排除在塑造技术过程之外的人的权力——那些人往往没有能力反抗、质疑或改革对他们有害的技术。概括来说，这就是负责任的\
  \ AI 的部分。\n\n我认为以人为中心的人工智能则更多不是关于社会信任和权力之类的东西，而是关于技术的目标、其最终目的。所以，以人为中心的技术是关于将整个技术生态系统与人类个体的健康和福祉相一致。对比的是，技术被设计用来取代人类、与人类竞争、或贬低人类，而不是被设计用来支持、赋能、丰富和强化人类。\n\
  \n这里重要的事情是，也要有一个恰当丰富的关于人类的概念。所以，有一些技术和 AI 系统，我们可能会认为它们是以人为中心的，因为它们的目的是在特定情境下提升人类表现。但如果在那种表现的另一端的人类，即我们试图用\
  \ AI 来增强的人，只是被当作我们想要提升其表现的其他机器对待，如果我们对他们完整的人格和他们兴趣的全部范围漠不关心，那么我们就真的不是在谈论以人为中心的技术。即使该技术被明确设计用于增强人类能力的目的。\n\
  \n如果我所做的一切只是试图增强人类能力，以便我能从该人类身上作为经济系统的一部分，或作为一套物理操作的一部分提取更多价值，并且我对构成一个人的人的一切其他方面漠不关心，那么那就不是以人为中心的技术，也不是以人为中心的人工智能。\n\
  \n这就是其中的另一个重要部分。要理解以人为中心的人工智能必须在其核心拥有对人类个体和人类繁荣的稳健而全面的概念。\n\n### 在你看来，将公众讨论围绕以人为中心的人工智能的概念展开，而不是负责任的人工智能的概念，会更好吗？对话会更丰富吗？\n\
  \n我认为你选择哪种视角取决于上下文和目标。所以，你是想例如解决某种技术的政治合法性以及该工具的安全性吗？在这种情况下，你知道，负责任的 AI 框架可能比以人为中心的框架更合适，因为你真正关心的是该技术的适当监管和治理。负责任的\
  \ AI 是正确的视角，当你主要处理的是一个治理挑战时。\n\n在我看来，以人为中心的人工智能的概念在负责任的 AI 视角之上，并且更广。我认为你应该在你想要讨论的是：这项技术是为谁服务的？我们想用它创造什么样的未来？时使用它。\n\
  \n这就是以人为中心的人工智能视角，我认为更有启发性。因为我不认为你能仅仅通过指向负责任的 AI 概念来回答这个问题。说我负责任地开发一个 AI 系统，并不能告诉我任何关于我试图用它塑造或实现什么样的未来。所以，我认为负责任的\
  \ AI 的标准很高——当然比我们目前所处的点更高——但我认为以人为中心的人工智能的标准……我不知道我会说标准更高，但雄心肯定更大。\n\n### 我们是否有使用以人为中心视角开发的产品或服务的例子，还是我们基本上在谈论一种实际上并不存在的东西？\n\
  \n我会说，有一些技术、AI 技术，与以人为中心的人工智能方法相兼容。例如，考虑用于增强无障碍功能和为聋人社区的人或可能不说演讲者母语的人提供实时转录工具的 AI\
  \ 应用。我们用于自动翻译和字幕的工具可以被视为更广泛冲动的一部分，即丰富和扩大更广大人类群体获取知识和文化的途径。确实可以认为那些以无障碍为驱动的技术与以人为中心的方法相兼容。\n\
  \n但我认为回答这个问题是否偶然还是有意为之很重要，对吧？它们是否以以人为中心的哲学设计，这是一个你无法轻易从外部回答的问题。你必须真正能够很好地了解该过程是如何产生的，该技术是如何产生的，从一开始就融入了哪些假设，哪些激励和目标决定了其最终形式，以及在多大程度上更广泛的人类利益被保持在设计过程和设计材料的中心。\n\
  \n\n\n\n\n即使你能为这些技术识别出特定的好处，也很清楚，这些工具所针对的人类并不是其预期的受益者，这些工具的设计目的是为了某些*其他*机构或流程对人类进行分类、操纵和控制。这与以人为中心的人工智能正好相反。\n\
  \n也很清楚，ChatGPT 并不是一种以人为中心的技术。想想它现在正在如何改变课堂。我们也许能找到在课堂上善用它的方法——部分原因是我们将被迫这样做。但这正是重点所在：ChatGPT\
  \ 并不是在为回答这样一个问题而开发的：“人类、人目前最需要技术提供什么？”相反，它是在这样一种思路下开发的：“如果我们把这些技术尽可能地扩大规模，并投入尽可能多的计算能力，会得到什么？而我们得到的是一种我们必须去应对的东西，而不是一种由我们为我们设计并造福于我们的东西。\n\
  \n因此，我们现在有了必须抛弃他们历经数个世纪发展起来的教学方式的教育工作者，并*重塑*教育，使其不会被这种工具的存在所挫败。而我们最终会得到的东西是更好还是更差，这是一个开放性问题。但重点是，没有人问过教育工作者：“你需要\
  \ AI 做什么才能更好地教学？”ChatGPT 不是他们会要求的东西。它不是我们需要的技术。所以所有关于 ChatGPT 优势的讨论，大多数优势都是我们*适应*这种技术的方式，而这种技术是强加给人们的，而不是由他们选择的。\n\
  \n### 你提到，很 often，以人为中心的人工智能不会是最终结果，但过程应该是以人为中心的。你能多谈谈这个过程应该如何实施？它是什么样子的？\n\n我认为有很多不同的方法和实践已经被开发出来，可以支持以人为中心的人工智能。价值敏感设计就是其中之一。它包括提出这样的问题：“是什么价值观塑造了这种特定的设计架构？”，“它将服务于谁？”，以及“它可能会对哪些现有价值观施加压力或产生冲突？”因此，我认为价值敏感设计是答案的一部分。\n\
  \n参与式设计也是解决方案的一部分。有句广为人知的口号：“如果没有我们，就不要谈论我们”，它起源于残疾人社区，是对为轮椅使用者设计外骨骼等提案的回应。当你问大多数轮椅使用者时，他们会说：“我不想站起来。我不要外骨骼，那很笨重。”很多轮椅使用者反而说：“我们想要的是我们长期以来一直在要求的东西：人行道上的路缘坡道、高度合适的柜台、航空公司在不损坏轮椅的情况下处理我们的轮椅。这些才是我们需要的。给我们这些东西吧！”相反，他们被给予了外骨骼，部分原因就是它们没有与预期受益的社区一起设计，所以没有流行起来。\n\
  \n“如果没有我们，就不要谈论我们。”这不仅仅是关于设计你想象中会服务于残疾人的技术。它是关于将改变父母生活或改变医院环境中护理的影响或体验的技术。如果你不是与技术所针对的人一起设计它，那么你已经失败了。它不会是以人为中心的。如果这些技术将落到的人们没有参与构思、设计、测试、部署和迭代这些技术的整个过程，如果他们没有贯穿始终地参与其中，那么你很可能会得到一种不是以人为中心的东西。\n\
  \n实施以人为中心的过程还在于激励人工智能的设计、开发和部署，以及对其监管的方式，使所选择的激励代表这种人类繁荣的更广泛利益。例如，如果我只想让一个 AI 系统更准确或更快地做出决策，如果这是我成功的唯一指标，那么它就不是以人为中心的技术。为什么？因为我没有回答这个问题：“更快，为了什么？”或“更准确，所以怎样？”或“速度或准确性将使什么成为可能？”如果你不能讲一个以更大的人类繁荣为结尾的故事，如果它只是为了允许更有效地提取价值，而这种价值流向已经强大和富有的人，而以数百万人为代价，那么在这种情况下，速度和准确性就没有特别的人道价值。它们实际上具有负面价值。它们实际上让你能够更快、更高效地做一些*破坏*人类繁荣的事情。所以，建立以人为中心的过程就是要确保成功的最终指标直接与可靠且丰富的衡量人类繁荣的标准相联系。\n\
  \n### 你需要什么样的团队来构建以人为中心的人工智能？\n\n这才是真正重要的部分。如果你要设计以完整的人为中心的科技，那么这些科技背后的知识——它们的<|message|>设计、开发和部署——需要代表这种完整性。这意味着你需要的不仅仅是计算机科学家、伦理学家和哲学家。你需要人类学、社会学、心理学、历史、媒体和艺术方面的专家，这取决于你在做什么。\n\
  \n并非每项技术都必须由一整个大学来设计，但根据你在做什么，以及 AI 工具将影响人类体验的哪些方面，你必须能够有选择地借鉴与该应用在该情境中相关的、关于人类体验和人的全面知识。举另一个例子，有很多关于为养老院的老年人护理构建机器人的讨论。\n\
  \n这其中有一整套问题，但首先需要问的问题是：“为了做好这件事，需要什么样知识？”它绝对不仅仅是机器学习、机器人技术和医疗法规的知识。你需要老年医学、老年心理学以及老年人繁荣与福祉方面的专家。而且你需要有在你期望部署该机器人的特定文化和地区中，这意味着什么的经验。所以，如果我设计一个工具要部署在韩国的养老院，我不能仅仅依靠了解斯堪的纳维亚老年人护理经验的人，或了解斯堪的纳维亚老年人通常重视什么、什么活动最有利于该文化背景下人们幸福的人来设计它。\n\
  \n但我们实际上已经看到具体的例子，其中没有这样做——实际上，在我所知的情况下，情况正好相反：机器人在韩国设计，然后被带到斯堪的纳维亚在养老院进行测试。而这些养老院的居民对这些社交机器人的情感化设计反应要负面得多。而在韩国，机器人的情感表达——它的说话方式、移动方式和互动方式——被视为温暖而迷人，但在这种特定的斯堪的纳维亚测试环境中，机器人被视为幼稚、\
  \ Infantilizing 和令人厌烦。显然，在设计中根本没有为这种不同的文化规范和价值观做好准备。\n\n\n\n\n\n所以，当我们做以人为中心的人工智能时，真正重要的是，我们要理解“谁？”、“在哪里？”以及“如何？”——这项技术将被部署到哪里。然后，我们必须识别出与理解在*那里*、在*那个情境*中人类繁荣是什么样相关的多样化知识形式。然后，我们必须有点逆向工程人类繁荣，倒回去说：“好吧，我们如何实现那个目标？”以及“我们如何构建一项技术，使这种繁荣得以更充分地实现，或使其对更广泛的人群变得可及，或使其更可持续？”\n\
  \n通常的过程却大不相同。通常的过程是：我们设计一项技术，然后试图找到让它发挥作用的地方，然后要求在那个情境中的人们重塑*他们自己*以适应我们所构建的东西。这已被许多学者指出（朗登·威纳可能是第一个谈论这个问题的人）。这就是逆向适应\
  \ 的想法。\n\n与其将技术适应我们的需求，我们反而将自己适应技术的需求。技术需要更多数据，或技术需要在其周围有一个安全的物理环境，以免被推倒，或技术需要始终保持通电。然后我们必须重塑我们的情境以使技术能够发挥作用。以人为中心的人工智能则涉及相反的做法：它关乎“我们想要实现的人类需求和机会是什么？”然后“我们如何调整我们的技术能力以满足这些需求？”\n\
  \n* **你认为我们能够设计出我们所说的这种以人为中心的人工智能吗？**\n\n从长远来看，我是谨慎乐观的……但我比五年前更不乐观了。原因是我认为我们已经将某种真正异常的工程文化正常化了，最初是这样。\n\
  \n我的意思是，20 世纪在软件革命之前阐述的传统工程模式——无论如何都不完美，但它们确实包含了伦理、负责任的设计、安全工程、性能的监控和审计、理解用户以及以用户为中心的设计等概念。这些都是任何《技术\
  \ 101》课程的一部分！\n\n但传统工程学科在几个世纪中学习到的许多教训，并在 20 世纪被正式化为专业实践准则——其中许多教训都被软件开发者和计算机科学家抛弃了，或者根本就没学过，他们成长于一种完全不同的文化中。\n\
  \n让我担忧的是，在过去十年里，我们在多大程度上将这种文化正常化，以至于人们现在谈论这些异常做法时称之为*工程文化*。我在 Facebook 出现之前就教了多年工程伦理。当有人告诉我，如今我们看到的一些事情只是工程文化的一部分时，我的脑子就炸了。这*不是*工程文化。这是对工程文化的*背离*。我们忘记了那段历史。我们忘记了以人为中心的工程是什么；我们忘记了那个基准。\n\
  \n我的观点是，我们要走的路比十年前更远，因为我们在过去十年里正常化了这种异常，而这对我们的民主、信息生态系统的健康以及人类福祉和繁荣造成了深远的伤害。我们每天都看到这种伤害，却耸耸肩说：“好吧，我们能做什么呢？这就是科技，这就是工程，这就是现状。”\n\
  \n我真正认为的是，我们需要在诸如监管之类的事情上更积极，而幸运的是，这现在正在向前推进（我认为这正是我获得一些乐观情绪的地方，因为我认为很明显，我们需要比例如社交媒体平台那样更有效地治理人工智能）。但如果我们不真正触及工程文化的根源并将其重新与工程和技术更广泛的长期历史使命保持一致，那么监管的推动就不够。\n\
  \n技术始于满足人类需求的方式——安抚和治愈、喂养和庇护、以及增强个人和社区的力量。这就是我们使用技术的方式。*技术在本质上是人性的*。而这种认为技术是不人道的、漠不关心人类、自行发展、我们必须适应的东西的想法，是我们必须改变的奇怪虚构。\n\
  \n如果我们改变这种叙事，如果我们能够恢复技术、工程、创造性实践的历史和意义并将其应用于人工智能，那么我认为前途无量。如果我们能够将人工智能与这些规范和价值观重新对齐，其可能性将对人类家庭产生难以想象的益处。这就是我的乐观所在。\n\
  \n我不是决定论者。我不相信技术独立于人类意志发展。如果没人驾驶巴士，那是因为我们松开了方向盘。我们要重新掌控，只需把手放回方向盘上并思考我们要去哪里即可。因为这对我们来说仍然是可能的，而且符合我们的利益，我仍然谨慎乐观地认为我们会醒来并再次开始掌舵。\n\
  \n## 2 通过 Ubuntu 视角解决算法造成的不平等和社会排斥 以人为中心的人工智能\n\nMalwina Anna Wójcik¹\n\n博洛尼亚大学，意大利博洛尼亚\n\
  \n卢森堡大学，卢森堡市卢森堡\n\nDOI: [10.1201/9781003320791-4](https://dx.doi.org/10.1201/9781003320791-4)\n\
  \n### 引言\n\n以人为中心的人工智能（HCAI）的视角涵盖了技术的开发，这些技术不仅“增强、放大、赋能和提升人类表现” (Shneiderman, 2022:\
  \ 4)，而且还拥抱人类价值观。在其《值得信赖的人工智能伦理准则》中，由欧洲委员会设立的独立人工智能高级专家组（AI HLEG）强调，以人为中心的人工智能方法应植根于“对人类尊严的尊重，其中人类享有独特且不可剥夺的道德地位”\
  \ (European Commission, 2019: 37)。人类尊严确实被认为是欧盟所建立的价值观的基石\n\n尊严与平等密切相关，平等是《欧洲联盟条约》第\
  \ 2 条所载的另一项价值 (European Union, 1997)。正如欧洲法院所强调的那样，人类平等的根源在于其固有的尊严——这一概念通常被称为*égale\
  \ dignité*。\n\n算法决策（ADM）在公共生活的关键领域兴起，包括司法系统、就业、医疗保健、社会福利和信用评分，为实现*égale dignité*带来了新的挑战。首先，历史上被边缘化的社区在人工智能技术的设计和开发中没有发挥有意义的作用。技术团队缺乏多样性，以及少数群体利益相关者在充满价值的算法设计过程中参与机制匮乏，导致了既有权力叙事的固化。其次，正如广泛记录的那样，ADM\
  \ 系统倾向于反映并加剧现有的社会偏见 (Wachter et al., 2021)。关于少数群体的相关数据不可用，或他们在数据集中被刻板化、不准确地表示，导致算法进行非法歧视。第三，不平等部署和使用\
  \ ADM 系统扩大了权力差距。算法反馈循环导致弱势群体受到过度数字监控，例如通过使用预测性警务工具 (EFRA, 2022)。此外，人工智能技术的益处往往被拒之门外，并集中在特权阶层手中。\n\
  \n\n\n\n\nSabelo Mhlambi，一位研究人权、伦理、文化与技术交叉领域的学者，认为克服这些挑战需要摆脱支撑人工智能发展的西方人格观（Mhlambi,\
  \ 2020）。从将人类描述为“理性动物”的亚里士多德，到笛卡尔著名的“我思故我在”宣言，欧洲哲学将人格根植于理性的概念，指导着开发模仿人类智能的机器的追求。在这一叙事中，理性被构建为一种个体品质，对于使人类成为“完整、统治者且自主”不可或缺。然而，据\
  \ Mhlambi 称，个人主义的人格观存在固有缺陷，包括正当化并加剧不平等，正如历史上理性被武器化为排斥工具所证明的那样。启蒙时代关于自由、平等和人权的思想的适用范围仅限于被认为足够理性而被视为人的那些人，这正当化了对非欧洲人的奴役和压迫，以及对女性的劣等对待。\n\
  \n因此，女性主义哲学家是首批批评以理性为人类尊严基础的人之一，主张一种关系性的自主概念（Stoljar, 2013）。\n\n同样，Mhlambi 提出了一种基于南非\
  \ Ubuntu 哲学的替代性人工智能伦理方法，该哲学以关系性术语诠释人格与人类尊严，其前提是个体福祉只能通过整个社会繁荣来实现（Mhlambi, 2020）。正如\
  \ Tom Zwart 所强调的，Ubuntu 敦促人类超越个人利益，要求“合作、相互依存和集体责任”（Zwart, 2012: 555）。\n\n因此，Ubuntu\
  \ 视角可以为 ADM 在歧视和社会排斥背景下所带来的挑战提供新的启示。本章的目的是通过展示 Ubuntu 如何在 HCAI 的背景下被操作化为伦理和法律原则，为关于人工智能监管的跨文化对话提供信息，从而为这一努力做出贡献。\n\
  \n### Ubuntu 作为伦理和法律概念\n\n源于恩古尼哲学，Ubuntu 传统构成了后种族隔离南非社会政治身份的基石，影响着其政府、企业和组织的结构（Reviglio\
  \ et Alunge, 2020）。此外，Ubuntu 的影响力超越了南非，构成了许多撒哈拉以南社会中存在的道德哲学的基石。\n\n阐述 Ubuntu 的全面定义是一项具有挑战性，甚至可能是不可能的任务。这是因为其含义高度情境化且开放（Bohler-Muller,\
  \ 2005）。Chuma Himonga 认为，作为一种元规范，Ubuntu 最好以抽象术语来构想，参考其“共同体、相互依存、尊严、团结、责任和理想”的基本属性（Himonga,\
  \ 2013: 173）。南非宪法法院前法官 Yvonne Mokgoro 将 Ubuntu 描述为\n\n> 一种生活哲学，其最根本的意义代表人格、人性、人道和道德；一种描述群体团结的隐喻，而这种群体团结对于资源稀缺的社区的生存至关重要，其基本信念是\
  \ […] 一个人之所以为人，是因为其他人。\n\n> (Mokgoro, 2012: 317)\n\n这一描述阐明了 Ubuntu 对人类中心人工智能辩论的贡献，强调本质上，Ubuntu\
  \ 正是关注在（数字）社会中成为人的意义。词语本身的词源唤起了获得人格的过程——在属于恩古尼语族的语言之一的祖鲁语中，词根“Ntu”表示人或人民，而前缀“ubu”表示存在或成为（Mhlambi,\
  \ 2020: 13）。从这个意义上说，Ubuntu 中的人格不同于人类物种的单纯生物学独特性，超越了“意识、记忆、意志、灵魂、理性或心理功能”等要求（Cornell,\
  \ 2014: 160）。正如著名非洲哲学家 Ifeanyi Menkiti 所强调的那样，获得完整人格并非个人能够独自实现，因为它需要整个社区的参与（Menkiti,\
  \ 2004）。\n\n人格的关系性概念对法律如何规范社会关系具有影响，而法律的基本功能是“保障人类在其存在中”（Murungi, 2004: 525）。因此，从规范意义上讲，尽管未在南非宪法文本中明确表述，Ubuntu\
  \ 被认为是一种“渗透宪法整体，特别是体现了既定基本权利的第三章”的价值。\n\n### 通过 Ubuntu 透镜看 *égale dignité* 概念——来自南非宪法法院的教训\n\
  \nUbuntu 指向人与人之间的亲缘感（Ramose, 1999），并且与人类尊严价值不可分割地联系在一起，“强调尊严在社会关系和实践中的美德”（Mokgoro,\
  \ 2012: 318）。然而，Ubuntu 中对尊严的理解与欧洲哲学思想之间存在显著差异。本节说明南非宪法法院如何通过 Ubuntu 的透镜诠释尊严，从而保护弱势群体免受社会排斥。\n\
  \n#### 社会排斥作为关系性尊严的侵犯\n\n现代人类尊严概念之父伊曼努尔·康德将尊严与实践理性的能力联系起来，这种能力使人类能够行使自主权，而在 Ubuntu\
  \ 中，尊严并非根植于理性，而是根植于人类的独特性与独特性及其建立与他人和谐关系的能力（Metz, 2020）。正如 Tom Bennett 所主张的那样，正是“嵌入于共同体中”的概念使\
  \ Ubuntu 不同于西方的尊严观念（Bennett, 2011）。因此，Ubuntu 的精神常被表达为格言：“我之所以存在，是因为我们存在，而既然我们存在，因此我存在”（Mbiti,\
  \ 1990）。\n\n在南非宪法法院的判例法中，歧视和社会排斥被视为对 Ubuntu 的侵犯和对尊严的攻击，因为它们阻止人类作为社区成员蓬勃发展。因此，在 *Mahlangu*\
  \ 中，\n\n\n\n\n\n根据 `Khosa` 案法院的观点，穷人的福祉与社区其他成员以及整个社区的福祉相连。这种方法说明了西方社会契约观念与乌班图之间的对比。前者将社会纽带解释为个人决定放弃其自然自由的结果。后者则基于这样一个前提：人实际上是生来就处于社会纽带之中（Cornell,\
  \ 2014）。这一推理的一个重要后果是，由于人类的身份，人们同时获得权利和义务。因此，在乌班图哲学中，自由与责任相互关联，在个人与社区之间架起了一座桥梁（Cornell\
  \ et van Marle, 2022）。属于一个社区，需要同时具备作为群体成员的身份认同以及与群体保持团结，即真诚地为了他人的缘故而帮助他人的意愿（Metz,\
  \ 2014）。因此，排斥弱势群体与乌班图不相容，乌班图要求以同情和理解对待他们。\n\n#### 关系性自主——通过有意义的参与平衡个人与群体权利\n\n乌班图的核心在于个人不可剥夺的权利与社区普遍权利之间的平衡。夸梅·格耶克耶试图通过一句阿坎谚语来解释它们的相互依存关系：“氏族就像一簇树木，从远处看似乎挤在一起，但走近看会发现它们各自独立”\
  \ (Gyekye, 1997: 40)。因此，虽然乌班图并不抛弃个人自主性的概念，但它必然在社会矩阵中对其进行建构。在乌班图之下，自主性最好以其关系形式来理解，据此，自治的个人是“在社会中构成的，并且可能根据人际关系和相互依存来界定其价值承诺”\
  \ (Christman, 2004: 143)。因此，因为个人权利受到他人权利的塑造，“严格来说，从乌班图的视角来看，不存在绝对的个人权利” (Chuwa,\
  \ 2014: 36)。因此，实现乌班图必然涉及持续的对话以及社区成员之间差异的协商。平等是这种对话的必要前提，这种对话不能简化为社会凝聚力或共识的概念，因为它需要一种旨在理解他人立场的审议努力\
  \ (Bohler-Müller, 2012)。\n\n或许，关系性自主的运作最好由宪法法院在 `Port Elizabeth` 案中的判决来说明。\n\n在此推理的基础上，宪法法院在\
  \ `Olivia Road` 案中，\n\n### 在（数字）社会中做人——乌班图对 HCAI 辩论的贡献\n\n乌班图所提供的社群主义人性尊严观可以为 HCAI\
  \ 辩论带来新的视角，将算法偏见和数字排斥问题框定为主要的关系性问题。因此，在前一节研究成果的基础上，本节探讨乌班图对人工智能公平研究社区、人工智能程序员和计算机科学家以及人工智能系统与其用户之间互动的影响。\n\
  \n#### 人工智能公平研究社区\n\n乌班图的关系性方法导致人们脱离了将算法偏见狭隘地定义为“系统中的错误”这一定义，而这种错误可以永久修复，转而支持对该问题的更具情境性的理解，并探究某些算法歧视模式出现的原因。这涉及揭示塑造我们数字社会的非对称权力动态和结构性不平等，以及质疑“关于知识、正义以及技术本身的假设”\
  \ (Birhane, 2021: 8)。因此，研究社区不应仅仅专注于纠正算法排斥的症状，例如通过对不平衡数据集进行重采样，而应旨在理解其成因，探究数据是如何生成和收集的。为了促进这一目标，研究人员应在计算机科学、伦理学、法律和社会科学交叉领域开展跨学科和协作项目。此外，促进研究社区的多样性，特别关注弱势和代表性不足的群体，对于理解算法偏见的原因至关重要。在这一领域中，Queer\
  \ in AI 提供了一个良好实践的例子，该倡议的创建目的是补救人工智能社区中酷儿人士代表性不足所带来的伤害 (Organizers of Queer in AI\
  \ et al., 2023)。该组织的核心理念包括去中心化结构、社区主导的倡议和交叉性。Queer in AI 鼓励其成员广泛参与讨论和项目规划，揭示基于交叉身份的排斥的\
  \ lived 经历，包括种族、性别、阶级、残疾或种姓。这些经历被转化为旨在提高酷儿人士代表性的具体步骤，例如研究生申请经济援助计划、包容性会议指南、研讨会和社会活动，以及跨性别包容性出版倡导。\n\
  \n此外，乌班图的视角可以为围绕竞争性公平观念的辩论做出贡献。群体公平与个体公平指标之间的冲突渗透在机器学习文献中 (Kleinberg et al., 2016;\
  \ Zehlike et al., 2022)。群体公平的核心原则是机会平等。然而，群体公平约束可能导致看似特征相同的两个个体被不同地分类，从而违反个体公平，即要求相似案例应得到相似对待。虽然大部分人工智能公平文献关注如何平衡这些固有取舍，但一些研究人员认为个体公平与群体公平之间的二分法是人为的，因为在抽象层面上，这两种概念“实际上是同一套基本道德和政治关切的不同方面”\
  \ (Binns, 2019: 517)。乌班图与这一批评一致。关系性人格的概念意味着个体公平不能与群体公平考量相隔离地构建，因为个人与他们所属群体的成员共享可能的特权或劣势模式。否则就意味着拒绝以整体方式看待个人经历。正如穆伦吉所说，“忽视人与他人共有的东西，就是忽视自己作为人的身份”\
  \ (Murungi, 2004: 525)。因此，操作化公平不应受制于个体与群体二分法。相反，正如宾斯所论证的那样，选择公平指标的起点应该是绘制可能影响特定情境下自动化决策结果的不公正类型\
  \ (Binns, 2019)。\n\n#### 人工智能程序员和计算机科学家\n\n免受负面偏见的自由已在自动化系统的价值敏感设计框架中得到考虑 (Friedman\
  \ et al., 2013)。根据 Batya Friedman 等人，价值敏感设计应涵盖三重方法论：概念性研究、实证性研究和技术性研究。乌班图影响这三个要素中的每一个\
  \ (Friedman et al., 2013)。\n\n\n\n\n\n概念性研究的目的是确定相关利益相关者和价值，并探讨技术如何影响它们以及应如何平衡相互竞争的价值（Friedman\
  \ et al., 2013）。在此阶段，Ubuntu 的贡献在于强调间接利益相关者的作用，他们虽然不直接与系统交互，但可能严重受其影响。因此，ADM 技术的实施始终应伴随对其主要受益者的评估，确保弱势群体不会因技术负担和利益分配不均而受害。因此，算法偏见的解决方案应以受问题不成比例影响的人为中心，凸显歧视的亲身经历的重要性（Birhane,\
  \ 2021）。因此，通过 Ubuntu 视角设想的 HCAI 视角要求新技术不应基于使多数人受益的功利主义论点而部署。相反，增强人的尊严要求其影响必须以最脆弱者的经历为检验标准。\n\
  \n实证研究的目的是确定利益相关者如何理解和优先考虑相关价值（Friedman et al., 2013）。正如南非宪法法院的判例法所回应的那样，Ubuntu\
  \ 在实现价值权衡方面发挥着重要作用，要求优先保护最脆弱和最弱势者。例如，*Port Elizabeth* 和 *Olivia Road* 的判决强调，财产权不能被视为绝对权利，因为它必须与生活在贫困中的人们的权利相平衡。因此，可以认为在\
  \ Ubuntu 传统中，价值敏感设计应优先考虑社区中最脆弱成员的权利。从这个意义上说，Ubuntu 的社会理想唤起了恢复性正义，要求技术有助于实现一个更加公正和公平的社会，纠正历史上的排斥模式。\n\
  \n最后，技术研究的目的是确定技术促进了哪些价值，以及如何重新设计以支持前述研究中识别和概念化的价值（Friedman et al., 2013）。讨论将 Ubuntu\
  \ 传统应用于算法设计的问题，IEEE 关于自主和智能系统伦理对齐设计的指南强调了 AI 对社区价值的影响，而社区价值是 Ubuntu 的核心原则（The IEEE\
  \ Global Initiative on Ethics of Autonomous and Intelligent Systems: 55-56, n.d.）。该指南承认\
  \ AI 既具有破坏社区的潜力，也有补充社区的潜力，建议设计师和程序员“与终端用户和目标社区密切合作，以确保其设计目标、产品和服务与需求保持一致”（The IEEE\
  \ Global Initiative on Ethics of Autonomous and Intelligent Systems: 56, n.d.）。因此，Ubuntu\
  \ 要求 AI 话语中纳入包容性。这包括促进 ADM 技术的参与式设计过程。Ubuntu 的关系伦理要求公民社会利益相关者直接参与有关算法技术设计的价值负载决策。\n\
  \n南非宪法法院发展起来的有意义参与原则可作为关于 AI 技术社区决策的模式。正如法院判例法所强调的那样，有意义的参与不仅限于参与权，还涉及利益相关者之间的真正对话。换句话说，它意味着在设计过程中旨在协商差异的审议努力。正如宪法法院在\
  \ *Olivia Road* 中所述，该过程应鼓励积极主动的方法，而不是将弱势社区视为“无权势的大众”。\n\n毛利原住民社区在新西兰的数据治理案例提供了一个有趣的例子，说明在\
  \ ADM 参与式设计中优先考虑历史上服务不足社区的价值如何导致纠正权力不对称。2018 年，Te Hiku Media，一家小型非营利广播电台，启动了一个项目，邀请毛利社区用其母语录制和注释音频数据（Birhane\
  \ et al., 2022）。值得注意的是，该社区决定，数据随后被用于创建自然语言处理工具，应免受西方公司的商业使用。因此，建立了数据主权框架，以确保利用社区来源数据开发的技术直接惠及毛利人口并尊重其自决权。同样，政府也做出了参与性努力，以在数据收集中落实毛利价值观（Sporle\
  \ et al., 2020）。\n\n#### AI 系统与其用户之间的互动\n\nUbuntu 的伦理影响了 AI 系统与其用户之间的关系，对公平的 ADM\
  \ 实践具有影响。\n\n首先，Ubuntu 反对一种以技术为中心的观点，即人工智能可以超越人类智能并可能取代人类决策。Dorine Eva Van Norren\
  \ 认为 Ubuntu 拒绝了心智是智能唯一所在地的假设。相反，在 Ubuntu 中，智能也存在于直觉和“心”中，即“感受”他人并与他人产生共情的能力（van\
  \ Norren, 2022: 112）。因此，即使 AI 能够模仿人类心智，它也永远无法取代人类智能，因为它缺乏同理心和同情心。因此，ADM 系统不应在没有有意义的人类监督的情况下部署。\n\
  \n就人类与机器互动应如何塑造的指导原则而言，Ubuntu 的社会人格理想指向混合集体智能的理念。集体智能可以被理解为人类“以一种方式连接，使我们能够比任何个人更智能地集体行动”的能力（Peeters\
  \ et al., 2021: 218）。它是 Ubuntu 的核心要素，认为社区，包括祖先和后代，是智能的真正所在。近年来，集体智能引起了 AI 研究界和开发者的日益关注，他们探索该范式如何应用于人类与\
  \ AI 代理之间的互动，从而导致混合集体智能的发展。正如 Justice Sachs 在 *Port Elizabeth* 中所强调的那样，Ubuntu 的精神提醒人们他们不是“孤立的岛屿”，\n\
  \n### 结论——迈向 HCAI 的跨文化对话\n\n\n\n\n\n如果要认真对待激发关于值得信赖和合乎伦理的 AI 的真正全球性讨论，欧盟的国际政策倡议，例如以人为中心的\
  \ 人工智能国际外联 (European Commission, 2021)，应涉及与非西方传统的跨文化对话。这种对话对于消除权力不平衡并避免查尔斯·埃斯所称的伦理信息“帝国主义式同质化”\
  \ (Ess, 2006) 至关重要。他认为，伦理多元主义的视角在承认不可化约的差异的同时，可以帮助在这些差异之间激发参与，从而丰富讨论的双方。欧洲伦理和法律传统与\
  \ Ubuntu 之间的跨文化对话可能导致在两种文化之间找到相交点，同时与其各自的身份相兼容。例如，Ubuntu 的社群主义和关系性视角与欧盟团结价值观之间也可以得出一些平行之处，团结意味着负担和利益的平等分享。在\
  \ HCAI 框架中，团结意味着对 AI 系统的长期影响进行评估，确保其负担和利益得到平等分配，并且不会固化不平等 (Luengo-Oroz, 2019)。遗憾的是，虽然草案《人工智能法案》在其序言中提及了《欧盟条约》第\
  \ 2 条的其他价值，但它完全没有提到团结 (European Parliament and Council, 2021)。与 Ubuntu 提供的 HCAI\
  \ 视角进行对话可能导致重新审视欧盟的团结价值，并在伦理和监管的 AI 框架中加以运用。\n\n### Notes\n\n1. Art. 2 of the Treaty\
