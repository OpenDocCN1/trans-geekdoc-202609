  \ with indicative examples of the Actions included in the proposed framework for\
  \ the design of sandboxes to experiment with policies for age-appropriate AI and\
  \ children.](img/fig21_3a_B.jpg)\n\nFigure 21.3 A proof of concept with indicative\
  \ examples of the Actions included in the proposed framework for the design of sandboxes\
  \ to experiment with policies for age-appropriate AI and children.\n\n##### 同时保护儿童隐私和安全的挑战\n\
  \n\n\n\n\n研究表明，儿童倾向于将隐私定义为独处、管理信息、不受打扰以及控制对场所的访问（Wolfe, 1978）。然而，尽管研究表明儿童认识到隐私涉及自主性，但自主性并不一定对他们而言定义了隐私，因为在他们生命的大部分时间里，年轻时缺乏自主性正是他们所经历的（ibid.）。这些见解是在与物理世界相关的背景下形成的，而儿童对人工智能背景下隐私和安全的理解仍有待了解。\n\
  \n更近期的研究表明，在个人数据和数字空间中的隐私理解方面，不同年龄儿童的成熟度存在发展差异（Stoilova et al., 2021）。同样，Kumar et\
  \ al. (2017)发现，虽然个人认识到某些隐私和安全要素，但 5-7 岁的儿童在这些概念的知识方面存在差距。因此，虽然某些儿童可以发展出管理隐私问题的策略，但年幼的儿童很大程度上依赖父母提供支持（ibid.）。\n\
  \n轶事证据表明，尽管父母监督对于幼儿参与人工智能系统至关重要，但过度依赖父母干预是有问题的。除了父母干预可能造成的缺乏隐私感之外，由于父母知识和可获得性的差异，父母的干预还可能导致儿童保护方面存在巨大差异。\n\
  \n负责任的人工智能系统设计考虑了如何为儿童的隐私和安全理解提供支架，并支持其同意的能力。因此，儿童可以在与人工智能系统互动时，在隐私和安全方面发挥越来越积极的作用。一种负责任且符合发展水平的系统设计方法，即儿童支架化，使儿童能够以更安全的方式行使其隐私权。\n\
  \n#### 童年中的能动能力\n\n能动性被定义为“行动的能力”（Manyukhina et al., 2019），并包含意图性这一要素。Albert Bandura\
  \ 采取能动性视角（1989）并解释说，能动性是指人类通过自己的行动影响自身功能和事件进程的能力。这是社会情境化因果结构的一部分，并认为人们是有意地参与其生活境遇的贡献者。Synofzik\
  \ et al. (2008) 在“能动感”和“能动判断”之间划出了重要区别。能动感是一种低层次的非概念性感觉，即作为行动者的感觉；它是我们在没有明确思考时对自愿行动所感受到的控制的背景嗡鸣。另一方面，能动判断是一种更高层次的概念，并在我们对自我或他人做出能动性明确归属的情况下出现。\n\
  \n在此背景下，Greene and Nixon (2020) 采取发展心理学视角，拒绝将儿童视为完全自主的能动者、理性的观点，并主张儿童是随着时间推移具有能动能力的个体，有时能够形成并主张自己的选择和意见，但并不总是被倾听，也不总是有效。他们基于权力关系这一因素解释了自己的观点，即能动性如何被表达或不被表达。社会认知理论和儿童发展心理学理论这两个视角都强调情境对儿童能动性表现的重要性，例如家庭、学校或社会情境（Sorbring\
  \ & Kuczynski, 2018）。从教育角度来看，Baker et al. (2021) 提出，符合发展水平且富有趣味性的活动为儿童发展其能动性创造了空间。\n\
  \n上述考虑表明，在为儿童设计政策和创新解决方案以及在人工智能背景下进行实验方法和评估指标时，需要考虑的复杂性，而对这些因素的过度简化可能会对儿童当前和未来的福祉产生影响。\n\
  \n### 方法论\n\n如前一节所述，在设计和实施可能被儿童使用的人工智能系统以及考虑此类系统评估的实验方法时，应考虑儿童的特殊特征和需求。\n\n我们考虑到关于人工智能系统的立法紧迫性，以及国家和国际组织在人工智能政策建议方面的日益活跃的活动，特别是针对\
  \ 18 岁以下用户。这些倡议的绝大多数都提出，除了针对成年公民的一般政策框架和立法外，还需要对 18 岁以下用户进行特别考虑。\n\n在我们的工作中，我们首先考虑现有的专门为儿童制定的政策倡议，并强调在儿童权利的视角下可能需要重新考虑的要点。然后，我们阐述不同领域沙盒设计的现有技术，并提出人工智能与儿童沙盒设计的框架，然后将其与联合国儿童基金会为人工智能与儿童政策指导的运营化而提出的画布相结合。最后，我们以概念验证的形式展示所提框架，并提供说明性示例以供阐述。\n\
  \n### 儿童政策倡议概述及共同特征识别\n\n越来越多的国家和国际组织认识到，为人工智能系统的发展制定政策建议需要儿童特定的方法。\n\n我们以《联合国儿童权利公约》（UNCRC）为起点，\n\
  \n鉴于数字环境不断发展和扩展，以及数字世界为儿童带来的机遇和风险，联合国通过了第 25 号意见\n\n1. 不歧视；\n2. 儿童最大利益；\n3. 生命权、生存权和发展权；以及\n\
  4. 尊重儿童的意见。\n\n2019 年，联合国儿童基金会和芬兰政府启动了一项为期两年的项目，专门关注人工智能背景下的儿童权利。组织一系列全球和区域专家与儿童研讨会对于制定这些准则至关重要。联合国儿童基金会涉及了来自不同国家的\
  \ 245 名儿童，重点关注代表性不足的地理区域，与专家开展了一系列研讨会，并审查了 20 项国家人工智能战略，得出以下要求\n\n1. 支持儿童的发展和福祉；\n\
  2. 确保儿童的包容性以及为儿童的包容性；\n3. 优先考虑儿童的公平和非歧视；\n4. 保护儿童的数据和隐私；\n5. 确保儿童的安全；\n6. 为儿童提供透明度、可解释性和问责制；\n\
  7. 赋予政府和企业关于人工智能和儿童权利的知识；\n8. 为儿童准备人工智能的现在和未来发展；\n9. 为以儿童为中心的人工智能创造有利环境。\n\n2021\
  \ 年 5 月，鉴于技术、法律和政策的进步，经合组织发布了“关于保护儿童在线的建议”的修订版\n\n1. 人工智能促进个性化和更好的学习成果；以及\n2. 教育管理信息系统中的数据分析以及向学习管理系统演进。\n\
  \n\n\n\n\n2022 年，欧盟委员会联合研究中心（JRC）考虑到已有的关于人工智能与儿童权利的工作，组织了一系列与专家、儿童和政策制定者的研讨会，并提出了研究和政策的综合议程。\n\
  \n1. 人工智能最小化、有价值的目的和可持续性；\n2. 透明度、可解释性、沟通和问责；\n3. 包容性和非歧视；\n4. 隐私、数据保护和安全；\n5. 整合和尊重儿童的主体性。\n\
  \n总体而言，以上提及的倡议在人工智能对儿童的风险和机遇方面在一定程度上保持一致，但在目标和优先事项方面存在差异。所有倡议都认识到需要切实可行的方法来试点人工智能与儿童权利的政策指导，并最终支持人工智能的开发和使用。\n\
  \n对专门为儿童设计的现有主要政策倡议的最新回顾发现，它们似乎有十项共同原则，而联合国儿童基金会的框架包含了所有这些原则（Wang et al., 2022）。因此，出于本工作的目的，我们采用联合国儿童基金会的框架，并将其与专门针对人工智能与儿童的沙盒设计的原则集相结合。\n\
  \n应注意的是，首批监管行动，尤其是针对适龄人工智能的监管行动，已开始出现，例如最近签署的加州适龄设计法案，\n\n### 适龄人工智能与儿童的沙盒\n\n联合国儿童基金会制定了一系列具体步骤，以支持以儿童为中心的人工智能开发和使用。这首先需要充分了解儿童与人工智能系统如何相互交集。然而，根据联合国儿童基金会，“仅在人工智能文件的伦理章节中提及人类或儿童权利是不够的（这是国家人工智能战略中的常见现象）”（UNICEF,\
  \ 2021）。\n\n政策制定者、领导者和人工智能系统开发者应了解并具备足够的儿童权利知识，了解人工智能为儿童发展带来的机遇，以及在适当情况下，利用人工智能实现可持续发展目标的方式，无论是用于其政策还是其产品或服务。\n\
  \n任何倡议的起点始终应是这样一个问题：基于人工智能的解决方案是否是解决当前问题的最佳方法。回答这个问题应迫使我们从各个角度审视人工智能系统或其使用。这些考虑指导人工智能应如何开发和部署。请注意，人工智能技术越来越多地内置于许多产品和服务中。此外，人工智能系统可以从零开始开发、直接购买或添加到已在使用中的系统中。\n\
  \n专门支持儿童相关人工智能应用实验的沙盒使用有助于为儿童提供值得信赖和透明的人工智能解决方案。使用沙盒使提供者和开发者能够测试和评估人工智能应用的安全性以及与负责任和伦理原则的一致性。与此同时，沙盒方法可以支持消费者和更广泛的公众了解人工智能技术的影响，并在适当情况下，要求技术服务具备适当的安全保障措施。\n\
  \n基于当前最佳实践（German Federal Ministry for Economic Affairs and Energy, 2019），我们提出了一个以儿童为中心的人工智能开发沙盒的基本结构（另见图\
  \ 21.1）：\n\n1. 定义应用的目的和范围：\n   * 沙盒的目标是什么？\n   * 谁可以参与？\n   * 沙盒范围内的产品/服务类型是什么？\n\
  \   * 研究结果将如何使用？\n   * 如何确保监管者和从业者能够从监管沙盒中学习？\n\n2. 绘制人工智能监管生态系统，包括政策/法律框架和当前行业标准\n\
  \   * 应考虑哪些相关法规和标准？\n\n3. 定义责任\n   * 谁负责监督和评估？\n   * 何时进行评估（持续进行、固定时间点、长期）？\n  \
  \ * 沙盒内评估结果可以如何使用？\n\n4. 定义评估指标和数据源\n   * 哪些指标合适？（例如，关于特定人工智能系统的儿童福祉的客观和主观衡量指标。）\n\
  \   * 可以收集/用于评估哪些数据？\n   * 沙盒评估带来哪些报告要求？\n\n一旦确定了沙盒的目标，就可以在系统开发过程中确定如何使用沙盒的流程。原则上，我们确定了四个可以从沙盒内实验中受益的阶段：分析、设计、实施和评估（图\
  \ 21.2）。\n\n更具体地说，我们定义了以下步骤：\n\n1. 分析阶段：了解人工智能对儿童的影响，同时考虑到国家/地区人工智能格局。\n   * 沙盒环境根据国家/地方输入实施法规和政策建议，包括来自儿童的输入，并促进讨论以儿童为中心的人工智能政策和要求如何支持国家或国际发展计划。\n\
  \   * 沙盒环境还可以促进/鼓励与所有相关利益相关者进行共同设计，包括儿童、教育工作者、非政府组织、研究人员以及其他在数字世界中从事儿童福祉工作的人员，以感知人工智能系统使用和影响的社会、技术和文化背景；\n\
  \n2. 设计阶段：\n   * 在沙盒内，测试将以儿童为中心的人工智能政策应用于具体产品和服务的策略，为尝试实施以儿童为中心的人工智能要求的替代方案创造空间。同时，沙盒提供了透明度的手段，项目和结果对公众审查和第三方评估开放。\n\
  \n3. 实施阶段：\n   * 支持开发和执行不同的实施策略，包括谨慎的步骤来测试、重新设计和根据具体使用和背景调整设计，同时确保实施选择和决策以相关立法和现有指南为基础\n\
  \n4. 评估阶段：\n   * 通过验证对以儿童为中心的人工智能要求的遵守情况，沙盒为监测不同策略的影响提供支持，应用影响指标，并导致基于数据驱动证据的设计计划以及政策和策略的更新。\n\
  \n为支持这些步骤，我们考虑了联合国儿童基金会提出的画布，以结构化的方式分析人工智能应用\n\n表 21.1 联合国儿童基金会为《人工智能与儿童政策指南》的运营化而提出的联合国儿童基金会画布\n\
  \n| 项目 / 应用标题： |\n| --- |\n| 日期： || 版本： || 作者： |\n| 目的 / 动机：项目简短描述： |\n| --- |\n\
  | 对儿童的影响人工智能系统如何直接或间接影响儿童？谁对人工智能系统对儿童的影响负责？ || 价值观/原则维护了哪些儿童权利、人类价值观和伦理原则，哪些受到威胁？\
  \ || 监管哪些法律/法规适用于人工智能系统？ |\n| 设计要求 |\n| 对儿童的积极影响 || 缓解对儿童的负面影响 || 儿童发展和福祉 |\n| 数据保护和隐私\
  \ || 公平/非歧视 || 透明度 |\n| 问责和救济 || 安全 || 包容 |\n| 可解释性 || 有意识的用户 || 为未来做准备 |\n\n###\
  \ 概念验证：一种四步、面向流程的方法\n\n\n\n\n\n我们将联合国儿童基金会（UNICEF）在图 21.1 中出现的模型作为政策指导操作化的依据，并将其与我们在“面向儿童的适龄人工智能沙盒”一节中提出的框架结构相结合（图\
  \ 21.1 和 21.2），以阐述设计人工智能与儿童沙盒的以下框架。\n\n应注意，该框架不应被视为一份核对清单；相反，我们鼓励将其作为一种以过程为基础的方法来加以完善，并由所有相关利益相关方参与，包括儿童。\n\
  \n此外，所提出的框架是一个模块化工具，其要素可在政策发展的不同阶段使用。图 21.3 展示了我们提出的用于设计人工智能与儿童沙盒的方法的概念验证，该方法如图\
  \ 21.1 所示，并包含“分析、设计、实施和评估”四个阶段以及示例。在我们框架的每个步骤中，我们提供了潜在的答案，这些答案并非排他性。我们强调了与图 21.2\
  \ 中出现的联合国儿童基金会指南相关的要素。\n\n图 21.3 展示了所提框架的概念验证，并针对所提行动提供了潜在答案的示例。我们包含了联合国儿童基金会为人工智能与儿童政策指南操作化而提出的画布中的所有要素（UNICEF,\
  \ 2021）。此外，在图 21.3 的第一列中，我们指出了应在发展的哪个阶段考虑每项行动，强调了我们框架的过程导向方法和迭代性质。\n\n如图 21.3 所示，所提行动以及每项行动需要回答的问题是相互关联的。然而，我们希望强调在实验过程中保持`transparency`的重要性。对整个过程的透明记录可以促进不同利益相关方之间的信任发展，尤其是在政策制定者、开发者和用户之间。这需要所有相关利益相关方付出特别努力并保持持续对话。解决可能出现的冲突应以符合儿童最大利益的价值观为基础。\n\
  \n此外，由于特定框架是为儿童政策和人工智能应用的实验而设计的，因此需要深入了解`children’s characteristics, development,\
  \ and needs`。框架的行动 1a（沙盒的目标是什么）应与行动 4a（合适的指标是什么）相关考虑，后者包括政策有效性、技术实现为系统以及儿童的可接受性以及对儿童的积极和消极影响等方面。如本章引言所述，儿童发展的情境变异性，以及儿童认知和社会情感成熟度和能力的大差异，以及他们的文化差异，应在设计包容且对所有人可及的系统时予以考虑（Charisi\
  \ et al. 2020, Newbutt et al. 2022）。因此，我们为适龄人工智能与儿童沙盒开发所提出的框架建议，测试应考虑到各种情境要素的多样性。\n\
  \n同样，拟议框架的行动 1b 强调了使流程对代表性不足的人群可及的重要性。这不仅包括作为适龄人工智能开发核心利益相关方的儿童，还包括可能需要在整个过程中参与决策时需要特别支持的人。\n\
  \n目前，我们观察到人们对需要专门为儿童设计人工智能应用的政策和评估工具的需求意识不断增强，众多组织正朝着这一方向努力，除学术机构开展的科学工作外。按照我们框架的行动\
  \ 2 所指，现有的倡议在实验面向儿童的适龄人工智能沙盒时可以提供宝贵的指导。\n\n最后，行动 4 指出需要有效且科学可靠的指标来衡量政策和创新解决方案的有效性，以及它们在可推广性方面的可接受性和生态效度，将所有儿童视为享有同等保护和参与机会的主体。\n\
  \n### Conclusions\n\n### 结论\n\n当今民主面临的重大挑战之一是技术、数据和自动化系统的使用方式威胁到儿童的权利。尽管这些系统带来了非凡的益处，但算法的使用使儿童的福祉面临风险：隐私侵犯、在线服务的过度使用以及接触对儿童尤其有害的内容，引发了关于保障儿童权利的诸多问题。根据《联合国儿童权利公约》和欧盟《基本权利宪章》，儿童享有受保护和参与的权利。\n\
  \n本章的分析表明，使用监管沙盒可能是实验和测试面向儿童的监管框架和人工智能应用的积极手段，使政策制定者、提供者和开发者能够评估人工智能应用对儿童权利、安全和福祉的影响。\n\
  \n这将提供手段来操作化以儿童为中心的政策建议方法，用于人工智能系统的开发，例如联合国儿童基金会、联合国、经合组织、联合国教科文组织以及欧洲委员会联合研究中心提出的建议。为了实现这些目标，重要的是要强调政策制定者、领导者和人工智能系统开发者需要具备足够的儿童权利知识以及人工智能相关儿童发展的机会。\n\
  \n最终，构建负责任的人工智能需要关注这三个相互关联的核心原则：问责制、责任和透明度[Dignum 2019, Charisi et al. 2022]。其中前两者必须通过社会法律手段和政策制定者的干预来解决，最后一点需要新颖的工程解决方案（Charisi\
  \ et al. 2017）以及建立良好的设计实践，基于我们对儿童发展的知识，而立法可以强制采用此类实践。然而，为了确保我们的社会技术系统长期遵守此类良好实践，所有主要利益相关方必须停止将伦理和即将到来的与人工智能相关的标准视为事后考虑或“日后处理的障碍”。相反，政策考虑和满足这些考虑的治理机制应成为任何项目在人工智能系统生命周期内实施和评估的组成部分。\n\
