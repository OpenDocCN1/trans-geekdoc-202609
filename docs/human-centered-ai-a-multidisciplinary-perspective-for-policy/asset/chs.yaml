  \n> *我从未意识到有其他选择*\n>\n> *除了质疑一切*。\n>\n> **—Noam Chomsky**\n>\n> 人工智能（AI）不仅发展迅速；它无处不在地出现在公共话语中。该术语出现在关于工作未来的文章中，出现在承诺医疗保健中\
  \ AI 的广告牌上，出现在关于预测决策伦理的学术辩论中，也出现在 YouTuber 讨论“奇点”的直播中。\n>\n> 2023 年 3 月，当世界在社交媒体上分享教皇方济各身穿\
  \ Balenciaga 外套的 AI 生成图像时，\n>\n> ![Figure 17.1 CHOM5KY vs. CHOMSKY VR experience—VR\
