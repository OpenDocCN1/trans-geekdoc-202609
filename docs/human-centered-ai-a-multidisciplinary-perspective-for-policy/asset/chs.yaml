  \n## 23 以人为中心的工业 5.0 人工智能（HUMAI5.0）*设计框架与案例研究*\n\nMario Passalacqua, Garrick Cabour,\
  \ and Robert Pellerin\n\nPolytechnique Montréal, Montréal, Québec, Canada\n\nPierre-Majorique\
  \ Léger\n\nHEC Montréal, Montréal, Québec, Canada\n\nPhilippe Doyon-Poulin\n\nPolytechnique\
  \ Montréal, Montréal, Québec, Canada\n\nDOI: [10.1201/9781003320791-27](https://dx.doi.org/10.1201/9781003320791-27)\n\
  \n### 引言\n\n将人工智能（AI）整合到工作场所为人类工作带来了诸多挑战和机遇。预计在物理或认知任务上，人与自动化之间的协作会增加。多个学科都强调了这些新技术是在与人类操作员协作的情况下自动化部分工作步骤，而不是取代整个职业，例如信息技术（Seeber\
  \ et al., 2020）、经济学（Frey & Osborne, 2017）、工作心理学（Parker & Grote, 2022）以及人因与工效学（Mueller\
  \ et al., 2021）。工业 4.0（I4.0）领域正处于人类工作数字化的前沿，其中 AI 发挥着核心作用。I4.0 旨在通过提高生产系统的生产力、可重复性、灵活性、实时监控和流程标准化方面的能力（Zheng\
  \ et al., 2021）。这是通过将一系列数字、机器人和自动化技术整合到生产中（Kadir et al., 2019）并将不同的数字解决方案组合在一起实现的（Zheng\
  \ et al., 2021）。I4.0 的最新技术进步提高了机器执行复杂认知任务的能力（Xiong et al., 2022）。然而，I4.0 技术的开发遵循技术中心主义的方法（Sony\
  \ & Naik, 2020）。首先关注技术开发（Carayannis et al., 2022）。文献计量分析量化了 I4.0 的技术中心主义方向。最近的一项文献综述指出，在采用包含术语\
  \ *Industry 4.0* 和 *Human Factors* 的检索策略的 4885 项研究样本中，4849 项研究关注技术因素，36 项关注人因（Passalacqua\
  \ et al., 2022）。这种自上而下的方法往往忽视了支配工作系统并可能将其整合到情境化操作实践中的情境因素（Loup-Escande, 2022）。\n\
  \n因此，学术界、政府和工业团体提出了更多有效和更安全的 人–AI 协作的关注点和原则（Kadir et al., 2019; Maddikunta et al.,\
  \ 2022; Neumann et al., 2021）。欧洲委员会启动了工业 5.0（I5.0）计划，以将以人为中心、可持续性和韧性原则付诸实践，使新技术开发与社会价值保持一致。针对采用技术中心设计方法仅考虑\
  \ AI 技术维度而可能造成的潜在危害，出现了新的子领域。首先，多项研究强调了 I5.0 能够带来的潜在益处，依赖于潜在的应用案例并为未来研究正式化途径（Jiao\
  \ et al., 2020; Maddikunta et al., 2022; Seeber et al., 2020）；其次，提出了一系列框架或设计原则，以在协作工作环境中整合人类与技术（Dubey\
  \ et al., 2020; Mueller et al., 2021）或在数字化转型中考虑人类和组织因素（Liao et al., 2020; Peeters\
  \ et al., 2020）。然而，虽然这些努力提供了初步的粗粒度指导，但这些一般原则并不能始终转化为日常设计实践或最终的基于 AI 的产品。设计团队需要系统化的方法，为在复杂社会技术环境中设计促进长期人类福祉、参与度和系统性能的新解决方案提供细粒度指导（Roth\
  \ et al., 2018）。\n\n本章介绍了 HUMan-centered AI for Industry 5.0（HUMAI5.0），这是一个创新的六步框架，支持设计团队采用以人为中心的方法来设计和实施工作场所中的\
  \ AI 融合系统。我们将该框架应用于 I5.0 背景下的两个用例。本章采用人因视角，其中以人为中心的人工智能关注工作场所中人类与 AI 系统之间的协作。余下章节组织如下：第\
  \ 2 节深入探讨框架所依据的文献；第 3 节介绍该框架；第 4 节将其应用于两个用例。\n\n### 相关文献\n\n#### 现有设计方法与框架\n\n#####\
  \ 面向 AI 的技术中心设计及其局限\n\nAI 融合解决方案通常遵循技术中心路线图，其中优值指标估计硬件和软件组件的成熟度（Sony & Naik, 2020）。当解决方案达到令人满意的技术成熟度水平时，开发团队会寻找设备可应用的领域和问题。虽然这种自上而下的方法通过仅关注技术细节来缩小问题空间，但它忽视了支配工作系统的情境和人因（Spies\
  \ et al., 2020）。此外，技术中心主义通常伴随着尽可能自动化尽可能多功能的愿望，以减少人类在工业流程中的干预，在这种哲学中，人类是不确定性和失败的来源（Millot\
  \ et al., 2015）。然而，AI 目前无法完全获取和复制隐性知识、社会认知过程以及“*根植于数十年机构经验的先进 know-how*”（Miller\
  \ & Feigh, 2019; p.2）。然而，在人类–技术协作场景中，该技术可以支持或自动化任务的特定部分（Xiong et al., 2022）。出现了对设计过程给予人类、组织和技术因素同等关注的互补设计方法，将在下一小节中讨论。\n\
  \n##### 互补设计与分析方法以应对技术中心主义的不足\n\n\n\n\n\n在组织中实施人工智能解决方案除了技术挑战外，还会同时带来社会和组织方面的挑战（Kadir\
  \ et al., 2019；Maddikunta et al., 2022；Neumann et al., 2021）。多位作者主张采用以人为中心的设计方法来克服这些挑战，并确保向数字化工作情境的成功转型（Neumann\
  \ et al., 2021；Oppl & Stary, 2019）。以人为中心的设计方法将终端用户置于产品设计的中心（Rapp, 2021）。与技术中心主义方法相反，它们属于一种归纳哲学，考虑用户的特征及其工作环境以*“指导和引导产品开发过程”*（Rapp,\
  \ 2021；p.1）。本小节将探讨在 I5.0 语境下最相关的方法。\n\n### 用于指导设计的系统性人类工作分析方法\n\n**认知工作分析（CWA）**是一种五阶段框架，指导社会技术系统的设计和评估（Vicente,\
  \ 1999）。CWA 使我们能够深入了解工作域、系统、任务和操作员的约束。CWA 的第一阶段、工作域分析（WDA）对本章尤为重要。WDA 提供与任务无关的设计信息，使其对新颖性或变化具有更好的灵活性和适应性。WDA\
  \ 通过五个层级的层级结构（抽象层级）在工作环境中识别约束，从最抽象到最具体：功能目的（系统的最终目标）、抽象功能（物理原理）、概括功能（过程）、物理功能（设备）和物理形式（位置和外观）（Rasmussen,\
  \ 1985）。WDA 有助于绘制将系统最终目标与其物理实现联系起来的手段-目的关系。\n\n**知识获取**是一类旨在推断终端用户心智模型和隐性知识的方法和框架（Shadbolt\
  \ & Smart, 2015）。依赖先进的访谈和观察技术，访谈者依靠及时呈现的提示（例如，图片、文件、现场笔记、专家执行操作的录像）和系统性问题来引导主题专家回忆情境特定的要素。用户也可以在同时执行任务时被要求出声思考（“请告诉我你在做什么以及为什么”）。该类别中最著名的<|message|>\
  \ 方法是知识审计（Gourova, 2009）、关键决策法（Klein et al., 1989）和认知任务分析（Crandall et al., 2006）。\n\
  \n### 面向工业 5.0 的整合设计框架\n\n**系统框架和分析方法**。Neumann and his colleagues (2021) 提出了一个五步框架，以系统地考虑在设计和实施\
  \ I4.0 系统时的人因。他们提出该框架描绘了 I4.0 相关技术所带来的社会技术变革的全面图景，这使得能够提出具体的设计和实施建议以避免功能失调的人机交互（HMI）。\n\
  \n**人机交互的动机设计**。Szalma (2014) 运用自我决定理论对动机的概念化来设计人本界面或系统。动机设计的前提是支持员工的自主性、胜任感和归属感，以便建立有利于长期工作投入、绩效和福祉的社会技术交互（Szalma，2009，2014）。他提出，仅考虑享乐性和功利性目标对于员工绩效和福祉是不够的。相反，在设计或实施社会技术系统时必须考虑动机需求（Szalma,\
  \ 2014）。自主性指的是对自己决策和行动的控制感，胜任感指的是对自己工作能力的有效感，而归属感则指的是在工作环境中对积极/有意义的联系和关系的感知。\n\n\
  **相互依存分析**是由 Johnson 等人开发的框架（2014，2017，2018），用于理解和设计人类和自动化系统如何有效协作以共同完成一项联合活动。与传统自动化设计中关注机器架构设计不同，该方法支持系统地探索人类-AI\
  \ 联合工作的设计空间。目标是识别*相互依存关系*——当一个实体（人类或人工）需要支持以完成给定任务的目标时——以设计联合工作。部署该方法需要三个不同的阶段：\n\
  1. 建模联合活动：定义实现运营目标所需的任务、子任务和能力\n2. 评估团队成员执行每项任务和子任务的能力以及协助能力\n3. 识别所有可能的人机工作流程：建立完成任务集的所有潜在路径以及相关的团队合作要求\n\
  \n#### 现有框架的局限性\n\n每个所呈现的框架都有其优势和局限性。Neumann et al. (2021) 提出了一种系统的方法来在 I4.0 环境中恰当地解决人因问题。它详细解释了如何在\
  \ I4.0 语境中应用框架的每一步。然而，其对技术和人类的分析并未充分捕捉复杂社会技术系统中工作域的复杂性。它还提到了检查变化的社会心理环境（对社会环境的感知）的重要性，但没有具体建议。\n\
  \n人机交互的动机设计框架（Szalma，2009，2014）旨在作为其他人因框架的补充，而不是独立的框架。与 Neumann et al.’s (2021)\
  \ 框架相比，它提供了一种更深入理解系统社会心理动态的方法，这将导致旨在增强社会技术系统中人机交互的设计建议。此外，它分析了操作员的认知和情感特征。这种分析在其他人机交互框架中缺失，可以为操作员的认知提供更深层次抽象水平的宝贵见解，最终导致更具体的实施建议。尽管全面，其分析范围主要局限于系统内的社会心理交互。因此，与其他框架联合使用将是理想的。\n\
  \n工作分析方法，如 CWA 或知识获取框架，提供了对当前知识状态和工作域的深入理解。然而，从对当前系统的深入分析过渡到设计未来的工作情境，并未得到当前独立方法学的适当支持。此外，工作域分析未考虑系统的社会心理特征。因此，它应与其他框架一起使用。\n\
  \n\n\n\n\n最后，相互依赖分析是最全面的方法，可解决上述缺点。作为一种形成性工具，相互依赖分析框架并未包含对所提议设计的总结性评估步骤。其分析视角过于粗糙，难以把握复杂社会技术工作系统的具体性，这表明需要用其他框架来补充。\n\
  \n### 面向工业 5.0 的以人为中心的人工智能（HUMAI5.0）框架\n\n通过文献综述找到的所呈现的框架和方法各有其优点和局限性。每个框架似乎都在不同程度上解决了人机交互的不同组成部分。所提出的框架（见\
  \ Figure 23.1）旨在发挥各自的优势以减轻彼此的缺点，创建一个整合框架来全面理解人机交互。\n\n![Figure 23.1 HUMAI5.0 six-step\
  \ framework.](img/fig23_1_B.jpg)\n\nFigure 23.1 HUMAI5.0 six-step framework.\n\n\
  1. **Step 1—Analysis**。此步骤涉及分析工作域以及与其交互的人类。对于此步骤，我们建议使用 CWA 的工作域分析（Vicente, 1999）来理解系统的约束。完成这些步骤的其他候选方法可以是\
  \ People, Activity, Context, Technology（PACT），或 Activity Analysis（St-Vincent et\
  \ al., 2014）。更具体地说，WDA 在五个层级层次中识别工作环境中的约束，即抽象层次（Rasmussen, 1985）。我们还建议使用 Neumann\
  \ et al.（2021） 的第 2 步，该步骤识别与系统交互的人类角色。最后，我们建议使用动机设计框架的第一步，其中涉及衡量用户的认知和情感特征。使用这些方法可以更全面地了解系统的环境。\n\
  \n2. **Step 2—Task identification**。此步骤包括识别系统中涉及人类的不同任务。如果适用，应识别系统中涉及人类的任务或工作特征的变化。这是指检查为系统中所有相关人员添加或删除了哪些任务或工作特征（例如，额外的子系统监控、减少的体力劳动）。这类似于\
  \ Neumann 等人模型中的第 3 步。\n\n3. **Step 3—Work demand analysis**。此步骤需要评估通过上一步识别的任务的感知、认知、心理社会和身体需求（Neumann\
  \ 等人框架中的第 4 步）。此外，我们建议识别影响操作员自主感、胜任感和归属感的环境和任务特征（积极或消极）（例如，单调、孤立、决策自由度）。例如，任务重复和单调会阻碍这些需求，而监督支持和技能发展计划可以促进它们。这是指动机设计框架的第\
  \ 2 步。最后，我们建议使用现有文献来了解已识别的工作需求如何直接和间接地影响成功标准。\n\n4. **Step 4—Outcome analysis**。对于此步骤，应使用各种工具（例如，问卷、神经生理学）对感知、认知、心理社会和身体需求进行定量或定性测量。此外，还应测量相关结果（例如，绩效、心理和身体健康）。此步骤类似于动机设计框架中的第\
  \ 4 步和 Neumann 等人框架中的第 5 步。\n\n5. **Step 5—Work design**。此步骤涉及具体应用前几步的发现。这是通过设计、更改或实施社会技术系统或界面来实现的，以增强人类与其他代理在社会技术系统内的交互。在可能的情况下，还应调整组织环境。此步骤相当于动机设计框架的第\
  \ 5 步。\n\n6. **Step 6—Outcome analysis of new or modified socio-technical system**。一旦系统部署，此步骤包括重新测量工作需求和结果指标。这是为了验证分析的应用（第\
  \ 5 步）。必要时，应改进或重新设计系统、界面和组织环境。\n\n### 23.4 案例研究\n\n在本节中，我们说明了 HUMAI5.0 在两个领域中与 AI\
  \ 代理协作（重新）设计人类工作的应用：制造中的错误检测和飞机维护中的质量控制。\n\n#### 制造中的错误检测\n\n### Context\n\n在一家雪鞋制造工厂内，装配线上最后一位操作员负责在产品发送给客户之前进行错误和缺陷检测。从本质上讲，这位最后的操作员负责产品质量控制。无缺陷的雪鞋放在工作站一侧，而有缺陷的雪鞋放在另一侧。Figure\
  \ 23.2 显示了操作员使用的工位。目前，质量控制是手动进行的，即没有任何技术系统支持。为了帮助操作员，计划实施基于人工智能的错误检测系统（AIEDS）。该\
  \ AIEDS 将使用计算机视觉检测组装雪鞋中的可能错误和缺陷，并在其工作站的计算机屏幕上向操作员展示结果。\n\n![Figure 23.2 Workstation\
  \ used by operators.](img/fig23_2_B.jpg)\n\nFigure 23.2 Workstation used by operators.\n\
  \n在实施之前，应用了 HUMAI5.0 以全面了解人机交互。测试了 AIEDS 的两个版本并与当前的工作方法（无 AIEDS）进行比较。在版本 A 中，AIEDS\
  \ 指示操作员是否存在问题。它在错误/缺陷检测方面具有完美的可靠性（100%），并且 AIEDS 决定是否将雪鞋发送给客户。在版本 B 中，AIEDS 具有不完美的可靠性（83%），决策权转移到操作员，由操作员决定是否将产品发送给客户。\n\
  \n##### Framework Application\n\n###### Step 1—Analysis\n\n应用了 CWA 的工作域分析。它使我们首先划定了系统的目的，即通过交付无缺陷雪鞋实现客户满意度。然后推导出域值（系统性能、任务参与度、平衡的心理负荷、平衡的压力水平等），随后是域功能（心理需求、动机、图像映射能力、深度和几何理解、错误复杂性、培训、经验等）。最重要的是，我们能够通过手段-目的关系绘制出值与功能之间的相互依赖关系。WDA\
  \ 绘制出错误复杂性、培训和经验影响心理需求，而心理需求影响系统性能。WDA 还显示图像映射能力、深度和几何理解以及错误复杂性影响系统错误检测性能。最后，我们识别了工作系统的物理组件及其功能（例如，用于\
  \ 3D 计算机视觉的摄像机）。\n\n![Figure 23.3 Framework application to case study #1.](img/fig23_3_B.jpg)\n\
  \nFigure 23.3 Framework application to case study #1.\n\n还应用了 Neumann et al. (2021)\
  \ 的第 2 步。该系统的主要人类是装配线上的最后操作员。我们还确定了必须最初校准和维护 AIEDS 以确保正常运行的工程师。\n\n\n\n\n\n我们随后在\
  \ HMI 的动机设计中应用了步骤 1 的用户分析部分。我们使用一般因果取向量表评估了操作员的人格特征（`trait engagement`）（Deci & Ryan,\
  \ 1985；Ryan & Deci, 2008）。该问卷使我们能够控制体验某一特定水平动机或投入的先天倾向，从而可能影响我们对 AIEDS 类型对各项指标影响的评估。\n\
  \n最后，选择了可衡量的成功标准。系统性能通过以下方式衡量：（1）验证 30 双雪鞋所需的时间和（2）错误检测性能（正确分类的雪鞋百分比）。工作域分析得出的其他重要指标，如操作员心理需求（工作负荷）、动机和投入，则通过问卷进行测量，并在可能时使用生理测量。问卷和生理测量是基于文献检索选择的。\n\
  \n### Step 2—Task Identification\n\n我们确定了 AIEDS 的引入如何改变工作任务。使用版本 A，操作员将不再检查雪鞋中的错误/缺陷。他们只需查看计算机屏幕即可确定将雪鞋放在哪一边。本质上，操作员的工作变得自动化，没有任何决策责任，其角色仅限于在系统故障或出现异常时进行干预。使用版本\
  \ B，操作员将继续检查缺陷，因为 AIEDS 的可靠性不完美。操作员将承担监督角色，验证 AIEDS 的建议是否正确。操作员对缺陷是否存在拥有最终决定权。\n\
  \n### Step 3—Work Demand Analysis\n\n在此步骤中，我们检查了 AIEDS 可能如何影响感知、认知、心理社会和身体需求。通过文献，我们还评估了这些变化需求对我们成功标准可能产生的影响。我们预计身体需求不会发生变化。我们预计\
  \ AIEDS 的两个版本都会导致操作员认知负荷的降低，因为操作员不再需要手动检测错误。自动化程度最高的版本 A 预计会导致认知负荷的最大降低。我们预计两种 AIEDS\
  \ 都会提高操作员的绩效，其中版本 A 的绩效最佳。然而，版本 A 使操作员几乎没有决策自由度且单调性很高。因此，我们预计版本 A 会导致感知自主性、内在动机和任务投入降低。另一方面，版本\
  \ B 为操作员提供了完全的决策自由，即同意或覆盖 AIEDS。因此，我们预计版本 B 会导致感知自主性、胜任感、内在动机和投入感的改善。\n\n### Step\
  \ 4—Outcome Analysis\n\n为了评估 AIEDS 对操作员任务的影响，我们设置了一项试点研究，九名工程学生参与其中。参与者被随机分配到三个条件之一（手动、AIEDS\
  \ 版本 A 或 AIEDS 版本 B）。参与者接受了培训，以完成任务并通过检测错误/缺陷与 AIEDS 交互。完成此培训任务后，参与者完成了实验任务，该任务包括对\
  \ 30 双雪鞋进行分类，其中 6 双存在缺陷。\n\n性能时间与错误检测——AIEDS 的两个版本均比手动执行任务在性能时间和错误检测率方面表现更好。然而，在比较版本\
  \ A 和版本 B 时未观察到差异。\n\n心理需求（认知工作负荷）——认知工作负荷在 AIEDS 版本 A 时最低。版本 B 与手动执行之间未检测到差异。根据量表作者提供的指南解释平均值（Hart\
  \ & Staveland, 1988），AIEDS 的两个版本均导致 *中等* 心理需求，而手动执行导致 *相当高* 的需求。\n\n感知自主性与胜任感——AIEDS\
  \ 版本 B 导致感知自主性最高。版本 A 与手动执行之间未发现差异。感知胜任感未观察到差异\n\n内在动机——我们发现 AIEDS 版本 B 导致内在动机最大。版本\
  \ A 与手动执行之间未观察到差异。\n\n任务投入——版本 B 的 AIEDS 感知投入高于版本 A。版本 B 与手动执行之间未观察到差异，版本 A 与手动执行之间也未观察到差异。对于生理任务投入，版本\
  \ B 最高，其次是手动执行，然后是版本 A。\n\n### Step 5—Work Design\n\n结果分析结果表明三个条件之间存在重要差异。AIEDS\
  \ 的两个版本均导致性能显著提高，在比较版本 A 和版本 B 时未观察到差异。然而，与版本 A 相比，版本 B 在感知自主性、内在动机和任务投入方面带来了更好的结果，同时保持了可接受的认知工作负荷。这些结果与长期绩效、福祉、技术接受度、员工保留和组织公民行为直接相关（Deci\
  \ et al., 2017；Van den Broeck et al., 2021）。因此，结果分析表明，AIEDS 版本 B 将在长期内带来最优化的人机交互，因此应予以实施。\n\
  \n### Conclusion\n\n将这些步骤应用于本案例情境使我们能够考虑人机关系的所有方面。我们系统地比较了完成工作任务的三种方法，以确定哪种方法能为操作员和组织带来最佳结果。虽然\
  \ AIEDS 版本 A 完全自动化，从而限制了操作员的自主性，但版本 B 通过允许操作员对 AIEDS 的建议拥有最终决定权，给予了操作员更大的决策自由度。对任务进行部分自动化使操作员承担了更具监督性的角色，该角色被认为更有意义和令人满意，导致短期结果优于版本\
  \ A。反过来，这些积极的短期结果将发展为操作员和组织双方的积极长期结果。\n\n## Quality Control of Aircraft Maintenance\n\
  \n### Context\n\n\n\n\n\n本真实案例研究探讨了在研究项目中整合人为因素，以设计一个用于自动化飞机部件检查的网络物理系统（CPS）。工业检查是一项劳动密集型且知识密集型的任务，由熟练操作员执行。他们的目标是确保飞机部件无有害缺陷。操作员仔细检查每个部件是否存在潜在异常，一旦检测到异常，便会对其进行评估并与多个决策标准进行比较。设想了一个基于机器视觉的系统，以支持检测和诊断服役部件（如燃气涡轮、盘、轴和风扇叶片）上的缺陷，帮助检查员完成这项繁琐的任务。从概念验证（技术成熟度等级\
  \ 3）开始，技术开发计划的目标是达到技术成熟度等级 6，即在相关（运行）环境中展示技术功能。HUMAI5.0 被应用于将人为因素输入纳入遵循技术中心设计路径的项目中（见\
  \ Figure 23.4）。此外，由于之前因人类与自动化诊断不匹配而导致的实施失败，项目负责人也有动力去深入了解检查员如何执行检查。该框架使我们能够理解、建模和评估人工检查是如何进行的。基于这种理解，推导出需求以指导工程过程，同时考虑未来联合人机检查工作流程。\n\
  \n![Figure 23.4 Framework application to case study #2.](img/fig23_4_B.jpg)\n\n\
  Figure 23.4 Framework application to case study #2.\n\n由于篇幅限制，本案例研究的细节在本图书的在线补充材料中呈现。读者还可查阅有关该主题的先前出版物（Cabour,\
  \ 2023; Cabour, Ledoux, et al., 2022a; Cabour, Morales-Forero, et al., 2022b）。\n\
  \n### Concluding Remarks\n\nAI 技术在复杂社会技术环境中的引入改变了操作员在工作场所中的角色和职责。在本章中，我们展示了采用以人为中心的、用于设计工业中人机协作的方法，能够发挥双方的最佳能力，打造一个尊重人类员工长期福祉且有利于组织的工作环境。为此，我们提出了\
  \ HUMAI5.0 框架，以系统地分析工作域、（重新）设计人机交互并评估其结果。事实上，该框架强调需要进行民族志研究，以把握 AI 赋能技术将被部署的运营现实。这种强调与本章中引用的其他框架和方法产生共鸣，这些框架和方法依赖于用户中心设计来进行技术开发项目，例如\
  \ CWA。HUMAI5.0 的优势在于将这些在各自领域使用的现有方法整合为一种整体设计方法，使利益相关者能够对 AI 在其工作场所的影响以及如何最好地应对其影响形成共同理解。例如，哪些任务被完全自动化或部分自动化？我们如何适当地重新设计工作以实现人机协作？由于\
  \ AI 的整合改变了工作实践，这些方法有助于在技术开发周期中（而非实施后）设想和设计未来的工作实践，从而避免陷入经典的自动化问题，例如任务-技术不匹配（Loup-Escande,\
  \ 2022; Spies et al., 2020）。案例研究 2 通过系统地设计与工作需求相符的有效人机工作流程和用户界面来说明这一点。案例研究 1 深入探讨了工作绩效与动机之间的联系，探索人们对其工作赋予的更深层次意义。\n\
  \n近年来，AI 的兴起一直是讨论的热门话题，许多专家预测会出现大规模失业的黯淡未来（Employment & Skills, 2014; Forum, 2016）。然而，本章采取了更细致的观点，承认虽然\
  \ AI 无疑会改变工作的性质，但它不一定会导致广泛的失业。相反，AI 更有可能自动化人类过去执行的特定任务，而新的任务将从人类与 AI 的协作中产生。例如，AI\
  \ 可以监测人类状态，例如检测疲劳或压力迹象，而人类可以验证 AI 系统对关键决策的输出。这种工作转型需要对人机系统有更整体的看法。 rather than viewing\
  \ humans and machines as separate entities, it’s essential to consider them as a\
  \ whole. HUMAI5.0 可以通过实现一种更连贯的方法来设计有效且人性化的联合人机工作，从而弥合这一差距。\n\n本章展示了 HUMAI5.0 在两个认知要求较高的领域，即制造中的错误检测和飞机维护中的质量控制中的成功应用。这也证明了该方法的多样性，既可应用于实验环境，也可应用于自然情境。我们相信该框架可应用于工业环境之外，以支持\
  \ AI 项目从技术中心向更以人为中心的设计的转变（例如社会环境项目）。将该框架应用于其他领域将创造机会来研究它如何支持决策者在 AI 项目中考虑人类和组织因素。此外，将我们的框架应用于更大规模的科学实验，以研究工作场所中的人机交互，可以帮助进一步完善它。\n\
