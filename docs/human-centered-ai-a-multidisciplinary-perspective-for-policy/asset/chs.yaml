  \ Rodriguez, National Film Board of Canada.)**\n>\n> 换句话说，一个本已复杂的决策过程变得更加复杂。作为前进方向，有人指出公众参与和一般数据素养的重要性（Gentelet\
  \ and Mizrahi, 2023）。然而，动员公民参与并放大他们的声音在历史上一直被证明是困难的。当 AI 的定义在学术界仍在争论时，如何邀请公众对困难的主题发表意见？当\
  \ AI 工具被宣传为高度专业化时，如何促进数据素养？我们所有人如何参与引导 AI 的未来？现在是时候打开对话了。\n>\n> 本章建议艺术和艺术体验可以鼓励\
  \ AI 素养和公众参与。艺术诠释可以帮助确保广泛的受众掌握鼓励参与重要决策的一般概念。艺术可以帮助说明如何：（1）AI 系统在过去积累的数据上运行（突出显示哪种类型的数据，在何种背景下）；（2）人类决策过程影响算法结果；以及（3）如果我们想避免其当前的陷阱，我们也需要彻底重新想象\
  \ AI 的用途、应用和发展。总之，我们需要艺术作品帮助更广泛的受众解构 AI，以便我们都能更好地共同想象其未来。\n>\n> 在过去几十年中，计算艺术实践，如控制论或机器生成艺术，经常使用\
  \ ML 应用、语音识别软件和其他常见技术（Audry, 2021），引发了对 AI 创造力的关键问题。更重要的是，这样的创意项目通常被证明有助于突出人类/AI\
  \ 互动研究中被忽视的因素：意义的概念——我们如何赋予技术、其实践和应用以意义。我们将与人类构建的 AI 程序对话赋予什么价值？在坦诚或复杂的对话中，我们给予“人工实体”及其回应什么价值？这些如何渗透到我们的社会结构中并影响我们想象与\
  \ AI 的未来方式？\n>\n> 为了铺垫，本章建议需要专注于解构我们集体用来解释 AI 的隐喻的创意体验，在此过程中突出塑造其当前发展的价值观和偏见。\n\
  >\n> 为此，我们从研究创作体验 *CHOM5KY vs. CHOMSKY* 中汲取教训\n>\n> 当参观者走进展览空间时，他们被邀请以四人一组戴上 VR\
  \ 头盔。当他们进入 VR 世界时，他们各自然后集体地，遇见、交谈并与一个独特的 AI 指南 CHOM5KY 互动。从这次体验中获得的教训提出了理论和实践问题，我们在此讨论。为此，我们首先将解构\
  \ AI 的需求置于围绕人类-机器比较而构建的虚构叙事的传统中。然后我们以 CHOM5KY vs CHOMSKY 为案例研究，讨论意义和文化漂移的概念。第三，我们重新审视用户反馈中的关键启示，强调具身互动和游戏的重要性。我们最后重新评估重新审视集体共享叙事的需求，特别是当我们邀请公民重新思考我们对\
  \ AI 的期望时。艺术体验不仅揭示意义；我们相信它们也创造意义。\n\n### 关于艺术与仿真：通过 AI 解构 AI\n\n\n\n\n\n我们今天谈论人工智能的方式延续了将计算程序与人类认知相比较的传统。我们借鉴机器的逻辑、结构和功能来描述我们说话、思考和创造的方式。这种隐喻的盛行对我们如何构想人工智能具有重要影响。无论是真实还是想象，对即将到来、不可避免的人工智能未来的持续却模糊的承诺都伴随着后果严重的困境：如果我们要为这样的未来做准备，我们应该讨论哪些机遇和危险？我们应该为像\
  \ Dall-E 或 Midjourney 这样的创意发展喝彩吗\n\n学者有时抱怨公众对人工智能的理解不够，无法区分虚构与现实，但这种假设并不公平。人工智能的概念本身在理论上仍受挑战，人们在争论它应涵盖什么范围。人工智能仍然被呈现为一种“事物”，而不是不同技术的总称。关于人工智能的未来主义隐喻模糊了人们对算法在今天如何被使用的讨论，例如用来挑选有前途的求职者、决定器官移植的潜在接受者，或制作政客、著名演员、前女友等的\
  \ deepfake 视频。此外，将人工智能描述为处于“婴儿期”或“需要时间成长”会营造出一种自然萌生的感觉：回避了支撑其发展的政治和经济决策所带来的重要问题。人工智能被塑造成像天气一样——不受束缚、不可预测且不可避免。例如，很少有人谈论全球数百万名被低薪雇佣的“幽灵工人”，他们被雇来假装自己是网站上的机器人，为计算机视觉标注图像、修正自然语言处理的错误，或转录音频文件。\n\
  \n在这种背景下，迫切需要的公众素养不断被旨在让人工智能显得未来主义或高度专业化的词汇所遮蔽。为了提高公民参与度，我们首先需要去神秘化人工智能。我们需要提供经验和空间，帮助公民质疑：我们希望用人工智能实现什么？谁被纳入了对话？谁没有？\n\
  \n当然，这样的努力是复杂的。以人工智能为例，流行的观念建立在这样的承诺之上：有一天，我们能够与“栩栩如生”的实体互动，这些实体可以模仿（或取代）人类存在——在过去，这类实体在科幻作品中常被描绘为机器人，有时是虚拟实体：想想好莱坞的\
  \ *A.I*、*Ex-Machina*、*Her* 等。在现实生活中，其他当代项目也利用人工智能让观众产生与过去人物对话的感觉——例如 AI-Dali 指南邀请博物馆参观者会见一个人工的萨尔瓦多·达利，或类似的实体，如\
  \ AI 重现的奥黛丽·赫本、肯尼迪和尼克松。\n\n这些虚构叙事和人物在当代多模态人机交互（HRI）研究中找到了回响。机器人与人类之间交流的多方面特征不仅限于语言，而是建立在文化建构的叙事之上，以帮助用户感到安心，或营造一种“规则”感。正如研究所示，这种拟人化有助于强化关于“人工实体”（在这种情况下是机器人）应是什么样的隐喻、语言和集体共享的想象——以及我们应如何与之相处（Bonarini,\
  \ 2020；Häring et al., 2014；Dautenhahn et al., 2009；Koay et al., 2020）。与机器人和人工智能并行，虚拟现实和增强现实（VR、AR）技术在头戴式显示器（HMD）、显卡性能以及\
  \ VR 在工作和休闲中的使用方面的改进下大幅加速。结合“元宇宙\n\n如果我们把事情放回上下文，这种永恒的承诺其实并不新鲜。20 世纪见证了将机器比作活体有机体并思考栩栩如生机器未来的隐喻的蓬勃发展。在战争之后，控制论与后现代哲学并行发展（Lafontaine,\
  \ 2004）。当时的叙事科幻支持了一种文化、地理和历史立场，选择用生物学的视角去去神秘化技术发展。例如，为了促进机器的接受，其功能被用与自然和人体相关的隐喻来解释：马达不是通过机械部件来描述，而是“像心脏一样”工作。Lafontaine\
  \ 强调了控制论带来的范式转变。突然间，用来解释人类生物学的就是机器和电气隐喻。例如：心脏会被描述为用瓣膜运作，“像机器一样”。随着控制论和后现代主义的持续进步，用来解释技术发展的拟人化隐喻越来越多地聚焦于后现代珍视的价值——自由意志和创造力。从帮助我们思考的机器，我们开始思考（并谈论）我们的心智如何像机器一样运作。\n\
  \n这一传统帮助我们理解了今天痴迷于比较人类心智和人工智能系统的原因。但让我们明确一点。这些只是隐喻——它们并不能告诉我们太多关于我们心智的工作方式；坦率地说，它们也并不能告诉我们人工智能系统如何运作。此外，现在是时候重新审视过去建构的叙事了。毕竟，如果人工智能无处不在，我们重新思考与有机生命的关系的需求也无处不在。我们有独特的机会在这里重新定义我们赋予人工智能实体的价值，超越以人为中心的观念。为什么我们不使用新的隐喻，将我们的大脑比作树、菌丝真菌或肠道细菌中发现的有机连接呢？为什么总是将其与机器相比？我们认为，艺术作品可以帮助识别社会和文化建构的先入之见——因为最重要的是，突出这些先入之见可以帮助重新思考所需的新的先入之见。\n\
  \n### 反思意义：CHOM5KY vs. CHOMSKY 作为案例研究\n\nVR 和人工智能体验 *CHOM5KY vs. CHOMSKY*，在此作为案例研究呈现，利用人工智能来去神秘化人工智能。通过虚拟可供性和有趣的用户体验（UX），这件艺术作品质疑人工智能的局限和机遇，同时凸显我们人类创造力、探究和协作的能力。正如乔姆斯基所建议的，我们对自己的心智知之甚少。因此，艺术作品提出的问题是：我们到底在人工智能中试图复制什么？为了什么目的？我们又在留下什么？\n\
  \n包括诺姆·乔姆斯基（NC）本人在内的作家和思想家警告我们人工智能中“伪科学”的倾向——我们认为这种倾向也有损于公众参与。特别是，乔姆斯基反对对“理解我们自己和世界的启示迫在眉睫”所做出的持续承诺（Chomsky,\
  \ Roberts, Watumull, 2023；Marcus and Luccioni, 2023）。他的反对意见在 Bender and Koller (2020)\
  \ 中找到了回声，他们认为大型语言模型成功的部分原因归因于用来描述它们为“智能”、“学习”和“理解”的词语。Bender 坚持认为，人工智能学者应该问的问题是，为什么它被设计成让我们相信它有思想和感受呢！\n\
  \n> “旨在可信地模仿人类的应用会带来极端伤害的风险 […] 合成人类行为是伦理人工智能发展的明线，其中下游影响需要被理解和建模，以便阻止对社会和不同社会群体的可预见伤害”。\n\
  >\n> （Bender, 2021）\n\n\n\n\n\n混淆数学公式与意义建构过程之间的界限，在最坏的情况下是有害的，在最少的情况下也是错误的。为了帮助改变这一前提，源自社会变迁社会学并由\
  \ Herbert Blumer 在 1950 年代发展起来的文化漂移的理论框架是有帮助的。对 Blumer 来说，社会变迁太常通过有组织的结构（社会运动、政府决策、公共法规）来分析。他认为，社会变迁发生在更错综复杂的层面：通过文化和艺术的发展，通过新的消费形式出现，或通过新价值观在年轻一代中的普及化（Melucci,\
  \ 1996；Rodriguez, 2013）。这种文化漂移很难观察到，但似乎在时间上更为普遍——它们影响着整整一代人的价值观、想象力和集体参照。\n\n对于研究而言，对社会变迁做出意义建构也意味着将其界定为一个分析对象：关注个体如何在特定时刻、或在特定空间或体验中创造和挑战某一特定价值观和“意义”集合（Dervin\
  \ and Frenette, 2001, Rodriguez 2013）。这里使用的理论框架帮助我们思考 *意义* 并非既定不变，而是不断演进之物：艺术如何促成“文化漂移”——例如赋予\
  \ AI 的意义发生变化。\n\n从语言学角度来看，乔姆斯基关于生成语法的理论讽刺地因没有为分析意义留下足够空间而受到批评（Jackendoff, 2002）。另一些人则建议（Bhava,\
  \ 2008）NC 关于语言的理论将隐喻直接与意义联系起来。乔姆斯基本人大量的会议和访谈记录表明他自己也大量使用隐喻，在不同领域之间架起桥梁（政治、组织、心理），并使用日常例子来解释复杂问题（例如，将\
  \ AI 比作有用的除雪车）。总之，乔姆斯基自身的人类创造力使他能够根据访谈者和情境回应并调整隐喻——每次都创造新的意义。项目 *CHOM5KY vs. CHOMSKY*^(*\\\
  [5\\]* ) 正是在此概念上展开，邀请访客探索我们集体赋予 AI 的意义是什么，并帮助他们重新思考想要的未来。\n\n研究创作于 2016–2023 年间进行，结合了语音转文本和文本转语音（`STT`）、NLP\
  \ 对话系统（`GPT-2`、`GPT-3.5`）和 `VR`。用户戴上 VR 头显进入一个计算机生成的世界，很快会遇到一个名为 `CHOM5KY` 的 AI\
  \ 指南。该 AI 角色由著名 MIT 语言学荣休教授 Noam Chomsky 在网上或 MIT 档案特藏中发现的大量数字痕迹构建而成。1928 年出生于费城的\
  \ `NC` 是世界上记录最多、数字化程度最高的公众知识分子之一。60 多年来，他几乎被记者、农民和学生等采访过所有主题，他的演讲已被转录、数字化并上传到网上，留下了可用于训练\
  \ AI 系统的天文数字般的数据池。也许鲜为人知的是，`NC` 关于自然语言的工作也部分启发了自然语言处理（`NLP`），它使我们能够与聊天机器人互动。因此，`NC`\
  \ 的数字痕迹遗存悖论式地帮助我们构建一个可以讨论 AI 的 AI 系统，使用乔姆斯基自己的词语和句子，并且仍然忠实于乔姆斯基坚持认为 AI 在复制人类大脑方面存在谎言和局限。\n\
  \n`CHOM5KY` 这个 AI 因此成为一个角色——一个完美的案例研究和完美的向导，帮助去神秘化 AI。AI 角色从未假装自己就是乔姆斯基本人。![Figure\
  \ 17.2 By playing and tinkering with CHOM5KY’s answers, the experience helps visitors\
  \ grasp the basic logics of LLM chatbots. (© Sandra Rodriguez, National Film Board\
  \ of Canada and SCHNELLE BUNTE BILDER.)](img/fig17_2_B.jpg)\n\nFigure 17.2 By playing\
  \ and tinkering with CHOM5KY’s answers, the experience helps visitors grasp the\
  \ basic logics of LLM chatbots. **(© Sandra Rodriguez, National Film Board of Canada\
  \ and SCHNELLE BUNTE BILDER.)**\n\n当然，作为一种艺术诠释，该体验采取了创造性的自由。作为一名活动家，`NC` 挑战限制人类创造力的庞大企业。作为一名语言学家，他坚持认为大型语言模型无助于理解心智。\n\
  \n该体验在三个不同地点向公众展示：Sundance 电影节（2020 年）、柏林 KINDL 艺术中心（2022 年）和蒙特利尔 Quartier des Spectacles（2023\
  \ 年）。通过观察公众与 `CHOM5KY` 互动所学到的经验教训，在分析个体如何与人工实体互动方面证明是富有成效的。例如，初始互动通常会迅速将 AI 指南拟人化，尽管\
  \ `CHOM5KY` 本身拒绝这种观点：“你好吗？”，“你孤独吗？”，“你住在哪里？”，似乎是用户在玩一种图灵测试的方式，推动极限并测试机器人的“可破坏性”。我们的\
  \ AI `CHOM5KY` 不断否认这种观点：“如果你觉得好笑可以这么叫我，但这 hardly 是一个准确的描述。”\n\n随着体验的推进，以及访客越来越能够“窥探”生成答案系统内部，他们开始提出更多关于系统\
  \ *如何* 工作的问题：“你的系统建立在什么之上？”，“谁建造了你？”，“你是 Siri 吗？”，“你是 Open AI 拥有的吗？”，“算法是什么？”，“你有偏见吗？”\
  \ 等等。在测试聊天机器人并发现答案是如何由系统串联起来的之后，体验的第三部分邀请访客揭穿算法问题解决。通过这样做，`CHOM5KY` 邀请访客玩一个游戏——一个谜题——而不告诉他们规则或如何玩。访客需要本能地创造性和协作性地解决它。与此同时，`CHOM5KY`\
  \ 这个 AI（引用真实的乔姆斯基访谈）提醒他们，协作和创造力对于任何 AI 系统来说都是非常困难的，如果不是不可能的任务。令人惊讶的是，访客越能理解或质疑算法与人类解决方案之间的差异，他们就越开始把\
  \ `CHOM5KY` 当作神谕：“人类的未来是什么？”，“你很快就能感受到吗？”，“动物会做梦吗？” 换句话说，用户更热衷于测试与 *其他* 用户共享的价值观，寻求理解\
  \ *如何* 它反映在机器人的答案中：“你对自然的信念是什么？”，“谁编写了这种信念？”，“意识对你意味着什么？” 有些人甚至只是要求它揭示我们的集体未来：“你认为谁应该赢得选举？”，“我们会挺过气候变化吗？”，“AI\
  \ 会统治世界吗？” 等等。\n\n通过观察访客在对话、探究、协作和创造的不同阶段的互动，我们了解到创造帮助公众暂停并超越他们对 AI 系统期望的表面的体验的重要性。特别是，研究结果凸显了游戏的重要性，作为一种特别有效的方式来挑战公民的先入之见，并帮助他们重新思考自己在与\
  \ AI 相关的当前问题上的立场。随着 `CHOM5KY` 越来越多地帮助访客注意到周围其他用户的存在，它帮助他们质疑为什么我们首先被期望单独与 AI 互动。最后，使用具身\
  \ `UX` 鼓励用户以非智性方式重新考虑他们与数据的关系，邀请他们重新思考我们赋予数字痕迹当前使用的价值观和意义（Figure 17.3）。\n\n\n\n\n\
  \n![图 17.3 左图显示，诺姆·乔姆斯基的言语痕迹和数字化句子形成积木，塑造并创造了 VR 世界。右图显示，用户可以从自身痕迹产生的数据积木中构建自己的结构和自然景观（体验中提出的问题、主题、意图、检测到的情感等）（©\
  \ Sandra Rodriguez，加拿大国家电影局和 SCHNELLE BUNTE BILDER。）](img/fig17_3_B.jpg)\n\n图 17.3\
  \ 左图显示，诺姆·乔姆斯基的言语痕迹和数字化句子形成积木，塑造并创造了 VR 世界。右图显示，用户可以从自身痕迹产生的数据积木中构建自己的结构和自然景观（体验中提出的问题、主题、意图、检测到的情感等）\
  \ **(© Sandra Rodriguez，加拿大国家电影局和 SCHNELLE BUNTE BILDER.)**\n\n### 关于隐喻：我们正在抛弃什么？\n\
  \nCHOM5KY vs. CHOMSKY 远非唯一一件质疑人工智能的当代艺术作品。在 *Conversations with Bina48* 中，艺术家 Dinkins\n\
  \n邀请观众批判性地思考人工智能的隐喻、词汇和文化假设已被证明有助于培育新的公众参与形式，以创造以人为中心的 AI。通过让体验对所有人开放，我们得以认识到具身性和游戏如何能够帮助民主化，让各种公民进入对话。虚拟世界使访客能够触摸、摆弄并看到其他用户在世界中与\
  \ AI 系统互动。VR 因此使我们能够创造一个根据用户存在和行为而变形的世界——例如，如果他们更深入地探究系统的工作原理，或更宁静地沉思周围环境。而且他们也会不断看到他人这样做，帮助他们感觉自己也能成为集体质疑的一部分。\n\
  \n我真心相信，游戏和幽默可以帮助去神秘化我们每个人在塑造技术中所扮演的角色。在之前的艺术作品中，我经常亲自选择误用技术来揭穿关于它的神话。在 *Do Not\
  \ Track*（2016 年皮博迪奖）\n\n不出所料，用户在虚拟世界中玩得越多，他们的问题就越多样化。在当前聊天机器人的开发中，这通常被视为有问题。这使得“控制”AI\
  \ 可以做出何种回应变得危险：如果它开始使用歧视性词汇怎么办？如果它开始对用户咒骂怎么办？我们认为，与其通过创建回应预期的聊天机器人来回避此类问题（这是一个营销目标），我们更应该以透明的方式展示其缺陷、偏见以及其训练所用的材料（这是一个教育目标）。在\
  \ CHOM5KY vs Chomsky 独特的 UX 方法中，我们从未告诉用户该做什么：访客自身的能动性被置于最前沿。我们的系统局限很多，但我们让它们对观众变得显而易见——为访客提供平衡的视角，以便他们自行判断\
  \ AI 的局限性和机遇。\n\n### 结论\n\n今天与人工智能相关的技术进步与营销噱头、流行文化和虚构启发的集体想象混为一谈。在这种背景下，人工智能是否被理解为理论建构是次要的。更重要的是，需要重新评估与“智能”、“学习”和“理解”相关联的集体建构的想象和词汇。毕竟，正如社会变革社会学帮助我们强调的那样，人工智能的概念并非固定不变。它是通过公民对人工智能的意外恶作剧、通过日常使用以及通过持续的技术发展而被分享、讨论、辩论和改变的——参与塑造我们共同想象人工智能未来的文化漂移。通过邀请\
  \ *CHOM5KY vs. CHOMSKY* 的访客去去神秘化人工智能的工作方式，我们努力创造一个空间，使他们能够重新思考我们集体赋予人工智能系统的价值观和意义——换句话说，邀请他们对其提出挑战。\n\
  \n分析人类与人工智能互动的社会学著作太常将使用理解为逻辑上由技术驱动。但人类是混乱的：我们破坏、重新思考、重新利用。正是通过测试和打破系统，我们重新想象应用——从而彻底改变技术。\n\
  \n本章第二部分强调了艺术将更多公众参与带入人工智能未来所需对话的变革能力。为此，我们重新审视了研究创作项目 CHOM5KY vs Chomsky 所获得的经验教训，特别是我们从观察用户与\
  \ CHOM5KY AI 的互动中汲取了教训。正如预期，访客最初测试了机器人的（以及世界的）极限，与我们的 AI 向导进行某种图灵测试。但随着他们越来越多地测试、摆弄和玩耍以了解机器人如何运作，他们对机器人的拟人化程度越低，而越专注于其建构——它如何工作，它能做什么，谁训练了它，它是否有偏见，如何等。来自三个不同世界地点的各种用户对\
  \ CHOM5KY 提出的多种问题帮助训练了我们的第一个模型，并更好地衡量了用户对话的局限性。从 2020 年到 2022 年，该体验从与 CHOM5KY 的简单对话转变为\
  \ 2023 年包含更多创造性和协作性游戏——帮助重新思考我们赋予与人工智能共享未来的价值观。\n\n本章第三部分强调了最后一个重要且关键的发现——那就是艺术转变集体对话并创造公民可以自由重新思考、挑战和质疑先入为主观念的空间的变革能力。当然，让我们保持现实：研究创作和艺术项目很奇怪。很怪异。即使\
  \ VR 有助于降低建造机器人的成本，创造性的 VR 体验也可能很乏味且昂贵。整个研究创作过程耗时六年。但我们相信它有助于衡量人类/人工智能互动的重要机遇和局限。\n\
  \n通过选择以讲故事和游戏的方式解决重要问题，我们打造了一个空间，让访客能够 *思考*——关于机器，关于人工智能在能力上与人类协作和创造力有何真正不同，特别是他们可以在其中重新思考对人工智能未来的希望。CHOM5KY\
  \ vs. CHOMSKY 并非一种说教式体验。我们希望人们提出质疑，探究人工智能的工作方式，并了解机器和人类心智。VR 世界观本身就充满了隐喻，其中机器编程被比作蜜蜂的飞行模式，神经连接的未知被描述为我们肠道中的细菌。回顾该体验的目标时，我们认为公众参与的努力应从愉快的探索和体验中学习，因为它们创造了一个独特的机遇，让人们放下先入为主的观念，并为公民创造一个空间，让他们感受到并测试自己的能力、兴趣以及能动性的局限。我们相信，艺术有助于揭示社会变革所必需的意义建构过程。但我们从这次体验中最重要的教训是，艺术也可以创造意义。\n\
  \nCHOM5KY vs. CHOMSKY 等新兴、意外的讲故事体验之所以吸引访客，是因为它们出人意料且怪异。研究人员、艺术家和政策制定者在希望促进公众参与、公民参与人工智能辩论，甚至公民人工智能素养时，并不常追求怪异。然而，从艺术可以带来的东西中可以学到很多。在\
  \ ChatGPT 不断登上头条并被不断呈现为创造性的时代，\n\n### 注释\n\n1. 参见 Adams (2003)。\n2. 该短语由美国未来学家 Ray\
