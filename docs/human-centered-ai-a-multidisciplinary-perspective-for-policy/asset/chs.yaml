  \n## 9 Benjamin Prud’homme’s Commentary\n\nBenjamin Prud’homme\n\nMila—Québec Artificial\
  \ Intelligence Institute, Montréal, Québec, Canada\n\nDOI: [10.1201/9781003320791-11](https://dx.doi.org/10.1201/9781003320791-11)\n\
  \n* **Please tell us more about your work**.\n\nMila—Québec Artificial Intelligence\
  \ Institute 是一个由超过 1,000 名机器学习专家以及社会科学、法律、学习设计等领域的专家组成的社区，他们都致力于造福社会的创新和科学卓越。我领导其\
  \ AI for Humanity 部门，该部门专注于 AI 的负责任和有益发展。我们通过三个工作方向来实现这一目标：AI 治理——包括公共政策和监管；用于社会有益目的的应用研究项目；以及学习与教育。\n\
  \n我经常将后者这条工作线称为能力建设，这一点我非常关心。例如，我们与政策制定者合作，提高他们对 AI 的理解：“什么是 AI？”、“什么是生成式 AI？”、“这些技术如何运作？”、或“可以采用哪些方法来监管它们？”我们的意图不是规定具体的监管方法，而是支持我们的政策制定者——最终是我们的民主制度——理解\
  \ AI 的能力。我们还为来自技术背景的人提供学习和培训机会——无论是在研究还是行业——关于如何将负责任 AI 的反思和实践整合到 AI 研究、项目或公司中。\n\
  \n某种程度上，我们在 AI for Humanity 的总体目标是促进某些负责任/伦理 AI 原则的落地。因为如果这些原则的重要性现在已相当一致——想想可解释性、透明度、隐私等——将其付诸实践仍然是一个重大挑战。我们正试图通过搭建跨学科桥梁来应对这一挑战，汇聚那些互补性强、协作能使负责任\
  \ AI 原则得以实现的各方，无论是通过治理机制还是算法设计选择。这至关重要。事实上，我担心如果我们不认真对待并解决学科之间以及政策制定者与 AI 从业者之间的差距，我们提出的原则最终可能无法体现在\
  \ AI 系统和生态系统中。\n\n所以我认为我们不能承受将负责任 AI 的原则与实践之间的对话分开，前者被视为社会科学家、法学家和政策制定者的工作，后者被视为技术专家的任务。我们必须以社会技术的方式看待\
  \ AI，因此将算法设计视为一系列社会技术选择。我们需要组建跨学科团队以此方式应对，并为 AI 从业者提供工具，使其做出的选择与所提出的原则保持一致。\n\n\
  这让我想到在我读到的三篇文章之间似乎有一个共识性发现：我们刚才谈到的跨学科性，如果我们想实现以人为中心的 AI，将是核心。仅靠社会科学或法律视角不足以让我们充分理解和治理\
  \ AI。或者反过来说——我认为这才是我们现在面临的更大危险——我不认为技术人员，特别是行业，应单独为 AI 治理铺路。我还要更进一步：即使是一支强大的跨学科专家团队，也不应该单独制定我们的\
  \ AI 治理议程。\n\n这也是我在阅读的三篇文本中得出的结论：终端用户、边缘化社区以及更广泛的社会必须参与规则的制定。构建 AI 系统并参与原则和监管制定的相关人员需要认真与社会互动，以确保他们所构建的技术确实服务于其预期服务的对象，解决他们的问题而不制造新的问题。\n\
  \n* **Can you tell me a bit more about what you learned reading the articles? How\
  \ are they going to enrich your perspective on the kind of work you’re trying to\
  \ do at Mila?**\n\n我读了三篇论文：Valor 关于定义以人为中心 AI 的访谈，Larouche 关于“以人为中心的 AI：从概念审视到立法行动”的论文，以及\
  \ Bar-Gil 关于“重新定义以人为中心 AI：AI 推荐引擎的人类影响”的论文。有几件事我读后深表认同，很高兴看到它们被写成文字。\n\n首先，三篇论文各自以不同方式指出了跨学科性对以人为中心\
  \ AI 的根本重要性。然而——这并不是批评，而更像是邀请继续对话——我认为这些论文并未充分讨论有意义的跨学科合作有多困难，以及我们如何使其奏效。我们似乎正接近一个大多数人都喜欢并认同跨学科理念的阶段，但却没有投入足够的精力使其发挥作用。你知道，让一位伦理学家、社会学家或语言学家加入你的项目是一回事；创造必要的结构环境以将他们的观点整合到真正影响\
  \ AI 系统开发的方式中又是另一回事。跨学科合作极其困难，尤其是在有截止日期、交付成果，以及需要相互协作以创造产品或提出解决方案的人类团队的实际环境中。我不认为任何人已经完全弄清楚正确的做法。因此，对我而言，这些文章邀请我们思考如何在\
  \ AI 中开展有意义的跨学科工作。\n\n现在，另一件我很高兴在文章中看到的——特别是在 Larouche 的论文中——是对摆脱创新与监管之间虚假二分法的邀请。该论文提供了解决常被视为不可调和的困境的有趣思路。这非常有价值。我认为创新与治理之间的这种张力很危险，我们应该找到克服它的方法。Larouche\
  \ 提出的一种细致的中庸方法，结合了技术监管的宽容和保护性两种做法的元素，为应对这一挑战提供了一个有趣的角度。\n\n\n\n\n\n我非常喜欢 Shannon\
  \ Valor 的文章，特别是她将以人为中心的人工智能拆分为两个主要维度的方式：流程和产出——实际上，我不认为她明确使用了“产出”或“最终结果”这两个词，但这个想法无处不在——对我来说，这种区分非常有用，因为关注流程为我们打开了大门，可以采取具体的日常行动，在我们的工作中实施以人为中心的人工智能。例如，如何框定问题？Valor\
  \ 建议——我也同意这一点——技术人员应避免自行框定问题。相反，他们应与受影响的利益相关者和社区密切合作，并向他们提问：“你需要什么？技术如何支持你？”这种自下而上的方法与她所称的“逆向适应”形成鲜明对比，后者简单来说，是一个技术人员群体提出解决方案，然后再尝试调整它以使其适用于（或被）一线人员购买的过程。\n\
  \n所以，是的，退一步，更多地（或至少同等程度地）关注流程而不是最终结果，对像 Mila 这样的 AI 研究所来说是一个非常令人振奋的邀请。它给了我们所有这些可以发挥的具体考虑。它鼓励我们发挥创造力，想出让人们参与我们流程的新方法。例如。然后，我们可以进行实验，开展试点，并公开与社区分享这些试点的结果——无论是积极的还是消极的。\n\
  \n最后，有一个问题，我看到它贯穿了全部三篇文章，却从未得到充分解决——至少不是我希望的那样深入。也就是说，我们所生活的经济环境和体系深刻地影响着我们思考人工智能治理的方式。Valor、Bar-Gil\
  \ 和 Larouche 各以自己的方式讨论了这样一个事实：极大的权力集中在为数不多的公司手中；这种集中赋予了这些公司非凡的权力；我们看待人工智能的视角首先是一个经济机会视角，而这并没有真正使以人为中心的人工智能成为首要优先事项。所以对我来说，经济权力的这个问题贯穿了我读过的三篇论文，但我希望它能得到更直接的讨论。我希望有人能尝试探讨以下问题：“如果我们在不同的经济环境中运作，关于人工智能治理的对话会是什么样子？”质疑资本主义体系本身可能超出了本书的范围，我想，但即使不这样做，也完全可以质疑体系内的权力集中，以及仅此一点如何深刻地塑造了当前的对话。的确，我们现在看到的是，一小撮参与者——都在同一个领域，都来自相同的群体——在拍板。而我们似乎对此习以为常：“事实就是如此。我们的治理机制需要考虑到这一点。”\n\
  \n思考政府如果试图解决这种权力集中可能会产生的可能性会很有趣。如果我们有更广泛多样化的参与者会是什么样子？如果观点更加多样化呢？我的假设是，这本身不足以完全实现以人为中心的人工智能，但这将是让更多观点进入对话的伟大第一步，并最终（真正地）倾听并听取那些认为以人为中心的人工智能应成为优先事项的个人和组织的意见。\n\
  \n**你会对政策制定者和从业者做出什么建议？**\n\n我的第一个建议，或许是我的第一个希望，是我们开始摆脱创新与监管之间的二分法——承认如果创新是不负责任的，那么遏制创新是可以的。我会告诉政策制定者，要更有信心地监管人工智能；是的，这项技术是新的，但说他们没有（成功地）应对过与创新相关的挑战是不准确的。也许这会减少诸如“任务过于庞大，所以最好超慢进行”或“与其做错事，不如什么都不做”之类的想法。\n\
  \n我们必须接受，有时，完美，确实是好的敌人。人工智能治理领域有很多人害怕一开始就做不对事情。你知道，我在政策制定圈的经历中了解到的一件事是，我们可能一开始就无法完全做对。这没关系。没有人有魔杖。所以，我会对政策制定者说：认真对待这个问题。尽你所能。在你尝试制定正确的治理机制时，邀请广泛的观点——包括边缘化社区和终端用户——参与其中。但不要让自己被一小撮假装政府无法在不扼杀创新的情况下监管人工智能的声音所瘫痪。\n\
  \n要说服自己创新和监管可以齐头并进，我认为 Larouche 的方法很有趣。当我们提醒自己，我们并不处于法律真空中，我们实际上以前就监管过技术——技术是不同的，当然，但它们在法律挑战方面是相似的——那么人工智能监管就变得更容易接近了。\n\
  \nValor 对以人为中心的人工智能的定义让我有了第二个建议：让我们重新构建人工智能治理的叙事。如果我们认为人工智能应该是以人为中心的，应该由人设计，为人设计并以人为本，以促进人类繁荣，那么，同样，创新与监管之间的二分法就变得有点无关紧要了。治理——包括监管——不再被视为减缓创新的工具。相反，它被视为一种可以推动社会有益的（或至少负责任的）人工智能的工具，并且当它对人类造成损害时，也许会遏制它。它让我们摆脱了以创新为目的的创新的叙事前提。\n\
  \n我的最后一个建议很简单：解决权力集中问题。这并不前所未有；以前做过。对我来说，现在对话的设定方式——我们对拥有少数巨头能够几乎主导议程的情况感到满意——是非常有缺陷的。说清楚：这些巨头不一定是恶意的。但它们是公司，其职责是对股东负责，而不是对地球或所有人类负责。一旦我们提醒自己这一点，我认为很明显，应该有更多元化的声音掌握人工智能的方向盘。\n\
  \n# Section II Sectoral Representations of HCAI\n\n## 10 Good Governance Strategies\
  \ for Human-Centered AI in Healthcare Connecting Norms and Context\n\nMichael Da\
  \ Silva\n\nUniversity of Southampton, Southampton, UK\n\nJean-Louis Denis and Catherine\
  \ Régis\n\nUniversité de Montréal, Montréal, Québec, Canada\n\nDOI: [10.1201/9781003320791-13](https://dx.doi.org/10.1201/9781003320791-13)\n\
  \n### Introduction\n\n\n\n\n\n许多利益相关者对人工智能（AI）在医疗保健领域的发展和应用感到兴奋，尤其是在大多数医疗系统面临人力和财务资源短缺的背景下。AI\
  \ 可以为专业人员提供“时间的礼物”(Topol, 2019a)，以提供更有同情心的护理——并帮助患者获取医疗知识，使其能够在健康相关决策中发挥更积极的作用。美国护士平均有\
  \ 25% 的工作时间用于 AI 可部分协助的监管和行政活动(Davenport & Kalakota, 2019)。AI 驱动的诊断和医疗治疗反过来又可以带来实质性的健康改善(Topol,\
  \ 2019a)。虽然许多人对 AI 将如何影响护理提出了可以理解的担忧，但市场趋势表明与健康相关的 AI 已然到来：全球（非健康特定）AI 市场预计到 2030\
  \ 年价值将达到 1,8110 亿美元(Research & Markets, 2023)。设计良好的 AI 可以提高医疗保健和服务的质量和效率以及人口健康(Topol,\
  \ 2019b)；然而，必须寻求确保其实现有益目标，而非制造虚假价值感的方式。\n\n问题是如何确保与健康相关的 AI 促进人类价值。医疗保健学者至少以两种方式使用“以人为本的\
  \ AI”（HCAI）这一表述。一种侧重于开发促进医疗行为者利益或需求的 AI 的必要性，如患者、医疗提供者和管理人员。另一种侧重于 AI 在人体工学特征方面的“可用性”，以及是否与使用环境相契合。即使是安全有效且具有巨大潜在益处的\
  \ AI，如果设计问题导致提供者在特定环境中不太可能为善而使用该技术，也无法确保其实现这些益处。因此这两种观点是互补的。未能解决这种相互依赖性将导致 AI 开发与现实部署之间的实施差距扩大(Seneviratne\
  \ et al., 2019)并削弱对创新的信任。\n\n为医疗保健中的 HCAI 制定良好的治理要求结合至少两种反映这些传统 HCAI 观点的治理方法：(1)\
  \ 一种规范性方法，确保我们在监管层面*保护*医疗行为者的利益（至少是其客观和总体性的利益），以及 (2) 一种情境性方法，允许在实践层面*理解*、*回应*和*适应*这些利益。第一种方法至少要求监管机构确保医疗保健中的\
  \ AI 创新足够安全以便实施，从而尊重某些关键规范原则。第二种方法涉及 AI 社区设计、开发和实施 AI 创新的能力，使其在实践中回应各种利益并产生使用价值。这两种方法都涉及\
  \ AI 需要以有价值的目标为导向；被证明安全、有效且适合用途；并为在真实环境中使用而设计。本章在审视这两种方法及其相互关系之前，先简要概述 AI 目前在医疗保健中的使用情况。\n\
  \n### 与健康相关的 AI：简要概述\n\nAI 的发展已出现在健康研究、预防、健康管理、临床护理和服务以及公共卫生部门。以下是一些例子。**在研究中**，它们正在被开发以加快药物发现和临床试验流程(WHO,\
  \ 2021; Morriet, 2022)。**在预防中**，它们被提议用于更好地针对并更迅速应对医疗机构中医院感染的风险，更好地预测心脏骤停，识别自杀风险，并通过聊天机器人向护理人员和患者提供量身定制的信息(Morriet,\
  \ 2022)。**在管理中**，它们被开发用于更有效地分配医疗保健中的人力和财务资源并管理候诊名单(WHO, 2021)。**在临床护理和服务中**，它们被部署以减少医疗错误（例如由处方药引起），改善诊断，并通过解放临床医生免于一些耗时任务（例如记录、排程）来为临床医生节省更多时间（FDA,\
  \ 2022; Haug & Drazen, 2023）。**在公共卫生中**，它们被用于通过新闻文章和社交媒体帖子中的提及来识别、追踪和分析与大流行相关的事件，并比较不同组合的公共卫生策略（例如边境控制和检测）如何影响社区爆发风险。\n\
  \n因此，AI 正在进入医疗保健系统的所有关键组成部分以及更广泛的领域。AI 工具的有效性程度在多大程度上得到证实仍存在争议。一些工具现在已成为“在解释某些类型的医学影像时被接受的医疗实践的一部分，例如心电图、普通放射线照片、计算机断层扫描（CT）和磁共振成像（MRI）扫描、皮肤图像和视网膜照片”(Haug\
  \ & Drazen, 2023)。然而，仍存在许多 AI 工具尚未在临床相关环境中得到验证的担忧(Topol, 2019b)。一些 AI 工具至少满足了与其他疗法相同要求的证据标准。美国食品药品监督管理局（USFDA）(2022)[#ch10.xhtml#ref10_40]\
  \ 拥有已通过验证并获批作为医疗器械的 AI 启用产品的公开清单。然而，在 AI 工具被提供之前，其有效性可以或应该提供的精确证据水平仍存在争议；即使是用于或构成医疗器械的一些\
  \ AI 工具，在某些环境中也可能避免当前的监管审查(Da Silva et al., 2022)。非器械 AI 验证必须在其他地方进行，也许是在护理环境中。\n\
  \n健康相关 AI 的使用也引发了严重担忧。例如，医疗 AI 可以产生歧视性影响，例如当 AI 在有问题的、代表性不足的数据上训练或使用有偏见的代理时(Guo\
  \ et al., 2022; Obermeyer et al., 2019)。其他担忧包括隐私侵犯（即 AI 工具处理大量个人健康信息）、医疗关系的非人化、AI\
  \ 技术成本与其他医疗保健优先事项相比、以及环境影响（AI 消耗大量能源）(Flood & Régis, 2021)。以下讨论“以人为本”的方法如何帮助解决这种潜在益处与风险混合所带来的一些艰难选择。\n\
  \n实现适当的平衡需要关注一个复杂的行动者契约，有时是相互依存的。AI 是为许多行动者开发并被他们使用。即使监管存在，仍需要其他机制来确保工具在特定环境中是合适的。监管设定了规范性的底线。从业者还必须以“合法”的方式使用\
  \ AI，使其真正促进人类利益，并且用户利益应在每个阶段指导决策。\n\n#### 以人为本的健康相关 AI 和以人为本的设计\n\n\n\n\n\n尽管关于\
  \ HCAI 在医疗保健中含义的文献仍然有限，但总体上趋向于认为它应有利于响应医疗保健使用者需求或利益的 AI 发展。这有时被表述为规范性目标。另一个常见建议是\
  \ AI 与人类之间的互动应有助于提升人类绩效。例如，Shneiderman (2022: v) 强调了 HCAI 中“人类价值如权利、正义和尊严的首要性”。这些定义可能与该术语更常见的技术性用法脱节（其中\
  \ HCAI 意味着 AI 被设计为可被现实世界中的人使用），但两种方法有着重要的联系。例如，英国医疗和保健监管局 \\[MHRA\\] 的一份近期监管文件 (2022)\
  \ 指出，\n\n> “\\[h\\]uman-centred” 在此指的是“以人为本设计”的概念，即“一种交互系统的设计方法，旨在通过关注使用者及其需求和要求，并应用人因/工效学以及可用性知识和技术，使系统可用且有用。”\n\
  \n这并不必然与更规范的方法相冲突。AI 必须被用来促进人类目标。Shneiderman (2022: 9) 本人高度关注设计，建议 HCAI 应“被设计为能够放大、增强、赋能并提升人类绩效的超级工具”。\n\
  \n我们在此关注以人为本设计在“可用性”方面的含义，但超越了工效学，从更广泛的背景来看待可用性。健康相关 AI 学者建议 HCAI 可能需要的许多其他特征，包括“人在回路中”\
  \ (Chancellor et al., 2019; Doncieux et al., 2022)；透明性或可解释性 (Schmidt, 2020; Liang\
  \ et al., 2021)；以及值得信赖 AI 的特征，包括隐私保护和数据治理规范以及反歧视保护 (Doncieux et al., 2022)。还有其他人建议，只有在整个开发过程中都有利益相关者参与时，AI\
  \ 才有资格被称为“以人为本” (Melles et al., 2021)。每项建议是否对权利、正义或尊严是必需的，这是一个现实问题，可能需要通过实证检验来验证。然而，关注有助于实际使用的设计要素在任何方法中似乎都很有价值。能够治愈疾病的\
  \ AI 如果人们无法使用就不会发挥作用。在这种意义上，即使从经验上看，似乎自主的 AI 能够促进人类价值 (Shneiderman, 2022)，关注人类在\
  \ AI 开发和使用“回路”中的作用也很重要。\n\n*以用户为中心的设计* 关注终端用户的体验及其对技术创新设计和使用的意义。它提供了一种实用的分步方法来记录和共同开发某一创新的潜力。Seneviratne\
  \ et al. (2022) 提出了一个由四个要素组成的模型，以提高技术对终端用户的可用性和益处，重点关注机器学习案例，但很可能更广泛地适用：(1) 可解决的痛点识别，(2)\
  \ 挖掘 AI 的独特价值（例如自动化和增强）以解决痛点或被视为有问题的情境，(3) 提供给终端用户实用指导的可操作性路径，以及 (4) 模型的奖励函数。可解决的痛点是在行为者估计技术能够创造价值的情境中被感知的[content]\n\
  \n尽管关于 HCAI 在医疗保健中含义的文献仍然有限，但总体上趋向于认为它应有利于响应医疗保健使用者需求或利益的 AI 发展。这有时被表述为规范性目标。另一个常见建议是\
  \ AI 与人类之间的互动应有助于提升人类绩效。Shneiderman (2022: v)，例如，强调“人类价值如权利、正义和尊严”在 HCAI 中的首要性。这些定义可能与该术语更常见的技术性用法脱节（其中\
  \ HCAI 意味着 AI 被设计为可被现实世界中的人使用），但两种方法有着重要的联系。例如，英国医疗和保健监管局 \\[MHRA\\] 的一份近期监管文件 (2022)\
  \ 指出，\n\n> “\\[h\\]uman-centred” 在此指的是“以人为本设计”的概念，即“一种交互系统的设计方法，旨在通过关注使用者及其需求和要求，并应用人因/工效学以及可用性知识和技术，使系统可用且有用。”\n\
  \n这并不必然与更规范的方法相冲突。AI 必须被用来促进人类目标。Shneiderman (2022: 9) 本人高度关注设计，建议 HCAI 应“被设计为超级工具，能够放大、增强、赋能并提升人类绩效”。\n\
  \n我们在此关注以人为本设计在“可用性”方面的含义，但超越了工效学，从更广泛的背景来看待可用性。健康相关 AI 学者建议 HCAI 可能需要的许多其他特征，包括“人类在回路中”\
  \ (Chancellor et al., 2019; Doncieux et al., 2022)；透明性或可解释性 (Schmidt, 2020; Liang\
  \ et al., 2021)；以及值得信赖 AI 的特征，包括隐私保护和数据治理规范以及反歧视保护 (Doncieux et al., 2022)。还有其他人建议，只有在整个开发过程中都有利益相关者参与时，AI\
  \ 才有资格被称为“以人为本” (Melles et al., 2021)。每项建议是否对权利、正义或尊严是必需的，这是一个现实问题，可能需要通过实证检验来验证。然而，关注有助于实际使用的设计要素在任何方法中似乎都很有价值。能够治愈疾病的\
  \ AI 如果人们无法使用就不会发挥作用。在这种意义上，即使从经验上看，似乎自主的 AI 能够促进人类价值 (Shneiderman, 2022)，关注人类在\
  \ AI 开发和使用“回路”中的作用也很重要。\n\n*以用户为中心的设计* 关注终端用户的体验及其对技术创新设计和使用的意义。它提供了一种实用的分步方法来记录和共同开发某一创新的潜力。Seneviratne\
  \ et al. (2022) 提出了一个由四个要素组成的模型，以提高技术对终端用户的可用性和益处，重点关注机器学习案例，但很可能更广泛地适用：(1) 可解决的痛点识别，(2)\
  \ 挖掘 AI 的独特价值（例如自动化和增强）以解决痛点或被视为有问题的情境，(3) 提供给终端用户实用指导的可操作性路径，以及 (4) 模型的奖励函数。可解决的痛点是在行为者估计技术能够创造价值的情境中被感知的\n\
  \n\n\n\n监管机构在此可以提出的首个问题是：“该 AI 工具在进入医疗市场之前是否符合适当的性能（效能和安全性）标准？” 然而，以人为中心的方法会促使他们提问：“该\
  \ AI 工具与医疗环境中人类用户之间的互动组合，在其可获得并使用的医疗情境中是否符合此类标准？” 这个第二个问题呼应了英国的做法，其中 MHRA (2022)\
  \ 建议，“\\[I\\]t 是人机团队的性能，而不仅仅是模型的性能，才是确保 … \\[AI\\] 安全有效 的关键。” 因此，需要设定足够高的性能标准，以确保\
  \ AI 按预期运行，至少在对患者的风险水平证明其合理时（风险越高，监管要求越高）。但关注其使用方式以及由谁使用也很有价值。确保产品进一步体现人类价值观并在情境中发挥作用，需要正式的\
  \ ex-ante 审计或评估流程（主要基于控制设置数据）*和* 在 AI 系统将被使用的那种情境中的 ex-post 流程。\n\n监管机构还必须确保 **AI\
  \ 开发者和部署者的问责制**。此处的问责制至少要求个人具有 *可问责性* 和 *责任*，这是常规监管制度的通常业务。事实上，促进责任和问责的需求已被世界卫生组织提及为健康中使用\
  \ AI 的关键伦理原则（WHO, 2021）。开发和部署 AI 系统的 AI 行为者如果不遵守其受约束的义务，应被追究责任。这要求，除其他选项外，监管机构实施或调整现有的关于医疗保健中\
  \ AI 系统的报告机制，以便医疗行为者（在某些情况下包括患者）能够轻松通知有问题的技术事件（关于例如性能）、需要引起监管机构注意的 AI 系统的不当演进、隐私违规以及其他潜在的人权侵犯（例如，如果一名护士意识到用于重症监护床位分配的分诊\
  \ AI 工具过度优先考虑男性）。事件可能并不总是触发责任问题，但在某些情况下会触发。国家必须确保存在某些问责措施。即使不触发责任，也会使 AI 开发者和部署者意识到问题，并在需要时触发回应和调整通知的义务。安全和效能监管机构也应回应事件。\n\
  \n这凸显了进一步需要关注确保 **有足够的信息关于 AI 以允许终端用户适当使用**。很难想象 AI 系统能够响应人类需求并确保患者保护，而没有来自医疗专业人员和管理人员——以及当\
  \ AI 直接提供给他们时患者的——足够的能力来理解他们使用的 AI 系统的适当性和局限性。这对于行使关于 AI 的批判性思维和能动性至关重要，而这在处理人类健康时至关重要。这种能动性是提供者在临床情境中行使专业判断的前提，例如分析特定\
  \ AI 工具是否适用于特定患者或情况（Laverdière & Régis, 2023）。这种能动性要求对我们对 AI 的了解有足够程度的透明度。信息可能涉及用于训练算法的数据类型、哪些人群在其中代表性不足、用于开发它的主要变量/相关性是什么、其弱点是什么等。MHRA\
  \ 的 (2022) 呼吁“对预期用户群体保持透明”，在模型发生变化时“更新预期用户群体”，并描述“不可解释的 AI（全局或局部）如何可能影响人机团队的性能”在这方面值得注意。而且信息应在模型在实践环境中演进时得到更新（自适应\
  \ AI）。监管机构使用的评估这些工具的标准以及满足这些标准的证据的公开也是明智的。虽然我们承认在此处专有数据方面的挑战，但关于监管机构为何认为给定工具适合用途的声明似乎并不明显需要共享此类数据。这里讨论的信息类型也可能有必要用于请求并获得在此类规则适用的情况下使用\
  \ AI 的有效知情同意，进一步影响采用率（参见 Cohen, 2020）。\n\n这三个提出的监管规范并非详尽无遗，并且只有在情境中应用时才能实现其预期目的。监管机构必须为\
  \ HCAI 在特定情境中适当繁荣留下空间。来自情境化设置的发现随后可反馈到监管情境中以在需要时修改规范。\n\n#### 情境的重要性\n\n将监管世界与实践世界连接起来是多层治理的练习。多层治理“指的是治理系统，其中权力向上、下和横向分散于政府各层级——地方、区域、国家和超国家——以及跨领域和部门，包括国家、市场和公民社会”（Daniell\
  \ & Kay, 2017: 4）。AI 开发、实施和评估是否“以人为中心”将是众多行为者、部门和决策与干预层级之间持续协调和谈判的结果；监管规则仅提供考虑工具是否以人为中心的所需底线。HCAI\
  \ 的其他领先定义据此建议价值和技术查询必须关注更广泛的情境。Riedl (2019) 强调理解 AI 角色作为“由人类利益相关者组成的大型系统的一部分”的重要性。再次，MHRA\
  \ (2022) 指出，人机团队的性能（而不仅仅是模型的性能）是确保 AI 安全有效的关键。而 Shneiderman (2022) 建议，即使是“自主”AI\
  \ 的价值也必须考虑到其服务人类目的的能力，并且关于是否允许其使用的疑问必须检查它将如何与人类互动。此类分析需要检查 AI 在实践环境中的潜力，例如临床护理情境。\n\
  \n我们在此关注这种互动的两个方面，似乎尤其相关：终端用户群体的多样性以及将价值用作情境中实验、实践和反思的属性。当然，AI-人类互动不会发生在单一情境中。关于可用性和效能的问题需要针对其拟实施的特定情境。\
  \ 这又带来另一个挑战：每个使用情境都包含具有不同价值观、利益、期望和权力的行为者多样性，这些行为者相互作用以塑造 AI 作为创新的旅程。必须做出努力来调和它们产生的冲突（Denis\
  \ et al., 2007）。\n\n\n\n\n\nHCAI，换句话说，必须对 AI 可能与不同类型的人类产生的各种交互保持敏感，以及这对其整体价值可能产生的影响。技术的价值是特定情境中多层交互的结果（Pettigrew,\
  \ 1985；Latour, 1997）。因此，结果无法 *ex-ante* 预测，而是会发展并成为相关行动者及公众在其 *context of application*\
  \ 中协商的地方评估的产物。某些结果甚至可能无法 *ex-ante* 定义：众多行动者协商“成功”条件。因此，将规范性要求与技术要求对齐以实现人类目标，需要理解行动者网络及其立场如何解释并塑造技术的开发与部署。跨专业以及专业人员与卫生管理者之间的合作程度、一线工作者对政策制定者的信任、行动者的倾向与能力、患者的参与，以及\
  \ AI 设备的感知属性与益处，都会影响一项创新的采纳。\n\nMay (2013) 和 Murray et al. (2010) 的 *normalization\
  \ process theory* 在此具有代表性。它指的是在将创新付诸实践时，行动者在情境中执行的必要且根本性任务。其基本形式认为，在某一环境中使技术创新正常化的过程受四个因素制约。第一是行动者理解技术并达成对技术的共同理解的能力与倾向：以用户为中心的设计的核心价值主张在此被视为临床情境中的意义建构与意义赋予过程（Gioia\
  \ & Chittipeddi, 1991）。第二是行动者在组织内参与推动创新的合法性，即围绕潜在益处招募他人，并在生成新的测试与使用技术的机会。第三是在集体或组织层面发展资源与\
  \ know-how，以使 AI 从本地化实验扩展到标准使用。第四是发展资源与能力以持续监测用户体验，以便实现调整与改进。\n\n这也只是一般方法的一个富有成效的例子。关键在于，HCAI\
  \ 的前景依赖于情境中众多行动者测试与评估工具及其以人为本属性。HCAI 在医疗保健中的使用与价值将是这样一种费力且系统性的过程的结果，即在组织的日常生活中熟悉创新并通过试错学习其潜力。从终端用户的角度来看，重点不在于在研究实验室中就技术的核心属性达成一致（即在脱离其使用情境之外），而在于在真实生活环境中为创新创造空间（卫生组织、诊所等）。在技术创新情境中，由多重行动者表现出的地方动态与表征，最终会汇聚为对工具以人为本性的具体评估。该评估部分取决于技术属性：物质性对行动者的表征、行为与体验具有偶然性影响（Jarzabkowski\
  \ & Kaplan, 2015）。行动者在情境中付出的努力旨在理解创新以产生更大的使用价值。情境作为多层次现象，影响着行动者执行使用与欣赏技术所涉及任务的能力。因此，要确定工具的属性是否与以人为本的愿景与价值观一致，必须审视相互作用的情境层：发现情境、基于规范指导的监管情境，以及终端用户在其中努力执行任务以理解技术创新的应用情境。\n\
  \n以人为本的方法在此提示了另外两个可操作的要素。首先，情境、技术与实践环境固有的多元主义共同作用，支持对任何创新的使用价值的确定与评估采取偶然性方法，包括医疗保健中所谓的\
  \ HCAI。任何基于 *strictly* 本质主义技术观的方法，即寻找一套固定的物质属性以在任何情境中体现以人为本性的方法，都不足以理解并塑造技术在此方面的潜力。在医疗保健这种能力与权力分散的情境中，众多行动者共同承担评估与塑造\
  \ AI 人文潜力的具体任务。\n\n其次，反思性，即在试验创新并确定其在情境中的价值的过程中采取批判性与审慎的方法，可以通过常规且系统的评估、监测与共同开发来支持或实现。对\
  \ AI 的反思性评估整合了多元的观点与视角（Patton et al., 2015）。\n\n反思性意味着不同行动者可以有意识地澄清他们与技术的关系以及对其潜力的评价。对医疗保健中\
  \ HCAI 的一个合理政策启示是，支持开发过程与空间，以在大量多样化的群体、组织与环境中培育情境中的反思性与能力。当前由许多部门设立的创新实验室主导的举措旨在提供此类空间与资源。在方法论上，这意味着能够系统地监测某些重要创新的历程与影响。它还意味着具备方法论能力，以确保在情境中分析技术历程的严谨性与深度。终端用户在此是此类评估的受众与参与者，他们被吸纳共同创建规范情境使用的指南与政策（Patton\
  \ et al., 2015）。作为此类指南制定的一个近期例子，是《医疗保健中负责任 AI 创新原则指南》(Passalacqua et al., 2021)及其面向\
  \ AI 创新者的自评表。该互动在线工具由蒙特利尔大学学术健康中心与 60 多名合作者（创新者、管理人员、学者、患者、临床医生等）共同创建，旨在支持 AI 创新者在创新周期的每个阶段。该指南为如何在医院环境中设计负责任的\
  \ AI 工具提供了具体指导，并允许创新者通过自我评估问卷反思其流程与实践，从而相应地调整其 AI 工具的开发与部署。\n\n情境因素的重要性并不使上述监管考虑变得无用，反而突出了其在更广泛生态系统中的作用：监管者通过其政策与干预，可以增强组织与行动者实施以用户为中心设计的\
  \ capacity。例如，MHRA (2022) 计划推广符合以用户为中心视角的设计原则。更广泛的机会是创建反馈循环，使信息能够从终端用户世界流向监管者并返回。健全的生命周期审查可能寻求识别\
  \ *where human–AI teams are effective*。\n\n### Conclusion\n\n\n\n\n\n面向“促进人类价值”和“确保人类可用性”的\
  \ HCAI 方法可以相关联，因为“以人为中心”需要在规范上是 desirable 的，并且实际上以促进人类价值的方式被使用。将这些规范性需求和技术性需求融合起来不能仅通过监管或专业规范来严格实现，并且人工智能要“以人为中心”所需的内容必须随着时间的推移通过监管层面和床边层面的反思性过程重新定义，因为实际使用案例凸显了规范性和技术性的益处和挑战。这并不免除监管健康相关人工智能的责任。以人为中心的分析反而为适当的监管提供了起点。其中其他方面，例如，前文表明，创新的生命周期审查过程是必要的，并且应在每个阶段关注可用性。\n\
