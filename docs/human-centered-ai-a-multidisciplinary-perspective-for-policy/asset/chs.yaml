  \ Computers & Education: Artificial Intelligence, *2*, 100025.\n\n## 16 社交媒体平台所实施的人工智能系统有多以人为中心？\n\
  \nAlistair Knott\n\nVictoria University of Wellington, Wellington, New Zealand\n\
  \nTapabrata Chakraborti\n\nAlan Turing Institute, University College London, London,\
  \ UK\n\nDino Pedreschi\n\nUniversity of Pisa, Pisa, Italy\n\nDOI: [10.1201/9781003320791-19](https://dx.doi.org/10.1201/9781003320791-19)\n\
  \n### 引言\n\n当今世界最普遍的人工智能系统之一部署在社交媒体平台上。**推荐系统**（参见例如，Zhang et al., 2021）是向每个平台用户每日信息流中推送个性化内容流的人工智能系统。它们通过观察用户在平台上的行为，并*学习*用户“参与”了什么来实现这一点。对于每个平台用户，推荐系统都会观察该用户的行为，并使用机器学习技术形成关于该特定用户通常参与的内容类型的假设。然后，它在该用户后续的信息流中优先考虑这些类型的内容。**内容分类器**是识别平台上特定类型内容的人工智能系统。它们可以操作不同类型的内容：文本分类器可能会将文本内容识别为“报纸文章”或“积极的产品评论”。图像分类器可能会将图像识别为狗、猫或桌子的图片。推荐系统会使用一些内容分类器。但内容分类器在将*有害内容*移出平台（或以各种方式标记有问题的内容）方面也发挥着核心作用。所有社交媒体平台对仇恨言论、暴力内容、裸露和性内容都有详细的政策。这些政策的执行部分涉及人工监督，由内容审核员团队执行。但执行也涉及内容分类器的大规模开发和部署。同样，大多数这些内容分类器通过机器学习方法获得其能力。它们被提供大量训练集，包含它们要识别的每种内容类型的众多*示例*。从这些示例中，它们构建了这些相同内容类别的自己的内部定义，这些定义足够通用，可以让它们对以前从未见过的新项目进行分类。\n\
  \n推荐系统和内容分类器在不同方式上都是极具以人为中心的。推荐系统在它们*定制*平台用户所见信息的方式上以人为中心。它们将每个用户视为个体，具有独特的一套喜好和厌恶。推荐系统为每个用户充当一种个性化编辑，对每个用户的个人品味都很敏感。当用于内容审核时，内容分类器在确保平台上维护某些*人类价值观*方面以人为中心。它们有助于确保各种形式的仇恨内容从平台上移除。这项工作部分是为了遵守要求移除有害内容法律而进行的（当然，这些法律的性质因司法管辖区而异）。但他们所做的工作往往超出了法律要求，以实施公司关于如何处理有害内容的自有定制政策，无论这涉及移除、标记还是其他操作。\n\
  \n\n\n\n\n虽然社交媒体平台使用的 AI 系统在某些意义上是人本中心的，但其运行的几个方面值得仔细审视。在本章中，我们将聚焦于与*社会结构*相关的问题，这些结构影响，或受影响于社交媒体平台的运行。评估一项技术的以人为本程度不仅仅涉及研究人们如何作为个体用户与之互动：我们还必须考虑在*群体*内部发生的集体过程，既包括技术的使用，也包括其治理。社会中运行的集体过程可以更或少地以人为本：例如，民主比独裁更以人为本；经过偏见审计的住房审批方案比未经过审计的方案更以人为本。在这些集体过程中，以人为本还应尊重人权，例如言论自由权和免受歧视的保护。我们将在“推荐系统”部分讨论推荐系统：重点关注这些系统可能将用户引向两极化或极端主义意识形态，而远离以人为本价值观的担忧。我们将在“内容分类器”部分讨论内容分类器，重点关注这些系统的构建和训练在没有充分征求用户意见、且缺乏足够公众问责的情况下进行的问题。在“以人为本的推荐系统透明度”和“以人为本的内容分类器透明度”部分，我们提出了可以解决这些问题的监管机制，并帮助使社交媒体平台更以人为本。\n\
  \n### 推荐系统\n\n#### 推荐系统如何学习\n\n社交媒体平台中推荐系统的任务是为用户*推荐内容*。该内容可能是来自其他平台用户（朋友、平台更广泛社区中的人物或群组）的帖子，关于平台提供的其他项目，或关于新用户的好友或关注建议。推荐系统的独特之处在于，为每个个体用户提供的建议都基于其对该特定用户兴趣的了解，这些了解来自对该用户在平台上先前行为的观察。如果某个用户点击帖子、“点赞”、评论或与他人分享，他们就被理解为对该帖子表现出兴趣。推荐系统会观察用户实际参与的内容，并据此尝试学习*概括*他们感兴趣的内容，以便对新内容做出良好建议。\n\
  \n#### 关于学习机制的担忧\n\n推荐算法是向用户推荐内容的强大工具。训练完成后，它持有平台上每个个体用户的丰富而强大的*模型*——具体来说，是每个用户感兴趣内容的模型。但实现这种学习机制存在潜在问题。\n\
  \n问题源于推荐系统会*持续*从用户行为中学习，随着用户继续使用平台而不断完善对用户的模型。问题在于，用户参与的内容*在很大程度上由推荐给他们的内容决定*。简单来说，用户倾向于点击推荐系统为他们建议的项目。这一点对任何使用\
  \ Google 搜索的人来说都很熟悉：我们倾向于点击返回结果的第一页上的项目（参见例如 Petrescu, 2014）。这意味着当推荐系统完善对某个用户的模型时，它很可能*强化其已有的模型*。这种效应通常被称为“过滤气泡”效应。\n\
  \n关于过滤气泡效应的优雅证明有很多，许多模拟也以一种或另一种形式展示了它。来自 Google DeepMind 的一个模型（Jiang et al., 2019）特别清晰地说明了这一点：基本发现是，推荐系统会随着时间的推移*缩小*用户的兴趣范围，并聚焦于更小一部分内容类型。当然，系统设计者也意识到这一点，并采用了许多策略来避免这种缩小。我们大致知道其中一些策略是什么——Knott\
  \ 等人（2021）给出了简要回顾。但我们不知道这些策略的细节，因为相关学习算法是社交媒体公司的私有财产。这就给我们留下了一个初步的*令人担忧的原因*，关于推荐算法对社交媒体平台用户的可能影响。\n\
  \n这种最初的担忧源于关于 AI 系统在线学习效应的纯技术考虑。但它还被其他关于人而非机器的考虑所加剧。已知社交媒体用户对某些类型内容有轻微偏好，这些偏好可能使推荐系统用户模型朝令人担忧的方向发展。这些偏好在心理上是存在的：它们在实证研究中得到证实。例如，在政治讨论中，研究发现用户传播包含“道德-情感表达”的信息比其他信息更快（Brady\
  \ et al., 2017；Brady and van Bavel, 2021）。包含对政治外群体的引用的信息传播也特别快（Rathje et al., 2021），包含虚假信息的信息也是如此（Vosoughi\
  \ et al., 2018）。讨论中也存在一种倾向，即随着讨论变长，仇恨言论会增多（Cinelli et al., 2021）。\n\n对这些令人担忧内容类型的偏好很小。但关键是，它们*与推荐系统中发生的渐进式学习*相互作用的可能性。如果用户的令人担忧偏见随着时间推移而持续存在，它们可能会持续影响推荐系统完善对平台用户模型的方式，从而使这些模型趋向于包含道德-情感表达、对政治外群体的引用、仇恨言论和虚假信息浓度不断增加的内容。简而言之，推荐系统可能在推动用户走向*极端主义*立场方面发挥作用，这是一个合理的担忧原因。\n\
  \n再次，这只是一个担忧原因。但我们认为，这足以证明向公司提出进一步了解推荐系统影响的信息的要求。回到本手册的主题：虽然社交媒体推荐系统在向个体用户提供定制内容方面无疑是“以人为本”的，但这些系统可能随着时间的推移将用户推向极端主义立场，从而在社会效应上与以人为本背道而驰，这是一个真实的担忧原因。\n\
  \n### 内容分类器\n\n\n\n\n\n内容分类器在社交媒体平台上有许多用途，但在这里我们关注的是它们的主要用途之一，即内容审核：即识别有害内容。有害内容可以有多种形式，公司有自己的政策和定义，但在本章中我们将重点关注“仇恨言论”这一宽泛类别。在其他条件相同的情况下，实施以人为本价值观的平台应明确避免仇恨言论的泛滥。（正如引言中所述，以人为本的\
  \ AI 应尊重人权，例如免受歧视的保护权。）当然，“有害内容”的概念具有强烈的价值负载：我们将在本文后面讨论应征求谁的价值观。当然，用户发布的内容被移除也是有问题的：必须在确保用户自由表达意见的需要与确保用户免受对其有害的内容的需要之间取得平衡，无论这种伤害是内在的，还是通过在其他领域煽动伤害而产生的。\n\
  \n在本节中，我们将概述内容分类器如何学习识别一类内容，以“仇恨言论”为例。（我们将重点关注书面文本的分类器，尽管相同的方法可用于训练图像或视频的分类器。）我们将指出社交媒体公司目前实施的学习过程中存在一个担忧，其性质与关于推荐系统的担忧非常不同。\n\
  \n#### 如何内容分类器学习\n\n内容分类器在基础层面是一个“监督”学习系统。也就是说，它通过被给予（大量）其需要识别的每个类别内容示例来学习：其目标是识别这些示例中的*共同点*，并将其扩展到从未见过的新内容。例如，仇恨言论分类器是通过被给予（大量）应被分类为“仇恨言论”的文本示例，以及（大量）应被分类为‘非仇恨言论’的文本示例来训练的。学习机制的细节对于当前讨论并不重要：重要的是分类器的学习完全由其被给予的训练示例驱动。因此，当然，训练集的创建至关重要。我们的关注点正是社交媒体公司构建其有害内容分类器训练集的过程。\n\
  \n#### 关于学习机制的担忧\n\n我们希望指出的核心担忧是，社交媒体公司在*闭门*的情况下训练其有害内容分类器，公众监督极少。一些公司偶尔会发布某些类型有害内容的训练集：例如，Facebook\
  \ 最近发布了一组“仇恨模因”数据集（Facebook/Meta, 2020）。但此类发布是例外，而非规则。除了大型公司之外，学术研究团体已汇编了大量涵盖多种类型有害内容的数据集，并以多种模态呈现：例如，参见\
  \ Madukwe et al. (2020) 的批判性综述。但我们不知道公司在多大程度上利用这些公共资源。它们当然都有自己不共享的资源。\n\n实际上，对训练集保密到一定程度是有充分理由的。如果公司公开其训练集，恶意行为者将能够弄清楚如何“操纵”他们训练的分类器，使用能够逃避自动检测的有害内容。但仍有一些重要问题可以得到更好的解决。关键是，*谁在做出关于什么构成有害内容的至关重要决定*？公司会向公众提供仇恨言论的*一般*定义。但实际上，其分类器所实施定义的细微之处体现在它们所训练的标注示例中。那么，谁在提供标注？他们是如何被选择的？他们遵循什么流程？在缺乏透明度的情况下，内容分类器训练所涉及的流程远未达到“以人为本”的标准。\n\
  \n在接下来的两个部分中，我们将提出机制，以帮助提供关于推荐系统如何影响用户以及内容分类器如何训练的更多透明度。\n\n### 推荐系统的以人为本透明度\n\n\
  我们希望更多地了解推荐系统如何影响用户的兴趣和观点——特别是与暴力及极端内容相关领域。我们与全球人工智能伙伴关系组织（GPAI 2021、2022）的项目已调查了研究这一问题的可能实证方法；我们得出结论，迄今为止最好的方法只有社交媒体公司内部才可用。所有大型社交媒体公司都在以一种或另一种方式研究其推荐系统的效果。基本方法是用户实验。（用户在加入平台时同意的条款和条件中，均同意成为这些实验的受试者。）\n\
  \n最简单的实验是随机对照试验，其中随机选择用户组，并让他们接触推荐系统相关的不同体验。在 YouTube 和 Facebook 等公司中，这些实验非常精细：不同用户组接触推荐系统的不同“版本”，其学习方式略有不同。（用于表示用户和内容项目的变量可能会有所变化，或所采用的学习方法等。）在\
  \ Twitter 上，曾进行过一个粒度更粗的实验：当 Twitter 的推荐系统于 2016 年推出时，随机选择了一个“对照组”用户，他们继续以逆时间顺序流的形式查看其信息流。还创建了一个接触推荐系统的“实验组”用户，并收集了这两种用户组数年间的在线体验数据。该实验允许对推荐系统对平台用户的影响进行相当直接的评估。\n\
  \n在所有实验中，无论是精细还是粗粒度，公司都可以比较经历不同干预的用户组。由于用户组可以很大，且作为整体，组间唯一的差异与他们经历的干预有关，因此组间任何差异都可以确信地被识别为干预的因果效应。用户组可以在许多指标上进行比较。通常，这些指标与参与度的差异有关：公司有财务利益最大化用户的参与度，因为这使他们在平台上停留更长时间，并产生更多广告收入。从以人为本的视角来看，我们想知道不同的推荐系统体验是否对用户接触有害内容或对其态度的不同影响。如果是这样，那么公司对这种接触或这些态度具有一定的*能动性*，因此可能对做正确的事情负有责任。\n\
  \n\n\n\n\n目前，不幸的是，外部机构没有任何权限研究这些影响。研究完全由公司自行决定进行，很少涉及外部研究人员。仅有一项公司研究使用随机对照试验并公开报道过：Twitter\
  \ 进行的一项研究，使用了上面提到的数据集，记录了接触推荐系统的实验用户组的行为以及接收逆时间顺序信息流的对照组的行为。已发表的研究（Huszār et al.,\
  \ 2022）比较了研究期间这两个群体看到的主流政治内容数量。差异非常明显：实验组用户看到的政治内容远多于对照组用户。（他们在除一个国家外的所有研究国家中看到的右翼内容也比对照组多。）\n\
  \nHuszār 的 Twitter 研究在两个方面很有趣。首先，它明确表明社交媒体推荐系统会对平台用户产生巨大影响。由此，它凸显了需要进一步了解这些影响的信息：如果推荐系统强烈影响主流政治内容消费，那么它们对*其他*领域——例如仇恨言论、极端主义材料或其他类型有害材料的消费——会产生什么影响？如果我们想评估其推荐系统的以人为本程度，我们迫切需要知道这一点。其次，Huszār\
  \ 等人的研究展示了一种具体方法，社交媒体公司可以通过这种方法报告其推荐系统的影响信息，而不会损害用户隐私或其专有技术。该研究在 Twitter 内部经过审查并获批准，清楚表明它在这两方面都不构成风险。因此，它为\
  \ Twitter 在其他研究中使用提供了模型，询问其推荐系统的其他影响——其他公司也可以使用。\n\n在此方面，Twitter 近期与新西兰和美国政府以及微软联合采取了一项富有成效的步骤。作为《基督城呼吁消除恐怖主义和暴力极端主义在线》（ChCh\
  \ Call 2019）的一部分，这些方同意开展一个项目，允许外部研究人员通过确保其隐私的接口访问 Twitter 的内部数据（见 ChCh Call, 2022）。该项目的初始重点正是\
  \ Huszār 等人研究的数据集，该数据集研究了推荐系统对平台用户的影响：事实上，该项目的首要目标是创建一个允许复制 Huszār 等人研究的接口。该项目是在埃隆·马斯克收购\
  \ Twitter 之前组织的。在撰写本文时，其未来像 Twitter 的许多其他方面一样不确定。我们认为，除了基督城呼吁等自愿倡议外，还需要立法，允许监管机构要求公司开展类似\
  \ Huszār 等人的研究，并将结果向公众公开。欧盟的《数字服务法》在提供这种透明度方面走在前列；我们正在与实施该法的团体合作，推动我们在此倡导的研究类型。\n\
  \n### 内容分类器的以人为本透明度\n\n正如上文所述，内容分类器的透明度问题涉及其训练集是如何组装的，而不是它们对用户产生的影响。正如上文所述，内容分类器所学习和应用的定义的所有细微差别都存在于为其训练提供基础的每个类别的示例中。\n\
  \n问题部分在于公众目前不知道训练集是如何创建的。例如，谁决定什么算作仇恨言论？但还有另一个潜在问题：公众目前对有害内容如何定义没有任何*发言权*。最近有人对仇恨言论提出了一个有趣的建议：也许什么算作仇恨言论应该由*仇恨针对的对象*来决定——也就是说，由那些亲身经历其造成伤害的人来决定。这一想法由\
  \ Kate Hannah 和同事提出（GPAI, 2021 附录 A）。这里的想法是，那些最常被仇恨在线内容针对的社区应被系统地*征询意见*，以就仇恨言论对其社区的最佳定义为社交媒体平台提供建议。这让被针对的社区在社交媒体环境中对有害内容的管理方式拥有发言权。它还为有害内容的*地方治理*创造了一个有趣的模式，因为在不同司法管辖区遭受仇恨言论的社区可能不同。\n\
  \n然而，咨询是一个 notoriously 模糊的过程。而且尚不清楚咨询流程将如何影响公司的定义。一个有趣的技术可能性是，咨询可能涉及有害内容分类器*训练集的策展*。这一提案将产生若干有益效果。首先，它将为咨询过程创造一个非常具体的目标：即由被咨询群体标注的内容项训练集的构建。其次，它将提供关于咨询过程将如何与公司自身流程相连接的清晰度。如果咨询提供了有害内容分类器的训练集，那么该分类器的运作方式将直接由咨询过程决定。第三，它将为如何提供有关训练有害内容分类器过程的透明度的问题提供一个有吸引力的解决方案。训练集本身不能公开提供，正如前面所述：这将允许对抗行为者利用它。但咨询*过程*将对公众可见：例如，选择咨询组成员的过程，以及用于标注示例的协议，都可以成为公开记录。\n\
  \n\n\n\n\n基于咨询的训练集策展的最终好处是，有可能在各公司之间对“危害”的定义进行*标准化*。目前，各公司自行定义有害内容，并使用自己的训练集构建自己的分类器。（有一些共享数据集，但这只是例外，而非规则。）标准化本身将带来若干重要好处。第一个好处是，创建训练集的成本可以*共享*给各公司。目前，不同公司在创建训练集方面的工作存在相当大的重叠，因为它们各自自行创建。如果公司转而利用现有资源为特定领域创建一个单一共享训练集，每家公司都可以在不额外成本的情况下获得更大的训练集，我们可以预期分类器的性能因此而提升。（特别是对于低资源语言而言，对更大、更好的训练集的需求巨大，共享资源将特别有益——参见例如\
  \ Ranasinghe and Zampieri, 2021 中的讨论。）共享训练集还将极大地帮助资源不足以自行构建充分训练集的小型社交媒体公司（参见例如 Saltman\
  \ and Thorley, 2021）。在这一领域已有一些工作，例如 GIFCT 近期的“差距分析”项目 (GIFCT, 2021)——但还可以做更多。第二，共享训练集的好处是，公司在识别有害内容方面的表现可以更容易地被*评估*。设想一个场景：公司在特定领域共享一个训练集，但开发自己的内部分类器来学习该训练集。很容易通过在共享训练集的未见部分上测试每个分类器，看看哪个最准确，来判断哪家公司的分类器在学习任务中“表现最好”。这种竞争性的“共享任务”在机器学习领域完全是标准做法；它们是过去\
  \ 20 年来取得巨大进展的动力。用于有害内容的共享数据集将使大公司能够在具有巨大社会价值的任务上相互竞争，而不是仅在“市场份额”的商业领域竞争。相对于本手册而言，这可能使公司能够在以人为中心方面展开竞争：哪家公司在识别有害内容的自动化方法上最以人为中心？\n\
  \n总之，我们认为将有害内容分类器的训练集构建纳入半公共领域这一想法具有一定价值。它将使受害社区能够对公司内容策展机制产生真实而有意义的影响，并将有助于阐明这些机制的运作方式。它也可能允许创建共享训练集，从而带来自身的一系列益处。当然，这一社区参与过程也存在挑战。直接的协商式民主也存在问题：公民制定的有害内容定义本身可能包含偏见，并可能容易受到民粹主义舆论的影响。弄清如何为大规模公众咨询过程提供资金也将具有挑战性，因为这涉及将公司预算转向一项共享事业。GIFCT\
  \ 正在进行的工作可以被视为这一方向的第一步。\n\n### Summary\n\n现代社交媒体平台在很大程度上由人工智能驱动。人工智能推荐系统产生了使它们对用户如此具有吸引力的个性化体验，而人工智能内容分类器在确保平台成为安全场所方面发挥着关键作用。这些人工智能算法有多以人为中心？在意图上，它们极其以人为中心。然而，在实施方面，我们认为仍有很大的改进空间。我们提出了两个可以实现的实际改进。它们都与透明度问题有关。\n\
  \n对于推荐系统，需要的额外透明度是研究并报告这些系统对用户对有害内容态度的*影响*。有理由担心这些影响，公众需要更多相关信息。公司有很好的研究这些影响的方法：所需要的是利用这些现有方法为公共利益开展研究并发布结果的机制，以便就用户影响展开更有根据的讨论。\n\
  \n对于内容分类器，需要的额外透明度涉及训练数据的收集方式。这一过程理应对公众更透明，并理应更多地征询公众意见——毕竟公众就是相关平台的用户。在公共领域策展训练集还为*共享*训练集提供了可能性，这可能带来公司资源利用效率的提高，以及在与人类福祉相关的功能上促进公司之间竞争的方式。\n\
  \n### Note\n\n1. On annotation protocols：一个值得探索的有趣选项是允许顾问在每个项目的适当标注上存在*分歧*。我们预计对于明确的案例会有良好的一致性，而对于“边界”项目，我们可以预期会有多种意见。我们可能希望训练分类器预测标注范围，而非单一类别。内容分类器可以很容易地被解释为为其看到的每个项目生成可能的类别上的概率分布。然而，如果每个训练示例的金标准标注本身也是类别上的概率分布，其对这些分布的建模可能会更好。特别是，如果以这种方式进行训练，它对给定决策的“置信度”评估可能会更准确（参见例如\
  \ Peterson et al., 2019）。\n\n### References\n\n* Brady, W., & Van Bavel, J. (2021).\
