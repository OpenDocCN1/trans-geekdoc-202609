  \n## 7 通用大型语言模型之道德图景\n\nGiada Pistilli\n\nSorbonne University, Paris, France\n\n\
  DOI: [10.1201/9781003320791-9](https://dx.doi.org/10.1201/9781003320791-9)\n\n###\
  \ 引言\n\n“通用人工智能”一词的混乱，常被困于营销与研究领域之间并引发争议，值得从伦理视角进行定义和分析。1980 年，美国哲学家约翰·塞尔发表了一篇文章，反对当时所称的“强人工智能”。继承艾伦·图灵的遗志，塞尔提出的问题是：“机器能够思考吗？”\
  \ (Searle, 1980)。简要概括该实验，哲学家提出了一个如今被称为“中文屋”的思想实验来尝试回答他的问题。思想实验的内容是想象一个房间，人工智能在其中拥有包含中文句子的文档集合作为知识库。一位中文母语者进入房间并开始与该人工智能对话；后者可以回答，因为它可以轻松找到与所提问题对应的句子。美国哲学家的论点很简单：尽管人工智能可以用中文提供答案，但它对该语言没有任何背景知识。换句话说，句法并不是语义确定的充分条件。\n\
  \n尽管“强人工智能”一词似乎如今已被“AGI”取代，但两者并不意味着相同。更重要的是，先驱者和人工智能从业者之间仍然存在大量混淆。机器学习工程师 Shane\
  \ Legg 将 AGI 描述为“旨在相当通用的 AI 系统，例如像人类智能一样通用” (Legg and Hutter, 2007)。这一定义似乎更像是一种哲学立场，而非工程论证。\n\
  \n因此，本章希望促进以人为中心的人工智能 HCAI 的发展，理解为由人类为人类创造的系统，其主要目标是提升人类福祉。因此，我的分析将尝试阐明与通用大型语言模型相关的具体问题，强调伦理张力并突出需要探索的潜在解决方案。\n\
  \n### 自然语言处理 NLP\n\n在讨论 AGI 的道德影响之前，有必要为我们的论点定位并澄清一些技术细节。\n\n自然语言处理 NLP 是语言学、计算机科学以及如今也是人工智能的一个子领域，专注于人类与机器语言之间的交互。最初基于符号识别系统\
  \ 称为符号人工智能，NLP 中的学习如今更多地指神经 NLP 中的统计概率方法。基于机器学习算法的 NLP 系统越来越受欢迎，其中一种学习方式正在掀起波澜：Transformer\
  \ (Vaswani et al., 2017)。我们可以将 Transformer 架构的引入视为 NLP 的革命性时刻，因为它使模型更容易扩展。基于自注意力思想，它允许机器专注于文本序列的特定部分并权衡每个词的重要性以做出预测。该技术试图模仿人类认知注意力。正如维特根斯坦所说，一个词只有在其语境中才有意义\
  \ (Wittgenstein, 1953)。同样，在预训练阶段，Transformer 会在词之间建立联系。其原理是使用非常大的数据集，并根据上下文将模型的注意力集中在其中一小部分但重要的内容上\
  \ (Vaswani et al., 2017)。\n\n例如，BERT 双向编码器表示模型 from Transformers (Devlin et al.,\
  \ 2018) 是一种强大的语言模型，利用了基于 Transformer 的架构能力，并在庞大的文本语料上训练。该模型旨在提供句子中存在的词的上下文理解，使其成为问答、情感分析、文本分类等\
  \ NLP 任务的理想选择。BERT 最突出的应用之一是在 Google 的搜索引擎中。Google 已采用 BERT 来更好地理解用户查询的目的，从而提供 supposed\
  \ 更符合用户意图的结果。然而，这一机制也未能免于批评及其潜在的失灵，例如突出不相关信息、传播错误信息或歧视 (Noble, 2018)。\n\n搜索引擎中使用语言模式的趋势正在加速；这些新的人机交互技术将改变我们获取信息及其研究的方式。例如，Google\
  \ 宣布他们将很快推出其新的“实验性 AI 服务” Bard，由其语言模型 LaMDA 语言模型 for 对话应用 提供支持 (Pichai, 2023)。就在去年夏天，该语言模型引起了很大关注，因为测试它的工程师表示他相信\
  \ LaMDA 具有感知能力 (Tiku, 2022)。许多学者对此表示反感，包括我，我们试图引起人们对记者所称的“感知 AI 陷阱”的关注 (Johnson,\
  \ 2022)。\n\n### 生成式预训练 Transformer 3 GPT-3\n\n为了说明我们的观点，我们将以 GPT-3 为例\n\n据 Ada Lovelace\
  \ Institute 2023 年报告以及 OpenAI 关于 AGI 的最新博客文章 (Altman, 2023) 报道，GPT-3 因其“通用”能力和范围而成为我们分析的良好候选对象——尽管\
  \ AGI 与“通用”之间的界限仍不清晰。\n\nGPT-3，生成式预训练 Transformer 3，是一种自回归语言模型，使用深度学习生成类人文本 (Broackman\
  \ et al., 2020)。OpenAI 的 API\n\nGPT-3 的多任务能力使其成为通向看似通用人工智能的进步的良好范例。此外，OpenAI 出售\
  \ GPT-3 访问权限的策略也值得注意，鉴于其潜在应用和用例所产生的炒作。虽然存在内容过滤等护栏，但其在实践中的有效性可能有限：鉴于 AI 系统的统计本质，这是一种对概率系统采取的决定性方法。如果再加上人类在使用这些模型方面的不可预测性，GPT-3\
  \ 背景下采取的方法仍然有限。\n\n### 用例应用\n\n如果我们查看此类 AI 模型的实际用例，有许多 GPT-3 在最终产品中应用的例子。例如，法国公司\
  \ Algolia\n\nGPT-3 API 的另一个用例是公司 Copy.ai。\n\n\n\n\n\n然而，当我们将这些系统集成到最终产品中并推向市场，像推广一部新智能手机那样轻描淡写地宣传它们时，我们真的能够信任它们吗？GPT-3\
  \ 自信而有说服力的输出，存在让其用户陷入修辞艺术的陷阱的风险。它的最新继任者，被过度报道的 ChatGPT，\n\n如果我们无法信任语言模型产生的内容，当人类内容与\
  \ AI 生成内容无法区分时，会发生什么？用户——作为在线内容的消费者——是否需要区分真实与虚假、人造与人类？这种缺乏区分会产生什么影响和道德后果？\n\n###\
  \ 人工“通用”智能（AGI）的问题\n\n让我们现在设想语言模型能力的扩展，以多种目标作为主要——但通用的——目的。正如上文所述，AGI 有多种定义。对我们的分析而言另一个有趣的定义，是\
  \ Goertzel 和 Pennacin 在其 2007 年著作 *Artificial General Intelligence* 中提出的：\n\n> 人工通用智能（AGI）指的是\
  \ AI 研究，其中“智能”被理解为通用能力，不限于任何狭窄的问题或领域集合，并包括广泛泛化到全新领域的[content]\n\n然而，当我们将这些系统集成到最终产品中并推向市场，像推广一部新智能手机那样轻描淡写地宣传它们时，我们真的能够信任它们吗？GPT-3\
  \ 自信而有说服力的输出，存在让其用户陷入修辞艺术的陷阱的风险。它的最新继任者，被过度报道的 ChatGPT，\n\n如果我们无法信任语言模型产生的内容，当人类内容与\
  \ AI 生成内容无法区分时，会发生什么？用户——作为在线内容的消费者——是否需要区分真实与虚假、人造与人类？这种缺乏区分会产生什么影响和道德后果？\n\n###\
  \ 人工“通用”智能（AGI）的问题\n\n让我们现在设想语言模型能力的扩展，以多种目标作为主要——但通用的——目的。正如上文所述，AGI 有多种定义。对我们的分析而言另一个有趣的定义，是\
  \ Goertzel 和 Pennacin 在其 2007 年著作 *Artificial General Intelligence* 中提出的：\n\n> 人工通用智能（AGI）指的是\
  \ AI 研究，其中“智能”被理解为通用能力，不限于任何狭窄的问题或领域集合，并包括广泛泛化到全新领域的能力。\n\n> \n> (Goertzel & Pennachin,\
  \ 2007)\n\n各种 AGI 定义往往都回溯到语言模型的一种跨领域能力，被定义为“通用”。此外，在其最新的博客文章“How should AI systems\
  \ behave, and who should decide?，\n\n### 关于通用大型语言模型的若干伦理关切\n\n开发通用大型语言模型而没有特定目标，而是具有广泛的能力，旨在迈向\
  \ AGI，这在各个层面引发了若干伦理关切。我不会探讨所有伦理关切，而是重点关注其中三个。\n\n1. 我们面临的第一个伦理张力与 AI 模型的无数能力有关。在道德哲学中，道德哲学处理定义、建议和评估使个人处于福祉状况的选择和行动，很难对具有多种不同范围的制品进行道德评估。此外，像\
  \ GPT-3 这样的大型语言模型的能力往往被定义，但在使用中会不断增加。鉴于自然语言中可能的用途之广，如果未被事先定义并由其开发者框定，该模型的能力可能是无限的。如果\
  \ AGI 的目标不再是将其自身识别为技能清单，而是拥有无限的技能，那么情况就会变得极其复杂难以控制。评估并对范围尚不完全了解的事物做出价值判断将不会容易。此外，控制可能的恶意用途也将具有挑战性，例如：网络钓鱼、虚假产品评论、错误信息和虚假信息等。一个例子来自新加坡政府科技局的一项研究。研究人员将\
  \ GPT-3 与其他专注于人格分析的 AI 产品结合使用，以生成针对同事背景和特征量身定制的网络钓鱼邮件。研究人员发现，更多人点击了 AI 生成消息中的链接，比人类撰写的邮件高出显著幅度（Hay\
  \ Newman, 2021）。此外，GPT-3 还被用于创建在线农场的內容，这些农场通常重新利用知名网站的新闻以吸引广告收入。其中一些 AI 驱动的网站已被发现传播虚假信息（Vincent,\
  \ 2023）。\n\n因此，我认为为了对技术制品做出道德判断，知道并定义其目标至关重要。在缺乏这些条件的情况下，伦理几乎找不到其用武之地。如果其能力和用例是无限的，计算风险、后果、背景和模型使用将非常具有挑战性甚至不可能。\n\
  \n此外，不涉及人类智能的心理学和特征，AGI 先驱者之间存在将后者与人类水平 AI 混淆的情况（Goertzel, 2014）。Nils Nilsson 将\
  \ AGI 描述为能够自主学习的机器；由此产生的问题是：在没有 *a priori* 固定限制的情况下，如何对其可能和各种用途进行控制？（Nilsson, 2010）有哪些保障措施可以防止滥用和误用？此外，对这种\
  \ AGI 的机器学习设定的限制是什么？鉴于这些技术处于最前沿，围绕这些系统的当前道德分析似乎往往停留在机器或人类智能的技术限制上。那后者能力的边界呢？\n\n\
  2. 其次，正如 Goetze 和 Abramson 在其论文“Bigger isn’t better”中指出的（2021），社会学家 Antonio Casilli\
  \ 对“点击工人”的研究（2019）以及研究员 Kate Crawford (2021))\n\n例如，著名的 ImageNet 数据集由同样著名的众包平台 Amazon’s\
  \ Mechanical Turk 进行标注，该平台提供定制服务以调整和改进 AI 系统的数据和知识库，同时训练它们以实现自动化（Crawford, 2021）。这些大型语言模型的训练方式有些模糊，并在为面向全球的\
  \ AI 模型提供数据的标注数据时引发了社会正义和相关性问题。所提出的一系列问题似乎指向一些当代哲学家所称的“技术经济”逻辑（Sadin, 2018）。根据这一逻辑，经济将推动技术和技术发展，寻求以最小成本生产最大利益。\n\
  \n另一个例子涉及 OpenAI 创建 ChatGPT 安全系统的最新丑闻，该系统可检测并过滤有毒语言。OpenAI 与肯尼亚的一家外包公司签约，对数万条文本片段进行标注，其中许多包含明确且令人不安的内容，例如儿童性虐待、谋杀、自杀和酷刑的描述（Perrigo,\
  \ 2023）。据报道，标注数据的工人时薪不到 2 美元，这引发了关于公平报酬和工人剥削的伦理关切，正如上述学者所报道的那样。此案例也说明，即使是最善意的意图，如果后续实施未能考虑与社会正义相关的伦理影响，也可能产生有限的行动和结果。\n\
  \n\n\n\n\n#### 3. 语言\n\n这一最后的论点使我们能够过渡到第三个伦理问题：语言。谈到自然语言处理和大型语言模型，谈论它在所难免。我认为大型语言模型中与语言相关的问题具有两种不同的性质。第一种是控制模型产生的文本生成（`text-out`）的难度。以\
  \ `GPT-3` 为例，它有一个内容过滤器，用于在遇到不安全（`text` 包含粗俗、歧视性或仇恨性语言）或敏感（`the text` 可能涉及敏感话题、政治、宗教，或谈论受保护群体如种族或国籍）的内容时警告用户。如上所述，该内容过滤器不准确且不令人满意，因为\
  \ `GPT-3` 生成的内容往往具有毒性。在语言模型及其在塑造沟通中的作用的背景下，必须记住，语言所传达的价值观在指导人类行为和行动方面是根本性的（Habermas,\
  \ 1990）。因此，语言模型内部存在的隐含价值观可能会通过其使用而传播。最近的实证研究表明，嵌入在 `GPT-3` 训练数据中的价值观主要反映的是美国价值观，而非其他文化背景下的价值观（Johnson\
  \ et al., 2022）。\n\n无论如何，在这些 `AGI` 的 `general-purpose` 条件下驯服这头巨兽仍然会很困难。在这种情况下，限制不仅是伦理上的，也是技术上的。文本生成是对同一句子中下一个词的概率计算，`GPT-3`\
  \ 将始终处于根据提示中插入的示例给出彼此不同的答案的条件。因此，如果 `text-in` 本身就已存在毒性，那么在 `text-out` 中找到它就很容易。不同的是，如果提示中没有有毒内容，`GPT-3`\
  \ 仍有可能以包含有毒元素的 `text-out` 作答。再次强调，这里伦理问题与语言模型的庞大性以及将其开放给多种能力的愿望有关。\n\n当谈到大型语言模型时，语言相关伦理问题的第二种性质是多样性的缺失。多样性不仅被理解为性别和种族的代表性，也被理解为实际的语言（`Spanish`、`Portuguese`、`Danish`\
  \ 等）。事实上，据 `OpenAI` 称，93% 的训练数据为英语。代表性最高的下一个语言是法语（1.8%），其次是德语（1.5%）、西班牙语（0.8%）、意大利语（0.6%）等（Brown\
  \ et al., 2020）。研究人员已经开始探索 `GPT-3` 的多语言能力，例如注意到它在少数语言如加泰罗尼亚语中的表现很差（Armengol-Estapé\
  \ et al., 2021）。由于数据的缺失与存在同样重要，除英语以外的语言极度稀缺的存在让我们产生了一些相当负面的思考，鉴于 `AGI` 这类 AI 模型旨在具有多语言和普遍的性质。英语压倒性且沉重的无处不在是一个严重问题，如果我们希望让\
  \ AI 对每个人都可及，就需要尽快解决它。因为 `GPT-3` 是一个使用自然语言运行并提供答案的系统，将其完全定向于英语以及围绕美国文化所形成的价值观，将无法体现我们多元社会中价值观的\
  \ pluralism。隐含地推广由大型美国产业所培育的单一文化之风险是无可争议的。这里的危险是双重的：一方面，单一文化的传播可能渗透了开发这些 AI 系统的产业的隐含或显性价值观。另一方面，这种单一文化可以通过属于主导这些新技术发展的文化的价值体系，被隐含或显式地推广和分享。一个引人注目的例子与最近\
  \ Facebook 吹哨人的证词有关。在她的证词中，Frances Haugen 指出，除英语以外的语言缺乏审核工具，使得在线平台的用户可以自由分享违反 Facebook\
  \ 内部政策的内容（Hao, 2021）。\n\n### 需要探索的潜在解决方案\n\n首先，必须提出一个具有挑战性但根本性的问题：这些大型语言模型的最终目标是什么？`AGI`\
  \ 的目的何在？由于在伦理中 `I do it because I can` 的范式是站不住脚的，我们应该能够清晰地定义 `the` 目的，而不是满足于模糊的\
  \ `general-purpose`。如果没有它，就很难找到正当理由，进而在道德上对其进行评估。考虑到机器学习技术的进步和当前的技术水平，在建立了明确的保障措施之后，对其进行越来越多的自动化才可能是可取的。如果这仍可成为构建\
  \ `AGI` 的一部分，那么制定 *ex-ante* 结构良好的能力限制将是必要的。\n\n其次，我们需要开始揭开 AI 产业背后关于我们社会正义问题的这些黑暗过程。`black\
  \ box` 不仅存在于算法内部，也存在于那些往往将世界上最贫穷的部分绑定起来让我们相信这些过程是自动化的——但事实并非如此——的剥削性流程中。为了运行这些大型语言模型所需的数据集，人类劳动的需求呈指数级增长。因此，国家和国际机构需要迅速开始提问，以便提供答案和这些新\
  \ `data labeler-proletarians` 的明确立法框架。\n\n最后，关于语言的问题，在我看来，是最棘手的问题之一。除了在 `AGI` 先驱者中发现的隐蔽虚伪，他们将产品作为\
  \ `universal` 出售，这里的问题是结构性的。今天我们谈论的是大型语言模型，但我想指出的是，整个互联网生态系统都由英语和渗透其每个角落的美国单一文化所主导。今天我们面临的困难我们可以转化为一种可能性：我们可以修复语言模型中的这类问题，并尽可能整合其用户的反馈。这一过程无疑会更长，但它可能是富有成效合作的开始。此外，它可能有助于改变\
  \ `AGI` 的范式，使其更偏向 `narrow AI`：面向特定能力并限定于其上下文。这样，每个上下文都可以占有其模型并使其成为自己的，从而确保与其实社会背景相关的价值观的多样性。\n\
  \n\n\n\n\n从伦理角度来看，与追求通用人工智能（AGI）相比，开发狭窄且基于文化的 AI 模型可能提供若干益处。一个值得注意的优势是，这些模型针对特定情境量身定制，能够满足特定社区的需求和价值观。通过这样做，这些模型可以减轻延续偏见和非预期后果的风险，因为它们与当地的伦理和文化规范保持一致。专注于狭窄的\
  \ AI 模型，利益相关者可以确保开发过程更具可控性、透明度，并接受更严格的审查和问责。此外，鉴于英语在 AI 生态系统中的主导地位，优先开发非英语语言的语言模型对于确保多元的语言和文化视角在话语中得到代表至关重要。综合来看，优先开发狭窄且基于文化的\
  \ AI 模型可以解决与 AI 相关的伦理问题，并以符合当地价值观和需求的方式促进技术的伦理使用。\n\n本文提出的论点以草根组织 Masakhane 为例，\n\
  \n另一个积极的例子是 BigScience 开放科学研讨会，该项目正在解决语言和数据治理问题\n\n### Conclusion\n\n### 结论\n\n\
  总之，我们已经看到技术问题往往与伦理问题相伴而行。在追求真正的 HCAI 发展的道路上，即 AI 系统被定制以符合人类价值观，并必然确保人类受益，解决所突出的伦理紧张关系是必不可少的。此外，鉴于人工智能科学领域的跨学科性质，这些伦理问题若没有工程师的帮助就无法解决。而当我谈到哲学家和工程师携手合作时，这也意味着工程师不应在没有适当专业知识和知识的情况下自诩为伦理学家。事实上，哲学已经提出了这一类问题数千年；其经验可以让我们避免犯同样的错误，更重要的是帮助我们在这一新的不断演进的技术背景下很好地提出正确的问题。对道德哲学的高度关注至关重要，代表着紧迫的关切。尽管如此，正如当代所显现的那样，新兴技术所带来的复杂挑战无法仅通过技术努力来解决。在这方面，社会科学和人文学科被要求在帮助这一学科方面发挥关键作用。因为科学用于描述现实，而伦理最终指导着这种现实未来应当如何被构建。\n\
