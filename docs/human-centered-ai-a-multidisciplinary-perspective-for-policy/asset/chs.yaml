  \n## Acknowledgments\n\nThis book’s publication was made possible by the generous\
  \ financial support of Université de Montréal (UdeM), Mila (Québec Artificial Intelligence\
  \ Institute), and the French government through Université Côte d’Azur.\n\nOur gratitude\
  \ extends to HAICU’s editorial committee and the U7+ Alliance for their invaluable\
  \ support and guidance throughout this project. We must highlight the distinctive\
  \ role played by Annelise Riles, who was Executive Director of the Buffet Institute\
  \ for Global Studies at Northwestern University at the time this book was written,\
  \ in bolstering both HAICU’s work and the U7+.\n\nSpecial warmth and appreciation\
  \ are directed to Réjean Roy, a strategic advisor at UdeM, whose expert guidance\
  \ enabled the authors and our editorial team to complete a high-quality book on\
  \ schedule. We also wish to express our thanks to Antoine Congost, a project manager\
  \ at UdeM, for his invaluable aid in the final stages of the book’s editing process.\n\
  \nLast but certainly not least, heartfelt thanks go to Daniel Jutras, Rector of\
  \ UdeM, for his unwavering encouragement throughout this project. His support has\
  \ been a cornerstone of this accomplishment.\n\n### Note\n\n1. As part of the UCAJEDI\
  \ Investments in the Future Project, overseen by France’s National Research Agency\
  \ (reference number ANR-15-IDEX-01).\n\n## Foreword\n\nIn July 2023, I testified\
  \ before the US Senate Judiciary Subcommittee on Privacy, Technology, and the Law.\
  \ My objective was to convince American officials and citizens of several key points:\
  \ AI systems already outperform human intelligence in numerous areas; these tools\
  \ might achieve broad human cognitive competence within decades or even years; we\
  \ must proactively address the grave risks this poses to our societies and lives\
  \ before they manifest; and this necessitates ensuring AI systems operate as intended,\
  \ consistent with democracy, human values, and standards.\n\nDesigning, building,\
  \ and deploying AI systems that adhere to human values and standards—that, to use\
  \ the words of philosopher Shannon Valor\n\nFirstly, we must decide to change the\
  \ current trajectory leading to the dangerous concentration of extreme power derived\
  \ from AI in the hands of a few in an uncontrolled way, because extreme power corrupts\
  \ and threatens the very notion of democracy and human rights. Instead, as a collective,\
  \ we must deeply reflect on the human values and standards we wish to instill in\
  \ our AI systems and deliberate how and who determines them. Human rights are certainly\
  \ a key element here, one that should have a stronger presence in AI debates. And\
  \ we must combine this reflection with swift actions considering the pressing regulatory\
  \ and governance needs that we face nationally and globally with respect to AI.\
  \ We must act now because the commercial AI train is accelerating with the current\
  \ massive investment in generative AI.\n\nSecondly, we should ensure experts from\
  \ diverse fields, including sociologists, legal experts, economists, and political\
  \ scientists, join this endeavor. Interdisciplinary work is challenging, and producing\
  \ results requires strong commitment, time, and deliberate strategies, but it is\
  \ essential, as no single discipline can address all the complex governance issues\
  \ raised by AI’s development and deployment.\n\nThirdly, it is indispensable, as\
  \ the United Nations’ Secretary General recently remarked to the Security Council\
  \ on Artificial Intelligence,\n\nRégis, Denis, Axente, and Kishimoto’s book is among\
  \ the pioneering works emphasizing the importance of human-centered AI. It plays\
  \ a vital role in addressing our common challenge: How do we envision our future\
  \ with AI? And what will we do to activate this vision?\n\n**Professor Yoshua Bengio**\n\
  \n*Full professor of Computer Science at Université de Montréal*\n*Founder and Scientific\
  \ Director of Mila—Québec AI Institute*\n*2018 Co-recipient of the AM Turing Award*\n\
