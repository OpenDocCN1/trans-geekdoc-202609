  \n\n\n\n\n这段文字是弗朗茨·卡夫卡《判决》的结尾，该书是荒诞派书籍的经典之作。主人公约瑟夫·K.注定要在一种不可解释的程序以及促成这一程序的人们神秘的行为的摆布下，走向执拗的死亡。但他的命运荒诞之处——在哲学荒诞主义的意义上，是非理性的、缺乏意义、因而不可理解的？将关键要素放在这样一个事实是合适的，即正如小说中反复提到的那样，没有任何东西被完全解释，也没有对他为何被以某种方式对待的原因提出任何问题的答案。\n\
  \n> “但我怎么会被逮捕呢？怎么会变成这样？”“你又开始了，”警察说着，把一块涂了黄油的面包蘸进蜂蜜罐。“我们不回答这种问题。”“你必须回答，”K.说。“这是我的身份证件，现在把你的证件给我看，我一定要看到逮捕令。”“哦，我的上帝！”警察说。“在你这种处境下，你还想开始发号施令，是吗。这对你没什么好处，即使你认为会有——我们可能比你认识的任何人都更站在你这一边！”\n\
  \n> \n> (Kafka, 1925：第 1 章)\n\n在过去，我们所称的某些“审判”也同样具有决定性。在欧洲，曾经广泛使用的一种程序叫做宣誓清白，即被告否认指控由证人在宣誓下承认。在该程序中，证人作证的并不是其陈述内容为真，而是被告诚实，因此他的陈述值得信赖。或者，在被称为“决斗审判”的程序中，原告和被告应进行直接决斗，失败者被视为有罪或负有责任。\n\
  \n这就是为什么我们可以假设，随着现代时代理性与科学思维的发展，这种类型的审判消失了，并逐渐转变为我们今天所知的程序。这种程序的特征如下：首先，有原告和被告，双方提交其主张和支持证据；其次，一名法官，作为\
  \ supposed 的中立第三方，对其价值进行评估并决定谁胜谁负\n\n### 深度学习与理性的缺失\n\n当我们考虑到*推理决策*因此占据司法程序的核心时，我们会想起人工智能利用的一个方面与此相冲突。在最近几年被称作第三次\
  \ AI 繁荣的快速技术演进中，\n\n专家系统曾以机器代替专家进行判断和决策的梦想被提出，其要分析我们的思想，将其形式化为规则，然后作为程序引导到计算机使其能够理解。因此，专家系统面临的局限是它们无法处理我们自己也不理解的判断——例如，任何人能否清楚地用语言表达一块牛排是否烤得恰到好处，或者我们基于何种信息做出判断？另一方面，深度学习是一种系统，它自动学习输入与输出之间的关系（因果关系）并据此改变自身的行为模式。\n\
  \n考虑路德维希·维特根斯坦关于“家族相似性”（familienähnlichkeit）的说法。例如，各种被称为游戏的实体之间是否存在一个共同的本质，一个定义其是或不是游戏的单一要素？\n\
  \n> 例如看看棋盘游戏，它们之间有着多种多样的关系。现在转向纸牌游戏；在这里你会发现与第一组有许多对应之处，但许多共同特征消失了，其他特征出现了。当我们接下来转向球类游戏时，很多共同之处得以保留，但很多又丢失了。\
  \ (…) 我们看到一个复杂的相似网络相互重叠和交叉：有时是整体相似。\n> \n> (Wittgenstein, 1953：66)\n\n即使我们无法明确回答“什么是游戏？”这个问题，我们通常也能区分游戏与非游戏，即使我们无法描述家族外表之间存在的共同点，我们也能识别出成员是谁。我们所看到的然后不是一条将家族内部与外部划分的单一规则，而是多个特征（Züge）及其*强度*，我们自己通过学习学会了理解——“我们该如何向某人解释什么是游戏？我想象我们应该向他描述游戏，并可能补充说：‘这种和类似的东西叫做‘游戏’”\
  \ (Wittgenstein, 1953：69)。专注于后果评估而非规则的深度学习的发展，已成为 AI 第三次繁荣的真正基础。换句话说，AI 超越人类主观判断的可能性预见于其学习和再现*不可言说*的相似性背后的东西的能力。另一方面，这也意味着所获得的结果对我们*人类*来说将是不可理解的。\n\
  \n想象阅读 X 光片（尽管我从未做过）。可以很好地想象一种情况，其中某些癌症与其他癌症具有不同的特征，而专家病理学家可以发现这些差异。“你看，这里这个边界是有特征的，你知道的”——当然我看不到。但如果专家这么说，其他专家也同意他，我别无选择，只能接受它作为正确的意见。因此专家的判断往往会带上对非专家来说不可理解的黑箱品质。问题是，如果处于这种境地的是一个被训练的\
  \ AI，而不是一个人类专家，如果被问及，他会在时间、努力和好心情允许的情况下给出其判断的基础？“你，一个普通人，不会理解，但这是癌症。”“你不会理解，但他会再犯罪。”“你不知道这一点，但我们将爆发核战争。”\n\
  \nAI 技术的问题，至少在目前这个时间点上，是*它没有告诉我们*决策过程或它为何得出特定结论的理由。假设 AI 的特征是返回适当的结果，即使我们不知道为什么，在游戏中使用它（一个非常强大的象棋\
  \ AI，尽管我们不知道为什么）或在提醒专家的系统中（AI 标记*可能*异常的数据，当医生检查血液检查结果时）可能没有多大问题。然而，它能被用作刑事法庭判决或税收的工具吗？或者，如果使用本身是可能的，我们能接受它吗？\n\
  \n特别是最后一点，鉴于司法机构做出直接影响公民权利和义务并执行后果的决定的性质，将变得极其重要。例如，如果 AI 被用来交易个人所有者的股票，它可能被认为属于自我决定的范畴，包括使用什么系统以及对它的依赖程度。由于受系统影响的是他的财产，可以说应该允许个人随心所欲。然而，围绕司法机构的情况不能用这种自我负责的逻辑来证明合理。\n\
  \n\n\n\n\n这就是法律哲学探讨为何法律下发出的命令与抢劫威胁有所不同（Hart, 2012：第 1 章、第 2 章和第 3 章）。而许多作者所说的是，法律是一条普遍规则，而在个别情况下所下的命令可以解释为该规则的应用（Austin,\
  \ 1832）。这就是为什么我们将其理解为法治，与掌权者的赤裸裁决不同，即使在现实中做出决定的是一位法官，一个具体的个人，并且法律被理解为我们人民的自我统治，即我对我自己的统治。因此，为了尊重人民作为统治者和被统治者，必须以`with\
  \ reason`证明他的对待，无论是什么，都基于法律。\n\n我们还必须进一步指出，法律与强制相关联，并且，即使一方拒绝遵守，国家最终仍会以武力执行其命令。为了防止掌权者滥用权力并确保此类系统的正常运作，其运作必须公开以供核实。这一点也解释了展示理由的重要性。\n\
  \n### AI 的持续使用\n\n尽管如此，在现实中，AI 已被证实在多个国家的司法程序中得到使用。在美国多个州，基于 AI 计算的风险评分被用于刑事审判中，以确定被告的刑期或是否给予囚犯假释。例如在威斯康星州，据报道由\
  \ Northpointe（现 Equivant）开发的 COMPAS 系统被用于根据年龄、种族、就业状况、教育水平和药物使用情况确定再犯风险。然而，计算方法的细节并未披露，因为它们被视为商业秘密。\n\
  \n再犯可能性是假释决定中的重要部分，它只是对未来的预测，因此存在不确定性。可能可以期望 AI，由于可以参考大量历史记录并使用准确的概率，将能够做出比仅拥有有限案件经验的人类法官更可靠的决定。此外，也不能说法官不会受到外部因素如当事人年龄、性别和种族的影响并反映其自身偏见。有人可能会争辩说，AI\
  \ 的判断没有对特定性别或种族的偏见，会更中立。至少 Equivant，该开发者坚持认为“许多研究已经得出结论，客观的统计评估实际上优于人类判断（Equivant,\
  \ 2019：1–2）。”据该公司称，提到“在超负荷和拥挤的刑事司法系统中，简洁性、效率、易于管理以及关键风险/需求数据的清晰组织至关重要（Equivant,\
  \ 2019：2）”，COMPAS 在关键风险和犯罪因素的全面覆盖与简洁性和实用性之间的权衡上实现了适当的平衡。\n\n根据威斯康星州司法统计，地区法院（第一审）提起的重罪案件数量从\
  \ 2013 年的 36884 起增加到 2016 年的 39819 起，再到 2019 年的 43614 起，而处理案件所需的中位天数从 2013 年的 128\
  \ 天增加到 2019 年的 152 天，表明法院负担加重。\n\n一名因系统判定其可能再犯而被判入狱的被告提起诉讼，声称（1）由于其细节未知，系统的准确性无法受到质疑，以及（2）其使用种族和性别作为数据的一部分违反了正当程序，但在\
  \ 2016 年威斯康星州最高法院驳回了该诉讼，裁定如果有关于其“局限性和注意事项”的警告，使用此类评分是允许的。\n\n在中国，AI 在司法中的利用也已变得普遍。2019\
  \ 年，海南省法院开始使用 AI 对刑事案件进行权衡并起草判决。2021 年，上海开始测试使用 AI 取代检察官对是否起诉刑事案件的决定。2022 年，中国最高人民法院发布指导意见，要求在未来三年内建立\
  \ AI 使用的基础设施。\n\n在中国，由于与经济发展相关的社会环境变化，近年来诉讼数量迅速增加，法院人力资源短缺已成为政策问题。以知识产权相关民事诉讼数量为例，作为快速变化领域的代表，2018\
  \ 年第一审新立案案件数量为 301278 起，比上一年增长 41%（Tao, 2019）。作为这一增长的背景，人们指出，过去由行政组织参与的纠纷解决，由于案件内容因技术发展而变得更加复杂，已无法取得令人满意的结果。可能存在利用自动化诉讼程序和\
  \ AI 诉讼支持的需求，以有效利用有限的人力资源。\n\n可以说，AI 的无理由决策在司法中越来越多地被使用，尽管程度不一：支持专家法官、由专家参考，或作为专家的替代。在美国的例子中，由私营公司负责\
  \ AI 开发时，除了技术本身固有的风险外，商业秘密壁垒将使决策更加不透明。如果这种趋势持续下去，也会产生恐惧，即一个人可能在未被告知任何理由的情况下被监禁甚至失去生命，就像约瑟夫·K\
  \ 的案例一样。\n\n《人工智能法案》，欧盟 2021 年关于 AI 监管的提案（European Parliament and Council, 2021），根据其固有风险将\
  \ AI 系统分为四个层级，而协助司法机构调查和解释事实和法律，并将法律适用于事实的 AI 被视为高风险 AI 的一种，第二层级。它们需要满足人类监督、透明度和信息提供的要求，并需经过事先适用性评估。可以注意到，这种对待也基于对我们暴露于荒谬判决的谨慎感。\n\
  \n### 理由与原因\n\n但问题是什么？有一种观点认为，由于 AI 在物理上是计算机程序的算术过程，其运行过程可以被记录下来（只要有足够的存储空间）并得到验证（除去需要多少努力和时间的问题）——因此\
  \ AI 不是黑箱，或者如果能构建适当的验证方法，就不会是黑箱。然而，这一观点忽略了这样一点：对解释请求应给予的是行动的`reason`，它表示语义关系，而不是表示因果关系的`cause`——正如我们无法接受“因为太阳”作为射杀阿拉伯人致死的适当动机，即使这是事实的准确描述（Camus,\
  \ 1942）。\n\n\n\n\n\n我们要注意，维特根斯坦在《哲学研究》之前的时期引入了两组不同的术语。第一组是“标准”和“症状”，第二组是“理由”和“原因”。“对于‘你怎么知道某某情况成立？’这个问题，我们有时用‘标准’来回答，有时用‘症状’来回答（Wittgenstein,\
  \ 1969：24）。在这里，标准是用来确定某种情况是否成立的定义，而症状则意味着‘经验告诉我们它与（……）我们所定义的标准现象同时出现的一种现象’（Wittgenstein,\
  \ 1969：24）。\n\n例如，我们都知道患流感的人会突然发高烧并抱怨关节疼痛和其他症状。在这种意义上，这些要素——高烧和关节疼痛——是经经验得知的现象，是伴随流感感染的征兆。但由于流感并不是唯一会产生这些症状的疾病，因此这些症状的存在是对流感诊断的必要但不充分条件。一个在社会上可接受的、足以回答为何诊断为流感的充分标准将是*通过检测发现流感病毒*。当然，前提是该检测在社会上被认可为对流感有效，例如经卫生部批准。因此，标准将被理解为一种社会定义的要件，是导致结果的必要且充分条件。\n\
  \n考虑这个问题，“你为什么诊断该患者为流感？”实际上，这个过程可能首先始于患者自身对高烧和关节疼痛的察觉，随后是医生对流感的怀疑，再随后是检测结果发现病毒。如果我们被要求准确描述这一过程，我们首先会引用高烧和关节疼痛的征兆，而这些无疑是因果关系的起点，因为如果没有这些观察，通向诊断的过程就不会被启动。在这种意义上，这些征兆绝对是最终诊断的“原因”，并且它们与结果之间存在因果关系。\n\
  \n然而，也确实是这样，仅凭这些征兆的存在并不足以证明诊断的合理性，因为有几种疾病会表现出相似的症状。应被引为诊断充分理由的是流感作为一种疾病的定义，以及阳性病毒检测这一事实，即标准，它在语义上与结论相联系，这就是我们所说的“理由”一词的含义。这里所涉及的是语义关系，是情境意义的联系，在这种联系中，阳性病毒检测可以立即被理解为流感，并且两种现象的意义是相同的。\n\
  \n另一方面，当我们为自己的思想提供“理由”时，我们可以区分理由和原因。推理是实际执行的计算，而理由不过是在该计算中回溯一步。（……）要求理由就是询问我们是如何得出该结果的”\
  \ (Ambrose, 1979：4)。由此可知，回答者的主体性在其中被假定。原因则是在行为主义解释中被给出的东西，是可以通过实验发现的东西 (Ambrose,\
  \ 1979：4)。因此，只要主体的行为是可观察的就足够了，并且与主体性无关。\n\n例如，当朋友去夏威夷旅行时，我们可能会假设两个问题和相应的答案——“你为什么去夏威夷？”“因为我想享受碧蓝的大海。”以及“你怎么去夏威夷？”“乘飞机。”前者是关于理由的问题，人们期望提供一个为行为辩护的解释（例如，我们不会把“因为我想看冰川”这样的回答视为体面的）。人们意识到夏威夷的碧蓝大海或挪威的冰川这两个概念意义之间的联系。\n\
  \n或者可以注意到，当询问第三方的行为时，这个问题涉及对他人意图的预设。例如，“他为什么去夏威夷？”“也许他想看大海。”那么期望的回答就是这样的想法能为他的行为提供一致的解释，这仍然取决于我们的标准，即*这是正常行为*。\n\
  \n相比之下，原因的问题纯粹是因果性问题，我们也可以将其用于无生命物体。请注意以下两个问题的答案是相同的。“那座火山为什么会喷发？”和“那座火山如何喷发？”——两个问题的答案都相同，例如“因为地下岩浆膨胀。”关键在于我们将理由理解为为可能有目的的他人辩护，而这与我们可能对无生命物体提出的那种原因不同。\n\
  \n### 遵循规则\n\n重要的是，我们“遵循规则”的实践与理由的呈现密切相关。考虑迈克尔·达米特所提及的“伍德豪斯笑话” (Dummett, 1991：93)。一个人问，“你会说西班牙语吗？”另一个人回答——“我不知道；我从未尝试过。”根据达米特，这种回应在涉及实践能力的问题上是有意义的，例如“你会游泳吗？”，但在语言问题上则是无稽之谈。这基于他的断言：一个不懂西班牙语的人甚至不应该尝试说它。不会游泳的人知道游泳是什么，因此可以尝试。但一个不懂西班牙语的人不知道说西班牙语是什么。\n\
  \n但这里两个阶段的行动被混淆了。如果我们把“会游泳”看作一个事实问题，如掉进水里并在一定时间内不下沉，那么即使从未尝试过也可能成功。但如果我们把问题放在这一层面，那么在西班牙的酒吧里模仿周围顾客的点单，在一定时间内成功进行交流也是可能的。当然，那并不是按照西班牙语法的正确表达水平来说西班牙语，并且认为这可以在没有过去学习西班牙语的情况下实现是无稽之谈。但如果你以类似的方式思考游泳，按照一套规则，例如蛙泳的规则，那么认为你可以在没有学习过的情况下做到这一点就是无稽之谈。\n\
  \n换句话说，问题在于作为事实做某项行动的层面与按照一套规则做它的层面之间的差异。我们可以在不知情的情况下实践一种行动，而我们不能在没有意识到并且没有理由认为自己能做到时进行规范意识的行动。另一方面，我们不能在不知情且没有理由认为自己能做到时进行规范意识的行动。而造成差异的是，“理由”一词意味着规范性的正当化，而不仅仅是事件的原因。\n\
  \n\n\n\n\n“我因为太阳而射杀了阿拉伯人”在法庭上不会被接受为合理的答案，因为这违背了我们的常识，即正常人不会因这种理由而杀害他人。任何人们不认为合理的解释都会被驳回为蓄意的谎言，或者，如果他确实真诚地相信它是真实的，则是其自身失调的反映。在真实的司法程序中，可能会发生警察、检察官，甚至辩护律师会试图说服被告改变其陈述，理由是这种动机无法说服法官，从而使他因蓄意撒谎而被怀疑企图掩盖其真实动机。出现在法律适用过程中的理由不仅仅是客观事实，而且往往共同产生为社会认可的语义关系的指示。\n\
  \n我们要注意，在某些情况下，被告本人也有动机与其合作。假设我驾驶的汽车造成事故并伤害了某人。如果不存在导致事故且无我过错的身体状况，或汽车缺陷，警察会说一定存在伤害受害者的故意或疏忽驾驶，而我自己也必须承认，逻辑上这两种情况是它可能发生的唯一方式。即使我对自己犯错没有意识或清晰的记忆，我也会推断我一定在没有意识到的情况下粗心大意，我会试图将此作为事故的原因陈述，因为鉴于故意伤害通常比疏忽受到更严厉的惩罚，我有动机避免前者。因此，理由往往是通过从后果进行回顾性推断而逻辑构建的。\n\
  \n### 结论\n\n鉴于法庭要求的正是这种理由，很明显，已使用深度学习实施的系统尚未达到回答此问题的水平。即使在所谓的“可解释 AI”中，其所指的在许多情况下是可视化影响结论的参数和事实要素，似乎仍停留在展示因果关系的层面。\n\
  \n例如，经济合作与发展组织 OECD (2019) 公布的人工智能原则将“透明度和可解释性”列为七项原则之一，与“以人为本的价值观和公平”等并列。此外，欧洲委员会人工智能高级别专家组于\
  \ 2019 年 4 月公布的《值得信赖的人工智能伦理准则》中，七项要求之一的透明度也被列为“可追溯性、可解释性和沟通”(Independent, 2019:\
  \ 14)。\n\n此处所使用的可解释性因此应被理解为一个包含对理由进行规范性证成的更高层次。这正是我们在司法实践中所展示的。这保证了对司法进行批判性调查的机会，保证了与强制密切相关的审判制度的健全运作。相反，如果在没有确保解释理由的可能性的情况下在审判中使用\
  \ AI，它将创造一种既不保证公民的自主控制，也不保证当事人可验证性的强制系统。至少，这对于民主和人权是基本原则的国家而言是不合适的。在实现这一点之前，有必要避免让\
  \ AI 独自做出与司法相关的决定，并将其使用限制为由人类专家谨慎参考，以便实现以人为本的 AI 使用。\n\n### 注释\n\n1. 存在某些例外，例如当女性因不忠指控被起诉时，她可以有人为她而战（“冠军”）。\n\
  2. 在某些法律体系中，可随机从公民中选出的陪审团可能会被添加，但即使在这种情况下，目标也是通过排除利益相关者来确保与职业法官相同的中立性。\n3. 当然，法律体系是通过各国民主程序形成的，其内容因国家而异。作者的知识有限，可能不适用于所有国家。\n\
  4. 一般而言，从 1956 年达特茅斯会议创造“人工智能”一词到 1960 年代追求推理和搜索方法的发展，被称为第一次 AI 热潮，与 1980 年代和 1990\
  \ 年代旨在通过知识表示实现专家系统的第二次热潮，以及从 Jeffrey Hinton 于 2006 年开发深度学习开始的第三次热潮相区别。\n5. 威斯康星州法院系统，巡回法院案件统计，[`www.wicourts.gov/publications/statistics/circuit/historicalcircuitstats.htm`](https://www.wicourts.gov/publications/statistics/circuit/historicalcircuitstats.htm)\n\
