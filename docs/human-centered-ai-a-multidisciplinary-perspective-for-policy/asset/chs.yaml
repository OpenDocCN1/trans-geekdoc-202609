  \n## 24 作为 AI 治理的敏捷治理 日本治理改革的挑战\n\nKodai Zukeyama\n\nKyushu Sangyo University, Fukuoka,\
  \ Japan\n\nTomoumi Nishimura\n\nKyushu University, Fukuoka, Japan\n\nHaluna Kawashima\n\
  \nTohoku Fukushi University, Sendai, Japan\n\nTatsuhiko Yamamoto⁵\n\nKeio University,\
  \ Tokyo, Japan\n\nDOI: [10.1201/9781003320791-28](https://dx.doi.org/10.1201/9781003320791-28)\n\
  \n### 引言\n\n2019 年，日本政府发布了 “以人为中心的 AI 社会原则”（CAO 2019）。在与产业界、学术界和政府的调查与审议，以及他们的观点之后，该文件被创建用于在国际讨论中使用，包括\
  \ OECD 和 G7 会议，关于 AI 的原则。\n\n在该文件中，以人为中心的 AI 社会原则的基本哲学以政府必须考虑的具体原则“AI 社会原则”为支撑，以及开发者和运营者必须牢记的“AI\
  \ 研发与利用原则”。虽然前者原则已由政府详细阐述，后者则被视为开发者自愿制定并遵守的项目。政府因此创建了关于 AI 开发和运营的“指南” (MIC 2019，等)，呼吁企业使用的治理模式发生根本性转变\
  \ (METI 2020，2021a，2021b)，并提倡敏捷治理作为一种模式 (METI 2021c)。政府认为敏捷治理模式将有助于私营部门遵守“以人为中心的\
  \ AI 社会原则”。\n\n以这种方式，日本参与了关于以人为中心 AI 原则（以下简称“HCAI”）的国际审议。然而，其在信息领域的监管方法并非普遍适用。以个人数据保护为例进行比较，如果欧盟采用基于原则的、硬法监管模式，而美国尊重私营部门的经济自由并期望自我监管，日本则以法律和指南设定总体框架，同时将规则的具体内容和运作留给企业。日本在个人数据保护方面的做法可以看作是介于欧盟和美国之间的一种中间方法。对于\
  \ AI 监管，日本将敏捷治理作为其模式，依赖私营行为者的单方面努力，而不强加 HCAI 的具体组成部分。这种方法无法与欧盟的《人工智能法案》或美国的人工智能风险管理框架等相提并论。\n\
  \n日本的案例可能丰富了关于采用何种法律方法——基于原则的方法或务实导向的方法——以实现 HCAI 的讨论。日本的做法是全球 AI 监管这一新兴时期中的多种案例之一。审视其监管方法也引导我们思考政府和私营行为者如何为\
  \ HCAI 做出贡献。\n\n为了从 HCAI 视角批判性地探讨日本的敏捷治理，本章将分析敏捷治理如何与 HCAI 相关（第二部分）以及日本政府对敏捷治理的定义（第三部分）。日本建立\
  \ HCAI 的现状及其所涉及的问题将在第四部分进行审视。通过此，我们希望为旨在实现 HCAI 的 AI 治理的形态的国际审议做出贡献。\n\n### 为什么敏捷治理与\
  \ HCAI 相关？\n\n#### AI 与社会 5.0\n\n人工智能，通常称为 AI，是一种能够使先进信息处理系统处理多样且海量的数据，并在各种情况下无需人工干预即可进行自动决策的技术。由于这些特征，AI\
  \ 在日本政府倡导的名为“社会 5.0”的未来社会愿景中发挥着重要作用。\n\n社会 5.0 指的是“通过网络空间和物理空间高度融合的系统，实现经济发展与社会问题解决相兼容的人类中心社会”\
  \ (CAO 2021: 11)。在这样的社会中，假设网络空间与物理空间之间会交换大量信息，因此 AI 作为先进的信息处理技术，在处理中发挥着至关重要的作用。事实上，日本政府关于实现社会\
  \ 5.0 的文件经常提及 AI。\n\n\n\n\n\n尽管人工智能有潜力为社会带来更富裕和更美好的发展，如大量文献已指出的那样，人工智能也存在许多弊端，因此在研发和利用人工智能时必须谨慎。例如，人工智能，特别是使用深度学习等技术开发的人工智能，往往因延续现有的歧视和不平等而受到批评。此外，由于人工智能所谓的“黑箱”特性，可能会无意中发生许多负面结果，使得难以确定原因或追究责任。因此，现在普遍认为，在人工智能的研发和利用中实现以人为中心至关重要。实现以人为中心的人工智能也被称为\
  \ HCAI。\n\n### HCAI 的两种方法\n\n为了实现开发满足以人为中心的人工智能的目标，可以考虑两种主要方法。第一种是直接方法：在人工智能实施和应用*之前*，探索\
  \ HCAI 应满足的规范。如果能够对“以人为中心是什么”或“HCAI 应满足哪些要求”等问题给出明确的答案，那么剩下的议题就纯粹是技术性的。参考该明确的答案，人工智能或许就能自动成为\
  \ HCAI，也许在诸如形式化方法等成熟技术的帮助下，而这些技术在现代甚至不被称作人工智能。\n\n第二种方法是间接方法：不事先确定 HCAI 的规范，而是在人工智能的开发和利用实践中*逐步*探索和实现它。这种方法始于人类与可能并不一定满足以人为中心的人工智能共存，这就要求我们应对由此产生的人工智能风险。\n\
  \n比较这两种方法，第一种方法似乎更理想。事实上，已经有一些尝试为公平提供明确定义，而公平被认为是人类中心性的一项重要要素。然而，要使第一种方法奏效，就需要在全面和完整的基础上开展此类工作。正如\
  \ Wallach 和 Allen 在 2009 中指出的那样，这是一条极其困难的道路。此外，在这些困难的尝试取得成功之前，对人工智能的使用实施暂停并不是现实的选择。由于人工智能的快速发展，甚至比其他被描述为具有“狗年”发展速度的信息处理技术还要快，就没有足够的时间来完全确定人类中心性。\n\
  \n相比之下，第二种方法可能具有*轻量级*方法的优势，因为它允许在无需完全预先明确人类中心性的情况下逐步实现 HCAI。虽然这种方法可能存在临时性的缺点，但在就人类中心性构成何种内容达成社会共识不切实际的情况下，它可能特别有效。这在东亚尤其可能成立，因为关于人类中心性的价值观和信念可能与西方不同，使得达成共识具有挑战性。因此，第二种方法是更实际和更有前景的选择。\n\
  \n### 敏捷治理与 HCAI 的关系\n\n如前一段所述，在第二种方法的情况下，虽然无需完全确定 HCAI 的规范，但建立一个*适当*的治理框架以应对来自不一定以人为中心的人工智能的风险是很重要的。稍后章节中介绍的“敏捷治理”被认为是对这一挑战的日本政府的回应。\n\
  \n敏捷治理是一种不依赖于严格属于监管的手段的治理模式\n\n事实上，敏捷治理与日本的人工智能治理密切相关。例如，在日本经济产业省 2020 年的报告中，人工智能被定位为社会\
  \ 5.0 的重要要素，并认为需要敏捷治理来跟上人工智能等先进技术的发展速度。此外，由经济产业省编制的《人工智能原则实施治理指南》，以实施日本内阁府制定的以人为中心的人工智能社会原则，该指南宣布其运行应按照敏捷治理的方式进行。\n\
  \n### 敏捷软件开发类比\n\n也许，我们可以通过比较两种著名的软件开发方法，即瀑布式软件开发和*敏捷*软件开发，来学习对前述关于敏捷治理与人工智能之间关系的讨论有价值的经验教训。\n\
  \n瀑布式开发通常是指遵循“瀑布模型”的软件开发。在瀑布模型中，软件开发被理解为一系列步骤，每个步骤都依赖于前面的步骤。相比之下，敏捷软件开发是在著名的文件“敏捷宣言”中制定的，源自被称为“*轻量级*软件开发”的一组软件开发方法论。它们是为了克服传统软件开发方法论的缺点，例如瀑布开发而开发的。\n\
  \n由于后续步骤对前序步骤的依赖性，瀑布开发存在两个缺点。首先，它导致一个*顺序*的开发过程，不允许灵活地修改前序步骤的结果。其次，由于前序步骤的质量直接影响后续步骤的质量，这导致一种*预测性*和不灵活的开发方法。\n\
  \n鉴于信息处理技术正在快速发展，而利用这些技术的商业环境也在不断变化，这些缺点至关重要。为了避免这些缺点，大多数敏捷软件开发流程采用两种设计方法。首先，它们将整体软件划分为各个部分并对其进行优先级排序，然后逐步开发，而不是一次性完成整个软件。其次，它们不建立严格的开发目标，而是设定一个粗略的目标，并在开发过程中通过反复与客户或其他利益相关者沟通来逐步完善。因此，敏捷软件开发可以被描述为一种*迭代*和*适应性*的软件开发方法。\n\
  \n从上述讨论中，我们可以得出以下教训。首先，敏捷软件开发背后的考虑可以适用于 HCAI 的治理模型，因为人工智能治理面临的问题，即技术的快速发展和商业环境的变化，与软件开发面临的问题相同。其次，传统治理模型与瀑布开发的相似性，即两者都是*预测性*和*顺序*的方法，意味着需要一种新的治理模型。第三，作为这两点的推论，一种新的治理模型更像是敏捷治理而不是瀑布开发。\n\
  \n### 什么是日本的敏捷治理？\n\n2019 年，经济产业省成立了社会 5.0 新治理模式研究组。该研究组在假设现有治理模式将在社会 5.0 中达到其极限的基础上，进行了多次讨论，旨在为新的治理模式创建一个框架。研究组成员包括经济和法律研究人员、公司法专业律师、会计师、从事人工智能开发和金融科技的公司人员等。\n\
  \n\n\n\n\n本研究小组迄今已产出三份报告，提出在 AI 治理中，敏捷治理模式应取代传统模式，因为后者在社会 5.0 中将功能不足。我们可以将报告的观点总结为两点：（1）AI\
  \ 治理的主要行为主体应是企业，而非政府，以及（2）所有行为主体都应参与对 AI 治理方案的持续且快速的维护，这被称为“敏捷循环”。\n\n#### 两个前提\n\
  \n首先将解释报告所采用的两个前提。第一，AI 治理中存在三个关键行为主体：政府、企业以及社区/个人。研究小组将敏捷治理描述为对这些行为主体角色的重新分配。第二，它似乎将\
  \ AI 治理理解为分为三个阶段的过程：规则制定、监测和执行。在规则制定阶段，为治理每个行为主体制定的机制将被制定并更新。在监测阶段，对人员、公司和机器的行为进行观察，以收集评估其是否遵守前一阶段制定的规则所需的信息。在执行阶段，行为主体采取行动解决监测阶段发现的问题。研究小组指出，传统治理在每个阶段都会面临许多障碍（METI\
  \ 2020：15–19）。\n\n#### 传统治理模式的局限\n\n传统治理模式描述如下。政府使用法律制定详细规则\n传统模式将在社会 5.0 中停止发挥作用。首先，基于规则的法律和法规将达到其极限。在该社会中，AI\
  \ 技术以如此快速和复杂的速度发展，以至于政府几乎不可能预先衡量 AI 产生的风险。没有关于风险的信息，政府就无法为决定 AI 使用中什么是好什么是坏制定具体规则。与此相关，适用于特定行业（例如制造业或银行业）的法规，其定义基于其商业模式，将难以适用。在商业模式动态变化且\
  \ AI 技术跨商业模式使用的社会中，由每个商业模式制定的 AI 法规会立即过时。它们无法规范社会中的实际 AI 实践。\n其次，关于 AI 的大量信息由公司拥有。对该信息的分析和解释对于缺乏专业技术知识的人来说是困难的。正因如此，当国家政府制定规则并执行监测时，监测数据的获取以及实际监测过程将是困难的。即使政府能够承担此项工作，也会效率低下。\n\
  第三，在执行阶段也会出现问题。当嵌入 AI 的复杂系统无论是自行还是与人类协作地作用于物理世界时，预测其决策的影响将是困难的。如果这些决策确实产生负面影响，就很难确定法律责任所在，也无法实施制裁或确定未来预防措施应强制要求的对象（以上基于\
  \ METI 2020：22–31）。\n\n#### 重新分配行为主体的角色\n\n敏捷治理模式以协同监管为标准，并重新设计政府、企业和社区/个人的角色（以下为\
  \ METI 2020：38–66 的概述）。\n\n##### 政府\n\n政府发挥更小的角色。其负责为企业中心治理系统有效运作准备环境。在规则制定阶段，法律的角色将从具体的基于规则的法规转变为抽象的基于目标的法规，展示应实现原则和目标。根据第二份报告，这些法律应实现的最终目标是幸福和自由。在这些目标之下，存在一些核心价值：人权、经济增长、审议民主等基本制度，以及可持续性（METI\
  \ 2021c：44–58）。在监测阶段，公司依法被要求披露其技术相关信息并保持透明和问责。基于规则的法规将在此阶段保留。在执行阶段，统一的处罚将无法有效发挥作用。鉴于此，处罚必须根据企业行为的社会影响灵活施加。如果公司的活动造成损害，公司应被要求进行调查，并应引入适当的激励措施（例如基于协议暂停起诉），以便公司进行技术改进。\n\
  \n##### 企业\n\n企业在新治理模式中发挥关键作用。在规则制定阶段，公司根据上述法律目标制定非约束性指南和标准。随后，单个公司据此开发和利用构成 AI\
  \ 的内部技术。指南和标准的制定并非由公司单独处理，而必须通过多利益相关方对话进行。在监测中，企业使用其自行制定的指南和标准确认合规性。它们也被要求公开披露并解释其如何遵守指南和标准。关于执行，如果风险成为现实并造成损害，企业应主动向监管机构报告，然后必须配合调查。\n\
  \n##### 社区/个人\n\n社区/个人被定位为积极向社会传达其价值观和评价的行为主体。在规则制定阶段，他们参与公司的多利益相关方对话。在监测和执行阶段，他们基于企业信息披露对企业进行评价。特别是，当对企业进行负面评价时，他们通过市场（例如通过抵制）和社会规范（例如通过负面声誉）促进健康的企业活动和技术开发/利用。\n\
  \n#### 敏捷循环\n\n敏捷治理也被提出为一套具体的治理流程。在社会 5.0 中，AI 技术发展如此迅速，以至于现有的规范 AI 的法律、指南和社会制度在更短的期限内就会过时。所有与\
  \ AI 相关的行为主体都必须重新考虑现有的 AI 监管机制在当时的技术和社会环境下是否仍然适当。我们需要快速流程来评估当前情况并据此改进 AI 监管。敏捷循环意味着连续且快速地运行循环，如\
  \ Figure 24.1 所示（METI 2021c：59–60）。在此，我们将外圈称为 Track 1，内圈称为 Track 2。我们将以一家提供包含 AI\
  \ 系统的安全摄像头的公司为例进行说明。政府和公司都必须在每个轨道中运行敏捷循环（*参见* METI 2021c：60–69，103–106）。\n\n![Figure\
  \ 24.1 The underlying idea of agile governance. (Source: (METI 2021c: 60).)](img/fig24_1_B.jpg)\n\
  \nFigure 24.1 The underlying idea of agile governance. **(Source: (METI 2021c: 60).)**\n\
  \n\n\n\n\n首先，政府制定基于法律目标的法律，这些法律将适用于所有人工智能和其他网络物理技术。法律基于当前情况以及对这些技术风险分析的结果（政府在轨道\
  \ 1）。例如，法律将包含保护隐私和平等的原则等原则。报告称此项活动为“治理的治理”，因为法律创建了一个广泛的（但抽象的）人工智能治理框架，涵盖每个领域。政府组织监控和执行方案以确保公司遵守基于目标的法律（政府在轨道\
  \ 2）。\n\n接下来，公司设定符合法律规定的基于目标的法规的自身具体目标。它必须考虑具体的指导方针，以保护隐私并在操作安全摄像头时解决种族主义问题。同样，在设定这些指导方针时，高度重视与多方利益相关者的对话。假设公司设定其安全摄像头必须原则上在一天内删除数据的具体指导方针，并且其人工智能必须以平等的方式识别所有种族。公司组织监控团队和系统以符合其自身的指导方针（企业在轨道\
  \ 1）。公司持续监控摄像头的状况并根据其指导方针改进它。如果必要，监控团队或系统将被重新组织（企业在轨道 2）。\n\n与轨道 2 平行，公司定期检查其指导方针是否在环境变化和风险发展方面仍然适当。如果必要，指导方针将被修改，系统将被重新设计以匹配新的指导方针。例如，公司认识到其人工智能不公平地将女性检测为比男性风险更大的存在。这是需要排除的错误。然后公司再次进行状况和风险分析，并在其指导方针中增加人工智能必须不论性别评估每个人的风险的要求。为了改进摄像头，公司根据新的指导方针重新设计其架构和人工智能系统。当然，多方利益相关者对话在此过程中也至关重要（再次，企业在轨道\
  \ 1）。\n\n政府定期审查基于目标的法律是否在社会整体环境和风险变化方面仍然适当。如果必要，它将重新考虑现有目标并重新组织监控和执行方案（再次，政府在轨道\
  \ 1）。\n\n双轨流程因此在每个部门中持续且快速地实施（在此示例中，政府和公司）。治理的治理通过这些流程进行，以维持整体控制\n\n### 深入了解敏捷治理\n\
  \n日本敏捷治理最近才被提出。它既不是整个日本政府的官方观点，也尚未实施\n\n#### 法律规定的基于目标的法规\n\n日本敏捷治理最具争议的方面是其建议将法律从基于规则转变为基于目标的法规。如果发生这种情况，法律的监管权力不可避免地会缩小。但根据报告，基于规则的法律和法规是传统治理的显著方面，在社会\
  \ 5.0 中将停止发挥作用。为了维持法治以约束权力的任意使用，将强调公司制定的指导方针和标准、高度的问责制以及关于所涉及技术的正当程序（METI 2021c：87–88）。\n\
  \n关于基于目标的法律的一个问题是如何审查公司为符合法律而创建的指导方针和标准。如果没有这一点，公司可能会创建只追求其利润而忽视消费者利益或与人权相关价值观的标准。报告并未回答这个问题。它们提到政府通过认证企业符合\
  \ `guidelines` 和 `standards` 来承担建立对企业信任的角色（METI 2020：43–44），但并未提出确认法律相关目标与指导方针和标准是否兼容的机制。最终，遵守法律相关目标由公司的自我监管或其社会声誉来保证。\n\
  \n这种观点似乎对公司愿意创建并遵守符合法律相关目标的指导方针和标准的意愿过于乐观。如果没有第三方监控和执行，公司可能会偏离法律。我们认为政府在监督公司以维持其遵守法律方面仍然发挥着重要作用。然而，报告真正关心的是政府凭借指定的法律阻碍人工智能技术的创新。它们建议除了法律之外，甚至公司的指导方针和标准也不应严格约束，以免阻碍创新（METI2020：44）。当然，我们应该避免压制创新。但报告的建议可能无法在创新与社会基本价值观的保障之间取得良好平衡，例如人权。\n\
  \n此外，当法律只能创建抽象目标时，对于一些公司来说，确定什么行为标准会产生是困难的。他们可能希望在人工智能开发和实施中拥有指定的法律，而不是抽象的法律相关目标。报告将多方利益相关者对话视为解决此问题的方案。它们设想符合法律规定的具体目标的具体指导方针和标准将通过这些对话制定。对话过程是敏捷治理的基本要素，但也许对于一些公司来说进行此过程是负担。\n\
  \n#### 多方利益相关者对话\n\n将受人工智能影响的个人，例如消费者和少数群体，定位为利益相关者很重要。在开发和运营人工智能时，对话还必须包括代表可能例如遭受统计歧视或在人工智能手中遭受不利判断的群体的代表。对于这种在法律下相对化法规的治理模式，多方利益相关者对话可以被描述为补充原则或民主化的替代渠道。此类对话的组织者可能需要公开披露其选择对话参与者的理由。需要创建规则和标准来规范对话的构成，以便具有各种社会背景的人可以参与对话过程。\n\
  \n然而，报告的建议需要更精细。主要问题是它们没有显示识别利益相关者的具体标准。多方利益相关者对话的成员资格必须在对话 `before` 确定。由负责对话的公司创建成员资格规则是不合适的，因为如果他们这样做，规则很可能为公司利益而制定，这是不公平的。在此，法律仍然在指示应包含在对话过程中的何种类型的人以及多少人方面发挥着重要作用。此外，与民主进程不同，这种共识形成目前缺乏明确的规则、习俗和实践。如果达成共识需要时间，就会削弱这种方法的敏捷性。需要建立规则和实践，以便对话过程能够以敏捷的方式进行。\n\
  \n#### 实现与人权相关的值\n\n\n\n\nAgile governance also has the potential to effectively\
  \ provide society with constitutional value. In the legal world, constitutions constrain\
  \ the authority of national governments at a primary level, and they are seldom\
  \ directly applied to the legal relationships between private actors. However, when\
  \ companies define concrete guidelines and standards, including constitutional values\
  \ such as human rights, they can avoid this theoretical opposition, and directly\
  \ reflect this constitutional value in their activities. For example, legal scholars\
  \ and people whose human rights might be limited can take part in multistakeholder\
  \ dialogues, which can produce concrete rules, thereby embedding constitutional\
  \ value in AI development guidelines.\n\nOn the other hand, as the role of the law\
  \ becomes more relative, the role of the courts as bastions of the protection of\
  \ constitutions will be less significant. The reports make little mention of control\
  \ through public law that is implemented by the judiciary. Only in exceptional cases\
  \ would courts declare corporate activities to be illegal, such as when companies\
  \ set standards that clearly disregard the abstract goals defined by law. We still\
  \ have enough reason to doubt that agile governance serves the protection of human\
  \ rights even in Society 5.0.\n\n### Conclusion\n\nThis chapter has presented an\
  \ overview of the Japanese version of agile governance and examined its implications\
  \ for the global debate on AI. There are at least three approaches to making a legal\
  \ regime to fit the AI era: (i) strictly and completely defining human centrality\
  \ and teaching it to AI; (ii) scientifically denying human centrality and leaving\
  \ political and legal decision-making to the autonomous judgment of AI; and (iii)\
  \ not defining human centrality in advance and realizing it progressively. Both\
  \ (i), which adheres strongly to the modern legal regime, and (ii), which seeks\
  \ to move radically to algorithmic centrism, may lead to an ideological divide between\
  \ humanism and naturalism, and even a real conflict between the two. One option\
  \ is to take the pragmatic approach of (iii). If it is found to be useful, the Japanese\
  \ version of agile governance may be worth listening to from a global perspective\
  \ although it is just a phase of suggestion.\n\nHowever, we have to confront several\
  \ problems in this model. Can companies create specific rules for AI that conform\
  \ with law-related goals? Are multistakeholder dialogues really functionable? Who\
  \ are the stakeholders? Are human rights sufficiently protected? These questions\
  \ should be answered if agile governance regards itself as the best way to actualize\
  \ HCAI principles.\n\n### Notes\n\n1. The report defines the governance as\n> design\
  \ and implementation of technical, organizational, and social systems by stakeholders,\
  \ with an aim to manage risks in a society based on systems which integrates cyberspace\
  \ and physical space […] at an acceptable level, while maximizing the positive impact\
  \ arising from the system.\n> (METI 2021c: 14)\n\n2. In this chapter, “rules” means\
  \ codes which specifically indicate which actions are to be taken, while “goals”\
  \ do not express those actions directly but lead our evaluation in certain direction.\n\
  \n3. The third report explains this process more specifically ( METI 2022: 22–37).\n\
  \n4. Yet, we can find some examples of agile governance within society. For instance,\
  \ NEC Corporation, which is a comprehensive electronics manufacturer in Japan, established\
  \ its “NEC Group AI and Human Rights Principles,” and has been conducting AI-related\
  \ business based on these principles. These principles were formed in reference\
  \ to those of the Japanese government (CAO 2019). NEC has also begun coordinating\
  \ with university researchers to specify or reconsider the principles. These are\
  \ practices involving the creation of specific rules regarding product development\
  \ and utilization under multistakeholder dialogue, which the agile governance suggests.\
