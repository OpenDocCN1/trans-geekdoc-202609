  \n## 21 Operationalizing AI Regulatory Sandboxes for Children’s Rights and Well-Being\n\
  \nVicky Charisi³\n\nEuropean Commission, Joint Research Centre, Seville, Spain\n\
  \nVirginia Dignum\n\nUmeå University, Umeå, Sweden\n\nDOI: [10.1201/9781003320791-25](https://dx.doi.org/10.1201/9781003320791-25)\n\
  \n### Introduction\n\n#### Motivation and General Scope of the Chapter\n\n儿童和青少年在日常生活中使用的许多产品中都围绕着\
  \ AI，从社交媒体到教育技术、电子游戏、智能玩具和语音助手。AI 可以影响儿童在线观看的视频、他们学习时的课程，以及他们玩耍和与他人互动的方式。为本章目的，我们采用\
  \ UNICEF 对 AI 的定义。AI 可用于促进儿童的发展并在活动中赋能他们，但儿童也容易受到 AI 带来的潜在风险的影响，包括偏见、网络安全、数据保护和隐私以及缺乏可及性。AI\
  \ 必须设计为尊重儿童用户的权利并为所有儿童提供平等机会。包括 UNICEF 和世界经济论坛 (WEF) 在内的多个组织已制定了以儿童为中心的 AI 指南，但设计和实施负责任且值得信赖的以儿童为中心的\
  \ AI 的挑战仍然复杂难以应对。在本章中，我们描述了挑战并提出监管沙盒环境作为一种手段来应对儿童、企业、法规和整个社会。 在本章的其余部分，每当我们使用“沙盒”一词时，我们指的是“监管沙盒”。\n\
  \n将沙盒用于适龄 AI 系统的操作化所提出的方法旨在使主管当局更接近开发 AI 的公司，并为实施以儿童为中心的 AI 系统制定最佳实践。 这种沙盒提供了一个受控环境，以连接创新者、监管者、儿童专家和用户进行合作，以便促进创新\
  \ AI 系统的开发、测试和验证，以确保与现有关于儿童 AI 的指南保持一致。\n\n#### Review of Relevant Work on Sandboxes\
  \ in General and in AI Systems\n\n监管沙盒在过去十年中在 FinTech 领域出现 (Allen 2019)，旨在收集有关新技术的數據并促进基于证据的监管改革。利用沙盒，监管机构可以评估法律法规的有效性，特别是这些法规如何影响特定群体，例如儿童。\
  \ 与此同时，监管沙盒也允许监管机构断言新的 AI 应用在现有法律框架内的契合程度如何 (Ranchordas, 2021)。\n\n欧洲委员会关于 AI 的法规提案，\n\
  \n监管沙盒的基本思想是为选定的项目提供探索性、基于对话的指导，以换取对所进行的评估的完全开放。它为在市场条件下测试创新和法规提供了一个安全环境，以提高法律确定性\
  \ (Kert et al. 2022)。 这样，沙盒就在一个技术和法律都复杂且相对较新的领域建立了一个实践案例的基础。\n\n\n\n\n\n沙盒具有推动产品和服务改进的潜力。例如，在医疗保健的背景下，监管沙盒旨在改善医疗保健体验和结果，同时也改善医疗保健提供者、委托方和监管者的体验，支持利益相关方在确定“什么是好的”方面进行协作，并设计和推动创新，而无需承担其中一些相关风险（Leckenby\
  \ et al. 2021）。沙盒中常用的方法包括评估清单和存储库。存储库支持知识管理（例如，Gutierrez 的软法数据库\n\n目前有几个国家正在人工智能的背景下使用沙盒方法。例如，2018\
  \ 年，日本引入了一个沙盒制度，对在日本内外愿意尝试新技术（包括区块链、人工智能和物联网（IoT））的组织和公司开放，领域包括金融服务、医疗保健和交通运输（IFLR,\
  \ 2019）。在欧洲，挪威和英国（UK）都开发了人工智能沙盒。挪威在其国家人工智能战略的一部分中建立了监管沙盒，为私营公司和公共部门提供个人数据保护指导（Datatilsynet,\
  \ 2022）。在英国，已设立沙盒来探索新技术，例如语音生物识别和面部识别技术，以及相关的数据保护问题。\n\n然而，监管沙盒也存在被滥用或误用的风险，需要适当的框架才能成功。例如，沙盒可能会为监管过程中的偏袒打开大门，可能在公司和监管机构之间创造一种互惠关系（Knight\
  \ & Mitchell, 2020），或导致监管俘获。当试验的服务和产品针对儿童等脆弱人群时，这一点尤为重要。在下面的段落中，我们总结了儿童特有的特征，在为儿童设计人工智能产品和服务的沙盒或可能被儿童使用的产品和服务的沙盒时需要特别注意。\n\
  \n#### 儿童的特殊之处是什么？\n\n虽然在其他领域使用沙盒来试验针对成年人的政策和技术应用是一种已被使用的方法，但我们提出，在用户年龄在 18 岁以下的情况下，有一些特殊特征需要考虑。\n\
  \n每个孩子生命的最初几年都是一个充满机遇的时期。孩子的脑中充满了好奇心、想象力、惊奇和决心，这些都是通过与物理和社会环境的互动而发展的。好奇心驱动的学习以及内在动机被认为是在促进主动学习和自发探索的关键认知过程中高效教育的基本要素（Oudeyer\
  \ & Smith, 2016）。众所周知，童年时期的环境因素会影响大脑发育的节奏以及认知和社会情感技能的发展，这对儿童当前和未来的福祉以及在整个学校教育和成年后的结果产生长期影响（Tooley\
  \ et al., 2021；Bolton et al. 2022）。但我们如何支持这些能力的发育，并在儿童在数字世界中行动并与干预其决策过程和发展的系统互动时减轻新兴风险？\n\
  \n随着机器学习以及最近基础模型的最新技术进步，影响儿童日常生活环境的因素的格局发生了巨大变化。我们观察到，我们所认为的“儿童环境”包括虚拟或物理的基于人工智能的系统（Hupont\
  \ et al., 2023），这些系统并非专门为他们设计。在这种情况下，我们确定了在为儿童保护设计政策方法、可能被儿童访问的基于人工智能的产品和服务，以及评估基于人工智能的系统与当前监管框架的一致性的技术时需要特别注意的特定要素，例如在沙盒的情况下。\n\
  \n##### 对发育中大脑的情境可变性的重要性\n\n脑科学和发育心理学中的计算方法为我们对儿童认知及其快速发展过程中个体差异至关重要的理解带来了新的启示。儿童行为的动态性在很大程度上受到促进好奇心和批判性及创造性思维的探索活动机会的影响。Pelz\
  \ and Kidd (2020)，例如，强调自由游戏的重要性，并指出儿童探索行为的发育方面，这些行为在人类童年时期显得更加复杂。多样化的环境促进儿童的问题解决、语言学习、归纳推理、视觉感知等（Raviv\
  \ et al. 2022；Charisi et al., 2020）。个体差异，尤其是神经多样性儿童，例如自闭症儿童，尤为重要。各种情境因素在为适龄人工智能和儿童设计实验和评估时起催化作用，例如情境情境、个体、空间和社会情境。例如，一个孩子可以在自由或结构化游戏中（情境情境）使用人工智能系统，同时在家或学校（空间情境），独自或在父母监督下（社会情境）。情境的可变性在儿童发展中起着重要作用，应在为适龄人工智能设计沙盒时予以考虑，以提高政策或创新解决方案的有效性。这些信息可用于以有效的方式在不同情境下开发系统评估的指标和指标（另见\
  \ Figure 21.3）。\n\n![Figure 21.1 Proposed framework for the development of sandboxes\
  \ for age-appropriate AI and children and the required actions as discussed in Section\
  \ “Sandboxes for Age-Appropriate AI and Children.”](img/fig21_1_B.jpg)\n\nFigure\
  \ 21.1 Proposed framework for the development of sandboxes for age-appropriate AI\
  \ and children and the required actions as discussed in Section “Sandboxes for Age-Appropriate\
  \ AI and Children.”\n\n![Figure 21.2 The four stages of development according to\
  \ the proposed framework for sandboxes. They should not be considered linear but\
  \ as modules that appear in different phases as shown in Figure 21.3.](img/fig21_2_B.jpg)\n\
  \nFigure 21.2 The four stages of development according to the proposed framework\
  \ for sandboxes. They should not be considered linear but as modules that appear\
