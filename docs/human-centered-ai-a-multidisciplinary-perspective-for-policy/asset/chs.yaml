  \n## 15 基于 HCAI 的服务供给与参与式大学\n\nCristina Mele, Tiziana Russo Spena, Irene Di Bernardo,\
  \ Angelo Ranieri, and Marialuisa Marzullo\n\nDepartment of Economics, Management,\
  \ Institutions, University of Naples Federico II, Naples, Italy\n\nDOI: [10.1201/9781003320791-18](https://dx.doi.org/10.1201/9781003320791-18)\n\
  \n### 引言\n\n近年来，基于人工智能的技术彻底改变了我们日常生活中的多个方面。人工智能正被用于自动化和简化流程，这可以帮助组织节省时间和金钱，同时提供更好的用户体验（Huang\
  \ & Rust, 2018）。许多组织通常使用由人工智能驱动的聊天机器人为用户提供实时响应。此外，人工智能驱动的算法被用于预测分析，以提供个性化或提前的服务（Huang\
  \ et al., 2019）。世界各地的大学和高等教育机构也拥抱这一趋势，开始将人工智能融入其流程和服务供给中（McKinsey, 2022）。\n\n这一趋势与大学环境中的另一项关键变化相平行。多年来，大学的主要职能是教育和研究。它们长期以来作为独立机构运作，对地域的牵绊较少（Karlsen,\
  \ 2005）。大学的新角色正在出现，由新近的参与式大学模式所界定（Davies & Nyland, 2022）。它强调大学对社会可能产生的影响，以及通过研究和创新与社区互动以应对社会挑战的重要性。\n\
  \n这种变革性影响推动大学努力将新的智能和数字技术整合到日常运营中，以更好地与学生、教育者、研究人员以及更广泛的社区建立联系。聊天机器人、虚拟助手和社交媒体平台被用来根据学生的具体和情境需求与之互动，支持学者和研究人员开展日常活动，并总体上促进公众参与（Rodríguez-Abitia\
  \ & Bribiesca-Correa, 2021）。同样，人工智能技术通过分析数据来识别模式和洞察，从而加快研究并促进协作、知识共享和转移，从而辅助研究（Nyland\
  \ & Davies, 2022）。预计基于人工智能的技术将创造许多创新大学服务供给以影响社会的机会。\n\n在本章中，我们旨在分析以人为中心的人工智能如何支持大学在转变社会的新的角色下推进服务供给。我们对以\
  \ HCAI 为基础的参与式大学提供全面理解，聚焦于三个主要活动：（1）参与式教育，与大学促进教学和学习活动相关（例如信息支持、互动课程、个性化体验和包容性教育）；（2）参与式研究，与大学为检测理解做出贡献的活动相关（例如分析支持、协作网络、扩展知识、增强研究）；以及（3）与社会参与，与大学以更新的关系拥抱社会的活动相关（例如信任增强、联合倡议、先进沟通、创新能力）。\n\
  \n这些活动展示了技术如何支持大学应对其参与式使命的更广泛效益。\n\n### 服务供给与教育\n\n服务供给概念意味着应用知识和技能以提供益处（Vargo &\
  \ Lusch, 2008）。服务导向的愿景是关系性的，因为价值是通过在特定情境中使用所提供的资源以及从其他服务提供者获得的资源而产生的（Mele et al.,\
  \ 2022）。提供者需要积极寻求并理解行为者的需求和期望，从而协作共创价值并改善整体服务体验。\n\n大学从根本上被认定为高等教育、学术研究和知识传播的中心（Tuunainen,\
  \ 2005）。从服务导向的角度来看，传统大学的根本目标一直是为学生提供整体的教育体验，促进参与并为他们配备应对其所选领域挑战所需的技能（Conduit et\
  \ al., 2016; Sim et al., 2018）。因此，“作为服务提供者的大学” (Kamvounias, 1999, p. 30) 将学生视为服务的受益者，为他们提供各种资源，符合\
  \ Vargo and Lusch (2008)。然而，大学在通过研究和其他学术活动推进知识方面也发挥着关键作用（Wyner, 2019），涉及学生、研究人员以及企业家等其他利益相关者。因此，他们可以承担的多重面貌得以揭示，以及需要执行不同活动的必要性（Thatcher\
  \ et al., 2016）。尽管如此，这些活动并非相互排斥。例如，研究服务是为对所分析主题感兴趣的其他学者提供的，也是为参与研究活动的其他行为者，如学生和企业家提供支持。\n\
  \n遵循这一视角，Calma and Dickson-Deane (2020) 指出，大学曾经被视为产生知识的机构，现在被认可为关心知识的服务提供者，并整合技术以改善、强化并建立学习成果之间的直接联系。通过采用这一更广泛的角色，大学提供资源并提供获取教育机会的途径，促进知识共享，并通过创新工具提高参与度（Keenan\
  \ et al., 2020）。更近来，学术机构已拥抱更广泛的使命，即通过为当地社区服务并促进社会和经济发展来为公民和公共福利参与做出贡献（Chankselian\
  \ & McCowan, 2021）。\n\n\n\n\n\n在这种情况下，有必要考虑塑造大学作为服务生态系统中的行动者的多重组成部分，而该生态系统正随着新兴的社会挑战而演变。需要从单纯提供教育服务转变为大学在服务提供中发挥更主动、更具参与性的角色。\n\
  \n### 参与式大学\n\n参与式大学的概念在高等教育文献中变得至关重要（Kliewe & Baaken, 2019）。它源于 19 世纪中期美国赠地运动，该运动旨在提供实用教育和外展服务，以支持农村社区的经济和社会发展（Breznitz\
  \ & Feldman, 2012）。此后，这一概念已发展到涵盖更广泛的活动，包括基于社区的研究、服务学习、公民参与，以及与非营利组织和产业的合作。\n\n据一些学者称，大学涉及越来越多的超越传统教育和研究目标的模式（Perkmann\
  \ et al., 2021）。然而，参与式大学与创业型大学模式不同。后一种模式涉及创建新的大学结构（衍生企业），通过商业方法将学术科学家与潜在研究用户连接起来（使用专利和许可），促进知识向市场转移（Wang\
  \ et al., 2016）。不同的是，参与式大学越来越多地负责解决社会问题。Goddard’s (2009)参与式大学模式主张将这一第三使命贯穿于大学的所有组织、活动和实践中。\n\
  \nWatson et al. (2011, p. 281)将参与式大学定义为*“高等教育全球公民参与运动的全面实证描述。”*参与式大学积极吸引其社区，无论是本地还是全球，以应对社会挑战并为公共利益做出贡献。因此，人们对它们对周边地区发展和经济增长的承诺也越来越感兴趣（Benneworth,\
  \ 2012）。大学的主要作用是促进改善知识交流环境、组织、治理和政策框架。\n\n这种新的参与式视角强调需要从更广泛、更统一的视角来看待参与大学活动的不同行动者（即学生、研究人员和社会）。大学帮助学生在未来职业中培养技能和知识（Breznitz\
  \ & Feldman, 2012），支持研究人员产生新的知识和创新，从而对社会产生重大影响（Perkmann et al., 2021），并通过应对社会挑战和促进学习环境的提升为当地社区的福祉做出贡献（Fischer\
  \ et al., 2021）。从这个意义上说，大学服务提供的复杂性达到了更高水平。例如，社区和当地产业也可能具有特定的利益和需要被解决的能动性，而学生的受益者需求也会随着他们所生活的环境而演变。人工智能技术可以在支持大学这种新的参与式角色方面发挥关键作用。\n\
  \n### 基于人工智能的技术与教育科技\n\n基于人工智能的技术正在提高先进学习系统的能力，该系统基于不断增长的数据分析流程，自动化、支持和增强人类决策（Huang\
  \ et al., 2019）。它们还通过识别、模拟和适当回应人类情感来支持基于情感的互动。基于这些能力，服务文献已广泛证明人工智能如何用于简化服务流程、提供有效的个性化互动并提供引人注目的客户体验（Wedel\
  \ & Kannan, 2016）。连接人类、数据和数字技术（即以人为中心的<|message|>人工智能——HCAI）的机会实现了智能服务提供并影响价值共创（Mele\
  \ & Russo-Spena, 2023）。\n\n关于人工智能技术与大学的研究仍处于萌芽阶段。其中许多研究分析了人工智能技术如何促进服务体验中与各种受益者（学生、教授和研究人员）的互动。信息支持和协作活动是重点。\n\
  \n人工智能技术为学生提供访问在线资源的机会，例如数字图书馆、电子学习平台、协作和通信工具以及在线辅导服务（Selwyn, 2019）。一个典型例子是教育科技或\
  \ Edutech 现象，简称为“教育技术”，是指使用技术工具和资源来支持教学、学习和教育管理（Granic, 2022）。从这个意义上说，基于人工智能的教育科技工具和资源可以通过分析学生的学习模式并根据他们的需求调整教学材料和评估来创建个性化的学习体验。基于人工智能的教育科技还通过提供知识共享、技能发展和人才获取的平台来支持产业合作。聊天机器人为学生、教职员工提供快速便捷的信息和服务访问（Chen\
  \ et al., 2023）。在研究实验室中，基于人工智能的机器人可有效准备样品、收集数据并进行分析（Selwyn, 2019）。相反，研究人员受益于用于数据研究和分析的先进技术工具和资源。\n\
  \n一些学者还指出了 HCAI 在解决差异以推进教育社会层面方面的作用。一些学者还指出了 HCAI 在解决差异方面的作用。增强现实技术帮助有视觉障碍的学生或研究人员访问额外信息并以更易访问的方式与教育内容互动（Garzón,\
  \ 2021）。虚拟现实促进了来自不同地区或地理区域的行动者之间的协作学习、教学和研究体验（Radianti et al., 2020），机器人可作为残疾学生的教学辅助工具（Syriopoulou-Delli\
  \ & Gkiolnta, 2021）。\n\n对于社会而言，基于人工智能的技术为社会和经济问题提供了广泛的创新解决方案，并实现了知识共享和传播（Mariani\
  \ et al., 2023）。总体而言，基于人工智能的技术促进了行动者之间更便捷的连接，使能新能力并创造新机会。\n\n此外，区块链技术为管理学生数据创建了更高效、更透明的服务系统（Cheng\
  \ et al., 2018），或为成绩单和证书等学术记录提供安全、防篡改的存储（Bhaskar et al., 2021）。\n\n所有这些研究在其分析中都采用了特定的大学服务范围，并未更深入地分析\
  \ HCAI 如何有效影响整个社会。大学的变革性角色需要对 HCAI 如何影响参与式服务提供进行更整合、更深刻的愿景。\n\n### 利用人工智能实现参与式大学\n\
  \n\n\n\n\nAI 技术的应用使得改善或实现新的大学服务供给成为可能。大学在日常活动中越来越多地采用新技术，以更好地与教师、研究人员、学生以及更广泛的社会进行互动。\
  \ Figure 15.1 所呈现的框架。 展示了大学如何与对“积极参与型大学”这一新概念化的理解同步，提供更新的服务。该框架是通过对文献和真实案例研究的综合理解而确定的（另见\
  \ Appendix 1）。它由三大主要活动构成——参与式教育、参与式研究和与社会的参与——并由基于 AI 的基础设施提供支持。以下将对每项活动进行更详细的解释。\n\
  \n![Figure 15.1 The exploitation of AI-based technologies for an engaged university.](img/fig15_1_B.jpg)\n\
  \nFigure 15.1 The exploitation of AI-based technologies for an engaged university.\n\
  \n### Engaged Education\n\n基于 AI 的技术有潜力彻底改变大学和高等教育机构的教学，从而促进参与式教育（Kuleto et al.,\
  \ 2021）。在此背景下可识别出四个主要活动：信息支持、主动互动、个性化体验和包容性教育。\n\n首先，基于 AI 的技术通过提供实时信息访问来帮助教师和学生，增强学生的学习活动（Al-Shoqran\
  \ & Shorman, 2021）。虚拟助手或聊天机器人可以回答问题、提供作业反馈并协助完成家庭作业。一个典型案例是 *Jill*，这是一款在佐治亚理工学院课堂中使用的\
  \ AI 驱动教学助手，可以回答学生的问题。Jill 使用自然语言处理和机器学习算法来理解并回应学生的问题。学生可以快速准确地获得问题的答案。Jill 会根据学生的具体需求提供反馈并提出解决方案。\n\
  \n此外，基于 AI 的技术能够实现与学生的沉浸式和主动互动，促进参与度和动机（Kuleto et al., 2021）。一个代表性案例是堪萨斯大学护理学院的\
  \ *Metaversity* 项目。Metaversity 利用虚拟现实的力量创造沉浸式学习环境，克服了实体教室的限制，拓展了想象力和情感学习的可能性。\n\n\
  此外，基于 AI 的技术支持教师更好地识别每位学生的需求和学习风格，以适应其特定的情境需求并个性化其学习体验（Ravshanbek, 2022）。学生可根据不同的学习能力获得支持，并能轻松、恰当地获取成功所需的资源。一个典型案例是马尔堡的菲利普斯大学的\
  \ Yuki。它是首个机器人讲师，可协助教师分析大量数据，例如学生作业和考试成绩，以提供更准确、及时的个性化学生反馈，并在课程教学和支持中协助教师\n\n最后，基于\
  \ AI 的技术可以通过支持受损用户参与来促进更具包容性的教育环境的开发（Ali & Abdel-Haq, 2021）。语音识别和翻译技术使听力障碍或重听的学生能够参与课堂讨论。一个说明性例子是\
  \ *Abii*，这是一款在那不勒斯第二大学 Federico II 大学作为学生导师使用的智能机器人。该机器人可以在课堂上追踪学生的注意力，支持教师起草和传授课程，并帮助学生在学习评估中。它可用于患有某些障碍或学习障碍的学生，使其转变为主动参与者，更好地掌控自己的学习过程。\n\
  \n### Engaged Research\n\n基于 AI 的技术有潜力通过提供有效的分析支持、促进协作研究活动、拓展知识并支持广泛研究，从而彻底改变大学和高等教育机构的研究活动。通过利用这些技术，学者们加速了科学发现并促进了参与式研究（Chatterjee\
  \ & Bhattacharjee, 2020）。可识别出四个主要活动：分析支持、可激活网络、被利用的知识数据集和增强研究。\n\nAI 驱动的虚拟助手支持研究人员，帮助他们完成文献检索、数据分析和引用管理等任务（Fidan\
  \ & Gencel, 2022）。通过自动化研究数据分析，研究人员可以节省时间并提高生产力，从而专注于研究中更具创造性和创新性的方面（Chen et al.,\
  \ 2020）。一个案例是 Ithaca AI 驱动的虚拟助手。它重建古代文本的缺失部分，如果人工进行，这一活动对学者来说需要耗费大量时间和挑战性。使用自然语言处理和机器学习技术，Ithaca\
  \ 能够快速分析大量人类难以识别的数据。这有助于研究人员识别模式、获得洞察并最终加速研究。\n\n除了分析支持之外，基于 AI 的技术还通过协作平台和在线社区促进可激活的研究网络。这些基于\
  \ AI 的平台使学者能够轻松搜索并联系其他研究合作伙伴，更有效地分享研究成果，并在实时协作项目上进行合作（Ouyang et al., 2022）。一个代表性案例是\
  \ PaperHive，这是一个利用 AI 改善研究协作的协同工作中心平台。它允许用户协作评论和讨论科学出版物，并使用机器学习算法建议评论与相关出版物之间的链接。\n\
  \n基于 AI 的技术还有助于利用知识，通过提供大量信息访问并识别不同研究领域之间的新联系，利用大型数据集、发现隐藏模式并生成新见解（Zhang & Aslan,\
  \ 2021）。这导致了医学、工程和社会科学等领域的新见解、知识转移和知识组合。一个说明性案例是 ChatGPT，被哥德堡大学的研究人员用于自动概述研究论文的主要观点并获得对其观察的反馈。它使用机器学习算法识别多项数据中的模式和联系，使研究人员能够对复杂概念和理论获得新的见解和视角。\n\
  \n\n\n\n\n最后，人工智能支持研究人员通过提供实时反馈并允许他们探索跨不同研究领域的在内容研究，从而专注于更复杂的任务（Chen et al., 2020）。随着数据的处理，研究反馈几乎立即提供。关于尝试不同的搜索选项以及系统性地开发新的、不确定的研究路径，新知识可能会出现。一个例子是\
  \ IBM Summit，这是一台功能强大的超级计算机，具有处理海量数据和执行复杂计算以解决具有挑战性的计算问题的能力。有了 IBM Summit，研究人员可以模拟和建模新药物化合物的行为。这些模拟使他们能够预测化合物将如何与身体相互作用并识别任何潜在的副作用，帮助他们做出更明智的信息和决策，关于在药物开发中进一步推进哪些化合物。研究人员还可以快速分析模拟产生的大量数据并将其与不同来源关联起来。因此，他们识别现有医学文献中的差距并获得见解，这些见解可以帮助指导他们研究和决策过程。\n\
  \n#### 与社会互动\n\n基于人工智能的技术有可能通过解决社会问题并增加创造共同价值的机会，更新大学或其他高等教育机构与周边社会之间的关系。可以观察到四项主要活动：信任建设支持、社区参与、先进沟通和创新能力。这些活动重新定义了大学本身的角色。\n\
  \n首先，由于数字化转型，待管理数据的透明度和安全性已成为关键问题（Attaran et al., 2018），并且与大学行为者的互动和行为方式相关的需求不断变化（Rodríguez\
  \ & Bribiesca-Correa, 2021）。HCAI 使大学能够自动适当管理 and 组织数据，深入了解社会问题，并制定有针对性的干预措施来解决这些问题（Kuleto\
  \ et al., 2021）。开放透明的互动允许建立信任的环境以及区块链技术的整合。数据可靠性通过自动化、安全和认证数据交换得到保证（Kamišalić et\
  \ al., 2019）。这就是 Maryville University 引入的 `Blockcerts Wallet` 作为一种工具的情况，该工具可提供可由学生轻松共享并可由雇主或其他感兴趣的行为者安全验证的文凭。\n\
  \n此外，随着大学需要更多地参与社区的需求出现（Karlsen, 2005），组织联合倡议是大学与其他行为者合作和交换资源的一种方式（Singh & Kaundal,\
  \ 2022）。因此，HCAI 有效地帮助他们促进参与并促进社区之间的协作和沟通。`Citizens, Society, and Artificial Intelligence\
  \ platform` 将研究人员聚集在同一地点，并允许他们分享对社会动态和个人公民生活的分析。\n\n此外，大学需要与社会进行适当沟通的需求一直是满足社区诉求的基本目标（Compagnucci\
  \ & Spigarelli, 2020）。HCAI 允许大学促进对话和对社区利益和准备度的理解，并通过在社会问题中发挥积极作用来推进其参与实践（Berente\
  \ et al., 2021）。秉持这一理念，卡内基梅隆大学语言技术研究所创建了一个人工智能驱动的 `Claire` 聊天机器人，以促进执法人员与社区之间的对话和理解。Claire\
  \ 使用自然语言处理来模拟警官与社区成员之间的对话，以改善沟通并建立信任。\n\n最后，在其完整表达中，基于人工智能的技术通过支持人们开发解决复杂挑战的新解决方案，例如环境问题，帮助大学创造一个更具创新性和创造力的社会（Chatterjee\
  \ & Bhattacharjee, 2020）。从这个意义上说，都灵大学成立了一个关于高性能计算（HPC）、人工智能和大数据分析（BDA）的 `federated\
  \ competence centre`，能够与企业家创造合作。一个人工智能提升他们日常活动创新能力的地方。\n\n### 结论\n\n使用基于人工智能的技术以多种形式支持参与式教育、参与式研究和与社会的互动，从而导致参与式大学的发展（Kliewe\
  \ & Baaken, 2019）。参与涵盖了大学与其受益者之间在扩展的行动者生态系统中的积极关系（Benneworth, 2012）。在不同人工智能技术的支持下，参与式大学扩展了不同行动者（学生、研究人员和社区）的能力，并促使他们参与主动的价值共创过程，提供相互和社会的价值。\n\
  \n通过基于人工智能的技术解决参与式教育，通过提供即时获取信息、增加课程提供的互动、个性化学习体验自动适应个人需求以及纳入行动者来提高教育质量。通过基于人工智能的技术解决参与式研究，加速研究人员的活动并提高绩效（Davies\
  \ & Nyland, 2022）。通过识别模式和趋势或做出预测对大量数据进行快速准确的分析、协作的增量发展、扩展知识的共享以及广泛研究的解决，既严谨又相关，有助于解决更高水平的贡献。最后，通过基于人工智能的技术与社会互动，帮助机构更好地理解和回应社区需求和关切。通过增加对数据存储、安全和共享的支持、组织联合倡议、解决先进沟通以及参与创造创新社会，大学能够解决实际问题。\n\
  \n这三个参与活动相互交织。HCAI 允许在同一活动中链接不同的行动者，例如使学生之间共享成为可能，甚至在研究人员和不同行动者之间创造协作。大学和高等教育机构成为变革的积极推动者，与行业和社区合作应对前所未有的社会和经济挑战，最大化其学生和员工的学习路径和成长，并释放其创新潜力（Fischer\
  \ et al., 2021）。\n\n通过服务学生和研究人员，大学也作为共同创造者来促进解决复杂问题的新解决方案，并与合作伙伴协作应对紧迫的社会挑战。此外，HCAI\
  \ 参与式大学认识到参与不是“附加”活动，而是其核心使命的重要组成部分。因此，它将参与纳入其教学、研究和知识交流活动，利用人工智能工具和技术创造新的协作和创新机会。通过拥抱\
  \ HCAI 并将参与纳入其核心使命，HCAI 参与式大学可以有效地为其各自的社区做出贡献，培养促进社会和经济发展、创造新的学习、发现和创新机会的伙伴关系（Figure\
  \ 15.2）。\n\n\n\n\n\n![Figure 15.2 The HCAI-engaged university.](img/fig15_2_B.jpg)\n\
  \nFigure 15.2 The HCAI-engaged university.\n\n然而，虽然基于人工智能的技术可以成为大学的强大工具，但如果它们不是以人为中心，就需要解决一些潜在的风险和挑战。例如，过度依赖人工智能会减少人际互动，可能限制重要社会和情感技能的发展。大学和高等教育机构必须确保人工智能的使用是合乎道德的。在这方面，一项批评涉及获取的不平等（Attaran\
  \ et al., 2018）；事实上，人工智能的使用会加剧教育和研究中已有的不平等。至少，应该记住，使用人工智能需要专业技能，这可能是一个关键问题。因此，大学可能需要在培训和聘用具备必要技能和知识的员工方面进行投资（技能需求）。\n\
  \n此外，仅仅提高参与度并不能完全消除过度依赖人工智能相关的风险。虽然它确实可以增强整体学习体验并减轻一些负面影响，但它可能无法完全弥补人工智能互动的潜在弊端。为了解决这些问题，大学和高等教育机构需要采取主动措施，确保人工智能的使用是公平有效的，即人工智能是\
  \ HCAI。这涉及实施促进负责任人工智能使用的政策和指南，并确保所有人无论其背景或情况如何都能公平获得人工智能技术、资源和机会。\n\n### Appendix\
