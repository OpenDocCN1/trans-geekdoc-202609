  \ AI-Based Public Policies\n\nJakob Kappenberger and Heiner Stuckenschmidt\n\nUniversity\
  \ of Mannheim, Mannheim, Germany\n\nDOI: [10.1201/9781003320791-29](https://dx.doi.org/10.1201/9781003320791-29)\n\
  \n### Introduction\n\n\n\n\n\n随着人工智能（AI）的使用渗透到社会的几乎每个方面，公众机构面临着日益增长的压力，要求采用这种技术，而该技术常被框定为实现“响应迅速、高效和公平”政府的途径（Margetts\
  \ & Dorobantu, 2019）。然而，与此同时，AI 已被认为会助长现有的不平等和有偏见的决策，从而使特定的社会群体处于不利地位（Saxena et\
  \ al., 2021）。这些潜在的挑战在公共部门尤其相关，因为 AI 的应用经常发生在高风险领域（Veale et al., 2018）。\n\n虽然这种二分法引发了学术兴趣，多项研究探讨了公共部门使用\
  \ AI 的优势和挑战（例如，de Sousa et al., 2019；Wirtz et al., 2019；Zuiderwijk et al., 2021），但现有研究的重点仍然在于政府和其他公共机构的监管作用（Kuziemski\
  \ & Misuraca, 2020）。因此，随着全球各地的行政机构已经在使用 AI，需要研究能够让从业者以结构化的方式分析 AI 在公共部门部署的潜在影响并审视其中固有权衡的框架（Harrison\
  \ & Luna-Reyes, 2022；Zuiderwijk et al., 2021）。\n\n我们通过开发一套面向以人为本的 AI 驱动公共政策的实践指南框架并将其应用于测试案例来解决这些研究空白。我们的主要贡献如下：\n\
  \n*   **Theory**：在第 1 节的剩余部分中，我们概念化了相关工作的研究成果，讨论了与公共部门使用 AI 相连的潜在优势和挑战。\n*   **Framework**：将以人为本的人工智能（HCAI）概念与政策评估相结合，我们在第\
  \ 2 节中提出了一套用于设计以人为本的 AI 驱动公共政策并评估其影响的指南框架。\n*   **Application**：为了说明该框架，我们在第 3 节将其应用于一个测试案例：我们使用一个可泛化的仿真来模拟内城的交通，尤其是停车。在该仿真中，作为一个示例性政策，我们让一个\
  \ AI 代理为停车供给设定价格。我们利用我们的框架系统地分析该政策对模拟环境的影响，并得出结论判断其是否符合 HCAI 的概念。\n\n#### AI in\
  \ the Public Sector: Applications and Challenges\n\n在公共部门部署 AI 意味着“设计、构建、使用和评估认知计算和机器学习，以改善公共机构的管理、领导者在设计和实施公共政策时做出的决策，以及相关的治理机制”（Desouza,\
  \ 2018）。\n\n与 AI 采用的普遍增长相呼应，全球公共部门的组织已开始在其日常运营中使用 AI 系统。\n\n##### Efficiency of\
  \ Operations in the Public Sector\n\n首先，AI 与提升公共官僚机构内部效率的能力相关联。它可以执行琐碎的任务，例如上文提到的在爱沙尼亚监测公共草地的任务，从而节省成本并降低公共部门员工的工作量，使其可以部署到其他地方。AI\
  \ 已证明其能够在选定任务上超越人类，从而可能降低此类公共行政内部流程的错误率（Valle-Cruz et al., 2019）。\n\n然而，除了可能缓慢的采用会阻碍此类收益之外，公共行政效率提升的好处也常与潜在的失业增长和劳动力市场的广泛转型联系在一起（Wirtz\
  \ et al., 2019）。虽然这一问题的程度存在一定争议，但研究人员普遍认为 AI 系统的不断普及将导致至少部分工作被自动化取代（Susar & Aquaro,\
  \ 2019）。尽管如此，由于 AI 也必然会创造新的就业机会，其带来的劳动力市场变化的结果难以预测（Zuiderwijk et al., 2021）。\n\n\
  ##### Public Decision-Making\n\n其次，AI 模型的输出可以支持公共决策实现其基础政策目标。由于能够将潜在海量的数据纳入预测中，AI\
  \ 总体上，尤其是机器学习（ML），经常被认为能够挖掘出人类无法识别的洞见。因此，在决策过程中依赖 AI 输入可能被视为引入更多“中立性”或“客观性”（Kuziemski\
  \ & Misuraca, 2020）。特别是，政府中使用 AI 已被越来越多地框定为最终支持实现联合国可持续发展目标的潜在解决方案，因为它可能有助于开发更准确的气候模型并识别打击气候变化的最有效行动（Vinuesa\
  \ et al., 2020）。\n\n尽管 AI 对推进不同政策目标具有潜在优势，但作为自动化决策（ADM）的一个例子，AI 往往反映并扩散社会中已有的偏见（Mehrabi\
  \ et al., 2022）。例如，这些偏见可能源于算法训练所使用的数据，因为边缘群体可能缺乏充分的代表性。这可能导致不同社会群体之间的错误率存在差异，正如研究发现，训练于成熟但以西方为中心的开源数据集的人脸识别系统在识别有色人种时表现明显更差（Shankar\
  \ et al., 2017）。因此，特别是由于 AI 在公共部门的部署经常伴随高风险，只要其训练数据（作为偏见的潜在来源之一）未能达到这些理想，“中立”或“客观”的政府\
  \ AI 这一概念就显得难以维持（Desouza et al., 2020）。\n\n此外，如果 AI 要支持公共决策，社会的接受度以及公众对这些系统的信任至关重要（Wirtz\
  \ et al., 2019）。研究自动化决策接受度的实验表明，虽然纯算法决策被认为较为批判性，但人类与算法决策相结合的方式似乎与完全由人类做出的决策一样可接受（Starke\
  \ et al., 2022）。特别是，透明度和此类决策系统的可解释程度在产生合法性方面发挥着关键作用（de Fine Licht & de Fine Licht,\
  \ 2020）。设计适当考虑这些点的流程对公共部门决策者而言是一个关键挑战。\n\n##### Interaction between Government and\
  \ Citizens\n\n\n\n\n\n人们对人工智能推动公共部门运营的第三个希望领域是政府与公民之间的互动。最流行的实现方式是旨在改善公共组织与民众之间沟通的聊天机器人。一方面，这意味着通过让机器人承担通常由行政人员提供的部分信息服务，从而减轻对行政部门的压力。另一方面，聊天机器人被要求自动、可能更快地向特定用户提供所需信息，或立即将用户的输入路由到适当的联系人（Androutsopoulou\
  \ et al., 2019）。\n\n由于人工智能系统通常需要大量数据进行训练，其引入在公共讨论中常因对隐私权保护的担忧而受到怀疑（Zhang & Dafoe,\
  \ 2019）。这具有特别重要的意义，因为人工智能的附加价值往往取决于其整合不同数据源到一个数据集的能力，从而可能更容易识别特定个人（Johnson, 2017）。此外，正如中国政府建立的社会信用系统部署人工智能所证明的那样，人工智能为政府提供了更容易、更深入地接触其公民私人生活的途径。因此，除了确保人工智能公共服务在不同年龄和社会群体中的可及性（Toll\
  \ et al., 2019）之外，保护隐私以及透明地传达使用哪些数据以及公民当前是否正在与人工智能交互，对于培养社会对人工智能系统的信任至关重要（Harrison\
  \ & Luna-Reyes, 2022）。\n\n总之，人工智能系统的部署似乎具有为公共部门运营带来重大改进的潜力。尽管如此，该技术带来了诸多挑战，这凸显了在公共部门引入人工智能时采取谨慎方法的必要性。\n\
  \n### 以人为本的人工智能公共政策框架\n\n我们提出的框架旨在帮助指导对政府中人工智能的这种谨慎方法，其基于 HCAI 的概念。HCAI 作为一个总称出现，用以应对前一节中详细说明的一般人工智能应用中的许多挑战。它强调构建以相关人类利益相关者为重点的人工智能系统（Riedl,\
  \ 2019）。该方法可以与构成 HCAI 的一系列原则联系起来：*可解释性*、*透明度*、*责任*、*伦理*、*可信度*、*公平性*和*可持续性*（Hartikainen\
  \ et al., 2022）。这些原则指导了我们框架不同层级的设计。\n\n作为第二基础和方法，以确定给定的政策是否遵守这些原则，我们的框架依赖于政策评估。政治学中有一大分支研究致力于公共政策的评估，评估或预测不同政策项目的绩效，并将其研究成果反馈到政策制定过程中。![Figure\
  \ 25.1 Framework for human-centered AI-based public policies.](img/fig25_1_B.jpg)\n\
  \nFigure 25.1 Framework for human-centered AI-based public policies.\n\n#### 先决条件层级\n\
  \n为了避免“解决方案主义陷阱”，即不认识到技术可能不是解决特定问题的最佳补救措施（Selbst et al., 2019），在制定利用人工智能的任何政策干预之前，政策制定者应确保为预期目的部署该技术总体上是合理的，并且可以预期带来切实的好处（Desouza\
  \ et al., 2020）。由此产生的政策应以合理的可能性在与已实施和潜在的替代方案相比时提供更好的*效率*和/或*有效性*。在许多情况下，基于人工智能的方法很可能仅提供增量的性能改进，或需要对技术设备和人员进行大量投资，要求决策者做出权衡。至关重要的是，这一评估应在确保给定政策旨在促进公共利益的基础上进行，因为公共机构不能仅基于效率和有效性来概念化价值（Mintrom\
  \ & Williams, 2013）。\n\n此外，一些主题可能完全不适合部署人工智能。这可能是由于技术原因，例如高质量数据缺乏，或人工智能方法对给定问题的性能不具竞争力（van\
  \ Noordt & Misuraca, 2022）。最重要的是，伦理或隐私考虑必须为从此先决条件阶段向前推进的决定提供信息。正如前一节所述，当部署在敏感政策领域时，例如国内安全，人工智能有可能极大地扩展政府控制其公民的能力，或通过可能存在偏见的决策对其生活产生负面影响，例如，当用于搜索通缉人员的面部识别套件保存无辜旁观者的数据甚至返回误报时（Susar\
  \ & Aquaro, 2019）。欧洲委员会提出的人工智能监管框架可作为未来此类考虑的指导方针（European Commission, 2021）。它区分了与在不同场景中部署人工智能系统相关的不同风险等级，禁止具有“不可接受”风险的系统，例如社会评分，并对“高风险”应用领域，如教育、庇护管理或关键基础设施，施加更严格的规则。\n\
  \n#### 流程层级\n\n在通过先决条件层级后，流程层级规定了人工智能如何嵌入产生所涉政策产出的决策过程。鉴于先前详细说明的在决策过程中使用人工智能所面临的挑战，确保在部署之前对潜在人工智能系统进行偏见审查以确保公平结果，对公共行为者至关重要。也就是说，他们必须调查哪些个人或社会群体可能因基于该系统的决策而处于不利地位，无论是因为训练数据或算法本身包含不同种类的偏见（Mehrabi\
  \ et al., 2022）。在这样做时，由于存在跨多个属性的交叉歧视危险，例如有色人种女性，仅关注个体特征是不够的（Mann & Matzner, 2019）。至关重要的是，由于提出了许多算法公平的形式化，适用于给定政策的公平概念是情境依赖的，可能由被再分配的公共资源和受影响的社会群体决定（Gerdon\
  \ et al., 2022）。\n\n此外，人工智能驱动政策内的决策过程应以透明度和问责制作为基础构建。虽然这些术语相关且常在类似背景下使用，但它们指的是不同的概念（Williams\
  \ et al., 2022）。透明度要求政策制定者提供关于人工智能在给定政策干预中的作用及其内部运作的 readily available 信息（de Fine\
  \ Licht & de Fine Licht, 2020）。\n\n\n\n\n\n在透明度的基础上，可问责性必须涉及对政策背后 AI 系统的设计和运行给出理由和解释。最重要的是，可问责的决策过程必须允许决策对象在相关决策或其理由被证明不充分时请求执行后果（Binns,\
  \ 2018）。因此，用于政府的 AI 系统必须辅以申诉机制的引入，允许公民对系统的输出进行核查。此外，它们还应允许通过可解释 AI（XAI）实现某种形式的解释性，以便提供理由。XAI\
  \ 方法寻求通过例如用更简单、可解释的模型近似学习到的函数，使深度 ML 模型的输出变得可解释（Samek & Müller, 2019）。然而，由于更简单的模型，例如浅层决策树或线性模型，在无需额外\
  \ XAI 的情况下即可提供可解释性（在许多情况下能耗也更低），如果其性能与更复杂的模型类别相比差距不大，则应优先选择它们。\n\n透明度和可问责性对于检测 AI\
  \ 系统中的偏见以及确保公众对基于该系统或由其支持的政策的信任至关重要（de Fine Licht & de Fine Licht, 2020; Williams\
  \ et al., 2022）。特别是，创建符合 HCAI 概念的可问责设计需要明确的人类责任（Mhlanga, 2022; Shneiderman, 2020）。因此，该框架需要在\
  \ AI 系统的训练和推理步骤中实施 `human-in-the-loop` 概念，以使人类验证算法的输出并定期提供反馈，影响训练过程（Wu et al., 2022）。除了能够实现更清晰的可问责性之外，这一过程还有一个优势，即执行此工作的人员将更深入地了解模型的内部运作，这随后应指导与政策相关的外部沟通，从而有望提高透明度。尽管如此，这种职业将需要广泛的培训和监督，因为算法的输出可能会影响环路中的特定人类及其关于是否干预的决策（Saxena\
  \ et al., 2021）。\n\n最后，流程层的最后一层旨在将 Shneiderman (2022) 提出的 HCAI 概念中 `reliable`、`safe`\
  \ 和 `trustworthy` 系统的最佳实践引入框架。\n\n#### Output Level\n\n框架的输出层采用了 Vedung (2013) 提出的用于政策评估的\
  \ `side-effects model`。该层的核心要素是目标达成度衡量，它检查相关政策的输出是否符合其在构思阶段设定的目标。\n\n### Applying\
  \ the Framework: AI-based Pricing for Parking\n\n为了说明我们框架的核心原则，本节介绍一个简单的测试案例。我们的示例政策干预旨在通过利用基于\
  \ AI 的定价来改善模型城市的市政停车位管理。该示例非常适合展示该框架，因为所谓的“智慧城市”是公共部门 AI 应用最突出的领域之一（Ben Rjab & Mellouli,\
  \ 2019）。此外，城市管理部门已经尝试使用自动定价系统进行停车管理（Friesen & Mingardo, 2020）。而且，由于城市停车通常被认为效率相对低下，过低的价格会导致需求过高，并对城市社会产生不利影响，例如为寻找停车位而兜圈，因此政策制定者有压力在这一政策领域开发新解决方案（Shoup,\
  \ 2011）。为解决这一问题，我们测试案例政策的目标是通过避免过度使用和利用不足，来更有效地管理我们模型城市的停车区域。支持该政策的 AI 系统由强化学习（RL）控制，RL\
  \ 是 ML 的一种变体，允许在没有指定真实值的情况下对所研究对象的状态做出动态反应。\n\n对于在某种程度上依赖于 AI 的政策，通常明智的做法是首先进行事前政策评估，因为正如前一节所述，此类政策可能带来广泛的后果，而这些后果在事先可能只能部分理解。因此，模拟作为该研究领域长期使用的工具，是在安全环境中测试基于\
  \ AI 的公共政策的宝贵工具（Desouza et al., 2020; Nespeca et al., 2022）。![Figure 25.2 Visual\
  \ interface of the parking simulation.](img/fig25_2_B.jpg)\n\nFigure 25.2 Visual\
  \ interface of the parking simulation.\n\n#### Prerequisite Level\n\n在先决条件层，第一步是确定测试政策是否可以预期在\
  \ `efficiency` 和/或 `effectiveness` 方面优于替代方案。![Figure 25.3 Interaction between AI\
  \ system and simulation.](img/fig25_3_B.jpg)\n\nFigure 25.3 Interaction between\
  \ AI system and simulation.\n\n![Figure 25.4 Exemplary pricing as determined by\
  \ AI system.](img/fig25_4_B.jpg)\n\nFigure 25.4 Exemplary pricing as determined\
  \ by AI system.\n\n![](img/fig25_5_B.jpg)\n\nFigure 25.5 Performance of the existing\
  \ pricing scheme against the AI-based system across different dimensions (relative\
  \ to the best value in the respective dimension).\n\n#### Process Level\n\n通过先决条件层后，我们可以继续审视测试政策的流程。Figure\
  \ 25.3 说明了该流程。每 30 分钟，构成干预基础的 AI 系统在分析当前状态和环境后确定四个路边 CPZ 的当前价格（在此阶段设计政策时，为模拟）。\n\
  \n由于此处使用的简单模拟仅对其代理建模一个个人属性，即收入，因此它只能产生与收入相关的 `bias`。由于在模拟行程中找不到停车位的代理会离开模拟且不会被替换，因此在此情况下\
  \ AI 系统公平性的一个适当衡量标准可能是它在多大程度上允许低收入代理在市中心停车。由于许多市政当局的停车费被定价过低（Shoup, 2011），可以预期 AI\
  \ 系统确定的价格平均而言会高于当前方案，从而可能不成比例地影响低收入人群。\n\n\n\n\n\n就*透明度*以及*问责制*而言，应用该框架已可得出结论：AI\
  \ 系统在其当前形式下并不满足 XAI（或一般可解释性）的要求，因为它并未提供任何进一步的见解，说明代理为何为某个 CPZ 选择了特定的费用。除此之外，它在训练和推理步骤中也缺乏人类在环概念的实现。如\
  \ Figure 25.3 所示，在其当前形式下，系统的运行中没有任何人类输入。因此，旨在实施该政策的城市管理部门将不得不将 XAI 方法引入流程，并选择不同的\
  \ RL 算法，例如学习人类偏好（Christiano et al., 2017），以容纳人类反馈。此外，正如前一节所述，实施所提议系统的最终政策必须辅以关于系统部署及其运作的透明沟通，以及为公众提供请愿机制以促进问责。\n\
  \n在政策周期的这一早期阶段，流程层面的最后一层主要充当一份待办清单，说明如何设计软件工程工作流程以及定义 AI 系统的审计和沟通流程。在我们的测试政策案例中，*可靠性*可能特别值得关注，因为从公民的角度来看，可靠性可能与系统定价策略的波动性相矛盾。\n\
  \n#### Output Level\n\n进入政策的输出层面，Figure 25.5 显示了定价系统对模型环境在四个维度上的即时影响，与现有的静态方案进行比较。一般而言，基于\
  \ AI 的政策在保持路边停车位利用率在期望范围内方面似乎显著优于现状，因为其定价成功地平衡了过度利用和利用不足。因此，*目标区域的期望结果*得以实现。关于*预期副作用*，模拟运行证实该政策不成比例地限制了所建模市中心的停车可达性，从而表现出对低收入人群的偏见。此外，该政策还在模拟环境中产生了*非预期副作用*。\n\
  \n总体而言，基于此高层次分析，所提议的基于 AI 的政策不符合 HCAI 的概念，因为其内部流程既缺乏透明度也缺乏问责制，而其输出显示出明显的偏见。然而，所引入的框架指出了政策计划可进行修改的明确起点，从而使其在未来迭代中可能符合要求。尽管如此，值得指出的是，对这些结果的有效解读也可能得出结论，即所提议的政策总体上不适合预期目的。在本测试案例中，使用在所有收入群体中相同的动态价格来管理需求，最有可能始终不成比例地损害低收入者。因此，像完全禁止市中心汽车交通这样的替代政策，可能对政策制定者更具吸引力。\n\
  \n### Conclusion\n\n本章介绍了一套用于开发以人为中心的 AI 公共政策的指南框架，以促进 AI 在公共部门的有序和审慎部署。基于 HCAI\
  \ 和政策评估的现有文献，该框架可用于确定当前正在设计或已实施的政策干预是否满足定义 HCAI 的核心构念。为了展示其潜在用途，我们将该框架应用于模拟环境中的一个简单模型政策。\n\
  \n至关重要的是，需要注意我们工作的若干局限性。由于篇幅限制，该框架以高层次的方式涵盖了多个理论构念和主题，而这些主题本身就是整个研究分支的课题（例如 AI 透明度或\
  \ XAI）。我们并非提供可立即在实践中部署的详细手册，而是旨在提供一个理论概念的概览，这些概念可构成公共部门中的以人为中心的 AI，并指向各领域的专家。因此，我们的框架只能提供一般性指导，这些指导可作为更详尽和实用的流程的基础，例如与利益相关者和政策从业者共同制定的分步说明，以实现\
  \ AI 在公共部门的负责任部署。\n\n最后，为了进一步研究公共部门是否以及如何使用 AI，我们需要更好地了解公共机构目前如何部署该技术。因此，需要更多研究来调查基于\
  \ AI 的当前政策项目（遵循 Kuziemski & Misuraca, 2020；van Noordt & Misuraca, 2022），以确保像本文提出的框架这样的框架能够得到完善，从而更好地反映公共部门运营的现实，并全面评估依赖\
  \ AI 的公共政策的结果。此外，还需要更多理论研究来探讨如何设计公共部门 AI 使用的监管。虽然文献中充斥着自愿性标准的提案，但可能需要更严格和可执行的措施，因为“即使是公共部门看似微不足道的\
  \ AI 应用，也可能成为控制公民的工具”（Kuziemski & Misuraca, 2020）。\n\n### Acknowledgement\n\n本研究是在“Consequences\
