  \n* Zuboff, S. (2018). 监控资本主义时代：在权力新前沿为人类的未来而战。PublicAffairs。\n\n## 4 人本主义人工智能与用户体验设计交叉处的伦理\n\
  \nChristopher D. Quintana\n\nVillanova University, Villanova, PA, USA\n\nDOI: [10.1201/9781003320791-6](https://dx.doi.org/10.1201/9781003320791-6)\n\
  \n在试图理解和开发人本主义人工智能的概念时，越来越呼吁认识到人机交互理论与实践、人工智能开发以及道德和社会哲学中常被审视的道德关切之间丰富的协作可能性。与其中一个或全部领域相交的工作往往强调用户使用情境、用户所导航的数字环境性质，以及被整合用于创造用户体验的广泛设计实践之间的相互作用。在本章中，我旨在突出在用户与不同形式人工智能之间的这些交互点上可能出现的道德和社会关切。我认为，人与机器之间的交互点是审视伦理问题的本质以及导致这些问题的机制的丰富来源。因此，标题中的交叉点既指用户交互，也指伦理和哲学可以与用户体验设计洞见相遇的点。我首先简要概述一些对人工智能哲学伦理有影响的方法，然后转向探索上述交叉点，以便更广泛地理解设计人本主义人工智能系统所涉及的内容以及由此引发的道德问题。\n\
  \n### 人工智能伦理中的主流思潮\n\n在本章中，我遵循现有的 AI 伦理文献，认为“将算法的伦理与它们在计算机程序、软件和信息系统中的实现和执行分开考虑是没有意义的”，并且从技术伦理学家关注“基于复杂规则做出通常可靠……决策的决策算法”中获益良多，这些规则挑战或困扰人类行动和理解的能力……算法的行动难以预测，或其决策逻辑事后难以解释”\
  \ (Mittelstadt et al., 2016) 或突出那些根本未被解决的重要问题或问题。当前人工智能的部署现实，通常被称为狭义人工智能，\n\n那么，有影响力的哲学人工智能伦理学家在关注狭义人工智能的应用时，到底在考虑哪些问题呢？两篇姊妹论文\
  \ (Mittelstadt et al., 2016; Tsamados et al., 2022) 为我们提供了对文献的广泛调查，并以以下方式概述了关键关注领域：\n\
  \n1. 证据不充分导致不合理的行动\n2. 难以理解的证据导致不透明\n3. 误导性证据导致偏见\n4. 不公平的结果导致歧视\n5. 转变效应导致自主性挑战\n\
  6. 转变效应导致信息隐私挑战\n7. 可追溯性导致道德责任\n\n这些主题可以聚类为主要认识论（I–III）和主要规范性（IV–VI）关切。我首先在此概述关于关键认识论关切的论文，然后转向规范性问题，特别是对自主性的转变效应。认识论问题\
  \ I 和 III 涉及处理的数据性质。问题 I 涉及对概率性但不确定的知识的依赖，而 III 突出了“垃圾进，垃圾出”原则，这意味着算法结论的可靠性和中立性仅与其输入数据一样好\
  \ (Mittelstadt et al., 2016)。问题 II 涉及数据和算法的不可访问性或“不透明性”，它们通常难以理解和获取，而这两者都是透明度的关键组成部分。这些问题导致了有利于处理和持有数据者以及数据主体的数据权力不对称。在这种情况下，由于对数据使用的认识有限，数据主体很难就其数据暴露做出明智选择。同时，不透明性和透明度方面的问题也是监督的障碍，因为数据量如此庞大，以至于人类行为者难以分析和梳理数据的大量信息。\n\
  \n规范性问题，例如导致偏见和歧视的不公平结果，仍然与前面提到的认识论关切密切相关。有偏见的数据和画像算法参与了这些问题的延续。例如，个性化算法可以强化现有的社会劣势，并导致自我实现的预言和对某些群体的污名化，最终破坏他们参与社会的潜力。此外，个人在更广泛群体内的画像和聚合，以及所使用的不透明流程和数据，都引发了关于信息隐私的问题。信息隐私的概念通常被理解为将个人数据屏蔽于第三方、控制自己的信息、并要求他人付出努力才能获取的权利。研究人员指出，个体身份的特异性并非信息隐私关切产生的必要条件，因为算法倾向于根据共同特征对人群进行聚合。\n\
  \n\n\n\n\n另一种相关的可追溯性关乎道德责任（VII）。当技术出现故障时，通常希望将指责、制裁或问责追溯到具有控制权的行动者。计算机程序员历史上对程序效果和潜在故障有一种总体把握。然而，随着信息通信技术和编程的快速发展，由于复杂性和数量庞大，追溯责任变得越来越困难。伦理学家和研究者（Bozdag,\
  \ 2013；Kramer et al., 2011）认为，对于非学习算法，程序员仍保留一定责任。然而，在追溯责任时，面对庞大且不透明的数据集，这些数据集违背透明度和人类监督，问题就出现了。当算法具备学习能力时，问题变得更加复杂，因为其不确定性使得难以将责任\
  \ pinpoint 到特定的程序员或群体，他们无法预测算法将如何学习并对新的数据输入做出反应。是否可以将自我学习算法归为具有能动性、道德地位和伦理决策能力，仍然存在争议。同样，在这种情况下开发者的责任也在争论之中：\n\
  \n> 将道德能动性赋予人工智能代理可能会让人类利益相关者将责任转移给算法。否认人工智能代理的能动性会使设计者对其半自主创造物的不道德行为负责；不良后果反映了糟糕的设计。鉴于监督的复杂性和决策结构的波动性，两种极端都不完全令人满意。\n\
  \n> (Mittelstadt et al., 2016, p. 11)\n\n最后一个主题聚焦于算法对自主性的变革性影响，研究者主要分析个性化算法。Tsamados\
  \ et al. (2022) 识别出关于用户自主性的三个担忧来源：（i）主动学习算法的普遍分发，影响用户选择，（ii）用户对算法的有限理解，以及（iii）对算法结果缺乏申诉渠道。许多用户缺乏对学习算法如何运作的深入理解。缺乏理解会阻碍用户充分利用算法来实现其目标。然而，自\
  \ Tsamados 等人发表以来，已取得了一些进展，许多普通人发展出了对算法依赖于显式数据输入进行策展的默会知识，并且对算法结果的申诉渠道有限化有所转向。这种意识仍然不足以涵盖完全的理解和对结果施加控制的能力。因此，审视学习和个性化算法对自主选择的威胁，揭示了技术、伦理和政治问题的复杂交集。公众对算法的着迷和担忧反映了学者对回音室、认识论泡沫、错误信息、信息多样性缺乏以及整体上对用户人格和意识形态塑造的担忧。\n\
  \n### 技术社会人工智能伦理\n\n上述所讨论的规范性和认识论问题是正当且重要的研究和行动领域。然而，更广阔的系统愿景重新构想了我们对自主性等事物如何受到影响的认知。例如，一种理解上述规范性和认识论问题的方式是，一方面想象一个稳定的“主体”，即用户配备有一套稳定的能力（例如理性与选择）以及某种权利（例如自主性或隐私）。另一方面，你拥有一种技术或算法\
  \ *in medias res*，似乎没有历史，也无视设计它所涉及的众多人之手。然而，这种框架存在掩盖使某种技术得以实现的社会生产过程的风险。\n\n####\
  \ 技术社会工程\n\n学者 Brett Frischmann 和 Evan Selinger 表达了对他们所称的人类技术社会再工程的担忧。对于 Frischmann\
  \ and Selinger (2018) 而言，信息通信技术（ICTs）提供了可供性（即工具与使用者关系所启用的能力），最终削弱了人类实践能动性所赋予的自由。\n\
  \n> Facebook 用户已被编程为对刺激做出反应，而不去思考其真实性，即使他们可能有理由这样做。Facebook 平台通过提供一个自动化系统来推动个人发送问候，从而改变了祝朋友生日快乐的社会实践，导致比原本会给予或收到的生日祝福数量大幅增加。\n\
  \n> (Haenschen et al., 2021), p. 1479)\n\n值得注意的是，当某人陷入 Facebook 用户体验时，发生的事情不仅仅是粗暴的信息推动，即基于信息可用性而推动行动的\
  \ nudge。毫无疑问，生日发生的原始信息至关重要，但界面设计在文本信息之外更深入地调动用户：界面部署了色彩理论的使用（例如为通知使用红色）、情感和象征性设计（例如使用相关的生日图像）以及量身定制的呈现（例如显示其他人正在该生日者的个人资料上积极发布）。对拉斯维加斯机器赌博的开创性研究提供了一个有用的平行案例\
  \ (Schüll, 2014)。不仅仅是赌博相对少量金钱可能带来巨大收益的信息让赌场老虎机区域挤满了渴望的用户——尽管这可能不可或缺。赌场设计师很早就理解了赌场内部设计和布局的好处：建筑、氛围和情感反应，由在赌场楼层行走产生以保持用户参与——更不用说机器提供的令人满意的视觉奇观、触觉反馈和听觉参与。各种数字平台的设计者和使用者同样应该认识到，他们的设计以及其中部署的狭窄形式的<|message|>\
  \ 人工智能如何创造一个能够从根本上改变用户行为和习惯的数字环境。\n\n#### 道德去技能化与习惯化\n\n在技术哲学伦理学中，越来越担心技术不仅改变用户的行为和习惯，还可能导致关键道德技能或能力的萎缩。首次尝试解决信息通信技术可能对道德技能培养产生的影响，如在美德理论中所理解的，可以在\
  \ Vallor (2015) 中找到。在这篇里程碑式的论文中，Vallor 试图“借鉴社会学关于经济去技能化的辩论的概念工具，以阐明技术去技能/增技能的不同潜力，即\
  \ ICTs 有助于人类用户道德去技能的能力。”\n\n\n\n\n\n要进行此类审视，瓦洛尔从道德技能在品格培养中的作用开始。在新亚里士多德的基础之上，她强调在美德理论文献中，美德是通过培养获得的，而非品格的先天状态。在这种框架下，某人是否发展出某种特定美德的可能性，将取决于他们是否“反复参与培养该美德的类型实践”，具体而言是“成功在特定道德情境中培养正确行动技能的实践”(Vallor,\
  \ 2015，第 109 页)。\n\n以熟练下棋的实践为例。近期关于高水平比赛中作弊的争议强调了诚实等美德的重要性。在竞争环境中，尤其是在声望和经济激励显著的情况下，存在破坏公平竞争的潜在诱因。这种破坏公平竞争的形式最终威胁到熟练精通下棋实践本身。参与这一活动时，玩家因此被置于评估是否应破坏其实践以及培养和践行诚实美德者的期望的位置。当然，竞技象棋并非行使诚实的唯一途径，但正是竞技象棋等实践所带来的行使美德的机会。相比之下，参与并在例如熟练小偷的帮派中发展自己则偏离了目标，因为美德旨在实现对人类繁荣的某种构想，而非欺骗、抢劫以及破坏人类共同体信任的行为。\n\
  \n该示例说明了用户体验或与特定技术互动的情境对使用者的道德技能和习惯培养能力的赋能作用至关重要。瓦洛尔的框架承认其具有广泛适用性，包括自主或“智能”武器系统和数字平台。但瓦洛尔提供了一个特别具有启发性的具身人工智能的例子，即社会护理机器人。在道德技能模型上，担忧在于社会护理机器人可能会破坏护理等实践得以行使的关键情境。将关怀或照顾称为一种美德，是为了将其与简单的态度区分开来，而是一种“亲自满足他人需求的活动”，通过“熟练、专注、负责且情感上具有回应性的倾向来亲自满足与我们分享技术社会环境的他人的需求”(Vallor,\
  \ 2018，第 221 页)。\n\n在此特别令人担忧的是将关怀的“负担”自动化或外包的过程，而应设计一种“支持熟练开展整体关怀实践的机器人。通过这种方式，护理机器人不仅可以造福患者，还可以帮助满足护理人员的道德需求，让他们成为更熟练的护理者”(Vallor,\
  \ 2015，第 120 页)。我不会假装拥有此类复杂机器人设计的蓝图，并将此留给该领域技能远超我的设计师和工程师。然而，值得注意的是关于社会护理机器人背景下用户体验研究的最新荟萃分析。\n\
  \n### 设计在情境中\n\n认识到设计师正在进行“以其他方式进行的伦理”(Verbeek, 2005)，以及设计本身的嵌入性，要求我们审视设计师及其情境。在转向设计师及其情境时，我将借用哲学家阿拉斯代尔·麦金泰尔关于实践及其相关善的观念。对麦金泰尔而言，实践是一种连贯而复杂的社会人类活动形式，具有其自身的内在善和卓越标准。要配得上其名称，实践的参与者必须发展或行使技能、能力或道德和认识论美德。简而言之，实践必须有助于参与者作为个体的繁荣，而不仅仅是作为从业者或工人(MacIntyre,\
  \ 1981，第 181–203 页)。\n\n此外，实践本身必须具有麦金泰尔所称的内在善。内在善是实践者在其活动中旨在实现的目标。例如，如果有人故意毒害患者而非治疗其疾病或缓解其症状，我们就不会称其为医疗护理的适当从业者。而在该实践中，存在可接受性和卓越性的标准和准则，必须满足这些标准才能真正实现该善。一位草率且疏忽的牙医未能实现良好的口腔健康这一目标，而一位有条理且细心的牙医则能实现。\n\
  \n除了内在善、卓越标准以及人类能力的培养之外，实践的另一个特征是外部善这一互补概念。外部善包括金钱、名声、声望等，因在实践中出类拔萃而可能获得的利益。事实上，此类善往往是追求实践的重要助力，如专业协会促进和赞助实践得以开展或进一步理论化的机会。然而，尽管内在善和外部善可以互补，但它们常常彼此紧张，例如当一个组织为了利润动机、效率或成为首个上市的声望而抛弃实践的部分内在善时(Moore,\
  \ 2019，第 55-74 页)。\n\n最后，虽然我们中的许多人倾向于参与各种实践，但我们在工作中参与的实践很可能，如商业伦理学家杰夫·穆尔所言，“是时间与精力投入最多的最重要实践之一。”此外，工作是工人能够“为共同善做出贡献的最重要方式之一：我们参与提供的产品或服务，以及我们对实践的参与如何发展我们作为人”(Moore,\
  \ 2019，第 84 页)。\n\n设计师，尤其是用户体验和以人为本的人工智能实施领域的从业者，可以从将自己的活动视为对这两种不同善的贡献这一视角中受益。在追求以人为本设计——在此理解为伦理设计——的情况下，这尤其重要。例如，用户体验在倡导和为聋哑和盲人设计在线体验的可及性方面发挥了关键作用。在这种情况下，设计的优良不仅在于其满足某些可用性或法律标准，还在于其对共同善的更广泛社会贡献，即扩大谁能够接触到像数字生态系统这样重要的事物，而数字生态系统往往影响离线世界——如果这种区分仍然成立的话。上述设计关切有助于设计的内在善，通过贡献改善用户生活的产品并开辟新的体验途径。培养这一实践有助于满足工人对其工作活动的期望，以及对更具伦理消费的增长渴望，\n\
  \n该示例强调，我对设计师在此情境中角色的描绘无疑是有限的，且只是更大图景的一部分。通过聚焦用户体验设计师，我无意将责任负担放在产品开发中一个经常缺乏投资或成熟度阶段的部分。\n\
  \n### 讨论\n\n\n\n\n\n动态和自适应人工智能系统的普遍存在，例如内容推荐器（例如新闻、视频、音频）、预测模型（例如金融建模）、决策（例如抵押贷款）和自然语言理解系统（例如聊天机器人），给以人为中心的<|message|>设计带来了挑战。鉴于人工智能的社会影响，研究人员认为可解释性超出了法律要求，而“支持用户掌控”并帮助“设计师提高正确性、识别训练数据改进、应对不断变化的现实”\
  \ (Shneiderman, 2020，第 26:9 页)。对于 Shneiderman (2020)，发展的这一方面是开发可解释和探索性用户界面的技术实践的一部分，这一方面创造了可靠的软件工程系统。这里“可解释和探索性用户界面”指的是配备组件以允许用户理解和控制这些过程的界面。\n\
  \n一个典型案例是对 Google Flights 服务的案例研究，该服务使用机器学习预测航班价格 (Polonski, 2020)。认识到客户会持续比较价格，其设计师旨在通过提供清晰易懂的信息来促进“价格智能”。这通过纳入设计元素来实现，这些元素显示当前价格的好坏、简单的文本解释、关于潜在价格变化的预测信息以及视觉元素。例如，价格可视化条使用数字和颜色绿色、黄色和红色在滑块上指示良好与平均与不良的价格。在条下方，用户可以点击访问显示价格历史的图表。除了这些元素之外，还有一种简单的方式来访问用于进行计算的数据源。因此，设计师在使用户能够获取信息并探索其选项的同时避免了认知过载。这种方法促进了知情决策，避免了认知过载，并与\
  \ Shneiderman’s (2020) 的可解释和探索性界面概念保持一致。\n\n从本章“道德去技能化和习惯化”部分所述的“去技能化和习惯化”模型的角度来看，一个关键的考虑因素是通过这些交互培养的技能和习惯的性质。这不仅仅是变得擅长购买航班的问题，尽管这可能很有帮助，而是通过促进探索、反馈和理解，培养用户频繁使用的数字环境的熟练参与。相反，模糊人工智能交互的界面可能导致用户习惯于错误地放置信任并对能力产生错误的期望。这种习惯化的影响远远超出了消费者选择，因为数字界面涵盖了社会、政治、美学和教育实践的许多方面。从美德伦理学和认识论的角度来看，对认识论和道德美德都存在风险，例如智力谦逊\
  \ (Heersmink, 2018) 或同理心和适当的或明辨的关注 (Vallor, 2018)。然而，这种美德理论视角可以为产品规划阶段和产品分析提供信息，通过识别产品可能培养的习惯和技能类型及其道德影响。这种方法试图超越对公平、透明和问责的呼吁，并有助于呼吁促进“提高自我效能、鼓励创造力、明确责任并促进社会参与”的实践\
  \ (Shneiderman, 2020)。\n\n虽然本章重点关注嵌入在人机交互中的技术社会工程，但“设计在情境中”部分中 FTC 对 Epic Games\
  \ 的案例强调，可解释和探索性界面的决策制定往往因管理或商业压力而复杂化。因此，Shneiderman 认为，可靠、以人为中心的系统的创建不仅需要良好的设计实践，还需要在组织层面（例如领导力承诺、招聘和培训以及内部审查）的安全文化以及值得信赖的外部审查（例如审计公司、专业组织和治理）的某种组合。这些是在组织和政治层面都复杂且有争议的行动区域。此外，如果以人为中心的設計需要阐明人工智能系统为用户提供的价值，那么组织就确保人工智能实施与用户需求、能力和期望保持一致。如果人工智能系统的益处不明确，或其性能存疑，就存在不必要部署的风险。这种反思性旨在遏制一种技术文化的形成，这种文化威胁到无反思地部署人工智能驱动的产品，并以牺牲人类能力和实践为代价。\n\
