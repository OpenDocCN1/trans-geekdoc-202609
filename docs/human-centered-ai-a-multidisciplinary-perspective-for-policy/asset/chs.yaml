  \n## 27 Tatiana Revilla 的评论\n\nTatiana Revilla\n\nTecnológico de Monterrey, Monterrey,\
  \ Mexico\n\nDOI: [10.1201/9781003320791-31](https://dx.doi.org/10.1201/9781003320791-31)\n\
  \n**请告诉我们更多关于您在人工智能领域所做的工作**。\n\n我所负责的项目特别关注人工智能设计和使用过程中性别、种族和社会经济偏见的重现。我们非常清楚这些偏见对社会、政治、经济以及人们生活的整体可能产生的影响。这是一个我们认为应给予特别关注的领域。\n\
  \n关注的重点不应仅限于人工智能设计者。公共政策专家也需要在人工智能的发展中发挥至关重要的作用。具有性别视角的公共政策或平等公共政策学科是我们主要的研究兴趣之一。我们力求对人工智能形成跨学科的视野，并特别关注不平等逻辑如何在科学中被重现，具体在人工智能的创造中。\n\
  \n在个人层面，我参与过与暴力相关数据的收集、使用和处理有关的正义项目，例如针对妇女的暴力。尽管使用了人工智能，我们面临的许多问题仍未得到解决，因为它们源于认识论和设计问题。\n\
  \n这促使我们从科学角度进行更深入的讨论和质疑。我们性别项目的目标之一是在所有学科中整合这种质疑，并教育新一代学生，使他们不要将人工智能视为纯粹的技术，正如目前的情况一样。\n\
  \n与欧洲或美国相比，我认为在墨西哥，人工智能往往被视为与社会分离的东西，纯粹是技术性的，大多数人并不认为自己参与其中。重要的是让人们更接近人工智能，让他们理解人工智能是日常生活的一部分，它存在于他们的手机中，它不仅仅是未来的东西，或是机器人。\n\
  \n我们面临的挑战是将社会与技术结合起来。我们在项目中正努力大力推广这种方法。尽管在一些学术和技术圈子中，对将性别视角和人权纳入人工智能存在抵制，但建立这种联系对于人工智能更公平、更公正的实现至关重要。\n\
  \n**人工智能在拉丁美洲的司法系统中是如何被使用的？**\n\n在像中国和美国这样的国家，法律从业者正在使用人工智能系统来评估证据、做出决策，甚至根据预测发布判决。但这需要谨慎处理，因为用于做出这些预测的数据是由可能存在偏见的人标注的。\n\
  \n在墨西哥，虽然我们尚未在司法系统层面实施人工智能系统，但我们正在对未来可能用于训练这些系统的数据进行分类。几年后，我们将不得不分析和重建这一过程，因为我们目前使用的数据缺乏性别视角，也不是以人为中心。大多数这些数据有利于检察机关，并不是为了捕捉、处理、分析和传播以人为中心的信息而设计的。因此，我们应特别注意如何对数据进行分类以在司法部门创建人工智能系统。\n\
  \n\n\n\n\n我不能代表整个拉丁美洲发言，但我相信大多数国家，尤其是那些已经围绕人工智能制定公共政策的国家，都在这一领域取得进展。这些国家包括墨西哥、哥伦比亚、秘鲁、巴西和智利，它们已经制定了人工智能战略，或正在制定过程中。\n\
  \n我对拉丁美洲的人工智能战略进行了分析，并比较了人权、性别视角和交叉性在其中被纳入的程度。墨西哥和智利在纳入这些原则方面似乎是最强的，但仍有许多工作要做。虽然已有相关战略，但它们缺乏预算，并且与联合国教科文组织和经济合作与发展组织等组织的原则不一致。\n\
  \n我们需要从这些战略推进到具有约束力的公共政策，让所有相关行为者参与其中，并且具有强制性，以解决算法审计中的偏见等问题。目前，这些话题仍停留在原则和良好意愿的层面。我相信欧盟新的《人工智能法案》将成为所有地区，包括拉丁美洲的重要参考。\n\
  \n### 你对读到的文章有什么看法？它们对你对人工智能的看法产生了什么影响？\n\n我非常喜欢 Lévesque 等人的文章《为更好工作而打造以人为中心的人工智能工作空间》。它讨论了利用人工智能改善工作场所，但强调避免偏见。例如，在我们大学，我们正在重新设计数字平台，使其对不同类型的残障人士更具可及性。我们认为自己是一个包容性的机构，但事实是我们的平台并非为残障人士设计。\n\
  \n此外，Lévesque 等人的文章还强调，技术在实施前往往缺乏事先咨询。我们不会询问主要用户这些技术是否对他们有益或构成风险。许多人担心自己的工作会被这些新技术工具取代。因此，有必要进一步民主化其使用，并询问目标用户如何看待这些创新。\n\
  \n话虽如此，我注意到我在阅读的不同文章中出现了几个重复出现的主题，这促使我反思某些方面。\n\n首先，以人为中心的人工智能对于从个人主义认识论转向集体认识论非常重要。即使是涉及监管的文章也强调了这些监管与技术用户之间的脱节。因此，一个关键点是开始将人工智能视为应造福所有社区的东西，而不仅仅是其中一些社区或个人。\n\
  \n例如，Malwina Wójcik 的《通过 Ubuntu 视角实现以人为中心的人工智能：以算法应对不平等和社会排斥》特别有趣，因为它提出了我们视角的转变。它建议我们远离作为我们指南的全球北方认识论和原则，并对弱势群体如何被排除在这些技术的设计和差异化影响之外采取批判性的方法。\n\
  \n这篇文章还强调了与人工智能使用相关的特权往往仍掌握在同一群人手中。此外，它提出了分析和质疑算法模式和潜在不平等权力关系的需求。\n\n我注意到的第二个要点是，技术设计者往往认为人工智能的弱点可以通过“简单”的解决方案来纠正，例如审查数据或算法。相反，我们需要超越这一点，并审视我刚才提到的算法模式的来源。\n\
  \n我在阅读的文章中反复出现的另一个主题是人工智能的治理：谁来设计它，谁参与其部署，整个社会参与多少等。这对于确保算法的透明度和可解释性至关重要。\n\n就治理而言，问题是如何确保安全和问责，除透明度之外。目前，没有任何法规要求开发人员解释其算法做出的决策。\n\
  \n此外，我阅读的论文提醒我们，重要的是要认识到人工智能可以影响我们的行为和决策。例如，我们依靠 Waze 或 Google Maps 等应用程序导航，但这样做时，我们就把自主权交给了这些工具。这可能会改变我们记忆事物、使用时间，甚至感知世界的方式。\n\
  \n考虑人工智能如何影响我们至关重要，无论是在其设计和治理方面，还是它如何影响我们的决策和自主权。虽然人工智能旨在为我们服务，但反思如何确保我们不会最终为其服务是必不可少的。\n\
  \n### 我们应该如何应对这一问题或挑战？\n\n我们不会停止使用像人工智能这样有用的工具，例如显示交通最少路线的导航应用程序。然而，在阅读了这些问题后，我意识到人工智能可能正在影响我的决策。这让我更加清醒，未来我可能会质疑人工智能给我的建议，例如关于餐厅或博物馆的建议，或\
  \ ChatGTP 或 Bard 生成的文本。\n\n*HAICU：上周，我有一次 Waze 给了我一些错误信息的经历。这让我意识到，虽然我经常像 Waze 总是对的这样信任它，但它会犯错。以前，我几乎把它看作一个无懈可击的人物，但现在我明白它只是一个人工智能工具。这次经历让我质疑我如何看待和使用人工智能工具*。\n\
  \n没错！就我而言，我现在会在盲目遵循其指示之前先审查 Waze 提出的路线。此外，我认为教育年轻人了解人工智能的影响至关重要，因为已经有应用程序可能导致他们改变行为，例如可以根据他们期望的体重建议他们应该吃什么的工具。\n\
  \n回到我阅读的文章，其中一篇给我留下深刻印象的是 Marina Teller 关于人工智能监管的文章《迈向算法的社会可接受性》。她讨论了透明度和算法可解释性如何受监管影响，以及算法如何变得如此强大，以至于它们可以在市场和官僚机构中与监管力量竞争。\n\
  \n这篇文章让我思考学术界如何关注算法的制度权力，以及它们如何在缺乏太多反思的情况下被接受。尽管有人认为算法中已不存在“黑箱”，但现实是，我们仍然不完全了解它们如何做出决策。\n\
  \n我读到的另一篇相关文章是 Gentelet 和 Mizrahi 的《以人为中心的人工智能治理方法：通过公民参与落实人权》，该文章关注人工智能治理和当前规范。它讨论了现有法规与人工智能快速发展之间的差距。它讨论了在不同国家应用的三种类型的法规：伦理准则、算法影响评估和人工智能法律。它表明，虽然伦理准则提出了原则和价值观，但它们缺乏有效的执行机制。另一方面，算法影响评估和审计需要加强，并且需要在每个国家建立明确的规则。进行这些评估和审计很重要，以确保人工智能技术得到有效和安全地实施。\n\
  \n### 你认为，像参与本书的学者这样的人，让他们的工作和研究成果更易于获取有多重要？\n\n撰写像这样的书籍很重要，重点关注从业者、政府官员、决策者等的需求。\n\
  \n\n\n\n\n这将是一项挑战。例如，我觉得我在阅读的文章中仍然缺乏一定的实践重点。虽然它们深入探讨了人工智能的理论和认识论，但缺乏对能够帮助设计师的具体方法、流程和指标的讨论。\n\
  \n我认为我们应该进一步远离抽象和认识论，更多地谈论我们如何将性别视角、以人为本和交叉性等概念整合到人工智能的具体设计和分析中。\n\n我们如何将它们纳入考虑？我们使用什么指标？谁参与这一过程？回答这些问题对于弥合设计、分析和使用人工智能的人之间的差距至关重要。最终，我们需要更多实用和具体的指导，说明如何将这些理论转化为实践。\n\
  \n**基于你的分析和阅读，你会向政府提出哪些关键建议，以更好地实施以人为本的人工智能方法？**\n\n我的第一个建议是让公共决策者明白，人工智能不仅仅是开发人员和像亚马逊或谷歌这样的大公司的业务。这是一个他们必须应对的社会和政治问题。\n\
  \n其次，人工智能需要被民主化和更加透明化。有必要寻求跨学科同行机构参与人工智能政策和系统的设计、使用和评估。也就是说，重要的是要指出人工智能总会存在偏见，就像人类一样，并且需要持续监控。\n\
  \n第三项建议是政府应通过立法和公共政策推动这些努力。\n\n最后，至关重要的是要考虑人工智能对处于脆弱和被排斥状况的人们的影响。必须制定法规，以确保个人不会被用于测试或数据而被剥削。\n\
  \n## 28 Rebecca Finlay 的评论\n\nRebecca Finlay\n\n人工智能合作伙伴关系\n\nDOI: [10.1201/9781003320791-32](https://dx.doi.org/10.1201/9781003320791-32)\n\
  \n**你如何定义以人为本的人工智能，它的潜力和重要性是什么？**\n\n我认为以人为本的人工智能应该是我们*de facto*思考人工智能的方式，因为我们正在将人工智能部署到由人构成的系统和结构中。如果我们总是首先通过人类视角而不是更技术解决方案主义的方法来思考人工智能，那不是很好吗？“以人为本的人工智能”体现了人工智能部署在我们世界中的社会技术性质。它激励我们首先通过人类视角来思考人工智能。对我来说，这也包括环境。\n\
  \n**你能给我举几个人工智能合作伙伴关系在以人为本的人工智能方面的工作例子，以及它是如何实施的吗？**\n\n以人为本的人工智能是人工智能合作伙伴关系创建的核心，并且一直如此：PAI\
  \ 致力于识别人工智能对人类和地球的风险；试图找到防止对人类造成潜在伤害的方法；同时塑造和发展护栏，以确保技术以造福人类的方式进行研究、开发、部署、使用、监控和评估。以下是几个例子。\n\
  \n首先，PAI 致力于文档化和可解释人工智能。我们将文档视为负责任、以人为本的人工智能开发的强制功能。我们的“关于 ML 项目”建立在 Timnit Gebru\
  \ 和 Meg Mitchell 关于模型卡片的开创性工作之上，这些卡片仍然是该领域的*de facto*标准，以及 Kasia Chmielinski 等人领导的数据营养项目等许多其他人的工作之上。\n\
  \n目标是提高对以下问题的透明度：“这些系统是如何开发的？”，“其中有哪些‘成分’？”，“公司内部管理这些系统的结构和流程是什么？”等。这项工作在人工智能系统的整个生命周期中确定关键问题，以便记录、尽可能解释并使其核心要素及其使用方式透明化。\n\
  \n在我看来，文档是以人为本的人工智能的基础，应该继续发挥影响力，即使技术在发展。就在最近，我们听到了 OpenAI 首席执行官 Sam Altman 在呼吁模型开发者就生成式人工智能模型的成分清单达成一致并披露时也表达了同样的观点。我完全同意。在\
  \ PAI 以及其他地方，我们一直在为此努力一段时间了！\n\n另一个领域是 PAI 在包容性研究和设计方面的工作。如果我们希望人工智能为所有人服务，包括脆弱和受影响的社区，我们需要更好的公民参与和参与技术开发过程的机制。目前，整个行业都承认需要做更多工作。尽管研究正在进行，实践也在不断发展——本书记载的\
  \ Garard 等人关于农业和可持续性的论文就说明了这一点——但对于最有效的方法或方法，并没有明确的集体理解和共识。这仍然是一个难以解决的问题。\n\n因此，今年我们启动了一个包容性研究和设计项目，其重点是建立社区对人工智能开发中参与式设计在不同环境和不同社区中的含义的理解。最近，白宫在民主全球峰会上由白宫科技政策办公室主任\
  \ Arati Prabakhar 博士的讲话中承认了这项工作，重申了在人工智能开发中以公民的声音和观点为中心的重要性。\n\n**你谈到了你读过的一篇文章。告诉我这些文章如何可能改变了你对人工智能的看法**。\n\
  \n在我阅读的文章中：我很欣赏对设计方法论和具体用例的关注。对于像 PAI 这样以社会影响为使命的组织来说，了解如何将原则转化为流程非常有帮助，而不仅仅是抽象的，而是在现实世界环境中。人工智能技术可以以许多不同的方式应用，具有非常不同的数据集、应用和风险水平。我们可以转化为实践的学术研究，有助于我们改变行业实践并为公共政策创新提供信息。我喜欢所有这些文章都论证了*context\
  \ matters*。\n\n例如，Régis 等人关于医疗保健的论文出色地指出了平衡技术与社会规范和背景的必要性。非常有力量。作者明确提出了人工智能技术的*temporal*性质。他们将以人为本的人工智能呈现为一种演进过程——它当然涉及技术变化，但也受到人类系统和结构变化的影响并影响这些变化。我特别喜欢这篇论文的另一个方面是它对意义建构和反思性的关注，共享的意义建构对创新采纳有积极影响的想法。我们必须致力于共享理解、共享语言、定义和流程；我们必须支持使反思什么有效、什么无效成为可能的机制。\n\
  \nCharisi 和 Dignum 关于通过儿童人工智能视角审视监管沙盒的论文在为实践、技术开发和政策提供切实建议方面也非常出色。人们可以把它直接从书架上拿下来使用。它为我激发了许多新想法。\n\
  \n\n\n\n\n正如论文所示，我经常发现存在来回于两个极端之间的情况——没有监管和非常严格的监管。仿佛只有两个对立的阵营。我认为在那两个极端之间存在着一系列政策干预措施，监管者和政策制定者应该考虑这些。监管沙盒就是一个很好的例子。这个主题并不新鲜，但这篇论文很有帮助，因为它展示了不同政府如何实施沙盒。它还展示了如何设计监管沙盒，使其不仅满足监管者的需求，也满足技术开发者和受影响社区的需求。\n\
  \n我也很喜欢 Nishimura 等人关于敏捷治理的论文。我最近在日本，我看到了日本在 G7 会议之前做的一些准备工作。敏捷治理的概念是核心的。虽然这篇文章比其他文章更理论化一些，但它提供了关于敏捷治理的良好信息。\n\
  \n*如果你要向政策制定者、审计员提出建议，为了加强我们社会中以人为本的 AI 的开发和实施，应该做些什么，你会提出什么建议？*\n\n第一个建议是充分利用政策制定者已有的*所有*杠杆。这并不意味着监管不重要。我*确实*认为我们需要更多的监管，我非常有兴趣看到欧盟\
  \ AI 法案的下一步。然而，我也认为本书的几篇文章表明，有许多创新方式可以推进政策。政策制定者还应与多边组织合作，例如经合组织、全球人工智能合作伙伴关系、G7\
  \ 和联合国。我们必须利用这些机制来促进标准和互操作性，这将推动贸易以及负责任的经济开发和创新。\n\n我的第二个建议——Nishimura 等人关于敏捷治理的论文也谈到了这一点——是政策制定者需要了解多利益相关方组织（如\
  \ PAI）的角色。我想不出有什么惊讶的，我相信能够通过制定集体规范和协议来快速灵活地应对技术变化的组织发挥着重要作用，这些规范和协议随后可以与需要更长时间才能生效的适当监管相结合。我希望政策制定者看到像人工智能合作伙伴关系这样的组织可以成为他们的资源。事实上，我们可以将技术转化为政策背景；我们可以将政策制定者与各部门的个人和组织联系起来；我们可以帮助联系到更多国际、管辖权相关的问题。\n\
  \n本书及其中的文章是学界可以动员知识以在政策、行业和公民社会中实现真正变革的绝佳范例。\n\n# 索引\n\n页码用*斜体*表示图，页码用**粗体**表示表，后跟“n”的页码表示注释。\n\
