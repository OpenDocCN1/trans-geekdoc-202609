  \ AI 的问题。首先，许多公司没有多元化的领导团队（Eagly & Fischer, 2009）。研究强调，女性和少数族裔/种族群体被认为符合成功领导角色表现刻板印象的可能性较低（Heilman,\
  \ 2012；Hoyt & Murphy, 2016；Lyness & Heilman, 2006；Wille et al., 2018），尤其是在科技行业（Bello\
  \ et al., 2021；UNESCO, 2019；Young et al., 2021）。这些因素可能导致多样性、偏见和歧视问题不太可能成为领导者关注的焦点（Leavy,\
  \ 2018，第 14 页）。然而，在过去几年中已经变得清楚，组织意识到如果要在可持续性和盈利能力方面保持下去，必须在所有层面上优先考虑多样性。\n\n另一个参与包容性\
  \ AI 的障碍是持续存在的优先考虑效率和利润而非负责任、可持续和包容创新的叙事。伦理总体上可能被视为实现这些目标的制约因素，因为它被视为准确性（模型的\n\n\
  \n\n\n正如参与者 6 所谈到的，这是一个“将这些原则转化为实践的制度性差距”，尤其是在我们谈论“信任”、“问责”和“可解释性”等概念时；这些词在实践中意味着什么？参与者\
  \ 6 建议，这可能需要更多投资来激励公司制定道德准则，但也需要衡量机制来展示不同实践的影响。\n\n然而，我们确实看到了一些公司开始克服这些困难的例子，例如，通过制定内部政策和标准来为设计和开发这些工具的人员描述规则。我们可以在世界经济论坛探讨的\
  \ IBM 和 Microsoft 的案例中看到这一点（Green, Heider, et al., 2021a；Green, Lim, et al., 2021b）。\n\
  \n与上述文献不同，在这里，我们关注的是包容性 AI，而不是专门的道德或负责任的 AI。因此，这不仅仅是关于如何将原则转化为实践的导航，而是探索这些实践本身是否具有包容性。\n\
  \n在焦点小组中，我们 overwhelmingly 发现，公司在将包容性原则转化为 AI 实施实践时所 struggling 的地方，是缺乏具体的指导。参与者\
  \ 8 认识到，他们的客户已经开始改变开发和应用 AI 原则的方式。他们成功做到这一点的方式是，从数据收集开始，一直到 AI 的最终用户，都制定了流程。之所以会发生这种情况的另一个原因是，参与差距得到了有效解决，这意味着董事会参与了这一问题，因此，公司领导者经常确保这些原则是可操作和可衡量的。利益相关者，以及更大的透明度，可以在将包容性\
  \ AI 原则转化为行动中发挥如此重要的作用。\n\n对于某些特定行业的公司而言，这些具体步骤已经更加普遍。一些公司将拥有可用于促进包容性 AI 的结构，并且需要被识别、改造以适应目的并加以使用。例如，金融服务业拥有强大的法规、政策和审计实践。这意味着他们认为高水平的数据文化和国家之间高水平协作将使包容性\
  \ AI 策略变得更容易。事实上，即使规则发生变化，结构已经到位，也应该比没有这些要素的行业或部门更容易实施（参与者 1 和参与者 3）。\n\n但驾驭转化差距不仅仅是将原则通过包容性法规或政策转化为行动；它不仅仅是这样。它关乎确保我们创造包容性的组织文化，培养道德行为并优先考虑包容性，以便我们不断分析和讨论法规和政策如何能更好地利用包容性，以及它们如何能通过其他激励道德行为的手段得到补充。参与者\
  \ 5 指出，随着 AI 变得更加普遍，现有的监管和问责框架将不起作用，因此我们作为企业，需要继续与政策制定者进行对话。他们说，有一种风险，即某些偏见（无论是社会性的还是技术性的）也可能渗入这些政策中。它还必须真正代表全球标准，以便我们不进一步分裂全球北方和全球南方。\n\
  \n#### 对话差距\n\n从这些焦点小组中出现的第三个，也是最突出的差距是，在实施包容性 AI 时的对话差距。对话差距指的是组织在设计 AI 的人员与实施或使用\
  \ AI 的人员之间，如何努力进行包容性沟通、反馈和想法共享方面所面临的困难。正如参与者 2 所指出的，这绝非易事：“你如何从个体用户那里创造人类反馈？我认为这些，你知道，都是未得到解答的问题，而且坦率地说也是非常大的问题”（参与者\
  \ 2）。\n\n就开发 AI 系统本身而言，对话至关重要。例如，在一家科技公司的背景下，技术团队应与其它“非技术”角色保持持续对话，以便讨论企业责任以及系统的社会和伦理影响，以及将这些概念嵌入设计过程可能是什么样子，因为“\\\
  [t\\]技术团队也可能无法想象系统可以如何改进，或者如何应用其他系统、工具或方法来更好地保护和改善人类福祉” (Schiff et al., 2020，第 4\
  \ 页)。微软刚刚发布了其负责任 AI 标准的第二个版本，产品开发团队可以用它作为将原则坚持下去的具体和可操作指导。换句话说，这是一种将非技术原则转化为技术行动的方式\
  \ (Microsoft, 2022)。\n\n参与者 7 指出了与技术方面相关的参与度缺乏。他们谈到包容性 AI 是关于思考：你可以在哪里犯错？他们说，很多技术人员并不意识到，我们收集数据的方式在开始编码之前就已经存在偏见。但这种意识非常重要，否则就不知道错误来自哪里。参与者\
  \ 5 也指出，数据集是由人类准备的，而人类对数据进行分类的挑战意味着他们自己的偏见可能会渗入其中。我们训练模型，这可能会进一步加剧损害。那么其中一个问题是，我们一开始就没有完全多样化和具有代表性的数据集。正如\
  \ Tambe et al. (2019) 所指出的，正式化创建 AI 模型基础的过程很重要——这些不应该是数据科学家单独做出的决定。\n\n参与者 6 谈到了在设计阶段保持开放对话的重要性。他们说，这不仅意味着在性别、种族、民族、阶级、残疾等方面纳入多样化的声音，而且还意味着在桌子周围拥有来自不同学科的专家多样化，例如人类学、社会学、哲学等等。即使使用和目的很重要，如果我们不关注它是如何创建的，那么未来将会非常复杂（参与者\
  \ 9），这就是为什么组织必须纳入来自不同团队、背景、经验和不同技能的人至关重要（参与者 11）。\n\n\n\n\n\n这只是设计和开发团队中学科和背景多样化至关重要的一个例子。如果你确保团队具有多样性，那么你可能会对正在发生的事情以及如何解决它有更清晰的认识。多样性在设计和开发人工智能的团队中经常被强烈地赞颂为至关重要的；如果我们希望确保这项技术尽可能具有包容性（Bello\
  \ et al., 2021; Criado-Perez, 2019; Moore, 2019; Noble, 2018; UNESCO, 2019; Young\
  \ et al., 2021）。这不仅仅与系统中使用的數據有关，以及能否考虑这些数据是否适合用于创建包容性系统，还与思考算法是如何设计的以及设计过程中考虑了什么有关（Buolamwini\
  \ & Gebru, 2018; D’Ignazio & Klein, 2020; Zou & Schiebinger, 2018）。Dahlin (2021)指出，人工智能通常被视为一个技术对象，只有在实施之后才会产生社会后果；然而，我们需要在开发之初就确保纳入社会分析（Dahlin,\
  \ 2021）。\n\n同样，这种对话在整个实施过程中也至关重要。组织和商业研究文献不断强调跨部门和跨层级协作对创新以及有效的人工智能实施的重要性（Bessant,\
  \ 2009; Schiff et al., 2020）。\n\n此外，这种对话理想情况下应在实施人工智能的公司与创建它的公司之间进行。参与者 2 谈到人工智能系统是一个真正社会技术系统，它不仅与构建它的人互动，也与受其影响的人互动。他们谈到了“以人为环”概念，即个人对正在使用的产品提供反馈，并且这种反馈会积极地反馈到系统中：“从企业角度来看，‘以人为环’在此时几乎是一个流行词或流行语，但我会真诚地说，我还没有看到它被很好地实施”（参与者\
  \ 2）。从本质上讲，理想情况是包容性的共同设计，也包括那些受技术影响最大时被边缘化的人群（Walsh & Wronsky, 2019）。\n\n我们可能将此称为“人工智能的社会塑造”——即我们考虑受人工智能影响的人如何也能参与塑造它的问题（Bondi\
  \ et al., 2021）。这将有助于确保公司内部使用人工智能的用户，以及工作场所之外使用人工智能的人，能够质疑、共同创建并对系统决策和模式提供反馈（Karami\
  \ et al., 2016; Makarius et al., 2020; Sjödin et al., 2021）。\n\n### 收窄实施差距\n\n总体而言，虽然组织希望通过最具创新性的人工智能技术保持效率，但他们却不知道如何在实施包容性系统的同时做到这一点。虽然我们并不能声称在这里有所有答案，但我们认为，驾驭实施包容性人工智能的这些差距首先需要组织变革，以便组织本身具有包容性。\n\
  \n焦点小组中出现了三种组织特征，可能有助于组织在设计和/或实施包容性人工智能时成功驾驭这些实施差距。\n\n#### 与相关利益相关者的包容性协作\n\n透明度经常被科技公司（Google,\
  \ 2021; IBM, 2021; Microsoft, 2021）和学术学者（Felzmann et al., 2020; Larsson & Heintz,\
  \ 2020）讨论为道德或负责任的人工智能系统设计和开发的关键使能因素或原则。但透明度对设计人工智能的公司以及实施人工智能的公司到底意味着什么呢？这对公司来说很复杂，因为不仅“黑箱”模型高度复杂，而且不同背景可能产生不同的可解释性需求（The\
  \ Royal Society, 2019）。\n\n如果我们从实践角度思考透明度，不仅将其视为单向系统，而是将其视为与相关利益相关者，包括用户，进行包容性协作，这将有所帮助。参与者\
  \ 11 暗示，用户不仅需要技术可解释，而且真正能够理解系统的原则、功能和目的。如果组织参与人工智能中偏见和歧视问题的解决，这将使他们更好地评估自己的选择。Kellogg\
  \ et al. (2022)讨论了人工智能工具的终端用户应在开发早期阶段参与其中，并应帮助评估工具。这将防止预期的用户抵制，并在用户被后期纳入时使不满的可能性降低。\n\
  \n#### 多元化和包容性团队\n\n许多参与者提到的第一点是，组织必须关注他们如何组建团队以及如何使团队多样化，让来自不同学科、不同背景和认知多样性的人参与其中。这不能只是口头上的承诺，还必须辅以真正包容的组织文化。通过拥抱这种多样性，组织可以利用丰富的观点、知识和经验，培养创造力、创新力以及对复杂问题的整体理解。\n\
  \n然而，实现包容性人工智能不仅仅是团队构成问题。它还需要建立一个包容性的组织文化，使人工智能用户能够通过报告渠道提供实践反馈。这种反馈机制使用户不仅能够影响人工智能系统的技术功能，还能影响其目的以及其在组织和社会中的定位。尽管如此，必须认识到，正如\
  \ Sloane et al. (2020)指出的那样，参与式设计需要被承认为工作，并给予适当的同意和补偿。此外，设计过程应具有情境特异性，确保数据通过咨询和反复的方法从合适的人那里收集。\n\
  \n#### 教育和知识共享\n\n参与者还谈到了组织之间的教育和知识共享。参与者 5 指出，仅教育领导者了解什么有效是不够的，他们还需要了解忽视人工智能包容性问题的风险。这在中层管理中尤其相关，因为在许多组织中，大多数变革和日常决策都是在那里做出的。\n\
  \n除了领导者的教育和知识共享之外，参与者 6 还指出，我们需要为技术社区和机器学习专家提供更多关于伦理、性别偏见、人权和非歧视问题的教育。此外，参与者 6 说，我们还需要确保对其他利益相关者群体进行培训和教育，以了解人工智能的基础知识以及人工智能对我们日常生活的影响：“我认为这是绝对必要的，而且在数字素养和机构能力建设方面存在巨大差距”（参与者\
  \ 6）。每个人都需要接受教育，认识到技术会产生影响，并且这种影响需要被识别并相应管理。\n\n### 结论\n\n\n\n\n\n本项小型焦点小组研究得出的发现为关于迈向包容性人工智能的学术研究做出了重要的理论贡献。它通过提出三个实施差距来实现这一点：参与差距、转化差距和对话差距。这些差距帮助学者们框定公司在组织内部实施包容性人工智能时面临的挑战。我们的研究可以帮助从业者框定他们自身的挑战，提示他们如何开始缩小这些差距。良好的包容性组织实践造就良好的包容性人工智能。我们建议公司建立并支持多元包容的团队，与广泛多元的利益相关者群体进行协作合作，并与其他公司分享最佳实践。\n\
