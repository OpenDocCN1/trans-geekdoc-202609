  \ (原作出版于 1958 年)。\n\n## 14 高等教育中的人工智能机遇、问题与挑战\n\nBruno Poellhuber, Normand Roy,\
  \ 和 Alexandre Lepage\n\nUniversité de Montréal, Montréal, Québec, Canada\n\nDOI:\
  \ [10.1201/9781003320791-17](https://dx.doi.org/10.1201/9781003320791-17)\n\n自 2022\
  \ 年 11 月以来，ChatGPT 在高等教育中获得了极高的关注度，引发了大量令人印象深刻的辩论和讨论。这些对话既聚焦于此类强大人工智能工具所带来的各种风险和问题，也关注它们为帮助、促进甚至增强学习者和教师的工作所提供的多样化可能性。对于许多人来说，ChatGPT\
  \ 代表了人工智能在教育领域的一次爆发。然而，这种突然的媒体关注掩盖了这样一个事实：人工智能早已在高等教育中存在多年。学习分析领域在教育中显著增长，基于学习者在数字环境中留下的痕迹进行描述性或预测性分析，并催生了预测性辍学模型和仪表盘，已在一些大学中实施（Ifenthaler\
  \ & Yau, 2020）。大型云服务提供商的技术发展使得积累数据用于分析（数据挖掘）或开发可用于支持学生的智能对话代理（聊天机器人）变得更加容易（Heryandi,\
  \ 2020）。教育中的人工智能（AIED）领域专注于学习分析、对话机器人和自然语言处理、自适应学习、语音和视觉识别、专家系统以及决策支持系统。现在它也涵盖了生成式人工智能。\n\
  \n在本章中，我们首先提出将 AIED 领域置于历史背景中，然后审视在高等教育中具有相当潜力的三个领域：学习分析、自适应学习和生成式人工智能。我们将详细研究这些领域的每一个，并讨论它们如何用于提升教育体验，以及与之相关的局限性和挑战。\n\
  \n### 教育中人工智能（AIED）的背景\n\nAIED 的研究始于 1970 年代（Southgate, 2020），其重点是开发能够个性化学习体验的系统，个性化被视为\
  \ AIED 的圣杯。实现个性化的方式随着人工智能领域的技术进步而演变。同样，对个性化复杂性的期望也不断提高。教育中的首批人工智能系统（例如，Carbonell,\
  \ 1970）是智能辅导系统，旨在获取局限于特定学科、非常具体的主题或学习特定程序的知识， heavily 依赖于程序化教学和结构化的方法来教授层级知识。交互是单向的，学习者完成计算机提出的练习或问题系列，而问题会根据学习者犯的错误以及在呈现下一级内容之前需要掌握的学习内容进行调节。AIED\
  \ 领域与教育技术的区别在于系统能够做出教学决策，从而可以为不同学习者提供不同的练习，或不同的练习顺序，或要求他们以适应其水平的 manner 呈现待学习的概念（Wenger,\
  \ 1986）。这些早期系统与今天正在开发的相比可能显得简单，但个性化的意图仍然是核心，现在基于更大、更准确的数据集，以及更好的学习者模型和更正式化的知识领域。应用也多样化，不仅为学习者提供智能辅导系统，还针对教师支持，这得益于支持学生的信息增加以及使用大数据来指导教学实践的决策。为了反映这一进步，近年来提出了几种\
  \ AIED 的更新定义。根据 Holmes et al. (2019)，AIED 的定义涵盖了从人工智能领域技术在教育许多方面的实际使用和应用：\n\n> AIED\
  \ 包括从人工智能驱动的、分步的个性化教学和对话系统，到人工智能支持的探索性学习、学生写作分析、游戏化环境中的智能代理以及学生支持聊天机器人，再到人工智能促进的学生/导师匹配，使学生牢牢掌控自己的学习。它还包括学生一对一与计算机互动、全校性方法、学生在课堂外使用手机，以及更多内容。此外，AIED\
  \ 还可以为学习和教育实践提供启示。\n\n> （第 11 页）\n\nHumble and Mozelius (2019) 强调了 AIED 的跨学科性质及其不仅支持某些教育用途，还能加深我们对人类学习过程理解的潜力：“AIED\
  \ 作为人工智能，是一个跨学科领域，包含心理学、语言学、神经科学、教育学、人类学和社会学，其目标是成为教育的有力工具，并提供对学习如何发生的更深入理解。”对于\
  \ Hwang et al. (2020, p.1)，人工智能可以扮演四种角色：教授的导师、被教授的导师、协助学习的工具，或协助教育实践发展的工具。实际上，这些用途通常是结合使用的。因此，与教育中的技术一样，AIED\
  \ 的发展同时涉及研究和教学举措。例如，学习管理系统（LMS）中收集的数据既可用于帮助我们理解某些现象，也可指示如何在日常课堂或远程教学中采取行动。\n\n###\
  \ 人工智能支持高等教育教学与学习的 affordances 和机遇\n\n#### 案例 1. 学习分析与学生仪表盘\n\n学习分析（LAK）可能是 AIED\
  \ 中工作量最多的领域。教学和学习越来越多地通过学习管理系统（LMS）如 Moodle 进行。LMS 不仅允许教师整合不同类型的教育资源（文件、HTML 页面、超链接等），还可创建学习活动（形成性或总结性评估、论坛或协作文档中的交流或协作活动等）。得益于从学生活动收集的痕迹（鼠标点击、查阅资源、连接时间、发送消息、提交测验等），教师可以追踪学生参与度。许多人认为痕迹是行为甚至认知参与的指标（Poellhuber\
  \ et al., 2019）。这就是 LAK 的目标，即利用有关学习者在 LMS 中活动的收集数据来理解和改进学习、学习过程或学习环境。\n\n\n\n\n\n\
  该领域的工作主要集中在四个主题上：性能预测、为教师和学习者提供决策支持、行为模式检测和学习者建模，以及辍学预测（Du et al., 2021）。因此，LAK\
  \ 被用于预测性分析（Alhadad et al., 2015），包括识别有辍学或不及格风险的学生，并为他们及其教师提供仪表板以支持其自我调节和辅导（Peraya,\
  \ 2019）。在 Du et al. (2021) 识别的研究中，只有少数研究关注辍学预测（901 项中的 19 项），其总体思路是实施早期检测和干预。大多数研究侧重于概念验证（29.4%）或与\
  \ LAK 相关的概念或框架（33.3%）。少数论文（35.2%）专注于进行实际数据分析；这些通常与单一课程或 MOOC 相关，只有少数值得注意的例外。\n\n\
  首批举措是在普渡大学进行的，在那里，使用 Blackboard LMS 构建的 Course Signals 系统被开发出来，旨在利用预测模型引导有风险的学生获得适当的帮助资源（Arnold\
  \ & Pistilli, 2012）。作者报告，与其他有风险的学生相比，使用 Course Signal 课程的有风险学生的保留率显著提高。作为开放学术分析计划的一部分，基于\
  \ Sakai 环境以及学生记录中的其他信息开发的预测模型已在马里斯特学院和另外四所机构中使用。该举措也被证明相当成功（Jayaprakashe et al.,\
  \ 2014）。被识别为有风险并接受干预的学生在课程中的表现优于其他有风险的学生。\n\n总之，预测分析和仪表板开发方面的工作很多，研究结果显示学生参与度和保留率似乎为积极。在文献的系统综述中，Ifenthaler\
  \ and Yau (2020) 指出，有许多 LAK 方法使用有效技术来支持有辍学风险学生的成功和保留，但仍缺乏大规模、严格的研究来检验 LAK 对学生成功的效果以及可能推动采用和使用的特征，特别是从我们的角度来看，在\
  \ Moodle 环境中。\n\n仪表板的采用似乎仍然存在问题，并且在大多数项目中，明确链接到建议的操作（针对学生）或干预措施（针对教师）仍然缺失（Gasevic\
  \ et al., 2019）。为了开发可靠的仪表板，需要大量历史数据时间，以及来自学生记录的数据。尽管这些项目通常旨在支持学生参与和成功，但会产生一系列伦理风险。最常见的担忧与个人数据的使用及其保密性有关。学生或教师的个人数据可能会被披露或被滥用。由于预测模型本质上是不完美的，因此在管理干预时必须谨慎处理假阳性（被错误识别为有风险的学生），同时力求最小化假阴性（未被识别出的有风险学生）。此外，使用有效学习策略但点击次数不多的学生可能会被模型错误识别为有风险（例如，下载或打印大量资源的学生）。LAK\
  \ 可能会无意中促进对学习的偏见评估，一些教师倾向于惩罚而非帮助有风险的学生。其他风险与 `Hawthorne effect` 相关，即教师对学生的负面看法或学习者对自己的看法会成为自我实现的预言。最后，虽然与其他学生的比较可能对一些学习者起到驱动作用，但对其他人来说可能是令人气馁的。\n\
  \n然而，一些其他 LAK 前景似乎很有希望。更具描述性的分析可以更好地理解学习者如何参与课程，并可应用于课程设计。通过 LAK 收集的数据可以作为教师课程设计的反馈，特别是当教师更改其设计以提高参与度或学习时。后一种可能性似乎特别有希望，如果该过程始于一个课程设计阶段，该阶段调动了对主动学习活动的健全组织，依靠协作、讨论、调查、练习和制作，理想情况下提供大量形成性反馈的机会。这种类型的课程设计将产生丰富的痕迹，可以进行分析以在积极的反馈循环中改进课程设计。\n\
  \n### Case No. 2. Adaptive learning\n\n想象一下，作为心理学课程的一部分，你必须学习如何使用认知行为方法对患者进行咨询。为了学习这种方法，你受邀花费几个小时使用一个交互式工具，该工具交替呈现视频演示、迷你案例场景和理解问题。随着你在界面中的进展，向你展示的视频会根据你对该方法的知识水平进行调整，并且对不同学习者有所不同。根据你给出的答案、你花费在复习或阅读内容上的时间、你表现出的参与程度、你对内容呈现格式的偏好表达，以及你是否掌握了该方法的基本原理，你所提供的活动会持续调整。你的理解错误会被准确识别，并会为你提出专门针对这些错误的资源。此外，系统通过呈现案例的不同方面并提出不同的问题来验证你是否理解了该方法的基本原理，其中包含的细微差别使你能够识别可能遗漏的细节。这就是自适应学习的一个例子，自\
  \ 1980 年代以来这一直是一个活跃的研究领域（例如，Wenger, 1986）。\n\n自适应学习可以被视为“构建每个个别学生的目标、偏好和知识模型，并在与学生的互动过程中使用该模型以适应该学生的需求”（Brusilovsky\
  \ & Peylo, 2003，第 156 页）。为了实现这种建模，教程系统传统上依赖于三个持续更新的模型：学习者的模型和知识状态、知识领域模型，以及教学模型，后者负责选择呈现知识或调整难度水平的策略。在互动中，这三个模型允许自动化决策，以确保学习者的知识模型尽可能接近预期的知识模型（Figure\
  \ 14.1）。\n\n![Figure 14.1 Adaptive learning model.](img/fig14_1_B.jpg)\n\nFigure\
  \ 14.1 Adaptive learning model.\n\nAI 能否比教师更好地传授知识？有时可以。只要学习者模型足够复杂，AI 就可以更快、更个性化地做到这一点（Kay\
  \ et al., 2022）。教师缺乏时间在大规模上进行这种适应工作，而在这种情况下，教学有时会提供给数百人的群体。\n\n\n\n\n\n这引发了关于高等教育目的的疑问。当目标是以机械、快速、高效的方式传递知识时，自适应学习可以非常有效。技术进步甚至可能允许对某些专家（条件性）知识给予更大程度的考虑，超越理论（陈述性）或实践（程序性）知识。对于旨在与同伴社交、研究社交、核心价值观的分享、发展社会情感能力、针对某个问题或建议文本进行批判的情况，AI\
  \ 生成工具会从其数据库中提出最可能的答案，或生成最符合所表达想法的图像。这可能会如何影响学习和高等教育？大量讨论已致力于抄袭问题，但使用 ChatGPT 的积极可能性也被勾勒出来：作为智能导师（Pardos\
  \ & Bhandari, 2023），用于自适应学习（Qadir, 2022），作为笔记助手（Saini et al., 2023），或作为写作助手（Salvagano\
  \ et al., 2023），更不用说协助各种艺术创作的可能性（歌曲、诗歌、故事等）。\n\n在以人为中心的方法中，生成式 AI 可以充当一种个性化导师，随时回答学习者的问题并建议修改或丰富想法的方式，从而体现出一种自适应学习的形式；或者它可以从“智能增强”的角度使用，“旨在与人协作并专注于构建系统，利用\
  \ AI 增强和支持人类认知”，（Hassani et al., 2020），如 图 14.2 所示，用于 AI 辅助的研究和写作流程（图 14.2）。最近，生成式\
  \ AI 已能够模拟更自然的“人类”对话，用日常语言回答提出的问题。这使得答案看起来更准确、更合理。生成式 AI 的快速采用正是由这种有用且高效的感觉所解释的（Gatzioufa\
  \ & Saprikis, 2022），这与传统的技术采纳模型一致，其中易用性和感知有用性是使用的主要决定因素。\n\n![Figure 14.2 Example\
  \ of workflow proposition for a human-centered approach for scientific writing with\
  \ various AI tools.](img/fig14_2_B.jpg)\n\n图 14.2 人为中心方法下利用多种 AI 工具进行科学写作的工作流程建议示例。\n\
  \n然而，ChatGPT 和其他生成式 AI 工具不应被视为可靠的，因为它们无法区分真假信息，更糟糕的是，它们可以字面地提出捏造的答案，甚至编造虚假的参考文献。它们的优势在于能够有效地综合现有信息或重新表述信息，以帮助总结思想或以不同风格呈现。因此，只要它们由经过验证且可验证的数据提供，产生的文本质量可以很好。然而，ChatGPT\
  \ 并非完全如此，它以 2021 年之前在互联网上找到的内容为食，这部分作品在许多方面存在偏见，且许多主题曾受到大规模的虚假信息宣传。\n\n对于学生而言，ChatGPT\
  \ 通过帮助他们撰写各种文本，例如计算机代码，提供了有趣的途径。对于教师而言，ChatGPT 和生成式 AI 也可以充当自适应助手，帮助进行课程规划、制定学习目标、综合思想，或为学生启发复杂的练习（Sok\
  \ & Heng, 2023）。其中最有趣的方面之一是利用生成式 AI 来丰富和个性化对学习者在多项选择测验中或书面作业开发阶段所提供的反馈，因为反馈已被确定为一种非常有效的教学干预，而教师在形成性评估中缺乏提供反馈的时间。\n\
  \n\n\n\n\n尽管如此，生成式人工智能工具对复杂主题的“理解”能力有限。`ChatGPT` 无法充分应用逻辑推理的步骤，并在许多复杂主题上停留在非常肤浅的水平。对于生成式人工智能要发挥作用，人类发挥着关键作用：他们必须能够制定正确的提示序列并逐步调整，以达到既定目标。这不仅需要对\
  \ `ChatGPT` 的工作原理有所了解，还需要深厚的领域专业知识来判断所提出的建议。像校对软件或 YouTube 教程一样，生成式人工智能可以帮助构建学习者的知识，但像\
  \ `pharmakon` 一样，它也可能使他们变得懒惰或助长抄袭。\n\n生成式人工智能有潜力减少某些类型的人际互动（回答与 `Bloom’s taxonomy`\
  \ 基础层级相关的问题），但它也可能为课堂讨论中的更高层级腾出空间，这更符合高等教育的目标，而不仅仅是知识传授。这让我们相信，这些工具可以在高等教育课程中变得越来越重要，但前提是学生接受过对其、其局限性和其偏见的理解训练。对于\
  \ Sejnowski (2023) 来说，这些工具反映了使用者，因此，如果没有适当的训练，像聊天机器人这样的工具可能会提供幼稚或不充分的答案。例如，像 `ChatGPT`\
  \ 这样的工具可能会建议用奶油、蘑菇、大蒜和“牛蛋”制作的蘑菇炒鸡蛋。\n\n要使 `ChatGPT` 或任何其他聊天机器人成为真正以人为中心的生成式人工智能，能够支持教学或学习，用户必须了解其语料库特征以及导致其答案生成的算法。工具答案的不完美性质应鼓励一种以培养批判性技能和质疑与对抗生成式人工智能提出的思想为导向的工作流程，从而最终实现对其“讨论”的概念的真正内化。\n\
  \n### 讨论与结论\n\n在本章中，我们介绍了在高等教育中动员人工智能的三种案例——学习分析、自适应学习和生成式人工智能——并审视了它们的整体贡献和局限性。我们讨论了一些与使用这些人工智能工具相关的各种风险，并指出，尽管它们具有极大的潜力来协助教师和学习者，我们必须对这些风险保持谨慎。\n\
  \n人工智能最终能够取代教师吗？我们以人为中心的方法给出了明确的“否”。。我们只需阅读罗杰斯、班杜拉和杜威，或甚至维果茨基的著作，就能理解人类和社会互动对学习的重要性（Kolb,\
  \ 2014）。然而，教师的角色肯定会被质疑和转变，并且在某些情况下——在以知识传授为重点的课程中或在进步甚微的领域——教师的角色可能会受到威胁。\n\n深度伪造的出现涉及使用人工智能操纵真实人物的声音和/或视频于捏造的场景或讨论中，这使得虚假信息成为与人工智能相关的突出风险。这具有重大的政治和经济影响。抄袭、个人信息隐私、偏见、缺乏透明度和依赖性是一些其他被广泛引用的风险，必须在以人为中心的人工智能方法中加以解决。另一个值得注意的担忧是人际互动的潜在下降，尤其是在教育中。\n\
  \n将人工智能作为伙伴纳入某些涉及人类参与和在不同阶段对人工智能输出进行批判性评估的教育过程中，是抵消其中一些风险的方式之一。另一种方式也对真正以人为中心的人工智能提出了挑战，即人工智能素养或使用者对人工智能的总体理解。魁北克数字能力框架的第\
  \ 2 维度（即开发和动员技术技能）涉及 *发展对人工智能及其对教育、社会、文化或政治影响的整体理解*，这种视角呼吁哲学、法律、政治科学等。为此，人工智能的整体运作不仅应在计算机或数据科学中教授，还应在所有学科中教授，以便涵盖不同的可能用途。每位教师都应熟悉教育中使用人工智能，否则他们可能无法正确使用这些工具或理解与之相关的风险（Wilton\
  \ et al., 2022）。最终，我们认为人工智能素养不仅是教育机会，也是教师、学生、教育顾问、教育管理人员和政策制定者理解人工智能如何运作、其可能性及其在各自学科领域的局限性的必要条件。人工智能素养也将使这些行为者能够参与对其社会、伦理、法律和经济影响的讨论，以便对其进行相关、深思熟虑和合乎道德的使用。\n\
  \n最后，生成式人工智能似乎有能力改变多种基本技能的发展（信息技能、方法技能、写作技能等）。生成式人工智能不应被动员来取代学习者或教师的任务，而应被视为协助教学和学习的工具。此外，随着目前正在出现的各种专业人工智能工具，特别是文献研究和文献计量分析领域，我们可以将其想象成一套工具，未来可能协助教师和学生，更符合增强智能而非人工智能。对这些工具、其运作方式、其局限性和其偏见的充分了解，将对相关和合乎道德的以人为中心的使用至关重要。\n\
  \n高等教育中还存在其他与人工智能相关的问题：学术管理系统（Wang, 2021）、抄袭检测（Khalil & Er, 2023）、招聘（Allal-Chérif\
  \ et al., 2021）等。从以人为中心的视角来看，在做出技术实施决策之前，高等教育机构需要考虑不同决策对相关人员（学生、教师、教务长等）的 implications。漂移和偏见的风险已被充分记录且普遍存在（Collin\
  \ & Marceau, 2023），机构不能忽视它们。\n\n与此同时，必须采取措施确保关于用途、算法和所用数据库的最大程度的透明度。至于研究，它必须通过确保其采用的方法包括主要相关者来审视各种系统。让这些行为者更多地参与设计过程和与其相关的研究不仅促进了真正以人为中心的人工智能的整合，也促进了真正人工智能素养的发展。对于其余行为者，必须建立培训和资源来普及人工智能——有些作者称之为可解释人工智能（Khosravi\
  \ et al., 2022）。只有当所有这些条件得到满足时，我们才会看到高等教育中合乎道德、相关且可持续的变革。\n\n### 参考文献\n\n* Alhadad,\
