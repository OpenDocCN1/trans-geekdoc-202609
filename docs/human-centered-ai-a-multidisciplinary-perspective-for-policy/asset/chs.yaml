  \ Rao\n\nPwC, Greater Boston, MA, USA\n\nDOI: [10.1201/9781003320791-10](https://dx.doi.org/10.1201/9781003320791-10)\n\
  \n**What, in your opinion, is human-centered AI and what is its potential, its importance?**\n\
  \nWhen I first encountered the term, I thought, “That’s a bit odd … If you go back\
  \ to the beginning of AI, it has always been about understanding human intelligence\
  \ and mimicking it—scholars like Roger Schank, in the ′70s and ′80s were very influenced\
  \ by psychology.” So, at first, the idea of human-centered AI felt anachronistic\
  \ to me. But then, as I thought about it, I realized that AI isn’t as closely related\
  \ to psychology as it used to be. So, I felt that calling into question the lack\
  \ of interaction between humans and AI could make a lot of sense. And when I started\
  \ reading more about value alignment, especially what Stuart Russell wrote about\
  \ that, it made even more sense to focus on a human-centric approach to AI—to reflect\
  \ on common values we share as humans and think about how to implement them in AI.\
  \ So I went from “human-centered AI is odd …” to “Yes, I understand now what human-centered\
  \ AI means, and I get its appeal.”\n\nHowever, one thing that still bothers me with\
  \ the idea of human-centered AI is that it elevates humans as the highest form of\
  \ the ecosystem that we have. I come from an Eastern tradition. In the Indian philosophical\
  \ tradition, life pervades everything and consciousness and sentience pervade everything:\
  \ animals, objects, and even rocks. So, I worry that human-centered AI will focus\
  \ on human benefits to the detriment of other things, both animate and inanimate.\
  \ I think human-centered AI is too narrow. AI should really be for everything.\n\
  \n**What would be the right label to use to capture the wider ecosystem?**\n\nMaybe\
  \ we should be talking about something like human-led AI for the benefit of everything?\
  \ Or human-enabled AI for the good of all? Or AI for all? But “for all” could be\
  \ interpreted as including only people, so “AI for everything” is probably better.\
  \ You know the Gaia concept? AI should be for the whole planet—human-led, of course,\
  \ but not only centered on human needs.\n\n**Maybe we can dive into the articles\
  \ you’ve read to see how they’ve changed some of your views on AI and your ideas\
  \ about the challenges we’re facing. What article did you read?**\n\nI read “The\
  \ Moral Landscape of General-Purpose Large Language Model” by Pistilli; “Privacy\
  \ in the Era of AI” by Malone; and “Towards Addressing Inequality and Social Exclusion\
  \ by Algorithms: Human-Centric AI through the Lens of Ubuntu” by Wójcik.\n\n**What\
  \ did you make of them?**\n\nI liked the first one on general-purpose AI. It was\
  \ very interesting. Pistilli highlights three issues with large language models,\
  \ and I agree with most of what she says, but I’d like to focus on one fundamental\
  \ question she raises: “What is the ultimate goal of large language models? What\
  \ is the purpose of artificial general intelligence (AGI)?”\n\nHer point, I think,\
  \ is that in order for AI ethics to be truly effective, AGI should be defined—and\
  \ should be defined in such a way that makes it possible for us to evaluate its\
  \ capabilities. But the thing is that defining AGI is a challenge. When you come\
  \ up with a definition, there’s inevitably something that has been left out. So\
  \ the risk is that you end up in an endless circle of defining and redefining what\
  \ exactly AGI is.\n\nJust look at history. The term “AI” was first coined to describe\
  \ AGI. Simon, Shaw, and Newell’s “General Problem Solver,” for instance, was meant\
  \ to be AGI. They were saying, “Hey, we need a general problem solver. How do we\
  \ do that?” But the task was too difficult, so people started focusing on more specific\
  \ tasks: planning, reasoning, learning, etc. And then, after a while, people like\
  \ John Searle came and said, “Oh no! That’s narrow AI. We should be thinking about\
  \ AGI.” And we’ve been going back and forth between narrow AI and AGI ever since.\n\
  \nI think it might be because there’s an inherent tension between defining AGI and\
  \ evaluating AGI. If you want to evaluate AGI, you might come up with a definition\
  \ that is very narrow so that your evaluation goes well. But then, you’ll come back\
  \ and say: “Of course, it’s not general intelligence … We are just testing one of\
  \ these things, right?” That’s how progress is made in AI: we give ourselves a particular\
  \ goal, and once it’s achieved, we move the goalpost a little further and say, “That\
  \ was easy, that’s not AGI, now try to do this.”\n\nThink of the way we’re assessing\
  \ ChatGPT’s creativity. AGI would need to be creative, but what does it mean for\
  \ an AI to be creative? And who’s deciding what’s creative? Humans, of course. So,\
  \ right now, AI is coming up with new things, and humans are saying, “Hey, I don’t\
  \ think that’s creative. It’s not mimicking my intelligence. It’s not doing it the\
  \ way I do things.” But on the other hand, if AI comes up with something that we\
  \ have not done—which in AI’s sense might be creative, as it produces something\
  \ that wasn’t in the training data—then we say, “No, that’s not creative either,\
  \ it’s not AI because it’s not mimicking what I do.”\n\n\n\n\n\nAnd that’s just\
  \ for creativity—that is a subset of intelligence! So, will we ever agree on a definition\
  \ of AGI? Probably not, and that’s where it gets tricky. AI systems are more “general\
  \ purpose” than ever before. At what point do we stop calling something narrow intelligence\
  \ and start calling it general intelligence? Since I don’t think we’ll get to any\
  \ agreeable answer among all of us, from the philosophers and linguists to the AI\
  \ scientists, I think that’s going to be a problem. That said, Pistilli’s paper\
  \ was very good, and I agree with her other points.\n\n### The other two articles\
  \ you read deal with questions like privacy and the risk of social exclusion\n\n\
  I was keen on Wójcik’s paper. She discusses something I made a point of talking\
  \ about in a couple of responsible AI forums. Responsible AI principles are very\
  \ much based on a libertarian view of what human values are. The example I generally\
  \ use to illustrate the difference is that of individual liberty vs. social good.\
  \ Western society essentially elevates individual liberty to a very, very high level,\
  \ whereas it associates the promotion of social good with totalitarianism. For example,\
  \ Western countries look at China and say, “That’s such a totalitarian regime, everyone\
  \ has to give their information.” Okay, but let’s leave China alone for a minute.\
  \ Let’s take India, Korea, or Japan, where I think many people consider the common\
  \ good is as important or even more important than individual liberties. What do\
  \ we make of their view? Why should AI support human individual liberty instead\
  \ of the common good?\nI remember reading a South-East Asian author on this, someone\
  \ who was writing with Buddhist philosophy in mind. But I was not at all aware of\
  \ the African contribution to this important debate. The notion behind Ubuntu—the\
  \ idea that identity is about relations between different people, that who you are\
  \ and what you do is defined by a complex web of interactions—is important and should\
  \ be taken into consideration in the whole responsible AI world, which I think has\
  \ embraced the Western view much too tightly. Allowing for alternative values would\
  \ be very welcome. Maybe we want to come up with some basic human values that everyone\
  \ should be able to agree on and then allow for variations between cultures. But\
  \ as of now, I don’t think anyone has drawn such a straight line, and I don’t envy\
  \ anyone who is supposed to get any agreement on that minimal threshold.\n\n###\
  \ What about Malone’s article on privacy?\n\nIt was very good. I learned a lot about\
  \ the origins of the notions of individual liberty and privacy, the fact that they\
  \ go back as far as 1604, but what I really liked in this paper is the section about\
  \ the future, in which Malone presents what he calls a cybernetic view of privacy.\
  \ According to this vision, it’s what AI does that is going to define how we think\
  \ about privacy, and it’s the way we think about privacy that determines what AI\
  \ will be doing.\nI like this idea of a constant flow of information going back\
  \ and forth between AI and humans. I think it’s the most fruitful way forward for\
  \ us to understand AI. That’s why I prefer talking about augmented intelligence\
  \ instead of artificial intelligence. I don’t think we should be focusing on whether\
  \ AI will be replacing workers or not. Yes, AI will be able to perform some tasks\
  \ better than humans. But can we find ways for AI to increase human capabilities\
  \ instead of trying to replace humans? Malone touches on the idea of AI as “extensions”\
  \ of humans at the end of his paper. That’s something we’re interested in at my\
  \ firm, “How can we raise the performance of the human-AI combo?”\nIn the business\
  \ world, we often talk about change management, but in order to raise the performance\
  \ of the human–AI combo, I think we should focus on trust management.\nI was introduced\
  \ to this idea of managing people’s trust in AI when I worked on developing an air\
  \ traffic management system for the Sydney Airport. We could prove that our algorithm\
  \ was coming up with the optimal solution to land all aircraft effectively. But\
  \ traffic controllers were managing airplanes heuristically. And even though we\
  \ would have been able to prove that our algorithm was more effective than their\
  \ heuristics, they would not have accepted it.\nSo, we didn’t force the system onto\
  \ them. What we did instead was provide them with multiple options: they could choose\
  \ the optimal option or choose the heuristic option. When we first rolled out the\
  \ system, controllers always used the heuristic option, but they were provided with\
  \ additional information like, “That’s great, you landed all of the aircraft, but,\
  \ by the way, had you chosen this route instead, you would have saved them X gallons\
  \ of fuel and Y minutes.” Over time, controllers started trying the AI option once\
  \ in a while. They’d say, “Why don’t I try that tool just for that one aircraft?\
  \ I’ll do everything else as usual.” And slowly, they gained confidence in our algorithm.\
  \ That’s what I mean by trust management.\nSince Malone argues that the adoption\
  \ of technology shapes the way we envision the notion of privacy, I think this idea\
  \ of trust management is somewhat related to his cybernetic view of privacy.\n\n\
  ### If you had one or two recommendations for policymakers, what would they be?\
  \ What would you do to increase this trust that you are talking about, or to achieve\
  \ any objectives that you consider crucial?\n\nFirst, I think there needs to be\
  \ a real conversation involving all stakeholders concerned with AI policy: governments,\
  \ large companies developing and promoting the technology, citizen groups, and academics.\
  \ Each of them has a different mindset: citizen groups are looking at social justice;\
  \ academics are thinking about what technology can do from a theoretical standpoint,\
  \ or about the philosophical issues stemming from new AI developments; policymakers\
  \ are saying, “Tell me what to do to make sure my people are protected”; and then,\
  \ corporations, of course, are interested in making money out of AI.\nSo how do\
  \ you reconcile all of these interests? I think that’s the biggest challenge. Everyone\
  \ has different incentives. Most academics, for instance, are interested in solving\
  \ academic issues, and they’re not necessarily paying close attention to social\
  \ or corporate issues. Whereas businesspeople, for their part, don’t care all that\
  \ much about what academics have to say. They want something practical that they\
  \ can do tomorrow—which is unfortunate given that they could learn so much from\
  \ what academics have thought through, they could avoid a lot of mistakes. So bringing\
  \ together all of these stakeholders is one thing policymakers should do.\nMy second\
  \ recommendation would be about sandboxes. I know that the UK, the European Union,\
  \ and various countries have tried implementing them. But for sandboxes to be truly\
  \ effective, there are a couple of pillars that need to be put in place. In particular,\
  \ we have to think about amnesty for what was done in the past. The reason why some\
  \ firms are hesitant to get involved in sandboxes is they feel regulators might\
  \ be gathering information about them. They think, “I’m doing these things, if I\
  \ tell them what I’m actually doing, they’re going to come back later and say, ‘Your\
  \ underwriting algorithm was biased’ and I might face sanctions.” So there needs\
  \ to be some amnesty for those involved in regulatory sandboxes.\nAnother thing\
  \ is that it’s not always possible for us to understand the full social implications\
  \ of regulations before rolling them out, so sandboxes should serve as parallel\
  \ runs to test things out. This has been done with a financial regulation called\
  \ Basel II.\n\n\n\n\n\n在四到五年的时间里，对新框架进行了定量影响研究。机构被要求并行进行两套计算：他们会用旧方法进行计算，同时也会按照一套新规则进行计算。只有在经历了四次迭代之后——只有在完成定量影响研究\
  \ #1、#2、#3 和 #4 之后——巴塞尔 II 监管才正式出台。这一过程让监管机构得以理顺许多细微差别：抵押贷款是这样运作的，信用卡是那样运作的，对小国不能那样做，对大国也不能那样做，等等。\n\
  \n这对公司来说是额外负担，因为要做两次计算，但仍然……我认为对 AI 这样做是个好主意。以有限的人群并行测试法规，然后再推广，是监管机构应该认真考虑的事情。这在建立人们的信任方面可能产生重大差异。\n\
  \n## 9 Benjamin Prud’homme’s Commentary\n\nBenjamin Prud’homme\n\nMila—Québec Artificial\
  \ Intelligence Institute, Montréal, Québec, Canada\n\nDOI: [10.1201/9781003320791-11](https://dx.doi.org/10.1201/9781003320791-11)\n\
  \n* **Please tell us more about your work**.\n\nMila—Québec Artificial Intelligence\
