  \n## 26 利用包容性人工智能促进组织发展的三大实施差距\n\nClementine Collett\n\n牛津互联网研究所，牛津大学，牛津，英国\n\n\
  Gina Neff\n\nMinderoo 技术与民主中心，剑桥大学，剑桥，英国\n\nMaria Axente\n\n剑桥大学，牛津，英国\n\nDOI: [10.1201/9781003320791-30](https://dx.doi.org/10.1201/9781003320791-30)\n\
  \n### 包容性人工智能\n\n如今，企业认为在许多流程中使用人工智能系统和工具具有商业上的必要性。这包括例如招聘、人才管理、决策支持系统、数据分析、预测分析或客户互动（Black\
  \ & van Esch，2020，2021；Desouza et al., 2020）。人们认为人工智能系统既能降低运营成本，又能帮助企业提高效率和价值（Desouza\
  \ et al., 2020；Forman et al., 2020；Reynolds, 2021；Seiler, 2021），但它们也带来实施挑战，尤其是对于那些希望确保其系统公平且不延续性别和种族歧视的公司而言。这一直是学术研究的重点，研究强调人工智能能够性别错认（Keyes,\
  \ 2018），进行压迫（Browne, 2015；Noble, 2018；Woods, 2018），造成排斥（Buolamwini & Gebru, 2018），并进行刻板印象化（Kay\
  \ et al., 2015）。\n\n另一方面，关于如何在组织中定义“包容性”尚无广泛共识（Podsiadlowski, 2014）。一些学者探讨了权力与归属感等动态对组织包容性的重要性（Bryer,\
  \ 2020；Syed & Özbilgin, 2009），另一些学者则强调了包容性的情境依赖性（Dobusch, 2014；Podsiadlowski, 2014）。但最一致的是，组织包容性与员工的实际多样性以及组织如何让这种多样性在机会、互动、沟通、尊重和理解方面发挥潜力相关联（Dobusch,\
  \ 2014；Podsiadlowski, 2014；Thompson, 2017；Woods, 2002）。此外，几乎没有学术工作旨在将组织内的包容性工作与人工智能包容性的含义结合起来。\n\
  \n当我们谈论包容性人工智能时，应考虑包容性组织。我们所定义的包容性人工智能致力于实现包容性组织的目标：它应鼓励员工多样性并拥抱差异，以帮助员工队伍实现其潜力，并相互之间保持觉知、沟通、尊重、协作和理解。\n\
  \n在本章中，我们使用了妇女经济与社会论坛在其“包容性人工智能行动工具包”中包含的包容性人工智能定义，该定义概括了包容性组织的客观和愿景：“包容性人工智能解决偏见和歧视问题，旨在减少不平等，包括代表性、可及性和可解释性。包容性人工智能在生产中不具歧视性，其后果无偏见，且人人可及”（WFES,\
  \ 2021，第 9 页）。\n\n包容性人工智能超越了单纯的技术进步；它将人类牢牢置于最前沿，强调考虑所有个体的福祉和赋权。另一方面，人本中心人工智能 HCAI\
  \ 根本上要求从算法中心视角转向人本中心视角，强调设计能够满足人类需求的人工智能系统的重要性。HCAI 和包容性人工智能的目标本质上是一致的，携手合作创造服务并提升社会的\
  \ AI 驱动未来。因此，确保包容性人工智能在 HCAI 讨论中占据中心地位至关重要。通过优先考虑包容性，人工智能可以促进关怀、协作、可持续社区和环境修复（Shneiderman,\
  \ 2021）。\n\n为了在行业中包容性地推进人工智能技术的实施并促进人本中心人工智能 HCAI，至关重要的是要绘制并理解组织所面临的挑战。本章旨在全面概述这些挑战，并阐明实施中存在困难的具体要素。通过识别和解决这些障碍，企业可以为更具包容性和人本中心的人工智能方法铺平道路。\n\
  \n\n\n\n\n我们使用作者于 2020 年底进行的 3 次焦点小组访谈数据，访谈对象为 11 位高层 C-suite、首席数据或技术官以及 AI 战略领域的行业专家。通过对这些访谈记录的主题分析，我们识别出企业面临的三个实施差距：参与差距；转化差距；以及对话差距。这些差距出现在企业难以在组织内实施\
  \ AI 与包容性地实施 AI 之间进行导航时。\n\n通过“实施差距”这一视角来框定企业面临的挑战，是识别普遍存在却尚未解决的商业挑战的一种新颖方式（Fisher,\
  \ 2022），并且很好地反映了组织自身的经验。我们所识别的差距通常代表着缺乏支持、知识或协作，我们最终通过提出战略性解决方案来缩小这些实施差距，从而使 AI\
  \ 实施更具包容性。总体而言，我们认为实施包容性 AI 首先需要组织进行战略性转变，将包容性融入业务文化和实践的核心。\n\n### 背景\n\n许多公司感受到实施\
  \ AI 系统的商业激励。不仅如此，COVID-19 大流行最近促使更多公司实施这些技术；组织比以往任何时候都更需要战略性地思考其资源和业务决策以求生存（Forman\
  \ et al., 2020; Reynolds, 2021; Seiler, 2021）。\n\n但企业在实施 AI 系统时面临诸多挑战。研究表明，很少有公司具备\
  \ AI 大规模创造价值所需的基础构建模块（Chui & Malhotra, 2018）。例如，企业在实际和法律上可能难以利用新的数据分析工具（Tambe et\
  \ al., 2019），或可能不具备必要的技术能力或数据技能（EY, 2021; O’Reilly, 2021; Pan et al., 2021）。一些组织因缺乏准备、知识、指导或基础设施而最终根本未实施系统，而实施的组织可能也认为自己未能充分发挥这些系统的潜力。在\
  \ O’Reilly 针对来自各行各业的超过 3,000 名以某种方式从事 AI 工作的人进行的全球调查中发现，只有约四分之一（26%）的人会将他们的 AI 描述为“成熟”，即拥有产生收入的\
  \ AI 产品（O’Reilly, 2021）。\n\n在确实实施 AI 系统的公司中，员工可能并不完全了解如何使用它们，或者确实不愿使用它们。没有终端用户意愿而实施的\
  \ AI 不太可能为业务实践和产出增加价值或包容性（Makarius et al., 2020）。即使这些新的工作方式可以帮助组织降低成本并增加收入，终端用户往往抵制采用\
  \ AI 工具来指导决策，因为他们认为对自己没有多少益处；新工具可能需要额外的工作并带来自主性丧失的感知（Kellogg et al., 2022; 另见 WEF,\
  \ 2019）。\n\n实施 AI 系统显然存在实际障碍，组织正在努力克服这些障碍。更重要的是，企业难以包容、可持续、负责任地实施 AI 系统（IBM, 2022;\
  \ O’Reilly, 2021）。在本章中，我们探讨实施包容性 AI 的困境本质，并反思其可能克服的方式。\n\n### 研究过程\n\n本文使用的数据来自\
  \ 2020 年底与 11 位来自财富 500 强公司的 C-suite 高层和首席数据或技术官以及 AI 战略行业专家进行的 3 次在线焦点小组访谈。\n\n\
  所有参与者均担任管理、中层管理或开发职位，并对 AI 战略有监督权，包括在运营到 IT 等不同职能中利用 AI 的任何人，角色涵盖 C-Suite、数据科学家、建模师、专家和工程师。参与者来自金融服务、技术公司、石油和天然气、教育和法律等行业的组织。这些焦点小组在\
  \ Zoom 上举行，每次持续一小时，并被录音。在本研究中，所有参与者均匿名，仅以其参与者编号指代。\n\n焦点小组的目的是召集组织内的 AI 领导者，以探讨他们如何优先分配资源并实现包容性\
  \ AI 的开发和部署，以及他们如何阐述和实施包容性 AI 战略。虽然本章主要关注实施 AI 系统的公司，无论是内部还是外部来源和设计，但也涉及 AI 供应商公司在设计和开发\
  \ AI 系统时可能出现的实施差距。\n\n焦点小组由经济与社会妇女论坛通过其倡议 Women4AI Daring Circle 进行，并由 Gina Neff\
  \ 教授主持。Women4AI Daring Circle 由经济与社会妇女论坛设立，旨在汇聚合作伙伴生态系统并倡导使 AI 的设计和开发真正包容。其目标是鼓励各种类型和规模的组织采取切实行动，创造一个女性充分发挥\
  \ AI 潜力、AI 充分赋能女性的环境。\n\n对于主题分析，焦点小组的定性数据与关于组织实施 AI 挑战和包容性 AI 的广泛文献综述一起使用，以识别特定主题和模式（Braun\
  \ & Clarke, 2006; Lapadat, 2010）。\n\n在我们的方法中，我们呈现焦点小组讨论的结果，并在这些发现与该领域的现有学术著作之间建立对话。通过将参与者收集的见解和观点与已有的知识和研究相结合，我们旨在全面理解所面临的挑战。这种经验数据与学术文献的整合使我们能够对已识别的挑战提供细致而知情的分析，并以更广泛的背景和理论见解丰富讨论。\n\
  \n### 驾驭包容性 AI 的三个实施差距\n\n在本节中，我们讨论从焦点小组数据分析中浮现的三个在工作场所驾驭包容性 AI 的实施差距。\n\n#### 参与差距\n\
  \n参与差距指的是在 AI 系统中的偏见、歧视或包容性问题上有效调动领导者和员工参与的挑战。\n\n当然，有效地参与偏见和歧视问题需要企业首先参与这些问题。一些公司根本不参与偏见和歧视或包容性问题，因为他们可能担心参与这些话题会暴露其他问题。一位参与者说：\n\
  \n> 公司实际上认为他们不需要做很多，这在董事会层面、在最高层级是一种误解，而决策就在那里做出。所以，他们不一定认为自己在这方面有问题，所以在一些公司中这是一种缺乏意识的情况。\n\
  \n> \n> （参与者 8）\n\n\n\n\n\n> 虽然这可能是某些公司的有意识或策略性的无知，但在其他公司中，脱节往往并非有意为之。焦点小组的讨论表明，虽然一些公司有意参与偏见和歧视问题，并在其中实施包容性\
  \ AI，但他们不知道如何把握前方任务的复杂性并付诸行动。\n\n> \n> （参与者 5）\n\n迈向这一实施差距的第一步是就偏见和歧视的根本问题进行艰难的对话；提高意识，然后确定问题可能出现的地点以及如何出现。除了就\
  \ AI 中的偏见和歧视问题进行教育和对话外，公司还需要追求关于 AI 系统如何开发和实施的更大透明度和沟通。这将允许进行旨在改进以及危害识别和缓解的审查和对话。我们从文献中得知，可持续和包容的创新不仅需要用户、员工以及至关重要的领导层的倡议，还需要受这些技术影响的社区等利益相关者的参与（Ghassim\
  \ & Foss, 2020；Leslie, 2019；Plasschaert, 2019；Schiff et al., 2020；Stix, 2021）。\n\
  \n有效参与包容性 AI 的实施需要在组织内部拥有全面且可操作的包容性授权，同时承诺在产品开发的各个阶段优先考虑多样性和包容性，包括在管理结构中分配责任以及让相关利益相关者（领导层、供应商、监管机构、工会）积极参与，以解决\
  \ AI 系统中的偏见和歧视。\n\n研究表明，良好的治理结构对于影响企业绩效（Clark et al., 2014）、组织文化以及员工在工作场所的行为（Gottman\
  \ et al., 1998）至关重要。领导者整合和在团队内部建立联系的能力对于增强集体创新至关重要（Jiang & Chen, 2018）。\n\n不幸的是，有一些障碍阻碍了领导者参与偏见和歧视相关问题，从而阻碍了包容性\
  \ AI 的问题。首先，许多公司没有多元化的领导团队（Eagly & Fischer, 2009）。研究强调，女性和少数族裔/种族群体被认为符合成功领导角色表现刻板印象的可能性较低（Heilman,\
  \ 2012；Hoyt & Murphy, 2016；Lyness & Heilman, 2006；Wille et al., 2018），尤其是在科技行业（Bello\
  \ et al., 2021；UNESCO, 2019；Young et al., 2021）。这些因素可能导致多样性、偏见和歧视问题不太可能成为领导者关注的焦点（Leavy,\
  \ 2018，第 14 页）。然而，在过去几年中已经变得清楚，组织意识到如果要在可持续性和盈利能力方面保持下去，必须在所有层面上优先考虑多样性。\n\n参与包容性\
  \ AI 的另一个障碍是持续存在的优先考虑效率和利润而非负责任、可持续和包容创新的叙事。总体而言，伦理可能被视为实现这些目标的制约因素，因为它被视为准确性（模型的[content]\n\
  \n> 虽然这可能是某些公司的有意识或策略性的无知，但在其他公司中，脱节往往并非有意为之。焦点小组的讨论表明，虽然一些公司有意参与偏见和歧视问题，并在其中实施包容性\
