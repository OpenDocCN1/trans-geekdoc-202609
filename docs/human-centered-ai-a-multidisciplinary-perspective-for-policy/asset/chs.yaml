  \ 805–806.\n\n## 6 AI 时代未来的隐私\n\nMatt Malone\n\nThompson Rivers University, Kamloops,\
  \ British Columbia, Canada\n\nDOI: [`10.1201/9781003320791-8`](https://dx.doi.org/10.1201/9781003320791-8)\n\
  \n定义隐私是一项难以捉摸的任务（Hunt, 2015：161–162）。\n\n人工智能技术以两种重要方式挑战隐私。首先，存在同意差距。旨在赋予个人和群体权力的同意和知情机制正受到为人工智能系统提供燃料的、日益多样化和无处不在的数据收集方式的挑战。如今，个人很少能够完全理解其数据在何处、何时以及如何被收集，然后被人工智能系统使用。其次，存在知识差距。对大多数人工智能系统所使用的大多数流程进行充分理解是不现实的。即便对于专家而言，复杂——通常是黑箱——算法使用海量数据集进行的综合和推断也超出了人类认知能力。此外，由于人工智能系统经常将“无约束变量设定为极端值\\\
  [,\\] 如果其中一个无约束变量实际上是我们关心的东西”，系统就能将其从我们控制中夺走，并使它产生的“解决方案”变得极其不理想（Russell, 2014）——这引发了关于人类价值观与技术发展之间一致性的重大问题。缺乏透明度加剧了这一现实，导致人工智能系统在有时产生非预期、有害影响的情况下实现其目标，或产生脱离人类监督的涌现目标。\n\
  \n\n\n\n\n这些同意和知识的缺口导致了对本应由隐私控制的领域进行永久性侵入。例如，为了使人工智能系统更符合人类价值观，包括更尊重隐私，政府正在寻求监管人工智能的输入和流程。在输入层面，这些努力包括加强通知和同意制度，并要求健全的数据处理保障措施（Canada,\
  \ 2021a）；在流程层面，它们包括解释权和其他形式的问责，例如验证研究、错误报告等等（Canada, 2021b）。但鉴于人工智能系统输出的有用性，任何对输入或流程的控制欲望，很快就会对除最狂热的隐私倡导者之外的所有人失去优先性或紧迫感。人工智能输出具有惊人的有用性、精确性、效率、准确性和可靠性——有助于其不断占据人类的時間、注意力和信任——往往使试图控制人工智能输入或流程的尝试变得毫无意义。关于我们是否能将人类对齐引入新兴且可进化的智能的争论，导致谨慎的专家认为，虽然我们在取得技术进步，但人工智能可能会超越对其施加的初始约束，以实现自身最好的目标。\n\
  \n虽然我们并未同意这一交易的所有权衡——而且很少有能力做到这一点——但我们越来越同意将我们最宝贵的资源交给人工智能系统：我们的时间、注意力和信任。理解这种权力转移的后果是本文的主要关注点之一，本文试图探索隐私作为过去、现在和未来中的横向概念。隐私不仅仅是一种价值，而是一种对技术的*反应*。隐私决定了我们允许技术深入到人类生活和意识领域的程度。随着人工智能\
  \ arguably 超越了人类进化的速度，鉴于可以在更短的时间内引入和评估的突变和变异的数量，隐私已变得控制论的——与人工智能技术本身处于波动状态，并不断与其互动以重新勾勒其轮廓。就像那些持续告知我们隐私利益因个人信息的全新用途而受到新侵蚀的“使用条款”表格一样，隐私利益的性质也在不断变化。偶尔，戏剧性事件会爆发，隐私利益提醒我们不受欢迎的侵入（Nissenbaum,\
  \ 2010：10）。但随着这些冲击消退，隐私很快会被重新定义和重新构想，并且随着人工智能占据更多的时间、注意力和信任，隐私将继续在划定人类与技术之间的边界中发挥决定性作用。\n\
  \n### The Past\n\n了解我们是如何走到今天的可能有所帮助。\n\n在整个历史中，许多司法管辖区的法律法典传统上授予隐私权，以保护公民免受国家侵入。\n\
  \n在隐私概念化个人 *qua* 消费者行使“隐藏关于自己的信息以防止他人利用其对自己不利的权力”时（Posner, 1983：271），一些人开始认为适当的回应需要明确地将隐私表述为基本人权（American\
  \ Civil Liberties Union, 2015）。还有其他人，如 Helen Nissenbaum，认为任何个人权利范式可能都不够——建议集体主义范式是未来监管的必要组成部分（Nissenbaum,\
  \ 2010；Kaminski, 2019：1553）。其他人则表示重点应放在根据其敏感性对数据进行分层（Solove, 2023）。这些声音认为，当前以消费者为导向的隐私和数据保护方法之所以有缺陷，只是因为未能区分不同类型的敏感数据——某些倡导者建议加强隐私保护需要关注主题的类型、质量或性质。这种“数据敏感性”方法要求我们对主题事项及其相关保护进行分层。\n\
  \n### The Present\n\n也许当今隐私最重要的转变是 谁在进行侵入。\n\n与乔治 Orwell (1949) 在 *1984* 中关于监视的最大风险来自国家权力的警告相反，监视的兴起不再仅来自国家行为者，而是来自“其他国家代理人、企业，甚至个人”（Müller,\
  \ 2020）。传统的隐私保护框架并未为这一范式设立。在国家行为是重点的地方，今天政府可以，并且经常会（Standing Committee, 2022），很容易从\
  \ *private* 第三方（Solove, 2013：102–103）获取必要信息。这种所谓的第三方原则，即个人自愿向第三方提供信息时，当该信息随后被国家获取时，对该信息不再享有隐私主张，已在现代时代颠覆了隐私和搜查扣押。许多这些第三方也与国家一样强大（例如，苹果的市场估值超过了两个七国集团国家的\
  \ GDP）。\n\n人工智能正在加速这些趋势，以人类时间、注意力和信任的形式攫取越来越多的权力。人工智能本身就是权力寻求的，基本原因在于权力的积累使其能够更好地实现其主要目标（Carlsmith,\
  \ 2021）。研究还表明算法在各种环境中寻求权力（Turner et al., 2021）。这种权力的体现是公众关于人工智能的讨论受到开发这些技术的行为者的影响。权力如何影响我们的谈话是公理的。正如\
  \ Orwell (2006) 所写，“政治语言”旨在“使谎言听起来真实，使谋杀变得体面”。正如 Carissea Véliz (2020) 所强调的那样，数字时代的侵蚀隐私技术在话语层面与隐私权进行了令人印象深刻的斗争。“私人拥有的广告和监视网络被称为‘社区’，”她写道，\n\
  \n> 公民是“用户”，对屏幕的成瘾被标记为“参与”，我们最敏感的信息被认为是“数据废气”或“数字面包屑”，间谍软件被称为“cookies”，描述我们缺乏隐私的文件被命名为“隐私政策”，而过去被认为是窃听的东西现在是互联网的基础。\n\
  \n如果隐私是语义战场，语言就成了其武器；由此可见，最有效的监管形式往往是规范化误导和虚假广告处罚的消费者保护立法（Roth, 2022）。\n\n\n\n\n\
  \n尽管隐私的现代界面常常让用户感觉拥有控制权，但它们的前提是已不再适用的原则。随着数据交易开始在几乎每个社会机构中运作，这种动态变得愈发明显（Véliz, 2020）。个人数据的几乎不受阻碍的收集、保留和使用正在造成重大的权力不对称。从个人身上以及关于个人的数据被摄取后，其目的在于识别模式、联系、分类、归类和相关性。这是在大多数情况下技术也既不透明又专有的情况下发生的——受贸易秘密或保密信息的法律原则保护。这些形式的权力和脆弱性并不总是可以触及的。首先，人工智能指数级地复杂化了数据用于“在收集时未向用户披露的非预期目的”的范式（Manheim\
  \ & Kaplan, 2018: 121）。其次，人工智能模型的快速演进使透明度和问责变得难以捉摸，因为算法的训练可能会改变其本质（Kaminski, 2019）。这双重针对人类控制的攻击还必须面对技术产出所带来的诱惑。随着人工智能技术获得人类的时光、信任和关注，它们经常“准备好取代我们人类所做的许多事情”（Lobel,\
  \ 2022）——无论任务是增强搜索、起草电子邮件、指挥车辆，还是提醒人类即将到来的风险。这些技术的益处常常让我们忽视其代价。正如国家安全和安全的修辞被国家用来为侵犯隐私辩护一样，国家行为者持续且经常援引公共安全来驳回隐私和数据保护法律（Malone,\
  \ 2022a）。在 COVID-19 危机期间推动采用此类技术的最新举动中也可以观察到类似的动态（American Civil Liberties Union,\
  \ n.d.）。\n\n当然，现在仍然有很多例子说明人类对隐私的依恋。事实上，隐私往往被设计和拥有人工智能系统的人所重视。访问硅谷会发现没有短缺的人在人工智能经济的中心工作，他们拒绝采用其技术（或让其家庭成员这样做）。为了加强他们的隐私，Meta\
  \ 首席执行官马克·扎克伯格购买了他周围的房屋（Bayly, 2016），前 Alphabet 首席执行官埃里克·施密特要求删除谷歌搜索功能上的记录（Rosoff,\
  \ 2011），而 Twitter 首席执行官埃隆·马斯克暂停了追踪其私人飞机位置的账户（Wile, Collier, & Helsel, 2022）。“名人以及有权力的人们勤勉地保护他们的隐私不足为奇，”Véliz\
  \ (2020)写道。“这是我们所有人都看重的东西。否则，我们会自由地提供我们的密码。”\n\n### The Future\n\n随着人工智能继续垄断人类的时光、关注和信任，人工智能技术向人类延伸的转变将在隐私的概念上产生控制论动态。换句话说，隐私将随着人工智能驱动技术的接受或拒绝而处于波动之中。这种对隐私的控制论观点并非新鲜事。人们所要求、想要或表述为私人利益的内容随着时间的推移而演变。过去，针对国家侵入性的隐私保护寻求针对国家在特定*地方*——通常是在家中——的行动的保护。反对不合理搜查和扣押的权利塑造了物理位置。后来，隐私保护被确定为围绕*个人*——随着隐私法开始保护避孕、堕胎和亲密性行为等做法。\
  \ 现在隐私利益往往在电子空间中围绕个人数据（和其他类型数据）的使用而产生。人工智能的兴起模糊了对隐私的另一项巨大侵蚀。\n\n在此背景下，人们可能会质疑隐私作为一种价值是否能够、或将能够持续存在。这个问题并不新鲜。哲学家\
  \ Alan Watts（n.d.）在 1960 年代问道，网络扩张是否会在某个时候“废除隐私”。这种愿景源于对数字时代的认识，即从“庞大的数据海洋中，有关我们的图景令人恐惧地完整”（Smolan,\
  \ 2016）。Watts 将技术视为人类“延伸”的方式与 Marshall McLuhan (1964) 相同，后者认为新媒体技术放大并取代人类身体的一部分，从根本上改变了有机体本身。这种理论将技术的采用视为自我延伸的地方，其中给定技术的功能中断或崩溃，例如眼镜、耳机或车钥匙的丢失——或今天，数字头像或数字分身被黑——会强烈扰乱功能和福祉。同样，当人们试图采用“数字极简主义”并减少技术使用时，他们经常经历戒断（Newport,\
  \ 2019）。正如 Watts（n.d.）所说：\n\n> 人工与自然的区别是一个非常人工的区别。\\[技术\\]人类构造的东西并不比蜜蜂的巢和鸟的巢更不自然，也不是动物和昆虫生物的构造。*它们是我们自身的延伸*。\n\
  \n将这种命题推向极端认为人工智能为人类持续进化的道路提供了可能，而不是生物进化——也就是说，最初由人类创造但现在独立于人类的 AI 代表了进化的下一个阶段。这种末日版本的命题是人工智能可能是地球上生命的下一个进化步骤，人类正在退出。\n\
  \n“So, what，”Watts (n.d.)问道，“关于我们都计算机化的情况出现时会怎样？”在不久的将来，当越来越多的生活将在网上进行，而头像和数字分身无处不在时，很容易想象“电子回声”从我们身上提取的数据中回荡，但存在于电子网络和计算机中，独立于我们。\
  \ 这些电子回声是否会从根本上使隐私变得虚幻？我们关于我们的任何事情真的会是私人的吗？挑战这个问题的一种方式是质疑隐私本身的本质。人类是社会输入的累积；即使我们有先天的语法，也很难否认语言是通过复制外部社会网络的表达而习得的。从这些输入中有机获得的知识，在某种程度上不是我们的——不是私人的。\
  \ 遵循这一论点，影响和作用于个体的来源表明，即使个人的思想也不是私人区域，而是公共影响的区域。 （有趣的是，在许多科幻描绘中，读心术或无需物理渠道或互动的交流是与未来化社会相关的常见套路；这种对私人领域的如此深层入侵的常见套路可能对我们如何预期为新技术重新构想隐私有所启示。）\n\
  \n\n\n\n\n这一观察让我们面对根植于人权话语的社会所必须面对的独特问题——在这些社会中，人类的尊严是社会法律架构的试金石。即使人工智能创造了更大的 *平等*，它也不太可能产生更大的\
  \ *个性*——这是过去三个世纪以来西方民主的基础概念。在 *The Equality Machine* 中，Orly Lobel (2022: 3) 对人工智能提出了激昂的辩护，认为其有望提升平等，她称之为“当今的首要\
  \ imperative”。Lobel 认为人工智能最终可能比以往任何时候都更容易确保我们的职场反映出满足各种平等 imperative 所必需的平均值，例如在招聘、代表等方面——充当这些问题的有效“烟雾探测器”。(Lobel,\
  \ 2022) 正如她所写：“我们担心算法是黑箱——换句话说，不透明且难以理解（它们通常确实如此）。但人类的心智的黑箱又如何呢？”(Lobel, 2022 :\
  \ 46)。Lobel (2022: 46) 指出“\\[h\\]招聘领域的 人类决策”这一例子，其中“涉及数十名招聘人员、面试官、同事、客户和主管，每个人都是自己的一小块黑箱。”她认为人工智能通常可以挫败此类过程中可能发生的歧视等不利影响。人工智能可能有助于评估和监控就业或服务交付中的公平问题，承诺比由人类驱动的系统产生的更\
  \ *平等* 的结果。尽管她也指出的明显反驳是，人工智能从提供的输入和规则中学习；因此当它们不完美时，人工智能可能会产生自己的偏见。\n旨在衡量或遏制这些技术过度行为的法规——例如，报告和监控过度行为（就像要求污染者报告和监控其外部性一样）——可能有助于解决人工智能的一些不利影响。其中一项努力就是本书的呼吁——使人工智能以人为中心。但\
  \ Floridi 将此类术语称为“过时”的，因为它“既平凡地正确又危险地模糊”(Floridi, 2021)。他并非没有道理。举一例来说，Lobel 所颂扬的\
  \ *平等* 可能与人类希望行使其 *个性* 的方式相悖，而后者是当前以个人权利如通知、同意和控制为前提的隐私监管方法的根基。这也是为什么监管人工智能的输入和流程如此难以捉摸的核心原因。即使是宣称致力于以人类个体尊严为根基的权利框架的民主政府，也越来越多地部署人工智能以在提供商品和服务时获得成本、速度和准确性的优势——将公民扁平化为数据，以便以极度物化和侵入性的方式进行提取和决策。正如上文所述，对数据收集缺乏同意以及这些流程不可审查，意味着输出往往削弱人的尊严。然而我们仍在继续选择加入，正如这些系统现在所获得的人类时间、信任和关注的数量所证明的那样。过去\
  \ 50 年来，信任机构的崩溃——民主社会中宗教机构的消亡 (Pew Research, 2022)、婚姻等社会关系的崩溃 (Pew Research, 2010)\
  \ 以及民主国家选民参与度的下降 (Kopf, 2017)——都表明自由民主国家的信任已经在下降。人工智能技术超越人类的表现提供了进一步远离人类机构的理由。大多数人已经放弃了人类策划的新闻（例如报纸）(Kabani,\
  \ 2022)，转而使用人工智能策划的新闻（例如收集新闻并为受众策划的社交媒体网站）(Shearer, 2021)。此类转变是信任从人类向技术迁移的自然演变。这种权衡改变了人类愿意如何思考隐私。\n\
  今天，我们经常准备好通过给予人工智能系统我们的时间、注意力和信任，在无数其他例子中向其让渡权力。例如，我们中的许多人佩戴电子设备来捕获和操纵我们的健康数据，以换取人工智能系统可以提供的分析。许多人选择乘坐使用人工智能技术的交通工具（例如自动驾驶或驾驶辅助程序；使用人工智能的全球定位和地图应用；以及使用自动驾驶和自动着陆的飞机）以节省时间、提高效率、增加安全性、降低风险、节省燃料、降低碳排放或实现类似目标。我们中的许多人会与社交媒体平台互动，其算法提供根据我们的兴趣量身定制的內容流。我在撰写本章时也用它来识别拼写和语法缺陷。人工智能的输出似乎令人震惊地\
  \ *个人化*，即使它们是通过深深的 *非个人化* 流程生成的——通过将个人数据与其它数据扁平化以识别模式、类别和推断。\n已经提出了几种隐私增强解决方案来规划这一时代的前进道路。其中之一是更频繁地使用联邦学习或联邦分析——将数据去中心化的想法，以便算法和学习模型的隐私敏感训练数据不会在单一位置或来源中聚合\
  \ (McMahan, 2017)。然而，此类呼吁面临着来自致力于打破数据流动壁垒并禁止数据本地化的企业行为者的巨大阻力。在某些情况下，其他人主张采用差分隐私方法——在数据集中添加“噪声”形式的假数据以抵御“隐私威胁，包括数据链接和重建攻击”(Office\
  \ of the Privacy Commissioner, 2021)。然而，在某些情况下使用假数据会引发棘手的伦理和道德问题。最后，使用合成数据的提议——使用生成模型将源数据转化为\
  \ *假* 数据——已被建议作为增强隐私和应对数据集再识别风险的解决方案。然而，这一发展存在过时风险，因为推断生成人工智能技术的进步无疑将发展到对抗合成数据的防御系统。每一个提议都在人工智能崛起的背景下增强了隐私，尽管每一个都面临着重要挑战。\n\
  \n### Conclusion\n\n\n\n\n\n“醒来始于 *am* 和 *now*，”克里斯托弗 伊舍伍德 (1964) 在他的哀悼小说《*A Single\
  \ Man*》开头写道。伊舍伍德用罗马体来描述主人公的身体，用斜体来描述主人公的意识。“随后醒来的东西会躺上一会儿，凝视着天花板并沉入自身，直到它认出 I，并由此推导出\
  \ *I am*，*I am now*。”在伊舍伍德的叙事中，这些离散的片段凝聚成主人公乔治，他既是身体也是存在。有时，乔治以积极的自觉态度书写自己的经历，并在所有意义上都是一个单身男人；有时，他只是处于自动驾驶状态，成为一个世界的一部分，在这个世界里他根本不是一个单身男人，而只是一个与更广阔的外部生态系统相连的生物学单位，其中包括不仅仅是人类，还包括动物和自然。这种内在与外在之间的二元性一直是人类生活的一部分。我们是有意识的、独特且个体的存在，同时也是一个更大系统的成员，在这个系统中我们根本不重要。随着人工智能越来越多地占据我们的时间、注意力和信任——正如它现在已经对我们中的许多人从早晨醒来时到夜晚最后做的事所做的那样——夺走我们部分自主权，并将我们归类到类别中而不是拥抱我们的个性——它进一步侵蚀了被视为\
  \ *I am*、*I am now* 的这些空间。现在和未来，隐私将是我们在这种分歧两侧找到自己的界限。如果人工智能技术以以人为中心的方式——在适用的情境中增强人类，以推进他们的发展和他们的利益——那么此类问题不应难以解决，任何权衡也都易于协商。但当技术以取代、贬低或损害人类尊严的方式攫取权力时，其最终威胁仍然是驱使人类走向这样一个地步：这种分歧根本不存在。\n\
