  mdcn: "\n还有一个使用已弃用的ext/mssql扩展的剩余原因：在异构网络中，UNIX/Linux系统可以访问MSSQL安装，并使用旧的MSSQL扩展连接到它们。要实现这一点，你必须从www.freetds.org/下载FreeTDS库，并在解压发行版后使用以下命令安装：\n\
    \n```\n./configure --prefix=/usr/local/tds --with-tdsver=4.2\nmake\nsudo make\
    \ install\n```\n\n然后，使用`--with-sybase=/usr/local/freetds`开关重新配置PHP。\n\n最后，你可以使用`mssql_connect()`连接到服务器，并使用`mssql_select_db()`选择要使用的数据库，这与其他数据库扩展使用的API类似。使用`mssql_query()`执行SQL查询后，可以使用以下函数之一检索返回的数据：\n\
    \n- `mssql_fetch_assoc()` 将结果集中的当前行作为关联数组返回。\n- `mssql_fetch_object()` 将结果集中的当前行作为对象返回。\n\
    - `mssql_fetch_row()` 将结果集中的当前行作为数值数组返回。\n\n**注意：** MSSQL支持两种用户认证模式：SQL认证和Windows认证。后者检查当前Windows用户是否具有足够的权限访问数据库。在受控环境中，这可能比使用用户名和密码更好。但是，你首先必须找出使用的是哪个用户。例如，Microsoft\
    \ Internet信息服务（IIS）Web服务器软件通常使用Internet来宾帐户（即IUSR <机器名>）。因此，该用户需要数据库中的权限。\n\n\
    要使用Windows认证——有时也称为受信任连接——你需要以下php.ini指令：\n\n```\nmssql.secure_connection = On\n\
    ```\n\n## 连接到Firebird\n\n```\n<?php\nif ($db = ibase_connect('localhost:/tmp/quotes.gdb',\
    \ 'user', 'password')) {\n\techo 'Connected to the database.';\n\tibase_close($db);\n\
    } else {\n\techo 'Connection failed.';\n}\n?>\n```\n\n## 连接到InterBase/Firebird（ibase_connect.php）\n\
    \nFirebird数据库目前更像是一个内行才知道的秘诀，而不是广泛使用的数据库，但它正在获得更多用户，并且可能成为成熟关系型数据库管理系统（RDBMS）的替代品。该数据库起源于Borland的InterBase产品。因此，Windows用户需要在php.ini中设置`extension=php_interbase.dll`，而“自行编译者”必须使用`--with-interbase=/path/to/firebird`开关配置PHP。此外，Firebird支持两种模式：一种是与SQLite类似的文件模式，一种是服务器模式。为了互操作性和易于部署，本节使用文件模式。\n\
    \n本节还使用与Firebird和InterBase兼容的.gdb文件；新的Firebird格式扩展名为.fdb。创建此文件后，`ibase_connect()`连接到该文件或数据库。对于主机，当使用TCP/IP时，你必须提供格式为'localhost:/path/to/file.gdb'的字符串，或提供本地文件名（列表假定文件位于本地机器的/tmp目录中）；你还需要用户名和密码。\n\
    \n## 向Firebird发送SQL\n\n### ibase_execute()\n\n```\n<?php\nif ($db = ibase_connect('localhost:/tmp/quotes.gdb',\
    \ 'user', 'password')) {\n    require_once 'stripFormSlashes.inc.php';\n    $sql\
    \ = 'INSERT INTO quotes (id, quote, author, year) ' .\n        'VALUES (GEN_ID(quotes_gen,\
    \ 1), ?, ?, ?)';\n    $stmt = ibase_prepare($db, $sql);\n    ibase_execute($stmt,\
    \ $_POST['quote'], $_POST['author'], intval($_POST['year']));\n    echo 'Quote\
