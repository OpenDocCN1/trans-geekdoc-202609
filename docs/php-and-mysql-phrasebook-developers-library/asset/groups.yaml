    \ $b)\n```\n\n```php\n<?php\n$a = 'PHP';\n$b = 'php';\necho 'strcmp(): ' . strcmp($a,\
    \ $b) . '<br />';\necho 'strcasecmp(): ' . strcasecmp($a, $b);\n?>\n```\n\n*Comparing\
    \ Strings (compare.php)*\n\nWhich outputs:\n\n```\nstrcmp(): -32\nstrcasecmp():\
    \ 0\n```\n\nComparing strings seems like an easy task—use the == operator for\
