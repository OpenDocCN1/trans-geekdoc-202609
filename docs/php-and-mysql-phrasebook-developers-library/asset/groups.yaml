    - XML_Parser2 provides an advanced XML parser.\n- XML_Serializer converts XML\
    \ files into data structures and vice versa.\n- XML_Util contains a wealth of\
    \ helper functions for working with XML.\n\n## Communicating with Others\n\nMost\
    \ of the previously discussed phrases worked within the ecosystem of the PHP script\
    \ and the Web server in use. However, because some phrases can also be understood\
    \ by others, this chapter covers some examples of this type. You can connect to\
    \ remote servers in a variety of ways.\n\n```php\n<?php\n\necho file_get_contents('http://www.php.net/');\n\
    \n?>\n```\n\nReading in an HTTP Resource (http-file.php)\n\nHypertext Transfer\
    \ Protocol (HTTP) is probably the protocol most often used from PHP to connect\
    \ with others (apart from various database protocols). Starting with PHP 4.3,\
    \ it is really easy to connect to such data sources because PHP's stream support\
    \ was vastly improved in that version. (Of course, using HTTP in the way this\
    \ code shows was already possible in earlier PHP releases.) The idea is that when\
    \ you use a file operation, you access a stream of data. In practice, it doesn't\
    \ really matter whether it's a file on the local system, on a network share, or\
    \ on a remote server connected via either HTTP, File Transfer Protocol (FTP),\
    \ or any other supported protocol. Just provide the appropriate filename, and\
    \ PHP takes care of the rest. The preceding code shows this: It opens the PHP\
    \ home page, and prints its Hypertext Markup Language (HTML) code in the browser.\
    \ With just one line of code, it cannot get much more simple. Figure 11.1 contains\
    \ the output.\n\n![](img/2862989e5dc7f1b1d0bc64321737f084_307_0.png)\n\nFigure\
    \ 11.1 A one-liner prints the HTML markup of the PHP home page.\n\n**WARNING:**\
    \ For security reasons, you can turn off this behavior in php.ini by setting allow_url_fopen\
    \ to Off; so, you cannot rely on it on Web servers you cannot control---for instance,\
    \ shared hosting at large Internet service providers (ISPs).\n\nIf you want to\
    \ control the HTTP request by yourself, you can do so by using sockets. First,\
    \ use fsockopen() to open a socket to the Web server, and if that works, you then\
    \ send a well-formed HTTP request. The following code implements this, again querying\
    \ the PHP home page:\n\n```php\n<?php\n\n$fp = @fsockopen('www.php.net', 80, $errno,\
    \ $errstr, 30);\nif ($fp) {\n    echo '<xmp>';\n    $request = \"GET / HTTP/1.0\\\
    r\\n\";\n    $request .= \"Host: www.php.net\\r\\n\";\n    $request .= \"Connection:\
    \ Close\\r\\n\\r\\n\";\n    fwrite($fp, $request);\n    while (!feof($fp)) {\n\
    \        echo fgets($fp, 1024);\n    }\n    fclose($fp);\n    echo '</xmp>';\n\
    } else {\n    echo \"Error: $errstr ($errno)\";\n}\n?>\n```\n\n*Reading in an\
    \ HTTP Resource Using Sockets (http-socket.php)*\n\nThe output is the same, with\
    \ one difference: The socket approach also returns all HTTP headers sent by the\
    \ server, whereas the stream wrappers omit them.\n\nNOTE: When you must work with\
    \ HTTP Secure (HTTPS) resources (Web sites secured with SSL [Secure Sockets Layer],\
    \ for example), the two approaches still work, although with slight modification:\n\
    \n- When using file functions such as file_get_contents(), just provide an https://\
    \ uniform resource locator (URL).\n- When using sockets, use an ssl:// URL.\n\n\
    ## Connecting with FTP Servers\n\n```\nfile_get_contents('ftp://mirror.netcologne.de/apache.org/httpd/README.html')\n\
    ```\n\n```php\n<?php\n$data = file_get_contents('ftp://mirror.netcologne.de/apache.org/httpd/README.html');\n\
    file_put_contents('Apache-README.html', $data);\necho 'File written.';\n?>\n```\n\
    \nReading in an FTP File (ftp-file.php; excerpt)\n\nWhen you are accessing FTP\
    \ servers, PHP's stream wrappers come in very handy, as well. You only have read\
    \ access, but the access is binary safe nonetheless. This code shows how to download\
    \ the current README file for Apache from an FTP server and save it to the local\
    \ hard disk using file_get_contents(). Writing is also possible; just use\nfile_put_contents()\
    \ or the correct file mode for fopen(). Note, though, that both reading and writing\
    \ simultaneously is not yet supported.\n\nTIP: If you do not provide any credentials,\
    \ PHP tries to log you in to the FTP server using a guest account most public\
    \ FTP servers offer. You can, however, also provide the credentials yourself:\n\
    \n```\n$data = file_get_contents('ftp://USER:PASSWORD@ftp.example.com/');\n```\n\
    \nThis works for HTTP resources (see previous phrase), too!\n\nPHP also comes\
    \ with built-in support for FTP and a special set of functions that implement\
    \ the complete FTP functionality defined in the associated Request For Comment\
    \ (RFC). In the Windows distributions, this is enabled by default, whereas on\
    \ other systems, PHP has to be configured with the switch --enable-ftp. Then,\
    \ using the FTP server usually consists of the following steps:\n\n- 1. Connect\
    \ to the server using ftp_connect().\n- 2. Log in using ftp_login().\n- 3. Go\
    \ to the target directory using ftp_chdir().\n- 4. Read a file (ftp_get()) from\
    \ or write a file (ftp_put()) to the FTP server.\n- 5. Close the connection using\
    \ ftp_close().\n\nBecause reading is more common than writing, the following shows\
    \ the former task being executed. Again, the Apache README is fetched from an\
    \ FTP server:\n\n```php\n<?php\n$ftp = @ftp_connect('mirror.netcologne.de');\n\
    $login = @ftp_login($ftp, 'anonymous',\n'email@example.com');\n\nif ($ftp && $login)\
    \ {\n    ftp_chdir($ftp, '/apache.org/httpd/');\n    ftp_get($ftp, 'Apache-README-ftp.html',\n\
    \    'README.html', FTP_ASCII);\n    echo 'File written.';\n    ftp_close($ftp);\n\
    } else {\n    echo 'Error!';\n}\n?>\n```\n\nReading in an FTP file Using the Built-In\
    \ Functions\n(ftp-functions.php)\n\nNote that the syntax of ftp_get() is a bit\
    \ strange. After the FTP resource, you first have to provide the local filename,\
    \ and then you must provide the remote filename. (Intuitively, you would expect\
    \ it to be the other way around.) The last parameter is the transfer mode: FTP\
    \ ASCII for text files, and FTP BINARY for all other data.\n\n## Checking Whether\
    \ a Server Is Still Reacting\n\n```php\n<?php\n$server = 'localhost';\n$port =\
    \ '80';\n$status = 'unavailable';\n$fp = @fsockopen($server, $port, $errno, $errstr,\
    \ 10);\nif ($fp) {\n    $status = 'alive, but not responding';\n    fwrite($fp,\
    \ \"HEAD / HTTP/1.0\\r\\n\\r\\n\");\n    fwrite($fp, \"Host: $server\\r\\n\\r\\\
    n\");\n    if (strlen(@fread($fp, 1024)) > 0) {\n        $status = 'alive and\
    \ kicking';\n    }\n    fclose($fp);\n}\necho \"The server is $status.\";\n?>\n\
    ```\n\n*Checking the Status of a Server (serverstatus.php)*\n\nSuppose you have\
    \ a Web server and you want to check periodically that it hasn’t crashed again.\
    \ In this scenario, using a PHP script for this task is a good idea. Just open\
    \ a socket to the server and wait. (The last parameter of fsockopen() is a timeout\
    \ value.) After this time has elapsed, you know whether the server is online or\
    \ offline.\n\n**TIP:** This works well if only one server’s status must be checked.\
    \ If there are several servers, this approach has some disadvantages. The call\
    \ to fsockopen() might take up to the timeout value until the next command is\
    \ executed. Therefore, all servers are checked sequentially and synchronously.\
    \ This just takes too long for several servers. However, with PHP 5 and stream\
    \ sockets, this can be done asynchronously. The code is a bit complicated, but\
    \ Wez Furlong explains this approach in great detail at http://wezfurlong.org/blog/2005/may/guru-multiplexing/.\n\
    \nSOAP once stood for Simple Object Access Protocol, but because it is neither\
    \ simple nor has much to do with object access, today SOAP just stands for...\
    \ SOAP. It is a rather complex protocol but overcomes many of the limitations\
    \ of XML-RPC (which was, by the way, created by some parties who also worked on\
    \ SOAP).\n\nMost of the time, XML-RPC or SOAP calls are transported via HTTP as\
    \ the carrier protocol. However, other protocols are also possible, including\
    \ Simple Mail Transfer Protocol (SMTP) or even User Datagram Protocol (UDP).\n\
    \nWhen using SOAP you need to consider one more important aspect: When you know\
    \ exactly how a Web Service is implemented, you also know how to call (access\
    \ or consume) it. However, many times this information is not available, so there\
    \ must be a kind of self-description of the Web Service that contains all relevant\
    \ information, such as which methods or functions are exposed, which parameters\
    \ and data types they expect, and what they return. This can be done using a specifically\
    \ crafted XML file, as well. The standard behind that is Web Services Description\
    \ Language (WSDL). Today, WSDL is used for all relevant Web Services because it\
    \ makes using them is quite simple. Most server-side technologies offer one way\
    \ (or more) to just read in the WSDL and then access the Web Service as you would\
    \ access a locally available class.\n\nGenerating all this XML is quite complicated.\
    \ Not that PHP doesn't have good XML support, but the syntax can be quite hard.\
    \ However, some extensions and external packages make using Web Services much\
    \ easier. The following phrases each implement a Web Service that just adds two\
    \ numbers. You will certainly be more\n"
  mdcn: "\n## PEAR 提供了什么？\n\n截至本文撰写时，PHP 扩展和应用程序仓库（PEAR）中的 XML 部分包含 35 个软件包，太多无法一一列举。以下是其中一些：\n\
    \n- XML Beautifier 可格式化 XML 文档，使其更美观。\n- XML_DTD 允许解析 DTD，即使在 PHP 4 下也行。\n- XML_Parser2\
    \ 提供了一个高级 XML 解析器。\n- XML_Serializer 将 XML 文件转换为数据结构，反之亦然。\n- XML_Util 包含大量用于处理\
    \ XML 的辅助函数。\n\n## 与他人通信\n\n先前讨论的大多数短语都在所使用的 PHP 脚本和 Web 服务器的生态系统内工作。然而，由于某些短语也可以被他人理解，本章涵盖了一些此类示例。你可以通过多种方式连接到远程服务器。\n\
    \n```php\n<?php\n\necho file_get_contents('http://www.php.net/');\n\n?>\n```\n\
    \n读取 HTTP 资源 (http-file.php)\n\n超文本传输协议（HTTP）可能是 PHP 用于与其他系统连接（除各种数据库协议外）最常用的协议。从\
    \ PHP 4.3 开始，连接此类数据源变得非常容易，因为该版本中 PHP 的流支持得到了极大改进。（当然，以本代码所示方式使用 HTTP 在更早的 PHP\
    \ 版本中也已可能。）其思想是，当你使用文件操作时，你访问的是数据流。实际上，无论是本地系统上的文件、网络共享上的文件，还是通过 HTTP、文件传输协议（FTP）或其他受支持协议连接的远程服务器上的文件，都无关紧要。只需提供适当的文件名，PHP\
    \ 就会处理其余部分。前面代码展示了这一点：它打开 PHP 主页，并在浏览器中打印其超文本标记语言（HTML）代码。用一行代码实现，无法更简单。图 11.1\
    \ 包含输出。\n\n![](img/2862989e5dc7f1b1d0bc64321737f084_307_0.png)\n\n图 11.1 一行代码打印\
    \ PHP 主页的 HTML 标记。\n\n**警告：** 出于安全原因，你可以在 php.ini 中通过将 allow_url_fopen 设置为 Off\
    \ 来关闭此行为；因此，在你无法控制的 Web 服务器上---例如大型互联网服务提供商（ISP）的共享托管---你不能依赖它。\n\n如果你想自行控制 HTTP\
    \ 请求，可以使用套接字。首先，使用 fsockopen() 向 Web 服务器打开一个套接字，如果成功，则发送格式良好的 HTTP 请求。以下代码实现了这一点，同样查询\
    \ PHP 主页：\n\n```php\n<?php\n\n$fp = @fsockopen('www.php.net', 80, $errno, $errstr,\
    \ 30);\nif ($fp) {\n    echo '<xmp>';\n    $request = \"GET / HTTP/1.0\\r\\n\"\
    ;\n    $request .= \"Host: www.php.net\\r\\n\";\n    $request .= \"Connection:\
    \ Close\\r\\n\\r\\n\";\n    fwrite($fp, $request);\n    while (!feof($fp)) {\n\
    \        echo fgets($fp, 1024);\n    }\n    fclose($fp);\n    echo '</xmp>';\n\
    } else {\n    echo \"Error: $errstr ($errno)\";\n}\n?>\n```\n\n*使用套接字读取 HTTP 资源\
    \ (http-socket.php)*\n\n输出相同，只有一个区别：套接字方法还会返回服务器发送的所有 HTTP 标头，而流包装器则省略了它们。\n\n\
    注意：当你必须处理 HTTP 安全（HTTPS）资源（例如使用 SSL [安全套接字层] 保护的网站）时，这两种方法仍然有效，只是需要稍作修改：\n\n-\
    \ 使用 file_get_contents() 等文件函数时，只需提供一个 https:// 统一资源定位符（URL）即可。\n- 使用套接字时，使用 ssl://\
    \ URL。\n\n## 连接 FTP 服务器\n\n```\nfile_get_contents('ftp://mirror.netcologne.de/apache.org/httpd/README.html')\n\
    ```\n\n```php\n<?php\n$data = file_get_contents('ftp://mirror.netcologne.de/apache.org/httpd/README.html');\n\
    file_put_contents('Apache-README.html', $data);\necho 'File written.';\n?>\n```\n\
    \n读取 FTP 文件 (ftp-file.php; 摘录)\n\n当你访问 FTP 服务器时，PHP 的流包装器也非常方便。你只有读取权限，但访问仍然是二进制安全的。此代码展示了如何使用\
    \ file_get_contents() 从 FTP 服务器下载 Apache 的当前 README 文件并将其保存到本地硬盘。写入也可能；只需使用 file_put_contents()\
    \ 或 fopen() 的正确文件模式即可。注意，不过，同时进行读写尚不支持。\n\n提示：如果不提供任何凭据，PHP 会尝试使用大多数公共 FTP 服务器提供的访客账户登录到\
    \ FTP 服务器。你也可以自行提供凭据：\n\n```\n$data = file_get_contents('ftp://USER:PASSWORD@ftp.example.com/');\n\
    ```\n\n这也适用于 HTTP 资源（参见前面的短语）！\n\nPHP 还内置了对 FTP 的支持以及一组特殊函数，实现了相关请求评论（RFC）中定义的完整\
    \ FTP 功能。在 Windows 发行版中，这默认启用，而在其他系统上，PHP 必须使用 --enable-ftp 开关进行配置。然后，使用 FTP 服务器通常包括以下步骤：\n\
    \n- 1. 使用 ftp_connect() 连接到服务器。\n- 2. 使用 ftp_login() 登录。\n- 3. 使用 ftp_chdir()\
    \ 进入目标目录。\n- 4. 从 FTP 服务器读取文件（ftp_get()）或向其写入文件（ftp_put()）。\n- 5. 使用 ftp_close()\
    \ 关闭连接。\n\n由于读取比写入更常见，以下展示了前者的执行。再次从 FTP 服务器获取 Apache README：\n\n```php\n<?php\n\
    $ftp = @ftp_connect('mirror.netcologne.de');\n$login = @ftp_login($ftp, 'anonymous',\n\
    'email@example.com');\n\nif ($ftp && $login) {\n    ftp_chdir($ftp, '/apache.org/httpd/');\n\
    \    ftp_get($ftp, 'Apache-README-ftp.html',\n    'README.html', FTP_ASCII);\n\
    \    echo 'File written.';\n    ftp_close($ftp);\n} else {\n    echo 'Error!';\n\
    }\n?>\n```\n\n使用内置函数读取 FTP 文件\n(ftp-functions.php)\n\n请注意 ftp_get() 的语法有点奇怪。在\
    \ FTP 资源之后，你首先必须提供本地文件名，然后必须提供远程文件名。（直观上，你会期望顺序相反。）最后一个参数是传输模式：文本文件使用 FTP ASCII，其他所有数据使用\
    \ FTP BINARY。\n\n## 检查服务器是否仍在响应\n\n```php\n<?php\n$server = 'localhost';\n$port\
    \ = '80';\n$status = 'unavailable';\n$fp = @fsockopen($server, $port, $errno,\
    \ $errstr, 10);\nif ($fp) {\n    $status = 'alive, but not responding';\n    fwrite($fp,\
    \ \"HEAD / HTTP/1.0\\r\\n\\r\\n\");\n    fwrite($fp, \"Host: $server\\r\\n\\r\\\
    n\");\n    if (strlen(@fread($fp, 1024)) > 0) {\n        $status = 'alive and\
    \ kicking';\n    }\n    fclose($fp);\n}\necho \"The server is $status.\";\n?>\n\
    ```\n\n*检查服务器状态 (serverstatus.php)*\n\n假设你有一个 Web 服务器，并且想定期检查它是否再次崩溃。在这种情况下，使用\
    \ PHP 脚本来执行此任务是个好主意。只需向服务器打开一个套接字并等待。（fsockopen() 的最后一个参数是超时值。）在此时间过去后，你就知道服务器是否在线或离线。\n\
    \n**提示：** 如果只需要检查一个服务器的状态，这效果很好。如果有多个服务器，这种方法有一些缺点。fsockopen() 的调用可能需要长达超时值的时间才会执行下一个命令。因此，所有服务器都是顺序且同步检查的。对于多个服务器来说，这花费的时间太长了。然而，使用\
    \ PHP 5 和流套接字，可以异步完成。代码有点复杂，但 Wez Furlong 在 http://wezfurlong.org/blog/2005/may/guru-multiplexing/\
    \ 上对此方法进行了详细解释。\n\nSOAP 一度代表简单对象访问协议，但由于它既不简单也与对象访问关系不大，今天 SOAP 就只是代表... SOAP。它是一个相当复杂的协议，但克服了\
    \ XML-RPC 的许多限制（顺便说一下，XML-RPC 由一些也参与 SOAP 工作的人创建）。\n\n大多数情况下，XML-RPC 或 SOAP 调用通过\
    \ HTTP 作为承载协议传输。然而，其他协议也是可能的，包括简单邮件传输协议（SMTP）甚至用户数据报协议（UDP）。\n\n使用 SOAP 时，你需要考虑另一个重要方面：当你确切知道\
    \ Web 服务是如何实现的时，你也知道如何调用（访问或使用）它。然而，很多时候这些信息不可用，因此必须有一种 Web 服务的自我描述，其中包含所有相关信息，例如暴露了哪些方法和函数，它们期望哪些参数和数据类型，以及它们返回什么。这也可以使用专门制作的\
    \ XML 文件来完成。其背后的标准是 Web 服务描述语言（WSDL）。今天，WSDL 用于所有相关的 Web 服务，因为它使使用它们变得相当简单。大多数服务器端技术提供一种（或多种）方式来读取\
