    # Saving Form Data into a Cookie


    ```

    function setCookieData($arr) {

    $formdata = getCookieData();

    if ($formdata == null) {

    $formdata = array();

    }

    foreach ($arr as $name => $value) {

    $formdata[$name] = $value;

    }

    setcookie(''formdata'', serialize($formdata), time()+30*24*60*60);

    }

