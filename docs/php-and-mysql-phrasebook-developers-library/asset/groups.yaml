    When it comes to validating a selection list, the approach depends on the type
    of list:


    +   - If it is a list in which only one element may be selected, the list is considered
    to be filled out incorrectly if

    +     - No option in the list is selected.

    +     - The selected option has an empty string as a value.

    +   - If it is a list in which multiple elements may be selected, the list is
    considered to be filled out incorrectly if

    +     - No option in the list is selected.

    +     - All selected options have an empty string as a value.'
