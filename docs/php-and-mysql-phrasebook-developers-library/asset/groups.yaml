  md: "\n## Understanding Inheritance\n\n```\nclass DerivedClass extends BaseClass\
    \ {\n```\n\nA class can be inherited from another class by using the extends keyword.\
    \ As a consequence, the new class contains (inherits) all public and protected\
    \ methods from the base class. Of course, it is possible to overwrite these methods\
    \ in the derived classes.\n\nAccess to the parent class is granted by the parent\
    \ keyword. The associated syntax looks like a static reference, but isn't one—so\
    \ you can use `$this` within the called method.\n\nThe code in Listing 4.3 overwrites\
    \ the constructor in the derived class, but also calls the parent constructor.\
    \ Note that the signatures of the two constructors are different. The main code\
    \ also calls a method from the base class:\n\n```php\n<?php\nclass MyBaseClass\
    \ {\n    protected $value1 = null;\n    protected $value2 = null;\n\n    protected\
    \ function __construct($value = null) {\n        if ($value !== null) {\n    \
    \        $this->value1 = $value;\n        }\n    }\n\n    public function getValue1()\
    \ {\n        return $this->value1;\n    }\n}\n\nclass MyDerivedClass extends MyBaseClass\
    \ {\n    protected $value2 = null;\n\n    public function __construct($value1\
    \ = null,\n        $value2 = null) {\n        if ($value1 !== null) {\n      \
    \      parent::__construct($value1);\n            if ($value2 !== null) {\n  \
    \              $this->value2 = $value2;\n            }\n        }\n    }\n\n \
    \   public function getValue2() {\n        return $this->value2;\n    }\n}\n\n\
    $c = new MyDerivedClass('abc', 'def');\necho '1: ', $c->getValue1(), ', 2: ',\
    \ $c->getValue2();\n?>\n```\n\n*Using Inheritance with PHP (extends.php)*\n\n\
    **NOTE:** PHP does not support multiple inheritance, so one class may be derived\
    \ only from (exactly) one other class. Of course, you could derive class B from\
    \ class A, and class C from class B, so that class C also inherits public and\
    \ protected methods from A.\n\n## Using Abstract Classes and Interfaces\n\n```\n\
    abstract class MyAbstractBaseClass {\n}\n```\n\nPHP supports two additional ways\
    \ of inheritance: abstract classes and interfaces. The two approaches are similar,\
    \ but the differences are essential. The common goal is to provide a contract\
    \ or blueprint for a derived class: the base class (or classes, as discussed later)\
    \ defines which methods are expected in the new class.\n\nWhen you use an abstract\
    \ class, the inheritance is done as before, using the extends keyword. However,\
    \ what's new is that the base class is defined as abstract, thanks to the abstract\
    \ keyword. Also, a set of methods within the abstract class can be labeled as\
    \ abstract, as well, but these do not contain any code:\n\n```\nprotected abstract\
    \ function myMethod();\n```\n\nThe derived class now absolutely needs to implement\
    \ those methods, using the same signatures, and also the same (or at least a less\
    \ restrictive) visibility setting. For instance, if the abstract base class defines\
    \ an abstract protected method, the derived class needs to implement this method\
    \ as protected or as public. If you are using type hints, these need to be identical,\
    \ as well.\n\nIf the abstract class contains additional methods that are not declared\
    \ as abstract, they are inherited as with regular classes, too, as long as they\
    \ are protected or public:\n\n```php\n<?php\nabstract class MyAbstractBaseClass\
    \ {\n    protected $value1 = null;\n    protected $value2 = null;\n\n    protected\
    \ function getValue1() {\n        return $this->value1;\n    }\n\n    protected\
    \ function getValue2() {\n        return $this->value2;\n    }\n\n    protected\
    \ abstract function dumpData();\n}\n\nclass MyAbstractClass extends MyAbstractBaseClass\
    \ {\n    public function __construct($value1 = null,\n        $value2 = null)\
    \ {\n        if ($value1 !== null) {\n            $this->value1 = $value1;\n \
    \           if ($value2 !== null) {\n                $this->value2 = $value2;\n\
    \            }\n        }\n    }\n\n    public function dumpData() {\n       \
    \ echo '1: ', $this->getValue1(), ', 2:',\n        $this->getValue2();\n    }\n\
    }\n\n$c = new MyAbstractClass('ghi', 'jkl');\n$c->dumpData();\n?>\n```\n\n*Using\
    \ an Abstract Class (abstract.php)*\n\nAs with regular classes, abstract classes\
    \ support single inheritance only.\n\nThe \"same same but different\" approach\
    \ uses interfaces. An interface looks like a regular PHP class, but uses the interface\
    \ keyword rather than class. The interface does not contain any implementation\
    \ at all, just function signatures. All of these functions need to be public.\n\
    \nThe actual class now \"inherits\" from this interface; in this context, however,\
    \ we say that the class implements the interface. This is emphasized by the implements\
    \ keyword, which is used rather than extends.\n\nThe other rules are very similar\
    \ to those of abstract classes: All methods from the interface need to be implemented,\
    \ and the function signatures need to stay the same (including the visibility\
    \ level, which is public anyway). As an additional benefit, a class may implement\
    \ multiple interfaces simultaneously, as long as all interfaces involved have\
    \ distinct method names.\n\nThe following code creates two interfaces and then\
    \ implements both of them in one class:\n\n```php\n<?php\n\ninterface MyInterface1\
    \ {\n    public function getValue1();\n    public function getValue2();\n}\n\n\
    interface MyInterface2 {\n    public function dumpData();\n}\n\nclass MyInterfaceClass\
    \ implements MyInterface1, MyInterface2 {\n    protected $value1 = null;\n   \
    \ protected $value2 = null;\n\n    public function __construct($value1 = null,\n\
    \        $value2 = null) {\n        if ($value1 !== null) {\n            $this->value1\
    \ = $value1;\n            if ($value2 !== null) {\n                $this->value2\
    \ = $value2;\n            }\n        }\n    }\n\n    public function getValue1()\
    \ {\n        return $this->value1;\n    }\n\n    public function getValue2() {\n\
    \        return $this->value2;\n    }\n\n    public function dumpData() {\n  \
    \      echo '1: ', $this->getValue1(), ', 2:', $this->getValue2();\n    }\n}\n\
    \n$c = new MyInterfaceClass('mno', 'pqr');\n$c->dumpData();\n?>\n```\n\n## Preventing\
    \ Inheritance and Overwriting\n\n```\nfinal class MyFinalBaseClass {}\npublic\
    \ final function myMethod() {}\n```\n\nThere are some classes you do not want\
    \ to inherit from (for instance, if they contain critical functionality, and you\
    \ do not want the other developers to overwrite those vital methods). PHP's final\
    \ keyword is suited for that task. You can either make a class final (in which\
    \ case, it is not possible to inherit from it at all) or you can declare a method\
    \ as final (in which case, code cannot overwrite it). Therefore, the following\
    \ code causes an exception, as depicted in Figure 4.1:\n\n```php\n<?php\nclass\
    \ MyFinalBaseClass {\n    public final function getCopyrightNotice() {\n     \
    \   return '&copy; by Original Author';\n    }\n}\n\nclass MyFinalClass extends\
    \ MyFinalBaseClass {\n    function getCopyrightNotice() {\n        return '&copy;\
    \ by me!';\n    }\n}\n?>\n```\n\n*Preventing Overloading with the final Keyword\
    \ (final.php)*\n\n![](img/2862989e5dc7f1b1d0bc64321737f084_120_0.png)\n\nFigure\
    \ 4.1 Final methods cannot be overwritten.\n\nOf course, if you are the sole developer\
    \ making a class or method final does not seem to be necessary. However, you should\
    \ always be ready for when the development team gets larger or you refactor your\
    \ codebase into a library others will also be using.\n\n## Using Autoloading\n\
    \n```\nspl_autoload_register('myAutoloadFunction');\n```\n\nWhen you are using\
    \ a class, it needs to be defined; otherwise PHP will throw an error. There is\
    \ a second chance, however, should a class not be available once it is used. The\
    \ spl_autoload_register() function registers a function that will be called once\
    \ PHP code tries to use a class that has not been registered yet. After the call\
    \ to the registration function, the code that uses the undefined class is run\
    \ again. If the class is now available, great; otherwise, the usual error occurs.\n\
    \nA common pattern is to use a fixed naming scheme for files containing classes\
    \ and to put the classes in a defined directory. For instance, the class MyClass\
    \ resides in the file /classes/MyClass.class.php. In that case, the following\
    \ autoloading function would load the class on demand:\n\n```php\n<?php\nfunction\
    \ myAutoloadFunction($classname) {\n    if (preg_match('/^[a-zA-Z_\\x7f-\\xff][a-zA-Z0-9_\\\
    x7f-\\xff]*$/', $classname)) {\n        //check for valid classname\n        require_once\
    \ \"/path/to/classes/$classname.class.php\";\n    }\n}\n\nspl_autoload_register('myAutoloadFunction');\n\
    ?>\n```\n\n*Autoloading Classes (autoload.php)*\n\nSo, for instance, the following\
    \ call\n\n`$c = new UnknownClass();`\n\nwould in turn call myAutoloadFunction(),\
    \ providing UnknownClass as the value for the $classname parameter. If you call\
    \ spl_autoload_register() multiple times, all autoloading functions are registered,\
    \ so PHP calls each of them until the desired class is finally defined—or until\
    \ all such functions have been called.\n\n**NOTE:** The spl_autoload_register()\
    \ function was introduced in PHP 5.1.2 as part of the SPL (Standard PHP Library).\
    \ Formerly, you had to write a function\n"
  mdcn: "\n\n## 理解继承\n\n```\nclass DerivedClass extends BaseClass {\n```\n\n一个类可以通过\
    \ `extends` 关键字从另一个类继承。这样一来，新类会包含（继承）基类中所有公共（public）和保护（protected）方法。当然，你也可以在派生类中覆盖这些方法。\n\
    \n通过 `parent` 关键字可以访问父类。相关语法看起来像静态引用，但实际上并不是——因此你可以在被调用的方法中使用 `$this`。\n\n清单 4.3\
    \ 中的代码覆盖了派生类中的构造函数，同时也调用了父类构造函数。请注意，这两个构造函数的签名是不同的。主代码还调用了基类中的一个方法：\n\n```php\n\
    <?php\nclass MyBaseClass {\n    protected $value1 = null;\n    protected $value2\
    \ = null;\n\n    protected function __construct($value = null) {\n        if ($value\
    \ !== null) {\n            $this->value1 = $value;\n        }\n    }\n\n    public\
    \ function getValue1() {\n        return $this->value1;\n    }\n}\n\nclass MyDerivedClass\
    \ extends MyBaseClass {\n    protected $value2 = null;\n\n    public function\
    \ __construct($value1 = null,\n        $value2 = null) {\n        if ($value1\
    \ !== null) {\n            parent::__construct($value1);\n            if ($value2\
    \ !== null) {\n                $this->value2 = $value2;\n            }\n     \
    \   }\n    }\n\n    public function getValue2() {\n        return $this->value2;\n\
    \    }\n}\n\n$c = new MyDerivedClass('abc', 'def');\necho '1: ', $c->getValue1(),\
    \ ', 2: ', $c->getValue2();\n?>\n```\n\n*使用 PHP 实现继承（extends.php）*\n\n**注意：**\
    \ PHP 不支持多重继承，因此一个类只能（恰好）从另一个类派生。当然，你可以让类 B 从类 A 派生，再让类 C 从类 B 派生，这样类 C 也会继承 A\
    \ 中所有公共（public）和保护（protected）方法。\n\n## 使用抽象类和接口\n\n```\nabstract class MyAbstractBaseClass\
    \ {\n}\n```\n\nPHP 还支持另外两种继承方式：抽象类和接口。这两种方式很相似，但差异至关重要。它们的共同目标是为派生类提供一种约定或蓝图：基类（或后续会讨论的多个基类）定义新类中应包含哪些方法。\n\
    \n使用抽象类时，继承方式与之前相同，使用 `extends` 关键字。不过，新增之处在于基类通过 `abstract` 关键字被定义为抽象类。同时，抽象类中的一组方法也可以被标记为\
    \ `abstract`，但这些方法不包含任何代码：\n\n```\nprotected abstract function myMethod();\n```\n\
    \n派生类现在必须实现这些方法，使用相同的签名，以及相同（或至少限制更宽松）的可见性设置。例如，如果抽象基类定义了一个抽象 protected 方法，派生类需要将该方法实现为\
    \ protected 或 public。如果使用了类型提示，这些也必须完全相同。\n\n如果抽象类还包含其他未声明为 `abstract` 的方法，只要它们是\
    \ protected 或 public，也会像普通类一样被继承：\n\n```php\n<?php\nabstract class MyAbstractBaseClass\
    \ {\n    protected $value1 = null;\n    protected $value2 = null;\n\n    protected\
    \ function getValue1() {\n        return $this->value1;\n    }\n\n    protected\
    \ function getValue2() {\n        return $this->value2;\n    }\n\n    protected\
    \ abstract function dumpData();\n}\n\nclass MyAbstractClass extends MyAbstractBaseClass\
    \ {\n    public function __construct($value1 = null,\n        $value2 = null)\
    \ {\n        if ($value1 !== null) {\n            $this->value1 = $value1;\n \
    \           if ($value2 !== null) {\n                $this->value2 = $value2;\n\
    \            }\n        }\n    }\n\n    public function dumpData() {\n       \
    \ echo '1: ', $this->getValue1(), ', 2:',\n        $this->getValue2();\n    }\n\
    }\n\n$c = new MyAbstractClass('ghi', 'jkl');\n$c->dumpData();\n?>\n```\n\n*使用抽象类（abstract.php）*\n\
    \n与普通类一样，抽象类也仅支持单继承。\n\n另一种“大同小异”的方式则使用接口。接口看起来像一个普通 PHP 类，但使用 `interface` 关键字而不是\
    \ `class`。接口完全不包含任何实现，只有函数签名。所有这些函数都必须是 public。\n\n实际的类现在从这个接口“继承”；但在这种上下文中，我们说该类实现了（implements）这个接口。这一点通过\
    \ `implements` 关键字来体现，它取代了 `extends`。\n\n其他规则与抽象类非常相似：必须实现接口中的所有方法，函数签名需要保持一致（包括可见性级别，反正都是\
    \ public）。额外的好处是，一个类可以同时实现多个接口，只要所涉及的所有接口具有不同的方法名。\n\n下面的代码创建了两个接口，然后在同一个类中实现这两个接口：\n\
    \n```php\n<?php\n\ninterface MyInterface1 {\n    public function getValue1();\n\
    \    public function getValue2();\n}\n\ninterface MyInterface2 {\n    public function\
    \ dumpData();\n}\n\nclass MyInterfaceClass implements MyInterface1, MyInterface2\
    \ {\n    protected $value1 = null;\n    protected $value2 = null;\n\n    public\
    \ function __construct($value1 = null,\n        $value2 = null) {\n        if\
    \ ($value1 !== null) {\n            $this->value1 = $value1;\n            if ($value2\
    \ !== null) {\n                $this->value2 = $value2;\n            }\n     \
    \   }\n    }\n\n    public function getValue1() {\n        return $this->value1;\n\
    \    }\n\n    public function getValue2() {\n        return $this->value2;\n \
    \   }\n\n    public function dumpData() {\n        echo '1: ', $this->getValue1(),\
    \ ', 2:', $this->getValue2();\n    }\n}\n\n$c = new MyInterfaceClass('mno', 'pqr');\n\
    $c->dumpData();\n?>\n```\n\n## 防止继承与重写\n\n```\nfinal class MyFinalBaseClass {}\n\
    public final function myMethod() {}\n```\n\n有些类你不希望被继承（例如，如果它们包含关键功能，并且你不希望其他开发人员覆盖这些重要方法）。PHP\
    \ 的 `final` 关键字正适合这项任务。你可以将一个类设为 final（这样根本不可能继承它），也可以将一个方法声明为 final（这样代码就无法覆盖它）。因此，下面的代码会导致异常，如图\
    \ 4.1 所示：\n\n```php\n<?php\nclass MyFinalBaseClass {\n    public final function\
    \ getCopyrightNotice() {\n        return '&copy; by Original Author';\n    }\n\
    }\n\nclass MyFinalClass extends MyFinalBaseClass {\n    function getCopyrightNotice()\
    \ {\n        return '&copy; by me!';\n    }\n}\n?>\n```\n\n*使用 final 关键字防止覆盖（final.php）*\n\
    \n![](img/2862989e5dc7f1b1d0bc64321737f084_120_0.png)\n\n图 4.1 final 方法无法被覆盖。\n\
    \n当然，如果你是唯一的开发人员，将类或方法设为 final 似乎没有必要。然而，你应当时刻做好准备，也许开发团队会扩大，或者你会将代码库重构为一个供他人使用的库。\n\
    \n## 使用自动加载\n\n```\nspl_autoload_register('myAutoloadFunction');\n```\n\n当你使用一个类时，它必须已被定义；否则\
    \ PHP 会抛出错误。不过，如果某个类在使用时尚未可用，还有第二次机会。`spl_autoload_register()` 函数会注册一个函数，当 PHP\
    \ 代码尝试使用一个尚未注册的类时，这个函数就会被调用。在调用注册函数之后，使用未定义类的代码会再次运行。如果此时类可用，那就很好；否则，就会发生通常的错误。\n\
    \n一种常见模式是：对包含类的文件使用固定的命名规则，并将类放在指定的目录中。例如，类 MyClass 位于文件 /classes/MyClass.class.php\
    \ 中。在这种情况下，下面的自动加载函数会按需加载该类：\n\n```php\n<?php\nfunction myAutoloadFunction($classname)\
    \ {\n    if (preg_match('/^[a-zA-Z_\\x7f-\\xff][a-zA-Z0-9_\\x7f-\\xff]*$/', $classname))\
    \ {\n        //check for valid classname\n        require_once \"/path/to/classes/$classname.class.php\"\
    ;\n    }\n}\n\nspl_autoload_register('myAutoloadFunction');\n?>\n```\n\n*自动加载类（autoload.php）*\n\
    \n因此，例如下面的调用\n\n`$c = new UnknownClass();`\n\n会转而调用 `myAutoloadFunction()`，并将\
    \ `UnknownClass` 作为 `$classname` 参数的值传入。如果你多次调用 `spl_autoload_register()`，所有自动加载函数都会被注册，因此\
    \ PHP 会依次调用它们，直到目标类最终被定义——或者直到所有这些函数都被调用完毕。\n\n**注意：** `spl_autoload_register()`\
    \ 函数是 PHP 5.1.2 中作为 SPL（标准 PHP 库）的一部分引入的。以前，你必须编写一个函数\n\n"
