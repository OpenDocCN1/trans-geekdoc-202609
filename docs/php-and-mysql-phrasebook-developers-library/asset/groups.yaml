    # # Introduction for

    ## the Second

    ## Edition


    When we worked on the concept of the Phrasebook series a few years ago, we were
    quite confident that the books planned for the first batch would do well. Looking
    back now, with a dozen books still out there, and quite a number of foreign-language
    translations, I can say we did *really* well. It also makes me personally quite
    proud that the pilot, the *PHP Phrasebook*, still stands the test of time, and
    I am happy to see this book quite often when I am visiting a customer''s site.


    However, PHP has progressed quite a bit in the past few years. PHP 4 has finally
    vanished, and although the promised PHP 6 never materialized, PHP versions 5.3
    and 5.4 added many new features, a lot of them originally planned for the next
    major PHP update.


