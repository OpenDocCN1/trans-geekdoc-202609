    PHP also supports several functions related to printf():


    +   - sprintf() works like printf(), but returns the string and does not print
    it.

    +   - vprintf() works like printf(), but expects the values for the placeholders
    in the string to be in the form of an array.

    +   - vsprintf() is a mixture of sprintf() and vprintf(): The placeholder values
    are provided in an array, and the function returns the string but does not print
    it.


