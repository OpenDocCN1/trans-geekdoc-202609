    \n从面向对象编程的角度来看，有趣的是可以拦截序列化和反序列化过程。例如，假设你的类\n\n包含一个不应（或不能）被序列化的属性（也许是一个数据库句柄）。理想情况下，该属性应在序列化前移除，并在反序列化时重新创建。\n\
    \nPHP 帮助我们完成此任务并提供了以下两个“魔术”方法名称。如果你的类包含这些方法，它们将被相应执行：\n\n- __sleep()—需要返回一个包含所有待序列化属性的数组，也可执行清理操作\n\
    - __wakeup()—在反序列化后被调用，可用于重新设置属性\n\n以下代码列表显示了关闭和重置数据库连接的典型实现。序列化并反序列化后，GUID 相同，但数据库连接已重新建立：\n\
    \n```php\n<?php\nclass MySerializableClass {\n    public $guid = null;\n    public\
    \ $db = null;\n\n    public function __construct() {\n        $this->guid = uniqid();\n\
    \        $this->connectDb();\n    }\n\n    private function connectDb() {\n  \
    \      $this->db = new MySQLi('server', 'user',\n        'password', 'db');\n\
    \    }\n\n    public function __sleep() {\n        $this->db->close();\n     \
    \   return array('guid');\n    }\n\n    public function __wakeup() {\n       \
    \ $this->connectDb();\n    }\n}\n\n$c1 = new MySerializableClass();\necho 'Before:\
    \ ', $c1->guid;\n$s = serialize($c1);\n$c2 = unserialize($s);\necho '; after:\
    \ ', $c2->guid;\n?>\n```\n\n序列化和反序列化对象 (serialize.php)\n\n**注意：** 反序列化对象时，你需要确保该类存在；否则，PHP\
    \ 会在结果中使用令人讨厌的“特殊” PHP Incomplete Class Name 类。\n\n**提示：** PHP 支持多种魔术方法和函数。在线手册在\
    \ http://php.net/oop5.magic 处列出了一个列表。\n\n## 实现单例\n\n```php\nif (self::$instance\
    \ == null) {\n    self::$instance = new self;\n}\nreturn self::$instance;\n```\n\
    \n一种常见——但也备受批评——的设计模式是单例模式。它并不完全容易实现，因此我们专门为其创建制定了一句话。\n\n使用单例模式的主要目标是无论你实例化某个类多少次，你都只会得到一个对象。例如，在创建数据库连接时这可能很有用：通常，你只需要一个可以在代码中重复使用的连接。\n\
    \n一种常见的 PHP 单例模式实现使用语言的几个面向对象特性来防止一个类的多个不同实例。首先，类构造函数不可用，因为我们将其设为私有：\n\n```php\n\
    private function __construct() {\n}\n```\n\n创建两个类实例的另一种方法是使用一个实例然后克隆它。这也可以通过将\
    \ __clone() 魔术方法设为私有来避免：\n\n```php\nprivate function __clone() {\n}\n```\n\n因此，现在我们无法创建类的多个实例，甚至无法创建一个实例。因此，我们引入一个方法来为我们提供类实例。在类内部，我们可以调用类构造函数——私有可见性允许这样做。然后类实例将存储在静态且私有的类成员中。因此，虚拟实例化方法首先检查我们是否已在该静态属性中存储了类实例。如果是，则返回实例；否则，代码会创建一个新的（且唯一的）实例：\n\
    \n```php\nstatic private $instance = null;\n\nstatic public function getInstance()\
    \ {\n    if (self::$instance == null) {\n        self::$instance = new self;\n\
    \    }\n    return self::$instance;\n}\n```\n\n以下代码列表包含单例类的完整语法：\n\n```php\n<?php\n\
    class PHPSingleton{\n    static private $instance = null;\n\n    static public\
    \ function getInstance() {\n        if (self::$instance == null) {\n         \
    \   self::$instance = new self;\n        }\n        return self::$instance;\n\
    \    }\n\n    private function __construct() {\n    }\n    private function __clone()\
    \ {\n    }\n}\n?>\n```\n\n*实现单例 (singleton.php)*\n\n**注意：** 如前所述，单例模式有一些缺点。代码通常更难测试，因为单例类需要是全局的并为应用程序添加状态。如同往常一样，因人而异。\n\
    \n## 使用命名空间\n\nPHP 5.3 的一个主要新特性是命名空间的引入。命名空间是用于分组相关功能并避免名称冲突的工具。想象一下你编写了一个通用名称的函数，例如\
    \ showInfo()。同一项目的另一位开发人员编写了不同的函数但使用了相同的名称。通常，你会为函数名添加前缀使其唯一，这会导致令人讨厌的、非常长的标识符，如\
    \ Project_Module Submodule showInfo()。命名空间可以在这里提供帮助：你以命名空间的形式提供上下文；在该命名空间内，showInfo()\
    \ 是唯一的；其他开发人员使用其他命名空间。最终，这促进了功能的封装。\n\n命名空间的主要关键字是——惊喜！——namespace。namespace 关键字必须是\
    \ PHP 页面中的第一个命令（可选注释之后），甚至不能被 HTML 标记前置。如果你想结构化命名空间，你可以使用（有点不寻常的）反斜杠字符作为分隔符来创建层次结构：\n\
    \n```php\nnamespace Project\\Module\\Submodule;\n```\n\n此命名空间现在对整个文件有效。如果你在此文件中创建\
    \ showInfo() 方法，并将该文件包含在另一个 PHP 脚本中，则可以使用以下代码执行该方法：\n\n```php\nProject\\Module\\\
    Submodule\\showInfo();\n```\n\n要在一个文件中定义多个命名空间，你可以使用多个 namespace 语句；然而首选的方式是使用大括号：\n"
