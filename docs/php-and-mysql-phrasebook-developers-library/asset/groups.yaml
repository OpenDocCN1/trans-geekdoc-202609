  - '[PAGE 174]


    # Remembering Users (Cookies and Sessions)


    Hypertext Transfer Protocol (HTTP) is a stateless protocol. Put simply, a client
    (Web browser) connects to a Web server, sends a request, and gets a response.
    Then, the connection is closed. The consequence is the next time the same client
    sends a request to the same Web server, it is a new request, so the Web server
    cannot identify the caller. This is, of course, a problem for applications in
    which state must be maintained (for instance, e-commerce applications with a shopping-cart
    functionality).


    However, you can overcome this limitation in several ways. The basic idea is to
    send some information with the HTTP response; to try to achieve that, this information
    is sent back with all subsequent requests to that server. The following possibilities
    exist:


    +   - Sending the data via POST (that is, a form is required each time)'
  - '[PAGE 175]


    +   - Sending the data via GET (that is, by appending this information to the
    request''s uniform resource locator [URL])

    +   - Sending the data as part of the HTTP header (in the form of a cookie)


    In real-world projects, one of two methods is used: sessions (via GET or cookies)
    and cookies.


    # Understanding Cookies


    A cookie is sent as part of the HTTP header and is basically a name-value pair.
    Their main disadvantage is it is possible to deactivate cookies in the Web browser
    (and also to filter them out in proxy servers). Some people think cookies create
    privacy issues. Part of this might have been caused by an article written by John
    Udell in March 1997, in which he wrote that every cookie can be read from every
    Web server, thus there is no privacy. This caused quite a stir, although, unfortunately,
    the correction two months later did not get that amount of attention.


    The fact is that cookies have some limitations:


    +   - Cookies are tied to domains, usually the domain that sent the cookie.

    +   - Cookies can be tied to paths on the Web server.

    +   - A cookie contains only text information, 4096 bytes at max (including the
    cookie name and the = character between the name and value).

    +   - Browsers must only accept up to 20 cookies per domain and 300 cookies in
    total (although some browsers accept more).'
  - '[PAGE 176]


    **NOTE:** The (unofficial) cookie specification goes back to Netscape and has
    been archived at http://curl.haxx.se/rfc/cookie_spec.html. There have been attempts
    to create a special Request For Comment (RFC) for next-generation cookies, but
    this hasn''t found any reasonable browser support yet.


    Cookies are sent as part of the HTTP header. If a cookie is set, the HTTP header
    entry Set-Cookie is created. The name and value of the cookie (both strings) follow
    and, optionally, further information such as expiration date, domain, and path
    of the cookie. For instance, when visiting www.php.net/, the PHP Web site sends
    this header entry. (Your mileage may vary, especially in terms of the language
    and IP address used.)


    ```

    Set-Cookie: COUNTRY=DEU%2C84.154.17.84; expires=Thu, 17-May-12 15:23:29 GMT; path=/;
    domain=.php.net

    ```


    When the browser (or the user) accepts the cookie, it is then sent back to the
    server in the HTTP header Cookie:


    ```

    Cookie: COUNTRY=DEU%2C84.154.17.84

    ```


    **TIP:** To actually see the HTTP headers, you could use special extensions to
    standard Web browsers. For Mozilla browsers (including Firefox), the LiveHTTPHeaders
    extension available at http://livehttpheaders.mozdev.org/ is a real time-saver.
    Users of Microsoft Internet Explorer might be interested in installing ieHTTPHeaders,
    an Explorer bar available from www.blunck.info/iehttpheaders.html. The built-in
    Web'
