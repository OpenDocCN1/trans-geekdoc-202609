    settings and the current session ID:


    ```

    <input type="hidden"

    name="PHP_SESSION_UPLOAD_PROGRESS"

    value="ktgbht0abtnb897fv3j4pr16g6" />

    ```


    Then, when the user submits the form and thus uploads the file, $_SESSION[''upload_progress_ktgbht0abtnb897fv3j4pr16g6'']
    contains information about the file upload in form of an array, including the
    start time, the total number of bytes expected by the server, and how much of
    that has already been transferred from the client. The name of the $_SESSION key
    is generated by the session.upload_progress.prefix value and the value in the
    hidden form field.


    For testing purposes, you might want to open up a PHP file in another tab that
    continuously outputs the data in that $_SESSION field. Figure 5.5 shows a possible
    output.


