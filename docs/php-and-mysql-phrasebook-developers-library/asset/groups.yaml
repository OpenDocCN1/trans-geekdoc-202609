    ```\n\n使用自然字符串顺序比较对 IP 地址排序（natsort.php）\n\n使用 sort() 对 IP 地址排序实际上并不奏效，因为如果按字符串排序，'100.200.300.400'（它故意是一个无效的\
    \ IP）会小于 '50.60.70.80'。此外，字符串中不仅包含数字，因此按数字排序也行不通。\n\n这种情况需要一种所谓的自然排序，它由 Martin\
    \ Pool 的 Natural Order String Comparison 项目实现，项目地址是 http://sourcefrog.net/projects/natsort/。PHP\
    \ 的 natscasesort() 函数就使用了该算法。根据其描述，它会像人类排序一样。当需要考虑大小写时，可以使用 natsort()。前面的代码展示了后者。\n\
    \n**注意：** 在内部，natsort() 使用 strnatcmp()（而 natscasesort() 使用 strnatcasecmp()），它们会对两个字符串进行“自然”比较。通过多次调用此函数，数组元素会被排列到正确的顺序。\n\
    \n## 对任意内容排序\n\n```php\n<?php\nfunction compare($a, $b) {\n    return $a - $b;\n\
    }\n\n$a = array(4, 1345, 31, 222);\nusort($a, 'compare');\necho implode(' < ',\
    \ $a);\n?>\n```\n\n如果你不想局限于 PHP 提供的标准排序功能，可以编写自己的排序算法。在内部，PHP 使用快速排序算法对数组中的值进行排序。要使其工作，PHP\
    \ 必须知道两个值是否相等；在后一种情况下，PHP 需要找出哪个值更大。因此，要实现自定义排序，只需一个接受两个参数并返回以下结果的函数：\n\n- 如果第一个参数小于第二个参数，则返回负值\n\
    - 如果两个参数相等，则返回 0\n- 如果第二个参数小于第一个参数，则返回正值\n\n该函数的名称必须作为字符串传递给 usort()；或者，如果你使用\
    \ PHP 5.3 或更高版本，也可以使用类似于 JavaScript 的匿名函数。其余工作由 PHP 完成，如代码所示。其中使用的比较函数是一种非常简单的数值排序方式。通过将两个值相减，该函数返回所需的结果：如果第一个参数大于第二个参数，则返回正数；如果两个参数相等，则返回\
    \ 0；否则返回负数。\n\n## 使用外语排序\n\n```php\n<?php\nfunction compare($a, $b) {\n    if\
    \ ($a == $b) {\n        return 0;\n    } else {\n        for ($i = 0; $i < min(strlen($a),\
    \ strlen($b));\n            $i++) {\n            $cmp = compareChar(substr($a,\
    \ $i, 1),\n                substr($b, $i, 1));\n            if ($cmp != 0) {\n\
    \                return $cmp;\n            }\n        }\n        return (strlen($a)\
    \ > strlen($b) ? 1 : 0);\n    }\n}\n\nfunction compareChar($a, $b) {\n    // ...\n\
    }\n\n$a = array('Frédéric', 'Froni', 'Frans');\nusort($a, 'compare');\necho implode('\
    \ < ', $a);\n?>\n```\n\n对包含特定语言字符的数组排序\n（languagesort.php；摘录）\n\n只要只涉及标准 ASCII\
    \ 字符，排序效果就很好。然而，一旦特殊语言字符出现，排序就会产生不理想的效果。例如，对数组 `['Frans', 'Frédéric', 'Froni']`\
    \ 调用 sort() 会将 `'Frédéric'` 排在最后，因为 `é` 字符的字符代码比 `o` 大得多。\n\n对于这种特殊情况，PHP 没有提供专门的排序方法；不过，你可以使用\
    \ strnatcmp() 来模拟这一行为。思路是为某些特殊字符定义一个新的顺序；然后在比较函数中使用这个顺序来判断哪个字符“更大”、哪个“更小”。\n\n\
    你首先需要一个能对单个字符进行排序的函数：\n\n```\nfunction compareChar($a, $b) {\n    $characters\
    \ = 'ÁÁÁBCÇDÉÉFGHIIĴKLMNOÓÓPQRSTUÚÚVWXZ';\n    $characters .= 'ááábççdeééfghiiĵjklmnoóóopqrstuúúvwxyz';\n\
    \    $pos_a = strpos($characters, $a);\n    $pos_b = strpos($characters, $b);\n\
    \    if ($pos_a === false) {\n        if ($pos_b === false) {\n            return\
    \ 0;\n        } else {\n            return 1;\n        }\n    } elseif ($pos_b\
    \ === false) {\n        return -1;\n    } else {\n        return $pos_a - $pos_b;\n\
    \    }\n}\n```\n\n然后，主排序函数逐字符调用 compareChar()，直到发现差异为止。如果没有发现差异，则较长的字符串被认为是“更大”的。如果两个字符串完全相同，则返回\
    \ 0。本片段开头的代码展示了比较函数。该代码的结果正如期望：Frans < Frédéric < Froni。\n\n从 PHP 5.3 开始，ext/intl\
    \ 扩展也提供了自然语言排序机制。如果安装了该扩展（可能还需要来自 http://site.icu-project.org/ 的 ICU 库集），你首先需要创建一个所谓的排序器（collator），它需要一个区域设置（例如\
    \ `en_US`、`en_CA`、`en_GB`、`fr_FR` 或 `de_AT`）。然后，你可以调用 sort() 和 asort() 方法，它们与\
    \ PHP 对应的函数类似，但会考虑区域设置信息：\n\n```php\n$a = array('Frédéric', 'Froni', 'Frans');\n\
    $coll = new Collator('fr_FR');\n$coll->sort($a);\necho implode(' ', $a);\n```\n\
    \n使用区域设置信息对数组排序（collator.php）\n\n## 对所有数组元素应用效果\n\n```php\n$a = array_map('sanitize',\
    \ $a);\n```\n\n```php\n<?php\nfunction sanitize($s) {\n    return htmlspecialchars($s);\n\
    }\n\n$a = array('harmless', '<bad>', '>>click here<<');\n$a = array_map('sanitize',\
    \ $a);\necho implode(' ', $a);\n?>\n```\n\n对数组的所有元素应用 htmlspecialchars()（array_map.php）\n\
    \n"
