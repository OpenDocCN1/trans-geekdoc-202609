    \ in the resultset as an associative array.\n- pg_fetch_object() returns the current\
    \ row in the resultset as an object.\n- pg_fetch_row() returns the current row\
    \ in the resultset as a numeric array.\n- pg_fetch_all() returns the complete\
    \ resultset as an array of associative arrays.\n\nThe preceding code uses pg_fetch_row()\
    \ to read out all data from the quotes table.\n\nAlternatively, pg_select() works\
    \ similarly to pg_insert() and pg_update(). Just provide a database handle, a\
    \ table name, and maybe a WHERE clause in the form of an array, and you get the\
    \ complete resultset as an array of (associative) arrays:\n\n```php\n$data = pg_select($db,\
    \ 'quotes');\n```\n\n## Connecting to Oracle\n\n```php\n<?php\nif ($db = @oci_connect('scott',\
