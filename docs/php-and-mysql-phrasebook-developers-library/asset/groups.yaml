    );\necho implode(', ', array_filter($values, 'checkMail'));\n?>\n```\n\n*过滤有效的电子邮件地址（array_filter.php）*\n\
    \n假设你从 HTML 表单、文件或数据库中获得了一堆值，并且想要筛选出哪些值实际上可用、哪些不可用。你可以再次使用 `for`、`foreach` 或 `while`\
    \ 循环来找出感兴趣的值，也可以让 PHP 替你完成大部分工作。在后一种情况下，你需要熟悉 `array_filter()` 函数。它接受两个参数：第一个是要过滤的数组；第二个是函数名（以字符串形式），用于检查数组元素是否合格。该验证函数在成功时返回\
