    \ true);\nxml_set_element_handler($sax, 'sax_start',\n'sax_end');\nxml_set_character_data_handler($sax,\
    \ 'sax_cdata');\nxml_parse($sax, file_get_contents('quotes.xml'), true);\nxml_parser_free($sax);\n\
    ```\n\n简单的 XML API（SAX）是一种解析 XML 文档的方法，但不用于验证它们。\n\n你使用 xml_parser_create() 创建\
    \ SAX 解析器，可选择提供编码作为参数。此解析器可以查看 XML 文件并对各种事件做出反应。以下三个事件是最重要的：\n\n- 元素的开始\n- 元素的结束\n\
    - CDATA 块\n\n然后你可以为这些元素定义处理函数，并使用它们将 XML 转换为其他内容，例如超文本标记语言（HTML）。以下列表展示了这一点，并将\
    \ XML 文件的内容作为项目符号 HTML 列表输出，如图 10.1 所示。函数 xml_set_element_handler() 设置元素的开始和结束的处理程序，而\
    \ xml_set_character_data_handler() 设置 CDATA 块的处理程序。通过 xml_parser_set_option()，你可以配置处理程序，例如忽略空白并将标签名称作为区分大小写处理（然后标签名称不会自动转换为大写字母）。以下代码包含处理函数的代码：\n\
    \n```\nfunction sax_start($sax, $tag, $attr) {\n    if ($tag == 'quotes') {\n\
    \        echo '<ul>';\n    } elseif ($tag == 'quote') {\n        echo '<li>' .\
    \ htmlspecialchars($attr['year']) . '\n        ': ';\n    } elseif ($tag == 'phrase')\
    \ {\n        echo '\"';\n    } elseif ($tag == 'author') {\n        echo ' (';\n\
    \    }\n}\n```\n\n```\n}\nfunction sax_end($sax, $tag) {\n    if ($tag == 'quotes')\
    \ {\n        echo '</ul>';\n    } elseif ($tag == 'quote') {\n        echo '</li>';\n\
    \    } elseif ($tag == 'phrase') {\n        echo '\"';\n    } elseif ($tag ==\
