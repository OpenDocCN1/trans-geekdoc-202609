    | Hidden field | value attribute of field |

    | Radio button | value attribute of selected radio button |

    | Check box | value attribute of check box if checked (or usually "on", if value
    not set) |

    | Selection list | value attribute of selected list element (or caption of selected
    list element, if value not set) |

    | Multiple selection list | value attributes of selected list elements as an array
    (or captions of selected list elements as an array, if values not set) |

    | Submit button | value attribute of Submit button, if this one was used to send
    the form (important if there is more than one Submit button) |


