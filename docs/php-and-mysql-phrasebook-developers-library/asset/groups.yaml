    # Using Ajax


    Wikipedia lists several dozen different meanings for the term Ajax, including
    a soccer team from the Netherlands, two figures in Homer''s Iliad, and a house-hold-cleaning
    product. However, since 2005, Ajax also stands for Asynchronous JavaScript + XML.
    The technology is far from new (the underlying technology, XML HTTP requests from
    JavaScript, is supported by recent versions of Internet Explorer, Firefox, Safari,
    and Chrome—also, XML is not required at all for this), but only after this weird
    term was coined did people actually start using it.


    The basic principle is that JavaScript can now call a remote server and then process
