  mdcn: "\n## 第二版导言\n\n几年前我们构思 Phrasebook 系列时，对首批计划出版的书籍会取得好成绩相当有信心。如今回头看，仍有十几本书在世，并且有相当数量的外语译本，我可以说我们做得*真的*很好。令我个人感到相当自豪的是，试点作品\
    \ *PHP 短语手册* 依然经受住了时间的考验，而且当我拜访客户现场时，我很开心经常能看到这本书。\n\n然而，过去几年 PHP 已有了相当大的进展。PHP\
    \ 4 最终已消失，虽然备受期待的 PHP 6 从未实现，但 PHP 5.3 和 5.4 版本增加了许多新功能，其中很多原本是为下一个主要 PHP 更新而计划的。\n\
    \n我们借此机会将 *PHP 短语手册* 更新到 PHP 的最新发展。由于原书获得了非常出色的反馈，我们尝试保持原有的结构和热门短语不变，但我们增加了数十个新短语和更新的短语，突出了\
    \ PHP 5.3 和 5.4 的许多新可能性。为了向后兼容，我们始终提及新功能是在哪个 PHP 版本中引入的，并且在可能的情况下，如果我们认为合适，我们会提供不一定需要最新最好的代码。\n\
    \n书名也有了一些变化。第一版中我们涵盖了许多相关的数据库，现在仍然如此；然而，MySQL 仍然是 PHP 开发的事实标准数据库，因此它拥有自己的章节，并在书名页上占有一席之地。\n\
    \n我很感激许多读者提供的建议、勘误和一般反馈。当然，对本书这一版的任何反馈也都非常受欢迎。网站 http://php.phrasebook.org/ 包含本书的代码示例、勘误（在我得知后会尽快更新）以及联系信息。我期待听到你们的来信！\n\
    \n和大多数书籍一样，这是一项团队合作。Mark Taber 当年监督 Phrasebook 系列的创建，现在仍在团队中，并担任本版的项目经理。我仍然记得我们在极少数真正面对面见面的机会之一的早餐时起草新版的情况。（下次我请客。）我很高兴我的老朋友\
    \ John Coggeshall 愿意担任技术审阅者——并且几次挽救了我的声誉。还要“谢谢”Pearson 的巫师团队，他们把我的手稿变成专业的书籍。感谢我的家人和朋友，他们接受我的职业偶尔需要的奇怪工作时间。\n\
    \n## 操作字符串\n\nPHP 支持的所有数据类型中，字符串数据可能是使用最频繁的一种。原因之一是，在向客户端发送内容时，某时某刻需要对某物进行字符串表示。\n\
    \nPHP 提供了大量适用于字符串的函数，几乎有 100 个。此外，正则表达式在查找字符串中的某些模式时也很有用。然而在现实生活中，实际使用的函数只占很小一部分。它们大多数都值得拥有忠实的粉丝群，但一些被低估的函数应该得到更多关注。本章中的短语提供了两者兼顾的良好组合：标准应用以及相当不寻常但非常有用的字符串处理方式。\n\
    \n### 比较字符串\n\n```\nstrcmp($a, $b)\nstrcasecmp($a, $b)\n```\n\n```php\n<?php\n\
    $a = 'PHP';\n$b = 'php';\necho 'strcmp(): ' . strcmp($a, $b) . '<br />';\necho\
    \ 'strcasecmp(): ' . strcasecmp($a, $b);\n?>\n```\n\n*比较字符串 (compare.php)*\n\n\
    输出如下：\n\n```\nstrcmp(): -32\nstrcasecmp(): 0\n```\n\n比较字符串似乎是一项简单的任务——使用 == 运算符进行隐式类型转换（因此\
    \ '1' == 1 返回 true）或使用 === 运算符进行类型检查（因此 '1' === 1 返回 false）。然而，第一种方法相当有缺陷，因为类型转换并不总是转换为字符串。例如，1\
    \ == '1twothree' 也返回 true；两个值都被转换为整数。因此，=== 才是正确的方法。\n\n然而，PHP 还提供了一些功能比仅仅比较字符串并返回\
    \ true 或 false 更强大的函数。strcmp() 在作为第一个参数传递的字符串大于第二个参数时返回正值，小于时返回负值。如果两个字符串相等，strcmp()\
    \ 返回 0。如果不需要区分大小写，则使用 strcasecmp()。它与 strcmp() 工作方式相同，但不区分大小写字母。\n\n这两个函数可用于排序数组。有关自定义数组排序的更多信息，请参阅第\
    \ 2 章，“使用数组。”\n\n### 检查用户名和密码\n\n```php\n<?php\n$user = (isset($_GET['user']))\
    \ ? $_GET['user'] : '';\n$pass = (isset($_GET['pass'])) ? $_GET['pass'] : '';\n\
    \nif (\n    (strtolower($user) === 'damon' && $pass === 'secret') ||\n    (strtoupper($user)\
    \ === 'SHELLEY' && $pass === 'verysecret') ||\n    (strcasecmp($user, 'Christian')\
    \ == 0 && strcmp($pass, 'topsecret') == 0)\n) {\n    echo 'Login successful.';\n\
    } else {\n    echo 'Login failed.';\n}\n?>\n```\n\n*通过比较字符串验证登录 (comparelogin.php)*\n\
    \n在验证用户名和密码时（例如，在支持 HTML 登录表单的脚本中），网络上似乎形成了两种事实标准：\n\n- 密码始终区分大小写。它必须以设置时完全相同的方式提供。\n\
    - 然而，用户名不区分大小写。\n\n因此，用户名必须在不考虑大小写的情况下进行比较。这可以通过使用 `strcasecmp()` 来完成——参见上一条短语——或先将提供的用户名和真实用户名都转换为小写字母（或大写字母）。这由函数\
    \ `strtolower()` 或 `strtoupper()` 完成。上面的代码展示了使用 `strcmp()`/`strcasecmp()` 以及比较运算符\
    \ `==` 的示例。\n\n根据调用脚本的统一资源定位符（URL）中提供的数据，登录要么失败要么成功。例如，以下 URL 成功登录用户。（你需要更改 *服务器名*\
    \ 部分。）\n\n```text\nhttp://servername/comparelogin.php?user=CHRISTIAN&pass=topsecret\n\
    ```\n\n相比之下，以下登录会失败：\n\n```text\nhttp://servername/comparelogin.php?user=Christian&pass=TopSecret\n\
