    This works for HTTP resources (see previous phrase), too!


    PHP also comes with built-in support for FTP and a special set of functions that
    implement the complete FTP functionality defined in the associated Request For
    Comment (RFC). In the Windows distributions, this is enabled by default, whereas
    on other systems, PHP has to be configured with the switch --enable-ftp. Then,
    using the FTP server usually consists of the following steps:


    +   1. Connect to the server using ftp_connect().

    +   2. Log in using ftp_login().

    +   3. Go to the target directory using ftp_chdir().

    +   4. Read a file (ftp_get()) from or write a file (ftp_put()) to the FTP server.

    +   5. Close the connection using ftp_close().


    Because reading is more common than writing, the following shows the former task
