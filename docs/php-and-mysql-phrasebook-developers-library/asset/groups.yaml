    \ HTML 编码；如果是数组，则递归函数对自身调用该数组。以下代码实现了这一点，图 2.6 显示了结果：\n\n```php\n<?php\n\nfunction\
    \ sanitize_recursive($s) {\n    if (is_array($s)) {\n        return(array_map('sanitize_recursive',\
    \ $s));\n    } else {\n        return htmlspecialchars($s);\n    }\n}\n\n$a =\
    \ array(\n    'harmless' =>\n        array('no', 'problem'),\n    'harmful' =>\n\
