    }\n?>\n```\n\n*使用 SPL 将对象当作数组使用（splArray.php）*\n\nSPL（标准 PHP 库）是 PHP 中最被低估的特性之一。它基本上提供了一整套接口。如果你创建的类实现了其中一个接口，就可以在类中使用标准的\
    \ PHP 函数。http://php.net/spl 上的文档并不总是像你期望的那样详细，但它确实为你提供了一些很好的指引，告诉你有哪些可能性。\n\n\
    作为简单示例，我们将创建一个类（关于面向对象编程（OOP）的更多内容，请参阅第 4 章），该类实现两个接口：\n\n- **ArrayAccess**——允许访问对象集合中的各个元素（在我们的代码中是一个简单数组）\n\
