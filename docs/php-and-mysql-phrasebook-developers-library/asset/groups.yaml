    \n如果你使用 Symfony 或 Zend Framework 等框架，你在那里也会有额外的数据库访问选项。\n\n## 使用 XML\n\n在炒作之后，可扩展标记语言（XML）现在几乎在任何地方都被真正使用。备受关注的应用是\
    \ Web 服务，这项技术在第 9 章“使用其他数据库”中有详细介绍。然而，XML 也可用于其他地方。它是存储任何类型数据的良好格式。\n\n使用 XML\
    \ 背后的任务始终相同：从 XML 读取数据并向其中写入数据。因此，本章重点介绍这些任务并展示如何实现它们。\n\n不幸的是，PHP 4 的 XML 支持\
    \ somewhat 有限。一些扩展被证明并不十分稳定。随着 PHP 5 和重新设计的 XML 支持，这一情况发生了巨大变化。因此，我们在本章（以及本书其余部分）中完全省略了\
