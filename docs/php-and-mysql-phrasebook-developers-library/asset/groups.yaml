    \n尽管数据库非常常见，但使用文件系统来存储数据可能是一个真正的替代方案。通常，这种方式实现起来更容易。有时它更快，更重要的是，所有托管服务商都启用了文件访问，而数据库支持可能只提供在额外费用下。\n\
