    \ Schwarzenegger</author>\n</quote>\n</quotes>\n```\n\n示例 XML 文件（quotes.xml；摘录）\n\
    \n## 使用 SAX 解析 XML\n\n```\n$sax = xml_parser_create();\nxml_parser_set_option($sax,\
