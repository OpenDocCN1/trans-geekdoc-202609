    - Column access is of type VARCHAR(14) and contains the time stamp of the most\
    \ recent access to the session information.\n\nIt doesn't matter which database\
    \ is used. This chapter uses MySQL and PHP5's new mysqli extension, but it is\
    \ easy to change the code to work with other databases, as well. (See Chapter\
    \ 8, \"Working with MySQL Databases,\" and Chapter 9, \"Working with Other Databases,\"\
    \ for information about using many relevant databases with PHP.)\n\nYou can use\
    \ the PHP function session_set_save_handler() to provide custom functions for\
    \ all relevant six session operations PHP uses internally:\n\n- Opening a session\n\
    - Closing a session\n- Reading a session variable\n- Writing a session variable\n\
    - Destroying a session\n- Cleaning up (garbage collection [for example, removing\
    \ old session data from the data store])\n\nFor all six of these operations, the\
