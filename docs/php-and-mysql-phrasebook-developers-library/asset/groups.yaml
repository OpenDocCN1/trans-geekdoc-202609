    imagination.


    Of course, it is easy to find missing phrases in this book. PHP offers so much
    functionality that it is impossible to cover every aspect. Therefore, we had to
    select certain topics of interest—stuff that is relevant in a PHP programmer’s
    everyday work. If you think, however, that something has really been overlooked,
    please let me know (but do also nominate something that should then be removed
    from upcoming editions of this book to make room for the new phrases). I am looking
