  md: "\nAfter a user fills out a form correctly, what do you do with the form data?\
    \ A very intuitive approach that does not require too much setup on the server\
    \ is to write the data into a file on the server.\n\nThe preceding code contains\
    \ a very naive approach: All data is stored in a file on the server. When the\
    \ form is submitted, the file is read in and unserialized into an array. Then,\
    \ the form data is appended to the array. Finally, the array is serialized again\
    \ and written back to the file.\n\nFigure 5.3 shows this file in a text editor.\n\
    \n![](img/2862989e5dc7f1b1d0bc64321737f084_163_0.png)\n\nFigure 5.3 Data written\
    \ into the form (but which can later be unserialized)\n\nNOTE: Of course, race\
    \ conditions could occur, and the file could be simultaneously read by two processes,\
    \ which would result in just one of the two processes appearing in the file. To\
    \ avoid this, you have to implement file locking as shown in Chapter 7.\n\n##\
    \ Sending All Form Data via Email\n\n```\n<?php\nif (isset($_POST['Submit']) &&\n\
    isset($_POST['fieldname']) &&\ntrim($_POST['fieldname']) != '' &&\n$_POST['groupname']\
    \ != '') {\necho '<h1>Thank you for filling out this form</h1>';\n$text = '';\n\
    foreach ($_POST as $name => $value) {\nif (is_array($value)) {\n$text .= sprintf(\"\
    %s: %s\\n\", $name, join(', ', $value));\n} else {\n$text .= sprintf(\"%s: %s\\\
    n\", $name, $value);\n}\n}\nmail('recipient@example.com', 'Form data',\n$text);\n\
    } else {\n?>\n<form method=\"post\" action=\"<?php echo\nhtmlspecialchars($_SERVER['PHP_SELF']);\
    \ ?>\">\n...\n</form>\n<?php\n}\n?>\n```\n\nA more imminent notification of someone\
    \ filling out a form can be implemented by sending form data via email. Of course,\
    \ you can write a custom mail script for each and every form; however, the preceding\
    \ code shows how this can be done universally. Via foreach, all form data is merged\
    \ into a string. Special care is taken of form values that are arrays—this can\
    \ occur with multiple selection lists. Then the form data is mailed to the webmaster;\
    \ just don't forget to change the email address.\n\n## Getting Information about\
    \ File Uploads\n\n```\n<?php\nif (isset($_POST['Submit']) &&\n    isset($_FILES['File'])\
    \ &&\n    is_uploaded_file($_FILES['File']['tmp_name'])) {\nprintf('<p>Error:\
    \ %s<br />\n    Original name: %s<br />\n    File size: %s<br />\n    Temporary\
    \ name: %s<br />\n    MIME type: %s</p>',\n    $_FILES['File']['error'],\n   \
    \ htmlspecialchars($_FILES['File']['name']),\n    $_FILES['File']['size'],\n \
    \   $_FILES['File']['tmp_name'],\n    htmlspecialchars($_FILES['File']['type'])\n\
    );\n} else {\n?>\n<form action=\"<?php echo $_SERVER['PHP_SELF']; ?>\" method=\"\
    post\" enctype=\"multipart/form-data\">\n<input type=\"file\" name=\"File\" />\n\
    <input type=\"submit\" name=\"Submit\" value=\"Submit form\" />\n</form>\n<?php\n\
    }\n?>\n```\n\nWhen you are uploading files to the Web server using `<input type=\"\
    file\" />`, the HTML form has to fulfill two requirements:\n\n- The enctype attribute\
    \ has to be set to \"multipart/form-data\".\n- The method attribute has to be\
    \ set to \"post\".\n\nWithout these settings, the file upload does not work. It\
    \ also does not work if the following information is missing from php.ini:\n\n\
    ```\nfile_uploads = On\n```\n\nBut if it does, retrieving information about the\
    \ file is quite easy: In the (superglobal) array `$_FILES`, you can find the file\
    \ upload form field under its name. Then, the following subkeys provide further\
    \ information about the uploaded file:\n\n- `$_FILES[\"File\"][\"error\"]`—Error\
    \ code (0 in case of success)\n- `$_FILES[\"File\"][\"name\"]`—Original filename\n\
    - `$_FILES[\"File\"][\"size\"]`—Size of the file\n- `$_FILES[\"File\"][\"tmp_name\"\
    ]`—Temporary filename where PHP saved the file\n- `$_FILES[\"File\"][\"type\"\
    ]`—The file's MIME type as sent by the client, not reliable\n\nThe preceding code\
    \ outputs the available file information (see Figure 5.4). The call to `is_uploaded_file()`\
    \ adds an additional layer of security by first checking whether the file has\
    \ really been uploaded by the client.\n\n![](img/2862989e5dc7f1b1d0bc64321737f084_167_0.png)\n\
    \nFigure 5.4 Information about the uploaded file\n\nNOTE: Some caveats apply when\
    \ working with form fields. There is the possibility to provide a maximum file\
    \ length for the uploaded files in a hidden form field; however, this check is\
    \ then executed server side, so it is definitely better if you do that on your\
    \ own in your script, using the \"type\" array subelement.\n\nAlso, do not rely\
    \ on the \"name\" array subelement because this information (the original filename)\
    \ can be forged. Even worse, some browsers do not always send the original filename,\
    \ but the complete path to it. Therefore, always call basename() to extract the\
    \ filename only.\n\nIn our code, we run htmlspecialchars() before outputting any\
    \ of these two pieces of information.\n\n## Moving Uploaded Files to a Safe Location\n\
    \n```\n<?php\n    if (isset($_POST['Submit']) &&\n        isset($_FILES['File']))\
    \ {\n        $move = move_uploaded_file(\n            $_FILES['File']['tmp_name'],\n\
    \            '/tmp/' . basename($_FILES['File']['name'])\n        );\n       \
    \ echo '<h1>';\n        echo ($move) ? 'Moved' : 'Did not move';\n        echo\
    \ ' the file!</h1>';\n    } else {\n?>\n<form action=\"<?php echo $_SERVER['PHP_SELF'];\
    \ ?>\" method=\"post\" enctype=\"multipart/form-data\">\n    <input type=\"file\"\
    \ name=\"File\" />\n    <input type=\"submit\" name=\"Submit\" value=\"Submit\
    \ form\" />\n</form>\n<?php\n}\n?>\n```\n\nWhen a user uploads a file to a PHP\
    \ script using the <input type=\"file\" /> HTML element, PHP stores the file in\
    \ a temporary location (set in the php.ini directive upload_tmp_dir) and deletes\
    \ it upon completion of script execution. Therefore, you have to access the uploaded\
    \ file within the script. To do so, PHP contains the function move_uploaded_file(),\
    \ which moves a file from one location to another. The great thing about move_uploaded_file()\
    \ is that the function first does a\n\nsanity check, whether the filename you\
    \ provide really is an uploaded file or if a malicious user just tried to trick\
    \ you into moving /etc/passwd or C:\\boot.ini somewhere else.\n\nSuppose the path\
    \ /tmp exists and is writable by the Web server and the PHP process. In this case,\
    \ the preceding code moves the uploaded file to this directory, using its original\
    \ filename (and you do not care whether the filename already exists).\n\n## Monitoring\
    \ the Progress of a File Upload\n\n```\nvar_dump($_SESSION[ini_get('session.upload_progress_prefix')\
    \ . 'myUpload']); ?>\n```\n\nAs of the time of writing, web browsers do not contain\
    \ built-in functionality to determine the status of a file upload. Especially\
    \ with large files or slow connections, this information would be very valuable.\n\
    \nMost Web applications today that do show how much of a file has already been\
    \ uploaded use a plug-in technology such as Flash, Silverlight, or Java. Starting\
    \ with PHP version 5.4, it is also possible to determine the status of a file\
    \ upload with server-side means.\n\nThe php.ini file contains configuration options\
    \ for the file upload status feature. These are the most important options:\n\n\
    - session.upload_progress.enabled — Activates file upload tracking, must be set\
    \ to On.\n- **session.upload_progress.prefix**—Key prefix in the $_SESSION array\
    \ where file upload status information will be stored. Defaults to upload_progress_.\n\
    - **session.upload_progress.name**—Name of the POST value, which will contain\
    \ the key suffix in the $_SESSION array where file upload status information will\
    \ be stored. Defaults to PHP_SESSION_UPLOAD_PROGRESS.\n\nNormally when you use\
    \ this feature, you include some JavaScript code that continuously calls a server\
    \ script to find out the update status. For the sake of brevity, we use a much\
    \ simpler approach here.\n\nIn one file, we set up a file upload. PHP automatically\
    \ stores file upload information in the session if the following two conditions\
    \ are met:\n\n- The form must contain a (ideally hidden) form field with the name\
    \ equaling the session.upload_progress.prefix value.\n- The PHP session must have\
    \ been started.\n\nHere is a typical form:\n\n```\n<?php\nsession_start();\n?>\n\
    <form method=\"post\" action=\"\" enctype=\"multipart/form-data\">\n<input type=\"\
    file\" name=\"upload\" />\n<input type=\"hidden\" name=\"<?php echo ini_get('session.upload_progress.name');\
    \ ?>\" value=\"<?php echo session_id(); ?>\" />\n<input type=\"submit\" value=\"\
    Upload\" />\n</form>\n```\n"
  mdcn: "\nAfter a user fills out a form correctly, what do you do with the form data?\
    \ A very intuitive approach that does not require too much setup on the server\
    \ is to write the data into a file on the server.\n\nThe preceding code contains\
    \ a very naive approach: All data is stored in a file on the server. When the\
    \ form is submitted, the file is read in and unserialized into an array. Then,\
    \ the form data is appended to the array. Finally, the array is serialized again\
    \ and written back to the file.\n\nFigure 5.3 shows this file in a text editor.\n\
    \n![](img/2862989e5dc7f1b1d0bc64321737f084_163_0.png)\n\nFigure 5.3 Data written\
    \ into the form (but which can later be unserialized)\n\n注意：当然，可能会发生竞态条件，文件可能被两个进程同时读取，这会导致只有其中一个进程出现在文件中。为避免这种情况，你必须实现如第\
    \ 7 章所示的文件锁定。\n\n## 通过电子邮件发送所有表单数据\n\n```\n<?php\nif (isset($_POST['Submit'])\
    \ &&\nisset($_POST['fieldname']) &&\ntrim($_POST['fieldname']) != '' &&\n$_POST['groupname']\
    \ != '') {\necho '<h1>Thank you for filling out this form</h1>';\n$text = '';\n\
    foreach ($_POST as $name => $value) {\nif (is_array($value)) {\n$text .= sprintf(\"\
    %s: %s\\n\", $name, join(', ', $value));\n} else {\n$text .= sprintf(\"%s: %s\\\
    n\", $name, $value);\n}\n}\nmail('recipient@example.com', 'Form data',\n$text);\n\
    } else {\n?>\n<form method=\"post\" action=\"<?php echo\nhtmlspecialchars($_SERVER['PHP_SELF']);\
    \ ?>\">\n...\n</form>\n<?php\n}\n?>\n```\n\n可以通过发送表单数据到电子邮件来实现对有人填写表单的更及时通知。当然，你可以为每个表单编写自定义的邮件脚本；然而，前面的代码展示了如何通用地完成此操作。通过\
    \ foreach，所有表单数据被合并成一个字符串。对数组形式的表单值给予了特别关注——这可能发生在多选列表中。然后表单数据会被发送给网站管理员；只是不要忘记更改电子邮件地址。\n\
    \n## 获取文件上传信息\n\n```\n<?php\nif (isset($_POST['Submit']) &&\n    isset($_FILES['File'])\
    \ &&\n    is_uploaded_file($_FILES['File']['tmp_name'])) {\nprintf('<p>Error:\
    \ %s<br />\n    Original name: %s<br />\n    File size: %s<br />\n    Temporary\
    \ name: %s<br />\n    MIME type: %s</p>',\n    $_FILES['File']['error'],\n   \
    \ htmlspecialchars($_FILES['File']['name']),\n    $_FILES['File']['size'],\n \
    \   $_FILES['File']['tmp_name'],\n    htmlspecialchars($_FILES['File']['type'])\n\
    );\n} else {\n?>\n<form action=\"<?php echo $_SERVER['PHP_SELF']; ?>\" method=\"\
    post\" enctype=\"multipart/form-data\">\n<input type=\"file\" name=\"File\" />\n\
    <input type=\"submit\" name=\"Submit\" value=\"Submit form\" />\n</form>\n<?php\n\
    }\n?>\n```\n\n当你使用 `<input type=\"file\" />` 向 Web 服务器上传文件时，HTML 表单必须满足两个要求：\n\
    \n- The enctype attribute has to be set to \"multipart/form-data\".\n- The method\
    \ attribute has to be set to \"post\".\n\n如果没有这些设置，文件上传将无法工作。如果 php.ini 中缺少以下信息，也无法工作：\n\
    \n```\nfile_uploads = On\n```\n\n但如果设置了，获取文件信息就非常容易：在（超全局）数组 `$_FILES` 中，你可以在其名称下找到文件上传表单字段。然后，以下子键提供了有关上传文件的更多信息：\n\
    \n- `$_FILES[\"File\"][\"error\"]`—错误代码（成功时为 0）\n- `$_FILES[\"File\"][\"name\"\
    ]`—原始文件名\n- `$_FILES[\"File\"][\"size\"]`—文件大小\n- `$_FILES[\"File\"][\"tmp_name\"\
    ]`—PHP 保存文件的临时文件名\n- `$_FILES[\"File\"][\"type\"]`—客户端发送的文件 MIME 类型，不可靠\n\n前面的代码输出了可用的文件信息（参见图\
    \ 5.4）。对 `is_uploaded_file()` 的调用通过首先检查文件是否确实由客户端上传，增加了额外的安全层。\n\n![](img/2862989e5dc7f1b1d0bc64321737f084_167_0.png)\n\
    \nFigure 5.4 Information about the uploaded file\n\n注意：在处理表单字段时存在一些注意事项。你可以在隐藏表单字段中提供上传文件的最大文件长度；然而，此检查随后在服务器端执行，因此最好在自己的脚本中使用\
    \ \"type\" 数组子元素自行完成。\n\n此外，不要依赖 \"name\" 数组子元素，因为此信息（原始文件名）可能被伪造。更糟糕的是，一些浏览器并不总是发送原始文件名，而是发送其完整路径。因此，始终调用\
    \ basename() 仅提取文件名。\n\n在我们的代码中，在输出这两个信息中的任何一个之前，我们都会运行 htmlspecialchars()。\n\n\
    ## 将上传文件移动到安全位置\n\n```\n<?php\n    if (isset($_POST['Submit']) &&\n        isset($_FILES['File']))\
    \ {\n        $move = move_uploaded_file(\n            $_FILES['File']['tmp_name'],\n\
    \            '/tmp/' . basename($_FILES['File']['name'])\n        );\n       \
    \ echo '<h1>';\n        echo ($move) ? 'Moved' : 'Did not move';\n        echo\
    \ ' the file!</h1>';\n    } else {\n?>\n<form action=\"<?php echo $_SERVER['PHP_SELF'];\
    \ ?>\" method=\"post\" enctype=\"multipart/form-data\">\n    <input type=\"file\"\
    \ name=\"File\" />\n    <input type=\"submit\" name=\"Submit\" value=\"Submit\
    \ form\" />\n</form>\n<?php\n}\n?>\n```\n\n当用户使用 <input type=\"file\" /> HTML\
    \ 元素向 PHP 脚本上传文件时，PHP 会将文件存储在临时位置（在 php.ini 指令 upload_tmp_dir 中设置）并在脚本执行完成后删除它。因此，你必须在脚本内访问上传的文件。为此，PHP\
    \ 包含函数 move_uploaded_file()，它可以将文件从一个位置移动到另一个位置。move_uploaded_file() 的优点是该函数首先进行\n\
    \n健全性检查，检查你提供的文件名是否确实是一个上传的文件，还是恶意用户试图诱骗你将 /etc/passwd 或 C:\\boot.ini 移动到其他地方。\n\
    \n假设路径 /tmp 存在并且可被 Web 服务器和 PHP 进程写入。在这种情况下，前面的代码会使用其原始文件名将上传的文件移动到此目录（你不关心文件名是否已存在）。\n\
    \n## 监控文件上传进度\n\n```\nvar_dump($_SESSION[ini_get('session.upload_progress_prefix')\
    \ . 'myUpload']); ?>\n```\n\n截至撰写本文时，Web 浏览器不包含确定文件上传状态的内置功能。尤其是对于大文件或慢速连接，此信息将非常有价值。\n\
    \n当今大多数显示文件已上传多少的 Web 应用程序都使用 Flash、Silverlight 或 Java 等插件技术。从 PHP 5.4 版本开始，也可以通过服务器端手段确定文件上传的状态。\n\
    \nphp.ini 文件包含文件上传状态功能配置选项。以下是最重要的选项：\n\n- session.upload_progress.enabled — 激活文件上传跟踪，必须设置为\
    \ On。\n- **session.upload_progress.prefix**—$_SESSION 数组中存储文件上传状态信息的键前缀。默认为 upload_progress_。\n\
    - **session.upload_progress.name**—POST 值的名称，其中将包含 $_SESSION 数组中存储文件上传状态信息的键后缀。默认为\
    \ PHP_SESSION_UPLOAD_PROGRESS。\n\n通常在使用此功能时，你会包含一些 JavaScript 代码，持续调用服务器脚本以了解更新状态。为了简洁起见，我们在这里使用一种更简单的方法。\n\
    \n在一个文件中，我们设置文件上传。如果满足以下两个条件，PHP 会自动将文件上传信息存储在会话中：\n\n- The form must contain\
    \ a (ideally hidden) form field with the name equaling the session.upload_progress.prefix\
    \ value.\n- The PHP session must have been started.\n\n这是一个典型的表单：\n\n```\n<?php\n\
    session_start();\n?>\n<form method=\"post\" action=\"\" enctype=\"multipart/form-data\"\
    >\n<input type=\"file\" name=\"upload\" />\n<input type=\"hidden\" name=\"<?php\
    \ echo ini_get('session.upload_progress.name'); ?>\" value=\"<?php echo session_id();\
    \ ?>\" />\n<input type=\"submit\" value=\"Upload\" />\n</form>\n```\n"
