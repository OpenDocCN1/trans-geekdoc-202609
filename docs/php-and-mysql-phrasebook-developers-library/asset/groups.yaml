    \ to the server. The order of the parameters is a bit strange: first username\
    \ and password and then the name of the service (that has been configured using\
    \ the configuration assistant or is part of the tnsnames.ora file). The return\
    \ value is a handle to the connection and is required by further operations in\
    \ the database.\n\n## Sending SQL to Oracle\n\n```php\n<?php\n  if ($db = @oci_connect('scott',\
    \ 'tiger', 'orcl'))\n  {\n    require_once 'stripFormSlashes.inc.php';\n    $sql\
    \ = 'INSERT INTO quotes (quote, author, year)\nVALUES (:quote, :author, :year)';\n\
    \    $stmt = oci_parse($db, $sql);\n    oci_bind_by_name($stmt, ':quote',\n$_POST['quote']);\n\
    \    oci_bind_by_name($stmt, ':author',\n$_POST['author']);\n    oci_bind_by_name($stmt,\
    \ ':year',\nintval($_POST['year']));\n    oci_execute($stmt, OCI_COMMIT_ON_SUCCESS);\n\
    \    echo 'Quote saved.';\n    oci_close($db);\n  } else {\n    echo 'Connection\
    \ failed.';\n  }\n?>\n```\n\nSending SQL to Oracle (oci_execute.php; excerpt)\n\
    \nThis section again uses the quotes table, which also includes an identity column;\
    \ however, this is a bit more complicated to implement with Oracle. Refer to the\
    \ script quotes.oracle.sql in the download archive for more information.\n\nTo\
    \ send SQL to Oracle, two steps are required. First, a call to oci_parse() parses\
    \ a SQL string and returns a resource that can then be executed using oci_execute().\
    \ The second parameter of oci_execute() is quite important. Several constants\
    \ are allowed, but most of the time, OCI_DEFAULT is used. Despite the name, that's\
    \ not the time, OCI_DEFAULT value, but means \"no auto-commit.\" In contrast,\
    \ OCI_COMMIT_ON_SUCCESS commits the pending transaction when no error has occurred.\
    \ And this is, indeed, the default value.\n\nUnfortunately, there is no such thing\
