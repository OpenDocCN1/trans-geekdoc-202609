    The behavior of `date()` is as follows: All characters within the first parameter
    that bear a special meaning (for example, formatting symbols) get replaced by
    the appropriate values. All other characters, however, remain unchanged. If the
    character is escaped using the backslash character (`\\`), it is returned verbatim.
    So, the code at the beginning of this phrase shows a new version of the code that
    uses only one call to `date()`.


    **NOTE:** If you are using double quotes rather than single quotes, you might
    get into trouble when escaping certain characters within `date()`. In the previous
    example, escaping the n would be done with `\n`, which (within double quotes)
    gets replaced by the newline character.'
