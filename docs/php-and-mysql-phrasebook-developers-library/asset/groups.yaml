    \n使用 MySQL 的预处理语句（mysqli_stmt_execute.php；节选）\n\n新的 MySQL 扩展提供了一种既能避免 SQL 注入又能加速\
    \ SQL 语句的方法：即所谓的预处理语句。在其中，你提供\n\n```php\nmysqli_select_db($db, 'phrasebook');\n\
    $result = mysqli_query($db, 'SELECT * FROM quotes');\nwhile ($row = mysqli_fetch_object($result))\
    \ {\n    printf(\n        '<tr><td>%s</td><td>%s</td><td>%s</td><td>%s</td></tr>',\n\
    \        htmlspecialchars($row->id),\n        htmlspecialchars($row->quote),\n\
    \        htmlspecialchars($row->author),\n        htmlspecialchars($row->year)\n\
    \    );\n}\nmysqli_close($db);\n} else {\n    echo '<tr><td colspan=\"4\">Connection\
    \ failed.</td></tr>';\n}\n?>\n</table>\n```\n\n从 MySQL 检索数据（mysqli_fetch.php；节选）\n\
    \nmysqli_query() 的返回值是指向实际结果集的指针。它可以用于遍历 SELECT 语句返回的完整条目列表。为此，以下函数会很有用：\n\n-\
    \ mysqli_fetch_assoc() 将结果集中的当前行作为关联数组返回（字段名变为键），然后移动到下一行。\n- mysqli_fetch_object()\
    \ 将结果集中的当前行作为对象返回（字段名变为属性），然后移动到下一行。\n- mysqli_fetch_row() 将结果集中的当前行作为数字数组返回，然后移动到下一行。\n\
    \n当然还有其他函数；不过，这三个是最常用的。下面的代码使用 mysqli_fetch_assoc()，而前面的列表使用 mysqli_fetch_object()\
    \ 打印数据库表的内容。主要思想是使用 while 循环——当结果集中没有剩余数据时，所有 mysqli_fetch_* 函数都会返回 false：\n\n\
    ```php\n<table>\n<tr><th>#</th><th>Quote</th><th>Author</th><th>Year</th></tr>\n\
    <?php\nif ($db = @mysqli_connect('localhost', 'user', 'password')) {\n    mysqli_select_db($db,\
    \ 'phrasebook');\n    $result = mysqli_query($db, 'SELECT * FROM quotes');\n \
    \   while ($row = mysqli_fetch_assoc($result)) {\n        printf(\n          \
    \  '<tr><td>%s</td><td>%s</td><td>%s</td><td>%s</td></tr>',\n            htmlspecialchars($row['id']),\n\
    \            htmlspecialchars($row['quote']),\n            htmlspecialchars($row['author']),\n\
    \            htmlspecialchars($row['year'])\n        );\n    }\n    mysqli_close($db);\n\
    } else {\n    echo '<tr><td colspan=\"4\">Connection failed:</td></tr>';\n}\n\
    ?>\n</table>\n```\n\n*从 MySQL 检索数据（mysqli_fetch.php；节选）*\n\n图 8.3 显示了在填入一些（政治）语录后数据库的内容。（抱歉，我不是来自美国；我随便找了一些。）\n\
    \n![](img/2862989e5dc7f1b1d0bc64321737f084_250_0.png)\n\n**图 8.3** 数据库的内容\n\n\
    ## 检索最后插入的 ID\n\n```\n$id = mysqli_insert_id($db);\n```\n\n```php\n<?php\nif ($db\
    \ = @mysqli_connect('localhost', 'user',\n'password')) {\n    mysqli_select_db($db,\
    \ 'phrasebook');\n    mysqli_query($db, sprintf(\n    'INSERT INTO quotes (quote,\
    \ author, year)\n    VALUES (\\'%s\\', \\'%s\\', \\'%s\\')',\n    mysqli_real_escape_string($db,\n\
    \    $_POST['quote']),\n    mysqli_real_escape_string($db,\n    $_POST['author']),\n\
    \    intval($_POST['year'])));\n$id = mysqli_insert_id($db);\necho \"Quote saved\
    \ (ID=$id).\";\nmysqli_close($db);\n} else {\necho 'Connection failed.';\n}\n\
    ?>\n```\n\n*使用 MySQL 检索先前插入项的 ID（mysqli_insert_id.php；节选）*\n\n当使用 MySQL 的 auto_increment\
    \ 特性时，每当你向表中插入新项，数据库都会自动为该列分配一个值。在插入之后确定这个生成的值可能会很有用。mysqli_insert_id() 函数可以帮我们做到这一点。只需提供数据库连接句柄，你就会收到返回的\
    \ ID。该值仅对使用该连接执行的最后一条 INSERT SQL 语句有效。\n\n## 使用事务\n\n```\nmysqli_autocommit($db,\
    \ false);\nmysqli_commit($db);\n```\n\n```php\n<?php\nif ($db = @mysqli_connect('localhost',\
    \ 'user',\n'password')) {\n    mysqli_select_db($db, 'phrasebook');\n    mysqli_autocommit($db,\
    \ false);\n    if (mysqli_query($db, sprintf(\n        'INSERT INTO quotes (quote,\
    \ author, year)\n        VALUES (\\'%s\\', \\'%s\\', \\'%s\\')',\n        mysqli_real_escape_string($db,\n\
    \        $_POST['quote']),\n        mysqli_real_escape_string($db,\n        $_POST['author']),\n\
    \        intval($_POST['year'])))) {\n        $result = mysqli_query($db, 'SELECT\
    \ MAX(id)\n        FROM quotes');\n        $row = mysqli_fetch_object($result);\n\
    \        $id = $row->id;\n        mysqli_commit($db);\n        echo \"Quote saved\
    \ (ID=$id).\";\n    } else {\n        mysqli_rollback($db);\n        echo 'An\
    \ error has occurred.';\n    }\n    mysqli_close($db);\n} else {\n    echo 'Connection\
    \ failed.';\n}\n?>\n```\n\n使用 MySQL 检索先前插入项的 ID（mysqli_commit.php；节选）\n\n默认情况下，你发送到数据库的\
    \ MySQL 语句会立即执行；这种模式也称为自动提交。最近的 MySQL 版本还支持事务，这意味着多条 SQL 语句可以“捆绑”成一条语句。当你使用事务时，要么整个事务完整执行，要么完全不执行；不可能出现部分执行的情况。\n\
    \n要使用事务，首先禁用自动提交（例如使用 mysqli_autocommit() 函数），此后所使用连接上的所有 SQL 语句都将成为事务的一部分。使用\
    \ mysqli_commit()，语句最终被执行，而 mysqli_rollback() 则让数据库回到没有该事务的状态。在脚本结束时，所有待处理的事务都会自动提交，但为了性能考虑，你应该尽快调用\
    \ mysqli_commit()。\n\n## 使用其他数据库\n\n除了 MySQL 之外，PHP 还支持地球上几乎所有相关的（以及一些不太相关的）数据库。本章介绍其中许多系统所使用的基本技术，尤其是连接数据库、执行\
    \ SQL 语句和检索返回数据。与第 8 章“使用 MySQL 数据库”一样，我们使用一个名为 phrasebook 的示例数据库，以及其中的一个示例模式/表，名为\
    \ quotes，包含以下四个字段：\n\n- id——一个整数值，每向数据库添加一条新记录就增加 1。取决于数据库系统，该数据类型称为 IDENTITY、auto_increment\
    \ 或类似的名称。\n- quote——语录本身，类型为 VARCHAR(255)；这一长度适用于所有系统。\n- author——产生该语录的人，类型为\
    \ VARCHAR(50)。\n- year——该语录产生的年份，类型为 INT。\n"
