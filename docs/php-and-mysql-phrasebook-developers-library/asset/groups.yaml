    ```\n```\n\n*Checking the Status of a Server (serverstatus.php)*\n\nSuppose you\
    \ have a Web server and you want to check periodically that it hasn’t crashed\
    \ again. In this scenario, using a PHP script for this task is a good idea. Just\
    \ open a socket to the server and wait. (The last parameter of fsockopen() is\
    \ a timeout value.) After this time has elapsed, you know whether the server is\
    \ online or offline.\n\n**TIP:** This works well if only one server’s status must\
    \ be checked. If there are several servers, this approach has some disadvantages.\
    \ The call to fsockopen() might take up to the timeout value until the next command\
    \ is executed. Therefore, all servers are checked sequentially and synchronously.\
    \ This just takes too long for several servers. However, with PHP 5 and stream\
    \ sockets, this can be done asynchronously. The code is a bit complicated, but\
    \ Wez Furlong explains this approach in great detail at http://wezfurlong.org/blog/2005/may/guru-multiplexing/."
