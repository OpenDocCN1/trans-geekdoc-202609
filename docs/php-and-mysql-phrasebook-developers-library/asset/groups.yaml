    \ SQL 注入的唯一可行方法。像往常一样，必须执行两个步骤。首先，你创建一个语句对象（此处使用的函数是带占位符的 sqlsrv_prepare()），然后执行该语句。在准备语句时，你还必须提供占位符的数据。\n\
    \next/sqlsrv 扩展期望每个占位符使用一个问号 (?)。这些占位符的值以数组形式提供，其顺序与 SQL 语句中占位符的顺序完全相同。这些值可以按引用传递。\n\
    \n### 在非 Windows 系统上使用 MSSQL\n\n```php\n$db = @mssql_connect();\n$result = mssql_query();\n\
    mssql_fetch_assoc($result);\n```\n\n```php\n<table>\n<tr><th>#</th><th>Quote</th><th>Author</th><th>Year</th></tr>\n\
    <?php\nif ($db = @mssql_connect('localhost', 'user', 'password')) {\n    mssql_select_db('phrasebook',\
    \ $db);\n    $result = mssql_query('SELECT * FROM quotes', $db);\n    while ($row\
    \ = mssql_fetch_assoc($result)) {\n        print(\n            '<tr><td>%s</td><td>%s</td><td>%s</td><td>%s</td></tr>',\n\
    \            htmlspecialchars($row['id']),\n            htmlspecialchars($row['quote']),\n\
    \            htmlspecialchars($row['author']),\n            htmlspecialchars($row['year'])\n\
    \        );\n    }\n    mssql_close($db);\n} else {\n    echo '<tr><td colspan=\"\
    4\">Connection failed.</td></tr>';\n}\n?>\n</table>\n```\n\n*使用 ext/mssql 从 MSSQL\
    \ 检索数据 (mssql_fetch.php; 摘录)*\n"
