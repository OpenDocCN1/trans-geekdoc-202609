  md: "\n![](img/2862989e5dc7f1b1d0bc64321737f084_216_0.png)\n\nFigure 7.1 Allowing\
    \ the IIS user to access a file or directory\n\n## Reading from Files\n\n```php\n\
    echo file_get_contents('file.txt');\n```\n\nTo read data from a file, PHP offers\
    \ several possibilities. Probably the easiest way is to read it all at once and\
    \ then output it to the user.\n\nThe function `file_get_contents()` returns the\
    \ contents of a file (or stream) as a string so that it all can be processed further.\
    \ The following code reads in a file called `file.txt` and prints out its contents.\
    \ This function is binary safe, and that's why no file mode can (or has to) be\
    \ used:\n\n```php\n<?php\necho file_get_contents('file.txt');\n?>\n```\n\nThe\
    \ `file()` function works as `file_get_contents()`, but returns the file’s contents\
    \ as an array: Each element is one row in the file (including the line break character).\
    \ The following code converts this array into a string and sends it to the browser.\
    \ The function `implode()` glues the array element together; see Chapter 2, “Working\
    \ with Arrays”:\n\n```php\n<?php\necho implode('', file('file.txt'));\n?>\n```\n\
    \nFor maximum flexibility the manual way can be used; however, for text files,\
    \ this is often not needed. Open the file with `fopen()`, and then call `fgets()`\
    \ as long as data is returned (a while loop is convenient here) and output the\
    \ data. `fgets()` returns as many characters as are provided in its second parameter\
    \ but, at most, all characters until the end of the current line:\n\n```php\n\
    <?php\n$fp = fopen('file.txt', 'r');\nwhile (!feof($fp)) {\n    $line = fgets($fp,\
    \ 4096);\n    echo $line;\n}\nfclose($fp);\n?>\n```\n\n*Sending a File's Contents\
    \ to the Browser, Line by Line*  \n*(readfile-linebyline.php)*\n\n## Writing to\
    \ Files\n\n```php\nfile_put_contents('file.txt', '--> This text file contains\\\
    nsome random text. <--');\n```\n\n```php\n<?php\nfile_put_contents('file.txt',\n\
    \    \"--> This text file contains\\nsome random text.\n<--\");\necho 'File written.';\n\
    ?>\n```\n\n*Writing Data into a File (file_put_contents.php)*\n\nWriting to files\
    \ is as easy as reading from them—if you are using PHP 5 or later. Then, the function\
    \ `file_put_contents()` writes data directly to a file, and this is binary safe.\
    \ After calling the function, the file is closed. The preceding code writes data\
    \ into a file.\n\nHowever, the preceding code overwrites the existing file. If\
    \ you want to append data (therefore emulating file mode `a`), you first have\
    \ to read in the file’s data:\n\n```php\n<?php\nfunction file_append_contents($filename,\
    \ $data) {\n    $olddata = @file_get_contents($filename);\n    return file_put_contents($filename,\n\
    \        \"$olddata$data\");\n}\n\nfile_append_contents('file.txt',\n    \"\\\
    n--> This text file contains\\neven more random text. <--\");\necho 'Data appended\
    \ to file';\n?>\n```\n\n*Appending Data to a File (file_append_contents.php)*\n\
    \n**TIP:** It is even easier to provide a third parameter to `file_put_contents()`\
    \ to append data instead of overwriting files:\n\n```php\nfile_put_contents($filename,\
    \ $data, FILE_APPEND);\n```\n\n## Locking Files\n\n```php\nflock($fp, LOCK_EX);\n\
    ```\n\n```php\n<?php\nif (!function_exists('file_put_contents')) {\n    function\
    \ file_put_contents($filename, $content)\n    {\n        if ($fp = @fopen($filename,\
    \ 'w') && flock($fp, LOCK_EX)) {\n            $result = fwrite($fp, $content);\n\
    \            flock($fp, LOCK_UN);\n            fclose($fp);\n            return\
    \ $result;\n        } else {\n            return false;\n        }\n    }\n}\n\
    ?>\n```\n\n*Using file_put_contents() with a File Lock (flock.php: excerpts)*\n\
    \nWhile reading and writing files, you have to take concurrency into mind. What\
    \ if two processes try to access the file at the same time? To avoid trouble when\
    \ one process writes while the other one reads, you have to lock the file. This\
    \ is done using the PHP function `flock()`.\n\nThe first parameter is the file\
    \ handle; the second one is the desired kind of locking to be used. The following\
    \ options are available:\n\n- **LOCK_EX**—Exclusive lock for writing\n- **LOCK_NB**—Nonblocking\
    \ lock\n- **LOCK_SH**—Shared lock for reading\n- **LOCK_UN**—Releasing a lock\n\
    \nThe preceding code contains an updated version of the custom `file_put_contents()`\
    \ function from the previous phrase, this time using an exclusive lock.\n\n##\
    \ Using Relative Paths for File Access\n\n```php\ndirname(__FILE__)\nbasename(__FILE__)\n\
    ```\n\n```php\n<?php\n$directory = dirname(__FILE__);\n$filename = basename(__FILE__);\n\
    print \"This script is called $filename and resides\nin $directory.\";\n?>\n```\n\
    \n*Determining Directory Name and Filename (pathinfos.php)*\n\nUsually, files\
    \ are opened (or searched) relative to the path of the document. If you are using\
    \ PHP as an ISAPI module under Windows, the location of `php5.dll` or `php5ts.dll`\
    \ may be relevant. To be sure that you are searching to the current script’s path,\
    \ you can use a two-step approach:\n\n- The constant `__FILE__` contains the full\
    \ path of the current script.\n- The function `dirname()` determines the directory\
    \ name portion of a path.\n\nTo use a relative path, you can now call `dirname(__FILE__)`\
    \ and then attach the relative path, taking into consideration the directory separator\
    \ character, which is `/` on UNIX/Linux, `\\` on Windows, and `:` on Mac OS X.\
    \ PHP tells you the system’s default in its `DIRECTORY_SEPARATOR` constant.\n\n\
    The sister function to `dirname()` is `basename()`: this one determines the filename\
    \ portion of a path.\n\nThe listing at the beginning of this phrase uses both\
    \ `basename()` and `dirname()` and `__FILE__` to determine information about the\
    \ current path: directory and filename. Figure 7.2 shows the script’s output.\n\
    \n![](img/2862989e5dc7f1b1d0bc64321737f084_221_0.png)\n\nFigure 7.2 Detecting\
    \ the script’s name and its directory\n\n## Avoiding Security Traps with File\
    \ Access\n\nOne very important point: If you are using files with PHP, avoid retrieving\
    \ the filename from external\n\n## Working with CSV Data\n\n```php\nfgetcsv($fp,\
    \ 4096)\n```\n\n```php\n<table>\n<?php\n$fp = fopen('file.csv', 'r');\nwhile (!feof($fp))\
    \ {\n    $line = fgetcsv($fp, 4096);\n    echo '<tr><td>';\n    echo implode('</td><td>',\
    \ $line);\n    echo '</td></tr>';\n}\nfclose($fp);\n?>\n</table>\n```\n\n*Reading\
    \ CSV Information (fgetcsv.php)*\n\nCSV is a file format and stands for comma-separated\
    \ values. Many spreadsheet applications can export their data into CSV files.\
    \ It seems to be easy to use `explode()` to convert CSV values into arrays; however,\
    \ this turns out to be really complicated. What if there is a comma within a value?\
    \ Then, the content is surrounded by double quotes, which makes it hard to use\
    \ `explode()`.\n\nAs (almost) always, the PHP project has done most of the work\
    \ and offers `fgetcsv()`. This function works as `fgets()`; however, it converts\
    \ the line into an array, separating the contents at a comma (or any other character\
    \ provided in the third parameter).\n\nThe second parameter to `fgetcsv()` is\
    \ the maximum length of a line in the CSV file. This is optional in PHP 5. So\
    \ you need to check the length of the longest line in the CSV file; otherwise,\
    \ data will get truncated.\n\nThe code at the beginning of this phrase reads in\
    \ a CSV file and outputs it as an HTML table. This is done using the following\
    \ code within a loop:\n\n```php\n$line = fgetcsv($fp, 4096);\necho '<tr><td>';\n\
    echo implode('</td><td>', $line);\necho '</td></tr>';\n```\n\nThis creates a row\
    \ in an HTML table: `<tr><td>...</td></tr>`.\n\nFigure 7.3 shows both the original\
    \ spreadsheet file (in OpenOffice.org) and the result in the browser.\n\n![](img/2862989e5dc7f1b1d0bc64321737f084_224_0.png)\n\
    \nFigure 7.3 The CSV spreadsheet in OpenOffice.org and the result in the browser\
    \ (fgetcsv.php; excerpt)\n\n**NOTE:** In the code at the beginning of this phrase,\
    \ the output is not sanitized using `htmlspecialchars()`—in this case, to make\
    \ the code short. However, depending on the data you have, you should consider\
    \ running `htmlspecialchars()` on all elements of the array `fgetcsv()` returns.\n\
    \nFor writing CSV files, PHP offers a sister function, `fputcsv()`. You provide\
    \ a file pointer and an array of values, and PHP does the rest, including escaping\
    \ special characters. This function was introduced in PHP 5.1. Basically, you\
    \ just join all array elements with commas. You also have to take care of commas\
    \ within the elements, so you surround all values by double quotes. If the element\
    \ contains double quotes, these have to be escaped. However, this is not done\
    \ using backslashes, but by doubling the quotes. The following is an example for\
    \ a valid line of CSV data:\n\n```csv\nQuote,\"And she said: \"\"No.\"\" ...\"\
    ,Unknown\n```\n\nThe following is the code for `fputcsv()` for older PHP versions:\n\
    \n```php\nif (!function_exists('fputcsv')) {\n    function fputcsv($fp, $line,\
    \ $separator = ',') {\n        for ($i=0; $i < count($line); $i++) {\n       \
    \     if (false !== strpos($line[$i], '\"')) {\n                $line[$i] = ereg_replace('\"\
    ', '\"\"', $line[$i]);\n            }\n            if (false !== strpos($line[$i],\
    \ $separator) ||\n                false !== strpos($line[$i], '\"')) {\n     \
    \           $line[$i] = '\"' . $line[$i] . '\"';\n            }\n        }\n \
    \       fwrite($fp, implode($separator, $line) .\n        \"\\r\\n\");\n    }\n\
    }\n```\n"
  mdcn: "\n![](img/2862989e5dc7f1b1d0bc64321737f084_216_0.png)\n\nFigure 7.1 允许 IIS\
    \ 用户访问文件或目录\n\n## 从文件读取\n\n```php\necho file_get_contents('file.txt');\n```\n\n\
    读取文件数据时，PHP 提供了多种可能性。最简单的方法可能是将文件一次性全部读入，然后输出给用户。\n\n函数 `file_get_contents()`\
    \ 以字符串形式返回文件（或流）的内容，以便进一步处理。以下代码读取名为 `file.txt` 的文件并打印其内容。该函数是二进制安全的，因此不需要（或不能）使用文件模式：\n\
    \n```php\n<?php\necho file_get_contents('file.txt');\n?>\n```\n\n`file()` 函数的工作方式与\
    \ `file_get_contents()` 相同，但返回文件内容为数组：每个元素是文件中的一行（包括换行符）。以下代码将此数组转换为字符串并发送到浏览器。函数\
    \ `implode()` 将数组元素粘合在一起；请参阅第 2 章，“使用数组”：\n\n```php\n<?php\necho implode('', file('file.txt'));\n\
    ?>\n```\n\n为了获得最大灵活性，可以使用手动方式；然而，对于文本文件，这通常不是必需的。用 `fopen()` 打开文件，然后只要返回数据就调用\
    \ `fgets()`（这里使用 while 循环很方便）并输出数据。`fgets()` 返回其第二个参数提供的字符数，但最多为当前行结束前的所有字符：\n\
    \n```php\n<?php\n$fp = fopen('file.txt', 'r');\nwhile (!feof($fp)) {\n    $line\
    \ = fgets($fp, 4096);\n    echo $line;\n}\nfclose($fp);\n?>\n```\n\n*逐行将文件内容发送到浏览器*\
    \  \n*(readfile-linebyline.php)*\n\n## 写入文件\n\n```php\nfile_put_contents('file.txt',\
    \ '--> This text file contains\\nsome random text. <--');\n```\n\n```php\n<?php\n\
    file_put_contents('file.txt',\n    \"--> This text file contains\\nsome random\
    \ text.\n<--\");\necho 'File written.';\n?>\n```\n\n*将数据写入文件 (file_put_contents.php)*\n\
    \n写入文件与从文件中读取一样简单——如果您使用的是 PHP 5 或更高版本。然后，函数 `file_put_contents()` 直接将数据写入文件，并且是二进制安全的。调用函数后，文件将被关闭。上述代码将数据写入文件。\n\
    \n然而，上述代码会覆盖现有文件。如果您想追加数据（因此模拟文件模式 `a`），则首先必须读取文件的数据：\n\n```php\n<?php\nfunction\
    \ file_append_contents($filename, $data) {\n    $olddata = @file_get_contents($filename);\n\
    \    return file_put_contents($filename,\n        \"$olddata$data\");\n}\n\nfile_append_contents('file.txt',\n\
    \    \"\\n--> This text file contains\\neven more random text. <--\");\necho 'Data\
    \ appended to file';\n?>\n```\n\n*向文件追加数据 (file_append_contents.php)*\n\n**提示：**\
    \ 提供第三个参数给 `file_put_contents()` 以追加数据而不是覆盖文件，甚至更简单：\n\n```php\nfile_put_contents($filename,\
    \ $data, FILE_APPEND);\n```\n\n## 锁定文件\n\n```php\nflock($fp, LOCK_EX);\n```\n\n\
    ```php\n<?php\nif (!function_exists('file_put_contents')) {\n    function file_put_contents($filename,\
    \ $content)\n    {\n        if ($fp = @fopen($filename, 'w') && flock($fp, LOCK_EX))\
    \ {\n            $result = fwrite($fp, $content);\n            flock($fp, LOCK_UN);\n\
    \            fclose($fp);\n            return $result;\n        } else {\n   \
    \         return false;\n        }\n    }\n}\n?>\n```\n\n*使用文件锁的 file_put_contents()\
    \ (flock.php: excerpts)*\n\n在读取和写入文件时，您必须考虑并发性。如果两个进程同时尝试访问文件会怎样？为了避免一个进程写入而另一个进程读取时出现问题，您必须锁定文件。这是通过\
    \ PHP 函数 `flock()` 完成的。\n\n第一个参数是文件句柄；第二个参数是要使用的锁定类型。以下选项可用：\n\n- **LOCK_EX**—用于写入的独占锁\n\
    - **LOCK_NB**—非阻塞锁\n- **LOCK_SH**—用于读取的共享锁\n- **LOCK_UN**—释放锁\n\n上述代码包含来自上一节的自定义\
    \ `file_put_contents()` 函数的更新版本，这次使用独占锁。\n\n## 使用相对路径进行文件访问\n\n```php\ndirname(__FILE__)\n\
    basename(__FILE__)\n```\n\n```php\n<?php\n$directory = dirname(__FILE__);\n$filename\
    \ = basename(__FILE__);\nprint \"This script is called $filename and resides\n\
    in $directory.\";\n?>\n```\n\n*确定目录名称和文件名 (pathinfos.php)*\n\n通常，文件是相对于文档路径打开（或搜索）的。如果您在\
    \ Windows 下将 PHP 用作 ISAPI 模块，则 `php5.dll` 或 `php5ts.dll` 的位置可能相关。为了确保您搜索的是当前脚本的路径，可以使用两步方法：\n\
    \n- 常量 `__FILE__` 包含当前脚本的完整路径。\n- 函数 `dirname()` 确定路径的目录名称部分。\n\n要使用相对路径，您现在可以调用\
    \ `dirname(__FILE__)` 然后附加相对路径，同时考虑目录分隔符字符，在 UNIX/Linux 上是 `/`，在 Windows 上是 `\\\
    `，在 Mac OS X 上是 `:`。PHP 在其 `DIRECTORY_SEPARATOR` 常量中告诉您系统的默认值。\n\n`dirname()`\
    \ 的姊妹函数是 `basename()`：它确定路径的文件名部分。\n\n本节开头的列表使用 `basename()` 和 `dirname()` 以及\
    \ `__FILE__` 来确定有关当前路径的信息：目录和文件名。图 7.2 显示了脚本的输出。\n\n![](img/2862989e5dc7f1b1d0bc64321737f084_221_0.png)\n\
    \nFigure 7.2 检测脚本的名称及其目录\n\n## 避免文件访问中的安全陷阱\n\n一点非常重要：如果您使用 PHP 处理文件，请避免从外部检索文件名\n\
    \n## 处理 CSV 数据\n\n```php\nfgetcsv($fp, 4096)\n```\n\n```php\n<table>\n<?php\n\
    $fp = fopen('file.csv', 'r');\nwhile (!feof($fp)) {\n    $line = fgetcsv($fp,\
    \ 4096);\n    echo '<tr><td>';\n    echo implode('</td><td>', $line);\n    echo\
    \ '</td></tr>';\n}\nfclose($fp);\n?>\n</table>\n```\n\n*读取 CSV 信息 (fgetcsv.php)*\n\
    \nCSV 是一种文件格式，代表逗号分隔值。许多电子表格应用程序可以将数据导出为 CSV 文件。似乎使用 `explode()` 将 CSV 值转换为数组很容易；然而，这实际上非常复杂。如果值中包含逗号怎么办？那么内容会被双引号包围，这使得使用\
    \ `explode()` 变得困难。\n\n如（几乎）总是那样，PHP 项目已完成了大部分工作并提供了 `fgetcsv()`。此函数的工作方式与 `fgets()`\
    \ 相同；然而，它将行转换为数组，以逗号（或第三个参数中提供的任何其他字符）分隔内容。\n\n`fgetcsv()` 的第二个参数是 CSV 文件中行的最大长度。在\
    \ PHP 5 中这是可选的。因此您需要检查 CSV 文件中最长行的长度；否则，数据将被截断。\n\n本节开头的代码读取 CSV 文件并将其作为 HTML\
    \ 表格输出。这是通过循环中使用以下代码完成的：\n\n```php\n$line = fgetcsv($fp, 4096);\necho '<tr><td>';\n\
    echo implode('</td><td>', $line);\necho '</td></tr>';\n```\n\n这在 HTML 表格中创建一行：`<tr><td>...</td></tr>`。\n\
    \n图 7.3 同时显示了原始电子表格文件（在 OpenOffice.org 中）和浏览器中的结果。\n\n![](img/2862989e5dc7f1b1d0bc64321737f084_224_0.png)\n\
    \nFigure 7.3 OpenOffice.org 中的 CSV 电子表格以及浏览器中的结果 (fgetcsv.php; excerpt)\n\n**注意：**\
    \ 在本节开头的代码中，输出未使用 `htmlspecialchars()` 进行清理——在这种情况下是为了使代码简短。然而，根据您的数据，您应考虑对 `fgetcsv()`\
    \ 返回的数组的所有元素运行 `htmlspecialchars()`。\n\n对于写入 CSV 文件，PHP 提供了一个姊妹函数 `fputcsv()`。您提供文件指针和值数组，PHP\
    \ 会完成其余工作，包括转义特殊字符。该函数在 PHP 5.1 中引入。基本上，您只需用逗号连接所有数组元素。您还必须处理元素内的逗号，因此您用双引号包围所有值。如果元素包含双引号，则必须转义它们。然而，这不是使用反斜杠完成的，而是通过重复引号完成的。以下是\
    \ CSV 数据有效行的示例：\n\n```csv\nQuote,\"And she said: \"\"No.\"\" ...\",Unknown\n```\n\
    \n以下是旧版 PHP 的 `fputcsv()` 代码：\n\n```php\nif (!function_exists('fputcsv')) {\n\
