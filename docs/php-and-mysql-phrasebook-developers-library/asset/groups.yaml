    \n许多网页都是多语言的。此外，它们通常是这样组织的，每个本地化部分都位于自己的目录中，类似于以下方法：\n\n- 英文版本位于 en 目录中。\n- 西班牙语版本位于\
    \ es 目录中。\n- 法语版本位于 fr 目录中。\n\n你可以通过几种不同方式检测用户的语言：\n\n- 通过尝试将客户端 IP 地址与地理区域关联\n\
    - 通过读取 Accept-Language HTTP 头来确定首选语言\n- 通过询问用户\n\n虽然所有这些方法或多或少都有效，但最后一种（或几种方法的组合）被认为是最用户友好的。因此，你确实需要一个主页，提供指向所有三个版本的链接。这是简单的\
    \ HTML，如下所示：\n\n```\n<a href=\"en/index.php\">English version</a><br />\n<a href=\"\
    es/index.php\">Versión español</a><br />\n<a href=\"fr/index.php\">Version française</a>\n\
    ```\n\n*主页链接到各种语言版本 (multilingual.php; 摘录)*\n\n现在，每个语言目录都有一个特定语言的 index.php 文件。在此文件中，代码包含自本节开头处的列表。这会检查是否已存在语言\
    \ cookie。如果没有，它会尝试使用当前路径（从 $_SERVER['PHP_SELF'] 获取）设置一个 cookie。\n\n**注意：** 重要的是将\
    \ cookie 的路径设置为 Web 服务器的根目录。否则，路径默认为当前路径，并且 cookie 只能在当前目录及其子目录中读取，而不能在主页上读取。\n\
    \n最后，你必须在主页上检查 cookie 是否存在，如果存在，则将用户重定向到适当的页面。为此，你必须在 multilingual.php 页面的顶部添加以下代码：\n\
    \n```\n<?php\nif (isset($_COOKIE['lang']) && $_COOKIE['lang'] != '' ) {\n```\n\
    \n```\nheader(\"Location: {$_COOKIE['lang']}\");\n}\n?>\n```\n\n### 检查语言 Cookie\
    \ (multilingual.php; 摘录)\n\n## 理解会话\n\n最初，会话是用户对网站的一次访问。他点击几个链接，查看几页，然后离开。这定义了一个会话。换句话说，如果用户在一段时间内（例如\
    \ 20 分钟）未向网站请求任何数据，则会话结束。\n\nHTTP 不知道任何会话机制：该协议是无状态的。然而，PHP 带有内置的会话支持，使得使用会话变得相当容易。\n\
    \n会话创建后，PHP 会生成一个会话 ID（即标识会话的长字符串）。然后 PHP 为此会话创建一个文件或数据库条目。然后 PHP 应用程序可以将会话数据存储在会话中。这些数据随后写入会话文件或数据库。（共享内存是另一种但很少使用的选项。）\n\
    \n因此，客户端和服务器之间必须传输的唯一东西是会话 ID。所有其他与会话相关的其他数据都驻留在服务器上。因此，没有敏感数据会被不必要地多次通过线路发送。\n\
    \nPHP 会话机制的配置完全在 php.ini 配置文件的 [session] 部分中触发。默认设置可能不适合所有应用程序，因此接下来的几节涵盖了一些可能的配置。\n\
    \n## 会话存储位置\n\n通常，会话数据存储在文件中。这些文件的位置由 php.ini 指令 session.save_path 设置。当然，此路径必须\
    \ (a) 存在且 (b) 对 PHP 进程（通常是 Web 服务器的进程）可读可写。否则，会话信息无法存储。\n\n然而，当你有大量用户，因此有大量会话时，PHP\
    \ 不应将所有会话文件放在一个目录中，因为这可能会导致一些严重的性能问题。以下语法允许 PHP 将会话数据移动到多个子目录中：\n\n```\nsession.save_path\
    \ = \"n;/tmp\"\n```\n\n这会在 /tmp 目录内创建最多 n 级的子目录。然而，这些子目录必须存在，以便 PHP 的会话机制可以写入其中；为此，ext/session\
    \ 目录中存在 shell 脚本 mod_files.sh。\n\n当然，只有 Web 服务器应被允许读取此目录；否则，系统中的其他用户可能能够读取包含可能敏感数据的会话信息。\n\
    \n## 如何维护会话状态\n\n会话 ID 必须随每次响应发送到浏览器，并且——更重要的是——必须随每次请求发送回服务器。最简单的方法是使用 cookie。\n\
    \n然后 PHP 向客户端发送一个名为 PHPSESSID 的 cookie（可通过指令 session.name 更改）。然而，要实现这一点，必须设置以下\
    \ php.ini 指令：\n\n```\nsession.use_cookies = 1\n```\n\n然而，如果客户端不支持 cookie 会怎样？然后，第二种机制会发挥作用，形式如下指令：\n\
    \n```\nsession.use_trans_sid = 0\n```\n\n然后，PHP 自动回退到一种模式，其中会话 ID 会自动附加到所有 URL。这可能会产生一些潜在的安全风险（例如会话固定和会话劫持）。大多数知名电子商务网站已停止使用此机制（例如\
    \ Amazon）。当会话中未存储个人数据时，你可能仍想使用此功能。\n\n要能够使用 session.use_trans_sid，PHP 必须使用 enable-trans-sid\
    \ 开关编译，这对于 Windows 和 Mac OS X 二进制文件是自动完成的。\n\n另一个选项是只允许 cookie，而不是在统一资源定位符（URL）中使用会话\
    \ ID。为此，你可以使用以下 php.ini 指令：\n\n```\nsession.use_only_cookies = 1\n```\n"
