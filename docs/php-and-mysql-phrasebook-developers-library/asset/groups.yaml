    \ (but can be changed by the `variables_order` php.ini setting) as follows: If\
    \ `$_GET` or `$_POST` contains a current value for this field, this value is used.\
    \ (Specific versions of the function exist for `$_GET` and `$_POST` because only\
    \ one of these two methods is normally used at a time.) Otherwise, the script\
    \ looks in `$_COOKIE` for an associated value. If nothing is found, an empty string\
    \ is returned:\n\n```php\nfunction getCookieData() {\n    if (isset($_COOKIE['formdata']))\
    \ {\n        $formdata = $_COOKIE['formdata'];\n        if ($formdata != '') {\n\
    \            if (get_magic_quotes_gpc()) {\n                $formdata = stripslashes($formdata);\n\
    \            }\n            return unserialize($formdata);\n        } else {\n\
    \            return array();\n        }\n    } else {\n        return null;\n\
    \    }\n}\n\nfunction getFormDataPOST($name) {\n    if (isset($_POST[$name]))\
    \ {\n        return $_POST[$name];\n    } else {\n        $cookiedata = getCookieData();\n\
    \        if ($cookiedata != null &&\n            isset($cookiedata[$name])) {\n\
    \            return $cookiedata[$name];\n        }\n    }\n    return '';\n}\n\
    \nfunction getFormDataGET($name) {\n    if (isset($_GET[$name])) {\n        return\
    \ $_GET[$name];\n    } else {\n        $cookiedata = getCookieData();\n      \
    \  if ($cookiedata != null &&\n            isset($cookiedata[$name])) {\n    \
    \        return $cookiedata[$name];\n        }\n    }\n    return '';\n}\n```\n\
    \nNow, prefilling the form value is easy: Because getFormDataGET() and getFormDataPOST()\
    \ always return anything—including an empty string—the return value can be directly\
    \ used in the text field's value attribute:\n\n```php\n<?php\nrequire_once 'getFormData.inc.php';\n\
    ?>\n...\n<input type=\"text\" name=\"textfieldname\"\n    value=\"<?php\n    echo\n\
    \    htmlspecialchars(getFormDataPOST('textfieldname'));\n?>\">\n```\n\n## Prefilling\
    \ Multiline Text Fields\n\n```php\n<textarea cols=\"40\" rows=\"5\" name=\"areafieldname\"\
    ><?php echo (isset($_POST['areafieldname'])) ? htmlspecialchars($_POST['areafieldname'])\
    \ : ''; ?></textarea>\n```\n\nWith multiline text fields, almost the same approach\
    \ as with single-line text fields and password fields can be used. The only difference\
    \ is the location where to put the prefill value: It belongs between `<textarea>`\
    \ and `</textarea>`, as shown in the preceding code.\n\n**NOTE:** If you want\
    \ to provide a default value in the multiline text field (for example, \"Enter\
    \ your data here\"), provide this instead of the empty string in the PHP code.\
    \ Remember that line feeds are possible, as well:\n\n```php\n<?php\n echo (isset($_POST['areafieldname']))\
    \ ?\n htmlspecialchars($_POST['areafieldname']) :\n \"default\\nvalue\";\n?>\n\
    ```\n\nUsing the combined cookie/GET or cookie/POST approach, the code simplifies\
    \ a bit:\n\n```php\n<?php\nrequire_once 'getFormData.inc.php';\n?>\n...\n<textarea\
    \ cols=\"40\" rows=\"5\" name=\"areafieldname\"><?php\n echo htmlspecialchars(getFormDataPOST('areafieldname'));\n\
    ?></textarea>\n```\n"
  mdcn: "\n## 检查表单是否已提交\n\n```php\n<?php\nif (isset($_POST['Submit'])) {\n    echo\
    \ '<h1>Thank you for filling out this form!</h1>';\n} else {\n?>\n<form method=\"\
    post\" action=\"<?php echo htmlspecialchars($_SERVER['PHP_SELF']); ?>\">\n   \
    \ <input type=\"submit\" name=\"Submit\" value=\"Submit form\" />\n</form>\n<?php\n\
    }\n?>\n```\n\n当 HTML 表单和处理 PHP 代码位于同一页面时（在预填充表单方面这是推荐的做法），需要确定表单是否只是通过浏览器调用（使用\
    \ GET）还是已提交（并且数据必须被处理）。\n\n可以采用多种不同的方法来完成此任务：一种始终有效的方法是为提交按钮分配一个名称，然后在表单提交时测试该名称是否存在。\n\
    \n**提示：** 如果你的表单有多个提交按钮，请为每个按钮赋予一个独特的名称；然后，你可以专门检查该名称，从而确定使用了哪个提交按钮。\n\n## 将表单数据保存到\
    \ Cookie 中\n\n```php\nfunction setCookieData($arr) {\n    $formdata = getCookieData();\n\
    \    if ($formdata == null) {\n        $formdata = array();\n    }\n    foreach\
    \ ($arr as $name => $value) {\n        $formdata[$name] = $value;\n    }\n   \
    \ setcookie('formdata', serialize($formdata), time()+30*24*60*60);\n}\n```\n\n\
    表单提交后，数据必须去往某个地方，可能存入数据库（参见第 8 章，“使用 MySQL 数据库”，和第 9 章，“使用其他数据库”），写入文件，或通过电子邮件发送。当网站包含多个相似的表单（例如，所有表单都要求用户提供姓名和联系信息）时，在用户填写后保存数据是个好主意。因为\
    \ HTTP 是无状态协议，你必须使用 Cookie（参见第 7 章，“在服务器文件系统中使用文件”）——会话是无用的，因为它们在用户关闭浏览器时就会过期。\n\
    \n因为用户代理只需保存每个域的 20 个 Cookie（尽管它们可能存储更多），因此最好将表单信息存储在一个 Cookie 中，以数组的形式。然而，Cookie\
    \ 中只允许字符串值；这就是为什么你必须序列化数组。此外，请注意你通常只能在 Cookie 中存储不到 4KB 的数据；其余部分可能会被截断。\n\n本段开头列出的函数会将作为参数提供的数组内容写入\
    \ Cookie。\n\n函数 getCookieData() 返回 Cookie 中已存在的数据（如有），并将其反序列化为数组。你将在后面的段落中看到代码。\n\
    \n剩下的唯一工作就是将所需的表单数据写入此数组。你可以只提交某些特定值，或完整的数组 `$_GET` 或 `$_POST`，如下代码所示：\n\n```php\n\
    <?php\nrequire_once 'getFormData.inc.php';\nif (isset($_POST['Submit'])) {\n \
    \   setCookieData($_POST);\n}\n?>\n...\n<?php\nif (isset($_POST['Submit'])) {\n\
    \    echo '<h1>Thank you for filling out this form!</h1>';\n} else {\n?>\n<form\
    \ method=\"post\" action=\"<?php echo htmlspecialchars($_SERVER['PHP_SELF']);\
    \ ?>\">\n...\n</form>\n<?php\n}\n?>\n```\n\n图 5.2 显示了由此产生的 Cookie。\n\n![](img/2862989e5dc7f1b1d0bc64321737f084_142_0.png)\n\
    \n图 5.2 序列化后的表单数据保存在 Cookie 中。\n\n**注意：** 请注意，你必须在任何 HTML 输出之前保存表单数据。因为 Cookie\
    \ 是作为 HTTP 头的一部分发送的，所以它们必须在 HTML 开始之前声明（因此 HTTP 头也就结束了）。你可以在第 6 章找到有关 Cookie 时机的更多信息。\n\
    \n## 预填充文本字段和密码字段\n\n```php\n<input type=\"text\" name=\"textfieldname\" value=\"\
    <?php echo isset($_POST['textfieldname']) ? htmlspecialchars($_POST['textfieldname'])\
    \ : '';?>\" />\n```\n\n文本字段（以及密码字段和隐藏字段）中的值通过其 value 属性提供。然而，那里的數據必須使用 htmlspecialchars()\
    \ 正确编码，以去掉诸如 `\"`, `<` 或 `>` 等危险字符。前述代码片段期望表单提交回自身：因此，它从 `$_POST` 中提取文本字段的当前值（使用\
    \ `$_GET` 也可类似工作）。这同样适用于密码字段和隐藏字段（尽管预填充密码字段被认为是不良做法，因为其中的“秘密”数据在 HTML 中未加密）。\n\
    \n**注意：** 如果你还想转义单引号 (`'`) 字符，请按以下方式使用 htmlspecialchars()：\n\n```php\nhtmlspecialchars($_POST['textfieldname'],\
    \ ENT_QUOTES)\n```\n\n因为在我们的表单中所有 HTML 属性都由双引号分隔，所以我们不需要特别转义单引号。然而，如果你使用单引号，则绝对需要在属性值中转义它们。\n\
    \n如果你想为此表单元素使用默认值，只需在 PHP 代码中提供该默认值，而不是空字符串：\n\n```php\n<input type=\"text\" name=\"\
    textfieldname\"\n    value=\"<?php\n    echo (isset($_POST['textfieldname']))\
    \ ?\n    htmlspecialchars($_POST['textfieldname']) : 'default\n    value';\n \
    \   ?>\" />\n```\n\n另一种可能性是从 Cookie 预填充表单值。当用户多次向表单输入数据时，这非常有用。因此，当他们几天后再次访问网站上的表单时，旧数据可以从\
    \ Cookie 中检索。是的，只需 1 个 Cookie，因为每个域只允许 20 个 Cookie。我们当然为此使用数组。然而，Cookie 值只允许字符串，所以需要使用\
    \ serialize() 和 unserialize()。\n\n下面的函数从包含表单数据的 Cookie 中检索一个值。优先级默认如下（但可通过 `variables_order`\
    \ php.ini 设置更改）：如果 `$_GET` 或 `$_POST` 包含此字段的当前值，则使用该值。（针对 `$_GET` 和 `$_POST` 存在特定版本的函数，因为这两种方法通常一次只使用一种。）否则，脚本会在\
    \ `$_COOKIE` 中查找相关值。如果未找到任何内容，则返回空字符串：\n\n```php\nfunction getCookieData() {\n\
    \    if (isset($_COOKIE['formdata'])) {\n        $formdata = $_COOKIE['formdata'];\n\
    \        if ($formdata != '') {\n            if (get_magic_quotes_gpc()) {\n \
    \               $formdata = stripslashes($formdata);\n            }\n        \
    \    return unserialize($formdata);\n        } else {\n            return array();\n\
    \        }\n    } else {\n        return null;\n    }\n}\n\nfunction getFormDataPOST($name)\
    \ {\n    if (isset($_POST[$name])) {\n        return $_POST[$name];\n    } else\
    \ {\n        $cookiedata = getCookieData();\n        if ($cookiedata != null &&\n\
    \            isset($cookiedata[$name])) {\n            return $cookiedata[$name];\n\
    \        }\n    }\n    return '';\n}\n\nfunction getFormDataGET($name) {\n   \
    \ if (isset($_GET[$name])) {\n        return $_GET[$name];\n    } else {\n   \
    \     $cookiedata = getCookieData();\n        if ($cookiedata != null &&\n   \
    \         isset($cookiedata[$name])) {\n            return $cookiedata[$name];\n\
    \        }\n    }\n    return '';\n}\n```\n\n现在，预填充表单值很容易：因为 getFormDataGET()\
    \ 和 getFormDataPOST() 总是返回内容——包括空字符串——因此返回值可以直接用于文本字段的 value 属性中：\n\n```php\n\
    <?php\nrequire_once 'getFormData.inc.php';\n?>\n...\n<input type=\"text\" name=\"\
    textfieldname\"\n    value=\"<?php\n    echo\n    htmlspecialchars(getFormDataPOST('textfieldname'));\n\
    ?>\">\n```\n\n## 预填充多行文本字段\n\n```php\n<textarea cols=\"40\" rows=\"5\" name=\"\
    areafieldname\"><?php echo (isset($_POST['areafieldname'])) ? htmlspecialchars($_POST['areafieldname'])\
    \ : ''; ?></textarea>\n```\n\n对于多行文本字段，几乎可以使用与单行文本字段和密码字段相同的方法。唯一的区别是放置预填充值的位置：它应位于\
    \ `<textarea>` 和 `</textarea>` 之间，如前述代码所示。\n\n**注意：** 如果你想在多行文本字段中提供默认值（例如，“在此输入你的数据”），请在\
    \ PHP 代码中提供它而不是空字符串。请记住，换行也是可能的：\n\n```php\n<?php\n echo (isset($_POST['areafieldname']))\
    \ ?\n htmlspecialchars($_POST['areafieldname']) :\n \"default\\nvalue\";\n?>\n\
    ```\n\n使用组合的 Cookie/GET 或 Cookie/POST 方法，代码会简化一些：\n\n```php\n<?php\nrequire_once\
    \ 'getFormData.inc.php';\n?>\n...\n<textarea cols=\"40\" rows=\"5\" name=\"areafieldname\"\
    ><?php\n echo htmlspecialchars(getFormDataPOST('areafieldname'));\n?></textarea>\n\
    ```\n"
