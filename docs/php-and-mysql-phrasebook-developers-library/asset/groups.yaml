    \ a file using `simplexml_load_file()`—you can also use `simplexml_load_string()`\
    \ for strings—and then reads all information in.\n\nCompare this to the DOM approach.\
    \ SimpleXML may be slower in some instances than DOM, but the coding is so much\
    \ quicker.\n\n> **NOTE:** Writing can be done easily, as well. However, it is\
    \ not possible to append elements without any external help (for instance, by\
    \ using DOM and loading this DOM into SimpleXML using `simplexml_import_dom()`).\n\
    \n## Using XPath with SimpleXML\n\n### `$xml->xpath()`\n\n```php\n<?php\n$xml\
    \ = simplexml_load_file('quotes.xml');\nforeach ($xml->xpath('*/quote') as $quote)\
    \ {\n    echo '<p>' . htmlspecialchars($quote) . '</p>';\n}\n?>\n```\n\n*Using\
    \ XPath with SimpleXML (xpath.php)*\n\nOne of the best guarded secrets of SimpleXML\
    \ is that the extension has a built-in support for XPath, the XML query language.\
    \ Using it is easy: After creating a SimpleXML object, you can use the `xpath()`\
    \ method and get all matching nodes in return.\n\n## Transforming XML with XSL\n\
    \n```php\n<?php\n$xml = new DOMDocument();\n$xml->load('quotes.xml');\n$xsl =\
    \ new DOMDocument();\n$xsl->load('quotes.xsl');\n$xslt = new XSLTProcessor();\n\
    $xslt->importStylesheet($xsl);\n$result = $xslt->transformToDoc($xml);\necho $result->saveXML();\n\
    ?>\n```\n\n*Using XSLT with PHP (xslt.php)*\n\nTransforming XML into another format\
    \ is usually done by XSLT (XSL Transformation). In PHP, XSLT is done by libxslt\
    \ and can be enabled using `php_xslt.dll` (in php.ini) on Windows and the switch\
    \ `--with-xslt` on other platforms. Writing the XSL file may be hard, but the\
    \ PHP code afterward is quite simple: Load both the XML and the XSLT (which is\
    \ an XML document, as well) into a DOM object, and then instantiate an `XSLTProcessor`\
    \ object. Call `importStylesheet()`, and then `transformToDoc()`.\n\nThe preceding\
    \ code contains the code for these steps, and the file `quotes.xsl` in the download\
    \ repository contains markup that transforms the quotes' XML into the well-known\
    \ HTML bulleted list.\n\n## Validating XML\n\n```php\n<?php\n$dom = new DOMDocument();\n\
    $dom->load('quotes.xml');\necho 'Validation ';\necho (($dom->relaxNGValidate('quotes.rng'))\
    \ ? 'succeeded.' : 'failed.');\n?>\n```\n\n*Validating XML against relaxNG (validate-rng.php)*\n\
    \nPHP can validate XML against three types of files: Document Type Definitions\
    \ (DTDs), Schemas (.xsd), and relaxNG. For the last two, the following four methods\
    \ of the DOM object are available:\n\n- `schemaValidate('file.xsd')` — Validates\
    \ against a Schema file\n- `schemaValidateSource('...')` — Validates against a\
    \ Schema string\n- `relaxNGValidate('file.rng')` — Validates against a relaxNG\
    \ file\n- `relaxNGValidateSource('...')` — Validates against a relaxNG string\n\
    \nThe preceding code uses `relaxNGValidate()` to validate a (well-formed) XML\
    \ file against a nonmatching relaxNG file. If you change `<element name=\"person\"\
    >` to `<element name=\"author\">` in the file `\"quotes.rng\"`, the validation\
