  md: "\nThis example shows a very short demonstration of Ajax. This example uses\
    \ the Sajax toolkit (the S stands for simple) available at www.modernmethod.com/sajax.\
    \ Many Ajax libraries and frameworks are available, so feel free to pick the one\
    \ you like most; we are just picking a simple one here to focus on the combination\
    \ of Ajax and PHP.\n\nThe complete code for this example is quite long because\
    \ both PHP and JavaScript are needed. First, you need the server-side logic. For\
    \ this, the Sajax toolkit is loaded, which comes as a single PHP file. You then\
    \ “export” (register) all PHP functions you want to use from the client side.\
    \ The following example has a small function that generates a random RGB color:\n\
    \n```\n<?php\nrequire_once 'Sajax.php';\n\nsajax_init();\nsajax_export('randomColor');\n\
    sajax_handle_client_request();\n\nfunction randomColor() {\n    $color = '#';\n\
    \    for ($i=0; $i<3; $i++) {\n        $color .= dechex(rand(0, 255));\n    }\n\
    \    return $color;\n}\n?>\n```\n\n*The Server Side Part of the Application (ajax.php:\
    \ excerpt)*\n\nOn the client side, a call to the (PHP) function sajax_show_javascript()\
    \ does most of the work; it creates some lines of JavaScript code that take care\
    \ of the requests to the Web server in the background. Then, all PHP functions\
    \ that have been registered before can be called on the client side by prepending\
    \ x_ to the name of the function. One parameter you have to provide is the name\
    \ of a callback function; this function is then called when the server side has\
    \ responded to the request.\n\nThe following code calls the randomColor() PHP\
    \ function every five seconds and then writes a text in this random color—all\
    \ without server round-trips! Figure 11.5 shows the result:\n\n```\n<script type=\"\
    text/javascript\">\n<?php\nsajax_show_javascript();\n?>\nchangeColor();\nsetInterval(changeColor,\
    \ 5000);\n\nfunction changeColor() {\n    x_randomColor(randomColor_callback);\n\
    }\n\nfunction randomColor_callback(result) {\n    var text = '<span style=\"color:\
    \ ' + result + '\">A colorful acronym ...</span>';\n    document.getElementById('output').innerHTML\
    \ =\n    text;\n}\n</script>\n...\n<div id=\"output\"></div>\n```\n\nThe Client-Side\
    \ Part of the Application (ajax.php; excerpt)\n\n![](img/2862989e5dc7f1b1d0bc64321737f084_327_0.png)\n\
    \nFigure 11.5 The text appears, thanks to JavaScript code calling PHP\n\n## Exchanging\
    \ Data with the Server\n\nIn the preceding example, the data we exchanged with\
    \ the server was quite trivial—a simple string. In real-world applications, however,\
    \ we have more complex data we need to send from the client to the server and\
    \ back. XML could be used as an exchange format, but it is bloated, and so does\
    \ not fare well with high-performance applications. PHP's serialize() and unserialize()\
    \ methods could be used to convert complex information into a string that can\
    \ be exchanged via HTTP, but there is no built-in counterpart functionality JavaScript\
    \ offers.\n\nThe de facto standard for data exchange with JavaScript is JSON,\
    \ JavaScript Object Notation. The unofficial home page at http://json.org/ explains\
    \ the format in great detail, but basically JSON sums up the part of the JavaScript\
    \ specification where arrays are explained. Take this string, for instance:\n\n\
    ```\n[\n{\"url\": \"http:\\\\/\\\\/json.org\\/\", \"text\": \"JSON\"},\n{\"url\"\
    : \"http:\\\\/\\\\/php.net\\/\", \"text\": \"PHP\"}\n]\n```\n\nThis is the syntax\
    \ that can be used within JavaScript to define an array that contains two associative\
    \ arrays (or objects, as some call it, despite these elements not really being\
    \ objects). Modern browsers have an easy built-in functionality to convert such\
    \ a string into a real JavaScript value (and there are workarounds for older versions),\
    \ so JSON is ideal for Ajax applications.\n\nBeginning with version 5.2, PHP supports\
    \ JSON out of the box. The function json_encode() converts a serializable PHP\
    \ value into JSON, and json_decode() converts a JSON string back into something\
    \ PHP can work with. The following code essentially creates the preceding JSON\
    \ string, minus the indentations and extra whitespace characters:\n\n```\n<?php\n\
    \nclass LinkData {\n    public $url;\n    public $text;\n    public function __construct($url,\
    \ $text) {\n        $this->url = $url;\n        $this->text = $text;\n    }\n\
    }\n\n$data = array(\n    new LinkData('http://json.org/', 'JSON'),\n    new LinkData('http://php.net/',\
    \ 'PHP')\n);\n\necho json_encode($data);\n?>\n```\n\nThe JSON Server Endpoint\
    \ (json.php)\n\nOn the client side, JavaScript code can then call the PHP script\
    \ and process the data. When using a JavaScript library like the popular jQuery\
    \ (http://jquery.com/), working with the JSON data can be quite easy (see Figure\
    \ 11.6). The following code displays the information contained in the JSON string\
    \ in the form of a bulleted list:\n\n```\n<script type=\"text/javascript\" src=\"\
    http://code.jquery.com/jquery-latest.js\"></script>\n<script type=\"text/javascript\"\
    >\n$(function() {\n    $.getJSON(\"json.php\", function(data) {\n        $.each(data,\
    \ function(key, value) {\n            $(\"<a>\").attr(\"href\", value.url)\n \
    \               .html(value.text)\n                .wrap(\"<li>\")\n         \
    \       .parent()\n                .appendTo(\"ul\");\n        });\n    });\n\
    });\n</script>\n...\n<body>\n    <ul></ul>\n</body>\n```\n\nThe JSON Client, Using\
    \ jQuery (json.html)\n\n![](img/2862989e5dc7f1b1d0bc64321737f084_330_0.png)\n\n\
    Figure 11.6 The JSON data is parsed and then displayed as a list, thanks to jQuery\
    \ calling PHP code.\n\n## What Does PEAR Offer?\n\nAlong with the several modules\
    \ mentioned in this chapter, the following PHP Extension and Application Repository\
    \ (PEAR) packages offer functionality that can be helpful when connecting with\
    \ others using PHP:\n\n- The HTTP category of PEAR offers some relevant packages,\
    \ including HTTP, HTTP_Header, HTTP_Request2, and HTTP_Server.\n- Likewise, you\
    \ can find useful packages in the Networking category, including Net_FTP, Net_IMAP,\
    \ and Net_Socket.\n- The Services category of PEAR contains several classes that\
    \ offer an easy-to-use interface for well-known Web Services.\n\n## Index\n\n\
    ### Symbols and Numerics\n\n!= operator, comparing strings, 26\n[...] special\
    \ character, in regular expressions, 28\n* (asterisk), in regular expressions,\
    \ 28\n\\ (backslash), in regular expressions, 29\n^ (caret), in regular expressions,\
    \ 27\n$ (dollar sign), in regular expressions, 27\n. (dot), in regular expressions,\
    \ 28\n== operator, comparing strings, 8-10, 26\n| (pipe), in regular expressions,\
    \ 28\n+ (plus sign), in regular expressions, 28\n? (question mark), in regular\
    \ expressions, 27\n$_COOKIE array, 170\n$_FILES array uploaded file information,\
    \ retrieving, 155\n$_GET array\naccessing form data, 126-127\n\nGraphical Submit\
    \ buttons, 144\nmandatory fields, validating, 145\nprefilling text fields, 131,\
    \ 133-134\npreselecting radio buttons, 136\npreselecting selection lists, 141-142\n\
    reading in form data, 123\n$_POST array\naccessing form data, 126-127\nGraphical\
    \ Submit buttons, 144\nmandatory fields, validating, 145\nprefilling text fields,\
    \ 131, 133-134\npreselecting radio buttons, 136\npreselecting selection lists,\
    \ 141-142\n$_REQUEST array, accessing form data, 126-127\n401 status code, 198\n\
    \n### A\n\nabstract classes, 104-107\naccess, file access\n  PHP built-in class,\
    \ 221-222\n  relative paths for, 209-210\n  security traps, 210-211\naddslashes()\
    \ function, 265\nAES (Advanced Encryption Standard), 15\nAjax, 313-316\najax.php,\
    \ 314-315\narray() function, creating arrays, 40\narray_filter() function, 66\n\
    array_map() function, 62\narray_multisort() function, 54\narray_rand() function,\
    \ 67-68\narray_walk() function, 64\narrays\n  applying effects to elements, 62-65\n\
