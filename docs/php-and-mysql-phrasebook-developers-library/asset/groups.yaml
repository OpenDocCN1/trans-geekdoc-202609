    \ 开关必须指向 /path/to/mysql config。Windows 用户必须使用文件 php_mysqli.dll 和 lib-mysql.dll；其余先前的安装说明保持不变。\n\
    \n现在连接数据库很容易：只需调用 mysql_connect()，提供服务器、用户名和密码。然后你会得到一个句柄，可用于 mysqli_select_db()\
