    After a user fills out a form correctly, what do you do with the form data? A
    very intuitive approach that does not require too much setup on the server is
    to write the data into a file on the server.


    The preceding code contains a very naive approach: All data is stored in a file
    on the server. When the form is submitted, the file is read in and unserialized
    into an array. Then, the form data is appended to the array. Finally, the array
    is serialized again and written back to the file.


    Figure 5.3 shows this file in a text editor.


    ![](img/2862989e5dc7f1b1d0bc64321737f084_163_0.png)


    Figure 5.3 Data written into the form (but which can later be unserialized)


    NOTE: Of course, race conditions could occur, and the file could be simultaneously
    read by two processes, which would result in just one of the two processes appearing
    in the file. To avoid this, you have to implement file locking as shown in Chapter
    7.'
