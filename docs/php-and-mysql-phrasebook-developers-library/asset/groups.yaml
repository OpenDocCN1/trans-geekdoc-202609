  md: "\nImaginative and create some real-world Web Services based on what you learn\
    \ in this chapter. In addition, we focus on SOAP web services; XML-RPC does not\
    \ seem to be used that often these days, whereas JSON Web Services (which is covered\
    \ later in this chapter) has become more popular.\n\n## Creating a Web Service\
    \ with NuSOAP\n\n```\n<?php\n    require_once 'nusoap.php';\n\n    $soap = new\
    \ soap_server;\n    $soap->register('add');\n    $soap->service($HTTP_RAW_POST_DATA);\n\
    \n    function add($a, $b) {\n        return $a + $b;\n    }\n?>\n```\n\nA SOAP\
    \ Web Service with NuSOAP (soap-nusoap.server.php)\n\nAt http://nusoap.sourceforge.net/,\
    \ you will find NuSOAP, one of the best-known external SOAP classes for PHP. Some\
    \ might even know its predecessor, SOAPx4. These days, releases are not issued\
    \ very often, but the library is quite stable. You might also want to check the\
    \ Subversion (SVN) repository for the most recent code. You might find several\
    \ files there, but nusoap.php is the one you want.\n\nCreating a Web Service with\
    \ NuSOAP is really simple because the module takes care of all the painful things,\
    \ including SOAP. Just follow these steps:\n\n- 1. Write the function you want\
    \ to expose as a Web method.\n- 2. Instantiate the `soap_server` class.\n- 3.\
    \ Register your function with the SOAP server.\n- 4. Call the `service()` method\
    \ and submit `$HTTP_RAW_POST_DATA` as the parameter.\n\nThis code implements a\
    \ SOAP server using NuSOAP. Figure 11.2 shows the output in the browser when you\
    \ are trying to call the Web Service directly from the client. The error message\
    \ says that the XML was empty—of course it is, because we didn’t send a request!\n\
    \n![](img/2862989e5dc7f1b1d0bc64321737f084_316_0.png)\n\nFigure 11.2 This error\
    \ message is a good sign; the script seems to work (so far).\n\n![](img/2862989e5dc7f1b1d0bc64321737f084_319_0.png)\n\
    \nFigure 11.4 This WSDL is generated by NuSOAP, not by the programmer.\n\n## Consuming\
    \ a Web Service with NuSOAP\n\n```\n<?php\n    require_once 'nusoap.php';\n\n\
    \    $soap = new soapclient('http://localhost/wsdl-nusoap-server.php?wsdl', true);\n\
    \    $proxy = $soap->getProxy();\n    $result = $proxy->add(47, 11);\n    echo\
    \ \"47 + 11 = $result\";\n?>\n```\n\nConsuming the Web Service with NuSOAP (wsdl-nusoap-client.php)\n\
    \nActually, using a NuSOAP service is even easier than creating one. You just\
    \ have to load the WSDL file and then get a so-called proxy class. (That's a local\
    \ class that behaves just as if the Web Service is a local class, too.) So, you\
    \ can call the Web Service's methods directly, and NuSOAP takes care of all the\
    \ rest (including opening a connection to the remote server, assembling and parsing\
    \ XML, and so on).\n\nTo do this, the soapclient class (without the underscore\
    \ character) must be instantiated, and then the getProxy() method creates the\
    \ proxy class. The code implements this for the demo service from the previous\
    \ example. Note the URL of the WSDL file: It's the Web Service's URL plus ?wsdl\
    \ appended to the end; change the URL accordingly for your system.\n\n**NOTE:**\
    \ Appending ?wsdl to the URL to get the WSDL description of a Web Service is an\
    \ idea borrowed from Microsoft .NET (and now also used in other technologies).\
    \ However, there the appendix is not case sensitive, whereas NuSOAP requires it\
    \ to be in lowercase letters. Keep this in mind when working cross-platform.\n\
    \n## Creating a Web Service with the PHP 5 SOAP Extension\n\n```\n<?php\n$soap\
    \ = new SoapServer(null, array('uri' => 'http://php.phrasebook.org/'));\n$soap->addFunction('add');\n\
    $soap->handle();\n\nfunction add($a, $b) {\n    return $a + $b;\n}\n?>\n```\n\n\
    *A Web Service with PHP 5 SOAP (soap-php5-server.php)*\n\nOne of the key features\
    \ of PHP 5 is the new SOAP extension. Because it is written in C, it is much faster\
    \ than anything that is coded in PHP alone. However, the extension is relatively\
    \ new, so there are still some hiccups and missing features. However, it often\
    \ works well.\n\nYou have to configure PHP with --enable-soap to use the extension;\
    \ Windows users have to add extension=php_soap.dll to their php.ini configuration\
    \ file. Then, the extension is available, and writing a SOAP server is quite easy.\n\
    \nAgain, it's a small number of steps: Instantiate the SoapServer class, add your\
    \ function with addFunction(), and, finally, call handle().\n\n## Automatically\
    \ Generating WSDL with the PHP 5 SOAP Extension\n\nThe greatest shortcoming of\
    \ PHP 5 SOAP is that there is no way to automatically generate WSDL with it. This\
    \ is not often mentioned; however, it does create problems in real life. WSDL\
    \ is so complicated that errors in the WSDL are hard to see and even harder to\
    \ find. However, you can create such a WSDL description for a Web Service in several\
    \ ways, most of which have been used in real-world projects.\n\n- Use NuSOAP or\
    \ PEAR::SOAP to create a similar service, just to get the WSDL—just change the\
    \ <soap:address> element\n- Use the class Ctrx_SOAP_AutoDiscover (available at\
    \ http://crtx.org/index.php?area=Main&page=Crtx_SOAP_AutoDiscover)\n- Use the\
    \ Webservice Helper tool (available at http://www.jool.nl/new/index.php?file_id=1)\n\
    - Use the WSDL_Gen class (available at http://www.schlossnagle.org/~george/php/WSDL_Gen.tgz)\n\
    \nSo you can see, WSDL support is being worked on, not as part of the SOAP extension\
    \ itself, but in the form of external projects. Hopes are that this will change\
    \ some day.\n\nIf you finally have a WSDL description of your service (in the\
    \ download archive, you will find a file AddService.wsdl that originated from\
    \ the PEAR::SOAP-generated WSDL), the code for the server has to be updated just\
    \ slightly. The first parameter for the SoapServer instantiation receives the\
    \ WSDL URL; in addition, the methods of the Web Service must be put in a class.\
    \ Then, setClass() provides the SOAP extension with the name of the class to be\
    \ used:\n\n```\n<?php\n$soap = new SoapServer(\n    'AddService.wsdl',\n    array('uri'\
    \ => 'http://php.phrasebook.org/')\n);\n$soap->setClass('ServiceClass');\n$soap->handle();\n\
    \nclass ServiceClass {\n    function add($a, $b) {\n        return $a + $b;\n\
    \    }\n}\n?>\n```\n\nA WSDL-Enabled Web Service with PHP 5 SOAP (wsdl-php5-server.php)\n\
    \n## Consuming a Web Service with the PHP 5 SOAP Extension\n\n```\n<?php\n$soap\
    \ = new SoapClient('AddService.wsdl');\ntry {\n    $result = $soap->add(47, 11);\n\
    \    echo \"47 + 11 = $result\";\n} catch (SoapFault $e) {\n    echo \"Error:\
    \ {$e->faultstring}\";\n}\n?>\n```\n\nConsuming the Web Service with PHP 5 SOAP\
    \ (wsdl-php5-client.php)\n\nConsumption is again easy, as long as you have a WSDL\
    \ description. This code calls the Web Services and also catches any errors, thanks\
    \ to PHP 5's try-catch mechanism.\n\nTIP: In an attempt to boost performance,\
    \ PHP 5's SOAP extension defaults to caching WSDL. The following are the standard\
    \ settings from php.ini recommended:\n\n```\n[soap]\n; Enables or disables WSDL\
    \ caching feature.\nsoap.wsdl_cache_enabled=1\n; Sets the directory name where\
    \ SOAP extension\nwill put cache files.\nsoap.wsdl_cache_dir=\"/tmp\"\n; (time\
    \ to live) Sets the number of seconds while\ncached file will be used\n; instead\
    \ of original one.\nsoap.wsdl_cache_ttl=86400\n```\n\nWhen developing a Web Service\
    \ and maybe changing the WSDL, this is, of course, a no-brainer. Therefore, set\
    \ soap.wsdl_cache_enabled to Off during development, but turn it on for production\
    \ servers.\n\n## Using Ajax\n\nWikipedia lists several dozen different meanings\
    \ for the term Ajax, including a soccer team from the Netherlands, two figures\
    \ in Homer's Iliad, and a household-cleaning product. However, since 2005, Ajax\
    \ also stands for Asynchronous JavaScript + XML. The technology is far from new\
    \ (the underlying technology, XML HTTP requests from JavaScript, is supported\
    \ by recent versions of Internet Explorer, Firefox, Safari, and Chrome—also, XML\
    \ is not required at all for this), but only after this weird term was coined\
    \ did people actually start using it.\n\nThe basic principle is that JavaScript\
    \ can now call a remote server and then process its return values without having\
    \ to reload the whole page. Of course, this has little to do with PHP; however,\
    \ some Ajax classes make using Ajax from within PHP very easy.\n"
  mdcn: "\n\n发挥想象力，根据本章所学内容创建一些真实世界的Web服务。另外，我们重点介绍SOAP Web服务；XML-RPC如今似乎不太常用了，而JSON\
    \ Web服务（本章后面会介绍）已经变得更为流行。\n\n## 使用NuSOAP创建Web服务\n\n```\n<?php\n    require_once\
    \ 'nusoap.php';\n\n    $soap = new soap_server;\n    $soap->register('add');\n\
    \    $soap->service($HTTP_RAW_POST_DATA);\n\n    function add($a, $b) {\n    \
    \    return $a + $b;\n    }\n?>\n```\n\n一个使用NuSOAP的SOAP Web服务（soap-nusoap.server.php）\n\
    \n在 http://nusoap.sourceforge.net/ 上，你会发现NuSOAP，它是PHP最著名的外部SOAP类之一。有些人甚至可能知道它的前身SOAPx4。如今，其发布新版本的频率不高，但这个库相当稳定。你可能还想查看Subversion（SVN）仓库以获取最新代码。那里可能有几个文件，但你需要的只有nusoap.php。\n\
    \n使用NuSOAP创建Web服务非常简单，因为该模块处理了所有麻烦的事情，包括SOAP。只需按以下步骤操作：\n\n- 1. 编写你想作为Web方法暴露的函数。\n\
    - 2. 实例化 `soap_server` 类。\n- 3. 向SOAP服务器注册你的函数。\n- 4. 调用 `service()` 方法并提交 `$HTTP_RAW_POST_DATA`\
    \ 作为参数。\n\n这段代码使用NuSOAP实现了一个SOAP服务器。图11.2展示了当你试图直接从客户端调用Web服务时浏览器的输出。错误消息提示XML为空——这是理所当然的，因为我们没有发送请求！\n\
    \n![](img/2862989e5dc7f1b1d0bc64321737f084_316_0.png)\n\n图11.2 这个错误消息是个好兆头；脚本似乎可以工作（目前而言）。\n\
    \n![](img/2862989e5dc7f1b1d0bc64321737f084_319_0.png)\n\n图11.4 这份WSDL是由NuSOAP生成的，而不是程序员编写的。\n\
    \n## 使用NuSOAP调用Web服务\n\n```\n<?php\n    require_once 'nusoap.php';\n\n    $soap\
    \ = new soapclient('http://localhost/wsdl-nusoap-server.php?wsdl', true);\n  \
    \  $proxy = $soap->getProxy();\n    $result = $proxy->add(47, 11);\n    echo \"\
    47 + 11 = $result\";\n?>\n```\n\n使用NuSOAP调用Web服务（wsdl-nusoap-client.php）\n\n实际上，使用NuSOAP服务比创建它还要容易。你只需加载WSDL文件，然后获得一个所谓的代理类。（这是一个本地类，其行为就像Web服务也是一个本地类一样。）因此，你可以直接调用Web服务的方法，NuSOAP会处理其余所有事情（包括打开到远程服务器的连接、组装和解析XML等）。\n\
    \n要做到这一点，必须实例化soapclient类（不带下划线字符），然后getProxy()方法会创建代理类。上面的代码针对前一个示例中的演示服务实现了这个流程。注意WSDL文件的URL：它是Web服务的URL末尾加上?wsdl；请根据你的系统相应地更改URL。\n\
    \n**注意：** 在URL末尾附加?wsdl以获取Web服务的WSDL描述，这个想法借鉴自Microsoft .NET（现在也被其他技术采用）。然而，在.NET中该后缀不区分大小写，而NuSOAP要求使用小写字母。在跨平台开发时请记住这一点。\n\
    \n## 使用PHP 5 SOAP扩展创建Web服务\n\n```\n<?php\n$soap = new SoapServer(null, array('uri'\
    \ => 'http://php.phrasebook.org/'));\n$soap->addFunction('add');\n$soap->handle();\n\
    \nfunction add($a, $b) {\n    return $a + $b;\n}\n?>\n```\n\n*一个使用PHP 5 SOAP的Web服务（soap-php5-server.php）*\n\
    \nPHP 5的关键特性之一是新的SOAP扩展。由于它是用C语言编写的，因此比任何纯PHP代码都快得多。然而，这个扩展相对较新，因此仍然存在一些小问题和不完善的功能。不过，它通常能很好地工作。\n\
    \n要使用该扩展，你必须使用--enable-soap配置PHP；Windows用户必须在php.ini配置文件中添加extension=php_soap.dll。然后，扩展即可使用，编写SOAP服务器也变得相当容易。\n\
    \n同样，只需很少的步骤：实例化SoapServer类，使用addFunction()添加你的函数，最后调用handle()。\n\n## 使用PHP 5\
    \ SOAP扩展自动生成WSDL\n\nPHP 5 SOAP的最大缺点是无法使用它自动生成WSDL。这一点并不常被提及，但它确实在现实生活中造成问题。WSDL非常复杂，其中的错误难以察觉，甚至更难找到。然而，你仍然可以通过几种方式为Web服务创建这样的WSDL描述，其中大部分已在真实项目中使用。\n\
    \n- 使用NuSOAP或PEAR::SOAP创建一个类似的服务，仅为了获取WSDL——只需修改<soap:address>元素\n- 使用Ctrx_SOAP_AutoDiscover类（可从\
    \ http://crtx.org/index.php?area=Main&page=Crtx_SOAP_AutoDiscover 获取）\n- 使用Webservice\
    \ Helper工具（可从 http://www.jool.nl/new/index.php?file_id=1 获取）\n- 使用WSDL_Gen类（可从\
    \ http://www.schlossnagle.org/~george/php/WSDL_Gen.tgz 获取）\n\n因此你可以看到，WSDL支持正在开发中，但不是作为SOAP扩展本身的一部分，而是以外部项目的形式。希望有一天这种情况会改变。\n\
    \n如果你最终拥有了服务的WSDL描述（在下载归档中，你会找到一个名为AddService.wsdl的文件，它源自PEAR::SOAP生成的WSDL），服务器的代码只需稍作更新。SoapServer实例化的第一个参数接收WSDL\
    \ URL；此外，Web服务的方法必须放在一个类中。然后，setClass()向SOAP扩展提供要使用的类名：\n\n```\n<?php\n$soap =\
    \ new SoapServer(\n    'AddService.wsdl',\n    array('uri' => 'http://php.phrasebook.org/')\n\
    );\n$soap->setClass('ServiceClass');\n$soap->handle();\n\nclass ServiceClass {\n\
    \    function add($a, $b) {\n        return $a + $b;\n    }\n}\n?>\n```\n\n一个支持WSDL的、使用PHP\
    \ 5 SOAP的Web服务（wsdl-php5-server.php）\n\n## 使用PHP 5 SOAP扩展调用Web服务\n\n```\n<?php\n\
    $soap = new SoapClient('AddService.wsdl');\ntry {\n    $result = $soap->add(47,\
    \ 11);\n    echo \"47 + 11 = $result\";\n} catch (SoapFault $e) {\n    echo \"\
    Error: {$e->faultstring}\";\n}\n?>\n```\n\n使用PHP 5 SOAP调用Web服务（wsdl-php5-client.php）\n\
    \n调用同样很容易，只要你拥有WSDL描述。这段代码调用Web服务并捕获任何错误，这要归功于PHP 5的try-catch机制。\n\n提示：为了提高性能，PHP\
    \ 5的SOAP扩展默认会缓存WSDL。以下是php.ini中推荐的标准设置：\n\n```\n[soap]\n; Enables or disables\
    \ WSDL caching feature.\nsoap.wsdl_cache_enabled=1\n; Sets the directory name\
    \ where SOAP extension\nwill put cache files.\nsoap.wsdl_cache_dir=\"/tmp\"\n\
    ; (time to live) Sets the number of seconds while\ncached file will be used\n\
    ; instead of original one.\nsoap.wsdl_cache_ttl=86400\n```\n\n当开发Web服务并可能更改WSDL时，这当然是个不费脑筋的决定。因此，在开发期间将soap.wsdl_cache_enabled设置为Off，但在生产服务器上应将其打开。\n\
    \n## 使用Ajax\n\n维基百科列出了Ajax一词几十种不同的含义，包括一支荷兰足球队、荷马《伊利亚特》中的两个人物，以及一种家用清洁产品。然而，自2005年以来，Ajax还代表Asynchronous\
    \ JavaScript + XML。这项技术远非新事物（其底层技术——来自JavaScript的XML HTTP请求——已得到Internet Explorer、Firefox、Safari和Chrome最新版本的支持；而且，XML对此并不是必需的），但直到这个奇怪的术语被创造出来之后，人们才真正开始使用它。\n\
    \n其基本原理是，JavaScript现在可以调用远程服务器，然后处理返回值，而无需重新加载整个页面。当然，这与PHP关系不大；然而，一些Ajax类使得在PHP中使用Ajax变得非常容易。\n\
    \n"
