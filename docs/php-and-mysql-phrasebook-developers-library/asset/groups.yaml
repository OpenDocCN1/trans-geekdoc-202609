    # Working with MySQL Databases


    One of the main strengths of PHP is its support for a vast number of databases.
    Very often, PHP and MySQL are viewed as an entity. However, other databases have
    their strengths, too. For instance, it took MySQL quite some time to support features
    that are considered standard in other systems; however, MySQL is known to be very
    fast.


    This chapter focuses on MySQL, whereas Chapter 9, “Working with Other Databases,”
    tackles quite a number of other databases. Both chapters show the basic operations
    with them: connecting, sending SQL statements, and evaluating the return values.
    No matter what your database-driven web application must do, it always has to
    do these steps.


