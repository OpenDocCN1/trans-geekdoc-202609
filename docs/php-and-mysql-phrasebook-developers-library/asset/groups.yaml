    \        date('YmdHis'),\n            mysqli_real_escape_string($GLOBALS['sess_mysqli'],\
    \ $id))\n        );\n    }\n    return true;\n}\n\nfunction sess_destroy($id)\
    \ {\n    mysqli_query(\n        $GLOBALS['sess_mysqli'],\n        sprintf('DELETE\
    \ FROM sessiondata WHERE id=\\'%s\\'',\n            mysqli_real_escape_string($GLOBALS['sess_mysqli'],\
    \ $id))\n    );\n    return true;\n}\n\nfunction sess_gc($timeout) {\n    $timestamp\
    \ = date('YmdHis', time() - $timeout);\n    mysqli_query(\n        $GLOBALS['sess_mysqli'],\n\
    \        sprintf('DELETE FROM sessiondata WHERE access < \\'%s\\'',\n        \
    \    $timestamp)\n    );\n}\n\nsession_set_save_handler(\n    'sess_open', 'sess_close',\
    \ 'sess_read',\n    'sess_write', 'sess_destroy', 'sess_gc');\n?>\n```\n\nA Custom\
    \ Session Management (session_mysqli.inc.php)\n"
  mdcn: "\n注意：URL 中的会话 ID 通常是不好的事情。例如，因为人们可以书签保存此信息，如果包含此类信息，一些搜索引擎将不会收录您的网站。如今几乎每个主要电子商务网站都需要\
    \ cookie。\n\n## 激活会话\n\n### session_start()\n\n```php\n<?php\n    session_start();\n\
    \    echo 'Sessions activated.';\n?>\n```\n\n*激活会话 (session_start.php)*\n\n使用会话管理始终需要资源，因此会消耗性能。所以，会话必须被激活。因为\
    \ cookie 可能是其中的一部分，所以必须在任何 HTML 内容发送到客户端之前完成。这可以通过两种方式实现：\n\n- 使用 php.ini 指令 session.auto_start\
    \ = 1 全局激活会话。\n- 使用函数 session_start() 按脚本激活会话。\n\n从性能角度来看，后一种选项是最好的。\n\n## 读取和写入会话\n\
    \n```php\n<?php\n    session_start();\n    echo 'Sessions activated.<br />';\n\
    \    $_SESSION['version'] = phpversion();\n    echo 'Session data written.<br\
    \ />';\n    echo \"Session data read: {$_SESSION['version']}.\";\n    //could\
    \ also be used on another page\n?>\n```\n\n*读取和写入会话 (session_readwrite.php)*\n\
    \n所有会话数据都通过 `$_SESSION` 数组从 PHP 脚本访问。因为数据本身存储在服务器端，所以您可以写入会话数据并在下一个 PHP 语句中读取它，而不需要像\
    \ cookie 那样进行服务器往返。只需记住先调用 `session_start()`，然后访问 `$_SESSION`。前面的列表创建了一个会话文件，如图\
    \ 6.6 所示。\n\n![](img/2862989e5dc7f1b1d0bc64321737f084_197_0.png)\n\n图 6.6 前述代码创建的会话文件的内容。\n\
    \n## 关闭会话\n\n### session_destroy()\n\n```php\n<?php\nsession_start();\necho 'Before:\
    \ <pre>';\nprint_r($_SESSION);\necho '</pre>After: <pre>';\nsession_destroy();\n\
    print_r($_SESSION);\necho '</pre>';\n?>\n```\n\n移除所有会话数据 (session_destroy.php)\n\
    \n在某些情况下（例如用户注销时），应删除所有会话数据并关闭会话。当然，可以使用 foreach 遍历 $_SESSION，然后将每个值设为空字符串或 null，但有更快的方法：调用\
    \ session_destroy()。之后，当前会话中的所有数据将被销毁，正如函数名所暗示的那样。\n\n## 更改会话 ID\n\n### session_regenerate_id()\n\
    \n```php\n<?php\nob_start();\nsession_start();\necho 'Old: '. session_id();\n\
    session_regenerate_id();\necho '<br />New: ' . session_id();\nob_end_flush();\n\
    ?>\n```\n\n*更改会话 ID (session_regenerate_id.php)*\n\n针对使用会话保护的网站的常见攻击之一是用户的会话 ID\
    \ 以某种方式被窃取（例如，通过分析 HTTP 请求中的 HTTP_REFERER 条目），然后被用来冒充该特定用户。这很难防范，但使攻击者更难的一个便捷方法是，只要发生“重要”事件，例如用户登录时，就更改会话\
    \ ID。例如，亚马逊要求已通过 cookie 进行身份验证的用户在想要下单时再次登录。\n\n在这种情况下，函数 session_regenerate_id()\
    \ 只是更改当前会话 ID，但保留所有数据不变。这在前面的代码中显示，其中使用 session_id() 函数检索当前会话 ID（旧的和新的）。图 6.7\
    \ 显示了此脚本的可能输出。\n\n**注意：** 此代码使用输出缓冲— ob_start() 和 ob_end_flush()—因为 session_regenerate_id()\
    \ 也必须在任何 HTML 输出发送到客户端之前调用。\n\n![](img/2862989e5dc7f1b1d0bc64321737f084_200_0.png)\n\
    \n图 6.7 两个会话 ID（一个旧的，一个新的）\n\n## 实现自定义会话管理\n\n```\nsession_set_save_handler(\n\
    'sess_open', 'sess_close', 'sess_read',\n'sess_write', 'sess_destroy', 'sess_gc');\n\
    ```\n\n*自定义会话管理 (session_mysql.inc.php; 摘录)*\n\n不将会话数据存储在文件中有一些很好的理由。性能可能是其中一个问题，安全性是另一个问题。存储会话信息的另一种方法是使用数据库。为此，您只需要一个名为\
    \ sessiondata 的数据库表，包含三列。名称可能会有所不同，但本章即将出现的代码列表中使用以下名称：\n\n- 列 id（主键）的类型为 `VARCHAR(32)`，包含会话\
    \ ID。\n- 列 data 的类型为 TEXT，包含会话数据。\n- 列 access 的类型为 VARCHAR(14)，包含对会话信息最近访问的时间戳。\n\
    \n使用哪种数据库并不重要。本章使用 MySQL 和 PHP5 的新 mysqli 扩展，但也可以轻松更改代码以适用于其他数据库。（请参阅第 8 章“使用\
    \ MySQL 数据库”和第 9 章“使用其他数据库”，了解有关使用 PHP 使用各种相关数据库的信息。）\n\n您可以使用 PHP 函数 session_set_save_handler()\
    \ 为 PHP 内部使用的所有相关六个会话操作提供自定义函数：\n\n- 打开会话\n- 关闭会话\n- 读取会话变量\n- 写入会话变量\n- 销毁会话\n\
    - 清理（垃圾回收 [例如，从数据存储中删除旧的会话数据]）\n\n对于这六个操作，以下列表包含从 MySQL 数据源读取和写入会话数据的代码。您只需要 PHP\
    \ 5 并适当设置连接参数（服务器、用户名、密码）。然后，使用 require_once 包含此列表中的代码，然后像往常一样使用会话。在后台，PHP 然后将所有会话信息保存在数据库中，而不是文件系统中：\n\
    \n```php\n<?php\n\n$GLOBALS['sess_server'] = 'localhost';\n$GLOBALS['sess_db']\
    \ = 'sessions';\n$GLOBALS['sess_username'] = 'user';\n$GLOBALS['sess_password']\
    \ = 'pass';\n\nfunction sess_open() {\n    $GLOBALS['sess_mysqli'] = mysqli_connect(\n\
    \        $GLOBALS['sess_server'],\n        $GLOBALS['sess_username'],\n      \
    \  $GLOBALS['sess_password']\n    );\n    mysqli_select_db($GLOBALS['sess_mysqli'],\n\
    \    $GLOBALS['sess_db']);\n}\n\nfunction sess_close() {\n    mysqli_close($GLOBALS['sess_mysqli']);\n\
    }\n\nfunction sess_read($id) {\n    $result = mysqli_query(\n        $GLOBALS['sess_mysqli'],\n\
    \        sprintf('SELECT data FROM sessiondata WHERE id = \\'%s\\'',\n       \
    \ mysqli_real_escape_string($GLOBALS['sess_mysqli'], $id))\n    );\n    if ($row\
    \ = mysqli_fetch_object($result)) {\n        $ret = $row->data;\n        mysqli_query(\n\
    \            $GLOBALS['sess_mysqli'],\n            sprintf('UPDATE sessiondata\
    \ SET access=\\'%s\\' WHERE id=\\'%s\\'',\n            date('YmdHis'),\n     \
    \       mysqli_real_escape_string($GLOBALS['sess_mysqli'], $id))\n        );\n\
    \    } else {\n        $ret = '';\n    }\n    return $ret;\n}\n\nfunction sess_write($id,\
    \ $data) {\n    mysqli_query(\n        $GLOBALS['sess_mysqli'],\n        sprintf('UPDATE\
    \ sessiondata SET data=\\'%s\\', access=\\'%s\\' WHERE id=\\'%s\\'',\n       \
    \     mysqli_real_escape_string($GLOBALS['sess_mysqli'], $data),\n           \
    \ date('YmdHis'),\n            mysqli_real_escape_string($GLOBALS['sess_mysqli'],\
    \ $id))\n    );\n    if (mysqli_affected_rows($GLOBALS['sess_mysqli']) < 1) {\n\
    \        mysqli_query(\n            $GLOBALS['sess_mysqli'],\n            sprintf('INSERT\
    \ INTO sessiondata (data, access, id) VALUES (\\'%s\\', \\'%s\\', \\'%s\\')',\n\
    \            mysqli_real_escape_string($GLOBALS['sess_mysqli'], $data),\n    \
    \        date('YmdHis'),\n            mysqli_real_escape_string($GLOBALS['sess_mysqli'],\
    \ $id))\n        );\n    }\n    return true;\n}\n\nfunction sess_destroy($id)\
    \ {\n    mysqli_query(\n        $GLOBALS['sess_mysqli'],\n        sprintf('DELETE\
    \ FROM sessiondata WHERE id=\\'%s\\'',\n            mysqli_real_escape_string($GLOBALS['sess_mysqli'],\
    \ $id))\n    );\n    return true;\n}\n\nfunction sess_gc($timeout) {\n    $timestamp\
    \ = date('YmdHis', time() - $timeout);\n    mysqli_query(\n        $GLOBALS['sess_mysqli'],\n\
    \        sprintf('DELETE FROM sessiondata WHERE access < \\'%s\\'',\n        \
    \    $timestamp)\n    );\n}\n\nsession_set_save_handler(\n    'sess_open', 'sess_close',\
    \ 'sess_read',\n    'sess_write', 'sess_destroy', 'sess_gc');\n?>\n```\n\n自定义会话管理\
    \ (session_mysqli.inc.php)\n"
