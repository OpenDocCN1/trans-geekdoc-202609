    \ crypt()：crypt($value, $encryptedValue) 必须返回 $encryptedValue。\n\n前面的脚本检查通过URL提供的密码是否与之前\
    \ crypt() 的结果匹配。使用GET参数 pass=TopSecret 调用此脚本可以成功登录；所有其他密码都会失败。\n\n**注意：** 更详细地说：crypt()\
    \ 的第二个参数是用于加密数据的盐（初始化值）。你也可以在加密原始密码时使用盐。但是，必须确保盐值是唯一的；否则加密将不安全。因此，不要使用自定义盐值，让\
    \ PHP 来处理。另外需要提醒的是，DES 加密大约在24小时内就可能被破解，因此它已不再是万无一失的。一个更新的替代方案是高级加密标准（AES）。\n\n\
    ## 字符串校验和\n\n```\n<?php\n    $pass = (isset($_GET['pass'])) ? $_GET['pass'] :\
    \ '';\n    \n    $md5pass = '6958b43cb096e036f872d65d6a4dc01b';\n    $sha1pass\
    \ = '61c2feed11e0e53eb8e295ab8da78150be12f301';\n    \n    if (sha1($pass) ===\
    \ $sha1pass) {\n        echo 'Login successful.';\n    } else {\n        echo\
    \ 'Login failed.';\n    }\n    \n    // Alternatively, using MD5:\n    // if (md5($pass)\
    \ === $md5pass) {\n    //     echo 'Login successful.';\n    // } else {\n   \
    \ //     echo 'Login failed.';\n    // }\n?>\n```\n\n使用 SHA1 和 MD5 哈希检查登录\n(checksum.php)\n\
    \nPHP 提供了两个主要函数来创建校验和：\n\n- `md5()` 计算字符串的 MD5 哈希值。\n- `sha1()` 计算字符串的 SHA1 哈希值。\n\
    \n将 crypt() 用于字符串类似于为某些内容创建校验和；可以很容易地判断字符串是否与校验和匹配；但是，从校验和反推原始字符串并不（容易）可行。\n\n\
    正是为了实现这种校验和，有两种算法：安全哈希算法1（SHA1）和消息摘要算法5（MD5）。它们生成这样的校验和（即哈希）。这两种算法与 DES/crypt()\
    \ 所用算法的主要区别在于，字符串的 SHA1 或 MD5 校验和始终相同，因此验证数据非常容易。如图 1.2 所示，甚至 PHP 发行版也在其网站上标明了\
    \ MD5 校验和，用于验证下载文件的完整性。\n\n![](img/2862989e5dc7f1b1d0bc64321737f084_28_0.png)\n\
    \n图 1.2 PHP 下载页面显示了 PHP 发行版的 MD5 哈希值。\n\n同样，目标是验证用户通过 GET 提供的密码（如前所述，这是不好的做法，仅出于演示目的）。\n\
    \n正确的密码依旧是 'TopSecret'，其哈希值如下：\n\n- 6958b43cb096e036f872d65d6a4dc01b 是 MD5 哈希。\n\
    - 61c2feed11e0e53eb8e295ab8da78150be12f301 是 SHA1 哈希。\n\n从安全角度来看，你不应依赖 MD5（因为它可以用现代计算机破解）。鉴于硬件性能的进步，SHA1\
    \ 也不再完全安全。你应该考虑额外的保护措施：\n\n- 在对值进行哈希之前，先对它加盐——即添加一个已知的前缀字符串，使攻击者更难以破解。不过，这并不能抵御使用暴力破解并尝试几乎所有可能输入组合的攻击者。\n\
    - 将 crypt() 与更安全的算法（如 DES）一起使用。\n\n## 提示：\n\n在计算文件的 MD5 或 SHA1 哈希时，无需调用 file_get_contents()\
    \ 或其他文件函数；PHP 提供了两个计算文件哈希的函数（并负责打开和读取文件数据）：\n\n- `md5_file()`\n- `sha1_file()`\n\
    \n## 提取子字符串\n\n### substr()\n\n```\n<?php\n$php = \"PHP: Hypertext Preprocessor\"\
    ;\necho substr($php, 15, 4); //returns \"Prep\"\n?>\n```\n\n*使用 substr() 提取子字符串（substr.php；摘录）*\n\
    \nsubstr() 函数返回字符串的一部分。你提供一个字符串和要提取的第一个字符的位置（请记住，第一个字符的索引为0）。从该字符开始，返回字符串的其余部分。如果只想返回其中一部分，请在第三个参数中提供长度。前面的代码演示了\
    \ substr() 的用法，并从 PHP: Hypertext Preprocessor 中提取了 Prep。\n\n**提示：** 如果要从字符串末尾开始计数，请将\
    \ substr() 的第二个参数设为负数：\n\n```\necho substr($php, -12, 4);\n```\n\n如果为 substr()\
    \ 的第三个参数提供负值（例如 -n），则最后 n 个字符不包含在子字符串中。\n\n```\necho substr($php, -12, -8);\n\
    ```\n\n所有这些对 substr() 的调用都会返回 Prep，并且包含在完整代码中。\n\n## 保护电子邮件地址\n\n### 使用ASCII码\n\
    \n```php\n<?php\nfunction protectMail($s) {\n    $result = '';\n    $s = 'mailto:'\
    \ . $s;\n    for ($i = 0; $i < strlen($s); $i++) {\n        $result .= '&#' .\
    \ ord(substr($s, $i, 1)) . ';';\n    }\n    return $result;\n}\n\necho '<a href=\"\
    ' .\n    protectMail('email@address.xy') .\n    '\">Send mail</a>';\n?>\n```\n\
    \n*保护电子邮件地址（protectMail.php）*\n\n在浏览器中，你只会看到一个电子邮件链接，但底层的 HTML 代码却难以辨认：\n\n```html\n\
    <a\nhref=\"&#109;&#97;&#105;&#108;&#116;&#111;&#58;\n&#101;&#109;&#97;&#105;&#108;&#64;&#97;&#100;&#100;&#114;\n\
    &#101;&#115;&#115;&#46;&#120;&#121;\">Send\nmail</a>\n```\n\n然而，请看图 1.3：Web 浏览器正确地解码了电子邮件地址，如状态栏所示。\n\
    \n![](img/2862989e5dc7f1b1d0bc64321737f084_32_0.png)\n\n**图 1.3** 机器胜过人类（在解读电子邮件地址时）。\n\
    \n有些特殊字符在字符串中使用起来很困难，因为很难用键盘输入。但它们都有 ASCII 值。PHP 提供了两个函数来处理这个问题：\n\n- `chr()`\
    \ 将 ASCII 码转换为相应的字符。\n- `ord()` 返回一个字符的 ASCII 码。\n\n例如，这可用于保护电子邮件地址。由于垃圾邮件发送者会编写软件来搜索网页上的特定模式（电子邮件地址），因此这有助于减少垃圾邮件。诀窍是使用\
    \ HTML 字符代码来表示电子邮件地址，使垃圾邮件机器人更难找到电子邮件数据。\n\n前面的代码将一个电子邮件地址（格式为 `email@address.xy`）作为参数，并返回\
    \ `mailto:email@address.xy`——但已转换为 HTML 实体。例如，`mailto:` 中的 m 的 ASCII\n"
