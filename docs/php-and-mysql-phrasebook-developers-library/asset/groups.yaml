  mdcn: "\n\n服务器可以访问的所有 cookie（并非浏览器中存储的所有 cookie！）都可以在超全局数组 `$_COOKIE` 中获取。`foreach`\
    \ 循环会读取所有 cookie，并将它们以 HTML 表格的形式发送给客户端。\n\n## 设置（合理的）过期日期\n\n```php\n<?php\n\
    \    setcookie('version', phpversion(), time() + \n    21*24*60*60);\n?>\n```\n\
    \n已尝试发送 cookie。\n\n*设置具有相对过期日期的 Cookie*\n*（setcookie-expiry.php）*\n\ncookie 的过期日期是\
    \ `setcookie()` 的第三个参数。它是一个整数值：因此，必须使用时间戳的纪元值。第 3 章“日期与时间”包含大量关于如何处理此类信息的内容。\n\
    \n通常，为 cookie 设置相对的过期日期（如“三周后”）而非绝对日期（如“2012 年 5 月底”）是更好的做法。如果使用绝对日期，你可能需要定期修改脚本，因为绝对过期日期可能很快就会到来。将过期日期设置得很遥远，例如\
    \ 2030 年，也被认为是非常不专业的。收到此 cookie 的客户端到那一年几乎肯定不会再启动了。\n\n因此，请使用相对日期。PHP 函数 `time()`\
    \ 会获取当前的纪元值；然后加上你希望 cookie 存活的秒数。本段开头的代码设置了一个存在三周的 cookie。\n\n## 设置客户端特定的过期日期\n\
    \n```\nsetcookie('version', phpversion(),\n$_GET['time'] + 21*24*60*60)\n```\n\
    \n```php\n<?php\nif (isset($_GET['time']) && is_int($_GET['time']))\n{\n    setcookie('version',\
    \ phpversion(),\n        $_GET['time'] + 21*24*60*60);\n} else {\n    setcookie('version',\
    \ phpversion(),\n        time() + 21*24*60*60);\n}\n?>\n```\n\n已尝试发送 cookie。\n\
    \n*设置具有特定过期日期的 Cookie*\n*（setcookie-specific.php）*\n\n请记住，cookie 何时过期的决定是在客户端做出的，使用的是客户端的时钟设置。因此，如果客户端的日期不正确（这是你无法从服务器端控制的事情），你的\
    \ cookie 可能会比你预期的更早过期。因此，不要试图设置仅存活一小时左右的 cookie；像夏令时（DST）这样的小事就可能破坏你的计划。\n\n不过，借助一点\
    \ JavaScript，就有可能避开这个陷阱。下面清单中的代码是客户端 JavaScript 代码，它将当前时间（客户端）确定为纪元值，并将其发送到服务器端脚本\
    \ `setcookie-specific.php`。PHP 的 `time()` 函数与 JavaScript 的 `getTime()` 方法之间的主要区别在于，后者返回自\
    \ 1970 年 1 月 1 日以来的毫秒数，而前者只使用秒数。因此，JavaScript 值必须首先除以 1,000 并向下取整。\n\n此文件的代码见本段开头：传输的值被用作计算相对\
    \ cookie 过期日期的基础：\n\n```html\n<script type=\"text/javascript\">\nvar epoch = (new\
    \ Date()).getTime();\nepoch = Math.floor(epoch / 1000);\nlocation.replace(\"setcookie-specific.php?time=\"\
    \ +\nepoch);\n</script>\n```\n\n*使用 JavaScript 将本地时间信息传输到服务器（setcookie-specific.html；节选）*\n\
    \n## 删除 Cookie\n\n```php\n<?php\nsetcookie('version', '', time() -\n10*365*24*60*60);\n\
    ?>\n```\n\n已尝试删除 cookie。\n\n*删除 Cookie（deletecookie.php）*\n\n删除 cookie 的一种直观方法是将其值设置为空字符串。然而，cookie\
    \ 仍然存在，只是没有值。更好的方法是再次发送一个同名的 cookie，但提供一个已经过去的过期日期。同样，必须考虑本地时钟设置不正确的情况，所以使用一个非常早的过期日期（例如，距今十年前）。此清单实现了这一点，并删除了前面清单发送的\
