    \n![](img/2862989e5dc7f1b1d0bc64321737f084_75_0.png)\n\n图 2.6 嵌套数组已被 HTML 编码。\n\
    \n另一个行为类似的函数是 `array_walk()`。它同样会将一个函数应用到数组的每个元素上；不过，它还允许你为这个函数调用提供一个参数。在下面的代码中，这用于打印数组的所有元素。这里传递了一个参数——计数器。由于它是通过引用传递的，在函数内将该计数器加一，就会得到一列序号：\n\
