    \ the result:\n\n```\n```php\n<?php\n\nfunction sanitize_recursive($s) {\n   \
    \ if (is_array($s)) {\n        return(array_map('sanitize_recursive', $s));\n\
    \    } else {\n        return htmlspecialchars($s);\n    }\n}\n\n$a = array(\n\
