    name=\"PHP_SESSION_UPLOAD_PROGRESS\"\nvalue=\"ktgbht0abtnb897fv3j4pr16g6\" />\n\
    ```\n\nThen, when the user submits the form and thus uploads the file, $_SESSION['upload_progress_ktgbht0abtnb897fv3j4pr16g6']\
    \ contains information about the file upload in form of an array, including the\
