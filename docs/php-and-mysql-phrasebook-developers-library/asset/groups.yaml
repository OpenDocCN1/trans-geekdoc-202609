    ## 引言


    有一次，我最喜欢的开发编辑 Damon Jordan 给我发了一封电子邮件，结尾写着“ Ich möchte eine Föhnwelle，”意思是“ I’d
    like a blow wave。”不幸的是，我不知道 Föhnwelle 或 blow wave 是什么，所以我拒绝了。然后他告诉我，他在最近买的一本德语
    phrasebook 里找到了这句话。


    我很感兴趣，于是看了一些德语 phrasebook。我认为它们是在外国旅行时非常实用的工具，虽然我个人认为其中一些提供的短语根本不合逻辑。例如，在一本 phrasebook
    中，我找到了一系列搭讪台词，其中包括巧妙的“ You have a beautiful personality，”这种话无论在英语、德语还是任何其他语言中对我都不起作用！一些当地指导也可能导致其他问题——你必须记住在做事时要说的一切，或者你必须用空闲的手拿着
    phrasebook。最后，“ Blow waves are as dead as a pet rock，”只是再举一个例子。


    无论如何，我们稍微讨论了一下 phrasebook，Damon 说他想做一个关于 phrasebook 的书系。他还提到他想与他和我最喜欢的收购编辑 Shelley
    Johnston 合作，所以我加入了。


    在构思概念时，我们发现了语言 phrasebook 和 IT phrasebook 之间的一些差异。例如，语言 phrasebook 只是在两种语言中对照相同的句子。


    然而，这并不总是有所帮助。如果想稍微改变一下短语怎么办，例如如果你想要一个 en vogue blow wave（可以说是一个矛盾修辞）？


    因此，我们尝试创建一个包含大量短语的概念，但所有短语都有良好的解释，以便轻松更改代码并适应个人需求。当然，这使得短语的“ foreign language”部分比短语本身稍长一些，但我们认为在阅读本书时这真的很有帮助。


    我还记得一个著名的 Monty Python 小品，其中有人使用了一本被破坏的词典，以至于询问方向会导致被殴打。因此，了解短语内部正在发生什么的真实解释至关重要。


    然后我写了系列概念和一个样章，现在，仅仅几个月后，你就拿到了第一本 phrasebook（我们希望是众多之一）。


    我真的很讨厌阅读计算机书籍时，代码示例被拼凑到文字处理器中却从未经过测试。为避免这种情况，每个列表也可以在 http://php.phrasebook.org
    下载：文件名是列表标题的一部分。因此，每个代码示例都作为文件存在，并且实际上已经过测试，不像某些其他书籍。当然，这本书百分之百无错误只是一种错觉，尽管我们采取了多项措施来接近这一标准。任何已知的勘误也会发布在该网站上。


    我不喜欢的一些书籍的另一点是它们往往非常依赖操作系统，而这对于 PHP 来说真的没有必要。一些书籍显然只在 Windows 下测试过，其他一些只在 Linux
    下测试过，但可以使代码相对平台独立。我们投入了大量精力在许多服务器平台上测试本书的代码，包括 Linux、Windows、Mac OS X 和 Solaris。因此，本书中的屏幕截图也是从这些平台上截取的，所以你会发现系统（和浏览器）的健康混合。意识形态可以用许多短语表达，但你不会在这本书中找到任何这些。如果某些内容仅在特定平台（或
    PHP 版本）上运行，文中会有所说明。我向你保证，你不会在这本书中找到任何看起来像 foo、bar、baz 或任何其他缺乏想象力的证明的短语。


    当然，很容易在这本书中找到缺失的短语。PHP 提供了如此多的功能，以至于不可能涵盖每个方面。因此，我们必须选择某些感兴趣的话题——与 PHP 程序员日常工作相关的内容。如果你认为确实遗漏了某些东西，请告诉我（但也请提名一些应该从本书的后续版本中删除的内容，以腾出空间给新短语）。我期待收到你的反馈。


    现在，再引用 phrasebook 一次：“ Bist du soweit? Da boxt der Papst。” That is, “ Are you
    ready? It’s all happening there” （但字面意思是“ There boxes the pope。”）


    你的个人措辞者，


    Christian Wenz

