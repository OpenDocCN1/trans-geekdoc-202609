    # Understanding Sessions


    Originally, a session is a visit of a user to a Web site. He clicks a few links,
    has a look at a couple of pages, and then leaves. This defines a session. In other
    words, if a user does not request any data from a Web site for a period of time
    (for example, 20 minutes), the session ends.


    HTTP does not know any kind of session mechanism: the protocol is stateless. However,
    PHP comes with a built-in session support that makes it fairly easy to use sessions.


    After a session is created, PHP generates a session ID (that is, a long string
    that identifies the session). PHP then creates a file or a database entry for
    this session. Then, the PHP application can store data in this session. This data
    is then written either into the session file or into the database. (Shared memory
    is another, but rarely used option.)


    So, the only thing that must be transported between the client and the server
    is the session ID. All other data relevant to the session resides at the server.
    So, no sensitive data is sent over the wire an unnecessary number of times.'
  - '[PAGE 194]


    The configuration of PHP''s session mechanism is completely triggered in the [session]
    section of the php.ini configuration file. The default settings might not be suitable
    for all applications, so the next few phrases cover some possible configurations.


    # Where to Store the Sessions


    Usually, session data is stored in files. The location of these files is set in
    the php.ini directive session.save_path. Of course, this path must (a) exist and
    (b) be readable and writable for the PHP process (usually, the process of the
    Web server). Otherwise, the session information cannot be stored.


    However, when you have a lot of users and, therefore, a lot of sessions, PHP should
    not put all session files in one directory because this might cause some serious
    performance issues. The following syntax allows PHP to move session data into
    many subdirectories:


    ```

    session.save_path = "n;/tmp"

    ```


    This creates subdirectories up to the level of n within the /tmp directory. However,
    these subdirectories have to exist so that PHP''s session mechanism can write
    into them; for this, there exists the shell script mod_files.sh in the ext/session
    directory.


    Of course, only the Web server should be allowed to read this directory; otherwise,
    other users in the system could be able to read session information with possibly
    sensitive data.'
  - '[PAGE 195]


    # How to Maintain the Session State


    The session ID has to be sent to the browser with every response and—much more
    important—has to be sent back to the server with every request.


    The easiest way to do so is to use cookies. PHP then sends a cookie with the name
    PHPSESSID (can be changed with the directive session.name) to the client. However,
    for this to happen, the following php.ini directive must be set:


    ```

    session.use_cookies = 1

    ```


    However, what happens if the client does not support cookies? Then, a second mechanism
    comes into play, in the form of the following directive:


    ```

    session.use_trans_sid = 0

    ```


    Then, PHP automatically falls back into a mode in which the session ID is appended
    automatically to all URLs. This could create some potential security risks (session
    fixation and session hijacking, for example). Most well-known e-commerce Web sites
    stopped using this mechanism (for instance, Amazon). When no personal data is
    stored in a session, you might want to use this feature nevertheless.


    To be able to use session.user_trans_sid, PHP must be compiled with the switch
    enable-trans-sid, something that is automatically done for the Windows and Mac
    OS X binaries.


    The other option is to allow only cookies, not session IDs, in uniform resource
    locators (URLs). To do so, you can use the following php.ini directive:


    ```

    session.use_only_cookies = 1

    ```'
