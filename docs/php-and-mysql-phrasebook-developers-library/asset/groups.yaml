    After the form has been submitted, the data must go somewhere, possibly in a database
    (see Chapters 8, “Working with MySQL Databases,” and 9, “Working with Other Databases”),
    in a file, or sent via email. When a Web site contains several similar forms (for
    example, forms that all require the user to provide his name and contact information),
    it is a good idea to save the data after the user fills it in. Because HTTP is
    a stateless protocol, you have to use cookies (see Chapter 7, “Using Files on
    the Server File System”)—sessions are useless because they expire when the user
    closes the browser.


    Because user agents only have to save 20 cookies per domain (although they might
    store more), it’s a good idea to store the form information in one cookie, in
    the form of an array. However, only string values are allowed in cookies; this
    is why you have to serialize the array. Also be aware that you usually can only
    store a bit less than 4KB of data in a cookie; the rest may get truncated.'
