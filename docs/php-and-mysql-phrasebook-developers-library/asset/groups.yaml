    ```php\n$c = new MyClass('abc');\necho $c->getProperty();\n?>\n```\n\n*实现一个类（class.php）*\n\
    \n**注意：**可用的三种可见性级别如下：\n\n- **public**——可从任何地方访问\n- **protected**——只能从类内部、派生类以及同一个类或派生类的实例访问\n\
    - **private**——只能从类内部以及同一个类的实例访问\n\n也可以通过使用*static*上下文（以及static关键字），在不需要实例的情况下访问类的属性或方法。显然，静态方法无法访问\
