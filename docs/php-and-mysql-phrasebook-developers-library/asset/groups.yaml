    \n图 10.1 从 XML 创建的 HTML\n\n## 使用 XMLReader 解析 XML\n\n```\necho '<ul>';\n$xml =\
    \ new XMLReader();\n$xml->open('quotes.xml');\n```\n\n```\nwhile ($xml->read())\
