    +   - SOAP once stood for Simple Object Access Protocol, but because it is neither
    simple nor has much to do with object access, today SOAP just stands for... SOAP.
    It is a rather complex protocol but overcomes many of the limitations of XML-RPC
    (which was, by the way, created by some parties who also worked on SOAP).


    Most of the time, XML-RPC or SOAP calls are transported via HTTP as the carrier
    protocol. However, other protocols are also possible, including Simple Mail Transfer
    Protocol (SMTP) or even User Datagram Protocol (UDP).


    When using SOAP you need to consider one more important aspect: When you know
    exactly how a Web Service is implemented, you also know how to call (access or
    consume) it. However, many times this information is not available, so there must
    be a kind of self-description of the Web Service that contains all relevant information,
    such as which methods or functions are exposed, which parameters and data types
    they expect, and what they return. This can be done using a specifically crafted
    XML file, as well. The standard behind that is Web Services Description Language
    (WSDL). Today, WSDL is used for all relevant Web Services because it makes using
    them is quite simple. Most server-side technologies offer one way (or more) to
    just read in the WSDL and then access the Web Service as you would access a locally
    available class.


