    ;\n}\necho '</ul>';\n?>\n```\n\n使用 DOM 解析 XML（dom-read.php；摘录）\n\nW3C 的文档对象模型（DOM）定义了一种统一的方式来访问\
    \ XML 结构中的元素。因此，使用 JavaScript 的 DOM 访问在 HTML 页面中访问元素，以及使用 PHP 的 DOM 访问在 XML 文件中访问元素，相当相似。\n\
