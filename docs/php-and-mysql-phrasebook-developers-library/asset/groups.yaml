    \ command-line tool. To allow PHP to access the PostgreSQL installation, Windows\
    \ users must load the extension with the entry extension=php_pgsql.dll in php.ini;\
    \ UNIX/Linux users configure PHP with the switch --with-pgsql=/path/to/pgsql.\n\
    \nThen, pg_connect() connects to the data source. You have to provide a connection\
    \ string that contains all important data, including host, port, name of the database,\
    \ and user credentials.\n\n## Sending SQL to PostgreSQL\n\n### pg_query()\n\n\
