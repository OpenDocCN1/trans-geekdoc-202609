    \nFigure 5.5 Determining the status of an HTTP file upload\n\nNOTE: During testing,\
    \ we found that this feature does not work on all servers. Especially on Windows\
    \ systems, the $_SESSION feature remained empty. We are confident that this will\
    \ work better in future versions of PHP.\n\n## What Does PEAR Offer?\n\nThe following\
    \ PHP Extension and Application Repository (PEAR) packages offer functionality\
    \ helpful for processing form data of any kind:\n\n- HTML_QuickForm2 is a very\
    \ convenient package to create forms using an object-oriented programming syntax\
    \ and includes very mighty validation and processing features.\n- HTTP Upload\
    \ helps to manage file uploads and offers advanced features such as providing\
    \ valid extensions for uploads. However, the package is unmaintained as of time\
    \ of writing.\n\n## Remembering Users (Cookies and Sessions)\n\nHypertext Transfer\
    \ Protocol (HTTP) is a stateless protocol. Put simply, a client (Web browser)\
    \ connects to a Web server, sends a request, and gets a response. Then, the connection\
    \ is closed. The consequence is the next time the same client sends a request\
    \ to the same Web server, it is a new request, so the Web server cannot identify\
    \ the caller. This is, of course, a problem for applications in which state must\
    \ be maintained (for instance, e-commerce applications with a shopping-cart functionality).\n\
    \nHowever, you can overcome this limitation in several ways. The basic idea is\
    \ to send some information with the HTTP response; to try to achieve that, this\
    \ information is sent back with all subsequent requests to that server. The following\
    \ possibilities exist:\n\n- Sending the data via POST (that is, a form is required\
    \ each time)\n- Sending the data via GET (that is, by appending this information\
    \ to the request's uniform resource locator [URL])\n- Sending the data as part\
    \ of the HTTP header (in the form of a cookie)\n\nIn real-world projects, one\
    \ of two methods is used: sessions (via GET or cookies) and cookies.\n\n### Understanding\
    \ Cookies\n\nA cookie is sent as part of the HTTP header and is basically a name-value\
    \ pair. Their main disadvantage is it is possible to deactivate cookies in the\
    \ Web browser (and also to filter them out in proxy servers). Some people think\
    \ cookies create privacy issues. Part of this might have been caused by an article\
    \ written by John Udell in March 1997, in which he wrote that every cookie can\
    \ be read from every Web server, thus there is no privacy. This caused quite a\
    \ stir, although, unfortunately, the correction two months later did not get that\
    \ amount of attention.\n\nThe fact is that cookies have some limitations:\n\n\
    - Cookies are tied to domains, usually the domain that sent the cookie.\n- Cookies\
    \ can be tied to paths on the Web server.\n- A cookie contains only text information,\
    \ 4096 bytes at max (including the cookie name and the = character between the\
    \ name and value).\n- Browsers must only accept up to 20 cookies per domain and\
    \ 300 cookies in total (although some browsers accept more).\n\n**NOTE:** The\
    \ (unofficial) cookie specification goes back to Netscape and has been archived\
    \ at http://curl.haxx.se/rfc/cookie_spec.html. There have been attempts to create\
    \ a special Request For Comment (RFC) for next-generation cookies, but this hasn't\
    \ found any reasonable browser support yet.\n\nCookies are sent as part of the\
    \ HTTP header. If a cookie is set, the HTTP header entry Set-Cookie is created.\
    \ The name and value of the cookie (both strings) follow and, optionally, further\
    \ information such as expiration date, domain, and path of the cookie. For instance,\
    \ when visiting www.php.net/, the PHP Web site sends this header entry. (Your\
    \ mileage may vary, especially in terms of the language and IP address used.)\n\
    \n```\nSet-Cookie: COUNTRY=DEU%2C84.154.17.84; expires=Thu, 17-May-12 15:23:29\
    \ GMT; path=/; domain=.php.net\n```\n\nWhen the browser (or the user) accepts\
    \ the cookie, it is then sent back to the server in the HTTP header Cookie:\n\n\
    ```\nCookie: COUNTRY=DEU%2C84.154.17.84\n```\n\n**TIP:** To actually see the HTTP\
    \ headers, you could use special extensions to standard Web browsers. For Mozilla\
    \ browsers (including Firefox), the LiveHTTPHeaders extension available at http://livehttpheaders.mozdev.org/\
    \ is a real time-saver. Users of Microsoft Internet Explorer might be interested\
    \ in installing ieHTTPHeaders, an Explorer bar available from www.blunck.info/iehttpheaders.html.\
    \ The built-in Web development add-ins of many modern browsers also provide easy\
    \ access to cookie information. Figure 6.1 shows some of the output the Firefox\
    \ extension shows when accessing the PHP home page.\n\n![](img/2862989e5dc7f1b1d0bc64321737f084_177_0.png)\n\
    \nFigure 6.1 Cookies are set as part of the HTTP header.\n\nA cookie can have\
    \ an expiration date. If that is set, the cookie lives up to this date (at most)\
    \ and is a so-called persistent cookie. After that, the browser automatically\
    \ deletes the cookie—but this could also happen earlier (for example, when the\
    \ maximum number of cookies in the browser is reached and the oldest cookies are\
    \ purged). If no cookie expiration date is set, however, a so-called session cookie\
    \ or temporary cookie has been created. This lives as long as the Web browser\
    \ is running. When it is closed, the cookie is deleted.\n\n### Creating a Cookie\n\
    \n### setcookie()\n\n```php\n<?php\nsetcookie('version', phpversion());\n?>\n\
    ```\n\nTried to send cookie.\n\nSetting a Cookie (setcookie.php)\n\nTo create\
    \ a cookie, the PHP function setcookie() can be used. It expects the following\
    \ parameters; however, only the first one is mandatory:\n\n- The name of the cookie\n\
    - The value of the cookie\n- The expiry date (in UNIX epoch format)\n- The path\
    \ on the Web server from which the cookie may be accessed\n- The domain from which\
    \ the cookie may be accessed\n- Whether the cookie may only be sent using secure\
    \ (HTTP Secure [HTTPS]/Secure Sockets Layer [SSL]) connections\n- Whether the\
    \ cookie shall only be accessible by the server after an HTTP request, but shall\
    \ be hidden from JavaScript\n\nThe preceding code sets a simple session cookie\
    \ with the current PHP version as its value.\n\n**TIP**\n\nThe last two options\
    \ of setcookie() can be important security safeguards. By limiting cookies to\
    \ HTTPS connections it is harder to \"sniff\" cookie data (like session IDs) in\
    \ open networks. And if JavaScript does not have access to cookie information,\
    \ some attack vectors may cease to exist.\n\nFigure 6.2 shows a cookie warning\
    \ in the Firefox browser. You can clearly see the cookie name and script.\n\n\
    ![](img/2862989e5dc7f1b1d0bc64321737f084_179_0.png)\n\nFigure 6.2 Firefox receives\
    \ the cookie and asks the user what to do.\n\n**WARNING:** Because cookies are\
    \ sent as part of the HTTP header, they have to be created before any Hypertext\
    \ Markup Language (HTML) content is sent out (unless you are using output buffering).\
    \ Otherwise, you receive an error message such as the one shown in Figure 6.3.\n\
    \n![](img/2862989e5dc7f1b1d0bc64321737f084_180_0.png)\n\nFigure 6.3 Cookies have\
    \ to be sent prior to any HTML content.\n\nNOTE: Usually, PHP takes care of escaping\
    \ special characters in the cookie values (in URL format). However, it is possible\
    \ to do this manually by sending raw cookie data. For this, the function setrawcookie()\
    \ accepts the same parameter as setcookie(), but does not encode the cookie's\
    \ value. You must do that manually, with the function urlencode().\n\n### Reading\
    \ Out Cookies\n\n```\n<table>\n<?php\nforeach ($_COOKIE as $name => $value) {\n\
    \    printf('<tr><td>%s</td><td>%s</td></tr>',\n        htmlspecialchars($name),\n\
    \        htmlspecialchars($value));\n}\n?>\n</table>\n```\n\nReading Out Cookies\
    \ (getcookie.php)\n"
  mdcn: "\n\n隐藏的表单字段可能看起来像这样——当然，这取决于 php.ini 设置和当前的会话 ID：\n\n```\n<input type=\"\
    hidden\"\nname=\"PHP_SESSION_UPLOAD_PROGRESS\"\nvalue=\"ktgbht0abtnb897fv3j4pr16g6\"\
    \ />\n```\n\n然后，当用户提交表单从而上传文件时，$_SESSION['upload_progress_ktgbht0abtnb897fv3j4pr16g6']\
    \ 包含有关文件上传的信息，形式为数组，包括开始时间、服务器期望的总字节数以及客户端已传输了多少。$_SESSION 键的名称由 session.upload_progress.prefix\
    \ 值和隐藏表单字段中的值生成。\n\n为测试目的，你可能想在另一个标签页中打开一个 PHP 文件，持续输出该 $_SESSION 字段中的数据。图 5.5\
    \ 显示了可能的输出。\n\n![](img/2862989e5dc7f1b1d0bc64321737f084_171_0.png)\n\n图 5.5 确定\
    \ HTTP 文件上传的状态\n\n注意：在测试期间，我们发现此功能并非在所有服务器上都有效。尤其是在 Windows 系统上，$_SESSION 功能保持为空。我们有信心在未来版本的\
    \ PHP 中这会工作得更好。\n\n## PEAR 提供什么？\n\n以下 PHP 扩展和应用程序仓库（PEAR）包提供了有助于处理任何类型表单数据的功能：\n\
    \n- HTML_QuickForm2 是一个非常方便的包，可使用面向对象编程语法创建表单，并包含非常强大的验证和处理功能。\n- HTTP Upload\
    \ 有助于管理文件上传，并提供高级功能，例如为上传提供有效扩展。然而，截至撰写时，该包已无人维护。\n\n## 记住用户（Cookie 和会话）\n\n超文本传输协议（HTTP）是一种无状态协议。简单来说，客户端（Web\
    \ 浏览器）连接到 Web 服务器，发送请求并获得响应。然后连接关闭。其后果是下一次同一客户端向同一 Web 服务器发送请求时，这是一个新请求，因此 Web\
    \ 服务器无法识别调用者。当然，这对于必须维护状态的应用程序来说是个问题（例如，具有购物车功能的电子商务应用程序）。\n\n然而，你可以通过几种方式克服这一限制。基本思路是随\
    \ HTTP 响应发送一些信息；为实现这一目的，这些信息会在后续所有请求中发回给该服务器。存在以下可能性：\n\n- 通过 POST 发送数据（即每次都需要表单）\n\
    - 通过 GET 发送数据（即通过将此信息附加到请求的统一资源定位符 [URL]）\n- 将数据作为 HTTP 头的一部分发送（以 cookie 的形式）\n\
    \n在实际项目中，使用两种方法之一：会话（通过 GET 或 cookie）和 cookie。\n\n### 理解 Cookie\n\nCookie 作为 HTTP\
    \ 头的一部分发送，基本上是一个名称-值对。其主要缺点是可以在 Web 浏览器中停用 cookie（也可以在代理服务器中将其过滤掉）。有些人认为 cookie\
    \ 会造成隐私问题。其中一部分可能是由 John Udell 于 1997 年 3 月撰写的一篇文章引起的，他在其中写道每个 cookie 都可以被每个 Web\
    \ 服务器读取，因此没有隐私。这引起了相当大的轰动，尽管不幸的是，两个月后的更正并未得到同等程度的关注。\n\n事实上，cookie 有一些限制：\n\n\
    - Cookie 与域绑定，通常是发送 cookie 的域。\n- Cookie 可以与 Web 服务器上的路径绑定。\n- Cookie 仅包含文本信息，最多\
    \ 4096 字节（包括 cookie 名称和名称与值之间的 = 字符）。\n- 浏览器最多只能接受每个域 20 个 cookie，总共 300 个 cookie（尽管某些浏览器接受更多）。\n\
    \n**注意：**（非官方的）cookie 规范可追溯到 Netscape，并已归档在 http://curl.haxx.se/rfc/cookie_spec.html。曾尝试为下一代\
    \ cookie 创建特殊的请求评论（RFC），但尚未获得合理的浏览器支持。\n\nCookie 作为 HTTP 头的一部分发送。如果设置了 cookie，则会创建\
    \ HTTP 头条目 Set-Cookie。cookie 的名称和值（均为字符串）随后出现，并且可选地还有诸如过期日期、域和 cookie 路径等进一步信息。例如，访问\
    \ www.php.net/ 时，PHP 网站会发送此头条目。（因人而异，尤其是在使用的语言和 IP 地址方面。）\n\n```\nSet-Cookie:\
    \ COUNTRY=DEU%2C84.154.17.84; expires=Thu, 17-May-12 15:23:29 GMT; path=/; domain=.php.net\n\
    ```\n\n当浏览器（或用户）接受 cookie 时，它随后会在 HTTP 头 Cookie 中发回服务器：\n\n```\nCookie: COUNTRY=DEU%2C84.154.17.84\n\
    ```\n\n**提示：**要实际查看 HTTP 头，你可以使用标准 Web 浏览器的特殊扩展。对于 Mozilla 浏览器（包括 Firefox），可在\
    \ http://livehttpheaders.mozdev.org/ 获取的 LiveHTTPHeaders 扩展是真正的省时工具。Microsoft\
    \ Internet Explorer 用户可能有兴趣安装 ieHTTPHeaders，这是一个可从 www.blunck.info/iehttpheaders.html\
    \ 获取的 Explorer 栏。许多现代浏览器的内置 Web 开发附加组件也提供了轻松访问 cookie 信息的方式。图 6.1 显示了访问 PHP 主页时\
    \ Firefox 扩展显示的一些输出。\n\n![](img/2862989e5dc7f1b1d0bc64321737f084_177_0.png)\n\n\
    图 6.1 Cookie 作为 HTTP 头的一部分设置。\n\nCookie 可以有过期日期。如果设置了，cookie 最多存活到该日期，被称为持久 cookie。之后，浏览器会自动删除\
    \ cookie——但这也可能更早发生（例如，当浏览器中的 cookie 数量达到最大值时，最旧的 cookie 会被清除）。如果未设置 cookie 过期日期，则会创建所谓的会话\
    \ cookie 或临时 cookie。它在 Web 浏览器运行期间存活。当关闭时，cookie 会被删除。\n\n### 创建 Cookie\n\n###\
    \ setcookie()\n\n```php\n<?php\nsetcookie('version', phpversion());\n?>\n```\n\
    \n尝试发送 cookie。\n\n设置 Cookie（setcookie.php）\n\n要创建 cookie，可以使用 PHP 函数 setcookie()。它期望以下参数；然而，只有第一个是强制性的：\n\
    \n- cookie 的名称\n- cookie 的值\n- 过期日期（UNIX 纪元格式）\n- 可以访问 cookie 的 Web 服务器上的路径\n\
    - 可以访问 cookie 的域\n- cookie 是否只能通过安全（HTTP 安全 [HTTPS]/安全套接字层 [SSL]）连接发送\n- cookie\
    \ 是否只能由服务器在 HTTP 请求后访问，但应隐藏于 JavaScript\n\n前面的代码设置了一个简单的会话 cookie，其值为当前 PHP 版本。\n\
    \n**提示**\n\nsetcookie() 的最后两个选项可以是重要的安全保护措施。通过将 cookie 限制为 HTTPS 连接，在开放网络中“嗅探”\
