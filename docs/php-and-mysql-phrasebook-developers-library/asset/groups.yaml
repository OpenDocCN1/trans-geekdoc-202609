    \ . \n                '<\\/li>';\n        }\n    }\n}\necho '<\\/ul>';\n```\n\n\
    *使用 XMLReader 解析 XML（xmlreader.php）*\n\nXMLReader 是 Microsoft .NET 中 XmlTextReader\
    \ 接口的克隆，从 5.1.0 版本开始成为 PHP 发行版的一部分，并且默认激活。乍一看，它看起来与 SAX 解析器相似，但存在一个根本区别：SAX 是基于事件的解析器，而\
    \ XMLReader 使用一个光标遍历 XML 文件中的所有元素。\n\n要使用 XMLReader，你实例化 XMLReader 类，然后打开文件（open()\
    \ 方法）。常用的模式使用 while 循环和 read() 方法遍历所有元素。\n\n在该循环中，你可以确定光标到达的节点的类型（nodeType 属性），然后相应地采取行动（例如，通过读取标签名称\
    \ [localName 属性] 并访问文本节点的值 [value 属性]）。\n\n前面的代码再次从 XML 文档中读取所有短语并将其作为项目符号列表输出。\n\
    \n## 使用 DOM 读取 XML\n\n```\n<?php\n$dom = new DOMDocument();\n$dom->load('quotes.xml');\n\
