    \ \"Date and Time,\" contains quite a lot of information on how to work with this\
    \ type of information.\n\nUsually, it is a good thing to set a relative expiry\
    \ date for a cookie (\"in three weeks\") rather than an absolute date (\"end of\
    \ May 2012\"). If you use absolute dates, you might have to change your script\
