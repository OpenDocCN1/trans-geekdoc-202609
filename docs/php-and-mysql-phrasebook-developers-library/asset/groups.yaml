  - '[PAGE 316]


    Creating a Web Service with NuSOAP is really simple because the module takes care
    of all the painful things, including SOAP. Just follow these steps:


    +   1. Write the function you want to expose as a Web method.

    +   2. Instantiate the `soap_server` class.

    +   3. Register your function with the SOAP server.

    +   4. Call the `service()` method and submit `$HTTP_RAW_POST_DATA` as the parameter.


    This code implements a SOAP server using NuSOAP. Figure 11.2 shows the output
    in the browser when you are trying to call the Web Service directly from the client.
    The error message says that the XML was empty—of course it is, because we didn’t
    send a request!


