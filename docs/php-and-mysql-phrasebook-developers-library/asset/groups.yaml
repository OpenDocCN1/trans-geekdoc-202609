    A common —but also criticized—design pattern is the singleton pattern. It is not
    entirely easy to implement, so we have dedicated a phrase to its creation.


    The main goal of using the singleton pattern is that no matter how often you instantiate
    a certain class, you only get one object. This can, for instance, prove useful
    when creating database connections: often, you only need one connection that can
    be reused within your code.


    A common PHP implementation of the singleton pattern uses a few OOP features of
    the language to prevent multiple different instances of one class. First of all,
    the class constructor is not available because we make it private:


    ```

    private function __construct() {

    }

    ```


    Another approach to create two instance of the class is to use one instance and
    then clone it. This can be avoided by making the __clone() magic method private,
    as well:


    ```

    private function __clone() {

    }

    ```


    So, right now we cannot create multiple instances of the class, we cannot even
    create one instance. Therefore, we introduce a method that will give us a class
    instance. Within the class, we can call the class constructor—the private visibility
    allows that. The class instance will then be stored in a static and private class
    member. So, the dummy instantiation method first checks whether we already have
    a class instance stored in that static property. If so, the instance is returned;
    otherwise, the code creates a new (and only) instance:'
