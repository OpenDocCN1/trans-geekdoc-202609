    \ The browser prompts for a username and a password.\n\n## What Does PEAR Offer?\n\
    \nThe following PHP Extension and Application Repository (PEAR) packages offer\
    \ functionality that can be associated to sessions and HTTP authentication:\n\n\
    - Auth implements various ways to authenticate users and, therefore, protect PHP\
    \ pages.\n- HTTP_Session is based upon PHP's session mechanism but offers an object-oriented\
    \ access to session information.\n\n## Using Files on the Server File System\n\
    \nAlthough databases are very common, using the file system to store data can\
    \ be a real alternative. Often, it is easier to implement that way. Sometimes,\
    \ it is faster, and much more important, all hosting providers have file access\
    \ enabled, whereas database support might only be available at extra cost.\n\n\
    PHP supports working with files through a set of certain functions. Using wrappers,\
    \ the same technologies can also be used to access remote data via protocols such\
    \ as Hypertext Transfer Protocol (HTTP) or File Transfer Protocol (FTP), but this\
    \ is covered in more detail in Chapter 9, “Communicating with Others.”\n\nThis\
    \ chapter covers both standard tasks such as reading and writing files, and advanced\
    \ tasks such as archiving files in ZIP or BZ2 format. Many of these tasks can\
    \ be solved in different, equally usable ways, so you truly have the freedom of\
    \ choice.\n\n### Opening and Closing Files\n\n```php\n<?php\n$fp = @fopen('file.txt',\
    \ 'at');\nfclose($fp);\n```\n\n```php\n<?php\nif ($fp = @fopen('file.txt', 'at'))\
    \ {\n    echo 'File opened.';\n    fclose($fp);\n    echo '<br />File closed.';\n\
    } else {\n    echo 'Error opening file.';\n}\n?>\n```\n\n*Opening (and Closing)\
    \ Files (`fopen.php`)*\n\nFor most file system functions, the files have to be\
    \ opened first. The function `fopen()` does exactly this and returns a so-called\
    \ file handle, a pointer to the file. This file handle can then be used in subsequent\
    \ functions to, for instance, read information from a file or write to it.\n\n\
    `fopen()` expects at least two parameters:\n\n- The name of the file\n- The file\
    \ mode to use when accessing the file\n\nOf great interest is the file mode parameter.\
    \ This is a string that consists of one or more characters. The first character\
    \ is one of `a`, `r`, `w`, or `x`; after that, one or more special modifiers can\
    \ be used. Table 7.1 shows all modes.\n\n**Table 7.1 File Modes for PHP's File\
    \ Functions**\n\n| Mode | Description |\n|------|-------------|\n| a | Open file\
    \ to append (write) data; create it if it doesn't exist |\n| a+ | As mode a, but\
    \ additionally with read access to the file |\n| r | Open file to read data |\n\
    | r+ | As mode r, but in addition with write access to the file |\n| w | Open\
    \ file to write data, erasing its contents; create it if it doesn't exist |\n\
    | w+ | As mode w, but in addition with read access to the file |\n| x | Create\
    \ file to write data; send `E_WARNING` if it already exists |\n| x+ | As mode\
    \ x, but in addition with read access to the file |\n\nSo, the modifier `+` always\
    \ adds the missing read or write access to a file mode. There are other modifiers,\
    \ as well. PHP does a decent job determining whether a file is a text file or\
    \ a binary file and translates funny characters appropriately. If you append `b`\
    \ to a file mode, you force PHP to open a file as a binary file; for instance,\
    \ the file mode `rb` opens a file for reading in binary mode.\n\nAnother special\
    \ modifier exists that might come in handy for Windows users: `t`. If this is\
    \ appended to the file mode, all `\\n` line breaks are converted into `\\r\\n`\
    \ as Windows applications might expect.\n\n`fopen()` returns a file handle or\
    \ `false` if opening the file did not work. You should, however, suppress any\
    \ potential error messages with the `@` character.\n\nAs soon as a file is not\
    \ used anymore, it should be closed. PHP automatically closes all open files upon\
    \ termination of the script; however, to use the system resources as efficiently\
    \ as possible, files should be closed as early as possible to free up memory and\
    \ speed up the system. For this, use `fclose()` and provide the file handle as\
    \ a parameter.\n\nThe code at the beginning of this section uses both `fopen()`\
    \ and `fclose()`.\n\nAfter running the script, a file called `file.txt` is created.\n\
    \n**NOTE:** For this (and other examples in this chapter) to work, you have to\
    \ make sure that the PHP script has the appropriate rights for the file to access.\
    \ Usually, Apache runs either under a special user account (like `nobody`, `apache`,\
    \ or `www-data` on UNIX/Linux) or under a regular user account (Windows). Use\
    \ `chmod` to set the access privileges accordingly.\n\nMicrosoft IIS (Internet\
    \ Information Services) runs PHP scripts under a special guest account called\
    \ `IUSR_<name of machine>`. You can use the graphical user interface shown in\
    \ Figure 7.1 to tune the access settings for files or directories.\n\n**TIP:**\
    \ To avoid any mistakes when trying to access non-existent files, you can use\
