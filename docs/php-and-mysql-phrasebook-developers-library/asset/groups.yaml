    \ to PHP that it should expect an array of values, not just a string value. Accessing\
    \ the list data, however, can still be done using $_GET['listname']/$POST['listname']\
    \ and not $_GET['listname[]']/$POST['listname[]'], as shown in the preceding code.\n\
