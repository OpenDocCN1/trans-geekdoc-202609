    ?>\n```\n\n*从数组中随机挑选元素（array_rand.php）*\n\n使用 `array_rand()`，可以从数组中随机抽取一个或多个元素。例如，这可以用来抽取幸运数字。比如，德国彩票从\
    \ 49 个数字中抽取 6 个。前面的代码使用 PHP 和 `array_rand()` 实现了这种抽奖；输出如图 2.7 所示。该函数的第一个参数是数组；第二个（可选）参数是要返回的元素个数。\n\
    \n**注意：** 如果你不想随机挑选元素，而是想随机打乱数组中的元素顺序（例如洗牌时），请使用 `shuffle()` 函数。\n\n![](img/2862989e5dc7f1b1d0bc64321737f084_79_0.png)\n\
