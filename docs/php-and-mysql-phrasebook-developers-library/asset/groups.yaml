  mdcn: "\n这个示例展示了 Ajax 的一个非常简短的演示。此示例使用可在 www.modernmethod.com/sajax 获取的 Sajax 工具包（S\
    \ 代表 simple 简单）。有许多 Ajax 库和框架可供选择，因此请随意选择你最喜欢的一个；我们在这里只选择一个简单的，以专注于 Ajax 和 PHP\
    \ 的结合。\n\n此示例的完整代码相当长，因为同时需要 PHP 和 JavaScript。首先，你需要服务器端逻辑。为此，加载了 Sajax 工具包，它作为单个\
    \ PHP 文件提供。然后你“导出”（注册）所有希望从客户端使用的 PHP 函数。以下示例包含一个生成随机 RGB 颜色的小函数：\n\n```\n<?php\n\
    require_once 'Sajax.php';\n\nsajax_init();\nsajax_export('randomColor');\nsajax_handle_client_request();\n\
    \nfunction randomColor() {\n    $color = '#';\n    for ($i=0; $i<3; $i++) {\n\
    \        $color .= dechex(rand(0, 255));\n    }\n    return $color;\n}\n?>\n```\n\
    \n*应用程序的服务器端部分（ajax.php：摘录）*\n\n在客户端，对（PHP）函数 sajax_show_javascript() 的调用完成了大部分工作；它创建了一些\
    \ JavaScript 代码行，在后台处理对 Web 服务器的请求。然后，所有之前已注册的 PHP 函数都可以通过在函数名称前加上 x_ 来在客户端调用。你必须提供的一个参数是回调函数的名称；当服务器端响应请求时，该函数将被调用。\n\
    \n以下代码每五秒调用一次 randomColor() PHP 函数，然后以这种随机颜色写入文本——全部无需服务器往返！图 11.5 显示了结果：\n\n\
    ```\n<script type=\"text/javascript\">\n<?php\nsajax_show_javascript();\n?>\n\
    changeColor();\nsetInterval(changeColor, 5000);\n\nfunction changeColor() {\n\
    \    x_randomColor(randomColor_callback);\n}\n\nfunction randomColor_callback(result)\
    \ {\n    var text = '<span style=\"color: ' + result + '\">A colorful acronym\
    \ ...</span>';\n    document.getElementById('output').innerHTML =\n    text;\n\
    }\n</script>\n...\n<div id=\"output\"></div>\n```\n\n应用程序的客户端部分（ajax.php；摘录）\n\
    \n![](img/2862989e5dc7f1b1d0bc64321737f084_327_0.png)\n\n图 11.5 文本出现，感谢 JavaScript\
    \ 代码调用 PHP\n\n## 与服务器交换数据\n\n在前面的示例中，我们与服务器交换的数据相当简单——一个简单的字符串。然而，在实际应用中，我们需要从客户端发送到服务器并返回的往往是更复杂的数据。XML\
    \ 可用作交换格式，但它臃肿，因此不适合高性能应用。PHP 的 serialize() 和 unserialize() 方法可用于将复杂信息转换为可通过 HTTP\
    \ 交换的字符串，但 JavaScript 并没有内置的对应功能。\n\n与 JavaScript 进行数据交换的事实标准是 JSON，即 JavaScript\
    \ 对象表示法。非官方主页 at http://json.org/ 详细解释了该格式，但基本上 JSON 概括了 JavaScript 规范中解释数组的部分。例如，看看这个字符串：\n\
    \n```\n[\n{\"url\": \"http:\\\\/\\\\/json.org\\/\", \"text\": \"JSON\"},\n{\"\
    url\": \"http:\\\\/\\\\/php.net\\/\", \"text\": \"PHP\"}\n]\n```\n\n这是在 JavaScript\
    \ 中可用于定义包含两个关联数组（或对象，正如某些人所称，尽管这些元素实际上并不是对象）的数组的语法。现代浏览器具有将此类字符串轻松转换为真实 JavaScript\
    \ 值的内置功能（并且针对旧版本也有变通方法），因此 JSON 非常适合 Ajax 应用。\n\n从 5.2 版本开始，PHP 原生支持 JSON。函数 json_encode()\
    \ 将可序列化的 PHP 值转换为 JSON，而 json_decode() 将 JSON 字符串转换回 PHP 可处理的内容。以下代码基本上创建了前面的\
    \ JSON 字符串，只是去除了缩进和额外的空白字符：\n\n```\n<?php\n\nclass LinkData {\n    public $url;\n\
    \    public $text;\n    public function __construct($url, $text) {\n        $this->url\
    \ = $url;\n        $this->text = $text;\n    }\n}\n\n$data = array(\n    new LinkData('http://json.org/',\
    \ 'JSON'),\n    new LinkData('http://php.net/', 'PHP')\n);\n\necho json_encode($data);\n\
    ?>\n```\n\nJSON 服务器端点（json.php）\n\n在客户端，JavaScript 代码随后可以调用 PHP 脚本并处理数据。使用像流行的\
    \ jQuery（http://jquery.com/）这样的 JavaScript 库时，处理 JSON 数据会相当容易（参见图 11.6）。以下代码以项目符号列表的形式显示\
    \ JSON 字符串中包含的信息：\n\n```\n<script type=\"text/javascript\" src=\"http://code.jquery.com/jquery-latest.js\"\
    ></script>\n<script type=\"text/javascript\">\n$(function() {\n    $.getJSON(\"\
    json.php\", function(data) {\n        $.each(data, function(key, value) {\n  \
    \          $(\"<a>\").attr(\"href\", value.url)\n                .html(value.text)\n\
    \                .wrap(\"<li>\")\n                .parent()\n                .appendTo(\"\
    ul\");\n        });\n    });\n});\n</script>\n...\n<body>\n    <ul></ul>\n</body>\n\
    ```\n\n使用 jQuery 的 JSON 客户端（json.html）\n\n![](img/2862989e5dc7f1b1d0bc64321737f084_330_0.png)\n\
    \n图 11.6 JSON 数据被解析，然后作为列表显示，感谢 jQuery 调用 PHP 代码。\n\n## PEAR 提供什么？\n\n除了本章中提到的几个模块外，以下\
    \ PHP 扩展和应用程序仓库（PEAR）包在通过 PHP 与他人连接时提供的功能可能很有帮助：\n\n- PEAR 的 HTTP 类别提供了一些相关包，包括\
    \ HTTP、HTTP_Header、HTTP_Request2 和 HTTP_Server。\n- 同样，你可以在 Networking 类别中找到有用的包，包括\
    \ Net_FTP、Net_IMAP 和 Net_Socket。\n- PEAR 的 Services 类别包含多个类，它们为知名 Web 服务提供易于使用的接口。\n\
    \n## 索引\n\n### 符号和数字\n\n!= 运算符，比较字符串，26\n[...] 特殊字符，在正则表达式中，28\n*（星号），在正则表达式中，28\n\
    \\（反斜杠），在正则表达式中，29\n^（插入符号），在正则表达式中，27\n$（美元符号），在正则表达式中，27\n.（点），在正则表达式中，28\n\
    == 运算符，比较字符串，8-10，26\n|（管道），在正则表达式中，28\n+（加号），在正则表达式中，28\n?（问号），在正则表达式中，27\n$_COOKIE\
