    \ the better alternative, whereas (int) returns an integer value even for illegal\
    \ input. So, it's really a matter of the specific application at hand which method\
    \ to choose.\n\nThe following code offers the best of both worlds. A given input\
    \ is checked whether it is numeric with is_numeric(), and if so, it is converted\
    \ into an integer using (int). Adaptations to support other (numeric) data types\
    \ are trivial:\n\n```php\nfunction getIntValue($s) {\n    if (!is_numeric($s))\
    \ {\n        return false;\n    } else {\n        return (int)$s;\n    }\n}\n\
    ```\n\nGenerating Integer Values (check.inc.php; excerpt)\n\n## Validating Email\
    \ Addresses\n\n```php\nfunction checkEmail($s) {\n    $lastDot = strrpos($s, '.');\n\
    \    $ampersat = strrpos($s, '@');\n    $length = strlen($s);\n    return !(\n\
    \        $lastDot === false ||\n        $ampersat === false ||\n        $length\
    \ === false ||\n        $lastDot - $ampersat < 3 ||\n        $length - $lastDot\
    \ < 3\n    );\n}\n```\n\nValidating Email Addresses (check.inc.php; excerpt)\n\
    \nChecking whether a string contains a valid email address is two things at once:\
    \ very common and very complicated. The aforementioned book on regular expressions\
    \ uses several pages to create a set of regular expressions to perform this task.\
    \ If you are interested in this, take a look at http://examples.oreilly.com/regex/readme.html.\n\
    \nValidating email addresses is difficult because the rules for valid domain names\
    \ differ drastically between countries. For instance, bn.com is valid, whereas\
    \ bn.de is not (but db.de is). Also, did you know that user-name@[127.0.0.1] is\
    \ a valid email address (if 127.0.0.1 is the IP address of the mail server)?\n\
    \nTherefore, the recommendation is to only check for the major elements of an\
    \ email address: valid characters (an @ character) and a dot somewhere after that.\
    \ It is impossible to be 100 percent sure with checking email addresses; if the\
    \ test is too strict, the user just provides a fantasy email address. The only\
    \ purpose of email checking is to provide assistance when an (unintentional) typo\
    \ occurs.\n\nOf course, this is also possible using regular expressions, but this\
    \ is probably just slower. You should also be aware that the aforementioned code\
    \ cannot detect every email address that is incorrect. Also watch out for the\
    \ new international domains with special characters such as à or é in it. Most\
    \ regular expressions omit these, so you are much better off with the preceding\
    \ code.\n\n## Search and Replace\n\n### preg_replace()\n\n```php\n<?php\n$string\
    \ = '02/01/13';\necho preg_replace(\n '#(\\d{1,2})/(\\d{1,2})/(\\d{1,2})#',\n\
    \ '$2/$1/$3',\n $string\n );\n?>\n```\n\n*Replacing Matches Using PCRE (preg_replace.php)*\n\
    \nSearching within strings is one thing; replacing all occurrences with something\
    \ else is completely different. This is relatively easy, though, when using regular\
    \ expressions; you just have to know the function name: preg_replace()\n\nWithin\
    \ the regular expression for the replace term, you can use references to subpatterns.\
    \ The complete match is referred to by $0. Then count parentheses from inside\
    \ to outside, from left to right: The contents of the first parentheses are referenced\
    \ by $1, the second parentheses are accessed using $2, and so on.\n\nWith this\
    \ in mind, the replacement can be done. In the example, a U.S. date (month/day/year)\
    \ is converted to a U.K. date (day/month/year).\n\nTIP: The regular expression\
    \ in the preceding code does not use the / delimiter for the regular expression\
    \ because the regular expression itself contains slashes that would then need\
    \ escaping. However, by choosing another delimiter (for example, #), you can avoid\
    \ the escaping of slashes.\n\nIf you have a static pattern, without any quantifiers\
    \ or special characters, using str_replace() is almost always faster. The parameter\
    \ order for this is: first the strings to search for; then the replacements; and,\
    \ finally, the string where the search and replace will take place. You can provide\
    \ strings or arrays of strings in the first two parameters. The following code\
    \ removes all punctuation from the text:\n\n```php\n<?php\n$string = 'To be, or\
    \ not to be; that\\'s the question?!';\necho str_replace(\n    array('.', ',',\
    \ ':', ';', '!', '?'),\n    '',\n    $string\n);\n?>\n```\n\n*Replacing without\
    \ Regular Expressions (str_replace.php)*\n\nThe following code shows how to use\
    \ an array with replacement characters.\n\n```php\n<?php\n$string = '<p>This is\
    \ <span class=\"acronym\">HTML</span></p>';\necho str_replace(\n    array('<',\
    \ '>', '\"', \"'\", '&'),\n    array('&lt;', '&gt;', '&quot;', '&apos;',\n   \
    \ '&amp;'),\n    $string\n);\n?>\n```\n\n*Replacing without Regular Expressions\
    \ (str_replace_multiple.php)*\n\n## Working with Arrays\n\nWhen simple variables\
    \ are just not good enough, arrays come into play (or objects, but that's another\
    \ topic). The array section in the PHP manual, available at http://php.net/array,\
    \ lists approximately 80 functions that are helpful. Therefore, this book could\
    \ be filled with array-related phrases alone. However, not all of these functions\
    \ are really used often. Therefore, this chapter presents the most important problems\
    \ you'll have to solve when working with arrays—and, of course, solutions for\
    \ these problems.\n\nThere are two types of arrays. The names they are given differ\
    \ sometimes, but usually arrays are distinguished between numeric arrays and associative\
    \ arrays. The first type of array uses numeric keys, whereas the latter type can\
    \ also use strings as keys.\n\nCreating an array can be done in one of three ways:\n\
    \n- Using the `array()` statement\n\n```php\n$a = array('I', 'II', 'III', 'IV');\n\
    ```\n\n- Successively adding values to an array using the variable name and square\
    \ brackets\n\n```php\n$a[] = 'I';\n$a[] = 'II';\n$a[] = 'III';\n$a[] = 'IV';\n\
    ```\n\n- Using a new square brackets syntax introduced in PHP 5.4\n\n```php\n\
    $a = ['I', 'II', 'III', 'IV'];\n```\n\nThe latter method is probably the most\
    \ intuitive one for Web developers because JavaScript features a very similar\
    \ syntax. For the sake of backward compatibility, we will still use the first\
    \ option throughout this chapter.\n\nWhen using associative arrays, the same three\
    \ methods can be used; however, this time keys and values must be provided:\n\n\
    ```php\n$a1 = array('one' => 'I', 'two' => 'II', 'three' =>\n'III', 'four' =>\
    \ 'IV');\n$a2['one'] = 'I';\n$a2['two'] = 'II';\n$a2['three'] = 'III';\n$a2['four']\
    \ = 'IV';\n```\n\n```php\n$a1 = ['one' => 'I', 'two' => 'II', 'three' =>\n'III',\
    \ 'four' => 'IV'];\n```\n\nArrays can also be needed, when an array element itself\
    \ is an array:\n"
  mdcn: "\n如果某人只输入空白字符（即空格字符和其他非文本字符），表单字段是否填写正确？\n\n最好的方法是在检查变量或表达式中是否有内容之前使用 trim()。函数\
    \ trim() 会移除所有类型的空白字符，包括空格字符、水平制表符、垂直制表符、回车符和换行符。如果之后该字符串不等于空字符串，则该（必填）字段已被填写。\n\
    \n注意：文件 check.php 包含示例调用，以及文件 check.inc.php 中所有后续对验证函数的调用。\n\n## 验证数字（和其他数据类型）\n\
    \n要判断任何数据是否为数字（或能否转换为数字），PHP 提供了几种可能性。首先，以下辅助函数会检查变量的数据类型：\n\n- is_array() — 检查是否为数组\n\
    - is_bool() — 检查是否为布尔值\n- is_float() — 检查是否为浮点数\n- is_int() — 检查是否为整数\n- is_null()\
    \ — 检查是否为 null\n- is_numeric() — 检查是否为整数和浮点数\n- is_object() — 检查是否为对象\n- is_string()\
    \ — 检查是否为字符串\n\n然而，需要注意的是，数字函数——is_float()、is_int() 和 is_numeric()——也会尝试将数据从原始类型转换为数字类型。\n\
    \n另一种转换数据类型的方法借鉴自 Java 和其他强类型的类 C 语言。在变量或表达式前面加上括号括起来的所需数据类型：\n\n`$numericVar\
    \ = (int)$originalVar;`\n\n然而，在这种情况下，PHP 会不惜一切代价进行转换。因此，`(int)'3DoorsDown'` 返回\
    \ 3，而 `is_numeric('3DoorsDown')` 返回 false。相比之下，`(int)'ThreeDoorsDown'` 返回 0。\n\
    \n通常，is_numeric()（以及 is_int()/is_float()）似乎是更好的选择，而 (int) 即使对于非法输入也会返回整数值。因此，选择哪种方法实际上取决于当前的具体应用。\n\
    \n以下代码两全其美。使用 is_numeric() 检查给定输入是否为数字，如果是，则使用 (int) 将其转换为整数。要支持其他（数字）数据类型的调整非常简单：\n\
    \n```php\nfunction getIntValue($s) {\n    if (!is_numeric($s)) {\n        return\
    \ false;\n    } else {\n        return (int)$s;\n    }\n}\n```\n\n生成整数值（check.inc.php；摘录）\n\
    \n## 验证电子邮件地址\n\n```php\nfunction checkEmail($s) {\n    $lastDot = strrpos($s,\
    \ '.');\n    $ampersat = strrpos($s, '@');\n    $length = strlen($s);\n    return\
    \ !(\n        $lastDot === false ||\n        $ampersat === false ||\n        $length\
    \ === false ||\n        $lastDot - $ampersat < 3 ||\n        $length - $lastDot\
    \ < 3\n    );\n}\n```\n\n验证电子邮件地址（check.inc.php；摘录）\n\n检查字符串是否包含有效的电子邮件地址同时具有两个特点：非常常见且非常复杂。前面提到的关于正则表达式的书用了好几页来创建一组正则表达式来执行此任务。如果你对此感兴趣，可以看看\
    \ http://examples.oreilly.com/regex/readme.html。\n\n验证电子邮件地址很困难，因为有效域名的规则在不同国家之间差异很大。例如，bn.com\
    \ 是有效的，而 bn.de 无效（但 db.de 有效）。另外，你知道吗，user-name@[127.0.0.1] 是一个有效的电子邮件地址（如果 127.0.0.1\
    \ 是邮件服务器的 IP 地址）？\n\n因此，建议只检查电子邮件地址的主要元素：有效字符（一个 @ 字符）以及其后某处的点号。要 100% 确定地检查电子邮件地址是不可能的；如果测试过于严格，用户只会提供一个虚构的电子邮件地址。电子邮件检查的唯一目的是在（非故意的）拼写错误发生时提供帮助。\n\
    \n当然，使用正则表达式也可以实现这一点，但这可能只是更慢。你还应该注意，前述代码无法检测出每一个不正确的电子邮件地址。还要留意包含特殊字符（如 à 或 é）的新国际域名。大多数正则表达式会忽略这些字符，因此使用前面的代码会好得多。\n\
    \n## 搜索与替换\n\n### preg_replace()\n\n```php\n<?php\n$string = '02/01/13';\necho\
    \ preg_replace(\n '#(\\d{1,2})/(\\d{1,2})/(\\d{1,2})#',\n '$2/$1/$3',\n $string\n\
    \ );\n?>\n```\n\n*使用 PCRE 替换匹配项（preg_replace.php）*\n\n在字符串中搜索是一回事；将所有匹配项替换为其他内容则完全不同。不过，使用正则表达式时这相对容易；你只需要知道函数名：preg_replace()\n\
    \n在替换项的正则表达式中，你可以使用对子模式的引用。完整匹配由 $0 引用。然后从内到外、从左到右数括号：第一个括号的内容由 $1 引用，第二个括号使用\
    \ $2 访问，依此类推。\n\n了解了这一点，就可以进行替换了。在示例中，美式日期（月/日/年）被转换为英式日期（日/月/年）。\n\n提示：前面代码中的正则表达式没有使用\
    \ / 作为正则表达式的分隔符，因为正则表达式本身包含斜杠，如果使用 / 就需要进行转义。但是，通过选择其他分隔符（例如 #），你可以避免转义斜杠。\n\n\
    如果你有一个静态模式，没有任何量词或特殊字符，使用 str_replace() 几乎总是更快。它的参数顺序是：首先是搜索的字符串；然后是替换内容；最后是进行搜索和替换的字符串。前两个参数可以传入字符串或字符串数组。以下代码从文本中移除所有标点符号：\n\
    \n```php\n<?php\n$string = 'To be, or not to be; that\\'s the question?!';\necho\
    \ str_replace(\n    array('.', ',', ':', ';', '!', '?'),\n    '',\n    $string\n\
    );\n?>\n```\n\n*不使用正则表达式进行替换（str_replace.php）*\n\n以下代码展示了如何使用包含替换字符的数组。\n\n```php\n\
    <?php\n$string = '<p>This is <span class=\"acronym\">HTML</span></p>';\necho str_replace(\n\
    \    array('<', '>', '\"', \"'\", '&'),\n    array('&lt;', '&gt;', '&quot;', '&apos;',\n\
    \    '&amp;'),\n    $string\n);\n?>\n```\n\n*不使用正则表达式进行替换（str_replace_multiple.php）*\n\
    \n## 使用数组\n\n当简单变量不够用时，数组就开始发挥作用（或者对象，但那是另一个话题）。PHP 手册中的数组部分（可在 http://php.net/array\
    \ 获取）列出了大约 80 个有用的函数。因此，仅数组相关的短语就足以写满这本书。然而，并非所有这些函数都真的经常使用。因此，本章介绍了在使用数组时必须解决的最重要的问题——当然，还有这些问题的解决方案。\n\
    \n数组有两种类型。它们的名称有时有所不同，但通常数组被区分为数字数组和关联数组。第一种类型的数组使用数字键，而后一种类型也可以使用字符串作为键。\n\n\
    创建数组可以通过以下三种方式之一完成：\n\n- 使用 `array()` 语句\n\n```php\n$a = array('I', 'II', 'III',\
    \ 'IV');\n```\n\n- 使用变量名和方括号依次向数组添加值\n\n```php\n$a[] = 'I';\n$a[] = 'II';\n$a[]\
    \ = 'III';\n$a[] = 'IV';\n```\n\n- 使用 PHP 5.4 中引入的新的方括号语法\n\n```php\n$a = ['I',\
    \ 'II', 'III', 'IV'];\n```\n\n对于 Web 开发人员来说，后一种方法可能是最直观的，因为 JavaScript 具有非常相似的语法。为了向后兼容，我们仍将在本章中使用第一种方法。\n\
    \n使用关联数组时，可以使用同样的三种方法；但这一次必须提供键和值：\n\n```php\n$a1 = array('one' => 'I', 'two'\
    \ => 'II', 'three' =>\n'III', 'four' => 'IV');\n$a2['one'] = 'I';\n$a2['two']\
    \ = 'II';\n$a2['three'] = 'III';\n$a2['four'] = 'IV';\n```\n\n```php\n$a1 = ['one'\
    \ => 'I', 'two' => 'II', 'three' =>\n'III', 'four' => 'IV'];\n```\n\n当数组元素本身也是一个数组时，也可能需要数组：\n"
