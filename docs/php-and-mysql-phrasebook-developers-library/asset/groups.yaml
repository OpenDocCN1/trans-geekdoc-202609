    \ = new self;\n    }\n    return self::$instance;\n}\n```\n\nThe following code\
    \ listing contains the complete syntax for the singleton class:\n\n```\n<?php\n\
    class PHPSingleton{\n    static private $instance = null;\n\n    static public\
    \ function getInstance() {\n        if (self::$instance == null) {\n         \
    \   self::$instance = new self;\n        }\n        return self::$instance;\n\
    \    }\n\n    private function __construct() {\n    }\n    private function __clone()\
    \ {\n    }\n}\n?>\n```\n\n*Implementing a Singleton (singleton.php)*\n\n**NOTE:**\
    \ As mentioned, singleton patterns have some shortcomings. Code generally gets\
    \ harder to test because the singleton class needs to be global and adds state\
    \ to the application. As always, your mileage may vary."
  - '[PAGE 129]


    # Using Namespaces


    One major new feature of PHP 5.3 is the inclusion of namespaces. Namespaces are
    a tool to group related functionality and to avoid name clashes. Imagine you write
    a function with the generic name such as showInfo(). Another developer in the
    same project writes a different function but uses the same name. Usually, you
    would prefix the function name so that it is unique, which leads to the dreaded,
    really long identifiers, like Project_Module Submodule showInfo(). Namespaces
    can help here: You provide the context in form of a namespace; within that namespace,
    showInfo() is unique; the other developers use other namespaces. In the end, this
    facilitates encapsulation of functionality.


    The main keyword for namespaces is –surprise! – namespace. The namespace keyword
    must be the first command within a PHP page (after optional comments) and must
    even not be preceded by HTML markup. If you would like to structure namespaces,
    you may create a hierarchy, by using the (a bit unusual) backslash character as
    a separator:


    ```

    namespace Project\Module\Submodule;

    ```


    This namespace is now valid for the whole file. If you create the showInfo() method
    within that file, and include the file in another PHP script, the following code
    can be used to execute the method:


    ```

    Project\Module\Submodule\showInfo();

    ```


    To define several namespaces in one file, you could use multiple namespace statements;
    the preferred way however is to use curly braces:'
