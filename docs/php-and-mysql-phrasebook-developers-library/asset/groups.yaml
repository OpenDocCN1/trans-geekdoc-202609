    \ PHP 内置类起初似乎是个难题，因为 PHP 会在当前命名空间中查找这些类。但只需在类名前面加上反斜杠，就能让 PHP 在全局类列表中查找：\n\n```php\n\
    namespace Project\\Module\\Submodule;\n$c = new \\SoapClient('file.wsdl');\n```\n\
    \n关于命名空间，还有很多内容可以讨论，但本着短语手册的宗旨，我们只简要说明命名空间的工作原理。PHP 在线手册在 http://php.net/namespace\
    \ 上有更多相关信息。\n\n## 使用 Trait\n\n```php\nclass MyTraitClass {\n    use MyTrait1,\
    \ MyTrait2 {\n        MyTrait1::showTime as now;\n        MyTrait2::showCopyright\
    \ insteadof MyTrait1;\n    }\n}\n```\n\nPHP 5.4 的新特性之一是支持 Trait，这是一种代码复用的方式。Trait\
    \ 是函数的集合，是一种无需实例化的类。要使用这一新特性，你必须使用 trait 关键字创建 Trait。\n\n```php\ntrait MyTrait1\
    \ {\n    public function showTime() {\n        $date = new DateTime('now');\n\
    \        echo $date->format('H:i:s');\n    }\n}\n```\n\n然后，在类中，你可以使用 use 关键字加载\
    \ Trait。之后这些方法就可以供你使用了：\n\n```php\nclass MyTraitClass {\n    use MyTrait1;\n}\n\
    \n$c = new MyTraitClass();\n$c->showTime();\n```\n\n你也可以在一个类中使用多个 Trait。但在这种情况下，如果有多个\
    \ Trait 定义了相同的方法，你就需要小心了；否则你会收到一条错误消息，就像接口有相同方法名时那样。不过，与接口不同，Trait 提供了一种防止该错误的方法。加载\
    \ Trait 时，你可以使用 insteadof 运算符解决这些命名冲突。例如，假设有两个 Trait，MyTrait1 和 MyTrait2，它们都定义了\
    \ showTime() 方法。下面的语法可以确保不会发生错误，并且会使用 MyTrait1 中的 showTime() 实现，而不是 MyTrait2 中的：\n\
    \n```php\nclass MyTraitClass {\n    use MyTrait1, MyTrait2{\n        MyTrait1::showTime\
    \ insteadof MyTrait2;\n    }\n}\n```\n\n另一个特性是使用别名（使用 as 关键字），甚至可以在 Trait 中使用抽象方法。下面的代码列表使用了两个\
    \ Trait、insteadof 和一个别名，其输出与图 4.3 类似：\n\n```php\n<?php\n    trait MyTrait1 {\n\
    \        public function showTime() {\n            $date = new DateTime('now');\n\
    \            echo $date->format('H:i:s');\n        }\n\n        public function\
    \ showCopyright() {\n            echo '&copy; Trait 1';\n        }\n    }\n\n\
    \    trait MyTrait2 {\n        public function showCopyright() {\n           \
    \ echo '&copy; Trait 2';\n        }\n    }\n```\n\n```php\nclass MyTraitClass\
    \ {\n    use MyTrait1, MyTrait2 {\n        MyTrait1::showTime as now;\n      \
    \  MyTrait2::showCopyright insteadof MyTrait1;\n    }\n}\n\n$c = new MyTraitClass();\n\
    $c->now();\necho '<hr />';\n$c->showCopyright();\n?>\n```\n\n使用两个 Trait（trait.php）\n\
    \n![](img/2862989e5dc7f1b1d0bc64321737f084_133_0.png)\n\n图 4.3 使用了第二个 Trait 中的\
    \ copyright 方法。\n\n## 与 Web 表单交互\n\nHTML 表单是任何动态网站的关键要素之一，因为它们能让网站用户与之交互。否则，网站或多或少是静态的：它们可能由数据库驱动，因此会定期变化，但每一位访问者看到的都是相同的页面。HTML\
    \ 表单可以改变这种情况；因此，在 PHP 中使用表单数据非常重要。\n\n读取这些信息非常容易：对于通过 GET 提交的表单数据（即在所请求页面的统一资源标识符\
    \ [URI] 中），可以在 $_GET[<表单字段 name 属性的值>] 中找到这些数据。如果表单是通过 POST 提交的，则 $_POST[<表单字段\
    \ name 属性的值>] 保存字段数据。然而，这仅仅是开始。假设用户填写了一个表单，但漏掉了某个字段。用户不会看到要求点击浏览器“后退”按钮的错误消息，而会看到一个所有字段都已填入他先前提供的值的表单。许多书都忽略了这一点；更糟糕的是，有些书干脆做错了。你一定不要忘记对表单字段值进行特殊编码：否则，表单容易遭受跨站脚本（XSS）攻击，或者至少会看起来很难看。图\
    \ 5.1 演示了这一点：你会看到两个文字相同的按钮；然而，只有第一个按钮的文字在 HTML 代码中被正确编码。\n\n![](img/2862989e5dc7f1b1d0bc64321737f084_135_0.png)\n\
    \n图 5.1 必须对特殊字符进行正确编码。\n\n其他值得关注的重要主题包括超文本传输协议（HTTP）文件上传，以及处理 php.ini 或其他地方可能妨碍开发人员良好意图的各种设置。\n\
    \n## 将表单数据发送回当前脚本\n\n```php\n<form action=\"<?php echo htmlspecialchars($_SERVER['PHP_SELF']);\
    \ ?>\">\n</form>\n```\n\n如果在 `<form>` 元素中未提供 action 属性，所有相关浏览器都会将表单数据发送回当前页面。然而，HTML\
    \ 和可扩展超文本标记语言（XHTML）规范都声明 action 是必需属性（在文档类型定义 [DTD] 中标记为 `#REQUIRED`）。用户代理的行为是未定义的，正如\
    \ http://w3.org/TR/html4/interact/forms.html#adef-action 上的 HTML 规范所解释的那样。因此，最好明确提供当前脚本的统一资源定位符（URL）作为表单的\
    \ action。上面的代码就做到了这一点，并且出于安全原因还会转义 `$_SERVER['PHP_SELF']` 中的特殊字符。另一种更简单（且依然有效）的方法是将\
    \ action 属性设置为空字符串（`\"\"`）。\n\n## 读取表单数据\n\n在非常早期的 PHP 版本中，读取表单数据非常容易：如果表单字段具有\
    \ name 属性 \"whatever\"（在较新版本的 HTML/XHTML 中为 id 属性 \"whatever\"），PHP 会在全局作用域中创建一个变量\
    \ `$whatever`。这非常方便，但从架构的角度来看，无论过去还是现在都是一个糟糕的想法。因此，从 PHP 4.2 开始，通过以下 php.ini 指令默认禁用了此功能：\n\
    \n```\nregister_globals = Off\n```\n\n自 PHP 3 以来，以下全局数组一直可用于表单数据：\n\n- `$HTTP_GET_VARS`——通过\
    \ GET 提供的所有数据\n- `$HTTP_POST_VARS`——通过 POST 提供的所有数据\n- `$HTTP_REQUEST_VARS`——通过\
    \ GET 或 POST 或 cookie 提供的所有数据（不建议使用）\n\n这些数组是全局的；因此，你必须使用\n\n| 表 5.1 **表单字段类型及在**\
    \ `$_GET`/`$_POST` **中返回的数据** |  |\n|---|---|\n| **表单字段类型** | **返回的数据** |\n| 文本字段\
    \ | 字段中的文本 |\n| 密码字段 | 字段中的文本（明文，未加密） |\n| 多行文本字段 | 字段中的文本 |\n| 隐藏字段 | 字段的 value\
    \ 属性 |\n| 单选按钮 | 所选单选按钮的 value 属性 |\n| 复选框 | 复选框选中时的 value 属性（若未设置 value，通常为 \"\
    on\"） |\n| 选择列表 | 所选列表项的 value 属性（若未设置 value，则为所选列表项的显示文本） |\n| 多选列表 | 所选列表项的\
    \ value 属性组成的数组（若未设置 value，则为所选列表项显示文本组成的数组） |\n| 提交按钮 | 提交按钮的 value 属性（如果该按钮用于提交表单；若有多个提交按钮，这一点很重要）\
    \ |\n\n> **提示：** 剩下两种表单字段类型——图形提交按钮和文件上传——将在本章后面专门介绍。\n\n"
