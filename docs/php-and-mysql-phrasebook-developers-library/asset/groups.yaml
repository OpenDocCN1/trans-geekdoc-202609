    \ is not always as detailed as you would expect, but it does give you some great\
    \ pointers as to what is possible.\n\nAs a simple example, we will create a class\
    \ (you can find more about various aspects of object-oriented programming [OOP]\
    \ in Chapter 4) that implements two interfaces:\n\n- **ArrayAccess**—Allows accessing\
    \ individual elements within the object's collection (in our code, a simple array)\n\
    - **Countable**—Allows calling `count()` on an object instance\n\nIf you want\
    \ full array support, you need to implement additional interfaces, including Iterable\
    \ (for iterator support; for example, via foreach) and some more. The ArrayObject\
    \ interface aggregates several of the required interfaces, which in turn could\
    \ even allow advanced features like user-defined sorting.\n\n## Table 3.1 Formatting\
    \ Symbols for `date()`\n\n| Symbol | Description |\n| --- | --- |\n| `a` | am\
