    \ {\n    echo ' selected=\"selected\"';\n}\n?>>PHP 5.2</option>\n        <option\
    \ value=\"php53\"<?php\nif (in_array('php53', getFormDataArrayPOST('multilistname')))\
    \ {\n    echo ' selected=\"selected\"';\n}\n?>>PHP 5.3</option>\n        <option\
