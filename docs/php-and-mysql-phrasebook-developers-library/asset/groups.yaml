    ;\n?>\n```\n\n由time()和其他PHP函数获取的纪元值（epoch value）可用于轻松计算两个日期之间的差异。诀窍是将日期转换为时间戳（如果尚未采用这种格式）。然后计算这两个时间戳之间的差值。结果是以秒为单位的时间差。然后可以利用这个值来计算出对应的分钟数、小时数和天数：\n\
