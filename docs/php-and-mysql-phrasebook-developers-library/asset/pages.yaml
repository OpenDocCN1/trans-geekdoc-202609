    \ ? $_GET['user'] : '';\n$pass = (isset($_GET['pass'])) ? $_GET['pass'] : '';\n\
    \nif (\n    (strtolower($user) === 'damon' && $pass === 'secret') ||\n    (strtoupper($user)\
    \ === 'SHELLEY' && $pass === 'verysecret') ||\n    (strcasecmp($user, 'Christian')\
    \ == 0 && strcmp($pass, 'topsecret') == 0)\n) {\n    echo 'Login successful.';\n\
    } else {\n    echo 'Login failed.';\n}\n?>\n```\n```\n\n*Validating Logins by\
    \ Comparing Strings (comparelogin.php)*\n\nWhen validating a username and a password\
    \ (for example, in a script that backs an HTML login form), two things seem to\
    \ form a de facto standard on the Web:\n\n+   - The password is always case sensitive.\
    \ It has to be provided exactly the same way it was set.\n+   - The username,\
    \ however, is not case sensitive."
