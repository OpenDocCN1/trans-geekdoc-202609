    \ code can then call the PHP script and process the data. When using a JavaScript\
    \ library like the popular jQuery (http://jquery.com/), working with the JSON\
    \ data can be quite easy (see Figure 11.6). The following code displays the information\
    \ contained in the JSON string in the form of a bulleted list:\n\n```\n<script\
    \ type=\"text/javascript\" src=\"http://code.jquery.com/jquery-latest.js\"></script>\n\
    <script type=\"text/javascript\">\n$(function() {\n    $.getJSON(\"json.php\"\
    , function(data) {\n        $.each(data, function(key, value) {\n            $(\"\
    <a>\").attr(\"href\", value.url)\n                .html(value.text)\n        \
    \        .wrap(\"<li>\")\n                .parent()\n                .appendTo(\"\
    ul\");\n        });\n    });\n});\n</script>\n...\n<body>\n    <ul></ul>\n</body>\n\
    ```\n\nThe JSON Client, Using jQuery (json.html)"
  merge: -1
