  md: "# Connecting to MySQLi\n\n# @mysqli_connect('localhost', 'user', 'password')\n\
    \n```\n<?php\nif ($db = @mysqli_connect('localhost', 'user', 'password')) {\n\
    \    mysqli_select_db($db, 'phrasebook');\n    echo 'Connected to the database.';\n\
    \    mysqli_close($db);\n} else {\n    echo 'Connection failed.';\n}\n?>\n```\n\
    \nConnecting to MySQLi (mysqli_connect.php)\n\nSeveral MySQL extensions for PHP\
    \ are available. The oldest one, ext/mysql, was used for PHP 4 and older versions;\
    \ its successor, ext/mysqli (the i officially stands for improved, and unofficially\
    \ for incompatible—but that's cynical), comes with PHP 5 but requires MySQL 4.1\
    \ or later. However, PHP 5 also supports the old extension. Only the latter extension\
    \ is covered in this chapter. A third option, PDO, is covered at the end of Chapter\
    \ 9 because you can use this API with other databases, as well.\n\nApart from\
    \ the different APIs, PHP users also have the option to choose between different\
    \ libraries. Older PHP installations usually use the MySQL client server library\
    \ (libmysql), but PHP 5.3 introduced the MySQL native driver (mysqlnd). This driver\
    \ provides additional features and better performance, so it is recommended to\
    \ use this driver."
  merge: -1
  img_proc: true
- pgno: 243
  md: 'If you want to use ext/mysqli, the switch for --with-mysql has to point to
    /path/to/mysql config. Windows users have to use the files php_mysqli.dll and
    lib-mysql.dll; the rest of the previous install instructions remain unchanged.


    Now connecting to the database is easy: Just call mysql_connect(), providing the
    server, username, and password. You then get a handle that can be used for mysqli_select_db()
    or to choose a database on the server. Finally, mysqli_close() closes the connection
    to the data source.


    If you have worked with the older ext/mysql, keep in mind that the different variable
    order for mysql(i)_select_db() is one of the prominent differences between the
    two extensions. The newer one wants the database handle first. Another difference
    between these two extensions is that the database handle is a mandatory parameter
    whenever used. With ext/mysql, the last handle created by mysql_connect() is the
    current default handle for the page. One more difference: mysqli_connect() accepts
    the name of the database as an optional fourth parameter, so you can avoid using
    mysqli_select_db().


    **NOTE:** Alternatively, the mysqli extension also offers an object oriented syntax
    to access a data source. Although this chapter uses the functional approach to
    make a possible transition from ext/mysql to ext/mysqli as painless as possible,
    the following shows what the object oriented approach looks like:


    ```

    ```php

    $db = new mysqli(''localhost'', ''user'', ''password'');

    $db->select_db(''phrasebook'');

    $db->close();

    ```

    ```'
