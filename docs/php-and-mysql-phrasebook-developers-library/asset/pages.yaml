  md: "```\nstatic private $instance = null;\n\nstatic public function getInstance()\
    \ {\n    if (self::$instance == null) {\n        self::$instance = new self;\n\
    \    }\n    return self::$instance;\n}\n```\n\nThe following code listing contains\
    \ the complete syntax for the singleton class:\n\n```\n<?php\nclass PHPSingleton{\n\
    \    static private $instance = null;\n\n    static public function getInstance()\
    \ {\n        if (self::$instance == null) {\n            self::$instance = new\
    \ self;\n        }\n        return self::$instance;\n    }\n\n    private function\
    \ __construct() {\n    }\n    private function __clone() {\n    }\n}\n?>\n```\n\
    \n*Implementing a Singleton (singleton.php)*\n\n**NOTE:** As mentioned, singleton\
    \ patterns have some shortcomings. Code generally gets harder to test because\
    \ the singleton class needs to be global and adds state to the application. As\
    \ always, your mileage may vary."
