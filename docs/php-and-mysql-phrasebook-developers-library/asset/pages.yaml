    \ is bundled with the scripting language. This is a lightweight, file-based database.\
    \ That allows very fast reading (in many cases, even faster than when using a\
    \ \"real\" database), but writing can sometimes take longer than with other systems\
    \ because file locking is an issue. However, PHP 4 users can also use SQLite because\
    \ a PECL (PHP Extension Community Library) module is available (http://pecl.php.net/).\n\
    \nIf you use PHP 5.0-5.3, SQLite support is already included. In PHP 5.4, the\
    \ SQLite extension (ext/sqlite) has been moved to PECL. As an alternative, PHP\
    \ 5.4 (and PHP 5.3, as well) offers the ext/sqlite3 extension, which is also covered\
    \ in this chapter."
