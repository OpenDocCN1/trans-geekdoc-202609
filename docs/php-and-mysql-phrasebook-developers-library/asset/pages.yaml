- pgno: 65
  md: 'The standard sorting functions of PHP do not traverse nested arrays when performing
    their operations. However, if you use a recursive function, you can code this
    in just a few lines.


    The goal is to sort an array that is nested but consists only of numeric subarrays
    so that only numeric (and, therefore, useless) keys are used.


    The idea is the following: Calling `sort()` does sort the array, but leaves out
    all subarrays. Therefore, for all elements that are arrays, the sorting function
    is called again, recursively. The preceding code shows this concept; Figure 2.4
    shows the result for a sample array.


    ![](img/2862989e5dc7f1b1d0bc64321737f084_65_0.png)


    **Figure 2.4**  Sorting nested arrays


    > **NOTE:** The PHP function `array_multisort()` is an alternative way to sort
    arrays with more than one dimension.'
  merge: -1
  img_proc: true
