- pgno: 68
  md: "# Sorting IP Addresses\n(as a Human Would)\n\n# natsort($a);\n\n```\n<?php\n\
    $a = array('100.200.300.400', '100.50.60.70',\n    '100.8.9.0');\nnatsort($a);\n\
    echo implode(' ', $a);\n?>\n```\n\nSorting IP Addresses Using a Natural String\
    \ Order String Comparison (natsort.php)\n\nSorting IP addresses with sort() does\
    \ not really work because if sorting as strings, '100.200.300.400' (which intentionally\
    \ is an invalid IP) is less than '50.60.70.80'. In addition, there are more than\
    \ just digits within the string, so a numeric sorting does not work.\n\nWhat is\
    \ needed in this case is a so-called natural sorting, something that has been\
    \ implemented by Martin Pool's Natural Order String Comparison project at http://sourcefrog.net/projects/natsort/.\
    \ In PHP's natscasesort() function, this algorithm is used. According to the description,\
    \ it sorts \"as a human would.\" When case sensitivity is an issue, natsort()\
    \ can be used. The preceding code shows the latter function.\n\n**NOTE:** Internally,\
    \ natsort() uses strnatcmp() (and natscasesort() uses strnatcasecmp()), which\
    \ does a \"natural\" comparison of two strings. By calling this function a number\
    \ of times, the array elements are brought into the correct order."
  merge: -1
  img_proc: true
- pgno: 69
  md: "# Sorting Anything\n\n```\n```php\n<?php\nfunction compare($a, $b) {\n    return\
    \ $a - $b;\n}\n\n$a = array(4, 1345, 31, 222);\nusort($a, 'compare');\necho implode('\
    \ < ', $a);\n?>\n```\n```\n\nIf you do not want to limit yourself to the standard\
    \ sorting functionality offered by PHP, you can write your own sorting algorithm.\
    \ Internally, PHP uses the Quicksort algorithm to sort values in an array. For\
    \ this to work, PHP has to know whether two values are equal; in the latter case,\
    \ PHP needs to find out which value is greater. So, to implement a custom sort,\
    \ all that is required is a function that takes two parameters and returns:\n\n\
    +   - A negative value if the first parameter is smaller than the second parameter\n\
    +   - 0 if both parameters are equal\n+   - A positive value if the second parameter\
    \ is smaller than the first parameter\n\nThe name of this function must be passed\
    \ to usort()—as a string—or, if you are using at least PHP 5.3, you can also rely\
    \ on an anonymous function similar to JavaScript. The rest of the work is done\
    \ by PHP, as shown in the code. The comparison function used there is a very simple\
    \ way to do a numeric sorting. By subtracting the two values, the function returns\
    \ the desired values: A positive number if the first parameter is larger than\
    \ the second one, 0 if both parameters are equal, and a negative number otherwise."
  merge: -1
  img_proc: true
- pgno: 70
  md: "# Sorting with Foreign Languages\n\n```\n<?php\nfunction compare($a, $b) {\n\
    \    if ($a == $b) {\n        return 0;\n    } else {\n        for ($i = 0; $i\
    \ < min(strlen($a), strlen($b));\n            $i++) {\n            $cmp = compareChar(substr($a,\
    \ $i, 1),\n                substr($b, $i, 1));\n            if ($cmp != 0) {\n\
    \                return $cmp;\n            }\n        }\n        return (strlen($a)\
    \ > strlen($b) ? 1 : 0);\n    }\n}\n\nfunction compareChar($a, $b) {\n    // ...\n\
    }\n\n$a = array('Frédéric', 'Froni', 'Frans');\nusort($a, 'compare');\necho implode('\
    \ < ', $a);\n?>\n```\n\nSorting an Array with Language-Specific Characters\n(languagesort.php;\
    \ excerpt)\n\nSorting works well, as long as only the standard ASCII characters\
    \ are involved. However, as soon as special language characters come into play,\
    \ the sorting yields an undesirable effect. For instance, calling sort() on an\
    \ array with the values 'Frans', 'Frédéric', and 'Froni' puts 'Frédéric' last\
    \ because the é character has a much larger charcode than o."
