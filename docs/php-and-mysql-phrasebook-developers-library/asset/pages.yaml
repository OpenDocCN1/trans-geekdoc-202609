  md: "```\n```php\n<input type=\"text\" name=\"textfieldname\"\n    value=\"<?php\n\
    echo (isset($_POST['textfieldname'])) ?\nhtmlspecialchars($_POST['textfieldname'])\
    \ : '';\n?>\" />\n<input type=\"submit\" name=\"Submit\" />\n</form>\n<?php\n\
    }\n?>\n```\n```\n\nDuring form validation, the emphasis is on mandatory fields\
    \ most of the time. You can check whether they contain values in two ways:\n\n\
    +   - Check whether the fields exist in `$_GET/$_POST`:\n+   \n+     ```php\n\
    +     if (!isset($_GET['fieldname'])) {\n+         // Error!\n+     }\n+     ```\n\
    +   \n+   - Check whether the values in `$_GET/$_POST` contain information other\
    \ than whitespace:\n+   \n+     ```php\n+     if (trim($_GET['fieldname']) ==\
    \ '') {\n+         // Error!\n+     }\n+     ```\n\nIt is very important that\
    \ you combine both techniques. You always have to check for a field’s existence\
    \ using `isset()` to avoid error messages when trying to access array values that\
    \ do not exist. But, because text fields are always submitted, you always have\
    \ to check whether there is something within the field apart from whitespace.\
    \ In addition, when empty, `isset()` always returns true independent of the field’s\
    \ value. The code at the beginning of this phrase shows an example."
