- pgno: 105
  md: 'The epoch value that can be determined by time() and other PHP functions can
    be used to easily calculate the difference between two dates. The trick is to
    convert the dates into time stamps (if not already available in this format).
    Then the difference between these two time stamps is calculated. The result is
    the time difference in seconds. This value can then be used to find out how many
    minutes, hours, and days this corresponds to:


    +   - Divide the result by 60 to get the number of minutes.

    +   - Divide the result by 60 * 60 = 3,600 to get the number of hours.

    +   - Divide the result by 60 * 60 * 24 = 86,400 to get the number of days.


    If you start with the number of days, round down each result and subtract this
    from the result; you can also split up the difference into days, hours, and minutes.


    A much more direct (and time zone / DST-aware) approach is provided by the DateTime
    class. It offers three methods that can help you calculate a date/time difference:


    +   - add() adds an interval (DateInterval class) to a date.

    +   - sub() subtracts an interval (DateInterval class) from a date.

    +   - diff() calculates the difference between two DateTime instances, returning
    a DateInterval instance.'
