    \ keywords public, protected, and private denote who may access which property\
    \ or method.\n\nIf a class is instantiated (with new), the $this keyword provides\
    \ a reference to the calling object. If the class contains a method called __construct(),\
    \ this method will be called upon instantiation of the class:\n\n```\n```php\n\
