    # Monitoring the Progress of a File Upload


    ```

    var_dump($_SESSION[ini_get(''session.upload_progress_prefix'') . ''myUpload'']);
    ?>

    ```


    As of the time of writing, web browsers do not contain built-in functionality
    to determine the status of a file upload. Especially with large files or slow
    connections, this information would be very valuable.


    Most Web applications today that do show how much of a file has already been uploaded
    use a plug-in technology such as Flash, Silverlight, or Java. Starting with PHP
    version 5.4, it is also possible to determine the status of a file upload with
    server-side means.


    The php.ini file contains configuration options for the file upload status feature.
    These are the most important options:


    +   - session.upload_progress.enabled — Activates file upload tracking, must be
    set to On.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '+   - **session.upload_progress.prefix**—Key prefix in the $_SESSION array
    where file upload status information will be stored. Defaults to upload_progress_.

    +   - **session.upload_progress.name**—Name of the POST value, which will contain
    the key suffix in the $_SESSION array where file upload status information will
    be stored. Defaults to PHP_SESSION_UPLOAD_PROGRESS.


    Normally when you use this feature, you include some JavaScript code that continuously
    calls a server script to find out the update status. For the sake of brevity,
    we use a much simpler approach here.


    In one file, we set up a file upload. PHP automatically stores file upload information
    in the session if the following two conditions are met:


    +   - The form must contain a (ideally hidden) form field with the name equaling
    the session.upload_progress.prefix value.

    +   - The PHP session must have been started.


    Here is a typical form:


    ```

    <?php

    session_start();

    ?>

    <form method="post" action="" enctype="multipart/form-data">

    <input type="file" name="upload" />

    <input type="hidden" name="<?php echo ini_get(''session.upload_progress.name'');
    ?>" value="<?php echo session_id(); ?>" />

    <input type="submit" value="Upload" />

    </form>

    ```'
  merge: -1
