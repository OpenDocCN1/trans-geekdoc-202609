- pgno: 12
  md: '# Introduction


    Some time ago, my favorite development editor, Damon Jordan, sent me an email
    and closed it with “Ich möchte eine Föhnwelle,” which means “I’d like a blow wave.”
    Unfortunately, I didn’t know what either a Föhnwelle or a blow wave was, so I
    declined. He then told me he had found this sentence in a German phrasebook he
    recently bought.


    I was interested and had a look at some German phrasebooks. I think they are great
    tools to get around in a foreign country, although I personally think that some
    of the phrases offered just don’t make sense. For instance, in one phrasebook,
    I found a series of pickup lines, including the ingenious “You have a beautiful
    personality,” something that didn’t work for me either in English, in German,
    or in any other language! Some local guidance could also result in other problems—you
    either have to remember all the things to say while you are at it, or you have
    to hold the phrasebook in your free hand. And, finally, “Blow waves are as dead
    as a pet rock,” just to use another phrase.


    Anyway, we were discussing phrasebooks a bit, and Damon said that he wanted to
    do a book series on phrasebooks. He also mentioned that he would like to team
    up with his and my favorite acquisitions editor, Shelley Johnston, so I was in.


    While working on a concept, we found some differences between a language phrasebook
    and an IT'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'phrasebook. For instance, a language phrasebook just contrasts the same sentence
    in two languages.


    However, this is not always helpful. What if you want to change the phrase a bit,
    for instance if you want an en vogue blow wave (an oxymoron, one might say)?


    So, we tried to create a concept that contains a lot of phrases, but all of them
    with good explanations so that it is easy to change the code and adapt it to one''s
    needs. This, of course, makes the "foreign language" portions of a phrase a bit
    longer than the phrase itself, but we think that really helps when working with
    the book.


    I also remember one famous Monty Python sketch in which someone uses a sabotaged
    dictionary, so that asking for directions results in getting roughed up. Therefore,
    it is vitally important to get a real explanation on what is going on within the
    phrase.


    I then wrote a series concept and a sample chapter, and now, only a few months
    later, you hold the first phrasebook in your hands (one of many, we hope).


    Something I really hate about reading computer books is when code samples are
    hacked into the word processor but never tested. To avoid this, every listing
    is also available for download at http://php.phrasebook.org : the filename is
    part of the listing''s caption. So every code sample does exist as a file and
    has actually been tested, unlike in some other books. Of course, it''s an illusion
    that this book is 100 percent error free, although we have taken several steps
    to come very close to that mark. Any errata, if known, will be posted to that
    site, too.


    Another thing I really dislike with some books is that they tend to be very OS
    dependent, which is really'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'unnecessary for PHP. Some books were obviously only tested under Windows, some
    others only under Linux, but it is possible to make code relatively platform independent.
    We have invested a lot of effort in testing the code from this book on many server
    platforms, including Linux, Windows, Mac OS X, and Solaris. Therefore, the screenshots
    in this book are also taken from those platforms, so you will find a healthy mixture
    of systems (and browsers). Ideology can be expressed with many phrases, but you
    won’t find any of them in this book. If something does run only on certain platforms
    (or PHP versions), it is noted in the text. Another phrase I promise you will
    not find in this book is anything that looks like foo, bar, baz, or any other
    proofs of very little imagination.


    Of course, it is easy to find missing phrases in this book. PHP offers so much
    functionality that it is impossible to cover every aspect. Therefore, we had to
    select certain topics of interest—stuff that is relevant in a PHP programmer’s
    everyday work. If you think, however, that something has really been overlooked,
    please let me know (but do also nominate something that should then be removed
    from upcoming editions of this book to make room for the new phrases). I am looking
    forward to getting your feedback.


    And now, to quote a phrasebook once more: “Bist du soweit? Da boxst der Papst.”
    That is, “Are you ready? It’s all happening there” (but literally, “There boxes
    the pope.”)


    Your personal phrasemonger,


    Christian Wenz'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# # Introduction for

    ## the Second

    ## Edition


    When we worked on the concept of the Phrasebook series a few years ago, we were
    quite confident that the books planned for the first batch would do well. Looking
    back now, with a dozen books still out there, and quite a number of foreign-language
    translations, I can say we did *really* well. It also makes me personally quite
    proud that the pilot, the *PHP Phrasebook*, still stands the test of time, and
    I am happy to see this book quite often when I am visiting a customer''s site.


    However, PHP has progressed quite a bit in the past few years. PHP 4 has finally
    vanished, and although the promised PHP 6 never materialized, PHP versions 5.3
    and 5.4 added many new features, a lot of them originally planned for the next
    major PHP update.


    We took this opportunity to update the *PHP Phrasebook* to the latest developments
    in PHP. Because we got really stellar feedback for the original book, we tried
    to keep the setup and popular phrases intact, but we added dozens of new and updated
    phrases, highlighting many of the new possibilities of PHP 5.3 and 5.4. For the
    sake of backward compatibility, we always mention in which version of PHP a new
    feature has'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'been introduced, and if possible, we provide code that does not necessarily
    require the latest and greatest, if we see it fit.


    The name of the book changed a bit, as well. We covered many relevant databases
    in the first edition, and still do now; however, MySQL continues to be the de
    facto standard database for PHP development, and therefore it gets its own chapter
    and part of the book’s title page.


    I am indebted to the many readers who provided me with suggestions, errata, and
    general feedback. Of course, any kind of feedback for this edition of the book
    is greatly appreciated, as well. The Web site at http://php.phrasebook.org/ contains
    the code samples from this book, errata (as soon as I learn about them), and contact
    information. I am looking forward to hearing from you!


    As with most books, this has been a team effort. Mark Taber, who oversaw the creation
    of the Phrasebook series back then, is still onboard and was the project manager
    for this edition. I still remember when we drafted the new edition during breakfast
    on one of the rare occasions when we actually met in person. (Next time I’ll pay.)
    I was happy that my old friend John Coggeshall was kind enough to serve as a technical
    reviewer—and to save my reputation a few times. Also “thank you” to the team of
    wizards at Pearson who turn my manuscripts into professional books. And thanks
    to my family and friends who accept the odd hours my profession requires from
    time to time.'
  merge: -1
  img_proc: true
