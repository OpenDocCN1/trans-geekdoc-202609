  md: "As soon as a file is not used anymore, it should be closed. PHP automatically\
    \ closes all open files upon termination of the script; however, to use the system\
    \ resources as efficiently as possible, files should be closed as early as possible\
    \ to free up memory and speed up the system. For this, use fclose() and provide\
    \ the file handle as a parameter.\n\nThe code at the beginning of this phrase\
    \ uses both fopen() and fclose().\n\nAfter running the script, a file called file.txt\
    \ is created.\n\nNOTE: For this (and other examples in this chapter) to work,\
    \ you have to make sure that the PHP script has the appropriate rights for the\
    \ file to access. Usually, Apache runs either under a special user account like\
    \ nobody, apache, www data, UNIX, Linux) or under a regular user account (Windows).\
    \ Use chmod to set the access privileges accordingly.\n\nMicrosoft IIS (Internet\
    \ Information Services) runs PHP scripts under a special guest account called\
    \ IUSR_<name of machine>. You can use the graphical user interface shown in Figure\
    \ 7.1 to tune the access settings for files or directories.\n\nTIP: To avoid any\
    \ mistakes when trying to access non-existent files, you can use the function\
    \ file_exists(), which returns, regardless of whether a given filename exists.\n\
    \n```\nif (file_exists('file.txt'), 'r') {\n    // ...\n}\n```"
