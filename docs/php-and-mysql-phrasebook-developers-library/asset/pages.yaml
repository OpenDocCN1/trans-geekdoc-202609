- pgno: 59
  md: "Whenever each() is used, the use of list() is a good idea. Within list(), you\
    \ provide variable names for all values with numeric indices in the array that\
    \ is returned by each(). This makes while/each() loops even easier to use, as\
    \ the code shows. Within the parentheses, the variable names are provided.\n\n\
    TIP: If you are interested only in either the key or the value of the array, you\
    \ can remove one of the two variables: just make sure that you keep the comma.\n\
    \n```\nwhile (list(, $value) = each($a)) {\n    echo htmlspecialchars(\"$value\"\
    ) . '<br />';\n}\n```\n\n# Converting Strings to Arrays\n\n```\n$a = explode(',',\
    \ $csvdata);\n```\n\n```\n<?php\n$csvdata = 'Pearson Education,800 East 96th Street,Indianapolis,Indiana,46240';\n\
    $a = explode(',', $csvdata);\n$info = print_r($a, true);\necho \"<pre>$info</pre>\"\
    ;\n?>\n```\n\nTurning a String into an Array (explode.php)\n\nSometimes, arrays\
    \ are not used to store information; instead, a string is used. The single values\
    \ are all within the string, but are separated by a special character. One example\
    \ for this is the comma-separated values (CSV) format."
  merge: -1
  img_proc: true
- pgno: 60
  md: "The PHP function explode() creates an array out of these values; you just have\
    \ to provide the characters at which the string needs to be split. The browser\
    \ then shows this output:\n\n```\nArray\n(\n  [0] => Pearson Education\n  [1]\
    \ => 800 East 96th Street\n  [2] => Indianapolis\n  [3] => Indiana\n  [4] => 46240\n\
    )\n```\n\n# Converting Arrays to Strings\n\n```\n$address = implode('<br />',\
    \ $data);\n```\n\n```\n<?php\n$data = array(\n  'Pearson Education',\n  '800 East\
    \ 96th Street',\n  'Indianapolis',\n  'Indiana',\n  '46240'\n);\n$address = implode('<br\
    \ />', $data);\necho $address;\n?>\n```\n\nTurning an Array into a String (implode.php)\n\
    \nThe way back (that is, making a string representation out of the elements in\
    \ an array) can be done using implode(). Again, two parameters are required: the\
    \ separation elements, then the array. The order is quite unusual, yet important."
