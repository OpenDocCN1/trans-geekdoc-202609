  md: "```\n```php\nnamespace Namespace1 {\n    // ...\n}\n```\n```\n\n```\n```php\n\
    namespace Namespace2 {\n    // ...\n}\n```\n```\n\nFor using namespaces, PHP offers\
    \ several options. Of course, you can provide the fully qualified namespace name,\
    \ as in the previous example; a relative syntax is supported, too. A more convenient\
    \ way for local namespaces is to use an alias. The syntax `use <namespace>` or\
    \ `use <namespace> as <alias>` can significantly save typing and facilitate namespace\
    \ access. Here is one example where a namespace only is imported:\n\n```\n```php\n\
    import Project\\Module\\Submodule;\nSubmodule\\showInfo();\n```\n```\n\nWhen you\
    \ are using an alias, the code could look like this:\n\n```\n```php\nimport Project\\\
    Module\\Submodule as Mod;\nMod\\showInfo();\n```\n```\n\nWithin a namespace, accessing\
    \ built-in PHP classes seems to be a challenge at first because PHP looks for\
    \ those classes within the current namespace. But prefixing the class name with\
    \ a backslash does the trick, and lets PHP look in the global class list:\n\n\
    ```\n```php\nnamespace Project\\Module\\Submodule;\n$c = new \\SoapClient('file.wsdl');\n\
    ```\n```\n\nThere is so much more to discuss regarding namespaces, but to be true\
    \ to the phrasebook concept, we just focus on how namespaces work (in a nutshell).\
    \ The PHP online manual contains much more information at http://php.net/namespace."
