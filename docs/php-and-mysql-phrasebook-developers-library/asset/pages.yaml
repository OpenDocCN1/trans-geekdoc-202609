  md: '+   - Column data is of type TEXT and contains the session data.

    +   - Column access is of type VARCHAR(14) and contains the time stamp of the
    most recent access to the session information.


    It doesn''t matter which database is used. This phrase uses MySQL and PHP5''s
    new mysqli extension, but it is easy to change the code to work with other databases,
    as well. (See Chapter 8, "Working with MySQL Databases," and Chapter 9, "Working
    with Other Databases," for information about using many relevant databases with
    PHP.)


    You can use the PHP function session_set_save_handler() to provide custom functions
    for all relevant six session operations PHP uses internally:


    +   - Opening a session

    +   - Closing a session

    +   - Reading a session variable

    +   - Writing a session variable

    +   - Destroying a session

    +   - Cleaning up (garbage collection [for example, removing old session data
    from the data store])


    For all six of these operations, the following listing contains code that reads
    and writes session data from and to a MySQL data source. You just need PHP 5 and
    have to set the connection parameters (server, username, password) appropriately.
    Then, you include the code from this listing using require_once and then use sessions
    as usual. In the background, PHP then saves all session information in the database
    and not in the file system:'
