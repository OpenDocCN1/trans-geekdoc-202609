  md: '# Interacting with Web Forms


    HTML forms are one of the key ingredients of any dynamic Web site because they
    can enable the users of a site to interact with it. Otherwise, Web sites are more
    or less static: They may be driven by a database and, therefore, regularly changing,
    but they look the same for each and every visitor. HTML forms can change that;
    therefore, using data from forms within PHP is very important.


    Reading the information in is a very easy task: For form data submitted via GET
    (that is, in the uniform resource identifier [URI] of the page requested), the
    data can be found in $_GET[<value of name attribute of form field>]. $_GET[<value
    of name attribute of form field>] holds the field data if the form has been submitted
    via POST. However, this is only the beginning. Suppose a user fills out a form
    but forgets one field. Instead of an error message asking the user to click the
    browser''s Back button, the user can expect a form in which all fields are filled
    in with the values that he previously provided. Many books neglect this; yet,
    even worse, some books just do it wrong. You must'
