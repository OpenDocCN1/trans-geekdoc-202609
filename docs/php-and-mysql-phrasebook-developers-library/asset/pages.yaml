    When you are accessing FTP servers, PHP''s stream wrappers come in very handy,
    as well. You only have read access, but the access is binary safe nonetheless.
    This code shows how to download the current README file for Apache from an FTP
    server and save it to the local hard disk using file_get_contents(). Writing is
    also possible; just use'
