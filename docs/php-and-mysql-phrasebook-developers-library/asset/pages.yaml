  img_proc: true
- pgno: 71
  md: "For this special case, PHP offers no special sorting method; however, you can\
    \ use strnatcmp() to emulate this behavior. The idea is to define a new order\
    \ for some special characters; in the comparison function, you then use this to\
    \ find out which character is “larger” and which is “smaller.”\n\nYou first need\
    \ a function that can sort single characters:\n\n```\nfunction compareChar($a,\
    \ $b) {\n    $characters = 'ÁÁÁBCÇDÉÉFGHIIĴKLMNOÓÓPQRSTUÚÚVWXZ';\n    $characters\
    \ .= 'ááábççdeééfghiiĵjklmnoóóopqrstuúúvwxyz';\n    $pos_a = strpos($characters,\
    \ $a);\n    $pos_b = strpos($characters, $b);\n    if ($pos_a === false) {\n \
    \       if ($pos_b === false) {\n            return 0;\n        } else {\n   \
    \         return 1;\n        }\n    } elseif ($pos_b === false) {\n        return\
    \ -1;\n    } else {\n        return $pos_a - $pos_b;\n    }\n}\n```\n\nThen, the\
    \ main sorting function calls compareChar(), character for character, until a\
    \ difference is found. If no difference is found, the longer string is considered\
    \ to be the “greater” one. If both strings are identical, 0 is returned. The code\
    \ at the beginning of this phrase shows the compare function. The result of this\
    \ code is, as desired, Frans < Frédéric < Froni.\n\nStarting with PHP 5.3, the\
    \ ext/intl extension provides a mechanism for natural language sorting, as well.\
    \ If the"
  merge: -1
  img_proc: true
- pgno: 72
  md: "extension is installed (which may additionally require the ICU library set\
    \ from http://site.icu-project.org/), you first need to create a so-called collator,\
    \ which expects a locale (for instance, en_US, en_CA, en_GB, fr_FR, or de_AT).\
    \ Then, you can call the sort() and asort() methods, which work analogously to\
    \ their PHP counterparts but take the locale information into account:\n\n```\n\
