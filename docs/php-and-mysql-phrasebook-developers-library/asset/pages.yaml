  md: "As with regular classes, abstract classes support single inheritance only.\n\
    \nThe \"same same but different\" approach uses interfaces. An interface looks\
    \ like a regular PHP class, but uses the interface keyword rather than class.\
    \ The interface does not contain any implementation at all, just function signatures.\
    \ All of these functions need to be public.\n\nThe actual class now \"inherits\"\
    \ from this interface; in this context, however, we say that the class implements\
    \ the interface. This is emphasized by the implements keyword, which is used rather\
    \ than extends.\n\nThe other rules are very similar to those of abstract classes:\
    \ All methods from the interface need to be implemented, and the function signatures\
    \ need to stay the same (including the visibility level, which is public anyway).\
    \ As an additional benefit, a class may implement multiple interfaces simultaneously,\
    \ as long as all interfaces involved have distinct method names.\n\nThe following\
    \ code creates two interfaces and then implements both of them in one class:\n\
    \n```\n<?php\n\ninterface MyInterface1 {\n    public function getValue1();\n \
    \   public function getValue2();\n}\n\ninterface MyInterface2 {\n    public function\
