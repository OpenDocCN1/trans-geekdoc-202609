    \  print_r($a);\n  sort($a, SORT_STRING);\n  print_r($a);\n?>\n</pre>\n```\n\n\
    *Sorting an Array (sort.php)*\n\nNumeric arrays can be sorted rather easily by\
    \ using sort(). However, a problem exists if the array contains both numeric and\
    \ string values (for instance, “2” > “10” but 2 < 10). Therefore, the sorting\
    \ can be tweaked so that a special data type is used for comparing elements when\
    \ sorting:\n\n+   - SORT_NUMERIC sorts elements as numbers.\n+   - SORT_REGULAR\
    \ sorts elements according to their data type (standard behavior).\n+   - SORT_STRING\
    \ sorts elements as strings.\n\nHere is the output of the preceding listing:\n\
