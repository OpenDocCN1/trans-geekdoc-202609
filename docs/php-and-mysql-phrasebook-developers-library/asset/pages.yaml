    \ Array with foreach\n(foreach-a.php)\n\nWhen using an associative array and wanting\
    \ to access all data in it, the keys are also of relevance. For this, the foreach\
    \ loop can also provide a variable name for the element's key, not only for its\
    \ value.\n\nUsing count() is possible: count() returns the number of values in\
    \ the array, not the number of elements. Looping through all array elements with\
    \ for is not feasible. However, the combination of each() and while can be used,\
    \ as shown in the following code. The important point is that the key name can\
    \ be retrieved either using the index 0 or the string index 'key':"
