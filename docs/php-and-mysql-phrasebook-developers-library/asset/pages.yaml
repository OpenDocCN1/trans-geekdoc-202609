- pgno: 21
  md: 'Therefore, a username has to be compared without considering case sensitivity.
    This can be done either by using `strcasecmp()`—see the previous phrase—or by
    first converting both the provided password and the real password into lower-case
    letters (or uppercase letters). This is done by the functions `strtolower()` or
    `strtoupper()`. The preceding code shows an example using `strcmp()`/`strcasecmp()`
    and also the compare operator `==`.


    Depending on the data provided in the uniform resource locator (URL) of the call
    to the script, the login either fails or succeeds. For instance, the following
    URL successfully logs in the user. (You have to change the *servername* portion.)


    ```

    ```text

    http://servername/comparelogin.php

    ↪?user=CHRISTIAN&pass=topsecret

    ```

    ```


    In contrast, the following login does fail:


    ```

    ```text

    http://servername/comparelogin.php

    ↪?user=Christian&pass=TopSecret

    ```

    ```


    **NOTE:** Of course, providing usernames and passwords via GET is a very bad idea;
    POST is preferred. (See Chapter 4, “Interacting with Web Forms,” for more details
    on form data.) However, for testing purposes, this chapter’s code uses GET.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Converting Strings into HTML


    ```

    htmlspecial chars($input)

    htmlentities($input)


    <?php

    $input = ''<script>alert("I have a bad

    →\''Föhnwelle\'', ''

    →''therefore I crack

    →websites.");</script>'';

    echo htmlspecial chars($input, ENT_QUOTES) . ''<br

    →/>'';

    echo htmlentities($input);

    ?>

    ```


    *Escaping Strings for HTML (htmlescape.php)*


    A commonly used Web attack is called Cross-Site Scripting (XSS). For example,
    a user enters some malicious data, such as JavaScript code, into a Web form; the
    Web page then at some point outputs this information verbatim, without proper
    escaping. Standard examples for this are Web guest books or discussion forms.
    People enter text for others to see it.


    Here, it is important to remove certain HTML markup. To make a long story short:
    It is almost impossible to really catch all attempts to inject JavaScript into
    data. It''s not only always done using the <script> tag, but also in other HTML
    elements, such as <img onabort="badCode()" />. Therefore, in most cases, all HTML
    must be removed.


    The easiest way to do so is to call htmlspecial chars(): this converts the string
    into HTML, including replacement of all < and > characters with &lt; and &gt;.
    One'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'notable exceptions are single quotes, which are not converted by default. However,
    when using the ENT_QUOTES constant as a second argument, single quotes are properly
    escaped, as well:


    ```

    htmlspecialchars($input, ENT_QUOTES)

    ```


    Another option is to call htmlentities(). This uses HTML entities for characters,
    if available. The preceding code shows the differences between these two methods.
    The German ö (o umlaut) is not converted by htmlspecialchars(); however, htmlentities()
    replaces it with its entity &ouml;.


    The use of htmlspecialchars() and htmlentities() just outputs what the user entered
    in the browser. So if the user enters HTML markup, this very markup is shown.
    Thus, htmlspecialchars() and htmlentities() please the browser but might not please
    the user.


    **NOTE:** If you want to prepare strings to be used within URLs, you have to use
    urlencode() to properly encode special characters such as the space character
    that can be used in URLs.


    However, the function strip_tags() does completely get rid of all HTML elements.
