    *Setting the Domain for a Cookie (setcookie-domain.php)*


    One part of the Set-Cookie header sent by a server is the domain that has access
    to this cookie. If not sent specifically, this value defaults to the domain that
    is sending the cookie. Setting this domain to a completely different value (for
    example, the domain of an ad server [so-called third-party cookies; used to try
    to generate a profile of the user]) does not always work because many browsers
    allow users to specifically disable that. (Figure 6.5 shows an example in the
    Netscape 4.x browser, which, even back in its "prehistoric" heyday, was capable
    of blocking cookies that didn''t use the originating domain.)'
