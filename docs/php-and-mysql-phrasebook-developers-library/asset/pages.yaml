- pgno: 308
  md: "**WARNING:** For security reasons, you can turn off this behavior in php.ini\
    \ by setting allow_url_fopen to Off; so, you cannot rely on it on Web servers\
    \ you cannot control---for instance, shared hosting at large Internet service\
    \ providers (ISPs).\n\nIf you want to control the HTTP request by yourself, you\
    \ can do so by using sockets. First, use fsockopen() to open a socket to the Web\
    \ server, and if that works, you then send a well-formed HTTP request. The following\
    \ code implements this, again querying the PHP home page:\n\n```\n<?php\n\n$fp\
    \ = @fsockopen('www.php.net', 80, $errno, $errstr, 30);\nif ($fp) {\n    echo\
    \ '<xmp>';\n    $request = \"GET / HTTP/1.0\\r\\n\";\n    $request .= \"Host:\
    \ www.php.net\\r\\n\";\n    $request .= \"Connection: Close\\r\\n\\r\\n\";\n \
    \   fwrite($fp, $request);\n    while (!feof($fp)) {\n        echo fgets($fp,\
    \ 1024);\n    }\n    fclose($fp);\n    echo '</xmp>';\n} else {\n    echo \"Error:\
    \ $errstr ($errno)\";\n}\n?>\n```\n\n*Reading in an HTTP Resource Using Sockets\
    \ (http-socket.php)*"
