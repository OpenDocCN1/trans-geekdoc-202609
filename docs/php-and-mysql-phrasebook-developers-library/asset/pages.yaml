- pgno: 314
  md: '+   - SOAP once stood for Simple Object Access Protocol, but because it is
    neither simple nor has much to do with object access, today SOAP just stands for...
    SOAP. It is a rather complex protocol but overcomes many of the limitations of
    XML-RPC (which was, by the way, created by some parties who also worked on SOAP).


    Most of the time, XML-RPC or SOAP calls are transported via HTTP as the carrier
    protocol. However, other protocols are also possible, including Simple Mail Transfer
    Protocol (SMTP) or even User Datagram Protocol (UDP).


    When using SOAP you need to consider one more important aspect: When you know
    exactly how a Web Service is implemented, you also know how to call (access or
    consume) it. However, many times this information is not available, so there must
    be a kind of self-description of the Web Service that contains all relevant information,
    such as which methods or functions are exposed, which parameters and data types
    they expect, and what they return. This can be done using a specifically crafted
    XML file, as well. The standard behind that is Web Services Description Language
    (WSDL). Today, WSDL is used for all relevant Web Services because it makes using
    them is quite simple. Most server-side technologies offer one way (or more) to
    just read in the WSDL and then access the Web Service as you would access a locally
    available class.


    Generating all this XML is quite complicated. Not that PHP doesn''t have good
    XML support, but the syntax can be quite hard. However, some extensions and external
    packages make using Web Services much easier. The following phrases each implement
    a Web Service that just adds two numbers. You will certainly be more'
  merge: -1
  img_proc: true
- pgno: 315
  md: "imaginative and create some real-world Web Services based on what you learn\
    \ in this chapter. In addition, we focus on SOAP web services; XML-RPC does not\
    \ seem to be used that often these days, whereas JSON Web Services (which is covered\
    \ later in this chapter) has become more popular.\n\n# Creating a Web Service\
    \ with NuSOAP\n\n```\n<?php\n    require_once 'nusoap.php';\n\n    $soap = new\
    \ soap_server;\n    $soap->register('add');\n    $soap->service(HTTP_RAW_POST_DATA);\n\
    \n    function add($a, $b) {\n        return $a + $b;\n    }\n?>\n```\n\nA SOAP\
    \ Web Service with NuSOAP (soap-nusoap.server.php)\n\nAt http://nusoap.sourceforge.net/,\
    \ you will find NuSOAP, one of the best-known external SOAP classes for PHP. Some\
    \ might even know its predecessor, SOAPx4. These days, releases are not issued\
    \ very often, but the library is quite stable. You might also want to check the\
    \ Subversion (SVN) repository for the most recent code. You might find several\
    \ files there, but nusoap.php is the one you want."
  merge: -1
  img_proc: true
- pgno: 316
  md: 'Creating a Web Service with NuSOAP is really simple because the module takes
    care of all the painful things, including SOAP. Just follow these steps:


    +   1. Write the function you want to expose as a Web method.

    +   2. Instantiate the `soap_server` class.

    +   3. Register your function with the SOAP server.

    +   4. Call the `service()` method and submit `$HTTP_RAW_POST_DATA` as the parameter.


    This code implements a SOAP server using NuSOAP. Figure 11.2 shows the output
    in the browser when you are trying to call the Web Service directly from the client.
