    # Exchanging Data with the Server


    In the preceding phrase, the data we exchanged with the server was quite trivial—a
    simple string. In real-world applications, however, we have more complex data
    we need to send from the client to the server and back. XML could be used as an
    exchange format, but it is bloated, and so does not fare well with high-performance
    applications. PHP''s serialize() and unserialize() methods could be used to convert
    complex information into a string that can be exchanged via HTTP, but there is
    no built-in counterpart functionality JavaScript offers.


    The de facto standard for data exchange with JavaScript is JSON, JavaScript Object
    Notation. The unofficial home page at http://json.org/ explains the format in
    great detail, but basically JSON sums up the'
  merge: -1
