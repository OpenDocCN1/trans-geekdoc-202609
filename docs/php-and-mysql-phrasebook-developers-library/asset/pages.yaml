- pgno: 38
  md: '# Understanding Regular Expressions


    Regular expressions are, to put it simply, patterns that can be matched with strings.
    Two kinds of regular expressions are available in PHP: POSIX regular expressions
    and PHP regular expressions. The former are deprecated, so we only cover the latter
    option: Perl-compatible regular expressions (PCRE).


    PCRE are often said to be faster, and do offer more features. This functionality
    is enabled in PHP by default; however, if you compile PHP by yourself, you can
    deactivate PCRE using the switch --without-pcre-regex.


    A pattern in a regular expression contains a string that can be searched for in
    a larger string. However, this can also be done (faster) using strpos(). The advantage
    of regular expressions is that some special features such as wildcards are available.
    Table 1.2 shows some special characters and their meaning.


    Table 1.2  Special Characters in Regular Expressions


    | Special Character | Description | Example |

    |---|---|---|

    | `^` | Beginning of the string | `^a` means a string that starts with a. |

    | `$` | End of the string | `a$` means a string that ends with a. |

    | `?` | 0 or 1 times (refers to the previous character or expression) | `ab?`
    means a or ab. |'
  merge: -1
  img_proc: true
- pgno: 39
  md: '### Table 1.2 Continued


    | Special Character | Description | Example |

    |---|---|---|

    | `*` | 0 or more times (refers to the previous character or expression) | `ab*`
    means a or ab or abb or ... |

    | `+` | 1 or more times (refers to the previous character or expression) | `ab+`
    means ab or abb or abbb or ... |

    | `[...]` | Alternative characters | `PHP[45]` means PHP4 or PHP5 |

    | `-` (used within square brackets) | `PHP[3-5]` means PHP3 or PHP4 or PHP5. |
    A sequence of values |

    | `^` (used within square brackets) | Matches anything but the following square
    characters | `[^A-C]` means D or E or F or ... |

    | `\|` | Alternative patterns | `PHP4\|PHP5` means PHP4 or PHP5 |

    | `(...)` | Defines a subpattern | `(a)(b)` means ab, but with two subpatterns
    (a and b). |

    | `.` | Any character | `.` means a, b, c, 0, 1, 2, $, #, ... |

    | `{min, max}` | Minimum and maximum number of occurrences; if either min or max
    is omitted, it means 0 or infinite | `a{1,3}` means a, aa or aaa. `a{,3}` means
    empty string, a, aa, or aaa. `a{1,}` means a, aaa, aaa, ... |'
