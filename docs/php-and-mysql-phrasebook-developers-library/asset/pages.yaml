    \ Major: %d.',\n    $matches);\n?>\n```\n```\n\nSearching in Strings Using PCRE\
    \ (preg_match.php)\n\nMatching patterns in PCRE is done using preg_match() if\
    \ only one occurrence is searched for, or preg_match_all() if multiple occurrences\
    \ may exist. The syntax is as follows: first the pattern, then the string, and\
