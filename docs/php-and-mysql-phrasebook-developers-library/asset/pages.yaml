    *Creating XML with DOM (dom-write.php; excerpt)*


    Apart from the read access, it is also possible to build complete XML documents
    from the ground up using PHP''s DOM support. This might look a bit clumsy, but
    it works very well when you have to automatically parse a lot of data.


    The createElement() method creates a new element. You can set its content by appending
    a new text node (created with createTextNode()) and add attributes with setAttribute().
    Finally, you access the root element of the XML file with documentElement and
    then call appendChild(). Finally, save() writes the whole XML file to the hard
    disk.


    The preceding code saves author, quote, and year in an XML document, appending
    to the data already there.


    NOTE: PHP 5''s DOM extension does not offer something like set_content() (which
    was available in PHP 4), so you have to define the text values of the nodes using
    the createTextNode() method, as shown in the preceding code.'
