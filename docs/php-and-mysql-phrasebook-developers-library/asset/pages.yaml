  md: "# Opening and Closing Files\n\n```\n```php\n<?php\n$fp = @fopen('file.txt',\
    \ 'at');\nfclose($fp);\n```\n```\n\n```\n```php\n<?php\nif ($fp = @fopen('file.txt',\
    \ 'at')) {\n    echo 'File opened.';\n    fclose($fp);\n    echo '<br />File closed.';\n\
    } else {\n    echo 'Error opening file.';\n}\n?>\n```\n```\n\n*Opening (and Closing)\
    \ Files (fopen.php)*\n\nFor most file system functions, the files have to be opened\
    \ first. The function `fopen()` does exactly this and returns a so-called file\
    \ handle, a pointer to the file. This file handle can then be used in subsequent\
    \ functions to, for instance, read information from a file or write to it.\n\n\
    `fopen()` expects at least two parameters:\n\n+   - The name of the file\n+  \
    \ - The file mode to use when accessing the file\n\nOf great interest is the file\
    \ mode parameter. This is a string that consists of one or more characters. The\
    \ first character is one of `a`, `r`, `w`, or `x`; after that, one or more special\
    \ modifiers can be used. Table 7.1 shows all modes."
  merge: -1
