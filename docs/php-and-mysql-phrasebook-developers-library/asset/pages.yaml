- pgno: 115
  md: '# Using Abstract Classes and Interfaces


    ```

    abstract class MyAbstractBaseClass {

    }

    ```


    PHP supports two additional ways of inheritance: abstract classes and interfaces.
    The two approaches are similar, but the differences are essential. The common
    goal is to provide a contract or blueprint for a derived class: the base class
    (or classes, as discussed later) defines which methods are expected in the new
    class.


    When you use an abstract class, the inheritance is done as before, using the extends
    keyword. However, what''s new is that the base class is defined as abstract, thanks
    to the abstract keyword. Also, a set of methods within the abstract class can
    be labeled as abstract, as well, but these do not contain any code:


    ```

    protected abstract function myMethod();

    ```


    The derived class now absolutely needs to implement those methods, using the same
    signatures, and also the same (or at least a less restrictive) visibility setting.
    For instance, if the abstract base class defines an abstract protected method,
    the derived class needs to implement this method as protected or as public. If
    you are using type hints, these need to be identical, as well.


    If the abstract method contains additional methods that are not declared as abstract,
    they are inherited as with regular classes, too, as long as they are protected
    or public:'
