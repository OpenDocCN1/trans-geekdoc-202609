  md: '# Communicating with Others


    Most of the previously discussed phrases worked within the ecosystem of the PHP
    script and the Web server in use. However, because some phrases can also be understood
    by others, this chapter covers some examples of this type. You can connect to
    remote servers in a variety of ways.




    ```

    ```php

    <?php


    echo file_get_contents(''http://www.php.net/'');


    ?>

    ```

    ```


    Reading in an HTTP Resource (http-file.php)


    Hypertext Transfer Protocol (HTTP) is probably the protocol most often used from
    PHP to connect with others (apart from various database protocols). Starting'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'with PHP 4.3, it is really easy to connect to such data sources because PHP''s
    stream support was vastly improved in that version. (Of course, using HTTP in
    the way this code shows was already possible in earlier PHP releases.) The idea
    is that when you use a file operation, you access a stream of data. In practice,
    it doesn''t really matter whether it''s a file on the local system, on a network
    share, or on a remote server connected via either HTTP, File Transfer Protocol
    (FTP), or any other supported protocol. Just provide the appropriate filename,
    and PHP takes care of the rest. The preceding code shows this: It opens the PHP
    home page, and prints its Hypertext Markup Language (HTML) code in the browser.
    With just one line of code, it cannot get much more simple. Figure 11.1 contains
    the output.


    ![](img/2862989e5dc7f1b1d0bc64321737f084_307_0.png)


    Figure 11.1 A one-liner prints the HTML markup of the PHP home page.'
