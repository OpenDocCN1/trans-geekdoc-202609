- pgno: 28
  md: 'Using crypt() with strings is similar to creating a checksum of something;
    It can be easily determined whether a string matches the checksum; however, it
    is not (easily) possible to re-create the original string from the checksum.


    Two algorithms whose purpose is to do exactly this checksumming are Secure Hash
    Algorithm 1 (SHA1) and Message Digest Algorithm 5 (MD5). They create such a checksum,
    or hash. The main difference between these two algorithms and the one used in
    DES/crypt() is that the SHA1 or MD5 checksum of a string is always the same, so
    it is very easy to verify data. As Figure 1.2 shows, even the PHP distributions
    have a MD5 checksum mentioned on the Web site to validate the downloads.


    ![](img/2862989e5dc7f1b1d0bc64321737f084_28_0.png)


    Figure 1.2 The PHP downloads page shows MD5 hashes of the PHP distributions.


    Again, the goal is to validate a password the user provides using GET (which,
    as mentioned previously, is bad practice and only used for the sake of demonstration).'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'The correct password is, once again, ''TopSecret'' with the following hashes:


    +   - 6958b43cb096e036f872d65d6a4dc01b is the MD5 hash.

    +   - 61c2feed11e0e53eb8e295ab8da78150be12f301 is the SHA1 hash.


    From a security perspective, you should not rely on MD5 (because it can be broken
    with modern computers). SHA1 is not completely secure anymore, either, given the
    advances in hardware performance. You should consider additional safeguards:


    +   - Before hashing a value, salt it—that is, prepend a known string, making
    it harder for attackers to crack it. That does not help against an attacker who
    uses brute force and tries almost all possible input combinations.

    +   - Use crypt() with a more secure algorithm such as DES.


    # TIP:


    When calculating the MD5 or SHA1 hash of a file, no call to file_get_contents()
    or other file functions is required; PHP offers two functions that calculate the
    hashes of a file (and takes care of opening and reading in the file data):


    +   - md5_file()

    +   - sha1_file()'
