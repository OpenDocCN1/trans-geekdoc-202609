- pgno: 186
  md: '![](img/2862989e5dc7f1b1d0bc64321737f084_186_0.png)


    Figure 6.5 Even Netscape 4.x allows you to block cookies that do not use the originating
    domain.


    Sometimes, however, the use of cookies is required on third-level domains or subdomains
    (for instance, www.example.com, store.example.com, and ssl.example.com). Large
    Web sites with many subdomains, such as Amazon and eBay, require that all top-level
    domains (TLDs) are supported. To achieve this, the domain of the cookie—fourth
    parameter of setcookie()—has to be set. Here comes the trick: All domain names
    are valid, as long as they contain two dots. So, if you set the domain to .example.com,
    all third-level domains of example.com have access to this cookie. There is one
    but: Pages on http://example.com/ cannot access this cookie. So, you might want
    to try to set the domain to example.com; however, this does not conform with the
    specification and might not be supported in all browsers.'
