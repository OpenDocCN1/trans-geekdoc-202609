  md: '# What Does PEAR Offer?


    As of this writing, the XML section of the PHP Extension and Application Repository
    (PEAR) contains 35 packages, too many to mention. Here are some of them:


    +   - XML Beautifier formats XML documents so that they are prettier.

    +   - XML_DTD allows parsing of DTDs, even with PHP 4.

