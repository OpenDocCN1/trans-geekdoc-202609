- pgno: 50
  md: '# Working with Arrays


    When simple variables are just not good enough, arrays come into play (or objects,
    but that''s another topic). The array section in the PHP manual, available at
    http://php.net/array, lists approximately 80 functions that are helpful. Therefore,
    this book could be filled with array-related phrases alone. However, not all of
    these functions are really used often. Therefore, this chapter presents the most
    important problems you''ll have to solve when working with arrays—and, of course,
    solutions for these problems.


    There are two types of arrays. The names they are given differ sometimes, but
    usually arrays are distinguished between numeric arrays and associative arrays.
    The first type of array uses numeric keys, whereas the latter type can also use
    strings as keys.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'Creating an array can be done in one of three ways:


    +   - Using the `array()` statement


    ```

    ```php

    $a = array(''I'', ''II'', ''III'', ''IV'');

    ```

    ```


    +   - Successively adding values to an array using the variable name and square
    brackets


    ```

    ```php

    $a[] = ''I'';

    $a[] = ''II'';

    $a[] = ''III'';

    $a[] = ''IV'';

    ```

    ```


    +   - Using a new square brackets syntax introduced in PHP 5.4


    ```

    ```php

    $a = [''I'', ''II'', ''III'', ''IV''];

    ```

    ```


    The latter method is probably the most intuitive one for Web developers because
    JavaScript features a very similar syntax. For the sake of backward compatibility,
    we will still use the first option throughout this chapter.


    When using associative arrays, the same three methods can be used; however, this
    time keys and values must be provided:


    ```

    ```php

    $a1 = array(''one'' => ''I'', ''two'' => ''II'', ''three'' =>

    ''III'', ''four'' => ''IV'');

    $a2[''one''] = ''I'';

    $a2[''two''] = ''II'';

    $a2[''three''] = ''III'';

    $a2[''four''] = ''IV'';

    ```

    ```


    ```

    ```php

    $a1 = [''one'' => ''I'', ''two'' => ''II'', ''three'' =>

    ''III'', ''four'' => ''IV''];

    ```

    ```


    Arrays can also be needed, when an array element itself is an array:'
  merge: -1
  img_proc: true
