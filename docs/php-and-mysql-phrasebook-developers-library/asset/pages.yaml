    \ choosing another delimiter (for example, #), you can avoid the escaping of slashes.\n\
    \nIf you have a static pattern, without any quantifiers or special characters,\
    \ using str_replace() is almost always faster. The parameter order for this is:\
    \ first the strings to search for; then the replacements; and, finally, the string\
    \ where the search and replace will take place. You can provide strings or arrays\
