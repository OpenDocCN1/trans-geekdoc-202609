- pgno: 81
  md: 'As a simple example, we will create a class (you can find more about various
    aspects of object-oriented programming [OOP] in Chapter 4) that implements two
    interfaces:


    +   - **ArrayAccess**—Allows accessing individual elements within the object''s
    collection (in our code, a simple array)

    +   - **Countable**—Allows calling count() on an object instance


    If you want full array support, you need to implement additional interfaces, including
    Iterable (for iterator support; for example, via foreach) and some more. The ArrayObject
    interface aggregates several of the required interfaces, which in turn could even
    allow advanced features like user-defined sorting.'
