    \ parentheses are accessed using $2, and so on.\n\nWith this in mind, the replacement\
    \ can be done. In the example, a U.S. date (month/day/year) is converted to a\
    \ U.K. date (day/month/year).\n\nTIP: The regular expression in the preceding\
