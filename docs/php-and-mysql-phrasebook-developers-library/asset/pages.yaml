    in your php.ini. Also, you need the extension itself. Depending on which version
    of PHP you are using, you need a specific version. The PHP manual page http://php.net/sqlsrv.installation
    points you to the correct download page. If possible, you should use at least
    version 3 of the extension, which uses the Microsoft SQL Server 2012 Native Client
    libraries; version 2 requires the Microsoft SQL Server 2008 R2 Native Client libraries.
    Microsoft describes the up-to-date system requirements at http://msdn.microsoft.com/en-us/library/cc296170.aspx.


    To connect to MSSQL, call mssql_connect() and provide the name of the server ((local)
    serves as shortcut for localhost); if you are using a named instance of Microsoft
    SQL Server (for example, SQLEXPRESS, which is installed with the MSSQL Express
    Edition by default), you append it to the server name, separated by a backslash:
    (local)\SQLEXPRESS. As the second argument, you can provide an array with connection
    information. The following array keys are supported by the extension:


    +   - Database—Name of the database

    +   - PWD—Password

    +   - UID—Username


    If you want to authenticate against the database with the current user (sometimes
    also called trusted connection), just omit the UID and PWD configuration settings.'
