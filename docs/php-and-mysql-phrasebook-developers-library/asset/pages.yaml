  md: "# Understanding Inheritance\n\n```\nclass DerivedClass extends BaseClass {\n\
    ```\n\nA class can be inherited from another class by using the extends keyword.\
    \ As a consequence, the new class contains (inherits) all public and protected\
    \ methods from the base class. Of course, it is possible to overwrite these methods\
    \ in the derived classes.\n\nAccess to the parent class is granted by the parent\
    \ keyword. The associated syntax looks like a static reference, but isn't one—so\
