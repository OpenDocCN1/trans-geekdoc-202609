    # Escaping Output


    ```

    ```php

    filter_input(INPUT_POST, ''FieldName'', FILTER_SANITIZE_SPECIAL_CHARS);

    ```

    ```


    Escaping output is one of the key pillars of secure web development. If you output
    dynamic data (that is, information provided by the client or any other untrusted
    external source), you need to escape special characters based on the context in
    which you output the data. Usually, the context is HTML, so you need to escape
    special characters in HTML—'' , <, >, and &. PHP provides the htmlspecialchars()
    function for this task, but the filter extension which was added in PHP 5.2 offers
    a more generic approach.


    The filter_input() function does not mandatorily filter input, but may also help
    in escaping special characters. As a first argument, you provide where to look
    for data to be filtered (for example, INPUT_POST for POST data and INPUT_GET for
    GET data). In the second function'
  merge: -1
  img_proc: true
- pgno: 161
  md: "argument, you provide the name of the GET/POST/... variable to be taken care\
    \ of. In the third argument, you provide the filter to use. The following code\
    \ generates a list of all filters and their numeric IDs that can be used for `filter_input()`:\n\
    \n```\n```php\n$list = filter_list();\nforeach ($list as $value) {\n    print('%s:\
    \ %s', $value, filter_id($value));\n}\n```\n```\n\nPHP also has built-in constants\
    \ for all filters (for example, `FILTER_SANITIZE_SPECIAL_CHARS` instead of its\
    \ numeric value, 515).\n\n**NOTE:** You can escape variables, as well. Just use\
    \ `filter_var()` instead of `filter_input()` and provide the variable and the\
    \ filter to use.\n\n# ## Validating Input\n\n```\n```php\n$email = filter_input(INPUT_POST,\
    \ 'email',\n    FILTER_VALIDATE_EMAIL);\n```\n```\n\nNot only support `filter_input()`\
    \ and `filter_var()` functions (and their sibling functions) the escaping of data,\
    \ but also a validation of data (for example, whether a variable or form field\
    \ contains a valid email address). These validation filters are easy to spot when\
    \ the built-in PHP constants are used—for instance, `FILTER_VALIDATE_EMAIL`. Other\
    \ validation constants are `FILTER_VALIDATE_REGEXP`, `FILTER_VALIDATE_URL`, and\
    \ `FILTER_VALIDATE_IP`."
