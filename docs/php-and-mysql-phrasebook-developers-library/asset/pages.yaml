  md: "| Special Character | Description | Example |\n|---|---|---|\n| \\ | Escapes\
    \ the following character | \\. stands for period (.) |\n\nTIP: The de facto standard\
    \ reference for regular expressions is the title *Mastering Regular Expressions*,\
    \ by Jeffrey E. F. Friedl—a fun read.\n\nOther special characters and expressions\
