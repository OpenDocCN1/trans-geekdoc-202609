    \ bn.de is not (but db.de is). Also, did you know that user-name@[127.0.0.1] is\
    \ a valid email address (if 127.0.0.1 is the IP address of the mail server)?\n\
    \nTherefore, the recommendation is to only check for the major elements of an\
    \ email address: valid characters (an @ character) and a dot somewhere after that.\
    \ It is impossible to be 100 percent sure with checking email addresses; if the\
    \ test is too strict, the user just provides a"
