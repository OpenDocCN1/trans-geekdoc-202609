- pgno: 77
  md: "Imagine you get a bunch of values—from an HTML form, a file, or a database—and\
    \ want to select which of these values are actually usable and which are not.\
    \ You could again call for, foreach, or while and find out what is interesting,\
    \ or you can let PHP do most of the work. In the latter case, get acquainted with\
    \ the function array_filter(). This one takes two parameters: first, the array\
    \ to be filtered; and second, a function name (as a string) that checks whether\
    \ an array element is good. This validation function returns true upon success\
    \ and false otherwise. The following is a very simple validation function for\
    \ email addresses: see Chapter 1, “Manipulating Strings,” for a much better one:\n\
    \n```\nfunction checkMail($s) {\n  $ampersand = strpos($s, '@');\n  $lastDot =\
    \ strrpos($s, '.');\n  return ($ampersand !== false &&\n          $lastDot !==\
    \ false &&\n          $lastDot - $ampersand >= 3);\n}\n```\n\nNow, the code at\
    \ the beginning of this phrase calls array_filter() so that only (syntactically)\
    \ valid email addresses are left.\n\nAs you would expect, the code just prints\
    \ out the two valid email addresses."
  merge: -1
  img_proc: true
- pgno: 78
  md: "# Getting Random Elements Out of Arrays\n\n```\narray_rand($numbers, 6)\n\n\
