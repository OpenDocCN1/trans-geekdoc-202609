- pgno: 330
  md: '![](img/2862989e5dc7f1b1d0bc64321737f084_330_0.png)


    Figure 11.6 The JSON data is parsed and then displayed as a list, thanks to jQuery
    calling PHP code.


    # What Does PEAR Offer?


    Along with the several modules mentioned in this chapter, the following PHP Extension
    and Application Repository (PEAR) packages offer functionality that can be helpful
    when connecting with others using PHP:


    +   - The HTTP category of PEAR offers some relevant packages, including HTTP,
    HTTP_Header, HTTP_Request2, and HTTP_Server.

    +   - Likewise, you can find useful packages in the Networking category, including
    Net_FTP, Net_IMAP, and Net_Socket.

    +   - The Services category of PEAR contains several classes that offer an easy-to-use
    interface for well-known Web Services.'
