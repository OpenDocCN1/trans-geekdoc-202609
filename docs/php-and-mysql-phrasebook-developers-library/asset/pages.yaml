- pgno: 57
  md: "Whether something is an array can be determined using the PHP function is_array().\
    \ Using this, the following code can be assembled; see Figure 2.2 for the result:\n\
    \n```\n```php\n<?php\n\nfunction printNestedArray($a) {\n    echo '<blockquote>';\n\
    \    foreach ($a as $key => $value) {\n        echo htmlspecialchars(\"$key: \"\
    );\n        if (is_array($value)) {\n            printNestedArray($value);\n \
    \       } else {\n            echo htmlspecialchars($value) . '<br />';\n    \
    \    }\n    }\n    echo '</blockquote>';\n}\n\n$arr = array(\n    'Roman' =>\n\
    \        array('one' => 'I', 'two' => 'II', 'three' =>\n        'III', 'four'\
    \ => 'IV'),\n    'Arabic' =>\n        array('one' => '1', 'two' => '2', 'three'\
    \ =>\n        '3', 'four' => '4')\n);\n\nprintNestedArray($arr);\n?>\n```\n```\n\
    \nPrinting a Nested Array Using a Recursive Function\n(printNestedArray.php)"
  merge: -1
  img_proc: true
- pgno: 58
  md: "![](img/2862989e5dc7f1b1d0bc64321737f084_58_0.png)\n\n**Figure 2.2**  Printing\
    \ array contents using a recursive function\n\n# Turning an Array into Variables\n\
    \n```\n```php\n<?php\n$a = array('one' => 'I', 'two' => 'II', 'three' =>\n'III',\
    \ 'four' => 'IV');\nwhile (list($key, $value) = each($a)) {\n    echo htmlspecialchars(\"\
    $key: $value\") . '<br />';\n}\n?>\n```\n```\n\n*Looping through an Array with\
    \ list() and each()*  \n*(each-list.php)*"
