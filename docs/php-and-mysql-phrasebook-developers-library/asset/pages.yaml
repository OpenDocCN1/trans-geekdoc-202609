  md: 'working with transactions, either the whole transaction runs through, or none
    of it; a partial execution cannot happen.


    To use transactions, first disable autocommit (with the mysqli_autocommit() function,
    for example) and from then on all SQL statements on the used connection will be
    part of the transaction. With mysqli_commit(), the statements are finally executed,
    and mysqli_rollback() puts the database back to the state without the transaction.
    At the end of the script, all pending transactions are committed automatically,
    but for performance purposes you should call mysqli_commit() as soon as possible.'
