    \ resides in the file /classes/MyClass.class.php. In that case, the following\
    \ autoloading function would load the class on demand:\n\n```\n<?php\nfunction\
    \ myAutoloadFunction($classname) {\n    if (preg_match('/^[a-zA-Z_\\x7f-\\xff][a-zA-Z0-9_\\\
    x7f-\\xff]*$/', $classname)) {\n        //check for valid classname\n        require_once\n\
    \        \"/path/to/classes/$classname.class.php\";\n    }\n}\n\nspl_autoload_register('myAutoloadFunction');\n\
    ?>\n```\n\nAutoloading Classes (autoload.php)\n\nSo, for instance, the following\
    \ call\n\n`$c = new UnknownClass();`\n\nwould in turn call myAutoloadFunction(),\
    \ providing UnknownClass as the value for the $classname parameter. If you call\
    \ spl_autoload_register() multiple times, all autoloading functions are registered,\
    \ so PHP calls each of them until the desired class is finally defined—or until\
    \ all such functions have been called.\n\nNOTE: The spl_autoload_register() function\
    \ was introduced in PHP 5.1.2 as part of the SPL (Standard PHP Library). Formerly,\
    \ you had to write a function"
