- pgno: 73
  md: "Sometimes, data in an array has to be preprocessed before it can be used. In\
    \ Chapter 4, you will see how data coming from the user via HTML forms can be\
    \ sanitized before it is used. To do so, every array element must be touched.\n\
    \nHowever, it is not required that you do a cumbersome for/foreach/while loop;\
    \ PHP offers built-in functionality for this. The first possibility is to use\
    \ array_map(). This takes an array (second parameter) and submits every element\
    \ in that array to a callback function (first parameter, as a string, an array,\
    \ or an anonymous function, as you can see below). At the end, the array is returned,\
    \ with all of the elements replaced by the associated return values of the callback\
    \ function.\n\nIn the preceding listing, all values in the array are converted\
    \ into HTML using htmlspecialchars().\n\n**NOTE:** Starting with PHP 5.3, you\
    \ may use inline anonymous functions whenever a callback is expected by a PHP\
    \ function. So, the previous code could be cleaned up a bit like this:\n\n```\n\
    <?php\n$a = array('harmless', '<bad>', '>>click\nhere!<<');\n$a = array_map(\n\
    \    function sanitize($s) {\n        return htmlspecialchars($s);\n    },\n \
    \   $a);\necho implode(' ', $a);\n?>\n```\n\nApplying htmlspecialchars() to All\
    \ Elements of an Array, Using an Anonymous Function (array_map_anon.php)"
  merge: -1
  img_proc: true
- pgno: 74
  md: "If the array turns out to be a nested one, however, the tactic has to be changed\
    \ a little. Then you can use a recursive function. If an array element is a string,\
    \ it is HTML encoded. If it's an array, the recursive function calls itself on\
    \ that array. The following code implements this, and Figure 2.6 shows the result:\n\
    \n```\n```php\n<?php\n\nfunction sanitize_recursive($s) {\n    if (is_array($s))\
    \ {\n        return(array_map('sanitize_recursive', $s));\n    } else {\n    \
    \    return htmlspecialchars($s);\n    }\n}\n\n$a = array(\n    'harmless' =>\n\
    \        array('no', 'problem'),\n    'harmful' =>\n        array('<bad>', '->\
    \ <worse> <--')\n);\n\n$a = sanitize_recursive($a);\necho '<pre>' . print_r($a,\
    \ true) . '</pre>';\n?>\n```\n```\n\n*Recursively Applying htmlspecialchars()\
    \ to All Elements of a Nested Array (array_map_recursive.php)*"
