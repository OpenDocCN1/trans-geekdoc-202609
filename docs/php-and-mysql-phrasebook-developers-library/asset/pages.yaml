  md: '# Working with Objects (and Related Topics)


    Object-oriented programming (OOP) is one of the most commonly used programming
    paradigms today. PHP was not conceived as an object-oriented language in the beginning,
    but it added some limited OOP support in PHP 4 and a lot more in PHP 5.x.


    Because this is a phrasebook, OOP is not as well-suited as most of the other topics
    in this book. OOP phrases tend to be very long, or very specific to a given scenario,
    or so general that they might be considered common knowledge (without the need
    to look them up very often).


    We considered several ideas, but ultimately we decided to present a mix of various
    OOP and OOP-related topics, phrases that show useful but nontrivial OOP features
    of PHP, phrases that explain fundamental constructs, and more. When using OOP,
    most of the time it is experience that matters, but this chapter will still provide
    a lot of information you will want to refer to from time to time.'
