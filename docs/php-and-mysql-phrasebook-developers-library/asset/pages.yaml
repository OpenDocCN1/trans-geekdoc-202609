  md: "# Using the Current Date, the U.S./U.K./European Way\n\n```\n<?php\n    echo\
    \ 'US format: ' . date('m/d/Y<br />');\n    echo 'UK format: ' . date('d/m/Y<br\
    \ />');\n    echo 'German format: ' . date('d.m.Y<br />');\n    echo 'International\
    \ format: ' . date('Y-m-d');\n?>\n```\n\nTo give you a short and convenient reference,\
    \ the preceding code contains several commonly used date formats. Depending on\
    \ where you are, the order in which day, month, and year are used might vary:\n\
    \n+   - In the United States, it's (mostly) month, day, and year.\n+   - In the\
    \ United Kingdom and the rest of Europe, it's (mostly) day, month, and year.\n\
    +   - The international standard date notation starts with the year and continues\
    \ with month and day.\n\nNOTE: The preceding code used a four digit representation\
    \ of the year because this is unambiguous. In practice, however, two digit years\
    \ are also commonly used.\n\n# Formatting a Specific Date\n\n```\n<?php\n    echo\
    \ 'Time stamp: ' . mktime(12, 0, 0, 1, 1, 2001);\n?>\n```"
