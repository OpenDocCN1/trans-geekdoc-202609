    # Using Autoloading


    ```

    spl_autoload_register(''myAutoloadFunction'');

    ```


    When you are using a class, it needs to be defined; otherwise PHP will throw an
    error. There is a second chance, however, should a class not be available once
    it is used. The spl_autoload_register() function registers a function that will
    be called once PHP code tries to use a class that has not been registered yet.
    After the call to the registration function, the code that uses the undefined
    class is run again. If the class is now available, great; otherwise, the usual
    error occurs.'
