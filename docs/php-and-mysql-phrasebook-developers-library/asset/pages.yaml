    into the database. Depending on the database system, the data type is either called
    IDENTITY, auto_increment, or something similar.

    +   - **quote**—The quote, as a VARCHAR(255): this length works with all systems.

    +   - **author**—The person who produced the quote, as a VARCHAR(50).

    +   - **year**—The year the quote has been produced (sometimes, this is highly
    speculative), of type INT.


    Every database system comes with either management tools or third-party products
    available. For instance, the PHP-based phpMyAdmin (http://www.phpmyadmin.net/)
    shown in Figure 8.1 offers very good access to a MySQL installation.


