  md: "It is to be noted, however, that the numeric functions—is_float(), is_int(),\
    \ and is_numeric()—also try to convert the data from their original type to the\
    \ numeric type.\n\nAnother approach to convert data types is something borrowed\
    \ from Java and other strongly typed C-style languages. Prefix the variable or\
    \ expression with the desired data type in parentheses:\n\n`$numericVar = (int)$originalVar;`\n\
    \nIn this case, however, PHP really tries to convert at any cost. Therefore, `(int)'3DoorsDown'`\
    \ returns 3, whereas `is_numeric('3DoorsDown')` returns false. In contrast, `(int)'ThreeDoorsDown'`\
    \ returns 0.\n\nGenerally, is_numeric() (and is_int()/is_float()) seems to be\
    \ the better alternative, whereas (int) returns an integer value even for illegal\
    \ input. So, it's really a matter of the specific application at hand which method\
    \ to choose.\n\nThe following code offers the best of both worlds. A given input\
    \ is checked whether it is numeric with is_numeric(), and if so, it is converted\
    \ into an integer using (int). Adaptions to support other (numeric) data types\
    \ are trivial:\n\n```\n```php\nfunction getIntValue($s) {\n    if (!is_numeric($s))\
    \ {\n        return false;\n    } else {\n        return (int)$s;\n    }\n}\n\
    ```\n```\n\nGenerating Integer Values (check.inc.php; excerpt)"
