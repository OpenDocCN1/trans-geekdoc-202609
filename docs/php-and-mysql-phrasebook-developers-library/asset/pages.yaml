    and `__set()` methods are executed (for read and write access), if they exist.


    # Cloning Objects


    ```

    ```php

    $b = clone $a;

    ```

    ```


    Suppose you have a class instance in `$a`. The assignment `$b = $a` would not
    create a copy of `$a`, but `$b` would now contain a reference to `$a`; you would
    still have only one class instance.


    As an alternative, PHP provides the clone keyword, which allows creating a copy
    of the class:


    ```

    ```php

    $b = clone $a;

    ```

    ```


    However, sometimes you do not want exact copies. For instance, imagine that each
    class instance has a property that contains a globally unique identifier (GUID).
    Even though you create a clone of a class instance, you want the GUID still to
