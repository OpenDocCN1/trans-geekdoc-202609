  md: "# Preventing Inheritance and Overwriting\n\n```\nfinal class MyFinalBaseClass\
    \ ()\npublic final function myMethod() {\n```\n\nThere are some classes you do\
    \ not want to inherit from (for instance, if they contain critical functionality,\
    \ and you do not want the other developers overwrite those vital methods). PHP's\
    \ final keyword is suited for that task. You can either make a class final (in\
    \ which case, it is not possible to inherit from it at all) or you can declare\
    \ a method as final (in which case, code cannot overwrite it). Therefore, the\
    \ following code causes an exception, as depicted in Figure 4.1:\n\n```\n<?php\n\
    \    class MyFinalBaseClass {\n        public final function getCopyrightNotice()\
    \ {\n            return '&copy; by Original Author';\n        }\n    }\n\n   \
    \ class MyFinalClass extends MyFinalBaseClass {\n        function getCopyrightNotice()\
    \ {\n            return '&copy; by me!';\n        }\n    }\n?>\n```\n\n*Preventing\
    \ Overloading with the final Keyword (final.php)*"
