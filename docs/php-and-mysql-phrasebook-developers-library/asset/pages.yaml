    \ {\n        $this->prop = $value;\n    }\n\n    public function getProperty()\
    \ {\n        return $this->prop;\n    }\n\n    public function __construct($value\
    \ = null) {\n        if ($value !== null) {\n            $this->prop = $value;\n\
