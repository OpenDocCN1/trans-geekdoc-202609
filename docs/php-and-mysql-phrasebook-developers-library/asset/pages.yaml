  md: '![](img/2862989e5dc7f1b1d0bc64321737f084_56_0.png)


    Figure 2.1 Printing array contents with print_r()


    **TIP:** If you set the second parameter of `print_r()` to true, the associative
    array''s contents are not sent to the client, but are returned from the function,
    so that you can save this information in a variable and process it further.


    However, the output of the preceding code (see Figure 2.1) is hardly usable for
    more than debugging purposes. Therefore, a clever way to access all data must
    be found. A recursive function is a reasonable way to achieve this. In this, all
    elements of an array are printed out; the whole output is indented using the HTML
    element `<blockquote>`. If the array element''s value is an array itself, however,
    the function calls itself recursively, which leads to an additional level of indentation.'
