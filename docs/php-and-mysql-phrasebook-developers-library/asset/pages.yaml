- pgno: 225
  md: "**NOTE:** In the code at the beginning of this phrase, the output is not sanitized\
    \ using `htmlspecialchars()`—in this case, to make the code short. However, depending\
    \ on the data you have, you should consider running `htmlspecialchars()` on all\
    \ elements of the array's `fgetcsv()` returns.\n\nFor writing PHP files, PHP offers\
    \ a sister function, `fputcsv()`. You provide a file pointer and an array of values,\
    \ and PHP does the rest, including escaping special characters. This function\
    \ was introduced in PHP 5.1. Basically, you just join all array elements with\
    \ commas. You also have to take care of commas within the elements, so you surround\
    \ all values by double quotes. If the element contains double quotes, these have\
    \ to be escaped. However, this is not done using backslashes, but by doubling\
    \ the quotes. The following is an example for a valid line of CSV data:\n\nQuote,\"\
    And she said: \"\"No.\"\" ...\",Unknown\n\nThe following is the code for fputcsv()\
    \ for older PHP versions:\n\n```\nif (!function_exists('fputcsv')) {\n    function\
    \ fputcsv($fp, $line, $separator = ',') {\n        for ($i=0; $i < count($line);\
    \ $i++) {\n            if (false !== strpos($line[$i], '\"')) {\n            \
    \    $line[$i] = ereg_replace('\"', '\"\"', $line[$i]);\n            }\n     \
    \       if (false !== strpos($line[$i], $separator) ||\n                false\
    \ !== strpos($line[$i], '\"')) {\n                $line[$i] = '\"' . $line[$i]\
    \ . '\"';\n            }\n        }\n        fwrite($fp, implode($separator, $line)\
    \ .\n        \"\\r\\n\");\n    }\n}\n```"
