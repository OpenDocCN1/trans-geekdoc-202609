    ```


    *Reading CSV Information (fgetcsv.php)*


    CSV is a file format and stands for comma-separated values. Many spreadsheet applications
    can export their data into CSV files. It seems to be easy to use explode() to
    convert CSV values into arrays; however, this turns out to be really complicated.
    What if there is a comma within a value? Then, the content is surrounded by double
    quotes, which makes it hard to use explode().


    As (almost) always, the PHP project has done most of the work and offers fgetcsv().
    This function works as fgets(); however, it converts the line into an array, separating
    the contents at a comma (or any other character provided in the third parameter).'
