- pgno: 219
  md: "TIP: It is even easier to provide a third parameter to file_put_contents()\
    \ to append data instead of overwriting files:\n\n`file_put_contents($filename,\
    \ $data, FILE_APPEND);`\n\n# Locking Files\n\nflock($fp, LOCK_EX);\n\n```\n<?php\n\
    if (!function_exists('file_put_contents')) {\n    function file_put_contents($filename,\
    \ $content)\n    {\n        if ($fp = @fopen($filename, 'w') && flock($fp, LOCK_EX))\
    \ {\n            $result = fwrite($fp, $content);\n            flock($fp, LOCK_UN);\n\
    \            fclose($fp);\n            return $result;\n        } else {\n   \
    \         return false;\n        }\n    }\n}\n?>\n```\n\nUsing file_put_contents()\
    \ with a File Lock (flock.php: excerpts)\n\nWhile reading and writing files, you\
    \ have to take concurrency into mind. What if two processes try to access the\
    \ file at the same time? To avoid trouble when one process writes while the other\
    \ one reads, you have to lock the file. This is done using the PHP function flock()."
