- pgno: 93
  md: "NOTE: If you love collecting useless facts: On September 9, 2001, at precisely\
    \ 3:46:40 a.m. the time stamp was 1.000.000.000. Therefore, mktime(3, 46, 40,\
    \ 9, 9, 2001) returns 1000000000 if your time zone is Central Europe).\n\n# Validating\
    \ a Date\n\n```\n<?php\necho '2000 was ' .\n    (checkdate(2, 29, 2000) ? 'a'\
    \ : 'no') .\n    ' leap year.<br />';\necho '2100 will be ' .\n    (checkdate(2,\
    \ 29, 2100) ? 'a' : 'no') .\n    ' leap year.';\n?>\n```\n\nWhen you get a date—for\
    \ example, from the user using an HTML form—this data must be validated. This\
    \ includes checking whether the month exists and if the month has enough days.\
    \ If it's February, you might also want to find out whether it is a leap year.\n\
    \nBut PHP would not be PHP if you really had to do this on your own. The function\
    \ checkdate() validates a date; you provide the month, the day, and the year as\
    \ parameters.\n\nTIP: Why was 2000 a leap year, but 2100 not? The definition says\
    \ this: If a year is divisible by 4 and is either not divisible by 100 or is divisible\
    \ by 400, it is a leap year and February has 29 days (this is because the Earth\
    \ needs approximately 365.25 days to revolve around the sun). If you want to determine\
    \ whether a given year is a leap year, this function comes in handy:"
  merge: -1
  img_proc: true
- pgno: 94
  md: "```\nfunction isLeapYear($year) {\n    return ($year % 4 == 0 &&\n        ($year\
    \ % 100 != 0 || $year % 400 == 0));\n}\n```\n\nYou could also use DateTime::createFromFormat()\
    \ which returns false if an error occurs. However checkdate() is probably more\
    \ explicit because the name of the function describes exactly what we want to\
    \ do.\n\n# Calculating a Relative Date\n\n```\n<?php\necho 'The license you have\
    \ just bought is valid till ';\n$expiry = time() + 30 * 24 * 60 * 60; //30 days)\n\
    echo strftime('%c', $expiry);\n?>\n```\n\nSometimes you have the task of calculating\
    \ a date that is relative to the current date (for example, 30 days from now).\
    \ Of course, you could put some real work into actually calculating this value,\
    \ taking into account which day it is, whether it's a leap year, and whether DST\
    \ is relevant.\n\nFar easier is the use of an epoch time stamp. Take, for instance,\
    \ the aforementioned task of finding a date that lies 30 days in the future. One\
    \ day has 24 hours, 1 hour has 60 minutes, and 1 minute has 60 seconds. Therefore,\
    \ to get the current time stamp (using time() or date('U')), you just need to\
    \ add 30 * 24 * 60 * 60, and you have the time stamp of the desired date. You\
    \ can then use this time stamp to set a cookie's expiry date or just to print\
    \ out some information about this date."
  merge: -1
  img_proc: true
- pgno: 95
  md: "If you are using the DateTime class, you can also use the add() and sub() methods,\
    \ which are covered in more detail in the “Calculating the Difference between\
    \ Two Dates” section, later in this chapter.\n\n# Creating a Sortable Time Stamp\n\
    \n```\n<?php\nfunction timestamp($t = null) {\n    if ($t == null) {\n       \
    \ $t = time();\n    }\n    return date('YmdHis', $t);\n}\n\necho 'Time stamp:\
    \ ' . timestamp(time());\n?>\n```\n\nUsing date values with a database is not\
    \ always clever. Different language versions of the database, its drivers, or\
    \ the underlying operating system could cause some trouble when the regional date\
    \ formats do not fit together.\n\nA potential alternative is the use of time stamps.\
    \ Several different formats are available, but most of them have the following\
    \ structure: year-month-day hours-minutes-seconds. Using this value order, the\
    \ string representation of the date can be easily sorted, which allows using it\
    \ in databases.\n\nTo create such a time stamp, just a special call to date()\
    \ is required. In the preceding code, this is encapsulated in a function for easy\
    \ reuse."
  merge: -1
  img_proc: true
