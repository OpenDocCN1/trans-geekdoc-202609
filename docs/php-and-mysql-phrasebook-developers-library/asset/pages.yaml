  md: "# Parsing INI Files\n\n```\nparse_ini_file('php.ini', true);\n```\n\n```\n\
    <?php\necho '<xmp>' .\n    print_r(parse_ini_file('php.ini', true), true) .\n\
    \    '</xmp>';\n?>\n```\n\nReading Information from INI Files (parse_ini_file.php)\n\
    \nAnother file format that is very well known is the INI file format. It was very\
    \ widely used in the Windows world, but today also drives the configuration of\
    \ complex software products like PHP. For instance, take a look at php.ini. Here\
    \ is a (modified) excerpt from the default php.ini that shows very well the structure\
    \ of INI files:\n\n```\n[mail function]\n; For Win32 only.\n; SMTP = localhost\n\
    ; For Unix only. You may supply arguments as well\n; (default: \"sendmail -t -i\"\
    ).\nsendmail_path =\n```\n\nSo, there are sections that start with a section headline\
    \ in square brackets, comments that start with a semicolon, and settings in the\
    \ format name=value. The PHP function parse_ini_file() now reads in such a PHP\
    \ file and creates an array out of it: Each section is a subarray, and within\
    \ those subarrays you find the names and the values of directives in the INI file.\
    \ The code at the beginning of this phrase does this (remember to change the path\
