    to an empty string (`""`).


    # ## Reading Out Form Data


    In very early versions of PHP, reading out form data was very easy: If the form
    field had the name attribute "whatever" or, in newer versions of HTML/XHTML, the
    id attribute "whatever", PHP created a variable `$whatever` in the global scope.
    This was very convenient, but, from an architectural point of view, was and is
    a bad idea. Therefore, this was disabled by default from PHP version 4.2 onward
    using the following php.ini directive:


    ```

    register_globals = Off

    ```


    Since PHP 3, the following global arrays have been available for form data:


    +   - `$HTTP_GET_VARS`—All data provided using GET

    +   - `$HTTP_POST_VARS`—All data provided using POST

    +   - `$HTTP_REQUEST_VARS`—All data provided using GET or POST, or via cookies
    (use not recommended)


