    ### 拆解多层网络


    **问题公式。** 我们考虑一个由两个交互层组成的网络。两层中的节点是单相互依赖的。为了简单起见且不失通用性，我们不对其中一层和另一层进行区分，因为如果它们都属于同一节点集合，我们会处理它们。我们将网络表示为
    $G = (V, E^1, E^2)$，其中 $|V|$ 表示节点总数，$E^l$ 表示第 $l$ 层的边，$l = 1$。第 $l$ 层的邻接矩阵的通用元素为
    $A^l_{ij} = 1$，如果 $(i, j) \in E^l$，否则为 $A^l_{ij} = 0$。


    大规模网络连通性通过属于 LMMC 的节点比例来量化。令 $P(S) = \frac{|S|}{|V|}$，其中 $|S|$ 是 LMMC 中的节点数，$|V|$
    是节点数。当所有节点存在于网络中时，$P(S) = 1$。如果移除子集 $S \subset V$，若 $S = \emptyset$，则 $P(S) =
    0$。网络拆解（通常被称为拆解问题）可以作为一个约束优化问题：


    $$S^*(C) = \arg \min_{S} P(S)$$


    施加在移除集合 $S$ 元素的成本 $C$ 之上的约束。本文考虑了三种成本类型：1) 单位成本、（2) 度、（3) 随机成本。在单位成本版本中，与集合 $S$
    相关的函数是大小，因此 $C(S) = |S|$。度版本定义为 $C(S) = \sum_{v \in S} d_v$，其中 $d_v$ 是图 $G$ 中节点
    $v$ 的度。我们用 $d_v^{(l)}$ 表示第 $l$ 层中节点 $v$ 的度，集合 $S$ 中的节点仅计算一次。在随机成本版本中，每个节点 $i$
    相关的成本由 $F(i) = X_i$ 给出，其中 $X_i$ 取自均值为 0.5、方差为 0.1 的分布，或均值为 1 的泊松分布。


    优化问题描述的一个重要方面是识别导致 LMMC 消失的最小成本节点集。此类定义：


    $$S^*(C) = \arg \min_{S: C(S) \leq C} P(S)$$


    本质上，只有将 $P$ 降低到阈值以下的 $S$ 才被视为解决方案：近似多层网络拆解。本文考虑的所有算法顺序构造拆解问题的近似方法，确保解决方案每次添加一个元素。$f_1,
    f_2, \dots, f_n$ 是按照顺序添加的节点标签。我们定义 $S_t = \{f_1, \dots, f_t\}$ 为集合由相应元素组成时的算法近似解。如果
    $S_0 = \emptyset$ 且 $S_n = V$，对于所有 $t=0, \dots, n$，显然有 $P(S_t) \geq P(S_{t+1})$。我们通过衡量
    AUD 来评估近似算法的性能：


    $$AUD = \frac{1}{N} \sum_{i=1}^{N} (F(S) - F(S \setminus \{v_i\}))$$


    $F(V)$ 是与图中节点相关的成本。这是 Schneider 等人引入的所谓鲁棒性指标。由于计算原因，我们通过累加 $N$ 个贡献来近似 AUD，这提供了真实值的良好近似。这种能力之一可以是多层网络拆解问题的扩展，例如多层
    $\mathcal{N}$ 或通过冗余依赖关系连接的网络。我们将此类扩展留给未来研究。


    https://doi.org/10.1038/s41586-020-0170-2


    注意 AUD 和 $C$ 都定义在 [0, 1] 。对于指标，低值表示良好的性能。


    ## Multilayer


    我们提供了 Multilayer 中使用的编码器、解码器和拆解策略的细节。


    编码器。MGNN 的框架如图 5 所示。MGNN 由层内图和层注意力模块组成，用于聚合来自不同层的信息。网络嵌入中的初始化特征对于建立坚实基础和收敛至关重要。借鉴
    FINDER 的初始化方法，MGNN 利用多层 MLP 编码：


    $$H^{(l)} = \text{ReLU}(W_l X^{(l)})$$


    其中 $X^{(l)}$ 是节点 $i$ 在层 $l$ 中的归一化度（通过节点最大度定义节点度）。$\text{ReLU}(\cdot)$ 是激活函数，$W_l$
    是权重矩阵，$\cdot$ 表示 l2 归一化。


    使用初始化特征，我们通过迭代聚合节点特征及其表示的信息，将层内图卷积神经网络应用于节点嵌入：


    $$H^{(l)} = \text{ReLU}(W_l H^{(l-1)} + U_l \cdot \sum_{j \neq l} H^{(j-1)})$$


    在方程 (l) 中，$H^{(l)}$ 代表前向传播步中节点 $i$ 在层 $l$ 中的嵌入。它捕捉了 $h$ 个隐藏信息。W_l$ 和 $U_l$ 是权重矩阵，$N^{(l)}$
    表示层 $l$ 中的邻居节点集。最终表示可以表示为 $H^{(L)}$。


