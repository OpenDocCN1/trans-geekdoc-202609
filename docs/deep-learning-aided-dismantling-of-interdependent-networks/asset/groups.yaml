    # 深度学习辅助的相互依赖网络拆解


    接收：2024年9月26日


    接纳：2025年6月4日


    Weiwei Gu†¹, Chen Yang†¹, Lei Li², Jinqiang Hou¹¹，以及 Filippo Radicchi‡


    在线发表：2025年7月14日


    + - 查看更新


    识别一组移除后可以破坏复杂网络连接的最小节点集合，也称为网络拆解（network dismantling），是一项极具挑战性的任务，在多个领域都有应用。尽管网络拆解在过去十年中得到了广泛研究，但研究主要集中在单层网络的优化问题上，忽略了并非所有（如果不是）现实网络都显示出多层相互依赖的交互。在这样的网络中，优化问题从根本上不同，因为移除节点的影响会跨层传播，这种传播方式无法通过单层视角进行预测。我们提出了一种拆解算法
    MultiDismantler，它利用多重表示和深度强化学习来优化地拆解相互依赖网络。MultiDismantler 在合成图上进行训练；当应用于真实或合成网络时，它表现出卓越的拆解性能，优于所有现有的基准算法。我们证明了
    MultiDismantler 在引导具有多层社会交互的社交网络的疾病控制策略方面有效。此外，我们还证明 MultiDismantler 在设计旨在防止关键基础设施发生级联故障的协议方面有用。


    网络无存在于自然（例如，气候网络和蛋白质-蛋白质相互作用网络）和人造（例如，社交网络和基础设施网络）¹。连通性对于网络的整体功能至关重要，因为作为任何连通分的一部分是交互的必要条件。由于其异质结构，寻找移除后会破坏任何连通分的最小节点集合被称为网络拆解问题²。网络拆解有许多应用：为了药物设计抑制特定物种或蛋白质属于网络拆解；增强交通或电力系统等网络的容忍性以最大化基础设施网络的效率，可以被视为网络拆解³；寻找应该接种以防止疾病爆发的最小节点集可以通过网络拆解问题的解决方案很好地近似。


    拆解是网络最基础的优化问题，但众所周知它是 NP-hard（非多项式时间）⁴⁵。对于仅具有中大型层的大网络，只能获得此类精确解。许多优化方法提供了基于以节点为中心的启发式方法的近似解，例如高度自适应（HDA）⁶集体影响（CI）和
    Minsur。这些方法没有优化全局问题，不具备保证和泛化能力。基于机器学习的策略，如


