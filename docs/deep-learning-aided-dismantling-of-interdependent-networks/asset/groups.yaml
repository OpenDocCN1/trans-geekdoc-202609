    **图 1 | Multi-Dismantler 的训练过程。** 该过程包括生成训练网络、拆解它们并从以往经验中学习。训练数据包含超过20,000个规模从30到50个节点的合成网络，这些网络根据几何模型生成。为了表示网络，我们在每层中添加了第一个虚拟节点（表示为
    $v$）；所有节点都是虚拟节点的邻居，但反之亦然。通过 MGNN 模型，我们学习了多层节点注意力机制 ($\theta_l$)，MultiDismantler
    解码多个网络，包括虚拟节点的嵌入以及每个节点的最终嵌入。随后，代理体使用 MLPs ($\phi_l$) 和层注意力机制 ($\psi$) 解码嵌入以计算每个节点的预期回报
    ($Q$) 值，该值反映了在当前网络下移除一个节点可以获得的奖励。代理体使用 $\epsilon$-greedy策略移除节点（红色节点）；以 $1-\epsilon$
    的概率选择 Q 值最高的节点；否则，移除一个随机节点。考虑到网络层之间的依赖关系，当代理体移除一个节点后会发生级联故障，导致更多边的移除（蓝色线条）。在节点操作后，代理体解码并重构剩余网络。一旦网络被完全拆解，代理体以
    $(s_t, a, r, s_{t})$ 的形式收集信息并存储在经验池中。代理体通过从经验池中随机采样批次来更新策略。


    机器学习拆解 (GML) 和神经排序 (NBR) 学习方法在处理 Barabási-Albert (BA) 和 Erdős-Rényi (ER) 网络等合成图时面临挑战。然而，现实网络往往是嵌套的或由多个独立层组成；由独立层组成的网络比其单独考虑的每一层都更不稳定。某一层中的损坏可能会导致其他层的失效，并可能导致整个系统的崩溃。这种拆解机制使得系统运行难以预测和控制。例如意大利的30分钟停电和大流行期间全球供应链的突然中断。两种方法，有效度度量
    (EDM) 和 CoreLL 是专门为拆解复杂网络设计的；然而，它们都基于以节点为中心的启发式方法，因此受到这类方法局限性的影响。正如我们将所示，与我们提出的方法相比，它们往往面临次优的拆解性能。利用图优化技术的机器学习¹¹以及在框架¹⁴
    基础上的最新进展，我们引入了代理体学习的拆解框架 MultiDismantler，它可以以高效率在大规模网络中近似解。通过利用生成模型来学习 MultiDismantler
    嵌入的特征（这无法表征不同网络之间的交互和相关性）。网络上的结构过程与动态过程之间存在几何相关性²⁸-³⁰。训练完成后，MultiDismantler 使用具有多级层独立架构的卷积神经网络来预测节点重要性。随后是深度
    Q 网络 (DQN)，代理体通过与网络环境的尝试和交互学习节点移除策略。当这些策略用于优化大规模拆解问题时，表现得成功。


