    # # Deep-learning-aided dismantling of interdependent networks


    Received: 26 September 2024


    Accepted: 4 June 2025


    Weiwei Gu†¹, Chen Yang†¹, Lei Li², Jinqiang Hou¹¹, and Filippo Radicchi‡


    Published online: 14 July 2025


    +   - Check for updates


    Identifying the minimal set of nodes whose removal breaks a complex network apart,
    also referred to as network dismantling, is a highly non-trivial task with applications
    in multiple domains. Whereas network dismantling has been extensively studied
    over the past decade, research has primarily focused on the optimization problem
    for single-layer networks, neglecting that if not all, real world networks display
    multiple layers of interdependent interactions. In such networks, the optimization
    problem is fundamentally different as the effect of removing nodes propagates
    and across layers in a way that can not be predicted using a single-layer perspective.
    We propose a dismantling algorithm MultiDismantler, which leverages multiple representation
    and deep reinforcement learning to optimally dismantle interdependent networks.
    MultiDismantler is trained on synthetic graphs; and when applied to either real
    or synthetic networks, it displays exceptional dismantling performance, outperforming
    all existing benchmark algorithms. We show that MultiDismantler is effective in
    guiding strategies for the control of diseases in social networks characterized
    by multiple layers of social interactions. Also, we show MultiDismantler is useful
    in the design of protocols aimed at preventing the onset of cascading failures
    in critical infrastructures.


    Networks are ubiquitous in both natural (for example, climate networks and protein-protein
    interaction networks) and man-made (for example, social networks and infrastructure
    networks) complexes¹. Connectivity is essential for the overall network function,
    as being part of any connected component is a necessary condition for interaction.
    Due to its heterogeneous structure, finding the minimal set of nodes whose removal
    would destroy any connected components is known as the network dismantling problem².
    Network dismantling has numerous applications: inhibiting specific species or
    proteins for drug design is network dismantling; enhancing the tolerance and networks
    such as traffic or electric systems, to maximize the efficiency of infrastructural
    networks which can be thought


    network dismantling³ finding the smallest set of nodes that should be vaccinated
    to prevent a disease outbreak is well approximated by the solution of a network
    dismantling problem.


    Dismantling is the most fundamental optimization problem for networks, but it
    is notoriously, NP-hard (non-polynomial time)⁴⁵. Such exact solutions, for large
    networks with only medium and large layers, can only be may obtained. Many optimization
    methods provide approximate solutions that are based on node-centric heuristics,
    such as high degree adaptive (HDA)⁶ collective influence (CI) and Minsur. These
    methods do not optimize a global problem, perform no guarantees and generalization
    capability. Machine learning-based strategies such as the


