    # Other algorithms


    Here we described other algorithms used in our experiments. For instance, layer
    denoising algorithms, we explain how they are constructed and utilized in multiple
    networks. These generalized algorithms also use a global score to reach the maximum
    of a centrality centered metric estimated on each individual layer. This heuristic
    approach was refined by as a generalization of the targeted-attack protocol from
    single layer to one-to-one networks. We stress, however, that merging scores into
    a global score: future work could leverage a deep learning approach to infer the
    appropriate rule of score aggregation to maximize the performance of the results.


    CoreHLDA. CoreHLDA² is used for network recycling, and refining processes to dismantle
    multiplex networks. A novel scoring method used in network recycling and tree
    by combining the scores from the single-layer network.


