    # 15.7 SENSITIVITY ANALYSIS


    Initially, decision-makers were granted equal importance in ranking the options.
    Yet, there might arise instances where the preferences attributed to the opinions
    of decision-makers do not align. These kinds of situations have been taken into
    consideration in this section.


    We have taken six cases where priority has been given to each decision-maker in
    first three cases and also in next three cases where equal priority has been given
    to two decision-maker at a time.


