  md: 'of an FLC, including fuzzification, rule base, inference engine, and defuzzification,
    are explained in detail. Fuzzy rules are derived from expert knowledge and sensor
    inputs, enabling the controller to make intelligent decisions. The block diagram
    of the proposed system is given in Figure 12.2.


    ![](img/e9de70cd491e84262133af63cb33d500_235_0.png)


    Fuzzy membership functions are used in fuzzy logic systems to represent the degree
    of membership of a particular element in a fuzzy set. In greenhouse measurement,
    fuzzy membership functions can be employed to handle uncertainty and imprecision
    in sensor data. Greenhouse measurements often involve temperature, humidity, and
    soil moisture levels. Fuzzy logic can be applied to model these parameters and
    make decisions based on vague or incomplete information.


    To use the fuzzy Tsukamoto technique, a fuzzy set with a monotonous membership
    function must be provided for each outcome of an IF–THEN rule. Fuzzy logic by
    Tsukamoto was selected because it produces well-defined individual rules. Consequently,
    each rule’s inference output is provided crisply based on the $\alpha$-predicate,
    and a weighted average is used to get the conclusion. Phases of fuzzy operation
    are as follows.


    +   1. Fuzzification: Membership functions recorded in the knowledge base translate
    explicit values from the system into linguistic variables.

    2. Formation of a fuzzy rule in the form of IF–THEN.

    3. Fuzzy Interference System: Process of using the IF–THEN rules on fuzzy knowledge
    to transform fuzzy input into fuzzy output.'
