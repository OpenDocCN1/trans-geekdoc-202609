    | C08 | Price Earnings Ratio | Price Earnings Ratio = Market Price Per Share /
    Earnings Per Share | Nonbeneficiary |

    | C09 | Dividend Yield | Dividend Yield = Dividend Per Share / Market Price Per
    Share | Beneficiary |


    # 9.4.3 FUZZY SET THEORY


    Fuzzy set theory was introduced by Zadeh [20] and it is an extension of the classical
    crisp logic into a multivariate form.


    > Definition: A set $\bar{A}$ is defined as $\bar{A} = \{(\Xi, \mu_\bar{A}(\Xi)\!:
    \Xi \in \bar{A}, \mu_\bar{A}(\Xi) \in (0, 1)\}$ where $\mu_\bar{A}(\Xi)$ represents
    the membership function of $\bar{A}$'
  merge: -1
  img_proc: true
- pgno: 174
  md: "# #### 9.4.4 TFN\n\nDefinition: Triangular Fuzzy Number $A_{TFN} = \\{(a, b,\
    \ c), \\mu_{\\bar{A}}(x)\\}$\n*is defined as Triangular Fuzzy Number if it satisfies\
    \ the following properties:*\n\n+   a. $\\mu_{\\bar{A}}(x)$ *is zero when* $x\
    \ \\leq a$\nb. $\\mu_{\\bar{A}}(x)$ *is strictly increasing continous function\
    \ when* $a < x \\leq b$\nc. $\\mu_{\\bar{A}}(x)$ *has the maximum value, that\
    \ is,* 1 *at* $x = b$\nd. $\\mu_{\\bar{A}}(x)$ *is strictly decreasing continous\
    \ function in* $b < x \\leq c$\ne. $\\mu_{\\bar{A}}(x)$ *is again zero when* $x\
    \ \\geq c$\n\n# #### 9.4.5 THE MEMBERSHIP FUNCTION OF A SYMMETRIC AND LINEAR TFN\n\
    \n$\\mu_{\\bar{A}}(x) = \\begin{cases} 0; x \\leq a \\\\ \\frac{x - a}{b - a};\
    \ a < x \\leq b \\\\ 1; x = b \\\\ \\frac{c - x}{c - b}; b < x \\leq c \\\\ 0;\
    \ x \\geq c \\end{cases}$\n\n# #### 9.4.6 GRAPH OF TFN\n\nFigure 9.3 is the representation\
    \ of the membership function of linear TFN.\nIn Figure 9.3, TFN diagrammed with\
    \ $a \\leq b \\leq c$ where $a$, $b$, and $c$ are all real numbers.\n\n# ####\
    \ 9.4.7 ARITHMETIC OPERATIONS OF TFN\n\nLet $E = (e_1, e_2, e_3)$ and $F = (f_1,\
    \ f_2, f_3)$ be two different TFN.\n\n+   1. *Addition:*\n    $(E + F) = (e_1\
    \ + f_1, e_2 + f_2, e_3 + f_3)$\n2. *Subtraction:*\n    $E - F = (e_1 + f_3, e_2\
    \ - f_2, e_3 + f_1)$"
