    # ## ABSTRACT


    Oil companies are assuming a crucial role in driving socioeconomic development
    inside a nation. In India, the oil sector has experienced significant growth in
    recent times. Oil companies have demonstrated remarkable performance in terms
    of their services and availability. Undoubtedly, the financial performance of
    an oil company constitutes its primary component. In the current landscape of
    heightened market competition, the accurate and precise assessment of financial
    performance'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'holds significant significance for an oil company that seeks to effectively
    sustain its market standing. This research aims to assess the financial performance
    and provides a ranking of the six NIFTY oil companies listed on August 16, 2023
    in the National Stock Exchange (NSE), India, using their financial indicators.
    The valuations of these six oil companies are conducted based on nine financial
    indicators, which are then combined to derive a financial performance score utilizing
    a multicriteria decision-making (MCDM) methodology. In this study, triangular
    fuzzy number (TFN) and the fuzzy graph theory and matrix approach (F-GTMA) are
    utilized to rank the oil companies based on their financial performance. The findings
    indicate that Reliance exhibits the highest level of financial efficiency, with
    ONGC and IOC ranking second and third, respectively.


