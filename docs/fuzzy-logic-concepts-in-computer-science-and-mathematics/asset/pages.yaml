    # 14.6 MEMBERHIP FUNCTION MODIFICATION


    This is the most important step where appropriate fuzzy techniques can modify
    the membership values. The degree to which an object satisfies particular properties
    is indicated by its membership value. Additionally, the membership values show
    how fuzzy a set is. Fuzzy clustering is the unsupervised learning technique that
    induces rules by categorizing and organizing data into partitions to form clusters.
    The fuzzy clustering method which is the fuzzy c-means (FCMs) algorithm is widely
    used in many applications, including pattern recognition, image segmentation,
    and data analysis. The fuzzy clustering consists of the fuzzy partitioning of
    the input space and the creation of the fuzzy set that consists of the data points
    along with the partial membership of the multiple clusters.


    That clustering algorithm is used to create rule-based classification models where
    each rule is associated with a fuzzy cluster. Unlike fuzzy image processing, a
    methodology has been developed for converting a fuzzy logic model that is based
    on transparent linguistic rules from a fuzzy clustering-based classification model.
    Furthermore, optimized algorithms are established by combining the FCMs algorithm
    with genetic algorithms and particle swarm optimization to improve the rule-based
    fuzzy clustering process. The membership function for the image fuzzy processing
    is thresholding by selecting an $\alpha$-cut. A study shows that the fuzzy rule-based
    approach for disease detection performs well over various methods and techniques,
    such as, support vector machines (SVMs), artificial neural networks, fuzzy logic,
    convolution neural networks, etc. Fuzzy rules are developed from the values of
    the parameters obtained from the feature extraction method, that is, blob analysis
    and then implemented using the membership function [9].


