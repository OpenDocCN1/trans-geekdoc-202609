  md: '# **8.3.2 FUZZY INFERENCE SYSTEMS (FIS)**


    A FIS shown in Figure 8.5 is a computational model in fuzzy logic that mimics
    the human decision-making process by using fuzzy set theory. FIS involves a set
    of rules and a reasoning mechanism that makes decisions based on fuzzy logic principles.
    The key components and concepts of FISs are given in below section.


    ![](img/e9de70cd491e84262133af63cb33d500_133_0.png)


    **FIGURE 8.5** Fuzzy inference system.


    # *8.3.2.1 FUZZIFICATION*


    Fuzzification is the first step of FIS when membership functions are used to convert
    crisp input values into fuzzy sets. In this step, the degree to which the input
    values fall into different language categories is determined.


    # *8.3.2.2 RULE BASE*


    The relationship between the fuzzy input and fuzzy output values is defined by
    a collection of IF–THEN rules. Every rule usually prescribes a fuzzy output action
    and relates to a certain set of input conditions.


    # *8.3.2.3 INFERENCE ENGINE*


    The central element of FIS is the inference engine, which combines fuzzy input
    values in accordance with the rule basis to produce fuzzy output values. Typical
    inference techniques are Sugeno and Mamdani. Sugeno inference generates a sharp
    output based on a certain input, whereas Mamdani inference yields fuzzy results.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# 8.3.2.4   AGGREGATION


    To create a comprehensive fuzzy output, aggregation is the process of integrating
    the fuzzy outputs produced by various rules. To aggregate the fuzzy sets, a variety
    of techniques can be applied, including maximum and average.


    # 8.3.2.5   DEFUZZIFICATION


    The final step is defuzzification, where the fuzzy output is transformed into
    a crisp output. This process involves converting the fuzzy output sets into a
    single, actionable value. Common defuzzification methods include centroid, mean
    of maximum, and weighted average.


    FISs find applications in diverse fields, including control systems, decision
    support systems, and pattern recognition. They excel in scenarios where precise
    mathematical models are challenging to define, and human expertise and linguistic
    reasoning play a crucial role. FIS gives a flexible and intuitive technique for
    modeling complex systems in the existence of uncertainty and imprecision, providing
    the achievement of fuzzy logic applications in real-world problems.


    # 8.3.3   RULE-BASED REASONING WITH FUZZY LOGIC


    FISs are built on the foundation of rule-based reasoning with fuzzy logic, which
    entails drawing inferences from a set of if–then rules using the ideas of fuzzy
    logic. Fuzzy logic excels at modeling and managing complex systems with uncertainty
    and imprecision because these rules capture expert knowledge and human-like reasoning.
    Rule-based reasoning proceeds through a number of crucial steps:


    +   *   **Fuzzification:** Using membership functions, the input variables are
    converted from sharp, numerical values into fuzzy sets. This stage makes it possible
    to depict the uncertainty and imprecision contained in real-world data.


    +   *   **Rule Base:** The rule base consists of a set of if–then rules that relate
    fuzzy input variables to fuzzy output variables. Each rule articulates a linguistic
    relationship between certain input conditions and the resulting output action.
    For example, a rule might state “IF temperature is high THEN air conditioning
    is strong.”'
  merge: -1
  img_proc: true
- pgno: 135
  md: '+   * **Inference Engine:** The inference engine evaluates the fuzzy rules
    based on the current fuzzy input values. The degree to which each rule is satisfied
    is determined by the membership functions associated with the input variables.
    The inference engine combines these rule strengths to generate fuzzy output values.


    +   * **Aggregation:** To create a thorough fuzzy output, the fuzzy output values
    from several rules are combined. This entails merging the distinct fuzzy sets
    that each rule generates, frequently utilizing methods like maximum or average
    aggregation.


    +   * **Defuzzification:** Defuzzification, the last stage, transforms the fuzzy
    output into a clear, useful outcome. In this process, the combined fuzzy output
    set is usually summarized into a single numerical number. The centroid, mean of
    maximum, and weighted average defuzzification are popular techniques.


    Fuzzy logic is a valuable tool for control systems, expert systems, smart manufacturing,
    robotics, and decision-making because it uses a rule-based reasoning process to
    account for the inherent uncertainties in real-world systems. Because fuzzy logic
    can capture the complexity of human-like decision-making due to rule-based reasoning''s
    flexibility, it is especially useful in scenarios when more exact and deterministic
    approaches are insufficient.


