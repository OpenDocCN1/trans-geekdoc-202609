  md: '# ### 14.8.1 NOISE REMOVAL AND DISTORTION CORRECTION


    Fuzzy logic can enhance the quality of images by reducing the noise in the pre-processing
    phase. A fuzzy filter is used to remove the additive noise and they use the member
    function corresponding to the fuzzy rule of the different stages of the filter
    [14]. A recursive double-action fuzzy filter is introduced which performs the
    fuzzy reasoning into two phases and strongly cancels the noise without any degradation
    of the image structure [15]. Another adaptive fuzzy filter is proposed by the
    researcher that can potentially enhance the image quality by performing edge detection
    for the smeared images. That fuzzy filter has two mechanisms: Adaptive weighted
    fuzzy mean and fuzzy normed inference system. The member function of the fuzzy
    set used for the filters is adaptively determined for the different images. This
    filter can cancel the random impulse noise and Gaussian impulse noise effectively
    [16]. The article proposes the use of fuzzy logic and an alpha-trimmed mean-based
    filter to smooth out uniform impulse noise from grayscale images that have been
    distorted. To prevent the outlier effect, the suggested method combines fuzzy
    logic with the idea of an alpha-trimmed mean. The alpha-trimmed mean and median
    values are used to develop a fuzzy membership function, in turn, is used to find
    the noisy pixels estimated value. The method described in [17] outperforms all
    the previous impulse noise removal methods. The impulse noise of the sequence-based
    images is also removed [18]. Furthermore, the impulse noise which is salt pepper
    noise can be removed using an adaptive switching median filter [19]. In recent
    studies of biomedical image analysis, Gaussian blur is applied to remove unwanted
    noises from the optical coherence tomography B scan images to identify diabetic
    macular edema [20].


    # ### 14.8.2 OBJECT IDENTIFICATION AND SEGMENTATION


    For reliable image segmentation, an automatic fuzzy algorithm has been introduced
    in the study by the researcher and compared with the existing method by various
    test images, noisy synthetic images, and simulated magnetic resonance Image datasets
    [21]. Research work has been published for skin cancer detection using fuzzy logic-based
    segmentation with an advanced deep-learning model. Furthermore, to enhance the
    segmentation results, the L–R fuzzy defuzzification method is used [22].


    In computer vision, fuzzy logic can be incorporated with the image segmentation
    process to detect damages in a traffic accident where a c-means'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'fuzzy clustering algorithm is used with a particle optimization algorithm for
    image segmentation [23]. A hybrid character recognition method is introduced using
    fuzzy logic, SVMs, and the stroke Bayesian program learning using naive Bayes
    in an industrial environment [24].


    To automate some production chain in agriculture, intelligent systems was developed
    that uses the intensification operator to enhance the contrast of the image. To
    segment the images fuzzy divergence is used and fruit identification is performed
    using the Hough transform [25].


    # 14.8.3 FEATURE EXTRACTION


    For the high-level image analysis, the objects are segmented and recognized by
    some algorithm. However, clustered objects cannot be segmented properly. So, multistage
    segmentation approaches are introduced. However, the problem of multistage segmentation
    is that at each step a new structure is detected which creates ambiguity. So,
    to propose an improved version on top of this a metaheuristic optimization algorithm
    that is ant-colony optimization and fuzzy logic-based technique is proposed to
    solve the problem [26]. Many machine learning algorithms are used for the feature
    extraction processes but fuzzy logic is used very rarely.


    # 14.8.4 CLASSIFICATION


    At the initial time or the early age of the image processing, classification approaches
    are mainly pixel-based rather than utilizing the spatial and context information
    of the object in the images and their surroundings. As time goes on, approaches
    are modified and start incorporating spatial and context information. The classification
    of the segmented object can be performed by object feature tracking, and supervised
    segmentation [27] can be done for the object-oriented classification. Tissue abnormality
    can be detected using fuzzy-neuro logic by determining the suitable object parameters.
    The medical images are classified and segmented perfectly [28].


    # 14.8.4.1 FUZZY CLUSTERING ALGORITHM


    The fuzzy clustering techniques are widely used to assign the degree of membership
    of the data points that belong to one or more clusters. The'
  merge: -1
  img_proc: true
- pgno: 282
  md: grouping of the data is performed based on their proximity to each other. The
    c-mean clustering algorithm provides the hard assignment in the data point clustering.
    Although, the c-means clustering is computationally complex and sensitive to initialization.
    It is very difficult to get an exact number of clusters and get the suboptimal
    segmentation. By tuning the parameters perfectly, the performance can be achieved
    up to a certain extent. Recent advancements in fuzzy clustering algorithms like
    FCMs clustering algorithms and their different variations like standard FCM, kernelized
    fuzzy c-means (KFCMs) clustering, and wavelet fuzzy c-means clustering algorithms
    [29] have improved the accuracy significantly by the assignment of the partial
    membership to different clusters. The wavelet FCMs clustering gives a satisfactory
    result over the standard FCM or KFCM [30]. The benefit of this technique is that
    we can deal with overlapping regions of the images. Fuzzy clustering enables better
    segmentation and categorization of image data by allowing a pixel to belong to
    multiple clusters with varying degrees of membership as opposed to the hard membership
    function. A fuzzy model has been developed by integrating fuzzy clustering techniques
    along with fuzzy neural network-based models for prediction. Rough fuzzy pattern
    recognition techniques or rough fuzzy clustering algorithm was introduced for
    clustering similar genes from microarray gene expression data and segmenting the
    brain magnetic resonance images. This is the generalized hybrid unsupervised learning
    algorithm called rough fuzzy possibilistic c-means algorithm that can give a generalization
    of all combinations of the c-means algorithm. The combined principle of the rough
    set and fuzzy set incorporates the probabilistic and the possibilistic memberships
    simultaneously where uncertainty, vagueness, and approximation can be dealt with
    in the rough set and the overlapping portion can be handled by the membership
    function of the fuzzy sets [31]. Pattern recognition is improved by modifying
    the objective function algorithm [32]. A fuzzy gravitational search algorithm
    has been introduced for automatic segmentation using brain magnetic resonance
    imaging (MRI) images [33, 34]. However, the parallel algorithm is introduced in
    FCMs for brain tumor segmentation on different MRI images which improves the computational
    time and is twice as fast as the conventional FCM [35]. The performance of the
    fuzzy clustering algorithm has been improved using the task pipeline concept in
    using compute unified device architecture technology by parallelly implementing
    the algorithm. The experimental results indicate 23.35 times boost in performance.
    The final segmentation is then achieved by applying the watershed algorithm [36,
    37].
