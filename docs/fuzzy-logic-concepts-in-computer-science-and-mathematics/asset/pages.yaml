  md: '# # CHAPTER 11


    # ## Tourist Attractiveness Assessment Using Fuzzy Set Interface (fsQCA) in Kolkata,
    West Bengal, India


    UDIT CHAWLA$^{1}$, RAMANDEEP KAUR$^{2}$, and DEVIKA MULCHANDANI$^{3}$


    +   * $^{1}$Department of Business Administration, Institute of Engineering and
    Management, School of University of Engineering and Management, Kolkata, West
    Bengal, India

    * $^{2}$University of Engineering and Management, Kolkata, West Bengal, India

    * $^{3}$The Calcutta Anglo Gujarati College, Kolkata, West Bengal, India


    # **ABSTRACT**


    The research’s objective is pertaining toward fuzzy-set qualitative comparative
    analysis (fsQCA) research on tourist attractiveness assessments in Kolkata is
    to thoroughly assess and comprehend the complex aspects that contribute toward
    the enticement and growth of tourism in this thriving and culturally diverse city.
    Kolkata, additionally known as the “City of Joy,” is a culturally important urban
    area with an established tourist sector. Through the creative vision of fsQCA,
    this study seeks to highlight the numerous factors that influence Kolkata’s attraction
    as a travel destination. The research being conducted aims to pinpoint the main
    factors that influence Kolkata’s tourist appeal. We may account for the inherent
    contradictions and complexity involved with tourism assessment by using fsQCA,
    which blends fuzzy-set logic and qualitative analysis. Through this research,
    we determine the complex causal connections between the variables. Through fsQCA,
    we may identify factors that are both essential and adequate to make Kolkata a
    desirable travel destination. To conclude, the tourism attractiveness'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'assessment utilizing fsQCA in Kolkata is a useful technique for separating
    the myriad variables that affect the city''s tourism industry. It advances academic
    understanding while also providing stakeholders with practical information they
    can use to make educated choices, thereby promoting sustainable tourist growth
    in Kolkata. Both the regional tourism industry as a whole and the local economy
    are anticipated to gain from this study.


    # **11.1 INTRODUCTION**


    A robust and virtually limitless reservoir of data, the Internet as a whole and
    particularly one of its amenities, the World Wide Web [2]. The widespread availability
    of Internet access has transformed the way people engage in activities related
    to travel and tourism [20]. The ability to reserve transport tickets, reserve
    lodging, arrange transfers to attractions, and other services was previously only
    available through a mediator; but today, anyone can do so on their own [39]. Everyone
    can work as their own travel agency by using services like vehicle rental, hotel
    reservations, ticket counters at museums and theme parks, and websites for airlines
    and railroads [43]. This has become possible through a trend known as electronic
    tourism, or e-tourism [33].


    The recent boom and expansion of the tourism industry has become a key factor
    in the development and growth of economies around the world, boosting job opportunities,
    foreign exchange profits, and infrastructural growth [27]. The Indian government
    recognizes the value of the tourist sector and its contribution to the country''s
    economic and cultural development of the many wonderful locations in India [3].
    E-tourism, or the use of technological advances in the tourist sector, has fundamentally
    changed how visitors discover and interact with their travel destinations [11].
    Kolkata, the vivacious “City of Joy,” remains no exception to this widespread
    trend. E-tourism has numerous advantages in Kolkata. It provides an exciting framework
    for highlighting its unique heritage of culture, historical sites, and variety
    of pleasures while allowing visitors to plan, schedule, and navigate their journeys
    with unmatched simplicity. E-tourism also improves connectivity because it reaches
    a worldwide audience, promotes local companies, and helps the economy by drawing
    more tourists [6].


    The need for stable facilities and safety precautions, a possible overdependence
    on technological advances, plus the necessity of preserving the true essence of
    the travel experience are a few of the difficulties that come with this digital
    revolution [18]. Nonetheless, there are certain difficulties that the Indian tourist
    industry must overcome, such as the requirement of greater'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'advertising and promotional efforts, an absence of standardization as well
    as quality regulation in certain regions, and limited facilities and services
    in other locations [25]. Additionally, disputes have been raised regarding the
    absence of customization and the decline of real human contacts in travel experiences
    due to a heavy dependence on Internet booking services [7].


    Besides these technological challenges, the creation and upkeep of the infrastructure
    pose an important concern. Even though Kolkata is home to many famous attractions,
    the city''s infrastructure, including its roadways, transportation system, and
    lodging options, frequently needs to be upgraded to keep up with the demands of
    visitors. The assessment and improvement of the town''s travel experience appeal
    is one of the issues that this thriving tourism business has brought about [15].
    Therefore, to draw in a wide variety of visitors, efficient tourism analysis is
    essential, both locally and globally [31].


    Despite the value of using classic methods to evaluate tourist attractions, modern
    study increasingly depends on cutting-edge and novel methodologies to comprehend
    the sophisticated dynamics of traveler choices along with decision-making processes
    [1]. The use of fuzzy-set qualitative comparative analysis (fsQCA), a technically
    advanced method for determining and analyzing tourist appeal, constitutes a similar
    inventive approach [5].


    With the use of a combination approach known as fsQCA, which integrates fuzzy
    set theory and qualitative comparative analysis, complicated and diverse factors
    can be understood in more detail [22]. It subsequently presents an in-depth study
    that highlights the elusive and complex character of individual desires and gives
    a more comprehensive viewpoint on the elements shaping tourist attractions [46].


    > **RQ1:** What are the factors that influence tourist satisfaction in tourism
    attractiveness assessment?


    This approach takes into account how numerous factors interact, including “perceived
    enjoyment,” “cultural heritage,” “trustworthiness,” “historical significance,”
    “accommodation and hospitality,” and overall “tourist satisfaction” by giving
    a thorough picture of how these factors influence tourists'' decision to visit
    a particular location. Through the analysis, we can obtain the factors that account
    for a necessary condition for providing tourist satisfaction and hence [44], these
    findings can then be used to influence strategic choices, policy creation, and
    marketing initiatives, ultimately resulting in the sustained development and growth
    of Kolkata''s tourist industry. It serves as a potent instrument that can direct
    the tourism sector in Kolkata in favor of an improved and analytical approach
    to comprehend and improve its visitor appeal [29]. This study aims to thoroughly
    evaluate'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'Kolkata’s tourism appeal using the cutting-edge fsQCA approach. By developing
    the approach for evaluating tourism attractions in a wider context, this study
    provides a crucial step toward maximizing Kolkata’s prospective as an attraction
    for travelers.


    # 11.2 LITERATURE REVIEW


    Analysis of many aspects that affect tourists’ decisions and experiences is necessary
    to gauge Kolkata’s tourist appeal, a city renowned for its dynamic culture and
    historic importance.


    # 11.2.1 PERCEIVED ENJOYMENT


    A key consideration for evaluating Kolkata’s tourism appeal is perceived enjoyment.
    The research draws attention to the ways that local food, cultural events, and
    leisure pursuits affect how much visitors think they are having fun [41]. The
    delicious eateries as well as authentic Bengali cuisine of the city of Kolkata,
    along with its dynamic culinary scene, greatly contribute to the culinary pleasure
    of visitors. Traveler contentment, return business, and favorable word-of-mouth
    are all influenced by perceived enjoyment, which is strongly linked to the whole
    experience [30]. In addition to influencing visitors’ happiness, perceived enjoyment
    also affects their propensity to return and refer other people to Kolkata [17].
    Kolkata’s distinct fusion of innovative and traditional elements, exemplified
    by its rich historic and creative legacy, cultivates an atmosphere conducive to
    subjective pleasure [4]. The vibrant dancing, literary, cultural, and artistic
    cultures of the city are widely recognized. Such aspects of culture enhance every
    aspect of the experience for tourists while also reflecting the cultural and intellectual
    significance associated with the city [35].


    Although tourists find great pleasure in Kolkata’s cultural and gastronomic attractions,
    maintaining and expanding these facets presents constant difficulties [47]. Likewise,
    overcommercialization of artistic performances may compromise their true meaning
    and lessen tourists’ enjoyment of them [12]. This method can uncover complicated
    combinations of factors that contribute to significant or lower reported satisfaction
    in the city by taking into account the inaccurate and convoluted character of
    tourists’ opinions and inclinations [10]. Moreover, it facilitates the identification
    of certain blends of situations and characteristics that are necessary to improve
    perceived'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'satisfaction by policymakers allowing them to adapt their objectives and efforts
    accordingly [21].


    # 11.2.2 CULTURAL HERITAGE


    The rich history and creative diversity of Kolkata are closely linked to its cultural
    legacy [9]. An important factor in drawing tourists to the city is its diverse
    array of cultural attractions, art, and literary works [13]. The town''s intellectual
    and cultural past is exhibited by significant sites including the Victoria Memorial,
    Tagore''s family house, the Marble Palace, and other traditional temples and cathedrals
    [14]. It is a complex responsibility for city officials and tourism organizations
    to maintain the equilibrium between conserving the authenticity of history and
    responding to the changing demands and desires of visitors [32]. This element,
    which is deeply integrated into the historical foundation of the city, has a significant
    impact on visitors'' experiences and level of enjoyment [8].


    Although there are sustainability and authenticity issues that need to be resolved,
    the use of fsQCA as a study methodology offers a more thorough and nuanced knowledge
    of the interactions between the various elements that affect how much cultural
    heritage is valued [24]. In conclusion, Kolkata''s cultural legacy should be preserved
    and effectively promoted in order to increase visitor pleasure and support the
    city''s sustained stability in tourism.


    # 11.2.3 TRUSTWORTHINESS


    From tourism''s framework, "trustworthiness" includes security, accuracy, reliability,
    and integrity. It is a critical component that influences travelers'' decision-making
    and general level of satisfaction [37]. This aspect affects a lot of people because
    travelers are looking for more reliable and safe travel experiences, which greatly
    increases their trust in a place [19]. In Kolkata''s tourism industry, perceptions
    of safety and reliability are strongly correlated [42]. The degree to which a
    city can guarantee visitors'' individual hygiene and security affects how confident
    travelers are in the location [23]. The dependability of services and public transit
    networks are important factors in establishing the city''s overall credibility
    [36]. When travelers believe Kolkata to be a reliable location, they are more
    inclined to relax and have fun while there.


    fsQCA offers a potential way to completely examine the significance of trustworthiness
    in Kolkata''s popular tourist sites [26]. Because these'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'impressions are ambiguous and multifaceted, fsQCA can identify complex patterns
    of factors that contribute to varying degrees of trustworthiness throughout the
    city [24]. This approach can be employed by policymakers to ascertain specific
    pairings of characteristics and circumstances that are imperative for augmenting
    trustworthiness, so serving as a roadmap for their policies and initiatives. This
    factor—which includes trustworthiness, security, honesty, and reliability—has
    an enormous effect on visitors'' overall impressions of the city and their level
    of satisfaction [38].


    # 11.2.4 HISTORICAL SIGNIFICANCE


    Travelers are drawn to Kolkata by its historical significance, which is intricately
    entwined with the story of India''s freedom movement and its status as a hub for
    creative and artistic pursuits [45]. The town is dedicated to several destinations
    that not merely represent historic importance but additionally provide a comprehensive
    experience to visitors. This chapter highlights the value of cultural excursions
    as ways for visitors to completely engage themselves in the rich history of the
    city. This historical account considerably boosts the city''s touristic attraction
    and generates a strong sense of community [40]. Kolkata''s cultural importance
    attracts many tourists, but maintaining and highlighting these historical features
    is a constant struggle [34]. It is a challenging effort for city officials and
    tourism stakeholders to strike a balance between maintaining the genuineness of
    the legacy and adjusting to the changing demands and standards of tourists [16].


    This element, which is intertwined with the city''s historical significance as
    well as its societal and artistic remarks, has a significant impact on visitors''
    perceptions of the city as well as their overall pleasure with it [28]. The inclusion
    of fsQCA as an investigation method has the possibility of delivering a more complex
    and thorough understanding of the interaction of elements impacting the appraisal
    of historical value, even though challenges connected to conservation and integrity
    must be addressed [26].


    # 11.2.5 HOSPITALITY AND ACCOMMODATION


    The warmth and high standard of service that the locals and the tourism sector
    provide to guests is referred to as hospitality [48]. It includes the warmth,
    politeness, and welcoming disposition of the locals in a place. Restaurants, bars,
    cafes, and other businesses that provide food and beverage services'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'are included in the hospitality sector [49]. Travelers'' experiences can be
    greatly improved by hospitable and friendly locals, who make them feel at ease
    and appreciated [50]. Travelers'' experiences can be greatly improved by hospitable
    and friendly locals, who make them feel at ease and appreciated [51]. The availability
    of housing and rental options for travelers is referred to as accommodation. These
    can include motels and resorts as well as cabins, hostels, and other lodging options
    [52]. By providing a location for travelers to relax and recharge, accommodations
    are essential in drawing in tourists [53]. Because they accommodate a range of
    tastes, spending limits, and vacation styles, the caliber and variety of lodging
    alternatives at a destination play a big role in determining a tourist''s decision
    to come [54].


    Together, lodging and hospitality contribute a vital part in the attraction of
    a place for tourists. They enhance visitors'' overall enjoyment and experience,
    increasing the likelihood that they will return or refer others to the location
    [55]. Superior amenities and an extensive selection of lodging choices can increase
    a place''s allure and competitiveness within the travel sector.


    # ### 11.3  RESEARCH METHODOLOGY


    An organized strategy is used in the research technique for data collection in
    the context of tourism attractiveness using fsQCA. To start, this study has been
    directed by well-defined research objectives. Important elements influencing the
    allure of tourism are determined, and travel locations or areas are chosen as
    Kolkata.


    Online reviews and statistical records were collected from TripAdvisor and MakemyTrip.
    A thorough framework for gathering data is created, outlining the characteristics
    of every component and the techniques for gathering data. To ensure accuracy,
    data is cleansed, checked, and calibrated as needed. Using the fsQCA software,
    an fsQCA is carried out, and the findings are evaluated to determine the configurations
    of conditions impacting the attractiveness of tourists. Results are presented
    with consideration for limitations to provide clarity on the elements influencing
    tourism attraction in the chosen locations.


