  md: '# 9.4 RESEARCH METHODOLOGY


    # 9.4.1 SELECTION OF ALTERNATIVES


    This chapter aims to present a proposal for a “MCDM” framework for assessing and
    comparing the financial performance of six oil companies listed on the National
    Stock Exchange (NSE) under the NIFTY index as of 16th August, 2023. The evaluation
    involves assigning a financial performance score and subsequent ranking to these
    oil companies. In Table 9.2, six oil companies scrip information is provided.


    # TABLE 9.2 Oil Companies (Alternatives) Scrip Info


    | SL. No | Oil Companies | NSE | BSE | ISIN Code* |

    | --- | --- | --- | --- | --- |

    | A01 | BPCL | BPCL | 500547 | IN E029401011 |

    | A02 | HPCL | HINDPETRO | 5000104 | IN E094401015 |

    | A03 | IOC | IOC | 530965 | IN E242401010 |

    | A04 | OIL | OIL | 533106 | IN E274J01014 |

    | A05 | ONGC | ONGC | 500312 | IN E213401029 |

    | A06 | Reliance | RELIANCE | 500325 | IN E002401018 |


    *An ISIN Code, or International Securities Identification Number, serves as a
    unique identifier for a particular securities offering. It is assigned by the
    National Numbering Agency of a given country to distinguish it from other financial
    instruments within that jurisdiction.


    # 9.4.2 SELECTION OF CRITERIA


    The nine financial ratios of six oil companies which have enlisted at NIFTY on
    16.08.2023 in NSE have been taken for six financial years, that is, FY 2017–2018,
    FY 2018–2019, FY 2019–2020, FY 2020–2021, FY 2021–2022, and FY 2022–2023.


    +   1. Sources of data: NSE website.


    +   2. Type of data: Secondary data.


    +   3. Period of study: 6 years (FY 2017–2018 to FY 2022–2023).


    +   4. Technique used: F-GTMA.


    Nine financial ratios were analyzed in this study. Among these, seven were identified
    as Beneficiary criteria, including Quick Ratio, Current Ratio, Return on Capital
    Employed, Return on Net Worth, Return on Total Assets,'
  merge: -1
  img_proc: true
