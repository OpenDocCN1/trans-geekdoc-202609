- pgno: 17
  md: '# Preface


    Fuzzy logic has become an important mathematical tool of the soft computing domain,
    which has vastly been applied to the field of computer science as well. The fuzzy-based
    decision structure has been used in many computer science domains with excellent
    results due to its tracking ability of vagueness. The fuzzy logic concept is versatile
    and can seek application in the allied engineering domains such as electrical,
    mechanical, electronics, civil, etc. The other social and economical fields are
    also being touched upon by the fuzzy concept with valuable outcomes.


    This current edited book caters to the fuzzy application to many interconnected
    and versatile domains with fruitful outcomes. The electric machine performance
    can be measured and estimated with the help of a fuzzy system. The tracking of
    the current path can be determined with great certainty. The concept of fuzzy
    logic has been substantiated in the present book on tuning of machines. The electrical
    machine extends to the mechanical attachment through the gear-box system where
    the fuzzy concept can be applied to enhance the performance mechanism of the device.


    The machine learning approach is also another category where the concept of fuzzy
    can be successfully applied. The bedrock of machine learning has been enhanced
    further with application of the soft computing aspect. The fuzzy system has become
    the altering tool for classification and categorization.


    Health science is also another promising field where a number of research works
    are going on. The concept of fuzzy has been applied with great success to produce
    more accuracy in the classification of medical data. The diagnosis operation of
    any patient can be carried out with the help of precision approaches of task selection
    and proper categorization of it. Fuzzy logic plays a major role in performing
    such operations.


    The current edited book also focuses on the variation of fuzzy logic schemes.
    The intuitionistic fuzzy logic concept has also played a major role in the field
    of mathematics. The main demerits of the fuzzy theory concept can better be understood
    by the concept of extension of fuzzy range and its utilization. The multicriteria
    decision-making aspect is also strongly connected to the fuzzy concept and has
    become the main focus area of this book.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Another important aspect of the fuzzy logic concept is its unique application
    of the concept to the industrial IoT for enhancing the smart manufacturing concept.
    The financial analysis is the main essence of share market or insurance data.
    The scientific and intelligent analysis of data can be easily done by the concept
    of fuzzy logic. Its financial impacts can also be seen in the giant companies.
    Control capability enhancement is a rudimentary part of any organization in its
    strategy making. The data is the basic component of the organization, can have
    a good impact on its overall transaction activities.


    The security aspect can also be included to some extent to the model. The application
    of fuzzy logic can help in the strategy making for any organization involving
    the data as an essential part. The tourism portal and its implementation strategies
    have also been implicated by the fuzzy means.


    Another crucial aspect of the fuzzy logic concerns the fuzzy controller-based
    greenhouse automation using sensor networks. The sensor is engaged in gathering
    data and information from the environment, which also provides responses to its
    variation.


    The fuzzy logic concept in the automotive industry is also prominent to provide
    the application of intelligence to the industries.


    Overall the present volume of the book, based on the fuzzy concept application,
    provides unique ideas about the rudimentary foundation of the subject and its
    versatile application to diversified fields of engineering. The presentation of
    the chapters with lucidity of the subject and smooth understanding is the key
    feature of this book. The in-depth research trends in the domain of fuzzy logic
    has become the main hotspot of such a book, which also renders much insights and
    knowledge to the readers comprising students, researchers, academicians, etc.
    This edited book also provides extra mileage in the fuzzy application in the near
    future for the engineering, medical, and even legal fields help to produce good
    and effective results.


    **—Editors**'
  merge: -1
  img_proc: true
