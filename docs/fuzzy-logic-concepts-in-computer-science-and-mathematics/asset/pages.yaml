  img_proc: true
- pgno: 112
  md: '# 7.3.2 IFS


    Atanassov [1], IFS is a generalization of FSs and is defined as


    $$A = \{<x, \phi_{A}(x), \psi_{A}(x)>|x \in X\}$$


    where, $\phi_{A}(x), \psi_{A}(x): X \rightarrow [0,1]$ are the membership and
    nonmembership function of $x \in X$ with $\pi_{A}(x)=1-\phi_{A}(x)-\psi_{A}(x)$
    as the intuitionistic index or hesitation index of $A$ in $A$.


    # 7.3.3 INTUITIONISTIC FUZZY VARIABLE


    For a time variable, $t$, $\zeta(t)=\left(\phi_{\zeta(t)}, \psi_{\zeta(t)}\right)$
    is called the intuitionistic fuzzy variable.


    In general, If $t = t_{1}, t_{2}, \ldots, t_{p}$, then $\zeta\left(t_{1}\right),
    \ldots, \zeta\left(t_{p}\right);\left(\phi_{\zeta\left(t_{i}\right)}, \psi_{\zeta\left(t_{i}\right)}\right)
    \in[0,1]$ be the intuitionistic fuzzy numbers (IFNs) collected at different periods.


    The concept was proposed by Xu and Yager [15].


    # 7.3.4 ITrFN


    Wang [13] applied the concept of ITrFN and defined as:


    Let $A$ be an IFS in $\Re$, whose membership and nonmembership functions are defined
    as follows:


    ![](img/e9de70cd491e84262133af63cb33d500_112_0.png)


    where, $0 \leq \phi_{A}+\psi_{A} \leq 1, \tilde{\phi}_{A}$ and $\tilde{\psi}_{A}$
    are maximum and minimum values, respectively, and $t_{1}, t_{2}, t_{3}, t_{4},
    t_{11}, t_{14} \in \Re$. Then $A$ is called ITrFN and is denoted by


    $$A=\langle\left([t_{1}, t_{2}, t_{3}, t_{4}] ; \phi_{A}\right),\left([t_{11},
    t_{2}, t_{3}, t_{14}] ; \psi_{A}\right)\rangle$$'
