  md: '# CHAPTER 14


    # Fuzzy Logic in Image Processing and

    Pattern Recognition


    MADHURIMA SEN^{1} and SAWATI BARMAN^{1,2}


    ^{1}University of Engineering and Management, Kolkata, West Bengal, India


    ^{2}Institute of Engineering and Management, Salt Lake, West Bengal, India


    # ABSTRACT


    Fuzzy logic is a problem-solving tool and a mathematical framework that deals
    with the logical reasoning of approximation rather than precision. In the last
    few years, classical image processing has faced difficulty dealing with real-world
    images containing noise and distortions due to their vagueness and uncertainty.
    So, this chapter explores the recent developments in image processing and pattern
    recognition by applying fuzzy logic. Furthemore, the integration of fuzzy logic
    along with machine learning algorithms and deep learning algorithms is explored
    and reported as a significant development in the field of image classification
    for target identification and classification in defense, object detection, medical
    image analysis, scenario recognition in video surveillance, and many other fields
    of applications. Finally, it concludes with areas for further advancement and
    the future scope of interest for research and development.


    # 14.1 INTRODUCTION


    An attempt to mimic human reasoning and decision-making ability becomes essential
    to incorporate mathematically, resulting in a logic system called fuzzy logic.
    Unlike Boolean logic, an infinite-valued logic was introduced'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'to deal with the object’s belongingness in different classes at the same time.
    To define belongingness, membership functions are introduced. It provides the
    machine an extra provision to make a decision based upon partial belongingness
    rather than complete belongingness. Especially for the image processing tasks,
    different kinds of vagueness and ambiguity in the images in the form of pixel
    value need to be processed in order to reach the final decision. Filtering out
    those things sometimes leads to the loss of essential information that is actually
    needed for the best decision-making. Fuzzy image processing introduces the fuzzy
    version of an image and processes it through the inference rule engine which has
    expert knowledge in the form of rules. After that, perform defuzzification to
    get the actual result. Apart from that, in the different steps of the image processing,
    the researchers use fuzzy logic to get the precise output from that step which
    again becomes the input for the next step. The neural network has incorporated
    fuzzy logic to enhance the power to solve complex problems in lack of expert knowledge.
    A hierarchical fuzzy logic system is organized into subsystems, each of which
    is further divided into fuzzy logic units that are connected hierarchically.


    Fuzzy logic is a mathematical tool dealing with uncertainty. It is the extension
    of the Boolean logic which only deals with 0 and 1 or true and false. It is the
    more generalized form of the crisp set theory that contains those objects having
    some properties for membership. On the other hand, a fuzzy set contains those
    objects that are imprecisely defined in varying degrees. For example, suppose
    I want to define a set of numbers between 16 to 19 either completely present or
    partially present in a particular group. So, the fuzzy set $a$ can be defined
    as


    ```

    $$A_f = \{(16,0.2), (17,0.1), (18,0.7), (19,1.0) \mid x \in X\}$$

    ```


    Here, $X$ is the universe of discourse of all positive integers.


    So, the fuzzy set is the set of ordered pairs of the element and its membership
    in the set $A$. The membership defines belongingness in a set. As opposed to that
    if this set is defined in crisp set, then it will be $A_c = \{19\}$. Because the
    crisp set contains the element with a hundred percent presence. In this way, fuzzy
    logic gives the provision to represent more information than the crisp set. Furthermore,
    suppose I ask a question: Is it cold today? The answer could be very cold, moderately
    cold, a little cold, or not at all. The fuzzy logic addresses the problem in a
    better way by representing it between 0 and 1 as opposed to only 0 or 1 in Boolean
    logic. This theory tries to mimic human reasoning for decision-making. Due to
    the ambiguity and uncertainty, real-world images containing noise and distortions
    have proven challenging for classical image processing to handle. Thus, using
    fuzzy logic, the latest advances in image processing and pattern recognition are
    investigated in the'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'different domains of application like agriculture, biomedical image analysis,
    and many more fields.


    # 14.2 HISTORY


    In the year 1920, fuzzy logic was studied by Lukasiewicz and Tarski as infinite-valued
    logic. In the year 1965, Zadeh introduced the fuzzy theory which allows partial
    membership [1]. In 1962, the decision-making process in pattern recognition was
    published by McMillan Press. In the year 1970, the fuzzy control system was developed.
    In the year 1973, a famous paper by Prof. Zadeh was published introducing an outline
    of an approach that could be used for decision-making and complex system analysis.
    In the year 1977, fuzzy logic in pattern recognition was implemented in the speech
    recognition and the speaker recognition problem. In the year 1980, the Fuzzy expert
    system was developed. In the later years of 1982 and onwards, The development
    of fuzzy (gray) image processing was introduced. In the year 1986, The fuzzy syntactic
    recognition approach was developed for various skeletal maturity identification
    from X-ray images of the radius and ulna of the wrist. In the late 1980s, neurofuzzy
    models were introduced for clustering, rule generation, classification, and feature
    selection that enable linguistic input accepted by the artificial neural network.
    During 1990\u20131994, rough sets and the genetic algorithm are used for large
    data mining. Besides, fuzzy logic was first applied in image processing tasks
    like noise reduction, edge detection, and image segmentation. After that, in the
    year 2020, fuzzy logic techniques were further developed and applied in medical
    image processing like brain disease prediction. In the next few years, fuzzy logic
    works for quality improvement of the images using fuzzy logic systems [2]. In
    accordance, effective unsupervised feature selection models as well as certain
    application-specific models, such as, fuzzy clustering networks for hardware realization
    and mixed category perception, were also developed. In the year 2023, fuzzy neural
    networks evolve and models to solve complex problems like cyber invasion and fraud
    detection in auctions using binary pattern classification tests.


    # 14.3 FUZZY LOGIC IN PATTERN RECOGNITION


    Pattern recognition is a big spectrum for the understanding of the different systems
    and working further in the application domain. Nowadays, all types of advanced
    machine learning methods and data analysis techniques'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'are busy understanding some sort of underlying hidden pattern that could immensely
    help to deep dive into the research along with the development of the new application
    domain for the betterment of mankind. Fuzzy logic in pattern recognition just
    stimulates the urge to search along with some more flexibility of belongingness.


    A subtle difference exists between pattern recognition and clustering in their
    goals. The clustering method aims to uncover the natural structures within the
    data without predefined classes or labels whereas pattern recognition aims to
    focus on identifying and categorizing data based on the predefined patterns or
    classes. So, clustering is all about exploring and grouping the data rather than
    identifying and categorizing data based on known patterns or classes. Pattern
    recognition in image processing is the process of identifying the pattern and
    the regularities of the image data automatically through the machine learning
    algorithm for data analysis. Through the process of pattern recognition, a machine-learning
    algorithm can recognize familiar and unfamiliar objects. So, pattern recognition
    plays a very crucial role in image processing. A pattern recognition system consists
    of three blocks that are feature space, measurement space, and decision space.
    As we know, a deficiency of information creates uncertainties in the system that
    could arise from contradictory, vague, unreliable, and ill-defined information
    in different stages of the pattern recognition system. The different stages of
    pattern recognition are varied from system to system to find useful patterns.
    The lack of precision or ambiguity can occur due to experimental error or limitation
    of the instrument or measurement can lead to vagueness in the measurement space.
    In the same way, Occasionally, it could be suitable and convenient to represent
    the input feature value in interval form, with one or both sides of the interval
    being ambiguous. The corresponding classes in the decision space might become
    unmanageable by becoming nonconvex, extended, and overlapping. That is the decision
    space can be affected to decide the 100% belongingness of a data point. However,
    in human perception, that could be fine if the data point has 90% membership of
    a class which represents partial belongingness. So, these all kinds of problems
    are addressed by the fuzzy logic in pattern recognition. Fuzzy logic in pattern
    recognition provides the capability to produce a classifier that can model overlapping
    class boundaries and generate linear or nonlinear boundaries. Fuzzy logic in pattern
    recognition was applied to speaker recognition and speech recognition problems
    in 1977. The characteristics of the speech depend on the health, age, sex, mind,
    and temperament of the speaker consisting certain amount of fuzziness and overlapping
    classes. So, For vowel sound recognition, classification analysis of the machine
    recognition using the fuzzy sets gives 82%accuracy based'
