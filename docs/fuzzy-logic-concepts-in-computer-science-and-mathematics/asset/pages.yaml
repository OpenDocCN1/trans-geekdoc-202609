    # 10.4 FUZZY LOGIC FUNDAMENTALS


    Fuzzy logic is a mathematical framework that extends classical Boolean logic to
    handle uncertainty and imprecision in decision-making. It was introduced'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'by Lotfi Zadeh in the 1960s and has since found applications in various fields,
    including control systems, AI, and decision support [4].


    # 10.4.1 LINGUISTIC VARIABLES AND FUZZY SETS


    +   1) *Linguistic variables:* Fuzzy logic introduces the concept of linguistic
    variables, which are variables whose values are expressed in linguistic terms
    rather than precise numerical values. For example, in the context of temperature
    control, a linguistic variable could be "temperature," and linguistic terms associated
    with it might include "cold," "warm," and "hot." Linguistic variables allow decision-makers
    to express their knowledge and preferences in a more human-like manner [2].

    2) *Fuzzy sets:* Fuzzy sets are a fundamental concept in fuzzy logic. Unlike traditional
    sets where an element either belongs to a set (membership = 1) or does not belong
    (membership = 0), fuzzy sets allow for partial membership. Each element has a
    membership value between 0 and 1, indicating the degree to which it belongs to
    the set. This partial membership accommodates uncertainty and vagueness in real-world
    data.


    # 10.4.2 MEMBERSHIP FUNCTIONS


    Membership functions define how elements relate to a fuzzy set. They assign a
    membership value to each element based on its degree of membership in the set.
    Membership functions can take various shapes, such as triangular, trapezoidal,
    or sigmoidal, depending on the nature of the linguistic term and the context.
    For example, a membership function for the linguistic term "warm" might have a
    triangular shape, peaking at the point where something is considered moderately
    warm [6].


    # 10.4.3 FUZZY INFERENCE SYSTEMS (FIS)


    FISs are the core of fuzzy logic-based decision-making. They consist of three
    main components:


    +   1) *Fuzzification:* In this step, crisp input values (numerical data) are
    converted into fuzzy values using appropriate membership functions. This process
    allows the model to handle imprecise input [30].'
