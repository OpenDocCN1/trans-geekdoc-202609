    # **Biswadip Basu Mallik, PhD**


    *Professor in Mathematics, Department of Basic Science and Humanities, Institute
    of Engineering & Management (School of University of Engineering and Management),
    Kolkata, West Bengal, India*


    Biswadip Basu Mallik, PhD, is currently a Professor of Mathematics in the Department
    of Basic Science & Humanities at the Institute of Engineering & Management (School
    of University of Engineering and Management), Kolkata, India. With 23 years of
    experience in teaching and research, he has published numerous research papers
    and book chapters in scientific journals from esteemed international publishers
    such as CRC Press, Apple Academic Press, Wiley, IGI Global, Springer, Nova Science,
    IEEE, etc. Dr. Basu Mallik has authored five undergraduate-level books on engineering
    mathematics, quantitative methods, and computational intelligence. He has also
    published five Indian patents and edited 21 books. His research interests include
    computational fluid dynamics, mathematical modeling, optimization, and machine
    learning. He serves as the Series Editor for the book series titled *Mathematics
    and Computer Science* from Wiley-Scribner, USA. He is the Managing Editor of the
    *Journal of Mathematical Sciences & Computational Mathematics* (JM SCM), USA.
    Additionally, Dr. Basu Mallik is an editorial board member and reviewer for several
    scientific journals. He holds a senior life membership in the Operational Research
    Society of India (ORSI) and life membership in the Calcutta Mathematical Society
    (CMS), Indian Statistical Institute (ISI), Indian Science Congress Association
    (ISCA), and the International Association of Engineers (IAENG).'
