  md: '# **7.3.5 DYNAMIC INTUITIONISTIC FUZZY WEIGHTED AVERAGING (DIFWA) OPERATOR**


    Xu and Yager [15], let $\zeta(t_1),\ldots,\zeta(t_q)$ be a collection of IFNs
    collected at $q$ different periods and $\tau$ be the weight vector of the periods
    $t_*$, then $DIFWA_{\tau(t)}$ $(\zeta(t_1),... ,\zeta(t_q)) = \tau(t_1)\zeta(t_2)
    \oplus ........ \oplus \tau(t_q)\zeta(t_q)$ is called DIFWA operator.


    $$\begin{gathered} DIFWA_{\tau(t)}(\zeta(t_1),...,\zeta(t_q)) \\ = \left(1-\prod_{k=1}^{q}(1-\phi_{\zeta(t_k)})^{\tau(t_k)},\prod_{k=1}^{q}\psi_{\zeta(t_k)}^{\tau(t_k)},
    \prod_{k=1}^{q}(1-\phi_{\zeta(t_k)})^{\tau(t_k)}-\prod_{k=1}^{q}\psi_{\zeta(t_k)}^{\tau(t_k)}
    \right) \end{gathered}$$


    where, $\tau(t_k) \geq 0 ; \sum_{k=1}^{q}\tau(t_k) = 1$


    In this chapter, information is taken in the form of ITrFN and decision- making
    is taking with the help of DIFWA operator.


    # **7.4 MAIN CONCEPT**


    The idea of MCDM has been used by many researchers to discuss real-life situations
    encountered in day-to-day life. In this chapter, an algorithmic approach of the
    DIFWA operator proposed by Xu and Yagar [15] has been discussed by taking information
    as ITrFN for the selection of a suitable site for the manufacturing plant under
    certain attributes. The attributes considered for the decision are given in the
    form of IFNs. A hypothetical case study has been developed to explain the algorithm.
    In this study, five factors have been considered that are responsible for the
    selection of a suitable site for the manufacturing plant and are given in Figure
    7.1.


