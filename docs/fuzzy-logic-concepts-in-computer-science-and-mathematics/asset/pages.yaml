    imprecise data and expert opinions when making investment decisions. Intuitionistic
    fuzzy models are developed for time series prediction related to finance [15]
    for simultaneously modeling the linear and nonlinear relationships in financial
    time series, making them useful for complex prediction problems.


    +   3. *Environmental management*: IFSs can accommodate the vagueness and hesitations
    when assessing environmental impact or risk. Adamu [1] proposed an application
    of IFS in environmental management to determine the type of erosion. A hybrid
