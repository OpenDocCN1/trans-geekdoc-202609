    # 3.2.4 FUZZY INFERENCE SYSTEMS


    FISs are computational models based on fuzzy logic that mimic human decision-making
    processes by incorporating uncertainty and imprecision. These systems use fuzzy
    sets, rules, and membership functions to make decisions or perform tasks in a
    way that is more flexible and human-like than traditional binary logic. FISs are
    widely used in control systems, decision support, pattern recognition, and AI.


    # 3.2.4.1 COMPONENTS OF A FUZZY INFERENCE SYSTEM


    # 3.2.4.1.1 Fuzzification


    In the fuzzification stage, crisp inputs are converted into fuzzy sets using membership
    functions. This step transforms quantitative input values into linguistic terms,
    such as “low,” “medium,” or “high.”


    # 3.2.4.1.2 Knowledge base (rule base)


    The knowledge base consists of a set of linguistic rules that relate the fuzzy
    input variables to the fuzzy output variables. These rules are often expressed
    in the form of “IF–THEN” statements and capture expert knowledge or domain-specific
    information. Each rule defines a relationship between input and output fuzzy sets.


    # 3.2.4.1.3 Inference engine


    The inference engine is the core of the FIS. It uses the fuzzy input values and
    the knowledge base to make inferences and determine the fuzzy output values. It
    employs fuzzy logic operators (AND, OR, NOT) to evaluate the rule antecedents
    and combine them to produce intermediate fuzzy values.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# 3.2.4.1.4 Fuzzy rule evaluation


    Each rule''s antecedent (IF part) is evaluated to determine its degree of truth
    based on the degree of membership of input variables. The degree of truth of a
    rule represents how strongly the rule applies to the current input values.


    # 3.2.4.1.5 Aggregation


    The results of multiple rules are aggregated to produce a combined output fuzzy
    set. Common aggregation methods include the max (maximum) operator, sum, and weighted
    average.


    # 3.2.4.1.6 Defuzzification


    In the defuzzification stage, the aggregated fuzzy output set is converted into
    a crisp output value. Various defuzzification methods can be used, such as the
    centroid method, which finds the center of mass of the aggregated output set.


    # 3.2.5 OPERATION OF A FUZZY INFERENCE SYSTEM


    # 3.2.5.1 INPUT FUZZIFICATION


    Crisp input values are mapped to fuzzy sets using membership functions. This step
    involves assigning membership degrees to each linguistic term based on the input
    values.


    # 3.2.5.2 RULE EVALUATION


    The fuzzy input values are matched to the antecedents of the fuzzy rules. Each
    rule''s degree of truth is calculated based on how well the input values match
    the rule''s conditions.


    # 3.2.5.3 INFERENCE


    The inference engine combines the rule outputs to form a fuzzy output set. This
    is done by applying fuzzy logic operators (AND, OR) to the rule consequences (THEN
    part) based on the degrees of truth of the rules.'
  merge: -1
  img_proc: true
