    # 6.2.2 PROPERTIES


    Let *A* and *B* be two IFSs. We define some operations and relations on *A* and
    *B* as follows:


    +   1) Inclusion: $A \subseteq B \leftrightarrow \mu_{A}(e) \le \mu_{B}(e)$ and
    $v_{A}(e) \ge v_{B}(e) \ \forall e \in U$

    2) Equality: $A = B \leftrightarrow \mu_{A}(e) = \mu_{B}(e)$ and $v_{A}(e) = v_{B}(e)
    \ \forall e \in U$

    3) Negation: $\overline{A} = \{ \langle e, v_{A}(e), \mu_{A}(e) \rangle | e \in
    U \}$

    4) Union: $A \cup B = \{ \langle e, max(\mu_{A}(e), \mu_{B}(e)), min(v_{A}(e),
    v_{B}(e)) \rangle ; e \in U \}$

    5) Intersection: $A \cap B = \{ \langle e, min(\mu_{A}(e), \mu_{B}(e)), max(v_{A}(e),
    v_{B}(e)) \rangle ; e \in U \}$

    6) Symmetric difference: $A \triangle B = \{ \langle e, max[ min(\mu_{A}, v_{B}),
    min(\mu_{B}, v_{A}) ], min[ max(v_{A}, \mu_{B}), max(v_{B}, \mu_{A}) ] \rangle
    ; e \in U \}$

    7) Cartesian Product: $A \times B = \{ \langle \mu_{A}(e)\mu_{B}(e), v_{A}(e)v_{B}(e)
    \rangle ; e \in U \}$


    # 6.3 APPLICATIONS IN MATHEMATICS


    # 6.3.1 ALGEBRAIC STRUCTURES


    There has been research on the lattice and algebraic structures of the IFSs [44].
    Additionally, there have been studies on the algebraic structures of IFSSs. One
    paper discusses the algebraic structures of complex IFSSs linked with groups and
    subgroups [33]. Another study demonstrates that the space of intuitionistic fuzzy
    values (IFVs), when equipped with a linear order determined by a score and accuracy
    function, exhibits a similar algebraic structure as the space generated by a linear
    order based on a similarity function and an accuracy function. Furthermore, this
    space is both a topological space and a lattice [41].'
