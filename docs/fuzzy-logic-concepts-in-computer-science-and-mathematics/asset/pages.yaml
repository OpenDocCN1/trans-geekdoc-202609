    # **6.4 APPLICATIONS IN DECISION-MAKING SYSTEMS**


    IFL and IFSs are often used in decision-making processes where decision-makers
    are uncertain about the belongingness degree of an element in a set. They provide
    a more flexible framework to represent and reason with uncertain information.


    # **6.4.1 MODELING HESITATIONS AND UNCERTAINTIES**


    IFSs are particularly suitable for situations where the decision-maker is not
    certain of the development of a particular condition, and where uncertain data
    needs to be modeled [29]. The nonmembership degree can be used to represent hesitation
    or uncertainty in decision-making [25]. IFSs have various applications in various
    fields, including multiattribute group decision-making [31], multiobjective optimization
    problems [12], and decision-making based on measure-based granular uncertainty
    [42].


    # **6.4.2 CASE STUDY: DECISION-MAKING IN SUPPLIER SELECTION FOR A MANUFACTURING
    COMPANY**


    # **Context**


    A manufacturing company must identify the best suppliers for its production operations.
    The organization must consider different factors like price, quality, reliability,
    and lead time. Management seeks to make a well-informed judgment considering the
    inherent uncertainty in the supplier selection process.


    # **Application of IFSs**


    +   1. *Evaluation of criteria:* The company’s procurement team assigns intuitionistic
    fuzzy values to the different criteria for every possible supplier.'
