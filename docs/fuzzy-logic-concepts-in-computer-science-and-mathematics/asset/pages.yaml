- pgno: 234
  md: 'Consequently, researchers often employ empirical or fitting formulas derived
    from measured data from a specific greenhouse. However, this approach needs to
    be revised in order to maintain the general applicability of the resulting greenhouse
    climate model. On the other hand, determining the controller gain is typically
    straightforward due to the prevalent linear characteristics of most actuators.
    For instance, the heat flux generated by the direct air heater exhibits a proportional
    relationship with the control signal. Consequently, the input–output dynamics
    of the actuator can be effectively captured by a linear model. Hence, in this
    particular scenario, ensuring the control performance and universality of the
    control methods emerges as a critical practical challenge. PID control has been
    identified as an effective approach to attain the desired outcome.


    To generate control signals for temperature, humidity, and soil moisture in the
    considered greenhouse, it is necessary to introduce three PID controllers. Each
    PID controller drives one output and generates one control signal. It is evident
    that the typical PID control technique cannot be simply applied to a system characterized
    by three inputs and three outputs. Hence, it is necessary to convert the system
    under consideration into an equivalent system with three outcomes.


    Tuning of PID controllers is another challenge to obtain optimum outputs. Traditional
    methods, such as the Ziegler–Nichols method, are widely employed, but it suffers
    from certain limitations and fails to deliver optimum outcomes. This work applies
    a meta-heuristic technique to obtain optimum controller gains. Particle swarm
    optimization is employed to tune the controller, and optimum gain parameters are
    obtained for temperature, soil moisture, and relative humidity control. The results
    are presented in Section 12.4.


    # 12.3.2 FUZZY LOGIC-BASED CONTROLLING MODEL


    Sensor networks are the backbone of greenhouse automation, providing real-time
    data on crucial parameters. Temperature, humidity, and soil moisture are monitored
    using advanced sensors. These sensors facilitate data-driven decision-making,
    enabling farmers to create ideal conditions for plant growth. Challenges, such
    as sensor calibration, data integration, and network reliability are addressed
    through robust sensor network architectures.


    Fuzzy logic control systems offer a unique methodology for handling imprecise
    and uncertain information. Fuzzy logic allows the representation of human knowledge
    and reasoning, making it well-suited for agricultural applications where precise
    mathematical models are often elusive. The components'
