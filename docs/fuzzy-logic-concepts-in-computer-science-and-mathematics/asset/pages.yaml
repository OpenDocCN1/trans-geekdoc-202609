    z_{i})}$. By Theorem 5.4.21, supp$(\tau)$ is a minimal IFT of $(\mathrm{T}\mathfrak{G}(\mathbb{H}_{\mathbb{G}}))^{(y_{i}
    z_{i})}$. Since every minimal IFT of $\mathrm{T}\mathfrak{G}(\mathbb{H}_{\mathbb{G}})$
    is elementary by minimal IFT definition the procedure terminates at $(y_{i}, z_{i})$-level
    & $\tau \in \mathrm{T}\mathfrak{G}(\mathrm{T}\mathfrak{G}(\mathbb{H}_{\mathbb{G}}))$.
    Hence $\mathbb{H}_{\mathbb{G}}^{(y_{i} z_{i})} \subseteq \mathrm{T}\mathfrak{G}(\mathrm{T}\mathfrak{G}(\mathbb{H}_{\mathbb{G}}))$
    which implies $\mathbb{H}_{\mathbb{G}}^{(y_{i} z_{i})} = \mathrm{T}\mathfrak{G}(\mathrm{T}\mathfrak{G}(\mathbb{H}_{\mathbb{G}}))$.


