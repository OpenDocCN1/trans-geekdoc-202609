  md: '# ## CHAPTER 7


    # # Applications of MCDM Aggregation Operator in the Selection of Suitable Site
    for the Manufacturing Plant


    VIJAY KUMAR, RAJENDER KUMAR, and DEEPAK KUMAR


    *Manav Rachna International Institute of Research & Studies, Faridabad, Haryana,
    India*


    # **ABSTRACT**


    The development of multicriteria decision-making (MCDM) techniques helps in the
    decision-making process and addresses many real-life problems. In this chapter,
    an intuitionistic fuzzy-based MCDM decision-making technique has been proposed
    for the selection of a suitable site for a manufacturing plant. Dynamic intuitionistic
    fuzzy weighted averaging operator has been used for decision-making under an intuitionistic
    fuzzy environment. The method is demonstrated by the help of a case study, comprised
    of the selection of suitable sites among the 11 sites on the basis of 5 factors
    and the opinion of 3 domain experts. The proposed model may help the decision
    makers to taking better decisions under uncertainty.


    # ### 7.1 INTRODUCTION


    To run a successful enterprise, site selection is very critical and depends on
    many factors including the type of plant, requirement of raw material, supply
    of furnished goods, etc. It is a very complex task that needs critical'
  merge: -1
  img_proc: true
- pgno: 110
  md: thinking and some unforeseen things that may happen during and after the establishment
    of a plant. Therefore, the factors that influence selection need to be identified
    first and a thorough intervention of domain experts is required for the suitable
    selection of a site. On the basis of the identified factors, domain experts provide
    the foundation knowledge required to select the optimal location. The generalization
    of fuzzy set (FS) theory helps in the development of decision support systems
    that allow decision-makers to tackle these problems. Real-life problems are uncertain
    in nature as they contain incomplete information that could be overlooked by human
    reasoning. These challenges attract researchers to do research in this discipline
    to develop handheld support systems to tackle the problems of vagueness. Generally,
    real-life situations are nondeterministic in nature and many challenges have been
    faced in outcome such situations, as these situations are not clearly defined.
    Zadeh [18] coined the concept of FSs, which is the generalized version of the
    classical set theory and has the potential to deal with uncertain situations.
    The intuitionistic fuzzy set (IFS) was proposed by Atanassov [1], which is the
    generalization of fuzzy theory, which is characterized by both membership and
    nonmembership grades. IFSs are the special version of FSs that describe fuzziness
    more comprehensively and have a variety of applications in real-life scenarios.
    The complexity of many problems may not be discussed through traditional methods
    unless uncertainty in these systems has been addressed precisely in some measurable
    way. FSs and their generalizations provide computational support to the problems
    at hand for dealing with the imprecision and uncertainty of human reasoning. The
    main feature of fuzzy theory is that it interprets verbal as well as linguistic
    information and describes them by simple rules. This factor is very much beneficial
    to establish relationships. Information can be gathered from various sources that
    contain some sort of uncertainty in it. Therefore, multiple factors are involved
    in the decision-making process to address real-life problems. Multi criteria decision-making
    (MCDM) problem is a trade-off between the set of alternatives and the evaluating
    factors in which a set of domain experts is involved in providing domain knowledge
    to establish some decision mechanism on the basis of certain performance indicators.
    Some approximation techniques have been developed by Krassimir [8] to address
    MCDM problems with fuzzy information. To deal with MCDM problems, Xu and Yager
    [14] developed certain aggregation operators in the IFS environment. In this chapter,
    the MCDM technique for the selection of a suitable site for the manufacturing
    plant has been discussed.
