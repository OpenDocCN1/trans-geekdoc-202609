- pgno: 115
  md: '**Step III:** Determine IF positive and negative ideals: IFPIS($\Phi^{+}$)
    and IFNIS ($\Phi^{-}$) from the alternatives $\theta_{i}$ as


    ```

    $$

    \delta(\theta_{i}, \Phi_{i}^{+}) = \sum_{j=1}^{m} \omega_{j} \delta\left(r_{ij},
    \Phi_{i}^{+}\right) = \sum_{j=1}^{m} \omega_{j}\left(1-\phi_{ij}\right)

    $$


    $

    \delta\left(\theta_{i}, \Phi_{i}^{-}\right) = \sum_{j=1}^{m} \omega_{j} \delta\left(r_{ij},
    \Phi_{i}^{-}\right) = \sum_{j=1}^{m} \omega_{j}\left(1-\psi_{ij}\right)

    $

    ```


    where, $r_{ij} = \left(\phi_{ij}, \psi_{ij}, \pi_{ij}\right)$


    **Step IV:** Calculate the closeness coefficient of each alternative:


    ```

    $

    C(\theta_{i}) = \frac{\delta(\theta_{i}, \Phi_{i}^{-})}{\delta(\theta_{i}, \Phi_{i}^{+})
    + \delta(\theta_{i}, \Phi_{i}^{-})}

    $


    Since, $\delta(\theta_{i}, \Phi_{i}^{+}) + \delta(\theta_{i}, \Phi_{i}^{-}) =
    \sum_{j=1}^{m} \omega_{j}(1+\pi_{ij})$

    ```


    ```

    $

    \therefore \quad C(\theta_{i}) = \frac{\sum_{j=1}^{m} \omega_{j}(1-\psi_{ij})}{\sum_{j=1}^{m}
    \omega_{j}(1+\pi_{ij})}

    $

    ```


    **Step V:** On the basis of closeness coefficients $C(\theta_{i})$, rank the alternative
    $\theta_{i}$. Greater the $C(\theta_{i})$, better the alternative.


    **Step VI:** End.


    # 7.4.2 EVALUATION OF CASE STUDY


    Let $MP_{i}$ ($i=1,2,\ldots,11$) be the available set of sites for the manufacturing
    plant. The selection of site for the plant can be identified on the basis of the
    certain factors $\Theta = (\theta_{1},\ldots,\theta_{5})$ as shown in Figure 7.1.
    Also, the decision for the final selection of site can be made by considering
    the inputs received from the three decision-makers as $D = \langle d_{1},d_{2},d_{3}\rangle$.
    Let $\tau(t) = \langle 0.16,0.33,0.5\rangle^{T}$ be the weight vector of the experts
    $t_{i}$ and $\omega(i) = \langle 0.1,0.15,0.2,0.25,0.3,0.4\rangle^{T}$ be the
    weight vector of the factors $\theta_{j}$ ($j=1,\ldots,5$). The decision for the
    selection of site for manufacturing plant among the available sites has been made
    on the basis of Algorithm 7.4.1. The opinion collected from various experts has
    been articulated in the form of IFNs and are given in Tables 7.1-7.3.


    The collective result received from the set of experts is presented in Table 7.4.'
