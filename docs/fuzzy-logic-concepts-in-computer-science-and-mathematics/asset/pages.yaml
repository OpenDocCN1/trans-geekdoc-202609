    # 6.2 FUNDAMENTALS OF IFS


    An IFS is a type of FS defined in the discourse domain where each member of the
    FS is denoted as a four tuple, consisting of the membership degree, nonmembership
    degree, and hesitation degree. The hesitation degree is a component of either
    the degree of membership or the nonmembership or both.


    # 6.2.1 DEFINITION


    IFS *A* in the domain of discourse, *U* is defined as a nonempty set of four-
    tuple elements, that is,


    *A* = { ⟨*e*, μₐ(*e*), πₐ(*e*), νₐ(*e*)⟩ | *e* ∈ *U* }, *e* ∈ *U*


    where the notation where the notation μₐ, πₐ, and νₐ denote the membership function
    μₐ: *U* → [0,1], hesitation function πₐ: *U* → [0,1], and nonmembership function
    νₐ: *U* → [0,1], respectively. Here, μₐ(*e*), πₐ(*e*), and νₐ(*e*) represent the
    membership degree, hesitation degree, and nonmembership degree of *e* ∈ *U*, respectively,
    to the IFS *A*. We can represent μₐ (membership), πₐ (nonmembership), and νₐ (hesitation)
    degrees with the help of the diagram shown in Figure 6.3.


    For every *e* ∈ *U*, μₐ(*e*) + πₐ(*e*) + νₐ(*e*) = 1, and 0 ≤ μₐ(*e*), πₐ(*e*),
    νₐ(*e*) ≤ 1. For example, if we know degrees of μₐ(*e*) and νₐ(*e*), we can calculate
    the degree of πₐ(*e*), that is, πₐ(*e*) = 1 μₐ(*e*) − νₐ(*e*) (*e* ∈ *U*).


    For our convenience, we may denote each element of the IFS *A* as a three- tuple
    element, that is, ⟨μₐ(*e*), πₐ(*e*), νₐ(*e*)⟩, and so the IFS *A* can be written
    as: *A* = {*tᵢ* | *tᵢ* = ⟨μₐ(*eᵢ*), πₐ(*eᵢ*), νₐ(*eᵢ*)⟩ & *eᵢ* ∈ *U*} or simply
    *A* = {*tᵢ* | *tᵢ* = ⟨μᵢ, πᵢ, νᵢ⟩} where μᵢ = μₐ(*eᵢ*), πᵢ = πₐ(*eᵢ*), and νᵢ
    = νₐ(*eᵢ*), ∀ *eᵢ* ∈ *U*.'
