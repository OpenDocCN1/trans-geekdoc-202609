  md: '# 14.8.5 REMOVAL OF FALSE POSITIVES


    Removal of false positive features in the post-processing is performed in such
    a manner that the true target features still remain. Removal of false positives
    in mammographic images in postprocessing is an important problem. In fuzzy logic-based
    false positive reduction, a fuzzy logic classifier assigns each region of interest
    into two values: one for the probability of being a true positive and another
    for the probability of being a false positive [38].


    Nonmaximum suppression is a standard postprocessing algorithm for merging all
    the detected objects in the same object. This algorithm is very simple and follows
    greedy clustering having a fixed distance threshold. This algorithm is used for
    making a tradeoff between the percentage of accurately identified positive cases
    relative to all positive cases, in reality, that is, recall, and the ratio of
    precisely categorized positive cases among all cases classified as positives,
    that is, precision [39]. Another method is to filter out detection below a certain
    level, that is, thresholding, geometric consistency checks the relationship between
    detected objects, and re-ranking using machine learning [40]. Two-stage postprocessing
    scheme which comprises the area-thresholding sieving and the morphological closing
    for object detection in wide-area aerial imagery is used [41].


    # 14.9 FUZZY LOGIC WITH NEURAL NETWORKS


    The neural network is a big interconnected network of simple processing elements
    aligned parallelly and has the capability of performing cooperative operations
    as well as making complex decisions. The huge connection among the neurons ensures
    that the system is fault tolerant irrespective of the presence of the noise and
    the component failure, but to handle the uncertainty and incorporate human reasoning,
    the fuzzy set-theoretic model is introduced along with them. As seen earlier,
    the design of the fuzzy rule-based system is the mandatory thing to express human
    knowledge in IF–THEN rules. The process consists of identifying and labeling the
    input and output variables, specifying the value range of each input and output
    variable, and specifying the member function to characterize the fuzzy sets. To
    carry out this process there already exists a general-purpose tool like fuzzy
    inference system professional that provides an interactive environment for designing
    and optimizing the fuzzy inference systems. But the flip side is that defining
    the rule-based system for image processing is'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'difficult to define manually. Furthermore, it models a simple process based
    on the qualitative model. For the complex process, defining and tuning the parameters
    are very time-consuming results limiting the incorporation of the fuzzy logic
    up to the field where domain expert knowledge is available. But we are interested
    in those fuzzy logic-based models, that can learn from the examples in case of
    lack of expert knowledge. Besides, a better version of the neural network gets
    introduced that exploits the advantages of linguistic information. So, neurofuzzy
    models are being proposed. It eventually reduces time and cost and enhances efficiency.
    An automatic microaneurysms detection method has been developed using deep learning
    along with fuzzy image processing in the retinal images [42]. Nowadays, neurofuzzy
    models have immense applications in the fields of agriculture, biomedical, and
    many more fields [43–45].


    # 14.10 HIERARCHICAL FUZZY LOGIC


    The studies have shown that the conventional fuzzy system has several limitations
    over the dimensionality of the data [46, 47]. This restricts it from solving large
    complex problems having large dimensionality of the data. So, hierarchical fuzzy
    systems have been introduced to solve the problem related to those huge dimensional
    data [48, 49]. The hierarchical fuzzy system can be classified into two categories:
    type 1 fuzzy hierarchical inference system where crisp membership function is
    defined [50] and type 2 fuzzy hierarchical inference system where fuzzy membership
    function is defined [51–54]. The segmentation of the brain tumor in the magnetic
    resonance images is performed by a hierarchical combination of fuzzy logic and
    cellular automata [55].


    The main difference between the hierarchical fuzzy logic and the neural network
    is that in the hierarchical fuzzy system, the system is divided into subsystems
    and each subsystem is divided into fuzzy logic units that are connected in a hierarchy
    form in the hierarchical fuzzy logic. The output of each subsystem is used as
    the input of the next subsystem and it reduces the overall complexity of the system
    by the reduced rule base. However, in the neurofuzzy modeling, the input set is
    used to design a fuzzy rule base for the IF-THEN statements and then the neural
    network is used to learn and optimize the fuzzy rule base with feedback connections.
    So, the application of these techniques can be used in different places depending
    upon their requirements where the tradeoff is made between cost and efficiency.'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# **14.11 SUMMARY**


    Fuzzy logic has its history dating back to 1920 and has been developed in many
    systems specifically fuzzy control systems, fuzzy expert systems, and fuzzy image
    processing. As we know, real-world images are ambiguous and unpredictable, traditional
    image processing has had trouble handling them when they contain noise and distortions.
    So, fuzzy set-based image processing is introduced and that consists of several
    steps, including fuzzification, membership function modification, and defuzzification.
    In this study, we broadly describe the different kinds of ambiguity and the uncertainty
    of the images. Different kinds of fuzzy filters are used for removing additive
    noise and impulse noise. Furthermore, the different study shows that low light
    enhancement and contrast enhancement can be performed through fuzzy logic in image
    processing. To automate the production chain in agriculture, a fuzzy system has
    been developed. The plant disease can be detected through fuzzy image processing.
    Traffic accident detection and hybrid character recognition model are proposed
    by the researcher by object identification and segmentation using fuzzy logic.
    The problem of multistage segmentation is removed by the improved version of the
    model following ant-colony optimization and fuzzy logic-based technique. The FCMs
    clustering and its different variations are efficiently deal with different overlapping
    regions of the images and very popular in biomedical image processing. Fuzzy-based
    postprocessing algorithm is developed that improves the efficiency. Fuzzy neural
    networks are introduced for those complex applications that are learned by themselves.
    Finally, the hierarchical fuzzy logic has been discussed which significantly speeds
    up the research in the biomedical fields using the type 1 and type 2 fuzzy logic.
    Fuzzy logic has immensely improved the classification phase of image processing.
    So, the implementation of fuzzy logic significantly advances image processing
    tasks.


    # **14.12 FUTURE WORK**


    The research is open to developing the new algorithm or implementing the existing
    technology to a suitable application that could be best fitted to achieve a perfect
    tradeoff between cost and efficiency. Furthermore, new technology could be developed
    for the existing problem domain or different real-life applications to provide
    a better solution that could be more sustainable for the future.'
