- pgno: 56
  md: '# 3.2.2.1    TRIANGULAR MEMBERSHIP FUNCTION


    The triangular membership function is defined by three parameters: the left boundary,
    the peak, and the right boundary.


    Example: Let us define a triangular membership function for the fuzzy set “tall”
    based on a person’s height in centimeters.


    Left boundary = 150 cm, peak = 165 cm, and right boundary = 175 cm.


    In this case, if a person’s height is 165 cm, their membership degree in the “tall”
    set would be 1. If their height is 150 cm, then the membership degree would be
    0. If their height is 175 cm, then the membership degree would be 0.5.


    # 3.2.2.2    TRAPEZOIDAL MEMBERSHIP FUNCTION


    A trapezoidal membership function has four parameters: the minimum, left shoulder,
    right shoulder, and maximum values. It represents a more gradual transition with
    a flat region in the middle.


    Example: Air conditioning control.


    In an air conditioning system, you might have a “comfortable temperature” fuzzy
    set. The trapezoidal membership function could have a minimum value of 20°C, a
    left shoulder at 22°C, a right shoulder at 26°C, and a maximum value of 28°C.
    A room temperature of 24°C would have a moderate membership degree.


    # 3.2.2.3    GAUSSIAN MEMBERSHIP FUNCTION


    The Gaussian membership function has a bell-shaped curve and is characterized
    by parameters for the mean (μ) and the standard deviation (σ). It is often used
    when there is uncertainty around a central value.


    Example: Height classification.


    “Tall” fuzzy set with a Gaussian membership function:


    μ = 180 cm (mean height).


    σ = 10 cm (standard deviation).


    This membership function represents the degree of “tallness” for individuals,
    with a peak at 180 cm and decreasing membership as heights deviate from the mean.'
