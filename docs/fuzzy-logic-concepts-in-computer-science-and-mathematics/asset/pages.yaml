    \leq 1$.


    **Definition 15.3. [4]** An IFS $\mathfrak{Q}$ in universe of discourse $\mathbb{A}$
    is defined as $\mathfrak{Q}=\{\langle\mathfrak{Q},\rho_{\mathfrak{Q}}(\mathfrak{Q}),\tilde{\mathcal{F}}_{\mathfrak{Q}}(\mathfrak{Q})\mid\mathfrak{Q}\in\mathbb{A}\}$
    where $\rho_{\mathfrak{Q}}(\mathfrak{Q}):(\mathbb{A})\rightarrow[0,1]$ and $\tilde{\mathcal{F}}_{\mathfrak{Q}}(\mathfrak{Q}):(\mathbb{A})\rightarrow[0,1]$.


    Where $\rho_{\mathfrak{Q}}(\mathfrak{Q})$ is the degree of membership and $\tilde{\mathcal{F}}_{\mathfrak{Q}}(\mathfrak{Q})$
    is the degree of nonmembership such that $0\leq\rho_{\mathfrak{Q}}(\mathfrak{Q})+\tilde{\mathcal{F}}_{\mathfrak{Q}}(\mathfrak{Q})\leq1$
    and $\omega_{\mathfrak{Q}}(\mathfrak{Q})=1-\rho_{\mathfrak{Q}}(\mathfrak{Q})-\tilde{\mathcal{F}}_{\mathfrak{Q}}(\mathfrak{Q})$
    where $\omega_{\mathfrak{Q}}(\mathfrak{Q})$ is called hesitancy.


    Then, the relation between the two IFSs can be stated as follows.


    +   1. $\mathfrak{Q}\subseteq\mathfrak{P}$ iff $\rho_{\mathfrak{Q}}(\mathfrak{Q})\leq\rho_{\mathfrak{P}}(\mathfrak{Q})$
    and $\tilde{\mathcal{F}}_{\mathfrak{Q}}(\mathfrak{Q})\geq\tilde{\mathcal{F}}_{\mathfrak{P}}(\mathfrak{Q})$
    for any $\mathfrak{Q}\in\mathbb{A}$.


    +   2. $\mathfrak{Q}=\mathfrak{P}$ iff $\rho_{\mathfrak{Q}}(\mathfrak{Q})=\rho_{\mathfrak{P}}(\mathfrak{Q})$
    and $\tilde{\mathcal{F}}_{\mathfrak{Q}}(\mathfrak{Q})=\tilde{\mathcal{F}}_{\mathfrak{P}}(\mathfrak{Q})$
    for any $\mathfrak{Q}\in\mathbb{A}$.


    +   3. $\bar{\mathfrak{Q}}=\{\langle\mathfrak{Q},\tilde{\mathcal{F}}_{\mathfrak{Q}}(\mathfrak{Q}),\rho_{\mathfrak{Q}}(\mathfrak{Q})\rangle:\mathfrak{Q}\in\mathbb{A}\}$


    +   4. $\mathfrak{Q}\cup\mathfrak{P}=\{\langle\mathfrak{Q},\max(\rho_{\mathfrak{Q}}(\mathfrak{Q}),\rho_{\mathfrak{P}}(\mathfrak{Q})),\min(\tilde{\mathcal{F}}_{\mathfrak{Q}}(\mathfrak{Q}),\tilde{\mathcal{F}}_{\mathfrak{P}}(\mathfrak{Q}))\rangle:\mathfrak{Q}\in\mathbb{A}\}$.


    +   5. $\mathfrak{Q}\cap\mathfrak{P}=\{\langle\mathfrak{Q},\min(\rho_{\mathfrak{Q}}(\mathfrak{Q}),\rho_{\mathfrak{P}}(\mathfrak{Q})),\max(\tilde{\mathcal{F}}_{\mathfrak{Q}}(\mathfrak{Q}),\tilde{\mathcal{F}}_{\mathfrak{P}}(\mathfrak{Q}))\rangle:\mathfrak{Q}\in\mathbb{A}\}$.


    **Definition 15.4.** Let $\mathfrak{Q}$ and $\mathfrak{P}$ be two IFS in $\mathbb{A}$
    then similarity measure $\tilde{S}(\mathfrak{Q},\mathfrak{P})$ between them is
    defined as follows.


    +   1. $0\leq\tilde{S}(\mathfrak{Q},\mathfrak{P})\leq1$.


    +   2. $\tilde{S}(\mathfrak{Q},\mathfrak{P})=1\Longleftrightarrow\mathfrak{Q}=\mathfrak{P}$.


    +   3. $\tilde{S}(\mathfrak{Q},\mathfrak{P})=\tilde{S}(\mathfrak{P},\mathfrak{Q})$.


    +   4. $\tilde{S}(\mathfrak{Q},\mathfrak{O})\leq\tilde{S}(\mathfrak{Q},\mathfrak{P})+\tilde{S}(\mathfrak{P},\mathfrak{O})$,
    where $\mathfrak{O}$ is an IFS in $\mathbb{A}$.


    **Definition 15.5.** Let $\mathfrak{Q}$ and $\mathfrak{P}$ be two IFS in $\mathbb{A}$
    then distance measure $\tilde{D}(\mathfrak{Q},\mathfrak{P})$ between them is defined
    as follows.


    +   1. $0\leq\tilde{D}(\mathfrak{Q},\mathfrak{P})\leq1$.


    +   2. $\tilde{D}(\mathfrak{Q},\mathfrak{P})=0\Longleftrightarrow\mathfrak{Q}=\mathfrak{P}$.


    +   3. $\tilde{D}(\mathfrak{Q},\mathfrak{P})=\tilde{D}(\mathfrak{P},\mathfrak{Q})$.


    +   4. $\tilde{D}(\mathfrak{Q},\mathfrak{O})\leq\tilde{D}(\mathfrak{Q},\mathfrak{P})+\tilde{D}(\mathfrak{P},\mathfrak{Q})$,
    where $\mathfrak{O}$ is an IFS in $\mathbb{A}$.


