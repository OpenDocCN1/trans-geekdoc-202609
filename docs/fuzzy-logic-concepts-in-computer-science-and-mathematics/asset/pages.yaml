    # ABSTRACT


    Fuzzy logic system is widely applied to many versatile engineering disciplines.
    The fuzzy inference system is the rule-based system, which can be applied to many
    types of control system where control capacity and mechanism are fully governed
    by the inference rule sets. The traditional system of power transmission is carried
    out either manually or automatically. The application of fuzzy logic systems helps
    in enhancement and smoothing of the transmission system. Continuously variable
    gearbox (CVT) is providing the number of gear ratios for the smooth and efficient
    delivery of power. Different application procedures toward the enhancement of
    transmission capability involve adaptive processes, shift control processes, load
    balancing processes, optimized energy recovery processes, etc. The concerned system
    is used to find the best and optimized parametric values represented by two variables
    $K_{p}$ and $T_{i}$ , needed to set up a special controller called the proportional-integral
    controller (or PI controller). This PI controller is used in mechanical systems
    to control the transmission of energy through CVT for'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'smooth functioning. The fuzzy controller possesses several extra features,
    all of which are geared toward improving the machine''s overall operational efficiency.
    This chapter provides a detailed overview of such optimization process based on
    the fuzzy logic concept.


    # **2.1 INTRODUCTION**


    A continuously variable gearbox (CVT) is a type of gearbox that is specifically
    employed in conventional internal combustion engine vehicles. The power consumption
    of the engine can be the important factor on which the engine efficiency depends
    a lot. Optimization of the engine''s power utilization can be minimized by means
    of the CVT. In contrast to conventional gearboxes that operate through discrete
    gear ratios (such as first gear and second gear), a continuously variable gearbox
    (CVT) possesses the ability to adjust the engine speed seamlessly and continuously
    in direct proportion to the rotational speed of the wheels. This facilitates the
    optimization of the engine''s power utilization. When one desires to drive in
    an inexpensive manner, it is possible to conserve fuel and mitigate pollution.
    Conversely, if one seeks to engage in sporty driving, it is feasible to optimize
    power output. A continuously variable gearbox (CVT) operates by the use of a belt
    that connects two pulleys, each having a cone-shaped structure. The dimensions
    of these pulleys exhibit variability, expanding as the cones approach one other
    and contracting as they move apart. The figure presented in Figure 2.1 elucidates
    the operational mechanisms of the subject matter. The appropriate amount of pressure
    must be exerted on the pulleys (Pp and Ps) in order to ensure the optimal functioning
    of the belt. In the event that the tension exceeds the recommended threshold,
    the belt may experience failure as a result of excessive friction and stress.
    Insufficient tension in the engine might impede power transmission to the wheels,
    perhaps resulting in belt disengagement from the pulleys and subsequent complications.
    The normal range of revolutions per minute (r.p.m.) for the engine is 1000 to
    4000. In order to regulate the pressures within the cylinders, a valve system
    is employed, which functions akin to a hydraulic amplifier. Additionally, a third
    pressure is employed in the context of a wet-plate clutch. The system is responsible
    for controlling three distinct components. This implies that the signals employed
    for the regulation of the continuously variable gearbox (CVT) exclusively rely
    on electrical means. The pressure levels for the 3nos. added valves are obtained
    from the central control system. The master control'
  merge: -1
  img_proc: true
