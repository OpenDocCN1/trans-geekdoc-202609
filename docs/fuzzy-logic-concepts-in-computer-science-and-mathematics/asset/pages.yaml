    # 12.2 LITERATURE REVIEW


    The rapid growth of the human population worldwide has impacted the environment,
    resulting in reduced greenery. This is necessitated for new technologies and innovation
    in agriculture and plant cultivation [1]. Greenhouses are utilized to cultivate
    plants to enhance crop productivity and guarantee optimal product quality. Greenhouse
    management and control are a complex undertaking due to the interdependence of
    numerous variables. The implementation of real-time monitoring and the utilization
    of intelligent approaches for control play crucial roles in optimizing the environmental
    conditions for plant growth [2]. The early consideration of subsystem interactions,
    such as heating systems, and component interactions, such as actuators and sensors,
    in the design phase of an autonomous greenhouse can facilitate the product development
    process due to its mechatronic nature. Taking this factor into account can undoubtedly
    expedite the design process, minimize the need for iterative revisions, and enhance
    the overall performance of the mechatronic system.


    In recent years, there has been a growing interest in applying sophisticated control
    techniques and associated tactics, including predictive control and adaptive control
    [3]. The concepts of optimum and compliant control have been proposed as potential
    approaches for controlling greenhouse environments. These studies are essential
    in using engineering principles in greenhouse production [4, 5]. Nevertheless,
    most of these methodologies are characterized by either intricate theoretical
    frameworks or practical challenges regarding their implementation in real-world
    greenhouse cultivation. Greenhouse environmental control systems commonly employ
    standard proportional, integral, and derivative (PID) controllers due to their
    straightforward design, implementation, and exceptional performance [6]. The majority,
    approximately 95%, of the regulatory controllers utilized in various industries,
    such as process control motor drives, automotive, flight control, and instrumentation,
    are structured according to the PID control mechanism. Despite the prevalence
    of their usage, the efficacy of PID controllers is frequently constrained due
    to inadequate tuning.


    Consequently, the efficient tuning of PID controllers remains an area of current
    investigation [7, 8]. The extant literature has introduced several tuning'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'strategies, including “guess-and-check” approaches such as trial and error,
    as well as methods rooted in linear control theory, such as Ziegler–Nichols and
    Cohen–Coon methods. However, attaining the desired performance of a controlled
    greenhouse via standard tuning methods poses challenges because of the need for
    appropriate analytical approaches for determining the ideal set of gain parameters
    [9–11].


    Recently metaheuristic techniques and nonlinear control systems for climate control
    in greenhouses have been implemented by engineers and researchers [12]. These
    approaches utilize FLCs to regulate the environmental parameters in greenhouses,
    such as temperature, humidity, and light intensity. This makes it easy for ordinary
    greenhouse workers to interact with the system because it could be more user-friendly,
    and it is simple to implement an FLC system. The work done by [13] focuses on
    using a fuzzy logic-based controller combined with a wireless communication system
    to control the climate of a greenhouse [14]. The authors integrate temperature,
    humidity, carbon dioxide levels, and illumination data into a fuzzy set, external
    meteorological variables, and user-defined set points.


    It is evident from the literature that wireless communication adds complexity
    to the design of autonomous greenhouses. Integrating fuzzy logic-based controllers
    with wireless communication systems based on platforms like ZigBee presents both
    opportunities and challenges in climate control. Implementing an FLC system can
    be complex and not user-friendly, as highlighted by the proposed intelligent variable
    control system for greenhouses, utilizing fuzzy logic and wireless information
    monitoring and providing real-time data access [15]. The proposed control system
    was experimentally validated and proved efficient in conserving water and power.


    The literature review also highlights the use of fuzzy logic in analyzing data
    gathered from sensors for decision-making in irrigation systems [16]. Moreover,
    fuzzy logic in greenhouses is not limited to climate control. Fuzzy logic has
    also been applied in various other aspects of greenhouse management, including
    crop yield prediction, pest and disease detection, and optimization of resource
    allocation. The literature review suggests that fuzzy logic-based controllers
    and wireless communication systems have been successfully implemented in greenhouse
    automation [17]. With the continuous advancements in technology, the integration
    of fuzzy logic-based controllers with wireless communication systems has significantly
    improved the automation and efficiency of greenhouses. Not only has it facilitated
    climate control, but it has also extended to various other aspects of greenhouse
    management, such as crop yield prediction, pest and disease detection, and resource
    allocation optimization.'
