    where


    **IV**: Let $\mathfrak{R}(t_k) = (r_{ij}(t_k))_{n\times m}$ be an IF decision
    matrix of the period $t_k$, where $r_{ij}(t_k) = \big(\phi_{r_{ij}}(t_k), \psi_{r_{ij}}(t_k),
    \pi_{r_{ij}}(t_k)\big); (i,j = 1, ..., n)$ is the attribute value defined in the
    form of IFN.


    **The steps of the algorithm are given as:**


    +   **Step I**: Using the DIFWA operator, defined in Section 7.3


    $$r_{ij} = DIFWA_{\zeta(t)} \left( r_{ij}(t_1), ..., r_{ij}(t_q) \right)$$


    $$= \left( 1-\prod_{k=1}^q (1-\phi_{r_{ij}}(t_k))^{\zeta(t_k)}, \prod_{k=1}^q
    \psi_{r_{ij}}(t_k)^{\zeta(t_k)}, \prod_{k=1}^q (1-\phi_{r_{ij}}(t_k))^{\zeta(t_k)}
    - \prod_{k=1}^q \psi_{r_{ij}}(t_k)^{\zeta(t_k)} \right)$$


    To aggregate all the IF decision matrix


    $$\mathfrak{R}(t_k) = (r_{ij}(t_k))_{m\times n}$$


    where, $r_{ij} = \big(\phi_{ij}, \psi_{ij}, \pi_{ij}\big)$; $\phi_{ij} = 1-\prod_{k=1}^{k=q}
    (1-\phi_{r_{ij}}(t_k))^{\zeta(t_k)}$; $\psi_{ij} = \prod_{k=1}^{k=q} \psi_{r_{ij}}(t_k)^{\zeta(t_k)}$.


    +   **Step II**: Let $\hat{\Phi}_i = (\hat{\Phi}_1,...,\hat{\Phi}_m)^T$ and $\bar{\Phi}_j
    = (\bar{\Phi}_1,...,\bar{\Phi}_m)^T$ be the IF positive and ideal solutions, respectively,
    where $\hat{\Phi}_j = \langle 0,1,0\rangle$ and $\bar{\Phi}_j = \langle 0,1,0\rangle$
    be the $m$ largest and $m$ smallest IFNs, respectively. Furthermore, let $\theta_i
    = (r_{i1},...,r_{im})^T$.'
