  md: '# **2.4 DESIGN OF CONTROLLER**


    The initial stage in the construction of the controller is the compensation of
    the nonlinearity, $f(V_{in}, N_{engine})$, using its inverse function, $\hat{f}^{-1}(V_{in},
    N_{engine})$. It can be observed that this technique is applicable as a result
    of the monotonic nature of the function $f(. , .)$. After obtaining the local
    linear models for various values of $T$ and $N_{engine}$, as well as the function
    $\hat{f}^{-1}(. , .)$, an optimization approach is employed to compute a suboptimal
    proportional-integral (PI) controller for the given operating point (Figure 2.5).
    The optimization''s cost function is specified as


    $$J(K_p, T_i) = \lambda M_p + (1 - \lambda) \int_0^{\infty} t (e^2(t) dt)^{1/2}
    \quad (2.1)$$


    where $K_p$ and $T_i$ represent the proportional gain and integral time of the
    PI controller, respectively. The value of $\lambda$ is equal to 0.5 and is utilized
    to quantify the significance of the O.S. in the cost function.


    ![](img/e9de70cd491e84262133af63cb33d500_46_0.png)


    **FIGURE 2.5** Generated parameters $P$ and $T_i$.'
