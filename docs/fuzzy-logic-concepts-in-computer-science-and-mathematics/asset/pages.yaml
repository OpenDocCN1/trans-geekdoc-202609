    # ### 14.5 FUZZIFICATION


    In the process of fuzzification, image data has transformed from a gray-level
    plane to a membership plane. So, the images can be represented in fuzzy logic.
    The fuzzification of the image can be done in two ways. First, without changing
    the pixel values, we represent an image as a collection of fuzzy singletons. Second,
    represents the property of darkness by introducing a fuzzy set that is determined
    by an appropriate membership function. The suitable member function that converts
    an image to a fuzzy image is called a fuzzifier. Suppose an image G of dimension
    ($M\times N$) with $L$ gray level is defined as the array of fuzzy singletons
    that can be defined as'
