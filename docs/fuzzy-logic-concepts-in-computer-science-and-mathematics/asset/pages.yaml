    # 2.2 SPECIFICATIONS OF PERFORMANCE


    The objective is to achieve the desired pressure at a reasonable timeframe, ideally
    between 60 to 70 ms, without exceeding the specified limits. The objective is
    to mitigate significant overshoots (O.S.) as they have the potential to induce
    excessive slackness in the belt, resulting in disengagement from the pulleys and
    potential damage to the system.'
