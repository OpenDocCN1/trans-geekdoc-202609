    # **14.4 GRAY IMAGE PROCESSING**


    Another fuzzy set theory application is gray image processing. As the image is
    gray, the segment, skeleton, edge and their relation have no precise definition
    makes it a suitable candidate for implementation of the fuzzy logic.


    As can be seen in Figure 14.1, the uncertainty or imperfection of the image can
    be represented in three ways. Grayness ambiguity is the uncertainty associated
    with the gray level or the intensity value of the pixels in an image whether the
    pixel value is considered as white or black. It is the kind of vagueness where
    the intensity of a pixel in an image appears to have poor color contrast or has
    imprecise boundaries. Geometric fuzziness in the images contains those images
    where boundaries, edges, and shapes are not very prominent. That means both the
    location of the pixels and the gray level characterize the geometry of the image
    subset. The uncleared boundaries, blurriness, and the multiple objects'' presence
    in the images are considered complex and ill data. Different types of operators
    like max and min operators, Zadeh''s contrast enhancement operator (INT), S &
    π membership functions, index of fuzziness, and entropy of fuzzy sets were used
    to develop an efficient algorithm to process the gray images and reduce the difficulty
    to decide the pixel is white or black, in turn, decrease the index of fuzziness
    and entropy. The best-segmented output of object extraction can be obtained from
    the minimized index of entropy and fuzziness. The degree of the fuzziness of an
    image can be defined using fuzziness measures that could be linear index, quadratic
    index, logarithmic fuzzy entropy, fuzzy entropy of r-order Yager''s measures,
    and hybrid entropy. The measure of fuzziness is used in many applications like
    thresholding.


    The whole task of image processing can also be visualized as low-level image processing,
    medium-level image processing, and high-level image processing. In low-level image
    processing, visualization of the images has been improved by some basic techniques
    like contrast enhancement [3], image smoothing, and edge detection. Apart from
    that, low light enhancement is another significant process for some image processing
    tasks, especially for color images. A significant study has shown that intuitionistic
    fuzzy sets along with histogram equalization outperform all the existing methods,
    such as, adaptive histogram equalization with limited contrast, histogram equalization,
    histogram specification, dynamic fuzzy histogram equalization preserving brightness,
    and discrete cosine transform (DCT)'
