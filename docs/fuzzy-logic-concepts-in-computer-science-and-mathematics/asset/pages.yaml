    # 12.3 PROPOSED METHOD


    # 12.3.1 PID-BASED CONTROLLER FOR GREENHOUSE CONTROL


    Figure 12.1 shows the greenhouse control system''s schematic diagram.


    ![](img/e9de70cd491e84262133af63cb33d500_233_0.png)


    The proposed scheme considers three factors, that is, temperature, humidity, and
    soil moisture. The design of greenhouse control necessitates a precise system
    model from the perspective of classical control theory. Nevertheless, acquiring
    such a model is a considerable challenge. One of the primary difficulties in greenhouse
    modeling lies in accurately representing the internal dynamics. This is due to
    the complex nature of these dynamics, which typically encompass many physical,
    chemical, and biological processes. Examples of such techniques include heat transfer
    between different components and the various physiological activities of crops,
    such as photosynthesis, transpiration, and respiration. The complexity inherent
    in these processes has resulted in a need for more understanding regarding many
    of their mechanisms.'
