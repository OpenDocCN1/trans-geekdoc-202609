  md: '# CHAPTER 15


    # Novel Distance-Similarity Measures for Intuitionistic Fuzzy Sets: A Comparative
    Analysis from Medical Diagnosis and Pattern Recognition Perspective


    MANSI BHATIA ${ }^{1}$, H. D. ARORA ${ }^{1}$, VIJAY KUMAR ${ }^{2}$, and ANJALI
    NAITHANI ${ }^{1}$


    ${ }^{1}$ Department of Mathematics, Amity Institute of Applied Sciences, Amity
    University, Noida, Uttar Pradesh, India


    ${ }^{2}$ Department of Mathematics, Manav Rachna International Institute of Research
    and Studies, Faridabad, Haryana, India


    # ABSTRACT


    The idea of intuitionistic fuzzy sets (IFS) represents a valuable expansion of
    the fuzzy set theory introduced by Atanassov, designed to effectively harness
    uncertainty. The concept of similarity and distance measure proves to be the best
    technique of dealing with modeling activities. While numerous measures are theoretically
    available, they lack precision and require enhancement to achieve improved results.
    In this chapter, we propose distance and its twin similarity measure based on
    IFS. Also, application like medical diagnosis and pattern recognition have been
    discussed and compared with existing measures. Different attributes are analyzed,
    and practical numerical cases are utilized to evaluate the measure''s trustworthiness.
    Comparative analysis show case the utility of the novel distance-similarity measure.
    The outcomes illustrate that the suggested measure can be trusted, is adaptable,
    and handles situations with uncertainty more effectively.'
