  md: 'The tracking error is denoted as


    ```

    $$e(t)=P_{\mathrm{ref}}(t)-P_{\mathrm{sec}}(t) \tag{2.2}$$

    ```


    represents the discrepancy between the preferred value and the secondary value
    at time $t$. The O.S., $M_{p}$ characterizes the maximum deviation of the output,
    $y(t)$. Mathematically, $M_{p}$ is defined as


    ```

    $$M_{p}=\max\{\max\{y(t)-1\}, 0\}. \tag{2.3}$$

    ```


    The use of the quasi-Newton approach to unconstrained multivariable optimization
    was demonstrated. The PI controller, which incorporates a collection of local
    PI controllers, can be mathematically expressed in continuous time as


    ```

    $$C(s)=K_{p}\left(T,N_{\text {engine }}\right)\left(1+\frac{1}{T_{i}\left(T,N_{\text
    {engine }}\right)^{s}}\right). \tag{2.4}$$

    ```


    In the context of discrete time, the expression can be written as


    ```

    $$C(z)=K_{p}\left(T,N_{\text {engine }}\right)\left(1+\frac{1}{T_{i}\left(T,N_{\text
    {engine }}\right)\left(1-z^{-1}\right)}\right). \tag{2.5}$$

    ```


    By employing this approach, all quantization effects are accounted for, resulting
