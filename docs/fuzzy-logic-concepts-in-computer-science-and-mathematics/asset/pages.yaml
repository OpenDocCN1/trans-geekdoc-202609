  md: '3)  *Expert system:* An expert system is developed to set the acceptable quality
    threshold. It considers historical data, industry standards, and expert knowledge
    to determine the acceptable range of quality scores. If a chip’s quality score
    falls outside this range, it is flagged as a potential issue.


    4)  *Automation:* The decision model and expert system work together in real-time.
    As each microchip is produced, its quality score is calculated and compared to
    the acceptable threshold. If a chip’s quality score is within the acceptable range,
    it continues through the production process. If it falls outside the range, the
    system can automatically make adjustments to the production parameters to correct
    the issue or trigger an alert for manual inspection.


    # *Mathematical example:*


    Suppose a microchip is produced with the following measurements:


    +   - Temperature ($T$) = 100°C

    - Voltage ($V$) = 5.2 V

    - Speed ($S$) = 800 units


    Using the quality formula:


    ```

    Q = 2T + 3V - 0.5S

    Q = 2(100) + 3(5.2) - 0.5(800) = 200 + 15.6 - 400 = -184.4

    ```


    The quality score for this microchip is -184.4. The expert system compares this
    score to the acceptable range, and if it falls outside, corrective actions are
    taken.


    In this way, decision models and expert systems enhance control capabilities by
    automating quality control processes, ensuring consistent product quality, and
    minimizing defects in manufacturing.


