  md: '# 7.2 LITERATURE REVIEW


    MCDM problems when taken up with fuzzy theory, provide strength to the concept.
    These problems are interdisciplinary and capture the attention of researchers
    to address the issue of multiple opinions under one situation. The domains of
    fuzzy as well as IF sets are discrete for dealing with imperfect and incomplete
    information. Wang and Zhang [9] explained MCDM problems by defining the expected
    values of the fuzzy information in the form of intuitionistic trapezoidal fuzzy
    number (ItrFN). Wang and Zhang [10], Guorong [5], and Wan and Dong [11] established
    certain aggregation operators by defining the expected values in ITrFN and investigated
    that aggregation operators work well in MCDM problems. To aggregate the information
    received from the domain experts, aggregation operators have been deployed to
    understand the priority. Wei[12]presented the generalization of aggregation operators
    proposed by Yager [16, 17] and developed some hesitant fuzzy aggregation operators.
    Fuzzy as well as IF-based MCDM models have been proposed by several researchers,
    such as, Chen and Hwang [3], Kacprzyk [7], Herrera [6], and Bordogna [2]. Researchers,
    such as, Chen and Hwang [3], Kacprzyk [7], Fodor and Runens [4], Herrera [6],
    and Bordogna [2] proposed certain fuzzy MCDM techniques. In this chapter, an aggregation
    operator DIFWG has been used for the selection of a suitable site for a manufacturing
    plant. The main objective of the work is to establish a decision support system
    that not only helps the decision-makers to take optimal decision but also provides
    some logical solutions. The given system gathered initial information from the
    three domain experts and performed the decision-making with the help of an algorithm
    to rank the sites.


    # 7.3 PRELIMINARIES


    Let X = {x₁,x₂,…xₙ} be a discrete universe of discourse. The following preliminaries
    are defined as


    # 7.3.1 FSS


    Zadehl [18] defined FSs as: A FS A is defined as: A = {< x,φₐ(x) > : x ∈ X} where,
    φₐ : X →[0,1] and φₐ(x) be the membership function and membership grade, respectively,
    of x ∈ X in A.


    It is the generalization of the classical notion of set.'
