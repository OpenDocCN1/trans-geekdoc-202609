  img_proc: true
- pgno: 57
  md: '# #### 3.2.2.4 SIGMOIDAL (S-SHAPED) MEMBERSHIP FUNCTION


    The sigmoidal membership function resembles an “S” shape and is often used for
    variables with gradual transitions between membership degrees.


    Example: In the context of “customer satisfaction,” you might use a sigmoidal
    membership function to capture the transition from “dissatisfied” to “satisfied.”
    As satisfaction ratings increase, the membership degree gradually increases.


    # ### 3.2.3 FUZZY LOGIC OPERATORS


    Fuzzy logic operators are fundamental components of fuzzy logic that allow for
    the manipulation of fuzzy sets and reasoning with uncertain or imprecise information.
    Fuzzy logic operators are analogous to the logical operators (AND, OR, NOT) in
    classical (Boolean) logic but are adapted to handle degrees of membership rather
    than binary true/false values.


    # #### 3.2.3.1 FUZZY AND (MIN OPERATOR)


    The fuzzy AND operator computes the minimum of the membership degrees of two or
    more fuzzy sets. It represents the degree to which all conditions are simultaneously
    true.


    Example: If you have two fuzzy sets, “tall” with a membership degree of 0.6 and
    “slim” with a membership degree of 0.7, then the fuzzy AND operation yields a
    membership degree of 0.6 [min(0.6, 0.7)] for the intersection of “tall” and “slim.”


    # #### 3.2.3.2 FUZZY OR (MAX OPERATOR)


    The fuzzy OR operator computes the maximum of the membership degrees of two or
    more fuzzy sets. It represents the degree to which any one of the conditions is
    true.


    Example: If you have two fuzzy sets, “high” with a membership degree of 0.8 and
    “Medium” with a membership degree of 0.6, the fuzzy OR operation yields a membership
    degree of 0.8 [max(0.8, 0.6)] for the union of “high” and “medium.”'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# 3.2.3.3 FUZZY NOT (COMPLEMENT OPERATOR)


    The fuzzy NOT operator computes the complement of the membership degree of a fuzzy
    set. It represents the degree to which a condition is not true.


    Example: If you have a fuzzy set “not very hot” with a membership degree of 0.3,
    the fuzzy NOT operation yields a membership degree of 0.7 (1−0.3) for the condition
    “not very hot.”


    # 3.2.3.4 FUZZY IMPLICATION OPERATORS


    Fuzzy implication operators are used in fuzzy rule-based systems to determine
    the strength of an implication (consequent) based on the truth value of an antecedent
    condition.


    Examples of fuzzy implication operators include the Mamdani implication and the
    Larsen implication.


    # 3.2.3.5 FUZZY AGGREGATION OPERATORS


    Fuzzy aggregation operators are used to combine the outputs of multiple fuzzy
    rules in a FIS. Common aggregation operators include the max (maximum), sum, and
    weighted average operators.


    # 3.2.3.6 FUZZY T-NORM AND T-CONORM OPERATORS


    T-norm (t-normative) and t-conorm (t-conormative) operators are used to compute
    the intersection and union of fuzzy sets, respectively. Popular t-norm operators
    include the min and product operators, while common t-conorm operators include
    the max and probabilistic sum operators.


    # 3.2.3.7 FUZZY COMPARISON OPERATORS


    Fuzzy comparison operators are used to compare two fuzzy numbers or sets and determine
    their relationship, such as equality, dominance, or intersection.


    These fuzzy logic operators allow for a more flexible and nuanced representation
    of uncertainty and imprecision in decision-making and modeling.'
