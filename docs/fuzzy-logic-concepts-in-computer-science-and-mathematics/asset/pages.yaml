  md: '# # 6.1 INTRODUCTION


    # ## 6.1.1 BACKGROUND OF FUZZY LOGIC AND INTUITIONISTIC FUZZY SETS (IFS)


    Zadeh [46] introduced the concept of fuzzy sets (FS) in the 20th century to deal
    with uncertain and imprecise data. The conventional logic understood by the computer
    is strictly binary, whereas fuzzy logic is multivalued logic taking intermediate
    values between [0,1] where 0 and 1 are extreme cases. Basically, the FS provides
    partial membership, that is, the members of the set could have varying degrees
    of membership. As a result, Zadeh considered classes of objects having relative
    concepts that are expressed in natural languages, such as, weight, color, age,
    size, height, and temperature.


    The IFS proposed by Atanassov [7] in the 1980s is a generalization of classical
    FS where each element of the set has degrees of membership, nonmembership, and
    hesitatio n. It was designed to enhance the ability of F Ss to better capture
    uncertainty and vagueness in decision-making and reasoning processes.


    During the initial two decades of their establishment, Atanassov [8] and a small
    group of researchers associated with him made advancements in IFSs. Their work
    focused predominantly on the mathematical logic and mathematics underlying the
    concept, particularly in the areas of analysis, algebra, geometry, and related
    fields. Subsequently, there has been a notable shift in the landscape due to advancements
    in information technology and decision science. There has been a substantial surge
    in the utility of IFSs, with many research papers being published each year in
    prestigious journals and conferences across the disciplines of mathematics and
    other fields. The community of theoretical researchers is expanding, along with
    the group of practitioners applying the theoretically created notion in various
    fields such as medicine, expert and control systems, industry, economics, artificial
    intel- ligence, and others.


    After the FSs were introduced, many researchers worked to advance the sets arising
    from the extensions of FSs. The relationship among the FSs and their extensions
    has been illustrated in Figure 6.1.


    IFSs, a concept that emerged ahead of its time, now provide us with vital tools
    to manage intrinsic uncertainty and impreciseness. Figure 6.2 shows the development
    and expansion of the FSs.'
