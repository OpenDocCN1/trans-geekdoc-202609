    is a minimal IFT of $(\mathrm{T}\mathfrak{G}(\mathbb{H}_{\mathbb{G}}))^{(y_{i}
    z_{i})}$. It is obvious that supp$(\tau)$ is a hyperedge of $\mathbb{H}_{\mathbb{G}}^{(y_{i}
    z_{i})}$. Hence $\tau$ is a hyperedge of $\mathbb{H}_{\mathbb{G}}^{(y_{i} z_{i})}$.


    **Theorem 5.4.22.** Let $\mathbb{H}_{\mathbb{G}}=(U, \mathcal{E}; s_{1}, s_{2})$
    be an IFTHG with $\mathbb{H}_{\mathbb{G}}^{(y_{i} z_{i})}$ is a simple. Then $\mathrm{T}\mathfrak{G}(\mathrm{T}\mathfrak{G}(\mathbb{H}_{\mathbb{G}}))=\mathbb{H}_{\mathbb{G}}^{(y_{i}
