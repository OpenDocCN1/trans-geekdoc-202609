  md: '# **15.1 INTRODUCTION**


    Decision-making is the skill of selecting the most favorable course of action
    from a range of options, leading to success for either an individual or an organization.
    It is not a one-step process and requires careful understanding of the preferences
    which leads to the better functioning of the organization. In our everyday experiences,
    we encounter situations that demand effective decision-making. This skill finds
    application in diverse fields, such as healthcare diagnostics, identifying patterns,
    business management, and economics. Formulating a decision can often be a complex
    process, entangled in uncertainties and scenarios that do not neatly fit into
    binary “yes” or “no” resolutions. Zadeh [1] realizes this problem and extended
    Cantor’s classical set theory to the theory of fuzzy sets. In this theory, Zadeh
    highlighted that the extent of belongingness does not always fall strictly into
    a “yes” or “no” category; rather, there exists considerable ambiguity or fuzziness
    in between these definitive states. To simplify and take in account the concerned
    problem, Zadeh formulated $\varphi(a)$ where $\varphi(a) \in [0, 1]$ and is known
    as degree of membership. It was realized later that the degree of nonmembership
    is not always equal to $1 - \text{degree of membership}$ as sometimes vagueness
    is present. To overcome this problem Atanassov [2, 3] proposed intuitionistic
    fuzzy sets in which hesitancy is also included and can be stated as $\varphi(a)
    + \tilde{\varphi}(a) \leq 1$, where $\tilde{\varphi}(a)$ is degree of nonmembership
    and also stated operations that are defined over IFS.


    After its formulation it quickly seized the attention of many researchers who
    used IFS as a tool in various fields like medical diagnosis, pattern recognition,
    image segmentation, clustering, etc. De et al. [4] applied IFS to medical diagnosis,
    Li and Cheng [5] used IFS as a tool for pattern recognition, Xu [6] smeared it
    in multicriteria decision-making and Xu et al. [7] extended its application in
    cluster analysis. Some correlation measures have also been proposed with the help
    of IFS in diverse fields like Thao [8, 9] correlated it in pattern recognition
    and later in medical diagnosis. Ejegwa and Oyenke [10] applied it to various multi-criteria
    decision-making (MCDM) problems.


    The concept of IFS was used extensively with distance and similarity measures
    as it serves as a means to be a reasonable source of information. Distance measures
    are used to find the distance between two fuzzy sets whereas similarity measures
    are used to find the closeness among them. Burillo and Bustince [11] coined the
    notion of distance with IFS. Szmidt and Kacprzyk [12] extended the work further
    by using all three parameters constituting IFS for calculating distance. Wang
    and Xin [13] discussed'
  merge: -1
  img_proc: true
