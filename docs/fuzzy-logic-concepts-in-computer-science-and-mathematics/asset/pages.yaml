  md: '![](img/e9de70cd491e84262133af63cb33d500_8_0.png)


    # ## Rashmi Singh, PhD


    Rashmi Singh, PhD, is a distinguished Professor in the Department of Mathematics
    at the Amity Institute of Applied Sciences, Amity University Uttar Pradesh, Noida,
    India. With 22 years of experience in academia and research, her expertise lies
    in nearness-like structures and near set theory, soft set theory, rough set theory,
    fuzzy subset theory, general topology, and the mathematics of artificial intelligence
    and machine learning (AI-ML). Dr. Singh earned her PhD in "Merotopic Structures
    in Fuzzy Subset Theory" from the prestigious University of Allahabad, Uttar Pradesh,
    India. Since 2001, she has been deeply involved in research, contributing significantly
    to her fields of interest. She also served as a research assistant at the Allahabad
    Mathematical Society from 2002 to 2005. Over her academic career, Dr. Singh has
    taught both postgraduate and undergraduate students, impacting the lives of learners
    for over 20 years. She has supervised four PhD candidates and guided more than
    30 Masters and undergraduate students in their research. Her scholarly contributions
    include over 35 published research articles in reputed national and international
    journals. She is an active member of numerous professional bodies, including the
    Indian Science Congress Association, Indian Academy of Physical Sciences, Indian
    Mathematical Society, American Mathematical Society, IAENG, ACM, and the Allahabad
    Mathematical Society, among others. Dr. Singh’s leadership roles extend beyond
    teaching and research, as she serves as an editor and reviewer for a variety of
    peer-reviewed national and international journals. Currently, she is a guest editor
    for special issues of IEEE Transactions on Consumer Electronics and Measurement
    Sensors. In addition to her academic roles, Dr. Singh is a member of the NextGen
    Wearables Hub under the Meerut ACM Professional Chapter. She also co-edits the
    Fuzzy Theory Frontier series for Jenny Stanford Publishing (Taylor & Francis),
    demonstrating her continued dedication to fostering academic excellence and innovative
    research in her field.'
