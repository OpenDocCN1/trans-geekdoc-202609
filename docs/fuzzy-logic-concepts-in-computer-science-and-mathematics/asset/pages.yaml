    # **15.1.1 RESEARCH GAP**


    At the forefront are various similarity and distance measures rooted in IFS, yet
    these methods confront inherent limitations demanding careful consideration and
    improvement. The measures proposed by Li et al. [5] and Ye [27] take into consideration
    only two parameters of IFS thus not utilizing its use fully. Further, trigonometric
    measures help in further enhancing the decision-making and overcoming the drawbacks.
    The cosine similarity measures in vector space have some drawbacks which lead
    to unreasonable results. The cotangent similarity measures help to overcome the
    drawbacks and show its decision-making capability in various fields.


    This chapter introduces a cosine similarity measure, akin to the cotangent measure,
    demonstrating enhanced flexibility and efficiency in decision-making, establishing
    itself as a valuable tool in this context. The chapter also shows the applications
    of measures in pattern recognition and medical diagnosis, but not limited to this
    to demonstrate its use in decision-making process.


    To fulfill the purpose, the chapter is structured as: Section 15.2 takes us through
    the fundamentals of the article. Section 15.3 is dedicated to distance--similarity
    measure. Section 15.4 shows the numerical illustrations of the measures and Section
    15.5 studies its real-life applications. Section 15.6 compares it with work done
    by other authors to show the novelty of the measure. Section 15.7 concludes the
    chapter with references.


    # **15.2 PRELIMINARIES**


    Before going through the new measures we need to revisit some of the existing
    definitions.


    Definition 15.1. [1] Let 𝕀 be a fuzzy set in A then 𝕀 = {α, ϕ𝕀(α) | α ∈ A} where
    ϕ𝕀(α): A → [0, 1] Where ϕ𝕀(α) is the degree of membership of 𝕀.


    Definition 15.2. [2] Let 𝕀 be intuitionistic fuzzy set 𝕀 in A then 𝕀 = {α, ϕ𝕀(α),
    𝕀𝕀(α) | α ∈ A} where ϕ𝕀(α): A → [0, 1] and 𝕀𝕀(α): A → [0, 1].'
