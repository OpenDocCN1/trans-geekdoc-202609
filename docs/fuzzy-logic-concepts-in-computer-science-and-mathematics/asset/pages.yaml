  md: '# CHAPTER 1


    # Enhancing Electrical Machine Performance

    Through Fuzzy Logic Control


    FEZAZI OMAR1, AYAD AHMED NOUR EL ISLAM2, and

    BISWADIP BASU MALLIK3


    *1 Laboratory (Intelligent Control & Electrical Power Systems),

    Djillali Liabes University, Sidi Bel-Abbes, Algeria*


    *2 Kasdi Merbah University Ouargla, Ouargla, Algeria*


    *3 Department of Basic Science and Humanities, Institute of Engineering

    & Management (School of University of Engineering and Management),

    Kolkata, West Bengal, India*


    # ABSTRACT


    This chapter explores the application of fuzzy logic in improving the

    performance and control of electrical machines, particularly direct current

