  md: '# 1.2 FUZZY LOGIC VERSUS CRISP LOGIC EXAMPLE: SPEED CONTROL OF A MOTOR


    Consider the scenario of controlling the speed of a motor in an industrial setting.
    The goal is to modify the motor''s speed in response to the received input signals.


    # 1.2.1 CRISP LOGIC APPROACH


    The approach of expressing motor speed using crisp values, as shown in Figure
    1.1, has its limitations. Classifying speed into discrete ranges, such as less
    than 50 rad/s, between 50 and 100 rad/s, and so on, can lead to ambiguities and
    problems, especially when the speed falls in between these defined crisp values.
    This method proves weak when dealing with industrial applications where precision
    and fuzziness are crucial. Instances where motor speeds turn around critical points
    like 50 or 100 rad/s might pose challenges, potentially causing issues in industrial
    operations. Consequently, Because of this approach''s lack of precision in representing
    speeds within these ranges, more complex and exact control strategies—like fuzzy
    logic—are required to address these complexities and guarantee optimal performance
    in industrial settings.


    ![](img/e9de70cd491e84262133af63cb33d500_21_0.png)


    FIGURE 1.1 Crisp logic A motor speed control.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# 1.2.2  FUZZY LOGIC APPROACH


    The fuzzy logic approach provides a more natural and realistic representation
    of motor speed. By defining linguistic fuzzy variables like “low speed,” “medium
    speed,” and “high speed” based on specific speed ranges, such as 0 to 50 rad/s,
    50 to 100 rad/s, and 100 to 150 rad/s shown in Figure 1.2, the system gains a
    complex understanding of motor behavior. Each linguistic variable involves a percentage
    value calculated from the given speed range. For example, a speed of 75 rad/s
    can be interpreted as 50% medium speed and 50% slow. This approach enables more
    precise and nuanced control decisions by capturing the inherent imprecision and
    uncertainty in real-world scenarios. Using fuzzy logic to represent ranges of
    variables provides a flexible and adaptable configuration, ensuring a more natural
    and reliable control mechanism for industrial applications [3, 4].


    ![](img/e9de70cd491e84262133af63cb33d500_22_0.png)


    More than this is the fuzzy logic approach, the system considers partial truths.
    Since the input signal is not just “low” or “high,” but can have degrees of membership
    in multiple categories. So, the motor speed adjusts smoothly and continuously,
    representing a more realistic response to varying input conditions [2, 5, 6].
    This example highlights the key difference: crisp logic operates in strict, discrete
    levels, while fuzzy logic allows for a smoother,'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'more nuanced response, flexible the imprecise and uncertain nature of real-world
    input signals. This flexibility is vital in applications where precise boundaries
    are hard to define or where systems need to respond to a wide range of input conditions.


    # 1.3 FUZZY LOGIC DCM CONTROL


    # 1.3.1 DCM


    In the vast landscape of industry, DCMs play a pivotal role, weaving their presence
    across diverse applications with exceptional precision and efficiency [7]. The
    intricate tasks of manufacturing are evidence of their silent but significant
    operation. where they master the synchronized favor of manufacturing processes
    in motion. In the textile sector, DCMs create complex patterns so that each pattern
    appears on the fabric precisely [5, 8]. These motors find their way into the heart
    of medical technology, empowering surgical tools with the finesse needed for intricate
    procedures and lending their reliability to life-saving medical devices [9–11].


    Beyond these applications, DCMs are the driving force behind automation, coordinating
    the quick sorting in warehouses and the careful choreography of packing lines.
    Their adaptability shines in every industry, demonstrating their abilities to
    transform mechanical energy into purposeful movement, from the precise strokes
    of a robotic arm to the rhythmic motions of conveyor belts. Each rotation signifies
    the seamless fusion of technology and industry, a proof of the accuracy and dependability
    that DCMs provide to the foundation of industrial operations [12–15].


    # 1.3.2 USING SIMPOWERSYSTEMS IN CONTROL SYSTEMS


    Utilizing SimPowerSystems in the design and simulation of control systems for
    electrical motors offers a multitude of advantages, bringing simulations remarkably
    close to real-world scenarios, far beyond the reach of simplistic theoretical
    models. This powerful tool enables engineers and researchers to create complex
    virtual models of electrical power systems, for example, DC, asynchronous motors,
    and their corresponding control systems. These models function as dynamic replicas,
    emulating the behavior of the system in a range of scenarios with different loads
    and speeds [16–18].'
