    # Fuzzy Logic Application for Enhancing Performance of Continuous Variable Gearboxes


    SUDIPTA ADHIKARY¹, KAUSHIK CHANDA², GUNJAN MUKHERJEE², and KAUSHIK BANERJEE¹


    ¹Department of Law, Brainware University, Kolkata, West Bengal, India


