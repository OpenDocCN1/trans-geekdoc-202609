  md: '# ## About the Editors


    ![](img/e9de70cd491e84262133af63cb33d500_5_0.png)


    **Rahul Kar**


    *State-Aided Teacher, Department of Mathematics, Kalyani Mahavidyalaya, Nadia,
    West Bengal, India*


    Rahul Kar is pursuing his PhD in Pure Mathematics at Burdwan University, and is
    currently working as a SACT-II Mathematics faculty of Kalyani Mahavidyalaya, Kalyani,
    Nadia, West Bengal. He has worked as a guest faculty of the Guru Nanak Institute
    of Technology and other two colleges.


    In total, he has 5 years of teaching experience. He has published more than 10
    research papers indexed by Scopus. He also worked as an editor of four national
    and international journals and reviewer at five international journals. He is
    working as an editor of two mathematics books. He is an annual member of Indian
    Mathematical Society as well as honorary member of the Carmels Research Institute,
    Dakar, Senegal. He has attended more than 10 international conferences and seminars
    as a paper presenter.


    ![](img/e9de70cd491e84262133af63cb33d500_5_1.png)


    **Aryan Chaudhary**


    *Chief Scientific Advisor, BioTech Sphere Research, Ghaziabad, Uttar Pradesh,
