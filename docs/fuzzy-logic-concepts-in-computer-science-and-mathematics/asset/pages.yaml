- pgno: 176
  md: 'Rao [21] extensively outlines GTMA in his book, highlighting its methodology
    and applications. The comprehensive nature of graph theory and its diverse applications
    is well-documented. Graph and digraph model representations have proven valuable
    for modeling and analyzing various systems across science and technology fields.
    The matrix approach emerges as a particularly effective tool for efficiently analyzing
    graph/digraph models, enabling the derivation of system functions and indices
    aligned with specific objectives.


    The GTMA methodology comprises digraph representation, matrix representation,
    and permanent function representation. The digraph visually captures variables
    and their interdependencies, while the matrix transforms this visual representation
    into a mathematical form [22]. The permanent function, a mathematical representation,
    plays a crucial role in determining the numerical index associated with the model
    [23].


    The step-by-step explanation of the methodology is as follows:


    **Step 1:** Determining the factors influencing equipment selection involves identifying
    all the criteria that impact the decision. This can be achieved by referring to
    pertinent criteria outlined in existing literature or obtaining input from the
    decision maker.


    **Step 2:** Identify all possible equipment alternatives and evaluate each option.


    **Step 3:** A graphical depiction of criteria and their interdependencies is illustrated
    through an equipment selection criteria graph. Criteria are defined as factors
    that impact the choice of an alternative, and the equipment selection criteria
    digraph visually represents the relationships among these criteria. This digraph
    contains of a set of nodes $N = \{n_i\}$, with $i = 1,2,3,\ldots,M$ and a set
    of directed edges $E = \{e_{ij}\}$. A node $n_i$ represents $i$th alternative
    selection criterion and edges denote the comparative importance among the criteria.
    The number of nodes M reflected is equal to the number of alternative selection
    criteria measured. If a node $i$ has relative importance over another node $j$
    in the alternative selection, then a directed edge is drawn from node $i$ to node
    $j$ (i.e., $e_{ij}$). If $j$ has relative importance over $i$ directed edge is
    drawn from node $j$ to node $i$ ($e_{ji}$) [21].


    **Step 4:** Create a matrix that represents the selection criteria for equipment
    in a one-to-one relationship, derived from the alternative selection criteria
    digraph. This matrix is referred to as the equipment selection criteria matrix.
    This is a $M$ matrix and taking all of the criteria (i.e. $A_i$) and their relative
    importance (i.e., $a_{ij}$). Where $A_i$ is the value of the $i$th criteria represented
    by node $n_i$ and $a_{ij}$ is the relative importance of the $i$th criteria over
    the $j$th denoted by the edge $e_{ij}$. The value of $A_i$ should preferably be
    gotten from available data. When quantitative values of the criteria are available,'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'normalized values of a criterion allocated to the alternatives are calculated
    by $v_i / v_j$, where $v_i$ is the measure of the criterion for the $i$th alternative
    and $v_j$ is the measure of the criterion for the $j$th alternative which has
    a higher measure of the criterion among the considered alternatives. This proportion
    holds true exclusively for beneficial criteria. A beneficial criterion is one
    in which greater measurements are preferable for the specified purpose. Conversely,
    a nonbeneficial criterion is one in which lower measurements are favored and the
    normalized values assigned to the alternatives are calculated by $v_j / v_i$.


    ![](img/e9de70cd491e84262133af63cb33d500_177_0.png)


    **Step 5**: Deriving an alternative selection criteria function for a matrix involves
    utilizing the permanent of the matrix as the defined measure. The concept of the
    permanent matrix, introduced by Cauchy in 1812 during the development of determinant
    theory, pertains to a specific subset of symmetric functions later coined as permanents
    by Muir [24]. The permanent matrix is a conventional matrix function utilized
    in combinatorial mathematics. It is derived similarly to the determinant, but
    with a distinctive feature—unlike the determinant where negative signs are involved,
    the permanent replaces these negatives with positive signs in its computation.
    Understanding the permanent concept enhances the comprehension of selection attributes.
    Furthermore, employing this approach ensures that no negative signs are present
    in the expression, preserving all information without loss [21]. The PER (CS)
    covers terms arranged in (M + 1) groups, and classification involves these groups
    corresponding to criteria measures and the significance of relative importance
    loops. The initial group signifies measures of M criteria, with the second group
    omitted due to the absence of self-loops in the digraph. The third group encompasses
    2-criterion relative importance loops and measures of (M-2) criteria. Each term
    in the fourth group denotes a set of a 3-criterion relative importance loop, or
    its counterpart, and measures of (M-3) criteria. The fifth group is divided into
    two sub-groups. The first sub-group comprises sets of two 2-criterion relative
    importance loops and measures of (M-4) criteria. Meanwhile, each term in the second
    sub-group represents a set of a 4-attribute relative importance loop, or its pair,
    and measures of (M-4) criteria. The sixth group contains two sub-groups'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'as well. The terms in the first sub-group are sets of a 3-criterion relative
    importance loop, or its pair, along with a 2-criterion importance loop and measures
    of (M-5) criteria. On the other hand, each term in the second sub-group represents
    a set of a 5-criterion relative importance loop, or its pair, and measures of
    (M-5) criteria. The remaining terms in the equation follow a similar pattern.
    Therefore, the comprehensive structure of the CS fully defines the alternative
    selection evaluation problem, encapsulating all conceivable structural components
    of criteria and their relative importance. It is worth noting that this equation
    is essentially the determinant of an M-M matrix, with all terms considered positive.


    ![](img/e9de70cd491e84262133af63cb33d500_178_0.png)


    **Step 6:** Assessing and ranking the alternatives involves assigning positions
    based on the enduring values previously computed in the preceding stage (Tables
    9.4–9.10).


