    # Abstract


    Large language models (LLMs) have achieved remarkable successes over various natural
    language tasks. However, recent studies have found that there are significant
    challenges to the reasoning abilities of LLMs. This paper aims to categorize these
    challenges into two aspects: (**Logical reasoning**, LLMs often fail to get the
    correct answer within complex problems which requires sophisticated strategies);
    (**Logical consistency**, LLMs are prone to producing inconsistent responses across
    different questions. For example, in the Macaw question-answering task LLMs answer
    Yes to both questions: "Does a bird have wings? Does a dog have wings?" To address
    this direction, we investigate various reasoning methods and provide detailed
    tactics of these methods. Specifically, to accurately answer complex logical questions,
    methods can be categorized based on relation to external solvers, prompting, and
    inference. We also discuss concepts of various locations of logical consistency,
    including implication, negation, truthfulness, consistency and composition. In
    addition, we review benchmark evaluation metrics and discuss research directions,
    such as extensions to model logic to account for uncertainty, and efficient algorithms
    satisfying multiple-logical consistency simultaneously.


