    # 4 Future Research Directions and Modeling


    # 4.1 Extension to Conditional and Modal Reasoning


    Despite the state-the-art approaches greatly enhance the logical reasoning abilities
    of LLMs, there is a lack of exploration into the more complex conditional and
    modal reasoning abilities. Modal reasoning can be introduced in the form of $If...then$.
    Conditional reasoning also has strict rules that must be followed. For example,
    if the match is strict $(p)$ it will allow $(q)$ if the match is loose $(p-q)$
    which can be formally formulated as $p \rightarrow q$ or $p \rightarrow r \rightarrowrightarrow
    q$. In addition, modal logic can predict for necessity and account for the currency
    of possibility, and respectively. For example, $Might(y)$ not $(y)$ refers to
    the wedding in the state that $May(y)$ have been the wedding (which) which can
    be formally formulated as $May \rightarrow \neg y$. Either modal logic can extend
    to conditional and modal logic, respectively, work shows although logically inconsistent
    across inference patterns between episodic and models, it is worthwhile to explore
    new methods to make LLM have the ability to reason on conditional and uncertain
    events.


    # 4.2 Higher-Order Reasoning of Events


    Compared to first-order logic, higher-order logic allows for reasoning about properties
    and functions, enabling more


    complex statements and proofs. First-order logic only covers individual variables,
    which can only perform reasoning about objects, not properties of properties.
    In contrast, higher-order logic allows quantification over sets, functions, and
    predicates, establishing statements about properties and properties relationships
    between functions. For example, a first-order logic statement is All that animal
    is a mammal, which can be formulated as $Mammal(x)$. A higher-order logical reasoning
    would allow There is a property that have cats, which can be formulated as $\exists
    P Cat(x) \rightarrow P(x) \wedge \ \forall y P(y)$. This allows reasoning about
    properties (like $P$), which can be considered as set of objects instead of individual
    objects, for more complex expressions and reasoning on LLMs.


    # 5 Conclusion


    In summary, this provides a comprehensive overview of the current state of the
    art in logical reasoning abilities of LLMs. LLMs with massive advancements in
    natural language processing face significant challenges in the areas of logical
    question answering and logical consistency. Through taxonomy, we classified cutting-edge
    approaches to tackle these challenges, highlighting logical questions based on
    external solvers or internal through prompting, fine-tuning, and as well as a
    variety of logical concepts and solutions, including negation, transitivity, factuality
    consistency, and their positions. In addition, we review many datasets and evaluation
    metrics used in this area that are critical for LLM performance in logical reasoning
    tasks. Looking ahead, promising research directions include


