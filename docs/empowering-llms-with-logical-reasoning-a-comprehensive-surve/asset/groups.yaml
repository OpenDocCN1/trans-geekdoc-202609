    # ## 2.2 Prompt-Based Approach: Translate, Reason and Verify via LLM


    Prompting is a direct technique for stimulating the logical reasoning capabilities
    of LLMs. To achieve a more accurate answer of logical questions, prompt-based
    approaches can be divided into two categories, the first is to model the logical
    chain when the question arises. For example, Chain-of-Thought (CoT) [Wei et al.,
    2022] prompt strategy enables LLMs to emulate the reasoning process step-by-step.
    Based on this, Tree-of-Thought


    (ToT) [Ya et al., 2024] prompt to let LLMs evaluate and select among multiple
    inference paths. Mean, Graph-of-Thought (GoT) [Besta et al., 2024] represents
    the generated information as an argumentative graph or graph of networks to ensure
    that the reasoning process is more realistically rational logical dialogues. Graph
    of Thought (DoT) [Zheng et al., 2024] prompt to model iterative logical reasoning
    in LLM as a directed acyclic graph (DAG) as shown in Figure 1. The nodes of the
    DAG represent logical steps, and the edges in the DAG represent logical relationships
    or dependencies between them. In addition, many previous studies focus on the
    diversity of reasoning paths. For example, [Zheng et al., 2023a] prompt to leverage
    three types of LLMs (poser, verifier, and reporter) in a collaborative reasoning
    process.


    The second category is to translate natural language into symbolic language by
