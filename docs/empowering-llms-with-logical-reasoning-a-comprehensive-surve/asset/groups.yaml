    Considering the lack of high-quality reasoning samples such as multi-step de novo
    proofs or in pretraining and fine-tuning methods we propose to training LLMs with
    augmented data. For logical consistency, we focus most common logical constructs,
    including implication, negation, truthfulness, consistency and their composites,
    which are the state-of-the-art solutions for logical consistency, and use widely
    used benchmarks and datasets. Lastly, we discuss promising research directions,
    such as extension to conditional and modal logic, and efficient reasoning over
    multiple logical constraints.


