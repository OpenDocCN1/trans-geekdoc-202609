    \ KB 中包含的所有事实 [Calzano et al., 2025]。\n\n## 3.2 蕴含一致性 (Implication Consistency)\n\
    \n蕴含一致性基于逻辑规则 $p \\rightarrow q, p$。这意味着如果存在“p $\\rightarrow$ q”和前提 p，那么“p $\\\
    rightarrow$ q”有可能是真的。如果模型预测“q”为假，则答案违反了蕴含一致性。例如，给定物理事实“所有铁 (p) 都是金属 (q)”，如果铁 (p)\
    \ 和金属 (q) 为假，LLMs 不应对该陈述标记为真。\n\n不同，蕴含一致性与思维链（CoT）方法密切相关，每个链可以被视为逻辑蕴含。无法满足蕴含一致性会导致这些解释方法产生不准确的输出。例如，自动提示（Automatic\
    \ Prompting, Jun et al., 2022）从不可靠的解释中修正正确答案。多次提示（Multiple Prompting）产生单一解释，MainActivity\
    \ 将“真”和“假”溯溯蕴含转换为逻辑约束，并使用 MAX-SAT 求解器生成最佳方面以避免蕴含不一致。\n\n## 3.3 传递一致性 (Transitivity\
    \ Consistency)\n\n为了解决模型在复杂查询下扩展的逻辑一致性问题，研究了一种基于检索增强生成（RAG）的 LLM 逻辑一致性改进框架 [Ghosh\
    \ et al., 2025]。具体而言，首先设计了一个基于逻辑的评估框架，通过析取和合取处理逻辑一致性。其次，通过构建知识图谱（KG）树形基准数据集，证明了\
    \ LLM 在复杂查询中表现出糟糕的逻辑一致性。为了解决这一问题，他们使用上下文提示和少样本（few-shot）方法来学习 LLM 在复杂推理任务中的事实一致性，并利用\
    \ QLoRA 等参数高效方法提高性能。\n\n传递代表了顺序或命题之间的逻辑关系。当存在两个前提 $p \\rightarrow q$ 和 $q \\rightarrow\
    \ r$ 时，可以得出 $p \\rightarrow r$，这被视为传递一致性。研究表明 LLM 缺乏传递一致性。对于最先进的问答（QA）模型，回答“鸟有羽毛吗？或者鸟是吗？麻雀有羽毛吗？”\
    \ [Mitchell et al., 2022] 时，模型根据传递规则在乌鸦有头时提供了肯定答案，这与另一个输出不兼容。\n\n## 3.5 组合一致性\
    \ (Compositional Consistency)\n\n组合一致性是指在组合多个事实时维持逻辑一致性。当模型需要通过逻辑算符（如蕴含、合取）组合成复杂链时，它必须确保推导的每一步都符合规则，并在条件下使结论自洽。这要求模型不仅要理解实际事实的含义，还要捕捉它们连接时的逻辑关系，避免推断错误。Loco-LLMS\
    \ [Calzano et al., 2025] 被提出通过解构维持事实一致性，通过根据事实和规则的知识库微调 LLM 来实现事实性和自洽性。可以表示任意命题的逻辑公式被编译成电路，然后被分配以生成答案。[Liu\
    \ et al., 2024b] 提供了一个通用框架，通过三个通用代理：传递性、交换性和否定推理来量化位置一致性。\n\n## 3.6 评估 (Evaluation)\n\
    \n[Kasser et al., 2021] 引入了一种金标准方法来评估一组信念的准确性和一致性。继 [Mitchell et al., 2022] 之后，Kasser\
    \ et al., 2023] 也采用了这种评估方法。我们提供了充分的介绍，并借用了 [Kasser et al., 2022] 中的符号语言。其定义为：\n\
    \n为了减轻 LLM 的不一致性，[Ai and Hajishari, 2020] 利用事实的逻辑推理规则提示模型获取基础陈述。基于查询“金鱼有钱，会有更多吗？食物更多，我们的天气正在发生吗？”，当“更多和更多”时，如果“金鱼有钱”的蕴含将通过对称性增强，对于对称规则，反义词和陈述的反也被添加到数据集中。通过这种方式，该方法增强了训练数据，然后采用基于一致性的正则器来训练模型，以增强其包含和对称的逻辑一致性。\n\
    \n![](img/44bde4dde3cb368e60d819f0be8f3b0e_5_0.png)\n\n- 一组实体 $s_m \\in S$；\n\
    - 一组“事实” $(P_n(s_m))$，其二值化真值已知；\n- 金标准约束的有向图 $G(P, E)$，其中边 $(P_i, P_j) \\in E$\
    \ 代表一阶逻辑公式 $P_i(x) \\rightarrow P_j(x)$。\n\n通过二进制比较评估准确性，比较配置 $Z$ 中的 $z$（使 $\\\
    phi(z)$ 最大化）与 $P_n(s_m)$ 的真值 [Mitchell et al., 2023]。在这一评估中，使用金标准倾向于真实值。\n\n关于自我信念的推理。二进制\
    \ [Kansner et al., 2021]、ConfOr [Mitchell et al., 2022] 以及所有约束的遵循性 [Vaswani et\
    \ al., 2019]，其定义为 $G$ 中金标准约束的比例，这与其他输出不兼容。\n* \n\n"
