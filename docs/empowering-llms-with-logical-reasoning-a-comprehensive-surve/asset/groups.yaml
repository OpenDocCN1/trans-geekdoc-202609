    # Abstract


    Large language models (LLMs) have achieved remarkable successes over various natural
    language tasks. However, recent studies have found that there are significant
    challenges to the reasoning abilities of LLMs. This paper aims to categorize these
    challenges into two aspects: (**Logical reasoning**, LLMs often fail to get the
    correct answer within complex problems which requires sophisticated strategies);
    (**Logical consistency**, LLMs are prone to producing inconsistent responses across
    different questions. For example, in the Macaw question-answering task LLMs answer
    Yes to both questions: "Does a bird have wings? Does a dog have wings?" To address
    this direction, we investigate various reasoning methods and provide detailed
    tactics of these methods. Specifically, to accurately answer complex logical questions,
    methods can be categorized based on relation to external solvers, prompting, and
    inference. We also discuss concepts of various locations of logical consistency,
    including implication, negation, truthfulness, consistency and composition. In
    addition, we review benchmark evaluation metrics and discuss research directions,
    such as extensions to model logic to account for uncertainty, and efficient algorithms
    satisfying multiple-logical consistency simultaneously.


    # 1 Introduction


    Large language models (LLMs) have demonstrated performance in a broad range of
    natural language tasks-including generation, classification and translation. However,
    recent studies have found that there are significant challenges to the reasoning
    abilities of LLMs. On one hand, handling syntax, semantics, and word tasks such
    as next-word prediction or masked language modeling does not ensure the logical
    ability of LLMs [Liu et al., 2023]. On the other hand, the primacy of LLMs in
    processing human-written texts, lacks high-quality logical reasoning such as logical
    deduction and proofs [Moshita et al., 2024]. These challenges significantly limit
    the ability of LLMs due to the following summarized aspects.


    LLMs fail to get the correct logical answer in questions which require deductive,
    inductive or abstract reasoning from given premises and constraints. Specifically
    these questions can be broadly divided into two categories: (Determination whether
    a statement can be deduced from given information, namely the truth value of,
    true or false. For example, the premise and constraints could be Metal conductivity.
    Insulators do not conduct electricity. If metal is made of iron, is it a conductor?
    The logical question is whether the statement true, false, or unknown? Cannot
    conductivity. To answer this question correctly, LLMs need to conduct logical
    reasoning-of iron-metal-deductive electricity before concluding that iron conducts
    electricity and correctly select any option that can satisfy the given constraints
    from the multiple choices. Surprisingly, LLAMA-13B achieves 33.63% accuracy under
    8-shot prompting on the logical datasets FOLIO, which is only slightly better
    than random guessing with an accuracy of 33.33% [Han et al., 2024]. This study
    reflects the restriction of LLMs in interacting real-world situations such as
    problem-solving and decision-making.


    LLMs are also prone to producing inconsistent responses across different questions,
    which is regarded as violation of logical consistency. Note that the form of logical
    consistency can be diverse. For example, Llama2-7b answers yes to both questions
    with an although on an organ-ism? and if not an organism? [Calanzone et al., 2025],
    which violates the necessity consistency (see Section 3 for formal definition).
    In addition, a state-of-the-art Macaw question-answering LLM answers Yes to a
    bird? Does a bird have wings? [Mitchell et al., 2023], which violates the testimony
    consistency. Our studies show that few question-answering datasets ensure logical
    consistency of LLMs [Kassner et al., 2021; Jung et al., 2022]. As a result, contradictory
    outputs compromise the reliability and trustworthiness of LLMs, which limits their
    potential performance.


    In this paper we consider answering complex logical problems and ensuring logical
    consistency across different outputs as two sides of the coin in improving the
    logical reasoning capabilities of LLMs. To address this, we review methods for
    improving the logical question answering [Xo et al., 2024; Wan et al., 2024] and
    logical consistency [Pelka et al., 2025; Calanzone et al.], which reached widespread
    attention in the LLM community. To facilitate this, we categorize them and provide
    detailed taxonomies of these methods, as shown in Figure 1. For logical question
    answering, these are classified as model-based methods, prompt-based methods,
    and pretrain-and-tune methods based on external tools such as logical solvers.


    # 2 Logical Question Answering


    Leveraging language models (LLMs) for complex reasoning problems is a key focus
    of recent researches [Lao et al., 2023; Zhang et al., 2024]. Numerous studies
    have explored methods to enhance the logical reasoning capabilities of LLMs, which
    can be categorized into several branches, including reliance on external solvers,
    prompting techniques without further training and fine-tuning. Many benchmarks
    are developed to evaluate the logical reasoning performance of models.


    # 2.1 Solver-Aided Approach: Translation via LLM and Solver


    The solver-aided approach refers to parsing natural language (NL) problems into
    symbolic (SL) expressions, and then solving them via external solvers. The general
    flow of solver-aided methods can be summarized into three steps, as shown in Figure
    2. These methods use LLMs to translate NL into symbolic language (such as logic
    programming (LP) language, first-order logic (FOL), constraint satisfaction (CSP),
    and boolean satisfiability (SAT) formulation) that can be recognizable by solvers.
    Then they use an external solver to solve the problem and use LLMs to translate
    the answer provided by NL into natural language to generate the final answer based
    on some algorithms such as majority vote. CoT [Yu et al., 2023] based on the Chain-of-Thought.
    Translating a natural language into symbolic reasoning chain with a deterministic
    solver (e.g., Python/Interpreter or a PDDL parser) to ensure the faithfulness
    of LLM answers. However, these functional methods struggle with the "noisy" process
    of reasoning, which may fail to solve complex logic problems.


    The solver-aided approach has many drawbacks. First, transforming logical problems
    into formal expressions will result in loss [Liu et al., 2024], leading to the
    problem unsolvable. For example in the symbolic translation of "When a person
    reads a book, that person gains knowledge. Harry faster." Whether this inference
