    # 赋予大语言模型逻辑推理能力：综述


    Fengxiang Cheng$^1$, Haoxuan Li$^{2,3}$, Fenrong Liu$^{1,4}$, Robert van Rooij^1$

    Kun Zhang$^{5,6}$ and Zhouchen Lin$^{6,7,8}$


    $1$阿姆斯特丹大学语言与计算研究所

    $2$MBUZAI 机器学习部门

    $3$清华大学物理系

    4$CMB 哲学系

    $5$北京大学人工智能研究院

    $6$彭博化学实验室

    $7$北京大学科学与技术学院人工智能国家重点实验室

    {$cheng,r.m.vanrooij}@uva.nl, hli@stu.edu.cn, fenrong@tsinghua.edu.cn, kun2@zmu.edu.cn


    # 摘要


    大大语言模型（LLMs）在各种自然语言任务中取得了卓越的成功。然而，最近的研究发现，LLMs 的推理能力面临着巨大挑战。本文旨在将这些挑战分为两个方面：（**逻辑推理**，LLMs
    在处理需要复杂策略的难题时往往无法获得正确答案）；（**逻辑一致性**，LLMs 倾向于对不同问题产生不一致的回答。例如，在 Macaw 问答任务中，LLMs
    对两个问题都回答“是”，“鸟有翅膀吗？狗有翅膀吗？”为了解决这一方向，我们研究了各种推理方法并提供了这些方法的详细策略。具体而言，为了准确回答复杂的逻辑问题，可以根据与外部求解器的关系、提示词和推理对方法进行分类。我们还讨论了逻辑一致性不同位置的概念，包括蕴含、否定、真实性、一致性和组合。此外，我们回顾了基准评估指标，并讨论了研究方向，例如扩展模型逻辑以考虑不确定性，以及同时满足多个逻辑一致性的高效算法。


    # 1 引言


    大语言模型（LLMs）在广泛的自然语言任务中展现了性能，包括生成、分类和翻译。然而，最近的研究发现，大LLMs 的推理能力面临着巨大挑战。一方面，处理语法、语义和如预测下一个词或掩码语言模型等任务并不能确保
    LLMs 的逻辑能力 [Liu et al., 2023]。另一方面，LLMs 在处理人类编写的文本方面具有主导地位，但缺乏逻辑推演和证明等高质量的逻辑推理
    [Moshita et al., 2024]。这些挑战通过以下总结的方面显著限制了 LLMs 的能力。


    LLMs 在需要从给定前提和约束进行演绎、归纳或抽象推理的问题上往往无法获得正确的逻辑答案。具体来说，这些问题可以大致分为两类：（判断一个陈述是否可以从给定信息中推导出，即真值，真或假。例如，前提和约束可以是“金属导电。绝缘体不导电。如果金属是由铁制成的，它是导体吗？”逻辑问题是该陈述是真实的、假的还是未知的？不能导电。）为了正确回答这个问题，LLMs
    需要进行逻辑推理——关于“铁-金属-演绎-电”——在得出铁导电结论之前，并从多选题中正确选择任何满足给定约束的选项。惊讶的是，LLAMA-13B 在逻辑数据集
    FOLIO 上在 8-shot 提示下的准确率为 33.63%，仅略优于随机猜测的 33.33% 准确率 [Han et al., 2024]。这项研究反映了
    LLMs 在解决问题和决策等现实世界交互中的局限性。


    LLMs 也容易在不同问题之间产生不一致的回答，这被认为违反了逻辑一致性。注意，逻辑一致性的形式是多样的。例如，Llama2-7b 对“是一个生物吗？”和“如果不是生物呢？”这两个问题都回答了“虽然”
    [Calanzone et al., 2025]，这违反了必要一致性（正式定义见第 3 节）。此外，一个最先进的 Macaw 问答 LLM 对“鸟吗？”、“鸟有翅膀吗？”回答“是”
    [Mitchell et al., 2023]，这违反了证词一致性。我们的研究表明，很少有问答数据集能确保 LLMs 的逻辑一致性 [Kassner et
    al., 2021; Jung et al., 2022]。结果，自矛盾的输出损害了 LLMs 的可靠性和可信度，限制了它们的潜在性能。


    在本文中，我们将回答复杂的逻辑问题和确保不同输出之间的逻辑一致性视为提高 LLMs 逻辑推理能力的硬币两面。为了解决这个问题，我们回顾了改进逻辑问答 [Xo
    et al., 2024; Wan et al., 2024] 和逻辑一致性 [Pelka et al., 2025; Calanzone et al.]
    的方法，这些方法在 LLM 社区引起了广泛关注。为了方便，我们对其进行了分类并提供了这些方法的详细分类，如图 1 所示。对于逻辑问答，这些被分为基于模型的方法、基于提示的方法以及基于逻辑求解器等外部工具的预训练和微调方法。


    # 2 逻辑问答


    利用语言模型（LLMs）解决复杂推理问题是近期研究重点 [Lao et al., 2023; Zhang et al., 2024]。许多研究探索了增强 LLMs
    逻辑推理的方法，这些方法分为几个分支，包括依赖外部求解器、无需进一步训练和微调的提示技术。开发了许多基准来评估模型的逻辑推理性能。


    # 2.1 求解器辅助方法：通过 LLM 和求解器翻译


    求解器辅助方法是将自然语言（NL）问题解析为符号（SL）表达式，然后通过外部求解器求解。求解器辅助方法的通用流程可以总结为三个步骤，如图 2 所示。这些方法使用
    LLMs 将自然语言翻译为符号语言（如逻辑编程 (LP) 语言、阶逻辑 (FOL)、约束满足问题 (CSP) 和布尔满足性 (SAT) 公式），这些语言可以被求解器识别。然后使用外部求解器求解问题，并使用
    LLMs 将提供的答案翻译成自然语言，根据某些算法（如多数投票）生成最终答案。CoT [Yu et al., 2023] 基于思维链通过确定性求解器（例如
    Python/解释器或 PDDL 解析器）将自然语言翻译为符号推理链，以确保 LLM 回答的忠实性。然而，这些功能性方法在“噪声”推理过程中非常困难，可能无法解决复杂的逻辑问题。


    求解器辅助方法有很多缺点。首先，将逻辑问题转换为形式化表达式会导致损失 [Liu et al., 2024]，导致问题无法解决。例如在“当某人读书时，那个人获得了知识。哈里更快。”的符号翻译中。这种推理是


    考虑到缺乏高质量的推理样本（如多步从头证明），或者在预训练和微调方法中，我们提出使用增强数据来训练 LLMs。对于逻辑一致性，我们关注最常见的逻辑结构，包括蕴含、否定、真实性、一致性及其组合，这些是逻辑一致性的最先进解决方案，并使用了广泛使用的基准和数据集。最后，我们讨论了具有前景的研究方向，例如扩展到条件逻辑和模态逻辑，以及多个逻辑约束的高效推理。


    据我们所知，这是首项研究提高 LLM 逻辑推理能力的工作，涵盖了复杂逻辑问答和逻辑一致性的前沿研究。我们最相关的工作是 [Zong and Lin, 2024]，它仅关注三段论作为一种特定的逻辑范式，忽略了另一种逻辑推理。在规则方面，[Lam
    et al., 2024] 只讨论了 tik、[Yant et al., 2023] 和 [Zhang et al., 2023]。


