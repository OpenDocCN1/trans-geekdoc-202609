  fmt: '

    # Deep Learning Overview


    Deep learning algorithms are seen as being data intensive because they need enormous
    amounts of data to achieve high accuracies and more data always appear to help
    performance. Deep learning is quickly becoming the go to solution for many machine
    learning problems where vast data is available occasioned by the advent of the
    internet.


    ## Applications of Deep Learning


    Deep learning has been applied to solve many problems which have real world applications
    and are now being transitioned into commercial products.


    In the field of computer vision, deep learning techniques are used for automatic
    colorization to transform old black and white photos, automatic tagging of friends
    in photos as seen in social networks and grouping of photos based on content into
    folders.


    In Natural Language Processing (NLP), these algorithms are used for speech recognition
    in digital assistants, smart home speakers etc. With advances in Natural Language
    Understanding (NLU), chatbots are being deployed as customer service agents and
    machine translation has enabled real time translations from one language to the
    other.


    Another prominent area is recommender systems, where users are offered personalized
    suggestions based on their preferences and previous spending habits. Simply put,
    deep learning algorithms are wildly beneficial and learning them is a quality
    investment of time and resources.


    ## Python Deep Learning Frameworks


    Python has a mature ecosystem with several production ready deep learning frameworks.
    Some of them are `Pytorch`, `Chainer`, `MXNet Keras`, `TensorFlow` etc. We would
    concentrate on using `TensorFlow` in this book as it is an extremely popular and
    supported deep learning framework open sourced by Google in 2015.


    `TensorFlow` uses the concept of a computation graph to construct a model. Nodes
    and operations are declared on the graph beforehand then at training time the
    model is compiled. In the next section we would see how to install `TensorFlow`
    and use it to perform deep learning tasks through a hands on example.


    ## Install TensorFlow


    `TensorFlow` is cross platform and can be installed on various operating systems.
    In this section we would see how it can be installed on the three widely used
    operating systems - Linux, macOS and Windows. `TensorFlow` can be installed using
    `pip` which is the native Python package manager, `virtualenv` - which creates
    a virtual environment or through a bundled scientific computation distribution
    like `Anaconda`. For the purpose of this book we would use `pip`.


    ### Installing TensorFlow on Windows


    For `TensorFlow` to be installed on Windows, you need to first install Python
    which comes bundled with `pip` as the package manager. Python can be downloaded
    as an executable at <https://www.python.org/downloads/windows>


    Once you have it installed, start a terminal and run the following command:


    ```

    C:\> pip3 install --upgrade tensorflow

    ```


    ### Installing TensorFlow on Linux


    For Linux distributions like Ubuntu and its variants, `pip` is usually already
    installed. To check which version of `pip` is installed, from the terminal run


    ```

    $ pip -V

    ```


    or


    ```

    $ pip3 -V

    ```


    This depends on the version of Python you have, `pip` for version 2.7 and `pip3`
    for version 3.x


    If you do not have `pip` installed, run the appropriate command for your Python
    version below:


    ```

    $ sudo apt-get install python-pip python-dev   # for Python 2.7

    $ sudo apt-get install python3-pip python3-dev # for Python 3.n

    ```


    It is recommended that your version of `pip` or `pip3` is 8.1 or greater. Now
    you can install `TensorFlow` with the following command


    ```

    $ pip install tensorflow    # Python 2.7

    $ pip3 install tensorflow   # Python 3.x

    ```


    ### Installing TensorFlow on macOS


    To install `TensorFlow` on macOS, you need to have Python installed as it is a
    prerequisite. To check if you have `pip` installed run


    ```

    $ pip -V

    ```


    or


    ```

    $ pip3 -V

    ```


    This depends on the version of Python you have, `pip` for version 2.7 and `pip3`
    for version 3.x


    If you do not have `pip` installed, or you have a version lower than 8.1, run
    the commands to install or upgrade:


    ```

    $ sudo easy_install --upgrade pip

    $ sudo easy_install --upgrade six

    ```


    Now you can install `TensorFlow` with the following command


    ```

    $ pip install tensorflow    # Python 2.7

    $ pip3 install tensorflow   # Python 3.x

    ```


    ## How to Create a Neural Network Model


    In order to create a neural network in `TensorFlow` it is important to understand
    how `TensorFlow` works. The following steps would help us understand what we need
    to do:


    1.  **Build a Computation Graph**: First we need to define mathematical operations
    which would be carried out on tensors. We can think of tensors as a higher order
    matrix. A matrix is an array containing numbers arranged in rows and columns.
    Data structures such as images can be represented as matrices and since deep learning
    uses geometric transformations, the input to any model must be numeric.

    2.  **Initialisation of Variables**: All previously declared variables have to
    be initialised before we can train the model. In `TensorFlow`, variables are usually
    declared using placeholders which register on the computation graph but the values
    are actually supplied later.

    3.  **Creation of Session**: After we have described the computation graph and
    initialised variables, the next step is to create a session within which the computation
    graph would be executed.

    4.  **Running of Graph in Session**: The complete graph along with values for
    placeholders is passed to the session for execution. This is when the mathematical
    operations defined in the graph takes place.

    5.  **Close Session**: When the graph and related computations have finished executing,
    we need to shutdown or end the session.


    ![](images/00119.jpeg)


    The diagram above shows a simple computation graph for a function. Using `TensorFlow`
    we would describe something similar that defines a neural network in the next
    chapter.


    ## Deep Learning Case Studies


    In this chapter we would work with data that can be used for real world applications.
    Two case studies would be performed, the first involves predicting customer churn
    which means how likely is a customer to stop patronage to a business and switch
    to its competitor. The second study would involve automatic sentence classification
    which can be used by reviews sites to detect users sentiments based on their review.


    To enable us develop models quickly and test our hypothesis, it is reasonable
    for us to use `TensorFlow`’s higher level APIs which are exposed through `TFLearn`.
    `TFLearn` has bundled components which are similar to `Scikit-Learn` but for building
    deep neural networks. `TFLearn` is just a convenience wrapper for `TensorFlow`’s
    lower level computation graph components. As such `TensorFlow` is a dependency
    for `TFLearn`, that is to say to use or install `TFLearn`, you first need to have
    `TensorFlow` installed.


    Since we have `Tensorflow` already installed from the previous chapter, we can
    go ahead to install `TFLearn`. `TFLearn` can be installed across the three major
    operating systems we covered in the last chapter by using Python’s native package
    manager `pip`. To install `TFLearn` we run the following command in a terminal:


    ```

    $ pip install tflearn

    ```


    ## Bank Churn Modelling


    Here we are presented with a case whereby a bank wants to use data collected from
    its customers over several years to predict which customers are likely to stop
    using the bank’s services by switching to a competing bank. The rewards of such
    an analysis to the bank is profound as it can target dissatisfied customers with
    incentives which would reduce the churn ratio helping the bank to grow its customer
    base and solidify its position.

    '
  trans: '


    # 深度学习概述


    深度学习算法被视为数据密集型，因为它们需要海量数据才能达到高准确度，且更多数据似乎总能有助于提升性能。随着互联网的出现，海量数据变得触手可及，深度学习正迅速成为解决许多机器学习问题的首选方案。


    ## 深度学习的应用


    深度学习已被应用于解决许多具有现实应用价值的问题，并正逐步转化为商业产品。


    在计算机视觉领域，深度学习技术被用于自动上色，以修复古老的黑白照片；用于社交网络中照片中好友的自动标记；以及基于内容将照片分组归类到文件夹中。


    在自然语言处理（NLP）中，这些算法被用于数字助手、智能家居音箱等设备的语音识别。随着自然语言理解（NLU）的进步，聊天机器人正被部署为客服代理，机器翻译则实现了语言之间的实时翻译。


    另一个显著领域是推荐系统，根据用户的偏好和过往消费习惯提供个性化建议。简而言之，深度学习算法大有裨益，学习它们是对时间和资源的优质投资。


    ## Python 深度学习框架


    Python 拥有成熟的生态系统，包含多个可用于生产环境的深度学习框架。其中包括 `Pytorch`、`Chainer`、`MXNet Keras`、`TensorFlow`
    等。本书将重点使用 `TensorFlow`，因为它是一个极其流行且受支持的深度学习框架，由 Google 于 2015 年开源。


    `TensorFlow` 使用计算图的概念来构建模型。节点和操作预先在图上声明，然后在训练时编译模型。在下一节中，我们将了解如何安装 `TensorFlow`
    并通过一个实际例子使用它来执行深度学习任务。


    ## 安装 TensorFlow


    `TensorFlow` 是跨平台的，可安装在各种操作系统上。本节将介绍如何在三种广泛使用的操作系统（Linux、macOS 和 Windows）上安装它。`TensorFlow`
    可以使用 `pip`（Python 原生包管理器）、`virtualenv`（创建虚拟环境）或通过捆绑的科学计算发行版（如 `Anaconda`）进行安装。为了本书的目的，我们将使用
    `pip`。


    ### 在 Windows 上安装 TensorFlow


    要在 Windows 上安装 `TensorFlow`，首先需要安装 Python，它捆绑了作为包管理器的 `pip`。Python 可在 <https://www.python.org/downloads/windows>
    下载为可执行文件。


    安装完成后，启动终端并运行以下命令：


    ```

    C:\> pip3 install --upgrade tensorflow

    ```


    ### 在 Linux 上安装 TensorFlow


    对于 Ubuntu 等 Linux 发行版及其变体，`pip` 通常已预装。要检查安装的 `pip` 版本，请在终端运行：


    ```

    $ pip -V

    ```


    或


    ```

    $ pip3 -V

    ```


    这取决于你安装的 Python 版本：Python 2.7 使用 `pip`，Python 3.x 使用 `pip3`。


    如果未安装 `pip`，请根据你的 Python 版本运行相应命令：


    ```

    $ sudo apt-get install python-pip python-dev   # 适用于 Python 2.7

    $ sudo apt-get install python3-pip python3-dev # 适用于 Python 3.n

    ```


    建议你的 `pip` 或 `pip3` 版本为 8.1 或更高。现在可以使用以下命令安装 `TensorFlow`：


    ```

    $ pip install tensorflow    # Python 2.7

    $ pip3 install tensorflow   # Python 3.x

    ```


    ### 在 macOS 上安装 TensorFlow


    要在 macOS 上安装 `TensorFlow`，需要先安装 Python，因为它是先决条件。要检查是否安装了 `pip`，请运行：


    ```

    $ pip -V

    ```


    或


    ```

    $ pip3 -V

    ```


    这取决于你安装的 Python 版本：Python 2.7 使用 `pip`，Python 3.x 使用 `pip3`。


    如果未安装 `pip`，或版本低于 8.1，请运行以下命令进行安装或升级：


    ```

    $ sudo easy_install --upgrade pip

    $ sudo easy_install --upgrade six

    ```


    现在可以使用以下命令安装 `TensorFlow`：


    ```

    $ pip install tensorflow    # Python 2.7

    $ pip3 install tensorflow   # Python 3.x

    ```


    ## 如何创建神经网络模型


    要在 `TensorFlow` 中创建神经网络，理解 `TensorFlow` 的工作原理至关重要。以下步骤将帮助我们了解需要做什么：


    1.  **构建计算图**：首先，我们需要定义将在张量上执行的数学运算。我们可以将张量视为高阶矩阵。矩阵是按行和列排列数字的数组。图像等数据结构可以表示为矩阵，由于深度学习使用几何变换，任何模型的输入都必须是数值型的。

    2.  **变量初始化**：在训练模型之前，所有先前声明的变量都必须初始化。在 `TensorFlow` 中，变量通常使用占位符声明，它们在计算图上注册，但实际值稍后才提供。

    3.  **创建会话**：在描述完计算图并初始化变量后，下一步是创建一个会话，在其中执行计算图。

    4.  **在会话中运行图**：将完整的图连同占位符的值一起传递给会话执行。这是图中定义的数学运算发生的时候。

    5.  **关闭会话**：当图及相关计算执行完毕后，我们需要关闭或结束会话。


    ![](img/00119.jpeg)


    上图展示了一个函数的简单计算图。在下一章中，我们将使用 `TensorFlow` 描述类似的内容来定义神经网络。


    ## 深度学习案例研究


    在本章中，我们将处理可用于现实应用的数据。将进行两个案例研究：第一个涉及预测客户流失，即客户停止光顾某家企业并转向其竞争对手的可能性有多大。第二个研究涉及自动句子分类，可用于评论网站根据用户评论检测用户情绪。


    为了让我们能快速开发模型并测试假设，使用 `TensorFlow` 的高级 API 是合理的，这些 API 通过 `TFLearn` 暴露。`TFLearn`
    捆绑了类似于 `Scikit-Learn` 的组件，但用于构建深度神经网络。`TFLearn` 只是 `TensorFlow` 底层计算图组件的一个便捷封装。因此
    `TensorFlow` 是 `TFLearn` 的依赖项，也就是说，要使用或安装 `TFLearn`，首先需要安装 `TensorFlow`。


    既然我们已在上一章安装了 `Tensorflow`，现在可以继续安装 `TFLearn`。`TFLearn` 可通过 Python 原生包管理器 `pip`
    在上一章涵盖的三大主流操作系统上安装。要安装 `TFLearn`，请在终端运行以下命令：


    ```

    $ pip install tflearn

    ```


    ## 银行客户流失建模


    这里呈现这样一个案例：一家银行希望利用多年收集的客户数据，预测哪些客户可能会停止使用该银行服务并转投竞争对手。此类分析对银行的回报极为丰厚，因为它可以针对不满意的客户提供激励措施，从而降低流失率，帮助银行扩大客户群并巩固地位。


    '
