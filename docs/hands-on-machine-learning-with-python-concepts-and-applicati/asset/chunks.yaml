    # Preface


    > “Machine learning will automate jobs that most people thought could only be
    done by people.”

    >

    > — Dave Waters


    ## Why Read This Book


    Machine learning is now changing how business, science, and engineering are done.
    Today machine learning might have already affected you. If you used a search engine
    or looked for products machine learning could be there in the background that
    made the results come out faster or personalized.


    Machine learning has been directly or indirectly transforming our lives. Many
    experts even say that we’re just scratching the surface. We haven’t yet taken
    full advantage of what machine learning can bring.


    So if you want to take advantage of machine learning and recognize the opportunities,
    it’s best to have a working knowledge about it. Aside from learning the field
    and positioning yourself to become more valuable in your organization (or start
    a business focused in machine learning), studying machine learning can become
    an amazing experience for you. It’s not easy and it will take a lot of time. Even
    if you read this book 5 times, it won’t be enough to really explore the potential
    and current capabilities of machine learning. This is just the start of your journey.


    ## Who This Book is For


    Well, first you should now be at least comfortable with programming and Python.
    We’ll give a crash course here and discuss the most important things about Python
    and programming. And you can always do a Google search whenever you’re stuck or
    unfamiliar with something (Stack Overflow and Stack Exchange are really good resources
    and communities).


    Many other readers picked up this book because they want to shift to a new career
    (data scientist and machine learning engineer are the hottest jobs right now and
    the pay’s just incredible). Aside from awesome financial incentives (including
    a very cool tech office), machine learning engineers have the chance of working
    with the brightest minds from different fields. In fact, some who have PhDs in
    physics and statistics applied their expertise in tackling machine learning challenges.


    There are also other readers who are just curious about machine learning. What
    is it and does it have the potential to wipe out humans? We can’t give a definitive
    answer to that because even experts are clueless of what the potential opportunity
    and threat machine learning can really bring. If you want to figure it out yourself
    and satisfy your curiosity, read on and hopefully search for other resources so
    you can learn more.


    ## Overview of what you’ll learn


    Our goal here is to show you examples and insights on how to do machine learning
    (step by step as promised) so in the near future, you can initiate and handle
    projects on your own. More importantly, we’ll focus on how to think properly about
    machine learning (gaining the understanding). Tools and techniques come and go
    but if you have a solid foundation, you’ll always be in a position to take advantage
    of this yet developing technology.


    To start, we’ll download and install the necessary tools to get you going. Here
    we’ll be using mostly Python, Anaconda, Jupyter Notebook, and TensorFlow. Next
    is you’ll get a Python crash course so you can quickly review the most important
    concepts and dive straight to machine learning next.


    To motivate you, we’ll quickly explore a simple (and popular) example of the use
    of machine learning (Titanic Survival Prediction). It’s a general example that
    has wide applications and implications. Once you understand how to predict survival
    rates, you’ll be half-ready to tackle many machine learning projects.


    It was just half of the battle. You should then get a solid foundation about machine
    learning (Supervised Learning, Unsupervised Learning, Deep Learning). We’ll explore
    several examples so you can really see the potential and current applications
    of machine learning. Then also in the succeeding chapters we’ll discuss each one
    of those in detail.


    Near the end we’ll discuss how to improve our machine learning model. We’ll try
    to improve the accuracy and performance of our model so it can be more useful
    for predictions, optimizations, and other applications.


    After reading this book and following through the examples, you’ll be in a better
    position to know whether machine learning is just hype or not. But this is just
    the beginning. Although this is a step-by-step machine learning guide using Python
    3, it’s always good to continue the journey and stay curious about what the field
    and future holds.


    ## Why this book?


    This book is written to help you learn machine learning using Python programming.
    If you are an absolute beginner in this field, you’ll find that this book explains
    complex concepts in an easy to understand manner without math or complicated theorical
    elements. If you are an experienced data scientist, this book gives you a good
    base from which to explore machine learning application.

