    ![](images/00086.jpeg)


    Decision trees are a machine learning algorithm that rely heavily on the entropy
    of an attribute and the information gain to determine how to classify samples
    in a classification problem. Let us look at decision trees in depth in the next
    section.


    Creating a Decision Tree


    A decision tree is a machine learning algorithm which is mainly used for classification
    that constructs a tree of possibilities where the branches in the tree represents
    decisions and the leaves represents label classification. The purpose of a decision
    tree is to create a structure where samples in each branch are homogenous or of
    the same type. It does this by splitting samples in the training data according
    to specific attributes that increase homogeneity in branches. These attributes
    form the decision node along which samples are separated. The process continues
    until all sample are correctly predicted as represented by the leaves of the tree.


    To explain the concept of a decision tree further, let us look at a toy example
    below that demonstrates its capability.


    ![](images/00087.jpeg)


    Let us assume that we are a laptop manufacturer and we want to predict which customers
    from an online store are likely to buy our new top of the range laptop, so that
    we can focus our marketing efforts accordingly. This problem can be modelled using
    a decision tree with two classes (yes or no), for whether a person is likely to
    purchase or not.


    At the root of the tree, we want to choose an attribute about customers that reduces
    entropy the most. As we saw in the last section, by reducing the entropy, we increase
    the amount of knowledge that is contained in the system. We choose the appropriate
    attribute by calculating the entropy of each branch and the entropy of the targets
    (yes or no). The information gain is closely related to the entropy and is defined
    as the difference in entropy of the targets (final entropy) and the entropy given
    a particular attribute was chosen as the root node.


    ![](images/00088.jpeg)


    The formula above is used to calculate the decrease in entropy. The attribute
    with the largest information gain or decrease in entropy is chosen as the root
    node. This means that the attribute reduces the decision space the most when compared
    to other attributes. The process is repeated to find other decision nodes via
    attributes until all samples are correctly classified through the leaves of the
    decision tree.


    In  the example above, age is the attribute that offers the most information gain
    so samples are split on that decision node. If the customer is middle aged, then
    they are likely to purchase a new laptop as they are probably working and have
    higher spending power. If the customer is a youth this brings us to another decision
    node. The attribute used is whether the youth is a student or not. If the youth
    is a student, they are likely to buy else they are not. That brings us to the
    leaves (classes) of the node following the youth branch of the tree. For the senior
    branch, we again split samples on an informative attribute, in this case credit
    rating. If the senior has an excellent credit rating that means they are likely
    to buy, else the leaf or classification for that sample along this branch of the
    tree is no.


    Let us now work on an example using Python, Scikit-Learn and decision trees. We
    would tackle a multi-class classification problem where the the challenge is to
    classify wine into three types using features such as alcohol, color intensity,
    hue etc. The data we would use comes from the wine recognition dataset by UC Irvine.
    It can be downloaded at [https://gist.github.com/tijptjik/9408623/archive/b237fa5848349a14a14e5d4107dc7897c21951f5.zip](https://gist.github.com/tijptjik/9408623/archive/b237fa5848349a14a14e5d4107dc7897c21951f5.zip)


    First, lets load the dataset and use Pandas head method to have a look at it.


    import numpy as np


    import pandas as pd


    import matplotlib.pyplot as plt


    \# comment the magic command below if not running in Jupyter notebook


    %matplotlib inline


    dataset = pd.read\_csv(''wine.csv'')


    dataset.head(5)


    ![](images/00089.jpeg)


    There are 13 predictors and the first column “wine” contains the targets. The
    next thing we do is split the dataset into predictors and targets, sometimes referred
    to as features and labels respectively.


    features = dataset.drop(\[''Wine''\], axis=1)


    labels = dataset\[''Wine''\]


    As is the custom to ensure good evaluation of our model, we divide the dataset
    into a train and test split.


    from sklearn.model\_selection import train\_test\_split


    features\_train, features\_test, labels\_train, labels\_test = train\_test\_split(features,
    labels, test\_size=0.25)


    All that is left is for us to import the decision tree classifier and fit it to
    our data.


    from sklearn.tree import DecisionTreeClassifier


    classifier = DecisionTreeClassifier()


    classifier.fit(features\_train, labels\_train)


    We can now evaluate the trained model on the test set and print out the accuracy.


    pred = classifier.predict(features\_test)


    from sklearn.metrics import accuracy\_score


    accuracy = accuracy\_score(labels\_test, pred)


    print(''Accuracy: {:.2f}''.format(accuracy))


    ![](images/00090.jpeg)


    We achieve an accuracy of 0.91 which is very impressive. It means that 91% of
    samples in our test set were correctly classified.


    Random Forests


    Random forests are a type of ensemble model. An ensemble model is one which is
    constructed from other models. This means that it is a combination of several
    weak learners to form a strong learner. The prediction of an ensemble model may
    be the average or weighted average of all learners that it is comprised of.


    Random forests are an extension of decision trees whereby several decision trees
    are grown to form a forest. The final prediction of a random forest model is a
    combination of all component decision trees. For regression it may be a simple
    average of outputs or a label vote in the case of classification. Though random
    forest are made of several decision trees, each decision tree is trained on a
    subset of data that is randomly selected hence the name random forest. The other
    trick of random forest is that unlike a decision tree where the best attribute
    is chosen in order to split samples at a decision node from all available attributes,
    random forest only picks the best attribute from a subset of randomly chosen attributes
    for each decision node. As a result, each node in a tree is not deterministic,
    that is for each time we run the algorithm, we are likely to end up with different
    tree structures. However, the most informative attributes still find their way
    to trees in the forest and are present across many trees. This makes the results
    of the random forest algorithm to be less prone to errors due to variations in
    the input data.


    The subset of data on which a decision tree that makes up a random forest is trained
    on is called bagged data and is usually around 60% of the entire dataset. The
    remainder on which the performance of individuals trees are tested on is known
    as the out-of-bag data. Therefore each tree in the forest is trained and evaluated
    on a different subset of data through the randomization process.


    ![](images/00091.jpeg)


    The image above shows a pictorial representation of random forests. It is made
    up of several trees trained on different instances of the dataset. The attributes
    in each decision node are also randomized. Finally, the output prediction is an
    ensemble of the classification of each decision tree.'
