    Calculating Similarity


    In the last section, we successfully prepared our data and explained  the inner
    workings of the K-NN algorithm at a high level. We would now implement a working
    version in Python. The most important part of K-NN algorithm is the similarity
    metric which in this case is a distance measure. There are several distance metrics
    but we would use Euclidean distance which is the straight line distance between
    two points in a Euclidean plane. The plane may be 2-dimensional, 3-dimensional
    etc. Euclidean distance is sometimes referred to as L2 distance. It is given by
    the formula below.


    ![](images/00079.gif)


    The L2 distance is computed from the test sample to every sample in the training
    set to determine how close they are. We can implement L2 distance in Python using
    Numpy as shown below.


    def euclidean\_distance(training\_set, test\_instance):


        # number of samples inside training set


        n\_samples = training\_set.shape\[0\]


        # create array for distances


        distances = np.empty(n\_samples, dtype=np.float64)


        # euclidean distance calculation


        for i in range(n\_samples):


            distances\[i\] = np.sqrt(np.sum(np.square(test\_instance - training\_set\[i\])))


        return distances


    Locating Neighbors


    Having implemented the similarity metric, we can build out a full fledged class
    that is capable of identifying nearest neighbors and returning a classification.
    It should be noted that the K-Nearest Neighbor algorithm has no training phase.
    It simply stores all data points in memory. It only performs computation during
    test time when it is calculating distances and returning predictions. Here is
    an implementation of the K-NN algorithm that utilizes the distance function defined
    above.


    class MyKNeighborsClassifier():


        """


        Vanilla implementation of KNN algorithm.


        """


        def \_\_init\_\_(self, n\_neighbors=5):


            self.n\_neighbors=n\_neighbors


        def fit(self, X, y):


            """


            Fit the model using X as array of features and y as array of labels.


            """


            n\_samples = X.shape\[0\]


            # number of neighbors can''t be larger then number of samples


            if self.n\_neighbors > n\_samples:


                raise ValueError("Number of neighbors can''t be larger then number
    of samples in training set.")


            # X and y need to have the same number of samples


            if X.shape\[0\] != y.shape\[0\]:


                raise ValueError("Number of samples in X and y need to be equal.")


            # finding and saving all possible class labels


            self.classes\_ = np.unique(y)


            self.X = X


            self.y = y


        def pred\_from\_neighbors(self, training\_set, labels, test\_instance, k):


            distances = euclidean\_distance(training\_set, test\_instance)


            # combining arrays as columns


            distances = sp.c\_\[distances, labels\]


            # sorting array by value of first column


            sorted\_distances = distances\[distances\[:,0\].argsort()\]


            # selecting labels associeted with k smallest distances


            targets = sorted\_distances\[0:k,1\]


            unique, counts = np.unique(targets, return\_counts=True)


            return(unique\[np.argmax(counts)\])


        def predict(self, X\_test):


            # number of predictions to make and number of features inside single sample


            n\_predictions, n\_features = X\_test.shape


            # allocationg space for array of predictions


            predictions = np.empty(n\_predictions, dtype=int)'
