    data. Count data are integer values that can only be positive. Poisson regression
    assumes that the independent variable `y`, belongs to a Poisson distribution,
    which is a type of exponential probability distribution. The main difference between
    Poisson regression and linear regression is that linear regression assumes the
    outputs are drawn from a normal distribution whereas Poisson distribution assumes
