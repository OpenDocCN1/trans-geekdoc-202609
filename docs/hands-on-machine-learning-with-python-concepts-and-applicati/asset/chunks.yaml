    ## Numerical Python (NumPy)


    **NumPy** 是 Python 中主要的数值计算库。它提供对多维数组对象的访问，并通过若干方法暴露了可对这些数组执行的操作。它支持线性代数运算，如矩阵乘法、内积、单位运算等。`NumPy`
    与用 C 和 Fortran 编写的底层库进行交互，并将实际计算传递给这些更快、更高效的库。因此，在执行数值计算时，绝不使用原生 Python 控制结构（如循环），因为它们要慢得多。`NumPy`
    可以被视为提供了一组 Python API，从而实现高效的科学计算。


    `NumPy` 数组可以通过嵌套的 Python 列表来初始化。嵌套的层级指定了数组的秩。


    ```python

    import numpy as np


    a = np.array([[1, 2, 3], [4, 5, 6]])  # 创建一个秩为 2 的数组

    print(type(a))

    print(a.shape)

    ```


    ![数组输出](img/00012.jpeg)


    创建的数组秩为 2，这意味着它是一个矩阵。从打印的数组大小可以清楚地看到这一点。它包含 2 行 3 列，因此大小为 `(m, n)`。


    数组也可以从分布（如正态分布）中随机初始化。模型的可训练参数（如权重）通常随机初始化。


    ```python

    b = np.random.random((2, 2))  # 创建一个填充随机值的数组

    print(b)

    print(b.shape)

    ```


    ![随机数组输出](img/00013.jpeg)


    `NumPy` 包含许多用于操作数组的方法；其中一种方法是矩阵乘积。让我们看一个使用 `NumPy` 进行矩阵乘积的示例。


    ![矩阵乘积示例](img/00014.jpeg)


    ```python

    x = np.array([[1, 2], [3, 4]])

    y = np.array([[5, 6], [7, 8]])


    # 矩阵乘积

    print(np.dot(x, y))

    ```


    上述示例几乎是瞬间计算完成的，展示了 `NumPy` 的强大功能。


    ## Pandas


    **Pandas** 是一个用 Python 编写的数据操作库，具有用于表格和时间序列数据的高性能数据结构。`Pandas` 广泛用于数据分析，大多数数据加载、清洗和转换任务都在
    `Pandas` 中执行。`Pandas` 是 Python 数据科学生态系统不可或缺的一部分，因为数据很少以可以直接输入机器学习模型的形式存在。现实世界的数据通常很混乱，包含缺失值，并且需要转换。`Pandas`
    支持许多文件类型，如 CSV、Excel 电子表格、Python pickle 格式、JSON、SQL 等。


    `Pandas` 有两种主要数据结构：`Series` 和 `DataFrame`。`Series` 是单列数据的数据结构，而 `DataFrame` 存储类似于矩阵的二维数据。换句话说，`DataFrame`
    包含存储在许多列中的数据。


    下面的代码展示了如何在 `Pandas` 中创建 `Series` 对象。


    ```python

    import pandas as pd

    import numpy as np


    s = pd.Series([1, 3, 5, np.nan, 6, 8])

    print(s)

    ```


    要创建 `DataFrame`，可以运行以下代码。


    ```python

    df = pd.DataFrame(np.random.randn(6, 4), columns=list(''ABCD''))

    print(df)

    ```


    `Pandas` 将其支持的文件格式加载到 `DataFrame` 中，然后可以使用 `Pandas` 方法对 `DataFrame` 进行操作。


