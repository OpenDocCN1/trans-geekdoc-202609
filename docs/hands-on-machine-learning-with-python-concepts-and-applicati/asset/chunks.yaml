    \n回到 Parch（父母子女数）和 SibSp（兄弟姐妹配偶数）。其实可将二者合并为一个特征（为方便），命名为“FamilySize”（并与 Survived\
    \ 并列以获取洞察）：\n\n```python\nfor dataset in combine:\n    dataset['FamilySize'] =\
    \ dataset['SibSp'] + dataset['Parch'] + 1\n\ntrain_df[['FamilySize', 'Survived']].groupby(['FamilySize'],\
