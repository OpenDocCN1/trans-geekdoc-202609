    # Overview of Classification Algorithms


    A class or label can be understood as representing a specific number of categories;
    therefore, the role of a classification algorithm is to identify the category
    to which a sample belongs. If the classification problem setup contains two distinct
    classes, it is a binary classification problem. When the number of classes (labels)
    exceeds two, the learning problem is called multi-class classification, indicating
    that an observation may fall into one of $n$ possible categories. The last type
    of classification is when a sample can belong to multiple classes (i.e., have
    multiple labels), in which case we are dealing with a multi-label classification
    task.


    To understand classification more intuitively, please refer to the figure below:


    ![](img/00112.jpeg)


    As can be seen from the figure above, there are two features describing the data:
    `X1` and `X2`. The classification task aims to divide the data into different
    categories such that there exists a decision boundary that best separates the
    classes. In this example, there are two classes—bankrupt companies and surviving
    companies—and the data points representing companies can only belong to one of
    these two categories. This is clearly a binary classification example because
    there are only two classes.


    Another point worth noting in the figure is that the classes are linearly separable,
    meaning they can be separated by a straight line. In other problems, this may
    not be achievable, but there are more robust machine learning algorithms that
    can handle such situations.


    ## Multi-class Classification


    We must understand classification deeply based on the number of predicted classes
    because classification has many real-world applications. To further deepen intuition,
    please analyze the figure below:


    ![](img/00113.jpeg)


    The data is projected onto a 2D plane for visualization. There are three classes,
    represented by red squares, blue triangles, and green circles, respectively. There
    are also three decision boundaries dividing the data points into three regions,
    with the class colors projected onto the background. This is a classic three-class
    (0, 1, 2) multi-class classification example; although there are some misclassified
    points, they are few in number and mostly appear near the decision boundaries.


    When evaluating this model, we will use accuracy as the evaluation metric. Model
    accuracy is determined by the ratio of samples correctly predicted by the classifier
    to misclassified samples. Accuracy is usually a good metric for classification
    tasks, but remember there are other metrics such as precision and recall that
    can be explored depending on the modeling intent.


    ## Common Classification Algorithms


    Some machine learning models perform exceptionally well on classification tasks,
    and a few of them will be analyzed in depth in the following sections. The workflow
    for running a classification task is fairly standard across models.


    First, we need a dataset containing a set of inputs and a corresponding set of
    labels. This is important because classification is a supervised learning task;
    we need to obtain the true classes (ground truth) of observations to minimize
    the model''s misclassification error. Therefore, to get a good model, we train
    the classifier on samples and provide the true values via a feedback mechanism,
    forcing the classifier to learn and reduce the error rate with each iteration
    or pass through the training set (epoch).


    Examples of models used for classification include Logistic Regression, Decision
    Trees, Random Forest, K-Nearest Neighbors, Support Vector Machines, etc. We will
    practice classification using the last two models as case studies.


    ## Support Vector Machines


    Support Vector Machines (SVM), also known as Support Vector Networks, are a popular
    machine learning algorithm for classification. The core intuition of SVM is to
    find an optimal hyperplane that separates the data into the correct classes using
    only the data points close to the hyperplane. The data points closest to the hyperplane
    are called support vectors.


    There may be multiple hyperplanes that can correctly separate the classes, but
    the SVM algorithm selects the hyperplane with the maximum distance (margin) to
    the support vectors. The benefit of choosing the hyperplane with the widest margin
    is that it reduces the probability of misclassifying data points during testing.


    ![](img/00114.jpeg)


    The SVM algorithm is robust to outliers in the class distribution; it works by
    ignoring outliers when searching for the best hyperplane with a good margin width.


    However, data distributions are not always linearly separable. SVMs transform
    the features representing the data from a low-dimensional space to a high-dimensional
    space by introducing new features based on the original features. This process
    is performed automatically via kernel functions. Examples of kernel functions
    in SVM include Linear, Polynomial, Radial Basis Function (RBF), and others.


    Compared to other machine learning models, SVMs have several advantages. They
    perform particularly well in high-dimensional spaces and are memory-efficient
    and computationally efficient because they rely only on a subset of data points
    (support vectors) for classification. They are also versatile because we can choose
    different kernel functions depending on the data representation at hand.


    ## How to Create and Test a Support Vector Machine Classifier


    In this section, we will use an SVM classifier on the Pima Indians Diabetes dataset
    and compare its results with a K-Nearest Neighbors classifier.


    The complete code is as follows:


    ```python

    # import libraries

    import numpy as np

    import pandas as pd

    import matplotlib.pyplot as plt


    # read dataset from csv file

    dataset = pd.read_csv(''diabetes.csv'')


    # create features and labels

    features = dataset.drop([''Outcome''], axis=1)

    labels = dataset[''Outcome'']


    # split dataset into training set and test set

    from sklearn.model_selection import train_test_split

    features_train, features_test, labels_train, labels_test = train_test_split(features,
    labels, test_size=0.25)


    # import support vector machine classifier

    from sklearn.svm import SVC

    classifier = SVC()


    # fit data

    classifier.fit(features_train, labels_train)


    # get predicted class labels

    pred = classifier.predict(features_test)


    # get accuracy of model on test set

    from sklearn.metrics import accuracy_score

    accuracy = accuracy_score(labels_test, pred)

    print(''Accuracy: {}''.format(accuracy))

    ```


    We obtained an accuracy of 0.66, which is worse than the 0.74 of the K-Nearest
    Neighbors classifier. There are many hyperparameters to try, such as changing
    the type of kernel function used.


    ```python

    from sklearn.svm import SVC

    classifier = SVC(kernel=''linear'')

    ```


    When we use a linear kernel, the accuracy jumps to 0.76. This is an important
    lesson in machine learning: we often cannot know in advance what the best hyperparameters
    are. Therefore, we need to try multiple values to determine the best-performing
    hyperparameters.


