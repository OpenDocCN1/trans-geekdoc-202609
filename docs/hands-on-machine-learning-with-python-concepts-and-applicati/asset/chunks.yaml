    # Network Analysis


    Betweenness centrality


    Graphs are a  type of data structure used to represent data that features high
    connectivity, that is the data has relationships that makes it connected. Network
    theory is the study of graphs as a way to understand the relationships between
    entities that made up a graph. Many kinds of analytical problems can be modelled
    as a graph problem, however it is best to use graphs when the data increases in
    complexity because of its interconnectedness. A very popular example of this kind
    of data is social media data which can be argued to possess an inherent network
    structure. Analysis of such data would not be well suited to traditional techniques
    as found in relational databases. Social media data can therefore be modelled
    as a graph network where vertices or nodes are connected to each other. Nodes
    could represent entities like people and edges could represent relationships.
    Modelling the data this way enables us to answer important questions about the
    nature of relationships between people and how people are likely to react to events
    given the reaction of their inner circle.


    This brings us to the notion of centrality in network analysis. Centrality can
    be defined as determining which nodes or in our case people, are important to
    a particular network. Another way of framing this is, what node or entity is central
    to the way a network operates. There are many ways in which importance can be
    calculated in a network and these are known as centrality measures. Some of them
    are degree centrality, closeness centrality, betweenness centrality and eigenvector
    centrality.


    ![](images/00110.jpeg)


    The image above is a network showing a graph representation of friends in a social
    context. The nodes represents individuals while the edges represents relationships.
    This is an example of an undirected graph. What that means is that the connections
    (edges) has no sense of direction. If we want to find out who is important in
    this network, we would use any of the centrality measures listed above.


    Degree centrality is the number of edges connected to a node, it can be thought
    of as popularity or the exposure to the network. Even Though it is a very simple
    metric, it can be effective in some cases. Closeness centrality measures the average
    distance between a node and all other nodes in a network. It can be seen as having
    indirect influence on a network or the point through which information can be
    disseminated easily through a network.


    Betweenness centrality measures how often a node is between the shortest path
    to any two randomly chosen nodes. In other words, betweenness is a measure of
    how many times a node acts as a bridge between the shortest path of any two nodes
    in the network. Betweenness centrality can be seen as conferring informal power
    on a node in terms of a node being a sort of gatekeeper or broker between parts
    of the network. Betweenness centrality of a node v can be expressed mathematically
    as:


    ![](images/00111.jpeg)


    Where the denominator is the total number of the shortest paths from nodes s to
    t and the numerator is the number of those shortest paths that go through node
    v.


    Eigenvector Centrality


    Eigenvector centrality is a centrality measure that not only considers how many
    nodes a particular node is connected to, but factors in the quality or importance
    of such nodes in its calculation. Intuitively, eigenvector centrality measures
    “not what you know but who you know”. So the centrality of every node is calculated
    based on the quality of its connections and not just the number of connections
    as is the case in degree centrality. Eigenvector centrality can be seen as a measure
    of the extent to which a node is connected to other influential nodes.


    Google at its core uses the Pagerank algorithm which is a variant of eigenvector
    centrality to rank the relevancy of results based on users search queries. The
    intuition is that websites are modelled as nodes on a network and the entire world
    wide web is represented as one big network. Nodes (websites) would be ranked higher
    based on the quality or reputation of other websites that point to them. Merely
    increasing the number of links that point to a site does not increase its influence
    in terms of how it is ranked in search results. Links that point to a website
    have to come from important websites for the ranking of a particular website to
    increase. This is sensible as popular websites are more likely to point to the
    most relevant content. Eigenvector centrality is a powerful metric that is used
    in analyzing networks.


    Recommender Systems


    The information overload as occasioned by the internet has lead to a paralysis
    of sorts as users are overwhelmed with variety of choices. Recommender systems
    are a way through which information is filtered so that the most relevant content
    are shown to users. Recommender systems seek to predict the preference a user
    would give to an item or product in light of their past interaction or behaviors
    on a platform. It is one of the most commercially viable use cases of machine
    learning as companies from Amazon to Netflix all have a business model that benefits
    enormously from showing relevant content to users in order to increase sales or
    interaction with their platforms.


    Recommender systems are divided into three broad categories based on the techniques
    they employ. There are content based filtering, collaborative filtering and hybrid
    recommender systems. Content based filtering relies on the features of an item
    and a user’s profile. Items are recommended based on how similar they are to a
    user’s tastes. A movie for example may have features such as actors, genre, director
    etc. A user with particular preferences would get recommendations of movies whose
    features match the user’s information.


    Collaborative filtering makes use of a user’s past behavior, preferences etc 
    in combination with the preferences of other users to determine items that are
    recommended. Users are likely to appreciate items that are liked by other users
    with similar preferences.


    Hybrid recommender systems combines approaches from content based filtering and
    collaborative filtering. They may  be used to manage the shortcomings of any particular
    approach example when a new item is added and we do not yet have enough information
    about that item or when users have not had many interactions on the platform to
    be able to accurately gauge their preferences.


    Classification


    In machine learning most learning problems can be modelled as a classification
    problem. A classification problem is one whose core objective is to learn a mapping
    function from a set of inputs to one or more discrete classes. Discrete classes
    are sometimes referred to as labels and both terms are often used interchangeably.'
