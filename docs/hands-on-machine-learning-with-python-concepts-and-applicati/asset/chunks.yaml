    # Scipy


    Scipy is a scientific computing library geared towards the fields of mathematics,
    science and engineering. It is built on top of Numpy and extends it by providing
    additional modules for optimization, technical computing, statistics, signal processing
    etc. Scipy is mostly used in conjunction with other tools in the ecosystem like
    Pandas and matplotlib.


    Here is a simple usage of scipy that finds the inverse of a matrix.


    ```python

    from scipy import linalg


    z = np.array([[1,2],[3,4]])


    print(linalg.inv(z))

    ```


    ![](images/00015.gif)


    # Matplotlib


    Matplotlib is a plotting library that integrates nicely with Numpy and other numerical
    computation libraries in Python. It is capable of producing quality plots and
    is widely used in data exploration where visualization techniques are important.
    Matplotlib exposes an object oriented API making it easy to create powerful visualizations
    in Python. Note that to see the plot in Jupyter notebooks you must use the `matplotlib
    inline` magic command.


    Here is an example that uses Matplotlib to plot a sine waveform.


    ```python

    # magic command for Jupyter notebooks

    %matplotlib inline


    import matplotlib.pyplot as plt


    # compute the x and y coordinates for points on a sine curve

    x = np.arange(0, 3 * np.pi, 0.1)

    y = np.sin(x)


    # plot the points using matplotlib

    plt.plot(x, y)

    plt.show()  # Show plot by calling plt.show()

    ```


    ![](images/00016.jpeg)


    # Scikit-Learn


    Scikit-Learn is the most popular machine learning library in the Python ecosystem.
    It is a very mature library and contains several algorithms for classification,
    regression and clustering. Many common algorithms are available in Scikit-Learn
    and it exposes a consistent interface to access them, therefore learning how to
    work with one classifier in Scikit-Learn means that you would be able to work
    with others as the names of the methods that are called to train a classifier
    are the same regardless of the underlying implementation.


    We would rely heavily on Scikit-Learn for our modelling tasks as we dive deeper
    into data science in the following sections of this book. Here is a simple example
    of creating a classifier and training it on one of the bundled datasets.


    ```python

    # sample decision tree classifier

    from sklearn import datasets

    from sklearn import metrics

    from sklearn.tree import DecisionTreeClassifier


    # load the iris datasets

    dataset = datasets.load_iris()


    # fit a CART model to the data

    model = DecisionTreeClassifier()

    model.fit(dataset.data, dataset.target)

    print(model)


    # make predictions

    expected = dataset.target

    predicted = model.predict(dataset.data)


    # summarize the fit of the model

    print(metrics.classification_report(expected, predicted))

    print(metrics.confusion_matrix(expected, predicted))

    ```


