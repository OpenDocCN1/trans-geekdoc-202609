  fmt: '

    # Machine Learning Overview


    Machine learning has recently been attracting attention in the media for several
    reasons, mainly because it has achieved impressive results in various cognitive
    tasks such as image classification, natural language understanding, customer churn
    prediction, etc. However, it has been regarded as some sort of magic formula that
    is capable of predicting the future, but what really is machine learning?


    Machine learning at its simplest form is all about making computers learn from
    data by improving their performance at a specific task through experience. Similar
    to the way humans learn by trying out new things and learning from the experience,
    machine learning algorithms improve their capability by learning patterns from
    lots of examples. The performance of these algorithms generally improves as they
    are exposed to more data (experience). Machine learning is therefore a branch
    of artificial intelligence that aims to make machines capable of performing specific
    tasks without being explicitly programmed. What this means is that these algorithms
    are not rule-based; the entire learning process is constructed in such a way as
    to minimize or completely eliminate human intervention.


    Machine learning algorithms are typically used for a wide range of learning problems
    such as classification, regression, clustering, similarity detection, etc. Many
    applications used in the real world today are powered by machine learning. Applications
    such as personal assistants on mobile phones use machine learning algorithms to
    understand voice commands spoken in natural language; mobile keyboards predict
    the next word a user is typing based on previous words; email clients offer a
    smart reply feature whereby the content of an email is scanned and appropriate
    responses are generated; e-commerce applications offer recommendations to users
    based on previous purchases and spending habits, etc. Nearly every industry would
    be impacted by machine learning as most processes can be automated given that
    there is enough training data available. Machine learning algorithms mostly excel
    in tasks where there is a clear relationship between a set of inputs and outputs
    which can be modelled by training data. Although machine learning is a rapidly
    improving field, there is as of now no notion of general intelligence of the form
    displayed by humans. This is because models trained on one task cannot generalize
    the knowledge gleaned to perform another task; that is, machine learning algorithms
    learn narrow verticals of tasks.


    ## Three Main Branches of Machine Learning


    There are three main branches of machine learning namely: supervised learning,
    unsupervised learning, and reinforcement learning. In some cases a fourth branch
    is mentioned: semi-supervised learning, but this is really just a special instance
    of supervised learning as we would see in the explanations below.


    ### Supervised Learning


    It’s about learning from labelled data (e.g., Survived or Not Survived) and then
    applying that learning into “unseen” data. As you might have realized already,
    Titanic Survival Prediction falls into this category.


    In particular, that example falls in Classification. In other words, this Supervised
    Learning task focused on “classifying.” Another subcategory aside from Classification
    is Regression. In Regression, the goal is to predict a value based on the relationship
    among variables (e.g., What is the cost of a house given how large it is in terms
    of square meter?). Regression is still about learning from “labelled” data because
    the model learns from A corresponds to B, C corresponds to D, and so on (this
    is just an illustration). It’s still learning from previous data and applying
    that learning to predict a value.


    Anyway, if you pursue a machine learning career or build a startup with a heavy
    focus on this exciting field, you might do a lot of Supervised Learning. Keep
    in mind that it’s about prediction, whether predicting which category should an
    item belong to (Classification) or predicting a numerical value based on the relationship
    between the variables and the target (Regression).


    ### Unsupervised Learning


    In contrast, Unsupervised Learning is about learning from unstructured data (no
    labels). We can think of it as allowing the model to freely learn from and work
    on the data (no supervision or training as opposed to Supervised Learning wherein
    there are training sets and test sets).


    Often the goal in Unsupervised Learning is to find hidden patterns and reveal
    the organic clusters that formed among the data points. This is the essence of
    Clustering (we’ll also discuss this in a separate chapter) where the goal is to
    reveal the natural aggregation of data points. This is very useful in data visualization
    and discovering the intrinsic structures in the data set.


    ### Semi-supervised Learning Algorithms


    Semi-supervised learning algorithms are a special case of supervised learning
    algorithms. In semi-supervised learning, while there isn’t an explicit label,
    there exist an implicit heuristic which serves as a supervisor in the training
    loop. Semi-supervised models do not contain any external source of labels but
    only rely on input features. However, the learning task is set up in such a way
    that supervision still takes place in the form of extraction of pseudo-labels
    from inputs through a heuristic algorithm. A popular example of semi-supervised
    learning algorithms are autoencoders. Let us look at an example to expand our
    understanding.


    ![](images/00050.jpeg)


    In the autoencoder above, the learning task is to reduce the dimensions of the
    input into a smaller latent space representing the most important hidden features,
    then reconstruct the input from this lower dimensional space. So given an input,
    example an image, an autoencoder shrinks the image into a smaller latent representation
    that still contains most of the information about the image, then reconstructs
    the original input image from this low dimensional space. Even if there are no
    explicit labels, it would be observed that the input serves as the supervisor
    since the learning task is to reconstruct the input. Once such a model is trained
    to compress features into a smaller dimension, the compressed features can serve
    as the starting point of a supervised learning algorithm similar to dimensionality
    reduction using PCA. The first part of the network that reduces the dimensions
    of the input is called an encoder while the second part that scales the encoded
    features back to the full size input is called the decoder.


    ### Reinforcement Learning Algorithms


    In reinforcement learning there are three main components: an agent, an environment,
    and actions. The goal of reinforcement learning is to train an intelligent agent
    that is capable of navigating its environment and performing actions that maximizes
    its chances of arriving at some end goal. Actions carried out by the agent change
    the state of the environment and rewards or punishment may be issued based on
    the actions taken by the agent. The challenge is for the agent to maximize the
    accumulated rewards at the end of a specific period so that it can actualize an
    end goal (objective).


    ![](images/00051.jpeg)


    In the schematic diagram of reinforcement learning above, an agent (the reinforcement
    learning) interacts with the world (environment) through actions. The environment
    provides observations and rewards to the agent based on the kind of action taken
    by the agent. The agent uses this feedback to improve its decision making process
    by learning to carry out actions associated with positive outcomes.


    ## Deep Learning


    Actually, Deep Learning can cover both Supervised Learning and Unsupervised Learning.
    That’s because with Deep Learning you can do Regression, Classification, and Clustering.

    '
