- raw: 'The dataset contains many informative attributes such as account balance,
    number of products subscribed to, credit card status, estimated customer salary
    etc. The target variable is whether or not the customer left the bank, so this
    is a binary classification task. There are also some categorical features such
    as gender and geography which we would need to transform before feeding them into
    a neural network.


    The churn modelling dataset can be downloaded at:


    [https://www.kaggle.com/aakash50897/churn-modellingcsv/data](https://www.kaggle.com/aakash50897/churn-modellingcsv/data)


    As always we first import all relevant libraries, load the dataset using Pandas
    and call the head method on the dataset to see what is contained inside.


    \# import all relevant libraries


    import numpy as np


    import matplotlib.pyplot as plt


    import pandas as pd


    import tensorflow as tf


    import tflearn


    \# load the dataset


    dataset = pd.read\_csv(''Churn\_Modelling.csv'')


    \# get first five rows (observations)


    dataset.head()


    ![](images/00120.jpeg)


    The dataset contains 14 columns, the first 3 columns are uninformative namely
    RowNumber, CustomerId and Surname. Those three columns can be seen as identifiers
    as they do not provide any information which would give insights to whether a
    customer would stay or leave. They would be removed before we perform analysis.
    The last column - Exited is the class label which our model would learn to predict.


    The next step having gotten an overview of the dataset is to split the columns
    into features and labels. We do this using Pandas slicing operation which selects
    information form specified indexes. In our case, features start from the 3rd column
    and ends in the 12th column. Remember that array indexing starts at 0 not 1.


    X = dataset.iloc\[:, 3:13\].values


    y = dataset.iloc\[:, 13\].values


    Since we have categorical features in the dataset (Geography and Gender), we have
    to convert them into a form that a deep learning algorithm can process. We do
    that using a one-hot representation. One-hot representation creates a sparse matrix
    with zeros in all positions and a 1 at the position representing the category
    under evaluation. We use Scikit-Learn’s preprocessing model to first create a
    label encoder, then create a one-hot representation from it.


    \# encoding categorical data


    from sklearn.preprocessing import LabelEncoder, OneHotEncoder


    labelencoder\_X\_1 = LabelEncoder()


    X\[:, 1\] = labelencoder\_X\_1.fit\_transform(X\[:, 1\])


    labelencoder\_X\_2 = LabelEncoder()


    X\[:, 2\] = labelencoder\_X\_2.fit\_transform(X\[:, 2\])


    onehotencoder = OneHotEncoder(categorical\_features = \[1\])


    X = onehotencoder.fit\_transform(X).toarray()


    X = X\[:, 1:\]


    We split our data into training and test set. One would be used to train the model
    while the other would be use to test performance.


    \# spliting the dataset into the training set and test set


    from sklearn.model\_selection import train\_test\_split


    X\_train, X\_test, y\_train, y\_test = train\_test\_split(X, y, test\_size = 0.2,
    random\_state = 0)


    y\_train = np.reshape(y\_train, (-1, 1)) # reshape y\_train to \[None, 1\]


    y\_test = np.reshape(y\_test, (-1, 1)) # reshape y\_test to \[None, 1\]


    The features as currently contained in X are not in the same scale so we apply
    standard scaling which makes all features to have a mean of 0 and a standard deviation
    of 1.


    \# feature scaling


