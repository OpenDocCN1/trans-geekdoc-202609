    Numerical Python (Numpy)


    Numpy is the main numerical computing library in Python. It provides access to
    a multidimensional array object and exposes several methods through which operations
    can be done on these arrays. It features support for linear algebra operations
    such as matrix multiplication, inner product, identity operations etc. Numpy interfaces
    with low level libraries written in C and Fortran and passes off actual computation
    to these faster and more efficient libraries. As a result, vanilla Python control
    structures like loops are never used when performing numerical computation because
    they are significantly slower. Numpy can be seen as providing a set of Python
    APIs which enables efficient scientific computing.


    Numpy arrays can be initiated by nested Python lists. The level of nesting specifies
