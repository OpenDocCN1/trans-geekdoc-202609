    The Curse of Dimensionality


    The K-Nearest Neighbor algorithm performs optimally when the dimension of the
    input space is small as in this example. We had four predictors (sepal length,
    sepal width, petal length, petal width) going into the algorithm. K-NN struggles
    in high dimensional input spaces like those encountered in images. This is because
    the similarity measure as expressed by the distance metric is very limited and
    cannot properly model this high dimensional space. In general, machine learning
    algorithms try to reduce the number of dimensions so that intuitions we have about
    low dimensional spaces would still hold true. The accuracy or performance of algorithms
    usually suffer when the number of dimensions increase. This is known as the curse
    of dimensionality.


    # Naive Bayes


    Applications of Naive Bayes


    Naive Bayes algorithm is an eager learning algorithm based on Bayes theorem with
    the assumption that all features are independent given the class label. Naive
    Bayes algorithm is well suited to text classification as its test time prediction
    is quick and as a result it can be deployed on a large dataset for inference.


    Naive Bayes is usually used in applications where predictions are desired in real
    time such as fraud detection on credit card transactions. In these applications,
    a classifier that is capable of performing almost instantaneously is desired.
    Naive Bayes is also used extensively in text classification, spam filtering and
    sentiment analysis. In spam filtering, the words of an email or text message serve
    as the input features to the model, with each word assumed to be independent of
    others. Naive Bayes usually produces good results when this independent assumption
    holds true and coupled with its short inference time is sometimes preferred over
    more complicated classifiers.


    Another area where Naive Bayes algorithm is widely used is in multi-class classification.
    In this domain, multiple classes or categories can be predicted given input features,
    with probabilities assigned to the predicted classes.


    How to Build a Basic Model Using Naive Bayes in Python


    For our hands on example we would build a Naive Bayes model in Python to tackle
    a spam classification problem. We would use the SMS spam collection dataset which
    is a set of 5,574 English text messages annotated to indicate the category. There
    are two categories - ham or legitimate messages and spam. The dataset can be downloaded
    from the following URL ([https://www.kaggle.com/uciml/sms-spam-collection-dataset/downloads/spam.csv/1](https://www.kaggle.com/uciml/sms-spam-collection-dataset/downloads/spam.csv/1)).


    We would use the multinomial Naive Bayes classifier from Scikit-Learn machine
    learning library. As always, we begin by importing the libraries we would utilize.


    import numpy as np


    import pandas as pd


    import matplotlib.pyplot as plt


    \# comment the magic command below if not running in Jupyter notebook


    %matplotlib inline


    Next we load the dataset using Pandas and display the first 5 rows.


    data = pd.read\_csv(''spam.csv'', encoding=''latin-1'')


    data.head(5)


    ![](images/00081.jpeg)


    The column “v1” contains the class labels while “v2” are the contents of the SMS
    which we would use as the features of our model.


    Let us plot a bar chart to visualize the distribution of legitimate and spam messages.


    count\_class = pd.value\_counts(data\[''v1''\], sort= True)


    count\_class.plot(kind=''bar'', color=\[\[''blue'', ''red''\]\])


    plt.title(''Bar chart'')


    plt.show()


    ![](images/00082.gif)


    The words cannot be fed directly into the model as the features, so we have to
    vectorize them to create new features. We do this by considering the frequency
    of words after removing words that commonly appear in English sentences like “the”,
    “a”, “of” etc. We can do this feature extraction easily by using Scikit-Learn.


    from sklearn.feature\_extraction.text import CountVectorizer


    f = CountVectorizer(stop\_words = ''english'')


    X = f.fit\_transform(data\["v2"\])


    print(np.shape(X))


    ![](images/00083.jpeg)


    After vectorization, 8,404 new features are created.


    Next we map our target variables into categories and split the dataset into train
    and test sets.


    from sklearn.model\_selection import train\_test\_split


    data\["v1"\]=data\["v1"\].map({''spam'':1,''ham'':0})


    X\_train, X\_test, y\_train, y\_test = train\_test\_split(X, data\[''v1''\], test\_size=0.25,
    random\_state=42)


    The next step involves initializing the Naive Bayes model and training it on the
    data.


    from sklearn.naive\_bayes import MultinomialNB


    clf = MultinomialNB()


    clf.fit(X\_train, y\_train)


    Finally, we gauge the model performance on the test set.


    score = clf.score(X\_test, y\_test)


    print(''Accuracy: {}''.format(score))


    ![](images/00084.jpeg)


    The Naive Bayes classifier attains an accuracy of 0.976, which means that it predicted
    the correct class for 97.6% of samples.


    # Decision Trees and Random Forest


    The Entropy of a Partition


    Entropy can be defined as the measure of uncertainty in a sequence of random events.
    It is the rate of disorderliness in a sample space and is directly opposed to
    knowledge. When the entropy of a system is high, the knowledge that can be derived
    from the system is low and vice versa. An intuitive understanding of entropy is
    thinking of it as the amount of questions required to ask to arrive at some knowledge.
    For example, if I picked a random number and you were trying to guess what number
    it is. Asking a question like, “Is it an odd number”, reduces the possibilities
    space by half. This means that the entropy or the degree of uncertainty in trying
    to determine which number I choose is reduced. In the same vein, the amount of
    information gain is large because the question moved you closer to the answer
    by dividing the sample space. Entropy usually ranges from 0 to 1. A system with
    an entropy of 0 is highly stable and the knowledge that can be derived from such
    a system is high. In general terms, low entropy in a system indicates high knowledge
    while high entropy indicates low knowledge or instability.


    Entropy can be represented mathematically as:


