    # K-Nearest Neighbors


    ## Introduction to K Nearest Neighbors


    To understand the k-nearest neighbor algorithm, we first need to understand nearest
    neighbor. Nearest neighbor algorithm is an algorithm that can be used for regression
    and classification tasks but is usually used for classification because it is
    simple and intuitive.


    At training time, the nearest neighbor algorithm simply memorizes all values of
    data for inputs and outputs. During test time when a data point is supplied and
    a class label is desired, it searches through its memory for any data point that
    has features which are most similar to the test data point, then it returns the
    label of the related data point as its prediction. A Nearest neighbor classifier
    has very quick training time as it is just storing all samples. At test time however,
    its speed is slower because it needs to search through all stored examples for
    the closest match. The time spent to receive a classification prediction increases
    as the dataset increases.


    The k-nearest neighbor algorithm is a modification of the nearest neighbor algorithm
    in which a class label for an input is voted on by the k closest examples to it.
    That is the predicted label would be the label with the majority vote from the
    delegates close to it. So a k value of 5 means, get the five most similar examples
    to an input that is to be classified and choose the class label based on the majority
    class label of the five examples.


    Let us now look at an example image to hone our knowledge:


    ![](images/00071.jpeg)


    The new example to be classified is placed in the vector space, when k = 1, the
    label of the closest example to it is chosen as its label. In this case, the new
    example is categorized as belonging to class 1. When k = 1, k-nearest neighbor
    algorithm is reduced to nearest neighbor algorithm.


    From the image, when k = 3, we choose the 3 closest examples to the new example
    using a similarity metric known as the distance measure. We see that two close
    examples predict the class as being class 2 (red triangle) while the remaining
    example predicts the class to be class 1 (blue square). The predicted class of
    the new data point is therefore class 2 because it has the majority vote.


    The distance metric used to measure proximity of examples may be L1 or L2 distance.
    L1 distance is the sum of the absolute of the difference between two points and
    is given by:


    ![<math xmlns="http://www.w3.org/1998/Math/MathML"><msub><mi>d</mi><mn>1</mn></msub><mfenced><mrow><mi>P</mi><mo>,</mo><mi>q</mi></mrow></mfenced><mo>=</mo><munderover><mo>&#x2211;</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><mn>1</mn><msub><mi>P</mi><mi>i</mi></msub><mo>-</mo><msub><mi>q</mi><mi>i</mi></msub><mn>1</mn></math>](images/00072.jpeg)


    L1 distance is sometimes referred to as the Manhattan distance.


    L2 is an alternative distance measure that may be used. It is the Euclidean distance
    between two points using a straight line. It is given as:


    ![<math xmlns="http://www.w3.org/1998/Math/MathML"><msub><mi>d</mi><mn>2</mn></msub><mfenced><mrow><mi>p</mi><mo>,</mo><mi>q</mi></mrow></mfenced><mo>=</mo><msqrt><munderover><mo>&#x2211;</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><msup><mfenced><mrow><msub><mi>q</mi><mi>i</mi></msub><mo>-</mo><msub><mi>P</mi><mi>i</mi></sub></mrow></mfenced><mn>2</mn></msup></msqrt></math>](images/00073.jpeg)


    A value of k = 1 would classify all training examples correctly since the most
    similar example to a point would be itself. This would be a sub-optimal approach
    as the classifier would fail to learn anything and would have no power to generalize
    to data that it was not trained on. A better solution is to choose a value of
    k in a way that it performs well on the validation set. The validation set is
    normally used to tune the hyperparameter k. Higher values of k has a smoothing
    effect on the decision boundaries because outlier classes are swallowed up by
    the voting pattern of the majority. Increasing the value of k usually leads to
    greater accuracy initially before the value becomes too large and we reach the
    point of diminishing returns where accuracy drops and validation error starts
    rising.


    ![](images/00074.gif)


    The optimal value for k is the point where the validation error is lowest.


    ## How to create and test the K Nearest Neighbor classifier


    We would now apply what we have learnt so far to a binary classification problem.
    The dataset we would use is the Pima Indian Diabetes Database which is a dataset
    from the National Institute of Diabetes and Digestive and Kidney Diseases. The
    main purpose of this dataset is to predict whether a patient has diabetes or not
    based on diagnostic measurements carried out on patients. The patients in this
    study were female, of Pima Indian origin and at least 21 years old.


    The dataset can be found at:


    [https://www.kaggle.com/uciml/pima-indians-diabetes-database/data](https://www.kaggle.com/uciml/pima-indians-diabetes-database/data)


    Since we are dealing with two mutually exclusive classes, a patient either has
    diabetes or not, this can be modelled as a binary classification task and for
    the purpose of our example we would use the k-nearest neighbor classifier for
    classification.


    The first step is to import the libraries that we would use.


    ```

    import numpy as np

    import pandas as pd

    import matplotlib.pyplot as plt

    ```


    Next we load the data using Pandas.


    ```

    dataset = pd.read_csv(''diabetes.csv'')

    ```


    As always what we should do is get a feel of our dataset and the features that
    are available.


    ```

    dataset.head(5)

    ```


    ![](images/00075.jpeg)


    We see that we have 8 features and 9 columns with `Outcome` being the binary label
    that we want to predict.


    To know the number of observations in the dataset we run


    ```

    dataset.shape

    ```


    This shows dataset contains 768 observations.


    Let’s now get a summary of the data so that we can have an idea of the distribution
    of attributes.


    ```

    dataset.describe()

    ```


    ![](images/00076.jpeg)


    The count row shows a constant value of 768.0 across features, it would be remembered
    that this is the same number of rows in our dataset. It signifies that we do not
    have any missing values for any features. The quantities mean, std gives the mean
    and standard deviation respectively across attributes in our dataset. The mean
    is the average value of that feature while the standard deviation measures the
    variation in the spread of values.


    Before going ahead with classification, we check for correlation amongst our features
    so that we do not have any redundant features


    ```

    corr = dataset.corr()   # data frame correlation function

    fig, ax = plt.subplots(figsize=(13, 13))

    ax.matshow(corr)   # color code the rectangles by correlation value

    plt.xticks(range(len(corr.columns)), corr.columns)  # draw x tick marks

    plt.yticks(range(len(corr.columns)), corr.columns)  # draw y tick marks

    ```


    ![](images/00077.jpeg)


    The plot does not indicate any 1 to 1 correlation between features, so all features
    are informative and provide discriminability.


    We need to separate our columns into features and labels


    ```

    features = dataset.drop([''Outcome''], axis=1)

    labels = dataset[''Outcome'']

    ```


    We would once again split our dataset into training set and test set as we want
    to train our model on the train split, then evaluate its performance on the test
    split.


    ```

    from sklearn.model_selection import train_test_split

    features_train, features_test, labels_train, labels_test = train_test_split(features,
    labels, test_size=0.25)

    ```


    `features_train`, `features_test` contains the attributes while `labels_train`,
    `labels_test` are the discrete class labels for the train split and test splits
    respectively. We use a `test_size` of 0.25 which indicates we want to use 75%
    of observations for training and reserve the remaining 25% for testing.


    The next step is to use the k-nearest neighbor classifier from Scikit-Learn machine
    learning library.


    ```

    # importing the model

    from sklearn.neighbors import KNeighborsClassifier

    ```

