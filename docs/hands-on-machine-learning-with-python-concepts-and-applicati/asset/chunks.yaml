    # Deep Learning Overview


    Deep learning is a subfield of machine learning that makes use of algorithms which
    carry out feature learning to automatically discover feature representations in
    data. The “deep” in deep learning refers to the fact that this kind of learning
    is done across several layers, with higher level feature representations composed
    of simpler features detected earlier in the chain. The primary algorithm used
    in deep learning is a deep neural network composed of multiple layers. Deep learning
    is also known as hierarchical learning because it learns a hierarchy of features.
    The complexity of learned features increases as we move deeper in the network.


    Deep learning techniques are loosely inspired by what is currently known about
    how the brain functions. The main idea is that the brain is composed of billions
    of neurons which interact with each other in some way through the use of electrical
    signals from chemical reactions. This interaction between neurons in conjunction
    with other organs helps humans to perform cognitive tasks such as seeing, hearing,
    taking decisions etc. What deep learning algorithms do is to arrange a network
    of neurons in a structure known as an **Artificial Neural Network (ANN)** to learn
    a mapping function from inputs directly to outputs. The difference between deep
    learning and a classical artificial neural network is that the layers of the network
    are several orders of magnitude larger hence it is commonly called a **Deep Neural
    Network (DNN)** or feedforward neural network.


    To get a well-grounded understanding, it is important for us to take a step back
    and try to understand the concept of a single neuron.


    ![](images/00115.jpeg)


    First let us develop simple intuitions about a biological neuron. The image of
    a biological neuron above shows a single neuron made up of different parts. The
    brain consists of billions of similar neurons connected together to form a network.
    The dendrites are the components that carry information signals from other neurons
    earlier in the network into a particular neuron. It is helpful to think of this
    in the context of machine learning as features that have so far been learned by
    other neurons about our data. The cell body which contains the nucleus is where
    calculations that would determine whether we have identified the presence of a
    characteristic we are interested in detecting would take place. Generally, if
    a neuron is excited by its chemical composition as a result of inflowing information,
    it can decide to send a notification to a connected neuron in the form of an electrical
    signal. This electrical signal is sent through the axon. For our artificial use
    case, we can think of an artificial neuron firing a signal only when some condition
    has been met by its internal calculations. Finally, this network of neurons learn
    representations in such a way that connections between them are either strengthened
    or weakened depending on the current task at hand. The connections between biological
    neurons are called synapses and we would see an analogy of synapses in artificial
    neural networks known as weights which are parameters we would train to undertake
    a learning problem.


    ![](images/00116.jpeg)


    Let us now translate what we know so far into an artificial neuron implemented
    as a computation unit. From the diagram, we can envisage `X1`, `X2`, to `Xn` as
    the features that are passed into the neuron. A feature represents a dimension
    of data from a data point. The combination of features completely describe that
    data point as captured by the data. `W1` to `Wn`, are the weights and their job
    is to tell use how highly we should rank a feature. That is lower values for the
    weight means that the connected feature is not as important and higher values
    signify greater significance. All inputs to the artificial neural network are
    then summed linearly (added side by side). It is at this point that we determine
    whether to a send signal to the next neuron or not using a condition as a threshold.
    If the result of the linear calculation is greater than or equal to the threshold
    value, we send a signal else we don’t.


    From the explanation, it is now plain to see why these techniques are loosely
    based on the operation of a biological neuron. However, it must be noted that
    deep learning beyond this point does not depend on neuroscience as a complete
    understanding of the way the brain functions is not known.


    In deep neural networks, the activation criterion (whether we decide to fire a
    signal or not) is usually replaced with non-linear activation functions such as
    `sigmoid`, `tanh` or **Rectified Linear Unit (ReLU)**. The reason a non-linear
    activation function is used is so that the artificial neural network can break
    linearity in order to enable it learn more complicated representations. If there
    were no non-linear activation functions, regardless of the depth of the network
    (number of layers), what it would learn is still a linear function which is severely
    limiting.


    Let us now look at how we can arrange these neurons into an artificial neural
    network using the image below to explain the concepts.


    ![](images/00117.jpeg)


    In the example, Variable 1 through 4 represents an input to the network in the
    form of features. An input may be an image, text or sequential data. The input
    layer which contains the variables (features) are connected to neurons in the
    hidden layer. The hidden layer is so called because we cannot directly inspect
    what goes on inside unlike the input or output layer which we have direct access
    to. There are 3 units or neurons in the hidden layer. The last layer is the output
    layer. This is where we get our predictions. In this case it is made up of a single
    neuron which suggests that it renders a single output. Such a neuron may be used
    to get a single real valued number in a regression problem or a class in a binary
    classification problem.


    It would be observed that neurons in one layer are connected to all neurons in
    the next layer, because of this kind of configuration, we say that it is a fully
    connected layer. The strength of connections between neurons are governed by the
    weights. Finally, the above network is said to be a 2-layer neural network as
    the input layer is not counted when describing the number of layers contained
    in a network.


    There are various architectures of deep neural networks, some architectures make
    assumptions about the type of data that the model expects. Those assumptions usually
    improve the performance of such models at the tasks which they were designed for.
    **Convolutional Neural Networks (CNN)** are designed with the assumption that
    they would be dealing with 2-dimensional data such as images and are the de-facto
    standard for computer vision tasks like image detection, image classification,
    image segmentation, object recognition etc. **Recurrent Neural Networks (RNN)**
    on the other hand are specially suited for handling sequential and temporal data
    like text and time series. Each of these architectures have further variants that
    are modifications to suit a particular learning problem.


    ## Deep Learning Compared to Other Machine Learning Approaches


    The popularity of deep learning is mainly based on the fact that it has achieved
    impressive results in diverse fields and is beginning to surpass humans in certain
    tasks such as object recognition. Compared to other machine learning techniques,
    it has been able to achieve state of the art results on many benchmarks and is
    applicable with slight modifications to a wide range of learning problems. The
    reason is that not only have artificial neural networks been shown to be capable
    of learning any function as illustrated by the universal approximation theorem,
    deep neural networks seem to improve their performance with more data. They are
    free from the plateau effect that traditional machine learning algorithms suffer
    from, whereby at some point the performance of the algorithm does not improve
    with the availability of additional data.


    ![](images/00118.jpeg)

