    # Clustering


    Clustering is the most common form of unsupervised learning. Clustering involves
    grouping objects or entities into clusters (groups) based on a similarity metric.
    What clustering algorithms aim to achieve is to make all members of a group as
    similar as possible but make the cluster dissimilar to other clusters. At first
    glance clustering looks a lot like classification since we are putting data points
    into categories, while that may be the case, the main difference is that in clustering
    we are creating categories without the help of a human teacher. Whereas, in classification,
    objects were assigned to categories based on the domain knowledge of a human expert.
    That is in classification we had human labelled examples which means the labels
    acted as a supervisor teaching the algorithm how to recognise various categories.


    In clustering, the clusters or groups that are discovered are purely dependent
    on the data itself. The data distribution is what drives the kind of clusters
    that are found by the algorithm. There are no labels so clustering algorithms
    are forced to learn representations in an unsupervised manner devoid of direct
    human intervention.


    Clustering algorithms are divided into two main groups - hard clustering algorithms
    and soft clustering algorithms. Hard clustering algorithms are those clustering
    algorithms that find clusters from data such that a data point can only belong
    to one cluster and no more. Soft clustering algorithms employ a technique whereby
    a data point may belong to more than one cluster, that is the data point is represented
    across the distribution of clusters using a probability estimate that assigns
    how likely the point belongs to one cluster or the other.


    ![](images/00102.jpeg)


    From the data distribution of the image above, we can deduce that a clustering
    algorithm has been able to find 5 clusters using a distance measure such as Euclidean
    distance. It would be observed that data points close to cluster boundaries are
    equally likely to fall into any neighboring cluster. Some clustering algorithms
    are deterministic meaning that they always produce the same set of clusters regardless
    of initialization conditions or how many times they are run. Other clustering
    algorithms produce a different cluster collection everytime they are run and as
    such it may not be easy to reproduce results.


    Introduction to Clustering


    The most important input to a clustering algorithm is the distance measure. This
    is so because it is used to determine how similar two or more points are to each
    other. It forms the basis of all clustering algorithms since clustering is inherently
    about discriminating entities based on similarity.


    Another way clustering algorithms are categorized is using the relationship structure
    between clusters. There are two subgroups - flat clustering and hierarchical clustering
    algorithms. In flat clustering, the clusters do not share any explicit structure
    so there is no definite way of relating one cluster to the other. A very popular
    implementation of a flat clustering algorithm is K-means algorithm which we would
    use as a case study.


    Hierarchical clustering algorithms first starts with each data point belonging
    to its own cluster, then similar data points are merged into a bigger cluster
    and the process continues until all data points are part of one big cluster. As
    a result of the process of finding clusters, there is a clear hierarchical relationship
    between discovered clusters.


    There are advantages and disadvantages to the flat and hierarchical approach.
    Hierarchical algorithms are usually deterministic and do not require us to supply
    the number of clusters beforehand. However, this leads to computational inefficiency
    as we suffer from quadratic cost. The time taken to discover clusters by an hierarchical
    clustering algorithm increases as the size of the data increases.


    Flat clustering algorithms are intuitive to understand and feature linear complexity,
    therefore the time taken to run the algorithm increases linearly with the number
    of data points and because of this flat clustering algorithms scale well to massive
    amounts of data. As a rule of thumb, flat clustering algorithms are generally
    used for large datasets where a distance metric can capture similarity while hierarchical
    algorithms are used for smaller datasets.


    Example of Clustering


    We would have a detailed look at an example of a flat clustering algorithm, K-means.
    We would also use it on a dataset to see its performance.


    K-means is an iterative clustering algorithm that seeks to assign data points
    to clusters. To run K-means algorithm, we first need to supply the number of clusters
    we desire to find. Next, the algorithm randomly assigns each point to a cluster
    and computes the cluster centroids (center of cluster). At this stage points are
    reassigned to new clusters based on how close they are to cluster centroids. We
    again recompute the cluster centroids. Finally we repeat the last two steps until
    no data points are being reassigned to new clusters. The algorithm has now converged
    and we have our final clusters.


    Running K-means with Scikit-Learn


    For our hands on example we would use K-means algorithm to find clusters in the
    Iris dataset. The Iris dataset is a classic in the machine learning community.
    It contains 4 attributes (sepal length, sepal width, petal length, petal width)
    used to describe 3 species of the Iris plant. The dataset can be found at:


    [https://www.kaggle.com/saurabh00007/iriscsv/downloads/Iris.csv/1](https://www.kaggle.com/saurabh00007/iriscsv/downloads/Iris.csv/1)


    The first step is to load the data and run the head method on the dataset to know
    our features


