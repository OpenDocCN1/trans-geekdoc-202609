    # Scipy


    Scipy 是一个面向数学、科学和工程领域的科学计算库。它构建在 Numpy 之上，并通过提供优化、技术计算、统计、信号处理等额外模块对其进行了扩展。Scipy
    主要与生态系统中的其他工具（如 Pandas 和 matplotlib）配合使用。


    下面是一个使用 scipy 求矩阵逆的简单示例。


    ```python

    from scipy import linalg


    z = np.array([[1,2],[3,4]])


    print(linalg.inv(z))

    ```


    ![](img/00015.gif)


    # Matplotlib


    Matplotlib 是一个绘图库，能与 Numpy 及 Python 中的其他数值计算库良好集成。它能够生成高质量的图表，并广泛用于数据探索，因为在该领域可视化技术非常重要。Matplotlib
    暴露了面向对象的 API，使得在 Python 中创建强大的可视化变得容易。请注意，要在 Jupyter notebook 中查看图表，必须使用 `matplotlib
    inline` 魔法命令。


    下面是一个使用 Matplotlib 绘制正弦波形的示例。


    ```python

    # Jupyter notebooks 的魔法命令

    %matplotlib inline


    import matplotlib.pyplot as plt


    # 计算正弦曲线上点的 x 和 y 坐标

    x = np.arange(0, 3 * np.pi, 0.1)

    y = np.sin(x)


    # 使用 matplotlib 绘制点

    plt.plot(x, y)

    plt.show()  # 通过调用 plt.show() 显示图表

    ```


    ![](img/00016.jpeg)


    # Scikit-Learn


    Scikit-Learn 是 Python 生态系统中最流行的机器学习库。它是一个非常成熟的库，包含用于分类、回归和聚类的多种算法。Scikit-Learn
    中提供了许多常用算法，并暴露了统一的接口来访问它们，因此学会在 Scikit-Learn 中使用一种分类器，就意味着你能使用其他的分类器，因为训练分类器所调用的方法名称是相同的，无论底层实现如何。


    随着我们在本书后续章节中深入数据科学，我们将严重依赖 Scikit-Learn 完成建模任务。下面是一个创建分类器并使用内置数据集对其进行训练的简单示例。


    ```python

    # 示例决策树分类器

    from sklearn import datasets

    from sklearn import metrics

    from sklearn.tree import DecisionTreeClassifier


    # 加载鸢尾花数据集

    dataset = datasets.load_iris()


    # 将 CART 模型拟合到数据

    model = DecisionTreeClassifier()

    model.fit(dataset.data, dataset.target)

    print(model)


    # 进行预测

    expected = dataset.target

    predicted = model.predict(dataset.data)


    # 总结模型的拟合情况

    print(metrics.classification_report(expected, predicted))

    print(metrics.confusion_matrix(expected, predicted))

    ```


    这是输出结果。如果你看不懂代码也不用担心。我们将在后续章节中更详细地讲解代码的每一部分。


    ![](img/00017.jpeg)


    # 关于 Google TensorFlow


    TensorFlow 是“面向所有人的开源机器学习框架”。此外，


    “……它为机器学习和深度学习提供了强有力的支持，其灵活的数值计算核心被应用于许多其他科学领域。”


    换句话说，如果你的项目主要涉及机器学习和深度学习，那么 TensorFlow 可以让你的工作变得更轻松、更高效。但为什么不用 scikit-learn 呢？


    Scikit-learn 自带开箱即用的算法，这意味着你只需几行代码就能进行机器学习。另一方面，如果你想专注于深度学习，TensorFlow 则大放异彩。


    在这个现代机器学习时代，同时学习 TensorFlow 和 scikit-learn 是很好的。此外，在使用 TensorFlow 之前，后者对于许多数据预处理任务仍然很有用。所以总的来说，熟悉最流行的工具是好的。别担心，只需专注于基础和原理。一旦你掌握了这些，你就会拥有一个坚实的知识库，可以带到任何地方。


    # 你的第一个机器学习项目


    演示胜过讲述。


    这仍然是解释和说明事物的最佳方式。与其再写 1000 个字来解释什么是机器学习，不如直接深入一个例子。


    ## 泰坦尼克号生存预测


    1912 年 4 月泰坦尼克号的沉没是历史上最惨重的海难之一。超过 1500 人失去了生命。幸运的是，有 700 多名幸存者（泰坦尼克号最后一位幸存者已于
    97 岁高龄去世）。


    为了学习，我们这里的目标是将机器学习应用于生存预测。请注意，我们已经拥有标记数据（乘客及其是否幸存）。这里的目标是从数据（训练数据）中学习，并将该学习应用到新的或未见过的数据（测试集）中。


    换句话说，我们的计算机和模型将从数据中推导出模式和“洞察”，以便进行预测。在这里，目标是根据可用数据预测谁会是幸存者。正如 Kaggle ([`www.kaggle.com/c/titanic`](https://www.kaggle.com/c/titanic))
    所述，问题定义如下：


    > “已知一个训练样本集，其中列出了在泰坦尼克号灾难中幸存或未幸存的乘客，我们的模型能否根据不包含生存信息的给定测试数据集，确定测试数据集中的这些乘客是否幸存。”


