    in history. Over 1,500 lives were lost. Fortunately, there were more than 700
    survivors (last living survivor of Titanic has died at age 97).


    For the purpose of learning, our goal here is to apply machine learning in survival
    prediction. Take note that we already have labelled data (person and whether he
    or she had survived or not). The goal here is to learn from data (the training
    data) and apply that learning into new or unseen data (test set).


    In other words, our computer and model will derive patterns and “insights” from
    data so it can make predictions. In this case here, the goal is to predict who
    would be the survivors based on available data. As described in Kaggle ([https://www.kaggle.com/c/titanic](https://www.kaggle.com/c/titanic)),
    here’s the problem definition:


    > “Knowing from a training set of samples listing passengers who survived or did
    not survive the Titanic disaster, can our model determine based on a given test
    dataset not containing the survival information, if these passengers in the test
    dataset survived or not.”


    It’s true that luck plays a huge role in survival. But other factors can also
    affect the survival probability. For instance, if the passenger was a child or
    in the upper class, he or she had better chances of surviving.


