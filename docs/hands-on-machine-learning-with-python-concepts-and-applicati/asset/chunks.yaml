    *   Model Selection (choose and compare models and their accuracies)


    *   Preprocessing (standardization of datasets and feature extraction)


    In short, scikit-learn is a convenient and powerful tool to do machine learning
    in Python. It may not be the best or most efficient, but it’s good enough for
