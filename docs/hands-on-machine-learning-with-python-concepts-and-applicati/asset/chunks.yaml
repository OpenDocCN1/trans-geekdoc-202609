- raw: 'TensorFlow includes several preloaded datasets which we can use to learn or
    test out our ideas during experimentation. The MNIST database is one of such cleaned
    up datasets that is simple and easy to understand. Each data point is a black
    and white image with only one color channel. Each pixel in the image denotes the
    brightness of that point with 0 indicating black and 255 white. The numbers range
    from 0 to 255 for 784 points in a 28 × 28 grid.


    Let’s go ahead and load the data from TensorFlow along with importing other relevant
    libraries.


    \# Import MNIST data


    from tensorflow.examples.tutorials.mnist import input\_data


    mnist = input\_data.read\_data\_sets("/tmp/data/", one\_hot=True)


    import numpy as np


    import tensorflow as tf


    import matplotlib.pyplot as plt


    Let us use the matplotlib library to display an image to see what it looks like
    by running the following lines of code.


    plt.imshow(np.reshape(mnist.train.images\[8\], \[28, 28\]), cmap=''gray'')


    plt.show()


    ![](images/00100.gif)


    The displayed image is a handwritten digit of number 9.


    How to train and test the data


    In order to train an artificial neural network model on our data, we first need
    to define the parameters that describe the computation graph such as number of
    neurons in each hidden layer, number of hidden layers, input size, number of output
    classes etc. Each image in the dataset is 28 by 28 pixels therefore, the input
    shape is 784 which is 28 × 28.


    \# Parameters


    learning\_rate = 0.1


    num\_steps = 500


    batch\_size = 128


    display\_step = 100


    \# Network Parameters


    n\_hidden\_1 = 10 # 1st layer number of neurons


    n\_hidden\_2 = 10 # 2nd layer number of neurons


    num\_input = 784 # MNIST data input (img shape: 28\*28)


    num\_classes = 10 # MNIST total classes (0-9 digits)


    \# tf Graph input


    X = tf.placeholder("float", \[None, num\_input\])


    Y = tf.placeholder("float", \[None, num\_classes\])


    We then declare weights and biases which are trainable parameters and initialise
    them randomly to very small values. The declarations are stored in a Python dictionary.


    \# Store layers weight & bias


    weights = {


        ''h1'': tf.Variable(tf.random\_normal(\[num\_input, n\_hidden\_1\])),


        ''h2'': tf.Variable(tf.random\_normal(\[n\_hidden\_1, n\_hidden\_2\])),


        ''out'': tf.Variable(tf.random\_normal(\[n\_hidden\_2, num\_classes\]))


    }


    biases = {


        ''b1'': tf.Variable(tf.random\_normal(\[n\_hidden\_1\])),


        ''b2'': tf.Variable(tf.random\_normal(\[n\_hidden\_2\])),


        ''out'': tf.Variable(tf.random\_normal(\[num\_classes\]))


    }


    We are would then describe a 3-layer neural network with 10 units in the output
    for each of the class digits and define the model by creating a function which
    forward propagates the inputs through the layers. Note that we are still describing
    all these operations on the computation graph.


    \# Create model


    def neural\_net(x):


        # Hidden fully connected layer with 10 neurons


        layer\_1 = tf.add(tf.matmul(x, weights\[''h1''\]), biases\[''b1''\])


        # Hidden fully connected layer with 10 neurons


        layer\_2 = tf.add(tf.matmul(layer\_1, weights\[''h2''\]), biases\[''b2''\])


        # Output fully connected layer with a neuron for each class


        out\_layer = tf.matmul(layer\_2, weights\[''out''\]) + biases\[''out''\]


        return out\_layer


    Next we call our function, define the loss objective, choose the optimizer that
    would be used to train the model and initialise all variables.


    \# Construct model


    logits = neural\_net(X)


    \# Define loss and optimizer


    loss\_op = tf.reduce\_mean(tf.nn.softmax\_cross\_entropy\_with\_logits(


        logits=logits, labels=Y))


    optimizer = tf.train.AdamOptimizer(learning\_rate=learning\_rate)


    train\_op = optimizer.minimize(loss\_op)


    \# Evaluate model (with test logits, for dropout to be disabled)


    correct\_pred = tf.equal(tf.argmax(logits, 1), tf.argmax(Y, 1))


    accuracy = tf.reduce\_mean(tf.cast(correct\_pred, tf.float32))


    \# Initialize the variables (i.e. assign their default value)


    init = tf.global\_variables\_initializer()


    Finally, we create a session, supply images in batches to the model for training
    and print the loss and accuracy for each mini-batch.


    \# Start training


    with tf.Session() as sess:


        # Run the initializer


        sess.run(init)


        for step in range(1, num\_steps+1):


            batch\_x, batch\_y = mnist.train.next\_batch(batch\_size)


            # Run optimization op (backprop)


            sess.run(train\_op, feed\_dict={X: batch\_x, Y: batch\_y})


            if step % display\_step == 0 or step == 1:


                # Calculate batch loss and accuracy


                loss, acc = sess.run(\[loss\_op, accuracy\], feed\_dict={X: batch\_x,


                                                                     Y: batch\_y})


                print("Step " + str(step) + ", Minibatch Loss= " + \\


                      "{:.4f}".format(loss) + ", Training Accuracy= " + \\


                      "{:.3f}".format(acc))


        print("Optimization Finished!")


        # Calculate accuracy for MNIST test images


        print("Testing Accuracy:", \\


            sess.run(accuracy, feed\_dict={X: mnist.test.images,


                                          Y: mnist.test.labels}))


    The session was created using with, so it automatically closes after executing.
    This is the recommended way of running a session as we would not need to manually
    close it. Below is the output


    ![](images/00101.jpeg)


    The loss drops to 0.4863 after training for 500 steps and we achieve an accuracy
    of 85% on the test set.


    Here is the code in full:


    \# Parameters


    learning\_rate = 0.1


    num\_steps = 500


    batch\_size = 128


    display\_step = 100


    \# Network Parameters


    n\_hidden\_1 = 10 # 1st layer number of neurons


    n\_hidden\_2 = 10 # 2nd layer number of neurons


    num\_input = 784 # MNIST data input (img shape: 28\*28)


    num\_classes = 10 # MNIST total classes (0-9 digits)


    \# tf Graph input


    X = tf.placeholder("float", \[None, num\_input\])


    Y = tf.placeholder("float", \[None, num\_classes\])


