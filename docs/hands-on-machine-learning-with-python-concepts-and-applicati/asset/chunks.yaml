    ## Complete Code


    Here is the code in its entirety.


    ```python

    # import libraries

    import numpy as np

    import pandas as pd

    import matplotlib.pyplot as plt

    %matplotlib inline


    # load dataset

    dataset = pd.read_csv(''Boston.csv'')

    dataset.head()


    # plot crime vs price

    plt.scatter(dataset[''crim''], dataset[''medv''])

    plt.xlabel(''Per capita crime rate by town'')

    plt.ylabel(''Price'')

    plt.title("Prices vs Crime rate")


    # separate predictors and targets

    X = dataset.drop([''Unnamed: 0'', ''medv''], axis=1)

    y = dataset[''medv'']


    from sklearn.model_selection import train_test_split

    x_train, x_test, y_train, y_test = train_test_split(X, y, test_size=0.3)


    # import linear regression classifier, initialize and fit the model

    from sklearn.linear_model import LinearRegression

    regressor = LinearRegression()

    regressor.fit(x_train, y_train)


    y_pred = regressor.predict(x_test)


    from sklearn.metrics import mean_squared_error, r2_score


    # The coefficients

    print(''Coefficients: \n'', regressor.coef_)


    # The mean squared error

    print(''Mean squared error: {:.2f}''.format(mean_squared_error(y_test, y_pred)))


    # Explained variance score: 1 is perfect prediction

    print(''Variance score: {:.2f}''.format(r2_score(y_test, y_pred)))


    # plot predicted prices vs actual prices

    plt.scatter(y_test, y_pred)

    plt.xlabel("Prices: $Y_i$")

    plt.ylabel("Predicted prices: $\hat{Y}_i$")

    plt.title("Prices vs Predicted prices: $Y_i$ vs $\hat{Y}_i$")

    ```


    # Logistic Regression


    **Logistic regression** despite its name is a classification algorithm. Logistic
    regression is used when the dependent variable is binary in nature, that is when
    it can be either one of two values (categories) example true or false. It is a
    linear combination of weighted input features applied to the sigmoid function.
    The logit or sigmoid function is at the heart of logistic regression and models
    data along the range of 0 to 1.


    ![](images/00061.jpeg)


    In the image above, `z` represents the weighted input features. What this means
    is that `z` is a linear addition of input features and the importance of input
    features (how large they are), is influenced by their weights (coefficients).
    A threshold is usually set to separate samples into classes. The threshold can
    be seen as the decision boundary. After the linear computation and the application
    of the sigmoid or logit function, the resultant value is compared to the threshold
    value. If it is equal to or larger than the threshold value, then the sample under
    consideration belongs to the positive class else it belongs to the negative class.
    The threshold value is usually set to 0.5.


    Outputs from logistic regression can be interpreted as probabilities that show
    how likely a data point belongs to a category. The formula for the logistic function
    is shown below.


    ![](images/00062.gif)


    The main difference between logistic regression and simple regression is that
    logistic regression is used for classification when there can only be two classes
    (negative or positive) while simple regression is used to predict an actual value
    like a continuous number and not classes or categories.


    ## Pima Indians Diabetes Classification


    We would now apply logistic regression to a binary classification problem. The
    dataset we would leverage is the Pima Indian Diabetes Database which is a dataset
    from the National Institute of Diabetes and Digestive and Kidney Diseases. The
    dataset contains a target variable that is used to indicate whether a patient
    developed diabetes or not. Our task is therefore to use diagnostic measurements
    as predictors to determine the diabetes status of a patient.


    The dataset can be downloaded at: [https://www.kaggle.com/uciml/pima-indians-diabetes-database/data](https://www.kaggle.com/uciml/pima-indians-diabetes-database/data)


    Let us import relevant libraries and load the dataset to have a sense of what
    it contains.


    ```python

    import numpy as np

    import pandas as pd

    import matplotlib.pyplot as plt


    dataset = pd.read_csv(''diabetes.csv'')

    dataset.head(5)

    ```


    ![](images/00063.jpeg)


    The dataset has 8 predictors such as glucose level of patient, age, skin thickness,
    body mass index, insulin level, age etc. These form the features for our model
    or in regression speak, the independent variables.


    Next we separate the columns in the dataset into features and labels. The labels
    or class are represented by the "Outcome" column.


    ```python

    features = dataset.drop([''Outcome''], axis=1)

    labels = dataset[''Outcome'']


    from sklearn.model_selection import train_test_split

    features_train, features_test, labels_train, labels_test = train_test_split(features,
    labels, test_size=0.25)

    ```


    The next step is to initialize a logistic regression model and fit it to the Pima
    Indians diabetes data.


    ```python

    # Training the model

    from sklearn.linear_model import LogisticRegression


    classifier = LogisticRegression()

    classifier.fit(features_train, labels_train)

    ```


    The trained model can now be evaluated on the test set.


    ```python

    pred = classifier.predict(features_test)


    from sklearn.metrics import accuracy_score

    accuracy = accuracy_score(labels_test, pred)

    print(''Accuracy: {:.2f}''.format(accuracy))

    ```


