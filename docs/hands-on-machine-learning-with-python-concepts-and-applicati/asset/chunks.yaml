    \ finally apply a few lines of code (the actual machine learning part) and then\
    \ we can make predictions.\n\nThe example earlier (Titanic Survival Prediction)\
    \ is an excellent one because we already get an idea of the different aspects\
    \ of a typical machine learning project. Well, notice that most of it is far from\
    \ machine learning but more about making assumptions and manipulating the data.\n\
    \nIt’s an excellent and yet as simple example. But the potential is enormous if\
    \ we apply the concepts similarly to other problems. In fact, many real-world\
    \ business and scientific challenges can be represented in a binary way (Survived\
    \ or Not Survived).\n\n- Will a person purchase a certain product (Purchased or\
    \ Not Purchased)?\n- Is a tumor benign or malignant (0 for benign, 1 for malignant)?\n\
    - Is an email spam or not?\n- Will a certain person pay her loan (based on other\
    \ customers’ records and payment tendencies)?\n- Based on 12 variables, should\
    \ a person be brought to an intensive care unit?\n\nIt’s just the beginning and\
    \ this is just one subset of Machine Learning. That’s why many experts say that\
    \ we’ve barely just scratched the surface. And as we get increasing computational\
    \ powers and massive datasets, we’ll then be able to dig deeper and apply machine\
    \ learning to almost all fields.\n\n# The General Workflow\n\nNo matter the field\
    \ or complexity of the subject, there are always few adhering principles common\
    \ to all of them. It’s a similar case with machine learning wherein the general\
    \ principles stay the same.\n\nFirst, we have to get quality data with sufficient\
    \ values. If it’s a messy set, we would spend extra time cleaning and tidying\
    \ it up. The second step is to take a look at the data itself and visualize it.\
    \ This allows us to quickly derive insights from the data. In fact, even if don’t\
    \ use machine learning we’ll quickly get insights just through visualization and\
    \ viewing the data summary (mean, median, mode, standard deviation, etc.).\n\n\
    Third step could involve a lot of data transformation and manipulation as we did\
    \ earlier. We might need to discard a few irrelevant features. We could also combine\
    \ features into one for simplicity. We could also create new features that model\
    \ algorithms can work on.\n\nAnd for the most awaited part, we now choose a model\
    \ and algorithm and start learning from data. With `scikit-learn`, we already\
    \ have pre-built code for us so we don’t have to write anything from scratch.\
    \ It’s the reason why we only spent 1% of our time on the actual machine learning.\
    \ But if we’re writing everything from scratch, it will take us a really long\
    \ time.\n\nYou can always dig deeper on how the models and algorithms work. The\
    \ behind-the-scenes are often complex because of the mathematics. But if you still\
    \ choose to learn all that, you’ll get an edge over the rest.\n\nAnyway, let’s\
    \ focus on the fundamentals first. After all, “first principles” are always here\
    \ to stay. Let’s begin.\n\n# General Machine Learning Concepts\n\nIn the previous\
    \ chapter we discussed an example of how machine learning is applied on a real\
    \ dataset. This is to quickly show and illustrate the power of machine learning.\n\
    \nBut before going any deeper, let’s explore the fundamentals first. This way\
    \ you’ll have a mental framework where pieces will fall together. This allows\
    \ for a more solid learning and firm grounding on what machine learning truly\
    \ is. Tools and techniques will always change. But with the right fundamentals\
    \ you’ll always be able to adjust along the way.\n\nSo let’s start with the main\
    \ “categories” of machine learning. The number is debatable but these are the\
    \ most important things you’ll encounter most as you read other resources about\
    \ machine learning and data science: Supervised Learning, Unsupervised Learning,\
    \ and Deep Learning.\n\n## What is Machine Learning\n"
