    its performance on the test set to the decision tree model in the previous section.
    The beautiful thing about using machine learning models from Scikit-Learn is that
    the APIs to train and test a model are the same regardless of the algorithm being
    used. So you would notice that we only need to import the correct classifier,
    initialize it and all other portions of code would remain unchanged. We are already
    familiar with how parts of the code works so here is the code for random forest
    in full.


    import numpy as np


    import pandas as pd


    \# load dataset


    dataset = pd.read\_csv(''wine.csv'')


    \# separate features and labels


    features = dataset.drop(\[''Wine''\], axis=1)


    labels = dataset\[''Wine''\]


    \# split dataset into train and test sets


    from sklearn.model\_selection import train\_test\_split


    features\_train, features\_test, labels\_train, labels\_test = train\_test\_split(features,
    labels, test\_size=0.25)


    \# import random forest classifier from sklearn


    from sklearn.ensemble import RandomForestClassifier


    classifier = RandomForestClassifier()


    \# fit classifier on data


    classifier.fit(features\_train, labels\_train)


    \# predict classes of test set samples


    pred = classifier.predict(features\_test)


    \# evaluate classifier performance using accuracy metric


    from sklearn.metrics import accuracy\_score


    accuracy = accuracy\_score(labels\_test, pred)


    print(''Accuracy: {:.2f}''.format(accuracy))


    ![](images/00092.jpeg)


    We achieve an accuracy of 98% on the test set which is a massive jump from 91%
    when we used a decision tree classifier. We can see that the randomization approach
    of random forest enables the algorithm to generalize better hence higher accuracy
    is recorded on the test set.


    # Neural Networks


    Perceptrons


    The perceptron is a binary linear classifier that is only capable of predicting
    classes of samples if those samples can be separated via a straight line. The
    perceptron algorithm was introduced by Frank Rosenblatt in 1957. It classifies
    samples using hand crafted features which represents information about the samples,
    weighs the features on how important they are to the final prediction and the
    resulting computation is compared against a threshold value.


    ![](images/00093.gif)


    In the image above, X represents the inputs to the model and W represents the
    weights (how important are individual features). A linear computation of the weighted
    sum of features is carried out during the formula below:


    ![](images/00094.gif)


    The value of z is then passed through a step function to predict the class of
    the sample. A step function is an instant transformation of a value from 0 to
    1. What this means is that if z is greater than or equal to 0, its predicts one
    class, else it predicts the other.  The step function can be represented mathematically
    as:


    ![](images/00095.gif)


    At each iteration, the predicted class gets compared to the actual class and the
    weights gets updated if the prediction was wrong else it is left unchanged in
    the case of a correct prediction. Updates of weights continue until all samples
    are correctly predicted, at which point we can say that the perceptron classifier
    has found a linear decision boundary that perfectly separates all samples into
    two mutually exclusive classes.


    During training the weights are updated by adding a small value to the original
    weights. The amount added is determined by the perceptron learning rule. The weight
    update process can be experienced mathematically as shown below.


    ![](images/00096.gif)


    The amount by which weights are updated is given by the perceptron learning rule
    below.


    ![](images/00097.gif)


    The first coefficient on the right hand side of the equation is called the learning
    rate and acts as a scaling factor to increase or decrease the extent of the update.
    The intuitive understanding of the above equation is that with each pass through
    the training set, the weights of misclassified examples are nudged in the correct
    direction so that the value of z can be such that the step function correctly
    classifies the sample. It should be noted that the perceptron learning algorithm
    described is severely limited as it can only learn simple functions that have
    a clear linear boundary. The perceptron is almost never used in practice but served
    as an integral building block during the earlier development of artificial neural
    networks.


    Modern iterations are known as multi-layer perceptrons. Multi-layer perceptrons
    are feed forward neural networks that have several nodes in the structure of a
    perceptron. However, there are important differences. A multilayer perceptron
    is made up of multiple layers of neurons stacked to form a network. The activation
    functions used are non-linear unlike the perceptron model that uses a step function.
    Nonlinear activations are capable of capturing more interesting representations
    of data and as such do not require input data to be linearly separable. The other
    important difference is that multi-layer perceptrons are trained using a different
    kind of algorithm called backpropagation which enables training across multiple
    layers.


    Backpropagation


    Backpropagation is an algorithm technique that is used to solve the issue of credit
    assignment in artificial neural networks. What that means is that it is used to
    determine how much an input’s features and weights contribute to the final output
    of the model. Unlike the perceptron learning rule, backpropagation is used to
    calculate the gradients, which tell us how much a change in the parameters of
    the model affects the final output. The gradients are used to train the model
    by using them as an error signal to indicate to the model how far off its predictions
    are from the ground truth. The backpropagation algorithm can be thought of as
    the chain rule of derivatives applied across layers.


    Let us look at a full fledged illustration of a multi-layer perceptron to understand
    things further.


    ![](images/00098.gif)


    The network above is made up of three layers, the input layer which are the features
    fed into the network, the hidden layer which is so called because we cannot observe
    what goes on inside and the output layer, through which we get the prediction
    of the model. During training, in order to calculate by how each node contributes
    to the final prediction and adjust them accordingly to yield a higher accuracy
    across samples, we need to change the weights using the backpropagation algorithm.
    It is the weights that are learned during the training process hence they are
    sometimes referred to as the learnable parameters of the model. To visually understand
    what goes on during backpropagation, lets us look at the image of a single node
    below.


    ![](images/00099.jpeg)


    In the node above x and y are the input features while f is the nonlinear activation
    function. During training computations are calculated in a forward fashion from
    the inputs, across the hidden layers, all the way to the output. This is known
    as the forward pass denoted by green arrows in the image. The prediction of the
    model is then compared to the ground truth and the error is propagated backwards.
    This is known as the backward pass and assigns the amount by which every node
    is responsible for the computed error through the backpropagation algorithm. It
    is depicted with red arrows in the image above. This process continues until the
    model finds a set of weights that captures the underlying data representation
    and correctly predicts majority of samples.


