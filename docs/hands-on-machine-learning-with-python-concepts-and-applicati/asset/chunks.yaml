    Generalized Linear Models


    Generalized linear models are an extension of linear models where the dependent
    variable does not belong to a normal or Gaussian distribution. Generalized linear
    models are capable of modelling more complicated relationships between the independent
    and dependent variables. GLMs can often model various probability distributions
    as such poisson, binomial, multinomial distributions etc. Logistic regression
    is an example of a generalized linear model where the dependent variable is modelled
    using a binomial distribution. This enables it to create a mapping from inputs
    to outputs, where the outputs are binary in nature.


    Poisson regression is a generalized linear model that is used for modelling count
    data. Count data are integer values that can only be positive. Poisson regression
    assumes that the independent variable y, belongs to a Poisson distribution, which
    is a type of exponential probability distribution. The main difference between
    Poisson regression and linear regression is that linear regression assumes the
    outputs are drawn from a normal distribution whereas Poisson distribution assumes
    y comes from a Poisson distribution. The outputs in Poisson regression are modelled
    as shown below.


    ![](images/00065.gif)


    Generalized linear models are made up of three components, the random components
    which are the probability distribution of the output, the systematic component
    which describes the explanatory variables (X) or predictors and the link function,
    which specifies the relationship between explanatory variables and the random
    component.


    Since the hyperparameters (weights) of Poisson regression cannot take negative
    values, they are transformed using natural logarithm to ensure they are always
    positive. The mean of Poisson distribution is stated mathematically as:


    ![](images/00066.gif)


