  trans: "\n注意到 Miss 和 Mrs 的存活率最高（甚至远高于 Rare 头衔的总和）。换句话说，Name 中的 Title（而非名字本身）与存活率相关。\n\
    \n同样，为方便起见，让我们将这些 Title（分类特征）转换为有序特征（就像 Pclass 一样）。\n\n```python\ntitle_mapping\
    \ = {\"Mr\": 1, \"Miss\": 2, \"Mrs\": 3, \"Master\": 4, \"Rare\": 5}\n\nfor dataset\
    \ in combine:\n    dataset['Title'] = dataset['Title'].map(title_mapping)\n  \
    \  dataset['Title'] = dataset['Title'].fillna(0)\n\ntrain_df.head()\n```\n\n![](img/00031.jpeg)\n\
    \n既然我们已经从 Name 中提取了有用信息并将其制成新特征，便可以安全地删除 Name 特征。同时也应删除 PassengerId。\n\n```python\n\
    train_df = train_df.drop(['Name', 'PassengerId'], axis=1)\ntest_df = test_df.drop(['Name'],\
    \ axis=1)\ncombine = [train_df, test_df]\ntrain_df.shape, test_df.shape\n```\n\
    \n((891, 9), (418, 9))\n\n```python\ntrain_df.head()\n```\n\n![](img/00032.jpeg)\n\
    \n现在数据整洁多了，特征数量大幅减少。这将使后续分析更轻松、更快捷。\n\n此外，我们必须将包含字符串的特征（Sex = female 或 male）转换为数值。这通常是大多数机器学习算法的要求。毕竟，处理文本数据与数值需要不同的方法（稍后提到自然语言处理时再详述）。\n\
    \n将分类特征转换为数值：\n\n```python\nfor dataset in combine:\n    dataset['Sex'] = dataset['Sex'].map({'female':\
    \ 1, 'male': 0}).astype(int)\n\ntrain_df.head()\n```\n\n![](img/00033.jpeg)\n\n\
    搞定。现在全是数值，且已排除无关特征。\n\n特别提示：注意我们还没进行任何机器学习。因为大多数数据科学和机器学习项目会先花大量时间在思考和预处理上。在使用\
    \ `scikit-learn` 或 `TensorFlow` 之前，必须在真实数据分析的基础上投入大量精力。\n\n但这还没完。在进行真正的机器学习前，还得处理前面提到的空值。我们得通过注入新值使其“非空”，但注入的值必须合理。\n\
    \n一种方法是利用其他相关特征（如观察 Age、Gender 和 Pclass 间的相关性）。代码如下：\n\n```python\ngrid = sns.FacetGrid(train_df,\
    \ row='Pclass', col='Sex', size=2.2, aspect=1.6)\ngrid.map(plt.hist, 'Age', alpha=.5,\
    \ bins=20)\ngrid.add_legend()\n```\n\n![](img/00034.jpeg)\n\n接下来准备一个空数组（使用 `numpy`），用于存放将替换空值的\
    \ Age 值。猜测值基于 Pclass × Gender 组合：\n\n```python\nimport numpy as np\n\nguess_ages\
    \ = np.zeros((2,3))\nguess_ages\n```\n\n![](img/00035.jpeg)\n\n然后遍历 Pclass（1,\
    \ 2, 3）和 Sex（0 或 1），计算 6 种组合的猜测 Age 值：\n\n```python\nfor dataset in combine:\n\
    \    for i in range(0, 2):\n        for j in range(0, 3):\n            guess_df\
    \ = dataset[(dataset['Sex'] == i) &\n                               (dataset['Pclass']\
    \ == j+1)]['Age'].dropna()\n            age_guess = guess_df.median()\n      \
    \      guess_ages[i,j] = int(age_guess/0.5 + 0.5) * 0.5\n    for i in range(0,\
    \ 2):\n        for j in range(0, 3):\n            dataset.loc[(dataset.Age.isnull())\
    \ & (dataset.Sex == i) & (dataset.Pclass == j+1),\n                        'Age']\
    \ = guess_ages[i,j]\n    dataset['Age'] = dataset['Age'].astype(int)\n\ntrain_df.head()\n\
    ```\n\n![](img/00036.jpeg)\n\n现在已处理缺失值。下一步创建 Age bands（年龄区间）并与 Survived 并列：\n\n\
    ![](img/00037.jpeg)\n\n为方便整洁，可将这些 Age Bands 转换为有序值：\n\n```python\nfor dataset\
    \ in combine:\n    dataset.loc[dataset['Age'] <= 16, 'Age'] = 0\n    dataset.loc[(dataset['Age']\
    \ > 16) & (dataset['Age'] <= 32), 'Age'] = 1\n    dataset.loc[(dataset['Age']\
    \ > 32) & (dataset['Age'] <= 48), 'Age'] = 2\n    dataset.loc[(dataset['Age']\
    \ > 48) & (dataset['Age'] <= 64), 'Age'] = 3\n    dataset.loc[dataset['Age'] >\
    \ 64, 'Age']\n\ntrain_df.head()\n```\n\n![](img/00038.jpeg)\n\nAge 特征现为有序型（而非宽数值范围）。现可“删除”\
