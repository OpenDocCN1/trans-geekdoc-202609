- raw: 'What’s the difference then? Deep Learning really shines if you’re analyzing
    massive datasets especially those that contain text, image, audio, and even video
    data. Remember that in Titanic Survival Prediction we mostly worked on numerical
    values. But when the data we’re dealing with is composed of text, we will take
    a different approach.


    It’s possible to use traditional machine learning techniques for massive and complex
    datasets. But for large scale analysis and projects, Deep Learning is still the
    most popular approach whether in academics or business.


    Deep Learning is inspired by how our brains work. That’s why in Deep Learning
    you’ll encounter the term “neural networks.” We still don’t have a complete understanding
    of how the brain really works. But based on the prevailing model, it could be
    very helpful in machine learning. In a later chapter we’ll go deeper into this.


    Anyway, no matter which you choose (either traditional machine learning or deep
    learning), you still have to go through most of the processes discussed in Titanic
    Survival Prediction. Most of your time might actually be spent on data manipulation
    and transformation instead of the actual exciting machine learning aspect. Often
    you might need to examine the features (discard or create new ones) and look at
    the data. Often you’ll also have to visualize the data points for quick insights
    and detection of outliers.


    In other words, machine learning (no matter what model or approach you choose)
    could be more about the processes outside of it (data visualization, manipulation,
    transformation, domain knowledge). That’s why it’s always good to focus on the
    fundamentals. Soon, new tools will sprout that will make machine learning quick
    and intuitive (e.g. drag and drop or just giving a voice command). But most of
    the hard work would still be about preparing the data and acquiring the required
    domain knowledge so we can effectively take advantage of the power of machine
    learning.


    In the succeeding chapters let’s explore more of those essential fundamentals.
    We’ll also explore more examples of how machine learning is applied in different
    projects and domains.


    Overfitting and Underfitting


    Overfitting and underfitting jointly form the central problem of machine learning.
    When training a model we want to improve its optimization by attaining better
    performance on the training set. However, once the model is trained, what we care
    about is generalization. Generalization in a nutshell deals with how well a trained
    machine learning model would perform on new data which it has not seen, that is
    data it was not trained on. In other words, how well can a model generalize the
    patterns it learnt on the training set to suit real world examples, so that it
    can achieve similar or better performance. This is the crux of learning. A model
    should be able to actually learn useful representations from data that improves
    test time performance and not merely memorize features as memorization is not
    learning.


    We say a model has overfit to a training set when it has failed to learn only
    useful representations in the data but has also adjusted itself to learn noise
    in order to get an artificially high training set accuracy. Underfitting means
    that the model has not used the information available to it but has only learnt
    a small subset of representations and has thrown away majority of useful information,
    thereby making it to make unfounded assumptions. The ideal situation is to find
    a model that neither underfitts nor overfitts but exhibits the right balance between
    optimization and generalization. This can be done by maintaining a third set of
    examples known as the validation set. The validation set is used to tune (improve)
    the performance of the model without overfitting the model to the training set.
    Other techniques for tackling overfitting includes applying regularization which
    punishes more complicated models and acquiring more training examples. Underfitting
    can be stymied by increasing the capacity of the learning algorithm so that it
    can take advantage of available features.


    ![](images/00052.jpeg)


    The plots above show three simple line based classification models. The first
    plot separates classes by using a straight line. However, a straight line is an
    overly simplistic representation for the data distribution and as a result it
    misclassified many examples. The straight line model is clearly underfitting as
    it has failed to use majority of the information available to it to discover the
    inherent data distribution.


    The second plot shows an optimal case where the optimization objective has been
    balanced by generalization criterion. Even though the model misclassified some
    points in the training set, it was still able to capture a valid decision boundary
    between both classes. Such a classifier is likely to generalize well to examples
    which it was not trained on as it has learnt the discriminative features that
    drive prediction. The last plot illustrates a case of overfitting. The decision
    boundary is convoluted because the classifier is responding to noise by trying
    to correctly classify every data point in the training set. The accuracy of this
    classifier would be perfect on the training set but it would perform horribly
    on new examples because it optimized its performance only for the training set.
    The trick is to always choose the simplest model that achieves the greatest performance.


    Correctness


    To evaluate a machine learning algorithm, we always specific measures of predictive
    performance. These metrics allow us to judge the performance of a model in an
    unbiased fashion. It should be noted that the evaluation metric chosen depends
    on the type of learning problem. Accuracy is a popular evaluation metric but it
    is not suitable for all learning problems. Other measures for evaluation include
    recall, precision, sensitivity, specificity, true positive rate, false positive
    rate etc. The evaluation used should be in line with the goals of the modelling
    problem.


    To ensure fidelity of reported metrics, a rule of thumb is that models should
    never be trained on the entire dataset as any evaluation reported by metrics is
    likely skewed because the model’s performance when exposed to new data is unascertained.
    The dataset should be divided into train, validation and test splits. The model
    is trained on the training set, the validation set is reserved for hyperparameter
    tuning for best performing models and the test set is only used once at the conclusion
    of all experimentation.


    A confusion matrix is widely used as a simple visualization technique to access
    the performance of classifiers in a supervised learning task. It is a table where
    the rows represent the instances in the actual class (ground truth) while the
    columns represents predictions. The order may be reversed in some cases. It is
    called a confusion matrix because it makes it easy to see which classes the model
    is misclassifying for another, that is which classes confuse the model.


    ![](images/00053.jpeg)


    The examples which the model correctly classified are on the diagonal from the
    top left to bottom right. False negatives are positive classes which the classified
    wrongly predicted as negatives while false positives are negative instances which
    the classifier wrongly thought were positives. Several metrics like true positive
    rate, false positive rate, precision etc are derived from items in the confusion
    matrix.


    The Bias-Variance Trade-off'
