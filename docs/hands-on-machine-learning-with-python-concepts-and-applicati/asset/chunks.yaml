    # K-means Clustering and Hierarchical Clustering


    ## Elbow Method for Optimal K


    The k-means algorithm is run for 10 iterations, with `n_clusters` ranging from
    1 to 10. At each iteration the sum of squared error (SSE) is recorded. The sum
    of squared distances within each cluster configuration is then plotted against
    the number of clusters. The “elbow” from the graph is 3 and this is the optimal
    value for `k`.


    ```python

    plt.ylabel(''Within Cluster Sum of Squares'') # within cluster sum of squares

    plt.show()

    ```


    ![](images/00104.jpeg)


    ## Creating the K-means Model


    Now that we know that the optimal value for `k` is 3, we create a K-means object
    using Scikit-Learn and set the parameter of `n_clusters` (number of clusters to
    generate) to 3.


    ```python

    # creating the kmeans object

    kmeans = KMeans(n_clusters = 3, init = ''k-means++'', max_iter = 300, n_init =
    10, random_state = 0)

    ```


    Next we use the `fit_predict()` method on our object. This returns a computation
    of cluster centers and cluster predictions for each sample.


    ```python

    y_kmeans = kmeans.fit_predict(x)

    ```


    ## Visualizing the Clusters


    We then plot the predictions for clusters using a scatter plot of the first two
    features.


    ```python

    # visualising the clusters

    plt.scatter(x[y_kmeans == 0, 0], x[y_kmeans == 0, 1], s = 100, c = ''red'', label
    = ''Iris-setosa'')

    plt.scatter(x[y_kmeans == 1, 0], x[y_kmeans == 1, 1], s = 100, c = ''blue'', label
    = ''Iris-versicolour'')

    plt.scatter(x[y_kmeans == 2, 0], x[y_kmeans == 2, 1], s = 100, c = ''green'',
    label = ''Iris-virginica'')


    # plotting the centroids of the clusters

    plt.scatter(kmeans.cluster_centers_[:, 0], kmeans.cluster_centers_[:,1], s = 100,
    c = ''yellow'', label = ''Centroids'')

    plt.legend()

    ```


    ![](images/00105.jpeg)


    The plot shows 3 clusters - red, blue, green representing types of Iris plant:
    setosa, versicolour and virginica respectively. The yellow point indicates the
    centroids which is at the center of each cluster.


    Our K-means algorithm was able to find the correct number of clusters which is
    3 because we used the elbow method. It would be observed that the original dataset
    had three types (classes) of Iris plant: Iris setosa, Iris versicolour and Iris
    virginica. If this were posed as a classification problem we would have had 3
    classes into which we would have classified data points. However, because it was
    posed as a clustering problem, we were still able to find the optimum number of
    clusters - 3, which is equal to the number of classes in our dataset.


    What this teaches us is that most classification problems and datasets can be
    used for unsupervised learning particularly for clustering tasks. The main intuition
    to take out of this is that if we want to use a classification dataset for clustering,
    we must remove labels, that is we remove the component of the data that was annotated
    by a human to enable supervision. We then train on the raw dataset to discover
    inherent patterns contained in the data distribution.


    While we have only touched on a portion of unsupervised learning, it is important
    to note that it is a vital branch of machine learning with lots of real world
    applications. Clustering as an example can be used to discover data groups and
    get a unique perspective of data before feeding it into traditional supervised
    learning algorithms.


    ## Implementation of the Model


    Clustering is a type of unsupervised learning technique in which there are no
    explicit labels. Clustering is used to discover groups of data points in a dataset.
    A group or cluster is made up of members that are similar to each other but are
    collectively different from other clusters. A good clustering algorithm must have
    the ability to discover some or all hidden clusters in a dataset, should exhibit
    in cluster similarity but different clusters should be dissimilar or far from
    each other. The clustering algorithm should also be scalable to larger datasets
    and should be able to handle noisy data points and outliers.


    There are two main categories of clustering algorithms - hierarchical clustering
    algorithms and partitive clustering algorithms. In hierarchical clustering, there
    is a clear relationship between discovered clusters. This can take the form of
    a hierarchy or order. Whereas in partitive algorithms, the relationship between
    clusters is not clear and it is sometimes referred to as having a flat structure.
    Clustering algorithms can also be seen from another perspective. Algorithms that
    allow a data point to belong to more than one cluster are known as soft clustering
    algorithms. In such a process, probabilities are assigned to each data point to
    indicate how likely it belongs to any particular cluster. Hard clustering algorithms
    on the other hand, require that data points only belong to exactly one cluster.


    Hierarchical clustering algorithms are deterministic, which means that each time
    the algorithm is deployed on a dataset, we are bound to find the same clusters.
    This enables reproducibility of results. Partitive algorithms are non-deterministic
    and would produce a slightly different cluster representation with every run through
    the dataset.


    ## Bottom-up Hierarchical Clustering


    Bottom-up hierarchical clustering is a type of hierarchical clustering technique
    whereby every data point begins in a cluster of its own. A distance measure such
    as Euclidean distance is then used to calculate the distance of all points from
    one another. The points with the shortest distance are merged to form a cluster
    of their own. The process continues until all points belong to one big cluster.
    The intuition is that data points which are similar are likely to be separated
    by a small distance in the feature space.


    A popular type of bottom-up clustering is the hierarchical agglomerative clustering
    algorithm. Here the distance measure may be Euclidean, Manhattan or Minkowski
    distance. When clusters are created, the distance between clusters may be the
    shortest distance between any two points in both clusters, known as single linkage,
    the farthest distance between two points, referred to as complete linkage or it
    may be an average of the distance of all data points in both clusters (average
    linkage).


    Below is the mathematical expression for single linkage as described above.


    ![](images/00106.jpeg)


    Where `D` is the distance measure example Manhattan distance. Manhattan distance
    can be expressed mathematically as:


    ![](images/00107.gif)


    Let us look at an image of a dendrogram, which is just the way clusters are represented
    when using an hierarchical agglomerative clustering algorithm.


    ![](images/00108.gif)


    In the dendrogram, each point (A through G) starts in a cluster of their own.
    Then they are merged into clusters with other points which they are not far away
    from. The process proceeds in a bottom-up fashion and the height represents the
