    # Data Science with Jupyter Notebooks and Python Libraries


    Data science is an experimental endeavour as hypotheses need to be tested to see
    whether the data upholds them. **Jupyter Notebook** is an interactive web application
    that bundles an **IPython shell**, which is an enhanced shell for Python computations.
    Code, text, and visualizations can be written alongside each other and stored
    in a special notebook format. This means that projects can be shared easily across
    teams and code can be easily reproduced, as every functionality required to execute
    a project is bundled in the notebook. Jupyter Notebooks support many programming
    languages like R, Julia, Python, etc. Jupyter in Python is powered by the `IPython`
    shell, which provides additional "magic" functions that are not available in standard
    Python but are generally useful for interactive computation.


    Jupyter Notebooks also support **LaTeX**, and as a result, mathematical equations
    can be written inline in cell blocks. Data visualization is also possible inline,
    and detailed documentation or explanations can be incorporated in a notebook by
    using Markdown syntax.


    `IPython` and `Jupyter Notebook` are automatically installed with Anaconda. To
    access the Jupyter Notebook interface, run the following command from a terminal:


    ```

    $ jupyter notebook  # command to launch jupyter notebook web interface

    ```


    The command above opens a window in a browser session containing the Jupyter Notebook
    web interface. The Jupyter Notebook session is opened in the same directory where
    the command is run.


    ![Jupyter Notebook Interface](images/00009.jpeg)


    You can navigate to a notebook file and click on it to run it or create a new
    notebook from the interface.


    ![Creating a New Notebook](images/00010.jpeg)


    Once a new notebook is created, it launches a new instance from which coding can
    be carried out interactively.


    ![New Notebook Instance](images/00011.jpeg)


    Jupyter Notebooks are very popular in the fields of data science and machine learning
    as they offer a specialized format that encapsulates coding, visualization, and
    documentation.


    ## Core Libraries: NumPy, Pandas, SciPy, Matplotlib, Scikit-learn


    Conveniently, we''ll use modules and libraries for our machine learning examples
    and projects. These contain pre-built code so we don''t have to write everything
    from scratch. Often these are not loaded by default, so we first have to `import`
    them so we can use them.


    That''s what we''ll do when using `numpy`, `pandas`, `matplotlib`, and `scikit-learn`.
    Here are examples of how to import them:


    ```python

    import numpy as np

    import pandas as pd

    import matplotlib.pyplot as plt


    # Importing datasets, classifiers, and metrics

    from sklearn import datasets, svm, metrics

    ```


    Anyway, why use `numpy` and the other modules?


    ### NumPy


    **NumPy** is the fundamental package for scientific computing with Python. Also,
    using `numpy` allows for faster access of items compared to traditional Lists.


    ### Pandas


    What about `pandas`? Here in this book, `pandas` will be used to import and read
    data. From their website ([https://pandas.pydata.org/](https://pandas.pydata.org/)):


    > "pandas is an open source, BSD-licensed library providing high-performance,
    easy-to-use data structures and data analysis tools for the Python programming
    language."


    ### Matplotlib


    Aside from accessing the data, often we also have to visualize it. That''s where
    `matplotlib` comes in ([https://matplotlib.org/](https://matplotlib.org/)):


    > "Matplotlib is a Python 2D plotting library which produces publication quality
    figures in a variety of hardcopy formats and interactive environments across platforms."


    There are other data visualization libraries such as **Bokeh** and **seaborn**.
    These can produce more awesome visuals, but for this book we''ll mostly use `matplotlib`.


    ### Scikit-learn


    And finally, let''s talk about `scikit-learn`. From their website ([http://scikit-learn.org/stable/index.html](http://scikit-learn.org/stable/index.html)):


    > **scikit-learn: Machine Learning in Python**

    >

    > *   Simple and efficient tools for data mining and data analysis

    > *   Accessible to everybody, and reusable in various contexts

    > *   Built on `NumPy`, `SciPy`, and `matplotlib`

    > *   Open source, commercially usable - BSD license


    With `scikit-learn` you can perform the following machine learning tasks:


    *   **Classification** (which category an item belongs to?)

    *   **Regression** (predicting a value)

    *   **Clustering** (reveal subgroups in the data)

    *   **Dimensionality Reduction** (reduce number of random variables to consider
    for easier visualization)

    *   **Model Selection** (choose and compare models and their accuracies)

    *   **Preprocessing** (standardization of datasets and feature extraction)


    In short, `scikit-learn` is a convenient and powerful tool to do machine learning
    in Python. It may not be the best or most efficient, but it''s good enough for
    most purposes, especially for studying machine learning.


    ## Numerical Python (NumPy)


    **NumPy** is the main numerical computing library in Python. It provides access
    to a multidimensional array object and exposes several methods through which operations
    can be done on these arrays. It features support for linear algebra operations
    such as matrix multiplication, inner product, identity operations, etc. `NumPy`
    interfaces with low-level libraries written in C and Fortran and passes off actual
    computation to these faster and more efficient libraries. As a result, vanilla
    Python control structures like loops are never used when performing numerical
    computation because they are significantly slower. `NumPy` can be seen as providing
    a set of Python APIs which enables efficient scientific computing.


    `NumPy` arrays can be initiated by nested Python lists. The level of nesting specifies
    the rank of the array.


    ```python

    import numpy as np


    a = np.array([[1, 2, 3], [4, 5, 6]])  # create a rank 2 array

    print(type(a))

    print(a.shape)

    ```


    ![Array Output](images/00012.jpeg)


    The array created is of rank 2, which means that it is a matrix. We can see this
    clearly from the size of the array printed. It contains 2 rows and 3 columns,
    hence size `(m, n)`.


    Arrays can also be initialized randomly from a distribution such as the normal
    distribution. Trainable parameters of a model such as the weights are usually
    initialized randomly.


    ```python

    b = np.random.random((2, 2))  # create an array filled with random values

    print(b)

    print(b.shape)

    ```


    ![Random Array Output](images/00013.jpeg)


    `NumPy` contains many methods for manipulation of arrays; one such method is matrix
    product. Let us look at an example of matrix product using `NumPy`.


    ![Matrix Product Example](images/00014.jpeg)


    ```python

    x = np.array([[1, 2], [3, 4]])

    y = np.array([[5, 6], [7, 8]])


    # matrix product

    print(np.dot(x, y))

    ```


    The example above is computed almost instantly and shows the power of `NumPy`.


    ## Pandas


    **Pandas** is a data manipulation library written in Python which features high-performance
    data structures for table and time series data. `Pandas` is used extensively for
    data analysis, and most data loading, cleaning, and transformation tasks are performed
    in `Pandas`. `Pandas` is an integral part of the Python data science ecosystem
    as data is rarely in a form that can be fed directly into machine learning models.
    Data from the real world is usually messy, contains missing values, and is in
    need of transformation. `Pandas` supports many file types like CSV, Excel spreadsheets,
    Python pickle format, JSON, SQL, etc.


    There are two main types of `Pandas` data structures: `Series` and `DataFrame`.
    `Series` is the data structure for a single column of data, while a `DataFrame`
    stores 2-dimensional data analogous to a matrix. In other words, a `DataFrame`
    contains data stored in many columns.


    The code below shows how to create a `Series` object in `Pandas`.


    ```python

    import pandas as pd

    import numpy as np


    s = pd.Series([1, 3, 5, np.nan, 6, 8])

    print(s)

    ```


    To create a `DataFrame`, we can run the following code.


    ```python

    df = pd.DataFrame(np.random.randn(6, 4), columns=list(''ABCD''))

    print(df)

    ```


    `Pandas` loads the file formats it supports into a `DataFrame`, and manipulation
    on the `DataFrame` can then occur using `Pandas` methods.


    ## Scientific Python (SciPy)

