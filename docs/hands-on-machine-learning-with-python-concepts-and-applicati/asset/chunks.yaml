    ![](images/00107.gif)


    Let us look at an image of a dendrogram, which is just the way clusters are represented
    when using an hierarchical agglomerative clustering algorithm.


    ![](images/00108.gif)


    In the dendrogram, each point (A through G) starts in a cluster of their own.
    Then they are merged into clusters with other points which they are not far away
    from. The process proceeds in a bottom-up fashion and the height represents the
    similarity between clusters at the point they were merged. After all data points
    are grouped as one cluster, a threshold value may be passed to trace back any
    number of clusters that is desired. This is represented as the horizontal line.
    There are therefore three clusters in the dendrogram above.


    K-means Clustering


    K-means is a partitive clustering algorithm that assigns data points into a predetermined
    number of clusters. The number of clusters must be passed as a metric to the algorithm.
    K-means works by randomly choosing centroids in a data distribution and assigning
    data points to centroids that they are closest to. The number of centroids is
    the same as the number of clusters to be determined. The centroids are then recomputed
    by taking the mean of all data points assigned to that centroid’s  cluster. The
    process is iterative. Data points are reassigned to centroids they are now closest
    to and the centroids are updated for each cluster. Convergence is achieved when
    data points are no longer reassigned to new clusters.


