- raw: 'The bias of a model is defined as the assumptions made by the model to simplify
    the learning task. A model with high bias makes assumptions which are not correlated
    by the data. This lead to errors because predictions are usually some way off
    from actuals. Variance on the other hand is how susceptible a model is to noise
    in the training data. How widely does the performance on the model vary based
    on the data it is evaluated on. A good machine learning algorithm should strive
    to achieve low bias and low variance. Bias and variance are related to overfitting
    and underfitting earlier encountered. A model with high bias is underfitting the
    training data because it has made simplistic assumptions instead of learning from
    information available. Similarly, a model with high variance is overfitting, because
    it has modelled noise and as a result, its performance would vary widely across
    the training set, validation set and test set.


    Let us look use a dart analogy to further explain these concepts.


    ![](images/00054.jpeg)


    The top left image represents a model that has low bias and low variance. This
    is the ideal model as it has learnt to hit the target (produce correct classification)
    and usually hits the target most of the time (does not vary with each throw).
    The image at the top right shows a model that exhibits high variance and low bias.
    Even if it does not make a lot of assumptions, its predictions are spread all
    over the board which means its performance varies widely (high variance). The
    image on the bottom left depicts a model with high bias and low variance. The
    shots are not all over the board but in a specific location. This location is
    however far from the target meaning the model is biased because of simplistic
    assumptions. Finally, the image on the bottom right shows a model with high bias
    and high variance. The shots on the board vary widely and are far away from the
    target. This is the worst kind of model as it hasn’t learnt any useful representation.


    Feature Extraction and Selection


    Feature extraction involves performing transformation on input features that produce
    other features that are more analyzable and informative. Feature extraction may
    occur by combining original features to create new features which are better suited
    for the modelling problem. This is similar to feature engineering where we create
    new features to fed into a model. An example of feature extraction is Principal
    Component Analysis (PCA).


    Feature selection is choosing a subset of features from the original input features.
    The features selected are those that show the most correlation with the target
    variable, that is those features that drive the predictive capability of the model.
    Both feature extraction and feature selection leads to dimensionality reduction.
    The main difference between them is that feature extraction is a transformation
    that creates new features whereas feature selection chooses only a subset of available
    features. Since feature selection removes certain features, it is always advisable
    to first do feature extraction on a dataset, then select the most important predictors
    via feature selection.


    Why Machine Learning is Popular


    The popularity of machine learning in the artificial intelligence community and
    society in general is mainly because machine learning techniques have proven to
    be highly successful in various niches providing business value for a slew of
    operations from fraud detection to speech recognition to recommender systems.
    It is embedded in products we use every day. When you buy a product from Amazon
    and you are given a list of suggestions of other products that go with it, that’s
    machine learning in action. When you open your mailbox and emails are automatically
    classified into folders based on their similarity, those are machine learning
    models doing the work behind the scenes. Even when you use your credit card online
    and your transaction is successful, a machine learning model approved your transaction
    as being normal and not fraudulent.


    In light of all these, companies and organizations have poured in more money into
    developing better performing models through research and collaboration between
    industry and academia.


    It wasn’t always the case that machine learning was the darling of the computer
    science community, however in recent years three factors have conspired to give
    it an exalted place.


    ●    With the dawn of the internet, more data was being collected and this lead
    to the age of big data.


    ●    Computational resources became faster and cheaper with the arrival of Graphics
    Processing Units (GPUs), which were originally developed by the gaming industry
    to render graphics but are well suited for parallel computation.


    ●    Better algorithms were developed which lead to better accuracy of models.


    Regression


    It’s time to review some of your high school algebra. Because the truth is this
    subcategory of Supervised Learning doesn’t look like machine learning at all.


    y = mx + b


    That’s the equation of the straight line. This simply means that if you know the
    value of x, you’ll also know the value of y (m and b are constants). Once we’ve
    determined these constants and we have a value of x, we’ll also predict the value
    of y.


    It’s similar here in Regression in the context of machine learning. For instance,
    we might predict housing prices based on the given number of rooms or how large
    each house is (how many square meters). This is a form of Supervised Learning
    because first we have the number of rooms or the number of square meters (the
    independent variables) and the corresponding housing price (the target).


    Simple and Multiple Linear Regression


    Regression can come in many forms. In the example above, there are only two sets
    of quantitative values. First is the number of rooms or square meters. The second
    (which is the target) is the corresponding housing price. We can plot those data
    points and perhaps fit a straight line that best approximates the relationship
    between the two.


    Of course, the straight line won’t touch all the points. It’s just an approximation
    of how the two sets of values are related. Here’s an illustration:


    ![](images/00055.jpeg)


    Intuitively, we can see that the line attempts to minimise its distance between
    all the points. But well, no one can please everybody so instead the straight
    line is actually the result of minimizing the sum of squared errors (least squares
    solution) between a line and all the points.


    In multiple linear regression, there are two or more independent variables, that
    is the number of predictors which determine the outcome y, are more than one.
    The relationship is still linear but y is dependent on more variables.


    ![](images/00056.jpeg)


    Let us now look at a practical example. We would use the regression techniques
    explained above to predict the price of a house in a neighborhood given information
    about the house in the form of features. The dataset we would use is the Boston
    house pricing dataset and it contains 506 observations. The dataset can be downloaded
    from this URL ([https://forge.scilab.org/index.php/p/rdataset/source/file/master/csv/MASS/Boston.csv](https://forge.scilab.org/index.php/p/rdataset/source/file/master/csv/MASS/Boston.csv)).


    First we import relevant libraries and load the dataset using Pandas.


    import numpy as np


    import pandas as pd


    import matplotlib.pyplot as plt


    \# matplotlib magic command for Jupyter notebook


    %matplotlib inline


    dataset = pd.read\_csv(''Boston.csv'')


    dataset.head()


    ![](images/00057.jpeg)


    The dataset has 13 predictors such as the number of rooms in the house, age of
    house, pupil-teacher ratio in the town etc.


    Let us plot the relationship between one of the predictors and the price of a
    house to see whether we can come up with any explanation from the visualization.
    The predictor we would use is the per capita crime rate by town which captures
    the rate of crime in the neighborhood.'
