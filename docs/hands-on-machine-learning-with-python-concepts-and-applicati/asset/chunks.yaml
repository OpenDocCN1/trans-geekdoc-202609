    Implementation of the Model


    Clustering is a type of unsupervised learning technique in which there are no
    explicit labels. Clustering is used to discover groups of data points in a dataset.
    A group or cluster is made up of members that are similar to each other but are
    collectively different from other clusters. A good clustering algorithm must have
    the ability to discover some or all hidden clusters in a dataset, should exhibit
    in cluster similarity but different clusters should be dissimilar or far from
    each other. The clustering algorithm should also be scalable to larger datasets
    and should be able to handle noisy data points and outliers.


    There are two main categories of clustering algorithms - hierarchical clustering
    algorithms and partitive clustering algorithms. In hierarchical clustering, there
    is a clear relationship between discovered clusters. This can take the form of
    a hierarchy or order. Whereas in partitive algorithms, the relationship between
    clusters is not clear and it is sometimes referred to as having a flat structure.
    Clustering algorithms can also be seen from another perspective. Algorithms that
    allow a data point to belong to more than one cluster are known as soft clustering
    algorithms. In such a process, probabilities are assigned to each data point to
    indicate how likely it belongs to any particular cluster. Hard clustering algorithms
    on the other hand, require that data points only belong to exactly one cluster.


    Hierarchical clustering algorithms are deterministic, which means that each time
    the algorithm is deployed on a dataset, we are bound to find the same clusters.
    This enables reproducibility of results. Partitive algorithms are non-deterministic
    and would produce a slightly different cluster representation with every run through
    the dataset.


    Bottom-up Hierarchical Clustering


    Bottom-up hierarchical clustering is a type of hierarchical clustering technique
    whereby every data point begins in a cluster of its own. A distance measure such
    as Euclidean distance is then used to calculate the distance of all points from
    one another. The points with the shortest distance are merged to form a cluster
    of their own. The process continues until all points belong to one big cluster.
    The intuition is that data points which are similar are likely to be separated
    by a small distance in the feature space.


    A popular type of bottom-up clustering is the hierarchical agglomerative clustering
    algorithm. Here the distance measure may be Euclidean, Manhattan or Minkowski
    distance. When clusters are created, the distance between clusters may be the
    shortest distance between any two points in both clusters, known as single linkage,
    the farthest distance between two points, referred to as complete linkage or it
    may be an average of the distance of all data points in both clusters (average
    linkage).


    Below is the mathematical expression for single linkage as described above.


