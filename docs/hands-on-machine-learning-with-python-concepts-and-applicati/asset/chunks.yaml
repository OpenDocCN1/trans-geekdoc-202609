    \ Parch、SibSp 和 FamilySize，专注于 isAlone：\n\n```python\ntrain_df = train_df.drop(['Parch',\
    \ 'SibSp', 'FamilySize'], axis=1)\ntest_df = test_df.drop(['Parch', 'SibSp', 'FamilySize'],\
    \ axis=1)\ncombine = [train_df, test_df]\ntrain_df.head()\n```\n\n![](img/00042.jpeg)\n\
    \n我们尚未进入实际机器学习阶段。迄今大多是数据转换和操作。许多步骤其实是可选的。你甚至可能想出丢弃或创建新特征的新方法。也可能丢弃大部分特征，但模型无法从可用资源中最优学习。\n\
    \n还记得我们做了假设。好在能早期测试其有效性。\n\n继续前进。数据转换和操作还没结束（我知道你急于投入机器学习）。我们可以创建一个结合 Pclass 和\
