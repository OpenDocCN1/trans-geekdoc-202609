  ```\n\n从上述散点图可以看出，我们模型的预测值接近实际房价，因此点集中分布。\n\n\n\n\n## K 近邻算法\n\n### K 近邻算法简介\n\n\
  要理解 K 近邻算法，我们首先需要了解最近邻算法。最近邻算法是一种可用于回归和分类任务的算法，但通常用于分类，因为它简单直观。\n\n在训练阶段，最近邻算法仅仅是记住输入和输出的所有数据值。在测试阶段，当提供一个数据点并期望得到类别标签时，它会在其记忆中搜索具有与测试数据点最相似特征的任何数据点，然后返回该相关数据点的标签作为预测结果。最近邻分类器的训练时间非常快，因为它只是存储所有样本。然而，在测试时，其速度较慢，因为它需要搜索所有存储的示例以找到最佳匹配。随着数据集的增加，获得分类预测所花费的时间也会增加。\n\
  \nK 近邻算法是最近邻算法的一种修改，其中输入的类别标签由距离它最近的 k 个示例进行投票决定。也就是说，预测标签将是其邻近代表中多数投票的标签。因此，k 值为\
  \ 5 意味着，获取待分类输入的五个最相似示例，并根据这五个示例的多数类别标签来选择类别标签。\n\n现在让我们看一个示例图像来加深理解：\n\n![](img/00071.jpeg)\n\
  \n待分类的新示例被放置在向量空间中，当 k=1 时，选择离它最近的示例的标签作为其标签。在这种情况下，新示例被归类为属于类别 1。当 k=1 时，K 近邻算法退化为最近邻算法。\n\
  \n从图中可以看出，当 k=3 时，我们使用一种称为距离度量的相似性指标选择离新示例最近的 3 个示例。我们看到有两个近邻示例预测类别为类别 2（红色三角形），而剩余的一个示例预测类别为类别\
  \ 1（蓝色正方形）。因此，新数据点的预测类别为类别 2，因为它拥有多数票。\n\n用于衡量示例邻近性的距离度量可以是 L1 或 L2 距离。L1 距离是两点之间差值绝对值的和，公式如下：\n\
  \n![<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>d</mi><mn>1</mn></msub><mfenced><mrow><mi>P</mi><mo>,</mo><mi>q</mi></mrow></mfenced><mo>=</mo><munderover><mo>&#x2211;</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><mn>1</mn><msub><mi>P</mi><mi>i</mi></msub><mo>-</mo><msub><mi>q</mi><mi>i</mi></msub><mn>1</mn></math>](img/00072.jpeg)\n\
  \nL1 距离有时被称为曼哈顿距离。\n\nL2 是另一种可使用的距离度量。它是两点之间使用直线的欧几里得距离。公式如下：\n\n![<math xmlns=\"\
  http://www.w3.org/1998/Math/MathML\"><msub><mi>d</mi><mn>2</mn></msub><mfenced><mrow><mi>p</mi><mo>,</mo><mi>q</mi></mrow></mfenced><mo>=</mo><msqrt><munderover><mo>&#x2211;</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><msup><mfenced><mrow><msub><mi>q</mi><mi>i</mi></msub><mo>-</mo><msub><mi>P</mi><mi>i</mi></sub></mrow></mfenced><mn>2</mn></msup></msqrt></math>](img/00073.jpeg)\n\
  \nk 值为 1 会正确分类所有训练示例，因为与某点最相似的示例将是它自己。这将是一种次优方法，因为分类器将无法学到任何东西，也就没有能力泛化到未训练过的数据。更好的解决方案是以一种在验证集上表现良好的方式选择\
  \ k 值。验证集通常用于调整超参数 k。较高的 k 值对决策边界有平滑作用，因为异常类别被多数投票模式“吞没”。增加 k 值通常最初会带来更高的准确率，但在变得过大之前，我们会达到边际效益递减的点，此时准确率下降，验证误差开始上升。\n\
  \n![](img/00074.gif)\n\nk 的最优值是验证误差最低的点。\n\n### 如何创建和测试 K 近邻分类器\n\n现在我们将所学知识应用到一个二分类问题中。我们将使用的数据集是\
  \ Pima 印第安人糖尿病数据库，该数据集来自国家糖尿病、消化和肾脏疾病研究所。该数据集的主要目的是根据对患者进行的诊断测量，预测患者是否患有糖尿病。研究中的患者为女性，具有\
  \ Pima 印第安人血统，且年龄至少 21 岁。\n\n数据集可在以下网址找到：\n\n[`www.kaggle.com/uciml/pima-indians-diabetes-database/data`](https://www.kaggle.com/uciml/pima-indians-diabetes-database/data)\n\
  \n由于我们处理的是两个互斥的类别，患者要么患有糖尿病，要么没有，这可以建模为二分类任务，为了示例目的，我们将使用 K 近邻分类器进行分类。\n\n第一步是导入我们将使用的库。\n\
  \n```\nimport numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\
  ```\n\n接下来我们使用 Pandas 加载数据。\n\n```\ndataset = pd.read_csv('diabetes.csv')\n```\n\
  \n一如既往，我们应该做的是了解我们的数据集和可用的特征。\n\n```\ndataset.head(5)\n```\n\n![](img/00075.jpeg)\n\
  \n我们看到有 8 个特征和 9 列，其中`Outcome`是我们要预测的二元标签。\n\n要了解数据集中的观测值数量，我们运行\n\n```\ndataset.shape\n\
  ```\n\n这显示数据集包含 768 个观测值。\n\n现在让我们获取数据的摘要，以便了解属性的分布情况。\n\n```\ndataset.describe()\n\
  ```\n\n![](img/00076.jpeg)\n\ncount 行显示所有特征的值恒为 768.0，应该记得这与我们数据集中的行数相同。这表明我们没有任何特征的缺失值。mean、std\
