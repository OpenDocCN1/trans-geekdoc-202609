  \ 74% 的样本，预测标签与真实标签相同。\n\n##### 完整代码示例\n\n```python\n#### import libraries\nimport\
  \ numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\n#### read\
  \ dataset from csv file\ndataset = pd.read_csv('diabetes.csv')\n\n#### display first\
  \ five observations\ndataset.head(5)\n\n###### get shape of dataset, number of observations,\
  \ number of features\ndataset.shape\n\n###### get information on data distribution\n\
  dataset.describe()\n\n###### plot correlation between features\ncorr = dataset.corr()\
  \          # data frame correlation function\nfig, ax = plt.subplots(figsize=(13,\
