  \n## 安装与设置\n\n您对机器学习感到兴奋吗？我们稍后再深入探讨。但首先，我们必须完成所有设置。我们将使用最流行、最便捷的工具，以便您能更专注于机器学习本身。\n\
  \n## 下载 Anaconda\n\n如果您尚未安装 Anaconda，请访问 <https://www.anaconda.com/download/>，下载安装程序并双击运行（大多情况下只需标准安装即可）。请选择\
  \ Python 3+ 版本，这样结果将保持一致，且您不会遇到太多问题。此外，Python 3 是未来的方向（Python 2 于 2020 年停止维护）。\n\
  \n无论如何，为什么选择 Anaconda？它是全球众多数据科学家和机器学习工程师的热门选择（已有超过 600 万用户）。它已预装 Python 3 和许多对机器学习有用的库和包，这也是安装文件较大（500+\
  \ MB）的原因。\n\n您将在本书中反复遇到的一些最强大的包包括：\n\n*   `Numpy`\n*   `Scipy`\n*   `Matplotlib`\n\
  *   `Pandas`\n*   `Scikit-learn`\n*   `NLTK`（自然语言工具包）\n*   `Jupyter Notebook`\n\n\
  如果您想快速熟悉 Anaconda，这里有一份 PDF 速查表（您也可以将其作为未来的参考资料）：\n\n<https://docs.anaconda.com/_downloads/Anaconda-Starter-Guide-Cheat-Sheet.pdf>\n\
  \n## 运行 Jupyter Notebook\n\n此时，您应该已经安装好 Anaconda。下一步是运行 `Jupyter Notebook`。它是一个基于浏览器的笔记本，您可以在其中添加代码、文本和笔记。从字面上理解，我们可以把它看作一个笔记本，这也是许多大学教授和研究人员使用它的原因。\n\
  \n如果您已安装 Anaconda，请在已安装的程序中找到 `Anaconda Prompt`。打开它，然后输入 `jupyter notebook`（不含引号），这将在您的默认浏览器中启动笔记本。您可以在那里看到您的文件和文件夹。您可以导航到目标文件夹并在其中创建新的笔记本。\n\
  \n它非常直观易用，随着您阅读后面的示例，您将学会如何使用它。您也可以通过阅读他们的快速入门指南进一步了解 `Jupyter Notebook`：\n\n<http://jupyter-notebook-beginner-guide.readthedocs.io/en/latest/>\n\
  \n无论如何，这里是 Python 之禅（Python 设计的指导原则，见 <https://www.python.org/dev/peps/pep-0020/>）。我们将其放在此处，旨在提醒您遵循优秀的编码和工作实践：\n\
  \n```\nBeautiful is better than ugly.\n\nExplicit is better than implicit.\n\nSimple\
  \ is better than complex.\n\nComplex is better than complicated.\n\nFlat is better\
  \ than nested.\n\nSparse is better than dense.\n\nReadability counts.\n\nSpecial\
  \ cases aren't special enough to break the rules.\n\nAlthough practicality beats\
  \ purity.\n\nErrors should never pass silently.\n\nUnless explicitly silenced.\n\
  \nIn the face of ambiguity, refuse the temptation to guess.\n\nThere should be one--\
  \ and preferably only one --obvious way to do it.\n\nAlthough that way may not be\
  \ obvious at first unless you're Dutch.\n\nNow is better than never.\n\nAlthough\
  \ never is often better than *right* now.\n\nIf the implementation is hard to explain,\
  \ it's a bad idea.\n\nIf the implementation is easy to explain, it may be a good\
  \ idea.\n\nNamespaces are one honking great idea -- let's do more of those!\n```\n\
  \n## Python 快速入门\n\n现在您已安装好必要的工具和包。下一步是快速回顾 Python，以便您能跟上后续的讨论和示例。\n\n这不会是最全面的 Python\
  \ 指南。但这可能足以支撑您继续学习，因为我们将涵盖基础知识以及您日后用于机器学习的最重要内容。而且得益于 Python 直观的语法，您仍能跟上后续章节的课程。\n\
  \n## 字符串、列表、函数及更多\n\n我们可以将值（字符串、整数和浮点数）赋给变量，稍后访问它们（并对它们进行许多其他操作）。这是一个示例：\n\n```\n\
  yourName = 'Felicity'\n\nprint(yourName)\n```\n\n返回 `'Felicity'`\n\n```\nprint(yourName[0])\n\
  ```\n\n这将打印 `'F'`，即 `'Felicity'` 的第一个字母。Python 中索引从零开始。\n\n```\nprint(yourName[0:3])\n\
  ```\n\n结果将是 `'Fel'`。从零索引开始，但不包含索引 3。\n\n```\nprint(len(yourName))\n```\n\n计算字母数量或查明字符串的“长度”。所以这里的结果将是\
  \ 8。\n\n说到数字，我们也可以将数值赋给变量：\n\n```\nyourAge = 22\n\nprint(yourAge)  # 这是一条注释。无论如何，这将打印\
  \ '22'\n\nprint(yourAge * 2)  # 打印 22*2，即 44\n\nyourAge = 25  # 我们也可以重新给变量赋值。\n\
  ```\n\n现在让我们谈谈 `Lists`（列表，Python 中最实用、最流行的数据结构之一）：\n\n```\nmyList = [1,2,3,4]\n\n\
  myList.append(5)  # myList 变为 [1,2,3,4,5]\n\nmyList[0]  # 这将返回列表中的第一个值，即 1。请记住 Python\
  \ 中索引从零开始。\n\nprint(len(myList))  # 打印列表的“长度”，在本例中为 5。\n```\n\n现在让我们深入了解 `Functions`（函数）和\
  \ `Flow Control`（流程控制）（`If`、`Elif` 和 `Else` 语句）：\n\n```\ndef add_numbers(a,b):\n\
  \    return a + b\n\nprint(add_numbers(3,4))\n```\n\n首先我们定义一个函数并包含一条指令。然后我们调用或测试它，但这次包含数字。函数\
  \ `add_numbers` 将把 3 和 4 相加，并打印 7。\n\n```\ndef if_even(num):\n    if num % 2 ==\
  \ 0:\n        print(\"Number is even.\")\n    else:\n        print(\"It's odd.\"\
  )\n\nif_even(24)  # 这将返回 \"Number is even.\"\nif_even(25)  # 这将返回 \"It's odd.\"\n\
  ```\n\n好了，我们的 Python 快速入门到此结束。接下来，让我们讨论如何使用 `Modules`（模块）。\n\n## Jupyter Notebook\n\
  \n\n\n\n\n## 使用 Jupyter Notebook 和 Python 库进行数据科学\n\n数据科学是一项实验性工作，因为需要测试假设以查看数据是否支持它们。**Jupyter\
  \ Notebook** 是一个交互式 Web 应用程序，它捆绑了一个 **IPython shell**，这是一个用于 Python 计算的增强型 shell。代码、文本和可视化内容可以并排编写，并存储在一种特殊的笔记本格式中。这意味着项目可以轻松地在团队间共享，并且代码可以轻松复现，因为执行项目所需的每项功能都捆绑在笔记本中。Jupyter\
  \ Notebook 支持多种编程语言，如 R、Julia、Python 等。Python 中的 Jupyter 由 `IPython` shell 提供支持，它提供了标准\
  \ Python 中没有但通常对交互式计算很有用的额外“魔法”函数。\n\nJupyter Notebook 还支持 **LaTeX**，因此可以在单元格块中内联编写数学公式。数据可视化也可以内联进行，并且可以通过使用\
  \ Markdown 语法在笔记本中加入详细的文档或解释。\n\n`IPython` 和 `Jupyter Notebook` 会随 Anaconda 自动安装。要访问\
  \ Jupyter Notebook 界面，请从终端运行以下命令：\n\n```\n$ jupyter notebook  # 启动 jupyter notebook\
  \ web 界面的命令\n```\n\n上述命令会在浏览器会话中打开一个包含 Jupyter Notebook Web 界面的窗口。Jupyter Notebook\
  \ 会话在运行命令的同一目录中打开。\n\n![Jupyter Notebook 界面](img/00009.jpeg)\n\n您可以导航到笔记本文件并单击它以运行，或从界面创建新笔记本。\n\
  \n![创建新笔记本](img/00010.jpeg)\n\n创建新笔记本后，它会启动一个新实例，从中可以交互式地进行编码。\n\n![新笔记本实例](img/00011.jpeg)\n\
  \nJupyter Notebook 在数据科学和机器学习领域非常流行，因为它们提供了一种专门的格式，封装了编码、可视化和文档。\n\n### 核心库：NumPy、Pandas、SciPy、Matplotlib、Scikit-learn\n\
  \n方便的是，我们将在机器学习示例和项目中使用模块和库。这些库包含预构建的代码，因此我们不必从头编写所有内容。通常这些库不会默认加载，所以我们首先必须 `import`\
  \ 它们才能使用。\n\n这就是我们在使用 `numpy`、`pandas`、`matplotlib` 和 `scikit-learn` 时要做的事情。以下是导入它们的示例：\n\
  \n```python\nimport numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as\
  \ plt\n\n### 导入数据集、分类器和指标\nfrom sklearn import datasets, svm, metrics\n```\n\n无论如何，为什么要使用\
  \ `numpy` 和其他模块？\n\n#### NumPy\n\n**NumPy** 是用于 Python 科学计算的基础包。此外，与传统的列表相比，使用 `numpy`\
  \ 可以更快地访问项目。\n\n## Pandas\n\n那 `pandas` 呢？在本书中，`pandas` 将用于导入和读取数据。根据其网站 ([`pandas.pydata.org/`](https://pandas.pydata.org/))：\n\
  \n> “pandas 是一个开源的、BSD 许可的库，为 Python 编程语言提供高性能、易于使用的数据结构和数据分析工具。”\n\n## Matplotlib\n\
  \n除了访问数据，我们通常还必须对其进行可视化。这就是 `matplotlib` 的用武之地 ([`matplotlib.org/`](https://matplotlib.org/))：\n\
  \n> “Matplotlib 是一个 Python 2D 绘图库，它能在各种平台上生成多种硬拷贝格式和交互式环境下的出版质量图形。”\n\n还有其他数据可视化库，如\
  \ **Bokeh** 和 **seaborn**。这些库可以生成更酷炫的视觉效果，但本书主要使用 `matplotlib`。\n\n#### Scikit-learn\n\
  \n最后，让我们谈谈 `scikit-learn`。根据其网站 ([`scikit-learn.org/stable/index.html`](http://scikit-learn.org/stable/index.html))：\n\
  \n> **scikit-learn: Python 中的机器学习**\n>\n> *   用于数据挖掘和数据分析的简单高效工具\n> *   人人可用，可在各种上下文中复用\n\
  > *   构建于 `NumPy`、`SciPy` 和 `matplotlib` 之上\n> *   开源，可商业使用 - BSD 许可证\n\n使用 `scikit-learn`，您可以执行以下机器学习任务：\n\
  \n*   **分类**（某项目属于哪个类别？）\n*   **回归**（预测一个值）\n*   **聚类**（揭示数据中的子群）\n*   **降维**（减少需考虑的随机变量数量，以便于可视化）\n\
  *   **模型选择**（选择并比较模型及其准确性）\n*   **预处理**（数据集标准化和特征提取）\n\n简而言之，`scikit-learn` 是在 Python\
  \ 中进行机器学习的便捷且强大的工具。它可能不是最好或最高效的，但对于大多数用途（尤其是学习机器学习）来说已经足够好了。\n\n## Numerical Python\
  \ (NumPy)\n\n**NumPy** 是 Python 中主要的数值计算库。它提供对多维数组对象的访问，并通过若干方法暴露了可对这些数组执行的操作。它支持线性代数运算，如矩阵乘法、内积、单位运算等。`NumPy`\
  \ 与用 C 和 Fortran 编写的底层库进行交互，并将实际计算传递给这些更快、更高效的库。因此，在执行数值计算时，绝不使用原生 Python 控制结构（如循环），因为它们要慢得多。`NumPy`\
  \ 可以被视为提供了一组 Python API，从而实现高效的科学计算。\n\n`NumPy` 数组可以通过嵌套的 Python 列表来初始化。嵌套的层级指定了数组的秩。\n\
  \n```python\nimport numpy as np\n\na = np.array([[1, 2, 3], [4, 5, 6]])  # 创建一个秩为\
  \ 2 的数组\nprint(type(a))\nprint(a.shape)\n```\n\n![数组输出](img/00012.jpeg)\n\n创建的数组秩为\
  \ 2，这意味着它是一个矩阵。从打印的数组大小可以清楚地看到这一点。它包含 2 行 3 列，因此大小为 `(m, n)`。\n\n数组也可以从分布（如正态分布）中随机初始化。模型的可训练参数（如权重）通常随机初始化。\n\
  \n```python\nb = np.random.random((2, 2))  # 创建一个填充随机值的数组\nprint(b)\nprint(b.shape)\n\
  ```\n\n![随机数组输出](img/00013.jpeg)\n\n`NumPy` 包含许多用于操作数组的方法；其中一种方法是矩阵乘积。让我们看一个使用 `NumPy`\
  \ 进行矩阵乘积的示例。\n\n![矩阵乘积示例](img/00014.jpeg)\n\n```python\nx = np.array([[1, 2], [3,\
  \ 4]])\ny = np.array([[5, 6], [7, 8]])\n\n### 矩阵乘积\nprint(np.dot(x, y))\n```\n\n\
  上述示例几乎是瞬间计算完成的，展示了 `NumPy` 的强大功能。\n\n## Pandas\n\n**Pandas** 是一个用 Python 编写的数据操作库，具有用于表格和时间序列数据的高性能数据结构。`Pandas`\
  \ 广泛用于数据分析，大多数数据加载、清洗和转换任务都在 `Pandas` 中执行。`Pandas` 是 Python 数据科学生态系统不可或缺的一部分，因为数据很少以可以直接输入机器学习模型的形式存在。现实世界的数据通常很混乱，包含缺失值，并且需要转换。`Pandas`\
  \ 支持许多文件类型，如 CSV、Excel 电子表格、Python pickle 格式、JSON、SQL 等。\n\n`Pandas` 有两种主要数据结构：`Series`\
  \ 和 `DataFrame`。`Series` 是单列数据的数据结构，而 `DataFrame` 存储类似于矩阵的二维数据。换句话说，`DataFrame`\
  \ 包含存储在许多列中的数据。\n\n下面的代码展示了如何在 `Pandas` 中创建 `Series` 对象。\n\n```python\nimport pandas\
  \ as pd\nimport numpy as np\n\ns = pd.Series([1, 3, 5, np.nan, 6, 8])\nprint(s)\n\
  ```\n\n要创建 `DataFrame`，可以运行以下代码。\n\n```python\ndf = pd.DataFrame(np.random.randn(6,\
  \ 4), columns=list('ABCD'))\nprint(df)\n```\n\n`Pandas` 将其支持的文件格式加载到 `DataFrame`\
  \ 中，然后可以使用 `Pandas` 方法对 `DataFrame` 进行操作。\n\n## Scientific Python (SciPy)\n\n\n\n\
  \n\n### Scipy\n\nScipy 是一个面向数学、科学和工程领域的科学计算库。它构建在 Numpy 之上，并通过提供优化、技术计算、统计、信号处理等额外模块对其进行了扩展。Scipy\
  \ 主要与生态系统中的其他工具（如 Pandas 和 matplotlib）配合使用。\n\n下面是一个使用 scipy 求矩阵逆的简单示例。\n\n```python\n\
  from scipy import linalg\n\nz = np.array([[1,2],[3,4]])\n\nprint(linalg.inv(z))\n\
  ```\n\n![](img/00015.gif)\n\n## Matplotlib\n\nMatplotlib 是一个绘图库，能与 Numpy 及 Python\
  \ 中的其他数值计算库良好集成。它能够生成高质量的图表，并广泛用于数据探索，因为在该领域可视化技术非常重要。Matplotlib 暴露了面向对象的 API，使得在\
  \ Python 中创建强大的可视化变得容易。请注意，要在 Jupyter notebook 中查看图表，必须使用 `matplotlib inline` 魔法命令。\n\
  \n下面是一个使用 Matplotlib 绘制正弦波形的示例。\n\n```python\n## Jupyter notebooks 的魔法命令\n%matplotlib\
  \ inline\n\nimport matplotlib.pyplot as plt\n\n### 计算正弦曲线上点的 x 和 y 坐标\nx = np.arange(0,\
  \ 3 * np.pi, 0.1)\ny = np.sin(x)\n\n### 使用 matplotlib 绘制点\nplt.plot(x, y)\nplt.show()\
  \  # 通过调用 plt.show() 显示图表\n```\n\n![](img/00016.jpeg)\n\n## Scikit-Learn\n\nScikit-Learn\
  \ 是 Python 生态系统中最流行的机器学习库。它是一个非常成熟的库，包含用于分类、回归和聚类的多种算法。Scikit-Learn 中提供了许多常用算法，并暴露了统一的接口来访问它们，因此学会在\
  \ Scikit-Learn 中使用一种分类器，就意味着你能使用其他的分类器，因为训练分类器所调用的方法名称是相同的，无论底层实现如何。\n\n随着我们在本书后续章节中深入数据科学，我们将严重依赖\
  \ Scikit-Learn 完成建模任务。下面是一个创建分类器并使用内置数据集对其进行训练的简单示例。\n\n```python\n### 示例决策树分类器\n\
  from sklearn import datasets\nfrom sklearn import metrics\nfrom sklearn.tree import\
  \ DecisionTreeClassifier\n\n#### 加载鸢尾花数据集\ndataset = datasets.load_iris()\n\n####\
  \ 将 CART 模型拟合到数据\nmodel = DecisionTreeClassifier()\nmodel.fit(dataset.data, dataset.target)\n\
  print(model)\n\n#### 进行预测\nexpected = dataset.target\npredicted = model.predict(dataset.data)\n\
  \n#### 总结模型的拟合情况\nprint(metrics.classification_report(expected, predicted))\nprint(metrics.confusion_matrix(expected,\
  \ predicted))\n```\n\n这是输出结果。如果你看不懂代码也不用担心。我们将在后续章节中更详细地讲解代码的每一部分。\n\n![](img/00017.jpeg)\n\
  \n### 关于 Google TensorFlow\n\nTensorFlow 是“面向所有人的开源机器学习框架”。此外，\n\n“……它为机器学习和深度学习提供了强有力的支持，其灵活的数值计算核心被应用于许多其他科学领域。”\n\
  \n换句话说，如果你的项目主要涉及机器学习和深度学习，那么 TensorFlow 可以让你的工作变得更轻松、更高效。但为什么不用 scikit-learn 呢？\n\
  \nScikit-learn 自带开箱即用的算法，这意味着你只需几行代码就能进行机器学习。另一方面，如果你想专注于深度学习，TensorFlow 则大放异彩。\n\
  \n在这个现代机器学习时代，同时学习 TensorFlow 和 scikit-learn 是很好的。此外，在使用 TensorFlow 之前，后者对于许多数据预处理任务仍然很有用。所以总的来说，熟悉最流行的工具是好的。别担心，只需专注于基础和原理。一旦你掌握了这些，你就会拥有一个坚实的知识库，可以带到任何地方。\n\
  \n## 你的第一个机器学习项目\n\n演示胜过讲述。\n\n这仍然是解释和说明事物的最佳方式。与其再写 1000 个字来解释什么是机器学习，不如直接深入一个例子。\n\
  \n### 泰坦尼克号生存预测\n\n1912 年 4 月泰坦尼克号的沉没是历史上最惨重的海难之一。超过 1500 人失去了生命。幸运的是，有 700 多名幸存者（泰坦尼克号最后一位幸存者已于\
  \ 97 岁高龄去世）。\n\n为了学习，我们这里的目标是将机器学习应用于生存预测。请注意，我们已经拥有标记数据（乘客及其是否幸存）。这里的目标是从数据（训练数据）中学习，并将该学习应用到新的或未见过的数据（测试集）中。\n\
  \n换句话说，我们的计算机和模型将从数据中推导出模式和“洞察”，以便进行预测。在这里，目标是根据可用数据预测谁会是幸存者。正如 Kaggle ([`www.kaggle.com/c/titanic`](https://www.kaggle.com/c/titanic))\
  \ 所述，问题定义如下：\n\n> “已知一个训练样本集，其中列出了在泰坦尼克号灾难中幸存或未幸存的乘客，我们的模型能否根据不包含生存信息的给定测试数据集，确定测试数据集中的这些乘客是否幸存。”\n\
  \n确实，运气在生存中起着巨大作用。但其他因素也会影响生存概率。例如，如果乘客是儿童或处于上层舱位，他或她生存的几率会更大。\n\n无论如何，让我们直接开始机器学习，以便更好地解释这一点（来源：[`www.kaggle.com/startupsci/titanic-data-science-solutions/notebook`](https://www.kaggle.com/startupsci/titanic-data-science-solutions/notebook)）：\n\
  \n第一步是关注问题，然后查看数据。我们不应急于实现复杂的算法。通常，非机器学习任务在定义和解决问题方面更为重要。\n\n为了访问数据，我们首先使用 pandas：\n\
  \n```python\nimport pandas as pd\n```\n\n下一步是访问数据并使其准备好供后续处理和分析：\n\n```python\n\
  train_df = pd.read_csv('../input/train.csv')\ntest_df = pd.read_csv('../input/test.csv')\n\
  combine = [train_df, test_df]\n```\n\n请记住，过程是先从训练集（`train_df`）学习，然后将该学习应用到 `test_df`\
  \ 中，看看我们的预测有多好。\n\n数据准备好后，让我们看一眼：\n\n```python\ntrain_df.head(10)\n```\n\n![](img/00018.jpeg)\n\
