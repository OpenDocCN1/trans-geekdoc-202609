  ```\n\n#### 另一个应用：鸢尾花分类\n\n我们将用于此任务的数据集是鸢尾花分类数据集。该数据集包含 150 个样本，涵盖 3 类鸢尾花品种，分别是山鸢尾、变色鸢尾和维吉尼亚鸢尾。该数据集可从\
  \ Kaggle 下载（[`www.kaggle.com/saurabh00007/iriscsv/downloads/Iris.csv/1`](https://www.kaggle.com/saurabh00007/iriscsv/downloads/Iris.csv/1)）。\n\
  \n数据科学流程的第一步是获取数据，我们已经完成。接下来我们需要处理数据或对其进行预处理，使其转换为适合的形式，然后再传递给机器学习分类器。\n\n#####\
  \ 导入库\n\n```python\nimport numpy as np\nimport pandas as pd\nimport matplotlib.pyplot\
  \ as plt\nimport scipy as sp\n```\n\n接下来我们使用 Pandas 加载包含在 CSV 文件中的数据集，并打印前几行，以便了解数据集包含的内容。\n\
  \n```python\ndataset = pd.read_csv('Iris.csv')\ndataset.head(5)\n```\n\n![数据集预览](img/00078.jpeg)\n\
  \n正如我们所见，有 4 个预测变量，分别是萼片长度、萼片宽度、花瓣长度和花瓣宽度。品种是我们感兴趣预测的目标变量。由于有 3 个类别，这是一个多分类问题。\n\
  \n根据我们的观察，我们将列分离为特征（`X`）和目标（`y`）。\n\n```python\nX = dataset.iloc[:, 1:5].values\
  \  # select features ignoring non-informative column Id\ny = dataset.iloc[:, 5].values\
  \    # Species contains targets for our model\n```\n\n我们的目标目前以文本形式存储。我们需要将它们转换为分类变量。为此，我们利用\
  \ Scikit-Learn 的标签编码器。\n\n```python\nfrom sklearn.preprocessing import LabelEncoder\n\
  le = LabelEncoder()\ny = le.fit_transform(y)  # transform species names into categorical\
  \ values\n```\n\n接下来，我们将数据集分割为训练集和测试集，以便能够适当地评估训练模型的性能。\n\n```python\nfrom sklearn.model_selection\
  \ import train_test_split\nX_train, X_test, y_train, y_test = train_test_split(X,\
  \ y, test_size=0.3)\n```\n\n### 计算相似度\n\n在上一节中，我们成功准备了数据，并从高层解释了 K-NN 算法的内部工作原理。现在我们将在\
  \ Python 中实现一个可工作的版本。K-NN 算法最重要的部分是相似度度量，在本例中是距离度量。有几种距离度量，但我们将使用欧几里得距离，即欧几里得平面上两点之间的直线距离。该平面可以是二维、三维等。欧几里得距离有时被称为\
  \ L2 距离。其公式如下。\n\n![欧几里得距离公式](img/00079.gif)\n\nL2 距离是从测试样本计算到训练集中每个样本的距离，以确定它们有多近。我们可以使用\
  \ Numpy 在 Python 中实现 L2 距离，如下所示。\n\n```python\ndef euclidean_distance(training_set,\
  \ test_instance):\n    # number of samples inside training set\n    n_samples =\
  \ training_set.shape[0]\n    # create array for distances\n    distances = np.empty(n_samples,\
  \ dtype=np.float64)\n    # euclidean distance calculation\n    for i in range(n_samples):\n\
  \        distances[i] = np.sqrt(np.sum(np.square(test_instance - training_set[i])))\n\
  \    return distances\n```\n\n### 定位邻居\n\n实现了相似度度量后，我们可以构建一个功能齐全的类，能够识别最近邻并返回分类。值得注意的是，K\
  \ 近邻算法没有训练阶段。它只是将所有数据点存储在内存中。只有在测试阶段计算距离并返回预测时，它才执行计算。下面是一个利用上述距离函数的 K-NN 算法实现。\n\
  \n```python\nclass MyKNeighborsClassifier():\n    \"\"\"\n    Vanilla implementation\
  \ of KNN algorithm.\n    \"\"\"\n    def __init__(self, n_neighbors=5):\n      \
  \  self.n_neighbors = n_neighbors\n\n    def fit(self, X, y):\n        \"\"\"\n\
  \        Fit the model using X as array of features and y as array of labels.\n\
  \        \"\"\"\n        n_samples = X.shape[0]\n        # number of neighbors can't\
  \ be larger then number of samples\n        if self.n_neighbors > n_samples:\n \
  \           raise ValueError(\"Number of neighbors can't be larger then number of\
  \ samples in training set.\")\n        # X and y need to have the same number of\
  \ samples\n        if X.shape[0] != y.shape[0]:\n            raise ValueError(\"\
  Number of samples in X and y need to be equal.\")\n        # finding and saving\
  \ all possible class labels\n        self.classes_ = np.unique(y)\n        self.X\
  \ = X\n        self.y = y\n\n    def pred_from_neighbors(self, training_set, labels,\
  \ test_instance, k):\n        distances = euclidean_distance(training_set, test_instance)\n\
  \        # combining arrays as columns\n        distances = sp.c_[distances, labels]\n\
  \        # sorting array by value of first column\n        sorted_distances = distances[distances[:,\
  \ 0].argsort()]\n        # selecting labels associeted with k smallest distances\n\
  \        targets = sorted_distances[0:k, 1]\n        unique, counts = np.unique(targets,\
  \ return_counts=True)\n        return unique[np.argmax(counts)]\n\n    def predict(self,\
  \ X_test):\n        # number of predictions to make and number of features inside\
  \ single sample\n        n_predictions, n_features = X_test.shape\n        # allocationg\
  \ space for array of predictions\n        predictions = np.empty(n_predictions,\
  \ dtype=int)\n```\n\n\n\n\n\n### K 近邻算法实现\n\n```python\n#### loop over all observations\n\
  for i in range(n_predictions):\n    # calculation of single prediction\n    predictions[i]\
  \ = self.pred_from_neighbors(self.X, self.y, X_test[i, :], self.n_neighbors)\nreturn(predictions)\n\
  ```\n\n上述类的工作流程是：在测试阶段，输入一个测试样本（实例），并计算其到整个训练集中每个样本的欧氏距离。根据要考虑的最近邻居数量（`k`值），这些邻居的标签参与投票，以确定测试样本的类别。\n\
  \n### 生成响应\n\n为了生成响应或创建预测，我们首先必须初始化自定义分类器。`k` 的值不能超过数据集中的样本数量。这是意料之中的，因为我们无法与训练集中可用数量以上的邻居进行比较。\n\
  \n```python\n#### instantiate learning model (k = 3)\nmy_classifier = MyKNeighborsClassifier(n_neighbors=3)\n\
  ```\n\n接下来，我们可以在数据上训练模型。请记住，在 K-NN 中实际上不发生训练过程。\n\n```python\n#### fitting the model\n\
  my_classifier.fit(X_train, y_train)\n```\n\n### 评估准确率\n\n为了评估模型的准确率，我们在模型未见过的示例（如测试集中的样本）上测试其性能。\n\
  \n```python\n#### predicting the test set results\nmy_y_pred = my_classifier.predict(X_test)\n\
  ```\n\n然后我们将预测类别与真实标签进行核对，并使用 Scikit-Learn 的准确率模块来计算分类器的准确率。\n\n```python\nfrom\
  \ sklearn.metrics import confusion_matrix, accuracy_score\n\naccuracy = accuracy_score(y_test,\
  \ my_y_pred) * 100\nprint('Accuracy: ' + str(round(accuracy, 2)) + ' %.')\n```\n\
  \n![](img/00080.jpeg)\n\n我们的模型达到了 97.8% 的准确率，对于这样一个简单而优雅的模型来说，这令人印象深刻。\n\n### 维度灾难\n\
  \n当输入空间的维度较小时（如本例所示），K 近邻算法表现最佳。我们有四个预测变量（花萼长度、花萼宽度、花瓣长度、花瓣宽度）输入算法。K-NN 在高维输入空间（如图像处理中遇到的空间）中表现吃力。这是因为距离度量所表达的相似性度量非常有限，无法正确建模这种高维空间。通常，机器学习算法试图降低维度，以便我们对低维空间的直觉仍然适用。当维度数量增加时，算法的准确率或性能通常会下降。这被称为**维度灾难**。\n\
  \n## 朴素贝叶斯\n\n### 朴素贝叶斯的应用\n\n朴素贝叶斯算法是一种基于贝叶斯定理的**急切学习算法**，其假设是：给定类别标签的情况下，所有特征相互独立。朴素贝叶斯算法非常适合文本分类，因为其测试阶段的预测速度很快，因此可以部署在大型数据集上进行推理。\n\
  \n朴素贝叶斯通常用于需要实时预测的应用场景，例如信用卡交易的欺诈检测。在这些应用中，需要一个能够近乎瞬间完成分类的分类器。朴素贝叶斯还广泛用于文本分类、垃圾邮件过滤和情感分析。在垃圾邮件过滤中，邮件或短信的单词作为模型的输入特征，并假设每个单词与其他单词相互独立。当这种独立性假设成立时，朴素贝叶斯通常能产生良好的结果，加上其推理时间短，有时比更复杂的分类器更受青睐。\n\
  \n朴素贝叶斯算法广泛应用的另一个领域是**多类分类**。在该领域，给定输入特征可以预测多个类别或类别，并为预测类别分配概率。\n\n### 如何在 Python\
  \ 中使用朴素贝叶斯构建基础模型\n\n在我们的实战示例中，我们将使用 Python 构建一个朴素贝叶斯模型来解决垃圾短信分类问题。我们将使用 SMS 垃圾邮件收集数据集，这是一个包含\
  \ 5,574 条英语短信的集合，并已标注类别。共有两个类别——ham（正常短信）和 spam（垃圾短信）。该数据集可从以下 URL 下载（`https://www.kaggle.com/uciml/sms-spam-collection-dataset/downloads/spam.csv/1`）。\n\
  \n我们将使用 Scikit-Learn 机器学习库中的多项式朴素贝叶斯分类器。像往常一样，我们首先导入将要使用的库。\n\n```python\nimport\
  \ numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\n### comment\
