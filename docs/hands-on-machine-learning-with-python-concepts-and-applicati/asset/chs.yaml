  这里我们还考虑了一个额外特征（`Fare`）。注意支付更高票价的乘客有更好的生存机会。还要注意登船港口与生存率之间存在相关性。因此，在后续分析中包含 `Fare`\
  \ 是好的。\n\n### 特征工程实施\n\n下一步是排除无关特征并包含相关特征。\n\n```python\nprint(\"Before\", train_df.shape,\
  \ test_df.shape, combine[0].shape, combine[1].shape)\ntrain_df = train_df.drop(['Ticket',\
  \ 'Cabin'], axis=1)\ntest_df = test_df.drop(['Ticket', 'Cabin'], axis=1)\ncombine\
  \ = [train_df, test_df]\nprint(\"After\", train_df.shape, test_df.shape, combine[0].shape,\
  \ combine[1].shape)\n```\n\n结果如下：\n\n```text\nBefore (891, 12) (418, 11) (891, 12)\
  \ (418, 11)\nAfter (891, 10) (418, 9) (891, 10) (418, 9)\n```\n\n因为我们从训练和测试数据中删除了\
  \ `Ticket` 和 `Cabin`，所以特征变少了。\n\n请记住，我们之前也要移除 `Name` 和 `PassengerId`，因为它们似乎与生存率无关。但\
  \ `Name` 实际上可能是一个人生存的“信号”。例如，如果名字中包含 \"Miss\" 或 \"Mrs.\"，很可能是女性（意味着更高的生存率，因为女性生存率较高）。\n\
  \n因此，创建一个新特征 `Title`（称谓）可能是好的，因为这可能与生存率相关。我们可以通过以下代码实现（你应该熟悉 Python 中的正则表达式）：\n\n\
  ```python\nfor dataset in combine:\n    dataset['Title'] = dataset.Name.str.extract('\
  \ ([A-Za-z]+)\\.', expand=False)\n\npd.crosstab(train_df['Title'], train_df['Sex'])\n\
  ```\n\n![](img/00029.jpeg)\n\n称谓种类太多。也许将大多数称谓归类为 \"Rare\" 以便于处理，然后查看称谓及对应的生存百分比：\n\
  \n```python\nfor dataset in combine:\n    dataset['Title'] = dataset['Title'].replace(['Lady',\
  \ 'Countess','Capt', 'Col',\n                                                 'Don',\
  \ 'Dr', 'Major', 'Rev', 'Sir', 'Jonkheer', 'Dona'], 'Rare')\n    dataset['Title']\
  \ = dataset['Title'].replace('Mlle', 'Miss')\n    dataset['Title'] = dataset['Title'].replace('Ms',\
  \ 'Miss')\n    dataset['Title'] = dataset['Title'].replace('Mme', 'Mrs')\n\ntrain_df[['Title',\
  \ 'Survived']].groupby(['Title'], as_index=False).mean()\n```\n\n![](img/00030.jpeg)\n\
  \n\n\n\n注意到 Miss 和 Mrs 的存活率最高（甚至远高于 Rare 头衔的总和）。换句话说，Name 中的 Title（而非名字本身）与存活率相关。\n\
  \n同样，为方便起见，让我们将这些 Title（分类特征）转换为有序特征（就像 Pclass 一样）。\n\n```python\ntitle_mapping\
  \ = {\"Mr\": 1, \"Miss\": 2, \"Mrs\": 3, \"Master\": 4, \"Rare\": 5}\n\nfor dataset\
  \ in combine:\n    dataset['Title'] = dataset['Title'].map(title_mapping)\n    dataset['Title']\
  \ = dataset['Title'].fillna(0)\n\ntrain_df.head()\n```\n\n![](img/00031.jpeg)\n\n\
  既然我们已经从 Name 中提取了有用信息并将其制成新特征，便可以安全地删除 Name 特征。同时也应删除 PassengerId。\n\n```python\n\
  train_df = train_df.drop(['Name', 'PassengerId'], axis=1)\ntest_df = test_df.drop(['Name'],\
  \ axis=1)\ncombine = [train_df, test_df]\ntrain_df.shape, test_df.shape\n```\n\n\
  ((891, 9), (418, 9))\n\n```python\ntrain_df.head()\n```\n\n![](img/00032.jpeg)\n\
  \n现在数据整洁多了，特征数量大幅减少。这将使后续分析更轻松、更快捷。\n\n此外，我们必须将包含字符串的特征（Sex = female 或 male）转换为数值。这通常是大多数机器学习算法的要求。毕竟，处理文本数据与数值需要不同的方法（稍后提到自然语言处理时再详述）。\n\
  \n将分类特征转换为数值：\n\n```python\nfor dataset in combine:\n    dataset['Sex'] = dataset['Sex'].map({'female':\
  \ 1, 'male': 0}).astype(int)\n\ntrain_df.head()\n```\n\n![](img/00033.jpeg)\n\n\
  搞定。现在全是数值，且已排除无关特征。\n\n特别提示：注意我们还没进行任何机器学习。因为大多数数据科学和机器学习项目会先花大量时间在思考和预处理上。在使用 `scikit-learn`\
  \ 或 `TensorFlow` 之前，必须在真实数据分析的基础上投入大量精力。\n\n但这还没完。在进行真正的机器学习前，还得处理前面提到的空值。我们得通过注入新值使其“非空”，但注入的值必须合理。\n\
  \n一种方法是利用其他相关特征（如观察 Age、Gender 和 Pclass 间的相关性）。代码如下：\n\n```python\ngrid = sns.FacetGrid(train_df,\
  \ row='Pclass', col='Sex', size=2.2, aspect=1.6)\ngrid.map(plt.hist, 'Age', alpha=.5,\
  \ bins=20)\ngrid.add_legend()\n```\n\n![](img/00034.jpeg)\n\n接下来准备一个空数组（使用 `numpy`），用于存放将替换空值的\
  \ Age 值。猜测值基于 Pclass × Gender 组合：\n\n```python\nimport numpy as np\n\nguess_ages\
  \ = np.zeros((2,3))\nguess_ages\n```\n\n![](img/00035.jpeg)\n\n然后遍历 Pclass（1, 2,\
  \ 3）和 Sex（0 或 1），计算 6 种组合的猜测 Age 值：\n\n```python\nfor dataset in combine:\n    for\
  \ i in range(0, 2):\n        for j in range(0, 3):\n            guess_df = dataset[(dataset['Sex']\
  \ == i) &\n                               (dataset['Pclass'] == j+1)]['Age'].dropna()\n\
  \            age_guess = guess_df.median()\n            guess_ages[i,j] = int(age_guess/0.5\
  \ + 0.5) * 0.5\n    for i in range(0, 2):\n        for j in range(0, 3):\n     \
  \       dataset.loc[(dataset.Age.isnull()) & (dataset.Sex == i) & (dataset.Pclass\
  \ == j+1),\n                        'Age'] = guess_ages[i,j]\n    dataset['Age']\
  \ = dataset['Age'].astype(int)\n\ntrain_df.head()\n```\n\n![](img/00036.jpeg)\n\n\
  现在已处理缺失值。下一步创建 Age bands（年龄区间）并与 Survived 并列：\n\n![](img/00037.jpeg)\n\n为方便整洁，可将这些\
  \ Age Bands 转换为有序值：\n\n```python\nfor dataset in combine:\n    dataset.loc[dataset['Age']\
  \ <= 16, 'Age'] = 0\n    dataset.loc[(dataset['Age'] > 16) & (dataset['Age'] <=\
  \ 32), 'Age'] = 1\n    dataset.loc[(dataset['Age'] > 32) & (dataset['Age'] <= 48),\
  \ 'Age'] = 2\n    dataset.loc[(dataset['Age'] > 48) & (dataset['Age'] <= 64), 'Age']\
  \ = 3\n    dataset.loc[dataset['Age'] > 64, 'Age']\n\ntrain_df.head()\n```\n\n![](img/00038.jpeg)\n\
  \nAge 特征现为有序型（而非宽数值范围）。现可“删除” AgeBand 特征（因已提取重要信息并存入 Age）：\n\n```python\ntrain_df\
  \ = train_df.drop(['AgeBand'], axis=1)\ncombine = [train_df, test_df]\ntrain_df.head()\n\
  ```\n\n![](img/00039.jpeg)\n\n回到 Parch（父母子女数）和 SibSp（兄弟姐妹配偶数）。其实可将二者合并为一个特征（为方便），命名为“FamilySize”（并与\
  \ Survived 并列以获取洞察）：\n\n```python\nfor dataset in combine:\n    dataset['FamilySize']\
  \ = dataset['SibSp'] + dataset['Parch'] + 1\n\ntrain_df[['FamilySize', 'Survived']].groupby(['FamilySize'],\
  \ as_index=False).mean().sort_values(by='Survived', ascending=False)\n```\n\n![](img/00040.jpeg)\n\
  \n我们可能还想知道存活率与乘客是否独自一人的相关性：\n\n![](img/00041.jpeg)\n\n这表明有同伴的乘客存活几率更大。因此直接丢弃 Parch、SibSp\
  \ 和 FamilySize，专注于 isAlone：\n\n```python\ntrain_df = train_df.drop(['Parch', 'SibSp',\
  \ 'FamilySize'], axis=1)\ntest_df = test_df.drop(['Parch', 'SibSp', 'FamilySize'],\
  \ axis=1)\ncombine = [train_df, test_df]\ntrain_df.head()\n```\n\n![](img/00042.jpeg)\n\
  \n我们尚未进入实际机器学习阶段。迄今大多是数据转换和操作。许多步骤其实是可选的。你甚至可能想出丢弃或创建新特征的新方法。也可能丢弃大部分特征，但模型无法从可用资源中最优学习。\n\
  \n还记得我们做了假设。好在能早期测试其有效性。\n\n继续前进。数据转换和操作还没结束（我知道你急于投入机器学习）。我们可以创建一个结合 Pclass 和 Age\
  \ 的人工特征（进一步简化并减少特征数量）：\n\n```python\nfor dataset in combine:\n    dataset['Age*Class']\
  \ = dataset.Age * dataset.Pclass\n\ntrain_df.loc[:, ['Age*Class', 'Age', 'Pclass']].head(10)\n\
  ```\n\n![](img/00043.jpeg)\n\n此外注意到分类特征 Embarked 在数据集中有两个缺失值。为求快捷，可用最高频值（即众数）填补：\n\
  \n```python\nfreq_port = train_df.Embarked.dropna().mode()[0]\nfreq_port\n```\n\n\
  ‘S’\n\n```python\nfor dataset in combine:\n    dataset['Embarked'] = dataset['Embarked'].fillna(freq_port)\n\
  \ntrain_df[['Embarked', 'Survived']].groupby(['Embarked'], as_index=False).mean().sort_values(by='Survived',\
  \ ascending=False)\n```\n\n![](img/00044.jpeg)\n\n你可能已意识到，需将分类特征 Embarked 的值转为数值。映射方法如下（类似\
  \ Gender 处理）：\n\n```python\nfor dataset in combine:\n    dataset['Embarked'] = dataset['Embarked'].map({'S':\
  \ 0, 'C': 1, 'Q': 2}).astype(int)\n\ntrain_df.head()\n```\n\n![](img/00045.jpeg)\n\
  \n我们也可以像处理 Embarked 那样补全 Fare 特征的缺失值。这通常是模型或算法良好运行的必要条件：\n\n```python\ntest_df['Fare'].fillna(test_df['Fare'].dropna().median(),\
  \ inplace=True)\ntest_df.head()\n```\n\n![](img/00046.jpeg)\n\n然后创建 FareBand 以简化：\n\
  \n\n\n\n## 数据预处理与模型训练\n\n### Fare 特征分箱与序数化\n\n```python\ntrain_df['FareBand'] =\
  \ pd.qcut(train_df['Fare'], 4)\n```\n\n```python\ntrain_df[['FareBand', 'Survived']].groupby(['FareBand'],\
  \ as_index=False).mean().sort_values(by='FareBand', ascending=True)\n```\n\n![](img/00047.jpeg)\n\
  \n然后我们将其转换为序数值（类似于我们在 AgeBand 中所做的操作）。\n\n```python\nfor dataset in combine:\n \
  \   dataset.loc[dataset['Fare'] <= 7.91, 'Fare'] = 0\n    dataset.loc[(dataset['Fare']\
  \ > 7.91) & (dataset['Fare'] <= 14.454), 'Fare'] = 1\n    dataset.loc[(dataset['Fare']\
  \ > 14.454) & (dataset['Fare'] <= 31), 'Fare'] = 2\n    dataset.loc[dataset['Fare']\
  \ > 31, 'Fare'] = 3\n    dataset['Fare'] = dataset['Fare'].astype(int)\n```\n\n\
  ```python\ntrain_df = train_df.drop(['FareBand'], axis=1)\ncombine = [train_df,\
  \ test_df]\ntrain_df.head(10)\n```\n\n![](img/00048.jpeg)\n\n这是测试集。让我们也看一眼测试数据集：\n\
  \n```python\ntest_df.head(10)\n```\n\n![](img/00049.jpeg)\n\n呼！我们终于完成了数据分析和机器学习中严谨的部分。请注意，我们还没有进行任何机器学习。还要注意，在几乎每一步中，我们都查看了数据集，观察数值是如何转换的。这是为了进行合理性检查，确保我们做的是正确的事情。\n\
  \n### 模型选择与训练\n\n现在到了最令人期待的部分。我们现在准备好训练模型了。请始终牢记，我们的目标是从数据中学习，然后基于之前的学习对未见过的数据进行预测。但首先有几十种预测算法可供选择。让我们尝试以下\
  \ 6 种算法，因为它们在分类任务中很流行（我们稍后会详细讨论它们）：\n\n1.  逻辑回归\n2.  K 近邻算法或 KNN\n3.  支持向量机 (SVM)\n\
  4.  朴素贝叶斯分类器\n5.  决策树\n6.  随机森林\n\n首先，我们在训练集中定义自变量 (`X_train`) 和目标变量 (`Y_train`)（我们在测试集中同样这么做）：\n\
  \n```python\nX_train = train_df.drop(\"Survived\", axis=1)\nY_train = train_df[\"\
  Survived\"]\nX_test  = test_df.drop(\"PassengerId\", axis=1).copy()\nX_train.shape,\
  \ Y_train.shape, X_test.shape\n```\n\n```\n((891, 8), (891,), (418, 8))\n```\n\n\
  ## 逻辑回归\n\n然后让我们使用第一个选项（逻辑回归）来训练模型：\n\n```python\nfrom sklearn.linear_model import\
  \ LogisticRegression\n\nlogreg = LogisticRegression()\nlogreg.fit(X_train, Y_train)\n\
  Y_pred = logreg.predict(X_test)\nacc_log = round(logreg.score(X_train, Y_train)\
  \ * 100, 2)\nacc_log\n```\n\n```\n80.36\n```\n\n80.36% 是逻辑回归在预测乘客是否生还时的准确率。\n\n\
