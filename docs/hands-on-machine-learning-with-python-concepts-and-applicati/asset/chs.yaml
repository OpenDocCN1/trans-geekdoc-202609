  \n\n\n训练好的逻辑回归模型在测试集上达到了 72% 的准确率。\n\n### 广义线性模型\n\n广义线性模型是线性模型的一种扩展，其中因变量不属于正态分布或高斯分布。广义线性模型能够建模自变量和因变量之间更复杂的关系。GLM\
  \ 通常可以对各种概率分布进行建模，例如泊松分布、二项分布、多项分布等。逻辑回归就是广义线性模型的一个例子，其中因变量使用二项分布进行建模。这使其能够创建从输入到输出的映射，且输出本质上是二元的。\n\
  \n泊松回归是一种广义线性模型，用于建模计数数据。计数数据是只能为正的整数值。泊松回归假设因变量 `y` 服从泊松分布，这是一种指数概率分布。泊松回归与线性回归的主要区别在于：线性回归假设输出来自正态分布，而泊松回归假设\
  \ `y` 来自泊松分布。泊松回归中的输出建模如下所示。\n\n```\n![](img/00065.gif)\n```\n\n广义线性模型由三个部分组成：随机成分（即输出的概率分布）、系统成分（描述解释变量\
  \ `X` 或预测变量）以及连接函数（指定解释变量与随机成分之间的关系）。\n\n由于泊松回归的超参数（权重）不能取负值，因此它们通过自然对数进行变换以确保始终为正。泊松分布的均值在数学上表述为：\n\
  \n```\n![](img/00066.gif)\n```\n\n用于训练模型以发现可学习参数的目标函数或损失函数如下所示：\n\n```\n![](img/00067.gif)\n\
  ```\n\n在我们的实操示例中，我们将使用 `statsmodels` 包，它提供了各种用于统计建模、统计数据探索等的函数和类。我们将使用 `statsmodels`\
  \ 自带的数据集——苏格兰投票数据集，该数据集包含 1997 年关于授予苏格兰议会征税权的投票记录。该数据集包含 8 个解释变量（预测变量）和 32 个观测值，每个地区一个。\n\
  \n首先我们按如下方式导入 `Statsmodels` 包。\n\n```\nimport statsmodels.api as sm\n```\n\n接下来我们加载数据集并提取解释变量\
  \ (`X`)。\n\n```\ndata = sm.datasets.scotland.load()\n\n### data.exog 是自变量 X\ndata.exog\
  \ = sm.add_constant(data.exog)\n```\n\n类似于 Scikit-Learn，我们导入合适的模型并实例化一个对象。在这种情况下，我们指定一个广义线性模型并将分布族设置为泊松分布。\n\
  \n```\n### 使用默认连接函数实例化一个泊松族模型。\npoisson_model = sm.GLM(data.endog, data.exog, family=sm.families.Poisson())\n\
  ```\n\n然后我们在数据上拟合模型。\n\n```\npoisson_results = poisson_model.fit()\n```\n\n我们现在可以打印结果摘要，以更好地了解训练好的模型。\n\
  \n```\nprint(poisson_results.summary())\n```\n\n```\n![](img/00068.jpeg)\n```\n\n\
  摘要包含自变量的系数或权重、标准误和 z 分数等值。\n\n### 回归示例：预测波士顿房价\n\n为了更好地理解迄今为止讨论的概念，我们将引入一个贯穿始终的示例，其中我们面临一个回归问题：给定波士顿郊区房屋的特征信息，预测其价格。\n\
