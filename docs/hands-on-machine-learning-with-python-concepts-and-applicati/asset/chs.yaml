  \n### 特征筛选\n\n现在我们已对数据有了初步了解。下一步是剔除与生存率无关的明显特征。这是一个重要步骤：在应用复杂算法之前，首先排除不必要的特征总是好的。\n\
  \n* **姓名 (`Name`)**：一个人的名字与生存有关吗？可以肯定答案是否定的。因此我们删除 `Name` 并将其从后续模型中排除。\n* **票号 (`Ticket`)**：哪个人获得特定票号是随机的。因此可以安全地从数据中排除\
  \ `Ticket` 特征。`PassengerId` 也是同理。\n* **船舱 (`Cabin`)**：该特征有大量空值（891 条记录中仅 204 个非空对象，意味着绝大部分值为空）。\n\
  \n### 假设与验证\n\n除了剔除特征，我们还需要做一些假设。这是数据分析和机器学习的自然组成部分。我们从几个假设开始，最后验证它们是否合理。\n\n**假设\
  \ 1**：女性（数据集中 `Sex = female`）更有可能生存（例如在紧急救援中享有优先权）。儿童和头等舱乘客（`Pclass = 1`）也有更好的生存机会。\n\
  \n好消息是我们可以实际检验这些假设，并尽早查看它们是否合理：\n\n#### 乘客等级 (`Pclass`) 与生存率\n\n```python\ntrain_df[['Pclass',\
  \ 'Survived']].groupby(['Pclass'], as_index=False).mean().sort_values(by='Survived',\
  \ ascending=False)\n```\n\n![](img/00021.jpeg)\n\n注意 `Pclass = 1`（头等舱乘客）拥有最高的生存率。\n\
  \n#### 性别 (`Sex`) 与生存率\n\n```python\ntrain_df[[\"Sex\", \"Survived\"]].groupby(['Sex'],\
  \ as_index=False).mean().sort_values(by='Survived', ascending=False)\n```\n\n![](img/00022.jpeg)\n\
  \n女性的生存率超过 74%。\n\n#### 同行兄弟姐妹/配偶 (`SibSp`) 与生存率\n\n```python\ntrain_df[[\"SibSp\"\
  , \"Survived\"]].groupby(['SibSp'], as_index=False).mean().sort_values(by='Survived',\
  \ ascending=False)\n```\n\n![](img/00023.jpeg)\n\n#### 同行父母/子女 (`Parch`) 与生存率\n\n\
  ```python\ntrain_df[[\"Parch\", \"Survived\"]].groupby(['Parch'], as_index=False).mean().sort_values(by='Survived',\
  \ ascending=False)\n```\n\n![](img/00024.jpeg)\n\n上述特征可能以某种方式影响乘客的生存几率（但请记住运气仍然发挥作用，因此\
  \ 100% 正确的预测可能是不可能实现的）。\n\n### 数据可视化\n\n为了进一步分析，让我们可视化数据（这可能更容易解释）。首先，导入必要的库和包：\n\
