  from sklearn.feature_extraction.text import CountVectorizer\n\nf = CountVectorizer(stop_words='english')\n\
  X = f.fit_transform(data[\"v2\"])\nprint(np.shape(X))\n```\n\n![](img/00083.jpeg)\n\
  \n向量化后，创建了 8,404 个新特征。\n\n接下来，我们将目标变量映射为类别，并将数据集划分为训练集和测试集。\n\n```python\nfrom sklearn.model_selection\
