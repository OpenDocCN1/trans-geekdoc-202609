  \ {}'.format(score))\n```\n\n![](img/00084.jpeg)\n\n朴素贝叶斯分类器达到了 0.976 的准确率，这意味着它正确预测了\
  \ 97.6% 样本的类别。\n\n## 决策树与随机森林\n\n### 分区的熵\n\n熵可以定义为随机事件序列中不确定性的度量。它是样本空间中无序程度的比率，与知识直接对立。当系统的熵较高时，从系统中获得的知识较低，反之亦然。对熵的一个直观理解是将其视为为了获得某些知识所需提出的问题数量。例如，如果我选了一个随机数字，你试图猜出它是什么。问一个问题，“它是奇数吗”，会将可能性空间减半。这意味着试图确定我选择的数字时的熵或不确定性降低了。同样，信息增益量很大，因为该问题通过划分样本空间让你更接近答案。熵通常在\
  \ 0 到 1 之间。熵为 0 的系统高度稳定，从这种系统中获得的知识很高。一般来说，系统中低熵表示高知识，而高熵表示低知识或不稳定。\n\n熵可以用数学公式表示为：\n\
  \n![](img/00085.jpeg)\n\n\n\n\n\n### 熵与决策树\n\n上述公式是事件发生的对数概率之和的负值。请记住，概率表示我们对事件发生的置信度；因此，熵是一系列事件同时发生的惊讶程度。\n\
  \n在机器学习中，正如我们稍后将在决策树中看到的那样，分类器两个或多个属性的熵定义为：\n\n![](img/00086.jpeg)\n\n决策树是一种严重依赖属性熵和信息增益来确定如何在分类问题中对样本进行分类的机器学习算法。让我们在下一节深入了解决策树。\n\
  \n### 创建决策树\n\n决策树是一种主要用于分类的机器学习算法，它构建一棵可能性之树，其中树的分支代表决策，叶子代表标签分类。决策树的目的是创建一种结构，使每个分支中的样本是同质的或属于同一类型。它通过根据特定属性拆分训练数据中的样本来实现这一点，这些属性增加了分支的同质性。这些属性形成决策节点，样本沿这些节点被分离。该过程持续进行，直到所有样本都被正确预测，这由树的叶子表示。\n\
  \n为了进一步解释决策树的概念，让我们看看下面的一个简单示例，它演示了其能力。\n\n![](img/00087.jpeg)\n\n假设我们是一家笔记本电脑制造商，我们想预测在线商店的哪些客户可能购买我们新款的高端笔记本电脑，以便我们能相应地集中营销力度。这个问题可以用一个具有两个类别（是或否）的决策树来建模，用于判断一个人是否可能购买。\n\
  \n在树的根节点，我们想选择一个关于客户的属性，使熵减少最多。正如我们在上一节所看到的，通过减少熵，我们增加了系统包含的知识量。我们通过计算每个分支的熵和目标（是或否）的熵来选择合适的属性。信息增益与熵密切相关，定义为目标的熵（最终熵）与选择特定属性作为根节点时给定的熵之间的差值。\n\
  \n![](img/00088.jpeg)\n\n上述公式用于计算熵的减少量。具有最大信息增益或熵减少量的属性被选为根节点。这意味着与其他属性相比，该属性最大程度地减少了决策空间。该过程重复进行，通过属性寻找其他决策节点，直到所有样本都通过决策树的叶子被正确分类。\n\
  \n在上面的示例中，`age` 是提供最大信息增益的属性，因此样本在该决策节点上被分割。如果客户是中年人，他们很可能购买新笔记本电脑，因为他们可能正在工作且拥有更高的消费能力。如果客户是年轻人，这将引导我们到另一个决策节点。使用的属性是该年轻人是否为学生。如果是学生，他们很可能购买；否则，他们不会。这将我们带到了树的年轻人分支后的叶子节点（类别）。对于老年人分支，我们再次根据一个信息量大的属性拆分样本，在本例中是信用评级。如果老年人拥有极好的信用评级，意味着他们很可能购买；否则，该分支上该样本的叶子节点或分类为否。\n\
  \n现在让我们使用 Python、Scikit-Learn 和决策树来处理一个示例。我们将解决一个多类分类问题，挑战是利用酒精度、颜色强度、色调等特征将葡萄酒分为三类。我们将使用的数据来自\
  \ UC Irvine 的葡萄酒识别数据集。可在 [`gist.github.com/tijptjik/9408623/archive/b237fa5848349a14a14e5d4107dc7897c21951f5.zip`](https://gist.github.com/tijptjik/9408623/archive/b237fa5848349a14a14e5d4107dc7897c21951f5.zip)\
  \ 下载。\n\n首先，让我们加载数据集并使用 Pandas 的 `head()` 方法查看一下。\n\n```python\nimport numpy as\
  \ np\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\n### 如果不在 Jupyter notebook\
  \ 中运行，请注释掉下面的魔法命令\n%matplotlib inline\n\ndataset = pd.read_csv('wine.csv')\ndataset.head(5)\n\
  ```\n\n![](img/00089.jpeg)\n\n共有 13 个预测变量，第一列 \"wine\" 包含目标值。接下来我们要做的是将数据集拆分为预测变量和目标变量，有时分别称为特征和标签。\n\
  \n```python\nfeatures = dataset.drop(['Wine'], axis=1)\nlabels = dataset['Wine']\n\
  ```\n\n按照惯例，为了确保对模型进行良好的评估，我们将数据集划分为训练集和测试集。\n\n```python\nfrom sklearn.model_selection\
  \ import train_test_split\nfeatures_train, features_test, labels_train, labels_test\
  \ = train_test_split(features, labels, test_size=0.25)\n```\n\n剩下的就是导入决策树分类器并将其拟合到我们的数据上。\n\
  \n```python\nfrom sklearn.tree import DecisionTreeClassifier\nclassifier = DecisionTreeClassifier()\n\
  classifier.fit(features_train, labels_train)\n```\n\n现在我们可以在测试集上评估训练好的模型并打印出准确率。\n\
  \n```python\npred = classifier.predict(features_test)\nfrom sklearn.metrics import\
  \ accuracy_score\naccuracy = accuracy_score(labels_test, pred)\nprint('Accuracy:\
  \ {:.2f}'.format(accuracy))\n```\n\n![](img/00090.jpeg)\n\n我们达到了 0.91 的准确率，这非常令人印象深刻。这意味着测试集中\
  \ 91% 的样本被正确分类。\n\n### 随机森林\n\n随机森林是一种集成模型。集成模型是由其他模型构建的模型。这意味着它是几个弱学习器的组合，形成一个强学习器。集成模型的预测可能是其包含的所有学习器的平均值或加权平均值。\n\
  \n随机森林是决策树的扩展，通过生长多棵决策树来形成一个森林。随机森林模型的最终预测是所有组成部分决策树的组合。对于回归，它可能是输出的简单平均值；对于分类，则可能是标签投票。虽然随机森林由多棵决策树组成，但每棵决策树都是在随机选择的数据子集上训练的，因此得名随机森林。随机森林的另一个技巧是，与决策树从所有可用属性中选择最佳属性以在决策节点拆分样本不同，随机森林仅从为每个决策节点随机选择的属性子集中挑选最佳属性。结果是，树中的每个节点都是非确定性的；也就是说，每次运行算法，我们最终得到的树结构可能不同。然而，最有信息量的属性仍会找到进入森林中树木的路径，并出现在许多树中。这使得随机森林算法的结果不太容易因输入数据的变化而产生错误。\n\
  \n组成随机森林的决策树所训练的数据子集称为装袋数据，通常约占整个数据集的 60%。用于测试单个树性能的剩余数据称为袋外数据。因此，森林中的每棵树都通过随机化过程在不同的数据子集上进行训练和评估。\n\
  \n![](img/00091.jpeg)\n\n上图展示了随机森林的图示表示。它由多棵在不同数据集实例上训练的树组成。每个决策节点的属性也是随机的。最终，输出预测是每棵决策树分类的集成。\n\
  \n\n\n\n我们现在将在葡萄酒数据集上尝试随机森林分类器，并将其在测试集上的表现与上一节中的决策树模型进行比较。使用 Scikit-Learn 中的机器学习模型的美妙之处在于，无论使用何种算法，训练和测试模型的\
  \ API 都是相同的。因此你会注意到，我们只需要导入正确的分类器并将其初始化，所有其他代码部分将保持不变。我们已经熟悉代码各部分的工作原理，因此这里是随机森林的完整代码。\n\
  \n```python\nimport numpy as np\nimport pandas as pd\n\n#### load dataset\ndataset\
  \ = pd.read_csv('wine.csv')\n\n#### separate features and labels\nfeatures = dataset.drop(['Wine'],\
  \ axis=1)\nlabels = dataset['Wine']\n\n#### split dataset into train and test sets\n\
  from sklearn.model_selection import train_test_split\nfeatures_train, features_test,\
  \ labels_train, labels_test = train_test_split(features, labels, test_size=0.25)\n\
  \n#### import random forest classifier from sklearn\nfrom sklearn.ensemble import\
  \ RandomForestClassifier\nclassifier = RandomForestClassifier()\n\n#### fit classifier\
  \ on data\nclassifier.fit(features_train, labels_train)\n\n#### predict classes\
  \ of test set samples\npred = classifier.predict(features_test)\n\n#### evaluate\
  \ classifier performance using accuracy metric\nfrom sklearn.metrics import accuracy_score\n\
  accuracy = accuracy_score(labels_test, pred)\nprint('Accuracy: {:.2f}'.format(accuracy))\n\
  ```\n\n![](img/00092.jpeg)\n\n我们在测试集上达到了 98% 的准确率，这比使用决策树分类器时的 91% 有了巨大的飞跃。我们可以看到，随机森林的随机化方法使算法能够更好地泛化，因此在测试集上记录了更高的准确率。\n\
  \n## 神经网络\n\n### 感知机\n\n感知机是一种二元线性分类器，仅当样本可以通过一条直线分离时，它才能预测样本的类别。感知机算法由 Frank Rosenblatt\
  \ 于 1957 年提出。它使用手工制作的特征对样本进行分类，这些特征代表了关于样本的信息，根据特征对最终预测的重要程度对其进行加权，然后将计算结果与一个阈值进行比较。\n\
  \n![](img/00093.gif)\n\n在上图中，`X` 代表模型的输入，`W` 代表权重（各个特征有多重要）。在下面的公式中，会对特征的加权和进行线性计算：\n\
  \n![](img/00094.gif)\n\n然后将 `z` 的值传递给阶跃函数以预测样本的类别。阶跃函数是将值从 0 瞬间转换为 1。这意味着如果 `z`\
  \ 大于或等于 0，则预测为一类，否则预测为另一类。阶跃函数可以用数学方式表示为：\n\n![](img/00095.gif)\n\n在每次迭代中，预测类别会与实际类别进行比较，如果预测错误则更新权重，如果预测正确则保持不变。权重更新持续进行，直到所有样本都被正确预测，此时我们可以说感知机分类器已经找到了一个线性决策边界，能完美地将所有样本分离为两个互斥的类别。\n\
  \n在训练过程中，通过向原始权重添加一个小值来更新权重。添加的量由感知机学习规则决定。权重更新过程可以用数学方式表示如下。\n\n![](img/00096.gif)\n\
  \n权重更新的量由下面的感知机学习规则给出。\n\n![](img/00097.gif)\n\n等式右侧的第一个系数称为学习率，它作为一个缩放因子，用于增加或减少更新的幅度。上述等式的直观理解是：每遍历一遍训练集，错误分类样本的权重就会被朝正确方向轻推一下，以便\
  \ `z` 的值能使阶跃函数正确分类该样本。应当注意，上述描述的感知机学习算法存在严重局限，因为它只能学习具有清晰线性边界的简单函数。感知机在实践中几乎从不使用，但它在人工神经网络的早期发展中充当了不可或缺的基础构建模块。\n\
  \n现代版本被称为多层感知机。多层感知机是前馈神经网络，其结构中包含多个感知机节点。然而，存在重要差异。多层感知机由多层堆叠的神经元组成网络。所使用的激活函数是非线性的，这与使用阶跃函数的感知机模型不同。非线性激活能够捕捉数据更有趣的表示，因此不要求输入数据线性可分。另一个重要区别是，多层感知机使用一种称为反向传播的不同算法进行训练，这使得跨多层训练成为可能。\n\
  \n### 反向传播\n\n反向传播是一种算法技术，用于解决人工神经网络中的信用分配问题。这意味着它用于确定输入的特征和权重在多大程度上对模型的最终输出做出了贡献。与感知机学习规则不同，反向传播用于计算梯度，梯度告诉我们模型参数的变化在多大程度上影响最终输出。梯度被用作误差信号来训练模型，指示模型的预测偏离真实值有多远。反向传播算法可以被视为应用于各层的导数链式法则。\n\
  \n让我们看一个完整的多层感知机图解以进一步理解。\n\n![](img/00098.gif)\n\n上述网络由三层组成：输入层（即输入网络的特征）、隐藏层（之所以这样称呼是因为我们无法观察其内部发生的情况）和输出层（通过它获得模型的预测）。在训练期间，为了计算每个节点对最终预测的贡献程度并相应地调整它们以提高样本上的准确率，我们需要使用反向传播算法来改变权重。权重是在训练过程中学习到的，因此有时被称为模型的可学习参数。为了直观理解反向传播期间发生的事情，让我们看看下面单个节点的图像。\n\
  \n![](img/00099.jpeg)\n\n在上图节点中，`x` 和 `y` 是输入特征，而 `f` 是非线性激活函数。在训练期间，计算从输入开始，跨过隐藏层，一直到输出，以正向方式进行。这被称为正向传播，在图中用绿色箭头表示。然后将模型的预测与真实值进行比较，并将误差反向传播。这被称为反向传播，通过反向传播算法分配每个节点对计算出的误差所承担的责任量。在上图中用红色箭头表示。此过程持续进行，直到模型找到一组能捕捉底层数据表示并正确预测大多数样本的权重。\n\
  \n### 如何使用 TensorFlow 运行神经网络\n\n对于我们的实战示例，我们将使用 MNIST 手写数字数据库进行图像分类，该数据库包含 0 到 9\
  \ 的黑白手写数字图片。任务是训练一个神经网络，给定一个输入数字图像，它能预测其中包含的数字类别。\n\n### 如何获取数据\n\n\n\n\n### TensorFlow\
  \ MNIST 教程\n\nTensorFlow 包含若干预加载的数据集，我们可以在实验过程中用它们来学习或测试想法。MNIST 数据库就是其中一个经过清理的数据集，简单且易于理解。每个数据点是一张黑白图像，仅有一个颜色通道。图像中的每个像素表示该点的亮度，0\
  \ 表示黑色，255 表示白色。数值范围为 0 到 255，对应 28 × 28 网格中的 784 个点。\n\n#### 加载数据和库\n\n让我们继续从 TensorFlow\
  \ 加载数据，并导入其他相关库。\n\n```python\n##### Import MNIST data\nfrom tensorflow.examples.tutorials.mnist\
  \ import input_data\n\nmnist = input_data.read_data_sets(\"/tmp/data/\", one_hot=True)\n\
  \nimport numpy as np\nimport tensorflow as tf\nimport matplotlib.pyplot as plt\n\
  ```\n\n让我们使用 `matplotlib` 库来显示一张图像，看看它的样子，运行以下代码行。\n\n```python\nplt.imshow(np.reshape(mnist.train.images[8],\
  \ [28, 28]), cmap='gray')\nplt.show()\n```\n\n![](img/00100.gif)\n\n显示的图像是一张手写数字\
  \ 9 的图片。\n\n#### 如何训练和测试数据\n\n为了在我们的数据上训练一个人工神经网络模型，我们首先需要定义描述计算图的参数，例如每个隐藏层的神经元数量、隐藏层数量、输入大小、输出类别数量等。数据集中的每张图像都是\
  \ 28 × 28 像素，因此输入形状为 784（即 28 × 28）。\n\n##### 参数\n\n```python\n##### Parameters\n\
  learning_rate = 0.1\nnum_steps = 500\nbatch_size = 128\ndisplay_step = 100\n\n#####\
  \ Network Parameters\nn_hidden_1 = 10 # 1st layer number of neurons\nn_hidden_2\
  \ = 10 # 2nd layer number of neurons\nnum_input = 784 # MNIST data input (img shape:\
  \ 28*28)\nnum_classes = 10 # MNIST total classes (0-9 digits)\n```\n\n##### 图输入\n\
  \n```python\n##### tf Graph input\nX = tf.placeholder(\"float\", [None, num_input])\n\
  Y = tf.placeholder(\"float\", [None, num_classes])\n```\n\n然后我们声明权重和偏置，它们是可训练参数，并将它们随机初始化为非常小的值。这些声明存储在一个\
  \ Python 字典中。\n\n```python\n##### Store layers weight & bias\nweights = {\n    'h1':\
  \ tf.Variable(tf.random_normal([num_input, n_hidden_1])),\n    'h2': tf.Variable(tf.random_normal([n_hidden_1,\
  \ n_hidden_2])),\n    'out': tf.Variable(tf.random_normal([n_hidden_2, num_classes]))\n\
  }\n\nbiases = {\n    'b1': tf.Variable(tf.random_normal([n_hidden_1])),\n    'b2':\
  \ tf.Variable(tf.random_normal([n_hidden_2])),\n    'out': tf.Variable(tf.random_normal([num_classes]))\n\
  }\n```\n\n然后我们将描述一个 3 层神经网络，输出层针对每个类别数字有 10 个单元，并通过创建一个函数来定义模型，该函数将输入通过各层前向传播。请注意，我们仍在计算图上描述所有这些操作。\n\
  \n##### 创建模型\n\n```python\n##### Create model\ndef neural_net(x):\n    # Hidden\
  \ fully connected layer with 10 neurons\n    layer_1 = tf.add(tf.matmul(x, weights['h1']),\
  \ biases['b1'])\n    # Hidden fully connected layer with 10 neurons\n    layer_2\
  \ = tf.add(tf.matmul(layer_1, weights['h2']), biases['b2'])\n    # Output fully\
  \ connected layer with a neuron for each class\n    out_layer = tf.matmul(layer_2,\
  \ weights['out']) + biases['out']\n    return out_layer\n```\n\n接下来我们调用该函数，定义损失目标，选择用于训练模型的优化器，并初始化所有变量。\n\
  \n##### 构建模型、损失函数和优化器\n\n```python\n##### Construct model\nlogits = neural_net(X)\n\
  \n##### Define loss and optimizer\nloss_op = tf.reduce_mean(tf.nn.softmax_cross_entropy_with_logits(\n\
  \    logits=logits, labels=Y))\noptimizer = tf.train.AdamOptimizer(learning_rate=learning_rate)\n\
  train_op = optimizer.minimize(loss_op)\n\n##### Evaluate model (with test logits,\
  \ for dropout to be disabled)\ncorrect_pred = tf.equal(tf.argmax(logits, 1), tf.argmax(Y,\
  \ 1))\naccuracy = tf.reduce_mean(tf.cast(correct_pred, tf.float32))\n\n##### Initialize\
  \ the variables (i.e. assign their default value)\ninit = tf.global_variables_initializer()\n\
  ```\n\n最后，我们创建一个会话，按批次向模型提供图像进行训练，并打印每个小批次的损失和准确率。\n\n##### 开始训练\n\n```python\n\
  ##### Start training\nwith tf.Session() as sess:\n    # Run the initializer\n  \
  \  sess.run(init)\n    for step in range(1, num_steps+1):\n        batch_x, batch_y\
  \ = mnist.train.next_batch(batch_size)\n        # Run optimization op (backprop)\n\
  \        sess.run(train_op, feed_dict={X: batch_x, Y: batch_y})\n        if step\
  \ % display_step == 0 or step == 1:\n            # Calculate batch loss and accuracy\n\
  \            loss, acc = sess.run([loss_op, accuracy], feed_dict={X: batch_x,\n\
  \                                                                  Y: batch_y})\n\
  \            print(\"Step \" + str(step) + \", Minibatch Loss= \" + \\\n       \
  \           \"{:.4f}\".format(loss) + \", Training Accuracy= \" + \\\n         \
  \         \"{:.3f}\".format(acc))\n    print(\"Optimization Finished!\")\n    #\
  \ Calculate accuracy for MNIST test images\n    print(\"Testing Accuracy:\", \\\n\
  \          sess.run(accuracy, feed_dict={X: mnist.test.images,\n               \
  \                         Y: mnist.test.labels}))\n```\n\n会话是使用 `with` 创建的，因此执行完毕后会自动关闭。这是运行会话的推荐方式，因为我们不需要手动关闭它。以下是输出结果：\n\
  \n![](img/00101.jpeg)\n\n训练 500 步后，损失下降到 0.4863，我们在测试集上达到了 85% 的准确率。\n\n#### 完整代码清单\n\
  \n这是完整的代码：\n\n```python\n##### Parameters\nlearning_rate = 0.1\nnum_steps = 500\n\
  batch_size = 128\ndisplay_step = 100\n\n##### Network Parameters\nn_hidden_1 = 10\
  \ # 1st layer number of neurons\nn_hidden_2 = 10 # 2nd layer number of neurons\n\
  num_input = 784 # MNIST data input (img shape: 28*28)\nnum_classes = 10 # MNIST\
  \ total classes (0-9 digits)\n\n##### tf Graph input\nX = tf.placeholder(\"float\"\
  , [None, num_input])\nY = tf.placeholder(\"float\", [None, num_classes])\n\n#####\
  \ Store layers weight & bias\nweights = {\n    'h1': tf.Variable(tf.random_normal([num_input,\
  \ n_hidden_1])),\n    'h2': tf.Variable(tf.random_normal([n_hidden_1, n_hidden_2])),\n\
  \    'out': tf.Variable(tf.random_normal([n_hidden_2, num_classes]))\n}\n\nbiases\
  \ = {\n    'b1': tf.Variable(tf.random_normal([n_hidden_1])),\n    'b2': tf.Variable(tf.random_normal([n_hidden_2])),\n\
  \    'out': tf.Variable(tf.random_normal([num_classes]))\n}\n\n##### Create model\n\
  def neural_net(x):\n    # Hidden fully connected layer with 10 neurons\n    layer_1\
  \ = tf.add(tf.matmul(x, weights['h1']), biases['b1'])\n    # Hidden fully connected\
  \ layer with 10 neurons\n    layer_2 = tf.add(tf.matmul(layer_1, weights['h2']),\
  \ biases['b2'])\n    # Output fully connected layer with a neuron for each class\n\
  \    out_layer = tf.matmul(layer_2, weights['out']) + biases['out']\n    return\
  \ out_layer\n\n##### Construct model\nlogits = neural_net(X)\n\n##### Define loss\
  \ and optimizer\nloss_op = tf.reduce_mean(tf.nn.softmax_cross_entropy_with_logits(\n\
  \    logits=logits, labels=Y))\noptimizer = tf.train.AdamOptimizer(learning_rate=learning_rate)\n\
  train_op = optimizer.minimize(loss_op)\n\n##### Evaluate model (with test logits,\
  \ for dropout to be disabled)\ncorrect_pred = tf.equal(tf.argmax(logits, 1), tf.argmax(Y,\
  \ 1))\naccuracy = tf.reduce_mean(tf.cast(correct_pred, tf.float32))\n\n##### Initialize\
  \ the variables (i.e. assign their default value)\ninit = tf.global_variables_initializer()\n\
  \n##### Start training\nwith tf.Session() as sess:\n    # Run the initializer\n\
  \    sess.run(init)\n    for step in range(1, num_steps+1):\n        batch_x, batch_y\
  \ = mnist.train.next_batch(batch_size)\n        # Run optimization op (backprop)\n\
  \        sess.run(train_op, feed_dict={X: batch_x, Y: batch_y})\n        if step\
  \ % display_step == 0 or step == 1:\n            # Calculate batch loss and accuracy\n\
  \            loss, acc = sess.run([loss_op, accuracy], feed_dict={X: batch_x,\n\
  \                                                                  Y: batch_y})\n\
  \            print(\"Step \" + str(step) + \", Minibatch Loss= \" + \\\n       \
  \           \"{:.4f}\".format(loss) + \", Training Accuracy= \" + \\\n         \
  \         \"{:.3f}\".format(acc))\n    print(\"Optimization Finished!\")\n    #\
  \ Calculate accuracy for MNIST test images\n    print(\"Testing Accuracy:\", \\\n\
  \          sess.run(accuracy, feed_dict={X: mnist.test.images,\n               \
  \                         Y: mnist.test.labels}))\n```\n\n\n\n\n\n```python\nY:\
  \ batch_y})\n\nprint(\"Step \" + str(step) + \", Minibatch Loss= \" + \\\n     \
  \ \"{:.4f}\".format(loss) + \", Training Accuracy= \" + \\\n      \"{:.3f}\".format(acc))\n\
  \nprint(\"Optimization Finished!\")\n\n##### Calculate accuracy for MNIST test images\n\
  print(\"Testing Accuracy:\", \\\n      sess.run(accuracy, feed_dict={X: mnist.test.images,\n\
  \                                    Y: mnist.test.labels}))\n```\n\n## 聚类\n\n聚类是无监督学习最常见的形式。聚类涉及根据相似度度量将对象或实体分组到簇（组）中。聚类算法旨在使一个组的所有成员尽可能相似，但使该簇与其他簇不相似。乍一看，聚类很像分类，因为我们都在将数据点放入类别中，虽然情况可能如此，但主要区别在于在聚类中，我们在没有人类教师帮助的情况下创建类别。而在分类中，对象是根据人类专家的领域知识被分配到类别中的。也就是说，在分类中，我们拥有人类标注的样本，这意味着标签充当了监督者，教会算法如何识别各种类别。\n\
  \n在聚类中，发现的簇或组纯粹取决于数据本身。数据分布驱动算法发现的簇的类型。没有标签，因此聚类算法被迫在没有直接人工干预的情况下，以无监督的方式学习表征。\n\
  \n聚类算法分为两大类——硬聚类算法和软聚类算法。硬聚类算法是指那些从数据中寻找簇的聚类算法，使得一个数据点只能属于一个簇，不能更多。软聚类算法采用一种技术，即一个数据点可能属于多个簇，也就是说，数据点通过概率估计跨簇分布来表示，该估计分配了该点属于某个簇的可能性大小。\n\
  \n![](img/00102.jpeg)\n\n从上图的数据分布中，我们可以推断出聚类算法已经能够使用诸如欧氏距离之类的距离度量找到 5 个簇。会观察到，靠近簇边界的数据点同样有可能落入任何相邻簇。一些聚类算法是确定性的，意味着无论初始化条件或运行多少次，它们总是产生相同的簇集合。其他聚类算法每次运行都会产生不同的簇集合，因此可能不容易复现结果。\n\
  \n### 聚类简介\n\n聚类算法最重要的输入是距离度量。这是因为它用于确定两个或多个点彼此有多相似。它构成了所有聚类算法的基础，因为聚类本质上是基于相似性来区分实体。\n\
  \n对聚类算法进行分类的另一种方式是使用簇之间的关系结构。有两个子组——平坦聚类和层次聚类算法。在平坦聚类中，簇之间不共享任何显式结构，因此没有确定的方式将一个簇与另一个簇联系起来。一种非常流行的平坦聚类算法实现是\
  \ `K-means` 算法，我们将其作为案例研究。\n\n层次聚类算法首先让每个数据点属于其自己的簇，然后将相似的数据点合并成一个更大的簇，并持续这一过程，直到所有数据点都成为一个大簇的一部分。作为寻找簇这一过程的结果，发现的簇之间存在清晰的层次关系。\n\
  \n平坦和层次方法各有优缺点。层次算法通常是确定性的，并且不要求我们预先提供簇的数量。然而，这导致了计算效率低下，因为我们遭受了平方成本。层次聚类算法发现簇所需的时间随着数据规模的增加而增加。\n\
  \n平坦聚类算法直观易懂，且具有线性复杂度，因此运行算法所需的时间随着数据点数量的线性增加而增加，正因如此，平坦聚类算法能很好地扩展到海量数据。根据经验法则，平坦聚类算法通常用于大型数据集，其中距离度量可以捕捉相似性；而层次算法用于较小的数据集。\n\
  \n### 聚类示例\n\n我们将详细查看一个平坦聚类算法 `K-means` 的示例。我们还将在数据集上使用它来查看其性能。\n\n`K-means` 是一种迭代聚类算法，旨在将数据点分配给簇。要运行\
  \ `K-means` 算法，我们首先需要提供我们想要找到的簇的数量。接下来，算法随机将每个点分配给一个簇并计算簇质心（簇的中心）。在此阶段，根据点与簇质心的接近程度，将点重新分配给新簇。我们再次重新计算簇质心。最后，我们重复最后两个步骤，直到没有数据点被重新分配到新簇。算法现已收敛，我们得到了最终的簇。\n\
  \n### 使用 Scikit-Learn 运行 K-means\n\n对于我们的实战示例，我们将使用 `K-means` 算法在鸢尾花数据集中寻找簇。鸢尾花数据集是机器学习社区的经典数据集。它包含\
  \ 4 个属性（萼片长度、萼片宽度、花瓣长度、花瓣宽度），用于描述鸢尾花的 3 个品种。该数据集可以在以下位置找到：\n\n<https://www.kaggle.com/saurabh00007/iriscsv/downloads/Iris.csv/1>\n\
  \n第一步是加载数据并在数据集上运行 `head()` 方法以了解我们的特征。\n\n```python\n#### import libraries\nimport\
  \ numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\n#### read\
  \ dataset from csv file\ndataset = pd.read_csv('Iris.csv')\n\n#### display first\
  \ five observations\ndataset.head(5)\n```\n\n![](img/00103.jpeg)\n\n我们有 4 个信息特征和\
  \ 6 列。`Id` 是标识符，而 `Species` 列包含标签。由于这是一个聚类任务，我们不需要标签，因为我们将以无监督的方式寻找簇。\n\n```python\n\
  x = dataset.drop(['Id', 'Species'], axis=1)\nx = x.values # select values and convert\
  \ dataframe to numpy array\n```\n\n上述代码行选择所有特征到 `x` 中，丢弃 `Id` 和 `Species`。\n\n正如之前讨论的，因为\
  \ `K-means` 是一种平坦聚类算法，我们需要在运行算法之前指定 `k` 的值（簇的数量）。然而，我们不知道 `k` 的最优值，所以我们使用一种称为肘部法则的技术。肘部法则绘制由簇的数量导致的解释方差百分比。图中\
  \ `k` 的最优值将是随着簇数量增加，误差平方和（`SSE`）不再显著改善的那个点。\n\n让我们看看这些概念的实际应用。\n\n```python\n####\
  \ finding the optimum number of clusters for k-means classification\nfrom sklearn.cluster\
  \ import KMeans\n\nwcss = [] # array to hold sum of squared distances within clusters\n\
  \nfor i in range(1, 11):\n    kmeans = KMeans(n_clusters = i, init = 'k-means++',\
  \ max_iter = 300, n_init = 10, random_state = 0)\n    kmeans.fit(x)\n    wcss.append(kmeans.inertia_)\n\
  \n#### plotting the results onto a line graph, allowing us to observe 'The elbow'\n\
  plt.plot(range(1, 11), wcss)\nplt.title('The elbow method')\nplt.xlabel('Number\
  \ of clusters')\n```\n\n\n\n\n\n### K-means 聚类与层次聚类\n\n#### 用于寻找最优 K 的肘部法则\n\nK-means\
  \ 算法运行 10 次迭代，`n_clusters`（聚类数）范围从 1 到 10。每次迭代都会记录误差平方和（SSE）。然后将每种聚类配置下的簇内平方距离之和与聚类数量绘制成图。图中的“肘部”位于\
  \ 3，这是 `k` 的最优值。\n\n```python\nplt.ylabel('Within Cluster Sum of Squares') # 簇内平方和\n\
  plt.show()\n```\n\n![](img/00104.jpeg)\n\n#### 创建 K-means 模型\n\n现在我们知道 `k` 的最优值是\
  \ 3，我们使用 Scikit-Learn 创建一个 K-means 对象，并将 `n_clusters` 参数（要生成的聚类数量）设置为 3。\n\n```python\n\
  ##### 创建 kmeans 对象\nkmeans = KMeans(n_clusters = 3, init = 'k-means++', max_iter\
  \ = 300, n_init = 10, random_state = 0)\n```\n\n接下来我们在该对象上使用 `fit_predict()` 方法。这将返回聚类中心的计算结果以及每个样本的聚类预测。\n\
  \n```python\ny_kmeans = kmeans.fit_predict(x)\n```\n\n##### 可视化聚类\n\n然后我们使用前两个特征的散点图来绘制聚类的预测结果。\n\
  \n```python\n##### 可视化聚类\nplt.scatter(x[y_kmeans == 0, 0], x[y_kmeans == 0, 1],\
  \ s = 100, c = 'red', label = 'Iris-setosa')\nplt.scatter(x[y_kmeans == 1, 0], x[y_kmeans\
  \ == 1, 1], s = 100, c = 'blue', label = 'Iris-versicolour')\nplt.scatter(x[y_kmeans\
  \ == 2, 0], x[y_kmeans == 2, 1], s = 100, c = 'green', label = 'Iris-virginica')\n\
  \n##### 绘制聚类的质心\nplt.scatter(kmeans.cluster_centers_[:, 0], kmeans.cluster_centers_[:,1],\
  \ s = 100, c = 'yellow', label = 'Centroids')\nplt.legend()\n```\n\n![](img/00105.jpeg)\n\
  \n该图显示了 3 个聚类——红、蓝、绿分别代表鸢尾花的三种类型：setosa（山鸢尾）、versicolour（变色鸢尾）和 virginica（维吉尼亚鸢尾）。黄点表示质心，位于每个聚类的中心。\n\
  \n因为我们使用了肘部法则，K-means 算法能够找到正确的聚类数量 3。可以观察到，原始数据集包含三种类别的鸢尾花：Iris setosa、Iris versicolour\
  \ 和 Iris virginica。如果这是一个分类问题，我们会将数据点分类到这 3 个类别中。然而，因为这是一个聚类问题，我们仍然能够找到最优聚类数——3，这等于数据集中的类别数量。\n\
  \n这告诉我们，大多数分类问题和数据集都可用于无监督学习，特别是聚类任务。主要的直觉是：如果我们想将分类数据集用于聚类，必须移除标签，即移除由人工标注以实现监督的数据成分。然后我们在原始数据集上训练，以发现数据分布中固有的模式。\n\
  \n虽然我们只是涉及了无监督学习的一部分，但重要的是要注意，它是机器学习的一个至关重要的分支，拥有大量实际应用。例如，聚类可用于发现数据群体，在将数据输入传统监督学习算法之前，获得对数据的独特视角。\n\
  \n#### 模型实现\n\n聚类是一种无监督学习技术，其中没有显式标签。聚类用于发现数据集中的数据点群体。一个群体或聚类由彼此相似但与其他聚类整体不同的成员组成。一个好的聚类算法必须有能力发现数据集中部分或全部隐藏的聚类，应表现出簇内相似性，但不同簇之间应不相似或相距较远。聚类算法还应具有可扩展性以处理更大的数据集，并能处理噪声数据点和异常值。\n\
  \n聚类算法主要分为两大类——层次聚类算法和划分聚类算法。在层次聚类中，发现的聚类之间存在清晰的关系。这可以呈现为层级或顺序的形式。而在划分算法中，聚类之间的关系不明确，有时被称为扁平结构。聚类算法也可以从另一个角度来看。允许数据点属于多个聚类的算法称为软聚类算法。在此过程中，会为每个数据点分配概率，以指示其属于某个特定聚类的可能性。另一方面，硬聚类算法要求数据点仅且恰好属于一个聚类。\n\
  \n层次聚类算法是确定性的，这意味着每次在数据集上部署算法时，我们都能找到相同的聚类。这保证了结果的可复现性。划分算法是非确定性的，每次遍历数据集都会产生略微不同的聚类表示。\n\
  \n#### 自底向上层次聚类\n\n自底向上层次聚类是一种层次聚类技术，其中每个数据点最初都在自己的聚类中。然后使用欧氏距离等距离度量来计算所有点之间的距离。距离最短的点被合并形成自己的聚类。该过程持续进行，直到所有点都属于一个大聚类。其直觉是：相似的数据点在特征空间中可能仅相隔一小段距离。\n\
  \n一种流行的自底向上聚类是层次凝聚聚类算法。这里的距离度量可以是欧氏距离、曼哈顿距离或闵可夫斯基距离。当聚类形成时，聚类间的距离可以是两个聚类中任意两点之间的最短距离，称为单链接；或两点之间的最远距离，称为全链接；也可以是两个聚类中所有数据点距离的平均值（平均链接）。\n\
  \n下面是上述单链接的数学表达式。\n\n![](img/00106.jpeg)\n\n其中 `D` 是距离度量，例如曼哈顿距离。曼哈顿距离可以用数学方式表示为：\n\
  \n![](img/00107.gif)\n\n让我们看一张树状图，这只是使用层次凝聚聚类算法时表示聚类的方式。\n\n![](img/00108.gif)\n\
  \n在树状图中，每个点（A 到 G）开始时都在自己的聚类中。然后它们与距离不远的其他点合并成聚类。该过程以自底向上的方式进行，高度表示聚类在合并时的相似度。所有数据点归为一个聚类后，可以传入一个阈值来回溯任意数量的期望聚类。这在图中表示为水平线。因此，上图树状图中有三个聚类。\n\
  \n#### K-means 聚类\n\nK-means 是一种划分聚类算法，它将数据点分配到预定数量的聚类中。聚类数量必须作为指标传递给算法。K-means\
  \ 通过在数据分布中随机选择质心，并将数据点分配给最近的质心来工作。质心的数量与要确定的聚类数量相同。然后通过计算分配给该质心聚类的所有数据点的均值来重新计算质心。该过程是迭代的。数据点被重新分配给现在最近的质心，并更新每个聚类的质心。当数据点不再被重新分配到新聚类时，达到收敛。\n\
  \n![](img/00109.gif)\n\n\n\n\n上图展示了一个收敛数据集的示例。共有两个簇，数据点归属于距离其最近的簇。每个簇的中心由其质心表示。K-means\
  \ 算法对簇的数量和质心的初始化很敏感。根据质心的初始化方式不同，我们最终会得到不同簇中的数据点。由于 K-means 要求将簇的数量作为一个指标传入，因此了解数据集的最佳簇数量是很有必要的。这可以通过肘部法则来完成。一般来说，随着簇数量的增加，错误率会迅速下降，直到在某个点达到饱和，此时增加簇的大小不再带来成比例的错误率降低。肘部法则告诉我们，应选择错误率尚未趋于平稳时对应的簇数量作为最佳簇数量。\n\
  \n## 网络分析\n\n### 介数中心性\n\n图是一种用于表示高连通性数据的数据结构，即数据具有使其相互连接的关系。网络理论是将图作为一种手段来研究构成图的实体之间的关系。许多分析问题都可以建模为图问题，但当数据因其相互关联性而变得复杂时，使用图是最佳选择。此类数据一个非常流行的例子是社交媒体数据，可以说其天生就具备网络结构。用关系型数据库中常见的传统技术来分析此类数据并不合适。因此，社交媒体数据可以建模为一个图网络，其中顶点或节点相互连接。节点可以代表人等实体，边可以代表关系。以这种方式建模数据，使我们能够回答关于人际关系本质的重要问题，以及鉴于核心圈子的反应，人们如何对事件做出反应。\n\
  \n这就引出了网络分析中的中心性概念。中心性可以定义为确定哪些节点（在我们的例子中是人）对特定网络至关重要。另一种表述方式是：哪个节点或实体是网络运作方式的核心。在网络中计算重要性有多种方法，这些被称为中心性指标。其中包括度中心性、接近中心性、介数中心性和特征向量中心性。\n\
  \n![](img/00110.jpeg)\n\n上图是一个网络，展示了社交情境下朋友关系的图表示。节点代表个体，边代表关系。这是一个无向图的例子。这意味着连接（边）没有方向性。如果我们想找出在这个网络中谁很重要，可以使用上述任一中心性指标。\n\
  \n度中心性是指与节点相连的边的数量，可以看作是受欢迎程度或对网络的暴露度。尽管它是一个非常简单的指标，但在某些情况下很有效。接近中心性度量一个节点到网络中所有其他节点的平均距离。它可以被视为对网络具有间接影响力，或是信息能轻松传播至整个网络的节点。\n\
  \n介数中心性度量一个节点位于任意两个随机选择节点的最短路径上的频率。换句话说，介数衡量的是一个节点在网络中任意两个节点的最短路径中充当桥梁的次数。介数中心性可以被视为赋予节点一种非正式权力，使其成为网络各部分之间的守门人或中介。节点\
  \ v 的介数中心性可以用数学公式表示为：\n\n![](img/00111.jpeg)\n\n其中分母是从节点 s 到 t 的最短路径总数，分子是经过节点 v\
  \ 的那些最短路径的数量。\n\n### 特征向量中心性\n\n特征向量中心性是一种中心性指标，它不仅考虑特定节点连接了多少节点，还在计算中考虑了这些节点的质量或重要性。直观上，特征向量中心性衡量的是“不是你知道什么，而是你认识谁”。因此，每个节点的中心性是基于其连接的质量计算的，而不仅仅是连接的数量（如度中心性那样）。特征向量中心性可以被视为衡量一个节点与其他有影响力节点连接程度的指标。\n\
  \nGoogle 核心使用的 PageRank 算法是特征向量中心性的一种变体，用于根据用户的搜索查询对结果的相关性进行排名。其直觉是：网站被建模为网络上的节点，整个万维网被表示为一个巨大的网络。节点（网站）的排名基于指向它们的其他网站的质量或声誉。仅仅增加指向某网站的链接数量，并不会增加其在搜索结果排名中的影响力。指向某网站的链接必须来自重要网站，该网站的排名才会提高。这是合理的，因为热门网站更有可能指向最相关的内容。特征向量中心性是分析网络时使用的一个强大指标。\n\
  \n## 推荐系统\n\n互联网导致的信息过载使用户面对海量选择而陷入某种瘫痪。推荐系统是一种过滤信息的方式，以便向用户展示最相关的内容。推荐系力求根据用户在平台上的过往交互或行为，预测用户对某个项目或产品的偏好。这是机器学习最具商业价值的应用场景之一，从亚马逊到奈飞等公司，其商业模式都极大地受益于向用户展示相关内容，以增加销售或平台互动。\n\
  \n根据所采用的技术，推荐系统分为三大类：基于内容的过滤、协同过滤和混合推荐系统。基于内容的过滤依赖于项目的特征和用户的画像。推荐项目是基于它们与用户口味的相似程度。例如，一部电影可能具有演员、类型、导演等特征。具有特定偏好的用户会收到特征与其信息匹配的电影推荐。\n\
  \n协同过滤结合用户的过往行为、偏好以及其他用户的偏好来确定推荐项目。用户倾向于喜欢那些具有相似偏好的其他用户所喜欢的项目。\n\n混合推荐系统结合了基于内容的过滤和协同过滤的方法。它们可用于弥补某一方法的不足，例如当新项目加入但我们尚无足够信息时，或当用户在平台上交互不足、无法准确衡量其偏好时。\n\
  \n## 分类\n\n在机器学习中，大多数学习问题都可以建模为分类问题。分类问题的核心目标是从一组输入中学习一个映射函数，映射到一个或多个离散类别。离散类别有时被称为标签，这两个术语经常互换使用。\n\
  \n\n\n\n## Overview of Classification Algorithms\n\nA class or label can be understood\
  \ as representing a specific number of categories; therefore, the role of a classification\
  \ algorithm is to identify the category to which a sample belongs. If the classification\
  \ problem setup contains two distinct classes, it is a binary classification problem.\
  \ When the number of classes (labels) exceeds two, the learning problem is called\
  \ multi-class classification, indicating that an observation may fall into one of\
  \ $n$ possible categories. The last type of classification is when a sample can\
  \ belong to multiple classes (i.e., have multiple labels), in which case we are\
  \ dealing with a multi-label classification task.\n\nTo understand classification\
  \ more intuitively, please refer to the figure below:\n\n![](img/00112.jpeg)\n\n\
  As can be seen from the figure above, there are two features describing the data:\
  \ `X1` and `X2`. The classification task aims to divide the data into different\
  \ categories such that there exists a decision boundary that best separates the\
  \ classes. In this example, there are two classes—bankrupt companies and surviving\
  \ companies—and the data points representing companies can only belong to one of\
  \ these two categories. This is clearly a binary classification example because\
  \ there are only two classes.\n\nAnother point worth noting in the figure is that\
  \ the classes are linearly separable, meaning they can be separated by a straight\
  \ line. In other problems, this may not be achievable, but there are more robust\
  \ machine learning algorithms that can handle such situations.\n\n### Multi-class\
  \ Classification\n\nWe must understand classification deeply based on the number\
  \ of predicted classes because classification has many real-world applications.\
  \ To further deepen intuition, please analyze the figure below:\n\n![](img/00113.jpeg)\n\
  \nThe data is projected onto a 2D plane for visualization. There are three classes,\
  \ represented by red squares, blue triangles, and green circles, respectively. There\
  \ are also three decision boundaries dividing the data points into three regions,\
  \ with the class colors projected onto the background. This is a classic three-class\
  \ (0, 1, 2) multi-class classification example; although there are some misclassified\
  \ points, they are few in number and mostly appear near the decision boundaries.\n\
  \nWhen evaluating this model, we will use accuracy as the evaluation metric. Model\
  \ accuracy is determined by the ratio of samples correctly predicted by the classifier\
  \ to misclassified samples. Accuracy is usually a good metric for classification\
  \ tasks, but remember there are other metrics such as precision and recall that\
  \ can be explored depending on the modeling intent.\n\n### Common Classification\
  \ Algorithms\n\nSome machine learning models perform exceptionally well on classification\
  \ tasks, and a few of them will be analyzed in depth in the following sections.\
  \ The workflow for running a classification task is fairly standard across models.\n\
  \nFirst, we need a dataset containing a set of inputs and a corresponding set of\
  \ labels. This is important because classification is a supervised learning task;\
  \ we need to obtain the true classes (ground truth) of observations to minimize\
  \ the model's misclassification error. Therefore, to get a good model, we train\
  \ the classifier on samples and provide the true values via a feedback mechanism,\
  \ forcing the classifier to learn and reduce the error rate with each iteration\
  \ or pass through the training set (epoch).\n\nExamples of models used for classification\
  \ include Logistic Regression, Decision Trees, Random Forest, K-Nearest Neighbors,\
  \ Support Vector Machines, etc. We will practice classification using the last two\
  \ models as case studies.\n\n### Support Vector Machines\n\nSupport Vector Machines\
  \ (SVM), also known as Support Vector Networks, are a popular machine learning algorithm\
  \ for classification. The core intuition of SVM is to find an optimal hyperplane\
  \ that separates the data into the correct classes using only the data points close\
  \ to the hyperplane. The data points closest to the hyperplane are called support\
  \ vectors.\n\nThere may be multiple hyperplanes that can correctly separate the\
  \ classes, but the SVM algorithm selects the hyperplane with the maximum distance\
  \ (margin) to the support vectors. The benefit of choosing the hyperplane with the\
  \ widest margin is that it reduces the probability of misclassifying data points\
  \ during testing.\n\n![](img/00114.jpeg)\n\nThe SVM algorithm is robust to outliers\
  \ in the class distribution; it works by ignoring outliers when searching for the\
  \ best hyperplane with a good margin width.\n\nHowever, data distributions are not\
  \ always linearly separable. SVMs transform the features representing the data from\
  \ a low-dimensional space to a high-dimensional space by introducing new features\
  \ based on the original features. This process is performed automatically via kernel\
  \ functions. Examples of kernel functions in SVM include Linear, Polynomial, Radial\
  \ Basis Function (RBF), and others.\n\nCompared to other machine learning models,\
  \ SVMs have several advantages. They perform particularly well in high-dimensional\
  \ spaces and are memory-efficient and computationally efficient because they rely\
  \ only on a subset of data points (support vectors) for classification. They are\
  \ also versatile because we can choose different kernel functions depending on the\
  \ data representation at hand.\n\n### How to Create and Test a Support Vector Machine\
  \ Classifier\n\nIn this section, we will use an SVM classifier on the Pima Indians\
  \ Diabetes dataset and compare its results with a K-Nearest Neighbors classifier.\n\
  \nThe complete code is as follows:\n\n```python\n#### import libraries\nimport numpy\
  \ as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\n#### read dataset\
  \ from csv file\ndataset = pd.read_csv('diabetes.csv')\n\n#### create features and\
  \ labels\nfeatures = dataset.drop(['Outcome'], axis=1)\nlabels = dataset['Outcome']\n\
  \n#### split dataset into training set and test set\nfrom sklearn.model_selection\
  \ import train_test_split\nfeatures_train, features_test, labels_train, labels_test\
  \ = train_test_split(features, labels, test_size=0.25)\n\n#### import support vector\
  \ machine classifier\nfrom sklearn.svm import SVC\nclassifier = SVC()\n\n#### fit\
  \ data\nclassifier.fit(features_train, labels_train)\n\n#### get predicted class\
  \ labels\npred = classifier.predict(features_test)\n\n#### get accuracy of model\
  \ on test set\nfrom sklearn.metrics import accuracy_score\naccuracy = accuracy_score(labels_test,\
  \ pred)\nprint('Accuracy: {}'.format(accuracy))\n```\n\nWe obtained an accuracy\
  \ of 0.66, which is worse than the 0.74 of the K-Nearest Neighbors classifier. There\
  \ are many hyperparameters to try, such as changing the type of kernel function\
  \ used.\n\n```python\nfrom sklearn.svm import SVC\nclassifier = SVC(kernel='linear')\n\
  ```\n\nWhen we use a linear kernel, the accuracy jumps to 0.76. This is an important\
  \ lesson in machine learning: we often cannot know in advance what the best hyperparameters\
  \ are. Therefore, we need to try multiple values to determine the best-performing\
  \ hyperparameters.\n\n## Deep Learning with TensorFlow\n\n\n\n\n\n## 深度学习概述\n\n\
  深度学习是机器学习的一个子领域，它利用执行特征学习的算法来自动发现数据中的特征表示。深度学习中的“深度”是指这种学习是在多个层级上进行的，较高层级的特征表示由链条早期检测到的更简单的特征组成。深度学习中使用的主要算法是由多层组成的深度神经网络。深度学习也被称为分层学习，因为它学习的是特征的层级结构。随着我们在网络中移向更深层，学习到的特征复杂度会增加。\n\
  \n深度学习技术大致受到目前已知的大脑功能原理的启发。主要思想是大脑由数十亿个神经元组成，它们通过化学反应产生的电信号以某种方式相互作用。神经元之间的这种相互作用结合其他器官，帮助人类执行认知任务，如视觉、听觉、决策等。深度学习算法所做的是将神经元网络排列成一种称为**人工神经网络（ANN）**的结构，以学习从输入直接到输出的映射函数。深度学习与经典人工神经网络的区别在于网络的层级大几个数量级，因此通常被称为**深度神经网络（DNN）**或前馈神经网络。\n\
  \n要获得扎实的理解，我们有必要退一步，尝试理解单个神经元的概念。\n\n![](img/00115.jpeg)\n\n首先，让我们对生物神经元建立简单的直觉。上图展示了一个由不同部分组成的单个生物神经元。大脑由数十亿个类似的神经元连接在一起形成网络。树突是将网络中前面神经元的信息信号传递到特定神经元的组件。在机器学习的背景下，将其视为其他神经元迄今为止关于我们数据所学到的特征是有帮助的。包含细胞核的细胞体是进行计算的地方，这些计算将决定我们是否识别出了我们感兴趣检测的特征的存在。通常，如果神经元因流入的信息导致其化学成分而被激发，它可以决定以电信号的形式向连接的神经元发送通知。该电信号通过轴突发送。对于我们的人工用例，我们可以认为人工神经元仅在其内部计算满足某些条件时才会发射信号。最后，这种神经元网络以这样的方式学习表示：它们之间的连接根据当前的任务要么被加强，要么被削弱。生物神经元之间的连接称为突触，我们将在人工神经网络中看到突触的类比，称为权重，这些是我们要训练以承担学习问题的参数。\n\
  \n![](img/00116.jpeg)\n\n现在让我们将目前所知转化为作为计算单元实现的人工神经元。从图中，我们可以设想 `X1`、`X2` 到 `Xn`\
  \ 作为传入神经元的特征。特征代表数据点的一个数据维度。特征的组合完全描述了数据所捕获的该数据点。`W1` 到 `Wn` 是权重，它们的作用是告诉我们应该给特征多高的排名。即权重的较低值意味着连接的特征不那么重要，较高值意味着更大的重要性。然后，所有人工神经网络的输入都被线性求和（并排相加）。此时，我们使用作为阈值的条件来决定是否向下一个神经元发送信号。如果线性计算的结果大于或等于阈值，我们发送信号，否则不发送。\n\
  \n从解释中，现在很清楚地看到为什么这些技术大致基于生物神经元的操作。然而，必须注意的是，深度学习超越这一点后并不依赖神经科学，因为大脑功能的完整运作方式尚不清楚。\n\
  \n在深度神经网络中，激活标准（我们决定是否发射信号）通常被非线性激活函数所取代，例如 `sigmoid`、`tanh` 或**修正线性单元（ReLU）**。使用非线性激活函数的原因是为了让人工神经网络打破线性，从而使其能够学习更复杂的表示。如果没有非线性激活函数，无论网络的深度（层数）如何，它学到的仍然是一个线性函数，这严重限制了其能力。\n\
  \n现在让我们看看如何使用下图将这些神经元排列成人工神经网络来解释概念。\n\n![](img/00117.jpeg)\n\n在示例中，变量 1 到 4 代表以特征形式输入网络的输入。输入可以是图像、文本或序列数据。包含变量（特征）的输入层连接到隐藏层中的神经元。之所以称为隐藏层，是因为我们无法直接检查其内部发生的情况，这与我们可以直接访问的输入层或输出层不同。隐藏层中有\
  \ 3 个单元或神经元。最后一层是输出层。这是我们获得预测的地方。在本例中，它由单个神经元组成，表明它渲染单个输出。这样的神经元可用于在回归问题中获得单个实值数字，或在二元分类问题中获得一个类别。\n\
  \n可以观察到，一层中的神经元连接到下一层中的所有神经元，由于这种配置，我们称之为全连接层。神经元之间连接的强度由权重控制。最后，上述网络被称为 2 层神经网络，因为在描述网络包含的层数时不计算输入层。\n\
  \n深度神经网络有各种架构，一些架构对模型预期处理的数据类型做出假设。这些假设通常能提高此类模型在其设计任务上的性能。**卷积神经网络（CNN）** 的设计假设它们将处理二维数据，如图像，是计算机视觉任务（如图像检测、图像分类、图像分割、目标识别等）的事实标准。另一方面，**循环神经网络（RNN）**\
  \ 特别适合处理序列和时间数据，如文本和时间序列。这些架构中的每一个都有进一步的变体，这些变体是为了适应特定的学习问题而进行的修改。\n\n### 深度学习与其他机器学习方法的比较\n\
  \n深度学习的流行主要基于这样一个事实：它在不同领域取得了令人印象深刻的结果，并开始在某些任务（如目标识别）上超越人类。与其他机器学习技术相比，它能够在许多基准测试中达到最先进的结果，并且只需稍作修改即可应用于广泛的学习问题。原因不仅在于人工神经网络已被证明能够学习任何函数（如通用近似定理所示），深度神经网络似乎还能随着数据的增加而提高性能。它们摆脱了传统机器学习算法遭受的平台效应，即在某个时刻，算法的性能不再随着额外数据的可用性而提高。\n\
  \n![](img/00118.jpeg)\n\n\n\n\n\n## 深度学习概述\n\n深度学习算法被视为数据密集型，因为它们需要海量数据才能达到高准确度，且更多数据似乎总能有助于提升性能。随着互联网的出现，海量数据变得触手可及，深度学习正迅速成为解决许多机器学习问题的首选方案。\n\
  \n### 深度学习的应用\n\n深度学习已被应用于解决许多具有现实应用价值的问题，并正逐步转化为商业产品。\n\n在计算机视觉领域，深度学习技术被用于自动上色，以修复古老的黑白照片；用于社交网络中照片中好友的自动标记；以及基于内容将照片分组归类到文件夹中。\n\
  \n在自然语言处理（NLP）中，这些算法被用于数字助手、智能家居音箱等设备的语音识别。随着自然语言理解（NLU）的进步，聊天机器人正被部署为客服代理，机器翻译则实现了语言之间的实时翻译。\n\
  \n另一个显著领域是推荐系统，根据用户的偏好和过往消费习惯提供个性化建议。简而言之，深度学习算法大有裨益，学习它们是对时间和资源的优质投资。\n\n### Python\
  \ 深度学习框架\n\nPython 拥有成熟的生态系统，包含多个可用于生产环境的深度学习框架。其中包括 `Pytorch`、`Chainer`、`MXNet\
  \ Keras`、`TensorFlow` 等。本书将重点使用 `TensorFlow`，因为它是一个极其流行且受支持的深度学习框架，由 Google 于 2015\
  \ 年开源。\n\n`TensorFlow` 使用计算图的概念来构建模型。节点和操作预先在图上声明，然后在训练时编译模型。在下一节中，我们将了解如何安装 `TensorFlow`\
  \ 并通过一个实际例子使用它来执行深度学习任务。\n\n### 安装 TensorFlow\n\n`TensorFlow` 是跨平台的，可安装在各种操作系统上。本节将介绍如何在三种广泛使用的操作系统（Linux、macOS\
  \ 和 Windows）上安装它。`TensorFlow` 可以使用 `pip`（Python 原生包管理器）、`virtualenv`（创建虚拟环境）或通过捆绑的科学计算发行版（如\
  \ `Anaconda`）进行安装。为了本书的目的，我们将使用 `pip`。\n\n#### 在 Windows 上安装 TensorFlow\n\n要在 Windows\
  \ 上安装 `TensorFlow`，首先需要安装 Python，它捆绑了作为包管理器的 `pip`。Python 可在 <https://www.python.org/downloads/windows>\
  \ 下载为可执行文件。\n\n安装完成后，启动终端并运行以下命令：\n\n```\nC:\\> pip3 install --upgrade tensorflow\n\
  ```\n\n#### 在 Linux 上安装 TensorFlow\n\n对于 Ubuntu 等 Linux 发行版及其变体，`pip` 通常已预装。要检查安装的\
  \ `pip` 版本，请在终端运行：\n\n```\n$ pip -V\n```\n\n或\n\n```\n$ pip3 -V\n```\n\n这取决于你安装的\
  \ Python 版本：Python 2.7 使用 `pip`，Python 3.x 使用 `pip3`。\n\n如果未安装 `pip`，请根据你的 Python\
  \ 版本运行相应命令：\n\n```\n$ sudo apt-get install python-pip python-dev   # 适用于 Python\
  \ 2.7\n$ sudo apt-get install python3-pip python3-dev # 适用于 Python 3.n\n```\n\n\
  建议你的 `pip` 或 `pip3` 版本为 8.1 或更高。现在可以使用以下命令安装 `TensorFlow`：\n\n```\n$ pip install\
  \ tensorflow    # Python 2.7\n$ pip3 install tensorflow   # Python 3.x\n```\n\n\
  #### 在 macOS 上安装 TensorFlow\n\n要在 macOS 上安装 `TensorFlow`，需要先安装 Python，因为它是先决条件。要检查是否安装了\
  \ `pip`，请运行：\n\n```\n$ pip -V\n```\n\n或\n\n```\n$ pip3 -V\n```\n\n这取决于你安装的 Python\
  \ 版本：Python 2.7 使用 `pip`，Python 3.x 使用 `pip3`。\n\n如果未安装 `pip`，或版本低于 8.1，请运行以下命令进行安装或升级：\n\
  \n```\n$ sudo easy_install --upgrade pip\n$ sudo easy_install --upgrade six\n```\n\
  \n现在可以使用以下命令安装 `TensorFlow`：\n\n```\n$ pip install tensorflow    # Python 2.7\n\
  $ pip3 install tensorflow   # Python 3.x\n```\n\n### 如何创建神经网络模型\n\n要在 `TensorFlow`\
  \ 中创建神经网络，理解 `TensorFlow` 的工作原理至关重要。以下步骤将帮助我们了解需要做什么：\n\n1.  **构建计算图**：首先，我们需要定义将在张量上执行的数学运算。我们可以将张量视为高阶矩阵。矩阵是按行和列排列数字的数组。图像等数据结构可以表示为矩阵，由于深度学习使用几何变换，任何模型的输入都必须是数值型的。\n\
  2.  **变量初始化**：在训练模型之前，所有先前声明的变量都必须初始化。在 `TensorFlow` 中，变量通常使用占位符声明，它们在计算图上注册，但实际值稍后才提供。\n\
  3.  **创建会话**：在描述完计算图并初始化变量后，下一步是创建一个会话，在其中执行计算图。\n4.  **在会话中运行图**：将完整的图连同占位符的值一起传递给会话执行。这是图中定义的数学运算发生的时候。\n\
  5.  **关闭会话**：当图及相关计算执行完毕后，我们需要关闭或结束会话。\n\n![](img/00119.jpeg)\n\n上图展示了一个函数的简单计算图。在下一章中，我们将使用\
  \ `TensorFlow` 描述类似的内容来定义神经网络。\n\n### 深度学习案例研究\n\n在本章中，我们将处理可用于现实应用的数据。将进行两个案例研究：第一个涉及预测客户流失，即客户停止光顾某家企业并转向其竞争对手的可能性有多大。第二个研究涉及自动句子分类，可用于评论网站根据用户评论检测用户情绪。\n\
  \n为了让我们能快速开发模型并测试假设，使用 `TensorFlow` 的高级 API 是合理的，这些 API 通过 `TFLearn` 暴露。`TFLearn`\
  \ 捆绑了类似于 `Scikit-Learn` 的组件，但用于构建深度神经网络。`TFLearn` 只是 `TensorFlow` 底层计算图组件的一个便捷封装。因此\
  \ `TensorFlow` 是 `TFLearn` 的依赖项，也就是说，要使用或安装 `TFLearn`，首先需要安装 `TensorFlow`。\n\n既然我们已在上一章安装了\
  \ `Tensorflow`，现在可以继续安装 `TFLearn`。`TFLearn` 可通过 Python 原生包管理器 `pip` 在上一章涵盖的三大主流操作系统上安装。要安装\
  \ `TFLearn`，请在终端运行以下命令：\n\n```\n$ pip install tflearn\n```\n\n### 银行客户流失建模\n\n这里呈现这样一个案例：一家银行希望利用多年收集的客户数据，预测哪些客户可能会停止使用该银行服务并转投竞争对手。此类分析对银行的回报极为丰厚，因为它可以针对不满意的客户提供激励措施，从而降低流失率，帮助银行扩大客户群并巩固地位。\n\
  \n\n\n\n\n## 使用深度学习进行客户流失建模\n\n该数据集包含许多信息丰富的属性，如账户余额、订阅产品数量、信用卡状态、预估客户薪资等。目标变量是客户是否离开银行，因此这是一个二分类任务。还有一些分类特征，如性别和地理位置，在将它们输入神经网络之前，我们需要对其进行转换。\n\
  \n客户流失建模数据集可在以下链接下载：\n\n[`www.kaggle.com/aakash50897/churn-modellingcsv/data`](https://www.kaggle.com/aakash50897/churn-modellingcsv/data)\n\
  \n和往常一样，我们首先导入所有相关库，使用 Pandas 加载数据集，并对数据集调用 `head()` 方法以查看其内容。\n\n```python\n###\
  \ import all relevant libraries\nimport numpy as np\nimport matplotlib.pyplot as\
  \ plt\nimport pandas as pd\nimport tensorflow as tf\nimport tflearn\n\n### load\
  \ the dataset\ndataset = pd.read_csv('Churn_Modelling.csv')\n\n### get first five\
  \ rows (observations)\ndataset.head()\n```\n\n![数据集前几行](img/00120.jpeg)\n\n该数据集包含\
  \ 14 列。前 3 列无信息量，分别是 `RowNumber`、`CustomerId` 和 `Surname`。这三列可视为标识符，因为它们不提供任何有助于洞察客户是留下还是离开的信息。在进行分析前，它们将被移除。最后一列\
  \ `Exited` 是类别标签，我们的模型将学习预测它。\n\n在对数据集有了整体了解后，下一步是将列拆分为特征和标签。我们使用 Pandas 切片操作来完成，该操作从指定索引中选择信息。在本例中，特征从第\
  \ 3 列开始，到第 12 列结束。请记住，数组索引从 0 开始，而不是 1。\n\n```python\nX = dataset.iloc[:, 3:13].values\n\
  y = dataset.iloc[:, 13].values\n```\n\n由于数据集中包含分类特征（`Geography` 和 `Gender`），我们必须将它们转换为深度学习算法可处理的形式。我们使用独热编码来实现。独热编码创建一个稀疏矩阵，所有位置为零，仅在代表待评估类别的位置为\
  \ 1。我们使用 Scikit-Learn 的预处理模块先创建标签编码器，然后从中创建独热表示。\n\n```python\n### encoding categorical\
  \ data\nfrom sklearn.preprocessing import LabelEncoder, OneHotEncoder\n\nlabelencoder_X_1\
  \ = LabelEncoder()\nX[:, 1] = labelencoder_X_1.fit_transform(X[:, 1])\n\nlabelencoder_X_2\
  \ = LabelEncoder()\nX[:, 2] = labelencoder_X_2.fit_transform(X[:, 2])\n\nonehotencoder\
  \ = OneHotEncoder(categorical_features=[1])\nX = onehotencoder.fit_transform(X).toarray()\n\
  X = X[:, 1:]\n```\n\n我们将数据拆分为训练集和测试集。一个用于训练模型，另一个用于测试性能。\n\n```python\n### splitting\
  \ the dataset into the training set and test set\nfrom sklearn.model_selection import\
  \ train_test_split\n\nX_train, X_test, y_train, y_test = train_test_split(X, y,\
  \ test_size=0.2, random_state=0)\n\ny_train = np.reshape(y_train, (-1, 1))  # reshape\
  \ y_train to [None, 1]\ny_test = np.reshape(y_test, (-1, 1))    # reshape y_test\
  \ to [None, 1]\n```\n\n目前 `X` 中包含的特征不在同一尺度上，因此我们应用标准化缩放，使所有特征的均值为 0，标准差为 1。\n\n\
  ```python\n### feature scaling\nfrom sklearn.preprocessing import StandardScaler\n\
  \nsc = StandardScaler()\nX_train = sc.fit_transform(X_train)\nX_test = sc.transform(X_test)\n\
  ```\n\n我们通过使用 TFLearn API 来描述深度神经网络，从而开始创建它。\n\n```python\n### build the neural\
  \ network\nnet = tflearn.input_data(shape=[None, 11])\nnet = tflearn.fully_connected(net,\
  \ 6, activation='relu')\nnet = tflearn.dropout(net, 0.5)\nnet = tflearn.fully_connected(net,\
  \ 6, activation='relu')\nnet = tflearn.dropout(net, 0.5)\nnet = tflearn.fully_connected(net,\
  \ 1, activation='tanh')\nnet = tflearn.regression(net)\n```\n\n该网络有 11 个输入特征和 3\
  \ 个全连接层。我们还使用 Dropout 作为正则化手段，以防止模型过拟合。接下来，我们使用 TFLearn 的 `DNN` 来定义模型。\n\n```python\n\
  ### define model\nmodel = tflearn.DNN(net)\n\n### we start training by applying\
  \ gradient descent algorithm\nmodel.fit(X_train, y_train, n_epoch=10, batch_size=16,\
  \ validation_set=(X_test, y_test),\n          show_metric=True, run_id=\"dense_model\"\
  )\n```\n\n![训练进度](img/00121.jpeg)\n\n我们训练模型 10 个 epoch，批次大小为 16。模型在用于验证性能的测试集上达到了\
  \ 0.7885 的准确率。\n\n## 情感分析\n\n对于这个真实世界的用例，我们解决一个来自自然语言处理（NLP）领域的问题。任务是将电影评论分类为表达对电影积极情感或消极情感的类别。要执行此类任务，模型必须能够理解自然语言；也就是说，它必须知道整个句子的含义，并通过其类别预测来表达。循环神经网络（RNN）通常非常适合涉及句子等序列数据的任务；然而，我们将对该任务应用一维卷积神经网络（CNN）模型，因为它更容易训练且能产生可比的结果。\n\
  \n我们将使用的数据集是 IMDB 情感数据库，它包含 25,000 条训练集电影评论和 25,000 条测试集评论。TFLearn 将该数据集与其他数据集捆绑在一起，因此我们将从\
  \ `datasets` 模块访问它。\n\n首先，我们导入 IMDB 情感数据集模块以及来自 TFLearn 的其他相关组件，如卷积层、全连接层、数据工具等。\n\
  \n```python\nimport tensorflow as tf\nimport tflearn\nfrom tflearn.layers.core import\
  \ input_data, dropout, fully_connected\nfrom tflearn.layers.conv import conv_1d,\
  \ global_max_pool\nfrom tflearn.layers.merge_ops import merge\nfrom tflearn.layers.estimator\
  \ import regression\nfrom tflearn.data_utils import to_categorical, pad_sequences\n\
  from tflearn.datasets import imdb\n```\n\n下一步是实际将数据集加载到训练集和测试集中。\n\n```python\n\
  ### load IMDB dataset\ntrain, test, _ = imdb.load_data(path='imdb.pkl', n_words=10000,\n\
  \                                valid_portion=0.1)\n\ntrainX, trainY = train\n\
  testX, testY = test\n```\n\n下一阶段涉及数据预处理，我们对序列进行填充，这意味着我们设置一个最大句子长度，对于长度小于最大句子长度的句子，我们在其后添加零。这样做是为了确保在将句子传递给神经网络模型之前，所有句子长度相同。训练集和测试集中的标签也被转换为分类值。\n\
  \n```python\n### data preprocessing\n### sequence padding\ntrainX = pad_sequences(trainX,\
  \ maxlen=100, value=0.)\ntestX = pad_sequences(testX, maxlen=100, value=0.)\n\n\
  ### converting labels to binary vectors\ntrainY = to_categorical(trainY, nb_classes=2)\n\
  testY = to_categorical(testY, nb_classes=2)\n```\n\n正如我们在前一个示例中看到的，下一步是使用 TFLearn\
  \ 提供的构建块来描述一个一维卷积神经网络模型。\n\n```python\n### building the convolutional network\n\
  network = input_data(shape=[None, 100], name='input')\nnetwork = tflearn.embedding(network,\
  \ input_dim=10000, output_dim=128)\n\nbranch1 = conv_1d(network, 128, 3, padding='valid',\
  \ activation='relu', regularizer=\"L2\")\nbranch2 = conv_1d(network, 128, 4, padding='valid',\
  \ activation='relu', regularizer=\"L2\")\nbranch3 = conv_1d(network, 128, 5, padding='valid',\
  \ activation='relu', regularizer=\"L2\")\n\nnetwork = merge([branch1, branch2, branch3],\
  \ mode='concat', axis=1)\nnetwork = tf.expand_dims(network, 2)\nnetwork = global_max_pool(network)\n\
  network = dropout(network, 0.5)\nnetwork = fully_connected(network, 2, activation='softmax')\n\
  network = regression(network, optimizer='adam', learning_rate=0.001)\n```\n\n\n\n\
  \n该网络包含 3 个一维卷积层、一个用于降低卷积维度的全局最大池化层、一个用于正则化的 Dropout 层以及一个全连接层。最后，我们声明模型并调用其 `fit()`\
  \ 方法开始训练。\n\n## 训练\n\n```python\nmodel = tflearn.DNN(network, tensorboard_verbose=0)\n\
  \nmodel.fit(trainX, trainY, n_epoch=5, shuffle=True, validation_set=(testX, testY),\
  \ show_metric=True, batch_size=32)\n```\n\n![](img/00122.jpeg)\n\n训练好的模型在测试集上达到了\
  \ 0.80 的准确率，也就是说它正确分类了 80% 句子所表达的情感。\n\n以下是用于训练模型的完整代码：\n\n```python\n### import\
  \ tflearn, layers and data utilties\nimport tensorflow as tf\nimport tflearn\nfrom\
  \ tflearn.layers.core import input_data, dropout, fully_connected\nfrom tflearn.layers.conv\
  \ import conv_1d, global_max_pool\nfrom tflearn.layers.merge_ops import merge\n\
  from tflearn.layers.estimator import regression\nfrom tflearn.data_utils import\
  \ to_categorical, pad_sequences\nfrom tflearn.datasets import imdb\n\n### load IMDB\
  \ dataset\ntrain, test, _ = imdb.load_data(path='imdb.pkl', n_words=10000,\n   \
  \                             valid_portion=0.1)\n\ntrainX, trainY = train\ntestX,\
  \ testY = test\n\n### data preprocessing\n### sequence padding\ntrainX = pad_sequences(trainX,\
  \ maxlen=100, value=0.)\ntestX = pad_sequences(testX, maxlen=100, value=0.)\n\n\
  ### converting labels to binary vectors\ntrainY = to_categorical(trainY, nb_classes=2)\n\
  testY = to_categorical(testY, nb_classes=2)\n\n### building the convolutional network\n\
  network = input_data(shape=[None, 100], name='input')\nnetwork = tflearn.embedding(network,\
  \ input_dim=10000, output_dim=128)\n\nbranch1 = conv_1d(network, 128, 3, padding='valid',\
  \ activation='relu', regularizer=\"L2\")\nbranch2 = conv_1d(network, 128, 4, padding='valid',\
  \ activation='relu', regularizer=\"L2\")\nbranch3 = conv_1d(network, 128, 5, padding='valid',\
  \ activation='relu', regularizer=\"L2\")\n\nnetwork = merge([branch1, branch2, branch3],\
  \ mode='concat', axis=1)\nnetwork = tf.expand_dims(network, 2)\nnetwork = global_max_pool(network)\n\
  network = dropout(network, 0.5)\nnetwork = fully_connected(network, 2, activation='softmax')\n\
  network = regression(network, optimizer='adam', learning_rate=0.001,\n         \
  \            loss='categorical_crossentropy', name='target')\n\n### training\nmodel\
  \ = tflearn.DNN(network, tensorboard_verbose=0)\nmodel.fit(trainX, trainY, n_epoch=5,\
  \ shuffle=True, validation_set=(testX, testY), show_metric=True, batch_size=32)\n\
  ```\n\n谢谢！\n\n感谢您购买本书！本书旨在帮助您理解如何使用 Python 进行机器学习。如果您喜欢这本书，并觉得它为您的生活增添了价值，我们恳请您抽出时间为其撰写评论。\n\
