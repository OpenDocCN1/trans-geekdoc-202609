    \ 4.10](Images/p75-1.jpg)\n\nScreenshot 4.10\n\n3. When you have done this, click\
    \ **OK** and you can run your chi-square test as described earlier in this chapter.\
    \ It is so much easier than entering all the raw data.\n\n## 4.8Notes\n\n1. [1](#09_Chapter04.xhtml#ch4fn1a)This\
    \ information might also be relevant for any further analysis. For example, if\
    \ we found that one counsellor received higher satisfaction ratings than the other,\
    \ it could be that females are more generous in their ratings than males. It could\
    \ even be that same-sex patients and counsellors worked best – achieving the highest\
    \ satisfaction ratings. It is factors like these that need to be investigated\
    \ in quantitative data analysis.\n\n2. [2](#09_Chapter04.xhtml#ch4fn2a)Expected\
    \ frequencies for each cell are calculated by multiplying row total by column\
    \ total and dividing by the grand total. So, the expected frequency for the top\
    \ right cell in [Table 4.4](#09_Chapter04.xhtml#tab4-4) (50) is arrived at through\
    \ the following calculation: (100 × 100)/200 = 50. The same values apply to all\
    \ the cells in this table of course.\n\n3. [3](#09_Chapter04.xhtml#ch4fn3a)What\
    \ is a large enough sample size? Well, for this chi-square our sample of 30 was\
    \ just enough given the distribution of the male and female patients. One source\
    \ recommends a sample of at least 50 (Watson *et al*. 2006), but the point is\
    \ that you need to maintain sufficient numbers in each of the cells, so the sample\
    \ needs to be fairly evenly distributed across the categories.\n\n4. [4](#09_Chapter04.xhtml#ch4fn4a)Some\
    \ authors recommend citing the more conservative continuity correction (second\
    \ line down in the table) for 2×2 tables like this one (i.e. two row categories\
    \ – male/female, and two column categories – John/Jane), but Pett (1997: 163)\
    \ and Howell (1997: 149) advise against citing this value. Some authors also suggest\
    \ that where expected frequencies are less than 5 in 2×2 tables, we can cite the\
    \ more conservative Fisher’s Exact Test (fourth line down in the table) instead\
    \ of the Pearson chi-square value (Pett 1997; Kinnear and Gray 2004). However,\
    \ Howell (1997: 152) points out that the chi-square is robust to violations from\
    \ small sample sizes and is unlikely to produce false positive results (i.e.,\
    \ concluding a significant difference when there is not one). Indeed, the problem\
    \ with small sample sizes is that they are more likely to have insufficient numbers\
    \ (or ‘power’) to show a significant difference. 76 Page 76\n\n5. [5](#09_Chapter04.xhtml#ch4fn5a)There\
    \ are techniques (and some computer programs) to determine sample sizes that rely\
    \ on estimates of effect from previous similar research using similar outcome\
    \ measures. The idea being that if we know the size of the effect to expect from\
    \ previous studies then we can calculate the size of the sample needed to ensure\
    \ a sufficient sample size to detect significant differences if they exist. This\
    \ is beyond the scope of this book but for a relatively simple estimate of sample\
