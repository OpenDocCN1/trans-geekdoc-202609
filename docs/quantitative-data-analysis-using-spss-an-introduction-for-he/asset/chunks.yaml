    \ v15，会出现 **Output Viewer** 窗口，记录你在 SPSS 中执行了该操作。点击 **Output Viewer** 窗口右上角橙色框中的叉号关闭该窗口。当系统询问是否保存时，选择\
    \ **no**。\n\n31 Page 31 ![Screenshot 2.18](img/p31-1.jpg)\n\nScreenshot 2.18\n\
