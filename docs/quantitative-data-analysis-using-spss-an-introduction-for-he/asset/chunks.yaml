    \ male/female patients are there?\n\n*   How many patients were treated by each\
    \ of the counsellors John and Jane?\n\nThis will provide us with an initial overview\
    \ of our sample, or ‘population’. So let us start with our first categorical variable\
    \ – sex.\n\n### Running frequencies in SPSS\n\n1.  1From the menu at the top of\
    \ the screen click **Analyze,** then **Descriptive Statistics** then **Frequencies.**34\
    \ Page 34\n\n    ![Screenshot 3.1](Images/p34-1.jpg)\n\n    Screenshot 3.1\n\n\
    2.  2Choose the variable **sex** by clicking with your mouse.\n\n3.  3Once **sex**\
    \ is highlighted move it across into the variables box by clicking the arrow.\
    \ Alternatively you could just double-click it once it is highlighted.35 Page\
    \ 35\n\n    ![Screenshot 3.2](Images/p34-2.jpg)\n\n    Screenshot 3.2\n\n4.  4Now\
    \ click **OK.**\n\n    A new SPSS window should now appear. This is called the\
    \ **Output Viewer,** as shown next. The results of all analyses performed by SPSS\
    \ will appear in this viewer – which can be saved separately as a file.\n\n  \
    \  Note: You may need to maximize this screen by clicking the maximize button\
    \ (top right of screen – middle icon to the left of the x).\n\n![Screenshot 3.3](Images/p35-1.jpg)\n\
    \nScreenshot 3.3"
