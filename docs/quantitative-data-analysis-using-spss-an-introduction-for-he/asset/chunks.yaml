- raw: "    **Table 4.1**Number of male and female patients\n\n    | sex  |\n\n  \
    \  | --- |\n\n    |  || Frequency || Percent || Valid Percent || Cumulative Percent\
    \ |\n\n    | --- | --- | --- | --- | --- |\n\n    | Valid || male || 14 || 46.7\
    \ || 46.7 || 46.7 |\n\n    |  || female || 16 || 53.3 || 53.3 || 100.0 |\n\n \
    \   |  || Total || 30 || 100.0 || 100.0 ||  |\n\n    A table titled Sex lists\
    \ the variables, including the valid males, females, and total values in column\
    \ 1. Columns 2 to 5 list the corresponding frequency, percentage, valid percentage,\
    \ and cumulative percentage values.\n\n    **Table 4.2**Number of patients seen\
    \ by each counsellor\n\n    | counsellor |\n\n    | --- |\n\n    |  || Frequency\
    \ || Percent || Valid Percent || Cumulative Percent |\n\n    | --- | --- | ---\
    \ | --- | --- |\n\n    | Valid || John || 14 || 46.7 || 46.7 || 46.7 |\n\n   \
    \ |  || Jane || 16 || 53.3 || 53.3 || 100.0 |\n\n    |  || Total || 30 || 100.0\
    \ || 100.0 ||  |\n\n    A table titled counselor lists the valid variables, including\
    \ John, Jane, and total values in column 1. Columns 2 to 5 list the corresponding\
    \ frequency, percentage, valid percentage, and cumulative percentage values.\n\
    \n    62 Page 62 \n\n    From these frequency tables we could see that the number\
    \ of male and female patients was quite evenly distributed (14 male, 16 female)\
    \ and that the counsellors each saw a similar number of patients (John saw 14,\
    \ Jane saw 16).\n\n    But what about the relationship between these two variables?\
    \ That is, did each of the counsellors see a similar number of male and female\
    \ patients or were they quite different proportions? To find out we need to run\
    \ a cross-tabulation in SPSS.\n\n    ### Running cross-tabulations in SPSS\n\n\
    \    1.  1From the menu at the top of the screen click **Analyze** then **Descriptive\
    \ Statistics** then **Crosstabs**.\n\n    2.  2Move the variable **sex** into\
    \ the rows box and **counsellor** into the columns box.\n\n    3.  3Click the\
    \ **Cells** button. In this box the observed counts should already be ticked (this\
    \ simply provides the observed frequencies). You should also click **Row percentages**\
    \ – since we want to know the percentages of males and females who were treated\
    \ by each counsellor.\n\n        ![Screenshot 4.1](Images/p62-1.jpg)\n\n     \
    \   Screenshot 4.1\n\n        63 Page 63\n\n    4.  4Click **Continue** to close\
    \ this box, and then click **OK** to run the analysis. This should produce the\
    \ following table in your output viewer.\n\n    **Table 4.3**Cross-tabulation\
    \ of sex and counsellor\n\n    | sex \\* counsellor Crosstabulation  |\n\n   \
    \ | --- |\n\n    |  || counsellor || Total |\n\n    | --- | --- | --- |\n\n  \
    \  | John || Jane |\n\n    | sex || male || Count% within sex || 1071.4% || 428.6%\
    \ || 14100.0% |\n\n    |  || female || Count% within sex || 425.0% || 1275.0%\
    \ || 16100.0% |\n\n    | Total ||  || Count% within sex || 1446.7% || 1653.3%\
    \ || 30100.0% |\n\n    A table titled sex counselor crosstabulation lists the\
    \ count and percentage values within sex for male and female, and total values\
    \ in column 1. Columns 2 and 3 list the corresponding values for counselors, including\
    \ John and Jane, and total, respectively.\n\n    From this table we can see the\
    \ numbers and relative percentages of males and females who were treated by each\
    \ counsellor. In particular, we can see that while the majority (71%) of male\
    \ patients saw John, the majority of female patients (75%) saw Jane. Clearly then,\
    \ the proportion of male/female patients were not equally distributed across the\
    \ two counsellors: the female counsellor tended to see female patients, and the\
    \ male counsellor tended to see male patients. This might suggest a preference\
    \ among patients to see a same-sex counsellor to discuss their problems. We noted\
    \ in the overview from [Chapter 1](#06_Chapter01.xhtml) that this might be important\
    \ information for the doctor and should be included in any report, since this\
    \ might suggest it is necessary to ensure a male and a female counsellor are available\
    \ to cater for patient preferences.^()\n\n    ## 4.3The chi-square statistical\
    \ test\n\n    We have seen, then, that the sex of patients was not equally distributed\
    \ across the counsellors. But we might ask was this a chance result? If we started\
    \ the service again and the patients were *randomly* assigned to the counsellors\
    \ might we have found a similar result? Perhaps even the opposite – with most\
    \ male patients seeing the female counsellor. More likely of course, by chance,\
    \ we would expect them to be distributed quite evenly across the sexes. The question\
    \ is: how much of an unequal distribution across the sexes does there have to\
    \ be for us to conclude that there was a significant bias for male patients to\
    \ see a male counsellor and vice versa? Or, to put it another way: how much of\
    \ an unequal distribution across the sexes does there have to be for us to *reject\
    \ the possibility that this has occurred by chance?* This is where a statistical\
    \ test comes in handy.\n\n    Chi-square (represented as χ²) applies a statistical\
    \ test to cross-tabulation by comparing the actual *observed* frequencies in each\
    \ cell of tables with *expected* frequencies. Expected frequencies are those we\
    \ would expect if data is ‘randomly distributed’.\n\n    64 Page 64 \n\n    It\
    \ may help at this point to think of the four cells in the cross-tabulation table\
    \ as buckets. Now imagine a lottery machine designed to pump balls into each of\
    \ the buckets through four pipes – one leading into each bucket. If the distribution\
    \ of balls by the lottery machine is truly random, then we would expect a similar\
    \ number of balls in each bucket. Thus, if the lottery machine was set up to distribute\
    \ 200 balls we would expect roughly 50 balls in each of the four buckets.\n\n\
    \    So, using the hypothetical data in [Table 4.4](#09_Chapter04.xhtml#tab4-4)\
    \ we can see that there is no difference across male/female patients and counsellor.\
    \ The actual observed counts match the expected counts.^()\n\n    **Table 4.4**Group/counsellor\
    \ cross-tabulation with no difference across males/females (hypothetical data)\n\
    \n    | Group \\* counsellor Crosstabulation  |\n\n    | --- |\n\n    |  || counsellor\
    \ || Total |\n\n    | --- | --- | --- |\n\n    | John || Jane |\n\n    | Group\
    \ || male || CountExpected Count || 5050.0 || 5050.0 || 100100.0 |\n\n    |  ||\
    \ female || CountExpected Count || 5050.0 || 5050.0 || 100100.0 |\n\n    | Total\
    \ ||  || CountExpected Count || 100100.0 || 100100.0 || 200200.0 |\n\n    A table\
    \ titled group counselor crosstabulation lists the count and expected count for\
    \ male and female groups, and total values in column 1. Columns 2 and 3 list the\
    \ corresponding values for counselors, including John and Jane, and total, respectively.\n\
    \n    In [Table 4.5](#09_Chapter04.xhtml#tab4-5) we have the opposite scenario:\
    \ all the males saw John, whereas all the females saw Jane. Notice that the *expected*\
    \ frequencies remain the same – 50 in each cell. The divergence from expected\
    \ frequencies would strongly suggest that there is a relationship between sex\
    \ of the patient and the counsellor they saw: we have *50 more male patients than\
    \ expected* seeing John (and 50 less than expected seeing Jane); and *50 more\
    \ female patients than expected* seeing Jane (and 50 less than expected seeing\
    \ John).\n\n    **Table 4.5**Group/counsellor cross-tabulation with a large difference\
    \ across males/females (hypothetical data)\n\n    | Group \\* counsellor Crosstabulation\
    \ |\n\n    | --- |\n\n    |  || counsellor || Total |\n\n    | --- | --- | ---\
    \ |\n\n    | John || Jane |\n\n    | Group || male || CountExpected Count || 10050.0\
    \ || 050.0 || 100100.0 |\n\n    |  || female || CountExpected Count || 050.0 ||\
    \ 10050.0 || 100100.0 |\n\n    | Total ||  || CountExpected Count || 100100.0\
    \ || 100100.0 || 200200.0 |\n\n    A table titled group counselor crosstabulation\
    \ lists the count and expected count for male and female groups, and total values\
    \ in column 1. Columns 2 and 3 list the corresponding values for counselors, including\
    \ John and Jane, and total, respectively.\n\n    65 Page 65 "
