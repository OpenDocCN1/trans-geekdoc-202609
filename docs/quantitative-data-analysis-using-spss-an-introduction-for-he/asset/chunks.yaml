- raw: "    The dialog box for Sort Cases features a list of variables with a selected\
    \ option for sex on the left. A blank input field for sorting is on the right,\
    \ with a selected ascending order option for sorting order. There are reset, cancel,\
    \ and help buttons on the right, with disabled buttons for OK and paste on top.\
    \ The main panel in the backdrop features the dataset for numbered patients.\n\
    \n    [Navigate back to the page.](#07_Chapter02.xhtml#rl_ufig2-14)\n\n    # Page\
    \ 30 Text Alternative (Chapter 2)\n\n    [Navigate back to the page.](#07_Chapter02.xhtml#rl_ufig2-15)\n\
    \n    ![](Images/p30-2.jpg)\n\n    The dialog box for Sort Cases features a list\
    \ of variables with a selected option for sex on the left. An input field for\
    \ sorting is on the right, with input, sex- ascending. The select options for\
    \ ascending and descending sorting order are given below. There are OK, paste,\
    \ reset, cancel, and help buttons on the right. The main panel in the backdrop\
    \ features the dataset for numbered patients.\n\n    [Navigate back to the page.](#07_Chapter02.xhtml#rl_ufig2-15)\n\
    \n    # Page 31 Text Alternative (Chapter 2)\n\n    [Navigate back to the page.](#07_Chapter02.xhtml#rl_ufig2-16)\n\
    \n    ![](Images/p31-1.jpg)\n\n    The column headers include variables such as\
    \ patient, sex, age, counselor, sessions, and satisfaction. The table provides\
    \ data for patients numbered 1 to 30 on the Data View tab. The dataset is sorted\
    \ in ascending age order.\n\n    [Navigate back to the page.](#07_Chapter02.xhtml#rl_ufig2-16)\n\
    \n    # Figure 3.1 Text Alternative (Chapter 3)\n\n    [Navigate back to the page.](#08_Chapter03.xhtml#rl_fig3-1)\n\
    \n    ![](Images/fig3-1.jpg)\n\n    The horizontal axis represents the counselors,\
    \ and the vertical axis represents the mean sessions ranging between 0 and 10\
    \ in increments of 2 units. The data is as follows. For John, 8.5. For Jane, 6.\
    \ Values are estimated.\n\n    [Navigate back to the page.](#08_Chapter03.xhtml#rl_fig3-1)\n\
    \n    # Figure 3.2 Text Alternative (Chapter 3)\n\n    [Navigate back to the page.](#08_Chapter03.xhtml#rl_fig3-2)\n\
    \n    ![](Images/fig3-2.jpg)\n\n    The horizontal axis represents age, ranging\
    \ from 20 to 50 in increments of 5 units. The vertical axis represents the frequency,\
    \ ranging from 0 to 8 in increments of 2 units. The data is as follows. (20 to\
    \ 25, 3), (25 to 30, 4), (30 to 35, 6), (35 to 40, 8), (40 to 45, 6), and (45\
    \ to 50, 3). Values are estimated. Text on the right reads as follows. Mean =\
    \ 35.20. Standard deviation = 7.4110. N = 30.\n\n    [Navigate back to the page.](#08_Chapter03.xhtml#rl_fig3-2)\n\
    \n    # Figure 3.3 Text Alternative (Chapter 3)\n\n    [Navigate back to the page.](#08_Chapter03.xhtml#rl_fig3-3)\n\
    \n    ![](Images/fig3-3.jpg)\n\n    The horizontal axis represents age, ranging\
    \ from 20 to 50 in increments of 5 units. The vertical axis represents the frequency,\
    \ ranging from 0 to 8 in increments of 2 units. The data is as follows. (20 to\
    \ 25, 3), (25 to 30, 4), (30 to 35, 6), (35 to 40, 8), (40 to 45, 6), and (45\
    \ to 50, 3). Values are estimated.\n\n    [Navigate back to the page.](#08_Chapter03.xhtml#rl_fig3-3)\n\
    \n    # Figure 3.4 Text Alternative (Chapter 3)\n\n    [Navigate back to the page.](#08_Chapter03.xhtml#rl_fig3-4)\n\
    \n    ![](Images/fig3-4.jpg)\n\n    The horizontal axis represents the sex, and\
    \ the vertical axis represents the age, ranging between 0 and 50 in increments\
    \ of 10 units. The data is as follows. For males, the minimum, first quartile,\
    \ median, third quartile, and maximum values are 20, 25, 33, 36, and 44. For females,\
    \ the minimum, first quartile, median, third quartile, and maximum values are\
    \ 27, 36, 38, 42, and 48. Values are estimated.\n\n    [Navigate back to the page.](#08_Chapter03.xhtml#rl_fig3-4)\n\
    \n    # Figure 3.5 Text Alternative (Chapter 3)\n\n    [Navigate back to the page.](#08_Chapter03.xhtml#rl_fig3-5)\n\
    \n    ![](Images/fig3-5.jpg)\n\n    The box plot has a central shaded area with\
    \ a central line indicating the median value. The shaded portion indicates the\
    \ middle 50% of values. The box has extended bars at the top and bottom, indicating\
    \ the top 25% and bottom 25% of values, respectively. A circle and a star at the\
    \ bottom plotted sequentially below the box indicate the outlier and an extreme\
    \ case, respectively. The outlier is more than 1.5 box lengths below the box.\
    \ The accompanying number, 19, refers to the S P S S case. The extreme case is\
    \ more than 3 box-lengths below. The accompanying number, 24, refers to the S\
    \ P S S case.\n\n    [Navigate back to the page.](#08_Chapter03.xhtml#rl_fig3-5)\n\
    \n    # Page 34 Text Alternative (Chapter 3)\n\n    [Navigate back to the page.](#08_Chapter03.xhtml#rl_ufig3-1)\n\
    \n    ![](Images/p34-1.jpg)\n\n    The option for frequencies in the expanded\
    \ drop-down menu for descriptive statistics is selected on the expanded menu for\
    \ analyze listed on the menu bar at the top. The main panel in the backdrop features\
    \ the data set for numbered patients.\n\n    [Navigate back to the page.](#08_Chapter03.xhtml#rl_ufig3-1)\n\
    \n    # Page 34 Text Alternative (Chapter 3)\n\n    [Navigate back to the page.](#08_Chapter03.xhtml#rl_ufig3-2)\n\
    \n    ![](Images/p34-2.jpg)\n\n    The dialog box for Frequencies features a list\
    \ of variables on the left. An input field for variables on the right has an input,\
    \ sex. A checked checkbox at the bottom is for displaying frequency tables. There\
    \ are buttons for statistics, charts, and formats at the bottom. There are OK,\
