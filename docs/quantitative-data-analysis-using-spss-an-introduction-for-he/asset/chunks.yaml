- raw: "    Conduct correlations for (a) age and number of sessions; and (b) age and\
    \ satisfaction with the service. Remember to produce a scatterplot for the data\
    \ before running the Pearson correlation. What do the results show in terms of\
    \ (a) the strength and direction of any correlations; and (b) the statistical\
    \ significance of the results?\n\n    #### Answers\n\n    ![Figure X5.1aCorrelations\
    \ for age and number of sessions](Images/figX5-1a.jpg)\n\n    **Figure X5.1a**Correlations\
    \ for age and number of sessions\n\n    **Table X5.1a**Correlations for age and\
    \ number of sessions\n\n    | Correlations  |\n\n    | --- |\n\n    |  || age\
    \ || sessions |\n\n    | age || Pearson Correlation || 1 || \\-.285 |\n\n    |\
    \  || Sig. (2-tailed) ||  || .127 |\n\n    |  || N || 30 || 30 |\n\n    | sessions\
    \ || Pearson Correlation || \\-.285 || 1 |\n\n    |  || Sig. (2-tailed) || .127\
    \ ||  |\n\n    |  || N || 30 || 30 |\n\n    A table titled Correlations lists\
    \ the age variables and sessions variables for Pearson correlation, 2-tailed significance\
    \ values, and N value, in column 1. Columns 2 and 3 list the corresponding age\
    \ and sessions values.\n\n    From the scatterplot we can see that there appears\
    \ to be a slight negative relationship between age and the number of sessions.\
    \ This is supported by the Pearson product moment correlation coefficient which\
    \ found a slight negative correlation, although this was not statistically significant:\
    \ r = −.28, p = .127.\n\n    122 Page 122\n\n    ![Figure X5.1bCorrelations for\
    \ age and satisfaction with the service](Images/figX5-1b.jpg)\n\n    **Figure\
    \ X5.1b**Correlations for age and satisfaction with the service\n\n    **Table\
    \ X5.1b**Correlations for age and satisfaction with the service\n\n    | Correlations\
    \ |\n\n    | --- |\n\n    |  || age || sessions |\n\n    | age || Pearson Correlation\
    \ || 1 || \\-.234 |\n\n    |  || Sig. (2-tailed) ||  || .214 |\n\n    |  || N\
    \ || 30 || 30 |\n\n    | sessions || Pearson Correlation || \\-.234 || 1 |\n\n\
    \    |  || Sig. (2-tailed) || .214 ||  |\n\n    |  || N || 30 || 30 |\n\n    A\
    \ table titled Correlations lists the age variables and satisfaction variables\
    \ for Pearson correlation, 2-tailed significance values, and N value, in column\
    \ 1. Columns 2 and 3 list the corresponding age and satisfaction values.\n\n \
    \   From the scatterplot we can see that there appears to be a slight negative\
    \ correlation between age and level of satisfaction. This is supported by the\
    \ Pearson product moment correlation coefficient which found a slight negative\
    \ relationship, but this was not statistically significant: r = −.23, p = .214.\n\
    \n    Note: In SPSS v15 you may need to use Chart Editor to change the Y-axis\
    \ scale in order to provide a 5 per cent lower margin for the lower values.\n\n\
    \    ### Exercise 5.2 The importance of sample sizes in correlation\n\n    Sample\
    \ sizes can have a profound effect on statistical significance. Try running the\
    \ Pearson correlation between *age* and *number of sessions* again, but this time\
    \ with double the number of cases for each of these variables.\n\n    Highlight\
    \ the 30 cases for **age,** right-click the mouse button and copy, then move your\
    \ cursor to the end of the data column for **age** (row 31) and paste 123 Page\
    \ 123in the data you have copied. So you have the same data but double the number\
    \ of cases. Next, follow the same procedure for **sessions.** Then run the Pearson\
    \ correlation on the 60 cases for ages and sessions.\n\n    #### Answers\n\n \
    \   When you run the Pearson correlation for these 60 cases for age and number\
    \ of sessions this should produce the following output table:\n\n    **Table X5.2**Correlations\n\
    \n    | Correlations  |\n\n    | --- |\n\n    |  || age || sessions |\n\n    |\
    \ age || Pearson Correlation || 1 || \\-.285 |\n\n    |  || Sig. (2-tailed) ||\
    \  || .028 |\n\n    |  || N || 60 || 60 |\n\n    | sessions || Pearson Correlation\
    \ || \\-.285 || 1 |\n\n    |  || Sig. (2-tailed) || .028 ||  |\n\n    |  || N\
    \ || 60 || 60 |\n\n    A table titled Correlations lists the age variables and\
    \ sessions variables for Pearson correlation, 2-tailed significance values, and\
    \ N value, in column 1. Columns 2 and 3 list the corresponding age and sessions\
    \ values.\n\n    [\\*](#14_Bm02.xhtml#tfn1)· Correlation is significant at the\
    \ 0.05 level (2-tailed).\n\n    Although the level of correlation remains the\
    \ same as before (in exercise 5.1(a)) when there were only 30 cases, the result\
    \ is now statistically significant: r = −.285, p = 0.028.\n\n    This is because\
    \ obtaining statistical significance is to some extent dependent on sample size:\
    \ larger samples are more likely to produce statistically significant results\
    \ than smaller samples. This is particularly the case in correlation statistics\
    \ where you might find that two variables from a small sample (e.g., less than\
    \ 20) are strongly correlated – but the result is not statistically significant.\
    \ Conversely, with a very large sample, it is possible to obtain significant results\
    \ for very weak correlations. As Bryman and Cramer (2001: 176) point out, if you\
    \ have approximately 500 cases, *r* only needs to be 0.088 to be significant at\
    \ the 0.05 level, but with only 18 cases *r* will need to be at least 0.468.\n\
    \n    It is of course one thing to find a statistically significant result, and\
    \ another to find a meaningful result. This is relevant to our correlation between\
    \ age and number of sessions for two reasons: (1) a correlation of −.285 suggests\
    \ (if you square it) that 8.1 per cent of the variance in sessions is accounted\
    \ for by age. Well, that is not much! It may be significant but it is not very\
    \ meaningful; (2) even if the result did suggest that younger patients attended\
    \ for more sessions, so what? This information *could* have some relevance, in\
    \ certain circumstances, but the reason for conducting any analyses, and certainly\
    \ if you are including them in a final report, needs to be justified, otherwise\
    \ it becomes a list of meaningless analyses for the sake of it.\n\n    124 Page\
    \ 124\n\n    ### Exercise 5.3 The importance of ‘outliers’ in correlation\n\n\
    \    There is another reason why you should always produce a scatterplot of the\
    \ data if you are looking for correlations: to identify outliers – any data points\
    \ that are out on their own away from the main cluster. These can have a significant\
    \ influence on any correlation statistics.\n\n    Have a look at the scatterplot\
    \ for *age* and *satisfaction* again (you should have produced it for Exercise\
    \ 5.1b). Are there any outliers? Imagine trying to draw an oval, fat cigar shape\
    \ around the dots in the scatterplot to discern a negative correlation – is there\
    \ one dot in particular that falls outside your oval shape? If so, identify the\
    \ case number, remove it from your dataset (values for age and satisfaction),\
    \ and run the Pearson correlation again.\n\n    #### Answers\n\n    I have reproduced\
    \ the graph below with my oval, fat cigar shape superimposed to indicate a more\
    \ discernible negative correlation, and the possible outlier’ (top right):\n\n\
    \    ![Figure X5.3aScatterplot for age and satisfaction](Images/figX5-3a.jpg)\n\
    \n    **Figure X5.3a**Scatterplot for age and satisfaction\n\n    The next step\
    \ is to identify the outlier in our SPSS database. We can see that this is one\
    \ of only two cases indicating a satisfaction rating of 7, and the age is about\
    \ 47. Looking through the dataset we can identify this as case 20. Remove the\
    \ values 7 (satisfaction rating) and 47 (age) for this case and run the Pearson\
    \ correlation again. This should produce the output table below where we can see\
    \ that the strength of the negative correlation is now −.377 (previously −.234)\
    \ and is actually significant: p = .044.\n\n    125 Page 125 \n\n    **Table X5.3a**Correlations\n\
    \n    | Correlations  |\n\n    | --- |\n\n    |  || age || sessions |\n\n    |\
    \ age || Pearson Correlation || 1 || \\-.377 |\n\n    |  || Sig. (2-tailed) ||\
    \  || .044 |\n\n    |  || N || 29 || 29 |\n\n    | sessions || Pearson Correlation\
    \ || \\-.377 || 1 |\n\n    |  || Sig. (2-tailed) || .044 ||  |\n\n    |  || N\
    \ || 29 || 29 |"
