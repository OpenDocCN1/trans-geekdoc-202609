    \ the patient saw a counsellor of the same sex or not. Then you can use this new\
    \ variable as an independent (grouping) variable to compare the mean satisfaction\
    \ ratings between the two groups.\n\n#### Answers\n\n1.  1From the menu at the\
    \ top of the screen go to **Transform/Compute Variable.**\n\n2.  2In the **Target\
    \ Variable** box enter a name for the new variable you are going to create. I\
    \ have chosen the name **‘samesex’.**\n\n3.  3In the box **Numeric Expression**\
    \ write in the rule you will need for the new variable to record whether the patient\
    \ saw a counsellor of the same sex or not.\n\n    In our data a male patient is\
    \ coded as 1 and the male counsellor (John) is also coded as 1. Similarly, a female\
    \ patient and the female counsellor (Jane) are both coded as 2. So, we need to\
    \ select those cases where the *number* in the sex variable is the *same* as the\
