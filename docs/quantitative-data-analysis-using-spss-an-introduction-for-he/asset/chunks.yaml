- raw: "    4.  4There are various ways to compute this, but the simplest is to enter:\
    \ **sex = counsellor** in the **Numeric Expression** box.^()\n\n    5.  5Click\
    \ **OK** and your new variable (**samesex**) will appear in the **Data View**\
    \ (I have removed decimal places):\n\n    ![Screenshot X6.2a](Images/sX6-2a.jpg)\n\
    \n    Screenshot X6.2a\n\n    ![Screenshot X6.2b](Images/sX6-2b.jpg)\n\n    Screenshot\
    \ X6.2b\n\n    Having checked a few cases to see that this rule actually did what\
    \ you wanted it to do, you can then compare satisfaction ratings for same-sex\
    \ and different sex patient–counsellor.\n\n    (You might also realize at this\
    \ point that it would have been simpler to do this without the Transform/Compute\
    \ facility; that is, by simply creating the new variable and inserting a 1 where\
    \ you can see that the counsellor and patient were of the same sex and a zero\
    \ where they were not!)\n\n    Below I have conducted an independent t-test on\
    \ the two groups, which shows no significant differences, but really the numbers\
    \ are too small in the different sex patient counsellor group to conduct any significant\
    \ analyses (just eight patients compared to 22 in the same-sex patient–counsellor\
    \ group).\n\n    130 Page 130 \n\n    **Table X6.2b**Independent samples test\n\
    \n    | Group Statistics  |\n\n    | --- |\n\n    |  || samesex || N || Mean ||\
    \ Std. Deviation || Std. Error Mean |\n\n    | satisfaction || different sexsame\
    \ sex || 822 || 3.754.27 || 1.6691.549 || .590.330 |\n\n    A table titled group\
    \ statistics lists the satisfaction variables for different sexes and same sex\
    \ in column 1. Columns 2 to 5 list the corresponding N values, mean, standard\
    \ deviation, and standard error mean.\n\n    **Table X6.2b**Independent samples\
    \ test\n\n    | Independent Samples Test |\n\n    | --- |\n\n    |  || Levene’s\
    \ Test for Equality of Variances || t-test for Equality of Means |\n\n    | F\
    \ || Sig. || t || df || Sig. (2-tailed) || Mean Difference || Std. Error Difference\
    \ || 95% Confidence Interval of the Difference |\n\n    | Lower || Upper |\n\n\
    \    | satisfaction || Equal variances assumedEqual variances not assumed || .077\
    \ || .784 || \\-.802\\-.773 || 2811.687 || .430.455 || \\-.523\\-.523 || .652.676\
    \ || \\-1.859\\-2.000 || .813.955 |\n\n    A table titled independent samples\
    \ test lists the satisfaction variables for equal variances assumed and not assumed\
    \ in column 1. Columns 2 and 3 list the Levene's test for equality of variances,\
    \ including F and significance values, and the t-test for equality of means, including\
    \ t, degree of freedom, 2-tailed significance, mean difference, standard error\
    \ difference, and lower and upper bound 95% confidence interval of the difference.\n\
    \n    I have included this mainly as an academic exercise to illustrate the use\
    \ of the Transform/Compute facility, since there have been a few occasions when\
    \ students have needed to compute new values in their own data.\n\n    For example,\
    \ the *SF-36 Health Survey* questionnaire (Ware *et al*. 2000) consists of 36\
    \ questions measuring various dimensions of health status such as:\n\n    1. \
    \ 1Physical functioning (ten questions).\n\n    2.  2Mental health (five questions).\n\
    \n    3.  3Energy/vitality (four questions).\n\n    When analysing scales such\
    \ as this you would need to use the Transform/ Compute facility to compute a new\
    \ variable providing a mean score for the questions representing each dimension.\
    \ So, in the example below I have used Transform/Compute to calculate the mean\
    \ score from five mental health questions (mh1, mh2, etc.) which will then be\
    \ produced in a new variable called ‘mhmean’.\n\n    131 Page 131\n\n    ![Screenshot\
    \ X6.2c](Images/sX6-2c.jpg)\n\n    Screenshot X6.2c\n\n    ## Notes\n\n    1.\
    \  [1](#14_Bm02.xhtml#bm_fn1)Of course, pedantic students will note, as they frequently\
    \ do in my lectures, that if you are living in a country with a warm climate –\
    \ then you may have a positive correlation: fuel bills may rise for air conditioning\
    \ as temperature rises.\n\n    2.  [2](#14_Bm02.xhtml#bm_fn2)The two outliers\
    \ identified in the boxplots are merely the lowest and highest scores on the seven\
    \ point rating scale. In this respect the term ‘outlier’ may be deceptive with\
    \ relatively restricted scales, and it should be remembered that boxplots are\
    \ merely visual guides to the data (Howell 1997) that may, or may not, be instructive\
    \ in checking the data.\n\n    3.  [3](#14_Bm02.xhtml#bm_fn3)Other ways to do\
    \ this include: (1) using the not equal sign (~=) to select those cases where\
    \ the numbers were not the same (different sex patient–counsellor); (2) writing\
    \ out the rule in full: sex = 1 and counsellor = 1 or sex = 2 and counsellor =\
    \ 2; (3) writing the rule: sex + counsellor = 3.\n\n    132 Page 132 \n\n    #\
    \ Glossary\n\n    ANOVA\n\n    : Analysis of variance (ANalysis Of VAriance) –\
    \ a statistical technique normally used to examine differences between three or\
    \ more samples/group means (compared to, for example, the T-test which examines\
    \ differences for just two samples/group means). \n\n    categorical data\n\n\
    \    : This is data that represents different categories, rather than a scale,\
    \ e.g., sex of patients, ethnic background. \n\n    chi-square\n\n    : A statistical\
    \ test primarily associated with cross-tabulation to test for the ‘independence’\
    \ or ‘association’ between two categorical variables. \n\n    confidence intervals\n\
    \n    : Where a mean difference in two samples is observed, 95 per cent confidence\
    \ intervals provide lower and upper values around this mean difference with a\
    \ 95 per cent probability that the true difference lies within these parameters.\
    \ \n\n    confounding variables\n\n    : Essentially this refers to factors other\
    \ than those under investigation that may have influenced outcomes of an experiment.\
    \ More formally, these are variables other than the ‘treatment’ or ‘independent’\
    \ variable that may have affected the outcomes on the dependent variable. Sometimes\
    \ referred to as extraneous variables, i.e., variables which may have influenced\
