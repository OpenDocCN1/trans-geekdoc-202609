    \ they saw the male or female counsellor – that might be interesting in terms\
    \ of satisfaction ratings: perhaps one received higher ratings than the other?\
    \ He has also collected information about the number of counselling sessions conducted\
    \ for each patient because, he tells you in the letter, the counsellors are supposed\
    \ to offer ‘brief therapy’ averaging six sessions. Are they both abiding by this?\
    \ Finally, you see that patients were asked to rate their satisfaction with the\
    \ service on a seven point scale. Will the ratings depend on the sex or age of\
    \ the patient? Perhaps they would be related to the number of counselling sessions\
    \ or, as noted above, which particular counsellor the patient saw.\n\nWell, you\
    \ think, that is not too bad – at least it is simple. But what sorts of analysis\
