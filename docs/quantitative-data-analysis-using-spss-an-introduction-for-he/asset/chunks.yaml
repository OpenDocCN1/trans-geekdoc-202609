    \ per cent”而非整体 per cent，即当存在缺失数据时。\n\n    *   如何为区间数据生成中心趋势度量（均值、中位数和众差），以及最小值和最大值。\n\
    \n    *   如何生成条形图、直方图和箱线图，以直观展示数据。\n\n    *   如何将 SPSS 输出复制到 Microsoft Word 文档中。\n\
    \n    *   如何在 SPSS Output Viewer 中导航。\n\n    您现在具备将数据导入 SPSS、对其进行编码，并为类别数据和区间数据生成基本描述性统计的技能。\n\
    \n    58 Page 58 \n\n    ## 3.5Ending the SPSS session\n\n    当您想要关闭 SPSS，只需前往\
    \ **File/Exit**。随后会提示您“保存 Output Viewer 的内容”。这将允许您将输出中的表格和图表另存为独立文件。随后，您会被提示保存数据文件。\n\
    \n    虽然保存数据文件非常重要，但保存包含表格和图表的输出文件可能相对次要。例如，您可能对打印分析结果感到满意，或者您可能已经将相关表格和图表复制到\
    \ Microsoft Word 文档中。只要已保存数据文件，根据您已完成的工作量，重新运行分析可能相对简单——当然，这也取决于您已经做了多少工作。\n\n\
