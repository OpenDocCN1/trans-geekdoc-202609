    \ to know what the categories represent. Alternatively, you might have labelled\
    \ the categories ‘low’, ‘medium’ and ‘high’ – but these labels are more ambiguous\
    \ than providing the actual ranges of each category.\n\n    2.  2Did you include\
    \ row percentages? Although the numbers are low in each category you should include\
    \ percentages, and they should be row percentages: some students include column\
    \ percentages which are not appropriate since we want to know the relative number\
    \ of sessions provided by each of the counsellors.\n\n    ### Exercise 4.2 Re-code\
    \ satisfaction ratings into categories\n\n    Re-code the data for satisfaction\
    \ ratings into categories representing ‘positive’, ‘negative’ and ‘neutral’ ratings.\
    \ Cross-tabulate this new variable with ‘counsellor’ then ‘sex’. What is the best\
    \ way to categorize satisfaction ratings into these categories? What do these\
    \ cross-tabulations show?\n\n    #### Answers\n\n    There have been a number\
    \ of occasions in the past when I have found it useful to re-code scales like\
    \ this into simpler categories for ease of interpretation. The first thing that\
    \ we should note is that our satisfaction scale goes from 1–7:\n\n    Not at all\
