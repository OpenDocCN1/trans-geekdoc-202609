    \ students on a course. If we were to just glance at the two bars it would appear\
    \ that there are at least three times as many full-time students as there are\
    \ part-time. But if you look at the Y-axis, you will see that there are actually\
    \ only twice as many: six part-time and 12 full-time. The problem here is that\
    \ the Y-axis starts at four.\n\nThe second problem is that the increments rise\
    \ at intervals of 0.5. Is it possible to have half a student? The Y-axis should\
    \ have been changed in the Chart Editor.\n\nAnd, third, although the graph is\
    \ numbered below (GRAPH 1), there is no title, for example, ‘Graph 1: Number of\
    \ students who are full-time and part-time’.\n\n108 Page 108 \n\n### Exhibit B\n\
    \n![](Images/ufig7-2.jpg)\n\n#### What’s wrong with this?\n\nThere are many things\
    \ wrong with this chart:\n\n1.  1The chart is not numbered – neither is there\
    \ a title.\n\n2.  2The Y-axis (height) has no label of the actual measurements\
    \ (centimetres).\n\n3.  3The Y-axis starts at 150cms. Is case 14 really four times\
    \ as tall as case 6?\n\n4.  4The height should be ordered from lowest to highest.\n\
    \nBut more generally, was it really necessary to produce a graph of each individual’s\
    \ height anyway?\n\n### Exhibit C\n\nsex\n\n|  ||  || Frequency || Percent ||\
    \ Valid Percent || Cumulative Percent |\n\n| --- | --- | --- | --- | --- | ---\
    \ |\n\n| Valid || male || 8 || 47.1 || 47.1 || 47.1 |\n\n|  || female || 9 ||\
    \ 52.9 || 52.9 || 100.0 |\n\n|  || Total || 17 || 100.0 || 100.0 ||  |\n\nA table\
    \ titled Sex lists the variables, including the valid males, females, and total\
    \ values in column 1. Columns 2 to 5 list the corresponding frequency, percentage,\
    \ valid percentage, and cumulative percentage values.\n\n109 Page 109 ![Figure\
    \ 1](Images/ufig7-3.jpg)\n\nFigure 1\n\n#### What’s wrong with this?\n\nAside\
    \ from the fact that neither a table nor a chart was really necessary to illustrate\
    \ the fact that there were eight males and nine females – there are a number of\
    \ other problems:\n\n1.  1Neither the table nor the pie chart has titles – they\
    \ are just labelled [Figure 1](#12_Chapter07.xhtml#fig1).\n\n2.  2Patterns rather\
    \ than shaded areas should be used in pie charts and bar charts since most reports\
    \ are published in black and white and the colour variations can become indistinguishable.\n\
    \n3.  3There are no numbers or percentages with the pie chart (though the table\
    \ does provide these).\n\n### Exhibit D\n\n![Figure 1](Images/ufig7-4.jpg)\n\n\
    Figure 1\n\n110 Page 110 \n\n#### What’s wrong with this?\n\nWell, first, a line\
    \ graph is inappropriate because it suggests continuous data rather than distinct\
    \ age categories. It should be a bar chart.\n\nSecond, for some reason the Y-axis\
    \ is at 0.5 intervals – there are no half-people!\n\nAnd, third, the chart has\
    \ no title – just ‘[Figure 1](#12_Chapter07.xhtml#fig1)’.\n\n### Exhibit E\n\n\
    #### Full-Part-time status\n\nThis bar graph illustrates the frequency distribution\
    \ of full-part-time status\n\nN=1 (6%) respondents work/study part-time\n\nN=16\
    \ (94%) respondents work/study full-time.\n\n![](Images/ufig7-5.jpg)\n\n#### What’s\
    \ wrong with this?\n\nAside from the questionable value of graphically representing\
    \ this data, look at the scale . . . What does it represent?!\n\n# Concluding\
    \ remarks\n\n111Page 111 \n\nMy primary aim in writing this book has been to provide\
    \ a relatively simple and accessible introduction to quantitative data analysis.\
    \ It is for this reason that I have taken a pragmatic approach which skips much\
    \ of the theoretical underpinnings of statistics in favour of practically conducting\
    \ the analysis. For those students who will be taking their studies further, I\
    \ would strongly recommend complementing this practical book with further reading\
    \ around the principles of statistical analysis. A little knowledge of statistics\
    \ can be a ‘dangerous’ thing, and this practical introduction to quantitative\
    \ data analysis has merely scraped the surface in terms of the underlying principles.\n\
    \nI have one final word of warning. Many students design research studies without\
    \ properly thinking through how they will analyse the data (I’ve done it myself\
    \ of course – and paid the price). My advice to students is always to keep the\
    \ design of your research study as simple as possible, and to stick to what you\
    \ know: that is, design the study around the tests you know how to use. If you\
    \ cannot do that then at least make sure you understand the test and the analyses\
    \ that you are considering by consulting the relevant text books. Do not make\
    \ the analyses an after-thought: design your study in haste, repent at leisure\
    \ . . .\n\nBut the good thing of course, is that having worked through this book\
    \ you now have the ability to understand and conduct what are probably the most\
    \ commonly used statistics in health and social studies. Have fun . . .\n\n112\
    \ Page 112 \n\n# Answers to the quiz and exercises\n\n## Chapter 1\n\n### Exercise\
    \ 1.1 Types of data\n\nWould the following variables yield interval or nominal/categorical\
    \ data?\n\n1.  (a)ethnic background;\n\n2.  (b)student assignment marks;\n\n3.\
    \  (c)level of education;\n\n4.  (d)patient satisfaction ratings on a 1–7 scale.\n\
    \n#### Answers\n\n1.  (a)This would be nominal/categorical data since any numbers\
    \ you assigned to the categories are arbitrary codes, e.g., Black–Caribbean (1);\
    \ Black–African (2); Indian (3); etc.\n\n2.  (b)Student assignment marks, provided\
    \ as percentages, are interval since they represent equal intervals on a 1–100\
    \ per cent scale.\n\n3.  (c)Levels of education would normally be considered as\
    \ ordinal since they represent different levels of education on a scale, e.g.,\
    \ Diploma (1); Degree (2); Masters (3); MPhil (4); PhD (5). If you were to assign\
    \ numbers to each of these categories, as I have done here, they would be more\
    \ than arbitrary codes with the implication that (2) is a higher level of academic\
    \ achievement than (1), and so on.\n\n4.  (d)Patient satisfaction ratings on a\
    \ 1–7 scale may be regarded as interval data since the scale is presented in equal\
    \ intervals (though strictly speaking, we should say that the rating scale is\
    \ at least ordinal and approximates interval data).\n\n### Exercise 1.2 Measures\
    \ of central tendency\n\nWhich do you imagine would be the most representative\
    \ measure of central tendency for the following data?\n\n1.  (a)number of days\
    \ for students to return overdue library books;\n\n2.  (b)IQ scores for a random\
    \ sample of the population;\n\n3.  (c)number of patients cured of migraine in\
    \ a year by an acupuncturist;\n\n4.  (d)number of counselling sessions attended\
    \ by patients.\n\n#### Answers\n\n1.  (a)Probably median – because most students\
    \ will return overdue books 113 Page 113within a few days – but some may not return\
    \ them for weeks, months or years!\n\n2.  (b)This should be the mean since IQ\
    \ scores should be normally distributed around a standardized mean of 100.\n\n\
    3.  (c)None – this is categorical data! You would simply count the frequencies.\n\
    \n4.  (d)Depends if the number of sessions were normally distributed (mean) or\
    \ distinctly skewed by a few patients (median).\n\n### Exercise 1.3 Correlation\n"
