- raw: "This has produced the frequencies analysis for the variable sex in the form\
    \ of an SPSS ‘pivot table’. The first column has the labels male and female in\
    \ it: if you had not entered value labels, instead of male there would be a 1,\
    \ and instead of female there would be a 2. The second column tells us that there\
    \ are 30 cases: 14 are male and 16 are female. The third column provides percentages.\n\
    \nThe fourth column – **Valid Percent** – calculates percentage *ignoring any\
    \ missing values.* Since there are no missing values here, valid per cent is the\
    \ same as actual per cent. But in the hypothetical example on the next page, I\
    \ have removed data for ten cases.\n\n36 Page 36 ![Screenshot 3.4](Images/p36-1.jpg)\n\
    \nScreenshot 3.4\n\nWhen we have missing data the values for *per cent* and *valid\
    \ per cent* are different. This is because the per cent column calculates percentages\
    \ for all the data – including missing data. So, in the output above, we have\
    \ ten males, ten females and ten missing data – each of which constitutes 33.3\
    \ per cent of the total data – 30 cases.\n\nValid per cent, however, ignores the\
    \ missing data (ten cases) and has calculated percentage based on a total of 20\
    \ cases. Thus, 20/10 = 50%. *If you have missing data this is the percentage figure\
    \ you should cite*.\n\nNote that you now have two SPSS windows in operation:\n\
    \n*   SPSS **Data Editor** (with data and variable views).\n\n*   **Output Viewer**.\n\
    \n37 Page 37 \n\nYou can switch between the two by clicking the tabs at the bottom\
    \ of your screen.\n\n![Screenshot 3.5](Images/p37-1.jpg)\n\nScreenshot 3.5\n\n\
    Now try running frequencies for the other categorical variable – **counsellor**\
    \ – to see how many patients they each treated.\n\nGo to the menu at the top of\
    \ the screen and click **Analyze** then **Descriptive Statistics** then **Frequencies.**\
    \ You should then remove the variable **sex** from the frequencies analysis box\
    \ by double-clicking it with the left mouse button. You can now run frequencies\
    \ for **counsellor,** which should result in the following output:\n\n38 Page\
    \ 38 ![Screenshot 3.6](Images/p38-1.jpg)\n\nScreenshot 3.6\n\nYou can in fact\
    \ run **Frequencies** for more than one variable at a time by moving them all\
    \ into the **Variables** box, as shown below:\n\n![Screenshot 3.7](Images/p38-2.jpg)\n\
    \nScreenshot 3.7\n\n## 3.2Measures of central tendency for interval variables\n\
    \nHaving examined frequencies for our categorical data, we now need to examine\
    \ our variables containing interval data: age, number of sessions and satisfaction\
    \ with the service.\n\nOur aim here is to obtain basic, descriptive information\
    \ about these variables. For example, we should want to know the age range of\
    \ patients attending for counselling and the mean (or median) age of our sample.\
    \ This is basic information that the doctor would want to know about the population’\
    \ attending for counselling. So, the information we are seeking is:\n\n39 Page\
    \ 39 \n\n1.  1What is the mean/median: \n\n    *   age of patients;\n\n    * \
    \  number of sessions;\n\n    *   satisfaction rating.\n\n2.  2What is the range\
    \ of values – from lowest to highest – for: \n\n    *   age of patients;\n\n \
    \   *   number of sessions;\n\n    *   satisfaction ratings.\n\nWe can obtain\
    \ this information by running **Frequencies** for age, sessions and satisfaction.\n\
    \n### Running frequencies for measures of central tendency\n\n1.  1From the menu\
    \ at the top of the screen click **Analyze,** then **Descriptive Statistics,**\
    \ then **Frequencies** (remove any existing variables from previous analyses by\
    \ double-clicking them to return them to the list).\n\n2.  2Double-click (left\
    \ mouse button) the variables **age, sessions** and **satisfaction** to move them\
    \ into the **Variables** box.\n\n3.  3Click **Statistics** and click in the boxes\
    \ next to mean, median, mode, and minimum and maximum. Then click **Continue**.\n\
    \n    ![Screenshot 3.8](Images/p39-1.jpg)\n\n    Screenshot 3.8\n\n4.  4De-select\
    \ **Display Frequency Tables** (otherwise you will get a table listing every age).\
    \ 40 Page 40\n\n    ![Screenshot 3.9](Images/p40-1.jpg)\n\n    Screenshot 3.9\n\
    \n5.  5Click OK, and this should produce the output table below:\n\n    **Table\
    \ 3.1**SPSS descriptive statistics\n\n    | StatisticsA table titled Statistics\
    \ lists the variables, including N valid and N missing, mean, median, mode, minimum,\
    \ and maximum value in column 1. Columns 2 to 4 list corresponding ages, sessions,\
    \ and satisfaction.This table provides us with information about the mean, median\
    \ and mode, and the lowest and highest values (range of scores) for our three\
    \ variables.Focusing on the variable ‘age’, we can see that mean age was 35.2\
    \ years and the median age was 35.5 years. Since these values for the mean and\
    \ the median are very similar this tells us that our data is not skewed towards\
    \ one end of the scale (as we discussed in detail in [Chapter 1](#06_Chapter01.xhtml)).\
    \ We can also see that ages ranged from 21 years to 49 years.The modal age (most\
    \ common actual age) is also provided (33 years), but note that SPSS tells us\
    \ that ‘multiple modes exist’ and that this is the smallest value. The most commonly\
    \ occurring age is not, of course, very useful for our data analysis.The modal\
    \ value may, however, be of more interest for the other two variables. So while\
    \ we know that the mean number of sessions is 7, it may also be interesting to\
    \ know that the modal number of sessions was actually 6 if the doctor 41 Page\
    \ 41or counselling service is recommending that most patients should be limited\
    \ to 6 sessions. Similarly, although we know that the mean satisfaction rating\
    \ is a relatively neutral 4, it may be useful to know that the modal rating is\
    \ also 4. The mean value of 4 could have come from data that was an average of\
    \ very low and very high ratings – indicating that patients were divided in their\
    \ perceptions of the service; a modal rating of 4 suggests that this is not the\
    \ case (though note of course that SPSS tells us that multiple modes exist).So,\
    \ in our report to the doctor, from the analyses we have so far conducted, we\
    \ can inform him about:\n\n    *   The frequencies or number of patients seen\
    \ by each of the counsellors, and their gender.\n\n    *   The mean/median age,\
    \ number of sessions and satisfaction rating, along with the range of values for\
    \ each of these variables.\n\n    This information would be an important first\
