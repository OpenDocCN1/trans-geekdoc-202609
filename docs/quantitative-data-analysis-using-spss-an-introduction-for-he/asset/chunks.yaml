    \ average of six sessions of ‘brief therapy’ compared to John who has been providing\
    \ an average of over eight sessions.\n\n### 3.3.2Histograms\n\nHistograms are\
    \ similar to bar charts but are designed to represent data along a continuum.\
    \ The age of patients is a good example.\n\n#### Using SPSS to produce a histogram\
    \ for age\n\n1. 1From the menu at the top of the screen click `Graphs`, then `Chart\
    \ Builder`.\n\n2. 2Select `Histogram` from the Gallery of Charts to reveal the\
    \ range of charts available.\n\n3. 3Drag the first histogram (top left) into the\
    \ preview area.\n\n4. 4From the variables list drag `age` into the X-axis.\n\n\
    ![Screenshot 3.13](img/p45-1.jpg)\n\nScreenshot 3.13\n\n5. 5Click `OK` and this\
    \ should produce the following histogram in the output viewer:46 Page 46\n\n![Figure\
    \ 3.2Histogram showing age distribution of patients](img/fig3-2.jpg)\n\n**Figure\
    \ 3.2**Histogram showing age distribution of patients\n\nFrom the histogram we\
    \ can see that the age of patients is ‘normally distributed’ with the majority\
    \ in the age range 30 years to 45 years, tailing off at the younger and older\
    \ ages.\n\nNote: the bars in the histogram are not separated by gaps – because\
    \ they represent data along a continuum – unlike the bars in the bar chart which\
    \ represent discrete categories.\n\n### 3.3.3Editing a chart\n\nYou may want to\
    \ edit the histogram for age. For example, you might want to edit the labels for\
    \ the X- (horizontal) and Y- (vertical) axis: perhaps ‘frequency’ should be changed\
    \ to ‘number’; and you might also want to add that age is in years. Also, to the\
    \ right-hand side of the graph there is information about the mean, standard deviation\
    \ (discussed later) and number of students, that you might want to remove.\n\n\
    To edit a chart you need to double-click it with your left mouse button. This\
    \ will open the `Chart Editor`.\n\n47 Page 47 ![Screenshot 3.14](img/p47-1.jpg)\n\
    \nScreenshot 3.14\n\nThere are various changes you can make once the Chart Editor\
