    \ of 1 unit. The data is as follows. The plots are scattered between points 159\
    \ and 186 along the horizontal axis and points 3 and 12 on the vertical axis.\
    \ The plots are patterned from bottom left to top right.\n\n    [Navigate back\
    \ to the page.](#06_Chapter01.xhtml#rl_fig1-4)\n\n    # Figure 1.5 Text Alternative\
