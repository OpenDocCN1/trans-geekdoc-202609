    \ (Chapter 1)\n\n    [Navigate back to the page.](#06_Chapter01.xhtml#rl_fig1-1)\n\
    \n    ![](Images/fig1-1.jpg)\n\n    Question 1 is for sex, with checkboxes on\
    \ the right for male and female. Question 2 is for age, with a blank provided\
    \ for the number of years. Question 3 is, which counselor did you see? The checkboxes\
    \ on the right provide options for John and Jane. Question 4 inquires about the\
    \ number of counseling sessions. The blank on the right is provided for a number.\
    \ Question 5 requires a response to the satisfaction with services. The accompanying\
    \ text at the bottom reads, Please indicate the extent to which you were satisfied\
    \ with the service on the following scale by circling the appropriate number.\
    \ The accompanying scale ranges between 1 and 7. 1 for not at all satisfied and\
    \ 7 for very satisfied.\n\n    [Navigate back to the page.](#06_Chapter01.xhtml#rl_fig1-1)\n\
    \n    # Figure 1.2 Text Alternative (Chapter 1)\n\n    [Navigate back to the page.](#06_Chapter01.xhtml#rl_fig1-2)\n\
    \n    ![](Images/fig1-2.jpg)\n\n    The horizontal axis represents the age of\
    \ shoppers at supermarket, ranging from 10 to 80 in increments of 10 units. The\
    \ vertical axis represents the number of shoppers, ranging from 0 to 10 in increments\
    \ of 2 units. The data is as follows. (10 to 20, 2), (20 to 30, 4), (30 to 40,\
    \ 7), (40 to 50, 7.8), (50 to 60, 5.8), (60 to 70, 2), and (70 to 80, 1). A curve\
    \ is plotted on top that indicates a roughly bell-shaped distribution. The median\
    \ and mean are indicated at 40 and 40.5 years, respectively. Values are estimated.\n\
    \n    [Navigate back to the page.](#06_Chapter01.xhtml#rl_fig1-2)\n\n    # Figure\
    \ 1.3 Text Alternative (Chapter 1)\n\n    [Navigate back to the page.](#06_Chapter01.xhtml#rl_fig1-3)\n\
    \n    ![](Images/fig1-3.jpg)\n\n    The horizontal axis of the graph represents\
    \ the employee salaries ranging from 0 to 80. The vertical axis represents the\
    \ number of employees and ranges from 0 to 20. The data is as follows. (0 to 20,\
    \ 16), (20 to 30, 6), (30 to 40, 3), (40 to 50, 1), (50 to 60, 1), (60 to 70,\
    \ 1), (70 to 80, 1), and (80 to 90, 1). An overlaid curve indicates a left-skewed\
    \ distribution curve. The median and mean values are plotted at 16 k and 26 k,\
    \ respectively.\n\n    [Navigate back to the page.](#06_Chapter01.xhtml#rl_fig1-3)\n\
    \n    # Figure 1.4 Text Alternative (Chapter 1)\n\n    [Navigate back to the page.](#06_Chapter01.xhtml#rl_fig1-4)\n\
    \n    ![](Images/fig1-4.jpg)\n\n    The horizontal axis of the graph represents\
