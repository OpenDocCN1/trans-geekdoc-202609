- raw: "    The coefficient of determination value also draws our attention to an\
    \ important issue in interpreting and comparing correlation values: a correlation\
    \ of 0.8 is not twice as strong as a correlation of 0.4. Thus if we calculate\
    \ the coefficient of determination values we find that a correlation of 0.4 indicates\
    \ that 16 per cent of the variance in one variable is accounted for by the other\
    \ variable, but a correlation of 0.8 indicates that 64 per cent of the variance\
    \ in one variable is accounted for by the other.\n\n    ## 5.3Summary\n\n    In\
    \ this chapter you have learnt how to:\n\n    *   Examine relationships between\
    \ two interval variables to see if they are positively or negatively correlated.84\
    \ Page 84\n\n    *   Produce scatterplots to graphically illustrate the relationship\
    \ between two variables.\n\n    *   Conduct the Pearson product-moment correlation\
    \ to examine the statistical strength and direction of a linear correlation.\n\
    \n    *   Interpret the strength of a correlation using the coefficient of determination.\n\
    \n    In the following exercises you will also learn about:\n\n    *   The importance\
    \ of sample sizes in correlation and obtaining statistically significant results.\n\
    \n    *   How outliers can have a significant influence on correlation statistics.\n\
    \n    *   The importance of distinguishing between correlation and cause.\n\n\
    \    ## 5.4Exercises\n\n    ### Exercise 5.1Produce scatterplots and correlations\
    \ for the other interval variables\n\n    Conduct correlations for (a) age and\
    \ number of sessions; and (b) age and satisfaction with the service. Remember\
    \ to produce a scatterplot for the data before running the Pearson correlation.\
    \ What do the results show in terms of (a) the strength and direction of any correlations;\
    \ and (b) the statistical significance of the results?\n\n    ### Exercise 5.2The\
    \ importance of sample sizes in correlation\n\n    Sample sizes can have a profound\
    \ effect on statistical significance. Try running the Pearson correlation between\
    \ *age* and *number of sessions* again, but this time with double the number of\
    \ cases for each of these variables.\n\n    Highlight the 30 cases for **age**,\
    \ right-click the mouse button and copy, then move your cursor to the end of the\
    \ data column for **age** (row 31) and paste in the data you have copied. So you\
    \ have the same data but double the number of cases. Next, follow the same procedure\
    \ for **sessions**. Then run the Pearson correlation on the 60 cases for age and\
    \ sessions.\n\n    ### Exercise 5.3The importance of ‘outliers’ in correlation\n\
    \n    There is another reason why you should always produce a scatterplot of the\
    \ data if you are looking for correlations: to identify outliers – any data points\
    \ that are out on their own away from the main cluster. These can have a significant\
    \ influence on any correlation statistics.\n\n    Have a look at the scatterplot\
    \ for *age* and *satisfaction* again (you should have produced it for Exercise\
    \ 5.1b). Are there any outliers? Imagine trying to draw an oval, fat cigar shape\
    \ around the dots in the scatterplot to discern a negative correlation – is there\
    \ one dot in particular that falls outside your oval shape? If so, identify the\
    \ case number, remove it from your dataset (values for age and satisfaction),\
    \ and run the Pearson correlation again.\n\n    85 Page 85 \n\n    ### Exercise\
    \ 5.4Explain the following correlations^()\n\n    1.  (a)It is reported that there\
    \ is a strong positive correlation between ice cream sales and crime rates. Do\
    \ we therefore conclude that ice cream causes crime?\n\n    2.  (b)It is reported\
    \ that there is a positive correlation between number of counselling sessions\
    \ and level of psychological well-being? Can we therefore conclude that counselling\
    \ works and more counselling works better?\n\n    3.  (c)Consumption of milk is\
    \ positively correlated to cancer. So does drinking milk cause cancer?\n\n   \
    \ 4.  (d)Studies have found a negative correlation between smoking and Alzheimer’s\
    \ dementia: the risk of getting Alzheimer’s dementia reduces with increased smoking\
    \ of cigarettes. Would you therefore recommend that people start smoking or increase\
    \ the number they smoke to prevent the onset of Alzheimer’s dementia?\n\n    ##\
    \ 5.5Notes\n\n    1.  [1](#10_Chapter05.xhtml#ch05fn1)The other options are to\
    \ use Kendall’s tau or Spearman’s test for correlations with ordinal level data.\n\
    \n    2.  [2](#10_Chapter05.xhtml#ch05fn2)And if you are wondering why it says\
    \ 2-tailed’, this will be explained in the next chapter.\n\n    3.  [3](#10_Chapter05.xhtml#ch05fn3)Exercise\
    \ 5.4(b) is taken from Watson *et al*. (2006). Exercises (c) and (d) are taken\
    \ from Coolidge (2006).\n\n    86 Page 86 \n\n    # Chapter6 Examining differences\
    \ between two sets of scores\n\n    In this chapter you will learn about tests\
    \ which tell us if there is a statistically significant difference between two\
    \ sets of scores. In so doing you will learn about independent and dependent variables,\
    \ parametric and non-parametric data, and independent and related samples.\n\n\
    \    ## 6.1Introduction\n\n    In this chapter we will look at statistical tests\
    \ which tell us if there is a significant difference between two sets of scores.\
    \ For example, this could be scores on an aptitude test comparing a sample of\
    \ *males* and *females*, or scores *before* and *after* some intervention, e.g.,\
    \ mental health scores before and after a course of therapy for a sample of patients.\n\
    \n    So, what differences between two sets of scores might we examine in our\
    \ counselling questionnaire? In order to think about this it is useful to categorize\
    \ variables into two kinds: *independent variables* and *dependent variables*\
    \ (as discussed in [Chapter 1](#06_Chapter01.xhtml)). For example, we might think\
    \ that satisfaction with the service is *dependent* on which counsellor the patient\
    \ saw, in which case we would have the following *independent* and *dependent\
    \ variables*:\n\n    *   *Independent variable*: counsellor (John or Jane).\n\n\
    \    *   *Dependent variable*: satisfaction rating.\n\n    In the counselling\
    \ questionnaire there are in fact only two possible independent variables – the\
    \ categorical variables *counsellor* and *sex*, and each has three possible dependent\
    \ variables, as listed below:\n\n    1.  1*Independent variable*: counsellor (John\
    \ or Jane): \n\n        *   *dependent variable*: satisfaction ratings;\n\n  \
    \      *   *dependent variable*: number of sessions;\n\n        *   *dependent\
    \ variable*: age of patients.\n\n    2.  2*Independent variable*: sex (male or\
    \ female): \n\n        *   *dependent variable*: satisfaction ratings;\n\n   \
    \     *   *dependent variable*: number of sessions;\n\n        *   *dependent\
    \ variable*: age of patients.\n\n    [Box 6:1](#11_Chapter06.xhtml#box6-1) provides\
    \ further discussion of independent and dependent variables in the context of\
    \ experimental studies.\n\n    87 Page 87 \n\n    Having identified our independent\
    \ and dependent variables, the next question is which differences do we wish to\
    \ examine? And the answer to that is, which do we think are the most relevant?\
    \ In my opinion we should start by comparing satisfaction ratings for the two\
    \ counsellors, and then the number of sessions provided by each of the counsellors,\
    \ since these might provide the most relevant information for the doctor who has\
    \ commissioned this analysis.\n\n    88 Page 88 \n\n    ## 6.2Comparing satisfaction\
    \ ratings for the two counsellors\n\n    In order to compare the satisfaction\
    \ ratings for the two counsellors we first need to choose the appropriate statistical\
    \ test. Statistical tests comparing scores between two samples (in our study,\
    \ satisfaction ratings for John vs satisfaction ratings for Jane) fall into two\
    \ categories depending on the type of data we have. [Figure 6.1](#11_Chapter06.xhtml#fig6-1)\
    \ illustrates the decision process for choosing the appropriate statistical test.\n\
    \n    ![Figure 6.1Choosing the appropriate statistical test for differences between\
    \ two samples](Images/fig6-1.jpg)"
