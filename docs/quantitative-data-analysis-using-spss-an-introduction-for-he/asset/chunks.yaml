- raw: "It may be particularly relevant for students and professionals in health and\
    \ social care, partly due to the subject matter (a patient satisfaction questionnaire\
    \ about counselling) and the examples used throughout the text, but also due to\
    \ the design of the materials. Many students and professionals in health and social\
    \ care are studying part-time or by distance learning, or perhaps undertaking\
    \ short courses in research methods. This means that their opportunities for attendance\
    \ are often limited and courses need to be designed to cater for this mode of\
    \ study, for example, attendance for one or two days at a time.\n\nIt is with\
    \ these students in mind that these materials should also be suitable for independent\
    \ study. After the introductory chapter outlining the types of data and analyses,\
    \ the book continues with step-by-step instructions for conducting the analysis\
    \ using SPSS. Furthermore, the practical approach should suit professionals who\
    \ may wish to develop their own proposals and conduct their own research but have\
    \ limited time to delve into the theoretical details of statistical principles.\n\
    \nIn health studies the emphasis on evidence-based practice has reinforced the\
    \ need for professionals to not only understand and critically appraise the research\
    \ evidence but also to conduct research in their own areas of practice. This book\
    \ should provide professionals with a basic knowledge of the principles of quantitative\
    \ research along with the means to actually design and conduct the analysis of\
    \ data using SPSS.\n\n## For lecturers\n\nThis book is an organized course divided\
    \ into six chapters/sessions which may be delivered as a combination of lectures\
    \ and practical sessions on SPSS. I have delivered this course in three ways:\n\
    \n1.  1First, as a series of five weekly lectures and practical sessions (two–three\
    \ hours) for the first half of a postgraduate module on quantitative and qualitative\
    \ data analysis.\n\n    The first session primarily consists of a lecture introducing\
    \ the questionnaire, the dataset and relevant analyses ([Chapter 1](#06_Chapter01.xhtml))\
    \ before moving on to enter the data ([Chapter 2](#07_Chapter02.xhtml)). Thereafter,\
    \ each of the remaining four sessions consists of an introductory lecture discussing\
    \ the analysis in subsequent chapters (descriptive statistics and graphs, cross-tabulation\
    \ and chi-square, 4 Page 4correlation, examining differences in two sets of scores)\
    \ before moving onto SPSS to conduct the analyses and exercises in each chapter.\
    \ In the final session I also include discussion of writing up the results and\
    \ reporting more generally ([Chapter 7](#12_Chapter07.xhtml)).\n\n    For a full\
    \ module of 10–11 sessions this book could either be supplemented by additional\
    \ materials covering more advanced analyses (e.g., ANOVA and regression analysis)\
    \ or students could design (and conduct) their own study (in groups) based upon\
    \ the analyses covered in the book.\n\n2.  2A one/two day course for a postgraduate\
    \ module on Research Methods. This starts with formal lecture introducing the\
    \ questionnaire, the dataset and relevant analyses ([Chapter 1](#06_Chapter01.xhtml)),\
    \ and then students (in pairs) work through the materials at their own pace, continuing\
    \ with independent study. The practical sessions may be interspersed with brief\
    \ lectures reviewing the types of analyses.\n\n3.  3A half-day workshop on SPSS.\
    \ Again, this begins with a brief introduction to the questionnaire, the dataset\
    \ and types of analyses, with guided instruction on specific exercises from each\
    \ of the chapters. Though it has to be said that a half day is not really sufficient\
    \ time to cover the materials (in my view, and according to the student evaluations!)\
    \ This is especially the case for students with little prior knowledge of statistics.\n\
    \nWhere an assignment has been set for the course, students have been asked to\
    \ produce a report for the doctor who requested the analysis. This requires students\
    \ to write a structured report in which the ‘most relevant analyses’ are presented\
    \ along with some discussion of the results, critical reflections on the survey\
    \ and recommendations for further research.\n\n## Getting a copy of SPSS\n\nSPSS,\
    \ as noted above, is the most widely used software for the statistical analysis\
    \ of quantitative data. It is available for use at most universities where staff\
    \ and students can usually purchase their own copy on CD for £10–£20. The licence,\
    \ which expires at the end of each year, can be renewed by contacting the supplier\
    \ at the university who will provide the necessary ‘authorization’ code.\n\n##\
    \ Acknowledgements\n\nThanks to all the students who have endured evolving versions\
    \ of this text, to the publishing people for coping with the numerous figures\
    \ and screenshots, and to Wendy Calvert (proof-reader extraordinaire).\n\n5 Page\
    \ 5 \n\n# Chapter1 A questionnaire and what to do with it: types of data and relevant\
    \ analyses\n\nThe aim of this chapter is to familiarize yourself with the questionnaire\
    \ and the types of analyses that may be conducted on the data before we go onto\
    \ SPSS. By the end of the chapter you should be familiar with: types of data and\
    \ levels of measurement; frequencies and cross-tabulation; measures of central\
    \ tendency; normal and skewed distributions of data; correlation and scatterplots;\
    \ independent and dependent variables.\n\n## 1.1The questionnaire\n\nA local general\
    \ practice (family practice or health centre for those outside the UK) has been\
    \ offering a counselling service to patients for over a year now. The doctor at\
    \ the practice refers patients to a counsellor if they are suffering from mild\
    \ to moderate mental health issues, like anxiety or depression.^()\n\nThe doctor\
    \ decided that he wanted to evaluate the service by gathering some information\
    \ about the patients referred for counselling and their satisfaction with the\
    \ service. So, he designed a brief questionnaire and sent it to every patient\
    \ who attended for counselling over the year. The doctor had referred 30 patients\
    \ to the service and was delighted to find that all 30 returned the questionnaire.\n\
