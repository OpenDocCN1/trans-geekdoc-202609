  trans: "\n一个名为“性别会话类别交叉表”的表格列出了性别变量，包括男性和女性的计数和百分比，以及总计值在列 1 中。列 2 和列 3 列出了相应的会话类别，分别是\
    \ 1-4、5-8 和 9-12，以及总计。\n\n这里我们可以看到，主要差异再次出现在 9-12 类别中：43%的男性参加了 9-12 次会话，而女性只有\
    \ 19%。当然，这可能仅仅反映了大多数男性患者看了约翰。或者，也许男性患者本身就需要更多的会话？无论原因如何，如果医生能够清晰地获得您提供的信息，他就可以在与两位辅导员讨论时进一步探讨这些结果的原因。\n\
    \n### 进行此练习的注意事项：\n\n1. 1 您是否包括了我所做的值标签——即将新类别标记为 1-4、5-8、9-12？学生常常忘记添加这些值标签，而这些标签是了解类别含义的必要条件。或者，您可能将类别标记为“低”、“中”和“高”——但这些标签比提供每个类别的实际范围更为模糊。\n\
    \n2. 2 您是否包括了行百分比？尽管每个类别的数值较低，但您仍应包括百分比，并且应为行百分比：一些学生包括列百分比，这在本情境中不合适，因为我们想了解每位辅导员提供的会话相对数量。\n\
    \n### 练习 4.2 将满意度评分重新编码为类别\n\n将满意度评分的数据重新编码为代表“积极”、“消极”和“中性”评分的类别。将此新变量与“辅导员”交叉，再与“性别”交叉。将满意度评分重新分类为这三个类别的最佳方法是什么？这些交叉表显示了什么？\n\
    \n#### 答案\n\n过去，我多次发现将像这样重新编码的量表转换为更简单的类别更有助于解释。我们首先需要注意的是，我们的满意度量表范围是 1-7：\n\n\
    不满意 1 2 3 4 5 6 7 非常满意\n\n如果您对咨询既不满意也不不满意，您会圈出什么数字？希望您和第 119 页的作者思维一致，您会圈出数字 4，因为它位于量表的正中间——两侧各有三个数字。因此，如果我们接受数字\
    \ 4 能代表对咨询的“中性”态度，那么其两侧的数字应代表“消极”或“积极”态度。因此，如果我在填写此评分表时，我会圈出数字 3 以表示轻度不满意，或圈出数字\
    \ 5 以表示轻度满意。\n\n基于此，我们可以按以下方式重新编码数值：\n\n1. 1 消极（不满意）：1-3。\n\n2. 2 中性（既不满意也不不满意）：4。\n\
    \n3. 3 积极（满意）：5-7。\n\n在您将满意度评分重新编码为这些类别（**转换/重新编码为不同变量**）并与辅导员交叉表后，您的表格应如下所示：\n\
    \n**表 X4.2b** 辅导员/满意度类别交叉表\n\n|  | 满意度类别 | 总计 |\n| --- | --- | --- |\n|  | 不满意\
    \ | 中性 | 满意 |\n| 辅导员 | John | 计数% | 17.1% | 428.6% | 964.3% | 14100.0% |\n|  |\
    \ Jane | 计数% | 850.0% | 425.0% | 425.0% | 16100.0% |\n| 总计 |  | 计数% | 930.0% |\
    \ 826.7% | 1343.3% | 30100.0% |\n\n一个名为“辅导员满意度类别交叉表”的表格列出了约翰和简的计数及其在辅导员内的百分比，以及总计值在列\
    \ 1。列 2 和列 3 列出了相应的满意度类别，即不满意、中性和满意，以及总计。\n\n解读这些交叉表的关键在于寻找主要差异——在这张表中非常明显。首先，看过约翰的患者中有\
    \ 64%是满意的，而简的患者中只有 25%是满意的。其次，50%的简的患者不满意，而约翰的患者中只有 7%不满意。\n\n虽然我们无法确定这些满意度水平的具体原因，但我们应进一步考虑可能影响这些结果的其他数据分析方面。例如，也许约翰之所以获得更高的满意度评分是因为他为患者提供了更多的会话？在第\
    \ 6 章（Chapter 6）中，我们将探讨用于检验该假设的检验方法。\n\n我们接下来应将满意度类别与患者的性别交叉，并生成以下表格：\n\n120 Page\
    \ 120 \n\n**表 X4.2c** 性别/满意度类别交叉表\n\n|  | 满意度类别 | 总计 |\n| --- | --- | --- |\n\
    |  | 不满意 | 男性 | 计数% | 214.3% | 428.6% | 857.1% | 14100.0% |\n|  | female | 计数%\
    \ | 743.8% | 425.0% | 531.3% | 16100.0% |\n| 总计 |  | 计数% | 930.0% | 826.7% | 1343.3%\
    \ | 30100.0% |\n\n一个名为“辅导员满意度类别交叉表”的表格列出了约翰和简的计数及其在辅导员内的百分比，以及总计值在列 1。列 2 和列 3\
    \ 列出了相应的满意度类别，即不满意、中性和满意，以及总计。\n\n这张交叉表显示，57%的男性患者是满意的，而女性患者中不足三分之一（31%）是满意的。此外，只有\
    \ 14%的男性患者不满意，而女性患者中有 44%不满意。\n\n当然，这个交叉表的问题在于它受到混杂因素的影响——大多数男性患者看了约翰（并且接受了更多的会话）。此时我们需要小心不要让医生面对过多的表格……\n"
