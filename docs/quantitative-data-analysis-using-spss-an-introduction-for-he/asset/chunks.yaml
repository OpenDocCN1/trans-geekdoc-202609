    \    : A correlation assesses the relationship between two continuous variables\
    \ to see if values on one variable vary in relation to the other, e.g., height\
    \ and weight. \n\n    cross-tabulation\n\n    : Where two or more variables are\
    \ presented in a table to compare relative frequencies across categories. \n\n\
    \    dependent variable\n\n    : A variable, the outcome of which is predicted\
    \ to be *dependent* on allocation to the treatment or independent variable; for\
    \ example, level of back pain (dependent variable) will depend on the type of\
    \ treatment a patient was allocated to by the researcher (e.g., physiotherapy\
    \ or acupuncture). \n\n    descriptive statistics\n\n    : Descriptive statistics\
    \ provide summary information about data, for example, describing the sample in\
    \ terms of age, gender and other characteristics. Measures of central tendency\
