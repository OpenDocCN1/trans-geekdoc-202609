    \ mental well-being, what do you consider is a minimally important clinical difference\
    \ on the scale to signal real improvement in mental health? If you agree that\
    \ it is a rise of ten points on the scale then that is the size of the effect\
    \ you are looking to detect.\n\n77 Page 77 \n\n# Chapter5 Correlation: examining\
    \ relationships between interval data\n\nIn this chapter you will learn about\
    \ scatterplots and correlation to examine the direction and strength of relationships\
    \ between variables.\n\n## 5.1Introduction\n\nIn [Chapter 1](#06_Chapter01.xhtml)\
    \ we briefly discussed the possibility of conducting correlation analysis on our\
    \ data. We saw that correlation describes the direction and strength of a relationship\
    \ between two interval variables (e.g., height and shoe size) and that the direction\
    \ can be positive or negative:\n\n* Positive correlation: an increase in values\
    \ for one variable is associated with an increase in values for the other variable,\
    \ for example, as height increases so does shoe size.\n\n* Negative correlation:\
    \ an increase in values for one variable is associated with a decrease in values\
    \ on another variable, for example, as temperature *reduces* the use of electricity\
    \ for heating *increases*.\n\nIn order to demonstrate this, scatterplots were\
    \ used to graphically illustrate the relationship between values for two variables.\
