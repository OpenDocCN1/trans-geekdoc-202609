- raw: "    The chart branches into independent samples and related samples, each\
    \ further branching into parametric and non-parametric data. An independent samples\
    \ t-test is conducted for parametric data for independent samples. The Mann-Whitney\
    \ test is conducted for non-parametric data for independent samples. A related\
    \ samples t-test is conducted on the parametric data for related samples. The\
    \ Wilcoxon test is conducted for non-parametric data for the related samples.\n\
    \n    [Navigate back to the page.](#11_Chapter06.xhtml#rl_fig6-1)\n\n    # Figure\
    \ 6.2 Text Alternative (Chapter 6)\n\n    [Navigate back to the page.](#11_Chapter06.xhtml#rl_fig6-2)\n\
    \n    ![](Images/fig6-2.jpg)\n\n    The first histogram plots satisfaction on\
    \ the horizontal axis, ranging between 0 and 8 in increments of 2 units. The left\
    \ vertical axis represents the frequency, ranging between 0 and 5 in increments\
    \ of 1 unit. The right vertical axis represents the counselor John. The data is\
    \ as follows. (2, 1), (4, 4), (5, 5), (6, 3), and (7, 1). An overlaid curve indicates\
    \ a bell-shaped distribution of data. The first histogram plots satisfaction on\
    \ the horizontal axis, ranging between 0 and 8 in increments of 2 units. The left\
    \ vertical axis represents the frequency, ranging between 0 and 5 in increments\
    \ of 1 unit. The right vertical axis represents the counselor Jane. The data is\
    \ as follows. (1, 2), (2, 2), (3, 4), (4, 4), (5, 3), and (7, 1). An overlaid\
    \ curve indicates a spread-out bell-shaped distribution of data. Values are estimated.\n\
    \n    [Navigate back to the page.](#11_Chapter06.xhtml#rl_fig6-2)\n\n    # Figure\
    \ 6.3 Text Alternative (Chapter 6)\n\n    [Navigate back to the page.](#11_Chapter06.xhtml#rl_fig6-3)\n\
    \n    ![](Images/fig6-3.jpg)\n\n    The horizontal axis represents the counselors,\
    \ and the vertical axis represents the satisfaction ratings, ranging between 1\
    \ and 7 in increments of 1 unit. The data is as follows. For John, the minimum,\
    \ first quartile, median, third quartile, and maximum values are 2, 4, 5, 6, and\
    \ 7. For Jane, the minimum, first quartile, median, third quartile, and maximum\
    \ values are 1, 2.5, 3.5, 4.5, and 7. Values are estimated.\n\n    [Navigate back\
    \ to the page.](#11_Chapter06.xhtml#rl_fig6-3)\n\n    # Figure 6.4 Text Alternative\
    \ (Chapter 6)\n\n    [Navigate back to the page.](#11_Chapter06.xhtml#rl_fig6-4)\n\
    \n    ![](Images/fig6-4.jpg)\n\n    The first histogram plots sessions on the\
    \ horizontal axis, ranging between 0 and 12 in increments of 2 units. The left\
    \ vertical axis represents the frequency, ranging between 0 and 5 in increments\
    \ of 1 unit. The right vertical axis represents the counselor John. The data is\
    \ as follows. (2 to 3, 1), (4.5 to 5.5, 1), (8 to 9, 5), (9 to 9.5, 2), (9.5 to\
    \ 10.5, 2), (10.5 to 11, 1), and (11 to 12, 2). An overlaid curve indicates a\
    \ spread-out bell-shaped distribution of data centred at point 9 on the horizontal\
    \ axis. The second histogram plots sessions on the horizontal axis, ranging between\
    \ 0 and 12 in increments of 2 units. The left vertical axis represents the frequency,\
    \ ranging between 0 and 5 in increments of 1 unit. The right vertical axis represents\
    \ the counselor Jane. The data is as follows. (2 to 3, 1), (3 to 4.5, 1), (4.5\
