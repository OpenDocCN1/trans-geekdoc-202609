- raw: "\n\n![](Images/Cover.jpg)\n\n![Cover: Quantitative Data Analysis Using SPSS:\
    \ An Introduction for Health & Social Science editedby Pete Greasley.](Images/Cover.jpg)\n\
    \niPage i \n\n# Quantitative Data Analysis Using SPSS\n\niiPage ii \n\niv Page\
    \ iv \n\nOpen University PressMcGraw-Hill EducationMcGraw-Hill HouseShoppenhangers\
    \ RoadMaidenheadBerkshireEnglandSL6 2QL\n\nemail: [enquiries@openup.co.uk](mailto:enquiries@openup.co.uk)world\
    \ wide web: [www.openup.co.uk](http://www.openup.co.uk)\n\nand Two Penn Plaza,\
