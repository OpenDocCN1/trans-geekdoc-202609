    \ table ([Table 6.2](#11_Chapter06.xhtml#tab6-2)) shows the number of students\
    \ in each category and the mean values, from which we can see that the mean score\
    \ for John was 4.86 compared to 3.50 for Jane.\n\n    94 Page 94 \n\n    The table\
    \ also provides us with the standard deviation of the scores for each group. This\
    \ is the average deviation from the mean for each group of scores – providing\
    \ a measure of the spread of the scores. Notice that the standard deviation of\
    \ satisfaction ratings for Jane is slightly larger than those for John. This is\
    \ graphically displayed in the boxplots (below) where we can see that the spread\
    \ of scores is slightly greater in the ratings for Jane.\n\n    ![Figure 6.3Boxplots\
    \ comparing satisfaction ratings for John and Jane](Images/fig6-3.jpg)\n\n   \
    \ **Figure 6.3**Boxplots comparing satisfaction ratings for John and Jane\n\n\
    \    So we can see that the satisfaction ratings were higher for patients who\
    \ went to see John, but is this a statistically significant difference?\n\n  \
    \  The independent samples test output table ([Table 6.3](#11_Chapter06.xhtml#tab6-3)),\
    \ first provides Levene’s test for equality of variances. Recall that ‘homogeneity\
    \ of variance’ was one of the assumptions required for using a parametric test\
    \ – so this is checking that the variance (spread of scores) within both groups\
    \ of scores (ratings for John and Jane) is relatively similar. Since the value\
    \ for this test is *not significant* (0.281 is larger than our significance level\
    \ of 0.05), this means we have not violated this assumption and we can proceed\
    \ by examining the first line of this table – equal variances assumed (violation\
    \ would mean citing the slightly more conservative bottom line of the table).\
    \ The column headed **Sig. (2-tailed)** tells us if the difference in the two\
    \ means is statistically significant (the difference in the two means (1.357)\
    \ being provided in the next column). Since this value is 0.015, and therefore\
    \ a smaller value than our conventional significance level of 0.05, we may conclude\
    \ that there was a significant difference in scores from the two groups. We might\
    \ write this up in a report thus:\n\n    > An independent samples t-test was used\
    \ to examine differences in satisfaction ratings for each of the counsellors.\
