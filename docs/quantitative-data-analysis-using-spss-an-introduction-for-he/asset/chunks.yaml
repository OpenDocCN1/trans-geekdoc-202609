    \ the menu at the top of the screen, click **Data**, then click **Sort Cases**.\n\
    \n![Screenshot 2.15](Images/p29-2.jpg)\n\nScreenshot 2.15\n\n30 Page 30 \n\n1.\
    \  2Click on the variable **sex**, then click the arrow (to the left of the Sort\
    \ by box) to move it into the **Sort by** box:\n\n![Screenshot 2.16](Images/p30-1.jpg)\n\
    \nScreenshot 2.16\n\n1.  3You can now click **OK** to sort your dataset by the\
    \ sex of the patient:\n\n![Screenshot 2.17](Images/p30-2.jpg)\n\nScreenshot 2.17\n\
    \n1.  4Your dataset is now re-ordered with all the male patients at the top (see\
    \ [Screenshot 2.18](#07_Chapter02.xhtml#sc2-18)).\n\n    Note: If you are working\
    \ in SPSS v15 an **Output Viewer** screen will appear logging the fact that you\
    \ have conducted a procedure in SPSS. Close this by clicking the cross in the\
    \ orange box to the top right of the **Output Viewer** screen. When it asks if\
    \ you want to save this, click **no**.\n\n31 Page 31 ![Screenshot 2.18](Images/p31-1.jpg)\n\
    \nScreenshot 2.18\n\n1.  5To get the data back into its original order, go back\
    \ to **Data/Sort Cases**. Double-click (left mouse button) on **Patient** to sort\
    \ the data back into its original order. (And note that we would not have been\
    \ able to do this if we had not numbered each patient/questionnaire.)\n\nYou can\
    \ actually sort by as many variables as you want – at the same time. For example,\
    \ you could sort the data by **sex** of patients *and* **age** by putting both\
    \ variables in the Sort by box, but really, I think we need to get on with the\
    \ analysis.\n\n## Notes\n\n1.  [1](#07_Chapter02.xhtml#ch2fn1a)This is an arbitrary\
    \ assignment of the numbers 1 and 2, and is not meant in any way to reflect the\
    \ order of importance of the male and female genders. I point this out because\
    \ one student did raise this issue (in class) and it was debated for some time.\
    \ . .\n\n2.  [2](#07_Chapter02.xhtml#ch2fn2a)You might make use of the **Label**\
    \ facility if you had a long questionnaire and you decided to label your variables\
    \ q1, q2, q3, etc. In the **Label** column you would provide a description of\
    \ each particular question. For example, if we took this approach for the counselling\
    \ questionnaire, the label for q4 32 Page 32would be ‘number of counselling sessions’\
    \ – and this label would appear in the output rather than ‘q4’ to help us identify\
    \ the particular question. This approach used to be more common in older versions\
    \ of SPSS when we were limited to eight characters in the variable column, so\
    \ truncated (barely identifiable) names often needed to be entered.\n\n3.  [3](#07_Chapter02.xhtml#ch2fn3a)As\
    \ an example, we might want to differentiate missing data due to a patient refusing\
    \ to answer a sensitive question, and missing data due to a question not being\
    \ applicable to a patient. In such cases we would need to click in the **Missing**\
    \ cell whereupon a button with three dots will appear to the right of the cell;\
    \ a dialogue box then appears where you can enter a value for the missing data.\
    \ The value you enter should be out of the range of values that may occur as part\
    \ of the data: 99 is a commonly used value to define missing data – though if\
    \ your variable may legitimately include that value (potentially age’ in our dataset)\
    \ you should choose a more remote number (999).\n\n4.  [4](#07_Chapter02.xhtml#ch2fn4a)And\
    \ make sure you know *where* you have saved it! There have been a few occasions\
    \ when students have saved the data file on the university network but were unable\
    \ to locate it for the next session. Also, if you *are* working on a university\
    \ or college computer you should also be aware that some computers are programmed\
    \ to ‘log out’ after a specified period if they are not being used; if you leave\
    \ the computer without saving the file, the data may not be there when you return\
    \ . . .\n\n5.  [5](#07_Chapter02.xhtml#ch2fn5a)Sorting the data can be useful\
    \ for a number of reasons. I recently found it useful for a questionnaire where\
    \ I needed to edit the dataset according to the month patients were referred to\
    \ a service. Sorting the cases according to month of referral made this much easier.\n\
    \n33 Page 33 \n\n# Chapter3 Descriptive statistics: frequencies, measures of central\
