    \ values in column 1. Columns 2 and 3 list the corresponding satisfaction categories,\
    \ of not satisfied, neutral, and satisfied, and total.\n\n    The main thing about\
    \ interpreting these cross-tabulation tables is to look for the key differences\
    \ – and they are pretty clear in this table. First, the majority of patients who\
    \ saw John (64%) were satisfied, compared to only a quarter (25%) of Jane’s patients.\
    \ Second, 50% of Jane’s patients were not satisfied, compared to only 7% of John’s\
    \ patients.\n\n    Although we cannot be certain as to the reasons for these levels\
    \ of satisfaction, we should go on to consider other aspects of the data analysis\
    \ that may throw some light on these results. For example, perhaps John received\
    \ higher satisfaction ratings because he provided more sessions for his patients?\
    \ In [Chapter 6](#11_Chapter06.xhtml) we look at a test to examine this hypothesis.\n\
    \n    We should then go on to cross-tabulate our satisfaction categories with\
