    \ button.\n\nFor example, in order to delete the information on the right of the\
    \ chart, I clicked the left mouse button once over this information, then I clicked\
    \ the right mouse button to produce the menu shown in [Screenshot 3.15](#08_Chapter03.xhtml#sc3-15).\
    \ I then moved down to **Delete** to remove this information. (A ‘Properties’\
    \ box appears in SPSS v15 informing you that the chart will be resized when elements\
    \ are added or removed – uncheck the box next to ‘Resize elements . . .’ and click\
    \ **Apply** then **Close** if you want the graph to remain the same size (or leave\
    \ it ticked if your prefer a wider graph).\n\n48 Page 48 ![Screenshot 3.15](Images/p48-1.jpg)\n\
    \nScreenshot 3.15\n\nTo edit the labels age’ and frequency’ click on them once\
    \ with the left mouse button to highlight them, and then click again (left mouse\
    \ button) to produce a flashing cursor; you can then re-write your own labels\
    \ in the text box.\n\n49 Page 49 ![Screenshot 3.16](Images/p49-1.jpg)\n\nScreenshot\
    \ 3.16\n\nFinally, I produced the following version of the histogram – having\
    \ edited the labels and removed the data to the right of the chart. Presentation\
    \ is very important for reports, so attention to details like this, rather than\
    \ just accepting what is produced by SPSS, can make a significant difference to\
    \ the quality of a report.\n\n50 Page 50 ![Figure 3.3Edited histogram showing\
    \ age distribution of patients](Images/fig3-3.jpg)\n\n**Figure 3.3**Edited histogram\
    \ showing age distribution of patients\n\nThere are numerous changes you can make\
    \ by clicking and double-clicking on the bits of the chart you are interesting\
    \ in changing and you should simply try them out yourself.\n\n### 3.3.4Boxplots\n\
    \nAnother useful way to illustrate the spread of the data is to use boxplots.\n\
    \n#### Using SPSS to produce boxplots for age and gender\n\n1. 1From the menu\
    \ at the top of the screen click `Graphs`, then `Chart Builder`.\n\n2. 2Select\
    \ `Boxplot` from the `Gallery of Charts` to reveal the range of boxplot charts\
    \ available.\n\n3. 3Drag the first boxplot (simple boxplot) into the preview area.\n\
    \n4. 4From the variables list drag `age` into the Y-axis and `sex` into the X-axis.\n\
    \n5. 5Click `OK`.\n\nThis should produce the following output: two boxplots illustrating\
    \ the distribution of age for male and females in the sample.\n\n51 Page 51 ![Figure\
    \ 3.4Boxplots illustrating age distribution of male and female patients](Images/fig3-4.jpg)\n\
    \n**Figure 3.4**Boxplots illustrating age distribution of male and female patients\n\
    \nThese boxplots illustrate the spread of the data:\n\n* the shaded box contains\
    \ the middle 50 per cent of values;\n\n* the line inside the box depicts the median\
    \ value (*not the mean*);\n\n* the T-bar lines above and below the box reach to\
    \ the highest and lowest values.\n\nSo, from these boxplots comparing the ages\
    \ of our males and females, we can see that the median age of females is higher\
    \ and, overall, the age ranges are higher. The spread of ages, indicated by the\
    \ size of the shaded boxes and the length of the T-bars, is roughly similar for\
    \ both groups.\n\n[Figure 3.5](#08_Chapter03.xhtml#fig3-5) provides a detailed\
    \ description of the information provided in boxplots. Notice the added inclusion\
    \ of outliers’ and extreme cases’ which often occur in large datasets. For example,\
    \ if 29 patients attended for between four and eight counselling sessions and\
    \ one attended for 12 sessions this might be considered an outlier’ or, more severely,\
    \ an extreme value’ because it deviates from the norm.\n\nThese cases deserve\
    \ special attention since they may skew any measures of central tendency. For\
    \ example, a couple of extremely high ages would have increased the mean value,\
    \ leaving the median the same. Outliers and extreme cases may also, of course,\
    \ simply indicate an error in data entry which often occurs in large datasets.\n\
    \n52 Page 52 ![Figure 3.5Understanding boxplots](Images/p48-1.jpg)\n\n**Figure\
    \ 3.5**Understanding boxplots\n\n### 3.3.5Copying charts and tables into a Microsoft\
    \ Word document\n\nIf you are producing a report of your data analysis it will\
    \ often be useful to copy the output from SPSS into a Microsoft Word document.\n\
    \nFor charts, like the boxplot above, you should first double-click the object\
    \ to open the `Chart Editor`. Then, from the menu at the top of the screen click\
    \ `Edit` and `Copy Chart`.\n\n53 Page 53 ![Screenshot 3.17](Images/p53-1.jpg)\n\
    \nScreenshot 3.17\n\nYou can then paste the chart into a Microsoft Word document\
    \ (obviously, you will first need to open a Word document).^()\n\nYou can copy\
    \ tables from the SPSS output file into a Word file by highlighting the table\
    \ (click left mouse button over **Table),** then click the right mouse button\
    \ on **Copy Objects,** and paste into the Word document.\n\n54 Page 54 ![Screenshot\
    \ 3.18](Images/p54-1.jpg)\n\nScreenshot 3.18\n\nIn the example above I chose the\
    \ option **Copy Objects** rather than **Copy.** If you copy the table as an object\
    \ you will not be able to edit the table when it is in the Microsoft Word document:\n\
    \n![Screenshot 3.19](Images/p54-2.jpg)\n\nScreenshot 3.19\n\nIf you do want to\
    \ edit a table you should choose **Copy**:\n\n55 Page 55 ![Screenshot 3.20](Images/p55-1.jpg)\n\
    \nScreenshot 3.20\n"
