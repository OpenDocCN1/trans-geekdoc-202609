    \ || 16100.0% |\n\n    | Total ||  || Count% within sex || 930.0% || 826.7% ||\
    \ 1343.3% || 30100.0% |\n\n    A table titled counselor satisfaction categories\
    \ crosstabulation lists the count and percentages within counselor for John and\
    \ Jane, and total values in column 1. Columns 2 and 3 list the corresponding satisfaction\
    \ categories, of not satisfied, neutral, and satisfied, and total.\n\n    This\
    \ cross-tabulation shows that the majority (57%) of male patients were satisfied\
    \ compared to less than a third (31%) of female patients. Furthermore, only 14\
    \ per cent of male patients were dissatisfied, compared to 44 per cent of female\
    \ patients.\n\n    But of course, the problem with this cross-tabulation is that\
    \ it is confounded by the fact that most male patients saw John (and had more\
    \ sessions). Perhaps at this point we need to be careful not to confuse the doctor\
    \ with too many tables. . . .\n\n    Notes on conducting this exercise:\n\n  \
    \  1.  1Aside from the importance of including row percentages, notice that I\
    \ have included descriptive value labels (‘not satisfied’, etc.) rather than the\
    \ actual ratings (1–3). This contradicts my advice in the previous exercise! However,\
    \ on this occasion I felt that these descriptive labels were more informative\
    \ than the numbers, but I would ensure that the ratings they represent, and the\
    \ rationale for the re-coding was made clear in the report to the doctor so that\
    \ he has all the information to decide for himself if this is a useful analysis\
    \ of the data.\n\n    2.  2Some people may have a problem with this re-coding\
    \ of the satisfaction scale since we cannot be certain that patients were responding\
    \ in the way we have categorized the data. If you do decide to re-code data in\
