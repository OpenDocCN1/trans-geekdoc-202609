    \ the mean rank for each of the two groups. So, for John we can see that the mean\
    \ ranking for his session is 20.61, but for Jane it is much lower at 11.03.\n\n\
    \    In the second table, the two values we are interested in are the Mann-Whitney\
    \ U (40.5) and the Exact Significance level (Exact sig. (2-tailed)) which is p\
    \ = 0.002. Since the probability (p value) of this result occurring by chance\
    \ is lower than our conventional significance level of 0.05, we conclude that\
    \ there is a significant difference in the number of sessions conducted by the\
    \ two counsellors.\n\n    We would write-up the results of this analysis, first,\
    \ by referring to the median number of counselling sessions conducted by the two\
    \ counsellors – because the median, as we learned in [Chapter 1](#06_Chapter01.xhtml),\
    \ is more appropriate where the data is not normally distributed.^()\n\n    >\
    \ When the number of sessions conducted by the two counsellors was examined it\
    \ was found that the median number of sessions conducted by John was 8.5 compared\
    \ to 6.0 for Jane. The Mann-Whitney Test found this difference to be statistically\
    \ significant: *U* = 40.5, p = .002.\n\n    100 Page 100 \n\n    This result might\
    \ then be related to the higher satisfaction ratings for John, in other words,\
    \ perhaps the higher satisfaction ratings related to the greater number of sessions\
    \ he conducted with his patients?\n\n    ## 6.4Summary\n\n    In this chapter\
    \ you have learnt about:\n\n    *   Independent and dependent variables.\n\n \
    \   *   Hypothesis testing (experimental and null hypotheses) and the importance\
    \ of considering confounding variables.\n\n    *   How to select the appropriate\
    \ statistical test for comparing differences between two sets of scores.101 Page\
    \ 101\n\n    *   The difference between independent samples and related samples,\
    \ and between parametric and non-parametric data.\n\n    *   How to produce histograms\
    \ to check for normal distributions and statistical ‘tests of normality’.\n\n\
    \    *   How to produce an Independent samples t-test and interpret the results\
    \ (including confidence intervals).\n\n    *   How to produce the Mann-Whitney\
    \ U test for non-parametric data.\n\n    In the following exercises you will also\
    \ learn:\n\n    *   How to compute a new variable from existing variables.\n\n\
    \    ## 6.5Exercises\n\n    ### Exercise 6.1Checking for other significant differences\n\
    \n    In this chapter we have concentrated on the differences in satisfaction\
    \ ratings and number of sessions for the two counsellors. You may now wish to\
    \ see if there were any significant differences in:\n\n    1.  (a)the age of patients\
    \ seen by the two counsellors;\n\n    2.  (b)satisfaction ratings from male and\
    \ female patients;\n\n    3.  (c)the number of sessions conducted for male and\
    \ female patients;\n\n    4.  (d)the age of the male and female patients.\n\n\
    \    Remember to check the distribution of the data in order to run the appropriate\
    \ analysis (i.e., parametric t-test or non-parametric Mann-Whitney U test).\n\n\
    \    ### Exercise 6.2Create a new variable to analyse same-sex satisfaction ratings\n\
    \n    In [Chapter 4](#09_Chapter04.xhtml), cross-tabulation revealed that the\
    \ majority of male patients (71%) saw John, while the majority of female patients\
    \ (75%) saw Jane. We noted that this might be important information for the doctor,\
    \ since this might suggest it is necessary to ensure a male and a female counsellor\
    \ are available to cater for patient preferences, that is, preference for same-sex\
    \ patient and counsellor.\n\n    Now, the curious among you might go on to wonder\
    \ if this has any bearing on the counselling relationship, for example: were satisfaction\
    \ ratings higher for same-sex patient–counsellor sessions compared to different-sex\
    \ patient–counsellor sessions?\n\n    So how would you investigate this? Here\
    \ is a clue: you will first need to create a new variable (using **Transform/Compute**)\
    \ which records whether the patient saw a counsellor of the same sex or not. Then\
    \ you can use this new variable as an independent (grouping) variable to compare\
    \ the mean satisfaction ratings between the two groups.\n\n    102 Page 102 \n\
    \n    ## 6.6Notes\n\n    1.  [1](#11_Chapter06.xhtml#ch06fn1)Less commonly, related\
    \ samples might be people who have been matched or paired on relevant criteria.\
    \ And SPSS actually uses the term ‘paired samples’ for t-tests, rather than ‘related\
    \ samples’. Other terms for related samples include ‘repeated measures’ and ‘dependent\
    \ samples’.\n\n    2.  [2](#11_Chapter06.xhtml#ch06fn2)While it is important to\
    \ orientate towards these assumptions, studies have shown that parametric tests\
    \ are actually quite robust to ‘moderate departures’ from these conditions (Howell\
    \ 1997; Bryman and Cramer 2001)."
