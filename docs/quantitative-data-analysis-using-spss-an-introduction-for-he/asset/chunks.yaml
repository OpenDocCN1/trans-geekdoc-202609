- raw: "    : This is data which takes the form of a scale in which the numbers go\
    \ from low to high in equal intervals. \n\n    Mann-Whitney test\n\n    : A non-parametric\
    \ statistical test to determine differences in two independent samples. \n\n \
    \   mean\n\n    : The arithmetic mean is the most common measure of central tendency\
    \ and is produced by calculating the sum of the values and then dividing by the\
    \ number of values. \n\n    measures of central tendency\n\n    : Measures of\
    \ central tendency are used to provide the typical or average values for a sample\
    \ of data, e.g., the mean age of the sample. The mean, median or mode may be used\
    \ depending on the distribution of the data. \n\n    median\n\n    : A measure\
    \ of central tendency which is the midpoint of an ordered distribution of values.\
    \ \n\n    mode\n\n    : A measure of central tendency referring to the most frequently\
    \ occurring value in a set of scores. \n\n    nominal data\n\n    : This is another\
    \ term for categorical data, whereby discrete categories may be nominated a numerical\
    \ code, e.g., code male as 1 and female as 2. \n\n    non-parametric test\n\n\
    \    : A statistical test which does not depend on the assumptions (parameters)\
    \ required by parametric tests, e.g., normal distribution of data. \n\n    normal\
    \ distribution\n\n    : A frequency distribution where the majority of values\
    \ are in the middle of the range, tailing off at either end of the scale producing\
    \ a symmetrical bell shaped curve. \n\n    null hypothesis\n\n    : This is the\
    \ hypothesis that is proposed to be *nullified* or refuted, e.g., there will be\
    \ no difference between the two samples. \n\n    one-tailed test\n\n    : A test\
    \ where the hypothesis predicts an effect in one direction, e.g., predicting that\
    \ levels of anxiety will *reduce* as a result of counselling (compared to a 2-tailed\
    \ test which abstains from making a directional prediction, i.e., that counselling\
    \ will have an effect on levels of anxiety - but we cannot be certain if this\
    \ will lead to a reduction or increase in levels of anxiety). \n\n    ordinal\
    \ data\n\n    : This is data that can be put into an ordered sequence. For example,\
    \ the rank order of runners in a race – 1st, 2nd, 3rd. \n\n    outliers\n\n  \
    \  : Data which lies outside the majority of scores. \n\n    parametric statistics\n\
    \n    : Statistical tests that assume certain parameters of the data, e.g., a\
    \ normal distribution. 134 Page 134 \n\n    power\n\n    : This relates to the\
    \ power of a statistical test to detect a statistically significant effect/difference\
    \ if there really is one. The power of a statistical test to detect a difference\
    \ may depend on sample size (the larger the better) and the size of the effect/difference\
    \ that is being investigated. \n\n    probability\n\n    : This refers to the\
    \ likelihood of an event occurring by chance. If the event cannot happen the probability\
    \ is zero; if the event is certain to happen the probability is one. \n\n    p\
    \ value\n\n    : This refers to the probability of the outcomes occurring by chance,\
    \ expressed numerically as ranging from zero to one. The convention is to accept\
    \ a p value of 0.05 or less as being statistically significant, which translates\
    \ to a probability of 1 in 20 of the results occurring by chance. \n\n    ratio\
    \ scale\n\n    : A scale where points are separated by equal intervals with a\
    \ true zero, e.g., height, weight, age, length. \n\n    regression analysis\n\n\
    \    : Regression analysis assesses the relationship between one or more dependent\
    \ variables and independent variables in order to find a line that best predicts\
    \ the relationship between the two. It is then possible to estimate values of\
    \ a dependent variable from values of an independent variable. \n\n    related\
    \ samples t-test\n\n    : A statistical test used to determine whether the mean\
    \ scores from two related samples differ significantly. \n\n    repeated measures\
    \ design\n\n    : Where two or more measures are taken from the same sample (in\
    \ contrast to independent subjects design), e.g., levels of anxiety before and\
    \ after counselling for a sample of patients. \n\n    standard deviation\n\n \
    \   : A measure of the amount of deviation from the mean in a sample of scores.\
    \ \n\n    statistical significance\n\n    : An observation that is unlikely to\
    \ have occurred by chance at a specified level of probability. \n\n    t-test\n\
    \n    : A statistical technique for examining differences in means between two\
    \ samples. \n\n    two-tailed test\n\n    : A test where the hypothesis does not\
    \ specify a direction for the effect (non-directional), e.g., the treatment will\
    \ have an effect but we cannot be certain if this will lead to an increase or\
    \ decrease in patient ratings. \n\n    type I error\n\n    : Essentially, accepting\
    \ a statistical difference/effect when there really is not one (like a false-positive).\
    \ In more formal terms it refers to a rejection of the null hypothesis (no difference)\
    \ when it is in fact true. \n\n    type II error\n\n    : Essentially, accepting\
    \ the absence of a statistical difference or effect when there really is one (like\
    \ a false-negative). In more formal terms, failing to reject the null hypothesis\
    \ (no difference) when it should be rejected. \n\n    Wilcoxon test\n\n    : A\
    \ non-parametric statistical test to determine differences in two related samples.\
    \ \n\n    135 Page 135 \n\n    # References\n\n    *   Argyrous, G. (2005) Statistics\
    \ for Research: With a Guide to SPSS. London: Sage.\n\n    *   Bowling, A. (1997)\
    \ Research Methods in Health. Buckingham: Open University Press.\n\n    *   Bryman,\
    \ A. and Cramer, D. (2001) Quantitative Data Analysis with SPSS Release 10 for\
    \ Windows. London: Routledge.\n\n    *   Cohen, J. (1988) Statistical Power Analysis\
    \ for the Behavioural Sciences. Hillsdale, NJ: Erlbaum.\n\n    *   Coolidge, F.\
    \ L. (2006) Statistics: A Gentle Introduction. London: Sage.\n\n    *   Davidson,\
    \ L. (2000) Meeting the challenges of the new NHS for counselling in primary care:\
    \ a service manager perspective. British Journal of Guidance and Counselling 28,\
    \ 191–202.\n\n    *   Department of Health (1991) The health of the nation white\
    \ paper: point prevalence of mental disorders in the adult population (England),\
    \ Section C. London: Her Majesty’s Stationery Office.\n\n    *   Department of\
    \ Health (1999) A national service framework for mental health. London: Her Majesty’s\
    \ Stationery Office.\n\n    *   Einspruch, E. L. (2005) An Introductory Guide\
    \ to SPSS for Windows. London: Sage.\n\n    *   Field, A. (2005) Discovering Statistics\
    \ Using SPSS. London: Sage.\n\n    *   Gravetter, F. J. and Wallnau, L. B. (2002)\
    \ Essentials of Statistics for the Behavioral Sciences. Belmont, CA: Wadsworth.\n\
    \n    *   Greasley, P. and Small, N. (2005a) Evaluating a primary care counselling\
    \ service: outcomes and issues, Primary Health Care Research & Development, 6:\
    \ 125–36.\n\n    *   Greasley, P. and Small, N. (2005b) Providing welfare advice\
    \ in general practice: Referrals, issues and outcomes, Health and Social Care\
