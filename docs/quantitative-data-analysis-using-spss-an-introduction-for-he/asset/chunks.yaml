  trans: "\n# 4.3 卡方统计检验\n\n我们已经看到，患者的性别在辅导员之间并没有平均分配。但我们可以问，这是否只是偶然的结果？如果我们重新开始服务，并且患者被\
    \ *randomly*（随机）分配给辅导员，我们可能会得到类似的结果吗？甚至可能是相反的——大多数男性患者会看到女辅导员。当然，最可能的情况是，这只是巧合，我们会期望他们在[<unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk>需要翻译的内容是：\n\
    \n[content]\n\n# 4.3 The chi-square statistical test\n\nWe have seen, then, that\
    \ the sex of patients was not equally distributed across the counsellors. But\
    \ we might ask was this a chance result? If we started the service again and the\
    \ patients were *randomly* assigned to the counsellors might we have found a similar\
    \ result? Perhaps even the opposite – with most male patients seeing the female\
    \ counsellor. More likely of course, by chance, we would expect them to be distributed\
    \ quite evenly across the sexes. The question is: how much of an unequal distribution\
    \ across the sexes does there have to be for us to conclude that there was a significant\
    \ bias for male patients to see a male counsellor and vice versa? Or, to put it\
    \ another way: how much of an unequal distribution across the sexes does there\
    \ have to be for us to *reject the possibility that this has occurred by chance?*\
    \ This is where a statistical test comes in handy.\n\nChi-square (represented\
    \ as χ²) applies a statistical test to cross-tabulation by comparing the actual\
    \ *observed* frequencies in each cell of tables with *expected* frequencies. Expected\
    \ frequencies are those we would expect if data is ‘randomly distributed’.\n\n\
    64 Page 64 \n\nIt may help at this point to think of the four cells in the cross-tabulation\
    \ table as buckets. Now imagine a lottery machine designed to pump balls into\
    \ each of the buckets through four pipes – one leading into each bucket. If the\
    \ distribution of balls by the lottery machine is truly random, then we would\
    \ expect a similar number of balls in each bucket. Thus, if<unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><unk><img>\n\
    \nWe have the opposite scenario: all the males saw John, whereas all the females\
    \ saw Jane. Notice that the *expected* frequencies remain the same – 50 in each\
