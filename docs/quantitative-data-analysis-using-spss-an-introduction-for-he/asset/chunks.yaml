    \ and the chi-square statistic\n\n    在本章中，您将学习关于类别数据的交叉表，用于检验变量之间的关联的卡方检验（chi-square），以及统计显著性的概念。您还将学习如何将区间数据重新编码为类别。\n\
    \n    ## 4.1Introduction\n\n    交叉表是分析问卷数据的最常用方法之一。它比单个变量的简单频数能更详细地考察类别变量之间的关系。本章将展示如何在\
    \ SPSS 中完成此操作，并应用与交叉表相关的统计分析——即卡方检验（pronounced ‘kye square’）。\n\n    ## 4.2Cross-tabulating\
    \ data in the questionnaire\n\n    在我们的咨询满意度问卷中，只有两个类别变量：患者性别（男性或女性）和咨询师（John\
    \ 或 Jane）。当我们在上一章为这两个变量运行频数时，得到了以下结果： \n\n"
