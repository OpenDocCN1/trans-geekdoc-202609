    \ ratings](Images/figX3-1b.jpg)\n\n**Figure X3.1b**Histogram for satisfaction\
    \ ratings\n\nBoth histograms show a relatively normal distribution with the majority\
    \ of scores in the middle generally tailing off at either end of the scale.\n\n\
    116 Page 116 \n\n### Exercise 3.2\n\nProduce boxplots comparing satisfaction ratings\
    \ according to the gender of patients. What do you conclude from the results in\
    \ terms of: (a) the spread of the data for males compared to females; (b) the\
    \ relative satisfaction ratings of males compared to females?\n\n#### Answers\n\
    \n![Figure X3.2Boxplots comparing satisfaction ratings for males and females](Images/figX3-2.jpg)\n\
    \n**Figure X3.2**Boxplots comparing satisfaction ratings for males and females\n\
    \nFrom the boxplots above the first point we should note is that male patients\
    \ were more satisfied with the counselling: they generally provide higher satisfaction\
    \ ratings with a median rating of 5 compared to 4 for the female patients. On\
    \ the 7 point rating scale, this would suggest that male patients were generally\
    \ satisfied with the counselling service whereas for female patients this cannot\
    \ be concluded. The larger spread of satisfaction ratings across female patients\
    \ suggests a greater degree of ambivalence in the ratings, with some patients\
    \ satisfied, but others not satisfied.\n\nThe fact that there are two outliers\
    \ for the male satisfaction ratings reflects the relatively high degree of clustering\
    \ for the majority of ratings (as illustrated by the middle 50 per cent of ratings\
    \ in the boxplot).^()\n\nIncidentally, does your boxplot chart look like this\
    \ one? I made a number of changes to the default chart by double-clicking on the\
    \ Y-axis and making some alterations to the scale:\n\n* I changed the minimum\
    \ value to 1 (it was 0) – because the satisfaction scale actually goes from 1\
    \ to 7.\n\n* I changed the major increment to 1 (it was 2) so we can see every\
    \ value of the satisfaction scale.\n\n* I increased the lower margin from 0 per\
    \ cent to 5 per cent (to provide a gap between the 1 on the Y-axis and the X-axis).\n\
    \nPresentation is important, as noted earlier.\n\n117 Page 117 \n\n## Chapter\
    \ 4\n\n### Exercise 4.1 Recoding counselling sessions into categories\n\nRecode\
    \ the data for number of counselling sessions into three equal groups representing\
    \ ‘low’, ‘medium’ and ‘high’ attendance, and first cross-tabulate with ‘counsellor’\
    \ then with ‘sex’. What do these cross-tabulations show?\n\n#### Answers\n\nThe\
    \ first thing we need to know is the range of counselling sessions. From section\
    \ 2 in [Chapter 3](#08_Chapter03.xhtml) we know that the number of counselling\
    \ sessions ranged from 3 to 12 (running a simple frequencies analysis will confirm\
    \ this). So we should divide the sessions into the following three categories:\n\
    \n1. 1Low: 1–4 sessions.\n\n2. 2Medium: 5–8 sessions.\n\n3. 3High: 9–12 sessions.\n\
    \nNow that we know our categories we can re-code counselling sessions in SPSS\
    \ using **Transform / Recode into Different Variables** and then cross-tabulate\
    \ counsellor with our new variable.\n\n**Table X4.1b**Counsellor / session categories\
    \ cross-tabulation\n\n| counsellor\\* Session categories Crosstabulation  |\n\
    | --- |\n|  || Session categories || Total |\n| 1-4 || 5-8 || 9-12 |\n| counsellor\
    \ || John || Count% within counsellor || 17.1% || 642.9% || 750.0% || 14100.0%\
    \ |\n| Jane || Count% within counsellor || 212.5% || 1275.0% || 212.5% || 16100.0%\
    \ |\n| Total ||  || Count% within counsellor || 310.0% || 1860.0% || 930.0% ||\
    \ 30100.0% |\n\nA table titled counselor session categories crosstabulation lists\
    \ the count and percentages within counselor for John and Jane, and total values\
    \ in column 1. Columns 2 and 3 list the corresponding session categories, of 1\
    \ to 4, 5 to 8, and 9 to 12, and total.\n\nFrom this cross-tabulation we can see\
    \ that John tended to hold a larger number of sessions: 50 per cent of his patients\
    \ attended for between 9–12 sessions compared to only 12 per cent of Jane’s patients,\
    \ the majority of whom (75 per cent) attended for between 5–8 sessions.\n\nThis\
    \ would be useful information for our doctor who might be interested to know why\
    \ half of John’s patients were offered well above the recommended six sessions\
    \ while Jane appears to be abiding by the recommendations. While there may be\
    \ valid reasons for the extra number of sessions provided by John, the concern\
    \ for the doctor may lie in resource implications: if John is spending too much\
    \ time with his patients, the waiting time for referrals may go up.\n\nYou should\
