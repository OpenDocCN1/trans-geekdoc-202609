    \nScreenshot 2.13\n\nYour value labels for sex and counsellor are now displayed:\n\
    \n29 Page 29 ![Screenshot 2.14](Images/p29-1.jpg)\n\nScreenshot 2.14\n\n### Exercise\
    \ 2.2Sorting the data\n\nSometimes it is useful to re-order the data, for example,\
