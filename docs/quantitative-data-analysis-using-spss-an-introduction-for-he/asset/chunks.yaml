- raw: "We now need to enter our data from [Table 2.1](#07_Chapter02.xhtml#tab2-1)\
    \ into SPSS. This will enable us to conduct all the analyses discussed in the\
    \ previous chapter – frequencies, cross-tabulation, measures of central tendency\
    \ (mean, median, mode), correlations, graphs, etc., at the click of a button (well,\
    \ a few buttons in some cases).\n\nBut before we can enter the data into SPSS\
    \ we need to give our variables names and code the data – because all data in\
    \ SPSS should be entered as numbers. The simplest way to illustrate this is through\
    \ the codebook I have produced for the data in [Figure 2.1](#07_Chapter02.xhtml#fig2-1).\n\
    \nThe first column provides the variable name that we will use for SPSS. In the\
    \ second column I have written some coding instructions. Since all our data needs\
    \ to be entered as numbers, this means that data which is not collected as numbers,\
    \ like male/female, needs to be converted into numbers. For example, in our codebook,\
    \ we have assigned the number 1 for male, and 2 for female.^() ![Figure 2.1An\
    \ SPSS codebook for the data in Table 2.1](Images/fig2-1.jpg)\n\n**Figure 2.1**An\
    \ SPSS codebook for the data in [Table 2.1](#07_Chapter02.xhtml#tab2-1)\n\nIn\
    \ practice, for a questionnaire with only five questions and only two coded variables,\
    \ the idea of producing a codebook is a little excessive. But for larger questionnaires\
    \ it can be a very useful reference point. Alternatively, another strategy is\
    \ to simply add any codes for categorical variables on a copy of the questionnaire\
    \ so that you have a record of the codes.\n\n21 Page 21 \n\nNow that we have decided\
    \ upon our variable names and codes for categorical data, as illustrated in [Figure\
    \ 2.1](#07_Chapter02.xhtml#fig2-1), we can set up the SPSS database.\n\n## 2.3Setting\
    \ up an SPSS database\n\nWhen you open SPSS you should be faced with the following\
    \ screen:\n\n![Screenshot 2.1](Images/p21-1.jpg)\n\nScreenshot 2.1\n\nClick **Type\
    \ in data** and then click **OK**. This opens a blank spreadsheet.\n\n### The\
    \ SPSS data screen\n\nThe screen below is known as the **Data View**. This is\
    \ where you will enter the data. *But not yet – there’s a little more reading\
    \ to do*.\n\nEach *row* will contain the data for one patient. So, in the example\
    \ on the next page, we have data for 3 patients:\n\n*   Patient 1 is a male (coded\
    \ 1), aged 24.\n\n*   Patient 2 is a female (coded 2), aged 25.\n\n*   Patient\
    \ 3 is male, aged 26.\n\n22 Page 22 ![Screenshot 2.2](Images/p22-1.jpg)\n\nScreenshot\
    \ 2.2\n\n### 2.3.1Defining the variables\n\nBefore we can enter our data, we need\
    \ to enter variable names and coding instructions.\n\nOn the bottom left of the\
    \ Data Editor screen you will see two *tabs* labelled **Data View** and **Variable\
    \ View**.\n\n![Screenshot 2.3](Images/p22-2.jpg)\n\nScreenshot 2.3\n\nClick on\
    \ **Variable View**. This will produce the following screen where you will type\
    \ in information about the variables:\n\n![Screenshot 2.4](Images/p22-3.jpg)\n\
    \nScreenshot 2.4\n\nIn this view each *row* will provide information for each\
    \ variable. This is where we need to refer to our SPSS codebook (see [Figure 2.1](#07_Chapter02.xhtml#fig2-1)).\n\
    \n#### Name\n\nEnter the first SPSS variable name listed in your codebook, i.e.,\
    \ **patient**. Then press the right arrow on your keyboard to go to the next column\
    \ – *type*.\n\n23 Page 23 \n\n#### Type: what type of data is it?\n\nOnce you\
    \ have entered a variable name the default value for **Type** will appear automatically\
    \ as numeric. All of our variables will be numeric because we will be coding any\
    \ words – such as male and female – as numbers (i.e., 1 for male and 2 for female).\
    \ So you can move on to the next column – **Width** (see [Box 2.2](#07_Chapter02.xhtml#box2-2)\
    \ for occasions when you really have to enter words).\n\n#### Width: how many\
    \ numbers will you be entering?\n\nSPSS defaults to eight characters. The most\
    \ we will need is two – for our age and session data (e.g., 24 years, 12 sessions).\
    \ There is no need to change this. You would increase it if you were entering\
    \ very large numbers, for example, 184,333,333.24 (i.e., 11 numbers/characters).\n\
    \n#### Decimals\n\nSPSS defaults to two decimal places. Since our data does not\
    \ require decimal places we can simply click in the **Decimals** cell and click\
    \ the up or down arrows (which appear to the right of the cell) to adjust decimal\
    \ places needed for that particular variable.\n\n![Screenshot 2.6](Images/p24-1.jpg)\n\
    \nScreenshot 2.6\n\nFor datasets with many variables that do not have decimal\
    \ places it may be worthwhile changing the default setting to 0 decimal places.\
    \ You can do this by clicking on **Edit** from the menu at the top of the screen\
    \ and then choosing **Options**. Next, click the **Data** tab and change the decimal\
    \ place value to 0 in **Display** format for new numeric variables.\n\n#### Label\n\
    \nThe **Label** column allows you to provide a longer description of your variable,\
    \ which will be shown in the output produced by SPSS. You do not need to put anything\
    \ here for ‘patient’, or the other variables, since the names are self-explanatory.^()\n\
    \n#### Values\n\nValues are numbers assigned to categories for nominal variables,\
    \ for example, where male = 1 and female = 2. Since your first variable (patient)\
    \ has no ‘values’, you do not need to put anything here.\n\n#### Missing\n\nSometimes\
    \ it is useful to assign specific values to indicate different reasons for missing\
    \ data. However, SPSS recognizes any blank cell as missing data and 25 Page 25excludes\
    \ it from any calculations, so if you intend to leave the cell blank there is\
    \ no need to enter values for missing data. And we have no missing data anyway.^()\n\
    \n#### Columns\n\nYou can change the column width to reduce the space it takes\
    \ on the screen. But you need to allow enough space for variable names, so the\
    \ default of eight is usually OK.\n\n#### Align\n\nThis is usually set at **Right**,\
    \ which is OK.\n\n#### Measure\n\nThe default measure is **Scale**, but you can\
    \ change this to **Ordinal** or **Nominal** by clicking in the cell and then on\
    \ the down arrow on the right of the cell. We have scale data and nominal data:\n\
    \n**Table 2.2** Measure definitions\n\n| *Measure*  || *Definition* |\n\n| ---\
    \ | --- |\n\n| Scale: || For numeric values on an interval or ratio scale: age,\
    \ sessions, satisfaction. |\n\n| --- | --- |\n\n| Nominal: || For values that\
    \ represent categories with no intrinsic order: patient, sex,counsellor. |\n\n\
    | Ordinal: || For values with some intrinsic order (e.g., low, medium, high; first,\
    \ second third). |\n\nSince our first variable is simply listing the patient/questionnaire\
    \ number we should change this to ‘nominal’ because the numbers are simply assigned\
    \ to the patients (they have no meaning as a scale).\n\nYou should now have completed\
    \ the information for the first variable, ‘patient’, and it should look like this:\n\
    \n![Screenshot 2.7](Images/p25-1.jpg)\n\nScreenshot 2.7\n\n### 2.3.2.Adding value\
    \ labels\n\nThe next variable is ‘sex’. Proceed as you did for ‘patient’ until\
    \ you get to **Values**. Whereas ‘patient’ had no values – it was simply patient\
    \ numbers – sex has two values: we will be entering the number 1 for male and\
    \ number 2 for female. So you need to tell SPSS that is what you are doing.\n\n\
    This is how you add value labels in SPSS:\n\n26 Page 26 \n\n1.  1Click in the\
    \ **Values** cell and then on the button with 3 dots on the right side of the\
    \ cell. This opens the **Value Label** box.\n\n2.  2Click in the box marked **Value**.\
    \ Type in 1.\n\n3.  3Click in the box marked **Value Label**. Type in male.\n\n\
    4.  4Click on **Add**. You will then see in the summary box: 1=male.\n\n5.  5Repeat\
    \ this procedure for females **(Value** = 2; **Value Label:** female; **Add**).\n\
    \n![Screenshot 2.8](Images/p26-1.jpg)\n\nScreenshot 2.8\n\n1.  6Then click **OK**.\
    \ This information is now stored in your SPSS database. The only other thing to\
    \ change is **Measure** (to **Nominal)** and your database should look like this:\n\
    \n![Screenshot 2.9](Images/p26-2.jpg)\n\nScreenshot 2.9"
