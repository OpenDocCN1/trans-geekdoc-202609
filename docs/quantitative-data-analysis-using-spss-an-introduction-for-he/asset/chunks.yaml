- raw: "    What the chi-square statistic does is to calculate the odds of this distribution\
    \ happening by chance.\n\n    Let us run chi-square on our counselling data and\
    \ see what happens.\n\n    ### Running chi-square in SPSS\n\n    1.  1From the\
    \ menu at the top of the screen click: **Analyze** then **Descriptive Statistics**\
    \ then **Crosstabs**.\n\n    2.  2Move the variable **sex** into the rows box\
    \ and **counsellor** into the columns box.\n\n    3.  3Click the **Cells** button.\
    \ Ensure that *observed* and *expected* counts are ticked, and *row percentages*\
    \ (since we want to know the percentages of males and females who saw each counsellor).\n\
    \n        ![Screenshot 4.2](Images/p65-1.jpg)\n\n        Screenshot 4.2\n\n  \
    \  4.  4Click **Continue** to close this box.\n\n    5.  5Click on the **Statistics**\
    \ tab and put a tick in the **chi-square** box. 66 Page 66\n\n        ![Screenshot\
    \ 4.3](Images/p66-1.jpg)\n\n        Screenshot 4.3\n\n    6.  6Click **Continue**\
    \ then click **OK** to run the analysis.\n\n    The SPSS output viewer should\
    \ produce the cross-tabulation table and a table listing the chi-square and related\
    \ tests.\n\n    Note: SPSS can produce some scary output tables listing all kinds\
    \ of statistics with obscure and complicated names which may or may not be relevant\
    \ to your analysis. The chi-square test table is a mild example. The trick is\
    \ to know what you are looking for, as will be illustrated.\n\n    **Table 4.6**Cross-tabulation\
    \ of sex and counsellor with expected counts\n\n    | sex \\* counsellor Crosstabulation\
    \  |\n\n    | --- |\n\n    |  || counsellor || Total |\n\n    | --- | --- | ---\
    \ |\n\n    | John || Jane |\n\n    | sex || male || CountExpected Count% within\
    \ sex || 106.571.4% || 47.528.6% || 1414.0100.0% |\n\n    |  || female || CountExpected\
    \ Count% within sex || 47.525.0% || 128.575.0% || 1616.0100.0% |\n\n    | Total\
    \ ||  || CountExpected Count% within sex || 1414.046.7% || 1616.053.3% || 3030.0100.0%\
    \ |\n\n    A table titled sex counselor crosstabulation lists the count, expected\
    \ count, and percentage values within sex for male and female, and total values\
    \ in column 1. Columns 2 and 3 list the corresponding values for counselors, including\
    \ John and Jane, and total, respectively.\n\n    67 Page 67 \n\n    **Table 4.7**Chi-square\
    \ tests table\n\n    | Chi-Square Tests |\n\n    | --- |\n\n    |  || Value ||\
    \ df || Asymp. Sig. (2-sided) || Exact Sig. (2-sided) || Exact Sig. (1-sided)\
    \ |\n\n    | --- | --- | --- | --- | --- | --- |\n\n    | Pearson Chi-Square ||\
    \ 6.467^() || 1 || .011 ||  ||  |\n\n    | Continuity Correction ^() || 4.736\
    \ || 1 || .030 ||  ||  |\n\n    | Likelihood Ratio || 6.709 || 1 || .010 ||  ||\
    \  |\n\n    | Fisher’s Exact Test ||  ||  ||  || .026 || .014 |\n\n    | Linear-by-Linear\
    \ ||  ||  ||  ||  ||  |\n\n    | Association || 6.251 || 1 || .012 ||  ||  |\n\
    \n    | N of Valid Cases || 30 ||  ||  ||  ||  |\n\n    [a.](#09_Chapter04.xhtml#tfn1)Computed\
    \ only for a 2x2 table\n\n    [b.](#09_Chapter04.xhtml#tfn2)0 cells (.0%) have\
    \ expected count less than 5. The minimum expected count is 6.53.\n\n    A table\
    \ titled Chi-Square tests lists the variables, including Pearson Chi-Square, continuity\
    \ correction, likelihood ratio, and more in column 1. Columns 2 to 6 list the\
    \ values, degrees of freedom, 2-sided asymptotic significance, 2-sided and 1-sided\
    \ exact significance values, respectively.\n\n    The first thing to note is the\
    \ footnote (b) which tells us that ‘0 cells have expected count less that 5’.\
    \ This is an important assumption of chi-square. If you are intending to cross-tabulate\
    \ data and use the chi-square statistic, you should always try to ensure that\
    \ you have a large enough sample size to maintain sufficient values in the cells.^()\n\
    \n    The values we are interested in are along the top *Pearson chi-square* row.\
    \ The Pearson chi-square value is 6.467, with a significance or *probability*\
    \ (p) value of .011. This means that, according to the chi-square calculation,\
    \ the probability of this distribution of values occurring by chance is less than\
    \ .01 – or 1 in 100, so probability (p) = .01. We would accept these odds as statistically\
    \ significant and conclude that there is a relationship between the sex of patients\
    \ and the counsellor they saw: male patients were more likely to see the male\
    \ counsellor and female patients were more likely to see the female counsellor.^()\n\
    \n    So, in your report to the doctor you would first point out that cross-tabulation\
    \ between the sex of patients and counsellors showed that a greater proportion\
    \ tended to see the same sex counsellor: 71 per cent of male patients saw John;\
    \ 75 per cent of female patients saw Jane. But then you would also add that the\
    \ chi-square statistic showed this to be statistically significant: χ² = 6.467,\
    \ p = .011. You would then go on to comment on this result, for example, possible\
    \ explanations.\n\n    ## 4.4Levels of statistical significance\n\n    In discussing\
    \ the outcomes of the chi-square analysis we have introduced an important concept\
    \ – that of statistical significance. There is a convention in research that we\
    \ may accept a 5 per cent (written as 0.05 which is 5 in 100, or 1 in 20) probability\
    \ of accepting that there is a significant difference if it were true that there\
    \ was really no difference (a false positive).\n\n    In actual fact, the chi-square\
    \ test has calculated that the odds are 1 in 100 (.01) that this distribution\
    \ of scores in the four cells could occur by chance. Looking at it another way,\
    \ if you had a random lottery machine distributing balls into the four cells this\
    \ result might occur one time in 100 trials using 30 balls.\n\n    68 Page 68\
    \ \n\n    We should, of course, adjust our acceptable level of statistical significance\
    \ according to the context. For example, we might not want to accept a 1 in 20\
    \ (0.05) chance that an experimental drug with harmful side effects really has\
    \ no power to reduce pain: ‘Well, according to our trials, there’s a 1/20 probability\
    \ that it doesn’t actually reduce pain, and the positive results we found were\
    \ purely down to chance.’ In this case we might well want to increase our level\
    \ of significance to 1 in 100 (0.01) – at least!\n\n    The problem being that\
    \ we have to strike a balance. The lower you set your criteria for significance,\
    \ the more likely you are to conclude with a false positive – concluding that\
    \ there *is* a significant difference when there is not in reality – in our counselling\
    \ example, arguing for a male and female counsellor to cater for patient preferences\
    \ when further research with a larger sample would show that there really is not\
    \ a preference for same-sex counsellor. But conversely, if you set your threshold\
    \ for significance too high, you are more likely to conclude with a false negative\
    \ – saying there is no difference when there actually is. In statistics books\
    \ these are known as Type I (false-positive) and Type II (false-negative) errors.\n\
    \n    This also raises the issue of ‘power’ and ‘effect size’. Imagine two experiments.\
    \ The first aims to test the effects of a drug on humans which is known to be\
    \ highly noxious through laboratory and animal experiments. What size sample would\
    \ you need? Well, if we expect that the effect is going to be particularly distinctive\
    \ – vomiting, convulsions, etc., then we would hope not very many. Hopefully,\
    \ after say five people taking the drug and another five taking a placebo, we\
    \ would have some pretty strong data comparing the two conditions.\n\n    But\
    \ imagine a second experiment which is using a questionnaire to measure levels\
    \ of anxiety before and after counselling. The researchers think that counselling\
    \ will reduce the levels of anxiety for most patients, but possibly not by that\
    \ much, and for some patients levels of anxiety may rise as they confront their\
    \ issues. So the effect that we were expecting is not particularly distinctive\
    \ in this case – and therefore we would need a much larger sample to avoid concluding\
    \ with a false negative. This is the basis of ‘power calculations’ where, basically,\
    \ the smaller the effect size, the larger the sample size needed."
  fmt: "\nWhat the chi-square statistic does is to calculate the odds of this distribution\
    \ happening by chance.\n\nLet us run chi-square on our counselling data and see\
    \ what happens.\n\n### Running chi-square in SPSS\n\n1. From the menu at the top\
    \ of the screen click: `Analyze` then `Descriptive Statistics` then `Crosstabs`.\n\
    \n2. Move the variable `sex` into the rows box and `counsellor` into the columns\
    \ box.\n\n3. Click the `Cells` button. Ensure that *observed* and *expected* counts\
    \ are ticked, and *row percentages* (since we want to know the percentages of\
    \ males and females who saw each counsellor).\n\n   ![Screenshot 4.2](Images/p65-1.jpg)\n\
    \n   Screenshot 4.2\n\n4. Click **Continue** to close this box.\n\n5. Click on\
    \ the **Statistics** tab and put a tick in the **chi-square** box. 66 Page 66\n\
    \n   ![Screenshot 4.3](Images/p66-1.jpg)\n\n   Screenshot 4.3\n\n6. Click **Continue**\
    \ then click **OK** to run the analysis.\n\nThe SPSS output viewer should produce\
    \ the cross-tabulation table and a table listing the chi-square and related tests.\n\
    \nNote: SPSS can produce some scary output tables listing all kinds of statistics\
    \ with obscure and complicated names which may or may not be relevant to your\
    \ analysis. The chi-square test table is a mild example. The trick is to know\
    \ what you are looking for, as will be illustrated.\n\n**Table 4.6**Cross-tabulation\
    \ of sex and counsellor with expected counts\n\n| sex \\* counsellor Crosstabulation\
    \  |\n\n| --- |\n\n|  || counsellor || Total |\n\n| --- | --- | --- |\n\n| John\
    \ || Jane |\n\n| sex || male || CountExpected Count% within sex || 106.571.4%\
    \ || 47.528.6% || 1414.0100.0% |\n\n|  || female || CountExpected Count% within\
    \ sex || 47.525.0% || 128.575.0% || 1616.0100.0% |\n\n| Total ||  || CountExpected\
    \ Count% within sex || 1414.046.7% || 1616.053.3% || 3030.0100.0% |\n\nA table\
    \ titled sex counselor crosstabulation lists the count, expected count, and percentage\
    \ values within sex for male and female, and total values in column 1. Columns\
    \ 2 and 3 list the corresponding values for counselors, including John and Jane,\
    \ and total, respectively.\n\n67 Page 67 \n\n**Table 4.7**Chi-square tests table\n\
    \n| Chi-Square Tests |\n\n| --- |\n\n|  || Value || df || Asymp. Sig. (2-sided)\
    \ || Exact Sig. (2-sided) || Exact Sig. (1-sided) |\n\n| --- | --- | --- | ---\
    \ | --- | --- |\n\n| Pearson Chi-Square || 6.467^() || 1 || .011 ||  ||  |\n\n\
    | Continuity Correction ^() || 4.736 || 1 || .030 ||  ||  |\n\n| Likelihood Ratio\
    \ || 6.709 || 1 || .010 ||  ||  |\n\n| Fisher’s Exact Test ||  ||  ||  || .026\
    \ || .014 |\n\n| Linear-by-Linear ||  ||  ||  ||  ||  |\n\n| Association || 6.251\
    \ || 1 || .012 ||  ||  |\n\n| N of Valid Cases || 30 ||  ||  ||  ||  |\n\n[a.](#09_Chapter04.xhtml#tfn1)Computed\
    \ only for a 2x2 table\n\n[b.](#09_Chapter04.xhtml#tfn2)0 cells (.0%) have expected\
    \ count less than 5. The minimum expected count is 6.53.\n\nA table titled Chi-Square\
    \ tests lists the variables, including Pearson Chi-Square, continuity correction,\
    \ likelihood ratio, and more in column 1. Columns 2 to 6 list the values, degrees\
    \ of freedom, 2-sided asymptotic significance, 2-sided and 1-sided exact significance\
    \ values, respectively.\n\nThe first thing to note is the footnote (b) which tells\
    \ us that ‘0 cells have expected count less that 5’. This is an important assumption\
    \ of chi-square. If you are intending to cross-tabulate data and use the chi-square\
    \ statistic, you should always try to ensure that you have a large enough sample\
    \ size to maintain sufficient values in the cells.^()\n\nThe values we are interested\
    \ in are along the top *Pearson chi-square* row. The Pearson chi-square value\
    \ is 6.467, with a significance or *probability* (p) value of .011. This means\
    \ that, according to the chi-square calculation, the probability of this distribution\
    \ of values occurring by chance is less than .01 – or 1 in 100, so probability\
    \ (p) = .01. We would accept these odds as statistically significant and conclude\
    \ that there is a relationship between the sex of patients and the counsellor\
    \ they saw: male patients were more likely to see the male counsellor and female\
    \ patients were more likely to see the female counsellor.^()\n\nSo, in your report\
    \ to the doctor you would first point out that cross-tabulation between the sex\
    \ of patients and counsellors showed that a greater proportion tended to see the\
    \ same sex counsellor: 71 per cent of male patients saw John; 75 per cent of female\
    \ patients saw Jane. But then you would also add that the chi-square statistic\
    \ showed this to be statistically significant: χ² = 6.467, p = .011. You would\
    \ then go on to comment on this result, for example, possible explanations.\n\n\
    ## 4.4Levels of statistical significance\n\nIn discussing the outcomes of the\
    \ chi-square analysis we have introduced an important concept – that of statistical\
    \ significance. There is a convention in research that we may accept a 5 per cent\
    \ (written as 0.05 which is 5 in 100, or 1 in 20) probability of accepting that\
    \ there is a significant difference if it were true that there was really no difference\
    \ (a false positive).\n\nIn actual fact, the chi-square test has calculated that\
    \ the odds are 1 in 100 (.01) that this distribution of scores in the four cells\
    \ could occur by chance. Looking at it another way, if you had a random lottery\
    \ machine distributing balls into the four cells this result might occur one time\
    \ in 100 trials using 30 balls.\n\n68 Page 68 \n\nWe should, of course, adjust\
    \ our acceptable level of statistical significance according to the context. For\
    \ example, we might not want to accept a 1 in 20 (0.05) chance that an experimental\
    \ drug with harmful side effects really has no power to reduce pain: ‘Well, according\
    \ to our trials, there’s a 1/20 probability that it doesn’t actually reduce pain,\
    \ and the positive results we found were purely down to chance.’ In this case\
    \ we might well want to increase our level of significance to 1 in 100 (0.01)\
    \ – at least!\n\nThe problem being that we have to strike a balance. The lower\
    \ you set your criteria for significance, the more likely you are to conclude\
    \ with a false positive – concluding that there *is* a significant difference\
    \ when there is not in reality – in our counselling example, arguing for a male\
    \ and female counsellor to cater for patient preferences when further research\
    \ with a larger sample would show that there really is not a preference for same-sex\
    \ counsellor. But conversely, if you set your threshold for significance too high,\
    \ you are more likely to conclude with a false negative – saying there is no difference\
    \ when there actually is. In statistics books these are known as Type I (false-positive)\
    \ and Type II (false-negative) errors.\n\nThis also raises the issue of ‘power’\
    \ and ‘effect size’. Imagine two experiments. The first aims to test the effects\
    \ of a drug on humans which is known to be highly noxious through laboratory and\
    \ animal experiments. What size sample would you need? Well, if we expect that\
    \ the effect is going to be particularly distinctive – vomiting, convulsions,\
    \ etc., then we would hope not very many. Hopefully, after say five people taking\
    \ the drug and another five taking a placebo, we would have some pretty strong\
    \ data comparing the two conditions.\n\nBut imagine a second experiment which\
    \ is using a questionnaire to measure levels of anxiety before and after counselling.\
    \ The researchers think that counselling will reduce the levels of anxiety for\
    \ most patients, but possibly not by that much, and for some patients levels of\
    \ anxiety may rise as they confront their issues. So the effect that we were expecting\
    \ is not particularly distinctive in this case – and therefore we would need a\
    \ much larger sample to avoid concluding with a false negative. This is the basis\
    \ of ‘power calculations’ where, basically, the smaller the effect size, the larger\
    \ the sample size needed.\n"
  trans: "\n-   [卡方统计量的作用是计算这种分布是否可能是偶然发生的可能性。](https://wiki.example.org/feynmans_learning_method)\
    \ 让我们对我们的咨询数据运行卡方检验，看看会发生什么。\n\n### 在 SPSS 中运行卡方检验\n\n1.  在屏幕顶部的菜单栏中点击：`Analyze`\
    \ 然后选择 `Descriptive Statistics` 再选择 `Crosstabs`。\n\n2.  将变量 `sex` 拖入行框，将 `counsellor`\
    \ 拖入列框。\n\n3.  点击 `Cells` 按钮。确保 **observed** 和 **expected** 计数已被勾选，并且 **row percentages**（因为我们想知道每个咨询师对应的男性和女性的百分比）。\n\
    \n   ![Screenshot 4.2](img/p65-1.jpg)\n\n   Screenshot 4.2\n\n4.  点击 **Continue**\
    \ 关闭此框。\n\n5.  点击 **Statistics** 标签页，在 **chi-square** 框中打勾。66 Page 66\n\n   ![Screenshot\
    \ 4.3](img/p66-1.jpg)\n\n   Screenshot 4.3\n\n6.  点击 **Continue**，然后点击 **OK**\
    \ 运行分析。\n\nSPSS 结果查看器应生成交叉表以及列出卡方检验及相关测试的表格。\n\n**注意**：SPSS 可能会生成一些包含各种统计数据的表格，这些表格的名称晦涩且可能与您的分析无关。卡方检验表只是一个温和的例子。关键是要知道您在寻找什么，这将在后面说明。\n\
    \n**表 4.6** 变量“性别”与“咨询师”的交叉表，包含期望计数\n\n| sex \\* counsellor Crosstabulation  |\n\
    \n| --- |\n\n|  || counsellor || Total |\n\n| --- | --- | --- |\n\n| John || Jane\
    \ |\n\n| sex || male || CountExpected Count% within sex || 106.571.4% || 47.528.6%\
    \ || 1414.0100.0% |\n\n|  || female || CountExpected Count% within sex || 47.525.0%\
    \ || 128.575.0% || 1616.0100.0% |\n\n| Total ||  || CountExpected Count% within\
    \ sex || 1414.046.7% || 1616.053.3% || 3030.0100.0% |\n\n表 4.6 标题为“性别与咨询师的交叉表”，列出了男性和女性的计数、期望计数以及性别内的百分比，以及列标题的总计值。列\
    \ 2 和列 3 分别列出了咨询师（John 和 Jane）及总计的对应值。\n\n67 Page 67 \n\n**表 4.7** 卡方检验表\n\n|\
    \ Chi-Square Tests |\n\n| --- |\n\n|  || Value || df || Asymp. Sig. (2-sided)\
    \ || Exact Sig. (2-sided) || Exact Sig. (1-sided) |\n\n| --- | --- | --- | ---\
    \ | --- | --- |\n\n| Pearson Chi-Square || 6.467^() || 1 || .011 ||  ||  |\n\n\
    | Continuity Correction ^() || 4.736 || 1 || .030 ||  ||  |\n\n| Likelihood Ratio\
    \ || 6.709 || 1 || .010 ||  ||  |\n\n| Fisher’s Exact Test ||  ||  ||  || .026\
    \ || .014 |\n\n| Linear-by-Linear ||  ||  ||  ||  ||  |\n\n| Association || 6.251\
    \ || 1 || .012 ||  ||  |\n\n| N of Valid Cases || 30 ||  ||  ||  ||  |\n\na.Computed\
    \ only for a 2x2 table\n\nb.0 cells (.0%) have expected count less than 5. The\
    \ minimum expected count is 6.53.\n\n表 4.7 标题为“卡方检验”，列出了包括 Pearson Chi-Square、连续校正、似然比等变量，以及对应的值、自由度、双侧显著性、双侧和单侧精确显著性等数据。\n\
    \n首先要注意的是脚注 (b)，它告诉我们“0 个单元的期望计数小于 5”。这是卡方检验的一个重要假设。如果您打算交叉表化数据并使用卡方统计量，您应该始终尝试确保样本量足够大，以便在单元中保持足够的值。\n\
    \n我们感兴趣的数值位于顶部的 **Pearson chi-square** 行。Pearson chi-square 值为 6.467，其显著性（p 值）为\
    \ .011。这意味着，根据卡方计算，这种分布的值仅有不到 1% 的概率是偶然发生的，即 p = .01。我们可以接受这些概率为统计显著性，并得出结论：患者的性别与其就诊的咨询师之间存在关系：男性患者更可能就诊于男性咨询师，女性患者更可能就诊于女性咨询师。^()\n\
    \n在向医生的报告中，您首先应指出，性别与咨询师的交叉表显示，相同性别的咨询师的就诊比例更高：71% 的男性患者就诊于 John；75% 的女性患者就诊于\
    \ Jane。随后，您应指出卡方统计量表明这种关联具有统计显著性：χ² = 6.467，p = .011。然后您可以进一步评论此结果，例如可能的解释。\n\n\
    ## 4.4 统计显著性水平\n\n在讨论卡方分析结果时，我们介绍了一个重要概念——统计显著性。研究中有一种惯例，即我们可以接受 5% 的概率（写作 0.05，即\
    \ 5/100 或 1/20）来判断如果实际上没有差异（即产生假阳性）时，是否有显著差异。\n\n实际上，卡方检验计算出的概率是 1/100（.01）该四个单元的分布可能是偶然发生的。换句话说，如果您有一个随机的彩票机将球分配到这四个单元中，这一结果在\
    \ 100 次试验中可能出现一次（使用 30 个球）。\n\n68 Page 68 \n\n我们当然应该根据情境调整可接受的统计显著性水平。例如，如果我们不想接受\
    \ 1/20（0.05）的概率认为实验药物有害副作用，但实际上它并没有真正降低疼痛的可能性：“根据我们的试验，它不降低疼痛的概率为 1/20，而我们观察到的阳性结果完全是偶然的。”在这种情况下，我们可能会希望将显著性水平提高到\
    \ 1/100（0.01）以上！\n\n然而，这也意味着我们需要在两者之间取得平衡。如果您将显著性标准设得太低，就会更有可能得出假阳性结论——即在实际上没有差异的情况下，认为存在显著差异。在我们的咨询案例中，这可能意味着主张按性别安排咨询师，而更大规模的研究可能会显示实际上并没有性别偏好。相反，如果标准设得太高，则更有可能得出假阴性结论——即认为没有差异，但实际上存在差异。这些在统计学中被称为\
    \ Type I（假阳性）和 Type II（假阴性）错误。\n\n这也引发了“力度”（power）和“效应大小”（effect size）的问题。想象两个实验。第一个实验旨在测试药物对人体的影响，已知该药在实验室和动物实验中具有高度毒性。我们需要多大的样本量？如果预期效果非常显著（如呕吐、痉挛等），我们希望样本量不大。也许在五个人服用药物、五个人服用安慰剂后，我们就能获得两组条件的有力数据。\n\
    \n但想象第二个实验，它使用问卷在咨询前后测量焦虑水平。研究者认为咨询会降低大多数患者的焦虑水平，但可能并不明显，且对某些患者来说，焦虑水平在面对问题时可能会上升。因此，预期的效果并不十分独特——因此需要更大的样本量以避免得出假阴性结论。这就是“力度计算”的基础：效应越小，所需的样本量就越大。\n\
    \n"
