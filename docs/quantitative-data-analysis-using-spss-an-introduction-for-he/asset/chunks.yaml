    \ on the next page) showed quite a strong positive correlation between height\
    \ and shoe size – the strength being determined by how tightly the plot forms\
    \ a line rising from left to right.\n\n## 5.2Examining correlations in the questionnaire\n\
    \nTurning to our questionnaire, we first need to identify two interval variables\
    \ that might be correlated. We have three to choose from:\n"
