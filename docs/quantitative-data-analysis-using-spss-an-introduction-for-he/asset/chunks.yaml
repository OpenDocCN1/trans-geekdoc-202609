- raw: "A table lists the patients numbered 1 to 10 in row 1, with their corresponding\
    \ age in row 2.\n\nYou then simply calculate the midpoint between these two central\
    \ values: (28+31)/2 = 29.5\n\n*The Mode*. The mode, which is generally of less\
    \ use, is simply the most frequently occurring value. In our age example above\
    \ that would be 23 – since 11 Page 11it occurs twice – all the other ages only\
    \ occur once. As an example, the mode might be useful for a shoe manufacturer\
    \ who wanted to know the most common shoe size of the population.\n\n*When should\
    \ I refer to the mean or the median?* In the data above, which provided the ages\
    \ of 11 patients ([Tables 1.5](#06_Chapter01.xhtml#tab1-5) and [1.6](#06_Chapter01.xhtml#tab1-6)),\
    \ we saw that the mean value was 32 years and the median age was just one year\
    \ younger at 31 years. So the two values are very similar. However, in some data\
    \ the mean and the median values might be quite different. Consider the following\
    \ example which shows the salary of employees at a small company:\n\n**Table 1.8**\
    \ Salary of employees at a small company\n\n| Employee: || 1 || 2 || 3 || 4 ||\
    \ **5** || 6 || 7 || 8 || 9 || Total |\n\n| --- | --- | --- | --- | --- | ---\
    \ | --- | --- | --- | --- | --- |\n\n| Salary: || 8,000 || 8,000 || 9,000 || 9,000\
    \ || **10,000** || 11,000 || 11,000 || 40,000 || 45,000 || 151,000 |\n\nA table\
    \ lists the employees numbered 1 to 9 in row 1, with their corresponding salaries\
    \ in row 2. The table also lists the total of salaries in column 10.\n\nHere,\
    \ whereas the median salary is £10,000, the mean actually works out at: £151,000/9\
    \ = £16,777. This is clearly not representative as a measure of central tendency\
    \ since the majority of employees (seven out of nine) get well below the mean\
    \ salary! From this example, we can see how a couple of extreme values can distort\
    \ the mean value of a dataset. In such cases we should cite the median which is\
    \ more representative.\n\nDarrell Huff (1991), in his classic short book *How\
    \ to Lie with Statistics*, points out that this ambiguity in the common use of\
    \ the term ‘average’ (a more-or-less typical centre value) is a common ploy in\
    \ the deceptive use of statistics. For example, a magazine may choose to cite\
    \ the larger mean (rather than median) income of their readers to make it look\
    \ like they have a wealthier readership, thus encouraging more advertising revenue.\
    \ In statistical terms the ‘ average’ will invariably be used to refer to the\
    \ arithmetic mean.\n\n*The normal distribution*. Statistically speaking, the mean\
    \ should be used when the data is normally distributed. For example, if we survey\
    \ 30 people coming out of a supermarket we might expect that there would be a\
    \ few very young and very old shoppers, but most people would be aged between,\
    \ say, 30–60 years. This is illustrated in [Figure 1.2](#06_Chapter01.xhtml#fig1-2).\n\
    \nHere we can see that most people are aged between 30 and 60, and the mean value\
    \ and median value are virtually identical: mean age = 40.5 years; median age\
    \ = 40 years.\n\nHowever, when the data is not normally distributed, when it is\
    \ skewed towards the lower or higher end, the mean and the median values are not\
    \ equivalent. So, if we turn back to our employee salaries example (with a larger\
    \ set of fictitious data), where a few employees get very high salaries, we might\
    \ find a distribution like the one illustrated in [Figure 1.3](#06_Chapter01.xhtml#fig1-3).\n\
    \nThis is known as a skewed distribution because the data is skewed to one end\
    \ of the scale – in this case it is ‘skewed off’ towards the higher end of the\
    \ salary scale – whereas the salary for most people, as illustrated by the median\
    \ value, is at this lower end of the scale.\n\nIt is important that we examine\
    \ the spread of interval data to see whether the mean or the median is the most\
    \ valid measure of central tendency. If we have 12 Page 12data that is markedly\
    \ skewed, then the mean value may not be a reliable measure. We shall see later\
    \ that a ‘normal’ or skewed distribution can also dictate which statistical test\
    \ we should use to analyse the data.\n\n![Figure 1.2Supermarket shoppers: age\
    \ normally distributed](Images/fig1-2.jpg)\n\n**Figure 1.2**Supermarket shoppers:\
    \ age normally distributed\n\n#### Section summary\n\nWe have thus far considered\
    \ the various ways of *describing* the data from the doctor’s questionnaire. We\
    \ have seen that categorical data may be described using frequencies and cross-tabulation,\
    \ and that interval data may be described using measures of central tendency:\
    \ the mean, median and mode. We have also seen that the validity of citing the\
    \ mean or the median depends on the distribution of the data. Where it is normally\
    \ distributed the mean can be used, but when data is extremely skewed to one end\
    \ of the scale, the median may be a more reliable measure of central tendency.\n\
    \n*How might we apply this to our counselling data?* Well, we might want to summarize\
    \ our interval data to answer the following questions:\n\n*   What was the mean\
    \ age of patients seen for counselling?\n\n*   What was the mean number of sessions?\n\
    \n*   Were most patients satisfied with the service? What was the mean score?\n\
    \n13 Page 13 ![Figure 1.3Employee salaries: skewed distribution](Images/fig1-3.jpg)\n\
    \n**Figure 1.3**Employee salaries: skewed distribution\n\nNotice that I have referred\
    \ to mean values in the above questions. The most appropriate measure of central\
    \ tendency should of course be used – the mean or the median – and this will depend\
    \ on the spread of the data. It is not unusual to find that both are cited to\
    \ demonstrate the reliability of the mean – or otherwise.\n\n### 1.2.2Relationships\
    \ and differences in the data\n\nThere are two further types of analyses that\
    \ we might conduct on interval data:\n\n*   Examine the *relationship* between\
    \ variables.\n\n*   Examine *differences* between two sets of scores.\n\n####\
    \ Examining relationships between variables with interval data: correlation\n\n\
    We have already looked at the relationship between items with *categorical* data\
    \ using cross-tabulation. For variables with interval data – such as age – we\
    \ can use another technique known as correlation.\n\n14 Page 14 \n\nA correlation\
    \ illustrates the direction and strength of a relationship between two variables.\
    \ For example, we might expect that height and shoe size are related – that taller\
    \ people have larger feet.\n\n[Figure 1.4](#06_Chapter01.xhtml#fig1-4) shows a\
    \ scatterplot of height and shoe size for 30 people, where we can see that, as\
    \ height increases, so does shoe size. This is known as a positive correlation:\
    \ the more tightly the plot forms a line rising from left to right, the stronger\
    \ the correlation.\n\n![Figure 1.4Positive correlation between height and shoe\
    \ size](Images/fig1-4.jpg)\n\n**Figure 1.4**Positive correlation between height\
    \ and shoe size\n\nA negative correlation is the opposite: high scores on one\
    \ variable are linked with low scores on another. For example, we might find a\
    \ negative correlation between IQ scores and the number of hours spent each week\
    \ watching reality TV shows, as illustrated in [Figure 5.1](#10_Chapter05.xhtml#fig5-1)\
    \ (hypothetical data).\n\nFrom this scatterplot we can discern a line descending\
    \ from left to right in the opposite direction to the height and shoe size plot.\n\
    \nFinally, we would probably not expect to find an association between IQ and\
    \ shoe size, as illustrated in [Figure 1.6](#06_Chapter01.xhtml#fig1-6), where\
    \ there is no discernible correlation between the two variables.^()\n\nIn [Chapter\
    \ 5](#10_Chapter05.xhtml) we will look at how to produce these scatterplots in\
    \ SPSS.\n\n*How might we apply this to our counselling data?* Well, first of all\
    \ we need to identify two interval variables that might be correlated. We have\
    \ three to choose from: age, number of counselling sessions and satisfaction ratings."
