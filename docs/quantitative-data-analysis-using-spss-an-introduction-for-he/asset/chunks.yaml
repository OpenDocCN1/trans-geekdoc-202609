    \ for Psychology. London: Duxbury Press.\n\n    *   Huff, D. (1991) How to Lie\
    \ with Statistics. London: Penguin.\n\n    *   Jamieson, S. (2004) Likert scales:\
    \ how to (ab)use them. Medical Education, 38: 1212–8.\n\n    *   Kendrick, T.\
    \ (2002) Depression. In Marshall, M.(Ed) Quality indicators for general practice.\
    \ London: Royal Society of Medicine Press, 28–37.\n\n    *   Kinnear, P. and Gray,\
    \ C. (2004) SPSS 12 Made Simple. Hove: Psychology Press.\n\n    *   Lyons, R.A.,\
