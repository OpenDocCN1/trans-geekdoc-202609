  fmt: '

    ## Figure 6.1 Choosing the appropriate statistical test for differences between
    two samples


    ### 6.2.1 Independent or related samples?


    The first thing we need to know is whether our data comes from two independent
    samples or two related samples. Related samples are those where the same people
    provide two sets of scores. For example, in our data the doctor might have asked
    patients to complete a mental health questionnaire measuring their levels of anxiety
    before and after counselling; the idea being to see if the counselling has any
    effect on the scores – hopefully reducing levels of anxiety/depression.


    It should be apparent then, that our data comparing patient satisfaction ratings
    for the two counsellors is not related. Rather, the satisfaction ratings for each
    counsellor will come from two independent groups of people: those patients who
    saw John and those who saw Jane.


    ### 6.2.2 Parametric or non-parametric test?


    Having followed the arrow in [Figure 6.1](#11_Chapter06.xhtml#fig6-1) to independent
    samples we now need to decide whether to use a test for parametric or non-parametric
    data.


    Parametric tests assume certain characteristics (parameters) of the population
    from which the sample is drawn. In general, parametric tests should only be used
    when the following conditions apply:


    1. Level of measurement is interval or ratio (more than ordinal).


    2. The scores approximate a normal distribution.


    3. The variance (spread of scores) within both groups is relatively similar (homogeneity
    of variance).


    Non-parametric tests do not depend on these assumptions. Wherever possible you
    should choose the parametric test because it is more powerful. This means that
    it is more sensitive than the non-parametric test in discerning significant differences
    in two scores.


    So, we know that our data is from independent samples, and we also know that it
    is interval (satisfaction ratings), what we next need to find out is whether or
    not the data is normally distributed. The simplest way to do this is by producing
    histograms to see if the data looks like it approximates a normal distribution.


    #### Producing histograms to check for normal distributions


    1. From the menu at the top of the screen click on Graphs then Chart Builder.


    2. Select Histogram from the Gallery and drag the first (Simple) Histogram into
    the preview area.


    3. Drag the variable satisfaction to the X-axis.


    4. Click Groups/Point ID and put a tick in the Rows panel ID checkbox.


    5. This will produce a Panel box to the right of the preview area. Drag the variable
    counsellor into the Panel box.


    6. Finally, to the right of your screen in the Element Properties section, place
    a tick in the box next to Display normal curve and then click Apply.


    7. Click OK.


    ![Screenshot 6.1](Images/ufig6-1.jpg)


    Screenshot 6.1


    This should produce the two histograms below with lines showing that the data
    is relatively normally distributed, with most of the scores in the middle, tailing
    off at either end.


    ![Figure 6.2 Histograms showing satisfaction ratings for each counsellor](Images/fig6-2.jpg)


    **Figure 6.2** Histograms showing satisfaction ratings for each counsellor


    Now, many researchers will be quite happy to visually examine the data from histograms
    to see that the data approximates a normal distribution and leave it at that.
    Remember, it just needs to approximate a normal distribution because the test
    is robust to ‘moderate departures’. But, as Field (2005) points out, this can
    be quite subjective and open to abuse (‘Well, it looked normal to me’). So, for
    a more objective measure of whether a distribution is normal we may refer to two
    further tests: Kolmogorov-Smirnov and Shapiro-Wilk. If the results of these tests
    are statistically significant then this suggests that the distribution deviates
    significantly from a normal distribution.


    #### Producing a test of normality


    1. From the menu at the top of the screen click on Analyze then Descriptives then
    Explore.


    2. Move satisfaction into the Dependent list and counsellor into the Factor list.


    3. Under Display ensure that there is only a tick next to Plots.


    4. Click on the Plots tab to open the plots dialogue box.


    5. Under Boxplots click None, and remove any ticks under Descriptive. Place a
    tick in Normality plots with tests. Under Spread vs Level tick none.


    6. Click Continue, then OK.


    ![A screenshot of the S P S S Data Editor window features the Explore and Explore:
    Plots dialog box.](Images/ufig6-2.jpg)


    [Follow for extended description](#Ext_desc_ufig6-2.xhtml#l_ufig6-2)


    This will produce an output table of the tests of normality along with a number
    of graphs. We will focus on the statistics in the table: since neither of these
    tests includes any significant results (0.05 or less in the sig. columns) this
    confirms our observations from the histograms, in other words, that our data is
    sufficiently normally distributed.


    **Table 6.1** Tests of normality


    | Tests of Normality | | Kolmogorov-Smirnov^() | Shapiro-Wilk |

    | --- | --- | --- | --- |

    | | | Statistic | df | Sig. | Statistic | df | Sig. |

    | satisfaction | John | .189 | 14 | .189 | .923 | 14 | .241 |

    | | Jane | .127 | 16 | .200 | .951 | 16 | .508 |


    A table titled tests of normality lists the satisfaction variable for counselors
    John and Jane in column 1. Columns 2 and 3 list the corresponding Kolmogorov-Smirnov
    and Shapiro-Wilk values, including the statistic value, degree of freedom, and
    significance value, respectively. This is a lower bound of the true significance.
    Lilliefors Significance CorrectionSo, having (thoroughly) checked that the data
    is normally distributed, we are able to follow the arrow in [Figure 6.1](#11_Chapter06.xhtml#fig6-1)
    to the (parametric) independent samples t-test.


    #### Running an independent samples t-test


    1. From the menu at the top of the screen click Analyze then Compare Means then
    Independent samples t-test.


    2. Move satisfaction into Test Variable.


    3. Move counsellor into Grouping Variable.


    4. Click Define Groups (since your Grouping Variable is counsellor, you need to
    specify a numerical value for each, in other words, 1 for John, 2 for Jane).


    5. Enter the value 1 (for John) in Group 1 and value 2 (for Jane) in Group 2.


    6. Click Continue then click OK.


    ![Screenshot 6.3](Images/ufig6-3.jpg)


    Screenshot 6.3


    You should then be presented with the following (rather scary) output.


    **Table 6.2** Group statistics


    | Group Statistics | | counsellor | N | Mean | Std. Deviation | Std. Error Mean
    |

    | --- | --- | --- | --- | --- | --- | --- |

    | satisfaction | John | 14 | 4.86 | 1.231 | .329 |

    | | Jane | 16 | 3.50 | 1.592 | .398 |


    A table titled group statistics lists the satisfaction variables for counselors
    John and Jane in column 1. Columns 2 to 5 list the corresponding N values, mean,
    standard deviation, and standard error mean.


    **Table 6.3** Independent samples test


    | Independent Samples Test | | Levene’s Test for Equality of Variances | t-test
    for Equality of Means |

    | --- | --- | --- | --- |

    | | | F | Sig. | t | df | Sig. (2-tailed) | Mean Difference | Std. Error Difference
    | Lower | Upper |

    '
