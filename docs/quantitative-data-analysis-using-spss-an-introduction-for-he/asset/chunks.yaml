    \n你可以一次性按多个变量进行排序。例如，你可以同时按 **sex** 和 **age** 对数据进行排序，但我们现在需要进入分析阶段。\n\n## Notes\n\
    \n1.  1 这里的数字 1 和 2 是任意指派的，并不代表男性和女性性别的重要性顺序。这一点需要说明，因为有学生在课堂上提出此问题，并进行了较长时间的讨论。...\n\
    \n2.  2 如果你有较长的问卷并决定为变量 q1、q2、q3 等进行标签，可使用 **Label** 设施。在 **Label** 列中提供每个问题的描述。例如，若我们在咨询问卷中采用此方法，q4\
    \ 的标签为‘咨询会话次数’，这样输出时会显示‘咨询会话次数’而非‘q4’，便于我们识别具体问题。此方法在较早的 SPSS 版本中更为常见，当时变量列受限于八个字符，常需使用缩写或难以辨认的名称。\n\
    \n3.  3 举例来说，我们可能想区分因患者拒绝回答敏感问题而导致的缺失值，以及因问题不适用于患者而导致的缺失值。此时需要在 **Missing** 单元格中点击，右侧会出现三个点的按钮，点击后弹出对话框，你可以输入缺失值。该值应位于变量可能出现的取值范围之外：99\
    \ 是常用的缺失值表示，但如果变量本身可能包含该值（例如年龄），则应选择更远的数值（999）。\n\n4.  4 请务必知道你保存的位置！曾有学生保存数据文件在大学网络上，后续无法定位。此外，如果你在大学或学院电脑上工作，应注意部分电脑在闲置一定时间后会自动“退出”。若未保存文件便离开电脑，数据在你返回时可能已经丢失。\n\
