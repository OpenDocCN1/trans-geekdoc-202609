    \ satisfied nor dissatisfied with the counselling, what number would you circle?\
    \ Hopefully, if you are thinking the same as 119 Page 119me, you would circle\
    \ the number 4 because it lies in the dead centre of the scale – with three numbers\
    \ to either side of it. So, if we accept that the number 4 can represent a ‘neutral’\
    \ attitude towards the counselling, then the numbers either side of it should\
    \ represent a ‘negative’ attitude or a ‘positive’ attitude. Hence, if I was completing\
    \ this rating scale I would circle the number 3 if I was mildly dissatisfied or\
    \ the number 5 if I was mildly satisfied.\n\n    On this basis we can re-code\
    \ the values as follows:\n\n    1.  1Negative (not satisfied): 1–3.\n\n    2.\
    \  2Neutral (neither satisfied nor dissatisfied): 4.\n\n    3.  3Positive (satisfied):\
    \ 5–7.\n\n    When you have re-coded the satisfaction rating into these categories\
    \ (**Transform / Recode into Different Variables**) and cross-tabulated with counsellor,\
    \ your table should look like this:\n\n    **Table X4.2b**Counsellor/satisfaction\
