- raw: "    When you paste it into a Microsoft Word document you will then be able\
    \ to edit the table. For example, you might want to remove the last two columns\
    \ since they do not provide useful information on this occasion. To do this, highlight\
    \ the last two columns and click the right mouse button:\n\n    56 Page 56 ![Screenshot\
    \ 3.21](Images/p56-1.jpg)\n\n    Screenshot 3.21\n\n    When you press Delete\
    \ Columns you will be left with a table that has no irrelevant information, which\
    \ may confuse the reader:\n\n    **Table 3.2**The edited table\n\n    |  || Frequency\
    \ || Percent |\n\n    | --- | --- | --- |\n\n    | Valid || male || 14 || 46.7\
    \ |\n\n    |  || female || 16 || 53.3 |\n\n    |  || total || 30 || 100.0 |\n\n\
    \    A table lists the variables, including the valid males, females, and total\
    \ in column 1. Columns 2 and 3 list the corresponding frequency and percentage\
    \ values.\n\n    ### 3.3.6Navigating the Output Viewer\n\n    You will now have\
    \ amassed a considerable number of analyses in your **Output Viewer**. Sometimes\
    \ it is useful to tidy up at this stage, perhaps removing any output analyses\
    \ that you no longer need. To do this click in the left-hand pane listing the\
    \ output to remove any analyses that you do not want to keep.\n\n    57 Page 57\
    \ ![Screenshot 3.22](Images/p57-1.jpg)\n\n    Screenshot 3.22\n\n    ## 3.4Summary\n\
    \n    In this chapter you have learnt:\n\n    *   How to produce frequencies for\
    \ categorical data.\n\n    *   When you should refer to the ‘valid per cent’ rather\
    \ than overall per cent, i.e., when there is missing data.\n\n    *   How to produce\
    \ measures of central tendency (means, medians and modes), and minimum and maximum\
    \ values, for interval data.\n\n    *   How to produce bar charts, histograms\
    \ and boxplots to visually illustrate the data.\n\n    *   How to copy your SPSS\
    \ output into a Microsoft Word document.\n\n    *   How to navigate the SPSS Output\
    \ Viewer.\n\n    You now have the skills to enter data into SPSS, code it, and\
    \ produce basic descriptive statistics for categorical and interval data.\n\n\
    \    58 Page 58 \n\n    ## 3.5Ending the SPSS session\n\n    When you want to\
    \ close SPSS simply go to **File/Exit.** You will then be prompted to ‘save contents\
    \ of the Output Viewer’. This allows you to save the tables and graphs in your\
    \ output to a separate file. You will then be prompted to save the data file.\n\
    \n    While it is very important to save the data file, it may be less important\
    \ to save the output file with your tables and graphs. For example, you may be\
    \ happy with a print out of your analyses, or you may have copied the relevant\
    \ tables and charts into a Microsoft Word document. As long as you have saved\
    \ the data file, it may be relatively simple to run the analyses again – depending\
    \ on how much you have done of course.\n\n    ## 3.6Exercises\n\n    ### Exercise\
    \ 3.1\n\n    You have already produced a histogram for the variable age. Now produce\
    \ histograms illustrating the distribution of sessions and satisfaction ratings.\
    \ What sort of distribution do they display? Is the data ‘normally distributed’?\n\
    \n    ### Exercise 3.2\n\n    Produce boxplots comparing satisfaction ratings\
    \ according to the gender of patients. What do you conclude from the results in\
    \ terms of: (a) the spread of the data for males compared to females; (b) the\
    \ relative satisfaction ratings of males compared to females?\n\n    Are you happy\
    \ with the chart or do you need to use Chart Editor?\n\n    ### Exercise 3.3\n\
    \n    There is a facility in SPSS that allows you to change the way your data\
    \ and outputs, (such as charts and tables) are displayed. One particularly relevant\
    \ option enables you to change the way tables are displayed in SPSS output. For\
    \ example, if you are intending to submit your report for publication in a journal\
    \ you may actually need to change the way your tables are displayed in accordance\
    \ with the journal guidelines.\n\n    In order to change the settings for tables,\
    \ click on **Edit** from the menu at the top of the screen and then choose **Options.**\
    \ You should then be presented with the following table on your screen:\n\n  \
    \  59 Page 59 ![Screenshot 3.23](Images/p59-1.jpg)\n\n    Screenshot 3.23\n\n\
    \    If you click on the **Pivot Tables** tab you can choose the format of your\
    \ tables. Clicking on the **Table look** provides a preview or sample of how the\
    \ tables will look. The three tables below are provided as examples:\n\n    **Table\
    \ 3.3**System default table: sex\n\n    | SEX  |\n\n    | --- |\n\n    |  || Frequency\
    \ || Percent || Valid Percent || Cumulative Percent |\n\n    | --- | --- | ---\
    \ | --- | --- |\n\n    | Valid || male || 820 || 38.8 || 38.8 || 38.8 |\n\n  \
    \  |  || female || 1295 || 61.2 || 61.2 || 100.0 |\n\n    |  || Total || 2115\
    \ || 100.0 || 100.0 ||  |\n\n    A table titled Sex lists the variables, including\
    \ the valid males, females, and total values in column 1. Columns 2 to 5 list\
    \ the corresponding frequency, percentage, valid percentage, and cumulative percentage\
    \ values.\n\n    You might want to choose **smallfont.tlo** to save paper when\
    \ printing out results of many analyses.\n\n    **Table 3.4**Smallfont.tlo: paper-saving\
    \ table (sex)\n\n    | SEX |\n\n    | --- |\n\n    |  || Frequency || Percent\
    \ || Valid Percent || Cumulative Percent |\n\n    | --- | --- | --- | --- | ---\
    \ |\n\n    | Valid || male || 820 || 38.8 || 38.8 || 38.8 |\n\n    |  || female\
    \ || 1295 || 61.2 || 61.2 || 100.0 |\n\n    |  || Total || 2115 || 100.0 || 100.0\
    \ ||  |\n\n    A table titled Sex lists the variables, including the valid males,\
    \ females, and total values in column 1. Columns 2 to 5 list the corresponding\
    \ frequency, percentage, valid percentage, and cumulative percentage values.\n\
    \n    60 Page 33 \n\n    Many journals use APA (American Psychological Association)\
    \ style which does not use vertical lines. So, if you want to import a table from\
    \ SPSS into a file you are submitting to a journal, you might use one of the academic\
    \ formats as in [Table 3.5](#08_Chapter03.xhtml#tab3-5).\n\n    **Table 3.5**academic\
    \ style table (sex)\n\n    | SEX |\n\n    | --- |\n\n    |  || Frequency || Percent\
    \ || Valid Percent || Cumulative Percent |\n\n    | --- | --- | --- | --- | ---\
    \ |\n\n    | Valid || male || 820 || 38.8 || 38.8 || 38.8 |\n\n    |  || female\
    \ || 1295 || 61.2 || 61.2 || 100.0 |\n\n    |  || Total || 2115 || 100.0 || 100.0\
    \ ||  |\n\n    A table titled Sex lists the variables, including the valid males,\
    \ females, and total values in column 1. Columns 2 to 5 list the corresponding\
    \ frequency, percentage, valid percentage, and cumulative percentage values.\n\
    \n    Note: You have to change the style *before* you run the analyses.\n\n  \
    \  ## 3.7Notes\n\n    1.  [1](#08_Chapter03.xhtml#ch3fn1a)Alternatively, you can\
    \ simply use the right mouse button to copy the chart straight from the output\
    \ viewer without going into Chart Editor. However, I find that this leaves a larger\
    \ frame around the chart taking up more space in the Microsoft Word document.\
    \ Try it and see for yourself.\n\n    61 Page 61 \n\n    # Chapter4 Cross-tabulation\
    \ and the chi-square statistic\n\n    In this chapter you will learn about cross-tabulation\
    \ for categorical data, a statistical test (chi-square) to examine associations\
    \ between variables and the concept of statistical significance. You will also\
    \ learn how to re-code interval data into categories.\n\n    ## 4.1Introduction\n\
    \n    Cross-tabulation is one of the most frequently used methods of analysis\
    \ for questionnaire data. It enables us to examine the relationship between categorical\
    \ variables in greater detail than simple frequencies for individual variables.\
    \ In this chapter we will see how to do this in SPSS and also apply a statistical\
    \ analysis associated with cross-tabulation – known as chi-square (pronounced\
    \ ‘kye square’).\n\n    ## 4.2Cross-tabulating data in the questionnaire\n\n \
    \   In our counselling satisfaction questionnaire we have only two categorical\
    \ variables: sex of the patient (male or female), and counsellor (John or Jane).\
    \ When we ran frequencies for these two variables in the previous chapter we obtained\
    \ the following results:"
