    `mean`


    The arithmetic mean is the most common measure of central tendency and is produced
    by calculating the sum of the values and then dividing by the number of values.


    `measures of central tendency`


    Measures of central tendency are used to provide the typical or average values
    for a sample of data, e.g., the mean age of the sample. The mean, median or mode
    may be used depending on the distribution of the data.


    `median`


    A measure of central tendency which is the midpoint of an ordered distribution
    of values.


    `mode`


    A measure of central tendency referring to the most frequently occurring value
    in a set of scores.


    `nominal data`


    This is another term for categorical data, whereby discrete categories may be
    nominated a numerical code, e.g., code male as 1 and female as 2.


    `non-parametric test`


    A statistical test which does not depend on the assumptions (parameters) required
    by parametric tests, e.g., normal distribution of data.


    `normal distribution`


    A frequency distribution where the majority of values are in the middle of the
    range, tailing off at either end of the scale producing a symmetrical bell shaped
    curve.


    `null hypothesis`


    This is the hypothesis that is proposed to be nullified or refuted, e.g., there
    will be no difference between the two samples.


    `one-tailed test`


    A test where the hypothesis predicts an effect in one direction, e.g., predicting
    that levels of anxiety will reduce as a result of counselling (compared to a 2-tailed
    test which abstains from making a directional prediction, i.e., that counselling
    will have an effect on levels of anxiety - but we cannot be certain if this will
    lead to a reduction or increase in levels of anxiety).


    `ordinal data`


    This is data that can be put into an ordered sequence. For example, the rank order
    of runners in a race – 1st, 2nd, 3rd.


    `outliers`


    Data which lies outside the majority of scores.


    `parametric statistics`


    Statistical tests that assume certain parameters of the data, e.g., a normal distribution.
    134 Page 134


    `power`


    This relates to the power of a statistical test to detect a statistically significant
    effect/difference if there really is one. The power of a statistical test to detect
    a difference may depend on sample size (the larger the better) and the size of
    the effect/difference that is being investigated.


    `probability`


    This refers to the likelihood of an event occurring by chance. If the event cannot
    happen the probability is zero; if the event is certain to happen the probability
    is one.


    `p value`


    This refers to the probability of the outcomes occurring by chance, expressed
    numerically as ranging from zero to one. The convention is to accept a p value
    of 0.05 or less as being statistically significant, which translates to a probability
    of 1 in 20 of the results occurring by chance.


    `ratio scale`


    A scale where points are separated by equal intervals with a true zero, e.g.,
    height, weight, age, length.


    `regression analysis`


    Regression analysis assesses the relationship between one or more dependent variables
    and independent variables in order to find a line that best predicts the relationship
    between the two. It is then possible to estimate values of a dependent variable
    from values of an independent variable.


    `related samples t-test`


    A statistical test used to determine whether the mean scores from two related
    samples differ significantly.


    `repeated measures design`


    Where two or more measures are taken from the same sample (in contrast to independent
    subjects design), e.g., levels of anxiety before and after counselling for a sample
    of patients.


    `standard deviation`


    A measure of the amount of deviation from the mean in a sample of scores.


    `statistical significance`


    An observation that is unlikely to have occurred by chance at a specified level
    of probability.


    `t-test`


    A statistical technique for examining differences in means between two samples.


    `two-tailed test`


    A test where the hypothesis does not specify a direction for the effect (non-directional),
    e.g., the treatment will have an effect but we cannot be certain if this will
    lead to an increase or decrease in patient ratings.


    `type I error`


    Essentially, accepting a statistical difference/effect when there really is not
    one (like a false-positive). In more formal terms it refers to a rejection of
    the null hypothesis (no difference) when it is in fact true.


    `type II error`


    Essentially, accepting the absence of a statistical difference or effect when
    there really is one (like a false-negative). In more formal terms, failing to
    reject the null hypothesis (no difference) when it should be rejected.


    `Wilcoxon test`


    A non-parametric statistical test to determine differences in two related samples.


