  trans: "\n-   相关性表 列出了用于皮尔逊相关性、双尾显著性值和 N 值的年龄变量和满意度变量（第 1 列）。第 2 列和第 3 列分别列出了对应的年龄和满意度数值。\n\
    \n\\* · 相关性在 0.05 水平（双尾）上显著。\n\n现在显而易见，你需要小心去除这类数据——你不能随意删除你不喜欢的数据！主要观点是，离群值（outliers）会对相关性的计算产生巨大影响。例如，下面的散点图显示两个变量之间不存在相关性。\n\
    \n![Figure X5.3bNo correlation: r = −.086](img/figX5-3b.jpg)\n\n**Figure X5.3b**No\
    \ correlation: r = −.086\n\n然而，当加入一个极端数据点——离群值——后，这会变成强烈的正相关！\n\n![Figure X5.3c\
    \ Strong positive correlation: r = .79](img/figX5-3c.jpg)\n\n**Figure X5.3c**\
    \ Strong positive correlation: r = .79\n\n因此，经验是：始终检查数据中的离群值（例如使用箱线图），并在进行相关性统计分析前绘制散点图以目视检查数据。\n\
    \n### 练习 5.4 解释以下相关性\n\n1.  (a) 报告称冰激凌销售与犯罪率之间存在强烈正相关。我们因此可以得出冰激凌导致犯罪的结论吗？\n\n\
    2.  (b) 报告称咨询次数与心理健康水平之间存在正相关。我们因此可以得出咨询有效，且咨询次数越多心理健康越好吗？\n\n3.  (c) 乳制品消费与癌症呈正相关。那么喝乳制品会导致癌症吗？\n\
    \n4.  (d) 研究发现吸烟与阿尔茨海默病痴呆之间呈负相关：吸烟次数增加会降低患阿尔茨海默病痴呆的风险。那么我们是否应该建议人们开始吸烟或增加烟支数量以预防阿尔茨海默病痴呆的发生？\n\
    \n#### 答案\n\n1.  (a) 除非冰激凌本身有什么特殊之处，否则这可能与气温有关：气温温暖晴朗时，外出的人数更多，饮酒人数更多，等等。\n\n\
    2.  (b) 这**可能**是事实，但我们真的能确定改善是由于咨询造成的吗？也许患者生活中的其他事件导致了健康状况的改善，或者改善反映了对特定创伤的正常恢复。想象相反的情形：你在测量患者在咨询前后的心理健康水平，发现其健康水平下降。再加上你发现咨询次数与心理健康水平呈负相关。此时，你会得出结论——咨询让人变差，且咨询越多，健康越差吗？\n\
    \n3.  (c) 另一种解释是，乳制品消费量的提升往往出现在更富裕的国家，那类人群寿命更长，因而更容易患癌症。\n\n4.  (d) 首先，这些研究由烟草行业资助，所提的结论是吸烟（或尼古丁）可能预防阿尔茨海默病痴呆的发生。问题在于，阿尔茨海默病痴呆是老年人群的疾病：90\
    \ 岁以上的人中有 50% 被诊断为阿尔茨海默病痴呆。该发现可能仅仅反映重度吸烟者寿命较短，因吸烟相关疾病而死亡，从而未能发展出阿尔茨海默病痴呆。\n\n\
    127 Page 127 \n\n## 第 6 章\n\n### 练习 6.1 检查其他显著差异\n\n本章我们主要关注两位咨询师的满意度评分和会话次数的差异。现在你可能想检查以下方面是否存在显著差异：\n\
    \n1.  (a) 两位咨询师所见患者的年龄；\n\n2.  (b) 男性和女性患者的满意度评分；\n\n3.  (c) 男性和女性患者的会话次数；\n\n\
    4.  (d) 男性和女性患者的年龄。\n\n请在运行相应的分析（即参数 t 检验或非参数曼·惠特尼 U 检验）前，检查数据的分布情况。\n\n#### 答案\n\
    \n对于这些练习，我均认为参数 t 检验是合适的，其结果如下：\n\n1.  (a) 两位咨询师所见患者的年龄：\n\n    *   John 所见患者的平均年龄\
    \ = 32.8 岁；\n\n    *   Jane 所见患者的平均年龄 = 37.3 岁；\n\n    *   t 检验结果：t = −1.725，p\
    \ = .096。不显著。\n\n2.  (b) 男性和女性患者的满意度评分：\n\n    *   男性的平均满意度评分 = 4.57；\n\n    *\
    \   p = .156。不显著。\n\n3.  (c) 男性和女性患者的会话次数：\n\n    *   男性患者的平均会话次数 = 8.29；\n\n\
    \    *   女性患者的平均会话次数 = 6.56；\n\n    *   t = 2.13，p = .042。\n\n    因此，我们可以得出结论：男性患者参加的会话次数多于女性患者。但这可能是因为男性患者本身需要更多会话，还是因为更多患者就诊于\
    \ John（他倾向于提供更多会话）……？\n\n4.  (d) 男性和女性患者的年龄：\n\n    *   男性患者的平均年龄 = 31.3 岁；\n\n\
    \    *   女性患者的平均年龄 = 38.6 岁；\n\n    *   t = −3.075，p = .005。\n\n    因此，我们可以得出结论：女性患者的年龄普遍高于男性患者。但这对整体结论有何意义仍不明确——并非所有显著差异都是有意义的差异………\n\
    \n### 练习 6.2 创建新变量以分析同性满意度评分\n\n在 第 4 章 中，交叉表显示大多数男性患者（71%）就诊于 John，而大多数女性患者（75%）就诊于\
    \ Jane。我们 128 Page 128 指出，这可能对医生很重要，因为这可能意味着需要提供男性和女性咨询师，以满足患者的偏好，即同性患者与同性咨询师的偏好。\n\
    \n好奇的你可能会想知道这对咨询关系是否有影响，例如：同性患者–咨询师会话的满意度评分是否高于异性患者–咨询师会话的满意度评分？\n\n下面是一个提示：你首先需要创建一个新变量（使用\
    \ **Transform/Compute**），该变量记录患者是否就诊于同性咨询师。随后，你可以将该新变量作为自变量（分组变量）来比较两组的平均满意度评分。\n\
    \n#### 答案\n\n1.  1 从屏幕顶部的菜单中选择 **Transform/Compute Variable**。\n\n2.  2 在 **Target\
    \ Variable**（目标变量）框中输入你将创建的新变量的名称。我选择的名称是 **‘samesex’**。\n\n3.  3 在 **Numeric\
    \ Expression**（数值表达式）框中输入规则，用于记录患者是否就诊于同性咨询师。\n\n    在我们的数据中，男性患者的性别变量编码为 1，男性咨询师（John）的编码也为\
    \ 1；同样，女性患者和女性咨询师（Jane）的编码均为 2。因此，我们需要选择性别变量的数值与咨询师变量的数值相同的情况——即男性患者与男性咨询师，或女性患者与女性咨询师。这样即可判断是否为同性会话。\
    \ \n"
