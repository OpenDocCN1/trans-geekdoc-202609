- raw: "    3.  [3](#11_Chapter06.xhtml#ch06fn3)You can obtain the median values by\
    \ going to: **Analyze** then **Compare Means** then **Means**. In the **Means**\
    \ box put **sessions** in the **Dependent List** and **counsellor** in the **Independent\
    \ List**. Next, click on **Options** where you will see a list of statistics available;\
    \ select **median** and move it to the **Cell Statistics** box, click **Continue**,\
    \ then **OK**.\n\n    103 Page 103 \n\n    # Chapter7 Reporting the results and\
    \ presenting the data\n\n    In this final chapter we will look at how to structure\
    \ the report of a quantitative study and how not to present data.\n\n    ## 7.1Introduction\n\
    \n    Congratulations, you have done the easy bit – analysing the data – now comes\
    \ the difficult part: writing-up the results.\n\n    Overall, the key criteria\
    \ for good scientific writing are accuracy, clarity and structure, but you should\
    \ also try to make it an interesting story, rather than a ‘dry’ listing of statistics\
    \ and outcomes. In order to achieve clarity, you might imagine that you have been\
    \ commissioned to produce the report for a professional who knows very little\
    \ about the subject or research methods – in this case the doctor who has asked\
    \ you to analyse the data. As regards structuring the report, fortunately, there\
    \ are established guidelines on how to organize the results of a research study.\n\
    \n    ## 7.2Structuring the report\n\n    A quantitative research report should\
    \ generally include the following sections:\n\n    1.  1Abstract.\n\n    2.  2Introduction.\n\
    \n    3.  3Methods.\n\n    4.  4Results.\n\n    5.  5Discussion.\n\n    6.  6Conclusion.\n\
    \n    7.  7Appendices.\n\n    8.  8References.\n\n    ### The abstract\n\n   \
    \ An abstract is a brief, concise summary of a study, usually limited to 200–300\
    \ words. It is usually the last part of the report to be written (since you need\
    \ to know what you have said in order to provide the summary), and should include\
    \ the following information:\n\n    *   brief background to the research;\n\n\
    \    *   purpose/aims of the study;\n\n    *   methods used and the sample;\n\n\
    \    *   brief conclusions outlining the importance of the study.\n\n    104 Page\
    \ 104 \n\n    The role of the abstract is to give the reader sufficient information\
    \ about the study, the essential details, to enable them to decide if they wish\
    \ to read the full report.\n\n    ### The introduction\n\n    The introduction\
    \ should provide a background to the research, specify the issue that is being\
    \ addressed and review relevant previous research. For studies relating to health\
    \ and social care, relevant policy documents are often cited to situate the study\
    \ in the wider health and social context, with some indication of the extent of\
    \ the problem. This approach is illustrated in the (rather excellent) example\
    \ provided in [Box 7.1](#12_Chapter07.xhtml#box7-1).\n\n    The introduction may\
    \ then close by outlining the aims and objectives of the study (research questions,\
    \ hypotheses) if these have not been dealt with in a separate section.\n\n   \
    \ ### Methods\n\n    The key to the methods section is clarity and specificity,\
    \ such that a reader could replicate the method and procedure of your study from\
    \ the information you provide in the report. So we are talking about a very detailed\
    \ account which should cover:\n\n    1.  1*Study design*: What is the overall\
    \ methodology or design of the study? For example, is it an experiment (with independent\
    \ and dependent variables), a questionnaire study, a qualitative study consisting\
    \ of a series of interviews or focus groups, etc.?\n\n    2.  2*The participants*:\
    \ What is the sampling frame (target sample, e.g., all patients who attend for\
    \ counselling during one year at a general practice), sampling method (random,\
    \ quota, all) and sample size? This may need to include demographic information\
    \ (age, sex, ethnic background, etc.).\n\n    3.  3*The materials*: What materials\
    \ were used in the study to conduct the research and collect data? For example,\
    \ details of a questionnaire or other outcome measures may be provided in an appendix.\
    \ If you are using a standardized outcome measure, for example, to measure health\
    \ and quality of life, you should also provide details of its relevance to your\
    \ particular study including details of reported reliability and validity (reliability\
    \ refers to the consistency of the measure over time or with different samples;\
    \ validity refers to the extent to which it measures what it is supposed to be\
    \ measuring, e.g., levels of anxiety or depression).\n\n    4.  4*The procedure*:\
    \ How was the study actually conducted? For example, if the study involved a questionnaire,\
    \ how was it distributed to participants? Was it posted to participants who completed\
    \ it then returned it, or was it completed in the presence of the researcher?\
    \ (Studies have shown that the way in which a questionnaire is administered –\
    \ self-completion, interview, etc. – can influence the responses (Lyons *et al*.\
    \ 1999)). Remember, the reader should be able to replicate your procedure based\
    \ on the details you provide in the report.\n\n    ### Results\n\n    The results\
    \ should be presented as simply and clearly as possible. Make use of graphs and\
    \ tables that help to present and explain the results. Where descriptive and inferential\
    \ statistics are used to analyse the data, you should:\n\n    106 Page 106 \n\n\
    \    *   name the statistic used;\n\n    *   report the statistical significance\
    \ of the results obtained;\n\n    *   indicate that all necessary assumptions\
    \ were met (e.g., that data were normally distributed if using a t-test).\n\n\
    \    It is also important for the report to have a logical structure. A good way\
    \ to do this is to pose research questions or hypotheses which are then either\
    \ confirmed or not by the data. You can then add words and phrases like surprisingly’,\
    \ as expected’ or as predicted’ when presenting the results of analysis. This\
    \ makes the text more interesting than simply listing a ream of analyses; it turns\
    \ the report into a story with twists and turns.\n\n    Graphs, figures and tables\
    \ should be comprehensible without reference back to the text, so they should\
    \ be clearly numbered and headed, and fully labelled with all units of measurement.\
    \ They should only be included where they serve to enhance understanding of the\
    \ results. Within the text you should lead the reader through the table or figure\
    \ drawing attention to the relevant data. The reader should not turn the page\
    \ and suddenly be confronted with a figure floating in the air: introduce the\
    \ figure in the text and then explain it.\n\n    If you detect a note of frustration\
    \ here, you would be correct. It comes from marking numerous assignments where\
    \ these guidelines have been ignored; I have included some examples of charts\
    \ from past assignments in the final section of this chapter which serve to illustrate\
    \ how *not* to present data.\n\n    ### Discussion\n\n    The discussion section\
    \ should provide an interpretation and explanation of the results which should\
    \ be related to any research questions or hypotheses. It should also include critical\
    \ reflections on the study (e.g., design of the questionnaire, relevance of outcome\
    \ measures, limitations for generalizing due to small sample sizes).\n\n    ###\
    \ Conclusion\n\n    The conclusion should include general implications of the\
    \ study and suggestions or recommendations for further research.\n\n    ### Appendices\n\
    \n    These should include any instruments used – such as the questionnaire.\n\
    \n    ### References\n\n    A full list of references should be included (written\
    \ in the appropriate academic style). This shows that you have consulted the relevant\
    \ literature and acknowledged the sources of your work. It also enables the reader\
    \ to consult the work you have cited if they wish.107Page 107\n\n    ## 7.3How\
    \ *not* to present data"
  fmt: "\n3.  [3](#11_Chapter06.xhtml#ch06fn3)You can obtain the median values by\
    \ going to: `Analyze` then `Compare Means` then `Means`. In the `Means` box put\
    \ `sessions` in the `Dependent List` and `counsellor` in the `Independent List`.\
    \ Next, click on `Options` where you will see a list of statistics available;\
    \ select `median` and move it to the `Cell Statistics` box, click `Continue`,\
    \ then `OK`.\n\n103 Page 103 \n\n# Chapter7 Reporting the results and presenting\
    \ the data\n\nIn this final chapter we will look at how to structure the report\
    \ of a quantitative study and how not to present data.\n\n## 7.1Introduction\n\
    \nCongratulations, you have done the easy bit – analysing the data – now comes\
    \ the difficult part: writing-up the results.\n\nOverall, the key criteria for\
    \ good scientific writing are accuracy, clarity and structure, but you should\
    \ also try to make it an interesting story, rather than a ‘dry’ listing of statistics\
    \ and outcomes. In order to achieve clarity, you might imagine that you have been\
    \ commissioned to produce the report for a professional who knows very little\
    \ about the subject or research methods – in this case the doctor who has asked\
    \ you to analyse the data. As regards structuring the report, fortunately, there\
    \ are established guidelines on how to organize the results of a research study.\n\
    \n## 7.2Structuring the report\n\nA quantitative research report should generally\
    \ include the following sections:\n\n1.  1Abstract.\n\n2.  2Introduction.\n\n\
    3.  3Methods.\n\n4.  4Results.\n\n5.  5Discussion.\n\n6.  6Conclusion.\n\n7. \
    \ 7Appendices.\n\n8.  8References.\n\n### The abstract\n\nAn abstract is a brief,\
    \ concise summary of a study, usually limited to 200–300 words. It is usually\
    \ the last part of the report to be written (since you need to know what you have\
    \ said in order to provide the summary), and should include the following information:\n\
    \n*   brief background to the research;\n\n*   purpose/aims of the study;\n\n\
    *   methods used and the sample;\n\n*   brief conclusions outlining the importance\
    \ of the study.\n\n104 Page 104 \n\nThe role of the abstract is to give the reader\
    \ sufficient information about the study, the essential details, to enable them\
    \ to decide if they wish to read the full report.\n\n### The introduction\n\n\
    The introduction should provide a background to the research, specify the issue\
    \ that is being addressed and review relevant previous research. For studies relating\
    \ to health and social care, relevant policy documents are often cited to situate\
    \ the study in the wider health and social context, with some indication of the\
    \ extent of the problem. This approach is illustrated in the (rather excellent)\
    \ example provided in [Box 7.1](#12_Chapter07.xhtml#box7-1).\n\nThe introduction\
    \ may then close by outlining the aims and objectives of the study (research questions,\
    \ hypotheses) if these have not been dealt with in a separate section.\n\n###\
    \ Methods\n\nThe key to the methods section is clarity and specificity, such that\
    \ a reader could replicate the method and procedure of your study from the information\
    \ you provide in the report. So we are talking about a very detailed account which\
    \ should cover:\n\n1.  1*Study design*: What is the overall methodology or design\
    \ of the study? For example, is it an experiment (with independent and dependent\
    \ variables), a questionnaire study, a qualitative study consisting of a series\
    \ of interviews or focus groups, etc.?\n\n2.  2*The participants*: What is the\
    \ sampling frame (target sample, e.g., all patients who attend for counselling\
    \ during one year at a general practice), sampling method (random, quota, all)\
    \ and sample size? This may need to include demographic information (age, sex,\
    \ ethnic background, etc.).\n\n3.  3*The materials*: What materials were used\
    \ in the study to conduct the research and collect data? For example, details\
    \ of a questionnaire or other outcome measures may be provided in an appendix.\
    \ If you are using a standardized outcome measure, for example, to measure health\
    \ and quality of life, you should also provide details of its relevance to your\
    \ particular study including details of reported reliability and validity (reliability\
    \ refers to the consistency of the measure over time or with different samples;\
    \ validity refers to the extent to which it measures what it is supposed to be\
    \ measuring, e.g., levels of anxiety or depression).\n\n4.  4*The procedure*:\
    \ How was the study actually conducted? For example, if the study involved a questionnaire,\
    \ how was it distributed to participants? Was it posted to participants who completed\
    \ it then returned it, or was it completed in the presence of the researcher?\
    \ (Studies have shown that the way in which a questionnaire is administered –\
    \ self-completion, interview, etc. – can influence the responses (Lyons *et al*.\
    \ 1999)). Remember, the reader should be able to replicate your procedure based\
    \ on the details you provide in the report.\n\n### Results\n\nThe results should\
    \ be presented as simply and clearly as possible. Make use of graphs and tables\
    \ that help to present and explain the results. Where descriptive and inferential\
    \ statistics are used to analyse the data, you should:\n\n106 Page 106 \n\n* \
    \  name the statistic used;\n\n*   report the statistical significance of the\
    \ results obtained;\n\n*   indicate that all necessary assumptions were met (e.g.,\
    \ that data were normally distributed if using a t-test).\n\nIt is also important\
    \ for the report to have a logical structure. A good way to do this is to pose\
    \ research questions or hypotheses which are then either confirmed or not by the\
    \ data. You can then add words and phrases like surprisingly’, as expected’ or\
    \ as predicted’ when presenting the results of analysis. This makes the text more\
    \ interesting than simply listing a ream of analyses; it turns the report into\
    \ a story with twists and turns.\n\nGraphs, figures and tables should be comprehensible\
    \ without reference back to the text, so they should be clearly numbered and headed,\
    \ and fully labelled with all units of measurement. They should only be included\
    \ where they serve to enhance understanding of the results. Within the text you\
    \ should lead the reader through the table or figure drawing attention to the\
    \ relevant data. The reader should not turn the page and suddenly be confronted\
    \ with a figure floating in the air: introduce the figure in the text and then\
    \ explain it.\n\nIf you detect a note of frustration here, you would be correct.\
    \ It comes from marking numerous assignments where these guidelines have been\
    \ ignored; I have included some examples of charts from past assignments in the\
    \ final section of this chapter which serve to illustrate how *not* to present\
    \ data.\n\n### Discussion\n\nThe discussion section should provide an interpretation\
    \ and explanation of the results which should be related to any research questions\
    \ or hypotheses. It should also include critical reflections on the study (e.g.,\
    \ design of the questionnaire, relevance of outcome measures, limitations for\
    \ generalizing due to small sample sizes).\n\n### Conclusion\n\nThe conclusion\
    \ should include general implications of the study and suggestions or recommendations\
    \ for further research.\n\n### Appendices\n\nThese should include any instruments\
    \ used – such as the questionnaire.\n\n### References\n\nA full list of references\
    \ should be included (written in the appropriate academic style). This shows that\
    \ you have consulted the relevant literature and acknowledged the sources of your\
    \ work. It also enables the reader to consult the work you have cited if they\
    \ wish.107Page 107\n\n## 7.3How *not* to present data\n"
  trans: "\n3.  3 你可以通过以下步骤获得中位数值：`Analyze` 然后 `Compare Means` 然后 `Means`。在 `Means`\
    \ 框中，将 `sessions` 放入 `Dependent List`，将 `counsellor` 放入 `Independent List`。接着，点击\
    \ `Options`，在可用的统计数据列表中选择 `median`，并将其移动到 `Cell Statistics` 框中，点击 `Continue`，然后点击\
    \ `OK`。\n\n103 Page 103 \n\n# Chapter7 Reporting the results and presenting the\
    \ data\n\n在本章最后，我们将探讨如何组织定量研究的报告以及如何展示数据。\n\n## 7.1Introduction\n\n恭喜，你已经完成了数据分析的轻松部分——现在最困难的任务来了：撰写结果。\n\
    \n总体而言，良好科学写作的关键标准是准确性、清晰度和结构，但你也应该尝试将其写成一个有趣的故事，而不是对统计数据和结果的‘干巴巴’列举。为了实现清晰度，你可以想象自己受雇为一位对主题或研究方法知之甚少的专业人士（例如，一位医生）来撰写报告。关于报告结构，好消息是，已有既定的指南说明如何组织研究结果。\n\
    \n## 7.2Structuring the report\n\n定量研究报告通常应包括以下章节：\n\n1.  1Abstract。\n\n2.  2Introduction。\n\
    \n3.  3Methods。\n\n4.  4Results。\n\n5.  5Discussion。\n\n6.  6Conclusion。\n\n7.\
    \  7Appendices。\n\n8.  8References。\n\n### The abstract\n\n摘要是对研究的简要、简洁总结，通常限制在\
    \ 200–300 词以内。它通常是报告的最后部分撰写（因为你需要先了解自己说了什么，才能提供摘要），并应包含以下信息：\n\n*   研究的简要背景；\n\
    \n*   研究的目的/旨；\n\n*   使用的方法和样本；\n\n*   简要结论，阐述研究的重要性。\n\n104 Page 104 \n\n摘要的作用是让读者获得关于研究的足够信息，了解基本细节，从而决定是否阅读完整报告。\n\
    \n### The introduction\n\n引言应提供研究背景，明确所要解决的问题，并回顾相关的已有研究。对于涉及健康和社会护理的研究，常常会引用相关的政策文件，以将研究置于更广阔的健康和社会背景中，并指示问题的程度。下图（相当出色的）示例在\
    \ Box 7.1 中展示了这种做法。\n\n如果引言中未在单独章节处理，则应在此处阐明研究的旨和目标（研究问题、假设）。\n\n### Methods\n\
    \n方法章节的关键是清晰和具体，使读者能够根据报告中提供的信息复制你的研究方法和过程。因此，我们谈论的是一份非常详细的描述，应涵盖：\n\n1.  1*Study\
    \ design*: 研究的总体方法或设计是什么？例如，是实验（包含自变量和因变量）、问卷研究，还是由一系列访谈或焦点小组组成的定性研究等？\n\n2. \
    \ 2*The participants*: 样本框架（目标样本，例如，一年内就诊的所有咨询患者）、抽样方法（随机、配额、全部）和样本量？这可能需要包括人口学信息（年龄、性别、种族背景等）。\n\
    \n3.  3*The materials*: 研究中使用了哪些材料来进行研究和收集数据？例如，问卷或其他测量工具的细节可能在附录中说明。如果你使用标准化测量工具（例如，用于测量健康相关生活质量），应说明其与研究的相关性，并提供其可靠性和效度的相关信息（可靠性指随时间或不同样本一致性；效度指其测量的是所设定的内容，例如焦虑或抑郁水平）。\n\
    \n4.  4*The procedure*: 研究是如何实际进行的？例如，如果研究涉及问卷，问卷是如何分发给参与者的？是邮寄给参与者让其完成后返回，还是在研究者在场下完成？研究表明，问卷的完成方式（自行填写、面谈等）会影响回答（Lyons\
    \ *et al*. 1999）。请记住，读者应能根据报告中提供的细节复制你的研究过程。\n\n### Results\n\n结果应以简洁明了的方式呈现。利用图表和表格帮助展示和解释结果。当使用描述性和推断性统计来分析数据时，你应：\n\
    \n106 Page 106 \n\n*   明确所使用的统计方法；\n\n*   报告结果的统计显著性；\n\n*   指出所有必要的假设均已满足（例如，使用\
    \ t-test 时数据正态分布）。\n\n报告也应具有逻辑结构。良好的做法是提出研究问题或假设，然后由数据确认或否定。你可以在呈现分析结果时加入“surprisingly’、‘as\
    \ expected’ 或‘as predicted’ 等词汇和短语。这比单纯列举分析内容更具吸引力，使报告成为一个充满曲折的故事。\n\n图表、图形和表格应在不回到正文的情况下让读者理解，因此应清晰编号、标题，并完整标注所有测量单位。仅在能够增强结果理解时才包括它们。在正文中，应引导读者查看表格或图形，并指向相关数据。读者不应翻页时突然看到一个“漂浮”在空中的图形：在正文中先引入图形，然后解释它。\n\
    \n如果你感到沮丧，那是因为你在批改大量作业时发现这些指南被忽视了；我在本章末尾提供了一些过去作业中图表的示例，以展示如何*不*正确地展示数据。\n\n###\
    \ Discussion\n\n讨论章节应对结果进行解释和说明，并与任何研究问题或假设相关联。它还应包括对研究的批判性反思（例如，问卷设计、结果测量的相关性、因样本量小而难以推广的局限性）。\n\
    \n### Conclusion\n\n结论应包含研究的一般意义，并给出进一步研究的建议或推荐。\n\n### Appendices\n\n这些部分应包含所使用的仪器，如问卷。\n\
    \n### References\n\n应包含完整的参考文献列表（使用适当的学术格式）。这表明你已查阅相关文献并承认你的工作的来源，同时也让读者可以查阅你引用的工作。\n\
    \n## 7.3How *not* to present data\n\n"
