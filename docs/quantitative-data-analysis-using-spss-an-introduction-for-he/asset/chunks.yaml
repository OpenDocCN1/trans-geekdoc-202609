- raw: "    Re-code the data for satisfaction ratings into categories representing\
    \ ‘positive’, ‘negative’ and ‘neutral’ ratings. Cross-tabulate this new variable\
    \ with ‘counsellor’ then ‘sex’. What is the best way to categorize satisfaction\
    \ ratings into these categories? What do these cross-tabulations show?\n\n   \
    \ ### Exercise 4.3 Can you do a chi-square with just this data?\n\n    Imagine\
    \ that the doctor had managed to do some of his own analysis and came to you for\
    \ some specific advice. He has actually counted up the number of patients who\
    \ came to see John and Jane and noticed that the majority of males saw John and\
    \ the majority of females saw Jane. He shows you this in the following table:\n\
    \n    74 Page 74 \n\n    **Table 4.9**Number of patients who have seen each counsellor\n\
    \n    |  || John || Jane || Total |\n\n    | --- | --- | --- | --- |\n\n    |\
    \ Male || 10 || 4 || 14 |\n\n    | Female || 4 || 12 || 16 |\n\n    | Total ||\
    \ 14 || 16 || 30 |\n\n    A table lists the sex of patients and total in column\
    \ 1. Columns 2 to 4 list the corresponding number of patients for counselors John,\
    \ Jane, and total.\n\n    And while the doctor is quite pleased with this table,\
    \ he wants to know if there is a statistic you can do on this data.\n\n    > ‘Sure\
    \ there is,’ you say, ‘it’s called chi-square’.\n\n    > \n\n    > ‘That’s great\
    \ you’re so knowledgeable,’ replies the doctor, ‘can you put these figures into\
    \ your computer and tell me what the chi-square statistic says?’\n\n    Well,\
    \ can you?\n\n    Now you might be thinking, as I did for years, that you would\
    \ need to enter all the raw data for the 30 patients into SPSS to do a chi-square.\
    \ Well you would be wrong! Here is how you do it:\n\n    1.  1Open a new file\
    \ and in **Variable View** create variables for ‘sex’ and ‘counsellor’; these\
    \ should be ‘string variables’. Then create a third variable (numeric) for the\
    \ observed frequencies.\n\n        You should then enter the data from the above\
    \ table using a row for each combination of the two categories; then for each\
    \ combination you enter the frequencies as illustrated below:\n\n        ![Screenshot\
    \ 4.9](Images/p74-1.jpg)\n\n        Screenshot 4.9\n\n    2.  2Now, and here is\
    \ the clever bit, we need to tell SPSS that the numbers in the frequencies column\
    \ represent the total number of observations for that combination of categories\
    \ (they are not just values for another variable). To do this you have to go to\
    \ **Data / Weight Cases,** then select **Weight cases by,** and move **frequencies**\
    \ into the **Frequency Variable** box: 75 Page 75\n\n        ![Screenshot 4.10](Images/p75-1.jpg)\n\
    \n        Screenshot 4.10\n\n    3.  3When you have done this, click **OK** and\
    \ you can run your chi-square test as described earlier in this chapter. It is\
    \ so much easier than entering all the raw data.\n\n    ## 4.8Notes\n\n    1.\
    \  [1](#09_Chapter04.xhtml#ch4fn1a)This information might also be relevant for\
    \ any further analysis. For example, if we found that one counsellor received\
    \ higher satisfaction ratings than the other, it could be that females are more\
    \ generous in their ratings than males. It could even be that same-sex patients\
    \ and counsellors worked best – achieving the highest satisfaction ratings. It\
    \ is factors like these that need to be investigated in quantitative data analysis.\n\
    \n    2.  [2](#09_Chapter04.xhtml#ch4fn2a)Expected frequencies for each cell are\
    \ calculated by multiplying row total by column total and dividing by the grand\
    \ total. So, the expected frequency for the top right cell in [Table 4.4](#09_Chapter04.xhtml#tab4-4)\
    \ (50) is arrived at through the following calculation: (100 × 100)/200 = 50.\
    \ The same values apply to all the cells in this table of course.\n\n    3.  [3](#09_Chapter04.xhtml#ch4fn3a)What\
    \ is a large enough sample size? Well, for this chi-square our sample of 30 was\
    \ just enough given the distribution of the male and female patients. One source\
    \ recommends a sample of at least 50 (Watson *et al*. 2006), but the point is\
    \ that you need to maintain sufficient numbers in each of the cells, so the sample\
    \ needs to be fairly evenly distributed across the categories.\n\n    4.  [4](#09_Chapter04.xhtml#ch4fn4a)Some\
    \ authors recommend citing the more conservative continuity correction (second\
    \ line down in the table) for 2×2 tables like this one (i.e. two row categories\
    \ – male/female, and two column categories – John/Jane), but Pett (1997: 163)\
    \ and Howell (1997: 149) advise against citing this value. Some authors also suggest\
    \ that where expected frequencies are less than 5 in 2×2 tables, we can cite the\
    \ more conservative Fisher’s Exact Test (fourth line down in the table) instead\
    \ of the Pearson chi-square value (Pett 1997; Kinnear and Gray 2004). However,\
    \ Howell (1997: 152) points out that the chi-square is robust to violations from\
    \ small sample sizes and is unlikely to produce false positive results (i.e.,\
    \ concluding a significant difference when there is not one). Indeed, the problem\
    \ with small sample sizes is that they are more likely to have insufficient numbers\
    \ (or ‘power’) to show a significant difference. 76 Page 76\n\n    5.  [5](#09_Chapter04.xhtml#ch4fn5a)There\
    \ are techniques (and some computer programs) to determine sample sizes that rely\
    \ on estimates of effect from previous similar research using similar outcome\
    \ measures. The idea being that if we know the size of the effect to expect from\
    \ previous studies then we can calculate the size of the sample needed to ensure\
    \ a sufficient sample size to detect significant differences if they exist. This\
    \ is beyond the scope of this book but for a relatively simple estimate of sample\
    \ sizes needed, Cohen (1988) includes some tables which enable you to estimate\
    \ sample size depending on the size of the effect you want to detect. ‘The size\
    \ of the effect you want to detect’ requires a decision on your part as to what\
    \ constitutes a meaningful difference. For example, if you are evaluating the\
    \ effect of a counselling service on patients mental health, then you need to\
    \ decide what would constitute a meaningful improvement in mental health on your\
    \ outcome measure. If the scale goes from 1–100, where 100 represents optimum\
    \ mental well-being, what do you consider is a minimally important clinical difference\
    \ on the scale to signal real improvement in mental health? If you agree that\
    \ it is a rise of ten points on the scale then that is the size of the effect\
    \ you are looking to detect.\n\n    77 Page 77 \n\n    # Chapter5 Correlation:\
    \ examining relationships between interval data\n\n    In this chapter you will\
    \ learn about scatterplots and correlation to examine the direction and strength\
    \ of relationships between variables.\n\n    ## 5.1Introduction\n\n    In [Chapter\
    \ 1](#06_Chapter01.xhtml) we briefly discussed the possibility of conducting correlation\
    \ analysis on our data. We saw that correlation describes the direction and strength\
    \ of a relationship between two interval variables (e.g., height and shoe size)\
    \ and that the direction can be positive or negative:\n\n    *   Positive correlation:\
    \ an increase in values for one variable is associated with an increase in values\
    \ for the other variable, for example, as height increases so does shoe size.\n\
    \n    *   Negative correlation: an increase in values for one variable is associated\
    \ with a decrease in values on another variable, for example, as temperature *reduces*\
    \ the use of electricity for heating *increases*.\n\n    In order to demonstrate\
    \ this, scatterplots were used to graphically illustrate the relationship between\
    \ values for two variables. For example, [Figure 1.4](#06_Chapter01.xhtml#fig1-4)\
    \ (repeated in [Figure 5.1](#10_Chapter05.xhtml#fig5-1) on the next page) showed\
    \ quite a strong positive correlation between height and shoe size – the strength\
    \ being determined by how tightly the plot forms a line rising from left to right.\n\
    \n    ## 5.2Examining correlations in the questionnaire\n\n    Turning to our\
    \ questionnaire, we first need to identify two interval variables that might be\
    \ correlated. We have three to choose from:"
