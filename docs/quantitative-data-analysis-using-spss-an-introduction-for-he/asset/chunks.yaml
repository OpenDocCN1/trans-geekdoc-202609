- raw: "    A table titled Correlations lists the age variables and satisfaction variables\
    \ for Pearson correlation, 2-tailed significance values, and N value, in column\
    \ 1. Columns 2 and 3 list the corresponding age and satisfaction values.\n\n \
    \   [\\*](#14_Bm02.xhtml#tfn2) · Correlation is significant at the 0.05 level\
    \ (2-tailed).\n\n    Now obviously you need to be careful removing data like this\
    \ – you cannot just remove data you do not like! The main point being, that outliers\
    \ can have a dramatic effect on the value obtained for a correlation. For example,\
    \ the following scatterplot provides data where there is no correlation between\
    \ two variables.\n\n    ![Figure X5.3bNo correlation: r = −.086](Images/figX5-3b.jpg)\n\
    \n    **Figure X5.3b**No correlation: r = −.086\n\n    However, when one extreme\
    \ data point – an outlier – is added this turns into a strong positive correlation!\n\
    \n    ![Figure X5.3c Strong positive correlation: r = .79](Images/figX5-3c.jpg)\n\
    \n    **Figure X5.3c** Strong positive correlation: r = .79\n\n    126 Page 126\n\
    \n    The moral is thus: always check your data for outliers (e.g., using boxplots)\
    \ and always produce a scatterplot to visually examine the data before conducting\
    \ a correlation statistical analysis.\n\n    ### Exercise 5.4 Explain the following\
    \ correlations\n\n    1.  (a)It is reported that there is a strong positive correlation\
    \ between ice cream sales and crime rates. Do we therefore conclude that ice cream\
    \ causes crime?\n\n    2.  (b)It is reported that there is a positive correlation\
    \ between number of counselling sessions and level of psychological well-being?\
    \ Can we therefore conclude that counselling works and more counselling works\
    \ better?\n\n    3.  (c)Consumption of milk is positively correlated to cancer.\
    \ So does drinking milk cause cancer?\n\n    4.  (d)Studies have found a negative\
    \ correlation between smoking and Alzheimer’s dementia: the risk of getting Alzheimer’s\
    \ dementia reduces with increased smoking of cigarettes. Would you therefore recommend\
    \ that people start smoking or increase the number they smoke to prevent the onset\
    \ of Alzheimer’s dementia?\n\n    #### Answers\n\n    1.  (a)Well, unless there\
    \ is something in the ice cream, it has probably got something to do with the\
    \ temperature: more people are out when it is warm and sunny, more people are\
    \ drinking, etc.\n\n    2.  (b)Well, that *may* be the case but can we really\
    \ be certain the improvement is due to the counselling? Perhaps there are other\
    \ events in the patients’ lives that have led to an improvement in well-being,\
    \ or perhaps improvements reflect ‘normal’ readjustment over time after a particular\
    \ trauma. Imagine the opposite scernario: you measure psychological well-being\
    \ for a sample of patients before and after counselling and find that it deteriorates.\
    \ To make matters worse, you then find a negative correlation between the amount\
    \ of counselling and psychological well-being. Would you then conclude that counselling\
    \ makes people worse and that the more they have the worse they are?\n\n    3.\
    \  (c)Another explanation might be that the greater level of consumption of milk\
    \ is in wealthier countries, where people live longer and therefore become more\
    \ susceptible to cancer.\n\n    4.  (d)First, these studies were funded by the\
    \ tobacco industry and the suggested implication was that smoking (or nicotine)\
    \ may prevent the onset of Alzheimer’s dementia. The problem is that Alzheimer’s\
    \ dementia is a disease of older people: 50 per cent of people older than 90 years\
    \ are diagnosed with Alzheimer’s. The findings may simply reflect the fact that\
    \ heavy smokers do not live long enough to get Alzheimer’s because they die younger\
    \ of smoking-related diseases.\n\n    127 Page 127 \n\n    ## Chapter 6\n\n  \
    \  ### Exercise 6.1 Checking for other significant differences\n\n    In this\
    \ chapter we have concentrated on the differences in satisfaction ratings and\
    \ number of sessions for the two counsellors. You may now wish to see if there\
    \ are any significant differences in:\n\n    1.  (a)the age of patients seen by\
    \ the two counsellors;\n\n    2.  (b)satisfaction ratings from male and female\
    \ patients;\n\n    3.  (c)the number of sessions conducted for male and female\
    \ patients;\n\n    4.  (d)the age of the male and female patients.\n\n    Remember\
    \ to check the distribution of the data in order to run the appropriate analysis\
    \ (i.e., parametric t-test or non-parametric Mann-Whitney U test).\n\n    ####\
    \ Answers\n\n    For each of these exercises I found the parametric t-test to\
    \ be appropriate, the results of which were as follows:\n\n    1.  (a)The age\
    \ of patients seen by the two counsellors: \n\n        *   mean age of patients\
    \ seen by John = 32.8 years;\n\n        *   mean age of patients seen by Jane\
    \ = 37.3 years;\n\n        *   t-test results: t = −1.725, p = .096. Not significant.\n\
    \n    2.  (b)Satisfaction ratings from male and female patients: \n\n        *\
    \   mean satisfaction rating for males: 4.57;\n\n        *   mean satisfaction\
    \ rating for females: 3.75;\n\n        *   t-test results: t = 1.457, p = .156.\
    \ Not significant.\n\n    3.  (c)The number of sessions conducted for male and\
    \ female patients:\n\n        *   mean number of sessions for male patients: 8.29;\n\
    \n        *   mean number of sessions for female patients: 6.56;\n\n        *\
    \   t-test results: t = 2.13, p = .042.\n\n        Thus, we can conclude that\
    \ male patients attended for more sessions than females. However, is this because\
    \ male patients for some reason require more sessions or because more patients\
    \ saw John who tended to provide more sessions . . .?\n\n    4.  (d)The age of\
    \ the male and female patients:\n\n        *   mean age of male patients: 31.3\
    \ years;\n\n        *   mean age of female patients: 38.6 years;\n\n        *\
    \   t-test results: t = −3.075, p = .005.\n\n        Thus, we can conclude that\
    \ female patients were generally older than male patients. However, what bearing\
    \ this might have on anything is unclear – not all significant differences are\
    \ meaningful differences . . .\n\n    ### Exercise 6.2 Create a new variable to\
    \ analyse same-sex satisfaction ratings\n\n    In [Chapter 4](#09_Chapter04.xhtml),\
    \ cross-tabulation revealed that the majority of male patients (71%) saw John,\
    \ while the majority of female patients (75%) saw Jane. We 128 Page 128noted that\
    \ this might be important information for the doctor, since this might suggest\
    \ it is necessary to ensure a male and a female counsellor are available to cater\
    \ for patient preferences, that is, preference for same-sex patient and counsellor.\n\
    \n    Now, the curious among you might go on to wonder if this has any bearing\
    \ on the counselling relationship, for example: were satisfaction ratings higher\
    \ for same-sex patient–counsellor sessions compared to different-sex patient–counsellor\
    \ sessions?\n\n    So how would you investigate this? Here is a clue: you will\
    \ first need to create a new variable (using **Transform/Compute)** which records\
    \ whether the patient saw a counsellor of the same sex or not. Then you can use\
    \ this new variable as an independent (grouping) variable to compare the mean\
    \ satisfaction ratings between the two groups.\n\n    #### Answers\n\n    1. \
    \ 1From the menu at the top of the screen go to **Transform/Compute Variable.**\n\
    \n    2.  2In the **Target Variable** box enter a name for the new variable you\
    \ are going to create. I have chosen the name **‘samesex’.**\n\n    3.  3In the\
    \ box **Numeric Expression** write in the rule you will need for the new variable\
    \ to record whether the patient saw a counsellor of the same sex or not.\n\n \
    \       In our data a male patient is coded as 1 and the male counsellor (John)\
    \ is also coded as 1. Similarly, a female patient and the female counsellor (Jane)\
    \ are both coded as 2. So, we need to select those cases where the *number* in\
    \ the sex variable is the *same* as the number in the counsellor variable. This\
    \ will tell us that we had a male patient and a male counsellor or a female patient\
    \ and a female counsellor."
