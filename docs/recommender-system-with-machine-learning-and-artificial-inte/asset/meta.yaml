name: Recommender system with machine learning and artificial intelligence ： practical
  tools and applications in medical, agricultural and other industries
name_cn: 机器学习与人工智能推荐系统：医疗、农业及其他行业的实用工具与应用
slug: recommender-system-with-machine-learning-and-artificial-inte
