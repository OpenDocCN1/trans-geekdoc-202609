  \n正则化\n\n\n\n\n\n正则化的核心思想是限制效应量（effect sizes）的总变异性。为什么这有帮助呢？考虑这种情况：我们有一个电影 `i =\
  \ 1` 有 100 个用户评分，而其他 4 部电影 `i = 2,3,4,5` 只有一个用户评分。我们打算拟合该模型：\n\n![image](img/c13_Inline_12_9.jpg)\n\
  \n假设我们知道平均评分是例如 `μ = 3`。如果我们使用最小二乘法，第一部电影效应 `b[1]` 的估计值是 100 个用户评分的平均值![image](img/c13_Inline_13_12.jpg)，我们期望它是相当精确的。然而，电影\
  \ 2, 3, 4 和 5 的估计值将仅仅是偏离平均评分的观测偏差![image](img/c13_Inline_13_13.jpg)，这是一个基于单个数字的估计，因此它一点也不精确\
  \ [11]。注意，这些估计使得 `i = 2,3,4,5` 的误差![image](img/c13_Inline_13_14.jpg) 等于 0，但这是过拟合的情况。事实上，忽略这个用户并假设电影\
  \ 2, 3, 4 和 5 只是普通电影（`b[i] = 0`）可能会提供更好的预测。惩罚回归的核心思想是控制电影效应的总变异：![image](img/c13_Inline_13_15.jpg)。具体来说，我们不是最小化最小二乘方程，而是最小化一个加上惩罚项的方程：\n\
  \n![image](img/c13_Inline_13_9.jpg)\n\n**表 13.3** 电影+用户效应模型的 RMSE。\n\n| **方法** ||\
  \ **RMSE** |\n| --- | --- |\n| 朴方法 || 1.0612018 |\n| 电影效应模型 || 0.9439087 |\n| 电影+用户效应模型\
  \ || 0.8653488 |\n\n第一项只是最小二乘法，第二项是惩罚项，当许多 `b[i]` 很大时，惩罚会增大。通过微积分，我们实际上可以证明使该方程最小的\
  \ `b[i]` 值：\n\n![image](img/c13_Inline_13_10.jpg)\n\n其中 `n[i]` 是电影 `i` 的评分数量。这种方法将产生我们想要：当我们的样本量\
  \ `n[i]` 很大时（这会给我们一个稳定的估计），惩罚项 `λ` 实际上被忽略了 `n[i] + λ ≈ n[i]`。然而，当 `n[i]` 很小时，估计值![image](img/c13_Inline_13_16.jpg)\
  \ 就会向 0 收缩。`λ` 越大，收缩越厉害。\n\n## 电影和用户效应的正则化\n\n我们也可以对用户效应的估计使用正则化 [12]。我们正在最小化：\n\
  \n![image](img/c13_Inline_13_11.jpg)\n\n注意 `λ` 是一个调优参数。我们可以使用交叉验证来选择它。图 13.6 绘制了惩罚项\
  \ lambda，`λ` 的最优值。\n\n![image](img/c13_image_14_2.jpg)\n\n![图 13.6 惩罚项 lambda, λ\
  \ 的最优值。](img/c13_image_14_3.jpg)\n\n**图 13.6** 惩罚项 lambda, `λ` 的最优值。\n\n**表 13.4**\
  \ 正则化电影+用户效应模型的 RMSE。\n\n| **方法** || **RMSE** |\n| --- | --- |\n| 朴方法 || 1.0612018\
  \ |\n| 电影效应模型 || 0.9439087 |\n| 电影+用户效应模型 || 0.8653488 |\n| 正则化电影+用户效应模型 || 0.8648177\
  \ |\n\n对于完整模型，最优的 `λ` 是：\n\n![image](img/c13_image_15_4.jpg)\n\n所以，`λ = 5` 是如表 13.4\
  \ 所示使 RMSE 最小化的惩罚项。\n\n![image](img/c13_image_15_6.jpg)\n\n## 13.7 结果\n\n从表 13.5\
  \ 中查看从朴方法（不分用户预测平均评分）到正则化电影和用户效应（通过寻找调优参数 `λ`）训练的各种模型的 RMSE。分析中讨论的各种模型的所得 RMSE 如下：\n\
  \n**表 13.5** 结果。\n\n| **方法** || **RMSE** |\n| --- | --- |\n| 朴方法 || 1.0612018 |\n\
  | 电影效应模型 || 0.9439087 |\n| 电影+用户效应模型 || 0.8653488 |\n| 正则化电影+用户效应模型 || 0.8648177\
  \ |\n\n从结果可以看出，每个模型比上一个模型都有改进，最后一个模型的 RMSE 低于 0.8649。这显然是对第一个朴方法的显著改进。在最后一个模型的帮助下，我们的机器学习算法预测验证集中电影评分的\
  \ RMSE 约为 0.864201，即我们与“真实”评分的差距为 0.864201。\n\n## 13.8 结论\n\n不分用户预测所有电影相同评分（平均评分）的最简单模型\
  \ RMSE 高于 1。如果 RMSE 大于 1，意味着我们的误差大于一星，这并不好。通过考虑电影效应，RMSE 降到了 0.9439087，这是一个巨大的改进。在模型中对用户效应进行建模后，RMSE\
  \ 降到 0.8653488。然而，通过正则化电影和用户效应实现了最低的 RMSE，即 0.8648177，这是对来自用户用户样本评分的惩罚估计。随后，正则化类型可以进一步改进残方误差，但正则化类型计算代价很大，因为每个电影需要多个类型。\n\
