  \n## 注释\n\n1. * *通讯作者*：usha.20339@lpu.co.in\n\n# 2 医疗保健行业公民个性化推荐模型简概述\n\n**Subhasish\
  \ Mohapatra¹* 和 Kunal Anand²**\n\n*¹ 阿达马斯大学，加尔加答，西孟加尔邦，印度*\n*² 卡林加工业技术学院，巴德内斯尔，奥里萨邦，印度*\n\
  \n### 摘要\n\n推荐系统是当今信息通信技术领域备受期待的领域之一。推荐系统通过度量分析，确定推荐的产品对用户是否相关。推荐系统分析大量的非结构化数据进行智能挖掘。在推荐系统中，提供解释的过程基于用于决策的智能协同过滤过程。在此背景下，基于协同过滤的推荐系统模型已成为未来向终端用户进行决策渗透不可或缺的工具。推荐系统从公民、医生、药剂师和市场分析师处获取价值信息，创建一个数据存储，并在其中应用决策逻辑和协同过滤，以便在需要的时间向公民发布其所需服务的推荐。本章深入介绍了推荐系统在有形和无形产品以及医疗服务行业中的实现。随着该推荐系统模型的实施，针对公民的补救方案将获得新的动力。最近的研究需要大量的商品或医疗数据来确保其质量和可信度。随着研究的进展，该模型将产生价值的结果。该模型是一种特定上下文的推荐系统，在数据收集和学习后将进一步发展。在本章中，我们提供了医疗模型中基于流程图的推荐系统的详细理论框架，该框架有力地支持透明性、信任和有效性。\n\
  \n***关键词：*** 推荐系统，智能挖掘，基于上下文，协同过滤\n\n## 2.1 引言\n\n为了视觉化推荐系统的实现细节，我们需要使用下面讨论的一些共同方面。\n\
  \n1. 看电影：如今，系统会获取用户的情绪并将其分类为好或坏。用于此的机器学习模型有`决策树`、`随机森林`和`聚类`。\n2. 买哪只股票：这对于在买卖之前需要股票推荐的投资者非常有用。用于此的机器学习模型有`支持向量机`和`回归`。\n\
  3. 我们买什么种产品：在这里，系统将分析交易次数和消费者满意度。如果一个产品具有高需求，则被认为是良好的。用于此的评估指标有`统计准确性指标`和`决策支持准确性指标`。\n\
  \n\n\n\n\n在基于内容的技术中，如图 2.1 所示，我们发现要匹配相同的用户组以及他们访问或喜爱购买的内容。尽管在这种机制中我们收集了用户和产品的属性字段，但我们考虑的是最高的相似性分值。在电影推荐系统中，我们识别属性字段，如导演团队、演员、电影时代、电影长度、电影类型（如剧情片、爱情、喜剧、悬疑惊悚、成人内容或家庭电影等）。为了建立电影之间的相似性，提取了名为“观影电影后的观众体验”的特征，然后对数据概况进行词频统计的情感分析。这被统称为电影评论。基于内容的系统背后的思想是根据\
