  \ 100%，未感染 99.39% |\n\n### 8.4.4 作物质量\n\n作物质量是农业领域一个非常重要的因素，决定了利润。为了判断生产成本，准确识别并分类作物质量是必要的。以前这种识别是人工进行的，增加了时间和人工成本。但随着技术的发展，已经开发了多种应用来准确检测作物质量。因此，与以前相比，错误率降低了，为所有提供了准确利润。设计了一种新系统来检测棉花内部植物材料。这是在收获期进行的。研究目的是提高作物质量并减少对纤维的损害。某些检测系统使用了高光谱反射成像技术。检测是通过获取作物图像完成的。类似的应用已使用多种机器学习技术开发，用于识别稻样本。\n\
  \n### 8.5 应用——作物疾病检测与产量预测\n\n机器学习在作物产量预测中起着至关重要的作用。已经开发了许多用于产量预测的 `ML` 技术。研究人员进行了多次对比研究以确定最准确的技术。由于评估的作物数量非常有限，尚未实现精确决策。\n\
  \n作物产量取决于某些因素，如天气状况、土壤状况、地理区域、土壤成分以及收获方法。传统的监测技术无法很好收集作物状况，预测结果尚未得到优化。因此，为了解决这个问题，设计了一个系统，利用机器学习技术识别作物类型、作物疾病并在不同条件下预测作物产量。主要目标是利用有限的土地资源检测疾病并预测最大产量。\n\
  \n\n\n\n该研究是在种植草莓和柑橘的农田上进行的。数据集包含超过 1,000 张草莓图像和柑橘图像。作物图像是通过相机拍摄的。图像经过预处理，包括去除噪声和提取感兴趣区域。通过特征提取过程提取了颜色、位置和大小等特征。通过卷积神经网络（`CNN`）算法\
  \ [12]] 识别作物类型。`CNN` 算法根据特征对图像进行分类。在识别出作物类型后，检测了作物病害。为了计算作物产量，需要移除这些受影响的作物，因为它们会导致产量不佳或影响生产。因此，选择了优质作物并使用机器学习算法预测作物产量（图\
  \ 8.5）。\n\n在图 8.6 中，系统使用了 `Anaconda 3.0` 软件，因为我们想要使用的机器学习算法具有用 `python` 编写的库。在 `tensor\
  \ flow` 方面，`python` 的支持优于其他语言，因为它已经存在很长时间了。而使用 `Opencv` 时，`Python` 或 `C Raspberry\
  \ pi` 具有良好的支持。如图 8.6 所示，使用了不同的命令：第一个命令是激活 `tensor flow` 环境。第二个命令设置文件所在的路径。第三个命令进入实际的\
  \ `Keras` 库。第四个命令执行数据集中的实际图像并给出结果。\n\n通过使用如图 8.6 所示的上述命令，系统检测到了水果并识别了病害。如图 8.7 所示，系统检测到了水果（即草莓）并识别出草莓已被感染。然后它给出了草莓感染了什么病害——是患灰霉（`gm`）还是根霉（`Rz`）。第一张图检测出\
  \ `gm` 病的比例为 100%，`Rz` 病为 0%，第二张图检测出 `Rz` 病为 100%，`gm` 病为 0%。\n\n![图 8.5 作物病害检测与预测系统架构。](img/c08_image_20_4.jpg)\n\
