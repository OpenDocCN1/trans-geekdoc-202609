  \ |\n| 恶心、低血压、水肿、困惑 | 抗安地汀(Symmetrel) |\n\n## 17.5 结论\n\n健康推荐系统帮助用户理解疾病类型，并根据此建议某些药物、疗法和注意事项。因此，人们在咨询医生之前，应该在网上参考有关疾病的信息，并寻找合适的专家。本章讨论了健康推荐系统的各种技术及其优缺点。文中给出了帕金森病的案例研究，它根据语音信号检测疾病并结合症状给出建议。\n\
  \n**表 17.4** 帕金森病非运动症状的管理。\n\n| **症状** || **管理策略** |\n| --- | --- |\n| 认知障碍 | 诊断脱水、感染、代谢异常；减少抗帕金森药物剂量；减少或停止胆碱能药物、多巴胺激动剂、选择吉列林、安地汀，并使用胆碱碱酯抑制剂。\
  \ |\n| 便秘 | 患者应增加纤维和水分摄入；增加身体活动；停止抗胆碱药物；并在需要时使用`乳糖`、`软便剂`、`灌肠`或轻微泻药。 |\n| 抑郁 | 开始心理咨询；使用选择性血羟素再摄取抑制剂或三环抗抑郁药进行药物治疗。\
