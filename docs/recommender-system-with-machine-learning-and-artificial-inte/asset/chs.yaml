  \ 开发\n\n**Rashmi Bhardwaj¹ 和 Debabrata Datta²**\n\n¹ 印度德里古·宾德辛·因德拉普拉斯大学基础与应用科学学院，非线性动力学实验室\n\
  ² 印度孟买，哈哈巴原子研究中心，辐射物理与咨询部门\n\n### 摘要\nHealthMudra 是一种用于预防糖尿病的推荐系统，糖尿病是医疗领域极具挑战性的疾病。HealthMudra\
  \ 基于区块链技术，结合了合适的机器学习算法和优化过程。通过过滤实现减少症状来预防糖尿病。来自大量医生的用于减轻症状的信息可以存储在名为 `区块链` 的去中心化数据库中。类似于模式，患者可以使用本地密钥唯一身份代码对交易进行签名，并允许机器学习/人工智能领域的用户或医疗从业人员访问数据历史。HealthMudra\
  \ 作为一个动态非结构化数据库，拥有一种跟踪患者所有生活方式的机制。HealthMudra 根据糖尿病患者流行病学研究提供风险评估方法。查询或检索的结果进入`区块链`。\n\
  \n***关键词：*** 推荐系统, healthmudra, 区块链, 机器学习, 人工智能, 哈希\n\n## 16.1 引言\n\n\n\n\n\n# 糖尿病概述与区块链集成\n\
  \n糖尿病是一种人体大幅丧失维持血糖（又称为血糖）在允许且安全水平的能力的疾病。人体可能发生三种糖尿病，例如`Type-I`糖尿病、`Type-II`糖尿病和妊娠性糖尿病。`Type-I`糖尿病的另一个名称是青少年糖尿病。当人体产生胰岛素停止时，就会出现`Type-I`糖尿病特征。因此，`Type-I`糖尿病患者依赖每天向体内注射胰岛素来保持健康。\n\
  \n`Type-II`糖尿病患者的体仍会产生胰岛素。然而，对于`Type-II`糖尿病患者来说，人体产生的胰岛素的正常反应完全为零。根据国家糖尿病研究所的说法，发生在肾脏和消化系统的疾病是最常见的糖尿病类型。妇女在怀孕期间容易患妊娠糖尿病，其身体在怀孕期间对胰岛素的敏感性较低。然而，并非所有女性都会出现妊娠糖尿病的症状，但这个问题通常在分娩后得到解决。囊性纤维化相关糖尿病和单基因糖尿病不是常见类型。\n\
  \n## 血糖水平\n\n当血糖（`BG`）水平处于 100–125 mg/dL 范围内时，医生会针对边缘糖尿病病例提供知识支持。`BG`的正常水平处于 70\
  \ 到 99 mg/dL 之间。已知糖尿病患者的空腹`BG`水平应大于 126 mg/dL。边缘病例的`BG`水平高于通常，但该水平并不会让他们认为自己是糖尿病患者。然而，边缘人员始终面临患`Type-II`糖尿病的风险，尽管他们通常不会表现出糖尿病的所有症状。\n\
  \n## 医疗保健中的区块链技术\n\n医疗行业收集和存储的患者记录是稀疏的，也就是说，在中央数据库中保存大量患糖尿病患者的记录是一项挑战性任务。因此，为了检索这类稀疏信息，我们需要去中心化的数据库技术。`Blockchain`正是为此目的而开发的。\n\
  \n根据《机器学习百科全》提供的文献，推荐系统的定义如下：“推荐系统的目标是对用户群体对其可能感兴趣的物品或产品生成有意义的推荐”。通常，`blockchain`是一个位于互联网上的公共分类账。卷积神经网络（`CNN`）、分位数自助法（`percentile\
  \ bootstrap`）、数据聚合（`aggregate data`）以及使用 BAT 优化算法的提升（`boosting`）等机器学习算法在`HealthMudra`中得以实现。`CNN`是多层感知器的变体，在`HealthMudra`中作为协作过滤实现，用于分离单个患者的特征，以推荐正确的`blockchain`来获取有利于糖尿病患者的信息。`BAT`算法是一种自优化算法，用于对跨网络信息搜索进行优化。记录信息的架构为`blockchain`提供了突破性的潜力。因此，可以说`blockchain`生成了一个生成的去中心化且不可篡改的存储系统，可以随时从世界上任何地方进行访问。从科学角度讲，`blockchain`被定义为一个系统，其中`bitcoin`是记录交易的主要格式，并通过称为点对点（`P2P`）网络的多台计算机进行维护。`P2P`网络是互连且去中心化的网络，其中所有参与者以等权重的方式共享任务\
  \ [1]。在`HealthMudra`平台下，`blockchain`的主要用途是在分布式网络中的参与者之间交换电子信息的可能，而无需任何可靠第三方（`RTP`）的支持和要求。基本上，`blockchain`技术作为分布式账本系统的普及速度非常快\
  \ [1]。\n\n## 演变与动机\n\n文献研究 [1]证明，人员或供应商之间交换电子信息的交易依赖于银行、中介等`RTP`。`RTP`的可靠性是一个主要障碍。因此，`blockchain`背后的动力是克服与`RTP`可靠性相关的局限性。糖尿病患者将受益于`blockchain`技术的便捷访问。该技术将帮助现场诊断病情，而不浪费宝贵时间。面向`blockchain`的加密货币（`Bitcoin`）实现框架了这种技术的产生，也称为`blockchain\
  \ 1.0` [2]。我们提出的`HealthMudra`利用`blockchain`技术来改进糖尿病的各个方面。\n\n与疾病相关的大量数据由患者生成。在医疗保健背景下，由于复杂性和隐私性质，跨机构的数据无法共享。结果，在治疗患者期间，医疗提供者的数据可用性很差。在这种背景下，正在进行第二代`blockchain`技术的发展\
  \ [2]。系统的属性是智能的，基本上归属于数字系统。它们由基于`blockchain`的平台控制，其中计算机代码代表智能资源，所有这些软件具有编码管理所需规则的能力。`blockchain`的示例包括加密货币`Ethereum`\
  \ [3]、`Ethereum Classic` [4]、`NEO` [5]和`QTUM` [6]。数据科学的进步可能会进一步改进`blockchain`。因此，`blockchain`被认为是满足用户端需求的工具\
  \ [7, 8]。\n\n## 未来前景\n\n在其他行业中可以找到各种案例研究 [8]。这些应用用于识别患者地址、解决争议、管理合同、管理供应链、维护保险和医疗等\
  \ [7, 9]。鉴于`blockchain`技术的进展，与医疗保健问题的信息系统已成为里程碑。`blockchain`的性能可以通过许多已识别有用事件进行评估。研究社区成员和该领域的从业人员可能需要在医疗保健行业中寻找`blockchain`的多种应用，特别是预防哮喘等许多非传染性疾病。\n\
  \n\n\n\n本章简要回顾了针对区块链技术在医疗保健信息共享（特别是糖尿病）领域的相关问题。其他重要且有趣的综述可参阅 [10, 14]]。我们的方法的目标和方法论与此有所不同。Angraal\
  \ *等人* [10]\\]在他们的综述中介绍了几个区块链在医疗保健领域应用的示例。例如，爱沙尼亚患者和公民的身份是通过执行运行基于区块链的医疗保健平台的 `Guard\
  \ time firm` 来验证的。类似地，解决医疗保健问题的区块链示例集群也可以在其他地方找到 [11]]。参与此项任务的公司按被归类为不同的医疗保健事件。用于检测药物欺诈的处方、面向患者的记录管理以及牙科相关问题的研究都是这些类别的少数示例。Mettler\
  \ [12]\\]报告了区块链驱动的应用、医学领域的研究、医药行业的研究（药物递送和药物管理）以及公共卫生管理领域的研究。Ku *等人* [13]\\]通过与后期医疗应用的比较，发表了区块链相对于传统数据库的净收益。他们还解释了医疗信息管理的改进、保险理赔流程的增强、临床研究的改进以及医疗数据账本的进步。\n\
  \n最后，Roman-Belmonte *等人* [14]\\]的综述强调了区块链在医学各个分支中许多重要应用和用途。所有这些任务包含了代表医疗保健数据分析的工具，涉及法医学、生物医学研究、电子医疗记录、医疗部门服务相关的实际使用和支出等问题等。\n\
  \n推荐系统的开发是为了减少信息过载问题。HealthMudra 属于这一范畴，因此被证明为一种推荐系统。在这里，信息通过多个区块链发生了过载，并已通过区块链架构进行了讨论。本工作的目标是提供一种利用区块链技术共享医疗保健数据的方案。该方案包括数据共享、与隐私相关的问题，并将糖尿病患者作为主节点来管理其数据。HealthMudra\
  \ 的深度构建为糖尿病患者提供了知识库，以便他们决定合适的程序来增强健康。HealthMudra 的结构中包含了各种习惯，如运动、进食健康食物、增加活动以及调节良好的心理健康。这些事件会立即反映在生物标志物上，与这些事件相关的活动都通过\
  \ HealthMudra 系统进行严密监控。\n\n进化改进导致了医疗成本的降低，保险提供者也产生了同样的效果。寻求降低医疗单成本的患者将获得大量的知识。随后，获得的知识将帮助他们做出最合适的替代方案，以减少糖尿病的症状，而这些问题随后都会纠缠在他们的生物标志物中。\n\
  \n基于技术的 HealthMudra 的各种成果将继续吸引关注。处理此类信息的小公司的进步可能有助于应对该疾病带来的严重问题。本章的剩余部分安排如下：第 2\
  \ 节介绍了区块链的简要架构；第 3 节介绍了 HealthMudra 预防糖尿病的作用；第 4 节介绍了区块链技术解决方案；第 5 节给出了结论。\n\n##\
  \ 16.2 区块链架构\n\n区块链架构从区块链的概念定义开始，并进一步介绍其各种类型。在区块链架构的背景下，我们可以说区块链可以是中心化的、去中心化的和分布式账本。分布式账本进一步细分为公共（全局）和私有（本地）。所有这些架构如图图\
  \ 16.1 所示。\n\n与其复制数字信息不同，区块链技术允许将其分布在账本系统中，提供了数据安全、透明度和信任。如图图 16.2 所示，区块链架构与数据库始终不同。\n\
  \n### 16.2.1 区块链的定义\n\n简而言之，一种包含各种类型交易的去中心化分布式账本（可以是公共私有的）被定义为区块链。我们也可以说区块链被组织为线性链接的区块列表（或者称为链），每个区块执行一个特定的任务，且每个任务都以链的形式链接，以产生有意义的信息。\n\
  \n### 16.2.2 区块链的结构\n\n在几分钟内（例如 10 分钟）收集的认证交易提案集被称为区块。认证交易提案被定义为满足验证要求的提案。区块链中存在的两个重要数据结构是：(a)\
  \ 链表和 (b) 指针。基本上，指针代表变量的地址，并指向包含另一个信息的位置。链表代表区块序列，每个区块持有部分数据，并通过指针链接到下一个区块。指针（地址变量）可以是多种类型，如近、远和巨大。哈希的完整结构如图图\
  \ 16.3 所示。认证模式确保调用的交易能够通过逻辑或理由进行辩护。例如，程序从经过验证的用户开始。已知，一旦交易获得了真实性许可，我们就说该交易是有效的。因此，认证交易被称为通过验证的交易。所以在整个章节中，我们将使用认证交易代替有效交易。\n\
  \n\n\n决定将经过验证的区块添加到数据库系统的顺序的共识算法是其工作功能。在区块链网络中，某些特定的节点维护着其特长，它们是执行共识算法的主要资源。这些特殊的列表节点被称为\
  \ `dataminers`（数据矿工）。这些矿工在交易处理以及它们在区块链中的位置上起着作用。这种方法被称为数据挖掘。一旦交易提议被数据决策者接受，它将检查交易的有效性。只有经过验证的交易才会被包含在区块中。经过验证的交易分块在经过一段时间或一个区块周期后被附加（或链）到最后一个区块之后，从而形成区块链。这些区块的链（记录块）被标记为\
  \ `blockchain`（`B-Chain`）。`B-chain` 总是作为网络中所有节点分布的完全相同的副本存在（例如，数据块及其与下一个区块连接的指针）。每个这样的副本对于网络中的每笔交易都有一个相同的账本（`data-base`）。\n\
  \n![Figure 16.3 Data structure of Blockchain (Hashing).](img/c16_image_7_3.jpg)\n\
  \n图 16.3 区块链的数据结构（哈希）。\n\n构建 `B-chain` 结构的区块链接算法类似于自引用数据结构，但它与大量的学习算法相关。我们可以首先考虑不同类型的\
  \ `B-chain`。`B-chain` 的实现事件（例如 `HealthMudra`）表明，网络中的任何节点都可以无需安全检查而加入，同样，它们可以同意参与数据处理任务（即参与将已验证的新区块与现有区块进行链接）。网络中任何节点在没有授权或访问权限的情况下作为数据处理者加入网络，并将相同的过程实现在系统中，这被称为公共或无许可的\
  \ `B-chain`。相比之下，许可性 `B-chain` 是指要求成员在参与和加入网络之前必须经过授权并拥有访问权限的链。在许可性 `B-chain` 中，只有代表节点的某些信息被允许参与数据处理任务（数据分析）。许可性\
  \ `B-chain` 网络的结构意味着，与全球 `B-chain` 网络相比，它们的规模通常较小，数据传输速度更快，且在数据处理方面更安全。\n\n许可性 `B-chain`\
  \ 可以进一步识别为静态或联盟 `B-chain`（`CB-C`）。静态链与 `CB-C` 之间的区别取决于数据矿工许可的数据块数量。在 `CB-C` 中，两个或多个保持其有效性的信息被允许参与数据挖掘过程。显然，经过验证或获得授权的用户可以成为\
  \ `CB-C` 网格的成员。因此，`CB-C` 具有私有 `B-chain` 的重分布优势，并具有增强的安全性和内在的隐私。关于各种 `B-chain` 类别（全局、本地和联盟）的信息可以在\
  \ [15] 其他地方找到。值得考虑代表连接区块以构建 `B-chain` 的过程。数据（信息块）的链接由 `hash function` 执行，它被称为一种加密原语。`Hash\
  \ function` 在此起着作用。\n\n\n\n然而，尽管目前在技术驱动的医疗保健系统中仍然缺少两个关键组件。\n\n第一个组件意味着，目前的解决方案方法无法为遵循其治疗计划的患者创建个性化的奖励计划。例如，即使治疗师要求他们减少使用社交媒体的时间，个人也无法获得充分的动力和适当的奖励。\n\
  \n第二个组件解决了这样一个事实：患者并不是其健康记录的唯一责任者，因为与其健康相关的信息存储在许多的相应存储中，例如：(1) 医院电子病历（EMR）系统、(2)\
  \ 初级保健医生档案、(3) 药房系统等。患者或个体应该能够访问自己的健康数据，或者以匿名的方式与 `AI` 科学家和医学研究人员共享他们的健康数据。区块链可以解决这些问题。`HealthMudra`区块链的使用可以指导糖尿病健康数据管理。未来，区块链技术将应用于现有的糖尿病糖尿病保健系统，以探索其现实世界的优势与挑战。\n\
  \n\n\n基于区块链的医疗数据技术解决方案，无非是为了创建一个存储平台，在其中永久保存糖尿病患者的数据。这种设备可以标记为电子设备医疗记录（`EDMR`）。患者可以选择加入共享此设备。可以采用类似于银行柜台操作的代币化方法，提取个人的临床方案并制定患者护理计划。与支付相关的财务事务设计在硬币框架中。患者的钱包将填充这些硬币，同时可以标记业务以进行相应的估值交易。直接使用代币可以满足医疗的必要成本。最后，代币被保险公司接受，也被医院保险接受。处理每个个人健康结果的代币化方法可以方便患者在任何需要的地方花费其代币。基于\
  \ HealthMudra 的区块链将允许患者拥有自己的数据。患者可以将自己的数据提供给其他方。他们还可以使用其基于网络的可访问密钥退出交易。涉及个人数据的信息，如\
  \ `{姓名、父亲姓名、母亲姓名、年龄、地址、工作经验、电话和电子邮件}`的访问级别、时间段和删除操作。一旦系统验证了个人数据的访问权限，他/她就可以通过这些代币支付财务费用。该系统将作为一个生态系统运行，而捕食者模型是该技术的骨干。如果患者愿意分享他们的糖尿病状况（健康信息），他们就可以获得报酬，大量的医疗数据可以分发给医学研究人员，以得出进一步的创新，例如完美地发现药物。鉴于此，参与者之间将对疾病有更好的理解。患者可以决定将所获金额的部分捐赠给医院和保险公司，以便获得的金额可以作为救助资金治疗贫困患者。当前社会中的贫困群体将从这些众包护理补贴计划中获益。一种在计算机中实现并设计用于数字化促进、验证或强制执行谈判的协议被称为智能合约\
  \ `[16]`。在智能合约允许的可靠交易执行过程中，第三方不发挥任何作用。不可逆转性是这些交易的特性，因此可以对它们进行追踪。区块链技术是制定智能合约 `[16]`\
  \ 的平台。这些合约是完全可审计且透明的。任何人都可以查看代码。分发代币的业务规则很容易理解。如果允许，通过在区块链上存储患者健康记录，将可能降低医疗成本。通过存储机制还增加了共享患者数据的透明度。综之，区块链为预防糖尿病等疾病提供了最精尖的技术解决方案。\n\
  \n### 16.4.1 医疗数据分析的预测模型\n\n可以通过逻辑回归对糖尿病患者进行数据分析，以估计各种混杂因素——这是 `HealthMudra` 的核心组件。通常，基于逻辑回归的预测模型通过估计优势值比来寻找因果关系。支持向量回归将数据分类为两类，例如良性簇病例和边缘组病例。通过区块链利用先进机器学习技术的力量可以实现预测性医疗数据分析的重要性。研究可以在生物医学和生物技术领域进一步推进，以改进精确药物的供应。基于\
  \ HealthMudra 的区块链案例也为诊断工具提供了全面路线图。\n\n## 16.5 结论\n\n`HealthMudra` 提供了一个平台，可以通过逻辑回归对糖尿病患者进行数据分析，以估计各种混杂因素。通常，基于逻辑回归的预测模型通过估计优势值比来寻找因果关系。支持向量回归将数据分类为两类，例如良性簇病例和边缘组病例。通过区块链利用先进机器学习技术的力量可以实现预测性医疗数据分析的重要性。研究可以在生物医学和生物技术领域进一步推进，以改进精确药物的供应。基于\
  \ HealthMudra 的区块链案例也为诊断工具提供了全面路线图。（注：此处原文存在重复，译文已按原文对应翻译）\n\n## 参考文献\n\n1. Nakamoto,\
