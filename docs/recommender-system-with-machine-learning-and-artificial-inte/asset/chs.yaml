  \ 函数如下所示（图 10.2）。图 10.2 所示的上述函数可以这样调用：\n\n```\n![image](img/c10_Inline_15_13.jpg)\n\
  ```\n\n图 10.2 所示的函数可以用于寻找 `Info[income] (D)`，如下所示：\n\n```\n![image](img/c10_Inline_15_14.jpg)\n\
  ```\n![图 10.2 计算 Info (D) 的 Python 函数。](img/c10_image_15_15.jpg)\n\n\n\n\n数字健康信息的飞速增长提升了数据分析在医疗保健行业的应用和产出。一种提出的解决方案是健康推荐系统（HRS），它的出现是为了为以患者为中心的决策提供支持，并根据个人健康记录（PHR）和患者数据库推荐更好的医疗建议。HRS\
  \ 可以通过预测分析和推荐适当的治疗方案，增强医疗系统并同时管理患有多种不同疾病的患者。基于内容的推荐系统（CBRS）是一种定制化的 HRS 方法，它侧重于对患者历史进行评估，并通过机器学习（ML）进行“学习”以生成预测。此外，CBRS\
  \ 旨在就患者的健康状况提供个性化且可信的信息。CBRS 通常应用于医疗文档推荐场景，患者在收到以评分形式提供的推荐后给出其偏好，并将排名靠前的项目推荐给患者。本章将讨论\
  \ CBRS 以及相关的流行机器学习算法。随后，将介绍并讨论基本概念、特征提取方法、相似性度量和排名。还讨论了隐私保护阶段，特别是如何保护数据以及防止入侵者修改重要信息。最后，探讨了面临的挑战和开放性问题。\n\
  \n## 11.1 引言\n\n日益增多的数字和网络信息推动了推荐系统（RS）技术的发展 \\[1\\]，其中数据通过机器学习（ML）进行转换以预测其未来的兴趣（在某些情况下，是对他们有利的东西）\
  \ \\[2\\]。在此环境中主要有两个实体：用户和项目。接受推荐的人被称为用户，推荐的产品被称为项目（在某些情况下为有益的建议或提示）。推荐可以是个性化的，也可以是非个性化的。个性化推荐是针对特定个人的，而非个性化推荐是根据他人的趋势生成的。推荐系统根据应用分为三类：协同推荐系统、基于内容的推荐系统和基于知识的推荐系统。基于内容的推荐系统（CBRS）在个性化推荐中很流行，此时用户自身的评分、偏好、个人数据和行为就足以为他们做出适当推荐。当新项目进入场景且用户本身对该项目仅有极少偏好可用，或者仅应用用户信息来生成推荐时，这种定制的\
  \ RS 方法非常有用 \\[3\\]。由于 CBRS 方法并不一定利用所有用户之间的评分或偏好相关性，它适用于以用户为中心的应用，例如健康和福祉应用，这也是本章的重点。CBRS\
  \ 的主要数据源包括：(i) 作为属性的项目描述，(ii) 从用户配置中收集的信息，即隐式和显式反馈。隐式反馈是用户对项目的操作，而显式反馈是用户过去给项目出的评分和评论。值得注意的是，项目描述被用作属性或特征，评分被用作标签，通过机器学习方法（即分类或回归）帮助来预测或向用户推荐项目\
  \ \\[3\\]。由于 CBRS 方法并不一定利用所有用户之间的评分或偏好相关性，它适用于以用户为中心的应用，例如健康和福祉应用，这也是本章的重点。CBRS\
  \ 的主要数据源包括：(i) 作为属性的项目描述，(ii) 从用户配置中收集的信息，即隐式和显式反馈。隐式反馈是用户对项目的操作，而显式反馈是用户过去给项目出的评分和评论。值得注意的是，项目描述被用作属性或特征，评分被用作标签，通过机器学习方法（即分类或回归）帮助来预测或向用户推荐项目。\n\
  \n*(注：原文中存在大量段落重复，此处已按逻辑精简)*\n\n## 11.2 典型推荐系统框架\n\n健康推荐系统（HRS）正成为医疗服务和远程医疗提供具有影响力的平台。HRS\
  \ 通过基于机器学习的决策为医疗专业人员和患者提供健康信息。考虑到医疗专业人员的处方或建议不能依赖其他患者的医疗记录，HRS 只根据用户自身的历史提供建议。因此，HRS\
  \ 需要采用 CBRS 的基本结构，也可以被称为基于内容的推荐系统（CBHRS）。\n\n本章详细分析了：\n- HRS 原理（第 2 节）\n- 组件（第 3\
  \ 节）\n- 医疗数据处理（第 4 节）\n- 健康属性和属性加权（第 5、6、7 节）\n- 用户画像学习（第 8 节）\n- 系统评估（第 9 节）\n\
  - 设计原则（第 10 节）\n- 结论和未来研究方向（第 11 节）\n\n\n\n\n机器学习（ML）通过两种方式运行：(i) 为患者的医疗保健和健康生活生成自动建议，这被称为自动机器学习（aML）；(ii)\
  \ 医生是为患者提供可靠反馈的终极专家，因此系统能够采纳医生的新建议并将其整合到系统中，这种医生与系统之间的通信通过机器学习实现，被称为交互式机器学习（iML），整个概念被称为“人环”（HiL）或“医生在环”（DiL）。除了患者信息的检索和自动化外，数据安全、隐私和技术系统的安全性对于基于内容的健康推荐系统（CBHRS）的成功实施也起着核心作用，特别是从临床角度来看。CBHRS\
  \ 的数据安全方面在本章中未详述，但其重要性已作为 CBHRS 的设计考量得到了展示。本章仅讨论了从健康角度生成建议的流程。\n\n## 11.3 基于内容的健康推荐系统的组件\n\
  \n主要地，CBHRS 的组件可以分为三类：(i) 非结构化数据处理；(ii) 特征（独特属性）提取、特征选择和特征加权；(iii) 健康专业人员的反馈收集；(iii)\
  \ 学习用户画像（训练阶段）以及使用训练好的 CBHRS 模型生成健康建议，这些模型仅对个人患者和医生可见，并进一步用于推进治疗和咨询目的（取决于健康风险）。\n\
  \n整个 CBHRS 的原理图如图图 11.1\n\n**图 11.1** CBHRS 系统的流程图。\n\n## 11.4 非结构化数据处理\n\n患者的电子医疗记录（EMR）和电子健康记录（EHR）以及医生的反馈从不同的网络系统中收集，用于实现\
  \ CBHRS。然而，这些价值信息实际上以非结构化文本的形式存在，可以进行高效预处理并为进一步处理做好准备 [11]。与其他 ML 应用不同，文本特征提取是此处的的基础阶段，这在自然语言处理（NLP）领域非常常见\
  \ [12]。这一过程也称为数据清洗，包含不同的算法，如词-文档矩阵、停用词删除、词干、短语提取等。然而，特征提取阶段可以用特征选择和加权取代，以提高 CBHRS\
  \ 的预测能力，这在传统的 CBRS 中已有实践，其中数据以结构化格式存在并准备好处理（在第 6 节中简述）。下面讨论了常用的数据清洗算法：\n\n1. **词-文档矩阵\
  \ (Term Document Matrix)**：它是一个数学矩阵，存储出现在所有可用文档中的唯一关键词，并创建一个字典用于进一步的文本特征提取模型，例如词袋（BoW）方法\
  \ [13, 14]。表 11.1 显示了词-文档矩阵的一个示例，其中行包含医疗状况，列表示关键词在每个文档中出现的次数。\n\n2. **停用词删除 (Stop\
  \ Word Deletion)**：此过程删除了英语词典中频繁出现的单词，这些单词没有提供关于患者健康或医生反馈的任何意义信息。这些是英语语法的一部分，如冠词、词性等，在文本处理时会被消除\
  \ [15]。\n\n**表 11.1** 医疗记录的词-文档矩阵示例。\n\n| 词 (Terms) | | 文档 (Documents) | | | | |\n\
  | --- | --- | --- | --- | --- | --- |\n| [D1] | [D2] | [D3] | [D4] | [D5] | [D6]\
  \ |\n| 发烧 (Fever) | | 11 | 0 | 1 | 0 |\n| | | | | | |\n| 咳嗽 (Cough) | | 1 | 11 |\
  \ 5 | 0 |\n| 打喷喷嚏 (Sneeze) | | 15 | 0 | 2 | 9 |\n\n1. **词干 (Stemming)**：它合并了相同单词的不同形式，例如单词的单复数、同一词的不同时态等\
  \ [15, 17]。[表 11.2 显示了文本处理的词干示例，其中第一列包含相同词的不同形式，第二列指示其词干形式或根形式。\n\n**表 11.2** 医疗记录的词干处理示例。\n\
  \n| 词组 (Set of words) | 统一概念 (Unified concept) |\n| --- | --- |\n| 打喷喷嚏, 打喷喷嚏 (Sneeze,\
  \ sneezing) | Sneeze |\n| | |\n| 咳嗽, 咳嗽 (Cough, coughing) | Cough |\n| 药物, 药物, 药片\
  \ (Medication, medicine, pills) | Medication |\n\n2. **短语提取 (Phrase Extraction)**：该方法识别经常在一起但整体具有特定含义的词。可以使用不同的字典提取这些短语及其含义，以避免语言处理的冗余\
  \ [15, 18]。\n\n## 11.5 无监督特征提取与加权\n\n通常，健康记录以文本格式提供，不同的符号也被视为文本，很少包含数值形式。因此，最重要的任务是为精细建议寻找合适且有的特征（关键词），并将文本关键词映射为数值向量。整个过程被称为文本处理中的特征提取\
  \ [19]。下面讨论了 CBHRS 最流行且常用的基于文本的特征提取方法。\n\n### 11.5.1 词袋 (BoW)\n\n\n\n\n创建一组具有显著性和判别性的关键词列表\
  \ `[20]`，这些关键词的选择方式可以代表有意义的句子，并将整个文档转换为关键词向量。`BoW` 采用了词-文档矩阵的基本原理。每个关键词的存在与否分别用\
  \ `1` 和 `0` 表示，然后统计该词在文档中出现的次数。出现次数被称为词频（`TF`）。随后，使用逆文档频率（`IDF`）通过对计算来突出每个词，其中低频词的\
  \ `IDF` 获得高值，而高频词获得低值。最后，对每个唯一关键词测量 `TF– IDF` 值（即 `TF × IDF`），并从文档中生成特征向量。例如，表 11.1\
  \ 包含了来自六份不同文档的三个不同单词。对于文档 `D[1]` 中的单词“`Fever`”，`TF` 和 `IDF` 可以确定为：`TF = 11/(11 +\
  \ 1 + 15) = 11/27 = 0.407`，`IDF = log 6/4 = 0.176`。因此，文档 `D[1]` 中单词“`Fever` 的 `TF-IDF`\
  \ 为 `(0.407 × 0.176) = 0.071`。\n\n### 11.5.2 词向量 (Word2Vec)\n\n这也是自然语言处理（`NLP`）领域中一种流行的文本特征提取算法。它通过在特征空间中将具有相同上下文且接近的关键词组织起来，从大型文本文档中提取区分性关键词\
  \ `[21, 22]`。这在需要从类比问题中提取特征的地方被广泛。表 11.3 展示了从文本或句子创建向量的示例。选取了一个句子来推导特征向量，其中对每个词考虑窗口大小为\
  \ `2` 的偏移，以找到其最近词。右侧有两列代表输入和输出。高亮的词被视为输入，而所有可能的最近词被视为输出。这些输入和输出集被用于实现 `ML` 的训练集。\n\
  \n### 11.5.3 词表示全局向量 (Glove)\n\n词表示全局向量（`Glove`）是词向量算法的进阶版本。它利用相互接近的关键词构建词共现矩阵（`WCM`）\
  \ `[23]`。然后，确定它们在文档中相邻出现的统计数据，即概率。\n\n## 11.6 有监督特征选择与加权\n\n存在许多著名的 `CBRSs` 以及 `CBHRSs`，包含了有监督特征选择\
  \ `[24]`。当数据可用标签时使用有监督特征选择方法。当标签不可用时不使用有监督特征选择方法 `[25]`。当标签不可用时使用无监督特征选择方法 `[26]`。当标签可用时不使用无监督特征选择方法\
  \ `[27]`。当标签可用时使用有监督特征选择方法 `[28]`。当标签不可用时不使用有监督特征选择方法 `[29]`。当标签不可用时使用无监督特征选择方法\
  \ `[30]`。当标签可用时不使用无监督特征选择方法 `[31]`。\n\n当标签可用时使用有监督特征选择方法 `[22]`。当标签不可用时不使用有监督特征选择方法\
  \ `[23]`。当标签不可用时使用无监督特征选择方法 `[24]`。当标签可用时不使用无监督特征选择方法 `[25]`。当标签可用时使用有监督特征选择方法 `[26]`。当标签不可用时不使用有监督特征选择方法\
  \ `[27]`。当标签不可用时使用无监督特征选择方法 `[28]`。当标签可用时不使用无监督特征选择方法 `[29]`。\n\n\n\n药物和治疗是患者在就诊或紧急情况下从医生处收到的主要建议类型。它包含了适用于患者健康状况及其康复过程的各种药物和治疗方案（例如，运动、活动等）。因此，这些反馈被直接存储为关键词，并被用作针对从个人健康记录（PHRs）中感知到的健康状况的标签。\n\
  \n### 11.7.2 健康饮食计划\n\n健康饮食计划也是健康咨询时医生建议的一部分。它可以是健康饮食计划、某些顺序性的常规活动等，并且在技术上可以被视为数据标记的一系列关键词。\n\
  \n### 11.7.3 建议\n\n建议以书面形式（基于文本）提供给患者。这些大部分是医生以文本和描述形式建议的不同类型的限制。\n\n此类反馈被进一步整合到系统中以标记医疗记录。在对可用的存储数据进行标记后，使用这些标记的医疗信息对\
  \ CBHRS 进行训练，以利用学习阶段。\n\n## 11.8 训练与健康建议生成\n\n从存储或获取的电子病历（EMRs）和电子健康记录（EHRs）中学习不同的健康问题以及医生相应的建议，可以被视为\
  \ CBHRS 从经验中获取新知识的特征（即从更多数据和人机交互机制中学习）。在这种情况下，机器学习（ML）为基于计算机的 CBHRS 应用提供了改进医疗知识的能力\
  \ [32]。机器学习算法模拟了人类的自然学习能力，并为基于计算机的应用（在此情况下为 CBHRS）提供智能。学习有两种类型：死记学习和基于推理的学习。后者有助于通过观察和实践实验获得获取新陈述性知识的能力，而前者直接将知识植入模型，这在人工智能（AI）领域并不流行。推断知识的过程是一个系统的统计过程，可以进一步分类为指令式学习、类比学习和基于样本的学习。\n\
  \n指令式学习代表了 ML 实现中特征或属性提取的概念，它组织知识以执行决策，其性能很大程度上取决于这一阶段。该阶段已经在第 5 和第 6 节中描述。类比学习是根据历史数据推导出规则的过程，被称为基于规则的\
  \ ML（或基于规则的分类）。这是监督方法的一种，通过先验知识（标签信息）进行。最流行的 ML 技术是基于样本或基于示例的学习，用于从现有数据中诱导知识。基于样本的方法主要分为监督、无监督和强化学习\
  \ ML 技术。这些方法衍生出可以表示和泛化示例中隐藏知识的函数。\n\n在 CBHRS 的背景下，主要使用类比学习或基于规则的 ML 以及监督 ML（被认为基于样本或基于示例的学习）。因此，文献中仅讨论了其中少数。值得注意的是，医生的显式反馈之前被存储为标签信息或地面值（ground\
  \ truth），用于生成规则并形成监督分类函数，以产生健康建议。\n\n### 11.8.1 CBHRS 中的类比 ML\n\nSadasivam *等人*\
  \ 提出了一种基于规则的健康推荐系统，并命名为计算机定制健康通信（CTHC）系统 [33]。CTHC 与基于规则的机器学习引擎集成，根据患者的 PHR 推荐健康提示和激励信息。Pattaraintakorn\
  \ *等人* 展示了一种混合健康推荐系统。这是一种基于 Web 的健康通信系统，通过粗集和生存分析分析患者记录和病史，最终的专家建议由基于规则的 ML 理论生成\
  \ [34]。Espin *等人* 原型化的健康推荐系统，为老年人生成营养建议和饮食计划 [7]。Husain *等人* 提出了一种个性化治疗推荐系统。该系统利用关于不同疗法的知识并推理规则以创建推荐。该模型具有两个规则阶段，为患者推荐相关的疗法\
  \ [35]。Kim *等人* 为老年社会设计了基于规则的健康推荐系统。该系统为患有冠心疾病的老年人生成定制饮食计划 [36]。\n\n### 11.8.2 CBHRS\
  \ 中的样本 ML\n\n如前所述，基于样本或基于示例的 ML 被认为是监督 ML 或分类，其中研究人员关注统计算法以预测结果。与其他领域不同，此处使用 ML\
  \ 为患者预测医疗建议，但也通过 ML 提高 CBHRS 的交互性。健康建议作为 aML 的一部分（在第 2 和第 3 节中描述）生成，而通过 iML 或 DiL（在第\
  \ 2 和第 3 节中描述）增强交互性。aML 根据先先学习的知识进行预测，然而，iML 和 DiL 是人机交互（HCI）的不同形式，可以适应系统的新知识以完善推荐。因此，这里描述了文献中基于\
  \ ML 的 CBHRS 和交互式 CBHRS。\n\n协作 ML 算法由 Holzinger 提出，Holinger *等人* [37, 38] 增强 CBHRS\
  \ 并保持人类回路（iML 的另一种形式）和 DiL，因为医生是终极专家，能够评估 aML 生成的建议 [37, 38]。Yang *等人* 设计了基于电子商务的\
  \ CBHRS，根据患者的情绪健康状况提供个性化的健康提示。应用了一些非常显著且实用的属性，如学习压力、经济负担、社会支持等，用于理解执行 aML 的患者抑郁水平。那里主要执行了两种流行的\
  \ ML 技术：支持向量机（SVM）和决策树（DT），以识别抑郁水平并预测建议，例如：更好的财务管理、听音乐、与家人和朋友聊天、遵循爱好等 [39]。Bradley\
  \ *等人* [40] 和 Suchal *等人* [41] 构建了简单的基于 K 最近邻（`k-NN`）的方法，而不是使用计算复杂的 ML 算法来学习 PHR\
  \ 配置文件和反馈。尽管 `k-NN` 被称为延迟学习过程，但它不需要单独的训练阶段，仅使用简单的基于相似性的决策程序。结果证明 `k-NN` 算法在 CBHRS\
  \ 背景下表现更优，并可以高效工作。Bocanegra *等人* 原型化的概率朴贝叶斯分类方法，根据数据库中存储的基于文本的 EMR、 EHR 预测医疗解决方案\
  \ [42]。\n\n\n\n\n# 11.9 基于内容的健康推荐系统的评估\n\n任何模型的性能评估对其成功都至关重要且关键。与其他任何领域不同，标准的统计衡量指标也被用于评估\
  \ `CBHRS` 的性能。然而，这些测量指标与信息检索和基于机器学习的模型使用的指标相似，例如准确率和误差 `[43]`、精确率和召回率 `[44]`、F 值\
  \ `[45]`、受者工作特征曲线 (ROC 曲线) `[46]`、均方根误差 (RMSE) `[47]` 等。准确率表示正确推荐的健康建议的数量，误差表示错误推荐的健康提示数量\
  \ `[43]`。在所有推荐提示中被正确推荐的相关建议的数量，以及所有相关建议中被推荐的建议比例，分别被称为精确率和召回率 `[44]`。随后，F 值取决于精确率和召回率的测量值，因为它将精确率和召回率结合为了单一测量值\
  \ `[45]`。ROC 曲线是利用灵敏度测量识别的真阳性对假阳性的视觉化表示 `[46]`。ROC 也用于在独立于阈值值的情况下比较不同的 `CBHRS` 算法。RMSE\
  \ 用于比较预测推荐与真实推荐。它计算所有推荐的平方误差，然后对平均值进行平方根运算，该值随着错误推荐的增加而增大，随着准确推荐的增加而减少 `[47]`。`HRS`\
  \ 的工作原理与大多数信息检索和基于机器学习的应用略有不同，因此传统的性能指标并不总是能很好地提供性能概述。例如，在基于内容的图像检索 (CBIR) 过程中，观察第一帧中相关图像的数量比关注所有检索到的相关图像更重要\
  \ `[48]`。这种场景会影响用户的注意力。因此，最近又引入了三个指标，如 k-top 推荐、惊喜性 (serendipity) 和覆盖率，以深度评估 `HRS`\
  \ 的性能 `[15]`。k-top 衡量在前某些推荐中生成的相关建议数量，惊喜性检查推荐是新的还是旧的，而覆盖率衡量是否所有可能的建议都已推荐。整个模型的接口和交互性质对于结合适当属性选择和机器学习算法实现来改进\
  \ `HRS` 以及 `CBHRS` 模型也具有重要意义。更好的交互和接口系统始终能将新知识纳入系统，吸引用户（在本例中为患者）的关注，并赢得进一步使用的信任。\n\
  \n## 11.10 CBHRS 的标准\n\n整个模型的接口和交互性质对于结合适当属性选择和机器学习算法实现来改进 `HRS` 以及 `CBHRS` 模型也具有重要意义。更好的交互和接口系统始终能将新知识纳入系统，吸引用户（在本例中为患者）的关注，并赢得进一步使用的信任。\n\
  \n### 11.10.1 微观级与清晰度\n\n`HRS` 的工作原理与大多数信息检索和基于机器学习的应用略有不同，因此传统的性能指标并不总是能很好地提供性能概述。例如，在基于内容的图像检索\
  \ (CBIR) 过程中，观察第一帧中相关图像的数量比关注所有检索到的相关图像更重要 `[48]`。这种场景会影响用户的注意力。\n\n### 11.10.2\
  \ 交互接口\n\n因此，最近又引入了三个指标，如 k-top 推荐、惊喜性 (serendipity) 和覆盖率，以深度评估 `HRS` 的性能 `[15]`。k-top\
  \ 衡量在前某些推荐中生成的相关建议数量，惊喜性检查推荐是新的还是旧的，而覆盖率衡量是否所有可能的建议都已推荐。\n\n### 11.10.3 数据保护\n\n\
  整个模型的接口和交互性质对于结合适当属性选择和机器学习算法实现来改进 `HRS` 以及 `CBHRS` 模型也具有重要意义。\n\n### 11.10.4 风险与不确定性管理\n\
  \n整个模型的接口和交互性质对于结合适当属性选择和机器学习算法实现来改进 `HRS` 以及 `CBHRS` 模型也具有重要意义。\n\n### 11.10.5\
  \ 医生参与环 (DiL)\n\n\n\n\n\n# 11.11 结论与未来研究方向\n\n推荐系统被大量的电子商务系统用于，向其用户提供相关且有趣的产品、服务等。然而，`HRSs`\
  \ 与其他推荐系统不同，因为它必须优先考虑对患者健康至重要的医学事实，而不是患者的个人偏好。这是一项涉及医疗建议的至关任务。在基于产品的推荐系统中，用户会被推荐他们过去喜过的类似产品；但在医学领域，患者应该完全遵循医学建议。因此，无关的健康建议比无关的商品建议要恶劣得多。这将会影响社会健康，并可能破坏人们对\
  \ `HRS` 的信任。本章描述了 `CBHRS` 的组件、功能和设计方法，以提供一个整体概念。尽管如此，本章从人机交互（HCI）感知和可行性的角度包含了一些子组件，这些组件在未来可能会纳入\
  \ `CBHRSs` 中。`CBHRSs` 近年来有了很大改进，但仍需进一步研究。\n\n`CBHRS` 仍处于婴儿阶段，需要解决几个开放的研究挑战，以成为独立且成熟的基于电子商务的医疗服务。本文报告了\
  \ `CBHRS` 的六个关键研究挑战，这些挑战必须由研究人员在未来解决。首先，`CBHRS` 的协作性质需要加强，因为其性能依赖于医学和工程知识。系统应该具备丰富的健康知识，并在现实生活中与患者和医生进行良好的互动。其次，人类个性会对健康和福祉产生影响。具体来说，健康恢复取决于患者遵循医学建议的程度以及对建议的信任。这些心理现象应该被探索并整合到\
  \ `CBHRS` 中。第三，财务问题需要仔细处理，即使用 `CBHRS` 的价格应设定在一个每个人都能使用该服务的水平。这必须通过高效的商业模式来决定，因为\
  \ `CBHRS` 的目标是为所有人提供更好的健康保健，而不是为制药行业盈利。第四，推荐应当尊重每个社区。例如，营养食品建议、疗法可能会根据患者所属的社区而异，这些知识应当成为\
  \ `CBHRS` 的一部分。第五，处理心理疾病的方法与其他疾病（如心血管疾病、肾脏疾病、感冒咳嗽、高血压、胃肠问题等）有所不同。医生通常使用观察、问答来识别患者的身体状况。研究人员和开发者未来也必须找到将这种感知融入\
  \ `CBHRS` 的方法，以做出更好的 `CBHRS` 并改善社会健康和福祉。第六，到目前为止极少数 `CBHRSs` 整合了 `DiL` 机制，然而医生是医学领域唯一的专家和决策者。可能会出现\
  \ `CBHRS` 因为冷启动问题（数据不足）无法产生适当的健康建议 [42]，这可以通过实施 `DiL` 和 `iML` 来解决。这将提高 `CBHRS` 的性能，有助于创建快速医疗服务，并使服务提供者能够远程访问为农村地区提供更好的医疗保健。\n\
