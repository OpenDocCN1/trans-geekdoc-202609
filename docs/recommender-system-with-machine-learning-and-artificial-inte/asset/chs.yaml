  \ AD`的预测中表现出其新颖性和稳健性，这是 AD 早期检测的关键因素。这些观察支持了其优于对手的优点和适用性。这些推理在图 18.7 中以图形形式给出了`precision`、`recall`和`F1-Score`。\n\
