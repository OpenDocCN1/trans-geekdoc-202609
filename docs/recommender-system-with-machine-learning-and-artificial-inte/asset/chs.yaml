  # 基于机器学习的乳腺癌推荐系统\n\n### 摘要\n所提出的基于机器学习的推荐系统旨在通过四个不同阶段预测癌症：数据收集；预处理；训练；验证。属性包括年龄、体质指数、血糖、胰岛素水平、脂联蛋白、抵抗素和单核细胞趋化蛋白-1。使用均方误差（`RMSE`）和平均绝对误差（`MAE`）来评估准确性。\n\
  \n### 关键词：健康推荐系统，机器学习，乳腺癌，预测。\n\n## 7. 引言\n医学和健康保健领域推荐系统（RS）的指数级增长引发了跨学科的研究。癌症是一种终末疾病，其特征是身体任何部分以肿瘤的形式出现异常细胞生长。国家癌症预防与研究所（NICPR）报告其约占所有癌症类型的\
  \ 14%。根据印度医学研究委员会（ICMR）的数据，“印度每年约有 15 万例乳腺癌新发病例，其中 7 万例死亡。”通过定期的筛查测试进行早期检测和诊断可以为及时治疗提供充足的机会；因此，研究人员利用机器学习（ML）和深度学习（DL）开发新型的自动化乳腺癌推荐系统。机器学习作为人工智能（AI）的一个分支，采用多种统计、概率和优化技术进行分类、聚类和预测。最近，推荐系统是基于机器学习和深度学习模型的最受欢迎且有效的应用之一。\n\
  \n\n\n\n推荐系统是一种活跃的在线信息过滤系统，包含了多种不同的范式，如图图 7.1 所示。\n\n![图 7.1 推荐系统的层级结构。](img/c07_image_3_1.jpg)\n\
  \n图 7.1 推荐系统的层级结构。\n\n下一节概述了常见的推荐系统类型。\n\n*   基于内容的（CB）推荐系统：该系统显式或隐式地对于用户提供的数据进行工作。根据这些数据创建用户画像，然后用它来为用户提供推荐。在这些系统中，需要根据每个项目的文本描述来评估任何两个不同项目之间的相似性。随着用户提供更多输入或对推荐采取行动，引擎会变得越来越准确。\n\
  \n*   协同过滤（CF）推荐系统：该系统通常根据从用户社区收集的反馈信息，对一组项目进行预测和推荐。它依赖于所有用户的个人评分或基于使用模式。它利用用户的过去行为信息和相似用户的信息来提供建议。该系统有两个子类，即基于内存的算法和基于模型的算法。\n\
  \    *   基于内存的算法使用所有可用数据进行预测。它尝试寻找与活跃用户相似的用户，并使用他们的偏好来预测活跃用户的评分。\n    *   基于模型的算法使用数据训练一个模型，稍后用于对未评分的数据进行预测。\n\
  \    *   这种方法可能具有速度和可扩展性的优点，并且比原始方法使用更少的数据快速预测。\n\n*   混合推荐系统：这种方法旨在通过结合 CB 和 CF\
  \ 算法来利用两者的潜力，从而提高推荐系统的准确性和性能。混合过滤技术通过在 CB 方法中应用某些 CF 方法，或者在 CF 方法中利用某些 CB 方法来实现\
  \ [6]。\n\n健康推荐系统（HRS）正在成为一种有效的医疗保健系统。这为基于患者生命参数的成功医疗治疗开辟了新途径。此外，通过对优化信息过载的使用，改进了技术的适当采用和利用，有助于为疾病预测收集更佳的洞察\
  \ [7]。由于其可行性和有效性，HRS 被认为是疾病和疾患预后及诊断的辅助决策工具。\n\n本章标题为“基于机器学习的乳腺癌预测推荐系统（MLRS-BC）”，旨在双重推荐：从健康数据集属性中选择最优属性，以及选择用于诊断或预测的最优机器学习模型。\n\
  \n## 7.2 相关工作\n\n本节概述了使用预测算法的基于机器学习的乳腺癌推荐系统的研究工作。这篇文献综述使研究人员了解这些算法在医学数据集上的行为。它可能进一步有助于探索该研究领域的新方向。\n\
  \nAslan *等人* 提出了四种机器学习模型——人工神经网络（ANN）、极端学习机（ELM）、支持向量机（SVM）和 K 近邻算法（KNN），使用名为乳腺癌科布拉数据集（BCCD）的常规血分析数据进行乳腺癌诊断。作者在\
  \ UCIrvine ML 仓库上实验并验证了他们基于超参数优化的算法，该仓库包含 116 个实例和 10 个显著属性。该数据集在非癌症和癌症患者数据上具有良好的分布，并对结果进行了分析。在这些算法中，ELM\
  \ 产生的平均分类准确率为 80% [8]。\n\nPolat 和 Senturk 提出了一种使用机器学习技术进行乳腺癌预测的新型混合方法。对于他们的研究，使用了具有\
  \ 116 个实例和 10 个属性的 BCCD。使用了中位数绝对（MAD）归一化、K-Means 聚类加权和自适应提升分类器。[9]。\n\nAustria *等人*\
  \ 比较分析了不同分类器的性能，即逻辑回归、SVM、决策树、朴素贝叶斯、随机森林、梯度提升方法（GBM）和 KNN，用于 BCCD 的分类。结果显示，M 的准确率为\
  \ 74.14%。[10]。\n\nKamath *等人* 提出了一种用于疾病预测和推荐的新型方法。数据收集自国家健康医疗调查（NHAMCS），该调查包含 37,000\
  \ 个实例和 430 个属性。他们使用 Jaccard 相似性量配合 CF 方法来开发相关症状的推荐系统。他们比较了 SVM 基于分类器与其他算法的结果。获得的准确率为\
  \ 93.74% [11]。\n\nMarlin *等人* 提出了一种用于定制健康通信的 CF 推荐系统。他们的工作目标是根据发送的消息监控健康行为。结果显示大多数表达了积极观点。观点之间的相关性很高。此外，通过一系列实验进行了未来预测\
  \ [12]。\n\n## 7.3 方法论\n\n### 7.3.1 实验数据集\n\n用于本研究的乳腺癌科布拉数据集（BCCD）数值和分类属性获取自 UCI\
  \ 机器学习仓库 [13]。表 7.1 显示了 BCCD 的属性描述。它包含 64 条乳腺癌记录和 52 条健康记录，基于常规血分析。对整个 116 个实例的数据集进行了目标研究分析。该仓库创建于\
  \ 2018 年 [14]。在数据集中，数值属性是独立参数，分类属性是依赖参数。\n\n高体重指数（BMI）是乳腺癌的主要风险因素。此外，当瘦素蛋白、抵抗水平增加且脂联蛋白分泌减少时，癌症更容易发生。此外，绝经后女性通过代谢综合征（特别是胰岛素抵抗和腹部脂肪）患乳腺癌的较高。为了识别亚临床胰岛素抵抗的患者，可以使用稳态模型胰岛素抵抗（HOMA-IR）。根据该数据集，葡萄糖、胰岛素、脂联蛋白和抵抗与\
  \ BMI 之间的关系是乳腺癌发生和进展的主要因素 [15]。\n\n\n\n\n\n| BMI | 患者的体质量指数 | 单位: kg/m² & 范围: 18–38\
  \ |\n| 血糖 | 患者的血糖水平 | 单位: mg/dl |\n| 胰岛素 | 患者的胰岛素水平 | 单位: μU/ml |\n| HOMA | 稳稳态模型评估\
  \ = \\[log ((If) × (Gf)) / 22.5\\] | – |\n| 瘦蛋白 | 患者的瘦蛋白水平 | 单位: ng/ml |\n| 脂肪因子蛋白\
  \ | 患者的脂肪因子聚蛋白分泌水平 | 单位: μg/ml |\n| 抵抗素 | 患者的抵抗素水平 | 单位: ng/ml |\n| MCP-1 | 单核细胞趋化因子蛋白-1\
  \ | 单位: pg/dl |\n| 分类 | 健康对照组 (1)，患者组 (2) | – |\n\n其中 `If` 和 `Gf` 分别是胰岛素水平和血糖水平。\n\
  \n### 7.3.2 特征选择\n\n特征选择是提取对计算模型性能影响最大的最相关细节的过程。因此，这一过程在设计模型时起着至关重要的作用。它还有助于对抗过拟合，这可能会提高准确性并缩短训练时间。相关性矩阵结合热图特征选择技术应用于此数据集。观察到，这种方法优于其他特征选择技术，如单变量选择和特征重要性。相关性矩阵可以通过寻找独立属性与依赖属性之间的相关程度来衡量\
  \ [10]]。在生成的相关性矩阵上，热热图用于绘制相关性特征，如图图 7.2 所示。\n\n通过使用此相关性矩阵，选择了最相关的特征：年龄、BMI、血糖、胰岛素和\
  \ MCP.1，以实现高预测性能。\n\n![图 7.2 BCCD 的相关性矩阵热图。](img/c07_image_7_4.jpg)\n\n**图 7.2**\
  \ BCCD 的相关性矩阵热图。\n\n### 7.3.3 MLRS-BC 的功能阶段\n\nMLRS-BC 的阶段如图图 7.3 所示，其工作流如图图 7.4\
  \ 所示。此处描述了 MLRS-BC 每个阶段 [6] 的的功能：\n\n*   数据收集阶段：这是第一阶段，负责收集患者的基本信息并生成具有相关属性的患者实验概况。在此阶段，收集的信息基于来自\
  \ UCI ML 仓库的 BCCD，其中包含了患者的人体测量数据和健康参数 [13]]。\n*   预处理阶段：该阶段接受数据集作为输入并提取数据集的最佳特征。然后将结果传递给数据学习，以获取患者特征特征。\n\
  *   训练、测试和验证阶段：在此阶段，将选定的特征分别划分为训练集和测试集。训练集用于学习，测试集用于预测。\n*   预测/推荐阶段：将预测算法应用于训练和测试数据，根据特征选择来衡量算法的性能。MLRS-BC\
  \ 根据性能指标推荐最佳特征。该系统还为预测推荐理想的 ML 模型。\n\n![图 7.3 MLRS-BC 的阶段。](img/c07_image_8_7.jpg)\n\
  \n**图 7.3** MLRS-BC 的阶段。\n\n![图 7.4 MLRS-BC 的流程图。](img/c07_image_9_1.jpg)\n\n**图\
  \ 7.4** MLRS-BC 的流程图。\n\n### 7.3.4 预测算法\n\n预测算法应用于训练和测试数据，根据特征选择来衡量算法的性能。MLRS-BC\
