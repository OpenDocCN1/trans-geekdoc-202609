  \ AD 分类的建议程度采用 6 级量表[优、良、中、低、差、极]，相应的性能映射如下：\n\n1. 达到 0–9%时性能为极差；\n2. 达到 10–29%时性能为较差；\n\
  3. 达到 30–49%时性能为低；\n4. 达到 50–69%时性能为中等；\n5. 达到 70–89%时性能为良好；\n6. 达到 90–100%时性能为优。\n\
