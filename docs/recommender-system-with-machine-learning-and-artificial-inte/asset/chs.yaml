  \ R., 基于用户建模的三向推荐系统.\n\n\n\n如今，在线社交媒体（OSM）对工业、商业和社会的各个方面以及用户的生活产生了巨大影响。在在线社交网络（OSN）平台中，触达目标用户是大多数企业和其他组织的主要关注点。识别和推荐具有影响力的目标有助于高效、有效地获取合适的受众。在本文中，讨论了一种以自我中心为角的\
  \ OSN 中的有效模型，该模型通过整合高效的影响力衡量推荐系统，为任何特定的社交网络用户在所有连接网络成员中生成一份最具影响力的目标用户列表。首先，根据所有活动更新交互网络成员列表。随后，根据特定的影响力类别和情感类型，推荐活动最相似的交互网络成员。此后，在这些更新后的交互网络成员列表中，通过分析其活动内容与主用户活动内容的相似性和发生频率，根据所需数量识别出最具影响力的网络成员，并进行恰当的排名。通过这两个持续连续的阶段，从任何社交网络的自我中心视角出发，区分出了主用户最具影响力的目标有效列表。\n\
  \n**关键词：** 具有影响力的目标、社交活动、影响力衡量、内容分类、情感分析、推荐系统、在线社交媒体（OSM）、自我中心在线社交网络（OSNs）\n\n##\
  \ 21.1 引言\n\n过去几年中，在线社交媒体（OSM）引起了用户的巨大关注并极大增长。如今，全球数百万用户将这些平台视为日常生活的一部分，花费大量时间来创建和观察许多信息。通过这些平台，用户可以通过文本、视觉和网页内容创建或交换他们的观点或思想，还可以对自己或其他用户的内容进行反应、评论、分享和标签标记。因此，这些在线社交媒体（OSM）平台吸引了数据驱动型业务行业的关注，通过分析他们的社交活动内容、类型和频率，理解或获取有关客户、偏好、选择以及各种影响参数的宝贵信息。\n\
  \n社交网络观察通常有两种类型，例如自我中心的方法和以为中心的方法 [1]。在以为中心的方法中，考虑的是完整或整个网络；而自我中心的方法关注个体（称为 ego）网络，重点关注该个人与所有连接人员（称为\
  \ alters）之间间接或直接的交互。在我们目前的论文中，讨论了一种有效的算法数学技术，通过将高效的影响力衡量 [2, 3] 与重大的推荐系统相结合，以便在自我中心在线社交网络中任何特定的社交网络用户（主用户）在所有交互网络成员中生成一份最具影响力的目标用户列表。\n\
  \n首先，根据与主用户的活动选择交互网络成员列表，然后根据对所有五类社交活动的活动内容分类（五类）和情感（两类）分析，对所有交互网络成员进行分类。之后，通过一个重大的推荐系统对文本词法分析（相似性和频率）进行操作，再次对交互网络成员列表（基于活动）进行较低权值的更新；在此基础上，通过分析其发布内容相对于目标用户发布内容的推荐情况，推荐活动最相似的交互网络成员并进行恰当的排名。然后，在这些更新后的交互网络成员列表中，根据所需数量在任何特定的影响力类别和特定的情感类型中识别出最具影响力的网络成员。\n\
  \n所提出的模型可以分别处理主用户的三个最流行的社交网络平台：Facebook*、Twitter^(†)、LinkedIn^(‡)，并且仅考虑自我中心场景，因为当研究重点是网络中的个人而非完整网络分析时，这种方法是有用的。下一节将讨论该领域的\
  \ en 工作，作为文献综述。之后，后续章节将涵盖数据收集、预处理、影响力和活动分析以及所提出的推荐系统。最后两个章节包含结论和未来展望。\n\n## 21.2\
  \ 文献综述\n\n网络结构、其属性和分析在商业工业的各个领域也非常常见。OSN 结构可以描述为一种图或网络结构，它由个体集合以及他们之间的链接或关联组成。在网络环境中识别最重要的目标对于解决与网络相关的各种问题和服务来说至关重要。首先，图论概念被用于社交网络的拓扑或结构分析。对连接用户的社交活动分析也有助于通过见性知识来探索网络。\n\
  \n在 OSNs 中识别具有影响力的目标在业务应用方面具有巨大意义。它可以帮助企业或组织触达其目标受众。因此，这一领域吸引了许多研究者的关注。识别具有影响力的目标基本上上是一个影响力最大化问题。已经提出了许多数学和算法技术来识别网络中具有影响力的目标或用户。\n\
  \n\n\nDomingous 和 Richardson [4] 在该研究领域进行了首次研究。在他们的研究中，他们没有将市场视为一组独立的实体，而是将其视为一个社交网络，并在工作中将其表示为马尔可夫随机场。他们开发了三种用于确定高影响力用户的算法，这些算法可用于病毒式营销。他们还讨论了对用于识别高影响力目标的一些重要方法的评论。Kempe\
  \ 等人 [5] 将影响最大化制定为一个离散优化问题，并证明了该优化问题是 NP-hard 的。通过实验，他们证明了提出的算法在影响最大化方面显著优于经典的基于度和中心性的启发式方法。Bonchi\
  \ [6] 进一步扩展了他的工作，从数据挖掘的角度展示了影响的扩散。然而，Saito 等人 [7, 8] 揭示了不同话题的扩散是不相同的，因为用户的不同偏好会影响他们在特定话题传播中的作用。稍后，Tang\
  \ 等人 [9] 提出了使用主题关联传播（TAP）针对大型社交网络的话题级社交影响。随后，Zhou 等人 [10] 基于用户选择，利用两阶段挖掘算法提出了 Top-K\
  \ 高影响力节点挖掘。Li 等人 [11] 提出考虑个人的个体行为来建模异构社交网络中的影响传播。Marsden [12] 讨论了自我中心和社会中心网络上的中心性度量。随后，Chung\
  \ 等人 [1] 提到了社交网络分析中的自我中心和社会中心方法，并强调了这两种情况的范围或挑战。\n\n为了衡量在线社交网络（OSN）中用户的活动，Debnath\
  \ 等人 [13] 分析了特别针对 Twitter 网络用户活动的词汇和引用参数。在自我中心 OSN 中，他们提议仅考虑活动行为来识别前 k 个高影响力者 [2]。在另一项研究\
  \ [3] 中，他们考虑了用户的网络结构及其网络成员（包括对他们之间活动行为的分析），并提出了一种基于自我中心 OSN 的模型，以识别作为该用户之节点的高影响力用户。\n\
  \n## 21.3 详细的数据集收集过程\n\n作为我们算法方法的输入，对于任何特定用户，都需要长时间的大量社交媒体内容，并包含来自 `Facebook`、`Twitter`、`LinkedIn`\
  \ 等不同社交媒体平台的详细信息。因此，这里从过去几年收集了特定用户及其与其活动相关的网络成员的所有社交媒体活动，并为每个网络准备了九个不同内容的数据集。顺序流程如下（所示于图\
  \ 21.1）。\n\n![Figure 21.1 Diagram of dataset collection process.](img/c21_image_5.jpg)\n\
  \nFigure 21.1 数据集收集过程流程图。\n\n### 21.3.1 主用户的活动\n\n对于个人在线社交媒体（OSM）平台，从活动日志中在很一段时间内收集了主用户的所有详细活动内容。数据集包括：主用户的原始帖子、评论帖子、互动帖子（数据集\
  \ 1）、分享帖子（数据集 2）以及（数据集 3）。\n\n### 21.3.2 网络成员的活动\n\n在自我中心 OSN 中，从活动日志中在很一段时间内收集了网络成员的所有详细活动内容。数据集包括：网络用户的原始帖子、评论帖子、互动帖子（数据集\
  \ 6）、分享帖子（数据集 7），以及与其他成员的对话（数据集 9）。\n\n### 21.3.3 数据收集的工具和库\n\n对于这一数据收集阶段，正如 Fredrik\
  \ 和 Stolpe [14] 提到的，从社交媒体（`Twitter`、`Facebook`、`LinkedIn`）使用不同的库是有用的。因此，可以使用 `Twitter4J`、`Facebook4J`、`LinkedIn4J`\
  \ 以及 `REST API` 分别爬取数据（数据集 `3` 和 `8`）。但使用 Hedley [16] 的 `jsoup` Java 库从任何帖子获取评论/回复线程。\n\
  \n### 21.3.4 数据集的详细信息\n\n在这里，首先将主用户的帖子内容和互动的网络成员（数据集 5）存储在不同的文件夹中，并将网络成员的数据单独分开。随后，根据不同的活动类型（互动、评论、标签和分享），将所有帖子存储在特定用户文件夹内的四个\
  \ CSV 文件中。在这些数据集中，共有八列不同的属性，分别是：推文 ID、推文内容、用户名、用户 ID、点赞数、转发数、语言、时间以及评论线程。下方显示了文本格式的示例\
  \ Twitter 数据（所示于图 21.2）。\n\n## 21.4 数据的初步处理\n\n正如我们所知，适当的预处理对于使算法产生更好的结果至关重要。因此，这里整合了除数据集\
  \ 5 外的所有数据集的四种不同的文本处理工作，并在下文中简要讨论（所示于图 21.3）。\n\n### 21.4.1 语言检测与翻译\n\n使用 Loria\
  \ 等人 [17] 的 `TextBlob` Python 库，对所有社交内容的语言进行了检测；如果存在非英语，则将其翻译为英语。\n\n![Figure 21.2\
  \ Snapshot of a tweet data crawled from Twitter.](img/c21_image_7_1.jpg)\n\nFigure\
  \ 21.2 从 Twitter 爬取的推文数据截图。\n\n![Figure 21.3 Diagram of data processing process.](img/c21_image_7_3.jpg)\n\
  \nFigure 21.3 数据处理流程图。\n\n### 21.4.2 被标记推特用户的收集\n\n对于推文，所有跟随 `@` 符号的单词都代表被标记用户的用户名。因此，这些单词已从推文中移除，被标记用户已添加到数据集\
  \ 5 中。\n\n### 21.4.3 文本噪声去除\n\n\n\n\n所有特殊符号、排除单个逗号和句号外的特殊符号集、代表表情符号的表情、附件图像和 GIF\
  \ 文件的无法识别字符已从所有社交内容中移除。\n\n### 21.4.4 文本拼写纠正\n\n使用 Loria 等人开发的 `TextBlob`\\* Python\
  \ 库 \\[17]，所有文本情况均已转换为小写，并对所有社交媒体内容中的拼写异常的单词进行了纠正。\n\n## 21.5 影响力和社交活动分析\n\n在此，在方法论上，通过分析特定时间段内\
  \ `Dataset 5` 中主用户及其交互网络成员的社交活动，尝试评估其影响力。详细的顺序流程见下方（见图 21.4）。\n\n![图 21.4 影响力和活动分析流程图。](img/c21_image_8_1.jpg)\n\
  \n**图 21.4** 影响力和活动分析流程图。\n\n### 21.5.1 步骤 1：从 OSM 中选择目标\n\n在此，首先仅考虑 `Dataset 5`\
  \ 中所有交互网络成员的列表，其中仅包含`可影响目标`的成员，因为其他成员在特定时期内没有通过活动与`主用户`产生关联。这也降低了我们算法的复杂性。\n\n这些`可影响目标`和\
  \ `OSMs` 分别对应 `Facebook`、`Twitter`、`LinkedIn` 的朋友、粉丝和人脉，以及所有这三个 `OSMs` 的关注页面。值得注意的一点是，由于隐私以及其他已知/未知\
  \ `OSM` 用户（作为 `admin`）的批准功能，公共和私有群组永远无法成为`可影响目标`。其表示见下方（见表 21.1）。\n\n### 21.5.2\
  \ 步骤 3：社交内容的分类\n\n在此，来自 `Dataset 1` 和 `4`（主用户数据）以及 `Dataset 6` 和 `9`（交互网络成员数据）的所有社交活动数据，通过使用基于\
  \ `TensorFlow` 2.0 的 `LSTM`\\*（一种常用的循环神经网络 `RNN`）进行多分类文本分类，分为五类（`技术、政治、体育、商业和娱乐`）。\n\
  \n此分类阶段未应用于来自 `Dataset 2` 和 `3`（主用户数据）以及 `Dataset 7` 和 `8`（交互网络成员数据）的其他依赖数据，这些数据不归发布者所有，且分别依赖\
  \ `Dataset 1` 和 `6`。\n\n### 21.5.3 步骤 4：社交内容的情感分析\n\n在此，来自 `Datasets 1`, `2`, `3`,\
  \ `4`（主用户数据）以及 `Datasets 6`, `7`, `8`, `9`（交互网络成员数据）的所有社交活动数据，已根据 `VADER`\\*（效性感知词典和情感推理器）对之前的每个类别类别分为两种情感类（`积极`和`消极`）进行分析。VADER\
  \ 是一种基于词典和规则的情感分析，它使用情感词典和词汇特征列表（例如单词）的组合，并将其标记为语义方向；积极或消极。\n\n**表 21.1** 可影响目标和在线社交媒体（OSM）平台的表示。\n\
  \n| OSMs | Facebook | Twitter | LinkedIn |\n| --- | --- | --- | --- |\n| 可影响目标 |\
  \ 朋友和粉丝 | 人脉和粉丝 |\n| --- | --- | --- |\n| Facebook 页面 | Twitter 页面 | LinkedIn 页面\
  \ |\n\n## 21.6 推荐系统\n\n在所提出的工作中，对主用户及其交互网络成员（`Dataset 5`）的所有活动内容属性已通过词汇分析（相似性和频率）进行了分析。\n\
  \n这里的主要目标是根据主用户的所有帖子内容，推荐交互网络成员中相似度最高的帖子内容。之后，派出了与主用户活动内容非常相似的交互网络成员短更新列表（`updated\
  \ Dataset 5`）。详细的顺序阶段见下方（见图 21.5）。\n\n### 21.6.1 数据的二次预处理\n\n在此，针对除 `Dataset 5`\
  \ 外的所有所有数据集，使用了仅用于此推荐过程的 `Natural Language Toolkit (NLTK)`(†) 实施了三种不同的预处理工作。这些阶段主要负责移除所有不必要的细节，以通过内容分析获得更好的推荐结果。\n\
  \n![图 21.5 推荐流程图。](img/c21_image_10_1.jpg)\n\n**图 21.5** 推荐流程图。\n\n#### 步骤 1：停用词移除\n\
  \n此阶段负责从每个帖子内容中移除所有频繁出现的无用词（`停用词`），这些词会严重影响帖子内容的推荐索引。在此，所有帖子内容都已进行分词，并移除了所有此类单词（例如，`wh\
  \ 词`、`be 和 have 动词形式`、`冠词`、`介词`、`连词`等），分别使用了 `nltk.tokenize` 和 `nltk.corpus` Python\
  \ 包。\n\n#### 步骤 2：无词干化的词还原\n\n此阶段负责将上一阶段提取的所有单词转换为每个帖子内容的根形，以减少单词数量并产生高效的推荐。因此，我们应用了词还原而不是`词干提取`，因为后者有时会生成不存在或意外的单词，而词还原总是能生成实际的根形。在此使用了\
  \ `WordNetLemmatizer`，它包含了 `nltk.stem` 包中 `wordnet` 模块内 `WordNet`\\* 的形态功能。\n\n\
  #### 步骤 3：文档集转换\n\n在完成之前的阶段后，实际上生成了一个新的优化数据集 `Document-Set`，该数据集中的每个帖子内容被视为一个独立的文档。所有用户的独立帖子内容（`document`）将作为后续推荐过程的关键输入数据。\n\
  \n### 21.6.2 社交活动内容的推荐分析\n\n推荐流程通过后续四个顺序任务提出，对先前预处理的数据集（`Document-Set`）中的每个独立帖子内容（`document`）进行分析，并为所提出的推荐系统产生更合适的结果。\n\
  \n#### 步骤 1：Word2Vec 模型利用\n\n此阶段负责利用之前提到的 `Document-set`，使用 Google 的预训练 `Word2Vec`\\\
  * 模型为每个帖子内容/文档的所有单词生成`单词向量`，并根据它们之间的`对距离`从向量对中检索`余弦相似度`值。由于这是改进推荐结果的关键阶段之一，因此，该模型的实现使用了\
  \ `gensim`(†)，这是一个在信息检索（IR）和自然语言处理（NLP）领域流行的 Python 包。\n\n#### 步骤 2：BoW 模型利用\n\n\
  \n\n\n此阶段负责生成表格结构，其中包含了之前提到的文档集中所有帖子内容/文档中词汇的`频率`或`出现次数`。在这里，对于文档集的每个帖子内容/文档已进行了分词（tokenized），然后创建了一个包含该文档所有词汇频率的字典。这是`词袋模型`(BoW）的一种实现，其中行代表文档，列代表唯一词汇。\n\
  \n### 步骤 3：Tf–idf 模型\n\n此阶段负责为之前提到的文档集中每个帖子内容/文档的所有词生成`向量值`，使用`tf–idf`（词频-逆文档频率）模型，基于`scikit-learn`的`feature_extraction`模块，该模块在机器学习（ML）领域非常流行。在这里，第一个`词频`(term\
  \ frequency）与`词袋模型`(BoW）的结果相同，第二个`逆文档频率`(inverse document frequency）代表任何文档中任何词的非出现次数。\n\
  \n### 步骤 4：基于文档的推荐用户\n\n在这里，利用之前阶段的输出结果，根据相似性和频率通过文档（帖子内容）创建一个新的交互网络成员`主用户`列表。所提出的推荐算法（算法\
  \ 1）解释如下。\n\n![](img/c21_image_12.jpg)\n\n![](img/c21_image_13.jpg)\n\n## 21.7 高影响力目标评估\n\
  \n现在这里，所有归一化的推荐索引`R^+d`针对所有影响力目标用户分别从类别和情感进行区分，并根据另一种算法方法（算法 2）所需的数量进行评估。\n\n![](img/c21_image_14.jpg)\n\
  \n## 21.8 结论\n\n在本章中，考虑到自我中心社交网络（Egocentric Social Networks）场景，通过结合具有有效影响力测量过程的推荐系统，解释了针对特定社交网络用户（主用户）生成高影响力目标列表的方法。\n\
  \n首先，对交互网络成员（基于活动）的列表根据其社交活动分类和情感类型进行了更新，随后使用基于相似性和频率的词法分析推荐系统对具有最相似活动的交互网络成员的帖子内容进行合理的排名。\n\
  \n之后，从该更新的交互网络成员列表中，根据社交活动的任何特定类别和情感（例如，政治类别和积极情感）识别出高影响力目标网络成员（用户）。\n\n该算法模型可以通过分析之前研究工作中类似的结果进行交叉验证[2,\
  \ 3]。这些测试程序非常耗时，且有时基于假设[18, 19]，这些开创性研究已经在这些领域成功识别。\n\n## 21.9 未来\n\n首先，未来更新的大量数据集是结果分析最重要的方向，这也为我们的算法模型提供了许多改进或可能。这项研究还可以扩展到更多影响力类别和子领域，并增加语义分析。此外，还可以结合社交活动内容的更多自然语言处理（NLP）工作，如个性分析[3]、情感识别等。\n\
  \n由于我们只考虑了文本数据，因此考虑图像是一个巨大的领域，尽管之前已经实现了一些方法，如 Patel 等人*从图像中恢复文本部分的`光学字符识别`(OCR）[20]，以及\
  \ Rakshit 等*对图像进行分类的`卷积神经网络`(CNN)[21]。\n\n包括上述所有范围，还有许多在我们之前的研究论文中已经提到的未发现领域[2,\
  \ 3]，这将为未来提供广阔的前。\n\n## References\n\n1. Chung, K.K., Hossain, L., Davis, J., Exploring\
