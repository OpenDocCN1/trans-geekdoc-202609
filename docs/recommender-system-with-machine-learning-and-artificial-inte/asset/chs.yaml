  \n# 第二部分：基于机器学习的推荐系统\n\n## 4 机器学习视角下的推荐系统概念\n\nSumanta Chandra Mishra\nAdway Mitra\
  \ 与 Deepayan Chakraborty\n人工智能卓越中心，Kharagpur\n\n### 摘要\n推荐系统在过去十年中已成为一个独立的研究领域。随着互联网的普及，用户数量日益增加。因此，为了预测需求并建议相关信息，公司使用了不同的信息机制。这种信息机制被称为推荐系统。该软件模块根据用户的历史数据或相似用户的数据进行预测。\n\
  \n本章讨论了推荐系统的不同概念和技术。同时也包含了挑战与应用。\n\n**关键词**：推荐系统，基于内容的系统，协同过滤，混合推荐\n\n## 4.1 引言\n\
  你是否曾想过社交媒体是如何给出新建议的？在线购物网站为什么要推荐不同的商品？为什么会在 YouTube 上收到各种视频建议？我们获得这些内容是因为持续分析数据并提供建议的底层软件。这种底层软件就是推荐系统。\n\
  \n推荐系统是一种信息过滤系统，帮助用户做出决策。该过滤系统跟踪用户的活动，并通过其智能算法预测用户的未来选择。\n\n推荐系统被视为机器学习系统的一种应用，为用户推荐最相关的产品和服务。通过这种建议可以帮助用户和供应商进行恰当的交易。这些算法寻找用户过去选择与当前可用产品之间的相关性并给出相应的建议。为了提供更好的建议，底层算法会检查网页内容的可能性、社交媒体互动信息、用户的频繁搜索主题、关于用户的先验知识、相似用户的兴趣等。\n\
  \n## 4.2 推荐系统的实体\n\n\n\n\n\n总的来说，推荐系统主要处理三个方面，即用户、项目和动作 [4]。用户是客户，而项目指的是推荐给客户的物体或信息。动作无非是客户与推荐系统之间的交互，这有助于推荐系统为未来提供建议。这三个组件相互关联，并被视为推荐系统中不可缺的组成部分（图\
  \ 4.1）。在本节中，我们将简要讨论它们。\n\n#### 4.2.1 用户\n\n用户被称为推荐系统的主要组件或主要实体。推荐系统的出现是因为存在需要不同个人兴趣服务的用户的\
  \ [11, 12]。用户可以是 YouTube 视频的观看者，可以是在线产品的购买者，也可以是特定研究领域的研究人员 [17] 等。\n\n![图 4.1 推荐系统的实体。](img/c04_image_3_1.jpg)\n\
  \n图 4.1 推荐系统的实体。\n\n推荐系统获取关于用户的不同信息以创建用户画像或用户模型。该画像有助于过滤提供给用户的建议。用户画像包含了用户的搜索活动和行为。用户对特定项目的评分、用户搜索的网页等，都是构建用于项目推荐的用户画像或用户日志的组件。\n\
  \n#### 4.2.2 项目\n\n项目是向用户推荐的有价值的实体。如果用户对推荐的项目产生兴趣，则推荐的价值被视为正面的，否则被视为负面的 [18]。项目总是与成本相关，包括搜索该项目花费的时间和获取该项目花费的资金。因此，推荐系统的责任为客户提供更好的建议，以减少搜索成本。\n\
  \n推荐系统利用项目的不同特征进行评估和建议。某些特征值是固定的，而另一些特征值随时间变化。如果我们考虑的项目是手机手机，那么它的品牌、颜色等对于特定产品来说是固定的，但该产品的评分和建议会随时间变化。当一个项目具有更多特定特征时，它被视为复杂项目；而如果该项目具有更多通用特征，则被推荐系统视为一个简单项目。\n\
  \n#### 4.2.3 动作\n\n动作是用户为了某个项目与系统交互时执行的交易。动作可以是对项目的搜索，也可以是对项目的反馈。这些动作存储在推荐系统的动作日志中。\n\
  \n在推荐系统中，用户提供的反馈可以有不同的形式，例如一元、二元、数值和建议文本。一元系统只存储正值；例如，如果用户购买了一个项目，则“已购买项目”特征就会增加；否则，特征值没有变化\
  \ [4]。在二元系统中，用户将对产品给出正向或负面的反馈，如喜欢或不喜欢。同样，在数值反馈中，项目的价值通过某个范围内的数值进行分析。五星评分系统就是一种数值反馈系统。最后一种形式的反馈是用户对特定产品提供的建议，这有助于其他人在选择产品时做出更好的决策。交易日志记录所有这些信息，以便对产品和进行进行更好的分类，并识别用户的兴趣。\n\
  \n推荐系统的底层机制如图图 4.2 所示。它表明在 N 个项目中，推荐系统根据与特定用户和项目相关的日志信息选择少数项目。它还会考虑动作日志来决定相关的建议。\n\
  \n## 4.3 推荐技术\n\n推荐系统根据不同的业务需求和目标客户应用不同的技术。当涉及到目标用户时，推荐可以分为两类，例如个性化推荐系统和非个性化推荐系统\
  \ [11, 12]。同样，当涉及到信息的评估或过滤时，推荐系统可以分类为基于内容的方法和协作方法 [9, 10]。除了这些，还有其他不同的推荐技术 [7, 8]，我们将在本节中讨论。\n\
  \n![图 4.2 机制。](img/c04_image_4.6)\n\n图 4.2 机制。\n\n### 4.3.1 个性化推荐系统\n\n基于目标用户，推荐可以分为两种类型，即个性化和非个性化推荐系统。个性化推荐依赖于单一用户，这里的建议基于个人活动\
  \ [11]。在线购物网站使用个性化推荐建议不同的项目。\n\n### 4.3.2 非个性化推荐系统\n\n在非个性化推荐的情况下，网站根据不同类型用户的特征评估给出一般的偏好\
  \ [11, 12]。一种此类非个性化推荐是在线新闻机构提供的建议。非个性化推荐对购买习惯没有直接影响，因此此类系统的关注度较少。\n\n### 4.3.3 基于内容的过滤\n\
  \n推荐系统可以大致分类为基于内容的方法和协作过滤方法 [1–5, 9]。图 4.3 表示推荐系统中使用的不同类型的过滤机制。\n\n基于内容的方法根据用户对类似项目的过去行为向用户推荐项目。这里的相似性通过项目的内容来衡量。我们在不同网站获得的电影推荐就是基于内容推荐的例子。\n\
  \n基于内容的系统需要良好的项目描述来进行合理的预测。让我们考虑一个书籍推荐系统，如图图 4.4 所示。它显示用户对书籍 A 感兴趣并购买了它。现在，基于内容的推荐器找到了与书籍\
  \ A 内容或特征相似的书籍 B，并向用户推荐它。\n\n![图 4.3 基于信息的过滤技术类型。](img/c04_image_6_1.jpg)\n\n图 4.3\
  \ 基于信息的过滤技术类型。\n\n![图 4.4 基于内容的过滤机制（书籍推荐）。](img/c04_image_6_3.jpg)\n\n图 4.4 基于内容的过滤机制（书籍推荐）。\n\
  \n### 4.3.4 协作过滤\n\n\n\n\n\n协同过滤方法使用了基于模型的[13–16]和基于内存的[3, 4, 18]方法来对用户的需求做出准确判断。在这种方法中，根据其他用户对这些物品的行为和偏好，向新用户推荐物品。这种方法的一个示例可以在\
  \ Amazon 或 Flipkart 等购物网站中看到，其中推荐系统会建议用户可能喜欢或购买的某些物品。这种建议是基于其他客户的购物行为和产品规格 [5]。\n\
  \n为了有更好的理解，让我们考虑图 4.5 所示的信息。它显示有三位客户和三本书。这里，从客户到书籍的实线箭头表示客户购买了该书。同样，从书籍到客户的虚线箭头表示该书籍被推荐给该客户。最初，客户-1\
  \ 购买了书籍 A，系统想向客户-1 推荐一本新书。系统检查客户-1 和其他客户之间的相似性，发现客户-2 与客户-1 有相似的书籍兴趣，且客户-2 购买了书籍\
  \ A 和书籍 C。因此，它向客户-1 推荐书籍 C。\n\n在协同过滤中，用户之间的相似性可以使用相关性和余弦技术计算 18](#c04.xhtml#c4-note-0018)]。两个用户\
  \ `P` 和 `Q` 之间的相关性取决于 `P` 和 `Q` 给出相似反馈或评分的物品数量。如果有 n 个物品，那么 `P` 和 `Q` 的评分可以用两个向量表示\n\
  \n![image](img/c04_Inline_7_5.jpg)![图 4.5 协同过滤机制（书籍推荐）。](img/c04_image_7_6.jpg)\n\
  \n**图 4.5** 协同过滤机制（书籍推荐）。\n\n如果这些评分的相应平均值为 `p[m]` 和 `q[m]`，那么 `P` 和 `Q` 之间的相关性由：\n\
  \n(1)![image](img/c04_Inline_8_11.jpg)\n\n同样，余弦相似性通过欧几里得点积方法计算。表示为：\n\n(2)![image](img/c04_Inline_8_12.jpg)\n\
  \n在上面的方程中，`Θ` 是 `P` 和 `Q` 在 n 维空间中的角。\n\n### 4.3.5 基于模型的过滤\n\n推荐系统使用不同的机器学习和人工智能算法[13–16]为了获得更好的预测，考虑了用户的历史、产品特征以及其他客户的行为。其中许多无法直接计算，而必须使用数学模型进行估计。\n\
  \n基于模型的推荐涉及检查数据并建议物品的学习算法。不同的研究人员建议了不同的过滤机制。这些机制使用最近邻聚类、贝叶斯概率模型和神经网络，在向客户提供建议之前进行适当的分类和精炼。\n\
  \n### 4.3.6 基于内存的过滤\n\n基于内存的过滤器是邻域过滤器，检查当前用户与其他用户之间的偏好相似性。它还比较了用户对一组产品或服务的可能性以给出合理的建议。它取决于用户的响应，并且随着时间的推移，数据增加，建议会变得更好。最初，客户-1\
  \ 购买了书籍 A，系统想向客户-1 推荐一本新书。系统检查客户-1 和其他客户之间的相似性，发现客户-2 与客户-1 有相似的书籍兴趣，且客户-2 购买了书籍\
  \ A 和书籍 C。因此，它向客户-1 推荐书籍 C。\n\n考虑有五位用户（`User-1`, `User-2`, `User-3`, `User-4`, `User-5`）和三本书（`Item-1`,\
