  \ `midodrine` (`Proamatine`) 或氟氯西可酮 (`Florinef`)。 |\n| 谵妄或精神病、幻觉 | 减少或停止多巴胺激动剂、抗胆碱能药物，减少左旋多胺、甘沙丁和司来林；使用`喹西平`\
  \ (`Seroquel`)；考虑小剂量氯唑平 (`Clozaril`)。 |\n| 睡眠障碍 | 针对多巴胺激动剂引起的睡眠发作和白天嗜睡；因运动缓慢导致的夜间醒来；提及睡前服用长效卡比多/左旋多胺\
  \ (`Sinemet`)、多巴胺激动剂、辅助恩坦卡酮 (`Comtan`)。减少或停止夜间使用抗帕金森药物；考虑`氯硝平` (`Klonopin`)、快速眼动睡眠行为障碍。\
  \ |\n| 尿急 | 尽量减少晚间液体摄入；提及`特索定` (`Detrol LA`) 或布舒那地碱 (`Ditropan`)；如有需要，向患者提及泌尿学评估。\
