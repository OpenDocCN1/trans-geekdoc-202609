  \ 物品‘i’的权重。\n\n#### c. 归一化评分\n该方法使用用户的平均评分对权重进行归一化。考虑物品‘书’，为了简单起见，我们只考虑一个特征，比如‘作者’。物品画像可以表示为值为‘1’或‘0’的布尔向量，代表特定作者是否存在。假设用户‘x’从在线商店读了\
