  \n## Note\n\n1. Note *通讯作者*: `psvadivu67@gmail.com`\n\n# 8 一种作物病害检测和产量预测的推荐系统\n\n\
  **Pooja Akulwar**\n\n***计算机科学与工程系***, ***印度马哈拉施拉邦 Kolapur Sanjay Ghodawat 大学***\n\
  \n***摘要***\n\n农业是印度新兴经济的支柱。传统上，农民遵循祖传的耕作模式和规范。然而，不能期望单个农民考虑到所有影响作物生长的无数因素。农民的一个错误或不审慎的决策都可能产生不良的后果。随着各个领域的发展，需要一种智能农业系统来提升印度经济。推荐系统与机器学习的结合将产生智能农业系统，帮助农民群体在农场管理和农产品业务活动中做出决策，例如：i)\
  \ 在播种前预测农产品市场价格，ii) 确定最佳种植品种 iii) 确定最佳耕作日期 iv) 评估供需风险 v) 投资优先级排序。它还可以帮助农民进行作物管理活动，包括产量预测、病害检测、杂草检测、作物质量和生长预测等。\n\
  \n***关键词:*** 农业，机器学习，推荐系统，作物产量预测，病害检测\n\n## 8.1 引言\n\n\n\n\n农业是食品业的根本源头。它是几千年来世界上范围内开展的最古老、最重要的经济活动之一。随着新技术、新设备、耕作技术和驯化技术的出现，农业的发展跨越多年。随着时间的推移，这一领域取得了巨大的进步和增长。该领域不仅见证了巨大的增长，还催生了许多其他取得显著进展的领域。由于农业是人类生存的基本需求，大多数人均参与了这一职业。世界上超过\
  \ 50% 的土地已用于农业。农业部门占印度经济国内生产总值（GDP）的 14%。印度约 70% 的人口住在农村地区，其中大多数人依赖农业作为主要收入来源。农业不仅帮助人们生存，还维持了经济的运行。它在印度的经济发展中发挥着至关重要的作用。印度政府对提高耕种对土壤的认知、提高土壤肥力、灌溉设施、肥料利用、畜肥利用、精准使用以及森林地区的放牧表示关注。因此，随着人口的增加，必须提高生产率。\n\
  \n在印度这样以农业基础的国家，在有限的土地上计划获得最大的作物产量是一项巨大的任务。通过调查与作物相关的问题，可以通过指标帮助提高作物的产量。即使发生不利的条件\
  \ \\[10]，作物选择也将更加准确且有利，并使损失最小。在有利的生长条件下可以获得最大的作物产量。提高作物生产率可以是农气象学家研究的一个重要课题，也是国家经济增长发展的关键。影响作物产量的两个主要因素是：首先是种子质量，可以通过杂交技术进行遗传育种来提高；其次是根据有利和不利条件选择作物。这涉及到两种技术：统计学和机器学习，这两种技术都已建模。许多研究人员已尝试为作物产量预测、土壤分类、作物分类、天气预测\
  \ \\[13]、作物病害预测以及作物分类 \\[5, 6]]建立高效且准确的模型。因此，开发了这种名为作物选择方法（CSM）的新方法，以提高作物季节净产率。\n\
  \n作物生产率取决于该地区的地和地理条件（例如：山区、丘陵地区、河滩、深度地区）、天气状况（例如：湿度、温度、降雨、云） \\[14, 15]、土壤类型（例如：沙土、粘土、泥炭土、盐土、粉质土、壤土）、土壤成分（例如：`PH`\
  \ 值、氮、磷、镁、钙、硫、钾、有机碳、铜、铁）以及收获方法。针对不同作物的不同参数使用了不同的预测模型。其中一些预测模型已通过研究对作物生产进行了深入研究。预测模型分为两种：统计模型和机器学习。本章描述了关于机器学习的整体研究。\n\
  \n\n\n\n### 8.2.3 机器学习方法\n\n有各种机器学习方法，例如提升技术（`boosting`，如 `RGF`、`GBDT` 和 `Ada boost`）、回归树（`ID3`、`C4.5`）、随机森林、`SVM`、K\
  \ 近邻算法和 `ANN` 等。\n\n#### 8.2.3.1 人工神经网络\n\n人工神经网络是脑的一种简单数学模型。它用于并行形式处理输入与输出之间的非线性关系，例如人脑。因此，人工神经网络可以用于各种任务，其中最好的用途之一是分类。我们可以快速地学习人工神经网络。信息通过两种不同的方式在神经网络中流动。首先，当模型处于学习或正常运行运行时，来自数据集的信息通过输入神经元传递给网络，然后触发隐藏神经元层，最后转换为输出神经元。这被称为前馈网络。每个神经元接收其左侧的输入，然后将其与权重相乘。因此，每个神经元会将所有输入相加。如果和大于某个阈值，神经元就会“点火”。每当我们使用大型数据集时，神经网络就会更加强大。\n\
  \n因此，在人工神经网络的基本结构中，我们可以创建 3 层“神经元”——输入层、隐藏层和输出层，如图图 8.2 所示。信息从输入层流向隐藏层，再流向输出层。由于每个连接都关联有一个数字，这个数字被称为连接权重。此外，每个神经元都有一个数字和一个特殊的公式，称为阈值。可以对神经网络进行训练，然后为其提供一组输入和输出。每个神经元转换输入并将其转发到下一层，依此类推。结果在输出层接收。然后，通过特殊算法将该层与输出进行比较，以产生尽可能接近的输出。当这个过程重复多次后，就完成了训练部分。每当向网络提供新输入时，我们就可以获得实际输出。因此，人工神经网络可以用于预测房价以及分类物体和图像。\n\
  \n#### 8.2.3.2 支持向量机\n\n`SVM` 代表支持向量机。它是机器学习中的一种简单算法。它属于机器学习中的监督学习类别，用于用于回归分析和分类分析，但它是一种判别分类器，被广泛用作分类算法。它以较少的计算能力产生很高的准确性。该算法用于创建一条线或超平面，以便将数据分为若干类。它接受数据作为输入并输出一条区分两类的线。它被用于各种应用，如脸检测、电子邮件分类、新闻文章、网页、手写识别。\n\
  \n![图 8.2 简单人工神经网络 [11].](images/c08_image_7_1.jpg)\n\n**图 8.2** 简单人工神经网络 [11]。**\n\
  \n#### 8.2.3.3 K 近邻 (K-NN)\n\nK 近邻是机器学习中的一种监督算法。它非常容易实现。它可以提供非常优秀的分类器。对于分类和预测问题，通常使用\
  \ `KNN`。它也被称为基于样本的学习技术。对于预测目标值，它使用了所有过去的数据。它使用距离函数。这里有多种距离函数，如欧几里得、曼哈顿、马可夫斯基等。它计算新输入值（样本预测器）与所有训练集（样本预测器）之间的距离。选择这些最小距离（`k`\
  \ 个最近距离）。计算所有 `k` 个邻居之和并确定目标值。该算法不需要训练和任何优化方法。该方法用于非线性和自适应问题。`KNN` 的时间和空间复杂度很高，因为在预测目标值时使用了所有数据。`KNN`\
  \ 的时间（空间复杂度非常高。\n\n#### 8.2.3.4 决策树\n\n决策树学习时考虑随机的缩放。数据被划分为子空间。\n\n8.2.3.5 随机森林\n\
  \n基于决策树的集成算法。主要目标是组合这些树并生成输出。这些算法都是相似的，但不同之处在于纯度度量、叶节点值分配和剪枝规则。构建决策树时，使用了各种算法如 `CART`、`M5`、`M5\
  \ Prime` 等。\n\n\n\n\n\n### 梯度提升算法\n\n梯度提升（Gradient boosting）是一种用于回归和分类问题的机器学习技术，它通过弱预测模型（通常是决策树）的集成形式产生预测模型。与其他提升（boosting）方法一样，GBDT\
  \ 也根据某些阶段来构建模型。通过优化微分损失函数来实现泛化。\n\n梯度提升决策树（GBDT）是一种受欢迎的机器学习算法。它有许多有效的实现方式，如 `XGBoost`\
  \ 和 `pGBRT`。由于其高效性、准确性和可解释性，梯度提升决策树是一种被广泛使用的算法。GBDT 在许多机器学习任务中（如多分类分类、点击预测和排序学习）中达到了最先进的性能。如今，GBDT\
  \ 面临着新的挑战，特别是在准确性与效率之间的平衡。因此，传统的 GBDT 实现方法需要对每个特征扫描所有数据实例，并估计所有可能分裂点的信息和增益。因此，它们的计算复杂度与特征数量和实例数量都成正比。对大数据的处理使得实现变得非常耗时。\n\
  \n梯度提升决策树中用到一些技术，如基于梯度的单边采样（GOSS）和互斥特征捆绑（EFB）。GOSS 保留了所有梯度较大的实例，并对梯度较小的实例进行随机采样。为了补偿对数据分布的影响，GOSS\
  \ 在计算信息增益时，对小梯度数据实例引入了一个常数系数。虽然 GBDT 中数据实例没有原生权重，但不同梯度的数据实例在信息增益计算中扮演着不同的角色。互斥特征捆绑（EFB）通常是实际应用，尽管特征很多，但特征空间相当稀疏，这为我们提供了设计一种几乎无损的方法来减少有效特征数量的可能性。由于\
  \ GBDT 是决策树的集成模型，这些树是顺序训练的。在每次迭代中，GBDT 通过拟合负梯度来给出决策树。具体来说，在稀疏特征空间中，许多特征是互斥的，即它们很少同时取非零值，例如文本挖掘中的独热编码。\n\
  \n梯度提升算法使用梯度下降法来优化损失函数。该算法简单且能找到最佳分裂点；然而，在训练速度和内存消耗方面的效率都很低。GBDT 的主要成本是学习决策树。决策树中最耗时的部分是寻找最佳分裂点。\n\
  \n## 8.2.3.7 正则化贪婪森林 (RGF)\n\n正则化贪婪森林（RGF）是一种树集成机器学习方法，它直接作用于底层森林结构。正则化贪婪森林主要整合了两个思想：一个是将树结构正则化包含到学习公式中，另一个思想是使用完全修正的正则化贪婪算法。RGF\
  \ 对现有森林进行更改并获得新森林，这有助于最小化损失函数。它还调整叶节点的权重以最小化损失函数。正则化贪婪森林是一种很好的算法，处于梯度提升算法和随机森林之间。可以使用\
  \ `Python`、`C`、`C++` 等不同语言实现。正则化贪婪森林算法通过完全修正的正则化贪婪搜索来构建决策森林，以强调森林结构。它具有更高的准确性和更快的速度。在\
  \ RGF 中形成的是全局优化的决策树。而在 GBDT 中形成的是局部优化决策树。由于存在树结构，RGF 通过利用完全修正的正则化结构工作。但 GBDT 没有考虑全方法。\n\
  \n## 8.3 推荐系统\n\n### 8.3.1 概述\n\n在互联网和技术世界，数据以极快的速度增长。由于这些海量信息，人们在特定时间寻找正确信息面临着困难。这种情况促成了推荐系统的演进，它为他们提供建议。这些系统被广泛应用于电子商务网站、在线学习、电子政府和电子商务等许多领域。推荐系统需要大量的历史数据，以便根据行为和经验做出推荐。\n\
  \n考虑一个以图像作为输入的推荐系统。图中了推荐系统的通用工作原理。系统将进行图像预处理，包括去除噪声和提取感兴趣区域。预处理之后将是特征提取。提取特征后，应用机器学习算法来预测结果。\n\
  \n![图 8.4 推荐系统的通用概述 [3]。](images/c08_image_11_6.jpg)\n\n\n\n\n\n作物产量取决于作物或植物的状态（健康或不健康）。如果植物患有任何疾病，就会影响作物质量和产量。为了获得良好的作物，疾病检测在农业中起着至关重要的作用。农民面临的问题之一是控制影响作物的病虫害。一旦种子播种，就应该防止病虫害和疾病的侵害[1]。传统上，疾病检测是人工的，既不准确又耗时。农民对疾病的了解有限，无法正确解释疾病信息。呼叫中心可以为农民提供有关疾病的解决方案。由于农民无法提供准确信息，他们的解决方案并不起作用。因此，问题仍然存在。但现在随着技术的进步，自动疾病检测已经轻松实现。这种疾病检测可以根据提供的图像进行。已经开发了各种应用程序来识别和检测疾病，这将减少对收成的负面影响。在疾病检测后，必须提供克服这种疾病的解决方案。因此，推荐系统在这一方面非常重要。推荐系统有助于提供克服这种疾病的最佳解决方案。但这种解决方案是在检测疾病之后。\n\
  \n在这里，推荐系统可以以两种方式工作：\n\n### 1. 疾病检测之前\n在疾病检测之前的 Result 是在疾病发生前采取预防措施。一旦完成图像预处理和特征提取，通过分析或特征差异可以预测作物未来可能受到的疾病类型。如果已知这些信息，就可以提前采取预防措施，使作物不受影响，从而使产量不减少。\n\
  \n### 2. 疾病检测之后\n一旦检测到疾病，必须对其进行适当治疗以提高产量。推荐系统通过提供克服疾病的最佳解决方案提供帮助。该系统根据可用数据分析如症状、疾病类型、医疗治疗等数据，并推荐治愈疾病的最佳可能解决方案。\n\
  \n## 8.4 作物管理\n\n### 8.4.1 产量预测\n农业中最重要的课题是产量预测，因为产量预测有助于提高利润[5]。它包括产量制图和估计、作物供需匹配以及作物管理等活动。所有这些活动都会导致产量的增加。开发了一种低成本且高效的机器学习应用，有助于自动计数树枝上的咖啡果。咖啡果的计算分为三类：可采摘的果实、不可摘的果实以及在成熟阶段被忽略的果实。该系统还计算咖啡果的重量和成熟百分比。该系统旨在帮助希望种植咖啡的工厂主提供最佳经济效益和计划。开发了一种名为机器视觉系统的机器学习应用，它可以在采收过程中自动摇晃并捕捉樱桃。该系统进行分割并检测被遮挡的树枝，即使这些树枝长满了叶子且不清晰。该系统旨在减少收获期间的人工工作和手动操作。\n\
  \n引入的系统之一是产量制图系统，它能识别未成熟的绿色柑橘。该系统旨在提供柑橘园中优质柑橘的信息，从而获得更好的利润和产量。对于柑橘种植者来说这是一个非常有用的系统。基于人工神经网络，开发了一种用于计算草地生物量的新模型。研究还针对产量预测。研究考虑了小麦作物，并利用卫星拍摄了图像。利用图像处理识别了作物的生长特征并融合数据以预测结果。另一个应用被用于通过遥感到的图像检测西红柿。这些图像是使用无人机拍摄的。基于\
  \ `SVM` 开发了新的水稻发育阶段预测模型。处理所需的所有基本信息均从中国的天气预报站获得。该研究侧重于帮助农民克服市场供需失衡的问题。这可能是由于作物质量造成的。开发了一种基于\
  \ `ENN` 应用的通用方法，用于良好的农业产量预测。下表描述了关于各种作物及其功能、算法和结果的研究。表 8.2 描述了各种作物的研究及其功能、算法和结果。\n\
  \n### 8.4.2 疾病检测\n疾病检测在农业领域非常重要。如果作物受疾病影响，将减少产量并导致利润下降。因此，需要在露地和温室内控制病虫害。为了控制病虫害，喷洒农药是最常用的方法。这种方法成本高，且会对环境造成危害。为了避免这种情况，可以使用机器学习应用程序来自动识别疾病并提供解决方案。该系统用于自动检测受真菌影响的植物，并分类感染和非感染植物。另一个使用图像处理技术开发的系统用于检测草莓中的蓟虫。该实验是在温室内进行的。该系统用于检测水稻的纹瘟病。主要目标是检测水稻的病原体。由于这些疾病是自动检测的，节省了肉眼识别的时间。它减少了人工工作。最终提高了高质量的产量。\n\
