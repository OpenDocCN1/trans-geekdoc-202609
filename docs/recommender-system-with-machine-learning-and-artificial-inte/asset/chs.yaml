  \n\n\n\n\n深度学习是机器学习领域的一个子集，其中不同的深度学习模型方法可以用于推荐系统的预测和推荐，例如多层感知器（MLP）、受受限玻尔兹曼机（RBM）、卷积神经网络（CNN）和循环神经网络（RNN）等\
  \ [8, 18, 19, 20–22]。\n\n### 1. 带自编码器的 MLP\n\n`MLP` 基于具有多个隐藏层的前馈神经网络。每层都任意地使用不同的传递函数作为激活函数。自编码器（AE）是一种深度学习模型，即基于反向传播技术，寻找误差函数相对于神经网络权重的梯度。该模型如图\
  \ 6.5 所示。\n\n自编码器通常用于无监督学习中的降维、数据压缩和数据重建。\n\n### 2. 卷积神经网络\n\nCNN 是基于前馈网络的深度学习模型。该神经网络使用不同的卷积层，用于发现输入数据的局部和全局特征。\n\
  \n### 3. 受限玻尔兹曼机\n\n该模型通常在输入的概率分布上运行，由可见层和隐藏层两层组成 [7]。可见层和隐藏层之间没有通信。这种基于 RBM 的深度学习模型使用对比散度方法来提取属性和特征。RBM\
  \ 模型是一种基于能量的模型，使用二值的隐藏单元和可见单元，如图 6.6 所示。权重矩阵 `W` 分别代表隐藏单元与可见单元 `V[i]`、`H[g]` 之间的连接强度。它包含了这些单元的偏置权重。模型的性能主要取决于隐藏单元的数量。\n\
  \n### 4. 对抗网络\n\n对抗网络是一种神经网络，本质上是生成性的，该网络主要包含两个部分：判别器和生成器。\n\n![图 6.5 自编码器神经网络。](img/c06_image_10_1.jpg)\n\
