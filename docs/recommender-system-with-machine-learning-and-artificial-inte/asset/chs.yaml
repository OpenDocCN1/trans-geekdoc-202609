  | 1 | OAS2\\_0048 | 1 | 轻度 AD |\n| 1 | OAS2\\_0007 | 0.5 | 极度 AD |\n| 2 | OAS2\\\
  _0007 | 0.5 | 极度 AD |\n| 2 | OAS2\\_0058 | 0.5 | 极度 AD |\n| 3 | OAS2\\_0048 | 1\
  \ | 轻度 AD |\n| 3 | OAS2\\_0007 | 1 | 轻度 AD |\n| 4 | OAS2\\_0007 | 1 | 轻度 AD |\n\
