  \ Suchal, J. and Navrat, P., 作为可扩展 k 近邻推荐系统的全文本搜索引擎，收于*人工智能理论与实践国际会议 (IFIP AI)*，Brisbane,\
  \ QLD, Australia,页 165–173, 2010.\n\n42. Sanchez-Bocanegra, C., Sanchez-Laguna,\
  \ F., Sevillano, J., 健康推荐引论。*Egypt. J.*, 16, 3, 261–273, 2015.\n\n\n\n基于上下文的推荐系统是目前集成在移动设备中的趋势。它通过有效的方式考虑用户的当前位置，为用户提供及时的需求。基于位置的推荐有三项主要服务，如基于地理标记的媒体的服务、基于点位置的服务以及基于轨迹的服务。在基于地理标记的媒体的服务中，用户发布的照片、标签等社交媒体数据被广泛考虑用以提供推荐。地理标记数据在\
  \ Twitter、Instagram 和 Flickr 数据集中起着重要作用。地理标记数据在旅游、智能交通管理、道路指南、安全与健康监测等领域具有广泛的应用范围。因此，所提工作考虑了上下文属性以及社交媒体提供的服务，以实现更好的推荐。\n\
  \n**关键词：上下文、社交媒体、地理标记、点位置、轨迹、Flickr**\n\n## 12.1 引言\n\n近来，随着智能手机的使用，基于旅行的推荐变得轻而易举。由于可用信息丰富，有必要解决信息不相关的问题。为了解决这一问题，可以使用基于位置的推荐系统。它考虑用户的地理坐标，并根据用户的上下文属性（如空间和时间信息）提供推荐。基于位置的推荐系统（LBRS）提供三项主要服务，如图\
  \ 12.1 所示。\n\n基于地理标记的服务涉及地理标记数据的使用，该数据考虑了用户的空间时间和坐标。这些数据可以从 Twitter 中收集，因为它包含了涉及用户当前位置的帖子和推文。由于社交网络包含了用户的活动历史，可以根据其内容和上下文为相似用户提供推荐。利用来自地理标记数据的用户空间和时间特征的监督学习框架，可以结合\
  \ Foursquare 数据集，用于进一步发现某处地点的类别 [1]。通过 Flickr 和其他上下文数据，还可以提供基于用户偏好的推荐 [2]。\n\n基于点的服务通过克服稀疏性问题，涉及对用户时间特征的使用\
  \ [3]。通过当前的点位置可以预测用户的行为，并通过收集用户所在的区域，考虑感兴趣的地点和区域做出推荐。通过使用 Foursquare 和 Gowalla 数据集，可以获得用户的过去签到和支持信息，以加速基于兴趣点（POI）的推荐\
  \ [4]。考虑用户与兴趣点之间的时间匹配可以提供更好的推荐准确性 [5]。\n\n基于轨迹的服务涉及利用旅行路线和移动历史进行推荐。这种服务可以用于发现连续签到之间的关联，并有助于提供群体推荐。\n\
  \n相似的用户偏好对于做出有效推荐也非常有用。可以通过协同过滤来解决信息过载问题。通过为不同的用户提供实用的提示，节省了用户的时间 [6]。\n\n![图 12.1\
  \ 基于位置的推荐系统 (LBRS)。](img/c12_2.jpg)\n\n**图 12.1** 基于位置的推荐系统 (LBRS) 服务。\n\n相似性计算是推荐系统中一个非常有用的步骤。基于上下文的推荐系统是目前集成在移动设备中的趋势。使用\
  \ `cosine angle` 计算两个向量之间的相似性。余弦相似性决定了 `two vectors` 之间的关系。Jaccard 相似性还考虑了两个用户共享的项目数量，这意味着评分越高，相似性越高\
  \ [12]。这是通过 `k-Nearest Neighbor` (`k-NN`) 实现的。因此，在这一推荐技术的帮助下，旅行变得更加顺 [7]。\n\n所提工作的贡献如下：\n\
  \n*   分析从地理标记数据收集的用户当前位置\n*   通过考虑重要的用户属性进行用户画像\n*   利用协同过滤提供相似的用户偏好\n*   进行相似性计算以提供结果\n\
  *   考虑可能的路线并使用欧式距离向用户推荐最近的地点\n\n因此，这项建议的研究可以开发成为以旅游为中心的推荐系统，考虑从 Twitter 数据中获取的用户当前位置，通过协同过滤识别相似的用户偏好，衡量用户相似性，考虑可能的路线并推荐最近的\
  \ POI。第 2 节阐述了相关工作调查。第 3 节提供了所提工作的动机和目标。第 4 节提供了有关所提工作的细节。第 5 节讨论了实现细节。第 6 节讨论了性能衡量标准。第\
  \ 7 节讨论了评估结果，本文在第 8 节结束并考虑了未来的工作。\n\n## 12.2 文献综述\n\nCai, Lee, Lee [8] 利用语义轨迹挖掘算法考虑其他用户的序列和偏好，提出了一种推荐系统。该系统使用\
  \ Flickr 数据集，有助于基于旅行的推荐。\n\nWang 等人 [4] 提出了一种对用户过去签到和支持信息进行建模的方法以促进 POI 推荐。它使用多项分布\
  \ 技术提供推荐，并使用了 Foursquare 和 Gowalla 数据集。\n\nLiao 等人 [3] 提出的用户感知主题选择 POI 推荐框架，通过挖掘时间来克服数据稀疏性。`Latent\
  \ Dirichlet Allocation` 主题模型和 `Higher Order Singular Value Decomposition` 算法用于实时数据集进行推荐。\n\
  \nZhu 等人 [9] 提出了支持异构上下文信息的 POI 推荐系统。它使用 `Context Graph Attention` (`CGA`) 模型提供推荐。评估在\
  \ Foursquare 和 Gowalla 数据集上进行。\n\n\n\n\n\nSun *et al.* \\[2\\] 试图确定频繁使用用户的概率。利用客户在目标版本中的旅行体验来确定申请人的兴趣点（POI）范围。所提方法通过整合朋友的选择、用户意愿、位置吸引力和社交建议，对用户的个性化需求进行排序。该框架建议以更好的方式解决了冷启动问题。\n\
  \nLogesh, Subramaniyaswamy, Vijayakumar, & Li \\[10\\] 提出了一种基于活动和行为的个性化推荐系统，作为一种混合方法来预测可靠的\
  \ POI 推荐。该系统对于为用户提供 POI 列表作为推荐非常有帮助。\n\nVakeel *et al.* \\[11\\] 提出了一种新方法，利用基于位置的社交网络（LBSNs）收集的签到数据，通过定制化的解释优化\
  \ POI 推荐。所提算法生成用户的动机模型，并通过分析来自常用 LBSN 的数据集来解决其适用性。\n\n## 12.3 动机与目标\n\n本文的主要目标是开发一种有效的推荐系统，以克服推荐系统中存在的各种问题。所提系统使用用户的位置坐标作为指南，以解决提供用户\
  \ POI 时的信息稀疏问题。所提工作还通过考虑地理标记数据提供推荐，这能够对新用户未知的创新项目进行推荐。通过协同过滤识别相似的用户偏好，因此提供了多样化的推荐。通过计算相似性，确保所提供的推荐完全是用户偏好的推荐。基于最近邻域策略，推荐旅行路线上可到达的\
  \ POI 并讨论了其重合性。\n\n### 12.3.1 架构\n\n考虑到用户的当前位置、相似的用户属性、用户兴趣以及旅行路线上的最近共同位置，推荐了所提系统。所提系统的架构如图\
  \ 12.2 所示。\n\n![Figure 12.2 Proposed architecture.](img/c12_image_5_5.jpg)\n\n**Figure\
  \ 12.2** 建议架构。\n\n### 12.3.2 模块\n\n#### 模块 1：获取地理标记数据\n\n为了给客户提供更好的建议，必须知道用户的当前位置。这样做使得能够通过考虑旅行路线上的可用\
  \ POI 来提供建议。从 Twitter 的地理标记信息中收集用户的当前位置。此类数据是使用 `Twitter API` 获取的。最新的地理共定位信息将交由地理标记数据。\n\
  \n#### 模块 2：用户属性画像\n\n在获取地理标记数据后，可以从社交媒体数据中收集位置坐标、性别、情绪等用户属性。在此阶段进行用户属性画像，通过考虑用户数据，可以提供高效的推荐。\n\
  \n#### 模块 3：应用协同过滤\n\n具有相似访问历史的用户被标记并被视为等同。这是通过在不同时间目标用户位置寻找相关用户来实现的。可以从地理标记信息中收集用户的当前位置坐标。使用\
  \ `Collaborative Filtering`（协同过滤）技术制作过滤后的相似用户访问历史。使用这些序列进行预测可以更容易识别 POI，从而通过向用户推荐它们来促进旅游。\n\
  \n#### 模块 4：相似性计算\n\n根据目标用户的当前位置和相似用户的位置进行相似性计算。有许多相似性计算指标，其应用取决于用户属性的特征。在此例的数值属性情况下，可以考虑简单的\
  \ `Manhattan distance`（曼哈顿距离）或 `Euclidean distance`（欧几里得距离）进行计算。\n\n#### 模块 5：邻域选择\n\
  \n计算相似性后，使用 `k-Nearest Neighbor (k-NN)` 算法进行最近邻选择。`kNN` 是一种常用于推荐的机器学习方法。通过考虑其最近邻，`kNN`\
  \ 提供分类。在研究中，通过考虑用户的地理位置使用 `Euclidean equation`（欧几里得方程）确定坐标长度，并使用 `kNN` 分类结果建议最近位置，向用户建议推荐列表。\n\
  \n### 12.3.3 实现细节\n\n使用具有 4 GB RAM 能力的 `i3` 和 `Python` 语言实现了所提系统。`Tweepy` 是一个开源库，允许\
  \ `Python` 与 `Twitter` 交互。`geopy` 库用于收集和显示附近的 POI。`kNN` 用于测量距离。`Euclidean formula`（欧几里得公式）用于计算坐标之间的距离。\n\
  \n## 12.4 性能衡量\n\n在本文中，准确率可以被视为评估系统的指标。系统的准确性通过如 `precision`（精确率）、`recall`（召回率）和\
  \ `F-score` 等指标进行评估，如公式 1、2 和 3 所示。\n\n### 12.5 精确率\n\n它是准确处方的项目占总数的比例。它决定了所有事物中适用部分的比例。\n\
  \n(1)![image](img/c12_Inline_7_11.jpg)\n\n### 12.6 回回率\n\n定义为正确推荐的对象与总使用的之比。它是一个完整性索引，衡量了所有物品中相关项目的比例。\n\
  \n(2)![image](img/c12_Inline_7_12.jpg)\n\n### 12.7 F 数值\n\n它是 `Precision (P)` 和\
  \ `Recall (R)` 的单一指标组合。它是召回率的加权平均值。\n\n(3)![image](img/c12_Inline_8_9.jpg)\n\n##\
  \ 12.8 评估结果\n\n地理标记数据可以从各种社交媒体收集，在这项工作中，我们从 `Twitter` 收集了数据，如下图 12.3 所示。\n\n它被从\
  \ `json` 格式转换为 `csv` 以进行进一步提取，并通过选取地理标记数据中的选定用户属性在此阶段应用用户属性画像。在这项工作中，我们获取用户位置属性，并据此提供推荐，如表\
  \ 12.1\n\n**Figure 12.3** 提取 Twitter 流数据。\n\n![Table 12.1 User profiling.](img/c12_Inline_9_3.jpg)\n\
  \n**Table 12.1** 用户画像。\n\n![Figure 12.4 Recommendation of POI to users.](img/c12_image_11_1.jpg)\n\
  \n\n\n\n\n# 图 12.4 向用户推荐 POI（兴趣点）。\n\n![图 12.5 用户间的相似性计算。](img/c12_image_11_3.jpg)\n\
  \n# 图 12.5 用户间的相似性计算。\n\n在计算相似性后，使用 `k-Nearest Neighbor` (`k-NN`) 算法进行最近邻域选择。`k-NN`\
  \ 是一种机器学习方法，通常用于推荐和位置建议，如下方的 图 12.6 所示。\n\n## 12.9 结论与未来工作\n\n所提的工作讨论了基于位置的推荐系统提供的服务及其在旅游推荐中的应用。它针对地理标记数据、相似的用户偏好、通过协同过滤、相似性计算和邻域选择在旅游路线上的可用\
  \ POI 提供了建议。所提系统已经实现，可以使用 `precision`（精确率）、`recall`（召回率）和 `F-score` 等多种性能指标进行评估。未来的工作将考虑对不同\
  \ POI 的共同物品进行推荐，并增加产品选择，以便从潜在物品中推荐更多物品。\n\n![图 12.6 邻域选择。](img/c12_image_12_1.jpg)\n\
