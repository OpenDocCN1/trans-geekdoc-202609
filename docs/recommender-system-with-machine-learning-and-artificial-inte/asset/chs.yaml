  \ 13.3 用户分布。**\n\n`RMSE` 可以被解释为标准差：它是我们预测电影评分时的典型误差 [8]。如果这个数字大于 1，意味着我们的典型误差大于星。让我们写一个函数计算评分向量及其对应因子的\
