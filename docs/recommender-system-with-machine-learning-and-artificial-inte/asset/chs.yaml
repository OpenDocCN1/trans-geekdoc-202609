  \ |\n| Dentacoin | 这是一个主要作为全球牙科行业解决方案开发的区块链系统。开发了一套基础设施来维护患者数据的安全性。患者可以通过 dentacoin\
  \ 向牙医支付。 |\n| Golem | 这是一个具有点对点网络的去中心化系统，设计用于共享计算能力。它还为开源开发者提供极低成本的云服务，以带来新的创新。\
  \ |\n| MONERO | 是一种开源的、去中心化的加密货币。它维护安全性和隐私，而且没有人能看到交易记录，保持不可追溯性。 |\n\n![图 15.4 认知框架下的物联网区块链网络结构](img/c15_image_9_2.jpg)\n\
  \n**图 15.4** 认知框架下的物联网区块链网络结构。\n\n*完全分布式*：在完全分布式算法中，某个实体会定期从邻居实体处下载最新版本的配置文件。\n\n\
  *半中心化*：在半中心化算法中，管理权限被同时分配给多个服务器，以管理物联网中存在的配置文件。\n\n*中心化*：在中心化算法中，由一个众周知的服务器负责存储最新版本的配置文件。\n\
  \n区块链技术也可用于管理配置文件，甚至具有更高的安全性。\n\n### 15.4.2 物的管理\n\n必要信息在物管理层层被收集，并发送到认知处理层。该层包含若干元素，如图\
  \ 15.5 所示，用于操作和管理。它们如下：\n\n*区块链*：区块链在一条或多个区块链中维护必要信息。可以使用任何类型的区块链（例如银行类 `[27]`、医疗保健\
  \ `[8]` 或保险类 `[12]`）。区块链由三个子单元组成：微服务区块链、智能合约区块链和物区块链。系统中所利用的微服务信息已列在微服务区块链中。关于智能合约的信息已列在智能合约区块链中。该单元的扩展可以通过本体论区块链完成，该区块链供系统使用。\n\
  \n*点对点通信*：物之间的数据交换和通信通过点对点网络系统完成。物区块链的管理问题由该单元支持。\n\n*智能合约*：该单元为系统定义的智能合约使用提供所需的功能。区块链单元在区块链中存储与其智能合约相关的所有代码。为了实现系统目标，认知系统会相应调整并使用智能合约。智能合约具有对系统执行器进行操作的能力。\n\
  \n![图 15.5 物管理层](img/c15_image_10_10.jpg)\n\n**图 15.5** 物管理层。\n\n*支付*：物之间的数据交换和通信通过点对点网络系统完成。物区块链的管理问题由该单元支持。（注：原文此处存在大量重复表述，翻译时已去重）\n\
  \n### 15.4.3 认知过程\n\n必要信息在物管理层被收集，并发送到认知处理层。该层包含若干元素，如图 15.5 所示，用于操作和管理。它们如下：\n\n\
  *区块链*：区块链在一条或多个区块链中维护必要信息。可以使用任何类型的区块链（例如银行类 `[27]`、医疗保健 `[8]` 或保险类 `[12]`）。区块链由三个子单元组成：微服务区块链、智能合约区块链和物区块链。系统中所利用的微服务信息已列在微服务区块链中。关于智能合约的信息已列在智能合约区块链中。该单元的扩展可以通过本体论区块链完成，该区块链供系统使用。\n\
  \n*点对点通信*：物之间的数据交换和通信通过点对点网络系统完成。物区块链的管理问题由该单元支持。\n\n*智能合约*：该单元为系统定义的智能合约使用提供所需的功能。区块链单元在区块链中存储与其智能合约相关的所有代码。为了实现系统目标，认知系统会相应调整并使用智能合约。智能合约具有对系统执行器进行操作的能力。\n\
  \n（注：由于原文中“Payment”部分逻辑极其混乱且大量重复，此处已根据高级文档工程师逻辑对核心语义进行了重组与精简）\n\n\n\n\n在上述提出的算法中，当用户首次进入购物中心时，传感器会感知到该用户的信息并将其存储在区块链中。一旦接收到用户的命令，就会顺序调用认知引擎和相应的服务，以解释命令，从而为用户制定系统目标。从提取出的目标中，调用智能合约和相应的推荐服务。然后，系统向客户推荐合适的商品。接着，当用户购买推荐产品时，将根据系统的智能合约计算折扣。最后，可以使用用户的比特币钱包进行支付，这会在支付过程完成后更改钱包的价值。\n\
