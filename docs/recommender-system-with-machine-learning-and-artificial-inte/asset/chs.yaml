  \ | `Categorical_Cross_entropy` |\n| Last Moment | 0.999 |\n\n`DNN`和`TCA-RS-AD`在`Moderate\
  \ AD`分类上表现优秀，而`DNN`仅在非痴呆和极轻度 AD 上表现优秀。`DNN`和`TCA-RS-AD`在痴呆和非痴呆类的`Recall`和`F1-Score`指标上表现良好。同样，在`Moderate\
  \ AD` 分类中，除`TCA-RS-AD`外，这些分类器的表现均较差或糟糕。在`Mild AD`、`Very Mild AD`、`Moderate AD`和非痴呆的分类中，`TCA-RS-AD`始终优于对手，而`DNN`和`TCA-RS-AD`的表现低于平均水平。从表\
  \ 6 的结果中可以推出`TCA-RS-AD`优于其他。认为`TCA-RS-AD`的卓越性能归功于增强过程，有助于减少过拟合、偏差和方差。非痴呆和极轻度 AD\
  \ 的预测准确率增加了 8%。此外，其总体准确率相比`DNN`的 81.25%提高到了 96.42%。这 15%的性能提升归于数据填充和超参数的微调。这一改进被图\
  \ 18.5 所示的`Support`值所证实。通过不同的 epoch、批量大小和优化器，记录了训练和测试样本的分类准确率。\n\n![表 18.7 性能指标描述](img/c18_Inline_11_3.jpg)\n\
