  \ `groupby()`，从而执行了项目的协同过滤。数据的最终聚合如表 18.4 所示。\n\n## 18.5 神经网络\n\n神经网络（NN）是一种基于生物神经网络及其功能的机器学习算法。神经网络由称为神经元的离散元素组成。图\
  \ 18.3 展示了基本神经网络结构及其元素。\n\n在拆分为训练/测试集后，所提方法使用三种层进行数据训练：密集层、激活层和丢弃层。第一个密集层的输入大小为\
  \ 16，代表独热编码的特征。由于数据集的所有输入都是分类的，使用了独热编码方案将这些输入转换为数值向量类型。DNN 的核心元素在此描述：\n\n表 18.4\
