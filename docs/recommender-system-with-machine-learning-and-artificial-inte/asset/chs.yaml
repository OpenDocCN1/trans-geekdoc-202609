  \ |\n\n\n\n\n\n针对小麦作物的疾病检测已有大量的研究。在所有作物中，小麦被赋予了重要性。因此，为了生产健康的小麦，疾病检测被证明是非常重要且具有意义的。开发了一种新系统，可以对健康小麦以及由于氮锈和黄锈感染的小麦进行分类。使用高光谱反射成像技术来识别疾病。作者描述了该系统能够准确检测疾病，并根据植物的需求提供肥料、农药、杀菌剂等的使用方案。另一项研究描述了区分健康小麦作物和受炭壳孢斑病（STB）感染小麦作物的系统。另一项研究是为了开发一种用于识别黄锈感染小麦和健康小麦的系统。这是通过使用名为\
  \ `SVM classifier` 的机器学习算法结合数据融合技术完成的。类似的研究还使用 `ANN` 模型并考虑光谱反射特征完成。为了准确检测疾病并尽早提供解决方案以获得更好的产量，需要开发此类系统。\n\
  \n小麦主要受黄锈、炭壳孢斑病、真菌等疾病的影响。为了检测受黄锈感染的小麦，开发了一套可以远程处理的作物实时监测系统。该系统使用了 `Neural Network`\
  \ 技术和数据融合技术。数据融合还包括从高光谱反射和多光谱荧光图像获得的数据。该系统还被用于识别特定田间条件下的植物胁迫和营养缺乏。这种植物胁迫是由某些疾病引起的。如果植物受到压力，产量就会减少。最后，设计了一种新系统，利用卷积神经网络（`CNN`）识别并分类植物疾病。植物叶片的图像被作为系统的输入并进行图像处理。在图像预处理后，提取特征并应用\
  \ `CNN` 算法获得所需的输出。输出结果将是植物感染了疾病还是健康。`Table 8.3` 总结了各种作物及其功能。它还描述了研究中使用的机器学习算法以及预测结果。\n\
  \n### 8.4.3 杂草检测\n\n杂草无非是耕种区域内不受欢迎的植物。如果这些杂草大量存在，所需作物的生长就会减少，从而导致生产力下降并导致利润减少。因此，杂草的检测和清除在农业领域已具有日益重要的性。大多数农民将其视为对目标作物生产的主要要威胁。由于杂草非常难以识别和区分，因此需要准确的杂草检测来提高作物的生产力。开发了多种机器学习应用，结合传感器来检测并区分杂草与实际作物。这些应用成本较低。机器学习有助于机器人的开发，从而帮助杂草的检测和清除，这将减少对除草剂的需求。介绍了一种系统，通过获取多光谱图像使用反向传播法（`CP-ANN`）识别名为\
  \ `Silybummarianum` 的杂草。为了识别作物和杂草，开发了基于机器学习技术的新方法。开发了一种主动学习系统来识别杂草和名为玉米的植物。主要目标是自动准确地检测杂草。\n\
