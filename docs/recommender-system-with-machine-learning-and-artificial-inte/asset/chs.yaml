  \ 2/7 = 0.28，特征‘C’的权重计算为 3/7 = 0.43。用户对这 7 本书给出的星级评分如表 10.4 所示。\n\n归归化化评分如表 10.5\
  \ 所示。\n\n### 预测\n\n假设商店引入了一个新产品。为了决定是否向用户‘x’推荐该物品，我们首先构建物品画像。构建物品画像后，获取用户画像和物品画像，余弦相似度最高的物品将被推荐。余弦相似度将使用\
