  \ CRBM 方法的流程图](img/c06_image_14_12.jpg)\n\n**图 6.9** 提议 CRBM 方法的流程图。\n\n### 实验结果与分析\n\
  \n深度学习协同过滤模型框架结合了两项操作的工作。一项操作与内容信息的深度学习有关，另一项与评分的协同过滤（CF）有关。我们使用 MovieLens 数据集来训练模型。基于相邻用户相似兴趣的\
  \ `RBM` 与 `CNN` 模型用于协同过滤推荐。\n\n### 数据集\n\n实验分析使用 MovieLens 数据集进行。该数据集包含 943 名用户对\
  \ 1,682 部电影的 10,000 条评分 [13]。在该集中，`Movie.dat` 文件包含了电影名称及其类型。用户的评分范围在 1 到 5 之间。偏值为最高评分。为了开发模型，数据集的\
  \ 80% 被视为训练集，其余 20% 为测试数据集。\n\n#### 参数\n\n我们需要选择参数 `n`（最近邻居数量）来确定推荐质量。`n` 的值是取决于数据隐私的主要因素。因此，我们应该合理地选择参数\
  \ `n`。在这里我们考虑不同的参数 `MAE`、`precision`、`recall` 和 `F-score` 来衡量电影推荐系统的质量。\n\n### 性能评估\n\
  \n表 6.3 显示了在考虑最近邻居数量的情况下使用不同方法的不同参数值。在表 6.3 中，我们提议的 `CRBM` 方法通过考虑 `precision`、`recall`\
  \ 和 `F-score` 提供了更好的电影推荐系统质量。表 6.4 显示提议的 `CRBM` 方法在考虑 epoch 数的情况下比所有其他方法具有更小的 `MAE`\
  \ 值。\n\n图 6.10 描述了提议的基于 `CRBM` (`RBM-CNN`) 的协同过滤电影推荐系统通过提供更好的系统准确性，在现有方法给出最低的 `MAE`\
  \ 值。\n\n## 6.7 结论与未来工作\n\n基于物品的协同过滤推荐系统在用户空间很大时非常高效。这种方法可以应用于跨领域推荐。因此，这种方法被用于业务获取销售额和收入。在本章中，我们将电影推荐系统中的所有现有方法与\
  \ `RBM` 和 `RBM-CNN` 进行比较，后者提供了更高的准确性。未来，我们将更多地关注可以优化并提供比提议方法更高准确率的算法。\n\n**表 6.3**\
