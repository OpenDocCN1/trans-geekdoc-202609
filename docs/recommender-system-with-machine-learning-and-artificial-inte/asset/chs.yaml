  \ 105–114, 2011.\n\n## Note\n\n1. *1 *通讯作者*:`geetika_12_gupta@yahoo.com`\n\n第 4\
  \ 部分 \n\n基于物联网与区块链的推荐系统\n\n第 15 章 \n\n基于物联网区块链网络的基于型推荐系统，带有认知框架\n\n**S. Porkodi\
  \ 和 D. Kesavaraja***\n\n*Dr. SivanthiAditanar College of Engineering, Tiruchendur,\
  \ Tamilnadu, India*\n\n***摘要***\n\n\n\n\n在这个科技时代，一些主要的创新革命包括区块链、物联网和认知系统。然而，这些技术的结合可以开发出具有高容量和高潜力的新型技术。`IoT`包含了传感器和执行器，它们通过互联网连接，物体可以在其中进行交互和通信。它通过从远程监控和控制的采集原始数据中提取有用信息，从而使设备变得智能。`Blockchain`是一种防篡改的分布式账本，所有区块交易都记录有时间戳。`Blockchain`还是一个去中心化的网络，具有匿名性和完整性等属性，能够为通过`IoT`传输的数据提供安全保障。`Cognitive\
  \ system`通过环境、情况、人以及收集的数据交互进行不断学习。它通过学习和理解人类的思维方式提高自身能力，从而产生为用户生成推荐系统的方法。因此，本文对这些技术的现有组合进行了分析，并提出了一种基于区块链的认知物联网框架。构建了一个推荐系统，其中信任是决策过程的关键。与现有系统相比，所提出的推荐系统具有额外的优势、更安全且潜力更高。\n\
  \n**关键词：** 区块链、认知系统、物联网、基于信任的推荐系统\n\n## 15.1 引言\n\n### 15.1.1 今天与明天\n在当今世界，技术正在发生巨大的变革，这将改变世界的发展路径。数字革命中的技术包括物联网、区块链、认知系统、人工智能等。在未来，还会有更多技术融合或相互支持，从而创造出具有高潜力的新技术。\n\
  \n### 15.1.2 愿景\n该愿景是观察这些技术能为世界带来哪些创新和发展，政府和企业可以采用这些技术进行开发并从中获得更大的利益。许多初创公司可以基于这些技术开发业务以在未来生存。\n\
  \n为了便于理解物联网、`Blockchain`、`Cognitive Systems`，可以将这些技术视为互联的过程。其中，物联网充当神经系统，用于通过全球互联的数百万设备进行感知，收集每一条新数据。`Cognitive\
  \ system`充当大脑的决策系统，它分析数据并做出决策。`Blockchain`充当内存，它是安全并记录每一笔数据交易。这三种技术的详细描述见接下来的章节。\n\
  \n### 15.1.3 物联网\n物联网的基本概念最早于 1982 年左右开始讨论，并在 1999 年左右提出了解决方案 [20]。物联网基本上是全球任何数量设备之间的互连。任何事物如计算机、手机、机械机器、数字设备、物品物体以及生物都可以相互互连，数据和信息可以在互联网上传输，如图\
  \ 15.1 所示。\n\n事物包括从智能灯到卫星控制系统的一切物品，但这些事物由不同类型的执行器（如电机、梳齿驱动器、液油缸等）或传感器（如光传感器、心率传感器、运动传感器、温度传感器等）组成，以收集数据并根据给定条件采取行动。`IoT`设备不仅收集数据，还计算资源并作为通信媒介\
  \ [1, 2, 5, 13, 以及 36]。\n\n![图 15.1 物联网物的示例。](img/c15_image_3_1.jpg)\n\n**图 15.1**\
