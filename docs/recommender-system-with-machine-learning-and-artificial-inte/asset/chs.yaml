  \n## 2-Es of TIS: 旅游信息系统中信息交换与提取综述\n\nMalik M. Saad Missen¹, Mickaël Coustaty²,\
  \ Hina Asmat¹, Amnah Firdous³, Nadeem Akhtar¹, Muhammad Akram⁴ and V. B. Surya Prasath⁵\n\
  \n*¹ 巴基斯坦，巴哈瓦尔普尔伊斯兰大学计算机科学与信息技术系*\n*² 法国，计算机图像与交互实验室 (L3i)，科学与技术学院*\n*³ 伊斯兰堡，COMSATS\
  \ 大学*\n*⁴ 巴基斯坦，虚拟大学*\n*⁵ 美国，辛辛那提大学电气工程与计算机科学系*\n\n### 摘要\n\n旅游业被认为是任何国家的收入来源之一。随着\
  \ Web 2.0 的出现，旅游信息系统（TIS）变得数据密集型。在这项工作中，我们讨论了 TIS 的挑战。\n\n**关键词:** 旅游，信息交换，提取\n\n\
  ### 3.1 引言\n\n旅游业占了 GDP 的很大一部分（[`www.wttc.org`](https://www.wttc.org)）。TIS 被各种利益相关者用于管理数据和提取信息。这些系统适用于从小企业到大型组织的各个级别。例如，在法国，TIS\
  \ 的数量指数级增长。\n\nTIS 被管理员用于监控信息并提供建议。在本章中，我们讨论了 TIS 的挑战并回顾了现有方法。更多细节请读者参考关于旅游推荐系统的综述。\n\
  \n这些管理 TIS 的特定目标和功能随组织而异，但主要目标通常相同，如下：\n\n* 为 TIS 添加相关信息。\n* 从当前数据中提取信息以帮助管理员做出更好的决策。\n\
  * 为与其他 TIS 交换准备数据。\n* 执行信息提取任务。\n\n### 表 1：可用旅游信息系统示例\n\n| 编号 | 标题 | 描述 | 网页引用 |\n\
  | :--- | :--- | :--- | :--- |\n| 1 | AMBISENSE | 该系统的目标是设计并实现上下文敏感且适应于用户的技术 | [www.ambiesense.com](http://www.ambiesense.com)\
  \ |\n| 2 | CAPITALS IT | 该系统的开发目的是为五个欧洲首都是的所有旅游服务提供统一平台 | [www.eu-capitals.net](http://www.eu-capitals.net)\
  \ |\n| 3 | CRUMPET | 针对移动用户，其目标是为所有通过移动访问的用户提供旅游服务 | [www.ist-crumpet.org](http://www.ist-crumpet.org)\
  \ |\n| 4 | DIETORECS | 一种通过智能决策引导用户的推荐系统 | [dietorecs.itc.it](http://dietorecs.itc.it)\
  \ |\n\n\n\n\n\n| **5** | LiveCities | 该系统使用用户的上下文（即位置、个人信息）为其用户提供相关信息。提供的信息可以是纯文本、音频、视频或\
  \ HTML | [8wires.io/opensource/livecities](http://8wires.io/opensource/livecities)\
  \ |\n| **6** | PersonalTour | 旅行社使用，根据客户的偏好为其提供最佳且经济的套餐 | [www.igiglobal.com/chapter/personaltour-multi-agentrecommender/56441](http://www.igiglobal.com/chapter/personaltour-multi-agentrecommender/56441)\
  \ |\n| **7** | VISIT | 对从 Facebook 和 Twitter 收集的信息应用情感分析技术，为其用户推荐“必游之地” | [Scisweb.ulster.ac.uk/kevin/pgnet12-kevin.pdf](http://Scisweb.ulster.ac.uk/kevin/pgnet12-kevin.pdf)\
  \ |\n\n*   提供区域级相关的旅游统计数据。\n*   为用户（旅游管理员）提供易于使用的图形用户界面。\n*   使旅游地管理员能够管理并结合当地相关产业整合可持续旅游业。\n\
  *   通过包含针对当今常态化流性市场环境的适当响应机制，使利益相关者受益。\n*   利用现有的信息基础设施为增强管理结构能力提供坚实基础。\n\n通常，管理类旅游信息系统（TIS）的设计旨在服务两个层面，即国家和区域层面。大多数情况下，管理类\
  \ TIS 包含以下三个主要方面：\n\n*   性能——年度经济指标、飞行记录、旅游系统运行的统计数据等。\n*   产品库存——系统内住宿、运输工具、邮轮、景点的记录。这还包括关于游客目的地的信息。\n\
  *   营销——当前市场趋势、市场信息状态等。\n\n自 20 世纪 90 年代以来，关于 TIS 的开发已有大量研究，关注不同的挑战。然而，随着时间的推移，开发面临的挑战也在演变。在本章中，我们讨论了\
  \ TIS 的两个主要方面，即信息交换和信息提取。我们简单地强调了目前用于这些目的的技术，并讨论了与这些技术相关的挑战，还针对这些 TIS 方面的未来前景提出了相关技术。\n\
  \n我们通过以下重点主题讨论了 TIS 的这些方面：\n\n*   信息交换\n    1.  旅游对象数据的交换。\n    2.  统计数据的交换。\n*\
  \   信息提取\n    1.  情感提取。\n    2.  时间和事件的提取。\n\n我们按照以下方式组织了本章。在第 3.2 节中，我们讨论了 TIS\
  \ 的信息交换方面。在第 3.3 节中，我们详细讨论了信息提取方面，包括观点和时间（以及事件）提取。在第 3.4 节中，我们讨论了情感标注，并在第 3.5 节对本章进行总结。\n\
  \n## 3.2 信息交换\n\n信息交换是 TIS 的一个重要方面。开发中有两种信息交换：\n\n1. 系统之间的信息交换。2. 人类与系统之间的信息交换。\n\
  \n在系统间信息交换的情况下，数据以各种格式（如 XML、JSON、CSV 等）进行交换。然而，在确保系统互操作性方面存在许多挑战。在人类与系统间信息交换的情况下，信息以文本、音频、视频等各种形式呈现。这里的挑战是让信息对人类来说易理解且实用的。\n\
  \n### 3.2.1 旅游对象数据的交换\n\n旅游对象数据的交换是信息交换的关键部分。旅游对象包括酒店、航班、旅游、景点等。关于这些对象的数据可以存储在数据库中，并以各种格式（如\
  \ XML、JSON、CSV 等）在不同系统间交换。交换对象数据的主要挑战之一是确保数据的准确性和实时。例如，航班或酒店的价格经常变化。另一个挑战是确保数据与用户的需求相关。\n\
  \n### 3.2.2 统计数据的交换\n\n统计数据的交换也是信息交换的关键部分。统计数据可以包括经济指标、飞行统计、旅游系统性能等。这些数据通常存储在大型数据库中，并以各种格式（如\
  \ XML、JSON、CSV 等）在不同系统间交换。交换统计数据的主要挑战之一是确保数据的可靠且有效。另一个挑战是让数据易于人类理解和分析。例如，如果用户想知道某个地区的旅游趋势，系统应该为他们提供清晰的可视化结果。\n\
  \n## 3.3 信息提取\n\n信息提取是从非结构化或半结构化数据中提取有用信息的过程。在旅游背景下，这包括从社交媒体帖子、评论等提取情感信息。用于信息提取的技术包括情感分析、时间和事件提取、实体识别等。\n\
  \n在第 3.4 节中，我们讨论了情感标注。\n\n## 3.4 情感标注\n\n情感分析是情感分析的一部分。情感标注是为数据标记标签的过程。例如，评论可以被标记为正面、负面或中性。这些标记数据随后用于训练情感模型。\n\
  \n## 3.5 总结\n\n在本章中，我们讨论了 TIS 的两个主要方面：信息交换和信息提取。我们强调了目前用于这些目的的技术，并讨论了与之相关的挑战。我们还针对这些\
  \ TIS 方面的未来前景提出了一些技术。\n\n\n\n\n\nSchema.org ([www.schema.org](http://www.schema.org))\
  \ 是由 Google、Microsoft、Yahoo 和 Yandex 发起的一项词汇计划。它于 2011 年 6 月宣布，旨在构建和支持一套通用的结构化数据标记规则，这些规则用于识别对象及其之间的关系。Schema.org\
  \ 定义的词汇不仅在网上，在其他信息系统中得到了支持。其不断演变的词汇可用于范围和信息需求不断变化的系统之间的信息交换。它将催生语义网的扩展版本，其目标是将全球网的标准数据格式扩展到其他应用程序和技术。Schema.org\
  \ 的总体目标是为开发者提供单一标准资源，以便实现信息系统之间更有效、更具语义智能化的信息交换。\n\n### 3.2.2.1 Schema.org 扩展机制\n\
  \n许多网络应用程序希望支持使用单一标准词汇（如 schema.org）表示的结构化数据，但考虑到结构化数据的范围和要求，很难想象像 schema.org 这样的词汇能表示所有可用内容。这就是为什么\
  \ schema.org 拥有一个扩展机制（[`schema.org/docs/extension.html`](https://schema.org/docs/extension.html)），即研究人员和开发者可以遵循该流程，以添加新的或改进\
  \ schema.org 中现词汇。如果提议的新增内容获得社区足够的认可，它们就可以成为 schema.org 核心词汇的一部分。\n\n我们认为，schema.org\
  \ 支持网页及其他信息系统，并具有可扩展且领域无关的词汇，是旅游信息系统之间信息交换最合适的选择。在下一个小节中，我们将重点介绍 Schema.org 词汇的一些可以用于旅游信息交换的方面。\n\
  \n### 3.2.2.2 Schema.org 旅游词汇\n\n在讨论上述 Schema.org 非常丰富，可以表示和交换所有领域的信息后，我们讨论其在旅游领域进行信息表示的应用。目前，全球不同地区在使用许多不同的标准用于此目的。例如：\n\
  \n*   在法国，机构性旅游利益相关者采用了 `TourInFrance` (`TIF`)，而旅游运营商和分销商则聚集在 `XFT` (`For Travel\
  \ eXchange`) 中，以创建一种共同语言“定向行程”（directed journey）。\n*   在欧洲，多个国家组成了一个名为 `Harmet`\
  \ 的协会。\n*   在全球范围内，提供者（酒店集团、航空公司等）、生产者和旅游分销商聚集在 `OTA` (`Open Travel Alliance`) 中。\n\
  \n为了简单起见，我们在此仅讨论 `TourInFrance`。法国国家旅游组织 (`NTOs`) 在描述旅游对象时必须遵守 `TourInFrance` (`TIF`)\
  \ 格式。`TIF` 在 2004 年 9 月适配了 `XML`（可扩展标记语言）来描述其各个元素。`TIF` 关注旅游业中的 19 类资源，包括自然资源、酒店、活动、餐厅等，并定义了多种结构来表征这些资源。使用\
  \ `TIF` 对于提供详细的客观描述很有用。然而，通常还需要使用相关数据源（例如术语资源）来优化数据搜索和管理。表 3.2 列出了用于描述不同旅游对象的 `TIF`\
  \ 元素相对应的 Schema.org 等效元素。由于 Schema.org 的可扩展性，在需要的地方进行添加变得更容易。\n\n### 3.2.3 旅游相关统计数据的交换\n\
  \n目前，旅游利益相关者没有使用任何标准格式来交换统计数据。通常，数据使用任何统计软件创建，并传输到其他 TIS（旅游信息系统），假设其他系统支持处理传输的文件。在异构系统的情况下，情况会变得严重。为了避免这个问题，我们建议采用标准的统计数据模型交换\
  \ (`SDMX`) [4]。。\n\n`SDMX` 提供了一个组织和交换数据的框架。它提供了为国际数据交换构建数据形状的指南。`SDMX` ([`ec.europa.eu/eurostat/data/sdmx-data-metadata-exchange`](http://ec.europa.eu/eurostat/data/sdmx-data-metadata-exchange))\
  \ 包含了以下方面：\n\n*   使用逻辑建模描述的统计数据，并附有结构指南。\n*   自动化数据交换的标准。\n\n最后，使用该标准的困难在于其实现。因此，国家层面的旅游利益相关者需要共同努力，识别并共享相同的旅游术语\
  \ `SDMX`（概念、代码列表、定义数据结构）。`SDMX` 的使用将同时影响数据提供者和数据用户。采用 `SDMX` 作为统计数据的标准将使他们 [4]。\n\
  \n**表 3.2** 从 `TIF` 到 Schema.org 的映射示例。\n\n| **TourInFrance** | **Schema.org** |\n\
  | --- | --- |\n| 01\\. Activit sportive | `TourismEntity/Sports` |\n| --- | ---\
  \ |\n| 02\\. Droit du tourisme | `TourismEntity/Tourism Legislation` |\n| 03\\.\
  \ Cologie du tourisme | `TourismEntity/Ecology of Tourism` |\n| 04\\. Conomie du\
  \ tourisme | `TourismEntity/Economy of Tourism` |\n| 05\\. Quipement touristique\
  \ | `TourismEntity/Tourism Facilities` |\n| 06\\. Flux touristique | `TourismEntity/Visitor\
  \ Flows` |\n| 07\\. Formation et employ | `TourismEntity/Training and Employment`\
  \ |\n| 08\\. Hbergement | `TourismEntity/Accommodation` |\n| 09\\. Loisirs | `TourismEntity/Leisure\
  \ Activities` |\n| 10\\. Manifestation touristique | `TourismEntity/Tourism Events`\
  \ |\n| 11\\. Patrimoine touristique | `TourismEntity/Tourism Heritage` |\n| 12\\\
  . Politique du tourisme | `TourismEntity/Tourism Policy` |\n| 13\\. Prestation touristique\
  \ | `TourismEntity/Tourism Services` |\n| 14\\. Professionnel du tourisme | `TourismEntity/Tourism\
  \ Professionals` |\n| 15\\. Promotion touristique | `TourismEntity/Tourism Promotion`\
  \ |\n| 16\\. Science et information | `TourismEntity/Science and Information` |\n\
  | 17\\. Sociologie des loisirs | `TourismEntity/Sociology of Leisure` |\n| 18\\\
  . Tourisme sectorial | `TourismEntity/Tourism Sectors` |\n| 19\\. Transport | `TourismEntity/Transport`\
  \ |\n| 20\\. Pays et groupement de pays | `TourismEntity/Countries and Country Groupings`\
  \ |\n\n*   从问卷导入/导出数据。\n*   跨年份比较响应。\n*   改进元数据提供。\n\n同样，`SDMX` 将对数据用户产生积极影响 [4]。例如：\n\
  \n*   机构间的数据将具有更大的一致性。\n*   元数据将更可用。\n*   数据质量更高。\n*   及时性将提高。\n\n链接—[`www.ecb.europa.eu/stats/services/sdmx/html/tutorial.en.html`](http://www.ecb.europa.eu/stats/services/sdmx/html/tutorial.en.html)对于理解如果想开发基于\
  \ `SDMX` 模型的应用程序，确切需要做什么非常有帮助。\n\n## 3.3 信息提取\n\n\n\n\n\n信息提取（IE）是指在文本中通过检测、预测和识别特定类别实体实例的过程[19]。考虑到这项任务的复杂性，以往文献已经考虑了相关信息提取任务的各个方面，从机器学习到基于不同数据库的信息检索，再到不同文档的分析[38]。简而言之，提取任务主要关注从自然语言文本中识别命名实体及其关系，但随着时间的推移，它根据任务需求和用户需求不断演变。旅游信息系统（TIS）也寻求信息提取的支持来进行智能决策。早期的\
  \ TIS 通常处理结构化数据，因为大部分信息通过人工接口获取。然而，随着在线社交网络的出现，从非结构化数据中提取有用信息是一项艰巨的任务。在线旅游数据包括观点、时间信息和事件信息。对酒店、旅游、博物馆等不同旅游对象或服务的观点通常在评论网站（如\
  \ `TripPlanner` 等）上表达。同样，在不同旅游网站的信息性网站上（如旅游局网站、旅行社、旅游规划者网站等）获取的时间和事件信息在旅游语境中也非常重要。通常，时间信息与事件信息相关，因此我们将对进行进行讨论。在本节中，我们将讨论旅游领域已经完成的一些现有工作。我们还将讨论处理观点和时间/事件信息时面临的某些挑战。\n\
  \n### 3.3.1 观点提取\n\n观点简单来说取决于所属者的主观性，即它展示了其对某事的个人信念。观点有助于个人、社会以及大型企业的决策[27, 49]。这一过程需要既快速又准确，以便根据现有的简洁信息做出决策。在现实世界中，人们通过讨论阐述自己的观点。然而，在线社交网络出现后，这种现象显著增强。在互联网上，人们对产品、新闻文章、政治问题等发表意见。任何人对某事的观点都可以是正面的，也可以是负面的（即观点的极性）[21]。这种在网络上发布观点的现象产生了海量的网络观点数据。许多研究人员致力于从文本中提取观点，这一过程被称为观点挖掘或观点提取。大多数提出的提取方法都围绕着\
  \ Liu 的定义[27]]，因此，我们可以找到提取观点持有者[8, 11]）、观点目标[22, 42]）、情感[10]]和时间[24, 28, 31]的工作。注意，我们可以从数学上将观点定义为表示为\
  \ `(g, s, h, t)` 的四元组，其中 `g`——观点（或情感），`s`——目标，`h`——持有者，`t`——时间。\n\n在全球范围内，使用了了两类方法，即机器学习方法和基于知识的方法。本章的目的不是提供综述，因为已经有此类综述可供参考[21,\
  \ 28, 30, 36, 48]]。然而，我们将重点介绍一些与旅游相关的工作。\n\n大多数观点提取工作属于基于属性的提取（也称为基于特征的提取）。基于属性的观点提取技术将输入文本划分为与所描述主题相关的特征。[46]\
  \ 中提出了一种基于隐含狄利克雷分配（`LDA`）的特征类观点提取方法，类似于 [41] 的先驱工作。这类方法属于无监督主题建模技术类别，类似于 [13] 中提出的方法。使用无监督技术进行观点提取的另一个例子包括\
  \ [18]。\n\n### 3.3.2 观点挖掘\n\n通常，观点挖掘方法的性能随主题或领域的变化而变化，即当我们更改查询和相关数据收集时，特定方法的可能会可能会发生巨大变化。Cruz\
  \ 等人*[9] 计算了观点挖掘中主题或领域的重要性。由于不同主题具有其固有的问题和特征，他们建议建立一个可以在人工干预下跨领域运行的系统。即他们利用了针对每个领域的特定数据收集。\n\
  \n在面向属性的观点提取中证明成功的其他挖掘方法基于概念级的情感分析。此类方法的主要工具是知识库、网络本体或语义网络，允许提取特定概念所需的额外信息[5, 7]。Cambria\
  \ 等人*[6]] 提供了一个概念级情感分析的库。他们的方法为涉及的各种概念提供了额外的语义和情感。这些概念级情感分析也可以包括高层任务。例如，观点摘要、领域自适应以及分析音频、语言和视觉特征的多模态情感分析。\n\
  \n除了这些机器学习方法，基于词典的自然语言处理技术中对观点提取非常有效的方法是情感标注。对于非常有效的观点提取，需要有效且完整的观点标注。在下一节中，我们将讨论现有的观点标注方案并对它们进行比较，指出现有标注的缺点。\n\
  \n\n\n\nWeb 充满了文本、图像、电影和声音等形式的资源，网络搜索引擎擅长在几秒钟为用户检索所有这些资源。虽然我们目前的系统能够很好地提供或检索相关信息，但它们并不能完全理解其所检索信息的语义\
  \ [35]。请注意，仅仅通过检索来获取大量数据对于机器来说是不够的，它们需要随着时间的推移进行学习，因为它们只是习惯于检索这些数据。如果我们想让机器理解它们获取的数据的语义，则需要使用元数据进行增强。元数据标签被用于标记给定数据集合的内容，这被称为对输入进行标注（annotation）。然而，标注的精确性对于获得准确且有效的结果至关重要。因此，标注在开发智能人类语言技术中起着临床性的作用。标注的重要性可以从这一事实中估计：目前存在许多种用于意见提取的标注方案。在接下来的章节中，我们将简要讨论\
  \ `SentiML`、`EmotionML` 和 `OpinionMiningML`，并提供在表示文本文档意见的背景下的对比。\n\n### 3.4.1 SentiML\n\
  \n传统的情感标注样式被用于 `SentiML` 标注 [12]。在这种方案中，我们可以找到针对所表达情感的目标标签（target tags），以及封装提供情感意义的修饰符标签（modifier\
  \ tags）。此外，该方案在词汇表中引入了非常需要的评判类型标签（appraisal type tag）。该标签对目标和修饰符两个标签进行分组，并描述了分组表达式的最终极性。除了基于标签的用法外，`SentiML`\
  \ 方案利用了一种稳健的语言理论来构建其评估框架（AF）。该 AF 有助于在修饰符标记确定各种评估类型，例如判断（judgments）、情感（affect）和欣赏（appreciation）。这是\
  \ `SentiML` 的一个优点。由于 `SentiML` 是一个简单的标注方案，它吸引了该领域的学者毫不犹豫地采用它，因为他们不需要学习领域特定的命令来适应这种标注方案。然而，仍需进一步的工作来解决与\
  \ `SentiML` 风格相关的一些问题。\n\n#### 3.4.1.1 SentiML \n\n在 `SentiML` 的标注示例中，给出了如下句子：\n\
  \n“美国国务院在周二（韩国标准时间）在其年度人权报告中将朝鲜的人权状况评级为‘糟糕’，为平壤与华盛顿之间本已紧张的关系蒙上了阴云。”\n\n相关的标注如下：\n\
  \n列表 1：SentiML 示例。\n\n![](img/c03_image_15_3.jpg)\n\n在上面的示例中，被标注的句子有三个不同的短语，并使用了\
  \ `SentiML` 表示来识别它们。特别要注意，“状况”（situation）、“云”（clouds）和“关系”（relationship）等词被识别出来了。这些代表句子中意见的目标词。此类目标是在短语层面识别的，但在全局层面，意见目标“朝鲜”并没有在任何地方被识别。\n\
  \n### 3.4.2 OpinionMiningML\n\n`OpinionMiningML` [37] 基于 XML 形式，提供了对不同文本段中特征和对象的态度表达进行标记。这种\
  \ `OpinionMiningML` 在全球范围内对应于意见挖掘文献中的基于特征的意见表达模型。然而，这仅仅是一个标注方案的提案。`OpinionMiningML`\
  \ 方案的主要思想是说明来自文本不同片段的特征或侧面，以根据这些特征形成本体。这些特征之间的关系定义使用如 `<SERVED-AT>` 和 `<FEATURE-OF>`\
  \ 等标签给出。此外，定义了元标签，如 `<OBSERVATIONS>`（观察）和 `<APPRIASAL>`（评判），以捕捉关于这些特征的表达。这种特定的分离方法以及对特征间各种关系的捕捉，是该方案的优点。但缺点是，这种方法在捕捉具有不同极性的特征关系时是复杂的，且需要表达性语句（ES）的元信息。此外，`OpinionMiningML`\
  \ 的结构难以辨别，这为自动标注的发展带来了障碍。\n\n#### 3.4.2.1 OpinionMiningML 示例\n\n我们使用 `OpinionMiningML`\
  \ 语法展示相同的示例：\n\n列表 2：OpinionMiningML 示例。\n\n![](img/c03_image_16_5.jpg)\n\n在上面的示例中，我们注意到这种标注方案需要元数据，因此没有定义如\
  \ `<FACET>` 或 `<ONTOFACET>` 之类的标签。\n\n### 3.4.3 EmotionML\n\n`EmotionML` [39] 设计用于阐明来自不同技术背景的情感理论。`EmotionML`\
  \ 利用了这一事实：在科学领域没有单一的情感表示方法，因此情感通过四种类型 `<dimension>`（维度）、`<action tendency>`（行动倾向）、`<category>`（类别）和\
  \ `<appraisal>`（评判）来给出。\n\n`EmotionML` 的三种用例如下 [40]：\n\n1. 情感相关数据的人工标注\n2. 自动识别情感\n\
  3. 情感系统的生成\n\n为了满足上述三个用例，`EmotionML` 采用了插件式语言形式，这取决于不同的上下文场景。根据该主题的 W3C 草案，`EmotionML`\
  \ 需要多个词汇表来定义基于情感的状态。缺乏默认词汇是 `EmotionML` 规范的缺点，因为社区中没有标准的情感词汇集。这意味着，正如 [40] 所述，用户必须自行选择情感词汇。因此，`EmotionML`\
  \ 框架正努力寻求平衡，为情感提供一组精选的推荐词汇，以及用法文档。`EmotionML` 的其他复杂之处在于定义情感之外的状态，例如“情感维度集”。这些是具有不同属性的定性情感，例如强度，以及它们不同的体验，例如负面或正面。\n\
  \n#### 3.4.3.1 EmotionML 示例\n\n我们使用 `EmotionML` 语法展示相同的示例：\n\n列表 3：EmotionML 示例。\n\
  \n![](img/c03_image_18_1.jpg)\n\n## 3.5 不同标注方案的对比\n\n上述标注方案可以从不同的视角进行对比。我们为此处考虑的\
  \ `SentiML`、`OpinionMiningML` 和 `EmotionML` 提供了以下对比视角，并参考 [50] 进行详细分析：\n\n- 范围：基于\
  \ W3C 标准的 `EmotionML` 涵盖了不同领域的各种情感及其方面，而 `OpinionMiningML` 和 `SentiML` 限于自然语言处理（NLP）和信息检索（IR）领域。我们认为，与\
  \ `OpinionMiningML` 相比，`SentiML` 提供了更大的范围，因为 `OpinionMiningML` 仅限于基于特征的情感分析。\n\n\
  \n\n\n## 方案对比\n\n- **复杂度**：在复杂度方面，`EmotionML` 由于其范围较大而高于其他两种方案，因此用户友好性较低。总体而言，`OpinionMiningML`\
  \ 比易用的 `SentiML` 更复杂，后者如上所述使用了带有如 `target`（目标）、`holder`（持有者）等概念的词汇。\n- **词汇**：`OpinionMiningML`\
  \ 和 `SentiML` 绑定了特定的词汇，而 `EmotionML` 可以配备用户提供的更新且更广泛的词汇。`OpinionMiningML` 关注特征和相关的情感，而\
  \ `SentiML` 则使用修饰语和目标。\n- **结构**：`OpinionMiningML` 比其他两种标注具有更细的粒度，并一直应用到特征（feature）级。三种方案都使用\
  \ XML 格式。\n- **语境歧义**：`SentiML` 为困扰意见挖掘的语境歧义提供了解决方案，而这仍然是一个挑战。三种标注都定义了表达方式，例如 `suggestion`（建议）、`appreciation`（赞赏）。\n\
  - **理论依据**：与基于评价的 `SentiML` 或基于 W3C 标准的 `EmotionML` 相比，`OpinionMiningML` 没有理论依据。此外，`EmotionML`\
  \ 在涉及利益相关者的长期讨论过程后已成为 W3C 推荐。`SentiML` 也基于更强大的语言理论，而这在 `OpinionMiningML` 中是缺失的。\n\
  - **粒度级别**：三种方案在粒度级别上的作用有所不同。`OpinionMiningML` 和 `SentiML` 考虑子句（subsent）级，而 `EmotionML`\
  \ 在句子级操作。请注意，尽管寻找情感必须到子句甚至词词级，但句子最终提供了话语的逻辑单元。\n- **名称**：在这三个方案中另一个有趣的对比是它们的名称。所有标注都使用了互换的词来表示意见，例如\
  \ `emotion`（情感）、`opinion`（意见）、`sentiment`（情感）。\n- **灵活性**：在灵活性方面，`EmotionML` 完全允许为考虑的领域选择合适的词汇，以适应该领域的情感状态。虽然\
  \ `SentiML` 没有这种灵活性，但 `OpinionMiningML` 在这方面与 `EmotionML` 相似。`OpinionMiningML` 根据需求，在标注中使用提供了构建基于领域的本体的选择。\n\
  \n从这些对比点来看，显而易见目前的标注方案无法满足当今与意见相关的需求。它们似乎对特定领域具有更好的适应性，但需要一种能够代表所有领域中与意见相关信息的标注方案。需要一种支持语义网技术（如链接数据）并具有处理语境歧义能力的标注标准。这方面的努力可以参考\
  \ `SentiML` 方案的扩展版本 `SentiML++`，参见 [29, 50]。\n\n## 3.6 时间与事件提取\n\n提取时间信息已成为当前推荐系统最迫切的信息需求之一。对于许多新闻检索、新颖性检测、信息聚合等与网络相关的任务，时间提取发挥了作用。早，研究人员没有在若干信息检索（IR）相关任务中利用文档中存在的所有时间信息\
  \ [26]。然而，最近研究小组已开始探索这一信息维度 [2]。通过了解事件之间的时间关系和相关的时间证据，了解文档中文本的时间结构是值得的 [15, 43,\
  \ 44]。\n\n目前，有很多时间证据被用于从文本中提取时间信息。这些证据包括时态、体、时间状语、语用约定、修辞元素的关系以及背景知识。探索文档的这种时间结构是最有趣的时间相关任务之一。例如，多文档摘要中寻找事件顺序是一个非常有趣的任务，时间信息在该任务中起着作用。同样，在问答系统中，有时需要在时间轴上定位事件，或者确定发生在某些事件或日期之前的事件。\n\
  \n与受多种标注方案困扰的情感标注不同，时间标注主要寻求名为 `TimeML` 的通用标准的支持 [33]。尽管它的名称在功能上仅指时间，但它是时间以及事件标注中最广泛使用的标注方案。在接下来的章节中，我们将简要概述\
  \ `TimeML`。\n\n## 3.7 TimeML\n\n`TimeML` 提供了一种表示自然语言中事件和时间的标注方案 [33]。通常，它处理以下问题：\n\
  \n- 识别自然语言中的事件并与其时间关联。\n- 事件的相对顺序。\n- 解决语境歧义。\n- 对事件的持续进行推理。\n\nAQUA 工作研会和项目对 `TimeML`\
  \ 的发展起了重要作用。`TimeBank` 是第一个用 `TimeML` 标注的数据集。随后，在 TANGO 工作研会上开发了一种图形标注工具。原始的 TimeML\
  \ 规范已发展为更近的版本，并被批准为名为 ISO-TimeML 的国际标准。\n\nTimeML 句子：“TERQ 工作坊将于 7 月 15 日周一恢复。会议将于上午\
  \ 9:00 开始。”\n\n列表 4：TimeML 时间标注示例。\n\nTimeML 支持多种语言（英语、意大利语、法语、葡萄牙语、中文、罗马尼亚语……），不同语言之间需要大量的修改。尽管\
  \ TimeML 解决了许多问题，但它仍有一些局限性（即它没有涵盖自然语言处理中时间标注的所有需求），因为它其目的是通过关注事件的时间识别、对应事件的时间戳以及对事件持续性的推理来提高回答系统的性能\
  \ [25]。\n\n`TimeML` 支持的事件类别包括报告、发生、感知、体以及进一步的类别如状态、意图状态、意图动作以及语气。\n\nLefeuvre-Halftermeyer\
  \ 等 [25] 总结了 `TimeML` 的一些主要局限性，并提出了一些以解决这些局限性的修改，列如下：\n\n- 良好识别良好的特征：例如 `TIMEX`\
  \ 时间表达式的时间功能，以及 `TLINK` 时间关系的额外类型。\n- 关涉及深层修改的单元或特征：`EVENT` 单元的时间与时态之间；时间信号（`SIGNAL`\
  \ 单元）与 `TIMEX` 修饰语（`MOD` 特征）之间，需要表示的一致性。\n\n\n\n\n\n*   建议在句法层而非词汇层之上进行更进一步的时间标注，即在树库库（treebank）上进行时间标注。\n\
  \n与时间标注类似，目前 `TimeML` 是唯一的事件标注方案，因此它无法与任何其他标注方案进行比较。然而，`TimeML` 模型可以与 `ACE` 的事件建模进行对比\
  \ [1]。一方面，在 `TimeML` 中，事件是一个指向时间关系网络中节点的词。另一方面，在 `ACE` 中，事件是一个复杂结构的一部分，其论元关系本身也是复杂结构。在\
  \ `ACE` 中，辅助性时间信息（以时间参数的形式存在）仅在显式给出时才记录。相比之下，在 `TimeML` 中，所有事件都经过了标注，因为所有事件共同形成了时间网络。在\
  \ `ACE` 模型中，仅标注了“感兴趣”的事件 [1]，这些事件属于 34 个预定义类别集合。从复杂性角度考虑，`ACE` 事件模型比 `TimeML` 模型更难处理。\n\
  \n## 3.8 结论\n\n在本章中，我们回顾并讨论了旅游信息系统，特别关注了旅游信息系统（TIS）背景下的交换与提取。我们强调了当前的方法、它们的局限性，以及补偿这些局限性的可能的替代方案。我们讨论了\
  \ `XML` 和本地使用数据格式在数据交换方面的局限性。我们已经证明了 `schema.org` 能够证明自己是旅游业数据交换的一种标准。目前，旅游业缺乏标准化，这极程度上损害了其发展，而\
  \ `schema.org` 可以作为其问题的解决方案。同样，我们关注了信息提取中至关重要的维度，并发现当前的意见标注方法无法满足我们的需求。我们还比较了不同的意见标注方案，即\
  \ `SentiML`、`EmotionML` 和 `OpinionMiningML`。我们在本章中的综述工作对于新进入该领域的信息提取驱动推荐领域的研究人员非常重要。此外，此类标注方案需要用于在旅游应用领域构建稳健的推荐系统。\n\
