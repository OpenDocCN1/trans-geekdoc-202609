  \ E | S | H | E | E | S | E |\n| AD 阶段 | VM: 极轻度 AD; M: 轻度 AD; ND: 非痴呆; MAD: 中度\
  \ AD |\n\n\n\n\n| 推荐规模 || 优秀: E; 高: H; 中等: M; 低: L; 差: P; 极少: S |\n\n图 18.8 展示了\
  \ `DNN` 模型和 `TCA-RS-AD` 模型误差评分的总体评分对比。这表明，与 `DNN` 模型相比，`TCA-RS-AD` 的误差评分最高。\n\n\
  从上述结果可以看出，建议所提的 `TCA-RS-AD` 模型在 `AD` 检测中表现得更好。\n\n![图 18.7 DNN 和 TCS-RS-AD 的准确率评分](img/c18_image_19_3.jpg)\n\
  \n图 18.7 DNN 和 TCS-RS-AD 的准确率评分。\n\n![图 18.8 DNN 和 TCA-RS-Ad 模型误差评分对比](img/c18_image_19_5.jpg)\n\
  \n图 18.8 DNN 和 TCA-RS-Ad 模型误差评分对比。\n\n## 18.6 结论\n\n用于阿尔茨海默症分类的基于时间分析分析推荐系统 (`TCA-RS-AD`)\
  \ 基于深度学习原理工作。这种智能模型在阿尔茨海默症的分类中展示了其潜力，并根据分类准确率提供了 6 分制量上的建议。结果证明，该系统在基于时间序列的 `AD`\
  \ 早期预测中表现异常出色。该模型的结果可以作为临床试验中 `AD` 检测的辅助工具。该模型的设计计算量小，因此可以毫不费力地部署在边缘设备上。\n\n## 参考文献\n\
