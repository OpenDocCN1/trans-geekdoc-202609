  \ \\[20\\]。\n\n### 2.2.2 协同过滤\n\n推荐系统更频繁地使用这种技术通过收集用户体验来建立社交过滤。它可以以非常灵敏的方式分析用户或物品之间的相似性模式。\n\
  \n协同过滤的第一种方法是物品到物品的方法，我们专注于邻域分析，如图 2.2 所示。假设 `user-1` 对某个产品的意见与 `user-2` 相同，那么这两个用户的情绪行为内容就适合建立协同过滤。\n\
  \n另一种方法是分类过滤。这是一种学习方法，用于在更协作地对产品的行为属性进行分类后，确定产品将处于哪一类。广义上，协同过滤分为基于内存的（计算邻域）和基于模型的（使用不同的数据挖掘技术：贝叶斯网络、聚类、语义分析）。\n\
  \n![图 2.2 协同过滤。](img/c02_image_6_9.jpg)\n\n图 2.2 协同过滤。\n\n### 2.2.3 混合过滤\n\n大量的在线用户信任推荐系统。它为特定的用户组提供关于为什么推荐某个物品的解释。这种技术依赖于模型的准确性。因此，在实施之前，作者建议研究该模型的理论方面，并在现实环境中实例化其有效性。如今，推荐系统极大影响了人们的生活。因此，用户对推荐系统的需求必须确保其解释能力、一致性和多样性。混合过滤利用了内容和协作数据的优点。这种方法有潜力处理内容和协作数据，并结合两者的努力产生一个系统。它使用准确性度量技术进行更以用户为中心的评估。\n\
  \n### 2.3 相关工作\n\n过去关于各个研究领域的许多研究收集了解释对推荐系统性能的影响和作用。推荐系统的透明度、信任度、有效性和满意度是由解释特征控制的\
  \ \\[14\\]。\n\n协同过滤技术解释了推荐环境的各个方面。它进一步评估了多种解释属性，如满意度、效率、产品评论、特定医生的患者康复率、用户对药物的评论以及产生的正面或负面反馈，这可以完全补偿推荐系统的解释风格\
  \ \\[12\\]。\n\n\n\n\n\n在本节中，我们向用户解释了一种在实时场景下针对医生和药物解释模型的理论原型框架。推荐系统的分配及其对社交平台的影响极大地影响了其他用户的决策行为。例如，App\
  \ 评论、消费者关怀评论、电影评论可以在用户访问小组内同伴成员的评价状态后改变其行为模式。推荐系统中的解释可以被视为一种信息，服务于多种目标，例如商业产品交易中的解释需求，以及在意识到患者需求后提供的药物推荐。解释能够提高推荐系统的性能。人们还注意到，带有解释的推荐系统增强了用户的接受率。解释可以跨越多个学科，如智能系统、聊天机器人、人机交互。本章的主要目标是概述推荐系统中的解释领域。解释在推荐系统中的作用将作为一种针对终端用户的有效且可靠的远程解决方案而得到证明。在本节中，我们介绍了用于推荐系统预测的各种不同的解释技术。大多数技术都使用机器学习来模拟用户行为。如今，人们在选择产品或服务时，对在线可用信息有了更多关注。他们大多数是基于解释性排名系统来选择物品。推荐系统的逻辑已经在第一节中讨论过。此外，对于公民寻求使用的任何服务，这种排名标准是一种新颖的应用机器学习技术，能够为服务寻求者提供带有解释的合适推荐。它是一种增强数字媒体上任何产品服务覆盖范围和质量的具体机制。在这里，我们贡献了一个用于健康保健领域的基于解释的推荐系统理论框架，以便于理解推荐系统的解释。此外，推荐系统中的解释程序开启了一个新通道，即创新的信息通信技术（ICT）形式，以满足人们的需求并涵盖大量的实时部署。值得注意的是，在印度等发展中国家，手机在偏远地理区域的渗透解决了推荐系统服务无法访问的问题\
  \ [7, 16]。\n\n## 2.4 解释的类型\n\n推荐系统的基础探索仍处于初期阶段。为此，它需要下文描述的统一本质理论来进行分类。\n\n1. **功能性解释**：这种解释涉及对系统的功能和行为进行研究。\n\
  2. **因果解释**：这类解释涉及事件追踪以及建立它们之间的因果关系。\n3. **意图解释**：涉及人类行为分析的认知研究。\n4. **科学解释**：用于在科学领域进行推测分析。\n\
  \n根据购买物品对用户进行分类的解释分为以下讨论的三个类型：\n\n1. **基于物品的 (Item-based)**：物品是分类的主要焦点，根据用户可能购买的物品来对用户进行分类。\n\
  2. **基于用户的 (User-based)**：基于用户行为，解释控制推荐系统的事件。\n3. **基于特征的 (Feature-based)**：产品对用户的影响是该领域解释的主要衡量标准。\n\
  \n运行推荐系统的解释分类如下：\n\n1. **用户触发的解释**：当用户对任何特定产品寻求请求或回馈响应时，这种解释具有解决该请求场景的潜力。\n2. **自发性解释**：用户对其没有控制。它根据时间需求与事件进展建立类比。\n\
  3. **基于知识的解释**：这是一种为快速学习提供假设性解释的方法 [9, 13, 33]。\n\n## 2.5 解释方法\n\n一些著名的算法影响了推荐系统的风格。这些算法提供隐性解释方法，以触发模块中解释的执行。解释风格与建议的一个方面相结合，对用户的选择产生深远影响。解释方法的主要目标见于图\
  \ 2.3](#c02.xhtml#figure3)。在本节中，我们概述了各种解释风格。\n\n![图 2.3 解释的分类](img/c02_image_10_1.jpg)\n\
  \n图 2.3 解释的分类。\n\n### 2.5.1 基于协作 (Collaborative-Based)\n\n协作算法的洞察力努力代表帮助互联网访问者选择产品的行为。它以用户对任何物品的评分的形式向推荐系统提供输入。因此，该算法搜索对任何特定产品具有相同评分的用户。最近邻域技术解释了该算法的行为。在这里，一组相似的用户被视为邻居。大多数商业网站使用这种方法来增加其产品在互联网上的销售。例如，当客户访问手表区域时，会向用户推荐手表的可能配件列表。此外，它还会推荐用户最近查看过的物品\
  \ [21, 33]。\n\n### 2.5.2 基于内容 (Content-Based)\n\n这种解释风格在向用户提供推荐之前结合了质量和内容维度。它概念化了物品之间的相似性。关键词风格解释（KSE）和标签风格解释（TSE）包含在此类型中。通常，它根据标签的性质引导用户对任何产品的偏好产生情感倾向。在这里，标签是选择任何物品的驱动因素。基于内容的技术依赖于数据，即用户通过显式（通过评分）或隐式（通过导航到任何链接）提供数据。它基于用户配置中数据排序的相关性。根据上述方法，生成了用户配置，然后将其用于向用户提供建议。在这里我们遇到了两个术语：物品（item）和属性（attribute）。物品指的是在推荐系统中使用其属性的内容，例如电影、书籍等。属性被定义为物品的属性，例如著名的电影标签、任何产品的吸引人的口号。在这里，Tfidf\
  \ 用于为数据科学中的学习目的生成数据配置。Tfidf 在第一节中通过示例解释 [22, 28, 37]。\n\n### 2.5.3 基于知识和效用 (Knowledge\
  \ and Utility-Based)\n\n该算法非常适用于特定类型的推荐系统，该系统依赖于物品组合和用户偏好的显性知识。知识获取在该算法中起着至关重要的作用。它在协作和过滤无法提供合适解释的情况下产生。该算法的主要优势在于，它可以在复杂领域高效工作，例如用于购买房地产、汽车、旅游目的地或任何奢侈贵品。尽管评分和评论在上述两种算法中提供了效率，但它们无法满足上述两种产品的标准。为了阐述用户体验，该算法提出了一种强有类比来增加用户的信任。\n\
  \n\n\n\n\n它创建了一个知识领域来分析用户响应。它通过一些巧妙的问题捕捉用户的体验，并建立强有力的类比以增强用户的信任。它创建了一个知识领域来收集用户交互体验，并通过对话平台捕捉用户数据。知识库中用户论证的变体数据集根据之前的成功学习（如图\
  \ 2.4 所示）为用户挖掘特定产品。根据匹配数据，对该算法进行了排序 `[15, 23, 26]`。\n\n约束满足图用于排序用户偏好并生成一个 `DAG`（有向无环图）以组成一条用户论证链。\n\
  \n### 2.5.4 基于案例的（Case-Based）\n\n它在由许多查询和响应组成的案例分析中，采用了主动的说服技术。在这里，案例表示一组用户的相似项目集。它被用于提供基于产品高分的推荐，这是一种影响力的推荐风格。它在领域无关的方法中计算相似性。它是基于内容的推荐的一种形式，非常适用于许多推荐引擎。这种方法对产品相似性进行了明智的解释以提高质量。它遵循基于案例的推理（`CBR`），其中当有任何新案例出现需要分析时，大量的案例（以前解决过的案例和解决方案）起起着主要作用。大多数情况下，这种方法使用了一种学习技术，即使用一个具有声誉最高的用户响应或评分的解决方案的相似案例来解决新生的案例。`CBR`\
  \ 是一种基于问题规范和检索的多步推理策略。它将用户查询或响应视为问题规范，并检索针对相似案例集获得最高分数的知识。基于案例的技术采用最佳匹配估计来解释 `[33]`。\n\
  \n![图 2.4 基于知识的解释中的信息获取](img/c02_image_12_1.jpg)\n\n图 2.4 基于知识的解释中的信息获取。\n\n###\
  \ 2.5.5 基于人口统计学的（Demographic-Based）\n\n该算法根据属性的选择对用户进行分类，并进一步建立了基于人口统计学类别的推荐。年龄、性别、区域被称为人口统计信息。例如，如果某个网站显示你年龄段的\
  \ 70% 的人都在使用该产品并从中受益。许多商业网站和行业已经采用了这种策略，因为它们并不复杂，实施起来也很简单。在基于人口统计学的推荐系统中，需要进行适当的市场研究以及考虑指定地区公民的文化价值，并配以简短的调查报告以积累用于分类的数据。尽管人口统计学技术使用不同的数据，但它形成了类似于协同过滤那样的“人与人”之间的关联。与协同和基于内容的推荐系统相比，人口统计学方法不需要用户评分历史，这使其更具优势。这种方法在解释\
  \ `[28]` 之前侧重于人口统计学上下文信息。\n\n### 2.6 提出的基于解释的推荐系统理论框架\n\n如今，基于解释的系统正逐渐被用户接受。 第 3.1\
  \ 节 中给出了流程图。在图 2.4 中，我们已经解释了工作原理。在本章中，该框架代表了决策推荐的人机交互（`HCI`）。解释能力和有效性是个化推荐的两个维度。因此，所提出的框架将为解释性提供一个吸引人的维度，如图\
  \ 2.5 所示。在这里，机器学习算法在该之下运行并向用户提供个性化信息。\n\n### 2.7 流程图\n\n#### 步骤 1\n这是一个在互联网上启用的终端。在这里，患者、药剂和医生可以注册并访问界面。\n\
  \n![图 2.5 基于解释的推荐系统](img/c02_image_14_1.jpg)\n\n图 2.5 医疗健康的基于解释的推荐系统。\n\n#### 步骤\
  \ 2\n注册成功后，个人可以访问健康界面并提交详细信息。如果医院或医院网络遵循这种基于解释的推荐系统的数据获取模式，将为每个人生成一个 `unique-id`。\n\
  \n#### 步骤 3\n每个人的详细信息都存储在数据存储中。它是各种数据的组合。决策逻辑（分类、模糊 IF-THEN 规则、决策树）将为用户选择医生或远程用药提供解释。决策哲学是人工智能领域的一个认知过程。它是一个独立的应用程序模块，即疾病分类，来源于用户输入（症状列表、X\
  \ 光片、病理报告等）。决策树逻辑在分析症状后为患者分配医生。患者从医生的最大恢复率由下面提到的排名函数模型保真率决定：\n\n```\n模型保真率 = |可解释项目\
  \ ∩ 推荐项目|/|推荐项目|\n```\n\n它控制模型中解释的质量。这是一个未来的模型，控制了医疗保健领域的自主权，中间人无法过度影响任何公民。\n\n\
  ### 2.8 结论\n\n\n\n\n\n存在多个视角可以探索基于解释的推荐系统，这些系统通过主动或被动的方式适用于不同的应用场景。推荐系统的新兴研究环境需要解释来增强系统的可信度。因此，在这方面，我们对医疗保健领域基于解释的推荐系统进行了简要概述。这是一个基于亭台的理论框架，可以为用户查询提供显著的解释。解释在推荐系统中发挥着重要作用。推荐系统缺乏可解释性会降低用户的说服力，相反，它是通过带证据的信息检索的支持手段。最近，深度神经网络已用于许多解释场景。许多推荐系统背后的复杂性应该被进一步强调。在本次综述中，我们对医疗保健领域可解释推荐模型的未来提供了展望。一个推荐模型不仅要通过提供高质量的推荐来保持有效，还要提供定性的解释。\n\
