  \n## Note\n1. 通讯作者: geetika_12_gupta@yahoo.com\n\n# 基于时间变化分析的阿尔茨海默症分类推荐系统\n\n**S.\
  \ Naganandhini, P. Shanmugavadivu[]#c18.xhtml#c18-notes-0001) and M. Mary Shanthi\
  \ Rani**\n\n*计算机科学与应用系，甘地格拉农村学院（认定大学），甘地格拉，泰米尔纳德邦，印度*\n\n### 摘要\n推荐系统因其在客户关系管理中提供产品或服务的个性化推荐方面具有相关性和应用价值，发展呈现出良好势头。它已扩展到医学及其相关领域，用于疾病预测/检测、药物、治疗及其他医疗服务的推荐。本章描述了一种基于深度学习模型的新型综合推荐系统，命名为基于时间变化分析的阿尔茨海默症分类推荐系统（`TCA-RS-AD`）。该系统的性能在包含\
  \ OASIS T1 加权 MRI 临床时间数据集上进行了评估，结果记录了 `Precision`（精确率）、`Recall`（召回率）、`F1-Score`、`Accuracy`（准确率）、`Hamming\
  \ Loss`（汉明损失）、Cohen’s Kappa 系数以及 Matthews 相关系数。该推荐模型准确率的提升证明其在 AD 分类应用中的适用性。\n\n\
  关键词：深度学习模型、混淆矩阵、马修斯相关系数、汉明损失、Cohen’s Kappa、OASIS 数据集\n\n## 18.1 引言\n半自动化脑图像分析旨在根据脑障碍发现或诊断阿尔茨海默病。AD\
  \ 的预后对于在早期为患者提供及时治疗至关重要。磁共振成像（`MRI`）临床数据是一个综合数据集，包含了大脑灰质和白质的高分辨率、高对比图像。机器学习（`ML`）分类技术的新颖性在许多医学诊断中得到了广泛探索\
  \ [1]。机器学习方法的预测能力适用于许多临床应用。这些方法应用于神经影像研究中，用于 AD 的早期检测和诊断。深度学习是机器学习的一个派生。深度神经网络（`DNN`）是一种具有超过两层结构的神经网络。`TCA-RS-AD`\
  \ 设计为具有多个隐藏层。\n\n创建推荐框架的最常用方法是基于内容和协同过滤。基于内容的方法需要大量关于对象功能的信息，而不是使用用户的经验和建议。协同过滤是利用他人意见对项目进行过滤或评估的过程。\n\
  \n本章介绍了一种新的预测和推荐方案，称为“基于时间变化分析的阿尔茨海默症分类推荐系统（`TCA-RS-AD`）”。该系统使用 `MRI` 临床数据进行实验。所提出的模型旨在分类和预测\
  \ AD。\n\n## 18.2 相关工作\nZhe Wang 等 [2] 开发了一种名为静态 fMRI（`RS-fMRI`）的方法。\n\nNaganandhini\
  \ 等 [3] 开发了一种名为静态 fMRI 分析的新方法。\n\nSajna 等 [4] 设计了一种双阶段卷积神经网络（`CNN`）。\n\nLebedev\
  \ 等 [5] 开发了一种计算机辅助诊断（`CAD`）。\n\nJyoti Islam 等 [6] 使用集成神经网络来检测 AD。\n\nXia-an Bi 等\
  \ [7] 从阿尔茨海默病影像计划（`ADNI`）获取数据。\n\nAbnaya Kumar 等 [8] 开发了一种基于深度学习的推荐系统。\n\nRaid Lafta\
  \ 等 [9] 开发了一种基于短期预测的智能推荐系统。\n\nSivapalan 等 [10] 设计了一种用于分类、回归和时间序列分析的新推荐系统。\n\n##\
  \ 18.3 TCA-RS-AD 机制\n`TCA-RS-AD` 方法涉及三个阶段：预处理、预测和推荐。在预处理阶段，读取临床数据并进行数据填充、转换和分组。在预测阶段，通过调整超参数训练训练数据集以预测\
  \ AD 的不同阶段。在推荐阶段，根据准确率评分标准进行推荐。\n\n## 18.4 实验数据集\n`TCA-RS-AD` 算法在包含正常和 AD 阶段的磁共振成像（`MRI`）数据集上进行测试，来自\
  \ OASIS 纵向神经影像 [11]。关键属性包括：`Sex`、`Hand`、`Educ`、`SES`、`CDR`、`eTIV`、`nWBV`、`Group`、`Visit`、`MR\
  \ Delay`。模型在包含 448 条数据的 OASIS 数据集上进行了实验，其中 112 条为轻度 AD，112 条为中度 AD，112 条非痴呆，112\
  \ 条为极轻度 AD。\n\n[表 18.1] 显示了临床数据中的人口统计学特征，[表 18.2] 描述了数据集的临床信息。\n\n\n\n\n\nTCA-RS-AD\
  \ 使用数据插补、独热编码和归一化来准备训练的数据集。独热编码是最广泛且最常用的方法，除非分类变量的数量非常大，否则它的效果非常好。这种编码创建了新的（二进制）列，用于指示原始数据中每个可能值的存在。最常用的编码系统是独热编码，它将分类变量的每个水平与指定的参考点进行比较。使用\
  \ 0 和 1 二分值的编码适用于性别和用手的编码，如图 18.1 所示。\n\n表 18.1 人口学特征。\n\n| 描述符 | 说明 | 数据类型 |\n\
