  \n# Netflix 挑战\n\n**Vasu Goel**\n*计算机科学与工程，SRM 大学，Delhi-NCR*\n\n***摘要***\n\n本分析基于\
  \ Netflix 向数据科学提出的挑战。\n\n***关键词：*** 电影效应、用户效应、均方根误差 (RMSE)、朴素方法、预测评分、正则化\n\n## 13.1\
  \ 引言\n\nNetflix 评分方案范围从 0 到 5。创建上述两个集合的数据集使用以下链接：[`files.grouplens.org/datasets/movielens/ml-10m.zip`](http://files.grouplens.org/datasets/movielens/ml-10m.zip)。推荐系统使用用户给出的评分来做出特定推荐。像亚马逊这样向许多客户销售许多产品并允许这些客户对其产品评分的公司能够收集海量数据集，用于预测特定用户将给出什么评分。Netflix\
  \ 使用推荐系统预测用户将为特定电影打多少星。将预测分数为高分的物品推荐给该用户。尽管预测评分看起来很容易，但电影评分中存在许多偏差。许多用户偏好不同的类型，有些人只给喜欢的电影评分，而另一些人则相反。此外，许多电影通常获得好评。这些偏差可以通过各种机器学习模型考虑。Netflix\
  \ 使用典型的误差损失：他们根据测试集上的残差误差决定胜者。为了提供满意的结果，本分析训练了许多不同的模型（使用 R 语言执行），并根据验证集上的 RMSE 选择了最佳模型。\n\
  \n## 13.2 预处理\n\n### a) 获取和清洗数据\n\n任何数据分析项目的第一步都是获取数据。\n\n\n\n\n\n使用以下代码生成数据集。该算法使用训练集开发的。为了对算法进行最终测试，我们像对待未知数据一样对\
  \ `validation` 集中的电影评分进行预测。\n\n![image](img/c13_image_3_1a.jpg)\n\n## 13.3 MovieLens\
  \ 数据\n\nMovieLens 数据集最初包含 1000 万条评分（行）和 6 个变量（列），被划分为 `train` 和 `validation` 集，分别包含约\
  \ 900 万和 100 万条评分。\n\n我们可以看到这些集合是整洁格式（tidy format）：\n\n![image](img/c13_image_4_2.jpg)\n\
  \n![image](img/c13_image_5_1.jpg)\n\n## 13.4 数据探索\n\n每行代表一个用户对某部电影的评分。我们可以看到 `train`集中提供评分的唯一用户数量，以及被评分的唯一电影数量：\n\
  \n![image](img/c13_image_5_4.jpg)\n\n如果我们将这两个数字相乘，得到一个远大于 1000 万的数字，这意味着并不是所有用户都评价了所有电影。因此，我们可以将此数据视为稀疏矩阵，行表示用户\
  \ `u`，列表示电影 `i`。\n\n你可以将推荐系统的任务视为填充这些缺失值。为了查看矩阵有多稀疏，图 13.1 显示了一个针对 100 部电影和 100\
  \ 个用户随机样本的矩阵，其中黄色表示我们拥有该用户/电影组合的评分。\n\n![image](img/c13_image_5_7.jpg)\n\n![图 13.1\
  \ 随机采样的 100 部电影和 100 个用户的矩阵。](img/c13_image_6_1.jpg)\n\n**图 13.1 随机采样的 100 部电影和\
  \ 100 个用户的矩阵。**\n\n请注意，如果我们正在预测用户 `u` 对电影 `i` 的评分，原则上，所有与电影 `i` 相关且来自用户 `u` 的其他评分都可以作为预测因子，但不同的用户评价不同的电影，且评价的数量也不同。此外，我们可能可以使用来自被确定与电影\
  \ `i` 相似的其他电影的信息，或者被确定与用户 `u` 相似的用户的信息。本质上，整个矩阵都可以作为每个单元的预测因子 [1]]。\n\n## 13.5 分布\n\
