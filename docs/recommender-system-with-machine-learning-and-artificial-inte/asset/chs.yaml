  \n### B. 基于模型的协同过滤\n\n它根据以前用户的评分来开发一种基于不同机器学习算法的模型 [3–5, 7, 27]。\n\n## 6.4 推荐系统中的机器学习方法\n\
  \n机器学习和深度学习技术在推荐系统中起着主要作用，有助于预测和推荐。隐私保护是推荐系统中的主要因素 [8]。\n\n### A. 矩阵分解为了解决推荐系统中的稀疏性问题，我们使用矩阵分解、奇异值分解等具有隐私保护的机器学习方法来实现这一目标\
  \ [2, 11, 16, 17, 29]。这种方法通过潜在因子来隐藏数据，以保护隐私。物品由向量 $q[i]$ 标识，而用户由向量 $p[u]$ 标识。点积\
