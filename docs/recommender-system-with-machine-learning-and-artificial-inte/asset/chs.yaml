  \ Agric.*, 117, 214–225, 2015.\n\n\n\n\n随着互联网用户数量的增加产生的巨大数字信息带来了信息过载的挑战。网络信息本质上是异构的，并以动态的方式日益增长。对于用户来说，从网络上及时检索到准确的信息变得具有挑战性、枯燥且耗时。在这种情况下，用户需要从对该物品了解的朋友或专家那里获得建议。这增加了对推荐系统的需求。推荐系统的目的是帮助用户找到相关项目。客户提供的偏好被作为推荐系统算法的输入，并生成推荐列表作为输出。这些系统根据用户的历史行为进行预测，并利用各种方法解决信息过载问题。最常用的技术是协同过滤推荐系统和基于内容的推荐系统，它们也被称为协同过滤和基于内容的过滤。协同过滤只需要相同用户的历史偏好信息。这种方法识别出偏好与当前用户相同的用户并推荐项目。当有足够的评分信息时，协同过滤效果良好。但在信息不足的情况下，该系统会受到稀疏性问题的影响。为了解决这个问题，基于内容的方法出现了，它需要关于物品的完整信息，而不是用户的偏好。它们根据用户过去喜欢的物品进行推荐。研究人员还将这两种方法结合成一种，称为信息过滤的混合方法。在本章中，将研究基于内容的推荐系统。\n\
  \n在下一节中，将讨论该领域的背景工作以及他们在技术、过程、算法以及该系统在各个领域适用性方面的现有工作。基于内容的推荐系统的语义感知架构以及推荐过程将在第 9.3\
  \ 节中描述。用户画像同同和物品表示的技术将在第 9.4 节中介绍。推荐系统在医疗保健和农业领域的应用将在第 9.5 节中讨论。这些系统的各种局限性和优点将在第\
  \ 9.6 节中描述。第 9.7 节总结了本章。\n\n## 9.2 文献综述\n\n基于内容的推荐系统的核心思想由 [1] 于 1962 年提出。该信息通过将新信息项与存储在用户配置文件中的用户之前的兴趣相匹配来分发。此外，这些系统在信息检索领域\
  \ [18] 和信息过滤研究中找到了根源。文档编码是由 [2] 在信息检索中开发的，基于内容的方法就依赖于此。后来，[9] 将基于内容的技术应用于不同的领域，以创建个性化推荐系统。\n\
  \n最初，研究人员开始从事基于内容的推荐系统中的内容表示工作。Balabanovic 和 Shoham [12] 使用 `Fab` 通过用 100 个信息丰富的词汇表示内容来推荐网页。类似地，Pazzani\
  \ *等人* [9] 用 128 个信息丰富的词汇表示物品。[9] 使用了最佳词汇数量，并在许多领域进行了测试。评估表明，这种推荐系统可能通过少于 50 个关键词提取唯一的重要特征，但如果超过\
  \ 300 个词，系统就会引入噪声。指定关键词权重的最重要的衡量标准之一是“词频/逆文档频率 `TF-IDF`”，它被 [3] 用于识别文档中信息量最大的词。即使这种加权方案非常有效，但它无法处理自然语言问题。文本内容充满了噪声和信息量低的词汇，如代词、冠词等。这个问题通过借用自然语言处理领域的预处理方法（如停停用词删除、词干提取和词性标记\
  \ (POS) 标记）得到了解决。`Porter Algorithm` [Martin Porter, 1980] 被引入用于文本内容的词干表示。基于关键词的表示无法捕捉用户兴趣和物品描述的语义。这些方法受到“多义性”（POLYSEMY）和“同义性”（SYNONYMY）问题的的影响。\n\
  \n为了解决这些问题，使用了语义分析的概念引入基于内容的推荐系统的语义。Wikipedia、DBpedia、freebase 等几个开放信息库的获取以及语义创新填补了基于内容的推荐系统知识领域的进展。语义技术被提出用于基于概念的物品和用户画像，而不是基于关键词的表示。词义消歧\
  \ (WSD) [Semeraro *等人* 2007] 为此提出。语义技术与自然语言处理的结合产生了语义推荐系统 [49]。后来，它成为最具创新的研究领域。对于语义技术使用了两种方法，即自上而下和自下而上。自上而下的方法基于机器可读的字典、分类法和本体。另一方面，自下而上的方法能够通过无监督技术检查词在大规模文本文档语料库中的利用情况来推导出词的含义\
  \ [63]。\n\n\n\n\n随着语义网[22]的发展，本体论已成为许多领域领域知识表示的一门有力学科。因此，已经引入了许多方法在推荐系统中利用本体论。本体论被用于描述显性信息，这些信息被视为概念、属性和关系的层级结构。Magini\
  \ *et al.* [23] 为多语言新闻网站提出了一种个性化代理 SiteIF。在他们的工作中，MultiWordNet 被用作知识库。用户画像被构建为语义网络[26]\
  \ 提出了一种基于 Web 的个性化系统，该系统同时利用用户日志和网页内容的语义来完成系统的个性化。使用特定领域的分类法对网页进行语义标注，以建立统一且一致的资源库。研究主题本体论[27]\
  \ 被用于推荐计算机领域的学术论文。相关性分析被用于用户画像中的主题与论文相关的主题之间的匹配。上述过程被[31, 32] 用于新闻推荐。在本体论语境下，项目描述符是\
  \ TF-IDF 向量，用户画像以类似的语境描述，并使用余弦相似度度量来匹配项目和画像，这与[33, 34] 中使用的方法不同。在这些方法中，通过对用户空间和项目聚类建立了隐性兴趣社区，通过计算它们之间的相似性来实现推荐。正如[35]\
  \ 所示，三级本体论中概念的位置被用于寻找用户与项目画像之间的相似性。[36] 描述了扩散激活算法，该算法利用本体画像来向用户推荐感兴趣且独特项目。相同的方法也用于[64]，其中从少数初始概念到其他相关领域概念的演进允许以更好的方式提供推荐，并解决冷启动问题。\n\
  \n由于基于本体的画像歧义性较小，这些画像可能被用于推荐系统，因为使用本体论为项目和用户画像增加了语义维度，并限制了基于内容的推荐系统所存在的问题。但开发特定领域的本体论是一个非常耗时且费力的过程。因此，研究人员使用了语义感知推荐系统的世界知识在线资源聚合。\n\
  \n在人工智能（AI）中，知识的重要性已得到认可，通过使用如 Wikipedia 和 开放目录项目（ODP）等结构化和非结构化知识库来解决本体问题。Wikipedia\
  \ 成为[29, 37, 38, 65]中许多任务最有用的信息来源。将 Wikipedia 作为知识源的主要优势在于免费可用、资源覆盖广泛、支持多种语言以及准确性。为了解释\
  \ Wikipedia 页面并让机器处理，使用了自然语言理解概念。若干作者[39, 41, 58] 讨论了 Wikipedia 中的信息提取和使用问题。Wikipedia\
  \ 中提出了几种技术，用于挑选出最高忠真度的语义特征来表示项目，并利用百科全书知识生成新特征。Wikify! [39] 和 Tagme [58] 是选择特征最常用的方法。表示文本的重要概念是在[39]\
  \ 中提取关键词并使用 WSD（词义消歧）技术将这些概念与 Wikipedia 页面链接。Tagme [58] 实现了消歧算法，通过指向 Wikipedia 页面的超链接来增强文本的表示。[41]\
  \ 使用了一种名为显性语义分析（ESA）的方法，利用 Wikipedia 的知识生成新特征以启发项目表示。[37] 中给出的传统袋模型检索模型通过这种技术得到了增强。[45]\
  \ 通过知识注入过程提出了使用 Wikipedia 分析内容。\n\n以往关于基于本体的推荐算法基于有限的领域本体、受控词表和分类法。因此，链接开放数据（LOD）为更好的推荐应用开辟了新的可能性，被称为基于\
  \ LOD 的推荐系统。第一个使用 LOD 构建推荐系统的方法是[50]，用于协作推荐系统。Noia *et al.* 在[59] 中实现了基于内容的推荐系统，该系统使用\
  \ LOD 数据集中的可用数据，如 DBpedia [44], Freebase [40] 和 LinkedDB [42]。[65] 探索了将 LOD 用于基于内容的推荐系统。这种范式遵循了基于交付模型和实体链接技术的语义解释。实体链接策略被用于识别并将自由文本中的对象映射到\
  \ LOD 中。[72] 引入了推荐策略，以提供对链接内容的定制化访问。Noia [76] 介绍了结合 LOD 使用的推荐系统概述。\n\n研究人员致力于分类算法来学习画像以区分高评分文档的表示。Rocchio\
  \ 算法用于学习 TF/IDF 向量，该向量是高评分文档的平均值。Syskill & Webert [9] 使用贝叶斯分类器来评估喜爱文档的概率。Winnow\
  \ 算法 [Littlestone & Warmuth, 1994; Blum, Hellerstein & Littlestone, 1995] 设计用于存在许多可能属性时识别相关特征。正如[7]\
  \ 所示，该算法在文本分类中表现良好。\n\n![Figure 9.1 Content based recommender system.](img/c09_image_6_1.jpg)\n\
  \n**Figure 9.1** Content based recommender system.\n\n\n\n\n\n推荐过程通过四个组件完成。这些组件见\
  \ [54]：\n\n* `Content Analyzer`（内容分析器）：由于网络上的可用信息是非结构化格式，因此需要进行预处理以提取相关信息。该组件负责将来自信息源的内容以适合处理的形式表示。使用特征提取技术对数据项进行分析。该组件的输出是结构化的项目描述，并存储在表示项的仓库中。\n\
  \n![图 9.2 基于内容的推荐系统架构 [87]。](images/c09_image_7_1.jpg)\n\n**图 9.2** 基于内容的推荐系统架构\
  \ [87]。\n\n* `Profile Learner`（画像学习器）：该组件为了泛化目的积累了活跃用户偏好数据的描述。建立机器学习模型来发现用户过去的兴趣。用户画像是该组件的输出，并用于清理不一致的项目。\n\
  \n* `Profile Cleaner`（画像清理器）：该组件旨在评估画像，并在将其存入数据库画像之前删除不一致的对象。\n\n* `Filtering Component`（过滤组件）：该部分通过比较内容分析器和画像学习器的性能来执行推荐功能。它通过匹配画像特征与偏好项目，解决某项目是否适用于参与用户。使用余弦相似度测试来评估相似性。\n\
  \n用户对项目的反射性动作被收集并存储在反馈仓库中。这些反应也被称为“标注” [4]。用户提供的反馈被系统用于更新用户画像。用户可以在不提供任何反馈的情况下定义自己的兴趣。可以提供两种相关性反馈，一种是推断用户喜欢的特征，另一种是推断用户不喜的特征\
  \ [10]。用户的响应可以通过两种方式被采用：第一是显式反馈，系统要求用户显式地检查项目；第二是隐式反馈，系统不需要活跃用户的明确要求。反馈是通过分析用户的活动推导出的。\n\
  \n必须为活跃用户 `u[a]` 定义训练集 `T[a]` 以构建该活跃用户 `u[a]` 的画像。`T[a]` 是用户对项目表示提供的评分集合。项目表示用用户提供的评分进行标记。然后，应用监督学习算法生成用户画像。画像仓库用于存储用户画像。过滤组件比较项目表示中的特征与存储在用户画像中的偏好，并预测用户喜欢项目的可能性。用户画像必须根据用户不断变化的兴趣进行更新和维护。最后，在另一个训练集上重复学习过程，并根据推荐结果生成反馈。\n\
  \n在不执行画像清理器组件的情况下执行这些步骤，系统会出现一些问题 [87]。假设如果项目的评估是由活跃用户账户的其他人完成的，而这些人之前没有评估过这些项目，那么将在用户画像中产生噪声。画像学习器会考虑这些不一致的项目，并将它们作为活跃用户画像的一部分，供过滤组件用于推荐。实施不一致的对象将导致糟糕的建议并损害系统的可靠性。另一个问题出现在用户画像中的产品老化情况下，当成功用户的兴趣随着年龄发生了转移，但未反映用户最新口味的旧对象仍被正面评估。这些旧对象会在机器移除它们之前一直产生噪声。这将影响建议过程的可靠性。如果这两个问题同时存在于流程中，将导致系统处于“魔法屏障状态”，即噪声影响系统且系统可靠性无法进一步增强的状态。这些问题在\
  \ [87] 中通过引入另一个组件（即画像清理器）得到了解决，如 图 9.3 所示。该组件的结构将在下一节描述。\n\n![图 9.3 画像清理器架构 [87]。](images/c09_image_9_1.jpg)\n\
  \n**图 9.3** 画像清理器架构 [87]。\n\n### 9.3.2 画像清理器表示\n\n画像清理器接收用户画像和用户评估的项目作为输入（如 图 9.2\
  \ 所示）。画像清理器的子组件如 图 9.3 所示，描述如下：\n\n* `Items Coherence Analyzer`（项目一致性分析器）：将组织好的项目表示与用户画像的剩余部分进行比较，以确定项目与该元素的相似性。文献中的\
  \ [6, 8, 13, 16, 17] 使用了许多方法来确定包括同义集在内的标准化表示的一致性。可以应用这些步骤中的任何一步。该元素一致性函数的性能随后被另一个变量用于评估是否应该忽略该对象。\n\
  \n* `Temporal Analyzer`（时间分析器）：它与前一个组件并行工作。与其他项目的评估由该组件完成。时间距离将作为输出，供下一个组件使用。\n\n\
  * `Items Removal Analyzer`（项目删除分析器）：前两个组件的输出由此组件管理。一致性的最小值和时间距离的最大值也作为输入。这决定了是否从用户画像中删除该对象。清理后的用户画像\
  \ `u[a]` 是该模块的输出，它没有不一致和旧的对象。\n\n从用户画像中移除不一致的项目后，清理后的画像被存储在画像仓库中。然后，过滤组件使用这些清理后的画像进行推荐。通过这种方式，画像清理器解决了早期语义感知推荐系统中存在的问题\
  \ [75]。\n\n表示项目和学习用户画像的技术将在下一节讨论。\n\n## 9.4 用于项目表示和学习用户画像的技术\n\n### 9.4.1 内容表示\n\
  \n\n\n\n\n项目（Items）是由属性表示的内容。属性规定了项目的特征，例如电影推荐应用中的演员名称、文档推荐应用中的单词等。每个项目的内容被表示为文档中出现的术语集。项目以结构化的方式通过属性进行表征\
  \ [28]]。当基于内容的推荐系统需要表示文本内容时，自然语言处理（`NLP`）技术便介入。项目通过从网页、电子邮件、新闻文章等获取的文本特征进行概述。但由于自然语言的歧义性，这些特征带来了许多复杂性。传统的基于关键词的画像方法基于字符串匹配操作，因此这些方法无法捕捉用户兴趣的语义。为了解决这个问题，文献中将基于语义的方法集成到推荐模型中。在这些结合方法中，利用了字典、自由知识库（freebases）和本体论等知识源来定义项目和表示画像。下一节将描述表示文档的基本模型。\n\
  \n### 9.4.2 基于关键词的向量空间模型\n\n用于推荐项目最常用的语义方法是基于词频-逆文档频率（`TF-IDF`）的关键词空间模型。向量空间模型是文本文档的映射。\n\
  \n在 n 维空间中，每个文档由一个向量表示，其中每个维度对应于给定文档数组总词表中的一个单词。每个文档都被赋予一个术语权重向量，权重表示文档与术语之间的关联程度。假设\
  \ `D = {d[1],d[2], …d[N]}` 表示文档集，`T = {t[1],t[2], ….t[n]}` 是文档中的单词集。这些术语集是通过应用分词、去停用词和词干提取等预处理技术获得的\
  \ [2]]。每个文档 `d[j]` 被表示为 n 维向量空间中的一个向量，因此 `d[j] = <w[1j] ,w[2j] ,...,w[nj]>`，其中 `w[kj]`\
  \ 是术语 `t[k]` 在文档 `d[j]` 中的权重。VSM 对文本的描述存在两个问题：单词的加权和特征向量一致性的计算。`TF-IDF` 加权是最应用最广泛的术语加权方法，它基于对\
  \ `IDF`、`TF` 和归一化的经验文档观察 [3]]：\n\n*   稀有术语的重要性不低于常用术语；\n*   文档中单词的多次出现重要性不低于出现一次；\n\
  *   长论文并不受青睐\n\n换句话说，经常在某文本中出现（`TF` = 词频率）但在语料其他部分很少出现（`IDF` = 逆文档频率）的术语更有可能适用于文档主题。因此，对生成的权重向量进行归一化可以防止较长的记录获得更好的检索机会。`TF–IDF`\
  \ 函数是这些假设的良好示例：\n\n(1)![image](img/c09_Inline_12_9.jpg)\n\n其中 `N` 是语料中的文档数量，`n[k]`\
  \ 表示术语 `t[k]` 出现在集合中至少的文档数量。\n\n(2)![image](img/c09_Inline_12_10.jpg)\n\n其中限制由文档\
  \ `d[j]` 中所有 `t[z]` 单词的频率 `f[z,j]` 决定。为了减少 `[0,1]` 区间的权重并用相同大小的向量表示文档，通过 公式 1 获得的权重通常通过余弦归一化进行标准化：\n\
  \n(3)![image](img/c09_Inline_12_11.jpg)\n\n这强制了归一化的假设。如前所述，为了判断两条记录之间的接近程度，需要相似性度量。为了定义两个向量的接近性，推导出了多种相似性度量；在这些中，余弦相似度是最常用的：\n\
  \n(4)![image](img/c09_Inline_12_12.jpg)\n\n在基于内容的 VSM 推荐系统中，所有用户和对象的画像都表示为加权术语向量。计算余弦相似度将产生投影。\n\
  \n### 9.4.3 画像学习技术\n\n在基于内容的 VSM 推荐系统中，所有用户和对象的画像都表示为加权术语向量。计算余弦相似度将产生投影。\n\n机器学习策略非常适用于文本\
  \ [25]]。每个文档必须被分类为 `C = {c+, c−}`，其中 `c+` 是用户喜欢的正类，`c−` 是用户讨厌的负类。下一节将介绍朴素贝叶斯算法。相关反馈也用于\
  \ Rocchio 公式，并在下一节描述。\n\n### 9.4.3.1 概率方法\n\n朴素贝叶斯是一种归纳学习概率方法。基于之前的结果，创建一个概率模型。该模型估计文档\
  \ `d` 属于类别 `c` 的后验概率 `P(c)`。该估计基于先验概率 `P(c)`、在类别 `c` 中观测到文档的似然 `P(d)`、给定 `c` 观测到文档\
  \ `d` 的似然 `P(d|c)` 以及观测实例 `d` 的似然。\n\n(5)![image](img/c09_Inline_13_9.jpg)\n\n为了分类文档\
  \ `d`，选择概率最高的类别，如：\n\n![image](img/c09_Inline_14_8.jpg)\n\n`Pd` 通常被移除，因为它对所有 `c[j]`\
  \ 都相等。通过观察训练数据，投影 `P(d|c)` 和 `P(c)`。由于观测数据不足以生成良好的概率，`P(d|c)` 的估计是有问题的。这个问题通过使用朴素贝叶斯算法修改模型来解决，即观测文档“d”中的所有单词相互条件独立。计算文档中单词的概率而不是整个文档。朴素贝叶斯算法在分类文本方面效果良好\
  \ [7, 14]]。在多个基于内容的推荐系统中，如 Syskill & Webert [9, 11]、NewsDude [19]、Daily Learner\
  \ [20]] 以及 LIBRA [21]] 和 ITR [43]]，均使用了朴素贝叶斯方法。\n\n#### 9.4.3.2 Rocchio 公式与相关反馈方法\n\
  \n相关反馈源自信息检索的方法，它可以帮助用户根据之前的搜索结果改进查询。它包含了用户根据检索文档显著性提供的反馈。Rocchio 公式利用这种技术进行推荐。它允许用户根据需求对文档进行评分。\n\
  \n\n\n\nRocchio 方法用于创建构型形式的线性分类器。数据通过向量定义，以便在信息文件中具有完全相同的向量。研究中此类向量的任何部分都反映了一个定义，即一个术语。使用\
  \ TF–IDF 方法来衡量每个单词的权重。训练通过将文档向量转换为每个类别 C 单元的模型向量来完成。对于每个类别，通过计算模型向量与代表 `d` 的相应文档向量之间的相似性，并使用余弦相似度度量来定义新文档\
  \ `d`，然后将 `d` 分配给文档向量相似值最高的类别。\n\nRocchio 方法通过以下公式为类别 `c[i]` 计算分类器 `→c[i] = (w[1i]…….,w[|T|i])`（`T`\
  \ 是训练集中已知的不同术语的集合，称为词汇表）：\n\n(6)![image](img/c09_Inline_15_10.jpg)\n\n其中 `w[kj]`\
  \ 是术语 `t[k]` 在文档 `d[j]` 中的 TF–IDF 权重，`POS[i]` 和 `NEG[i]` 是训练集中特定类别 `c[j]` 的正例和负例集。为了评估所有正负案例的相对重要性，使用了两个控制参数\
  \ `β` 和 `γ`。计算每个模型向量 `c[i]` 与文档向量 `d[j]` 之间的相似性，为文档 `d[j]` 分配类别 `c`，并通过最大相似值确定类别\
  \ `c`。这种策略没有理论依据，但质量有保证 [28]]。\n\n基于内容的推荐系统在 YourNews [30]]、Fab [12]] 和 NewsT [5]]\
  \ 中使用了这种技术。\n\n### 9.4.3.3 其他方法\n\n其他训练策略如决策树、决策规则分类器和最近邻算法被应用于基于内容的推荐系统中。以下是这些算法的简要描述：\n\
  \n决策树是树结构，其内部节点用概念标记，叶子节点用部分标记，分支根据测试中术语在测试文档中的权重进行标记。这些树通过文本数据进行训练，即重复地将训练数据划分为子组，直到子组仅包含一类示例。使用信息增益或熵准则\
  \ [15]] 来选择应用于划分操作的术语。Syskill 和 Webert [9, 11]\\]] 使用决策树来学习构型。\n\n决策规则分类器与决策树是可以互换的，因为它们的工作方式与递归划分数据的方法相同。我们倾向于产生比决策树学习器更轻量级的分类器。规则学习方法旨在从任何分类规则中选择最优质的一条。\n\
  \n最近邻算法也称为惰性学习器，它们本质上存储数据并使用相似性函数通过与存储的项进行比较来识别新项目。计算每个模型向量 `c[i]` 与文档向量 `d[j]`\
  \ 之间的相似性，为文档 `d[j]` 分配类别 `c`，并通过最大相似值确定类别 `c`。这种策略没有理论依据，但质量有保证 [28]]。\n\n## 9.5\
  \ 推荐系统的适用性\n\n基于内容的推荐系统在 YourNews [30]]、Fab [12]] 和 NewsT [5]] 中使用了这种技术。其他训练策略如决策树、决策规则分类器和最近邻算法被应用于基于内容的推荐系统中。以下是这些算法的简要描述：\n\
