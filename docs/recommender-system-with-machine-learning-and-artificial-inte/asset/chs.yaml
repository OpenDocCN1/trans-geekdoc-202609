  \n**Jyotir Moy Chatterjee**\n佛佛教育基金会 (APUTI)\n加德满都\n尼泊尔-44600\n\n# 第一部分\n## 推荐系统导论\n\
  \n## 1\n## 推荐系统基础概念简介\n\n**Pooja Rana, Nishi Jain 和 Usha Mittal\\***\n*印度计算机科学与工程系，美丽专业大学（Lovely\
  \ Professional University），Phagwara*\n\n### 摘要\n在当今世界，我们发现在线上进行的任何搜索都存在广泛的可能性，但在选择我们真正需要时可能会遇到困难。为了解决这些问题，推荐系统发挥了重要作用。推荐系统利用不同的算法过滤数据并向用户推荐最相关的数据。例如，电子商务推荐系统需要网站的历史记录，如果用户没有历史记录，推荐系统会推荐市场上最畅销或热门的产品。推荐系统是个性化的有效工具，始终保持更新，并根据实际行为提供推荐。\n\
  \n**关键词：** 推荐、基于物品、评分、人工智能\n\n## 1.1 引言\n推荐系统是信息提取系统的一个子类，有助于发现特定条目的排名或用户偏好 [1,\
  \ 2]。通过考虑推荐建议（例如购买哪种产品、听什么种音乐或在何处阅读在线新闻），可以做出许多决策。\n\n系统建议的内容被称为 `Item`（条目）。推荐系统通常关注特定形式的条目，如\
  \ DVD 或文章，以及其方案、图形用户界面（GUI）以及用于建议的主要方法。\n\n考虑一个玩具推荐系统的示例，它可以帮助客户选择购买的玩具。流行的电子商务网站\
  \ `Amazon.com` 也使用推荐系统为每个用户识别在线商店 [3]。由于建议和选择通常是个性化的，不同的用户或用户组会有不同的建议。对于杂志和报纸，产生的是非个性化的建议，这些建议很容易生成。考虑选择前十书籍或\
  \ CD 的例子。\n\n为了做出个性化建议，会生成条目的排名列表。生成排名时，会考虑用户的偏好和限制，以提取最合适的产品和服务。为了计算最相似的产品和服务，通过理解用户的行为隐式或显式地收集用户的偏好。\n\
  \n在本章讨论了各种推荐技术的优缺点以及不同的评估指标。\n\n\n\n\n\n1. 在高流量网站中，推荐系统起着至关重要的作用，例如 Yahoo、`Amazon.com`、`Netflix`、`YouTube`、`TripAdvisor`\
  \ 和 IMDB。现在，推荐系统作为服务的一种的一部分，已由许多媒体公司提供给订阅者。例如，在线电影租赁服务 `Netflix` 曾支付巨款（即一百万美元）作为奖励给首个成功提高其推荐系统准确性的团队\
  \ [3]。\n\n2. ACM 推荐系统（`RecSys`）于 2007 年建立，专门用于会议和研讨会。\n\n## 1 推荐系统的功能\n\n推荐系统针对用户想要使用的特定项目提供建议。现在，这个定义可以通过表征系统可以扮演的不同角色来进一步完善。推荐系统根据用户的需求扮演不同的角色，例如：旅游中介使用的推荐系统通常用于增加收入，如\
  \ `Expedia.com` 和 `Visitfinland.com`；而客户使用这些系统的目标则是在访问目的地时寻找合适的酒店和有趣的活动/景点。\n\n\
  以下是服务提供者利用推荐技术的不同原因：\n\n1. **增加产品销售**：商业推荐系统的主要目标是增加销售额，换句话说，就是卖出那些没有推荐就无法销售的产品。提供推荐是考虑到所建议的产品和服务符合客户的需求。非商业性推荐也用于类似的目标。考虑一个内容创作者的例子，他想增加其网站上的新闻读者人数。服务提供者使用推荐系统的目标是，与浏览网站的用户相比，增加选择产品或服务的用户数量。\n\
  \n2. **销售多样化产品**：推荐系统还可以帮助用户找到那些在没有特定参考的情况下可能难以找到的物品。例如，`Netflix` 使用的推荐系统目标是租出列表中尽可能多的电影，而不是最热门电影。如果没有推荐系统，做出此类建议可能是困难的，因为服务提供者无法承担推荐不符合用户喜好的视频的风险。通过这种方式，推荐系统还会推荐一些甚至并不热门的电影。\n\
  \n3. **用户满意度**：推荐系统有助于提高用户在使用应用程序或网站时的体验。它提供了有趣、有意义且相关的建议，并提供了更佳的人机交互。有效的推荐（即准确的推荐）以及交互式用户界面会增加系统的使用率，以及建议被采纳的概率。\n\
  \n4. **用户忠诚度**：客户总是倾向于使用识别老用户并将其视为尊重/有价值客户的网站或应用程序。这是推荐系统的一个共同特征，因为它在计算推荐/建议时，会考虑从用户早期交互中获得的数据，例如其对产品的评分。因此，客户使用某个网站越频繁，其模型就变得越好，即输出将更符合用户的偏好（定制化）。\n\
  \n5. **更好地理解用户需求**：推荐系统通过收集显式信息或系统做出的预测，充当了用户偏好的“主动学习者”。业务所有者随后可以重新利用这些信息来改进库存管理或物品生产。\n\
  \n## 1.2 数据和知识源\n\n推荐系统是知识提取系统，它们主动收集不同类型的信息来做出建议。事实大多与被推荐的内容以及接收此类建议的消费者有关。可用数据源非常庞大且多样，它们用于制作推荐在很大程度上取决于将使用的推荐技术。\n\
  \n1. **物品（Items）**：推荐系统推荐的产品和服务被称为物品。如果建议的产品对消费者有益，则认为该物品的推荐是正面的。如果产品不满足用户需求，且客户在选择时做了错误的决策，则推荐是负面的。\n\
  \n2. 例如，新闻推荐系统设计人员必须考虑新闻的结构、文本表示以及任何新闻的时间重要性。因为在阅读新闻时，没有金钱成本，但存在认知成本。如果系统做出了正面推荐，那么搜索和阅读新闻的成本将被获取相关且有价值知识的收益所覆盖。但如果推荐是负面的，用户的时间就会被浪费，这限制了用户再次使用该系统。在其他领域，如手机或商业投资，则涉及实际的金钱成本，这在选择最合适的推荐技术时成为需要考虑的重要组成部分。\n\
  \n3. 难度和价值较低的物品示例是新闻、网页文章、电子书、DVD 和电影。具有高复杂高价值的物品有笔记本电脑、LCD 屏、手机、数码相机、家电器、PC 等。保险单、旅游计划、财务投资和工作被认为是最复杂的物品\
  \ [10]。根据基本的推荐方法，推荐系统使用产品服务的各种属性和特征。例如，在电影推荐中，喜剧、惊悚等类型，以及演员和导演，都可以用来定义一部电影。\n\n\
  4. **用户（Users）**：推荐系统的用户可能有非常不同的目标和特征。为了做出正面推荐，系统应该利用关于用户的各种数据。这些数据可以通过几种方式进行组织，再次，数据的使用取决于推荐方法。\n\
  \n5. **交易（Transactions）**：推荐系统与用户之间任何记录的通信被称为交易。这些日志收集了交互时产生的关键信息，对于推荐技术非常有价值。日志可能还包含用户提供的显式反馈，如对特定产品的排名。\n\
  \n6. 评分（Ratings）是推荐系统收集的最常见的交易数据方法。这些排名可以通过显式或隐式方式收集。不同类型的评分如下：\n\n    * 排名可以是 `Amazon.com`\
  \ 等电子商务网站相关物品给出的 1–5 数值。\n\n    * 排名可以是序数值，如通常用于调查的“非常同意、同意、中立、不同意、强烈不同意”。\n\n \
  \   * 排名可以是二值，从用户处获取产品是否有用的反馈。\n\n## 1.3 推荐系统的类型\n\n目前有不同类型的推荐系统，它们在问题领域、使用的信息以及最重要的用于预测的推荐算法方面有所不同。主要有两种类型的推荐系统，如图\
  \ 1.1 所示 [#c01.xhtml#figure1]，即基于内容的推荐系统和协同过滤方法。\n\n### 1.3.1 基于内容\n\n\n\n\n基于用户之前提交的响应，系统通过分析项目之间的特征相似性来学习进行推荐。例如，根据用户对不同类型电影的评分，系统将学习推荐用户给出好评的类型。基于内容的推荐系统根据用户之前评分的项目来构建用户画像（user\
  \ profile）。用户画像代表了用户的兴趣，并且能够适应新的兴趣。将用户画像与内容对象的特征进行匹配，基本上就是推荐过程。该过程的结果是一个判断，标志着用户对该对象的兴趣程度。一个高度准确的用户兴趣画像将提高信息访问过程的实用性。例如，它可以通过判断用户是否对特定页面感兴趣来过滤网页搜索结果。\n\
  \n![图 1.1 不同的推荐技术。](img/c01_image_6_9.jpg)\n\n**图 1.1** 不同的推荐技术。\n\n推荐过程包含 3 个步骤，每个步骤都被单独处理。\n\
  \n1. **内容分析器：** 如果数据是非结构化的，则需要进行一些预处理以获取相关信息。内容分析器的主要职责是将来自源的内容以相关的形式表示，供后续步骤步骤。使用特征提取技术将项目结构从原始修改为目标（例如，将网页表示为关键词向量）。该表示被输入到下一个组件。\n\
  \n2. **学习器：** 该模块通过泛化从上一个组件获得的数据来构建用户画像。机器学习技术用于学习泛化策略，这些策略能够根据用户过去的正、负面偏好构建模型。例如，网页推荐系统的画像学习器将实现相关性反馈方法，将正、负反馈合并成一个代表用户画像的原型向量。\n\
  \n3. **过滤组件：** 该模块利用用户画像来导出相关项目。这是通过将画像与待推荐的项目进行匹配来实现的。根据相似性指标，产生二值化或连续的相关判断。\n\n\
  基于内容的推荐系统根据用户购买或喜过的项目，从用户的历史数据中获取推荐思路。在进行预测时，用户属性和项目属性具有同等的重要性。考虑新闻推荐器的例子，需要通过类别（金融、体育、健康、技术、政治、娱乐、汽车等）或位置（本地、国家或国际）等特征来寻找新闻之间的相似性索引。为了提取情感得分等特征，会使用\
  \ TF-IDF 分数。在这种方法中，会创建每个用户以及每个项目的画像，并创建两个向量。\n\n1. **项目向量：** 一个长度为 N 的向量，对于高 TF-IDF\
  \ 的单词包含值 1，否则为 0。\n\n2. **用户向量：** 一个 1 × N 的向量，包含文章中每个单词出现的概率。用户向量基于项目的属性。\n\n之后，使用以下方法计算用户和文章之间的相似性：\n\
  \n1. **余弦相似性：** 用于衡量用户和项目之间的相似性。这种方法提供了用户-项目相似性。当我们在具有高维特征时（特别是在信息检索和文本挖掘中），这种方法最好。其范围在\
  \ −1 到 1 之间，有两种方法：\n\n    * Top-n：根据此，推荐前 n 个最佳产品。\n    * 评分量表：在在这种情况下，会固定一个阈值。\n\
  \n[1] `Jaccard 相似性`：使用`Equation 1` 计算。\n[2] `欧几里得距离`：使用`Equation 2` 计算。\n[3] `皮尔逊相关系数`：使用`Equation\
  \ 3` 计算。\n\n#### 1.4.1.1 内容推荐的优点\n\n* **用户独立性：** 内容推荐系统仅根据用户的评分构建用户画像。在构建具有相同兴趣的用户的画像时，不考虑任何邻居。\n\
  * **透明性：** 基于内容的系统的解释功能对用户是透明的，这意味着它提供了推荐的解释。\n* **新项目：** 它不会受到冷启动问题（firstater problem）的影响，这意味着如果某个项目没有被任何用户评分，也可以被推荐。\n\
  \n#### 1.4.1.2 内容推荐的缺点\n\n* **内容分析有限：** 内容推荐系统的缺点之一是就特征数量和类型而言与项目相关的内容有限。领域知识对于做出推荐也至关重要。例如，建立电影推荐系统需要电影演员和导演的知识。\n\
  * **过度专门化：** 基于内容的推荐系统没有任何本质方法来探索预测之外的事。系统只能推荐那些与用户画像匹配时得分高的项目。这被称为意外问题（serendipity\
  \ problem），显示了基于内容所能做的推荐的局限性。\n* **新用户：** 为了让推荐系统学习用户偏好，需要收集足够的评分。由于没有历史数据，系统无法为新用户提供可靠的推荐。\n\
  \n### 1.4.2 协同过滤\n\n这种方法利用用户行为进行推荐。在这种方法中，没有对应用户或项目的特征。它使用效用矩阵，最常用于工业，因为它独立于任何额外信息。\n\
  \n基于内容的推荐系统的局限性可以通过协同方法克服，例如，它可以对那些没有内容的项目进行预测。它利用其他用户的反馈来推荐此类项目。这些系统根据同行评审评估项目的质量。\n\
  \n协同过滤有 2 类，如图图 1.2 所示：\n\n\n\n\n\n## 1. 基于内存（邻域）的方法\n\n在这种方法中，通过学习效用矩阵并向给定用户询问效用矩阵的其他部分\
