  \n**图 15.2** 区块链交易。\n\n### 15.1.5 认知系统\n`Cognitive systems`可以与环境（如人、情况和数据）交互并不断从中学习。`cognitive\
  \ system`发展并提高其学习能力 [32]。这些系统主要是通过类似于大脑的想法构建的，从数据、信念、假设和周围社会学习以获得最佳答案。这表现为对情况做出反应的能力\
  \ [24, 29, 33, 39 以及 40]。\n\n### 15.1.6 应用\n通过融合这些技术可以获得许多应用。一些应用包括\n\n**智能医疗保健推荐系统：**\
  \ 患者的健康状况数据可以通过`IoT`传感器持续获取，然后使用`blockchain`来确保数据安全并在互联网上安全地传输，其中`cognitive system`可以使用这些数据进行分析，在患者对某些紧急健康状况不知道该做什么时推荐一些帮助。\n\
  \n**智能银行支持：** 用户可以使用`bitcoin`向银行支付，交易可以通过使用`blockchain`确保安全。所有数据都收集在`cognitive system`中并分析。当用户需要任何帮助时，系统可以通过分析数据并从中学习来回答。\n\
  \n**智能新闻推荐系统：** 用户数据可以通过手机收集，并在`blockchain`网络上安全传输，其中数据在`cognitive system`中进行分析，并在用户搜索新闻之前自动向其推送新闻和媒体故事。\n\
  \n**智能交通控制与推荐系统：** 交通细节从车辆中的`IoT`设备中收集，并安全地通过`blockchain`网络传输。其中数据可以进行分析。当发生事故或任何其他紧急情况时，它可以自动推荐给需要绕道或采取必要措施的车辆。\n\
  \n\n\n\n`Smart Shopping`: 移动端的购物应用可以收集用户所有的喜欢、不喜欢、需求以及所有其他数据，并使用区块链安全地传输。然后，这些数据将在认知系统中进行分析，并根据用户需求推荐商品。\n\
