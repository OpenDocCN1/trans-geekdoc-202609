  \ 24, 2, 123–140, 1996.\n\n\n\n\n推荐系统是一种高效的信息过滤系统，已用于不同领域，通过预测和推荐各种项目来实现应用程序的定制化。协同过滤（CF）是推荐系统中最为人知的技术，通过衡量相似用户在其他相似项目上表现出的兴趣，在各种项目中找到与用户选择相匹配的新项目。推荐系统是一种决策系统，用于在各个领域中通过推荐不同类型的项目来实现应用的个性化。协同过滤是推荐系统中的一种著名的过滤技术，用于跨领域应用中为特定用户预测并推荐项目。在这里，隐私和准确性是对推荐系统起主要作用的两个核心因素。推荐系统中使用了多种基于机器学习和深度学习的协同过滤方法。在本章中，我们提出了受限玻尔兹曼机方法（RBM）和一种混合深度学习方法，即结合卷积神经网络（CNN）的\
  \ RBM（CRBM）。与现有的其他方法相比，这两种提出的方法为电影推荐系统提供了更高的准确性。所提出的 CRBM（`RBM with CNN` 方法）是最佳方法，提供了比所有方法更小的平均绝对误差（`MAE`）。\n\
  \n**关键词：** CNN、协同过滤、CRBM、深度学习、矩阵分解、RBM、推荐系统、奇异值分解\n\n## 6.1 引言\n\n在当今环境下，人们生活的各个方面通过互联网连接在一起。当人们使用互联网购买任何产品时，他们会首先查看该产品的评价和评论。推荐系统发挥着主要作用，在电子商务网站上预测并推荐用户可能偏好的特定产品。该系统表现为一个决策系统，根据用户的偏好、特征和项目属性进行设计[1,\
  \ 6]]。\n\n基于用户画像，推荐系统具有预测特定用户是否偏好某个项目的能力。这种信息过滤系统可以使用项目画像或用户画像来开发。本章主要讨论了用于推荐系统中基于项目的协同过滤技术[6,\
  \ 14]。如今，电子商务网站借助预测和推荐用户偏好产品的推荐系统，创造了高额收入[4, 24, 26]。\n\n随着人们访问各种电子商务网站，用户数据的增长也带来了许多挑战和问题。推荐系统中的主要问题是信息过载、稀疏性和隐私，可以通过机器学习方法来解决。为了获得更高的推荐系统准确性，使用了不同的方法，如矩阵分解（`MF`）、基础奇异值分解（`BSVD`）和基于权重的奇异值分解（`WBSVD`）等。不同的指标如平均绝对误差（`MAE`）和均根误差（`RMSE`）被广泛用于计算推荐系统的性能。主要目标是降低模型的\
  \ `RMSE` 值以提供高准确性。`MAE` 是另一种准确性衡量技术，通过计算预测评分与真实评分之间的差异来实现，因此 `MAE` 越小，推荐质量越好。在上述方法中，我们得到了不同的\
  \ `RMSE` 和 `MAE` 值。与上述方法相比，基于不同神经网络的深度学习方法（如受限玻尔兹曼机和卷积神经网络）为用户推荐正确项目提供了更高的准确性。在本章中，我们提出了结合\
  \ `CRBM` 的 `RBM` 混合方法，提供了比上述所有方法更好的准确性结果。\n\n本章其余部分的结构如下：第 2 节描述了推荐系统的概述。第 3 节介绍了基于\
  \ `CF` 的推荐系统。第 4 节介绍了推荐系统中使用的各种方法。第 5 节介绍了提出的基于 `RBM` 和 `CRBM` 的推荐系统以及实验结果和分析。第\
  \ 6 节包含了结论和未来工作。\n\n## 6.2 推荐系统概述\n\n### A. 推荐系统及其基础理论\n\n推荐系统以用户-项目矩阵作为输入。推荐系统中使用了多种类型的过滤技术，即基于内容的过滤、协同过滤和混合过滤。推荐系统通过根据用户对某个项目的口味、兴趣或过去行为，从海量的动态信息中生成合适的信息，从而解决信息过载问题[2,\
  \ 15, 25, 30]]。基于用户画像，推荐系统获得了预测特定用户是否会喜欢某个项目的能力，如图图 6.1]。\n\n2. **学习阶段**：此阶段实现学习算法，从上一阶段收集的反馈中过滤并利用用户的属性[1,\
  \ 15]]。\n\n3. **预测/推荐阶段**：此阶段推荐或预测用户可能喜欢的项目类型。这可以通过直接应用于推荐过程第一阶段收集的数据集的基于内存的方法或基于模型的方法来实现，也可以根据系统记录的用户之前的活动来实现[1]。\n\
  \n### C. 推荐系统中使用的各种过滤技术\n\n\n\n\n\n在之前的阶段收集的数据需要经过过滤以进行推荐过程。过滤可以是基于内容的过滤，它利用了用户过去选择的信息和物品的元数据；也可以是协同过滤（`CF`），它通过创建一个用户-物品矩阵（指定用户对物品的选择）来运行；亦或是混合过滤，它是一（或多种过滤技术的结合。`CF`\
  \ 既可以是基于模型的也可以是基于内存的。`CF` 生成的推荐可以是预测或推荐。\n\n各种过滤技术如图图 6.3 所示。\n\n1. **基于内容的过滤**：一种基于内容的过滤技术使用物品特征和行为，这有助于推荐系统进行更好的预测。这种过滤技术主要基于用户的历史和特征，处理物品的各种属性。用户给出评分，这些评分在性质上可能不同，例如正面、负面和中性。通常系统会推荐获得正面评分的物品\
  \ [1]。\n\n2. **协同过滤**：该技术使用 Pearson 系数、Jaccard 距离和余弦距离等方法，根据用户的评分计算物品之间的相似性 [5,\
  \ 6, 23]。\n\n3. **混合过滤**：这种方法同时使用基于内容的过滤和协同过滤来提高推荐系统的质量。基于混合过滤的推荐系统使用了不同的混合方法，如加权混合、切换混合和级联混合等\
  \ [1]。\n\n![图 6.3 推荐系统中使用的各种过滤技术。](img/c06_image_5_5.jpg)\n\n**图 6.3** 推荐系统中使用的各种过滤技术。\n\
  \n## 6.3 基于协同过滤的推荐系统\n\n协同过滤技术利用用户对物品偏好形成的用户-物品矩阵来寻找正确的结果。通过比较用户-物品矩阵和用户偏好来计算用户配置的相似性。通过应用相似性概念，创建了用户之间的邻域关系\
  \ [9]。用户未评分的物品通过其邻域内其他人的正面评分获得对该物品的推荐。这种基于协同过滤的推荐系统有助于预测和推荐。这种过滤技术可以应用于基于内存或基于模型的方法。图\
