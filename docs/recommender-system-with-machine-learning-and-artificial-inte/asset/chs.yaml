  \n![图 18.3 基础神经网络模型](img/c18_image_8_1.jpg)\n\n图 18.3 基础神经网络模型。\n\n1. **密集层**：它是输入层。第一个密集层通过权重连接到每个输出。因此，有\
  \ `n[inputs]` * `n[outputs]` 个权重。\n2. **激活层 (ReLU)**：密集层之后是非线性激活函数，即 ReLU（修正的线性单元），它执行非线性操作，如\
  \ Eqn.(1)所示。\n\n```\n(1)![image](img/c18_Inline_8_11.jpg)\n```\nReLU 激活函数在 DNN 模型中执行非线性变换。\n\
  3. **丢弃 (Dropout)**：该层用于避免 DNN 模型过拟合。在本方法中，使用了 0.8 的丢弃率。\n4. **全连接层**：输出层通常是全连接神经网络层。密集层和\
  \ ReLU 在深度神经网络中重复。\n5. **所提优化 DNN** 使用带有 SoftMax 的全连接层，这是一种用于多分类的非线性激活函数。\n\nTCA-RS-AD\
  \ 的模型摘要在表 18.5 中，其中 Layer type、Output Shape 和 Param 分别表示层的功能、输出维度和训练参数的数量。\n\n在\
  \ TCA-RS-AD 模型上进行超参数调优以提高性能准确性。用于调优的超参数列在表 18.6 中。\n\n本研究使用的性能指标 [12–15]描述在表 18.7\
  \ 中。分类效率通过精确率（Precision）、召回率（Recall）、F1 分数、汉明 损失（Hamming Loss）、Cohen Kappa 系数、马修斯相关系数（MCC）、平均绝对误差（MAE）、均方误差（MSE）、平衡准确率评分（BAS）和中位数绝对误差（M[d]AE）进行衡量。\n\
  \n上述指标均应用于 DNN 模型和带有超参数调优的 TCA-RS-AD 模型。在 OASIS 数据集上对 DNN 和 TCA-RS-AD 的计算潜力进行了实验，结果列在表\
  \ 18.8 中。\n\n\n\n\n从表 18.8 可以看出，`DNN`模型为极轻度 AD（Very Mild AD）检测生成了`Support`值。它在非痴呆（Non-demented）和轻度\
  \ AD（Mild AD）方面的表现相对中等。同样值得注意的是，该模型未能处理中度 AD（Moderate AD）类。可以观察到，该模型在分类`Mild AD`和`Moderate\
  \ AD`时的`Precision`（精确率）、`Recall`（召回率）、`F1-Score`和`Support`不一致，且测试准确率较低。这些指标在图 18.4\
  \ 图中给出。这种方法提供了将基础 `DNN` 修改为 `TCA-RS-AD` 以实在所有类别数据上获得增强准确率的可能性。`Moderate AD`的支持值为零表明模型性能较浅。`DNN`在`AD`\
  \ 分类上的准确率并不理想。为了提高模型性能，对`OASIS`数据应用了数据填充和超参数调优。表 18.5 是`TCA-RS-AD` 的模型摘要。\n\n| **层类型**\
