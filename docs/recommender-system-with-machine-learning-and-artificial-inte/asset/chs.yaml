  \n除了上述推荐技术外，某些方法利用个人的社交行为[10]来提供新的朋友和小组建议。此类技术被称为社交网络推荐。Facebook 使用的推荐系统就是一种社交网络系统。\n\
  \n## 4.4 性能评估\n\n推荐技术的性能可以通过预测准确率和分类准确率指标进行评估[3, 18]。\n\n在预测准确率方面，我们检查平均绝对误差 (MAE)\
  \ 和均方根误差 (RMSE) 来分析方法的性能。MAE 或 RMSE 越低，性能越好。\n\n\n\n\n` tags 是一份结构化的学术论文片段（引言、应用和参考文献），它不包含任何需要根据你的特定规则进行格式化的变量、函数或代码块。\n\
