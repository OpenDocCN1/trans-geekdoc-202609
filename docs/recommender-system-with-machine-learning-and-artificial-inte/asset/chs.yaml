  \ 2001.\n17. `www.mdpi.com`, 1996.\n18. `www.datascience.com`\n\n## 案例研究 1：医疗推荐系统\n\
  \nUsha Mittal¹, Nancy Singla² 和 Geetika Gupta³\n\n¹ 计算机与工程系，Lovely Professional\
  \ University, Phagwara\n² 药剂系，University Institute of Pharmaceutical Sciences and\
  \ Research, BFUHS, Faridkot\n³ 生物技术系，Thapar Institute of Engineering and Technology,\
  \ Patiala\n\n**通讯作者**: `rashmib@ipu.ac.in`\n\n### 摘要\n\n医疗是医学领域的一个重要方向，需要分析大量的患者数据以获得深度见解，并根据生活方式、社交活动和身体健康记录判断健康状况。应对疾病的最佳方法是尽早发现症状。医疗推荐系统（`HRS`）已成为医疗领域决策不可或缺的工具，能够最大化提高医疗服务的效率和质量。`HRS`\
  \ 的主要目标是通过建立信息质量、认证和可信度，确保在正确的时间提供有价值的信息。`HRS` 的预测不仅要准确，还应帮助针对疾病和治疗的不良结果，制定适当的治疗方案并采取个性化的预防措施。在本章中，将解释各种医疗推荐系统、用于设计推荐系统的不同技术，并提供了一个使用机器学习和人工智能进行帕金森病推荐系统的案例研究。\n\
  \n**关键词**: 生活方式，医疗保健，自我诊断，帕金森病\n\n## 1.1 引言\n\n在每一个领域，技术都会催生创新和发展。由于网络上大数据的可用，推荐系统（`RS`）在经过清洗和挖掘后获得了过滤后的重要数据。可以通过过滤方式检索有效信息，例如：协同过滤、基于内容的过滤和混合过滤。这些是基本类型，此外还有新兴的过滤方法，如移动推荐系统、基于知识的推荐系统等。\n\
  \n1. **协同过滤**：收集和分析活动与行为数据，根据用户与其他用户的相似性来预测用户可能做什么。\n2. **基于内容的过滤**：根据物品特征对过去数据和当前用户预期进行检查和预测。\n\
  3. **混合推荐系统**：将基于内容的技能与协作方法相结合，或将多种方法整合到单一模型中。\n4. **基于知识的推荐系统**：收集客户认知，并通过推理哪些物品可以满足用户需求来构建推荐策略。\n\
  5. **移动推荐系统**：除了传统方法外，移动 `RS` 包含区域信息并做出情境敏感的推荐。\n\n### 1.1.1 医疗推荐系统\n\n医疗推荐系统（`HRS`）属于推荐系统（`RS`）。由于医院拥有大量患者及其健康参数的数据，医疗专业人员必须有效利用这些信息。`HRS`\
  \ 是一个决策系统，它为患者和医疗专业人员提供医疗信息，这些信息可用于诊断辅助和个人健康建议。根据患者当前的健康状况、当前药物、病史、症状和既往治疗，`HRS`\
  \ 可以对相似参数的个体进行分类，例如患者的当前健康状况、病史、当前治疗模式、既往治疗和症状。推荐系统会为同一组患者建议合适的药物。通过推荐系统的帮助，医生将能够做出更充分的决策来治疗患者。其目的是向医疗提供者展示现有的治疗方法，以改进药物选择过程并为患者选择合适的药物。\n\
  \n为了成功开发医疗推荐系统，应该使用许多方法和程序来确保系统的开发。为了使其具有特定且复杂，医疗领域和推荐系统必须面对许多挑战。首先， `HRS` 缺乏适当的任务定义，即需要推荐哪些物品。在医疗场景中可以想象许多情况。例如，移动设备上的推荐系统可以建议适合用户当前状况的体育活动以改善健康。患有关节炎和肥胖的患者可以从不对炎症关节增加额外压力的活动推荐中受益。此外，该系统还可以向患者和医生提出多种癌症疗法。为了获得最佳治疗和替代方案，该系统整合了许多属性，包括药物、其他疾病、家庭状况和工作要求。它可以想象多种治疗范围、经验和可能的副作用，从而增加患者对自身情况的认识。推荐程序可以作为医生和患者之间的通信工具，帮助做出艰难的选择。主要程序可以从两种场景的推荐系统研究中获取，但它们服务于完全不同的目标，因此改变了对推荐系统的要求。\n\
  \n\n\n\n\n在`substantia nigra`（黑质）中，多巴胺神经元的丢失会导致`Parkinson’s disease`。然而，神经死亡的原因尚不清楚。这导致了大脑纹状体区域多巴胺水平的下降。神经递质之间的失衡是导致运动过调和震颤等运动症状的关键因素\
  \ [4, 5]。此外，患有 `PD` 的患者还会出现非运动症状，例如情绪障碍、平衡能力和睡眠问题、学习障碍、尿路和胃肠道功能障碍。临床从业人员可以利用多种非运动体象来识别疾病的阶段\
  \ [6]。\n\n随着 `PD` 的进展，控制动作变得困难。患有该疾病的患者所携带的症状，如步态异常和震颤随阶段而异。通过由`gait cycle`（步态周期）组成的`Gait\
  \ analysis`（步态分析），可以诊断 `PD`。从`physionet data base`中获得的原始力数据通过`Chebyshev 2 Type high\
  \ pass filters`（切比雪夫 2 型高通滤波器）进行过滤，最小频率为`0.8 Hz`，以减少由于人体变化或其他测量因素引起的噪声。滤波后的数据通过脉冲持续时间测量技术和峰值检测帮助获取多种步态特征。通过`gait\
  \ algorithm`（步态算法）获得的阈值数量针对不同受试者进行了调整。通过峰值检测算法获得了包括足跟和足趾力的各种移动特征。通过开发`pulse duration\
  \ algorithm`（脉冲持续时间算法），获得了包括摆动期、支撑期以及步时间的各种时间特征。`PD` 最常见的症状是`Tremors`（震颤），由于身体部位的不自主运动引起。首先，震颤出现在特定的身体部位，如腿、手臂或身体的一侧，此外它可以扩散到身体两侧。`PD`\
  \ 的特征体象是`resting tremor`（静止震颤），通过`Gait analysis`诊断 `PD` 的平均准确率达到`92.7%`，并通过震颤分析可以了解`Severity\
  \ of PD`（帕金森病的严重程度） [7]。\n\n### 17.1.3 帕金森病：治疗与手术方法\n\n疾病阶段的测量以及严重程度的定量、重复和可靠性是改善\
  \ `PD` 治疗和监测的关键要求。在过去 50 年的 `PD` 研究中，经验性和主观评分主要由人类对就诊期间疾病体象和症状的表现进行控制。最近，开发了“可穿戴”、基于传感器的、标准的、目的明确且易用的系统，用于对大量参与者进行长时间的\
  \ `PD` 体象测量。这项能够显著改善 `PD` 的诊断、管理以及临床研究的开展。尽管如此，这些可穿戴传感器收集的大规模、高维数据需要复杂的信号处理和机器学习算法，将其转化为科学的算法和具有临床意义的数据。这些从数据中“读取”信息的程序在预测目前需要人类专业知识的复杂问题方面取得了惊人的成功，但人们在缺乏底层逻辑基础知识的情况下被迫进行评估和提交\
  \ [8]。\n\n对于帕金森病（`PD`）的治疗，建立的疗法是`deep brain stimulation`（深部刺激，`DBS`）。`DBS` 是一项性手术。临床决策支持系统（`CDSS`）依赖`machine\
  \ learning`来帮助治疗 [9]。\n\n### 17.2 文献回顾\n\n为了降低 `PD` 的进展速度，使用`EEG Electro-encephalography`（脑电图）来识别健康个体。过去已使用了`machine\
  \ learning`。在本章中，我们将 `PD` 分为三个部分：\n\n1. 预处理技术\n2. 分类方法\n3. 计算计算方法\n\n#### a) 预处理技术\n\
  \nYadav *等人* [10] 报告了三种方法，即`Decision stump`（决策树）、`Logistic Regression`（逻辑回归）和`Sequential\
  \ Minimization`序列最小化）。其中，准确率为`76%`，灵敏度为`0.62`。\n\nBonato *等人* [11] 建议`data mining`（数据挖掘）和`artificial\
  \ intelligence`（人工智能）有助于识别 `PD` 的严重程度。他们使用`ACC`（加速度计）和`EMG`（肌电图）收集数据。\n\nSonu *等人*\
  \ [12] 实现了一个`JavaScript`程序来记录声音，随后使用`Praat`将输入转换为 `.wav` 文件。`Decision tree`（决策树）在没有特征选择的情况下产生了最佳结果，准确率`100%`，有特征选择的情况下为`94%`。\n\
  \n#### b) 分类方法\n\nChalla *等人* [13] 讨论了非运动系统的的重要性。该研究使用了四种机器学习技术，即`Multilayer Perceptron`（多层感知机）、`Bayes\
  \ Net`贝叶斯网络、`RF`（随机森林）和`Boosted Logistic Regression`提升逻辑回归）。还考虑了睡眠行为、嗅觉丧失和快速眼动（`REM`）。其中，`Boosted\
  \ logistic regression`的准确率为`97.159%`，ROC 曲线下面积为`98.9%`。\n\nAgarwal *等人* [14] 报告了`extreme\
  \ learning machines`（极端学习机，`ELM`）预测 `PD`。他们使用`ELM`进行了对比分析并得出结论：与传统的`Neural Network`（神经网络）不同，`elms`不需要对隐藏神经进行迭代。\n\
  \nDinesh 和 He [15] 发现在所有语音录音应用中，基频是预测帕金森病的最佳特征，他们还在 Microsoft Azure Learning Studio\
  \ 上测试了不同的机器学习方法，包括`Boosted Decision Tree`（提升决策树）、`Decision Jungle`（决策丛）、`Locally\
  \ Deep SVM`局部深度支持向量机、`Logistic Regression`逻辑回归、`Neural Networks`神经网络以及`SVM`支持向量机，其中`双分类提升决策树`作为集成技术效果最好。\n\
  \nFiscon *等人* [16] 使用`EEG Electro-encephalography`（脑电图）诊断大脑异常。研究人员使用`time-frequency\
  \ transforms`时频变换进行预处理，然后使用`machine learning`进行分类。\n\nRodrigues *等人* [17] 使用`K-mean`获取临时事件（`EEG`）以改进\
  \ `PD`的诊断。他们获得了`AD`患者常见的`EEG`能量变化序列，其频率比任何健康个体都高。\n\n\n\n\n\nNovoa-Del-Toro *et\
  \ al.* \\[18\\] 发现阿尔茨海默病在大脑某些区域存在体积缩小现象。某些区域（如前楔叶）在通过 `MRI`（磁共振成像）测试时开始显示变化。因此，在他们的研究中，利用机器学习方法，将前楔叶作为生物标志物来识别大脑的缺陷。\n\
  \nJohnstone *et al.* \\[19\\] 从 `ADNI`（阿尔茨海默病影像倡议）获取了血浆蛋白组数据集。应用了特征选择等组合优化方法。因此，根据是否包含\
  \ `APOE` 或是否存在其他考虑因素，区分了 MCI（轻度认知障碍）患者和 AD（阿尔茨海默病）患者。最后，通过生成纵向签名，他们获得了 90%的准确率。\n\
  \nRathore and Kumar \\[30\\] 主要在各种机器学习技术中使用回归技术。错误率在比较 ML 技术（即 `AAE` 和 `ARE`）后确定。为了确认结果，应用了\
  \ `K fold` 验证。最后，使用 `Kruskal–Wallis test` 和 `Dunn’s multiple comparison test` 对技术进行比较分析。Tiwari\
  \ \\[20\\] 提出了最小冗余最大相关性特征选择程序，以选择能够单独预测帕金森病的最重要特征。他发现 `random forest` 获得了 90.3%的总体准确率，优于其他专注于机器学习的方法，如旋转森林、装袋法、支持向量机、随机子空间等。\n\
  \nManmoshina *et al.* \\[21\\] 使用深度学习反映他的工作，因为他认为这与传统的学习特征不同。通过多个隐藏层，他利用深度学习提供有意义且更高抽象的水平。他阐述了三步法：(i)\
  \ 从对原始数据进行预处理开始，解决缺失值、数据质量和离群值等主要问题；(ii) 第二步是应用无监督深度学习以产生更高层次的输入数据抽象；(iii) 最后，使用监督学习方法进行目标值预测和模型评估。在监督学习之前使用无监督学习有助于作者实现高预测值准确率，因为所有\
  \ ML 技术都依赖于特征的表征和提取。\n\n## c) 不同的计算方法\n\n生物信息学在神经退行性疾病的诊断方面每天都在发展，许多科学家现在被这一科学分支所吸引，因为生物信息学研究个人的营养、健康和环境等生物学方面。流行的疾病之一是神经系统疾病，近年来增长非常显著。因此，在分析了所有疾病后，我们发现许多研究人员使用了不同的技术将神经系统疾病（ND）患者与稳定/健康人群区分来。使用的技术包括大数据处理、虚拟现实、面部和情感识别、手写体识别以及人工智能。\n\
  \n### 17.2.1 用于帕金森数据的机器学习算法\n\n为了对帕金森数据进行准确诊断和早期检测，Nalls *et al.* \\[22\\] 使用了来自帕金森进展标志物倡议（`PPMI`）的纵向数据。对于研究人员和临床实践来说，这项研究具有巨大的优势。他们的目标是创建一个用于诊断帕金森病的准确系统。该研究在帕金森进展标志物倡议（`PPMI`）数据集上显示，包含\
  \ 367 名 PD 患者的表型成像数据和 165 名无神经疾病的对照组。`logistic regression` 分类模型将嗅觉作用、遗传风险、帕金森病家族史、年龄和性别作为关键特征。研究样本包含\
  \ 825 名受试者（8 名帕金森病患者和 261 名对照者），来自五个独立队列的特定选择方法和模型。数据收集自疾病标志物计划（`PDBP`）、帕金森相关风险研究（`PARS`）、`23andMe`、PD\
  \ 纵向和生物标志物研究（`LABS-PD`）以及 Morris K Udall 帕金森卓越研究中心（`Penn-Udall`）。该模型还使用了无多巴胺缺乏证据（`SWEDD`）的影像扫描患者进行调查。在这一模型中被确定为患有帕金森病的\
  \ 17 名 `SWEDD` 参与者中有 4 人在一年内转变为真正的帕金森病。该模型提供了一种区分帕金森病患者与对照组的潜在新方法。这项研究在未来还有潜力识别可能队列中的前驱期或临床前帕金森病个体，这可能有助于生物标志物的识别。\n\
  \n这项工作还需要扩展到具有高精度分类系统的图像文件。Dinov *et al.* \\[23\\] 详细研究了 `LONI Pipeline`。`LONI pipeline`\
  \ 是一个用于神经影像高级数据分析的图形化环境。`LONI pipeline` 允许神经影像分析的构建、验证和实现。`LONI` 拥有一个计算机工具库，允许数据格式自动转换。`LONI\
  \ Pipeline` 在图形分析方面优于其他工作流架构。`LONI` 是用于网格计算的分布式环境。`LONI environment` 的关键特征是高效的工具集成、协议验证和用于神经影像的新算法。在\
  \ `LONI pipeline` 环境中纳入现有数据和计算工具既直观又简单。基于数据库基础设施，`LONI pipeline` 有几种形式的应用提交。`LONI\
  \ pipeline` 在计算方面是紧凑、有效、分布式且独立的。在流水线数据分析工作流中，单个二进制进程不会影响 `LONI pipeline` 的性能。高级计算算法对脑结构和功能进行了定量制图。`LONI`\
  \ 已经开发了具有脑结构和功能定量制图的复杂计算机算法。这项工作专注于阿尔茨海默病的证据，并应用于帕金森病的神经影像。\n\nChen *et al.* \\\
  [24\\] 研究了另一种用于帕金森病（PD）诊断的有效高效的算法：模糊 k 近邻算法（`FKNN`）。基于 `FKNN` 的建议系统与基于支持向量机（`SVM`）的方法进行了对比。主成分分析被进一步提高\
  \ PD 检测的诊断准确性。实验结果表明，文献中基于 `KNN` 的系统远优于基于 `SVM` 的方法。10 折 `FKNN` 交叉验证准确率为 96.07%。非常有前景的是，所提出的系统可以作为\
  \ PD 的强大诊断工具。\n\nRamentol *et al.* \\[25\\] 报告不平衡数据是分类中最常见的问题。这一现象很重要，因为数据在实践中是不平衡的。监督学习已经开发了许多技术来处理不平衡的训练集。这些方法分为大类：算法级和数据级。数据级侧重于通过移除较大类的样本或为较小类构建新样本来平衡训练集，也称为欠采样和过采样。\n\
  \n\n\n\n多种机器学习算法如 `C4.5`、`k-Means`、`Apriori`、`EM`、`PageRank`、`AdaBoost`、`kNN`、`Naive\
  \ Bayes` 和 `CART` 已应用于不同的帕金森数据集。这些是由 IEEE 国际数据挖掘会议（ICDM）识别的数据挖掘前 10 大算法`[26]`。作为最强大且影响力的分析模型，数据挖掘研究社区非常重视这前\
  \ 10 种算法。这 10 种算法涵盖了分类、聚类、统计学习、关联分析和链接挖掘。\n\n应当审查在帕金森数据上表现的前 10 种数据挖掘算法的质量。一种自动机器学习技术旨在通过分析人的言语/声音来检测帕金森病`[31]`。在分析中，使用`fuzzy\
  \ C-means`聚类算法对帕金森病进行分类，其准确性为 68.04%，特异性为 45.83%，敏感性为 75.34%。该研究通过实施提升算法和主要数据简化要素分析得到了扩展。为了计算排名，研究人员还研究并执行了功能显著性分析。`UPDRS`（统一帕金森病评分量表）对正确诊断帕金森病具有重要影响。通过使用五种不同的分类范式和封装器特征选择方案，进行了进一步改进，可以预测\
  \ 772–92 范围内的每个类变量，估计准确率达到`[6]`。此外还提出了 `SVM` 和 `k-Nearest Neighbor`（`k-NN`）。定期监测\
  \ PD 患者以记录他们的声音。在 11 种机器学习算法中，年龄、性别、基线处、三个月后和六个月后的声音录音被用作特征。`Support Vector Machine`\
  \ 检测到患者 `UPDRS` 评分显著恶化。`random forest` 选择和 `support vector machine` 特征选择过程增加了区分\
  \ `PD` 与健康对照组的准确性。仅十个构音障碍特征就实现了 99% 的分类准确率。对于大型数据集，他们还建议了一种非线性信号方法。\n\n为了确定帕金森病，许多研究人员对数据子集工作。在上述论文中，考虑分析的数据仅限于一个数据子集，例如语音数据集和步态数据集。在帕金森病进展标记计划（`PPMI`）中，来自多个来源的复杂、异构且不完整的数据经过清洗、策展、协调，并在帕金森病进展标记计划（`PPMI`）中实施了各种机器学习分类算法`[28]`。该研究不仅关注距离\
  \ `Fuzzy K` 最近的邻居，还关注其他分类技术。这篇研究论文比较了 `PPMI` 数据集的基于模型和无模型的分类技术，并表明 `PD`（帕金森病）和 `HC`（健康对照）组的认知评分存在显著差异。在使用重新平衡的数据时，分类效果显著提高。\n\
  \n### 17.2.2 可视化\n\n在了解帕金森数据中包含的不同研究类型后，尝试利用其他疾病的大数据技术来理解最新研究，也有助于帕金森实施这些经过充分证明的想法。卵巢癌诊断非常复杂且昂贵\
  \ `[34]`。（注：原文此处存在大量重复句子，已根据核心内容进行处理）。\n\n\n\n特征选择是指（手动或自动）特征的过程，旨在选出对预测或分类贡献最大的特征。具有高相关性的特征表示数据集中存在冗余。在数据集中，`Jitter\
  \ (%)` 和 `Jitter (Abs)` 特征是根据音高周期序列设计的，用于测量这些周期之间的平均绝对时间差。由于存在高相关性，只有一个特征对分类的贡献更大。因此，对所有特征进行了系统性检查。在具有高相关（即相关系数大于\
  \ 95%）的特征中，删除了其中一个特征并构建了最终的特征向量。从 24 个特征中提取了 11 个特征来执行分类。\n\n### 17.3.4 分类\n\n分类是寻找给定数据点目标的任务。这是一种监督学习方法，通过训练数据训练算法，然后使用训练好的模型对新数据进行分类。分类有多种不同的方法，如感知机、逻辑回归、`SVM`、决策树等。在这里使用了四个模型并对它们的结果进行了比较。\n\
  \n#### 17.3.4.1 逻辑回归\n\n这是一种预测分析方法，使用了概率理论。它接受任何实数作为输入并将其映射到 0 到 1 之间。函数的输出是 S 型曲线。为了进行预测，使用了\
  \ sigmoid 激活函数。\n\n![image](img/c17_Inline_13_11.jpg)\n\n#### 17.3.4.2 K 近邻算法 (KNN)\n\
  \n这是一种监督学习算法，同时用于分类和回归任务。它是最简单且易于实现的。它基于相似性概念，即相似的实体出现在距离的位置。\n\n#### 17.3.4.3 支持向量机\
  \ (SVM)\n\n这是一种分离超平面描述的分类器。它通过从训练数据中学习，返回一个最优超平面以划分未见的数据。\n\n### 17.3.4.4 决策树\n\n\
  这是一种非参数监督算法，广泛用于数据分类。其目的是建立一个模型，通过考虑从训练数据中学到的决策规则来寻找目标值。\n\n### 17.3.5 训练数据和测试数据\n\
  \n完整数据集包含 195 条记录。数据集分为两个部分，即训练数据和测试数据，比例为 70:30。\n\n分类器评估：所有模型都在相同的数据集上进行训练和测试。在测试数据上评估训练后的模型并计算准确率。表\
  \ 17.1 显示了不同模型在准确率方面的比较。\n\n### 17.3.6 推荐系统\n\n在检测人员是否患有帕金森病（PD）后，根据症状为患者推荐食物和药物。表\
  \ 17.2 显示了基于症状的推荐诊断方案。表 17.3 显示了针对帕金森病的推荐药物。表 17.4 显示了针对帕金森病非运动症状的建议。\n\n对 PD 患者的某些常见建议：\n\
  \n1. 左旋多巴是治疗 PD 症状的药物治疗方法，特别是针对僵硬和运动迟缓。\n\n**表 17.1** 不同分类器的比较。\n\n| **分类器** ||\
