  \ 2, 1–10, 2014.\n\n\n\n\n协同过滤推荐系统向用户推荐过去与其品味相似的人群所喜欢的物品。它试图为给定的查询用户寻找同类，并尝试推荐这些同类用户过去喜欢的物品。通常使用相似性和相关性等各种指标来寻找与给定查询用户的同类。\n\
  \n### 协同算法分类\n协同算法可以分为基于内存（memory-based）和基于模型（model-based）的算法。基于内存的算法基本上基于考虑同类用户过去喜欢的物品来对物品进行评分预测\
  \ [1] [2]。基于内存的算法并不总是快速且具有可扩展性的，可以被基于模型的算法所取代。在基于模型的算法中，根据历史信息设计一个模型并用于推荐目的。\n\n\
  ### 基于内容的推荐系统\n基于内容的推荐系统通过寻找与查询用户过去喜爱的物品相似的物品来推荐物品。基于内容的方法基于信息检索和信息过滤的概念。诸如 `TF–IDF`（词频-逆文档频率）等各种指标可以用于基于内容的方法。\n\
  \n### 推荐系统中的机器学习\n机器学习算法被分为许多子类，如图 20.3 所示。尽管可以根据用户的兴趣向其推荐相关产品，但可以使用不同的技术开发有效的推荐系统以增强这些系统的能力。不同的研究人员发现，贝叶斯算法和决策树算法由于其复杂度较低，常用于推荐系统。\n\
  \n### 其他推荐类型\n推荐系统的另外两种类型是混合式、基于知识的和人口统计学推荐系统。\n\n- **混合式 (Hybrid)**：混合推荐结合了协同推荐和基于内容的推荐系统功能。不同的研究人员表明，混合推荐系统的性能优于传统的协同和基于内容的推荐系统。\n\
  - **基于知识 (Knowledge-based)**：基于知识的推荐系统不需要评分数据。系统根据其知识库生成推荐列表。基于知识的系统可以分为基于案例（case-based）系统或基于约束（constraint-based）系统。基于案例和约束的系统利用知识的方式有所不同。\n\
  - **人口统计学 (Demographic)**：人口统计学推荐基于根据年龄、性别、国籍、地区等人口统计学参数被认为相似的用户所提供的信息。\n\n![Figure\
  \ 20.3 Machine learning algorithms.](img/c20_image_4_1.jpg)\n\n**图 20.3** 机器学习算法。\n\
  \n## 20.2 文献综述\n\n\n\n\n推荐系统帮助用户根据其个人兴趣选择产品。文献综述涵盖了农业农业的各种推荐系统，以及各种基于树和基于模糊逻辑的机器学习方法。提出了一种名为\
  \ `Agro Consultant` 的智能系统，旨在帮助印度农民根据播种季节、土壤特性、农场地理位置以及温度和降水量等环境因素，对作物选择做出明智的决策 [3]。提出了一种基于\
  \ Hadoop 的农产品电商推荐系统，该系统通过分布式计算分析用户行为数据，发现他们的兴趣并为其提供个性化的推荐服务 [4]。提出了一种使用滑动窗口非线性回归技术的推荐系统，通过分析降雨量、天气、市场价格、土地面积和过去的作物产量，来预测作物产量以及农民能从其土地上获得的价格\
  \ [5]。提出了一种基于模糊逻辑的协作推荐系统，通过考虑农民的位置以及该地区的温度、湿度和降水量等环境因素，预测作物产量，为农民提供初步想法 [6]。提出了一种利用数据挖掘技术的农业推荐系统，该系统通过理解土壤和气候状况，帮助农民在剧烈变化的气候条件下选择特定作物\
  \ [7]。提出了一种基于用户的协作推荐系统，通过从经验丰富的农民、农业研究人员和其他利益相关者处收集土壤和天气状况等数据，来预测合适的作物 [8]。精准农业在克服印度农民面临的困难方面发挥着重要作用。提出了一种动态归一化正态树推荐框架，使用复杂的本体论和大量的论文来建议研究论文\
  \ [9]。决策树具有捕捉推荐过程所需的动态方面的能力。提出了一种使用最流行采样（`MPS`）和矩阵分解方法的基于决策树的推荐系统 [10]。基于模糊家族族树的推荐系统根据在线用户阅读的各种关键概念的最高排名，在预期评分之间进行推荐。根据用户关键概念评分（`UKCR`）矩阵，评估预期评分并按照语义和内容相似性对邻居进行排序\
  \ [11]。提出了一种使用知识树的混合推荐系统，考虑了教学的五个模块，它帮助教师和学生在技术增强学习（`TEL`）中找到有用的教学资源 [12]。提出了一种使用神经模糊决策树（`NFDT`）方法的多类型电影推荐系统框架，该系统根据用户提供的查询和配置，按偏好递减的顺序推荐电影\
  \ [13]。（注：原文中此处存在多次重复，译文已保持逻辑流畅）。\n\n[13]（等等，我看到原文中存在一些重复，我将保持独特的流向）。\n\n[13] 提出了一种使用神经模糊决策树（`NFDT`）方法的多类型电影推荐系统框架，该系统根据用户提供的查询和配置，按偏好递减的顺序推荐电影\
  \ [13]。提出了一种基于数据挖掘技术的推荐系统，根据位置改进作物产量 [14]。根据用户的预期、土壤和天气状况，提出了一种使用数据过滤的推荐系统 [15]。机器学习在增强推荐系统方面也起着关键作用。提出了一种使用支持机和神经网络通过多数投票建议作物的精准农业推荐框架\
  \ [16]。随机森林是向用户推荐物品的重要工具。提出替代框架 [17]。随机森林对于数据集提供了更好的结果，并且随着实例数量的增加，正确分类的实例百分比也会增加\
  \ [18]。提出了一种新的随机回归变体，为理论学家分析不同简化的相对重要性提供了见解 [19]。随机森林可以在没有预设的情况下识别相互作用和非线性。当预测变量多于观测值时，它们也可以用于许多相关预测变量\
  \ [20]。产量取决于土壤特性。使用 `Naive Bayes` 和 `KNN` 等机器学习算法根据土壤检测识别作物类型。使用支持机、主成分分析等各种分类技术创建了一个模型来建议作物类型和农药\
  \ [21]。在农业中，分析了土壤特性、土壤类型、作物产量数据等各种生物和非生物因素，并根据场地参数建议了正确的作物。推荐系统通过使用 `Random tree`、`CHAID`、`K-Nearest\
  \ Neighbor` 和 `Naive Bayes` 的集成模型设计，针对场地参数以高准确性和效率推荐作物 [22]。实施农业数据挖掘和可视化数据挖掘技术，将高维农业信息减少到较小尺寸，以获得与产量和肥料、农药投入相关的有用。自组织映射和多维缩放（`Sammon’s\
  \ mapping`）等不同技术本质上被用于数据降维。这表明自组织映射适用于大型数据集，而 `Sammon’s mapping` 适用于小型数据集 [23]。提出了一种基于\
  \ `SVM` 分类和逻辑回归的推荐系统，用于预测最佳作物和害虫以及害防治技术 [24]。提出了一种农业推荐系统 `RSF`，根据农生态和农气候数据，根据农民的位置推荐合适的作物\
  \ [25]。\n\n\n\n农业在发展中国家的经济中发挥着至关重要的作用，并为农村人口提供了食物、收入和就业的主要来源。在过去的几十年里，印度农业取得了显著发展。超过\
  \ 70%的农村家庭依赖农业。奥里萨邦（Odisha）作为印度的一个邦，也是一个农业经济体，贡献了地区生产总值（NSDP）的近 30%，拥有 73%的农业劳动力。但奥里萨的大多数农民仍然遵循传统的耕作方式，对特定作物可用的新型农药、肥料和新工具并不了解。由于这些原因，他们有时会在农业中遭受损失，这反过来很大地影响了我们的社会。在研究中，我们提出了一种推荐系统，可以为农民感兴趣的特定作物推荐相应的农药和工具。它还会根据土壤测试特征推荐适合农民地理位置的其他作物的种子。\n\
  \n## 20.4 问题定义\n\n所提系统以用户的位置和作物偏好作为输入，并输出该作物的农药和工具的建议列表。它还会推荐适合农民地理位置的其他作物的种子。\n\
  \n## 20.5 方法论\n\n在本研究中，我们使用了问卷法。首先向受访者发放了问卷。共有四百人参与了这项研究。310 名男性和 90 名女性（平均年龄为`M[age]\
  \ = 35.4 years`，`F[age] = 32.5 years`）参与了这项研究。所有受访者均来自印度奥里萨邦南部。所提系统以用户的位置和作物偏好作为输入，并构建一棵斜二叉树。我们将这种斜树命名为`similarity\
  \ tree`（相似性树），因为我们使用它进行相似性计算。所提模型如图图 20.6 所示。`similarity tree`用于寻找与活跃查询农民相似的农民。`similarity\
  \ tree`的结构及其可能的节点如图图 20.4 所示。农民所属的国家名称是`similarity tree`的根节点。邦（`ST[1]`, `ST[2]`,\
  \ `ST[3],…STn`）是国家的直接兄弟节点，地点（`PL[1]`, `PL[2],…PL[m]`）是邦的直接兄弟节点，种子（`S 1`, `S 2,…Sp`）是地点的直接兄弟节点，农药（`P1`）和工具（`I1`）是种子的直接兄弟节点。因此，对于给定的输入活跃查询农民，将根据上述层次结构构建一个`similarity\
  \ tree`。获取该农民对应的前序遍历。还对数据库用户及其相应的`similarity trees`和对应的前序遍历进行了评估。通过比较活跃查询农民的前序遍历与数据库用户的前序遍历，计算出与活跃查询农民相似的用户。其前序遍历与活跃用户前序遍历匹配的数据库用户被假设为相似用户。如果数据库用户的前序遍历与活跃查询农民匹配，则该数据库用户的相似性值被设置为\
  \ 1。例如，一个给定的活跃查询农民属于印度，邦是奥里萨邦，地点是贾杰普尔（Jajpur），他给出的作物偏好是水稻，系统就会为该用户构建`similarity\
  \ tree`。\n\n该活跃查询用户的`similarity tree`如图图 20.6 所示。\n\n## 20.6 结果与讨论\n\n### 20.6.1\
  \ 性能\n\n所提系统的性能根据精确率、准确率、召回率和 F1 分数进行了评估。结果如图图 20.7 和图 20.8 所示。\n\n## 20.7 结论与未来工作\n\
  \n\n\n\n推荐系统是一种通过分析用户过去的历史偏好来预测其需求的软件解决方案。推荐系统已经在几乎所有领域都展示了其有效性。但对于像印度这样经济大部分程度上依赖农业的国家来说，需要高效的推荐系统来帮助农民应对环境中的气候变化，并让他们了解可用的新型农药和仪器，这些工具可以帮助他们提高作物产量。本文建议农民根据自身需求为特定作物选择农药和先进设备。它还推荐了一些适合农民所在地理位置的其他作物。所提出的方法使用树相似性技术，根据给定的查询用户寻找相似的用户或农民。与其他相似性度量相比，该方法在时间上效率更高。该系统的效率通过精确率（precision）、准确率（accuracy）和正性预测值（PPV）进行了衡量。该研究有一个局限性，因为它仅考虑了奥里萨邦作为地理区域。未来，我们可能还会考虑作物生产的技术适配以及其他地理区域。深度神经网络是另一种强大的机器学习技术，可以增强农业推荐系统的能力，并且基本上适用于大型数据集。堆叠自动编码器（Stacked\
  \ auto-encoders）可用于通过小型数据集预训练深度神经网络，并优化初始权重。深度神经网络模型展现出比浅层神经网络和支持向量机更好的泛化性能。\n\n\
