  \n## 15.6 结论与未来方向\n\n在本章中，提出了一种基于物联网区块链网络并带有认知框架的信任推荐系统。在认知处理层，认知引擎观察来自设备管理层的所有物联网设备的状态。之后，认知引擎作用于执行器和传感器以触发正确的智能合约列表。任何类型加密货币的支付过程都使用了点对点网络通信协议。还研究并应用了一个购物中心的示例系统。所提出的章节也与其他工作的现有功能进行了对比。根据对其他工作的研究，发现该推荐系统工作具有新颖性。在未来，可以在提出的章节中使用物模型技术。\n\
