  \n## 5.3 方法论\n\n多种机器学习算法已土壤数据的分析。机器学习算法涉及一个学习过程，其目标是从训练中学习以执行特定任务。学习过程结束后，训练好的模型可以使用训练过程中获得的经验对测试数据进行分类、预测或聚类。训练数据由一组属性描述，这些属性也称为特征或变量。特征可以是定名的（枚举）、二元的（即\
  \ 0 或 1）、序数的（A+ 或 B−）或数值的（整数、实数等）。机器学习任务通常根据学习类型（监督/无监督）、学习模型（分类、回归、聚类和降维）或实现所选任务所采用的学习模型分为不同的大类。\n\
  \n机器学习任务根据学习系统的学习信号分为两个主要类，即监督学习和无监督学习。在监督学习中，数据以示例输入和相应输出的形式呈现，其目标是构建一个将输入映射到输出的通用规则。在某些情况下，输入可能部分可用，某些目标输出缺失或仅作为动态环境中操作的反馈（强化学习）。在监督设置中，获取的专业知识（训练模型）被用于预测测试数据缺失的输出（标签）。\n\
  \n然而，在无监督学习中，训练集和测试集没有区别，数据是非标记的。学习者处理输入数据的目标是发现隐藏模式。该方法的特点是来自农场收集的土壤数据、农业专家提供的作物、通过土壤测试实验室数据集实现的土壤等参数。将土壤测试数据提供给推荐系统，它将使用收集的数据并进行集成模型和其他基于机器学习的方法，为特定区域参数推荐具有高准确性和效率的作物。与农业相关的各种方法可以为农民的问题提供解决方案，但它们大多为农民提供通用解决方案。此外，有时它们只处理农业的一个或两个组成。因此，我们正尝试将这些整个组件整合为一个，并为农民提供详细且计划好的解决方案，整合实践方案包。在此应用程序中，农民将获得从田间准备到其预测产量的实时信息。\n\
  \n应用于数据集的各种机器学习算法如下：[9]，同时还提出了大量的提升（boosting）和装（bagging）实现，例如提升技术 [10]、adaboost\
  \ [11]以及自助聚合或 bagging 算法 [12]。树结构的每个内部节点代表对所选特征的不同的成对比较，而每个分支代表这种比较的结果。叶节点代表遵循从根到叶路径后采取的最终决策或预测（表示为分类规则）。该类别中最常见的学习算法是分类和回归树\
  \ [6]、卡方自动交互检测器 [7]以及迭代二分器 [8]。主要重点是生成准确的模型并提供有用的建议。\n\n1. **朴素贝叶斯 (Naïve Bayes)**：这种分类常用于根据词序列、关系以及词的多项式分布中的其他假设对文档进行分类。这种监督学习是从概率角度进行研究的，被认为是在给定测试示例下估计类别后验概率。贝叶斯模型（BM）是一类概率图模型，在贝叶斯推断的背景下进行分析。这类模型属于监督学习类别，可用于解决分类或回归问题。朴素贝叶斯\
  \ [1]、高斯朴素贝叶斯、多项式朴素贝叶斯、贝叶斯网络 [2]、高斯混合模型 [3]以及贝叶斯信念网络 [4] 是文献中一些著名的算法。\n\n2. **贝叶斯网络\
  \ (Bayes Net)**：它是一种使用贝叶斯推断进行概率计算的图模型。它通过有向无环图的边建模条件依赖。每个边对应一个条件依赖，每个节点对应一个唯一的随机变量。这些变量相对于后代是独立的。\n\
  \n3. **逻辑回归**：它使用逻辑函数测量某一类的概率。二元逻辑模型具有两个可能的因变量（0 和 1）。逻辑模型的基本特征是增加自变量会以恒定速率增加几率。\n\
  \n4. **多层感知器 (Multilayer Perceptron)**：它是一种前馈人工神经网络。它由至少三层节点组成。包括输入层、隐藏层和输出层的节点。除了输入节点外，每个节点都使用激活函数进行训练。它最终区分非线性可分的数据。\n\
  \n5. **随机森林 (Random Forest)**：正如名称所示，这种监督分类算法通过创建许多决策树形成森林。森林中的树越多，森林越稳健。同样，决策树的数量越多，结果的准确性越高。\n\
  \n因此，这是一种通过构建受控方差的决策树来实现分类集成学习方法。集成学习（EL）模型旨在通过构建简单基学习器的线性组合来改进给定统计学习或模型拟合技术的预测性能。考虑到每个训练好的集成代表一个单一假设，这些多分类系统允许杂化并非同一基学习器引发的假设，从而在单个模型之间存在显著差异的情况下产生更好的结果。决策树是以树状结构构建的分类或回归模型\
  \ [5]。决策树通常被用作集成学习模型中的基学习器，例如随机森林。\n\n\n\n\n\n我们原计划使用来自各种土壤调查的数据，并开发机器学习模型来回答农民提出的不同问题。我们维护着一个数据库，其中存储了不同调查的累积数据，并在这些数据上执行机器学习算法。我们要解决的问题是一个分类任务，目标是预测个体的健康状况。所考虑的数据集包含\
  \ 12 个参数，即 N、P、K（宏量元素）；S（中量元素）；Zn、Fe、Cu、Mn、Bo（微量元素）；以及 pH、EC、OC（物理参数）、温度和产量等属性，并对土壤样本的健康设置了某些标签。该数据集收集自农民\
  \ SHC。\n\n使用多种机器学习（ML）算法从数据集中训练机器。对不同机器学习算法（如朴素贝叶斯、贝叶斯网络、逻辑回归、多层感知器（MLP）和随机森林）的性能基于加权\
  \ ROC（WtROC）、真阳性（TP）、假阳性（FP）、精确率（Precision）和召回率（Recall）进行了衡量。以下是对应于表 5.1 中不同算法的数值。\n\
  \n通过对表 5.1 中的数值绘制图表，对输出结果进行了比较和分析。\n\n从图 5.4 可以得出结论：在不同的性能指标方面，随机森林在所有算法中处于领先地位。随机森林模型实现了\
  \ 1.0 ROC，这说明其相对于假阳性具有最高的真阳性率。与其他算法相比，该算法具有最高的召回率和精确率值，反映了结果的准确性。因此，可以得出结论：随机森林对于输入的土壤数据集分类具有最高的敏感性。与其他算法相比，该算法最适用于土壤数据的分类。特征重要性可以通过告诉我们哪些变量在类别之间最具区分度，从而让我们对问题产生洞察。这提高了正确选择机器学习算法的准确率，将提供更好的建议，从而提高生产力。\n\
