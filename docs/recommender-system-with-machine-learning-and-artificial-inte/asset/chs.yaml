  \ SVM | 69.4% |\n| 决策树 | 81.3% |\n\n**表 17.2** 基于症状的推荐诊断。\n\n| **症状** || **诊断**\
  \ |\n| --- | --- |\n| 僵硬 | 特发性帕金森病 |\n| --- | --- |\n| 震颤 | 药物发性帕金森病 |\n| --- |\
  \ 血管性帕金森病 |\n| 运动困难 | 帕金森病 |\n| --- | --- |\n| 垂直眼运动 | 多系统性帕金森综合症 |\n| 垂直眼 | | 帕金森脑萎综合\
