  \n## Note\n\n1. [c18.xhtml#R_c18-0001] *通讯作者*: psvivu67@gmail.com\n\n# 19 图正则化：情感分类\n\
  \n**R.S.M. Lakshmi Patibandla**\n\n*Vignan's Foundation for Science, Technology\
  \ and Research, AP, India 助理教授*\n\n***摘要***\n深度学习推荐系统在过去几年得到了全面的研究。然而，预期的海量数据为研究人员和专家带来了巨大的挑战。虽然部分文档提供了源代码，但它们采用了不同的软件设计或不同的深度学习包，这进一步提高了门槛。获取图像的细粒度语义对于图像搜索和聚类等任务是一项令人兴奋且重要的工作。在本文，第一部分介绍了神经网络，第二部分涉及神经结构化学习，第三部分包含某些神经网络模型，第四部分根据监督比例对比基模型和图正则化的结果。\n\
  \n***关键词:*** 图，数据集，准确率\n\n## 19.1 引言\n\n推荐系统的任务是根据用户的历史行为生成符合其偏好的推荐列表。协同过滤（`CF`）是一种极其流行方法，它通过利用所有用户的集体智慧产生用户推荐。许多建立的协同过滤推荐过程已经在多个领域证明了有效性并得到了应用。基于模型的协同过滤系统的核心是吸收用户和物品的多维表示，这些是任何明确的用户关联，如排名或内在观点。\n\
  \n社交网络中的机器学习应用于从指令计划到关系认可的各个领域是至关重要的。目前该领域的主要挑战在于寻找一种方法来概括、或者扰乱图结构，以便这些结构能够被机器学习模拟所征服。传统上，机器学习方法定义启发式方法来提取图的本质结构，例如度数统计或核函数。然而，目前的进展观察到了一种增长趋势，即自动获取附属于低维嵌入的图结构，这些嵌入是通过深度学习连续的非线性降维实现的。本文对图学习在这一领域的基础扩展提供了实质性的概述，包含了基于矩阵分解的系统、基于随机游走的系统以及图卷积神经网络。\n\
  \n\n\nLSTM 是 CNN 模型仅擅长处理单个图像，它将输入像素转换为内部矩阵或向量表示。为了通过一系列图像来处理这项任务，我们需要让 LSTM 能够处理这些核心形式化表示，并利用\
  \ BPTT（随时间反向传播）对输入图像的核心向量表示的结构来更新权重。CNN 在这种情况下，使用一个幸存的预训练经典模型（如 VGG）来提取图像特征是可行的。CNN\
  \ 可能并不专业，并且可能希望通过将误差从 LSTM 反向传播到输入图像的 CNN 模型来训练它。在这两种情况下，抽象来说都是使用一个 CNN 模型和一系列 LSTM\
  \ 模型，每个模型对应一个时间间隔。CNN 模型被应用于每张输入图像，并将每个输入图像的输出作为 LSTM 的独立阶段。通过将整个 CNN 参与封装在一个时间分布层（Time\
  \ Distributed layer）中，该层实现了在多个时期中应用相同的层或多个层。在这种情况下，将不同的序列关联到多个输入阶段，并在标记数据较少的情况下进行适应。\n\
  \n\n\n实验在 Google Colab 上使用 `Tensorflow2.0` 在 IMDB 数据集上进行。该数据集包含了 `IMDB` 数据库中 50,000\
  \ 条电影分析的副本。这些分析被平均分为两部分，其中一部分用于训练，另一部分用于测试。这两组数据都已就绪，意味着它们包含等数量的正面和负面评价。上述数据集与 `Tensor\
  \ Flow` 一起发布。其设备已经过预处理，使得分析内容已转换为整数结构，其中每个整数代表词汇表中的一个精确词汇。训练数据中出现频率最高的 10,000 个争议词汇。低频争议词汇被剔除，以保持词汇范围的实用性。数据集输出是经过预处理的：每个示例都是一个表示电影分析评论的整数数组。每个标签都是\
  \ 0 或 1 的整数值，其中 0 代表负面评价，1 代表正面评价。这项工作通过二分类穷尽分析文本，将电影分析分类为正面或负面，这是机器学习中一种必不可少且广泛的问题类型。\n\
  \n本文中图正则化的使用通过从给定的输入构建图来展示。当输入不包含显式图时，使用 `Neural Structured Learning (NSL)` 框架构建图正则模型的通用技术如下：\n\
  \n*   为输入中的每个文本样本创建嵌入。可以使用预训练模型（如 `word2vec`、`Swivel`、`BERT` 等）完成。\n*   基于这些嵌入，通过相似性度量（例如‘`L2`’距离、`cosine`\
  \ 距离等）构建图。图中的节点代表样本，图中的边对应样本对之间的相似性。\n*   从上述合成的图和样本特征生成训练数据。生成的训练数据除了包含原始节点特征外，还包含邻居特征。\n\
  *   使用 `Keras sequential`、`functional` 或 `subclass` API 创建一个神经网络作为基础模型。\n*   使用\
  \ `NSL` 框架提供的 `Graph Regularization` 包装类封装基础模型，以创建一个新的图 `Keras` 模型。此新模型将图正则化损失作为正则化项包含在其训练目标中。\n\
  *   训练并评估图 `Keras` 模型。\n\n图的构建包括为文本样本形成嵌入，然后利用并行工具关联这些嵌入。首先，形成初始嵌入，使用自定义的 `Swivel`\
  \ 嵌入形成 `TF train` 中的嵌入。例如，输入中每个样本的布局和随后的嵌入将通过代表每个样本 ID 的冗余特征横向存储在 `TF Record` 布局中。这是至关重要的，并允许我们提前与图中相似的节点比较样本嵌入。然后构建图，在拥有样本嵌入后，利用它们形成相似性图，图中的节点将匹配试验，图中的边将匹配节点对之间的关系。\n\
  \n`Neural Structured Learning` 提供了一个图构建工具，可以基于样本嵌入构建图。它自定义了 `cosine similarity`\
  \ 作为相似性度量来关联嵌入并在它们之间形成边。它还允许我们设定一个相似性阈值，该阈值可以被重用以剔除差异较大的边。\n\n\n\n上述示例在输入和输出之间包含双重变换或“隐藏”层，且不包括\
  \ `Embedding` 层。输出的数量（如单元、节点或神经元的数量）决定了该层在类比星系中的规模。换句话说，系统所支持的表示范围取决于其内部描绘的程度。如果一个模型具有许多隐藏单元和/或许多层，那么\
  \ `Infobahn` 将学习到许多多样的表示。相反，这会增加 `Infobahn` 的计算复杂性，并可能导致学习到令人烦恼的模式——这些模式在训练数据上表现良好，但在测试数据上表现糟糕，即过拟合。\n\
  \n示例需要一个损失函数（loss function）和一个优化器进行训练。由于这可能是二分类问题，且模型输出的是概率，因此带有 `sigmoid` 激活函数的单单元层应使用\
  \ `binary cross entropy loss perform`。在训练期间，需要评估模型在之前未接触过的数据上的准确率。之后，通过单独划分部分原始训练数据来构建验证集。在这里，粗略选取\
  \ 10% 的原始训练样本（25,000 个样本的 10%）作为训练的标记数据，其余部分作为验证数据。由于初始的训练/测试划分是 50/50（各 25,000\
  \ 个样本），我们现在的有效训练/验证/测试划分比例为 5/45/50。`train_dataset` 之前已经过批处理和洗牌。现在，以小批量（mini-batches）形式训练模型。在训练过程中，监控模型在验证集上的损失和准确率。注意，训练损失随着每个\
  \ epoch 的减少，而训练准确率随着每个 epoch 的增加。这是因为使用了梯度下降优化算法，它必须在每次迭代中最小化所选的范围，图 19.4。\n\n![图\
  \ 19.4 基础模型的损失与准确率。](img/c19_image_9_3.jpg)\n\n**图 19.4** 基础模型的损失与准确率。\n\n### 19.4.2\
  \ 图正则化\n\n现在准备使用上文构建的基础模型尝试图正则化，并使用 `Neural Structured Learning` 框架提供的 `Graph Regularization`\
  \ 封装类来封装基础 (bi-LSTM) 模型以包含图正则化。训练和评估图正则化模型的其余步骤与基础模型相似。为了评估图正则化的增量收益，需要创建一个新的基础模型实例。这是因为模型已经经过了多次迭代，重用这个训练过的模型来创建图正则化模型对模型来说不是公平的比较。大约有六条目：训练和验证期间的每个审查指标——损失、图损失以及准确率。使用这些指标绘制训练损失、图损失和验证损失进行对比，以及绘制训练和验证准确率。注意，图损失仅在训练期间计算；因此它在验证期间的值将为\
  \ 0 图 19.5。\n\n半监督学习，特别是此处语境下的图正则化，在训练数据量较小时可能非常强大。训练数据的缺乏通过利用训练样本之间的相似性来弥补，而这在传统的监督学习中是不可能实现的。将监督比例（supervision\
  \ ratio）定义为训练样本与总样本数（包括训练、验证和测试样本）的比率。在这里，训练基础模型和图正则化模型的监督比例均为 0.05（即标记数据的 5%），图\
  \ 19.6。\n\n![图 19.5 图正则化的损失与准确率。](img/c19_image_10_5.jpg)\n\n**图 19.5** 图正则化的损失与准确率。\n\
  \n![图 19.6 BiLSTM 模型的损失与准确率。](img/c19_image_11_1.jpg)\n\n**图 19.6** BiLSTM 模型的损失与准确率。\n\
  \n可以观察到，随着监督比例的降低，模型的准确率也会下降。基础模型和图正则化模型都是如此，无论使用何种模型架构。然而，请注意，对于两种架构，图正则化模型的性能都优于基础模型。特别是对于\
  \ Bi-LSTM 模型，当监督比例为 0.01 时，图正则化模型的准确率比基础模型高出 ~20%。这主要是因为图正则化模型使用了半监督学习，除了训练样本本身外，还利用了训练样本之间的结构相似性。\n\
  \n## 19.5 结论\n\n这项工作展示了即使在输入不包含显式图的情况下，使用 `Neural Structured Learning (NSL)` 框架进行图正则化。在这里，我考虑了\
  \ IMDB 评论的情感分类任务，基于评论合成了相似性图。未来这可以应用于不同的数据集。\n\n## References\n\n（参考文献部分未翻译，保留原文格式）\n\
  \n\n\n\n# 20 TSARS：基于树相似性算法的农业推荐系统\n\nMadhusree Kuan¹, Puspanjali Mohapatra¹ 和 Sasmita\
  \ Subhadinee Choudhury²\n¹ 印度布巴内斯瓦尔 IIIT 计算机科学系\n² 印度豪拉赫格 MCKV 工程学院\n\n### 摘要\n\
  随着全球维网的发展，人们越来越多地通过在线应用程序来满足最核心的需求。与此同时，他们用于选择过程的自由时间非常少。因此，寻求推荐系统的协助来解决这一问题变得日益增长，推荐系统成功地为用户提供了各种物品的个性化推荐，减轻了用户的任务。本研究旨在开发一种基于树数据结构的农业推荐系统。所提出的系统（TSARS）根据耕作和农民的位置偏好，在在线购买种子时推荐种子、肥料、农药和工具。它使用树数据结构来存储数据库用户信息。为了为活跃查询的用户寻找相似用户，使用了前序遍历。`TSARS`\
  \ 的性能通过精确率、准确率和正预测值（`PPV`）等不同参数进行衡量。结果表明，与传统的推荐系统相比，`TSARS` 提供了更好的推荐。\n\n**关键词：**\
  \ 推荐系统，协同过滤，树数据结构，精确率，准确率和正预测值（`PPV`）\n\n## 20.1 引言\n在互联网、内网和电子商务系统时代，存在着大量我们几乎无法处理的信息。人们越来越倾向于使用网络应用程序来满足需求，因为它们为选择特定产品提供了更多选项。但同时，用户要从大量的物品池中根据需求选择合适的物品是非常困难的。因此，网络应用程序必须负责提供良好的推荐系统，以在这方面帮助用户。推荐系统是信息过滤系统的子类，它通过准确考虑用户的兴趣和偏好，帮助用户从大量的物品目录中选择正确的特定物品。图\
  \ 20.1 和 图 20.2 分别描述了推荐系统的基本概念和类型。农业是印度经济的支柱，但它仍然遭受着大量的灾害，如气候变化、不可预测的季风或缺风、干旱、洪水、农民向城市寻找更高薪工作的迁移等。为了动力和盈利性农业，需要高效的推荐系统来建议农民采取合适的决策，帮助他们免受农业损失的影响，反过来又影响国家的社会经济增长。机器学习在推荐系统中起着至关重要的作用，因为它通过从数据库存在的海量信息中过滤更准确的信息，提高了推荐系统的效率。机器学习可以学习各种因素，如数字土壤检测和作物制图、天气、肥料、疾病检测和害虫管理以及适应气候变化等，并根据需求相应推荐使用的种子、肥料、害虫或工具。推荐系统中的机器学习算法大致分为两类——协同过滤和基于内容。\n\
