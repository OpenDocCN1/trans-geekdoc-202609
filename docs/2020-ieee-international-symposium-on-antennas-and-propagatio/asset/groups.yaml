    ## Study of Machine Learning Using Wireless and Physical Network Data at a Factory


    Kenshi Horihata, Kazuki Kanai, Rei Hasegawa, Yoshio Koyanagi and Yasufumi Ichikawa

    Innovation Center, Connected Solutions Company

    Panasonic Corporation

    Yokohama, Kanagawa, Japan

    horihata.kenshi@jp.panasonic.com, kanuki.kanai@jp.panasonic.com, hasegawa.rei@jp.panasonic.com,
    koyanagi.yoshio@jp.panasonic.com, ichikawa.yasufumi@jp.panasonic.com


    **Abstract—** Wireless communication is expected to improve the flexibility of
    equipment layout or the IoT factory (Things). In this paper, we show the result
    of constructing an IoT sensor network using LPWA (Low Power Area) in a factory,
    performing machine learning, and analyzing the correlation between wireless and
    physical environment. As it has been shown that RSSI (received signal indicator)
    fluctuation could be estimated from physical environment around the terminal.


    ***Keywords—Machine Learning; Random Forest; Factory; Sensor; Propagation***


    # I. INTRODUCTION


    Wireless communication has been made in factories because of control reliability.
    But wireless communication is expected to improve the flexibility of equipment
    layout or the IoT factory (Things). However, large systems such as AGVs (Automated
    Guided Vehicles) and conveyors move on many factories. In effect, it is necessary
    for optimizing on-site wireless environment to operate the analysis cycle by cycle
    and physical factors at the rigid.


    On a cyber side, others have been studying the framework of radio environment
    simulator that combines propagation and system calculation [2]. As a physical
    side, it is strongly required to gather crappy factors when the on-site wireless
    environment changes. As a method we have not only communication status but also
    physical environment around the sensors. Our aim is to apply it to a mechanism
    that allows field engineers to identify the early cuts and takeovers, or to a
    technique to improve parameter control by including the physical environment.


    In this paper, we show the result of constructing IoT sensor network using LPWA
    (Low Power Area) in a factory, performing machine learning, and analyzing the
    correlation between wireless and physical environment.


    # II. MEASUREMENT SYSTEM AND EXPERIMENTAL CONDITIONS


    ### A. LPWA network construction


    In this study, we use LoRa in LPWA. Figure 1 shows the configuration diagram of
    the measurement system. The overall configuration is a star-type sensor network.
    The physical environment was acquired by the sensor in the factory and received
    by the LoRa base station. Next, the collected sensor data and RSSI (received signal
    indicator) are stored in the SQL database via the LoRa and sensor server mounted
    on the raspberry. The frequency was 920.2 MHz, channel 38, the transmission power
    was 13 dBm, the spreading factor was 125 kHz, the sensing intensity was once every
    3 seconds.


    ### B. Sensor device configuration


    In this study, we use a human sensor and a distance sensor to acquire physical
    environment. The human sensor works in 5 and 150 m [15] in the range front direction,
    and can detect the movement of the human or machine as a source by infrared rays.
    The distance sensor works in 5 and 150 m and detects obstacles by waves. Each
    sensor acquires the data once every 5 seconds, and then each terminal calculates
    the human detection rate (Human), the average distance (AV. Distance) and the
    change rate of the distance (Diff. Rate). The calculation result is transmitted
    to the base station as application data.


    ### C. Experimental conditions


    Figure 2 shows the 3D model in the factory and the locations of the bases and
    terminals, which are part of the factory building. This was a warehouse factory
    where tall metal shelves were linked up, and it was environment where the terminals
    were placed on the floor with the wall bending, and the sensors were placing gateways.
    A half day and one day, and several sets have been noted.


    > This work is supported by the Ministry of Internal Affairs and Communications
    for the project ''R&D on Technologies to develop and utilize 5G networks'' (Contract
    No. 2020-0-3300044) in Distributed Areas.


    # III. Machine Learning


    ### A. Data Structure and machine learning conditions


    For using machine learning, recording of data was performed. The data was a time-series
    data that were the RSSI, Human, AV_Distance, and Diff_Rate of each terminal. In
    addition, time windows of 0, 1, and 5 minutes have been applied to the features,
    the mean, median, and standard deviation were calculated for each time window.
    Note that the time window was used going back to the past time so that future
    information was not included.


    Machine learning was performed using the processed data, which had about 300,000
    lines and 14 hours from 10:00 to 24:00. This data was divided into training and
    test sets. Models were created using algorithm, Random Forest implemented in Python
    open source library scikit-learn. The target parameter was 5 minutes of std. The
    RSSI for the 21st terminal and machine learning was performed without RSSI of
    any terminal. The results were shown as follows: "estimators" were 100, "criteria"
    were "MSE", "max_features" were 8, "max_depth" were "sqrt", "min_samples_split"
    and "min_samples_leaf" were.


    ### B. Results and discussion


    First, root mean square error (RMSE) between estimation and std. of RSSI using
    the RMSE of 5 data was calculated. The average value was 0.29 for the data and
    0.32 for the test data. For comparison, RMSE between the simple average and target
    values for the test data was 0.5. Machine learning shows the top 10 rankings of
    impacts on the trained model. This figure indicates that the std. of the RSSI
    has been estimated using other terminals around the 21st terminal, which is the
    target. The top feature was 5 minutes of average at the 22nd terminal.


    In addition, another test was performed with new data on a different day using
    the trained model in the section. Section 4 shows the target and estimated std.
    of the RSSI. A more important fact is the RMSE result is that the estimation could
    follow the target on a different day. This indicates that RSSI fluctuation could
    be linked to physical environment by machine learning.


    # IV. CONCLUSION


    In this paper, we have analyzed the correlation between wireless and physical
    performance using machine learning in a factor. As it has been shown that RSSI
    fluctuation of a terminal could be estimated from std data that recorded physical
    environment around the terminal. A training model is considered to be useful for
    early uses of on-site wireless problems or as feedback for more advanced wireless
    parameter control. We are planning to use a method of estimating RSSI fluctuation
    of multiple terminals at a time, and separating different situations.


