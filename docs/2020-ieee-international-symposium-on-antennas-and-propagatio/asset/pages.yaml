  md: "# III. Machine Learning\n\n# A. Data Structure and machine learning conditions\n\
    \nFor using machine learning, recording of data was performed. The data was a\
    \ time-series data that were the RSSI, Human, AV_Distance, and Diff_Rate of each\
    \ terminal. In addition, time windows of 0, 1, and 5 minutes have been applied\
    \ to the features, the mean, median, and standard deviation were calculated for\
    \ each time window. Note that the time window was used going back to the past\
    \ time so that future information was not included.\n\nMachine learning was performed\
    \ using the processed data, which had about 300,000 lines and 14 hours from 10:00\
    \ to 24:00. This data was divided into training and test sets. Models were created\
    \ using algorithm, Random Forest implemented in Python open source library sc-learn.\
    \ The target parameter was 5 minutes of std. The RSSI for the 21st terminal and\
    \ machine learning was performed without RSSI of any terminal. The results were\
    \ shown as follows: \"estimators\" were 100, \"criteria\" were \"MSE\", \"max_features\"\
    \ were 8, \"max_depth\" were \"sqrt\", \"min_samples_split\" and \"min_samples_leaf\"\
    \ were \n\n# B. Results and discussion\n\nFirst, root mean square error (RMSE)\
    \ between estimation and std. of RSSI using the RMSE of 5 data was calculated.\
    \ The average value was 0.29 for the data and 0.32 for the test data. For comparison,\
    \ RMSE between the simple average and target values for the test data was 0.5.\
    \ Machine learning shows the top 10 rankings of impacts on the trained model.\
    \ This figure indicates that the std. of the RSSI has been estimated using other\
    \ terminals around the 21st terminal, which is the target. The top feature was\
    \ 5 minutes of average at the 22nd terminal.\n\nIn addition, another test was\
    \ performed with new data on a different day using the trained model in the section.\
    \ Section 4 shows the target and estimated std. of the RSSI. A more important\
    \ fact is the RMSE result is that the estimation could follow the target on a\
    \ different day. This indicates that RSSI fluctuation could be linked to physical\
    \ environment by machine learning.\n\n# IV. CONCLUSION\n\nIn this paper, we have\
    \ analyzed the correlation between wireless and physical performance using machine\
    \ learning in a factor. As it has been shown that RSSI fluctuation of a terminal\
    \ could be estimated from std data that recorded physical environment around the\
    \ terminal. A training model is considered to be useful for early uses of on-site\
    \ wireless problems or as feedback for more advanced wireless parameter control.\
    \ We are planning to use a method of estimating RSSI fluctuation of multiple terminals\
    \ at a time, and separating different situations.\n\n![](img/1c304c22a72d42c17351fcef07a1cc72_1_0.png)\n\
