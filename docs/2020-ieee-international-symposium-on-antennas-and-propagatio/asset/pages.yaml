  md: "# # Study of Machine Learning Using Wireless and Physical Network Data at a\
    \ Factory\n\nKenshi Horihata, Kazuki Kanai, Rei Hasegawa, Yoshio Koyanagi and\
    \ Yasufumi Ichikawa\nInnovation Center, Connected Solutions Company\nPanasonic\
    \ Corporation\nYokohama, Kanagawa, Japan\nhorihata.kenshi@jp.panasonic.com, kanuki.kanai@jp.panasonic.com,hasegawa.rei@jp.panasonic.com,koyanagi.yoshio@jp.panasonic.com,\
    \ ichikawa.yasufumi@jp.panasonic.com\n\n**Abstract—** Wireless communication is\
    \ expected to improve the flexibility of equipment layout or the IoT factory (Things).\
    \ In this paper, we show the result of constructing IoT sensor network using LPWA\
    \ (Low Power Area) in a factory, performing machine learning, and analyzing the\
    \ correlation between wireless and physical environment. As it has been shown\
    \ that RSSI (received signal indicator) fluctuation could be estimated from physical\
    \ environment around the terminal.\n\n***Keywords—Machine Learning; Random Forest;\
    \ Factory; Sensor; Propagation***\n\n# I. INTRODUCTION\n\nWireless communication\
    \ has been made in factories because of control reliability. But wireless communication\
    \ is expected to improve the flexibility of equipment layout or the IoT factory\
    \ (Things). However, large systems such as AGVs (Automated Guided Vehicles) and\
    \ conveyors move on many factories. In effect, it is necessary for optimizing\
    \ on-site wireless environment to operate the analysis cycle by cycle and physical\
    \ factors at the rigid.\n\n a cyber side, others have been studying the framework\
    \ of radio environment simulator that combines propagation and system calculation\
    \ [2]. As a physical side, it is strongly required to gather crappy factors when\
    \ the on-site wireless environment changes. As a method we have not only communication\
    \ status but also physical environment around the sensors. Our aim is to apply\
    \ it to a mechanism that allows field engineers to identify the early cuts and\
    \ takeovers, or to a technique to improve parameter control by including the physical\
    \ environment.\n\nIn this paper, we show the result of constructing IoT sensor\
    \ network using LPWA (Low Power Area) in a factory, performing machine learning,\
    \ and analyzing the correlation between wireless and physical environment.\n\n\
    # II. MEASUREMENT SYSTEM AND EXPERIMENTAL CONDITIONS\n\n# A. LPWA network construction\n\
    \nIn this study, we use LoRa in LPWA. Figure 1 shows the configuration diagram\
    \ of the measurement system. The overall configuration is a star-type sensor network.\
    \ The physical environment was acquired by the sensor in the factory and received\
    \ by the LoRa base station. Next, the collected sensor data and RSSI (received\
    \ signal indicator) are stored in the SQL database via the LoRa and sensor server\
    \ mounted on the raspberry. The frequency was 920.2 MHz, channel 38, the transmission\
    \ power was 13 dBm, the spreading factor was 125 kHz, the sensing intensity was\
    \ once every 3 seconds.\n\n# B. Sensor device configuration\n\nIn this study,\
    \ we use a human sensor and a distance sensor to acquire physical environment.\
    \ The human sensor works in 5 and 150 m [15] in the range front direction, and\
    \ can detect the movement of the human or machine as a source by infrared rays.\
    \ The distance sensor works in 5 and 150 m and detects obstacles by waves. Each\
    \ sensor acquires the data once every 5 seconds, and then each terminal calculates\
    \ the human detection rate (Human), the average distance (AV. Distance) and the\
    \ change rate of the distance (Diff. Rate). The calculation result is transmitted\
    \ to the base station as application data.\n\n# C. Experimental conditions\n\n\
    Figure 2 shows the 3D model in the factory and the locations of the bases and\
    \ terminals, which are part of the factory building. This was a warehouse factory\
    \ where tall metal shelves were linked up, and it was environment where the terminals\
    \ were placed on the floor with the wall bending, and the sensors were placing\
    \ gateways. A half day and one day, and several sets have been note\n\n> This\
    \ work is supported by the Ministry of Internal Affairs and Communications for\
    \ the project 'R&D on Technologies to develop and utilize 5G networks' (Contract\
    \ No. 2020-0-3300044) in Distributed Areas."
