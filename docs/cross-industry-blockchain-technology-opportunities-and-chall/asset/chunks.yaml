  trans: "\n\n## REFERENCES\n\n|  ||  |\n\n| --- | --- |\n\n| \\[1\\] || Nemali K.S.,\
    \ van Iersel M.W.. An automated system for controlling drought stress and irrigation\
    \ in potted plants.Sci. Hortic. (Amsterdam)2006110329229710.1016/j.scienta.2006.07.009\
