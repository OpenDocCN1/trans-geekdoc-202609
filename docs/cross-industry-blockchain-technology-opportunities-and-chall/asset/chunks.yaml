    \ |\n\n# 基于区块链技术的车载自组织网络系统\n\n**Manoj Sindhwani^(1)****，** **Charanjeet Singh^(1,\
    \ \\*)****，** **Rajeshwar Singh^(2)**  \n\n¹ 爱丽丝专业大学，旁遮普邦法加瓦拉，印度  \n\n² 道巴学院集团，纳万沙赫尔，印度\
    \  \n\n## 摘要\n\n在构建工程领域支柱的各种技术中，自组织网络是主要的研究领域之一。从历史角度看，移动自组织网络（MANETs）在战场通信及其他重要应用中发挥了突出作用，但另一种名为车载自组织网络（VANETs）的新兴网络提供了无线通信，从而广泛应用，导致自组织网络大规模部署。然而，在\
    \ VANET 中，安全消息传输仍然是一个挑战，因此我们提出了一种本地区块链，用于在车载网络中传播消息以改善安全问题。VANET 中的公共区块链技术确保了车载自组织网络中基于信任的安全消息传输。\n\
    \n**关键词：** 区块链，消息传播，安全网络，车载网络。  \n\n* * *\n\n^(\\*) **通讯作者 Charanjeet Singh：**\
    \ 爱丽丝专业大学，旁遮普邦法加瓦拉，印度；电话：+919463569976；  \n\n电子邮件：charanjeet.21882@lpu.co.in \
    \ \n\n## 引言\n\nAd-hoc 源自拉丁语，意为“专门为……而组成”。一个由各种独立的单个设备组成、通过共享和交换信息相互通信并形成多跳无线网络的网络\
    \ \\[1\\] 称为自组织网络。在通信过程中，如果一方（有兴趣与远方的另一方通信）需要中介来交换信息，为此，自组织网络应运而生。这意味着，如果目标节点位置遥远且无法直接访问，则消息将通过其他节点\
    \ *via* 传输。通常，自组织网络采用多跳通信方式，每个主机也可以充当路由器。除了动态拓扑及上述问题等后果之外，无线自组织网络以 MANET 和 VANET\
    \ 的名义为世界带来了巨大的应用 \\[2, 3\\]。这些网络具有优势，因为它们可以使用无许可频率频谱并拥有良好的网络；因此，发送和分发信息也变得非常容易。所讨论的聚类算法将消除网络中的许多问题。一条高速公路分为两条车道，车载节点（汽车/其他车辆）以不同速度行驶。图\
    \ (**1**) 展示了自组织网络结构。\n\n![](img/9789815051452-C6-F1.jpg)**图 (1)**  \n\n自组织网络结构。\
    \  \n\n车辆开始使用聚类技术形成集群，集群中的节点称为集群成员（CM），其中一个节点通过聚类算法被选为集群头（CH）。聚类算法可以减少网络中各种与效率相关的问题。各种研究人员提出了许多聚类技术，通过应用不同的聚类算法来促进集群的形成。\n\
    \n## VANETs 的架构\n\n由于 VANET 使用其移动节点创建自组织无线网络，因此还存在包括 RSU、OBU 和 AU 在内的完整架构。VANET\
    \ 是智能交通网络的主要组成部分，旨在提高交通效率，从而提供更好的道路安全。VANET 具有动态拓扑 \\[4, 5\\]，车载节点频繁连接和断开连接。\n\
    \nVANET 确保：\n\n*   交通管理\n\n*   安全管理，以及\n\n*   互联网服务\n\n![](img/9789815051452-C6-F2.jpg)**图\
    \ (2)**  \n\nVANET 通用架构。  \n\n图 (**2**) 展示了 VANET 的通用架构。VANET 架构遵循基于 802.11 标准协议\
    \ \\[6\\] 并用于 ITS 的车载环境无线接入（WAVE）。WAVE 是一种专门为车载环境设计的标准协议，支持 5.9 GHz 频段（该频段专为 ITS\
    \ 许可）中的 V2V 和 V2I 通信。它使用 OFDM 正交复用技术来分割信号。WAVE 包括 RSU 和 OBU，因此后来采用了 WAVE。车载自组织网络中使用的单元\
    \ \\[7\\] 在表 **1** 中表示。\n\n"
