  trans: '


    我们可以得出结论，区块链是一项非常有助于物联网安全的赋能技术。它在区块链的其他各种挑战中也非常有帮助，例如完整性、保密性、身份验证和密钥管理解决方案。区块链的主要特点之一使其成为物联网安全理想解决方案，即其去中心化的特性，这使得攻击者的工作变得困难。由于物联网框架具有分布式特性，因此更容易受到攻击，这意味着由于设备数量庞大，攻破任何一台不受重视的设备都非常容易。我们也可以总结地说，物联网框架的攻击面更大，并且随着每增加一台设备而不断扩大，这无疑将继续增加。相反，区块链利用这种分布式特性来确保事物的安全。由于区块链是一种分布式账本系统，它维护不可更改的账本记录。这就是在区块链中保护数据的方式。分布式框架提高了系统的信任度。物联网和区块链相辅相成，使物联网容易受到攻击的因素是其分布式特性，而区块链利用同一因素使其更加安全。使用区块链去中心化物联网网络还有助于解决单点故障等问题，以及降低维护网络基础设施的成本。两家大公司
    IBM 和 Samsung 合作开发了 ADEPT \[20, 21\]（Autonomous Decentralized Peer-to-Peer Telemetry），这是一个基于区块链的物联网系统。区块链系统用于创建分布式物联网系统，生成智能合约和点对点消息传递系统。ADEPT
    的一个用途可以是各种智能家居电器。例如，一台完全自动化的洗衣机可以与其他设备通信，例如，如果许多设备同时插电，它可以推迟洗衣，从而实现电力负载平衡。如果机器出现问题，它可以根据需要创建维护或维修请求。目前，这看起来像是一个非常未来主义的项目，但它在不久的将来可以实现。当处理自己工作的智能设备被黑客攻破时，问题就出现了。一种解决方案是，家中所有其他设备都验证一台设备的真实性。让我们举个例子：所有设备都基于网络，所以假设我们的第一个智能设备，或者说我们区块链中的第一个区块是调制解调器。每当添加新设备时，其密钥是调制解调器密钥和新设备密钥的组合。维护一条链，其中区块的数量与家中智能设备的数量相同。如果任何一台设备被黑客攻击，那么所有使用其密钥生成的设备也将失去功能。这是区块链在保护智能家居物联网网络方面的基本用途之一
    \[22\]。区块链应用不仅限于此，它们可以在物联网的不同领域有多种用途。


    ### 区块链物联网安全：实施挑战


    区块链和物联网集成仍然存在各种问题。主要问题之一是所有其他设备对每个操作进行验证，这有时会非常耗时。此外，在拥有数千台设备的网络中，要获得大多数节点的同意将非常困难。对于每笔成功的交易，矿工需要相互竞争以验证交易。在这里，我们的对等节点和矿工节点都是轻量级设备，不具备如此高端的计算能力。解决此问题的一个可行方案是拥有一个定制框架来维护区块链。但同样，问题是要为此寻找不同的第三方平台供应商。即使有如此多的安全功能，我们也不能确定我们的网络没有任何安全漏洞。如果设备恶意或被黑客攻击，我们也需要大多数设备的同意。因此，我们可以说，如果进入这个网络很困难，那么将某人踢出网络也同样困难。组织应彻底调查其隐私要求，并选择合适的区块链类型，或请求开发定制区块链，直到现成的解决方案出现在大众市场上。


    ## 结论


    本章探讨了两个最受关注的技术：区块链和物联网（IoT）。区块链是一种分布式账本系统，它创建不可更改的记录，从而产生高度安全的数据，而物联网是一种已融入我们日常生活的技术。区块链是一种去中心化的账本，记录点对点网络上发生的所有交易，这有助于在不涉及第三方的情况下移动数字资产。区块链技术已被广泛应用于各种工业和研究应用及领域，包括加密货币、金融交易、供应链管理、健康记录管理和研究、电子投票、密钥分发、融资创造以及保护公共数据。随着我们周围智能设备的普及，物联网是一项新兴技术，用于连接这些物品。安全性、监管政策、完整性、可用性、带宽、异质性、兼容性、身份验证、保密性、轻量化、消费者期望和密钥管理系统是物联网的主要问题。它对其他区块链相关困难也非常有益，例如完整性、保密性、身份验证和关键管理解决方案。区块链的主要方面之一使其成为物联网安全的合适选择，即其去中心化的特性，这使得攻击者的工作变得具有挑战性。由于物联网框架的分散性质，它们更容易受到攻击。这意味着，由于设备数量庞大，攻破甚至一台不受重视的设备也将非常简单。


