  trans: '


    当前无需许可的分布式账本在验证速度和交易量方面面临着区块链可扩展性问题。由于区块大小限制为一兆字节，比特币每秒仅处理 4-5 笔交易。有限的区块大小在比特币社区中一直是争议的焦点。增加区块大小可能会在网络中传播耗时，并导致分叉。以太坊
    DLT 系统支持更高的交易吞吐量。许可型区块链透明度较低，更加集中化，但具有处理大量交易的更高能力。许可型区块链无法从开放性的分布式公共 DLT 系统中获得太多好处。


    ### 集成与兼容性


    DLT 系统应与现有技术集成，并与其他账本兼容。将 DLT 集成到现有金融系统中的成本涉及巨额费用。目前正在开发一些框架，例如 `CORDA framework`
    和 `Fabric framework`，以解决特定行业问题：


    *   允许交易对手之间进行点对点交易；需要对交易对手的身份进行验证；

    *   需要了解基础交易可见性；需要让监管机构访问交易；

    *   保持原始法律流程与智能合约之间的等效性；

    *   各种分布式账本之间的互操作性；

    *   利用现有软件工具；

    *   支持多种共识机制。


    这些框架探索了与现有监管和行业惯例相一致的数字账本方法。`hyperledger framework` 最初专注于金融领域，并进一步扩展到供应链，而 `CORDA
    framework` 专门用于金融领域。


    #### 网络安全


    研究表明，每 1000 行代码中大约有 15-50 个错误 \[46\]。以太坊区块链上的 DAO 攻击证明，软件应用中的任何弱点都可能被利用造成有害影响。账本的分布式特性使得网络安全成为一个重要方面，以便保护
    DLT 系统的核心规则免受攻击者侵害。在一种称为“51% 攻击”的攻击类型中，黑客控制了 51% 的网络资源，操纵共识并欺骗网络。网络的鲁棒性取决于其不允许任何实体控制特定区块链一半资源的能力。与这些数字账本交互的软件应用程序需要仔细监控和审查。当攻击者控制无需许可的系统，拥有身份详细信息并继续控制大多数网络参与者时，可能会发生这种情况。最近对多个以太坊节点使用标准分布式拒绝服务
    (`DDos`) 攻击的攻击表明，现有的网络攻击技术可用于 DLT 系统。


    需要注意的是，即使在 DLT 访问接口遭受成功攻击后，比特币和其他区块链系统的核心技术也从未被攻破。


    #### 有效治理


    缺乏中央实体或集中式基础设施对基础设施的整体有效治理提出了疑问。在 DLT 基础设施中做出关键决策非常困难。金融组织依赖于集中式监管机构来实现有效治理。在无需许可的
    DLT 中，治理安排的适用性不明确。在许可型 DLT 中，管理员可能拥有也可能不拥有足够的权限和工具来确保网络节点之间的治理安排。


    ### 法律和监管问题


    #### 行业标准和监管评估


    行业标准和监管评估仍处于发展的初级阶段。全球金融监管机构积极参与技术分析，但实际的监管 DLT 框架尚缺失。


    #### 管辖权和所有权 - 法律清晰度


    在支付和结算系统中，关于交易“最终性点”存在明确的担忧。在数字账本环境中，如何描述“最终性点”是一个重大问题。跨境数字账本系统中未定义数据和交易管辖权。由于数字账本没有中央管理实体，因此对开放无需许可的分布式账本系统设置监管协议既棘手又困难。由于许可型账本中有中央管理员，因此监管框架的设置和维护相对简单且可行。


    #### 客户尽职调查和了解你的客户


    DLT 系统应强制遵循并整合客户尽职调查 (`CDD`) 和了解你的客户 (`KYC`) 实践，以打击资助恐怖主义 (`CFT`) 并防止洗钱 (`AML`)。无需许可的
    DLT 系统的身份伪装特性使得遵守现有关于 `AML/CFT` 的监管指南变得非常困难，并允许未经审查的各方进行交易。一些 DLT 交易所通过提供优先交易时间和验证来推广
    `KYC` 要求，前提是用户提供 `KYC` 信息。在许可型 DLT 系统中，由于集中式控制，遵守 `AML/CFT` 指南很容易。


    #### 争议解决机制


    在分布式账本的情况下，需要建立争议解决机制；尤其是在发生错误交易的情况下。一种解决方案是整合反向交易框架。在反向交易框架中，会发起一笔单独的交易以向原始发送方提供权限。为此，需要一套规则，这些规则可以在特定情况下执行以发起撤销。如果没有一套规则，错误交易可能会在访问资金时遇到问题。这些规则由一个称为方案所有者的中央实体管理，在传统系统（如
    Visa、MasterCard `etc.`）中也是如此。在许可型数字账本中，此角色由数字账本管理员处理。在无需许可的数字账本系统中，智能合约自动化该角色。关于由于数字账本弱点而可能产生的损失责任存在担忧。在许可型系统中，这些问题比在无需许可的系统中更容易有效处理。


    #### 隐私


    在以太坊和比特币等无需许可的账本中，用户的身份不会被暴露。在某些情况下，可以根据交易模式等标记推断用户的身份。在许可型数字账本中，问题也是一样的。这是将数字账本技术应用于金融基础设施时面临的主要挑战，许多组织正在致力于其设计。


    #### 基础设施成本


    利用共识机制和工作量证明需要巨大的计算资源/基础设施，这导致挖矿的巨大功耗。


    ## DLT 应用


