- raw: "Every data is authorized with a *Public Key* that is provided to the users;\
    \ only then a smart device will be able to access or use the Blockchain and the\
    \ storage \\[[15](#9789815051452-C5.html#r15)\\]. As forecasted in a study \\\
    [[16](#9789815051452-C5.html#r16)\\], BCT may tend to contribute to entirely phase\
    \ shifting the way people pay for goods or any commodities they purchase, through\
    \ this increase in cryptocurrency. There are various risks associated with BCT\
    \ such as private key security, criminal activity, double spending, transaction\
    \ privacy leakage, criminal smart contract, vulnerabilities in smart contract,\
    \ under-optimized smart contract, and underpriced operations that are very effectively\
    \ explained \\[[17](#9789815051452-C5.html#r17)\\] but simultaneous solutions,\
    \ various proposed framework and refined algorithms too have been provided for\
    \ the same in the past few years that tackle these issues very effectively. Although\
    \ BCT can be applied anywhere for good but more importantly it finds its value\
    \ in security and financial industry, as it has already triggered multiple projects\
    \ in industries. BCT promises to overcome very subtle aspects representing, “a\
    \ shift from trusting people to trusting math” \\[[16](#9789815051452-C5.html#r16)\\\
    ]. The Smart Home Miner manages most of the things like generating transactions,\
    \ distributing and updating keys, managing a local storage (used to store data\
    \ locally – uses First in First out (*FIFO*) and the cluster. In addition, it\
    \ also collects the transactions into a block and then appends it to a Blockchain.\
    \ Whenever an external device requires data from the network, the miner allocates\
    \ a special key. The miner first checks the policy header and then allocates a\
    \ key so that the devices can access the data. It can also declare the key invalid\
    \ once the work is completed so that it may not able to access the network anymore.\
    \ This method has two advantages – the miner can keep track of all the devices\
    \ involved within the network and the communication between devices is secured\
    \ using a shared key. Even access to local storage requires permission \\[[15](#9789815051452-C5.html#r15)\\\
    ] and we can implement distributed cloud storage, making it difficult to cause\
    \ disruptions \\[[11](#9789815051452-C5.html#r11)\\]. IoT devices can carry out\
    \ autonomous transactions through smart contracts. Combined with artificial intelligence\
    \ (AI) and Big Data solutions, more significant impacts can be produced \\[[18](#9789815051452-C5.html#r18)\\\
    ].\n\n![](Images/9789815051452-C5-F1.jpg)**Fig. (1))**  \n\nBlock diagram of BCT.\
    \ \n\nAs depicted in Table [**1**](#9789815051452-C5.html#t1), various types of\
    \ BCT along with their attributes have been discussed. Blockchain checks each\
    \ packet of data or transaction to identify any kind of abnormal behavior. If\
    \ we take into consideration multiple miners to validate a new packet being added\
    \ to the chain, it definitely increases the delay because now every miner has\
    \ to verify the packet being added but it enhances the robustness of the entire\
    \ network. It solves the problem of centralization as multiple miners control/validate\
    \ the data being added. Blockchain requires each miner to do an encryption checking\
    \ and solve a complex mathematical problem so as to complete a transaction, this\
    \ can increase the energy consumption, but using Artificial Intelligence, this\
    \ problem can also be dealt with \\[[19](#9789815051452-C5.html#r19)\\]. Blockchain\
    \ can be the future of security since many new companies have started to use it\
    \ to gain trust among their users, for example, *Provenance*. Major companies\
    \ like Bosch and Cisco have started implementing the features of Blockchain for\
    \ securing IoT applications. Blockchain is heavily involved with cryptocurrency.\
    \ GridCoin and Ripple Labs find the exquisite implementation of Blockchain in\
    \ financial services \\[[20](#9789815051452-C5.html#r20)\\].\n\nTable 1 **Types\
    \ of BCT.**  \n\n| ***Attribute*** || ***Public BCT*** || ***Consortium BCT***\
    \ || ***Private BCT*** |\n\n| --- | --- | --- | --- |\n\n| **Determining Consensus**\
    \ || Every Miner || Only selected ones || Particular Institution |\n\n| --- |\
    \ --- | --- | --- |\n\n| **Read Request** || Public || Public/Restricted || Public/Restricted\
    \ |\n\n| **Immutability** || Almost impossible to interfere || Can be interfered\
    \ || Can be interfered |\n\n| **Efficiency** || Truncated || Quite high || Quite\
    \ High |\n\n| **Centralization** || Nil || Embryonic || Yes |\n\n| **Process of\
    \ Consensus (PoC)** || No confirmation required || Requires Permission || Requires\
    \ Permission |\n\n## IoT\n\nThe way IoT has created a buzzword is quite commendable\
    \ and has appeased many researchers. IoT is nothing but the interconnectivity\
    \ of the objects with each other *via* internet. Not only it aims to unify everything\
    \ under one umbrella but also tries to address the issue of not being able to\
    \ control the things that surround us with just one click. There is no unique\
    \ definition of IoT as depending on the need and reference it can be molded \\\
    [[21](#9789815051452-C5.html#r21)\\]. Furthermore, IoT has been successful in\
    \ grasping the attention of the users, businessmen, authorities over the world\
    \ to not only make this concept used in their respective domain but also to develop\
    \ its fangs even deeper into the realm of knowledge. The first known application\
    \ of IoT was a Coke Machine at Carnegie Melon University in early 1980s and since\
    \ then its development just sky rocketed. For successful implementation of Internet\
    \ of Things (IoT), the prerequisites are (a) Dynamic resource demand (b) Real\
    \ time needs (c) Exponential growth of demand (d) Availability of applications\
    \ (e) Data protection and user privacy (f) Efficient power consumptions of applications\
    \ (g) Execution of the applications near to end users and (h) Access to an open\
    \ and inter operable cloud system \\[[22](#9789815051452-C5.html#r22)\\].\n\n\
    So far when we take major essential technologies widely used for deployment of\
    \ IoT-based products and services, the most obvious solution we get are RFID,\
    \ WSN, Middleware, Cloud Computing and IoT Application Software. The trend of\
    \ IoT prior from 2010 to 2020 is clearly illustrated in Table [**2**](#9789815051452-C5.html#t2).\n\
    \nTable 2 **IoT trend**  \n\n|  || **Prior 2010** || **2010-2015** || **2015-2020**\
    \ || **After 2020** |\n\n| --- | --- | --- | --- | --- |\n\n| **Network (N/W)**\
    \ || ▪ WSN based || ▪ Autonomous  \n\n▪ N/W location transparency.  \n\n▪ Lag\
    \ Accepted  \n\n▪ Storage and Power N/Ws  \n\n▪ Hybrid Technologies || ▪ Awareness\
    \ based on Context N/W. || ▪ N/W Apprehension  \n\n▪ Autodidactic and Repairing\
    \ N/Ws. |\n\n| --- | --- | --- | --- | --- |\n\n| **Software and Algorithms**\
    \ || ▪ Amalgamation of relational database.  \n\n▪ IoT oriented.  \n\n▪ Event\
    \ oriented platforms.  \n\n▪ Localization Algorithms. || ▪ Wide Scale, open source\
    \  \n\n▪ Compose able Algorithms  \n\n▪ Next gen social oriented  \n\n▪ Next gen\
    \ based apps || ▪ Desired results oriented.  \n\n▪ Distributed AI  \n\n▪ Object-to-\
    \ object collaboration || ▪ User-based  \n\n▪ Transparent IoT  \n\n▪ Cinch to\
    \ deploy  \n\n▪ Objects-to- human collaboration.  \n\n▪ For everyone. |\n\n| **Hardware**\
    \ || ▪ RFIDs, sensors  \n\n▪ Integrated into smart phones.  \n\n▪ NFC in smart\
    \ phones.  \n\n▪ Truncated and affordable  \n\nMEMs technology || ▪ Various protocols\
    \ and standards oriented.  \n\n▪ Increased sensors and actuators.  \n\n▪ Secure\
    \ affordable tags and || ▪ Intelligent sensors  \n\n▪ Increased sensors truncated\
    \ in a very small space. || ▪ Nanotechnology and new  \n\ninnovative materials\
    \ |\n\n| **Data Processing** || ▪ Series and Parallel  \n\n▪ Quality of Service\
    \ (QoS) || ▪ Spectrum aware data processing  \n\n▪ Context based data processing\
    \ that is  \n\n▪ adaptable || ▪ Context based data processing and outputs. ||\
    \ ▪ Adaptive, AI based cognitive optimization. |\n\nTable 3 **BCT addressing IoT\
    \ challenges.**  \n\n| **Challenge** || **Explanation** || **Blockchain Solution**\
    \ |\n\n| --- | --- | --- |"
