    # Different tools for Big Data analytics


    ## Hadoop


    Hadoop is open-source Big Data processing software and has several attributes:
    scalability, reliability, error tolerance, high availability, local processing
    and storage, distributed and parallel computing, and cost performance. It uses
    a basic model of programming to process massive datasets through computer clusters
    \[[49](#9789815051452-C3.html#r49)\].


    ### Spark


    Spark AB is an open-source tool designed to process large data sets. Spark was
    developed to tackle Hadoop’s disc I / O and performance problems. It has many
    features (such as in-memory computing) that make it special, and it offers a data-caching
    facility in memory. Spark supports many programming languages for processing large
    volumes of data (Python, Java, and Scala) \[[50](#9789815051452-C3.html#r50)\].
    It is ten (10) times faster than Hadoop and Mongo DB.


    #### Storm


    Apache Storm is an open-source, real-time, distributed computing framework for
    Big Data processing. It is simple and clear; it can be used by any scripting language,
    and it supports YARN for machine learning, ETL, ongoing operations tracking, decentralized
    remote procedure call (`RPC`), and real-time analytics \[[51](#9789815051452-C3.html#r51)\].


    #### Cassandra


    Apache Cassandra is a distributed database that offers high flexibility and reliability
    without sacrificing the efficiency of quality. It is one of the best Big Data
    tools that can satisfy structured, semi-structured, and unstructured datasets
    of all categories.


    #### Mongo DB


    MongoDB is an open-source data analytics product that gives cross-platform capabilities
    to the NoSQL database. For the business that needs fast-moving and real-time data
    to take decisions, it is exemplary. MongoDB is the perfect choice for those looking
    for data-driven solutions. It is user friendly, as it makes installation and maintenance
    easier. MongoDB is both reliable, and cost-effective.


    ## Big Data Techniques


    Big Data requires exceptional strategies to handle a large amount of data effectively
    within a short run-time \[[52](#9789815051452-C3.html#r52)\]. These fields have
    different methods, and they interact with each other too. Some tools and techniques
    are discussed in Figs. ([`12a`](#9789815051452-C3.html#f12) and [`b`](#9789815051452-C3.html#f12)).


    # INTEGRATION OF BLOCKCHAIN AND Big Data


    The integration of blockchain technology and Big Data might provide some fascinating
    possibilities. There are many ways that blockchain can aid in handling Big Data,
    plus data analytics. This technology has the greatest potential in data quality.
    This means that the data that big business collects and validates on the blockchain
    can become much more useful for companies. Blockchains will give you more faith
    in the legitimacy of viewing results. Immutable entries, timestamping based on
    consensus, audit trails, and clarity about the source of data (*e.g.*, kiosk or
    a sensor) are all fields where you can see progress as blockchain technology becomes
    more common.


    ![](Images/9789815051452-C3-F12.jpg)**Fig. (12))**


    (**a** and **b**) Different tools and techniques for Big Data analytics.


    ## Data Integrity


    Regulation of so-called dirty data (or misinformation) is an environment where
    blockchain can have a positive influence on the field of data analytics. Blockchain
    gives a transparent method for data integrity and audit trails to be performed
    as it identifies the origin of data across its connected chains. Blockchain guarantees
    data integrity by keeping a shared ledger maintained. The data stored on the blockchain
    is believable because they must have reviewed the process of verification that
    guarantees its accuracy. Data integrity is maintained when origin information
    and data block interactions are saved on the blockchain and automatically checked
    (or approved) before they can be used. It also allows for accountability, as it
    can track event and transaction occurring on the blockchain network.


    ## Manage Data Sharing


    A blockchain-based Big Data framework would grant providers to exchange records
    with any other part that has an interest without the exponential increase in risk
    factors that come from a network of different data silos. Data collected from
    data studies can be processed in a blockchain network in that respect. In this
    way, project teams should not duplicate data analysis already performed by other
    teams or reuse data that has already been used incorrectly. A blockchain platform
    can also help data scientists monetize their work, likely through the exchange
    of analytical results stored on the database.


    ## Preventing Malicious Activity


    In this way, project teams should not duplicate the data analysis that is already
    performed by other teams or reuse data which has already been used incorrectly.
    A blockchain platform can also help data scientists to monetize their work, likely
    through the exchange of analytical results stored on the database. To change the
    rules of blockchain, a plurality of nodes need to be pooled together to establish
    consensus. So, accessing and manipulating data on a wide scale make it an almost
    impossible job for cybercriminals.


    ## Predictive Analysis


    It is possible to analyse blockchain data (just like other data types) to uncover
    useful insights into habits, patterns, *etc.* As such, they can be used to forecast
    potential outcomes of events such as consumer desires, customer lifetime value,
    volatile prices and company churn rates with reasonable accuracy. With blockchain,
    banks and other organizations need large-scale real-time data analysis that can
    track changes in data in real-time, allowing fast decisions to be made.


    # CONCLUSION


    Blockchain and Big Data are two different technologies that showed a significant
    impact on data management with security. With this motivation, this chapter provides
    brief information related to blockchain and Big Data in terms of significance
    and applications. The integration of blockchain with Big Data is clearly illustrated
    in this chapter and the benefits of integration are discussed in terms of data
    integrity, predictive analysis, preventing malicious activity, and managing data
    sharing.


    # CONSENT FOR PUBLICATION


    Not applicable.


    # CONFLICT OF INTEREST


    The authors declare no conflict of interest, financial or otherwise.


    # ACKNOWLEDGEMENT


    Declared none.


