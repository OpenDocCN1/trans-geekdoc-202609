- raw: "Owing to the great influence of Big Data in the healthcare sector, its use\
    \ is growing day by day. But the path to bring this technology into action still\
    \ has challenges. Let us look at some problems that have been frequently faced.\
    \ One of the most difficult problems is the collection of data. The knowledge\
    \ of patients is typically distributed through different departments, hospitals,\
    \ computers and file cabinets. Proper preparation is required to fuse all these\
    \ together and organize them for potential collaboration. In addition, all the\
    \ collaborating entities will have a common understanding and consent to the formats\
    \ and forms of Big Data that they would like to examine. In addition to ensure\
    \ the accuracy and consistency of data, data cleaning and management are also\
    \ required. The procedures and policies protecting health data are often concerned\
    \ with different problems. These issues should be resolved after aggregating and\
    \ validating the data. Since there is no clear monitoring of the data from where\
    \ it is being processed, the IT company may face difficulties related to money,\
    \ security and results. The amount of healthcare data grows over time, and the\
    \ executive team often faces challenges in managing the costs and consequences\
    \ of data storage at the premise. Maintaining an on-site data storage system can\
    \ be a complicated and expensive affair. This means the method of distributing\
    \ the data through various departments can also be complicated.\n\nFor health\
    \ organizations, data security is essential. When health systems start incorporating\
    \ Big Data, they should be granted access to the data by health care providers.\
    \ When certain experts are given access by the organisation, there is no problem,\
    \ but if a large team is involved with the personal details of patients, the issue\
    \ may arise in terms of violation of privacy. Healthcare organizations will rely\
    \ on reliable data providers with a stable and well-structured delivery to provide\
    \ safe Big Data solutions to prevent these problems. Finally understanding the\
    \ potential of Big Data in health-care companies need to change way to do business.\
    \ Along with the skilled IT workers, data scientists are required to conduct the\
    \ analytics. Without proper IT infrastructure, organizations may find it hard\
    \ to make the most of Big Data.\n\n### Education Sector\n\nThe student data processing\
    \ has only been a major educational trend in the \\[[44](#9789815051452-C3.html#r44)\\\
    ] last decade. Moreover, the use of Big Data to help students in learning can\
    \ be traced all the way back to ITS and artificial intelligence studies as shown\
    \ in Fig. ([**8**](#9789815051452-C3.html#f8)). In the field of education, the\
    \ primary aim of using data in education today is to define approaches for creating\
    \ optimal educational environment \\[[45](#9789815051452-C3.html#r45)\\]. Big\
    \ Data is a recent concept in education \\[[46](#9789815051452-C3.html#r46)\\\
    ], with most academic discourses concentrating on the use of data to enhance the\
    \ quality of teaching and science. Particularly the availability of broad educational\
    \ data provides education to researchers with the ability to investigate the emerging\
    \ educational trend on a large scale using digital methods and techniques. Three\
    \ educational use cases are proposed for Big Data; promoting learning, teaching\
    \ and administration.\n\n![](Images/9789815051452-C3-F8.jpg)**Fig. (8))**  \n\n\
    Implementation of Big Data in education. \n\nBig Data in the education field gives\
    \ educators a unique opportunity to reach out to students in new ways and to teach\
    \ them. It will give them a better educational experience, and thus help them\
    \ decide the condition of the education system.\n\n### Challenges Concerning the\
    \ Application of Big Data in Education\n\nThe schools and colleges depend on a\
    \ lot of data relative to other large organizations. Extracting information from\
    \ all the data begins by asking the correct questions. It also begins with identifying\
    \ where Big Data can play a role and where there is no need for any possible effects.\
    \ Large volume of data is generated in education in different formats.\n\nOne\
    \ of the difficulties inherent in any Big Data project is that most projects begin\
    \ with the need to clean up the data. If companies work with existing sources\
    \ or numerous third-party databases, there is always a misalignment. Data scientists\
    \ spend a great deal of their time cleaning up data and doing boring, time-consuming\
    \ janitorial work.\n\nIn order to derive useful value from large datasets, it\
    \ requires surety of communicate with one another, whether by APIs or algorithms,\
    \ or a partial manual implementation, the hard work is to be done to clean up\
    \ data sufficiently to allow sharing and interaction.\n\n### Remote Sensing\n\n\
    Remote sensing has been one of the most effective tools used to get information\
    \ an efficient manner. The remote sensing data has played a significant role in\
    \ many scientific fields in recent years, including atmospheric science, biodiversity,\
    \ soil degradation, water pollution, and environmental geology \\[[47](#9789815051452-C3.html#r47)\\\
    ]. Remote sensing techniques clearly display the properties of Big Data. Big Data\
    \ remote sensing is gathering interest from government programs, and commercial\
    \ applications to academic fields \\[[48](#9789815051452-C3.html#r48)\\]. Fig.\
    \ ([**9**](#9789815051452-C3.html#f9)). illustrates the cycle of remote sensing\
    \ data.\n\nThe US government initiated the “Big Data” program in March 2012. It\
    \ may be the first Big Data policy initiative focused on enhancing our ability\
    \ to derive information from large and complex digital data sets. The Earth Observation\
    \ System Data and Information System (EOSDIS) is one of the most ambitious tasks\
    \ of the US government for satellite imagery of Big Data. It offers end-to-end\
    \ functionality from different sources for handling NASA’s environmental science\
    \ data. In Europe, the European Space Agency hosted a “Big Data from Space” conference\
    \ in 2017. It was about stimulating interactions and bringing together researchers,\
    \ developers, consumers, networks and service providers who are involved in leveraging\
    \ Big Data from space. Big Data analytics refers to such a broad and dynamic array\
    \ of data sets that conventional data processing algorithms and models are hard\
    \ to employ. The challenges involved are data collection, storage, search, exchange,\
    \ delivery, processing and analysis. The remote sensing Big Data has many unique\
    \ and special features *i.e.*, the data has multi-source, multi-resolution, high-dimensional,\
    \ vibrant-state, enantiomer, and nonlinear characteristics. The remote sensing\
    \ Big Data often represents a dynamic state since the earth surface varies, and\
    \ the satellites are always moving. The remote-sensing Big Data transition point\
    \ involves both stationary components and non-stationary components.\n\nBig Data\
    \ difficulty in remote sensing includes addressing a huge quantity of data \\\
    [[49](#9789815051452-C3.html#r49)\\]. The challenges related to data collection,\
    \ storage, analysis and reporting often contribute to problems with remote sensing.\
    \ Fig. ([**10**](#9789815051452-C3.html#f10)) illustrates some common challenges\
    \ we are facing for the collection of remote sensing data.\n\n![](Images/9789815051452-C3-F9.jpg)**Fig.\
    \ (9))**  \n\nBig Data in remote sensing data. ![](Images/9789815051452-C3-F10.jpg)**Fig.\
    \ (10))**  \n\nChallenges in remote sensing data. \n\n### Big Data Analysis Tools\
    \ and Techniques\n\nBig Data is a concept that describes the vast volume of data\
    \ sets – both structured and unstructured with variety and complex structure with\
    \ problems, such as data collection, storage, analysis, visualization and processing\
    \ difficulties. It needs new Big Data tools and techniques, technical approaches\
    \ for extracting and analysing data for insights leading to better decisions and\
    \ strategic business steps. Some of the most usable and important tools are mentioned\
    \ in Fig. ([**11**](#9789815051452-C3.html#f11)).\n\n![](Images/9789815051452-C3-F11.jpg)**Fig.\
    \ (11))**  "
