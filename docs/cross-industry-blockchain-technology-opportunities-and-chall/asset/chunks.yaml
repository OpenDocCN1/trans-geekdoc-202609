    \ || ![](img/bentham_logo.jpg) |\n\n# 前言\n\n本书旨在揭示区块链技术，这是当前的热门话题，并吸引了大量潜在最终用户。区块链技术带来的兴奋感充分体现了其在促进和使用加密货币方面的伟大特性。比特币和以太坊是两个最杰出的例子，为加密货币的美好未来奠定了基础。\n\
    \n区块链是一种开放的分布式账本，可以高效地记录两方之间的交易，并以可验证和永久的方式进行。作为实现去中心化共识的一种有前途的技术，区块链有助于实现对企业至关重要的优势，并为企业以新方式聚集在一起创造了非凡的机遇。\n\
    \n本书涵盖了区块链在金融、大数据、健康行业、水培和车载自组网络等领域的不同应用。编辑们感谢作者为完成本书所做出的贡献。\n\n**Rajesh Singh**\
