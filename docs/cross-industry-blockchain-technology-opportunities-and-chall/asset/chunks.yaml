- raw: "¹ School of Electronics and Electrical Engineering, Lovely Professional University,\
    \ Phagwara, Punjab, India  \n\n## Abstract\n\nSince blockchain is the central\
    \ technology of bitcoin, block chain has gained a lot of attention in recent years.\
    \ Its applications are expanding in a variety of fields, including Internet of\
    \ Things (IoT) defense, banking, industries, and medical centre. Furthermore,\
    \ IoT has grown in popularity because of its widespread usage in smart homes and\
    \ urban developments around the world. This paper presents the design of an automated\
    \ system for a greenhouse focusing mainly on Hydroponics. Along with the design,\
    \ the purpose of this study is monitoring, control, and visualization of the data.\
    \ This project addresses some of the issues in traditional farming. Issues like\
    \ incapability of agriculture due to small and fragmented land holdings, risk\
    \ in using manures and pesticides, and lack of mechanization. The segments of\
    \ this project include the main module (referred to as AGMS), the cloud, and the\
    \ end user. The data visualization is done through a website that will acquire\
    \ it from a Wi-Fi module through APIs. The study also includes social media alerts\
    \ to platforms like Twitter and mail.\n\n**Keywords:** API, Blockchain, MCU, Server.\
    \  \n\n* * *\n\n^(\\*) **Corresponding author Harpreet Singh Bedi:** School of\
    \ Electronics and Electrical Engineering, Lovely Professional University, Phagwara,\
    \ Punjab, India; E-mail: [harpreet.17377@lpu.co.in](mailto:harpreet.17377@lpu.co.in)\
    \  \n\n## INTRODUCTION\n\nAs we know, agriculture is the main requirement above\
    \ anything else and the traditional practices are just degrading over time. The\
    \ Indian Agriculture sector accounts for 18% of total GDP (Gross Domestic Product)\
    \ still, there is no major development in the agricultural practices followed\
    \ in the country. There are, however, some modern techniques like Hydroponics,\
    \ Aeroponics and Vertical Farming..\n\nAgriculture is the world's major source\
    \ of food. Throughout the history, it has been a critical parameter to the advancement\
    \ of civilizations. According to the United Nations (UN), the world's population\
    \ will rise by 2 billion people to 7.8\n\nbillion by 2050, implying that the planet\
    \ will need to feed around 11 billion people by the end of the century.\n\nAs\
    \ shown in Fig. [(**1**)](#9789815051452-C4.html#f1), there have been four distinct\
    \ revolutions in agricultural development: 1) age of traditional agriculture with\
    \ human and animal power, 2) age of mechanized agriculture with rumbling sounds,\
    \ 3) age of automated agriculture with high-speed development, and 4) age of smart\
    \ agriculture with emerging technologies. As a result, smart farming provides\
    \ a technologically-assisted road to sustainability. It entails the use of ICTs\
    \ in the cyber-physical cycle of farm management, utilizing technologies such\
    \ as the Internet of Things (IoT), cloud computing, robotics, and artificial intelligence\
    \ (AI).\n\n![](Images/9789815051452-C4-F1.jpg)**Fig. (1))**  \n\nThe four agricultural\
    \ revolutions. \n\nSmart farming is a sustainable farming technique that enhances\
    \ operational precision by giving each plant or animal exactly what it needs to\
    \ thrive in the best possible way, maximizing overall performance while reducing\
    \ waste, inputs, and pollutants. While smart agriculture is an advanced tech,\
    \ it simply takes field circumstances into account. Smart farming, on the other\
    \ hand, goes a step further by management responsibilities of data, which is reinforced\
    \ by context and situational awareness and driven by real-time events.\n\nSmart\
    \ farming profited in the early years by advances in new technologies such as\
    \ the Internet of Things, low-cost and enhanced sensors, actuators, and microprocessors,\
    \ high-bandwidth wireless technologies, cloud-based ICT systems, Big Data analysis,\
    \ AI, and robots. Farm equipment is no longer the only source of data; new services\
    \ exist that transform data into action. The use of IoT in agriculture attempts\
    \ to equip farmers with the tools they need to help them make better decisions\
    \ and automate their processes by providing goods, knowledge, and services that\
    \ improve productivity, quality, and profit.\n\nHydroponics is a method of growing\
    \ plants on a water surface without the need for soil. The nutrients plants get,\
    \ otherwise when grown in soil, are given manually as per the requirement. The\
    \ major advantage of this method is the time required for the growth and the absence\
    \ of any fertilizers in the process. When done in a very small area, hydroponics\
    \ does not require an automated system, but when done for mass production, an\
    \ automated system is vital. Automated Greenhouse Monitoring System provides the\
    \ automation, control and visualization for hydroponics. The automation is done\
    \ by a programmable Microcontroller Unit connected to various sensors required\
    \ for plant growth. The control is by the MCU along with the end user interface.\
    \ The complete process is run through a cloud server, which will always be active\
    \ and send alert and warning to the end user interface which comprises a website\
    \ and data visualization through numbers and graphs.\n\nThe main effort on the\
    \ cloud is data transmission at a very low data rate so that this project has\
    \ a vast reach. The end user part is simple, taking into consideration that farmers\
    \ can use this with zero effort. The system addresses the problems like the monitoring\
    \ and control of any automated system without the need of human intervention.\n\
    \n## DISCUSSION\n\n### Hydroponics\n\nThere are various methods to perform hydroponics,\
    \ the best and the most efficient one being NFT (Nutrient Film Technique) method.\
    \ This technique is very much popular for its simple yet efficient design. The\
    \ NFT is often used to grow fast-growing plants like lettuce and spinach. Apart\
    \ from these, commercially, green herbs and strawberries can be grown with this\
    \ method.\n\nIn this technique, a very shallow nutrient solution is poured down\
    \ the tubing. This tubing is adjusted at a slant and consists of a hole on the\
    \ upper side of the house, for which the small containers consisting of the seed/saplings\
    \ are needed. These containers are net pots to contain plants and the growing\
    \ media like coconut fibre and dried grass. The various parts of the NFT system\
    \ consist of a reservoir for the nutrient solution, a nutrient pump for the nutrients\
    \ up to the tubing, tubes to distribute water from the pump to the growing pots,\
    \ pots to contain plants/seeds and a return system to collect the solution and\
    \ send it back to the tubing to loop the process.\n\nThe grow tray and the storage\
    \ are two most important parts of the NFT process out of all other components.\
    \ The grow tray is made up of net pots that contain the plants and the nutritional\
    \ solution, as well as growing media such as coconut, perlite, and Rockwool. However,\
    \ certain plant species do not require these solutions because they receive adequate\
    \ moisture, nutrients, and oxygen from the system. The plant roots form a dense\
    \ mat in the channel, while the foliage lies on top, supported by a trellis system\
    \ in some cases (resembling a system where grapevines are grown).To make the best\
    \ NFT system, the right slope, flow rate and channel length are required. Also,\
    \ the plat roots have to be exposed properly to collect enough oxygen, moisture,\
    \ and most importantly nutrients \\[[1](#9789815051452-C4.html#r1)\\]."
