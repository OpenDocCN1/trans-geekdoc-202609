    # 医疗保健与区块链技术


    A professional field, particularly of science that is a sheer management and improvement
    of health through appropriate history taking, prevention, diagnosis, standard
    procedures, treatment, and ensuring recovery of various ailments in people is
    known as Healthcare \[2\]. We have witnessed the advancement trend in the medical
    sector and it is enumerated to have the most impact on the business and society
    for the next 35 years. Healthcare has a very wide spectrum – from having large
    glass like structures providing every medical facility in the urban areas to struggling
    for a decent treatment in rural areas. Looking on the development being made in
    the Healthcare sector, this gap is expected to widen in the future years \[3\].
    There is a buzz that a day will come when AI (Artificial Intelligence) driven
    robots will operate on patients. For now, it may seem as a long shot but nevertheless
    steps have already been taken so as to proliferate this domain of AI for decisions
    in treatment \[4\]. New and automated technologies are being introduced in the
    hospitals that work using IoT and are able to analyze the patient’s health status
    every time. Now we are taking into account various new factors emphasizing on
    health, like steps per day, water intake per day, number of floors climbed, and
    average walking speed \[5\]. Finding new and innovative reforms in this paradigm
    is quite tedious and requires huge deal of iterations. So, discovering new reforms
    has now extended beyond the boundaries for healthcare practices as they are being
    developed since 1950s. Although these prior reforms just focused on improving
    the safety and quality of healthcare, now the reforms are made to improve the
    quality of service ranging from local organization level to decision level organizations.
    More importantly, these are not only the tools that are driving healthcare sector
    to reach greater heights, but the organizational factors are also important to
    implement and sustain the new paradigm \[6\]. The most important factor affecting
    healthcare is diversity of the people. This brings in the theme of World Health
    Organization (WHO) for 2018 “Universal Health Coverage – Everyone, Everywhere”.
    Many factors like social, political, financial, geographical and cultural, affect
    the availability of all facilities for the people \[7\]. Even if somehow or someway,
    all these facilities are made available, what guarantees that it is given to them
    regularly and a constant check is kept on the patients? The first idea that strikes
    our mind is ‘Manpower’ and more or less many may run out of ‘Manpower’. So, the
    follow up solution is ‘Accountability’ – `the patients expect a certain standard
    of treatment due to a particular conduct`. They should be able to trust the personnel
    in front of them with their sensitive information.


    In recent years, with digitization creating an umbrella in this tech world, many
    health care centers are now shifting towards Big Data and IoT for the welfare
    of their patients and monitoring them continuously – `remote patient monitoring`
    \[8\]. This remote monitoring is increasing at a very faster rate from 7.1 Million
    in 2016 to an estimated 50.2 Million in 2021 \[9\]. The information and data so
    gathered may be vitals or records, is being stored and monitored on a regular
    basis thus in return giving birth to HIE – `Healthcare Information Interchange`.
    Determining which trials and methods are used on one patient at a place makes
    it useful for a doctor to implement it at another place on a person having the
    same problem, by checking the records \[10\]. By implementing this method, new
    treatments can be found and doctors can learn more about the disease, thus developing
    a `precision medicine`. This new paradigm of healthcare is preventing and predicting
    diseases beforehand using the data being collected from regular monitoring of
    the patients. By training multiple Machine Learning models, we can predict for
    which disease the patient is more vulnerable and doctors can treat that beforehand.
    We are no longer going to wait for the patient to get sick, instead we will be
    able to predict and prevent the disease before it will even get its grip on the
    human body \[4\]. This provides us with a gist of what has been so far implemented
    and what are the types of approaches being followed in the healthcare sector.


    ## Blockchain


    With the increase of cloud storage, Internet of Things and cyber-attacks, it is
    important to adapt methods capable of ensuring the security of the sensitive data
    being collected \[11\]. IoT can become more complicated in the future when it
    will be connected with `Network of Plentiful Things` (NPT). If we are stuck with
    the centralized structure of IoT, we will not only increase the traffic in the
    network but will also have no scalability in our network \[12\]. A blockchain
    like protocol, being first introduced by David Chaum in 1982 and further worked
    upon by multiple individuals in the upcoming years, has emerged as an alternate
    to overcome various challenges put forward by IoT. If we turn back the pages of
    history, the first blockchain was conceptualized in 2008 by Satoshi Nakamoto and
    was a core component in Bitcoin, a `crypto-currency` – where it worked as a ledger
    for all the transactions taking place \[13\]. In past few years, the concept of
    crypto currency has gained a huge deal of fame and importance because of the quirk
    it possesses. Blockchain is a decentralized, distributed and an immutable ledger
    containing all the transactions and data in blocks. It has three main parts –
    Block, Miner and Node. Not only being smart and secure, it ensures that no additive
    noise is added up and thus bringing no disruption to data, which was a problem
    in other security methods \[14\]. Furthermore, it enables integrating several
    core technologies like cryptographic hash, digital signature and distributed consensus
    mechanism \[13\]. Moreover, it can be private or public depending on the user.
    Blockchain creates an immutable ledger of the blocks in which each block contains
    timestamps of all the transactions taking place (Fig. **1**) \[8\]. Each block
    in Blockchain has two main headers – the block header and policy header. The block
    header contains information regarding the previous block, thus making the ledger
    immutable and the policy header is used to authorize the devices involved.


