- raw: "It came into existence because fast communication was required due to the\
    \ dynamic environment of vehicular scenario that demanded the high speed transfer\
    \ rate \\[[8](#9789815051452-C6.html#r8)\\]. Earlier the issue faced with 802.11a\
    \ was its low data rate of 54 Mbps that ultimately resulted in multiple overheads.\
    \ These protocols permit the vehicles to have a direct communication with no authentication\
    \ before joining the network. Researchers are further emphasizing on providing\
    \ the authentication and confidentiality assurance for security reasons.\n\nTable\
    \ 1 **Units description of VANET architecture.**  \n\n| **Unit** || **Abbrev.**\
    \ || **Description** |\n\n| --- | --- | --- |\n\n| Out Board unit || OBU || •\
    \ Realizes V2V communication  \n\n• Communication with other OBUs  \n\n• Data\
    \ reliability  \n\n• Network congestion control  \n\n• Radio access |\n\n| ---\
    \ | --- | --- |\n\n| Authentication Unit || AU || • Communicates with network\
    \ *via* OBU  \n\n• Responsibilities:  \n\n\\- Mobility  \n\n\\- Network functioning\
    \ |\n\n| Road Side Unit || RSU || • Based on IEEE 802.11p radio technology  \n\
    \n• Provides internet connectivity to OBUs. |\n\n![](Images/9789815051452-C6-F3.jpg)**Fig.\
    \ (3))**  \n\nCommunication architecture.  \n\n## Communication Architecture of\
    \ VANET\n\nVANETs are a victim of frequent disconnections in the dynamic vehicular\
    \ scenario where the unpredictable movement of the vehicles causes hindrance in\
    \ the stability mechanism of the network. Once the network is established, the\
    \ information can be disseminated and shared through data packets. Since the vehicles\
    \ are mobile in nature so connection maintenance is a tough task for moving vehicles\
    \ where the neighbour nodes can also transcend the transmission range. As a solution\
    \ to which access points in terms of relay nodes can be pre-deployed to maintain\
    \ the connectivity of the network \\[[9](#9789815051452-C6.html#r9)\\]. The vehicles\
    \ are equipped with the Global Positioning system (GPS) by virtue of which a vehicle\
    \ can monitor the network and the nodes that will greatly be useful for collision\
    \ avoidance and to attain information of location. The communication architecture\
    \ is shown in Fig. [(**3**)](#9789815051452-C6.html#f3).\n\nEvery vehicular node\
    \ is required to fully process the raw information for the purpose of which, it\
    \ directly needs a handsome storage capacity. So, it uses rechargeable batteries\
    \ to generate the power continuously hence making the network more efficient in\
    \ terms of power and energy. Table [**2**](#9789815051452-C6.html#t2) represents\
    \ communication architecture.\n\nTable 2 **Communication architecture representation.**\
    \  \n\n| **Communication** || **Functions** |\n\n| --- | --- |\n\n| In- Vehicle\
    \ communication || • Vehicle performance detection  \n\n• Drivers physical condition\
    \  \n\n• Vehicle’s inside environment for safety purpose |\n\n| --- | --- |\n\n\
    | V2V communication || • Communication between two or more vehicles  \n\n• Sharing\
    \ information:  \n\n\\- routing information  \n\n\\- Alerts  \n\n\\- Driver to\
    \ driver information  \n\n• Naive broadcasting (periodic)  \n\n• Intelligent broadcasting\
    \ (overcome overheads caused due to the generation of broadcast messages in large\
    \ number) |\n\n| V2I communication || • Communication between the vehicles and\
    \ the infrastructure on the roads  \n\n• Vehicle density |\n\n| Vehicle to Broadband\
    \ cloud  \n\nComputing || • For the active driver assistance  \n\n• For vehicle\
    \ tracking |\n\n| Routing based communication || • Combination of V2I and V2V\
    \  \n\n• Presents a unicast method  \n\n• Message transmitted in multi hop fashion\
    \ till the time it catches up with its destined vehicle. |\n\n## Blockchain meets\
    \ VANET\n\nSeveral studies are conducted for resolving the security issues of\
    \ VANET, for which blockchain technology is widely used. VANET is used in combination\
    \ with blockchain \\[[10](#9789815051452-C6.html#r10)\\]. Blockchain technology\
    \ is used to ensure that data are tamper-resistant and secure. In some of the\
    \ algorithms, the registration of the vehicles is mandatory with Registration\
    \ Authority. The road infrastructure with vehicles and RSU make a blockchain network\
    \ that reduces security issues. The data generated from the vehicular networks\
    \ are saved in the cloud for providing data support related applications \\[[11](#9789815051452-C6.html#r11)\\\
    ]. Blockchain also introduces the concept of privacy protection for intelligent\
    \ transportation systems. Fig. [(**4**)](#9789815051452-C6.html#f4) represents\
    \ the Blockchain system.\n\n![](Images/9789815051452-C6-F4.jpg)**Fig. (4))** \
    \ \n\nBlockchain System \n\nA Blockchain system uses a kind of distributed network\
    \ that consists of various independent nodes and they generally do not have a\
    \ trust-based network \\[[12](#9789815051452-C6.html#r12)\\]. Every node takes\
    \ part in data management. In the implementation, a new block is formed by the\
    \ participation of various nodes and that new block is included in the blockchain\
    \ system. All nodes in the system manage the information that ensures the security\
    \ of data in the blockchain system. The blockchain can manage the information\
    \ in vehicles as any node can access the previous history while using the public\
    \ blockchain. In the majority of blockchain based algorithms, a new block is generally\
    \ shared with all the vehicular nodes. But in some of the cases, the blocks are\
    \ not shared outside the boundaries of countries as some countries may not be\
    \ connected directly with roads so the information of a vehicle in one country\
    \ may not be suitable for the vehicle in another country. The algorithm can be\
    \ designed on the basis of various parameters. The blockchain network is made\
    \ on the agreement of vehicular nodes present in the network \\[[13](#9789815051452-C6.html#r13)\\\
    ]. The clusters formed in VANET \\[[14](#9789815051452-C6.html#r14)\\] are sometimes\
    \ useful in blockchain systems as the cluster heads are accountable for managing\
    \ the blockchain system. So, clustering in VANET \\[[15](#9789815051452-C6.html#r15)\\\
    ] enhances the security of the network by using the blockchain system.\n\n## Trust\
    \ based Models in VANET for Blockchain Technology\n\nThere exist three types of\
    \ models that are trust based.\n\n*   Entity-based Trust Model\n\n*   Data Centric\
    \ Trust Model\n\n*   Hybrid based Model\n\nFig. [(**5**)](#9789815051452-C6.html#f5)\
    \ represents the trust based models in VANET \\[[16](#9789815051452-C6.html#r16)\\\
    ]. The opinion of the other nodes matters in the entity based model as here trustworthiness\
    \ of the nodes is required by using any specified algorithm. But the limitation\
    \ is the high mobility of the vehicular nodes, as passing of the information is\
    \ difficult in dynamic topology \\[[17](#9789815051452-C6.html#r17), [18](#9789815051452-C6.html#r18)\\\
    ] and high mobility. However, the data centric model focuses on the event information\
    \ shared by the nodes instead of the node details in the entity based as it is\
    \ important to share accurate information between the vehicular nodes \\[[19](#9789815051452-C6.html#r19),\
    \ [20](#9789815051452-C6.html#r20)\\]. Whereas, the hybrid approach uses the combination\
    \ of the entity based and data centric model. So here the importance is given\
    \ to both the trustworthiness of the vehicle and event information.\n\n![](Images/9789815051452-C6-F5.jpg)**Fig.\
    \ (5))**  \n\nTrust Based Models  \n\n## CONCLUSION"
