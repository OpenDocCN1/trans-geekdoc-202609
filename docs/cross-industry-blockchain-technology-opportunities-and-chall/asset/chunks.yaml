    \ |\n\n| \\[7\\] || Veera Vanitha D., Nivitha S., Pritha R., Saranya J., Shobika\
    \ T.. Automatic Drip Irrigation System using Raspberry PI and Wireless Sensor\
    \ Networks.IJIRSET2011 |\n\n# Recent Trends in IoT Healthcare-based Blockchain\
    \ Solutions\n\n**Himanshu Sharma^([1](#9789815051452-C5.html#aff1))****,** **Hardik\
    \ Chaurasia^([1](#9789815051452-C5.html#aff1))****,** **Arpit Jain^([2](#9789815051452-C5.html#aff2),\
    \ [\\*](#9789815051452-C5.html#cor1))****,** **Nazir Ahmed^([1](#9789815051452-C5.html#aff1))**\
    \  \n\n¹ Electrical and Electronics Engineering Department, University of Petroleum\
    \ and Energy Studies, Dehradun, India  \n\n² AI Practitioner, QpiAI India Pvt.\
    \ Ltd., Bengaluru, India  \n\n## Abstract\n\nThis review revolves around the idea\
    \ of inculcating and amalgamating all the possible forte of healthcare that can\
    \ be governed and handled by Blockchain Technology (BCT). Relating back to all\
    \ the archaic systems involved in the healthcare sector, the entire process was\
    \ quite slow and many a time leads to a significant amount of delay in any process,\
    \ be it report of the patient, tracking data from the smart watch, ruling out\
    \ appointment from a doctor, medicine prescription and many more. BCT in fusion\
    \ with the Internet of Things (IoT), leads to generating a completely revolutionary\
    \ and robust system that expands its range from very minute detail to a completely\
    \ new horizon. As predicted by 2022, more than 18 billion devices will be available\
    \ across the world; thus, managing this data that is related to healthcare, devising\
    \ BCT for same can yield some exponential results in advancement in health care\
    \ sector. This entire healthcare data is quite vulnerable to all the cyber-attacks\
    \ and all the collected valuable information may be at a huge risk; hence by deploying\
    \ BCT, security can be greatly increased. BCT is nothing but an immutable time\
    \ stamp series of records, just like an array working; when even one of the blocks\
    \ is initialized with any value of information, that piece of information will\
    \ remain there forever. This review attempts to group together all such various\
    \ fields that can be brought under a single umbrella covering the range of fields\
    \ that can be governed by BCT in accordance with IoT for the development of health\
    \ care sector.\n\n**Keywords:** Blockchain Technology, Internet of Things, Hash\
    \ Code, Healthcare, Protocols.  \n\n* * *\n\n^(\\*) **Corresponding author Arpit\
    \ Jain:** AI Practitioner, QpiAI India Pvt. Ltd., Bengaluru, India; E-mail: [ajain@ddn.upes.ac.in](mailto:ajain@ddn.upes.ac.in)\
    \  \n\n## INTRODUCTION\n\nThe recent advances for the promotion of the crypto\
    \ currency-based ledger system known as Block Chain Technology (BCT) have taken\
    \ a huge leap in IoT and health care. As everything is web controlled so making\
    \ use of BCT and IoT to\n\ngovern the health sector would be a good opportunity\
    \ to make this entire system of health care more robust and highly efficient.\
    \ Internet of Things (IoT) is nothing but a sphere of interconnectivity of devices\
    \ *via* the internet so that each and every device can be controlled through web.\
    \ It encompasses a broad range of applications such as health management, smart\
    \ homes, traffic, agriculture, and weather monitoring to name just a few because\
    \ its growth is quite humungous at a particular speed. IoT devices are quite light\
    \ \\[[1](#9789815051452-C5.html#r1)\\] and thus lead to shallow energy footprints.\
    \ Having just this less amount of energy, the most of it is completely utilized\
    \ in the main function that the device performs. Hence, leaving very few amount\
    \ of energy for applications such as security and privacy. This opens the path\
    \ for BCT as it overcomes the problem mentioned before as it is secure, distributed,\
    \ immutable, transparent, *etc.* The protocols governing BCT make the information\
    \ secure in the form of block transactions that simply correlate with the respective\
    \ application. Once this chain of blocks is completely filled, it appends to other\
    \ chains *via* a process called as mining process and this process is performed\
    \ by specific nodes called as miners. Although BCT deployment is not easy as it\
    \ seems as there are various problems associated with it. Deploying BCT and IoT\
    \ for the application such as healthcare is quite promising and these are well\
    \ equipped. A system proposed \\[[1](#9789815051452-C5.html#r1)\\] for Remote\
    \ Patient Monitoring (RPM) is mainly focused on providing health care facilities\
    \ other than hospitals. The whole concept is about an IoT wearable device that\
    \ the patient wears and the device provides all the vital information *via* cloud\
    \ protected by BCT, to the respective health care center. Although there are various\
    \ problems associated with IoT like network overhead delay, mismanagement of the\
    \ data and many more but BCT very effectively overcomes all these problems. BCT\
    \ encompasses various positive points including privacy, trustworthiness, smart\
    \ contracts, DDoS notification and mitigation but other problems may persist as\
    \ bandwidth limit, network issues and many more. Before critically analyzing every\
    \ aspect discussed so far, let us dive into its very basics.\n\n### Healthcare"
