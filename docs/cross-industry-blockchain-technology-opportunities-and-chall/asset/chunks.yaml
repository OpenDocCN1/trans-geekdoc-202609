    它的出现是因为由于车载场景的动态环境，需要快速通信，从而要求高速传输率 \[8\]。此前，802.11a 面临的问题是其低数据率为 54 Mbps，最终导致多种开销。这些协议允许车辆在加入网络前无需身份验证即可进行直接通信。研究人员进一步强调出于安全原因提供身份验证和机密性保障。


    ## 表 1 VANET 架构单元描述


    | 单元 | 缩写 | 描述 |

    | --- | --- | --- |

    | 车载单元 | OBU | • 实现 V2V 通信<br>• 与其他 OBU 通信<br>• 数据可靠性<br>• 网络拥塞控制<br>• 无线接入 |

    | 身份验证单元 | AU | • 通过 OBU 与网络 `via` 通信<br>• 职责：<br>  - 移动性<br>  - 网络运行 |

    | 路侧单元 | RSU | • 基于 IEEE 802.11p 无线技术<br>• 为 OBU 提供互联网连接。 |


    ![](img/9789815051452-C6-F3.jpg)


    **图 (3)**


    通信架构。


    ## VANET 的通信架构


    VANET 在动态车载场景中频繁断连，车辆不可预测的运动会阻碍网络稳定性机制。一旦网络建立，信息可以通过数据包传播和共享。由于车辆本身具有移动性，因此连接维护对移动车辆来说是一项艰巨任务，邻居节点也可能超出传输范围。作为解决方案，可以预先部署中继节点作为接入点以维持网络连接
    \[9\]。车辆配备了全球定位系统（GPS），因此车辆可以监控网络和节点，这对于避免碰撞和获取位置信息将非常有用。通信架构如图 (**3**) 所示。


    每个车载节点都需要完全处理原始信息，为此，它直接需要大容量存储。因此，它使用可充电电池持续产生电力，从而在功率和能源方面使网络更加高效。表 **2** 表示通信架构。


    ## 表 2 通信架构表示


    | 通信 | 功能 |

    | --- | --- |

    | 车内通信 | • 车辆性能检测<br>• 驾驶员身体状况<br>• 车辆内部环境（出于安全目的） |

    | V2V 通信 | • 两辆或多辆车辆之间的通信<br>• 共享信息：<br>  - 路由信息<br>  - 警报<br>  - 驾驶员与驾驶员之间的信息<br>•
    天真广播（周期性）<br>• 智能广播（克服因生成大量广播消息而导致的开销） |

    | V2I 通信 | • 车辆与道路基础设施之间的通信<br>• 车辆密度 |

    | 车辆到宽带云计算 | • 用于主动驾驶员辅助<br>• 用于车辆跟踪 |

    | 基于路由的通信 | • V2I 和 V2V 的组合<br>• 提供单播方法<br>• 消息以多跳方式传输，直到与目标车辆连接。 |


    ## 区块链与 VANET


    已进行多项研究以解决 VANET 的安全问题，为此广泛使用区块链技术。VANET 与区块链相结合使用 \[10\]。区块链技术用于确保数据防篡改且安全。在某些算法中，车辆必须向注册机构注册。道路基础设施与车辆和
    RSU 构成区块链网络，从而减少安全问题。车载网络生成的数据保存在云中，以提供数据支持相关应用 \[11\]。区块链还为智能交通系统引入了隐私保护的概念。图
    (**4**) 表示区块链系统。


    ![](img/9789815051452-C6-F4.jpg)


    **图 (4)**


    区块链系统


    区块链系统使用一种分布式网络，由各种独立节点组成，它们通常没有基于信任的网络 \[12\]。每个节点都参与数据管理。在实现中，新块由各种节点参与形成，该新块被包含在区块链系统中。系统中的所有节点都管理信息，以确保区块链系统中数据的安全性。区块链可以管理车辆中的信息，因为任何节点在使用公共区块链时都可以访问之前的历史记录。在大多数基于区块链的算法中，新块通常与所有车载节点共享。但在某些情况下，块不会在国家边界之外共享，因为有些国家可能没有直接道路连接，因此一个国家车辆的信息可能不适用于另一个国家的车辆。算法可以基于各种参数设计。区块链网络是基于网络中存在的车载节点达成一致而建立的
    \[13\]。VANET 中形成的集群 \[14\] 有时在区块链系统中很有用，因为集群头负责管理区块链系统。因此，VANET 中的聚类 \[15\] 通过使用区块链系统增强了网络的安全性。


    ## 基于区块链技术的 VANET 信任模型


    存在三种基于信任的模型。


    * 基于实体的信任模型

    * 数据中心信任模型

    * 混合模型


    图 (**5**) 表示 VANET 中的基于信任的模型 \[16\]。在基于实体的模型中，其他节点的意见很重要，因为这里需要使用任何指定算法来确定节点的可信度。但其局限性是车载节点的高移动性，因为在动态拓扑中信息传递困难
    \[17, 18\] 且移动性高。然而，数据中心模型关注节点共享的事件信息，而不是基于实体模型中的节点详细信息，因为在车载节点之间共享准确信息很重要 \[19,
    20\]。而混合方法使用基于实体和数据中心模型的组合。因此，这里既重视车辆的可信度，也重视事件信息。


    ![](img/9789815051452-C6-F5.jpg)


    **图 (5)**


    基于信任的模型


    ## 结论


