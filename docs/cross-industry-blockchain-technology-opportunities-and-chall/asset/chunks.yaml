    \ by technology capability in the financial services industry \\[[64](#9789815051452-C2.html#r64)\\\
    ].\n\nThe project goal was to harness blockchain to improve Germany's security\
    \ settlement FMI back office services. Central bank of Germany is Deutsche Bundesbank\
    \ \\[[65](#9789815051452-C2.html#r65)\\] and is one of the world's biggest securities\
    \ exchange centers \\[[66](#9789815051452-C2.html#r66)\\]. It manages and operates\
