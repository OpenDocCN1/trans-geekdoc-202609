    ![](img/9789815051452-C2-F5.jpg)**图 (5))**


    贸易金融智能合约。(ING/《华尔街日报》– “银行转向虚拟世界以现代化实物商品交易”，作者：Stephanie Young，2017 年 4 月 4 日，《华尔街日报》[`www.wsj.com/articles/banks-`](https://www.wsj.com/articles/banks-)
    turn-to-virtual-world-to-modernize-physical-commodities-trading-1491 303623)


    智能合约吸引了商人，因为它们有助于实现自动化组织的理念，该组织除资金支持人员外，不依赖任何人工输入。在世界上最大的公共区块链中，以太坊是针对智能合约应用进行良好优化的平台。去中心化自治组织（DAO）已在以太坊平台上为自动化业务推出了风险投资基金。DAO
    的运作方式如下：


    *   智能合约由一群人制定，用于运行组织。


    *   人们提供资金（在初始资金期）购买代币，以向 DAO 表示所有权。这被称为首次代币发行（ICO）或众筹。它使组织能够建立所需资源。


    *   资金期结束后，DAO 开始运行。


    *   人们可以建议 DAO 投资资金，成员有权投票批准/拒绝 \[58\]。


    DAO 实体“以太坊”系统于 2016 年 6 月遭到攻击。在攻击中，入侵者转移了 350 万“以太币”加密货币（价值约 50 万美元）。入侵者发现了 DAO
    软件中的一个漏洞，但基础以太坊区块链未受损害。这次攻击是区块链之上应用层存在的安全漏洞的一个实例。为了追回被盗资金，以太坊社区决定对以太坊区块链进行“硬分叉”。以太坊区块链分裂为两种活跃的加密货币，分别称为
    Ether/Ethereum One/Ethereum Core 和 Ethereum Classic。前者包含恢复被盗资金的硬分叉，后者包含黑客控制下的被盗资金原始交易。DLT
    与自动化智能合约的使用除了技术漏洞之外，还引发了一系列监管和法律问题。这些问题与管辖权、责任、合同的可撤销性和修订有关。


    ## 实验实践


    本节讨论了最佳实践，包括银行在其央行数字货币计划中采用的方法。


    ### Jasper 项目


    该项目由加拿大银行、加拿大支付清算协会、几家其他加拿大组织和区块链组织 R3 于 2016 年 3 月启动 \[59\]。


    #### 第一阶段


    JASPER 第一阶段于 2016 年 3 月启动，旨在基于 DLT 技术构建银行间结算的概念验证 \[16\]。对于每个参与的以太坊实体，都创建了分布式节点。加拿大银行使用基于自主交易代理的智能合约来批准或拒绝交易。Jasper
    第一阶段的每笔交易都在每个节点上同步和更新 \[60\]。


    #### 第二阶段


    为解决 Jasper 第一阶段的问题，第二阶段于 2016 年 9 月引入，旨在探索并在不同的 DLT 平台上重新创建 Jasper 第一阶段原型。Jasper
    第二阶段在 Corda 上开发。Jasper 第二阶段在第一阶段参与者的基础上引入了两个新参与者。与 Jasper 第一阶段实现相比，第二阶段实现了基于 Corda
    的流动性节约机制（LSM）和原子结算能力。Jasper 第二阶段具有向后兼容性，以支持第一阶段的功能，包括延期和原子净额结算选项。


    #### 第三阶段


    2017 年 10 月，加拿大银行启动了 Jasper 第三阶段，以利用 DLT 功能进行多种资产类型交换。参与 Jasper 第三阶段的组织包括加拿大银行、TMX
    集团、加拿大支付清算协会、R3 和 Accenture。TMX 是一家加拿大金融组织，为许多证券交易所提供服务，并拥有加拿大证券存管处 \[61\]。CDS
    是加拿大证券存管处的结算中心和全国清算中心 \[62, 63\]。Jasper 第三阶段的目标是开发基于 DLT 的概念验证，允许多种资产类型在共享账本上交换。Jasper
    第三阶段在集成平台上实现了代币化金融资产和原子结算能力。该原型托管在 Microsoft 云上，并在 Corda v2.0 上实现。


    ### BLOCKBASTER 项目


    BLOCKBASTER 项目由德国交易所集团和德国 Bundesbank 于 2016 年 3 月启动，受金融服务行业技术能力的推动 \[64\]。


    该项目的目标是利用区块链改善德国证券结算 FMI 后台服务。德国中央银行是德国联邦银行 \[65\]，也是世界上最大的证券交易中心之一 \[66\]。它管理并运营一家位于卢森堡的结算所“Clearstream”。BLOCKBASTER
    项目启动旨在开发基于 DLT 的现金证券结算原型。BLOCKBASTER 项目使用了名为 Hyperledger Fabric 和 Digital Assets
    的两个分布式账本平台，以实现生命周期管理原型和全面的银行间债券发行。现金资产和代币化债券在 BLOCKBASTER 项目上进行证券结算。BLOCKBASTER
    项目仅限于基于 DLT 的结算，仅匹配现金或证券交易，以便评估 DLT 的适用性并快速原型设计。银行利率支付功能已在 BLOCKBASTER 项目中构建。做市、债券定价和
    LSM 结算功能不在 BLOCKBASTER 项目范围内。


    ### SALT 项目


    SALT 项目由巴西中央银行于 2016 年 9 月启动，旨在探索中央银行的 DLT 用例。确定了四个用例，以选择其中一个进行实施。确定的系统是交易结算替代系统（SALT），作为巴西
    RTGS 系统的备用系统，基于多个 DLT 平台。SALT 项目的第一阶段是于 2016 年 9 月开始，在六十天内在以太坊分叉系统上实现概念验证 \[67\]。在
    SALT 的第二阶段，它于 2017 年 1 月开始，在四十五天内在 Quorum 和 Fabric 上实现 \[67\]。除此之外，SALT 项目还实现了代币化的巴西雷亚尔（BRL）央行数字货币资产。


    ### UBIN 项目


    '
