- raw: "The challenges for Big Data are described as data representation, redundancy\
    \ reduction and data compression, data life cycle management, advances in the\
    \ analytical process, data confidentiality, energy management and sustainability,\
    \ extensibility and scalability, and collaboration \\[[29](#9789815051452-C3.html#r29)\\\
    ]. It translates problem into data complexity, computational complexity, and system\
    \ complexity. Three factors that contribute to Big Data: Large Data complexity\
    \ (*i.e.*, data forms, size, architectures, *etc.*). Patterns, relationships,\
    \ insufficiency, instability, and distribution result in increasing computational\
    \ complexity and new computing concepts. The growing complexity of the system\
    \ thus makes it difficult to meet the needs of advanced energy-efficient computing\
    \ and Big Data processing.\n\n### Data Mining Techniques for Big Data\n\nData\
    \ mining methods have been around in collaboration with data warehouses for many\
    \ years and have now gained greater popularity with the emergence of Big Data.\
    \ Data analytics and the growth of both structured and unstructured data have\
    \ led to the improvement in data mining techniques, as businesses now deal with\
    \ broader datasets with more diverse content. The data mining method is further\
    \ automated by artificial intelligence and machine learning \\[[30](#9789815051452-C3.html#r30)\\\
    ]. Fig. ([**6**](#9789815051452-C3.html#f6)) illustrates the data mining techniques\
    \ of Big Data.\n\n#### Clustering\n\nThe main purpose of clustering is to aggregate\
    \ data objects through data discovery, so that the grouped objects are identical\
    \ or closely linked but distinguished from the other classes \\[[31](#9789815051452-C3.html#r31)\\\
    ]. The fundamental principle of clustering is to calculate distance between data\
    \ objects. Many techniques have been developed to satisfy the requirement of handling\
    \ more complex data types or structures. The key clustering approach includes\
    \ hierarchical clustering, k-mean (partitioning clustering), high-dimensional\
    \ approaches, density-based clustering, clustering based on co-occurrence, and\
    \ other evolutionary methods. By grouping those with the nearest mean, the commonly\
    \ used k-mean clustering technique divides observation into different clusters\
    \ ‘k’. It is noteworthy that due to the ongoing growth of data mining techniques,\
    \ an alternative approach and development exists.\n\n#### Classification\n\nClassification\
    \ is the most basic technique of data mining aimed at classifying data objects\
    \ into predefined classes. To accurately optimize the classifier to perform the\
    \ given classification task effectively, it requires a few rules that are defined\
    \ through data exploration. The formal definition of the classification underlying\
    \ the algorithm \\[[32](#9789815051452-C3.html#r32)\\]. There are several different\
    \ methods for classification, and each has its own merits \\[[33](#9789815051452-C3.html#r33)\\\
    ]. Decision Trees \\[[34](#9789815051452-C3.html#r34)\\], Support Vector Machines\
    \ (SVM) \\[[35](#9789815051452-C3.html#r35)\\] Naive Bayes Codes \\[[36](#9789815051452-C3.html#r36)\\\
    ], Neural Networks and k-Nearest Neighbours \\[[37](#9789815051452-C3.html#r37)\\\
    ] are some of the best-known and commonly used classification techniques.\n\n\
    #### Association Mining Rules\n\nThe Association Rule Mining is introduced on\
    \ a dataset for the supermarket \\[[38](#9789815051452-C3.html#r38)\\], with the\
    \ goal of investigating co-occurrences between data items. It is a technique for\
    \ detecting the simultaneous occurrence that occurs more often than the average\
    \ level of co-occurrence that exists in the data collection. It distinguishes\
    \ the relationship that exits among the data objects.\n\n#### Regression\n\nDue\
    \ to its ability to reduce dimensions, extract information, provide estimates\
    \ and forecast, regression is also considered a significant data mining technique.\
    \ The basic regression principle is to analyse the relationship between two or\
    \ more variables in order to assist in prediction and decision making. The regression\
    \ analysis is widely applied to a wide range of topics, and several developments\
    \ have also been made to date, so it is not feasible to summarize all of this\
    \ in this chapter. Some of the Data Mining 's proven regression techniques include\
    \ linear and nonlinear regression, lasso regression, logistic regression, and\
    \ tree regression.\n\n#### Social Network Analysis\n\nA comparatively recent Data\
    \ Mining technique outlined here is the Social Network Analysis (SNA), based on\
    \ the graph theory principle. To build a social network, it investigates the relation\
    \ and content between objects in a large stack of knowledge. The most widely used\
    \ measuring technique for evaluating social network behaviours is ‘degree’ \\\
    [[39](#9789815051452-C3.html#r39)^(\\-)[41](#9789815051452-C3.html#r41)\\].\n\n\
    ### Applications of Big Data\n\n#### Healthcare Sector\n\nThere is a significant\
    \ improvement in healthcare with Big Data. It increased the amount of information\
    \ collected over the last few years. Technology development has also made it easier\
    \ to gather and analyse data from various sources such as insurance companies,\
    \ hospitals, labs, and the offices of physicians. Doctors have historically used\
    \ their discretion, and in recent years, this has been changed to a more evidentiary\
    \ treatment. The modern method includes analysing clinical records and making\
    \ recommendations about treatment on the best evidence available. When it comes\
    \ to the use of Big Data, the healthcare sector has tended to lag from other industries\
    \ such as financial services and sales.\n\n![](Images/9789815051452-C3-F6.jpg)**Fig.\
    \ (6))**  \n\nData mining techniques. \n\nBig Data is used in healthcare to forecast\
    \ pandemics, cure illness, enhance quality of care and stop premature death and\
    \ the different application of Big Data in health sector is illustrated in Fig.\
    \ ([**7**](#9789815051452-C3.html#f7)). A lot of fitness devices recently have\
    \ hit the market like Fitbit, Samsung Gear Fit and Jawbone, helping us to monitor\
    \ our progress. Eventually we will be able to share the data with our doctor,\
    \ who will be able to use it when we see him with an ailment as part of their\
    \ clinical diagnosis. When more and more data is collected, physicians will be\
    \ able to offer treatment choices for certain patients with specific disorders,\
    \ genetic factors and lifestyle. The Big Data is kept in siloes inside the computer\
    \ systems, hospitals, and clinics of numerous physicians \\[[42](#9789815051452-C3.html#r42),\
    \ [43](#9789815051452-C3.html#r43)\\]. To make efficient use of them all in the\
    \ future, it is needed to release the information with everyone.\n\n![](Images/9789815051452-C3-F7.jpg)**Fig.\
    \ (7))**  \n\nImplementation of Big Data in health sector. "
