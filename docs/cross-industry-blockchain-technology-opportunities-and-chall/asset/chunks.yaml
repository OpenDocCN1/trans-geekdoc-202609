    A greenhouse makes it conceivable to reproduce a different atmosphere and thus
    develop nourishment that would not typically develop in the zone. Also, making
    the nursery mechanized enables people to develop their own nourishment or plants
    at home without continually look after them. The purpose of greenhouse is to maintain
    the nursery temperature in an ideal range for ideal plant development utilizing
    a temperature control framework. Another goal is to explore if the watering system
    is solid, to get an ideal soil dampness level for the picked plant \[[3](#9789815051452-C4.html#r3)\].


    The room temperature is thought to be at 15 - 21°C. Another presumption is that
    the temperature outside of the greenhouse, will consistently be colder or equivalent
    to the temperature within the greenhouse. The plant that will be placed in the
    greenhouse will be favoured to temperature at room temperature or above. The consequence
    of the exploration questions depend on time limited experiments. This result could
    be different over the long haul and it is accordingly not substantial in that
    case. The value when the dirt is viewed as excessively wet or too dry is dependent
    on the type of the soil utilized. These qualities cannot be utilized on different
    types of soils that have to be exclusively set with the assistance of the tests.


    As for the field of hydroponics, there is a requirement for a greenhouse and many
    advantages are linked to it. Some of the advantages are as follows.


    1. It will help to maintain optimum conditions, as per the plant grown.


    2. It will ensure maximum photosynthesis performance by providing required conditions.


    3. It provides improved water use.


    4. It shortens crop cycles `i.e.` plants grow faster as compared to traditional
    farming methods.


    5. It will help to resolve the problems caused by soil depletion.


    For this study, more economical and compact greenhouse under 2x2 m is implemented
    that enclosed a hydroponics system of under 1.5x1.5 m.


    This monitoring system comprises interfacing of sensor with the main MCU and will
    control them, based on the requirement for the plant, e.g water level sensor is
    interfaced with the motor to keep the level of water under a threshold by controlling
    the rate of water being pumped. Along with that, all the data is sent to the cloud
    using a server and displayed on a website in the form of graphs, charts, and numbers
    \[[4](#9789815051452-C4.html#r4)\].


    ### Hardware


    The hardware part of this system is divided into three parts -AGMS module, hydroponic
    system, and greenhouse. The hydroponic system and greenhouse have already been
    discussed shown in Fig. [(`3`)](#9789815051452-C4.html#f3).


    Al the above-displayed sensors work in synchronization with each other. Every
    threshold in-capacitance of one sensor directly impacts the other one.


    The AGMS module consists of a Micro Controller Unit embedded in a waterproof casing
    that is connected to various sensors listed as:


    `DHT22`: A digital temperature and humidity sensor with good accuracy with ±1^oC.


    ![](Images/9789815051452-C4-F3.jpg)**`Fig. (3))`**


    Block Diagram of Project.


    `Water level sensor`: Water level sensing module gives an analog reading the height
    of water and has to be further converted into cm \[[5](#9789815051452-C4.html#r5)\].


    `pH sensor`: Detects the pH value of the solution.


    `Buzzer`: Makes a sound whenever there is a high value at the input.


    `L293d`: Motor driver IC to control the pump.


    `Touch Screen`: To display the values of various sensors in multiple forms. It
    is programmable.


    `ESP8266`: For sending the data to the server. It is a Wi-Fi module working at
    2.4 GHz.


    `LDR`: It is a Light Dependent Resistor that gives an analog output value based
    on the intensity of light falling on it.


    The Micro Controller Unit used is Arduino Mega. Arduino Uno is not used here despite
    the familiarities because of the number of ports and memory of the Mega.


    ### Server and Cloud


    For any efficient monitoring system, all the data has to be visualized and displayed
    on any device. For this purpose, we use a server which is programmable like a
    Digital Ocean Droplet or a pre-made one like Thingspeak, as shown in Fig. ([`4`](#9789815051452-C4.html#f4)).


    The data from the sensors is processed by the Arduino to Thingspeak using an API
    key and ESP8266, a Wi-Fi module \[[6](#9789815051452-C4.html#r6)\]. This process
    is simple as one has to give an API key to get the data as shown in Fig. ([`4`](#9789815051452-C4.html#f4)).
    The only limitation of Thingspeak is that it is not programmable and there are
    very limited functions whereas, in the case of Digital Ocean, it is totally customised
    right from the memory, number of cores in the processor, and the type of operating
    system for the server. The data from the server is then captured by a webpage
    using API keys in JS and displayed in it. The website can be made from the scratch
    or from custom templates readily available on the internet. The main thing to
    keep in mind is the APIs for transferring the data \[[7](#9789815051452-C4.html#r7)\].


    Each sensor data is individually sent to the cloud without any cross-dependency.
    Each sensor will be modular `i.e.` they can be easily disconnected and replaced
    when needed, Fig. [(`5`)](#9789815051452-C4.html#f5). The sensors will be connected
    to the ports of the module casing and can even be made wireless with the help
    of any Bluetooth or any Wi-Fi modules, as shown in Fig. [(`6`)](#9789815051452-C4.html#f6).


    ## WORKING


    The total system works in synchronization with the hydroponics. To make it simpler,
    we will break the procedure and working into steps. The first step is to select
    the plant type to be grown. Then selection of the nutrients and all other parameters
    like the humidity, optimum temperature, water level, water flow, growing medium
    `etc.` is taken care of. Secondly, all these are assembled to the hydroponics
    system through the NFT technique. The whole hydroponics system is enclosed by
    a greenhouse that also has the main module in it. Now this module with all the
    sensors will sense the data at customized intervals and send it to the cloud.


    The threshold of each sensor is already fed to the module in the programming.
    When any sensor goes out of the threshold, the alarms get activated. In this case,
    the alarms are the buzzer and the alerts `i.e.` website alerts, GSM alerts, twitter
    alerts and mail alerts. Also, some of the modules will automatically adjust the
    threshold, `e.g.` when the water level goes above the optimum level, the flow
    rate of the motor decreases. For the humidity, exhaust fans and sprayers are used
    whereas for the temperature, high wattage incandescent bulbs are used.


    ![](Images/9789815051452-C4-F4.jpg)**`Fig. (4))`**


    Thinkspeak website ![](Images/9789815051452-C4-F5.jpg)**`Fig. (5))`**


    Ubuntu server ![](Images/9789815051452-C4-F6.jpg)**`Fig. (6))`**


    Setting up configuration


    ## CONCLUSION


    Agriculture was the first occupation of humans; it is the foundation for all the
    Industries. The world’s population is increasing day by day and there is an increasing
    requirement of food. In India, 3000 children die every day due to malnutrition.


    The greenhouse monitoring system gives the flexibility of growing crops in any
    seasons. This enhances the moderate cost and availability of seasonal vegetables
    throughout the year. The crops that are grown with the techniques like hydroponics
    and aquaponics and are free from pesticides are nowadays called organic food.


    The techniques of Aquaponics and hydroponics give flexibility to the soil because
    these processes do not require any soil so any crop can be grown in any part of
    the world and the greenhouse can be constructed anywhere in the world so import
    and export will be quite less. It can be implemented for any fresh vegetables.


    ## CONSENT FOR PUBLICATION


    Not applicable.


    ## CONFLICT OF INTEREST


    The authors declare no conflict of interest, financial or otherwise.


    ## ACKNOWLEDGEMENTS


    Declared none.

    '
  trans: '


    温室使得复制不同的大气环境成为可能，从而培育出在该地区通常无法生长的作物。此外，将苗圃机械化使人们能够在家中无需持续照料即可种植自己的食物或植物。温室的目的是利用温度控制系统，将苗圃温度维持在适合植物理想生长的理想范围内。另一个目标是探究灌溉系统是否可靠，以获得所选植物的理想土壤湿度水平
    \[3\]。


    室温被认为在 15 - 21°C 之间。另一个假设是，温室外的温度将始终低于或等于温室内的温度。放置在温室中的植物偏好室温或以上的温度。探究问题的结果取决于时间有限的实验。这一结果在长期内可能会有所不同，因此在这种情况下不具备有效性。土壤被视为过湿或过干的阈值取决于所使用的土壤类型。这些数值不能应用于其他类型的土壤，后者必须通过测试单独设置。


    至于水培领域，需要温室，并且许多优势与之相关。部分优势如下。


    1. 它将有助于根据所种植的植物维持最佳条件。


    2. 它将通过提供所需条件来确保光合作用的最大性能。


    3. 它提供了改进的水资源利用。


    4. 它缩短了作物周期 `i.e.` 与传统耕作方法相比，植物生长更快。


    5. 它将有助于解决土壤贫瘠引起的问题。


    对于本研究，实施了 2x2 米以下的更经济且紧凑的温室，其中包含了 1.5x1.5 米以下的水培系统。


    该监测系统包括将传感器与主 MCU 接口，并根据植物的需求对其进行控制，例如，水位传感器与电机接口，通过控制水泵速率来保持水位低于阈值。与此同时，所有数据都使用服务器发送到云端，并以图表、图形和数字的形式在网站上显示
    \[4\]。


    ### 硬件


    该系统的硬件部分分为三部分 - AGMS 模块、水培系统和温室。水培系统和温室已在 Fig. (`3`) 中讨论并显示。


    上述所有传感器相互同步工作。一个传感器电容的每个阈值变化都会直接影响另一个传感器。


    AGMS 模块由嵌入防水外壳中的微控制器单元组成，该单元连接到各种传感器，列表如下：


    `DHT22`：一种精度高的数字温湿度传感器，误差为 ±1^oC。


    ![](img/9789815051452-C4-F3.jpg)**`Fig. (3))`**


    项目框图。


    `Water level sensor`：水位传感模块提供水高度的模拟读数，并需进一步转换为厘米 \[5\]。


    `pH sensor`：检测溶液的 pH 值。


    `Buzzer`：每当输入端有高电平时发出声音。


    `L293d`：用于控制水泵的电机驱动器 IC。


    `Touch Screen`：以多种形式显示各种传感器的值。它是可编程的。


    `ESP8266`：用于将数据发送到服务器。它是一个在 2.4 GHz 下工作的 Wi-Fi 模块。


    `LDR`：它是一种光敏电阻，根据落在其上的光强提供模拟输出值。


    所使用的微控制器单元是 Arduino Mega。由于 Mega 的端口数量和内存，Arduino Uno 尽管熟悉但未在此使用。


    ### 服务器和云


    对于任何高效的监测系统，所有数据都必须被可视化并在任何设备上显示。为此，我们使用一个可编程的服务器，例如 Digital Ocean Droplet 或预制的
    Thingspeak，如 Fig. (`4`) 所示。


    传感器的数据通过 Arduino 使用 API 密钥和 ESP8266（一个 Wi-Fi 模块）处理并发送到 Thingspeak \[6\]。此过程很简单，只需提供
    API 密钥即可获取数据，如 Fig. (`4`) 所示。Thingspeak 的唯一局限性是它不可编程且功能非常有限，而在 Digital Ocean 的情况下，它从内存、处理器核心数量到服务器的操作系统类型均可完全定制。服务器的数据随后由网页使用
    JS 中的 API 密钥捕获并在其中显示。网站可以从头开始构建，也可以使用互联网上随时可用的自定义模板。需要牢记的主要事项是用于传输数据的 API \[7\]。


    每个传感器数据都独立发送到云端，没有任何交叉依赖。每个传感器将是模块化的 `i.e.` 它们可以在需要时轻松断开和更换，如 Fig. (`5`) 所示。传感器将连接到模块外壳的端口，并且可以借助任何蓝牙或任何
    Wi-Fi 模块变成无线，如 Fig. (`6`) 所示。


    ## 工作原理


    整个系统与水培系统同步工作。为了简化，我们将程序和工作分解为步骤。第一步是选择要种植的植物类型。然后，选择营养素以及所有其他参数，如湿度、最佳温度、水位、水流、生长介质
    `etc.` 得到处理。其次，所有这些都通过 NFT 技术组装到水培系统中。整个水培系统被温室包围，温室中也包含主模块。现在，带有所有传感器的模块将在自定义间隔内感知数据并将其发送到云端。


    每个传感器的阈值已在编程中馈送到模块。当任何传感器超出阈值时，警报将被激活。在此情况下，警报是蜂鸣器和警报 `i.e.` 网站警报、GSM 警报、Twitter
    警报和邮件警报。此外，一些模块将自动调整阈值，`e.g.` 当水位高于最佳水平时，电机的流速会降低。对于湿度，使用排气扇和喷雾器，而对于温度，使用高瓦数白炽灯泡。


    ![](img/9789815051452-C4-F4.jpg)**`Fig. (4))`**


    Thingspeak 网站 ![](img/9789815051452-C4-F5.jpg)**`Fig. (5))`**


    Ubuntu 服务器 ![](img/9789815051452-C4-F6.jpg)**`Fig. (6))`**


    设置配置


    ## 结论


    农业是人类的第一职业；它是所有工业的基础。世界人口日益增加，对食物的需求也在增加。在印度，每天有 3000 名儿童死于营养不良。


    温室监测系统提供了在任何季节种植作物的灵活性。这提高了季节性蔬菜全年的适度成本和可用性。使用水培和鱼菜共生等技术种植且不含农药的作物如今被称为有机食品。


    鱼菜共生和水培技术为土壤提供了灵活性，因为这些过程不需要任何土壤，因此任何作物都可以在世界任何地方种植，温室可以在世界任何地方建造，因此进出口将大大减少。它可以用于任何新鲜蔬菜。


