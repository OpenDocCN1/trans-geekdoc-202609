    ]. The CDS is the settlement hub and national clearing center for securities depositories\
    \ in Canada \\[[62](#9789815051452-C2.html#r62), [63](#9789815051452-C2.html#r63)\\\
    ]. The aim of Jasper Phase III was to develop a proof of concept based on DLT,\
    \ that permits multiple asset types to be exchanged on shared ledger. Jasper Phase\
    \ III enables tokenized financial assets and atomic settlement capabilities on\
    \ an integrated platform. The prototype was hosted on Microsoft cloud and implemented\
    \ on Corda v2.0.\n\n### Project BLOCKBASTER\n\nProject BLOCKBASTER was started\
