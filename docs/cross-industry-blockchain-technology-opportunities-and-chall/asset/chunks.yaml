    \ Uttarakhand, India  \n\n² Department of Cyberspace Institute of Advanced Technology,\
    \ GuangZhou University, Guangzhou, China  \n\n## Abstract\n\nBlockchain and IoT\
    \ are the most exciting technologies in the current world, combining these two\
    \ together may resolve a lot of issues. In the current scenario, we are using\
    \ IoT devices in nearly everything. By the end of this era, we can presume that\
