    \ |\n\n# Implementation of Blockchain Technology for Big Data\n\n**Yasir Afaq^([1](#9789815051452-C3.html#aff1))****,**\
    \ **Shaik Vaseem Akram^([2](#9789815051452-C3.html#aff2), [\\*](#9789815051452-C3.html#cor1))****,**\
    \ **Rajesh Singh^([2](#9789815051452-C3.html#aff2))****,** **Mohammad Shafiq^([3](#9789815051452-C3.html#aff3))**\
    \  \n\n¹ Lovely Professional University, Phagwara, Punjab, India  \n\n² Uttaranchal\
    \ University, Dehradun, India  \n\n³ Department of Cyberspace, Institute of Advanced\
    \ Technology, GuangZhou University, Guangzhou, China  \n\n## Abstract\n\nThe focus\
    \ of this chapter is to provide brief knowledge about the concept and advantages\
    \ of integrating Big Data and blockchain technology. As we are focusing on the\
    \ blockchain and Big Data, it is suitable to introduce Big Data before exploring\
    \ its interactions with blockchain. The blockchain technology is introduced and\
    \ then the interaction between blockchain technology and Big Data is focused,\
    \ in order to gain a clear understanding of how blockchain technology is used\
    \ for Big Data. Thereafter, the different applications of blockchain and Big Data\
    \ are explored.\n\n**Keywords:** Big Data, Big Data analytics, Blockchain.  \n\
    \n* * *\n\n^(\\*) **Corresponding author Shaik Vaseem Akram:** Uttaranchal University,\
    \ Dehradun, India;  \n\nE-mail: [vaseemakram5491@gmail.com](mailto:vaseemakram5491@gmail.com)\
    \  \n\n## INTRODUCTION"
