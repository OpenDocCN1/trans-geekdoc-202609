- raw: 'Current permissionless distributed ledgers encounter issues regarding blockchain
    scalability in terms of verification speed and transaction volume. Only 4-5 transactions
    per second are processed by Bitcoins due to the block size limit of one megabyte.
    The limited block size is a matter of controversy in the bitcoin community. An
    increased block size could be time consuming to propagate in the network and lead
    to forking. The Ethereum DLT system supports higher transaction throughputs. Permissioned
    blockchains are less transparent; more centralized but have a higher capacity
    to process volumetric transactions. Permissioned blockchains do not extend much
    benefit from open nature distributed public DLT systems.


    #### Integration and Compatibility


    DLT systems should integrate with existing technologies and be compatible with
    other ledgers. The cost of integration of DLT into the existing financial system
    involves huge expenses. There are frameworks under development like CORDA framework
    and Fabric framework to address specific industry issues in the area:


    *   Allowing peer-to-peer transactions between counterparties; it is needed for
    counterparties’ identity validation;


    *   Need to know basis transaction visibility; it is needed for transactions access
    to regulators;


    *   Maintaining equivalence between original legal process and smart contracts;


    *   Interoperability between various distributed ledgers;


    *   Utilizing existing software tools;


    *   Supporting multiple consensus mechanisms.


    These frameworks explore the digital ledger approaches in line with existing regulatory
    and industry practices. The hyperledger framework initially focuses on the financial
    sector and further on the supply chain, whereas the CORDA framework is used exclusively
    for the financial sector.


    ##### Cybersecurity


    Research shows there are approximately 15-50 bugs in every 1000 lines of code
    \[[46](#9789815051452-C2.html#r46)\]. DAO attack on Ethereum blockchain proves
    that any weakness in software application can be exploited for harmful effects.
    Distributed nature of the ledger makes network security an important aspect so
    that core rules of the DLT system can be safeguarded from attackers. In a type
    of attack called “51% attack”, hackers take control of 51% network resources,
    manipulate consensus and bluff with the network. Robustness of a network depends
    upon its ability that no entity can take control of half of the resources for
    a particular blockchain. The software applications to interact with these digital
    ledgers need to be carefully monitored and reviewed. This can be a case when an
    attacker takes control of a permissionless system, has identity details and continues
    to take control of the majority of network participants. The recent attacks on
    multiple Ethereum nodes using standard Distributed Denial of Service (DDos) attacks
    show that the existing cyber attack techniques can be used for DLT systems.


    This is the point to note that even after successful attacks at the DLT access
    interface, the core technology of Bitcoin and other blockchain systems has never
    been compromised.


    ##### Effective Governance


    Non-availability of central entity or centralized infrastructure put a question
    on overall effective governance of the infrastructure. It is very difficult to
    make critical decisions in DLT infrastructure. The financial organizations rely
    on a centralized regulatory for effective governance. In case of permissionless
    DLT, the applicability of governance arrangements is not clear. In permissioned
    DLT, the administrator may or may not have adequate authority and tools to ensure
    governance arrangements among network nodes.


    ### Legal and Regulatory Issues


    #### Industry Standards and Regulatory Evaluation


    Industry standards and regulatory evaluation are in the infant stage of development.
    Global financial regulatory is actively involved in analysis of technology but
    the actual regulatory DLT framework is missing.


    #### Jurisdiction and Ownership - Legal Clarity


    There are pointed concerns in payment and settlement systems regarding transaction''s
    “point of finality”. It is a big question that how “point of finality” can be
    described in a digital ledger environment. Data and transaction jurisdiction are
    not defined in the cross-border digital ledger system. As there is no central
    administration entity for digital ledger, regulatory protocol setup is tricky
    and difficult for open permissionless distributed ledger systems. As there is
    a central administrator in the permissioned ledger, regulatory framework setup
    and maintenance is comparatively straightforward and viable.


    #### Customer Due Diligence and Know-Your-Customer


    DLT systems should mandatorily follow and incorporate Customer Due Diligence (CDD)
    and Know-Your-Customer (KYC) practices to Combat Financial Terrorism (CFT) and
    to prevent Anti-Money Laundering (AML). The identity disguises property of permissionless
    DLT systems making it very hard to comply with existing regulatory guidelines
    regarding AML/CFT and permit un-vetted parties to do transactions. Some DLT exchanges
    promote KYC requirements by offering priority transaction time and verification
    if the user provides KYC information. In permissioned DLT systems, it is easy
    to comply with AML/CFT guidelines due to centralized control.


    #### Dispute Resolution Mechanism


    In case of distributed ledgers, the mechanism for dispute resolution needs to
    be set up; especially in case of erroneous transactions. One solution is to integrate
    a reverse transaction framework. In the reverse transaction framework, a separate
    transaction is initiated to provide permission to the original sender. For this,
    there is a requirement of a set of rules that can be executed in the specific
    circumstances to initiate reversals. Without a set of rules in place, faulty transactions
    could face an issues to access fund. These set of rules are administered by a
    central entity called scheme owner in the case of traditional systems like Visa,
    MasterCard *etc.* In case of the permissioned digital ledger, this role is handled
    by digital ledger administrator. In permissionless digital ledger systems, smart
    contracts automate the role. There are concerns related to the liabilities that
    may arise for losses due to digital ledger weak points. These issues can be handled
    effectively in the case of permissioned systems rather than permissionless systems.


    #### Privacy


    The identity of the user is not exposed in case of permissionless ledgers like
    Ethereum and Bitcoin. In some cases, the user''s identity can be inferred on the
    basis of some markers like transaction patterns. The issue is same as in the case
    of a permissioned digital ledger. This is the major challenge in applying digital
    ledger technology to financial infrastructures and many organizations are working
    on its design.


    #### Infrastructure Cost


    Utilizing consensus mechanism and proof-of-work need enormous computational resources/infrastructure,
    which leads to huge power consumption for mining.


    ## DLT APPLICATIONS'
