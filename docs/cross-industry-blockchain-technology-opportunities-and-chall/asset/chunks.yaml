    Guangzhou, China


    ## Abstract


    Blockchain and IoT are the most exciting technologies in the current world, combining
    these two together may resolve a lot of issues. In the current scenario, we are
    using IoT devices in nearly everything. By the end of this era, we can presume
    that all of our day-to-day use devices will be smart. But with this various issue
    may rise like safety, security, and performance concerns of smart devices. To
    resolve these issues, blockchain technology has emerged as a very powerful tool.
    In this chapter, the basics of blockchain along with its architecture and algorithms
    involved are discussed. IoT challenges and related literature are also discussed
    along with blockchain as an efficient technology to resolve these issues. The
    chapter also includes the challenges in using blockchain in IoT devices.


    **Keywords:** Blockchain, Cryptocurrency, Distributed ledgers, IoT, Proof-of-stake,
    Proof-of-work.


    * * *


    (*) **Corresponding authors Chaitali Choudhary & Inder Singh:** School of Computer
    Science, University of Petroleum and Energy Studies, Bidholi, Dehradun 248007,
    Uttarakhand, India; Tel: +919827180073;


    E-mails: [chaitali.choudhary@gmail.com](mailto:chaitali.choudhary@gmail.com) &
    [inderddn@gmail.com](mailto:inderddn@gmail.com)


    ## INTRODUCTION


    The chapter includes the two emerging technologies, blockchain and Internet of
    Things (IoT). Blockchain is a distributed ledger technology that maintains immutable
    records leading to highly secure data, whereas IoT is the technology that became
    an essential part of our day-to-day life. IoT applications are used in smart homes,
    smart cities, industrial productions, smart grids, *etc.* Here, we discuss various
    IoT related issues and blockchain technology separately and then the ways in which
    blockchain can be used to resolve these key challenges of IoT are discussed. Out
    of the various challenges of IoT, the most crucial one is secu-


    rity and confidentiality, which can be resolved using blockchain. Blockchain gives
    power to the changing digital infrastructure which can help to evolve IoT, ranging
    from analytics to security. IBM took an initiative of blockchain usage incognitive
    IoT \[[1](#9789815051452-C1.html#r1)\]. They used it in complex trade lanes and
    logistics where smart contracts can be incorporated using blockchain technology
    register. According to IBM, three key benefits are firstly building trust using
    distributed ledger-based authentication system and reducing the risk of collision
    and tampering, secondly by cost reduction by removing intermediate or third parties,
    and thirdly accelerated transaction speed by reducing settlement time from days
    to instantaneous decisions.


    ### Blockchain and its Key Concepts


    Blockchain is important as it brings trust to a network, and that is the main
    reason behind its wide usage in various areas based on trust factors. Blockchain
    operates with the basic concept of peer-to-peer trust factor with zero intervention
    from third parties. Blockchain is a decentralized ledger of all transactions across
    a peer-to-peer network, which means it enables the transfer of digital assets
    without third party intervention. Blockchain is being used in a wide range of
    industrial applications as listed below:


    1. One of the most famous is cryptocurrency, for each blockchain. Right now, there
    are various cryptocurrencies in existence. Out of which the most famous one is
    Bitcoin. Some other are Ether, USD Digital, Bitcoin Cash, Tether, Stellar, *etc.*


    2. It is used in financial transaction security in the finance industry as transactions
    should be open and in the form of immutable ledgers.


    3. Patient’s data is collected by various devices in healthcare. Such data is
    highly confidential and need not to be manipulated under any conditions.


    4. One of the major issues with government supplies is that they do not reach
    the designated person or department. To maintain that, government nowadays uses
    blockchain in supply chain management to ensure the proper delivery of essential
    items.


    5. Blockchain in supply chain management is also used in manufacturing and distribution
    to ensure an immutable ledger of items produced and distributed.


    6. It is also useful in moving point of data computation from one place to another.
    While doing so, our data should be secured which can be easily done using blockchain.


    7. Some other examples are E-voting, Key distribution, funding generation, securing
    public records *etc.*


    The most known term in the blockchain is Bitcoin. Blockchain is confused with
    bitcoin, but actually bitcoin is just a cryptocurrency based on blockchain. Whether
    Bitcoin survives or not, concepts and algorithms of blockchain form an essential
    backdrop of various key security-based fields. There was a scenario in 2008-09
    where major financial systems were facing issues, which led to share market crumbling.
    Then a person named Satoshi Nakamoto introduced digital currency. Digital currency
    is an asset which can be transferred securely over internet. This new currency
    introduced by Satoshi Nakamoto is called Bitcoin \[[2](#9789815051452-C1.html#r2)\].
    Cryptocurrency is in controversy due to the reason that it does not need any central
    authority like bank to transfer assets \[[3](#9789815051452-C1.html#r3)\]. Thus,
    many people and countries still do not authenticate it. Bitcoin uses various algorithms
    for verification, validation and consensus protocol for each transaction.


    ### Working of Blockchain

