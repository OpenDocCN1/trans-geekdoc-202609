- raw: 'Project Ubin was started in November 2016 and implemented by Singaporean PSPs,
    MAS and industry collaboration. It was an initiative for Singapore''s Central
    Bank Digital Currency to explore DLT and its applicability in Singapore financial
    market infrastructure \[[68](#9789815051452-C2.html#r68)\]. MAS is the financial
    regulatory and central bank of Singapore. MAS manages and controls MAS Electronic
    Payment System (MEPSC) and Singapore''s RTGS system. MEPSC is a type of financial
    market infrastructure used for Scriptless Singapore Government Securities (SGS)
    and Singapore domestic wholesale interbank payment settlement for MEPSC members
    \[[69](#9789815051452-C2.html#r69)\]. Phase I of Ubin implemented a central bank
    digital currency based on Ethereum DLT platform for domestic wholesale interbank
    payment settlement \[[69](#9789815051452-C2.html#r69)\]. Phase II enhances Phase
    I with additional features on Quorum, Fabric and Corda to address settlement functionality
    and data privacy challenges that occurred in Phase I \[[70](#9789815051452-C2.html#r70)\].
    Phase III of Ubin developed DvP capabilities for interbank payment settlement
    and security on different DLT platforms. The end goal of project Ubin was to provide
    capabilities for SGD depository receipt or tokenized Singapore Dollar on digital
    ledger technology and to analyze the impact on Singapore financial market infrastructures.


    ### Project Stella


    The ECB and the Bank of Japan started project Stella to analyze the feasibility
    of DLT to financial market infrastructure in both jurisdictions \[[71](#9789815051452-C2.html#r71)\].
    Eurozone monetary policies are administered by the ECB. In the Eurozone, the TARGET2
    system (settlement system for high value interbank transactions) is in use for
    monetary policy operations \[[72](#9789815051452-C2.html#r72)\]. TARGET2 system
    is owned and operated by the Eurosystem, that comprises National central banks
    of European Union Member States and the ECB \[[73](#9789815051452-C2.html#r73)\].
    Monetary policy in Japan is administered by The Bank of Japan, Japan''s central
    bank. It manages Japan''s wholesale LVTS, and BOJ-NET. Project Stella uses multiple
    DLT platforms and has been implemented in three phases. In Phase I, core RTGS
    functionality and Central Bank Digital Currency was implemented on Fabric DLT
    platform. DvP functionality for tokenized security settlement on Corda, Fabric
    and Elements were implemented in Project Stella Phase II \[[74](#9789815051452-C2.html#r74)\].
    Phase III of Project Stella aimed at improving cross border transactions efficiency
    using DLT \[[75](#9789815051452-C2.html#r75)\]. Fabric DLT platform was used to
    implement Project Stella.


    ### Project Khokha


    Project Khokha was started in January 2018 by PricewaterhouseCoopers, the SARB,
    ConsenSys and seven South African CMBs to utilize DLT for South Africa wholesale
    interbank payments settlement domestically \[[76](#9789815051452-C2.html#r76)\].
    The aim of Project Khokha was to establish a DLT driven RTGS system using tokenized
    Rand assets for interbank payment settlement in South Africa. The Quorum DLT platform
    was used for its prototype. In South Africa, the RTGS system is referred to as
    South African Multiple Option Settlement System (SAMOS). SARB owns and manages
    SAMOS are used for interbank retail payment obligations, high-value interbank
    payments and South African security settlement. SAMOS has capability to process
    approx. 70,000 transactions (wholesale interbank) daily on RTGS framework with
    capacity to process daily transactions in two hours in case of system failure
    and emergency operations \[[76](#9789815051452-C2.html#r76)\].


    ### Project INTHANON


    The Bank of Thailand in collaboration with R3 and other organizations started
    Project Inthanon in August 2018 to evaluate the DLT capabilities for Thailand''s
    financial market infrastructures \[[34](#9789815051452-C2.html#r34)\]. Project
    Inthanon was divided into two phases. Phase I of Inthanon developed a RTGS prototype
    based on DLT-based distribution targeting Thailand''s domestic wholesale interbank
    payment settlement \[[34](#9789815051452-C2.html#r34)\]. In Phase II of project
    Inthanon, development of a securities settlement platform for the management,
    for the issuance and settlement of Bank of Thailand issued tokenized cash assets
    and tokenized bonds.


    ## SUMMARY


    This chapter explained Distributed Ledger Technology (DLT) and its application
    in the financial sector. The chapter detailed blockchain based Digital Ledger
    Technology and its working. The existing works have been studied and analyzed
    for harnessing digital ledger technology in the banking and finance sector. Digital
    currencies recommended by central banks are studied for better understanding and
    its applicability. The working of distributed ledger technology in the context
    of financial services has been discussed. DLT advantages, risks and challenges
    have been explored. Detailed analysis of DLT potential applications including
    financial inclusion, cross border remittance and payments, smart contracts has
    been elaborated. Current DLT practices in banking and financial domains have been
    highlighted. In the nutshell, the chapter explains every aspect of DLT with respect
    to the financial domain for better understanding and its applicability in banking
    and financial domain.


