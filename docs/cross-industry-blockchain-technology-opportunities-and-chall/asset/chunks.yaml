  trans: "\n\n每个数据都由提供给用户的 `Public Key` 授权；只有这样，智能设备才能访问或使用区块链和存储 \\[15\\]。正如一项研究所预测的那样\
    \ \\[16\\]，BCT 可能会通过加密货币的这种增加，完全改变人们支付商品或任何购买商品的方式。与 BCT 相关的各种风险，例如私钥安全、犯罪活动、双重花费、交易隐私泄露、犯罪智能合约、智能合约漏洞、优化不足的智能合约以及定价过低的操作，已在\
    \ \\[17\\] 中得到非常有效的解释，但在过去几年中，针对这些问题，还提供了同时解决方案、各种拟议框架和改进算法，这些方案非常有效地解决了这些问题。虽然\
    \ BCT 可以应用于任何地方以造福社会，但更重要的是，它在安全和金融行业中找到了其价值，因为它已经在各行业触发了多个项目。BCT 承诺克服非常微妙的方面，代表着“从信任人转向信任数学”\
    \ \\[16\\]。智能家居矿工管理大部分事情，例如生成交易、分发和更新密钥、管理本地存储（用于本地存储数据 – 使用先进先出 (`FIFO`) 和集群。此外，它还将交易收集到一个块中，然后将其追加到区块链。每当外部设备需要从网络获取数据时，矿工会分配一个特殊密钥。矿工首先检查策略头，然后分配一个密钥，以便设备可以访问数据。工作完成后，它还可以声明密钥无效，以便设备无法再访问网络。这种方法有两个优势——矿工可以跟踪网络中涉及的所有设备，并且设备之间的通信使用共享密钥进行保护。即使访问本地存储也需要权限\
    \ \\[15\\]，我们可以实现分布式云存储，使其难以造成中断 \\[11\\]。IoT 设备可以通过智能合约进行自主交易。结合人工智能 (AI) 和大数据解决方案，可以产生更显著的影响\
    \ \\[18\\]。\n\n![](img/9789815051452-C5-F1.jpg)**Fig. (1))**  \n\nBCT 的框图。 \n\n\
    如表 **1** 所示，已讨论了各种类型的 BCT 及其属性。区块链检查每个数据包或交易，以识别任何异常行为。如果我们考虑多个矿工来验证添加到链中的新数据包，这肯定会增加延迟，因为现在每个矿工都必须验证正在添加的数据包，但它增强了整个网络的鲁棒性。它解决了中心化问题，因为多个矿工控制/验证正在添加的数据。区块链要求每个矿工进行加密检查并解决一个复杂的数学问题，以完成交易，这可能会增加能源消耗，但使用人工智能，这个问题也可以得到解决\
    \ \\[19\\]。区块链可能是安全的未来，因为许多新公司已经开始使用它来赢得用户的信任，例如 `Provenance`。博世和思科等大公司已经开始实施区块链的功能来保护\
    \ IoT 应用程序。区块链与加密货币密切相关。GridCoin 和 Ripple Labs 在金融服务中找到了区块链的精妙实现 \\[20\\]。\n\n\
    Table 1 **BCT 类型。**  \n\n| ***属性*** || ***公共 BCT*** || ***联盟 BCT*** || ***私有 BCT***\
    \ |\n\n| --- | --- | --- | --- |\n\n| **确定共识** || 每个矿工 || 仅选定的 || 特定机构 |\n\n|\
    \ --- | --- | --- | --- |\n\n| **读取请求** || 公共 || 公共/受限 || 公共/受限 |\n\n| **不可更改性**\
    \ || 几乎不可能干扰 || 可以干扰 || 可以干扰 |\n\n| **效率** || 截断 || 相当高 || 相当高 |\n\n| **中心化**\
    \ || 无 || 初级 || 是 |\n\n| **共识过程 (PoC)** || 不需要确认 || 需要权限 || 需要权限 |\n\n## IoT\n\
    \nIoT 创造流行语的方式非常值得称赞，并让许多研究者感到满意。IoT 无非是物体之间通过互联网的互连。它不仅旨在将一切统一在一个伞下，还试图解决只需点击一下就能控制周围事物的问题。IoT\
    \ 没有唯一定义，因为它可以根据需求和参考进行塑造 \\[21\\]。此外，IoT 已成功吸引了全球用户、商人和当局的关注，不仅要在各自领域使用这一概念，还要将其触角更深地延伸到知识领域。IoT\
    \ 的第一个已知应用是 20 世纪 80 年代初卡内基梅隆大学的一台可乐机，自那以后，它的发展就一飞冲天。为了成功实施物联网 (IoT)，先决条件是 (a)\
    \ 动态资源需求 (b) 实时需求 (c) 需求的指数级增长 (d) 应用程序的可用性 (e) 数据保护和用户隐私 (f) 应用程序的高效功耗 (g) 在靠近最终用户的位置执行应用程序以及\
    \ (h) 访问开放且可互操作的云系统 \\[22\\]。\n\n到目前为止，当我们考虑广泛用于部署基于 IoT 的产品和服务的主要关键技术时，我们得到的最明显的解决方案是\
    \ RFID、WSN、中间件、云计算和 IoT 应用程序软件。2010 年至 2020 年之前 IoT 的趋势在表 **2** 中得到清晰说明。\n\nTable\
    \ 2 **IoT 趋势**  \n\n|  || **2010 年之前** || **2010-2015** || **2015-2020** || **2020\
    \ 年之后** |\n\n| --- | --- | --- | --- | --- |\n\n| **网络 (N/W)** || ▪ 基于 WSN ||\
    \ ▪ 自主  \n\n▪ 网络位置透明。  \n\n▪ 接受延迟  \n\n▪ 存储和电源网络  \n\n▪ 混合技术 || ▪ 基于上下文的网络感知。\
    \ || ▪ 网络感知  \n\n▪ 自学习和自修复网络。 |\n\n| --- | --- | --- | --- | --- |\n\n| **软件和算法**\
    \ || ▪ 关系数据库的融合。  \n\n▪ 面向 IoT。  \n\n▪ 面向事件的平台。  \n\n▪ 定位算法。 || ▪ 大规模开源  \n\n\
    ▪ 可组合算法  \n\n▪ 下一代社交导向  \n\n▪ 下一代应用 || ▪ 期望结果导向。  \n\n▪ 分布式 AI  \n\n▪ 物对物协作 ||\
    \ ▪ 用户为基础  \n\n▪ 透明 IoT  \n\n▪ 易于部署  \n\n▪ 物对人协作。  \n\n▪ 面向所有人。 |\n\n| **硬件**\
    \ || ▪ RFID、传感器  \n\n▪ 集成到智能手机。  \n\n▪ 智能手机中的 NFC。  \n\n▪ 截断且负担得起的  \n\nMEMs 技术\
    \ || ▪ 各种协议和标准导向。  \n\n▪ 增加传感器和执行器。  \n\n▪ 安全且负担得起的标签和 || ▪ 智能传感器  \n\n▪ 在非常小的空间内增加截断的传感器。\
    \ || ▪ 纳米技术和新  \n\n创新材料 |\n\n| **数据处理** || ▪ 串行和并行  \n\n▪ 服务质量 (QoS) || ▪ 频谱感知数据处理\
    \  \n\n▪ 基于上下文的数据处理，可  \n\n▪ 适应 || ▪ 基于上下文的数据处理和输出。 || ▪ 自适应、基于 AI 的认知优化。 |\n\n\
