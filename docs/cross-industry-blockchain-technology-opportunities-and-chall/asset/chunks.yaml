    ## 6. 兼容性


    市场上有如此多来自不同制造商的设备，兼容性是一个大问题。我们都在家中安装智能设备时遇到过这些问题。为了解决这个问题，可以借助公司提供的软件补丁来获得一些帮助。但这同样是一个问题，因为我们无法确保每个设备都具备自动更新系统。当设备运行在不同版本时，这些问题会加剧，导致性能下降和安全问题。因此，大多数设备需要保持自身维护。


    ## 7. 异构性


    IoT 设备可以是网络设备、家用电器、可穿戴设备、传感器、工业仪器/机器、车载传感器或任何嵌入式设备，它们具有广泛的功能、连接性和供应商。如此广泛的设备之间进行网络互连是一个高度复杂的问题。因此，IoT
    的主要问题之一是建立连接，连接这些具有不同工作协议和连接问题的异构设备。


    ## 8. 机密性


    智能设备可以是人或任何参与收集数据、管理数据或分析数据的设备。此类数据可能非常关键，因为它可能包含非常敏感的数据，例如个人信息、健康信息、`etc.` 这些数据不仅需要防止外部世界的访问，还需要防止其他节点的访问。机密性还意味着数据应仅由真实设备接收和处理。


    ## 9. 身份验证


    IoT 网络中可能有大量设备，所有设备都应经过身份验证，因为有许多攻击者可能伪装成网络的真实部分。网络中的所有设备都应最初经过身份验证，然后每个试图加入的节点应由中央权威机构或通过相互同意进行验证。


    ## 10. 轻量级解决方案


    这可以被视为一个方面或约束，因为所有设备都应节能且与 IoT 算法和协议兼容。另一方面，我们可以说，为 IoT 设备设计的所有算法都应是轻量级网络协议。因为高能耗协议与
    IoT 结构不兼容。


    ## 11. 客户期望


    IoT 市场是一个面向客户的细分市场，除非它不是一个完整的基础设施设置，在大多数场景中我们处理的是小型手持设备或日常使用的电器。在日常使用中，设备数量正在迅速增加，在如此竞争激烈的环境中，客户满意度是一个非常重要的因素。应满足用户的期望，否则竞争非常激烈，各种制造商会推出同类设备。产品应是市场上最好的，并符合用户的期望。


    ## 12. 密钥管理系统


    IoT 设备的信息传输应使用加密策略进行保护。这里的一个约束是，它必须是一个轻量级密钥管理系统，以实现可信的数据交换。密钥分发应消耗最少能量，以延长设备的使用寿命。有各种加密算法可以非常高效地运行，但我们需要具有计算能力的节点。因此，使用轻量级密钥管理进行安全数据管理是一个关键问题。


    ## 正在进行的研究


    ### 使用区块链的 IoT 安全


    区块链通过安全的数据传输来保护 IoT 设备之间的数据通信。Rathee G. `et al.` `[7]` 建议使用区块链技术保护 IoT 中的无线通信。为了确保设备是经过身份验证的设备，跟踪任何设备活动，并在对等节点之间保持保密性和透明度，所有对象都被添加到区块链中。所建议的方案还用于从各种节点提取信息，并将提取的数据保存到区块链中。这确保了提取数据的安全性以及分布式节点之间的透明度。它的工作方式与我们在前面部分讨论的区块链工作原理相同。任何试图加入网络的设备都应由网络中的现有节点进行身份验证。如果超过特定阈值数量的用户接受该节点，那么其中一个节点可以将新用户添加到现有区块链中。同样的概念也适用于生成的消息。添加节点或传递消息的过程会产生交易，每个交易都可以按顺序编码的哈希方法维护为不可更改的成功交易链。只有成功的交易才会出现在链中。所有消息都作为不可修改的不可更改账本发布，每个
    IoT 节点/对等体都维护共同账本，就像网络中的所有其他对等体一样 `[8]`。Agrawal, R. `et al.` `[9]` 提出了一种基于区块链的
    IoT 结构，其中信任通过不可更改的去中心化区块链来维护。由于区块链本质上是分布式的，使系统更能抵御故障，这提出了一种使用设备身份验证来保护系统的方法，无需任何外部干预。每个节点交互都保存为区块链块，使其使用经过身份验证，并保存为
    IoT 区块链。使用各种预测模型为用户身份验证生成加密令牌。这些加密令牌随后使用集成方法进行改进，这些方法使用最有效的模型。Huh, S. `et al.`
    `[10]` 使用公钥-私钥对加密数据，并将公钥保存在以太坊区块链上，私钥存储在各个设备中。这样他们就可以以高效的方式轻松构建密钥管理和分发系统。使用区块链管理密钥是一件非常常见的事情，但他们明确使用了以太坊，因为他们希望以细粒度的方式进行管理。这可以与部分
    IoT 实现与完全规模的 IoT 系统进行比较。结论表明，结果显示性能更好，因为完整系统没有兼容性问题，而部分设备与部分结构集成则存在兼容性问题。他们的案例研究是关于智能电表的。他们使用来自智能电表和智能手机的数据。使用以太坊智能合约，他们不断分析来自智能电表的数据，智能手机用于向空调和灯泡发送指定策略。这些设备不断检查以太坊智能合约中的策略更新以保持更新，并在必要时切换到节能模式，然后根据需要切换回正常模式。他们只创建了一个小规模的实验设置，需要检查是否可以与多个设备一起扩展。与多个设备可能面临的主要问题是，随着设备数量增加，可能会出现同步问题，进而导致请求增加
    `[11]`。此外，我们的轻量级 IoT 设备将无法并行处理如此多的请求，这会导致拒绝服务。


    ### 使用雾计算的 IoT 安全


