  trans: '


    # 数字分类账技术在金融应用中的应用


    数字分类账技术在包括金融行业在内的广泛行业中有许多应用。DLT 应用的两个潜在领域是：1) 金融科技公司正在探索利用区块链基础设施开发用于多种用途的数字应用程序；以及
    2) 行业领导者正在投资研究，开发专有许可区块链，以解决特定于行业的企业解决方案的需求。金融行业对 DLT 及其概念证明有着巨大的兴趣。“Hyperledger”
    - 一个开源联盟拥有超过 170 个组织作为其成员；而“R3CEV” - 金融行业的区块链研发组织，拥有超过 100 名成员，包括商业银行、监管机构和其他贸易协会
    \[47\]。包括纳斯达克、纽约证券交易所和伦敦证券交易所在内的证券交易所正在探索 DLT 以提高交易安全性 \[48\]。DLT 有能力改变每种股票的交易和发行方式，并有可能取代现有的证券交易所系统。


    *   IBM 和东京证券交易所正在探索在低交易市场中使用区块链进行交易监控和记录。


    *   美国证券交易委员会于 2015 年批准了一项计划，使用比特币区块链发行过剩公司股票 \[49\]。


    *   “德国证券交易所” - 德国的证券交易所和中央银行正在开发一个用于数字资产交易的区块链框架 \[50\]。


    *   韩国交易所 KRX 为初创公司股权股份推出了一个基于区块链的市场。这与韩国初创公司“Blocko”合作，名为韩国初创市场（KSM） \[51\]。


    *   一家名为“数字资产控股”的初创组织和澳大利亚证券交易所正在测试 DLT 以优化清算和结算流程。


    *   一个基于区块链的系统已开发用于交易后处理模式中的信用欺诈。该系统由三家技术组织开发 - IBM 和两家区块链初创公司 - R3 和 Axoni \[52\]。


    # DLT 与金融包容性


    DLT 有能力提高金融行业及其基础设施的韧性、可靠性和效率。尽管金融包容性得到了强劲扩张，但将被排除在外的社区纳入金融系统仍面临挑战。DLT 系统的好处可能会被金融机构和金融科技组织所利用。DLT
    有潜力通过解决以下金融问题来增强金融包容性：


    *   交易和抵押品证券的安全框架不完善。


    *   合理的金融服务。


    *   缺乏包括 KYC 可验证身份系统在内的尽职调查要求。


    *   差劲的信用和支付基础设施。


    *   国际汇款去风险化影响。


    用于改善金融包容性的 DLT 应用：


    *   资产登记


    *   跨境汇款


    *   数字货币


    *   数字身份系统


    # 跨境汇款与支付


    跨境支付通常由一系列代理银行网络进行，涉及长时间延迟、高成本和不确定性。这些交易涉及多点交易费用，并且仅限于银行的营业时间。涉及的费用包括跨境转账费用（涉及支付基础设施的代理银行和其他中介组织）、接收机构收取的费用以及发送机构收取的费用。


    非银行机构有自己的专有框架，涉及在接收机构预先资金以结算定期汇总金额并实现更快的发放。由于金融机构之间的合作和联系、成熟的系统以及对流程的高级优化，跨境汇款有了巨大的改善。然而，其中涉及的创新不多，服务费用继续占总成本的很大一部分
    *i.e.* 20% \[53\]。DLT 可以取代代理银行系统，并通过在银行间跨境交易中提供成本降低来消除现有系统中的低效率。DLT 可以通过提高银行间和跨境转账的效率以及降低结算成本来进一步降低汇款价格。DLT
    可以为代理银行系统开辟新方法，这可以进一步解决去风险问题。下面列出了一些示例：


    ## Ripple


    Ripple 专注于跨境商业支付结合的跨币种资金结算。Ripple 使用一种独特的方法，涉及“路径”识别，用于特定货币中发送方资金流向接收方特定货币，利用一系列参与机构提供的服务（针对该货币）。这可以扩展微型汇款公司对外汇服务的访问，并发现更好的外汇价格。XRP
    是 Ripple 自身的加密货币，已在许多加密货币交易所注册交易。Ripple 有自己的交易所，涉及欧元、美元、人民币和日元等主要货币的交换。该交易所还积极进行以太坊和比特币等加密货币的交换。上海华瑞银行宣布将在中美网络中使用
    Ripple 进行其汇款产品 \[54\]。


    ## Abra


    Abra 将实体银行柜员与加密货币相结合，提供点对点模式下的即时资金转账且无交易费用。在 Abra 中，跨境支付不需要银行账户；收款人的电话号码是唯一要求。除了比特币，Abra
    还支持全球超过 50 种货币。


    ## Bitpesa


    它为中国和一些非洲国家（如肯尼亚、尼日利亚、坦桑尼亚、乌干达）之间的个人和企业提供跨境支付 \[55\]。


    ## Bitt


    它是加勒比地区的比特币交易所组织，专注于为 CARICOM 地区创建统一的支付结算网络。


    # 智能合约


    在 DLT 的背景下，“智能合约”是在底层分布式账本上开发并由网络节点自动执行的程序。智能合约可以执行计算机可以执行的任何指令。智能合约由分布式账本上的交易触发，结果存储在账本中。智能合约“允许在区块链交易之上编程逻辑”
    \[56\]。非区块链的数字账本也可以执行智能合约。相同的数据必须对所有网络节点可用，因此每个节点都应验证智能合约。


    智能合约一词最早由 Nick Szabo 于 1997 年提出，他以自动售货机为例来解释智能合约的概念 \[57\]。自动售货机管理资产所有权，并在投币时转移资产所有权。自动售货机确保遵循“合同”条款，该条款定义了条件、底层资产、其输入和后续操作。计算机程序将自动执行预定价格的证券销售或购买。智能合约的应用可能包括并购、衍生品市场和证券交易。


    DLT 系统为智能合约提供了一个平台，用于控制股票、土地所有权等现实世界资产，而无需第三方（如土地登记管理员或经纪人）的参与。之所以可能，是因为分布式网络节点能够执行代码和合同强制执行。图
    (**5**) 解释了智能合约在贸易金融中的应用。类似的基于 DLT 的方法可以应用于其他领域，如抵押品登记或抵押贷款流程。


