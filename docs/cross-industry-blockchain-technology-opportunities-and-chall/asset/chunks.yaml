  trans: '


    # 经济的货币政策由中央银行控制


    经济的货币政策由中央银行控制。中央银行控制经济的相关经济管理工具。中央银行的职责是控制经济中的货币供应量以及包括利率管理、保持基本商品价格稳定在内的货币政策的部署
    \[1\]。中央银行对特定经济体的货币发行拥有垄断权 \[2\]。2009 年比特币的出现 \[3\] 推动了将替代货币模式作为数字货币或加密货币的概念。这种新形式的替代货币可以由私营部门参与者或个人管理。比特币发明后，私营部门组织或个人在过去十年中发行了五千多种加密货币
    \[4\]。这些货币的共同属性是它们基于数字账本技术，且不受任何有形资产控制。这些货币包括比特币 \[3\]、恒星 \[5\]、瑞波币 \[6\]、以太坊
    \[7\]、泰达币 \[8\] 等。


    针对金融市场的严格法规和当地法律要求，正在为去中心化数字货币带来挑战。考虑到数字货币的增长和机遇，中央银行正在投资于由中央银行和政府支持的数字货币的研发，以保持货币政策和金融市场稳定
    \[9, 10\]。国际清算银行（BIS）最近进行了一项调查 \[11\]，以分析中央银行在中央银行数字货币研究项目方面的努力。绝大多数中央银行（>70%）回复称，他们正在投资于发行中央银行数字货币（CBDC）的可能性。这项调查涵盖了不同司法管辖区的多样化地理区域，覆盖了全球超过
    70% 的人口 \[11]。35% 的参与者来自发达经济体，65% 的调查参与者来自发展中经济体。中央银行数字货币组织的级别分类为 a) 早期采用者，b)
    跟随者和 c) 新进入者。


    ## 早期采用者


    早期采用者是指在 2015-2016 年期间开始投资该技术的组织。英格兰银行于 2015 年发布了其“单一银行研究议程” \[12\]。英格兰银行于 2016
    年与伦敦大学学院合作开展其 RS Coin CBDC \[13\] 框架开发。中国的中央银行“中国人民银行（PBoC）”于 2016 年开始其 CBDC 之旅，旨在控制中国的货币供应量并优化支付系统的效率
    \[14, 15\]。加拿大银行于 2016 年开始投资 CBDC，参与 R3 Project Jasper 和 Payments Canada \[16\]，随后开始分析
    DLT 以用于该国的支付转型。德国中央银行“德国联邦银行”于 2016 年初启动“BLOCKBUSTER”项目，以利用数字账本进行德国的银行间结算 \[17\]。法国银行于
    2016 年 6 月中旬启动“MADRE”项目，用于数字货币。巴西中央银行于 2016 年 9 月启动了“SALT”项目 \[18\]。美国联邦储备系统于
    2016 年 9 月发布了其首份中央银行数字货币报告 \[19\]。2016 年 11 月，新加坡中央银行和金融监管机构启动了 Ubin 项目。日本银行和欧洲央行于
    2016 年 12 月启动了 Stalla 项目 \[14\]。


    ## 跟随者


    在 2017-2018 年期间开始投资分布式账本技术的组织被归类为跟随者。香港金融管理局（HKMA）于 2019 年 3 月启动了数字货币项目 LionRock
    \[20, 21\]。其目标是利用分布式账本技术进行香港国内市场的银行间结算。芬兰银行分析了通用型中央银行数字货币与现金之间的异同，并于 2017 年 5
    月发表了一篇研究论文 \[22\]。为解决瑞典现金使用量下降的问题，瑞典中央银行于 2017 年 9 月启动了 e-Krona 项目 \[23, 24\]。为解决乌拉圭的金融包容性问题，乌拉圭中央银行于
    2017 年 11 月启动了其中央银行数字货币项目“e-Peso” \[25\]。为分析数字货币 e-Shekel 的好处，以色列银行组建了一个研究团队。丹麦国家银行对中央银行数字货币及其对丹麦金融市场基础设施的影响进行了高层次探索，并于
    2017 年 12 月发布了其中央银行数字货币报告 \[26\]。南非储备银行（SARB）于 2018 年 1 月启动了 Khokha 项目，以利用 DLT
    在银行间支付结算领域带来好处。SUPCAVEN 在委内瑞拉启动了 Petro 项目，以克服对美元的依赖并对抗美国和欧盟的制裁 \[27\]。为促进立陶宛的金融服务业，2018
    年 3 月引入了一个名为 LBChain 的基于 DLT 的沙盒 \[28^(\-)30\]。瑞士国家银行于 2018 年 4 月分析了 DLT 在瑞士金融部门的适应性
    \[31\]。挪威银行（Norges Bank）于 2018 年 5 月揭示了中央银行数字货币的第一阶段 \[32\]。新西兰储备银行于 2018 年 5
    月发布了一份报告，探讨了 DLT 在优化支付系统效率方面的作用 \[33\]。泰国银行于 2018 年 8 月启动了 Inthanon 项目 \[34》，以探索
    DLT 在泰国金融市场基础设施领域的潜力。


    ## 新进入者（2019）


    2019 年 2 月，韩国银行发布了一篇研究论文，评估基于账户的通用型 CBDC（GA-CBDC）对金融市场稳定的影响，采用了两种不同的货币一般均衡模型 \[35\]。日本银行发布了其首份官方论文
    \[36\]，评估 CBDC 对 FMIs 支付效率的潜在影响。


    2019 年 5 月，加拿大银行和 MAS 发布了 Jasper-Ubin 项目 \[37\] 报告，这是世界上第一个 CBDC 实验，实现了在两个不同的
    DLT 平台上以两种不同货币计价的跨境银行间支付结算。Jasper-Ubin 项目基于一种替代的跨境银行间支付结算模型 \[38\]。在 ECB 的主持下，ECB
    加密资产特别工作组于 2019 年 5 月发布了关于加密资产的分析 \[39\]。该论文为加密资产提供了标准化定义，并从货币政策角度考察了它们对更广泛经济的影响。


    # DLT 特性与属性


    本节介绍了本研究工作的初步内容以及模拟环境。


    '
