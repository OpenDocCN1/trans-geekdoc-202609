- raw: "3\\. Transaction Integrity: It works by securing the account address uniquely;\
    \ the sender should be authenticated using a digital signature before transaction\
    \ and ensuring the contents of the message sent. In the blockchain, both hashing\
    \ and public key cryptography are used. The first step is to generate the address\
    \ using a public private key. Initially a 256-bit random number is taken and kept\
    \ as a private key which is secured using a code. Secondly, the ECC algorithm\
    \ is used to generate a private key from public key, after which, the user will\
    \ be having our public-private key pair. Finally, a hashing function is used to\
    \ extract account address from the public key. Any transaction needs to be verified\
    \ for the integrity. For this, a digital signature needs to be applied to the\
    \ transaction and data needs to be hashed and encrypted. The receiver gets these\
    \ two things separately: original data and digitally secured hash key. The receiver\
    \ then needs to recompute the hash from the original message and compare it to\
    \ the received secure hash key. If it is matched, then the receiver can ensure\
    \ the data is intact and no changes have been made to it, so user can accept it.\
    \ Otherwise the receiver can reject the transaction. The original key and the\
    \ retrieved key match only in case the messages are integral, if a message is\
    \ changed, then the keys won’t match and lead to rejection from the receiver’s\
    \ side. Various other things are also verified at receiver’s end like timestamp,\
    \ balance, and gas balance, *etc.* Using this complete procedure, the integrity\
    \ of the complete transaction can be checked\n\n### Trust Essentials and Consensus\
    \ Protocols\n\nTrust can be established in a decentralized system by using specific\
    \ protocols. It can be done by validating the transaction and blocks for tamper\
    \ proofing, verifying the availability of resources for transactions, and executing\
    \ and confirming the transactions. The Trust Trail is defined by operations including\
    \ validation of transaction, verification of gas and resources, accumulation of\
    \ transactions, execution of transaction to get a new state, formation of the\
    \ block, working towards consensus, finalization of the block by the bidder, and\
    \ addition of the block by everyone to their chain and confirmation of the transactions.\
    \ A secure chain is a single main chain with a consistent state. Every valid block\
    \ added to this chain, adds to the trust level of the chain.\n\n**Consensus Mechanisms:**\
    \ It is a way of reaching consensus among miners to validate the transaction,\
    \ as it is a distributed ledger environment where user won’t be able to verify\
    \ or validate it centrally \\[[4](#9789815051452-C1.html#r4)\\]. There are two\
    \ known mechanisms for consensus:\n\n**Proof of work:** In blockchain, every miner\
    \ has to compete and being the first one to add a block in the chain. Every miner\
    \ will compete to get a unique hash key in the shortest span of time. For this,\
    \ they have to use their core computation resources in PoW. Such winning solution\
    \ transactions used for hash calculation are then approved and a new block is\
    \ added to the blockchain. These miners use a lot of computational resources to\
    \ evaluate the hash function in record time. PoW protocols are used to calculate\
    \ hash functions with minimal computational resources.\n\n**Proof-of-Stake:**\
    \ As mining involves lots of computation power, Proof-of-Stake gives mining power\
    \ depending on the stake of bitcoins they hold. This will ensure that only the\
    \ authorized person can mine and attack on the chain. The only cryptocurrencies\
    \ which use this technique is altcoins. One of the major issues with this algorithm\
    \ is that users can misuse their power of high stakes.\n\n### IOT Security\n\n\
    Internet of Things (IOT) is the interconnection between smart devices, which communicate\
    \ with each other. When we are talking about smart devices, this means they are\
    \ able to monitor, control, optimize and automate the process in one or another\
    \ way. These devices can be anything like network devices, home appliances, wearable\
    \ devices, sensors, industrial instruments/machines, vehicular sensors or any\
    \ embedded device.\n\n**Challenges in IOT** With an increase in the number of\
    \ smart devices around us, IoT is an emerging technology for connecting all the\
    \ devices together. Since IoT is the most talked technology right now, built with\
    \ connecting devices. Due to such heterogeneity in devices, there are various\
    \ challenges which the current IoT system faces. At one side, IoT is a much sought\
    \ technology by various businesses and industries, but it also leads to various\
    \ challenges. The challenges in IoT \\[[5](#9789815051452-C1.html#r5)\\] are basically\
    \ of two types- Technological challenges and Security challenges \\[[6](#9789815051452-C1.html#r6)\\\
    ]. Technological challenges mainly focus on peer’s or node’s computational capacity,\
    \ their interconnection, bandwidth consumption and various performance parameters\
    \ adjustments. These concerns can be hardware related as well as software related.\
    \ Whereas security issues can range from secure data storage, data transmission,\
    \ key distribution, *etc.* Some of the major challenges are listed here in Fig.\
    \ [(**2**)](#9789815051452-C1.html#f2).\n\n![](Images/9789815051452-C1-F2.jpg)**Fig.\
    \ (2))**  \n\nKey challenges io IoT.  \n\n1.  **Security:** Ask any expert the\
    \ biggest challenge in this era and they will be spontaneously saying security\
    \ of IoT devices. As with the increase in the number of devices, IoT increases\
    \ attack surface area. Attackers do not attack main devices, rather they compromise\
    \ the devices with security vulnerabilities. For example, in 2017, a casino was\
    \ attacked using a thermostat in fish tank. Most of the common and damaging attacks\
    \ are through home monitors, like IoT based baby or elderly monitors. There are\
    \ various reported cases in which attackers attacked through toys, health monitors,\
    \ wearable devices, *etc.*\n\n2.  **Regulatory Policies:** There must be standard\
    \ policies which should be established to properly manage, protect and transmit\
    \ data in a very effective way. Lack of such strong policies is a major reason\
    \ behind IoT security issues. This situation becomes more complicated with the\
    \ expansion of attack surface due to usage of so many devices, and as these devices\
    \ can be anything like toys, medical instruments, cars, modems *etc.* All the\
    \ current policies established doesn’t work in variant IoT scenarios. Policies\
    \ should be established to promote and standardized IoT. Quality control in IoT\
    \ can be highly complicated and due to a wide range of sensors and devices imported\
    \ from other countries, such policies should be worldwide acceptable.\n\n3.  **Integrity:**\
    \ Integrity is to deliver the message securely in end-to-end devices. Data may\
    \ be corrupted during transmission. It should be ensured that the message is delivered\
    \ securely. IoT nodes are very low computational devices, so end point security\
    \ cannot be guaranteed. The only thing which can be done, is securing messages\
    \ while transmitting it . For this end to end encryption, algorithms can be used.\
    \ There are a wide range of such algorithms available, but the only issue is that\
    \ these algorithms should be light weight.\n\n4.  **Availability:** There is a\
    \ huge amount of IoT data which is meant to be readily available for usage whenever\
    \ required. One of the important features of IoT is temporal data, and it is meant\
    \ to be available on time to achieve the desired results and analysis.\n\n5. \
    \ **Bandwidth:** IoT devices work on distributed model whereas traditional content\
    \ delivery system works on the central server-based model. This condition becomes\
    \ worst with the addition of more and more devices on regular basis. Also, each\
    \ device has varied bandwidth requirements, where there can be a condition for\
    \ one device with high bandwidth leading to drought condition for other devices.\
    \ This can be managed by intelligent switching of bandwidth between various mobile\
    \ devices."
