    VANET 具有智能特性，包括智能车辆，这些车辆能够为双方（即发送方和接收方）之间的通信做出自适应决策。面临的主要挑战可能是在如此恶劣的交通条件和受限移动性参数下，将消息传递到目的地。VANET
    是一种实时应用，但缺乏安全性、可扩展性、高效路由和聚类协议。本章的重要部分是强调基于区块链系统的安全性。区块链技术用于车辆节点之间的准确信息传播。这里我们得出结论，将区块链系统的方法与车载自组网相结合，确保了传输过程中数据的安全性。


