  trans: "\n\n¹ School of Electronics and Electrical Engineering, Lovely Professional\
    \ University, Phagwara, Punjab, India  \n\n## 摘要\n\n由于区块链是比特币的核心技术，近年来区块链备受关注。其应用正在扩展到各个领域，包括物联网（IoT）防御、银行业、工业和医疗中心。此外，由于物联网在全球智能家居和城市发展中的广泛应用，其受欢迎程度不断提高。本文介绍了一种主要面向水培的温室自动化系统的设计。除了设计之外，本研究的目的是监控、控制和可视化数据。该项目解决了传统农业中的一些问题。诸如因土地面积小且分散而无法进行农业、使用粪肥和农药的风险以及缺乏机械化等问题。该项目的组成部分包括主模块（以下简称\
    \ `AGMS`）、云端和最终用户。数据可视化通过一个网站实现，该网站将通过 Wi-Fi 模块通过 `API`s 获取数据。该研究还包括向 Twitter\
    \ 和邮件等社交媒体平台发送警报。\n\n**关键词：** `API`, `Blockchain`, `MCU`, `Server`。  \n\n* * *\n\
    \n^(\\*) **通讯作者 Harpreet Singh Bedi：** School of Electronics and Electrical Engineering,\
    \ Lovely Professional University, Phagwara, Punjab, India；电子邮件：harpreet.17377@lpu.co.in\
    \  \n\n## 引言\n\n众所周知，农业是首要需求，而传统做法正随时间推移而退化。印度农业部门占国内生产总值（GDP）的 18%，然而，该国农业实践并没有重大进展。不过，也有一些现代技术，如水培、气培和垂直农业。\n\
    \n农业是世界主要的粮食来源。在历史上，它一直是文明进步的关键参数。根据联合国（UN）的数据，世界人口将增加 20 亿，达到 78 亿\n\n亿人，到 2050\
    \ 年，这意味着到本世纪末，地球需要养活约 110 亿人。\n\n如图 (**1**) 所示，农业发展经历了四次不同的革命：1）以人力和畜力为主的传统农业时代，2）以轰鸣声为特征的机械化农业时代，3）以高速发展为特征的自动化农业时代，4）以新兴技术为特征的智慧农业时代。因此，智慧农业为可持续发展提供了一条技术辅助的道路。它涉及在农场管理的网络物理循环中使用\
    \ ICT，利用物联网（`IoT`）、云计算、机器人技术和人工智能（`AI`）等技术。\n\n![](img/9789815051452-C4-F1.jpg)**图\
    \ (1)**  \n\n农业四次革命。\n\n智慧农业是一种可持续的农业技术，通过为每种植物或动物提供其茁壮成长所需的一切，以最佳方式提高运营精度，在最大化整体性能的同时减少浪费、投入和污染物。虽然智慧农业是一项先进技术，但它仅仅考虑了田间条件。另一方面，智慧农业更进一步，通过数据管理责任来实现，这由情境和情境意识加强，并由实时事件驱动。\n\
    \n智慧农业在早期受益于物联网、低成本且性能增强的传感器、执行器和微处理器、高带宽无线技术、基于云的 ICT 系统、大数据分析、人工智能和机器人等新技术的进步。农场设备不再是唯一的数据来源；存在将数据转化为行动的新服务。在农业中使用\
    \ `IoT` 旨在为农民提供所需的工具，帮助他们做出更好的决策并自动化流程，通过提供改善生产力、质量和利润的商品、知识和服务。\n\n水培是一种在水面上种植植物而无需土壤的方法。植物在土壤中种植时所获得的营养，是根据需要手动给予的。这种方法的主要优势是生长所需的时间短，且过程中不需要任何肥料。当在非常小的区域进行时，水培不需要自动化系统，但当进行大规模生产时，自动化系统至关重要。自动化温室监控系统为水培提供自动化、控制和可视化。自动化是由连接各种植物生长所需传感器的可编程\
    \ `Microcontroller Unit` 完成的。控制是由 `MCU` 连同最终用户界面完成的。整个过程通过云服务器运行，该服务器将始终处于活动状态，并向最终用户界面发送警报和警告，最终用户界面包括一个网站以及通过数字和图表进行的数据可视化。\n\
    \n云端的主要工作是以非常低的数据速率进行数据传输，以便该项目具有广泛的覆盖范围。最终用户部分很简单，考虑到农民可以零努力地使用它。该系统解决了无需人工干预即可监控和控制任何自动化系统的问题。\n\
    \n## 讨论\n\n### 水培\n\n有多种水培方法，其中最好、最高效的是 NFT（`Nutrient Film Technique`）方法。这种技术因其简单而高效的设计而非常流行。NFT\
    \ 常用于种植生长快的植物，如生菜和菠菜。除此之外，商业上，绿色香草和草莓也可以用这种方法种植。\n\n在这种技术中，非常浅的营养液被倒入管道中。该管道倾斜放置，并在房子的上方有一个孔，需要小容器来放置种子/幼苗。这些容器是网状花盆，用于容纳植物和生长介质，如椰子纤维和干草。NFT\
    \ 系统的各个部分包括营养液储液罐、将营养液输送到管道的营养泵、从泵向生长花盆分配水的管道、容纳植物/种子的花盆以及回收系统，用于收集溶液并将其送回管道以循环该过程。\n\
    \n在 NFT 过程中，生长托盘和储存装置是除所有其他组件之外的两个最重要的部分。生长托盘由网状花盆组成，用于容纳植物和营养液，以及椰子、珍珠岩和 Rockwool\
    \ 等生长介质。然而，某些植物种类不需要这些溶液，因为它们从系统中获得足够的水分、营养和氧气。植物根系在通道中形成密集的垫层，而叶片位于顶部，在某些情况下由支架系统支撑（类似于种植葡萄藤的系统）。要构建最佳的\
    \ NFT 系统，需要合适的坡度、流量和通道长度。此外，植物根系必须得到适当暴露，以收集足够的氧气、水分，最重要的是营养 \\[1\\]。\n\n"
