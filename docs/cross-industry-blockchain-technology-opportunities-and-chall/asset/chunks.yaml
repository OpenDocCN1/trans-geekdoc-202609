- raw: "### Digital Signatures and Hash Functions\n\nEvery new data entry is encrypted\
    \ using the hash function on the original message. It means only one hash is possible\
    \ for one original input and it is impossible for another input to have the same\
    \ hash \\[[43](#9789815051452-C2.html#r43)\\]. A ‘transaction block’ contains\
    \ this hashed transaction with a size limit \\[[44](#9789815051452-C2.html#r44)\\\
    ]. Hash helps in detecting transaction data tempering as hash is computed at receiver’s\
    \ end, that generates a different hash than the original hash in case of tempering.\
    \ Fig. [(**3**)](#9789815051452-C2.html#f3) explains the public key cryptography\
    \ in digital signatures.\n\n![](Images/9789815051452-C2-F2.jpg)**Fig. (2))** \
    \ \n\nDistributed ledger. \n\nThe transaction blocks are digitally signed using\
    \ a digital signature. ‘Public key cryptography’ is used for digital signature\
    \ in DLT. Append-only chain of ‘transaction blocks’ is formed that contains a\
    \ digital message (hash digest) to be added to the ledger, a consensus mechanism\
    \ output (proof-of-work), digital signature of the hash using sender’s private\
    \ key, sender’s public keys and intended recipients of the transaction. Fig. [(**4**)](#9789815051452-C2.html#f4)\
    \ explains a blockchain structure example: In a blockchain of 4 blocks, the last\
    \ block (block 5) is added. Block 1 is the ‘genesis block’. Each block contains\
    \ previous block reference to maintain chronological blocks ordering, a hashed\
    \ digest transaction series and a digital signature.\n\n![](Images/9789815051452-C2-F3.jpg)**Fig.\
    \ (3))**  \n\nDigital signatures public key cryptography. \n\nIn Fig. [(**3**)](#9789815051452-C2.html#f3),\
    \ block 5 represents the newest addition to this blockchain which updates the\
    \ ledger.\n\nOnce a new block is added to the chain *via* a specified consensus\
    \ mechanism, the chain cannot retroactively be changed and blocks cannot be deleted\
    \ or amended without redoing the proof-of-work protocol for each block. This means\
    \ that as the chain grows in length, this becomes progressively more difficult\
    \ because all the nodes are constantly competing for solving proof-of-work puzzles\
    \ and adding new blocks to the chain. In doing so, they only consider the transaction\
    \ blockchain that reflects the greatest amount of the computational work. Each\
    \ successful addition to the chain broadcasts to the entire network and all nodes\
    \ have an up-to-date copy of the entire blockchain.\n\n1\\. Mr. A has two keys:\
    \ a public key, which he shares with the entire network, and a private key that\
    \ is only known to Mr. A.\n\n2\\. Mr. A uses his private key to encrypt a “hash”\
    \ of the digital message, which is then propagated to the entire network. The\
    \ encrypted hash is called the “digital signature”.\n\n3\\. Network participants\
    \ receive the digital message with a digital signature.\n\n4\\. Mr. B can then\
    \ use Mr. A’s public key (which he has shared with him) to validate that the digital\
    \ message was encrypted with A’s private key and Mr. A is the sender of the message.\n\
    \n![](Images/9789815051452-C2-F4.jpg)**Fig. (4))**  \n\nStructure of blockchain.\
    \ \n\n## DLT ADVANTAGES\n\nDistributed ledgers have many advantages over centralized\
    \ ledgers. Advantages are listed below.\n\n### No Middleman and Decentralized\
    \ in Nature\n\nDLT eliminates the need for central authority and enables digital\
    \ value transfer between two parties with decentralized record keeping. This saves\
    \ the cost, improves scalability and speed.\n\nDLT enables automation using programming\
    \ by automatically executing pre-agreed conditions on some events *e.g.* automatic\
    \ payment of invoices on arrival of shipment. In a digital ledger, the counterparties\
    \ agree on the defined conditions at the completion of the transaction, and all\
    \ parties have the same set of transaction records. In addition, the execution\
    \ result of “smart contract” will lead to a reconciled legacy ledger system.\n\
    \n### Improved Auditability and Enhanced Transparency\n\nEach network node has\
    \ a full identical copy of the encrypted distributed ledger. The changes are possible\
    \ only with consensus mechanisms upon real time network propagation. This feature\
    \ helps to manage reconciliation costs and reduce fraud.\n\n### Perpetual and\
    \ Testable\n\nDLT has an immutable/perpetual and testable transaction audit trail\
    \ of any asset. Perpetuity nature of a transaction does not mean that a countervailing\
    \ disputed transaction cannot be created. The original transaction record will\
    \ be still available in this case.\n\n### Speed and Efficiency Gain\n\nDLT optimizes\
    \ efficiency and improves speed by eliminating intermediaries and by automating\
    \ processes.\n\n### Reducing Cost\n\nDLT eliminates the need for reconciliation\
    \ and thus reduces the cost as every DLT contains the “shared truth” and there\
    \ is no need to verify one “truth” with another counterparty. DLT lowers the infrastructure\
    \ costs for ledger maintenance and reduces chance of fraud. Distributed ledger\
    \ technology can save $15-20 billion for the financial industry \\[[45](#9789815051452-C2.html#r45)\\\
    ].\n\n### Improved cybersecurity Elasticity\n\nDLT provides a more flexible system\
    \ than centralized system and provides a better shield against cyber-attacks due\
    \ to its distributed property and absence of a single attack point. When compared\
    \ with the centralized design paradigm, DLT is an alternative design paradigm\
    \ for decentralized operational model and business. This will lead to a higher\
    \ degree of automation, scalability and faster processing potential. We will understand\
    \ it by comparing a centralized collateral registry with DLT based collateral\
    \ registry system. In case of a centralized approach of establishing a collateral\
    \ registry, a dedicated platform is set up by a central entity followed by membership\
    \ criteria establishment and establishment of rules and procedures. All transactions\
    \ and actions are initiated by the centralized platform. This platform is developed\
    \ using standardized software development tools to address specific business requirements.\n\
    \nIn contrast, a DLT-based approach involves a collateral registry of peer-to-peer\
    \ transactions with peer-defined conditions such as the release date and protocols\
    \ defining rules in case of transaction failure. Based on the counter parties’\
    \ agreement, a DLT-based collateral registry system can be tailored without setting\
    \ up a centralized system for a particular collateral. The role of the administrator\
    \ in a DTL-based system is minimal. Business actions can be triggered without\
    \ external intervention and are event-driven. As resource requirements at the\
    \ administrator level are limited, setting up a DLT-based collateral registry\
    \ system is faster and scalable. All participants share the processing load and\
    \ collateral transactions business logic can be customized on counter parties’\
    \ requirements.\n\n## DLT RISKS AND CHALLENGES\n\nThe technology is emerging and\
    \ many issues are to be addressed including regulatory and legal issues. There\
    \ are many issues related to migrating payments, financial infrastructure and\
    \ digital ledger technology. A cohesive collaboration and coordination are required\
    \ for security settlement systems and central counterparties. The common challenges\
    \ of DLT including regulatory, technological and legal are listed as below:\n\n\
    ### Technical Issues\n\n#### Immature Technology\n\nDLT is still in the infant\
    \ development stage and there are complex challenges about flexibility and robustness\
    \ of DLT. In addition, there are concerns about volumetric transactions, supply\
    \ of skilled professionals, availability of software applications and standardized\
    \ hardware. However, top IT organizations and financial majors have started investing\
    \ in the development of DLT products and services to provide the same confidence\
    \ as existing IT systems offer.\n\n#### Transaction Response Time and Scalability"
