    # Healthcare Evolution and Technological Integration


    Healthcare has come a long way from where it started. If we look at the trend
    of healthcare, right from using herbs for everything and then for using chemical
    medicines for treating various diseases, healthcare surely has taken a turn. The
    wars in some way made countries realize that they need to focus more on the health
    of fellow soldiers. New methods were being implemented - using penicillin to reduce
    the infection severity and spread, which eventually led to its mass production
    in the coming years. Further, more advances were made in the field of healthcare
    – the polio vaccine (1952), the first successful kidney transplant (1954), antiviral
    drugs (1960), and Immunotherapy (1970s) \[[41](#9789815051452-C5.html#r41)\].


    It was in the early 1960s when the concept of Problem-Oriented Medical Records
    (POMR) originated by Dr. Lawrence L Weed. It was a breakthrough in the research
    sector for medical sciences because now all the data about a particular topic
    was available in one place and this method changed the entire perception of the
    research team. A separate database for each patient was created consisting of
    problems, the treatment undergone and the test reports which would help in carrying
    the treatment further \[[42](#9789815051452-C5.html#r42)\].


    So far, we have discussed about the key features of BCT and IoT and how their
    independency can open the doors to new technological advancements. The main focus
    of this section is to take consideration of bringing BCT, IoT and Healthcare Sector
    under one page. In the coming years, the healthcare model is going to become more
    patient-centered. We will seek progress on effectiveness and safety of the patients
    and their sensitive data \[[43](#9789815051452-C5.html#r43)\].


    In the recent year, the spread of COVID-19 has made us focus on healthcare for
    everyone. We have to reduce contact so the traditional methods do not fit well
    here. We need to be able to collect data of the people and be able to access it
    remotely to understand which area is more affected with the pandemic and the POMR
    was also being collected to understand the disease better. More emphasis is being
    laid on being able to collect this data through IoT rather than physically. Infected
    person’s record is being analyzed and the places they visited were being quarantined
    to prevent any kind of spread \[[44](#9789815051452-C5.html#r44)\]. Applications
    are developed to help in locating people to alert them about their environment
    and at the same time, their privacy needs to be safeguarded too. Using BCT, we
    can increase the efficiency of the transfer of this data and ensure the safety
    of this data from attackers. IoT will help in the wireless transmission of the
    data being collected and BCT will ensure that this data is not tampered with.
    BCT creates a ledger of all the transactions taking place and we will be able
    to identify every chunk of data being added and the users connected to this data
    \[[45](#9789815051452-C5.html#r45)\].


    # Healthcare Data, IoT, and WBAN


    With an exponential increase in the sector of healthcare, healthcare insurance
    and other important aspects related to the same have now become an indispensable
    part of human lives hence leading to an enormous collection of medical data. This
    data may comprise diagnosis and treatment processes, wearable technology data,
    records, and history of patient’s data thus leading to an inevitable use of BCT
    and IoT for analyzing and securing this very important data. Since our generation
    has witnessed billions of sensors amalgamated with various other devices, hence
    keeping a record and analyzing this data has now become an indispensable job that
    surely requires huge attention and all the more security and privacy and this
    can only be achieved by deploying BCT and IoT in it. If this medical data so collected
    is not available at the right moment or there is even a significant amount of
    delay in the reception of this data, it may lead to a delay in the treatment process
    and much worse even lead to endangering the patient’s life \[[8](#9789815051452-C5.html#r8)\].


    Along with huge applications and a wide horizon of IoT, a huge trend is also visible
    in the healthcare sector and even a good deal of emphasis is also given to Wireless
    Body Area Networks (WBANs). Mainly in WBAN, a patient is equipped with various
    health wearable gadgets specifically dedicated for the tracking and measurement
    of various real-time specifications of health like heart rate, pulse rate, glucose
    level, *etc.* All these gadgets are controlled or supported by a master device
    (like a smartphone) that works autonomously and sends this data to a trustworthy
    health care service provider. Not only does this help in reducing doctor’s appointment
    but also help the patient to live a healthy life with utmost caution. The popularity
    of these devices has taken an exponential growth path as predicted to reach almost
    50 million by 2021. As this realm of remote patient monitoring expands, obviously
    the need for a more safe and secure transmission of this data also increases.
    The best manager for this type of work is none other than BCT, as this medical
    data is quite lucrative for hackers \[[46](#9789815051452-C5.html#r46)\].


    Internet of Medical Things (IoMT) will revolutionize healthcare in the coming
    years. IoMT is a combination of IoT with medical sector enabling medical devices,
    software and health systems. Again for analyzing the same, it involves WBAN whereby
    using wearable devices we will be able to monitor the vitals of a patient remotely
    and even can provide this information to a healthcare center for further evaluation.
    We will be able to treat patients even in their homes using these devices. This
    will improve the patient flow in the hospital and will enable the medical team
    to treat more patients. Traditional healthcare methods are moving toward digitization
    using IoT-enabled devices \[[47](#9789815051452-C5.html#r47)\]. This method of
    remote monitoring will not only assist the patients and save them from visit,
    saving time for both the medical team and the patient but can save up to 300 billion
    dollars for a country like America, according to Goldman Sachs \[[48](#9789815051452-C5.html#r48)\].
    Imagine the impact it can have on other countries! IoMT faces an issue in security
    and vulnerability because of its diversity and wireless approach which can be
    handled using BCT. BCT network can play a role as a middleware, being able to
    allocate resources in an efficient way \[[49](#9789815051452-C5.html#r49)\].


    # BCT Framework and Security


    So, to make the life of hackers miserable, or to bring all their plans to a dead
    end, a sophisticated framework powered *via* BCT can be designed. BCT is also
    capable of implementing smart contracts, which are pieces of code that can automatically
    execute based on predefined conditional triggers and these triggers can be designed
    as per the need and condition of the patient. In addition to this, while confronting
    Protected Health Information (PHI), privacy and authenticity are quite essential
    and the tool useful for this is BCT as no confidential medical information will
    be stored in BCT or in those smart contracts; all the measurements themselves
    will be forwarded to designated storage database. These types of authentications
    are not only helpful in preventing and detecting alterations but also in rectifying
    these alterations if happens due to any accident or purpose. BCT having the potential
    to improve security in remote patient monitoring systems thus automates the delivery
    of health-related notification for compliant issues. It can fix current problems
    with poorly managed patient data by adding formatted and clean data to EHRs and
    healthcare data lake, allowing healthcare to utilize Big Data with more reliable
    information, leading to more significant results.

