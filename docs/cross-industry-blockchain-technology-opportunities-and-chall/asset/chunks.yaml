    We, as humans have realized that nothing in this world can be considered perfect
    or achieving that Utopian world is just our dream, so we discuss about the challenges
    faced by IoT that are data management challenge, data mining challenge, privacy,
    chaos and lastly security (Table [**3**](#9789815051452-C5.html#t3)). BCT comes
    as a savior and this has been discussed in the latter half of the paper.


    Moreover, security goals are very much needed by every system and certain principles
    are to be followed that are confidentiality, integrity, availability, authentication,
    lightweight solutions, heterogeneity, policies, key management systems \[[23](#9789815051452-C5.html#r23)\].


    ### Integrated Solutions using BCT and IoT


    Digital innovation is the need of the hour and various new reforms are required
    in this field. Digital innovation is nothing but the use of digital technology
    for a wide range of innovations. The early history of institutional theory provided
    a particular version of change that organizations come to look more like each
    other because of the strength of legitimacy and socio-cultural pressures. A central
    process is that of isomorphism, that is, those organizations come to look more
    alike through normative, mimetic and coercive pressures. Studying digital innovation
    and transformation from an institutional perspective is about how digitally-enabled
    institutional arrangements emerge and diffuse both through fields and organizations.
    Similarly, ideas and key core concepts can be visualized in BCT amalgamated with
    IoT. Before diving into this cohesive concept, first let us have a brief idea
    about what it has for us in its bag of surprises \[[24](#9789815051452-C5.html#r24)\].


    The Internet of Things (IoT) is cracking its shell and evolving into full maturity
    thus establishing itself as part of the future. As predicted by 2022, more than
    18 billion devices will be available across the world and as IoT has been encompassing
    this world of technology is destined to create all the more new challenges in
    the IoT domain \[[25](#9789815051452-C5.html#r25)\]. IoT is an underlying background
    for various devices that are responsible for generating and exchanging information
    as well as private sensitive information thus making it vulnerable to various
    cyber-attacks. Moreover, the new devices that are associated with IoT are light
    weight and have to devote most of their energy to multitasking and hence including
    BCT for IoT security is a unique yet effective way out. Blockchain can help in
    the enrollment of IoT devices and keep a regular integrity check on the devices
    \[[26](#9789815051452-C5.html#r26)\]. IoT has a broad range of applications and
    with ever increasing demand in the devices and the availability of internet to
    every person has opened the doors to research and new development. Since the amplification
    of IoT features, it has led to some lacks and difficulties in its security and
    privacy that encompass various threats such as lack of central control, heterogeneity
    in device resources, multiple attack surfaces, context specific risks, and scale
    \[[27](#9789815051452-C5.html#r27)\]. The ever increasing and now becoming the
    more ubiquitous, BCT has a good and a strong hold in the evolution and miniaturization
    of IoT that trace its path coming all the way from a very lame and conventional
    usage. This has not only resulted in a colossal advancement but also has led to
    various new emerging technologies like Wireless Sensors Network (WSNs), Radio
    Frequency Identification (RFID), *etc.* \[[28](#9789815051452-C5.html#r28)\].


    IoT has taken over the world suddenly and there is a huge amount of real time
    data being collected on a regular basis. The traditional methods cannot be efficient
    for such huge data and it is not a very good practice to store data directly on
    the cloud \[[11](#9789815051452-C5.html#r11)\]. The data should be readily available,
    offer low latency and the devices should be scalable. The centralized data can
    be tampered easily and we can never be able to trust these IoT companies with
    our sensitive data. We need a distributed, decentralized system where every data
    being added or altered is first verified by all the systems in that network.


    In addition to this, the manifold and presence of IoT have led to an ever-increasing
    demand of the Internet, security and many more important aspects, and the amalgamation
    of IoT with BCT now becomes a primary concern. IoT not only makes the users utilize
    the resources of it but even the creators of innovative application for end users
    also make BCT a perfect tool for aggravating the results. The most basic and foremost
    challenge of IoT is nothing but Security, or one can even call it as *‘privacy
    concern’*. Since the integration of BCT and IoT has led to overcoming of this
    challenge hence centralized companies manage data and privacy using the integration
    of both. BCT has the potential to overcome the challenges associated with IoT
    as a result of its distributed, secure, and private nature.


    As already discussed, Blockchain is a decentralized, immutable, transparent and
    secure ledger of all the information. Keeping in mind the benefits of BCT, more
    than 1.4 billion dollars were invested in BCT in the first 9 months of 2016 \[[29](#9789815051452-C5.html#r29)\]
    and this number is still increasing exponentially. Blockchain is a sector still
    in development so there is still a room for a lot of improvements. Addition like
    ‘GHOST’ which will increase the block creation rates and we will be able to create
    large blocks of data \[[30](#9789815051452-C5.html#r30)\]. The implementation
    of Content Distributed Network (CDN) will be able to increase the speed of data
    propagation in the BCT and thus will be able to remove any inconsistencies arising
    due to the distributed approach and also, it will protect the network from double-spent
    attacks \[[31](#9789815051452-C5.html#r31)\].'
