    # BCT 在安全与医疗领域的应用


    BCT can help in security because of its natural properties of decentralization,
    immutability and as mentioned earlier it has been proved successful against different
    malicious attacks. BCT can offer privacy because all the transactions are saved
    with an encryption key so the attackers will not be able to locate the source
    of the data. Timestamps in the blocks would not allow anyone to add any data in
    between, thus highlighting immutability of BCT \[[50](#9789815051452-C5.html#r50)\].
    BCT can be beneficial in transferring the data as well. There will be no data
    loss, more integration and security of the data. Data being added requires verification
    from other nodes in the network so any malware will not be able to creep its way
    \[[51](#9789815051452-C5.html#r51)\].


    One can even think of applying the key ideas of BCT to a health application network
    where the collected data can be used to generate important alerts to authenticated
    healthcare service providers in a very secure, robust and private manner. It is
    clear so far that a variety of smart IoT devices are used in a sandwiched form
    of layers of Internet. From these layers, data is collected, analyzed and henceforth
    subjected to use for health care service providers. Since IoT devices are lightweight
    and have shallow footprints so often tend to leave very shallow energy footprints.
    This small amount of energy is not feasible for the tasks involving security or
    privacy, hence BCT comes into picture. IoT has a lot of demerits but its extensive
    use often sometimes leads to some scalable approach and many a times, it may become
    quite challenging and thus deploying BCT can turn out to be a very profitable
    deal \[[52](#9789815051452-C5.html#r52)\].


    The year of 2020 undoubtedly has been full of surprises and unseen circumstances,
    but the world has been definitely pushed back in terms of progress by the virus,
    COVID-19. The unprecedented flow of this virus has given rise to various challenges
    especially in the healthcare sector and thus technological advances have to shine
    as a savior for humankind and these advances are nothing but novel technologies,
    such as AI, BCT, ML and IoT. On a keynote, BCT has been discovered by the European
    Parliamentary Research Service (EPRS) as one of the key novel technologies to
    fight COVID-19. Out of all the key traits possessed by BCT, when amalgamated with
    IoT, it can progress greatly to overcome all the ordeal put forward by this virus.
    This umbrella can be expanded to various applications such as contact tracing,
    patient information sharing, supply change management, e-governance, disaster
    relief and insurance, online education, various autonomous services, manufacturing
    industry, agriculture and food distribution \[[53](#9789815051452-C5.html#r53)\].


    So far, we have looked at the possible outcomes or the domains where the three
    majors of our topic come under a single umbrella but what still remains archaic
    is the authenticity and security of the data that will still prevail if the system
    or the framework supporting the entire network is not BCT equipped. Moreover,
    what still is detrimental is the cyber-attack and frequent attacks on the health
    care systems leading to devastating data loss. So, when the entire data is handled
    with a quite robust, immutable, non-hackable system, it will not only be helpful
    for the healthcare department or the organization but even the system now will
    be responsible for the patient’s personal data loss. If the system now handling
    this entire framework is storing the data in an encrypted format, even if the
    system somehow gets shut down or faces any technical glitch still the data will
    be protected and stored in a secure place \[[54](#9789815051452-C5.html#r54)\].


    In the year of 2020, the number of setbacks that were faced was numerous but if
    one asks any digital enthusiast that what led to the digital transformation of
    their company, a sheer answer would be COVID-19. The development of various smart
    apps like Aarogya Setu, Kwarantannadomowa, Trace Together, LetsBeatCOVID, COVID
    Watch, `etc.` was inspired by the amalgamation of IoT and BCT and definitely the
    other novel technologies so far discussed such as the reliable sharing of data,
    patient monitoring, and checking the dues so provided to the patient can be simply
    powered by BCT running in the backhand. Moreover, it can be useful in providing
    transparency to the users as well \[[55](#9789815051452-C5.html#r55)\]. Although
    this pandemic did bring several limitations, but it also opened doors for many
    digital innovations. Moreover, in the past years, it has been visualized that
    even checking for occupancy may lead to errors thus a framework can be proposed
    to protect the data that shall be collected from this occupancy. The data so collected
    can then further be provided to the requisite stakeholders for more cognitive
    research works \[[56](#9789815051452-C5.html#r56)\].


    Taking into consideration today’s scenario, the medical field is considered to
    be quite complex, significant and rapidly growing and a huge amount of funds are
    utilized in this field. A prominent example of which can be seen for COVID-19.
    Undoubtedly multimedia has taken an intricate form where there exists a tremendous
    amount of symbiotic relationship between the two, from improving the quality of
    the interaction of patients with the healthcare service providers and transferring
    the patient’s data in various forms such as images, texts and audio `via` online
    using various smart objects. But if we look at this whole picture very closely,
    we’ll notice that managing the entire data is not easy as it not only has storage
    issues but human efforts and security risks are quite formidable. Threats occurring
    in these IoT devices are also initiated by various intruders that may lead to
    leakage and misuse of the data of patient. In order to overcome all the above
    stated issues, BCT can be effectively deployed as it not only provides a secure
    framework, but also protects the entire control system in real-time scenario.
    When the entire result was simulated, a sheer peak of 86% success rate was seen
    within the first deployment of BCT that covered various aspects like product drop
    ratio, falsification attack, worm-hole attack, and probabilistic authentication
    scenarios \[[57](#9789815051452-C5.html#r57)\].


    IoT applications and healthcare system use a very refined interconnected device
    eco system for the betterment of the healthcare facilities. We are quite familiar
    that persons suffering from chronic illness often use up the healthcare services
    more often than any non-chronic diseased person and that leads to a creation of
    an immutable stamp of the records associated with the former patients. Despite
    all the technological advancements more or less, still setting up of a universal
    coding language or common communication protocol for this eco system still remains
    elusive. Hence a system is laid out that ensures that IoT systems with improved
    interoperability can also secure and guarantee confidentiality between nodes in
    that particular infrastructure and thus trusting the entire workload to BCT make
    the entire system, more efficient \[[58](#9789815051452-C5.html#r58)\]. Table
    [**4**](#9789815051452-C5.html#t4) provides the comparison of previous studies
    which integrated blockchain and IoT for solving problems in healthcare.


    # Table 4 Table of comparison for healthcare


    | S. No. | Problem Statement | Solution Proposed | References |

    | :--- | :--- | :--- | :--- |

    | 1. | There was no record of the problems being encountered and the solutions
    proposed for them by the medical staff. | Developing a Problem Oriented Medical
    Record capable of storing medical data and easily accessible by the medical team
    and researchers from any place. | \[[42](#9789815051452-C5.html#r42)\] |

