    ### 基于 DLT 的区块链在数字货币中的应用


    DLT 自发明以来就与数字货币密切相关，因为它被预期为比特币的底层技术。中本聪发表了一份白皮书，将该技术描述为“基于加密证明而非信任的电子支付系统，允许任何两方在无需可信第三方的情况下直接相互交易”
    \[40\]。


    比特币的区块链技术作为解决“双重支付”问题的方案出现，而双重支付曾是货币数字化转型的挑战。在比特币发明之前，交易验证由可信的中央机构处理以避免双重支付。DLT
    的妙处在于，它通过由匿名各方管理且彼此之间无需建立信任的去中心化账本，利用加密解决方案保护系统完整性并提供安全性。设计比特币区块链的动机是创建一种基于数字平台、不受政府控制并隐藏网络参与者身份的虚拟货币。与
    HTML 或 HTTP 不同，比特币在最初是一个意识形态项目，深深植根于其诞生的在线社区（被称为“密码朋克”）的反审查意识形态中，该社区推崇一种激进的技术自由主义
    \[41\]。除了数字货币，DLT 技术还有许多潜在应用。由于“匿名性”特性，比特币在犯罪分子中变得流行，并被用于金融欺诈和其他非法活动。交易双方的匿名性得以维持，但所有比特币交易对公众可见，并记录在分布式账本中。一笔比特币交易可以与特定的匿名实体关联。这种匿名过程类似于电子邮件地址的匿名性。所有比特币交易都包含假名，其中包含发送方和接收方的钱包地址。就像电子邮件一样，交易地址是已知的，但所有者可以保持匿名。


    比特币区块链的许多特性引起了监管机构和政府的警觉，并影响了加密货币的声誉。使用计算机恶意软件的赎金要求显著增加，且赎金要求以比特币形式支付以实现交易匿名性。比特币交易所缺乏监管，比特币的数据丢失问题是一个重大挑战。丢失钱包的私钥可能导致钱包中全部资金的损失。


    ### DLT 特性


    具有基于角色权限的集中式账本，可由网络中授权参与者编辑，长期以来一直在使用。不可变且分布式账本的概念是通过 DLT 提出的。DLT 有三个关键特性：分布式账本、加密方法和共识机制。DLT
    并非定义明确的技术；相反，它正在开发中，其设计取决于利益相关者的要求。


    ### 账本的分布式属性


    DLT 的妙处和创新在于，单个实体不控制账本，而是由网络节点或决定的若干节点控制。这意味着在数字账本中，过去的数据条目不能被修改，或者对账本的新增内容不能由单个实体批准。为了在账本中形成新条目，使用共识机制（去中心化的性质）将新条目添加到区块链中。成功验证后，新交易将被修改到相应的账本中，以维持网络级别的数据一致性。


    分布式账本技术的这一特性允许点对点网络参与者在不依赖可信中央机构的情况下，在其相应的账本中验证和记录数据。消除对中央机构的要求通过控制与账本对账和维护相关的工作来优化成本和速度。在没有单一攻击点的情况下，它也大大增强了安全性。网络中的大多数服务器必须被攻击者攻破才能损坏账本。损坏单个或部分网络参与者不会对系统的完整性产生任何影响。但是，如果设计不当，分布式账本之上的软件层可能容易受到攻击。软件层的设计问题给日本的
    Mt. Gox 和 Bitfinex 带来了重大财务损失 \[42\]。


    ### 使用“共识机制”进行验证


    网络中的节点需要就新数据条目的有效性达成一致。因此，在分布式账本的算法设计中引入了一种称为“共识机制”的机制。在分布式账本中，任何节点都可以提议向账本添加新交易。在分布式账本中，也可能只有少数节点被允许提议向账本添加新交易。利用数字账本共识机制的加密验证，验证特定交易的合法性。共识机制在同时出现竞争条目时也有助于解决冲突。在无许可数字账本的情况下，共识机制确保准确的交易排序并防止不良行为者接管。排序和共识机制有助于处理双重支付问题。“工作量证明”概念用于全球去中心化网络中以建立共识。在向链中添加每个新块时，“工作量证明”协议是必须的。这是一个难以解决但易于验证的复杂挑战。它涉及大量的计算能力和处理时间。工作量证明通过执行单向加密哈希算法（重复执行）直到产生满足预定义条件的数字字符串来实现。在比特币区块链的情况下，该数字包含前导零，工作量证明生成过程被称为“挖矿”。解决这个“工作量证明”谜题在计算上非常困难。没有昂贵的计算资源，网络中单个节点生成所需工作量证明的机会较小。比特币系统的设计方式是每十分钟产生一个有效的工作量证明。优先权给予难度分数更高的协议，这意味着如果同时生成两个工作量证明，则难度分数更高的协议被视为有效。实体“矿工”会以比特币形式获得奖励，以产生有效的工作量证明。这种奖励有助于维护系统完整性。网络安全性取决于大量被激励的节点，它们准确验证账本更改和共识建立，以维持网络中的数据一致性。“工作量证明”对参与者维护数字账本施加了沉重的计算成本。它在不信任参与者的系统中是必需的。


    比特币矿工的电力消耗相当高。如果比特币网络扩展到类似万事达卡和维萨的水平，电力需求将超过全球现有的电力消耗。这个问题主要存在于比特币区块链中。以太坊数字货币使用的另一种
    DLT 系统具有更快的共识机制，并需要显著更少的计算资源。在许可区块链中，网络参与者是受信任且预先选定的，因此他们不需要困难的“工作量证明”作为共识机制。还有其他共识机制提供优先于计算能力的机制，并要求某些资产的所有权证明，例如权益证明。图
    (**2**) 解释了集中式账本和分布式账本（有许可和无许可）。


