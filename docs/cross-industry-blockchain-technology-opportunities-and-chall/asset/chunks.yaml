    \ biggest challenge in this era and they will be spontaneously saying security\
    \ of IoT devices. As with the increase in the number of devices, IoT increases\
    \ attack surface area. Attackers do not attack main devices, rather they compromise\
    \ the devices with security vulnerabilities. For example, in 2017, a casino was\
    \ attacked using a thermostat in fish tank. Most of the common and damaging attacks\
    \ are through home monitors, like IoT based baby or elderly monitors. There are\
    \ various reported cases in which attackers attacked through toys, health monitors,\
    \ wearable devices, `etc.`\n\n2.  **Regulatory Policies:** There must be standard\
    \ policies which should be established to properly manage, protect and transmit\
    \ data in a very effective way. Lack of such strong policies is a major reason\
    \ behind IoT security issues. This situation becomes more complicated with the\
    \ expansion of attack surface due to usage of so many devices, and as these devices\
    \ can be anything like toys, medical instruments, cars, modems `etc.` All the\
    \ current policies established doesn’t work in variant IoT scenarios. Policies\
    \ should be established to promote and standardized IoT. Quality control in IoT\
    \ can be highly complicated and due to a wide range of sensors and devices imported\
    \ from other countries, such policies should be worldwide acceptable.\n\n3.  **Integrity:**\
    \ Integrity is to deliver the message securely in end-to-end devices. Data may\
    \ be corrupted during transmission. It should be ensured that the message is delivered\
    \ securely. IoT nodes are very low computational devices, so end point security\
    \ cannot be guaranteed. The only thing which can be done, is securing messages\
    \ while transmitting it . For this end to end encryption, algorithms can be used.\
    \ There are a wide range of such algorithms available, but the only issue is that\
    \ these algorithms should be light weight.\n\n4.  **Availability:** There is a\
    \ huge amount of IoT data which is meant to be readily available for usage whenever\
    \ required. One of the important features of IoT is temporal data, and it is meant\
    \ to be available on time to achieve the desired results and analysis.\n\n5. \
    \ **Bandwidth:** IoT devices work on distributed model whereas traditional content\
    \ delivery system works on the central server-based model. This condition becomes\
    \ worst with the addition of more and more devices on regular basis. Also, each\
    \ device has varied bandwidth requirements, where there can be a condition for\
    \ one device with high bandwidth leading to drought condition for other devices.\
    \ This can be managed by intelligent switching of bandwidth between various mobile\
    \ devices.\n"
  trans: "\n\n### 3\\. 交易完整性\n\n它通过唯一保护账户地址来工作；发送方应在交易前使用数字签名进行身份验证，并确保所发送消息的内容。在区块链中，哈希和公钥加密都被使用。第一步是使用公私钥生成地址。最初取一个\
    \ 256 位随机数并将其保留为私钥，使用代码对其进行保护。其次，使用 ECC 算法从公钥生成私钥，之后，用户将拥有公私钥对。最后，使用哈希函数从公钥中提取账户地址。任何交易都需要验证其完整性。为此，需要对交易应用数字签名，并对数据进行哈希和加密。接收方分别获得这两样东西：原始数据和经过数字保护的哈希键。接收方随后需要从原始消息中重新计算哈希，并将其与接收到的安全哈希键进行比较。如果匹配，则接收方可以确保数据完整且未被更改，因此用户可以接受它。否则，接收方可以拒绝该交易。原始键和检索到的键仅在消息完整时匹配，如果消息被更改，则键将不匹配并导致接收方拒绝。在接收方端，还会验证各种其他内容，如时间戳、余额和\
    \ gas 余额，`etc.` 使用此完整流程，可以检查完整交易的完整性。\n\n### 信任要素和共识协议\n\n可以通过使用特定协议在去中心化系统中建立信任。这可以通过验证交易和区块以防止篡改、验证交易资源的可用性以及执行和确认交易来实现。信任轨迹由以下操作定义：验证交易、验证\
    \ gas 和资源、累积交易、执行交易以获取新状态、形成区块、朝着共识努力、由出价者最终确定区块、以及每个人将区块添加到其链中并确认交易。安全链是具有单一主链和一致状态的链。添加到此链中的每个有效区块都会增加链的信任级别。\n\
    \n**共识机制：** 这是矿工之间达成共识以验证交易的一种方式，因为这是一个分布式账本环境，用户无法集中验证或验证它 \\[4\\]。共有两种已知的共识机制：\n\
    \n**工作量证明：** 在区块链中，每个矿工都必须竞争，成为第一个在链中添加区块的人。每个矿工都会竞争在最短时间内获得唯一的哈希键。为此，他们必须在 PoW\
    \ 中使用其核心计算资源。然后，用于哈希计算的此类获胜解决方案交易将被批准，并向区块链添加新区块。这些矿工使用大量计算资源以创纪录的时间评估哈希函数。PoW\
    \ 协议用于以最小计算资源计算哈希函数。\n\n**权益证明：** 由于挖矿涉及大量计算能力，权益证明根据持有的比特币份额分配挖矿能力。这将确保只有授权人员才能挖矿并攻击链。唯一使用此技术的加密货币是山寨币。该算法的一个主要问题是，用户可能滥用其高份额的权力。\n\
    \n### IOT 安全\n\n物联网（IOT）是智能设备之间的互连，它们相互通信。当我们谈论智能设备时，这意味着它们能够以某种方式监控、控制、优化和自动化流程。这些设备可以是任何东西，例如网络设备、家用电器、可穿戴设备、传感器、工业仪器/机器、车载传感器或任何嵌入式设备。\n\
    \n**IOT 中的挑战** 随着周围智能设备数量的增加，IoT 是连接所有设备的新兴技术。由于 IoT 是目前最受关注的技术，旨在连接设备。由于设备的这种异质性，当前\
    \ IoT 系统面临着各种挑战。一方面，IoT 是各种企业和行业追捧的技术，但它也导致了各种挑战。IoT 中的挑战 \\[5\\] 基本分为两类- 技术挑战和安全挑战\
    \ \\[6\\]。技术挑战主要关注对等节点或节点的计算能力、它们的互连、带宽消耗以及各种性能参数调整。这些问题可能与硬件相关，也可能与软件相关。而安全问题可以从安全数据存储、数据传输、密钥分布、`etc.`\
    \ 范围不等。一些主要挑战在图 (**2**) 中列出。\n\n![](img/9789815051452-C1-F2.jpg)**Fig. (2))**\
    \  \n\nIoT 的主要挑战。\n\n1.  **安全性：** 问任何专家这个时代最大的挑战是什么，他们都会立即说是 IoT 设备的安全性。随着设备数量的增加，IoT\
    \ 增加了攻击表面。攻击者不攻击主设备，而是利用存在安全漏洞的设备。例如，在 2017 年，一家赌场是通过鱼缸中的恒温器被攻击的。大多数常见且具有破坏性的攻击是通过家用监控设备进行的，例如基于\
    \ IoT 的婴儿或老年人监控设备。有各种报告的案例，攻击者通过玩具、健康监控设备、可穿戴设备、`etc.` 进行攻击。\n\n2.  **监管政策：**\
    \ 必须制定标准政策，以便以非常有效的方式妥善管理、保护和传输数据。缺乏此类强有力的政策是 IoT 安全问题的主要原因之一。由于使用了如此多的设备，攻击表面扩大，使得这种情况变得更加复杂，而且这些设备可以是任何东西，例如玩具、医疗仪器、汽车、调制解调器\
    \ `etc.` 所有当前制定的政策在各种 IoT 场景中都不起作用。应制定政策来促进和标准化 IoT。IoT 中的质量控制可能非常复杂，由于从其他国家进口了各种传感器和设备，此类政策应在全球范围内被接受。\n\
    \n3.  **完整性：** 完整性是指在端到端设备之间安全地传递消息。数据在传输过程中可能会损坏。应确保消息安全传递。IoT 节点是计算能力非常低的设备，因此无法保证端点安全。唯一能做的就是在传输过程中保护消息。为此，可以使用端到端加密算法。有大量此类算法可用，但唯一的问题是这些算法应该是轻量级的。\n\
    \n4.  **可用性：** 有大量的 IoT 数据需要在需要时随时可用。IoT 的一个重要特性是时序数据，它旨在按时可用以实现所需的结果和分析。\n\n\
    5.  **带宽：** IoT 设备基于分布式模型工作，而传统内容分发系统基于中央服务器模型。随着越来越多的设备定期加入，这种情况会变得更糟。此外，每个设备的带宽要求各不相同，可能会出现一种情况：一个高带宽设备导致其他设备出现带宽短缺。这可以通过在各种移动设备之间智能切换带宽来管理。\n\
    \n"
