    \ clustering, k-mean (partitioning clustering), high-dimensional approaches, density-based\
    \ clustering, clustering based on co-occurrence, and other evolutionary methods.\
    \ By grouping those with the nearest mean, the commonly used k-mean clustering\
    \ technique divides observation into different clusters ‘k’. It is noteworthy\
    \ that due to the ongoing growth of data mining techniques, an alternative approach\
    \ and development exists.\n\n### Classification\n\nClassification is the most\
    \ basic technique of data mining aimed at classifying data objects into predefined\
    \ classes. To accurately optimize the classifier to perform the given classification\
    \ task effectively, it requires a few rules that are defined through data exploration.\
    \ The formal definition of the classification underlying the algorithm \\[[32](#9789815051452-C3.html#r32)\\\
    ]. There are several different methods for classification, and each has its own\
    \ merits \\[[33](#9789815051452-C3.html#r33)\\]. Decision Trees \\[[34](#9789815051452-C3.html#r34)\\\
    ], Support Vector Machines (SVM) \\[[35](#9789815051452-C3.html#r35)\\] Naive\
    \ Bayes Codes \\[[36](#9789815051452-C3.html#r36)\\], Neural Networks and k-Nearest\
    \ Neighbours \\[[37](#9789815051452-C3.html#r37)\\] are some of the best-known\
    \ and commonly used classification techniques.\n\n### Association Mining Rules\n\
    \nThe Association Rule Mining is introduced on a dataset for the supermarket \\\
    [[38](#9789815051452-C3.html#r38)\\], with the goal of investigating co-occurrences\
    \ between data items. It is a technique for detecting the simultaneous occurrence\
    \ that occurs more often than the average level of co-occurrence that exists in\
    \ the data collection. It distinguishes the relationship that exits among the\
    \ data objects.\n\n### Regression\n\nDue to its ability to reduce dimensions,\
    \ extract information, provide estimates and forecast, regression is also considered\
    \ a significant data mining technique. The basic regression principle is to analyse\
    \ the relationship between two or more variables in order to assist in prediction\
    \ and decision making. The regression analysis is widely applied to a wide range\
    \ of topics, and several developments have also been made to date, so it is not\
    \ feasible to summarize all of this in this chapter. Some of the Data Mining 's\
    \ proven regression techniques include linear and nonlinear regression, lasso\
    \ regression, logistic regression, and tree regression.\n\n### Social Network\
    \ Analysis\n\nA comparatively recent Data Mining technique outlined here is the\
    \ Social Network Analysis (SNA), based on the graph theory principle. To build\
    \ a social network, it investigates the relation and content between objects in\
    \ a large stack of knowledge. The most widely used measuring technique for evaluating\
    \ social network behaviours is ‘degree’ \\[[39](#9789815051452-C3.html#r39)^(\\\
    -)[41](#9789815051452-C3.html#r41)\\].\n\n## Applications of Big Data\n\n### Healthcare\
    \ Sector\n\nThere is a significant improvement in healthcare with Big Data. It\
    \ increased the amount of information collected over the last few years. Technology\
    \ development has also made it easier to gather and analyse data from various\
    \ sources such as insurance companies, hospitals, labs, and the offices of physicians.\
    \ Doctors have historically used their discretion, and in recent years, this has\
    \ been changed to a more evidentiary treatment. The modern method includes analysing\
    \ clinical records and making recommendations about treatment on the best evidence\
    \ available. When it comes to the use of Big Data, the healthcare sector has tended\
    \ to lag from other industries such as financial services and sales.\n\n![](Images/9789815051452-C3-F6.jpg)**Fig.\
    \ (6))**  \n\nData mining techniques. \n\nBig Data is used in healthcare to forecast\
    \ pandemics, cure illness, enhance quality of care and stop premature death and\
    \ the different application of Big Data in health sector is illustrated in Fig.\
    \ ([**7**](#9789815051452-C3.html#f7)). A lot of fitness devices recently have\
    \ hit the market like Fitbit, Samsung Gear Fit and Jawbone, helping us to monitor\
    \ our progress. Eventually we will be able to share the data with our doctor,\
    \ who will be able to use it when we see him with an ailment as part of their\
    \ clinical diagnosis. When more and more data is collected, physicians will be\
    \ able to offer treatment choices for certain patients with specific disorders,\
    \ genetic factors and lifestyle. The Big Data is kept in siloes inside the computer\
    \ systems, hospitals, and clinics of numerous physicians \\[[42](#9789815051452-C3.html#r42),\
    \ [43](#9789815051452-C3.html#r43)\\]. To make efficient use of them all in the\
    \ future, it is needed to release the information with everyone.\n\n![](Images/9789815051452-C3-F7.jpg)**Fig.\
    \ (7))**  \n\nImplementation of Big Data in health sector. \n"
  trans: "\n\n# 大数据挑战与数据挖掘技术\n\n大数据的挑战包括数据表示、冗余减少与数据压缩、数据生命周期管理、分析过程的进步、数据保密性、能源管理与可持续性、可扩展性与伸缩性以及协作\
    \ \\[29\\]。它将问题转化为数据复杂性、计算复杂性和系统复杂性。导致大数据的三个因素：大数据复杂性（*i.e.*，数据形式、大小、架构、*etc.*）。模式、关系、不足性、不稳定性和分布导致计算复杂性增加以及新的计算概念。系统复杂性的不断增加，使得难以满足先进节能计算和大数据处理的需求。\n\
    \n## 大数据的数据挖掘技术\n\n数据挖掘方法与数据仓库协作已有多年，随着大数据的出现，现在获得了更大的普及。数据分析以及结构化和非结构化数据的增长，推动了数据挖掘技术的改进，因为企业现在处理的数据集更广泛，内容更加多样。数据挖掘方法通过人工智能和机器学习进一步实现自动化\
    \ \\[30\\]。图 (**6**) 说明了大数据的数据挖掘技术。\n\n### 聚类\n\n聚类的主要目的是通过数据发现聚合数据对象，使分组后的对象彼此相同或紧密关联，但与其他类别区分开来\
    \ \\[31\\]。聚类的基本原理是计算数据对象之间的距离。已开发出许多技术，以满足处理更复杂数据类型或结构的要求。关键的聚类方法包括层次聚类、k-均值（分区聚类）、高维方法、基于密度的聚类、基于共现的聚类以及其他进化方法。通过将具有最近均值的对象分组，常用的\
    \ k-均值聚类技术将观测值划分为不同的聚类‘k’。值得注意的是，由于数据挖掘技术的持续增长，存在替代方法和发展。\n\n### 分类\n\n分类是数据挖掘最基本的技术，旨在将数据对象分类到预定义的类别中。为了准确优化分类器以有效执行给定的分类任务，需要一些通过数据探索定义的规则。算法背后的分类的正式定义\
    \ \\[32\\]。分类有几种不同的方法，每种都有其自身的优点 \\[33\\]。决策树 \\[34\\]、支持向量机（SVM）\\[35\\]、朴素贝叶斯代码\
    \ \\[36\\]、神经网络和 k-最近邻 \\[37\\] 是一些最著名且常用的分类技术。\n\n### 关联规则挖掘\n\n关联规则挖掘是在超市数据集上引入的\
    \ \\[38\\]，目的是调查数据项之间的共现。它是一种检测同时发生频率高于数据集中平均共现水平的技术。它区分了数据对象之间存在的关系。\n\n### 回归\n\
    \n由于其降维、提取信息、提供估计和预测的能力，回归也被视为一种重要的数据挖掘技术。回归的基本原理是分析两个或多个变量之间的关系，以协助预测和决策。回归分析广泛应用于各种主题，迄今为止也进行了多项发展，因此在本章中无法总结所有内容。数据挖掘中经过验证的回归技术包括线性和非线性回归、Lasso\
    \ 回归、逻辑回归和树回归。\n\n### 社交网络分析\n\n这里概述的一种相对较新的数据挖掘技术是社交网络分析（SNA），基于图论原理。要构建社交网络，它调查大量知识堆栈中对象之间的关系和内容。评估社交网络行为最广泛使用的度量技术是“度”\
    \ \\[39^(\\-)41\\]。\n\n## 大数据的应用\n\n### 医疗保健领域\n\n大数据在医疗保健方面取得了显著改进。它增加了过去几年收集的信息量。技术发展也使得从保险公司、医院、实验室和医生办公室等各种来源收集和分析数据变得更加容易。医生历史上一直使用自己的酌情权，近年来，这已转变为更基于证据的治疗。现代方法包括分析临床记录，并根据现有最佳证据提出治疗建议。在大数据的使用方面，医疗保健领域往往落后于金融服务和销售等其他行业。\n\
    \n![](img/9789815051452-C3-F6.jpg)**Fig. (6))**  \n\n数据挖掘技术。 \n\n大数据在医疗保健中用于预测流行病、治愈疾病、提高护理质量并防止过早死亡，健康领域中大数据的不同应用在图\
    \ (**7**) 中有所说明。最近，许多健身设备已上市，如 Fitbit、Samsung Gear Fit 和 Jawbone，帮助我们监测进展。最终，我们将能够与医生共享数据，医生在我们因疾病就诊时，可以将其作为临床诊断的一部分使用。当收集越来越多的数据时，医生将能够为患有特定疾病、遗传因素和生活方式的某些患者提供治疗选择。大数据存储在众多医生的计算机系统、医院和诊所的孤岛中\
    \ \\[42, 43\\]。为了在未来高效利用所有这些数据，需要将信息向所有人开放。\n\n![](img/9789815051452-C3-F7.jpg)**Fig.\
    \ (7))**  \n\n大数据在医疗领域的实施。 \n\n"
