    \ T.. Automatic Drip Irrigation System using Raspberry PI and Wireless Sensor\
    \ Networks.IJIRSET2011 |\n\n# 基于 IoT 医疗的区块链解决方案的最新趋势\n\n**Himanshu Sharma^(1)****，**\
    \ **Hardik Chaurasia^(1)****，** **Arpit Jain^(2, \\*)****，** **Nazir Ahmed^(1)**\
    \  \n\n¹ 石油与能源大学电气与电子工程系，印度德哈拉敦  \n\n² QpiAI India Pvt. Ltd. AI 从业者，印度班加罗尔  \n\
    \n## 摘要\n\n本综述围绕将医疗保健的所有可能优势纳入并融合的理念展开，这些优势可由区块链技术（BCT）进行管理和处理。回顾医疗保健领域涉及的所有陈旧系统，整个过程非常缓慢，并且经常导致任何过程出现显著延迟，无论是患者报告、从智能手表跟踪数据、取消医生预约、药物处方等。BCT\
    \ 与物联网（IoT）相结合，能够产生一个完全革命性且强大的系统，其范围从极其微小的细节扩展到全新的视野。据预测，到 2022 年，全球将有超过 180 亿台设备；因此，管理与医疗保健相关的数据，为其制定\
    \ BCT，可以在医疗保健领域的进步中产生一些指数级的结果。这些医疗保健数据非常容易受到各种网络攻击，所有收集的宝贵信息可能面临巨大风险；因此，通过部署 BCT，安全性可以大大提高。BCT\
    \ 无非是不可更改的时间戳记录系列，就像数组的工作方式一样；即使其中一个块被初始化为任何信息值，该信息也将永远保留在那里。本综述试图将所有这些不同领域归纳在一个单一的伞形下，涵盖可以由\
    \ BCT 根据 IoT 进行管理的领域范围，以促进医疗保健领域的发展。\n\n**关键词：** 区块链技术，物联网，哈希码，医疗保健，协议。  \n\n\
    * * *\n\n^(\\*) **通讯作者 Arpit Jain：** QpiAI India Pvt. Ltd. AI 从业者，印度班加罗尔；电子邮件：ajain@ddn.upes.ac.in\
    \  \n\n## 引言\n\n加密货币账本系统（即区块链技术（BCT））的最新进展在 IoT 和医疗保健领域取得了巨大飞跃。由于一切都受网络控制，因此利用\
    \ BCT 和 IoT 来管理医疗保健领域，将是使整个医疗保健系统更加强大和高效的绝佳机会。物联网（IoT）无非是设备通过互联网互连的领域，以便每个设备都可以通过网络进行控制。它涵盖了广泛的应用，例如健康管理、智能家居、交通、农业和天气监测等，仅举几例，因为其增长速度非常惊人。IoT\
    \ 设备非常轻量 \\[1》，因此能耗极低。仅凭这少量能量，大部分能量都完全用于设备执行的主要功能。因此，留给安全和隐私等应用的能量非常少。这就为 BCT\
    \ 开辟了道路，因为 BCT 克服了上述问题，它是安全、分布式、不可更改、透明的 *等*。管理 BCT 的协议以块交易的形式使信息安全，这些块交易与相应的应用程序相关联。一旦这条块链完全填满，它就会通过称为挖矿的过程附加到其他链上，该过程由称为矿工的特定节点执行。虽然\
    \ BCT 的部署并不像看起来那么容易，因为与之相关的各种问题。为医疗保健等应用部署 BCT 和 IoT 非常有前景，并且设备齐全。一个针对远程患者监护（RPM）的系统提案\
    \ \\[1》主要侧重于提供医院以外的医疗保健服务。整个概念是关于患者佩戴的 IoT 可穿戴设备，该设备通过受 BCT 保护的云将所有生命体征信息传输到相应的医疗保健中心。虽然与\
    \ IoT 相关的各种问题，例如网络开销延迟、数据管理不善等，但 BCT 非常有效地克服了所有这些问题。BCT 包含各种优点，包括隐私、可信度、智能合约、DDoS\
    \ 通知和缓解，但其他问题可能仍然存在，例如带宽限制、网络问题等。在对迄今讨论的每个方面进行批判性分析之前，让我们深入了解其基本原理。\n\n### 医疗保健\n\
    \n"
