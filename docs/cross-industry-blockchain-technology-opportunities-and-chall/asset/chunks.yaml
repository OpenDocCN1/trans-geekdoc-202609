  trans: "\n\n该系统所需的营养素分为 12 部分和两种不同的溶液。溶液‘A’由 19% 的钙、15% 的硝酸盐或 45% 的钾和 13% 的硝酸盐组成。它还将含有`EDTA`作为螯合剂。溶液‘B’以硫酸镁、磷酸二氢钾和硫酸钾为主要营养素，并以硼砂作为硼源，以及硫酸锌、硫酸镁、硫酸铜和钼酸盐作为微量元素。总体而言，所需的营养素包括氮、钾、磷、钙、镁、硫酸盐、铁、锰、铜、锌、钼、硼和氯。这些营养素可通过上述溶液轻松获得。用作生长介质的材料将根据要求使用椰糠、岩棉或泥炭藓。至于水，则使用蒸馏水、RO\
    \ 水或降低 ppm 的自来水稀释液。水需要每周左右（有时每 4 天）更换一次，每次 19 升。\n\n## BLOCKCHAIN SOLUTIONS FOR\
    \ IoT\n\n区块链是一种点对点网络，其中每个节点都拥有所有数据的相同副本。当发起一笔交易时，发起节点使用其私钥对其进行签名，并将其发送到网络的其余部分以进行确认。所有其他矿工节点都参与其中。尝试通过无效化过程找到一个`nonce`\
    \ \\[2\\]。在区块链技术中，所有已完成的交易都记录在区块列表中，这被称为公共账本。随着新区块定期添加到其中，该区块链将继续演变。为了用户保护，实现了公钥加密和分布式共识算法。\n\
    \n在区块链网络中，联盟链用于提供数据保护。每个侧链监督其自身的 IoT 数据。每个 IoT 设备都会获得一个唯一的`id`来监控区块链网络中的数据。从计算机获得的数据与其`id`相关联，在对其计算哈希后，数据会发送到整个网络。这作为可信数据的基础。基本存储成本将与\
    \ IoT 网络信息共享的规模同步增长。因此，信息集位于远程位置，并维护一个集中式服务器仅存储这些位置的引用。\n\n### Features\n\n区块链技术提供了最高级别的透明度，各行各业都在测试它，以查看它是否可用于数据传输、记录保存和其他后端流程\
    \ \\[2\\]。它逐渐允许人们跟踪文档并以不可更改的记录形式数字化认证资产所有权。以下是使区块链成为技术革命的基本要素，如图 (**2**) 所示。\n\
    \n![](img/9789815051452-C4-F2.jpg)**Fig. (2))**  \n\n基本区块链结构。  \n\n*   **Transparency:**\
    \ 一般来说，对于以太坊和比特币等公共区块链系统，用户拥有与区块链网络的平等访问权和通信权。此外，每笔交易都经过验证并记录在分布式账本中，所有用户可以同时访问该账本。因此，区块链上的数据对每个节点都是透明的，以便验证区块链中的已提交交易。\n\
    \n*   **Decentralization:** 在现有的支付管理系统中，例如银行，中央机构执行交易验证，导致性能瓶颈、昂贵的设计和单点故障。另一方面，区块链允许两个节点之间验证交易，而无需任何干预、管辖权或中央机构。因此，整体服务成本、性能瓶颈和单点故障的风险都得以降低。\n\
    \n*   **Immutability:** 由于区块链基于一系列链接的区块，每个区块包含前一个区块头的哈希值，因此对数据的任何篡改都会使所有后续区块失效。任何突变都会被快速检测到，因为对任何交易的微小更改都会导致生成新的\
    \ Merkle 树数据结构。\n\n*   **Pseudonymity:** 无论区块链交易的透明度如何，系统可以通过为用户提供匿名地址来保持一定程度的匿名性。但是，由于这些地址可能被追踪，区块链系统只能在一定程度上保持机密性。因此，区块链只能提供假名性，而不能提供完全的机密性。\n\
    \n*   **Non-Repudiation:** 区块链交易过程中的每个节点都会获得一个私钥。其他节点随后可以使用该节点的相关公钥来访问和验证此信息。因此，使用加密技术数字签名的交易不能由交易的源节点否认。\n\
    \n*   **Traceability:** 分布式账本中的每笔交易都有一个与其关联的时间戳，该时间戳在交易时记录。因此，在分析带有关联时间戳的区块链数据后，用户可以轻松验证和追踪交易的来源以及更改情况。\n\
    \n### Blockchain Types\n\n参与者可以将区块链用作写入者或读取者。读取者在交易过程中扮演被动角色，而是专注于分析记录内容或验证区块链。另一方面，写入者在交易过程中扮演主动角色，并可以使用共识技术来扩展链。基于授予用户与账本交互的权限，区块链分为三种类型。以下小节将介绍这些类别。\n\
    \n### Public Blockchain\n\n无许可区块链被称为公共区块链。这些区块链使参与共识过程变得更加容易，并赋予任何实体（作为读取者或写入者）对主链的完全访问权限。在挖矿中通常使用激励措施来诱导矿工挖掘区块。因此，公共账本中的交易成本高于私有账本。\n\
    \n### Private Blockchain\n\n分布式账本是私有区块链的另一个名称。此类别中的矿工节点数量有限，且其身份已知。因此，只有有限数量的矿工节点被允许参与交易。此外，用户访问与其相关数据的权限可能受到限制。与公共区块链相比，私有区块链中用户数据的保密性更高。\n\
    \n### Consortium Blockchain\n\n联盟区块链的基本目标是扩大合作效应，以解决某个行业面临的挑战。因此，建立了一个涵盖盟友和商业竞争对手的有利框架。这种区块链是半去中心化的，意味着它由一小群人监督。\n\
    \n区块链完全由单一群体控制，但不存在垄断。这种控制允许每个节点在每个节点达成一致后建立自己的指令、编辑或删除错误交易、更改账户余额等等。另一方面，联盟区块链的集中式特性使其易受敌对实体的攻击。金融、银行、医疗保健、保险和物流是联盟区块链可应用的一些行业。\n\
    \n### Greenhouse\n\n温室是一个用于种植植物的受控环境。它由用于墙壁的透明介质和用于屋顶的半透明介质组成，以控制阳光。需要受控气候条件的植物在温室中种植。\n\
    \n"
