- raw: "The nutrients required in this system are divided into 12 parts and two different\
    \ solutions. Solution ‘A’ consists of 19% calcium, 15% nitrate or 45% potassium,\
    \ and 13% nitrate. It will also have EDTA acting as a chelating agent. Solution\
    \ ‘B’ has magnesium sulphate, mono potassium phosphate, and potassium sulphate\
    \ as the main nutrients and solubor from boron, zinc sulphate, magnesium sulphate,\
    \ copper sulphate and molybdenum as micronutrients. Overall, the nutrients required\
    \ are nitrogen, potassium, phosphorous, calcium, magnesium, sulphate, iron, manganese,\
    \ copper, zinc, molybdenum, boron and chlorine. These nutrients are readily available\
    \ as the above-mentioned solutions. The material used as the growing medium will\
    \ be coco coir, rock wool or peat moss based on the requirements. As for the water,\
    \ distilled water, RO water or diluted tap water with reduced ppm is used. The\
    \ water has to be changed every week or so (sometimes 4 days) in quantities of\
    \ 19 litres.\n\n## BLOCKCHAIN SOLUTIONS FOR IoT\n\nThe blockchain is a peer-to-peer\
    \ network in which every node has the same copy of all data. When a transaction\
    \ is launched, the initiator node signs it with its private key and sends it to\
    \ the rest of the network for confirmation. All other miner nodes are involved.\
    \ Try to find a nonce by going through the invalidation process \\[[2](#9789815051452-C4.html#r2)\\\
    ]. All completed transactions are registered in a list of blocks in blockchain\
    \ technology, which is referred to as a public ledger. This blockchain continues\
    \ to evolve as new blocks are added to it on a regular basis. For user protection,\
    \ public key cryptography and distributed consensus algorithms were implemented.\n\
    \nIn a blockchain network, the consortium blockchain is used to provide data protection.\
    \ Each side chain oversees its own IoT data. Each IoT device is given a unique\
    \ id to monitor data in the blockchain network. Data obtained from a computer\
    \ relates to its id, and the data is sent to the entire network after a hash is\
    \ calculated on it. This serves as the foundation for data that can be trusted.\
    \ The fundamental storage cost would grow in parallel with the scale of the IoT\
    \ network information sharing. As a result, information sets are in remote locations,\
    \ and a centralized server is maintained to store only the references to these\
    \ locations.\n\n### Features\n\nThe blockchain technology offers the highest level\
    \ of transparency, and various industries are putting it to the test to see if\
    \ it can be used for data transfer, record keeping, and other backend procedures\
    \ \\[[2](#9789815051452-C4.html#r2)\\]. It gradually allows people to follow documents\
    \ and certify ownership of assets digitally as an unalterable record. The following\
    \ are the fundamental elements that make blockchain a technological revolution,\
    \ as shown in Fig. [(**2**)](#9789815051452-C4.html#f2).\n\n![](Images/9789815051452-C4-F2.jpg)**Fig.\
    \ (2))**  \n\nBasic blockchain structure.  \n\n*   **Transparency:** In general,\
    \ for public blockchain systems like Ethereum and Bitcoin, users have equal access\
    \ and communication with the blockchain network. Furthermore, each transaction\
    \ is verified and recorded in the distributed ledger, which is accessible to all\
    \ users at the same time. Thus, data on the blockchain is transparent to each\
    \ node so as to validate the committed transaction in the blockchain.\n\n*   **Decentralization:**\
    \ In existing payment management systems, such as a bank, a central agency performs\
    \ transaction validation, resulting in a performance bottleneck, costly design,\
    \ and a single point of failure. On the other side, blockchain allows for the\
    \ validation of transactions between two nodes without the need for any intervention,\
    \ jurisdiction, or central authority. As a result, the overall service cost, performance\
    \ bottleneck, and danger of single-point failure are reduced.\n\n*   **Immutability:**\
    \ Since the blockchain is based on a series of linked blocks, each containing\
    \ a hash of the previous block's header, any tampering with the data invalidates\
    \ all subsequent blocks. Any mutation is quickly detected since even minor changes\
    \ to any transaction result in the generation of a new Merkle tree data structure.\n\
    \n*   **Pseudonymity:** Regardless of the transparency of blockchain transactions,\
    \ the system can maintain a measure of anonymity by providing users with anonymous\
    \ addresses. However, because these addresses may be traced, blockchain systems\
    \ can only retain confidentiality to a certain extent. As a result, blockchain\
    \ can only provide pseudonymity, not complete confidentiality.\n\n*   **Non-Repudiation:**\
    \ Each node in the blockchain transaction process is given a private key. Other\
    \ nodes can then access and validate this information using the associated public\
    \ key of that node. As a result, transactions signed digitally with cryptography\
    \ cannot be refused by the transaction's source node.\n\n*   **Traceability:**\
    \ Every transaction in the distributed ledger has a timestamp linked to it that\
    \ is recorded at the time of the transaction. As a result, after analysing blockchain\
    \ data with linked timestamps, users may easily verify and trace the origins of\
    \ transactions as well as alterations.\n\n### Blockchain Types\n\nParticipants\
    \ can use blockchain as either a writer or a reader. A reader takes a passive\
    \ role in the transaction process, focusing instead on analysing the contents\
    \ of records or validating the blockchain. Writers, on the other hand, take an\
    \ active role in the transaction process and can use consensus techniques to expand\
    \ the chain. On the basis of the permissions granted to users for interaction\
    \ with the ledger, blockchain is divided into three types. The subsections below\
    \ go through each of these categories.\n\n### Public Blockchain\n\nPermissionless\
    \ blockchain is known as public blockchain. These make it easier to participate\
    \ in consensus processes and give any entity, as a reader or writer, full access\
    \ to the main chain. Incentives are commonly used in mining to induce miners to\
    \ mine blocks. As a result, transaction costs in public ledgers are higher than\
    \ in private ledgers.\n\n### Private Blockchain\n\nDistributed ledger is another\
    \ name for private blockchain. The number of miner nodes in this category is limited,\
    \ and their identities are known. As a result, only a limited number of miner\
    \ nodes are allowed to participate in the transaction. Furthermore, a user's permission\
    \ to access data linked to him or her may be limited. In comparison to public\
    \ blockchain, the secrecy of user data is higher in private blockchain.\n\n###\
    \ Consortium Blockchain\n\nThe basic goal of a consortium blockchain is to scale\
    \ the effect of cooperation in order to address the challenges encountered by\
    \ a certain industry. As a result, an advantageous framework is established that\
    \ encompasses both allies and commercial competitors. This blockchain is semi-decentralized,\
    \ which means it is supervised by a small group of people.\n\nThe blockchain is\
    \ entirely controlled by a single group, but it is free of monopolies. This control\
    \ allows each node to establish its own instructions, edit or erase erroneous\
    \ transactions, change account balances, and so on once each node agrees. The\
    \ centralized nature of consortium blockchain, on the other hand, renders it defenseless\
    \ against hostile entities. Finance, banking, healthcare, insurance, and logistics\
    \ are some of the industries where consortium blockchain can be used.\n\n### Greenhouse\n\
    \nA greenhouse is a controlled environment to grow plants. It is made up of transparent\
    \ medium for walls and semi-transparent for the roof for controlled sunlight.\
    \ Plants, requiring regulated climatic conditions are grown in a greenhouse."
