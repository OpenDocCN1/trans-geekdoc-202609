  trans: "\n\n技术的发明引发了一场重要的革命性改革时期。当前时代正在不断向技术和环境两个方向转变。因此，信息系统（`IT`）环境应采用研究和应用策略，以应对未来的变化，无论变革的环境和速度如何。最新的\
    \ IT 发展可以概括为大流，例如区块链、机器学习和大数据。区块链是一种数据交换处理系统，它分发并保存由网络活跃参与者处理的所有数据。区块链、加密货币和大数据是数字世界中颠覆性的三大领域，充满强烈热情，并挑战着全球范围内的商业策略和活动。自引入以来，大数据的出现通过将数据转化为优质来源，创造了各种挑战和机遇。\n\
    \n此外，区块链技术本身正在被研究作为使业务流程更具盈利能力和效率的可能基础。从技术上讲，区块链是一个公共分布式账本，包含程序中执行的所有交易。它可在 P2P\
    \ 网络上使用，其中区块链账本的副本存储在每个完整节点上。没有中央机构负责管理区块链数据库。这种仅在系统实际且平等的用户之间获取数据库的概念，为创建所谓的“去中心化忠诚度”\
    \ \\[1\\] 奠定了策略。区块链具有去中心化、不可篡改性和完全可编程性的特点，可以肯定地解决大数据存储的安全问题，特别是对于拥有大量机密信息的个人信息的安全，必须由政府和大型公司控制和支持\
    \ \\[2^(\\-)4\\]。区块链由许多数据块按孵化期顺序连接在一起组成，块大小可以由每个节点的共识协议创建，并通过加密技术确保保护。如果节点试图篡改某个区块，很难想象该区块能通过共识过程传播到整个网络\
    \ \\[5\\]。每个区块的操作历史可以通过 Markel 树和时间戳进行追溯 \\[6\\]。\n\n## 区块链的类别\n\n区块链按进入方式分为三种类型，即公共区块链、私有区块链和区块链联盟\
    \ \\[7, 9\\]。公共区块链是第一种，也许也是最广泛使用的区块链。比特币是一种社区区块链代理。其特点是去中心化，不受任何组织的管理或监管。任何人都可以访问公共区块链\
    \ \\[8\\]。\n\n私有区块链是一个不对外社区开放的框架，仅由组织使用 \\[10\\]。区块链联盟介于私有区块链和公共区块链之间，通常用于多个用户同时工作的领域，例如企业、州和银行\
    \ \\[11\\]。图 (**1**) 包含了区块链的不同类别。表 **1** 从访问权限、交易速度、性能、保护、不可篡改性、共识机制、网络和资产等方面描述了公共、私有和联邦区块链。\n\
    \n### 区块链的代际\n\n虽然区块链已经出现了三代，但这并不意味着任何后续代际比前一代更受欢迎。有趣的是，在高度重叠的空间中，三代区块链都在继续发展，并在行业中建立自己的地位，并试图脱颖而出成为赢家。不同的因素可以决定哪一代拥有最佳机会。三代区块链在图\
    \ (**2**) 中进行了讨论。\n\n![](img/9789815051452-C3-F1.jpg)**Fig. (1))**  \n\n不同类别的区块链\
    \ \\[9\\]。 ![](img/9789815051452-C3-F2.jpg)**Fig. (2))**  \n\n区块链的代际\n\n#### 区块链\
    \ 1.0\n\n在此过程中，每笔交易都以分布式账本形式存储，因此对分布式网络中的任何成员都公开。比特币是第一种数字去中心化货币，也是一种区块链 1.0 技术。比特币的基本技术是挖矿、密码学和群体账本。矿工是本世纪中通过解决数学问题查询区块的个人，并因区块验证获得\
    \ 12.5 比特币作为奖励。自身身份安全、资金控制、快速自动交易是区块链 1.0 的特点。\n\n#### 区块链 2.0\n\n第二代区块链技术（区块链\
    \ 2.0）是数字经济。虽然数字经济的概念 20 年前就已实施，但重点在于从数字经济中获益以实现其完全实施。智能合约是两个实体之间用于构建数字合同的一系列指南。以太坊是运行在\
    \ \\[12\\] 上的一种智能合约网络。\n\n#### 区块链 3.0\n\n对于两代区块链的兴趣，它们主要为制造业、商业和金融领域做出贡献。包括医疗保健、医疗记录\
    \ \\[12\\] 资源管理、供应链、身份验证、智慧城市、电力行业和系统管理在内的系统现在都是区块链 3.0 组织。\n\n### 区块链技术的重要性及去中心化及其影响\n\
    \n#### 安全性\n\n数字世界充满了黑客，他们寻找漏洞以泄露详细信息或窃取数据。区块链技术中包含的文件具有强大的保护功能，使得任何人都无法入侵。\n\n\
    #### 透明度\n\n由于一切都在网络上显示，产生任何差异的可能性非常小。\n\n#### 低成本\n\n市场上大多数传统金融结构成本高昂，但区块链更便宜。\n\
    \n#### 交易时间\n\n一个人可以在几分钟内发送和接收活动及有价值的文件，这最大限度地减少了等待数小时的压力。\n\n#### 财务效率\n\n去中心化区块链允许个人在没有第三方干预的情况下进行交易，而传统银行进行交易则耗费大量时间。\n\
    \n#### 保护企业免受欺诈\n\n区块链是开源账本，因此很容易确定欺诈是如何发生的，因为所有交易都记录在其中。\n\n### 区块链技术的应用\n\n\
    在过去几年中，区块链被应用于不同领域并取得了更好的效果。区块链技术应用的一些领域如下-。\n\n#### 医疗保健\n\n"
