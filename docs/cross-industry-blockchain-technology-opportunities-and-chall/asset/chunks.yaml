    \ |\n\n| \\[58\\] || Abou-Nassar Eman, Iliyasu Abdullah, Elkafrawy Passent, Song\
    \ Oh-Young, Bashir Ali, El-Latif Abd. DITrust Chain: towards blockchain-based\
    \ trust models for sustainable healthcare IoT systems.IEEE access.202010.1109/ACCESS.2020.2999468\
    \ |\n\n# Blockchain Technology-based System in Vehicular Ad-hoc Network\n\n**Manoj\
    \ Sindhwani^([1](#9789815051452-C6.html#aff1))****,** **Charanjeet Singh^([1](#9789815051452-C6.html#aff1),\
    \ [\\*](#9789815051452-C6.html#cor1))****,** **Rajeshwar Singh^([2](#9789815051452-C6.html#aff2))**\
    \  \n\n¹ Lovely Professional University, Phagwara, Punjab,, India  \n\n² Doaba\
    \ Group of Colleges, Nawanshar, India  \n\n## Abstract\n\nAmong the various technologies\
    \ that are constructing the pillars deep in the field of engineering, ad-hoc networks\
    \ are one of the major fields of research. On the grounds of history, Mobile ad-hoc\
    \ Networks (MANETs) played a prominent role in battlefield communication and other\
    \ important applications, but another emerging network named as Vehicular ad-hoc\
    \ Networks (VANETs) offered wireless communication led to its popular usage that\
    \ resulted in the major deployment of ad- hoc networks. However, in VANET, secure\
    \ message transmission is still a challenge, so we propose a local blockchain\
    \ to disseminate the message in vehicular networks to improve the security issues.\
    \ The public blockchain technique in VANET ensures trust-based secure message\
    \ transmission in the Vehicular ad-hoc Network.\n\n**Keywords:** Blockchain, Message\
    \ dissemination, Secure Network, Vehicular Networks.  \n\n* * *\n\n^(\\*) **Corresponding\
    \ author Charanjeet Singh:** Lovely Professional University, Phagwara, Punjab,,\
    \ India; Tel: +919463569976;  \n\nE-mail: [charanjeet.21882@lpu.co.in](mailto:charanjeet.21882@lpu.co.in)\
    \  \n\n## Introduction\n\nAd-hoc is derived from a Latin word that signifies ‘formed\
    \ for’. A network \\[[1](#9789815051452-C6.html#r1)\\] consisting of various independent\
    \ individual devices sharing and exchanging information for communicating with\
    \ each other resulting in the formation of a multi-hop radio network is termed\
    \ as ad-hoc network. During communication, if one party, who is interested in\
    \ communicating with the other party that is far away, needs an intermediary to\
    \ exchange the information, for this purpose, ad-hoc network came into existence.\
    \ It implies that if the desired target node is distantly located and is unapproachable\
    \ then the message is transmitted *via* other nodes. Generally, the ad-hoc networks\
    \ follow a multi-hop fashion of communication where each host can also be a router.\
    \ Besides the consequences such as dynamic\n\ntopology and above-listed issues,\
    \ wireless ad-hoc networks have given tremendous applications to the world in\
    \ the name of MANET and VANET \\[[2](#9789815051452-C6.html#r2), [3](#9789815051452-C6.html#r3)\\\
    ]. These networks are advantageous as they can use the unlicensed frequency spectrum\
    \ and have a good network; due to which sending and distributing information also\
    \ become very easy. The clustering algorithms discussed will eliminate the number\
    \ of issues from the network. A highway is divided into two lanes where vehicular\
    \ nodes (cars/ other vehicles) move with different velocities. Fig. [(**1**)](#9789815051452-C6.html#f1)\
    \ represents the ad-hoc network structure.\n\n![](Images/9789815051452-C6-F1.jpg)**Fig.\
    \ (1))**  \n\nAd-hoc Network Structure. \n\nThe vehicles start forming a cluster\
    \ using clustering techniques and the nodes in the cluster are called Cluster\
    \ Members (CM), among which one node is chosen as the Cluster Head (CH) with the\
    \ help of clustering algorithms. The clustering algorithms can reduce various\
    \ efficiency-related issues in the network. There are a number of clustering techniques\
    \ proposed by various researchers to facilitate the formation of clusters by applying\
    \ different clustering algorithms.\n\n## Architecture of VANETs\n\nAs VANET creates\
    \ a self-organizing wireless network using its mobile nodes, there also exists\
    \ a full fledge architecture including other units RSU, OBU, and AU. VANET is\
    \ a prime component of the Intelligent Transport Network that aims at improving\
    \ traffic efficiency so as to provide better safety on road. VANET possesses a\
    \ dynamic topology \\[[4](#9789815051452-C6.html#r4), [5](#9789815051452-C6.html#r5)\\\
    ], with frequent connections and disconnections of the vehicular nodes.\n\nVANETs\
    \ ensure:\n\n*   Traffic management\n\n*   Safety management, and\n\n*   Internet\
    \ services\n\n![](Images/9789815051452-C6-F2.jpg)**Fig. (2))**  \n\nVANET-general\
    \ architecture. \n\nFig. [(**2**)](#9789815051452-C6.html#f2) represents the general\
    \ architecture of VANET. The VANET architecture follows Wireless Access in Vehicular\
    \ Environment (WAVE) which is based on 802.11 standard protocol \\[[6](#9789815051452-C6.html#r6)\\\
    ] and is used in ITS. WAVE is a specifically designed standard protocol that supports\
    \ the vehicular environment and also promotes the V2V and V2I communications in\
    \ 5.9 GHz band licensed for ITS. It uses the multiplexing technique of OFDM orthogonally\
    \ so as to split the signals. WAVE consists of RSU and OBU, hence WAVE was adopted\
    \ later. The units used in the vehicular ad hoc network \\[[7](#9789815051452-C6.html#r7)\\\
    ] are represented in Table [**1**](#9789815051452-C6.html#t1).\n"
