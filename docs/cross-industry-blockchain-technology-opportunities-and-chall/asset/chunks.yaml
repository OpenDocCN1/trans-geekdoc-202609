    | **Traditional Methods** || Previous security methods work in centralized approach
    and can risk the entire system’s security. Very less scalability offered and no
    such protection against malicious attacks like DDoS. Malware can be introduced
    and whole network can get compromised || Decentralized approach removes the reliability
    over one place. Data is approved from the users cryptographically before adding
    to the chain so malware cannot be added. Blockchain has been proven useful against
