    # Blockchain for IoT Security and Privacy: Challenges, Application Areas and Implementation
    Issues


    **Chaitali Choudhary**^([1](#9789815051452-C1.html#aff1), [*](#9789815051452-C1.html#cor1))**,
    **Inder Singh**^([1](#9789815051452-C1.html#aff1), [*](#9789815051452-C1.html#cor1))**,
    **Mohammad Shafiq**^([2](#9789815051452-C1.html#aff2))


