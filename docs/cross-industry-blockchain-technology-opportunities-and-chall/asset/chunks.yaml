- raw: 'There are many applications of the digital ledger technology in wide variety
    of industries including financial sector. Two potential areas of DLT applications
    are: 1) Fintech companies are exploring to utilize blockchain infrastructure to
    develop digital applications for multipurpose use; and 2) industry leaders are
    investing on research, to develop proprietary permissioned blockchain and address
    the need of enterprise solutions specific to industry. There is a huge interest
    of financial sector in DLT and its proof of concept. “Hyperledger” - an open source
    consortium has more than 170 organization as its member; and “R3CEV”- blockchain
    R&D organization for financial sector, has more than 100 members including commercial
    banks, regulators and other trade associations \[[47](#9789815051452-C2.html#r47)\].
    Stock exchanges including NASDAQ, NYSE and LSE are exploring DLT to improve security
    in transactions \[[48](#9789815051452-C2.html#r48)\]. DLT has the ability to transform
    the every stocked are traded and issued the potential to replace existing stock
    exchanges systems.


    *   IBM and The Tokyo Stock Exchange are exploring blockchain for trade monitoring
    and recording in low-transaction markets.


    *   The US Security Exchange approved a plan to issue overstock company stocks
    using the Bitcoin blockchain in 2015 \[[49](#9789815051452-C2.html#r49)\].


    *   ”Deutsche Borse” - Germany''s stock exchange and central bank develops a blockchain
    framework for digital asset trading \[[50](#9789815051452-C2.html#r50)\].


    *   A blockchain-backed market is launched by Korea Exchange KRX for startups
    equity shares. This is named as Korea Startup Market (KSM) in association with
    a Korean startup “Blocko” \[[51](#9789815051452-C2.html#r51)\].


    *   A startup organization “Digital Asset Holdings” and The Australian Stock Exchange
    are testing DLT to optimize clearing and settlement processes.


    *   A blockchain-based system is developed for credit fraud in the post-trade
    processing mode. This has been developed by three technologies organizations -
    IBM and two blockchain startups - R3 and Axoni \[[52](#9789815051452-C2.html#r52)\].


    ## DLT AND FINANCIAL INCLUSION


    DLT has capabilities to improve resilience, reliability and efficiencies for the
    financial sector and its infrastructures. Despite strong expansion of financial
    inclusion, there are challenges to bring excluded communities into the financial
    system. The benefit of DLT systems are likely to be harnessed by financial institutions
    and fintech organizations. DLT has potential to enhance financial inclusion by
    addressing following financial issues:


    *   Half-baked security framework for transactions and collateral securities.


    *   Reasonable financial services.


    *   Lack of due diligence requirements including KYC verifiable identity systems.


    *   Poor credit and payment infrastructure.


    *   International remittances de-risking impact.


    Application of DLT for improved financial inclusion:


    *   Asset Registries


    *   Cross-border remittances


    *   Digital currencies


    *   Digital ID systems


    ## Cross border Remittance and Payment


    Cross border payments are generally conducted by a network of correspondent banks
    and involve long delays, high costs and uncertainty. These transactions involve
    multi point transaction fees and are restricted to the bank''s business hours.
    The fee involved fees charged for cross-border transfer (correspondent banks and
    other intermediately organizations involved in payment infrastructure), fees charged
    by receiving institutions and by sending institutions.


    Non-banking institutions have their proprietary frameworks in place, that involveprefunding
    at receiving institutions to settle periodic aggregated amounts and to enable
    faster disbursement. There is a huge improvement in cross border remittance due
    to the collaboration and tie-up between financial institutions, matured systems
    and high-level optimizations for the processes. However, there is not much innovation
    involved in it and the service fees continue to be a big portion *i.e.* 20% of
    the total cost \[[53](#9789815051452-C2.html#r53)\]. DLT can replace correspondent
    banking systems and can eliminate inefficiency in the existing system by offering
    cost reduction in interbank cross-border transactions. DLT can help to bring down
    remittance prices further by increasing inter-bank and cross-border transfers
    efficiency and by lowering settlement costs. DLT can open doors for new approach
    to the correspondent banking system, which can further address de-risking issues.
    Some of the examples are listed below:


    ### Ripple


    Ripple focuses on cross-currency fund settlement combined with cross border commercial
    payments. Ripple uses a unique approach that involved “path” identification for
    sender''s fund flow in a particular currency to receiver’s particular currency
    utilizing services (for that currency), offered by a series of participant institutions.
    This can expand access to foreign exchange services for micro remittances companies
    and discover better price for foreign exchange. XRP is Ripple''s own cryptocurrency,
    which is registered to trade on many cryptocurrency exchanges. Ripple has its
    own exchange that involves the exchange of top currencies like EUR, USD, CNY and
    JPY. The exchange is actively done other than cryptocurrencies like ether and
    Bitcoin. The Shanghai Huarui bank announced to use Ripple for its remittance product
    on the USA-China network \[[54](#9789815051452-C2.html#r54)\].


    ### Abra


    Abra combines physical bank tellers with cryptocurrency and offers instant money
    transfer without transaction fee in peer-to-peer mode. In Abra, no bank account
    is required for cross border payment; recipient''s phone number is the only requirement.
    In addition to Bitcon, Abra supports over 50 currencies globally.


    ### Bitpesa


    It offers cross-border payment for individual and businesses between China and
    some African countries like Kenya, Nigeria, Tanzania, Uganda \[[55](#9789815051452-C2.html#r55)\].


    ### Bitt


    It is Caribbean''s based bitcoin exchange organization, that focuses on creating
    a unified payment settlement network for CARICOM region.


    ## Smart Contracts


    In the context of DLT, ''Smart contracts'' are programs that automatically executed
    by network nodes and developed on the underlying distributed ledger. A smart contract
    can execute any instruction that a computer could execute. Smart contracts are
    triggered by transactions on the distributed ledger and the resultant is stored
    in the ledger. Smart contracts “allow for logic to be programmed on top of the
    blockchain transaction” \[[56](#9789815051452-C2.html#r56)\]. Digital ledgers
    that are not blockchain can execute smart contracts. Same data must be available
    to all network nodes, thus each node should verify smart contracts.


    Smart contract was first coined in 1997 by Nick Szabo where he takes vending machines
    to explain the idea of a smart contract \[[57](#9789815051452-C2.html#r57)\].
    The vending machine manages asset ownership and transfers the ownership of asset
    on coin insert. The vending machine ensures the ''contract'' term to be followed
    that defines conditions, the underlying assets, its inputs and subsequent actions.
    Security sales or purchase at a predefined price would be automatically executed
    by a computer program. Applications of smart contracts could be mergers and acquisitions,
    derivatives markets and in security transactions.


    DLT system enables a platform for smart contracts to control real-world assets
    like share, land title *etc.* without third party requirement such as a land title
    administrator or a broker. This can be possible because the distributed network
    nodes are capable of executing code and contract enforcement. Fig. [(**5**)](#9789815051452-C2.html#f5)
    explains the utilization of smart contracts in trade finance. A similar DLT-based
    methodology can be applied to other domains such as collateral registry or mortgage
    process.'
