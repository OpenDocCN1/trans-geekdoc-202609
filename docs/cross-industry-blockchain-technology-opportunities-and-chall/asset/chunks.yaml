- raw: 'We can conclude that Blockchain can be very empowering technology for IoT
    security. It is also very helpful in various other challenges of blockchain like
    integrity, confidentiality, authentication and key management solutions. One of
    the main features of blockchain which makes it an ideal solution for IoT security
    is its decentralized nature which makes attackers’ work difficult. IoT frameworks
    are more prone to attack due to their distributed nature that means due to large
    number of devices, compromising any one less cared device will be quite easy.
    We can also summarize it earlier by saying that the surface area for attack is
    more in IoT framework and it keeps on increasing with each added device, which
    is definitely going to be increased. On the contrary, blockchain uses this distributed
    nature to make things secure. As blockchain is a distributed ledger system, it
    maintains immutable ledger records. This is the way of securing data in blockchain.
    The distributed framework increases the trust factor of the system . IoT and blockchain
    complements each other, the factor which makes IoT prone to attack is its distributed
    nature and blockchain uses the same factor for making it more secure. Decentralization
    of IoT network using blockchain also helps in resolving the issues like single
    point of failure and issues like cost reduction in maintaining network infrastructure.
    Two big companies IBM & Samsung collaborated for ADEPT \[[20](#9789815051452-C1.html#r20),
    [21](#9789815051452-C1.html#r21)\] (Autonomous Decentralized Peer-to-Peer Telemetry)
    which is a blockchain empowered IoT system. Blockchain system to create a distributed
    IoT system generates smart contract and peer to peer messaging system. One of
    the usages of ADEPT can be in various smart home appliances. For example, a fully
    automated washing machine can communicate with other devices like it can postpone
    the washing if many devices are plugged on simultaneously, leading to electric
    load balancing. If the machine has any issue, then it can create a request for
    maintenance or repair as needed. Right now, it looks like very futuristic project
    but it can be achieved very nearly. The problem appears when such a smart device
    which handles its own work is compromised by a hacker. One such solution is authenticity
    of one device is verified by all other devices at home. Let’s take an example:
    all the devices are based on networking, so suppose our first smart device or
    we can say the first block in our blockchain is modem. Whenever a new device is
    added then its key is a combination of both the modem key and a new device key.
    A chain is maintained in which there will be as many numbers of blocks as there
    are smart devices at home. If any one of the devices is hacked, then all the devices
    whose keys are generated using its key will also be dysfunctional. This is one
    of the basic usages of blockchain in securing IoT network in smart home \[[22](#9789815051452-C1.html#r22)\].
    Blockchain applications do not limit to this, they can have a number of usages
    in different domains on IoT.


    ### Blockchain IoT Security: Implementation Challenges


    There are still various issues with blockchain and IoT integration. One of the
    major issues is the verification of every action by all other devices, which can
    be sometimes quite time consuming. Also, in a network with thousands of devices,
    it will be really difficult to get consent of majority of nodes. For each successful
    transaction, the miners need to compete with each other for validating the transaction.
    Here our peer nodes and miner nodes all are our lightweight devices, which do
    not have such high-end computational capabilities. One feasible solution for this
    is to have a custom-made framework for maintaining blockchain. But again, the
    issue is to have a different third-party platform vendor for this. Even after
    so many security features, we can not be sure that our network is free from any
    security breach. In case a device is malicious or hacked immediately but for that
    also we need consent of majority of devices. So, we can say that if entry into
    this network is tough, pushing someone out of the network is also tough. Organizations
    should thoroughly investigate their privacy requirements and choose a proper blockchain
    type or request the development of a custom one until ready-made solutions appear
    on the mass market.


    ## CONCLUSION


    This chapter examined two of the most talked technologies: blockchain and the
    Internet of Things (IoT). Blockchain is a distributed ledger system which creates
    immutable records, resulting in highly secure data, while IoT is a technology
    that has been ingrained in our daily lives. Blockchain is a decentralized ledger
    which records all transactions that occur over a peer-to-peer network, which facilitates
    the movement of digital assets without the involvement of a third party. Blockchain
    technology has been used in a wide variety of industrial and research applications
    and fields, including cryptocurrency, financial transactions, supply chain management,
    health record management, and research, e-voting, key distribution, financing
    creation, and safeguarding public data. With the proliferation of intelligent
    gadgets around us, IoT is a burgeoning technology for linking these items. Security,
    Regulatory Policies, Integrity, Availability, Bandwidth, Heterogeneity, Compatibility,
    Authentication, Confidentiality, Lightweight, Consumer Expectations, and Key Management
    Systems are the primary problems in IoT. It is also very beneficial for other
    blockchain-related difficulties, such as integrity, confidentiality, authentication,
    and critical management solutions. One of the primary aspects of blockchain which
    makes it a suitable option for IoT security is its decentralized nature which
    makes attackers'' jobs challenging. Owing to the dispersed nature of IoT frameworks,
    they are more vulnerable to attack. This implies that compromising even one less-cared-for
    device would be pretty straightforward due to the high number of devices.


