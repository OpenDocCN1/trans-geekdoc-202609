- raw: 'The monetary policies of an economy are controlled by the central bank. A
    central bank controls the relevant economic management tools of an economy. The
    central bank''s duty is to control money supply in an economy and deployment of
    monetary policies including interest rates management, keeping price stable for
    essential commodities \[[1](#9789815051452-C2.html#r1)\]. Central banks have monopoly
    on the currency issuance for a given economy \[[2](#9789815051452-C2.html#r2)\].
    The emergence of Bitcoin in 2009 \[[3](#9789815051452-C2.html#r3)\] motivated
    the concept of an alternative currency mode as a digital currency or crypto currency.
    This new form of alternative currency can be managed by private sector players
    or individual. Post bitcoin invention, private sector organizations or individuals
    have issued more than five thousand crypto currencies \[[4](#9789815051452-C2.html#r4)\]
    in the last decade. The common attribute of these currencies is that they are
    based on digital ledger technology and are not controlled by any tangible resource.
    The currencies included Bitcoin \[[3](#9789815051452-C2.html#r3)\], Stellar \[[5](#9789815051452-C2.html#r5)\],
    Ripple \[[6](#9789815051452-C2.html#r6)\], Ethereum \[[7](#9789815051452-C2.html#r7)\],
    Tether \[[8](#9789815051452-C2.html#r8)\] and others.


    The strict regulations and law of land requirements for the financial market are
    creating challenges for decentralized digital currencies. Keeping this in view
    of the growth and opportunities in digital currencies, central banks are investing
    in the research and development of digital currencies backed by central banks
    and governments to preserve monetary policy and financial market stability \[[9](#9789815051452-C2.html#r9),
    [10](#9789815051452-C2.html#r10)\]. The Bank for International Settlements (BIS)
    conducted a recent survey \[[11](#9789815051452-C2.html#r11)\] to analyse efforts
    by central banks on central bank digital currency research projects. The majority
    of central banks (>70%) replied that they were investing in the possibility of
    issuing a central bank digital currency (CBDC). This survey covers diverse geographies
    in the different jurisdictions with reachability of more than 70% of the world''s
    population \[[11](#9789815051452-C2.html#r11)\]. 35% of the participants were
    from developed economies and 65% of the survey participants were from developing
    economies. The level of central bank digital currency organizations are classified
    as a) Early Adopters, b) followers and c) new entrants.


    ### Early Adopters


    The early adopters are the organizations, which started investing in the technology
    during 2015-2016. The Bank of England published its “One Bank Research Agenda”
    \[[12](#9789815051452-C2.html#r12)\] in 2015. The Bank of England collaborated
    with University College London in 2016 for its RS Coin CBDC \[[13](#9789815051452-C2.html#r13)\]
    framework development. China''s central bank, “The People''s Bank of China (PBoC)”
    started its CBDC journey in 2016 to get control of monetary supply in China and
    to optimize efficiency of the payment system \[[14](#9789815051452-C2.html#r14),
    [15](#9789815051452-C2.html#r15)\]. The Bank of Canada started investment in CBDC
    in 2016 with R3 Project Jasper and Payments Canada \[[16](#9789815051452-C2.html#r16)\]
    and then started analyzing DLT for payment transformation in the country. Germany''s
    central bank “Deutsche Bundesbank” started project “BLOCKBUSTER” in early 2016
    to utilize digital ledger for interbank settlements in Germany \[[17](#9789815051452-C2.html#r17)\].
    The Bank of France initiated the project “MADRE” in mid-June 2016 for digital
    currencies. Project “SALT” was started by Banco Central for Brazil in September
    2016 \[[18](#9789815051452-C2.html#r18)\]. The United States Federal Reserve published
    its first Central Bank Digital Currency report in September 2016 \[[19](#9789815051452-C2.html#r19)\].
    In November 2016, the Ubin project was started by Singapore''s central bank and
    financial regulatory. The Bank of Japan and European Central Bank started the
    project Stalla in December 2016 \[[14](#9789815051452-C2.html#r14)\].


    ### Followers


    The organizations which started investing on digital ledger technology during
    2017-2018 are classified as followers. Digital currency project LionRock was initiated
    by The Hong Kong Monetary Authority (HKMA) in March 2019 \[[20](#9789815051452-C2.html#r20),
    [21](#9789815051452-C2.html#r21)\]. Its aim is to utilize digital ledger technology
    for interbank settlement in the domestic market of Hong Kong. The Bank of Finland
    analyzes differences and similarities between general-purpose central bank digital
    currency and cash, and published a research paper in May 2017 \[[22](#9789815051452-C2.html#r22)\].
    To address the issue of declining cash use in Sweden, the central bank of Sweden
    started project e-Krona in September 2017 \[[23](#9789815051452-C2.html#r23),
    [24](#9789815051452-C2.html#r24)\]. To address financial inclusion issues in Uruguay,
    the Central Bank of Uruguay initiated its Central Bank Digital Currency project
    “e-Peso” in November 2017 \[[25](#9789815051452-C2.html#r25)\]. To analyze the
    benefits of a digital currency e-Shekel, Bank of Israel formulated a research
    team. Denmark National bank performed a high level exploration of central bank
    digital currency and its impact on Denmark''s financial market infrastructure,
    publishing its central bank digital currency report in December 2017 \[[26](#9789815051452-C2.html#r26)\].
    The South African Reserve Bank (SARB) started project Khokha in January 2018 to
    take benefit from DLT in the area of interbank payment settlement. The SUPCAVEN
    started project Petro in Venezuela to overcome US Dollar dependency and to counter
    US and European Union sanctions \[[27](#9789815051452-C2.html#r27)\]. To promote
    Lithuania''s financial service industry, a DLT based sandbox called LBChain was
    introduced in March 2018 \[[28](#9789815051452-C2.html#r28)^(\-)[30](#9789815051452-C2.html#r30)\].
    The Swiss National Bank analyzed the adaptability of DLT in Switzerland financial
    sector in the month of April 2018 \[[31](#9789815051452-C2.html#r31)\]. The first
    phase of central bank digital currency was revealed by Norges Bank of Norway in
    May 2018 \[[32](#9789815051452-C2.html#r32)\]. The Reserve Bank of New Zealand
    published a report in May 2018, exploring DLT''s role in optimizing payment system
    efficiency \[[33](#9789815051452-C2.html#r33)\]. The project Inthanon was initiated
    by The Bank of Thailand \[[34](#9789815051452-C2.html#r34)\] in August 2018, to
    explore DLT potential in the area of Thailand''s FMIs.


    ### New Entrants (2019)


    In February 2019, the Bank of Korea published a research paper on the assessment
    of the impact of general purpose account-based CBDC (GA-CBDC) on the financial
    market stability using two distinct monetary general equilibrium models \[[35](#9789815051452-C2.html#r35)\].
    The Bank of Japan published its first official paper \[[36](#9789815051452-C2.html#r36)\]
    on CBDCs to assess the potential impact of CBDCs on payment efficiency on FMIs.


    In May 2019, the Bank of Canada and MAS published the project Jasper-Ubin \[[37](#9789815051452-C2.html#r37)\]
    report, the world''s first CBDC experiment that enabled the settlement of cross-border
    interbank payments on two distinct DLT platforms denominated in two different
    currencies. The project Jasper-Ubin was based on an alternative cross-border interbank
    payments settlement model \[[38](#9789815051452-C2.html#r38)\]. Under the auspices
    of the ECB, the ECB Crypto-Asset Task Force published an analysis of crypto-assets
    in May 2019 \[[39](#9789815051452-C2.html#r39)\]. The paper provided a standardized
    definition for crypto-assets and examined their implications for the broader economy
    from the monetary policy perspective.


