- raw: 'VANET presents intelligent features including intelligent vehicles that are
    capable of making adaptive decisions for communication between the two parties
    *i.e.* the sender and the receiver. The major challenge faced can be the delivery
    of the message to the destination in such harsh traffic conditions with constrained
    mobility parameters. VANET presents a real-time application but lacks security,
    scalability, efficient routing and clustering protocols. The significant part
    of this chapter is to stress upon the blockchain system based security. The blockchain
    technique is used for accurate information dissemination between the vehicular
    nodes. Here we concluded that combining the approach of blockchain system with
    Vehicular ad-hoc network ensures the security of data in the transmission process.


