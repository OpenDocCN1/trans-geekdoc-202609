- raw: '6.  **Compatibility:** With so many devices of various manufacturers in the
    market, compatibility is a big issue. We all have faced these issues while installing
    a smart device at our home. To resolve this issue a bit of help can be taken from
    software patches by the companies. But this is again an issue as we can’t ensure
    that each device has a system of self-updates. These issues elevate when devices
    work on different versions, which leads to performance degradation and security
    issues. Thus, most of the devices need to keep themselves maintained.


    7.  **Heterogeneity:** IoT devices can be networking devices, home appliances,
    wearable devices, sensors, industrial instruments/machines, vehicular sensors
    or any embedded devices, which have a wide range of capabilities, connectivity
    and vendors. Networking between such a wide range of devices is a highly complicated
    issue. So, one of the major issues of IoT is establishing a connection between
    such heterogenous devices with various levels of working protocols and connection
    issues.


    8.  **Confidentiality:** A smart device can be a human or any device which can
    be involved in collecting data, managing data or analysing data. Such data can
    be very crucial as it may include very sensitive data like personal information,
    health information, *etc.* This data needs to be protected not just from the outside
    world but also from other nodes. Confidentiality also means that data should only
    be received and processed by the authentic device.


    9.  **Authentication:** There may be numerous devices in an IoT network, all of
    which should be authenticated, as there are so many devices which many attackers
    may fake being a genuine part of the network. All the devices in the network should
    be initially authenticated, and then each node trying to join should be validated
    by either a central authority or by mutual consent.


    10.  **Lightweight Solutions:** This can be either considered as an aspect or
    constraint, as all the devices should be energy conserving and be compatible with
    the IoT algorithms and protocols. On the other hand, we can say that, all the
    algorithms devised for IoT devices should be lightweight networking protocols.
    As high energy consuming protocols are not compatible with IoT structures.


    11.  **Customer Expectations:** IoT market is a customer-oriented segment, unless
    it is not a complete infrastructure-based setup, in most of the scenarios we deal
    with small hand-held devices or day to day usage appliances. In our daily usage,
    a number of devices are increasing rapidly, and with such a competitive environment,
    customer satisfaction is a very important factor. User’s expectations should be
    met otherwise there is so much competition that the same kind of devices are launched
    by various manufacturers. The product should be the best in the market and as
    per users’ expectations.


    12.  **Key Management Systems:** The information transmission by IoT devices should
    be secure using encryption strategy. Here one of the constraints is that it must
    be light weight key management system which enables trusted data exchange. The
    key distribution should consume minimum energy for the long life of devices. There
    are various encryption algorithms that can perform very efficiently but we need
    nodes with computational capacity. Thus, the secure data management with light
    weight key management is a crucial issue.


    ### Ongoing Researches


    #### IoT Security using Blockchain


    Block-chain secures the data communication between IoT devices with safe data
    transmission. Rathee G. *et al.* \[[7](#9789815051452-C1.html#r7)\] suggested
    securing wireless communication in IoT using the blockchain technique. To ensure
    the device is an authenticated device, to track any device activity and to maintain
    secrecy and transparency between peer nodes, all the objects are added in the
    blockchain. The suggested scheme is also used to extract the information from
    various nodes and preserve the extracted data into a blockchain. This ensures
    safety of extracted data as well as transparency among distributed nodes. It works
    in the same manner as we discussed in the previous sections on the working of
    blockchain. Any device trying to join the network should be authenticated by existing
    nodes in the network. If more than a particular threshold number of users accept
    that node, then one of the nodes can add a new user to the existing block chain.
    The same concept also applies to messages generated. This process of adding a
    node or passing a message results in transactions where each transaction can be
    maintained in the form of an immutable chain of successful transactions in a sequentially
    encoded hashing methodology. A transaction appears in a chain only if it is successful.
    All the messages are published as an immutable ledger that cannot be modified,
    and every IoT node/peer maintains the common ledger as all the other peers in
    the network \[[8](#9789815051452-C1.html#r8)\]. Agrawal, R. *et al.* \[[9](#9789815051452-C1.html#r9)\]
    proposed a blockchain based IoT structure where, trust is maintained through an
    immutable decentralized blockchain. As blockchain is distributed in nature making
    system more resilient to failure, this proposes a way to secure the system using
    device authentication using any external intervention. Every node interaction
    is saved as a blockchain block making its usage authenticated, and it is saved
    as IoT blockchain. Various prediction models are used to generate crypto-tokens
    for user authentication. These crypto-tokens are then improvised using ensemble
    methods, which uses the most efficient model. Huh, S. *et al.* \[[10](#9789815051452-C1.html#r10)\]
    used a public-private key pair for encrypting the data and kept the public key
    on Ethereum blockchain and private keys were stored in individual devices. So
    that they could easily build key management and distribution system in an efficient
    manner. Managing a key using blockchain is a very common thing, but they explicitly
    used Ethereum as they wanted to manage it in a fine-grained manner. This can be
    compared with partial IoT implementation with fully scaled IoT system. It was
    concluded that the results showed better performance as the complete system did
    not have compatibility issues compared to partial devices integration with a partial
    structure. Their case study was on smart meters. They used data coming from smart
    meters and smart phones. Using Ethereum smart contract, they constantly analysed
    the data from smart meters, where smart phones were used to send the specified
    policies for air conditioners and bulbs. These devices constantly check policy
    updates in Ethereum smart contract to remain updated, and whenever necessary,
    they switch to the power saving mode and back to the normal mode as and when required.
    They only created a small-scale experimental setup, which needs to be checked
    for scaling up with multiple devices. The major issue which can be faced with
    multiple devices is that there can be synchronization issues with an increase
    in devices and consequently requests \[[11](#9789815051452-C1.html#r11)\]. Also,
    our light weight IoT devices would not be able to serve so many requests parallelly
    which leads to denial of service.


    #### IoT Security using Fog Computing'
