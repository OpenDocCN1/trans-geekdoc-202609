    \ Professional University, Punjab, India  \n\n |\n\n# Blockchain for IoT Security\
    \ and Privacy: Challenges, Application Areas and Implementation Issues\n\n**Chaitali\
    \ Choudhary^([1](#9789815051452-C1.html#aff1), [\\*](#9789815051452-C1.html#cor1))****,**\
