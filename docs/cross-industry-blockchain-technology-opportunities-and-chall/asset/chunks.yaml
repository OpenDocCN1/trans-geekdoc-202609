- raw: 'Fog computing is one of the most compatible technologies used with IoT technologies
    and application frameworks. Tange K. *et al* proposed fog enable authentication
    \[[12](#9789815051452-C1.html#r12)\] for securing IoT networks. This can be done
    by using fog nodes as authenticating systems rather than any third-party authentication
    server requirements. A fog node fulfils all the requirements of the IoT network
    as it is lightweight, local to the network, thus leading to very minimum communication
    overhead and fast response time. Also fog nodes can act as part of the network
    on one end whereas it can be used for third party communication and data transfer
    without any issue of security breach. This also enhances our network by transferring
    some of the authentication control rights to fog node, which results in reduced
    computation of light weight IoT nodes. One of the open challenges in IoT security
    using fog node is the isolation of fog nodes for security purpose. As with legacy
    systems where security measures are very poor, in such systems, fog node isolation
    is a difficult task which is as an open challenge for researchers.


    #### IoT Security using Machine Learning


    IoT networks are heterogenous with a wide range of devices and different kinds
    of protocols and algorithms, with deployment on a massive scale with various connectivity
    issues using low power and low-cost communication in the close proximity without
    involving a central authority. It should also have self-organization and self-healing
    characteristics which should be dynamically managed with high security and intelligence.
    For such a constraint-based network, machine learning is one of the best suited
    techniques. The machine learning algorithms can train themselves with any external
    interference \[[13](#9789815051452-C1.html#r13)\]. Such networks can adapt accordingly
    and can make future predictions based on the dynamic data collected at run-time.
    It can respond to specific problems which change with time. It can be used to
    detect threats and malwares. For example, Google uses ML to identify potential
    threats in mobile devices and endpoints. But ML is not good enough solution due
    to false positives and true negatives, still we can trust ML based reinforcement
    or unsupervised learning techniques \[[14](#9789815051452-C1.html#r14)\]. ML based
    solutions need to be monitored for modifications in models and error predictions.
    Hasan, M. *et al* used various machine learning algorithms for anomaly and attack
    detection and compared various techniques on parameters such as accuracy, recall,
    precision, F1 Score, *etc.* They used various techniques like Decision Trees,
    Deep Neural Network, Artificial Neural Network, Random Forest, support Vector
    machine and concluded that random forest technique is the best for early prediction
    of various kinds of attacks. But they only have studied classical approaches rather
    than ensemble approach. Also, they haven’t devised a complete framework.


    IoT Security using Edge Computing: IoT with Edge computing is a highly researched
    field as it incorporates cloud in it, and IoT with cloud being a current technology
    in research perspective. Wang, T. *et al.* \[[15](#9789815051452-C1.html#r15),
    [16](#9789815051452-C1.html#r16)\] proposed that the edge networks can be very
    reliable in implementing trust-based message passing framework to meet special
    service requirements. They concluded that edge-based security framework can help
    in enhancing security, efficiency and performance of a cloud based IoT structure.
    Bhardwaj K. *et al.* \[[17](#9789815051452-C1.html#r17)\] suggested that DDoS
    attack in the network can be reduced using edge nodes usage. As we know, in our
    IoT networks, devices are very light weight with less computational power and
    thus easily prone to DDoS attacks. These attacks are successful as our networks’
    computational power is very low. In Edge based networks, high computational power
    is provided to edge nodes and their computational power can be utilized against
    such attacks. These result in early detection of such attacks leading to damage
    reduction. Their experimental study proved that 10x faster detection can reduce
    the 82% internet traffic due to DDoS attack. Edge computing can help in overcoming
    security breach issue, data compliance issues, safety issues and bandwidth issues.
    The data breach issues are resolved by maintaining data inside the network itself.
    With an edge network, we do not need to send the data outside the world leading
    to minimal chances of data breach. Also, in many countries, data compliance law
    states that data should not move outside the network, which we are very efficiently
    maintaining using edge nodes. Safety issues are one of the major concerns in IoT
    devices, if there is even a bit of a delay in transmitting data to the decision-making
    node which can lead to various security issues. For example, if we are creating
    an app for women’s safety with a SOS button in a wearable device, if there is
    even a bit of a delay in transmitting that data, that can lead to various hazards.
    In IoT, we can’t afford to transmit every data to the central cloud node due to
    various energy saving policies. Edge nodes help us in reducing the communication
    overhead by analysing data locally and only sending the crucial data in a secure
    manner by peer-to-peer authentication between centrally computational cloud nodes
    with edge node lying in and out of the IoT network.


    #### IoT Security using Cryptography/Steganography


    The cryptography is not much used technique in IoT, as cryptographic algorithms
    are too complex to be executed on light weight IoT nodes but still some scholars
    tried this approach too. Henriques S. *et al.* proposed an authentication method
    using both asymmetric and symmetric cryptography to secure communication between
    IoT devices. This leads to reduced time consumption in spite of working on an
    asymmetric approach. Each time, a random session key is taken which improves the
    security in the symmetric encryption approach. This makes the system more attack
    tolerant and resolves the issue of session key distribution. Further improvements
    can be made by using more complicated encryption techniques or by using hashing,
    but the only obstacle in this is less computational power of IoT nodes which would
    not be able to perform high end encryption algorithms. Sridhar S. *et al.* \[[18](#9789815051452-C1.html#r18)\]
    proposed lightweight dual authentication cryptographic approach. A Light Weight
    Asymmetric Key cryptography is used to provide authentication between a sensor
    node and the device gateway. The sensor node unique Id and device gateway’s unique
    Id are used to create a secret key/digital certificate using AES Algorithm. The
    device gateway and the cloud service are mutually authenticated using public Key
    Encryption Digital Signature. They proposed a double authentication scheme which
    resulted in reducing the traffic by eliminating faulty and fake data chunks and
    thus provided security and enhanced the performance by reducing bandwidth usage.
    Khari M. *et al.* \[[19](#9789815051452-C1.html#r19)\] worked on elliptic Galois
    cryptography algorithm which encrypted confidential data from various medical
    sources. Then using matrix XOR encoding steganography technique, it is embedded
    in a low complexity image. It also optimizes block selection using adaptive firefly
    algorithm to reduce computational cost. With this technique, any data can be securely
    transmitted using layers of images in an efficient manner.


    ### Blockchain as Key to IoT Security'
