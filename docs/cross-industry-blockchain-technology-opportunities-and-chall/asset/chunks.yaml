- raw: 'Although adopting BCT directly for IoT is not so easy and straightforward
    as it encompasses various challenges like high resource demand, long latency and
    low scalability. Furthermore, taking into consideration the study conducted by
    Gartner, IoT security spending reached $1.5 billion in 2018, and by 2022, half
    of all security budgets for IoT reached to fault remediation, recalls and safety
    failures rather than protection. Hence if a *‘secure by design’* system is achieved,
    IoT will experience an exponential increase in its advancement. The need for BC
    arrives from the essential challenge faced by IoT is in its distributed architecture
    that may lead to various problems like security, exploitation *via* cyber-attacks,
    collapsing quickly, mismanagement of central cloud service provider, confidentiality
    and authentication, keeping the data integrity, and many more. In addition to
    this, one more example bolsters the idea of amalgamation of BCT with IoT, Big
    chain DB being the one that combines the benefits of Blockchain with Big Data
    \[32\]. Using Blockchain with Artificial Intelligence (AI) will reduce the computation
    overload by its operations on the data \[[19](#9789815051452-C5.html#r19)\]. IoT
    is the connectivity of everyday devices with one another using various techniques.
    IoT can range from being as simple as switching on the coffee machine as soon
    as our car enters the garage to be able to monitor a person’s vitals in healthcare
    and provide this information for further analysis. Companies are investing billions
    on the Industrial Internet of Things for industrial applications and tackling
    their problems \[[33](#9789815051452-C5.html#r33)\]. Due to the increased application
    of IoT and its ability of being able to monitor real time data, it is vulnerable
    to attacks and security issues on the devices connected to the cloud we are storing
    the data in. Our device signals operate in public place that exposes them to hackers
    and they can damage the devices or gain control of the data being sent easily.
    Moreover, it is already vulnerable to network layer attacks like DoS, illegal
    access networks, Man in the middle attack and this list continues. On the storing
    side we can have threats related to illegal access of data, malware or tampered
    data being stored and sometimes even data loss \[[34](#9789815051452-C5.html#r34)\].
    Furthermore, BCT has proved that it is immutable, distributed and immune against
    most of the attacks involving fraud and mainly *double spending* and *record hacking.*
    To explain the term coined as *Double spending,* it is when a party buys multiple
    assets using one pool of one because there is some delay involved in processing
    the payment. Blockchain requires the miners to solve a PoW before confirming any
    transaction that takes some time. This gives time for the payment processing to
    take place and thus tackles the problem easily. BCT’s decentralized approach protects
    from hacking the data stored \[[35](#9789815051452-C5.html#r35)\]. DDoS attacks
    are being handled using the decentralized approach and the Gladius project’s approach
    is focused on stopping DDoS attacks \[[36](#9789815051452-C5.html#r36)\]. IoT
    network involves a lot of sensors spread over a large area to monitor it in its
    entirety. We do not use point to point connection because it does not help in
    modularity, decentralization and reduces the scalability of the network. IoT network
    consists of a controller as well as actuator nodes which help a lot in making
    the system automated. IoT network generates a large amount of data and it results
    in some delays and makes it difficult to manage the network. Using blockchain
    along with an adaptive control algorithm, a lot of these problems can be solved.
    Adaptive control algorithm analyzes the queue and does not allow the queue to
    be saturated by making suitable changes. Blockchain enhances the security and
    stores the HashMap that helps in quick searching in the database, thus increasing
    the efficiency of the IoT network. The ability to create/store/transfer digital
    assets in a distributed, decentralized and tamper-proof way is of great practical
    value for IoT systems. Performance analysis clearly shows that latency is a dominant
    factor in this region \[[37](#9789815051452-C5.html#r37)\].


    Simultaneously an ever-increasing boost in IoT and BCT amalgamation, these two
    concepts under one umbrella have taken a huge step forward as main standards for
    low-power lossy-networks (LLNs) have constrained resources. The future significance
    of this amalgamation is quite evident as not only being useful for commercial
    aspects, it also finds its significance in community services \[[38](#9789815051452-C5.html#r38)\].
    Comprehending conventional issues faced by IoT, they can be listed as ‘*Resource
    Consumption, Centralization, Lack of Privacy, Not Scalable, Mutable, etc.’* and
    these issues then make BCT shine as a savior for IoT drawbacks \[[39](#9789815051452-C5.html#r39)\].


    Hence, the primary objective of integrating BCT with IoT is just to make all these
    challenges vanish or reduce to a very negligible content. One should never confuse
    BC with Bit coin or more broadly speaking with crypto currency, as it is just
    an application or leverage of BCT. BC to be put into a simple statement, it is
    just a distributed database system based on a consensus rule that allows the


    transfer of value between entities. BC being the only one entity that simultaneously
    enjoys three properties:


    1.  *Trust-less* meaning no need to own a certified digital identity and both
    the involved parties have no need to know about each other but still can exchange
    data.


    2.  *Permission-less* meaning nobody has the authority to operate the BC network,
    hence no permissions no controllers.


    3.  *Censorship resistant* meaning anyone can use and negotiate on BC \[[40](#9789815051452-C5.html#r40)\].


    It can be concluded that an IoT ecosystem has numerous vulnerabilities. BCT comes
    as a rescuer and thus paves the path for many futuristic development and researches.
    Huge amount of research can be done even in very specific domains like Smart Energy,
    Smart Manufacturing, Data privacy and what not. With the ubiquity of IoT devices
    and increasing production of data, attempts have started to monetize the data
    giving birth to the machine economy. BC can streamline the negotiation processes,
    eliminating the need for a trusted intermediary.


    Advocating the same notion, the advancement and gaining of attention of IoT and
    BCT, the amalgamation is unavoidable. It is always expected that BCT will revolutionize
    IoT and the adoption of regulations is the key for inclusion of BCT and the IoT
    as part of government infrastructure.


    ### BCT and IoT Integrated for Healthcare


    Healthcare is the one industry that is destined to proliferate with such an exponential
    rate, that in the coming future, it will be the one with most name and fame. The
    way the entire sector is going to revolutionize, is surely destined to bring laurel
    to researchers and enthusiasts devoting their entire time to bring God’s plan
    to existence.'
