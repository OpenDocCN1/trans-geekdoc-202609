    a white paper and described the technology as “electronic payment system based
    on cryptographic proof instead of trust, allowing any two willing parties to transact
    directly with each other without the need for a trusted third party” \[[40](#9789815051452-C2.html#r40)\].


    Blockchain technology for Bitcoin emerged as a solution for “double-spending”
    which was a challenge for the digital transformation of money. Prior to the invention
    of Bitcoin, a trusted central party to avoid double spending handled transaction
    validation. The beauty of DLT is that it protects system integrity and provides
    security using cryptographic solutions in a decentralized ledger that is managed
    by anonymous parties without having trust among themselves. The motive behind
    designing the Bitcoin blockchain was to create a virtual currency based on a digital
    platform that is beyond government control and hide network participant’s identity.
    Unlike HTML or HTTP, Bitcoin was an ideological project in the the start, deeply
    embedded in the anti-censorship ideology of the online community from which it
    emerged, known as “cypherpunks”, which promotes a radical strand of techno-libertarianism
    \[[41](#9789815051452-C2.html#r41)\]. DLT technology has many potential applications
    other than digital currencies. Due to “anonymity” feature, Bitcoin has become
    popular among the criminals and is used for financial frauds and other illicit
    activities. The anonymity of transacting partners is maintained, but all Bitcoin
    transactions are visible to the public, which are recorded in a distributed ledger.
    A Bitcon transaction can be associated with a particular anonymous entity. This
    anonymity process is analogous to that of email address anonymity. All Bitcoin
    transactions contain pseudonyms which have sender''s and the receiver''s wallet
    address. Like email, transaction addresses are known but owners can remain anonymous.


    Many features of the Bitcoin blockchain raised an alarm for regulatory authorities
    and governments and had affected the cryptocurrency''s reputation. There is a
    significant rise in ransom demand using computer malware and ransom amount demanded
    in the form of bitcoin for transaction anonymity. Bitcoin exchange includes lack
    of regulation and bitcoin''s data loss problem is a major challenge. The loss
    of your wallet''s private key can lead to loss of your entire amount in the wallet.


    ### DLT Features


    The centralized ledgers with role-based permissions, which can be edited by authorized
    participants in a network, have been in practice for a long time. The concept
    of immutable and distributed ledger, was proposed through DLT. There are three
    key features of DLT: distributed ledger, cryptographic methodology and the consensus
    mechanism. DLT is not well-defined technology; instead, it is under development
    and its design depends on the stakeholder''s requirements.


    ### Distributed Property of the Ledger


    The beauty and innovation in DLT is that one entity does not have control over
    the ledger but it is among network nodes or number of nodes, as decided. It implies
    that in a digital ledger, past data entries cannot be amended or new additions
    to the ledger cannot be approved by a single entity. To form new entries in the
    ledger, a consensus mechanism (decentralized in nature) is used to newly added
    entries to the blockchain. Post successful validation, the new transaction is
    amended to respective ledgers to maintain network level data consistency.


    This feature of the distributed ledger technology permits peer-to-peer network
    participants to verify and record data in their corresponding ledgers without
    depending on a trusted central party. The elimination of the central party requirement
    optimizes cost and speed by controlling efforts associated with ledger reconciliations
    and its maintenance. In the absence of a single attack point, it also greatly
    strengthens security aspects. The majority of servers in the network have to be
    compromised by an attacker to corrupt the ledger. Corrupting a single or part
    of network participants does not have any impact on the system''s integrity. However,
    a software layer on top of the distributed ledger can be vulnerable to attack
    if not designed properly. Design issues in the software layer caused a significant
    financial damage to Mt. Gox in Japan and Bitfinex \[[42](#9789815051452-C2.html#r42)\].


    ### Validation using “Consensus Mechanism”


    Nodes in the network need unanimity for new data entries validity. Therefore,
    a mechanism called “consensus mechanism” is introduced in Distributed Ledger''s
    algorithmic design. In a distributed ledger, any node can propose a new transaction
    addition to the ledger. It can also be a case in a distributed ledger, where only
    few nodes are allowed to propose an addition of a new transaction to the ledger.
    Utilizing cryptographic validation for a digital ledger consensus mechanism, legitimacy
    of a particular transaction is verified. The consensus mechanism is also useful
    for conflicts resolution in case of simultaneous competing entries. In case of
    permissionless digital ledger, consensus mechanism ensures accurate transaction
    sequencing and prevents bad actors take-over. Sequencing and the consensus mechanism
    are useful to handle double-spend problem. A concept “proof of work” is used in
    a global decentralized network to establish consensus. A “proof of work” protocol
    is must at every new block addition to the chain. This is a complex challenge
    to solve but easy to verify. It involves heavy computing power and processing
    time. The proof-of-work is exercised by executing one-way cryptographic hashing
    algorithms (repeatedly) until a number string is produced that satisfies a predefined
    condition. In the case of the Bitcoin blockchain, the number contains leading
    zeros and the proof-of-work generation process is referred to as “mining”. It
    is computationally very difficult to solve this “proof-of-work” puzzle. Without
    costly computing resources, there is less chance for a single node in the network
    to generate the required proof-of-work. The Bitcoin system is designed in such
    a way that in every ten minutes, a valid proof-of-work is produced. The priority
    is given to the protocol with the higher difficulty score, that means in case
    two proof-of-work are generated at same time, the protocol with higher difficulty
    score is considered as valid. The entity “miner” receives a reward in the form
    of Bitcoins that produce a valid proof-of-work. This reward helps to maintain
    system integrity. The network security depends on the large number of nodes that
    are incentivized to accurately validate ledger changes and consensus establishment
    to maintain data consistency across the network. The “proof of work” imposes a
    heavy computational cost on participants for maintaining the digital ledger. It
    is required in the distrusted participants system.


    The electricity consumption by Bitcon miners is quite high. If the Bitcon network
    were to scale to levels like MasterCard and Visa, the electricity requirement
    would be more than the existing electricity consumption worldwide. This problem
    majorly exists in Bitcoin blockchain. Another DLT system used by Ethereum digital
    currency has a faster consensus mechanism and requires significantly less computational
    resources. In permissioned blockchain, network participants are trusted and pre-selected,
    therefore they do not require difficult “proof of work” as a consensus mechanism.
    There are other consensus mechanisms which offer seniority over computing power
    and require certain asset''s proof of ownership for example proof-of-stake. Fig.
    [(**2**)](#9789815051452-C2.html#f2) explains a centralized ledger and a distributed
    ledger (with and without permission).

