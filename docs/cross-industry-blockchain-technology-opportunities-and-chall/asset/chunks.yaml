    # 集中式与去中心化系统


    考虑这样一个场景：任何人都想使用信用卡购买某物。这个过程有许多阶段，包括信用卡机构对交易的验证、支付网关、涉及的银行 *etc.* 这是一个集中式系统的示例，其中每个人都通过某种法律流程相互连接。现在考虑另一个场景：一个人想直接与另一个人交易，无论其位置如何。这里这两个人将成为对等方，我们需要以去中心化的方式在他们之间建立交易，这意味着两个不在同一位置、不属于集中式系统且互不认识的人之间的交易。这是去中心化系统的基本概念。此类系统的主要问题是信任。我们可以通过制定一个过程来验证、核实和确认交易来建立信任，该过程应具有防篡改性。这样做的总体过程将包括在分布式账本系统中记录交易、使其防篡改、创建链，最后实施共识协议以就将验证的交易添加到账本达成一致。这个单独的交易称为区块，为了使其安全，会创建一个区块链，这就是这个概念被称为区块链的原因。每当一个人向另一个人转账一定金额时，他们会保存该交易的账本，但为了提供信任，称为对等方的另一个人会进入图景。所有这些相关人员也保存一份账本副本。这是区块链过程中定义的不可变分布式账本的基本概念。同样，验证方法也涉及其中，并使用对等方实施。总结，区块链使用去中心化的点对点系统，采用集体信任模型来验证和核实分布式交易。


    ## 区块链结构及其操作


    区块链的基本结构以交易为核心元素，称为未花费交易输出，缩写为 UTXOs。它是电子货币的抽象，在不同货币中具有不同的价值。每当任何用户想要发起交易时，他们首先通过创建
    UTXOs 或使用以 UTXOs 形式存在的硬币创建账本来开始。这些在交易完成前被锁定的加密货币。这些无非就像加密货币中的硬币。每笔交易都需要经过验证，然后广播。这些经过验证和广播的交易通过数字数据链形成链
    *via*。验证工作由称为矿工的特殊对等节点完成。矿工是执行特定区块链协议（称为工作量证明协议）的计算速度快的计算机。图 (**1**) 显示了区块链的基本操作。


    ![](img/9789815051452-C1-F1.jpg)**图 (1))**


    区块链的基本操作。


    对等方及其计算节点有责任执行每个操作。区块链中有两类参与者：发起交易的人和验证这些交易的人，后者称为矿工。如果有人想要转账，他们会发起一笔交易，其账本由双方维护。然后，为了验证、核实和广播，矿工会进入图景。这些交易被添加到交易池中，每个矿工都可以查看。如果所有矿工都验证区块并传输它，那么将会有多条链，而区块链是一条单一且一致的链式流动，这具有挑战性。所有矿工都竞争解决谜题以验证这些交易区块，为了赢得挑战，他们的节点计算能力应当很高。一旦某个矿工获胜，该节点就会将区块发送以进行共识验证。这是通过将信息广播到所有其他矿工来完成的。大多数矿工，至少
    51% 应该同意这个新区块的添加。一旦验证通过，这笔交易就可以以区块的形式添加到原始区块链中。在成功添加此区块交易后，它就完成并被记录。这种解决谜题并最终能够添加区块的算法称为工作量证明协议。该协议需要大量计算能力。这是区块链工作量证明协议的最大缺点之一。因此，目前使用了各种其他协议，如权益证明，但它们都还没有像该协议一样成功。那么，矿工能获得什么呢？矿工通过管理区块链来赚取比特币。权益证明协议使用赚取的比特币来再次解决谜题以添加区块。因此，在这种情况下，他们不使用节点的计算能力，而是使用他们的收益。这看起来不错，但这里出现了双重支付问题。如果一个人拥有大量比特币，这些可以用来操纵原始区块链。


    ## 算法和技术


    有两种技术用于高效的验证和核实：哈希和非对称密钥加密。


    1\. 区块链的主要问题是它是一个分布式账本系统。因此，我们无法使用常规方法对其进行验证。必须有一种机制来在对等方之间建立信任。为此，可以使用公钥加密。公钥加密使用对称密钥的概念，这意味着加密和解密使用的密钥相同。对称密钥存在一些主要问题，例如从发送的数据中推导密钥以及秘密分发密钥。这种密钥分发是一项非常关键的任务，在对称加密中，它应该传递给每个参与者。区块链是一个分布式框架，这使得密钥分发更加困难。公钥加密通过使用两个不同的密钥而不是只使用一个密钥来解决这个问题。必须有两个密钥：一个必须是公开的，另一个应该是私有的。在这里，从消息中提取数据是可能的，因为使用公钥-私钥对加密的数据只能使用公钥来提取或解密。例如，如果一个人想要发送消息，那么该人应该使用其私钥加密数据，然后再使用接收者的公钥加密。接收者使用其私钥解密数据，然后再使用发送者的公钥。这确保了只有发送者可以发送数据，接收者可以接收数据。公钥-私钥对策略的一个流行算法是
    Rivest Shamir Adleman (RSA) 算法。另一种算法是椭圆曲线加密，它比 RSA 更强大，因为它使用更多的位数，从而增加了安全性和复杂性。ECC
    用于各种区块链技术，如比特币和以太坊，用于区块生成，作为区块链的补充。


    2\. 哈希：它在区块链的数据完整性和保密性中起着关键作用。哈希函数将输入数据转换为唯一的固定长度值。为哈希函数选择的算法应该是单向函数，并且应该是抗碰撞的，或者表现出极低的碰撞概率。第一个要求是确保没有人可以从哈希值中推导出被哈希的原始项目。第二个要求是确保哈希值唯一地代表被哈希的原始项目。两个不同的数据集映射到相同哈希值的概率应该极低。这些要求可以通过选择强大的算法（如安全哈希）以及在哈希值中使用适当数量的位数来实现。最常见的哈希大小是
    256 位，常见的函数是 SHA-3、SHA-256 和 Keccak。


    '
