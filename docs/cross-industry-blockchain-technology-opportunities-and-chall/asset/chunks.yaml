- raw: "Centralized *vs*. decentralized system: Consider a scenario where any person\
    \ wants to buy something using credit card. This process has many stages including\
    \ verification of the transaction by credit card authority, payment gateways,\
    \ banks involved *etc.* This is an example of centralized system where everyone\
    \ is connected with other with some legal process Now consider a scenario where\
    \ a person directly wants to deal with another person irrespective of their location.\
    \ Here these two people are going to be peers among which we need to establish\
    \ a transaction in a decentralized way, which means transaction between two persons\
    \ who are not at the same location and not a part of a centralized system and\
    \ do not know each other. This is basic concept of decentralized system. The major\
    \ issue with such systems is trust. We can build trust by framing a process to\
    \ validate, verify and confirm transaction which should be a tamper proof. The\
    \ overall process of doing so will include recording the transaction in distributed\
    \ ledger system, making it tamper proof, creating a chain and finally implementing\
    \ a consensus protocol for agreement on the verified transaction to be added in\
    \ the ledger . This individual transaction is called blocks and to make it secure,\
    \ a chain of blocks is created, that’s why this concept is named as blockchain.\
    \ Whenever one person transfers a certain amount to others, they keep a ledger\
    \ of that transaction, but to provide trust, the other person called peers comes\
    \ into the picture. All these people involved also keep a copy of the ledger.\
    \ This is the basic concept of an immutable distributed ledger defined in a blockchain\
    \ process. Similarly, verification methods are also involved and implemented using\
    \ peers. Summarizing, blockchain uses a decentralized peer-to-peer system using\
    \ collective trust model for validating and verifying a distributed transaction.\n\
    \n### Blockchain Structure and its Operations\n\nThe basic structure of blockchain\
    \ has transaction as the core element, which is called unspent transaction outputs\
    \ abbreviated as UTXOs. it is an abstraction of electronic money and have different\
    \ values in different currencies. Whenever any user wants to initiate a transaction,\
    \ they start by creating UTXOs or by creating a ledger using coins in the form\
    \ of UTXOs. These are locked up cryptocurrencies until the transaction is complete.\
    \ These are nothing but like a coin in cryptocurrencies. Each transaction needs\
    \ to be validated and then broadcasted. Such validated and broadcasted transactions\
    \ form a chain *via* digital data link. The work of validation is done by special\
    \ peer nodes called miners. Miners are computationally fast computers executing\
    \ a specific blockchain protocol known as proof of work protocol. Fig. [(**1**)](#9789815051452-C1.html#f1)\
    \ shows a basic operation of blockchain.\n\n![](Images/9789815051452-C1-F1.jpg)**Fig.\
    \ (1))**  \n\nBasic operation of blockchain. \n\nIt is the responsibility of peers\
    \ and their computational nodes to perform each operation. There are two types\
    \ of participants in blockchain: one who initiates the transaction and other who\
    \ validates these transactions, known as miners. If someone wants to transfer,\
    \ then they initiate a transaction, whose ledger is maintained by both the parties.\
    \ Then to validate, verify and broadcast, miners come into the picture. These\
    \ transactions are added to the transaction pool, which are viewed by each and\
    \ every miner. If all the miners validate the block and transmit it, then there\
    \ will be multiple chains whereas the blockchain is a single consistent linked\
    \ chain of flux which is challenging. All miners compete to solve the puzzle for\
    \ validating these transaction blocks, to win the challenge their nodes computational\
    \ capacity should be high. Once a miner wins, then that node sends the block for\
    \ consensus validation. This is done by broadcasting the information to all other\
    \ miners. Major set of miners, minimum 51% should agree to this new block addition.\
    \ Once verified, then this transaction can be added in form of block in the original\
    \ blockchain. After successful addition of this block transaction, it is completed\
    \ and recorded. This algorithm for solving a puzzle and finally able to add a\
    \ block is called proof-of-work protocol. This protocol needs a lot of computation\
    \ power. This is one of the biggest disadvantages of blockchain proof-of-work\
    \ protocol. Thus, various other protocols like proof-of-stake are used nowadays,\
    \ but none of them are still as successful as this protocol. Now the question\
    \ is what’s for miners here? Miners earn bitcoins for managing the blockchain.\
    \ The protocol proof-of-stake uses this bitcoin earned again for solving the puzzle\
    \ to add a block. So, in this case rather than using their node’s computational\
    \ power, they use their earnings. This looks good but here came the problem of\
    \ double spending. If a person has large number of bitcoins, these can be used\
    \ to manipulate the original blockchain.\n\n### Algorithms and Techniques\n\n\
    There are two techniques for efficient validation and verification. Hashing and\
    \ asymmetric key encryption.\n\n1\\. The main issue with blockchain is that, it\
    \ is a decentralized ledger system. So, we won’t be able to verify it by conventional\
    \ methods. There must be a mechanism to establish trust in between peers. For\
    \ that, public key cryptography can be used. Public key cryptography uses the\
    \ concept of symmetric key, which means the key for encryption and decryption\
    \ is the same. A symmetric key has some major issues like deriving the keys from\
    \ the data sent and distributing keys secretly. This key distribution is a very\
    \ crucial task, in symmetric encryption, it should be passed to each participant.\
    \ Blockchain is a distributed framework which makes this key distribution more\
    \ difficult. Public key cryptography addresses this concern by using two different\
    \ keys in spite of using only one key. There must be two keys: one must be public\
    \ and another one should be private. Here extracting data from a message is possible\
    \ as the data encrypted using public- private key pair can be extracted or decrypted\
    \ using only public key. For example, if a person wants to send a message, then\
    \ the person should be sending data encrypted using its private key and then by\
    \ the receiver’s public key. Receiver decrypts the data using its private key\
    \ and then using sender’s public key. This ensures that only the sender can send\
    \ the data and the receiver can receive the data. A popular algorithm for public-private\
    \ key pair strategy is Rivest Shamir Adleman (RSA) algorithm. Another algorithm\
    \ is Elliptic curve cryptography which is stronger that RSA as it uses greater\
    \ number of bits, thus increasing the security as well as complexity. ECC is used\
    \ in various blockchain technologies like bitcoin and Ethereum for block generation,\
    \ as an addition in blockchain.\n\n2\\. Hashing: It plays a critical role in blockchain’s\
    \ integrity and confidentiality of data. A hash function converts input data into\
    \ a unique fixed length value. The algorithm chosen for the hash function should\
    \ be a one-way function and it should be collision free, or exhibit extremely\
    \ low probability of collision. The first requirement is to make certain that\
    \ no one can derive the original items hashed from the hash value. The second\
    \ requirement is to make sure that the hash value uniquely represents the original\
    \ items hashed. There should be extremely low probability that two different datasets\
    \ map onto the same hash value. These requirements can be achieved by choosing\
    \ a strong algorithm such as secure hash, and by using appropriately large number\
    \ of bits in the hash value. The most common hash size is 256 bits and the common\
    \ functions are SHA-3, SHA-256 and Keccak."
