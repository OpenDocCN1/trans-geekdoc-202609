    issues being faced. | \[[50](#9789815051452-C5.html#r50)\] |

    | 11 | The previous methods were very slow and not that secure in case of transfer
    of medical data and making this data available for anyone who required it. | Using
    Blockchain and Deep Learning to create a model able to transfer the data more
    efficiently and securely. It will lead to reliable data analysis and make the
    data immutable and accurate. Thus, leading to correct diagnosis of the patient.
    | \[[51](#9789815051452-C5.html#r51)\] |

    | 12 | To overcome the issues faced with IoT like very low scalability, high resource
    demand, traffic overload. | A novel BCT based model optimized for IoT devices
    taking into consideration the healthcare facilities by implementing lightweight
    BCT thus increasing privacy and security. | \[[52](#9789815051452-C5.html#r52)\]
    |

    | 13 | The impact of COVID-19 on world and thus the challenges so encountered.
    | Inculcating BCT as a key enabling technology and thus presenting a high-level
    view of BCT depicting how it can be leveraged. | \[[53](#9789815051452-C5.html#r53)\]
    |

    | 14 | The increased interest of hackers in cyber-attacks especially in healthcare
    Big Data. | Patient centric data management system powered by BCT to attain privacy.
    Cryptographic functions are used to protect patient’s data. | \[[54](#9789815051452-C5.html#r54)\]
    |

    | 15 | Constructing a framework for COVID-19 monitoring and seeking information
    for the same *via* internet. | A framework or rather four-layer architecture was
    developed for assisting people regarding this pandemic using IoT and BCT through
    smart devices. | \[[55](#9789815051452-C5.html#r55)\] |

    | 16 | Monitoring and Tracking real time occupancy for COVID-19 in order to ensure
    Public Safety | A novel occupancy system that allows estimation using a precise
    technique that is based on autonomous wireless devices. | \[[56](#9789815051452-C5.html#r56)\]
    |

    | 17 | Management of huge amount of health data leads to increase in human efforts
    and potential risks. | A security framework of preserving healthcare multimedia
    through BCT has been developed with a success rate of 86%. | \[[57](#9789815051452-C5.html#r57)\]
    |

    | 18 | Lack of proper semantics in IoT healthcare mainly dealing with confidentiality,
    accessibility, and reliability. | A BCT decentralized Interoperable Trust framework
    for IoT healthcare that overcomes the drawbacks of IoT healthcare. | \[[58](#9789815051452-C5.html#r58)\]
    |


    # CONCLUSION


    Technological advancements are the key milestones in mapping any sector’s progress.
    When we map the way all these technological advancements have taken a turn, we
    realize that IoT integrated with BCT was not a new thing to be surprised of, rather
    being the need of the hour it surely has taken away the scientific sector with
    a blow. Realizing the advancement in health sectors, with BCT even sharpening
    its fangs did also open the way for enthusiasts and research scholars to invent
    and explore this amalgamated form. This review tries to inculcate all these reforms
    as well and lays a fundamental futuristic approach for developing all the more
    new frameworks and applications that extract out the best from BCT IoT into the
    healthcare sector. Undoubtedly, consolidating these entire concepts into one is
    not everyone’s cup of tea but once done, opens up the way to discover and become
    the necessity of invention. This world is surely about to transform into a virtual
    world, although it has already taken this path, certain resistances are nevertheless
    offered but with this unanimous working of BCT and IoT and that too in healthcare
    can surely reform the entire vision of this journey.


