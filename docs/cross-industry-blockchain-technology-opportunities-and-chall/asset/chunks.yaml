    由于大数据在医疗保健领域的巨大影响，其使用正在与日俱增。但将这项技术付诸实践的道路上仍面临挑战。让我们来看看一些经常遇到的问题。最困难的问题之一是数据收集。患者的知识通常分布在不同的部门、医院、计算机和文件柜中。需要做好充分准备，将所有这些融合在一起并组织起来，以便进行潜在的协作。此外，所有协作实体都将对他们希望检查的大数据的格式和形式达成共同理解和同意。除了确保数据的准确性和一致性之外，还需要进行数据清洗和管理。保护健康数据的程序和政策通常涉及不同的问题。这些问题应在数据汇总和验证后得到解决。由于没有对数据从处理开始的清晰监控，IT
    公司可能会面临与资金、安全和结果相关的困难。医疗保健数据的数量随时间增长，执行团队通常面临管理场所数据存储成本和后果的挑战。维护本地数据存储系统可能是一项复杂且昂贵的事情。这意味着通过各个部门分发数据的方法也可能很复杂。


    对于医疗保健组织来说，数据安全至关重要。当医疗系统开始采用大数据时，他们应获得医疗保健提供者授予的数据访问权限。当组织授予某些专家访问权限时，没有问题，但如果大量团队涉及患者的个人详细信息，则可能出现隐私侵犯问题。医疗保健组织将依赖于可靠的数据提供商，其提供稳定且结构良好的交付，以提供安全的大数据解决方案来防止这些问题。最后，理解大数据在医疗保健公司中的潜力需要改变开展业务的方式。除了熟练的
    IT 工人之外，还需要数据科学家来进行分析。如果没有适当的 IT 基础设施，组织可能难以充分利用大数据。


    ## 教育领域


    学生数据处理仅在过去十年才成为主要的教育趋势 \[44\]。此外，使用大数据帮助学生学习可以追溯到 ITS 和人工智能研究，如图（**8**）所示。在教育领域，当今使用教育数据的主要目的是定义创建最佳教育环境的方法
    \[45\]。大数据是教育中的一个新概念 \[46\]，大多数学术讨论集中在使用数据来提高教学和科学的质量。特别是，广泛教育数据的可用性为教育研究人员提供了使用数字方法和技术大规模调查新兴教育趋势的能力。为大数据提出了三个教育用例：促进学习、教学和管理。


    ![](img/9789815051452-C3-F8.jpg)**Fig. (8))**


    教育领域大数据的实施。


    教育领域的大数据为教育工作者提供了以新方式接触学生并教授他们的独特机会。它将为他们提供更好的教育体验，从而帮助他们决定教育系统的状况。


    ## 关于教育领域大数据应用的挑战


    与其他大型组织相比，学校和大学依赖大量数据。从所有数据中提取信息始于提出正确的问题。它还始于识别大数据可以发挥作用的地方以及不需要任何可能影响的地方。教育中以不同格式生成大量数据。


    任何大数据项目固有的困难之一是，大多数项目都始于需要清理数据。如果公司使用现有来源或众多第三方数据库，总是存在错位。数据科学家花费大量时间清理数据并进行枯燥、耗时的清洁工作。


    为了从大型数据集中提取有用价值，需要确保它们能够相互通信，无论是通过 API 还是算法，或是部分手动实现，都需要做大量工作来充分清理数据，以允许共享和交互。


    ## 遥感


    遥感一直是以高效方式获取信息的最有效工具之一。近年来，遥感数据在许多科学领域发挥了重要作用，包括大气科学、生物多样性、土壤退化、水污染和环境地质学 \[47\]。遥感技术清楚地展示了大数据的特性。大数据遥感正在引起政府项目、商业应用和学术领域的兴趣
    \[48\]。图（**9**）说明了遥感数据的循环。


    美国政府于 2012 年 3 月启动了“大数据”计划。这可能是第一个专注于增强我们从大型复杂数字数据集中提取信息能力的大数据政策倡议。地球观测系统数据和信息系统（EOSDIS）是美国政府为卫星图像大数据承担的最雄心勃勃的任务之一。它提供来自不同来源的端到端功能，用于处理
    NASA 的环境科学数据。在欧洲，欧洲空间局于 2017 年举办了“来自太空的大数据”会议。该会议旨在促进互动，并汇集参与利用来自太空的大数据的研究人员、开发人员、消费者、网络和服务提供商。大数据分析指的是如此广泛且动态的数据集阵列，以至于常规数据处理算法和模型难以采用。涉及的挑战包括数据收集、存储、搜索、交换、交付、处理和分析。遥感大数据具有许多独特和特殊的特征
    *i.e.*，数据具有多源、多分辨率、高维、动态、对映体和非线性特征。遥感大数据通常代表动态状态，因为地表在变化，卫星始终在移动。遥感大数据转换点涉及静态组件和非静态组件。


    遥感中的大数据困难包括应对海量数据 \[49\]。与数据收集、存储、分析和报告相关的挑战往往会导致遥感方面的问题。图（**10**）说明了我们在收集遥感数据时面临的一些常见挑战。


    ![](img/9789815051452-C3-F9.jpg)**Fig. (9))**


    遥感数据中的大数据。 ![](img/9789815051452-C3-F10.jpg)**Fig. (10))**


    遥感数据中的挑战。


    ## 大数据分析工具和技术


    大数据是一个描述海量数据集的概念——包括结构化和非结构化数据，具有多样性和复杂结构，存在诸如数据收集、存储、分析、可视化和处理困难等问题。它需要新的大数据工具和技术，以及用于提取和分析数据以获得洞察力、从而做出更好决策和战略业务步骤的技术方法。图（**11**）中提到了一些最实用和重要的工具。


    ![](img/9789815051452-C3-F11.jpg)**Fig. (11))**


