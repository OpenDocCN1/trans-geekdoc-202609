    \ Testable\n\nDLT has an immutable/perpetual and testable transaction audit trail\
    \ of any asset. Perpetuity nature of a transaction does not mean that a countervailing\
    \ disputed transaction cannot be created. The original transaction record will\
    \ be still available in this case.\n\n### Speed and Efficiency Gain\n\nDLT optimizes\
    \ efficiency and improves speed by eliminating intermediaries and by automating\
    \ processes.\n\n### Reducing Cost\n\nDLT eliminates the need for reconciliation\
    \ and thus reduces the cost as every DLT contains the “shared truth” and there\
    \ is no need to verify one “truth” with another counterparty. DLT lowers the infrastructure\
    \ costs for ledger maintenance and reduces chance of fraud. Distributed ledger\
    \ technology can save $15-20 billion for the financial industry \\[[45](#9789815051452-C2.html#r45)\\\
    ].\n\n### Improved cybersecurity Elasticity\n\nDLT provides a more flexible system\
    \ than centralized system and provides a better shield against cyber-attacks due\
    \ to its distributed property and absence of a single attack point. When compared\
    \ with the centralized design paradigm, DLT is an alternative design paradigm\
    \ for decentralized operational model and business. This will lead to a higher\
    \ degree of automation, scalability and faster processing potential. We will understand\
    \ it by comparing a centralized collateral registry with DLT based collateral\
    \ registry system. In case of a centralized approach of establishing a collateral\
    \ registry, a dedicated platform is set up by a central entity followed by membership\
    \ criteria establishment and establishment of rules and procedures. All transactions\
    \ and actions are initiated by the centralized platform. This platform is developed\
    \ using standardized software development tools to address specific business requirements.\n\
    \nIn contrast, a DLT-based approach involves a collateral registry of peer-to-peer\
    \ transactions with peer-defined conditions such as the release date and protocols\
    \ defining rules in case of transaction failure. Based on the counter parties’\
    \ agreement, a DLT-based collateral registry system can be tailored without setting\
    \ up a centralized system for a particular collateral. The role of the administrator\
    \ in a DTL-based system is minimal. Business actions can be triggered without\
    \ external intervention and are event-driven. As resource requirements at the\
    \ administrator level are limited, setting up a DLT-based collateral registry\
    \ system is faster and scalable. All participants share the processing load and\
    \ collateral transactions business logic can be customized on counter parties’\
    \ requirements.\n\n## DLT RISKS AND CHALLENGES\n\nThe technology is emerging and\
    \ many issues are to be addressed including regulatory and legal issues. There\
    \ are many issues related to migrating payments, financial infrastructure and\
    \ digital ledger technology. A cohesive collaboration and coordination are required\
    \ for security settlement systems and central counterparties. The common challenges\
    \ of DLT including regulatory, technological and legal are listed as below:\n\n\
    ### Technical Issues\n\n#### Immature Technology\n\nDLT is still in the infant\
    \ development stage and there are complex challenges about flexibility and robustness\
    \ of DLT. In addition, there are concerns about volumetric transactions, supply\
    \ of skilled professionals, availability of software applications and standardized\
    \ hardware. However, top IT organizations and financial majors have started investing\
    \ in the development of DLT products and services to provide the same confidence\
    \ as existing IT systems offer.\n\n#### Transaction Response Time and Scalability\n"
  trans: "\n\n### 数字签名和哈希函数\n\n每个新数据条目都使用原始消息上的哈希函数进行加密。这意味着一个原始输入只有一个哈希值，且不可能有另一个输入具有相同的哈希值\
    \ \\[43\\]。“交易块”包含这个经过哈希处理的交易，并有大小限制 \\[44\\]。哈希有助于检测交易数据篡改，因为哈希是在接收端计算的，如果发生篡改，生成的哈希将与原始哈希不同。图\
    \ (**3**) 解释了数字签名中的公钥加密。\n\n![](img/9789815051452-C2-F2.jpg)**Fig. (2))**  \n\n\
    分布式账本。\n\n交易块使用数字签名进行数字签名。“公钥加密”用于 DLT 中的数字签名。形成了“交易块”的仅追加链，其中包含要添加到账本的数字消息（哈希摘要）、共识机制输出（工作量证明）、使用发送方私钥对哈希的数字签名、发送方公钥以及交易的预期接收方。图\
    \ (**4**) 解释了区块链结构示例：在 4 个块的区块链中，最后一个块（块 5）被添加。块 1 是“创世块”。每个块包含对前一个块的引用以保持块的时间顺序，一个经过哈希处理的交易系列摘要和一个数字签名。\n\
    \n![](img/9789815051452-C2-F3.jpg)**Fig. (3))**  \n\n数字签名公钥加密。\n\n在图 (**3**) 中，块\
    \ 5 代表这个区块链的最新添加，用于更新账本。\n\n一旦新块通过指定的共识机制添加到链中，链就不能追溯更改，除非对每个块重新执行工作量证明协议，否则块不能被删除或修改。这意味着随着链长度的增长，这变得越来越困难，因为所有节点都在不断竞争解决工作量证明难题并将新块添加到链中。在这样做时，他们只考虑反映最大计算工作量的交易区块链。每次成功添加到链中都会广播到整个网络，所有节点都拥有整个区块链的最新副本。\n\
    \n1\\. A 先生有两个密钥：一个公钥，他与整个网络共享，以及一个只有 A 先生知道的私钥。\n\n2\\. A 先生使用他的私钥对数字消息的“哈希”进行加密，然后将其传播到整个网络。加密后的哈希被称为“数字签名”。\n\
    \n3\\. 网络参与者接收带有数字签名的数字消息。\n\n4\\. B 先生然后可以使用 A 先生的公钥（他已与 B 先生共享）来验证数字消息是否使用了\
    \ A 的私钥进行加密，并且 A 先生是消息的发送方。\n\n![](img/9789815051452-C2-F4.jpg)**Fig. (4))** \
    \ \n\n区块链结构。\n\n## DLT 优势\n\n分布式账本相对于集中式账本具有许多优势。优势如下。\n\n### 无中间人且去中心化\n\nDLT\
    \ 消除了对中央机构的需求，并使双方能够在去中心化记录保存的情况下进行数字价值转移。这节省了成本，提高了可扩展性和速度。\n\nDLT 通过编程实现自动化，在某些事件发生时自动执行预先商定的条件，*例如*\
    \ 货物到达时自动支付发票。在数字账本中，交易对手方在交易完成时商定定义的条件，所有各方都拥有同一组交易记录。此外，“智能合约”的执行结果将导致对账的旧账本系统。\n\
    \n### 改进的可审计性和增强的透明度\n\n每个网络节点都有加密分布式账本的完整相同副本。更改只有在实时网络传播的共识机制下才有可能。此功能有助于管理对账成本并减少欺诈。\n\
    \n### 永久性和可测试性\n\nDLT 对任何资产都具有不可更改/永久且可测试的交易审计轨迹。交易的永久性并不意味着不能创建相反的有争议的交易。在这种情况下，原始交易记录仍然可用。\n\
    \n### 速度和效率提升\n\nDLT 通过消除中介和自动化流程来优化效率并提高速度。\n\n### 降低成本\n\nDLT 消除了对账的需求，从而降低了成本，因为每个\
    \ DLT 都包含“共享真理”，不需要与另一个交易对手方验证一个“真理”。DLT 降低了账本维护的基础设施成本并减少了欺诈的可能性。分布式账本技术可以为金融行业节省\
    \ 150 亿至 200 亿美元 \\[45\\]。\n\n### 改进的网络安全弹性\n\nDLT 提供了比集中式系统更灵活的系统，并且由于其分布式特性和没有单一攻击点，能更好地抵御网络攻击。与集中式设计范式相比，DLT\
    \ 是去中心化运营模式和业务的替代设计范式。这将导致更高程度的自动化、可扩展性和更快的处理潜力。我们将通过比较集中式抵押品登记处与基于 DLT 的抵押品登记系统来理解这一点。在建立抵押品登记处的集中式方法中，由中央实体设立专用平台，然后建立会员资格标准并制定规则和程序。所有交易和操作均由集中式平台发起。该平台使用标准化软件开发工具开发，以满足特定业务要求。\n\
    \n相比之下，基于 DLT 的方法涉及点对点交易的抵押品登记处，具有对等方定义的条件，例如发布日期以及定义交易失败情况下规则的协议。基于交易对手方的协议，基于\
    \ DLT 的抵押品登记系统可以针对特定抵押品进行定制，而无需建立集中式系统。在基于 DTL 的系统中，管理员的作用微乎其微。业务操作可以在没有外部干预的情况下触发，并且是事件驱动的。由于管理员级别的资源需求有限，建立基于\
    \ DLT 的抵押品登记系统更快且可扩展。所有参与者共享处理负载，抵押品交易业务逻辑可以根据交易对手方的要求进行定制。\n\n## DLT 风险和挑战\n\n\
    该技术正在发展，许多问题有待解决，包括监管和法律问题。有许多与迁移支付、金融基础设施和分布式账本技术相关的问题。安全结算系统和中央对手方需要紧密的协作和协调。DLT\
    \ 的常见挑战包括监管、技术和法律，如下所示：\n\n### 技术问题\n\n#### 技术不成熟\n\nDLT 仍处于婴儿期发展阶段，关于 DLT 的灵活性和稳健性存在复杂挑战。此外，还存在关于大量交易、熟练专业人员供应、软件应用程序可用性和标准化硬件的担忧。然而，顶级\
    \ IT 组织和金融巨头已开始投资开发 DLT 产品和服务，以提供与现有 IT 系统相同的信心。\n\n#### 交易响应时间和可扩展性\n\n"
