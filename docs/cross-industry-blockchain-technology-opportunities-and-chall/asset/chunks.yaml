- raw: "A greenhouse makes it conceivable to reproduce a different atmosphere and\
    \ thus develop nourishment that would not typically develop in the zone. Also,\
    \ making the nursery mechanized enables people to develop their own nourishment\
    \ or plants at home without continually look after them. The purpose of greenhouse\
    \ is to maintain the nursery temperature in an ideal range for ideal plant development\
    \ utilizing a temperature control framework. Another goal is to explore if the\
    \ watering system is solid, to get an ideal soil dampness level for the picked\
    \ plant \\[[3](#9789815051452-C4.html#r3)\\].\n\nThe room temperature is thought\
    \ to be at 15 - 21°C. Another presumption is that the temperature outside of the\
    \ greenhouse, will consistently be colder or equivalent to the temperature within\
    \ the greenhouse. The plant that will be placed in the greenhouse will be favoured\
    \ to temperature at room temperature or above. The consequence of the exploration\
    \ questions depend on time limited experiments. This result could be different\
    \ over the long haul and it is accordingly not substantial in that case. The value\
    \ when the dirt is viewed as excessively wet or too dry is dependent on the type\
    \ of the soil utilized. These qualities cannot be utilized on different types\
    \ of soils that have to be exclusively set with the assistance of the tests.\n\
    \nAs for the field of hydroponics, there is a requirement for a greenhouse and\
    \ many advantages are linked to it. Some of the advantages are as follows.\n\n\
    1.  It will help to maintain optimum conditions, as per the plant grown.\n\n2.\
    \  It will ensure maximum photosynthesis performance by providing required conditions.\n\
    \n3.  It provides improved water use.\n\n4.  It shortens crop cycles *i.e.* plants\
    \ grow faster as compared to traditional farming methods.\n\n5.  It will help\
    \ to resolve the problems caused by soil depletion.\n\nFor this study, more economical\
    \ and compact greenhouse under 2x2 m is implemented that enclosed a hydroponics\
    \ system of under 1.5x1.5 m.\n\nThis monitoring system comprises interfacing of\
    \ sensor with the main MCU and will control them, based on the requirement for\
    \ the plant, e.g water level sensor is interfaced with the motor to keep the level\
    \ of water under a threshold by controlling the rate of water being pumped. Along\
    \ with that, all the data is sent to the cloud using a server and displayed on\
    \ a website in the form of graphs, charts, and numbers \\[[4](#9789815051452-C4.html#r4)\\\
    ].\n\n### Hardware\n\nThe hardware part of this system is divided into three parts\
    \ -AGMS module, hydroponic system, and greenhouse. The hydroponic system and greenhouse\
    \ have already been discussed shown in Fig. [(**3**)](#9789815051452-C4.html#f3).\n\
    \nAl the above-displayed sensors work in synchronization with each other. Every\
    \ threshold in-capacitance of one sensor directly impacts the other one.\n\nThe\
    \ AGMS module consists of a Micro Controller Unit embedded in a waterproof casing\
    \ that is connected to various sensors listed as:\n\nDHT22: A digital temperature\
    \ and humidity sensor with good accuracy with ±1^oC.\n\n![](Images/9789815051452-C4-F3.jpg)**Fig.\
    \ (3))**  \n\nBlock Diagram of Project. \n\nWater level sensor: Water level sensing\
    \ module gives an analog reading the height of water and has to be further converted\
    \ into cm \\[[5](#9789815051452-C4.html#r5)\\].\n\npH sensor: Detects the pH value\
    \ of the solution.\n\nBuzzer: Makes a sound whenever there is a high value at\
    \ the input.\n\nL293d: Motor driver IC to control the pump.\n\nTouch Screen: To\
    \ display the values of various sensors in multiple forms. It is programmable.\n\
    \nESP8266: For sending the data to the server. It is a Wi-Fi module working at\
    \ 2.4 GHz.\n\nLDR: It is a Light Dependent Resistor that gives an analog output\
    \ value based on the intensity of light falling on it.\n\nThe Micro Controller\
    \ Unit used is Arduino Mega. Arduino Uno is not used here despite the familiarities\
    \ because of the number of ports and memory of the Mega.\n\n### Server and Cloud\n\
    \nFor any efficient monitoring system, all the data has to be visualized and displayed\
    \ on any device. For this purpose, we use a server which is programmable like\
    \ a Digital Ocean Droplet or a pre-made one like Thingspeak, as shown in Fig.\
    \ ([**4**](#9789815051452-C4.html#f4)).\n\nThe data from the sensors is processed\
    \ by the Arduino to Thingspeak using an API key and ESP8266, a Wi-Fi module \\\
    [[6](#9789815051452-C4.html#r6)\\]. This process is simple as one has to give\
    \ an API key to get the data as shown in Fig. ([**4**](#9789815051452-C4.html#f4)).\
    \ The only limitation of Thingspeak is that it is not programmable and there are\
    \ very limited functions whereas, in the case of Digital Ocean, it is totally\
    \ customised right from the memory, number of cores in the processor, and the\
    \ type of operating system for the server. The data from the server is then captured\
    \ by a webpage using API keys in JS and displayed in it. The website can be made\
    \ from the scratch or from custom templates readily available on the internet.\
    \ The main thing to keep in mind is the APIs for transferring the data \\[[7](#9789815051452-C4.html#r7)\\\
    ].\n\nEach sensor data is individually sent to the cloud without any cross-dependency.\
    \ Each sensor will be modular *i.e.* they can be easily disconnected and replaced\
    \ when needed, Fig. [(**5**)](#9789815051452-C4.html#f5). The sensors will be\
    \ connected to the ports of the module casing and can even be made wireless with\
    \ the help of any Bluetooth or any Wi-Fi modules, as shown in Fig. [(**6**)](#9789815051452-C4.html#f6).\n\
    \n## WORKING\n\nThe total system works in synchronization with the hydroponics.\
    \ To make it simpler, we will break the procedure and working into steps. The\
    \ first step is to select the plant type to be grown. Then selection of the nutrients\
    \ and all other parameters like the humidity, optimum temperature, water level,\
    \ water flow, growing medium *etc.* is taken care of. Secondly, all these are\
    \ assembled to the hydroponics system through the NFT technique. The whole hydroponics\
    \ system is enclosed by a greenhouse that also has the main module in it. Now\
    \ this module with all the sensors will sense the data at customized intervals\
    \ and send it to the cloud.\n\nThe threshold of each sensor is already fed to\
    \ the module in the programming. When any sensor goes out of the threshold, the\
    \ alarms get activated. In this case, the alarms are the buzzer and the alerts\
    \ *i.e.* website alerts, GSM alerts, twitter alerts and mail alerts. Also, some\
    \ of the modules will automatically adjust the threshold, *e.g.* when the water\
    \ level goes above the optimum level, the flow rate of the motor decreases. For\
    \ the humidity, exhaust fans and sprayers are used whereas for the temperature,\
    \ high wattage incandescent bulbs are used.\n\n![](Images/9789815051452-C4-F4.jpg)**Fig.\
    \ (4))**  \n\nThinkspeak website ![](Images/9789815051452-C4-F5.jpg)**Fig. (5))**\
    \  \n\nUbuntu server ![](Images/9789815051452-C4-F6.jpg)**Fig. (6))**  \n\nSetting\
    \ up configuration \n\n## CONCLUSION\n\nAgriculture was the first occupation of\
    \ humans; it is the foundation for all the Industries. The world’s population\
    \ is increasing day by day and there is an increasing requirement of food. In\
    \ India, 3000 children die every day due to malnutrition.\n\nThe greenhouse monitoring\
    \ system gives the flexibility of growing crops in any seasons. This enhances\
    \ the moderate cost and availability of seasonal vegetables throughout the year.\
    \ The crops that are grown with the techniques like hydroponics and aquaponics\
    \ and are free from pesticides are nowadays called organic food.\n\nThe techniques\
    \ of Aquaponics and hydroponics give flexibility to the soil because these processes\
    \ do not require any soil so any crop can be grown in any part of the world and\
    \ the greenhouse can be constructed anywhere in the world so import and export\
    \ will be quite less. It can be implemented for any fresh vegetables.\n\n## CONSENT\
    \ FOR PUBLICATION\n\nNot applicable.\n\n## CONFLICT OF INTEREST\n\nThe authors\
    \ declare no conflict of interest, financial or otherwise.\n\n## ACKNOWLEDGEMENTS\n\
    \nDeclared none."
