    ![](Images/9789815051452-C2-F5.jpg)**Fig. (5))**


    Trade finance smart contract. (ING/Wall Street Journal – “Banks Turn to Virtual
    World to Modernize Physical Commodities Trading”, By Stephanie Young, 04 Apr 2017,
    Wall Street Journal [https://www.wsj.com/articles/banks-](https://www.wsj.com/articles/banks-)
    turn-to-virtual-world-to-modernize-physical-commodities-trading-1491 303623)


    Smart contracts have attracted businessmen because they facilitate the idea of
    automated organizations that do not depend on any human inputs except financial
    backing personnel. Among the world''s biggest public blockchain, Ethereum is a
    well optimized for smart contract applications. Venture capital funds for automated
    businesses have been launched on the Ethereum platform by Decentralized Autonomous
    Organizations (DAOs). The working of DAO''s is as:


    *   Smart contracts are formulated by a group of people to run the organization.


    *   People provide funds (in an initial funding period) to DAO to represent ownership
    by purchasing tokens. This is referred as initial coin offering (ICO) or crowd
    sale. It enables organizations to set up required resources.


    *   Post funding period, DAO starts to operate.


    *   People can suggest DAO to invest the money and members have the right to vote
    for approval/rejection \[[58](#9789815051452-C2.html#r58)\].


    The DAO entity “Ethereum” system was attacked in June 2016. In the attack, the
    intruder transferred 3.5 million “ether” cryptocurrency (valued around US$50).
    The intruder identified an exploit bug in the DAO software but the base Ethereum
    blockchain was not compromised. This attack is an instance of security vulnerability,
    that exists on the application layer on top of the blockchain. To recover the
    stolen funds, the Ethereum community decided to complete “hard fork” for Ethereum
    blockchain. Ethereum blockchain was divided into two active cryptocurrencies called
    Ether/Ethereum One/Ethereum Core and Ethereum Classic. The first one contains
    the restored stolen funds hard fork and the later contains stolen funds original
    transaction under hacker''s control. The use of DLT combined with automated smart
    contracts raise a number of regulatory and legal issues in addition to technical
    vulnerabilities. These issues are related to jurisdiction, liability, voidability
    and amendments of contracts.


    ## EXPERIMENT PRACTICES


    Best practices are discussed in this section including approaches adopted by banks
    for their central bank digital currency initiatives.


    ### Project Jasper


    The project was launched by the Bank of Canada, Payments Canada, a few other Canadian
    organizations and a blockchain organization R3 in March 2016 \[[59](#9789815051452-C2.html#r59)\].


    #### Phase I


    Phase I of JASPER was launched in March 2016 and aimed to build proof of concept
    based on DLT technology for interbank settlements \[[16](#9789815051452-C2.html#r16)\].
    For each participating Ethereum entity, distributed nodes were created. Bank of
    Canada approves or rejects transaction using smart contracts based on autonomous
    transaction agents. Every Jasper Phase I transactions were synchronized and updated
    on every node \[[60](#9789815051452-C2.html#r60)\].


    #### Phase II


    To fix the issues of Jasper Phase I, Phase II was introduced in September 2016
    to explore and recreate Jasper Phase I prototype on a different DLT platform.
    Phase II of Jasper was developed on Corda. Phase II of Jasper introduced two more
    participants in addition to the Phase I participants. In contrast to Jasper phase
    I implementation, Phase II implemented a liquidity-savings mechanism (LSM) and
    an atomic settlement capability based on Corda. Phase II of Jasper has backward
    compatibility to support Phase I support including deferred and atomic net settlement
    options.


    #### Phase III


    In October 2017, Phase III of Jasper was initiated by the Bank of Canada to harness
    DLT features for multiple asset type exchanges . Organizations participating in
    Jasper Phase III were the Bank of Canada, TMX Group, Payments Canada, R3 and Accenture.
    TMX is a financial organization in Canada which works for many security exchanges
    and is the owner of Canadian Depository for Securities \[[61](#9789815051452-C2.html#r61)\].
    The CDS is the settlement hub and national clearing center for securities depositories
    in Canada \[[62](#9789815051452-C2.html#r62), [63](#9789815051452-C2.html#r63)\].
    The aim of Jasper Phase III was to develop a proof of concept based on DLT, that
    permits multiple asset types to be exchanged on shared ledger. Jasper Phase III
    enables tokenized financial assets and atomic settlement capabilities on an integrated
    platform. The prototype was hosted on Microsoft cloud and implemented on Corda
    v2.0.


    ### Project BLOCKBASTER


    Project BLOCKBASTER was started in March 2016 by Deutsche Borse Group and Deutsche
    undesbank after motivated by technology capability in the financial services industry
    \[[64](#9789815051452-C2.html#r64)\].


    The project goal was to harness blockchain to improve Germany''s security settlement
    FMI back office services. Central bank of Germany is Deutsche Bundesbank \[[65](#9789815051452-C2.html#r65)\]
    and is one of the world''s biggest securities exchange centers \[[66](#9789815051452-C2.html#r66)\].
    It manages and operates a clearing house “Clearstream”, based in Luxembourg. The
    BLOCKBASTER was initiated to develop a prototype based on DLT for cash securities
    settlement. The project BLOCKBASTER used two digital ledger platforms named Hyperledger
    Fabric and Digital Assets to implement lifecycle management prototype and a full
    interbank bond issuance. Cash assets and tokenized bond were securities settled
    on project BLOCKBASTER. The project BLOCKBASTER was restricted to settlement based
    on DLT that matched cash or securities trades only to enable applicability assessment
    of DLT and rapid prototyping. Banks interest rate payment capabilities were built
    in BLOCKBASTER project. Market making, bond pricing and LSM settlement capabilities
    were not in scope for BLOCKBASTER project.


    ### Project SALT


    Project SALT was started in September 2016 by The Banco Central do Brazil with
    the motive to explore DLT use cases for central banks. Four use cases were identified
    to select one of them to implement. The system identified was the Alternative
    System for Transaction Settlement (SALT) as standby system for Brazil''s RTGS
    system based on multiple DLT platforms. First phase of project SALT was to implement
    proof of concept on an Ethereum fork system in sixty days startedin September
    2016 \[[67](#9789815051452-C2.html#r67)\]. In Phase II of SALT, it was implemented
    on Quorum and Fabric in a period of forty five days started in January 2017 \[[67](#9789815051452-C2.html#r67)\].
    In addition to this, tokenized Brazilian Real (BRL) central bank digital currency
    asset was implemented by Project SALT.


    ### Project UBIN

