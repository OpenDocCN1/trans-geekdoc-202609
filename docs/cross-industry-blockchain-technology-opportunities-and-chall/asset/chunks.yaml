- raw: "The invention of technology led to a period of important revolutionary reforms.\
    \ The present era is continuously shifting towards the technology and the environment\
    \ both. The information systems (IT) environment should therefore adopt research\
    \ and application strategies to deal with future changes regardless of the circumstances\
    \ and pace of the transformation. The latest IT developments can be summed up\
    \ as large flows, such as blockchain, machine learning, and Big Data. Blockchain\
    \ is a processing system for data exchange that distributes and preserves all\
    \ data handled by network active participants. Blockchain, Cryptocurrency and\
    \ Big Data are three major areas of the digital world-disrupting, intense passion,\
    \ and challenging business strategies and activities around the planet. Since\
    \ its introduction, the advent of Big Data has created various challenges and\
    \ opportunities, by turning data into a quality source.\n\nMoreover, blockchain\
    \ technology itself is being examined as a possible basis for making business\
    \ processes more profitable and efficient. The blockchain is tech-\n\nnically\
    \ a public distributed ledger that contains all the transactions performed in\
    \ the program. This is available on a P2P network, where a copy of the blockchain\
    \ ledger is stored on every complete node. No central authority is responsible\
    \ for managing the blockchain database. This concept of getting a database only\
    \ between the system's actual and equal users sets the strategy for creating the\
    \ so-called: “decentralized loyalty” \\[[1](#9789815051452-C3.html#r1)\\]. Blockchain\
    \ has the features of decentralization, non-tamper ability and fully programmable\
    \ that can definitely deal with the security problems of Big Data storage, in\
    \ particular for the safety of personal information that has a huge amount of\
    \ secret information, and must be controlled and supported by government and large\
    \ corporations \\[[2](#9789815051452-C3.html#r2)^(\\-)[4](#9789815051452-C3.html#r4)\\\
    ]. The blockchain consists of many data blocks connected together in the sequence\
    \ of incubation period, and the block size can be created by the consensus protocol\
    \ of each node, and protection is guaranteed by the encryption technology. If\
    \ a node tries to mess with a block, it is difficult to imagine the block to the\
    \ entire network through the consensus process \\[[5](#9789815051452-C3.html#r5)\\\
    ]. The operating history of each block can be traced by Markel tree and time stamp\
    \ \\[[6](#9789815051452-C3.html#r6)\\].\n\n## CATEGORIES OF BLOCKCHAIN\n\nBlockchains\
    \ are categorized into three types by methods of entry, namely, Public Blockchain,\
    \ Private Blockchain and Blockchain Consortium \\[[7](#9789815051452-C3.html#r7),\
    \ [9](#9789815051452-C3.html#r9)\\]. The Public Blockchain is the blockchain that\
    \ is the first and perhaps most extensively used. Bitcoin is a community blockchain\
    \ agent. The characteristics are decentralization and not being governed or regulated\
    \ by any organization. Anyone can access the Public Blockchain \\[[8](#9789815051452-C3.html#r8)\\\
    ].\n\nThe Private Blockchain is a framework not available to the outside community\
    \ and is only used by the organization \\[[10](#9789815051452-C3.html#r10)\\].\
    \ The Blockchain Consortium is between the Private Blockchain and the Public Blockchain\
    \ and is normally used in areas where multiple users work, such as businesses,\
    \ states, and banks at the same time \\[[11](#9789815051452-C3.html#r11)\\]. Fig.\
    \ ([**1**](#9789815051452-C3.html#f1)) includes the different categories of blockchain.\
    \ Table **1** gives a description of public, private and federated blockchains\
    \ in terms of access permission, transaction speed, performance, protection, immutability,\
    \ consensus mechanism, network and asset.\n\n### Generation of Blockchain\n\n\
    While, blockchain has already seen three generations, but that does not mean any\
    \ subsequent generation was more popular than the previous generation. Interestingly,\
    \ in the highly overlapped space, all three generations continue to develop and\
    \ build their own place in the industry and are attempting to emerge as winners.\
    \ Different factors can decide, which generation has the best possible opportunity.\
    \ The three generations of block chain are discussed in Fig. ([**2**](#9789815051452-C3.html#f2)).\n\
    \n![](Images/9789815051452-C3-F1.jpg)**Fig. (1))**  \n\nDifferent Categories of\
    \ blockchain \\[[9](#9789815051452-C3.html#r9)\\]. ![](Images/9789815051452-C3-F2.jpg)**Fig.\
    \ (2))**  \n\nGeneration of blockchain \n\n#### Blockchain 1.0\n\nEach transaction\
    \ is stored in the distributed ledger form in this process, so that it is open\
    \ to any member in the distributed network. Bitcoin is the first digital decentralized\
    \ currency, and a blockchain 1.0 technology. The fundamental technologies of Bitcoin\
    \ are mining, cryptography, and the crowd ledger. A miner is an individual in\
    \ this century who inquires block by figuring out the mathematical problem and\
    \ gets a 12.5-Bitcoin as a reward for block verification. Security of own identity,\
    \ money control, quick and automatic transaction are the characteristics of blockchain\
    \ 1.0.\n\n#### Blockchain 2.0\n\nThe Blockchain technology of the second generation\
    \ (Blockchain 2.0) is the digital economy. While the concept of a digital economy\
    \ was implemented 20 years ago, the focus is on gaining from the digital economy\
    \ for its complete implementation. A smart contract is a series of guidelines\
    \ between two entities for building the digital contract. Ethereum is the one\
    \ smart contracting network running on \\[[12](#9789815051452-C3.html#r12)\\].\n\
    \n#### Blockchain 3.0\n\nTo the interest of two generations of blockchain, they\
    \ contribute primarily to the sectors of manufacturing, commerce, and finance.\
    \ Systems including healthcare, medical records \\[[12](#9789815051452-C3.html#r12)\\\
    ] resource management, supply chain, authentication, smart city, electricity industry\
    \ and system management are now a blockchain 3.0 organization.\n\n### Significance\
    \ of Blockchain Technology and Decentralization and its Effect\n\n#### Security\n\
    \nThe digital world is filled with hackers, searching for outlets to breach details\
    \ or steal data. The files contained in blockchain technology have robust protection\
    \ that makes it impossible for one to hack.\n\n#### Transparency\n\nSince, everything\
    \ is shown on the network, there are very less chances that any difference may\
    \ be produced.\n\n#### Inexpensive\n\nMost of the conventional financial structures\
    \ available in the market are costly, but blockchain is cheaper.\n\n#### Transaction\
    \ Time\n\nA person can send and receive activities and valuable documents within\
    \ a few minutes that minimizes the pressure of waiting for hours.\n\n#### Financial\
    \ Efficiency\n\nDecentralized blockchain allows one to make individual transaction\
    \ without a third party intervention, unlike conventional banks that consumed\
    \ lot of time for making transactions.\n\n#### Protect Business from Frauds\n\n\
    The blockchain is open-source ledgers that is why it is very easy to determine\
    \ how fraud has occurred, because all transactions are registered on them.\n\n\
    ### Applications of Blockchain Technology\n\nFrom the past few years, blockchain\
    \ is used in different areas and it shows a better result. Some of the applications\
    \ in which blockchain technology is used are as follows-.\n\n#### Health Care"
