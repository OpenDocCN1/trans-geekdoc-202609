    # Distributed Ledger Technology and its Potential Applications – Financial Sector


    **Sachin Sharma**^([1](#9789815051452-C2.html#aff1), [\*](#9789815051452-C2.html#cor1))****,**
    **Kamal Kumar**^([2](#9789815051452-C2.html#aff2))**


    ¹ Computer Science and Engineering, Maharishi Markandeshwar (Deemed to be) University,
    Mullana, Ambala, India


    ² Computer Science and Engineering, National Institute of Technology Uttarakhand,
    Srinagar, Garhwal, India


    ## Abstract


    The concept of blockchain has shown tremendous potential and growth in the last
    decade. The terms such as blockchain and digital ledger technology are used interchangeably.
    Many research efforts have been madto explain and harness the benefits of digital
    ledger technology for the financial sector. Digital currency or cryptocurrency
    is a technological currency based on the block chain concept.


    **Keywords:** `Bitcoin`, `Blockchain`, `Digital Currencies`, `Digital Ledger Technology`,
    `Financial Inclusion`, `Financial Sector`, `Smart Contracts`.


    * * *


    ^(\*) **Corresponding author `Sachin Sharma`:** Computer Science and Engineering,
    Maharishi Markandeshwar (Deemed to be) University, Mullana, Ambala, India; E-mail:
    [`er.sachinsharma@gmail.com`](mailto:er.sachinsharma@gmail.com)


    ## INTRODUCTION


    DLT utilizes existing peer-to-peer technologies such as the internet telephony,
    emails, file sharing and the internet. A benchmark paper written by an anonymous
    person “Satoshi Nakamoto” in 2008, “Bitcoin: A Peer-to-Peer Electronic Cash System”,
    presented a unique methodology of funds transfer using the P2P technique named
    “Bitcoin”. The technology described in Nakamoto’s paper was referred to as Blockchain,
    which explains a novel way of storing and organizing information and transactions.
    Other forms of information transfer and transaction technologies were devised
    and the term “Distributed Ledger Technology” was invented. DLT records and shares
    data across ledgers (multiple data stores), each controlled and managed by distributing
    computing devices and having the same replica of data records. These computing
    devices are referred to as nodes. DTL can be understood as a distributed database
    that possesses unique properties. Blockchain is a special type of DLT that utilises
    algorithms and cryptography techniques to generate and validate append-only growing
    data structures. The data structure acts as a ledger in the form of transaction
    blocks (chain), is referred to as a blockchain. One of the nodes create a new
    data block, which contains the multiple transaction records.


    One of the nodes initiates database addition, which in turn generates a new data
    “block” having multiple records of the transactions. This new block information
    (in encrypted format) is distributed across the network to maintain data privacy.
    This block validity is determined by every network participant using a consensus
    mechanism (algorithmic validation method). Post validation, a new block is added
    to the respective ledgers of all participants. Using this method, each change
    to the ledger leads to a ledger replication across the entire network and the
    entire identical ledger is available to each network member at any point of the
    time. This technique can be utilized for any digital transaction record. See Fig.
    [(**1**)](#9789815051452-C2.html#f1) (“Dubai Aims to Be A City Built on Blockchain”.
    By Nikhil Lokhade, 24 Apr 2017, Wall Street Journal [`https://www.wsj.com/articles/dubai-aims-to-be-a-city-built-on-blockchain-1493086080`](https://www.wsj.com/articles/dubai-aims-to-be-a-city-built-on-blockchain-1493086080)).


    ![](Images/9789815051452-C2-F1.jpg)**Fig. (1))**


    Working of Blockchain based DTL.


    1\. DLT systems based on blockchain constitute an append-only data blocks chain.
    One of the nodes initiates new additions to the database and creates a new data
    block with multiple records of transactions.


    2\. Information is shared across the network about the new data blocks. The transaction
    details contain encrypted data.


    3\. All network participants use a “consensus mechanism” to determine the block’s
    validity. Post validation, each participant adds a new data block to their respective
    ledger so that a full identical copy of the entire ledger is being replicated
    across the entire network.


    Two characteristics of a DLT-based solution are:


    1. It eliminates the need for centralized record keeping, storing, recording and
    distributing digital information across the self-managed counterparties.


    2. It also eliminates double-spend which means the same token cannot be distributed
    to multiple counterparties.


