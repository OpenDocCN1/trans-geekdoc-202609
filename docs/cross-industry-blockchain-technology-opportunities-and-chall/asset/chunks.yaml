  trans: '


    虽然直接将 BCT 采用于 IoT 并非易事，因为它涵盖了诸如高资源需求、长延迟和低可扩展性等各种挑战。此外，考虑到 Gartner 进行的研究，2018
    年 IoT 安全支出达到 15 亿美元，到 2022 年，一半的 IoT 安全预算用于故障修复、召回和安全故障，而非保护。因此，如果实现 `secure by
    design` 系统，IoT 将经历其发展的指数级增长。BC 的需求源于 IoT 面临的关键挑战在于其分布式架构，这可能导致各种问题，如安全性、通过 `via`
    网络攻击的利用、快速崩溃、中央云服务提供商管理不善、机密性和身份验证、保持数据完整性等。除此之外，另一个例子加强了 BCT 与 IoT 融合的观点，Big
    chain DB 是将区块链与大数据相结合的一个例子 \[32\]。将区块链与人工智能（AI）结合使用将通过其对数据的操作减少计算过载 \[19\]。IoT
    是使用各种技术将日常设备相互连接。IoT 可以简单到我们的车一进入车库就打开咖啡机，也可以复杂到监控医疗保健中人体的生命体征并提供这些信息以供进一步分析。公司正在为工业应用投资数十亿美元用于工业物联网并解决其问题
    \[33\]。由于 IoT 应用的增加及其实时监控数据的能力，它容易受到连接到我们存储数据的云上的设备的攻击和安全问题。我们的设备信号在公共场所运行，这使它们暴露于黑客，黑客可以轻易损坏设备或控制正在发送的数据。此外，它已经容易受到网络层攻击，如
    DoS、非法访问网络、中间人攻击，这个列表还在继续。在存储方面，我们可能会遇到与非法访问数据、存储恶意软件或被篡改的数据，有时甚至数据丢失相关的威胁 \[34\]。此外，BCT
    已证明它是不可更改的、分布式的，并且对大多数涉及欺诈的攻击具有免疫力，主要是 `double spending` 和 `record hacking`。要解释被称为
    `Double spending` 的术语，它是指一方使用同一资金池购买多个资产，因为处理付款时存在一些延迟。区块链要求矿工在确认任何交易之前解决 PoW，这需要一些时间。这为付款处理提供了时间，从而轻松解决了问题。BCT
    的去中心化方法保护存储的数据免受黑客攻击 \[35\]。DDoS 攻击正在使用去中心化方法进行处理，Gladius 项目的方法专注于阻止 DDoS 攻击 \[36\]。IoT
    网络涉及分布在大面积上的大量传感器以全面监控它。我们不使用点对点连接，因为它无法帮助模块化、去中心化并降低网络的可扩展性。IoT 网络由控制器和执行器节点组成，这有助于使系统自动化。IoT
    网络产生大量数据，这导致一些延迟并使网络难以管理。将区块链与自适应控制算法结合使用，可以解决许多这些问题。自适应控制算法分析队列，并通过进行适当更改不允许队列饱和。区块链增强安全性并存储
    `HashMap`，这有助于在数据库中快速搜索，从而提高 IoT 网络的效率。以分布式、去中心化和防篡改的方式创建/存储/转移数字资产的能力对 IoT 系统具有巨大的实际价值。性能分析清楚地表明，延迟是该地区的主导因素
    \[37\]。


    与此同时，IoT 和 BCT 融合的不断增强，这两个概念在同一个伞下已经作为低功耗损耗网络（LLNs）的主要标准迈出了巨大的一步，这些网络资源受限。这种融合的未来意义非常明显，因为它不仅对商业方面有用，而且在社区服务中也具有重要意义
    \[38\]。理解 IoT 面临的传统问题，可以将其列为 ‘`Resource Consumption, Centralization, Lack of Privacy,
    Not Scalable, Mutable, etc.`’，这些问题使 BCT 成为 IoT 缺陷的救星 \[39\]。


    因此，将 BCT 与 IoT 集成的主要目标就是让所有这些挑战消失或减少到非常微不足道的程度。不应将 BC 与比特币或更广泛地说与加密货币混淆，因为它只是
    BCT 的一个应用或杠杆。简单地说，BC 只是一个基于共识规则的分布式数据库系统，允许实体之间转移价值。BC 是唯一同时享有三个属性的实体：


    1. `Trust-less` 意味着不需要拥有经过认证的数字身份，双方不需要了解彼此，但仍可以交换数据。


    2. `Permission-less` 意味着没有人有权操作 BC 网络，因此没有权限，没有控制者。


    3. `Censorship resistant` 意味着任何人都可以使用和在 BC 上进行谈判 \[40\]。


    可以得出结论，IoT 生态系统有许多漏洞。BCT 作为拯救者出现，从而为许多未来的发展和研究铺平了道路。即使在非常具体的领域，如智慧能源、智能制造、数据隐私等，也可以进行大量的研究。随着
    IoT 设备的普及和数据产量的增加，尝试开始货币化数据，催生了机器经济。BC 可以简化谈判过程，消除对可信中介的需求。


    倡导同样的观念，IoT 和 BCT 的进步和日益受到关注，这种融合是不可避免的。人们总是期望 BCT 将彻底改变 IoT，而采用法规是将 BCT 和 IoT
    作为政府基础设施一部分的关键。


    ## BCT 和 IoT 用于医疗保健的集成


    医疗保健是注定会以如此指数级速度增长的行业，在未来，它将成为最负盛名的行业。整个行业将要发生的革命，无疑注定会为那些致力于将上帝的计划变为现实的研究人员和爱好者带来荣誉。


    '
