    ## Communication Architecture of VANET


    VANETs are a victim of frequent disconnections in the dynamic vehicular scenario
    where the unpredictable movement of the vehicles causes hindrance in the stability
    mechanism of the network. Once the network is established, the information can
    be disseminated and shared through data packets. Since the vehicles are mobile
    in nature so connection maintenance is a tough task for moving vehicles where
    the neighbour nodes can also transcend the transmission range. As a solution to
    which access points in terms of relay nodes can be pre-deployed to maintain the
    connectivity of the network \[[9](#9789815051452-C6.html#r9)\]. The vehicles are
    equipped with the Global Positioning system (GPS) by virtue of which a vehicle
    can monitor the network and the nodes that will greatly be useful for collision
    avoidance and to attain information of location. The communication architecture
    is shown in Fig. [(**3**)](#9789815051452-C6.html#f3).


    Every vehicular node is required to fully process the raw information for the
    purpose of which, it directly needs a handsome storage capacity. So, it uses rechargeable
    batteries to generate the power continuously hence making the network more efficient
    in terms of power and energy. Table [**2**](#9789815051452-C6.html#t2) represents
    communication architecture.


    ## Table 2 Communication architecture representation


    | Communication | Functions |

    | --- | --- |

    | In- Vehicle communication | • Vehicle performance detection<br>• Drivers physical
    condition<br>• Vehicle’s inside environment for safety purpose |

