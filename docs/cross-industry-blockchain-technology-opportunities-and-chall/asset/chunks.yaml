    # The monetary policies of an economy are controlled by the central bank


    The monetary policies of an economy are controlled by the central bank. A central
    bank controls the relevant economic management tools of an economy. The central
    bank''s duty is to control money supply in an economy and deployment of monetary
    policies including interest rates management, keeping price stable for essential
    commodities \[[1](#9789815051452-C2.html#r1)\]. Central banks have monopoly on
    the currency issuance for a given economy \[[2](#9789815051452-C2.html#r2)\].
    The emergence of Bitcoin in 2009 \[[3](#9789815051452-C2.html#r3)\] motivated
    the concept of an alternative currency mode as a digital currency or crypto currency.
    This new form of alternative currency can be managed by private sector players
    or individual. Post bitcoin invention, private sector organizations or individuals
    have issued more than five thousand crypto currencies \[[4](#9789815051452-C2.html#r4)\]
    in the last decade. The common attribute of these currencies is that they are
    based on digital ledger technology and are not controlled by any tangible resource.
    The currencies included Bitcoin \[[3](#9789815051452-C2.html#r3)\], Stellar \[[5](#9789815051452-C2.html#r5)\],
    Ripple \[[6](#9789815051452-C2.html#r6)\], Ethereum \[[7](#9789815051452-C2.html#r7)\],
    Tether \[[8](#9789815051452-C2.html#r8)\] and others.


    The strict regulations and law of land requirements for the financial market are
    creating challenges for decentralized digital currencies. Keeping this in view
    of the growth and opportunities in digital currencies, central banks are investing
    in the research and development of digital currencies backed by central banks
    and governments to preserve monetary policy and financial market stability \[[9](#9789815051452-C2.html#r9),
    [10](#9789815051452-C2.html#r10)\]. The Bank for International Settlements (BIS)
    conducted a recent survey \[[11](#9789815051452-C2.html#r11)\] to analyse efforts
    by central banks on central bank digital currency research projects. The majority
    of central banks (>70%) replied that they were investing in the possibility of
    issuing a central bank digital currency (CBDC). This survey covers diverse geographies
    in the different jurisdictions with reachability of more than 70% of the world''s
    population \[[11](#9789815051452-C2.html#r11)\]. 35% of the participants were
    from developed economies and 65% of the survey participants were from developing
    economies. The level of central bank digital currency organizations are classified
    as a) Early Adopters, b) followers and c) new entrants.


    ## Early Adopters


    The early adopters are the organizations, which started investing in the technology
    during 2015-2016. The Bank of England published its “One Bank Research Agenda”
    \[[12](#9789815051452-C2.html#r12)\] in 2015. The Bank of England collaborated
    with University College London in 2016 for its RS Coin CBDC \[[13](#9789815051452-C2.html#r13)\]
    framework development. China''s central bank, “The People''s Bank of China (PBoC)”
    started its CBDC journey in 2016 to get control of monetary supply in China and
    to optimize efficiency of the payment system \[[14](#9789815051452-C2.html#r14),
    [15](#9789815051452-C2.html#r15)\]. The Bank of Canada started investment in CBDC
    in 2016 with R3 Project Jasper and Payments Canada \[[16](#9789815051452-C2.html#r16)\]
    and then started analyzing DLT for payment transformation in the country. Germany''s
    central bank “Deutsche Bundesbank” started project “BLOCKBUSTER” in early 2016
    to utilize digital ledger for interbank settlements in Germany \[[17](#9789815051452-C2.html#r17)\].
    The Bank of France initiated the project “MADRE” in mid-June 2016 for digital
    currencies. Project “SALT” was started by Banco Central for Brazil in September
    2016 \[[18](#9789815051452-C2.html#r18)\]. The United States Federal Reserve published
    its first Central Bank Digital Currency report in September 2016 \[[19](#9789815051452-C2.html#r19)\].
    In November 2016, the Ubin project was started by Singapore''s central bank and
    financial regulatory. The Bank of Japan and European Central Bank started the
    project Stalla in December 2016 \[[14](#9789815051452-C2.html#r14)\].


    ## Followers


    The organizations which started investing on digital ledger technology during
    2017-2018 are classified as followers. Digital currency project LionRock was initiated
