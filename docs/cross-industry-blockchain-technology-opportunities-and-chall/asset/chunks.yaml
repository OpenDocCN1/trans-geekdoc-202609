    up with its destined vehicle. |


    ## Blockchain meets VANET


    Several studies are conducted for resolving the security issues of VANET, for
    which blockchain technology is widely used. VANET is used in combination with
    blockchain \[[10](#9789815051452-C6.html#r10)\]. Blockchain technology is used
    to ensure that data are tamper-resistant and secure. In some of the algorithms,
    the registration of the vehicles is mandatory with Registration Authority. The
    road infrastructure with vehicles and RSU make a blockchain network that reduces
    security issues. The data generated from the vehicular networks are saved in the
    cloud for providing data support related applications \[[11](#9789815051452-C6.html#r11)\].
    Blockchain also introduces the concept of privacy protection for intelligent transportation
    systems. Fig. [(**4**)](#9789815051452-C6.html#f4) represents the Blockchain system.


    ![](Images/9789815051452-C6-F4.jpg)


    **Fig. (4))**


    Blockchain System


    A Blockchain system uses a kind of distributed network that consists of various
    independent nodes and they generally do not have a trust-based network \[[12](#9789815051452-C6.html#r12)\].
    Every node takes part in data management. In the implementation, a new block is
    formed by the participation of various nodes and that new block is included in
    the blockchain system. All nodes in the system manage the information that ensures
    the security of data in the blockchain system. The blockchain can manage the information
    in vehicles as any node can access the previous history while using the public
    blockchain. In the majority of blockchain based algorithms, a new block is generally
    shared with all the vehicular nodes. But in some of the cases, the blocks are
    not shared outside the boundaries of countries as some countries may not be connected
    directly with roads so the information of a vehicle in one country may not be
    suitable for the vehicle in another country. The algorithm can be designed on
    the basis of various parameters. The blockchain network is made on the agreement
    of vehicular nodes present in the network \[[13](#9789815051452-C6.html#r13)\].
    The clusters formed in VANET \[[14](#9789815051452-C6.html#r14)\] are sometimes
    useful in blockchain systems as the cluster heads are accountable for managing
    the blockchain system. So, clustering in VANET \[[15](#9789815051452-C6.html#r15)\]
    enhances the security of the network by using the blockchain system.


    ## Trust based Models in VANET for Blockchain Technology


    There exist three types of models that are trust based.


    * Entity-based Trust Model

    * Data Centric Trust Model

    * Hybrid based Model


    Fig. [(**5**)](#9789815051452-C6.html#f5) represents the trust based models in
    VANET \[[16](#9789815051452-C6.html#r16)\]. The opinion of the other nodes matters
    in the entity based model as here trustworthiness of the nodes is required by
    using any specified algorithm. But the limitation is the high mobility of the
    vehicular nodes, as passing of the information is difficult in dynamic topology
    \[[17](#9789815051452-C6.html#r17), [18](#9789815051452-C6.html#r18)\] and high
    mobility. However, the data centric model focuses on the event information shared
    by the nodes instead of the node details in the entity based as it is important
    to share accurate information between the vehicular nodes \[[19](#9789815051452-C6.html#r19),
    [20](#9789815051452-C6.html#r20)\]. Whereas, the hybrid approach uses the combination
    of the entity based and data centric model. So here the importance is given to
    both the trustworthiness of the vehicle and event information.


    ![](Images/9789815051452-C6-F5.jpg)


    **Fig. (5))**


    Trust Based Models


    ## CONCLUSION

