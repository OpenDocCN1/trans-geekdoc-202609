    # 第 2 章


    ## 作为入门的 XSS 研究（站点间脚本攻击）


    植入网站和 Web 应用程序的有害 XSS 变体会破坏系统运行，使黑客能够获取数据，并影响终端用户系统的运行方式。在此过程中，使用不洁净或被拒绝的 `Signals`
    可能会影响结果。


    某些缓冲区溢出攻击并不使用单一命令来强调其重要性；而是利用网站程序中的中的漏洞。任何进入该系统的网页在整个处理过程中都必须经过评估并确保被正确使用。相比之下，这种方法几乎总是能够正确且按顺序地传输数据，这对于发送在线消息等情况至关重要。系统漏洞可能会使社交媒体应用程序和页面开发成为向不知情的客户端
    Web 浏览器传播恶意邮件的渠道。


    用 Visual Studio、`Swf`、`Ole` 和 `JavaScript` 等许多其他语言编写的代码可能会受到网络攻击的威胁。由于它们经常与许多此类客户端交互，XSS
    经常针对 `JavaScript`。XSS 攻击既危险又常见，因为它们可以利用经常被使用的系统。


    ## 如何使用跨站脚本


    我们现在已经知道由过去的编程带来的这种威胁是什么了；然而，为了完全理解它，我们必须检查它是如何工作的。


    考虑一个人坐着使用笔记本电脑的情况。在屏幕的右下角，有文件资源管理器、文字处理器、计算器和音频播放程序的图标。到目前为止，一切都符合预期。然而，这幅画面缺少一个重要组件：一个同时打开了许多页面的
    浏览器。这些部分提供了令人兴奋的新闻、幽默视频、实物产品的广告、在线商店的链接，以及一个已经处理了交通违规罚款还的交易网站。


    这些网页都有一个共同点：如果没有 `JavaScript`，它们就无法存在。客户点击两个广告海报中的任何一个，将被重定向到另一个域名。该网站上的一个恶意软件会连接到移动游戏系统，并从受害者的计算机中将资金发送到他们的
    `MasterCard` 上。延续这个类比，他们并不认为这是一个明智的决定。这项策略禁止网页脚本访问隐私数据。浏览器将无法运行从另一个域名加载的脚本。


    ## 与病毒相关的网站感染


    随着我们系统的改进，来自许多相关类型的 `JavaScript` 可能会导致这个问题。用于读取的同类数据和系统工作也受到了相同限制的阻碍。即使托管浏览页面的网站现在也不在黑客的控制下。现在，奇怪的是，即使他们无法直接访问，他们是如何获得访问权限的；这很棘手，需要进一步调查。让我们检查这一切是如何运作的，是什么让黑客能够向互联网内容中插入潜在危险的软件片段，这可以帮助攻击者并增加风险。


    例如，一些常见的搜索引擎在用户输入搜索查询时会复制用户的输入。


