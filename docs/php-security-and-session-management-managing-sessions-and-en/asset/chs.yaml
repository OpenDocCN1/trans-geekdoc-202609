  \n以下安全风险是 XSRF 和 CSRF。\n\n一种非常知名且高效的安全系统是 XSRF 或 CSRF。Web 应用程序可以使用网络托管应用程序攻击来操控计算机连接到合法\
  \ Web 应用程序的成功率。\n\n当 Web 服务每次访问页面传输特定类型的生成意义时，可能会发生各种漏洞。这种利用用户预先批准连接的攻击被称为身份冲浪（identity\
  \ surfing）或简单的的一键利用。\n\n虽然登录表单确认是必要的。系统接受客户端的标识并提供身份验证卡作为响应。此服务是薄弱的，因为它使用可靠且经常使用的数据库来验证任何查询。\n\
  \n访问者访问发生欺诈的假网站。`WW.webhack.attacking` 是一个恶意网站。\n\n用户已选择提交选项。每当计算机建立连接时，请求的标识符会立即激活。请求在服务器上使用患者的标识上下文运行，并能够执行合法用户能够执行的任何操作。恶意网页可以：\n\
  - 运行计算机代码以无限处理，除了点击发布按钮。\n- 作为 Java Applet 的响应发送数据洞察。\n- 使用 CSS 隐藏该框体。\n\n当目标是 Make\
  \ 目的地时，可以使用图像标签执行攻击。这种攻击在允许图像但不允许 JavaScript 的网站上很常见。响应 `GET` 请求修改资源的应用程序是容易受到攻击的。\n\
  \n```php\n$users = MySQL(\"SELECT * FROM users WHERE id='$id'\");\n```\n\n下一章将进一步详细讨论此主题并提供深入的知识。PHP\
  \ 安全建议：在创建 PHP 在线应用程序时，Web 开发者应该考虑安全预防措施。不安全的在线应用程序是黑客想要窃信用卡和借记卡号等敏感信息的首要目标。从这个角度来看，数据泄露可能对个人的操作产生特殊影响并实施十最有效的安全措施。定期更新您的\
  \ PHP 版本。由于安全更新经常包含在后续版本中，因此维护更新的 PHP 版本是关重要的。旧的 PHP 版本具有已知的黑客可以利用的安全漏洞。除非升级到某些最新配置，否则您的计算机将会崩溃。还有一个\
  \ PHP Beta 版本供测试。最新版本是 `8.0.0`。另一方面，安全专业人员警告不要预览版本，因为安全问题可能存在。\n\n#### PHP 会话管理\
