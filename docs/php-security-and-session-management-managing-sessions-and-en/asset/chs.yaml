- "# PHP 安全与会话管理：管理会话并确保 PHP 安全（2022 初学者指南）\n\n\n\n\n\n## PHP 安全概述\n互联网是现代世界的重要组成部分，所有关于跨国公司产品的信息都可以在网上找到。在书中，我们将讨论我们的数据是如何不安全的，以及互联网上的敏感数据是多么脆弱。攻击者是谁？他们又意图如何获取我们的隐私信息？\n\
  \n书中将揭示多次安全泄露事件，以及为了保护我们的数据所付出的努力以及仍需付出的努力。书的重点是讨论数据获取的众多风险、PHP 安全在这一领域的作用，以及 PHP\
  \ 安全为解决这些问题所采取的关键步骤。第一章将涵盖对数据安全最典型的危险，以及防御这些危险的最基本方法。这里的核心问题是：它们安全吗？采取了哪些特定的安全相关步骤？\n\
  \n针对网站和电子邮件账户的攻击可能性正在增加。钓鱼攻击的增加也是如此，这是一种误导网络用户向犯罪分子提供其个人信息的骗局。这是通过创建伪造文件（如银行或信用卡账单）来实现的，这些文件似乎来自可靠的来源。它们通过电子邮件发送，试图看起来像是来自真实的发件者。\n\
  \n来自政府组织的链接以及来自他人垃圾邮件列表的垃圾/干扰邮件就是这些例子。当你收到来自这些人中某人的电子邮件或短信时，并不是那个人在向你发送信息；而是那个计算机病毒文件在黑客入侵你的系统，并获取了你甚至没有察觉其存在的敏感信息或文件后，将所有这些信息上传到了网络中。这些事实证明了我们的大数据——以及更关键的是，我们的专业数据——是缺乏安全性的。然而，让我们检查一下我们在社交媒体上发布的数据的安全性吧。这是一个真正令人困惑的问题。\n\
  \n由于我们共享的信息经常可以被第三方访问，他们甚至可能对其进行修改，这让你觉得你的网站页面隐藏了某些不雅或有害的内容。你暴露给任何对你的隐私信息拥有不受限制访问权限的人，无论那个人在多大程度上出于任何目的利用这些文件，因为你的电子邮件地址和所有相关信息都保存在这些文件中。我们在这里将看到攻击我们数据的主要类攻击者。我们的整个互联网基础设施是不安全的，而我们是否曾经注意到是谁在偷取我们的敏感数据呢？\n\
  \n工作在不同层面的许多人都可以访问我们的数据。“恶意 URL”攻击是最常见的攻击者类型。它表示目标用户在点击一个不受欢迎的链接后到达了恶意网站。因此，如果黑客给你发一封邮件，要求你点击某个链接，他的意图是窃取你的登录信息、为你提供一个弱密码，并将你的信息发送到他的计算机和密码恢复软件中。\n\
  \n随后，他将更改你的密码，并给你发送另一封邮件，建议你访问他夺走所有内容的网站。他们是如何获取我们的信息的是脑海中浮出的下一个想法。\n\n利用社会工程是窃取数据和你的身份的常用方法。一个很好的例子是向你在网上认识的人或熟悉你的人要钱。当你选择订购你喜欢的运动队时，这通常是获取你的社会安全号码或任何你愿意承担风险的信息的最简单的方法。\n\
  \n由于大多数潜在受害者几乎或完全没有计算机技能，社会工程学是有效的。大多数缺乏基础计算机素养的人并不非常担心被骗点击钓鱼链接。正因如此，对于攻击者来说赢得大量目标是挑战性的，因为他们必须让受害者感到足够不安，以防止他们失去对他人的信任。\n\
  \n# 第 1 章\n\n\n\n\n\n## XSS 尝试\n\n一种被称为 XSS 的攻击是由仅存在于客户端的远程应用程序引起的。攻击者正试图在网页应用程序中激活破坏性的\
  \ JavaScript。由程序或在线应用程序引入的计算机病毒会攻击原始网页。\n\n用户访问一个嵌入了病毒的网站或表面程序，该病毒最终会搜寻用户的数据。这些数据可能会被传输到计算机并导致严重问题。网站或在线应用程序可以在用户的计算机上安装恶意软件。使用密码脚本的攻击经常针对网站，并投送具有共同上下文的消息。\n\
  \n如果一个新网站或 Web 应用程序生成了使用经过清理输入验证的内容，它可能受到跨站脚本攻击的威胁。这些动态材料随后必须由服务器进行解析。例如，在 Visual\
  \ Studio code、`Ajax`、`Swf` 甚至 `Xhtml` 中都可以发现 XSS 漏洞。由于 `JavaScript` 对于大多数网络交互是必不可少的，可以认为此类漏洞在\
  \ `JavaScript` 中最为常见。如果发生了跨站脚本攻击，除了用户之外，还有谁该负此责任呢？\n\n因此，即使攻击者使用不安全的 Web 服务器或安全性薄弱的网站，其用户仍然面临风险。攻击者可能利用网站上的此漏洞在\
  \ Web 设备上运行 `PHP`。跨站脚本和其他安全威胁并不是用户的错。如果它影响了你的用户，也会影响到你。与其服务客户的需求，不如间接编程被用于破坏网站。\n\
  \n黑客可以使用受感染的脚本来更改网页的结构，甚至将用户重定向到带有恶意软件污染的风险网站。随后的后端过程代码可用于在网页上显示大部分之前的语句。\n\n```\n\
  print \"\" print \" \n```\n\n## 最新的评论\n\n```\nprint  database. latest Comment print\
  \ \"\"\n```\n\n# 最新的评论\n\n\n\n\n\n上述应用程序仅在 HTML 文档上显示数据集中的最新帖子。在编写的注释中没有 HTML 标签或其他代码，这被认为是纯文本。由于攻击者可能会通过计算机病毒发送任何正面的信息，因此确实容易受到\
  \ XSS（跨站脚本攻击）的影响。由于其非常有效的无效组合，“XSS”的规避是非常具有挑战性的。使用用户输入的环境和编程框架会影响 XSS 漏洞类型以及预防措施。然而，在创建安全的\
  \ Web 应用程序时，需要考虑几个基本的概念参数。本书的其余章节将涵盖 XSS 以及用于处理它的所有策略、战术和关键任务。\n\n### 劫持会话 (Hijacking\
  \ a session)\n\n会话劫持攻击使用了互联网窗口管理技术，该技术经常应用于公钥。由于 HTML 返回了大量独立的端口扫描，Web 服务需要一种识别每个客户连接的方法。用户身份验证成功后，Web\
  \ 服务为 Web 应用程序提供一个令牌（token）；这是最实用的方法。URL、作为密码的 Web 头部、HTTP 状态标头的各个部分以及 Web Socket\
  \ 内容都是会话 ID（session id）的可能位置。当入侵者向此类受害者发送虚假标识信息时，将采用缓冲区溢出（bridge shooting）策略来提供标识信息。应用程序使用\
  \ Way 向量自动揭示当前事件的数据内容；也可以使用相同的方法创建自定义脚本（Script），并将其信息发送给攻击者。\n\n#### 脚本警告 (document.cookie)\n\
  \n### \n\n劫持攻击是以这种方式运行的；我们将在接下来的章节中详细介绍。\n\n### 注入 (Injection)\n\n注入是最常见且最危险的在线应用程序危害之一，会导致进程失败、数据丢失、备份和恢复丢失以及数据泄取。在大多数情况下，缺乏用户身份验证输入会导致注入漏洞。你可以做些什么来减少这些仇意的攻击呢？毫无疑问，这是一种处理这种情况并对其准确评估的预谋策略。避免\
  \ SQL 注入问题是容易的。或者，程序员必须停止创建产生特殊问题的代码，或者确保用户输入中潜在的危险的 SQL 不会影响运行搜索的逻辑。\n\n常见的受注入攻击包括应用程序服务器、桥接编程、代码注入、软件\
  \ Metasploit、站点签名填充器等。注入漏洞占了 Web 应用程序问题的很大比例。\n\n上述情况清楚表明，我们必须开发防御系统来应对这些威胁。这是你停止这些攻击的唯一真实选择。“开放\
  \ 应用程序安全项目”（OWASP）建议了两种反注入策略。这些方法除了 SQL 编码外，还可以应用于其他程序员。\n\n应使用以下保护技术来确保您的 Web 服务免受注入攻击：\n\
  \n#### 主要挑战：参数化查询-预处理语句 (Parameterized Query-Prepared Remarks)\n\n- 利用白人选择列表中已使用的方法\n\
