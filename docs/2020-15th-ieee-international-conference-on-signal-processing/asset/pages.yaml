    # A. HuSpecNet


    Mapping every conventional CT to dual energy images is not possible due to the
    unknown material information. This missing information can be approximated from
    inferred images (e.g. bones or vessels are recognizable). Random of of missing
    information - for instance, using a GAN [10] - therefore not required. Furthermore,
    spectral images are acquired from a single scan. Paired Hu and mono images are
    allowing for simpler approaches in unpaired settings [11].


    We have reported for a deterministic transformation using a 2D-UN [12] convolutional
    network as it can efficiently capture large-scale context (allowing for accurate
    material reconstruction). HuSpecNet took as input HU image in native resolution
    and generated mono54 and 100 keV images. We used a L2 loss on dataset from patients,
    with various physical conditions. Table 1 shows our validation results on 143
