    5 所示，GenSpectral 和 TrueSpectral 获得了非常接近的结果，具有每个子集的位数和平均值。此外，应该注意的是，GenSpectral
    未获得低于 0.9 的 Dice 值，而 TrueSpectral 处有两个 PE 扫描显示出较低的结果。


    ## V. 结论


    我们提出的 Casper 方法成功地将光谱数据引入常规训练数据集，允许针对常规 CT 应用训练更具通用且更有效的网络。然而，该方法考虑了创建从 HU 生成的非对比数据集（VNC），通过某些自动化分割工具可以轻松获取真值（GT）。未来的发展将包括在其他数据集上进行器官分割应用、改进生成的
    VNC 图像以及可能转换到其他光谱模式，例如电子密度或 Z 有效测量值。


