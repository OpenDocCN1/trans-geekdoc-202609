    图 4. 来自单个 HU 患者的数据增强示例。A 到 D 是使用具有不同注射方案的患者的原始常规 HU 图像重建的不同图像。应用了 [600-1680] 窗。


    使用最近邻插值法将其重采样为恒定的 [2, 2, 21] mm 间距。然后将随机选择的块（patches）输入到网络进行训练。


    在推理过程中，将体积数据重采样回原始尺寸，并使用引导图像滤波器 [13] 进行后处理。


    在每个预测结果和真值（GT）上计算了 Sorensen-Dice 系数。使用重复测量方差分析 (ANOVA) 并执行了 Bonferroni 校正的 t 检验，比较了整个测试数据集以及
    PE、CAP、非对比子集上三种训练方法之间的 Dice 系数。当推断出经 Bonferroni 校正的 p 值小于或等于 0.05 时，我们认为存在显著差异。


    关于分割网络方法，在整个数据集以及 PE 和 TNC 子集上，HUonly 与 GenSpectral 以及 TrueSpectral 之间均存在显著差异
    (p < 0.05)，但在 CAP 子集上没有。这是由于训练数据集中存在 CAP 方案扫描，而其中缺少 TNC 和 PE。当使用随机方法将 VNC 添加到训练后的数据集中时：这有助于分割未使用的
    CT 方案上的对比度，因为 PE 图像的结果在 Dice 上超出了预期；然而，光谱增强方法在改进学习数据集后，其性能优于 HUonly。此外，GenSpectral
    和 TrueSpectral 在整个数据集以及 PE、CAP 和 TNC 子集上的 Dice 系数没有发现显著差异 (p > 0.05)，这证实了我们提出的常规数据集增强工作流提供了。


