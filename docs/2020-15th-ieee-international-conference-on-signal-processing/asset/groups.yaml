    # ICSP2020 论文集

    CASPER：基于深度学习 SPCT 图像的传统 CT 数据增强


    Pierre-Jean Lartaud¹, Aymeric Rouchaud¹, Hamid Dessousky², Anna Vlakhmitrou³,
    Jean-Michel Rouet², Olivier Nemment³, Loïc

    ¹ CREATIS UM5820 INSERM, 里昂大学，法国

    ² 飞浦研究中心，Sures，法国

    ³ 里昂医院（Hospices de Lyon），里昂，法国


    邮箱：pierre-jean.lartaud@creats-insa.fr, aymeric.rouchaud@chu-lyon.fr, hamid.dessousky@creats-insa-lyon.fr,
    anna.vlakhmitrou@gmail.com, jean-michael.rouet@philips.com, olivier.nemment@philips.com,
    loic.bussel@chu-lyon.fr, philippic.douc@chu-lyon.fr.


    **摘要—** SPCT 扫描是临床领域的一项新兴技术，允许从单次扫描生成传统图像、虚拟无对比扫描（VNC）以增强传统 CT 图像。据认为，不同 k 值下的非对比扫描可能（在高
    k 值处）有助于（在低 k 值处）碘对比增强研究。它可以用作心血管结构的数据增强，提高对比增强图像上的 Dice 分数，并对非对比（TNC/TNC）扫描进行分割。然而，这尚未得到证实，使得这一数据处理尚未广泛应用。


    为这些图像分割真值（grounds truths）仍然缺乏足够的半自动软件。相反，即使是专家也经常无法捕捉非对比 CT 扫描中的结构。为这些图像创建真值需要逐层进行分割，这在确定一个高质量的训练数据集时可能非常繁琐。因此，对于自动钙质计算，只有少数关于图像心血管结构分割的论文。


    为了克服这一局限性，我们提出了一种数据增强工作流，为传统 CT 训练提供 CT 增强能力。我们使用图像翻译网络（USetNet）在包含 2500 次扫描的不平衡数据集上进行训练，将对比增强图像和
    VNC 人体图像进行映射。随后可以将传统 CT 扫描转换为 SPCT 图像。


    SPCT 数据增强方法面临许多困难 [4–6]。双能扫描仪作为一种新出的医疗程序，允许从单次扫描不仅生成与任何其他 CT 扫描仪类似的传统 HU 图像，还能生成增强的、虚拟无对比和真实的非对比（VNC）图像，其对比剂浓度从低（在高
    k 值处）到高（在低 k 值处）不等。可以在以下增强和虚拟图像上对目标分割。使用这些图像作为数据增强，可以训练一个网络来分割训练集中不存在的 TNC 和 TNC
    协议。


    我们通过在 143 份标注的传统扫描上训练 3D U-Net 来分割主动脉，并在使用和未使用数据增强的情况下评估了我们的方法。在包含 70 名患者的测试集上比较了网络性能。结果显示，使用增强扫描训练的网络性能优于未使用扫描训练的网络，特别是在肺动脉方面。


    **关键词—** 数据增强，SPCT，双能，深度学习，图像翻译，血管分割，分类，非对比 CT


    ## I. 引言


    在过去的十年中，深度学习已成为一种自动器官分割的可行方法，因为所提的网络架构在具有挑战性的血管结构分割中实现了最先进的性能 [1, 2]，这是由于圆内诱导对比剂浓度的变化引起的。事实上，在临床实践中，根据图像的指征和感兴趣的结构使用注射方案。对比剂量以及注射和成像的时机差异很大。常见情况是肺栓塞（PE）诊断，这需要突显肺动脉，因此在注射后完全增强；以及针对肿瘤局部增强需求的胸部-腹部-盆腔（CAS）扫描，且图像采集在注射后开始。这使得为给定器官的分割创建一个具有代表性的训练数据集变得困难，因此，大多数研究集中在
    [1] 上。


    因此，在这项研究中，我们完整提出了一种数据增强工作流，为任何传统 CT 训练数据集提供 CT 增强能力，使用配对图像翻译网络（USetNet）将人体图像的增强扫描和
    VNC 进行映射。为了说明我们的目的，我们从传统 HU 图像数据集训练了一个 3D U-Net 来分割主动脉，并评估了我们提出的增强工作流对网络性能的益处。


    ![](img/48d50055dd4767983291bb704afd7575_1_0.png)


    低能光子被内部探测器吸收，而高能光子穿过内部并被外层捕捉。使用基于投影的分解，低能的衰减表示为材料的衰减贡献，取决于它们的衰减特性 [8]，图像中像素的强度对应于主体中的物质含量，碘图和水图，monoE
    图像的强度可以如下式生成：


    ```

    $monoE_{keV} = \alpha\mu_{I}^{keV} + \beta\mu_{W}^{keV}$

    ```


    其中 $\alpha$ 和 $\beta$ 是碘和水浓度图，单位为 $cm^{-1}$，$\mu_{I}^{keV}$ 和 $\mu_{W}^{keV}$
    是 $keV$ 处的衰减系数 [9]。因此，从两个单能图像或两个材料图，可以反推方程 (1) 以重建任何光谱图像。高能光子被患者吸收的少于低能，因此单能图像的对比度较低，如图
    2 所示。最后，VNC 是缩放到亨斯菲德单位的水图。


    A - monoE 54 keV

    B - HU

    C - monoE 100 keV

    D - VNC


    图 1. 从光谱 CT 重建的图像示例。应用 600-1600 窗。


    本文结构如下：第 2 节详细描述光谱图像的生成。在第 3 节中，我们介绍了数据增强工作流，第 4 节描述了我们在主动脉上的应用结果。


    ## II. 光谱图像重建


    双能 CT 也称为光谱 CT，是一种最近临床可计算机断层技术，允许同时获取两种 X 射线光谱。为了获得两个光谱，使用了不同的技术（双层、快速切换）。在这项研究中，我们使用双层。


    ## III. 光谱增强方法


    如图 2 所示，全局工作流包含两个步骤。首先，我们训练图像翻译网络，将 HU 图像转换为 mono 54 keV 和 mono 100 keV。然后，将传统
    HU 数据集输入网络以生成上述单能图像。使用方程 (1)，对这些 monoEs 进行重建用于数据增强。


    ![](img/48d50055dd4767983291bb704afd7575_1.png)


    步骤 1 – HuSpecNet

    步骤 2 – 数据增强

    图 2. CASPER 工作流。HuSpecNet 在 2500 次扫描上训练。在该方法中，前两行是 HuSpecNet 训练。根据不同目的，光谱图像是混合的。最后一行显示了图的真值。


    ### A. HuSpecNet


    表 I HUSPECNET 统计


    | 类型 | 范围 | 均值 ± 标准差 | 最小值 - 最大值 |

    | --- | --- | --- | --- |

    | Mono-54 | 307 | 16.893 ± 5.096 | 11.378-50.223 |

    | Mono-100 | 307 | 14.690 ± 1.676 | 7.453 - 18.926 |

    | Mono-100 | 307 | 11.796 ± 2.349 | 8.807 - 23.653 |

    | VNC | 307 | 22.066 ± 3.316 | 14.182-51.358 |

    | VNC | 307 | 13.469 ± 2.295 | 8.517 - 21.637 |


    图 3. 光谱图像与生成扫描的对比。对每个图像应用了 600-1600 窗。


    我们的传统训练数据集包含 143 名患者，带有使用半自动工具（Philips ISP）从真实图像到分叉生成的生成图像。这些传统扫描是用光谱 CT 生成的，用于与真实图像对比。


    ### B. 光谱数据增强


    一旦使用 HuSpecNet 从传统数据集创建了 mono 54 和 100 keV，就可以为了不同数据增强进行光谱数据增强。使用方程 (1)。如图 4 所示，对比剂从高到低的混合可以使用不同能量的
    mono 图像和 VNC 图像模拟。根据目标器官和器官的真值将 mono 混合在一起，因为执行了不同的注射方案（如图 4D）。对于具有大量标注数据的情况，这种具有更灵活的结果——对给定的注射方案不敏感——可以用于分割或分类。


    为了评估方法的益处并与真实的光谱增强进行比较，我们训练了分割网络。HuOnly 仅在真实图像上训练。真实光谱图像和生成图像通过 HuSpecNet 进行训练。由于每个策略都是从相同的
    143 名患者进行训练，光谱增强的存在与否彼此不同。


    该网络由 3D-Net [12] 组成，具有五个通过残差线性层（ReLU）激活的分层和一个最大池化，每层的特征通道数从 16 翻倍到 26。


