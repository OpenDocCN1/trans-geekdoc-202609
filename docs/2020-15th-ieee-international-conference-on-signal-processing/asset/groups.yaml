    # ## V. CONCLUSION


    Our proposed Casper method successfully manages to bring spectral data to a conventional
    training dataset, allowing for the training of a more versatile and effective
    network for conventional CT applications. However, this method considers the creation
    of a non-contrast dataset, VNC generated from HU, on which GT is easily obtained
    using certain automated segmentation tools. Future developments will include applications
    on other datasets for organ segmentation, improvement of generated VNC images,
    and possible translation to other spectral modalities, such as electron density,
    or Z-effective measures.


