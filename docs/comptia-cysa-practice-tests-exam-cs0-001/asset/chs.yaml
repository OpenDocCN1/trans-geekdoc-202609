  \ C. 这是职责分分的示例。能够向账户转账资金并发布款项的人可能会启动笔非常大的资金转账，因此 Berta 将这些职责分到了不同的角色中。职责分分超越了最小特权原则，通过刻意改变工作来最大限度地减少风险。这并未赋予他们执行工作所需的全部权限，每个操作仍可能由个人执行。\n\
