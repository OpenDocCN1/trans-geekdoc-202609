  4. FDE\n\n## 72. Alex 需要部署一种解决方案，仅允许授权人员访问网络，同时确保连接到网络的系统符合组织的补丁、杀病毒软件和配置要求。以下哪种技术最符合这些要求？\n\
  1. 白名单\n2. 端口安全\n3. NAC\n4. EAP\n\n## 73. Chris 被要求从离开组织的系统和设备删除数据。其中一个设备是结合了复印、传真和打印功能的多功能设备。它有一个内置硬盘用于存储打印作业，并用于处理高度敏感信息的办公室。如果多功能设备是租赁的，处理该硬盘的最佳选项是什么？\n\
