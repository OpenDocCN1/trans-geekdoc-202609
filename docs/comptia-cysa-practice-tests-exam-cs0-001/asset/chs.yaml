  \ 检查将不起作用（而且需要很长时间），而运行蜜罐（honeypot）用于理解黑客技术，而不是直接分析应用程序代码。\n\n### 70. B.\n防火墙规则是逻辑控制的一个示例，因为它们是在数字空间内执行机密性、完整性和可用性的技术控制。锁、钥匙和保安是物理控制的示例。背景检查是行政控制的示例。\n\
  \n### 71. C.\n数据泄露防护可能会拦截并阻止离开 Web 服务器的未加密敏感信息，但它没有对 Web 通信加密。传输层安全（`TLS`）是满足 Chris\
  \ 请求的最直接方法，因为它加密了所有进出 Web 服务器的通信。虚拟专用网络（`VPN`）也可用于加密网络流量，增加一层安全性。全磁盘加密（`FDE`）也可用于在磁盘被盗时保护存储在服务器上的信息。\n\
  \n### 72. C.\n网络访问控制（`NAC`）可以将用户或系统验证与基于客户端或无客户端的配置及分析功能相结合，以确保系统已正确修复和配置，并处于所需的安全状态。白名单允许特定系统或应用程序运行，端口安全是\
