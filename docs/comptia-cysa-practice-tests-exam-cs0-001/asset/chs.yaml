  \n190. D. 当攻击者能够发现多个生成相同输出的输入时，就会发生生日攻击（碰撞）。\n\n191. A. 安全和 Web 开发社区都认为 `Adobe Flash`\
  \ 是过时且不安全的技术。最好的解决方案是 Meredith 从组织的系统中删除此软件。应用安全补丁是临时解决方案，但很快可能会出现新的漏洞，需要更多补丁。阻止工作站的入站访问将是有效的，因为\
  \ `Flash` 漏洞通常在客户端请求恶意文件后被利用。入侵检测系统可能会向管理员报警恶意活动，但不会执行拦截。\n\n192. D. 此漏洞的 CVSS 向量包含\
  \ `AV:N`。这表示访问向量为“网络”，意味着攻击者可以通过网络远程利用该漏洞。\n\n193. C. 此漏洞的 CVSS 向量包含 `AC:L`。这表示访问复杂度为“低”，意味着攻击者可以在没有任何特殊情况发生的情况下利用该漏洞。\n\
  \n194. C. 此漏洞的 CVSS 向量包含 `Au:N`。这表示该向量的身份验证指标为“无”，意味着攻击者不需要身份验证即可利用此漏洞。\n\n195.\
  \ B. 此漏洞披露了支持 Web 应用程序的数据库类型，但没有其他信息。CVSS 向量包含 `C:P`，这表示机密性指标为“部分”，意味着可以访问某些信息，但攻击者无法控制哪些信息被泄露。\n\
  \n196. A. 此漏洞不允许攻击者修改系统上的任何信息。这由 CVSS 字符串 `I:N` 证明，表示完整性为无。\n\n197. A. 此漏洞不允许攻击者影响系统的可用性。这由\
  \ CVSS 字符串 `A:N` 证明，表示可用性为无。\n\n\n\n\n\n# 198. D\n场景并未表明 Dan 对设备或管理员具有任何操作或管理控制权，因此他的下一步应该是将问题升级给适当的经理来解决。Dan\
  \ 不应该威胁工程师，因为没有迹象表明他有权这样做。Dan 无法自己纠正该漏洞，因为作为漏洞管理器，他不应该拥有对网络设备的管理权限。他不应该将该漏洞标记为异常，因为没有迹象表明它是通过正式的异常流程被接受的。\n\
  \n# 199. A\n在管理良好的测试环境中，测试系统的配置应与生产系统几乎完全相同。它们应该运行相同的操作系统并需要相同的补丁。然而，在几乎每个组织中，由于成本、遗留系统问题和其他原因，运行在生产环境中的系统在测试环境中没有镜像部署。\n\
  \n# 200. D\n该服务器的漏洞扫描结果相当干净。列出的所有漏洞严重程度均为 3 或以下。在大多数组织中，只有级别为 4 或 5 的漏洞才需要立即修复。\n\
  \n# 201. A\nLaura 应该联系供应商以确定该设备是否有可用补丁。她不应尝试自己修改设备，因为这可能会导致操作问题。Laura 没有证据表明这是一个误报报告，而且也没有理由等待\
  \ 30 天来观察问题是否会自动解决。\n\n# 202. C\n信用卡信息受《支付卡行业数据安全标准》（`PCI DSS`）约束，该标准包含了规定漏洞扫描频率的特定条款。虽然问题中提到的其他数据类型也受监管，但这些法规中没有一个包含识别所需漏洞扫描频率的特定条款。\n\
  \n# 203. C\nJim 可以通过增加额外的扫描器来平衡负载、减少扫描频率或缩小扫描范围（系统数量）来解决此问题。更改敏感性级别可能不会对扫描时间产生重大影响。\n\
  \n# 204. C\n这是一个面向公共服务的关键漏洞，应尽快打补丁。然而，安排在晚上进行紧急维护并提前几小时通知客户停机是合理的。因此，Trevor 应该立即开始监控受影响系统是否有被入侵的迹象，并与团队合作尽快安排维护。\n\
  \n# 205. D\n保护虚拟化平台的最佳实践是将管理接口仅暴露给专用的管理网络，仅允许授权的工程师访问。这极地降低了针对虚拟化平台攻击的概率。\n\n# 206.\
  \ A\n在沙箱环境中部署更改为测试不会影响生产系统的更改提供了一个安全场所。蜜罐系统（Honeypots）和蜜罐网络（Honeynets）不是测试环境，而是用于吸引攻击者的诱饵服务。供应商补丁通常不应在生产环境中测试，因为可能会对业务运营产生。\n\
  \n# 207. B\n如果可能，Becky 应该在活动低期间安排扫描，以减少其对业务运营的影响。其他方法都有更高的导致中断风险。\n\n# 208. D\n\
  攻击向量（`AV:N`）表明攻击者可能通过网络远程利用此漏洞，而不需要在目标服务器上有任何本地用户账户。\n\n## 第 3 章：领域 3：网络安全事件响应\n\
  \n# 1. B\nLucca 只需要一个可验证的 `MD5` 哈希值来验证这些文件。\n\n# 2. C\nNIST 将此类事件描述为安全事件，因为它们是对安全策略的违反或即将发生的威胁。不利事件是任何产生负面后果的事件，而事件是系统上任何可观测的发生情况。\n\
  \n# 3. A\nChris 同时需要 `/etc/passwd` 和 `/etc/shadow`。\n\n# 4. B\nSysinternals 套件提供了两个检查工具：`AccessEnum`\
  \ 和 `AccessChk`。`AccessEnum` 是一个基于 GUI 的程序，提供权限的完整视图，而 `AccessChk` 是一个命令行程序，可以检查用户或组拥有的权限。\n\
  \n# 5. A\nJohn 并没有响应事件，因此这是一个主动（proactive）的示例。如果他发现某个系统导致了问题，可能会创建一个专门的隔离网络或隔离该系统。\n\
  \n# 7. B\n在大多数情况下，Jennifer 应该部署的第一种检测类型是 rogue SSID 能力。这将帮助她减少用户连接到不可信 SSID 的风险。她可能仍然希望对使用不应使用的信道的\
  \ AP（接入点）进行扫描，而且当然，她的网络应该使用网络访问控制或扫描 MAC 地址，以防止 rogue AP 其他设备的直接连接。\n\n# 8. C\n\
  Dan 的努力属于准备阶段，该阶段涉及旨在限制攻击者可能造成的损害的活动。\n\n# 9. B\n处理信用卡的组织与收单银行合作处理业务，而不是直接与卡提供商合作。通知银行是此类响应工作的一部分。\n\
  \n# 10. B\nLinux 提供了一对 ACL 备份和恢复的命令：`getfacl` 允许对目录进行递归备份，将所有权限写入文本文件，而 `setfacl`\
  \ 从备份文件中恢复这些权限。\n\n# 11. B\n在高级持续性威胁（APT）存在未知时长的情况下，应假设备份已被攻破。由于 APT 经常拥有普通反病毒技术无法检测的工具，Charles\
  \ 拥有的最佳选择是从头开始仔细重建系统，然后在将它们恢复服务之前确保它们已完全打补丁并加固安全。\n\n\n\n\n13. **C.** 显示的系列连接尝试最可能与端口扫描有关。在几秒钟（甚至几分钟）内对各种服务进行一系列失败的连接是端口扫描尝试的常见现象。拒绝服务攻击通常集中于单一服务，而无法连接的应用程序只会配置指向一个数据库服务，而不是多个。配置错误的日志源在大多数情况下，要么会发送错误的日志信息，要么根本不发送任何日志。\n\
  \n14. **D.** Windows 默认会对账户创建进行审计。对于现代 Windows 操作系统，Frank 可以搜索事件 ID 为 `4720` 的事件查找账户创建事件。\n\
  \n15. **A.** 清除（Purging）需要完全删除数据，而加密擦除（cryptographic erase）是列表中唯一能够完全销毁硬盘内容的选项。格式化将把原始数据留在原地，覆盖（overwriting）可能会在空闲空间留存文件残余，而重新分区也会让数据在新分区中保持完好。\n\
  \n16. **B.** 除非她已经知道特定信标（beacon）使用的协议，否则通过协议过滤信标可能会导致她错过信标行为。攻击者希望躲避常见的分析工具，并将使用较不容易引起注意的协议。根据信标发送的间隔和频率过滤网络流量（如果信标随时间持续），并移除已知流量，是识别信标时过滤流量的常见手段。\n\
  \n17. **C.** 本地扫描通常比远程扫描提供更多信息，因为网络或主机防火墙会阻止对服务的访问。第二可能的答案是 Scott 或 Joanna 在扫描时使用了不同的设置。\n\
  \n18. **C.** 处理高度敏感系统时的通用最佳实践是在将硬盘发送给第三方之前对硬盘副本进行加密。Adam 应该加密硬盘镜像，并分开提供（通过单独机制发送）镜像的哈希值和解密密钥，以确保丢失硬盘本身不会导致数据泄露。一旦镜像进入第三方审查员的手中，他们将对其安全性负责。Adam\
  \ 可能想要检查一下他们的协议中关于安全的规定！\n\n19. **B.** 硬件写保护器可以确保连接或挂载硬盘不会导致硬盘上发生任何变化。Mika 应该创建原始硬盘创建一个或多个取证镜像，然后根据需要对副本进行操作。她随后可能选择使用取证软件，可能包括软件写保护器。\n\
  \n20. **A.** 此表是监管链（chain of custody）表单。它包含了有关案件的信息、创建的硬盘副本，以及在调查期间谁拥有过硬盘、设备和副本。\n\
  \n21. **C.** CompTIA 定义了两个阶段：事件消除和验证。根据 CompTIA 的划分，验证阶段的活动包括补丁、权限管理、扫描以及验证日志是否正常工作。\n\
  \n22. **B.** `SNMP`、数据包嗅探和 `netflow` 常用于监控带宽消耗。`Portmon` 是一个过时的 Windows 工具，用于监控串口，这恰恰不是你会用来观察网络带宽使用情况的工具！\n\
  \n23. **B.** James 可以临时创建一个不可信的网段，并使用 `span port` 或 `tap` 允许他看到离开受感染工作站的流量。通过 `Wireshark`，他可以为其发送的流量建立配置文件，帮助他构建信标行为的指纹。一旦他获得了这些信息，就可以将其用于分析中。\n\
  \n24. **C.** 本地扫描通常比远程扫描提供更多信息，因为网络或主机防火墙会阻止对服务的访问。第二可能的答案是 Scott 或 Joanna 在扫描时使用了不同的设置。\n\
