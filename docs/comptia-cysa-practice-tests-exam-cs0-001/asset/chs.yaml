  \n### 209. A. 恶意网站在被访问或广告执行代码时，可能会运行旨在挖掘加密货币或执行其他操作的脚本，导致处理器占用率过高。Charles 应该检查访问过的网站，并使用受信任站点列表工具或信誉工具进行比对。描述的场景并未表明检查二进制文件会有帮助，而且重新安装浏览器通常不是高\
