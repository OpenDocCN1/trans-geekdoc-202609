  \ `www` 用户相关的特权权限，以下哪项没有用？\n1. `/etc/passwd`\n2. `/etc/shadow`\n3. `/etc/sudoers`\n\
  4. `/etc/group`\n\n## 79. Tracy 正在验证其组织使用的 Web 应用安全控制。她希望确保组织准备好对未来的安全事件进行法医调查。以下哪种\
  \ OWASP 控制类别最可能为此做出贡献？\n1. 实现日志\n2. 验证所有输入\n3. 参数化查询\n4. 错误和异常处理\n\n## 80. Gary\
