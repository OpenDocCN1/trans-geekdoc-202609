  \n### 149. C\nMonica 发出的命令仅停止了运行中的服务。除非启动它的脚本被禁用，否则它将在重启时重新启动。在现代 Ubuntu 系统上，这由\
  \ `upstart` 处理。其他服务可能使用 `init.d` 脚本。无论哪种，当遇到此类问题时，你可以快速识别出这是一个重启时发生的问题，并排除不太可能的答案。\n\
  \n### 150. A\n`DNSSEC` 允许权威 DNS 服务器使用数字签名来验证其响应。\n\n### 151. B\nNathan 是白队的一部分，负责管理环境。红队负责攻击，蓝队负责防御。黑队不是这种背景下常用的术语，但有些组织会识别紫色和绿色团队（通常对其职责的描述各异，这确实令人困惑！）。\n\
  \n### 152. B\n`nmap` 作为其平台枚举功能的一部分提供了硬件和操作系统识别能力。`cpe:/o` 表示操作系统识别，`cpe:/h` 表示硬件识别。\n\
  \n### 153. D\n渗透测试的交战规则（rules of engagement）通常描述范围、时间、授权和将要使用的（或禁止使用的）技术。这有助于最大限度地减少意外影响，并让测试人员和目标组织都能受益。具体列出授权工具并不是交战规则的典型做法。\n\
  \n### 154. D\nDNS 黑洞技术使用已知恶意域名或 IP 地址列表，并依赖于在内部 DNS 服务器上列出这些域名，该服务器提供伪回复。路由投毒防止网络向无效目的地发送数据。路由器通常没有反恶意软件过滤器，而子域名白名单是虚构的说法。\n\
  \n### 155. A\n`RADIUS` 通常使用 `TCP` 端口 `1812` 和 `1813`。Kerberos 主要是 `UDP` 服务，尽管它也使用\
