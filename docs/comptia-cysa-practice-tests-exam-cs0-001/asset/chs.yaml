  \ `nstat -c`，可以获得什么类型的信息？\n1. MAC 地址和 IP 地址\n2. NetBIOS 名称到 IP 地址的映射\n3. 主机连接的所有\
  \ NetBIOS 系统列表\n4. NetBIOS 映射\n\n11. Tracy 认为网站的历史版本可能包含她需要的数据。她可以使用什么工具来查看多个时间点的网站快照？\n\
  1. Time Machine\n2. Morlock\n3. Wayback Machine\n4. 目标的 Web 缓存\n\n12. 在 Kristen\
  \ 收到其公司测试人员运行的 `nmap` 扫描副本后，她知道测试人员使用了 `-O` 标志。除了开放端口外，她应该预期在输出中看到什么类型的信息？\n1. OCMP\
  \ 状态\n2. 其他端口\n3. 详细模式下的目标端口评估\n4. 操作系统和通用平台枚举 (CPE) 数据\n\n13. 作为蓝队的一员，John 在外部渗透测试期间观察到以下行为。测试结束时，他应该向经理报告什么？\n\
  1. 延迟显著增加\n2. 丢包显著增加\n3. 延迟和丢包都增加了\n4. 未观察到显著问题\n\n14. 作为组织范围红队演习的一部分，Frank 能够利用一个已知漏洞入侵\
  \ Apache Web 服务器。获得访问权限后，如果他想通过该系统渗透到 Web 服务器所在的 DMZ 后面的受保护系统，他的下一步应该是什么？\n1. 漏洞扫描\n\
  \n\n\n\n\n## 2. 权限提升\n## 3. 补丁\n## 4. 安装额外工具\n\n### 35. 作为恶意软件分析过程的一部分，Caitlyn 绘制了恶意软件为了实现其目标而使用的高级功能和流程。这一过程被称为什么？\n\
  \n1. 静态分析\n2. 组合\n3. 动态分析\n4. 分解\n\n### 36. Alex 被要求评估其组织（一家小型区域性企业）遭受侦察活动的可能性。她的首要任务是确定针对其组织\
  \ DMZ 区域系统进行端口扫描的可能性。她应该如何对这种情况发生的概率进行评分？\n\n1. 低\n2. 中\n3. 高\n4. Alex 没有足够的信息来提供评分。\n\
  \n请使用以下场景来回答第 37 至 39 题。\n\nLucy 是其组织的 SOC 运维人员，负责监控其组织的 `SIEM` 和其他安全设备。她的组织既有国内也有国际站点，许多员工频繁出差。\n\
  \n### 37. 当 Lucy 监控 `SIEM` 时，她注意到其组织纽约分支的所有日志源在过去的 24 小时内已停止报告。她应该配置什么类型的检测规则或告警，以确保下次能更早地发现这个问题？\n\
  \n1. 启发式\n2. 行为\n3. 可用性\n4. 异常\n\n### 38. 在此题第一部分的发现后，Lucy 被要求配置发送给系统管理员的警报。她构建了一个可以用伪代码表示的规则：\n\
  \n```\n当系统未发送日志超过 1 分钟时，每 30 秒发送一次短信警报。\n```\n\nLucy 所在组织的平均每个管理员负责 150 到 300 台机器。\n\
  \nLucy 的警报造成了什么危险？\n\n1. 导致管理员无法访问系统的 DDoS 攻击\n2. 网络中断\n3. 管理员可能会忽略或过滤这些警报。\n4.\
  \ 内存峰值\n\n### 39. Lucy 配置了一个警报，用于检测通常不出差的用户从其他国家登录。这属于哪种类型的分析？\n\n1. 趋势\n2. 可用性\n\
  3. 启发式\n4. 行为\n\n### 40. 在分析恶意软件样本时，John 在不运行它们的情况下审查了恶意软件文件和二进制文件。这属于哪类型的分析？\n\n\
  1. 自动化分析\n2. 动态分析\n3. 静态分析\n4. 启发式分析\n\n### 41. Lauren 所就的公司正在对基础设施即服务（IaaS）托管进行大量投资，以取代传统的数据中心。她组织的管理层成员对当\
  \ Lauren 的团队在云服务提供商的环境中从一个虚拟主机移动到另一个虚拟主机时的数据遗留问题表示担忧。她应该指导团队怎么做来避免这一顾虑？\n\n1. 在移动系统之前对驱动器进行清除（Zero-wipe）。\n\
  2. 使用全磁盘加密。\n3. 使用数据掩码。\n4. 跨多个虚拟磁盘以碎片化数据。\n\n### 42. Lucca 想防止其网络上的工作站相互攻击。如果 Lucca\
  \ 的公司网络如图所示，他应该选择哪种技术来防止笔记本 A 能够攻击工作站 B？\n\n![](img/c01uf010.jpg)\n\n1. IPS\n2.\
  \ IDS\n3. HIPS\n4. HIDS\n\n### 43. Geoff 想通过 `iptables` 防火墙停止所有流量进入或离开 Linux 系统。以下命令哪个不是执行此操作所需的三个\
  \ `iptables` 命令之一？\n\n1. `#iptables-policy INPUT DROP`\n2. `#iptables-policy SERVICE\
  \ DROP`\n3. `#iptables-policy OUTPUT DROP`\n4. `#iptables-policy FORWARD DROP`\n\
  \n### 44. Dan 所就的公司最近迁移到了 SaaS 供应商来其企业资源计划（ERP）软件。在传统的本地 ERP 环境中，Dan 定期进行端口扫描以帮助对系统进行安全验证。在这个环境中，Dan\
  \ 最可能需要做什么？\n\n1. 使用不同的扫描工具。\n2. 依赖供应商的测试和审计。\n3. 聘请第三方测试人员。\n4. 使用 VPN 扫描供应商的安全边界内部。\n\
  \n### 45. Charles 使用 `Network Miner` 审查其对目标组织进行侦察时的数据包获。一个系统显示了此处的信息。`Network Miner`\
  \ 使用了什么信息来确定该 PC 是惠普（HP）设备？\n\n![](img/c01uf011.jpg)\n\n1. MAC 地址\n2. OS 标志\n3.\
  \ 系统横幅（Banner）\n4. IP 地址\n\n### 46. Laura 的组织一直在收到大量专门发送到其组织域名注册列出的邮箱地址的垃圾邮件。以下哪些技术可以帮助她的组织限制这类垃圾邮件？\n\
  \n1. DNS 查询速率限制\n2. CAPTCHAs\n3. 使用代理服务\n4. 黑名单\n\n### 47. Eric 认为他的组织有许多被第三方扫描过的漏洞系统。如果他想检查公开可的漏洞信息，以下哪种方法最适合执行这种类型的侦察？\n\
  \n1. 使用 `nmap` 数据库。\n2. 在 `Shodan` 中搜索他的域名。\n3. 使用 `OpenVAS` 中央漏洞库。\n4. 比对 `CVE`\
  \ 数据库。\n\n### 48. Adam 知道 `netcat` 是一个非常有用的渗透测试工具。如果他仅将其作为工具，以下哪项不是他使用 `netcat`\
  \ 的方法？\n\n1. 文件传输\n2. 端口扫描器\n3. 加密 shell\n4. 反向 shell\n\n### 49. 以下哪个工具可以被动收集信息以生成拓扑图？\n\
  \n1. Wireshark\n2. `nmap`\n3. SolarWinds Network Mapper\n4. Nessus\n\n### 50. Lauren\
  \ 想使用高级 Google 查询来搜索其侦察工作书中未公开的信息。什么术语通常用于描述这些搜索？\n\n1. Google whacks\n2. SuperGoogles\n\
  3. Google dorks\n4. Google gizmos\n\n### 51. 种类型的控制审查会将变更管理作为评估的主要要素？\n\n1. 运营控制审查\n\
  2. 技术控制审查\n3. 检测控制审查\n4. 响应控制审查\n\n### 52. 作为组织内部安全审查侦察过程的一部分，Olivia 使用 `Shodan`\
  \ 搜索 IP 范围内的主机。她发现了目标设备的 `Shodan` 条目。她应该如何处理这些信息？\n\n![](img/c01uf012.jpg)\n\n1.\
  \ 激活事件响应流程。\n2. 联系设备管理员。\n3. 登录验证发现。\n4. 不需要，因为这是虚假信息。\n\n### 53. Kathleen 想定期验证她负责的文件是否发生了变化。以下什么方法最合适？\n\
  \n1. 使用 `sha1sum` 为文件生成哈希并编写脚本定期检查。\n2. 安装并使用 `Tripwire`。\n3. 使用脚本定期检查文件的 MAC 信息。\n\
  4. 加密文件并保密密钥以防文件无法被修改。\n\n### 54. Selah 被派遣收集信息，以增加渗透测试团队对客户互联网足迹的了解。她想以自动化方式收集电子邮件、子域名、员工姓名和其他信息。以下哪个工具最符合她的需求？\n\
  \n1. `nmap`\n2. `theHarvester`\n3. `Shodan`\n4. `osint-ng`\n\n\n\n\n\n## 55. 在查看此处显示的\
  \ Wireshark 数据包捕获时，Ryan 注意到了使用 `ESP` 协议的扩展会话。当他点击数据包时，他无法理解其内容。如果他亲自调查 IP 地址为 `10.0.0.1`\
  \ 的工作站，他应该在寻找什么？\n\n![](img/c01uf013.jpg)\n\n1. 一个加密的 RAT\n2. 一个 VPN 应用\n3. 一个安全的网页浏览器\n\
  4. 一个 `base64`-编码的数据包传输工具\n\n## 56. Ben 想要快速检查一个可疑的二进制文件，以查看其用途或可能包含的其他信息。哪种 Linux\
  \ 工具可以快速向他显示文件中包含的潜在有用信息？\n\n1. `grep`\n2. `more`\n3. `less`\n4. `strings`\n\n##\
  \ 57. 在调查恶意软件感染时，Lauren 发现她正在审查的系统的 `hosts` 文件包含多个条目，如下所示：\n\n```\n0.0.0.0     symantec.com\n\
  0.0.0.0     mcafee.com\n0.0.0.0     microsoft.com\n0.0.0.0     kapersky.com\n```\n\
  \n恶意软件为什么要进行此更改？\n\n1. 为了将 `0.0.0.0` 重定向到已知站点\n2. 防止防病毒软件更新\n3. 防止其他攻击者攻破系统\n4.\
  \ 启用对系统的远程访问\n\n## 58. Alice 认为她的一个用户可能正在她有访问权的系统上采取恶意行动。当她路过该用户的桌面时，她在屏幕上看到了以下命令：\n\
  \n```\nuser12@workstation:/home/user12# ./john -wordfile:/home/user12/mylist.txt\
  \ -format:lm hash.txt\n```\n\n该用户正尝试做什么？\n\n1. 他们正在尝试对文件进行哈希处理。\n2. 他们正在尝试破解哈希后的密码。\n\
  3. 他们正在尝试破解加密的密码。\n4. 他们正在尝试哈希值传递（pass-the-hash）攻击。\n\n## 59. `nmap` 提供了一种标准方法来命名它检测到的硬件和软件。这称为什么？\n\
