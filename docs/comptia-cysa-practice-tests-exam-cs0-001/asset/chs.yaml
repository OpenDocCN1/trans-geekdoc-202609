  \ APT（高级持续性威胁）的大规模入侵后，Jaime 需要对受损系统进行取证检查。他应该推荐哪种抑制方法，以确保能够充分调查涉及的系统，同时最大限度地减少对其组织其他生产系统的风险？\n\
  \n1. 沙箱化\n2. 移除\n3. 隔离\n4. 分段\n\n## 72. Michelle 试图修复一个安全漏洞，必须对生产数据库服务器应用补丁。数据库管理团队担心补丁会干扰业务运营。Michelle\
  \ 应如何进行？\n\n1. Michelle 应该立即在生产系统上部署补丁。\n2. Michelle 应该等待 60 天再部署补丁。\n3. Michelle\
  \ 应该在沙箱环境中部署补丁进行测试。\n4. Michelle 应该联系供应商以确定部署补丁的安全时间。\n\n## 73. Kent 对一个员工经常使用的内部服务器运行了扫描，结果显示该服务器没有可用服务。结果\
