  \ (SP)。\n\n### 118. A\n数据所有权策略明确规定了组织创建或使用信息的所有权。数据分类策略描述了组织使用的分类结构以及用于为数据正确分配分类的流程。数据保留策略概述了组织将维护哪些信息以及不同类别的信息在销毁之前保留多久。账户管理策略描述了从配置到激活使用再到注销的账户生命周期。\n\
  \n### 119. B\n地址空间布局随机化 (`ASLR`）以随机方式重新排列内存位置，以防止依赖于特定内存位置使用的攻击。数据执行保护 (`DEP`）防止执行加载到内存数据空间的恶意软件。`DLP`\
  \ 和 `EMEA` 都不是 `EMET` 的功能。\n\n### 120. B\n使用手机身份验证器应用证明了对设备的持有，是“你拥有的东西”的一个示例。与密码（“你知道的东西”）相结合时，这种方法提供了多因素认证。\n\
  \n### 121. C\n敏捷方法将工作分为短时间的工作会话，称为 `sprints`（迭代），持续时间几天到几周不等。\n\n### 122. B\n图表已显示网络连接双方都部署了防火墙。Ian\
