  \n## 第二章：领域 2：漏洞管理\n\n### 1. A. 使用基于代理的扫描方法将为不总是连接到网络的系统 Kim 提供最可靠的结果。代理可以运行扫描，并在下一次连接到网络时报告结果。其他技术都要求系统在扫描期间连接到网络。\n\
  \n### 2. B. 当 Carla 读取此报告时，她应该注意底部三个漏洞的状态为“已修复”（Fixed）。这表明信息泄露漏洞已经修复，服务器不再支持 `TLSv1.0`。关于负载均衡器的告警级别为\
  \ 1，Carla 应该将其视为信息。这使得在给出的选项中，过期 SSL 证书的 2 级漏洞成为最高级别的问题。\n\n### 3. C. 在虚拟机（VM）逃逸攻击中，攻击者利用虚拟程序的漏洞访问分配给其他客户操作系统的资源。运行在虚拟机的服务可能受到此处列出的其他攻击，但那些攻击只能访问分配给同一个虚拟机（缓冲区溢出或目录遍历的情况下）或客户端（跨站脚本的情况下）的其他资源。\n\
  \n### 4. B. 常见平台枚举（CPE）为描述产品名称和版本（包括应用程序和操作系统）提供了标准命名法。常见漏洞和披露（CVE）为描述安全漏洞提供了标准命名法。常见漏洞评分系统（CVSS）为衡量和描述安全漏洞的严重性提供了标准化方法。开放漏洞和评估语言（OVAL）是一种用于指定检查清单所使用的低级测试程序的语言。\n\
  \n### 5. C. Josh 应该确保 `ICS` 在隔离网络上，从任何连接互联网的系统都无法访问。这大大降低了被利用的风险。自己开发补丁是不符合效益的，Josh\
  \ 不应该信任从互联网论坛获取的任何软件。入侵防御系统虽然是一个好主意，但其控制强度不如网络隔离。\n\n### 6. C. 该漏洞的严重性评分为 3/5，并且由于服务器位于内部网络且仅供信任人员访问，进一步得到了缓解。这高于信息性报告的级别，应该被处理，但不需要紧急关注。\n\
  \n### 7. B. 常见漏洞和披露（CVE）为描述漏洞提供了标准命名法。常见平台枚举（CPE）为产品名称和版本提供了标准命名法。常见配置枚举（CCE）为系统配置提供了标准命名法。可扩展配置清单描述格式（XCCDF）为指定检查清单和报告结果提供了语言。\n\
  \n### 8. B. 在给出的选项中，高严重性报告最可能是提供关键安全问题摘要的报告。技术报告对于 Rob 的经理来说可能包含太多细节。补丁报告将指示缺少补丁的系统和应用程序，但会忽略其他安全问题。未知设备报告将关注扫描期间检测到但未在资产管理系统中注册的系统。\n\
  \n\n\n\n\n### 9. A\n支付卡行业数据标准（`PCI DSS`）监管信用卡和借记卡信息。《教育权利与隐私法》（`FERPA`）适用于学生教育记录。《健康保险流动性与责任法》（`HIPAA`）监管受保护的健康信息。《萨班斯奥克斯利法》（`SOX`）要求上市公司公司在处理财务记录时进行控制。\n\
  \n### 10. C\nWeb 服务器通常运行在端口 `80`（用于 `HTTP`）和 `443`（用于 `HTTPS`）。数据库服务器通常运行在端口 `1433`（用于\
  \ `Microsoft SQL Server`）、`1521`（用于 `Oracle`）或 `3306`（用于 `MySQL`）。远程桌面协议服务通常运行在端口\
  \ `3389`。没有证据表明使用端口 `22` 的 `SSH` 运行在该服务器上。\n\n### 11. B\nBeth 在将代码部署到生产环境之前应该对其进行测试。由于这段代码是为了修复漏洞扫描中发现的问题，Beth\
  \ 应该要求安全团队重新扫描，以作为其测试的一部分来确认漏洞已得到解决。在这种情况下，渗透测试属于过度且且没有必要。Beth 在测试之前不应将代码部署到生产环境。在验证在生产环境中运行之前，她不应将该问题标记为已解决。\n\
