  \ 打补\n3. 入侵防御系统\n4. 加密\n\n150. Matt 正在整合其组织与一家新收购公司的网络。他担心被收购的网络包含可能被利用的系统，并希望保护他的网络免受受损主机的影响。以下控制效果最低？\n\
