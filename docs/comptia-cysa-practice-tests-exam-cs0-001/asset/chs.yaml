  \n1. 准备\n2. 检测与分析\n3. 遏制、根与恢复\n4. 事件后活动\n\n# 附录\n\n复习题答案\n\n## 第 1 章：领域 1：威胁管理\n\
  \n1. C. `DNS` 反向查找是一种主动技术。`Google` 和 `Shodan` 都是搜索引擎，而 `PGP` 密钥服务器不与目标网站交互，被认为是被动侦察。如果你并不立即熟悉某项技术或设备，你通常可以减少可能的选项。在这里，排除\
  \ `Google` 搜索或查询 `PGP` 服务器显然不是主动技术，且 `Shodan` 也说它是一个搜索引擎，因此即使你不熟悉它，`DNS` 反向查找也是一个很好的猜测。\n\
  \n2. A. 虽然这看起来很奇怪，但查询 IP 列表、常见子域名或其他目标列表的 `DNS` 暴力攻击通常会绕过那些不特别关注 `DNS` 查询的入侵检测和防御系统。Cynthia\
  \ 甚至可能找到一个未受组织 `IPS` 保护的 `DNS` 服务器！`nmap` 扫描通常在侦察期间使用，Cynthia 可以预料它们会被检测，因为它们更难隐藏。Cynthia\
  \ 不应该期望自己能够执行区域传输，如果她可以这样做，配置良好的 `IPS` 应该立即标记该事件。\n\n3. C. `Microsoft Baseline Security\
  \ Analyzer` (`MBSA`) 是 `Microsoft` 提供的一个工具，可以识别已安装或缺失的补丁，以及常见的安全配置错误。由于它是以管理员权限运行的，它提供的比普通的\
  \ `nmap` 和 `Nessus` 扫描更好的视图，并提供有关已安装特定补丁的更详细信息。`Metasploit` 提供有限的扫描能力，但不是处理此情况的最佳工具。\n\
  \n4. C. 侦察工作不包括利用，Charleen 不应该期望在交战规则中包含利用限制。如果她正在进行全面的渗透测试，她将需要确保完全理解客户对漏洞利用的任何担忧或限制。\n\
  \n5. C. `MySQL` 使用端口 `3306` 作为默认端口。`Oracle` 使用 `1521`，`Postgres` 使用 `5432`，`Microsoft\
  \ SQL` 使用 `1433/1434`。\n\n6. B. 启发式检测方法运行潜在的恶意软件程序并跟踪发生的情况。这允许反恶意工具判断程序的行为和操作是否与恶意软件常见的特征匹配，即使文件不匹配已知恶意软件包的指纹。\n\
  \n7. A. Cynthia 的第一个动作应该是确定工作站打开这些端口是否有正当理由。\n\n8. D. `bcrypt` 是一种强密码哈希算法，为存储的值包含了盐（salts）。如果\
  \ Charles 使用 `bcrypt`，他将是列表中最佳选择，因为 `MD5` 和 `SHA-1` 即使带有盐也不如其强大。加密数据库可能看起来是个好主意，但存储明文密码意味着，可以在数据库解密时读取数据库的漏洞将获得明文密码！\n\
  \n9. B. 这些命令将在 `INPUT` 规则集中添加过滤器，专门阻止来自主机 `A` 和 `B` 的流量，同时只允许来自主机 `C` 的端口 `25`。选项\
  \ D 可能看起来很有吸引力，但它允许所有流量而非仅限 `SMTP`。选项 A 只丢弃来自主机 `B`（及其 `/24` 段内所有其他主机）的 `SMTP` 流量，而选项\
  \ C 允许你想阻止的主机流量！\n\n10. B. 虽然在完成范围后立即开始可能很有诱惑，但 Jessica 的下一步应该是确保获得对范围、时间和工作量的适当批准和协议。\n\
  \n11. C. `NIST` 过程重点是在浏览系统之前提升权限。如果 Brian 幸运地远程破解了管理员账户，他可以跳过这一步，但在大多数情况下，他的下一步是寻找本地利用程序或权限提升漏洞，以便他获得更多控制权。\n\
