  \ 和服务器管理员都咨询了供应商，他们无法确定崩溃的原因，并怀疑这可能是代理的副作用。Gary 最恰当的行动是什么？\n1. 为该服务器批准豁免。\n2. 继续每天扫描该服务器。\n\
  3. 要求在 14 天内解决问题，然后恢复扫描。\n4. 停用该服务器。\n\n## 81. Brent 的组织运行的一个 Web 应用程序最近遭受了中间人攻击。以下哪项控制措施是此类攻击的最佳防御措施？\n\
