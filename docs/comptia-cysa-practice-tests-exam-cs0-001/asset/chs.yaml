  \ OEM 文档。软件/恶意软件、指纹/哈希、分解、培训和演练、红队、蓝队和白队。风险评估、技术控制审查、操作控制审查、技术影响和可能性及评分：高、中、低 |\
  \ |\n| **2.0 漏洞管理** | |\n| 2.1 给定场景，实施信息安全漏洞管理过程。 | 第 2 章 |\n| 识别需求、监管环境、公司政策、数据分类、关键和非关键资产清单。根据风险偏好、监管要求、技术限制和工作流建立扫描频率。根据规范配置工具执行扫描，确定扫描标准、设置敏感级别、漏洞源、扫描范围、基于凭据与非基于凭据的、数据类型。工具更新/插件、`SCAP`、权限和访问、如何执行扫描和生成报告、自动与手动发布、修复、根据关键性和实施难度优先响应。通信/变更控制、沙箱/测试、修复阻碍：`MOUs`、`SLAs`、组织治理、业务流程中断和功能下降。持续扫描和持续监控\
