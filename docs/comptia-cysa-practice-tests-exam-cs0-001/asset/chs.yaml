  \ Linux 系统中的磁盘复制工具。\n\n### 137. C\nBobbi 采用的是物理而非逻辑隔离策略。在这种被称为“物理隔离”（air gapping）的方法中，组织使用与任何系统连接的独立系统，极大降低了被攻击的风险。`VLAN`\
  \ 隔离和网络分段涉及某种程度的连接，而这在场景中不存在。\n\n### 138. D\n瀑布模型遵循一系列顺序步骤，如下所示。敏捷软件开发方法以多次 `sprints`\
  \ 为特征，每次产生一个具体的成果。螺旋模型通过四个阶段的多次循环，产生螺旋形图表。快速应用开发采用五个阶段的迭代格式。\n\n### 139. C\n`RADIUS`\
  \ 最大的缺陷是在通过网络传输密码时使用了不安全的 `MD5` 哈希函数。对存储的密码进行哈希或加密无法解决此风险，但在加密的网络连接上隧道 `RADIUS`\
  \ 通信可以缓解此问题。\n\n### 140. C\n在 SAML 事务中，用户向依赖发起请求，依赖方将用户重定向到 SSO 提供者。用户随后对 SAML 身份提供者进行验证并接收\
  \ SAML 响应，响应作为身份证明发送给依赖方。\n\n### 141. A\n该错误表明签名证书的证书机构不受信任。这通常是组织自签名数字证书的结果。Ty\
  \ 可以通过从信任的第三方 `CA` 购买证书来解决此错误。\n\n### 142. D\n`FTK` 是取证工具套件，而非 Web 应用防火墙。`CloudFlare`、`FortiWeb`\
  \ 和 `NAXSI` 都是 Web 应用防火墙产品。\n\n\n\n\n\n144. A. ITIL 中的持续服务改进（CSI）活动旨在提高 IT 服务的质量和效率。它是涵盖所有其他\
  \ ITIL 活动的总体活动。\n\n145. C. CheckPoint、Palo Alto 和 Juniper 都是网络防火墙的供应商。FireEye 提供端点保护和其他高级威胁缓解工具，但不提供网络防火墙。\n\
  \n146. C. Fagan 检查（Fagan inspection）是一种高度形式化、严格的代码审查过程，涉及六个阶段。结对编程、隔肩审查（over-the-shoulder\
  \ reviews）和传阅代码审查都是轻量级代码审查过程的示例。\n\n147. A. 结对编程是一种敏捷软件开发技术，将两名开发人员置在一个工作站上。一名开发人员编写代码，另一名开发人员在编写时对其进行审查。隔肩代码审查也依赖于两个开发人员，但它不需要持续的交互和交接，而是要求编写代码的开发者向另一名开发者解释代码。传阅代码审查（有时被称为\
  \ `email pass-around code review`）是一种手动同伴评审的形式，通过将完成的代码发送给审查人员来检查代码问题。工具辅助代码审查则依赖正式或非正式的软件工具来进行代码审查。\n\
