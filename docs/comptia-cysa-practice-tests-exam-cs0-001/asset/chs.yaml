  \ 也是合适的替代浏览器。\n\n### 114. A\n缓冲区溢出发生在应用程序尝试向内存位置写入比分配更多的数据，导致对内存其他区域的未经授权写入。边界检查在将用户输入存储到内存之前验证其是否超过了允许的最大长度。\n\
