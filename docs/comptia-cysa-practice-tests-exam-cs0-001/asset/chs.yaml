  \ John 应该遵循组织的应急响应计划。\n\n### 157. B\n`nmap` 支持许多防火墙规避技术，包括伪造 MAC（硬件）地址、添加随机数据、设置扫描延迟、使用欺骗\
  \ IP 地址、伪造源 IP 或端口、修改 MTU 大小或故意分分包。\n\n### 158. B\n`FGDump` 是用于 Windows 密码审计的工具。如果成功，它将导出每个用户的用户名和密码哈希。\n\
  \n### 159. A\n`dig` 命令提供的信息包括查询时间、发送的查询详情以及发送的标志。在大多数情况下，`host`、`dig -x` 和 `nslookup`\
  \ 都会提供相似的信息。`zonet` 并不是一个真实的 Linux 命令。\n\n### 160. C\n`which` 命令将向 Selah 显示 `bash`\
  \ 可执行文件是从哪里运行的，通常是 `/bin/bash`。如果她发现 `bash` 运行在用户目录或其他可疑地方，她应该立即报告！（如果你熟悉 `printenv`\
  \ 命令，选项 D 可能会很棘手；`printenv` 不接受特定标志，因此 Selah 需要将输出通过到 `grep` 中或手动搜索才能在那里找到 bash。）\n\
  \n\n\n\n\n### 161. 跳板机的使用\n**D.** D. Adam 正在使用 `jump box` 提供访问。`jump box`（有时称为 `jump\
  \ server` 或 `secure administrative host`）是一种用于管理位于单独的的安全区域（通常是高安全区域）内设备的系统。这防止了管理员在高安全区域内使用安全性较低的管理工作站。\n\
  \n### 162. iptables 配置\n**A.** 162. 添加 `iptables` 条目使用 `-A` 标志将其添加到列表。在这里，你可以安全地假设\
  \ `OUTPUT` 是输出规则集。`-d` 标志用于指定 IP 地址或子网范围，而 `-j` 指定动为 `DROP`。\n\n### 163. 证书过期\n\
  **A.** 163. 当一个机构的多个证书过期时，通常表明存在安全问题，导致需要使证书失效。Fred 应该检查在过期日期附近是否有其他关于可能泄露的其他信息。\n\
  \n### 164. 数据收集与隐私\n**B.** 同时使用 `CAPTCHAs` 防止机器人以及实施合理的速率限制策略可以限制数据的批量收集。隐私和代理服务有助于保持注册者数据的私密性。黑名单对于临时阻止滥用的\
  \ IP 地址或网络有用，但如果广泛使用或阻止了合法网站，会导致长期问题。最后，不发布 TLD 区域文件有助于限制 `WHOIS` 滥用，但并非所有 TLD 都能避免这样做。\n\
  \n### 165. 系统识别\n**D.** Casey 知道她看到了三个开放端口，并且 `nmap` 对这些端口上运行的程序进行了最佳猜测。在这种情况下，该系统实际上是一个\
  \ `Kali Linux` 系统，一个基于 `Debian` 的发行版。它不是 `Cisco` 设备，没有运行 `CentOS`，而且不是由 `IBM` 构建的。\n\
  \n### 166. 接触规则 (Rules of Engagement)\n**B.** 接触规则是在渗透测试或其他安全评估时遵循的规则。它们通常列出评估的类型、时间、地点和如何进行；将进行哪些通信和通知；以及其他确保评估执行方式符合组织需求的关键细节。\n\
  \n### 167. SNMP 局限性\n**D.** 由于 `SNMP` 无法可靠地报告关闭的 `UDP` 端口，且 `SNMP` 服务器不会响应无效的团体字符串（community\
  \ strings）请求，因此这些答案中的任何一个可能是正确的。这意味着对 `SNMP` 查询接收“无响应”可能意味着机器无法访问（通常由于防火墙导致）、它们没有运行\
  \ `SNMP`，或者使用的团体字符串错误。\n\n### 168. 网络分析工具\n**B.** Angela 可以使用 `NetworkMiner`，该工具可以分析现有的数据包捕文件进行操作系统识别，识别并标记图像、文件、凭据、会话、DNS\
  \ 查询、参数以及各种其他细节。`Ettercap` 可以执行被动 `TCP` 栈指纹识别，但它主要是中间人工具；`dadis` 是安全团队的开源协作平台，而\
  \ `Sharkbait` 并不是安全工具或术语。\n\n### 169. 蜜网与蜜罐\n**C.** Rick 的团队设置了一个 `honeynet`（蜜网），这是一组旨在吸引攻击者的系统，同时可以捕获他们发送的流量以及使用的工具和技术。`honeypot`（蜜罐）是以类似方式设置的系统，而\
  \ `tarpit`（陷阱）是用于减慢攻击者速度的系统。`blackhole`（黑洞）在网络上通常用作静默丢弃流量的目的。\n\n### 170. DNS 记录\n\
  **A.** 规范名称 (`CNAME`) 用于将一个名称别名为另一个名称。`MX` 记录用于邮件服务器，`SPF` 记录指示授权为域名发送邮件的邮件交换服务器\
  \ (`MXes`)，`SOA` 记录是起始权威记录，记录了域名从其父域委托的地方。\n\n### 171. Windows 安全工具\n**C.** `AppLocker`\
  \ 是 `Windows 10` 系统可用的一种工具，允许基于文件属性的规则来限制用户运行的应用程序和文件，包括可执行文件、脚本、Windows 安装文件、`DLLs`、打包应用程序和打包应用程序安装程序。`secpol.msc`\
  \ 是安全策略管理单元，控制 Windows 安全配置的其他部分。`FileVault` 是 `MacOS` 的文件加密系统，而 `GPed` 是一个虚构的程序。\n\
  \n### 172. 暴力破解与 Fail2ban\n**C.** 此输出显示了使用 `ssh` 对 `localhost` 的 root 账户进行的暴力破解攻击。这导致\
  \ root 用户尝试重新身份验证次数过多，`PAM` 已经阻止了重试。该服务未设置 `Fail2ban`。因此，这是未发生的一项。如果启用了它，`fail2ban`\
  \ 日志将类似于：\n\n```\n* 2017-07-11 12:00:00,111 fail2ban.actions: WARNING [ssh] Ban\
  \ 127.0.0.1\n* 2017-07-11 12:00:00,111 fail2ban.actions: WARNING [ssh] Unban 127.0.0.1\n\
  ```\n\n### 173. 补偿性控制\n**C.** 当存在漏洞且尚未发布补丁或无法发布补丁时，补偿性控制可以提供保护。在 `PCI-DSS` 以及其他合规标准的情况下，记录了哪些补偿控制措施是重要的。\n\
  \n### 174. 勒索软件缓解\n**B.** 在许多情况下，备份是减少勒索软件爆发的影响的最佳方法。虽然预防措施有帮助，但恶意软件的变化速度更快，检测性控制可以应对。`honeypot`\
  \ 无法帮助防止勒索软件，因此可以很容易被排除。\n\n### 175. 漏洞利用工具\n**A.** `Metasploit` 主要是一种漏洞利用工具。虽然它有用于侦察的模块，但它主要用于针对发现的漏洞。`nmap`、`Nessus`\
  \ 和 `Maltego` 都经常用于获取组织信息。\n\n### 176. nmap 标志\n**C.** `nmap` 的 `-sP` 标志表示 ping\
  \ 扫描，`/24` 表示 255 个地址的范围。在这种情况下，这意味着 `nmap` 将扫描 `192.168.2.0` 到 `192.168.2.255`\
  \ 中响应 ping 的主机。\n\n### 177. 恶意软件分析\n**A.** Kara 正在对其调查的恶意软件进行分解分析。分解有助于理解软件包或程序，有时比静态或动态分析更快提供信息，因为它不需要运行程序来分析其行为，也不需要对代码进行密集人工审查或对编译后的代码进行反汇。\n\
  \n### 178. 检测\n**B.** 识别 SQL 注入攻击需要查看查询内容。大多数状态包检测防火墙不显示完整数据包内容，而是根据端口、IP 地址和基于规则记录成功或失败。DDoS\
  \ 攻击也难以识别，但从多个源到单一服务的巨大流量有助于指出问题。\n\n### 179. 扫描策略\n**B.** 从现场网络连接进行扫描最可能提供更多细节。许多组织拥有强大的外部网络防御，但通常对现场网络连接提供较少的保护，以允许内部用户访问服务。该组织可能仅在使用不常见端口的服务或仅使用\
  \ UDP 服务，但这两个选项的概率都低于现场扫描成功的概率。`nmap` 确实提供了规避防火墙和 IPS 的能力，这也是一个可能性较低的情况。\n\n###\
  \ 180. 网络拓扑\n**C.** 获取网络中每个系统的跟踪路由（traceroute）信息有助于了解网络拓扑，包括路由器、交换机和其他设备可能的位置。ISP\
  \ 通常不会进行未通知的扫描，漏洞扫描会包含额外的扫描流量，且路由器不会探测单个系统进行 BGP 发现。\n\n\n\n\n\n# 181. C\n根据国防微电子活动部（DMEA）网站显示：“DMEA\
  \ 认证集成电路设计、聚合、代理、掩膜制造、代工、后处理、封装/组装和测试服务领域的供应商。这些服务涵盖了广泛的技术，旨在支持新的和旧的应用程序，包括分类和非分类。”该计划旨在确保电子设备在设计过程中不会受到损害。\n\
  \n# 182. B\nBGP 视镜（looking glasses）为主机和网络提供路由信息的公共视图。这可以为渗透测试人员提供网络连通性信息。虽然 `nmap`\
  \ 有许多功能，但它不提供路由查询。BGP 路由反射器（也称为 BGP 路由器，向对等发布路由）和路由/路径同步器是本题虚构的概念。\n\n# 183. C\n\
