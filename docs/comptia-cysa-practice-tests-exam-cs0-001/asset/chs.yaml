  \ `DNS` 中注册系统将无法阻止基于 `IP` 的扫描，且端口扫描仍然可以在防火墙允许的端口上成功。端口安全是一种基于网络交换机的技术，旨在限制哪些系统可以使用物理网络端口。\n\
  \n### 51. B.\n`NIST` 的功能影响类别范围从无到高不等，但此事件符合“中等影响”事件的描述；该组织失去了为部分系统用户提供关键服务的能力。如果整个网络瘫痪，他会将该事件评为高影响事件，而如果只是单个交换机或网络变慢，他会将其归类为低影响。\n\
  \n### 52. B.\n操作系统的指纹识别依赖于每个操作系统（有时包括操作系统版本）处理和设置各种 `TCP/IP` 字段时的差异，包括初始数据包大小、初始\
  \ `TTL`、窗口大小、最大段大小以及 `don’t fragment`、`sackOK` 和 `nop` 标志。\n\n### 53. B.\n管理信息基础\
  \ (`MIBs`) 提供了监控组，用于获取网络信息，包括基于流的信息、统计数据、历史、告警和事件。\n\n### 54. D.\n常见存储位置的易失性顺序如下：\n\
  \n1. `CPU` 缓存、寄存器、运行进程和 `RAM`\n2. 网络流量\n3. 磁盘驱动（机械式）\n4. 备份、打印输出和光介质（包括 `SSD`）\n\
  \n因此，易失性最低的存储是 `DVD-ROM`。\n\n### 55. A.\n该漏洞指出，`Windows` 操作系统缺失补丁。在裸机虚拟机中，运行 `Windows`\
  \ 的地方可能是客操作系统。因此，Jerry 必须为 `Windows` 打上补丁。\n\n### 66. C.\n第 3 级风险管理的特征是基于风险的组织风险管理方法、策略和程序。在第\
  \ 4 级计划中，存在组织层级的风险管理方法。\n\n### 57. D.\n重复的 `SYN` 数据包可能是试图耗尽目标的 `SYN` 洪水。三次握手失败可能在防火墙允许的端口上成功，但\
  \ `DDoS` 会涉及多个系统。\n\n### 58. D.\nOracle 数据库默认使用 `TCP` 端口 1521。外部流量被拒绝。\n\n### 59.\
