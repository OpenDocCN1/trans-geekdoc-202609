  \ 通信和其他协议。模糊测试通常不用于防火墙规则。注意，此题提到了 `Untidy` 模糊器。该产品是一个 `XML` 模糊器，现已不存在，因为它被并入了 `Peach`\
  \ 模糊测试工具。然而，`CompTIA` 将其作为 `CySA+` 考试的目标之一。因此，如果你在考试中看到该名称，应将其与 `XML` 模糊测试联系起来。\n\
  \n215. C. 虽然这些控制文档都可能包含对 `Lynda` 有帮助的信息，但应用程序软件安全控制最可能包含与将安全整合到 `SDLC` 相关的信息。\n\n\
  # 第 5 章：练习题 1\n\n1. B. 突然降至零最可能是链路故障的示例。拒绝服务攻击可能导致这种下降，但对于大多数组织来说可能性较低。高带宽消耗和信标行为（beaconing）显示的流量模式都与示例所示不同。\n\
  \n2. C. 这从根本上是一个关于数据所有权的争议。`Charlotte` 的同事声称她的部门拥有相关数据，而 `Charlotte` 不同意。虽然提到的其他策略可能包含一些相关信息，`Charlotte`\
  \ 应该首先查看数据所有权策略，看它是加强还是削弱了她同事的数据所有权主张。\n\n3. B. 在事件恢复过程中，补丁的优先级应该放在直接参与事件的系统上。这是修复已被积极利用的已知问题的一个组成部分。\n\
  \n4. B. 基于签名的攻击检测方法依赖于了解攻击或恶意软件的样子。零日攻击不太可能存在签名，使得它们成为防止它们的糟糕选择。启发式（行为）检测方法即使在缺乏特定漏洞签名的情况下也能指示系统已被攻破。利用威胁情报来理解新攻击和防御措施是防御零日攻击的重要部分。构建设计良好的分段网络可以限制入侵的影响，甚至防止入侵发生。\n\
  \n5. D. `Windows` 注册表、主文件表 (`Master File Tables`) 和 `INDX` 文件都包含有关文件的信息，通常包括已移除或删除的文件。事件日志不太可能包含有关特定文件位置的信息。\n\
  \n6. C. 由于 `Emily` 的组织使用 `WPA2` 企业版，用户必须经过验证才能使用无线网络。将扫描与经过验证的用户关联将有助于事件响应人员识别执行扫描的设备。\n\
  \n7. A. 通常，取证镜像是从离线系统收集的，以确保制作完整的副本。在像这种保持系统在线更重要的情况下，会使用实时镜像（live image）。\n\n8.\
  \ B. 意外威胁发生在个人错误地执行操作时。这是一个可用性问题的示例。\n\n9. A. 当 `nmap` 返回 `filtered` 时，表示防火墙或 IPS\
  \ 阻止了请求。当 `nmap` 返回 `closed` 时，意味着没有应用程序在监听。\n\n10. D. 尽管漏洞扫描是一重要的控制措施，但 `HIPAA`\
  \ 未提供关于频率的具体要求。\n\n11. C. 最可能的问题是两个主机的 `NTP` 同步问题。\n\n12. D. 报告显示的最严重漏洞是中等风险。服务器\
  \ `D` 拥有该级别最多的漏洞（`8` 个）。\n\n13. C. 由于此类类型事件已发生在近期（通常定义为一年），评估通常会将概率归类为高。\n\n14.\
  \ C. CEO 的建议是持续漏洞扫描的一种合理方法，这种方法在某些组织中使用。\n\n15. B. 这是一个可用性问题的示例。如果数据被修改，将是一个完整性问题，而数据泄露将是一个机密性问题。\n\
  \n16. D. `Technical Report` 将包含特定主机的详细信息，旨在供寻求修复系统的工程师使用。\n\n17. D. `Bob` 需要执行额外的诊断以确定延迟的原因。\n\
  \n18. C. 这张图像显示了基于 SYN 的端口扫描。\n\n19. A. `RADIUS` 发送的密码通过共享密钥和 `MD5` 哈希值进行混淆，这意味着其密码安全性并不高。`RADIUS`\
  \ 网络访问服务器与 `RADIUS` 服务器之间的 `RADIUS` 流量通常使用 `IPsec` 隧道或其他保护进行加密。\n\n\n\n\n\n## 20.\
  \ B. 这种缓慢最可能的原因是块大小不正确。块大小使用 `bs` 标志设置，并以字节为单位。默认情况下，`dd` 使用 512 字节的块大小，但这远小于大多数现代磁盘的块大小。使用更大的块大小通常会快得多，如果你知道正在复制的设备的块大小，使用其原生块大小可以提供巨大的速度提升。这通过类似\
  \ `bs = 64k` 的标志进行设置。`if` 和 `of` 标志分别调整输入和输出文件，但没有迹象表明这些标志是错误的。`count` 标志调整要复制的块数，如果\
  \ Jake 想要镜像整个磁盘，则不应更改它。\n\n## 21. B. 蜜罐（honeypot）被安全研究人员和从业人员用于收集有关攻击者所用技术和工具的信息。蜜罐不能防止攻击者针对其他系统，而且与诱捕系统（tarpit）不同，它的设计并不是为了减慢攻击者。通常，必须对蜜罐数据进行分析，以提供用于构建\
  \ IDS 和 IPS 规则的有用信息。\n\n## 22. B. 高级持续威胁（APTs）是具有高技能和先进能力的攻击者，他们通常关注特定目标。为了实现这些目标，他们经常使用强大的工具获取并维持对系统和网络的长期访问，这允许他们规避检测，并领先于试图移除他们的响应人员。\n\
  \n## 23. B. 在这些选项中，最有用的指标是解决关键漏洞所需的时间。这是一个完全在漏洞修复计划控制范围内的指标，它展示了修复工作的响应能力以及漏洞存在的时间长。每月解决的漏洞数量和新发现漏洞的数量并不是衡量该计划有效性的良好标准，因为它们取决于扫描覆盖的系统和服务数量以及这些服务的性质。\n\
  \n## 24. C. 默认情况下，`nmap` 扫描 1000 个最常见的 TCP 端口。Mike 只知道他扫描的系统在该列表中没有可达的（开放、经过过滤或关闭的）TCP\
  \ 端口。\n\n## 25. D. 一旦通过写阻断器建立连接，就会创建一个校验和（通常使用 `MD5` 或 `SHA1`）。如果该哈希值与取证镜像的哈希值匹配，说明它们完全匹配，这意味着驱动器的内容未被更改，且没有向驱动器添加或删除文件。\n\
  \n## 26. C. 虽然 BIOS 感染相对罕见，但某些恶意软件确实会留在系统的固件或 BIOS 中。一旦进入那里，对硬盘的分析将无法显示感染情况。如果 Ben\
  \ 公司的桌面支持团队已对系统进行了完全补丁，且没有其他系统受到类似的感染，那么 Ben 的下一步应该是验证他之前没有检查的系统元素（例如 BIOS）是完好的。\n\
  \n## 27. C. Wireshark 包含了导出数据包的功能。在这种情况下，Susan 可以通过点击该数据包选择 `GIF89a` 详情，然后将实际图像导出到一个可以查看的文件。\n\
  \n## 28. C. 审计是代表第三方对组织的安全计划或特定合规问题进行的正式审查。审计要求对控制措施进行严格、正式的测试，并由审计师给出关于该实体合规性的正式声明。审计可以根据管理层的要求由内部审计小组进行，也可以由外部审计公司进行，通常是根据组织治理机构或监管机构的要求进行的。\n\
  \n## 29. D. Openvas 是一款开源漏洞扫描产品。`Qualys`、`Nessus` 和 `Nexpose` 都是漏洞扫描器，但都是需要支付许可的商业产品。\n\
  \n## 30. C. 扫描全 TCP 端口可以使用 SYN 扫描（`-sS`）并声明所有可能的端口完整范围（1-65535）。使用 `-sV` 标志启用服务版本识别。\n\
  \n## 31. A. CompTIA 将打补丁视为验证工作的一部分。这与 NIST 标准流程不同；然而，CompTIA 认为补丁、权限检查与设置、扫描以及确保日志正常工作是验证过程的一部分。\n\
  \n## 32. D. Dan 不需要采取任何行动。这是一个非常低关键性的漏洞（1/5），而且可能无法从数据中心外部被利用。没有必要修复此漏洞，也没有迹象表明这是一个误报报告。总的来说，对于\
  \ VPN 服务器来说，这是一个非常干净的扫描结果。\n\n## 33. C. 该规则库包含一条遮蔽规则（shadowed rule）。设计用于拒绝访问被屏蔽网站请求的规则永远不会触发，因为它位于允许访问所有网站的规则之下。交换前两个规则的顺序可以纠正此错误。没有孤立规则，因为规则库中的每条规则都是为了满足安全需求而设计的。没有过度规则（promiscuous\
  \ rules），因为规则并未允许超出范围范围，它们只是顺序错了。\n\n## 34. C. 问题中列出的所有数据源都可能为 Jay 提供有关攻击的进一步信息。然而，防火墙日志最适合回答他关于攻击来源的具体问题。由于防火墙正在执行网络地址转换（`NAT`），它可能包含流量原始（NAT\
  \ 之前）源 IP 地址的日志记录。\n\n## 35. D. 这些结果显示了 Jim 的系统与 CompTIA Web 服务器之间的网络路径。在路径中看到未知设备（用\
  \ `* * *` 表示）并不稀奇，因为这些设备可能被配置为忽略 traceroute 请求。这些查询结果表明网络路径经过了加州，但并不意味着最终目的地位于加州。没有迹象显示网站已宕机`216.182.225.74`\
  \ 是结果中距离 Jim 最近的系统，而 `216.55.11.62` 是距离远程服务器最近的系统。\n\n## 36. D. 无凭证扫描提供的远少于凭证扫描或基于代理的扫描，因为凭证扫描和基于代理的扫描都能从目标系统收集配置信息。外部扫描提供的信息也少于内部扫描，因为会被边界防火墙和其他安全设备过滤。因此，无凭证外部扫描提供的信息最少。\n\
  \n## 37. B. NIST SP800-88 以及许多取证手册要求对驱动器进行完全的零擦除，但不需要多次擦除。消磁（Degaussing）主要用于磁介质（如磁带），可能无法完全擦除硬盘（事实上，它可能会损坏硬盘）。使用\
  \ `ATA Secure Erase` 命令通常用于 SSD。\n\n## 38. B. NIST 建议对所有设备进行时钟同步，以提高响应人员进行分析的能力，这是\
  \ NIST 应急事件响应过程中检测和分析阶段的一部分。虽然这可能发生在准备阶段，但其目的是改进分析过程。\n\n## 39. A. Susan 知道可以使用网络防火墙阻止\
  \ Windows 域服务。只要她构建正确的规则集，就可以防止外部系统向她的 Windows 工作站发送此类流量。她可能仍然想划分网络以保护最重要的工作站，但她的第一步应该是使用防火墙防止流量到达工作站。\n\
  \n\n\n\n\n### 40.\nFred 的 `SNMP` 命令向名为 `device1` 的系统请求了路由表。在本地系统上可以使用 `netstat -nr`\
  \ 复制此操作。`traceroute` 命令提供了两个系统之间路径的信息。可以使用 `route` 命令获取这些信息，但此处列出的命令是添加默认网关，而不是查询当前信息。`ping\
  \ -r` 记录了在指定次数（1 到 9 次之间）访问某个站点时经过的路由。\n\n### 41.\n当互联网工程任务组（`IETF`）认可 `SNMP v3.0`\
  \ 为标准标准时，它将所有早期版本的 `SNMP` 都标记为过。Shannon 应该将此设备升级到 `SNMP 3.0`。\n\n### 42.\n隔离网络中的系统使用逻辑控制与网络的其余部分完全隔离，这些控制防止了任何访问。为了操作他需要访问的系统，Frank\
  \ 需要添加防火墙规则允许其远程访问这些系统，或者通过物理方式与这些系统操作。\n\n### 43.\n在运行 `bash` shell 的 Linux 系统上，`$home/.bash_history`\
  \ 将包含最近执行操作的日志。其他每一项都是为了这个问题虚构的。\n\n### 44.\n`NIST SP-800-88` 建议清除介质，然后验证并记录其已清除。清除使用逻辑技术对用户可寻存储位置中的数据进行清理，并防止非侵入性数据恢复技术。这种安全级别适用于留在组织内部的介质上的中度敏感数据。\n\
  \n### 45.\n任务 3 在关键性和难度之间取得了最佳平衡。它允许她仅投入 6 小时就能修复一个中等关键性问题。任务 2 的关键性更高，但需要 12 周才能解决。任务\
  \ 1 的关键性相同，但需要一天时间修复。任务 4 的关键性较低，但解决所需的时间与任务 1 。\n\n### 46.\n使用被盗的 cookie 是会话劫持攻击的标志。这些攻击重点在于接管已存在的会话，通过获取远程服务器用于验证会话的会话密钥或\
  \ cookie，或者让会话通过攻击者控制的系统，允许他们参与会话。\n\n### 47.\nPete 的组织正在使用基于代理的带外 `NAC` 解决方案，该方案依赖于本地安装的代理来与现有网络基础设施设备通信其系统的安全状态。如果\
  \ Pete 的组织使用专用设备，它将是带内解决方案，而且当然，没有安装代理将使其成为无代理的。\n\n### 48.\n注册表包含用于使程序在启动时运行的自动运行键。此外，计划任务、单个用户启动文件夹以及放置在程序运行位置的\
  \ `DLLs`（通常是恶意的 `DLLs`）都是文件在启动或用户登录时自动运行的地点。\n\n### 49.\n此场景中最大的问题是这两个因素都是基于知识的因素。真正的多因素系统依赖于两种以上类型的不同因素，包括你所知道的、你拥有的或你所特征的（有时还包括你所在的所在地）。该系统依赖于你所知道的两个因素，攻击者在成功的攻击中很可能从同一个位置获取这两种信息。\n\
  \n### 50.\n数据易失性顺序衡量了数据丢失的难易程度。`Volatility` 是内存取证的工具。\n\n### 51.\n如果 Pete 的组织使用专用设备，它将是带内解决方案，而且当然，没有安装代理将使其成为无代理的。\n\
  \n### 52.\n注册表包含用于使程序在启动时运行的自动运行键。此外，计划任务、单个用户启动文件夹以及放置在程序运行位置的 `DLLs`（通常是恶意的 `DLLs`）都是文件在启动或用户登录时自动运行的地点。\n\
  \n### 53.\n在开放重定向攻击中，用户可能会被发送到真实的身份验证服务器，然后通过 `OAuth` 流程被重定向到不可信的服务器。\n\n### 54.\n\
  威胁情报馈送和员工的通知都是常见来源。\n\n### 55.\n基于上下文的认证可能利用一天时间、位置、设备指纹、访问频率、用户角色、组组成以及 IP 地址/信誉。\n\
  \n### 56.\n密码复杂性的增加并没有增加添加的安全性，因为复杂的密码仍可能被钓鱼攻击破解；多因素身份验证的实施成本通常很高，而且基于 `OAuth` 的单登录无法防止钓鱼攻击；相反，它可以让攻击者更容易在不同服务之间移动。\n\
  \n### 57.\n数据封获可以帮助 Max 记录他的渗透测试并收集有关远程系统的额外信息，并帮助排查连接和其他网络问题；嗅探器本身对于扫描没有用处。\n\n\
  ### 58.\nRich 不应该尝试独自解决此问题或规定某个特定的解决方案。相反，他应该与业务智能团队合作，找到一种既能满足他们的业务需求又能通过扫描实现安全目标的方法。\n\
  \n### 59.\n《格姆-莱奇-布莱法案》（`GLBA`）专门适用于金融机构持有信息的安全和隐私。`HIPAA` 适用于医疗保健提供者。`PCI DSS`\
  \ 适用于任何参与信用卡交易处理的人员。这包括金融机构，但不仅限于这些机构，因为它也适用于商户和服务提供商。《萨班斯-奥克斯利法案》适用于所有上市公司，这包括但不限于某些金融机构。\n\
  \n### 60.\n允许员工将个人拥有的设备带入公司网络的策略被称为自带设备（`BYOD`）策略。公司所有个人许可（`COPE`）策略允许员工将公司设备用于个人。`SAFE`\
  \ 不是一种移动设备策略。\n\n### 61.\nRichard 知道以只读模式挂载取证镜像非常重要。为了防止可执行文件的任何问题，他还将挂载的镜像设置为 `noexec`。他还利用了\
  \ `mount` 命令内置的自动文件类型识别功能，并将设备设置为循环设备，以便在挂载后直接与文件进行交互。\n\n### 62.\n盲 SQL 注入漏洞很难检测，是误报报告的臭名源源。Javier\
  \ 应该验证人员执行的测试结果，但应该能够接受这可能是误报报告的可能性，因为这是最可能的情况。\n\n\n\n\n\n## 64. B. 当没有更好的端口扫描工具时，`netcat`\
  \ 常被用作端口扫描器`-z` 标志是零 I/O 模式，用于扫描。虽然 `-v` 有用，但扫描并非必需，且它本身不会提供扫描结果。`-sS` 标志由 `nmap`\
  \ 使用，而不是 `netcat`。\n\n## 65. D. 设计用于向人员警报设施被入侵的入侵报警是物理控制的典型例子，因为它们正在监控物理入侵。报警的设计不属于管理控制，但对报警做出反应的过程将属于该类别。物理入侵报警不是逻辑控制，尽管网络入侵检测系统是逻辑控制。没有迹象表明该报警将补偿未能满足另一项控制目标的失败，因此它不是补偿性控制。\n\
