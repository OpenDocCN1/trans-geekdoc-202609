  \ show`\n4. `intf -q`\n\n62. 这里显示的是哪种 Windows 内存保护方法？\n\n![](img/c03uf012.jpg)\n\
  \n1. `DEP`\n2. `ASLR`\n3. `StackProtect`\n4. `MemShuffle`\n\n63. 取证调查显示，调查目标使用了\
  \ Windows 快速格式命令尝试破坏 USB 闪盘上的证据。调查目标在试图隐藏证据时使用了哪种 NIST 净化技术？\n\n1. Clear（清除）\n2.\
  \ Purge（净化）\n3. Destroy（销毁）\n4. 以上均不是\n\n64. Angela 想使用她的网络安全设备检测潜在的信标行为（beaconing\
  \ behavior）。以下哪个选项最适合使用她的网络安全设备检测信标行为？\n\n1. 反病毒定义库\n2. 文件声誉\n3. IP 声誉\n4. 静态文件分析\n\
  \n65. 在事件响应过程中，Susan 将一个系统接回网络，允许其正常网络访问。Susan 正在执行事件响应过程的哪一阶段？\n\n1. 准备\n2. 检测与分析\n\
  3. 遏制、根除与恢复\n4. 事件后活动\n\n66. Chris 负责监控的数据中心的一台服务器意外连接到一个离线 IP 地址，并向远程系统传输了 9GB\
  \ 数据。Chris 应该启用什么类型的监控来最好帮助他检测未来发生的此类事件？\n\n1. 带有启发式分析的流日志\n2. 带有启发式分析的 SNMP 监控\n\
  3. 带有特征检测的流日志\n4. 带有特征检测的 SNMP 监控\n\n67. 在事件响应过程中，Jennifer 完成了事件的初始阶段，正在评估恢复所需。使用\
  \ NIST 分类，她应该如何对此分类？\n\n1. 常规（Regular）\n2. 补充（Supplemented）\n3. 扩展（Extended）\n4.\
  \ 不可恢复（Not recoverable）\n\n68. 下列哪种取证技术在检查期间不是有效的方法？\n\n1. 使用取证设备\n2. 使用取证 SIM 卡\n\
  3. 使用防静袋\n4. 使用飞行模式\n\n69. Rick 想监控 Linux 系统上的权限更改。他可以使用哪种 Linux 工具？\n\n1. `watchdog`\n\
  2. `auditctl`\n3. `dirwatch`\n4. `monitord`\n\n70. 作为其工作的一部分，Janet 删除了她下载的所有文件。她应该使用以下哪项替代？\n\
  \n1. 网络流\n2. SMB 日志\n3. 浏览器缓存\n4. 驱动器分析\n\n71. Joe 意识到攻击者已经入侵了他的网络，但想观察攻击者的行为。他应该使用哪种方法？\n\
  \n1. 移除（Removal）\n2. 隔离（Isolation）\n3. 分段（Segmentation）\n4. 检测（Detection）\n\n72.\
  \ Charles 上班时发现一封邮件写着“你们系统很脆弱”。他如何分类这一信号？\n\n1. 指标（Indicator）\n2. 威胁（Threat）\n3.\
  \ 风险（Risk）\n4. 先兆（Precursor）\n\n73. 在事件响应过程中，Cynthia 进行了教训回顾。她处于哪一阶段？\n\n1. 准备\n\
  2. 检测与分析\n3. 遏制、根除与恢复\n4. 事件后活动\n\n74. 作为其计划的一部分，Allan 正在为零日威胁设计剧本（playbook）。以下哪项不应该在他的计划中？\n\
  \n1. 分段（Segmentation）\n2. 补丁（Patching）\n3. 使用威胁情报\n4. 白名单（Whitelisting）\n\n75. 作为组织的\
  \ CISO，Jennifer 正基于 NIST 设计分类方案。她应该使用以下哪个选项来描述访问未授权文件的行为？\n\n1. 事件\n2. 事件\n3. 不良事件\n\
  4. 安全事件\n\n76. Fred 想识别能够将个人放置在特定时间的数字证据。以下哪类型的取证数据不常用于记录特定位置？\n\n1. 手机 GPS 日志\n\
  2. 照片元数据\n3. 手机基站日志\n4. Microsoft Office 文档元数据\n\n77. Cynthia 完成了介质净化的验证过程，并对使用内置加密擦除工具净化的驱动器进行了抽样检查。她的下一步是什么？\n\
  \n1. 再次抽样以验证。\n2. 销毁驱动器。\n3. 文档记录\n4. 她已完成，可以对驱动器处置。\n\n78. 作为小型公司信息安全经理，Mike 的招聘正式员工预算有限。虽然他的团队可以处理简单的病毒感染，但他目前没有处理重大信息安全事件的方法。Mike\
  \ 应该调查哪些选项以确保他的公司对安全事件做好准备？\n\n1. 外包第三方 SOC。\n2. 创建内部 SOC。\n3. 招聘内部事件响应团队。\n4. 外包事件响应提供商。\n\
  \n79. Stuxnet 攻击依赖于携带恶意软件的工程师跨越了网络之间的物理隔离。哪种类型的威胁最可能跨越物理隔离网络？\n\n1. 电子邮件\n2. 网页\n\
  3. 可移动介质\n4. 损耗\n\n\n\n\n\n## 80. Dan 在检查网络是否存在违规设备时，他注意到一个 MAC 地址为 `D4:BE:D9:E5:F9:18`\
  \ 的系统已连接到他大楼内一个办公室的交换机上三天了。如果他对该办公室进行实地调查，这些信息可以为 Dan 提供什么可能的帮助？\n\n1. 设备的操作系统\n\
  2. 系统的用户\n3.构建该系统的供应商\n4. 连接的设备类型\n\n## 81. Frank 希望确保媒体已经过妥善清理。下列选项中，按有效性从低到高正确列出清理描述的是？\n\
  \n1. 净化 (Purge)、清除 (Clear)、破坏 (Destroy)\n2. 消除 (Eliminate)、根除 (Eradicate)、破坏 (Destroy)\n\
  3. 清除 (Clear)、净化 (Purge)、破坏 (Destroy)\n4. 根除 (Eradicate)、消除 (Eliminate)、破坏 (Destroy)\n\
  \n## 82. 消磁（Degaussing）是哪种形式媒体清理的例子？\n\n1. 清除 (Clearing)\n2. 净化 (Purging)\n3. 破坏\
  \ (Destruction)\n4. 它不是一种媒体清理形式\n\n## 83. Brian 在检查 Windows 系统上的存储使用情况时，检查了所示的卷影子复制存储：\n\
  \n```\nC:\\WINDOWS\\system32>vssadmin list Shadowstorage\n\nvssadmin 1.1 - Volume\
  \ Shadow Copy Service administrative command-line tool\n\n(C) Copyright 2001-2013\
  \ Microsoft Corp.\n\nShadow Copy Storage association\nFor volume: (C:)\\\\\\?\\\
  Volume{c3b53dae-0e54-13e3-97ab-806e6f6e6963}\\\nShadow Copy Storage volume: (C:)\\\
  \\\\?\\Volume{c3b53dae-0e54-13e3-97ab-806e6f6e6963}\\\nUsed Shadow Copy Storage\
  \ space: 25.6 GB (2%)\nAllocated Shadow Copy Storage space: 26.0 GB (2%)\nMaximum\
  \ Shadow Copy Storage space: 89.4 GB (10%)\n```\n\n这种存储有什么什么用途，他可以安全地删除它吗？\n\n1.\
  \ 它提供了块级快照，可以安全地删除。\n2. 它提供了安全的隐藏存储，可以安全地删除。\n3. 它提供了安全的隐藏存储，不能安全地删除。\n4. 它提供了块级快照，不能安全地删除。\n\
  \n## 84. 在典型工作日的结束时，Danielle 收到通知，她的组织的电子邮件服务器被列入黑名单，因为邮件源自她的域名。她需要什么信息来开始调查垃圾邮件的来源？\n\
  \n1. 显示 SMTP 连接的防火墙日志\n2. 来自其电子邮件服务器的 SMTP 审计日志\n3. 其中一条垃圾邮件的完整标头\n4. 她的网络流数据\n\n\
  ## 85. Lauren 在取证调查中恢复了若干 16GB 和 32GB 的 microSD 卡。在不进行手动检查的情况下，她最可能发现这些卡的格式化类型就像它们被用于数码相机的一样？\n\
  \n1. RAW\n2. FAT16\n3. FAT32\n4. HFS+\n\n## 86. Alex 在检查带宽消耗问题时，在他正在审查的 Linux 机器上使用了\
  \ `ifconfig` 命令。他看到设备发送的数据少于 4Gb，但他的网络流日志显示系统已发送了 20Gb。Alex 遇到了什么问题？\n\n1. 根内核程序\
  \ (Rootkit) 隐藏了 Linux 内核的流量。\n2. 流日志显示未到达系统的流量。\n3. `ifconfig` 在 4Gb 时重置流量计数器。\n\
  4. `ifconfig` 只对出站流量进行采样，不会提供准确信息。\n\n## 87. Brian 到达调查现场后，确定需要三台开启的计算机进行取证检查。在移除\
  \ PC 之前他应该采取哪些步骤？\n\n1. 将它们关机并拍摄其连接照片。\n2. 将它们关机并将其密封。\n3. 收集现场信息，拍摄其照片并将其密封。\n\
  4. 收集静态镜像，验证其哈希值并将其密封。\n\n## 88. 在作为取证员的情况下，Lucas 被要求提供诉讼相关的证据。这个过程称为什么？\n\n1. 刑事取证\
  \ (Criminal)\n2. 电子数据发现 (E-discovery)\n3. 净化 (Purging)\n4. 民事取证 (Civil)\n\n## 89.\
  \ 在组织的事件响应准备期间，Charles 和 Lauren 正在识别关键资产。其中包括客户姓名、地址、电话和人口统计数据。他们应该如何分类这些信息？\n\n\
  1. PII (个人身份信息)\n2. 知识产权\n3. PHI (个人健康信息)\n4. PCI (支付行业标准)\n\n## 90. 当 Lauren 研究公司的取证工作手册时，她注意到取证人员必须使用保管链表。如果她在进行调查，她应该在表上记录哪些信息？\n\
  \n1. 所有的文件\n2. 操作员\n3. 接触人员\n4. 执法人员\n\n## 91. Scott 需要确保他重建后的系统是安全的。哪种类型的扫描能为他的目标提供最有用的信息？\n\
  \n1. 从信赖网络进行身份扫描\n2. 从信赖网络进行非身份扫描\n3. 从不可信网络进行身份扫描\n4. 从不可信网络进行非身份扫描\n\n## 92. 管理层在事件响应中的主要角色是什么？\n\
  \n1. 领导 CSIRT\n2. 作为执法部门的主要接口\n3. 提供权限和资源\n4. 评估对影响者的影响\n\n## 93. Chris 在查看 OSSEC\
  \ SIEM 日志时发现了以下条目。如果他想快速识别新用户的创建日期和时间，他的下一步操作应该是？\n\n1. 检查 user.log。\n2. 检查 syslog。\n\
  3. 检查 `/etc/passwd`。\n4. 检查 auth.log。\n\n## 94. Jessica 希望在 Windows 系统上运行可执行文件时跟踪注册表和文件系统的更改。哪种\
  \ Sysinternals 工具可以让她实现这一点？\n\n1. App Monitor\n2. Resource Tracker\n3. Process Monitor\n\
  4. 没有具有此功能的 Sysinternals 工具\n\n## 95. Frank 希望提高他作为组织 CSIRT 负责人对事件分析过程的效率。根据 NIST\
  \ 指南，下列哪项不是通常建议的最佳实践？\n\n1. 对网络和系统进行分析以测量预期活动的特征。\n2. 执行事件关联以便来自多个来源的信息。\n3. 为每个系统和设备维护备份。\n\
  4. 在怀疑发生事件时捕捉网络流量。\n\n## 96. NIST 描述了事件响应循环中的四个主要阶段。下列哪项不是其中四个之一？\n\n1. 抑制、根除和恢复\n\
  2. 通知与通信\n3. 检测与分析\n4. 准备\n\n## 97. Charles 想要对 Windows 系统进行内存取证并并访问 `pagefile.sys`。当他尝试复制它时，收到了以下错误。访问页面文件需要什么访问方法？\n\
  \n1. 以管理员身份运行 Windows 管理器并重复复制。\n2. 使用 `fmem` 打开文件。\n3. 以管理员身份运行 `cmd.exe` 并重复复制。\n\
  4. 关闭系统，移除驱动器并从另一个系统复制。\n\n\n\n\n\n## 98. Chris 想要防止无线网络遭受恶性孪生攻击（evil twin attacks）。以下哪项不是检测恶性孪生设备的有效方法？\n\
  \n1. 检查 `BSSID`。\n2. 检查 `SSID`。\n3. 检查属性（`channel`、`cipher`、认证方法）。\n4. 检查如组织唯一标识符（OUI）之类的标记参数。\n\
  \n## 99. 在下面的 Windows 分区图中，哪里可以找到空隙（slack space）？\n\n![](img/c03uf015.jpg)\n\n1.\
  \ 系统保留分区（System Reserved）\n2. 系统保留分区和未分配分区\n3. 系统保留分区和 `C:` 分区\n4. `C:` 分区和未分配分区\n\
  \n## 100. Luke 需要验证 macOS 电脑上的设置，以确保他预期的配置项设置正确。通常使用什么类型的文件来存储 macOS 系统的配置设置？\n\n\
  1. 注册表（registry）\n2. `.profile` 文件\n3. `Plists`\n4. `.config` 文件\n\n## 101. Adam\
  \ 需要为他组织的事件数据确定适当的保留策略。如果他想遵循行业惯做法，且没有需要满足特定的法律或合同义务，他应该选择多长时间跨度？\n\n1. 30 天\n2.\
  \ 90 天\n3. 1 到 2 年\n4. 7 年\n\n## 102. Alice 识别出信标流量（beaconing traffic）来源的系统是组织的关键电子商务服务器之一。为了维持组织的运营，她需要迅速将服务器恢复到原始未受破坏的状态。哪种标准最可能受到此操作的影响？\n\
  \n1. 对系统或服务的损坏\n2. 服务可用性\n3. 保护证据的能力\n4. 执行该策略所需的时间和资源\n\n## 103. 在法证调查过程中发现潜在犯罪活动并报警执法部门后，现场的执法人员扣收了三台服务器。Joe\
  \ 预计什么时候能取回他的服务器？\n\n1. 30 天后，这提供了足够的时间进行合理的镜像制作。\n2. 6 个月后，根据法律要求。\n3. 1 年后，因为大多数案件会在这段时间内得到解决。\n\
  4. Joe 不应该计划返回的时间范围。\n\n## 104. Lauren 想要创建一个第三方调查人员可以使用的取证镜像，但她不知道公司打算聘用的第三方调查小组将使用什么工具。如果她希望几乎任何取证工具都能访问该镜像，她应该选择以下哪种取证格式？\n\
  \n1. `E01`\n2. `AFF`\n3. `RAW`\n4. `AD1`\n\n## 105. 在 Janet 试图隐藏下载重要公司信息的行为被发现后，法调查人员发现她经常将工作文件复制到\
  \ USB 驱动器。以下哪些不是手动检查其 Windows 工作站以前连接过的 USB 驱动器列表的方法？\n\n1. 检查安全审计日志。\n2. 检查 `setupapi`\
  \ 日志文件。\n3. 搜索注册表（`registry`）。\n4. 检查用户配置文件。\n\n## 106. 作为调查的一部分，Scott 打算对重点关注的网络共享进行制作取证镜像。他将无法捕获哪些信息？\n\
  \n1. 文件日期\n2. 删除的文件\n3. 文件元数据\n\n## 107. NIST SP 800-61 识别了事件响应团队通常会与之沟通的双方。以下哪项不是之一？\n\
  \n1. 客户\n2. 互联网服务供应商\n3. 执法部门\n4. 法律顾问\n\n## 108. 哪些常见的事件响应活动包含了“需要哪些额外资源？”的问题\n\
  \n1. 准备（Preparation）\n2. 经验总结（Lessons-learned）\n3. 证据收集（Evidence gathering）\n4.\
  \ 流程（Procedural）\n\n## 109. Susan 被要求按照易失性顺序捕获数据。哪个顺序是正确的？\n\n1. `Network traffic`、`CPU\
  \ cache`、`disk drives`\n2. `CPU cache`、`network traffic`、`disk drives`\n3. `Optical\
  \ media`、`disk drives`、`network traffic`\n4. `Network traffic`、`disk drives`、`optical\
  \ media`\n\n## 110. 在事件处理过程中，Susan 前往受攻击的系统。Susan 正在执行哪个阶段？\n\n1. 准备\n2. 检测与分析\n\
  3. 遏制、根除和恢复\n4. 事件后活动\n\n## 111. Scott 需要验证他创建的取证镜像是驱动器的副本。以下哪种方法被认为在法上是可靠的？\n\n\
  1. 创建 `MD5` 哈希值\n2. 创建 `SHA-1` 哈希值\n3. 创建 `SHA-2` 哈希值\n4. 以上所有\n\n## 112. NIST 建议在事件过程中通过什么策略识别攻击者\n\
  \n1. 使用地理 IP 追踪识别攻击者。\n2. 联系上游 ISP 协助追踪攻击者。\n3. 联系执法部门以便他们使用工具。\n4. 识别攻击者不是其中的重要部分。\n\
  \n## 113. Rick 正在对系统进行法证调查。他从用户报告中知道问题大约从 6 月 12 日下午 3:30 左右开始。使用 SIFT 取证工具，他应该使用什么过程来确定发生了什么？\n\
  \n1. 在驱动器中搜索下午 3 点到 4 点之间所有更改过的文件。\n2. 创建超级时间线（Super Timeline）。\n3. 运行反恶意软件并搜索该时间段内新安装的工具。\n\
  4. 搜索系统日志中下午 3 点到 4 点之间的事件。\n\n## 114. Charles 认为攻击者可能在 Linux 工作站增加了账户并尝试获取额外权限。以下哪项不是检查账户的常用方法？\n\
  \n1. 检查 `/etc/passwd` 和 `/etc/shadow` 中的意外账户。\n2. 检查 `/home/` 下的用户目录。\n3. 检查 `/etc/sudoers`\
  \ 中的意外账户。\n4. 检查 `/etc/groups` 中的组问题。\n\n## 115. Ben 希望与信息安全社区的其他组织协调，共享数据、事件以及新安全问题的警告。他应该加入什么类型的组织？\n\
  \n1. `ISAC`\n2. `CSIRT`\n3. `VPAC`\n4. `IRT`\n\n## 116. 在调查垃圾邮件时，Adam 获取了其中一封接收邮件的头部。他注意到发送者是\
  \ Carmen Victoria Garci。他从这些头部中可以得出哪些事实？\n\n![](img/c03uf016.jpg)\n\n1. Victoria\
  \ Garci 的邮箱地址是 `tntexpress819@yahoo.com`。\n2. 发送者通过 Yahoo 发送。\n3. 发送者通过日本的系统发送。\n\
  4. 发送者通过 Gmail 发送。\n\n## 117. Lauren 需要访问一个 macOS 系统但没有用户密码。如果该系统没有开启 FileVault，以下哪些选项不是有效的恢复方法？\n\
  \n1. 使用单用户模式重置密码。\n2. 使用恢复模式恢复密码。\n3. 使用目标磁盘模式（Target Disk mode）删除钥匙串（Keychain）。\n\
  4. 从另一个具有特权的用户账户重重置密码。\n\n\n\n\n\n# 118. 在对 iPhone 备份进行取证分析时，Cynthia 发现她只获得了一些预期手机中包含的部分信息。导致她所使用的备份包含部分信息最可能的情况是什么？\n\
  \n1. 备份被中断。\n2. 备份已加密。\n3. 备份是差异备份。\n4. 备份存储在 iCloud 中。\n\n# 119. Chris 想要确保他的保管链（chain\
  \ of custody）文档能够经受法庭的审查。以下哪种选项能为他提供其行为的最佳文件证明？\n\n1. 第二名取证员作为证人并对所有操作会签字\n2. 由公证员签名并盖章的完整取证日志\n\
  3. 具有必要签字确认的记录化取证过程\n4. 对所有独立的取证操作进行拍照\n\n# 120. Cynthia 正在审查其组织的事件响应恢复流程，该流程如下所示。她应该提出哪些建议，以确保在恢复过程中不再发生进一步的问题？\n\
  \n![](img/c03uf017.jpg)\n\n1. 从备份恢复之前更改密码。\n2. 在从备份恢复之前隔离系统。\n3. 在恢复之前安全地擦除驱动器。\n\
  4. 在补丁之前进行漏洞扫描。\n\n# 121. 在对系统硬盘进行零值擦除并使用所有安全补丁和信任账户重建系统后，Lauren 接通知系统再次显示出受入侵迹象。以下哪种类型的恶意软件无法通过这种清除清除？\n\
  \n1. 驻 MBR 的恶意软件工具\n2. 驻 UEFI 的恶意软件\n3. 驻 BIOS 的恶意软件\n4. 驻空闲空间（slack space）的恶意软件包\n\
  \n# 122. 专利、版权、商标和商业秘密都与哪种类型的数据相关？\n\n1. PII（个人身份信息）\n2. PHI（个人健康信息）\n3. 公司机密\n\
  4. 知识产权\n\n# 123. 以下哪种问题通常与 BYOD（自带设备）设备不相关？\n\n1. 网络利用率增加\n2. 设备成本增加\n3. 支持工单增加\n\
  4. 安全风险增加\n\n# 124. Saria 正在取证工作的一部分审查驱动器内容，并注意到她正在查看的文件在磁盘上占用的空间比其实际大小大，如下。她发现了什么？\n\
  \n![](img/c03uf018.jpg)\n\n1. 空闲空间（Slack space）\n2. 隐藏内容\n3. 稀疏文件（Sparse files）\n\
  4. 加密开销\n\n# 125. 美国联邦政府机构事件数据的最短保留期限是多少？\n\n1. 90 天\n2. 1 年\n3. 3 年\n4. 7 年\n\n\
  # 126. Kathleen 在重大入侵后正在恢复关键业务系统的运行，需要验证操作系统和应用程序文件是合法的，且没有包含任何恶意代码。她应该使用哪种工具来验证这一点？\n\
  \n1. 可信系统二进制文件包\n2. 动态代码分析\n3. 静态代码分析\n4. 文件彩虹表（rainbow tables）\n\n# 127. Charles\
  \ 想要验证 Linux 服务的认证是否设置了双重身份验证要求。如果应用程序支持，可以检查哪个常见的 Linux 目录来查看此类应用的设置？\n\n1. `/etc/pam.d`\n\
  2. `/etc/passwd`\n3. `/etc/auth.d`\n4. `/etc/tfa`\n\n# 128. Charles 正在为一台参与外部第三方系统攻击的计算机创建证据日志。如果想遵循\
  \ NIST 的建议，他应该在日志中包含哪些网络相关信息？\n\n1. 子网掩码、DHCP 服务器、主机名、MAC 地址\n2. IP 地址、MAC 地址、主机名\n\
  3. 域名、主机名、MAC 地址、IP 地址\n4. NIC 制造商、MAC 地址、IP 地址、DHCP 配置\n\n# 129. Chris 认为他网络上的系统已被高级持续性威胁（APT）攻击者入侵。他观察到，从通常不向这些位置发送数据的系统出发，通过\
  \ TLS 保护的 HTTP 会话向远程站点发送了大量文件传输。以下哪种技术最可能检测到 APT 感染？\n\n1. 网络流量分析\n2. 网络取证\n3. 终端行为分析\n\
  4. 终端取证\n\n# 130. 在向 VirusTotal 提交一个怀疑的恶意软件包后，Alex 收到了以下结果。这告诉 Alex 什么？\n\n![](img/c03uf019.jpg)\n\
  \n1. 提交的文件包含多个恶意软件包。\n2. 杀毒软件厂商对同一个恶意软件使用不同的名称。\n3. VirusTotal 无法专门识别该恶意软件。\n4.\
  \ 该恶意软件包是多态的，匹配将是错误的。\n\n# 131. Ben 正在调查他公司一名高级经理笔记本电脑可能存在的恶意软件感染。当经理打开一个需要用户输入的文档、网站或其他应用程序时，单词开始像被输入的一样出现。Ben\
  \ 在调查中应该采取的第一步是什么？\n\n1. 运行杀毒病毒扫描。\n2. 将系统断开网络。\n3. 擦除系统并重新安装。\n4. 观察并记录正在输入的内容。\n\
  \n# 132. Kathleen 对一台可能被用于访问敏感公司数据的笔记本进行了取证分析，显示嫌疑人试图通过删除原始文件并将其他文件复制到驱动器，作为反取证活动的一部分来覆盖他们下载的数据。Kathleen\
  \ 最可能在哪里找到原始文件的证据？\n\n1. MBR\n2. 未分配空间（Unallocated space）\n3. 空闲空间（Slack space）\n\
  4. FAT\n\n# 133. 作为网络基础设施测试的一部分，Kelly 使用 `snmpwalk` 验证路由器设置。她执行了如下的 `snmpwalk`：\n\
  \n```\nsnmpwalk -c public 10.1.1.1 -v1\niso.3.6.1.2.1.1.0 = STRING: \"RouterOS 3.6\"\
  \niso.3.6.1.2.1.2.0 = OID: iso.3.6.1.4.1.30800\niso.3.6.1.2.1.1.3.0 = Timeticks:\
  \ (1927523) 08:09:11\niso.3.6.1.2.1.1.4.0 = STRING: \"root\"\niso.3.6.1.2.1.1.5.0\
  \ = STRING: \"RouterOS\"\n```\n\n此查询无法发现哪些信息？\n\n1. 启用了 SNMP v1。\n2. 团体名为 public。\n\
  3. 团体名为 root。\n4. 联系人为 root。\n\n# 134. Laura 需要在 Mac 上检查内存、CPU、磁盘、网络和功率使用。她可以使用哪种\
  \ GUI 工具来检查这些？\n\n1. 资源监器（Resource Monitor）\n2. 系统监器（System Monitor）\n3. 活动监器（Activity\
  \ Monitor）\n4. Sysradar\n\n# 135. Angela 想要访问 Bitocker 加密系统的解密密钥，但系统已关闭。如果 Windows\
  \ 系统已关闭，以下哪种方法是行的？\n\n1. 休眠文件分析\n2. 内存分析\n3. 启动扇分析\n4. 暴力破解\n\n# 136. Adam 认为网络上的某个系统被感染了但他不知道是哪一个。为了检测感染，他根据以下伪代码为网络监控软件创建了一个查询。他最可能在检测什么种类型的流量？\n\
  \n```\ndestip: [*] and duration < 10 packets and destbytes < 3000 and flowcompleted\
  \ = true\nand application = http or https or tcp or unknown and content != uripath:*\
  \ and content\n!= contentencoding:*\n```\n\n1. 用户访问恶意网站\n2. 广告软件\n3. 标回（Beaconing）\n\
  4. 出站端口扫描\n\n\n\n\n\n## 137. Casey 在法证调查期间寻找一个可能的 Linux 后门账户，这促使她检查文件系统以发现问题。她应该在哪里查找与服务相关的后门？\n\
  \n1. `/etc/passwd`\n2. `/etc/xinetd.conf`\n3. `/etc/shadow`\n4. `$HOME/.ssh/`\n\n\
  ## 138. 作为美国政府的一员，Megan 需要使用 NIST 的信息影响类别对安全事件进行分类。在最近的一次事件中，所有权信息被更改。她应该如何对这次事件分类？\n\
  \n1. 视为隐私泄露\n2. 视为完整性丢失\n3. 视为所有权泄露\n4. 视为可用性破坏\n\n## 139. 证据的保护通常在事件的哪个阶段处理？\n\n\
  1. 准备阶段\n2. 检测与分析\n3. 遏制、根除与恢复\n4. 事件后活动\n\n## 140. Susan 正在查看事件日志，以确定谁在下班后访问了工作站。当她在正在查看的\
  \ Windows 系统上运行 `secpol.msc` 时，她看到了以下设置。她的日志中将缺少哪些重要信息？\n\n![](img/c03uf020.jpg)\n\
  \n1. 登录失败\n2. 登录时的用户 ID\n3. 成功登录\n4. 登录时间\n\n## 141. Cynthia 在检查其 Linux 系统使用情况时运行了此处所示命令。根据显示的信息，以下哪个说法是正确的？\n\
  \n![](img/c03uf021.jpg)\n\n1. 有两个用户通过 `ssh` 远程登录。\n2. 正在进行一个使用 Monkeycom 漏洞的活跃攻击。\n\
  3. 本地系统是 demo.com 域的一部分。\n4. 系统未提供任何 UDP 服务。\n\n## 142. Lucas 想要清除一个硬盘，以确保数据在被送往场外时无法从中提取。以下哪项不是在\
  \ Windows 系统上对硬盘进行擦除（purging）的有效选项？\n\n1. 使用 Windows 内置的 `sdelete` 命令行。\n2. 使用 Eraser。\n\
  3. 使用 DBAN。\n4. 加密硬盘然后删除密钥。\n\n## 143. Charleen 工作的公司正在准备合并，在一段静默期，她发现包含合并细节的公司安全文件服务器已被破解。在她编写报告时，她应该如何最准确地对被泄露的数据分类？\n\
  \n1. PII（个人身份信息）\n2. PHI（受健康信息）\n3. 知识产权\n4. 公司机密数据\n\n## 144. 以下哪项不是实时取证镜像（live\
  \ forensic imaging）的有效用例？\n\n1. 恶意软件分析\n2. 加密驱动器\n3. 事后法证分析\n4. 不支持的文件系统\n\n## 145.\
  \ 如果将 `[username]` 替换为正在检查的用户 ID，以下哪个命令是确定 Linux 系统上用户账户多旧的标准方法？\n\n1. `userstat\
  \ [username]`\n2. `ls -ld /home/[username]`\n3. `aureport -auth | grep [username]`\n\
  4. 以上均不是\n\n## 146. 对网络和系统进行画像分析有助于识别意外活动。一旦创建了配置文件，可以使用什么类型的检测？\n\n1. 动态分析\n2.\
  \ 异常分析\n3. 静态分析\n4. 行为分析\n\n## 147. Jennifer 在审查事件响应过程中采取的行动时，当地桌面支持人员告诉她受感染机器已通过\
  \ Windows 系统还原点恢复了服务。以下哪些项目将通过 Windows 系统还原恢复到之前的状态？\n\n1. 个人文件\n2. 恶意软件\n3. Windows\
  \ 系统文件\n4. 所有已安装的应用\n\n## 148. 在重大事件响应工作期间，Ben 发现证据表明一个关键应用程序服务器可能是数据存储库和外泄点。如果他无法将系统离线，以下哪些选项将能提供最好的法证数据？\n\
  \n1. 重启服务器并使用 USB 启动。\n2. 使用 FTK Imager 创建映像。\n3. 使用 Volatility 内存。\n\n## 149. Charles\
  \ 想要监控 Windows 系统上的文件更改。他应该启用什么类别？\n\n1. 文件\n2. 用户权限\n3. 文件系统\n4. 审核对象\n\n## 150.\
  \ Charles 在 `/var/log` 中发现了以下条目。如果他是具有 root 权限的唯一用户，且登录需要双重身份验证，他应该检查什么？\n\n![](img/c03uf022.jpg)\n\
  \n## 151. 一名不满的员工利用她负责的系统减慢网络。这种威胁分类属于？\n\n1. 冒充\n2. 损耗\n3. 使用不当\n4. 网络\n\n## 152.\
  \ 作为对系列照片法证分析的一部分，John 对每张照片运行了 `exiftool`。他从中可以收集到哪些法证信息？\n\n![](img/c03uf023.jpg)\n\
  \n1. 创建日期、设备类型、GPS 位置和创建者\n2. 文件的字节序、文件类型、GPS 位置和场景类型\n3. 创建日期、设备类型、GPS 位置和设备制造商\n\
  4. MIME 类型、GPS 时间和创建者\n\n## 153. 在组织事件响应过程的准备阶段，Ben 收集了一台带有嗅探器和法证工具的笔记本电脑、优盘和外部硬盘、网络设备以及各种电缆。这种预备设备称为什么什么？\n\
  \n1. 采集包 (grab bag)\n2. 急救箱 (jump kit)\n3. 事故车 (crash cart)\n4. 应急响应者工具包 (first\
  \ responder kit)\n\n## 154. Chris 作为法证调查的一部分正在分析 Chrome 浏览器信息。在查询 Chrome 存储的 visits\
  \ 表后，他发现了一个存储为访问时间的 64 位整数值，值为 `13135579294000000`。他需要对该数据进行什么转换？\n\n1. 该值是自 1970\
  \ 年 1 月 1 日起的秒。\n2. 该值是自 1601 年 1 月 1 日起的秒。\n3. 该值是微软时间戳，可以使用时间工具进行转换。\n4. 该值是 ISO\
  \ 8601 格式的日期，可以使用任何 ISO 时间工具转换。\n\n## 155. Cynthia 需要确保她负责的工作站已收到关键 Windows 补丁。她应该避免使用以下哪种方法验证\
  \ Windows 10 系统的状态？\n\n1. 手动检查更新历史。\n2. 运行微软基安全分析器。\n3. 创建并运行 PowerShell 脚本搜索所需的特定补丁。\n\
  4. 使用 SCCM 验证其域内每台机器的状态。\n\n\n\n\n\n# 156. 当 John 继续进行涉及大量图像的取证调查时，他发现一个名为 `Downloaded\
  \ from Facebook` 的目录。这些图像似乎与他的调查有关，因此使用 `exiftool` 对它们进行元数据处理。下面的图片显示了提供的数据。John\
  \ 从此输出中可以收集哪些取证有用的信息？\n\n![](img/c03uf024.jpg)\n\n1. 原始文件的创建日期和\n2. 用于拍摄图像的设备\n\
  3. 文件的原始摘要（哈希），允许与原始文件进行比较\n4. 无；Facebook 会从图像中删除几乎所有有用的元数据\n\n# 157. Ben 工作的医院需要符合\
  \ HIPAA 标准，并需要保护 HIPAA 数据。以下哪项不是 PHI（个人健康信息）的示例？\n\n1. 个人姓名\n2. 医疗服务记录\n3. 医疗服务的付款记录\n\
  4. 个人教育记录\n\n# 158. Ben 在一家美国联邦机构工作，该机构发生了数据泄露。根据 FISMA，他必须向哪个组织报告此事件？\n\n1. US-CERT\n\
  2. 国家网络安全局 (National Cyber Security Authority)\n3. 国家网络安全中心 (National Cyber Security\
  \ Center)\n4. CERT/CC\n\n# 159. 以下哪项正确列出了从最易变到最易变的波动性顺序？\n\n1. 打印输出、交换文件、CPU 缓存、RAM\n\
  2. 硬盘、USB 介质、DVD、CD-RW\n3. DVD、硬盘、虚拟内存、缓存\n4. RAM、交换文件、SSD、打印输出\n\n# 160. Joe 想要恢复\
  \ Windows 7 工作站上本地 Windows 用户的密码。密码哈希存储在何？\n\n1. `C:\\Windows\\System32\\passwords`\n\
  2. `C:\\Windows\\System32\\config`\n3. `C:\\Windows\\Secure\\config`\n4. `C:\\Windows\\\
  Secure\\accounts`\n\n# 161. 在对一个涉及数据泄露的系统进行取证审查时，Alex 发现了许多 Microsoft Word 文件，包括文件名为\
  \ `critical_data.docx` 和 `sales_estimates_2017.docx` 的文件。当他尝试使用文本编辑器查看文件以获取任何有用信息时，他只发现了不可读的数据。发生了什么？\n\
  \n1. Microsoft Word 文件以 .zip 格式存储。\n2. Microsoft Word 文件被加密了。\n3. Microsoft Word\
  \ 文件只能由 Microsoft Word 打开。\n4. 用户使用了反取证技术扰乱了数据。\n\n# 162. Rick 正在尝试诊断 macOS 系统上的高内存占用问题，并注意到显示内存压力的图表。当图表呈黄色且如下所示，macOS\
  \ 的内存压力表示什么？\n\n![](img/c03uf025.jpg)\n\n1. 内存资源可用。\n2. 内存资源可用但正被内存管理进程占用。\n3. 内存资源危险，应用程序将被终止以释放内存。\n\
  4. 内存资源耗尽，磁盘已开始交换。\n\n# 163. Lucas 认为他的一个用户曾尝试使用内置的 Windows 命令来探测他所负责的网络上的服务器。如果系统在侦察发生后已经重启，他该如何恢复该用户的命令历史？\n\
  \n1. 检查 `bash history`。\n2. 打开命令提示符窗口并按 `F7`。\n3. 从用户配置目录手动打开命令历史。\n4. Windows 命令提示符不存储命令历史。\n\
  \n# 164. Susan 在进行无线站勘测时，发现了两个使用相同 MAC 地址的无线接入点。当她尝试连接每一个时，她都被重定向到了她组织的登录页面。她应该担心什么？\n\
  \n1. 配置错误的接入点\n2. 厂商错误\n3. 恶意孪生攻击 (evil twin attack)\n4. 恶意 MAC 攻击\n\n# 165. 在事件响应过程中，Alex\
  \ 发现了一个运行中的 Unix 进程，显示它是使用命令 `nc -k -l 6667` 运行的。他不认识该服务，需要确定它是什么。以下哪项最能描述他遇到的情况？\n\
  \n1. IRCC 服务器\n2. 网络目录服务器\n3. 用户正在运行 shell 命令\n4. netcat 服务器\n\n# 166. Angela 正在进行事件响应演练，需要评估与信息安全事件相关的\
  \ 500,000 美元支出对她组织的经济影响。她应该如何对其进行分类？\n\n1. 低影响\n2. 中等影响\n3. 高影响\n4. Angela 无法根据提供的数据评估影响\n\
  \n# 167. Chris 需要验证他的 Linux 系统正在向其 SIEM 发送系统日志。他可以使用什么方法来验证他生成的事件是否被正确发送和接收？\n\n\
  1. 在系统上运行 `Wireshark` 监控流量。\n2. 配置一个唯一的事件 ID 并发送它。\n3. 在 SIEM 设备上运行 `Wireshark`\
  \ 监控流量。\n4. 生成一个已知事件并监控它。\n\n# 168. Susan 想要保护其域内的 Windows 工作站免受缓冲区溢出攻击。她应该向公司的域管理员建议什么？\n\
  \n1. 安装反恶意软件工具。\n2. 安装防毒病毒工具。\n3. 启用 `DEP`。\n4. 在注册表中将 `VirtualAllocProtection`\
  \ 设置为 1。\n\n# 169. 根据 NIST 安全处理指南，介质清理后的下一个步骤是什么？\n\n1. 重用\n2. 验证\n3. 销毁\n4. 记录\n\
  \n# 170. Joe 正在响应一起勒索软件事件，该事件加密了整个组织内的财务和业务数据，包括工资和人力资源数据。根据目前的情况，本期无法发放工资。如果 Joe\
  \ 使用此处所示 NIST 影响类别，他应该如何对此事件进行评分？\n\n![](img/c03uf026.jpg)\n\n1. 关键 (Critical)\n\
  2. 中等 (Medium)\n3. 高 (High)\n4. 扩展恢复 (Extended recovery)\n\n# 171. Lauren 希望为她作为取证调查一部分处理的系统建立记录的监管链。以下哪项可以提供系统未改的证据？\n\
  \n1. 监管链日志\n2. 防篡封\n3. 系统日志\n4. 以上都不是\n\n# 172. Matt 的事件响应团队收集了日志信息，并利用这些信息识别攻击者。他处于\
  \ NIST 事件响应过程的哪两个阶段？\n\n1. 准备和遏制、消除和恢复\n2. 准备和事后活动\n3. 检测和分析、以及遏制、消除和恢复\n4. 遏制、消除和恢复以及事后活动\n\
  \n# 173. Angela 想要了解恶意软件包的作用，并在经过设备的虚拟机中执行它，该工具将跟踪程序做了什么、做了哪些更改以及发送了什么网络流量，同时允许她在系统上进行更改或点击文件。Angela\
  \ 执行的是哪种分析？\n\n1. 手动反汇编\n2. 交互式行为分析\n3. 静态属性分析\n4. 动态代码分析\n\n# 174. Ben 发现他尝试创建的取证镜像失败了。最可能的原因是什么？\n\
  \n1. 数据被修改。\n2. 源磁盘已加密。\n3. 目标磁盘有坏道。\n4. 数据无法以 `RAW` 格式复制。\n\n\n\n\n\n### 175. Derek\
  \ 建立了一系列在完全隔离环境中自动创建的虚拟机。一旦创建，这些系统将用于运行可能潜在的恶意软件和文件。这些文件和程序产生的操作将被记录并报告。Derek 正在使用哪种技术？\n\
  \n1. `Sandboxing`（沙箱）\n2. `Reverse engineering`（逆向工程）\n3. `Malware disassembly`（恶意软件反汇）\n\
  4. `Darknet analysis`（暗网分析）\n\n### 176. Chris 在他的 Squert Web 控制台（用于 `Sguil` IDS\
  \ 数据的控制台）中发现了以下记录。他接下来应该做什么来确定发生了什么？\n\n![](img/c03uf027.jpg)\n\n1. 查看 `ssh` 日志。\n\
  2. 禁用 `ssh` 然后进一步调查。\n3. 断开服务器的互联网连接然后调查。\n4. 立即更改密码。\n\n### 177. Lauren 想避免运行一个用户安装的程序，她认为该程序在\
  \ Windows 注册表中设置了 `RunOnce` 键，但她需要启动系统。她可以做什么来防止 `RunOnce` 执行注册表键列出的程序？\n\n1. 在启动时禁用注册表。\n\
  2. 进入 `Safe Mode`（安全模式）。\n3. 使用 `-RunOnce` 标志启动。\n4. `RunOnce` 无法禁用；她将需要先从外部介质启动来禁用它。\n\
  \n### 178. Joseph 想确定一个 USB 设备是何时首次插入 Windows 工作站的。他应该检查哪个文件来获取此信息？\n\n1. 注册表\n\
  2. `setupapi` 日志文件\n3. 系统日志\n4. 数据未存储在 Windows 系统上。\n\n### 179. 发布了一个重大的新型僵尸网络感染，它使用的点对点（P2P）命令控制过程与\
  \ 2007 年的 `Storm` 僵尸网络非常相似。Lauren 想检测受感染的系统，但知道点对点通信是不规律且加密的。如果她想监控整个网络中的这种流量，她应该使用哪种方法来捕获受感染的系统？\n\
  \n1. 构建一个 `IPS` 规则来检测所有与僵尸网络安装程序签名匹配的点对点通信。\n2. 使用专注于命令控制系统的信标检测脚本（beaconing detection\
  \ scripts）。\n3. 捕获所有主机的网络流并使用过滤器移除正常流量类型。\n4. 立即建立网络流量基准并对其进行异常分析。\n\n### 180. 以下活动中哪项不是包含和恢复过程的一部分？\n\
  \n1. 最小化损失\n2. 识别攻击者\n3. 限制服务中断\n4. 重建受损的系统\n\n### 181. Angela 最近担任了一个新职位，成为她的雇主聘用的第一位安全分析师。在她的第一周，她发现没有信息安全策略，且\
  \ IT 人员在发生安全事件期间不知道该做什么。Angela 计划建立一个 `CSIRT` 来处理事件响应。她应该提供什么类型的文档来描述 `CSIRT` 在恶意软件感染和服务器攻破等事件期间使用的特定程序？\n\
  \n1. 事件响应策略\n2. 操作手册\n3. 事件响应计划\n4. 剧本/执行手册（playbook）\n\n### 182. 这里显示的是哪种攻击行为？\n\
  \n![](img/c03uf028.jpg)\n\n1. `Kernel override`（内核覆盖）\n2. `RPC rewrite`（RPC 重写）\n\
  3. `Buffer overflow`（缓冲区溢出）\n4. `Heap hack`（堆攻击）\n\n### 183. 在调查一起攻破事件时，Jack 发现了四个他不认识的文件，并认为它们可能是恶意软件。他可以做什么来快速有效地检查这些文件以查看它们是否为恶意软件？\n\
  \n1. 将它们提交给如 `VirusTotal` 这样的网站。\n2. 使用静态分析工具打开它们。\n3. 对每个文件运行 `strings` 以识别常见的恶意软件标识符。\n\
  4. 对它们运行本地防病毒或反恶意软件工具。\n\n### 184. Alex 试图确定为什么 Windows 系统一直填满磁盘。如果她想查看磁盘内容的图形化视图并允许她深入查看每个簇，她应该使用哪种\
  \ `Sysinternals` 工具？\n\n1. `du`\n2. `df`\n3. `GraphDisk`\n4. `DiskView`\n\n### 185.\
  \ 在对 Linux 系统进行取证调查时，从 `$HOME/.ssh` 文件夹的内容无法确定哪些有用信息？\n\n1. 已连接的远程主机\n2. 用于登录其他地方的私钥\n\
  3. 用于登录此系统的公钥\n4. 与密钥关联的密码（passphrases）\n\n### 186. John 认为他在取证调查过程中遇到的图像文件是从互联网上的某个网站下载的。John\
  \ 可以使用什么工具帮助识别文件是从哪里下载的？\n\n1. `Google reverse image search`（Google 图片搜索）\n2. `Tineye`\n\
  3. `Bing Image Match`\n4. 以上所有\n\n### 187. Brian 的网络在上午 8:40 突然停止工作，中断了整个组织的视频会议、流媒体和其他，然后恢复运行。当\
  \ Brian 登录他的 `PRTG` 控制台并通过主连接冗备网络链路检查路由器流量时，他看到了下面的图表。根据这些信息，Brian 应该假设发生了什么？\n\n\
  ![](img/c03uf029.jpg)\n\n1. 网络故障并以缓存模式运行。\n2. 发生了网卡故障并已恢复。\n3. 主链路掉线，他应该检查备链路。\n\
  4. `PRTG` 停止接收信息并需要重启。\n\n### 188. Alex 需要创建一个 `Locker`-加密驱动器的取证副本。以下哪项不是它可以获取密钥的方法？\n\
  \n1. 分析休眠文件\n2. 分析内存转储文件\n3. 从 `MBR` 获取密钥\n4. 对挂载驱动器进行 `FireWire` 攻击\n\n### 189.\
  \ Adam 在一所大型大学工作，并在 `PRTG` 控制台中看到年度视图。根据此图他可以进行什么行为分析？\n\n![](img/c03uf030.jpg)\n\
  \n1. 识别圣诞期间的异常流量。\n2. 他可以确定为什么周末会有下降。\n3. 他可以识别高流量主机。\n4. Adam 无法根据此图做出任何行为判断。\n\
  \n### 190. 数据最后一个扇区与簇结束之间的空间称为什么？\n\n1. 未分配空间\n2. 临时空间\n3. 碎片空间（Slack space）\n4.\
  \ 未格式化空间\n\n### 191. Frank 想使用 `netstat` 获取运行在 Linux 系统上的进程名称、`PID` 和关联的用户名。哪些 `netstat`\
  \ 标志将为他提供这些信息？\n\n1. `-na`\n2. `-pt`\n3. `-pe`\n4. `-sa`\n\n### 192. Jack 准备将一台正在运行的\
  \ PC 回到他的取证实验室进行分析。当 Jack 考虑他的取证流程时，一位同事建议直接拔掉电源而不是通过软件关。为什么 Jack 可能会遵循这个建议？\n\n\
  1. 它将创建日志，提供有用的内存取证信息。\n2. 它将阻止启动脚本运行。\n3. 它将创建内存转储，提供有用的取证信息。\n4. 它将捕获内存驻恶意软件并允许分析。\n\
  \n### 193. Amanda 被指派通过移动取证工作获取 iPhone 数据。如果她在开机状态下接收到设备，此时是否应该移除设备上的 `SIM`（或 `UICC`）卡？\n\
  \n1. 开机状态，逻辑收集之后\n2. 开机状态，逻辑收集之前\n3. 关机状态，逻辑收集之后\n4. 关机状态，逻辑收集之前\n\n\n\n\n\n**194.**\
  \ Rick 想要验证他的恢复工作，并打算使用扫描工具对他负责的一台 Web 服务器进行扫描。他应该使用哪种工具来获取有关系统漏洞的最有用信息？\n\n1. `Wapiti`\n\
  2. `Nmap`\n3. `OpenVAS`\n4. `ZAP`\n\n195. 应急响应过程中，遏制阶段的主要目标是什么？\n\n1. 限制向媒体或客户泄露相关信息\n\
  2. 限制进一步损害的发生\n3. 防止数据外泄\n4. 将系统恢复到正常运行\n\n196. 对于处理提供文件系统加密的现代手机的企业取证调查员来说，哪种级别的取证数据提取最可能且合理？\n\
  \n1. `Level 1`: 手动提取\n2. `Level 2`: 逻辑提取\n3. `Level 3`: `JTAG` 或 `HEX` 倾储\n4. `Level\
  \ 4`: 芯片提取\n\n197. Angela 正在对 `Windows 10` 系统进行取证分析，并想根据 `Windows registry` 中包含的信息提供系统使用情况的概述。以下哪项不是她从\
  \ `SAM` 中可以提取的数据元素？\n\n1. 密码过期设置\n2. 用户账户类型\n3. 登录次数\n4. 账户首次登录的时间\n\n198. Samantha\
  \ 正在准备一份报告，描述高级持续威胁（APT）攻击者使用的常用攻击模型。以下哪项是 APT 攻击的典型特征？\n\n1. 他们涉及复杂的 `DDoS` 攻击。\n\
  2. 他们静静地从受侵害的系统中收集信息。\n3. 他们依赖蠕虫传播。\n4. 他们使用加密来将数据作为 hostage。\n\n199. 在应急响应过程中，Alice\
  \ 被分配收集有关访问了哪些数据、数据是否外泄以及暴露了什么类型数据的细节。她正在进行什么类型的分析？\n\n1. 信息影响分析\n2. 经济影响分析\n3.\
  \ 停机时间分析\n4. 恢复时间分析\n\n200. Angela 发现了一个似乎遵循此处所示流程的攻击。她应该将其识别为哪种攻击？\n\n![](img/c03uf031.jpg)\n\
  \n1. 钓鱼攻击\n2. 零日漏洞利用\n3. 捕叉鱼攻击（针对高管）\n4. 高级持续威胁\n\n请参考此处所示图像回答问题 201 到 203。\n\n\
  ![](img/c03uf032.jpg)\n\n201. 在电子发现过程中，Angela 审查了对方律师的要求，并列出了所有识别出的个人名单。然后她联系了支持每个人的\
  \ IT 人员，请求提供他们的 IT 资产列表。她处于 `EDRM` 流程的哪个阶段？\n\n1. 信息治理\n2. 识别\n3. 保留\n4. 收集\n\n\
  202. 在工作的保留阶段，Angela 发现作为发现请求一部分的信息已根据其组织策略的要求，作为定期计划的数据清理的一部分被删除了。Angela 应该怎么办？\n\
  \n1. 对数据进行取证恢复。\n2. 创建合成数据以替换缺失的数据。\n3. 向法律顾问报告此问题。\n4. 根据相同的策略清除与请求相关的任何其他数据。\n\
  \n203. Angela 预计在哪个阶段花费最多的人工时？\n\n1. 识别\n2. 收集和保留\n3. 处理、审查和分析\n4. 制作（交付）\n\n204.\
  \ Cassandra 正在构建的应急响应箱基于一台强大的笔记本电脑，以便她可以执行现场驱动获取和分析。如果她预计需要从 `SATA` 和 `IDE` 硬盘中获取数据，她应该在工具箱中包含哪些物品？\n\
  \n1. 一个写保护器\n2. 一个 `USB` 硬盘\n3. 多接口硬盘适配器\n4. 一根 `USB-C` 线\n\n205. 以下哪种物品通常不在企业取证工具箱中？\n\
  \n1. 写保护器\n2. 警戒线\n3. 标签打印机\n4. 解密工具\n\n206. Lauren 在事件发生前应该构建哪种应急响应工具以？\n\n1. 分诊工具\n\
  2. 电话列表\n3. 响应轮班表\n4. 安全矩阵\n\n207. 在对 `Linux` 系统进行分析时，Kathleen 发现有一个名为 `john` 的进程正在运行。她应该将其识别为最可能的用途？\n\
  \n1. 密码破解\n2. 权限提升\n3. 根内核包（rootkit）\n4. 安全应用程序\n\n208. 以下哪种组织不参与事件后的通信？\n\n1. 开发人员\n\
  2. 市场部\n3. 公共关系\n4. 法律\n\n209. 在检查系统日志时，Charles 发现工作站的处理器一直达到 100%。在检查系统的其他部分后，似乎安装了未经授权的软件。Charles\
  \ 下一步应该做什么？\n\n1. 将浏览器与已知的版本进行对比\n2. 重新安装浏览器\n3. 禁用 `TLS`\n\n210. Lauren 发现其组织 Web\
  \ 服务器上安装的 `Java` 版本被替换了。这类问题最好归类为哪类？\n\n1. 未授权的软件\n2. 未授权的更改\n3. 意外输入\n4. 内存溢出\n\
  \n211. Greg 在他的 `Apache` 日志中发现了一系列日志记录，显示长字符串 `AAAAAAAAAAAAAAAAAAAA` 后面跟着字符串。他可能发现了什么种类型的攻击？\n\
  \n1. SQL 注入攻击\n2. 拒绝服务攻击\n3. 内存溢出攻击\n4. PHP 字符串攻击\n\n212. Catherine 想要检测她负责管理和监控的应用程序产生的意外输出。她可以使用哪种工具来检测意外输出？\n\
  \n1. 日志分析工具\n2. 基于行为的分析工具\n3. 基于特征的检测工具\n4. 手动分析\n\n# 第 4 章\n\n## 领域 4：安全架构与工具集\n\
  \n### 本章涵盖考试目标：\n\n* **4.1 解释框架、常用策略、控制和程序之间的关系。**\n    * 合规性\n    * 框架\n    * 策略\n\
  \    * 控制\n    * 程序\n    * 验证与质量控制\n\n* **4.2 给场景，使用数据对身份访问管理相关的安全问题提出建议。**\n  \
  \  * 与上下文认证相关的问题\n    * 与身份相关的问题\n    * 与身份存储库相关的问题\n    * 与联邦和单点登录相关的问题\n    *\
  \ 漏洞\n\n* **4.3 给场景，审查安全架构并就实施补偿措施提出建议。**\n    * 安全数据分析\n    * 手动审查\n    * 深度防御\n\
  \n* **4.4 给场景，在参与软件开发生命周期 (SDLC) 时使用应用安全最佳实践。**\n    * 软件开发期间的最佳实践\n    * 安全编码最佳实践\n\
  \n* **4.5 比较并对比各种网络工具和技术的通用用途及使用理由。**\n    * 预防性\n    * 集合\n    * 分析性\n    * 漏洞\n\
  \    * 取证\n\n\n\n\n\n1. Jim 正在帮助一个软件开发团队将安全审查集成到他们的代码审查过程中。他希望实现一种实时审查技术。以下哪种方法最能满足他的需求？\n\
  \    *结对编程\n    * 传阅代码审查 (Pass-around code review)\n    * 辅助辅助审查\n    * 正式代码审查\n\
