  \ `Windows` 或 `Exchange` 将无法解决问题。\n\n### 35. B\n`SQL injection` 漏洞针对存储在企业数据库中的数据，但它们是通过利用面向客户端应用程序的缺陷来实现的。这些缺陷最常见（但并非仅）存在于\
