  \n1. 增加复杂性。\n2. 启用 v2。\n3. 启用 TLS。\n4. 应用不同的团体字符串。\n\n### 3. Heidi 对她的组织平台进行了扫描。如果存在哪种漏洞，应该增加严重性？\n\
