  \ DSS` 要求每季度扫描一次网络，或在发生任何“网络重大变化”后扫描。防火墙升级绝对属于重大的网络变化，Chanda 应该立即安排漏洞扫描以维护 `PCI\
  \ DSS` 合规性。\n\n# 129. A. 网络分段是最强大的控制措施之一，通过将其与网络上的其他系统隔离来保护工业控制系统和 `SCADA` 系统。输入验证和内存保护可以提供一些安全性，但其缓解作用没有将这些系统与其他设备隔离那样强。\n\
  \n# 130. C. 虽然这些原因都有可能，但此结果最可能的原因是系统管理员使用主机防火墙拦截了扫描器。管理员不太可能在不引起服务中断的情况下完成漫长的通夜工作。如果服务器宕机，其他\
  \ IT 人员会报告此问题。\n\n# 131. B. `10.x.x.x`、`172.16.x.x` 和 `192.168.x.x` 范围内的任何地址都是私私有\
  \ IP 地址。因此，在列出的地址中，`12.8.1.100` 可能来自外部。\n\n# 132. B. 这里最可能的问题是服务器与第三方扫描服务之间存在网络防火墙。该防火墙阻止了进入服务器的连接并导致外部扫描失败。`CIFS`\
