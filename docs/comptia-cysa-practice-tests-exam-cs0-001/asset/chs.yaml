  \n## 68. Jose 正在与经理合作，为公司实施漏洞管理计划。经理告诉他应该专注于修复外部访问系统的严重和高风险。经理还告诉他组织不希望处理评级为中等或更低的风险。Jose\
  \ 不同意这种做法，认为他也应该处理内部系统的严重和高风险问题。他应该如何处理这种情况？\n1. Jose 应该意识到经理是根据组织的风险偏好做出的决定，并接受它，执行经理的请求。\n\
  2. Jose 应该与经理讨论他的意见，并要求更改修复标准。\n3. Jose 应该要求经理开会，讨论他对经理做法的担忧。\n4. Jose 应该以他认为合适的方式执行修复计划，因为这将解决经理识别的所有风险以及额外风险。\n\
  \n## 69. Susan 需要测试大量提交的二进制文件。她需要确保应用程序不包含恶意代码。哪种技术最适合这种？\n1. 沙箱\n2. 部署蜜罐\n3. 反编译并分析应用程序代码\n\
  4. Fagan 测试\n\n## 70. 以下哪项是逻辑控制？\n1. 锁和钥匙\n2. 防火墙规则\n3. 背景检查\n4. 安全卫\n\n## 71. Chris\
