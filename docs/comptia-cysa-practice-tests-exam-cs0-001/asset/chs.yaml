  \n\n\n\n\n174. A. `phpinfo` 文件是 Web 开发人员在服务器初始配置期间常用的测试文件。虽然此处提供的任何解决方案都可以修复此漏洞，但最常见的做法是在服务器迁移到生产环境或向公开访问之前，简单地删除此文件。\n\
  \n175. D. `未知设备报告`（Unknown Device Report）将关注扫描期间检测到但未在组织资产管理系统中注册的系统。`高危报告`（High\
