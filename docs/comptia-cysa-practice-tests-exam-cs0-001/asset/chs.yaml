  \n\n\n\n\n\n\n\n\n致谢\n\n## 关于作者\n\n**Mike Chapple, PhD, CISSP,** 是畅销书《CISSA+ Official\
  \ (ISC)² Study Guide》的作者。他是在高等教育、私营部门和政府领域拥有经验的信息安全专业人士。Mike 目前担任纳达大学 IT 与分析副教授，在回到纳达大学之前，他曾担任迈密咨询公司\
  \ Brand Institute 的总裁兼首席信息官。Mike 曾在国家安全局的安全小组工作过四年，并曾在美国空军服现役。他是《信息安全》杂志的技术编辑，并编写了\
  \ 20 本书，包括《Cyberwarfare: Information Operations in a Connected World》（Jones & Bartlett，2015）、《CompTIA\
  \ Security+ Training Kit》（Microsoft Press，2013）以及《CISSA+》（Sybex，2017）。Mike 在纳达大学获得计算机科学与工程学士和博士学位。他还拥有爱达华大学的计算机科学硕士学位。\n\
  \n**David Seidl** 是纳达大学校园技术服务总监，负责中央平台和操作系统支持、虚拟化、数据库管理与服务、身份访问管理、应用程序服务、企业内容和文档管理、实验室和讲台计算、数字标牌以及学术打印。在担任目前的职务之前，他是纳达大学的安全总监。David\
  \ 与 Mike Chapple 合著了《CompTIA CySA+ Study Guide》（Sybex，2017）、《CISSP Official (ISC)²\
  \ Practice Tests》（Sybex，2016）、《CompTIA Security+ Training Kit》（Microsoft Press，2013）以及《Cyberwarfare:\
  \ Information Operations in a Connected World》（Jones & Bartlett，2015），并担任过《CISSA\
  \ Guide》第六版和第七版（Sybex，2015 年第七版）的技术编辑。David 在东密歇根大学获得通信技术学士学位和信息安全硕士学位，并拥有 CISSP、CySA+、GPEN\
  \ 和 GCIH 认证。\n\n## 技术编辑\n\n**Warren E. Wyrostek, ED.D.,** 是一位以解决方案为导向的教育者和领导、认证培训师和协调员、丰富的\
  \ DACUM 爱好者，以及需求量大的认证和评估专家。Warren 喜欢利用其在技术教育、培训和开发以及认证领域的经验来增长并开发创新计划。\n\n\n\n\n\
  \nWarren 在瓦尔多斯塔州立学院（Valdosta State College）获得了成人职业技术硕士学位，在纽约联合神学学院（Union Theological\
  \ Seminary）获得了神学硕士学位，并拥有亨特学院（Hunter College）化学/医学预科学士学位。最近，他在瓦尔多斯塔州立大学完成了课程与教学教育学博士（ED.D.）。\n\
  \nWarren 获得了超过 50 个 IT 认证（包括许多安全认证），出版了三本书，担任过 30 多本 IT 教书的技术编辑，并为主要出版社撰了 50 多篇文章。他还是集成网络大师（Master\
  \ of Integrated Networking）认证的创建者。目前，他是瓦尔多斯塔州立大学（VSU）跨学科研究方法的兼教授。\n\n可以通过 [wyrostekw@msn.com](http://wyrostekw@msn.com)\
