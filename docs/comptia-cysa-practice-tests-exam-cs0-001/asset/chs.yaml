  \ (VPN)、工业控制系统 (ICS)、SCADA 设备\n\n## 3.0 网络事件响应\n\n### 3.1 给定场景，区分威胁数据或行为以确定事件的影响（第\
  \ 3 章）\n\n威胁分类：已知威胁 vs 未知威胁、零日漏洞（Zero day）和高级持续威胁。影响事件严重程度和优先级的因素：影响范围、停机时间、恢复时间。数据完整性、经济影响、系统流程的性性。数据类型：个人身份信息\
  \ (`PII`)、个人健康信息 (`PHI`)、支付卡信息、知识产权、公司机密、会计数据。合并与收购。\n\n### 3.2 给定场景，准备工具包并在调查期间使用适当的取证工具（第\
  \ 3 章）\n\n取证工具包、数字取证工作站、写保护器、线缆、驱动器适配器、已擦除的可移动介质、相机、警戒带、防篡封、文档/表单、监管链表、事件响应计划、事件表单、电话列表/升级列表。取证调查套件、镜像工具、分析工具、监管链、哈希工具、操作系统和进程分析、移动设备取证、密码破解器、密码学工具、日志查看器。\n\
  \n### 3.3 解释在事件响应过程中通信的重要性（第 3 章）\n\n利益相关者：人力资源部、法律、市场部和管理层。通信流程的目的：将通信限制在受信任方、根据监管/立法要求进行披露、防止信息无意发布、安全的通信方法。基于角色的职责：技术、管理、执法和保留事件响应提供商。\n\
  \n### 3.4 给定场景，分析常见症状以选择最佳行动方案以支持事件响应（第 3 章）\n\n常见的网络相关症状：带宽消耗、信标行为（beaconing）、不规则的点对点通信、网络上的非法设备、扫描遍历（scan\
  \ sweeps）和异常流量激增。常见的主机相关症状：处理器 (`CPU`) 占用、内存占用、驱动器容量占用、未经授权的软件、恶意进程、未经授权的更改、未经授权的权限、数据外泄。常见的应用程序症状：异常活动、引入新账户、意外输出、意外的出站通信、服务中断、内存溢出。\n\
  \n### 3.5 总结事件恢复和事件后响应过程（第 3 章）\n\n抑制技术：分段、隔离、移除和逆向工程。根除技术：清理、重构/重装、安全处置、验证、补丁、权限、扫描以及验证到安全监控的日志/通信。纠正措施、经验报告、变更控制流程、更新事件响应计划、事件总结报告。\n\
  \n## 4.0 安全架构与工具集\n\n### 4.1 解释框架、通用策略、控制和程序之间的关系（第 4 章）\n\n合规性、框架：`NIST`、`ISO`、`COBIT`、`SABSA`、`TOGAF`、`ITIL`。策略：密码策略、可使用策略、数据所有权策略、数据保留策略、账户策略策略数据分类策略。控制：基于标准的控制选择、组织定义的参数、物理控制、逻辑控制、管理控制。程序：持续监控、证据制作、补丁、补偿性控制开发、控制测试程序、异常管理、制定和执行修复计划。验证和质量控制、审计、评估、评价、成熟度模型、认证。\n\
  \n### 4.2 给定场景，使用数据建议修复身份和访问管理相关的安全问题（第 4 章）\n\n与基于时间、位置、频率、行为模式的上下文认证相关的安全问题。与身份相关的安全问题：人员、终端、服务器、服务、角色、应用程序。与身份存储库相关的安全问题：目录服务、`TACACS+`、`RADIUS`。与联邦和单登录相关的安全问题：手动\
  \ vs 自动配置/撤销以及自助密码重置。漏洞：冒充、中间人攻击、会话劫持、跨站脚本、权限提升和根内核程序（rootkits）。\n\n### 4.3 给定场景，审查安全架构并提出实施补偿控制的建议（第\
  \ 4 章）\n\n使用数据聚合和关联进行安全数据分析、趋势分析和历史分析。手动审查防火墙日志、系统日志、身份验证日志和事件日志。深度防御概念。人员安全：培训、双重控制、职责分离、第三方/顾问、交叉培训、强制休假、继任计划。与深度防御相关的流程：持续改进、计划性审查和流程淘汰。技术：自动化报告、安全设备、安全套件、外包、安全服务\
  \ (`SaaS`) 和密码学。其他安全概念：网络设计和网络分段。\n\n### 4.4 给定场景，在参与软件开发生命周期 (SDLC) 时使用安全最佳实践（第\
  \ 4 章）\n\n软件开发期间的最佳实践：安全需求定义、安全测试阶段、静态代码分析、Web 应用漏洞扫描、模糊测试（Fuzzing）、使用拦截代理爬应用程序、手动同行评审、用户验收测试、应用程序压力测试、安全回归测试、输入验证、来自\
  \ `OWASP`、`SANS` 和互联网安全中心的安全编码最佳实践。\n\n### 4.5 给定场景，比较各种安全工具和技术的通用用途（第 4 章）\n\n\
  预防性工具，包括：IPS：`Sourcefire`、`Snort`、`Bro`、`HIPS`。防火墙：`Cisco`、`Palo Alto`、`Check Point`。杀病毒软件和反恶意软件、`EMET`、Web\
  \ 代理、Web 应用防火墙 (`WAF`) 系统：`ModSecurity`、`NAXSI`、`Imperva`。集合工具，包括：SIEM：`ArcSight`、`QRadar`、`Splunk`、`AlienVault`、`OSSIM`、`Kiwi\
  \ Syslog`。网络扫描工具使用 `NMAP`，漏洞扫描使用 `Qualys`、`Nessus`、`OpenVAS`、`Nexpose`、`Nikto` 和微软基础评估工具。包捕获使用\
  \ `Wireshark`、`tcpdump`、`Network General` 和 `Aircrack-ng`。命令行/IP 工具：`netstat`、`ping`、`tracert/traceroute`、`ipconfig/ifconfig`、`nslookup/dig`、`Sysinternals`\
  \ 套件、`OpenSSL`。系统设计建议和基准。\n\n\n\n\n\n* 点点数据分析\n* 数据关联与分析\n* 数据输出\n* 工具\n\n\n* 网络分段\n\
  * 蜜罐\n* 终端安全\n* 组策略\n* 访问控制列表 (ACLs)\n* 加固\n* 网络访问控制 (NAC)\n\n\n* 渗透测试\n* 逆向工程\n\
  * 培训与演练\n* 风险评估\n\n1. Charles 想要将主动发现技术作为其侦察工作的一部分。以下哪种技术符合他的标准？\n    1. Google\
  \ 搜索\n    2. 使用 `Shodan` 搜索\n    3. 使用 `DNS` 反向查找\n    4. 查询 `PGP` Key 服务器\n\n2.\
