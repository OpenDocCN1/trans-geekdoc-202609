  \ Glenda 可以通过配置工作站自动升级 `Chrome` 来轻松地解决此问题。向工作站自动部署 `Chrome` 更新是合理的，因为失败的影响较小，而且在发生故障时用户可以切换到其他浏览器。手动升级\
