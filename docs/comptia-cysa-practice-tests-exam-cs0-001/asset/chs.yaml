  \n### 123. D\n`FTK`、`EnCase` 和 `Helix` 都是取证套件的示例。`Burp` 是一种用于渗透测试和 Web 应用测试的拦截代理。\n\
  \n### 124. C\n用户使用属于行政助理的账户连接，并能够执行管理命令，这表明发生了权限提升攻击。虽然缓冲区溢出是进行权限提升攻击的常用方法，但场景中没有证据表明使用了该技术。\n\
  \n### 125. B\n漏洞扫描不能作为补偿控制，因为它只能检测而不能纠正安全缺陷。没有迹象表明该服务器未实施加密，或者加密是否能解决 SQL 注入漏洞。入侵预防系统\
  \ (`IPS`) 和 Web 应用防火墙 (`WAF`) 都有能力充当补偿控制并阻止恶意请求。在这两者中，在这种情况下，Web 应用防火墙是最佳解决方案，因为它是专为防止\
  \ Web 应用程序漏洞的被利用而设计的。\n\n### 126. C \n用户验收测试 (`UAT`) 验证代码是否符合用户需求，通常是代码发布到生产环境之前的应用程序测试的最后阶段。\n\
  \n### 127. B\n逻辑控制是在数字空间内强制机密性、完整性和可用性的技术控制。该控制符合该定义。物理控制是影响物理的安全控制。行政控制是组织遵循以实施良好安全管理实践的程序性机制。没有迹象表明该控制是为了补偿控制漏洞而设计的。\n\
  \n### 128. B\n所示的工具是 `ZAP`，一种流行的应用程序代理工具。`ZAP` 是一种拦截代理，允许许多类型的应用程序测试，例如图像所示的模糊测试（fuzz\
  \ testing）。`ZAP` 不执行静态分析或漏洞扫描，也没有迹象表明 Sam 的测试是作为同行评审的一部分进行的。\n\n### 129. A\n主机防火墙运行在单个系统级，因此不能用于实施网络分段。路由器和交换机可以通过物理隔离网络或实施\
  \ `VLAN` 标记来实现此目的。网络防火墙也可以用于将网络划分成不同的区域。\n\n### 130. B\n`traceroute` 的目标出现在结果的第一行：`traceroute\
