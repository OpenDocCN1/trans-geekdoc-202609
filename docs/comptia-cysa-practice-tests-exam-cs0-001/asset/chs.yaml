  \ 可能只需保持该服务现状。\n\n### 30. C\n信息资产价值是指组织对资产存储、处理或传输的数据所赋予的价值。在这种情况下，处理的信息类型（例如受监管的数据、知识产权、个人身份识别信息）有助于确定信息资产价值。服务器购置成本、硬件更换成本和折旧成本均指的是硬件的财务价值，这与信息资产价值是一个不同的概念。\n\
