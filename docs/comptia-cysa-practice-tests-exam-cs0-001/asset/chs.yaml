  \n### 60. D.\n数据分类是根据敏感程度和或重要性对信息应用的一系列标签。它是这种场景下最合适的选择。数据保留要求规定了组织维护记录的时间。数据残留是指被认为已删除的信息可能存在于系统中。数据隐私可能有助于数据分类，但它不像数据分类那样涵盖整个敏感性和重要性。\n\
  \n### 61. D.\nBob 看到的输出来自密码破解工具。他通过读取文件头并意识到文件包含未哈希的密码判断这一点。在列出的工具中，只有 `Cain & Abel`\
  \ 和 `John the Ripper` 是密码破解工具。Metasploit 是一个漏洞利用框架，而 `ftk` 是取证工具包。`Cain & Abel`\
  \ 是基于 Windows 的工具，而这看起来是命令行输出。因此，输出来自 `John the Ripper`，这是一个适用于所有主要平台的命令行密码破解工具。\n\
  \n### 62. C.\n`Nmap` 是一个开源端口扫描工具，不具备 Web 应用扫描能力。`Acunetix` 和 `Nikto` 是专用 Web 应用漏洞扫描器。`QualysGuard`\
  \ 是更通用的漏洞扫描工具，但它具有 Web 应用扫描能力。\n\n### 63. B.\n`PCI DSS` 要求每季度扫描一次，并在发生重大变更后进行扫描。每周扫描是最佳实践，但并非标准要求。Peter\
  \ 必须请经过批准的扫描供应商执行要求的季度外部扫描，但他可以自己进行内部扫描。持卡人数据环境中的所有系统（包括网站和销售终端）都必须进行扫描。\n\n\n\n\
  \n\n### 64. A.\n漏洞描述提到这是一个跨站脚本（XSS）漏洞。通常，XSS 漏洞通过在 Web 应用代码中执行适当的输入验证来解决。然而，在特定情况下，XSS\
  \ 漏洞存在于 `Microsoft IIS` 服务器本身，而不是 Web 应用程序中。因此，需要微软提供补丁来修复它。\n\n### 65. C.\n快速泛洪\
  \ DNS 网络在一个（或几个）完全限定域名名后面使用许多 IP 地址。通过记录 DNS 服务器查询并检查其查找与命令与控制网络相关 DNS 目的地的主机，可以快速识别受攻击的系统。\n\
  \n遗憾的是，杀毒软件的更新通常不够快，无法立即检测到新的恶意软件。由于快速泛洪 DNS 控制依赖于 C&C 主机的频繁变化，IP 地址变化很快，使其成为一种不可靠的检测方法。最后，检查电子邮件查看谁接收了带有病毒的邮件是有用的，但在没有额外数据的情况下，无法指示恶意软件是否成功感染了系统。\n\
  \n### 66. A.\n`-O` 标志启用 `nmap` 的操作系统检测功能。\n\n### 67. A.\nMika 正在使用了以密码形式表示的知识因素和以令牌（token）形式表示的持有因素。持有令牌就是“她拥有的东西”。\n\
  \n### 68. B.\nJose 采取的最合适步骤是与经理讨论他的意见，看看经理是否愿意更改指南。作为一名安全专业人员，与经理分享意见是 Jose 的伦理责任。Jose\
