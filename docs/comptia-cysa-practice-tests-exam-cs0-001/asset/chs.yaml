  \n# 124. D. 虽然列出的所有技术都对移动设备的安全有所贡献，但只有容器化允许将敏感信息与其他设备用途进行隔离和保护。容器化技术为企业信息创建了一个安全存储库，可以远程擦除而不影响设备的其他用途。它还保护容器内容免受设备上运行的其他应用程序和其他服务的的影响。\n\
  \n# 125. A. 在这种情况下，Sally 意识到没有紧迫威胁，因此没有必要遵循紧急变更流程（该流程允许她在进行任何变更管理之前实施变更）。尽管如此，应该在不等待长达三个月的计划补丁周期的情况下进行变更。因此，Sally\
  \ 的最佳选择是通过组织的变更管理流程启动一个高优先级变更。\n\n# 126. C. Gene 的最佳选择是更改扫描的敏感性级别，以排除低重要性漏洞。他的经理告诉他许多细节并不重要，这一事实提示他报告中包含了冗余信息。虽然他可以手动编辑图表，但他应该更改扫描设置，这样他每次运行报告时就不需要进行那些手动编辑了。\n\
