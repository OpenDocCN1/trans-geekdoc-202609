  ## 70. Nick 认为有一个攻击者攻破了他网络上的一个 Linux 工作站并添加了一个新用户。不幸的是，该系统没有启用大多数日志记录。以下哪项最可能提供关于哪个用户是最近创建的有用信息？\n\
  \n1. `/etc/passwd`\n2. `/var/log/auth.log`\n3. 对系统上的每个用户运行 `ls -ld /home/$username`\n\
