  \n![](img/c02f070.jpg)\n\n1. 未执行输入验证\n2. 未使用强密码\n3. 未对通信进行加密\n4. 未安装反病毒软件\n\n166.\
  \ Raul 正在用新产品替换他组织的漏洞扫描器。当 Raul 构建策略时，他注意到文档之间存在一些冲突。Raul 应该给哪个来源最高的优先级？\n\n1. `NIST`\
