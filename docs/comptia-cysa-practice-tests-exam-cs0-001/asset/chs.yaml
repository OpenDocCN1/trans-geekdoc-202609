  \ `SSH` 密钥通常不用于加密存储的信息。\n\n# 123. B. Craig 应该移除漏洞扫描识别出的四种过时软件（`Java 6.1`、`Internet\
  \ Explorer 8`、`Microsoft .NET Framework 4` 和 `Microsoft Visual C++ 2005`）。他还应该应用\
