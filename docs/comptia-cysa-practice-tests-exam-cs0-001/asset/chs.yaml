  \ 端口 137 和 139 上的 NetBIOS 间接访问。\n\n### 112. B\nTed 可以通过降低扫描敏感度来减少返回的结果。这将提高报告阈值，只返回最重要的结果。增加扫描敏感度将产生相反的效果，增加报告漏洞的数量。更改扫描频率不会改变报告漏洞的数量。\n\
