  \ 应该使用哪个术语来描述他的团队在练习中的角色？\n\n1. 白队（White team）\n2. 红队（Red team）\n3. 金队（Gold team）\n\
  4. 蓝队（Blue team）\n\n## 67. Lauren 下载了一个新的安全工具并检查了它的 MD5。如果她收到以下消息，她对下载的软件知道什么：\n\
