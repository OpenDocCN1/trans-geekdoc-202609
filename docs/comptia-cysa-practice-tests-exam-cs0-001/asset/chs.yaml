  427. 418\n\n\n# 引言\n\n`CompTIA CySA+ (Cybersecurity Analyst) Practice Tests` 是 `CompTIA\
  \ CySA+ (Cybersecurity Analyst) Study Guide`（Wiley, 2017, Chapple/Seidl）的配套读物。如果你想在参加\
  \ CySA+ 考试之前测试自己的知识水平，这本书将通过提供总计 1,000 道题目的的组合来为你提供帮助，这些题目涵盖了 CySA+ 的领域，并对正确答案和错误答案提供了易于理解的解释。\n\
  \n如果你刚开始准备 CySA+ 考试，我们强烈建议你使用 `Cybersecurity Analyst+ (CySA+) Study Guide` 来帮助你学习\
  \ CySA+ 考试涵盖的每个领域。一旦你准备好测试自己的知识，可以使用此这本书来找到你可能需要更多学习的地方或为考试进行练习。\n\n由于它是 `CySA+\
  \ Study Guide` 的配套读物，这本书的设计与参加 CySA+ 考试相似。它包含了多部分场景题以及标准单选题。书本身分为 6 个以领域为中心的章节，每个领域有\
  \ 200 多道题，以及 2 个模拟考试的章节。\n\n## CompTIA\n\nCompTIA 是一个非营利贸易组织，提供各种 IT 领域的认证，从 `A+`\
  \ 考试涵盖的技术需求到如 `CompTIA Advanced Security Practitioner (CASP)` 等高级认证。CompTIA 根据所需的技能水平和考试涵盖的主题将其考试分为四个不同的类别，如下所示：\n\
  \n| 基础 (Foundational) | 专业 (Professional) | 专项 (Specialty) | 精通 (Mastery) |\n| :---\
  \ | :--- | :--- | :--- |\n| IT 基础 | 带有虚拟化的 `A+` | `CySA+` | `CASP` |\n| 医疗 IT 技术\
  \ | `Network+` | `Security+` | |\n\nCompTIA 建议从业人员遵循此处所示的网络安全职业路径：\n\n\n如你所见，`Cybersecurity\
  \ Analyst+` 认证属于专业类别，这与你发现流行的 `A+`、`Network+` 和 `Security+` 证书处于同一位置。然而不要被此误导。`Cybersecurity\
  \ Analyst+` 是一项更高级的考试，旨在针对具有实战经验并掌握先前考试知识的专业人士。CompTIA 认证通过 ISO 和 ANSI 认证，被用于多个行业作为技术技能和知识的衡量标准。此外，CompTIA\
  \ 认证（包括 `Security+` 和 `CASP`）已获得美国政府批准为信息保证基准认证，并包含国务院激励计划中。\n\n## 网络安全分析师考试\n\n\
  CompTIA 称为 `CySA+` 的 `Cybersecurity Analyst+` 考试被设计为网络安全、威胁和漏洞分析师的厂商中立认证。该认证面向安全分析师和工程师，以及安全运营中心\
  \ (SOC) 人员、漏洞分析师和威胁情报分析师。它侧重于安全分析以及安全工具在现实场景中的实际应用。它涵盖了四个主要领域：安全分析、威胁管理、漏洞管理和安全架构。\n\
  \nCompTIA 称为 `CySA+` 的 `Cybersecurity Analyst+` 考试被设计为网络安全、威胁和漏洞分析师的厂商中立认证。该认证面向安全分析师和工程师，以及安全运营中心\
  \ (SOC) 人员、漏洞分析师和威胁情报分析师。它侧重于安全分析以及安全工具在现实场景中的实际应用。它涵盖了四个主要领域：安全分析、威胁管理、漏洞管理和安全架构。\n\
  \nCompTIA 称为 `CySA+` 的 `Cybersecurity Analyst+` 考试被设计为网络安全、威胁和漏洞分析师的厂商中立认证。该认证面向安全分析师和工程师，以及安全运营中心\
  \ (SOC) 人员、漏洞分析师和威胁情报分析师。它侧重于安全分析以及安全工具在现实场景中的实际应用。它涵盖了四个主要领域：安全分析、威胁管理、漏洞管理和安全架构。通过实战场景，位于\
  \ `Security+` 和 `CompTIA Advanced Security Practitioner (CASP)` 之间的 `CySA+` 考试被\
  \ CompTIA 称为“性能评估”。这意味着考试包含多种类型的题目，如单选题、填空、拖拽和基于图像的题目。\n\nCompTIA 建议在参加考试前具有三到四年的信息安全经验。考试费用在美国为\
  \ 320 美元，在其他地区也类似。你可以在 [`certification.comptia.org/cybersecurity-analyst`](https://certification.comptia.org/cybersecurity-analyst)\
  \ 找到更多关于 `CySA+` 考试的信息。\n\n## 学习与考试建议\n\n我们建议将此书结合 `Cybersecurity Analyst+` 使用。阅读指南中的章节，然后尝试书中每个领域相关的题目。\n\
  \n你还应该记住 `CySA+` 认证旨在测试实战经验，因此你应该确保有时间操作考试涵盖的安全工具。CompTIA 建议使用 NetWars 风格的模拟、渗透测试和防御性应急响应培训来准备\
  \ CySA+。\n\n用于实战练习的额外资源包括：\n\n-   `Exploit-Exercises.com` 提供涵盖广泛安全问题的虚拟机、文档和挑战：[`exploit-exercises.com/`](https://exploit-exercises.com/)\n\
  -   `Hacking-Lab` 提供各个领域的夺旗赛（CTF）练习：[`www.hacking-lab.com/index.html`](https://www.hacking-lab.com/index.html)\n\
  -   `OWASP Hacking Lab` 提供针对 Web 的优秀练习：[`www.owasp.org/index.php/OWASP_Hacking_Lab`](https://www.owasp.org/index.php/OWASP_Hacking_Lab)\n\
  -   `PentesterLab` 提供基于订阅的渗透测试练习访问：[`www.pentesterlab.com/exercises/`](https://www.pentesterlab.com/exercises/)\n\
  -   `InfoSec Institute` 提供在线夺旗赛活动，并对成功攻击的文字说明提供奖励：[`ctf.infosecinstitute.com/`](http://ctf.infosecinstitute.com/)\n\
  \n由于考试基于场景的学习，预计题目将涉及分析和思考，而不是仅仅依靠记忆。\n\n## 参加考试\n\n当你完全准备好参加考试时，可以访问 CompTIA 网站购买你的考试券：\n\
  \n[www.comptastore.com/Articles.asp?ID=265&category=vouchers](http://www.comptastore.com/Articles.asp?ID=265&category=vouchers)\n\
  \n\n\n\n\nCompTIA 与 Pearson VUE 的测试中心合作，因此您的下一步将是找到您附近的测试中心。在美国，您可以根据地址或邮政编码进行查找，而非美国地区的考者可能会通过输入城市和国家来查找更方便。您可以在\
  \ Pearson Vue 网站搜索附近的测试中心，届时您需要导航到“查找测试中心”（Find a test center）：\n\n[www.pearsonvue.com/comptia/](http://www.pearsonvue.com/comptia/)\n\
  \n现在您已经知道想在哪里参加考试了，只需设置一个 Pearson VUE 测试账户并预约考试：\n\n[`certification.comptia.org/testing/schedule-exam`](https://certification.comptia.org/testing/schedule-exam)\n\
  \n考试当天，请携带两份身份证明，并确保在考试开始前有充足的时间到达。请记住，您无法携带笔记、电子设备（包括智能手机和手表）或其他材料进入。\n\n# Cybersecurity\
  \ Analyst+ 考试之后\n\n一旦完成考试，您将立即收到分数，因此您可以立即知道是否通过了测试。您应该将您的成绩单与考试注册记录以及用于注册考试的邮箱地址保存在一起。\n\
  \n## 维护您的认证\n\nCompTIA 认证必须定期续期。要续期您的认证，您可以通过最新版本的考试、获得符合条件的高级 CompTIA 或或行业认证，或者完成足够的持续教育活动以获得足够的持续教育单元（`CEUs`）来进行续期。\n\
  \nCompTIA 通过其网站提供续期信息：\n\n[`certification.comptia.org/continuing-education/how-to-renew`](https://certification.comptia.org/continuing-education/how-to-renew)\n\
  \n当您注册续期认证时，将会被要求同意 CE 计划的道德准则、支付续期费并提交所选续期方法所需的材料。\n\n您可以在此处找到用于获取 `CEUs` 以续期 `CySA+`\
  \ 的行业认证完整列表：\n\n[`certification.comptia.org/continuing-education/renewothers/ renewing-cysa`](https://certification.comptia.org/continuing-education/renewothers/renewing-cysa)\n\
  \n## 使用本书进行练习\n\n本书由六章组成。前四章每章涵盖一个领域，包含各种问题，可以帮助您测试对真实世界、场景和基于最佳实践的安全知识的理解。最后两章是完整的模拟考试，可以作为限时练习测试，帮助判断您是否已准备好参加\
  \ `CySA+` 考试。\n\n我们建议参加第一次模拟考试，以帮助识别您可能需要投入更多学习时间的地方，然后使用特定领域的章节来测试您薄弱的领域知识。一旦准备就绪，请参加第二次模拟考试，以确保您已涵盖所有材料并已准备好尝试\
  \ `CySA+` 考试。\n\n在处理书中的问题时，您可能会遇到可能不熟悉的工具和技术。如果您发现自己面临持续的差距，或者某个领域特别具有挑战性，我们建议花一些时间深入研究该领域的书籍和材料。这可以帮助您填补空白并帮助您为考试做好充分准备。\n\
  \n# CompTIA CySA+（网络安全分析师）考试目标图 CS0-001\n\n以下针对 CompTIA `CySA+`（网络安全分析师）认证考试的目标图将帮助您找到每个目标在书中的对应章节。\n\
  \n## 目标图\n\n| 目标 | 章节 |\n| --- | --- |\n| **1.0 威胁管理** | |\n| 1.1 给定场景，使用适当工具和过程应用环境侦察技术。\
  \ | 第 1 章 |\n| 流程/常见任务包括拓扑发现、操作系统指纹识别、服务发现、数据包捕获、日志审查、路由器/防火墙 `ACL` 、电子邮件收集、社交媒体画像分析、社会工程学、DNS\
