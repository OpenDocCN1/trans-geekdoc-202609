  ### 172. C. 跨站脚本和跨站请求伪造漏洞通常很容易通过漏洞扫描检测，因为扫描器可以获得攻击成功的视觉确认。未打补丁的 Web 服务器通常通过使用公开的横幅信息来识别。虽然扫描器通常可以检测许多类型的\
