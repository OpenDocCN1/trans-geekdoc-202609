  \ IP 地址或主机正在为同一个系统响应。\n\n### 145. C\n大多数网络设备的最佳实践是将其管理接口放在受保护的网络上。许多组织还要求管理员通过跳板机（jump\
  \ box）连接，从而增加另一层保护。防止控制台访问通常不是理想的，以防在需要进行更改且没有 GUI 的情况下；`login-block` 可以提供帮助，但只能减缓攻击而无法阻止攻击。\n\
  \n### 146. C\n此扫描仅显示 `UDP` 端口。由于大多数服务作为 `TCP` 服务运行，此扫描无法识别大多数常用服务器。Ron 应该检查他的团队作为练习一部分发出的命令。如果他发现运行\
  \ `nmap` 时带有 `-sU` 标志，他就找到了问题所在。\n\n### 147. C\n密码结合基于令牌（token）的认证可以防止针对密码或密码+PIN\
  \ 组合可能成功的暴力破解攻击。生物识别因素很有用，但通常具有重大的维护和部署开销，而且通常比基于令牌的第二因子更难使用。\n\n### 148. C\n此命令将防止在\
