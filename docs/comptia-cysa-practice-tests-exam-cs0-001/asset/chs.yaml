  \ B. 此设置在 60 秒内发生五次失败尝试时，将阻止所有登录 120 秒。这可以减慢暴力破解攻击的速度，但 Rick 应该建议他所在的组织如果尚未这样做，可能希望考虑通过受保护的网络分段来适当隔离管理接口，而不仅仅是使用退避算法。\n\
  \n### 19. B. 美国国防部的可信铸造计划旨在确保集成电路设计和制造的完整性和机密性。这有助于确保外国政府代理无法 IC 中插入缺陷或代码，这些代码可能被用于情报或网络战争活动。\n\
  \n### 20. D. `netstat` 适用于 Windows、Linux 和 macOS 系统，可以提供有关网络上其他系统的信息以及主机已连接系统的开放端口信息。Chris\
  \ 可以搜索常见的 Web 和数据库服务器服务端口，以帮助识别他正在寻找的本地目标。\n\n### 21. B. `NIST SP 800-115` 指南描述了渗透四个四个阶段：规划、发现、攻击和报告。Alice\
  \ 正在进行发现。在此阶段，她还可能扫描系统和网络、进行被动情报收集，或使用工具收集有关目标的额外信息。\n\n### 22. C. 默认情况下，`nmap`\
  \ 使用 TCP SYN 扫描。如果用户没有正确的 socket 权限（例如 Linux 系统上的 `root`），它将使用 TCP connect 扫描。\n\
  \n### 23. D. `netcat`、`telnet` 和 `wget` 都可以用于执行 Isaac 的 banner 抓取（banner grabbing）练习。`FTP`\
  \ 将无法正常连接以获取他看到的 banner。\n\n### 24. A. 通过要求身份验证来限制组织的可用信息，将极大地限制潜在攻击者收集信息的能力。安全的域名注册可能会隐藏注册联系人的信息，但并没有提供任何真实的额外保护。限制职位发布中列出的技术有助于限制攻击者可能发现的内容，但大多数组织更倾向于更好地匹配候选人。最后，清除所有元数据有助于保护有关内部系统和设备的信息，但很难强制执行，而且文档元数据不是获取大多数组织信息的主要来源。\n\
  \n### 25. B. 既然 `Cassandra` 正在扫描无线网络，且系统使用的 IP 地址是商品无线路由器常用的地址，她最好的猜测应该是这是一个可以通过\
  \ `ssh` 访问的无线路由器，并且正在提供 Web 管理界面和打印服务。`nmap` 提供的操作系统指纹识别并不总是可靠的，在这种情况下 `VirtualBox`\
  \ 的匹配是一个误报。实际扫描的主机是一台运行开源固件和额外软件的 Asus 路由器。\n\n### 26. C. 该设备允许到端口 `10001` 的 `telnet`\
  \ 连接，并识别自己为自动储罐计。John 应该建议禁用 `telnet` 或使用防火墙或其他安全设备保护设备，以防止未经授权的远程访问。\n\n### 27.\
  \ B. 命令 `nbtstat -c` 显示 NetBIOS 名称缓存的内容，并显示名称到 IP 地址的映射列表。\n\n### 28. C. `Wayback\
  \ Machine` 及类似网站捕捉互联网网站的定期快照，允许渗透测试人员和其他执行侦察活动的人从目标网站的历史版本中收集信息。这意味着长期的数据泄露除了搜索引擎缓存外，还可能在此类网站存档。\n\
  \n### 29. D. 使用 `-O`（操作系统指纹识别）和详细标志时，`nmap` 会提供通用平台枚举（ CPE）数据。如果 Kristen 看到的是 `-sV`\
