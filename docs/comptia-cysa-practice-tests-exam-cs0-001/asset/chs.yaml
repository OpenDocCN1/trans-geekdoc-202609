  \ 漏洞\n4. 邮件服务器上的严重 2 漏洞\n\n\n\n\n\n# 第 6 章\n\n## 模拟考试 2\n\n### 78. 下列哪个文档类别为组织的网络安全计划提供了最高级别的权威性？\n\
  \n1. 策略 (Policy)\n2. 标准 (Standard)\n3. 流程 (Procedure)\n4. 框架 (Framework)\n\n###\
  \ 79. Chris 正在为他的组织计划漏洞扫描程序，并安排对其环境中的所有服务器进行每周扫描。一组系统管理员找到他，要求直接访问扫描报告，而不通过安全团队。Chris\
  \ 应该如何回应？\n\n1. Chris 应该向管理员提供访问权限。\n2. Chris 应该拒绝管理员的访问权限请求，因为这些信息可能会暴露关键的安全问题。\n\
