  13. C. 在渗透测试期间，红队是攻击者，蓝队是防御者，白队建立交战规则和性能指标。\n\n14. A. Charles 可以看到没有发生无效登录，且有人在非工作时间以该用户身份登录了。这意味着该账户可能已被破解，他应该调查密码是如何丢失的。（在许多情况下，Charles\
  \ 需要询问财务副总裁关于糟糕的密码习惯，例如将密码写下来或使用简单密码。）\n\n15. C. 放置在其他未使用网络空间中的检测系统会检测盲目遍历 IP 范围的扫描。由于没有列出公共服务，扫描此范围的攻击者可以假设是敌意的，并且通常会被保护系统的安全设备拦截。\n\
  \n16. B. 跳板机（jump box）允许更容易地记录管理访问日志，并在管理工作站和受保护的网络之间提供额外的保护层。在这种情况下，Angela 的需求通过跳板机得到最好的满足。堡机完全暴露在攻击之下；管理虚拟机有用，但不能让集中审计变得容易，并且虚拟机主机被破解可能会导致问题。最后，直接\
  \ `ssh` 或 `RDP` 需要对所有管理工作站进行审计，并允许被破解的工作站通过直接连接到安全网络产生问题。\n\n17. C. 此流样本显示了从 `192.168.2.1`\
