  4. `10.0.69.232`\n\n168. Beth 正在配置漏洞扫描工具。她最近了解到一种需要用户具有系统本地访问权限的权限提升漏洞。她希望确保她的扫描器能够检测到此类以及未来的漏洞。她采取什么行动可以最好地提高扫描器的能力？\n\
  \n1. 启用凭据扫描。\n2. 运行手动漏洞更新。\n3. 增加扫描频率。\n4. 改变组织的风险偏好。\n\n169. Shannon 查看了 Web 服务器的漏洞扫描报告，发现它有多个\
  \ SQL 注入和跨站脚本漏洞。Shannon 处理这些问题最简单的方法是什么？\n\n1. 安装 Web 应用防火墙 (WAF)。\n2. 重写 Web 应用程序以包含输入验证。\n\
  3. 为操作系统应用安全补丁。\n4. 为 Web 服务应用安全补丁。\n\n170. Ron 负责将漏洞扫描报告分给修复漏洞的系统工程师。Ron 分发报告的最有效且安全的方法是什么？\n\
  \n1. Ron 应该配置自动生成报告并向管理员发送结果的自动通知。\n2. Ron 应该手动运行报告并在出于安全考虑审查后发送自动通知。\n3. Ron 应该在自动的基础上运行报告，并在审查后手动通知管理员结果。\n\
  4. Ron 应该手动运行报告，并在审查后手动通知管理员结果。\n\n171. Karen 对她组织内部网络上的 Web 服务器运行了漏洞扫描。她得到了所示的报告。什么情况会导致\
  \ Karen 将此漏洞视为误报？\n\n![](img/c02f072.jpg)\n\n1. 服务器运行 `SSLv2`。\n2. 服务器运行 `SSLv3`。\n\
  3. 该服务器仅供内部使用。\n4. 服务器不包含敏感信息。\n\n172. 以下漏洞中哪一个最难通过外部漏洞扫描确认？\n\n1. 跨站脚本 (XSS)\n\
  2. 跨站请求伪造 (CSRF)\n3. 盲注 SQL 注入\n4. 未修补的 Web 服务器\n\n\n\n\n\n### 173. Ann 希望通过采用持续监控方法来改进其组织检测和修复安全漏洞的能力。以下哪项*不是*持续监控计划的特征之一？\n\
  \n1. 分析并报告发现的结果\n2. 在漏洞被利用时进行取证调查\n3. 缓解与发现的结果相关的风险\n4. 将发现的结果相关的风险转移给第三方\n\n###\
  \ 174. Holly 对其数据中心的一台服务器进行了扫描，最严重的结果是所示的漏洞。为了修复此漏洞，最常采取的操作是什么？\n\n![](img/c02f073.jpg)\n\
  \n1. 从服务器上删除该文件。\n2. 编辑该文件以限制信息泄露。\n3. 对该文件进行密码保护。\n4. 将文件访问限制在特定的 IP 范围内。\n\n###\
  \ 175. Nitesh 希望识别其网络上任何未在其资产系统中注册的系统。他查看了漏洞扫描器的报告控制台，看到了此处所示的选项。以下哪种报告类型将是他最可能的起点？\n\
  \n![](img/c02f074.jpg)\n\n1. 技术报告 (Technical Report)\n2. 高危报告 (High Severity Report)\n\
  3. Qualys 补丁报告 (Qualys Patch Report)\n4. 未知设备报告 (Unknown Device Report)\n\n### 176.\
  \ 哪种策略可以立即向漏洞扫描器报告配置更改？\n\n1. 计划扫描\n2. 持续监控\n3. 自动修复\n4. 自动更新\n\n### 177. 在最近的漏洞扫描中，Mark\
  \ 发现一个内部 Web 应用程序存在允许跨站脚本攻击的缺陷。他与负责该应用程序的团队经理交谈，并告知他发现了一个已知漏洞，经理已与其他领导合作并确定该风险是可接受的，不需要修复。Mark\
  \ 应该怎么做？\n\n1. 反对经理的方法并坚持修复。\n2. 将该漏洞标记为假阳性。\n3. 安排在六个月后修复该漏洞。\n4. 将该漏洞标记为异常情况。\n\
  \n### 178. Jacquelyn 最近读到关于 Apache Web 服务器的一个新漏洞，该漏洞允许攻击者从远程执行任意代码。她证实了她的服务器存在此漏洞，但今天早晨的漏洞扫描报告显示服务器是安全的。她联系了供应商，确定他们已经发布了此漏洞的签名，并且在其他客户处运行正常。Jacquelyn\
  \ 可以采取哪种操作最可能有效地解决该问题？\n\n1. 将 Web 服务器加入扫描范围。\n2. 重启漏洞扫描器。\n3. 更新漏洞源。\n4. 等明天的扫描。\n\
  \n### 179. Dennis 正在开发一份清单，将供其大型组织内的不同安全团队使用。他可以使用哪种 SCAP 组件来帮助编写清单并以标准方式报告结果？\n\
  \n1. XCCDF\n2. CCE\n3. CPE\n4. CVE\n\n### 180. Vincent 是一家受 FISMA 约束的美国联邦政府机构的安全经理。为了使其漏洞扫描维持\
  \ FISMA 合规性，以下哪项*不是*他必须遵循的要求之一？\n\n1. 至少每月运行一次完整扫描。\n2. 使用有助于互操作性和自动化的工具。\n3. 修复真实的漏洞。\n\
  4. 分享来自漏洞扫描过程的信息。\n\n### 181. Sharon 正在为她的组织设计一个新的漏洞扫描系统。她必须扫描一个包含数百个未托管主机的网络。以下哪种技术在检测环境中系统配置问题方面最有效？\n\
  \n1. 基于代理的扫描 (Agent-based scanning)\n2. 凭据扫描 (Credentialed scanning)\n3. 基于服务器的扫描\
  \ (Server-based scanning)\n4. 被动网络监控 (Passive network monitoring)\n\n### 问题 182\
  \ 至 184 涉及以下场景：\n\n* Arlene 对供承包商和员工用于访问其组织网络的 VPN 服务器运行了漏洞扫描。对该服务器的外部扫描发现了所示的漏洞。\n\
  \n![](img/c02f075.jpg)\n\n### 182. 以下哪种哈希算法*不会*触发此漏洞？\n\n1. MD4\n2. MD5\n3. SHA-1\n\
  4. SHA-256\n\n### 183. 未能修复此漏洞最可能的结果是什么？\n\n1. 所有用户都能访问该网站。\n2. 所有用户都能访问该网站，但某些可能会看到错误消息。\n\
  3. 部分用户将无法访问该网站。\n4. 所有用户都无法访问该网站。\n\n### 184. Josh 如何能够修复此漏洞？\n\n1. 重新配置 VPN 服务器以仅使用安全的哈希函数。\n\
  2. 请求新证书。\n3. 更改服务器的域名。\n4. 实施入侵预防系统。\n\n### 185. Bruce 在查看漏洞扫描结果后，发现其组织中的许多服务器容易受到暴力破解\
  \ SSH 攻击。他想确定哪些外部主机尝试对其服务器建立 SSH 连接，正在查看防火墙日志。相关流量可能使用哪个 TCP 端口？\n\n1. 22\n2. 636\n\
  3. 1433\n4. 1521\n\n### 186. Terry 对组织中的网络设备运行漏洞扫描，看到其中一个设备所示的漏洞报告。他应该采取什么操作？\n\n\
  ![](img/c02f076.jpg)\n\n1. 不需要采取操作，因为这是一个信息报告。\n2. 升级证书版本。\n3. 替换证书。\n4. 验证是否使用了正确的加密算法。\n\
  \n### 187. Lori 在准备 CySA+ 考试时学习漏洞扫描。为了避免给她的组织带来问题，她在准备期间应该遵循的原则不是以下哪个？\n\n1. 在生产系统上仅运行无害扫描以避免中断生产服务。\n\
  2. 以安静的方式运行扫描，不通知其他 IT 人员扫描或结果，以减少错误信息的影响。\n3. 限制扫描消耗带宽以避免阻塞活动链路。\n4. 在关键活动期间运行扫描以避免干扰业务。\n\
  \n### 188. Meredith 正在配置漏洞扫描，并希望配置扫描器执行凭据扫描。在所示的菜单选项中，哪个允许她直接配置此功能？\n\n![](img/c02f077.jpg)\n\
  \n1. 管理扫描 (Manage Scans)\n2. 配置扫描设置 (Configure Scan Settings)\n3. 配置搜索列表 (Configure\
  \ Search Lists)\n4. 设置主机身份验证 (Set Up Host Authentication)\n\n### 189. Norman 正在与其经理合作为公司实施漏洞管理计划。他的经理告诉他应该专注于修复关键高危风险，组织不想花时间关注评为中级或更低的风险。Norman\
  \ 的经理在使用哪种标准做出此决定？\n\n1. 风险承受能力 (Risk appetite)\n2. 假阳性 (False positive)\n3. 假阴性\
  \ (False negative)\n4. 数据分类 (Data classification)\n\n### 190. Chis 对其组织的 VPN 服务器运行漏洞扫描后，发现了所示的漏洞。生日攻击利用了哪种密码学情况？\n\
  \n![](img/c02f078.jpg)\n\n1. 不安全的密钥 (Unsecured key)\n2. 中间相遇 (Meet-in-the-middle)\n\
  3. 中间人 (Man-in-the-middle)\n4. 碰撞 (Collision)\n\n\n\n\n\n### 191. Meredith 最近对其组织的会计网络分段运行了漏洞扫描，并在几台工作站上发现了所示的漏洞。Meredith\
  \ 解决此漏洞的最有效方法是什么？\n\n![](img/c02f079.jpg)\n\n1. 从工作站上移除 `Flash Player`。\n2. 应用 `Adobe`\
  \ 公告中描述的安全补丁。\n3. 配置 `network firewall`（网络防火墙）阻止对这些工作站的未经的入站访问。\n4. 在网络上安装 `intrusion\
  \ detection system`（入侵检测系统）。\n\n**问题 192 至 197** 指的是所示漏洞。\n\n![](img/c02f080.jpg)\n\
  \n### 192. 根据漏洞报告中提供的信息，攻击者必须具有什么类型的访问权限才能利用此漏洞？\n\n1. 攻击者必须对系统具有物理访问。\n2. 攻击者必须对系统具有逻辑访问。\n\
  3. 攻击者必须能够访问系统所连接的本地网络。\n4. 攻击者可以远程利用此漏洞。\n\n### 193. 根据漏洞报告中提供的信息，攻击者利用此漏洞的难度有多大？\n\
  \n1. 利用此漏洞需要难以找到的特殊条件。\n2. 利用此漏洞需要某种程度的特殊条件。\n3. 利用此漏洞不需要任何特殊条件。\n4. 在没有 `administrator\
  \ account`（管理员账户）的情况下，无法利用此漏洞。\n\n### 194. 根据漏洞报告中提供的信息，攻击者在利用此漏洞时需要克服哪些身份验证障碍？\n\
  \n1. 攻击者需要进行两次或多次的身份验证。\n2. 攻击者需要进行一次身份验证。\n3. 攻击者不需要进行身份验证。\n4. 无论身份验证的次数多少，攻击者都无法利用此漏洞漏洞。\n\
  \n### 195. 此漏洞对组织构成了什么水平的机密性风险？\n\n1. 对机密性没有影响。\n2. 可以访问某些信息，但攻击者无法对被泄露的信息进行控制。\n\
  3. 可以访问大多数信息，但攻击者无法对被泄露的信息进行控制。\n4. 系统上的所有信息都可能被泄露。\n\n### 196. 此漏洞对组织构成了什么水平的完整性风险？\n\
  \n1. 对完整性没有影响。\n2. 可以修改某些信息，但攻击者无法对被修改的信息进行控制。\n3. 可以修改大多数信息，但攻击者无法对被修改的信息进行控制。\n\
  4. 系统上的所有信息都可能被修改。\n\n### 197. 此漏洞对组织构成了什么水平的可用性风险？\n\n1. 对可用性没有影响。\n2. 系统性能下降。\n\
  3. 系统上的一个或多个服务可能会停止。\n4. 系统被完全关闭。\n\n### 198. Dan 是其组织的漏洞管理器，负责跟踪漏洞修复工作。一个网络设备存在一个关键漏洞，Dan\
  \ 已经将该问题交给了设备管理员，但在多次提醒工程师后，该漏洞仍未解决。Dan 接下来应该做什么？\n\n1. 威胁要对工程师采取纪律处分。\n2. 由自己修复该漏洞。\n\
  3. 将该漏洞标记为异常。\n4. 将问题上报给网络管理员的经理。\n\n### 199. Sara 的组织拥有管理良好的测试环境。Sara 在尝试通过首先在测试环境中部署漏洞修复来评估其影响时，最可能面临的问题是什么？\n\
  \n1. 并非所有生产系统都有相应的测试系统。\n2. 生产系统需要与测试系统不同类型的补丁。\n3. 测试系统与生产系统之间存在显著配置差异。\n4. 测试系统运行的操作系统与生产系统不同。\n\
  \n### 200. 在所示报告中列出的漏洞中，有多少个漏洞足够严重立即修复？\n\n![](img/c02f081.jpg)\n\n1. 22\n2. 14\n\
  3. 5\n4. 0\n\n### 201. Laura 发现网络上一个设备存在操作系统漏洞。在扫描 `IP address` 时，她咨询的工程师告知她无法访问该操作系统。Laura\
  \ 的最佳操作建议是？\n\n1. 联系供应商以获取补丁。\n2. 获取操作权限并安装补丁。\n3. 将该漏洞标记为误报。\n4. 等待 30 天后重新扫描。\n\
  \n### 202. 以下哪种数据类型法律规定了漏洞扫描频率？\n\n1. 驾照号\n2. 保险记录\n3. 信用卡数据\n4. 医疗记录\n\n### 203.\
  \ Jim 负责管理组织的漏洞扫描计划。他遇到了问题：当尝试启动当天的扫描时，前天的扫描仍在运行。以下哪种解决方案最不可能解决 Jim 的问题？\n\n1. 增加扫描器。\n\
  2. 缩小扫描范围。\n3. 降低扫描敏感度。\n4. 减少扫描频率。\n\n### 204. Trevor 正在与应用程序团队合作修复一个面向服务的关键 SQL\
  \ 注入漏洞。团队担心部署修复将需要几个小时的停机时间，并将阻止交易完成。Trevor 建议的最合理操作是什么？\n\n1. 等到下一次计划的维护窗口。\n2.\
  \ 要求立即修复漏洞。\n3. 在在当天的低峰期安排紧急维护。\n4. 召集工作小组来评估形势。\n\n### 205. Renee 在对组织的数据中心进行漏洞扫描时，发现虚拟化平台管理接口暴露给了扫描器。在典型的操作情况下，该接口的正确暴露方式是什么？\n\
  \n1. 互联网\n2. 内部网络\n3. 不暴露\n4. 管理网络\n\n### 206. Richard 正在为其组织发现的漏洞设计修复程序。他希望在部署到生产环境之前，对任何供应商补丁进行充分测试。Richard\
  \ 在其程序中包含哪种类型的环境最能解决这个问题？\n\n1. 沙箱（Sandbox）\n2. 蜜罐（Honeypot）\n3. 蜜罐网（Honeynet）\n\
  4. 生产环境（Production）\n\n### 207. Becky 正在为组织的数据中心调度漏洞扫描。在调度扫描时，Becky 应该遵循以下哪项最佳实践？\n\
  \n1. 让扫描分布在每天。\n2. 让扫描在低活动期间运行。\n3. 让所有扫描在同一时间开始。\n4. 让扫描在高峰活动期间运行，以模拟负载下的性能。\n\n\
  \n\n\n\n208. 给定此处显示的 CVSS 信息，攻击者需要位于网络上的何种位置才能利用此漏洞？\n\n![](img/c02f082.jpg)\n\n\
  1. 攻击者必须在受影响系统上拥有本地管理员账户。\n2. 攻击者必须在受影响系统上拥有本地账户，但不一定需要管理访问权限。\n3. 攻击者必须访问本地网络。\n\
  4. 攻击者可以远程利用此漏洞，而无需在系统中拥有账户。\n\n# 第 3 章\n\n## 领域 3：网络安全事件响应\n\n### 本章涵盖的考试目标：\n\n\
  * **3.1 在给定的场景下，区分威胁数据或行为，以确定事件的影响。**\n    * 威胁分类\n    * 影响事件严重程度和优先级的因素\n* **3.2\
  \ 在给定的场景下，准备工具包并在调查期间使用适当的取证工具。**\n    * 取证工具包\n    * 取证调查调查套件\n* **3.3 解释在事件响应过程中通信的重要性。**\n\
  \    * 相关利益者\n    * 通信流程的目的\n    * 基于角色的职责\n* **3.4 在给定的场景下，分析常见症状以选择最佳行动方案以支持事件响应。**\n\
  \    * 常见的网络相关症状\n    * 常见的主机相关症状\n    * 常见的应用程序相关症状\n* **3.5 总结事件恢复和事件后响应流程。**\n\
  \    * 遏制技术\n    * 根除技术\n    * 验证\n    * 纠正措施\n    * 事件总结报告\n\n1. 如果 Lucca 想要验证他从应用程序供应商处下载的文件，他应该向他们请求什么信息？\n\
  \    1. 文件大小和文件创建日期\n    2. `MD5` 哈希值\n    3. 私钥和加密哈希值\n    4. 公钥和加密哈希值\n\n2. Jeff\
  \ 在对涉及事件的计算机进行取证调查期间，发现了多个 `.jpg` 照片。当他运行 `exiftool` 来收集文件元数据时，即使图像具有完整且完好的元数据，以下哪些信息不太可能是图像的一部分？\n\
  \    1. GPS 位置\n    2. 相机类型\n    3. 制作的副本数量\n    4. 正确的日期/时间戳\n\n3. Chris 想要对 Linux\
  \ 系统的密码运行 `John the Ripper`。他想在系统上尝试密码恢复，需要什么？\n    1. 同时需要 `/etc/passwd` 和 `/etc/shadow`\n\
  \    2. `/etc/shadow`\n    3. `/etc/passwd`\n    4. Chris 无法恢复密码；仅存储了哈希值。\n\n4.\
  \ Charles 需要检查他正在调查的 Windows 系统上目录结构设置的权限。哪种 Sysinternals 工具可以为他提供此功能？\n    1. `DiskView`\n\
  \    2. `AccessEnum`\n    3. `du`\n    4. `AccessChk`\n\n5. John 设计的网络如图所示，并将想要连接到网络的不可信系统放在访客（Guests）网络分段。这种类型的分段称为什么？\n\
  ![](img/c03uf001.jpg)\n    1. 主动网络分段\n    2. 隔离\n    3.  {\n    4. 移除\n\n6. Alex\
  \ 所在的组织使用 NIST 标准定义对安全相关事件进行分类。当他在一个经常出差的员工的笔记本电脑上发现键盘记录软件时，他应该使用哪种分类？\n    1. 事件\
  \ (An event)\n    2. 不良事件 (Adverse event)\n    3. 安全事件 (Security incident)\n   \
  \ 4. 策略违规 (Policy violation)\n\n7. Jennifer 计划为她的网络部署非法接入点检测功能。如果她想部署尽可能最有效的检测能力，她应该先部署以下哪种检测类型？\n\
  \    1. 授权 MAC\n    2. 授权 SSID\n    3. 授权信道\n    4. 授权厂商\n\n8. Dan 正在设计一个分段网络，将具有不同安全要求的系统放在不同的子网中，并在它们之间防火墙和其他网络安全设备。Dan\
  \ 处于事件响应流程的哪个阶段？\n    1. 事件后活动\n    2. 检测与分析\n    3. 准备\n    4. 遏制、根除和恢复\n\n9. Brian\
  \ 工作的公司处理信用卡，并被要求符合 `PCI-DSS`。如果 Brian 的公司发生了卡数据泄露，他们将被要求提供什么类型的披露？\n    1. 通知当地执法部门\n\
