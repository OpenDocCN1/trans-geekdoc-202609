  1. 调整扫描频率，避免在高峰时期进行扫描。\n2. 请求网络管理员增加带宽以适应扫描。\n3. 通知管理员扫描的重要性，并要求他们调整业务需求。\n4. 忽略该请求，因为它不符合安全目标。\n\
  \n## 75. 在遭到攻击后，从 30 天前的备份恢复系统，Michelle 公司的管理员将系统恢复服务。不久后，Michelle 再次检测到类似的入侵迹象。为什么许多情况下，从备份恢复系统是有问题的？\n\
  1. 备份无法进行安全问题测试。\n2. 从备份恢复可能会重新引入漏洞。\n3. 备份是在关闭防火墙的情况下进行的，恢复后是不安全的。\n4. 备份无法被妥善保护。\n\
