  \ Mike 需要日常的安全监控和运营，且聘用内部团队不符合 Mike 在这种场景下的资金模式限制，那么安全运营中心 (`SOC`) 将是。\n\n### 79.\
  \ C. 空隔离是一种设计模型，它消除了网络段或其他系统之间的连接。跨越空隔离唯一方法是在系统或网络之间携带设备或数据，这使得可移动介质成为这里的威胁向量。\n\
  \n### 80. C. Dan 可以查找组成 `MAC` 地址第一部分的厂商前缀。在这种情况下，Dan 将发现该系统很可能是 `Dell`（戴），这可能让他更容易在办公室找到这台机器。像\
  \ `SolarWinds` 这样的网络管理和监控工具内置了这种识别能力，更容易查看网络上是否出现了意外设备。当然，如果本地交换机是托管交换机，他还可以查询它以确定设备插在哪个端口，并顺着网线找到它！\n\
  \n### 81. C. `NIST` 识别了介质清理三个活动：清除（clearing），使用逻辑技术清除所有用户可访问存储位置中的数据；净化（purging），应用物理或逻辑技术，使得使用尖端实验室技术无法恢复数据；以及销毁（destruction），涉及物理上销毁介质。\n\
  \n### 82. B. 消磁（Degaussing）使用强电磁铁移除磁带介质上的数据，是净化的一种形式。\n\n### 83. A. 只要 Brian 习惯于依赖另一种备份机制，他就可以安全地禁用卷影复制并删除相关文件。对于他正在查看的驱动器，这将释放约\
  \ `26GB` 的可用存储。\n\n### 84. C. Danielle 追踪所发邮件原始来源的最佳方法是获取垃圾邮件的完整头信息（headers）。这将允许她确定邮件是源自她网络上的系统，还是邮件源被伪造了。一旦她获取了头信息，或者如果她无法获取，她可能想要检查列表中的其他一个或多个选项以发现潜在问题。\n\
  \n### 85. C. 大多数便携式消费设备，尤其是那些生成大文件的设备，将其存储格式化为 `FAT32`。`FAT16` 限于 `2GB` 分区，`RAW`\
  \ 是一种照片文件格式，`HFS+` 是 `macOS` 的原生文件格式。Lauren 可以预期大多数设备默认将介质格式化为 `FAT32`，因为它在不同设备和操作系统之间具有广泛的兼容性。\n\
  \n### 86. C. `ifconfig` 采集的流量值在达到 `4Gb` 数据时重置，这使其在处理大量流量时成为评估系统发送多少流量的不可靠手段。Alex\
  \ 应该使用专门用于监控流量水平的替代工具来评估系统的带宽使用情况。\n\n### 87. C. Brian 应该确定是否需要现场取证信息，但如果他不确定，对他来说最安全的路径是收集现场取证信息，拍照以便他了解每个系统是如何设置和配置的，然后关闭电源。随后他会将每个系统记录为证据，并在到达取证工作区后可能会为驱动器创建取证副本，或使用便携式取证系统在现场制作驱动器镜像。关闭运行中的系统会导致重要取证信息的丢失，这意味着通常不建议在收集某些信息之前关闭系统。收集驱动器的静态镜像则需要先关闭系统！\n\
  \n### 88. B. 当为民事案件产生取证证据或信息时，被称为电子证据发现（e-discovery）。这种类型的发现通常涉及大量数据，包括电子邮件、文件、短信和任何与案件相关的电子证据。\n\
  \n### 89. A. 个人身份信息 (`PII`) 包括可用于识别、联系或定位特定个人的信息。有时，`PII` 必须与其他数据结合才能实现这一点，但它对于直接识别个人仍然有用。Charles\
  \ 和 Linda 分类的数据是 `PII` 的示例。`PHI` 是个人健康信息。知识产权是人类大脑的创造，包括受版权保护、发明和其他类似财产。`PCI-DSS`\
  \ 是支付卡行业数据安全标准。\n\n### 90. C. 证据链表（chain of custody form）用于记录调查中每一位处理证据或与证据接触的人员。通常，调查工作也是以完全记录所有所采取行动的方式进行的，有时需要两个人在场核实。\n\
  \n### 91. A. 由于 Scott 需要了解更多关于漏洞的信息，从内部网络进行认证扫描将为其提供最多的信息。他将无法获得攻击者的视角，但在这种情况下，更多细节是重要的！\n\
  \n### 92. C. 管理层在事件响应中的主要作用是为适当应对事件提供权限和资源。他们可能被要求做出业务决策、与外部小组通信以及评估对利益相关者的影响。\n\
  \n### 93. D. `auth.log` 和 `/etc/passwd` 都可能显示出新用户的证据，但 `auth.log` 将提供细节，而 Chris\
  \ 需要知道在此添加新用户之前存在哪些用户。Chris 通过检查 `auth.log` 将获得更有用的细节。\n\n### 94. C. Process Monitor（进程监）提供了对文件和注册表更改的详细跟踪，以及在确定应用程序对系统做了哪些更改时的有用细节。这通常被系统管理员以及取证和事件响应人员使用，因为它可以更容易帮助查明复杂的安装程序问题！\n\
  \n### 95. C. `NIST` 的文档中并不包含对每个系统和设备进行备份。相反，`NIST` 建议维护一个包含系统和应用程序关键信息的组织知识库。备份每个设备和系统可能极其昂贵。通常只对特定的系统和设备进行，其余的存储配置和恢复数据。\n\
  \n### 96. B. `NIST` 识别了响应生命周期中的四个主要阶段：准备；检测和分析；遏制、根除和恢复；以及事后活动。通知和通信可能发生在多个阶段。\n\
  \n\n\n\n\n97. D. 页面文件与许多系统文件一样，在 Windows 运行时是被锁定的。Charles 只需要关闭系统并复制页面文件即可。某些 Windows\
  \ 系统可能设置为在系统关闭时清空页面文件，因此他可能需要直接拔掉电源以获取一个完整的页面文件。\n\n98. B. 检查 SSID 将没有帮助，因为“恶性孪生”（evil\
  \ twin）会特意克隆合法 AP 的 SSID。可以通过检查其 `BSSID`（无线 MAC 地址）来识别恶性孪生。如果无线 MAC 地址已被克隆，检查信道、`cipher`\
  \ 或身份验证方法等额外属性有助于识别它们。在许多情况下，还可以使用在信标帧（beacon frames）中作为标记参数发送的组织唯一标识符（`OUI`）来识别。\n\
  \n99. C. 填充空间（Slack space）是留下的存储空间，是因为文件没有占用分配给它们的整个空间。由于 `Unallocated`（未分配）分区上没有文件系统，因此该空间不应被视为填充空间。`System\
  \ Reserved` 划分和 `C:` 盘均使用 `NTFS` 格式化，文件之间会有填充空间。\n\n100. C. Luke 应该预期他正在寻找的大部分设置包含在\
  \ `plists`（即属性列表）中，这些是经过编码为二进制格式的 XML 文件。\n\n101. C. 在没有其他要求的情况下，许多组织会选择一到两年的保留期。这留出了足够的时间利用现有信息进行调查，但又不会保留过多数据以至于无法管理。无论选择多长的时间，组织都应该制定并一致地遵守保留政策。\n\
  \n102. C. 如果 Alice 侧重于快速恢复，她很可能无法保留在较长的事件响应过程中能够保留的所有证据。由于她侧重于快速恢复，服务应该更快地可用，且服务和系统不应受到恢复过程的任何重大损坏。如果她不进行全面的司法调查，而是专注于服务恢复，那么实施该策略所需的时间通常会更短。\n\
  \n103. D. 刑事调查可能需要很长时间才能解决。在大多数情况下，Joe 应该确保在可预见的未来他可以在没有服务器的情况下继续运行。\n\n104. C.\
  \ `RAW` 镜像（如通过 `dd` 创建的镜像）是 Lauren 获得广泛兼容性的最佳选择。许多法医学工具支持多种镜像格式，但 `RAW` 文件几乎被法医学工具支持。\n\
  \n105. D. 如果 Windows 系统配置了此类功能，会在安全审核日志中记录新设备连接。此外，信息会在 `setupapi` 日志文件和注册表中被收集，包括设备信息、其序列号，通常还包括制造商和型号详情。用户的配置文件不包含设备信息。\n\
  \n106. B. 当从挂载该驱动器的系统捕获网络共享或挂载驱动器时，诸如已删除的文件、未分配空间和其他需要直接访问驱动器的信息将不会被捕获。如果 Scott\
  \ 需要这些信息，他将需要从主机服务器为该驱动器创建法医学镜像。\n\n107. D. NIST 将客户、成员、介质、其他事件响应团队、互联网服务提供商、事件报告人员、执法机构以及软件和支持供应商视为\
  \ `IR` 团队将与之通信的外部人员。\n\n108. B. 问题包括检测、分析或缓解安全事件需要哪些工具和资源，以及诸如如何改进信息共享、哪些方面可以做得更好或不同，以及现有流程和政策的有效性如何等主题，都可以作为教训回顾的一部分。\n\
  \n109. B. 常见存储位置的易失顺序如下：\n\n1. CPU 缓存、寄存器、运行进程、RAM\n2. 网络流量\n3. 磁盘驱动器\n4. 备份、打印输出、光介质\n\
  \n110. C. 将系统从网络中移除通常是事件响应过程中抑制阶段的一部分。在恢复阶段结束之前，系统通常不会返回网络。\n\n111. D. `MD5`、`SHA-1`\
  \ 和 `SHA-2` 哈希值均被认为在司法上是可靠的。虽然 `MD5` 哈希值不再是一种安全的哈希手段，但它们仍被认为适用于验证司法镜像，因为攻击者不太可能故意创建哈希冲突来伪造硬盘的司法完整性。\n\
  \n112. D. NIST 的《计算机安全事件处理指南》指出，识别攻击者可能是“耗费时间且徒劳的”。通常情况下，对于大多数组织来说，花费时间识别攻击者并不是事件响应时间的一种有价值的利用。\n\
  \n113. B. 创建涵盖日志、文件更改和许多其他人工物的事件时间线的能力被称为 `Super Timeline`（超级时间线）。`SIFT` 包含了这种能力，允许\
  \ Rick 决定他想要哪些事件类型和模块作为其基于时间线的事件视图的一部分。\n\n114. B. 熟练的攻击者不太可能为想要隐藏的账户创建一个新的主目录。检查\
  \ `/etc/password` 和 `/etc/shadow` 是否有新账户是检测意外账户的快速方法，检查 `sudoers` 以及在 `wheel` 和其他高权限组中的成员身份可以帮助\
  \ Charles 检测到具有增加权限的意外账户。\n\n115. A. 信息共享与分析中心（`ISACs`）是信息共享和社区支持组织，工作于能源、高等教育和其他业务领域等垂直行业内。Ben\
  \ 可能会选择让他的组织加入一个 `ISAC`，以共享和获取与其组织业务特别相关的威胁和活动信息。`CSIRT` 是计算机安全事件响应团队，倾向于托管在单一组织中；`VPAC`\
  \ 是组合；而 `IRT` 是事件响应团队。\n\n116. C. 头部信息在追踪垃圾邮件时可能有用，但垃圾邮件发送者经常使用多种方法隐藏原始发送者的 IP 地址、电子邮件或其他细节。不幸的是，电子邮件地址经常被伪造，邮件地址可能是伪造的。在这种情况下，这些头部中唯一可验证的信息是源主机的\
  \ IP 地址。有时甚至这个细节也可以被伪造，但在大多数情况下，这仅仅是一个被入侵的主机。\n\n117. C. `macOS` 中的密钥存储用户凭据但不存储用户账户密码。列出的其他选项都是\
  \ Lauren 的可能解决方案，但如果系统开启了 `FileVault`，这些方案都将无效。\n\n118. C. iPhone 到本地系统的备份可以是全备份或增量备份，在这种情况下，最可能的问题是\
  \ Cynthia 恢复了一个增量备份。如果无法访问原始手机，她应该寻找其他备份文件。如果备份经过了加密，她在没有破解工具的情况下将无法访问它；如果备份被中断，她不太可能拥有备份文件或该文件处于可用状态。iCloud\
  \ 备份需要访问用户的计算机或账户，不太可能是司法调查的一部分。\n\n119. A. 第二位法医学检查员作为见证人，对所有文档签字并协助记录所有操作，既提供了强有力的文档，也提供了法庭上的另一个潜在证人。独立的司法操作无论记录得多么详尽，其可靠性都不如有证人。\n\
  \n\n\n\n\n## 120. B. 虽然在系统重建时应该将其与网络隔离似乎是显而易见的，但我们以前见过完全这种情况。在其中一个案例中，系统管理员吸取教训之前，系统再次被入侵了两次！\n\
  \n## 121. D. 驻留在 `MBR-`、`UEFI-` 和 `BIOS` 中的恶意软件包都能通过驱动器擦除，但在碎片空间（slack space）中隐藏文件将无法通过零擦除（zero\
  \ wipe）。虽然这些技术并不常见，但它们确实存在并且已经在实环境中出现过。\n\n## 122. D. 专利、版权权、商标和商业秘密都是知识产权的形式。专利、版权权和商标都是支持创作者的法律产物，而商业秘密是专有业务信息，并不受到政府的正式保护。\n\
  \n## 123. B. `BYOD`（自自带设备）日益普遍，管理员通常会发现网络利用率、支持工单和安全风险（由于配置错误、未打补丁或安全措施不当的设备）都会增加。大多数组织不会因为\
  \ `BYOD` 产生额外的设备成本，因为用户提供了他们自己的设备。\n\n## 124. A. Saria 看到的空间是文件末尾与每个簇或块分配空间之间的空间。该空间可能包含写入该簇或块的先一个文件的残留数据，也可能仅包含磁盘格式化或初始化时产生的随机数据。\n\
  \n## 125. C. 美国国家档案管理局通用记录日程规定，事件处理记录的保留期为三年。\n\n## 126. A. 可信的系统二进制工具包（如国家软件参考库提供的包）包含了许多操作系统和应用程序的已知良好哈希值。Kathleen\
  \ 可以使用 `NSRL` ([`www.nsrl.nist.gov/new.html`](https://www.nsrl.nist.gov/new.html))\
  \ 等参考资料来验证她系统上的文件。\n\n## 127. A. 感知可插认证模块（`PAM`）的应用程序在 `/etc/pam.d` 目录下有一个。这些文件列出了定义模块以及启用了哪些设置或控制的指令。Charles\
  \ 应该确保他所使用的多因素身份验证系统按照他正在审查的服务在 `PAM` 文件中进行了要求的配置。\n\n## 128. B. NIST 特别建议记录系统的主机、`MAC\
  \ addresses` 和 `IP addresses`。捕获 `ipconfig` 或 `ifconfig` 命令的完整输出可能有用，但取证分析可能不允许与活动机交互。对于任何机器，域（或域成员身份）等额外细节可能可用也可能不可用，在大多数情况下不需要\
  \ `NIC` 制造商和类似的数据。\n\n## 129. D. 由于绝大多数 APT（包括题目中指定的这一个）以加密形式发送流量，执行网络取证或流量分析将只会提供有关可能被感染的主机的信息。如果\
  \ Chris 想找到可能存在于端点系统上的实际工具，他应该进行端点取证。在此过程中，他可能使用端点行为分析、网络取证和网络流量分析来帮助识别目标系统。\n\n\
  ## 130. B. 每个防病毒或反恶意软件供应商都使用自己的名称来命名恶意软件，导致同一个恶意软件包或家族显示出不同的名称。在这种情况下，该恶意软件包是一个勒索软件；某些供应商将其称为\
  \ `GoldenEye` 或 `Petya`。\n\n## 131. B. 当系统不是必须保持在线的关键业务资产时，最佳响应通常是将其与可能对其产生负面影响的其他系统和网络隔离。通过断开与所有网络的连接，Ben\
  \ 可以安全地调查问题，而不会引起不必要的风险。\n\n我们实际上遇到过这种情况。经过调查，我们发现用户的文本转语音程序已开启，且麦克风增益调到了最大。系统根据对背景噪声的解释自动输入单词，导致产生了奇怪的文本，真的让毫无防备的用户惊恐了。\n\
  \n## 132. C. 当簇被覆盖时，原始数据会留在新文件末尾与簇结束之间未使用的空间中。这意味着将新文件覆盖到旧文件可能会留下残留数据，通过检查碎片空间，这可以帮助\
  \ Kathleen 证明这些文件曾存在于系统上。\n\n## 133. C. `snmpwalk` 命令行提供了你所需的线索。`-c` 标志指定要使用的团体字符串（community\
  \ string），`-v` 标志指定 `SNMP` 版本。由于我们知道团体字符串，你可以假设联系 ID 是 `root` 而不是团体字符串。\n\n## 134.\
  \ C. macOS 用于测量内存、CPU、磁盘、网络和功耗的内置工具是 `Activity Monitor`。Windows 使用 `Resource Monitor`，`Sysradar`\
  \ 是为此题虚构的，而 `System Monitor` 用于通过 `RPC` 从微软的 `SQL Server` 收集信息。\n\n## 135. A. 如果\
  \ Angela 尝试访问的系统在睡眠之前挂载了加密卷并且存在休眠文件，Angela 可以使用休眠文件分析工具检索 `BitLocker` 密钥。如果系统没有休眠，或者在系统睡眠时卷未挂载，她将无法检索密钥。内存分析对关闭状态的系统无效，启动区不包含密钥，而且由于耗时问题，暴力破解不是破解\
  \ `BitLocker` 密钥的可行方法。\n\n## 136. C. 伪代码告诉你 Adam 正在尝试检测属于短通信（少于 10 个数据包且少于 3,000\
  \ 字节）的外站数据包，并且他认为流量可能看起来像网络流量、通用 TCP 流量或不匹配已知流量类型。他还通过不匹配 `uripath` 和 `contentencoding`\
  \ 来确保通用网络流量不会被捕获。\n\n## 137. B. 服务通常由 `xinetd` 启动（尽管某些发行版的新版本使用 `systemctl`）。`/etc/passwd`\
  \ 和 `/etc/shadow` 都与账户相关，而 HOME/.ssh/` 包含 SSH 密钥和其他登录详情。\n\n## 138. B. NIST 将敏感或专利信息的更改或删除分类为完整性损失。当未分类的专利信息被访问或泄露时，会发生专利泄露；隐私泄露则涉及个人身份信息（PII）的访问或泄露。\n\
  \n## 139. C. 在响应人员努力遏制事件时，他们还应该为未来的分析预留取证和事件信息。在遏制期间，恢复服务通常优先于分析，但花时间创建取证镜像并保留日志和其他数据对于后续调查非常重要。\n\
  \n## 140. C. Susan 正在审查的系统只开启了失败日志，不会记录成功登录。她无法依赖日志来显示谁登录了，但可能发现其他活动取证指标，包括用户配置目录和应用程序缓存的变化。\n\
  \n## 141. A. 基于图像的唯一陈述是有两个远程用户通过 `ssh` 登录了系统。端口 9898 在 IANA 注册为 `Monkeycom`，但通常用于\
  \ `Tripwire`，导致服务识别错误。本地系统属于 `example.com` 域，且运行的命令由于 `-at` 标志的原因不会显示任何 UDP 服务，这意味着你无法验证是否有任何\
  \ UDP 服务在运行。\n\n## 142. A. Windows 在图形界面或命令行中均包含内置的安全擦除工具。使用诸如 `Eraser` 的第三方程序或诸如\
  \ `DBAN` 的可启动工具是一个合理的选择，对整个驱动器进行加密然后删除密钥将产生相同的效果。\n\n\n\n\n\n### 143. D. `CySA+`\
  \ 考试目标明确指出了数据，包括合并与收购信息以及会计数据。这些数据显然不是个人身份信息（PII）或个人健康信息（PHI），根据考试目标，使用企业机密数据比使用知识产权描述它们更准确。\n\
  \n### 144. C. 事后取证（Postmortem forensics）通常可以在关闭系统后进行，以确保制作完整的取证副本。现场取证镜像（Live forensics\
  \ imaging）有助于捕获内存驻恶意软件。它还可以在加密驱动器和文件系统为了实时使用而解密时协助捕获。最后，在系统启动时，通过将数据从系统到支持的文件系统类型，有时可以对不支持的文件系统进行镜像。这不会保留某些特定文件系统的数据，但可以允许关键的取证活动进行。\n\
  \n### 145. D. Linux 中没有确定用户账户年龄的通用标准。某些组织在创建用户时使用 `-c` 标志为用户账户添加注释，以记录创建时间。使用带有\
  \ `-ld` 标志的 `ls` 命令将显示文件的创建日期，如果在创建账户时为该用户创建了主目录，则这可能指示用户账户创建的时间，但这并非强制要求。如果使用了\
  \ `auditd`，则 `aureport` 命令非常有用，但这在不同的 Linux 发行版之间并不一致。\n\n### 146. B. 网络和系统的剖析将提供一组基准行为。`SIEM`\
  \ 或类似系统可以监控记录为事件的差异或异常。一旦与其他事件关联，就可以对它们进行调查，并可能证明为安全事件。动态和静态分析是代码分析的类型，而行为分析（或启发式分析）侧重于指示攻击或其他不良行为的特征。行为分析不需要基准；相反，它需要知道哪些行为是不可接受的。\n\
  \n### 147. C. 在感染或受破坏后，不应使用系统还原来重建系统，因为它只恢复 Windows 系统文件、某些程序文件、注册表设置和硬件驱动程序。这意味着个人文件和大多数恶意软件，以及在还原点创建之后安装的程序或对程序的修改，将不会被恢复。\n\
  \n### 148. B. 像 `FTK Imager Lite` 等便携式镜像工具可以从可移动介质上运行，允许捕获现场镜像。Ben 可能仍然想捕获系统内存，但当系统用于数据收集和外泄时，磁盘内容将至关重要。在这种系统必须保持在线且不应被修改的场景下，安装工具或将系统离线并挂载驱动器都是不利。\n\
  \n### 149. C. 文件系统审计子分类包括监控对对象的访问（事件 ID `4663`）和权限更改（事件 ID `4670`）的能力。Charles 可能对\
  \ `4670` 权限更改事件感兴趣，因为 `4663` 事件包含了读取、写入、删除和其他情况，而且会产生大量的杂乱信息！\n\n### 150. B. 如果\
  \ Charles 有充分理由相信自己是唯一拥有系统 `root` 权限的人，他应该寻找特权提升攻击。远程访问木马不会直接提供 `root` 权限，且被破解的\
