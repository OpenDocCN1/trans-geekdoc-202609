  \ 基于趋势的\n    4. 基于可用性的\n\n7. 在对其进行端口扫描时，Cynthia 发现一个工作站显示以下端口开放。她的下一步操作应该是？\n![](img/c01uf001.jpg)\n\
  \    1. 确定端口开放的原因。\n    2. 调查可能被攻击的工作站。\n    3. 运行漏洞扫描以识别存在漏洞的服务。\n    4. 重新启用工作站的主机防火墙。\n\
  \n8. Charles 想要为他的 Web 提供额外的安全性，该应用程序目前以明文形式在数据库中存储密码。以下选项是防止数据库被窃导致密码泄露的最佳选项？\n\
