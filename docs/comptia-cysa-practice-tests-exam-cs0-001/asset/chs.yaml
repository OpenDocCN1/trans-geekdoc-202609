  \ 80 和 443 是开放的。这些扫描结果最可能的原因是什么？\n\n1. CIFS 文件共享运行在端口 443 上。\n2. 防火墙配置阻止了扫描成功。\n\
  3. 扫描器配置阻止了扫描成功。\n4. CIFS 文件共享运行在端口 80 上。\n\n### 133. Thomas 今天早上获知一个影响其组织所使用的某主要服务的关键安全漏洞，需要立即打补丁。该漏洞是新闻报道的主题，正在被积极利用。Thomas\
