  ### 162. C. 被动网络监控符合 Sarah 的要求，即在最小化网络带宽消耗的同时不需要安装代理。Sarah 无法使用基于代理的扫描，因为这需要安装应用程序。她不应该使用基于服务器的扫描，因为这会消耗带宽。端口扫描不提供漏洞报告。\n\
