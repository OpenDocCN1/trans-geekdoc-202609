  \n1. 为了将 `0.0.0.0` 重定向到已知站点\n2. 防止防病毒软件更新\n3. 防止其他攻击者攻破系统\n4. 启用对系统的远程访问\n\n## 69.\
  \ Lauren 的网络防火墙拒绝所有入站流量，但允许所有出站流量。在调查 Windows 工作站时，她遇到一个运行以下命令的脚本：\n\n```\nat workstation10\
