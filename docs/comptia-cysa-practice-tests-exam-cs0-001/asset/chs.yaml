  \ Mary 排除了高影响漏洞，报告将不会包含任何评级为 `4` 或 `5` 的漏洞。\n\n### 100. D\n此漏洞被呈现为 `Info`（信息）级漏洞，因此对系统不构成实际威胁。James\
