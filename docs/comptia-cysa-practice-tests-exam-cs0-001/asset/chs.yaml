  \ `22` 上，作为安全的替代方案。端口 `161` 用于简单网络管理协议（`SNMP`），端口 `443` 用于安全的 Web 链接。\n\n### 13.\
  \ B\n该系统在端口 `3389` 上暴露了一个服务。此端口通常用于对 Windows 服务器进行远程管理访问。\n\n### 14. C\n此扫描报告中识别的问题运行在端口\
  \ `3389` 上的服务。Windows 系统使用端口 `3389` 进行远程桌面协议（`RDP`）。因此，Harold 应该首先转向此服务。\n\n###\
