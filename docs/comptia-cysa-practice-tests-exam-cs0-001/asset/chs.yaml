  \n\n\n\n\n## 64. A. 使用 `SYN cookies` 允许服务器假装其 `SYN` 队列比实际更大，从而减少或完全防止在 `SYN flood`（SYN\
  \ 洪水攻击）期间遇到的问题。通过丢弃队列中的 `SYNs` 并等待 `SYN-ACK`，服务器可以防止资源耗尽，同时对合法的连接请求做出响应。当然，`SYN\
  \ cookies` 对于超出 `SYN flood` 范围的 DOS 攻击无效！\n\n## 65. B. 随着攻击的成功，它们通常会创造额外的发现机会，导致更多攻击。测试计划本身以及最终报告阶段应该在每次渗透测试中进行一次。\n\
