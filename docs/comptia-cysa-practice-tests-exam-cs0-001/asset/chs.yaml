  \ Carla 正在对一个 Web 应用进行渗透测试，并希望使用允许她修改从其系统发送到远程 Web 服务器的请求的软件包。以下哪个工具*不能*满足 Carla\
  \ 的需求？\n\n1. Nessus\n2. Burp\n3. ZAP\n4. Tamper Data\n\n85. Alex 获知最近的一个微软补丁涵盖了\
  \ `Microsoft Office` 中的一个零日漏洞，该漏洞由于内存处理不当引起。该漏洞被描述为可能在当前权限级别下导致内存损坏和任意代码执行。如果受害者在漏洞版本的\
