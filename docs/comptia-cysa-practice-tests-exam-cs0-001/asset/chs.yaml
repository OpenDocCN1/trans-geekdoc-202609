  3. 数据库日志\n4. IDS 日志\n\n89. Krista 正在查看漏洞扫描报告，遇到了所示漏洞。她来自 Linux 背景，不太熟悉 Windows 管理。她不熟悉漏洞中提到的\
  \ `runas` 命令。最接近的 Linux 等效命令是什么？\n![](img/c02f037.jpg)\n1. sudo\n2. grep\n3. su\n\
  4. ps\n\n90. 在对 Web 应用程序进行扫描后，Barry 收到了所示结果。下列哪项最能描述此漏洞所带来的威胁？\n![](img/c02f038.jpg)\n\
  1. 攻击者可以窃听身份交换。\n2. 攻击者可以对 Web 应用程序发动拒绝服务攻击。\n3. 攻击者可以破坏该服务器使用的加密机制。\n\n\n\n\n\n\
  ### 4. 攻击者可以编辑运行在此服务器上的应用程序代码。\n\n### 91. Michelle 想要与使用不同漏洞扫描产品的合作伙伴组织共享有关漏洞的信息。SCAP\
  \ 的哪种组件能最好帮助她确保不同组织讨论的是同一种漏洞？\n\n1. `CPE`\n2. `CVE`\n3. `CVSS`\n4. `OVAL`\n\n###\
  \ 92. Javier 对其组织使用的一个网络设备进行了漏洞扫描，发现了此处所示的漏洞。该漏洞会导致哪种类型的攻击？\n\n![](img/c02f039.jpg)\n\
  \n1. 拒绝服务\n2. 信息盗取\n3. 信息篡改\n4. 侦察\n\n### 93. Amanda 扫描了其组织内的一台 Windows 服务器，发现其有多个关键漏洞，详细见此处所示的报告。Amanda\
  \ 采取哪种操作可以在不产生长期停机的情况下，对这些问题产生最显著的影响？\n\n![](img/c02f040.jpg)\n\n1. 配置主机防火墙以阻止入站连接。\n\
  2. 应用安全补丁。\n3. 禁用服务器上的访客帐户。\n4. 配置服务器仅使用安全加密算法。\n\n### 94. Ben 准备为其安全咨询组织的一个新客户进行漏洞扫描。Ben\
  \ 应该首先执行以下哪个步骤？\n\n1. 进行渗透测试。\n2. 运行漏洞评估扫描。\n3. 运行发现扫描。\n4. 获取扫描许可。\n\n### 95. Katherine\
  \ 协调组织内安全漏洞的修复，并正尝试与系统工程师合作对服务器进行补丁更新以修复一个中等影响的漏洞。工程师拒绝修复服务器，因为这可能会导致在服务器上运行的关键业务流程中断。Katherine\
  \ 采取的最合理行动方案是什么？\n\n1. 将补丁更新安排在常规维护周期期间进行。\n2. 考虑到关键业务影响，免除该服务器的补丁。\n3. 要求立即对服务器打补丁以修复漏洞。\n\
  4. 告知工程师，如果他不在一周内应用补丁，Katherine 将向其经理投诉。\n\n### 96. 在最近对其网络中的工作站进行漏洞扫描期间，Andrea\
  \ 发现了此处所示的漏洞。以下哪项操作最可能修复此漏洞？\n\n![](img/c02f041.jpg)\n\n1. 从工作站中移除 `JRE`。\n2. 将\
  \ `JRE` 升级到最新版本。\n3. 使用主机防火墙阻止端口 80 的入站连接。\n4. 使用网络内容过滤系统扫描恶意流量。\n\n### 97. Grace\
  \ 运行了漏洞扫描，并在一个面向的 Web 服务器上检测到一个紧急漏洞。该漏洞很容易被利用，可能导致服务器被完全攻破。Grace 想要在遵循变更控制最佳实践的同时，尽可能地缓解这一威胁。Grace\
  \ 的最佳行动方案是什么？\n\n1. 通过组织的变更管理流程启动高优先级变更，并等待变更获得批准。\n2. 立即实施修复，并在事后记录该更改。\n3. 将更改安排在下一次季度补丁周期中。\n\
  4. 通过组织的变更管理流程启动标准变更。\n\n### 98. Doug 正在为其组织准备一份漏洞扫描器的招标建议书（RFP）。他需要知道网络上的系统数量以帮助确定扫描器的需求。以下哪项不是获取此信息的简单方法？\n\
  \n1. `ARP tables`\n2. 资产管理工具\n3. `Discovery scan`\n4. 顾问最近运行的扫描结果\n\n### 99. Mary\
  \ 对其整个组织运行了漏洞扫描，并与团队的另一位分析师共享了报告。该报告的片段出现在此处。她的同事指出报告仅包含严重程度为 3、4 或 5 的漏洞。此结果的最可能原因是什么？\n\
  \n![](img/c02f042.jpg)\n\n1. 扫描敏感性被设置为排除低重要漏洞。\n2. Mary 没有正确配置扫描。\n3. 数据中心中的系统不包含任何\
  \ 1 级或 2 级漏洞。\n4. 扫描敏感性被设置为排除高影响漏洞。\n\n### 100. James 正在审查此处所示的漏洞，该漏洞在其环境中的几台服务器上检测到。James\
  \ 应该采取什么行动？\n\n![](img/c02f043.jpg)\n\n1. 禁止外部源对这些服务器的 `TCP/IP` 访问。\n2. 升级这些服务器上的操作系统。\n\
  3. 加密对这些服务器的所有访问。\n4. 无需操作。\n\n### 101. 以下哪种方法对于操作系统设置配置错误而存在于系统的漏洞提供了最新、最准确的信息？\n\
  \n1. 按需漏洞扫描\n2. 持续漏洞扫描\n3. 定计划漏洞扫描\n4. 基于代理的监控\n\n#### 第 102 至第 104 题参考以下场景：\n\n\
  * Pete 最近对其环境中的所有服务器和工作站进行了广泛的漏洞扫描。他扫描了以下三个网络：\n    * 包含具有公开暴露性的服务器的 DMZ 网络\n  \
  \  * 包含仅允许出站连接的工作站网络\n    * 包含仅对内部系统暴露的服务器的内部服务器网络\n* 他检测到以下漏洞：\n    * `Vulnerability\
  \ 1`:DMZ 服务器上的 SQL 注入漏洞，该漏洞将授予访问内部网络上数据库服务器的权限（严重程度 5/5）\n    * `Vulnerability 2`:内部服务器网络上网域控制器上的缓冲区溢出漏洞（严重程度\
  \ 3/5）\n    * `Vulnerability 3`:工作站网络上数百台 Windows 工作站缺少安全补丁（严重程度 2/5）\n    * `Vulnerability\
  \ 4`:DMZ 服务器上的拒绝服务漏洞，可能允许攻击者破坏面向的网站（严重程度 2/5）\n    * `Vulnerability 5`:内部服务器上的拒绝服务漏洞，可能允许攻击者破坏内部网站（严重程度\
  \ 4/5）\n* 注意这些漏洞的严重程度评分直接来自漏洞扫描器，而非由 Pete 分配。\n\n### 102. 在没有其他信息的情况下，Pete 应该首先修复报告中的哪个漏洞？\n\
  \n1. `Vulnerability 1`\n2. `Vulnerability 2`\n3. `Vulnerability 3`\n4. `Vulnerability\
  \ 4`\n\n### 103. Pete 正与桌面支持经理合作修复 `Vulnerability 3`。修复此问题最高效的方法是什么？\n\n1. 亲自访问每台工作站修复漏洞。\n\
  2. 远程连接到每台工作站修复漏洞。\n3. 使用远程配置工具执行注册表更新。\n4. 使用 `GPO` 应用补丁。\n\n### 104. Pete 最近与组织的首席安全官（CISO）交流，团队启动了一项应对内部威胁的计划。他们特别担心寻求超出授权访问范围的员工窃取信息。考虑到这一优先级，报告中的哪一个漏洞最受关注？\n\
  \n1. `Vulnerability 2`\n2. `Vulnerability 3`\n3. `Vulnerability 4`\n4. `Vulnerability\
  \ 5`\n\n\n\n\n\n### 105. Wanda 最近在她所在组织的一台 Windows 服务器上发现了此处所示的漏洞。由于运营问题，她在六周内无法为该服务器应用补丁。哪种变方案（workaround）最有效地限制该漏洞被利用的可能性？\n\
  \n![](img/c02f044.jpg)\n\n1. 限制系统的交互式登录。\n2. 从服务器上移除 Microsoft Office。\n3. 从服务器上移除\
  \ Internet Explorer。\n4. 应用安全补丁。\n\n### 106. Garrett 正在为其组织部署在 DMZ 网络上的新 Web 服务器配置漏洞扫描。该服务器托管公司的公共网站。Garrett\
  \ 应该配置哪种扫描以获得最佳结果？\n\n1. Garrett 不应该对 DMZ 系统进行扫描。\n2. Garrett 应该只执行外部扫描。\n3. Garrett\
  \ 应该只执行内部扫描。\n4. Garrett 应该同时执行内部和外部扫描。\n\n### 107. Frank 最近运行了漏洞扫描，发现一个 POS 终端由于运行了不支持的操作系统，包含一个无法修补的漏洞。Frank\
  \ 咨询了他的经理，并告知该 POS 在管理层完全知情的情况下使用，且作为补偿控制，它被放置在隔离网络上，无法访问其他系统。Frank 的经理告诉他商户已已知此问题。Frank\
  \ 应该如何处理这种情况？\n\n1. 将该漏洞记录为已批准的异常。\n2. 向他的经理解释 PCI DSS 不允许使用不支持的操作系统。\n3. 立即停用 POS\
  \ 系统以避免个人责任。\n4. 立即升级操作系统。\n\n### 108. James 正在为其组织用于处理信用卡交易的专用网络配置漏洞扫描。在 James\
  \ 的扫描计划中，哪些种类型的扫描最不重要？\n\n1. 来自卡片处理网络上专用扫描器的扫描。\n2. 来自其组织网络上外部扫描器的扫描。\n3. 来自由经过批准的扫描供应商运行的外部扫描器的扫描。\n\
  4. 这三种类型的扫描都同样重要。\n\n### 109. Helen 对其组织内部的一个局域网（LAN）进行了漏洞扫描，发现某个设备上有 Web 应用程序漏洞报告。调查后，她发现问题设备是一个打印机。在这种情况下，最可能的情况是什么？\n\
  \n1. 打印机正在运行 Web 服务器。\n2. 该报告是一个误报（false positive）结果。\n3. 打印机最近更改了 IP 地址。\n4. Helen\
  \ 无意中扫描了错误的网络。\n\n### 110. Joe 在其组织的数据库服务器中发现了一个严重漏洞，并获得了主管的许可，在下班后实施紧急变更。在计划的变更窗口之前，他还有八小时准备时间。除了规划变更的技术方面外，Joe\
  \ 还应该再做什么来准备变更？\n\n1. 确保所有利益相关者都已获知计划停机。\n2. 在组织的变更管理系统中记录该变更。\n3. 识别与变更相关的任何潜在风险。\n\
  4. 以上所有项。\n\n### 111. Julian 最近在他环境中的几台服务器上检测到了此处所示的漏洞。由于该漏洞的严重性，他希望通过防火墙规则阻止对受影响服务的访问，直到其解决。他确认了主机防火墙上开放了以下\
  \ TCP 端口。为了限制对该服务的访问，Julian 不需要需要阻塞以下哪一个端口？\n\n![](img/c02f045.jpg)\n\n1. 137\n\
  2. 139\n3. 389\n4. 445\n\n### 112. Ted 最近运行了其网络的漏洞扫描，结果结果让他应不应交。他希望关注最重要的漏洞。Ted\
  \ 应该如何重新配置他的漏洞扫描器？\n\n1. 增加扫描敏感度。\n2. 降低扫描敏感度。\n3. 增加扫描频率。\n4. 降低扫描频率。\n\n### 113.\
  \ 在运行漏洞扫描后，Janet 发现其网络上的几台机器正在运行 Internet Explorer 8，并报告了此处所示的漏洞。以下哪项将不是这些系统的合适替代浏览器？\n\
  \n![](img/c02f046.jpg)\n\n1. Internet Explorer 10\n2. Google Chrome\n3. Mozilla\
  \ Firefox\n4. Microsoft Edge\n\n### 114. Sunitha 在其组织开发的一个应用程序中发现了此处所示的漏洞。哪种应用程序安全技术最可能解决这个问题？\n\
  \n![](img/c02f047.jpg)\n\n1. 边界检查（Bounds checking）\n2. 网络分段\n3. 参数处理（Parameter handling）\n\
  4. 标签移除（Tag removal）\n\n### 115. Pete 对其组织中的几个网络设备运行了漏洞扫描，并收到了此处所示的扫描结果。假设这些设备运行着\
  \ ClearCase，攻击者可以使用什么简单的工具对这些设备实施拒绝服务攻击（DoS）？\n\n![](img/c02f048.jpg)\n\n1. Metasploit\n\
  2. Nessus\n3. nmap\n4. Wireshark\n\n### 116. 以下哪种协议可能用于虚拟化平台内部的网络监控和管理？\n\n1. SNMP\n\
  2. SMTP\n3. BGP\n4. EIGRP\n\n### 117. Sherry 运行了漏洞扫描并收到了此处所示的高级结果。她的优先级是先修复最重要的漏洞。哪个系统应该是她的最高优先级？\n\
  \n![](img/c02f049.jpg)\n\n1. A\n2. B\n3. C\n4. D\n\n### 118. Victor 正在配置一个新的漏洞扫描器。他将扫描器设置为每天对他的整个数据中心进行扫描。当他在周末检查扫描报告时，发现所有报告都不完整。扫描报告指出错误“由于任务抢占扫描终止”。Victor\
  \ 没有剩余资金投资于漏洞扫描系统，但他想要覆盖整个数据中心。他应该怎么做来确保扫描完成？\n\n1. 减少扫描系统的数量。\n2. 增加扫描器的数量。\n3.\
  \ 升级扫描器硬件。\n4. 降低扫描频率。\n\n### 119. Vanessa 对服务器运行了漏洞扫描并收到了所示结果。她的老板指示她根据严重性优先处理。她应该先处理哪个问题？\n\
  \n![](img/c02f050.jpg)\n\n1. 移除 POP 服务器。\n2. 移除 FTP 服务器。\n3. 升级 Web 服务器。\n4. 移除不安全的加密协议。\n\
  \n### 120. Gil 正在使用 QualysGuard 扫描器为组织配置计划漏洞扫描。如果选择所示的“完成后重启”（Relaunch On Finish）调度选项，结果将会怎样？\n\
  \n![](img/c02f051.jpg)\n\n1. 每次执行计划时运行一次。\n2. 每次执行计划运行两次。\n3. 下次执行计划时运行两次，随后的每个计划间隔运行一次。\n\
  4. 扫描将持续运行直到停止。\n\n### 121. Terry 正在查看 Windows 服务器的漏洞扫描报告，发现了此处所示的漏洞。该漏洞带来的风险是什么？\n\
  \n![](img/c02f052.jpg)\n\n1. 攻击者可能能够执行缓冲区溢出并在服务器上执行任意代码。\n2. 攻击者可能对此服务器实施拒绝服务攻击。\n\
  3. 攻击者可能能够确定此服务器上的操作系统版本。\n\n\n\n\n\n## 4. 没有直接的漏洞，但这些信息指向了服务器上其他可能的漏洞。\n\n### 122.\
  \ Andrea 最近在她所属组织内一个系统管理员的工作站上发现了此处所示的漏洞。Andrea 应该关注的主要威胁是什么？\n\n![](img/c02f053.jpg)\n\
  \n1. 攻击者可以利用此漏洞来获取管理员工作站的控制权。\n2. 攻击者可以利用此漏洞来访问由管理员管理的服务器。\n3. 攻击者可以利用此漏洞来防止管理员使用该工作站。\n\
  4. 攻击者可以利用此漏洞来解密存储在管理员工作站上的敏感信息。\n\n### 123. Craig 完成了其所属组织内一台服务器的漏洞扫描，并发现了此处所示的结果。下列哪一项**不是**由这些结果所要求的关键修复措施？\n\
  \n![](img/c02f054.jpg)\n\n1. 移除过时的软件。\n2. 重新配置主机防火墙。\n3. 应用操作系统补丁。\n4. 应用应用程序补丁。\n\
  \n### 124. Tom 的公司计划对移动设备实施自自带设备（BYOD）策略。以下哪项技术允许在个人设备上安全地使用敏感信息，包括让管理员能够从设备上清除公司信息而不影响个人数据？\n\
  \n1. 远程擦除\n2. 强密码\n3. 生物识别认证\n4. 容器化\n\n### 125. Sally 在漏洞扫描期间发现，她管理的一个系统存在一个需要补丁的高优先级漏洞。该系统位于防火墙后，且没有紧迫的威胁，但\
  \ Sally 想要尽快解决这个问题。她的最佳行动方案是什么？\n\n1. 通过其组织的变更管理流程启动高优先级变更。\n2. 立即实施修复，然后在事后记录变更。\n\
  3. 立即实施修复，然后告知其主管其操作和理由。\n4. 将变更安排在下季度的补丁周期中。\n\n### 126. Gene 对其组织的数据中心运行漏洞扫描，并生成了一份总结报告与管理团队共享。报告包含了此处所示的图表。当\
  \ Gene 的经理阅读报告时，她指出报告掩盖了重要的细节，因为它强调了太多的不重要的问题。Gene 应该做什么来解决这个问题？\n\n![](img/c02f055.jpg)\n\
  \n1. 告诉他的经理所有漏洞都是重要的，应该出现在报告中。\n2. 使用 Excel 创建一个修订后的图表版本。\n3. 修改扫描的敏感性级别。\n4. 停止与管理团队共享报告。\n\
  \n### 127. Veronica 最近对 Web 服务器进行了 PCI DSS 漏洞扫描，并注意到一个关键的 PHP 漏洞，需要升级才能修复。她应用了更新。Veronica\
  \ 必须尽快重复扫描？\n\n1. 30 天内\n2. 在下一次计划的季度扫描中\n3. 在下一次计划的年度扫描中\n4. 立即\n\n### 128. Chandra\
  \ 的组织最近升级了保护其处理信用卡信息网络的防火墙。该网络受 PCI DSS 条款约束。Chandra 何时需要安排该网络的下一次漏洞扫描？\n\n1. 立即\n\
  2. 一个月内\n3. 在下个月开始之前\n4. 在升级后的下一个季度结束之前\n\n### 129. Bruce 担心其组织用于监控和管理工厂系统的一个工业控制系统的安全性。他希望减少攻击者渗透该系统的风险。以下哪项安全控制最能缓解此类系统中的漏洞？\n\
  \n1. 网络分\n2. 输入验证\n3. 内存保护\n4. 冗余\n\n### 130. Glenda 定期运行其组织服务器的漏洞扫描。她正与一个系统管理员发生困难，该管理员拒绝修复作为其他\
  \ IT 人员跳板机的服务器上的漏洞。该服务器已经存在数十个漏洞数周了，且修复需要停机。某天早上，她的扫描报告显示所有漏洞突然在夜夜消失了，而同一扫描中的其他系统仍在报告问题。她检查了服务状态仪表板，服务似乎运行正常，过去一周内没有报告任何中断。此结果最可能的原因是什么？\n\
  \n1. 系统管理员修复了漏洞。\n2. 服务器宕机了。\n3. 系统管理员拦截了扫描器。\n4. 扫描没有运行。\n\n### 131. Frank 在漏洞扫描期间发现，其一个存储系统的管理界面无意中暴露到了互联网上。他正在查看防火墙日志，并想确定是否有任何访问尝试来自外部源。以下哪个\
