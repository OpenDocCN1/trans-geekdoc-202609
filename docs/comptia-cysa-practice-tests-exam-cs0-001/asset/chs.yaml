  \n\n\n\n\n### 34. B. Selah 应该检查错误日志，以确定哪个网页或文件访问导致 `404` “未找到”错误。这些错误可能表明页面链接错误，但也可能表明正针对她的网络服务器进行扫描。\n\
  \n### 35. C. 由于驱动器在租赁结束时需要返回，你必须假设合同不允许对其进行销毁。这意味着对驱动器进行清除（purging）、验证驱动器已清除以及记录过程以确保包含所有驱动器是恰当的操作。仅清空（clearing）驱动器留下了数据恢复的可能性，而根据\
  \ `NIST SP 800-88` 的定义，清除使数据恢复变得不可行。\n\n### 36. C. macOS 的默认驱动格式为 `HFS+`，是 macOS\
  \ 的原生驱动格式。默认情况下，它使用 `512` 字节逻辑块（扇区）和多达 `4,294,967,296` 个分配块。macOS 支持 `FAT32` 并可以读取\
  \ `NTFS`，但在没有额外软件的情况下无法向 `NTFS` 驱动器写入数据。`MacFAT` 是为了解决这个问题而设计的。\n\n### 37. B. `Eraser`\
  \ 是一种用于安全擦除文件和驱动器的工具。如果 Tim 组织的机器上通常没有安装 `Eraser`，Tim 应该预计被调查的个人参与了某些反取证活动，包括擦除可能已下载或违反公司政策使用的文件。这并不意味着他不应该继续调查，但他可能想查看\
  \ `Eraser` 的日志，以获取有关被删除内容的额外证据。\n\n### 38. B. 数据雕刻（Data carving）是根据文件签名（如文件头和文件尾）识别文件，然后将这些位置之间的信息提取作为文件的过程。Jessica\
  \ 可以使用常用的雕刻工具，或者如果她知道可以搜索的常见文件头和文件尾类型，也可以手动雕刻文件。\n\n### 39. D. `CSIRT` 负责人必须具有指导事件响应过程的权限，并能够担任与组织管理层之间的络人。虽然\
  \ Lauren 可能没有深厚的事件响应经验，但她所处的职位可以提供这些联系和领导。如果她的 IR 团队需要额外的技能或专业知识，她应该考虑聘请第三方专家来处理事件。\n\
  \n### 40. B. 该系统未连接到域（默认域名无值），且默认用户为 `admin`。\n\n### 41. A. `NX` 位为映射的内存区域设置细粒度权限，而\
  \ `ASLR` 确保共享库加载在随机位置，使得攻击者难以通过共享库攻击利用内存中的已知位置。`DEP` 是 Windows 的一个内存保护的工具，而位置无关变量（position-independent\
  \ variables）是编译器级的保护措施，用于在程序编译时确保安全。\n\n### 42. C. 如果 `Security` 日志尚未轮转，Angela 应该能够在事件\
  \ ID `4720` 下找到账户创建记录。`System` 日志不包含用户创建事件，且在用户首次登录之前不存在用户配置文件信息。注册表也不是获取账户创建日期信息的可靠来源。\n\
  \n### 43. A. Linux 的 `file` 命令显示文件的格式、编码、其链接的库以及文件类型（二进制、`ASCII` 文本等）。由于 Alex 怀疑攻击者使用了静态链接库，`file`\
  \ 命令是该场景下的最佳命令。`stat` 提供最后访问时间、权限、`UID` 和 `GID` 位设置以及其他细节。它对于检查文件最后一次使用或修改的时间有用，但不会提供有关链接库的细节。`strings`\
  \ 和 `grep` 都有助于分析文件内容，并可能为 Alex 提供其他线索，但对于此目的，不如 `file` 命令有用。\n\n### 44. D. Lauren\
  \ 通过将审计设置为 `All`（所有）将获得最多的信息，但如果她审计常用常用的文件夹，可能会收到大量数量的事件。仅审计成功或失败不会显示所有操作，且 `full\
  \ control`（完全控制）是一种权限，而不是审计设置。\n\n### 45. A. `apt` 命令用于从命令行在 `Ubuntu Linux` 中安装和升级包。命令\
  \ `apt-get -u upgrade` 将列出所需的升级和补丁（添加 `-V` 标志将提供有用的版本信息）。有关关于安装了哪些补丁的信息保留在 `/var/log/apt`\
  \ 中，尽管日志轮转可能会删除或压缩旧的更新信息。\n\n### 46. C. 在大多数情况下，`Ophcrack` 基于彩虹表的破解将产生最快的哈希破解速度。`Hashcat`\
  \ 的高速、GPU 驱动破解技术可能位第二，而 `John the Ripper` 和 `Cain and Abel` 的传统 CPU 驱动破解方法仍然较慢，除非它们基于变体的密码破解能很快地发现简单密码。\n\
  \n### 47. A. 逻辑采集侧重于特定的感兴趣文件，例如特定类型的文件或来自特定位置的文件。在 Eric 的案例中，逻辑采集满足了他的需求。稀疏采集（sparse\
  \ acquisition）也会从未分配空间收集数据。位对位采集（bit-by-bit acquisition）通常针对整个驱动器进行，且耗时更长。\n\n###\
  \ 48. A. `Resource Manager`（资源管理器）除了实时 CPU 利用率外还提供平均 CPU 利用率。由于 Kelly 想查看随时间变化的平均使用情况，使用\
  \ `Resource Manager` 比使用 `Task Manager`（满足她其他其他需求）更好。`Performance Monitor`（性能监器）有助于收集性能数据，而\
  \ `iperf` 是一个网络性能测量工具。\n\n### 49. D. 证据链（chain of custody）通过记录和标记证据来维护。这确保了证据得到了适当的控制和访问。\n\
  \n### 50. A. Roger 启用了内存使用监控，图表底部显示了阈值，如果持续增加将生成警报。图表显示几个月内存利用率稳定，偏差极小。虽然可能会发生突然增加，但该系统似乎运行良好。\n\
  \n然而，在一个没有波动使用或突发峰值的调优良好的系统中，内存使用率可能会很高。这通常是一个可以接受的情况。Windows 没有可以限制内存使用的自动内存管理工具。\n\
  \n### 51. B. Frank 在收集威胁信息 (5)、监控指标 (1) 以及跟进安全警报 (3) 以保持信息更新方面投入的精力越多，他的组织的安全性就越强。如果特定的威胁者专门针对像\
  \ Frank 这样的组织，那么了解特定的威胁者可能会变得相关，但作为一家中型组织，Frank 的组织不太可能被特定的直接针对。\n\n### 52. A. Windows\
  \ 注册表存储了系统连接过的无线网络列表，位于注册表的 `HKLM\\SOFTWARE\\Microsoft\\WindowsNT\\CurrentVersion\\\
  NetworkList\\Profiles` 下。这不是用户特定的设置，而是为所有用户存储在 `LocalMachine` 中。\n\n### 53. B. 虽然这看起来是一个简单的答案，但确保对所有输入进行检查以确保其长度不会超过将被放入的变量或缓冲区，是保护网络应用程序的重要部分。规范化（Canonicalization）有助于防止脚本攻击。格式化字符串攻击发生在输入被应用程序解释为命令时。缓冲区覆盖通常发生在循环缓冲区中，随着数据被替换，它不是攻击或攻击防御方法。\n\
  \n### 54. A. 挂起虚拟机将导致内存（RAM）和磁盘内容存储到其所在的目录中。只需复制该文件夹就足以为 Susan 提供所需的所有信息。她不应该关闭虚拟机，也不需要创建驱动取证副本（但她仍应验证复制的文件或目录的哈希值）。\n\
