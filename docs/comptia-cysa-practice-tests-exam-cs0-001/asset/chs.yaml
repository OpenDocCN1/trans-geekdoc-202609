  \ Renee 的分析无关。数据泄露防护系统可以防止机密性泄露，但可用性攻击没有帮助。\n\n### 160. D. Mary 应该咨询组织的资产清单。如果该清单构建和维护得当，它应该会包含有关资产关键性的信息。CEO\
