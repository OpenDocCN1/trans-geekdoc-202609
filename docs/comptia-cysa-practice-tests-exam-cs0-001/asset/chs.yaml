  \ B\n此 `nmap` 扫描将扫描典型端口上的 `ssh` (`22`)、`SMTP` (`25`)、`DNS` (`53`) 和 `LDAP` (`389`)。如果服务运行在备用端口上，此扫描将完全错过这些以及任何其他服务。\n\
  \n### 143. D\nLinux 和 Unix 系统通常将账户信息存储在 `/etc/passwd` 中，而 `/etc/shadow` 密码和账户过期信息。在这种情况下，在两个文件之间使用\
