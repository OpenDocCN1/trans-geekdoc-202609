  \ 5 分），Mike 务必应该采取行动。\n\n### 138. B. 有凭据的扫描能够登录目标系统并直接检索配置信息，从而为列出的扫描列表提供最准确的结果。未经身份的扫描必须依赖于配置设置的外部指示，而后者的准确性较低。扫描器的网络位置（外部\
  \ vs. 内部）不会直接影响扫描器读取配置信息的能力。\n\n### 139. C. Brian 遵循的最优路径是利用组织现有的工单系统。管理员可能经常使用该系统，而且它可以处理问题的报告和升级流程。Brian\
  \ 可能还想让管理员获得访问扫描器的权限，并/或让系统自动发送电子邮件报告，但这些并无法提供他所需要的跟踪功能。\n\n### 140. A. 漏洞扫描器应尽可能频繁地更新，以便扫描器能在新的漏洞特征发布后立即获取。Tonya\
  \ 应该选择每日更新。\n\n### 141. C. Ben 面临着严峻的挑战，可能应该执行此问题中描述的所有操作。然而，最好的起点是运行 `Windows Update`\
  \ 来安装操作系统补丁。许多关键漏洞与缺少 Windows 补丁有关。其他操作也可能解决关键问题，但它们都涉及用户在被利用之前必须在服务器上运行软件。这使得它们的优先级低于那些可能在无需用户操作即可被远程利用的\
  \ Windows 漏洞。\n\n### 142. A. Tom 应该咨询服务水平协议（SLA）和谅解备录（MOU）。这些文档应包含对客户做出的所有性能承诺。灾难恢复计划（DRP）和业务影响评估（BIA）不应包含此类信息。\n\
  \n### 143. C. Don 可能应该将精力集中在高优先级漏洞上，因为漏洞扫描器会对扫描的几乎任何系统报告结果。解决关键漏洞的时间、随时间推移的开放关键漏洞数量以及包含关键漏洞的系统数量都是有用的指标。报告的漏洞总数用处较小，因为它没有包含任何严重性信息。\n\
  \n### 144. A. 尽管漏洞扫描报告表明这是一个低严重性漏洞，但 Don 必须结合上下文来看此信息。虚拟化平台的管理界面绝不暴露给外部主机，而且不应使用未加密的凭据。在这种背景下，这是一个关键漏洞，可能允许攻击者控制计算环境的大部分。Don\
  \ 应该与安全和网络工程师合作，尽快通过防火墙阻止此类活动。关闭虚拟化平台不是一个好的替代方案，因为它会造成巨大的干扰，而且从安全角度来看，调整防火墙同样有效。\n\
  \n### 145. B. 本报告描述的服务器需要多个 Red Hat Linux 和 Firefox 补丁来修复严重的安全问题。其中一个 Red Hat 更新还影响了\
  \ `MySQL` 数据库服务。虽然报告中列出了 Oracle 补丁，但它们涉及 Oracle Java，而非 Oracle 数据库。\n\n### 146.\
  \ D. 技术报告将包含特定主机的详细信息，旨在供修复系统的工程师使用。PCI 技术报告将侧重于信用卡合规性问题，没有迹象表明该服务器被用于信用卡处理。Qualys\
  \ Top 20 报告和执行报告将包含更适合管理层读者的摘要信息，并涵盖整个网络，而不是提供单个系统的详细信息。\n\n### 147. D. 使用 `FTP`\
  \ 不被认为是一种良好的安全实践。除非通过安全协议建立隧道，否则 `FTP` 是未加密的，允许攻击者窃听通信并窃取可能通过 `FTP` 链接传输的凭据。此外，该漏洞表明攻击者甚至无需提供有效凭据即可获得服务器访问。\n\
  \n### 148. B. 扫描报告显示了两个与服务器账户相关的问题：`Administrator` 账户的密码策略薄弱以及一个激活状态的访客账户。Tom 应该修复这些问题以防止内部威胁。服务器还存在加密薄弱的问题，但考虑到机器位于内部网络，该问题的优先级较低。\n\
  \n### 149. B. 虽然列出的所有解决方案都可能修复 Dave 扫描发现的部分漏洞，但未维护的网络中绝大多数问题是源于缺少安全更新。应用补丁可能会解决相当漏洞，如果不是大多数的话。\n\
  \n### 150. D. Matt 应该使用网络分段技术将两个网络隔离，例如将新公司放在单独的 `VLAN` 上或对两个网络进行防火墙隔离。代理服务器将无效，因为没有迹象表明任何一个网络打算向另一个提供服务。\n\
  \n### 151. C. Rhonda 应该在沙箱环境中部署补丁，然后在发布前对其进行彻底测试。这降低了补丁在其环境中运行不佳的风险。询问供应商或等待 60\
  \ 天可能会发现一些问题，但无法充分降低风险，因为补丁尚未在其公司环境中经过测试。\n\n### 152. B. 服务水平协议（SLA）规定了供应商关系的技术参数，并应涵盖可用性以及未能达到约定目标的补救措施。谅解备录（MOU）是较正式的文档，概述了组织之间的关系。业务伙伴协议（BP）通常涵盖业务而非技术问题，通常不包含可用性承诺。业务影响评估（BIA）是风险评估，不是法律协议。\n\
  \n### 153. D. 虽然所有漏洞都存在机密性风险，但 `SQL injection` 漏洞威胁最大，因为它可能允许攻击者检索后端数据库的内容。`HTTP\
  \ TRACK/TRACE` 方法和 PHP 信息泄漏漏洞可能提供侦查信息，但不会直接泄露敏感信息。`SSLv3` 不再被认为是安全的，但其窃取信息的难度比 SQL\
  \ 注入问题大得多。\n\n### 154. C. 自带设备（BYOD）策略允许用户在公司网络上运行个人所有设备。相比于通过移动设备管理（MDM）系统或公司所有个人许可（COPE）策略管理的设备，设备更容易包含漏洞。传输层安全（TLS）是一种网络加密协议，而不是移动设备策略。\n\
  \n### 155. A. 这是一个关键漏洞，应立即处理。在这种情况下，Kassie 应该停用该服务器并替换为运行当前操作系统的服务器。微软不再支持 Windows\
  \ Server 2003，也不会对 2015 年 7 月之后发现的漏洞发布补丁。\n\n\n\n\n\n### 156. B. B. Morgan 或域管理员可以从系统中删除该软件，但这不会允许继续使用浏览器。网络管理员从理论上可以阻止所有外部\
  \ Web 浏览，但这并不是实用的解决方案。浏览器开发者是唯一处于能够修复溢出错误状态的人，因为这是 Web 浏览器代码中的一个缺陷。\n\n### 157.\
  \ A. Jeff 应该从查看最高级别的漏洞开始，然后识别这些漏洞是否属于机密性风险。此报告中级别最高的漏洞是 `Rational ClearCase Portscan\
  \ Denial of Service`（拒绝服务）漏洞。然而，拒绝服务漏洞影响的是可用性而非机密性。下一个级别最高的报告是 `Oracle Database\
  \ TNS Listener Poison Attack`（中毒攻击）漏洞。中毒漏洞可能导致主机连接到非法的服务器，并导致敏感信息的泄露。因此，Jeff 应该首先处理这个问题。\n\
  \n### 158. B. 虽然这些担心都是合理的，但最主要的问题是 Eric 没有获得潜在客户的许可来执行扫描，这可能导致客户生气（最理想的情况下）或违反法律（最坏的情况下）。\n\
