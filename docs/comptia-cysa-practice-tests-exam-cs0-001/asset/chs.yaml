  \n### 67. C. Patrick 对此补丁的处理应该极其谨慎。如果补丁导致服务故障，它可能会禁用其组织的所有 `Windows` 服务器。这是一个严峻风险，需要在部署补丁之前进行测试。Patrick\
  \ 的最佳行动方案是在测试环境中部署补丁，如果测试成功，再分阶段推向生产环境。涉及在测试之前将补丁部署到生产系统的选项可能会导致这些服务失败。禁用对系统的所有外部访问可能是过度反应，会对业务产生关键性影响。\n\
  \n### 68. C. 通用配置枚举 (`CCE`) 为讨论系统配置问题提供了标准命名法。通用平台枚举 (`CPE`) 为描述产品名称和版本提供了标准命名法。通用漏洞与披露\
  \ (`CVE`) 为描述安全相关的软件缺陷提供了标准命名法。通用漏洞评分系统 (`CVSS`) 为衡量和描述安全相关软件缺陷的严重性提供了一种标准化方法。\n\
  \n### 69. C. 对 1,900 个常用端口进行标准扫描是一种相当彻底的扫描，可以在合理的时间内完成。如果 Aaron 知道组织内使用了未包含在标准列表中的特定端口，可以使用端口设置中的\
  \ `Additional`（附加）部分来指定这些端口。在 C 类网络上，对所有 65,535 个端口进行全扫描将需要极长时间。选择 `Light Scan`\
  \ 设置会排除大量常用端口，而 `None` 设置将不会扫描任何端口。\n\n### 70. C. `Apache` Web 服务器将日志文件存储在名为 `access_log`\
  \ 的文件中。在 `CentOS` 上，默认情况下该文件可能位于 `/var/log/httpd`。\n\n### 71. A. 根据场景提供的信息，可以得出结论：所有的\
  \ `HTTP/HTTPS` 漏洞由于防火墙限制而无法被攻击者利用。然而，`OpenSSL` 除了 `HTTPS` 外还用于其他服务。因此，它可能通过 `SSH`\
  \ 或或其他暴露。Ken 应该将其替换为当前支持的版本，因为运行已结束 (`EOL`) 的软件包会让组织暴露于可能无法修复的安全漏洞。\n\n### 72. B.\
  \ 横幅扫描扫描（Banner grabbing）以产生误报报告而闻名，因为它们唯一的验证方法是将操作系统或应用程序的版本与已知漏洞列表进行对比。这种方法无法检测任何未更改版本号的修复措施。\n\
  \n### 73. B. 漏洞 3 的 `CVSS` 分为 10.0，是因为它在 `CVSS` 向量的所有部分都获得了最高评分。例如，它在机密性、完整性和可用性影响指标上获得了“完全”评级，而另外两个漏洞在相同指标上的评分为“部分”或“无”。\n\
  \n### 74. D. 网络安全分析师在优先考虑漏洞修复时，应该考虑所有这些因素。漏洞的严重性与涉及的风险直接相关。漏洞被利用的可能性根据受影响系统的网络暴露情况而增加或减少。修复的难度可能会影响团队在投入合理资源的情况下解决问题的能力。\n\
  \n\n\n\n\n## 75. B.\n场景中没有迹象表明该服务器正在运行数据库；事实上，场景表明该服务器专门用于运行 `Apache` 网页 服务。因此，数据库漏洞扫描不太可能产生任何结果。Landon\
  \ 应该运行其他三次扫描，如果这些扫描指示存在数据库服务器，他可以后续进行专门的数据库漏洞扫描。\n\n## 76. C.\n漏洞报告中的影响陈述如下：“如果成功利用，此漏洞可能会导致间歇性连接问题，或导致所有\
  \ NetBIOS 功能丢失。”这是对**可用性**风险的描述。\n\n## 77. B.\n`CVSS` 字符串表明该漏洞没有相关的机密性（`C:N`）或可用性（`A:N`）风险。它确实存在部分完整性风险（`I:P`）。\n\
  \n## 78. C.\n数据分类（Data classification）是根据敏感程度和/或重要性应用于信息的一组标签。在这种场景下它是最合适的选择。数据保留要求规定了组织维护记录副本的时间。数据残留（Data\
  \ remnance）是一个问题，即被认为已删除的信息可能仍然存在于系统中。数据隐私可能有助于数据分类，但它并不像数据分类那样涵盖数据敏感性和重要性的整个领域。例如，一个系统可能会处理专有业务信息，这些信息属于极高分类并需要频繁进行漏洞扫描。除非该系统还处理个人身份识别信息，否则仅基于数据隐私的系统将不会触发扫描。\n\
  \n## 79. C.\n在这种场景下，主机防火墙可能是从源头上防止感染发生的有效方法，但它无法加速已经受感染系统的恢复。入侵防御系统和安全补丁通常对零日攻击无效，且也不会用作恢复控制措施。备份将为\
  \ Tom 提供一种有效的方法，用于恢复在勒索软件攻击期间被加密的信息。\n\n## 80. B.\n没有理由认为升级操作系统将解决此应用程序漏洞。呈现的所有其他解决方案都是解决此风险的可接受方法。\n\
  \n## 81. D.\n这是一个严重的漏洞，因为它向攻击者泄露了大量的网络配置信息，并可能被用于对该网络发起其他攻击。然而，该漏洞的直接影响仅限于对网络配置信息的侦察。\n\
  \n## 82. B.\n在这种情况下，Ted 应该要求 DBA 重新检查服务器以确保补丁已正确应用。在 Ted 进行简短调查以确认补丁已正确应用之前，现在还不适合将该问题标记为误报。特别是如此，因为该漏洞与缺失补丁有关，而缺失补丁并不是误报的常见来源。目前还没有接受此漏洞，因此\
  \ Ted 不应将其标记为异常。Ted 不应将此问题升级给管理层，因为 DBA 正在以诚意与他合作。\n\n## 83. A.\n这可能是一个误报。漏洞描述说：“注意，此脚本是实验性的，并可能产生误报。”开发者和独立审计员全部错误的概率较低。扫描器很可能运行正常，且没有迹象表明它或数据库服务器存在配置错误。\n\
  \n## 84. B.\n`X.509` 证书用于交换加密通信的公钥。它们是 `SSL` 和 `TLS` 协议的基础部分，`X.509` 证书的问题绝对会影响依赖公钥加密的\
  \ `HTTPS`、`SSH` 和 `VPN` 通信。`HTTP` 不使用加密，不受此漏洞影响。\n\n## 85. A.\n这是一个误报的示例。管理员证明由于变通方法（workaround），数据库不受该漏洞影响，而且\
  \ Larry 进一步亲自验证了这一点。因此，他应该在漏洞扫描器中将报告标记为误报。\n\n## 86. B.\n当漏洞扫描器依赖于标志抓取（banner grabbing）和版本检测时，此类场景描述的误报非常常见。此问题的主要解决方案是应用补丁，扫描器通过注意到新的版本号来检测它。然而，管理员采取了通过其他方式修复漏洞而未应用补丁，这是完全可以接受的操作，但扫描器无法检测到该修复活动并报告了误报结果。\n\
  \n## 87. C.\n邮局协议 v3 (`POP3`) 用于从邮件服务器检索邮件。\n\n## 88. A.\nMargot 可以期望在 Web 服务器日志中找到相关结果，因为这些日志将包含指向服务器的\
  \ `HTTP` 请求记录。数据库服务器日志将包含对数据库执行的查询记录。`IDS` 日志可能包含 `SQL` 注入告日志。`Netflow` 日志不会包含有用信息，因为它们只记录流量，而不记录通信的细节。\n\
  \n## 89. A.\n`runas` 命令允许管理员使用另一个用户的权限执行命令。Linux 通过 `sudo` 命令提供了相同的功能。Linux 的 `su`\
  \ 命令类似，但它允许管理员切换用户身份，而不仅仅是简单使用另一个用户的身份执行命令。Linux 中的 `ps` 命令列出活动进程，而 `grep` 命令用于搜索匹配模式的文本。\n\
  \n## 90. A.\n明文认证以“明文”发送凭据，这意味着它们以未加密的形式传输，并且容易受到访问客户端和服务器之间网络分段的攻击者的窃听。\n\n## 91.\
  \ B.\n常见漏洞和暴露 (`CVE`) 为描述安全相关软件漏洞提供了标准命名法。通用平台枚举 (`CPE`) 为描述产品名称和版本（包括应用程序和操作系统）提供了标准命名法。通用漏洞评分系统\
  \ (`CVSS`) 为衡量和描述安全相关软件漏洞的严重提供了标准化方法。开放漏洞评估语言 (`OVAL`) 是用于指定清单所使用的低级测试程序的语言。\n\n\
