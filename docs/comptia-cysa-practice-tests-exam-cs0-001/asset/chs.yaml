  \n1. 未经身份验证扫描\n2. 凭证扫描\n3. 外部扫描\n4. 内部扫描\n\n139. Brian 正在为其组织数据中心的所有服务器配置漏洞扫描。他正正在配置扫描以仅检测最高严重程度的漏洞。他希望授权系统管理员纠正其服务器上的问题，同时也能对这些修复的状况获得一些见解。哪种方法最符合\
