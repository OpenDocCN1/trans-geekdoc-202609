  \n### 167. A. IP 地址为 `10.0.102.58` 的服务器是列表中唯一包含 5 级漏洞的服务器。5 级漏洞级别最高，应该优先处理。`10.0.16.58`\
  \ 的服务器总漏洞最多，但没有任何 5 级漏洞。`10.0.46.116` 和 `10.0.69.232` 上的服务器只有 3 级漏洞，其严重性低于 5 级漏洞。\n\
  \n### 168. A. 启用凭据扫描将增加检测需要本地访问服务器的漏洞的概率。凭据扫描可以读取深层配置设置，而这些设置在经过妥善保护系统中通过无凭据扫描是无法获得的。手动更新漏洞库可能会为此特定漏洞添加签名，但对未来的漏洞没有帮助。相反，Beth\
  \ 应该配置自动更新馈送。增加扫描频率可能会提高检测速度，但不会影响扫描器检测漏洞的能力。组织的风险偏好影响他们选择接受哪些漏洞，但不会改变扫描器检测漏洞的能力。\n\
  \n### 169. A. 对服务器应用补丁无法修复 SQL 注入或跨站脚本漏洞，因为这些漏洞存在于 Web 应用程序本身。Shannon 可以通过重写 Web\
  \ 应用程序使用输入验证来修复根源，但这是更困难的路径。Web 应用程序防火墙可以以较少的人力成本提供即时保护。\n\n### 170. A. 在将报告提供给负责系统的管理员之前，Ron\
