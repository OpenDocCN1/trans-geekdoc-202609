  3. 在招聘公告限制技术参考\n4. 发布前清除所有文档元数据\n\n8. Cassandra 对开放网络 (`192.168.10/24`) 进行的 `nmap`\
  \ 扫描显示 IP 地址 `192.168.1.1` 有如下主机。根据扫描结果，该 IP 地址的系统类型可能是？\n1. 虚拟机\n2. 无线路由器\n3. 宽带路由器\n\
  4. 打印服务器\n\n9. 在查看其组织的 Shodan 扫描数据时，John 注意到以下条目。哪个错误的？\n1. 设备允许 telnet 连接。\n2.\
