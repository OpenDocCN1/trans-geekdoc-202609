  # 116. A. 简单网络管理协议 (`SNMP`) 使用陷阱（traps）和轮询请求来监控和管理物理及虚拟网络。邮件传输协议 (`SMTP`) 是一种电子邮件传输协议。边界关协议\
  \ (`BGP`) 和增强内部关路由协议 (`EIGRP`) 用于做出路由决策。\n\n# 117. D. 如扫描结果所示，System D 是唯一包含严重漏洞的系统。因此，Sherry\
  \ 应该从该系统开始，因为它具有最高优先级的漏洞。\n\n# 118. D. Victor 经历的问题是全量扫描无法在一天内完成，并在下一次全量扫描尝试运行时被取消。他可以通过降低扫描频率来解决此问题。例如，他可以将扫描设置为每周运行一次，以便其完成。减少扫描的系统数量无法满足他扫描整个数据中心的要求。他无法增加扫描器的数量或升级硬件，因为他没有资金投资于该系统。\n\
  \n# 119. C. 该报告中唯一的高严重性问题（以及除一个之外的所有中等性问题）与过时的 Apache Web 服务器有关。Vanessa 在采取任何其他补救措施之前，应该升级此服务器。\n\
  \n# 120. D. “完成后重启”（Relaunch On Finish）调度选项将对目标服务器进行持续漏洞扫描。每次扫描完成后，它都将重新开始。Gil 在选择此选项时应格外小心，因为这可能会导致扫描器和目标服务器产生不良的资源消耗。\n\
  \n# 121. D. 此扫描结果并不直接表明存在漏洞。然而，它确实表明服务器配置为兼容 16 位应用程序，而这些应用程序可能存在漏洞。这是一个信息性结果，并不直接要求\
  \ Terry 采取行动。\n\n# 122. B. `PuTTY` 是一种常用的远程登录应用程序，管理员用它连接到服务器和其他网络设备。如果攻击者获取了用于\
