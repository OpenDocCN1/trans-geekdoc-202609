  \ | |\n| 1.2 给定场景，分析网络侦察的结果。 | 第 1 章 |\n| 时间点数据分析，包括数据包分析、协议分析、流量分析、Netflow 分析、无线分析；数据关联与分析，包括异常分析、趋势分析、可用性分析、启发式分析、行为分析；数据输出包括防火墙日志、数据包捕获、`NMAP`\
  \ 扫描结果、事件日志、`Syslogs`、IDS 报告；工具包括 `SIEM`、数据包分析器、`IDS/IPS`、资源监控工具、Netflow 分析器 | |\n\
  | 1.3 给定网络威胁，实施或建议适当的响应和应对措施。 | 第 1 章 |\n| 网络分段、系统隔离、跳板和堡垒机、蜜罐和蜜罐网络、端点安全、组策略、`ACLs`、汇洞、加固、强制访问控制\
  \ (`MAC`)、补偿性控制、阻塞未使用的端口/服务、补丁、网络访问控制 (`NAC`) 策略，包括基于时间的、基于规则、基于角色的和基于位置的 | |\n\
