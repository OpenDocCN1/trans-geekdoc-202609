  \ Report）将指示缺少补丁的系统和应用程序，但不一定能识别未知设备。\n\n176. B. 持续监控使用安装在受监控系统上的代理，立即向漏洞扫描器报告配置更改。计划性扫描在下次运行之前无法检测到更改。自动修复将纠正安全问题，而不是报告配置更改。自动更新将确保扫描使用最新的漏洞信息。\n\
  \n177. D. 经理已经考虑了该风险，并在与他人协商后，认为该风险是可以接受的。因此，Mark 不应该继续坚持此事并要求修复，无论现在还是六个月后。他应该在扫描器中将此漏洞标记为已批准的异常，以避免未来的告警。将此标记为误报是不恰当的，因为漏洞检测是准确的。\n\
  \n178. C. Jacquelyn 应该更新漏洞馈送以获取供应商最新的签名。她不需要将 Web 服务器添加到扫描中，因为它们已经出现在扫描报告中了。重启扫描器并不一定会更新馈送。如果她等等到明天，扫描器可能会被配置为自动更新馈送，但这无法保证，而且效率不如现在直接更新馈送。\n\
  \n179. A. `可扩展配置检查清单描述格式`（`XCCDF`）是一种用于指定检查清单和报告清单结果的语言。`通用配置枚举`（`CCE`）为讨论系统配置问题提供了标准的命名法。`通用平台枚举`（`CPE`）提供了描述产品名称和版本的标准的命名法。`通用漏洞与暴露`（`CVE`）为描述安全相关的软件缺陷提供了标准的命名法。\n\
  \n180. A. `FISMA` 的对进行漏洞扫描的机构规定了许多要求，但它没有包含关于扫描频率的任何特定要求。它只是规定，当发现并报告了可能影响系统/应用程序的新漏洞时，机构必须对信息系统和托管应用程序进行扫描。\n\
  \n181. C. Sharon 在未管理的环境中使用基于代理或基于凭据的扫描将很困难，因为她必须为每个扫描系统获取账户凭据。在剩余两种技术中，基于服务器的扫描比被动网络监控更能有效检测配置问题。\n\
