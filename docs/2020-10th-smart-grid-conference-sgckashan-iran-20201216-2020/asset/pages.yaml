    Due to the cost of construction, operation, and maintenance, and even the high
    cost of nuclear power plants, it is preferred to use clean RES instead of nuclear
    power plants. By open cycle gas power plants, plant No. 9 and 11 are used because
    of their flexibility, they can handle the stochastic behavior of RES, and have
    the highest participation coefficient in the generation, which increases the system''s
    reliability. Power plant No. 8 is combined with plant No. 9 to supply the network
    demand. The reason for choosing this power plant is its cost, high efficiency,
    and flexibility. For power plant No. 7, it was not used because of the decision
    that this unit is not suitable for power plant with coal fuel which has a high
    cost, besides, it provides a lot of air pollution emission generation.


    # IV. CONCLUSION


    In this paper, the generation planning (GEP) problem is modeled as a multi-objective
    optimization problem for high-ratio zone. The objectives are'
