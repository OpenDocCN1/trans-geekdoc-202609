  md: '# A Multi-Objective Generation Expansion Planning with Modeling Demand Uncertainty
    by a Deep Learning-Based Approach


    Farzin Ghashemi Olanlari, Saleh Sadegh Gougheri, Amirhossein Nikoofard


    Department of Electrical Engineering

    K.N. Toosi University of Technology

    Tehran, Iran


    Email: F_ghasemi@email.kntu.ac


    In recent years, with population rise and electrification of the transport sector,
    the need for electricity demand has grown, which increased the importance of generation
    planning (GP). Most literature investigated GP considering one objective function
    (minimizing the cost), whereas others have a high priority. In this paper, a multi-objective
    approach with aims cost minimization, maximizing reliability, and flexibility
    is presented. Gep study foundation based on the annual peak demand which shows
    the superiority of considering load uncertainty in GP. We used a deep learning
    method based on short term memory (LSTM) networks, which have high ability in
    time series forecasting for modeling load uncertainty. The optimization problem
    is also considered as mixed-integer linear programming (MILP) to guarantee global
    solution. The feasible solution for the year 2020 as a test day shows the deep
    LSTM''s robustness for annual load forecasting (52.33% real error with data).


    Index Terms— Generation expansion planning; neural networks; multi-objective model;
    reliability; flexibility


