    To forecast the peak load, we considered a case consisting of the peak load of
    three provinces of Iran (Tehran, Khorasan, and Mazandaran) [21]. The Iran load
    test case used for our network''s peak load occurs in July, we use data from the
    months 2011-2020.


    To calculate the participation coefficient, we considered each unit''s run rate
    as a percentage using the data in TABLE A and normalize them.


    The complete dataset contains 930 data, and 80%, 10%, and 10% of data for training,
    validation, and testing, respectively. To forecast every daily load, we used previous
    30-day peak load. The considered value for July seems to be the actual peak load
    for forecasting daily load. We show LSTM networks in forecasting tasks, we forecast
    peak load for the year 2020 as a test study. We test the number of hidden layers
    up to 100. Also, after avoiding the overfitting problem by using dropout layers,
    the maximum number of epochs is considered to be 100. The forecasted and real
    load for the year 2020 are 17141 and 16244, respectively result has only 87 MW
    error with real data (5.23%). So, it shows the effectiveness of LSTM networks
    in peak load forecasting. The forecasted peak load for ten years (2021-2030) is
