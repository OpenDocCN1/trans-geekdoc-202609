    # INTRODUCTION


    Fast population growth, rapid economic development, and industrialization are
    the factors in rising electricity demands. Also many power plants showed outdated
    aging by reducing electricity efficiency. So, the heavy interest in fossil fuels
    will pay a high economic cost and social damages caused by choosing an incorrect
    type of power plant, and installation time. Grid Expansion Planning (GEP) is a
    long-term time horizon that optimizes the capacity to meet specific objectives.
    The main goal of GEP is to minimize costs. Because the emission of fossil fuels
    has a significant effect on global warming, for attention we must move away from
    fossil fuels in favor of renewable energy sources (RES).


    Some consider GEP as a single problem with the objective of carbon emission minimization
    [1], reliability [2], cost [3], and energy resources (RES) impact [4], [5], and
    the feasibility constraints of generating one object in the cost. So, the GEP
    is solved from one dimension, which leads to the omission of other important factors.
    For example, GEP is a multi-objective problem. Palacios et al. [7] have implemented
    GEP to minimize costs and CO2, and NOx pollution. Authors in [8] studied GEP to
    minimize reliability and cost of power plants. In [9], an approach was used, maximizing
    reliability, was not considered. In [10], the cost of not served (EENS) was added
    to the objective function. However, the goal of maximizing grid flexibility has
    been added to the multi-objective problem of GEP


    The main challenge in the GEP problem is uncertainty in the peak load, which has
    a significant effect on the optimization problem results due to the long-term
    horizon of GEP. In [11]-[12], load uncertainty is considered using regression
    analysis, and reliability is not considered. In [13], the load uncertainty is
    optimized using the point estimate method (PEM) for a 14-year time horizon, and
    the GEP problem is formulated using mixed-integer nonlinear programming (MINLP)
    model. The advantage of MINLP is flexibility, but its results are not applicable
    as [15]. Deep-learning methods which have a high capacity in feature extraction
    are used in the power system studies such as short-term load forecasting [16].
    In the previous studies [17], deep-learning-based methods that have high performance
    in time series forecasting have not been used for load forecasting in the GEP
    problem.


    In this paper, a comprehensive multi-objective GEP is considered with minimizing
    constraints, minimizing emissions, reliability by maximizing network flexibility.
    By considering different objectives of GEP, we have a more realistic and useful
    study. Also, in this paper we used a learning method based on short term memory
    (LSTM) networks that is a robust tool in time forecasting. The LSTM network forecasts
    the peak load with a low error that leads to accurate results in the GEP, which
    can be made economic. The optimization problem is modeled as a mixed-integer programming
    (MIP), which can provide global solutions. For the multi-objective problem, we
    used a weighted-LP method. In summary, the main contributions of this article
    are as follows:


    +   * LSTM network for peak load forecast.


    +   * Considering GEP as a multi-objective problem to minimize costs, minimize
    emissions, and maximize network flexibility by maximizing network flexibility.


    The structure of the paper is as follows: problem modeling including the load
    uncertainty, objective and GEP constraints are presented in Section II. Section
    III describes the results and results. Finally, Conclusions are made in Section
    IV.


