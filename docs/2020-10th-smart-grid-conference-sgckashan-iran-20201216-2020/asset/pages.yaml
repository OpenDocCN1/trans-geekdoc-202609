    minimizing costs, emission generation, and maximizing system reliability and flexibility.
    The LP-method which was used to solve the multi-objective problem, and the weights
    of the functions were determined based on the importance of each objective. Also,
    in this work for modeling load uncertainty which is an essential parameter in
    GFP studies, we used a deep long-term memory (LSTM), a robust tool in time series
    forecasting tasks. This paper tries to present a complete model for the GFP problem
    by considering different objectives and load uncertainty. Our study shows that
    when different objective functions behave, plants with a low emission is the final
    choice, and we prove that LSTM method can forecast actual load with good performance.
    The capacity capacity mechanism for renewable energy plants and implementing reinforcement
    learning algorithms is the future direction of our research.


