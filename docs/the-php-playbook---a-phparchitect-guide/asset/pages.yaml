- pgno: 45
  md: 'much more efficient than searching through each and every record for a match;
    this will dramatically improve our performance.


    Without knowing it, we have inadvertently stumbled on another database optimization
    technique: using indices where appropriate. The database expects that we will
    define a primary key - a unique key that identifies a record - but the general
    rule of thumb is that columns we use WHERE clauses against, frequently should
    also be indexed.


    And we ought to be using WHERE clauses when applicable. Why? WHERE clauses help
    limit the results set, which reduces the data transfer and disk read time of the
    database. It helps our performance considerably, because the database needs only
    to find the records we have requested and that match our criteria; it does not
    need to retrieve and return every single row. Additionally, being explicit in
    our arguments (using SELECT column1, column2, . . . FROM table rather than SELECT
    * FROM table) helps reduce the size of the results set.


    One other area that is often not considered by database developers is the appropriate
    use of table types, also known as “storage engines”. MySQL (and other database
    engines) support a number of table types. MySQL, for example, supports MEMORY
    tables, ARCHIVE tables, and TEMPORARY tables. MEMORY tables, as their name implies,
    are stored in memory. These tables are extremely fast, but are lost once the server
    shuts down. ARCHIVE tables are tables designed for the storage of vast amounts
    of information. These tables support INSERT and SELECT statements, but not DELETE,
    UPDATE or REPLACE. Their design is intended to provide fast retrieval of information
    that needs to be archived but never updated. The data is compressed on INSERT
    and uncompressed only when retrieved. TEMPORARY tables are useful for storing
    data that does not need to exist for long, or for doing lots of data operations.
    Selecting the right table type can improve database performance tremendously.


    Database optimization is something that every developer must learn, because they
    will face it with regularity. Databases are a persistent part of the PHP development
    world, and provide the backend for most applications. Though the movement towards
    NoSQL continues, relational databases remain the favorites of the business world,
    which is where most developers are employed.'
  merge: -1
  img_proc: true
