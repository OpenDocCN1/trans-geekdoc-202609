- pgno: 68
  md: "# Alternative PHP Cache (APC)\n\nIn Chapter 4, APC was highlighted for its\
    \ ability to cache the compiled “opcodes” of PHP for later retrieval, thus avoiding\
    \ the compile cycle on each individual request. This is considered the “opcode\
    \ cache” component of APC. In this chapter, we will discuss the “user cache” feature\
    \ of APC.\n\nSimply put, the “user cache” function of APC allows for the storage\
    \ of developer-designated information in memory on the machine. This data can\
    \ be retrieved quickly on subsequent requests, which, when used correctly, has\
    \ the potential to greatly improve performance. APC also benefits from being one\
    \ of the easiest memory-based caches to use.\n\nThe following contains an example\
    \ of an APC-based memory cache, similar to the interface used for our file-based\
    \ cache. Note that the code sample is much shorter, since we do not need to test\
    \ for write or read permissions, and if the item is not in the cache we simply\
    \ return false:\n\n```\nclass APCache {\n    public function write($key, $data,\
    \ $ttl = 0, $overwrite = false) {\n        if (!$overwrite) {\n            return\
    \ apc_add($key, $data, $ttl);\n        }\n        else {\n            return apc_store($key,\
    \ $data, $ttl);\n        }\n    }\n\n    public function read($key) {\n      \
    \  return apc_fetch($key);\n    }\n\n    public function remove($key) {\n    \
    \    return apc_delete($key);\n    }\n}\n```\n\n# Memcached\n\nAs discussed in\
    \ Chapter 4, Memcached is the de-facto standard for large web applications and\
    \ performance enhancement. Memcached offers several advantages"
  merge: -1
  img_proc: true
- pgno: 69
  md: "over APC, namely that Memcached can be configured with a group of servers,\
    \ Memcached can be served from a completely different server from the application\
    \ (unlike APC which only writes to the memory on the same machine as the application),\
    \ and Memcached is designed for high level use (it is used by Facebook, Yahoo,\
    \ Digg, etc.).\n\nMemcached can also be used to store sessions in PHP. To do this,\
    \ one need only change the following lines in the php.ini file (assuming that\
