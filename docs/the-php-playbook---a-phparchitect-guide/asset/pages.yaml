- pgno: 31
  md: "Before we can get started on this section, we must install PHPUnit. The recommended\
    \ installation method is PEAR; installing from PEAR means that PHPUnit will automatically\
    \ install its command line application as well as ensuring that PHPUnit is in\
    \ the include path (unless we have modified the include path to drop the PEAR\
    \ directory). Additionally, installing from PEAR means that we can update PHPUnit\
    \ to the latest version easily, and Sebastian Bergmann (the author of PHPUnit)\
    \ is regularly releasing upgrades and new features to PHPUnit, making upgrading\
    \ well worth it.\n\nFollow the instructions for installing PHPUnit¹ from PEAR.\
    \ After installing PHPUnit, there are some terms that we should familiarize ourselves\
    \ with. A unit test is a test that runs against a specific block of code - usually\
    \ a function or a method. This unit test runs the block of code, and then makes\
    \ assertions as to what the block of code should return - that is, the value,\
    \ type, or behavior that should occur as a result of running the block of code.\n\
    \nHere is a complete unit test written for PHPUnit:\n\n```\nrequire_once 'PHPUnit/Framework.php';\n\
    \nclass ArrayTest extends PHPUnit_Framework_TestCase {\n    public function testIsArray()\
    \ {\n        $item = array();\n        $item2 = false;\n        $item2 = (array)\
    \ $item2; $this-\n        >assertType(\"array\", $item); $this-\n        >assertType(\"\
    array\", $item2);\n    }\n}\n```\n\nThere are some things we should take note\
    \ of in this test. First, the class name is ArrayTest; this employs the convention\
    \ of naming test classes as *Test, and if you are testing a class (for example,\
    \ a class called Login) you should name the test LoginTest.\n\nAll the test methods\
    \ in our class are named test* (for example, we have testIsArray ().). This is\
    \ how PHPUnit finds the tests and executes them. Without this information, PHPUnit\
    \ would not run our unit tests. PHPUnit uses reflection to determine which methods\
    \ to execute."
  merge: -1
  img_proc: true
- pgno: 32
  md: 'Also note that the test class extends from PHPUnit_Framework_TestCase. This
    is the test case class, and contains all the methods necessary to properly generate
    and run test cases.


    As previously mentioned, when beginning to write tests, it is tempting to write
    only a single method that tests your single point of entry and then determines
    if the whole class functioned properly. It is important that you avoid doing this;
    that is more akin to a “functional test” - that is, a test of the functionality.
    We want to test individual units of code - the methods themselves - meaning that
    we want to avoid writing functional tests and instead test “units”, typically
    methods.


    This brief introduction should be a guide to writing tests; the PHPUnit manual
    is much more in depth and is up to date. PHPUnit is still in development; though
    Version 3.4 of PHPUnit was used in the writing of this book, changes may be made
    that could affect the accuracy of these guidelines.


    # How to Test When Time is Not Allotted for It


    Because testing takes extra time, many managers feel it is unimportant, and worse,
    may believe that it is “red tape” preventing them from getting the project shipped
    on time. This is not unusual; the more non-technical the managers get, the more
    they fail to see the benefits of unit testing.


    Good developers can still find time to write these tests, however. Since developers
    often have a good bit of influence in the estimation process and bug fixing process,
    there are strategies that developers can employ to improve their chances of getting
    good unit tests written.


    # Controlling the Time Estimate


    Most developers play a part in the estimation process. Even in the worst development
    shops, the project manager must rely on the discretion of the developer in order
    to properly devise a schedule, and this requires estimation on the part of the
    developer.


    Good developers use this to their advantage. They understand how long things will
    take, and how long things will take in the event of catastrophic failure, and
    usually pick a number in between in order to satisfy the project manager. Good
    estimation'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'means that you can satisfy your manager while still getting your work done
    in a high quality way.


    If estimation is a core component of your job, and you have 100% leverage in making
    the estimate, you can in fact build in time for testing. When it comes time to
    calculate the estimate, figure in the time to write tests, and simply leave that
    time in the final estimate but do not mark down that it is for unit testing.


    Some might find this to be a bit dishonest; in truth it can appear that way. However,
    proper unit testing is an essential part of completing the project, whether or
    not a project manager will try and cut it out. Unit testing is part of the job.


    By properly estimating and providing an estimate that builds in time for unit
    testing, you automatically build unit testing into your schedule without sacrificing
    the quality of the finished product.


    # Writing Unit Tests for Every Bug


    One strategy that the guys over at web2project use to improve their test coverage
    is that every bug that gets fixed must be accompanied by a unit test that tests
    the code. This accomplishes two things: first, it allows them to show the bug
    in a programmatic way (meaning they have a before-and-after view of the fix),
    and secondly, it forces them to write test coverage for lots of their product.


    It is pretty easy to argue for writing a test that will show when you have the
    bug fixed: and since a unit test is essentially a test of the logic that asserts
    a particular outcome, your unit test is pretty good evidence that the bug has
    been resolved. The end result here is that you end up with massive amounts of
    unit tests that address specific bugs in the code, but also test to make sure
    that any refactoring you do later on does not reintroduce bugs that would otherwise
    harm your application.


    Most of the time, you do not even need a whole lot of time to write unit tests
    with this method. Showing that a bug exists in code is pretty easy - if you assert
    what the outcome should be, and you get a different outcome, the unit test fails.
    Usually these tests take less than 30 minutes to write (and any test that takes
    more than 30 minutes to write by itself might be too large anyway).


    This strategy is also excellent when you have a large existing codebase that lacks
    unit tests. By writing them as you fix bugs, you will slowly improve your coverage.
    Over time you will improve your coverage until you are at or near 100%.'
  merge: -1
  img_proc: true
