- pgno: 145
  md: '# Chapter 9


    # Becoming a Happy Developer


    Development is a great trade to be in. It is growing, and people have a great
    amount of respect for those that can “do things” with computers. There are new
    openings every day for skilled developers, and becoming a highly skilled PHP developer
    will bode well for future career opportunities.


    Having a job in development, though, is not always the same thing as being happy
    in development. There are a number of factors that contribute strongly to whether
    or not a developer is happy at what they are doing. Some of these items, including
    version control and testing have been discussed in this book to this point. Others
    like effective issue tracking, spec development and quiet working conditions have
    not been discussed in very much detail to this point.


    This chapter focuses on some of these “soft skills” that help contribute to happy,
    healthy developers that love their work environments and help produce exceptional
    code day in and day out.


    # The Importance of Quiet


    In what has turned into a pervasive trend, developers at the entry, mid and even
    senior levels are finding themselves thrust into open bullpens or cubicle farms,
    devoid of sound dampening barriers like walls and office doors. Startups with
    fancy, vowel-devoid names corral their developers to “improve communication” or'
