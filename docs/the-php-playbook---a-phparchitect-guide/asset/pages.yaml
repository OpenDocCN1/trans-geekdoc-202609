  md: '# Stashing Changes for Later


    From time to time, we may not be ready to commit our changes to the repository
    quite yet, but we may need to pull in additional changes from other users, either
    from Subversion or from another repository. Or, we may be working on master and
    need to revert it back to a known state, while still preserving our changes for
    the future.


    Git offers a function to do this called stash which allows us to stash our files
    in a temporary storage, and retrieve them later.


    ```

    $ git stash

    Saved working directory and index state WIP on master: 0adce2e Adding new content.

    HEAD is now at 0adce2e Adding new content.

    ```


    Git has now stashed the changes to the working copy and has reverted the directory
    back to the 0adce2e commit. We can now freely make changes, and when we are ready
    we can see the stashes that already exist:


    ```

    $ git stash list

    stash@{0}: WIP on master: 0adce2e Adding new content.

    ```


    This shows all the stashes we have available to us. There are a number of ways
    to access a stash: we can pop the stash or apply it. If we “pop” the stash we
    remove it from the list and apply the changes; if we simply “apply” the stash
    we apply the changes while leaving the stash in the stash list. Alternatively,
    we can also direct it to apply a particular stash (if we have more than one).


    ```

    $ git stash pop

    # On branch master

    # Changed but not updated:

    # (use "git add <file>..." to update what will be committed)

    # (use "git checkout -- <file>..." to discard changes in working directory)

    #

    # modified:  example.txt

    #

    no changes added to commit (use "git add" and/or "git commit -a")

    Dropped refs/stash@{0} (a79efc499ea8fd6cec59adb5acb4ae2caa768ef3)

    ```'
