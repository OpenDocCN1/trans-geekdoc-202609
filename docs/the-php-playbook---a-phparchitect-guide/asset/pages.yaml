- pgno: 100
  md: '# Why Refactor?


    There are a number of reasons why refactoring is an important aspect of development.
    Many developers feel that refactoring is difficult, time consuming and pointless,
    yet it is a critical step, and every developer should practice it.


    Refactoring is important because it costs less to improve the code than to rewrite
    it. Many developers look at old code that they have written and are surprised
    at how much they have advanced, even in a span of time as short as a few months.
    They may look at the last product and decide that they should stop and rewrite
    the product given their newer skills. But this is a fool''s errand.


    Instead of rewriting applications, refactoring gives us the opportunity to improve
    existing applications slowly, in iterations, over time. Because refactoring is
    focused on improving the code itself, rather than the functional behavior of the
    application, refactoring is a perfect opportunity to apply those new skills to
    old code.


    Refactoring the existing code takes advantage of bug fixes, preserves the institutional
    memory embedded in that code, and can take advantage of the test suite for that
    application, which helps prevent bugs from being introduced by the refactoring.
    These protections often do not exist when applications are rewritten: rewritten
    code does not benefit from institutional memory, does not contain the bug fixes
    already highlighted in the code, and since the test suite is unproven, it is possible
    that there will be many bugs.


    Refactoring is also important because it allows developers to make improvements
    as their understanding and knowledge improves. The reality is that for most developers,
    they grow and change. Their understanding of core principles and the practice
    of their art improves over time. They are liable to look at their code in the
    future and see problems with it, as well as areas for improvement.


    Choosing to refactor gives developers an opportunity to bring these improvements
    to older products and code. It allows them not only to see areas where code can
    be improved, but to actually improve it. In turn, older applications continue
    to get better, which provides value to clients and users.


    Along the same lines, developers that refactor often bring enhancements learned
    from other applications and projects, which in turn improves the overall quality
    of an application. For example, a particular algorithm or process for doing something
    with the database is often portable from one application to another. A developer''s'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'ability to take those improvements and discoveries, and then to add them to
    other applications, improves everyone''s experience overall.


    Finally, refactoring often improves the structure and design of an application.
    Since the point of refactoring is to enhance the structure, functionality, performance
    and design of an application, as developers improve in these areas, the applications
    they refactor benefit from an improved understanding of these concepts and practices.


    # Things Developers Must Do Before Refactoring


    Refactoring is an important tool in a PHP developer’s toolkit, but it is not without
    its problems and potential hazards.


    In order to refactor effectively, developers must pay attention to some “gotchas”
    about refactoring and do what they can to mitigate these areas.


    The first and most obvious is that developers must understand what it is that
    the code is trying to accomplish before trying to change the way it functions.
    Otherwise, developers run the risk of breaking the implementation out of a misunderstanding
    of how the code works.


    Developers also often overlook the need to have a comprehensive test suite built
    up for code they intend to refactor. This is essential, because without a comprehensive
    test suite there is no way for developers to know whether or not the refactoring
    they completed has broken the application. Many small bugs may only manifest themselves
    in test suites or edge cases within an application. Having a test suite that can
    highlight these edge cases is of great value to developers.


    # How to Refactor


    Refactoring is not an exact science. Instead, it is an abstract art, one that
    developers consistently improve upon as they grow as developers. Thus, this chapter
    contains few hard and fast rules, and more of a discussion of strategies that
    will lead to improved code when refactoring.


    This discussion requires a sample of code to be refactored, which will reappear
    throughout this chapter as refactoring takes place:


    ```

    // class_Twitter.php - NPC TWITTER AUTO-FEED

    ```'
