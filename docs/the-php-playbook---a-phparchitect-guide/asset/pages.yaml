  md: "```\n```php\n}\npublic function setTTL($ttl) {\n    if($ttl < 0 || !is_int($ttl))\
    \ {\n        throw new Exception('TTL must be a positive integer greater than\
    \ 0');\n    }\n\n    $this->ttl = $ttl;\n    return true;\n}\n}\n```\n```\n\n\
    # Memory-based Caches\n\nMemory-based caches are caching systems that make use\
    \ of the available memory on a system. There are two core distinctions between\
    \ file-based caches and memory-based caches: first, memory-based caches always\
    \ require an intermediate component to access the RAM on the system; secondly,\
    \ memory-based caches are lost if power is lost to the RAM, or PHP is reloaded\
    \ (as it is through a web server restart).\n\nMemory-based caches offer some advantages\
    \ over other caches; in particular, they are usually very fast (because RAM is\
    \ very fast) which improves performance. In fact their speed is such an advantage\
    \ Memcached was discussed in Chapter 4. Additionally, memory-based caches do not\
    \ typically have issues with locking, or file system permissions problems.\n\n\
    The disadvantage of a memory-based cache is that it is limited to the RAM on the\
    \ system. This is not significantly different from a file-based cache (which is\
    \ limited by hard disk space), except that most machines have hundreds of gigabytes\
    \ of disk space, while they have only a few dozen gigabytes of RAM available.\
    \ Memory-based caches will make logical choices as to which components to invalidate\
    \ rather than allowing the system to swap, but this does not necessarily prevent\
    \ the web server or other machine processes from swapping themselves, which can\
    \ lead to a performance degradation; thus, when using a memory-based cache, developers\
    \ must consider the implications of using a memory-based cache.\n\nThere are two\
    \ popular memory caches that we will discuss: APC and Memcached."
