- pgno: 29
  md: '# Chapter 2


    # Test-Driven Development


    Most developers who have been in software development for any length of time have
    heard the words “unit testing” used to describe a particular method of testing
    software that is in development. They may even have heard of a principle known
    as “Test-Driven Development”, which in a nutshell is the philosophy that a test
    should be written before any code is written for the actual project.


    The problem with testing is that it is very much like following the speed limit:
    everyone knows they should be doing it, but very few people actually do (and the
    ones who insist on doing it annoy the rest of us). However, testing is not just
    an obnoxious roadblock to software development: it is a crucial component to the
    development and implementation of software.


    Why are unit tests so crucial? As systems get larger and larger, two things happen:
    first, it becomes impossible for any single developer to fully and completely
    grasp the intricacies of the system at hand. Secondly, as this takes place, more
    developers are working on and refactoring existing code, making it almost a certainty
    that somewhere down the line, someone will make a change that renders the application
    unusable in some fashion (a regression).


    Unit tests can help prevent this by showing you where and why code is failing.
    While unit tests cannot fix every bug or prevent every regression, they can point
    out flaws in the application logic or refactoring strategies before the flaws
    make it into production.'
  merge: -1
  img_proc: true
