  md: '# Xdebug Profiler Options


    Xdebug comes with a profiler that will produce a cachegrind-compatible file. This
    file can be used with any number of profilers, like Kcachegrind for Mac or Windows.


    Profiling is a bit different, because unlike function traces, profiling must be
    done over an entire PHP script, and cannot be started in the script (it must be
    done as an INI setting or directive). There are still a number of configuration
    options, though, that you should be aware of and utilize.


    In order to utilize the profiler you must set xdebug.profiler_enable to one (1).


    Occasionally you may wish to append the cachegrind file, rather than overwrite
    it altogether. xdebug.profiler_append will allow for the cachegrind file to be
    appended.


    You can change the name of the profiler''s output file with xdebug.profiler_output_name
    to help differentiate between a variety of different scripts that you are profiling.


    # Using Function Traces


    It is often useful to be able to see the path an application takes to rendering
    a result. Since it is not possible to see the stack at any given time (without
    raising an error or throwing an exception), making use of Xdebug''s function tracing
    abilities is an excellent way to figure out tricky problems involving what is
    being run, and when.


    Function traces can be run in two different ways: by explicitly invoking the function
    trace to run and stop, or by having Xdebug start the trace as soon as PHP is invoked.


    By running the function trace manually, and setting where it begins and ends,
    a developer has the ability to see snippets of the code that they might not otherwise
    see. Wonder what a particular method does? A function trace provides a quick snapshot
    of the levels of depth through which the method runs before getting to a return
    value. A function trace can be used to see if certain conditionals are being met
    (often in tandem with the option to see the arguments being passed to various
    functions).


    In order to invoke a function trace, developers use the xdebug_start_trace() function;
    the trace can be stopped just as easily with the xdebug_stop_trace() function.
    These two functions can be invoked at any point in time during the execution of
    a script.'
  merge: -1
  img_proc: true
- pgno: 21
  md: "Occasionally, developers might like to see a script from top to bottom. The\
    \ ability to have a trace begin automatically is very useful in cases where a\
    \ developer might want to see what files are included (and at what stages); or\
    \ they want to see startup functions that are executed before the main body of\
    \ the application is invoked. The automatic trace options are also great if a\
    \ developer is using the auto_prepend INI directive, since there is no easy way\
    \ to start a trace in this file.\n\nFunction traces are useful for many things,\
    \ but can also be very confusing. It is best if they are used in small increments\
    \ for specific purposes; developers may find that using them excessively will\
    \ give them information overload.\n\nDevelopers should also be careful to make\
    \ sure the trace files are being written to a directory that is writable by the\
    \ web server. The web server is often run as root, and may not share the same\
