- pgno: 142
  md: 'This is clearly wrong - in this if statement we are assigning the value, which
    will always return true, but that is obviously not the point of the if-else statement.


    Instead, we meant to use a double-equals (==) to evaluate whether the variable
    $var was equivalent to the count($array) result.


    ```

    if(count($array) = $var) { ... }

    ```


    The fatal error would help us to realize that we had omitted the double-equals
    required to evaluate, and instead we would realize we that were attempting to
    assign, resulting in the error.


    One of the easiest ways to enforce coding standards is to make use of something
    like PHP_CodeSniffer. This PEAR package can be integrated into continuous integration
    servers like PHPUnderControl, which will produce regular reports about compliance
    with your coding standards. PHP_CodeSniffer examines your code against a specified
    set of rules, and flags errors in that code for review. It can be as lenient or
    as strict as you like. There are several standards already developed for use with
    it, and developers can develop their own set of standards as well.


    There are many resources available to help developers create a coding standard
    that fits their needs. Some existing ones will automatically fit the bill, at
    other times developers will want to adopt a coding standard to fit themselves
    or their needs. Whatever approach is taken, developers should simply ensure that
    the coding standard of their choice is followed and applied to all new code written,
    and all old code maintained, to ensure future compliance with such a standard
    for ease of reading and prevention of bugs.'
