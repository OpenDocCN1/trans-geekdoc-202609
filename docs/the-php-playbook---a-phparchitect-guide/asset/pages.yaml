  md: "There are a lot of important changes in this section of the code. The API has\
    \ been ported from the MySQL API over to the PDO API, making the code database\
    \ agnostic. More importantly, we have further protected ourselves against SQL\
    \ injection because we are using the PDO prepare options, which improves our security.\
    \ Finally, we have removed the die() construct, opting instead to use PDO's built-in\
    \ exceptions for control. In this case we have simply caught and rethrown the\
    \ exception, which we will resolve in a later component.\n\nThis is a good point\
    \ at which to discuss one of the hard and fast rules of refactoring: remove die()\
    \ statements from production code (exit() calls too). Calls that terminate the\
    \ execution of your script, and worse, output error messages, have no place in\
    \ a production-quality application. Halting execution is a useful tool, but one\
    \ that places you and your users at a tremendous disadvantage when things go wrong.\n\
    \nExceptions are far better for use in object-oriented programming. Graceful degradation\
    \ in procedural applications (like error handlers) is a much more appropriate\
    \ way to handle problems than a sudden stop with a cryptic error message. Errors\
    \ should never be displayed to the end user.\n\nThe last component in need of\
    \ refactoring is the part that makes the HTTP request to Twitter, because we modified\
    \ the API we are using. This is a fairly straightforward refactoring:\n\n```\n\
    /**\n * Twitter Class\n * @author Anonymous\n *\n */\nclass Twitter {\n    /**\n\
    \     * @var HTTPCon HTTP object\n     */\n    protected $http;\n\n    /**\n \
    \    * @var string Email address for administrator/tester\n     */\n    protected\
    \ $you;\n\n    /**\n     * @var string The username for the Twitter account.\n\
    \     */\n```"
