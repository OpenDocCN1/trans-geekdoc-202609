- pgno: 94
  md: 'Git does not suffer so much from this problem; its operational model is to
    make use of small, short-lived branches that are worked on and then merged quickly
    into master, to be destroyed. But Subversion, by virtue of the fact that the entire
    file system is copied over to a new directory, does not foster this regular merging.
    So it is important that developers do it purposely.


    If a major feature or overhaul is being worked on, it is more than alright to
    merge trunk into the branch to add features currently being worked on in trunk
    to the branch. Once the branch is stable, this makes merging the final product
    back into trunk that much easier. Also, it is suggested that developers take very
    good notes about at which revisions they branch and merge. This will help alleviate
    some of the problems with Subversion''s merging command.


    Because Git is better at merging, for developers who intend to branch frequently,
    Git is a much better choice. However, Subversion does offer some branch support,
    so long as this rule is followed.


    # Guerrilla Version Control


    When it comes to version control, everyone has an opinion, and they do not always
    line up. For cases when developers cannot use version control, or the version
    control system they desire, it might look hopeless. But it does not have to be
    hopeless: it is still possible to use version control.


    # Some Words for Developers Who Do Not Have Version Control


    Sometimes, a manager cannot be convinced to make use of version control, or a
    team cannot be persuaded to take it seriously. In these cases, you as a developer
    do not need to abandon version control altogether; there are still distinct benefits
    that you can take advantage of, even if your team or management will not.


    Version control by definition is designed to improve the performance of individuals,
    and even though it is often team focused, it is individuals who benefit the most
    from version control. This means that developers can use version control by themselves
    and without the involvement of their teams.


    Probably the best suited VCS for this is Git. Because Git allows for creation
    of a local repository without the need for it to be hosted elsewhere, Git offers
    the lone developer the ability to make use of version control without anyone ever
    knowing they'
