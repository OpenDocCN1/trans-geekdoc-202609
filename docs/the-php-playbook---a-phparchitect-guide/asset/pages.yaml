- pgno: 133
  md: '# Chapter 8


    # Worst Practices


    First, let''s get these out of the way:


    +   - Spaghetti code

    +   - References

    +   - Too much OOP

    +   - 80/20 rule micro optimization


    Developers tend to focus on “best practices” as a way to help improve development
    and get everyone on the same page. These best practices are a great way to highlight
    development practices that should be employed. But what practices are explicitly
    bad for development?


    This chapter focuses on these practices and highlights the ways in which they
    are both bad and can be improved upon. We focus on the reasons why security should
    be a part of your application from the ground up, talk about how many developers
    spend too much time coding and not enough time designing, expose not-invented-here
    syndrome and talk about style guides for applications.


    # Thinking Security Is for When an Application is Finished


    “I’ll just finish writing the application, then I’ll make it secure.” Sound familiar?
    This is a common thread in development for many. Security is secondary in their
    minds to'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'getting a working prototype assembled and demonstrated. This can be for a variety
    of reasons: they do not care to focus on security, or the deadline for the prototype
    is extremely tight, or they simply do not understand the value that security adds
    to the picture.


    Developing security last, though, is a dangerous practice because it undermines
    the entire concept of security. It ensures that when you go through your application
    to “add” security later, inevitably you are going to miss something. You might
    miss adding security at the database layer or at the view layer or somewhere else
    in your application. These are poor security practices that can and should be
    avoided.


    Security should be included from the architecture phase all the way up through
    the demonstration phase. Good developers might even include security as one of
    the items demoed to a client or to an internal team before an application can
    be declared to be “ready” for production.


    When writing individual portions of the application, a good deal of time should
    be spent determining what security must be included and how to implement that
    security.


    During the architecture phase, an application developer should determine what
    security measures will be necessary, and how they will work together to provide
    overall security for the application. It is at this stage that one can determine
    when and where to place the security checks, which security checks to enforce,
    and how best to protect the application from malicious users.


    When designing the database layer, protections against SQL injection should be
    undertaken by the development team. A consideration of where data is coming from
    and how it is being used should also play into the decisions made at this stage,
    whether the data is coming from internal (generally safer) sources, or is user-supplied
    (and wholly unsafe). These decisions will largely rest on the architectural design
    supplied in the first phases of development.


    Moving on to the user interface development, there are two unique protections
    that should be undertaken here: what Chris Shiflett calls “Filter Input, Escape
    Output”. First, any input submitted by the user must be filtered for a specific
    set of criteria that is unacceptable - HTML, injection possibilities (usually
    handled at the database layer), invalid data (alpha characters where numeric characters
    are expected, non-emails where email addresses are required), and other checks.'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'These checks should always be done on the server side (despite the popularity
    of JavaScript-based validation, which can be used to provide immediate feedback
    if so desired). Next, it is critical to escape output - anything that was not
    screened for or filtered out should be rendered harmless at this point. This means
    converting any missed HTML to harmless HTML, ensuring that XSS attacks are not
    possible, and neutralizing other types of attacks.


    There are also areas that are often overlooked that should be addressed. One of
    those areas is in session protection. It is critical to design sessions to be
    protected against session hijacking, by verifying sessions, changing session IDs
    after permissions elevation, considering checking User-Agent headers, and other
    standard protections.


    Additionally, standard practices like requiring a password to change sensitive
    settings or the password itself, and using HTTPS connections for security-related
    data are essential components of your security model.


    It should be obvious by this point that planning to incorporate security at the
    conclusion of development presents extreme challenges. Many of these security
    changes would require significant code revision; some would require the additional
    work of designers and testers, ensuring a second round of development. While it
    is likely that a second round will be necessary to make adjustments requested
    by clients or product managers, this still requires significant refactoring.


    Developing with a security mindset instead ensures that security will be included
    in each step, helping to eliminate the chances that something will be missed.
    While it is impossible to guarantee that every security hole is closed, developing
    with security in mind, rather than as an afterthought, helps make sure that many
    are in fact closed, and improves the overall security of your application.


    # ## Spending Too Much Time Coding, Not Enough Time Designing


    Developers enjoy writing code and presenting a solution that is expressed as a
    finished product. They would rather write code than write specs. This component
    of developer behavior makes the design process hard on them, because they have
    a hard time putting their thoughts in writing or coming up with ideas that are
    not expressed in some sort of code.'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'In many cases, this will result in a developer simply diving into a project
    and writing code without having developed a plan, architecting the product, or
    thinking through the implications of design choices they are now making on the
    fly. This is dangerous, because it inhibits the inclusion of security measures,
    ensures that massive amounts of refactoring will be necessary when changes are
    needed, and ultimately will end up delaying the product past any deadline the
    developer might have insisted he could meet.


    The problem here is that any software development process expert would tell that
    developer that design is not an inconvenient waste of time; but actually requires
    a greater portion of the time than is required by the actual programming. This
    might seem strange; however, according to the author of “The Mythical Man Month”,
    the following is the breakdown of a proper application development cycle:


    +   - 1/3rd planning

    +   - 1/6th coding

    +   - 1/4th early testing

    +   - 1/4th complete application testing, once all components delivered


    In other words, only 17% of the application development is spent writing code.
    A full third of the time is spent planning the application, designing it, architecting
    it, getting feedback from stakeholders and planning out exactly what will be written,
    by whom, and by when.


    An odd reality that I have become familiar with is that software development is
    going to take as long as it is going to take. There is nothing you can do to speed
    the process. If the process was meant to take six weeks and you try to compress
    it into four weeks, you will spend those extra two weeks playing catch-up no matter
    what. You cannot ignore the 1/3 planning time, or the 1/2 testing time, because
    the application will have bugs and will delay the deadline to the point where
    you will have ultimately spent that amount of time fixing it. The proportions
    here have an eerie way of being dead-on right.


    Developers who realize this have an easier time than those who do not. They know
    that they have to take the time to properly develop their applications, and as
    such they spend time in design. They step back, architect how the application
    will work,'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'talk amongst themselves about new ideas that might improve the process, and
    generally examine the application from an objective point of view.


    The best team leads recognize that seeing developers sitting in a room together,
    talking, is not a sign that nothing is getting finished. They realize that planning
    and design are critical components of the application development process, and
    they leave their teams to think, plan, dream, and ultimately walk out with a comprehensive
    design in hand that will make development that much easier.


    There is an old adage that “those who fail to plan, plan to fail.” This is true
    when it relates to software development. Failure to plan is the greatest single
    cause of project failure. The next greatest cause would be failure to plan realistically,
    not realizing the time requirements, and thus not building those requirements
    into the overall system. At the end of the day, spending too much time coding
    and not enough time designing is a dangerous move, and one that will surely reap
    undesirable dividends.


    # Catching NIH Syndrome


    When I first began to develop software, I had a great idea for a blogging platform.
    It would be bigger, better, more powerful and easier to use than WordPress. It
    would have lots of new features, and would take the world by storm. And most importantly,
    I would write the entire thing from the ground up: By myself.


    Sound familiar? Chances are that every developer in the world has experienced
    this from time to time. We think that we are smarter, better, more able to implement,
    insert-your-own-description-here than the next guy.


    This is what is referred to as the Not-Invented-Here (NIH) Syndrome. It is a belief
    that products or ideas that come from other places are somehow inferior to our
    own products or ideas. It leads to the regular reinvention of standardized libraries,
    the reimplementation of existing products, and the creation of code that has already
    been developed elsewhere.


    There are certainly some cases in which redeveloping something is a wise choice:
    when you have a bona fide performance improvement to contribute, or when you have
    special needs that are underserved or not served by the existing ideas. Certainly
    lots of companies make livings by reinventing old products and progress is predicated
    on the idea that someone can build a better mousetrap.'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'The NIH syndrome becomes a problem, though, when developers automatically assume
    that everything that has been written is not good enough for them and that they
    can do a better job. Rejection of existing ideas often leads to reinvention of
    something that was usually good enough to begin with.


    NIH syndrome comes with a number of disadvantages. First, it requires the developer
    to rewrite everything that has already been written. It leads to things like development
    of a new framework where other frameworks were adequate, or worse, the implementation
    of native PHP functions in PHP code - severely inhibiting the performance of those
    functions.


    It also creates problems in maintainability. If everything a developer does is
    proprietary, finding new developers to maintain those products or libraries means
    they must first learn those libraries - often with a considerable amount of lead
    time. This reduces productivity, and simultaneously reduces the pool of talent
    that might be acquired in the future.


    Reinventing everything also limits how much a library, product or service can
    learn from the rest of the world. Development practices and standards change;
    improvements to standard libraries are almost immediately available to all who
    use them, while a custom-written library has to be rewritten to incorporate any
    changes - if those changes are known in the first place.


    Rather than going through the hassle of developing tools and products that have
    already been invented, developers would be wise to learn to examine existing products,
    tools, libraries and services for their usefulness, applicability, and acceptability.
    This leaves more time for the development of the application at hand - likely
    a new application that has never been developed previously - which is really the
    fun part of development.


    # Trying to Micro Optimize


    A regular debate throughout the PHP community focuses on the idea of “micro optimizations”
    - small changes to code that effect small but meaningful performance gains. Most
    of these optimizations focus on replacing things like `print()` with `echo()`,
    or replacing double quotation marks with single quotation marks and concatenating.
    A great deal of time and energy is spent talking about these optimizations, and
    lots of people regularly blog about them.'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'Micro optimization is a complete waste of time and energy. It is a massive
    refactoring effort for minimum - if any - performance gains. There are a number
    of reasons why this is the case.


    First and foremost, most people who micro optimize do not first macro optimize.
    They have not read Chapter 3 of this book, which discusses how to optimize code,
    and the things that must be done. Chances are good that most applications that
    need optimization, and thus are micro optimized, have bottlenecks that are not
    related to the micro optimizations that are purported to improve performance.


    Often those who micro optimize also forget that PHP is already a pretty smart
    compiler. Those who insist that PHP must run through double-quoted strings to
    identify and handle variables buried within that string are only partially right
    - my own performance tests indicate that PHP only does this (with any sort of
    performance hit) when there are actually items to be parsed. In other words, PHP
    is smart enough to know whether or not to give the string a second look. Concatenating
    those items out has no meaningful performance impact.


    Another common issue amongst those who micro optimize is that they often turn
    their code into a mess. One blog post (published in 2009) suggested that those
    using objects adjust their application design. They articulated that “calling
    a static method is faster than calling an object method.” This may well be true
    but presents any number of problems, not the least of which is that this would
    require a substantial refactoring and breaks pretty much every paradigm of object-oriented
    programming.


    Those who insist on micro optimizing often ignore the cost associated with doing
    it. Having a developer run through an application and replace double quotes with
    single quotes for “performance reasons” will cost a considerable amount of money
    in terms of time and salary paid. This amount could even exceed the cost of purchasing
    additional hardware which would make such a micro optimization a moot point.


    Finally, it is worth noting that some micro optimization proponents actually stumble
    onto good design practices without realizing it when suggesting micro optimizations.
    For example, one person encourages use of “isset() over array_key_exists()” and
    states that “a switch is sometimes faster than if...elseif...else, which are both
    potentially good design concepts regardless of performance questions.”


    Rather than micro optimizing, which has dubious performance consequences, it is
    better to actually optimize. To get started with optimizations that will make
    a difference, read Chapter 3 and learn what optimizing actually means.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Not Developing with Strictness Operators


    For those not intimately familiar with the ins and outs of the INI configuration
    file, the `E_ALL | E_STRICT` notation means that PHP will notify you of all errors
    (including notices) AND all E_STRICT errors. Most developers never bother to develop
    this way, yet this is an important element of development and one that should
    be taken seriously.


    Most developers figure that notices are unimportant since they do not typically
    break the application and they do not interrupt anything. And with regards to
    E_STRICT, these coding standards warnings have no real bearing on the way a PHP
    application actually performs - they just warn of coding standard violations.
    It is often hard to justify spending time fixing these errors when there are lots
    of other things to get done.


    Developing with these flags also ensures that you are able to catch errors and
    mistakes early on. Some problems manifest themselves as minor errors, but can
    morph into large bugs later on in your application. For example, an undefined
    variable being used will generate a notice. If you then try and use the variable
    as an object, this generates a fatal error that can (and usually will) manifest
    itself in the most inopportune or inappropriate time.


    Similarly, following the coding standards ensures that the code does not violate
    certain voluntary rules, which can later lead to the violation of certain involuntary
    rules relating to how PHP code is supposed to be written.


    Developers who develop with these flags on typically produce a higher quality
    code that complies with all the standards of PHP, ensuring that their code will
    ultimately be more bug-free and less prone to mistakes and omissions later on.
    While it is possible to develop entire applications that have notices and coding
    standard violations, it is not advisable and for any professional developing an
    application, these errors should be caught, fixed and avoided.


    # Not Developing with a Style Guide


    Every developer ultimately develops their own sense of coding styles, whether
    they employ a particular defined style or invent one of their own. This is usually
    acceptable for small projects that the developer undertakes by themselves, but
    for larger'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'projects, this can create a hodgepodge of varying code that confuses other
    developers and makes code difficult to maintain.


    Many developers are still resistant to implementing a coding standard, even given
    this potential for conflict. Their reasons are many: good code does not result
    from a coding standard, or the fact that a coding standard means they have to
    spend precious time reformatting their code instead of making it work properly.


    However, coding standards have two important applications that make them necessary
    in large teams: first, they make code maintenance considerably easier by codifying
    and unifying the way code is written and developed. Second, they can help prevent
    inadvertent bugs by their implementation.


    Most developers will agree that it is easier to write code than it is to read
    it. Given the difficulty in reading code, developing without a coding standard
    makes this even more difficult, because in addition to reading code that is unfamiliar
    the developer must also adapt to a coding style that is unfamiliar.


    A standardized coding style, regardless of whether it is each developer’s personal
    preference, establishes a familiar baseline that ensures that developers will
    be able to more easily read and understand source code not written by them. This
    further ensures that maintainability is made easier.


    Style guides, when well written, can also help prevent the introduction of bugs
    into your code. For example, requiring brackets around if-else statements, even
    if they are a single line, helps prevent the introduction of bugs when a developer
    goes to add a second behavior in that if-else loop. Without such a coding standard,
    it is possible that the developer might forget and introduce something that causes
    the original item to be executed regardless; this condition would obviously introduce
    a significant bug.


    Joel Spolsky once wrote an article called “Making Wrong Code Look Wrong” in which
    he argues that developers can designate between unsafe and safe (unclean and clean)
    variables in code. This helps prevent security problems, and might also help prevent
    bugs in code.


    Another strategy suggested by some is the reversal of the order in which items
    are compared in if-else statements, generating a fatal error in the event that
    a developer uses the wrong symbol. For example:


    ```

    ```php

    if($var = count($array)) { ... }

    ```

    ```'
  merge: -1
