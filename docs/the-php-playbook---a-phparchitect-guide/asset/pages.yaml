  md: "Note that we have removed the $done property, and refactored the logic so that\
    \ if the tweet has been sent, we do not resend it.\n\nLet’s also consider the\
    \ purpose of storing data in the database: it is designed to prevent us from sending\
    \ the same message we just sent by mistake. This is a valid goal, and certainly\
    \ one worth writing some protections against. However, this can be done without\
    \ a database connection. Instead, we will add a property called $lastTweet that\
    \ will store the last tweet’s MD5 hash; this will ensure that the next tweet is\
    \ not the same as the last one.\n\nWe are also going to want to store the last\
    \ tweet in the database, to record what messages are sent using our application.\
    \ This can be for audit purposes or simply historical context. However, we will\
    \ want to do this after we have successfully sent the tweet out. The nature of\
    \ the HTTP protocol prevents us from using transactions effectively in this case.\
    \ We are going to have to hope that the database is available once the tweet has\
    \ been posted, but the risk here is lower than storing it beforehand.\n\nWe also\
    \ want to refactor the logic we are using to construct the URL. By doing so, we\
    \ ensure that the item is reusable. Since the Twitter URL will never change, we\
    \ will add a class constant called Twitter::TLD, which is equivalent to the Twitter\
    \ URL we want to use. This means refactoring out the $host property and its assignment\
    \ in the constructor.\n\nThere is also a logic problem with testing the response\
    \ which is that the HTTP status code it tests for can either be 200 or 0. This\
    \ is incorrect, as a properly-formed HTTP response should contain some kind of\
    \ status code. Therefore, we will test for that. Also, we will remove the logic\
    \ that made the response a property, and instead make it a local variable within\
    \ the tweet() method.\n\n```\n/**\n * A public method to post a tweet.\n * @param\
