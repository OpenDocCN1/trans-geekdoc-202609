  md: '# Spotting Code Inefficiencies


    Once a developer has profiled their application and determined that code adjustments
    are needed, there is a real conundrum: how to go about resolving the issues at
    hand.


    Since every application is different, it is impossible to say with certainty “these
    seven steps will work.” Instead, this section is designed to offer five strategies
    for optimization that improve performance while reducing lines of code and inefficiencies.


    **Find and eliminate duplicated information.** Developers often make the mistake
    of duplicating the same information. Perhaps it is copying the value of a function
    and then recalculating that value a second time; it could be storing the same
    results set in multiple places; it could be that there are two variables that
    are calculated independently of one another but contain the same value.


    This often happens when two or more developers work on the same code. One developer
    may not be aware of the operations of another developer, or be aware of the full
    API, and thus re-implements something that does essentially the same thing as
    something the first developer already implemented. This leads to duplicated information,
    which creates inefficiencies.


    **Reduce what is run on every request.** It is often possible to reduce the amount
    of code that is run on each and every request. PHP''s nature is a “share nothing”
    architecture, so every request means initializing and configuring the website;
    however, it is possible that not every request needs every resource.


    For example, is it possible to eliminate the database connection on static pages?
    Perhaps it is possible to reduce the number of plug-ins that are loaded on requests
    that do not need them. Optimize the code to the point where only the resources
    necessary are loaded.


    A lot of times this can be accomplished by replacing `require()` and `include()`
    statements with an autoloader. An autoloader loads classes “on demand” - that
    is, when they are requested, they are located, included and invoked. Classes that
    are not needed are never included, reducing the time it takes to read from disk
    and implement your request.


    **Intimately learn the way PHP works - and do not re-implement native functionality.**
    Ever written a function to sort an array alphabetically? Lots of developers have,
    but what many do not know is that PHP implements the `sort()` function that does'
