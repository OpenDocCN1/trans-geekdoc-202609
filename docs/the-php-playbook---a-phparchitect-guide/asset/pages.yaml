- pgno: 73
  md: '# Chapter 6


    # Harnessing Version Control


    Most developers today make use of version control in their application development
    process. Many of us cannot imagine developing in a world that did not have version
    control available for us. Some developers have been around long enough to use
    the old standbys of CVS (Concurrent Versioning System) and seen the migration
    to Subversion; others became users after Subversion or Git became popular.


    Regardless of when a developer begins using version control, all quickly discover
    its magical power to organize and improve development workflow, almost as though
    it were manna from heaven.


    This chapter discusses what version control is and how to use Subversion and Git
    (two of the most popular VCS or Version Control Systems), as well as how to use
    version control even if your manager will not.


    # What Is Version Control?


    Version control is, simply put, a way of keeping track of different versions of
    a file automatically. While each VCS is different, they all share a similar purpose:
    to track how a file changes over time and allow developers to view a file in any
    given state from any point in history.


    Version control has a secondary advantage, in that it allows different developers
    to work on the same files without overriding the changes made by the other. Version
    control is smart enough to know which parts of a file were changed, and apply
    those'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'changes to both versions in a process called “merging”. From time to time,
    version control encounters a “conflict”, where the same file was changed in the
    same location by two different developers, but is still smart enough to inform
    the developers and encourage them to merge their changes.


    # Why Does Version Control Matter?


    Version control is important for several reasons. First, it offers protection
    of the source code, either from accidental or intentional damage. Secondly, it
    offers developers the ability to identify when, and who, changed certain aspects
    of an application. It allows developers to work together without the stress of
    managing files or manually merging them together. Finally, it allows developers
    the ability to experiment, without impacting the development line adversely.


    Version control matters because it helps keep code safe. From time to time, accidents
    happen: for example, developers have hard disks that crash. It is also possible
    that a disgruntled developer might attempt to damage the company by deleting or
    altering source code in such a way that it causes it to fail. Version control
    helps prevent this. By creating a system of essentially backed up files from various
    points in history, a developer can easily check out a new copy or restore damaged
    code from the known good code at a particular revision.


    Version control matters for other reasons too. In large projects the API, components,
    modules and structure often changes, and does so quickly. A developer can sometimes
    be caught off guard by a change in architecture or the API, and might want to
    know when a change took place. Version control lets that developer look through
    the code’s history and see when and how something changed. Version control also
    tracks each line to determine who committed it and when, helping identify who
    introduced bugs or when a bug was introduced.


    Because version control offers the ability to merge changes from two or more developers,
    it helps facilitate collaboration. Developers can work on similar, related but
    different components of an application at the same time without discussing who
    has that particular file open for writing or who is doing what. In the event of
    a conflict, no developer has to worry that their changes will be overwritten:
    version control allows for manual merging of these conflicts and does its best
    to merge the files together when the work does not overlap.'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'Version control also allows users the ability to create a “branch” - a complete
    copy of the code - into a separate “tree” or area of the repository for development.
    This branch can be used for the purposes of experimenting, or can be part of the
    development cycle. At any point, developers have the option of merging the branch
    together with the main line of development (often called “trunk”) without the
    hassle of copying files by hand and making sure files are not overwritten. A branch
    can also be removed if a developer decides their work was incorrect or should
    have been in a different area of the application.


    # Selling A Manager on Version Control


    Unfortunately, just because something makes development easier doesn’t mean it’s
    liable to be accepted by non-technical managers. Many developers still work without
    version control, which is a common problem in “creative” environments that focus
    less on development and more on the creative element of web design. While this
    is not true everywhere, it is true in some places.


    However, there are some things that developers can do to convince managers that
    version control is both important and necessary.


    First and foremost, version control protects the huge investment that managers
    are making on development. Because version control protects from one developer
    overwriting another, and protects against malicious users attempting to damage
    the code, managers can sleep easier knowing that their code is protected.


    Also, managers will be happy to learn that version control can help foster a culture
    of accountability. All major version control systems allow for post-commit and
    pre-commit hooks which can do a number of important things, including send emails
    when code is committed, write to databases or add information to ticket tracking
    systems, and even validate that the code being committed contains no syntax errors
    or coding standard violations.


    Finally, version control can help control costs and save money. Because code can
    be centrally stored and managed, developers are more likely to reuse code. Additionally
    they have the ability to see what has already been done before, which reduces
    the time they spend writing new code. Because developers are unlikely to overwrite
    each other, there is less time and money spent redoing work that was overwritten.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# Which Version Control Should You Use?


    The choice of VCS really depends on the user and their preferences. People are
    much attached to their VCS and for good reason: mastering one can take some time,
    with developers needing to learn how they work and solve problems with them. That
    being said, there are two major VCS that PHP developers tend to make use of and
    that we will focus on: Subversion and Git.


    # Subversion


    The Subversion version control system is a “next generation” iteration of the
    CVS system of years past. It provides significant enhancements and features over
    CVS, especially in the area of branching and merging.


    Subversion is almost ubiquitous in the version control world right now. Most developers
    have used it, and are very familiar with it. It is currently being actively developed,
    and there are a number of new features planned for the future. It is robust, with
    its own TCP protocol, and can be integrated with Apache or accessed via SSH tunnel.


    Subversion’s core feature is that the repository is centrally hosted in a custom
    file system on a single server. Developers check out a copy of the current working
    copy (or a subset of the current working copy) and have the ability to make modifications
    and then check in files. Subversion tracks the differences between the files (the
    diff) and applies them like patches.


    The benefit of this kind of system is that all work is committed centrally, which
    means there is little chance of data loss (as long as developers commit regularly
    and the server is backed up). The obvious drawback here is that in the event that
    the server crashes or the repository is corrupted, the repository can be lost,
    because an entire copy of it does not exist anywhere except on the centralized
    server.


    Subversion also has a significant advantage in the number of GUI tools, with a
    wide range of tools available for Windows, Mac OS X and Linux. Some of these tools
    are free and open source, while others cost money (some are very expensive).'
  merge: -1
  img_proc: true
