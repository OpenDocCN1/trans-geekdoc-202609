- pgno: 70
  md: '# Avoiding the Pitfalls of Caching


    Caching is not all sunshine and roses: while it has its benefits and certainly
    improves application performance, it also looks an awful lot like black magic.


    A developer''s most important task when using caching is making sure that the
    cache is not required for the application to function. Caching is an optional
    add-on that we bolt to our applications, not a persistent storage mechanism that
    is always available (like a database). Even if caching is deeply ingrained into
    the structure of an application, making sure that the data is available from somewhere
    else is a crucial component of development.


    Developers also need to make sure that the data they cache is current and reflects
    the application''s state as best they can. Stale data, or data that has outlived
    its usefulness and should be discarded, takes away from an application''s overall
    experience. While some level of stale data is acceptable (and each project makes
    a determination as to what that level of acceptability is), for many developers
    having an application that displays patently false and obviously wrong information
    is not an option.


    Avoiding these pitfalls can be a difficult task if developers fail to carefully
    plan their caching systems. But a carefully planned caching system will help alleviate
    or eliminate these problems.


    There are three things each developer can do to avoid the pitfalls of caching.


    # Centralize the Method and API for Caching and Retrieving Information


    By standardizing the method for caching and retrieving information, developers
    gain two distinct advantages. First, they gain the advantage of having a single,
    testable spot for storing, retrieving and expiring information. Secondly, developers
    can switch out the backend with ease, knowing that so long as the API stays consistent,
    the code accessing the API will be able to make a seamless transition.


    Developers also benefit from the fact that caching code is not scattered throughout
    their applications, meaning that developers have a greater sense of control over
    the application''s caching activities.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Establish Written Rules for Data Fidelity


    Without a hard-and-fast set of rules for data fidelity, there is no way to consistently
    establish what level of staleness is acceptable. Establishing written rules makes
    every developer aware of the rules concerning data fidelity, and reduces the chances
    that some data will be stale and other data will not.


    # Consider Caching Data Up Front, Before It Is Requested


    Using cronjobs or other methods, data can be automatically cached by the application
    for delivery to the end user before that data is even requested. Facebook makes
    use of such a caching behavior: they place a large amount of their information
    into memory automatically, making it a simple matter of retrieving it for the
    end user when it is actually needed.


    # Summary


    Caching is a complicated topic but one deserving of examination and consideration.
    When done carefully, caching can be a boon to the implementation of an application,
    improving overall performance and reducing server load at the same time. Developers
    need to carefully plan and contemplate their caching systems; but once implemented,
    caches are a great source of performance improvement.'
  merge: -1
  img_proc: true
