- pgno: 36
  md: 'Finally, unit testing can save money by reducing the number of critical bugs
    that emerge. By having developers write tests, especially beforehand, they can
    build in security tests, meaning that their code must comply with the security
    requirements before the product ships. If new security bugs are introduced, the
    code will fail the unit tests, alerting you to potentially seriously dangerous
    bugs before they are discovered by accident or in the wild.


    By employing the strategies in the last section, you can also point out that unit
    testing does not necessarily require a significant outlay of time or capital to
    accomplish. Instead, by writing unit tests incrementally against the code base
    you already have, and writing them against new functionality that you are incorporating,
    you can show that unit testing can start right away, and incorporate future products
    and releases, without needing to write tests for your existing application''s
    code.


    # Unit Testing Improves the Quality of Software


    While we briefly touched on this in the section on saving money, unit testing
    improves software quality. Managers typically care about quality almost as much
    as they care about saving money; the end result is that you should be able to
    make a solid case for the quality of software being improved through the use of
    unit testing.


    Software quality is essentially a function of two things: first, how well the
    software meets the needs of the user, and secondly, how many bugs that user reports
    to the developer. There are some bugs that a user reports that will never be caught
    by unit tests. For example, user interface bugs or usability bugs will always
    be filed. However, bugs like "submitting the form doesn''t change the values"
    are things that you can test and resolve before the software ships.


    It is well known that users hate buggy software products; they refuse to use them,
    or mock them mercilessly. Microsoft learned this with the release of Microsoft
    Word; the release was terrible, full of bugs, and users hated it.


    When your product is full of bugs, your users will hate that product. The end
    result is that they will replace it, if they are able. Do not let that happen
    to you. By writing unit tests as bug reports come in and ahead of the bug reports,
    you will have the best opportunity to prevent bugs from being built into your
    system. You will be able to'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'store the data because you forgot to save it, rather than the client discovering
    it in production.


    Most unit tests take less than ten minutes by themselves but will result in huge
    improvements in code quality and customer retention. One retained customer is
    well worth the cost of every unit test written; thus, they are immensely valuable
    to retaining customers and improving the quality of your software.


    Unit tests also improve quality by helping prevent regressions. There is nothing
    more frustrating than reporting a bug, which is fixed, only to reappear in the
    next version of the product. Users begin to think you are asleep at the switch
    or don''t know what you''re doing; typically, neither is true, but the situation
    could have been prevented if you had only written a unit test for the previous
    bug. Why? Because if you had a unit test in place, it would have failed before
    the product shipped, facilitating a fix and preventing the bug from shipping in
    the first place.


    # Unit Tests Show Higher-Ups that Work Is Being Done


    Unit tests make a great way to show higher level managers the amount of work being
    completed. While bugs closed make for good metrics, sometimes you come across
    a large bug that has multiple components. If you have a feature request that is
    open for two weeks, and it is the only ticket closed in those two weeks, it can
    appear that the team hasn''t done anything. This is where your second metric comes
    in: the unit testing report.


    Because unit tests produce a report, you can show this report to higher level
    managers and show them the progress being made. Unit tests show which tests have
    passed and failed; if you write them ahead of time, you will know how far you
    have gotten because the unit tests will start to pass (they should all fail if
    you write them before you have written any other code). This means that even if
    the ticket stays open for two weeks, you can show steady progress towards completion.


    Unit tests also make a great way to show a product manager that something is not
    ready to ship yet - or prove that something is, in fact, ready to place into production.
    Because you can print out a unit test report that shows failing tests, your product
    manager can immediately know that the product is not perfect, in an unambiguous
    way. It is hard to compete with the output of a unit test report, and the product'
