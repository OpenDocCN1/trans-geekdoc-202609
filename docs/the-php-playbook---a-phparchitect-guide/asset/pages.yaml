    \n# ## Refactoring for Logic\n\nOur class is more properly abstracted, but how\
    \ robust is the logic used within the methods? Once an object has been properly\
    \ abstracted, it is easy to see and refactor the logic in the methods, to improve\
    \ their robustness and reduce the chance of errors, while improving error handling\
    \ when errors do crop up.\n\nThere are a number of logical problems with this\
    \ application. For example, the assumption is made that the object cannot be reused\
    \ once a tweet has been sent. In fact, if you were to try, the code designed to\
    \ append the URL would break.\n\nAlso, we insert the tweet into the database but\
    \ we do that prior to the tweet being successfully sent. There is no rollback,\
    \ and we are not using transactions here."
