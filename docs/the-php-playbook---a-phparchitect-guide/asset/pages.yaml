    that the conflict is a minor one that does not actually need resolution. However,
    developers are wise to skip resolving the conflict, and then resolve it using
    a text editor and reviewing the lines between the conflict markers.


    This is a bigger issue with Subversion than with Git, which does not offer the
    ability to just override the incoming copy with your own. Instead, it forces developers
    to merge the two copies together, and then add the file for committing to resolve
    the conflict.


    # Diff Each File Before Committing It and Commit Frequently


    Developers often forget that there can be situations where changes get made unintentionally
    - debugging code is added, verbosity is increased, or settings are changed. Before
    committing code, every developer should diff the files to be committed to ensure
    that the changes being sent are exactly what that developer wants to send.


    This is of course more difficult the more files there are to be committed. This
    leads into the second part of the rule: commit frequently. Small, individual commits
    are almost always preferable to large commits. If developers are concerned with
    breaking functionality or going down the wrong path with their code changes, they
    should branch. That is what branching is for.


    Some developers believe that code commits should be feature-complete. I disagree.
    Code commits should not break the application, but by no means need to be feature
    complete if being “feature complete” will take days or weeks. While developers
    should follow the rules against breaking the build they should commit small units
    of code that do not break the build regularly (even if the commit does not fully
    work).


    # Merge Frequently


    Anyone who uses Subversion with any regularity has experienced one of the greatest
    nightmares in history: a large merge from one branch to the trunk. And while Subversion
    has gotten better at this over time, merging frequently still helps developers
    prevent the issue of a large, complicated merge.'
