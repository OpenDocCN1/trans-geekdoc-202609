- pgno: 78
  md: '# Essential Subversion Syntax


    Subversion has a number of crucial commands that aid developers in using it properly.
    These few commands are essential for every developer using Subversion.


    It is important to note that with Subversion, all commands are prefixed with the
    svn executable name. Additionally, developers can get help by typing svn help
    and they can get help on a specific command by typing svn help < command>.


    # Getting a Working Copy


    In order to get a working copy, developers make use of the checkout command. Subversion
    works by creating a local copy of the current revision (or the specified revision).
    To get a copy of the latest revision, use the most basic version of the checkout


    ```

    svn checkout svn://path/to/repository

    ```


    Developers can specify the path for the checkout by adding a second, optional
    argument that specifies the path. If this second argument is absent, Subversion
    will create the working copy in the current working directory. Additionally, unless
    a trailing slash is added to the end of the repository path, the name of the directory
    in which all the files are created will be named whatever the last directory in
    the repository was. To check out a repository to a particular path, use the following
    command:


    ```

    svn checkout svn://path/to/repository /local/path/to/working/copy

    ```


    Finally, developers can check out their repository from a particular revision
    by adding an @REV option on the end:


    ```

    svn checkout svn://path/to/repository@123

    ```


    The above command would check out revision 123 to the local working directory.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# Keeping the Working Copy Updated


    From time to time, other developers may make revisions to the repository that
    are not reflected in your working copy. In order to maintain an up-to-date working
    copy, the update command should be used:


    ```

    svn update

    ```


    The svn help update command will display a number of options including updating
    to a particular revision, or updating only a particular part of the working copy.


    # Managing the Working Copy File Structure


    Subversion tracks changes to individual files: therefore, when moving or changing
    files and directories, it is important to tell Subversion what has been done,
    so that Subversion can associate the history with that move. Subversion mimics
    the file system commands on Linux and UNIX, by offering a copy, mv, rm and mkdir
    command.


    Each works similarly to the UNIX equivalent, and will make changes to the working
    copy’s change history, which will be committed on your next commit.


    # Committing Changes to the Repository


    You have made some changes to your working copy; great! They are ready to go live.
    How do we ensure that the changes you have made get committed? We can do so by
    making use of the status, add, and commit commands.


    When we have untracked files in our working copy, they show up with question marks
    next to them:


    ```

    $ svn status

    ?        example.txt

    ```


    In order to commit this file to the repository, we need to instruct Subversion
    to add this file:


    ```

    $ svn add example.txt

    A        example.txt

    ```'
