    # Never Rebase After Pushing


    This tip is for Git users, but is so important it bears inclusion in the rules
    of version control section in its own right. Git contains a feature, called rebase,
    which can be exceptionally powerful and used to literally rewrite the commit history
    of the repository. This power allows developers to squash commits together, change
    the commit message, or even change the files in the commits. It also allows developers
    to combine changesets without merging. This can be useful for bringing a particular
    branch back to a certain state.


    However, rebasing does not come without risk: in particular, when `git rebase`
    is run over a group of commits, it *rewrites those commits and the SHA1 commit
    ID*.


    This might not seem like a big deal, and in many cases it is not, unless the commits
    have already been pushed to another repository. Then it becomes a big deal because
    Git will be confused by the new commit IDs, and it will create serious problems
    for merging changes further down the road.


    Rebasing commits that have already been pushed is a serious mistake that will
    cause headaches to all the developers involved. Avoid it.


    # Do Not Simply Override Someone Else’s Changes During a Conflict


    From time to time, every developer experiences commits that conflict with their
    own work. This can be and sometimes is an extremely frustrating situation to fix,
    especially if the work done mirrors or closely relates to the work being committed
    by the developer. However, while it is easy to take advantage of Subversion’s
    option to simply override the conflict with your working copy, do not do this.'
