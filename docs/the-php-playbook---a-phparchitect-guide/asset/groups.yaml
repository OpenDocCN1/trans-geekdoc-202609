  mdcn: "\n如果我们想将克隆的仓库放在不同的位置，我们可以添加一个可选的文件路径作为第四个参数。\n\n开发者也可能想要创建一个空仓库，或在已有文件的目录中创建仓库。完成此任务很简单：开发者只需初始化仓库即可：\n\
    \n```\n$ git init sample\nInitialized empty Git repository in /Users/brandon/sample/.git/\n\
    ```\n\n这将创建目录和一个空的 Git 仓库。或者，如果你想在当前工作目录中创建 Git 仓库，只需调用 git init，仓库就会在当前工作目录中创建。\n\
    \n当然，使用初始化命令时 Git 假定开发者打算在目录中实际放置文件；因此它会创建一个名为 .git 的隐藏目录，并将仓库文件放在其中。然而，有时开发者可能只想初始化一个裸仓库——一个不包含文件的仓库。这在仓库仅用于推送和拉取的情况中很有用。要做到这一点，我们使用一个标志：\n\
    \n```\n$ git init --bare sample.git\nInitialized empty Git repository in /Users/brandon/sample.git/\n\
    ```\n\n请注意，隐藏的 .git 目录并未创建。检查文件系统会显示出与我们初始化的仓库不同的布局。\n\n## 使用远程仓库\n\n除非存储在其中的信息可以共享，否则\
    \ Git 并没有那么有用。为此，开发者设计了一套系统，可以从远程源“推送”和“拉取”提交，例如其他开发者、类似 Subversion 的中央服务器设置，甚至是名为\
    \ GitHub 的网络服务。不管怎样，使用远程仓库是一项关键技能。\n\n要使用远程仓库，首先必须将其添加为远程位置。为此，我们使用 git remote\
    \ 命令：\n\n```bash\n$ git remote add origin /path/to/remote\n```\n\n这里的语法很简单：我们告诉\
    \ remote 命令添加一个名为 `origin` 的别名，其文件路径为 `/path/to/remote`，这是一个远程仓库。\n\n一旦我们做了更改（稍后会详细介绍如何更改），我们就可以将这些更改“推送”到我们的远程仓库。我们使用\
