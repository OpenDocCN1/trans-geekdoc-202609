    \ 拥有一个非常强大的分支模型，可用于改进工作流程。分支是将版本控制系统指示为基本上复制当前文件结构的过程，以便可以在不影响主开发线或其他开发者的情况下添加或删除功能。分支可以即时创建，并且不一定会被推送到\
    \ master 仓库；分支可以是匿名的，也可以包含在提交中。\n\n要创建分支，用户可以使用 git branch 命令：\n\n## 稍后暂存更改\n\n\
    有时，我们可能还不准备将更改提交到仓库，但可能需要从其他用户那里拉取额外的更改，无论是从 Subversion 还是从另一个仓库。或者，我们可能正在 master\
    \ 上工作，需要将其恢复到已知状态，同时仍为将来保留我们的更改。\n\nGit 提供了一个名为 stash 的功能，允许我们将文件暂存到临时存储中，并在以后检索它们。\n\
    \n```\n$ git stash\nSaved working directory and index state WIP on master: 0adce2e\
    \ Adding new content.\nHEAD is now at 0adce2e Adding new content.\n```\n\nGit\
    \ 现在已将工作副本的更改暂存，并将目录恢复到 0adce2e 提交。我们现在可以自由地进行更改，并在准备好时查看已存在的暂存：\n\n```\n$ git\
    \ stash list\nstash@{0}: WIP on master: 0adce2e Adding new content.\n```\n\n这显示了我们可用的所有暂存。有多种方法可以访问暂存：我们可以弹出暂存或应用它。如果我们“弹出”暂存，我们会将其从列表中移除并应用更改；如果我们只是“应用”暂存，我们会应用更改同时保留暂存在暂存列表中。或者，我们也可以指示它应用特定的暂存（如果我们有多个）。\n\
    \n```\n$ git stash pop\n# On branch master\n# Changed but not updated:\n# (use\
    \ \"git add <file>...\" to update what will be committed)\n# (use \"git checkout\
    \ -- <file>...\" to discard changes in working directory)\n#\n# modified:  example.txt\n\
    #\nno changes added to commit (use \"git add\" and/or \"git commit -a\")\nDropped\
    \ refs/stash@{0} (a79efc499ea8fd6cec59adb5acb4ae2caa768ef3)\n```\n\n此命令应用了更改，然后向我们显示了工作目录的当前状态，并告诉我们暂存已被丢弃（因为我们使用了\
    \ `git stash pop`）。\n\n## 查看历史记录\n\n开发者经常想要查看提交日志或查看谁在哪个修订版中更改了什么。Git 在 `git log`\
