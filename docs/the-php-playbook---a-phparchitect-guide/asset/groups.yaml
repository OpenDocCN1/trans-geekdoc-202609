    \ 等都在使用它）。\n\nMemcached 还可以用于在 PHP 中存储会话。要做到这一点，只需更改 php.ini 文件中的以下几行（假设已安装 PHP\
    \ Memcached 支持）：\n\n```ini\nsession.save_handler = memcache\nsession.save_path\
    \ = \"tcp://127.0.0.1:11211\"\n```\n\n创建一个执行简单缓存操作的 Memcached 缓存类也非常容易。Memcached\
    \ 已被用于一些极其复杂的缓存场景，甚至包括完全绕过 PHP 来提供整个网页。\n\n请注意，下面的代码中，PHP 的 Memcached 扩展已经是面向对象的。提供包装类是为了演示功能，但开发者也可以直接使用\
    \ Memcached 对象（如果更喜欢的话）：\n\n```php\nclass Memcache_Cache {\n    protected $memcacheObj;\n\
