    Profiling is an extremely critical component of application development. Without
    profiling, an application developer who is trying to optimize is throwing darts
    in the dark with no ability to see where they are landing. In other words, optimizing
    without profiling is pretty much useless.


    We covered profiling in Chapter 1, when we talked about Xdebug. Once you have
    run the profiler on your application, you are in a much better position to understand
    what is happening and how to improve upon it. But any developer who has ever looked
    at a cachegrind.out file knows they are impossible for humans to read.


    In order to understand the cachegrind file, you will need to install an application
    that interprets it for you. Many applications exist, including KCachegrind for
    Linux and MacCallGrind for Mac (not free). These applications often create a visual
    representation of the cachegrind file, showing you the bottlenecks and explaining
    in vivid, visual terms what took the most time to execute. See Figure 3.1, which
    is a cachegrind output for WordPress.


    ![](img/1e822896c7e27b27bbae30ac1e4ebc2b_42_0.png)


    Figure 3.1


    This file shows the items in WordPress that took the longest to execute. Depending
    on your own cachegrind file, you will be able to see where the bottlenecks are,
    and be able to form a better picture about how to solve them.'
  - "[PAGE 43]\n\nProfiling allows us to know exactly what areas of our application\
    \ are bottlenecks. Without profiling first, we have no idea what areas of our\
    \ application actually need to be optimized. This can lead to a lot of frustration,\
    \ lots of refactoring that did not need to be done in the first place, and worst\
    \ case scenario, the introduction of bugs at the hands of those trying to optimize.\
    \ Profiling is a crucial component of developing an optimization strategy, and\
    \ it helps us to know exactly which areas to focus on, in much the same way a\
    \ surgeon uses diagnostic tests to know where to focus medical treatment.\n\n\
    As you begin to profile your applications, three areas will probably pop up as\
    \ the largest bottlenecks: the database, code executed inside repeated blocks\
    \ (like loops), and general code inefficiencies. Let's examine how to take care\
    \ of all three.\n\n# Optimizing Database Queries\n\nMany developers face an ever-present\
    \ challenge: their applications need to be dynamic, but more often than not the\
    \ database presents a challenge in the form of a bottleneck. Databases can only\
    \ handle so much information so quickly. The more information the database contains,\
    \ the longer it takes to execute even simple queries. But developers can do some\
    \ things to improve database performance.\n\nA developer’s most powerful weapon\
    \ against database slowness is the EXPLAIN SQL command. The most popular databases\
    \ for PHP developers (Postgres and MySQL) implement EXPLAIN; this means that regardless\
    \ of platform, developers can understand how their SQL queries work.\n\nEXPLAIN\
    \ works by displaying how the database engine intends to attack a particular problem.\
    \ It will show information about joins, indices, logic, inefficiencies and other\
    \ important items that can help improve performance.\n\nImagine that you are building\
    \ an application with a simple LEFT JOIN, which is running inefficiently. Your\
    \ SQL query is as follows:\n\n```\nSELECT * FROM guests LEFT JOIN record ON record.id\
    \ = guests.id WHERE guests.\n    firstname = \"Pete\";\n```\n\nThis query runs\
    \ slowly against your large table, and you need to figure out why. In order to\
    \ determine how the query is being executed, we add the word EXPLAIN on the front\
    \ of the query:"
