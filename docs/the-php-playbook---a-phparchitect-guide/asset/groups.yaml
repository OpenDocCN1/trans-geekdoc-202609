  - '[PAGE 147]


    built, and *how* it will function. Therefore, an annotated wireframe is technically
    a complete specification, provided it highlights the demands, desires and needs
    of the individuals compiling it.


    I have worked on many teams before: the “we don’t have a plan; let’s go by the
    seat of our pants and do ''agile''”, as well as the “here’s a long tome that compiles
    all of our needs and took six months to write.” In my experience, the easiest
    teams to work on were the ones who said “here’s a wireframe, build this.” It makes
    it easier to innovate (because the developer decides how the button works and
    what features to add) while also making it easy to deliver a useful product to
    the rest of the team.


    Development requires some degree of planning. Failing to plan is planning to fail.
    Developers should insist on a basic level of spec development, even if it is a
    complete wireframe.


    # Effective Issue Tracking


    Think back quickly to your first project: how much do you remember about the way
    you implemented it or the bugs you found but never fixed? Chances are good there
    is a limited amount of memory devoted to that particular project. In fact, it
    is possible you may not even remember (or care to remember) it at all.


    The reality is that human beings can only remember so much. Studies show we can
    only do a few things at a time, and when we start doing more than one our attention
    to all of them takes a hit. Given our imperfect ability to remember things, it
    is of vital importance that we learn to write things down to aid in our memories.


    Nowhere is this more important than in the tracking of issues, feature requests
    and bugs associated with our products. Consider: it is possible that for a medium-sized
    project there may be 100 outstanding bugs, tasks and feature requests. No one
    person, no matter their memory skills, can remember them all, resulting in issues
    going unresolved into future releases.


    Effective bug tracking is a key component of being a happy developer. Once all
    issues are dumped into a tracker of some kind the mind is freed to start working
    on other things, one at a time. Furthermore, tracking issues is like creating
    shared memory: it is possible to share the issues with other developers, who can
    address them, improving productivity and reducing the workload.'
