    \ extent. While some new features may be added (like the ability to configure\
    \ the HTTP object, for example), for the most part the outcome remains the same.\
    \ But this object will be better off for the work done, and developers who employ\
    \ refactoring as a regular tool will experience great benefits.\n\n## Chapter\
    \ 8\n\n## Worst Practices\n\nFirst, let's get these out of the way:\n\n- Spaghetti\
    \ code\n- References\n- Too much OOP\n- 80/20 rule micro optimization\n\nDevelopers\
    \ tend to focus on “best practices” as a way to help improve development and get\
    \ everyone on the same page. These best practices are a great way to highlight\
    \ development practices that should be employed. But what practices are explicitly\
    \ bad for development?\n\nThis chapter focuses on these practices and highlights\
    \ the ways in which they are both bad and can be improved upon. We focus on the\
    \ reasons why security should be a part of your application from the ground up,\
    \ talk about how many developers spend too much time coding and not enough time\
    \ designing, expose not-invented-here syndrome and talk about style guides for\
    \ applications.\n\n## Thinking Security Is for When an Application is Finished\n\
    \n“I’ll just finish writing the application, then I’ll make it secure.” Sound\
    \ familiar? This is a common thread in development for many. Security is secondary\
    \ in their minds to\n\ngetting a working prototype assembled and demonstrated.\
    \ This can be for a variety of reasons: they do not care to focus on security,\
    \ or the deadline for the prototype is extremely tight, or they simply do not\
    \ understand the value that security adds to the picture.\n\nDeveloping security\
    \ last, though, is a dangerous practice because it undermines the entire concept\
    \ of security. It ensures that when you go through your application to “add” security\
    \ later, inevitably you are going to miss something. You might miss adding security\
    \ at the database layer or at the view layer or somewhere else in your application.\
    \ These are poor security practices that can and should be avoided.\n\nSecurity\
    \ should be included from the architecture phase all the way up through the demonstration\
    \ phase. Good developers might even include security as one of the items demoed\
    \ to a client or to an internal team before an application can be declared to\
    \ be “ready” for production.\n\nWhen writing individual portions of the application,\
    \ a good deal of time should be spent determining what security must be included\
    \ and how to implement that security.\n\nDuring the architecture phase, an application\
    \ developer should determine what security measures will be necessary, and how\
    \ they will work together to provide overall security for the application. It\
    \ is at this stage that one can determine when and where to place the security\
    \ checks, which security checks to enforce, and how best to protect the application\
    \ from malicious users.\n\nWhen designing the database layer, protections against\
    \ SQL injection should be undertaken by the development team. A consideration\
    \ of where data is coming from and how it is being used should also play into\
    \ the decisions made at this stage, whether the data is coming from internal (generally\
    \ safer) sources, or is user-supplied (and wholly unsafe). These decisions will\
    \ largely rest on the architectural design supplied in the first phases of development.\n\
    \nMoving on to the user interface development, there are two unique protections\
    \ that should be undertaken here: what Chris Shiflett calls “Filter Input, Escape\
    \ Output”. First, any input submitted by the user must be filtered for a specific\
    \ set of criteria that is unacceptable - HTML, injection possibilities (usually\
    \ handled at the database layer), invalid data (alpha characters where numeric\
    \ characters are expected, non-emails where email addresses are required), and\
    \ other checks.\n\nThese checks should always be done on the server side (despite\
    \ the popularity of JavaScript-based validation, which can be used to provide\
    \ immediate feedback if so desired). Next, it is critical to escape output - anything\
    \ that was not screened for or filtered out should be rendered harmless at this\
    \ point. This means converting any missed HTML to harmless HTML, ensuring that\
    \ XSS attacks are not possible, and neutralizing other types of attacks.\n\nThere\
    \ are also areas that are often overlooked that should be addressed. One of those\
    \ areas is in session protection. It is critical to design sessions to be protected\
    \ against session hijacking, by verifying sessions, changing session IDs after\
    \ permissions elevation, considering checking User-Agent headers, and other standard\
    \ protections.\n\nAdditionally, standard practices like requiring a password to\
    \ change sensitive settings or the password itself, and using HTTPS connections\
    \ for security-related data are essential components of your security model.\n\
    \nIt should be obvious by this point that planning to incorporate security at\
    \ the conclusion of development presents extreme challenges. Many of these security\
    \ changes would require significant code revision; some would require the additional\
    \ work of designers and testers, ensuring a second round of development. While\
    \ it is likely that a second round will be necessary to make adjustments requested\
    \ by clients or product managers, this still requires significant refactoring.\n\
    \nDeveloping with a security mindset instead ensures that security will be included\
    \ in each step, helping to eliminate the chances that something will be missed.\
    \ While it is impossible to guarantee that every security hole is closed, developing\
    \ with security in mind, rather than as an afterthought, helps make sure that\
    \ many are in fact closed, and improves the overall security of your application.\n\
    \n## Spending Too Much Time Coding, Not Enough Time Designing\n\nDevelopers enjoy\
    \ writing code and presenting a solution that is expressed as a finished product.\
    \ They would rather write code than write specs. This component of developer behavior\
    \ makes the design process hard on them, because they have a hard time putting\
    \ their thoughts in writing or coming up with ideas that are not expressed in\
    \ some sort of code.\n"
