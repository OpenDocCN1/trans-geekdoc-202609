- raw:
  - '[PAGE 83]


    we wanted to have the cloned repository in a different location, we could add
    an optional file path as a fourth argument.


    Developers may also want to create an empty repository, or create a repository
    in a directory that already has files. This is an easy task to complete: developers
    need only to initialize the repository:


    ```

    $ git init sample

    Initialized empty Git repository in /Users/brandon/sample/.git/

    ```


    This creates the directory and an empty Git repository. Alternatively, if you
    want to create a Git repository in the current working directory, simply call
    git init and the repository will be created on the present working directory.


    Of course, Git assumes with the initialize command that the developer intends
    to actually place files inside the directory; thus it creates a hidden directory,
    called .git, and places the repository files inside of that. However, from time
    to time the developers may just wish to initialize a bare repository - one that
    will contain no files. This is useful in situations where the repository will
    simply be pushed to and pulled from. To do this, we use a flag:


    ```

    $ git init --bare sample.git

    Initialized empty Git repository in /Users/brandon/sample.git/

    ```


    Note that the hidden .git directory was not created. Examining the file system
    will show us a layout which differs from our initialized repository.


    # Using a Remote Repository


    Git is not as useful unless the information stored in it can be shared. To that
    end, developers have devised a system whereby commits can be “pushed” and “pulled”
    from remote sources, such as other developers, a central server setup similar
    to Subversion, or even a web service called Github. Whatever the case may be,
    working with remote repositories is a critical skill.


    To work with a remote repository, it must first be added as a remote location.
    To do this, we use the git remote command:'
  - "[PAGE 84]\n\n```\n```bash\n$ git remote add origin /path/to/remote\n```\n```\n\
    \nThe syntax here is pretty simple: we tell the remote command to add an alias\
