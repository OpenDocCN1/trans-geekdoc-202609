    # Handling Errors with PHP


    One of the biggest mistakes any PHP developer can make is not developing with
    `display_errors` turned on, and without `error_reporting` set to `E_ALL | E_STRICT`.
    These two settings, in tandem, help developers to identify and resolve errors
    before they make it into production or are discovered in testing.


    Each of these settings can be set in the `php.ini` file, or in an `.htaccess`
    file or even on a file basis. However, for consistency and good development practice,
    developers should set these globally in their `php.ini` files.


    Another mistake that developers often make is not logging errors, either in development
    or in production. Error logs are vital sources of information when something goes
    wrong; they can often be the difference between a quick diagnosis of a problem
    and hours of headache and downtime. Descriptive error messages are an invaluable
    source of information.


    There are three settings that developers should focus on in their `php.ini` files:
    `display_errors`, `error_reporting` and `error_log`. The `display_errors` directive
    should be set to ON during development and OFF in production. Developers should
    have `error_reporting` set to `E_ALL | E_STRICT` in order to see all errors, including
    notices and coding standard violations. Finally, `error_log` should be directed
    to a location where there is a writable PHP error log, which will track errors.


    Many developers turn on `E_ALL | E_STRICT`, realize the vast number of notices
    and coding violations in their applications, and quickly turn it off, figuring
    their code works, so clearly these issues need not be corrected. But this is a
    huge mistake. While the majority of notices are benign, from time to time crucial
    clues about larger bugs pop up first in notices, before resulting in fatal errors.
    Turning off this feature and not resolving notices in code leads to bigger problems
    down the road, and may even be contributing to existing bugs in existing applications.


    Once code enters production, developers should turn `display_errors` to OFF, so
    that attackers cannot glean crucial server and code information from displayed
    errors. However, this makes logging the errors even more important; I often use
    a separate error log for each virtual host. Finally, developers can relax their
    `error_reporting`'
