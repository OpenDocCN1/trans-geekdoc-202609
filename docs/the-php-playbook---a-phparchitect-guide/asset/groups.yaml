    # ## Rules of Version Control


    Version control can be a double-edged sword, with benefits on one side but danger
    and difficulty on the other. Understanding the hard and fast rules of version
    control etiquette is essential to effectively using it as a member of a team,
    and enjoying the teamwork and collaboration that comes with version control.


    These rules are general etiquette tips to help developers be successful at using
    version control with others.


    # ## Always Include a Useful Commit Message


    A commit message of “added stuff” does not help anyone understand the work that
    was done. In fact, it is antithetical to the goals of version control: communicating
    changes over time to a group of individuals who did not make those changes.


    Commit messages should be as descriptive as possible for understanding what was
    accomplished in a particular revision. A commit message that states “revised'
  - '[PAGE 91]


    execute() method to incorporate changes listed in Ticket #3271” is much more descriptive
    and provides a developer who is investigating a changeset a clear and concise
    understanding of the change that was made, and the reasons for it (which are probably
    in Ticket #3271).


    Some companies enforce the rule of descriptive commit messages by forcing a linkage
    between a ticket and a commit. This is a good option for those who are concerned
    with whether or not commit messages will adequately describe the changes made.


    Some tools are focused around the subject/body structure of writing commit messages
    (Git has many tools like this). Whatever the convention, enforced or expected,
    it is a great idea to be complete and comprehensive in a commit message and to
    follow the expected convention, in order to aid others.


    # Do Not Break the Build


    A continual frustration for developers is to update their working copy, only to
    discover that the last developer to make a commit included a syntax or otherwise
    fatal error in the code, and then left for the day. This shuts down production
    until the issue can be resolved, and if the issue is related to something both
    developers were working on, the problem only gets worse from there.


    Do not be the guy who “breaks the build” by including syntax errors, or not communicating
    clearly about the changes made that will affect everyone. Many companies institute
    pre-commit hooks that test for syntax and refuse to commit code that contains
    syntax errors, but it is still possible to break the build with database changes
    or syntactically-correct but incorrect code implementation.


    Test your code before you commit it, and communicate well with your development
    team. Also, consider continuous integration, which when used properly can help
    alleviate some of these concerns (because it “builds” the code, and runs the unit
    tests against it right away).


    # Update Your Code Base Often from the Repository


    If you are using Subversion, run svn up frequently. If you are using Git, use
    git pull origin master with some regularity to keep your code base up to date.
    This is critical, for two reasons:'
  - '[PAGE 92]


    First, it is important for you to have a good idea what other developers are doing.
    Changes to the code might just change how you develop particular features or design
    an aspect of the product. Second, failing to update regularly only heightens the
    likelihood that a conflict will occur later on.


    Small conflicts are easy to deal with, but large conflicts are extremely hard
    to manage because they often involve large sections of the code and contain nuanced
    changes that require some time to understand. The worst conflict I ever dealt
    with was committing at the end of the project. The **entire file** was a conflict
    because I had not updated my code base consistently.


    # Never Rebase After Pushing


    This tip is for Git users, but is so important it bears inclusion in the rules
    of version control section in its own right. Git contains a feature, called rebase,
    which can be exceptionally powerful and used to literally rewrite the commit history
    of the repository. This power allows developers to squash commits together, change
    the commit message, or even change the files in the commits. It also allows developers
    to combine changesets without merging. This can be useful for bringing a particular
    branch back to a certain state.


    However, rebasing does not come without risk: in particular, when `git rebase`
    is run over a group of commits, it *rewrites those commits and the SHA1 commit
    ID*.


    This might not seem like a big deal, and in many cases it is not, unless the commits
    have already been pushed to another repository. Then it becomes a big deal because
    Git will be confused by the new commit IDs, and it will create serious problems
    for merging changes further down the road.


    Rebasing commits that have already been pushed is a serious mistake that will
    cause headaches to all the developers involved. Avoid it.


    # Do Not Simply Override Someone Else’s Changes During a Conflict


    From time to time, every developer experiences commits that conflict with their
    own work. This can be and sometimes is an extremely frustrating situation to fix,
    especially if the work done mirrors or closely relates to the work being committed
    by the developer. However, while it is easy to take advantage of Subversion’s
    option to simply override the conflict with your working copy, do not do this.'
  - '[PAGE 93]


    This might seem like an obvious point, but it is not. It is especially not obvious
    when a developer does a quick look to see what the conflict is and concludes that
    the conflict is a minor one that does not actually need resolution. However, developers
    are wise to skip resolving the conflict, and then resolve it using a text editor
    and reviewing the lines between the conflict markers.


    This is a bigger issue with Subversion than with Git, which does not offer the
    ability to just override the incoming copy with your own. Instead, it forces developers
    to merge the two copies together, and then add the file for committing to resolve
    the conflict.


    # Diff Each File Before Committing It and Commit Frequently


    Developers often forget that there can be situations where changes get made unintentionally
    - debugging code is added, verbosity is increased, or settings are changed. Before
    committing code, every developer should diff the files to be committed to ensure
    that the changes being sent are exactly what that developer wants to send.


    This is of course more difficult the more files there are to be committed. This
    leads into the second part of the rule: commit frequently. Small, individual commits
    are almost always preferable to large commits. If developers are concerned with
    breaking functionality or going down the wrong path with their code changes, they
    should branch. That is what branching is for.


    Some developers believe that code commits should be feature-complete. I disagree.
    Code commits should not break the application, but by no means need to be feature
    complete if being “feature complete” will take days or weeks. While developers
    should follow the rules against breaking the build they should commit small units
    of code that do not break the build regularly (even if the commit does not fully
    work).


    # Merge Frequently


    Anyone who uses Subversion with any regularity has experienced one of the greatest
    nightmares in history: a large merge from one branch to the trunk. And while Subversion
    has gotten better at this over time, merging frequently still helps developers
    prevent the issue of a large, complicated merge.'
