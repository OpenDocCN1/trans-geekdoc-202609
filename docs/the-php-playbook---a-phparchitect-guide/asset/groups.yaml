    ## Chapter 1: Debugging PHP Projects


    ### Introduction to Debugging


    Every developer makes mistakes. The reality is that no developer is perfect; in
    fact, some statistics say that there is one bug for every seven lines of code
    in some projects. This astronomically high rate of bugs should not give developers
    permission to be sloppy, but should inform them that bugs in fact exist, and are
    something that they will never get away from completely.


    Bugs are introduced when mistaken assumptions are used to write code, or an incomplete
    understanding of the task at hand causes development of a feature that is incompatible
    with its intended use. Bugs can also be syntax errors or incorrect logic. Every
    developer experiences bugs of all shapes and sizes in the development process,
    from small syntax errors to large sections of code that require refactoring to
    resolve.


    Having a solid toolkit, then, is essential to every developer. Being able to resolve
    bugs, and debug their own code is the difference between a mediocre programmer
    and an excellent one.


    PHP developers have an advantage over traditional software developers in that
    PHP developers need not wait for their code to be run through a compiler before
    discovering a programming error. In fact, PHP developers have the ability to compile
    their code on demand, test it instantly, and resolve bugs as they work. This,
    combined with the Xdebug extension for PHP, means developers of PHP applications
    are well-equipped to identify and squash bugs before they make it to production.


    ### Introduction to Xdebug


    The main tool of choice for this chapter is an extension called Xdebug¹, and it
    is freely available and maintained by Derick Rethans. Why did we choose Xdebug
    as our debugger of choice?


    Simply put, Xdebug is far superior to any debugging product on the market today.
    Xdebug offers a great collection of features, including the ability to output
    variables, trace functions, profile an application and provide useful stack traces
    along with error messages.


    Xdebug has a vibrant community and is actively maintained, which provides it credibility
    and ensures that it remains useful and compatible with future releases of PHP.
    Its comprehensive configuration options also help developers customize it to meet
    their individual needs.


    ### Installing Xdebug


    In order to make use of Xdebug, it must be installed. For most users, Xdebug can
    be compiled from source, or it can be installed via the PECL package manager (the
    recommended and preferred method for installing Xdebug). Here are installation
    instructions for various operating systems:


    #### Windows Users


    Windows users can install pre-packaged binaries² and follow the installation instructions
    located on the Xdebug website³.


    #### Linux and Mac Users


    Users of Linux and Mac computers should install Xdebug through the PECL package
    manager.


    To use the PECL package manager, make sure you are root (or execute the commands
    as root). The following command will successfully install Xdebug:


    ```bash

    # pecl install xdebug

    ```


    Once PECL has finished installing it, you must add the extension to the php.ini
    file. Ignore PECL''s prompts to add xdebug.so to the INI file, as doing so will
    create problems later on; instead add the following line to your php.ini file:


    ```ini

    zend_extension="/usr/local/php/modules/xdebug.so"

    ```


    Be sure to correct the path to the module with the path for your system.


    ### Installing Xdebug from Source


    For those who want to configure Xdebug from source, instructions are available
    on the Xdebug website⁴.


    ### Xdebug Configuration Options


    Xdebug offers a great number of configuration options, all of which are documented
    on the Xdebug website⁵. These options allow for the control of just about everything,
    from whether or not Xdebug overloads the var_dump() function to how many nested
    levels of an array are printed.


    ### Variable Output Configuration Options


    `xdebug.overload_var_dump`


    By default, Xdebug overloads the `var_dump()` function. If you determine that
    you want to turn off the Xdebug overloading, it is still possible to print the
    Xdebug `var_dump()` with a special function called `xdebug_var_dump()`.


    `xdebug.var_display_max_children`


    This setting controls how many keys or properties are shown during a `var_dump()`
    or similar function usage. The default value is


