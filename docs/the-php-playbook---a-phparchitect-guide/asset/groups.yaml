    Adding web servers increases the challenges faced by a developer, for several
    reasons. First, they must identify a way to balance traffic coming into each web
    server, usually with a third machine known as a load balancer. This machine’s
    sole purpose is to divert traffic to a particular machine, and can be configured
    in a number of ways.


    However, when implementing a load balancer, developers have to be careful, especially
    with local machine file system or memory operations. For example, if the web server
    also has a Memcached server on it that is storing sessions in memory, in a load
    balanced environment there is no guarantee that the user will be redirected back
    to that particular server on the next request. This also applies to file uploads
    and other activities that affect the memory or disk of the local machine; thus,
    it becomes increasingly important that developers use a CDN or other method for
    sharing common files across servers.


    Adding web servers - especially a lot of them - increases the difficulty involved
    in deploying new code as well. Since it is possible that users can be directed
    to a different web server on each request, having only half updated at the time
    of a user’s request could result in them seeing very different code bases (or
    their session containing incorrect information for the particular environment).
    It is thus important to solve deployment issues right away.


    Still, when adding web servers, there is a definite mark of accomplishment, as
    this means a site has grown to the point where additional resources are necessary.
    Unlike database servers, where it is common to have more than one, web servers
    are not always needed, and adding a second web server is a sure sign of progress
    for any website.


    # The Benefits of Expanding Hardware


    Adding hardware has some additional benefits. With more than one server, there
    is failover in the event that a particular system goes down. This redundancy is
    built in to the idea of adding additional hardware and so long as the master database
    server does not go down, the application can continue operating without a hitch.


    When larger organizations add hardware, they may have the ability to specify the
    technical requirements of that hardware. Being able to require that hardware have
    certain technical specifications allows an organization to tailor their hardware
