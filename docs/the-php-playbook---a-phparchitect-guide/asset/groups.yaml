  mdcn: "\n\n## Subversion 基本语法\n\nSubversion 拥有许多关键命令，可帮助开发者正确使用它。对于每位使用 Subversion\
    \ 的开发者而言，这些为数不多的命令都是必不可少的。\n\n需要特别注意的是，在 Subversion 中，所有命令都以 `svn` 可执行文件名作为前缀。此外，开发者可以通过输入\
    \ `svn help` 获取帮助，也可以通过输入 `svn help <command>` 获取特定命令的帮助。\n\n### 获取工作副本\n\n为了获取工作副本，开发者会使用\
    \ checkout 命令。Subversion 通过创建当前修订版（或指定修订版）的本地副本来工作。要获取最新修订版的副本，请使用最基本形式的 checkout：\n\
    \n```text\nsvn checkout svn://path/to/repository\n```\n\n开发者可以通过添加一个可选的第二个参数来指定\
    \ checkout 的路径。如果省略第二个参数，Subversion 将在当前工作目录中创建工作副本。此外，如果没有在仓库路径末尾添加尾部斜杠，则存放所有文件的目录名称将与仓库中的最后一个目录名称相同。要将仓库检出到特定路径，请使用以下命令：\n\
    \n```text\nsvn checkout svn://path/to/repository /local/path/to/working/copy\n\
    ```\n\n最后，开发者可以通过在末尾添加 `@REV` 选项来从特定修订版检出仓库：\n\n```text\nsvn checkout svn://path/to/repository@123\n\
    ```\n\n上面的命令会将第 123 修订版检出到本地工作目录。\n\n### 保持工作副本更新\n\n有时，其他开发者对仓库所做的修改可能不会反映到您的工作副本中。为了保持工作副本最新，应使用\
    \ update 命令：\n\n```text\nsvn update\n```\n\n`svn help update` 命令将显示许多选项，包括更新到特定修订版，或仅更新工作副本的特定部分。\n\
    \n### 管理工作副本的文件结构\n\nSubversion 会跟踪单个文件的更改：因此，在移动或更改文件和目录时，必须告诉 Subversion 已执行了什么操作，以便\
    \ Subversion 能将历史记录与该移动关联起来。Subversion 通过提供 `copy`、`mv`、`rm` 和 `mkdir` 命令来模拟 Linux\
    \ 和 UNIX 上的文件系统命令。\n\n每个命令的工作方式与 UNIX 中的对应命令类似，并且会更改工作副本的变更历史，这些更改将在您下次提交时一并提交。\n\
    \n### 将更改提交到仓库\n\n您已经对工作副本做了一些更改，太棒了！这些更改已经可以上线了。我们如何确保所做的更改被提交呢？可以使用 `status`、`add`\
    \ 和 `commit` 命令。\n\n当工作副本中有未跟踪的文件时，它们旁边会显示问号：\n\n```text\n$ svn status\n?    \
    \    example.txt\n```\n\n要将此文件提交到仓库，我们需要指示 Subversion 添加此文件：\n\n```text\n$ svn\
    \ add example.txt\nA        example.txt\n```\n\n请注意，现在 example.txt 文件旁边出现了一个“A”。这表示该文件已暂存待提交。接下来，我们可以提交此文件：\n\
    \n```text\n$ svn commit -m \"Initial commit.\"\nAdding        example.txt\nTransmitting\
    \ file data .\nCommitted revision 1.\n```\n\n请注意，我向此仓库提交了第一个修订版。还要注意我在提交时使用的 `-m`\
    \ 标志：它向 Subversion 表明我们要添加一条提交信息。开发者应始终在提交时附带提交信息。对于大多数仓库，如果没有提供提交信息，系统会提示您在自己选择的编辑器中设置一条。\n\
    \n现在假设我们对 example.txt 文件做了一系列更改，然后再次运行 `svn status`：\n\n```text\n$ svn status\n\
    M           example.txt\n```\n\n现在文件旁边有一个“M”，表示自上次提交以来它已被更改。我们不再需要运行 `svn add`\
    \ 命令。由于该文件受 Subversion 跟踪，它将在我们下次提交时自动被提交。\n\n假设对 example.txt 所做的更改并不合适或存在错误。我们不必提交这些更改，而是可以使用\
    \ `svn revert` 将其回滚：\n\n```text\n$ svn revert example.txt\nReverted 'example.txt'\n\
    ```\n\n现在执行 `svn status` 命令会显示一个干净的工作副本：\n\n```text\n$ svn status\n$\n```\n\n\
    可以将文件恢复到特定修订版。有关此操作方式的更多文档，请参阅 `svn help revert` 命令。\n\n### 查看历史记录\n\n开发者有时希望查看针对仓库进行了哪些提交。开发者可以使用\
    \ `svn log` 命令查看提交历史：\n\n```text\n$ svn log\n------------------------------------------------------------------------\n\
    r70 | brandon | 2009-11-30 20:32:40 -0500 (Mon, 30 Nov 2009) | 1 line\n\nMoving\
    \ everything into trunk.\n------------------------------------------------------------------------\n\
    r69 | brandon | 2009-11-30 20:29:12 -0500 (Mon, 30 Nov 2009) | 1 line\n\nRemoving\
    \ lib; it’s an external and should not have been moved.\n------------------------------------------------------------------------\n\
    r68 | brandon | 2009-11-30 20:27:26 -0500 (Mon, 30 Nov 2009) | 1 line\n\nUpdating\
    \ the repo.\n------------------------------------------------------------------------\n\
    r67 | brandon | 2009-11-30 20:25:28 -0500 (Mon, 30 Nov 2009) | 1 line\n\nAdding\
    \ trunk directory.\n------------------------------------------------------------------------\n\
    ```\n\n`svn log` 命令有助于查看提交信息，并且具有许多实用功能，例如限制修订版号和查看大量附加数据：\n\n```text\n$ svn log\
    \ -l 1 -v\n------------------------------------------------------------------------\n\
    r70 | brandon | 2009-11-30 20:32:40 -0500 (Mon, 30 Nov 2009) | 1 line\nChanged\
    \ paths:\n   M /financials\n   D /financials/files\n   D /financials/install\n\
    \   D /financials/logs\n   M /financials/trunk\n   A /financials/trunk/webapp\
    \ (from /financials/webapp:69)\n   D /financials/webapp\n\nMoving everything into\
    \ trunk.\n------------------------------------------------------------------------\n\
    ```\n\n例如，在上述命令中，我们将输出限制为一个条目（即最后一个修订版），并要求其详细输出，从而列出该特定提交中更改的文件。\n\nSubversion\
    \ 还使得查看*谁*更改了文件，以及实际上*哪些行*被更改变得很容易。此命令有几个别名：`blame`、`praise` 和 `annotate`。其目的是显示文件的每一行，以及负责编辑该行的用户。\n\
    \n```text\n$ svn annotate example.txt\n    2    brandon Lots of new changes.\n\
    ```\n\n这表明在第 2 修订版中，用户 “brandon”（就是我）将第一行更改为了 “Lots of new changes.”。这对于确定代码中\
    \ bug 的引入时间、位置和责任人，或逐行查看用户所做的更改非常有用。\n\n## Git 基本语法\n\n与 Subversion 一样，Git 也有许多命令可帮助开发者正确使用它。\n\
    \n### 设置新的 Git 仓库\n\n获取新的 Git 仓库有两种方式：克隆现有的 Git 仓库，或在当前目录中初始化一个仓库。\n\n要克隆仓库，我们使用\
