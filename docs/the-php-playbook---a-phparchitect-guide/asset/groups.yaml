    # Chapter 5


    # Caching techniques


    # What is Caching?


    As primarily a language for the web, PHP’s design is that of a “shared nothing”
    architecture. The HTTP protocol is stateless, meaning that no information is retained
    about the state of an application when a page is served. These two things together
    mean that for data-driven sites, there is no built-in ability to preserve information
    about logins, data retrieved, user information or other information that should
    persist between requests.


    Since the beginning of the internet, then, developers have worked to solve this
    “stateless” problem. Most developers already solve much of it, by using sessions
    (which write information to the server and use a key to access it), cookies (which
    is how the session key is usually stored on a user’s system), and databases (which
    preserve application data in physical, permanent storage). Working in concert,
    these items help preserve the “state” of an application for future requests; helping
    users to enjoy a more seamless and meaningful experience on the web.


    Of course, these are fairly primitive solutions that are not always the most efficient
    and effective. Querying the database on each request, for example, can be a difficult
    and strenuous task, especially for high traffic sites. In the last chapter we
    talked about boosting performance, but did not focus on how we can reduce the
    load of each request. This chapter focuses on reducing that load through caching.'
  - '[PAGE 62]


    Caching is the storage of often needed, but infrequently changing data in its
    final or near-final state for easy retrieval and use within an application. Examining
    each part of this definition we find three parts:


    Part 1: “...often needed, but infrequently changing data...” Many applications
    have large pieces of information that are needed on each request, but do not change
    very often. This ranges from the user''s personal information to a list of blog
    posts. If the information changes frequently, it must be refreshed frequently,
    which makes caching ineffective for reducing the load on each request.


    Part 2: “...data in its final or near-final state...” A big emphasis in caching
    the data is that we reduce the load on the server as much as possible on subsequent
    requests. Therefore, storing the data in an unfinished or processing-needed state
    reduces the efficacy of our cache. Often, data is preserved in a cache in a state
    that requires no processing at all, other than display formatting. This is relatively
    simple for the server to send back to the user.


    Part 3: “...for easy retrieval and use within an application.” Caching should
    simply be easy to use. Complicated methods for obtaining cached data are often
    slow, and certainly cumbersome, which will prevent a team from making use of them.
    When using a cache, developers owe it to themselves to make it easy to get the
    information, serve it, and move on to the next request.


    # Rules for Caching


    Before moving into the types of caches and their individual benefits, it is important
    to establish some ground rules for caching. There are five crucial rules that
    must be followed when considering caching, in order for caching to be an effective
    tool in a developer''s toolkit.


    # Cache only infrequently changing information


    While at first glance this rule might appear to be obvious, it reminds us of an
    important point: cached data is supposed to stick around for a while. Whether
    that time period is ten minutes, an hour or a week, cached data is meant to be
    preserved.


    A good guideline is that if the data will be invalid after only a few requests,
    it is better to load it rather than caching it. Data that is going to be the same
    for many requests or even for an entire user''s session can safely be cached.'
  - '[PAGE 63]


    # Do not cache information that could lead to a security problem


    When caching data, particularly user data, it is important to consider the security
    implications of that caching choice. For example, if a user’s permissions are
    cached until the end of the session, it is possible that the user’s rights might
    be revoked but that the change may not be reflected immediately. This can create
    a security problem.


    This is not to say that no user data should ever be cached; that would be an impractical
    and foolish assertion. Instead, when using caching it is critical that each developer
    determine the security policy they wish to employ and, with regards to protecting
    the integrity of the application, know the tradeoffs they are making when caching
    certain pieces of data. Developers can employ a variety of techniques to secure
    their applications (displaying the “Delete User” page, but confirming that the
    user deleting another user still has those rights when the delete behavior is
    invoked, for example).


    # Remember that caching is a bit of black magic


    Luke Welling put it best in a tweet when he said “Any sufficiently complex caching
    infrastructure is indistinguishable from black magic.” And he is right: any caching
    system is designed to provide data almost “magically”, inserting information without
    processing it or checking to see if it is still valid.


    Debugging caching problems can be a hairy process for this reason. Developers
    should therefore build their caching infrastructures carefully, with debugging
    tools designed in (e.g. a key that indicates the results set was cached) in such
    a way that fixing cache-related bugs can be resolved easily.


    Developers should also work to develop with caching turned off, for the most part,
    to help ensure that their code actually functions properly (instead of them getting
    lucky and caching the results). Developing with caching on (APC included) can
    create difficulties down the road.'
  - '[PAGE 64]


    # Always Have a Backup Plan


    Sometimes caches make development too easy, so easy that developers forget that
    the cache data might not be there one day. This can lead to catastrophic application
    failure, strange bugs, and lots of difficult debugging.


    Cached data is transient. This means that developers should never expect it to
    be there. Instead, they should prefer that it be there, but always have a backup
    mechanism in place to retrieve that data from whatever source it originally was
    stored in.


    On that note, due to a cache''s transient nature, they are not to be considered
    permanent storage. Developers should always use a backup data storage method -
    the file system, a database, or some other tried-and-true storage engine. A generic
    rule of thumb is that data in a cache should never exist only in the cache; it
    should always have come from somewhere stable.


    # Make Sure the Cache Has a Built-in Expiration Date


    Cache data should be transient and refreshed at regular intervals. Obviously,
    certain data is more persistent than other pieces of data, but in the end, all
    cached data expires at some point: therefore, so should the cache.


    Old data should automatically be removed from a cache. Many caches like Memcached
    and APC allow for the inclusion of a “Time To Live” (TTL) value, which sets how
    long the cache data should be considered valid before it is purged. If that TTL
    has been exceeded, the cache automatically clears the data and reports that it
    does not have the information requested.


    Uncleared caches lead to stale data (more on this later), which creates an inconsistent
    and undesirable user experience.


    # File-Based Caches


    One of the easiest ways to store data for later retrieval is to place it on the
    file system. In fact, sessions work this way by default: the user is issued a
    session cookie, which contains a key, which is then used to load the session data,
    which is stored on the file system. Usually, files stored on the file system are
    faster to read than it is to process the data all over again.'
  - "[PAGE 65]\n\nCaches on the file system have a number of advantages: PHP comes\
    \ with built-in file system functions requiring no additional extensions or modules.\
    \ All developers have a tangential understanding of how the file system works,\
    \ which means that most developers will be able to effectively use a file system\
    \ cache. The file system is easy to write to and read from. And PHP’s var_export()\
    \ function and other tools make it easy to simply include file-system-based cache\
    \ files.\n\nFile-based caches also have some drawbacks, the most obvious being\
    \ that if the application uses more than one server, files stored on one server\
    \ cannot be read from another server very easily. File system caches are also\
    \ limited by the I/O speeds and capabilities of the machine itself. Also, if the\
    \ file-based cache is to be written to and read from regularly, some sort of file\
    \ locking mechanism must be used to prevent two concurrent PHP threads from trying\
    \ to write to the same file. Finally, file-based caches do not automatically expire\
    \ (they must be purged from the file system).\n\nThe following listing contains\
    \ a sample file-based cache that can easily be used to cache information (note\
    \ that it does not implement file locking):\n\n```\nclass FileCache {\n    protected\
    \ $ttl;\n    protected $path;\n\n    public function __construct($path, $ttl =\
    \ 3600) {\n        $this->setPath($path); $this->setTTL($ttl);\n    }\n\n    public\
    \ function write($data, $append = false) {\n        if(!is_string($data) || strlen($data)\
    \ < 0) {\n            throw new Exception('Data must be a string in FileCache::writeCache()');\n\
    \        }\n\n        if($append) {\n            $arg = FILE_APPEND;\n       \
    \ } else {\n            $arg = null;\n        }\n\n        $result = file_put_contents($this->path,\
    \ $data, $arg);\n        //Test for (bool)false, which is returned on failure.\n\
    \        if($result === false) {\n            throw new Exception('Writing to\
    \ cache failed FileCache::writeCache()');\n        }\n    }\n}\n```"
  md: "\n## Chapter 5\n## Caching techniques\n### What is Caching?\n\nAs primarily\
    \ a language for the web, PHP’s design is that of a “shared nothing” architecture.\
    \ The HTTP protocol is stateless, meaning that no information is retained about\
    \ the state of an application when a page is served. These two things together\
    \ mean that for data-driven sites, there is no built-in ability to preserve information\
    \ about logins, data retrieved, user information or other information that should\
    \ persist between requests.\n\nSince the beginning of the internet, then, developers\
    \ have worked to solve this “stateless” problem. Most developers already solve\
    \ much of it, by using sessions (which write information to the server and use\
    \ a key to access it), cookies (which is how the session key is usually stored\
    \ on a user’s system), and databases (which preserve application data in physical,\
    \ permanent storage). Working in concert, these items help preserve the “state”\
    \ of an application for future requests; helping users to enjoy a more seamless\
    \ and meaningful experience on the web.\n\nOf course, these are fairly primitive\
    \ solutions that are not always the most efficient and effective. Querying the\
    \ database on each request, for example, can be a difficult and strenuous task,\
    \ especially for high traffic sites. In the last chapter we talked about boosting\
    \ performance, but did not focus on how we can reduce the load of each request.\
    \ This chapter focuses on reducing that load through caching.\n\nCaching is the\
    \ storage of often needed, but infrequently changing data in its final or near-final\
    \ state for easy retrieval and use within an application. Examining each part\
    \ of this definition we find three parts:\n\nPart 1: “...often needed, but infrequently\
    \ changing data...” Many applications have large pieces of information that are\
    \ needed on each request, but do not change very often. This ranges from the user's\
    \ personal information to a list of blog posts. If the information changes frequently,\
    \ it must be refreshed frequently, which makes caching ineffective for reducing\
    \ the load on each request.\n\nPart 2: “...data in its final or near-final state...”\
    \ A big emphasis in caching the data is that we reduce the load on the server\
    \ as much as possible on subsequent requests. Therefore, storing the data in an\
    \ unfinished or processing-needed state reduces the efficacy of our cache. Often,\
    \ data is preserved in a cache in a state that requires no processing at all,\
    \ other than display formatting. This is relatively simple for the server to send\
    \ back to the user.\n\nPart 3: “...for easy retrieval and use within an application.”\
    \ Caching should simply be easy to use. Complicated methods for obtaining cached\
    \ data are often slow, and certainly cumbersome, which will prevent a team from\
    \ making use of them. When using a cache, developers owe it to themselves to make\
    \ it easy to get the information, serve it, and move on to the next request.\n\
    \n## Rules for Caching\n\nBefore moving into the types of caches and their individual\
    \ benefits, it is important to establish some ground rules for caching. There\
    \ are five crucial rules that must be followed when considering caching, in order\
    \ for caching to be an effective tool in a developer's toolkit.\n\n### Cache only\
    \ infrequently changing information\n\nWhile at first glance this rule might appear\
    \ to be obvious, it reminds us of an important point: cached data is supposed\
    \ to stick around for a while. Whether that time period is ten minutes, an hour\
    \ or a week, cached data is meant to be preserved.\n\nA good guideline is that\
    \ if the data will be invalid after only a few requests, it is better to load\
    \ it rather than caching it. Data that is going to be the same for many requests\
    \ or even for an entire user's session can safely be cached.\n\n### Do not cache\
    \ information that could lead to a security problem\n\nWhen caching data, particularly\
    \ user data, it is important to consider the security implications of that caching\
    \ choice. For example, if a user’s permissions are cached until the end of the\
    \ session, it is possible that the user’s rights might be revoked but that the\
    \ change may not be reflected immediately. This can create a security problem.\n\
    \nThis is not to say that no user data should ever be cached; that would be an\
    \ impractical and foolish assertion. Instead, when using caching it is critical\
    \ that each developer determine the security policy they wish to employ and, with\
    \ regards to protecting the integrity of the application, know the tradeoffs they\
    \ are making when caching certain pieces of data. Developers can employ a variety\
    \ of techniques to secure their applications (displaying the “Delete User” page,\
    \ but confirming that the user deleting another user still has those rights when\
    \ the delete behavior is invoked, for example).\n\n### Remember that caching is\
    \ a bit of black magic\n\nLuke Welling put it best in a tweet when he said “Any\
    \ sufficiently complex caching infrastructure is indistinguishable from black\
    \ magic.” And he is right: any caching system is designed to provide data almost\
    \ “magically”, inserting information without processing it or checking to see\
    \ if it is still valid.\n\nDebugging caching problems can be a hairy process for\
    \ this reason. Developers should therefore build their caching infrastructures\
    \ carefully, with debugging tools designed in (e.g. a key that indicates the results\
    \ set was cached) in such a way that fixing cache-related bugs can be resolved\
    \ easily.\n\nDevelopers should also work to develop with caching turned off, for\
    \ the most part, to help ensure that their code actually functions properly (instead\
    \ of them getting lucky and caching the results). Developing with caching on (APC\
    \ included) can create difficulties down the road.\n\n### Always Have a Backup\
    \ Plan\n\nSometimes caches make development too easy, so easy that developers\
    \ forget that the cache data might not be there one day. This can lead to catastrophic\
    \ application failure, strange bugs, and lots of difficult debugging.\n\nCached\
    \ data is transient. This means that developers should never expect it to be there.\
    \ Instead, they should prefer that it be there, but always have a backup mechanism\
    \ in place to retrieve that data from whatever source it originally was stored\
    \ in.\n\nOn that note, due to a cache's transient nature, they are not to be considered\
    \ permanent storage. Developers should always use a backup data storage method\
    \ - the file system, a database, or some other tried-and-true storage engine.\
    \ A generic rule of thumb is that data in a cache should never exist only in the\
    \ cache; it should always have come from somewhere stable.\n\n### Make Sure the\
    \ Cache Has a Built-in Expiration Date\n\nCache data should be transient and refreshed\
    \ at regular intervals. Obviously, certain data is more persistent than other\
    \ pieces of data, but in the end, all cached data expires at some point: therefore,\
    \ so should the cache.\n\nOld data should automatically be removed from a cache.\
    \ Many caches like Memcached and APC allow for the inclusion of a “Time To Live”\
    \ (TTL) value, which sets how long the cache data should be considered valid before\
    \ it is purged. If that TTL has been exceeded, the cache automatically clears\
    \ the data and reports that it does not have the information requested.\n\nUncleared\
    \ caches lead to stale data (more on this later), which creates an inconsistent\
    \ and undesirable user experience.\n\n## File-Based Caches\n\nOne of the easiest\
    \ ways to store data for later retrieval is to place it on the file system. In\
    \ fact, sessions work this way by default: the user is issued a session cookie,\
    \ which contains a key, which is then used to load the session data, which is\
    \ stored on the file system. Usually, files stored on the file system are faster\
    \ to read than it is to process the data all over again.\n\nCaches on the file\
    \ system have a number of advantages: PHP comes with built-in file system functions\
    \ requiring no additional extensions or modules. All developers have a tangential\
    \ understanding of how the file system works, which means that most developers\
    \ will be able to effectively use a file system cache. The file system is easy\
    \ to write to and read from. And PHP’s var_export() function and other tools make\
    \ it easy to simply include file-system-based cache files.\n\nFile-based caches\
    \ also have some drawbacks, the most obvious being that if the application uses\
    \ more than one server, files stored on one server cannot be read from another\
    \ server very easily. File system caches are also limited by the I/O speeds and\
    \ capabilities of the machine itself. Also, if the file-based cache is to be written\
    \ to and read from regularly, some sort of file locking mechanism must be used\
    \ to prevent two concurrent PHP threads from trying to write to the same file.\
    \ Finally, file-based caches do not automatically expire (they must be purged\
    \ from the file system).\n\nThe following listing contains a sample file-based\
    \ cache that can easily be used to cache information (note that it does not implement\
    \ file locking):\n\n```\nclass FileCache {\n    protected $ttl;\n    protected\
    \ $path;\n\n    public function __construct($path, $ttl = 3600) {\n        $this->setPath($path);\
    \ $this->setTTL($ttl);\n    }\n\n    public function write($data, $append = false)\
    \ {\n        if(!is_string($data) || strlen($data) < 0) {\n            throw new\
    \ Exception('Data must be a string in FileCache::writeCache()');\n        }\n\n\
    \        if($append) {\n            $arg = FILE_APPEND;\n        } else {\n  \
    \          $arg = null;\n        }\n\n        $result = file_put_contents($this->path,\
    \ $data, $arg);\n        //Test for (bool)false, which is returned on failure.\n\
    \        if($result === false) {\n            throw new Exception('Writing to\
    \ cache failed FileCache::writeCache()');\n        }\n    }\n}\n```\n"
  mdcn: "\n## 第5章\n## 缓存技术\n### 什么是缓存？\n\n作为主要用于 Web 的语言，PHP 的设计采用了“无共享”架构。HTTP 协议是无状态的，这意味着在页面提供时不会保留有关应用程序状态的任何信息。这两者的结合意味着，对于数据驱动的网站，无法内置保留登录信息、检索到的数据、用户信息或其他应在请求之间保持的信息的能力。\n\
    \n因此，自互联网开始以来，开发人员一直在努力解决这个“无状态”问题。大多数开发人员已经通过使用会话（将信息写入服务器并使用密钥访问）、Cookie（通常是会话密钥存储在用户系统上的方式）以及数据库（将应用程序数据保存在物理永久存储中）解决了其中的大部分问题。协同工作，这些项目有助于为未来的请求保留应用程序的“状态”；帮助用户在网络上获得更无缝、更有意义的体验。\n\
    \n当然，这些是相当原始的解决方案，并不总是最高效、最有效的。例如，在每次请求时查询数据库可能是一项困难而费力的任务，尤其对于高流量网站而言。在上一章中我们谈到了提高性能，但没有重点关注如何减少每次请求的负载。本章重点是通过缓存来减少这种负载。\n\
    \n缓存是对经常需要但很少变化的数据以最终或接近最终状态进行存储，以便在应用程序中轻松检索和使用。对该定义的每个部分进行检查，我们发现有三个部分：\n\n\
    第 1 部分：“...经常需要，但很少变化的数据...” 许多应用程序都有大量信息需要在每次请求时使用，但变化并不频繁。这范围从用户的个人信息到博客文章列表。如果信息经常变化，则必须经常刷新，这使得缓存对于减少每次请求的负载变得无效。\n\
    \n第 2 部分：“...数据处于最终或接近最终状态...” 在缓存数据时，我们希望尽可能减少对后续请求的服务器负载。因此，将数据以未完成或需要处理的未完成状态存储会降低缓存的有效性。通常，数据以在缓存中无需任何处理的状态保存，除了显示格式。这对于服务器向用户发送回相对简单。\n\
    \n第 3 部分：“...便于在应用程序中检索和使用。” 缓存应该简单易用。获取缓存数据的方法复杂通常很慢，而且肯定很麻烦，这会阻止团队使用它们。在使用缓存时，开发人员有责任让获取信息、提供服务并继续下一个请求变得容易。\n\
    \n## 缓存规则\n\n在进入缓存类型及其各自优势之前，建立一些缓存的基本规则很重要。有五条至关重要的规则必须在考虑缓存时遵循，以便缓存成为开发人员工具包中的有效工具。\n\
    \n### 仅缓存不经常变化的信息\n\n乍一看，这条规则似乎显而易见，但它提醒我们一个重要点：缓存数据应该保留一段时间。无论该时间段是十分钟、一小时还是一周，缓存数据都意味着要被保留。\n\
    \n一个好的指导原则是，如果数据在仅几次请求后就会失效，最好加载它而不是缓存它。对于许多请求甚至整个用户会话都保持相同的 data 可以安全地缓存。\n\n\
    ### 不要缓存可能导致安全问题的信息\n\n在缓存数据时，特别是用户数据时，考虑该缓存选择的安全影响非常重要。例如，如果用户的权限在会话结束前被缓存，则可能用户的权利被撤销，但更改可能不会立即反映出来。这会造成安全问题。\n\
    \n这并不是说用户数据永远不应该被缓存；那将是不切实际且愚蠢的断言。相反，在使用缓存时，每个开发人员都必须确定他们希望采用的安全策略，并且为了保护应用程序的完整性，了解在缓存某些数据时所做的权衡。开发人员可以采用各种技术来保护其应用程序（例如显示“删除用户”页面，但在调用删除行为时仍确认删除另一用户的用户是否仍具有这些权利）。\n\
    \n### 记住缓存有点像黑魔法\n\nLuke Welling 在一条推文中最好地表达了这一点，他说“任何足够复杂的缓存基础设施都与黑魔法无法区分。”他是对的：任何缓存系统都旨在几乎“神奇”地提供数据，在不处理或检查其是否仍然有效的情况下插入信息。\n\
    \n因此，出于这个原因，调试缓存问题可能是一个棘手的过程。因此，开发人员应仔细构建其缓存基础设施，并设计调试工具（例如指示结果集已被缓存的键），以便可以轻松解决与缓存相关的错误。\n\
    \n开发人员还应努力在大部分时间关闭缓存的情况下进行开发，以帮助确保他们的代码实际上能正常运行（而不是他们幸运地缓存了结果）。在打开缓存的情况下开发（包括\
    \ APC）可能会在以后造成困难。\n\n### 始终要有备份计划\n\n有时缓存使开发变得太容易，以至于开发人员忘记有一天缓存数据可能不存在。这可能导致灾难性的应用程序故障、奇怪的错误以及大量困难的调试。\n\
    \n缓存数据是暂时的。这意味着开发人员绝不能期望它存在。相反，他们应该希望它存在，但始终要有备份机制来从数据最初存储的任何来源检索该数据。\n\n顺便说一下，由于缓存的临时性质，它们不应被视为永久存储。开发人员应始终使用备份数据存储方法——文件系统、数据库或一些经过验证的存储引擎。一个通用的经验法则是，缓存中的数据绝不应只存在于缓存中；它始终应来自某个稳定的来源。\n\
    \n### 确保缓存具有内置过期日期\n\n缓存数据应该是暂时的，并在定期间隔刷新。显然，某些数据比其他数据更持久，但在最终，所有缓存数据都会在某个时间点过期：因此，缓存也应如此。\n\
    \n旧数据应自动从缓存中删除。许多缓存如 Memcached 和 APC 允许包含“生存时间”（TTL）值，该值设置缓存数据在被清除前应被视为有效的时间。如果超过该\
    \ TTL，缓存会自动清除数据并报告它没有请求的信息。\n\n未清除的缓存会导致陈旧数据（稍后会详细介绍），这会造成不一致且不理想的用户体验。\n\n##\
    \ 基于文件的缓存\n\n将数据存储在文件系统上以便以后检索的最简单方法之一。事实上，会话默认就是这样工作的：用户会收到一个会话 Cookie，其中包含一个密钥，然后该密钥用于加载会话数据，会话数据存储在文件系统上。通常，存储在文件系统上的文件读取速度比重新处理数据快得多。\n\
    \n文件系统上的缓存有许多优点：PHP 带有内置的文件系统函数，无需额外的扩展或模块。所有开发人员对文件系统的工作方式都有切身的了解，这意味着大多数开发人员能够有效地使用文件系统缓存。文件系统易于写入和读取。而且\
    \ PHP 的 var_export() 函数和其他工具使包含基于文件系统的缓存文件变得容易。\n\n基于文件的缓存也有一些缺点，最明显的是如果应用程序使用多个服务器，则存储在一个服务器上的文件很难从另一个服务器读取。文件系统缓存还受限于机器本身的\
    \ I/O 速度和功能。此外，如果基于文件的缓存要定期写入和读取，则必须使用某种文件锁定机制，以防止两个并发的 PHP 线程尝试写入同一文件。最后，基于文件的缓存不会自动过期（必须从文件系统清除）。\n\
    \n以下列表包含一个示例基于文件的缓存，可轻松用于缓存信息（请注意，它未实现文件锁定）：\n\n```\nclass FileCache {\n    protected\
    \ $ttl;\n    protected $path;\n\n    public function __construct($path, $ttl =\
    \ 3600) {\n        $this->setPath($path); $this->setTTL($ttl);\n    }\n\n    public\
    \ function write($data, $append = false) {\n        if(!is_string($data) || strlen($data)\
    \ < 0) {\n            throw new Exception('Data must be a string in FileCache::writeCache()');\n\
    \        }\n\n        if($append) {\n            $arg = FILE_APPEND;\n       \
    \ } else {\n            $arg = null;\n        }\n\n        $result = file_put_contents($this->path,\
    \ $data, $arg);\n        //Test for (bool)false, which is returned on failure.\n\
    \        if($result === false) {\n            throw new Exception('Writing to\
