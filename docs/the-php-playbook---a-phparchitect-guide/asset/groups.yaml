    A good rule of thumb is that each discrete action in a project requires its own
    ticket. For example, if a form needs to be created, and a backend handler for
    that form needs to be implemented, that is two tickets: they are discrete actions
    that will be done individually. Despite the fact that they are linked together
    by their shared purpose (the form submission and storage), the actions are discrete
    components.


    Another good rule of thumb is that whenever an issue is resolved, but additional
    issues are raised as a result (e.g. with our form example, if a database change
    is required to make the form save properly), a new issue should be created and
    mentioned in the old issue. That way, it is obvious to other developers (and you,
    two weeks from now) that this issue was resolved, but created another issue to
    resolve as well.


    # Effective Project Management


    Many developers think that project management is handled entirely by the project
    manager. They could not be more wrong. Good project managers rely on developers
    and team leads to help manage the project, by providing feedback, estimates, and
    issue management.


    The most effective way to help manage a project is to communicate clearly, completely,
    and often. Whether through filing issues or bringing up concerns during daily
    standup meetings, developers must take initiative at being involved in the overall
    management of their projects.


    It is easy for developers to think that they do not have anything to contribute
    to a project manager or to the management of the project, but they really do:
    they are the way the work gets done, and they are the reason the project is finished
    at all. So being an effective, involved member of the team is everyone''s responsibility.


    Developers who are engaged in the project, have a mental stake in its success,
    and help aid the proper management of the project will be much happier than developers
    who just sit by and watch a project move towards completion (or failure). And
    project managers want the input and feedback of developers. Successfully managing
    a project to completion is the responsibility of the entire team, not just the
    project manager; the manager is the coordinator, but their team members are the
    eyes and ears of what is really going on.'
  - '[PAGE 149]


    # Picking the Right Company to Work For


    Selecting a position is not always an easy decision for developers to make. Picking
    the right company is crucial to a developer''s long-term happiness and success,
    yet it is not always apparent how well a developer will do at a particular firm.
    Unhappy developers are a leading cause of turnover in development firms. Thus,
    it is important that developers and companies select well.


    While it is not always easy to figure out whether or not a company will be a good
    fit, there are questions a developer can ask before starting work that can highlight
    possible future problems. In particular, developers should ask questions that
    relate directly to other experiences they have had. They should ask about process,
    the expectations of their supervisors, the availability of tools like bug tracking,
    version control and project management software. They should investigate whether
    or not there is a specification and what kind of work they will be doing (direct
    client work, product work, etc).


    Developers also have an obligation to determine what their own needs and desires
    happen to be. This introspection may take some time, and should be done before
    receiving an offer, and optimally before even sending out resumes to other companies.
    The easiest way to ensure that a developer will be unhappy at a new place is to
    not have an idea of what their own happiness should look like. Developers can
    and should avoid this if possible.'
