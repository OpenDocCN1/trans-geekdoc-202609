    \n## Chapter 8\n\n## 最差实践\n\n首先，让我们先把这些问题排除掉：\n\n- 意大利面条代码\n- 引用\n- 过度面向对象\n-\
    \ 80/20 规则微优化\n\n开发人员倾向于关注“最佳实践”，以帮助改进开发并让每个人保持一致。这些最佳实践是突出应采用的开发实践的好方法。但哪些实践对开发来说是明确有害的？\n\
    \n本章重点关注这些实践，并强调它们为何有害以及如何改进。我们重点讨论了安全应该从应用底层开始的原因，讨论了许多开发人员花费太多时间编码而设计时间不足的问题，揭露了并非我所造综合征并谈论了应用的风格指南。\n\
    \n## 认为安全是在应用程序完成时才考虑\n\n“我先把应用程序写完，然后再让它安全。”听起来熟悉吗？这在许多开发中都很常见。在他们眼中，安全是次要的，\n\
    \n要先组装并演示一个可工作的原型。这可能有多种原因：他们不关心安全，或原型的截止日期极其紧张，或他们根本不了解安全为整体带来的价值。\n\n不过，最后再开发安全是一种危险的做法，因为它破坏了安全的整个概念。它确保当你稍后去“添加”安全时，必然会遗漏某些东西。你可能会在数据库层或视图层或应用程序的其他地方遗漏添加安全。这些都是糟糕的安全实践，应该避免。\n\
    \n安全应该从架构阶段一直包含到演示阶段。优秀的开发人员甚至可能会在应用程序被宣布为“准备好”投入生产之前，将安全作为向客户或内部团队演示的一项内容。\n\n\
    在编写应用程序的各个部分时，应花费大量时间确定必须包含哪些安全措施以及如何实现这些安全措施。\n\n在架构阶段，应用程序开发人员应确定将需要哪些安全措施，以及它们如何协同工作以提供应用程序的整体安全。在此阶段，可以确定何时何地放置安全检查，应强制执行哪些安全检查，以及如何最好地保护应用程序免受恶意用户侵害。\n\
    \n在设计数据库层时，开发团队应采取防止 SQL 注入的保护措施。对数据来源及其使用方式的考虑也应影响在此阶段做出的决策，无论数据来自内部（通常更安全）来源，还是用户提供（完全不安全）。这些决策很大程度上取决于开发初期阶段提供的架构设计。\n\
    \n转向用户界面开发，这里应采取两种独特的保护措施：Chris Shiflett 所称的“过滤输入，转义输出”。首先，用户提交的任何输入都必须根据不可接受的一组标准进行过滤——HTML、注入可能性（通常在数据库层处理）、无效数据（预期为数字字符处出现字母字符、需要电子邮件地址处出现非电子邮件）和其他检查。\n\
    \n这些检查应始终在服务器端进行（尽管基于 JavaScript 的验证很受欢迎，如果需要可以提供即时反馈）。接下来，转义输出至关重要——任何未被筛选或过滤掉的内容都应在此点变得无害。这意味着将任何遗漏的\
    \ HTML 转换为无害的 HTML，确保 XSS 攻击不可能发生，并中和其他类型的攻击。\n\n还有一些经常被忽视的领域也应得到解决。其中一个领域是会话保护。设计会话时必须防止会话劫持至关重要，通过验证会话、在权限提升后更改会话\
    \ ID、考虑检查 User-Agent 头和其他标准保护措施。\n\n此外，像要求更改敏感设置或密码本身时输入密码，以及对安全相关数据使用 HTTPS 连接等标准做法，也是你的安全模型的重要组成部分。\n\
    \n到目前为止，应该很明显，将安全纳入开发的最后阶段会带来极大的挑战。其中许多安全更改需要大量的代码修改；有些则需要设计师和测试人员的额外工作，确保进行第二轮开发。虽然很可能需要第二轮来根据客户或产品经理的要求进行调整，但这仍然需要大量的重构。\n\
    \n以安全为中心的开发方式则确保安全将在每一步中包含在内，有助于消除遗漏的可能性。虽然不可能保证关闭每一个安全漏洞，但以安全为出发点而不是事后考虑的开发方式，有助于确保许多漏洞确实被关闭，并提高应用程序的整体安全性。\n\
    \n## 花费太多时间编码，设计时间不足\n\n开发人员喜欢编写代码并以成品的形式呈现解决方案。他们宁愿写代码也不愿写规范。开发人员行为的这一组成部分使设计过程对他们来说很困难，因为他们很难将自己的想法写下来或提出没有以某种代码形式表达的想法。\n\
    \n"
