    PHP 生态中现代开发的完整理解。


    许多开发类书籍以代码为主，但本书代码含量较少，只在适当之处穿插少量代码片段。由于本书关注的是方法本身，而非 PHP 开发者工作的具体手段，因此会在合适的地方给出代码；但大部分内容来自多年经验积累的建议、理念和现实情况。


    在我们深入探讨这些主题时，务必要记住，这绝不是什么能解决所有问题的“银弹”，而只是漫长软件开发流程改进道路上的一个路标。事实上，软件开发不存在“涅槃”，也没有那种达到完美的“顿悟状态”。但如果我们持续追求完美，软件开发就会不断变得更好。


    ## 第 1 章：调试 PHP 项目


    ### 调试简介


    每个开发者都会犯错。现实是，没有哪位开发者是完美的；事实上，有些统计表明某些项目中每七行代码就有一个 bug。这种高得离谱的 bug 发生率不应成为开发者粗心大意的借口，而应提醒他们：bug
    确实存在，而且永远无法完全摆脱。


    当使用错误的假设编写代码，或对当前任务理解不完整而导致开发出的功能与预期用途不符时，bug 就会出现。Bug 也可能是语法错误或逻辑错误。每个开发者在开发过程中都会遇到各种形态和规模的
    bug，从小的语法错误到需要重构才能解决的大段代码。


    因此，拥有扎实的工具包对每位开发者都至关重要。能否解决 bug、调试自己的代码，正是平庸程序员与优秀程序员之间的区别。


    PHP 开发者相比传统软件开发者有一个优势：他们无需等待代码经过编译器才能发现编程错误。事实上，PHP 开发者能够按需编译代码、即时测试，并在工作中解决 bug。这一点再加上
    PHP 的 Xdebug 扩展，意味着 PHP 应用开发者完全有能力在 bug 进入生产环境之前识别并消灭它们。


    ### Xdebug 简介


    本章选择的主要工具是一个名为 Xdebug¹ 的扩展，它免费提供，并由 Derick Rethans 维护。为什么我们选择 Xdebug 作为调试工具？


    简单来说，Xdebug 远超当今市场上的任何调试产品。Xdebug 提供了一系列强大的功能，包括输出变量、跟踪函数、分析应用，以及在报错时提供有用的堆栈跟踪信息。


    Xdebug 拥有活跃的社区并得到持续维护，这为其提供了可信度，并确保它能够保持实用，且兼容未来版本的 PHP。其全面的配置选项还能帮助开发者根据个人需求进行定制。


    ### 安装 Xdebug


    要使用 Xdebug，必须先安装它。对于大多数用户，Xdebug 可以从源码编译，也可以通过 PECL 包管理器安装（这是安装 Xdebug 的推荐首选方式）。以下是适用于各种操作系统的安装说明：


    #### Windows 用户


    Windows 用户可以安装预先打包的二进制文件²，并按照 Xdebug 网站³ 上的安装说明进行操作。


    #### Linux 和 Mac 用户


    Linux 和 Mac 用户应通过 PECL 包管理器安装 Xdebug。


    要使用 PECL 包管理器，请确保你是 root 用户（或以 root 身份执行命令）。以下命令将成功安装 Xdebug：


    ```bash

    # pecl install xdebug

    ```


    PECL 安装完成后，你必须将该扩展添加到 php.ini 文件中。忽略 PECL 提示将 xdebug.so 添加到 INI 文件的操作，因为这样做以后会引发问题；相反，请将以下行添加到你的
    php.ini 文件中：


    ```ini

    zend_extension="/usr/local/php/modules/xdebug.so"

    ```


    务必将模块路径改为你系统上的实际路径。


    ### 从源码安装 Xdebug


    对于那些希望从源码配置 Xdebug 的用户，Xdebug 网站⁴ 上提供了相关说明。


    ### Xdebug 配置选项


    Xdebug 提供了大量配置选项，所有这些选项都记录在 Xdebug 网站⁵ 上。这些选项几乎可以控制一切，从 Xdebug 是否重载 `var_dump()`
    函数，到打印数组的嵌套层级数量等。


    ### 变量输出配置选项


    `xdebug.overload_var_dump`


    默认情况下，Xdebug 会重载 `var_dump()` 函数。如果你确定要关闭 Xdebug 的重载，仍然可以通过一个名为 `xdebug_var_dump()`
    的特殊函数来打印 Xdebug 的 `var_dump()` 输出。


    `xdebug.var_display_max_children`


    此设置控制 `var_dump()` 或类似函数使用期间显示多少个键或属性。默认值为


