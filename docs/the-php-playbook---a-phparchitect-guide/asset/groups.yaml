  mdcn: "\n\n## Xdebug 分析器选项\n\nXdebug 自带一个分析器，可以生成与 cachegrind 兼容的文件。该文件可用于任意数量的分析器，例如适用于\
    \ Mac 或 Windows 的 Kcachegrind。\n\n性能分析与函数追踪略有不同，因为分析必须针对整个 PHP 脚本进行，而不能在脚本中启动（必须通过\
    \ INI 设置或指令来完成）。不过，仍有许多配置选项需要你了解并加以利用。\n\n要使用分析器，你必须将 xdebug.profiler_enable 设置为\
    \ 1。\n\n有时你可能希望追加 cachegrind 文件，而不是完全覆盖它。xdebug.profiler_append 允许追加 cachegrind\
    \ 文件。\n\n你可以使用 xdebug.profiler_output_name 更改分析器输出文件的名称，以帮助区分你所分析的各种不同脚本。\n\n\
    ## 使用函数追踪\n\n能够查看应用程序为呈现结果所经过的路径通常非常有用。由于无法在任意时刻查看堆栈（除非引发错误或抛出异常），因此利用 Xdebug\
    \ 的函数追踪功能是解决“正在运行什么、何时运行”这类棘手问题的绝佳方法。\n\n函数追踪可以通过两种不同的方式运行：显式调用函数追踪来启动和停止，或者让\
    \ Xdebug 在 PHP 被调用时立即启动追踪。\n\n通过手动运行函数追踪并设置其开始和结束位置，开发者能够看到他们原本可能看不到的代码片段。想知道某个特定方法做了什么？函数追踪可以快速快照该方法在获得返回值之前所运行的深度层级。函数追踪还可用于检查某些条件是否满足（通常与查看传递给各个函数的参数这一选项配合使用）。\n\
    \n为了调用函数追踪，开发者可以使用 xdebug_start_trace() 函数；使用 xdebug_stop_trace() 函数可以同样轻松地停止追踪。这两个函数可以在脚本执行期间的任意时间点调用。\n\
    \n有时，开发者可能希望从头到尾查看一个脚本。当开发者想要查看包含了哪些文件（以及处于哪个阶段），或想要查看在应用程序主体被调用之前执行的启动函数时，自动开始追踪的能力非常有用。如果开发者使用了\
    \ auto_prepend INI 指令，自动追踪选项也很有用，因为在该文件中没有简便的方法来启动追踪。\n\n函数追踪在很多方面都很有用，但也可能令人困惑。最好以小增量、针对特定目的来使用它们；开发者可能会发现，过度使用会导致信息过载。\n\
    \n开发者还应注意确保追踪文件被写入 Web 服务器可写的目录。Web 服务器通常以 root 身份运行，可能与当前用户具有不同的用户名或组。\n\n##\
    \ 输出变量\n\nPHP 提供了几种变量输出选项，包括 print_r() 和 var_dump()。默认情况下，var_dump() 的输出看起来像这样：\n\
    \n```\narray(6) {\n    [0]=>\n    string(3) \"abc\"\n    [\"mkey\"]=>\n    bool(true)\n\
    \    [\"auth\"]=>\n    bool(false)\n    [1]=>\n    array(3) {\n        [0]=>\n\
    \        string(1) \"1\"\n        [1]=>\n        string(1) \"2\"\n        [2]=>\n\
    \        string(1) \"3\"\n    }\n    [2]=>\n    array(2) {\n        [\"key1\"\
    ]=>\n        string(3) \"abc\"\n        [\"key2\"]=>\n        string(3) \"def\"\
    \n```\n\n我们得到的是一个包含格式化数据的文件：\n\n```text\nArray\n(\n    [0] => a\n    [1] => b\n\
    \    [2] => c\n    [3] => d\n)\n```\n\n这些数据也很容易阅读，但所含信息不如 var_dump() 提供的多。不过，它提供了足够的信息，使我们能够理解输出并明白其含义。\n\
    \nXdebug 还提供了一个高级功能，允许开发者查看变量中存储的 zval 数据。zval 数据是与 PHP 中变量结构相关的数据：其引用计数（refcount）、是否为引用，以及其他数据。\n\
    \n使用我们上一个代码示例，下面是 xdebug_debug_zval() 函数的用法：\n\n```php\n$var = array('a', 'b',\
    \ 'c', 'd');\nxdebug_debug_zval('var');\n```\n\n```text\nvar:\n\n(refcount=1,\
    \ is_ref=0),\narray\n    0 => (refcount=1, is_ref=0),string 'a' (length=1)\n \
    \   1 => (refcount=1, is_ref=0),string 'b' (length=1)\n    2 => (refcount=1, is_ref=0),string\
    \ 'c' (length=1)\n    3 => (refcount=1, is_ref=0),string 'd' (length=1)),\n```\n\
    \n这对于确定变量是否为引用、其引用计数以及其他信息非常有用。这个函数还有一个姊妹函数，将信息发送到标准输出（stdout）；可以通过调用 xdebug_debug_zval_stdout()\
    \ 来访问它。\n\nXdebug 还提供了捕获和输出超全局变量信息的能力。Xdebug 包含一个名为 xdebug_dump_superglobals()\
    \ 的函数，该函数会转储已在 INI 文件中设置为收集的任何超全局变量。你也可以使用 `var_dump($_GET)` 来转储特定的超全局变量，而无需将其添加到\
    \ `php.ini` 文件中。\n\n## 使用 PHP 处理错误\n\n任何 PHP 开发者可能犯的最大错误之一，就是不在开启 `display_errors`\
    \ 的情况下进行开发，并且不将 `error_reporting` 设置为 `E_ALL | E_STRICT`。这两个设置结合起来，可以帮助开发者在对错误进入生产环境或在测试中被发现之前，识别并解决它们。\n\
    \n这些设置都可以在 `php.ini` 文件中设置，或在 `.htaccess` 文件中设置，甚至可以按文件进行设置。然而，为了保持一致性和良好的开发实践，开发者应该在其\
    \ `php.ini` 文件中全局设置这些选项。\n\n开发者经常犯的另一个错误是，无论在开发还是生产环境中都不记录错误。当出现问题时，错误日志是至关重要的信息来源；它们通常是快速诊断问题与数小时烦恼和停机之间的差别。描述性错误消息是宝贵的信息来源。\n\
    \n开发者应关注其 `php.ini` 文件中的三个设置：`display_errors`、`error_reporting` 和 `error_log`。`display_errors`\
    \ 指令在开发期间应设置为 ON，在生产环境中应设置为 OFF。开发者应将 `error_reporting` 设置为 `E_ALL | E_STRICT`，以便查看所有错误，包括通知（notice）和编码标准违规。最后，`error_log`\
    \ 应指向一个存在可写 PHP 错误日志的位置，该日志将记录错误。\n\n许多开发者开启 `E_ALL | E_STRICT` 后，意识到应用程序中有大量的通知和编码违规，于是迅速将其关闭，认为他们的代码能够运行，所以这些问题显然不需要修正。但这是一个巨大的错误。虽然大多数通知是无害的，但有时有关较大\
    \ bug 的关键线索会首先出现在通知中，然后才导致致命错误。关闭此功能而不解决代码中的通知，会导致日后更大的问题，甚至可能加剧现有应用程序中已有的 bug。\n\
    \n一旦代码进入生产环境，开发者应将 `display_errors` 设置为 OFF，这样攻击者就无法从显示的错误中获取关键的服务器和代码信息。然而，这使得记录错误更加重要；我经常为每个虚拟主机使用单独的错误日志。最后，开发者可以放宽他们的\
    \ `error_reporting`\n\n不过，可视化确实有其局限性：显然，它无法帮助解决数据库与应用程序之间的问题，而且有时即使将数据可视化，也很难确定引入\
    \ bug 的具体位置。此外，在启用输出缓冲时，可视化可能非常难以实现。\n\n## 使用断点\n\n大多数现代 IDE 都支持设置“断点”——应用程序中的特殊位置，当调试器与\
    \ IDE 的解析功能一起运行时，会在预定位置停止应用程序，并允许检查该给定点的运行时环境。\n\n无论你是否使用 IDE，都可以轻松地将断点构建到应用程序中，只需使用开发者最好的工具之一：die()\
    \ 结构。该结构允许开发者结束脚本的处理，并检查在执行该 die() 调用之前的环境。\n\n结合变量输出选项，创建“断点”这一概念帮助开发者追踪代码中引入\
    \ bug 的位置。显然，在使用 IDE 时，这变得更加容易，找到 bug 的位置也变得轻而易举。\n\n## 增量开发\n\n开发时，我总是保持打开三样东西：我的\
    \ shell 窗口、IDE 和浏览器。为什么是浏览器？因为我是增量开发的——在实现一个功能或一些可疑的逻辑后，我会执行代码（无论是在命令行还是浏览器中），以确认它确实按照我想要的方式运行。\n\
    \nPHP 是一种运行时编译的语言。这提供了一个绝佳的机会，因为开发者能够频繁地运行他们的应用程序。他们无需等待编译应用程序，也无需等到完成应用程序的某个特定方面之后才能测试。相反，他们可以非常快速地构建一个测试，并立即看到逻辑是否有效。\n\
    \n开发者应该充分利用 PHP 的能力，而快速轻松地运行程序的能力是 PHP 相对于编译型语言的一大优势。它使增量开发变得容易，并有助于快速发现和消灭 bug。\n\
    \n"
