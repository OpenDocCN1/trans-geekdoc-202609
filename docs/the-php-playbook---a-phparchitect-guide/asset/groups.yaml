    # Keeping the Working Copy Updated


    From time to time, other developers may make revisions to the repository that
    are not reflected in your working copy. In order to maintain an up-to-date working
    copy, the update command should be used:


    ```

    svn update

    ```


    The svn help update command will display a number of options including updating
    to a particular revision, or updating only a particular part of the working copy.


    # Managing the Working Copy File Structure


    Subversion tracks changes to individual files: therefore, when moving or changing
    files and directories, it is important to tell Subversion what has been done,
    so that Subversion can associate the history with that move. Subversion mimics
