    SELECT column1, column2, . . . FROM table 而不是 SELECT * FROM table）也有助于缩小结果集的大小。


    数据库开发者经常忽略的另一个方面是表类型的适当使用，也就是所谓的“存储引擎”。MySQL（以及其他数据库引擎）支持多种表类型。例如，MySQL 支持 MEMORY
