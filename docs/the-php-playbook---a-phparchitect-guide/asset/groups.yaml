    it were manna from heaven.


    This chapter discusses what version control is and how to use Subversion and Git
    (two of the most popular VCS or Version Control Systems), as well as how to use
    version control even if your manager will not.


    ### What Is Version Control?


    Version control is, simply put, a way of keeping track of different versions of
    a file automatically. While each VCS is different, they all share a similar purpose:
    to track how a file changes over time and allow developers to view a file in any
    given state from any point in history.


    Version control has a secondary advantage, in that it allows different developers
    to work on the same files without overriding the changes made by the other. Version
    control is smart enough to know which parts of a file were changed, and apply
    those changes to both versions in a process called “merging”. From time to time,
    version control encounters a “conflict”, where the same file was changed in the
    same location by two different developers, but is still smart enough to inform
    the developers and encourage them to merge their changes.


    ### Why Does Version Control Matter?


    Version control is important for several reasons. First, it offers protection
    of the source code, either from accidental or intentional damage. Secondly, it
    offers developers the ability to identify when, and who, changed certain aspects
    of an application. It allows developers to work together without the stress of
    managing files or manually merging them together. Finally, it allows developers
    the ability to experiment, without impacting the development line adversely.


    Version control matters because it helps keep code safe. From time to time, accidents
    happen: for example, developers have hard disks that crash. It is also possible
    that a disgruntled developer might attempt to damage the company by deleting or
    altering source code in such a way that it causes it to fail. Version control
    helps prevent this. By creating a system of essentially backed up files from various
    points in history, a developer can easily check out a new copy or restore damaged
    code from the known good code at a particular revision.


    Version control matters for other reasons too. In large projects the API, components,
    modules and structure often changes, and does so quickly. A developer can sometimes
    be caught off guard by a change in architecture or the API, and might want to
    know when a change took place. Version control lets that developer look through
    the code’s history and see when and how something changed. Version control also
    tracks each line to determine who committed it and when, helping identify who
    introduced bugs or when a bug was introduced.


    Because version control offers the ability to merge changes from two or more developers,
    it helps facilitate collaboration. Developers can work on similar, related but
    different components of an application at the same time without discussing who
    has that particular file open for writing or who is doing what. In the event of
    a conflict, no developer has to worry that their changes will be overwritten:
    version control allows for manual merging of these conflicts and does its best
    to merge the files together when the work does not overlap.


    Version control also allows users the ability to create a “branch” - a complete
    copy of the code - into a separate “tree” or area of the repository for development.
    This branch can be used for the purposes of experimenting, or can be part of the
    development cycle. At any point, developers have the option of merging the branch
