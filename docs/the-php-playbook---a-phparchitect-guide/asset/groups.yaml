  - '[PAGE 26]


    Visualization does have its limits though: obviously it does not help resolve
    issues between the database and the application, and sometimes it can be hard
    to identify the specific point where a bug is introduced, even when visualizing
    the data. And visualization can be very hard to do when output buffering is enabled.


    # Use Break Points


    Most modern IDEs allow for the inclusion of “break points” - special points in
    an application that, when a debugger is run along with the IDE’s parsing functionality,
    will stop the application at a predetermined spot and allow for the inspection
    of the runtime environment at that given point.


    Whether or not you use an IDE, breakpoints can be built into your application
    with ease simply by using one of the developer’s best tools: the die() construct.
    This construct allows for a developer to end processing of a script and inspect
    the environment as it was prior to the execution of that die() call.


    Together with the variable output options, this concept of creating “break points”
    helps developers to track where a bug is introduced in their code. Obviously,
    this gets even easier when using an IDE, and finding the location of a bug becomes
    a cinch.


    # Develop Incrementally


    There are three things I always have open when I develop: my shell window, my
    IDE, and my browser. Why the browser? Because I develop incrementally - after
    implementing a feature or some questionable logic, I execute the code (either
    on the command line or in the browser) to see that, in fact, it is running the
    way I want it to work.


    PHP is a compile-at-runtime language. This presents an awesome opportunity because
    developers have the ability to run their applications frequently. They need not
    wait to compile their applications or wait until they have finished writing a
    particular aspect of their application before they can test it. Instead, they
    can knock up a test very quickly and see if the logic works right away.


    Developers should use the abilities of PHP to their advantage, and the ability
    to run the program quickly and easily is one advantage that PHP has over compiled
    languages. It makes developing incrementally easy, and helps quickly find and
    squash bugs.'
