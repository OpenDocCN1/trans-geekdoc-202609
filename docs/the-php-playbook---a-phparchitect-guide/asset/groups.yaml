    \n接下来，我们注意到示例代码有一个“测试模式”——理论上可以用它对示例进行“试运行”。话虽如此，测试应该在单元测试级别进行，而不是在我们的示例中。如果我们想要一个“试运行”模式，我们应该模拟一个对象，而不是依赖对象上的设置来进行试运行。\n\
    \n值得指出的是，作者在将这个组件写入他们的应用程序时是出于好意。开发者希望避免在功能测试期间不小心向Twitter账户发布内容的情况，这当然是一个崇高的目标。但正如我们将在下一节中探讨的那样，有更好的方法来模拟HTTP连接并避免这种无意的发布。可以安全地从类中移除这种行为。\n\
