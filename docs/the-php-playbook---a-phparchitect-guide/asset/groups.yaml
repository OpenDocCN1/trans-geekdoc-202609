  mdcn: "\nGit 并没有那么严重地受到这个问题的影响；其操作模型是使用小型、短期的分支进行开发，然后快速合并到 master 中，再予以销毁。但 Subversion\
    \ 由于整个文件系统被复制到新目录的缘故，并不促进这种常规合并。因此开发者有意地进行合并非常重要。\n\n如果正在进行重大功能或大规模改造，完全可以把 trunk\
    \ 合并到分支中，以将 trunk 中正在开发的功能添加到分支。分支稳定后，这会使最终产品合并回 trunk 变得容易得多。此外，建议开发者详细记录分支和合并时的修订版本。这有助于缓解\
    \ Subversion 合并命令的一些问题。\n\n由于 Git 在合并方面更好，对于打算频繁分支的开发者来说，Git 是一个更好的选择。然而，只要遵循此规则，Subversion\
    \ 也提供一些分支支持。\n\n## 游击式版本控制\n\n说到版本控制，每个人都有自己的看法，而且这些看法并不总是一致。对于开发者无法使用版本控制，或无法使用他们希望的版本控制系统的情况，可能会看起来无望。但不必如此无望：仍然可以使用版本控制。\n\
    \n### 给没有版本控制的开发者的一些话\n\n有时，经理无法被说服使用版本控制，或团队无法被劝说认真对待。在这些情况下，作为开发者，你不需要完全放弃版本控制；即使你的团队或管理层不这样做，你仍然可以利用其明显的优势。\n\
    \n版本控制按定义旨在提高个人的绩效，尽管它通常以团队为中心，但受益最大的是个人。这意味着开发者可以自行使用版本控制，而无需团队参与。\n\n最适合此用途的\
    \ VCS 很可能是 Git。因为 Git 允许在无需托管在其他地方的情况下创建本地仓库，Git 为独自的开发者提供了使用版本控制的能力，而没有任何人知道他们\n\
    在分支上。这是为了确保 Subversion 和 Git 保持同步。显然，这会削弱 Git 的部分功能，但对于使用 git-svn 来说这是必要的恶。最后，svn:externals\
    \ 与 git-svn 不兼容；这里的解决方案是将外部项目作为 Subversion 工作副本检出，然后通过编辑排除文件来忽略整个树。\n\n尽管如此，git-svn\
    \ 仍为受 Subversion 约束的开发者提供了使用 Git 的机会，如果他们更喜欢的话。\n\n## 为什么要重构？\n\n重构之所以是开发中的重要方面，有很多原因。许多开发者认为重构困难、耗时且毫无意义，但它是一个关键步骤，每个开发者都应该实践它。\n\
    \n重构很重要，因为改进代码的成本比重写它更低。许多开发者回顾自己写的旧代码，会惊讶于自己在短短几个月内进步了多少。他们可能会看上一个产品并决定，鉴于自己更新的技能，应该停下来重写产品。但这是一项徒劳无功的任务。\n\
    \n与其重写应用程序，重构给了我们一个机会，让我们能够在迭代中、随着时间的推移缓慢改进现有应用程序。因为重构专注于改进代码本身，而非应用程序的功能行为，所以重构是将新技能应用于旧代码的绝佳机会。\n\
    \n重构现有代码利用了错误修复，保留了代码中嵌入的机构记忆，并且可以利用该应用程序的测试套件，这有助于防止重构引入错误。当应用程序被重写时，这些保护通常不存在：重写的代码无法受益于机构记忆，不包含代码中已指出的错误修复，并且由于测试套件未经验证，可能出现许多错误。\n\
    \n重构也很重要，因为它允许开发者随着理解和知识的提升而做出改进。现实是，对于大多数开发者而言，他们会成长和改变。他们对核心原则的理解以及对其艺术的实践会随着时间的推移而改善。他们很可能会在未来审视自己的代码，发现其中的问题以及改进空间。\n\
    \n选择重构为开发者提供了将这些改进带到旧产品和代码中的机会。它不仅让他们看到代码可以改进的地方，还能真正进行改进。反过来，旧应用程序会不断变得更好，从而为客户和用户提供价值。\n\
    \n同样，经常重构的开发者往往会带来从其他应用程序和项目中学到的增强功能，这反过来提高了应用程序的整体质量。例如，处理数据库的特定算法或流程通常可以从一个应用程序移植到另一个应用程序。开发者将这些改进和发现应用到其他应用程序的能力，总体上改善了每个人的体验。\n\
    \n最后，重构通常会改善应用程序的结构和设计。由于重构的目的是增强应用程序的结构、功能、性能和设计，随着开发者在这些方面的提升，他们重构的应用程序将受益于对这些概念和实践的更深入理解。\n\
    \n### 重构前开发者必须做的事情\n\n重构是 PHP 开发者工具箱中的重要工具，但它并非没有问题和潜在风险。\n\n为了有效重构，开发者必须注意重构方面的一些“陷阱”，并尽力减轻这些问题。\n\
    \n最先也是最明显的一点是，开发者在尝试改变代码功能方式之前，必须理解代码试图实现什么。否则，开发者可能会因对代码工作原理的误解而破坏实现。\n\n开发者也经常忽视为打算重构的代码建立全面的测试套件的必要性。这至关重要，因为如果没有全面的测试套件，开发者就无法知道他们完成的重构是否破坏了应用程序。许多小错误可能只会在测试套件或应用程序中的边缘情况中显现。拥有能够突出这些边缘情况的测试套件对开发者价值巨大。\n\
    \n### 如何重构\n\n重构不是一门精确的科学。相反，它是一门抽象的艺术，随着开发者成长，他们会不断改进。因此，本章包含很少的硬性规定，而更多的是关于重构时能带来改进代码的策略的讨论。\n\
