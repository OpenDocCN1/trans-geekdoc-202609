    store the data because you forgot to save it, rather than the client discovering
    it in production.


    Most unit tests take less than ten minutes by themselves but will result in huge
    improvements in code quality and customer retention. One retained customer is
    well worth the cost of every unit test written; thus, they are immensely valuable
    to retaining customers and improving the quality of your software.


    Unit tests also improve quality by helping prevent regressions. There is nothing
    more frustrating than reporting a bug, which is fixed, only to reappear in the
    next version of the product. Users begin to think you are asleep at the switch
    or don''t know what you''re doing; typically, neither is true, but the situation
    could have been prevented if you had only written a unit test for the previous
    bug. Why? Because if you had a unit test in place, it would have failed before
    the product shipped, facilitating a fix and preventing the bug from shipping in
    the first place.


    # Unit Tests Show Higher-Ups that Work Is Being Done


    Unit tests make a great way to show higher level managers the amount of work being
    completed. While bugs closed make for good metrics, sometimes you come across
    a large bug that has multiple components. If you have a feature request that is
    open for two weeks, and it is the only ticket closed in those two weeks, it can
    appear that the team hasn''t done anything. This is where your second metric comes
    in: the unit testing report.


    Because unit tests produce a report, you can show this report to higher level
    managers and show them the progress being made. Unit tests show which tests have
    passed and failed; if you write them ahead of time, you will know how far you
    have gotten because the unit tests will start to pass (they should all fail if
    you write them before you have written any other code). This means that even if
    the ticket stays open for two weeks, you can show steady progress towards completion.


    Unit tests also make a great way to show a product manager that something is not
    ready to ship yet - or prove that something is, in fact, ready to place into production.
    Because you can print out a unit test report that shows failing tests, your product
    manager can immediately know that the product is not perfect, in an unambiguous
    way. It is hard to compete with the output of a unit test report, and the product'
