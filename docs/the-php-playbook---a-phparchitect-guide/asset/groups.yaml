    \ (56/56), 653.13 KiB | 799 KiB/s, done.\nResolving deltas: 100% (21/21), done.\n\
    ```\n\nGit initializes an empty repository in a directory of the same name as\
    \ the repository we are cloning, and then downloads the objects into the directory.\
