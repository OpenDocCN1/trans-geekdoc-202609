  md: "\n## Essential Subversion Syntax\n\nSubversion has a number of crucial commands\
    \ that aid developers in using it properly. These few commands are essential for\
    \ every developer using Subversion.\n\nIt is important to note that with Subversion,\
    \ all commands are prefixed with the `svn` executable name. Additionally, developers\
    \ can get help by typing `svn help` and they can get help on a specific command\
    \ by typing `svn help <command>`.\n\n### Getting a Working Copy\n\nIn order to\
    \ get a working copy, developers make use of the checkout command. Subversion\
    \ works by creating a local copy of the current revision (or the specified revision).\
    \ To get a copy of the latest revision, use the most basic version of the checkout:\n\
    \n```text\nsvn checkout svn://path/to/repository\n```\n\nDevelopers can specify\
    \ the path for the checkout by adding a second, optional argument that specifies\
    \ the path. If this second argument is absent, Subversion will create the working\
    \ copy in the current working directory. Additionally, unless a trailing slash\
    \ is added to the end of the repository path, the name of the directory in which\
    \ all the files are created will be named whatever the last directory in the repository\
    \ was. To check out a repository to a particular path, use the following command:\n\
    \n```text\nsvn checkout svn://path/to/repository /local/path/to/working/copy\n\
    ```\n\nFinally, developers can check out their repository from a particular revision\
    \ by adding an `@REV` option on the end:\n\n```text\nsvn checkout svn://path/to/repository@123\n\
    ```\n\nThe above command would check out revision 123 to the local working directory.\n\
    \n### Keeping the Working Copy Updated\n\nFrom time to time, other developers\
    \ may make revisions to the repository that are not reflected in your working\
    \ copy. In order to maintain an up-to-date working copy, the update command should\
    \ be used:\n\n```text\nsvn update\n```\n\nThe `svn help update` command will display\
    \ a number of options including updating to a particular revision, or updating\
    \ only a particular part of the working copy.\n\n### Managing the Working Copy\
    \ File Structure\n\nSubversion tracks changes to individual files: therefore,\
    \ when moving or changing files and directories, it is important to tell Subversion\
    \ what has been done, so that Subversion can associate the history with that move.\
    \ Subversion mimics the file system commands on Linux and UNIX, by offering `copy`,\
    \ `mv`, `rm`, and `mkdir` commands.\n\nEach works similarly to the UNIX equivalent,\
    \ and will make changes to the working copy’s change history, which will be committed\
    \ on your next commit.\n\n### Committing Changes to the Repository\n\nYou have\
    \ made some changes to your working copy; great! They are ready to go live. How\
    \ do we ensure that the changes you have made get committed? We can do so by making\
    \ use of the `status`, `add`, and `commit` commands.\n\nWhen we have untracked\
    \ files in our working copy, they show up with question marks next to them:\n\n\
    ```text\n$ svn status\n?        example.txt\n```\n\nIn order to commit this file\
    \ to the repository, we need to instruct Subversion to add this file:\n\n```text\n\
    $ svn add example.txt\nA        example.txt\n```\n\nNote that there is now an\
    \ “A” next to the example.txt file. This indicates that the file is staged for\
    \ committing. Next, we can commit this file:\n\n```text\n$ svn commit -m \"Initial\
    \ commit.\"\nAdding        example.txt\nTransmitting file data .\nCommitted revision\
    \ 1.\n```\n\nNote that I have committed the first revision to this repository.\
    \ Also note the `-m` flag that I executed along with the commit: this designates\
    \ to Subversion that we are adding a commit message. Developers should always\
    \ commit with a commit message. For most repositories, if one is not provided\
    \ they will be prompted in the editor of their choice to set one.\n\nNow imagine\
    \ that we make a bunch of changes to the example.txt file, and we run `svn status`\
    \ again:\n\n```text\n$ svn status\nM           example.txt\n```\n\nNow the file\
    \ has an “M” next to it, indicating that it has been changed since our last commit.\
    \ We no longer need to run the `svn add` command. This file, because it is tracked\
    \ by Subversion, will automatically be committed during our next commit.\n\nImagine\
    \ for the moment that the changes made to example.txt were inappropriate or wrong.\
    \ We are not forced to commit those changes, but instead we can roll them back\
    \ using `svn revert`:\n\n```text\n$ svn revert example.txt\nReverted 'example.txt'\n\
    ```\n\nNow a `svn status` command shows a clean working copy:\n\n```text\n$ svn\
    \ status\n$\n```\n\nIt is possible to revert a file to a particular revision.\
    \ Consult the `svn help revert` command for more documentation on how this operation\
    \ functions.\n\n### Reviewing History\n\nFrom time to time developers want to\
    \ see what commits were made against the repository. Developers can see a history\
    \ of commits with the `svn log` command:\n\n```text\n$ svn log\n------------------------------------------------------------------------\n\
    r70 | brandon | 2009-11-30 20:32:40 -0500 (Mon, 30 Nov 2009) | 1 line\n\nMoving\
    \ everything into trunk.\n------------------------------------------------------------------------\n\
    r69 | brandon | 2009-11-30 20:29:12 -0500 (Mon, 30 Nov 2009) | 1 line\n\nRemoving\
    \ lib; it’s an external and should not have been moved.\n------------------------------------------------------------------------\n\
    r68 | brandon | 2009-11-30 20:27:26 -0500 (Mon, 30 Nov 2009) | 1 line\n\nUpdating\
    \ the repo.\n------------------------------------------------------------------------\n\
    r67 | brandon | 2009-11-30 20:25:28 -0500 (Mon, 30 Nov 2009) | 1 line\n\nAdding\
    \ trunk directory.\n------------------------------------------------------------------------\n\
    ```\n\nThe `svn log` command is useful for seeing the commit messages, and has\
    \ many useful features, like limiting the revision number and seeing lots of extra\
    \ data:\n\n```text\n$ svn log -l 1 -v\n------------------------------------------------------------------------\n\
    r70 | brandon | 2009-11-30 20:32:40 -0500 (Mon, 30 Nov 2009) | 1 line\nChanged\
    \ paths:\n   M /financials\n   D /financials/files\n   D /financials/install\n\
    \   D /financials/logs\n   M /financials/trunk\n   A /financials/trunk/webapp\
    \ (from /financials/webapp:69)\n   D /financials/webapp\n\nMoving everything into\
    \ trunk.\n------------------------------------------------------------------------\n\
    ```\n\nFor example, in the above command we limited output to one entry (which\
    \ is going to be the last revision) and asked it to be verbose, which listed the\
    \ files that were changed in that particular commit.\n\nSubversion also makes\
    \ it easy to see *who* changed the file, and in fact, the *lines* that were changed.\
    \ This command has several aliases: `blame`, `praise`, and `annotate`. The purpose\
    \ is to show each line of a file, and who was responsible for editing it.\n\n\
    ```text\n$ svn annotate example.txt\n    2    brandon Lots of new changes.\n```\n\
    \nThis shows that in revision 2, user “brandon” (that would be me) changed the\
    \ first line to read “Lots of new changes.” This can be useful for determining\
    \ when, where, and by whom a bug was introduced in the code, or for seeing what\
    \ changes were made by a user line-by-line.\n\n## Essential Git Syntax\n\nJust\
    \ like with Subversion, Git also has a number of commands that will aid developers\
    \ in using it properly.\n\n### Setting Up a New Git Repository\n\nThere are two\
    \ ways to get a new Git repository: either clone an existing Git repository or\
    \ initialize one in a current directory.\n\nTo clone a repository, we use the\
    \ `git clone` command:\n\n```text\n$ git clone git@github.com:brandonsavage/developersplaybook.git\n\
    Initialized empty Git repository in /Users/brandon/developersplaybook/.git/\n\
    remote: Counting objects: 56, done.\nremote: Compressing objects: 100% (53/53),\
