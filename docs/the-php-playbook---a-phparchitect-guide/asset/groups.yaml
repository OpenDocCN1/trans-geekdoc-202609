  mdcn: "\n## 第2章\n### 测试驱动开发\n\n大多数在软件开发领域待过一段时间的开发者，都听说过“单元测试”这个词，它被用来描述一种针对正在开发中的软件的特定测试方法。他们甚至可能听说过“测试驱动开发”这一原则，简而言之，其理念是在为实际项目编写任何代码之前，先编写测试。\n\
    \n测试的问题在于，它非常像遵守限速规定：每个人都知道应该那么做，但真正去做的人却寥寥无几（而那些坚持要做的人还会惹恼我们其他人）。然而，测试不仅仅是软件开发中一个令人讨厌的障碍：它是软件开发和实现中的关键组成部分。\n\
    \n为什么单元测试如此关键？随着系统变得越来越庞大，会发生两件事：第一，任何单个开发者都不可能完全彻底地掌握当前系统的所有细微之处。第二，随着这种情况的发生，越来越多的开发者在修改和重构现有代码，这几乎注定在某个环节会有人做出改动，导致应用程序以某种方式变得不可用（即回归）。\n\
    \n单元测试可以通过向你展示代码在何处以及为何失败来帮助防止这种情况。虽然单元测试无法修复每一个bug或防止每一次回归，但它们可以在缺陷进入生产环境之前，指出应用程序逻辑或重构策略中的问题。\n\
    \n在我们开始本节之前，必须安装PHPUnit。推荐的安装方法是使用PEAR；通过PEAR安装意味着PHPUnit会自动安装其命令行应用程序，并确保PHPUnit位于include\
    \ path中（除非我们修改了include path以移除PEAR目录）。此外，通过PEAR安装意味着我们可以轻松地将PHPUnit更新到最新版本，而PHPUnit的作者塞巴斯蒂安·伯格曼正在定期发布PHPUnit的升级和新功能，使得升级非常值得。\n\
    \n按照从PEAR安装PHPUnit¹的说明进行操作。安装PHPUnit之后，有一些术语我们需要熟悉。单元测试是针对特定代码块（通常是函数或方法）运行的测试。该单元测试运行这段代码，然后对代码块应返回的结果进行断言——也就是说，断言运行该代码块后应产生的值、类型或行为。\n\
    \n以下是为PHPUnit编写的完整单元测试：\n\n```\nrequire_once 'PHPUnit/Framework.php';\n\nclass\
    \ ArrayTest extends PHPUnit_Framework_TestCase {\n    public function testIsArray()\
    \ {\n        $item = array();\n        $item2 = false;\n        $item2 = (array)\
    \ $item2;\n        $this->assertType(\"array\", $item);\n        $this->assertType(\"\
    array\", $item2);\n    }\n}\n```\n\n在这个测试中，我们需要注意一些事项。首先，类名是`ArrayTest`；这采用了将测试类命名为`*Test`的惯例，如果你在测试一个类（例如名为`Login`的类），你应该将测试命名为`LoginTest`。\n\
    \n我们类中的所有测试方法都命名为`test*`（例如，我们有`testIsArray()`）。PHPUnit就是这样找到测试并执行它们的。没有这些命名，PHPUnit就不会运行我们的单元测试。PHPUnit使用反射来确定要执行哪些方法。\n\
    \n还要注意，测试类继承自`PHPUnit_Framework_TestCase`。这是测试用例类，包含了正确生成和运行测试用例所需的所有方法。\n\n如前所述，在开始编写测试时，人们很容易只编写一个单一的方法来测试唯一的入口点，然后判断整个类是否正常工作。重要的是要避免这样做；那更像是一种“功能测试”——即对功能的测试。我们要测试的是独立的代码单元——即方法本身——这意味着我们要避免编写功能测试，而是测试“单元”，通常是方法。\n\
    \n这个简要介绍应该能作为编写测试的指南；PHPUnit手册更为深入且保持更新。PHPUnit仍在开发中；虽然本书写作时使用的是PHPUnit 3.4版本，但可能会有影响这些指南准确性的变更。\n\
    \n### 当没有时间安排测试时如何测试\n\n因为测试需要额外的时间，许多管理者觉得它不重要，更糟糕的是，可能认为这是妨碍他们按时交付项目的“繁文缛节”。这并不罕见；管理者越不懂技术，就越看不到单元测试的好处。\n\
    \n然而，优秀的开发者仍然可以找到时间编写这些测试。由于开发者在估算过程和bug修复过程中通常有相当程度的影响力，他们可以采用一些策略来提高编写良好单元测试的机会。\n\
    \n### 控制时间估算\n\n大多数开发者都在估算过程中扮演一定角色。即使是在最糟糕的开发环境中，项目经理也必须依靠开发者的判断来合理制定进度，这需要开发者进行估算。\n\
    \n优秀的开发者会利用这一点。他们了解事情需要多长时间，以及在灾难性故障的情况下又需要多长时间，通常会选择一个介于两者之间的数字来让项目经理满意。良好的估算意味着你既能满足管理者，又能以高质量的方式完成工作。\n\
    \n如果估算是你工作的核心组成部分，而且你在估算中拥有100%的自主权，那么你实际上可以把测试时间算进去。到了计算估算的时候，把编写测试的时间算进去，把这个时间留在最终估算中，但不要标注出来是用于单元测试的。\n\
    \n有些人可能会觉得这有点不诚实；事实上，它看起来确实如此。然而，适当的单元测试是完成项目的重要组成部分，无论项目经理是否会试图将其砍掉。单元测试是工作的一部分。\n\
    \n通过正确估算并提供一个包含单元测试时间的估算，你就能在不牺牲成品质量的情况下，自动将单元测试纳入你的进度安排。\n\n### 为每个Bug编写单元测试\n\
    \nweb2project团队的家伙们用来提高测试覆盖率的一个策略是：每一个被修复的bug都必须附带一个测试该代码的单元测试。这实现了两件事：第一，它让他们能够以编程的方式展示这个bug（意味着他们对修复有一个前后对比的视图）；第二，它迫使他们为大量产品编写测试覆盖。\n\
    \n论证编写一个能在bug修复时显示结果的测试是很容易的：既然单元测试本质上是对逻辑的测试，断言特定的结果，那么你的单元测试就是bug已解决的有力证据。最终结果是，你最终会得到大量针对代码中特定bug的单元测试，同时也确保你之后做的任何重构不会重新引入那些可能损害应用程序的bug。\n\
    \n大多数时候，你甚至不需要很多时间就能用这种方法编写单元测试。证明代码中存在bug相当容易——如果你断言了预期的结果，却得到了不同的结果，单元测试就会失败。通常这些测试的编写时间不到30分钟（任何单独编写就需要超过30分钟的测试，可能本身也太大了）。\n\
    \n当你有一个缺乏单元测试的大型现有代码库时，这种策略也非常出色。随着你在修复bug时编写测试，你会逐渐提高覆盖率。随着时间的推移，你的覆盖率会不断提高，直到达到或接近100%。\n\
    \n"
