    the original item to be executed regardless; this condition would obviously introduce
    a significant bug.


    Joel Spolsky once wrote an article called “Making Wrong Code Look Wrong” in which
    he argues that developers can designate between unsafe and safe (unclean and clean)
    variables in code. This helps prevent security problems, and might also help prevent
    bugs in code.


    Another strategy suggested by some is the reversal of the order in which items
    are compared in if-else statements, generating a fatal error in the event that
    a developer uses the wrong symbol. For example:


    ```php

    if($var = count($array)) { ... }

    ```


    This is clearly wrong - in this if statement we are assigning the value, which
    will always return true, but that is obviously not the point of the if-else statement.


    Instead, we meant to use a double-equals (==) to evaluate whether the variable
    $var was equivalent to the count($array) result.


    ```php

    if(count($array) = $var) { ... }

    ```


    The fatal error would help us to realize that we had omitted the double-equals
    required to evaluate, and instead we would realize we were attempting to assign,
    resulting in the error.


    One of the easiest ways to enforce coding standards is to make use of something
    like PHP_CodeSniffer. This PEAR package can be integrated into continuous integration
    servers like PHPUnderControl, which will produce regular reports about compliance
    with your coding standards. PHP_CodeSniffer examines your code against a specified
    set of rules, and flags errors in that code for review. It can be as lenient or
    as strict as you like. There are several standards already developed for use with
    it, and developers can develop their own set of standards as well.


    There are many resources available to help developers create a coding standard
    that fits their needs. Some existing ones will automatically fit the bill, at
    other times developers will want to adopt a coding standard to fit themselves
    or their needs. Whatever approach is taken, developers should simply ensure that
    the coding standard of their choice is followed and applied to all new code written,
    and all old code maintained, to ensure future compliance with such a standard
    for ease of reading and prevention of bugs.


    ## Chapter 9


    ### Becoming a Happy Developer


    Development is a great trade to be in. It is growing, and people have a great
    amount of respect for those that can “do things” with computers. There are new
    openings every day for skilled developers, and becoming a highly skilled PHP developer
    will bode well for future career opportunities.


    Having a job in development, though, is not always the same thing as being happy
    in development. There are a number of factors that contribute strongly to whether
    or not a developer is happy at what they are doing. Some of these items, including
    version control and testing have been discussed in this book to this point. Others
    like effective issue tracking, spec development and quiet working conditions have
    not been discussed in very much detail to this point.


    This chapter focuses on some of these “soft skills” that help contribute to happy,
    healthy developers that love their work environments and help produce exceptional
    code day in and day out.


    ### The Importance of Quiet


    In what has turned into a pervasive trend, developers at the entry, mid and even
    senior levels are finding themselves thrust into open bullpens or cubicle farms,
    devoid of sound dampening barriers like walls and office doors. Startups with
    fancy, vowel-devoid names corral their developers to “improve communication” or


    built, and *how* it will function. Therefore, an annotated wireframe is technically
    a complete specification, provided it highlights the demands, desires and needs
    of the individuals compiling it.


    I have worked on many teams before: the “we don’t have a plan; let’s go by the
    seat of our pants and do ''agile''”, as well as the “here’s a long tome that compiles
    all of our needs and took six months to write.” In my experience, the easiest
    teams to work on were the ones who said “here’s a wireframe, build this.” It makes
    it easier to innovate (because the developer decides how the button works and
    what features to add) while also making it easy to deliver a useful product to
    the rest of the team.


    Development requires some degree of planning. Failing to plan is planning to fail.
    Developers should insist on a basic level of spec development, even if it is a
    complete wireframe.


    ### Effective Issue Tracking


    Think back quickly to your first project: how much do you remember about the way
    you implemented it or the bugs you found but never fixed? Chances are good there
    is a limited amount of memory devoted to that particular project. In fact, it
    is possible you may not even remember (or care to remember) it at all.


    The reality is that human beings can only remember so much. Studies show we can
    only do a few things at a time, and when we start doing more than one our attention
    to all of them takes a hit. Given our imperfect ability to remember things, it
    is of vital importance that we learn to write things down to aid in our memories.


    Nowhere is this more important than in the tracking of issues, feature requests
    and bugs associated with our products. Consider: it is possible that for a medium-sized
    project there may be 100 outstanding bugs, tasks and feature requests. No one
    person, no matter their memory skills, can remember them all, resulting in issues
    going unresolved into future releases.


    Effective bug tracking is a key component of being a happy developer. Once all
    issues are dumped into a tracker of some kind the mind is freed to start working
    on other things, one at a time. Furthermore, tracking issues is like creating
    shared memory: it is possible to share the issues with other developers, who can
    address them, improving productivity and reducing the workload.

