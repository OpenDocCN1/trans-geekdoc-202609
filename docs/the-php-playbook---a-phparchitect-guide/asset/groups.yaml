    \n## 为可测试性重构\n\n在本章前面，我们讨论过重构只应在已经构建了健壮的测试套件并设计用于测试被重构应用的情况下进行。然而，从我们的示例中可以明显看出，并没有明显的单元测试。原因有几个，但最大的一个原因是这段代码在很大程度上是不可测试的。\n\
