    # Essential Subversion Syntax


    Subversion has a number of crucial commands that aid developers in using it properly.
    These few commands are essential for every developer using Subversion.


    It is important to note that with Subversion, all commands are prefixed with the
    svn executable name. Additionally, developers can get help by typing svn help
    and they can get help on a specific command by typing svn help < command>.


    # Getting a Working Copy


    In order to get a working copy, developers make use of the checkout command. Subversion
    works by creating a local copy of the current revision (or the specified revision).
    To get a copy of the latest revision, use the most basic version of the checkout


    ```

    svn checkout svn://path/to/repository

    ```


    Developers can specify the path for the checkout by adding a second, optional
    argument that specifies the path. If this second argument is absent, Subversion
    will create the working copy in the current working directory. Additionally, unless
    a trailing slash is added to the end of the repository path, the name of the directory
    in which all the files are created will be named whatever the last directory in
    the repository was. To check out a repository to a particular path, use the following
    command:


    ```

    svn checkout svn://path/to/repository /local/path/to/working/copy

    ```


    Finally, developers can check out their repository from a particular revision
    by adding an @REV option on the end:


    ```

    svn checkout svn://path/to/repository@123

    ```


    The above command would check out revision 123 to the local working directory.'
