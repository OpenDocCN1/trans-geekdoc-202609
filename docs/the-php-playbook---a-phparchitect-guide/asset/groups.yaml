  mdcn: "\n最后，单元测试可以通过减少出现的关键错误数量来节省资金。通过让开发人员编写测试，特别是提前编写，他们可以加入安全测试，这意味着在产品发布前，其代码必须符合安全要求。如果引入了新的安全漏洞，代码将导致单元测试失败，从而在这些漏洞被意外发现或在野外被发现之前提醒你存在可能非常危险的漏洞。\n\
    \n通过采用上一节中的策略，你还可以指出单元测试并不一定需要大量的时间和资金投入才能实现。相反，通过针对你已有的代码库逐步编写单元测试，并针对正在集成的新的功能编写测试，你可以证明单元测试可以立即开始，并纳入未来的产品和版本，而无需为现有应用程序的代码编写测试。\n\
    \n## 单元测试提高软件质量\n\n虽然我们在关于节省资金的部分中简要提到了这一点，但单元测试可以提高软件质量。管理者通常对质量的关注程度几乎与节省资金一样；最终结果是，你应该能够为通过使用单元测试提高软件质量做出有力的论证。\n\
    \n软件质量本质上是两个因素的函数：首先，软件满足用户需求的程度；其次，用户向开发人员报告的错误数量。有些用户报告的错误永远无法通过单元测试捕获。例如，用户界面错误或可用性错误总是会被提交。然而，像“提交表单不会更改值”这样的错误是可以测试并在软件发布前解决的。\n\
    \n人们众所周知，用户讨厌有缺陷的软件产品；他们拒绝使用它们，或无情地嘲笑它们。微软在发布 Microsoft Word 时学到了这一点；该版本糟糕透顶，漏洞百出，用户痛恨它。\n\
    \n当你的产品漏洞百出时，你的用户会讨厌该产品。最终结果是，如果他们能够做到，他们会用其他产品替代它。不要让这种情况发生在你身上。通过在错误报告到来时以及在错误报告到来之前编写单元测试，你将有最好的机会防止错误被构建到你的系统中。你将能够捕获像“存储数据因为你忘记保存它”这样的错误，而不是让客户在生产环境中发现它。\n\
    \n大多数单元测试本身不到十分钟，但会带来代码质量和客户保留率的巨大改善。一个被保留的客户完全值得每一项编写的单元测试的成本；因此，它们对保留客户和提高软件质量具有极大的价值。\n\
    \n单元测试还通过帮助防止回归来提高质量。没有什么比报告一个错误、该错误被修复、然后在产品的下一个版本中再次出现更令人沮丧的了。用户开始认为你无所作为或不知道自己在做什么；通常两者都不是真的，但如果当时你为之前的错误编写了单元测试，这种情况本可以避免。为什么？因为如果你有单元测试到位，它会在产品发布前失败，从而促进修复并防止错误首先被发布。\n\
    \n## 单元测试向高层展示工作正在进行\n\n单元测试是向高级管理人员展示已完成工作量的绝佳方式。虽然已关闭的错误是很好的指标，但有时你会遇到具有多个组件的大错误。如果你有一个开放了两周的功能请求，并且在那两周内它是唯一关闭的工单，看起来团队什么也没做。这就是你的第二个指标发挥作用的地方：单元测试报告。\n\
    \n因为单元测试会生成报告，你可以向高级管理人员展示这份报告并向他们展示正在取得的进展。单元测试显示哪些测试通过了哪些失败了；如果你提前编写它们，你将知道进展如何，因为单元测试会开始通过（如果你在编写任何其他代码之前编写它们，它们都应该失败）。这意味着即使工单开放两周，你也可以展示稳步向完成的进展。\n\
    \n单元测试也是向产品经理展示某些东西尚未准备好发布——或证明某些东西确实已准备好投入生产——的绝佳方式。因为你可以打印出显示失败测试的单元测试报告，你的产品经理可以立即明确地知道产品并不完美。与单元测试报告的输出相比，很难竞争，而且产品\n\
    \n分析是应用程序开发中极其关键的组成部分。如果没有分析，试图优化的应用程序开发人员就像在黑暗中投飞镖，无法看到飞镖落在哪里。换句话说，没有分析的优化几乎毫无用处。\n\
    \n我们在第1章中讨论过分析，当时我们谈到了 Xdebug。一旦你在应用程序上运行了分析器，你将处于更好地理解正在发生的事情以及如何改进的地位。但任何看过\
    \ cachegrind.out 文件的开发人员都知道它们对人类来说无法阅读。\n\n为了理解 cachegrind 文件，你需要安装一个为你解释它的应用程序。存在许多应用程序，包括适用于\
    \ Linux 的 KCachegrind 和适用于 Mac 的 MacCallGrind（非免费）。这些应用程序通常会创建 cachegrind 文件的可视化表示，显示瓶颈并以生动、直观的方式解释执行花费最多时间的内容。请参阅图\
    \ 3.1，它是 WordPress 的 cachegrind 输出。\n\n![](img/1e822896c7e27b27bbae30ac1e4ebc2b_42_0.png)\n\
    \n图 3.1\n\n该文件显示了 WordPress 中执行时间最长的项目。根据你自己的 cachegrind 文件，你将能够看到瓶颈所在，并能够形成关于如何解决它们的更清晰的图景。\n\
    \n分析使我们能够确切地知道应用程序的哪些区域是瓶颈。如果不先进行分析，我们就不知道应用程序的哪些区域实际上需要优化。这可能导致大量挫败感、原本不需要进行的重构，以及最坏情况下，由试图优化的人引入错误。分析是制定优化策略的关键组成部分，它帮助我们确切地知道要关注哪些区域，就像外科医生使用诊断测试来确定医疗治疗的重点一样。\n\
    \n当你开始分析你的应用程序时，三个区域可能会成为最大的瓶颈：数据库、在重复块（如循环）中执行的代码，以及一般的代码效率低下。让我们看看如何处理这三者。\n\
    \n## 优化数据库查询\n\n许多开发人员面临着一个始终存在的挑战：他们的应用程序需要是动态的，但数据库更常以瓶颈的形式带来挑战。数据库只能如此快速地处理这么多信息。数据库包含的信息越多，执行即使是简单查询所需的时间也越长。但开发人员可以做一些事情来改善数据库性能。\n\
    \n开发人员对抗数据库缓慢的最有力武器是 EXPLAIN SQL 命令。PHP 开发人员最流行的数据库（Postgres 和 MySQL）都实现了 EXPLAIN；这意味着无论平台如何，开发人员都可以理解他们的\
    \ SQL 查询的工作方式。\n\nEXPLAIN 通过显示数据库引擎打算如何解决特定问题来工作。它将显示有关连接、索引、逻辑、效率低下和其他有助于提高性能的重要项目的信息。\n\
    \n想象一下，你正在构建一个使用简单 LEFT JOIN 的应用程序，该连接运行效率低下。你的 SQL 查询如下：\n\n```\nSELECT * FROM\
    \ guests LEFT JOIN record ON record.id = guests.id WHERE guests.\n    firstname\
