  - '[PAGE 136]


    In many cases, this will result in a developer simply diving into a project and
    writing code without having developed a plan, architecting the product, or thinking
    through the implications of design choices they are now making on the fly. This
    is dangerous, because it inhibits the inclusion of security measures, ensures
    that massive amounts of refactoring will be necessary when changes are needed,
    and ultimately will end up delaying the product past any deadline the developer
    might have insisted he could meet.


    The problem here is that any software development process expert would tell that
    developer that design is not an inconvenient waste of time; but actually requires
    a greater portion of the time than is required by the actual programming. This
    might seem strange; however, according to the author of “The Mythical Man Month”,
    the following is the breakdown of a proper application development cycle:


    +   - 1/3rd planning

    +   - 1/6th coding

    +   - 1/4th early testing

    +   - 1/4th complete application testing, once all components delivered


    In other words, only 17% of the application development is spent writing code.
    A full third of the time is spent planning the application, designing it, architecting
    it, getting feedback from stakeholders and planning out exactly what will be written,
    by whom, and by when.


    An odd reality that I have become familiar with is that software development is
    going to take as long as it is going to take. There is nothing you can do to speed
    the process. If the process was meant to take six weeks and you try to compress
    it into four weeks, you will spend those extra two weeks playing catch-up no matter
    what. You cannot ignore the 1/3 planning time, or the 1/2 testing time, because
    the application will have bugs and will delay the deadline to the point where
    you will have ultimately spent that amount of time fixing it. The proportions
    here have an eerie way of being dead-on right.


    Developers who realize this have an easier time than those who do not. They know
    that they have to take the time to properly develop their applications, and as
    such they spend time in design. They step back, architect how the application
    will work,'
