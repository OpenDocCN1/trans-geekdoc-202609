    Chapter 4: Supervised Learning: Regression


    Regression is a type of supervised learning where the goal is to predict a continuous
    outcome variable based on one or more input features. In this chapter, we''ll
    explore various regression techniques, their mathematical foundations, implementation,
    and applications.


    ### 4.1 Linear Regression


    Linear regression is the simplest and most widely used regression technique. It
    models the relationship between the dependent variable and one or more independent
    variables using a linear equation.


    ## 4.1.1 Simple Linear Regression


    Simple linear regression involves one independent variable and one dependent variable.


    Mathematical representation: y = β₀ + β₁x + ε


    Where:


    *   y is the dependent variable


    *   x is the independent variable


    *   β₀ is the y-intercept


    *   β₁ is the slope


    *   ε is the error term


    Example: Predicting house prices based on square footage


    python


    Copy


    import numpy as np


    import pandas as pd


    import matplotlib.pyplot as plt


    from sklearn.model\_selection import train\_test\_split


    from sklearn.linear\_model import LinearRegression


    from sklearn.metrics import mean\_squared\_error, r2\_score


    \# Load the data


    df = pd.read\_csv(''house\_data.csv'')


    \# Prepare the data


    X = df\[''sqft\_living''\].values.reshape(-1, 1)


    y = df\[''price''\].values


    \# Split the data


    X\_train, X\_test, y\_train, y\_test = train\_test\_split(X, y, test\_size=0.2,
    random\_state=42)


    \# Create and train the model


    model = LinearRegression()


    model.fit(X\_train, y\_train)


    \# Make predictions


    y\_pred = model.predict(X\_test)


    \# Evaluate the model


    mse = mean\_squared\_error(y\_test, y\_pred)


    r2 = r2\_score(y\_test, y\_pred)


    print(f"Mean Squared Error: {mse}")


    print(f"R-squared: {r2}")


    \# Visualize the results


    plt.scatter(X\_test, y\_test, color=''blue'', alpha=0.5)


    plt.plot(X\_test, y\_pred, color=''red'', linewidth=2)


    plt.xlabel(''Square Footage'')


    plt.ylabel(''Price'')


    plt.title(''Simple Linear Regression: House Price vs Square Footage'')


    plt.show()


    ## 4.1.2 Multiple Linear Regression


    Multiple linear regression involves two or more independent variables.


    Mathematical representation: y = β₀ + β₁x₁ + β₂x₂ + ... + βₙxₙ + ε


    Example: Predicting house prices based on multiple features


    python


