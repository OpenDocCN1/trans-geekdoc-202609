    The Bias-Variance Trade-off is a critical concept in understanding the performance
    of machine learning models. It refers to the trade-off between two types of errors
    that affect model performance:


    ### 1. Bias


    * Bias refers to the error due to the model''s assumptions or oversimplification.
    A high-bias model assumes too much about the underlying data patterns, which leads
    to underfitting (i.e., poor performance on both training and test data).


    Example: A linear regression model trying to fit a dataset with a complex, nonlinear
    relationship would have high bias because it assumes that the relationship is
    linear.


    ### 2. Variance

