    \ in non-linear relationships.\n\n#### t-SNE (t-Distributed Stochastic Neighbour\
    \ Embedding)\n\n`t-SNE` is a non-linear dimensionality reduction technique particularly\
    \ well-suited for visualizing high-dimensional data. Unlike `PCA`, which seeks\
    \ to preserve global structure, `t-SNE` focuses on preserving local relationships\
    \ between data points. It does this by modelling the similarity between points\
    \ in high-dimensional space and mapping them to a lower-dimensional space (typically\
    \ 2D or 3D).\n\n* Local Structure: `t-SNE` excels at capturing local groupings\
    \ in data, making it ideal for visualizing clusters.\n* Distance Preserving: It\
    \ attempts to map high-dimensional distances to low-dimensional ones while minimizing\
    \ the distortion of those distances.\n\nExample: `t-SNE` is commonly used in image\
    \ recognition tasks to visualize how different images relate to each other. For\
    \ instance, in a dataset of handwritten digits, `t-SNE` can reduce the high-dimensional\
    \ pixel data to a 2D map where similar digits are clustered together, making it\
    \ easier to visualize the groupings of different digit classes.\n\nAdvantages:\n\
    * Captures non-linear relationships.\n* Excellent for visualizing clusters in\
    \ high-dimensional data.\n\nDisadvantages:\n* Computationally expensive for large\
    \ datasets.\n* Sensitive to hyperparameter tuning (especially perplexity).\n*\
    \ The results can vary between runs due to randomness in the algorithm.\n\n###\
    \ 3. Association Rule Learning\n\nAssociation Rule Learning is a technique used\
    \ to find interesting relationships or associations between variables in large\
    \ datasets. It is most commonly used in market basket analysis, where the goal\
    \ is to identify which items are frequently purchased together.\n\n#### Apriori\
    \ Algorithm\n\nThe `Apriori` algorithm is a classic method used for association\
    \ rule learning. It operates by finding frequent itemset in the data (i.e., groups\
    \ of items that appear together frequently) and then generating rules based on\
    \ these itemset. The algorithm uses a bottom-up approach, where it starts with\
    \ single items and progressively builds larger itemset by checking for frequent\
    \ patterns.\n\n* Support: The support of an itemset refers to the proportion of\
    \ transactions in which the itemset appears.\n* Confidence: The confidence of\
    \ a rule refers to the likelihood that the consequent of the rule occurs given\
    \ that the antecedent has occurred.\n* Lift: Lift measures the strength of a rule\
    \ compared to how often the consequent occurs independently. A lift greater than\
    \ 1 indicates a strong association.\n\nExample: In a supermarket, the `Apriori`\
    \ algorithm can be used to discover rules such as \"if a customer buys bread and\
    \ butter, they are likely to buy milk.\" These rules can be used for cross-selling\
    \ and recommendation strategies, such as placing milk near the bread and butter\
    \ in the store.\n\nAdvantages of the `Apriori` Algorithm:\n* Provides interpretable\
    \ rules that can be used for decision-making.\n* Widely used in market basket\
    \ analysis and recommendation systems.\n\nDisadvantages:\n* Computationally expensive,\
    \ especially with large datasets.\n* May generate a large number of rules, many\
    \ of which are irrelevant.\n\n### FP-Growth Algorithm\n\nThe `FP-Growth` (Frequent\
    \ Pattern Growth) algorithm is an efficient alternative to the `Apriori` algorithm\
    \ for mining frequent itemset in large datasets. While `Apriori` can be computationally\
    \ expensive because it generates a large number of candidates itemset and repeatedly\
    \ scans the dataset, `FP-Growth` avoids this by using a more compact data structure\
    \ called the `FP-tree` (Frequent Pattern Tree).\n\n#### How FP-Growth Works:\n\
    1. Building the FP-Tree:\n   * The first step is to scan the dataset and identify\
    \ frequent items (items that meet a minimum support threshold).\n"
  trans: "\n\n示例：在生物学中，层次聚类可用于根据遗传相似性对物种进行分组。树状图将说明物种之间的关系，关系密切的物种会在聚类过程中更早地被归为一组。\n\
    \n优点：\n* 无需指定聚类数量。\n* 生成树状图，提供不同粒度水平下数据结构的洞察。\n\n缺点：\n* 对大型数据集计算成本高。\n* 对噪声和异常值敏感，尤其是在凝聚聚类中。\n\
    \n#### DBSCAN（基于密度的噪声应用空间聚类）\n\n`DBSCAN` 是一种基于密度的聚类算法，它将彼此紧密聚集的数据点（基于距离度量）分组，并将位于低密度区域的孤立点标记为异常值。\n\
    \n* 核心点：指定半径内具有最小邻居数量的点被视为核心点。\n* 边界点：位于核心点半径范围内的点，但邻居不足以被视为核心点本身。\n* 噪声点：不落在任何核心点半径范围内的点被视为噪声或异常值。\n\
    \n`DBSCAN` 无需预先指定聚类数量，并且可以发现任意形状的聚类。\n\n示例：`DBSCAN` 在检测网络流量异常方面很有用。例如，在网络安全中，`DBSCAN`\
    \ 可用于识别可能表明恶意行为的异常流量模式。合法流量会形成密集的聚类，而异常流量将被标记为噪声或异常值。\n\n优点：\n* 可以找到任意形状的聚类。\n\
    * 对噪声和异常值具有鲁棒性。\n* 无需预先指定聚类数量。\n\n缺点：\n* 在密度变化的数据集上表现不佳。\n* 对超参数选择敏感（例如，半径和最小点数）。\n\
    \n### 2. 降维\n\n在许多现实世界的数据集中，特征（或维度）的数量可能非常庞大，使得难以有效地可视化、分析和建模数据。降维技术用于在保留数据底层结构和重要模式的同时减少特征数量。这不仅简化了数据集，还可以通过去除噪声和冗余信息来提高机器学习算法的性能。\n\
    \n#### 主成分分析（PCA）\n\n`PCA` 是一种线性降维技术，它将数据转换到新的坐标系中，其中轴（称为主成分）对应于数据中方差最大的方向。第一个主成分捕获最多的方差，第二个捕获第二多的方差，以此类推。通过只保留前几个主成分，我们可以在保留数据大部分重要信息的同时降低数据的维度。\n\
    \n`PCA` 的步骤：\n1. 标准化数据（中心化和缩放）。\n2. 计算数据的协方差矩阵。\n3. 执行特征值分解以找到特征向量和特征值。\n4. 特征向量是主成分，特征值表示每个成分解释的方差量。\n\
    5. 选择前 K 个主成分以降低维度。\n\n示例：在基因组学中，研究人员经常处理具有数千个基因作为特征的数据集。`PCA` 可用于在保留数据变异的关键模式的同时减少特征数量。例如，`PCA`\
    \ 可能会将数据从 10,000 个基因减少到仅 10 个主成分，使数据更易于分析和可视化。\n\n`PCA` 的优点：\n* 在保留方差的同时降低维度。\n\
    * 有助于高维数据的可视化。\n* 通过减少噪声可以提高机器学习模型的性能。\n\n缺点：\n* 假设变量之间存在线性关系。\n* 当重要信息存在于非线性关系中时可能表现不佳。\n\
    \n#### t-SNE（t-分布随机邻域嵌入）\n\n`t-SNE` 是一种非线性降维技术，特别适合可视化高维数据。与寻求保留全局结构的 `PCA` 不同，`t-SNE`\
    \ 专注于保留数据点之间的局部关系。它通过对高维空间中点之间的相似性建模并将其映射到低维空间（通常为 2D 或 3D）来实现这一点。\n\n* 局部结构：`t-SNE`\
    \ 在捕获数据中的局部分组方面表现出色，使其成为可视化聚类的理想选择。\n* 距离保持：它试图将高维距离映射到低维距离，同时最小化这些距离的失真。\n\n\
    示例：`t-SNE` 通常用于图像识别任务，以可视化不同图像之间的关系。例如，在手写数字的数据集中，`t-SNE` 可以将高维像素数据减少到 2D 地图，其中相似的数字聚在一起，更容易可视化不同数字类别的分组。\n\
    \n优点：\n* 捕获非线性关系。\n* 非常适合可视化高维数据中的聚类。\n\n缺点：\n* 对大型数据集计算成本高。\n* 对超参数调优敏感（尤其是困惑度）。\n\
    * 由于算法中的随机性，结果在不同运行之间可能有所不同。\n\n### 3. 关联规则学习\n\n关联规则学习是一种用于在大规模数据集中发现变量之间有趣关系或关联的技术。它最常用于市场篮子分析，其目标是识别经常一起购买的商品。\n\
    \n#### Apriori 算法\n\n`Apriori` 算法是用于关联规则学习的一种经典方法。它通过在数据中查找频繁项集（即经常一起出现的项目组）然后基于这些项集生成规则来运行。该算法使用自底向上的方法，从单个项目开始，逐步构建更大的项集，通过检查频繁模式。\n\
    \n* 支持：项集的支持度是指该项集出现在交易中的比例。\n* 置信度：规则的置信度是指在前提已发生的情况下结论发生的可能性。\n* 提升度：提升度衡量规则的强度与结论独立发生的频率相比。提升度大于\
    \ 1 表示关联性强。\n\n示例：在超市中，`Apriori` 算法可用于发现诸如“如果顾客购买面包和黄油，他们很可能会购买牛奶”之类的规则。这些规则可用于交叉销售和推荐策略，例如将牛奶放置在面包和黄油附近。\n\
    \n`Apriori` 算法的优点：\n* 提供可解释的规则，可用于决策。\n* 广泛用于市场篮子分析和推荐系统。\n\n缺点：\n* 计算成本高，尤其是在大型数据集上。\n\
    * 可能生成大量规则，其中许多不相关。\n\n### FP-Growth 算法\n\n`FP-Growth`（频繁模式增长）算法是用于挖掘大型数据集中频繁项集的\
    \ `Apriori` 算法的一种高效替代方案。虽然 `Apriori` 由于生成大量候选项集并反复扫描数据集而在计算上可能很昂贵，但 `FP-Growth`\
    \ 通过使用更紧凑的数据结构 `FP-tree`（频繁模式树）避免了这种情况。\n\n#### FP-Growth 的工作原理：\n1. 构建 FP-Tree：\n\
    \   * 第一步是扫描数据集并识别频繁项目（满足最小支持阈值的项目）。\n\n"
