    ## 5.1.2 Multiclass Logistic Regression


    For multiclass problems, we use techniques like one-vs-rest (OvR) or softmax regression.


    Example: Predicting iris flower species


    python


    Copy


    from sklearn.datasets import load\_iris


    from sklearn.linear\_model import LogisticRegression


    from sklearn.model\_selection import train\_test\_split


    from sklearn.metrics import accuracy\_score, confusion\_matrix, classification\_report


    \# Load the iris dataset


    iris = load\_iris()


    X = iris.data


    y = iris.target


    \# Split the data


    X\_train, X\_test, y\_train, y\_test = train\_test\_split(X, y, test\_size=0.2,
    random\_state=42)


    \# Create and train the model


    model = LogisticRegression(multi\_class=''ovr'')


    model.fit(X\_train, y\_train)


    \# Make predictions


    y\_pred = model.predict(X\_test)


    \# Evaluate the model


    accuracy = accuracy\_score(y\_test, y\_pred)


    conf\_matrix = confusion\_matrix(y\_test, y\_pred)


    class\_report = classification\_report(y\_test, y\_pred, target\_names=iris.target\_names)


    print(f"Accuracy: {accuracy}")


    print(f"Confusion Matrix:\\n{conf\_matrix}")


    print(f"Classification Report:\\n{class\_report}")


