- raw: "Example: In biology, hierarchical clustering can be used to group species\
    \ based on genetic similarity. A dendrogram would illustrate how species are related,\
    \ with closely related species being grouped together earlier in the clustering\
    \ process.\n\nAdvantages:\n\n*   Does not require specifying the number of clusters.\n\
    \n*   Produces a dendrogram, providing insight into the data's structure at different\
    \ levels of granularity.\n\nDisadvantages:\n\n*   Computationally expensive for\
    \ large datasets.\n\n*   Sensitive to noise and outliers, especially in agglomerative\
    \ clustering.\n\n#### DBSCAN (Density-Based Spatial Clustering of Applications\
    \ with Noise)\n\nDBSCAN is a density-based clustering algorithm that groups data\
    \ points that are closely packed together (based on a distance metric) and marks\
    \ points that lie alone in low-density regions as outliers.\n\n*   Core Points:\
    \ Points that have a minimum number of neighbouring points within a specified\
    \ radius are considered core points.\n\n*   Border Points: Points that are within\
    \ the radius of a core point but do not have enough neighbours to be considered\
    \ core points themselves.\n\n*   Noise Points: Points that do not fall within\
    \ the radius of any core point are considered noise or outliers.\n\nDBSCAN does\
    \ not require specifying the number of clusters in advance, and it can discover\
    \ clusters of arbitrary shapes.\n\nExample: DBSCAN is useful in detecting anomalies\
    \ in network traffic. For example, in network security, DBSCAN can be used to\
    \ identify unusual patterns of traffic that may indicate malicious behaviour.\
    \ Legitimate traffic will form dense clusters, while anomalous traffic will be\
    \ marked as noise or outliers.\n\nAdvantages:\n\n*   Can find clusters of arbitrary\
    \ shapes.\n\n*   Robust to noise and outliers.\n\n*   Does not require specifying\
    \ the number of clusters in advance.\n\nDisadvantages:\n\n*   Struggles with datasets\
    \ of varying density.\n\n*   Sensitive to the choice of hyperparameters (e.g.,\
    \ radius and minimum points).\n\n* * *\n\n### 2\\. Dimensionality Reduction\n\n\
    In many real-world datasets, the number of features (or dimensions) can be extremely\
    \ large, making it difficult to visualize, analyse, and model the data effectively.\
    \ Dimensionality reduction techniques are used to reduce the number of features\
    \ while preserving the underlying structure and important patterns in the data.\
    \ This not only simplifies the dataset but can also improve the performance of\
    \ machine learning algorithms by removing noise and redundant information.\n\n\
    #### Principal Component Analysis (PCA)\n\nPCA is a linear dimensionality reduction\
    \ technique that transforms the data into a new coordinate system, where the axes\
    \ (called principal components) correspond to the directions of maximum variance\
    \ in the data. The first principal component captures the most variance, the second\
    \ captures the second most, and so on. By keeping only the first few principal\
    \ components, we can reduce the dimensionality of the data while retaining most\
    \ of its important information.\n\nSteps in PCA:\n\n1.  Standardize the data (centre\
    \ and scale).\n\n2.  Compute the covariance matrix of the data.\n\n3.  Perform\
    \ eigenvalue decomposition to find the eigenvectors and eigenvalues.\n\n4.  The\
    \ eigenvectors are the principal components, and the eigenvalues indicate how\
    \ much variance is explained by each component.\n\n5.  Select the top K principal\
    \ components to reduce dimensionality.\n\nExample: In genomics, researchers often\
    \ deal with datasets that have thousands of genes as features. PCA can be used\
    \ to reduce the number of features while retaining the key patterns of variation\
    \ in the data. For example, PCA might reduce the data from 10,000 genes to just\
    \ 10 principal components, making the data easier to analyse and visualize.\n\n\
    Advantages of PCA:\n\n*   Reduces dimensionality while preserving variance.\n\n\
    *   Helps with visualization of high-dimensional data.\n\n*   Can improve the\
    \ performance of machine learning models by reducing noise.\n\nDisadvantages:\n\
    \n*   Assumes linear relationships between variables.\n\n*   May not perform well\
    \ when the important information is in non-linear relationships.\n\n#### t-SNE\
    \ (t-Distributed Stochastic Neighbour Embedding)\n\nt-SNE is a non-linear dimensionality\
    \ reduction technique particularly well-suited for visualizing high-dimensional\
    \ data. Unlike PCA, which seeks to preserve global structure, t-SNE focuses on\
    \ preserving local relationships between data points. It does this by modelling\
    \ the similarity between points in high-dimensional space and mapping them to\
    \ a lower-dimensional space (typically 2D or 3D).\n\n*   Local Structure: t-SNE\
    \ excels at capturing local groupings in data, making it ideal for visualizing\
    \ clusters.\n\n*   Distance Preserving: It attempts to map high-dimensional distances\
    \ to low-dimensional ones while minimizing the distortion of those distances.\n\
    \nExample: t-SNE is commonly used in image recognition tasks to visualize how\
    \ different images relate to each other. For instance, in a dataset of handwritten\
    \ digits, t-SNE can reduce the high-dimensional pixel data to a 2D map where similar\
    \ digits are clustered together, making it easier to visualize the groupings of\
    \ different digit classes.\n\nAdvantages:\n\n*   Captures non-linear relationships.\n\
    \n*   Excellent for visualizing clusters in high-dimensional data.\n\nDisadvantages:\n\
    \n*   Computationally expensive for large datasets.\n\n*   Sensitive to hyperparameter\
    \ tuning (especially perplexity).\n\n*   The results can vary between runs due\
    \ to randomness in the algorithm.\n\n* * *\n\n### 3\\. Association Rule Learning\n\
    \nAssociation Rule Learning is a technique used to find interesting relationships\
    \ or associations between variables in large datasets. It is most commonly used\
    \ in market basket analysis, where the goal is to identify which items are frequently\
    \ purchased together.\n\n#### Apriori Algorithm\n\nThe Apriori algorithm is a\
    \ classic method used for association rule learning. It operates by finding frequent\
    \ itemset in the data (i.e., groups of items that appear together frequently)\
    \ and then generating rules based on these itemset. The algorithm uses a bottom-up\
    \ approach, where it starts with single items and progressively builds larger\
    \ itemset by checking for frequent patterns.\n\n*   Support: The support of an\
    \ itemset refers to the proportion of transactions in which the itemset appears.\n\
    \n*   Confidence: The confidence of a rule refers to the likelihood that the consequent\
    \ of the rule occurs given that the antecedent has occurred.\n\n*   Lift: Lift\
    \ measures the strength of a rule compared to how often the consequent occurs\
    \ independently. A lift greater than 1 indicates a strong association.\n\nExample:\
    \ In a supermarket, the Apriori algorithm can be used to discover rules such as\
    \ \"if a customer buys bread and butter, they are likely to buy milk.\" These\
    \ rules can be used for cross-selling and recommendation strategies, such as placing\
    \ milk near the bread and butter in the store.\n\nAdvantages of the Apriori Algorithm:\n\
    \n*   Provides interpretable rules that can be used for decision-making.\n\n*\
    \   Widely used in market basket analysis and recommendation systems.\n\nDisadvantages:\n\
    \n*   Computationally expensive, especially with large datasets.\n\n*   May generate\
    \ a large number of rules, many of which are irrelevant.\n\n### FP-Growth Algorithm\n\
    \nThe FP-Growth (Frequent Pattern Growth) algorithm is an efficient alternative\
    \ to the Apriori algorithm for mining frequent itemset in large datasets. While\
    \ Apriori can be computationally expensive because it generates a large number\
    \ of candidates itemset and repeatedly scans the dataset, FP-Growth avoids this\
    \ by using a more compact data structure called the FP-tree (Frequent Pattern\
    \ Tree).\n\n#### How FP-Growth Works:\n\n1.  Building the FP-Tree:\n\n    *  \
    \ The first step is to scan the dataset and identify frequent items (items that\
    \ meet a minimum support threshold)."
