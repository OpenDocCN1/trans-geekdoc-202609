    ### 3.5 Dimensionality Reduction


    Dimensionality reduction techniques are used to reduce the number of features
    in a dataset while retaining as much information as possible. This is useful for
    visualization, noise reduction, and improving model performance.


    ## 3.5.1 Principal Component Analysis (PCA)


    PCA is a technique that transforms the data into a new coordinate system where
    the new axes (principal components) are ordered by the amount of variance they
    explain in the data.


    Example: Applying PCA to house features


    python


    Copy


    from sklearn.decomposition import PCA


    from sklearn.preprocessing import StandardScaler


    \# Select numerical features


    numerical\_features = \[''sq\_ft'', ''bedrooms'', ''bathrooms'', ''year\_built''\]


    \# Standardize the features


    scaler = StandardScaler()


    X\_scaled = scaler.fit\_transform(df\[numerical\_features\])


    \# Apply PCA


    pca = PCA()


    X\_pca = pca.fit\_transform(X\_scaled)


    \# Plot explained variance ratio


    plt.figure(figsize=(10, 6))


    plt.plot(range(1, len(pca.explained\_variance\_ratio\_) + 1), np.cumsum(pca.explained\_variance\_ratio\_))


    plt.xlabel(''Number of Components'')


    plt.ylabel(''Cumulative Explained Variance Ratio'')


    plt.title(''Explained Variance Ratio by PCA Components'')


    plt.show()


    ## 3.5.2 t-SNE (t-Distributed Stochastic Neighbour Embedding)


    t-SNE is a nonlinear dimensionality reduction technique particularly well suited
    for visualizing high-dimensional data.


