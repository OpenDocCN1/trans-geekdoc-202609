  trans: "\n\n### 反向传播\n\n* 一旦网络产生输出，损失函数就会计算预测输出与实际输出之间的误差。\n\n### 反向传播\n\n* 算法使用微积分的链式法则计算损失函数相对于网络中每个权重的梯度。该梯度指示权重应调整的方向以最小化损失。\n\
    \n### 权重更新\n\n* 权重通过沿梯度相反方向迈出一个小步来更新（该步长由学习率控制）。该过程对多个迭代（`epochs`）重复进行，直到损失最小化。\n\
    \n示例：考虑训练一个 `MLP` 来对猫和狗的图像进行分类。最初，网络做出随机预测。在训练期间，反向传播根据误差（预测有多错误）调整权重，逐渐提高网络的准确性。\n\
    \n反向传播的优点：\n\n* 高效地训练深度网络。\n* 适用于任何可微分的损失函数和激活函数。\n\n缺点：\n\n* 在深度网络中容易出现梯度消失问题，其中梯度变得太小而无法进行显著更新，尤其是在深层使用\
    \ sigmoid 或 tanh 激活函数时。\n\n* * *\n\n### 3. 卷积神经网络 (CNNs)\n\n卷积神经网络（`CNNs`）是一种专门用于处理网格状数据（如图像）的神经网络类型。`CNNs`\
    \ 利用数据的空间结构高效地检测边缘、纹理和物体等模式，使其在图像分类、目标检测和图像分割等任务中特别有效。\n\n#### CNNs 的关键组件：\n\n\
    1. 卷积层：\n\n   * 与将每个神经元与每个输入像素完全连接不同，`CNNs` 使用一组滤波器（或核）在输入图像上滑动，应用卷积操作。这捕获图像中的局部模式（例如边缘或纹理）。\n\
    \   * 每个滤波器检测不同的特征，每个卷积层使用多个滤波器。\n\n2. 池化层：\n\n   * 卷积之后，`CNNs` 通常应用池化操作（例如最大池化）来减小特征图的空间维度，使网络更具计算效率并降低过拟合风险。\n\
    \n3. 全连接层：\n\n   * 在经过数层卷积和池化之后，网络提取的高级特征会传递给全连接层进行分类或回归。\n\n4. 激活函数：\n\n   *\
    \ 通常，在每个卷积层之后应用 `RLU` 激活以引入非线性。\n\n示例：`CNN` 可用于对手写数字进行分类（如 `MNIST` 数据集）。网络的卷积层将学习检测边缘和曲线等特征，池化层将降低维度，而全连接层将预测数字的标签。\n\
    \nCNNs 的优点：\n\n* 有效识别图像、视频和其他空间数据的模式。\n* 与全连接网络相比减少了参数数量，使其训练更高效。\n\n缺点：\n\n*\
    \ 需要大量标记数据集进行训练。\n* 计算成本高，尤其是在大图像或深度网络的情况下。\n\n* * *\n\n### 4. 循环神经网络 (RNNs) 和长短期记忆\
    \ (LSTM)\n\n循环神经网络（`RNNs`）旨在处理顺序数据，其中输入的顺序很重要。与前馈网络不同，`RNNs` 在其架构中有循环，允许它们保留先前输入的记忆，这使其适用于时间序列预测、语言建模和语音识别等任务。\n\
    \n#### 循环神经网络 (RNNs)\n\n`RNNs` 通过维护一个隐藏状态来处理顺序数据，该隐藏状态捕获来自先前时间步的信息。在每个时间步，隐藏状态根据当前输入和先前的隐藏状态进行更新，使网络能够从不同长度的序列中学习。\n\
    \n* 前向传播：\n\n  * 对于序列中的每个时间步，`RNN` 更新其隐藏状态并产生输出。\n\n* 通过时间的反向传播 (BPTT)：\n\n  *\
    \ 误差通过网络向后传播到每个时间步，使网络能够从过去和现在的信息中学习。\n\n示例：在语言建模中，`RNN` 可以通过使用先前单词的信息来预测句子中的下一个单词。例如，如果输入是\
    \ \"The cat sat on the,\" `RNN` 将预测下一个单词很可能是 \"mat.\"\n\nRNNs 的局限性：\n\n* 梯度消失问题：与深度网络中的反向传播类似，`RNNs`\
    \ 在处理长序列时也会遭受梯度消失问题，尤其难以学习长期依赖关系。\n\n#### 长短期记忆 (LSTM)\n\n`LSTMs` 是一种特殊的 `RNN`，旨在解决梯度消失问题并更好地捕获数据中的长期依赖关系。`LSTMs`\
    \ 使用门控来控制信息流，使网络能够随着时间的推移“记住”或“忘记”信息。\n\n* 遗忘门：决定从单元状态中丢弃哪些信息。\n* 输入门：控制要添加到\n\
    \n### 长短期记忆 (LSTM)\n\n长短期记忆（`LSTM`）网络是一种循环神经网络（`RNN`）类型，专门设计用于处理梯度消失问题，使模型能够学习顺序数据中的长期依赖关系。`LSTMs`\
    \ 特别适用于上下文或先前数据点对于做出准确预测至关重要的任务，例如时间序列预测、语音识别和自然语言处理（`NLP`）。\n\n#### 为什么使用 LSTM？\n\
    \n标准 `RNNs` 遭受梯度消失问题，在反向传播期间梯度变得非常小，从而阻止网络学习数据中的长期依赖关系。`LSTMs` 通过引入更复杂的架构来克服这个问题，该架构具有控制信息在网络中流动的门。这使\
    \ `LSTMs` 能够学习在长序列数据中应记住或忘记哪些信息。\n\n#### LSTM 架构\n\n`LSTM` 架构围绕单元状态构建，单元状态是 `LSTM`\
    \ 记忆的核心，以及控制信息如何流入和流出该单元状态的三个主要门。这些门允许 `LSTM` 在处理顺序数据时选择性地保留或丢弃信息。\n\n1. 单元状态：\n\
    \n   * 单元状态就像穿过 `LSTM` 的传送带，沿着序列携带重要信息。信息可以通过门添加到单元状态或从单元状态中移除。\n\n2. 遗忘门：\n\n\
    \   * 遗忘门控制应从先前单元状态中丢弃哪些信息。它接收先前的隐藏状态和当前输入，通过 sigmoid 函数传递（输出值在 0 到 1 之间），并将结果与单元状态相乘。值为\
    \ 0 表示“完全忘记”，值为 1 表示“完全保留”。\n\n```\nft=σ(Wf⋅[ht−1,xt]+bf)\nf_t = \\sigma(W_f \\\
    cdot [h_{t-1}, x_t] + b_f)\nft​=σ(Wf​⋅[ht−1​,xt​]+bf​)\n```\n\n其中 `ft` 是遗忘门的输出，`ht−1`\
    \ 是先前的隐藏状态，`xt` 是当前输入，`Wf` 和 `bf` 是遗忘门的权重和偏置。\n\n3. 输入门：\n\n   * 输入门决定应将哪些新信息添加到单元状态。它由两部分组成：\n\
