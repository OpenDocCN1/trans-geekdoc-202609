    knowledge of what the output should be. The three primary areas of unsupervised
    learning we will explore are Clustering, Dimensionality Reduction, and Association
    Rule Learning.


    * * *


    ### 1\. Clustering


    Clustering is a fundamental technique in unsupervised learning, where the objective
    is to group similar data points together based on a predefined distance or similarity
    metric. It is widely used in various fields such as marketing, biology, and image
    analysis to identify natural groupings or segments in the data.


    #### K-means Clustering


    K-means is one of the most popular and simple clustering algorithms. The algorithm
    partitions the data into K clusters by minimizing the distance between data points
    and their corresponding cluster centroids. The number of clusters (K) is specified
    beforehand.


    Steps in K-means:


    1.  Randomly initialize K centroids.


    2.  Assign each data point to the nearest centroid, creating K clusters.


    3.  Recalculate the centroids of these clusters based on the mean of the data
    points in each cluster.


    4.  Repeat the assignment and recalculation steps until the centroids do not change
    or a stopping criterion is met.


    Example: Consider a retail store that wants to segment its customers based on
    their purchasing behaviour. Using K-means clustering, the retailer can group customers
    into segments like "high spenders," "occasional buyers," and "bargain hunters."
    By analysing the purchasing patterns of each group, the retailer can tailor marketing
    strategies accordingly.


    Advantages of K-means:


    *   Simple and easy to implement.


    *   Efficient for large datasets.


    *   Works well when the clusters are approximately spherical and of similar size.


    Disadvantages:


    *   Sensitive to the initial placement of centroids, which can lead to suboptimal
    clustering.


    *   The number of clusters (K) must be specified in advance.


    *   Struggles with clusters of irregular shapes or different densities.


    #### Hierarchical Clustering


    Hierarchical clustering builds a hierarchy of clusters by either agglomerating
    (bottom-up) or dividing (top-down) the data. In agglomerative clustering, each
    data point starts as its own cluster, and pairs of clusters are merged based on
    similarity until a single cluster containing all data points is formed. In divisive
    clustering, the opposite happens, where all data points start in one cluster and
    are recursively split.


    *   Agglomerative Hierarchical Clustering: Merges clusters starting from individual
    data points.


    *   Divisive Hierarchical Clustering: Splits clusters starting from a single large
    group.


    The results of hierarchical clustering can be visualized using a dendrogram, a
    tree-like diagram that shows the relationship between data points at different
    levels of clustering.'
