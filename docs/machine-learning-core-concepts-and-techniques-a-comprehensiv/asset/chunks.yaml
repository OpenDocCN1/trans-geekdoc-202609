    # 第 6 章：集成方法


    集成方法是在机器学习中结合多个模型以创建比任何单一模型更准确、更稳健的预测的强大技术。通过聚合各种模型的优势并弥补其弱点，集成方法提高了整体性能并减轻了过拟合。本章深入探讨三类主要的集成技术：Bagging
    和随机森林、Boosting（重点关注 AdaBoost 和梯度提升）以及 Stacking。


    ***


    ## 1. Bagging 和随机森林


    ### Bagging（自助聚合）


    Bagging 是最简单但也非常有效的集成技术之一。Bagging 背后的思想是在训练数据的不同随机子集上训练基模型的多个实例（通常是决策树）。通过组合这些模型的预测，Bagging
    降低了方差并提高了预测的稳定性和准确性。


    * 自助采样：Bagging 通过有放回采样（称为“自助”采样）创建训练数据集的多个子集。每个子集用于训练基模型的一个独立实例。

    * 聚合预测：对于分类问题，每个模型的预测通过多数投票组合。对于回归问题，预测结果取平均值。


    示例：考虑基于各种医疗因素预测患者是否患有特定疾病的任务。使用单一决策树可能会导致过拟合，尤其是在数据嘈杂或不平衡的情况下。通过 Bagging，多个决策树在数据的不同子集上训练，最终预测基于所有树的多数投票。这减少了过拟合并提高了准确性。


    ### 随机森林


    随机森林通过引入另一层随机性来扩展 Bagging 的思想。虽然 Bagging 在不同的数据子集上训练多棵树，但随机森林还在决策树的每个分裂点随机化特征选择。


    * 随机特征选择：不是为每棵树使用所有特征，而是在每个分裂点选择一组随机特征，这可以防止对任何一个特征的过度依赖并降低各棵树之间的相关性。

    * 结果聚合：与 Bagging 类似，所有树的预测结果被聚合（分类时通过多数投票，回归时通过平均）以做出最终预测。


    示例：在营销活动预测问题中，目标是根据年龄、收入和过往购买等因素预测客户是否会对营销活动做出积极响应，可以训练随机森林。每棵树都会接触到这些特征的不同组合和客户子集，从而使模型比单一决策树更具泛化能力。


    #### Bagging 和随机森林的优点：


    * 方差降低：Bagging 通过平均预测结果降低了过拟合风险。

    * 处理高维数据：随机森林在特征数量很多的情况下表现良好，因为随机特征选择减少了过拟合。

    * 鲁棒性：随机森林对数据中的噪声和异常值具有很强的鲁棒性。


    #### 缺点：


    * 训练较慢：由于训练了多个模型，Bagging 和随机森林的训练时间可能比使用单一模型慢。

    * 黑箱特性：与决策树等简单模型相比，随机森林更难解释。


    ***


    ## 2. Boosting


    Boosting 是另一种强大的集成方法，但与独立训练模型的 Bagging 不同，Boosting 顺序构建模型。每个新模型都专注于纠正前一个模型的错误。这种迭代方法使
    Boosting 在降低偏差和方差方面都非常有效。


    ### AdaBoost（自适应提升）


    AdaBoost 是最早也是最流行的提升算法之一。AdaBoost 的核心思想是在每次迭代后，为被错误分类的实例分配更高的权重，为正确分类的实例分配更低的权重，从而迫使下一个模型专注于更困难的案例。


    * 弱学习器：通常，AdaBoost 使用称为“弱学习器”的简单分类器（例如决策桩，即浅层决策树）。这些弱学习器单独使用时可能仅略优于随机猜测。


    '
  toc: []
- raw: '*   Weight Updating: After each iteration, the misclassified instances are
    given higher weights, so the next weak learner is trained more on those harder-to-predict
    instances.


    *   Combining Predictions: The final prediction is made by taking a weighted sum
    of the predictions from all the weak learners, where the weights are determined
    based on the individual model''s accuracy.


    Example: Suppose you''re trying to classify whether a loan applicant is likely
    to default on a loan. Using AdaBoost, an initial weak classifier (like a decision
    stump) might make several misclassifications. In the next iteration, the algorithm
    assigns higher importance to those misclassified instances, and the next weak
    learner focuses more on those cases. This process repeats, and the final model
    is a combination of these weak learners, resulting in a stronger overall predictor.


    #### Gradient Boosting


    Gradient Boosting is another form of boosting that generalizes AdaBoost by using
    gradient descent to minimize a loss function. Unlike AdaBoost, which assigns weights
    to misclassified instances, Gradient Boosting fits new models to the residual
    errors (i.e., the difference between the actual and predicted values) of the previous
    models.


    *   Residual Errors: In each iteration, a new model is trained to predict the
    residual errors from the previous model''s predictions, and the new model''s predictions
    are added to the existing predictions.


    *   Loss Function Optimization: Gradient Boosting minimizes a specified loss function
    (e.g., mean squared error for regression or log loss for classification) using
    gradient descent.


    Example: In predicting housing prices, a single decision tree might not be able
    to capture all the relationships in the data, leading to errors in the predictions.
    Gradient Boosting can iteratively train new trees on these errors, gradually improving
    the model’s accuracy. After several iterations, the model''s predictions will
    be much closer to the actual housing prices.


    ##### Advantages of Boosting:


    *   High Accuracy: Boosting can significantly reduce both bias and variance, leading
    to highly accurate models.


    *   Works with Weak Learners: Even simple models can be used as weak learners,
    which are sequentially combined to create a strong model.


    ##### Disadvantages:


    *   Overfitting: If not controlled properly (e.g., too many iterations or too
    complex learners), boosting can lead to overfitting, especially on noisy datasets.


    *   Slower Training: Since boosting is sequential, it can be slower to train than
    parallelizable algorithms like random forests.


    * * *


    ### 3\. Stacking


    Stacking, or stacked generalization, is a more advanced ensemble technique where
    multiple models (often referred to as "level-0" models) are trained on the same
    dataset, and a "meta-learner" (a model at the next level) is used to combine their
    predictions.


    *   Diversity of Base Models: The base models can be of different types (e.g.,
    decision trees, support vector machines, neural networks), each capturing different
    patterns in the data.


    *   Meta-Learner: The predictions from the base models are used as input to the
    meta-learner, which makes the final prediction. The meta-learner can be any type
    of model (e.g., logistic regression, a neural network).


    Example: In a credit risk modelling problem, a stacking model might combine the
    predictions of a decision tree, a logistic regression model, and a gradient boosting
    model. The predictions from these models are fed into a meta-learner, such as
    a neural network, which uses the combined information to make the final prediction
    about whether a loan applicant is a risk.


    ##### Advantages of Stacking:


    *   Leverages Model Diversity: Stacking takes advantage of the strengths of different
    types of models, resulting in a more robust and generalized model.


    *   Flexibility: Different combinations of base models and meta-learners can be
    tried to achieve optimal performance.


    ##### Disadvantages:


    *   Complexity: Stacking can be complex to implement and requires careful tuning
    of both the base models and the meta-learner.


    *   Overfitting Risk: Without proper cross-validation, stacking can overfit the
    training data, especially when the meta-learner is too complex.


    * * *


    ### Conclusion


    Ensemble methods like bagging, boosting, and stacking have transformed machine
    learning by offering ways to build more accurate, robust, and flexible models.
    While they come with trade-offs in terms of complexity and training time, their
    ability to significantly enhance predictive performance makes them essential tools
    for tackling complex real-world problems. Whether dealing with noisy data, high-dimensional
    features, or complex decision boundaries, ensemble methods provide powerful solutions
    to some of the most pressing challenges in machine learning.


