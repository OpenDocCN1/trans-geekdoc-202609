    ### Weight Updating

    After each iteration, the misclassified instances are given higher weights, so
    the next weak learner is trained more on those harder-to-predict instances.


    ### Combining Predictions

    The final prediction is made by taking a weighted sum of the predictions from
    all the weak learners, where the weights are determined based on the individual
    model''s accuracy.


    Example: Suppose you''re trying to classify whether a loan applicant is likely
    to default on a loan. Using `AdaBoost`, an initial weak classifier (like a decision
    stump) might make several misclassifications. In the next iteration, the algorithm
    assigns higher importance to those misclassified instances, and the next weak
    learner focuses more on those cases. This process repeats, and the final model
    is a combination of these weak learners, resulting in a stronger overall predictor.


    ## Gradient Boosting


    `Gradient Boosting` is another form of boosting that generalizes `AdaBoost` by
    using gradient descent to minimize a loss function. Unlike `AdaBoost`, which assigns
    weights to misclassified instances, `Gradient Boosting` fits new models to the
    residual errors (i.e., the difference between the actual and predicted values)
    of the previous models.


    ### Residual Errors

    In each iteration, a new model is trained to predict the residual errors from
    the previous model''s predictions, and the new model''s predictions are added
    to the existing predictions.


    ### Loss Function Optimization

    `Gradient Boosting` minimizes a specified loss function (e.g., mean squared error
    for regression or log loss for classification) using gradient descent.


    Example: In predicting housing prices, a single decision tree might not be able
    to capture all the relationships in the data, leading to errors in the predictions.
    `Gradient Boosting` can iteratively train new trees on these errors, gradually
    improving the model’s accuracy. After several iterations, the model''s predictions
    will be much closer to the actual housing prices.


    ### Advantages of Boosting

    * High Accuracy: Boosting can significantly reduce both bias and variance, leading
    to highly accurate models.

    * Works with Weak Learners: Even simple models can be used as weak learners, which
    are sequentially combined to create a strong model.


    ### Disadvantages

    * Overfitting: If not controlled properly (e.g., too many iterations or too complex
    learners), boosting can lead to overfitting, especially on noisy datasets.

    * Slower Training: Since boosting is sequential, it can be slower to train than
    parallelizable algorithms like random forests.


    ---


    ### 3. Stacking


    Stacking, or stacked generalization, is a more advanced ensemble technique where
    multiple models (often referred to as "level-0" models) are trained on the same
    dataset, and a "meta-learner" (a model at the next level) is used to combine their
    predictions.


    ### Diversity of Base Models

    The base models can be of different types (e.g., decision trees, support vector
    machines, neural networks), each capturing different patterns in the data.


    ### Meta-Learner

    The predictions from the base models are used as input to the meta-learner, which
    makes the final prediction. The meta-learner can be any type of model (e.g., logistic
    regression, a neural network).


    Example: In a credit risk modelling problem, a stacking model might combine the
    predictions of a decision tree, a logistic regression model, and a gradient boosting
    model. The predictions from these models are fed into a meta-learner, such as
    a neural network, which uses the combined information to make the final prediction
    about whether a loan applicant is a risk.


    ### Advantages of Stacking

    * Leverages Model Diversity: Stacking takes advantage of the strengths of different
    types of models, resulting in a more robust and generalized model.

    * Flexibility: Different combinations of base models and meta-learners can be
    tried to achieve optimal performance.


    ### Disadvantages

    * Complexity: Stacking can be complex to implement and requires careful tuning
    of both the base models and the meta-learner.

    * Overfitting Risk: Without proper cross-validation, stacking can overfit the
    training data, especially when the meta-learner is too complex.


    ---


    ### Conclusion


    Ensemble methods like bagging, boosting, and stacking have transformed machine
    learning by offering ways to build more accurate, robust, and flexible models.
    While they come with trade-offs in terms of complexity and training time, their
    ability to significantly enhance predictive performance makes them essential tools
    for tackling complex real-world problems. Whether dealing with noisy data, high-dimensional
    features, or complex decision boundaries, ensemble methods provide powerful solutions
    to some of the most pressing challenges in machine learning.


