    ### 4.5 Time Series Regression


    Time series regression involves predicting future values based on previously observed
    values.


    ## 4.5.1 Autoregressive Integrated Moving Average (ARIMA)


    ARIMA is a popular model for time series forecasting that explicitly models the
    autocorrelation in the data.


    Example: ARIMA for monthly house price prediction


    python


    Copy


    import pandas as pd


    import numpy as np


    from statsmodels.tsa.arima.model import ARIMA


    import matplotlib.pyplot as plt


    \# Load time series data


    df = pd.read\_csv(''monthly\_house\_prices.csv'', parse\_dates=\[''date''\], index\_col=''date'')


    \# Fit ARIMA model


    model = ARIMA(df\[''price''\], order=(1, 1, 1))


    results = model.fit()


    \# Forecast future values


    forecast = results.forecast(steps=12)


    \# Plot the results


    plt.figure(figsize=(12, 6))


    plt.plot(df.index, df\[''price''\], label=''Observed'')


    plt.plot(pd.date\_range(start=df.index\[-1\], periods=13, freq=''M'')\[1:\], forecast,
    label=''Forecast'')


    plt.xlabel(''Date'')


    plt.ylabel(''House Price'')


    plt.title(''ARIMA Time Series Forecast of House Prices'')


    plt.legend()


    plt.show()


    print(results.summary())


