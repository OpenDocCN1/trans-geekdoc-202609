    ## 4.1.3 Assumptions of Linear Regression


    1.  Linearity: The relationship between X and Y is linear.


    2.  Independence: Observations are independent of each other.


    3.  Homoscedasticity: The variance of residual is the same for any value of X.


    4.  Normality: For any fixed value of X, Y is normally distributed.


    ## 4.1.4 Evaluation Metrics for Regression


    1.  Mean Squared Error (MSE): Average of the squared differences between predicted
    and actual values.


    2.  Root Mean Squared Error (RMSE): Square root of MSE, in the same units as the
    target variable.


    3.  Mean Absolute Error (MAE): Average of the absolute differences between predicted
    and actual values.


    4.  R-squared (R²): Proportion of the variance in the dependent variable that
    is predictable from the independent variable(s).


    ### 4.2 Polynomial Regression


    Polynomial regression is used when the relationship between the independent variable
    and the dependent variable is nonlinear.


    Mathematical representation: y = β₀ + β₁x + β₂x² + ... + βₙxⁿ + ε


    Example: Predicting house prices with polynomial features


    python


    Copy


    from sklearn.preprocessing import PolynomialFeatures


    from sklearn.pipeline import make\_pipeline


    \# Prepare the data


    X = df\[''sqft\_living''\].values.reshape(-1, 1)


    y = df\[''price''\].values


    \# Split the data


    X\_train, X\_test, y\_train, y\_test = train\_test\_split(X, y, test\_size=0.2,
    random\_state=42)


    \# Create and train the model


    degree = 2


    model = make\_pipeline(PolynomialFeatures(degree), LinearRegression())


    model.fit(X\_train, y\_train)


    \# Make predictions


    y\_pred = model.predict(X\_test)


    \# Evaluate the model


    mse = mean\_squared\_error(y\_test, y\_pred)


    r2 = r2\_score(y\_test, y\_pred)


    print(f"Mean Squared Error: {mse}")


    print(f"R-squared: {r2}")


    \# Visualize the results


    X\_plot = np.linspace(X.min(), X.max(), 100).reshape(-1, 1)


    y\_plot = model.predict(X\_plot)


    plt.scatter(X\_test, y\_test, color=''blue'', alpha=0.5)


    plt.plot(X\_plot, y\_plot, color=''red'', linewidth=2)


    plt.xlabel(''Square Footage'')


    plt.ylabel(''Price'')


    plt.title(f''Polynomial Regression (degree={degree}): House Price vs Square Footage'')


    plt.show()


    ### 4.3 Regularization Techniques


    Regularization is used to prevent overfitting by adding a penalty term to the
    loss function.


    ## 4.3.1 Ridge Regression (L2 Regularization)


    Ridge regression adds a penalty term proportional to the square of the magnitude
    of coefficients.


    Mathematical representation: Loss = MSE + α \* Σ(β²)'
