  \n## 第 6 章：领域 5：身份与访问管理 (IAM)\n\n## 摘要\n\n身份与访问管理领域侧重于对数据和系统的访问进行适当控制。在授予任何访问权限之前，必须先进行正确的标识和认证。该领域探讨了单因素和多因素认证\
  \ (MFA) 的各个方面，包括仅用密码认证的缺陷、生物识别面临的挑战以及令牌的使用。该领域论证了在本地环境中进行凭据管理和单点登录 (SSO) 的必要性，并认识到组织对云身份提供商和联合身份管理\
  \ (FIM) 的日益增长的使用需求。该领域探讨了 Kerberos、SAML、OAuth 和 OpenID Connect (OIDC) 等认证和授权协议。在完成适当的标识和认证后，重点转向授权以及访问控制模型的正确应用，如强制访问控制\
  \ (MAC)、自主访问控制 (DAC)、基于属性的访问控制 (ABAC) 和基于角色的访问控制 (RBAC)。该领域最后探讨了完整的身份与访问配置生命周期，以确保应用适当的控制，并强调了特权访问监控的重要性。\n\
  \n### 关键词\n\n认证；多因素认证 (MFA)；生物识别；授权；访问控制；单点登录 (SSO)；联合身份管理 (FIM)；强制访问控制 (MAC)；基于角色的访问控制\
  \ (RBAC)；基于属性的访问控制 (ABAC)\n\n本章考试目标：\n\n*   身份与访问配置\n*   认证方法\n*   访问控制技术\n*   访问控制模型\n\
  *   联合身份管理 (FIM)\n\n## 独特术语和定义\n\n*   **交叉错误率 (CER)**——描述误拒率 (FRR) 和误认率 (FAR) 相等的点。\n\
  *   **自主访问控制 (DAC)**——赋予主体对其创建或被授权访问的对象的完全控制权，包括与其他主体共享这些对象。\n*   **误认率 (FAR)**——当未经授权的主体被生物识别系统接受为有效主体时发生。也称为\
  \ II 类错误。\n*   **误拒率 (FRR)**——当经过授权的主体被生物识别系统拒绝为未经授权主体时发生。也称为 I 类错误。\n*   **强制访问控制\
  \ (MAC)**——基于主体的许可和对象的标签的系统强制访问控制。\n*   **基于角色的访问控制 (RBAC)**——主体被分组为角色，每个定义的角色基于角色而非个人拥有访问权限。\n\
  *   **基于属性的访问控制 (ABAC)**——一种较新的访问控制方法，可通过在访问请求时考虑主体和对象的各种属性来确定访问权限。\n\n## 简介\n\n\
  身份与访问管理（也称为访问控制）是所有安全学科的基础，不仅仅是 IT 安全。访问管理的目的是允许授权用户访问适当的数据，并拒绝未经授权的用户访问。听起来很简单，对吧？要想完全锁定系统，仅允许预定义的操作而不留任何余地，这很容易做到。事实上，许多组织（包括美军）正是这样做的：将用户对系统的访问权限限制在非常小的功能范围内。\n\
  \n然而，随着对互联网执行工作的依赖日益增加，系统必须足够灵活，能够运行各种不受中央控制的软件。\n\n影响访问控制的另一个顾虑是对陈旧（也称为“遗留”）软件应用程序的依赖。大型\
  \ IT 基础设施（如美军）可能运行着超过 10 年的关键任务应用程序！更换这些遗留应用程序的成本往往太高，组织无法在一个资金周期内完成。IT 专业人员往往必须在运行引入访问控制风险的不安全遗留应用程序的同时管理安全。\n\
  \n有一点是确定的：随着将 IT 作为开展业务的一种手段，以及身份与访问管理作为第一道防线之一，理解如何正确实施访问管理已成为追求安全通信的关键。\n\n访问控制可防范未经授权的访问、数据的不当修改和机密性丢失等威胁。访问控制通过实施强有力的技术、物理和管理措施来执行。本章侧重于访问控制的技术和管理方面；我们在第\
  \ 4 章（领域 3：安全架构与工程）中讨论了物理安全。请记住，物理安全隐含在大多数其他安全控制中，包括访问控制。\n\n## 认证方法\n\n实施任何类型访问控制的一个关键概念是控制\
  \ IT 系统中主体的适当认证。主体首先标识其身份；仅凭该标识本身是不可信的。然后主体通过提供保证来进行认证，证明所声称的身份是有效的。`credential\
  \ set`（凭据集）是用于指代用户标识和认证两者结合的术语。\n\n有三种基本认证方法：`Type 1`（你所知）、`Type 2`（你所有）和 `Type\
  \ 3`（你本身）。第四种认证类型是你所在的位置。\n\n### Type 1 认证：你所知\n\nType 1 认证（你所知）要求通过某种质询/响应方式测试主体，主体必须以知情者的回答进行响应。主体凭借其所知内容（如密码或\
  \ `PIN (Personal Identification Number`——基于数字的密码)）获得访问权限。这是最简单，但往往也是最薄弱的认证形式。\n\n\
  #### 密码\n\n密码一直是 IT 系统访问控制的基石。它们相对容易且廉价地实现。许多在线银行、股票投资组合服务、私人 Web 邮箱和医疗系统仍使用用户名和密码作为访问控制方法。\n\
  \n实施访问控制时需考虑四种类型的密码：静态密码、口令、一次性密码和动态密码。\n\n*静态密码* 是可重复使用的密码，可能过期也可能不过期。它们通常由用户生成，最好与其他认证类型（如智能卡或生物识别控制）结合使用。\n\
  \n*口令* 是由单词短语或句子组成的长静态密码。口令示例：“I will pass the CISSP® in 6 months!”（我将在 6 个月内通过\
  \ CISSP® 考试！）。可以通过使用无意义单词（例如将前一个口令中的 CISSP® 替换为“XYZZY”）、混合大小写以及使用额外的数字和符号来增强口令的强度。\n\
  \n\n\n\n\n与较短的复杂密码（如 `B$%Jiu*!`）相比，口令通常每个字符的随机性较低，但通过长度来弥补随机性的不足。大多数人发现口令比较短的复杂密码更容易输入和记忆：我们习惯于输入句子。口令在安全性和易用性之间提供了合理的折衷：许多用户可能会被诱导记录高度复杂的密码，但却能记住口令。任何静态密码都有其固有局限性，无论长度或复杂度如何：它可能被窃取并重用。\n\
  \n**一次性密码**可用于单次认证。它们非常安全但难以管理。一次性密码无法重用，仅在单次使用时有效。\n\n**动态密码**按固定时间间隔变化。RSA Security\
  \ 制造了一种名为 SecurID 的同步令牌设备，每 60 秒生成一个新的令牌码。用户将其静态 PIN 与 RSA 动态令牌码相结合，创建一个每次使用都会改变的动态密码。使用动态密码的一个缺点是令牌本身的成本较高。\n\
  \n### 多因素认证 (MFA)\n\n**多因素认证 (MFA)** 要求用户利用不止一种要素来证明其身份以进行认证。MFA 与仅需一种方法证明身份的经典单因素认证方法形成鲜明对比。最常见且仍普遍存在的认证方法仅要求提供用户名以进行标识，以及与该账户关联的已知密码。攻击者已经开发出多种极其成功的方法来攻破仅基于密码的认证。可能存在一些用例，用替代的但仍属于单因素的认证方法取代仅密码的方法，确实能实质性地提高安全性。然而，完全依赖任何单因素方法的安全性都明显低于迁移到基于\
  \ MFA 的解决方案。\n\n为了举例说明 MFA，我们可以考虑 ATM 卡或借记卡。用户可以利用借记卡从其银行账户取款。然而，除了持有该卡外，他们还必须输入正确的\
  \ PIN 才能充分证明其身份。这可以防止多种类型的攻击，包括简单的重放攻击。在重放攻击中，攻击者可能拥有 PIN，但如果没有实际的 ATM 卡，他们将无法取款。同样，如果攻击者复制了\
  \ ATM 卡但无法获取 PIN，也可以应用同一逻辑。即使是简单的四位数 PIN，当与物理持有要求相结合时，也能极大地提高该认证系统的安全性。\n\n考虑到针对密码的攻击技术普遍存在（其中一些我们将在下文讨论），迁移到需要任何形式\
  \ MFA 实施的认证被证明是一项极其宝贵的安全控制。然而，并非所有 MFA 实施都能提供同等程度的安全态势改进。严格来说，MFA 并不一定要求采用不同类型的因素，但最佳实践建议利用那些不太可能被同时成功颠覆的因素。此外，随着组织增加对\
  \ MFA 的采用，对手也同样将更多精力集中在攻破除典型静态密码之外的额外因素上。\n\n在实施或更新组织的 MFA 方法时，应考虑所采用的额外因素相关的攻击面。虽然采用任何\
  \ MFA 都比单因素仅密码认证代表了巨大的安全性提升，但通过短信或电子邮件发送一次性密码给用户等因素，代表了鲁棒性差得多的实施，更容易成为对手的攻击目标。\n\
  \n### 密码猜测\n\n**密码猜测**是一种在线技术，涉及尝试向系统认证特定用户。正如我们将在下一节学到的，**密码破解**是指一种离线技术，攻击者已获取密码哈希或数据库。请注意，大多数针对密码的基于\
  \ Web 的攻击属于密码猜测类型，因此 Web 应用程序在设计时应从检测和预防的角度考虑到这一点。\n\n可以通过监控登录失败的系统日志来检测密码猜测。**截断级别**用于区分恶意攻击和普通用户意外输错密码的情况。截断级别定义了最低报告阈值。以密码猜测为例，可以建立一个截断级别，使得审计系统仅在特定用户每小时认证失败频率超过五次时才发出警报。截断级别有助于将攻击与噪音区分开来；然而，如果攻击者能够摸清必须低于其运作的阈值，也可能导致假阴性。\n\
  \n防止成功的密码猜测攻击通常通过**账户锁定**来实现。账户锁定用于防止攻击者通过尝试大量潜在密码来简单地猜出正确密码。一些组织要求对锁定账户进行人工补救，通常以服务台介入的形式进行。然而，一些组织将账户锁定配置为仅具有自动重置时间，这不一定需要人工干预。账户锁定配置应谨慎对待：攻击者（虽然未能成功猜出正确密码）可能会通过故意锁定大量账户造成巨大的管理负担。\n\
  \n### 密码哈希与密码破解\n\n在大多数情况下，明文密码不会存储在 IT 系统中；仅存储这些密码的哈希输出。**哈希**是使用算法且无密钥的单向加密。当用户尝试登录时，他们输入的密码（有时结合盐值，我们稍后将讨论）会被哈希，并将该哈希与系统上存储的哈希进行比较。哈希函数不可逆：无法逆向算法从哈希生成密码。虽然哈希无法逆向，但攻击者可以多次正向运行哈希算法，选择各种可能的密码，并将输出与目标哈希进行比较，希望找到匹配项（从而推导出原始密码）。这被称为**密码破解。**\n\
  \n现代 UNIX/Linux 系统的密码哈希存储在 `/etc/shadow` 中（通常仅 root 用户可读）。Windows 系统将哈希同时存储在本地计算机和域控制器\
  \ (DC) 上，存储在所谓的安全账户管理文件或 SAM 文件中。必须访问密码哈希才能进行认证。如果 Microsoft Windows 系统无法访问 DC，则可能会恢复到工作站本身本地存储的密码哈希。如果用户运行的是独立系统（大多数家庭用户的典型情况），则仅使用本地密码哈希。\n\
  \n密码哈希也可能在网络上被嗅探或从内存中读取。SAM 文件在 Windows 操作系统运行时处于锁定状态：诸如 mimikatz (`https://github.com/gentilkiwi/mimikatz`)\
  \ 和 Metasploit (`https://www.metasploit.com`) 的“hashdump”命令等工具可以从内存中转储哈希。图 6.1 显示了通过工具\
  \ mimikatz (`https://github.com/gentilkiwi/mimikatz`) 从 Windows 工作站获取的 SAM 文件输出。用户\
  \ deckard 的 LM 哈希和 NT 哈希均显示出来，可用作密码破解工具的输入。\n\n\n\n\n\n![Fig. 6.1 LM and NT hashes.](img/f06-01-9780443187346.jpg)\n\
  \nFig. 6.1 LM 和 NT 哈希。\n\n### 字典攻击\n\n*字典攻击*使用字表：一个预定义的单词列表，列表中的每个单词都会被哈希。如果破解软件将字典攻击产生的哈希输出与密码哈希匹配，攻击者就成功识别出了原始密码。\n\
  \n> **注意**\n>\n> 攻击者通常会根据目标调整其字典，例如为讲西班牙语的目标组织在字表中添加西班牙语字典，甚至为拥有《星际迷航》粉丝的组织添加克林贡语字典。Packet\
  \ Storm Security 在 <https://packetstormsecurity.com/Crackers/wordlists/> 维护着多个字典。\n\
  \n因为字典攻击可以快速执行，许多组织要求用户创建包含特殊字符、数字、大写字母且长度在八位或以上的密码。Fig. 6.2 展示了使用密码破解工具 `John the\
  \ Ripper` (<https://www.openwall.com/john/>) 对抗 Fig. 6.1 中所示从 SAM 文件获取的详细信息。即使运行简单的字典攻击也能快速揭示用户\
  \ deckard 的密码为“replicant”。应限制对 SAM 文件 (Windows) 和 shadow 文件 (UNIX/Linux) 的访问。\n\n\
  ![Fig. 6.2 Successful dictionary attack.](img/f06-02-9780443187346.jpg)\n\nFig.\
  \ 6.2 成功的字典攻击。\n\n### 暴力破解和混合攻击\n\n*暴力破解攻击*耗时更长，但效果更好。攻击者计算所有可能密码的哈希输出。就在几年前，基本计算机速度仍然足够慢，使这成为一项艰巨的任务。然而，随着\
  \ CPU 速度和并行计算的进步，暴力破解复杂密码所需的时间已大幅减少。\n\n近期密码破解的另一项突破是利用 GPU（图形处理单元）破解密码：“为应对电脑游戏日益增长的需求而设计，当今顶级\
  \ GPU 的信息处理速率接近每秒两万亿次浮点运算（一万亿次浮点运算等于每秒一万亿次浮点运算）。为了更直观地理解这一点，在 2000 年，世界上最快的超级计算机——一组耗资\
  \ 1.1 亿美元的联网机器——运算速度仅略高于每秒七万亿次浮点运算。图形处理单元之所以如此之快，是因为它们被设计为并行计算机。在并行计算中，给定的问题被分配给多个称为核心的处理单元，这些核心同时处理问题的不同部分”\
  \ [\\[1\\]](#Ch006_295-335_B9780443187346000052.xhtml#bb0010)。\n\n攻击者也可能使用彩虹表进行密码攻击。*彩虹表*充当一个数据库，包含大多数或所有可能密码的预计算哈希输出。生成彩虹表需要大量时间，且并不总是完整的：它们可能不包含所有可能的密码/哈希组合。虽然彩虹表充当数据库，但其内部更为复杂，依赖时间/内存权衡来表示和恢复密码及哈希。我们将在第\
  \ 4 章（领域 3：安全架构与工程）中更详细地讨论彩虹表的技术细节。\n\n> **注意**\n>\n> 利用彩虹表的预计算暴力破解攻击的效率取决于密码哈希算法的实现。决定彩虹表是否能大幅提高密码恢复速度的主要特性是该算法的实现是否涉及盐值，盐值只是一种在生成的哈希中引入随机性的方式。在没有盐值的情况下，相同的密码每次都会产生完全相同的哈希。值得注意的是，Windows\
  \ 的 LM 和 NT 哈希不包含盐值，这使它们特别容易受到此类暴力破解的攻击。Linux 和 UNIX 系统已使用盐值数十年。使用 16 位盐值的旧版 UNIX/Linux\
  \ 系统将要求攻击者创建 65,536 组单独的彩虹表，每个可能的盐值一组。使用 SHA-512 哈希的现代 UNIX/Linux 系统支持 8 字符的 Base64\
  \ 盐值。这允许 600 亿亿亿（一个包含 58 位数字的十进制数）种不同的盐值。\n\n*混合攻击*在哈希之前对字典中的单词进行追加、前置或更改字符，以尝试最快地破解复杂密码。例如，攻击者可能拥有潜在系统管理员密码的字典，但也会将每个字母“o”替换为数字“0”。如果目标的密码类似于任何类型的标准\
  \ 8-15 字符单词，且仅在带有特殊字符的文本上进行了少量更改，则其复杂密码可能被混合攻击破解。\n\n### 盐值\n\n*盐值*允许一个密码以多种方式进行哈希。某些系统（如现代\
  \ UNIX/Linux 系统）在哈希前将盐值与密码结合。虽然存储密码哈希优于存储明文密码，但“UNIX 操作系统的设计者通过使用一个称为‘盐’的随机值改进了这种方法（哈希）。盐值确保相同的密码在不同用户使用时会以不同方式加密。这种方法的优势在于，攻击者必须多次加密同一个单词（每个盐值或用户一次）才能发起成功的密码猜测攻击”\
  \ [\\[2\\]](#Ch006_295-335_B9780443187346000052.xhtml#bb0015)。\n\n这使得彩虹表对于使用盐值的系统效果大打折扣（甚至完全无效)。对于不使用盐值的系统（如\
  \ Microsoft LAN Manager (LM) 哈希），只需编译一张彩虹表；而对于使用盐值的系统，则需要数千、数百万、数十亿甚至更多张彩虹表，具体取决于盐值长度。\n\
  \n### 密码管理\n\nFig. 6.3 显示了 Windows 10 本地安全密码设置策略的屏幕截图，详细说明了系统的密码要求设置。请注意，系统配置为美国国防部和微软均推荐的最低安全标准。\n\
  \n![Fig. 6.3 Windows 10 password settings.](img/f06-03-9780443187346.jpg)\n\nFig.\
  \ 6.3 Windows 10 密码设置。\n\n在 Microsoft Windows 环境中管理密码相当简单。IT 或信息安全人员确定组织策略并通过 DC\
  \ 实施该策略。互联网安全中心（CIS）的 Microsoft Windows Server 2019 基准包含关于标准密码策略的以下建议：\n\n- 密码历史记录\
  \ = 设置为记住 24 个密码\n- 最大密码期限 = 365 天\n- 最小密码期限 = 1 天（这是因为用户不会循环更换 24 个密码以立即返回其最爱的密码）\n\
  - 最小密码长度 = 14 字符\n- 密码必须符合复杂性要求 = 真\n- 使用可逆加密存储密码 = 假 [\\[3\\]](#Ch006_295-335_B9780443187346000052.xhtml#bb0020)\n\
  \n困难在于用户未能妥善创建或保护他们选择的密码。例如，用户将密码写下来并存放在钱包、通讯录、手机中，甚至贴在显示器上的便利贴上，这种情况并不少见。\n\n###\
  \ 密码控制\n\n\n\n\n控制密码是管理层和 IT 安全专业人员共同关注的问题。其中一个问题是复杂的密码更难记忆，这可能导致其他安全问题。将密码写下来并放在不安全的地方（例如键盘下、存放在钱包、手提包或未上锁的抽屉中）的用户会破坏系统的整体安全态势。\n\
  \n### 类型 2 认证：你所拥有的\n\n类型 2 认证（你所拥有的）要求用户持有某样东西，例如令牌，以证明他们是经过认证的用户。令牌是一种有助于证明身份声明的对象。令牌最简单的例子是一套汽车钥匙。持有汽车钥匙意味着可以使用该汽车。其他令牌示例包括信用卡、银行\
  \ ATM 卡、智能卡和纸质文件。ATM 卡还使用 PIN 码访问用户的银行账户，从而提高了用户账户的整体安全性。\n\n#### 同步动态令牌\n\n*同步动态令牌*使用时间或计数器将显示的令牌代码与认证服务器预期的代码同步：这些代码是同步的。\n\
  \n基于时间的同步动态令牌显示频繁变化的动态令牌代码，例如每 60 秒变化一次。动态代码仅在该时间窗口内有效。认证服务器知道每个授权令牌的序列号、关联的用户以及时间。它可以利用这三项信息预测每个令牌上的动态代码。`RSA\
  \ SecurID` 是基于硬件的同步动态令牌的一个示例。图 6.4 中所示的 `Google Authenticator` 是基于软件的同步动态令牌（也称为软令牌）的一个示例。\n\
  \n![图 6.4 Google Authenticator [4]。](images/B9780443187346000052/f06-04-9780443187346.jpg)\n\
  \n图 6.4 Google Authenticator [[4]](#Ch006_295-335_B9780443187346000052.xhtml#bb0025)。\n\
  \n基于计数器的同步动态令牌使用简单的计数器：认证服务器预期令牌代码为 1，用户的令牌显示相同的代码 1。使用一次后，令牌显示第二个代码，服务器也预期令牌代码为\
  \ 2。\n\n在这两种情况下，用户通常通过输入用户名、其 PIN 码或密码（他们所知的）以及动态令牌代码（他们所有的）进行认证。此方法使用强认证：没有 PIN\
  \ 码令牌毫无用处，没有令牌 PIN 码也毫无用处。\n\n#### 异步动态令牌\n\n*异步动态令牌*不与中央服务器同步。最常见的类型是质询-响应令牌。质询-响应令牌认证系统产生一个质询，即令牌设备的输入。然后用户将该信息连同其\
  \ PIN 码手动输入设备，设备产生一个输出。然后将此输出发送给系统。由于响应与质询、特定令牌、令牌使用的加密算法以及用户的 PIN 码相关联，系统确信用户已通过认证。\n\
  \n图 6.5 展示了使用质询-响应令牌进行认证的过程。这也说明了强认证：用户必须提供他们所知的东西以及令牌（他们所有的东西）才能获得访问权限。\n\n![图\
  \ 6.5 异步质询-响应。](img/f06-05-9780443187346.jpg)\n\n图 6.5 异步质询-响应。\n\n建议组合使用访问控制类型，这可以为访问控制提供更高的安全性。使用多种类型的访问控制称为强认证或多因素认证。\n\
  \n### 类型 3 认证：你本身的特征\n\n类型 3 认证（你本身的特征）是生物识别技术，它使用物理特征作为识别或认证的手段。“生物识别”一词源自希腊语“bios”（生命）和“metric”（度量）。生物识别可用于确立身份，或用于认证（证明身份声明）。例如：机场人脸识别系统可用于确认已知恐怖分子的身份，指纹扫描仪可用于认证主体的身份（主体提出身份声明，然后刷指纹以证明该声明）。\n\
  \n由于生物识别与个人的身体特征相关联，因此个人更难忘记、丢失或以其他方式失去对该访问能力的控制。生物识别可用于提供强健的认证，但应注意确保适当的准确性，并解决可能出现的任何隐私问题。\n\
  \n生物识别应具有可靠性，并能抵抗伪造。表示生物识别信息所需的数据存储（称为模板或文件大小）应相对较小（每次认证时都会访问）：通常为 1000 字节或更少（某些系统如手部几何识别则少得多）。\n\
  \n#### 生物识别的公平性、心理舒适度与安全性\n\n生物识别不应给主体造成过度的心理压力，也不应引入无端的隐私问题。正如我们稍后将看到的，某些生物识别控制（如视网膜扫描）很少使用，就是出于这个原因。\n\
  \n生物识别控制必须可供所有员工使用，否则必须存在补偿性控制。在大型组织（10,000 名或更多员工）中，部分员工可能没有指纹、眼睛等。必须考虑这些问题，并为所有员工提供公平的控制措施。\n\
  \n你是否注意到现代机场的洗手间通常没有门？入口现在通常通过一个有多个转弯的短走廊进入（这阻挡了从大厅直接看到洗手间内部的视线）。这样做是为了避免多人触摸门把手（并可能传播疾病）。大多数机场厕所现在自动冲水，原因相同。\n\
  \n体液交换的可能性是任何生物识别控制的一大缺点：这包括视网膜扫描（用户通常将眼睛贴在目镜上），甚至指纹扫描（许多主体触摸同一个扫描仪）。完全被动的控制（如虹膜扫描）可能更可取（不涉及体液交换）。\n\
  \n#### 生物识别注册与吞吐率\n\n*注册*描述了在生物识别系统中登记的过程：首次创建账户。用户通常提供其用户名（身份）、密码或 PIN 码，然后提供生物识别信息，例如在指纹阅读器上刷指纹，或拍摄其虹膜照片。注册是一次性过程，耗时应在\
  \ 2 分钟或更短。\n\n*吞吐率*描述了向生物识别系统进行认证的过程。这也称为生物识别系统响应时间。典型的吞吐率为 6-10 秒。\n\n#### 生物识别系统的准确性\n\
  \n在实施生物识别控制计划之前，应考虑生物识别系统的准确性。三个指标用于评判生物识别准确性：*误拒率 (FRR)*、*误纳率 (FAR)* 和 *交叉错误率 (CER)*。\n\
  \n##### 误拒率 (FRR)\n\n误拒是指授权主体被生物识别系统拒绝为未授权。误拒也称为 *I 类错误*。误拒会给授权用户带来挫败感，因访问条件差而导致工作减少，并消耗资源重新验证授权用户。\n\
  \n##### 误纳率 (FAR)\n\n\n\n错误接受是指未经授权的主体被接受为有效。如果组织的生物识别控制产生大量错误拒绝，整体控制可能需要通过减少认证主体时收集的数据量来降低系统的准确性。当数据点降低时，组织面临错误接受率增加的风险。组织面临未经授权的用户获得访问权限的风险。这种类型的错误也称为*Type\
  \ II error*（第二类错误）。\n\n> **Note**\n>\n> 错误接受比错误拒绝更严重：大多数组织宁愿拒绝真实主体，也不愿接受冒名顶替者。FAR（第二类错误）比\
  \ FRR（第一类错误）更严重。二大于一，这将帮助你记住 FAR 是第二类，比第一类（FRR）更严重。\n\n典型的指纹扫描通常会收集和比对 40 多个数据点。通过收集更少的微小特征点（10\
  \ 个左右），可以降低系统的准确性。这将降低 FRR，但会提高 FAR。这也增加了用户指纹更容易被伪造的可能性。\n\n##### 交叉错误率 (CER)\n\n\
  交叉错误率 (CER) 描述了错误拒绝率 (FRR) 和错误接受率 (FAR) 相等的点。CER 也称为等错误率 (EER)。交叉错误率描述了生物识别系统的整体准确性。\n\
  \n随着生物识别系统灵敏度的增加，FRR 将上升，FAR 将下降。相反，随着灵敏度的降低，FRR 将下降，FAR 将上升。图 6.6 显示了描绘 FAR 与 FRR\
  \ 的图表。CER 是图中两条线的交点，如 图 6.6 所示，基于 ISACA IS 审计生物识别控制指南 #G36 [\\[5\\]](#Ch006_295-335_B9780443187346000052.xhtml#bb0035)。\n\
  \n![图 6.6 交叉错误率。](img/f06-06-9780443187346.jpg)\n\n图 6.6 交叉错误率。\n\n##### 生物识别控制类型\n\
  \n今天使用许多生物识别控制。以下是主要实现及其在访问控制安全方面的具体优缺点。\n\n###### 指纹\n\n*指纹*是当今最广泛使用的生物识别控制。智能卡可以携带指纹信息。许多美国政府办公大楼依靠指纹认证进行物理访问设施。示例包括智能键盘，要求用户提供指纹以解锁计算机的屏幕保护程序。\n\
  \n用于存储每个人指纹的数据必须足够小，以便用于认证。该数据是指纹*微小特征*的数学表示，指纹摩擦脊的具体细节，包括漩涡、脊、分叉等。图 6.7 显示了微小特征类型（从左）分叉、脊结束、核心和三角\
  \ [\\[6\\]](#Ch006_295-335_B9780443187346000052.xhtml#bb0030)。\n\n![图 6.7 指纹微小特征\
  \ [\\[6\\]](#Ch006_295-335_B9780443187346000052.xhtml#bb0030)。](images/B9780443187346000052/f06-07-9780443187346.jpg)\n\
  \n图 6.7 指纹微小特征 [\\[6\\]](#Ch006_295-335_B9780443187346000052.xhtml#bb0030)。\n\n\
  ###### 视网膜扫描\n\n*视网膜扫描*是对供应眼后部视网膜的毛细血管进行的激光扫描。这可能看起来具有个人侵入性，因为光束必须直接进入瞳孔，用户通常需要将眼睛贴近激光扫描仪目镜。激光扫描绘制视网膜血管图。可以通过视网膜扫描获得用户的健康信息：可以确定怀孕和糖尿病等状况，这可能引发合法的隐私问题。由于视网膜扫描需要扫描仪近距离接触，使用视网膜扫描作为访问控制手段时，可能发生体液交换。\n\
  \n> **Exam Warning**\n>\n> 由于健康风险和侵犯隐私问题，视网膜扫描很少使用。应考虑替代方案，用于那些有体液交换风险或引发合法隐私担忧的生物识别控制。\n\
  \n###### 虹膜扫描\n\n*虹膜扫描*是一种被动生物识别控制。相机拍摄虹膜（眼睛的有色部分）照片，然后与认证数据库中的照片进行比对。这也适用于佩戴隐形眼镜和眼镜的情况。每个人的两个虹膜都是独特的，即使是双胞胎的虹膜也是如此。虹膜扫描的优点包括高准确性、被动扫描（可在主体不知情的情况下完成）以及无体液交换。\n\
  \n###### 手部几何\n\n在*手部几何*生物识别控制中，从主体手部的特定点进行测量：“设备使用一个简单的概念，在板子的引导下测量和记录个人手的长度、宽度、厚度和表面积”\
  \ [\\[7\\]](#Ch006_295-335_B9780443187346000052.xhtml#bb0040)。手部几何设备相当简单，可以在少至 9\
  \ 字节中存储信息。\n\n###### 键盘动力学\n\n*键盘动力学*指一个人按每个键的力度和按键的节奏。令人惊讶的是，这种类型的访问控制实施成本低廉且可能有效。随着人们学习如何打字和使用计算机键盘，他们会养成难以模仿的特定习惯，尽管并非不可能。\n\
  \n###### 动态签名\n\n*动态签名*测量某人签名的过程。此过程类似于键盘动力学，不同之处在于此方法测量主体签名时的笔迹。测量时间、压力、签名中的环路以及起笔和收笔点都有助于确保用户是真实的。\n\
  \n###### 声纹\n\n*声纹*测量主体在陈述特定句子或短语时的语调。这种类型的访问控制容易受到重放攻击（重放录制的声音）的影响，因此必须与声纹一起实施其他访问控制。其中一种控制要求主体陈述随机单词，防止攻击者播放预先录制的特定短语。另一个问题是人们的声音可能因疾病而发生重大变化，导致错误拒绝。\n\
  \n###### 面部扫描\n\n*面部扫描*技术在过去几年中有了极大改进。面部扫描（也称为面部识别）是被动拍摄主体面部照片并将该照片与数据库中存储的列表进行比对的过程。虽然由于成本高昂，不常用于生物识别认证控制，但执法和安全机构使用面部识别和扫描技术进行生物识别识别，以提高高价值、公开可访问目标的安全性。\n\
  \nSuperbowl XXXV 是第一个使用面部识别技术寻找潜在恐怖分子的大型体育赛事 [\\[8\\]](#Ch006_295-335_B9780443187346000052.xhtml#bb0045)。在每个入口处放置了摄像头，扫描每位参加者的面部并与活跃恐怖威胁名单进行比对。该技术奏效了，虽然未识别出恐怖分子，但识别出了\
  \ 19 名小偷。制造这些系统的公司声称它们主要是一种威慑控制。\n\n> **Note**\n\n\n\n自 2000 年代初以来，赌场一直在使用与超级碗案例中相同的人脸识别技术。赌场在安全方面最大的关注点是确保客人安全。然而，紧随其后的第二大关注点是确保没有作弊者从赌场窃取钱财。由于作弊者已知会佩戴精心设计的伪装，越来越多的赌场开始转向人脸识别软件。该软件利用面部几何特征来区分面部。因为这种几何测量的是面部特征之间相对于面部大小的独特距离，所以无论伪装如何，当软件检测到数据库中存储的已知作弊者时，很可能会发出警报。\n\
  \n#### 基于位置（Someplace You Are）\n\n基于位置描述了使用全球定位系统（`GPS`）、基于 IP 地址的地理定位或销售点购买的物理位置等技术的基于位置的访问控制。如果主体处于不正确的位置，这些控制可以拒绝访问。信用卡公司在监控消费者活动以防欺诈时采用这种访问控制。许多公司要求用户在计划出国旅行时通知他们。如果不通知，信用卡很可能会因担心未经授权的活动而被拒绝。\n\
  \n## 访问控制技术\n\n有多种技术用于实施访问控制。在介绍每种技术时，重要的是要识别每种技术解决方案的独特之处。\n\n### 集中式访问控制\n\n`集中式访问控制`\
  \ 将系统或组织的访问控制集中在一个逻辑点上。系统不使用本地访问控制数据库，而是通过第三方认证服务器进行认证。`集中式访问控制` 可用于提供 `单点登录（SSO）`，即主体只需认证一次，即可访问多个系统。`集中式访问控制`\
  \ 可以集中提供访问控制的三个“A”：认证、授权和审计。\n\n*   • **认证**：证明身份声明\n*   • **授权**：经过认证的主体被允许在系统上执行的操作\n\
  *   • **审计**：审计系统并证明主体行为的能力\n\n### 分散式访问控制\n\n`分散式访问控制` 允许 IT 管理更贴近组织的使命和运营。在 `分散式访问控制`\
  \ 中，组织跨越多个地点，本地站点支持并维护独立的系统、访问控制数据库和数据。`分散式访问控制` 也称为分布式访问控制。\n\n该模型提供了更多的本地权力：每个站点都控制自己的数据。这具有赋能作用，但也带来了风险。不同站点可能采用不同的访问控制模型、不同的策略，并具有不同的安全级别，导致视图不一致。即使拥有统一策略的组织，也可能发现各站点的遵守情况各不相同。攻击者很可能会攻击链条中最薄弱的环节：人员培训较少的小型办公室比拥有经验丰富员工的中央数据中心更具吸引力。\n\
  \n美军在战场情况下使用 `分散式访问控制`。在战斗中，需要访问 IT 设备的士兵无法呼叫服务台。\n\n> **考试警告**\n>\n> 如果在 CISSP®\
  \ 考试中被问到 `DAC` 与分散式访问控制的对比，请不要混淆。`DAC` 代表自主访问控制。考试中分散式访问控制将始终拼写全称。\n\n### 单点登录（SSO）\n\
  \n`单点登录（SSO）` 允许多个系统使用中央认证服务器（`AS`）。这允许用户认证一次，然后访问多个不同的系统。它还允许安全管理员在一个中央系统上添加、更改或撤销用户权限。\n\
  \n`SSO` 的优势如下。正如 Chris Dunne 在 IBM 文章“构建和实施单点登录解决方案”中所述，`SSO` 是一种重要的访问控制，可提供以下优势：\n\
  \n*   • “提高用户生产力。用户不再因多次登录而受困，也不需要记住多个 ID 和密码。此外，支持人员处理重置遗忘密码的请求也更少了。”\n*   • “提高开发人员生产力。`SSO`\
  \ 为开发人员提供了一个通用的认证框架。事实上，如果 `SSO` 机制是独立的，那么开发人员根本不必担心认证问题。他们可以假设，一旦对应用程序的请求附带了用户名，认证就已经完成了。”\n\
  *   • “简化管理。当应用程序参与单点登录协议时，管理用户账户的管理负担得以简化。简化的程度取决于应用程序，因为 `SSO` 只处理认证。因此，应用程序可能仍需要设置特定于用户的属性（如访问权限）。”\n\
  \n`SSO` 的劣势如下，在系统上实施 `SSO` 之前必须考虑这些因素：\n\n*   • “难以改造。`SSO` 解决方案对于现有应用程序来说可能难以改造、耗时且昂贵。”\n\
  *   • “无人看管的桌面。实施 `SSO` 减少了一些安全风险，但增加了其他风险。例如，如果用户离开座位且保持登录状态，恶意用户可能会访问该用户的资源。虽然这是安全方面的普遍问题，但对于\
  \ `SSO` 来说更严重，因为所有授权资源都会受到威胁。至少使用多重登录时，用户可能一次只登录一个系统，因此只有一个资源受到威胁。”\n*   • “单点攻击。使用单点登录时，所有应用程序都使用单个中央认证服务。这是黑客进行拒绝服务攻击的诱人目标”\
  \ [\\[9\\]](#Ch006_295-335_B9780443187346000052.xhtml#bb0050)。\n\n#### 单点登录的会话管理\n\
  \n权力越大，责任越大：`单点登录` 使用户能够通过一次认证访问大量信息。恶意访问这些资源的风险可能随 `SSO` 而增加，必须降低这种风险。请参阅上一节中引用自“构建和实施单点登录解决方案”的“无人看管的桌面”部分。\n\
  \n`SSO` 应始终与 `MFA`（多因素认证）结合使用，但这仍然无法消除现有会话被恶意利用的潜在风险。因此：应使用会话超时和自动锁定工作站的屏幕保护程序。用户离开工位时也应接受锁定工作站的培训。\n\
  \n### 联合身份管理\n\n`联合身份管理`（`FIM`）在更大范围内应用 `单点登录`：范围从跨组织到互联网规模。\n\n\n\n\n根据 EDUCAUSE\
  \ 的定义，“身份管理是指建立用户身份并强制执行关于数字资源访问规则的策略、流程和技术。在校园环境中，许多信息系统——如电子邮件、学习管理系统、图书馆数据库和网格计算应用程序——要求用户进行身份验证（通常使用用户名和密码）。随后，授权流程决定经过身份验证的用户被允许访问哪些系统。借助企业身份管理系统，用户无需为每个系统维护单独的凭据，而是可以使用单一的数字身份来访问其有权访问的所有资源。联合身份管理允许将这种方法扩展到企业级别之上，在多个组织之间建立数字身份的可信授权机构。在联合系统中，参与机构基于商定的标准共享身份属性，便于联邦其他成员进行身份验证，并授予对在线资源的适当访问权限。这种方法在简化数字资产访问的同时保护了受限资源”\
  \ [\\[10\\]](#Ch006_295-335_B9780443187346000052.xhtml#bb0055)。\n\n### SAML\n\n\
  `SAML`（安全断言标记语言）2.0 是当前版本，它提供了一种在系统之间传输身份数据的标准化方式。`SAML` 通过 XML 格式的断言传输这些数据，这些断言可以传达有关识别、身份验证，以及可能还有授权的详细信息。`SAML`\
  \ 的一个目标是实现互联网规模的基于 Web 的 SSO。\n\n`SAML` 涉及三个角色：身份提供者（`IdP`）、服务提供者（`SP`）和主体/用户。主体通常通过用户代理（即\
  \ Web 浏览器）向 `SP` 请求资源。`SP` 提供可由受信任主体利用的应用程序/资源，但依赖 `IdP` 来验证主体身份并为其担保。`IdP` 作为身份的可信来源，负责对用户/主体进行身份验证，并将验证结果传达给\
  \ `SP`。从高层来看，`SAML` 通过身份提供者（`IdP`）创建的 XML 格式断言进行操作，以向服务提供者（`SP`）传达有关主体/用户识别和身份验证状态的详细信息。\n\
  \n`SAML` 原生主要关注身份验证。虽然在某些用例中基本 `SAML` 可用于简单的授权，但它可以扩展以支持传输更强大的授权详细信息。要集成复杂的授权详细信息，`SAML`\
  \ 可以利用基于 XML 的可扩展访问控制标记语言（`XACML`）协议或 JSON 格式的 `OAuth`，后者将在下文讨论。\n\n### OAuth\n\n\
  `OAuth` 提供了一个授权框架，允许以标准化方式向应用程序传达和委派授权，而无需用户透露其凭据。请注意，`OAuth` 的重点和目的是促进授权，而非身份验证。`OAuth`\
  \ 的一个主要用例是用户授权客户端应用程序代表其行事，而无需将用户凭据暴露给该客户端应用程序。`OAuth` 通过使用访问令牌来实现这一点，客户端应用程序使用该令牌来证明用户已批准其代表用户行事。\n\
  \n`OAuth` 2.0 在 `OAuth` 1.0 发布不久后推出，解决了原始规范中的安全缺陷。\n\n### OIDC (OpenID Connect)\n\
  \n`OIDC`（OpenID Connect）构建在 `OAuth` 2.0 授权框架之上，并扩展了功能以促进身份验证，为 FIM 或 SSO 实现提供了 `SAML`\
  \ 的替代方案。如前所述，`OAuth` 旨在用于授权而非身份验证。对于开发人员而言，`OIDC` 的流程很大程度上反映了常用的 `OAuth` 2.0 框架，但现在它也可以传达身份和身份验证详细信息，而不仅仅是授权。`SAML`\
  \ 传达 XML 格式的断言，而 `OIDC` 则通过 ID Token 传达声明，该令牌采用 RFC 标准的 `JWTs`（JSON Web Tokens）结构进行格式化。\n\
  \n### 身份即服务 (IDaaS)\n\n鉴于身份是有效管理机密性、完整性和可用性的必要前提条件，显然身份在安全中发挥着关键作用。身份即服务（`IDaaS`），或称云身份，允许组织利用云服务进行身份管理。利用公共云服务进行身份管理的想法可能令人不安。然而，与所有安全事务一样，云身份也存在既能增加风险也能降低风险的因素。\n\
  \n利用 `IDaaS` 最重要的理由之一源于组织持续采用并集成云托管应用程序及其他面向公众的第三方应用程序。许多 `IDaaS` 供应商可以直接与这些服务集成，从而实现更流畅的身份管理和单点登录。组织在内部身份管理方面已举步维艰，尤其棘手的是账户/访问权限撤销。当组织还必须考虑到员工利用的公开可访问的关键应用程序时，这些挑战变得更加复杂。与云身份提供商集成所带来的其他常见安全收益包括：更容易部署和集成双因素或多因素身份验证、自助账户管理和密码重置、更好地支持移动设备集成，以及集中审计能力。\n\
  \n`IDaaS` 一个显而易见的安全顾虑在于组织关键身份和身份验证信息可能面临的更大暴露风险。使用传统的本地部署身份管理解决方案时，企业可自行控制平台本身的安全防护。而采用云身份时，如果身份提供商遭遇泄露，客户组织可能因此遭受毁灭性打击。\n\
  \nMicrosoft Accounts（前身为 Live ID）是越来越多企业内部采用的云身份示例。\n\n> **考试警告**\n>\n> 考试中，切勿将\
  \ `IaaS`（基础设施即服务，详见第 4 章，领域 3：安全架构与工程）与 `IDaaS`（身份即服务）混淆。\n\n### 结合第三方服务的联合身份\n\n\
  历史上，联合身份管理（FIM）专注于企业内部，并预期身份提供者和应用程序托管在本地。基于云的身份解决方案日益普及，以及云服务（特别是软件即服务 `SaaS` 应用程序）采用率的普遍上升，增加了\
  \ FIM 部署和服务模型的多样性。虽然本地部署的 FIM 仍在企业中广泛使用，但完全托管在云端的 FIM 解决方案以及整合了本地和云托管组件的混合解决方案的采用率也在不断提高。\n\
  \n尽管云身份（即 `IDaaS`）的采用率在上升，但并非所有应用程序和服务都能与 `IDaaS` 提供商集成。此外，从架构上讲，许多内部应用程序的部署方式使其难以轻松与面向公众的云身份提供商对接。虽然这并非解决上述挑战的完美方案，但缓解其中部分问题的一种方法是部署本地第三方身份服务。利用企业托管的第三方身份服务实现，可以解决纯公共云身份服务所带来的部分安全性和物流挑战。\n\
  \n\n\n第三方身份服务的本地部署实现可以允许内部应用程序与云身份集成。这甚至可能无需从根本上改变应用程序的安全架构即可实现。虽然这取决于实现细节，但转向集成第三方身份服务的另一个好处是，它可能允许组织的传统本地身份解决方案具有更大的可移植性。\n\
  \n部署企业托管的身份服务实例远非与第三方身份服务集成的唯一途径。另一种方法是部署解决方案，允许现有的传统本地身份提供者与云身份提供者集成。这种模式是联合本地组织身份的一种方式，并且可以允许使用典型的组织凭据，即使最终用户毫不知情，这些凭据也会与云身份集成，从而允许用户身份具有更大的可移植性。\n\
  \n### 凭据管理系统\n\n尽管进行了许多值得称赞的尝试试图超越它们，密码仍然是运营痛点的来源和攻击的常见目标。虽然 MFA（多因素认证）和/或无密码认证系统的采用似乎正在增加，但静态密码依然存在。合法凭据代表了对手的高价值目标。在初始利用之后，对手经常会寻找并破坏可用于在受损网络中横向移动的凭据。组织为降低凭据泄露的可能性或限制凭据泄露的影响所做的任何努力，对安全性都是巨大的裨益。\n\
  \n凭据管理系统可以通过有意义的方式帮助强化用户凭据。凭据管理系统可能提供的功能包括：安全密码生成、安全密码存储、凭据签入与签出、自动密码轮换、减少用户必须记住的凭据数量、用于解锁凭据的多因素认证，以及所有交互的审计日志记录。能够实现高效且安全的凭据访问和使用的凭据管理系统，可以增加用户为每个凭据利用不同的随机生成密码的可能性，并减少密码重用的发生。虽然功能各异，但凭据管理系统在帮助更好地保护这些高价值目标方面可以发挥至关重要的作用。\n\
  \n### LDAP\n\n`轻量级目录访问协议 (LDAP)` 为网络操作系统提供的目录服务信息提供了一种通用的开放协议，用于接口和查询。`LDAP` 广泛用于绝大多数内部身份服务，最著名的是\
  \ `Active Directory`。目录服务在许多应用程序中发挥着关键作用，通过 `LDAP` 暴露关键用户、计算机、服务和其他对象以供查询。\n\n`LDAP`\
  \ 是一种应用层协议，通过 `TCP` 或 `UDP` 使用端口 `389`。`LDAP` 查询可以以明文传输，并且根据配置，可能允许匿名查询部分或全部数据。自然地，`LDAP`\
  \ 确实支持经过身份验证的连接，也支持利用 `TLS` 的安全通信通道。\n\n### Kerberos\n\n`Kerberos` 是一种第三方认证服务，可用于支持\
  \ `单点登录 (Single Sign-On)`。`Kerberos` ([`www.kerberos.org/`](https://www.kerberos.org/))\
  \ 这个名字源自希腊神话中守护哈迪斯（也称刻耳柏洛斯）入口的三头犬。神话中 `Kerberos` 的三头意在象征 `AAA` 系统的三个“A”：认证、授权和审计。实际上，最初的\
  \ `Kerberos` 主要提供认证。现在有人认为 `Kerberos` 的三头代表客户端、`密钥分发中心 (Key Distribution Center,\
  \ KDC)` 和服务器。\n\n**考试警告**\n\n`Kerberos` 是在 `麻省理工学院 (MIT)` 的 `Project Athena` 项目下开发的。`Kerberos`\
  \ 极易成为考点；最好学会 `Kerberos` 的工作原理。\n\n`Kerberos FAQ`（参见 [`www.faqs.org/faqs/kerberos-faq/user/`](http://www.faqs.org/faqs/kerberos-faq/user/)）指出：“`Kerberos`\
  \ 是一种用于物理上不安全网络的网络认证系统，基于 Needham 和 Schroeder 提出的密钥分发模型。它允许通过网络通信的实体相互证明身份，同时防止窃听或重放攻击。它还使用诸如\
  \ `DES (数据加密标准)` 之类的密码系统，提供数据流完整性（检测修改）和保密性（防止未经授权的读取）” [\\[11\\]](#Ch006_295-335_B9780443187346000052.xhtml#bb0060)。\n\
  \n#### Kerberos 特性\n\n`Kerberos` 使用对称加密，并提供客户端和服务器的双向认证。它可防止网络嗅探和重放攻击。`Kerberos`\
  \ 的当前版本是版本 5，由 `RFC 4120` 描述 [\\[12\\]](#Ch006_295-335_B9780443187346000052.xhtml#bb97)。\n\
  \n`Kerberos` 具有以下组件：\n\n*   **主体**：客户端（用户）或服务\n*   **域**：一个逻辑 `Kerberos` 网络\n* \
  \  **票据**：验证主体身份的数据\n*   **凭据**：一张票据和一个服务密钥\n*   **KDC**：`密钥分发中心`，用于认证主体\n*   **TGS**：`票据授予服务`\n\
  *   **TGT**：`票据授予票据`\n*   **C/S**：`客户端/服务器`，关于两者之间的通信\n\n#### Kerberos 操作步骤\n\n\
  一个 `Kerberos` 主体，由用户 Alice 运行的客户端，希望访问一台打印机。Alice 可以在完成以下五个（简化）步骤后进行打印：\n\n1.  `Kerberos`\
  \ 主体 Alice 联系 `KDC`（`密钥分发中心`，充当认证服务器），请求认证。\n2.  `KDC` 向 Alice 发送一个会话密钥，该密钥使用 Alice\
  \ 的密钥加密。`KDC` 还发送一个 `TGT`（`票据授予票据`），该票据使用 `TGS` 的密钥加密。\n3.  Alice 解密会话密钥，并用它向 `TGS`（`票据授予服务`）请求打印权限。\n\
  4.  `TGS` 看到 Alice 拥有有效的会话密钥（因此证明了她的身份声明），向 Alice 发送一个 `C/S` 会话密钥（第二个会话密钥）供打印使用。`TGS`\
  \ 还发送一张服务票据，该票据使用打印机的密钥加密。\n5.  Alice 连接到打印机。打印机看到有效的 `C/S` 会话密钥，知道 Alice 有权打印，也知道\
  \ Alice 是真实的。\n\n该过程在 图 6.8 中总结。\n\n![图 6.8 Kerberos 步骤。](img/f06-08-9780443187346.jpg)\n\
  \n图 6.8 Kerberos 步骤。\n\n图 6.8 步骤 2 中的会话密钥使用 Alice 的密钥加密（表示为“{Session Key}Key^(Alice)”）。另请注意，`TGT`\
  \ 使用 `TGS` 的密钥加密：Alice 无法解密 `TGT`（只有 `TGS` 可以）；她只是将其发送给 `TGS`。`TGT` 包含许多项目，包括 Alice\
  \ 会话密钥的副本。这就是 `TGS` 知道 Alice 拥有有效会话密钥的方式（这证明了 Alice 已通过认证）。\n\n**注意**\n\n许多站点在一台系统上同时运行\
  \ `KDC` 和 `TGS` 服务，但它们也可以在单独的系统上运行。对于考试来说，将它们视为独立的系统会有所帮助。\n\n\n\nTGT 适用于站点选定的特定生命周期，通常设置为\
  \ 10 小时（工作日的长度，再加上几个小时）。这允许典型用户进行一次身份验证，并在票据的生命周期内访问网络资源。Kerberos 因此是无状态的：一旦 Alice\
  \ 拥有了 TGT，她就可以在其生命周期内使用它，即使 KDC 离线也没关系。此外，TGS 可以允许 Alice 打印而无需咨询 KDC：TGS 所需了解的一切都包含在\
  \ Alice 发送的流量中，包括 TGT 和第一个认证器。\n\nAlice 发送给打印机的服务票据也是如此。它是用打印机的密钥加密的，并包含一份客户端/服务器会话密钥的副本。Alice\
  \ 无法解密它，只是将其原封不动地传回给打印机。这使得打印机能够完全根据 Alice 发送的内容做出决定，而无需咨询 KDC 或 TGS。\n\n> **注意**\n\
  >\n> 本节（以及考试）描述的是“原生” Kerberos，而非特定供应商的实现，例如 Microsoft Windows Active Directory\
  \ 中的 Kerberos。\n\n#### Kerberos 的优势\n\nKerberos 提供客户端和服务器的相互认证。我们已经了解到 TGS 和服务器（如打印机）如何知道主体\
  \ Alice 已通过认证。Alice 也知道 KDC 是真正的 KDC。真正的 KDC 同时知道 Alice 和 TGS 的密钥。如果一个流氓 KDC 假装成真正的\
  \ KDC，它将无法访问这些密钥。图 6.9 展示了 Alice 尝试通过流氓 KDC 进行认证的步骤 1 和 2。\n\n![图 6.9 流氓 KDC。](img/f06-09-9780443187346.jpg)\n\
  \n图 6.9 流氓 KDC。\n\n流氓 KDC 不知道 Alice 或 TGT 的密钥。因此它提供垃圾密钥（`Key^(garbage)`）。当 Alice\
  \ 尝试解密会话密钥时，她将得到垃圾数据，而不是有效的会话密钥。Alice 就会知道该 KDC 是伪造的。\n\nKerberos 通过使用时间戳来缓解重放攻击（攻击者嗅探\
  \ Kerberos 凭据并在网络上重放它们）。认证器包含一个时间戳，请求的服务将拒绝任何过旧的认证器（通常为 5 分钟）。使用 Kerberos 的系统上的时钟需要同步，原因就在于此：时钟偏差会使认证器失效。\n\
  \n除了相互认证外，Kerberos 还是无状态的：由 KDC 或 TGS 颁发的任何凭据在其生命周期内均有效，即使 KDC 或 TGS 宕机也是如此。\n\n\
  #### Kerberos 的弱点\n\nKerberos 的主要弱点在于 KDC 存储了所有主体（客户端和服务器）的密钥。KDC 遭到攻破（物理或电子方式）可能导致\
  \ Kerberos 领域中每个密钥的泄露。\n\nKDC 和 TGS 也是单点故障：如果它们宕机，将无法颁发新凭据。现有凭据仍可使用，但新的身份验证和服务授权将停止。\n\
  \n在认证器的生命周期内，重放攻击仍然可能发生。攻击者可以嗅探认证器，针对客户端发起拒绝服务攻击，然后冒充或欺骗客户端的 IP 地址。\n\n在 Kerberos\
  \ 4 中，任何用户都可以为另一个用户请求会话密钥。因此 Eve 可以说：“嗨，我是 Alice，我想进行身份验证。”然后 KDC 会发送一个用 Alice 的密钥加密的\
  \ TGT 和会话密钥给 Eve。Eve 随后可以对加密的会话密钥发起本地密码猜测攻击，尝试猜出 Alice 的密钥。Kerberos 5 增加了一个额外步骤来缓解此攻击：在图\
  \ 6.8 的步骤 1 中，Alice 用她的密钥加密当前时间并将其发送给 KDC。KDC 知道 Alice 是真实的（拥有她的密钥），然后继续执行步骤 2。\n\
  \n最后，Kerberos 旨在缓解恶意网络：嗅探器将几乎没有价值。Kerberos 无法缓解恶意本地主机：明文密钥可能存在于内存或缓存中。恶意的本地用户或进程可能能够窃取本地缓存的凭据。\n\
  \n#### Kerberos 攻击利用\n\nKerberos 作为许多企业环境中的主要凭据守门人，意味着针对该生态系统的攻击无处不在且应在预料之中。针对 Kerberos\
  \ 最常见的攻击涉及对手仅仅获取并冒充已认证的安全主体。严格来说，这并不真正涉及对 Kerberos 的利用，而只是利用账户之前颁发的服务票据。在 Kerberos\
  \ 生态系统中，利用用户当前已验证的服务票据将允许对手访问用户已在访问的资源。\n\n也存在更明显的以 Kerberos 为中心的攻击模式。MITRE 的 ATT&CK®\
  \ 企业矩阵包含技术 1558 (T1558)：窃取或伪造 Kerberos 票据，这还强调了特定的攻击模式，如黄金票据、白银票据和 Kerberoasting\
  \ [\\[13\\]](#Ch006_295-335_B9780443187346000052.xhtml#bb98)。在每种情况下，总体目标都是让对手破坏\
  \ Kerberos 认证，以合法用户的身份出现，这可以实现对手的横向移动，并允许在受害环境中进行一般性访问。\n\n### 访问控制协议和框架\n\n集中式和分布式模型都可能支持远程用户向本地系统进行身份验证。许多协议和框架可用于支持这一需求，包括\
  \ `RADIUS`、`Diameter`、`TACACS/TACACS+`、`PAP` 和 `CHAP`，以及 Microsoft Active Directory。\n\
  \n#### RADIUS\n\n*远程认证拨号用户服务* 协议是一种第三方认证系统。`RADIUS` 在 RFC 2865 和 2866 中有描述，并使用用户数据报协议（`UDP`）端口\
  \ 1812（认证）和 1813（计费）。`RADIUS` 以前使用（非官方分配的）端口 1645 和 1646 用于相同的目的；某些实现仍继续使用这些端口。\n\
  \n`RADIUS` 被视为一个“AAA”系统，由三个组件组成：认证、授权和计费。它根据认证数据库验证主体的凭据。它通过允许特定用户访问特定数据对象来授权用户。它通过为每个建立的\
  \ `RADIUS` 连接创建日志条目来记录每个数据会话。\n\n`RADIUS` 请求和响应数据以属性值对（`AVPs`）的形式承载。根据 RFC 2865\
  \ ([`datatracker.ietf.org/doc/html/rfc2865`](https://datatracker.ietf.org/doc/html/rfc2865))，`RADIUS`\
  \ 支持以下代码：\n\n*   `Access-Request`\n*   `Access-Accept`\n*   `Access-Reject`\n* \
  \  `Accounting-Request`\n*   `Accounting-Response`\n*   `Access-Challenge`\n*  \
  \ `Status-Server`（实验性）\n*   `Status-Client`（实验性） [\\[14\\]](#Ch006_295-335_B9780443187346000052.xhtml#bb0065)\n\
  \n#### Diameter\n\n*Diameter* 是 `RADIUS` 的继任者，旨在提供改进的认证、授权和计费（`AAA`）框架。`RADIUS`\
  \ 提供的问责功能有限，且在灵活性、可扩展性、可靠性和安全性方面存在问题。`Diameter` 也使用属性值对，但支持更多：`RADIUS` 对 `AVP` 字段使用\
  \ 8 位（允许总共 256 个可能的 `AVPs`），而 `Diameter` 对 `AVP` 字段使用 32 位（允许数十亿个潜在的 `AVPs`）。这使得\
  \ `Diameter` 更加灵活，例如允许支持移动远程用户。\n\n`Diameter` 使用单个服务器来管理许多服务的策略，而 `RADIUS` 则需要许多服务器来处理所有安全连接协议。与\
  \ `RADIUS` 一样，`Diameter` 提供 `AAA` 功能，但此外，它通过使用传输控制协议（`TCP`）变得更加可靠。`Diameter` 在 RFC\
  \ 6733 ([`datatracker.ietf.org/doc/html/rfc6733`](https://datatracker.ietf.org/doc/html/rfc6733))\
  \ 中有描述。\n\n#### TACACS 和 TACACS+\n\n\n\n\n`终端访问控制器访问控制系统 (TACACS)` 是一种集中式访问控制系统，要求用户发送\
  \ ID 和静态（可重用）密码进行身份验证。TACACS 使用 UDP 端口 49（也可能使用 TCP）。可重用密码是一种漏洞：改进的 `TACACS+` 通过允许双因素强身份验证提供了更好的密码保护。\n\
  \n重要的是要注意，TACACS+ 不与 TACACS 向后兼容。TACACS+ 使用 TCP 端口 49 与 TACACS+ 服务器进行身份验证。实际的身份验证功能与\
  \ RADIUS 非常相似，但存在一些关键差异。\n\nRADIUS 仅加密密码（用户名等其他数据保持未加密状态）。而 TACACS+ 则加密 TACACS+\
  \ 头部以下的所有数据。这是对 RADIUS 的改进，安全性更高。\n\n### PAP 和 CHAP\n\n`密码认证协议 (PAP)` 由 RFC 1334\
  \ 定义（[`datatracker.ietf.org/doc/html/rfc1334#section-22`](https://datatracker.ietf.org/doc/html/rfc1334#section-22)），被称为“非强身份验证方法”\
  \ [\\[15\\]](#Ch006_295-335_B9780443187346000052.xhtml#bb0070)。用户输入密码，然后以明文形式通过网络发送。当\
  \ PAP 服务器接收到密码后，会对其进行认证和验证。嗅探网络可能会泄露明文密码。嗅探是指监控网络通信并捕获原始 TCP/IP 流量。\n\n`质询握手认证协议\
  \ (CHAP)` 由 RFC 1994 定义（[`datatracker.ietf.org/doc/html/rfc1994`](https://datatracker.ietf.org/doc/html/rfc1994)），可防范重放攻击。它使用一个中心位置对远程用户发起质询。正如\
  \ RFC 中所述，“CHAP 依赖于仅认证方和对等方知道的‘密钥’。密钥不会在链路上发送。虽然认证仅是单向的，但通过双向协商 CHAP，同一组密钥可轻松用于双向认证”\
  \ [\\[16\\]](#Ch006_295-335_B9780443187346000052.xhtml#bb0075)。\n\n与 PAP 相比，使用 CHAP\
  \ 的优势在于质询和响应过程中使用共享密钥提供的额外安全性：查看整个质询/响应过程的嗅探器将无法确定共享密钥。\n\n### Microsoft Active\
  \ Directory 域\n\nMicrosoft Windows Active Directory 使用 `域` 的概念作为控制访问的主要手段。出于身份验证目的，Microsoft\
  \ 基于 RFC 1510（Kerberos 认证协议）建立其信任关系认证，并自 Windows 2000 起已集成到 Microsoft Windows 操作系统中。每个域都有独立的身份验证过程和空间。每个域可能包含不同的用户、不同的网络资产和数据对象。由于\
  \ Microsoft Windows 也使用组的概念来控制用户对数据对象的访问，因此每个组可能被授予对系统内各个域的访问权限。如果在域之间创建了双向信任，则属于任一域的组均可访问对方域中的数据对象。\n\
  \n正如 Microsoft 所述，“特定信任如何传递身份验证请求取决于其配置方式；信任关系可以是单向的，提供从受信域到信任域中资源的访问，也可以是双向的，提供从每个域到另一个域中资源的访问。信任也可以是非传递的，即信任仅存在于两个信任伙伴域之间；或是传递的，即信任自动扩展到任一伙伴信任的任何其他域”[\\\
  [17\\]](#Ch006_295-335_B9780443187346000052.xhtml#bb0080)。\n\n**考试警告**\n\nMicrosoft\
  \ 信任关系分为两类：非传递性和传递性。非传递性信任仅存在于两个信任伙伴之间。传递性信任存在于两个伙伴及其所有伙伴域之间。例如：如果 A 信任 B，在传递性信任中，A\
  \ 将信任 B 以及 B 的所有信任伙伴。\n\n## 访问控制模型\n\n现在我们已经回顾了基石般的访问控制概念，可以讨论不同的访问控制模型了：主要模型包括\
  \ `自主访问控制 (DAC)`、`强制访问控制 (MAC)` 和 `基于角色的访问控制 (RBAC)`，以及最近定义的 `基于属性的访问控制 (ABAC)`\
  \ 和 `基于风险的访问控制`。\n\n不要认为某个模型优于另一个模型。相反，请记住每个模型都用于特定的信息安全目的。例如，如果你有一个需要立即更新数据的天气网站，但信息本身可能包含微小错误（天气数据以不可靠著称），其数据完整性模型将不同于包含核发射代码的绝密数据库（核发射代码数据**既**必须可靠，**又**必须高度机密）。\n\
  \n### 自主访问控制 (DAC)\n\n`自主访问控制 (DAC)` 赋予主体对其创建或被授权访问的对象的完全控制权，包括与其他主体共享对象。主体被赋予权力并控制其数据。标准的\
  \ UNIX 和 Windows 操作系统对文件系统使用 DAC：主体可以授予其他主体访问其文件的权限、更改其属性、修改或删除它们。\n\n如果主体犯了错误，例如将错误的文件作为附件发送到公共邮件列表，可能导致机密性丧失。错误和恶意行为也可能导致数据完整性或可用性丧失。\n\
  \n### 强制访问控制 (MAC)\n\n`强制访问控制 (MAC)` 是基于主体的许可级别和对象的标签的系统强制访问控制。主体和对象分别具有许可级别和标签，如机密、秘密和绝密。仅当主体的许可级别等于或高于对象的标签时，主体才能访问该对象。主体无法与缺乏适当许可的其他主体共享对象，也无法将对象“写入”较低的分类级别（如从绝密到秘密）。MAC\
  \ 系统通常专注于保护数据的机密性。\n\n强制访问控制的实施成本高昂且困难，尤其是在尝试在同一个互联 IT 系统中分离不同的机密性级别（安全域）时。对用户进行许可审查是一个昂贵的过程；详见第\
  \ 3 章“许可”部分，领域 2：资产安全。具体的 MAC 模型（如 Bell-LaPadula）将在第 4 章讨论，领域 3：安全架构与工程。\n\n###\
  \ 基于角色的访问控制\n\n`基于角色的访问控制 (RBAC)` 根据主体的角色定义如何在系统上访问信息。角色可以是护士、备份管理员、服务台技术人员等。主体被分组为角色，每个定义的角色基于角色而非个人拥有访问权限。\n\
  \n根据 NIST，RBAC 具有以下规则：\n\n1.  **角色分配：** 仅当主体选择或被分配了角色时，才能执行事务。识别和认证过程（如登录）不被视为事务。系统上的所有其他用户活动均通过事务进行。因此，所有活跃用户都必须具有某个活跃角色。\n\
  2.  **角色授权：** 主体的活跃角色必须经主体授权。结合上述规则 (1)，此规则确保用户只能承担其被授权的角色。\n\n\n\n\n\n### 3. 事务授权\n\
  \n只有当事务通过主体的角色成员资格获得授权，并受限于可能应用于用户、角色和权限之间的任何约束时，主体才能执行该事务。结合（1）和（2），此规则确保用户只能执行其被授权执行的事务\
  \ [18]。\n\n即使是强大的角色也有限制；例如，许多组织不允许系统管理员在使用管理员账户时浏览网页。这使得系统上的每个角色保持独立，并减少了更敏感账户的暴露风险。表\
  \ 6.1 显示了基于用户在系统上的角色而具有不同数据访问权限的示例。\n\n**表 6.1 RBAC**\n\n| 角色 | 示例数据访问 |\n| ---\
  \ | --- |\n| 基本用户 | 桌面应用程序：电子邮件、电子表格、网页访问 |\n| 审计员 | 系统安全日志、认证服务器日志 |\n| 网络工程师 |\
  \ 路由器日志、防火墙日志、VPN 集中器日志 |\n\n#### 基于任务的访问控制\n\n*基于任务的访问控制*提供了一种与 RBAC 紧密相关的访问控制模型。基于任务的访问控制基于每个主体必须执行的任务，例如开具处方、从备份磁带恢复数据或打开服务台工单。它试图解决\
  \ RBAC 解决的同一个问题，但侧重于特定任务，而非角色。请注意，任务也可以作为一种属性，用于指导本章后面讨论的基于属性的访问控制（ABAC）。\n\n###\
  \ 基于规则的访问控制\n\n正如预期的那样，*基于规则的访问控制*系统使用一系列定义好的规则、限制和过滤器来访问系统内的对象。规则采用“如果/那么”语句的形式。基于规则的访问控制设备的一个例子是代理防火墙，它仅允许用户使用预定义的已批准内容浏览网页（“如果用户被授权浏览网页，且该站点在批准列表中，则允许访问”）。其他站点被禁止，且此规则在所有经过认证的用户中强制执行。\n\
  \n### 基于属性的访问控制（ABAC）\n\n基于属性的访问控制（ABAC）代表了一种促进现代信息系统访问控制的较新方法。在 ABAC 中，将审查主体和/或客体的属性，以确定其值是否满足授予或拒绝访问的预期要求。要评估的特定属性实际上可以是任何可以编码进\
  \ ABAC 生态系统的内容。ABAC 中常见的属性包括：是否采用了 MFA，以及最近一次满足 MFA 质询的时间；请求访问的位置（例如，本地部署与远程）；请求访问的系统（例如，公司拥有的笔记本电脑与员工自有的移动设备）；用于访问的接口（例如，API\
  \ 与 Web 门户）。上述列表中的大多数属性都是面向主体的属性。基于对象的属性，例如正在被访问的内容类型，同样也可以在 ABAC 访问决策中发挥重要作用。\n\
  \n虽然绝非专门与云服务相关，但面向 ABAC 的方法在云服务中被广泛采用，作为一种现代且灵活的生态系统，与传统的 MAC、DAC 甚至 RBAC 生态系统相比，它能提供更动态的访问控制方法。\n\
  \n#### 基于内容和上下文的访问控制\n\n基于内容和*上下文的访问控制*本身并非成熟的访问控制方法，但可以发挥纵深防御的支持作用。历史上，它们可能作为额外的控制被添加，通常添加到\
  \ DAC 系统中，但现在这些方法通常被用作 ABAC 生态系统中的重要属性。\n\n*基于内容的访问控制*在身份识别和认证之外增加了额外标准：主体试图访问的实际内容。组织的所有员工可能都有权访问\
  \ HR 数据库以查看其累积的病假和休假时间。如果某员工试图访问 CIO 的 HR 记录内容，则会被拒绝访问。\n\n基于上下文的访问控制在授予访问权限前应用额外的上下文。常用的上下文是时间。在身份识别和认证后，一名周一至周五上午\
  \ 9 点至下午 5 点工作的服务台人员，将在周二中午获得访问权限。基于上下文的访问控制系统可能会在周日凌晨 1:00 拒绝访问（时间错误，因此上下文错误）。\n\
  \n### 基于风险的访问控制\n\n尽管命名使基于风险的访问控制听起来相当笼统，但其现实影响却十分重大。经典的访问控制范式涉及确定是应授予还是拒绝主体对客体的访问。虽然这听起来很简单，但当前的威胁形势涉及对手以用户及其关联系统为目标，以获取对受损用户或系统可访问资源的访问权限。一个重要的访问控制问题变成了：寻求访问的主体是否实际上是已获得对该主体一定程度控制权的对手。\n\
  \n基于风险的访问控制的目标是在确定必要时和地点，采取动态或自适应的访问控制措施。基于风险的访问控制方法的两种表现形式包括自适应认证和逐级认证。这两种方法都涉及在特定情况下，要求在允许主体访问客体之前对其进行额外的审查。\n\
  \n> **考试警告**\n>\n> 在 CISSP® 考试中，RBAC 代表基于角色的访问控制。请小心不要将 RBAC 缩写与基于规则的访问控制或基于风险的访问控制混淆。在考试中，基于规则的访问控制和基于风险的访问控制将始终拼写全称。\n\
  \n#### 逐级认证\n\n逐级认证要求用户在被允许继续访问先前定义为更敏感或关键的数据或功能之前，通过额外的验证。涉及逐级认证的常见场景是要求用户在被允许执行关键事务之前重新验证其\
  \ MFA。逐级认证可被视为一种基于风险的访问控制，因为它关注的是一旦被攻破将导致更重大影响的资产。\n\n#### 自适应认证\n\n自适应认证代表了一种不同的方法，同样具有基于风险的访问控制的特征。通过自适应认证，应用程序或信息系统识别出与主体相关的可疑行为或特征，并将在授予访问权限前要求进一步验证。例如，用户可能试图访问其从未访问过的数据，或从以前未见过的位置进行访问。这种与其正常配置文件的偏差可能会触发应用程序要求用户在提供所请求的访问权限前，再次成功通过\
  \ MFA 质询。\n\n## 身份与访问配置生命周期\n\n\n\n\n\n### 访问供应生命周期\n\n一旦选择并部署了适当的访问控制模型，就必须维护并保障访问供应生命周期的安全。虽然许多组织遵循授予访问权限的最佳实践，但许多组织缺乏正式流程，以确保在员工和承包商在组织内部流动时，访问权限的整个生命周期始终保持安全。身份与访问生命周期包含诸如身份注册与审核、定义逻辑角色、安全地供应和取消供应账户及访问权限等考量因素。限制账户及其关联访问权限暴露的操作控制也同样相关，包括访问评审、即时供应和权限提升机制等组件。\n\
  \n始终将账户撤销作为访问供应生命周期中的必需步骤。此流程应与人力资源部门紧密协调，不仅要跟踪离职情况，还要跟踪组织内部的横向和纵向调动或晋升。此外，如前所述，不活跃账户应作为撤销目标。\n\
  \n#### 注册、审核与身份建立\n\n当考虑对个人进行审核和验证时，许多安全专业人员在思维上会直接跳到认证环节，但逻辑上的前置步骤涉及一个健壮的身份识别组件流程。简单来说，在我们能够认证某个个体之前，我们需要实际了解并收集与该个体相关的信息。为此，在信息系统中建立身份涉及身份注册和审核的过程。\n\
  \n注册（也可称为入册）涉及在系统中请求或申请身份，并提供系统所需的、允许唯一识别的信息。一旦提供了必要的识别属性，就需要对这些属性进行验证。审核涉及对注册/入册过程中提供的属性进行验证和确证。将审核明确作为一个单独流程提出的原因之一，是因为某些场景在身份验证过程中会利用第三方处理器。身份审核验证过程的范围，与大多数事物一样，由风险管理原则决定。\n\
  \n#### 角色定义\n\n组织及其信息系统会定期发生变化。随着组织内部新职能的定义，显然也将需要以定义角色的形式来表达这些职能的访问控制要求。然而，即使员工继续从事同一份工作，其职能随时间推移也可能发生重大变化。工作性质的变化同样可能导致访问控制系统中需要新的角色定义。前文讨论的基于角色的访问控制（RBAC）和利用角色作为属性的基于属性的访问控制实现的有效性，取决于定义清晰且被充分理解的角色。\n\
  \n#### 供应与取消供应\n\nCISSP® 指南中常见的一个主题是适当管理资产整个生命周期内的安全。供应和取消供应这两个术语进一步凸显了这一重点。供应是指将资产带入运行状态的过程，有时称为投入生产。必须在供应前考虑安全性，以确保该过程以足够的严谨性处理，且不会对已认定可接受的安全态势产生负面影响。\n\
  \n不可避免地，资产不再需要保持运行状态的时刻终将到来。取消供应是指将资产安全地从生产环境中移除的过程。这一过程同样需要从安全角度进行考量。虽然供应/取消供应仅代表可适用于任何资产的通用过程，但这些术语更常见于用户账户、系统和应用程序的讨论中。自然，与\
  \ IAM（身份与访问管理）最相关的考量是与用户供应/取消供应相关的安全性。在对用户进行供应/取消供应时，或许最关键的考量是与访问控制相关的问题。\n\n显然，供应在雇佣新员工时相关，取消供应在员工随后离职时相关，但当员工在组织内发生重大角色变更时，也应给予应有的考量。理想情况下，如果员工的角色性质发生实质性变化，则应取消供应其初始访问权限，并重新供应其现在所需的访问权限。然而在现实中，完整地走完取消供应和供应流程可能过于繁琐。尽管如此，仍应极力避免员工仅不断积累越来越多的访问权限，而不撤销不必要的访问权限这一常见情况。\n\
  \n#### 即时访问（JIT）\n\n虽然“即时”（JIT）一词在商业界已使用多年，但其在信息安全领域的应用则近得多。访问控制领域的即时现象，与传统的、典型的永久性和持续性访问形成鲜明对比，在\
  \ JIT 视角中，后者被称为“常驻访问”。在 JIT 访问中，需要注意在可用性与安全性之间取得适当平衡。如果 JIT 访问工作流变得过于繁琐，往往会产生恢复常驻访问范式的愿望。\n\
  \n设想一个经典场景：员工入职，其账户被供应了组织预期该员工所需的所有权利和权限。其中一些权限会每天使用，而另一些可能很少用到。特别是在那些不常用但具有重大安全影响的访问权限场景中，可能存在实施\
  \ JIT 访问的机会。采用 JIT 可能涉及这样一个流程：当员工需要利用该不常用但敏感的访问权限时，必须启动一个审批流程，以允许提供临时访问权限。\n\nJIT\
  \ 不仅涉及按需向用户提供特权，还涉及用户和系统供应以及远程访问。JIT 远程访问的一个示例是：仅在需要访问时临时开放远程访问端口（例如 `TCP/3389`），而不是让该服务始终可访问、从而始终处于攻击之下。JIT\
  \ 账户供应涉及仅在明确需要时创建账户，然后在所需账户及其关联访问权限被使用后自动取消供应该账户。\n\n#### 账户访问评审\n\n无论在访问控制管理中投入了多少关怀和严谨，必然会出现过度授权的情况，即提供了超出严格必要范围的访问权限。虽然应用程序可能因权限不足而中断、员工可能会抱怨，但因账户被提供过多访问权限而引发的抱怨会少得多。定期访问评审可作为控制多余访问的一种手段。\n\
  \n虽然理论上审慎的做法是审查每个主体和对象的所有访问权限，但这样做极其繁琐。通常应采用基于风险的方法，优先审查高权限账户、重要交易或服务、敏感数据以及关键系统和应用程序。\n\
  \n\n\n\n根据内部审计师协会全球技术审计指南，“作为 IAM（身份与访问管理）流程的一部分，权利管理应旨在启动、修改、跟踪、记录和终止分配给用户账户的权利或访问权限。无论组织采用何种方法将用户账户归类为相似功能（例如工作组、角色或配置文件），都需要妥善管理每个用户的权利。因此，组织应定期审查访问权限，以检测用户在组织内部流动时积累权利的情况，或用户被分配了不当权利的情况”\
  \ [\\[19\\]](#Ch006_295-335_B9780443187346000052.xhtml#bb0095)。\n\n#### 访问聚合\n\n\
  *访问聚合* 是指单个用户获得对更多系统的更多访问权限。这可能是有意为之，作为单点登录（SSO）的一种功能。也可能是无意发生的：用户在承担新角色或职责时往往会获得新的权利（也称为访问权限）。这可能导致\
  \ *授权蔓延*：用户获得更多权利却不放弃旧权利。这些权利的威力会随时间累积，从而破坏最小权限和职责分离等控制措施。用户权利必须定期审查和审计。应建立流程来审查，并理想情况下减少或消除旧权利，同时授予新权利。\n\
  \n###### 权限提升\n\n权限提升涉及获得比最初授予的更高级别的特权。攻击者可能会利用漏洞来实现权限提升。合法用户，尤其是执行管理职能的用户，也可能需要使用比标准账户可用的更高级别的特权。即使是合法用户的情况，鉴于提升特权所关联的更实质性能力，权限提升也必须受到控制。\n\
  \n即使是持续执行需要更高特权操作的用户，仍在操作那些不需要这些更高特权的系统/应用程序。虽然仅利用单个高度特权账户可能非常高效，但这会在特权账户用于网页浏览、发送电子邮件等操作时增加其暴露风险。对于需要使用更高特权的员工，利用一个足够特权的账户执行所有操作的替代方案是为其提供多个用户账户。其中一个账户将作为用于通用计算的事实标准账户，是一个标准的非特权用户账户。他们的额外账户将用于执行需要更实质性特权的操作。\n\
  \n虽然根据需要使用不同账户登录/注销理论上是一个可行的选择，但操作负担和烦恼将是巨大的。值得庆幸的是，现代操作系统提供了专门用于处理这种多账户场景的内置功能。\n\
  \n##### 使用 su 和 sudo 提升特权\n\n基于 Linux 和 UNIX 的系统长期以来一直支持使用标准特权登录，然后允许提升特权。经典方法（通常仍然可用）涉及使用二进制文件\
  \ `su`（substitute user，替代用户）。虽然 `su` 允许使用用户知道密码的任何账户，但最常见的默认场景是系统管理员使用 `su` 以特权\
  \ root 用户身份执行二进制文件。`su` 最大的缺点是使用该二进制文件要求用户知道他们要利用的账户的密码。这种使用模式因此要求任何利用 `su` 的用户都知道\
  \ root 的密码，这从安全角度来看显然是次优的。\n\n为了解决与 `su` 相关的共享 root 密码问题，可以使用较新的 `sudo` 二进制文件。使用\
  \ `sudo` 时，用户只需通过提供自己账户的密码来重新验证其账户，而不是像 `su` 方法那样提供将要使用其特权的账户的密码。\n\n##### 托管服务账户\n\
  \n应用程序经常需要作为经过身份验证的、且通常是高度特权的用户账户来运行。服务账户一词用于指示这些面向应用程序且不直接映射回个人的用户账户。历史上，这些服务账户与典型的面向人类的用户账户几乎没有区别。托管服务账户这一短语表明，针对这些面向应用程序的账户，有不同且更严格的控制措施来区别对待。最重要和最显著的特征差异之一是托管服务账户密码的处理方式。\n\
  \n托管服务账户拥有自动生成的复杂密码，并自动维护。某些托管服务账户的实现还可以确保服务账户只能在与该服务关联的系统上下文中使用。因此，即使与该账户关联的凭据被泄露，滥用这些凭据的影响也可以得到限制。\n\
  \n### 考试目标总结\n\n如果将安全比作城堡，访问控制就是护城河和城墙。身份与访问管理确保从逻辑和物理两个视角出发，边界保护机制都是安全的。访问控制的目的是允许授权用户访问适当的数据并拒绝未授权用户的访问——这也称为限制主体对客体的访问。即使这项任务复杂且繁琐，但也可以在不给依赖系统访问的用户造成过重负担的情况下实施强有力的访问控制计划。\n\
  \n保护 CIA 三要素是实施访问控制的另一个关键方面。维护机密性、完整性和可用性至关重要。维护系统 CIA 的安全意味着制定特定的数据访问程序。这些程序将根据用户所需的功能和系统上存储数据的敏感性而变化。\n\
  \n### 自我测试\n\n**注意**\n\n请参阅自我测试附录，了解所有正确和错误答案的解释。\n\n1.  **1. 哪种密码破解攻击类型总是会成功？**\n\
  \    1.  A. 暴力破解\n    2.  B. 字典攻击\n    3.  C. 混合攻击\n    4.  D. 彩虹表\n\n2.  **2. 密码破解和密码猜测有什么区别？**\n\
  \    1.  A. 它们是一样的\n    2.  B. 密码猜测尝试登录系统；密码破解尝试确定用于创建哈希的密码\n    3.  C. 密码猜测使用盐值；密码破解不使用\n\
  \    4.  D. 密码破解有账户锁定风险；密码猜测没有\n\n3.  **3. 同一系统上的两个用户拥有相同的密码，但在 `/etc/shadow` 文件中存储的哈希值不同。哈希值不同的最可能原因是什么？**\n\
  \    1.  A. 用户名不同，所以哈希值会不同\n    2.  B. 使用了多种哈希算法\n    3.  C. 使用了彩虹表\n    4.  D.\
  \ 使用了盐值\n\n4.  **4. 哪种认证方法以明文暴露密码？**\n    1.  A. CHAP\n    2.  B. Kerberos\n   \
  \ 3.  C. PAP\n    4.  D. OIDC\n\n5.  **5. 视网膜扫描和虹膜扫描的主要区别是什么？**\n    1.  A. 视网膜扫描无创，虹膜扫描有创\n\
  \    2.  B. 虹膜扫描侵犯个人隐私，视网膜扫描不侵犯\n    3.  C. 虹膜扫描随个人健康状况变化；视网膜扫描稳定\n    4.  D. 视网膜扫描随个人健康状况变化；虹膜扫描稳定\n\
  \n6.  **6. 组织在实施 RBAC 时需要做出的最重要决定是什么？**\n\n\n\n\n### 自测题\n\n#### 1. 每个用户的安全许可都需要最终确定\n\
  \n#### 2. 用户在系统上的角色需要明确定义\n\n#### 3. 用户的数据需要明确标记\n\n#### 4. 用户必须在 IT 系统上相互隔离，以防止敏感数据泄露\n\
  \n#### 7. 哪种访问控制方法可以在授予访问权限前审查其他因素，例如尝试访问的时间？\n\n##### A. 自主访问控制\n##### B. 基于属性的访问控制\n\
  ##### C. 基于角色的访问控制\n##### D. 基于规则的访问控制\n\n#### 8. 哪种服务被称为云身份，并允许组织利用云服务进行身份管理？\n\
