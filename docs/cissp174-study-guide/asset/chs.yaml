  \n### 第 2 章：领域 1：安全与风险管理\n\n## 摘要\n\n安全与风险管理是本章及 CISSP® 领域 1 的主题，其中包含许多至关重要的术语和概念，这些内容贯穿多个领域。本章介绍了\
  \ CIA 三要素——机密性、完整性和可用性，它们几乎涉及每个领域和章节。除了 CIA，本章还介绍了最小权限原则和知悉需要等概念。与风险管理相关的关键术语、概念和公式也在本章中呈现。`Risk`、`threat`、`vulnerability`\
  \ 是必须理解的基本术语，以便在该领域取得成功。理解如何使用 `Annualized Loss Expectancy (ALE)`（年度损失期望值）、`Single\
  \ Loss Expectancy (SLE)`（单次损失期望值）、`Annualized Rate of Occurrence (ARO)`（年度发生率）和\
  \ `Exposure Factor (EF)`（暴露因子）进行计算，被作为定量风险分析的一部分重点强调。与信息安全治理相关的重要概念，如隐私、应有注意、应有尽责、认证和授权，也是本章的重点。\n\
  \n### 关键词\n\n机密性；完整性；可用性；主体；客体；年度损失期望值；威胁；漏洞；风险；保障措施\n\n本章考试目标：\n\n* • 基石信息安全概念\n\
  * • 法律与法规问题\n* • 职业道德\n* • 信息安全治理\n* • 访问控制防御类别和类型\n* • 风险分析\n* • 安全与第三方\n* • 攻击者类型\n\
  \n## 独特术语和定义\n\n* • **机密性**——旨在防止信息未经授权的披露：保持数据秘密\n* • **完整性**——旨在防止信息未经授权的修改。换句话说，完整性旨在防止对数据的未授权写入访问。完整性还旨在确保以授权方式写入的数据是完整且准确的\n\
  * • **可用性**——确保在需要时信息可用\n* • **主体**——信息系统上的活动实体\n* • **客体**——被动数据文件\n* • **年度损失期望值**——一年内因风险导致的损失成本\n\
  * • **威胁**——潜在的负面事件\n* • **漏洞**——系统中的弱点\n* • **风险**——匹配的威胁和漏洞\n* • **保障措施**——为降低风险而采取的措施\n\
  * • **总拥有成本**——保障措施的成本\n* • **投资回报率**——部署保障措施节省的资金\n\n## 简介\n\n作为信息安全专业人员，我们的工作是评估针对关键\
  \ `assets`（资产）的 `risks`（风险），并部署 `safeguards`（保障措施）以缓解这些风险。我们在各种角色中工作：防火墙工程师、渗透测试员、审计员、管理层等。共同的主线是风险：它是我们职位描述的一部分。\n\
  \n安全与风险管理领域侧重于风险分析和缓解。该领域还详述了安全治理，即成功的信息安全计划所需的组织架构。在这一领域，成功与失败的组织之间的区别，通常不取决于资金或员工规模：而是取决于将合适的人放在合适的岗位上。拥有支持并投入其中的领导层的、知识渊博且经验丰富的信息安全员工是成功的关键。\n\
  \n说到领导层，学会说领导层的语言是你在该行业取得个人成功的另一关键。能够用 C 级高管听得懂的语言有效沟通信息安全概念，是一种罕见且急需的技能。本领域将通过讨论\
  \ `Total Cost of Ownership (TCO)`（总拥有成本）和 `Return on Investment (ROI)`（投资回报率）等风险术语，帮助你掌握他们的语言。\n\
  \n## 基石信息安全概念\n\n在解释访问控制之前，我们必须定义基石信息安全概念。这些概念为通用知识体系（CBK）的 8 个领域奠定了基础。\n\n> **注意**\n\
  >\n> 基石信息安全概念将在本书中反复出现。这种重复是经过设计的：我们在第一个领域开始时介绍这些概念，然后在后续领域中不断强化它们，同时聚焦于特定于该领域的问题。如果你不理解这些基石概念，你将无法通过考试。\n\
  \n### 机密性、完整性和可用性\n\n`Confidentiality`（机密性）、`Integrity`（完整性）和 `Availability`（可用性）被称为“CIA\
  \ 三要素”，是信息安全的基石概念。如 图 2.1 所示，该三要素构成了信息安全赖以建立的“三脚凳”。首字母缩写的顺序可能会变化（有人偏好用“AIC”，或许是为了避免与某情报机构产生联想），这并不重要：理解每个概念才是关键。本书将使用“CIA”这一缩写。\n\
  \n![图 2.1 CIA 三要素。](img/f02-01-9780443187346.jpg)\n\n图 2.1 CIA 三要素。\n\nCIA 三要素的这三个部分协同工作，以确保数据和系统保持安全。不要假设三要素的某一部分比其他部分更重要。每个\
  \ IT 系统根据其数据、用户群体以及访问数据所需的时效性，都需要对这三者进行不同的优先级排序。存在与 CIA 相对立的力量。如 图 2.2 所示，这些力量是披露、篡改和破坏（DAD）。\n\
  \n![图 2.2 披露、篡改和破坏。](img/f02-02-9780443187346.jpg)\n\n图 2.2 披露、篡改和破坏。\n\n#### 机密性\n\
  \n机密性旨在防止信息未经授权的披露：它保持数据秘密。换句话说，机密性旨在防止对数据的未授权读取访问。机密性攻击的一个例子是窃取 `Personally Identifiable\
  \ Information (PII)`（个人身份信息），如信用卡信息。\n\n数据必须仅对具有许可、正式访问批准和知悉需要的用户可访问。许多国家都希望保守其国家安全信息秘密，并通过确保到位的机密性控制来实现这一目标。\n\
  \n大大小小的组织都需要保持数据机密。美国的一项法律《健康保险流通与责任法案》（HIPAA）要求医疗服务提供者对患者的个人和医疗信息保密。你能想象如果患者的医疗和个人数据以某种方式泄露给公众，会对医疗机构造成多大的潜在损害吗？这不仅会导致信心丧失，还可能使医疗服务提供者面临患者或政府监管机构可能采取的法律行动。\n\
  \n#### 完整性\n\n\n\n\n#### 完整性\n\n完整性旨在防止信息被未授权修改。换句话说，完整性旨在防止对数据的未授权写访问。\n\n完整性分为两种类型：数据完整性和系统完整性。数据完整性旨在保护信息免受未授权修改；系统完整性旨在保护系统（如\
  \ Windows Server 2022 操作系统）免受未授权修改。如果一名不道德的学生入侵大学成绩数据库以提高其不及格的成绩，则他违反了数据完整性。如果他在系统上安装恶意软件以允许未来的“后门”访问，则他违反了系统完整性。\n\
  \n#### 可用性\n\n可用性确保在需要时信息可用。系统需要可用（可用性）以供正常业务使用。针对可用性的攻击示例是 `拒绝服务` (DoS) 攻击，其旨在拒绝系统的服务（或可用性）。\n\
  \n### 概念间的张力\n\n机密性、完整性和可用性有时相互对立：将数据锁在保险箱里并扔掉钥匙可能有助于机密性和完整性，但会损害可用性。这是错误的答案：我们作为信息安全专业人员的使命是平衡机密性、完整性和可用性的需求，并根据需要进行权衡。信息安全新手的一个明显标志是向问题抛出所有机密性和完整性控制，而不解决可用性问题。正如\
  \ 图 2.3 所示，妥善平衡这些概念并非易事，但值得做的事情很少是容易的。\n\n![图 2.3 平衡 CIA 三要素。](img/f02-03-9780443187346.jpg)\n\
  \n图 2.3 平衡 CIA 三要素。\n\n### 泄露、篡改和破坏\n\nCIA 三要素也可用其对立面来描述：`泄露`、`篡改` 和 `破坏` (DAD)。泄露是信息的未授权发布；篡改是数据的未授权修改；破坏是使系统或数据不可用。虽然\
  \ CIA 缩写中各个组成部分的顺序有时会变化，但 DAD 缩写按该顺序显示。\n\n## 身份与认证、授权和审计 (AAA)\n\n术语“AAA”常用于描述基石概念\
  \ `认证`、`授权` 和 `审计`。AAA 缩写中遗漏了 `标识`（在实现其余三个“A”之前需要先完成标识）。\n\n### 身份与认证\n\n身份是一种声称：如果你的名字是“X\
  \ 先生”，你通过说“我是 X 先生”来标识自己。仅凭身份是薄弱的，因为没有证明。你也可以通过说“我是 Y 先生”来标识自己。证明身份声称称为认证：你对身份声称进行认证，通常通过提供只有你拥有的信息或对象，例如数字世界中的密码，或物理世界中的护照。\n\
  \n当你在机场办理登机手续时，票务代理会询问你的名字（你的身份）。你可以随便说任何名字，但如果你撒谎，很快就会面临问题：代理会要求你出示驾照或护照。换句话说，他们将寻求认证你的身份声称。\n\
  \n图 2.4 显示了身份与认证之间的关系。用户 Deckard 登录到 [ericconrad.com](http://ericconrad.com) 的电子邮件账户。他在用户名框中输入“deckard”；这是他在系统上的身份。请注意，Deckard\
  \ 可以在用户名框中输入任何内容：仅凭标识是薄弱的。它需要证明，即认证。Deckard 随后输入密码“R3plicant!”这是 [ericconrad.com](http://ericconrad.com)\
  \ 上用户 Deckard 的正确密码，因此 Deckard 的身份声称得到证明，他成功登录。\n\n![图 2.4 标识和认证。](img/f02-04-9780443187346.jpg)\n\
  \n图 2.4 标识和认证。\n\n身份必须唯一：如果两名员工都叫 John Smith，他们的用户名（身份）不能都是 jsmith：这会损害审计。共享账户（身份）也会损害审计：策略应禁止共享账户，并应开展安全意识培训以教育用户了解这一风险。\n\
  \n理想情况下，用户名应为非描述性的。示例用户名“jsmith”是一个描述性用户名：攻击者只需知道用户的真实姓名即可猜测出用户名。这将提供发起成功密码猜测攻击所需信息的一半（有效身份），另一半是\
  \ jsmith 的密码（认证所需）。非描述性身份“bcon1203”将使密码猜测攻击（以及许多其他类型的攻击）更加困难。\n\n### 授权\n\n授权描述了在你被标识和认证后，可以在系统上执行的操作。操作可能包括读取、写入或执行文件或程序。如果你是拥有人力资源数据库公司的信息安全经理，你可能被授权查看自己的数据，或许还有一些员工的数据（如累计病假或休假时间）。你将无权查看\
  \ CIO 的薪水。\n\n图 2.5 使用 Ubuntu Linux 系统展示了授权。用户 Deckard 已标识并认证自己，并登录到系统。他使用 Linux\
  \ `cat` 命令查看“sebastian-address.txt”的内容。Deckard 被授权查看此文件，因此权限被授予。随后 Deckard 尝试查看文件\
  \ `/etc/shadow`，该文件存储用户的密码哈希值。Deckard 无权查看此文件，因此权限被拒绝。\n\n![图 2.5 Linux 文件授权。](img/f02-05-9780443187346.jpg)\n\
  \n图 2.5 Linux 文件授权。\n\n### 审计\n\n审计要求用户对其行为负责。这通常通过记录和分析审计数据来完成。强制执行审计有助于让“诚实的人保持诚实”。对某些用户而言，仅知道数据被记录不足以提供审计约束：他们必须知道数据被记录和审计，且违反\
  \ `策略` 可能导致 `制裁`。\n\n医疗公司 Kaiser Permanente 执行了审计，因违反策略（并可能违反 HIPAA 等法规）在不知情的情况下查看\
  \ Nadya Suleman（即“八胞胎妈妈”）的医疗记录，解雇或惩戒了 20 多名员工。详见 [`www.scmagazine.com/news/security-news/octomoms-hospital-records-accessed-15-workers-fired`](https://www.scmagazine.com/news/security-news/octomoms-hospital-records-accessed-15-workers-fired)。仅记录数据是不够的：识别违规行为并制裁违规者也是必需的。\n\
  \n## 不可抵赖性\n\n`不可抵赖性` 意味着用户无法否认（抵赖）已执行的事务。它结合了认证和完整性：不可抵赖性认证执行事务用户的身份，并确保该事务的完整性。你必须同时具备认证和完整性才能拥有不可抵赖性：证明你签署了购车合同（认证你作为购买者的身份）若汽车经销商可将价格从\
  \ 20,000 美元改为 40,000 美元（违反合同完整性），则毫无用处。\n\n## 最小权限和需知原则\n\n\n\n\n### 最小权限与知悉必要性\n\
  \n*最小权限*意味着用户应仅被授予完成其工作所需的最低访问权限（授权），而不得更多。*知悉必要性*比最小权限更细粒度：用户在访问特定信息前，必须具有知悉该特定信息的业务需求。\n\
  \n塞巴斯蒂安是一名护士，在一家拥有多个诊所的医疗机构工作。他的诊所共有四名医生，塞巴斯蒂安可以为这四名医生中的任意一位诊治患者。最小权限可允许塞巴斯蒂安访问这四名医生患者的记录，但不允许访问其他诊所其他医生患者的记录。\n\
  \n知悉必要性意味着塞巴斯蒂安只有在有业务需要时，才能访问患者的记录。如果有一名患者由塞巴斯蒂安所在诊所诊治，但并非由塞巴斯蒂安本人诊治，最小权限可能允许访问，但知悉必要性则不允许。\n\
  \n###### 举例学习\n\n##### 现实世界中的最小权限\n\n一家大型医疗服务提供商拥有一支 60 人的 IT 团队，负责管理 4000 台运行 Microsoft\
  \ Windows 的系统。该公司未实施最小权限：整个 IT 团队均被授予了 Windows 域管理员访问权限。拥有此类权限的人员包括服务台人员、备份管理员等众多角色。所有\
  \ 60 名域管理员在所有 4000 台 Windows 系统上均拥有超级用户特权。\n\n这种权限级别过高，并导致了问题。操作错误导致了 CIA（机密性、完整性、可用性）原则被违反。由于人人都能做太多事情，环境破坏频发。数据丢失；发生未授权更改；系统崩溃，且难以定位原因。\n\
  \n公司聘请了一位新的安全主管，他的首要任务之一就是强制执行最小权限。创建了基于角色的账户：允许访问工单系统的服务台角色、允许备份和恢复的备份角色等。域管理员名单被精简为极少数授权人员。\n\
  \n许多前域管理员抱怨失去了超级用户授权，但每个人获得的访问权限都足以完成其工作。改进效果立竿见影且显著：未授权更改几乎停止，系统崩溃变得少见得多。操作员仍会犯错，但这些错误造成的代价小得多。\n\
  \n## 主体与客体\n\n*主体*是数据系统上的活动实体。大多数主体示例涉及人员访问数据文件。然而，计算机程序也可以是主体。一个更新数据库文件以录入新信息的动态链接库文件或\
  \ Perl 脚本也是主体。\n\n*客体*是系统内的任何被动数据。客体范围可从纸质文档、数据库表到文本文件。关于客体要记住的关键是，它们在系统内是被动的。它们不操作其他客体。\n\
  \n有一个棘手的主体与客体示例非常重要，必须理解。例如，如果你正在运行 `iexplore.exe`（Microsoft Windows 系统上的 Internet\
  \ Explorer 浏览器），它在内存中运行时是一个主体。当浏览器未在内存中运行时，文件 `iexplore.exe` 就是文件系统上的一个客体。\n\n>\
  \ **考试警告**\n>\n> 通过判断 CISSP® 考试中的所有示例是属于主体定义还是客体定义，保持对示例的理解简单明了。\n\n## 纵深防御\n\n\
  *纵深防御*（也称为分层防御）应用多种保障措施（也称为控制：为降低风险而采取的措施）来保护资产。任何单一的安全控制都可能失效；通过部署多重控制，可以提高数据的机密性、完整性和可用性。\n\
  \n###### 举例学习\n\n#### 纵深防御恶意软件防护\n\n一家拥有 12,000 名员工的公司每天接收 250,000 封互联网邮件。绝大多数邮件都是恶意的，从浪费时间和资源的垃圾邮件到蠕虫、病毒等恶意软件。攻击者频繁更改战术，总是试图规避旨在拦截垃圾邮件和恶意软件的保障措施。\n\
  \n该公司部署了预防性的纵深防御控制，用于基于互联网邮件的恶意软件防护。一组 UNIX 邮件服务器对传入的互联网邮件进行过滤，每台服务器运行两种由两家不同主要供应商提供的自动更新防病毒/反恶意软件解决方案。扫描无毒的邮件随后被转发至内部\
  \ Microsoft Exchange 邮件服务器，该服务器运行着另一家供应商的防病毒软件。通过该扫描的邮件可到达用户的客户端，客户端运行着第四家供应商的防病毒软件。客户端台式机和笔记本电脑也已完全打补丁。\n\
  \n尽管有这些保障措施，仍有少量恶意软件成功逃过了四种不同防病毒软件的检查，感染了用户的客户端系统。幸运的是，公司部署了额外的纵深防御控制，如*入侵检测系统*（IDS）、事件处理策略和\
  \ *CERT*（*计算机应急响应小组*）来处理事件。这些防御措施成功识别出受感染的客户端系统，从而实现了及时响应。\n\n所有控制都可能失效，有时多个控制会同时失效。在组织中部署一系列不同的纵深防御保障措施，可降低所有控制同时失效的几率。\n\
  \n## 尽职照料与尽职调查\n\n*尽职照料*是指做一个理性的人会做的事。它有时被称为“谨慎人”规则。该术语源于“照料义务”：例如，父母有义务照料子女。*尽职调查*是对尽职照料的管理。\n\
  \n尽职照料与尽职调查常被混淆；二者相关但不同。尽职照料是非正式的；尽职调查遵循一个流程。可将尽职调查视为比尽职照料更进一步的步骤。期望员工保持其系统打补丁，意味着期望他们履行尽职照料。验证员工是否已给系统打补丁，则是尽职调查的一个例子。\n\
  \n### 重大过失\n\n重大过失是尽职照料的反面。这是一个法律上重要的概念。例如，如果你遭遇了 PII（个人身份信息）丢失，但能证明在保护 PII 方面履行了尽职照料，你在法律上处于更有利的地位。如果你无法证明尽职照料（即你存在重大过失），你的法律地位将恶化得多。\n\
  \n## 法律与监管问题\n\n尽管了解主要法律体系和法律类型的总体情况很重要，但信息安全专业人员理解下一节所述概念至关重要。随着信息系统、数据和应用程序的普及，随之而来的是一系列需要关注的法律问题。影响信息安全的法律概念示例包括：由计算机系统实施或协助的犯罪、针对知识产权的攻击、隐私担忧以及国际问题。\n\
  \n### 遵守法律法规\n\n遵守法律法规是信息安全管理的首要任务：无论是在现实世界中还是在考试中。组织必须遵守所有适用于其的法律法规。不知法从来不是违法的有效借口。\n\
  \n> **考试警告**\n>\n> 考试将对你遵守法律法规的要求举持极高标准。我们不需要像律师那样精通法律，但需知道何时该咨询律师。例如，混淆 `Kerberos`\
  \ 等安全控制的技术细节可能不会导致严重的负面后果。但因对搜查员工个人财产的合法性产生混淆而违反搜查扣押法，则极可能导致严重的负面后果。法律上最正确的答案往往是考试中的最佳答案。\n\
  \n### 主要法律体系\n\n\n\n\n### 主要法律体系\n\n为了开始理解当今全球经济中发挥作用的通用法律概念，需要了解主要法律体系。这些法律体系提供了框架，决定了一个国家最初如何制定与信息系统相关的法律。三大主要法律体系是大陆法系、普通法系和宗教法系。\n\
  \n#### 大陆法系（法律体系）\n\n主要法律体系中最常见的是**大陆法系**，世界上许多国家都采用该体系。大陆法系利用成文法或法典来确定什么被视为在法律范围内。虽然立法部门通常拥有制定法律的权力，但仍会存在一个司法部门，负责解释现有法律。大陆法系与普通法系最显著的区别在于，在大陆法系下，司法判例和特定案件判决不像在普通法系下那样具有同等效力。\n\
  \n#### 普通法系\n\n**普通法系**是美国、加拿大、英国以及大多数前英国殖民地等国家使用的法律体系。从上面简短的列表中可以看出，英国的影响历来是一个国家采用普通法系的主要标志。普通法系的主要显著特征是高度重视特定案件和司法判例作为法律的决定因素。虽然通常也有立法机构负责制定新的法规和法律，但司法裁决有时可以凌驾于这些法律之上。由于强调法官的解释，随着社会随时间变化，司法解释也可能随之改变。\n\
  \n> **注意**\n>\n> 普通法系是 CISSP® 考试最可能引用的主要法律体系。因此，本章将主要关注普通法系，它是英国和美国法律体系的基础。\n\n\
  #### 宗教法系\n\n**宗教法系**是三大主要法律体系中的第三种。宗教教义或解释作为法律理解和法规的来源。然而，咨询宗教文本、实践或理解的程度和深度可能差异很大。虽然基督教、犹太教和印度教都对国家法律体系产生了重大影响，但伊斯兰教是宗教法律体系最常见的来源。尽管其在世界各地的应用具有很大的多样性，但沙里亚法是伊斯兰教法的术语，它以《古兰经》和圣训为基础。\n\
  \n#### 其他体系\n\n虽然**习惯法**不被认为像上述其他主要法律体系那样重要，但它与信息安全息息相关。习惯法是指那些被一个群体普遍接受的习俗或做法，以至于该习俗被视为法律。这些做法稍后可以被编纂为更传统意义上的法律，但对群体普遍接受做法的强调，对于疏忽的概念至关重要，而疏忽概念又在信息安全中很重要。“最佳实践”的概念与习惯法密切相关。\n\
  \n假设一个组织维护敏感数据，但不受任何关于数据必须如何保护的具体法律要求约束。后来数据泄露了。如果发现该公司未使用防火墙、防病毒软件，并使用过时的系统来存放数据，许多人会认为该组织违反了——也许不是某个特定的法律要求——但违反了公认做法，即未采用与保护敏感数据相关的习惯做法。\n\
  \n### 刑法、民法和行政法\n\n如前所述，普通法系将在考试中占最大比重，因此将成为此处的主要关注点。在普通法系中，有各种法律分支，包括刑法、民法和行政法。\n\
  \n#### 刑法\n\n**刑法**涉及那些受害者可被视为社会本身的法律。虽然当个人被谋杀时将社会视为受害者似乎很奇怪，但刑法的目标是促进和维护有序且守法的公民社会。刑法可以包括将个人通过监禁从社会中移除的惩罚，或者在某些地区的极端情况下，处以死刑。刑法的目标是威慑犯罪和惩罚罪犯。\n\
  \n由于可能剥夺某人的自由，甚至在最极端的情况下剥夺其生命，这种事态的严重性决定了刑事案件中的举证责任非常重。要定罪被指控犯有刑事罪行的人，必须排除合理怀疑地证明该罪行。一旦证明成立，犯罪行为的惩罚可能包括监禁、经济处罚，或在某些司法管辖区，对最恶劣的犯罪行为执行死刑。\n\
  \n#### 民法\n\n除了**民法**是世界主要法律体系之一外，它在普通法系中也作为一种法律类型存在。与民法相关的另一个术语是侵权法，它处理因某人违反其提供注意义务的责任而导致的伤害（广义上）。侵权法是民法的主要组成部分，也是寻求损害赔偿诉讼的最重要法律来源。\n\
  \n在刑法下，社会被视为受害者；在民法下，受害者将是个人、团体或组织。虽然政府在刑法下起诉个人或组织，但在民法中，相关方最常见的是私人当事人。刑法和民法的另一个区别在于各自的目标。刑法的重点是惩罚和威慑；民法的重点是补偿受害者。\n\
  \n一个行为可以，而且经常确实会同时导致刑事和民事诉讼。伯尼·麦道夫因精心设计的庞氏骗局骗取投资者数十亿美元，最近就是同时面临刑事和民事处罚的案例。麦道夫在刑事法庭对包括证券欺诈、电信欺诈、伪证和洗钱在内的\
  \ 11 项重罪认罪。除了政府提起的刑事指控外，众多民事诉讼还寻求投资者在欺诈中损失资金的补偿性损害赔偿。\n\n一个广为人知的例子是 O.J. 辛普森谋杀案，辛普森先生在刑事法庭因谋杀其妻子妮可·布朗和罗纳德·戈德曼被判无罪，但后来在民事法庭程序中被认定对戈德曼先生的非正常死亡负有责任。\n\
  \n结果的差异可由民法和刑法举证责任的差异来解释。在美国，刑事法庭的举证责任是排除合理怀疑，而民事诉讼的举证责任是证据优势。“优势”意味着更有可能。在民事案件中满足证据优势的举证责任要求，比满足刑事诉讼中的举证责任要求容易得多。成功判决被告败诉的最常见结果是要求支付经济损害赔偿。最常见的经济损害赔偿类型见表\
  \ 2.1。\n\n##### 表 2.1：常见经济损害赔偿类型\n\n| 经济损害赔偿 | 说明 |\n| --- | --- |\n| 法定赔偿 | 法定赔偿是法律规定的赔偿，即使受害者未遭受实际损失或伤害，也可判予受害者。\
  \ |\n| 补偿性赔偿 | 补偿性赔偿的目的是向受害者提供经济赔偿，以补偿因不法行为直接导致的损失或伤害。 |\n\n\n\n\n\n| 惩罚性赔偿 || 惩罚性赔偿的意图是惩罚个人或组织。当补偿性赔偿或法定赔偿单独作用不足以起到威慑作用时，通常会判给此类赔偿，以试图阻止特别恶劣的违规行为。\
  \ |\n\n##### 行政法\n\n*行政法*或*监管法*是由政府机关颁布的法律。在美国，行政分支（源自总统办公室）颁布行政法。政府强制要求的合规措施属于行政法。\n\
  \n行政分支可以在无需立法分支参与的情况下制定行政法，但该法律仍必须在民事和刑事法典的范围内运作，且仍可能受到司法分支的审查。行政法的例子包括 FCC 法规、HIPAA\
  \ 安全授权、FDA 法规和 FAA 法规。\n\n##### 责任\n\n*法律责任*是信息安全专业人员及其雇主必须了解的另一个重要法律概念。多年来，社会诉讼风气日盛，组织是否因特定行为或不作为而承担法律责任的问题，可能会导致高昂代价。责任问题往往转化为关于潜在过失的问题。在试图确定某些行为或不作为是否构成过失时，通常会适用*审慎人规则*。\n\
  \n需要理解的两个重要术语是应有注意义务和应有尽职调查，它们已成为法院判定企业法律责任时常用的标准。\n\n##### 应有注意义务\n\n*应有注意义务*标准，或称注意义务，提供了一个框架，有助于定义商业利益相关者必须努力达到的最低保护标准。关于应有注意义务的讨论常引用审慎人规则，要求组织从事审慎、合理之人会采取的商业实践。\n\
  \n##### 应有尽职调查\n\n*应有尽职调查*要求组织持续地审查和评估其安全态势，以确保其符合应有注意义务的要求。它涉及识别风险、实施控制措施，并持续监控这些控制措施的有效性。应有尽职调查是一个持续的过程，而非一次性事件。\n\
  \n###### 知识产权\n\n*知识产权*（IP）是指智力创造的成果，例如发明、文学和艺术作品、设计、以及用于商业中的符号、名称和图像。知识产权受法律保护，例如专利、版权和商标，使人们能从其发明或创作中获得认可或经济利益。\n\
  \n####### 专利\n\n*专利*授予发明人在有限期限内（通常自申请日起 20 年）对其发明享有的专有权利。作为交换，发明人必须公开披露发明的细节。专利保护发明的功能性方面。\n\
  \n######## 版权\n\n*版权*保护原创作品的表达形式，例如文学、戏剧、音乐和艺术作品，以及软件代码。版权保护的是表达思想的方式，而非思想本身。在大多数司法管辖区，版权在作品创作并固定于有形媒介时自动产生。\n\
  \n####### 商标\n\n*商标*是能够区分某一企业商品或服务来源的标志、设计或表达。商标保护品牌标识，如名称、徽标和标语，防止他人使用容易引起混淆的相似标识。\n\
  \n######## 商业秘密\n\n*商业秘密*是指不为公众所知悉、具有商业价值、且权利人采取了相应保密措施的技术信息和经营信息。商业秘密的例子包括配方、工艺、设计、客户名单和营销策略。与专利不同，商业秘密无需注册，且只要保持秘密状态，保护期限可以无限延长。\n\
  \n####### 隐私\n\n*隐私*是指个人控制其个人信息被收集、使用和披露程度的权利。信息安全专业人员必须了解适用于其组织处理的数据的隐私法律法规。\n\n\
  ###### 个人身份信息 (PII)\n\n*个人身份信息 (PII)* 是指可用于区分或追踪个人身份的任何信息，例如姓名、社会安全号码、出生日期和地点、母亲婚前姓氏、生物识别记录等，单独使用或与其他可链接至特定个人的信息（如医疗、教育、财务和就业信息）结合使用。\n\
  \n###### 受保护健康信息 (PHI)\n\n*受保护健康信息 (PHI)* 是指由受 HIPAA 约束的实体创建、接收、存储或传输的、与个人过去、现在或未来的身体或精神健康状况、医疗服务提供或医疗付款相关的、可识别个人身份的健康信息。\n\
  \n###### 通用数据保护条例 (GDPR)\n\n*通用数据保护条例 (GDPR)* 是欧盟 (EU) 颁布的一项全面数据保护法律，适用于处理欧盟居民个人数据的所有组织，无论组织身处何地。GDPR\
  \ 赋予数据主体广泛的权利，并对数据控制者和处理者施加严格义务。\n\n##### 计算机犯罪法律\n\n许多国家已颁布专门针对计算机犯罪的法律。信息安全专业人员应熟悉其司法管辖区内的相关法规。\n\
  \n###### 美国《计算机欺诈和滥用法》(CFAA)\n\n*美国《计算机欺诈和滥用法》(CFAA)* 是美国联邦法律，禁止未经授权访问计算机系统，以及超越授权访问范围的行为。它是美国起诉黑客攻击和计算机相关犯罪的主要法律工具。\n\
  \n###### 《数字千年版权法》(DMCA)\n\n*《数字千年版权法》(DMCA)* 将规避控制版权作品访问的技术措施的行为定为犯罪。它还为在线服务提供商提供了“避风港”保护，前提是其满足特定条件。\n\
  \n###### 《电子通信隐私法》(ECPA)\n\n*《电子通信隐私法》(ECPA)* 保护电子通信在传输中和存储时的隐私。它包含《存储通信法》(SCA)\
  \ 和《窃听法》。\n\n##### 执法与取证\n\n信息安全专业人员常与执法部门合作，或进行内部调查，这需要了解法律约束和取证最佳实践。\n\n######\
  \ 调查\n\n调查是对事件进行系统性检查以确定事实的过程。信息安全人员和执法人员经常进行调查，双方都需要对法律事务有基本了解，以确保调查的法律效力不被无意中破坏。证据及处理证据的适当方法，是所有信息安全专业人员必须了解的关键法律问题。另一个涉及信息安全和法律调查的问题是搜查和扣押。\n\
  \n###### 证据\n\n证据是信息安全专业人员必须了解的最重要法律概念之一。信息安全专业人员通常参与调查，且在调查过程中常需获取或处理证据。某些类型的证据比其他类型更有分量；然而，信息安全专业人员应尝试提供所有证据，无论该证据是证明还是反驳案件事实。虽然没有绝对的方法能确保证据会被法庭采纳且有帮助，但信息安全专业人员应了解证据的基本规则。证据应具有相关性、真实性、准确性、完整性和说服力。证据收集应强调这些标准。\n\
  \n####### 实物证据\n\n第一大类、也是最基本的证据类别是*实物证据*。实物证据由有形或物理对象组成。在某些传统刑事诉讼中，刀具或沾血手套可能构成实物证据。然而，在大多数计算机事件中，实物证据通常由硬盘驱动器、DVD、USB\
  \ 存储设备或打印的业务记录等物理对象组成。\n\n####### 直接证据\n\n*直接证据*是证人就其亲身通过五官所经历之事提供的证言。证人必须亲身经历其所作证的内容，而非通过他人间接获知（传闻证据，见下文）。\n\
  \n####### 间接证据\n\n*间接证据*是用以确立与特定争议点甚至其他证据相关的环境事实的证据。例如，间接证据可能支持关于其他证据或其他证据准确性的主张。间接证据提供有关环境的细节，允许对其他类型的证据做出推断。此类证据提供间接证明，通常不能作为案件的唯一证据。例如，如果某人作证称亲眼目睹被告创建并分发恶意软件，这属于直接证据。如果对被告计算机的取证分析发现了恶意软件的源代码，这属于间接证据。\n\
  \n####### 佐证\n\n为了强化案件的某一特定事实或要素，可能需要*佐证*。此类证据为可能受到质疑的事实提供额外支持。这种证据本身不确立特定事实，而是为其他事实提供额外支持。\n\
  \n####### 传闻证据\n\n*传闻证据*构成二手证据。与某人亲身通过五官目睹的直接证据相反，传闻证据涉及间接信息。传闻证据通常被法庭视为不可采信。包括《美国联邦证据规则》第\
  \ 803 条和第 804 条在内的众多规则，为第 802 条定义的传闻证据一般不可采信原则提供了例外情况。\n\n\n\n\n\n商业记录和计算机生成的记录通常被视为传闻证据，但判例法和《联邦证据规则》的更新已针对商业记录、计算机生成的数据和日志属于传闻证据这一一般规则确立了例外。规则\
  \ 803 中定义的例外规定了记录或报告的可采性，该记录或报告“是在事件发生时或临近时由知情人制作，或根据知情人传递的信息制作，且是在日常业务活动过程中保存的，且制作备忘录、报告、记录或数据汇编是该业务活动的常规做法”\
  \ [\\[1\\]](#Ch002_11-80_B9780443187346000015.xhtml#bb0010)。\n\n与计算机调查相关的另一个重要考量因素是二进制磁盘镜像和物理内存镜像的可采性。被解释为允许磁盘和内存镜像可采的证据规则，实际上并非传闻规则（规则\
  \ 802）的例外，而是见于规则 1001，该规则定义了在处理书写、录音和照片时何为原件。规则 1001 规定：“如果数据存储在计算机或类似设备中，任何打印输出或其他可视输出，只要证明能准确反映数据，即为‘原件’”\
  \ [\\[2\\]](#Ch002_11-80_B9780443187346000015.xhtml#bb0015)。这一定义被解释为允许取证报告以及内存和磁盘镜像被采纳，即使它们不构成规则\
  \ 803 项下的传统商业记录例外。\n\n###### 最佳证据规则\n\n法院倾向于采用最佳证据。原始文件优于副本：确凿的有形物体优于口头证言。回顾一下，证据的五个理想标准表明，在可能的情况下，证据应当是：相关的、真实的、准确的、完整的和令人信服的。*最佳证据规则*倾向于符合这些标准的证据。\n\
  \n###### 次级证据\n\n在计算机犯罪和事件中，最佳证据并不总是能够获得。*次级证据*是涉及计算机案件中常见的一类证据。次级证据由原始文件的副本和口头描述组成。计算机生成的日志和文档也可能构成次级证据而非最佳证据。然而，《美国联邦证据规则》规则\
  \ 1001 允许将计算机中所含数据的可读报告视为原件而非次级证据。\n\n###### 证据完整性\n\n证据必须可靠。在取证和应急响应调查中分析数字媒体是常见做法。在获取和分析数据的过程中，保持数据的完整性至关重要。校验和可以确保获取和分析过程中未发生数据变更。单向哈希函数（如\
  \ `MD5` 或 `SHA-1`）常用于此目的。哈希算法处理整个磁盘或镜像（每一位），输出结果哈希校验和。分析完成后，可再次对整个磁盘进行哈希计算。如果磁盘或镜像哪怕只有一位发生了变化，则生成的哈希校验和将与最初获得的不同。\n\
  \n###### 保管链\n\n除了使用完整性哈希算法和校验和外，另一种有助于证明证据可靠性的方法是维护*保管链*文档。保管链要求一旦获取证据，必须完整记录与该证据处理相关的谁、什么、何时和何地。保管链表格上的姓名首字母缩写和/或签名表明签署人证明其在保管链表格上记录的角色相关信息准确无误。\n\
  \n目标是证明在整个证据生命周期中，证据是如何被处理的，这既是已知的也是有文档记录的。这也支持证据完整性：不存在其他方篡改证据的合理可能性。\n\n虽然证据在法庭上被采纳并不强制要求完整性校验和或保管链表格，但两者都支持数字证据的可靠性。取证调查员使用完整性校验和和保管链是最佳实践。\n\
  \n###### 合理搜查\n\n《美国宪法》第四修正案保护公民免受政府的无理搜查和扣押。在所有涉及扣押证据的案件中，如果法院认定证据是非法获取的，则该证据在法庭上不可采纳。在大多数情况下，执法部门搜查私人公民的财产需要同时具备合理根据和法官签发的*搜查令*。搜查令将指定将搜查的区域以及执法部门搜查的目标。\n\
  \n存在一些不需要搜查令的情况，例如财产在显而易见的地方或在公共检查站。计算机犯罪中关于搜查令要求的一项重要例外是紧急情况。紧急情况是指对人类生命构成直接威胁或证据面临被销毁风险的情况。法院将事后裁决当时的情况是否足以证明无令状扣押的正当性。\n\
  \n搜查令仅适用于执法部门以及在*法律授权下*行事的人员。如果私人公民代表执法部门采取行动或进行调查，则这些人员属于在法律授权下行事，可被视为*执法代理人*。在法律授权下行事的一个例子是：执法部门介入企业案件，企业安全专业人员在执法部门直接监督下扣押数据。如果某人在法律授权下行事，则其必须知晓与无理搜查和扣押相关的第四修正案权利。在法律授权下行事的人若剥夺他人宪法保护的权利，可依据美国法典第\
  \ 18 编第 242 条——在法律授权下剥夺权利——被判定犯罪。\n\n如果执法部门未介入案件，则不需要搜查令。然而，组织应谨慎确保提前告知员工其行为受到监控，且其设备甚至个人物品可能被�查。当然，只有当组织的安全策略允许时，才应发出这些通知。此外，关于搜查和扣押的企业政策必须考虑适用司法管辖区的各种隐私法律。\n\
  \n> **注意**\n>\n> 由于由执法部门或代表执法部门进行的调查存在独特问题，组织需要就是否以及何时引入执法部门协助调查做出明智决定。\n\n######\
  \ 诱捕与诱惑\n\n\n\n\n\n另一个与执法部门参与调查过程密切相关的话题涉及 `entrapment`（诱捕）和 `enticement`（诱惑）的概念。诱捕是指执法部门或执法代理人说服某人犯罪，而该人原本无意犯罪。诱捕可在法庭上作为合法抗辩理由，因此如果目标是起诉，则应予以避免。一个密切相关的概念是诱惑。诱惑仍可能涉及执法代理人为犯罪创造有利条件，但区别在于，该人已被认定违法或意图违法。执法部门的行为构成诱惑还是诱捕，最终由陪审团裁决。应注意区分这两个术语。\n\
  \n###### 计算机犯罪\n\n信息安全与法律体系互动的一个方面是 `computer crimes`（计算机犯罪）。适用的计算机犯罪法律因司法管辖区而异，遍布全球。然而，无论地区如何，都存在一些普遍性。根据计算机系统与不法行为的关联方式，计算机犯罪大致可分为三类：计算机系统作为目标；计算机系统作为实施犯罪的工具；或计算机系统涉及其中但属附带相关。最后一类很常见，因为计算机系统是现代生活不可或缺的组成部分。前两类更为重要：\n\
  \n*   **计算机系统作为目标**—计算机系统作为主要攻击目标的犯罪，例如：通过分布式拒绝服务攻击破坏在线商务，在系统上安装恶意软件以分发垃圾邮件，或利用系统漏洞将其作为存储非法内容的跳板。\n\
  *   **计算机作为工具**—计算机作为实施犯罪核心组件的犯罪。示例包括：通过攻陷数据库服务器窃取商业机密，利用计算机从支付系统窃取持卡人数据，开展基于计算机的侦察以锁定个人实施信息泄露或间谍活动，以及利用计算机系统进行骚扰。\n\
  \n随着信息系统的发展，以及企业更大程度地利用计算机系统，盗窃和欺诈等传统犯罪正通过使用和针对计算机两种方式实施。起诉计算机犯罪最困难的方面之一是归因。鉴于攻击者往往能伪造犯罪源头，或利用他人控制的不同系统作为跳板，在刑事诉讼中满足“排除合理怀疑”的举证责任要求可能很困难。\n\
  \n###### 知识产权\n\n与物理或有形财产不同，`intellectual property`（知识产权）是指源于创造性行为的无形财产。知识产权法的目的是控制无形财产的使用，此类财产一旦公开或为人所知，往往极易复制或滥用。以下知识产权概念实际上在其使用上创造了专有垄断权。\n\
  \n####### 商标\n\n`Trademarks`（商标）与市场营销相关：其目的是允许创建品牌以区分产品或服务的来源。独特的名称、徽标、符号或图像代表了最常见的商标项目。在美国，针对个人或组织意图保护的显著标志，使用两种不同的符号。上标\
  \ TM 符号可自由用于指示未注册商标，如 图 2.6 所示。\n\n![图 2.6 商标符号。](img/f02-06-9780443187346.jpg)\n\
  \n图 2.6 商标符号。\n\n圆圈 R 符号用于已向美国专利商标局正式注册的商标，如 图 2.7 所示。除了注册和未注册商标外，服务标志构成了与品牌识别相关的知识产权子集。顾名思义，服务标志用于为服务产品而非特定产品或公司建立品牌，外观类似未注册商标，用上标\
  \ SM 符号表示。\n\n![图 2.7 注册商标符号。](img/f02-07-9780443187346.jpg)\n\n图 2.7 注册商标符号。\n\n\
  ####### 专利\n\n`Patents`（专利）授予专利权人在一段时间内使用、制造或销售发明的专有权，作为交换，专利权人须公开该发明。在专利有效期内，专利权人可通过民事诉讼排除他人利用该专利发明。显然，要获得专利，发明应具备新颖性和独特性。专利有效期（专利期限）因地区和发明类型而异。通常，在欧洲和美国，专利期限均为自首次申请之日起\
  \ 20 年。专利到期后，该发明即可公开用于生产。\n\n######## 举例学习：魔术贴\n\n一个快速的例子可以说明专利、专利期限以及商标，即魔术贴。魔术贴是一种基于织物的小型钩面搭扣的特定品牌，由\
  \ George de Mestral 于 1941 年在瑞士发明。预期其织物钩面搭扣有许多商业应用，de Mestral 在 1950 年代在许多国家申请了专利。除了为发明申请专利外，de\
  \ Mestral 还在许多国家将“Velcro”注册为商标。1978 年，de Mestral 发明的专利期限届满，许多公司开始廉价大批量生产基于织物的小型钩面搭扣。尽管专利已过期，但商标没有明确的到期日，因此在产品上使用“Velcro”一词仍保留给\
  \ de Mestral 创立的公司使用。\n\n######## 版权\n\n`Copyright`（版权）代表一种知识产权，保护艺术、音乐或文学作品的表达形式，通常用圆圈\
  \ c 符号表示，如 图 2.8 所示。版权的目的是防止未经授权复制、分发或修改创意作品。请注意，受保护的是表达形式，而非所代表的主题或思想。作品的创作者或作者在创作时默认即为版权持有者，并拁有关于版权材料分发的专有权利。尽管创作时即隐含授予作者版权，但仍存在更明确的版权方式。注册版权是指创作者向版权局（在美国）备案版权，提供比作者隐含版权更正式的版权保护。\n\
  \n![图 2.8 版权符号。](img/f02-08-9780443187346.jpg)\n\n图 2.8 版权符号。\n\n\n\n\n\n########\
  \ 版权\n\n版权与专利一样，都有特定的有效期限。同样与专利相似，该期限会根据作品类型以及作品发表所在国家的不同而有所差异。一旦版权期限届满，作品即成为公共领域的一部分。目前在美国，作品通常在作者去世后\
  \ 70 年内享有可强制执行的版权。然而，如果作品是企业产品，则期限为首次出版后 95 年或创作后 120 年，以先到者为准 [\\[3\\]](#Ch002_11-80_B9780443187346000015.xhtml#bb0020)。尽管这一通用规则存在例外，但大多数欧洲国家也遵循“作者终身加\
  \ 70 年”的版权期限。\n\n###### 举例学习\n\n######## 版权期限\n\n欧洲与美国之间一个严重的争议点在于前者缺乏更长的企业版权保护。在美国，企业生产的产品可能享有额外\
  \ 25–50 年的版权保护，而目前欧洲没有此类额外保护。这一问题在 2009 年变得突出，当时卡通形象“大力水手”（Popeye）的欧洲版权到期。在欧洲，“大力水手”现已成为公共领域的一部分，因为其创作者埃尔兹·西格（Elzie\
  \ Segar）于 1938 年去世，已超过 70 年。\n\n尽管已有成功尝试使全球版权法更加协调，尤其是在美国和欧洲之间，但全球范围内仍存在严重的不一致性。许多国家甚至不承认版权或其法律保护。这种缺乏承认的情况进一步加剧了全球盗版问题。\n\
  \n> **注意**\n>\n> 在美国，由于一些极高价值的版权即将成为公共领域的一部分，版权期限已被延长。随着个人和企业对作品进入公共领域导致的经济损失表达担忧，版权期限一直在不断延长。\n\
  >\n> 1998 年通过的《版权期限延长法案》将版权期限延长了 20 年。当时，版权期限为作者终身加 50 年，企业作品为 75 年，但该延长法案将版权期限分别增加至作者终身加\
  \ 70 年和 95 年。一些人（特别是劳伦斯·莱斯格）讥讽地将《版权期限延长法案》称为“米老鼠保护法案”，因为该法案通过的时间接近米老鼠原定进入公共领域的时间。\n\
  \n软件通常作为文学作品受版权保护。回顾一下，版权旨在保护表达形式而非思想或主题。软件许可在软件知识产权保护方面填补了部分空白。另一个软件版权问题是“职务作品”概念。虽然作品创作者是默示的版权持有者，但应注意区分软件开发者还是其雇主被视为版权持有者。在大多数情况下，当开发者为特定组织编写代码时，组织本身而非个人开发者是版权持有者，因为代码是作为其雇佣工作的一部分专门开发的。\n\
  \n######## 版权限制\n\n关于版权持有者垄断权的排他性，存在两项重要限制：`first sale`（首次销售）原则和 `fair use`（合理使用）原则。首次销售原则允许受版权保护材料的合法购买者将其出售给他人。如果\
  \ CD 购买者后来决定不再保留该 CD，首次销售原则赋予他们出售该受版权保护材料的合法权利，即使他们不是版权持有者。\n\n合理使用是对版权持有者专有知识产权垄断的另一项限制。合理使用原则允许他人在无需支付费用、获得同意，甚至无需让版权持有者知情的情况下复制受版权保护的材料。没有必须满足的明确要求来确保特定使用构成合理使用，但法官在判断版权持有者的合法权利是否受到侵犯时会使用既定指南。《1976\
  \ 年版权法》中定义的作为判断某使用是否受合理使用原则保护标准的四个因素是：摘录的目的和性质；受版权保护作品的性质；复制内容的数量与作品整体长度的对比；以及复制行为是否可能降低原作品的价值或吸引力\
  \ [\\[4\\]](#Ch002_11-80_B9780443187346000015.xhtml#bb0025)。\n\n######## 许可证\n\n\
  软件许可证是软件提供方与消费者之间的合同。虽然有些许可证明确允许消费者对软件进行几乎任何操作，包括将其修改用于另一商业产品，但大多数商业软件许可证对软件的使用和分发设定了明确限制。最终用户许可协议（EULA）等软件许可证是一种不寻常的合同形式，因为使用软件通常即构成合同同意，即使只有极少数用户阅读冗长的\
  \ EULA。\n\n######## 商业秘密\n\n将要讨论的最后一种知识产权形式是 `trade secrets`（商业秘密）概念。商业秘密是对组织竞争能力至关重要的商业专有信息。最容易理解的商业秘密是“秘制酱料”类型。如果另一家炸鸡店能破解桑德斯上校（Colonel\
  \ Sanders）那 11 种香草和香料的秘制配方，从而做出我们皆知并喜爱的“手指舔得好吃”的口味，肯德基（Kentucky Fried Chicken）可能会遭受灾难性损失。虽然“秘制酱料”显然是商业秘密，但任何能提供竞争优势且由组织主动保护的商业信息都可构成商业秘密。组织必须尽到应有的注意义务和尽职调查义务来保护其商业秘密。最常用的保护方法包括竞业限制协议和保密协议（NDA）。这些方法要求知悉商业机密的员工或其他人尊重组织的知识产权，不得为竞争对手工作或以未经授权的方式披露该信息。缺乏合理的商业秘密保护会导致其不再属于商业秘密。如果组织未采取合理措施确保信息保密，则有理由推断该组织并不从该信息的保密性中获得竞争优势。\n\
  \n######## 知识产权攻击\n\n尽管针对知识产权的攻击至少自首个以营利为目的的智力创作诞生以来就已存在，但随着便携式电子媒体和基于互联网的商业的增长，此类攻击的复杂程度和数量不断增加。众所周知的知识产权攻击包括软件\
  \ `piracy`（盗版）以及与音乐、电影相关的版权侵权。随着互联网连接的普及以及助长盗版的网站（如 The Pirate Bay）和协议（如 BitTorrent）的增长，这两类攻击变得更加容易。其他常见的知识产权攻击包括针对商业秘密和商标的攻击。商业秘密可能成为企业间谍活动的目标，也容易成为恶意内部人员的攻击对象。由于目标商业秘密具有潜在的高价值，此类知识产权可能吸引高度积极且技术娴熟的攻击者。\n\
  \n\n\n\n\n####### 商标\n\n商标可能面临多种不同类型的攻击，包括假冒、稀释，以及 `cybersquatting`（域名抢注）和 `typosquatting`（错拼域名抢注）。假冒是指试图将产品冒充为原始品牌产品。假冒者试图利用与品牌相关的价值牟利。商标稀释通常代表一种无意的攻击，即将注册商标的品牌名称用于指代该品牌所属的更大的一般产品类别。例如：在美国某些地区，“Kleenex”（舒洁）一词常被用来指代任何品牌的面巾纸，而非该特定品牌本身；这就是商标稀释的一个例子。\n\
  \n随着基于互联网的经济发展，出现了两种较新的商标攻击：域名抢注和错拼域名抢注。域名抢注是指个人或组织出于恶意，注册或使用与他人商标相关的域名。人们通常会认为商标所有者和域名所有者是同一实体。这可能允许域名所有者侵犯实际商标所有者的权利。域名抢注者的主要动机是金钱：他们通常意图利用人们误以为正在访问商标所有者网站而产生的流量牟利。错拼域名抢注是指域名抢注者注册合法商标域名可能的拼写错误或输入错误，属于一种特定类型的域名抢注。\n\
  \n####### 隐私\n\n隐私是对个人信息机密性的保护。许多组织托管着关于其用户的个人信息：PII（个人身份信息），如社会安全号码；财务信息，如年薪和工资发放所需的银行账户信息；以及用于保险目的的医疗信息。必须确保这些信息的机密性。\n\
  \n过去几十年信息系统爆炸式增长的一个不幸副作用是隐私的丧失。随着越来越多的个人数据被信息系统使用和存储，这些数据被无意泄露、出售给第三方，或被恶意内部人员或第三方故意泄露的可能性也随之增加。此外，随着数百万至数千万条财务和健康记录泄露事件被公开披露并成为常态，一些最敏感数据的隐私侵蚀现在已司空见惯。以前，窃取数百万条财务记录可能意味着要亲自搬运足以装满一辆拖车的纸质记录；现在所有这些数据都可以装进一个拇指大小的闪存设备中。\n\
  \n世界各地出现了与信息系统相关的隐私法律，旨在让公民对其机密数据拥有更大的控制权或安全性。虽然存在许多不同的国际隐私法律，但需要了解的一个问题是：公民的隐私保护主要是“选择加入”还是“选择退出”：公民是否必须选择做某事才能获得隐私法的保护，还是默认由系统为他们选择？例如：一家收集个人数据的公司明确声明数据可以出售给第三方公司。即使他们清楚地说明了这一事实（尽管是在细则中），该组织可能仍要求个人勾选一个复选框以禁止其数据被出售。这是一种“选择退出”协议，因为个人必须采取行动才能防止其数据被转售。隐私倡导者通常倾向于“选择加入”协议，即个人必须采取行动才能允许其数据以这种方式被使用。\n\
  \n######## 欧盟隐私\n\n欧盟采取了积极的隐私保护立场，同时平衡了商业需求。如果成员国对个人身份信息的收集和使用有不同的法规，将会影响商业活动。`EU\
  \ Data Protection Directive`（欧盟数据保护指令）在保持对各成员国公民数据一致保护的同时，允许信息自由流动。欧盟数据保护指令的原则包括：\n\
  \n*   通知个人其个人数据如何被收集和使用\n*   允许个人选择退出与第三方共享其个人数据\n*   要求个人选择加入以共享最敏感的个人数据\n*   为个人数据提供合理的保护\n\
  \n######## OECD 隐私准则\n\n经济合作与发展组织（OECD）虽常被视为纯欧洲组织，但实际上由来自世界各地的 30 个成员国组成。除了主要的欧洲国家外，成员国还包括美国、墨西哥、澳大利亚、日本和捷克共和国等国家。OECD\
  \ 提供了一个论坛，让各国可以关注影响全球经济的问题。OECD 会定期发布共识建议，这些建议可以成为改变 OECD 成员国及其他国家现行政策和立法的推动力。\n\
  \n此类指导的一个例子是 1980 年发布的《OECD 关于隐私保护和个人数据跨国流动的指南》。全球商业要求公民的个人数据在不同地区的公司之间流动。OECD 隐私指导旨在为个人数据在穿越各个世界经济体时应享有的保护提供一个基本框架。关于个人数据隐私的八大驱动原则如下：\n\
  \n*   `Collection Limitation Principle`（收集限制原则）——个人数据的收集应有限度，通过合法方式获得，除非有令人信服的相反理由，否则应在个人知情和同意的情况下进行。\n\
  *   `Data Quality Principle`（数据质量原则）——个人数据应完整、准确，并以与数据收集目的一致的方式维护。\n*   `Purpose\
  \ Specification Principle`（目的明确原则）——数据收集的目的应为人所知，且数据的后续使用应限于收集时规定的目的。\n*   `Use\
  \ Limitation Principle`（使用限制原则）——未经个人同意或法律要求，不得披露个人数据。\n*   `Security Safeguards\
  \ Principle`（安全保障原则）——个人数据应受到合理保护，防止未经授权的使用、披露或篡改。\n*   `Openness Principle`（公开原则）——关于个人数据收集和使用的总体政策应易于获取。\n\
  *   `Individual Participation Principle`（个人参与原则）——个人应能：\n    *   确认某实体是否持有其任何个人数据。\n\
  \    *   知晓正在持有的任何个人数据。\n    *   获得因拒绝提供持有其个人数据的账户而被拒绝的理由，并拥有挑战任何拒绝的流程。\n    * \
  \  对持有的任何个人数据内容提出异议，并拥有在数据被发现不准确或不完整时更新其个人数据的流程。\n*   `Accountability Principle`（问责原则）——使用个人数据的实体应对遵守上述原则负责\
  \ [\\[5\\]](#Ch002_11-80_B9780443187346000015.xhtml#bb0030)。\n\n######## 通用数据保护条例\n\
  \n通用数据保护条例（GDPR）是欧盟当前的隐私和安全法律。它于 2018 年 5 月最终确定，对违反个人身份信息（PII）的行为处以严厉惩罚：“违反 GDPR\
  \ 的罚款非常高。分为两个等级，最高可达 2000 万欧元或全球营收的 4%（以较高者为准），此外数据主体有权寻求损害赔偿” [\\[6\\]](#Ch002_11-80_B9780443187346000015.xhtml#bb0035)。\n\
  \nGDPR 包含七项数据保护原则：\n\n\n\n\n\n######### GDPR 原则\n\n*   **合法性、公平性和透明度**——处理过程必须合法、公平，并对数据主体透明。\n\
  *   **目的限制**——你必须为向数据主体明确指定的合法目的处理数据。\n*   **数据最小化**——你应仅收集和处理为特定目的所绝对必要的数据。\n*\
  \   **准确性**——你必须保持个人数据的准确性和及时更新。\n*   **存储限制**——你只能为特定目的所必需的时间存储个人身份数据。\n*   **完整性和保密性**——处理必须以确保适当的安全性、完整性和保密性的方式进行（例如通过使用加密）。\n\
  *   **问责制**——数据控制者负责证明能够遵守所有这些 GDPR 原则 [\\[6\\]](#Ch002_11-80_B9780443187346000015.xhtml#bb0035)。\n\
  \n违规行为必须在 72 小时内报告（如果使用了加密，通知要求可能会被豁免）。GDPR 定义了以下术语：\n\n*   **个人数据**——个人数据是指与可被直接或间接识别的个人相关的任何信息。姓名和电子邮件地址显然属于个人数据。位置信息、种族、性别、生物特征数据、宗教信仰、网络\
  \ Cookie 和政治观点也可以是个人数据。如果从假名数据中相对容易识别出某人，假名数据也属于该定义范围。\n*   **数据处理**——对数据执行的任何操作，无论是自动化的还是手动的。文中引用的示例包括收集、记录、组织、构建、存储、使用、擦除……基本上涵盖了一切。\n\
  *   **数据主体**——其数据被处理的人。这些是你的客户或网站访问者。\n*   **数据控制者**——决定为何以及如何处理个人数据的人。如果你是组织中处理数据的所有者或员工，这就是你。\n\
  *   **数据处理者**——代表数据控制者处理个人数据的第三方。GDPR 对这些个人和组织有特殊规定。他们可能包括像 Tresorit 这样的云服务器或像 ProtonMail\
  \ 这样的电子邮件服务提供商 [\\[6\\]](#Ch002_11-80_B9780443187346000015.xhtml#bb0035)。\n\n##########\
  \ 数据主体权利\n\n数据主体拥有特定的隐私权利：\n\n1.  知情权\n2.  访问权\n3.  更正权\n4.  删除权（被遗忘权）\n5.  限制处理权\n\
  6.  数据可携权\n7.  异议权\n8.  关于自动化决策和画像的权利 [\\[6\\]](#Ch002_11-80_B9780443187346000015.xhtml#bb0035)。\n\
  \n欧盟的 GDPR 网站维护着一个优秀的“What IS GDPR”网站（上文部分引用自该网站）：[`gdpr.eu/what-is-gdpr`](https://gdpr.eu/what-is-gdpr)。在参加考试前，非常值得深入阅读。\n\
  \n######## 欧盟-美国安全港\n\n欧盟数据保护指令的一个有趣之处在于，即使个人允许，欧盟公民的个人数据也不得传输到欧盟以外的国家，除非欧盟认为接收国能充分保护其数据。这给与美国共享数据带来了挑战，因为美国被认为隐私保护不那么严格。为帮助解决这一问题，美国和欧盟创建了安全港框架，使美国组织获得授权数据共享的益处。为了成为安全港的一部分，美国组织必须自愿同意遵守与欧盟数据保护指令一致的数据隐私原则。\n\
  \n######## 1974 年美国隐私法案\n\n所有政府都掌握着大量公民的个人身份信息。《1974 年隐私法案》的制定是为了将联邦政府使用的美国公民数据保护成文。隐私法案规定了关于如何使用、收集和分发美国公民个人身份信息的指南。一项额外的保护是，隐私法案赋予个人访问与其相关的被维护数据的权利，但有一些以国家安全为导向的例外情况。\n\
  \n######## 国际合作\n\n除了归因问题，攻击弹跳至多个系统还带来了额外的管辖权挑战：搜查或扣押资产。某些涉及的系统可能位于计算机犯罪法律与起诉国不同的国家。或者证据所在国可能不愿与起诉国共享信息。这些挑战使得成功起诉计算机犯罪变得非常困难。\n\
  \n迄今为止，在计算机犯罪政策国际合作方面最重要的进展是《欧洲委员会网络犯罪公约》。除了该条约被 47 个欧洲成员国中的大多数签署并随后批准外，美国也签署并批准了该条约。《网络犯罪公约》的主要重点是建立网络犯罪政策标准，以促进在网络犯罪调查和起诉过程中的国际合作。关于《欧洲委员会网络犯罪公约》的更多信息可在此处找到：[`www.coe.int/en/web/conventions/full-list?module=treaty-detail&treatynum=185`](https://www.coe.int/en/web/conventions/full-list?module=treaty-detail&treatynum=185)。\n\
  \n######## 进出口限制\n\n在美国，执法部门在某些情况下可被授予合法权利进行窃听以监控电话通话。如果潜在恐怖分子使用加密隧道传输 VoIP 通话而不是使用传统电话，会怎样？即使执法部门可能已被授予监控该通话的合法权利，他们的尝试也会因加密而受挫。由于密码学的成功，许多国家限制了密码系统及相关密码硬件的进口和/或出口。在某些情况下，国家希望其公民无法访问其情报机构无法破解的密码系统，因此试图对加密技术实施进口限制。\n\
  \n除了进口管制，一些国家还颁布了向特定国家出口加密技术的禁令，试图防止不友好国家拥有先进的加密能力。实际上，密码学被视为一种更传统的武器，各国希望限制这些武器的扩散。冷战期间，CoCom（多边出口管制协调委员会）是一项多国协议，同意不向许多共产主义国家出口某些技术（包括加密技术）。冷战后，瓦森纳协定成为出口管制的标准。这项多国协议比以前的\
  \ CoCom 限制少得多，但仍建议对向未包含在瓦森纳协定中的国家出口加密算法和技术实施重大限制。\n\n\n\n\n20 世纪 90 年代，美国是禁止出口加密技术的主要推动者之一。美国之前的出口限制已大幅放宽，但向某些国家分发加密技术仍属违法。美国禁止向其出口加密技术的国家名单会随时间变化，但通常包括被认为对美国利益构成重大威胁的国家。美国并非唯一限制向被认为在政治上不友好的特定国家出口技术的国家。有关密码学相关法律的更多信息，请参见第\
  \ 4 章“密码学法律”部分，领域 3：安全架构与工程。\n\n######### 跨境数据流\n\n跨境数据流的概念在隐私方面进行了间接探讨（参见上文“隐私：经合组织隐私指南”）。虽然《经合组织关于保护隐私和个人数据跨境流动的指南》于\
  \ 1980 年发布，但自那以后，考虑数据在国家间传输影响的需求大幅增加。总体而言，经合组织建议信息自由流动，尽管自由信息流动存在值得注意的合法例外情况。对不受限制的数据传输最重要的例外情况在《隐私和个人数据跨境流动》中已明确指出。在隐私指南发布五年后，经合组织发布了《跨境数据流动宣言》，进一步支持了促进数据自由流动的努力。\n\
  \n######### 重要法律法规\n\n一整本书都可以轻松装下关于直接或间接涉及信息安全问题的美国及国际法律的讨论。本节并非对这些法律的详尽回顾。相反，仅讨论那些在\
  \ CISSP®考试中涉及的法律。表 2.2 提供了与信息安全常见相关的法律法规的快速摘要。\n\n表 2.2\n\n常见信息安全法律法规。\n\n| 法律 |\
  \ 值得注意的要点 |\n| --- | --- |\n| HIPAA—《健康保险流通与责任法案》 | 隐私和安全部分旨在防止受保护健康信息（PHI）被未经授权的使用或披露。安全规则为保护\
  \ PHI 提供了管理、物理和技术保障方面的指导。HIPAA 适用于受管实体，通常指医疗服务提供者、健康计划和清算机构。此外，2009 年的《HITECH 法案》使\
  \ HIPAA 的隐私和安全条款也适用于受管实体的业务伙伴。 |\n| 计算机欺诈和滥用法案—《美国法典》第 18 编第 1030 节 | 最早涉及计算机犯罪的美国法律之一。攻击受保护计算机（包括政府和金融计算机，以及从事外贸或州际商业的计算机），若在一年内造成\
  \ 5000 美元损失，即属刑事犯罪。受保护计算机定义中“外贸或州际商业”部分，使该法律涵盖的计算机范围远超最初预期。 |\n| 电子通信隐私法案 (ECPA)\
  \ | 该法律赋予非电话类电子通信与电话通信同等级别的搜查和扣押保护。实际上，ECPA 保护电子通信免受无证窃听。《爱国者法案》削弱了 ECPA 的部分限制。\
  \ |\n| 萨班斯-奥克斯利法案 (SOX) | 作为美国重大会计丑闻的直接结果，《萨班斯-奥克斯利法案》（通常简称为 SOX）获得通过。SOX 为上市公司创建了监管合规授权。SOX\
  \ 的主要目标是确保充分的财务披露和财务审计师的独立性。SOX 要求财务披露、审计师独立性以及内部安全控制（如风险评估）。故意违反 SOX 可能导致刑事处罚。\
  \ |\n| 支付卡行业数据安全标准 (PCI-DSS) | 金融行业支付卡领域的主要供应商试图通过自律实现对持卡人数据的充分保护。通过要求处理信用卡的商户遵守支付卡行业数据安全标准\
  \ (PCI-DSS)，主要信用卡公司旨在通过强制规定安全策略、安全设备、控制技术，以及对包含持卡人数据环境的系统和网络进行监控，来确保对持卡人数据的更好保护。\
  \ |\n\n########## 美国计算机欺诈和滥用法案\n\n《美国法典》第 18 编第 1030 节，通常称为`计算机欺诈和滥用法案`，最初起草于 1984\
  \ 年，但仍作为起诉计算机犯罪的重要立法依据。该法律已修订多次。\n\n> **注意**\n>\n> 僵牧场主、电话飞客、《纽约时报》攻击者，以及“冲击波”和“梅丽莎”病毒的作者有什么共同点？他们都因《美国法典》第\
  \ 18 编第 1030 节——即屡经修订的《计算机欺诈和滥用法案》——而被定罪。该法律促成了美国计算机犯罪定罪数量最多的案件。几乎所有受到定罪的臭名昭著的网络罪犯都是依据该法规被起诉的。《计算机欺诈和滥用法案》在成功起诉\
  \ Albert Gonzales（攻破 Heartland Payment Systems 和 TJX）、Adrian Lamo（“流浪汉黑客”，入侵《纽约时报》和微软）、Kevin\
  \ Mitnick（或许是最广为人知的计算机重罪犯）以及 Jeanson James Ancheta（首批因担任僵牧场主角色而被起诉的人之一）的案件中发挥了关键作用。\n\
  \n《计算机欺诈和滥用法案》的目标是建立一种手段，以威慑和起诉损害联邦利益计算机的行为。“联邦利益计算机”包括政府、关键基础设施或金融处理系统；该定义还涉及从事州际商业的计算机。随着基于互联网的商业无处不在，该定义可用于证明几乎任何联网计算机均属受保护计算机。《计算机欺诈和滥用法案》将针对受保护计算机的故意攻击行为定性为犯罪，如果此类攻击在一年内造成累计损失达\
  \ 5000 美元。\n\n> **注意**\n>\n> 《计算机欺诈和滥用法案》将对受保护计算机在一年内造成 5000 美元损失的行为定性为犯罪。2008 年通过的《身份盗窃执法和赔偿法案》修订了《计算机欺诈和滥用法案》。其中一项更重要的变更是取消了损失总额须达\
  \ 5000 美元的要求。另一项重要修正将损坏 10 台或更多计算机的行为定为重罪。\n\n########## HIPAA\n\n较重要的法规之一是`HIPAA》，即\
  \ 1996 年美国制定的《健康保险流通与责任法案》。HIPAA 是一套庞大且复杂的条款，要求医疗行业进行变革。管理简化部分（第 II 编）包含对信息安全专业人员最重要的信息，包括隐私规则和安全规则。管理简化部分适用于所谓的受管实体，包括健康计划、医疗服务提供者和清算机构。关于\
  \ HIPAA 适用性的更多信息，请参见下文注释。\n\n> **注意**\n\n\n\n\n虽然在本书付印时尚不可测试，但由于近期的立法，HIPAA 现已变得更广泛适用。《经济与临床健康医疗信息技术法案》（HITECH\
  \ Act）作为《2009 年美国复苏与再投资法案》的一部分被签署成为法律，将 HIPAA 下的隐私和安全要求扩展到了作为受保护实体业务伙伴的那些主体。HITECH\
  \ Act 新增的一个组成部分是违规通知要求。通用的违规通知信息将在下一节讨论。\n\n隐私和安全部分主要关注受保护健康信息（PHI）的保护，其中包括受保护实体将要使用或存储的几乎所有可单独识别的信息。HIPAA\
  \ 安全规则包含管理、物理和技术保障措施方面的章节。每项保障措施被视为必需或可寻址的实施规范，这说明了受保护实体在实施方面拥有的灵活性程度。\n\n> **考试警告**\n\
  >\n> 违规通知法律还太新且多变，不能被视为可测试材料，但它们对市场的重要性将使它们在不久的将来成为考试问题的主题。\n\n######## 美国违规通知法律\n\
  \n美国所有 50 个州都颁布了违规通知法律（参见 <https://www.ncsl.org/research/telecommunications-and-information-technology/security-breach-notification-laws.aspx>）。美国曾尝试通过通用的联邦违规通知法律，但迄今这些努力均告失败。虽然不可能做出适用于所有各州法律的笼统陈述，但许多州法律有一些共同主题，正被关注遵循最佳实践的组织迅速采纳。\n\
  \n违规通知法律的目的通常是在个人数据遭到泄露时通知受影响方。这些法律中经常出现的一个问题是什么构成了值得通知的违规。许多法律都有条款规定，只有在有证据合理推断其个人数据将被恶意使用时，企业才必须通知受影响方。\n\
  \n一些州法律中发现的另一个问题是，在泄露时已加密的数据享有安全港保护。这种安全港可能成为组织对原本可能没有监管或其他法律要求加密的数据进行加密的强大动力。违规通知法律肯定会长期存在，联邦法律似乎很可能在不久的将来出台。美国及国外的许多组织将机密数据加密视为尽职调查问题，即使在组织特定司法管辖区内没有特定的违规通知法律生效。\n\
  \n######## 伦理\n\n伦理是做道德上正确的事。医生遵循的《希波克拉底誓言》就是伦理准则的一个例子。\n\n伦理是信息安全专业人员最为关切的问题：我们经常被委以高度敏感的信息，我们的雇主、客户和顾客必须知道我们将以合乎道德的方式处理他们的信息。\n\
  \n数字信息也引发了伦理问题。想象一下，你的 DNA 被测序并存储在数据库中。该数据库可以告诉你是否易患某些遗传性疾病，如亨廷顿舞蹈症。然后想象保险公司利用该数据库，以你将来可能患病为由，拒绝你现在的投保。\n\
  \n######### (ISC)²® 伦理准则\n\n(ISC)²® 伦理准则是考试中最可测试的伦理准则。这是公平的：不同意伦理准则（除其他步骤外）就无法成为\
  \ CISSP®；因此，合理期望新 CISSP® 理解他们同意遵守的内容。\n\n> **注意**\n>\n> 在 <https://www.isc2.org/Ethics>\
  \ 下载 (ISC)²® 伦理准则并仔细学习。你必须理解整个准则，而不仅仅是本书涵盖的细节。\n\n(ISC)²® 伦理准则包括前言、准则和指导。前言是准则的介绍。准则是强制性的：你必须遵循它们才能成为（并保持）CISSP®。指导是“建议性的”（非强制性的）：它为准则提供支持性信息。\n\
  \n此处引用伦理准则的前言和准则：“共同体的安全、对委托人的责任、以及对彼此的责任，要求我们遵守并被看到遵守最高的行为道德标准。因此，严格遵守本准则是认证的条件。”\n\
  \n准则如下：\n\n*   保护社会、公共利益、必要的公众信任和信心，以及基础设施。\n*   光荣、诚实、公正、负责、合法地行事。\n*   为委托人提供勤勉且称职的服务。\n\
  *   推进并保护该职业 [\\[7\\]](#Ch002_11-80_B9780443187346000015.xhtml#bb0040)。\n\n准则按顺序适用，面对道德困境时，必须按顺序遵循准则。换句话说，保护社会比推进并保护职业更重要。\n\
  \n这种顺序是合理的。例如，南非的种族隔离制度是合法的，但却是不道德的。准则以明确无误的方式解决了这些问题。\n\n########## (ISC)²® 伦理准则详解\n\
  \n(ISC)²® 伦理准则的第一条，也是因此最重要的一条，要求信息安全专业人员“保护社会、公共利益、必要的公众信任和信心，以及基础设施” [\\[7\\]](#Ch002_11-80_B9780443187346000015.xhtml#bb0040)。第一条准则的重点在于公众及其对信息系统的理解和信任。安全专业人员肩负着推广安全实践、为公共利益改善系统和基础设施安全的使命。\n\
  \n(ISC)²® 伦理准则的第二条要求信息安全专业人员“光荣、诚实、公正、负责、合法地行事” [\\[7\\]](#Ch002_11-80_B9780443187346000015.xhtml#bb0040)。这条准则很直观，但有几点值得在此强调。这条准则中详述的一点与不同司法管辖区的法律发生冲突有关。(ISC)²®\
  \ 伦理准则建议优先考虑提供服务所在的司法管辖区。该准则提出的另一点与提供审慎建议有关，并告诫安全专业人员不要无谓地宣扬恐惧、不确定性和怀疑。\n\n(ISC)²®\
  \ 伦理准则的第三条要求安全专业人员“为委托人提供勤勉且称职的服务” [\\[7\\]](#Ch002_11-80_B9780443187346000015.xhtml#bb0040)。这条准则的主要重点是确保安全专业人员提供其有资质胜任的称职服务，并维护信息及相关系统的价值和机密性。一个额外的重要考量是确保专业人员在提供优质服务时不存在利益冲突。\n\
  \n\n\n\n`(ISC)²® 职业道德准则` 中的第四条也是最后一条准则要求信息安全专业人员“推进并保护该职业”[\\[7\\]](#Ch002_11-80_B9780443187346000015.xhtml#bb0040)。该准则要求安全专业人员保持自身技能，并提升他人的技能与知识。还有一个值得一提的考量因素是，该准则要求个人确保不通过以专业身份与可能损害该职业的人交往，从而对安全职业产生负面影响。\n\
  \n#### 考试警告\n\n`(ISC)²® 职业道德准则` 是重点考查内容，包括按顺序应用这些准则。考题可能会要求选择“最佳”道德答案，而所有备选答案在准则层面上都是符合道德的。在这种情况下，应选择在准则中最先被提及的答案。此外，最符合道德的答案通常是最佳答案：在考试中遇到相关问题时，请以极高的道德标准要求自己。\n\
  \n######## 计算机伦理研究所\n\n计算机伦理研究所提供了其“计算机伦理十诫”作为计算机伦理准则。该准则简短且直截了当。无论是名称还是格式，都让人联想到犹太教、基督教和伊斯兰教的“十诫”，但计算机伦理研究所的“计算机伦理十诫”并无明显的宗教性质。计算机伦理研究所的计算机伦理十诫如下：\n\
  \n1.  不得使用计算机危害他人。\n2.  不得干扰他人的计算机工作。\n3.  不得窥探他人的计算机文件。\n4.  不得使用计算机进行盗窃。\n5. \
  \ 不得使用计算机作伪证。\n6.  不得复制或使用未付费的专有软件。\n7.  未经授权或未给予适当补偿，不得使用他人的计算机资源。\n8.  不得挪用他人的智力成果。\n\
  9.  应思考你所编写的程序或设计的系统可能带来的社会后果。\n10. 应始终以确保体谅和尊重他人的方式使用计算机[\\[8\\]](#Ch002_11-80_B9780443187346000015.xhtml#bb0045)。\n\
  \n######## IAB 的伦理与互联网\n\n正如互联网的基础协议一样，互联网活动委员会（IAB）的道德准则《伦理与互联网》是在一份 RFC 文档中定义的。`RFC\
  \ 1087`《伦理与互联网》发布于 1987 年，旨在提出一项与互联网相关的道德行为政策。该 RFC 简短易读，并提供了五条基本道德原则。根据 IAB 的规定，如果有人故意实施以下行为，将被视为不道德行为：\n\
  \n*   寻求未经授权访问互联网资源；\n*   破坏互联网的预期用途；\n*   通过此类行为浪费资源（人员、容量、计算机）；\n*   破坏基于计算机的信息完整性；\n\
  *   危害用户隐私[\\[9\\]](#Ch002_11-80_B9780443187346000015.xhtml#bb0050)。\n\n## 信息安全治理\n\
  \n信息安全治理是组织层面的信息安全：高级管理层、策略、流程和人员配备。它也是高级领导层提供的组织优先级，这是成功实施信息安全计划所必需的。\n\n### 安全策略及相关文档\n\
  \n策略和程序等文档是任何成功的信息安全计划所必需的组成部分。这些文档应立足于现实：它们不是放在架子上积灰的理想化文档。它们应反映现实世界，并为正确（有时是强制）的做事方式提供指导。\n\
  \n#### 考试警告\n\n在讨论策略及相关文档时，“强制性”和“酌情性”等术语可能略显夸张，但对考试很有用。本文将使用这些术语。我们生活在一个灰度分明的信息安全世界中，但考试会就最佳选择提出非黑即白的问题。遵循最佳实践的指南是“酌情性”的，但如果你决定不遵循某项指南，该决定应经过深思熟虑并有据可查。\n\
  \n#### 策略\n\n策略是高层管理指令。策略是强制性的：例如，如果你不同意公司的性骚扰策略，你没有选择不遵守的选项。\n\n策略是高层级的：它不深入细节。服务器安全策略将讨论保护系统的机密性、完整性和可用性（通常按这些术语）。它可能涉及软件更新和补丁管理。策略不会使用“Linux”或“Windows”等术语；那层级太低了。事实上，如果你将服务器从\
  \ Windows 转换为 Linux，你的服务器策略不会改变。其他文档（如程序）会改变。\n\n##### 计划策略的组成部分\n\n所有策略都应包含以下基本组成部分：\n\
  \n*   目的\n*   范围\n*   职责\n*   合规性\n\n目的描述策略的必要性，通常是为了保护受保护数据的机密性、完整性和可用性。\n\n范围描述策略涵盖哪些系统、人员、设施和组织。任何不在范围内的相关实体都应记录在案，以避免混淆。\n\
  \n职责包括信息安全人员、策略和管理团队的职责，以及组织所有成员的职责。\n\n合规性描述两个相关问题：如何评判策略的有效性（运行得如何）以及违反策略时会发生什么（制裁）。所有策略必须有“约束力”：如果访问互联网上的色情内容没有任何后果，那么禁止此类访问的策略就没有用处。\n\
  \n##### 策略类型\n\n`NIST 特别出版物 800-12`（参见 <https://csrc.nist.gov/publications/detail/sp/800-12/archive/1995-10-02>）讨论了三种特定的策略类型：计划策略、问题专用策略和系统专用策略。\n\
  \n计划策略建立组织的信息安全计划。`NIST SP 800-12` 中列出的问题专用策略示例包括电子邮件策略和电子邮件隐私策略。系统专用策略示例包括文件服务器策略或\
  \ Web 服务器策略。\n\n#### 程序\n\n程序是完成任务的分步指南。它们层级较低且具体。与策略一样，程序是强制性的。\n\n以下是一个创建新用户的简单程序示例：\n\
  \n1.  接收新用户申请表并验证其完整性。\n2.  验证用户经理是否已在表格上签字。\n3.  验证用户已阅读并同意用户账户安全策略。\n4.  遵循角色分配程序\
  \ `NX-103` 对用户角色进行分类。\n5.  验证用户已选择一个“密语”（如其母亲的娘家姓），并将其录入服务台账户配置文件。\n6.  创建账户并分配适当的角色。\n\
  7.  将密语设为初始密码，并将“下次登录强制用户更改密码”设置为“True”。\n8.  将新账户文档通过电子邮件发送给用户及其经理。\n\n该程序的步骤是强制性的。安全管理员没有选择跳过步骤\
  \ 1 的选项，例如在没有表格的情况下创建账户。\n\n\n\n其他保障措施依赖于这一事实：当用户因忘记密码而致电服务台时，服务台将遵循其“忘记密码”程序，其中包括询问用户的密语。除非完成了步骤\
  \ 5，否则他们无法做到这一点：没有该密语，服务台无法安全地重置密码。这缓解了社会工程学攻击，即冒名顶替者试图欺骗服务台重置其无权访问的账户的密码。\n\n####\
  \ 标准\n\n标准描述了技术的具体用途，通常应用于硬件和软件。“所有员工将获得一台配备 16GB 内存、4.0 GHz CPU 和 1TB 硬盘的 ACME\
  \ Nexus-6 笔记本电脑”是硬件标准的一个例子。“笔记本电脑将运行 Windows 11 专业版 64 位版本”是软件（操作系统）标准的一个例子。\n\n\
  标准是强制性的。它们降低了保障措施的总拥有成本。标准还支持灾难恢复。想象一下，办公园区里并排有两栋大楼，分别属于两家公司。每栋大楼都有 1000 台笔记本电脑。\n\
  \n一家公司使用标准化的笔记本电脑硬件和软件。笔记本电脑操作系统是从一个中央预配置并打好补丁的镜像安装的。标准操作系统具有预配置的网络文件存储、所有必需的工具、预装软件，以及预配置的防病毒和防火墙软件。禁止用户安装自己的应用程序。\n\
  \n另一家公司不采用标准。笔记本电脑硬件由多个供应商制造。使用多种操作系统，且处于不同的补丁级别。有些使用网络存储；有些则不使用。许多安装了最终用户自行安装的应用程序。\n\
  \n如果大楼烧毁，哪家公司恢复得更快？第一家公司需要购买 1000 台相同的笔记本电脑，从异地存储恢复操作系统镜像和成像软件，配置成像服务器，并重建笔记本电脑。这不容易，但可行。第二家公司的恢复将困难得多，且更有可能失败。\n\
  \n#### 指南\n\n指南是建议（属于酌情决定）。指南可以是一条有用的建议，例如“要创建强密码，取句子中每个单词的首字母，并混入一些数字和符号。‘I will\
  \ pass the CISSP® exam in 6 months!’（我将在 6 个月内通过 CISSP® 考试！）变成 ‘Iwptcei6m!’”\n\n\
  即使不遵循此建议，你也可以创建强密码，这就是指南非强制性的原因。它们很有用，尤其是对新手用户。\n\n#### 基线\n\n基线是实施标准的统一方法。“通过应用互联网安全中心\
  \ Linux 基准来加固系统”是基线的一个例子（参见 [`www.cisecurity.org/cis-benchmarks/`](https://www.cisecurity.org/cis-benchmarks/)\
  \ 了解互联网安全中心的安全基准部门；它们是极佳的资源）。系统必须满足这些基准所描述的基线。\n\n基线是酌情决定的：只要系统至少与使用基准加固的系统一样安全，不遵循上述基准来加固系统也是可以接受的。对基线的正式例外需要高级管理层签署批准。\n\
  \n表 2.3 总结了安全文档的类型。\n\n表 2.3\n\n安全文档摘要。\n\n| 文档 | 示例 | 强制性还是酌情性？ |\n| --- | ---\
  \ | --- |\n| 策略 | 通过加固操作系统保护 PII 的 CIA | 强制性 |\n| 程序 | 步骤 1：安装预加固的操作系统镜像。步骤 2：从更新服务器下载补丁。步骤\
  \ 3：…… | 强制性 |\n| 标准 | 使用 Nexus-6 笔记本电脑硬件 | 强制性 |\n| 指南 | 可通过使用安装脚本自动安装补丁 | 酌情性\
  \ |\n| 基线 | 使用 CIS 安全基准 Windows 基准 | 酌情性 |\n\n#### 人员安全\n\n用户可能对组织构成最大的安全风险。应进行背景调查，承包商需要得到安全管理，用户必须接受适当培训并了解安全风险，我们将在接下来讨论这些内容。诸如保密协议\
  \ (NDA) 和相关雇佣协议之类的控制措施是推荐的人员安全控制，我们将在第 8 章，领域 7：安全运营中讨论。\n\n##### 候选人筛选与雇佣\n\n候选人在被雇佣前应经过仔细筛选。组织在雇佣个人前应进行彻底的背景调查。应进行犯罪记录检查，并应核实所有经验、教育和认证。在招聘过程中，关于教育、认证和相关资质撒谎或夸大是最常见的不诚实行为之一。\n\
  \n对于拥有更高权限的角色（如访问资金或机密信息），应进行更彻底的背景调查。这些检查可以包括财务调查、更彻底的犯罪记录检查，以及对朋友、邻居、现任和前任同事的访谈。\n\
  \n##### 入职\n\n一旦候选人被录用，入职流程即开始。创建账户和授予访问权限时应遵循最小权限原则。新员工应了解所有相关策略和程序，例如互联网可接受使用策略。此流程通常无效，因为新员工被交给一堆表格（直接存款、健康保险等），安全策略就夹在其中。应特别注意确保新员工充分了解所有相关安全策略。培训和意识教育应立即开始。\n\
  \n##### 员工离职\n\n离职应导致立即撤销员工的所有访问权限。除了账户撤销外，离职流程应是公平的。采用公平离职流程有道德和法律原因，但也有额外的信息安全优势。组织最可怕的敌人可能是心怀不满的前员工，即使没有合法的账户访问权限，他们也知道“弱点在哪里”。这对\
  \ IT 人员尤其如此。\n\n对离职的负面反应始终是可能的，但使用公平的离职流程可以降低风险。正如 CISSP® 考试许多领域一样，流程胜过非正式行动。渐进式纪律处分（也称为纪律阶梯）流程包括：\n\
  \n*   辅导\n*   正式谈话\n*   口头警告会议，人力资源部门出席（可能多次警告）\n*   书面警告会议，人力资源部门出席（可能多次警告）\n*\
  \   解雇\n\n应向员工明确说明纪律处分的原因，并给出结束该流程所需的直接可执行步骤。例如：“您因未能准时到岗而受到纪律处分。除非另有安排或遇到紧急情况，您必须在每个工作日上午\
  \ 9:00 前到岗。当您持续准时到岗时，此流程将结束。如果您继续未能准时到岗，此流程将继续。如果问题持续存在，此流程可能导致解雇。”\n\n如果流程以解雇告终，则不再有意外。这是公平的，并降低了负面反应的可能性。如果人们觉得受到了公平对待，往往会表现得更理智。\n\
  \n##### 安全意识与培训\n\n安全意识和培训经常被混淆。意识改变用户行为；培训提供技能组合。\n\n\n\n提醒用户切勿共享账户或记录密码，这是安全意识的一个示例。这假设部分用户存在不当行为，而安全意识旨在改变这种行为。\n\
  \n安全培训教会用户如何执行某项操作。示例包括：培训新服务台人员打开、修改和关闭服务工单；培训网络工程师配置路由器；或培训安全管理员创建新账户。\n\n安全意识和培训计划都应定期进行内容审查，以确保数据及时准确。信息安全形势变化迅速，例如在\
  \ COVID-19 大流行期间，无数组织采用远程办公和远程技术，如 `Slack`、`Discord`、`Zoom`、`Microsoft Meeting`、`Office365`\
  \ 等。\n\n还应衡量安全意识和培训的有效性。在安全意识和培训计划开始前收集以下类型的指标，然后定期测量以跟踪计划有效性：\n\n*   已完成安全意识和培训计划的员工百分比\n\
  *   员工对安全意识和培训计划提供的质量反馈\n*   授权钓鱼活动的点击次数\n*   漏洞扫描中发现的漏洞\n*   补丁有效性\n*   受损系统数量\n\
  *   安全事件\n*   停留时间（描述识别事件所需的时间）\n*   系统和网络正常运行时间\n*   等……\n\n##### 游戏化\n\n游戏化是一种学习形式，它将潜在枯燥的材料（如安全意识简报）转化为游戏。解锁关卡、积分、徽章和头像很有趣，能激发竞争精神，鼓励沉浸式学习。排行榜可用于鼓励这种竞争，个人和团队争夺榜首位置。\n\
  \n图 2.9 来自 SANS 研究所的 Holiday Hack（参见 [`www.holidayhackchallenge.com/`](https://www.holidayhackchallenge.com/)），这是一个高度游戏化的年度圣诞主题黑客挑战赛。\n\
  \n![图 2.9 SANS Holiday Hack.](img/f02-09-9780443187346.jpg)\n\n图 2.9 SANS Holiday\
  \ Hack.\n\n##### 安全冠军\n\n安全冠军是非信息安全团队（包括运维、工程、软件开发等）的成员，他们充当与信息安全团队的联络人：“安全冠军计划招募来自公司各个学科的安全意识员工，为他们提供网络安全培训和指导。受训后，这些安全冠军成为其各自团队中安全的代言人，推动整个企业关键的网络安全业务成果”\
  \ [\\[10\\]](#Ch002_11-80_B9780443187346000015.xhtml#bb0055)。\n\n安全冠军角色应正式化，并纳入该人员的职位描述中。计划推出后，可根据其知识、经验和热情识别潜在候选人。该角色应视为晋升（并伴随相应的薪酬增长）。\n\
  \n### 访问控制防御类别和类型\n\n为了理解并适当实施访问控制，了解每种控制能为安全带来什么益处至关重要。在本节中，将根据每种访问控制类型如何增强系统安全性来定义它们。\n\
  \n共有六种访问控制类型：\n\n*   预防性\n*   检测性\n*   纠正性\n*   恢复性\n*   威慑性\n*   补偿性\n\n这些访问控制类型可归入三大类别之一：管理类、技术类或物理类。\n\
  \n1.  **管理类**（也称为指令类）控制通过制定和遵循组织政策、程序或法规来实施。用户培训和意识也属于此类。\n2.  **技术类**控制通过使用软件、硬件或固件来限制对信息技术系统的逻辑访问而实施。示例包括防火墙、路由器、加密等。\n\
  3.  **物理类**控制通过物理设备实施，如锁、围栏、大门和保安。\n\n#### 预防性\n\n*预防性控制* 防止动作发生。它对潜在用户（无论授权与否）能做什么施加限制。在系统上分配权限是预防性控制的一个好示例，因为有限的权限可防止用户访问和执行未经授权的系统操作。管理类预防性控制的一个示例是入职前药物筛查。其旨在防止组织雇佣吸食违禁药物的员工。\n\
  \n> **注意**\n>\n> 部分资料来源使用“preventive”，另一些使用“preventative”（多出“ta”）。就考试而言，它们是同义词。\n\
  \n#### 检测性\n\n*检测性控制* 是在成功攻击期间或之后发出警报的控制。入侵检测系统在成功攻击后发出警报、向保安报警的闭路电视摄像头（CCTV）以及由入侵者触发的楼宇报警系统，均属于检测性控制示例。\n\
  \n#### 纠正性\n\n*纠正性控制* 通过“纠正”受损系统或流程发挥作用。纠正性访问控制通常与检测性访问控制协同工作。防病毒软件包含这两个组件。首先，防病毒软件运行扫描并使用其定义文件检测是否有任何软件与其病毒列表匹配。如果检测到病毒，纠正性控制接管，将可疑软件隔离。\n\
  \n#### 恢复性\n\n发生安全事件后，可能需要采取*恢复性控制* 以恢复系统和组织的功能。恢复意味着系统必须被恢复：从操作系统介质或镜像重新安装、从备份恢复数据等。\n\
  \n理解纠正性控制和恢复性控制之间的联系很重要。例如，假设用户下载了特洛伊木马。纠正性控制可能是防病毒软件的“隔离”。如果隔离无法纠正问题，则可能实施恢复性控制以重新加载软件并重建受损系统。\n\
  \n#### 威慑性\n\n*威慑性控制* 阻止用户在系统上执行操作。示例包括“当心恶犬”标牌：面对两栋楼（一栋有护卫犬，一栋没有）的小偷，更可能攻击没有护卫犬的那栋。超速高额罚款是阻止司机超速的威慑。制裁政策让用户明白，如果被发现浏览非法或违规网站将被解雇，这也是一种威慑。\n\
  \n#### 补偿性\n\n*补偿性* 控制是为弥补其他控制中的弱点而设置的额外安全控制。例如，浏览色情网站会导致员工丢掉工作。这属于管理类威慑性控制。然而，通过每天审查每位员工的\
  \ Web 日志，我们增加了一个检测性*补偿性* 控制，以强化解雇浏览不当网站员工的管理控制。\n\n#### 比较访问控制\n\n知道如何将访问控制示例归类为适当的类型和类别很重要。考试要求考生能够识别访问控制的类型和类别。然而，在现实世界中，请记住控制并不总是完全符合某一类别：上下文决定类别。\n\
  \n> **考试警告**\n\n\n\n### 控制类型\n\n考试中的控制类型，不要死记硬背示例：而要寻找上下文。防火墙是预防性技术控制的明确示例，锁是预防性物理控制的好示例。\n\
  \n其他示例不那么明确。室外灯是什么控制？灯光允许警卫看到入侵者（检测性）。灯光也可能威慑犯罪（罪犯会青睐光线不足的目标）。\n\n保安是什么控制？警卫可以把门关住（防止其打开），或在走廊里看到入侵者（检测入侵者），或者警卫在场这一事实本身就能威慑攻击等。换句话说，警卫几乎可以是任何控制：上下文决定了警卫履行哪种控制。\n\
  \n以下是更明确的示例：\n\n#### 预防性\n\n*   **物理**：锁、人员陷阱\n*   **技术**：防火墙\n*   **管理**：入职前药物筛查\n\
  \n#### 检测性\n\n*   **物理**：闭路电视、灯光（用于发现入侵者）\n*   **技术**：入侵检测系统\n*   **管理**：入职后随机药物测试\n\
  \n#### 威慑性\n\n*   **物理**：“当心恶犬”标志、灯光（威慑物理攻击）\n*   **技术**：登录提示前显示的警告横幅\n*   **管理**：制裁政策\n\
  \n### 风险分析\n\n所有信息安全专业人员都要评估风险：我们做得太多了，以至于它变成了第二天性。补丁在周二发布。贵公司通常测试 2 周后再安装，但一种基于网络的蠕虫正在互联网上传播，感染未打补丁的系统。如果现在安装补丁，您将因缺乏测试而面临停机风险。如果等待测试，您将面临蠕虫感染的风险。哪个风险更大？您应该怎么做？风险分析将帮助您决定。\n\
  \n普通人在准确分析风险方面做得很差：如果您害怕旅行时死亡的风险，选择从纽约开车到佛罗里达而不是乘飞机来规避该风险，您就做了糟糕的风险分析。按里程计算，考虑到旅行时的死亡风险，乘汽车比乘飞机风险大得多。\n\
  \n准确的风险分析是信息安全专业人员的一项关键技能。我们在判断风险时必须要求自己达到更高的标准。我们的风险决策将决定我们部署哪些保护措施来保护资产，以及为此花费多少资金和资源。糟糕的决策会导致金钱浪费，甚至更糟——数据泄露。\n\
  \n#### 资产\n\n*资产*是您试图保护的宝贵资源。资产可以是数据、系统、人员、建筑物、财产等。资产的价值或关键性将决定您部署什么保护措施。人员是您最宝贵的资产。\n\
  \n#### 威胁和漏洞\n\n*威胁*是一种潜在的有害事件，如地震、停电或基于网络的蠕虫（如 NotPetya，参见 [`www.microsoft.com/security/blog/2018/02/05/overview-of-petya-a-rapid-cyberattack/`](https://www.microsoft.com/security/blog/2018/02/05/overview-of-petya-a-rapid-cyberattack/)），它于\
  \ 2017 年开始攻击 Microsoft Windows 操作系统。威胁是可能损害系统的负面行为。\n\n*漏洞*是允许威胁造成危害的弱点。漏洞示例（对应前述威胁）包括：未按抗震标准建造的建筑物、没有适当备用电源的数据中心、或几年未打补丁的\
  \ Microsoft Windows 系统。\n\n以蠕虫为例，威胁是 NotPetya 蠕虫。NotPetya 通过多种途径传播，包括缺少 MS17-010\
  \ 补丁（参见 [`docs.microsoft.com/en-us/security-updates/SecurityBulletins/2017/ms17-010`](https://docs.microsoft.com/en-us/security-updates/SecurityBulletins/2017/ms17-010)）。联网的\
  \ Microsoft Windows 系统如果缺少该补丁则存在漏洞。Linux 系统对 NotPetya 没有漏洞，因此不存在直接的 NotPetya 风险。\n\
  \n#### 风险 = 威胁 × 漏洞\n\n要存在风险，威胁必须与漏洞相关联。该关系由以下公式表示：\n\n**Risk = Threat × Vulnerability**\n\
  \n![si1_e](img/si1_e.png)\n\n您可以使用此公式为特定风险分配值值。为威胁和漏洞都分配一个数字。我们将使用 1–5 的范围（范围是任意的；在比较不同风险时只需保持一致）。\n\
  \n##### 示例学习：地震灾害风险指数\n\n风险往往违反直觉。如果问外行波士顿还是旧金山面临更大的地震风险，大多数人会回答“旧金山”。它位于加利福尼亚海岸，靠近著名的太平洋“火环”，且过去遭受过大地震。波士顿位于东北部，自殖民时代以来未遭受过大地震。\n\
  \nRachel Davidson 创建了地震灾害风险指数，用于判断世界主要城市间的地震风险。详情请见：[`www.sciencedaily.com/releases/1997/08/970821233648.htm`](https://www.sciencedaily.com/releases/1997/08/970821233648.htm)。\n\
  \n她发现波士顿和旧金山的地震风险大致相同：“尽管波士顿地区大地震频率较低，但波士顿人面临的总体地震风险与旧金山人相当。原因：波士顿有更大比例的建筑建于 1975\
  \ 年之前，当时该市将地震安全措施纳入了建筑规范” [11]。\n\n与波士顿相比，旧金山的地震威胁更高（地震更频繁），但脆弱性较低（更强的抗震建筑规范）。波士顿威胁较低（地震较少），但脆弱性较高（建筑较弱）。这意味着两个城市的风险大致相等。\n\
  \n使用 1–5 的评分标准，以下是旧金山的风险，使用“风险 = 威胁 × 脆弱性”计算：\n\n*   旧金山威胁：4\n*   旧金山脆弱性：2\n*  \
  \ 旧金山风险：4 × 2 = 8\n\n以下是波士顿的风险：\n\n*   波士顿威胁：2\n*   波士顿脆弱性：4\n*   波士顿风险：2 × 4 =\
  \ 8\n\n#### 影响\n\n“风险 = 威胁 × 脆弱性”公式有时会增加一个称为*影响*的变量：“风险 = 威胁 × 脆弱性 × 影响”。影响是损害的严重程度，有时以美元表示。因此有时使用“风险\
  \ = 威胁 × 脆弱性 × 成本”。影响的同义词是后果。\n\n让我们用同样的地震风险示例来计算波士顿建筑物的“影响”公式。一家公司在同一个办公园区有两栋几乎相同的建筑。一栋里满是人员和设备；另一栋是空的（等待未来扩张）。两者因地震受损的风险都是\
  \ 8，使用“风险 = 威胁 × 脆弱性”。大地震对空楼的影响是 2（潜在建筑物损失），对满楼的影响是 5（潜在人员伤亡）。以下是使用“风险 = 威胁 × 脆弱性\
  \ × 影响”计算的风险：\n\n*   空楼风险：2（威胁）× 4（脆弱性）× 2（影响）= 16\n*   满楼风险：2（威胁）× 4（脆弱性）× 5（影响）=\
  \ 40\n\n> **考试警告**\n>\n> 考试中人员伤亡具有近乎无限的影响。使用“风险 = 威胁 × 脆弱性 × 影响”公式计算风险时，任何涉及人员伤亡的风险都极高，必须予以缓解。\n\
  \n#### 风险分析矩阵\n\n\n\n\n*风险分析矩阵*使用一个象限来描绘风险发生的可能性与该风险可能造成的后果（或影响）。澳大利亚/新西兰 ISO 31000:2009\
  \ 风险管理——原则与指南（AS/NZS ISO 31000: 2009，参见 [`infostore.saiglobal.com/store/Details.aspx?ProductID=1378670`](https://infostore.saiglobal.com/store/Details.aspx?ProductID=1378670)）描述了风险分析矩阵，如表\
  \ 2.4 所示。\n\n表 2.4\n\n风险分析矩阵。\n\n| ![t02-01-9780443187346](img/t02-01-9780443187346.jpg)\
  \ |\n\n| --- |\n\n风险分析矩阵允许您基于可能性（从“罕见”到“几乎确定”）和后果（或影响）（从“微不足道”到“灾难性”）执行定性风险分析（参见“定量与定性风险分析”一节）。生成的评分为低\
  \ (L)、中 (M)、高 (H) 和极端风险 (E)。低风险通过常规流程处理；中风险需要通知管理层；高风险需要通知高级管理层，而极端风险需要立即采取行动，包括制定详细的缓解计划（并通知高级管理层）。\n\
  \n矩阵的目标是识别高可能性/高后果风险（表 2.4 的右上象限），并将其降低为低可能性/低后果风险（表 2.4 的左下象限）。\n\n##### 计算年度预期损失\n\
  \n*年度预期损失*（ALE）计算允许您确定因风险导致的年度损失成本。计算得出后，ALE 允许您做出明智的决策以缓解风险。\n\n本节将以未加密笔记本电脑丢失或被盗导致的风险为例。假设您的公司有\
  \ 1000 台包含个人身份信息 (PII) 的笔记本电脑。您是安全主管，担心因笔记本电脑丢失或被盗而导致 PII 泄露的风险。您希望购买并部署笔记本电脑加密解决方案。该解决方案成本高昂，因此您需要说服管理层该解决方案物有所值。\n\
  \n###### 资产价值\n\n*资产价值*（AV）是您试图保护的资产的价值。在本例中，每台笔记本电脑成本为 2500 美元，但真正的价值在于 PII。未加密\
  \ PII 的盗窃事件以前发生过，已使公司付出了数倍于笔记本电脑价值的代价，包括监管罚款、负面宣传、法律费用、调查所花费的员工工时等。本例中包含 PII 的笔记本电脑的真实平均资产价值为\
  \ 25,000 美元（2500 美元硬件成本 + 22,500 美元泄露 PII 成本）。\n\n有形资产（如计算机或建筑物）易于计算。无形资产更具挑战性。例如，品牌忠诚度的价值是多少？根据\
  \ Chronos Capital 的说法，计算无形资产价值有三种方法——市场法、收益法和成本法：\n\n*   • “市场法：这种方法假设资产的公允价值反映了在类似情况下可比资产在交易中被购买的价格。\n\
  *   • “收益法：这种方法基于这样一个前提，即一项……资产的价值是该资产在其剩余使用寿命内将产生的未来盈利能力的现值。\n*   • “成本法：这种方法通过参考重新创建或替换该资产所发生的成本来估算资产的公允价值”\
  \ [\\[12\\]](#Ch002_11-80_B9780443187346000015.xhtml#bb0065)。\n\n###### 暴露因子\n\n\
  *暴露因子*（EF）是因事件导致资产价值损失的百分比。对于被盗的含有未加密 PII 的笔记本电脑，暴露因子为 100%：笔记本电脑和所有数据均已丢失。\n\n\
  ###### 单次预期损失\n\n*单次预期损失*（SLE）是一次损失的成本。SLE 等于资产价值 (AV) 乘以暴露因子 (EF)。在本例中，SLE 为 25,000\
  \ 美元（资产价值）乘以 100%（暴露因子），即 25,000 美元。\n\n###### 年化发生率\n\n*年化发生率*（ARO）是每年遭受的损失次数。通过查看过去的事件，您发现平均每年有\
  \ 11 台笔记本电脑丢失或被盗。您的 ARO 为 11。\n\n###### 年度预期损失\n\n年度预期损失 (ALE) 是因风险导致的年度成本。它通过将单次预期损失\
  \ (SLE) 与年化发生率 (ARO) 相乘来计算。在本例中，即 25,000 美元 (SLE) 乘以 11 (ARO)，结果为 275,000 美元。\n\n\
  表 2.5 总结了用于确定年度预期损失的公式。\n\n表 2.5\n\n风险公式汇总。\n\n| | 公式 | 说明 |\n| --- | --- | ---\
  \ |\n| 资产价值 (AV) | AV | 资产的价值 |\n| 暴露因子 (EF) | EF | 资产价值损失的百分比 |\n| 单次预期损失 (SLE)\
  \ | AV × EF | 一次损失的成本 |\n| 年化发生率 (ARO) | ARO | 每年的损失次数 |\n| 年度预期损失 (ALE) | SLE ×\
  \ ARO | 每年损失的成本 |\n\n##### 总拥有成本\n\n*总拥有成本*（TCO）是缓解保障措施的总成本。TCO 将前期成本（通常是一次性资本支出）与年度维护成本相结合，包括员工工时、供应商维护费、软件订阅费等。这些持续性成本通常被视为运营支出。\n\
  \n以笔记本电脑加密为例，笔记本电脑加密软件的前期成本为 100 美元/台，1000 台共计 100,000 美元。供应商收取 10% 的年度支持费，即 10,000\
  \ 美元/年。您估计每台笔记本电脑安装软件需要 4 个员工工时，共 4000 个员工工时。执行此工作的员工每小时工资 50 美元外加福利。包含福利在内，员工每小时成本为\
  \ 70 美元，乘以 4000 小时，共计 280,000 美元。\n\n贵公司采用 3 年技术刷新周期，因此您按 3 年计算总拥有成本：\n\n*   • 软件成本：100,000\
  \ 美元\n*   • 三年供应商支持：10,000 美元 × 3 = 30,000 美元\n*   • 员工小时成本：280,000 美元\n*   • 3\
  \ 年总拥有成本：410,000 美元\n*   • 年均总拥有成本：410,000 美元 / 3 = 136,667 美元/年\n\n您笔记本电脑加密项目的年度总拥有成本为每年\
  \ 136,667 美元。\n\n##### 投资回报率\n\n投资回报率 (ROI) 是实施保障措施所节省的资金量。如果您的年度总拥有成本 (TCO) 低于年度预期损失\
  \ (ALE)，则 ROI 为正（即做出了正确选择）。如果年度 TCO 高于 ALE，则是错误的选择。\n\n笔记本电脑加密的年度 TCO 为 136,667\
  \ 美元；未加密笔记本电脑丢失或被盗的年度预期损失 (ALE) 为 275,000 美元。计算汇总见表 2.6。\n\n表 2.6\n\n未加密笔记本电脑的年度预期损失。\n\
  \n| | 公式 | 数值 |\n| --- | --- | --- |\n| 资产价值 (AV) | AV | $25,000 |\n| 暴露因子 (EF)\
  \ | EF | 100% |\n| 单次预期损失 (SLE) | AV × EF | $25,000 |\n| 年化发生率 (ARO) | ARO | 11\
  \ |\n| 年度预期损失 (ALE) | SLE × ARO | $275,000 |\n\n\n\n\n### 实施笔记本电脑加密\n\n实施笔记本电脑加密将改变暴露因子。笔记本电脑硬件价值\
  \ 2500 美元，泄露的 PII（个人身份信息）额外造成 22,500 美元损失，资产价值总计 25,000 美元。如果未加密的笔记本电脑丢失或被盗，暴露因子为\
  \ 100%（硬件和所有数据均暴露）。笔记本电脑加密可缓解 PII 泄露风险，将暴露因子从 100%（笔记本电脑及所有数据）降低至 10%（仅笔记本电脑硬件）。\n\
  \n较低的暴露因子将预期年损失从 275,000 美元降低至 27,500 美元，如表 2.7 所示。\n\n表 2.7\n\n加密笔记本电脑的预期年损失。\n\
  \n| | 公式 | 数值 |\n| --- | --- | --- |\n| 资产价值 (AV) | AV | $25,000 |\n| 暴露因子 (EF)\
  \ | EF | 10% |\n| 单次损失期望 (SLE) | AV × EF | $2500 |\n| 年化发生率 (ARO) | ARO | 11 |\n\
  | 预期年损失 (ALE) | SLE × ARO | $27,500 |\n\n通过投资 136,667 美元，您每年将节省 247,500 美元（旧 ALE\
  \ 275,000 美元减去新 ALE 27,500 换算得出）。您的 ROI（投资回报率）为每年 110,833 美元（247,500 美元减去 136,667\
  \ 美元）。笔记本电脑加密项目具有正 ROI，是一项明智的投资。\n\n### 预算与指标\n\n结合风险分析，总拥有成本和投资回报率计算纳入了合理的预算编制。一些组织拥有充足的信息安全资金，这一令人羡慕的地位却常导致其遭受入侵。为什么？答案通常是因为它们缓解了错误的风险。它们在可能并非必要的地方花钱，却忽视了更大的风险。无论员工规模或预算如何，所有组织能承担的信息安全项目数量都是有限的。如果选择不当，信息安全就会受损。\n\
  \n指标能极大地协助信息安全预算编制过程。它们有助于说明潜在的高昂风险，并证明现有控制措施的有效性（及潜在成本节约）。它们还能帮助推动信息安全事业的发展。\n\n\
  CIS 安全基准列出了以下指标：\n\n*   **应用安全**\n    *   应用程序数量\n    *   关键应用程序百分比\n    *   风险评估覆盖率\n\
  \    *   安全测试覆盖率\n*   **配置变更管理**\n    *   完成变更的平均时间\n    *   经过安全审查的变更百分比\n    *\
  \   具有安全例外的变更百分比\n*   **财务**\n    *   信息安全预算占 IT 预算的百分比\n    *   信息安全预算分配\n*   **事件管理**\n\
  \    *   发现事件的平均时间\n    *   事件发生率\n    *   由内部控制检测到的事件百分比\n    *   安全事件间隔平均时间\n\
  \    *   恢复平均时间\n*   **补丁管理**\n    *   补丁策略合规性\n    *   补丁管理覆盖率\n    *   打补丁平均时间\n\
  *   **漏洞管理**\n    *   漏洞扫描覆盖率\n    *   无已知严重漏洞的系统百分比\n    *   缓解漏洞的平均时间\n    * \
  \  已知漏洞实例数量 [\\[13\\]](#Ch002_11-80_B9780443187346000015.xhtml#bb0070)。\n\n### 风险响应\n\
  \n评估完风险后，我们必须决定采取何种措施。选项包括接受风险、缓解或消除风险、转移风险和规避风险。\n\n#### 接受风险\n\n某些风险可以被接受：在某些情况下，因特定风险而不对资产进行保护，比为保护它而付出努力（和花费金钱）更便宜。这不能是一个无知的决定：必须考虑该风险，并在接受风险前权衡所有选项。\n\
  \n##### 实例学习：接受风险\n\n一家公司进行了风险分析，确定一台大型主机是风险来源。该大型主机不再用于新交易；它作为历史数据的归档系统。因硬件老化、支持合同到期未续签、精通大型主机的主题专家离职，从磁盘故障中恢复大型主机的能力随时间推移而削弱。公司不确定是否能及时恢复丢失的数据（如果能恢复的话）。\n\
  \n在安装新的归档系统前，归档数据还需在线保留 6 个月。在此期间该如何处理备份？公司应购买新的大型主机恢复硬件、采购支持合同，还是雇佣外包大型主机专家？\n\n\
  风险管理团队询问支持归档检索的团队：“如果这些数据在新归档系统上线前 6 个月的明天消失了，会发生什么？” 答案是：公司可在过渡期使用纸质记录，这仅代表一个微小的运营不便。没有法律法规禁止此计划。\n\
  \n公司决定接受因大型主机故障导致无法恢复归档数据的风险。请注意，该决定经过深思熟虑。相关方被咨询，运营影响被评估，法律法规被考量在内。\n\n###### 风险接受标准\n\
  \n低可能性/低后果风险是风险接受的候选项。高风险和极端风险不能被接受。在某些情况下，如受法律法规保护的数据，或涉及人身生命安全的风险，接受风险不是一个选项。\n\
  \n#### 缓解风险\n\n缓解风险意味着将风险降低至可接受水平。降低风险也称为“风险降低”，降低风险的过程也称为“减少分析”。上文“预期年损失”一节给出的笔记本电脑加密示例即是缓解风险的例子。通过加密笔记本电脑上的数据，缓解了因笔记本电脑被盗导致\
  \ PII 丢失的风险。风险并未完全消除：薄弱或泄露的加密密码仍可能暴露 PII，但风险已降低至可接受水平。\n\n在某些情况下，可以完全消除风险：这称为消除风险。\n\
  \n#### 转移风险\n\n转移风险有时被称为“保险模式”。大多数人不自行承担房屋火灾风险：他们支付保费给保险公司，由其代为承担该风险。保险公司是风险分析专家：买卖风险是他们的业务。如果\
  \ 1000 户家庭火灾的平均年度货币风险为 500,000 美元（500 美元/户），保险公司以 600 美元/年的价格出售 1000 份火灾保险，他们将获得\
  \ 20% 的利润。这当然假设保险公司准确评估了风险。\n\n#### 风险规避\n\n在承接新项目前，应完成彻底的风险分析。如果风险分析发现难以轻易缓解的高风险或极端风险，规避风险（和该项目）可能是最佳选择。\n\
  \n该决策的数学计算很简单：计算新项目的预期年损失，并将其与项目预期的投资回报率进行比较。如果 ALE 高于 ROI（即使在风险缓解后），风险规避是最佳方案。也可能存在法律或法规原因，强制要求规避风险。\n\
  \n##### 实例学习：规避风险\n\n一家公司在线销售 Apple iPhone。出于安全原因，回头客必须为每个订单重新输入信用卡号。这是为了规避在面向互联网的系统上存储信用卡号的风险（因为在那里它们更容易被窃取）。\n\
  \n\n\n\n基于客户反馈，业务单元为回头客提议了一项“保存我的信用卡信息”功能。项目一经提出，即进行了新功能的风险分析。业务单元还计算了该功能的投资回报率（ROI）。\n\
  \n风险分析表明，信息安全架构需要显著改进，才能安全地保护面向互联网系统上存储的信用卡信息。这样做还将需要更严格的支付卡行业（PCI）审计，给总拥有成本（TCO）增加大量的人工工时。\n\
  \n在统计所有成本后，TCO 是新功能 ROI 的两倍多。公司决定规避风险，不实施信用卡信息保存功能。\n\n### 定量与定性风险分析\n\n定量风险分析和定性风险分析是分析风险的两种方法。定量风险分析使用硬性指标，如美元。定性风险分析使用简单的近似值。定量分析更客观；定性分析更主观。*混合风险分析*\
  \ 结合了两者：对容易用硬性数字（如资金）表示的风险使用定量分析，对其余风险使用定性分析。\n\n### 考试警示\n\n定量风险分析要求你计算所保护资产的数量。Quantitative-quantity（定量-数量）是一个记忆提示，帮助你在考试中记住这一点。\n\
  \n计算年度预期损失（ALE）是定量风险分析的一个例子。ALE 的输入是硬性数字：资产价值（以美元计）、暴露因子（以百分比计）和年度发生率（作为一个硬性数字）。\n\
  \n风险分析矩阵（前文 表 2.4 所示）是定性风险分析的一个例子。可能性和后果是粗略的（有时是主观的）值，范围从 1 到 5。某风险的后果是“4”还是“5”可能是（主观）争论的问题。\n\
  \n定量风险分析更困难；要定量分析地震对数据中心造成损害的风险，你需要计算数据中心的资产价值：建筑物、服务器、网络设备、机柜、显示器等的成本。然后计算暴露因子，以此类推。\n\
  \n要定性分析同一风险，你需要调查风险，并认定可能性为 2，后果为 4，并使用风险分析矩阵确定风险为“高”。\n\n### 风险管理流程\n\n美国国家标准与技术研究院（NIST）发布了特别出版物\
  \ 800-30《信息技术系统风险管理指南》（参见 [`csrc.nist.gov/publications/detail/sp/800-30/rev-1/final`](https://csrc.nist.gov/publications/detail/sp/800-30/rev-1/final)）。该指南描述了一个\
  \ 9 步风险分析流程：\n\n1.  系统表征\n2.  威胁识别\n3.  脆弱性识别\n4.  控制分析\n5.  可能性确定\n6.  影响分析\n7.\
  \  风险确定\n8.  控制建议\n9.  结果文档化\n\n我们已单独介绍了这些步骤；让我们通过遵循 NIST 的流程来结束本节。\n\n系统表征描述风险管理工作的范围和将被分析的系统。接下来的两个步骤，威胁识别和脆弱性识别，识别使用“风险\
  \ = 威胁 × 脆弱性”公式识别风险所需的威胁和脆弱性。\n\n第 4 步，控制分析，分析现有或计划中的安全控制（保障措施）以缓解风险。第 5 和第 6 步，可能性确定和影响分析，用于识别重要风险（特别是那些可能性高、影响/后果大的风险）。顾名思义：第\
  \ 7 步（风险确定）计算风险。\n\n前 7 步用于确定控制建议，即风险缓解策略。该策略在最后一步，结果文档化中记录。\n\n### 风险成熟度建模\n\n\
  风险成熟度建模（持续改进过程的一部分）旨在衡量组织风险管理流程的成熟度。它通常有五个级别。名称因模型而异；以下是常用的级别：\n\n*   **一级：临时/非常基础**\n\
  *   **二级：初步/初始/基础**\n*   **三级：已定义/可重复/新兴**\n*   **四级：集成/受控/成熟**\n*   **五级：优化/领先/先进**\n\
  \n调查用于评估组织的成熟度。该过程类似于卡内基梅隆大学的 CMMI（软件能力成熟度模型集成，详见 第 9 章），后者也有五个级别。\n\n## 安全与第三方\n\
  \n组织越来越依赖第三方提供重要且有时是业务关键的服务。虽然利用外部组织绝非近期现象，但其角色的关键性以及当前通常所需服务和产品的量，都使得组织的信息安全部门有必要给予特别关注。\n\
  \n### 服务提供商合同安全\n\n合同是确保与提供服务的第三方组织打交道时安全性的主要控制手段。外包的巨大激增，尤其是向云服务的持续转移，使得合同安全措施变得更加突出。虽然合同语言会有所不同，但在试图确保与第三方组织打交道时的安全性时，有几种常见的合同或协议被使用。\n\
  \n### 最低安全要求\n\n最低安全要求描述了第三方公司与组织开展业务所需的基线安全控制。它们指定以下类型的控制：补丁 SLA、防病毒、复杂密码、双因素认证、加密、应用程序白名单、员工培训和意识等。\n\
  \n#### 服务等级协议与服务等级要求\n\n确保安全的常用方法是使用服务等级协议（SLA）。SLA 标识供应商在合同上必须满足的关键期望。SLA 广泛用于一般性能期望，但也越来越多地被用于安全目的。SLA\
  \ 主要解决可用性问题。\n\n服务等级要求描述第三方提供的服务。这些要求用于设计 SLA：“服务等级协议（SLA）规定最低性能要求，并在未满足这些要求时，规定必须提供的客户支持级别和范围。服务等级要求是系统需求，规定了\
  \ SLA 所依据的条件” [\\[14\\]](#Ch002_11-80_B9780443187346000015.xhtml#bb0075)。\n\n####\
  \ 认证\n\n大型提供商和更挑剔的客户经常寻求认证，作为确保组织安全状况已接受一定程度审查的一种手段。信息安全认证涉及让第三方组织审查服务提供商的实践，并就组织的安全状况发表声明。服务提供商的目标是提供证据证明其值得信任。通常，第三方在根据已知基线对服务提供商进行审计后提供认证。然而，一些服务提供商提供的另一种认证形式是第三方进行的渗透测试报告。\n\
  \n\n\n历史上，安全领域的主要认证手段是通过 `SAS 70` 审查。然而，`SAS 70` 并不显性关注信息安全。越来越多的大型服务提供商寻求 `ISO\
  \ 27001` 认证用于认证目的。有关 `ISO 27001` 的更多详细信息，请参见第 3 章，领域 2：资产安全。\n\n支付卡行业数据安全标准（`PCI-DSS`）也使用认证：`PCI`\
  \ 合格安全评估师（`QSA`）可以评估使用信用卡的组织的安全性。如果安全性符合 `PCI-DSS` 标准，则可向该组织颁发合规报告（`ROC`）和合规认证（`AOC`）。\n\
  \n#### 渗透测试权/审计权\n\n尽管第三方认证通常由供应商提供，作为验证其采用可靠安全实践的一种方式，但一些组织仍倾向于自行判断第三方组织的安全性。渗透测试权和审计权文件授予发起组织书面批准，允许其自行执行测试，或委托可信提供商代表其进行评估。通常，会对渗透测试人员或审计师被允许使用的工具或攻击目标施加限制，但这些限制应在事前明确界定。\n\
  \n渗透测试权/审计权文件的一种替代方案是，由服务提供商向发起组织提交其已执行的第三方审计或渗透测试报告。如前所述，这些文件也可被视为一种认证形式。\n\n####\
  \ 供应链风险管理\n\n供应链风险管理（`SCRM`）描述了管理从第三方采购产品和服务风险的过程。NIST 将该过程描述为：“一种系统化的流程，通过识别整个供应链中的易感性、漏洞和威胁来管理供应链风险，并制定缓解策略以应对这些威胁，无论这些威胁是由供应商、供应产品及其子组件，还是供应链本身（例如：初始生产、包装、处理、存储、运输、任务操作和处置）带来的”\
  \ [\\[15\\]](#Ch002_11-80_B9780443187346000015.xhtml#bb0080)。\n\nSolarWinds 黑客事件是近期大规模供应链事件的一个例子。政府问责局（`GAO`）对该攻击进行了描述：\n\
  \n> 从 2019 年 9 月开始，一系列网络攻击（现已确认由俄罗斯对外情报局实施，以下简称“威胁行为体”）入侵了 SolarWinds 的计算网络——一家位于德克萨斯州的网络管理软件公司。威胁行为体首先进行了一次“演练”，将测试代码注入\
  \ SolarWinds 名为 Orion 的网络管理和监控产品套件中。然后，从 2020 年 2 月开始，威胁行为体将特洛伊木马化（隐藏）代码注入一个文件中，该文件后来被包含在\
  \ SolarWinds 的 Orion 软件更新中。SolarWinds 向其客户发布了软件更新，却未意识到这些更新已被篡改。特洛伊木马代码为威胁行为体提供了一个“后门”——一种可让入侵者远程访问受感染计算机的程序。根据网络安全研究人员的说法，威胁行为体随后利用复杂的计算基础设施，远程利用了下载了受损软件更新的\
  \ SolarWinds 客户的网络和系统。\n>\n> 由于 SolarWinds 在联邦政府中被广泛用于监控联邦系统上的网络活动，此事件使威胁行为体能够入侵受感染机构的信息系统。SolarWinds\
  \ 估计其近 18,000 名客户收到了受损的软件更新。其中，威胁行为体以间谍活动为主要目的，针对一小部分高价值客户（包括联邦政府）进行了利用 [\\[16\\\
  ]](#Ch002_11-80_B9780443187346000015.xhtml#bb0085)。\n\n##### 与硬件、软件和服务相关的风险\n\n\
  采购是从第三方获取硬件、软件或服务的过程。在许多（如果不是大多数）组织中，人们很少主动寻求或获得有关解决方案安全性的洞察。如果涉及安全考量，传统上它们往往是事后诸葛亮，并在采购流程的后期才被纳入。尽早且频繁地利用安全部门，可作为一种预防性控制，使组织甚至在接受供应商或解决方案之前，就能做出基于风险的决策。虽然安全性当然不会是唯一的，也不是最重要的考量因素，但安全性介入得越早，就越有机会就安全挑战以及因采购而可能需要的对策进行有意义的讨论。\n\
  \n#### 供应商治理\n\n鉴于组织利用第三方组织和供应商的方式多种多样，因此需要实施供应商治理，也称为供应商管理。供应商治理的目标是确保业务持续从其第三方提供商处获得足够的质量。执行此职能的专业人员通常同时受雇于发起组织和第三方。有趣的是，供应商治理或管理本身也可以外包给另一个第三方。归根结底，目标是确保组织间的战略合作伙伴关系持续提供预期价值。\n\
  \n#### 收购\n\n收购可能会扰乱业务，影响两个组织的各个方面。对于信息安全而言，影响更是成倍增加。设想 Tyrell 公司收购了 Tannhauser\
  \ 公司。Tyrell 公司在信息安全方面投入巨大，而 Tannhauser 公司却未投入。事实上，Tannhauser 网络上存在多起正在进行的入侵事件，包括活跃的蠕虫感染。如果\
  \ Tyrell 只是简单地将两个企业 WAN 连接在一起，且两者之间几乎没有或完全没有过滤措施，会怎样？\n\n尽职调查要求对被收购公司的信息安全计划进行彻底的风险评估，包括对当前网络安全状况的有效评估。这包括在合并网络之前，对被收购公司执行漏洞评估和渗透测试。有关应执行的测试类型的更多信息，请参见第\
  \ 7 章，领域 6：安全评估与测试。\n\n#### 剥离\n\n剥离（也称为分拆和反收购）代表了收购的另一面：一家公司分裂为两家或更多。剥离可能比收购代表更大的风险：敏感数据究竟将如何分割？IT\
  \ 系统将如何分割？\n\n原本统一的公司分拆后，无意中在两家新分拆的公司中保留了重复的账户和密码，这种情况非常普遍。这允许（前）内部人员攻击：原统一公司的员工通过重用旧凭证入侵被剥离的公司。物理安全控制的重用（包括钥匙和工牌）也存在类似风险。必须撤销前员工的所有形式的访问权限。\n\
  \n#### 第三方评估与监控\n\n第三方（包括供应商、顾问和承包商）可能给组织带来风险。他们不是正式员工，有时拥有访问多个组织系统的权限。如果允许，他们可能会将组织的敏感数据放置在不受组织控制（或保护）的设备上。\n\
  \n\n\n拥有敏感数据访问权限的第三方人员必须接受培训并了解风险，就像员工一样。根据所需的访问级别，可能还需要进行背景调查。信息安全策略、程序和其他指导也应适用。应制定关于数据和知识产权所有权的额外策略。必须制定明确的规则，规定第三方可以在何处以及何时访问或存储数据。\n\
  \n其他需要考虑的问题包括：拥有多个组织系统访问权限的供应商如何管理访问控制？许多供应商会在多个站点重复使用相同的凭据，手动同步密码（如果他们能够或被允许这样做）。正如我们将在第\
  \ 6 章（Chapter 6）中讨论的那样，领域 5：身份与访问管理（IAM），多因素认证可以降低被盗、被猜测或被破解的凭据在别处被重复使用的风险。\n\n\
  此外，从技术角度来看，供应商的系统是如何保护和互联的？供应商站点（或供应商的任何客户）发生的违规事件会导致客户组织发生违规吗？谁负责修补和保护位于客户现场的供应商系统？\n\
  \n所有第三方连接都应严格保护并密切监控。如果授予 VPN 访问权限：它应仅允许连接到所需的系统和服务，防火墙应丢弃（并记录）所有其他流量。应仔细考虑并缓解横向移动（从一个内部系统攻陷另一个内部系统）的风险。\n\
  \n### 外包与离岸外包\n\n`Outsourcing`（外包）是指利用第三方提供以前由内部执行的信息技术支持服务。`Offshoring`（离岸外包）是指外包给另一个国家。\n\
  \n两者都可以通过以较低成本提供 IT 服务来降低总拥有成本。它们还可能增强公司（尤其是小公司）可用的信息技术资源和技能组合，从而提高数据的机密性、完整性和可用性。\n\
  \n离岸外包可能引发隐私和监管问题。例如，对于一家将数据离岸外包到澳大利亚的美国公司，澳大利亚没有《健康保险流通与责任法案》（`HIPAA`，美国涵盖医疗数据的主要法规）。澳大利亚也没有《萨班斯-奥克斯利法案》（`SOX`，保护美国上市公司数据）、《格雷姆-里奇-比利雷法案》（`GLBA`，保护美国金融信息）等。\n\
  \n在外包或离岸外包敏感数据之前，必须进行彻底且准确的风险分析。如果数据将驻留在另一个国家，必须确保遵守管辖该数据的法律法规，即使超出离岸外包司法管辖区的法律范围。这可以通过合同方式实现：例如，澳大利亚公司可以通过合同同意遵守`HIPAA`。\n\
  \n##### 实例学习\n\n##### 你知道你的数据在哪里吗？\n\n加州大学旧金山分校（`UCSF`）医疗中心将转录工作外包给了一家佛罗里达州的公司。该佛罗里达公司的一名转录员将部分工作分包给了德克萨斯州的一名男子，后者又将其再次分包给在巴基斯坦工作的\
  \ Beloch 女士。\n\n`UCSF`不知情的情况下，其部分转录工作已被离岸外包。`UCSF`的 ePHI——电子受保护医疗信息（联邦监管的医疗信息）位于巴基斯坦，那里不适用`HIPAA`。\n\
  \nBeloch 女士未能及时获得报酬，她给`UCSF`发送邮件威胁称，如果不付款，“我将把`UCSF`的所有语音文件和患者记录……发布到互联网上”[\\[17\\\
  ]](#Ch002_11-80_B9780443187346000015.xhtml#bb0090)。她在邮件中附带了`UCSF`的 ePHI 以证明她的访问权限。她最终得到了报酬，数据未被泄露。\n\
  \n你必须始终知道你的数据在哪里。任何外包协议必须包含关于分包商访问敏感数据的规则。任何离岸外包协议必须在合同层面考虑相关法律法规，如`HIPAA`。\n\n\
  ### 攻击者类型\n\n控制访问不仅仅是控制授权用户；它还包括防止未经授权的访问。信息系统可能会受到各种攻击者的攻击，范围从脚本小子到蠕虫，再到军事化攻击。攻击者可能会使用多种方法试图破坏系统的机密性、完整性和可用性。\n\
  \n#### 黑客\n\n媒体中常用“黑客”一词来描述攻击计算机系统的恶意个人。黑客一词最初描述的是非恶意的探索者，他们以创造者未预料到的方式使用技术。来自 1981\
  \ 年版 Jargon File（参见[`www.catb.org/jargon/`](http://www.catb.org/jargon/)）的第一个黑客定义是：“HACKER\
  \ \\[原指用斧头做家具的人\\] n. 1. 一个喜欢探索编程系统细节以及如何延展其能力的人，这与大多数用户只愿学习最低限度必要知识形成对比”[\\[18\\\
  ]](#Ch002_11-80_B9780443187346000015.xhtml#bb0095)。“如何延展其能力”是关键：最初的“黑客”是推动技术边界的专家，并乐在其中。\n\
  \n同一版 Jargon File 中黑客的第八个定义涉及恶意：“一个恶意或好奇的干涉者，试图通过四处探查来发现信息。因此有‘密码黑客’、‘网络黑客’”[\\\
  [18\\]](#Ch002_11-80_B9780443187346000015.xhtml#bb0095)。\n\n不道德的黑客有时会违反法律，带有恶意闯入计算机系统，并可能破坏组织系统和数据的机密性、完整性或可用性。\n\
  \n道德黑客包括专业渗透测试人员（经授权闯入系统）、恶意软件研究人员（研究恶意代码以提供更好的理解并向供应商负责任地披露漏洞）等。他们遵循职业道德准则并遵守法律。道德和不道德黑客通常被称为“白帽子”和“黑帽子”。由于行业内（急需的）推动使用更具包容性语言的运动，这些术语正逐渐不再流行，因为该行业历史上一直使用非包容性语言。\n\
  \n#### 脚本小子\n\n`Script kiddies`（脚本小子）使用他们几乎不理解的工具攻击计算机系统。现代利用工具（如 Metasploit Framework，[`www.metasploit.com/`](https://www.metasploit.com/)）质量高且易于使用，以至于安全新手也能成功攻陷某些系统。\n\
  \n> **注意**\n>\n> 脚本小子使用 Metasploit 等工具这一事实，并不意味着这些工具有任何负面含义。这些工具质量很高，正是这种质量使得新手有时能取得令人印象深刻的结果。Metasploit\
  \ 的一句旧口号（“点一点。点一下。拿到 Root。”）说明了这一事实。\n\n以 Metasploit 为例，攻陷一个系统可能只需四步。假设受害主机是一台表现出\
  \ PrintNightmare 漏洞（`CVE-2021-1675`和`CVE-2021-35427`）的 Microsoft Windows 10 系统。获取远程\
  \ SYSTEM 级 Shell 可能很简单：\n\n1.  选择漏洞利用模块（PrintNightmare）\n2.  选择载荷（运行反向命令 Shell）\n\
  3.  选择远程主机（受害者 IP 地址）\n4.  输入“exploit”\n\n攻击者随后输入“exploit”，如果成功，即可在受害主机上访问以 SYSTEM\
  \ 权限运行的命令 Shell。图 2.10 展示了 Metasploit 中的这一过程。\n\n![图 2.10 使用 Metasploit 在 4 步内攻陷系统。](img/f02-10-9780443187346.jpg)\n\
  \n图 2.10 使用 Metasploit 在 4 步内攻陷系统。\n\n\n\n虽然脚本小子缺乏知识和经验，但他们仍可能给保护不善的系统带来严重的安全问题。\n\
  \n#### 外部人员\n\n外部人员是指未经授权、无权访问系统或组织特权的攻击者。外部人员试图获取未经授权的访问权限。大多数攻击由外部人员发起，但其中大多数通常可通过纵深防御边界控制来缓解。\n\
  \n#### 内部人员\n\n内部攻击是由内部用户发起的，该用户可能被授权使用受攻击的系统。内部攻击可能是故意的，也可能是意外的。内部攻击者范围广泛，从因失误而导致问题的培训不足的管理员，到故意破坏系统安全的恶意人员。攻击系统的授权内部人员可能处于造成重大影响的位置。\n\
  \nNIST 特别出版物 800-30（[`csrc.nist.gov/publications/detail/sp/800-30/archive/2002-07-01`](https://csrc.nist.gov/publications/detail/sp/800-30/archive/2002-07-01)）列出了由内部攻击者引起的以下威胁行为：\n\
  \n*   对员工的袭击\n*   勒索\n*   浏览专有信息\n*   计算机滥用\n*   欺诈和盗窃\n*   信息贿赂\n*   输入伪造、损坏的数据\n\
  *   截获\n*   恶意代码（如病毒、逻辑炸弹、特洛伊木马）\n*   出售个人信息\n*   系统漏洞\n*   系统入侵\n*   系统破坏\n*  \
  \ 未经授权的系统访问 [\\[19\\]](#Ch002_11-80_B9780443187346000015.xhtml#bb0100)\n\n内部人员导致了大多数高影响安全事件。这一点有时存在争议：大多数攻击是由外部攻击者发起的。纵深防御缓解了大多数外部攻击：面向互联网的防火墙每天可能拦截数千次或更多攻击。大多数成功的攻击是由内部人员发起的。\n\
  \n#### 黑客活动家\n\n`hacktivist`（黑客活动家）是黑客活动分子，指因政治原因攻击计算机系统的人。“黑客行动主义”是黑客行为的激进主义。2022\
  \ 年俄罗斯入侵乌克兰期间，爆发了许多黑客行动主义案例。支持乌克兰的黑客活动家以及支持俄罗斯的行为体都参与了大规模且广泛的行动 [\\[20\\]](#Ch002_11-80_B9780443187346000015.xhtml#bb112)。这些黑客行动主义活动中一个值得注意的方面是，乌克兰副总理米哈伊洛·费多罗夫在\
  \ Twitter 上公开号召个人加入“IT 军队”，攻击特定的俄罗斯组织和网站 [\\[21\\]](#Ch002_11-80_B9780443187346000015.xhtml#bb111)。\n\
  \n#### 僵尸程序和僵尸网络\n\n`bot`（僵尸程序，robot 的缩写）是运行恶意软件并通过 `botnet`（僵尸网络）进行控制的计算机系统。僵尸网络包含一个中央命令与控制（C&C）网络，由被称为“牧羊人”的人类进行管理。术语\
  \ `zombie`（僵尸）有时用来描述僵尸程序。\n\n许多僵尸网络使用互联网中继聊天（IRC）网络来提供命令与控制；现代僵尸网络更常使用 HTTP、HTTPS、DNS\
  \ 或专有协议（有时经过混淆或加密）。图 2.11 显示了僵尸程序 IRC 命令与控制流量的数据包捕获，连接到“pLagUe”僵尸网络，使用 Wireshark\
  \ 网络协议分析器显示（参见 [`www.wireshark.org`](https://www.wireshark.org)）。\n\n![图 2.11 IRC\
  \ 僵尸网络命令与控制流量。](img/f02-11-9780443187346.jpg)\n\n图 2.11 IRC 僵尸网络命令与控制流量。\n\n图 2.11\
  \ 中的僵尸程序（称为 pLagUe{USA}{LAN}72705，表明其位于美国）向 C&C 网络报告。其他僵尸程序分别从巴西（BRA）、墨西哥（MEX）和美国报告。它们报告将病毒注入\
  \ `autorun.inf`：它们极有可能正在用病毒感染连接的 USB 驱动器。\n\n系统通过多种机制被攻陷后会成为僵尸程序，包括服务端攻击、客户端攻击和运行\
  \ `Remote Access Trojans`（远程访问木马，RATs）。正如领域 3：安全架构与工程所述，特洛伊木马程序执行两个功能，一个公开功能（如玩游戏）和一个隐蔽功能（如将系统加入僵尸网络）。\n\
  \n一旦加入僵尸网络，僵尸程序可能会被指示窃取本地信息，如信用卡号或其他系统（包括网上银行）的凭据。僵尸程序还会发送垃圾邮件、托管非法网站（包括毒品销售垃圾邮件使用的网站），并被用于协同的分布式拒绝服务（DDoS）攻击。\n\
  \n#### 钓鱼者和鱼叉式钓鱼者\n\n`phisher`（钓鱼者，用黑客拼写方式将“fisher”中的“f”替换为“ph”）是一种恶意攻击者，试图诱骗用户泄露账户凭据或\
  \ PII。许多 `phisher` 试图窃取网上银行信息，如 图 2.12 所示的钓鱼攻击。\n\n![图 2.12 “PNC”银行钓鱼尝试。](img/f02-12-9780443187346.jpg)\n\
  \n图 2.12 “PNC”银行钓鱼尝试。\n\n此钓鱼攻击触发了电子邮件系统的警告，正确提示：“此消息可能并非来自其声称的发件人。”该攻击试图诱骗用户点击“demo”链接，这是一个指向哥斯达黎加域名的恶意链接（与\
  \ PNC 银行无关）；相关电子邮件纯文本在 图 2.13 中高亮显示。\n\n![图 2.13 钓鱼邮件“DEMO”URL。](img/f02-13-9780443187346.jpg)\n\
  \n图 2.13 钓鱼邮件“DEMO”URL。\n\n钓鱼是一种社会工程学攻击，有时包含其他攻击，包括客户端攻击。点击钓鱼邮件中链接的用户可能会遭受客户端攻击和凭据窃取。仅仅访问钓鱼网站就很危险：客户端可能会被自动攻陷。\n\
  \n钓鱼攻击往往是大规模的：可能以数千或更多用户为目标。钓鱼者在碰概率：如果他们向 100,000 名用户发送邮件，其中 0.1% 的人点击，钓鱼者就会获得 100\
  \ 个新受害者。`Spear phishing`（鱼叉式钓鱼）针对的用户少得多：每个组织可能仅有少数用户。这些目标价值高（通常是高管），鱼叉式钓鱼攻击更具针对性，通常以用户的全名、职称和其他支持信息称呼用户。鱼叉式钓鱼者针对的用户较少，但每个潜在受害者的价值高得多。鱼叉式钓鱼也称为“捕鲸”或“猎鲸”（高管是高价值的“鲸鱼”）。\n\
  \n最后，`vishing`（语音钓鱼）是语音网络钓鱼：利用电话系统发起的攻击。攻击者在 IP 语音（VoIP）系统上使用自动化语音脚本，自动拨打数千个目标电话。典型的语音钓鱼攻击包括告知用户其银行账户被锁定，自动语音系统将在验证关键信息（如账号和\
  \ PIN 码）后为其解锁。\n\n### 考试目标总结\n\n信息安全治理确保组织拥有正确的信息架构、领导力和指导。治理有助于确保公司拥有适当的管理控制来降低风险。风险分析（RA）有助于确保组织正确识别、分析和缓解风险。准确评估风险，并理解年度预期损失（ALE）、总拥有成本（TCO）和投资回报率（ROI）等术语，不仅有助于你通过考试，也有助于推动你的信息安全职业发展。\n\
  \n\n\n\n理解和欣赏法律体系、概念和术语，是当今以信息为中心的世界中从事信息安全工作的从业者所必需的。信息系统的普及对法律体系的影响怎么强调都不为过。无论主要法律体系是大陆法系、普通法系、宗教法系，还是混合法系，信息系统都对世界各地的法律体系产生了持久影响，导致新法律的产生、现有法律的重新解释，以及对计算机给法庭带来的独特方面的全新认识。\n\
  \n最后，信息安全的本质及其固有的敏感性，使得伦理框架成为一个需要额外关注的重点。本章介绍了 IAB 的《互联网伦理 RFC》、计算机伦理协会的《计算机伦理十诫》以及\
  \ (ISC)²® 职业道德准则。CISSP® 考试无疑将重点强调 (ISC)²® 提出的职业道德准则，该准则提出了一组有序的四项准则，分别涉及公众利益、个人行为、提供称职服务以及整个职业群体。\n\
  \n### 自我测试\n\n> **注意**\n>\n> 请参阅自我测试附录，了解所有正确和错误答案的解释。\n\n1.  以下哪项是策略声明的示例？\n\n\
  \    1.  A. 通过加固服务器保护 PII\n    2.  B. 首先安装预加固的操作系统镜像来加固 Windows 11\n    3.  C. 你可以通过选择句子中每个单词的首字母并混合数字和符号来创建强密码\n\
  \    4.  D. 下载 CISecurity Windows 基准并应用它\n\n2.  以下哪项描述了实施安全控制所节省的资金？\n\n    1. \
