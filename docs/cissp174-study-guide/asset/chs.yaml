  \ USB 端口。\n\n**SOX (Sarbanes-Oxley Act of 2002)**  \n2002 年萨班斯-奥克斯利法案，为上市公司创建了监管合规授权。\n\
  \n**SPAN port (Switched Port Analyzer)**  \n交换端口分析器，接收从其他交换端口转发来的流量。\n\n**Spear\
  \ phishing**  \n针对少量高价值受害者的定向网络钓鱼攻击。\n\n**SPI (Security Parameter Index)**  \n安全参数索引，用于标识单工\
