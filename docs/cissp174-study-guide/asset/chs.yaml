  \n\n\n\n\n### 第 8 章：领域 7：安全运营\n\n## 摘要\n\n安全运营确保在资产的整个生命周期中实施适当的安全控制和流程。资产的供给和运行需要安全配置、变更和补丁管理。该领域重点介绍了用于防止或检测成功入侵的技术控制。讨论的预防性控制包括防火墙、沙箱和入侵防御。探讨的检测能力包括入侵检测系统\
  \ (IDS)、安全信息和事件管理 (SIEM) 以及用户和实体行为分析 (UEBA)。正确处理检测到的入侵需要强有力的事件管理实践，这也是该领域的另一个重点。某些事件需要进行更彻底的数字取证调查，该领域重点介绍了相关的流程和工具。安全运营的另一个重要重点涉及应急规划。运营持续性旨在通过高可用系统、廉价磁盘冗余阵列\
  \ (RAID) 和服务级别协议 (SLA) 确保持续可用性。为不可避免的中断做规划涉及战略性的业务连续性规划和战术性的、以系统为中心的灾难恢复规划。关键要素包括执行业务影响分析\
  \ (BIA) 以确定系统的最大可容忍停机时间 (MTD)，从而为恢复策略提供依据。\n\n### 关键词\n\n威胁情报；数字取证；事件管理；灾难恢复；补丁管理；配置管理；最大可容忍停机时间\
  \ (MTD)；业务影响分析 (BIA)\n\n本章考试目标：\n\n*   管理安全\n*   取证\n*   事件管理\n*   运营预防和检测控制\n*\
  \   资产管理\n*   运营持续性\n*   业务连续性规划\n*   灾难恢复规划\n\n## 独特术语和定义\n\n*   **业务连续性计划 (BCP)**——确保业务运营连续性的长期计划\n\
  *   **串通**——两个或多个个人为颠覆系统安全而达成的协议\n*   **运营持续性计划 (COOP)**——在灾难期间维持运营的计划\n*   **灾难**——任何中断正常系统运营的破坏性事件\n\
  *   **灾难恢复计划 (DRP)**——从破坏性事件中恢复的短期计划\n*   **平均故障间隔时间 (MTBF)**——量化新系统或修复后的系统在发生故障前平均能运行多长时间\n\
  *   **平均修复时间 (MTTR)**——描述恢复故障系统需要多长时间\n*   **镜像**——将数据完全复制到另一磁盘，某些 RAID 级别采用此方法\n\
  *   **廉价磁盘冗余阵列 (RAID)**——一种使用多个磁盘驱动器来实现更高数据可靠性、更高速度或两者兼备的方法\n*   **条带化**——将数据写入分散到多个磁盘上以实现性能增益，某些\
  \ RAID 级别采用此方法\n\n## 简介\n\n安全运营关注生产运行环境面临的威胁。威胁主体可以是内部或外部行为体，运营安全必须同时考虑这两种威胁源才能有效。归根结底，运营安全的核心在于人们需要对数据拥有适当的访问权限。这些数据将存在于某些特定介质上，并通过系统进行访问。因此，运营安全关乎人员、数据、介质、硬件，以及生产环境中与这些要素相关的威胁。\n\
  \n灾难恢复规划已成为通用知识体系 (CBK) 的关键组成部分。过去 15 年里，我们的世界经历了许多破坏性事件：恐怖主义、地震、飓风、海啸、洪水和 COVID-19\
  \ 大流行。业务连续性和灾难恢复规划是组织的最后一道防线：当所有其他控制都失效时，BCP/DRP 是可能防止人员伤亡、生命损失或组织倒闭等严重后果的最终控制。作为信息安全专业人员，我们必须保持警惕，保护我们的组织和员工免受这些破坏性事件的侵害。\n\
  \n## 管理安全\n\n所有组织都包含人员、数据以及供人员使用数据的手段。运营安全的一个基本方面是确保控制措施到位，以防止人员无意或故意地危害数据或存放数据的系统和介质的机密性、完整性或可用性。管理安全提供了控制人员对数据的运营访问的手段。\n\
  \n### 管理人员控制\n\n管理人员控制代表了重要的运营安全概念，CISSP® 考生应予以掌握。这些是渗透到多个领域的信息安全基本概念。\n\n#### 最小权限或最小必要访问\n\
  \n信息安全中最重要的概念之一是 `最小权限原则`。最小权限原则规定，人员拥有的访问权限不得超过严格履行其职责所必需的范围。最小权限原则也可称为最小必要访问原则。无论名称如何，遵守这一原则是安全的基本准则，应作为管理安全控制的出发点。\n\
  \n虽然最小权限原则适用于利用强制访问控制 (MAC) 的组织，但该原则的应用在自主访问控制 (DAC) 环境中最为明显。在 DAC 中，最小权限原则表明，当且仅当数据所有者确定存在业务需求，要求用户拥有该访问权限时，才会授予用户数据访问权限。而在\
  \ MAC 中，我们有一个进一步的概念有助于指导最小权限原则：需知。\n\n##### 需知\n\n在利用强制访问控制 (MAC) 处理极其敏感信息的组织中，基本的访问确定由系统强制执行。访问确定基于主体的许可等级和客体的密级。尽管访问高度敏感信息的人员审查过程非常严格，但仅凭许可等级在处理最敏感信息时是不够的。MAC\
  \ 环境中最小权限原则的延伸是分区隔离的概念。\n\n分区隔离是一种强制执行 `需知` 的方法，它超越了单纯依赖许可等级，仅要求某人需要访问该信息即可。通过考虑一个高度敏感的军事行动，可以最好地理解分区隔离：虽然可能有大量人员（其中一些职级很高），但只有部分人员“需知”特定信息。其他人没有“需知”，因此无权访问。\n\
  \n#### 职责分离 (SoD)\n\n虽然最小权限原则是合理运营安全的必要条件，但在许多情况下，它单独作为一项管理控制是不充分的。例如，设想一名员工因培训离开办公室，并提交了一份费用报告，声称需要报销\
  \ 1,000,000 美元。这位员工恰好是作为其日常职责一部分，拥有打印报销支票权限的人员，因此符合最小权限原则来打印她自己的报销支票。她应该能给自己打印一张高达\
  \ 1,000,000 美元的报销支票吗？虽然这种访问权限可能是其工作职能所必需的，因此满足了最小权限原则的要求，但仍需要额外的控制措施。\n\n\n\n\n\
  上述示例旨在阐述下一项管理类安全控制措施——`职责分离` (SoD)。职责分离规定完成关键或敏感交易需要多人参与。职责分离的目标是确保：若有人想要滥用其对敏感数据或交易的访问权限，必须说服另一方共同行动。`串通`\
  \ 是指双方密谋破坏交易安全的行为。职责分离的经典动作电影桥段涉及两把钥匙、一艘核潜艇和一名叛变的舰长。\n\n#### 通过示例学习\n\n###### 职责分离\n\
  \n职责分离是许多组织必须通过惨痛教训才能学会的一课，但许多组织只需学一次。某组织因法规合规要求而设立了一个规模相对较小、初创的安全部门。大多数其他部门对这个新部门颇为敌视，因为它只是将各种被感知的安全职能拼凑在一起，而非深思熟虑地构建而成。最初的意图是让该部门主要在所有安全事务上发挥顾问作用，而不承担变更方面的运营职责。结果导致安全部门运行大量漏洞扫描，并将这些扫描结果移交运维部门解决。运维人员往往忙于处理比补丁安装更紧迫的事务，而缺失补丁带来的威胁在感知上微乎其微。\n\
  \n最终，由于安全部门的不断催促，该部门被赋予了一项毫无好处可言的任务：除最关键系统外的全企业补丁管理。虽然这运作了一段时间，但最终，安全部门的一名员工意识到他的绩效考核取决于他及时修补缺失补丁，除了是安装补丁的人，他还是报告补丁是否缺失的人。当管理层觉得他报告的缺失补丁数量明显少于所有安全部门同事时，便进行了进一步审查。审查确定，尽管该员工确实行为不道德，但这有益地揭示了职责分离的必要性。虽然许多部门未发生如此严重的违规行为，但必须警惕那些既拥有审计能力又对审计对象负有运营责任的人。故事的寓意：Quis\
  \ custodiet ipsos custodes? [\\[1\\]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0010)\
  \ 谁来监视监视者？\n\n#### 职责轮换/岗位轮换\n\n`职责轮换`，也称为岗位轮换或责任轮换，为组织提供了一种手段，以帮助降低任何单个个体拥有过多特权所带来的风险。职责轮换仅要求一个人不得不间断地执行关键职能或职责。职责轮换有助于开始解决多个问题。岗位轮换解决的一个问题是“被公交车撞到”场景：设想一下，组织中的某个关键人物上班途中被公交车撞了（虽说不吉利）。如果失去该个体会造成过大的运营影响，那么缓解这种影响的一种方法或许是确保有额外的备份人员来承担该个体的职责。\n\
  \n职责轮换还能缓解欺诈。随着时间的推移，一些员工可能会对其负责的系统和应用产生一种所有权感和特权感。不幸的是，这种所有权感可能导致员工发现并利用手段欺诈公司，且极难引起怀疑。检测这种欺诈行为的最佳方法之一是要求可能导致欺诈的职责在多人之间频繁轮换。除了增强检测能力外，职责定期轮换这一事实本身也能起到威慑欺诈的作用。\n\
  \n> **考试警示**\n>\n> 虽然岗位或职责轮换是一项重要的控制措施，但这与许多其他控制措施一样，常需与实施成本进行权衡。许多组织会因实施成本而选择不实施职责轮换。考试中，务必理解成本始终是一个考量因素，并可能凌驾于某些控制措施的实施之上。\n\
  \n#### 强制休假/强制度假\n\n一项与职责轮换密切相关的额外运营控制是 `强制休假`，也称为强制度假。虽然要求员工离岗有各种理由，但主要的安全考量与职责轮换所解决的问题相似：减少或发现人员单点故障，以及欺诈的检测与威慑。发现关键技能人员储备不足，有助于组织了解因不可预见情况导致员工无法工作所带来的风险。强制所有员工休假可以识别人员储备深度不足的领域。此外，要求员工在业务仍在运转时离岗，也有助于发现欺诈或可疑行为。如前所述，单是知道强制休假是一种可能性，就可能阻止某些人从事欺诈行为，因为被抓的可能性增加了。\n\
  \n#### 保密协议 (NDA)\n\n`保密协议` (NDA) 是一种与工作相关的合同协议，旨在确保个人或组织在获得敏感信息或数据访问权限前，充分认识到其维护该敏感信息机密性的法律责任。求职者、顾问或承包商通常在受聘前签署保密协议。保密协议主要属于指令性控制。\n\
  \n> **注意**\n>\n> 虽然保密协议现在通常已成为员工入职流程的一部分，但组织内所有部门都充分认识到保密协议的必要性至关重要。这对于各部门普遍聘用外部顾问和承包商的组织尤为重要。\n\
  \n#### 背景调查\n\n`背景调查`（也称为背景审查或入职前筛选）是许多组织常用的额外管理控制措施。大多数背景审查作为入职前筛选流程的一部分进行。一些组织进行简要的背景审查，包括犯罪记录检查。另一些组织进行更深入的检查，如核实工作履历、获取信用报告，有时还要求提交药物筛查结果。\n\
  \n所招职位的敏感度或个人将访问的数据敏感度，在很大程度上决定了对这些信息审查的程度以及调查报告的深度。这些入职前背景调查的公开目的是确保受雇人员未表现出可能表明其不胜任该职位责任的行为。持续的、或入职后的调查旨在确定该个人是否继续值得其职位所要求的信任。入职前进行的背景调查属于预防性控制，而持续的定期背景调查则构成检测性控制，并可能起到威慑作用。\n\
  \n### 特权账户管理\n\n\n\n虽然许多组织值得称赞地减少了拥有高度特权账户访问权限的用户数量，但必然仍需要至少存在一些特权账户。虽然所有用户都可能成为攻击者的目标，但由于其更高的访问权限，特权账户对攻击者而言代表了更高的价值。鉴于其固有的更大访问权限以及对攻击者的更高价值，特权账户需要额外的预防措施和缓解措施。\n\
  \n虽然普遍部署 MFA 是首选，但至少组织应要求对特权账户强制使用 MFA。鉴于其巨大的访问权限，MFA 是必要的。然而，更高特权的账户往往需要远程访问，这进一步将这些账户暴露给攻击者。\n\
  \n除了要求 MFA 之外，特权账户管理的另一种常见做法是为掌握高权限账户的个人提供多个用户账户。除了其特权用户账户外，这些个人还将被提供一个功能较弱的标准用户账户，用于不需要更高特权的日常活动。这些功能较弱的账户也应用于攻击者常滥用的任何使用模式，最著名的是\
  \ Web 浏览和电子邮件。这些活动不需要更高特权，且极常被攻击者滥用。\n\n为限制使用多个账户带来的生产力影响，组织采用允许使用不同凭据而无需完全注销并再次登录的系统。\n\
  \n#### 特权监控\n\n组织的业务需求要求某些个人拥有对关键系统或包含敏感数据的系统的特权访问。这些个人的提升特权需要更严格的审查和更周全的控制，以确保机密性、完整性和可用性保持完好。一些需要更严格审查的工作职能包括：账户创建/修改/删除、系统重启、数据备份、数据恢复、源代码访问、审计日志访问和安全配置能力。\n\
  \n## 取证\n\n数字取证为处理调查和证据提供了一种正式方法，并特别考虑了该过程的法律方面。取证与事件响应密切相关，后者将在本章后面的“事件管理”部分介绍。取证与事件响应的主要区别在于，取证以证据为中心，通常与犯罪和较长时间的调查联系更紧密，而事件响应更专注于识别、遏制和从安全事件中恢复。\n\
  \n取证过程必须保护“犯罪现场”和证据，以防止无意中破坏数据或数据环境的完整性。取证的主要目标是防止对系统的无意修改。历史上，这种对完整性的关注导致调查人员切断系统电源，以保持硬盘驱动器状态的完整性，并防止交互式攻击者或恶意代码在已知调查人员面前改变行为。这种方法持续了很多年，但现在因反取证技术而发生变化。\n\
  \n> **考试警告**\n>\n> 始终确保任何取证行动维护完整性，且合法合乎道德。\n\n反取证使取证调查变得困难或不可能。一种反取证方法是完全驻留在内存中、未安装在磁盘驱动器上的恶意软件。如果调查人员切断运行完全内存驻留恶意软件的系统的电源，包括\
  \ RAM 在内的所有易失性内存都将丢失，证据也将被销毁。由于仅在易失性内存中可用的信息具有调查价值，当前的取证方法倾向于一定程度的*实时取证*，包括获取物理内存的逐位或*二进制镜像*、收集有关运行进程的详细信息以及收集网络连接数据。\n\
  \n### 取证流程\n\n数字取证需要严格且可信的流程。说生命取决于取证调查的结果绝不夸张。取证流程的一般阶段包括：潜在证据的识别；证据的获取；证据的分析；以及报告的生成。\n\
  \n#### 识别\n\n在识别阶段，分析师试图确定与调查相关的系统、介质和数据。已识别的资源将成为获取的目标。虽然通常是一个线性过程，即识别进展到获取，但后续的分析或对范围更好的理解可能需要在调查的后期阶段重新审视识别阶段。\n\
  \n#### 获取\n\n获取代表取证调查的基本第一步。在获取过程中，与取证调查相关的介质和数据以有利于后续取证调查步骤的方式进行收集。获取将利用二进制备份和哈希算法来验证二进制镜像的完整性，我们稍后将讨论这一点。如果可能，原始介质不应用于分析：应使用取证上可靠的二进制备份。\n\
  \n#### 分析\n\n调查工作在分析阶段正式开始。在此阶段，识别工件以帮助从所分析介质的角度理解发生了什么。分析阶段之前可能需要的一个初步步骤是提取。在提取过程中，分析师获取获取阶段的原始取证数据，并以有利于进一步分析的方式进行处理。分析阶段的一个关键组成部分通常需要创建时间线。时间线允许按时间顺序绘制工件，并将成为支撑最终报告的重要文档。\n\
  \n#### 报告/呈现\n\n数字取证调查的最后阶段要求分析师在结构化报告中呈现其发现。通常包括有关相关工件及其在时间线上的表现的细节。通常还会记录所使用的工具和方法。此外，还将记录所获取取证证据的清单。贯穿取证调查的一个共同主题是需要证明该过程以及调查和后续报告所依据的数据的完整性。\n\
  \n#### 保存\n\n虽然保存并非数字取证调查流程中真正的一个独立阶段，但证据和数据保存的重要性值得明确强调。考虑到取证调查的潜在影响，应谨慎行事，以尽可能确保证据、介质和数据的保存。保存始于获取阶段，但也应在取证的所有阶段得到保障。\n\
  \n保存的总体目标是能够证明数据的可信度，从而证明对该数据进行的分析结果的保真度。与保存相关的关键技术涉及使用哈希算法。哈希算法（如 `MD5`、`SHA-1`、`SHA-256`\
  \ 或 `SHA3-256`）通常在获取期间创建，稍后可验证以证明在调查过程中底层数据未发生变化。\n\n### 取证工具\n\n\n\n\n#### 取证工具与分析\n\
  \n随着与调查相关的数据复杂性和数量稳步增加，工具的使用对于取证分析师高效开展分析至关重要。虽然使用任何特定工具可能并非可靠呈现证据的明确要求，但取证工具确实比信息安全领域使用的大多数工具都需要更严格的审查。为此，NIST\
  \ 维护着公开可用的计算机取证工具测试计划，旨在“确保计算机取证工具的可靠性” [\\[2\\]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0015)。\n\
  \n##### 取证工作站\n\n鉴于现代调查相关的数据量巨大，取证调查员使用的系统通常需要配备实质性的高端硬件，至少包括：快速、最新一代的处理器；大容量内存；大容量高速磁盘；独立显卡。**取证工作站**一词常用于指代满足这一需求的高端硬件组件集合。\n\
  \n##### 写保护器\n\n**写保护器**是一种物理上位于计算机和存储设备之间的便携设备，可防止数据被修改。由于存在各种类型的物理介质和相关接口，写保护器的设计旨在适配这些不同的物理连接器。写保护器通过限制对连接物理介质中存储数据的有意和无意修改，协助保全数据。\n\
  \n##### 专用取证镜像硬件\n\n写保护器可协助取证分析师以保全数据的方式获取介质镜像，但它们仍要求分析师将证据连接到其取证工作站、提供目标介质，并运行软件执行镜像获取。**专用取证镜像硬件**通过在独立硬件中提供取证获取所需的硬件和软件，实现了更快、更简便的介质获取。分析师只需连接源介质和目标介质即可。写保护功能内置于镜像硬件中。\n\
  \n##### 移动设备取证\n\n移动设备的爆发式增长自然导致其常与取证调查相关。历史上，取证获取主要关注传统辅助存储介质，如硬盘驱动器，或最近的固态硬盘。移动设备通常不允许分离辅助存储以进行介质获取。通常需要**专用移动设备取证硬件和软件**，仅通过将移动设备连接到获取平台即可执行取证获取。\n\
  \n##### 取证套件\n\n取证调查的软件方面与基于硬件的取证工具同等重要。获取取证镜像后，与调查相关的实质性工作便可开始。**取证套件**旨在促进并提高数据提取、分析和报告过程的效率。虽然非强制要求，但使用标准取证套件或工具有助于证明：只要提供相同的介质，另一位称职的取证分析师也能复现取证分析的结果。\n\
  \n### 取证工件\n\n取证调查的关键在于对显著工件的分析。**取证工件**就是可能包含与调查相关信息的可观察细节。存在许多类型的工件可能与特定安全事件相关。工件的大类包括但不限于与系统、网络和应用程序相关的工件。这些大类及更详细的分类存在的目的，仅在于允许对其潜在获取和分析采取更结构化的方法。例如，移动设备从广义上可归属于系统范畴；然而，这些系统差异显著，往往需与通用桌面或服务器系统显性区分。\n\
  \n与系统相关的工件类别包括：文件、进程、服务、用户、注册表、Shell 组件、日志等。此外，特定工件及其调查方式可能取决于获取的证据来源于非易失性（如硬盘、固态硬盘）还是易失性（内存/RAM）源。\n\
  \n如上所述，移动设备常被从通用计算系统中单独区分。原因之一在于不同的获取流程，以及工件的不同位置和目标。此外，移动设备还常可用于确定特定时间点的地理位置。\n\
  \n面向网络的工件来源包括：全包捕获、基于流的数据、IDS 警报和 DNS 日志。主机名、IP 地址和端口常用于在这些来源中查找相关的网络工件。\n\n###\
  \ 取证介质分析\n\n除了实时取证捕获期间收集的宝贵数据外，取证数据的主要来源通常来自辅助存储和便携式存储设备的二进制镜像，如硬盘驱动器、USB 闪存驱动器、CD、DVD，以及可能相关的手机和\
  \ MP3 播放器。使用二进制或位流镜像的原因是因为需要原始数据的精确副本。普通备份软件仅会归档磁盘活动分区上的已分配数据。普通备份可能会遗漏攻击者故意删除的重要数据；因此，首选二进制镜像。\n\
  \n以下是基于磁盘的取证数据的四种基本类型：\n\n*   **已分配空间**—磁盘分区中标记为活跃包含数据的部分。\n*   **未分配空间**—磁盘分区中不包含活跃数据的部分。这包括从未分配过的部分，以及先前已分配但现标记为未分配的部分。如果文件被删除，存放该已删除文件的磁盘部分会被标记为未分配并可供使用。\n\
  *   **松散空间**—数据以称为簇的特定大小块存储（簇有时也称为扇区或块）。簇是文件系统可分配的最小单位。如果特定文件或文件的最后一部分不需要使用整个簇，则簇内会存在一些额外空间。这种剩余空间称为松散空间：它可能包含旧数据，或被攻击者故意用于隐藏信息。\n\
  *   **“坏”块/簇/扇区**—硬盘因物理缺陷常会产生无法读取的扇区。操作系统会忽略标记为坏的扇区，因为这些缺陷部分无法读取数据。攻击者可故意将扇区或簇标记为坏，以便在此磁盘部分隐藏数据。\n\
  \n考虑到攻击者可能利用的磁盘级技巧来隐藏取证感兴趣的信息，会使用二进制备份工具，而非仅关注已分配空间的传统备份工具。可用于创建此类二进制备份的工具众多，包括免费工具如\
  \ `dd` 和 `dc3dd`，以及商业工具如 AccessData 的 FTK Imager 或 OpenText 的 Tableau Forensic Imager。\n\
  \n#### 实例学习：实时取证\n\n传统上取证调查员会给系统断电，但现在的典型方法是收集易失性数据。获取易失性数据称为**实时取证**，相对于从断电系统获取二进制磁盘镜像的**事后取证**。有一款攻击工具凸显了实时取证的必要性。\n\
  \n\n\n\n\n### Metasploit 框架与 Meterpreter\n\nMetasploit 是一个极其流行的免费开源利用框架。Metasploit\
  \ 框架最重要的成就之一是对攻击的底层组件进行了模块化。这种模块化使得利用开发者能够专注于其核心能力，而无需在分发甚至开发其利用程序的投递、定位和载荷机制上耗费精力；Metasploit\
  \ 提供了可复用的组件以减少额外工作。\n\n载荷是 Metasploit 在成功利用目标后执行的操作；Meterpreter 是最强大的 Metasploit\
  \ 载荷之一。作为 Meterpreter 提供的部分功能示例，图 8.1 展示了受害计算机的密码哈希被导出到攻击者的机器上。这些密码哈希随后可输入密码破解工具，最终推导出关联的明文密码。或者，这些密码哈希可能直接用于\
  \ Metasploit 的 `PsExec` 利用模块，该模块实现了 Microsoft Sysinternals `PsExec` 提供的功能，并经过增强以支持“传递哈希”功能。关于\
  \ Sysinternals `PsExec` 的信息可参阅 <https://docs.microsoft.com/en-us/sysinternals/downloads/psexec>。关于“传递哈希”技术的进一步细节可参阅\
  \ Bashar Ewaida 的优秀白皮书 <https://www.sans.org/white-papers/33283/>。\n\n![图 8.1 使用\
  \ Meterpreter 导出密码哈希](img/f08-01-9780443187346.jpg)\n\n**图 8.1** 使用 Meterpreter\
  \ 导出密码哈希。\n\n除了导出密码哈希，Meterpreter 还提供以下功能：\n\n*   远程系统命令执行\n*   文件上传或下载\n*   屏幕捕获\n\
  *   键盘记录\n*   禁用防火墙\n*   禁用杀毒软件\n*   注册表查看和修改（如图 8.2 所示）\n    ![图 8.2 使用 Meterpreter\
  \ 导出注册表](img/f08-02-9780443187346.jpg)\n    **图 8.2** 使用 Meterpreter 导出注册表。\n* \
  \  权限提升\n*   以及更多：Meterpreter 的功能会定期更新\n\n除了上述功能，Meterpreter 在设计时就考虑了规避检测。Meterpreter\
  \ 几乎可以在不在受害系统上创建新文件的情况下提供上述所有功能。Meterpreter 完全在被利用的受害进程上下文中运行，所有信息均存储在物理内存中而非硬盘上。\n\
  \n设想攻击者已执行上述所有操作，取证调查人员拔掉了受害机器的电源，销毁了易失性内存：调查人员将几乎没有任何信息可供分析。Metasploit 的 Meterpreter\
  \ 或类似高级载荷可能被用于入侵，这使得易失性数据获取成为当前利用时代的必要手段。\n\n### 网络取证\n\n网络取证是对运动中数据的研究，特别关注通过可支持法庭采纳的流程收集证据。这意味着数据的完整性至关重要，收集过程的合法性亦然。网络取证与网络入侵检测密切相关：前者侧重法律，后者侧重运营。SANS\
  \ 学院这样强调网络取证的重要性：“在任何取证调查中，极少不涉及网络组件。终端取证将始终是该职业的关键基础技能，但忽视其网络通信无异于忽视犯罪发生时的安防摄像头录像。无论您处理入侵事件、数据窃取案件、员工滥用场景，还是从事主动对手发现，网络往往能提供事件无与伦比的视角。其证据可提供必要的证明以显示意图、揭露活跃数月甚至更久的攻击者，甚至可能在确凿证明犯罪实际发生方面发挥作用”\
  \ [3]。\n\n### 取证软件分析\n\n取证软件分析侧重于软件的比较或逆向工程：恶意软件逆向工程是最常见的例子之一。调查人员通常会获得恶意程序的二进制副本，并寻求推断其行为。\n\
  \n用于取证软件分析的工具包括反汇编器和软件调试器。虚拟化软件也大有裨益：调查人员可有意用恶意软件样本感染虚拟操作系统，然后密切监控其行为表现。\n\n###\
  \ 嵌入式设备取证\n\n数字取证领域面临的最大挑战之一是消费级电子硬件和嵌入式设备的激增。虽然取证调查人员已有数十年时间理解和开发工具、技术来分析磁盘，但固态硬盘（SSD）等较新技术既缺乏取证理解，也缺乏能够分析的取证工具。\n\
  \nVassilakopoulos Xenofon 在其论文“GPS 取证，一种通过取证就绪获取 GPS 证据的系统方法”中探讨了这一挑战：“数字取证领域长期以来一直以硬盘等传统介质为中心。作为分发中最常见的数字存储设备，它们成为主要证据点显而易见。然而，随着技术将数字存储带入存储容量不断增长的更多设备，取证检查员需要为证据设备类型的变化做好准备。手机、GPS\
  \ 接收器和平板电脑已变得如此普遍，以至于成为当今数字检查的标准。这些小型设备给取证检查员带来了沉重负担，从现场到实验室有不同的处理规则，数据类型也像嫌疑人一样多样。手持设备植根于其自身的操作系统、文件系统、文件格式和通信方法。应对这些会给检查员带来独特问题”\
  \ [4]。\n\n### 电子取证\n\n电子取证，或称 eDiscovery，指法律顾问在民事法律程序的庭前取证阶段获取相关电子信息。取证的总体目的是收集潜在证据以构建案件。电子取证与传统取证的区别仅在于\
  \ eDiscovery 寻求 ESI（电子存储信息），这通常通过取证调查获取。尽管传统取证与 eDiscovery 的差异看似微小，但考虑到组织存储的潜在海量电子数据，eDiscovery\
  \ 在后勤和财务上可能极为繁重。\n\n与 eDiscovery 相关的部分挑战源于组织看似无害的备份策略。虽然计算机信息的长期存储通常被认为是良好的实践，但这些数据可被取证。要具有可取证性（即可供法律取证），ESI\
  \ 无需方便访问或传输。举证责任落在组织身上，组织必须向对方律师提供数据，几乎不考虑组织实际提供 ESI 所产生的成本。\n\n\n\n\n适当的数据保留策略，以及旨在促进电子取证的软件和系统，能在组织被要求为取证提供电子存储信息（ESI）时，极大地减轻其负担。在考虑数据保留策略时，不仅要考虑信息必须保留多长时间（这通常是关注的重点），还要考虑信息需要在多长时间内对组织保持可访问性。根据数据保留策略，对于不再需要的任何数据都应适当清除。因策略而不再维护的数据，必然无法为取证目的所访问。\n\
  \n有关相关法律问题的更多信息，请参阅第 2 章“法律和监管问题”部分，领域 1：安全与风险管理。\n\n## 事件管理\n\n尽管本章提供了许多有助于预防安全事件的运营安全措施，但这些措施只能降低组织经历安全事件的可能性和频率。所有组织都将经历安全事件；对此毫无疑问。鉴于安全事件最终影响组织是必然的，因此迫切需要配备一套严谨且经过测试的方法论，用于识别和响应这些事件。\n\
  \n### 考试警示\n\n考试大纲在提及处理安全事件的过程时，使用了“事件管理”这一短语。请注意，“事件响应”和“事件处理”这两个术语指代同一过程，可与“事件管理”互换使用。\n\
  \n我们将首先定义一些与事件管理相关的基本术语，正如上文所述，事件管理也常被称为事件响应或事件处理。为了确定事件是否已经发生或正在发生，需要审查安全事件。事件是指与系统或网络相关的任何可观察数据。如果事件表明组织的安全态势已被违反或极有可能被违反，则存在安全事件。安全事件的范围可大可小，从基本的策略违规到内部人员窃取数百万信用卡号码。事件管理、事件处理或事件响应是最常用来描述组织如何识别、应对和从安全事件中恢复的术语。最后，`计算机安全事件响应小组`（`CSIRT`）是指负责监控、识别和响应安全事件的团队。事件管理计划的总体目标是使组织能够控制与事件相关的成本和损害，并加快受影响系统的恢复。\n\
  \n### 管理安全事件\n\n管理安全事件可能是一种高压环境。在这种高压时刻，很容易专注于解决手头的问题，而忽视了详细、彻底记录的要求。如果采取的每项行动和收到的每个输出都没有被记录下来，那么事件响应人员的工作速度就太快了，且没有达到法律程序可能要求的记录程度。在调查开始时，很难知道调查最终是否会进入法庭审理。事件响应人员不应需要凭记忆回忆过去发生的事件细节：处理事件时编写的文档应提供所有必要细节。\n\
  \n### 方法论\n\n不同的书籍和组织可能会使用不同的术语和阶段来描述事件管理过程；本节将沿用考试相关的术语。尽管每个组织对事件管理阶段的理解确实略有不同，但执行的通用任务在大多数组织中可能非常相似。\n\
  \n图 8.3 摘自 NIST 特别出版物 800-61r2：《计算机安全事件处理指南》（参见 [`nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-61r2.pdf`](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-61r2.pdf)），该指南用四个步骤概述了事件管理生命周期：\n\
  \n1.  准备\n2.  检测与分析\n3.  遏制、根除与恢复\n4.  事件后活动\n\n![图 8.3 NIST 事件管理生命周期 [5]。](images/B9780443187346000064/f08-03-9780443187346.jpg)\n\
  \n图 8.3 NIST 事件管理生命周期 [[5]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0030)。\n\
  \n许多事件处理方法论将遏制、根除和恢复视为三个不同的步骤，本书也将如此处理。每个步骤有时会使用其他名称；当前考试列出了一个 7 步生命周期，但（奇怪的是）省略了大多数事件处理方法论中的第一步：准备。也许准备是隐含的，就像\
  \ AAA 系统中的识别部分。因此，我们将涵盖八个步骤，并映射到当前考试：\n\n1.  准备\n2.  检测（又称识别）\n3.  响应（又称遏制）\n4.\
  \  缓解（又称根除）\n5.  报告\n6.  恢复\n7.  补救\n8.  经验教训（又称事件后活动、事后分析或报告）\n\n重要的是要记住，最后一步会反馈到第一步，如前所示的图\
  \ 8.3。组织可能在经验教训阶段确定员工接受的培训不足以应对事件。该经验教训随后会应用到持续的准备工作中，从而对员工进行适当培训。\n\n#### 准备\n\n\
  准备阶段包括事件发生前采取的步骤。这些步骤包括培训、编写事件管理策略和程序、提供工具（如安装嗅探软件的笔记本电脑、交叉线、原始操作系统介质和可移动驱动器）。准备工作应包括处理事件所需的任何内容，或能使事件响应更快、更有效的任何内容。准备步骤之一是准备事件处理清单。图\
  \ 8.4 是来自 NIST 特别出版物 800-61r2 的事件处理清单。\n\n![图 8.4 事件处理清单 [5]。](images/B9780443187346000064/f08-04-9780443187346.jpg)\n\
  \n图 8.4 事件处理清单 [[5]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0030)。\n\n####\
  \ 检测\n\n\n\n### 事件管理流程\n\n事件管理流程中最重要的步骤之一是**检测阶段**。检测（也称为识别）是分析事件以确定这些事件是否构成安全事件的阶段。如果没有内置于信息系统中的强大检测能力，组织几乎无法及时有效地响应信息安全事件。组织应建立一套规范化的、最好是自动化的方式，从系统中提取事件并将这些事件置于更广泛的组织背景中。通常，当特定系统上的事件被独立地、脱离上下文地分析时，实际事件很容易被忽视。然而，借助在更大组织背景下查看这些相同系统日志的优势，可能会注意到表明事件发生的模式。该阶段的一个重要方面是：在检测阶段，确定事件是否正在发生或已经发生。潜在事件在进一步审查后被认定为奇怪但无害，这是一种相当常见的情况。\n\
  \n#### 响应\n\n事件管理的**响应阶段**（又称遏制）是事件管理团队开始与受影响系统交互、并试图防止事件造成进一步损害的时刻。响应措施可能包括将系统下线、隔离流量、关闭系统电源，或采取其他措施以控制事件的范围和严重程度。此阶段通常也是对涉及事件的系统进行二进制（逐位）取证备份的阶段。一个重要的趋势是：大多数组织现在会在拔掉系统电源插头之前先捕获易失性数据。\n\
  \n在开始响应阶段前，务必获得管理层许可：系统下线可能对业务产生负面影响，因此业务需求往往与信息安全需求相冲突。最终决定必须来自高级管理层。\n\n响应类似于急救技术人员抵达车祸现场：他们寻求稳定伤员状况（防止病情恶化）；他们不治愈伤员。设想一个蠕虫感染了\
  \ 12 个系统的事件：响应包括遏制，意味着蠕虫停止传播。没有新系统被感染，但现有的感染将持续存在，直到在下一步中被根除。\n\n#### 缓解\n\n**缓解阶段**（又称根除）涉及了解事件原因的过程，以便系统能够被可靠地清理，并最终在恢复阶段恢复运行状态。为了使组织能够可靠地从事件中恢复，必须确定事件的原因。必须知道原因，以便相关系统能够在没有重大持续或再次妥协风险的情况下恢复到已知的良好状态。常见情况是：组织清除影响系统的最明显的恶意软件，并认为这已足够。实际上，明显的恶意软件可能只是症状，而根本原因仍未被发现。\n\
  \n一旦确定了原因和症状，系统将被恢复到良好状态，且不应再易受进一步影响。这通常涉及从头重建系统或从已知的良好备份中恢复。一个关键问题是：已知的良好备份是否真正可信？根因分析在此至关重要：它有助于建立事件时间线，从而支持某个已知良好的备份或镜像的可信度。有助于防止未来影响的根除的另一个方面是加强系统防御。如果事件是由已知漏洞利用引起的，则打补丁是明智之举。然而，改进系统的防火墙配置也可能是抵御相同或类似攻击的一种手段。根除完成后，恢复阶段开始。\n\
  \n#### 报告\n\n事件处理的报告阶段贯穿整个过程，始于检测。一旦检测到恶意活动，报告必须立即开始。报告包含两个主要关注领域：技术报告和非技术报告。事件处理团队在开始事件处理过程时必须报告事件的技术细节，同时保留足够的精力通知管理层严重事件。一个常见的错误是：在专注于事件技术细节的同时，忽略了后者：这是一个错误。包括业务和任务所有者在内的非技术利益相关者必须立即被告知任何严重事件，并在事件处理过程推进时保持更新。\n\
  \n更正式的报告始于恢复阶段之前，届时技术和非技术利益相关者将开始接收事件正式报告（随着事件平息），员工准备恢复受影响系统并将其投入生产。\n\n#### 恢复\n\
  \n**恢复阶段**涉及谨慎地将系统恢复到运行状态。通常，负责该系统的业务单元将决定系统何时重新上线。请记住，要意识到感染、攻击者或其他威胁主体可能已在根除阶段存活下来。因此，系统投入生产后对其进行密切监控是必要的。此外，为了使该系统的安全监控更容易，强烈建议在非高峰生产时段恢复运行。\n\
  \n#### 补救\n\n补救步骤发生在缓解阶段，此时受影响系统中的漏洞得到缓解。补救在该阶段后继续进行，并变得更广泛。例如：如果根因分析确定密码被盗并被重用，局部补救步骤可能包括更改受损密码并将系统重新上线。更广泛的补救步骤可能包括要求访问敏感数据的所有系统使用双因素认证。我们稍后将讨论根因分析。\n\
  \n#### 经验教训\n\n不幸的是，**经验教训阶段**（也称为事后活动、报告或事后分析）是不成熟的事件管理计划中最容易被忽视的阶段。这一事实令人遗憾，因为如果做得正确，经验教训阶段是最有潜力对安全态势产生积极变化的阶段。经验教训阶段的目标是提供一份关于事件的最终报告，并提交给管理层。\n\
  \n该阶段的重要考虑因素包括：详细说明识别本可以更早发生的方式；响应本可以更快或更有效的方式；可能导致事件的组织缺陷；以及潜在的改进领域。虽然在重大安全事件后，安全人员可能获得管理层更多的关注，但现在不是过度利用这一关注的时候。如果基本的操作变更能显著提高组织检测、遏制、根除或从事件中恢复的能力，那么最终报告应详细说明这一事实，无论它是技术措施还是管理措施。\n\
  \n该阶段的反馈直接输入持续准备中，其中经验教训被应用于改进未来事件处理的准备工作。\n\n#### 根因分析\n\n\n\n\n##### 要有效管理安全事件，必须执行根因分析\n\
  \n根因分析旨在确定导致事件发生的潜在弱点或漏洞。如果没有成功的根因分析，受害组织恢复系统的方式可能仍包含导致事件的对手所利用的特定弱点。除了可能恢复带有可利用缺陷的系统外，另一种可能性是从已被攻陷的备份或快照重建系统。\n\
  \n### 运营预防和检测控制\n\n许多预防和检测控制需要更高的运营支持，是日常运营安全的重点。例如：路由器和交换机往往具有相对较低的运营支出（OPEX）。其他控制，如\
  \ NIDS 和 NIPS、防病毒软件和应用程序白名单，具有相对较高的运营支出，是本领域的重点。\n\n#### 防火墙\n\n防火墙过滤网络间的流量。TCP/IP\
  \ 包过滤器和状态检测防火墙基于第 3 层和第 4 层（IP 地址和端口）做决策。代理防火墙也可以基于第 5-7 层做决策。防火墙是多宿主的：它们拥有连接到多个不同网络的多个\
  \ NIC。\n\n##### 包过滤器\n\n`packet filter` 是一种简单快速的防火墙。它没有“状态”概念：每个过滤决策必须基于单个数据包做出。无法参考过去的数据包来做出当前决策。\n\
  \n缺乏状态使得包过滤防火墙安全性较低，特别是对于无会话协议（如 UDP 和 ICMP）。为了通过防火墙允许 ping，必须独立允许 ICMP 回显请求和回显应答：防火墙无法将之前的请求与当前的应答匹配。通常允许所有回显应答，基于的假设是之前必定存在匹配的回显请求。\n\
  \n图 8.5 所示的包过滤防火墙允许出站 ICMP 回显请求和入站 ICMP 回显应答。计算机 1 可以 ping 通 `bank.example.com`。问题在于：位于\
  \ `evil.example.com` 的攻击者可以发送未经请求的回显应答，防火墙将予以允许。\n\n![Fig. 8.5 Packet filter firewall\
  \ design.](img/f08-05-9780443187346.jpg)\n\n图 8.5 包过滤防火墙设计。\n\n基于 UDP 的协议存在类似问题。DNS\
  \ 对小查询使用 UDP 端口 53，因此包过滤器通常允许所有 UDP DNS 应答，假设之前必定存在匹配的请求。\n\n##### 状态检测防火墙\n\n`Stateful\
  \ firewalls` 拥有状态表，允许防火墙将当前数据包与之前的数据包进行比较。状态检测防火墙比包过滤器慢，但安全得多。\n\n在 图 8.6 中，计算机\
  \ 1 向 `bank.example.com` 发送 ICMP 回显请求。防火墙配置为允许 ping 互联网站点，因此状态检测防火墙允许该流量，并在其状态表中添加一条记录。\n\
  \n![Fig. 8.6 Stateful firewall design.](img/f08-06-9780443187346.jpg)\n\n图 8.6 状态检测防火墙设计。\n\
  \n随后在 图 8.6 中，从 `bank.example.com` 向计算机 1 接收到一个回显应答。防火墙检查是否允许该流量（允许），然后检查状态表中是否有反方向的匹配回显请求。防火墙找到匹配条目，将其从状态表中删除，并放行该流量。\n\
  \n接着 `evil.example.com` 发送一个未经请求的 ICMP 回显应答。图 8.6 所示的状态检测防火墙发现没有匹配的状态表条目，从而拒绝该流量。\n\
  \n##### 代理防火墙\n\n`Proxies` 是预防性设备，可以被视为一种类型的防火墙，且历史上一直如此。代理作为中间服务器运行，内联部署在客户端和目标服务器之间。包过滤器和状态检测防火墙要么放行流量要么拒绝流量：它们只是路由途中的另一跳。TCP\
  \ 三次握手发生在客户端和服务器之间，并由包过滤器或状态检测防火墙转发。\n\n然而，代理实际上会**终止**连接，而不仅仅是在流量遍历设备时进行检查。图 8.7\
  \ 展示了计算机 1 到 `bank.example.com` 的 TCP Web 流量通过状态检测防火墙和代理的区别。状态检测防火墙在计算机 1 和 `bank.example.com`\
  \ 之间转发一个 TCP 三次握手。包过滤器也会执行相同操作。\n\n![Fig. 8.7 Stateful inspection vs. proxy.](img/f08-07-9780443187346.jpg)\n\
  \n图 8.7 状态检测 vs. 代理。\n\n多年来存在各种类型的代理和代理防火墙。这些通常根据它们对网络流量可见性的深度进行分类。电路级代理（最常与 SOCKS\
  \ 关联）工作在第 5 层（会话层），而应用级代理工作在第 7 层。\n\n代理实际上终止来自计算机 1 的 TCP 连接，并发起与 `bank.example.com`\
  \ 的 TCP 连接。在这种情况下，有两次握手：计算机 1 → 代理，以及代理 → `bank.example.com`。\n\n像 NAT 一样，代理隐藏连接的来源。在\
  \ 图 8.7 的下半部分，连接到 `bank.example.com` 的源 IP 地址属于防火墙，而非计算机 1。\n\n##### 下一代防火墙 (NGFW)\n\
  \nNGFW（下一代防火墙）工作在第 7 层。与仅基于第 3 层和第 4 层做决策的包过滤器和状态检测防火墙不同，NGFW 除了第 3 层和第 4 层外，还可以基于应用层数据（如\
  \ HTTP 或 DNS 流量）做过滤决策。这一看似简单的区别提供了针对现代威胁极大改进的防护能力。凭借增强的可见性，NGFW 可以结合网络入侵检测系统（NIDS）采用的第\
  \ 7 层过滤和检测方法，以及其预防性对应物网络入侵防御系统（NIPS），后者将在本章后面讨论。\n\n许多 NGFW 提供动态确定所用第 7 层协议的能力，无论通信发生在哪个端口上。此能力可用于识别可能将一种第\
  \ 7 层协议通过该协议不常用的 TCP 端口进行隧道传输的对手流量。设想对手在受感染的内部资产上实例化一个出站 SSH 隧道，通常使用 TCP 端口 22，但通过\
  \ TCP 端口 443 传输。缺乏第 7 层可见性的包过滤器和状态检测防火墙会假定目标 TCP 443 的流量是 HTTPS，因为它们缺乏判断其他情况的可见性。\n\
  \nNGFW 的功能已远远超出防火墙的传统范围，包含传统上在独立产品中才有的安全功能。潜在的扩展功能集，包括 Web 内容过滤、沙箱、反恶意软件、威胁情报和 HTTPS\
  \ 解密等能力，可使组织潜在地降低在单独设备中维护这些功能的总体成本。\n\n##### 端点防火墙\n\n\n\n\n防火墙的主要关注点历来是部署用于保护网络上系统集合的资产。虽然防火墙对于实现网络分段的重要性依然存在，但部署在单个端点上的防火墙提供了实质性的额外收益。在任何防火墙上执行的最基本配置涉及定义与各种网络相关的信任级别。历史上，这意味着信任内部资产并将所有非内部资产视为不受信。不幸的是，对手越来越多地利用横向移动（MITRE\
  \ ATT&CK® 企业矩阵中的 TA0008 [[6]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0035)）降低了将内部等同于受信这一做法的有效性。\n\
  \n值得庆幸的是，端点防火墙为我们提供了一种技术上简单的方法来应对这种过度慷慨的内部信任区。端点防火墙有时被称为桌面防火墙或基于主机的防火墙，作为安装在单个系统上的软件运行。只有安装了端点防火墙的系统需要被隐性信任，这使得在对手从受损内部资产的有利位置发起攻击时，能够获得极大增强的保护和检测能力。\n\
  \n### 基础防火墙设计\n\n防火墙设计多年来不断演进，从简单扁平的设计（如双宿主主机和屏蔽主机）发展到分层设计（如屏蔽子网）。虽然这些术语不再常用，且扁平设计已逐渐淡出使用，但了解基础防火墙设计仍然很重要。这种演进融合了网络纵深防御，从而导致了\
  \ DMZ 和更安全网络的使用。\n\n#### 堡垒主机\n\n`堡垒主机` 是指放置在互联网上且未受其他设备（如防火墙）保护的任何主机。堡垒主机必须自我保护，并经过加固以抵御攻击。堡垒主机通常提供特定服务，所有其他服务都应被禁用。\n\
  \n#### 双宿主主机\n\n`双宿主主机` 拥有两个网络接口：一个连接到受信网络，另一个连接到不受信网络（如互联网）。双宿主主机不进行路由：如 图 8.8\
  \ 所示，希望从互联网访问受信网络的用户，会先登录到双宿主主机，然后从那里访问受信网络。这种设计在 1990 年代现代防火墙出现之前更为常见，有时仍用于访问遗留网络。\n\
  \n![图 8.8 双宿主主机。](img/f08-08-9780443187346.jpg)\n\n图 8.8 双宿主主机。\n\n#### 屏蔽主机架构\n\
  \n`屏蔽主机架构` 是一种较旧的扁平网络设计，使用一台路由器通过访问控制列表 (ACL) 过滤进出 `堡垒主机` 的外部流量。堡垒主机可以访问其他内部资源，但路由器\
  \ ACL 禁止直接的内部/外部连接，如 图 8.9 所示。\n\n![图 8.9 屏蔽主机网络。](img/f08-09-9780443187346.jpg)\n\
  \n图 8.9 屏蔽主机网络。\n\n双宿主主机与屏蔽主机设计的区别在于，屏蔽主机使用屏蔽路由器，该路由器过滤发往其他内部系统的互联网流量。屏蔽主机网络设计不采用网络纵深防御：堡垒主机的故障会使整个受信网络面临风险。屏蔽子网架构应运而生，通过使用\
  \ DMZ 网络实现了网络纵深防御。\n\n#### DMZ 网络与屏蔽子网架构\n\n`DMZ` 是 `非军事区` 网络；该名称基于现实世界的军事 DMZ，如朝鲜和韩国之间的\
  \ DMZ。DMZ 是一个危险的“无人区”：这对军事 DMZ 和网络 DMZ 皆适用。\n\n任何从不受信源（如互联网）接收流量的服务器都面临被攻陷的风险。我们使用纵深防御缓解策略来降低这种风险，包括打补丁、服务器加固和\
  \ NIDS，但总会残留一些风险。\n\n出于这个原因，从不受信网络（如互联网）接收流量的网络服务器应放置在 DMZ 网络上。DMZ 的设计假设任何 DMZ 主机都可能被攻陷：DMZ\
  \ 旨在遏制攻陷，防止其蔓延到内部受信网络。DMZ 上的任何主机都应经过加固。加固应考虑来自不受信网络的攻击，以及来自被攻陷的 DMZ 主机的攻击。\n\n“经典”\
  \ DMZ 使用两个防火墙，如 图 8.10 所示。这称为 `屏蔽子网` 双防火墙设计：两个防火墙屏蔽 DMZ 子网。\n\n![图 8.10 屏蔽子网双防火墙\
  \ DMZ 设计。](img/f08-10-9780443187346.jpg)\n\n图 8.10 屏蔽子网双防火墙 DMZ 设计。\n\n单防火墙 DMZ\
  \ 使用一个防火墙，如 图 8.11 所示。这有时被称为“三足式” DMZ。\n\n![图 8.11 单防火墙 DMZ 设计。](img/f08-11-9780443187346.jpg)\n\
  \n图 8.11 单防火墙 DMZ 设计。\n\n单防火墙设计要求防火墙能够过滤所有接口上的流量：不受信、受信和 DMZ。双防火墙设计更复杂，但被认为更安全。如果因防火墙故障导致攻陷，双防火墙\
  \ DMZ 需要两个防火墙同时故障，受信网络才会暴露。单防火墙设计仅需一次故障。\n\n> **注意**\n>\n> 单独使用“DMZ”一词即暗示双防火墙 DMZ。\n\
  \n### Web 应用防火墙 (WAF)\n\nWeb 应用防火墙 (WAF) 并非仅仅是另一种类型或代的通用网络防火墙，而是一种完全独立且独特的控制措施。顾名思义，WAF\
  \ 的唯一重点是提升组织在 Web 应用方面的安全态势，最常见的是组织自行开发的 Web 应用。WAF 的部署方式使其能够审查发往组织控制的 Web 应用的应用层流量。名称中的“防火墙”清楚地表明\
  \ WAF 通常旨在作为一种预防性控制使用。然而，即使配置为完全不阻断任何内容，它们也能提供实质性的检测收益。\n\n组织最常为面向公众的应用程序部署 WAF，但也可用于增强面向内部的\
  \ Web 应用的安全性。WAF 可以通过多种方式部署，包括云托管、作为部署在托管应用的 Web 服务器前面的反向代理的本地部署，甚至作为运行在托管目标应用的\
  \ Web 服务器上的服务。这些第 7 层控制措施只需内联部署，使 Web 应用流量流经 WAF，以便其能够阻断公然恶意的流量或对可疑活动发出警报。\n\n###\
  \ 沙箱技术\n\n基于签名的恶意内容预防方法存在一个主要的固有弱点；签名从根本上依赖于先验知识来创建。如果您的组织是首个遇到新型漏洞利用或技术的组织，基于签名的方法必然会失效。沙箱技术试图通过专注于识别可疑行为而非主要依赖签名来填补这一空白。\n\
  \n\n\n沙箱技术采用的总体思路是渲染或执行潜在的恶意内容，并分析在一个被充分理解、严格控制、专门用于此目的的牺牲系统上发生的变化。通过测量该虚拟系统上发生的行为和状态变化，沙箱工具可以判断被测文件是恶意、可疑还是良性。虽然沙箱技术既不完美也不充分，但对于与通过基于\
  \ Web 的下载或电子邮件获取的恶意内容相关的客户端利用，沙箱技术证明特别有用。\n\n意图是以内联方式部署恶意软件沙箱，从而阻止被判定为恶意或过度可疑的内容的传递。然而，特别是对于基于\
  \ Web 的内容，沙箱工具行为分析引入的延迟可能会使其无法配置为阻止内容传递。即使在这种情况下，沙箱工具也能快速检测可疑内容，但需要采取自动或手动的纠正措施来响应警报。\n\
  \n### 端点安全\n\n虽然大多数组织早已部署了边界防火墙、入侵检测系统（`IDS`）以及许多其他以网络为中心的预防和检测对策，但纵深防御要求采用额外的保护层。当防火墙、`IDS`、Web\
  \ 内容过滤器等被绕过时，端点可能会被攻破。\n\n由于端点是攻击的目标，端点本身的预防和检测能力提供了超越以网络为中心的安全设备的一层防护。现代端点安全套件通常包含除简单防病毒软件之外的无数产品。这些套件能将安全对策的深度提升到远超网关或网络边界的程度。\n\
  \n虽然纵深防御本身是一个值得称道的目标，但端点安全套件为现代组织提供的显著优势远不止安全深度的增加。即使设备超出了组织的边界，这些工具也能帮助提升设备的安全态势，无论是因为设备物理移动，还是因为用户将内部设备连接到了\
  \ Wi-Fi 或蜂窝网络。端点安全产品提供的另一项优势是，即使通信一直加密到相关端点，它们也能提供预防和检测控制。与端点安全相关的典型挑战在于容量考量：必须管理大量的产品/系统；必须分析并可能保留大量数据。\n\
  \n许多端点产品可被视为整体端点安全套件的一部分。其中最重要的包括防病毒、应用程序白名单、可移动介质控制、磁盘加密、主机入侵防御系统和桌面防火墙。\n\n> **注意**\n\
  >\n> 有关主机入侵检测系统（`HIDS`）和主机入侵防御系统（`HIPS`）的详细信息，请参阅下文的“HIDS 和 HIPS”部分。有关桌面防火墙的详细信息，请参阅上文的“防火墙”部分。\n\
  \n#### 反恶意软件/防病毒\n\n部署最广泛的端点安全产品是反恶意软件，仍普遍称为防病毒软件。许多功能齐全的端点安全套件都是从最初仅提供基于特征码的防病毒产品逐渐演变而来的。防病毒产品常因持续无法阻止恶意软件传播而受到诟病。然而，反对防病毒的大多数论点似乎都在抱怨这些产品单独使用不足以阻止恶意软件。遗憾的是，没有能阻止恶意软件的灵丹妙药，在出现之前，防病毒或反恶意软件产品将继续是必要的，尽管它们并不充分。防病毒是端点安全纵深防御中的一层（众多层之一）。\n\
  \n虽然防病毒供应商通常采用启发式或统计方法进行恶意软件检测，但检测恶意软件的主要手段仍然是基于特征码的。基于特征码的方法要求防病毒供应商拥有恶意软件样本以创建特征码。这是应用程序黑名单的一个例子，现在有时称为阻止列表（请参阅下文的“应用程序白名单/应用程序控制”部分）。对于快速变异的恶意软件或以前未遇到过的恶意软件，基于特征码的检测成功率要低得多。\n\
  \n#### 应用程序白名单/应用程序控制\n\n应用程序白名单，也称为应用程序控制，是端点安全套件中较新增的功能。应用程序白名单的主要重点是预先确定哪些二进制文件被认为可以在给定系统上安全执行。一旦建立了这个基线，任何不在已知良性二进制文件列表中、试图运行的二进制文件都将被阻止执行。这种方法的一个弱点是，当攻击者利用“已知良性”二进制文件并将其用于恶意目的时。\n\
  \n白名单技术包括允许运行以下二进制文件：\n\n*   通过受信任的代码签名数字证书签名的\n*   与已知良性的加密哈希匹配的\n*   具有受信任的完整路径和名称的\n\
  \n最后一种方法最弱：攻击者可以用恶意版本替换受信任的二进制文件。\n\n应用程序白名单优于应用程序黑名单（后者禁止已知的恶意二进制文件）。\n\n#### 可移动介质控制\n\
  \n另一个进入大型套件的较新端点安全产品协助进行可移动介质控制。对更好地控制可移动介质的需求在两个方面尤为强烈。首先，将感染恶意软件的可移动介质插入组织计算机，一直是攻破原本相当安全的组织的一种方法。其次，指甲盖大小的介质能容纳惊人的存储量，并被用于秘密窃取敏感数据。\n\
  \n恶意软件传播的常见载体是许多较新版 Microsoft 操作系统的 `Autorun`（自动运行）功能。如果将格式正确的可移动驱动器插入支持 `Autorun`\
  \ 的 Microsoft Windows 操作系统，介质根目录下 `Autorun.inf` 文件引用的任何程序都将自动执行。许多形式的恶意软件会向所有驱动器的根目录写入恶意的\
  \ `Autorun.inf` 文件，试图在驱动器被移除并连接到另一个系统时病毒式传播。\n\n最佳实践是在 Microsoft 操作系统上禁用 `Autorun`。请参阅\
  \ Microsoft 文章“如何在 Windows 中禁用 Autorun 功能”（[`support.microsoft.com/kb/967715`](https://support.microsoft.com/kb/967715)）以获取禁用\
  \ `Autorun` 的信息。\n\n主要由于这些问题，组织被迫对可连接到设备的可移动介质类型实施更严格的控制。可移动介质控制产品是与禁止未经授权使用可移动介质的策略授权等管理控制相匹配的技术控制。\n\
  \n#### 磁盘加密\n\n另一个越来越常见的端点安全产品是磁盘加密软件。组织通常强制要求使用全盘加密产品，以防止落入未经授权之手的硬盘上的敏感数据泄露，尤其是移动设备，因为它们面临更高的被盗风险。\n\
  \n\n\n\n##### 全盘加密 (FDE)\n\n全盘加密 (FDE)，也称为整盘加密，可加密整个磁盘。这优于部分加密解决方案，例如加密卷、目录、文件夹或文件。后一种方法的问题在于存在将敏感数据留在磁盘未加密区域的风险。例如，将文件从未加密目录拖放到加密目录可能会留下作为未分配数据的未加密数据。\n\
  \n### 持续监控\n\n威胁、漏洞和资产形势在不断变化。组织历来最关注季度扫描、年度审计，甚至临时审查期间的安全性。虽然定期检查很有价值，但对手的 24×7\
  \ 特性始终存在。持续监控的一个目标是迁移到内联模式。从架构上讲，主动响应 NIPS 类似于 图 8.12 中的 NIDS；区别在于监控接口是读/写的。主动响应\
  \ NIPS 可通过多种方法“拦截”恶意流量，包括向源、目的（或两者）伪造 TCP RST 段，或向源发送 ICMP 端口、主机或网络不可达消息。\n\nSnort\
  \ 是一款流行的开源 NIDS 和 NIPS（参见 [www.snort.org](http://www.snort.org)），具有以下主动响应规则：\n\n\
  - `reset_dest`：向目的发送 TCP RST\n- `reset_source`：向源发送 TCP RST\n- `reset_both`：向源和目的均发送\
  \ TCP RST\n- `icmp_net`：向源发送 ICMP 网络不可达\n- `icmp_host`：向源发送 ICMP 主机不可达\n- `icmp_port`：向源发送\
  \ ICMP 端口不可达\n- `icmp_all`：向源发送 ICMP 网络、主机和端口不可达\n\n内联 NIPS 处于流量“内联”位置，通过放行或允许流量发挥第\
  \ 3-7 层防火墙的作用，如 图 8.13 所示。\n\n![图 8.13 内联 NIPS 架构。](img/f08-13-9780443187346.jpg)\n\
  \n\n\n\n### 内联 NIPS 架构\n\n图 8.13 内联 NIPS 架构。\n\n请注意，NIPS 除了防火墙之外还提供纵深防御保护；它通常不用作替代品。此外，NIPS\
  \ 的误报比 NIDS 的误报破坏性更大：合法流量会被拒绝，这可能导致生产问题。与 NIDS 相比，NIPS 通常拥有较少的规则集。因此，NIPS 中仅使用最可信的规则。NIPS\
  \ 不是 NIDS 的替代品；许多网络同时使用 NIDS 和 NIPS。\n\n#### HIDS 和 HIPS\n\n基于主机的入侵检测系统（HIDS）和基于主机的入侵防御系统（HIPS）是\
  \ NIDS 和 NIPS 的基于主机的对应物。它们处理主机内部的信息。它们可能会在网络流量进入主机时进行处理，但考试的重点通常在于文件和进程。\n\n一个著名的\
  \ HIDS 是开源 Tripwire®，在该公司扩展其商业产品之前，它仅被称为 Tripwire（参见 [`github.com/Tripwire/tripwire-open-source`](https://github.com/Tripwire/tripwire-open-source)）。开源\
  \ Tripwire® 通过检测关键操作系统文件的变更来保护系统完整性。变更通过多种方法进行检测，包括加密哈希的比较。\n\n#### 模式匹配\n\n模式匹配\
  \ IDS 通过将事件与静态特征码进行比较来工作。关于前面提到的 Log4Shell 漏洞，Crowdstrike 指出：“可以通过检查日志文件中是否存在特征\
  \ URL 模式 `${jndi:ldap://` 来检测利用尝试” [\\[7\\]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0040)。基于该信息，可以使用以下模式来检测此类尝试性的\
  \ Log4Shell Log4j2 利用。如果字符串 `${jndi:ldap://` 出现在发往组织 Web 服务器的流量中：警报。\n\n模式匹配非常适合检测已知攻击，但通常在面对新攻击时表现不佳。\n\
  \n#### 协议行为\n\n协议行为 IDS 对协议应有的工作方式建模，通常通过分析 RFC（征求意见稿）来实现。RFC 793（TCP，参见 [`datatracker.ietf.org/doc/html/rfc793`](https://datatracker.ietf.org/doc/html/rfc793)）描述了\
  \ TCP 标志。SYN 表示同步，FIN 表示结束。一个标志用于创建连接，另一个用于终止连接。\n\n基于对 RFC 793 的分析，生成的协议行为规则可以是“如果单个数据包中同时设置了\
  \ SYN/FIN 标志：警报。”根据 RFC，单个段尝试同时开始和结束连接是讲不通的。\n\n攻击者会构造此类“损坏”的段，因此协议行为确实能检测到恶意流量。问题在于汉隆剃刀，这是一条格言，内容为：“永远不要将恶意归因于那些用愚蠢即可充分解释的事物”\
  \ [\\[8\\]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0045)。协议行为还会检测“愚蠢的”（损坏的）流量：由未阅读或遵循\
  \ RFC 的开发人员设计的应用程序产生的流量。这相当常见：应用程序“能用”（流量流动），但违背了 RFC 的初衷。\n\n> **注意**\n>\n> 所有信息安全专业人员都应理解汉隆剃刀。我们的世界充满了恶意：蠕虫、网络钓鱼攻击、身份盗窃等。但愚蠢和破坏更多：大多数灾难都是由用户错误引起的。\n\
  \n#### 异常检测\n\n异常检测 IDS 通过建立正常流量的基线来工作。异常检测 IDS 随后忽略该流量，报告不符合基线的流量。\n\n与模式匹配不同，异常检测可以检测新攻击。挑战在于建立“正常”的基线：这在小型可预测的网络上通常很简单，但在大型复杂的网络上可能非常困难（甚至不可能）。\n\
  \n### 出站监控\n\n历史上，对入侵和对手活动的检测主要专注于进入我们更受信任的内部网络的攻击流量；入侵检测系统（IDS）天然契合这一范式。出站监控采取相反的方法，专注于通过监视离开我们网络的内容来进行检测。许多利用后活动，包括命令与控制（C2）和数据渗漏，自然必然会导致可能通过监控流出我们网络的流量来辨别的流量模式。利用出站监控成功检测对手的一个经典示例是，通过观察源自预期内部邮件服务器以外的系统且目标为\
  \ TCP 25 端口的流量，识别出发送垃圾邮件的受感染主机。\n\n### 安全信息和事件管理\n\n入侵检测系统（IDS）长期以来一直是组织使用的主要技术侦查控制手段。尽管\
  \ IDS 的重要性并未减弱，但组织现在认识到，除了 IDS 之外，更多数据源可以提供有价值的信息。这些不同的信息源可以提供各自有价值的数据；组织越来越看重能够更高效地关联来自多个来源的数据。\n\
  \n安全信息和事件管理（SIEM）是用于简化跨不同来源数据关联的主要工具。关联安全相关数据是 SIEM 提供的主要效用。数据关联的目标是更好地理解背景，从而因跨各种安全平台记录的活动而更深入地了解组织内部的风险。虽然\
  \ SIEM 通常带有一些内置警报，用于查找特定的关联数据，但可以创建自定义关联规则以增强内置功能。\n\n要想通过数据关联成功获取情报，必然意味着能够访问多个数据源。虽然\
  \ SIEM 的威胁检测用例可能是可行的，但关联所需的数据收集量可能巨大。由于大多数 SIEM 中整合的数据量很大，因此 SIEM 通常还有与更轻松或更好地证明合规性相关的用例。\n\
  \n### 用户和实体行为分析（UEBA）\n\n入侵合法最终用户系统和账户是对手的常见目标。即使是权限最小的用户账户，拥有的访问权限也比外部对手大得多。虽然对手在必要时会利用漏洞，但几乎每次入侵的一个共同主题都是对手滥用合法用户。尽管检测漏洞利用似乎相当困难，但从历史上看，这一挑战与检测对手利用合法用户账户攻击我们自己的信息系统相比，简直相形见绌。用户和实体行为分析（UEBA）专门致力于解决识别来自我们“受信任”用户或系统的可疑活动这一问题。\n\
  \nUEBA 试图辨别组织内用户和系统的正常行为配置文件，然后主动提醒我们偏离预期行为模式的可疑偏差。虽然概念简单，但多年来这种行为分析方法已被证明是一个艰巨的挑战。然而，随着对面向最终用户系统的可见性水平提高，以及数据科学和机器学习在安全领域的应用，这些系统已有了巨大改进。\n\
  \n### 基于机器学习和人工智能（AI）的工具\n\n\n\n\n#### 人工智能与机器学习在安全领域的应用\n\n人工智能试图赋予软件和系统以某种方式运作的能力，这种能力过去被认为仅属于人类智能。学习构成了智能的特征之一，过去被认为仅为人类智能所拥有，且长期以来一直是人工智能领域的研究重点。“机器学习是研究计算机算法的学科，这些算法能通过经验自动改进”\
  \ [[9]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0050)。机器学习算法需要海量的训练数据，由算法处理这些数据，目标是能够像人类智能一样成功辨别信息。AI\
  \ 和 ML 在信息安全领域有许多潜在应用。一个基本目标是利用这些工具的能力来区分恶意活动与良性活动。监控导向的应用，如用户与实体行为分析（UEBA）、安全信息与事件管理（SIEM）以及通用入侵检测，似乎特别适合从人工智能和机器学习中受益。\n\
  \n### 第三方提供的安全服务\n\n利用本组织以外的资源在安全领域已变得司空见惯。鉴于安全的重要性、不断变化的本质及其范围，对第三方提供商的依赖也就不足为奇了。对第三方的控制程度、工作范围和期望差异巨大。几乎每个组织都会使用外部提供商开发的硬件和软件，但越来越多的组织也雇佣第三方提供持续的安全服务。虽然“托管安全服务提供商”（MSSP）一词并不涵盖市场上所有多样化的第三方安全服务产品，但它是一个常见服务的典型例子。\n\
  \n尽管理由、基本原理和功能可能差异很大，但雇佣 MSSP 的基本理念是通过利用第三方的员工和运营成熟度来增强组织的安全运营。寻找安全专业人员填补空缺职位长期以来一直颇具挑战。然而，即使是自认为人员配备充足的组织，往往也难以跟上有效安全运营所需的节奏和运营工作量。许多组织将\
  \ MSSP 视为一种安全人员增补或安全运营力量倍增器的形式。虽然 MSSP 并非专门用于此目的，但组织寻求 MSSP 外部协助的一个极其常见的功能，是提供强大的\
  \ 24 × 7 × 365 全天候检测和响应能力。\n\n### 蜜罐\n\n`honeypot`（蜜罐）是一种旨在吸引攻击者的系统。这使得信息安全研究人员和网络防御者能够更好地分析基于网络的攻击。蜜罐除研究外无任何生产价值。\n\
  \n内部蜜罐可为内部恶意软件或攻击者提供高价值预警。虽然面向互联网的蜜罐会频繁被攻陷，但内部蜜罐绝不应被攻陷。如果发生这种情况，通常意味着其他预防和检测控制措施（如防火墙和\
  \ IDS）已失效。\n\n低交互蜜罐模拟系统（或系统的部分功能），通常通过脚本网络动作实现（例如通过显示横幅来模拟网络服务）。高交互蜜罐运行实际的操作系统，既可以在硬件上运行，也可以通过虚拟化运行。\n\
  \n在部署蜜罐前请咨询法务人员。蜜罐带来法律和实际风险：如果攻击者攻陷了蜜罐，并成功进一步渗透到生产网络，会怎样？攻击者会不会辩称他们被“邀请”进入蜜罐，进而延伸至生产网络？如果攻击者渗透蜜罐后，成功将其作为基地攻击第三方，会怎样？这些风险应在部署蜜罐前予以考虑。\n\
  \n### 蜜网\n\n`honeynet`（蜜网）是一个由蜜罐组成的（真实或模拟的）网络。传统蜜罐侧重于提供经过检测的诱饵服务或单个系统。蜜网涉及一个完整的系统和服务网络，其中不包含任何合法设备。与标准蜜罐的意图一样，蜜网的目标是让组织能够发现对手活动。蜜网可以包含\
  \ `honeywall`（蜜网防火墙），旨在限制蜜网被用于攻击其他系统的可能性。\n\n## 资产管理\n\n全面的运营信息安全方法要求组织不仅关注系统，还要关注人员、数据和介质。系统安全是运营安全的另一个关键组成部分，在系统的整个生命周期中，有特定的控制措施可以极大地提升系统安全性。\n\
  \n### 配置管理\n\n任何系统安全工作中最重要的组成部分之一，是开发一致的系统安全配置，以便在整个组织中推广应用。目标是超越默认系统配置，达到既经过加固又满足组织运营需求的状态。保护环境免受未来零日攻击（针对无补丁或修复程序的漏洞的攻击）的最佳方法之一，是拥有一个仅提供组织严格所需功能的加固系统。\n\
  \n开发面向安全的基线配置是一个耗时的过程，因为涉及大量的研究和测试。然而，一旦采用了组织安全基线，拥有一个已知的、加固的、一致的配置将在很长一段时间内极大地提高系统安全性。此外，组织无需从头开始开发安全基线，因为不同实体提供了基线安全指导。这些预定义的基线安全配置可能来自设备或软件的供应商、政府机构，或非营利组织互联网安全中心（参见\
  \ <https://www.cisecurity.org/>）。与系统安全相关的基本 `configuration management`（配置管理）实践将涉及以下任务：禁用不必要的服务、移除多余的程序、启用防火墙、防病毒、入侵检测或防护系统等安全功能，以及配置安全和审计日志。\n\
  \n#### 基线化\n\n\n\n\n##### 标准化安全配置\n\n标准化安全配置当然很重要，但关于安全基线还有一个额外的考量因素。安全`基线化`是捕获某一时间点当前系统安全配置理解的过程。建立一种简便的方法来捕获当前系统安全配置，对于响应潜在安全事件极有帮助。假设相关系统或设备是基于标准化安全基线构建的，且严格遵守了强有力的变更控制措施，那么几乎就没有必要捕获当前安全配置了。然而，在现实世界中，即使在控制最严格的环境里，未经授权的变更也会发生，这使得随时间监控系统的安全配置成为必要。此外，即使是遵循变更管理程序的授权系统修改，也需要被理解并能轻松捕获。强调持续基线化的另一个原因是，可能存在最初并未按初始安全基线构建的系统。组织在系统安全方面的一个常见错误是：专注于建立强大的系统安全配置，却未能快速、轻松地掌握系统安全配置随时间发生的变化。\n\
  \n### 自动化\n\n安全配置管理旨在确保硬件和软件的组织基线代表组织认为可接受的、经过审查的安全配置。历史上，安全配置管理的主要关注点在于资产的供应或部署阶段。或许也会采用定期（如每年一次）与初始基线进行比较。不幸的是，除非以极高的警惕性进行锁定和控制，否则在供应和重新评估之间，资产上会发生许多变化，且必然会发生。自动化重新评估可以缩短检测安全相关配置变更的时间。更好的做法是利用自动化主动解决任何偏离已批准配置基线的情况。\n\
  \n### 补丁管理\n\n维护强大的系统安全配置相关的最基本但仍相当困难的任务之一是`补丁管理`，即管理软件更新的过程。要从根本上改善组织的安全态势，最重要的单一途径莫过于改进其补丁管理实践。所有软件在发布前都存在未完全解决的缺陷或不足。修复软件的常见方法是应用补丁以解决已知问题。并非所有补丁都关乎安全；许多补丁涉及简单的非安全相关错误修复。然而，安全补丁确实占据了整个补丁生态系统的很大一部分。\n\
  \n软件供应商会公开并直接向客户宣布补丁。一旦收到补丁通知，组织需要从风险管理的角度评估该补丁，以确定部署的紧迫程度。绝大多数入侵事件都涉及利用那些已有补丁却未及时部署的漏洞。何为“及时”很难界定，应由组织的风险管理实践来决定。美国网络安全和基础设施安全局（CISA）维护着已知被利用漏洞目录，这可以作为输入，为向关键系统快速部署补丁提供更有力的理由\
  \ [[10]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0055)。尽管可能感到部署补丁的紧迫性，但通常仍需要测试以确定补丁安装是否可能导致不良后果。从时间线来看，测试通常与风险评估同时进行。假设不良影响不需要补救，安装是补丁管理过程的最后阶段。\n\
  \n虽然从单一供应商处在单个系统上安装单个补丁的过程看似不那么繁重，但管理来自数十家供应商、跨越数千个系统的安全补丁的识别、测试和安装，可能会变得极其繁琐。此外，不同供应商对补丁安装的集中部署或自动化程度差异很大。随着攻击者的利用尝试越来越多地集中在浏览器（及其相关插件、扩展和框架）、办公套件和\
  \ PDF 阅读器等客户端应用程序上，补丁管理的格局正迅速变得更加复杂。\n\n#### 补丁测试与部署\n\n虽然大家都理解打补丁的重要性，但补丁安装所需的停机时间，以及补丁问题偶尔导致的服务中断，都可能阻碍补丁的部署。维护窗口需求令人沮丧，但最终证明了为例行维护进行需求规划，以及建立例外流程以在有明确需求时允许紧急补丁窗口的合理性。为应对补丁本身导致服务中断的挑战，常见的前进方式是再次为这种可能性做计划，以便快速检测补丁问题并恢复到未打补丁的状态。理想情况下，补丁问题会在非关键系统上被发现，从而在关键系统受影响前停止补丁部署。\n\
  \n补丁测试有助于识别这些问题，但补丁的频率和数量会使得稳健且切合实际的补丁测试变得极其困难。一种常见的折中方案是采用分阶段补丁部署。采用这种方法，定义系统组在不同时间框架接收补丁部署，使得一组具有代表性且非关键的系统首先接收补丁，只有当每个分阶段的系统组都实现无问题安装时，补丁部署才会更广泛地继续进行。\n\
  \n### 漏洞管理\n\n安全补丁通常旨在消除已知漏洞。组织不断为桌面、服务器、网络设备、电话设备和其他信息系统打补丁。组织完全修补所有系统的可能性很低。虽然未修补的系统可能是已知的，但拥有补丁失败的系统也很常见。补丁失败最常见的原因是部署了需要重启的补丁后，未能重启。\n\
  \n发现需要未知补丁的系统也很常见。`漏洞扫描`是发现环境中不良配置和缺失补丁的一种方式。虽然这似乎显而易见，但仍值得一提：漏洞扫描设备只能发现已知漏洞的存在。虽然发现缺失补丁是漏洞扫描设备或软件提供的最重要功能，但有些设备也能发现与不良配置相关的漏洞。\n\
  \n使用`漏洞管理`一词而非仅用漏洞扫描，是为了强调对漏洞信息进行管理的必要性。许多组织最初在漏洞扫描上略显过度热心，想要持续枚举企业内的所有漏洞。如果没有一个流程来处理这些漏洞的优先级排定和修复，仅仅列出数千个漏洞的价值是有限的。漏洞的修复或缓解应根据对组织的风险和修复程序的难易程度进行优先级排定。\n\
  \n#### 零日漏洞与零日漏洞利用\n\n\n\n\n组织旨在攻击者利用漏洞之前修补漏洞。随着补丁的发布，攻击者开始尝试对已知的已修补漏洞进行逆向工程以开发利用代码。这种针对已修补漏洞开发利用代码的过程已经持续了一段时间，但正在发生变化的是利用代码开发的典型时间。补丁发布与相关利用代码公开之间的平均时间窗口正在缩短。研究表明，对于某些漏洞，仅凭未修补和已修补程序的可用性，就可以在几分钟内创建利用代码[[11]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0060)。\n\
  \n除了攻击者通过逆向工程安全补丁来开发利用代码外，攻击者还可能在供应商开发出补丁之前，或在内部或外部安全研究人员将漏洞告知供应商之前发现漏洞。在补丁存在之前漏洞已被知晓的情况称为“零日漏洞”。`Zero-day\
  \ vulnerabilities`（零日漏洞），也常写作 0-day，变得越来越重要，因为攻击者在发现方面变得更加熟练，更重要的是，零日漏洞的发现和披露正在被商业化。`Zero-day\
  \ exploit`（零日利用代码）而非漏洞，指的是针对尚未修补的漏洞已存在利用代码。\n\n#### 变更管理\n\n如前所述，需要进行系统、网络和应用程序变更。一个不变更的系统会随着时间的推移变得不那么安全，因为安全更新和补丁未被应用。为了维护一致且已知的运营安全，需要遵循严格的`change\
  \ management`（变更管理）或变更控制流程。变更控制流程的目的是理解、沟通和记录任何变更，主要目标是能够理解、控制并避免变更可能带来的直接或间接负面影响。整体变更管理流程包含多个阶段，具体实施在各组织间会有所不同。通常设有变更控制委员会（`change\
  \ control board`）来监督和协调变更控制流程。变更控制委员会不仅应包含信息技术团队成员，还应包含业务部门成员。\n\n拟议变更必须首先提交给变更控制委员会。变更控制委员会随后收集并记录关于变更的充分细节，以尝试理解其影响。提议变更的个人或团体应尝试提供因变更可能导致的潜在负面影响信息，以及不实施变更可能导致的负面影响信息。最终，是否实施变更及实施的时效性，将由风险和成本管理原则驱动。因此，与实施或延迟变更相关的组织风险细节必须提请变更控制委员会注意。另一个基于风险的考量是变更能否在不可预见的影响大于预期时轻松逆转。许多组织要求制定回滚计划，有时也称为退出计划（`backout\
  \ plan`）。该计划旨在详细说明在必要时逆转变更的程序。\n\n如果变更控制委员会认定变更合理，则将商定测试和实施变更的时间表。时间表应考虑影响组织及其资源的其他变更和项目。与变更实施时间表相关的是通知流程，该流程告知所有受变更影响的部门。变更管理流程的下一阶段将涉及变更的测试和后续实施。实施后，应向变更控制委员会提供报告，详细说明实施情况，以及变更是否按计划成功实施。\n\
  \n变更管理不是一门精确的科学，规定的方法也并非完美适用于所有组织或所有变更。除了每个组织对变更管理流程有略微不同的理解外，也可能存在因变更比典型变更更重大或更轻微而偏离组织常规的特定变更。例如，管理与小型补丁相关的变更可能与管理主要服务包（`service\
  \ pack`）安装的方式截然不同。由于变更管理流程的多变性，本节未提供具体的命名阶段。然而，变更管理流程的总体流向包括：\n\n*   识别变更\n*   提议变更\n\
  *   评估与变更相关的风险\n*   测试变更\n*   计划变更时间表\n*   通知受影响方变更\n*   实施变更\n*   报告变更实施结果\n\n\
  所有变更必须被严格跟踪且可审计。应保留详细的变更记录。某些变更可能导致系统不稳定或引发其他问题；变更管理审计允许运维人员在发生故障或问题时调查近期变更。审计记录还允许审计员验证变更管理策略和程序是否已被遵循。\n\
  \n## 运营持续性\n\n我们将在本章后面的“业务连续性规划”和“灾难恢复规划”节中讨论一些持续性概念。本节将侧重于与持续性相关的更明显的运营问题。毋庸置疑，运营持续性主要关注机密性、完整性和可用性三要素中的可用性部分。\n\
  \n### 服务级别协议（SLA）\n\n随着组织越来越多地利用服务提供商和托管解决方案，运营持续性考量在合同谈判中变得至关重要，即`service level\
  \ agreements`（服务级别协议，SLA）。服务级别协议已经重要了一段时间，但随着组织越来越多地选择让外部实体执行关键服务或托管重要资产和应用程序，其重要性日益凸显。服务级别协议的目标是规定关于负责提供服务的部门或组织的行为及服务质量的所有预期。服务级别协议通常规定带宽、交付时间和响应时间等方面的可接受标准。\n\
  \n虽然可用性通常是服务级别协议中最关键的安全考量，但随着其他安全方面通过更好的指标变得更易量化，对它们的考量将增加。此外，随着组织越来越多地利用托管服务提供商提供除商品化连接以外的服务，安全重视程度将提高。关于服务级别协议，一个重要的认识是：组织在与服务提供商合作前，至关重要的是要协商服务级别协议的所有安全条款。通常，如果组织希望服务提供商在事后同意服务级别协议的特定条款，则组织将需要为该服务支付额外溢价。\n\
  \n> **注意**\n\n\n\n托管日益关键的信息和服务的服务提供商趋势最明显的例子是云计算日益普及。云计算允许组织有效地从服务提供商租用计算速度、存储和带宽，以托管其部分基础设施。这些解决方案的安全性和服务质量构成了服务产品及其相关成本之间极其重要的区别点。\n\
  \n### 故障容错\n\n为了使组织内的系统和解决方案能够持续提供运营可用性，必须在设计时考虑故障容错。可用性不仅关注系统正常运行时间要求，还要求数据能够及时访问。本节将同时涉及系统和数据的故障容错。\n\
  \n#### 备份\n\n增加系统或数据故障容错最基本、最明显的措施是提供故障发生时的可恢复性。给定足够长的时间范围，如图 8.14 所示，事故终将发生。为了使数据在故障时能够恢复，必须提供某种形式的备份或冗余。尽管磁带介质是一项相当古老的技术，但它仍然是备份数据最常用的存储库。三种基本的备份类型是：`full\
  \ backup`（完全备份）、`incremental backup`（增量备份）和 `differential backup`（差异备份）。\n\n![图\
  \ 8.14 为什么需要备份？来源：https://commons.wikimedia.org/wiki/File:Backup_Backup_Backup_-_And_Test_Restores.jpg。摄影：John\
  \ Boston。图片依据 Creative Commons Attribution 2.0 License 使用。](img/f08-14-9780443187346.jpg)\n\
  \n图 8.14 为什么需要备份？来源：[`commons.wikimedia.org/wiki/File:Backup_Backup_Backup_-_And_Test_Restores.jpg`](https://commons.wikimedia.org/wiki/File:Backup_Backup_Backup_-_And_Test_Restores.jpg)。摄影：John\
  \ Boston。图片依据 Creative Commons Attribution 2.0 License 使用。\n\n##### 完全备份\n\n`full\
  \ backup` 是备份类型中最容易理解的；它只是硬盘上所有已分配数据的副本。完全备份包含硬盘上所有已分配的数据，这使得从恢复角度来看，在发生故障时它们非常简单。虽然完全备份所需的恢复时间和介质比采用其他方法的方法少，但存放完全备份所需的介质量更大。仅使用完全备份的另一个缺点是执行备份本身所需的时间。完成备份所需的时间必须在备份窗口内，备份窗口是指备份被认为在操作上可接受的计划时间段。由于所需介质量较大（因此介质成本较高）以及备份窗口要求较长，完全备份通常与增量或差异备份结合使用，以平衡时间和介质方面的考虑。\n\
  \n##### 增量备份\n\n不完全依赖 `full backup` 的一种替代方案是利用 `incremental backup`。`incremental\
  \ backup` 仅归档自上次执行任何类型的备份以来已更改的文件。由于备份的文件较少，执行增量备份的时间大大减少。为了了解恢复的磁带需求，请考虑一个使用磁带的示例备份计划：周日晚进行每周完全备份，每日进行增量备份。\n\
  \n每周日执行一次完全备份。对于周一的增量备份，仅标记自周日备份以来已更改的文件进行备份。周二标记自周一增量备份以来已更改的文件进行备份。周三、周四、周五和周六将仅执行自上次增量备份以来已更改文件的备份。\n\
  \n根据此计划，如果发生数据或磁盘故障并需要恢复，则需要最近的完全备份以及完全备份以来的每一次增量备份才能启动恢复。虽然执行每次增量备份的时间极短，但缺点是完全恢复可能需要相当多的磁带，特别是如果完全备份执行频率较低时。此外，随着所需磁带数量的增加，因磁带完整性问题（如磁带损坏）导致恢复失败的几率也会上升。\n\
  \n##### 差异备份\n\n数据备份的另一种方法是 `differential backup` 方法。虽然 `incremental backup` 仅归档自*任意*备份以来已更改的文件，但\
  \ `differential backup` 方法将备份自上次完全备份以来已更改的所有文件。以下是使用磁带的示例备份计划：周日晚进行每周完全备份，每日进行差异备份。\n\
  \n每周日执行一次完全备份。对于周一的差异备份，仅归档自周日备份以来已更改的文件。周二再次归档自周日完全备份以来已更改的文件，包括周一差异备份中已备份的文件。周三、周四、周五和周六将仅归档自上次完全备份以来已更改的所有文件。\n\
  \n根据此计划，如果发生数据或磁盘故障并需要恢复，则只需最近的完全备份和最近的差异备份即可启动完全恢复。虽然执行每次差异备份的时间比完全备份短，但随着距上次完全备份的时间推移，执行差异备份的时间也会增加。如果定期备份的大量数据发生变化，或完全备份之间的间隔时间较长，则备份所需时间可能接近完全备份的时间。\n\
  \n##### 存档位\n\n某些文件系统（如 Microsoft 的 `NTFS`）支持存档位。此位是一个文件属性，用于确定文件自上次修改以来是否已归档。`full\
  \ backup` 将归档所有文件（无论每个文件的存档位设置如何），然后将所有存档位重置为 0（表示每个文件均已归档）。\n\n当文件被修改时，相关的存档位被设置为\
  \ 1（表示文件已更改，需要归档）。`incremental backup` 将归档每个已修改的文件并将存档位重置为 0。`differential backup`\
  \ 将归档每个已修改的文件并保持存档位设置为 1。\n\n#### 廉价磁盘冗余阵列（RAID）\n\n即使因硬盘故障导致系统恢复仅需一盘完全备份磁带，恢复大量数据所需的时间也很容易超过组织规定的恢复时间。`Redundant\
  \ Array of Inexpensive Disks (RAID)` 的目标是帮助降低与硬盘故障相关的风险。存在各种 RAID 级别，它们由不同的磁盘阵列配置方法组成。这些配置差异在成本上各不相同，涉及实现配置目标所需的磁盘数量，以及在可靠性和性能优势方面的能力。表\
  \ 8.1 简要描述了最常用的各种 RAID 级别。\n\n表 8.1\n\nRAID 级别。\n\n| RAID 级别 | 说明 |\n| --- | ---\
  \ |\n| RAID 0 | 条带化集合 |\n| RAID 1 | 镜像集合 |\n| RAID 3 | 具有专用奇偶校验的字节级条带化 |\n| RAID\
  \ 4 | 具有专用奇偶校验的块级条带化 |\n| RAID 5 | 具有分布式奇偶校验的块级条带化 |\n| RAID 6 | 具有双重分布式奇偶校验的块级条带化\
  \ |\n\n\n\n\n##### 三个关键 RAID 术语\n\n三个关键 RAID 术语是：镜像、条带化和奇偶校验。\n\n###### 镜像\n\n*镜像*\
  \ 是基本 RAID 概念中最明显、最基础的一个，其作用仅仅是通过将相同数据写入多块硬盘来实现完全的数据冗余。由于镜像数据必须写入多块磁盘，写入时间会变慢（尽管\
  \ RAID 控制器的缓存可能会缓解这一问题）。然而，通过同时从多块硬盘拉取数据，读取镜像数据时可以获得性能提升。除了读写性能考量外，与镜像相关的主要成本是磁盘使用率；使用镜像时，至少一半的驱动器用于冗余。\n\
  \n###### 条带化\n\n*条带化* 是一种侧重于通过将数据分散到多块硬盘来提高读写性能的 RAID 概念。由于数据分散在多个磁盘驱动器上，读写操作可以跨多个磁盘并行执行，而不是在单个磁盘上串行执行。这种并行化提供了性能提升，但无助于数据冗余。\n\
  \n###### 奇偶校验\n\n*奇偶校验* 是一种在磁盘使用率和写入性能方面，无需承担与镜像同等程度成本即可实现数据冗余的方法。\n\n> **考试警告**\n\
  >\n> 虽然快速从磁盘故障中恢复是 RAID 的目标，但存在一些不具备可靠性能力的配置。考试时，务必理解并非所有 RAID 配置都提供额外的可靠性。\n\n\
  ##### RAID 0——条带化集\n\n顾名思义，*RAID 0* 采用条带化来提高读写性能。条带化本身不提供数据冗余，因此如果利用 RAID 的原因是为了数据恢复，RAID\
  \ 0 是一个糟糕的选择。图 8.15 直观展示了 RAID 0 的构成。\n\n![图 8.15 RAID 0——条带化集。](img/f08-15-9780443187346.jpg)\n\
  \n图 8.15 RAID 0——条带化集。\n\n##### RAID 1——镜像集\n\n这个 RAID 级别或许是所有 RAID 级别中最容易理解的。*RAID\
  \ 1* 会创建/写入所有数据的精确副本到额外的一块磁盘。写入性能会下降，但读取性能可能会提升。磁盘成本是该 RAID 级别最棘手的方面之一，因为至少一半的磁盘专门用于冗余。图\
  \ 8.16 直观展示了 RAID 1。\n\n![图 8.16 RAID 1——镜像集。](img/f08-16-9780443187346.jpg)\n\n\
  图 8.16 RAID 1——镜像集。\n\n##### RAID 2——海明码\n\nRAID 2 不被认为在硬盘上具有商业可行性，且未被使用。该 RAID\
  \ 级别需要 14 块或 39 块硬盘以及专门设计的硬件控制器，这使得 RAID 2 的成本高得令人望而却步。考试不太可能涉及 RAID 2。\n\n#####\
  \ RAID 3——带专用奇偶校验的条带化集（字节级）\n\n条带化因其将数据分散到多个磁盘所带来的性能增益而备受青睐。然而，仅靠条带化并不理想，因为它缺乏冗余。使用\
  \ *RAID 3* 时，数据在字节级别上跨多个磁盘进行条带化，但会利用一块额外的磁盘存储奇偶校验信息，该信息用于在发生故障时进行恢复。\n\n##### RAID\
  \ 4——带专用奇偶校验的条带化集（块级）\n\n*RAID 4* 提供与 RAID 3 完全相同的配置和功能，但数据条带化是在块级别而非字节级别进行的。与 RAID\
  \ 3 一样，RAID 4 采用专用奇偶校验驱动器。\n\n##### RAID 5——带分布式奇偶校验的条带化集\n\n最流行的 RAID 配置之一是 *RAID\
  \ 5*，即带分布式奇偶校验的条带化集。RAID 5 同样专注于条带化以获取其提供的性能提升，并利用块级条带化。与 RAID 3 和 4 一样，RAID 5 写入用于恢复的奇偶校验信息。然而，与\
  \ RAID 3 和 4 需要一块专用磁盘存储奇偶校验信息不同，RAID 5 将奇偶校验信息分布在多块磁盘上。RAID 5 流行的原因之一是其冗余的磁盘成本低于镜像集。该级别流行的另一个重要原因是支持基于硬件和基于软件的实现，这显著降低了\
  \ RAID 配置的准入门槛。RAID 5 允许在任意一块磁盘故障时恢复数据。图 8.17 提供了 RAID 5 的可视化表示。\n\n![图 8.17 RAID\
  \ 5——带分布式奇偶校验的条带化集。](img/f08-17-9780443187346.jpg)\n\n图 8.17 RAID 5——带分布式奇偶校验的条带化集。\n\
  \n##### RAID 6——带双重分布式奇偶校验的条带化集\n\n虽然 RAID 5 可容忍阵列中任意一块驱动器的损失，但 *RAID 6* 允许两块驱动器故障并仍能运行。这种冗余是通过将相同的奇偶校验信息写入两块不同的磁盘来实现的。\n\
  \n> **注意**\n>\n> 存在许多仅仅是标准 RAID 级别组合的各种 RAID 配置。嵌套 RAID 解决方案在需要高度可靠性和速度的大型磁盘阵列中变得越来越普遍。一些常见的嵌套\
  \ RAID 级别包括 RAID 0 + 1、1 + 0、5 + 0、6 + 0 和 (1 + 0) + 0，通常也分别写作 RAID 01、10、50、60\
  \ 和 100。\n\n##### RAID 1 + 0 或 RAID 10\n\n*RAID 1 + 0 或 RAID 10* 是所谓嵌套 RAID 或多重\
  \ RAID 的一个例子，这仅仅意味着一个标准 RAID 级别被封装在另一个标准 RAID 级别内部。对于 RAID 10（也常写作 RAID 1 + 0 以明确指示嵌套关系），其配置是镜像的条带化集。\n\
  \n### 系统冗余\n\n虽然 RAID 和备份解决方案提供的数据冗余和弹性很重要，但还需要进一步考虑提供对这些冗余数据访问的系统本身。\n\n#### 冗余硬件\n\
  \n许多系统可以为极易发生故障的组件提供内部硬件冗余。这种内置冗余最常见的例子是系统或设备拥有冗余机载电源，以应对电源故障。除了冗余电源外，冗余网络接口卡 (NIC)\
  \ 和冗余磁盘控制器也很常见。有时系统只是拥有常见易损组件的现场可更换模块化版本。虽然物理更换电源可能会增加停机时间，但备齐一套备用模块来维护整个数据中心的服务器，成本会低于为所有服务器配置安装好的冗余电源。\n\
  \n#### 冗余系统\n\n虽然许多易故障的内部组件可以配置为内置在系统中以实现冗余，但内部冗余是有限度的。如果系统可用性极其重要，那么在库存中备有完整的系统作为恢复手段可能是明智之举。虽然恢复时间可能较长，但组织与硬件制造商签订\
  \ SLA 以便及时快速采购替换设备的做法相当普遍。如果恢复时间可接受，那么快速采购选项很可能比备有闲置备用设备以应对临时系统恢复要便宜得多。\n\n####\
  \ 高可用性集群\n\n\n\n\n\n#### 高可用性集群\n\n某些应用程序和系统至关重要，其正常运行时间要求比备用冗余系统或备用硬件所能满足的更为严格。这些系统和应用程序通常需要通常所谓的高可用性（HA）或*故障转移集群*。*高可用性集群*采用多个已安装、已配置且已接通电源的系统，以便如果故障导致其中一个系统失效，则可以无缝利用另一个系统来维持所提供的服务或应用程序的可用性。\n\
  \n高可用性集群的实际实现细节可能差异很大，但有几个基本考虑因素需要了解。高可用性集群的主要实现考虑因素是 HA 集群的每个节点是否在故障发生前主动处理数据。这被称为*主动-主动*配置，通常称为负载均衡。与将系统置于*主动-被动*或热备用配置（备份系统仅在检测到故障状态时才开始处理）相比，将系统置于主动-主动或负载均衡配置中通常成本更高。\n\
  \n## BCP 和 DRP 概述与流程\n\n与业务连续性和灾难恢复规划相关的术语和概念经常被误解。对于 CISSP® 考生而言，清楚理解业务连续性和灾难恢复规划的含义及其包含的内容至关重要。除了理解构成各个学科的要素外，信息安全专业人员还应了解这两个过程之间的关系。\n\
  \n理解业务连续性和灾难恢复规划的另一个关键要素是分析威胁组织的各种潜在灾难类型。除了了解可能触发灾难恢复或业务连续性响应的各种破坏性事件类型外，还必须能够考虑与灾难类型相关的发生可能性。\n\
  \n最后，本节将定义业务连续性和灾难恢复规划过程的高层阶段。本节的目标是在深入探讨下一主要章节“制定 BCP/DRP”中各阶段的细节之前，确保对整体方法和主要阶段有基本的了解。灾难是生活中不可避免的事实。给予足够长的运营周期，每个组织都将经历重大灾难。一个彻底的、有制度的、持续的过程，不断审查与灾难事件相关的威胁、组织对这些威胁的脆弱性以及风险显现的可能性，将使组织能够适当地缓解灾难固有的风险。\n\
  \n### 业务连续性规划\n\n尽管许多组织将*业务连续性规划*（BCP）或*灾难恢复规划*（DRP）这两个短语混用，但它们是两个不同的学科。虽然这两个计划对于有效管理灾难和其他破坏性事件都至关重要，但它们的目标不同。BCP\
  \ 的总体目标是确保业务在经历灾难事件之前、期间和之后能够继续运营。BCP 的重点在于整个业务，确保业务提供的关键服务或定期执行的关键职能，既能在中断发生后继续执行，也能在度过中断后继续执行。为了确保关键业务职能仍可运行，组织需要考虑对其关键职能的常见威胁，以及可能使重大中断更可能发生的任何相关脆弱性。业务连续性规划为确保组织在不可避免的破坏性事件和灾难面前仍能持续成功运营提供了长期战略。\n\
  \n### 灾难恢复规划\n\n虽然业务连续性规划为破坏性事件后的持续运营提供了长期的战略性业务导向计划，但灾难恢复计划的方法更具战术性。DRP 为应对特定中断提供了短期计划。减轻有蔓延风险到其他系统的恶意软件感染，就是\
  \ DRP 将要处理的一个特定 IT 导向中断的示例。DRP 专注于高效地尝试减轻灾难的影响，以及在重大破坏性事件面前对关键 IT 系统的即时响应和恢复。灾难恢复规划被视为战术性而非战略性的，提供了一种对灾难进行即时响应的手段。DRP\
  \ 不像 BCP 那样以相同方式关注长期业务影响。\n\n> **考试警告**\n>\n> 正如第 4 章所述，领域 3：安全架构与工程，所有控制措施最重要的目标是人员安全。这对于关于灾难恢复规划的考试题目尤其如此。\n\
  \n### BCP 与 DRP 的关系\n\n业务连续性计划是一个总体规划，包含多个具体计划，其中最重要的是灾难恢复计划。尽管 BCP 和 DRP 的关注点不同，前者关注整个业务，后者以信息系统为中心，但这两个过程有重叠。在依赖信息系统的现代组织中，如果没有\
  \ DRP 提供的战术恢复计划，如何能实现尽管发生灾难仍持续提供业务关键服务的目标？这两个范围不同的计划是相互交织的。灾难恢复计划作为整体业务连续性计划的一个子集，因为如果\
  \ BCP 不包含立即处理信息系统中断的战术方法，注定会失败。图 8.18 摘自 *NIST 特别出版物 800-34*，提供了一种可视化手段，用于理解 BCP\
  \ 和 DRP 以及*运营连续性计划 (COOP)*、*人员应急计划 (OEP)* 等之间的相互关联性。\n\n![图 8.18 BCP 和相关计划 [12]。](images/B9780443187346000064/f08-18-9780443187346.jpg)\n\
  \n图 8.18 BCP 和相关计划 [[12]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0065)。\n\
  \n业务连续性计划致力于确保业务在重大破坏性事件发生前、期间和之后保持生存能力。如果没有快速恢复关键系统的能力，这种持续的生存能力将无法实现，而这从根本上就是灾难恢复计划所提供的。区分业务连续性计划和灾难恢复计划的另一种方式是：BCP\
  \ 更具整体性，因为它不像 DRP 那样明显地以系统为中心，而是除了关键系统外，还考虑人员、重要记录和流程等项目。\n\n\n\n\n\n#### 业务连续性计划与灾难恢复计划\n\
  \n区分业务连续性计划（BCP）与灾难恢复计划（DRP）的一种方法在于认识到：BCP 关注的是业务关键职能或服务的提供，而非通常用于执行这些职能的系统。虽然在当今普遍以系统为中心的组织中，这似乎只是一个学术上的区别，但请考虑电子邮件在大多数组织中所扮演的角色。虽然大多数技术人员会认为电子邮件属于业务关键范畴，但许多组织仍可在没有电子邮件的情况下继续运营，尽管过程会很痛苦。DRP\
  \ 肯定会将电子邮件系统纳入考量，但 BCP 可能不那么关注电子邮件本身，而更关注通过其他通信方式为客户提供服务。理解这一区别对组织至关重要，因为它最终将有助于指导诸如\
  \ `Maximum Tolerable Downtime (MTD)`（最大可容忍停机时间）等考量因素，而后者又将作为输入，用于确定如何分配资源和设计恢复策略。\n\
  \n### 灾难或破坏性事件\n\n鉴于组织制定业务连续性计划和灾难恢复计划是因为灾难可能影响运营，因此理解灾难和破坏性事件是必要的。在考虑 BCP 和 DRP\
  \ 时，最直观浮现的破坏性事件类型是自然灾害，如飓风、龙卷风、地震和洪水。虽然这些代表了某些类型的灾难，但它们远非唯一类型，甚至不是最常见的破坏性事件类型。\n\
  \n对可能发生的灾难类型进行分类的一种方法是按成因归类。灾难成因的三种常见分类方式是：威胁源是自然的、人为的，还是环境的 [\\[12\\]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0065)。\n\
  \n#### 自然\n\n最明显的可导致灾难的威胁是自然发生的。此类别包括地震、飓风、龙卷风、洪水和某些类型的火灾等威胁。历史上，自然灾害造成了组织不得不应对的最毁灭性灾难之一。然而，自然灾害发生的频率通常低于其他类别的威胁。自然威胁发生的可能性通常与地理位置密切相关。\n\
  \n#### 人为\n\n人为威胁类别代表了灾难最常见的来源。人为威胁可进一步按其是故意威胁还是非故意威胁进行分类。人为故意攻击指人类蓄意发动的、有动机的攻击。人为非故意攻击是指某人无意中充当了威胁源。例如，攻击者试图在组织内植入恶意软件以窃取持卡人数据，这属于人为故意威胁；员工因懒惰或疏忽大意导致运营中断，则属于人为非故意威胁。虽然人为故意威胁在威胁建模中可能更引人注目，但人为非故意威胁才是灾难最常见的来源。人为故意威胁的例子包括恐怖分子、恶意软件、内部叛徒、拒绝服务攻击、黑客行动主义、网络钓鱼和社会工程学。人为非故意威胁主要涉及无心的错误和遗漏，即人员因缺乏知识、懒惰或疏忽大意而成为破坏源。\n\
  \n#### 环境\n\n“环境威胁”这一名称容易引起混淆，让人联想到天气相关现象。在此语境下，环境威胁与天气关系不大（天气属于自然威胁），而是关注与信息系统或数据中心相关的环境。计算环境中断的威胁非常显著。此类威胁包括电力问题（停电、电压不足、电压浪涌、尖峰脉冲）、系统组件或其他设备故障，以及应用程序或软件缺陷。\n\
  \n> **注意**\n>\n> 技术威胁是另一类威胁。技术威胁可视为人为威胁的一个子集，但因其对信息安全的重要性，有时会被单独列出。技术威胁的常见例子包括恶意软件、拒绝服务攻击、网络战、网络恐怖主义、黑客行动主义、网络钓鱼和\
  \ DNS 劫持。这些威胁通过 `Cyber Incident Response Plan`（网络安全事件响应计划）进行缓解。\n\n威胁分析及确定威胁实现的相关可能性，是\
  \ BCP 和 DRP 流程的重要组成部分。对威胁的认识将有助于指导组织采取的潜在风险缓解或规避策略。此外，威胁分析将有助于为恢复和响应能力的规划及优先级排定提供指导。为了能够执行这些威胁分析，需要对威胁类型有更详细的了解。表\
  \ 8.2 简要汇总了部分灾难事件及其所属的灾难类型。\n\n表 8.2\n\n**破坏性事件示例。**\n\n| 破坏性事件 | 类型 |\n| --- |\
  \ --- |\n| 地震/龙卷风/飓风等 | 自然 |\n| 罢工 | 人为 (故意) |\n| 网络恐怖主义 | 人为 (故意)/技术 |\n| 恶意软件\
  \ | 人为 (故意)/技术 |\n| 拒绝服务 | 人为 (故意)/技术 |\n| 错误和遗漏 | 人为 (非故意) |\n| 电气火灾 | 环境 |\n|\
  \ 设备故障 | 环境 |\n\n#### 错误和遗漏\n\n错误和遗漏通常被认为是破坏性事件的单一最常见来源。人类，通常是组织雇员，无意中导致此类威胁。数据录入错误就是错误和遗漏的一个例子。这些错误可能给组织造成高昂代价，在投入生产前可能需要人工审查，这便是职责分离的一个例子。\n\
  \n> **注意**\n>\n> 虽然错误和遗漏是组织面临的最常见威胁，但它们也代表了最容易避免的威胁类型。如果组织能确定特别常见或特别具有破坏性的特定错误或遗漏类型，通常就能建立控制措施来帮助降低该威胁实现的风险。组织将降低其对特别重大错误或遗漏的脆弱性。\n\
  \n#### 自然灾害\n\n自然灾害包括地震、飓风、洪水和海啸。为了在 BCP 和 DRP 中制定适当的响应和恢复策略，需要了解自然灾害发生的可能性。自然威胁发生的可能性主要取决于组织信息系统或数据中心的地理位置。自然灾害发生的可能性通常较低。然而，一旦发生，影响可能非常严重。有关这些风险的更多信息以及具体的缓解策略，请参见第\
  \ 4 章，领域 3：安全架构与工程。\n\n#### 电力或供电问题\n\n\n\n\n\n##### 电力问题与环境威胁\n\n虽然自然灾害通常与组织可能面临的最灾难性事件联系在一起，但电力问题代表了更常见的威胁，可能会在组织内部造成重大中断。当电力问题发生时，它们通常会影响系统或组织的可用性。由于突然断电，磁盘驱动器上也可能出现完整性问题；然而，现代基于事务或日志式的文件系统已大大减少了这些完整性问题。\n\
  \n电力或电气问题是影响数据中心最常见的灾难事件之一。有关电气问题的更多详细信息以及缓解其中一些问题的方法，请参阅第 4 章第 3 领域：安全架构与工程中的“电力”部分。\n\
  \n#### 温度与湿度故障\n\n温度和湿度是在灾难期间必须管理的关键控制因素。显而易见，信息系统必须拥有稳定洁净的电力供应以维持其可用性，但现代数据中心还必须提供足够的供暖、制冷、通风和空调。适当的制冷和湿度水平至关重要。\n\
  \n旧式数据中心的设计考量的是大型机等不同的计算系统，而非当前常见的系统。刀片服务器和 `1U` 服务器的普及极大地增加了可装入机架或数据中心的资源密度。虽然这种更高的密度和每平方英尺更强的计算能力是令人向往的，但这种极大增加的服务器密度会产生显著的热量问题。为了提供适当且恒定的温度，数据中心将需要能够应对不断增加的服务器密度的\
  \ `HVAC` 系统。\n\n数据中心使用调节空气（加热或冷却）带来的另一个担忧是湿度水平。如果没有适当且恒定的温度以及合适的相对湿度水平，电气设备的 `平均故障间隔时间\
  \ (MTBF)` 将会降低。如果 `MTBF` 降低，意味着设备将更频繁地发生故障，这可能代表更频繁的灾难事件。良好的数据中心设计和充足的 `HVAC` 有助于降低这些威胁影响组织的可能性。\n\
  \n##### 实例学习：测试备用电源与 HVAC\n\n虽然所有数据中心都面临制冷问题或隐患，但密西西比州数据中心在八月份的制冷问题可能尤为棘手。所有组织都认识到，断电是一种常见的破坏性事件，无论其是由人为错误、自然灾害还是介于两者之间的原因引起。为了应对潜在的短时断电而不造成重大影响，组织通常会采用不间断电源（`UPS`）和/或备用发电机。\n\
  \n在进行了一次涉及 `HVAC` 升级、带专用 `UPS` 的供电机架、线缆管理（此前缺失）等的数据中心刷新后，一家位于密西西比州的组织认为有必要进行断电测试。该组织的设计是在断电发生时，自动将服务器切换到新的机架安装式\
  \ `UPS` 系统，启动发电机，然后让操作员开始关闭不必要的服务器，以延长其在无电情况下的运行时间。正在执行的测试仅旨在确保系统能自动故障切换到 `UPS`，确保发电机能启动，并确保操作员关闭不必要系统的新流程能正常工作。\n\
  \n在将数据中心与市电隔离后，机架安装式 `UPS` 立即启动。发电机顺利启动。操作员拆开关机程序的封条，开始优雅地关闭不必要的服务器。然而，操作员很快抱怨关闭这些系统的任务太热了。虽然压力会让人感觉稍微暖和些，但数据中心主管调查了此事。他发现他们一直专注于确保所有服务器系统在被优雅关闭前保持运行，却忽略了数据中心的新冷水机组，后者未被纳入断电考虑范围。在数百台服务器运行、无冷水机组工作、室外体感温度高达\
  \ `105°F` 的情况下，温度很可能迅速升高。\n\n#### 战争、恐怖主义与破坏\n\n人为故意威胁的极致体现在战争、恐怖主义和破坏等例子中。传统战争、恐怖主义和破坏对组织的威胁程度会因地理位置、行业、品牌价值以及与其他高价值目标组织的关联性而截然不同。虽然传统物理攻击仍然很可能发生，但网络战、网络恐怖主义或网络破坏的可能性甚至更大。信息系统的威胁形势多年来已迅速演变。\n\
  \n虽然几年前，信息战或恐怖分子针对信息系统的威胁可能只是惊悚小说的素材，但这些威胁来源已扩大了其能力和动机。每个月（有时每周）的新闻头条都暗示民族国家参与是合法且极可能的威胁来源。虽然人们理所当然地认为只有关键基础设施、政府或承包商系统会成为此类攻击的目标，但这一假设是站不住脚的。与军事、各国政府或关键基础设施几乎没有任何关系的组织，也是此类攻击的常规目标。\n\
  \n臭名昭著的“极光”攻击便阐释了这一点（该攻击因在所用恶意软件样本中发现单词“Aurora”而得名）。《纽约时报》报道称：“据参与调查的人员透露，针对谷歌和数十家其他美国公司的一系列在线攻击，已被追溯到中国两所教育机构的计算机，其中一所与中国军方关系密切”\
  \ [[13]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0070)。\n\n#### 经济动机驱动的攻击者\n\
  \n影响威胁分析的另一个近期趋势是经济动机驱动的攻击者日益增多。攻击者想出了许多方法，将针对各类组织的攻击货币化。这种网络犯罪的货币化增加了此类攻击的普及度。无论目标是通过窃取持卡人数据、身份盗窃、拉高出货股票骗局、虚假反恶意软件工具还是商业间谍活动来获取金钱，趋势清楚地表明，攻击者了解通过攻击信息系统获取巨额利润的方法。更令人不安的前景是，有组织犯罪集团现在在这些经济动机驱动的攻击来源中扮演着重要角色。有组织犯罪采用网络犯罪的理由显而易见。网络犯罪具有巨大的获利潜力，且被抓获的风险大大降低，即使被抓获，被成功起诉的风险也很低。就\
  \ `BCP` 和 `DRP` 而言，对威胁来源能力和动机重大变化的认识，将有助于指导规划过程中的风险评估部分。\n\n##### 实例学习：定向攻击\n\n\n\
  \n\n许多组织仍然认为攻击者不会以他们为目标。更多的人会辩称，他们不代表有组织犯罪分子、恐怖分子或外国民族国家的高价值目标。很容易拒绝考虑自己的组织可能成为攻击目标。正如社会上最脆弱的人群往往成为身份盗窃的目标一样，攻击者也会以家族企业为目标。虽然攻破一家小型家族餐厅可能无法让攻击者窃取数百万张信用卡，但这些较小的目标通常不太可能拥有预防或检测能力来挫败攻击者，甚至不知道攻击已经发生。如果攻击者能通过针对小型企业获利，他们就会这么做。实际上，每个组织都是目标。\n\
  \nBarracuda 2022 年的一份报告发现：“组织规模越小，其员工成为攻击目标的可能性越大。事实上，员工少于 100 人的小型企业的平均员工将比大型企业的员工多接收\
  \ 350% 的社会工程学攻击。中小企业是网络犯罪分子的诱人目标，因为它们总体上具有巨大的经济价值，且往往缺乏安全资源或专业知识” [\\[14\\]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0075)。\n\
  \n##### 人员短缺\n\n另一个可能导致灾难的威胁源在于与人员短缺相关的问题。尽管直到这一点为止，大多数关于威胁的讨论都与信息系统运行可行性的威胁有关，但另一个重大的中断源可能来自员工无法到岗。虽然某些系统可以在有限的管理监督下持续运行，但大多数组织都会有一些依赖人的关键流程。\n\
  \n###### 大流行病和疾病\n\n正如世界在面对 COVID-19（新冠疫情）时所深知的那样，最有可能导致严重人员短缺，而又不引起其他重大物理问题的威胁，在于重大生物学问题的可能性。除了\
  \ COVID-19，其他生物学问题如大流行性流感或高传染性传染病爆发也可能造成巨大的人员影响。历史上，传染病的流行和大流行造成了巨大的破坏。大流行是指感染在极大的地理区域内传播，而流行则更为局限。在普遍的信息系统出现之前，COVID-19\
  \ 之前鲜有重大流行或大流行。\n\n###### 罢工\n\n除了与可能的大流行病相关的人员可用性问题外，罢工是另一个重要的人员短缺来源。工人的罢工可能对业务运营造成极大的破坏。罢工的一个积极面是，它们通常以一种组织可以为此做计划的方式进行。大多数罢工都会提前宣布和计划，这为组织提供了一些提前量，尽管不足以消除与罢工相关的所有财务影响。\n\
  \n###### 人员可用性\n\n另一个与人员相关的问题，虽然可能不像罢工那样极端，但仍可能造成严重破坏，那就是关键员工突然离职。无论员工是被解雇、患重病、去世，还是中了彩票，由此导致的不可用状态如果组织对该关键成员的离职准备不足，就会造成中断。\n\
  \n##### 通信故障\n\n在缺乏充分备份计划的情况下依赖通信，代表了一种常见的脆弱性，这种脆弱性随着对呼叫中心、IP 电话、通用互联网接入以及通过互联网提供服务的依赖增加而增长。随着这种依赖性的增强，通信设备或连接的任何故障都可能迅速成为组织的灾难。组织通信基础设施面临许多威胁，但最常见的、定期发生的导致灾难的事件之一是电信线路被在不该挖掘的地方挖掘的人无意中切断。物理线路中断可能导致严重的中断。\n\
  \n##### 实例学习\n\n####### Internet2 中断\n\n卡特里娜飓风的一个令人震惊的影响是 Internet2 发生了相当严重的中断，Internet2\
  \ 为教育和研究网络提供高速连接。为 Internet2 提供基础设施的 Qwest 公司，其从亚特兰大通往休斯顿的一条主要长途链路发生了中断。据报道，该中断是由于该地区燃料供应不足造成的\
  \ [\\[15\\]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0080)。除了这次影响范围超出飓风直接受灾地区的中断外，密西西比州全境还发生了大规模中断，在高峰期，其三分之一以上的公共地址空间变得不可达\
  \ [\\[15\\]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0080)。\n\n### 灾难恢复流程\n\
  \n在讨论了业务连续性和灾难恢复规划的重要性，以及证明这种程度规划合理性的威胁示例之后，我们现在将重点放在从灾难中恢复所涉及的基本步骤上。首先介绍应对灾难事件的方法论，将有助于更好地理解制定\
  \ BCP/DRP 时需要考虑的要素。\n\n灾难恢复的一般流程包括：响应中断；激活恢复团队；就灾难状态及其相关恢复情况进行持续的战术沟通；进一步评估破坏性事件造成的损害；以及以与灾难程度相符的方式恢复关键资产和流程。不同的组织和专家可能对流程中的阶段数量或名称存在分歧，但总体而言，所采用的流程比其名称的差异要相似得多。\n\
  \n在专注于灾难及其相关恢复时，有一点常被忽视，即确保人员安全始终是重中之重。组织人员的安全应得到保障，即使以牺牲高效甚至成功的运营恢复或数据恢复为代价。安全应始终凌驾于业务考量之上。\n\
  \n#### 响应\n\n为了启动灾难恢复流程，必须有一个初始响应来开始评估损害的过程。在此初始评估期间，速度至关重要。稍后，如果事件确实需要重大的恢复举措，将有时间更彻底地评估灾难的全貌。\n\
  \n初始评估将确定相关事件是否构成灾难。此外，快速评估数据和/或系统能否足够快地恢复以避免使用备用处理设施将很有用，但并不总能在这一点上确定。如果毫无疑问需要备用设施，则越早传达这一事实，系统的可恢复性就越好。同样，初始响应团队还应注意评估设施是否安全以供人员继续使用，或寻求受过此类安全评估训练的专业人员的建议。\n\
  \n#### 激活团队\n\n\n\n如果在对破坏性事件的初始响应期间宣布进入灾难状态，则负责恢复的团队需要被激活。根据灾难的范围，这种沟通可能会变得极其困难。使用呼叫树（将在本章后面的“呼叫树”部分讨论）有助于促进这一过程，确保成员能够尽可能顺利地被激活。\n\
  \n#### 沟通\n\n在灾难恢复团队成功激活后，许多个人可能会并行处理整体恢复过程的不同方面。灾难恢复中最困难的方面之一，是确保一致且及时的状态更新能够传达回管理响应和恢复过程的核心团队。这种沟通通常必须通过带外方式进行，这意味着利用办公室电话的典型通信方法往往不是可行的选项。除了恢复活动的内部状态沟通外，组织还必须准备好提供外部沟通，这涉及向公众传播组织恢复状态的详细信息。\n\
  \n#### 评估\n\n尽管在灾难恢复过程的初始响应部分进行了初步评估，但（现已激活的）灾难恢复团队将执行更详细、更彻底的评估。团队将评估损害程度，以确定确保组织履行其使命和最大可容忍停工时间（`MTD`）所需的适当步骤。根据备用计算设施的可用性及其类型，团队可能会建议最终的恢复或重组在备用站点进行。评估中一个不容忽视的额外方面，是持续关注确保组织人员的持续安全。\n\
  \n#### 重组\n\n重组阶段的主要目标是在主要或次要站点成功恢复关键业务运营。如果利用备用站点，必须建立足够的安全和安保控制，以维持组织通常采用的预期安全程度。用于恢复的备用计算设施不应使组织面临进一步的安全事件。除了恢复团队在备用地点重组关键业务功能的努力外，抢救团队将被派往经历灾难的主要设施开始恢复过程。最终的期望是（除非在特定情况下完全没有必要）主要站点将被恢复，并且备用设施的运营将“故障回切”或再次转移回主要运营中心。\n\
  \n### 制定 BCP/DRP\n\n制定 `BCP/DRP` 对于组织响应和从正常业务功能中断或灾难性事件中恢复的能力至关重要。为确保所有规划均已考虑在内，`BCP/DRP`\
  \ 有一套特定的需求需要审查和实施。以下列出了根据 `NIST SP800-34` 实现合理、逻辑 `BCP/DRP` 的高层步骤。`NIST SP800-34`\
  \ 是美国国家标准与技术研究院的《联邦信息系统应急规划指南》，可在 [`nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-34r1.pdf`](https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-34r1.pdf)\
  \ 找到。\n\n*   项目启动\n*   确定项目范围\n*   业务影响分析\n*   识别预防性控制\n*   恢复策略\n*   计划设计与开发\n\
  *   实施、培训与测试\n*   `BCP/DRP` 维护 [\\[12\\]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0065)\n\
  \n#### 通过示例学习\n\n##### 评估通信风险\n\n美国太平洋司令部（`PACOM`）——负责全球太平洋地区的美军作战司令部——的总部位于夏威夷欧胡岛。作战司令部在美国军队的整体任务中发挥着至关重要的作用。由于岛屿环境，欧胡岛的电力、人员和互联网连接有限。如果\
  \ `PACOM` 想要制定一份涵盖在欧胡岛等岛屿上运营所涉及的所有风险的 `BCP/DRP`，他们应该考虑什么？`PACOM` 对欧胡岛提供军事行动通信服务的依赖程度有多高？\n\
  \n在 `PACOM` 启动 `BCP/DRP` 规划时，确定只有四条有效的通信海底光缆连接着夏威夷的所有通信。根据国际海底电缆保护委员会（见 [`www.iscpc.org/information/cable-data/`](https://www.iscpc.org/information/cable-data/)）的数据，与大多数人的想法相反，卫星通信仅提供夏威夷进出总通信流量的约\
  \ 5% [\\[16\\]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0085)。95% 的通信通过横跨夏威夷至加利福尼亚、华盛顿州、日本和澳大利亚的长距离光纤电缆进行。每条电缆仅在岛上两个物理汇聚点接入岛屿基础设施。海啸或台风等自然灾害可能会损坏连接点，导致整个岛屿失去\
  \ IT 或标准电话通信。通过 `PACOM` 的业务影响分析，还发现每个连接点的物理安全仅有围栏，没有警卫或警报。这意味着 `PACOM` 不仅容易受到自然物理威胁，也容易受到恶意人为威胁。正是\
  \ `PACOM` 的 `BCP/DRP` 开发工作发现了这一漏洞。\n\n#### 项目启动\n\n为了制定 `BCP/DRP`，必须确定并商定项目的范围。这涉及以下七个不同的里程碑\
  \ [\\[12\\]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0065)：\n\n1.  **制定应急规划政策声明**：正式的部门或机构政策提供了制定有效应急计划所需的授权和指导。\n\
  2.  **实施业务影响分析（`BIA`）**：`BIA` 有助于识别和优先排序关键 IT 系统和组件。同时提供了用于协助用户开发 `BIA` 的模板。\n3.\
  \  **识别预防性控制**：为减少系统中断影响而采取的措施可以提高系统可用性并降低应急生命周期成本。\n4.  **制定恢复策略**：彻底的恢复策略确保系统在中断后能够快速有效地恢复。\n\
  5.  **制定 IT 应急计划**：应急计划应包含恢复受损系统的详细指导和程序。\n6.  **计划测试、培训和演练**：测试计划可识别规划缺口，而培训可让恢复人员为计划激活做好准备；这两项活动均可提高计划有效性和机构整体准备度。\n\
  7.  **计划维护**：计划应作为一份活文档定期更新，以保持与系统增强的同步 [\\[12\\]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0065)。\n\
  \n\n\n\n##### 实施软件和应用程序恢复\n\n对于面临灾难事件的组织而言，实施软件和应用程序恢复可能是最困难的。硬件相对容易获取。如果在事件发生前未做规划，特定的软件基线、配置以及用户数据将极难实施。图\
  \ 8.19 展示了 BCP/DRP 的流程、行动以及计划制定和实施中涉及的相关人员。IT 是任何组织 BCP/DRP 的主要组成部分，但正如图 8.19 所示，它并非高层管理者（C-level\
  \ managers）的唯一关注点。事实上，IT 被要求为直接履行业务使命的组织部门提供支持。面对业务运营中断，IT 承担着特定的责任，因为组织的通信高度依赖\
  \ IT 基础设施。在查看图 8.19 时，还请注意，IT BCP/DRP 将直接影响整个组织在应急事件期间的响应。图 8.19 的顶行展示了组织层面的 BCP/DRP\
  \ 流程；其下方是 IT BCP/DRP 流程。你可以通过箭头看到二者是如何相互关联的。\n\n![图 8.19 BCP/DRP 流程。](img/f08-19-9780443187346.jpg)\n\
  \n图 8.19 BCP/DRP 流程。\n\n###### 管理层支持\n\n不言而喻，没有高层管理团队的同意，任何 BCP/DRP 都毫无价值。“C 级”管理人员必须同意所制定的任何计划，并且必须同意在发生紧急事件时支持计划中列出的行动项。C\
  \ 级管理层是指组织内的首席执行官（CEO）、首席运营官（COO）、首席信息官（CIO）和首席财务官（CFO）等人员。C 级管理人员至关重要，尤其是在破坏性事件期间，因为他们拥有足够的权力和权威，在与外部媒体打交道时代表整个组织发声，且职位足够高，能够在需要外部资源时调动从灾难走向恢复所必需的资源。这也包括就重组组织必要功能所需的资源支出达成一致。\n\
  \nC 级管理层可能希望为组织开展 BCP/DRP 项目的另一个原因，是为了识别流程改进机会并提高组织内部效率。一旦 BCP/DRP 项目开发计划完成，管理层将能够确定组织中哪些部分高度高效，并且清楚自己对组织其他部分的所有影响，以及组织内其他实体如何影响它们。\n\
  \n###### BCP/DRP 项目经理\n\n`BCP/DRP 项目经理` 是确保 BCP/DRP 不仅得以完成，而且定期接受测试的关键联络点（POC）。此人需要具备业务技能，对组织及其使命极其胜任且知识渊博，并且必须是一位优秀的管理者和领导者，以便在发生导致\
  \ BCP 或 DRP 启动的事件时发挥作用。在大多数情况下，项目经理是在危机期间组织内每个人的联络点。\n\n组织技能对于管理这项艰巨的任务是必要的，因为这些技能非常重要，项目经理必须非常有条理。项目经理最重要的素质是：他在组织内具有公信力和足够的权力，能够就实施\
  \ BCP/DRP 做出重要、关键的决策。令人惊讶的是，此人不需要具备深厚的技术技能。相反，需要一定的技术知识，但最重要的是，项目经理需要具备谈判和人际交往技能，以便在组织内所有利益相关者之间创建和传播\
  \ BCP/DRP。\n\n###### 组建 BCP/DRP 团队\n\n组建 BCP/DRP 团队对组织至关重要。BCP/DRP 团队由在紧急情况发生时/若发生时承担职责的人员组成。在确定\
  \ BCP/DRP 人员之前，必须先组建持续性规划项目团队（CPPT）。CPPT 由组织内的利益相关者组成，专注于确定如果发生特定紧急事件，谁需要发挥作用。这包括人力资源部、公共关系（PR）、IT\
  \ 员工、物理安保、直线经理、对全面业务有效性至关重要的关键人员，以及其他任何负责基本职能的人员。此外，根据紧急事件的类型，不同的人员可能需要扮演不同的角色。例如，在仅影响组织内部运作的\
  \ IT 紧急事件中，公关部可能没有关键作用。然而，任何影响客户或公众的紧急情况都需要公关部的直接参与。\n\n关于 CPPT 规划的一些棘手问题在于如何处理管理者/员工关系。在许多软件和\
  \ IT 相关企业中，员工是“矩阵式”管理的。矩阵式组织通过让员工在多条不同的管理指挥链下参与众多项目，来利用员工的专业知识。例如：员工约翰·史密斯正在为四位不同的经理处理四个不同的项目。在发生紧急情况时，谁将对约翰负责？这类问题将由\
  \ CPPT 解答。正是规划团队寻找上述示例等组织问题的答案。应当理解并规划好：在紧急情况下，人员变得难以管理。\n\n###### 确定项目范围\n\n正确确定\
  \ BCP/DRP 的范围至关重要且困难。确定范围意味着准确定义计划保护哪些资产、计划能应对哪些紧急事件，以及最后确定完全创建和实施计划所需的资源。组织内的许多相关方必须参与范围确定过程，以确保组织的所有部分都得到代表。需要向\
  \ BCP/DRP 规划团队提出具体问题，例如：“此计划的范围内外分别是什么？”\n\n在获得 C 级批准和组织其他部门的意见后，目标和交付成果随即可被确定。这些目标通常以“如果/那么”语句的形式创建。例如，“如果发生飓风，那么组织将启动\
  \ H 计划——物理搬迁和员工安全计划。”H 计划是组织特有的，但它确实涵盖了所需的所有 BCP/DRP 子计划。一个目标可能是在特定日期前创建该计划并让组织所有成员进行审查。该目标将需要许多交付成果来创建并充分审查该计划：例如，草稿文档、演练规划会议和桌面推演初步演练。每个组织在创建\
  \ BCP/DRP 时，根据组织需求，都将拥有自己独特的目标和交付成果集。\n\n高层管理至少必须确保对以下三个 BCP/DRP 项目给予支持：\n\n1. \
  \ 启动计划需要高层管理支持。\n2.  计划的最终批准需要高层管理支持。\n3.  高层管理必须展现应有的关注和尽职调查，并根据适用法律/法规承担责任。\n\n\
  ####### 评估关键状态\n\n\n\n\n####### 评估关键状态\n\n评估关键状态可能很困难，因为确定 IT 基础设施的哪些部分是关键的，完全取决于它如何支持组织内的用户。例如，如果不咨询所有用户，一个简单的地图绘制程序可能看起来并不是组织的关键资产。然而，如果有一个用户群负责驾驶卡车并为业务目的进行送货，那么这款地图软件对他们安排取货和送货可能至关重要。\n\
  \n表 8.3 列出了示例关键资产清单。另请注意，在编制关键状态及其相关资产清单时，BCP/DRP 项目经理应在名为“业务影响”的部分中说明资产对组织的影响。\n\
  \n####### 表 8.3：关键状态 IT 资产清单示例\n\n| IT 资产 | 受影响的用户群 | 受影响的业务流程 | 业务影响 |\n| --- |\
  \ --- | --- | --- |\n| GIS 地图绘制软件 V2.8 | 送货司机 | 货物准时送达 | 客户关系和信任可能受损 |\n| 考勤系统 V3.0\
  \ | 所有员工 | 员工考勤与薪资发放 | 短期内（最长 5 天）延迟发薪尚可容忍。员工可能罢工离岗，或出现更糟情况 |\n| Microsoft Teams\
  \ 内部消息系统 | 执行委员会、财务部、会计部 | 财务组与执行委员会的沟通 | 影响轻微，财务组也可使用电子邮件沟通 |\n\n正如您在表 8.3 中所见，并非所有\
  \ IT 资产都具有相同的关键状态。在关键状态资产清单中，建议 BCP/DRP 项目经理在记录资产、群组、流程和影响时采用定性方法。在业务影响分析期间，将确定定量衡量标准，以关联每个条目的影响。\n\
  \n###### 实施业务影响分析 (BIA)\n\n**业务影响分析 (BIA)** 是确定组织 IT 系统中断将如何影响组织需求、流程及相互依赖关系（就业务使命而言）的正式方法\
  \ [[12]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0065)。它是一项旨在识别关键 IT 系统和组件并确定其优先级的分析。它使\
  \ BCP/DRP 项目经理能够全面描述 IT 应急需求和优先级 [[12]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0065)。其目标是将\
  \ IT 系统组件与其支持的关键服务相关联。它还旨在量化系统组件中断的后果，以及这将如何影响组织。BIA 的主要目标是确定特定 IT 资产的**最大可容忍停工时间\
  \ (MTD)**。这将直接影响灾难恢复解决方案的选择。例如，某 IT 资产只能承受 24 小时的服务中断，那么至少必须利用温备站点，以防止中断发生时造成灾难性损失。\n\
  \n实施 BIA 的另一个好处是，它还能提供改进业务流程和效率的信息，因为它详述了组织的所有政策和实施工作。如果业务流程中存在低效环节，BIA 将反映出来。\n\
  \n> **考试警示**\n>\n> BIA 由两个过程组成。首先，必须进行关键资产识别。其次，进行全面的风险评估。\n\n####### 识别关键资产\n\n\
  请记住，无论 IT 系统多么琐碎或看似不重要，都必须为组织内的每个 IT 系统实施 BIA 并创建关键状态资产清单。这是为了确保每个系统都已纳入核算。一旦清单汇总完毕，且用户和用户代表已提供意见，即可创建关键资产清单。关键资产清单是组织认定为业务必需的\
  \ IT 资产清单。这些系统的 DRP/BCP 必须分配最佳可用恢复能力。\n\n####### 实施以 BCP/DRP 为重点的风险评估\n\n以 BCP/DRP\
  \ 为重点的风险评估确定哪些风险内在于哪些 IT 资产。同时也会对每个 IT 系统和主要应用程序进行漏洞分析。之所以这样做，是因为大多数传统的 BCP/DRP\
  \ 评估侧重于物理安全威胁（包括自然和人为威胁）。然而，由于联网 IT 系统的本质，中断发生的风险要大得多，因此必须加以缓解。\n\n表 8.4 演示了某公司电子邮件系统的基本风险评估。在本例中，该公司使用\
  \ Microsoft Exchange，用户约 100 人。请注意，每种缓解策略都将通过接受、降低、消除或转移风险，对整体风险产生影响。风险评估和缓解在第 2\
  \ 章（领域 1：安全与风险管理）中有深入介绍。\n\n######## 表 8.4：X 公司电子邮件系统的风险评估\n\n| 风险评估发现 | 漏洞 | BIA\
  \ | 缓解措施 |\n| --- | --- | --- | --- |\n| 服务器位于未上锁的房间 | 未经授权人员的物理访问 | 可能通过对系统的物理攻击导致电子邮件系统的机密性、完整性和可用性\
  \ (CIA) 丧失 | 安装带有 PIN 码和报警系统的硬件锁（风险降低至可接受水平） |\n| 软件落后两个版本 | 该版本不安全且已达到供应商生命周期终点\
  \ | 可能通过网络攻击导致电子邮件系统的 CIA 丧失 | 更新系统软件（风险被消除） |\n| 未实施防火墙解决方案/无 DMZ | 无防火墙直接暴露在互联网上，极大地增加了网络威胁\
  \ | 可能通过网络攻击导致电子邮件系统的 CIA 丧失 | 将电子邮件服务器迁移至托管托管站点（风险转移给托管组织） |\n\n####### 确定最大可容忍停工时间\n\
  \nBIA 的主要目标是确定**最大可容忍停工时间 (MTD)**，它描述了系统在组织受到严重影响之前可以处于不可操作状态的总时间。它是执行重构阶段所需的最长时间。重构是将组织从灾难恢复状态过渡到业务运营状态的过程。\n\
  \n最大可容忍停工时间由两个指标组成：**恢复时间目标 (RTO)** 和**工作恢复时间 (WRT)**（见下文）。\n\n######## MTD 的替代术语\n\
  \n根据所使用的业务连续性框架，最大可容忍停工时间可能有其他替代术语。这些术语包括**最大允许停工时间 (MAD)**、**最大可容忍中断 (MTO)** 和**最大可接受中断\
  \ (MAO)**。\n\n尽管定义上可能存在细微差别，但这些术语实质上是相同的，有时可互换使用。为保持一致性，本章将使用术语 MTD。\n\n> **案例学习：薪资系统的重要性**\n\
  >\n> 一位 IT 安全讲师正在教授一群空军 IT 技术人员。当时，讲师试图教导空军技术人员在发生中断时如何确定哪些 IT 系统应优先重构。在一次练习中，IT\
  \ 技术人员将薪资系统评为对作战至关重要的系统，没有其他作战系统能优先于薪资系统。当讲师询问 IT 技术人员为何如此时，他们回答说：“如果我们拿不到工资，就不会打仗……这就是薪资系统最重要的原因。没有它，我们就会输掉战争！”\n\
  \n\n\n\n这是一个真实的故事，也是一个值得考虑的极佳切入点，尤其是在规划薪资系统时。在任何 BCP/DRP 中，都需要特别关注（此处无双关之意）薪资系统，以及组织在\
  \ IT 运营中断事件中将如何支付员工工资。必须为每一种可能的中断场景制定计划并进行审查，以确保业务能够持续运行。如果工资单发放延迟或缺失，员工的工作状态会受到严重影响。\n\
  \n薪资发放可用于确定 MTD（最长可容忍停工时间）的外部边界。任何一次薪资发放都可能受到突发灾难的影响，例如：计划在中午打印支票时，数据中心于上午 11:30\
  \ 发生洪水。大多数组织不应承担两次错过薪资发放的非受控风险：如果公司每两周发放一次工资，那么最大 MTD 将是两周。这用于确定外部边界；大多数组织会确定一个低得多的\
  \ MTD（有时以天、小时甚至更短的时间为单位）。\n\n####### 故障与恢复指标\n\n许多指标用于量化系统故障的频率、系统可能处于故障状态的时长，以及从故障中恢复的最长时间。这些指标包括\
  \ `Recovery Point Objective (RPO)`、`Recovery Time Objective (RTO)`、`Work Recovery\
  \ Time (WRT)`、`Mean Time Between Failures (MTBF)`、`Mean Time to Repair (MTTR)` 和\
  \ `Minimum Operating Requirements (MOR)`。\n\n######## 恢复点目标\n\n`Recovery Point Objective\
  \ (RPO，恢复点目标)` 是指组织所能承受的数据丢失量或系统不可访问时长（以时间衡量）。“如果你执行每周备份，就意味着有人做出了决定：你的公司可以容忍丢失一周的数据。如果备份在周六晚上执行，而系统在周六下午故障，你就丢失了整整一周的数据。这就是恢复点目标。在这种情况下，RPO\
  \ 为 1 周” [\\[17\\]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0090)。\n\nRPO\
  \ 由要求用户获取数据访问权的特定操作来定义。例如，纳斯达克股票交易所的 RPO 将是：允许用户执行交易的那个时间点（下一个可用的交易日）。\n\n这要求纳斯达克在公认的交易时段内必须始终可用，无论发生什么。当纳斯达克没有交易发生时，系统可以负担得起离线状态，但在发生重大中断事件时，恢复点目标将是用户需要访问权限以执行交易的那个时刻。如果用户未能在该时间点获得访问权限，纳斯达克交易系统将遭受重大业务冲击，从而对纳斯达克组织产生负面影响。\n\
  \nRPO 代表因灾难或破坏性事件导致的特定流程所能接受的最大数据/工作损失量。\n\n######## 恢复时间目标 (RTO) 与工作恢复时间 (WRT)\n\
  \n`Recovery Time Objective (RTO，恢复时间目标)` 描述了恢复业务或 IT 系统所允许的最长时间。RTO 也称为系统恢复时间。这是最大可容忍停工时间\
  \ (MTD) 的一部分：一旦系统在物理层面开始运行，还必须进行配置。\n\n`Work Recovery Time (WRT，工作恢复时间)` 描述了配置已恢复系统所需的时间。“停工时间由两个要素组成：系统恢复时间和工作恢复时间。因此，MTD\
  \ = RTO + WRT” [\\[17\\]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0090)。\n\
  \n######## 平均故障间隔时间\n\n`Mean Time Between Failures (MTBF，平均故障间隔时间)` 量化了新系统或修复后的系统在发生故障前能运行多长时间。它通常由组件供应商生成，主要适用于硬件，而非应用程序和软件。一家销售\
  \ LCD 计算机显示器的供应商可能会让 100 台显示器每天运行 24 小时，持续 2 周，并观察到仅有 1 台显示器故障。该供应商随后推算得出：\n\n100\
  \ 台 `LCD` 计算机显示器 × 14 天 × 24 小时/天 = 1 次故障/33,600 小时\n\n![si1_e](img/si1_e.png)\n\
  \n这并不意味着一台 LCD 计算机显示器能在不发生故障的情况下运行 3.8 年（33,600 小时）[\\[18\\]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0095)。每台显示器的故障率可能与这个计算出的平均值（本例中即平均数）有显著差异。然而，为了规划目的，我们可以假设如果我们运行一个拥有\
  \ 20 台显示器的办公室，大约每 70 天就会有一台故障。一旦供应商发布 MTBF，BCP/DRP 团队就有责任确定在一段时间内 IT 系统中预期故障的正确数量。随着组织使用的硬件资产越来越少，计算\
  \ MTBF 的可靠性会降低。请参阅下面的示例，了解如何计算 20 台 LCD 计算机显示器的 MTBF。\n\n1 次故障/33,600 小时 = 20 台\
  \ `LCD` 计算机显示器 × X 天 × 24 小时/天\n\n![si2_e](img/si2_e.png)\n\n通过将等式两边同时除以 20 × 24\
  \ 来求解 X\n\nX 天 = 33,600/20 × 24 X 天 = 70\n\n![si3_e](img/si3_e.png)\n\n########\
  \ 平均修复时间\n\n`Mean Time to Repair (MTTR，平均修复时间)` 描述了恢复特定故障系统需要多长时间。它是重建 IT 系统以实现业务连续性的最佳估算值。\n\
  \n######## 最低运行需求\n\n`Minimum Operating Requirements (MOR，最低运行需求)` 描述了运行计算机设备所需的最低环境和连接要求。确定并记录每项\
  \ IT 关键资产的 MOR 非常重要，因为在发生破坏性事件或灾难时，可以快速进行适当分析，以判断 IT 资产是否能在应急环境中运行。\n\n####### 识别预防性控制\n\
  \n预防性控制可防止破坏性事件产生影响。例如，正如第 4 章（领域 3：安全架构与工程）所述，HVAC 系统（暖通空调系统）的设计目的是防止计算机设备过热并发生故障。\n\
  \nBIA 将识别出一些可立即缓解的风险。这是实施 BCP/DRP（包括 BIA）的另一优势：即使没有发生灾难，它也能提高你的安全性。\n\n####### 恢复策略\n\
  \n一旦 BIA 完成，BCP 团队就知道了最大可容忍停工时间 (MTD)。该指标以及其他指标（包括 `Recovery Point Objective` 和\
  \ `Recovery Time Objective`）用于确定恢复策略。例如，如果 MTD 是 12 小时，则不能使用冷站点。一般来说，MTD 越短，恢复解决方案的成本越高，如图\
  \ 8.20 所示。\n\n![Fig. 8.20 Recovery technologies' cost vs. availability.](img/f08-20-9780443187346.jpg)\n\
  \n图 8.20 恢复技术的成本与可用性对比。\n\n使用任何恢复选项时，你必须始终维护技术、物理和管理控制。\n\n######## 供应链管理\n\n在正常业务运营期间，采购计算机设备和业务系统可能相对简单。但在灾难期间，情况可能会发生剧烈变化。例如，一个组织计划在灾难发生时配备一个冷站点，并采购\
  \ 200 台计算机服务器。\n\n如果灾难仅局限于该组织，此策略可能会成功。但如果发生大范围灾难，许多组织都在寻求采购数百台计算机，会怎样？在“准时制”货物运输的时代，这意味着许多组织将无法获得足够的替代计算机。供应链管理旨在应对这一挑战。\n\
  \n\n\n\n\n一些计算机制造商为特定范围的灾难提供有保障的替换保险。该保险按服务器定价，并包含一份规定了替换时间的服务级别协议。BCP 团队应分析所有形式的相关保险。\n\
  \n######## 电信管理\n\n电信管理确保灾难期间电子通信的可用性。通信通常是在灾难期间最先失效的流程之一。在大范围灾难发生时，电力、固定电话和手机基站可能无法运作，就像卡特里娜飓风过后路易斯安那州的情况一样。在这种情况下，卫星电话是飓风过后当即唯一的电子通信手段。\n\
  \n此外，大多数通信系统的设计假设是只有少量用户会同时访问。在 2001 年 9 月 11 日恐怖袭击事件后，纽约市的大多数固定电话和手机变得无法使用，主要原因是拥塞：太多人试图同时使用电话。\n\
  \n有线电路（如 T1、T3 和帧中继）需要专门处理。在正常业务运营期间，新 T1 电路的正常安装交付周期可能为 30–45 天。仅这一点就超过了大多数组织的最大可容忍停机时间。此外，在灾难期间交付周期往往会延长，因为电信提供商可能需要在修复自身系统的同时，处理来自其他受大范围灾难影响组织的订单激增。\n\
  \n无线网络设备在成功的电信管理计划中可发挥关键作用。点对点无线链路可由单个组织快速建立，某些点对点长距离无线设备可在 50 英里或更远的距离下运行。如有必要，发电机可提供电力。\n\
  \n######## 公用设施管理\n\n公用设施管理解决灾难期间电力、水、燃气等公用设施的可用性问题。具体的公用设施缓解控制措施（如电力可用性、发电机和不间断电源）将在第\
  \ 4 章第 3 领域：安全架构与工程中讨论。\n\n公用设施管理计划应涵盖业务运营所需的所有公用设施，包括电力、供暖、制冷和水。具体章节应针对任何所需公用设施的不可用情况进行说明。\n\
  \n######## 恢复选项\n\n一旦组织确定了其最大可容忍停机时间，就可以确定恢复选项的选择。例如，10 天的 MTD 表明冷站点可能是一个合理的选项。几小时的\
  \ MTD 表明冗余站点或热站点是潜在选项。\n\n######### 冗余站点\n\n`冗余站点`是系统的精确生产副本，具备无缝运行所有必要 IT 操作的能力，且不会导致系统最终用户的服务中断。冗余站点实时接收数据备份，以便在发生灾难时，系统用户不会丢失任何数据。它是一个配置与主站点完全相同的建筑，是成本最高的恢复选项，因为它实际上使\
  \ IT 运营成本翻倍以上。要实现完全冗余，站点必须具备对冗余系统的实时数据备份，且在发生破坏性事件时，最终用户不应察觉 IT 服务或运营有任何差异。\n\n\
  > **注意**\n>\n> 在美国国防部内，IT 系统的关键性仅根据一项指标衡量：该 IT 系统对作战有多重要？根据答案，可被分配任务保障类别级别（MAC 级别）I、II\
  \ 或 III。国防部内的 MAC I 系统必须维护与生产系统非同地部署的完全冗余系统。根据定义，MAC I 系统的用户不会遇到系统非功能性的任何情况。这不仅因为冗余站点所需的额外人力和技术，还因为每个备份与生产系统之间受保护的通信线路，从而推高了运营成本。确保数据成功镜像，以便无论发生何种灾难性事件，最终用户都不会丢失服务，这至少是一项艰巨的任务。\n\
  \n######### 热站点\n\n`热站点`是组织在发生重大中断或灾难后可能迁移至的地点。它是一个具备架空地板、电力、公用设施、计算机外设和全配置计算机的数据中心。热站点将实时镜像所有必要的硬件和关键应用数据。热站点具备让组织在极短时间内（有时不到一小时）恢复关键运营的能力。\n\
  \n重要的是要注意热站点和冗余站点的区别。热站点可快速恢复关键 IT 功能；甚至可能以分钟而非小时计。然而，无论 IT 项目的运营状态如何，冗余站点对最终用户而言都将表现为正常运行。热站点实施了与生产站点相同的所有物理、技术和管理控制。\n\
  \n######### 温站点\n\n`温站点`具备热站点的某些特性；例如，随时可用的硬件和连接性，但它必须依赖备份数据才能在中断后重建系统。它是一个具备架空地板、电力、公用设施、计算机外设和全配置计算机的数据中心。\n\
  \n由于维护热站点或冗余站点涉及巨大成本，许多组织会选择使用温站点恢复方案。这些组织必须能够承受至少 1–3 天的 MTD，才能考虑温站点方案。MTD 越长，恢复方案的成本越低。通常，在有训练有素的人员和供应商合同到位的情况下，温站点可在\
  \ 24–48 小时内重建关键 IT 功能。\n\n######### 冷站点\n\n`冷站点`是实施成本最低的恢复方案。它不包含数据备份副本，也不包含任何即时可用的硬件。在发生破坏性事件后，冷站点在所有恢复方案中实施和恢复组织关键\
  \ IT 服务所需时间最长。特别是在灾区，供应商硬件发货到位可能需要数周，因此使用冷站点恢复方案的组织必须能够承受显著较长的 MTD——通常以周为单位，而非天。冷站点通常是一个具备架空地板、电力、公用设施和物理安全的数据中心，但除此之外配置不多。\n\
  \n######### 互惠协议\n\n`互惠协议`是两个组织之间的双向协议，其中一个组织承诺另一个组织，如果发生灾难，可以迁入并共享空间。它以合同形式记录，旨在在灾难发生时获得外部组织的支持。它们也被称为互助协议（MAA），其结构旨在使每个组织在紧急情况下协助对方。\n\
  \n> **注意**\n\n\n\n\n\n####### 相关计划\n\n正如前文所述，业务连续性计划（BCP）是一项包含其他计划的总体计划。除了灾难恢复计划（DRP）外，其他计划还包括：运营连续性计划（COOP）、业务恢复/复原计划（BRP）、支持连续性计划、网络事件响应计划、人员应急计划（OEP）以及危机管理计划（CMP）。表\
  \ 8.5 摘自 NIST Special Publication 800-34，总结了这些计划。\n\n表 8.5\n\n**NIST SP 800-34 中\
  \ BCP 计划摘要** [[12]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0065)\n\n| 计划\
  \ | 目的 | 范围 |\n| :--- | :--- | :--- |\n| 业务连续性计划 (BCP) | 提供在从重大中断中恢复期间维持基本业务运营的程序\
  \ | 涉及业务流程；IT 仅基于其对业务流程的支持被涉及 |\n| 业务恢复（或复原）计划 (BRP) | 提供灾难发生后立即恢复业务运营的程序 | 涉及业务流程；非\
  \ IT 为重点；IT 仅基于其对业务流程的支持被涉及 |\n| 运营连续性计划 (COOP) | 提供在备用站点维持组织基本战略职能长达 30 天的程序和能力\
  \ | 涉及被视为最关键的组织任务子集；通常在总部层面编写；非 IT 为重点 |\n| 支持连续性计划 / IT 应急计划 | 提供恢复主要应用程序或通用支持系统的程序和能力\
  \ | 同 IT 应急计划；涉及 IT 系统中断；非业务流程为重点 |\n| 危机沟通计划 | 提供向人员和公众传播状态报告的程序 | 涉及与人员和公众的沟通；非\
  \ IT 为重点 |\n| 网络事件响应计划 | 提供检测、响应恶意网络事件并限制其后果的策略 | 专注于针对影响系统和/或网络的事件的信息安全响应 |\n|\
  \ 灾难恢复计划 (DRP) | 提供在备用站点恢复能力的详细程序 | 通常以 IT 为重点；仅限于具有长期影响的重大中断 |\n| 人员应急计划 (OEP)\
  \ | 提供协调程序，以在应对物理威胁时最大限度地减少人员伤亡和财产损失 | 专注于特定设施的人员和财产；非基于业务流程或 IT 系统功能 |\n\n########\
  \ 运营连续性计划 (COOP)\n\n运营连续性计划（COOP）描述了在灾难期间维持运营所需的程序。这包括将人员转移到备用灾难恢复站点，以及该站点的运营。\n\
  \n######## 业务恢复计划 (BRP)\n\n业务恢复计划（也称为业务复原计划）详细说明了在从破坏性事件中恢复后，恢复正常业务运营所需的步骤。这可能包括将运营从备用站点切换回（已修复的）主站点。\n\
  \n业务恢复计划在 COOP 完成后开始执行。该计划范围窄且聚焦：BRP 有时作为附录包含在业务连续性计划中。\n\n######## 支持连续性计划\n\n\
  支持连续性计划专门关注对特定 IT 系统和应用程序的支持。它也称为 IT 应急计划，强调 IT 而非通用业务支持。\n\n######## 网络事件响应计划\n\
  \n网络事件响应计划旨在应对破坏性网络事件，包括基于网络的攻击、蠕虫、计算机病毒和特洛伊木马。例如，蠕虫等自我传播的恶意代码有可能破坏网络。对于许多组织而言，单纯丧失网络连接就可能构成灾难。\n\
  \n######## 人员应急计划 (OEP)\n\n人员应急计划（OEP）提供了“设施人员在发生对人员健康和安全、环境或财产构成潜在威胁的情况时的响应程序。此类事件包括火灾、飓风、犯罪袭击或医疗急救”\
  \ [[12]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0065)。该计划侧重于设施，而非业务或 IT。\n\
  \nOEP 侧重于安全和疏散，应描述具体的安全演练，包括疏散演练（也称为消防演练）。应描述具体的安全角色，包括安全监护人和集合点负责人，详见第 4 章，领域 3：安全架构与工程。\n\
  \n######## 危机管理计划 (CMP)\n\n危机管理计划（CMP）旨在在紧急情况或破坏性事件发生时，为组织管理者之间提供有效的协调。CMP 详细说明了管理层必须采取的行动，以确保在灾难发生时立即保护人员的生命安全和财产安全。\n\
  \n######### 危机沟通计划\n\n危机管理计划的一个关键组成部分是危机沟通计划（有时简称为沟通计划）：一项在破坏性事件发生时向员工和公众进行沟通的计划。通知受影响组织成员的说明是任何\
  \ BCP/DRP 不可或缺的一部分。\n\n####### 移动站点\n\n**移动站点** 是“轮子上的数据中心”：可拖拽的拖车，包含计算机设备机架，以及\
  \ HVAC（供暖、通风与空调）、火灾抑制和物理安全系统。它们非常适合数据中心洪水等灾难，即数据中心受损但设施其余部分及周边财产完好无损的场景。它们可被拖拽至现场，接入电力和网络，并上线运行。\n\
  \n移动数据中心通常放置在物理财产边界内，并受到围栏、大门和安全摄像头等防御措施的保护。另一个优势是人员可以前往其主要站点和办公室报到。\n\n#######\
  \ 订阅服务\n\n一些组织通过支付费用让另一家公司执行这些服务，从而将其 BCP/DRP 规划和/或实施外包。这实际上将风险转移给了承保公司。这基于一个简单的保险模型，公司建立了利润模型并为客户提供\
  \ BCP/DRP 保险服务。云启用的灾难恢复服务提供商变得越来越普遍，甚至拥有了自己的云化术语：DRaaS（灾难恢复即服务）。\n\n\n\n\n人们常说坏消息传播得快。此外，在灾后信息真空期，错误信息往往会填补空白。公共关系专业人士了解这一风险，并知道要始终如一地提供组织的“官方说法”，即使几乎没有什么可说的。所有与公众的沟通都应通过高级管理层或公共关系团队进行。\n\
  \n######## 呼叫树\n\n危机沟通计划利用的员工沟通关键工具是**呼叫树**，用于在整个组织内快速传达消息，而不会给任何特定个人造成过重负担。呼叫树的工作原理是给每位员工分配少量其他员工，由他们负责在紧急事件中呼叫这些人。例如，组织总裁可能会通知其董事会有关紧急情况，董事会成员随即通知其顶层管理人员。顶层管理人员再呼叫分配给他们的员工。呼叫树持续下去，直到联系到所有受影响的人员。\n\
  \n当存在双向的成功通信报告时，呼叫树最为有效。例如，每位董事会成员会在其分配的呼叫树接收者均已被联系，且这些接收者已与其下属人员取得联系后，向总裁汇报。请记住，在灾难期间手机和固定电话可能会变得拥堵或不可用：呼叫树应包含备用联系方式，以防主要方式不可用。\n\
  \n呼叫树在提前规划并至少每年演练一次时效果最佳。电话号码会变，员工职位会变，联系信息会过时。例行演练配合文档化的程序和汇报链，可使呼叫树的功能保持在最佳水平。图\
  \ 8.21 展示了一个典型的呼叫树。在该示例中，一位高层管理人员激活呼叫树，呼叫三位一线管理人员。每位一线管理人员呼叫其负责的员工。\n\n![图 8.21\
  \ 呼叫树。](img/f08-21-9780443187346.jpg)\n\n图 8.21 呼叫树。\n\n######## 自动呼叫树\n\n自动呼叫树在破坏性事件发生后自动联系所有\
  \ BCP/DRP 团队成员。第三方 BCP/DRP 服务提供商可能提供此服务。自动呼叫树填充了团队成员的主要电话、手机、传呼机、电子邮件和/或传真。\n\n\
  授权成员可通过电话、电子邮件或 Web 事务激活呼叫树。一旦触发，所有 BCP/DRP 成员将被自动联系。系统可要求对消息接收进行肯定验证，例如“按 1 确认收到”。这解决了由语音信箱应答消息的问题。其他系统可能自动将成员接入会议桥接：“按\
  \ 1 加入 BCP/DRP 会议。”此功能可大大降低与团队成员沟通所需的时间。\n\n自动呼叫树托管在异地，通常由第三方 BCP/DRP 提供商支持。这提供了额外的通信保护：第三方公司不太可能受灾难影响，这意味着即使客户组织的通信系统已失效，自动呼叫树仍有可能正常工作。\n\
  \n######## 应急运作中心 (EOC)\n\n**应急运作中心 (EOC)** 是在紧急事件期间或刚刚发生后建立的指挥所。EOC 的位置取决于可用资源。对于大型组织，EOC\
  \ 可能距离物理灾难现场很远；然而，保护生命和人员安全始终是至关重要的。\n\n######## 关键记录\n\n关键记录应存储在异地，位置和格式应允许在灾难期间访问。最佳实践是所有关键记录都同时拥有电子版和硬拷贝版本。\n\
  \n关键记录包括所有关键员工的联系信息。其他关键记录包括许可信息、支持合同、服务级别协议、互惠协议和电信电路 ID。\n\n######### 高管继任计划\n\
  \n组织必须确保在灾难期间始终有高管可用以做出决策。**高管继任计划** 确定组织的继任顺序。高管可能因多种原因而无法履职，范围涵盖受伤和生命损失、罢工、旅行限制和医疗隔离。\n\
  \n常见的高管继任计划错误是允许整个高管团队在异地参加遥远的会议。若在高管团队在异地时发生交通中断（如 2001 年 9 月 11 日后美国发生的航班中断），公司总部可能会失去任何决策能力。最简单的高管权力之一是背书支票和筹集资金的能力。\n\
  \n##### 实例学习\n\n美国政府高管继任计划\n\n美国政府的总统继任顺序是全国层面高管继任计划的结果：“每当美国总统职位因‘免职……死亡或辞职’而空缺时，宪法规定‘副总统应成为总统。’当副总统职位因任何原因空缺时，总统提名继任者，须经国会两院多数票确认。如果这两个职位同时空缺，则根据\
  \ 1947 年继任法，众议院议长在辞去众议员和议长职务后成为总统。如果议长职位也空缺，则参议院临时议长在辞去参议员和临时议长职务后成为总统。如果这两个职位均空缺，或现任者因任何原因不合格，则内阁官员按法律规定的顺序继任（3\
  \ U.S.C. §19，见表 3）。在任何情况下，潜在继任者必须在其前任职位上正式宣誓就职，并必须满足总统职位的其他宪法要求，即年龄至少 35 岁” [[19]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0100)。\n\
  \n美国继任顺序依次包括：副总统、众议院议长、参议院临时议长、国务卿、财政部长、国防部长、司法部长、内政部长、农业部长、商务部长、劳工部长、卫生与公众服务部长、住房与城市发展部长、交通部长、能源部长、教育部长、退伍军人事务部长和国土安全部长。\n\
  \n美国政府深知确保高管在灾难发生时保持掌权的关键性，无论灾难多具破坏性。大多数组织的继任链会更短，但在高管继任规划期间应始终考虑最坏情况。\n\n#######\
  \ 计划批准\n\n现在初步 BCP/DRP 计划已完成，高级管理层批准是必需的下一步。保护组织的关键资产和人员最终是高级管理层的责任。鉴于其复杂性，BCP/DRP\
  \ 计划将代表许多个人和许多业务线的集体工作。高级管理层必须理解他们对该计划负责，充分理解该计划，拥有其所有权，并确保其成功。\n\n### 备份与可用性\n\n\
  \n\n虽然备份技术也是本章前面讨论的“容错”部分审查的内容之一，但如果业务连续性和灾难恢复规划的讨论不涉及备份和可用性规划技术，那将是不完整的。为了能够成功恢复关键业务运营，组织需要能够有效且高效地备份和恢复系统和数据。尽管许多组织都勤奋地执行创建备份的过程，但对这些备份方法的可恢复性进行验证至少同等重要，却常被忽视。当对特定备份解决方案的详细恢复流程进行彻底审查时，一些具体要求将变得显而易见。在讨论针对灾难恢复和业务连续性的备份时，最重要的一点是确保关键备份介质存储在异地。此外，该异地位置的选址应确保在灾难事件发生期间，组织能够高效地访问介质，以便将其运送至主要或次要恢复地点。\n\
  \n除了高效访问所用备份介质这一考量因素外，还需考虑能否在主要或次要恢复设施实际恢复上述介质。在大多数灾难期间，快速采购用于读取专用、高速、大容量磁带解决方案的大型高端磁带驱动器是不可行的。然而，许多恢复解决方案要么完全忽略这一事实，要么错误地将迅速采购的预期纳入其\
  \ MTTR（平均修复时间）计算中。\n\n由于许多组织的 MTD（最大容忍停机时间）计算不断缩减，有些系统现在甚至要求持续可用性（MTD 为零），组织通常必须审查其现有的备份范式，以确定标准解决方案的\
  \ MTTR 是否超过了所涵盖系统的 MTD。如果 MTTR 大于 MTD，则必须采用替代的备份或可用性方法。虽然传统磁带解决方案速度越来越快、容量越来越大，但对于某些关键系统，面向磁带的备份和恢复解决方案可能不可行，因为获取必要磁带并从磁带中提取相关系统镜像和/或数据所需的漫长恢复时间。\n\
  \n> **注意**\n>\n> 在考虑系统和数据的备份与可用性时，务必解决软件许可方面的考量。虽然某些供应商仅要求针对同一时间实际在用的产品总数进行授权，这可以适应涉及故障转移操作的某些恢复场景，但其他供应商则要求为每个可能被使用的系统购买完整许可。此外，在恢复回主要计算设施时，主要和次要系统同时在线是常见情况，即使通常不是这种情况，也要考虑供应商是否期望为这两个系统都购买完整许可。关于许可和恢复的另一点是，许多供应商允许使用更便宜的许可来覆盖主动-被动集群中的热备用、热待机、故障转移或被动系统，前提是在任何给定时间只有一个系统在处理任务。个别供应商许可条款的复杂性和细微差别远超出了本书和\
  \ CISSP® 考试的范围，但务必确定实际的许可需求，以合法地满足恢复要求。\n\n#### 硬拷贝数据\n\n如果发生破坏性事件（如自然灾害）导致本地电网瘫痪，且电力依赖成问题，组织有可能仅使用硬拷贝数据来运行最关键的职能。`硬拷贝数据`\
  \ 是指通过在纸上阅读或书写来访问的任何数据，而非通过计算机系统处理。\n\n在佛罗里达州、密西西比州和路易斯安那州等易发天气紧急情况的地区，许多企业制定“纯纸质”灾难恢复计划，这将允许它们仅凭数据的硬拷贝、电池供电的计算器和其他小型电子设备，以及笔和铅笔来运行关键核心流程。其中一个组织是负责佛罗里达奥兰多地区公共巴士运营的\
  \ Lynx 公交系统。如果自然灾害导致公用设施和电力中断，该系统已制定流程，所有巴士运营将转为纸笔记录保存，直到电力恢复。\n\n#### 电子备份\n\n\
  `电子备份` 是指以电子方式存储的归档，可在破坏性事件或灾难发生时检索。选择正确的数据备份策略取决于用户如何存储数据、资源和连接的可用性，以及组织的最终恢复目标。\n\
  \n预防性恢复是一项推荐的控制措施：恢复数据以测试备份过程的有效性。如果一个可靠的系统（如大型机）多年来每天都将数据复制到磁带，组织如何确信该过程在正常工作？这些磁带（及其包含的数据）是否具有完整性？\n\
  \n许多组织在最糟糕的时刻发现备份问题：在发生运营数据丢失之后。预防性恢复可以在数据丢失前发现问题。\n\n##### 完全备份\n\n完全系统备份意味着每一条数据都被复制并存储在备份存储库中。执行完全备份耗时、消耗带宽且占用资源。然而，完全备份能确保任何必要的数据都得到保障。\n\
  \n##### 增量备份\n\n增量备份归档自上次完全备份或增量备份以来发生变化的数据。例如，某站点每周日执行完全备份，周一至周六执行每日增量备份。如果在周三增量备份后发生数据丢失，恢复需要四盘磁带：周日的完全备份，以及周一、周二和周三的增量备份。\n\
  \n##### 差异备份\n\n差异备份的运作方式与增量备份类似，但有一个关键区别。差异备份归档自上次完全备份以来发生变化的数据。\n\n例如，前面示例中的同一站点改用差异备份。它们在周三差异备份后丢失数据。现在恢复只需要两盘磁带：周日的完全备份和周三的差异备份。\n\
  \n##### 磁带轮换方法\n\n一种常见的磁带轮换方法称为 `FIFO`（先进先出）。假设你每天执行完全备份，总共有 14 盘可重写磁带。`FIFO`（也称为循环轮换）意味着你将按顺序使用每盘磁带，第\
  \ 14 盘用完后循环回第一盘。这确保了归档了 14 天的数据。该计划的缺点是你仅保留 14 天的数据：如果你想恢复 3 周前意外删除的文件，此计划无济于事。\n\
  \n`祖父-父亲-儿子`（GFS）解决了这个问题。共有 3 组磁带：7 盘每日磁带（儿子）、4 盘每周磁带（父亲）和 12 盘每月磁带（祖父）。每周一盘儿子磁带晋升为父亲磁带。每\
  \ 5 周一盘父亲磁带晋升为祖父磁带。运行一年后，此方法确保有过去 7 天的每日备份磁带、过去 4 周的每周磁带、以及过去 12 个月的每月磁带可用。\n\n\
  ##### 电子存储\n\n\n\n###### 电子保管库\n\n*Electronic vaulting*（电子保管库）是一种批量过程，按例行的、定期计划的时间间隔，以电子方式传输待备份的数据。它用于将大量信息传输到异地设施。有许多商业可用的工具和服务可以为组织执行电子保管库操作。电子保管库是每天甚至可能每小时需要备份的数据的良好工具。它同时解决了两个问题：将敏感数据存储在异地，并能以极短的间隔执行备份，以确保备份的是最新数据。\n\
  \n由于电子保管库在大多数情况下通过互联网进行，因此通过安全通信信道发送用于备份的信息，并通过强加密协议进行保护非常重要。\n\n##### 远程日志记录\n\n\
  数据库日志包含所有数据库事务的日志。日志可用于从数据库故障中恢复。假设每小时保存一个数据库检查点（快照）。如果数据库在检查点后 20 分钟丢失完整性，则可以通过恢复到该检查点，然后应用数据库日志中描述的所有后续事务来恢复。\n\
  \n*Remote Journaling*（远程日志记录）将数据库检查点和数据库日志保存到远程站点。如果主站点发生故障，可以恢复数据库。\n\n##### 数据库影子\n\
  \n数据库影子使用两个或更多相同的数据库，它们同时更新。影子数据库可以本地存在，但最佳实践是将一个影子数据库托管在异地。数据库影子的目标是大大减少数据库实现的恢复时间。与远程日志记录相比，数据库影子允许更快的恢复。\n\
  \n##### 高可用性选项\n\n越来越多的系统要求实际上具有零停机时间，即 `MTD` 为零。磁带上的数据恢复当然无法满足这些可用性需求。一旦发生故障或灾难，需要立即可用的备用系统。实现这种正常运行时间要求的常用方法是采用高可用性集群。\n\
  \n> **Note**（注意）\n>\n> 不同供应商对同一原则（即在发生故障时拥有主动处理或可用于处理的冗余系统）使用不同的术语。尽管具体实现可能略有不同，但持续可用性的总体目标通常通过类似（尽管不完全相同）的方法来实现，即使术语不尽相同。\n\
  \n高可用性集群的目标是减少系统或网络设备的恢复时间，使服务的可用性受到的影响小于重建、重新配置或以其他方式设置替换系统所造成的影响。存在两种典型的部署方法：\n\
  \n*   **Active-active cluster（主动-主动集群）**：涉及多个系统，所有系统均在线并主动处理流量或数据。这种配置也通常称为负载均衡，在面向公众的系统（如\
  \ Web 服务器场）中尤为常见。\n*   **Active-passive cluster（主动-被动集群）**：涉及已就位、已配置、已通电并准备好在主系统发生故障时开始处理网络流量的设备或系统。主动-被动集群通常设计为将主系统或设备上所做的任何配置更改复制到备用系统。此外，为了加快服务恢复，许多故障转移集群设备将在无需用户交互的情况下，自动在次要系统上开始处理服务，前提是中断影响了主设备。它也可以称为热备用、备用或故障转移集群配置。\n\
  \n#### 软件托管\n\n随着将软件和应用程序开发外包给第三方变得普遍，组织必须确保即使最初开发软件的供应商倒闭，其应用程序的可用性也能得到维护。代表其他组织开发产品的供应商可能会因知识产权和竞争优势顾虑，而不愿向客户透露其应用程序的源代码。这两个实体之间的一个共同中间立场是：应用程序开发公司允许中立的第三方持有源代码。这种方法称为\
  \ *software escrow*（软件托管）。如果开发组织倒闭或以其他方式违反软件托管协议条款，持有托管的第三方将向采购组织提供源代码和任何其他信息。\n\
  \n### DRP 测试、培训和意识\n\n必须为 BCP/DRP 的“灾难”部分执行测试、培训和意识建设。跳过这些步骤是最常见的 BCP/DRP 错误之一。一些组织“完成”了他们的\
  \ DRP，然后认为事情解决了，把厚厚的 DRP 文件夹放在架子上积灰。这种做法在许多层面上都是错误的。\n\n首先，DRP 永远不会“完成”，而是一种不断修正的方法，旨在确保组织能够以可接受的方式恢复。其次，虽然善意的个人执行\
  \ DRP 的创建和更新，但即使是最勤勉的管理员也会犯错。为了在实际灾难中阻碍恢复之前发现并纠正这些问题，必须定期进行测试。第三，任何有效的 DRP 都将包含一些管理员必须执行的固有复杂操作和机动。灾难期间总会发生意外情况，但\
  \ DRP 的每个成员都应非常熟悉其在 DRP 中角色的细节，这要求对流程进行培训。\n\n最后，普通用户在 DRP 中角色的意识，以及组织在灾难发生时确保人员安全和业务运营的重点意识，是至关重要的。本节将提供有效测试、培训和建立组织\
  \ DRP 意识的步骤详情。\n\n#### DRP 测试\n\n为了确保灾难恢复计划代表一个可行的恢复计划，需要进行彻底的测试。考虑到 DRP 详细的战术主题，常规基础设施、硬件、软件和配置更改将改变\
  \ DRP 的执行方式，这不足为奇。组织的信息系统处于不断变化的状态，但遗憾的是，许多这样的更改并没有及时纳入更新后的 DRP。为了确保 DRP 作为一种可行的恢复方法的初始和持续有效性，需要执行测试。\n\
  \n下面将讨论不同类型的测试及其相关的优缺点。然而，至少无论选择哪种类型的测试，这些测试都应每年执行一次。许多组织可以、应该并确实更频繁地测试其 DRP，这是值得赞扬的。\n\
  \n##### DRP 评审\n\nDRP 评审是最基本的初始 DRP 测试形式，重点是通读整个 DRP 以确保覆盖面的完整性。此评审通常由制定计划的团队执行，涉及团队成员通读整个计划，以快速审查总体计划是否存在明显缺陷。DRP\
  \ 评审主要只是一个合理性检查，以确保覆盖面中没有明显的遗漏或方法上的根本缺陷。\n\n##### 通读/桌面演练\n\n\n\n\n###### 通读（清单/一致性）测试\n\
  \n通读测试（也称为清单或一致性测试）列出了成功恢复所需的所有必要组件，并确保它们已就绪，或将在灾难发生时随时可用。例如，如果灾难恢复计划要求在备用计算设施从磁带备份重建系统，相关站点是否备有足够数量的磁带驱动器，以便在规定的时间窗口内完成恢复。通读测试的重点在于确保组织拥有，或能及时获取其成功恢复所依赖的足够资源水平。\n\
  \n###### 桌面演练\n\n桌面演练代表了一种更彻底的通读测试类型，负责恢复的团队成员将以结构化的方式讨论拟议的恢复程序，以确定是否存在任何明显的遗漏、差距、错误假设，或仅仅是会阻碍恢复过程成功进行的技术失误。与基本通读测试一样，桌面演练仍然仅涉及会议室中的人员讨论恢复过程。桌面演练的一个显著特征是使用紧急情况或灾难场景来驱动恢复过程的讨论。可以采用各种灾难场景，以确保尽管可能存在不同的紧急状况，但仍具有足够的覆盖范围。\n\
  \n##### 演练\n\n演练测试旨在通过要求人员逐步执行与恢复相关的物理动作，确保物理限制已被有效纳入考量。增加物理考量因素可以识别出在仅讨论的通读测试或桌面测试方法中可能不明显的缺陷。\n\
  \n##### 模拟测试\n\n*模拟测试*超越了对过程的讨论，实际上让团队执行恢复过程。模拟一场假想的灾难，团队必须按照灾难恢复计划（DRP）的指示做出响应。模拟的范围差异很大，并且随着较小规模的灾难模拟得到成功管理，模拟往往会变得更加复杂，并涉及更多系统。虽然有人认为目标是能够成功恢复受模拟影响的系统，但最终，对\
  \ DRP 进行任何测试的目标都是帮助确保组织在发生实际灾难时做好充分准备。\n\n##### 并行处理\n\n另一种 DRP 测试类型是*并行处理*。这种测试常见于事务数据是关键业务处理核心组件的环境中。通常，此测试将涉及在备用计算设施恢复关键处理组件，然后从之前的备份中恢复数据。请注意，常规生产系统不会中断。\n\
  \n随后，备份次日的事务将针对新恢复的数据运行，对于相关日期，正常运营期间获得的相同结果应由恢复系统的结果所镜像。高度依赖大型机和中型机系统的组织通常会采用这种类型的测试。\n\
  \n##### 部分和完全业务中断\n\n可以说，所有 DRP 测试中保真度最高的是*业务中断测试*。然而，这种测试实际上可能导致灾难，因此在尝试实际中断测试之前应极其谨慎。顾名思义，业务中断风格的测试将让组织实际停止在主站点的正常业务处理，转而利用备用计算设施。这些类型的测试在已存在完全冗余、通常是负载均衡操作的组织中更为常见。\n\
  \n> **注意**\n>\n> 每种 DRP 测试方法的复杂性和成本各不相同，较简单的测试成本较低。以下是按成本和复杂性从低到高排序的计划：\n>\n> *\
  \   DRP 评审\n> *   通读/清单/一致性/桌面演练\n> *   结构化演练\n> *   模拟测试\n> *   并行处理\n> *   部分中断\n\
  > *   完全业务中断\n\n#### 培训\n\n尽管执行上述测试的过程中包含 DRP 培训的因素，但确实有必要对 DRP 流程的某些具体要素进行更详细的培训。培训的另一个方面是确保员工中有足够比例的人员接受过基本急救和心肺复苏（CPR）培训。\n\
  \n##### 启动应急电源\n\n尽管这看似简单，但将数据中心切换到应急电源（例如在 UPS 故障时开始承担负载的备用发电机）绝不可掉以轻心。应定期执行切换到应急电源的具体培训和测试。\n\
  \n##### 呼叫树培训/测试\n\n另一个结合培训和测试的示例涉及呼叫树，这在前文的“呼叫树”部分已讨论过。呼叫树的层级关系可能导致树中的中断变得棘手。承担呼叫责任的个人通常被期望能在极短的时间内接听，或做出其他安排。\n\
  \n#### 意识/宣贯\n\n即使对于那些在整体恢复过程中几乎没有主动角色的成员，仍然需要确保组织的所有成员都意识到组织在灾难发生后对安全和业务生存能力的优先排序。意识培训有助于解决这些问题。\n\
  \n> **注意**\n>\n> DRP 培训和意识宣贯还必须涉及员工在对人员安全构成威胁的破坏性事件中所扮演的角色。疏散程序就是这种必要培训和意识宣贯的一个例子。有关直接与安全顾虑相关的培训和意识宣贯的更多信息，请参阅第\
  \ 4 章“领域 3：安全架构与工程”中的“人员安全培训与意识”部分。\n\n### 持续的 BCP/DRP 维护\n\n一旦初始的 BCP/DRP 计划完成、测试、培训并实施，就必须保持其最新状态。业务和\
  \ IT 系统变化迅速，IT 专业人员习惯于适应这种变化。BCP/DRP 计划必须跟上所有关键业务和 IT 变化的步伐。\n\n#### 变更管理\n\n变更管理流程在本章前文已深入讨论。该流程旨在确保在系统引入、更改和更新时，安全性不受不利影响。变更管理包括跟踪和记录所有计划变更、对重大变更进行正式批准，以及记录已完成变更的结果。所有变更必须可审计。\n\
  \n变更控制委员会管理此流程。BCP 团队应成为变更控制委员会的成员，并参加所有会议。BCP 团队参与变更控制委员会的目标是识别任何必须由 BCP/DRP 计划处理的变更。\n\
  \n#### BCP/DRP 版本控制\n\n一旦业务连续性计划及相关计划（如灾难恢复计划）完成，它们将例行更新。BCP 和相关计划所记录的系统的任何业务或运营变更必须反映在更新后的计划中。版本控制变得至关重要。例如：处理灾难的团队不应使用过时的\
  \ DRP 副本进行工作。\n\n\n\n\n任何对核心 BCP/DRP 计划的更新都应发送给所有 BCP/DRP 团队成员。更新应包含明确的作废部分，以消除关于哪个版本的计划生效的任何歧义。许多\
  \ DRP 成员会将计划的纸质副本保存在活页夹中：必须有一个流程来管理印刷材料的更新。\n\n##### BCP/DRP 错误\n\n业务连续性和灾难恢复规划是企业防止失败的最后一道防线。如果其他控制措施失效，BCP/DRP\
  \ 就是最终的控制。如果它失效，企业可能就会倒闭。\n\nBCP/DRP 的成功至关重要，但许多计划会失败。BCP 团队应考虑其他组织计划失败的教训，并严格审视自己的计划。他们应该自问：“我们是否犯了威胁我们计划成功的错误？”\n\
  \n常见的 BCP/DRP 错误包括：\n\n*   缺乏管理层支持\n*   缺乏业务单元参与\n*   关键人员缺乏优先级划分\n*   范围不当（通常过于狭窄）\n\
  *   电信管理不善\n*   供应链管理不善\n*   危机管理计划不完整或不充分\n*   缺乏测试\n*   缺乏培训和意识\n*   未能保持 BCP/DRP\
  \ 计划的最新状态\n\n#### 具体的 BCP/DRP 框架\n\n鉴于各种 BCP/DRP 框架使用的重叠术语和流程拼凑而成，本章侧重于通用最佳实践，而不试图映射各种\
  \ BCP/DRP 框架描述的许多不同（且有时不一致）的术语和流程。\n\n有几个具体框架值得讨论，包括 `NIST SP 800-34`、`ISO/IEC-27031`\
  \ 和 `BCI`。\n\n##### NIST SP 800-34\n\n美国国家标准与技术研究院（`NIST`）特别出版物 800-34 修订版 1《联邦信息系统应急规划指南》可在\
  \ <https://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-34r1.pdf>\
  \ 下载。该文档质量高且属于公共领域。在编写或更新 BCP/DRP 时参考 `SP 800-34`，有时可以显著改进计划。\n\n##### ISO/IEC-27031\n\
  \n*`ISO/IEC-27031`* 是 `ISO 27000` 系列的一部分的新指南，该系列还包括 `ISO 27001` 和 `ISO 27002`（在领域\
  \ 2：资产安全中讨论）。`ISO/IEC 27031` 侧重于 BCP（DRP 由另一个框架处理；见下文）。\n\n正式名称为“`ISO/IEC 27031:2011\
  \ 信息技术——安全技术——信息和通信技术业务连续性就绪指南`。”根据 <https://www.iso27001security.com/html/27031.xhtml>，`ISO/IEC\
  \ 27031` 旨在：\n\n*   “为任何组织——私营、政府和非政府组织——提供一个框架（方法和流程）；\n*   识别并规定所有相关方面，包括性能标准、设计和实施细节，以提高\
  \ ICT 就绪度，作为组织 ISMS 的一部分，帮助确保业务连续性；\n*   使组织能够以一致且公认的方式衡量其连续性、安全性，从而衡量其在灾难中生存的就绪程度”\
  \ [\\[20\\]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0105)。\n\n`ISO/IEC 27031`\
  \ 使用的术语和首字母缩略词包括：\n\n*   `ICT`——信息和通信技术\n*   `ISMS`——信息安全管理体系\n\n单独的用于灾难恢复的 ISO\
  \ 计划是 `ISO/IEC 24762:2008`，“信息技术——安全技术——信息和通信技术灾难恢复服务指南。”更多信息请访问 <https://www.iso.org/standard/41532.xhtml>。\n\
  \n##### BS-25999 和 ISO 22301\n\n英国标准协会（`BSI`，<https://www.bsigroup.com/>）发布了 `BS-25999`，分为两部分：\n\
  \n*   “第 1 部分，实践守则，提供业务连续性管理最佳实践建议。请注意，这仅是一份指导文件。\n*   第 2 部分，规范，提供基于 BCM 最佳实践的业务连续性管理体系（`BCMS`）要求。这是您可以用来通过审核和认证流程证明合规性的标准部分”\
  \ [\\[21\\]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0110)。\n\n`BS-25999-2`\
  \ 已被 `ISO 22301:2012 社会安全——业务连续性管理体系——要求` 取代。“`ISO 22301` 将取代原英国标准 `BS 25999-2`，并建立在该标准的成功和基础之上。`BS\
  \ ISO 22301` 规定了为任何组织建立和管理有效业务连续性管理体系（`BCMS`）的要求，无论其类型或规模。`BSI` 建议每个企业都建立一套系统，以避免中断事件发生时出现过度停机和生产力下降”\
  \ [\\[22\\]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0115)。\n\n比较 `ISO 27031`（在上一节讨论）和\
  \ `ISO 22301`，`ISO 27031` 侧重于技术细节：“`ISO 22301` 涵盖整个业务的连续性，将任何类型的事件视为潜在的中断源（例如流行病、经济危机、自然灾害等），并使用计划、政策和程序来预防、应对和恢复由它们引起的中断。这些计划、政策和程序可分为两大类：当业务受中断事件影响时维持运营的措施，以及当\
  \ ICT 受中断时恢复信息和通信基础设施的措施。\n\n因此，您可以将 `ISO 27031` 视为实施 `ISO 22301` 技术部分的工具，提供关于如何处理\
  \ ICT 元素连续性的详细指导，以确保组织的流程向客户交付预期结果” [\\[23\\]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0120)。\n\
  \n##### BCI\n\n业务连续性协会（`BCI`，<https://www.thebci.org/>）发布了六步良好实践指南（`GPG`），最近一次更新在\
  \ 2013 年：“良好实践指南（`GPG`）是全球良好业务连续性实践的独立知识体系。它们代表了当前全球良好业务连续性（`BC`）实践的思维，现在包含来自 `ISO\
  \ 22301:2012` 的术语，即业务连续性管理体系国际标准” [\\[24\\]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0125)。`GPG\
  \ 2013` 描述了六项专业实践（`PP`）。\n\n*   管理实践\n    *   `PP1` 策略与项目管理\n    *   `PP2` 融入业务连续性\n\
  *   技术实践\n    *   `PP3` 分析\n    *   `PP4` 设计\n    *   `PP5` 实施\n    *   `PP6` 验证\
  \ [\\[25\\]](#Ch008_361-457_B9780443187346000064_2.xhtml#bb0130)\n\n### 考试目标总结\n\
  \n在本章中，我们讨论了运营安全。运营安全关注系统和数据在生产环境中主动使用时的安全性。归根结底，运营安全关乎人员、数据、介质和硬件，所有这些都是需要从安全角度考虑的要素。如果没有预防或检测控制措施，世界上最好的技术安全基础设施也会因拥有特权访问权限的个人决定背叛组织而变得毫无用处。\n\
  \n我们还讨论了业务连续性和灾难恢复规划，它们作为组织防止失败的最后一项控制。在所有控制中，失败的 BCP 或 DRP 破坏性最大，可能导致组织倒闭，或造成人员伤亡。\n\
  \n\n\n\n除了降低此类严峻风险之外，业务连续性规划和灾难恢复规划已演变为能为组织提供真正的业务价值，即使在没有灾难发生的情况下也是如此。构建全面的 BCP/DRP\
  \ 所需的组织尽职调查，可以通过彻底了解关键业务流程、资产追踪、审慎的备份与恢复策略以及标准的使用，带来诸多红利。将风险映射到关键业务流程，可导致在任何灾难发生前采取预防性风险措施，这一过程可能完全避免未来的灾难。\n\
