  \n\n### 第 3 章：领域 2：资产安全\n\n## 摘要\n\n资产安全领域侧重于诸如数据分类许可、标签、保留和数据所有权等控制措施。本文讨论了数据残留，包括新增的可考核内容，如固态硬盘（`SSDs`）的残留特性，`SSD`\
  \ 是 `EEPROM` 和 `RAM` 的结合体，其残留特性与磁性驱动器截然不同。该领域包含对控制确定的讨论，包括范围界定和裁剪。最后将讨论知名标准，包括 `PCI-DSS`\
  \ 和 `ISO 27000` 系列。\n\n### 关键词\n\n随机存取存储器；残留；参考监视器；只读存储器；固态硬盘；裁剪；云访问安全代理\n\n本章考试目标：\n\
  \n*   数据分类\n*   所有权与资产清单\n*   内存与残留\n*   数据销毁\n*   确定数据安全控制\n\n## 独特术语和定义\n\n* \
  \  `RAM`—随机存取存储器，易失性硬件内存，断电后失去完整性\n*   残留—数据在非侵入式删除手段之后仍然持久存在\n*   参考监视器—在主体和客体之间的所有访问中进行中介\n\
  *   `ROM`—只读存储器，非易失性内存，断电后保持完整性\n*   范围界定—确定组织将采用标准中哪些部分的过程\n*   `SSD`—固态硬盘，闪存（`EEPROM`）和\
  \ `DRAM` 的结合体\n*   裁剪—为组织定制标准的过程\n\n## 简介\n\n资产安全（资产安全保护）领域侧重于诸如数据分类许可、标签、保留和数据所有权等控制措施。我们将讨论数据残留，包括新增的可考核内容，如固态硬盘（`SSDs`）的残留特性，`SSD`\
  \ 是 `EEPROM` 和 `RAM` 的结合体，其残留特性与磁性驱动器截然不同。该领域最后将讨论控制确定，包括标准、范围界定和裁剪。\n\n## 数据分类\n\
  \n数据分类已存在数千年。公元 678 年，君士坦丁堡的守军首次使用希腊火抵御入侵舰队。这种液体从城墙发射，能在水面燃烧。“希腊火的成分和用途是一个随拜占庭帝国灭亡而失传的国家机密，事实上在拜占庭帝国走完其历程很久之前就已消失。直到今天，尽管化学家和历史学家曾反复尝试从零碎的历史记载中辨明其性质，但历史学家们仍无法就希腊火的成分和用途达成一致”\
  \ [\\[1\\]](#Ch003_81-105_B9780443187346000118.xhtml#bb0010)。请注意，数据分类是可考核的，但这个历史示例不可考核。\n\
  \n访问控制的日常管理需要对标签、许可、正式访问批准和知悉必要性进行管理。这些正式机制通常用于保护高度敏感的数据，如政府或军事数据。\n\n### 标签\n\n\
  客体拥有标签，正如我们在下一节将看到的，主体拥有许可。一个关键的安全步骤是定位敏感信息，并将其标记或标记为敏感的过程。数据的标记方式应与组织的数据分类方案相对应。\n\
  \n许多世界各国政府使用的客体标签包括机密、秘密和绝密。根据第 12356 号行政命令——国家安全信息：\n\n*   “绝密”应适用于未经授权披露后合理预期会对国家安全造成极其严重损害的信息。\n\
  *   “秘密”应适用于未经授权披露后合理预期会对国家安全造成严重损害的信息。\n*   “机密”应适用于未经授权披露后合理预期会对国家安全造成损害的信息 [\\\
  [2\\]](#Ch003_81-105_B9780443187346000118.xhtml#bb0015)。\n\n\n\n\n### 文档标题\n\n本文描述了分类标准。给对象应用标签的安全管理员必须遵循这些标准。还存在其他标签，如非密（非敏感数据）、SBU（敏感但非密）和仅供官方使用（FOUO）。SBU\
  \ 描述非国家安全事项的敏感数据，如现役人员的医疗记录。即使发布这些数据通常不会导致国家安全问题，也必须对其进行保护。\n\n私营部门公司使用“仅供内部使用”和“公司专有”等标签。\n\
  \n### 安全隔区\n\n隔区允许对高度敏感信息进行额外控制。这称为敏感隔区信息（SCI）。美国使用的隔区包括 HCS、COMINT (SI)、GAMMA (G)、TALENT\
  \ KEYHOLE (TK) 等（这些作为示例列出以说明隔区的概念；具体名称不可考）。这些隔区除需要正常的机密级许可（如绝密）外，还需要有据可查且经批准的“需知”权限。\n\
  \n### 许可\n\n*许可* 是对用户是否可被信任处理特定级别信息的正式裁定。许可必须确定主体当前及潜在的未来可信度；后者更难（且成本更高）评估。例如：是否存在债务、毒品或酗酒等问题，可能导致原本合乎道德的人违背职业操守？是否存在可被用来勒索此人的个人秘密？许可旨在做出这些裁定。\n\
  \n在许多国家政府中，这些许可级别分别对应机密、秘密和绝密等相应的对象标签。每个许可都需要无数调查和个人数据收集。收集完所有数据（包括个人信用评分、逮捕记录、对邻居和朋友的访谈等）后，行政法官将裁定该人是否可被信任处理美国国家安全信息。\n\
  \n### 正式访问批准\n\n*正式访问批准* 是数据所有者对主体访问特定对象的书面批准，要求主体了解访问数据的所有规则和要求，以及数据丢失、销毁或泄露的后果。\n\
  \n> **注意**\n>\n> 访问北大西洋公约组织（NATO）信息时，隔区信息称为“NATO Cosmic”。用户不仅需要具备查看 NATO 机密信息的许可，还需要获得\
  \ NATO 安全官员（数据所有者）的正式访问批准，才能查看 Cosmic 隔区信息。请注意，隔区是可考概念，但 Cosmic 隔区这一具体名称不可考。\n\n\
  ##### 需知\n\n需知是指回答这样一个问题：用户是否“需知”其可能试图访问的特定数据？在跨大型 IT 基础设施处理大量人群时，这是一个难题。大多数系统依赖最小权限原则，要求用户通过遵守策略来自我约束，仅尝试获取其“需知”的信息访问权。需知比最小权限更细粒度：最小权限通常将对象分组，而需知访问决策基于每个单独的对象。\n\
  \n### 敏感信息/介质安全\n\n尽管与企业内部人员相关的安全和控制至关重要，但建立处理敏感信息（包括介质安全）的规范化流程同样重要。本节讨论的概念是强大整体信息安全态势的重要组成部分。\n\
  \n#### 敏感信息\n\n所有组织都有需要保护的敏感信息，这些信息以物理形式驻留在某种介质上。除了主存储，备份存储也必须考虑在内。敏感信息也可能为使用而进行传输，无论是内部还是外部。无论数据存在何处，都必须有流程确保数据不被销毁或变得不可访问（可用性泄露）、不被泄露（机密性泄露）或不被篡改（完整性泄露）。\n\
  \n#### 处理\n\n处理敏感介质的人员应为经过组织审查的可信人员。他们必须了解自己在组织信息安全态势中的角色。敏感介质应有严格的处理策略。策略应要求包含详细记录负责人书面日志。历史上，备份介质给组织带来了重大问题。\n\
  \n#### 存储\n\n存储敏感信息时，最好对数据进行加密。静态数据加密极大地降低了因介质安全问题导致数据以未授权方式泄露的可能性。无论数据是否加密，包含敏感信息的介质的物理存储都不应随意进行。应采取措施，确保在任何可访问包含敏感信息介质的地方都有强有力的物理安全控制。\n\
  \n#### 保留\n\n介质和信息有有限的使用寿命。敏感信息的保留不应超出其效用期限或法律要求期限（以较长者为准），因为数据不再被组织需要时，继续保留会无谓地使数据面临泄露威胁。请记住，可能存在法规或其他法律原因，迫使组织在数据效用期过后仍保留此类数据。\n\
  \n## 所有权与资产清单\n\n信息安全需要所有资产的完整且最新的清单。每项资产都需要明确的企业所有权，以界定负责确保所有资产受保护的人员。主要信息安全角色包括业务/任务所有者、数据所有者、系统所有者、保管员和用户。每个角色在保护组织资产方面发挥不同作用。\n\
  \n### 资产清单\n\n有句老话：如果你不知道你拥有它，就无法保护它。所有资产的完整且最新的清单至关重要。资产是对组织有价值的事物。资产分两类：有形资产（如计算机、网络设备、电缆、显示器）和无形资产（如数据、知识产权、品牌声誉）。有形资产以物理形式存在，无形资产则不以物理形式存在。\n\
  \n识别组织中的所有计算机并确保它们得到适当保护（加固、打补丁、更新、监控、备份等）至关重要。这在过去较简单，但因物联网（IoT，详见第 4 章，领域 3：安全架构与工程）而变得复杂。“智能”电视和\
  \ VoIP（IP 语音）电话也是计算机。你的 IT 团队是否像保护其他计算机一样保护它们？许多 IT 组织忽略 IoT 设备和其他嵌入式设备，将它们视为简单的电视、电话等。这意味着它们未得到适当维护、未打补丁等。这可能给组织带来重大风险。\n\
  \n### 资产保留\n\n所有计算机系统都应通过适当的维护、更新、补丁等进行保护。需遵循两个关键指标：生命周期结束（EoL）和支持结束（EoS）。生命周期结束意味着供应商不再销售产品，但通常仍会支持一段时间。支持结束（也称为服务生命周期结束\
  \ EoSL）意味着供应商不再支持产品。这意味着无供应商提供的维护、补丁、更新等。此过程称为停止服务。\n\n\n\n组织必须跟踪所有资产的这两个日期，并在设备达到`End-of-Support`之前进行更换。超过该日期的设备将成为遗留设备，并可能给组织带来重大风险。许多组织仅关注关键资产，这可能是一个错误。不被视为关键的联网资产（如许多`IoT`设备）一旦被攻破，也可能给组织带来重大风险。这些设备本身可能并不关键，但它们可能通过一种称为“跳板攻击”的过程（详见第\
  \ 9 章，领域 8：软件开发安全）为关键资产提供网络访问路径。\n\n#### 业务所有者 / 任务所有者\n\n业务所有者和任务所有者（高级管理层）创建信息安全计划，并确保其拥有适当的人员配备、资金支持和组织优先级。他们负责确保所有组织资产得到保护。\n\
  \n#### 数据所有者\n\n数据所有者（也称为信息所有者）是负责确保特定数据受到保护的管理层员工。数据所有者确定数据敏感度标签和数据备份频率。他们关注数据本身，无论其以电子形式还是纸质形式存在。拥有多条业务线的公司可能有多个数据所有者。数据所有者执行管理职责；而保管人执行数据的实际保护工作。\n\
  \n> **考试警告**\n>\n> 不要将数据所有者与在自主访问控制系统（DAC）中“拥有”其数据的用户混淆（有关 DAC 或自主访问控制系统的更多信息，请参见第\
  \ 6 章，领域 5：身份与访问管理）。\n>\n> 数据所有者（大写“O”）负责确保数据受到保护。拥有数据的用户（小写“o”）对对象具有读/写访问权限。\n\n\
  #### 系统所有者\n\n系统所有者是负责存放数据的实际计算机的管理者。这包括硬件和软件配置，包括更新、补丁等。他们确保硬件物理安全、操作系统已打补丁且是最新的、系统已加固等。技术性的实际操作职责委派给保管人（下文讨论）。\n\
  \n> **注意**\n>\n> 系统所有者和数据所有者的区别很明确。系统所有者负责保护计算机硬件和软件。数据所有者负责保护计算机内包含的数据。\n>\n> 例如：对于数据库服务器，系统所有者将保护硬件和软件，包括为数据库管理系统（如`MySQL`或`Oracle`）打补丁。数据所有者将保护数据本身：数据库表中包含的敏感数据，如个人身份信息（`PII`）。\n\
  \n#### 保管人\n\n保管人对资产（如数据）提供实际保护。他们执行数据备份和恢复、系统打补丁、配置杀毒软件等。保管人遵循详细指令；他们不做关于数据如何保护的关键决策。数据所有者可能会规定：“所有数据必须每\
  \ 24 小时备份一次。”然后保管人将部署并运行满足数据所有者要求的备份解决方案。\n\n#### 用户\n\n用户必须遵守规则：他们必须遵守强制性策略、程序、标准等。例如，他们不得记录密码或共享账户。必须让用户意识到这些风险和要求。你不能假设他们知道该做什么，也不能假设他们已经在做正确的事：必须通过安全意识培训告知他们。他们还必须了解未能遵守强制性指令（如策略）的处罚。\n\
  \n#### 数据控制者和数据处理者\n\n*数据控制者*在组织内创建和管理敏感数据。人力资源员工通常是数据控制者：他们创建和管理敏感数据，如薪资福利数据、员工制裁报告。\n\
  \n*数据处理者*代表数据控制者管理数据。外包薪资公司就是数据处理者的一个例子。他们代表数据控制者（如人力资源部门）管理薪资数据（用于确定向个别员工支付的金额）。\n\
  \n#### 数据位置\n\n如前所述，完整且最新的所有资产清单至关重要。这包括有形资产（如计算机）和无形资产（如数据）。你知道所有敏感数据（包括个人身份信息）在哪里吗？它们可能在意想不到的地方。就像有形资产一样：如果你不知道你拥有它，你就无法保护它。这包括知道所有敏感数据的位置。\n\
  \n严格的策略应管辖敏感数据的存储位置。存储敏感数据的系统应要求多因素认证、增强监控、强大的基于主机的控制（如`HIPS`，主机入侵防御系统）等控制措施。\n\n\
  我们经常考虑系统的攻击面，它描述了所有可能导致妥协的向量。对于服务端攻击：这包括开放端口、监听服务、启用的协议等。考虑数据的攻击面同样重要。数据的攻击面随着每一份副本的存在而扩大。许多组织拥有同一敏感数据的多个副本，并且收集了过多的敏感数据，我们将在下一节讨论这一点。\n\
  \n> **实例学习**\n>\n> **收集不必要的敏感数据**\n>\n> 一位作者的客户制定了以下策略，用于在用户忘记密码后由服务台重置：致电服务台并告知其秘密单词（创建账户时设置），或亲自前往服务台并提供适当的身份证明。问题是什么？该组织使用员工母亲的婚前姓氏作为秘密单词。这是敏感数据。考虑到通常可以通过互联网搜索或`ancestry.com`等网站确定，它也是薄弱的。\n\
  >\n> 这是组织不必要地收集敏感数据的常见例子。作者建议更改策略以使用不同的（非敏感）秘密单词，包括提醒用户选择唯一的内容（不与任何其他系统共用），且不可通过互联网搜索等技术发现。\n\
  \n#### 数据维护\n\n数据维护描述了在日常基础上保护数据的操作流程。该流程始于敏感数据创建时，终于其销毁时（我们将很快讨论数据销毁）。这包括保管人的备份和恢复活动、使用加密、监控数据的正确使用。一旦实施了控制数据存储位置的策略（详见前文“数据位置”节），应使用检测性控制来检测位于批准系统之外的敏感数据。电子邮件是常见的违规来源。跨组织拥有的所有存储（磁盘、存储区域网络、电子邮件等）进行简单的关键字搜索，对于发现位于违反策略区域的敏感数据非常有效。数字版权管理（`DRM`）和数据丢失防护（`DLP`）可在此过程中使用，下文将讨论。\n\
  \n### 数据丢失防护\n\n\n\n\n## 数据丢失防护与内存残留\n\n### 数据丢失防护\n\n随着大规模、高关注度的数据泄露事件持续不断，对旨在解决数据丢失问题的解决方案的需求日益增长。数据丢失防护（DLP）是一类解决方案，其特定任务是尝试检测，或最好是防止数据以未授权的方式离开组织。DLP\
  \ 的方法差异很大。一种常见方法采用面向网络的工具，尝试检测和/或防止敏感数据以明文形式被泄露。这种方法很难解决通过加密通道泄露数据的可能性。通常，应对加密泄露的潜在风险需要端点解决方案，以便在加密前提供可见性。\n\
  \n#### 数字版权管理\n\n数字版权管理（DRM）旨在限制受版权保护材料和其他形式知识产权的使用。DRM 技术包括加密（通过数字签名提供机密性和不可抵赖性）、水印、产品密钥（或加密狗）以解锁软件、区域锁定等。\n\
  \n水印可以是可见的，也可以是不可见的。图 3.1 显示了《CISSP® 学习指南》早期电子版中的一个可见水印。不可见水印通常使用隐写术来隐藏数据。水印的一个目标是识别被不当共享的知识产品的购买者。请注意，我们将在第\
  \ 4 章（第 3 领域：安全架构与工程）中讨论加密、数字签名、隐写术（及更多内容）。\n\n![图 3.1 可见水印。](img/f03-01-9780443187346.jpg)\n\
  \n图 3.1 可见水印。\n\nDRM 备受争议，因为它常被用来限制合法所有者的权利。例如包括：持续在线 DRM（也称为持久在线激活：运行需要互联网连接的软件）、禁止打印或复制粘贴的电子书、基于\
  \ IP 的地理定位（阻止来自世界特定地区的在线服务访问）、软件复制保护（阻止购买者备份自己的软件）、DVD 区域锁定（阻止在世界某一地区购买的 DVD 在其他地区播放）等。\n\
  \n#### 云访问安全代理\n\nGartner 创造了云访问安全代理（CASB）这一术语，将其定义为：“部署在本地或基于云的安全策略执行点，位于云服务消费者和云服务提供商之间，在访问基于云的资源时结合并注入企业安全策略。CASB\
  \ 整合了多种类型的安全策略执行。示例安全策略包括身份验证、单点登录、授权、凭据映射、设备画像、加密、令牌化、日志记录、告警、恶意软件检测/防护等” [\\[3\\\
  ]](#Ch003_81-105_B9780443187346000118.xhtml#bb0020)。\n\nForcepoint 描述了 CASB 的支柱：\n\
  \n##### 可见性\n\n*   IT 部门未知的云应用会导致信息资产处于失控状态，且位于企业治理、风险和合规流程之外。企业需要了解云应用账户的使用情况，包括谁在使用哪些云应用、他们的部门、位置以及使用的设备。\n\
  \n##### 数据安全\n\n*   数据丢失防护（DLP）工具旨在阻止因未授权共享导致的企业数据泄露，但云使得与错误的人共享数据变得前所未有的容易。如果组织使用云文件存储，传统的\
  \ DLP 产品将无法知晓什么数据被外部分享以及是谁在分享。\n\n##### 威胁防护\n\n*   很难防范授权用户的恶意意图或疏忽。为了检测可疑的内部人员行为，组织需要全面了解其正常使用模式。同样，前员工构成重大风险，因为他们可能已从组织目录中禁用，但仍可访问包含业务关键信息的云应用。PWC\
  \ 发现，归因于前员工的安全事件从 2013 年的 27% 上升到 2014 年的 30%。\n\n##### 合规性\n\n*   随着数据迁移到云端，组织将希望确保符合确保数据隐私和安全的区域法规。CASB\
  \ 可以帮助确保符合 SOX 和 HIPAA 等法规，并帮助根据 PCI DSS、NIST、CJIS、MAS 和 ISO 27001 等监管要求对安全配置进行基准测试。\n\
  \n##### BYOD、影子 IT 和云使用量增加\n\n*   自带设备（BYOD）策略、SaaS 和云应用日益普及、影子 IT 的兴起等现象，使得将云应用访问限制在一组已定义的端点上变得困难。托管和非托管设备通常需要不同的策略来有效保护企业数据。CASB\
  \ 有助于执行细粒度访问策略，以及识别和分类组织中的云应用 [\\[4\\]](#Ch003_81-105_B9780443187346000118.xhtml#bb0025)。\n\
  \n#### 数据收集限制\n\n组织应仅收集所需的最少量敏感信息。\n\n经济合作与发展组织（OECD，见第 2 章，第 1 领域：安全与风险管理）的收集限制原则探讨了数据限制：“应对个人数据的收集加以限制，且任何此类数据的获取应通过合法和公平的方式，并在适当情况下，经数据主体知情或同意”\
  \ [\\[5\\]](#Ch003_81-105_B9780443187346000118.xhtml#bb0030)。收集敏感数据应有明确记录的业务需求，且仅在没有其他替代方案时才收集敏感数据。\n\
  \n### 内存与残留\n\n考试最近增加了及时的主题，例如固态硬盘（SSD）的残留特性，稍后将讨论。我们将首先讨论计算机内存本身，然后是易失性和非易失性内存的残留特性。请注意，内存保护和\
  \ CPU 设计等相关概念见第 4 章（第 3 领域：安全架构与工程）。\n\n#### 数据残留\n\n在讨论介质清理和数据销毁时，理解数据残留这一术语非常重要。数据残留是指数据在非侵入式删除手段之后仍然存在。虽然数据残留有时专门指残留在磁性存储介质上的数据，但残留问题不仅限于磁性存储介质。安全专业人员必须了解各类内存和存储的残留特性，并理解使数据不可恢复的步骤。\n\
  \n#### 内存\n\n内存是一系列代表位的开关：0（关）和 1（开）。内存可以是基于芯片的、基于磁盘的，或使用磁带等其他介质。RAM 是随机存取存储器：“随机”意味着\
  \ CPU 可以随机访问（跳转到）内存中的任何位置。顺序存储器（如磁带）必须从偏移量零开始顺序读取内存，直到所需的内存部分。易失性内存（如 RAM）在断电后失去完整性；非易失性内存（如\
  \ `ROM`、磁盘或磁带）在无电源的情况下保持完整性。\n\n*真实*（或主）内存，如 RAM，可直接由 CPU 访问，用于保存当前正在执行的进程的指令和数据。辅助内存，如基于磁盘的内存，不可直接访问。\n\
  \n##### 高速缓存内存\n\n\n\n\n*缓存内存* 是系统中速度最快的内存，用于跟上 CPU 获取和执行指令的速度。CPU 最常使用的数据存储在缓存内存中。CPU\
  \ 缓存中速度最快的部分是 *寄存器* 文件，它包含多个寄存器。寄存器是 CPU 用来存储指令和数据的小型存储位置。\n\n接下来速度最快的缓存内存形式是 1\
  \ 级缓存，位于 CPU 本身上。最后，2 级缓存连接在 CPU 外部（但紧邻 CPU）。*SRAM*（静态随机存取存储器）用于缓存内存。\n\n> **注意**\n\
  >\n> 离 CPU 最近的内存（缓存内存）是计算机中速度最快、价格最昂贵的内存。随着离 CPU 越来越远，从 SRAM 到 *DRAM*，再到磁盘、磁带等，内存速度变慢，价格也变低。\n\
  \n#### RAM 和 ROM\n\nRAM 是易失性内存，用于存放当前正在运行程序的指令和数据。断电后会丢失数据完整性。RAM 内存模块安装在计算机主板上的插槽中。RAM\
  \ 也越来越多地直接嵌入到计算机主板中，使得升级变得困难，甚至不可能。\n\nROM（只读存储器）是非易失性的：存储在 ROM 中的数据在断电后仍保持完整性。计算机\
  \ *基本输入输出系统* (BIOS) *固件* 存储在 ROM 中。虽然 ROM 是“只读”的，但某些类型的 ROM 可以通过刷写进行写入，我们将在“闪存”部分很快看到。\n\
  \n> **注意**\n>\n> RAM 的易失性是正在进行的研究课题。历史上，人们认为 DRAM 断电后会丢失数据完整性。“冷启动”攻击表明 RAM 具有残留性：断电后可能保持完整性几秒甚至几分钟。这具有安全隐患：加密密钥通常以明文形式存在于\
  \ RAM 中，可能通过从安装在 DVD 或 USB 密钥上的小型操作系统“冷启动”计算机，然后快速转储内存内容来恢复。关于冷启动攻击影响的视频“Lest We\
  \ Remember: Cold Boot Attacks on Encryption Keys”可在 <https://citp.princeton.edu/our-work/memory/>\
  \ 查看。\n>\n> 请记住，考试有时会简化复杂问题。对于考试，只需记住 RAM 是易失性的（尽管不像我们曾经认为的那样易失性）。\n\n#### DRAM\
  \ 和 SRAM\n\n静态随机存取存储器 (SRAM) 是一种速度快、价格昂贵的内存，它使用称为“触发器”的小锁存器来存储位。动态随机存取存储器 (DRAM)\
  \ 将位存储在小电容器中（像小电池一样），比 SRAM 慢且便宜。DRAM 使用的电容器会泄漏电荷，必须不断刷新以保持完整性，通常每隔几毫秒到几百毫秒刷新一次，具体取决于\
  \ DRAM 的类型。刷新会将位读回并写回内存。SRAM 不需要刷新，只要供电就能保持完整性。\n\n#### 固件\n\n固件存储不经常更改的小型程序，例如计算机的\
  \ BIOS（见下文讨论）或路由器的操作系统和已保存配置。各种类型的 ROM 芯片可用于存储固件，包括 *PROM*、*EPROM* 和 *EEPROM*。\n\
  \nPROM（可编程只读存储器）只能写入一次，通常在工厂完成。EPROM（可擦除可编程只读存储器）和 EEPROM（电可擦除可编程只读存储器）可以“刷写”，即多次擦除和写入。“刷写”一词源于\
  \ EPROM 的使用：在芯片上的一个小窗口照射紫外线可擦除 EPROM。该窗口通常用箔纸覆盖，以防止因光照导致意外擦除。EEPROM 是现代类型的 ROM，可通过刷写程序进行电擦除。\n\
  \n可编程逻辑器件 (PLD) 是一种现场可编程器件，意味着它在出厂后进行编程。EPROM、EEPROM 和闪存都是 PLD 的示例。\n\n##### 闪存\n\
  \n*闪存*（如 USB 闪存盘）是一种特定类型的 EEPROM，用于小型便携式存储驱动器。区别在于 EEPROM 的任何字节都可写入，而闪存驱动器按（较大的）扇区写入。这使得闪存比\
  \ EEPROM 更快，但仍比 RAM 慢。\n\n> **注意**\n>\n> 固件基于芯片，不同于磁盘。“闪存驱动器”一词可能会让一些人认为闪存驱动器是“磁盘驱动器”。它们在物理上截然不同，且具有不同的残留特性。\n\
  >\n> 简单的磁场无法擦除闪存。用于磁性驱动器的安全销毁方法（如消磁，我们稍后将讨论）对闪存驱动器无效。\n\n#### 固态硬盘 (SSD)\n\n固态硬盘\
  \ (SSD) 是闪存 (EEPROM) 和 DRAM 的组合。消磁对 SSD 无效。此外，虽然物理磁盘具有物理块（“块 1”位于磁盘的特定物理位置），但 SSD\
  \ 上的块是逻辑的，并映射到物理块。而且，SSD 不会覆盖包含数据的块：设备会将数据写入未使用的块，并将之前的块标记为未分配。\n\n一个称为垃圾回收的过程稍后会处理这些旧块：“未使用且未擦除的块被移开并在后台擦除。这称为‘垃圾回收’过程。在后台工作时，垃圾回收系统地识别包含不需要数据的存储单元，并在非高峰时段清除不需要数据的块，以在正常操作期间保持最佳写入速度”\
  \ [\\[6\\]](#Ch003_81-105_B9780443187346000118.xhtml#bb0035)。\n\nTRIM 命令可改善垃圾回收。“TRIM\
  \ 是 ATA 数据集管理命令的一个属性。TRIM 功能通过允许驱动器在后台进行垃圾回收，提高了兼容性、耐用性和性能。此回收消除数据块，例如已删除的文件” [\\\
  [7\\]](#Ch003_81-105_B9780443187346000118.xhtml#bb0040)。虽然 TRIM 命令提高了性能，但不能可靠地销毁数据。\n\
  \n“逐扇区覆盖”在 SSD 与磁性驱动器上的表现截然不同，且不能可靠地销毁所有数据。此外，电子粉碎文件（在删除前覆盖文件数据，我们稍后将讨论）也无效。\n\n\
  加利福尼亚大学圣地亚哥分校计算机科学与工程系进行的测试发现：“总体而言，覆写的结果很差：虽然覆写在某些情况下对各种驱动器似乎有效，但显然并非普遍可靠。对于花费精力对设备进行清理的个人或组织来说，似乎不太可能对这种性能水平感到满意”\
  \ [\\[8\\]](#Ch003_81-105_B9780443187346000118.xhtml#bb0045)。\n\n未物理损坏的 SSD 驱动器上的数据可通过\
  \ ATA 安全擦除安全移除。SanDisk 提供了以下细节：“当在 SanDisk SSD 上执行相关的安全擦除命令时，物理地址空间中的所有块，无论它们当前是否分配给逻辑空间或之前曾分配过，都会被完全擦除（‘逻辑到物理映射表’也会被擦除）。此外，会生成一个新的加密密钥并丢弃旧密钥。\n\
  \n\n\n\n\n此擦除操作不会像 HDD 写入或格式化命令那样覆盖块。数据按页级写入闪存，且在再次写入之前，页面必须被完全擦除。与 HDD 不同，后者可能在磁道之间的区域留下数据残留，被擦除的闪存单元会恢复到其制造时所包含的相同内容。与\
  \ HDD 的情况一样，被标记为“坏块”的物理块可能仍包含残留用户数据。无法访问这些块以覆盖它们，安全擦除也不会尝试这样做。因为安全擦除操作还会重新生成内部加密密钥，所以即使数据可访问，也无法解密”\
  \ [\\[9\\]](#Ch003_81-105_B9780443187346000118.xhtml#bb0050)。\n\n销毁 SSD 驱动器上数据的两个有效选项是\
  \ ATA 安全擦除和物理销毁。对于物理损坏的 SSD 驱动器，物理销毁是最佳方法。\n\n#### 数据销毁\n\n在处置前，所有形式的介质都应被安全清理或销毁，以防止*对象重用*，即从先前使用的对象（如计算机文件）中恢复信息的行为。对象可以是物理的（如马尼拉文件夹中的纸质文件）或电子的（硬盘上的数据）。\n\
  \n对象重用攻击范围从非技术性攻击（如*垃圾箱翻找*——通过翻找无人看管的垃圾来搜寻信息）到技术性攻击（如从磁盘驱动器的未分配块中恢复信息）。垃圾箱翻找最早于\
  \ 1960 年代由“电话飞客”推广（在“黑客术语”中，飞客是指入侵电话系统的黑客）。早期著名的垃圾箱翻找者是 Jerry Schneider，他从太平洋电话电报公司的垃圾箱中搜寻零件和文档。Schneider\
  \ 对电话公司的做法非常熟悉，以至于他能够利用垃圾箱翻找和社会工程学攻击来订购并接收电话设备而无需付款。他后来于 1972 年因该罪行被捕。在 [`www.bookrags.com/research/jerry-schneider-omc/`](http://www.bookrags.com/research/jerry-schneider-omc/)\
  \ 阅读更多关于 Jerry 攻击的信息。\n\n所有清理和销毁操作都应遵循正式策略，并应记录所有此类活动，包括任何硬盘的序列号、所含数据类型、清理或销毁日期以及执行这些操作的人员。\n\
  \n##### 覆盖\n\n简单地“删除”文件会从文件分配表 (FAT) 中移除条目，并将数据块标记为“未分配”。重新格式化磁盘会销毁旧的 FAT 并用新的替换它。在这两种情况下，数据本身通常保留下来，并可使用取证工具恢复。此问题称为*数据残留*（留下了数据“残余”）。\n\
  \n覆盖会写入文件的每个字符或整个磁盘驱动器，比删除或格式化磁盘驱动器安全得多。常用方法包括写入全零或写入随机字符。电子“*碎纸*”或“*擦除*”会在移除 FAT\
  \ 条目前覆盖文件数据。\n\n许多工具对同一数据执行多轮覆盖，尽管额外轮次的有效性存疑。目前没有已知的商业工具能够恢复单次覆盖的数据。\n\n覆盖的一个局限性是，你无法通过简单观察判断驱动器是否已被安全覆盖，因此覆盖过程中出现的错误可能导致数据泄露。也可能无法覆盖损坏的介质。最后，一次写入多次读取\
  \ (WORM) 介质无法被覆盖。\n\n> **注意**\n>\n> 多年来，安全专业人员和其他技术人员都接受了这样一种理论：即使数据被覆盖，仍有可能被恢复。尽管建议的恢复手段涉及洁净室和电子显微镜，这可能超出了大多数潜在攻击者的能力范围，但组织通常采用所谓的\
  \ DoD（国防部）短方法、DoD 标准方法或 Gutmann 方法 [\\[10\\]](#Ch003_81-105_B9780443187346000118.xhtml#bb0055)\
  \ 进行擦除，分别涉及 3 次、7 次或 35 次连续覆盖。对于（未损坏的）磁性介质，现在业界普遍认为单次成功覆盖即可使数据不可恢复。这为组织节省了大量因不必要的重复擦除而浪费的工时。\n\
  \n##### 退磁\n\n*退磁*通过将磁性介质（如磁带或磁盘驱动器）暴露在强磁场中来破坏其完整性，从而销毁介质及其所含数据的完整性。驱动器完整性通常受损严重，以至于退磁后的磁盘驱动器通常无法再被格式化。\n\
  \n##### 物理销毁\n\n物理销毁通过损坏或销毁介质本身（如磁盘驱动器的盘片）来破坏介质的完整性。破坏性措施包括焚烧、粉碎、撕碎以及将金属部件浸泡在酸中。\n\
  \n物理销毁比覆盖更安全。可能无法覆盖损坏的介质（尽管数据仍可能可恢复）。如前所述，固态硬盘等介质上的数据无法通过覆盖可靠地移除。此外，某些磁性介质（如 WORM\
  \ [一次写入多次读取] 驱动器和 CD-R [可记录光盘]）只能写入一次，随后无法再次覆盖。高度敏感的数据应进行退磁或物理销毁（或许除了覆盖之外）。物理销毁增强了纵深防御，允许通过物理检查确认数据销毁。\n\
  \n##### 碎纸/粉碎\n\n一种简单的介质清理形式是碎纸/粉碎，这是一种物理销毁类型。虽然该术语有时用于指代数据覆盖，但此处碎纸/粉碎是指使打印在硬拷贝上或软盘、光盘等较小物体上的数据不可恢复的过程。敏感信息（如打印信息）在处置前需要粉碎，以挫败垃圾箱翻找攻击。\n\
  \n*碎纸机*通过切割纸张来防止对象重用。条切式碎纸机将纸张切成垂直条状。交叉切割式碎纸机比条切式更安全，可垂直和水平双向切割，产生细小的纸屑“碎纸片”。只要有足够的时间和接触所有碎纸材料的机会，攻击者可以恢复碎纸文档，尽管使用交叉切割式碎纸机会更困难。\n\
  \n*垃圾箱翻找*是一种物理攻击，指人员翻找垃圾，希望找到仅被整份丢弃而未经过碎纸机处理、焚烧或以其他方式销毁的敏感信息。图 3.2 显示了装有待碎纸材料的带锁碎纸箱。这些锁旨在确保碎纸前期间内无法进行垃圾箱翻找。\n\
  \n![图 3.2 带锁碎纸箱。来源：https://commons.wikimedia.org/wiki/File:Confidential\\_shred\\\
  _bins.JPG；摄影：© BrokenSphere/Wikimedia Commons。图片依据知识共享署名-相同方式共享 3.0 许可使用。](img/f03-02-9780443187346.jpg)\n\
  \n图 3.2 带锁碎纸箱。来源：[`commons.wikimedia.org/wiki/File:Confidential\\_shred\\_bins.JPG`](https://commons.wikimedia.org/wiki/File:Confidential_shred_bins.JPG)；摄影：©\
  \ BrokenSphere/Wikimedia Commons。图片依据知识共享署名-相同方式共享 3.0 许可使用。\n\n### 确定数据安全控制\n\n\
  确定采用哪些数据安全控制是一项关键技能。基线、标准、范围界定和裁剪用于选择和定制采用哪些控制。此外，控制的确定将取决于数据是静止还是在传输中。\n\n\n\n\n\
  \n#### 认证与认可\n\n让我们通过描述认证和认可来开始对标准的讨论。`Certification`（认证）意味着系统已通过认证，满足数据所有者的安全要求。认证会考量系统本身、为保护系统所采取的安全措施，以及系统所代表的剩余风险。`Accreditation`（认可）是数据所有者对认证结果及剩余风险的接受，这是系统投入生产前所必需的。\n\
  \n#### 标准与控制框架\n\n有多种标准可用于确定安全控制措施。有些标准具有行业特定性，例如 `PCI-DSS`（支付卡行业数据安全标准，以使用信用卡的供应商为例）。其他标准则更为通用，例如\
  \ `OCTAVE®`、`ISO 17799/27002` 和 `COBIT`。\n\n##### 标准选择\n\n顾名思义，标准选择描述了决定遵循哪个信息安全标准的过程。在某些行业中，这可以是一个简单的过程：例如，美国的医疗机构必须遵循\
  \ `HIPAA`（《健康保险流通与责任法案》），处理信用卡的组织必须遵循 `PCI-DSS`（支付卡行业数据安全标准，下文将讨论）。\n\n其他行业（没有监管要求必须遵循特定标准）通常从国际公认的标准中进行选择，例如\
  \ `ISO`、`COBIT`、`ITIL`（下文将讨论）等提供的标准。请注意，医疗等行业可能选择在遵循法规要求的标准之外，额外遵循这些标准。\n\n#####\
  \ PCI-DSS\n\n`Payment Card Industry Data Security Standard`（支付卡行业数据安全标准，`PCI-DSS`）是由支付卡行业安全标准委员会（`PCI-SSC`）制定的安全标准。该委员会由美国运通、发现卡、万事达卡、维萨卡等组成。`PCI-DSS`\
  \ 通过要求使用信用卡的供应商采取特定的安全预防措施，旨在保护信用卡：“PCI-DSS 是一个多层面的安全标准，包含安全管理、策略、程序、网络架构、软件设计及其他关键防护措施的要求。这一综合标准旨在帮助组织主动保护客户账户数据”[[11]](#Ch003_81-105_B9780443187346000118.xhtml#bb0060)。\n\
  \n`PCI-DSS` 的核心原则（可在 <https://www.pcisecuritystandards.org/security_standards/index.php>\
  \ 查看）包括：\n\n*   构建并维护安全的网络与系统\n*   保护持卡人数据\n*   维护漏洞管理计划\n*   实施强访问控制措施\n*   定期监控和测试网络\n\
  *   维护信息安全策略 [[11]](#Ch003_81-105_B9780443187346000118.xhtml#bb0060)\n\n##### OCTAVE®\n\
  \n`OCTAVE®` 代表 `Operationally Critical Threat, Asset, and Vulnerability Evaluation`^(*sm*)（操作关键威胁、资产与漏洞评估），是卡内基梅隆大学开发的一种风险管理框架。`OCTAVE®`\
  \ 描述了一个管理风险的三阶段过程。第一阶段识别员工知识、资产和威胁。第二阶段识别漏洞并评估防护措施。第三阶段进行风险分析并制定风险缓解策略。\n\n`OCTAVE®`\
  \ 是一份高质量的免费资源，可从以下地址下载：<https://resources.sei.cmu.edu/library/asset-view.cfm?assetid=51546>。\n\
  \n##### ISO 17799 与 ISO 27000 系列\n\n`ISO 17799` 是国际标准化组织（总部位于瑞士日内瓦）制定的一种广泛的信息安全实践守则方法。其全称为“ISO/IEC\
  \ 17799:2005 信息技术——安全技术——信息安全管理实践守则”。`ISO 17799:2005` 标志着该标准的 2005 版本。它基于 `BS`（英国标准）7799\
  \ 第 1 部分。\n\n`ISO 17799` 包含 11 个领域，侧重于特定的信息安全控制：\n\n1.  策略\n2.  信息安全组织\n3.  资产管理\n\
  4.  人力资源安全\n5.  物理与环境安全\n6.  通信与运营管理\n7.  访问控制\n8.  信息系统获取、开发与维护\n9.  信息安全事件管理\n\
  10. 业务连续性管理\n11. 合规性 [[12]](#Ch003_81-105_B9780443187346000118.xhtml#bb0065)\n\n\
  `ISO 17799` 于 2005 年重新编号为 `ISO 27002`，以使其与 ISO 27000 系列安全标准保持一致。`ISO 27001` 是一个相关标准，正式名称为“ISO/IEC\
  \ 27001:2005 信息技术——安全技术——信息安全管理体系——要求”。`ISO 27001` 基于 `BS 7799 Part 2`。\n\n请注意，`ISO\
  \ 27002` 的标题包含“技术”一词；`ISO 27001` 的标题包含“要求”一词。简单来说，`ISO 27002` 描述信息安全最佳实践（技术），而 `ISO\
  \ 27001` 描述审计（要求）这些最佳实践的过程。\n\n##### COBIT\n\n`COBIT`（信息及相关技术控制目标）是一个控制框架，用于在组织内采用信息安全治理最佳实践。`COBIT`\
  \ 由 `ISACA`（信息系统审计与控制协会，参见 <https://www.isaca.org>）开发。\n\n根据 `ISACA` 的说法，`COBIT`\
  \ 的目标“是提炼治理流程，并为可持续的业务战略提供路线图。COBIT 2019 是一个帮助企业规划战略并实现治理目标的框架，通过有效治理和管理企业 I&T 来交付价值。COBIT\
  \ 2019 中的治理和管理目标被归纳为 5 个域。这些域的 ID 带有动词，表达了其中所包含目标的关键目的和活动领域”[[13]](#Ch003_81-105_B9780443187346000118.xhtml#bb0070)。\n\
  \n`COBIT` 包含五个域：\n\n*   评价、指导与监控（`EDM`）\n*   协调、规划与组织（`APO`）\n*   构建、获取与实施（`BAI`）\n\
  *   交付、服务与支持（`DSS`）\n*   监控、评价与评估（`MEA`） [[13]](#Ch003_81-105_B9780443187346000118.xhtml#bb0070)\n\
  \n这五个域涵盖了 40 个信息技术流程。关于 `COBIT` 的更多信息请访问：<https://www.isaca.org/resources/cobit>。`COBIT\
  \ Version 5` 于 2012 年 4 月发布，`COBIT 2019` 于 2019 年发布。\n\n##### ITIL®\n\n`ITIL®`（信息技术基础设施库）是一个为\
  \ IT 服务管理（`ITSM`）提供最佳服务的框架。关于 `ITIL®` 的更多信息请访问：<https://www.itlibrary.org/>。\n\n\
  `ITIL®` 包含五本“服务管理实践——核心指导”出版物：\n\n*   服务战略\n*   服务设计\n*   服务转换\n*   服务运营\n*   持续服务改进\n\
  \n服务战略帮助 IT 提供服务。服务设计详述提供 IT 服务所需的基础设施和架构。服务转换描述将新项目转为运营状态的过程。服务运营涵盖 IT 运营控制。最后，持续服务改进描述改进现有\
  \ IT 服务的方法。\n\n#### 范围界定与裁剪\n\n`Scoping`（范围界定）是确定组织将采用标准中哪些部分的过程。例如：不使用无线设备的组织可能会宣布该标准中的无线条款不在范围内，因此不适用。\n\
  \n\n\n\n\n### 定制\n\n**定制** 是为组织定制标准的过程。它始于控制选择，继续进行范围界定，并以补偿控制的应用结束。NIST 特别出版物 800-53B（信息系统和组织的控制基线）描述了定制过程：\n\
  \n*   识别和指定通用控制\n*   应用范围界定考量\n*   选择补偿控制\n*   通过显式赋值和选择操作，为组织定义的控制参数分配值\n*   使用额外的控制和控制增强来补充基线\n\
  *   提供控制实施的规范信息 [\\[14\\]](#Ch003_81-105_B9780443187346000118.xhtml#bb0075)\n\n\
  提到的“参数”包括密码复杂度策略等项目。\n\n### 数据状态\n\n数据有三种状态：使用中的数据、传输中的数据和静止的数据。使用中的数据是指在应用程序中正被主动使用的数据，例如用户在打开的电子表格中查看的数据。传输中的数据（也称为移动中的数据）是指跨网络传输的数据。静止的数据是存储的数据：驻留在磁盘上和/或文件中。DLP\
  \ 可保护这三种形式的数据，其他控制可用于保护数据在其三种状态下的安全，我们将在接下来讨论。\n\n#### 保护使用中的数据\n\n保护使用中的数据需要保护最终用户及其使用的系统。保护最终用户需要提供适当的培训和安全意识。保护系统需要一系列物理和基于主机的控制，我们将跨多个领域进行讨论：物理安全、补丁和加固、登录超时和屏幕锁定的使用等。\n\
  \n#### 保护传输中的数据\n\n传输中的数据最好通过基于标准的端到端加密来保护，例如 `IPSEC VPN`。这包括通过互联网等不受信网络发送的数据，但\
  \ VPN 也可作为纵深防御的额外措施用于内部网络，如私有企业 WAN，或从服务提供商租用的专用电路（如 T1 线路）。我们将在第 5 章（第 4 领域：通信和网络安全）中更详细地讨论\
  \ VPN 和各种类型的电路。\n\n#### 驱动器和磁带加密\n\n驱动器和磁带加密保护静止数据，是物理安全被突破后仍能保护数据为数不多的控制之一。对于所有移动设备和包含敏感信息、可能物理离开站点或安全区域的介质，均建议使用这些控制。加密也可用于通常不移动的静态系统（如文件服务器）。\n\
  \n建议对移动设备硬盘进行**全盘加密**。部分加密解决方案（如加密的文件夹或分区）往往存在风险，可能会暴露存储在临时文件、未分配空间、交换空间等中的敏感数据。\n\
  \n磁盘加密/解密可在软件或硬件中进行。基于软件的解决方案可能会消耗计算机性能，而基于硬件的解决方案将加密工作卸载到另一个 CPU 上，如硬件磁盘控制器。\n\n\
  许多关于个人身份信息 (PII) 的违规通知法律，都豁免了加密数据的丢失。一个例子是 2009 年对美国《健康保险流通与责任法案》(HIPAA) 的更新，涉及电子受保护医疗信息\
  \ (ePHI) 的泄露。\n\n未加密 ePHI 的泄露要求通知受影响的个人；超过 500 人数据的泄露要求额外通知媒体和美国卫生与公众服务部。加密数据不受这些规则约束：“按照指导通过加密或销毁来保护健康信息的，在发生此类信息泄露时，无需进行通知”\
  \ [\\[5\\]](#Ch003_81-105_B9780443187346000118.xhtml#bb0030)。\n\n> **考试警告**\n>\n\
  > 请注意，虽然 HIPAA 在通用知识体系 (CBK) 中，但这些具体细节不在其中。提出这一点是为了强调对移动设备上 PII 进行加密的关键性，无论行业如何。\n\
  \n#### 媒体存储和运输\n\n所有敏感备份数据都应存储在异地，无论是通过网络传输到异地，还是以备份介质的形式物理移动到异地。使用备份介质的站点应遵循严格的程序将介质轮换至异地。\n\
  \n始终使用有担保且有保险的公司进行异地媒体存储。该公司应使用安全车辆，并在安全站点存储介质。确保存储站点不太可能受到可能袭击主站点的同一灾难的影响，如洪水、地震或火灾。切勿使用非正式做法，如将备份介质存放在员工家中。\n\
  \n### 考试目标总结\n\n在本领域中，我们讨论了沿用千年的数据分类概念。我们讨论了保护数据所需的角色，包括业务或任务所有者、数据所有者、系统所有者、保管员和用户。\n\
  \n理解易失性和非易失性内存及存储介质的残留特性，是必须掌握的关键安全概念。我们讨论了 RAM、ROM、各类 PROM、闪存和固态硬盘 (SSD)，包括残留特性和安全销毁方法。最后，我们讨论了知名标准，包括\
  \ PCI-DSS 和 ISO 27000 系列，以及范围界定和定制等标准流程。\n\n### 自我测试\n\n> **注意**\n>\n> 请参阅自我测试附录，了解所有正确和错误答案的解释。\n\
