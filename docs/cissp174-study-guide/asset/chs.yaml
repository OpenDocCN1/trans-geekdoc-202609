  \n**Rootkit**  \n`Rootkit`，替换内核和/或操作系统部分组件的恶意软件。\n\n**Rotation Cipher**  \n移位密码，将密文每个字符向后固定移动一定数量超过明文字符的替换密码。\n\
  \n**Rotation of duties**  \n职务轮换，要求关键职能或职责不由同一人不间断地持续执行。也称为工作轮换。\n\n**Router** \
  \ \n路由器，第 3 层设备，基于 `IP` 地址将流量从一个 `LAN` 路由到另一个。\n\n**Routing Information Protocol**\
  \  \n参见——`RIP`。\n\n**RPO**  \n`Recovery Point Objective`，恢复点目标，组织所能承受的数据丢失量或系统不可访问时间（以时间衡量）。\n\
  \n**RSN**  \n`Robust Security Network`，强健安全网络，`802.11i` 的一部分，允许在发现新漏洞时更改加密密码。\n\n\
  **RST**  \n`TCP` 标志，复位（拆除）连接。\n\n\n\n\n\n## 术语表\n\n### R\n**RTO** (Recovery Time\
  \ Objective)：允许恢复业务或 IT 系统的最长时间。\n\n**RTP** (Real-time Transport Protocol)：一种 VoIP\
  \ 协议，旨在传输流式音频和视频。\n\n**Rule-based access control** (基于规则的访问控制)：使用一系列定义好的规则、限制和过滤器来访问系统内的对象。\n\
  \n**Running-key cipher** (流密钥密码/连续密钥密码)：一种加密方法，使用来自知名文本（如字典）的完整单词，通过模运算将字母“添加”到明文中。\n\
  \n**Runtime** (运行时)：当前正在执行的进程的状态（也称为运行中）。\n\n### S\n**S/MIME** (Secure/Multipurpose\
  \ Internet Mail Extensions)：安全/多用途互联网邮件扩展，利用 PKI 对 MIME 编码的电子邮件进行加密和认证。\n\n**SA**\
  \ (Security Association)：安全关联，一种单工连接，可用于协商 ESP 或 AH 参数。\n\n**SaaS** (Software as\
  \ a Service)：软件即服务，完全配置好的基于云的应用程序，涵盖从操作系统向上的所有层面。\n\n**Salt** (盐值)：与密码一起哈希的随机数。允许同一密码以多种方式哈希。\n\
  \n**SAML** (Security Assertion Markup Language)：安全断言标记语言，一种基于 XML 的框架，用于交换安全信息，包括认证数据。\n\
  \n**SAN** (Storage Area Network)：存储区域网络，通过网络提供块级磁盘存储。\n\n**Sanction** (制裁/处罚)：因违反政策而采取的行动。\n\
  \n**Sandboxing** (沙箱技术)：一种基于在安全环境（称为沙箱）中渲染或执行内容时表现出的行为分析，来保护和检测恶意内容的方法。\n\n**Sarbanes-Oxley\
  \ Act** (萨班斯-奥克斯利法案)：参见 **SOX**。\n\n**Sashimi Model** (刺身模型/重叠模型)：步骤高度重叠的开发模型；可视为瀑布模型在现实世界中的继任者。\n\
  \n**SAST** (Static Application Security Testing)：静态应用安全测试，被动测试代码：代码不运行。\n\n**Satellite\
  \ communications** (卫星通信)：通过与地球轨道匹配、看似静止在天空中的地球同步卫星提供语音和数据服务。\n\n**Savepoint** (保存点)：数据库表的一个干净快照。\n\
  \n**Schema** (模式)：描述数据库表的属性和值。\n\n**Scoping** (范围界定)：确定组织将采用标准中哪些部分的过程。\n\n**Screened\
  \ host architecture** (屏蔽主机架构)：使用单个路由器通过 ACL 过滤进出堡垒主机的外部流量的较旧扁平网络设计。\n\n**Screened\
  \ subnet architecture** (屏蔽子网架构)：两个防火墙屏蔽一个 DMZ。\n\n**Script kiddies** (脚本小子)：使用他们几乎不理解的工具攻击计算机系统的攻击者。\n\
  \n**SCM** (Software Configuration Management)：软件配置管理，一种自动化系统管理任务（包括服务器部署和配置管理）的敏捷方法。\n\
  \n**SCRM** (Supply Chain Risk Management)：供应链风险管理，描述管理从第三方采购产品和服务风险的过程。\n\n**Scrum**\
  \ (Scrum 敏捷框架)：使用小团队的敏捷开发模型，角色包括 Scrum Master 和 Product Owner。\n\n**Scrum Master**\
  \ (Scrum 主管)：充当 Scrum 团队教练的组织高级成员。\n\n**scrypt**：一种缓慢的密码哈希算法。\n\n**SDLC (Applications)**\
  \ (Systems Development Life Cycle)：系统开发生命周期，一种关注每个阶段安全性的系统开发模型。\n\n**SDLC (Telecommunications)**\
  \ (Synchronous Data Link Control)：同步数据链路控制，一种使用轮询传输数据的同步第 2 层 WAN 协议。\n\n**SDN**\
  \ (Software Defined Networking)：软件定义网络，将路由器的控制平面与数据（转发）平面分离。路由决策在远程做出，而非在每个单独的路由器上。\n\
  \n**SDSec** (Software-defined security)：软件定义安全，对 SIEM、防火墙、IDS 和 IPS 等安全设备进行自动化编排，类似于软件定义网络。\n\
  \n**SDSL** (Symmetric Digital Subscriber Line)：对称数字用户线，上传和下载速度匹配的 DSL。\n\n**SDWAN**\
  \ (Software-Defined Wide Area Networking)：软件定义广域网，将软件定义网络的概念扩展到云端。\n\n**Search warrant**\
  \ (搜查令)：允许合法搜查的法院命令。\n\n**Secondary evidence** (次级证据/间接证据)：由原始文件副本和口头描述组成的证据。\n\n\
  **Secure defaults** (安全默认值/默认安全)：也称为“默认安全”，操作系统和应用程序以安全状态部署。历史上操作系统以（有时）高度不安全的状态部署，安装后需要加固。\n\
  \n**Secure Hash Algorithm 1** (安全哈希算法 1)：参见 **SHA-1**。\n\n**Secure Hash Algorithm\
  \ 2** (安全哈希算法 2)：参见 **SHA-2**。\n\n**Secure Real-time Transport Protocol** (安全实时传输协议)：参见\
  \ **SRTP**。\n\n**Secure Shell** (安全外壳协议)：参见 **SSH**。\n\n**Secure Sockets Layer**\
  \ (安全套接层)：参见 **SSL**。\n\n**Secure/Multipurpose Internet Mail Extensions** (安全/多用途互联网邮件扩展)：参见\
  \ **S/MIME**。\n\n**Security Assertion Markup Language** (安全断言标记语言)：参见 **SAML**。\n\
  \n**Security assessments** (安全评估)：评估访问控制有效性的整体方法。可能将其他测试作为子集，包括渗透测试和漏洞扫描。\n\n**Security\
  \ audit** (安全审计)：针对已发布标准的测试。\n\n**Security champions** (安全倡导者/安全冠军)：非信息安全团队（包括运维、工程、软件开发等）的成员，充当与信息安全团队的联络人。\n\
  \n**Security domain** (安全域)：主体被允许访问的对象列表。\n\n**Security Orchestration, Automation,\
  \ and Response** (安全编排、自动化和响应)：参见 **SOAR**。\n\n**Security Parameter Index** (安全参数索引)：参见\
  \ **SPI**。\n\n**Security Safeguards Principle** (安全保障原则)：OECD 隐私指南原则，规定个人数据应受到合理保护，防止未经授权的使用、披露或篡改。\n\
  \n**Segment** (段)：第 4 层 PDU。\n\n**Semantic integrity** (语义完整性)：要求每个值与属性数据类型一致。\n\
  \n**Separation of Duties** (职责分离)：参见 **SoD**。\n\n**Serial Line Internet Protocol**\
  \ (串行线路互联网协议)：参见 **SLIP**。\n\n**Serverless** (无服务器/Serverless)：也称为 Functions as\
  \ a Service (FaaS)，代码发送到另一台服务器并返回结果，通常通过 JSON。\n\n**Server-side attack** (服务端攻击)：直接从攻击者发起针对监听服务的攻击。也称为服务端攻击。\n\
  \n**Service Level Agreement** (服务级别协议)：参见 **SLA**。\n\n**Service Level Requirement**\
  \ (服务级别要求)：描述第三方提供的服务。这些要求用于设计 SLA。\n\n**Service Set Identifier** (服务集标识符)：参见 **SSID**。\n\
  \n**Servicemark** (服务商标)：允许创建区分服务来源的品牌的知识产权保护。\n\n**Session hijacking** (会话劫持)：现有网络会话的妥协/接管。\n\
  \n**Session Initiation Protocol** (会话初始协议)：参见 **SIP**。\n\n**Session layer** (会话层)：OSI\
  \ 模型的第 5 层，管理会话，为连接提供维护。\n\n**SHA-1** (Secure Hash Algorithm 1)：安全哈希算法 1，一种生成 160\
  \ 位消息摘要的哈希函数。\n\n**SHA-2** (Secure Hash Algorithm 2)：安全哈希算法 2，一种哈希函数，包含 SHA-224、SHA-256、SHA-384\
  \ 和 SHA-512，以各自生成的消息摘要长度命名。\n\n**SHA-3** (Secure Hash Algorithm 3)：安全哈希算法 3，一种哈希函数，包含\
  \ SHA-224、SHA-256、SHA-384 和 SHA-512（与 SHA-2 提供的模式相同），并增加了两种额外模式：SHAKE128 和 SHAKE256。\n\
  \n**Shadow database** (影子数据库)：类似于复制数据库，但有一个关键区别：影子数据库镜像主数据库的所有更改，但客户端不访问影子数据库。\n\
  \n**Shared responsibility** (共担责任/共享责任模型)：划分客户与提供商在物理安全、网络、服务器、操作系统和应用程序方面责任的云模型。\n\
  \n**Shareware** (共享软件)：功能完整的专有软件，最初可免费使用。如果用户在特定时间后继续使用，共享软件许可证通常要求付费。\n\n**Shielded\
  \ Twisted Pair** (屏蔽双绞线)：参见 **STP**。\n\n**Shoulder surfing** (肩窥/偷窥)：攻击者观察凭证（如按键组合）的物理攻击。\n\
  \n**Shredding** (粉碎/擦除)：参见 **Wiping**。\n\n**Side-channel attack** (侧信道攻击)：利用物理数据破解密码系统的密码攻击，例如监控加密或解密时使用的\
  \ CPU 周期或功耗。\n\n**Simple integrity axiom** (简单完整性公理)：Biba 模型属性，规定“不向下读取”。\n\n**Simple\
  \ Mail Transfer Protocol** (简单邮件传输协议)：参见 **SMTP**。\n\n**Simple Network Management\
  \ Protocol** (简单网络管理协议)：参见 **SNMP**。\n\n**Simple Security Property** (简单安全属性)：Bell-LaPadula\
  \ 模型属性，规定“不向上读取” (NRU)。\n\n**Simplex** (单工/单向通信)：单向通信，如调至音乐频道的汽车收音机。\n\n\n\n\n\n\
  ## 术语表\n\n### S\n\n**Simulation test**  \n灾难恢复测试，要求团队成员执行恢复流程。\n\n**Single Loss\
  \ Expectancy (SLE)**  \n单次损失预期，单次损失的成本。\n\n**Single Sign-On (SSO)**  \n单点登录，允许主体进行一次身份验证，然后访问多个系统。\n\
  \n**SIP (Session Initiation Protocol)**  \n会话发起协议，一种 VoIP 信令协议。\n\n**SLA (Service\
  \ Level Agreement)**  \n服务级别协议，有助于保证可用性的合同协议。\n\n**Slack space**  \n磁盘上文件结束标记与簇末尾之间的空间。\n\
  \n**SLE**  \n参见 **Single Loss Expectancy**。\n\n**SLIP (Serial Line Internet Protocol)**\
  \  \n串行线路互联网协议，一种第 2 层协议，通过异步连接（如串行线路和调制解调器）提供 IP 连接。\n\n**Slow hash algorithms**\
  \  \n计算成本高的哈希算法（如 `bcrypt` 和 `scrypt`），用于密码哈希。\n\n**Smart card**  \n包含集成电路的物理访问控制设备。也称为集成电路卡（ICC）。\n\
  \n**SMDS (Switched Multimegabit Data Service)**  \n交换兆比特数据服务，一种类似 ATM 的较早 WAN 技术。\n\
  \n**SMTP (Simple Mail Transfer Protocol)**  \n简单邮件传输协议，一种存储转发协议，用于在服务器之间交换电子邮件。\n\
  \n**Smurf attack**  \n使用 ICMP 洪水和定向广播地址的攻击。\n\n**Sniffing**  \n针对网络流量的机密性攻击。\n\n\
  **SNMP (Simple Network Management Protocol)**  \n简单网络管理协议，用于监控网络设备。\n\n**SOAP**\
  \  \n最初代表 Simple Object Access Protocol，现在简称为 \"SOAP\"。用于实现 Web 服务。\n\n**SOAR (Security\
  \ Orchestration, Automation, and Response)**  \n安全编排、自动化和响应，一种用于集中管理安全运营的敏捷方法论。\n\
  \n**Social engineering**  \n利用人性绕过安全控制。\n\n**Socket**  \n一个节点上 IP 地址与 TCP 或 UDP\
  \ 端口的组合。\n\n**Socket pair**  \n描述两个节点之间的唯一连接：源端口、源 IP、目的端口和目的 IP。\n\n**SOCKS** \
  \ \n流行的电路级代理。\n\n**SoD (Separation of Duties)**  \n将敏感交易分配给多个主体。\n\n**Software as\
  \ a Service (SaaS)**  \n软件即服务。\n\n**Software Configuration Management (SCM)**  \n\
  软件配置管理。\n\n**Software Defined Networking (SDN)**  \n软件定义网络。\n\n**Software-Defined\
  \ Wide Area Networking (SDWAN)**  \n软件定义广域网。\n\n**Software-defined security (SDSec)**\
  \  \n软件定义安全。\n\n**Software escrow**  \n由中立第三方持有的源代码。\n\n**Software piracy**  \n\
  未经授权复制受版权保护的软件。\n\n**Solid State Drive (SSD)**  \n固态硬盘，闪存（EEPROM）和 DRAM 的组合。\n\n\
  **SONET (Synchronous Optical Networking)**  \n同步光网络，通过光纤电缆承载多个 T 载波电路。\n\n**Source\
