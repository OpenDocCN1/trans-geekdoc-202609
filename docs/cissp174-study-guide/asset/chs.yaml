  \n### 第 7 章：领域 6：安全评估与测试\n\n## 摘要\n\n领域 6 讨论安全评估与测试，它们是任何信息安全计划的关键组成部分。组织必须准确评估其实际安全状况，聚焦最关键的组件，并做出必要的变更以实现改进。本领域描述了评估与测试的两大主要组成部分：整体安全评估（包括漏洞扫描、渗透测试、安全评估和安全审计）以及通过静态和动态方法测试软件。静态测试被动地测试代码：代码不运行。这包括演练、语法检查和代码审查。动态方法包括模糊测试，这是一种黑盒测试，向软件程序提交随机的、格式错误的数据作为输入，以确定它们是否会崩溃。\n\
  \n### 关键词\n\n违规攻击模拟；动态应用安全测试；模糊测试；关键绩效指标；关键风险指标；误用用例测试；渗透测试；静态应用安全测试；合成事务\n\n本章考试目标：\n\
  \n*   • 安全控制测试\n*   • 收集安全流程数据\n\n## 独有术语与定义\n\n*   • **违规攻击模拟**——旨在自动化渗透测试，且通常全天候（24/7/365）运行\n\
  *   • **动态应用安全测试**——在执行代码时对其进行测试\n*   • **模糊测试**——一种黑盒测试，向软件程序提交随机的、格式错误的数据作为输入，以确定它们是否会崩溃\n\
  *   • **关键绩效指标**——一种衡量可用性的方法\n*   • **关键风险指标**——一种衡量风险的方法\n*   • **误用用例测试**——对对手滥用应用程序的影响进行建模\n\
  *   • **渗透测试**——经授权尝试闯入组织的物理或电子边界（有时两者兼有）\n*   • **静态应用安全测试**——被动测试代码：代码不运行\n* \
  \  • **合成事务**——也称为合成监控：涉及构建脚本或工具，模拟应用程序中通常执行的活动\n\n## 简介\n\n安全评估与测试是任何信息安全计划的关键组成部分。组织必须准确评估其实际安全状况，聚焦最关键的组件，并做出必要的变更以实现改进。\n\
  \n在本领域中，我们将讨论评估与测试的两大主要组成部分：安全控制测试（包括漏洞评估、渗透测试和安全审计）以及收集和分析安全流程数据（以确定安全控制的有效性）。\n\
  \n请注意，本领域与第 9 章，领域 8：软件开发安全存在重叠，特别是在应用程序测试方面。我们将在第 9 章中讨论道德披露和代码审查等概念。\n\n## 安全控制测试\n\
  \n存在多种流程来评估安全控制的有效性。范围较窄的测试包括渗透测试、漏洞评估和安全审计。安全评估是一种范围更广的测试，可能将较窄的测试（如渗透测试）作为子部分包含在内。\n\
  \n### 内部、外部、员工和第三方测试\n\n“内部”和“外部”这两个术语可能存在歧义。“外部”是指测试的发起位置（例如从互联网发起的渗透测试），还是指渗透测试人员的角色（第三方或员工）？NIST\
  \ SP 800-115 给出了明确定义：\n\n*   • **内部安全测试**：从组织安全边界内部进行的安全测试\n*   • **外部安全测试**：从组织安全边界外部进行的安全测试\
  \ [\\[1\\]](#Ch007_337-359_B978044318734600009X.xhtml#bb0010)\n\n这总共衍生出四种测试类型：内部/员工、外部/员工、内部/第三方和外部/第三方。\n\
  \n### 渗透测试\n\n渗透测试人员是一名道德黑客，获得授权尝试闯入组织的物理或电子边界（有时两者兼有）。**渗透测试**（简称“渗透测试”）旨在确定不道德的黑客是否能做到同样的事情。这是一种范围较窄但通常很有用的测试，特别是当渗透测试人员成功时。\n\
  \n渗透测试可能包括以下测试：\n\n*   • 网络（互联网）\n*   • 网络（内部或 DMZ）\n*   • 电话扫描\n*   • 无线\n*   •\
  \ 物理（尝试进入设施或房间）\n\n网络攻击可能利用客户端攻击、服务端攻击或 Web 应用程序攻击。有关这些攻击的更多信息，请参阅第 4 章，领域 3：安全架构与工程。**电话扫描**使用调制解调器拨打一系列电话号码，寻找应答调制解调器的载波音（渗透测试人员随后尝试访问应答系统）；该名称源自\
  \ 1983 年的电影《战争游戏》。\n\n**社会工程学**是一种无技术或低技术手段，利用人类心理绕过安全控制。社会工程学可结合多种攻击类型使用，特别是客户端攻击或物理测试。将社会工程学攻击与客户端攻击相结合的一个例子是：发送主题为“五级飓风即将袭击佛罗里达！”的恶意软件邮件。第\
  \ 4 章，领域 3：安全架构与工程中描述了一种物理社会工程学攻击（用于尾随授权用户进入大楼）。\n\n**零知识**测试（也称为黑盒测试）是“盲测”；渗透测试人员没有任何外部或受信信息，仅凭公开信息开始攻击。**全知识测试**（也称为**透明盒测试**）向渗透测试人员提供内部信息，包括网络图、策略和程序，有时还包括之前渗透测试人员的报告。**部分知识**测试介于零知识和全知识之间：渗透测试人员接收一些有限的受信信息。\n\
  \n一些客户倾向于零知识方法，认为这能更准确地模拟真实攻击者的过程。这可能是一个错误的前提：真实攻击者可能是内部人员，或拥有内部信息。\n\n全知识测试可以高效得多，使渗透测试人员能更快地发现薄弱环节。大多数渗透测试的范围都包含对测试耗时的限制。有限的测试时间可能导致测试失败，而更多的时间可能带来成功。全知识测试也更安全：如果渗透测试人员在开始测试前拥有关于目标的详尽信息，系统崩溃的可能性就较小。\n\
  \n#### 渗透测试工具与方法论\n\n渗透测试人员通常使用渗透测试工具，其中包括开源的 **Metasploit** ([`www.metasploit.com`](https://www.metasploit.com))\
  \ 和闭源的 **Cobalt Strike** ([`www.cobaltstrike.com/`](https://www.cobaltstrike.com/))\
  \ 以及 **Immunity Canvas** ([`www.immunitysec.com/`](https://www.immunitysec.com/))。渗透测试人员还使用自定义工具，以及发布在互联网上的恶意软件样本和代码。\n\
  \n渗透测试人员使用以下方法论：\n\n*   • 规划\n*   • 侦察\n*   • 扫描（也称为枚举）\n\n\n\n\n### 渗透测试方法论\n\n\
  *   Vulnerability assessment（漏洞评估）\n*   Exploitation（利用）\n*   Reporting（报告）\n\n\
  不道德的黑客通常遵循类似的方法论（尽管他们可能进行较少的规划，且显然会省略报告环节）。他们还会掩盖踪迹（擦除日志和其他入侵迹象），并经常通过安装后门来破坏系统完整性（以维持访问权限）。渗透测试人员应始终保护数据和系统完整性。\n\
  \n> **Note**\n>\n> 渗透测试有时颇具争议。有人认为渗透测试实际上测试的是渗透测试人员的技能，而非组织的边界安全。如果渗透测试成功，对组织是有价值的。但如果渗透测试失败了怎么办？是因为不存在边界风险？还是因为渗透测试人员缺乏技能或时间来完成测试？抑或是因为渗透测试的范围过窄？\n\
  \n#### 确保机密性、数据完整性和系统完整性\n\n渗透测试人员必须确保测试过程中访问的任何敏感数据的机密性。例如，如果渗透测试的目标是信用卡数据库，测试人员可能无合法权利查看或下载信用卡信息。测试人员通常会要求在系统中与信用卡数据相同区域、受相同权限保护的位置放置一个不包含受监管或敏感数据的虚拟文件（有时称为\
  \ Flag）。如果测试人员能读取和/或写入该文件，即证明他们本可以对信用卡数据做同样的操作。\n\n渗透测试人员必须确保客户系统的系统完整性和数据完整性。任何主动攻击（向系统发送数据，而非被动的只读攻击）都可能造成损害：即使是经验丰富的渗透测试人员也不例外。所有相关方必须清楚理解这一风险：测试通常在变更维护窗口期间进行，就是出于这个原因。\n\
  \n在渗透测试开始前应讨论的一个潜在问题是，遇到先前或当前成功恶意攻击迹象的风险。渗透测试人员有时会发现他们不是第一个攻破系统的攻击者：别人抢先了一步。如果攻击者认为已被发现，往往会变得更加恶意，有时会破坏数据和系统完整性。此时系统完整性处于风险之中，渗透测试人员应终止测试，并立即上报该问题。\n\
  \n最后，最终的渗透测试报告应受到最高级别的保护：它包含攻击该组织的路线图。\n\n### 入侵攻击模拟\n\n许多组织每年进行一次第三方渗透测试，通常出于合规原因。这是一种有用但不频繁的测试。入侵攻击模拟旨在实现渗透测试的自动化，且通常全天候运行。其目标是测试组织的预防和检测能力。例如：自动化渗透测试是否成功（预防：系统是否被攻破）？检测：SOC\
  \ 是否察觉？这是一种紫队演练形式，将红队演练（渗透测试）与蓝队演练（检测和防御入侵）相结合：\n\n> *红队和蓝队演练长期以来一直是重要的安全工具，但它们有两个关键缺点：高度依赖人工且资源密集。这意味着大多数组织只能间歇性地运行这些测试。这意味着在测试间隔的几周或几个月内，漏洞可能在未被发现的情况下出现，而防御者对其安全环境的真实状态知之甚少……*\n\
  >\n> *通过结合红队和蓝队技术（称为“紫队演练”实践）并将其自动化，入侵攻击平台提供持续覆盖。这些模拟可全天候运行，确保组织对其防御就绪状态的真实情况保持更深度的可见性。这至关重要，因为攻击者只要有足够的时间就能攻破任何安全设置，这使得持续测试成为降低风险最有效的方式*\
  \ [\\[2\\]](#Ch007_337-359_B978044318734600009X.xhtml#bb0015)。\n\n### 漏洞评估\n\n**漏洞评估**（也称为漏洞扫描）针对预定义漏洞列表（如系统配置错误、软件过时或缺乏补丁）扫描网络或系统。可使用\
  \ Nessus（<https://www.tenable.com/products/nessus-vulnerability-scanner>）或 OpenVAS（<https://www.openvas.org>）等漏洞测试工具来识别漏洞。\n\
  \n我们在第 2 章“领域 1：安全与风险管理”中了解到风险 = 威胁 × 漏洞。重要的是要记住，漏洞扫描器只展示了风险方程的一半：其输出必须与威胁相匹配，才能映射真实风险。这是需要识别的重要一半，但这些工具只完成了总工作的一部分。许多组织陷入只查看漏洞而不将其与威胁匹配的误区，因此无法理解或缓解真实的业务风险。\n\
  \n### 安全审计\n\n**安全审计**是针对已发布标准的测试。例如，组织可能因 PCI-DSS（支付卡行业数据安全标准，详见第 3 章“领域 2：资产安全”）合规性而接受审计。PCI-DSS\
  \ 包含许多必需控制，如防火墙、特定访问控制模型和无线加密。审计员随后验证站点或组织是否符合发布的标准。\n\n### 安全评估\n\n**安全评估**是评估访问控制有效性的整体方法。安全评估不局限于渗透测试或漏洞评估，而是具有更广泛的范围。\n\
  \n安全评估跨多个领域查看许多控制，可能包括以下内容：\n\n*   Policies, procedures, and other administrative\
  \ controls（策略、程序和其他管理控制）\n*   Assessing the real world-effectiveness of administrative\
  \ controls（评估管理控制的现实有效性）\n*   Change management（变更管理）\n*   Architectural review（架构审查）\n\
  *   Penetration tests（渗透测试）\n*   Vulnerability assessments（漏洞评估）\n*   Security audits（安全审计）\n\
  \n如上列表所示，安全评估可能包含其他不同的测试，如渗透测试。其目标是广泛覆盖许多其他特定测试，以确保考虑访问控制的所有方面。\n\n### 日志审查\n\n\
  作为一种安全控制，日志在安全问题检测、事件响应决策支持及取证审查中发挥着至关重要的作用。从评估和测试的角度来看，目标是审查日志以确保它们能尽可能有效地支持信息安全。\n\
  \n审查 IT 系统中的安全审计日志是验证访问控制机制是否充分执行的最简单方法之一。审查审计日志主要是一种检测性控制。\n\n根据 NIST Special Publication\
  \ 800-92（<https://csrc.nist.gov/publications/detail/sp/800-92/final>），应收集以下日志类型：\n\
  \n*   **Network Security Software/Hardware（网络安全软件/硬件）：**\n    *   Antivirus logs（防病毒日志）\n\
  \    *   IDS/IPS logs（入侵检测/防御系统日志）\n    *   Remote Access Software（远程访问软件，如 VPN\
  \ 日志）\n    *   Web proxy（Web 代理）\n    *   Vulnerability management（漏洞管理）\n    *\
  \   Authentication servers（认证服务器）\n    *   Routers and firewalls（路由器和防火墙）\n*   **Operating\
  \ System（操作系统）：**\n    *   System events（系统事件）\n    *   Audit records（审计记录）\n* \
  \  **Applications（应用程序）：**\n    *   Client requests and server responses（客户端请求和服务端响应）\n\
  \    *   Usage information（使用信息）\n\n\n\n\n*   ° 重大运营行动 [[3]](#Ch007_337-359_B978044318734600009X.xhtml#bb0020)\n\
  \n从主动审计日志管理和监控中获得的情报非常有益：数千个系统收集的防病毒日志可以非常准确地描绘恶意软件的当前状态。防病毒警报结合来自身份验证服务器的失败身份验证警报激增，或出站防火墙拒绝激增，可能表明密码猜测蠕虫正试图在网络上传播。\n\
  \n根据 Anton Chuvakin 的《日志分析的五个错误》（参见 [`www.computerworld.com/article/2567666/five-mistakes-of-log-analysis.xhtml`](https://www.computerworld.com/article/2567666/five-mistakes-of-log-analysis.xhtml)），审计记录管理通常面临五个不同的问题：\n\
  \n1.  日志未定期及时审查。\n2.  审计日志和审计跟踪存储时间不够长。\n3.  日志未标准化，也无法通过关联工具集查看——只能从被审计的系统查看。\n\
  4.  日志条目和警报未按优先级排序。\n5.  审计记录仅针对“坏东西”进行审查 [[4]](#Ch007_337-359_B978044318734600009X.xhtml#bb0025)。\n\
  \n许多组织收集审计日志，然后犯下上述一种或多种错误。上一段提到的有用情报（通过防病毒警报结合身份验证失败或防火墙拒绝来识别蠕虫）只有避免这些错误才能实现。\n\
  \n### 集中式日志记录\n\n应配置集中式日志存储。将日志存放在中央存储库中，可实现更具可扩展性的安全监控和入侵检测能力。如果端点的日志视图被损坏或被故意篡改，集中式日志存储库还可以帮助验证日志信息的完整性。在传输和存储日志数据时，应考虑确保日志信息的完整性。\n\
  \n> **注意**\n>\n> `Syslog` 是应用最广泛的日志记录子系统，默认通过 `UDP/514` 以明文形式向远程服务器传输日志数据。`UDP`\
  \ 是一种不保证传输送达的传输协议，这对确保日志记录的连续性有影响。这意味着，即使端点没有任何机制得知传输失败，中央日志服务器也可能未接收到所有日志数据。`Syslog`\
  \ 的明文特性意味着处于合适位置的攻击者可以在日志数据遍历网络时查看（潜在的敏感）日志数据。由于缺乏认证、缺乏加密，且使用 `UDP` 作为第 4 层传输协议，`Syslog`\
  \ 消息也可能被伪造。\n\n除了集中式日志外，最好至少在端点系统本身上保留一些有限的近期日志。除了集中式日志存储外，拥有本地日志在多方面都有帮助。如果日志记录的连续性中断，仍可能从端点恢复日志。如果攻击者故意破坏或编辑端点上的日志，对比差异可指导事件响应人员了解攻击者的活动。\n\
  \n### 日志保留\n\n应创建并维护日志信息的保留和轮转策略。保留和轮转应根据日志来源、日志信息类型和日志信息的实际价值而有所不同。 拥有大量被完全忽略的日志数据价值极小，还会使在其余日志中查找有意义的数据更具挑战性。虽然日志信息的安全价值很重要，但日志保留也可能与法律或法规合规事项相关。考虑日志保留时，必须将法律或法规因素纳入考量。\n\
  \n### 合规性检查\n\n合规性检查审查组织的政策和程序，以验证其是否符合相关最佳实践以及相关行业和政府标准。`NIST Special Publication\
  \ 800-53, Revision 5—Security and Privacy Controls for Information Systems and Organizations`\
  \ 规定如下：\n\n> *组织在处理信息安全和隐私控制时，应回答以下几个关键问题：*\n>\n> *   需要哪些安全和隐私控制来满足安全和隐私要求，并充分管理任务/业务风险或对个人的风险？\n\
  > *   选定的控制是否已实施，或是否有计划实施？\n> *   所需的保证级别（即信心依据）是多少？即选定的控制按设计和实施后是否有效？ [[5]](#Ch007_337-359_B978044318734600009X.xhtml#bb0030)\n\
  \n`NIST SP 800-53R5` 列出了应验证的以下控制：\n\n*   访问控制\n*   意识培训\n*   审计和问责\n*   评估、授权和监控\n\
  *   配置管理\n*   应急计划\n*   标识和认证\n*   事件响应\n*   维护\n*   媒体保护\n*   物理和环境保护\n*   规划\n\
  *   项目管理\n*   人员安全\n*   个人身份信息处理和透明度\n*   风险评估\n*   系统和服务获取\n*   系统和通信保护\n*   系统和信息完整性\n\
  *   供应链风险管理 [[5]](#Ch007_337-359_B978044318734600009X.xhtml#bb0030)\n\n然后执行以下步骤：进行差距分析，查看这些控制（以及任何其他必要的控制）是否到位。然后确定这些控制是否全面且有效。\n\
  \n### 合成事务\n\n合成事务或合成监控涉及构建脚本或工具，以模拟应用程序中通常执行的活动。使用合成事务/监控的典型目标是建立这些事务性能的预期基准。这些合成事务可自动化，定期运行以确保应用程序仍按预期运行。此类事务在部署前测试应用程序更新也很有用，可确保功能和性能不会受到负面影响。这种测试或监控最常与定制开发的\
  \ Web 应用程序相关联。\n\nMicrosoft TechNet 文章“使用合成事务进行监控”对合成事务进行了描述：“例如，对于网站，您可以创建一个合成事务，执行客户连接到站点并浏览其页面的操作。对于数据库，您可以创建连接到数据库的事务。然后，您可以安排这些操作按固定时间间隔发生，以查看数据库或网站的反应，并查看您的监视设置（如警报和通知）是否也按预期做出反应”\
  \ [[6]](#Ch007_337-359_B978044318734600009X.xhtml#bb0035)。\n\n### 应用程序安全测试\n\n软件测试可视为安全控制测试的一个专门子集，侧重于组织应用程序的安全性。存在多种软件测试方法。除了测试软件的功能和稳定性外，测试越来越多地侧重于发现可能导致漏洞并危及系统安全的特定程序员错误，包括缺乏边界检查。\n\
  \n\n\n\n#### 应用安全测试\n\n与现成的应用程序不同，定制开发的应用程序没有供应商定期提供安全补丁。发现这些缺陷的责任在于开发该应用程序的组织。对定制开发应用程序的源代码审查是应用安全中采用的关键方法之一。\n\
  \n自动化代码审查主要有两种通用方法：静态分析和动态分析。`CISSP®` 还提到了人工代码审查，这仅意味着由知识渊博的人员手动审查代码。敏捷软件开发团队采用的结对编程，可被视为人工源代码审查的一个例子。\n\
  \n##### 静态应用安全测试 (SAST) 与动态应用安全测试 (DAST)\n\n**静态应用安全测试 (SAST)** 对代码进行被动测试；代码处于非运行状态。这包括代码演练、语法检查和代码审查。静态分析工具审查原始源代码本身，寻找漏洞证据，以及源代码中使用的已知不安全实践、函数、库或其他特征。`UNIX`\
  \ 程序 `lint` 对 `C` 程序执行静态测试。\n\n代码编译器警告也可被视为静态分析的“轻量级”形式。`C` 编译器 `GCC` (`Gnu Compiler\
  \ Collection`，参见：<https://gcc.gnu.org>) 包含静态代码分析功能：“`gcc` 编译器包含 `lint`（经典的 `C` 程序验证器）的许多功能，甚至更多……`gcc`\
  \ 编译器可以识别许多即使符合语言语法规则但仍可能构成潜在问题的 `C` 程序结构。例如，您可以要求编译器报告变量是否已声明但未使用、注释是否未正确终止，或函数返回的类型在旧版本的\
  \ `C` 中是不允许的。”请注意，`GCC` 本身不可测试，此处仅作为具有静态测试能力的编译器的一个示例 [[7]](#Ch007_337-359_B978044318734600009X.xhtml#bb0040)。\n\
  \n**动态应用安全测试 (DAST)** 在代码执行时对其进行测试。通过动态测试，在运行或执行待审查的代码或应用程序时执行安全检查。\n\n这两种方法都很合适，且相互补充。静态分析工具可能会发现尚未以暴露缺陷的方式完全实现的代码中的缺陷，而动态测试无法触及这些缺陷。然而，动态分析可能会发现静态分析遗漏的、存在于代码实现和交互中的缺陷。\n\
  \n“左移” 一词描述的是在软件开发生命周期中尽早发现（或避免）缺陷。缓解漏洞的最佳方法是从不引入该漏洞，因此培训开发人员编写安全代码（并避免错误）至关重要。假设漏洞存在，`SAST`\
  \ 在软件开发过程的早期发现缺陷，此时缓解起来更容易（且成本更低）。`DAST` 发生在开发过程的后期，增加了缓解已发现缺陷所需的时间（和成本）。\n\n**白盒软件测试**\
  \ 使测试人员能够访问程序源代码、数据结构、变量等。**黑盒测试** 不向测试人员提供任何内部细节：软件被视为一个接收输入的黑盒。\n\n##### 漏洞披露\n\
  \n执行应用安全测试可能会导致发现第三方软件中的漏洞。披露描述的是发现软件漏洞后采取的行动。该话题颇具争议：如果您在知名软件（如 `Apache Web` 服务器或微软的\
  \ `IIS` (`Internet Information Services`) Web 服务器）中发现缺陷，应该采取什么行动？\n\n假设您是一位合乎道德的研究人员，风险不在于您了解该漏洞：风险在于其他人可能独立发现该漏洞，或者可能已经发现了。如果这些人不道德，则运行该易受攻击软件的任何人都面临风险。\n\
  \n合乎道德的研究人员可以私下通知负责该软件的供应商，并分享表明该软件存在漏洞的研究成果。如果供应商迅速发布修复程序或补丁，此流程效果良好，但如果供应商不采取任何行动怎么办？\n\
  \n**完全披露** 是公开发布漏洞详细信息的有争议做法。其基本原理是：如果坏人可能已经掌握了该信息，那么每个人也都应该掌握。这确保了白帽子也能收到信息，并将迫使供应商修补漏洞。支持者认为，易受攻击的软件应尽快修复；依赖（感知到的）对漏洞的不知情属于“通过隐匿实现安全”，许多人认为这无效。\n\
  \n完全披露的做法颇具争议（且被许多人视为不道德），因为许多不道德的黑客（包括脚本小子）可能从中获益；零日漏洞利用（针对无补丁漏洞的利用）更有可能被开发出来，更多无辜组织可能受到损害。\n\
  \n**道德披露**（也称为负责任披露）是指私下与供应商共享漏洞信息，并在补丁可用之前暂缓公开发布。这被认为是最佳的披露选择。在完全披露和负责任披露之间还存在其他选择，包括私下与供应商共享漏洞信息，但设定截止日期，例如“如果三个月内您未发布补丁，我将公开漏洞详情，或在您发布补丁后公开，以先到者为准。”\n\
  \n##### 软件测试层级\n\n通常从多个角度应对软件测试挑战会很有帮助，解决从低到高的各种测试层级。单元测试、安装测试、集成测试、回归测试和验收测试等软件测试层级旨在实现这一目标：\n\
  \n*   **单元测试**：对软件组件（如函数、过程或对象）进行的低级测试\n*   **安装测试**：测试软件在安装和首次运行时的表现\n*   **集成测试**：测试多个软件组件组合成工作系统时的表现。可测试子集，或进行\
  \ **大爆炸集成测试** 以测试所有集成的软件组件\n*   **回归测试**：在更新、修改或打补丁后测试软件\n*   **验收测试**：测试以确保软件满足客户的运营需求。当由客户直接执行此测试时，称为用户验收测试\n\
  \n##### 模糊测试\n\n**模糊测试**（也称为 **模糊测试**）是一种黑盒测试类型，它将随机、畸形的数据作为输入提交给软件程序，以确定它们是否会崩溃。接收畸形或意外输入时崩溃的程序，很可能存在边界检查问题，并可能容易受到缓冲区溢出攻击。\n\
  \n模糊测试通常是自动化的，反复将随机输入字符串作为命令行开关、环境变量和程序输入呈现。任何崩溃或挂起的程序均判定为模糊测试失败。\n\n模糊测试可被视为动态测试的一种特定类型。模糊器仅用于自动向应用程序提供输入。许多人通常将模糊器专门与发现简单的缓冲区溢出条件联系起来。然而，高级和定制的模糊器所做的不仅仅是向应用程序提供海量输入。模糊器可用于且已被用于发现比传统缓冲区溢出缺陷复杂得多的缺陷。\n\
  \n##### 组合软件测试\n\n\n\n##### 组合软件测试\n\n**组合软件测试**是一种黑盒测试方法，旨在识别并测试软件输入的所有唯一组合。组合软件测试的一个示例是**成对测试**（也称为**全对测试**）。\n\
  \nNIST 提供了以下成对测试示例（参见 [`csrc.nist.gov/groups/SNS/acts/documents/kuhn-kacker-lei-hunter09.pdf`](http://csrc.nist.gov/groups/SNS/acts/documents/kuhn-kacker-lei-hunter09.pdf)）：“假设我们要演示一个新的软件应用程序能在使用\
  \ Windows 或 Linux 操作系统、Intel 或 AMD 处理器以及 IPv4 或 IPv6 协议的 PC 上正确运行。这总共是 2 × 2 × 2\
  \ = 8 种可能性，但正如表 7.1 所示，只需四个测试即可测试每个组件与其他每个组件之间至少一次的交互。在这种最基本的组合方法（称为成对测试）中，这四个测试中的至少一个涵盖了三个参数中所有可能的值对（t\
  \ = 2）” [[8]](#Ch007_337-359_B978044318734600009X.xhtml#bb0045)。\n\n###### 表 7.1：NIST\
  \ 成对测试示例 [[8]](#Ch007_337-359_B978044318734600009X.xhtml#bb0045)\n\n| 测试用例 | 操作系统\
  \ | CPU | 协议 |\n| --- | --- | --- | --- |\n| 1 | Windows | Intel | IPv4 |\n| 2 |\
  \ Windows | AMD | IPv6 |\n| 3 | Linux | Intel | IPv6 |\n| 4 | Linux | AMD | IPv4\
  \ |\n\n###### 追踪矩阵\n\n**追踪矩阵**（有时称为需求追踪矩阵，或 RTM）可用于将客户需求映射到软件测试计划：它“追踪”“需求”，并确保需求得到满足。它通过将客户用例映射到测试用例来实现这一点。表\
  \ 7.2 显示了一个示例需求追踪矩阵。\n\n###### 表 7.2：示例需求追踪矩阵 [[9]](#Ch007_337-359_B978044318734600009X.xhtml#bb0050)\n\
  \n| 需求 ID | 被测需求 | 用例 1.1 | 用例 1.2 | 用例 1.3 | … |\n| --- | --- | --- | --- | ---\
  \ | --- |\n| 测试用例 | 34 | 2 | 4 | 7 | |\n| TC1.1.1 | 2 | X | | X | |\n| TC1.1.2 |\
  \ 1 | | | | |\n| TC1.2.1 | 3 | X | | X | |\n| TC1.2.2 | 1 | | X | | |\n| TC1.2.3\
  \ | 2 | | | X | |\n| … | | | | | |\n\n###### 误用用例测试\n\n合成事务旨在模拟正常行为；误用用例测试旨在模拟异常用户行为。应用程序的用例详细说明了各种功能将如何在应用程序中被利用。正式用例通常构建为流程图，使用**UML**（统一建模语言）编写，旨在帮助建模预期的行为和功能。\n\
  \n误用用例测试的思路是正式建模（同样很可能使用**UML**），对手如何通过滥用应用程序来实现安全影响。这可以简单地视为一种不同类型的用例，但专门提出误用用例测试的原因是为了突显普遍缺乏对针对应用程序的攻击的考虑。\n\
  \n###### 测试覆盖率分析\n\n测试或代码覆盖率分析旨在确定已测试的应用程序百分比。目标是确保不存在重大缺口，即缺乏测试可能导致本应被发现的缺陷或安全问题遗留存在。\n\
  \n###### 接口测试\n\n应用程序内的传统接口测试主要关注适当的功能是否通过用户与应用程序交互的所有方式暴露出来。从安全导向的角度来看，目标是确保安全性在各种接口上得到统一应用。实际上，这种类型的测试考虑了对手可能利用的各种潜在攻击向量。\n\
  \n一个简化的示例可能是一个 Web 应用程序，当客户端具备该能力时使用 Adobe Flash，但会向缺乏 Adobe Flash 支持的客户端呈现替代视图。如果测试仅使用内置\
  \ Flash 支持的桌面浏览器执行，则可能会遗漏呈现给 iPhone 的移动版应用程序中存在的安全缺陷。虽然接口测试不仅限于桌面与移动浏览器的对比，但该概念仍然适用。无论人或机器以何种方式与代码交互，应用程序的安全需求都必须得到实施。\n\
  \n###### 分析和报告测试输出\n\n积累大量安全测试结果很容易；但根据这些结果修复发现的问题则困难得多。一个例子是组织几乎持续不断地执行漏洞扫描。然而，仅生成该报告并无法改善现状。生成安全测试数据是必要的第一步，但不足以改善未来的测试结果。\n\
  \n待分析的数据量可能惊人，但应采用某种方法来确定优先审查和处理某些结果而非其他结果的顺序。与安全领域的许多事物一样，分诊的方法应基于对风险的理解。想象一下，完全相同的缺陷或漏洞存在于组织中的每个系统上。与每个漏洞相关的风险会相同吗？不，当然不会。即使完全相同的缺陷存在，风险也可能因系统或数据的关键性、对手利用每个缺陷表现形式的可能性等因素而截然不同。\n\
  \n组织应已拥有大量针对业务资产的机密性、完整性和可用性关注点的数据。这些数据应用于指导安全测试输出的分析。视风险数据的易用程度而定，一些基本的优先级排序和分析可能可以自动化。其他数据最初至少需要人工审查，但应尽可能以有助于更好地实现未来测试数据审查自动化的方式进行记录。\n\
  \n必须建立管理例外的正式流程。遗留系统是一个常见示例。它们通常缺乏现代控制，且通常被漏洞扫描软件视为关键风险。用现代、安全的系统替换所有遗留系统是显而易见的选择，但预算限制可能使其在短期内不可能实现。在这种情况下，应使用补偿控制（如额外的防火墙、物理隔离、应用程序白名单和额外的监控）。在这种情况下，应要求系统或数据所有者书面接受风险。\n\
  \n### 收集安全流程数据\n\n组织需要收集支持其安全流程和控制日常有效性的数据。待提出的问题包括：账户管理的运营效果如何，备份能否恢复，以及能否及时恢复？请注意，收集灾难恢复规划（**DRP**）和业务连续性规划（**BCP**）数据也是此过程的一部分。我们将在第\
  \ 8 章（Chapter 8），领域 7：安全运营中讨论 **DRP** 和 **BCP**。\n\n#### 账户管理\n\n审计账户管理的运营有效性至关重要。新员工入职，现有员工可能变更角色，员工也可能离职。需要回答的一个关键问题是：实际账户访问权限与期望状态的匹配度有多高？常见的审计步骤包括：\n\
  \n\n\n*   获取过去一年内离职员工的名单，并核实其所有账户和访问权限均已撤销。这包括计算机账户、电子邮件账户，以及通过智能卡对建筑物和车库的物理访问权限。\n\
  *   要求人力资源部提供所有岗位发生变动的员工名单，并核实与其旧岗位相关的不必要账户或访问权限已被撤销。\n*   审计账户配置流程。假设需要正式批准，将最终账户批准的时间和日期与系统上实际账户创建的时间和日期进行比较。前者应始终早于后者（而非相反）。\n\
  *   核实临时账户和紧急账户已及时禁用。\n*   识别不活跃账户（长时间未被访问的账户），并核实它们已及时禁用。\n*   审计所有特权组（如 Windows\
  \ Active Directory 域管理员），并核实其中包含的所有账户均正确无误。\n\n##### 管理审查与批准\n\n在讨论账户管理时，存在两类管理者：系统账户管理员（如负责创建电子邮件账户的员工）和员工的直属管理者（即其汇报对象）。员工的管理者必须为账户创建提供正式批准，作为账户创建流程的一部分。当角色变更、员工离职等情况发生时，他们也应发出通知。\n\
  \n假设某组织的政策要求员工的管理者在其员工角色发生变更后 24 小时内通知系统账户管理员。请注意，对此时长并无行业通用的最佳实践：它取决于各组织的风险分析。NIST\
  \ 特别出版物 800-53r5 列出了必须在该时长内（本例中为 24 小时）发生的以下账户管理和审查步骤：*当账户不再需要、用户被终止或调岗、以及个人的系统使用需求或知情需求发生变化时，通知账户管理员*\
  \ [\\[5\\]](#Ch007_337-359_B978044318734600009X.xhtml#bb0030)。\n\n##### 关键绩效与风险指标\n\
  \n关键绩效指标 (KPI) 和关键风险指标 (KRI) 是广泛使用的商业术语，同样适用于信息安全领域。在信息安全领域，关键绩效指标用于衡量可用性，（顾名思义）风险指标用于衡量风险。\n\
  \nKPI 示例包括系统正常运行时间、带宽和延迟、发送和接收的电子邮件数量以及并发用户数。KRI 示例包括漏洞扫描发现、未修补系统的跟踪、遗留系统、单因素认证的使用以及防病毒事件。图\
  \ 7.1 展示了一个 KRI 跟踪系统更新、漏洞、用户识别和自动注销的示例。\n\n![图 7.1 关键风险指标。来源：https://www.researchgate.net/publication/283329102\\\
  _THE\\_INFORMATION\\_CONFIDENTIALITY\\_AND\\_CYBER\\_SECURITY\\_IN\\_MEDICAL\\_INSTITUTIONS。图片作者：Claudia\
  \ Diana, Sabau-Popa & Ioana-Alexandra, Bradea & Bolos, Marcel & Delcea, Camelia。图片遵循知识共享署名-禁止演绎\
  \ 4.0 国际许可协议 (CC BY-ND 4.0)。](img/f07-01-9780443187346.jpg)\n\n图 7.1 关键风险指标。来源：[`www.researchgate.net/publication/283329102\\\
  _THE\\_INFORMATION\\_CONFIDENTIALITY\\_AND\\_CYBER\\_SECURITY\\_IN\\_MEDICAL\\_INSTITUTIONS`](https://www.researchgate.net/publication/283329102_THE_INFORMATION_CONFIDENTIALITY_AND_CYBER_SECURITY_IN_MEDICAL_INSTITUTIONS)。图片作者：Claudia\
  \ Diana, Sabau-Popa & Ioana-Alexandra, Bradea & Bolos, Marcel & Delcea, Camelia。图片遵循知识共享署名-禁止演绎\
  \ 4.0 国际许可协议 (CC BY-ND 4.0)。\n\n##### 备份验证数据\n\n备份是一项关键的运营控制，勒索软件的兴起进一步凸显了其影响。有一句古老的运营谚语：直到你成功恢复它之前，你并没有真正的备份。对备份进行差距分析，识别未备份的关键系统和数据，至关重要。但这还不够：能否在运营允许的时限内恢复备份才是重中之重。\n\
  \n我们将在第 8 章（第 7 领域：安全运营）中讨论三个关键指标——恢复点目标 (RPO)、恢复时间目标 (RTO) 和工作恢复时间 (WRT)。此处简要预览：RPO\
  \ 是组织所能承受的数据丢失量或系统不可用时间（以时间衡量）。RTO 描述恢复业务或 IT 系统所允许的最长时间。WRT 描述配置恢复系统所需的时间。\n\n\
  许多组织关注恢复数据的能力，却未计算所需时间。假设某组织拥有所有关键数据的完整备份：如果勒索软件感染了数百个关键系统并加密了数据，恢复需要多长时间？如果答案是数周或数月，业务能撑那么久吗？这说明完整备份本身是不够的：正确计算\
  \ RPO、RTO 和 WRT 至关重要。该过程的一部分是主动恢复关键数据，并测量恢复关键系统所需的时间。\n\n##### 培训与意识跟踪\n\n正如第 2\
  \ 章（第 1 领域：安全与风险管理）所讨论的，安全意识和培训常被混淆。意识改变用户行为；培训提供技能组合。两者都需要正式跟踪。\n\n组织应执行差距分析，以确定员工是否已接受其岗位所需的培训（如云工程师）。未能做到这一点可能导致严重问题：在工作中非正式地学习云工程等专业技能“在职学习”，可能导致知识出现重大缺口，进而引发错误、中断和泄露。此过程需要建立正式的预算项目计划，提供内部或第三方培训（或两者结合）。\n\
  \n每位员工都需接受例行强制性的用户安全意识培训，并跟踪出席情况。一些组织将年度生活成本调整与多种因素挂钩，包括是否完成了意识培训。这能确保近 100% 的出席率。\n\
  \n### 考试目标总结\n\n在本领域中，我们了解了测试组织真实安全性的各种方法，包括漏洞扫描、渗透测试、安全评估和审计。漏洞扫描确定“风险 = 威胁 × 漏洞”方程中的一半因素。渗透测试旨在将这些漏洞与威胁相匹配，以展示真实风险。评估提供更广阔的安全视图，而审计则证明符合已发布的规范（如\
  \ PCI-DSS）。我们讨论了综合事务，它尝试使用脚本或工具模拟应用程序中正常执行的活动，以模拟应用程序的真实使用。我们还讨论了测试代码安全，包括静态方法，如源代码分析、代码走查、语法检查和使用安全编译器。我们讨论了用于运行代码的动态方法，包括模糊测试和各种形式的黑盒测试。\n\
  \n### 自我测试\n\n> **注意**\n>\n> 请参阅自我测试附录，了解所有正确和错误答案的解释。\n\n1.  **1. 什么过程涉及构建脚本或工具来模拟应用程序中正常执行的活动？**\n\
  \    1.  A. 测试覆盖率分析\n    2.  B. 误用用例测试\n    3.  C. 综合事务\n    4.  D. 渗透测试\n\n\n\n\
  \n### 练习题\n\n#### 2. 哪个安全指标用于衡量可用性？\n1. A. 关键正常运行时间指标\n2. B. 关键风险指标\n3. C. **关键绩效指标**\n\
  4. D. 关键响应指标\n\n#### 3. 哪个流程旨在自动化渗透测试，且通常 24/7/365 全天候运行？\n1. A. 误用案例测试\n2. B. 综合事务\n\
  3. C. **违规攻击模拟**\n4. D. 测试覆盖率分析\n\n#### 4. 哪种类型的渗透测试不掌握任何外部或受信信息，仅凭公开信息发起攻击？\n1.\
  \ A. 全知晓\n2. B. 部分知晓\n3. C. 灰盒\n4. D. **零知识**\n\n#### 5. 哪种类型的评估最能证明组织符合 PCI-DSS（支付卡行业数据安全标准）？\n\
  1. A. **审计**\n2. B. 渗透测试\n3. C. 安全评估\n4. D. 漏洞评估\n\n#### 6. 哪种类型的测试会向渗透测试人员提供内部信息，包括网络图、策略和程序，有时还包括之前渗透测试人员的报告？\n\
  1. A. **全知晓**\n2. B. 部分知晓\n3. C. 灰盒\n4. D. 零知识\n\n#### 7. 什么可用于确保软件满足客户的运营需求？\n\
  1. A. 集成测试\n2. B. 安装测试\n3. C. **验收测试**\n4. D. 单元测试\n\n#### 8. 哪个术语描述了一种无技术或低技术含量的方法，利用人类心理绕过安全控制？\n\
  1. A. 模糊测试\n2. B. **社会工程学**\n3. C. 战争拨号\n4. D. 零知识测试\n\n#### 9. 哪个术语描述了一种黑盒测试方法，旨在识别并测试所有唯一的软件输入组合？\n\
  1. A. **组合软件测试**\n2. B. 动态应用安全测试\n3. C. 误用案例测试\n4. D. 静态应用安全测试\n\n#### 10. 哪个术语描述了一种确定访问控制有效性的整体方法，且范围广泛？\n\
  1. A. **安全评估**\n2. B. 安全审计\n3. C. 渗透测试\n4. D. 漏洞评估\n\n---\n\n### 场景题 (Questions\
  \ 11–14)\n\n**场景描述：**\n你是一家大型银行的 CISO，已聘请一家公司提供整体安全评估，并对组织进行渗透测试。目标是确定整体信息安全有效性，特别是判断财务数据被盗是否可能。\n\
  \n该银行最近部署了一个定制开发的三层 Web 应用程序，允许客户查询余额、转账，并通过智能手机拍照上传支票图像进行存款。除了传统的浏览器界面，公司还为 Apple\
  \ iOS 和 Android 设备开发了智能手机 App。\n\n合同已签署，双方已就范围和交战规则达成一致。银行提供了一名 24/7 值班的 IT 联系人，以防渗透测试期间发生任何意外情况，包括潜在的服务意外中断。\n\
  \n#### 11. 假设渗透测试成功，渗透测试公司证明财务数据被盗风险的最佳方式是什么？\n1. A. 指示渗透测试团队对包含财务数据的服务器进行彻底的漏洞评估\n\
  2. B. 指示渗透测试团队下载财务数据，对其进行编辑，并据此报告\n3. C. 指示渗透测试团队只能通过加密且经过身份验证的通道下载财务数据\n4. D. **在财务数据所在的同一位置放置一个无害的“标志”文件，并通知渗透测试团队下载该标志**\n\
  \n#### 12. 哪种类型的渗透测试能最有效地利用时间和小时顾问费用？\n1. A. 自动化知识\n2. B. **全知晓**\n3. C. 部分知晓\n\
  4. D. 零知识\n\n#### 13. 你希望安全公司测试新的 Web 应用程序，但决定不共享底层源代码。可使用哪种测试类型来帮助确定定制 Web 应用程序的安全性？\n\
  1. A. 安全编译器警告\n2. B. **模糊测试**\n3. C. 静态测试\n4. D. 白盒测试\n\n#### 14. 在渗透测试过程中，测试人员发现新定制的三层\
  \ Web 应用程序存在活跃入侵的迹象。他们的最佳行动方案是什么？\n1. A. 尝试遏制并根除恶意活动\n2. B. 继续测试\n3. C. **悄悄结束测试，立即致电运维\
  \ IT 联系人，并上报该问题**\n4. D. 关闭服务器\n\n#### 15. 拖放题：以下关于 Syslog 的陈述哪些是正确的？将左侧所有正确答案拖放至右侧。\n\
