- "## CISSP 学习指南\n\n\n\n## 作者简介\n\n**Eric Conrad** (`CISSP®`, `GIAC GSE`, `GPEN`,\
  \ `GCIH`, `GCIA`, `GCFA`, `GAWN`, `GSEC`, `GMON`, `GISP`) 是 SANS Institute Fellow（资深研究员）兼\
  \ Backshore Communications 的首席技术官，该公司提供威胁狩猎、渗透测试、事件处理和入侵检测咨询服务。Eric 于 1991 年开始其职业生涯，在一家小型海洋通信公司担任\
  \ UNIX 系统管理员。他在研究、教育、电力、互联网和医疗保健等多个行业积累了信息安全经验，职位涵盖从系统程序员到安全工程师，再到 HIPAA 安全官和 ISSO。他合著了`MGT414:\
  \ SANS Training Program for the CISSP Certification`、`SEC511: Continuous Monitoring\
  \ and Security Operations`和`SEC542: Web App Penetration Testing and Ethical Hacking`。Eric\
  \ 毕业于 SANS Technology Institute，获得信息安全工程理学硕士学位。\n\n**Seth Misenar** (`CISSP®`, `GSE`,\
  \ `GDSA`, `GDAT`, `GMON`, `GCDA`, `GCIH`, `GCIA`, `GCFA`) 担任 SANS Institute Faculty\
  \ Fellow（教职研究员）兼 Context Security, LLC 的首席顾问（总部位于密西西比州 Jackson）。他是全球精英安全专家之一，获得了`GIAC\
  \ GSE (#28)`认证。Seth 的专业领域包括安全研究、网络防御与安全运营、安全架构和云安全。Seth 曾为财富 100 强公司担任物理和网络安全顾问，并担任过州政府机构的\
  \ HIPAA 和信息安全官。Seth 为 SANS Institute 教授各种网络安全课程，包括两门他合著的热门课程：最畅销的`SEC511: Continuous\
  \ Monitoring and Security Operations`和`MGT414: SANS Training Program for the CISSP\
  \ Certification`。Seth 拥有 Millsaps College 的理学学士学位。\n\n\n\n\n**Joshua Feldman** (CISSP®)\
  \ 是 Radian Group（纽约证券交易所代码：RDN，一家房地产和抵押保险集团）的安全技术高级副总裁。他的使命专注于保护超过 1000 万美国消费者的金融记录。他是负责\
  \ Radian 技术安全计划所有方面的高管。此前的安全职位包括在 Moody’s Credit Ratings、Corning Inc.、美国国防部和国务院的工作经历。2008\
  \ 年，Joshua 在备考 CISSP® 考试时是 Eric 的学生，并深受 Eric 对教材精通程度的折服，因此邀请 Eric 到国防部与他共事。Eric\
  \ 入职后不久，又邀请了 Seth。该项目成功运行了 8 年多——这证明了为美国军事网络专业人员带来的价值。Joshua 于 1997 年离开公立学校科学教师的职位，开始在\
  \ Network Flight Recorder (NFR, Inc.) 工作，从而踏入网络安全领域；该公司是一家位于华盛顿特区的小型初创企业，制造第一代网络入侵检测系统。他拥有马里兰大学理学学士学位和国防大学网络行动理学硕士学位。他目前与他的小狗\
  \ Jacky-boy 居住在费城。\n\n## 第 1 章：简介\n\n## 摘要\n\n本章概述了 CISSP® 考试，包括参加和通过考试的提示与技巧。\n\
  \n### 关键词\n\nCISSP®；自适应考试；备考卡；考生信息手册；学习计划；模拟测试；2021 年更新；首字母缩略词；词汇表；计算机化考试；背书；多项选择；场景题；拖放题；热点题\n\
  \n**本章考试大纲**\n\n*   如何备考\n*   如何应试\n*   祝你好运！\n\n本书源于现实世界的信息安全行业经验。本书作者曾担任系统管理员、系统程序员、网络工程师/安全工程师、安全总监、HIPAA\
  \ 安全官、高级副总裁、ISSO、安全顾问、讲师等职务。\n\n本书也源于现实世界的教学实践。我们奔波无数里程，向全球专业人士教授信息安全课程。我们在数百堂课中教授了数千名学生：既有实地授课（足迹遍布大多数大洲），也有在线授课。课程当然包括\
  \ CISSP®，还包括持续监控、威胁狩猎、渗透测试、安全基础、黑客技术、信息保障训练营等。\n\n优秀的讲师深知学生投入了时间和金钱与他们相聚，而时间可能是最宝贵的。我们尊重学生及其时间：绝不浪费。我们教授学生必知的知识，并以最高效的方式传授。\n\
  \n本书也是针对同类其他书籍的一种回应。多年来，其他书籍的页数不断增加，往往超过 1000 页。正如 Larry Wall 曾说：“做事不止一种方法” [\\\
  [1\\]](#Ch001_1-10_B9780443187346000040.xhtml#bb0010)。我们的经验告诉我们，还有另一种方法。如果我们能在 6\
  \ 天的训练营中教会有相关经验的人如何通过 CISSP® 考试，那么一本 1000 多页的 CISSP® 书真的有必要吗？\n\n我们自问：我们能做些前人未做之事？能做得更好或不同吗？我们能写一本更薄、直击要点、尊重学生时间、并助他们通过考试的书吗？\n\
  \n我们相信答案是肯定的；你正在阅读的就是成果。我们知晓何为重要，绝不浪费你的时间。我们将 Strunk 和 White “删繁就简” [\\[2\\]](#Ch001_1-10_B9780443187346000040.xhtml#bb0015)\
  \ 的建议铭记于心：这是我们的座右铭。\n\n本书将教授你所需知识，并力求言简意赅。\n\n## 如何备考\n\n阅读本书并彻底理解：所有内容。如果本书涵盖某个主题，那是因为它可考（除非另有说明）。考试旨在测试你对通用知识体系的理解，可将其视为信息安全专业人员的通用语言。它被称为“广度一英里，深度两英寸”。正式术语至关重要：务必重视。\n\
  \n通用知识体系会偶尔更新，最近一次是在 2015 年 4 月。本书已更新，完全反映 2021 年 CISSP® 认证考试大纲。下载并阅读考试大纲是极好的备考步骤。可在此下载：`https://www.isc2.org/CISSP-Exam-Outline`。\n\
  \n熟练掌握本书中的首字母缩略词及其代表的完整单词，做到倒背如流。尽管考试中的缩略词通常会包含其全拼形式，但熟悉缩略词的考生能更快地推进考试进度。\n\n考试题目语言有时可能显得不明朗：通用知识体系中的正式术语可作为灯塔，指引你攻克难题，高亮显示题目中真正关键的词汇。\n\
  \n### CISSP® 考试是一场管理类考试\n\n切记 CISSP® 考试是一场管理类考试：以信息安全经理的身份回答所有问题。许多问题模糊且背景信息有限：当被问及最佳答案时，你可能会想：“视情况而定。”\n\
  \n以管理者的思维思考并作答。例如：考试陈述你关注网络利用。如果你是专业渗透测试人员，你可能会疑惑：我是要发起利用，还是缓解利用？“关注”是什么意思？\n\n\
  你的 CSO 很可能是在试图缓解网络利用，这才是你在考试中应有的回答方式。\n\n### 2021 年更新\n\n2015 年的更新是一次重大变革，将知识领域从\
  \ 10 个减少到 8 个。大量内容被移动。领域内容有时显得杂乱：概念并不总是从一个逻辑流畅地过渡到下一个。有些领域内容庞大，有些则较小。最终这不是问题：你将面对来自\
  \ 8 个领域的问题，且问题不会明确说明其基于哪个领域。\n\n此后的更新（2018 和 2021）保持了 8 个领域的相同设计。2021 年更新侧重于增加更多最新技术内容，包括强调供应链安全、零信任、微服务、容器、无服务器、量子密码学以及其他现代技术主题。\n\
  \n### 备考卡方法\n\n学习时，为那些难以即时记忆的高度具体信息保留一份“备考卡”文件。备选卡就是一个文本文件（可用 WordPad 等简单编辑器创建），包含一份浓缩的详细信息清单。\n\
  \n在备考卡中填入任何对考试重要但你凭借过往经验尚未掌握的详细信息，例如软件能力成熟度模型集成 (CMMI) 的五个级别（涵盖于第 9 章，第 8 领域：软件开发安全），或通用准则级别（涵盖于第\
  \ 4 章，第 3 领域：安全架构与工程）等。\n\n备考卡的目标是避免陷入“杂草丛”中：被难以乍看即记的具体细节淹没。将学习重点放在核心概念上，将具体细节复制到备考卡中。完成后，打印该文件。随着考试日期临近，更仔细地研读备考卡。考前几天，真正专注于那些细节。\n\
  \n##### 模拟测试\n\n\n\n\n## 测验与考试准备\n\n测验是衡量你对本教材理解程度以及考试准备情况的最佳方式。测试题上的一个错误答案就像一束激光：它不仅显示了你知道什么，更重要的是显示了你**不知道**什么。本书每章末尾都有\
  \ 15 道练习测试题，难度从简单到中等再到困难不等。自测附录包含了所有正确和错误答案的解析；这些解析旨在帮助你理解为何你选择的答案会被判定为正确或错误。\n\n\
  你的目标应该是在任何练习测试中达到 80% 或更高的正确率。真实考试要求标准分至少达到 700 分（满分 1000 分），但在练习测试中达到 80% 或更高将给你留出一定的容错空间。做这些测验时要闭卷，就像参加真实考试一样。密切关注任何错误答案，并务必重读本书相关章节。找出你的薄弱领域（我们都有）：即你持续比其他领域答错更多题的领域。然后将学习重点放在这些薄弱环节上。\n\
  \n做练习考试时要计时。目标是答题速度超过每分钟一道题。你需要比真实考试节奏更快，因为实际考试题目可能更难，因此耗时更长。如果你用时超过这个标准，多练习以提高速度。时间管理在考试中至关重要：时间不够通常意味着失败。\n\
  \n### 阅读词汇表\n\n在结束学习时，快速浏览一下本书后部的词汇表。它包含 1000 多个条目，设计上非常详细。此时，词汇表中的所有定义对你来说都应该是熟悉的概念。\n\
  \n如果你看到某个词汇定义不清晰或不明显，请返回其所在的章节，重读相关内容。自问：我是否足够了解这个概念，以至于能回答关于它的问题？\n\n### 准备就绪清单\n\
  \n随着考试临近，这些步骤将作为“准备就绪清单”。如果你记得像管理者一样思考，在练习测试中持续获得 80% 以上的分数，快速回答练习题，理解所有词汇术语，并对你的笔记卡进行最后一次彻底通读，那么你就准备好参加考试了。\n\
  \n## 如何参加考试\n\n截至本书出版时：CISSP® 考试提供八种语言版本：英语、中文、日语、韩语、德语、现代西班牙语、巴西葡萄牙语和法语。英语考试采用\
  \ CISSP® CAT（计算机自适应测试，见下文），而其他语言“以线性、固定形式考试的方式进行” [\\[3\\]](#Ch001_1-10_B9780443187346000040.xhtml#bb0020)。\n\
  \n英语考试现包含 125 到 175 道题，时间限制为 4 小时。4 小时听起来很长，直到你算笔账：240 分钟答 175 道题，平均每道题仅留 82 秒。考试时间长且可能令人精疲力竭；这也是一场与时间的赛跑。准备是成功的关键。\n\
  \n请注意，CISSP® 考试内容通常每 3 年更新一次（截至本书出版，最近一次更新为 2021 年 4 月）。请注意，(ISC)²® 偶尔会更改考试题量和时间限制（而保持可测试内容不变）。最近一次更改（截至本书出版）发生在\
  \ 2022 年 6 月 1 日，当时考试题量从 100–150 道变更为 125–175 道。请随时查看 `https://www.isc2.org/Certifications/CISSP`\
  \ 以获取关于 CISSP® 考试的最新信息。\n\n### 成为 CISSP® 的步骤\n\n成为 CISSP® 需要四个步骤：\n\n*   具备适当的专业信息安全经验\n\
  *   同意遵守 (ISC)²® 职业道德准则\n*   通过 CISSP® 考试\n*   获得另一位 CISSP® 的背书\n\n更多详情请见 `https://www.isc2.org`\
  \ 上提供的考试注册表格。\n\n目前考试要求在 8 个知识域中的 2 个或更多领域拥有 5 年专业经验。这些知识域涵盖在本书的第 2 章至第 9 章中。拥有大学学位或认可的认证可豁免\
  \ 1 年经验；详情请见考试注册表格。\n\n你可以在积累足够专业经验之前通过考试，成为“(ISC)²® 会员”。一旦满足经验要求，即可完成后续流程成为 CISSP®。\n\
  \n(ISC)²® 职业道德准则在第 2 章中讨论，属于知识域 1：安全与风险管理。\n\n通过考试的内容在“如何参加考试”一节中讨论，背书流程在下文的“考试之后”一节中讨论。\n\
  \n### 计算机化考试 (CBT)\n\n(ISC)²® 已与 Pearson VUE (`http://www.pearsonvue.com/`) 合作提供计算机化考试\
  \ (CBT)。Pearson VUE 在全球 160 多个国家设有考试中心；请访问其网站预约考试。请注意，CBT 相关信息可能会变更：请查看 (ISC)²®\
  \ 的考试注册网站 (`https://www.isc2.org/Register-for-Exam`) 以获取 CBT 流程的任何更新。\n\n根据 (ISC)²®\
  \ 的说法，“考生将在考试中心收到非官方考试结果。”结果将在结账过程中由考试管理员发放。(ISC)²® 随后会通过电子邮件发送官方结果。在某些情况下，可能无法提供实时结果：“(ISC)²\
  \ 会对分数数据进行彻底的统计和心理测量分析，以确定通过/不通过分数线，然后才发布分数。我们需要达到最低考生人数才能完成此分析” [\\[4\\]](#Ch001_1-10_B9780443187346000040.xhtml#bb0025)。这通常发生在考试变更时：考生反映在大型考试更新后的几周内，需等待\
  \ 6 周才能收到结果。此后不久即恢复即时出分。\n\n### CISSP® CAT\n\n(ISC)²® 对 CAT（计算机自适应测试）的描述：“CAT 是根据个别考生能力量身定制的考试题目计算机化交付方式。与固定形式、线性考试不同，自适应测试根据考生在考试中表现出的能力来提供题目。通过\
  \ CAT，考生收到的每道题目的难度都经过优化，以尽可能高的效率衡量其能力” [\\[5\\]](#Ch001_1-10_B9780443187346000040.xhtml#bb0030)。\n\
  \n自适应测试可能会让人感到压力。考试引擎旨在呈现考生有 50/50 机会答对的题目：“每答完一道题，题目选择算法就会确定呈给考生的下一道题，期望考生有大约 50%\
  \ 的机会正确回答该题” [\\[5\\]](#Ch001_1-10_B9780443187346000040.xhtml#bb0030)。这意味着考生表现越好：考试难度越大。请记住考试分数是标准化的，且有\
  \ 50 道题是预测试（研究）题，不计入最终分数。\n\n\n\n\n预测试题的加入增加了考试当天的压力：假设最少考 125 道题；其中 40%（50 道）是不计分的。剩下\
  \ 75 道题是计分的，自适应引擎会尝试选择考生有 50/50 几率答对的题目。表现良好的考生实际上可能会答错（远）超过一半的题目。大多数通过考试的学生表示，直到收到成绩前，他们都确信自己挂了，或者完全不确定自己考得如何。这包括那些只考了\
  \ 125 道题就通过的学生（意味着他们表现极好）。\n\n研究表明，前 5-10 道题做得好至关重要：“在计算机自适应测试中，在前五到十道题上花费更多时间和注意力，将提高考生的最终能力估计值”\
  \ [\\[6\\]](#Ch001_1-10_B9780443187346000040.xhtml#bb0035)。开局表现好意味着考试会变得更难，因为考试引擎试图呈现考生有\
  \ 50% 几率答对的题目。这会增加考试当天的压力：考生做得越好，题目就越难。\n\n如果考试在 125 道题时结束；意味着两种情况之一：考生要么完美通过，要么不及格。如果考试继续超过\
  \ 125 道题，考生的水平处于两者之间。考试在此之后可能随时结束，最晚在第 175 道题结束。\n\n### 参加考试\n\n英语考试包含 125 到 175\
  \ 道题，由四种类型组成：\n\n*   单项选择题\n*   场景题\n*   拖放题\n*   热点题\n\n单项选择题有四个可能的答案，分别标记为 A、B、C\
  \ 或 D。每道单项选择题**仅有一个**正确答案。不作答视为答错：猜答案不会扣分。\n\n场景题包含一长段信息，随后是几道基于该场景的单项选择题。题目本身是单项选择题，与其他单项选择题一样，只有一个正确答案。场景描述通常很长，且包含不必要的信息。通常先阅读场景题目会有帮助：这种方法能指导你在场景中寻找的关键词。\n\
  \n拖放题是可视化的单项选择题，可能有多个正确答案。图 1.1 是 第 2 章 领域 1：安全与风险管理的一个示例。\n\n![Fig. 1.1 Sample\
  \ drag and drop question.](img/f01-01-9780443187346.jpg)\n\n图 1.1 拖放题示例。\n\n拖放：识别下列所有对象。将所有对象从左侧拖放至右侧。\n\
  \n正如我们将在 第 2 章 领域 1：安全与风险管理中学到的，物理文件、电子文件和数据库表等被动数据是对象。主体是主动的，如用户和运行中的进程。因此，你需要将对象拖放到右侧，并提交答案，如\
  \ 图 1.2 所示。\n\n![Fig. 1.2 Sample drag and drop answer.](img/f01-02-9780443187346.jpg)\n\
  \n图 1.2 拖放题答案示例。\n\n热点题是只有一个答案的可视化单项选择题。它们会要求你点击图像上的某个区域；网络拓扑图是常见示例。图 1.3 显示了一个热点题示例。\n\
  \n![Fig. 1.3 Sample hotspot question.](img/f01-03-9780443187346.jpg)\n\n图 1.3 热点题示例。\n\
  \n你计划实施单个防火墙，以过滤可信、不可信和 DMZ 流量。放置该防火墙的最佳位置在哪里？\n\n正如我们将在 第 5 章 中学到的，单防火墙 DMZ 设计要求防火墙能在三个接口上过滤流量：不可信（互联网）、可信和\
  \ DMZ。最佳放置位置如 图 1.4 所示。\n\n![Fig. 1.4 Sample hotspot answer.](img/f01-04-9780443187346.jpg)\n\
  \n图 1.4 热点题答案示例。\n\n题目将从 8 个领域中混合出题；题目（公开地）不会说明其基于哪个领域。有 50 道预测试（研究）题不计入最终分数。这些题目没有标记：你必须像它们计分一样作答。\n\
  \n浏览所有题目的关键词，包括正式的通用知识体系（Common Body of Knowledge）术语。缩略语是你的朋友：你能快速识别它们，且它们通常很重要（如果是正式术语）。许多词可能是“干扰”词，旨在迷惑你：忽略它们。仔细注意可能很重要的小词，如“not（不）”。并记住要真正专注于前\
  \ 10 道题。\n\n### 考后\n\n(ISC)²® 不再公布不及格考生的数字分数（过去曾公布）。无论通过与否，你都不会知道自己的数字分数：“(ISC)²\
  \ 不向考生报告答对的题目数量或答对题目的总体百分比；然而，不及格的考生将获得基于其在考试各领域答对题目百分比的领域排名顺序” [\\[7\\]](#Ch001_1-10_B9780443187346000040.xhtml#bb0040)。如果你不及格，利用该列表针对薄弱领域加强学习。然后重考。不要让这种挫折阻碍你实现目标。我们一生都会遭遇逆境：我们如何应对才是关键。考试目前的重考政策是：\n\
  \n**重考间隔的无考试天数：**\n\n*   如果你第一次考试未通过，可在 30 个无考试天后重考。\n*   如果你第二次考试未通过，可在最近一次考试后\
  \ 60 个无考试天后重考。\n*   如果你第三次考试未通过，以及之后所有的重考，可在最近一次考试后 90 个无考试天后重考。\n\n**每个认证项目最多可在\
  \ 12 个月内尝试 (ISC)² 考试 4 次** [\\[8\\]](#Ch001_1-10_B9780443187346000040.xhtml#bb0045)。\n\
  \n考试通过后，你需要另一位 CISSP® 的背书，才能获得“CISSP®”头衔；(ISC)²® 会在发送通过结果的邮件中向你解释此流程。\n\n### 祝好运！\n\
  \n我们生活在一个日益重视认证的世界，信息安全正发展成为一个成熟的职业。成为 CISSP® 可带来巨大的职业收益，作者团队即是受益者。\n\n考试不易，但值得做的事很少容易。投资增值资产总是明智之举：你是在投资自己。祝好运：期待欢迎你加入这个圈子！\n\
