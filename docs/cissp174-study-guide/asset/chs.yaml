  **Storage Area Network (SAN)**  \n存储区域网络。\n\n**Storage channel**  \n使用共享存储（如临时目录）允许两个主体相互发信号的隐蔽信道。\n\
  \n**STP (Shielded Twisted Pair)**  \n屏蔽双绞线，包含每对双绞线周围额外金属屏蔽层的网络布线。\n\n**Strike plate**\
