  \ 9 章：领域 8：软件开发安全\n\n## 摘要\n\n本章介绍 CISSP®的领域 8——软件开发安全。该领域最重要的方面与软件和应用程序的开发管理相关。旨在降低缺陷或错误可能性的软件开发方法是本领域的关键主题。特别是，瀑布模型、螺旋模型和快速应用开发（RAD）模型被重点考量。本章另一重要部分致力于理解面向对象编程和设计的原则。几种类型的软件漏洞及其披露相关问题的基本讨论也是本领域的主题。最后，作为许多应用程序的关键组件，数据库也在考量范围内。\n\
  \n### 关键词\n\nDevOps；极限编程；对象；面向对象编程；过程式语言；螺旋模型；系统开发生命周期；瀑布模型\n\n本章考试目标：\n\n*   编程概念\n\
  *   应用开发方法\n*   数据库\n*   面向对象设计与编程\n*   评估软件安全的有效性\n*   人工智能\n\n## 独特术语与定义\n\n*\
  \   **极限编程（XP）**——一种敏捷开发方法，采用成对的程序员基于详细规格说明进行工作\n*   **对象**——一个结合了代码和数据的“黑盒”，能够发送和接收消息\n\
  *   **面向对象编程**——改变了传统的过程式编程方法论，将程序视为一系列通过消息通信的相互连接的对象\n*   **过程式语言**——使用子程序、过程和函数的编程语言\n\
  *   **螺旋模型**——一种旨在控制风险的软件开发模型\n*   **系统开发生命周期**——一种在每个阶段都关注安全的开发模型\n*   **瀑布模型**——一种使用严格阶段的应用开发模型；一个阶段结束，下一个阶段开始\n\
  \n## 简介\n\n软件无处不在：不仅存在于我们的计算机中，还存在于我们的房屋、汽车和医疗设备中，而所有软件程序员都会犯错。随着软件复杂性的增加，错误的数量也随之增长。我们将在本章了解到，程序员每千行代码可能会犯\
  \ 15-50 个错误，但遵循诸如*能力成熟度模型集成*（CMMI）之类的编程成熟度框架，可以将这一数字降低到每千行 1 个错误。这听起来很令人鼓舞，但请记住，Microsoft\
  \ Vista 操作系统拥有 5000 万（50,000,000）行代码。较新的操作系统（如 Windows 11）很可能拥有更多。\n\n随着软件复杂性的增加，软件崩溃的潜在影响也随之增大。许多汽车现在已连接互联网，并使用“线控”（软件）来控制车辆：在这种情况下，换挡杆不再与变速箱直接机械连接；相反，它充当电子输入设备，类似于键盘。如果软件崩溃中断了\
  \ I/O 会怎样？如果有人远程入侵汽车并夺取控制权会怎样？正如 Charlie Miller 和 Chris Valasek 所演示的那样？[\\[1\\]](#Ch009_459-508_B9780443187346000088.xhtml#bb0010)\n\
  \n开发健壮且安全的软件至关重要：本章将展示如何实现这一点。我们将涵盖编程基础知识，如编译型与解释型语言，以及过程式和面向对象编程语言。我们将讨论应用开发模型，如*瀑布模型*、*螺旋模型*、*极限编程*（XP）等。我们还将讨论*DevOps*等较新概念。我们将描述常见的软件漏洞、测试漏洞的方法，以及用于评估编程过程成熟度并提供改进途径的成熟度框架。\n\
  \n## 编程概念\n\n\n\n\n### 理解基石编程概念\n\n让我们从理解一些基石编程概念开始。随着计算机变得更强大、更普及，创建计算机软件的过程和方法也在增长和变化。请记住，没有一种方法必然优于另一种：正如我们在下一节将看到的，高级语言（如\
  \ C）允许程序员比低级语言（如汇编语言）更快地编写代码，但用汇编语言编写的代码可能效率高得多。哪种更好取决于项目的需求。\n\n#### 机器码、源代码和汇编器\n\
  \n**机器码**（也称为机器语言）是由 CPU 直接执行的软件。机器码依赖于 CPU；它是一系列 1 和 0，转换为 CPU 能够理解的指令。**源代码**是以文本编写的计算机编程语言指令，必须在\
  \ CPU 执行前翻译成机器码。高级语言包含类英语的指令，例如 `printf`（格式化打印）。\n\n**汇编语言**是一种低级计算机编程语言。汇编语言指令是简短的助记符，如\
  \ `ADD`、`SUB`（减法）和 `JMP`（跳转），它们与机器语言指令一一对应。**汇编器**将汇编语言转换为机器语言。**反汇编器**尝试将机器语言转换回汇编语言。\n\
  \n#### 编译器、解释器和字节码\n\n**编译器**获取源代码（如 C 或 Basic），并将其编译为机器码。\n\n以下是一个 C 语言“Hello World”示例程序：\n\
  \n```c\nint main()\n{\n    printf(\"hello, world\");\n}\n```\n\n编译器（如 `gcc`，即 GNU\
  \ 编译器套件，参见 [`gcc.gnu.org`](http://gcc.gnu.org)）将这种高级语言翻译成机器码，并将结果保存为可执行文件（如 `hello-world.exe`）。一旦编译完成，机器语言就由\
  \ CPU 直接执行。`hello-world.exe` 只编译一次，之后可运行无数次。请注意，执行（即运行）程序的过程称为**运行时**。\n\n**解释型语言**与编译型语言不同：解释型代码（如\
  \ Shell 代码）在每次运行程序时即时编译。以下是用解释型脚本语言 Python 编写的“Hello World”程序示例（参见 [`www.python.org`](https://www.python.org)）：\n\
  \n```python\n#!/usr/local/bin/python\nprint(\"Hello World!\")\n```\n\n此代码保存为 `hello-world.py`。每次运行时，Python\
  \ 解释器（在前面的代码中位于 `/usr/local/bin/python`）将 Python 指令翻译成机器语言。如果 `hello-world.py` 运行\
  \ 100 次，它将被编译 100 次（而 `hello-world.exe` 只编译一次）。\n\n**字节码**（如 Java 字节码）也是解释型代码。字节码作为一种中间形式存在（从源代码转换而来），但在\
  \ CPU 上运行前仍必须转换为机器码。Java 字节码是与平台无关的代码，由 Java 虚拟机（JVM，参见第 4 章，领域 3：安全架构与工程，了解更多关于\
  \ Java 字节码的信息）转换为机器码。\n\n#### 过程式语言和面向对象语言\n\n**过程式语言**（也称为面向过程语言）使用子程序、过程和函数。示例包括\
  \ Basic、C、Fortran 和 Pascal。**面向对象语言**尝试通过使用结合了方法和数据的对象来模拟现实世界。示例包括 C++、Ruby 和 Python；更多信息请参见下文的“面向对象设计与编程”部分。过程式语言中的函数等同于面向对象语言中的方法。\n\
  \n以下代码展示了来自 BSD 文本游戏 *Trek* 的 `ram()` 函数的开头，用 C 语言（一种过程式语言）编写：\n\n```c\nvoid ram(ix,\
  \ iy)\nint ix, iy;\n{\n    int i;\n    char c;\n    printf(\"\\07RED ALERT\\07:\
  \ collision imminent\\n\");\n    c = Sect[ix][iy];\n    switch (c)\n    {\n    \
  \    case KLINGON:\n            printf(\"%s rams Klingon at %d,%d\\n\", Ship.shipname,\
  \ ix, iy);\n            killk(ix, iy);\n            break;\n        case STAR:\n\
  \        case INHABIT:\n            printf(\"Yeoman Rand: Captain, isn't it getting\
  \ hot in here?\\n\");\n            sleep(2);\n            printf(\"Spock: Hull temperature\
  \ approaching 550 Degrees Kelvin.\\n\");\n            lose(L_STAR);\n        case\
  \ BASE:\n            printf(\"You ran into the starbase at %d,%d\\n\", ix, iy);\n\
  \            killb(Ship.quadx, Ship.quady);\n            /* don't penalize the captain\
  \ if it wasn't his fault */[\\[2\\]](#Ch009_459-508_B9780443187346000088.xhtml#bb0015)\n\
  ```\n\n此 `ram()` 函数还调用了其他函数，包括 `killk()`、`killb()` 和 `lose()`。\n\n接下来是一个面向对象的 Ruby\
  \ 示例（参见 [`ruby-lang.org`](http://ruby-lang.org)），用于文本冒险游戏，创建了一个名为 `Verb` 的类，然后创建了多个\
  \ `Verb` 对象。正如我们将在下文的“面向对象设计与编程”部分学到的，对象从其父类继承特性。\n\n```ruby\nclass Verb\n    attr_accessor\
  \ :name, :description\n    def initialize(params)\n        @name = params[:name]\n\
  \        @description = params[:description]\n    end\nend\n\n#### Create verbs\n\
  north = Verb.new( :name => \"Move north\", :description => \"Player moves to the\
  \ north\" )\neast = Verb.new( :name => \"Move east\", :description => \"Player moves\
  \ to the east\" )\nwest = Verb.new( :name => \"Move west\", :description => \"Player\
  \ moves to the west\" )\nsouth = Verb.new( :name => \"Move south\", :description\
  \ => \"Player moves to the south\" )\nxyzzy = Verb.new( :name => \"Magic word\"\
  , :description => \"Player teleports to another location in the cave\" )[\\[3\\\
  ]](#Ch009_459-508_B9780443187346000088.xhtml#bb0020)\n```\n\n请注意，编码本身不可测试；这些示例仅用于说明目的。\n\
  \n#### 第四代编程语言\n\n**第四代编程语言**（4GL）是旨在通过自动创建计算机编程代码来提高程序员效率的计算机语言。它们被称为“第四代”，因为可以将其视为计算机语言进化的第四步：\n\
  \n*   第一代语言：机器码\n*   第二代语言：汇编语言\n*   第三代语言：COBOL、C、Basic\n*   第四代语言：ColdFusion、Progress\
  \ 4GL、Oracle Reports\n\n第四代语言倾向于专注于图形用户界面（GUI），通过拖放元素，然后根据结果生成代码。4GL 语言通常专注于数据库、报表和网站的创建。\n\
  \n#### 集成开发环境\n\n**集成开发环境**（IDE）通过为程序员提供一个可以执行以下功能的单一界面来提高生产力：\n\n*   编辑\n*   调试\n\
  *   语法检查和高亮\n*   编译\n*   解释\n*   版本控制\n\nMicrosoft 的 `Visual Studio Code` 是最流行的\
  \ IDE 之一，如图 9.1 所示。\n\n![图 9.1 Microsoft 的 Visual Studio [4]。](images/B9780443187346000088/f09-01-9780443187346.jpg)\n\
  \n图 9.1 Microsoft 的 Visual Studio [[4\\]](#Ch009_459-508_B9780443187346000088.xhtml#bb0025)。\n\
  \n##### 计算机辅助软件工程 (CASE)\n\n\n\n##### 计算机辅助软件工程 (CASE)\n\n*计算机辅助软件工程* (CASE) 使用程序来协助其他计算机程序的创建和维护。编程历来由（人类）程序员或团队执行：CASE\
  \ 将软件添加到编程“团队”中。\n\nCASE 软件有三种类型：\n\n1.  **工具**：仅支持软件生产过程中的特定任务。\n2.  **工作台**：通过在单个应用程序中集成多个工具，支持一个或几个软件过程活动。\n\
  3.  **环境**：通过工具和工作台的集合，支持软件生产过程的全部或至少一部分 [\\[5\\]](#Ch009_459-508_B9780443187346000088.xhtml#bb0030)。\n\
  \n第四代计算机语言、面向对象语言和 GUI 通常被用作 CASE 的组件。\n\n#### 自顶向下与自底向上编程\n\n程序员的任务是开发能够播放 MP3\
  \ 音乐文件的软件。程序员应如何开始构思将文件中的比特转化为我们可听到的音乐这一挑战？程序员是应该从“顶层”开始，思考音乐听起来会怎样，以及 MP3 播放器的外观和行为？还是应该从“底层”开始，思考接收比特流并将其转换为音频波形所需的低级设备驱动程序？\n\
  \n**自顶向下 (TD) 编程** 从最广泛和最高层级的需求（最终程序的概念）开始，逐步深入到低级技术实现细节。**自底向上编程** 则相反：它从低级技术实现细节开始，逐步构建到完整程序的概念。\n\
  \n这两种方法都存在风险：如果自顶向下的方法对低级设备的性能做出了错误假设，会怎样？另一方面，自底向上方法冒着浪费时间的风险，可能会为最终产品中可能不需要或未实现的功能编写大量代码。\n\
  \n过程式语言（如 C）历来采用自顶向下风格编程：从主程序开始，定义过程，然后逐步向下进行。面向对象编程通常使用自底向上设计：定义对象，并利用它们构建最终程序。\n\
  \n#### 公开发布软件的类型\n\n编程完成后，公开发布的软件可能以不同形式出现（例如附带或不附带源代码），并根据各种许可证发布。\n\n##### 开源与闭源软件\n\
  \n**闭源** 软件通常以可执行形式发布：源代码保密。示例包括 Oracle 和 Microsoft Windows 11。**开源** 软件公开发布源代码。示例包括\
  \ Ubuntu Linux 和 Apache Web 服务器。**专有软件** 是受知识产权保护（如专利或版权）的软件。“闭源软件”和“专有软件”有时被用作同义词，但这并不总是正确的：某些开源软件也是专有的。\n\
  \n##### 免费软件、共享软件和残废软件\n\n**免费软件** 是一个有争议的术语，不同群体对其定义不同。“免费”可能意味着免费使用（有时称为“免费如啤酒”），也可能意味着用户可以自由以任何方式使用软件，包括修改它（有时称为“自由如言论”）。这两种类型分别称为\
  \ **gratis**（免费）和 **libre**（自由）。这种混淆源于英语中 \"free\" 一词具有多重含义。既是 gratis 又是 libre 的软件有时称为\
  \ free [\\[2\\]](#Ch009_459-508_B9780443187346000088.xhtml#bb0015)（free squared，即完全免费）。\n\
  \n**免费软件** 是“免费如啤酒”(gratis) 的软件，可免费使用。**共享软件** 是功能完整的专有软件，最初可免费使用。如果用户继续使用共享软件的时间超过许可证规定的特定期限（如\
  \ 30 天），共享软件许可证通常要求付费。**残废软件** 是功能部分受限的专有软件，通常禁用关键功能。用户通常需要付费以解锁全部功能。\n\n##### 软件许可\n\
  \n软件可能被发布到公共领域，意味着它（明确地）没有版权或许可。这不对软件用户施加任何知识产权限制。某些免费软件属于此类。大多数软件（无论闭源还是开源）都受软件许可保护。\n\
  \n专有软件通常受版权保护（也可能受专利保护，详见 第 2 章，领域 1：安全与风险管理，了解更多关于版权和专利的信息）；软件用户通常必须同意软件许可协议的条款才能使用软件。这些协议通常称为\
  \ **EULA**（最终用户许可协议），可以是纸质或电子形式，后者通常在用户安装软件时点击“我同意”即表示同意。\n\n开源软件可能受多种许可协议保护，包括\
  \ **GNU 通用公共许可证 (GPL)**、**BSD**（Berkeley Software Distribution，伯克利软件发行版）和 **Apache**（以\
  \ Apache Software Foundation，Apache 软件基金会命名）许可证。\n\n最流行的开源许可证是 GPL，它专注于自由软件，允许用户自由使用、修改和共享软件。GPL\
  \ 的核心是“copyleft”（版权许可/反版权）一词，这是对 copyright（版权）的谐音：copyleft 旨在确保自由软件保持自由。《GPLv3 快速指南》（见\
  \ <http://www.gnu.org/licenses/quick-guide-gplv3.xhtml>) 指出：“没有人应该受到其所使用软件的限制。每个用户都应享有四项自由：\n\
  \n*   为任何目的使用软件的自由，\n*   修改软件以满足您需求的自由，\n*   与朋友和邻居分享软件的自由，以及\n*   分享您所做更改的自由” [\\\
  [6\\]](#Ch009_459-508_B9780443187346000088.xhtml#bb0035)。\n\nGPL copyleft 要求对 GPL\
  \ 软件的修改必须保持自由：您不能获取 GPL 代码，修改它，然后将修改后的代码变为专有。其他自由许可证（如 BSD）允许许可代码变为专有。\n\n## 应用程序开发方法\n\
  \n计算机编程可追溯到 1940 年代末电子计算机的诞生。程序员最初使用机器码或汇编语言；第一种高级编程语言是 Fortran，于 1954 年首次亮相。早期的计算机程序员通常独自工作，独立创建完整程序。在这种情况下，项目管理方法简单或非必要：程序员有时可以在（人脑）记忆中构想整个项目，然后直接编写代码。随着软件复杂性的增加，软件编程越来越成为一项团队工作。基于团队的项目需要项目管理：提供包含交付物和里程碑的项目框架、分配任务、团队沟通、进度评估和报告，以及（希望）最终交付产品。\n\
  \n最终，大型应用程序开发项目可能与与软件无关的项目非常相似，比如制造零件或建造桥梁。应用程序开发方法（如瀑布模型和螺旋模型）通常是非编程模型的近亲。这些方法可以被视为项目管理方法，并具有支持代码创建的附加功能。\n\
  \n### 瀑布模型\n\n\n\n\n### 瀑布模型\n\n`Waterfall Model`（瀑布模型）是一种线性的应用开发模型，使用严格的阶段；当一个阶段结束时，下一个阶段开始。瀑布模型早于软件设计，最早用于制造业。1969\
  \ 年，它首次被用于描述软件开发过程，当时大型软件项目已变得过于复杂，无法使用非正式方法进行设计。步骤按顺序发生，未修改的瀑布模型不允许开发人员返回之前的步骤。之所以称之为瀑布，是因为它模拟水流向下：无法回流向上。\n\
  \nWinston W. Royce 博士在《大型软件系统开发管理》（\"Managing the Development of Large Software\
  \ Systems\"）中首次结合软件开发描述了瀑布模型（参见 [`leadinganswers.typepad.com/leading_answers/files/original_waterfall_paper_winston_royce.pdf`](http://leadinganswers.typepad.com/leading_answers/files/original_waterfall_paper_winston_royce.pdf)）。Royce\
  \ 的未修改瀑布模型（无迭代，有时称为“阶段式”）如图 9.2 所示，包含以下步骤：系统需求、软件需求、分析、程序设计、编码、测试和运维。\n\n![图 9.2\
  \ 未修改的瀑布开发模型 [7]。](images/B9780443187346000088/f09-02-9780443187346.jpg)\n\n图 9.2\
  \ 未修改的瀑布开发模型 [[7]](#Ch009_459-508_B9780443187346000088.xhtml#bb0040)。\n\nRoyce 的论文未使用“瀑布”一词，但描述了该过程。未修改的瀑布模型不允许迭代：即返回之前的步骤。这给早期步骤带来了沉重的规划负担。此外，由于每个后续步骤要等到前一步骤结束才能开始，早期步骤的任何延迟都会级联传递到后续步骤。\n\
  \n具有讽刺意味的是，Royce 的论文是在批评该模型。关于图 9.2 所示模型，“上述实现充满风险，招致失败” [[7]](#Ch009_459-508_B9780443187346000088.xhtml#bb0040)。在现实世界中，需要迭代：通常不现实禁止返回之前的步骤。Royce\
  \ 提出了在测试阶段发现根本设计错误的问题：“测试阶段发生在开发周期末尾，这是首次将时序、存储、输入/输出传输等作为实际体验而非分析对象的事件。这些现象无法精确分析……然而，如果这些现象未能满足各种外部约束，则不可避免地需要进行大规模重新设计”\
  \ [[7]](#Ch009_459-508_B9780443187346000088.xhtml#bb0040)。许多后续的软件设计模型被称为迭代模型：它们明确设计为允许迭代，即返回之前的步骤。\n\
  \n> **考试警告**\n>\n> Royce 未修改瀑布模型的具体阶段名称不可考：请掌握整体流程。此外，Royce 遗漏了一个关键的最终步骤：销毁。任何导致包含敏感生产数据的操作系统投入运行的开发过程，在该系统退役、数据归档、以及这些物理系统上剩余数据被安全销毁之前，都不算真正完成。\n\
  \nRoyce 描述了一个修改后的瀑布模型，允许返回前一阶段进行验证或确认，理想情况下仅限于相邻步骤。Barry Boehm 的论文《软件开发与改进的螺旋模型》（\"\
  A Spiral Model of Software Development and Enhancement\"，见下文“螺旋模型”部分）展示了一个基于 Royce\
  \ 论文的修改后瀑布模型，如图 9.3 所示。\n\n![图 9.3 修改后的瀑布开发模型 [8]。](images/B9780443187346000088/f09-03-9780443187346.jpg)\n\
  \n图 9.3 修改后的瀑布开发模型 [[8]](#Ch009_459-508_B9780443187346000088.xhtml#bb0045)。\n\n\
  其他人提出了类似的修改或扩展瀑布模型。Sashimi 模型（鱼片模型）基于（并作为对……的反应）瀑布模型。\n\n> **注意**\n>\n> 未修改的瀑布模型不允许回退。修改后的瀑布模型至少允许回退一步。\n\
  \n### Sashimi 模型（鱼片模型）\n\n`Sashimi Model`（鱼片模型）具有高度重叠的步骤；可将其视为瀑布模型在现实世界中的继任者（有时称为\
  \ Sashimi 瀑布模型）。其名称源自日本美食“刺身”，其特点是鱼片层层重叠（这也是考试的一个提示）。该模型基于富士施乐使用的硬件设计模型：“商业学者和从业者在询问：‘日本制造商显著成功的关键因素是什么？’以及‘他们的竞争优势来源是什么？’Sashimi\
  \ 系统似乎给出了这些问题的答案。” [[9]](#Ch009_459-508_B9780443187346000088.xhtml#bb0050)\n\nPeter\
  \ DeGrace 在其著作《棘手的问题，正义的解决方案：现代目录》（*Wicked Problems, Righteous Solutions: A Catalogue\
  \ of Modern Software*）中结合软件开发描述了 Sashimi。Sashimi 的步骤与瀑布模型相似；区别在于显式的重叠，如图 9.4 所示。\n\
  \n![图 9.4 Sashimi 模型 [10]。](images/B9780443187346000088/f09-04-9780443187346.jpg)\n\
  \n图 9.4 Sashimi 模型 [[10]](#Ch009_459-508_B9780443187346000088.xhtml#bb0055)。\n\n\
  ### 敏捷软件开发\n\n`Agile Software Development`（敏捷软件开发）是作为对瀑布模型等僵化软件开发模型的反应而演变而来的。敏捷方法包括`Scrum`（Scrum）和`Extreme\
  \ Programming`（极限编程，XP）。敏捷宣言（参见 [`agilemanifesto.org/`](http://agilemanifesto.org/)）指出：\n\
  \n> “我们通过实践并帮助他人实践，发掘出更好的软件开发方法。通过这项工作，我们开始重视：\n>\n> *   **个体和互动** 高于 流程和工具\n> *\
  \   **可工作的软件** 高于 详尽的文档\n> *   **客户协作** 高于 合同谈判\n> *   **响应变化** 高于 遵循计划” [[11]](#Ch009_459-508_B9780443187346000088.xhtml#bb0060)\n\
  \n敏捷体现了许多现代开发概念，包括更大的灵活性、以较小里程碑实现快速周转、团队内部的强沟通以及更多的客户参与。\n\n#### Scrum\n\n`Scrum`开发模型（以橄榄球运动中的“争球”命名）是一种敏捷模型，最早由\
  \ Hirotaka Takeuchi 和 Ikujiro Nonaka 在《新新产品开发游戏》（\"The New New Product Development\
  \ Game\"）中结合产品开发进行描述；他们指出：“停止接力赛，改打橄榄球” [[12]](#Ch009_459-508_B9780443187346000088.xhtml#bb0065)。“接力赛”指瀑布模型，即团队在步骤完成后将工作移交给其他团队。他们建议：“相反，整体或‘橄榄球’式方法——团队作为一个整体尝试全程推进，来回传球——可能更好地满足当今的竞争要求”\
  \ [[12]](#Ch009_459-508_B9780443187346000088.xhtml#bb0065)。\n\nPeter DeGrace（因 Sashimi\
  \ 而知名）结合软件开发描述了（并命名了）Scrum。Scrum 包含小型开发团队，称为`Scrum Team`（Scrum 团队）。`Scrum Master`（Scrum\
  \ 主管）是组织中的资深成员，像教练一样为团队提供支持。最后，`Product Owner`（产品负责人）是业务部门的代言人。\n\n#### 极限编程（XP）\n\
  \n\n\n\n\n#### 极限编程（XP）\n\n极限编程（XP）是一种敏捷开发方法，采用成对的程序员基于详细规格说明进行工作。客户参与度极高。“极限编程在五个关键方面改进了软件项目：沟通、简洁、反馈、尊重和勇气。极限程序员与客户及同行程序员保持持续沟通。他们保持设计简洁清晰。从第一天起就通过测试软件来获取反馈。他们尽早将系统交付给客户，并实施建议的变更”[[13]](#Ch009_459-508_B9780443187346000088.xhtml#bb0070)。XP\
  \ 核心实践包括：\n\n*   **计划**：指定所需功能，称为用户故事。它们用于确定迭代（时间线）并驱动详细规格说明。\n*   **结对编程**：程序员以团队形式工作。\n\
  *   **四十小时工作周**：预测的迭代应足够准确，以预测完成项目所需的工时。如果程序员必须加班，则说明迭代规划有缺陷。\n*   **全程客户参与**：客户随时可用，并密切监控项目。\n\
  *   **详细测试程序**：称为单元测试[[13]](#Ch009_459-508_B9780443187346000088.xhtml#bb0070)。\n\
  \n> **注意**\n>\n> XP 开发模型不应与 Microsoft Windows XP 混淆：极限编程对首字母缩写词“XP”的使用早于微软。\n\n\
  ### 螺旋模型\n\n螺旋模型是一种旨在控制风险的软件开发模型。Barry W. Boehm 创建了该模型，并在其 1986 年的论文《软件开发与改进的螺旋模型》中进行了描述（参见\
  \ [`portal.acm.org/citation.cfm?id=12948`](http://portal.acm.org/citation.cfm?id=12948)）。Boehm\
  \ 指出：“螺旋模型的主要显著特征是它创造了一种风险驱动的软件过程方法，而非主要的文档驱动或代码驱动过程。它融合了其他模型的许多优点，并解决了它们的许多困难”[[8]](#Ch009_459-508_B9780443187346000088.xhtml#bb0045)。\n\
  \n螺旋模型重复项目的步骤，从适度的目标开始，以不断扩大的螺旋向外扩展（称为轮次）。螺旋的每一轮构成一个项目，每一轮可以遵循传统的软件开发方法，如修改的瀑布模型。每一轮都会进行风险分析。项目或过程中的根本缺陷更有可能在早期阶段被发现，从而导致更简单的修复。这降低了项目的整体风险：大型风险应被识别并缓解。\n\
  \nBoehm 使用螺旋模型开发了 TRW 软件生产力系统（TRW-SPS），这是一个复杂的软件项目，产生了 1,300,000 条计算机指令。“第零轮”是一项可行性研究，一个旨在确定\
  \ TRW-SPS 项目是否对组织具有重大价值、从而值得承担风险的小型项目。可行性研究表明该项目值得进行（低风险），项目随之向外螺旋扩展。后续轮次的交付物包括：\n\
  \n1.  操作概念（COOP）\n2.  软件需求\n3.  软件产品设计\n4.  详细设计[[8]](#Ch009_459-508_B9780443187346000088.xhtml#bb0045)\n\
  \n每一轮包含多个重复步骤，包括原型开发，最重要的是风险分析。Boehm 的螺旋模型如图 9.5 所示。\n\n![图 9.5 螺旋模型。来源：https://upload.wikimedia.org/wikipedia/commons/e/ec/Spiral_model_%28Boehm%2C_1988%29.svg。图片遵循\
  \ Creative Commons 许可。](img/f09-05-9780443187346.jpg)\n\n图 9.5 螺旋模型。来源：[`upload.wikimedia.org/wikipedia/commons/e/ec/Spiral_model_%28Boehm%2C_1988%29.svg`](https://upload.wikimedia.org/wikipedia/commons/e/ec/Spiral_model_%28Boehm%2C_1988%29.svg)。图片遵循\
  \ Creative Commons 许可。\n\n螺旋以项目的成功实施告终。任何潜在的高风险，如对组织缺乏价值或实施失败，都在螺旋早期被识别并缓解，此时成本更低、更容易缓解。\n\
  \n### 快速应用开发（RAD）\n\n**快速应用开发**（RAD）通过使用原型、“虚拟”GUI、后端数据库等快速开发软件。RAD 的目标是快速满足系统的业务需求；技术顾虑居于次要地位。客户深度参与整个过程。\n\
  \n根据医疗保险和医疗补助服务中心（参见 [`www.cms.gov/Research-Statistics-Data-and-Systems/CMS-Information-Technology/XLC/Downloads/SelectingDevelopmentApproach.pdf`](http://www.cms.gov/Research-Statistics-Data-and-Systems/CMS-Information-Technology/XLC/Downloads/SelectingDevelopmentApproach.pdf)），RAD“旨在快速生成高质量系统，主要通过迭代原型（在开发的任何阶段）、积极的用户参与和计算机辅助开发工具。这些工具可能包括图形用户界面（GUI）构建器、计算机辅助软件工程（CASE）工具、数据库管理系统（DBMS）、第四代编程语言、代码生成器和面向对象技术”[[14]](#Ch009_459-508_B9780443187346000088.xhtml#bb0075)。\n\
  \n### 原型法\n\n原型法是一种迭代方法，将项目分解为较小的任务，创建系统设计特性的多个模型（原型）。这通过允许客户在最终产品完成前很久就看到逼真的结果来降低风险。与其他现代开发方法一样，客户参与度很高：客户检查原型以确保项目按计划进行并达到其目标。\n\
  \n“原型”一词可能有点误导：后期阶段的原型可能被用作实际的最终产品。原型可以被视为“工作模型”。原型法不是一个成熟的软件开发方法论：它被螺旋模型或 RAD 等其他迭代方法所使用。\n\
  \n### DevOps\n\n传统软件开发是在开发人员、质量保证团队和生产团队之间严格分离职责的情况下进行的。开发人员拥有镜像生产模型的硬件和测试数据。他们将代码移交给质量保证团队，后者也拥有镜像生产模型的硬件以及测试数据。质量保证团队随后将测试过的代码移交给生产团队，后者拥有生产硬件和真实数据。\n\
  \n在旧的（不那么敏捷的）模型中：开发人员与生产环境没有直接接触，实际上通过职责分离被严格隔离在生产环境之外。\n\nDevOps 是一种更敏捷的开发和支持模型，呼应了我们在本章前面了解到的敏捷编程方法，包括\
  \ Sashimi 和 Scrum。DevOps 是“运维和开发工程师共同参与整个服务生命周期的实践，从设计、开发过程到生产支持”[[15]](#Ch009_459-508_B9780443187346000088.xhtml#bb0080)。\n\
  \n### DevSecOps\n\nDevSecOps 是一种将信息安全集成到开发过程中的敏捷方法。安全贯穿每一步。DevSecOps 宣言概述了目标：\n\n\
  *   **主动介入** 胜过 **总是说“不”**\n*   **数据与安全科学** 胜过 **恐惧、不确定性和怀疑**\n*   **开放贡献与协作** 胜过\
  \ **仅限安全需求**\n*   **带有 API 的可用安全服务** 胜过 **强制安全控制与文书工作**\n*   **业务驱动的安全评分** 胜过 **橡皮图章式安全**\n\
  \n\n\n\n\n#### 核心安全原则\n\n*   **红蓝对抗渗透测试** 胜过 依赖扫描与理论漏洞\n*   **7 × 24 主动安全监控** 胜过\
  \ 在被告知事件后才被动响应\n*   **共享威胁情报** 胜过 独自掌握信息\n*   **合规运营** 胜过 靠记事板与核对清单 [¹⁶]\n\n#####\
  \ 持续集成与持续交付\n\n持续集成与持续交付（CI/CD）是一种敏捷方法论，专注于通过流水线快速部署代码更新。它是核心 DevSecOps 实践之一。NIST\
  \ 对 CI/CD 的描述如下：\n\n> DevSecOps 在流程工作流中引入的一个独特概念是“流水线”的概念。有了流水线，就无需为启动/执行流程的每个阶段单独编写作业。取而代之的是，只有一个作业从初始阶段开始，自动触发与其他阶段（无论是顺序还是并行）相关的活动/任务，并创建一个无错误的智能工作流。\n\
  >\n> DevSecOps 中的流水线根据其完成的总体任务和所包含的两个单独阶段，被称为 CI/CD 流水线。CD 可以表示持续交付或持续部署阶段。根据后一阶段的不同，CI/CD\
  \ 可能涉及以下任务：\n>\n> *   **构建、测试、安全防护和交付**——经过测试的修改代码被交付到预发布区域。\n> *   **构建、测试、安全防护、交付和部署**——预发布区域中的代码被自动部署\
  \ [¹⁷]。\n\n图 9.6 来自 NIST，展示了 CI/CD 流水线。\n\n![图 9.6 CI/CD 流水线 [17]。](images/B9780443187346000088/f09-06-9780443187346.jpg)\n\
  \n图 9.6 CI/CD 流水线 [¹⁷]。\n\n#### 安全编排、自动化与响应\n\n安全编排、自动化与响应（SOAR）是一种敏捷方法论，用于集中管理安全运营，包括事件处理与响应、漏洞扫描、安全信息与事件管理（SIEM）以及其他运营活动。其目标是将过去手动执行的任务自动化。它利用编排通过应用程序编程接口（API）来协调\
  \ SIEM、IDS/IPS、防火墙和威胁情报源的管理。这种安全设备的编排被称为 `软件定义安全`（SDSec），这类似于软件定义网络（详见第 5 章，领域 4：通信与网络安全）。\n\
  \n自动化包括诸如在自动漏洞扫描确定系统存在漏洞后为其打补丁等步骤。它利用人工智能识别安全事件，并执行事件响应剧本以采取具体行动，例如从用户收件箱中移除恶意邮件或隔离受感染的系统。\n\
  \n#### 软件配置管理\n\n软件配置管理（SCM）是一种敏捷方法，可自动化系统管理任务，包括服务器部署和配置管理。SCM 实现了 `基础设施即代码`，允许通过\
  \ PowerShell、Python 等脚本语言构建和配置系统。Ansible、Chef、Puppet 和 Salt Stack 是流行的 SCM 工具。\n\
  \n#### SDLC\n\n**系统开发生命周期**（**SDLC**，也称为**软件开发生命周期**或简称**系统生命周期**）是一种系统开发模型。SDLC\
  \ 在 IT 行业广泛使用，但在考试语境下，SDLC 侧重于安全。可将“我们的” SDLC 视为“*安全*系统开发生命周期”：安全是隐含的。\n\n在考试中，SDLC\
  \ 关注每个阶段的安全性。该模型比许多应用开发模型更宽泛，关注整个系统，从选择/开发、运营需求到安全废弃。SDLC 有许多变体，但大多数遵循（或基于）美国国家标准与技术研究院（NIST）的\
  \ SDLC 流程。\n\nNIST 特别出版物 800-14 指出：“安全与 IT 系统的其他方面一样，如果在整个 IT 系统生命周期中进行规划，则管理得最好。IT\
  \ 系统生命周期有许多模型，但大多数包含五个基本阶段：启动、开发/获取、实施、运行和废弃” [¹⁸]。通常会增加额外步骤，其中最关键的是安全计划，它是任何 SDLC\
  \ 的第一步。以下概述摘自 NIST SP 800-14：\n\n*   **制定安全计划**：确保在 IT 系统生命周期的所有阶段都考虑到安全性，并且在每个阶段都完成安全活动。\n\
  *   **启动**：表达对系统的需求并记录系统的目的。\n    *   **实施敏感性评估**：审视系统的安全敏感性及待处理信息。\n*   **开发/获取**：对系统进行设计、采购、编程或开发。\n\
  \    *   **确定安全需求**：确定技术特性（如访问控制）、保证措施（如对系统开发人员的背景调查）或运营实践（如安全意识和培训）。\n    *   **将安全需求纳入规格说明**：确保前面收集的信息已纳入项目计划。\n\
  \    *   **获取系统及相关安全活动**：可能包括开发系统的安全功能、监控开发过程本身的安全问题、响应变更和监控威胁。\n*   **实施**：对系统进行测试和安装。\n\
  \    *   **安装/启用控制**：系统通常带有被禁用的安全功能。这些需要被启用和配置。\n    *   **安全测试**：用于认证系统；可能包括测试安全管理、物理设施、人员、程序、商业或内部服务（如网络服务）的使用以及应急计划。\n\
  \    *   **授权**：授权（管理）官员对系统运行的正式授权，并明确接受风险。\n*   **运行/维护**：系统通过硬件和软件的添加以及其他事件进行修改。\n\
  \    *   **安全运营与管理**：示例包括备份、培训、管理加密密钥、用户管理和打补丁。\n    *   **运营保障**：检查系统是否按照其当前的安全需求进行运行。\n\
  \    *   **审计与监控**：系统审计是一次性或定期的事件，用于评估安全。监控是指持续进行的活动，检查系统或用户。\n*   **废弃**：系统的安全退役。\n\
  \    *   **信息**：信息可能被移至另一系统、归档、丢弃或销毁。\n    *   **介质清理**：清除介质有三种通用方法：覆写、消磁（仅适用于磁性介质）和销毁\
  \ [¹⁸]。\n\n请注意，“安全”或“保障”一词出现在 NIST SDLC 的每一个步骤中，从项目启动到废弃：这是 SDLC 的核心。\n\n> **注意**\n\
  >\n> 在考试中，“安全” SDLC 的每一步都包含安全。任何遗漏安全的步骤都是“错误答案”。此外，任何遗漏安全废弃作为最终生命周期步骤的 SDLC 计划也是“错误答案”。\n\
  \n[¹⁶]: Ch009_459-508_B9780443187346000088.xhtml#bb0085\n[¹⁷]: Ch009_459-508_B9780443187346000088.xhtml#bb0090\n\
  [¹⁸]: Ch009_459-508_B9780443187346000088.xhtml#bb0095\n\n\n\n\n\n许多组织扩展了 SDLC 流程，始于\
  \ NIST SP 800-14 中描述的框架，并增加了更多步骤。美国司法部 (DOJ) 描述了一个 10 步 SDLC（参见 [`www.justice.gov/archive/jmd/irm/lifecycle/ch1.htm`](https://www.justice.gov/archive/jmd/irm/lifecycle/ch1.htm)）。图\
  \ 9.7 中所示的 DOJ SDLC 图形文本总结如下：\n\n![图 9.7 DOJ SDLC [19]。](images/B9780443187346000088/f09-07-9780443187346.jpg)\n\
  \n图 9.7 DOJ SDLC [[19]](#Ch009_459-508_B9780443187346000088.xhtml#bb0100)。\n\n####\
  \ 考试警告\n\n不要求背诵每个 SDLC 的具体步骤，但务必理解 SDLC 流程的逻辑（安全）流向。\n\n*   **启动：** 当发起人识别出需求或机会时开始。创建概念建议书。\n\
  *   **系统概念开发：** 定义概念的范围或边界。包括系统边界文档、成本效益分析、风险管理计划和可行性研究。\n*   **规划：** 制定项目管理计划和其他规划文档。为获取实现解决方案所需的资源提供基础。\n\
  *   **需求分析：** 分析用户需求并开发用户需求。创建详细的功能需求文档。\n*   **设计：** 将详细需求转化为完整、详细的系统设计文档。侧重于如何交付所需功能。\n\
  *   **开发：** 将设计转化为完整的信息系统。包括获取和安装系统环境；创建和测试数据库/准备测试用例步骤；准备测试文件；编码、编译、优化程序；执行测试就绪评审和采购活动。\n\
  *   **集成与测试：** 证明开发的系统符合功能需求文档中规定的需求。由质量保证人员和用户执行。生成测试分析报告。\n*   **实施：** 包括实施准备、将系统部署到生产环境，以及解决在集成与测试阶段发现的问题。\n\
  *   **运行与维护：** 描述在生产环境中运行和维护信息系统的任务。包括实施后评审和过程评审。\n*   **处置：** 描述系统生命周期结束的活动。重点在于数据的妥善保存\
  \ [[19]](#Ch009_459-508_B9780443187346000088.xhtml#bb0100)。\n\n#### 集成产品团队\n\n集成产品团队\
  \ (IPT) 是一个以客户为中心的团队，关注项目的整个生命周期：\n\n> 集成产品团队 (IPT) 是一个由多学科人员组成的团队，他们共同负责交付定义明确的产品或流程。IPT\
  \ 由负责规划、执行和实施被采购系统生命周期决策的人员组成。它包括来自与产品相关的所有职能领域的授权代表（利益相关者）——所有在项目成功中拥有利益的人员，如设计、制造、测试与评估\
  \ (T&E) 和后勤人员，尤其是客户 [[20]](#Ch009_459-508_B9780443187346000088.xhtml#bb0105)。\n\n\
  与传统的层级团队相比，集成产品团队是一种更敏捷的方法：“……摆脱层级决策模式，转向由集成产品团队跨组织结构进行决策的过程。这意味着我们正在打破体制障碍。这也意味着我们的高级采购人员处于接收模式——而不仅仅是传输模式。目标是对来自一线的想法保持开放态度，以获得认同和持久的变革”\
  \ [[21]](#Ch009_459-508_B9780443187346000088.xhtml#bb0110)。\n\n#### 软件托管\n\n软件托管是指让第三方存储计算机软件归档副本的过程。这通常作为与专有软件供应商签订合同的一部分进行协商。供应商可能希望保守软件源代码秘密，但客户可能担心供应商倒闭（可能导致软件无人维护）。没有可用源代码的孤儿软件将无法获得未来的改进或补丁。\n\
  \n软件托管将源代码置于托管状态，由中立的第三方控制。合同严格规定了将源代码发布给客户的条件，通常是由于软件供应商的业务失败。\n\n#### 代码仓库安全\n\
  \n私有/内部代码仓库的安全性主要归属于前文讨论的其他企业安全控制：纵深防御、安全认证、防火墙、版本控制等。\n\n公共第三方代码仓库（如 GitHub ([`www.github.com`](https://www.github.com))）引发了额外的安全担忧。除了代码托管提供商本身的安全性之外，最重要的控制措施之一是利用双因素认证的安全认证。开发人员常犯的一个错误是意外将私有代码发布为公开。这包括意外发布包含密码或私钥的代码。许多犯罪分子拥有针对此类内容的自动化搜索工具。\n\
  \n##### 实例学习\n\n###### 泄露密钥导致 6500 美元亚马逊账单\n\n2015 年，Carlo van Wyk 通过 Microsoft\
  \ Visual Studio 2015 将代码发布到其私有 GitHub 账户，“Visual Studio 中的一个简单 bug 导致本应发布到安全私有源代码仓库的源代码被发布到了公共仓库。随后发生的一系列事件让我背上了\
  \ 6500 美元的账单” [[22]](#Ch009_459-508_B9780443187346000088.xhtml#bb0115)。\n\n该 bug\
  \ 存在于 Visual Studio 2015 中包含的 GitHub 扩展中，标记为私有的代码被标记为公开。该代码包含一个私有的亚马逊访问密钥：“令我沮丧的是，我发现该仓库被创建为公共仓库。不仅我的源代码泄露了，包含在配置文件中的\
  \ Alexa 网络信息服务的亚马逊访问密钥也暴露在外” [[22]](#Ch009_459-508_B9780443187346000088.xhtml#bb0115)。\n\
  \n机器人很快蜂拥而至：“一旦暴露在外，就为时已晚。机器人扫描 GitHub 仓库，它们只需 2 或 3 分钟就能捕捉到此类信息。” 犯罪分子随后利用 Carlo\
  \ 的账户生成了许多亚马逊云实例，并用它们挖掘加密货币比特币。\n\nCarlo 总结了关键问题：\n\n“为何我的数据会如此迅速地被泄露？\n\n*   比特币矿工持续扫描\
  \ GitHub 源代码以寻找亚马逊访问密钥。\n*   他们随后利用这些密钥生成大量（亚马逊云）EC2 实例来挖掘比特币。\n*   他们大赚特赚，而被利用者却背负巨额账单。\n\
  \n可以采取哪些措施来预防和缓解此类情况？\n\n*   在实际使用新版本控制 GUI 之前务必先进行测试。可能存在会暴露你数据的 bug。\n*   加密配置文件中的敏感信息。\n\
  *   将访问密钥移至单独的配置文件，并将其从 Git 部署中排除。\n*   亚马逊可默认实施每日最大预算限制。\n*   理想情况下，亚马逊不应允许无限额支出”\
  \ [[22]](#Ch009_459-508_B9780443187346000088.xhtml#bb0115)。\n\n#### 应用程序编程接口 (API)\
  \ 安全性\n\n应用程序编程接口 (API) 允许应用程序与另一个应用程序、操作系统、数据库、网络等进行通信。例如，Google Maps API 允许应用程序集成第三方内容，例如叠加在\
  \ Google 地图上的餐厅信息。\n\n\n\n\n##### API 利用的真实案例\n\nAPI 利用的真实案例包括 Facebook API 遭到黑客攻击，安全研究员\
  \ Reza Moaiandin 利用该漏洞收集了数千个 Facebook 个人资料：\n\n> “发现该漏洞的软件工程师 Reza Moaiandin 利用了一个鲜为人知的隐私设置，该设置允许任何人通过在社交网络中输入电话号码来查找\
  \ Facebook 用户。\n>\n> 默认情况下，这个‘谁可以找到我？’的设置被设为‘所有人/公开’——意味着任何人都可以通过手机号码找到其他用户。即使该用户选择不在其公开个人资料中显示手机号码，这仍然是默认设置。\n\
  >\n> Moaiandin 使用一个简单的算法，每秒生成数万个手机号码，然后将这些号码发送给 Facebook 的应用程序编程接口（API），这是一个允许开发者构建与社交网络关联的应用程序的工具。几分钟内，Facebook\
  \ 就向他返回了大量用户的个人资料。\n>\n> Moaiandin 接收到的所有信息都是公开可用的，但能够大规模地将个人资料与手机号码关联起来，使得该系统面临被滥用的风险”\
  \ [\\[23\\]](#Ch009_459-508_B9780443187346000088.xhtml#bb0120)。\n\n##### OWASP 企业安全\
  \ API 工具包\n\nOWASP 企业安全 API 工具包项目包含以下关键 API 控制：\n\n*   认证\n*   访问控制\n*   输入验证\n\
  *   输出编码/转义\n*   密码学\n*   错误处理和日志记录\n*   通信安全\n*   HTTP 安全\n*   安全配置 [\\[24\\]](#Ch009_459-508_B9780443187346000088.xhtml#bb0125)\n\
  \n## 软件变更与配置管理\n\n软件变更与配置管理为软件在开发、维护和最终退役过程中管理变更提供了一个框架。一些组织将其视为一门学科；考试将配置管理和变更管理视为独立的（但相关的）学科。\n\
  \n就软件开发安全领域而言，配置管理跟踪特定软件的变更。例如：跟踪对 `Content Management System (CMS)`（内容管理系统）的变更，包括软件内的特定设置。变更管理范围更广，跟踪整个软件开发项目的变更。在这两种情况下，配置管理和变更管理旨在确保变更有序进行，不损害（并理想地改善）信息安全。我们在第\
  \ 8 章，领域 7：安全运营中讨论了变更管理。\n\nNIST 特别出版物 800-128：面向信息系统的安全聚焦配置管理指南（可在 `https://csrc.nist.gov/publications/detail/sp/800-128/final`\
  \ 获取）描述了以下配置管理术语：\n\n> “配置管理计划（CM 计划）是对管理产品和系统配置时适用的角色、职责、政策和程序的全面描述。CM 计划的基本组成部分包括：\n\
  >\n> *   配置控制委员会（CCB）——建立并授权一组合格人员负责在产品和系统的开发和运行生命周期中控制和批准变更的过程；也可称为变更控制委员会；\n>\
  \ *   配置项标识——选择和命名需要纳入配置管理的配置项的方法；\n> *   配置变更控制——管理配置项基线配置更新的过程；以及\n> *   配置监控——评估或测试对既定基线配置的合规程度以及报告纳入配置管理的项目配置状态的机制”\
  \ [\\[25\\]](#Ch009_459-508_B9780443187346000088.xhtml#bb0130)。\n\n## 数据库\n\n*数据库*是相关数据的结构化集合。数据库允许查询（搜索）、插入（更新）、删除和许多其他功能。数据库由*数据库管理系统*（DBMS）管理，它控制对数据库的所有访问并强制执行数据库安全。数据库由*数据库管理员*（DBA）管理。数据库可以使用数据库*查询语言*进行搜索，例如*结构化查询语言*（SQL）。典型的数据库安全问题包括存储数据的机密性和完整性。当复制的数据库被更新时，完整性是首要关注点。\n\
  \n其他数据库机密性问题包括*推理*和*聚合*攻击，详见第 4 章，领域 3：安全架构与工程。聚合是一种数学攻击，攻击者聚合较低密级的细节以确定较高密级的信息。推理是一种类似的攻击，但攻击者必须逻辑推导缺失的细节：与聚合不同，推理需要解开一个谜题。\n\
  \n### 数据库类型\n\n正式的数据库类型包括*关系型*（二维）、*层次型*和*面向对象型*。最简单的数据库形式是*平面文件*：一个包含多行数据的文本文件，每行采用标准格式。主机文件（在\
  \ UNIX 系统上位于 `/etc/hosts`，在许多版本的 Microsoft Windows 上位于 `c:\\windows\\system32\\\
  drivers\\etc\\hosts`）是平面文件的一个例子：每个条目（行）至少包含一个 IP 地址和一个主机名。\n\n#### 关系型数据库\n\n最常见的现代数据库是*关系型数据库*，它包含相关（因此称为“关系型”）数据的二维*表*。表也称为关系。表有行和列：行是数据库记录，称为*元组*；列称为*属性*。数据库中单个单元格（行和列的交叉点）称为值。关系型数据库要求表中每个元组都有一个称为*主键*的唯一值。表\
  \ 9.1 显示了一个关系型数据库员工表，按主键（SSN，即社会安全号码）排序。\n\n表 9.1\n\n关系型数据库员工表。\n\n| SSN | 姓名 |\
  \ 职称 |\n| --- | --- | --- |\n| 133-73-1337 | J.F. Sebastian | 设计师 |\n| 343-53-4334\
  \ | Eldon Tyrell | 博士 |\n| 425-22-8422 | Gaff | 侦探 |\n| 737-54-2268 | Rick Deckard\
  \ | 侦探 |\n| 990-69-4771 | Hannibal Chew | 工程师 |\n\n表 9.1 的属性包括 SSN、姓名和职称。元组包括每一行：133-73-1337、343-53-4334\
  \ 等。“Gaff”是一个值（单元格）的例子。*候选键*是表中具有唯一值的任何属性（列）：表 9.1 中的候选键包括 SSN 和姓名；选择 SSN 作为主键是因为它真正唯一（两名员工可能同名，但不会有相同的\
  \ SSN）。主键可以在关系型数据库中连接两个表。\n\n##### 外键\n\n*外键*是相关数据库表中的一个键，它与父数据库表中的主键匹配。请注意，外键是本地表的主键：当引用父表时，它被称为外键。表\
  \ 9.2 是人力资源数据库表，列出了员工的休假时间（天）和病假时间（天）；它有一个 SSN 外键。人力资源数据库表可以通过将人力资源表的外键连接到员工表的主键，与父（员工）数据库表连接。\n\
  \n表 9.2\n\n人力资源数据库表。\n\n| SSN | 休假时间 | 病假时间 |\n| --- | --- | --- |\n| 133-73-1337\
  \ | 15 天 | 20 天 |\n\n\n\n\n| SSN | Vacation Time | Sick Time |\n| --- | --- | ---\
  \ |\n| 343-53-4334 | 60 days | 90 days |\n| 425-22-8422 | 10 days | 15 days |\n\
  | 737-54-2268 | 3 days | 1 day |\n| 990-69-4771 | 15 days | 5 days |\n\n#### 引用完整性、语义完整性和实体完整性\n\
  \n数据库必须确保表中数据的完整性：这称为数据完整性，将在下文的“数据库完整性”一节中讨论。除了数据本身的正确性之外，还有三个具体的完整性问题必须解决：引用完整性、语义完整性和实体完整性。这些与\
  \ DBMS（数据库管理系统）的逻辑操作紧密相关。\n\n*引用完整性* 是指辅助表中的每个外键都与父表中的一个主键匹配：如果不满足此条件，则引用完整性已被破坏。*语义完整性*\
  \ 是指每个属性（列）的值与属性数据类型一致。*实体完整性* 是指每个元组都有一个非空的唯一主键。前面看到的 HR 数据库表（见表 9.2）具有引用完整性、语义完整性和实体完整性。另一方面，表\
  \ 9.3 存在多个问题：一个元组违反了引用完整性，一个元组违反了语义完整性，最后两个元组违反了实体完整性。\n\n表 9.3\n\n缺乏完整性的数据库表。\n\
  \n| SSN | Vacation Time | Sick Time |\n| --- | --- | --- |\n| 467-51-9732 | 7 days\
  \ | 14 days |\n| 737-54-2268 | 3 days | Nexus 6 |\n| 133-73-1337 | 16 days | 22\
  \ days |\n| 133-73-1337 | 15 days | 20 days |\n\n带有外键 `467-51-9732` 的元组在员工数据库表中没有匹配的条目。这破坏了引用完整性：无法将此条目链接到姓名或职位。单元格“Nexus\
  \ 6”违反了语义完整性：病假时间属性要求天数值，而“Nexus 6”不是有效的病假天数。最后，最后两个元组具有相同的主键（对此表为主键；对父员工表为外键）；这破坏了实体完整性。\n\
  \n#### 数据库规范化\n\n数据库*规范化*旨在使数据库表中的数据在逻辑上简洁、有序且一致。规范化可移除冗余数据，并提高数据库的完整性和可用性。规范化有三条规则，称为范式（更多信息请见\
  \ [`www.informit.com/articles/article.aspx?p=30646`](http://www.informit.com/articles/article.aspx?p=30646)）：\n\
  \n*   **第一范式 (1NF)：** 将数据划分到多个表中。\n*   **第二范式 (2NF)：** 将部分依赖于主键的数据移至另一个表中。HR 数据库（表\
  \ 9.2）即为 2NF 的示例。\n*   **第三范式 (3NF)：** 移除不依赖于主键的数据 [[26]](#Ch009_459-508_B9780443187346000088.xhtml#bb0135)。\n\
  \n#### 数据库视图\n\n数据库表可被查询；查询的结果称为*数据库视图*。视图可用于提供*受限用户界面*：例如，非管理层员工只能通过数据库视图查看其个人记录。表\
  \ 9.4 显示了通过字符串“Detective”查询员工表“Title”属性所得的数据库视图。虽然 HR 部门员工可能有权查看整个员工表，但此视图可授权给侦探队长，例如。\n\
  \n表 9.4\n\n员工表数据库视图“Detective”。\n\n| SSN | Name | Title |\n| --- | --- | --- |\n\
  | 425-22-8422 | Gaff | Detective |\n| 737-54-2268 | Rick Deckard | Detective |\n\
  \n#### 数据字典\n\n*数据字典*包含数据库表的描述。这称为*元数据*：关于数据的数据。数据字典包含数据库视图信息、授权数据库管理员的信息、包括姓名和权限在内的用户账户、审计信息等。数据字典的关键组成部分是*数据库模式*：它描述数据库表的属性和值。表\
  \ 9.5 显示了一个非常简单的数据字典，描述了本章前面见到的两个表：employees 和 HR。\n\n表 9.5\n\n简单的数据库模式。\n\n| Table\
  \ | Attribute | Type | Format |\n| --- | --- | --- | --- |\n| Employee | SSN | Digits\
  \ | `###-##-####` |\n| Employee | Name | String | `<30 characters>` |\n| Employee\
  \ | Title | String | `<30 characters>` |\n| HR | SSN | Digits | `###-##-####` |\n\
  | HR | Sick Time | Digits | `### days` |\n| HR | Vacation Time | Digits | `### days`\
  \ |\n\n#### 数据库查询语言\n\n数据库查询语言允许创建数据库表、对这些表进行读/写访问以及许多其他功能。数据库查询语言至少有两个命令子集：*数据定义语言*\
  \ (DDL) 和*数据操纵语言* (DML)。DDL 用于创建、修改和删除表。DML 用于查询和更新存储在表中的数据。\n\n最流行的关系型数据库查询语言是\
  \ SQL（结构化查询语言），由 IBM 于 1974 年创建。存在多种类型的 SQL，包括 MySQL、PostgreSQL、PL/SQL（过程语言/SQL，Oracle\
  \ 使用）、T-SQL 和 ANSI SQL（Microsoft SQL 使用）等。\n\n常用 SQL 命令包括：\n\n*   **CREATE：** 创建表\n\
  *   **SELECT：** 选择记录\n*   **DELETE：** 删除记录（或整个表）\n*   **INSERT：** 插入记录\n*   **UPDATE：**\
  \ 更改记录\n\n表是通过 `CREATE` 命令创建的，该命令使用数据定义语言来描述正在创建的表的格式。数据操纵语言命令的一个示例是 `SELECT`，用于从表中搜索和选择数据。以下\
  \ `SELECT` 命令可用于创建表 9.4 中所示的数据库视图：\n\n```\nSELECT * FROM Employees WHERE Title =\
  \ \"Detective\"\n```\n\n这意味着：显示 Title 为“Detective”的任何（“*”）记录。\n\n#### 层次数据库\n\n\
  层次数据库形成一棵树：全局域名服务 (DNS) 服务器构成一棵全局树。根名称服务器位于树基部的“根区”；单个 DNS 条目构成叶子节点。`www.syngress.com`\
  \ 指向 `syngress.com` DNS 数据库，它是顶级域 (TLD) dot com (.com) 的一部分，而后者又是全局 DNS（根区）的一部分。从根节点出发，你可以沿另一分支向下，到达顶级域\
  \ dot gov (.gov)，再到 `nist.gov`（美国国家标准与技术研究院）域，最后到 `www.nist.gov`。\n\n层次数据库的一种特殊形式是*网络模型*（指人员网络，而非数据网络）：这允许层次数据库的分支拥有两个父节点（两条回溯到根节点的连接）。设想一个组织的组织架构图存储在一个形成树状的数据库中，CEO\
  \ 位于层次结构的根部。在该公司中，物理安保人员同时向设施部门（针对设施问题）和 IT 部门（针对数据中心物理安保）汇报。网络模型允许物理安保人员在层次数据库中拥有“两个上级”：通过\
  \ IT 经理和设施经理汇报。\n\n#### 面向对象数据库\n\n\n\n\n数据库传统上仅包含（被动）数据，而面向对象数据库则在面向对象框架中将数据与函数（代码）结合在一起。面向对象编程（OOP）用于操作由对象数据库管理系统（ODBMS）管理的对象（及其数据）。\n\
  \n#### 数据库完整性\n\n除了前面讨论的关系数据库完整性问题（语义完整性、参照完整性和实体完整性）外，数据库还必须确保数据完整性：即数据库表中条目的完整性。这将完整性视为一个更普遍的问题：减轻数据的未授权修改。数据库内数据完整性面临的主要挑战是对数据的并发修改尝试。数据库服务器通常运行多个线程（轻量级进程），每个线程都能修改数据。如果两个线程尝试修改同一条记录会发生什么？\n\
  \nDBMS 可能会尝试*提交*更新：使挂起的更改永久生效。如果提交不成功，DBMS 可以*回滚*（也称为中止）并从*保存点*（数据库表的干净快照）恢复。\n\n\
  *数据库日志*是所有数据库事务的日志。如果数据库损坏，可以将数据库还原为备份副本，然后从日志中“重放”后续事务，恢复数据库完整性。\n\n#### 数据库复制与影子\n\
  \n数据库可以是高可用（HA）的，通过包含表的多个副本的多个服务器进行复制。完整性是复制数据库的主要关注点：如果一条记录在一个表中被更新，它必须同时在所有表中更新。此外，如果两个进程尝试在两个不同的服务器上同时更新同一个元组会发生什么？它们不能都成功；这将违反元组的完整性。\n\
  \n*数据库复制*镜像一个活动数据库，允许客户端同时对多个复制数据库进行读写。复制数据库带来了额外的完整性挑战。可以使用两阶段（或多阶段）提交来保证完整性：在提交前，DBMS\
  \ 请求投票。如果每台服务器上的 DBMS 都同意提交，则更改永久生效。如果有任何 DBMS 不同意，投票失败，更改不被提交（不永久生效）。\n\n*影子数据库*类似于复制数据库，但有一个关键区别：影子数据库镜像主数据库的所有更改，但客户端不访问影子数据库。与复制数据库不同，影子数据库是单向的（数据从主库流向影子库）：它作为主数据库的实时数据备份。\n\
  \n#### 数据仓库与数据挖掘\n\n顾名思义，*数据仓库*是大量数据的集合。现代数据仓库可能存储数 TB（1000 GB）甚至数 PB（1000 TB）的数据。这需要大规模可扩展的存储解决方案。存储必须是高性能的，并允许对数据进行分析和搜索。\n\
  \n数据收集到仓库后，使用*数据挖掘*来搜索模式。常见的模式包括欺诈迹象。信用卡公司管理着世界上一些最大的数据仓库，每年跟踪数十亿笔交易。欺诈交易是导致信用卡公司每年损失数百万美元收入的主要问题。没有人能监控所有这些交易，因此信用卡公司使用数据挖掘将信号与噪音分离。一个常见的数据挖掘欺诈规则监控一张卡在短时间内在不同州或国家发生的多笔购买。发生这种情况时，会生成违规记录，导致卡片被暂停或向持卡人家中打电话。\n\
  \n### 面向对象设计与编程\n\n面向对象设计与编程使用对象隐喻来设计和编写计算机程序。我们的身体由独立运行并相互通信的对象组成。我们的眼睛是独立的器官（对象），接收光输入，向大脑发送神经冲动输出。我们的心脏从静脉接收脱氧血、从肺部接收氧气，向动脉输送含氧血。许多器官可以被替换：患病的肝脏可以被健康的肝脏替换。*面向对象编程*（OOP）在计算机程序中复制对象的使用。*面向对象设计*（OOD）将对象视为一种高层设计概念，类似于流程图。\n\
  \n#### 面向对象编程 (OOP)\n\n面向对象编程（OOP）改变了旧的结构化编程方法，将程序视为一系列通过消息通信的连接对象。面向对象编程试图模拟现实世界。OOP\
  \ 语言的例子包括 Java、C++、Smalltalk 和 Ruby。\n\n对象是一个能够执行功能、发送和接收消息的“黑盒”。对象包含数据和*方法*（它们执行的函数）。对象提供*封装*（也称为*数据隐藏*）：从外部我们不知道对象如何执行其功能。这提供了安全效益：用户不应暴露于不必要的细节。把水槽想象成一个功能是洗手的对象。输入消息是清水；输出消息是脏水。你不需要知道也不关心水从哪里来、流向哪里。如果你在考虑这些问题，水槽可能坏了。\n\
  \n##### 面向对象编程基石概念\n\n面向对象编程的基石概念包括对象、方法、消息、继承、委托、多态和多实例化。我们将使用一个名为“Addy”的示例对象来说明这些基石概念。Addy\
  \ 是一个将两个整数相加的对象；它是一个极其简单的对象，但具有足够的复杂性来解释核心 OOP 概念。Addy 从其*父类*（该类称为数学运算符）*继承*了对数字和数学的理解。一个具体的对象称为*实例*。注意，对象除了可以从类继承外，还可以从其他对象继承。\n\
  \n在我们的例子中，程序员只需编程让 Addy 支持加法方法（继承负责 Addy 必须知道的其他一切）。图 9.8 展示了 Addy 将两个数字相加。\n\n\
  ![图 9.8 “Addy”对象。](img/f09-08-9780443187346.jpg)\n\n图 9.8 “Addy”对象。\n\n“1 + 2”是输入消息；“3”是输出消息。Addy\
  \ 还支持委托：如果它不知道如何执行请求的功能，它可以将该请求委托给另一个对象（在图 9.9 中称为“Subby”）。\n\n![图 9.9 委托。](img/f09-09-9780443187346.jpg)\n\
  \n图 9.9 委托。\n\nAddy 还支持多态（基于希腊词根“poly”和“morph”，分别意为“多”和“形式”）：它有能力重载其加号（“+”）运算符，根据输入消息的上下文执行不同的方法。例如：当输入消息包含“数字+数字”时\
  \ Addy 执行加法；多态允许 Addy 在输入消息包含“字符串+字符串”时连接两个字符串，如图 9.10 所示。\n\n![图 9.10 多态。](img/f09-10-9780443187346.jpg)\n\
  \n图 9.10 多态。\n\n\n\n最后，多实例化意味着“多个实例”，即具有相同名称但包含不同数据的两个实例（具体对象）。例如，这可用于多级安全环境中，以将绝密数据和机密数据分开。有关多实例化的更多信息，请参见第\
  \ 4 章，领域 3：安全架构与工程。图 9.11 显示了多实例化的 Addy 对象：两个名称相同但数据不同的对象。请注意，这是两个独立的对象。此外，对于拥有机密许可的主体，包含机密数据的\
  \ Addy 对象是唯一已知的 Addy 对象。\n\n![图 9.11 多实例化。](img/f09-11-9780443187346.jpg)\n\n图 9.11\
  \ 多实例化。\n\n以下是通过 Addy 说明的面向对象编程概念摘要：\n\n*   **对象**：`Addy`\n*   **类**：`数学运算符`\n*\
  \   **方法**：`加法`\n*   **继承**：`Addy` 从其父类 `数学运算符` 继承了对数字和数学的理解。程序员只需编程让 `Addy` 支持加法方法即可\n\
  *   **示例输入消息**：`1 + 2`\n*   **示例输出消息**：`3`\n*   **多态性**：`Addy` 可根据输入的上下文改变行为，重载\
  \ `+` 以执行加法或连接操作，具体取决于上下文\n*   **多实例化**：两个 `Addy` 对象（机密和绝密），包含不同的数据\n\n##### 耦合与内聚\n\
  \n耦合和内聚是描述对象的两个概念。高度耦合的对象（如 `Addy`）需要大量其他对象来执行基本任务，如数学运算。高内聚的对象则更加独立：它可以独立执行大多数功能。高耦合的对象具有低内聚，反之亦然：低耦合的对象具有高内聚。\n\
  \n`Addy` 高度耦合且内聚性低：他必须委派任何不包含 `+` 的消息。想象另一个名为 `Calculator` 的对象，它可以进行加、减、乘、除、开平方、指数运算等。`Calculator`\
  \ 将具有高内聚和低耦合。\n\n##### 举例学习：通过对象管理风险\n\n对象设计为可重用：这降低了开发成本。对象也可以降低风险。就像强加密（如 `AES`）一样，一个对象在安全使用中存在的时间越长，我们就越有把握认为该对象是真正安全的。像加密算法一样，随着时间的推移，无数次攻击都证明是不成功的，该对象展示了其现实世界中的强度。\n\
  \n假设贵公司过去 5 年一直在网上销售信息安全书籍。您的网站允许用户选择一本书，例如 W. Richard Stevens 编写的 *TCP/IP Illustrated*，并输入他们的姓名、地址和信用卡账单信息。信用卡交易风险很大：风险包括客户\
  \ PII 的泄露，以及信用卡欺诈风险；被盗卡被用于欺诈性购买书籍。\n\n该网站使用面向对象语言编程。它包含一个名为 `CCValidate` 的信用卡处理对象，最早编写于\
  \ 5 年前。输入消息是客户输入的信用卡号和有效期。输出消息是二元的：“批准”或“拒绝”。\n\n`CCValidate` 对象隐藏了在输入信用卡号和有效期后，后台发生的复杂性。它执行以下方法：\n\
  \n1.  该对象拥有用于信用卡号的变量缓冲区，可执行边界检查。\n2.  该对象确保输入消息长度适当，且每个字段包含适当类型的字符。\n    a.  以 `MasterCard®`\
  \ 为例，为 16 位数字（信用卡号），后跟日期（两位数月份后跟四位数年份）。\n    b.  任何不符合这些标准的输入消息将被立即拒绝。\n3.  该对象确保有效期在将来。\n\
  \    a.  任何不符合此标准的输入消息将被立即拒绝。\n4.  该对象随后评估所输入信用卡号中的格式和自校验数字。\n    a.  有效的 `MasterCard®`\
  \ 号以 51–55 开头，且为 16 位数字。\n    b.  它们还必须包含适当的自校验数字。\n        i.  详见 [`web.eecs.umich.edu/~bartlett/credit_card_number.xhtml`](http://web.eecs.umich.edu/~bartlett/credit_card_number.xhtml)\n\
  \    c.  任何不符合这些标准的输入消息将被立即拒绝。\n5.  该对象随后向相应的信用卡公司服务器发送消息，检查该卡是否有效且余额足以进行购买。\n \
  \   a.  信用卡公司发回“接受”或“拒绝”的返回消息，信用卡对象将其作为消息发送给 Web 服务器。\n\n随着 `CCValidate` 的使用，可能会发现并修复\
  \ Bug。可能会确定并编码改进。随着时间的推移，对象逐渐成熟，只需完成其工作即可。它在互联网上遭受攻击；攻击者发起缓冲区溢出攻击并插入垃圾数字，但该对象表现出色。\n\
  \n如果新网站上线，程序员不应从头创建新的信用卡验证对象：重复造轮子风险太大。他们应通过定位并使用经受住时间考验的成熟对象来管理风险：`CCValidate`。\n\
  \n#### 对象请求代理\n\n正如我们之前所见，成熟对象设计为可重用：它们降低风险和开发成本。*对象请求代理*（ORB）可用于定位对象：它们充当对象搜索引擎。ORB\
  \ 是*中间件*：它们将程序连接到程序。常见的对象代理包括 `COM`、`DCOM` 和 `CORBA`。\n\n##### COM 和 DCOM\n\n微软的两种对象代理技术是\
  \ *COM*（*组件对象模型*）和 *DCOM*（*分布式组件对象模型*）。`COM` 定位本地系统上的对象；`DCOM` 还可以通过网络定位对象。\n\n\
  `COM` 允许用不同 OOP 语言编写的对象进行通信，例如，用 `C++` 编写的对象向用 `Java` 编写的对象发送消息。它旨在隐藏任何单个对象的细节，并专注于对象的能力。`COM+`\
  \ 是 `COM` 的扩展，在 Microsoft Windows 2000 中引入。`ActiveX` 在第 4 章，领域 3：安全架构与工程中讨论。\n\n\
  `DCOM` 是 `COM` 的网络化续作。`DCOM` 包含*对象链接与嵌入*（OLE），一种将文档链接到其他文档的方式。\n\n`COM` 和 `DCOM`\
  \ 正逐渐被 `Microsoft.NET` 取代，后者可以与 `DCOM` 互操作，但为 `COM` 和 `DCOM` 都提供了高级功能。\n\n#####\
  \ CORBA\n\n*公共对象请求代理体系结构*（CORBA）是由对象管理组（OMG）制定的开放、厂商中立、网络化的对象代理框架。`CORBA` 与微软专有的\
  \ `DCOM` 竞争。`CORBA` 对象通过消息接口进行通信，由*接口定义语言*（IDL）描述。有关 `CORBA` 的更多信息，请参见 [`www.corba.org`](http://www.corba.org)。\n\
  \n\n\nCORBA 的本质不仅在于作为网络对象代理，更在于将接口（与对象通信的语法）与实例（特定对象）相分离：“每个对象的接口都有非常严格的定义。相反，对象的实现——其运行代码及其数据——被隐藏在系统的其余部分之外（即封装），位于客户端不可跨越的边界之后。客户端只能通过其公开的接口访问对象，仅能调用对象通过其\
  \ `IDL` 接口暴露的操作，且仅限于调用中包含的那些参数（输入和输出）”[\\[27\\]](#Ch009_459-508_B9780443187346000088.xhtml#bb0140)。\n\
  \n除了通过网络定位对象外，CORBA 还强制执行基本的面向对象设计：底层细节对客户端封装（隐藏）。对象在不透露实现方式的情况下执行其方法。实现者专注于连接，而非代码。\n\
  \n#### 面向对象分析（OOA）与面向对象设计（OOD）\n\n**面向对象分析**（OOA）和**面向对象设计**（OOD）是软件设计方法论，它们将对象的概念提升到比面向对象编程（OOP）更高、更概念化的层面。这两个术语有时合称为面向对象分析与设计（OOAD）。\n\
  \n这就像在白板上绘制流程图，展示程序在概念上应如何运行。程序中数据的流动和操作方式被可视化为一系列消息和对象。软件设计完成后，代码可使用 `Ruby` 等面向对象编程语言编写。\n\
  \n面向对象分析（OOA）旨在理解（分析）**问题域**（你试图解决的挑战），并识别所有对象及其交互。面向对象设计（OOD）则开发（设计）解决方案。\n\n我们将使用面向对象分析与设计来设计一个网络入侵检测系统（NIDS）。正如我们在第\
  \ 8 章“领域 7：安全运营”中所学，NIDS 执行以下操作：\n\n1.  从网络嗅探数据包并将其转换为 `pcap`（数据包捕获）格式；\n2.  分析数据包中的攻击迹象，这可能包括拒绝服务、客户端攻击、服务端攻击、Web\
  \ 应用攻击及其他；\n3.  如果发现恶意攻击，NIDS 发送警报。NIDS 可通过电子邮件、寻呼、`syslog` 或安全信息和事件管理器（SIEM）发送警报。\n\
  \n上述步骤构成了我们面向对象分析的基础。嗅探器对象以数据包形式接收来自网络的消息。嗅探器将数据包转换为 `pcap`（数据包捕获）数据，并将其发送给分析对象。分析对象执行多项功能（方法），包括检测拒绝服务、客户端、服务端或\
  \ Web 应用攻击。如果检测到任何攻击，它会向警报对象发送警报消息。警报对象也可执行多项功能，包括通过电子邮件、寻呼、`syslog` 或 SIEM 进行告警。NIDS\
  \ 面向对象设计如图 9.12 所示。\n\n![图 9.12 NIDS 面向对象设计。](img/f09-12-9780443187346.jpg)\n\n\
  图 9.12 NIDS 面向对象设计。\n\n该 NIDS 设计解决了当恶意流量在网络上发送时进行告警的问题域。\n\n### 评估软件安全的有效性\n\n项目启动且软件编程完成后，接下来的步骤是测试软件，重点关注系统、应用程序及应用程序处理的数据的机密性、完整性和可用性。必须特别注意发现可能导致数据或系统泄露的软件漏洞。最后，组织需要能够衡量其软件创建过程的有效性，并找出改进方法。\n\
  \n#### 软件漏洞\n\n程序员会犯错：自计算机编程诞生以来，这始终是真理。在《代码大全》中，Steve McConnell 表示，“经验表明，每 1000\
  \ 行交付代码中会有 15–50 个错误”[\\[28\\]](#Ch009_459-508_B9780443187346000088.xhtml#bb0145)。一千行代码有时称为\
  \ `KLOC`；“K”代表千。遵循正式的应用成熟度框架模型可以降低这一数字。卡内基梅隆大学软件工程研究院研究员 Watts S. Humphrey 声称，遵循\
  \ SEI 能力成熟度模型集成（CMMI，见下文“软件能力成熟度模型集成 (CMMI)”一节）的组织，可将错误数量降低到每 `KLOC` 一个[\\[29\\\
  ]](#Ch009_459-508_B9780443187346000088.xhtml#bb0150)。\n\n即使每千行代码仅有一个错误，随着软件日益复杂，也会引入巨大的安全风险。以\
  \ Microsoft Windows 为例：“因此，Windows 的每个新版本都背负着其过去的包袱。随着 Windows 的增长，技术挑战变得日益艰巨。数千名工程师辛勤工作以构建和测试\
  \ Windows Vista，这是一个庞大、复杂的软件建设项目，拥有 5000 万行代码，比 Windows XP 大 40% 以上”[\\[30\\]](#Ch009_459-508_B9780443187346000088.xhtml#bb0155)。请注意，Microsoft\
  \ 尚未发布其近期操作系统（包括 Windows 11 和 Server 2022）的代码行数。\n\n如果 Microsoft Vista 的程序员每 `KLOC`\
  \ 仅犯一个错误，那么 Vista 将有 50,000 个错误。大型软件项目凸显了对稳健且系统化的软件测试方法的需求。\n\n##### 软件漏洞类型\n\n\
  本节将简要描述常见的应用程序漏洞。请同时参阅第 4 章“领域 3：安全架构与工程”中的“系统漏洞、威胁和对策”部分，以了解其他漏洞类型的信息。最新的漏洞信息可参考“CWE\
  \ Top 25 Most Dangerous Software Weaknesses”（CWE 25 个最危险的软件弱点），网址为 <https://cwe.mitre.org/top25/archive/2021/2021_cwe_top25.xhtml>；以下摘要基于此列表。`CWE`\
  \ 指通用弱点枚举，是 MITRE 维护的软件漏洞字典（见 <https://cwe.mitre.org/>）。\n\n*   **越界写入**（又称缓冲区溢出，发生在程序员未执行变量边界检查时）\n\
  *   **跨站脚本**（Web 页面生成过程中对输入的不当中和）\n*   **越界读取**（读取缓冲区末尾之后的数据）\n*   **输入验证不当**\n\
  *   **操作系统命令注入**\n*   **SQL 注入**：通过前端 Web 服务器操纵后端 SQL 服务器\n*   **跨站请求伪造 (CSRF)**\n\
  *   **目录路径遍历**：通过引用 `../..` 等目录，从 Web 服务器根目录（如 `/var/www`）逃逸到常规文件系统[\\[31\\]](#Ch009_459-508_B9780443187346000088.xhtml#bb0160)\n\
  \n###### 缓冲区溢出\n\n当程序员未执行边界检查时，会发生**缓冲区溢出**。以下是“输入用户名”程序的伪代码。该程序声明 `$username` 变量长度为\
  \ 20 个字符，打印“Enter Username:”，然后将用户输入存储在 `$username` 变量中：\n\n```\nvariable $username[20]\n\
  print “Enter Username:”\ngetstring($username)\n```\n\n此函数包含缓冲区溢出。程序员声明 `$variable`\
  \ 长度为 20 字节，但未对 `getstring` 函数执行边界检查。程序员假设用户会输入类似“bob”的内容。\n\n\n\n如果攻击者输入 50 个“A”：\n\
  \n```\nAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA\n```\n\n答案是：许多编程语言（如 C\
  \ 语言）不提供内置的边界检查：前 20 个字节将被复制到为 `$username` 变量分配的内存中。接下来的 30 个字节将覆盖内存中接下来的 30 个字节。这些内存可能包含其他数据或指令。这被称为“栈溢出”。这种技术可用于插入并运行\
  \ Shellcode（执行 Shell 的机器码语言，例如 Microsoft Windows 的 `cmd.exe` 或 UNIX/Linux Shell）。\n\
  \n缓冲区溢出可通过安全的应用程序开发来缓解，包括边界检查。\n\n###### TOCTOU/竞争条件\n\n*检查时间/使用时间*（TOCTOU）攻击也称为*竞争条件*：攻击者试图在操作系统检查完某个条件后、但在使用该条件前，对其进行篡改。TOCTOU\
  \ 是状态攻击的一个例子，攻击者利用操作系统状态的变化进行攻击。\n\n下面是一个名为“打开测试文件”的 setuid root 程序（以超级用户权限运行，无论运行用户是谁）的伪代码，该程序包含一个竞争条件：\n\
  \n1.  如果文件“test”可被用户读取\n2.  则打开文件“test”\n3.  否则打印“错误：无法打开文件。”\n\n竞争条件发生在第 1 步和第\
  \ 2 步之间。请记住，大多数现代计算机都是多任务处理的：CPU 同时执行多个进程。当我们的“打开测试文件”程序运行时，其他进程也在运行。换句话说，计算机可能会这样运行我们的程序：\n\
  \n1.  如果文件“test”可被用户读取\n2.  运行另一个进程\n3.  运行另一个进程\n4.  然后打开文件“test”\n\n攻击者可以通过在第\
  \ 1 步（检查时间）和第 2 步（使用时间）之间，将文件“test”从普通文件更改为符号链接（类似于桌面快捷方式），来读取系统上的任意文件：\n\n1.  如果文件“test”可被用户读取\n\
  2.  攻击者删除“test”，创建从“test”到 `/etc/shadow` 的符号链接\n3.  运行另一个进程\n4.  然后打开文件“test”（现在是指向\
  \ `/etc/shadow` 的符号链接）\n\n如果攻击者赢得了竞争（在“if”和“then”之间更改了“test”的状态），“test”就是一个指向 `/etc/shadow`\
  \ 的符号链接。该 setuid root 程序将打开该符号链接，从而打开 `/etc/shadow` 文件。\n\n###### 跨站脚本和跨站请求伪造\n\n\
  跨站脚本攻击（XSS）利用受信任站点的安全上下文，执行第三方 Web 脚本语言（如 JavaScript）。跨站请求伪造（CSRF，有时也称为 XSRF）利用受信任站点的安全上下文，重定向第三方静态内容。跨站脚本攻击和跨站请求伪造经常被混淆。它们都是\
  \ Web 攻击：区别在于 XSS 在受信任的上下文中执行脚本：\n\n```\n<script>alert(\"XSS Test!\");</script>\n\
  ```\n\n上述代码会弹出一个无害的“XSS Test!”警告框。真实的攻击会包含更多 JavaScript，通常用于窃取 Cookie 或认证凭据。XSS\
  \ 还可用于“挂马”浏览器，这允许攻击者远程控制用户的浏览器，并以此为跳板。跳板允许攻击者在“敌后”（防火墙内部）建立立足点，并访问内部网站等。要了解更多关于此概念的信息，请参阅\
  \ BeEF（浏览器利用框架项目）项目，网址为 [`beefproject.com/`](http://beefproject.com/)。\n\nCSRF 通常诱骗用户处理一个\
  \ URL（有时通过在 HTML 图像标签中嵌入该 URL），从而执行恶意行为，例如，诱骗白帽黑客渲染以下图像标签：\n\n```\n<img src=”https://bank.example.com/transfer-money?from=WHITEHAT&to=BLACKHAT”>\n\
  ```\n\n###### 权限提升\n\n*权限提升*漏洞允许拥有（通常是有限）访问权限的攻击者能够访问额外的资源。垂直提升利用非特权访问获取更高级别的访问权限。一个例子是将权限从普通\
  \ UNIX 用户提升为 root 访问权限（UID 0）。\n\n水平提升允许攻击者访问其他账户，例如从一个非特权账户跳转到另一个非特权账户（该账户拥有不同资源的访问权限）。\n\
  \n不当的软件配置以及糟糕的编码和测试实践往往会导致权限提升漏洞。\n\n###### 后门\n\n后门是系统中的捷径，允许用户绕过安全检查（如用户名/密码认证）进行登录。攻击者在攻陷系统后通常会安装后门。例如，攻击者通过利用缺失补丁导致的漏洞获得了系统的\
  \ Shell 访问权限。攻击者希望维持访问权限（即使系统打了补丁），因此她安装了一个后门以允许未来的访问。\n\n#### 软件能力成熟度模型集成 (CMMI)\n\
  \n软件*能力成熟度模型集成*（CMMI）是一个用于评估和改进软件开发过程的成熟度框架。卡内基梅隆大学（CMU）软件工程研究所（SEI）开发了该模型。现在由 CMMI\
  \ 研究院管理：“CMMI 最初是在软件工程研究所开发的，该研究所是卡内基梅隆大学内部一个联邦资助的研发中心。2016 年，CMMI 研究院被 ISACA 收购”\
  \ [\\[32\\]](#Ch009_459-508_B9780443187346000088.xhtml#bb0165)。\n\nCMMI 的目标是开发一种系统化的框架，用于创建高质量软件，从而实现可度量和可重复的结果：“即使在非规范化的组织中，某些个别软件项目也能产生优秀的结果。当此类项目成功时，通常是通过一个专门团队的英勇努力，而不是通过重复成熟软件过程组织的经验证方法。在缺乏组织级软件过程的情况下，重复成功完全取决于下一个项目是否有相同的人员可用。仅依赖特定个人可用性的成功，无法为组织的长期生产力和质量改进提供基础。持续改进只能通过专注且持续的努力，建立有效的软件工程和管理实践的过程基础设施来实现”\
  \ [\\[33\\]](#Ch009_459-508_B9780443187346000088.xhtml#bb0170)。\n\nCMMI 的五个级别描述如下（参见\
  \ [`resources.sei.cmu.edu/library/asset-view.cfm?assetid=11955`](https://resources.sei.cmu.edu/library/asset-view.cfm?assetid=11955)）：\n\
  \n1.  *初始级*：软件过程的特点是临时性的，甚至偶尔是混乱的。很少定义过程，成功取决于个人努力。\n2.  *可重复级*：建立了基本的项目管理过程来跟踪成本、进度和功能。必要的过程规范到位，能够在具有类似应用的项目上重复早期的成功经验。\n\
  3.  *已定义级*：管理和工程活动的软件过程已文档化、标准化，并整合为组织的标准软件过程。项目使用组织标准软件过程的经批准、剪裁版本来开发和维护软件。\n4.\
  \  *已管理级*：收集、分析并使用软件过程和产品质量的详细度量来控制过程。软件过程和产品都能被定量地理解和控制。\n5.  *优化级*：通过来自过程的定量反馈以及试点创新想法和技术，实现持续的过程改进\
  \ [\\[33\\]](#Ch009_459-508_B9780443187346000088.xhtml#bb0170)。\n\n#### 验收测试\n\n\
  \n\n#### 验收测试\n\n验收测试测试软件是否满足来自用户或客户、合同或合规视角的各种最终状态需求。ISTQB（国际软件测试资格委员会）将验收测试定义为：“一种正式测试，针对用户需求、要求和业务流程进行，以确定系统是否满足验收标准，并使用户、客户或其他授权实体能够决定是否接受该系统”\
  \ [\\[34\\]](#Ch009_459-508_B9780443187346000088.xhtml#bb0175)。\n\nISTQB 还列出了验收测试的四个级别：\n\
  \n*   **用户验收测试**：主要关注功能，从而验证系统对业务用户的**适用性**。用户验收测试由用户和应用程序管理员执行。\n*   **运营验收测试**：也称为生产验收测试，验证系统是否满足运行要求。在大多数组织中，运营验收测试由系统管理员在系统发布前执行。运营验收测试可能包括备份/恢复测试、灾难恢复、维护任务以及安全漏洞的定期检查。\n\
  *   **合同验收测试**：针对合同的验收标准执行，用于定制开发的软件。验收标准应在商定合同时正式定义。\n*   **合规验收测试**：也称为法规验收测试，针对必须遵守的法规执行，例如政府、法律或安全法规”\
  \ [\\[35\\]](#Ch009_459-508_B9780443187346000088.xhtml#bb0180)。\n\n### 评估所获取软件的安全影响\n\
  \n我们希望能够信任供应商关于产品能力的声明。在被证明为真之前，供应商的声明应被视为营销宣传。不要仅依赖供应商的声明，即使是关于基本能力的声明。\n\n一个重要的观点是在评审产品**之前**收集需求。如果在评审产品**之后**才定义需求，供应商可能会说服组织，使其认为自己有特定需求，而只有该供应商的产品能满足。不要让产品或营销决定组织在产品中“需要”什么。\n\
  \n#### 商用现成软件 (COTS)\n\n对于商用现成软件 (COTS)，供应商的声明更容易验证。对于 COTS，应进行**实地对比测试**，比较已满足需求的产品。不要依赖产品路线图会成为现实。一个特别重要的安全需求是寻找与现有基础设施和安全产品的集成能力。虽然**最佳单品**可能是组织的总体偏好，但要认识到增加一个管理控制台（以及随之而来的额外用户配置）会增加产品的运营成本。要考虑产品的**总拥有成本\
  \ (TCO)**，而不仅仅是资本支出和年度维护成本。\n\n由于产品可以被评估以确定其是否提供声称的能力，因此对于 COTS 软件，供应商的声明更容易验证。\n\
  \n第三方研究和分析机构提供特定领域各参与者的评估，这可以在不需要大量内部测试的情况下提供产品的基本（尽管可能有偏见）对比。\n\n通常可以联系供应商的客户。当然，如果这些联系人是由供应商自己提供的，那么在接受其声明时要谨慎。更好的方法是自行寻找正在使用该产品的人，并询问他们的优缺点及喜好/厌恶。\n\
  \n针对 COTS 的一些问题/顾虑：如果供应商倒闭了怎么办？如果缺少关键功能怎么办？寻找供应商产品的内部或第三方支持有多容易？\n\n#### 定制开发的第三方产品\n\
  \nCOTS 的替代方案是采用定制开发的应用程序。这些定制开发的第三方应用程序提供了超越 COTS 的额外风险和潜在收益。在与第三方开发商打交道时，合同条款和**服务级别协议\
  \ (SLA)** 至关重要。除非合同强制要求提供安全能力，否则永远不要假设安全性会成为产品开发过程中的一个考量因素。\n\n应在签署合同和制定 SLA **之前**讨论基本安全需求，以确保供应商预期能够交付这些能力。与\
  \ COTS 非常相似，关键问题包括：如果供应商倒闭了怎么办？如果缺少关键功能怎么办？寻找供应商产品的内部或第三方支持有多容易？\n\n### 人工智能\n\n\
  计算机进行计算：它们完全按照指令行事。“计算机”一词最早于 1613 年被用来描述从事加法运算的人。人工智能是让电子计算机更“智能”地“思考”的科学，有时模仿哺乳动物大脑的能力。\n\
  \n#### 专家系统\n\n*专家系统*由两个主要组件组成。第一个是*知识库*，由“如果/那么”语句组成。这些语句包含专家系统用于做决策的规则。第二个组件是*推理引擎*，它遵循知识库形成的树状结构，并在有匹配时触发规则。\n\
  \n下面是一个示例“互联网中断”专家系统，当用户致电抱怨无法访问互联网时，服务台可能会使用它：\n\n1.  **如果您的计算机已开启**\n    *   否则：开启您的计算机\n\
  2.  **那么如果您的显示器已开启**\n    *   否则：开启您的显示器\n3.  **那么如果您的操作系统已启动且您能打开 `cmd.exe` 提示符**\n\
  \    *   否则：修复操作系统\n4.  **那么如果您能 ping 通 `127.0.0.1`**\n    *   否则：检查网络接口配置\n5. \
  \ **那么如果您能 ping 通本地网关**\n    *   否则：检查本地网络连接\n6.  **那么如果您能 ping 通互联网地址 `192.0.2.187`**\n\
  \    *   否则：检查网关连接\n7.  **那么如果您能 ping 通 `syngress.com`**\n    *   否则：检查 DNS\n\n\
  **正向链接**从无前提开始（在前面的示例中为“计算机是否开启”），向前推导以确定解决方案。**反向链接**从一个前提开始（例如“可能是 DNS 坏了”），向后推导。\n\
  \n知识库的完整性至关重要。整个知识库应形成一棵逻辑树，始于一个树干（在前面的示例中为“计算机是否开启”）。知识库随后应分支展开。推理引擎遵循这棵树，根据如果/那么语句的回答进行分支或触发。\n\
  \n不应有循环规则；使用前面示例的一个循环规则例子：“如果您的计算机已开启，那么如果您的显示器已开启，那么如果您的操作系统已启动且您能打开 `cmd.exe`\
  \ 提示符，那么如果您的计算机已开启……”。也不应有未引用的规则（不连接到知识库树的分支）。\n\n#### 人工神经网络\n\n人工神经网络 (ANN) 模拟人类和动物大脑中的神经网络。人脑的神经网络拥有\
  \ 1000 亿个神经元，每个神经元通过数千个或更多突触相互连接。每个神经元可能会根据突触输入而激发。这种多层神经网络能够基于数千个或更多输入做出单一决策。\n\
  \n##### 真实神经网络\n\n\n\n\n让我们来讨论真实神经网络是如何运作的：想象你在深夜独自走在城市的街道上，有人紧跟在你身后。你开始变得紧张：时间很晚；四周很暗；身后的人离你太近了。你必须做出决定：战斗还是逃跑。你必须决定是转身面对追逐者，还是设法摆脱他们。\n\
  \n在你做决定的过程中，你在权衡成千上万的输入。你回忆起过往经历；你的本能指引着你，你通过五官感知世界。这些感官每毫秒都在向你的大脑发送新的输入。你的记忆、本能、视觉、嗅觉、听觉等，都在持续不断地向神经元发送突触输入。不太重要的输入（在这种情况下如味觉）具有较低的突触权重。更重要的输入（如听觉）具有较高的突触权重。接收到较高输入的神经元更有可能激发，最终输出神经元激发（做出决定）。\n\
  \n最后，你决定转身面对追逐者，欣慰地发现那只是一个戴着耳机听音乐的人，并没有注意周围环境。成千上万个输入导致了一个二元决定：战斗还是逃跑。人工神经网络（ANN）旨在复制这一复杂的决策过程。\n\
  \n##### 人工神经网络如何运作\n\nANN 旨在复发生物神经网络的能力。节点用于描述人工神经元。与其生物对应物一样，这些节点从突触接收输入，并在超过某个权重时发送输出。单层\
  \ ANN 有一层输入节点；多层 ANN 拥有多层节点，包括隐藏节点，如 图 9.13 所示。图 9.13 中的箭头代表突触权重。单层和多层人工神经网络最终都会触发一个输出节点激发：这个输出节点做出决定。\n\
  \n![图 9.13 多层人工神经网络。](img/f09-13-9780443187346.jpg)\n\n图 9.13 多层人工神经网络。\n\n人工神经网络通过训练函数，借助示例进行学习：突触权重通过迭代过程发生变化，直到输出节点针对给定的一组输入正确激发。人工神经网络用于“模糊”解决方案，即不总是需要（或可能）精确解的场景，例如天气预测。\n\
  \n##### 贝叶斯过滤\n\n贝叶斯过滤以托马斯·贝叶斯命名，他是一位英国牧师，设计了多种概率和统计方法，包括“一种用于计算条件概率的简单数学公式”[\\\
  [36\\]](#Ch009_459-508_B9780443187346000088.xhtml#bb0185)。\n\n贝叶斯过滤常用于识别垃圾邮件。保罗·格雷厄姆在其论文《垃圾邮件计划》（见\
  \ [www.paulgraham.com/spam.xhtml](http://www.paulgraham.com/spam.xhtml)）中描述了利用贝叶斯过滤识别垃圾邮件的方法。他描述了使用“语料库”中的“垃圾邮件”和“正常邮件”，即人工挑选的垃圾邮件组和非垃圾邮件组。然后，他利用贝叶斯过滤技术自动分配一个数学概率，判断某些“标记”（邮件中的词汇）是否为垃圾邮件的指征。\n\
  \n##### 遗传算法与编程\n\n遗传算法与编程从根本上改变了软件的开发方式：软件不再由程序员编写，而是通过进化来解决问题。遗传算法与编程旨在复制自然界的进化过程，即动物通过进化解决问题。遗传编程指创建完整的软件程序（通常以\
  \ Lisp 源代码形式）；遗传算法指创建较短的代码片段（表示为称为染色体的字符串）。\n\n两者都是自动生成的，然后通过多代“繁殖”，遵循达尔文原则进行改进：“遗传算法是基于自然选择和自然遗传学机制的搜索算法。它们将字符串结构中优胜劣汰的生存法则与结构化但随机的信息交换相结合，形成了一种具有人类搜索某些创新才能的搜索算法。在每一代中，利用旧种群中最优秀个体的片段创建一组新的人工个体（字符串）；偶尔会尝试一些新部分以求万全。虽然具有随机性，但遗传算法绝非简单的随机漫步。它们高效地利用历史信息，推测具有预期改进性能的新搜索点”[\\\
  [37\\]](#Ch009_459-508_B9780443187346000088.xhtml#bb0190)。\n\n遗传编程创建随机程序并分配给它们解决问题的任务。`fitness\
  \ function`（适应度函数）描述它们执行任务的效果如何。`Crossover`（交叉）将两个程序“杂交”在一起（交换它们的代码）。`Mutation`（变异）在某些程序中引入随机变化。约翰·R·科扎在《遗传编程：通过自然选择实现计算机自主编程》中描述了这一过程。该过程总结如下：\n\
  \n*   “生成初始随机计算机程序种群。\n*   执行种群中的每个程序，并根据其解决问题的效果分配适应度值。\n*   创建新的计算机程序种群。\n   \
  \ *   复制现有的最佳程序。\n    *   通过变异创建新的计算机程序。\n    *   通过交叉（有性生殖）创建新的计算机程序”[\\[38\\]](#Ch009_459-508_B9780443187346000088.xhtml#bb0195)。\n\
  \n遗传算法和遗传编程已被用于编写吃豆人游戏程序、机器人足球队、网络入侵检测系统等众多应用。\n\n### 考试目标总结\n\n我们生活在一个日益计算机化的世界中，软件无处不在。软件处理的数据的机密性、完整性和可用性至关重要，软件自身的正常功能（可用性）同样关键。本领域展示了软件如何工作，以及程序员在试图编写无错误代码以保护数据（和软件本身）抵御攻击时面临的挑战。\n\
  \n遵循正式的软件开发方法论，并辅以严格的测试制度，是最佳实践。我们已经看到，遵循软件开发成熟度模型（如能力成熟度模型集成 CMMI）可以显著降低程序员犯错的数量。CMMI\
  \ 的五个步骤遵循了大多数编程组织遵循的过程，从非正式过程到总是寻求改进的成熟过程：初始级、可重复级、已定义级、已管理级和优化级。\n\n### 自我测试\n\n\
