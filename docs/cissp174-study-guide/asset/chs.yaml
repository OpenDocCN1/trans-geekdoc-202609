  \n### 第 5 章：领域 4：通信与网络安全\n\n## 摘要\n\n本章涵盖的领域 4：通信与网络安全，是 CISSP®考试中另一个非常技术性的领域。作为\
  \ CISSP®包含的最技术性的领域之一，领域 4 要求在相当深度的层面上理解网络和 TCP/IP 协议套件。本领域介绍了路由器和交换机等网络硬件。入侵检测系统\
  \ (IDS)、入侵防御系统 (IPS)、虚拟专用网络 (VPN)、802.11 无线、射频识别 (RFID) 以及认证设备和协议的技术方面也包含在这个庞大的领域中。最近新增的主题，如微分段、虚拟可扩展局域网\
  \ (VXLAN)、软件定义广域网 (SD-WAN) 和 Li-Fi 也在本章中介绍。\n\n### 关键词\n\nOSI 模型；TCP/IP 模型；分组交换网络；交换机；路由器；载波监听多路访问\n\
  \n本章考试目标：\n\n*   • 网络架构与设计\n*   • 安全网络设备与协议\n*   • 安全通信\n\n## 独特术语与定义\n\n\n\n\n\n\
  *   • **OSI 模型**——一种包含七层的网络模型：物理层、数据链路层、网络层、传输层、会话层、表示层和应用层\n*   • **TCP/IP 模型**——一种包含四层的较简单网络模型：网络接口层、互联网层、传输层和应用层\n\
  *   • **分组交换网络**——一种共享带宽并以称为分组的单元传输数据的网络形式\n*   • **交换机**——一种第 2 层设备，基于 **MAC**\
  \ 地址在一条 **LAN** 上传输流量\n*   • **路由器**——一种第 3 层设备，基于 IP 地址将流量从一条 LAN 路由到另一条 LAN\n\
  *   • **载波监听多路访问 (CSMA)**——以太网网络用于允许共享使用基带（单信道）网络并避免冲突（多个干扰信号）的方法\n\n## 简介\n\n通信与网络安全是现代生活的基础。互联网、万维网、网上银行、即时通讯、电子邮件以及许多其他技术都依赖于网络安全：没有它，现代世界将无法存在。通信与网络安全关注传输中数据的机密性、完整性和可用性。\n\
  \n通信与网络安全是通用知识体系 (CBK) 中最大的领域之一，包含的概念比任何其他领域都多。该领域在技术深度上也是最深的领域之一，要求具备深入到 **数据包**、**段**、**帧**\
  \ 及其首部的技术知识。理解该领域对于确保考试成功至关重要。\n\n## 网络架构与设计\n\n我们的第一部分是网络架构与设计。我们将讨论网络应如何设计以及它们可能包含的控制措施，重点在于部署纵深防御策略，以及权衡网络控制的成本和复杂性与其提供的收益。\n\
  \n### 网络纵深防御\n\n通信与网络安全采用纵深防御，就像我们在通用知识体系的所有 8 个领域中所做的那样。任何单一控制都可能失效，因此始终建议采用多重控制。在\
  \ **恶意软件** (malicious software) 到达服务器之前，它可能会被以下设备分析：路由器、防火墙、入侵检测系统，以及基于主机的防护，如防病毒软件。主机已打补丁，用户也已了解恶意软件风险。这些控制中任何一个的失效都不应导致系统被攻破。\n\
  \n本章（或任何其他章节）中描述的任何单一概念都无法为抵御可能的攻击提供充分的防御：这些概念应协同使用。\n\n### 基础网络概念\n\n在讨论具体的通信与网络安全概念之前，我们需要了解其背后的基本概念。像“**宽带**”这样的术语常被非正式地使用：考试要求对信息安全术语有精确的理解。\n\
  \n#### 单工、半双工和全双工通信\n\n**单工** 通信是单向的，就像收音机调到音乐频道。**半双工** 通信一次只能发送或接收（不能同时进行），就像对讲机。**全双工**\
  \ 通信可以同时发送和接收，就像两人面对面交谈。\n\n#### 基带和宽带\n\n**基带** 网络只有一个信道，一次只能发送一个信号。以太网网络是基带网络：“100baseT”\
  \ UTP 线缆意味着 100 兆位、基带和双绞线。宽带网络有多个信道，可以同时发送多个信号，就像有线电视。“信道”一词源自无线电等通信技术。\n\n####\
  \ 模拟和数字\n\n**模拟** 通信是我们耳朵听到的，一种连续的信息波。最初的电话网络是模拟网络，设计用于传输人声。**数字** 通信以比特传输数据：1 和\
  \ 0。黑胶唱片是模拟的；光盘是数字的。\n\n#### LAN、WAN、MAN、GAN 和 PAN\n\n**LAN** 是局域网。LAN 是一个相对较小的网络，通常局限于一栋建筑物或其内部的一个区域。**MAN**\
  \ 是城域网，通常局限于一个城市、一个邮政编码、一个校园或办公园区。**WAN** 是广域网，通常覆盖城市、州或国家。**GAN** 是全球区域网，是 WAN\
  \ 的全球集合。\n\n全球信息网格 (GIG) 是美国国防部 (DoD) 的全球网络，是世界上最大的私有网络之一。\n\n在另一端，这些网络中最小的是 PAN：个人域网，范围在\
  \ 100 米或更少。蓝牙等低功耗无线技术使用 PAN。\n\n> **考试警告**\n>\n> 考试比现实世界更简单、更明确。对于“LAN 通常局限于一栋建筑物或其内部的一个区域”这类陈述，现实世界中存在例外。考试会更明确，本书也是如此。如果你读到本书中的例子，认为“这通常是对的，但有点过于简单化”，那么你是对的。这种简单化是为了帮助你通过考试而特意设计的。\n\
  \n#### 互联网、内联网和外联网\n\n**互联网** 是运行 TCP/IP 的对等网络的全球集合，提供尽力而为服务。**内联网** 是运行 TCP/IP\
  \ 的私有网络，如公司网络。**外联网** 是私有内联网之间的连接，如连接到业务合作伙伴的内联网。\n\n#### 电路交换和分组交换网络\n\n最初的语音网络是电路交换的：两个节点之间建立一条专用电路或信道（电路的一部分）。**电路交换网络**\
  \ 可以为点对点连接提供专用带宽，例如连接两个办公室的 T1 线路。\n\n电路交换网络的一个缺点：一旦信道或电路建立连接，它就专用于该目的，即使没有数据传输。分组交换网络的设计旨在解决这个问题，并更稳健地处理网络故障。\n\
  \n关于分组交换网络的最初研究是在 1960 年代初代表国防高级研究计划局 (DARPA) 进行的。该研究促成了 **ARPAnet** 的诞生，它是互联网的前身。更多信息请参阅互联网协会的“互联网简史”，网址：<https://www.isoc.org/internet/history-internet/brief-history-internet/>。\n\
  \n兰德公司早期的分组交换网络研究描述了一个“核战争”场景，但关于 ARPAnet 旨在经受住核战争的报道并不属实。互联网协会的《互联网史》报道：“……互联网技术的工作确实强调了鲁棒性和生存能力，包括承受底层网络大部分丢失的能力”\
  \ [\\[1\\]](#Ch005_225-293_B9780443187346000039.xhtml#bb0010)。\n\n分组交换网络不使用专用电路，而是将数据分解为分组，每个分组单独发送。如果两点之间有多条路由可用，分组交换可以选择最佳路由，并在故障时回退到备用路由。分组可以走网络中的任意路径（也可以走不同路径），然后由接收节点重新组装。丢失的分组可以重传，乱序的分组可以重新排序。\n\
  \n与电路交换网络不同，分组交换网络使未使用的带宽可供其他连接使用。这使得分组交换网络在成本上比电路交换网络更具优势。\n\n##### 服务质量\n\n让未使用的带宽可供其他应用程序使用带来了一个挑战：当所有带宽都被消耗时会发生什么？哪些应用程序“获胜”（获得所需带宽）？这在电路交换网络中不是问题，因为应用程序拥有专用电路或信道的独占访问权。\n\
  \n\n\n\n分组交换网络可能会使用服务质量来让特定流量优先于其他流量。例如：QoS 常应用于 IP 语音流量（通过分组交换数据网络传输语音），以避免电话通话中断。对时间不那么敏感的流量，如\
  \ SMTP（简单邮件传输协议，一种用于在服务器间交换电子邮件的存储转发协议），通常会获得较低优先级。与电话掉线相比，交换电子邮件时的微小延迟不太容易被察觉。\n\
  \n### 分层设计\n\nOSI 和 TCP/IP 等网络模型均采用分层设计。每一层执行特定功能，且该功能的复杂性被封装在其层内。一层的变更不会直接影响另一层：例如，将物理网络连接从有线改为无线（第\
  \ 1 层，如下所述）不会对 Web 浏览器（第 7 层）产生任何影响。\n\n### 模型与协议栈\n\n*网络模型*是对网络协议套件如何运作的描述，例如 OSI\
  \ 模型或 TCP/IP 模型。*网络协议栈*是用软件或硬件实现的网络协议套件。例如，TCP/IP 模型描述了 TCP/IP，而你的笔记本电脑运行的是 TCP/IP\
  \ 协议栈。\n\n#### OSI 模型\n\nOSI（开放系统互联）参考模型是一种分层网络模型。该模型是抽象的：我们不会直接在系统中运行 OSI 模型（大多数现在使用\
  \ TCP/IP 模型）；它被用作参考点，因此“第 1 层”（物理层）被普遍理解，无论你运行的是以太网还是 ATM 等。本书中的“第 X 层”均指 OSI 模型。\n\
  \nOSI 模型共有七层，如表 5.1 所示。各层可按自顶向下或自底向上顺序列出。采用后者（自底向上）依次为：*物理层*、*数据链路层*、*网络层*、*传输层*、*会话层*、*表示层*和*应用层*。\n\
  \n表 5.1\n\nOSI 模型。\n\n| ![t05-02-9780443187346](img/t05-02-9780443187346.jpg) |\n\
  \n| --- |\n\n> **注意**\n>\n> OSI 模型由国际标准化组织（ISO）开发，因此一些资料容易令人困惑地称其为 ISO 模型，甚至 ISO\
  \ OSI 模型。该模型正式名称为“X.200：信息技术——开放系统互联——基本参考模型。”\n>\n> X.200 推荐标准可在 <https://www.itu.int/rec/T-REC-X.200-199407-I/en>\
  \ 免费下载。“OSI 模型”这一术语最为通用，因此本书采用该术语。\n\n##### 第 1 层——物理层\n\n物理层是 OSI 模型的第 1 层。第 1\
  \ 层描述数据单元，如由能量（如光、电或无线电波）表示的*比特*，以及用于承载它们的介质（如铜缆或光纤）。无线局域网也有物理层，尽管我们无法亲手触摸它。\n\n\
  *细缆*、*粗缆*和非屏蔽双绞线（UTP）等布线标准存在于第 1 层，此外还有许多其他标准。第 1 层设备包括集线器和中继器。\n\n##### 第 2 层——数据链路层\n\
  \n数据链路层处理对物理层的访问以及局域网通信。*以太网*网卡及其 *MAC（介质访问控制）* 地址位于第 2 层，交换机和网桥也是如此。\n\n第 2 层分为两个子层：介质访问控制（MAC）和逻辑链路控制（LLC）。MAC\
  \ 子层负责在物理层与上层之间传输数据。LLC 子层处理局域网通信。MAC 子层接触第 1 层，LLC 子层接触第 3 层。\n\n##### 第 3 层——网络层\n\
  \n网络层描述路由：将数据从一个局域网上的系统移动到另一个局域网上的系统。IP 地址和路由器存在于第 3 层。第 3 层协议包括 IPv4 和 IPv6 等。\n\
  \n##### 第 4 层——传输层\n\n传输层处理分组排序、流量控制和错误检测。TCP 和 UDP 是第 4 层协议。\n\n第 4 层提供多种功能，如重发或重新排序分组。利用这些功能是协议实现的决策。稍后我们将看到，*TCP*\
  \ 利用这些功能，但以速度为代价。许多此类功能未在 *UDP* 中实现，后者选择速度而非可靠性。\n\n##### 第 5 层——会话层\n\n会话层管理会话，为连接提供维护。通过网络挂载文件共享需要多个维护会话，如远程过程调用（RPC）；这些位于会话层。记忆会话层功能的好方法是“应用程序之间的连接”。会话层使用单工、半双工和全双工通信。\n\
  \n> **注意**\n>\n> 传输层和会话层经常被混淆。例如，“连接维护”是传输层还是会话层的问题？分组在传输层排序，网络文件共享可在会话层重新挂载：你可能认为两者都是维护。像“维护”这样的词暗示的工作量比分组排序或重传更大：它需要“更繁重的工作”，如重新挂载已卸载的网络共享，因此会话层是最佳答案。\n\
  \n##### 第 6 层——表示层\n\n表示层以可理解的方式向应用程序（和用户）呈现数据。表示层概念包括数据转换、字符集（如 ASCII）和图像格式（如 GIF\
  \ [图形交换格式]、JPEG [联合图像专家组] 和 TIFF [标记图像文件格式]）。\n\n##### 第 7 层——应用层\n\n应用层是你与计算机应用程序交互的地方。你的\
  \ Web 浏览器、文字处理器和即时通讯客户端存在于第 7 层。Telnet 和 FTP 协议是应用层协议。\n\n> **注意**\n>\n> 存在许多助记符帮助记忆\
  \ OSI 模型。自底向上，“Please Do Not Throw Sausage Pizza Away”（物理 数据链路 网络 传输 会话 表示 应用）有点傻，但这让它更容易记忆。同样傻的还有：“Please\
  \ Do Not Tell Sales People Anything。”自顶向下，“All People Seem To Need Data Processing”也很流行。\n\
  \n#### TCP/IP 模型\n\nTCP/IP 模型（传输控制协议/互联网协议）是由 DARPA 在 20 世纪 70 年代创建的一种流行网络模型（更多信息请参见\
  \ <https://www.internetsociety.org/internet/history-internet/brief-history-internet/>）。TCP/IP\
  \ 是非正式名称（因最先创建的两个协议而得名）；正式名称是互联网协议套件。TCP/IP 模型比 OSI 模型更简单，如表 5.2 所示。\n\n表 5.2\n\n\
  OSI 模型与 TCP/IP 模型对比。\n\n| ![t05-03-9780443187346](img/t05-03-9780443187346.jpg)\
  \ |\n\n| --- |\n\n虽然 TCP 和 IP 名列前茅，但 TCP/IP 实际上是一个协议套件，除许多其他协议外，还包括 UDP（用户数据报协议）和\
  \ ICMP（互联网控制消息协议）。\n\n> **注意**\n>\n> TCP/IP 层的名称和数量是一个备受争议的话题，许多“权威”来源彼此意见不一。令人困惑的是，一些来源用链路层代替网络接入层，用网络层代替互联网层。本书遵循考试《候选人信息公告》中列出的\
  \ TCP/IP 参考资料所描述的惯例，例如 Chris Lewis 编著的《Cisco TCP/IP Routing Professional Reference》（McGraw-Hill）。\n\
  \n##### 网络接入层\n\n\n\n\n# TCP/IP 模型层\n\n##### 网络接入层\n\nTCP/IP 模型的网络接入层结合了 OSI 模型的第\
  \ 1 层（物理层）和第 2 层（数据链路层）。它描述了第 1 层的问题，如能量、比特以及用于承载它们的介质（铜缆、光纤、无线等）。它还描述了第 2 层的问题，例如将比特转换为协议单元，如以太网帧、`MAC`（媒体访问控制）地址和网络接口卡（`NIC`）。\n\
  \n##### 网际层\n\nTCP/IP 模型的网际层与 OSI 模型的第 3 层（网络层）对齐。这是 IP 地址和路由所在的层。当数据从一个 LAN 上的节点传输到另一个不同\
  \ LAN 上的节点时，将使用网际层。`IPv4`、`IPv6`、`ICMP` 和路由协议（以及其他）是网际层的 TCP/IP 协议。\n\n> **考试警告**\n\
  >\n> OSI 模型的第 3 层称为“网络层”。不要将 OSI 的第 3 层与 TCP/IP 的“网络接入”层混淆，后者与 OSI 模型的第 1 层和第 2\
  \ 层对齐。\n\n##### 主机到主机传输层\n\n*主机到主机传输层*（有时称为“主机到主机”，或更常见地仅称为“传输层”；本书将使用“传输层”）将网际层连接到应用层。这是通过端口在网络上对应用程序进行寻址的地方。`TCP`\
  \ 和 `UDP` 是 TCP/IP 的两个传输层协议。\n\n##### 应用层\n\nTCP/IP 应用层结合了 OSI 模型的第 5 层到第 7 层（会话层、表示层和应用层）。这些协议大多采用客户端-服务器架构，其中客户端（如\
  \ `ssh`）连接到监听的服务器（在 UNIX 系统上称为守护进程），如 `sshd`。客户端和服务器使用 `TCP` 或 `UDP`（有时两者都用）作为传输层协议。TCP/IP\
  \ 应用层协议包括 `SSH`、`Telnet` 和 `FTP` 等。\n\n#### 封装\n\n*封装*从上层获取信息并向其添加首部，将上层信息视为数据。常言道：“一层的首部是另一层的数据”[\\\
  [2\\]](#Ch005_225-293_B9780443187346000039.xhtml#bb0015)。例如，当数据向下移动通过协议栈时，应用层数据被封装在一个第\
  \ 4 层 TCP *段*中。该 TCP 段被封装在一个第 3 层 IP *包*中。该 IP 包被封装在一个第 2 层以太网 *帧*中。然后在第 1 层将帧转换为比特并发送到本地网络。数据、段、包、帧和比特都是协议数据单元（`PDU`）的示例。\n\
  \n> **注意**\n>\n> 助记符“SPF10”有助于记忆 PDU：段、包、帧、1 和 0。\n\n封装的逆过程称为解复用（有时称为解封装）。当 PDU\
  \ 向上移动通过协议栈时，比特被转换为以太网帧，帧被转换为 IP 包，包被转换为 TCP 段，段被转换为应用数据。\n\n### 网络接入、网际和传输层协议与概念\n\
  \nTCP/IP 是一个协议套件，包括（但不限于）：网际层的 `IPv4` 和 `IPv6`；传输层的 `TCP` 和 `UDP`；以及众多高层协议，包括 `Telnet`、`FTP`、`SSH`\
  \ 等。让我们专注于从网络接入层到传输层的低层协议。一些协议（如 `IP`）完美地归属于某一层（网际层）。其他协议（如地址解析协议 `ARP`）有助于将一层连接到另一层（在\
  \ `ARP` 的情况下是网络接入层到网际层）。\n\n#### MAC 地址\n\n媒体访问控制（`MAC`）地址是以太网网络接口卡（`NIC`）的唯一硬件地址，通常在出厂时“烧录”在其中。MAC\
  \ 地址可以通过软件进行更改。\n\n> **注意**\n>\n> 烧录的 MAC 地址应当是唯一的。现实中存在例外情况，通常是由于 NIC 制造商的失误，但在考试中硬件\
  \ MAC 地址被视为唯一。\n\n历史上，MAC 地址长 48 位。它们分为两半：前 24 位构成组织唯一标识符（`OUI`），后 24 位构成序列号（正式称为扩展标识符）。\n\
  \n制造 NIC 的组织（如 Cisco、Juniper、HP、IBM 等）从电气电子工程师学会（`IEEE`）注册管理局购买 24 位 OUI。注册 OUI\
  \ 列表可在 <https://standards.ieee.org/products-programs/regauth/> 获取。\n\n例如，Juniper\
  \ 拥有 OUI `00-05-85`。任何以 `00:05:85` 开头 MAC 地址的 NIC 都是 Juniper 的 NIC。然后 Juniper 可以基于其\
  \ OUI 分配 MAC 地址：第一个将是 MAC 地址 `00:05:85:00:00:00`，第二个 `00:05:85:00:00:01`，第三个 `00:05:85:00:00:02`，以此类推。此过程持续直到该\
  \ OUI 的序列号耗尽。然后需要一个新的 OUI。\n\n##### EUI-64 MAC 地址\n\n`IEEE` 创建了用于 64 位 MAC 地址的 EUI-64（扩展唯一标识符）标准。OUI\
  \ 仍为 24 位，但序列号为 40 位。与 48 位地址相比，这允许有更多的 MAC 地址。*IPv6 自动配置*兼容这两种类型的 MAC 地址。\n\n####\
  \ IPv4\n\n*IPv4* 是互联网协议第 4 版，通常称为“IP”。它是互联网的基础协议，设计于 20 世纪 70 年代，旨在为美国国防部高级研究计划局（`DARPA`）支持分组交换网络。IPv4\
  \ 用于 ARPAnet，后者后来演变成了互联网。\n\nIP 是一种简单的协议，旨在跨网络传输数据。它非常简单，以至于需要一个称为 `ICMP` 的“辅助协议”（见下文）。IP\
  \ 是无连接且不可靠的：它提供数据包的“尽力而为”交付。如果需要连接和可靠性，必须由 IP 承载的高层协议（如 `TCP`）来提供。\n\nIPv4 使用 32\
  \ 位的源地址和目的地址，通常以“点分四组”格式显示，如 `192.168.2.4`。32 位地址字段允许 2³² 个地址，即近 43 亿个地址。在人类（及其设备）数量超过可用\
  \ IPv4 地址的世界中，IPv4 地址短缺是一个根本性问题：这是导致 IPv6 诞生的因素之一，后者使用大得多的 128 位地址。\n\n##### 关键\
  \ IPv4 首部字段\n\n如 图 5.1 所示，IP 首部长 20 字节（无选项时），包含多个字段。关键字段包括：\n\n*   **版本**：IP 版本（IPv4\
  \ 为 4）\n*   **IHL**：IP 首部长度\n*   **服务类型**：最初用于设置数据包优先级，但现在用于区分服务（`DiffServ`），一种提供服务质量（`QoS`）的方法\n\
  *   **标识、标志、片偏移**：用于 IP 分片\n*   **生存时间**：用于终止路由环路\n*   **协议**：嵌入协议（代表 `TCP`、`UDP`\
  \ 等的协议号）\n*   **源和目的 IP 地址**\n*   **选项**：选项和填充\n\n![图 5.1 IPv4 首部 [3]。](images/B9780443187346000039/f05-01-9780443187346.jpg)\n\
  \n图 5.1 IPv4 首部 [\\[3\\]](#Ch005_225-293_B9780443187346000039.xhtml#bb0020)。\n\n\
  ##### IP 分片\n\n如果数据包超过网络的最大传输单元（`MTU`），路径上的路由器可能会对其进行分片。MTU 是网络上最大的 PDU 大小。分片将大数据包分解为多个较小的数据包。IP\
  \ 数据包的典型 MTU 大小为 1500 字节。IP 标识字段（`IPID`）用于重新关联分片后的数据包（它们将具有相同的 IPID）。标志用于确定是否允许分片，以及是否还有更多分片到来。片偏移给出当前分片携带的数据偏移量：“从偏移量\
  \ 1480 开始复制此数据。”\n\n\n\n\n###### 路径 MTU 发现\n\n路径 MTU 发现利用分片来发现网络路径上允许的最大数据包大小。发送一个设置了\
  \ `DF`（不分片）标志的大数据包。如果路由器的 MTU 小于数据包大小，它会尝试分片，发现无法分片，然后丢弃该数据包，并发送一个“需要分片但设置了 DF 标志”的\
  \ ICMP 消息。发送节点随后发送越来越小的、设置了 `DF` 标志的数据包，直到它们能干净利落地通过网络路径。\n\n#### IPv6\n\nIPv6 是\
  \ IPv4 的继任者，具有更大的地址空间（128 位地址，而 IPv4 为 32 位）、更简单的路由和更简单的地址分配。IPv4 地址枯竭是导致 IPv6 诞生的主要因素。\n\
  \n自微软 Vista 操作系统发布以来，IPv6 变得更加普遍，Vista 是第一个支持 IPv6 并默认启用它的微软客户端操作系统。一直到 Windows\
  \ 11 的所有版本都沿用了这一做法。其他现代操作系统，如 OS X、Linux 和 UNIX，也默认启用 IPv6。\n\n> **注意**\n>\n> IPv6\
  \ 地址空间为 2¹²⁸，非常大：真的非常大。总共有超过 340 穰（undecillion）个 IPv6 地址，这是一个十进制 39 位的数字：340,282,366,920,938,463,463,374,607,431,768,211,456。IPv4\
  \ 只有不到 43 亿个地址，这是一个十进制 10 位的数字：4,294,967,296。如果所有 43 亿个 IPv4 地址加起来重 1 千克，那么所有 IPv6\
  \ 地址将重 79,228,162,514,264,337,593,543,950,336 千克，相当于 13,263 个地球的质量。另一个有用的比较：如果所有\
  \ IPv4 地址能装进一个高尔夫球，那么所有 IPv6 地址几乎能装满太阳。\n\n如图 5.2 所示，IPv6 头部比 IPv4 更大且更简单。字段包括：\n\
  \n*   **版本**：IP 版本（IPv6 为 6）\n*   **通信量类和流标签**：用于 QoS（服务质量）\n*   **净荷长度**：IPv6 数据的长度（不包括\
  \ IPv6 头部）\n*   **下一个头部**：下一个嵌入的协议头部\n*   **跳数限制**：用于终止路由环路\n\n![图 5.2 IPv6 头部 [4]。](images/B9780443187346000039/f05-02-9780443187346.jpg)\n\
  \n图 5.2 IPv6 头部 [[4]](#Ch005_225-293_B9780443187346000039.xhtml#bb0025)。\n\n#####\
  \ IPv6 地址和无状态自动配置\n\nIPv6 主机可以无状态地自动配置唯一的 IPv6 地址，从而省去了静态寻址或 DHCP 的需求。IPv6 无状态地址自动配置（SLAAC）获取主机的\
  \ MAC 地址并用其来配置 IPv6 地址。图 5.3 中的 `ifconfig`（接口配置）输出显示 MAC 地址为硬件地址（HWAddr）`00:0c:29:ef:11:36`。\n\
  \n![图 5.3 显示 MAC 地址和 IPv6 地址的“ifconfig”输出。](img/f05-03-9780443187346.jpg)\n\n图 5.3\
  \ 显示 MAC 地址和 IPv6 地址的“ifconfig”输出。\n\nIPv6 地址长 128 位，使用冒号而非句点来分隔段。一串连续的零可以压缩为两个冒号（`::`）。图\
  \ 5.3 中的“ifconfig”输出显示了两个 IPv6 地址：\n\n*   `fc01::20c:29ff:feef:1136/64`（作用域：全局）\n\
  *   `fe80::20c:29ff:feef:1136/64`（作用域：链路）\n\n第一个地址（`fc01::…`）是“全局”（可路由）地址，用于本地网络以外的通信。IPv6\
  \ 主机依赖 IPv6 路由通告来分配全局地址。在图 5.3 中，本地路由器发送了 `fc01` 网络的路由通告，主机利用它来配置其全局地址。\n\n第二个地址（`fe80::…`）是链路本地地址，仅用于本地网络通信。系统独立分配链路本地地址，无需\
  \ IPv6 路由器通告。即使没有任何集中式 IPv6 基础设施（如发送 IPv6 路由通告的路由器），任何 IPv6 系统也会分配一个链路本地地址，并可使用该地址与\
  \ LAN 上的其他链路本地 IPv6 地址通信。\n\n`/64` 是 CIDR 格式的网络大小：见下文“无类别域间路由”一节。这意味着网络前缀长 64 位：完整的全局前缀为\
  \ `fc01:0000:0000:0000`。\n\n图 5.3 中的主机使用以下过程无状态地配置其全局地址：\n\n*   获取 MAC 地址：`00:0c:29:ef:11:36`\n\
  *   在中间两字节嵌入“fffe”常量：`00:0c:29:ff:fe:ef:11:36`\n*   设置“通用位”：`02:0c:29:ff:fe:ef:11:36`\n\
  *   添加网络前缀并转换为“:”格式：`fc01:0000:0000:0000:020c:29ff:feef:1136`\n*   将一串连续的零转换为“::”：`fc01::20c:29ff:feef:1136`\n\
  \n此过程如表 5.3 所示。\n\n表 5.3\n\nIPv6 地址无状态自动配置。\n\n| ![t05-01-9780443187346](img/t05-01-9780443187346.jpg)\
  \ |\n\n| --- |\n\n在表 5.3 所示的添加前缀步骤中（灰色显示），只有一个连续的零序列可以用 `::` 来汇总。添加“fffe”常量是为了将\
  \ 48 位 MAC 地址扩展为 64 位。对 64 位嵌入式 MAC 地址的支持确保了无状态自动配置过程与 EUI-64 MAC 地址兼容。通用/本地（U/L）位用于确定\
  \ MAC 地址是否唯一。我们的 MAC 地址是唯一的，因此设置了 U/L 位。\n\n无状态自动配置消除了对 DHCP（*动态主机配置协议*，见下文“BOOTP\
  \ 和 DHCP”部分）的需求，但 DHCP 可用于 IPv6：这称为“有状态自动配置”，是 DHCPv6 的一部分。IPv6 更大的地址空间也使得 NAT（见下文“网络地址转换”）变得没有必要，但已提出各种\
  \ IPv6 NAT 方案，主要是为了更容易地从 IPv4 过渡到 IPv6。\n\n无状态自动配置引发了隐私担忧：系统的硬件 MAC 地址设计为全局唯一，将其嵌入\
  \ IPv6 地址允许进行跟踪，无论其位于哪个网络。SLAAC 现在支持隐私扩展，即生成临时的随机主机地址，且地址频繁变更。\n\n请注意，系统可以是“双栈”的，同时使用\
  \ IPv4 和 IPv6，如图 5.3 所示。该系统使用 IPv6，同时也拥有 IPv4 地址 `192.168.2.122`。主机也可能通过 IPv4 访问\
  \ IPv6 网络；这称为隧道技术。另一个值得注意的 IPv6 地址是环回地址：`::1`。这相当于 IPv4 地址 `127.0.0.1`。\n\n#####\
  \ IPv6 安全挑战\n\nIPv6 解决了许多问题，包括增加足够的地址空间和自动配置，使路由变得更简单。但其中一些解决方案（如自动配置）可能会引入安全问题。\n\
  \n一个启用了 IPv6 的系统将自动配置一个链路本地地址（以 `fe80:…` 开头），而无需任何其他启用 IPv6 的基础设施。该主机可以与同一 LAN 上的其他链路本地地址通信。即使管理员不知道\
  \ IPv6 正在他们的网络上流动，这也是成立的。\n\nISP 也在启用 IPv6 服务，有时客户并不知情。现代网络工具，如网络入侵检测系统，可以“看到” IPv6，但通常未配置为这样做。而且许多网络专业人员对\
  \ IPv6 的经验或理解有限。从攻击者的角度来看，这可能提供一个绝佳的机会，通过 IPv6 发起攻击或窃取数据。\n\n\n\n\n所有非必需的网络服务都应禁用：这是系统加固的基本组成部分。如果不需要\
  \ IPv6，应将其禁用。要在 Windows 主机上禁用 IPv6，请打开网络适配器并选择“属性”。然后取消勾选“Internet 协议版本 6”复选框，如\
  \ 图 5.4 所示。\n\n![图 5.4 在 Windows 上禁用 IPv6。](img/f05-04-9780443187346.jpg)\n\n图 5.4\
  \ 在 Windows 上禁用 IPv6。\n\n##### 有类网络\n\n最初的 IPv4 网络（1993 年之前）是“有类的”，分为 A 类到 E 类。A\
  \ 类到 C 类用于正常网络用途。D 类为组播，E 类为保留。表 5.4 显示了每类的 IP 地址范围。\n\n表 5.4\n\n有类网络。\n\n| 类别 |\
  \ IP 范围 |\n| --- | --- |\n| A 类 | 0.0.0.0–127.255.255.255 |\n| B 类 | 128.0.0.0–191.255.255.255\
  \ |\n| C 类 | 192.0.0.0–223.255.255.255 |\n| D 类（组播） | 224.0.0.0–239.255.255.255\
  \ |\n| E 类（保留） | 240.0.0.0–255.255.255.255 |\n\n有类网络缺乏灵活性：用于普通终端主机的网络只有三种规模：16,777,216\
  \ 个地址（A 类）、65,536 个地址（B 类）和 256 个地址（C 类）。最小的可路由有类网络是拥有 256 个地址的 C 类网络：使用有类网络的可路由点对点链路需要在两点之间建立一个网络，浪费了\
  \ 250 多个 IP 地址。\n\n##### 无类域间路由\n\n无类域间路由（CIDR）允许比有类地址更灵活的网络规模。CIDR 允许超出任意有类网络规模的许多网络尺寸。\n\
  \nA 类网络 `10.0.0.0` 包含以 10 开头的 IP 地址：`10.1.2.3.4`、`10.187.24.8`、`10.3.96.223` 等。换句话说，`10.*`\
  \ 是一个 A 类地址。点分十进制 IPv4 地址的前 8 位是网络部分（10）；剩余的 24 位是主机地址：`3.96.223`，即上例中的最后一个 IP 地址。A\
  \ 类网络的 CIDR 表示法为此用 `/8`：`10.0.0.0/8`。“/8”是网络掩码，意味着网络部分长 8 位，为主机留出 24 位。\n\n同样，`192.0.2.0`\
  \ 的 C 类网络包含任何以 `192.0.2` 开头的 IP 地址：`192.0.2.177`、`192.0.2.253` 等。该 C 类网络在 CIDR 格式中为\
  \ `192.0.2.0/24`：前 24 位（`192.0.2`）描述网络；剩余 8 位（上例中的 `177` 或 `253`）描述主机。\n\n一旦网络用\
  \ CIDR 表示法描述，就可以有更多可路由的网络规模。需要 128 个 IP 地址？将一个 C 类（`/24`）对半分，得到两个 `/25` 网络。需要 64\
  \ 个 IP 地址？将一个 `/24` 网络四等分，得到四个拥有 64 个 IP 地址的 `/26` 网络。\n\n##### RFC 1918 寻址\n\n\
  *RFC 1918 地址* 是私有 IPv4 地址，可用于不通过互联网路由的内部流量。这允许节约稀缺的 IPv4 地址：无数内部网可以使用相同的重叠 RFC 1918\
  \ 地址。为此划分了三个 IPv4 地址块：\n\n*   `10.0.0.0–10.255.255.255` (`10.0.0.0/8`)\n*   `172.16.0.0–172.31.255.255`\
  \ (`172.16.0.0/12`)\n*   `192.168.0.0–192.168.255.255` (`192.168.0.0/16`)\n\n任何使用未转换的\
  \ RFC 1918 地址作为目标的公共互联网连接都将失败：这些网络没有公共路由。发送带有未转换的 RFC 1918 源地址的互联网流量将永远无法返回。使用有类术语，`10.0.0.0/8`\
  \ 网络是一个 A 类网络，`172.16.0.0/12` 网络是 16 个连续的 B 类网络，而 `192.168.0.0/16` 是 256 个 C 类网络。\n\
  \nRFC 1918 地址用于节约供应短缺的公共 IPv4 地址。RFC 代表“征求意见”，是一种在互联网上讨论和发布标准的方式。关于 RFC 1918 的更多信息请访问\
  \ [`www.rfc-editor.org/rfc/rfc1918.txt`](https://www.rfc-editor.org/rfc/rfc1918.txt)。\n\
  \n> **注意**\n>\n> 考试通常不要求记忆 RFC 编号；RFC 1918 地址是这一规则的例外。考试旨在测试信息安全通用语言的知识。“RFC 1918\
  \ 地址”一词在网络专业人员中常用，信息安全专业人员应予以理解。\n\n##### 网络地址转换\n\n*网络地址转换*（NAT）用于转换 IP 地址。它常用于将\
  \ RFC 1918 地址从内部网传递到互联网时进行转换。如果您想知道如何使用配置了私有 RFC 1918 地址的 PC 浏览公共 Web，NAT 是一种答案（代理是另一种）。\n\
  \nNAT 有三种类型：静态 NAT、地址池 NAT（也称为动态 NAT）和端口地址转换（PAT，也称为 NAT 过载）。静态 NAT 在地址之间进行一对一转换，例如\
  \ `192.168.1.47 → 192.0.2.252`。地址池 NAT 在地址池中预留多个公共 IP 地址，例如 `192.0.2.10 → 192.0.2.19`。地址可从池中分配，随后归还。最后，PAT\
  \ 通常将多个私有地址多对一转换为一个公共 IP 地址，例如 `192.168.1.*` 到 `192.0.2.20`。PAT 是家庭和小型办公室的常见解决方案：多个内部设备（如笔记本电脑、台式机和移动设备）共享一个公共\
  \ IP 地址。表 5.5 总结了 NAT 类型的示例。\n\n表 5.5\n\nNAT 类型。\n\n| ![t05-04-9780443187346](img/t05-04-9780443187346.jpg)\
  \ |\n| --- |\n\nNAT 隐藏了数据包的来源：源地址是 NAT 网关（通常是路由器或防火墙），而非主机本身。这提供了一些有限的安全优势：针对系统\
  \ NAT 转换地址的攻击通常会针对 NAT 网关，而非最终主机。这种保护有限，绝不应被视为主要安全控制。始终需要纵深防御。\n\nNAT 可能会导致更改 IP\
  \ 地址或在上层（如 TCP/IP 的数据层）包含 IP 地址的应用程序和协议出现问题。IPsec、VoIP 和主动 FTP 等协议均受影响。\n\n#####\
  \ ARP 和 RARP\n\n*ARP* 是地址解析协议，用于在第二层 MAC 地址和第三层 IP 地址之间进行转换。ARP 通过询问“谁拥有 IP 地址 192.168.2.140，请告诉我”将\
  \ IP 解析为 MAC 地址。ARP 回复示例为“192.168.2.140 位于 00:0c:29:69:19:66”。\n\n```\narp who-has\
  \ 192.168.2.140 tell 192.168.2.4\narp reply 192.168.2.140 is-at 00:0c:29:69:19:66\n\
  ```\n\n> **注意**\n>\n> ARP 等协议非常“信任”他人：攻击者可能利用这一点，通过伪造 ARP 响应来劫持流量。任何本地系统都可能响应 ARP\
  \ 请求，包括攻击者。这可能导致 ARP 缓存投毒攻击，受害系统缓存指向恶意系统的虚假 ARP 条目。ARP 缓存投毒常用于中间人（MitM）攻击，攻击者频繁投毒关键系统（如默认网关）的\
  \ ARP 条目，将流量重定向到攻击者的系统。\n>\n> 出于此原因，安全网络应考虑硬编码 ARP 条目。\n\n*RARP* 曾被旧式无盘工作站用于确定其\
  \ IP 地址。节点询问“谁拥有 MAC 地址 00:40:96:29:06:51，请告诉 00:40:96:29:06:51”。\n\n```\nARP, Reverse\
  \ Request who-is 00:40:96:29:06:51 tell 00:40:96:29:06:51\n```\n\n换句话说，RARP 询问：“我是谁？请告诉我。”RARP\
  \ 服务器会响应节点的 IP 地址。\n\n##### 单播、组播和广播流量\n\n\n\n\n###### 单播、多播和广播\n\n**单播** 是一对一流量，例如客户端浏览网页。**多播**\
  \ 是一对多，且“多”是预先选定的。**广播** 是局域网上的一对所有。\n\n**多播** 流量在 IPv4 中使用“D 类”地址。节点被放入多播组。常见的多播应用是流式音频或视频。通过单播发送\
  \ 1000 个音频流将需要大量带宽，因此使用多播。它的工作原理类似于一棵树：初始流是树干，多播组的每个成员是一片叶子。一个流从流媒体服务器发出，当它到达拥有通往多播组中节点的多条路由的路由器时，会在网络上分支。多播通常使用\
  \ UDP。\n\n###### 受限广播地址和定向广播地址\n\n**广播** 流量发送给局域网上的所有站点。IPv4 广播地址有两种类型：受限广播和定向广播。受限广播地址是\
  \ `255.255.255.255`。之所以称为“受限”，是因为它永远不会被路由器转发，这与定向广播不同。\n\n`192.0.2.0/24` 网络的定向（也称为网络定向）广播地址是\
  \ `192.0.2.255`（地址的主机部分在二进制中全为“1”，即 255）。之所以称为“定向”广播，是因为发往这些地址的流量可能来自远程网络（可以被“定向”发送）。\n\
  \n###### 第 2 层广播流量\n\n第 2 层广播流量到达“广播域”内的所有节点。同一局域网（或 VLAN）上的设备处于同一广播域中。以太网广播地址是\
  \ MAC 地址 `FF:FF:FF:FF:FF:FF`：发送到以太网交换机上该地址的流量将被所有连接的节点接收。\n\n###### 混杂网络访问\n\n访问网段上的所有单播流量需要“**混杂**”网络访问。网络入侵检测系统\
  \ (NIDS) 等系统需要混杂网络访问，以便监控网络上的所有流量。网络节点通常只能“看到”直接发送给它们的单播流量。访问发送给其他节点的单播流量需要两样东西：配置为混杂模式的网络接口卡\
  \ (NIC) 以及访问网段上其他单播流量的能力。\n\n将 NIC 置于混杂模式通常需要超级用户访问权限，例如 UNIX 系统上的 `root` 用户。交换机等设备提供流量隔离，因此每个主机将只接收发送给它的单播流量（除了广播和多播流量）。正如我们在后面章节将看到的，**集线器**、交换机\
  \ SPAN 端口或 TAP 通常用于提供混杂网络访问。\n\n#### TCP\n\nTCP 是传输控制协议，一种可靠的第 4 层协议。TCP 使用三次握手在网络上创建可靠连接。TCP\
  \ 可以对乱序到达的段进行重新排序，并重传丢失的段。\n\n##### 关键 TCP 首部字段\n\n如 图 5.5 所示，TCP 首部长度为 20 字节（无选项时），包含多个字段。重要字段包括：\n\
  \n*   **源端口和目的端口**\n*   **序列号和确认号**：保持全双工通信同步\n*   **TCP 标志**\n*   **窗口大小**：在收到确认前可发送的数据量\n\
  \n![图 5.5 TCP 首部 [5]。](images/B9780443187346000039/f05-05-9780443187346.jpg)\n\n\
  图 5.5 TCP 首部 [[5]](#Ch005_225-293_B9780443187346000039.xhtml#bb0030)。\n\n##### TCP\
  \ 端口\n\nTCP 从源端口连接到目的端口，例如从源端口 `51178` 到目的端口 `22`。TCP 端口字段为 16 位，允许端口号从 `0` 到 `65535`。\n\
  \n端口分为两类：**保留端口** 和 **临时端口**。保留端口为 `1023` 或更低；临时端口为 `1024`–`65535`。大多数操作系统要求超级用户权限才能打开保留端口。任何用户均可打开（未使用的）临时端口。\n\
  \n常见服务（如 HTTP）使用知名端口。互联网号码分配局 (IANA) 在 [`www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xhtml`](https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xhtml)\
  \ 维护一份知名端口列表。大多数 Linux 和 UNIX 系统在 `/etc/services` 中有一份较小的知名端口列表。\n\n##### 套接字对\n\
  \n**套接字** 是一个节点上 IP 地址与 TCP 或 UDP 端口的组合。**套接字对** 描述两个节点之间的唯一连接：源端口、源 IP、目的端口和目的\
  \ IP。图 5.6 中的 `netstat` 输出显示了源 IP `192.168.80.144`、TCP 源端口 `51178` 与目的 IP `192.168.2.4`、目的\
  \ TCP 端口 `22` 之间的套接字对。\n\n![图 5.6 TCP 套接字对。](img/f05-06-9780443187346.jpg)\n\n图\
  \ 5.6 TCP 套接字对。\n\n套接字可以“监听”（等待连接）；监听套接字在 图 5.6 中显示为 `127.0.0.1:631`。连接期间，套接字对随后变为“已建立”。你可能拥有从同一主机（如\
  \ `192.168.80.144`）到同一主机（`192.168.2.4`），甚至到同一端口（`22`）的多个连接。操作系统和路由器等中间设备能够因套接字对而保持这些连接的唯一性。在前面的例子中，两个来自相同源\
  \ IP 且发往相同 IP/目的端口的连接将拥有不同的源端口，从而使套接字对（和连接）唯一。\n\n##### TCP 标志\n\n最初的六个 TCP 标志是：\n\
  \n*   **URG**：数据包包含紧急数据\n*   **ACK**：确认收到的数据\n*   **PSH**：将数据推送至应用层\n*   **RST**：复位（拆除）连接\n\
  *   **SYN**：同步连接\n*   **FIN**：结束连接（优雅地）\n\n2001 年新增了两个 TCP 标志：**CWR**（拥塞窗口减小）和 **ECE**（显式拥塞通知回显），利用了\
  \ TCP 首部中以前保留的位。2003 年又新增了第三个标志：**NS**（Nonce Sum，随机数和）。这些标志用于管理网络路径上的拥塞（延迟）。所有 9\
  \ 个 TCP 标志如 图 5.7 所示。\n\n![图 5.7 九个 TCP 标志 [6]。](images/B9780443187346000039/f05-07-9780443187346.jpg)\n\
  \n图 5.7 九个 TCP 标志 [[6]](#Ch005_225-293_B9780443187346000039.xhtml#bb0035)。\n\n#####\
  \ TCP 握手\n\nTCP 使用三次握手建立可靠连接。连接是全双工的，双方相互同步 (SYN) 并确认 (ACK)。这四个标志的交换分三步完成：SYN、SYN-ACK、ACK，如\
  \ 图 5.8 所示。\n\n![图 5.8 TCP 三次握手。](img/f05-08-9780443187346.jpg)\n\n图 5.8 TCP 三次握手。\n\
  \n客户端选择一个初始序列号，设置在第一个 SYN 数据包中。服务端也选择自己的初始序列号，设置在 图 5.8 所示的 SYN/ACK 数据包中。双方通过将对方的序列号加\
  \ 1 来确认：这就是确认号。序列号和确认号的使用使双方能够检测丢失或乱序的段。\n\n连接建立后，通常每个段都会跟随 ACK。连接最终将以 RST（复位或拆除连接）或\
  \ FIN（优雅地结束连接）结束。\n\n#### UDP\n\n\n\n\n\n#### UDP\n\nUDP 是用户数据报协议，是 TCP 更简单、更快的“表亲”。UDP\
  \ 没有握手、会话或可靠性保证：因此它非正式地被称为“发送后祈祷”。与 TCP 默认 20 字节的头部相比，UDP 拥有更简单、更短的 8 字节头部（如 图 5.9\
  \ 所示）。UDP 头部字段包括源 IP、目的 IP、数据包长度（头部和数据）以及一个简单的（且可选的）校验和。如果使用校验和，它将为 UDP 头部和数据提供有限的完整性保护。与\
  \ TCP 不同，数据通常会立即传输，在第一个 UDP 数据包中完成。UDP 工作在第 4 层。\n\n![图 5.9 UDP 头部 [7]。](images/B9780443187346000039/f05-09-9780443187346.jpg)\n\
  \n图 5.9 UDP 头部 [\\[7\\]](#Ch005_225-293_B9780443187346000039.xhtml#bb0040)。\n\n\
  UDP 通常用于“可容忍丢包”的应用程序（能够处理一定的数据包丢失），例如流式音频和视频。它也用于查询-响应应用程序，例如 DNS 查询。\n\n#### ICMP\n\
  \nICMP 是互联网控制消息协议，一种辅助协议，用于辅助第 3 层（IP，参见注释）。ICMP 用于排查故障和报告错误状况：如果没有 ICMP 协助，IP 在面对路由环路、端口、主机或网络宕机等情况时将会失败。与\
  \ TCP 和 UDP 不同，ICMP 没有端口的概念，而是使用类型和代码。常用的 ICMP 类型包括回显请求和回显应答（用于 ping）以及传输过程中生存时间超时（用于\
  \ traceroute）。\n\n> **注意**\n>\n> “哪个协议运行在哪一层”通常是激烈争论的主题。我们称之为“归桶游戏”。例如，ICMP 应该归入哪个桶：第\
  \ 3 层还是第 4 层？ICMP 头部位于第 4 层，就像 TCP 和 UDP 一样，所以许多人会回答“第 4 层”。另一些人则认为 ICMP 是第 3 层协议，因为它协助\
  \ IP（一种第 3 层协议），且没有端口。\n>\n> 这表明归桶游戏是多么随意：抓包显示 ICMP 头部位于第 4 层，因此许多网络工程师倾向于回答“第 4\
  \ 层”：永远不要与数据包争辩。许多路由协议也存在同样的争论：例如，BGP 用于第 3 层路由，但 BGP 本身由 TCP（和 IP）承载。本书将在正文和自测题中引用界限分明的归桶游戏协议/层，但避开模糊不清的例子（正如考试所应做的那样）。\n\
  \n##### Ping\n\n*Ping*（得名于用于“探测”潜艇的声纳）向节点发送 ICMP 回显请求并监听 ICMP 回显应答。Ping 的设计目的是确定节点是启动还是关闭。\n\
  \n在 ARPAnet 或早期互联网上，当防火墙不常见（或不存在）时，Ping 是节点状态的可靠指示器。如今，ICMP 回显应答是节点处于启动状态的一个相当可靠的指示器。攻击者利用\
  \ ICMP 绘制目标网络拓扑，因此许多站点会过滤诸如回显请求和回显应答之类的 ICMP 类型。\n\n无应答的 ping（发出 ICMP 回显请求但未收到回显应答）并不意味着主机已关闭。节点可能已关闭，也可能节点已启动，但回显请求或回显应答可能在某处被过滤了。\n\
  \n##### Traceroute\n\n*traceroute* 命令利用 ICMP 时间超时消息来追踪网络路由。正如在讨论 IP 时所述，生存时间字段用于避免路由环路：每当数据包经过一个路由器，路由器就会递减\
  \ TTL 字段。如果 TTL 降为零，路由器将丢弃该数据包，并向原始发送者发送一个 ICMP 时间超时消息。\n\nTraceroute 巧妙地利用了这一 TTL\
  \ 特性。假设客户端距离服务器四跳：客户端的 traceroute 客户端发送一个 TTL 为 1 的数据包给服务器。路由器 A 将 TTL 递减为 0，丢弃数据包，并向客户端发送一个\
  \ ICMP 时间超时消息。路由器 A 由此被识别。\n\n随后客户端发送一个 TTL 为 2 的数据包给服务器。路由器 A 将 TTL 递减为 1 并将数据包转发给路由器\
  \ B。路由器 B 将 TTL 递减为 0，丢弃数据包，并向客户端发送一个 ICMP 时间超时消息。路由器 B 由此被识别。此过程持续进行，直到到达服务器，如\
  \ 图 5.10 所示，从而识别出路径上的所有路由器。\n\n![图 5.10 Traceroute。](img/f05-10-9780443187346.jpg)\n\
  \n图 5.10 Traceroute。\n\n大多数 traceroute 客户端（如 UNIX 和 Cisco）发送 UDP 数据包作为出站包。出站数据包会被丢弃，因此协议类型无关紧要。Windows\
  \ `tracert` 客户端发送 ICMP 数据包作为出站包；图 5.11 显示了 Windows `tracert` 通往 [www.syngress.com](http://www.syngress.com)\
  \ 的路由输出。这两种客户端类型通常每跳发送三个数据包（图 5.11 输出中的三列“ms”）。\n\n![图 5.11 Windows tracert 通往 www.syngress.com。](img/f05-11-9780443187346.jpg)\n\
  \n图 5.11 Windows tracert 通往 [www.syngress.com](http://www.syngress.com)。\n\n###\
  \ 应用层 TCP/IP 协议与概念\n\nTCP/IP 应用层存在大量协议，该层融合了 OSI 模型的会话层、表示层和应用层。\n\n#### Telnet\n\
  \nTelnet 提供网络上的终端仿真。“终端”意指基于文本的 VT100 风格终端访问。Telnet 服务器监听 TCP 端口 23。Telnet 曾是通过网络访问交互式命令\
  \ Shell 的标准方式，延续了 20 多年。\n\nTelnet 的弱点在于它不提供机密性；Telnet 会话期间传输的所有数据均为明文，包括用于向系统认证的用户名和密码。能够嗅探网络流量的攻击者可通过这种方式窃取认证凭据。\n\
  \nTelnet 也只有有限的完整性：拥有网络写入权限的攻击者可以篡改数据，甚至劫持 Telnet 会话。安全 Shell（SSH）提供安全认证、机密性和完整性，是\
  \ Telnet 的推荐替代品。\n\n#### FTP\n\nFTP 是文件传输协议，用于向服务器传输文件或从服务器下载文件。与 Telnet 一样，FTP\
  \ 既无机密性也无完整性，不应用于通过不安全信道传输敏感数据。\n\n> **注意**\n>\n> 当讨论 Telnet 和 FTP 等不安全协议时，“无机密性”这类陈述假设它们使用默认设置，且未进行额外加固或加密（例如通过\
  \ IPsec VPN 隧道使用它们）。您可以通过在加密 VPN 隧道上运行 Telnet 或 FTP，或用 SSH 替代它们等方式来缓解缺乏机密性的问题。此外，“无完整性”意味着应用层几乎没有或完全没有完整性保护：某些完整性可能由较低层（如传输层）提供。\n\
  \nFTP 使用两个端口：控制连接（发送命令的地方）是 TCP 端口 21；“主动 FTP”使用的数据连接（传输数据的地方）源自 TCP 端口 20。以下是两个套接字对（接下来的两个示例使用任意临时端口）：\n\
  \n*   客户端:1025 → 服务器:21（控制连接）\n*   服务器:20 → 客户端:1026（数据连接）\n\n请注意，数据连接源自服务器，方向与控制通道相反。这打破了经典的客户端-服务器数据流向。因此，许多防火墙会阻断主动\
  \ FTP 的数据连接，导致主动 FTP 失效。被动 FTP 通过保持所有通信均从客户端发向服务器来解决此问题：\n\n*   客户端:1025 → 服务器:21（控制连接）\n\
  *   客户端:1026 → 服务器:1025（数据连接）\n\nFTP 服务器告知客户端要连接的监听数据连接端口；客户端随后发起第二个连接。被动 FTP 更有可能顺利穿越防火墙，因为它符合经典的客户端-服务器流向。\n\
  \n#### TFTP\n\n\n\n\n\n#### TFTP\n\n**TFTP** 是简单文件传输协议，运行在 UDP 端口 69 上。它提供了一种更简单的文件传输方式，常用于保存路由器配置，或由无盘工作站通过网络进行“引导”（下载操作系统）。\n\
  \nTFTP 没有认证或目录结构：文件从一个目录读取和写入，通常称为 `/tftpboot`。也没有机密性或完整性。与 Telnet 和 FTP 一样，TFTP\
  \ 不建议用于通过不安全通道传输敏感数据。\n\n#### SSH\n\nSSH 旨在作为 Telnet、FTP 和 UNIX “R” 命令（`rlogin`、`rshell`\
  \ 等）的安全替代品。除其他功能外，它还提供机密性、完整性和安全认证。SSH 包含用于传输文件的 SFTP (SSH FTP) 和 SCP (Secure Copy)。SSH\
  \ 还可用于安全地隧道传输其他协议，如 HTTP。默认情况下，SSH 服务器监听 TCP 端口 22。\n\nSSH 版本 1 是最初版本，后来被发现容易受到中间人攻击。SSH\
  \ 版本 2 是该协议的当前版本，建议优于 SSHv1、Telnet 或 FTP 等使用。\n\n#### SMTP、POP 和 IMAP\n\n**SMTP**\
  \ 是简单邮件传输协议，用于在服务器之间传输电子邮件。SMTP 服务器监听 TCP 端口 25。**POP**v3（邮局协议）和 **IMAP**（互联网消息访问协议）用于客户端-服务器电子邮件访问，分别使用\
  \ TCP 端口 110 和 143。\n\n#### DNS\n\n**DNS** 是域名系统，一个分布式的全球层级数据库，可将名称转换为 IP 地址，反之亦然。DNS\
  \ 同时使用 TCP 和 UDP：简短回答使用 UDP 端口 53；大量回答（如区域传输）使用 TCP 端口 53。\n\n两个核心 DNS 函数是 `gethostbyname()`\
  \ 和 `gethostbyaddr()`。给定一个名称（如 `www.syngress.com`），`gethostbyname()` 返回一个 IP 地址，如\
  \ `192.0.2.187`。给定一个地址（如 `192.0.2.187`），`gethostbyaddr()` 返回名称 `www.syngress.com`。\n\
  \n权威名称服务器为给定域内的名称提供“权威”解析。递归名称服务器将尝试解析其尚不知晓的名称。缓存名称服务器将暂时缓存先前解析过的名称。\n\n##### DNS\
  \ 弱点\n\nDNS 对大多数请求使用不可靠的 UDP 协议，且原生 DNS 不提供认证。DNS 的安全性依赖于 16 位源端口和 16 位 DNS 查询 ID。能够盲目猜测这两个数字的攻击者可以伪造\
  \ UDP DNS 响应。\n\nDNS 缓存投毒攻击是指试图欺骗缓存 DNS 服务器缓存伪造的响应。如果 `bank.example.com` 位于 `192.0.2.193`，而\
  \ `evil.example.com` 位于 `198.18.8.17`，攻击者可能会尝试通过发送伪造响应“`bank.example.com` 位于 `198.18.8.17`”来投毒\
  \ DNS 服务器的缓存。如果缓存 DNS 名称服务器接受了虚假响应，它将对后续的 `bank.example.com` 请求返回投毒后的响应（直到记录过期）。\n\
  \n##### DNSSEC\n\n**DNSSEC**（域名系统安全扩展）通过使用公钥加密为 DNS 响应提供认证和完整性。请注意，DNSSEC 不提供机密性：它的作用类似于\
  \ DNS 响应的数字签名。\n\n构建互联网规模的公钥基础设施是一项艰巨的任务，因此 DNSSEC 的采用进展缓慢。安全研究员 Dan Kaminsky 于\
  \ 2008 年公开了一种改进的 DNS 缓存投毒攻击，这引发了对更广泛采用 DNSSEC 的新呼吁。有关改进的缓存投毒攻击和防御的更多详细信息，请参阅 `https://www.kb.cert.org/vuls/id/800113`。\n\
  \n##### DoT 和 DoH\n\n**DNS over TLS (DoT)** 和 **DNS over HTTPS (DoH)** 是两种竞争标准，它们通过\
  \ TLS 传输并加密 DNS 流量。DoT 使用专用端口（TCP 端口 853），而 DoH 使用 TCP 端口 443 上的 HTTPS。与 DNSSEC\
  \ 不同，两者都在客户端解析器与 DoT 或 DoH 服务器之间提供机密性。DoH 赢得了更大的市场份额，目前在美国 Firefox 中默认使用。\n\n####\
  \ SNMP\n\n**SNMP** 是**简单网络管理协议**，主要用于监控网络设备。MRTG 等网络监控软件使用 SNMP 轮询网络设备上的 SNMP 代理，并报告接口状态（启用/禁用）、带宽利用率、CPU\
  \ 温度等众多指标。SNMP 代理使用 UDP 端口 161。\n\nSNMPv1 和 v2c 使用读写团体字符串访问网络设备。许多设备使用默认团体字符串，如“public”用于读访问，“private”用于写访问。此外，这些团体字符串通常很少更改（甚至从不更改），且通常在网络中以明文形式传输。能够嗅探或猜测团体字符串的攻击者可以通过\
  \ SNMP 访问网络设备。对写字符串的访问允许远程更改设备，包括关闭或重新配置接口等许多其他选项。\n\nSNMPv3 旨在通过加密为 SNMP 提供机密性、完整性和认证。虽然\
  \ SNMPv2c 的使用仍然非常普遍，但由于之前所有版本缺乏安全性，强烈建议使用 SNMPv3。\n\n#### HTTP 和 HTTPS\n\n**HTTP**\
  \ 是超文本传输协议，用于传输未加密的基于 Web 的数据。**HTTPS**（超文本传输安全协议）通过 SSL/**TLS**（见下文“SSL 和 TLS”部分）传输加密的基于\
  \ Web 的数据。HTTP 使用 TCP 端口 80，HTTPS 使用 TCP 端口 443。**HTML**（超文本标记语言）用于显示 Web 内容。\n\n\
  > **注意**\n>\n> HTTP 和 HTML 经常被混淆。区别在于：你通过 HTTP 传输 Web 数据，通过 HTML 查看它。\n\n#### BOOTP\
  \ 和 DHCP\n\n**BOOTP** 是引导协议，用于无盘系统通过网络进行引导。许多系统 BIOS 现在直接支持 BOOTP，允许 BIOS 在没有磁盘的情况下通过网络加载操作系统。BOOTP\
  \ 启动分两个阶段进行：使用 BOOTP 确定 IP 地址和操作系统镜像名称，然后使用 TFTP 下载操作系统。\n\n**DHCP**（动态主机配置协议）旨在通过添加额外功能来替换和改进\
  \ BOOTP。DHCP 允许更多配置选项，并为系统分配临时 IP 地址租约。DHCP 系统可配置为接收 IP 地址租约、DNS 服务器和默认网关等信息。\n\n\
  BOOTP 和 DHCP 都使用相同的端口：服务器使用 UDP 端口 67，客户端使用 UDP 端口 68。\n\n### 传输介质\n\n传输介质包括传输比特的第\
  \ 1 层技术：网络布线和无线技术。我们现在讨论布线，稍后在本章讨论无线。OSI 模型中最简单的部分是你可以触摸的部分：第 1 层的网络电缆。了解常用的布线类型及其各自的优缺点非常重要。\n\
  \n需要理解的基本网络布线术语包括 EMI、噪声、串扰和衰减。**电磁干扰 (EMI)** 是由电产生的磁性引起的干扰。网络电缆上任何不需要的信号（如 EMI）称为噪声。**串扰**\
  \ 是指信号从一根电缆串扰到另一根电缆。**衰减** 是指信号随离源头距离增加而减弱。\n\n#### 双绞线布线\n\n**非屏蔽双绞线 (UTP)** 网络布线（如\
  \ `图 5.12` 所示）使用绞合在一起的线对。所有电流都会产生磁场；将两根传输方向相反的电流的导线（如发送和接收）绞合在一起可以抵消磁场。这使得双绞线布线对\
  \ EMI 的敏感度较低。\n\n\n\n\n\n![图 5.12 UTP 电缆。来源：https://upload.wikimedia.org/wikipedia/commons/c/cb/UTP_cable.jpg。图片作者：Baran\
  \ Ivo。图片遵循知识共享许可](img/f05-12-9780443187346.jpg)\n\n图 5.12 UTP 电缆。来源：[`upload.wikimedia.org/wikipedia/commons/c/cb/UTP_cable.jpg`](https://upload.wikimedia.org/wikipedia/commons/c/cb/UTP_cable.jpg)。图片作者：Baran\
  \ Ivo。图片遵循知识共享许可\n\n双绞线电缆根据额定速度按类别分类。更紧密的绞合可带来更强的阻尼效果：专为千兆网络设计的 6 类 UTP 电缆，其绞合程度远高于用于快速以太网的\
  \ 3 类电缆。屏蔽双绞线 (STP) 在每对导线周围增加了额外的金属屏蔽层。这使得 STP 电缆更不易受 EMI 干扰，但也更硬、更昂贵。表 5.6 总结了各类别布线的类型和速度。\n\
  \n表 5.6\n\n类别布线速度。\n\n| 类别 | 速度 |\n| --- | --- |\n| Cat 3 | 10 Mbps |\n| Cat 4 |\
  \ 16 Mbps |\n| Cat 5 | 100 Mbps |\n| Cat 5e | 1 Gbps |\n| Cat 6 | 1+ Gbps |\n| Cat\
  \ 6a | 10 Gbps |\n| Cat 7 | 10–100 Gbps |\n\n请注意，Cat 3、Cat 4 和 Cat 5 是传统标准（Cat 1\
  \ 和 Cat 2 从未正式标准化）。Cat 5e 和 Cat 6 在长达 100 米的距离内均以 1000 Mbps（即 1 Gbps）运行，但 Cat 6\
  \ 可在长达 55 米的距离内以 10 Gbps 运行。Cat 6a 可在长达 100 米的距离内以 10 Gbps 运行。Cat 7 可在长达 100 米的距离内以\
  \ 10 Gbps 运行，但在长达 15 米的距离内可以 100 Gbps 运行。\n\n#### 同轴电缆布线\n\n*同轴* 网络电缆如 图 5.13 所示，具有一个内部铜芯（标记为“D”），通过绝缘层（标记为“C”）与金属编织层或屏蔽层（标记为“B”）分隔。外层为塑料护套（标记为“A”）。绝缘层防止芯线接触金属屏蔽层，否则会造成电路短路。同轴电缆常用于卫星和有线电视服务。\n\
  \n![图 5.13 同轴电缆。来源：https://commons.wikimedia.org/wiki/File:RG-59.jpg。图片作者：Arj。图片遵循知识共享许可。](img/f05-13-9780443187346.jpg)\n\
  \n图 5.13 同轴电缆。来源：[`commons.wikimedia.org/wiki/File:RG-59.jpg`](https://commons.wikimedia.org/wiki/File:RG-59.jpg)。图片作者：Arj。图片遵循知识共享许可。\n\
  \n同轴电缆使用的芯线和屏蔽层比其他电缆类型（如双绞线）更粗、绝缘更好。这使得同轴电缆对 EMI 的抵抗力更强，并且与双绞线电缆相比，支持更高的带宽和更长的连接距离。\n\
  \n两种较旧的同轴电缆类型是细缆和粗缆，用于以太网总线网络。\n\n#### 光纤网络电缆\n\n*光纤网络电缆*（简称为“光纤”）利用光传输信息，可承载海量信息。光纤可用于长距离传输：超过\
  \ 50 英里，远超双绞线或同轴电缆等任何铜缆。光纤的优势在于速度、距离和对 EMI 免疫。劣势包括成本和复杂性。\n\n多模光纤使用多种光模式（路径），导致光色散。单模光纤使用单根光纤，光在光纤中心沿单一模式（路径）传播。多模光纤用于较短距离；单模光纤用于长途、高速网络。\n\
  \n通过波分复用 (WDM)，可在同一根光纤中传输多个信号，利用多种光“颜色”在同一根光纤中传输不同的信息通道。当 WDM 用于承载每种颜色 10 Gbps 的信号时，组合速度可达每秒\
  \ 1 Tbps 以上。\n\n### LAN 技术与协议\n\n局域网概念聚焦于第 1-3 层技术，如网络布线类型、物理和逻辑网络拓扑、以太网等。\n\n####\
  \ 以太网\n\n*以太网* 是一种主导的局域网技术，通过帧传输网络数据。它最初使用物理总线拓扑，但后来增加了对物理星型拓扑的支持。以太网描述第 1 层问题（如物理介质）和第\
  \ 2 层问题（如帧）。以太网是基带（单信道）的，因此必须解决冲突等问题，即两个节点尝试同时传输数据。\n\n以太网已从使用“细缆”或“粗缆”同轴电缆的 10\
  \ Mbps 总线演变而来。基于星型的物理层使用双绞线电缆，速度范围从 10 Mbps 到 1000 Mbps 及以上。这些类型的汇总列于 表 5.7。\n\n\
  表 5.7\n\n以太网类型。\n\n| 名称 | 类型 | 速度 | 最大距离 |\n| --- | --- | --- | --- |\n| 10Base2\
  \ \"细缆\" | 总线 | 10 Mbps | 185 米 |\n| 10Base5 \"粗缆\" | 总线 | 10 Mbps | 500 米 |\n|\
  \ 10BaseT | 星型 | 10 Mbps | 100 米 |\n| 100BaseT | 星型 | 100 Mbps | 100 米 |\n| 1000BaseT\
  \ | 星型 | 1000 Mbps | 100 米 |\n\n##### CSMA\n\n*载波监听多路访问* (CSMA) 旨在解决冲突问题。以太网是基带媒体，相当于“共用线路”。在早期电话服务中，许多人家里没有专用电话线：他们与邻居共用一条共用线路。一种使用共用电话线的协议应运而生：\n\
  \n1. 拿起听筒并监听，以确定线路是否空闲\n2. 如果线路不空闲，挂断并等待一段时间后再试\n3. 如果线路空闲，拨号\n\n以太网 CSMA 的工作方式相同，但有一种状态未被考虑：两个邻居同时拿起听筒并监听线路是否在用。听到无声后，两人同时拨号。他们的通话“冲突”了：通话完整性被破坏。CSMA\
  \ 旨在解决冲突。\n\n带冲突检测的载波监听多路访问 (CSMA/CD) 用于立即检测网络中的冲突。其步骤如下：\n\n1. 监控网络以查看是否空闲\n2.\
  \ 如果网络不空闲，等待随机一段时间\n3. 如果网络空闲，发送数据\n4. 发送过程中，监控网络\n5. 如果接收到的电信号多于发送的，说明另一站点也在发送\n\
  \   1. (a) 发送干扰信号，通知所有节点停止发送\n   2. (b) 等待随机一段时间后重传\n\nCSMA/CD 用于可同时发送和接收的系统，如有线以太网。CSMA/CA（冲突避免）用于无法同时发送和接收的系统，如\
  \ 802.11 无线网络。CSMA/CA 依赖于接收接收站的确认：若未收到确认，则必定发生了冲突，节点将等待并重传。CSMA/CD 优于 CSMA/CA，因为冲突检测几乎能立即发现冲突。\n\
  \n### LAN 物理网络拓扑\n\n物理网络拓扑在本地描述第 1 层：电缆如何物理铺设。多年来出现过许多流行的物理拓扑；其中许多（如总线和环形）已随着星型拓扑成为主流而逐渐淡出。\n\
  \n### 传统 LAN 拓扑\n\n\n\n\n\n#### 物理拓扑\n\n##### 总线与环形（传统技术）\n\n物理**总线**将网络节点串联连接。每个节点在数据沿总线传输时对其进行检查。Ethernet\
  \ Thinnet 和 Thicknet 属于总线技术。物理**环形**将网络节点连成一个环：如果你沿着电缆从一个节点走到另一个节点，最终会回到起点。FDDI（光纤分布式数据接口）是一种局域网环形技术。所有这些都被视为已被星型拓扑取代的传统局域网技术。\n\
  \n##### 星型\n\n**星型**拓扑已成为局域网的主导物理拓扑。星型被以太网采用（以太网最初仅支持总线）。每个节点直接连接到一个中心设备，如集线器或交换机，如图\
  \ 5.14 所示。\n\n![图 5.14 星型拓扑。](img/f05-14-9780443187346.jpg)\n\n图 5.14 星型拓扑。\n\n\
  星型具有更好的容错性：任何单根本地电缆切断或网卡故障仅影响一个节点。由于每个节点都布线回中心点，因此与总线（一根电缆串联连接节点）相比需要更多电缆。这种成本劣势通常被容错优势所抵消。\n\
  \n##### 网状\n\n**网状**拓扑将网络节点相互互联。图 5.15 展示了两种网状网络。左侧为全连接网状，四台 Web 服务器相互互联。右侧为部分连接网状：每个节点与网状有多个连接，但并非每个节点都连接到其他所有节点。\n\
  \n![图 5.15 全连接和部分连接网状拓扑。](img/f05-15-9780443187346.jpg)\n\n图 5.15 全连接和部分连接网状拓扑。\n\
  \n网状拓扑具有卓越的可用性，常用于高可用（HA）服务器集群。图 5.15 左侧所示的四台 Web 服务器均可分担 Web 流量负载并相互维护状态信息。如果网状中的任意一台\
  \ Web 服务器宕机，其余服务器仍保持运行以承担流量负载。\n\n### 广域网技术与协议\n\nISP 和其他“长途”网络提供商（其网络跨越城市到国家）通常使用广域网技术。我们大多数人都有配置局域网技术的实操经验，例如连接\
  \ Cat5 网线；但亲自构建广域网的经验较少。\n\n#### T1、T3、E1、E3\n\n存在多种国际电路标准：最普遍的是 T 载波（美国）和 E 载波（欧洲）。\n\
  *   **T1** 是一条专用的 1.544 Mbps 电路，承载二十四个 64-bit DS0（数字信号 0）信道（如 24 路电路交换电话呼叫）。注意术语\
  \ DS1（数字信号 1）和 T1 常互换使用。DS1 描述比特流（通过任意介质，如铜缆、光纤、无线）；T1 是承载 DS1 的铜质电话电路。\n*   **T3**\
  \ 是 28 条捆绑的 T1，形成 44.736 Mbps 电路。术语 T3 和 DS3（数字信号 3）也互换使用，区别同上。\n*   **E1** 是专用的\
  \ 2.048 Mbps 电路，承载 30 个信道；16 条 E1 组成一条 **E3**，速率为 34.368 Mbps。\n\n> **注意**\n>\n\
  > T1 和 T3 速率常近似为 1.5 Mbps 和 45 Mbps。本书将使用这些数值（也适用于考试简记）。超出考试范围的是电路帧开销所需的少量带宽。这就是为什么\
  \ 28 条 T1 × 1.544 Mbps = 43.232 Mbps，略低于 T3 的 44.736 Mbps。E1→E3 换算同理。\n\n**SONET**（同步光网络）通过光纤承载多条\
  \ T 载波电路。SONET 使用物理光纤环实现冗余。\n\n#### 帧中继\n\n**帧中继**是一种包交换的第 2 层广域网协议，不提供差错恢复，专注于速度。由帧中继承载的高层协议（如\
  \ TCP/IP）可用于提供可靠性。\n\n帧中继在单个物理连接上复用多个逻辑连接以创建虚拟电路；这种共享带宽模型是专用电路（如 T1）的替代方案。**PVC**（永久虚拟电路）始终保持连接，类似于真正的专用电路（如\
  \ T1）。交换虚拟电路（SVC）建立每次“呼叫”、传输数据，并在空闲超时后终止连接。帧中继通过数据链路连接标识符（DLCI，读作“delsee”）进行本地寻址。\n\
  \n#### X.25\n\n**X.25** 是一种较老的包交换广域网协议。在 1970 年代至 1990 年代初，X.25 提供了一种经济高效的长距离数据传输方式，当时另一种常见选择是通过模拟调制解调器直接拨号。随着互联网普及，X.25\
  \ 的流行度已下降。\n\n全球包交换 X.25 网络独立于基于 IP 的全球互联网。X.25 执行差错纠正，可能在长链路上增加延迟。它可承载其他协议（如 TCP/IP），但由于\
  \ TCP 自身提供可靠性，无需在 X.25 层也提供可靠性而额外损失性能。通常使用帧中继等其他协议承载 TCP/IP。\n\n#### ATM\n\n异步传输模式（ATM）是一种使用固定长度信元的广域网技术。ATM\
  \ 信元长 53 字节，包含 5 字节头部和 48 字节数据部分。\n\n与以太网相比，ATM 可提供可靠的网络吞吐量。“每秒能发送多少以太网帧”的答案是“视情况而定”。普通以太网帧大小从\
  \ 100 字节以下到 1500 字节以上不等。相比之下，所有 ATM 信元均为 53 字节。\n\n**SMDS**（交换多兆位数据服务）较早且类似于 ATM，也使用\
  \ 53 字节信元。\n\n#### MPLS\n\n多协议标签交换（MPLS）提供了一种通过标签在共享 MPLS 云网络中转发广域网数据的方式。这使 MPLS\
  \ 网络能承载多种网络流量，包括 ATM、帧中继、IP 等。转发决策基于标签，而非封装的头部数据（如 IP 头）。MPLS 可承载语音和数据，并用于简化广域网路由。假设\
  \ 12 个分支机构连接到一个数据中心。若使用 T1，数据中心需 12 条 T1 电路（每个分支一条）；使用 MPLS，数据中心和每个分支仅需一条连接接入 MPLS\
  \ 云。\n\n#### SDLC 和 HDLC\n\n同步数据链路控制（SDLC）是一种同步的第 2 层广域网协议，使用轮询传输数据。组合节点可充当主站或从站。SDLC\
  \ 仅支持 NRM 传输模式（见下文）。\n\n高级数据链路控制（HDLC）是 SDLC 的后继者。HDLC 增加了差错纠正和流量控制，以及两种额外模式（ARM\
  \ 和 ABM）。HDLC 的三种模式：\n\n*   **正常响应模式（NRM）**——从站仅在主站许可时才能发送\n*   **异步响应模式（ARM）**——从站可主动与主站发起通信\n\
  *   **异步平衡模式（ABM）**——组合模式，节点可充当主站或从站，无需许可即可发起传输\n\n### 融合协议\n\n“融合”是近期的网络热词。指通过以太网和\
  \ TCP/IP 提供工业控制、存储和语音等服务（这些服务通常通过非 IP 设备和网络交付）。\n\n#### DNP3\n\n\n\n\n\n##### 分布式网络协议\
  \ (DNP3)\n\n分布式网络协议 (DNP3) 提供了一种开放标准，主要用于能源领域，以实现不同供应商的 SCADA（数据采集与监视控制系统）和智能电网应用之间的互操作性。根据美国能源部的说法，“智能电网”通常是指人们用来将公用事业电力输送系统带入\
  \ 21 世纪的一类技术，利用基于计算机的远程控制和自动化。这些系统之所以成为可能，是因为双向通信技术和计算机处理技术已在其他行业使用了几十年。它们开始被用于电力网络，从发电厂和风力发电场一直到家庭和企业的电力消费者。它们为公用事业和消费者提供了许多好处——主要体现在电网以及能源用户的家庭和办公室的能源效率有了巨大提升\
  \ [\\[8\\]](#Ch005_225-293_B9780443187346000039.xhtml#bb0045)。\n\n一些协议（如 `SMTP`）适用于单层。`DNP3`\
  \ 是一种多层协议，可通过 `TCP/IP`（另一种多层协议）承载：“许多供应商提供的产品使用 `TCP/IP` 来传输 `DNP3` 报文，而非上述介质。链路层帧（我们尚未讨论）被嵌入\
  \ `TCP/IP` 数据包中。这种方法使 `DNP3` 能够利用互联网技术，并允许广泛分隔的设备之间进行经济高效的数据采集和控制” [\\[9\\]](#Ch005_225-293_B9780443187346000039.xhtml#bb0050)。\n\
  \n`DNP3` 近期的改进允许“安全认证”，这解决了原始规范中的一些问题，这些问题本可能允许例如欺骗攻击或重放攻击。`DNP3` 于 2010 年成为 IEEE\
  \ 标准，称为 `IEEE 1815-2010`（现已弃用）。它仅允许预共享密钥。`IEEE 1815-2012` 是当前标准；它支持公钥基础设施 (`PKI`)。\n\
  \n#### 存储协议\n\n`光纤通道过以太网` (`FCoE`) 和 `互联网小型计算机系统接口` (`iSCSI`) 都是存储区域网络 (`SAN`) 协议，它们提供了经济高效的方式，利用现有的网络基础设施技术和协议来连接存储。存储区域网络允许通过网络进行块级文件访问，就像直接连接的硬盘驱动器一样。请注意，光纤通道使用加拿大/英国的\
  \ \"fibre\" 拼写，而光纤电缆通常使用美式拼写 \"fiber\"。\n\n`FCoE` 利用了长期用于存储网络的光纤通道，但免除了对完全不同布线和硬件的要求。相反，`FCoE`\
  \ 可以通过标准以太网网络传输。在 `FCoE` 中，光纤通道的 `HBA`（主机总线适配器），历史上是连接存储的专用卡，可以与网络接口 (`NIC`) 结合，以实现规模经济。`FCoE`\
  \ 使用以太网，但不使用 `TCP/IP`。`光纤通道过 IP` (`FCIP`) 通过 `TCP/IP` 封装光纤通道帧。\n\n与 `FCoE` 一样，`iSCSI`\
  \ 是一种 `SAN` 协议，允许利用现有的网络基础设施和协议来连接存储。虽然 `FCoE` 仅使用以太网，但 `iSCSI` 利用 `TCP/IP` 套件的高层进行通信，并且可以像任何\
  \ IP 协议一样进行路由（`FCIP` 也是如此）。通过采用第 2 层（以太网）之外的协议，`iSCSI` 可以传输到本地网络之外。因此，`iSCSI` 甚至可以允许访问位于\
  \ `WAN` 另一端的存储。`iSCSI` 使用逻辑单元号 (`LUNs`) 来提供一种跨网络寻址存储的方式。`LUNs` 也可用于网络可访问存储的基本访问控制。\n\
  \n#### 虚拟 SAN\n\n存储区域网络历史上往往相当专有，并使用不易互操作的专用硬件和协议。尽管许多 `SAN` 实现现在利用 `FCoE`、`FCIP`\
  \ 或 `iSCSI` 等协议，这些协议允许融合传统网络技术和协议，但存储区域网络的可扩展性和安全性往往被证明是繁琐的。\n\n传统的存储安全方法通常需要在交换机或\
  \ `HBA` 上硬编码更改以实现访问控制。虚拟 `SAN` 的一种方法感觉类似于 `VLAN` 的交换概念，并试图允许一种概念上简化的 `SAN` 内部隔离方法。将虚拟\
  \ `SAN` 视为类似于 `VLAN` 的概念最常被网络供采用。\n\n虚拟 `SAN` 的概念不仅限于网络供应商的安全考量。近期对虚拟 `SAN` 一词的大量使用很大程度上侧重于“虚拟”这一方面。虚拟化供应商使用虚拟\
  \ `SAN` 一词，意指一种 `SAN` 方法，允许更快速地提供虚拟化存储。除了供应之外，虚拟化供应商还吹捧虚拟 `SAN` 作为一种利用虚拟化为存储区域网络提供更简单的线性扩展性的手段。\n\
  \n#### VoIP\n\n互联网协议语音 (`VoIP`) 通过数据网络传输语音，这是与模拟 `POTS`（普通老式电话服务）的根本性变革，后者使用了一百多年至今仍在使用。`VoIP`\
  \ 将分组交换网络的优势（如较低成本和弹性）带给了电话。\n\n最近，许多组织至少维护了两个不同的网络：一个电话网络和一个数据网络，每个网络都有相关的维护成本。随着组织进行大量投资，分组交换数据网络的可靠性不断提高。随着\
  \ `VoIP` 的出现，许多组织通过在分组交换网络上合并语音和数据服务来降低成本。\n\n常见的 `VoIP` 协议包括 `实时传输协议` (`RTP`)，旨在传输流式音频和视频。`VoIP`\
  \ 协议（如 `RTP`）依赖会话和信令协议，包括 `SIP`（`会话初始协议`，一种信令协议）和 `H.323`。`SRTP`（安全实时传输协议）可用于提供安全的\
  \ `VoIP`，包括机密性、完整性和安全认证。`SRTP` 使用 `AES` 实现机密性，使用 `SHA-1` 实现完整性。\n\n虽然 `VoIP` 可以提供引人注目的成本优势（特别是对于没有大量遗留语音投资的新站点），但存在安全顾虑。如果网络瘫痪，语音和网络数据都会中断。此外，不再有用于有线语音的真正“带外”信道。如果攻击者攻破了网络，他们可能能够破坏该网络上\
  \ `VoIP` 通话的机密性或完整性。许多 `VoIP` 协议（如 `RTP`）默认提供很少或没有安全性。在这种情况下，窃听 `VoIP` 通话就像使用 `Wireshark`\
  \ 等工具嗅探一样简单（一款高质量的免费网络协议分析器，见 <https://www.wireshark.org>），选择“Telephony → VoIP Calls”菜单，选择一个通话并按下“Player”，如\
  \ 图 5.16 所示。\n\n![图 5.16 Wireshark “VoIP Calls”。](img/f05-16-9780443187346.jpg)\n\
  \n图 5.16 Wireshark “VoIP Calls”。\n\n部署 `VoIP` 的组织必须通过对其数据网络进行充分投资，以及投资于支持所需的员工专业知识，来确保可靠性。在发生网络入侵时，请使用其他方法（如手机）进行带外通信。最后，通过不安全网络发送的任何\
  \ `VoIP` 流量都应通过 `SRTP` 或其他方法（如 `IPsec`）进行保护。切勿假设 `VoIP` 流量默认是安全的。\n\n#### 微分段\n\n\
  \n\n\n#### 微分段\n\n微分段描述了在所有系统之间进行过滤的过程，无论这些系统是物理的还是基于云的：“微分段是在数据中心和云环境中创建区域以将工作负载相互隔离并单独保护它们的一种方法。通过微分段，系统管理员可以基于零信任方法创建策略，以限制工作负载之间的网络流量。组织使用微分段来减少网络攻击面、改进入侵遏制并加强法规遵从性”（[`www.paloaltonetworks.com/cyberpedia/what-is-microsegmentation`](https://www.paloaltonetworks.com/cyberpedia/what-is-microsegmentation)）。\n\
  \n微分段是核心**零信任**（前文第 4 章，领域 3：安全架构与工程中已讨论）概念，并使用诸如`Software-Defined Networking (SDN)`、`Software-Defined\
  \ Wide Area Network (SD-WAN)`和`Virtual eXtensible Local Area Network (VXLAN)`等技术，下文将进行讨论。\n\
  \n#### 软件定义网络\n\n通过虚拟化和云服务，存储和计算正日益从传统的服务器和磁盘密集型数据中心中解耦。`Software-Defined Networking\
  \ (SDN)`寻求在组织网络方法上实现类似的范式转变。一个有助于理解的过度简化说法是，将`SDN`视为一种虚拟化网络并将网络从通常用于此目的的硬件中解耦的方法。\n\
  \n`Software-Defined Networking (SDN)`将路由器的控制平面与数据（转发）平面分离。控制平面做出路由决策。数据平面通过路由器转发数据（数据包）。有了`SDN`，路由决策是在远程做出的，而不是在每个单独的路由器上。\n\
  \n`SDN`的目标之一是允许微分段：灵活且可定制的网络能力。`SDN`的一个标志是有可能使用廉价的“白盒”网络硬件和开放协议来实现这种灵活性，而非传统的专有硬件、固件和软件。`SDN`的另一个常见目标是适应网络能力规则的动态实例化，当基础设施需要时即可生成。\n\
  \n该领域最知名的协议是`OpenFlow`，除其他功能外，它允许在中央控制器指定或更新交换规则的控制权。`OpenFlow`是一种使用`TLS`加密的`TCP`协议。\n\
  \n#### 软件定义广域网\n\n`Software-Defined Wide Area Network (SD-WAN)`将`Software-Defined\
  \ Networks`的概念扩展到云端。它使用多种网络技术的组合，包括`MPLS`、蜂窝网络和宽带：*软件定义广域网(SD-WAN)是一种虚拟 WAN 架构，允许企业利用任意组合的传输服务——包括\
  \ MPLS、LTE 和宽带互联网服务——来安全地将用户连接到应用程序。SD-WAN 使用集中控制功能，跨 WAN 安全且智能地直接引导流量至受信任的 SaaS\
  \ 和 IaaS 提供商。这提高了应用程序性能并提供高质量的用户体验，从而提高业务生产力和敏捷性并降低 IT 成本* [\\[10\\]](#Ch005_225-293_B9780443187346000039.xhtml#bb0055)。\n\
  \n`SD-WAN`可以为任何用户或应用程序自动提供最佳连接：“SD-WAN 允许网络基于集中管理的角色和规则路由流量，无论流量的入口和出口点是什么，并提供全方位的安全性。例如，如果分支机构的用户正在使用\
  \ Office365 工作，SD-WAN 可以将其流量直接路由到该应用最近的云数据中心，提高用户的网络响应速度并降低企业的带宽成本” [\\[11\\]](#Ch005_225-293_B9780443187346000039.xhtml#bb0060)。\n\
  \n#### 虚拟可扩展局域网\n\n`Virtual eXtensible Local Area Network (VXLAN)`将`VLANs`（虚拟局域网，本章后文讨论）的概念扩展到云端。`VLAN`支持\
  \ 4096 个段 ID（或 VLAN），限制了其在大规模云部署中的使用。`VXLAN`支持 1600 万个段 ID（因此得名“eXtensible/可扩展”），允许全球规模部署。`VXLAN`通过`UDP\
  \ port 4789`封装数据；封装和解封装由`VTEPs`（虚拟隧道端点）完成。\n\nJuniper 对`VXLANS`的描述：\n\n*VXLAN 是一种技术，允许您对网络进行分段（就像\
  \ VLAN 一样），但也解决了 VLAN 的扩展限制，并提供了 VLAN 无法提供的优势。使用 VXLAN 的一些重要优势包括：*\n\n*   • *您理论上可以在一个管理域中创建多达\
  \ 1600 万个 VXLAN（相比之下 VLAN 只有 4094 个）。*\n*   • *VXLAN 提供了云构建者所需规模的网络分段，以支持大量租户。*\n\
  *   • *使用传统的第 2 层网络，您受限于第 2 层边界，被迫创建大型或地理跨度大的第 2 层域。VXLAN 的功能允许您在数据中心内部或之间动态分配资源，并通过在第\
  \ 3 层网络上建立隧道传输流量，实现存在于不同第 2 层域中的服务器之间的虚拟机迁移* [\\[12\\]](#Ch005_225-293_B9780443187346000039.xhtml#bb0065)。\n\
  \n### 无线局域网\n\n`Wireless Local Area Networks (WLANs)`通过电磁波（如无线电波）或光传输信息。历史上，无线数据网络非常不安全，往往依赖于（认为）攻击流量的机密性或完整性很困难。这种认知通常是错误的。最常见的无线数据网络形式是`802.11`无线标准，而提供合理安全性的第一个`802.11`标准是`802.11i`。\n\
  \n#### DoS 与可用性\n\n`WLANs`无法保证可用性。具有物理邻近性的攻击者可以发起多种拒绝服务攻击，包括简单地用噪声污染无线频谱。如果您将`CIA\
  \ 三要素`视为一张三条腿的凳子，“无线安全”就缺了一条腿。需要可靠网络的关键应用应使用有线连接。\n\n#### 非授权频段\n\n“频段”是一小段连续的无线电频谱。`Industrial,\
  \ Scientific, and Medical (ISM)`频段被划出供无证使用，这意味着您无需从`Federal Communications Commission\
  \ (FCC)`等组织获取许可证即可使用它们。许多无线设备，如无绳电话、`802.11`无线网络和`Bluetooth`都使用`ISM`频段。不同国家使用不同的`ISM`频段：国际上常用的两个`ISM`频段是\
  \ 2.4 GHz 和 5 GHz。\n\n#### FHSS、DSSS 和 OFDM\n\n`Frequency Hopping Spread Spectrum\
  \ (FHSS)`和`Direct Sequence Spread Spectrum (DSSS)`是通过无线电频段发送流量的两种方法。某些频段，如 2.4 GHz\
  \ `ISM`频段，可能受到相当严重的干扰污染：`Bluetooth`、某些无绳电话、某些`802.11`无线网络、婴儿监视器，甚至微波炉都可能向该频段发射信号或造成干扰。`DSSS`和`FHSS`均旨在最大化吞吐量，同时最小化干扰的影响。\n\
  \n`DSSS`一次性使用整个频段，将信号“扩展”至整个频段。`FHSS`使用频段中的多个小频率信道，并按伪随机顺序在这些信道间“跳频”。\n\n`Orthogonal\
  \ Frequency-Division Multiplexing (OFDM)`是一种较新的复用方法，允许使用多个相互独立、互不干扰的无线频率进行同时传输。\n\
  \n#### 802.11\n\n\n\n\n##### 802.11 无线标准\n\n802.11 无线拥有许多标准，使用各种频率和速度。最初的模式简称为 802.11（有时称为\
  \ `802.11-1997`，基于其创建年份），它使用 2.4 GHz 频率，运行速度为 2 兆比特每秒（Mbps）；很快就被 `802.11b` 取代，后者速度为\
  \ 11 Mbps。`802.11g` 设计为与 802.11b 设备向后兼容，使用 2.4 GHz 频率提供高达 54 Mbps 的速度。`802.11a`\
  \ 提供相同的最高速度，但使用 5 GHz 频率。\n\n`802.11n` 同时使用 2.4 和 5 GHz 频率，并能配合多输入多输出（MIMO）技术使用多根天线。这使得速度高达\
  \ 600 Mbps。`802.11ac` 仅使用 5 GHz 频率，提供高达 1.3 Gbps 的速度。最后，`802.11ax` 使用 2.4、5 和 6\
  \ GHz 频段，提供高达 10 Gbps 的速度。表 5.8 总结了主要的 802.11 无线类型。\n\n###### 表 5.8：802.11 无线类型\n\
  \n| 类型 | 最高速度 | 频率 |\n| :--- | :--- | :--- |\n| 802.11 | 2 Mbps | 2.4 GHz |\n| 802.11a\
  \ | 54 Mbps | 5 GHz |\n| 802.11b | 11 Mbps | 2.4 GHz |\n| 802.11g | 54 Mbps | 2.4\
  \ GHz |\n| 802.11n | 72–600 Mbps | 2.4 和/或 5 GHz |\n| 802.11ac | 422 Mbps–1.3 Gbps\
  \ | 5 GHz |\n| 802.11ax | 高达 10 Gbps | 2.4、5 和/或 6 GHz |\n\n2.4 GHz 频率可能非常拥挤：一些无绳电话和婴儿监视器使用该频率，蓝牙和其他一些无线设备也是如此。微波炉会干扰\
  \ 2.4 GHz 设备。5 GHz 频率通常不那么拥挤，且干扰通常比 2.4 GHz 少。由于 5 GHz 频率更高、波长更短，其穿透墙壁和其他障碍物的能力不如波长更长的\
  \ 2.4 GHz 信号好。6 GHz（由 802.11ax 即 Wi-Fi 6 使用）甚至更不拥挤。\n\n##### 无线网卡操作模式\n\n802.11\
  \ 无线网卡可在四种模式下运行：`managed`（托管/客户端模式）、`master`（主/基础设施模式）、`ad hoc`（自组网模式）和 `monitor\
  \ mode`（监听模式）。\n\n802.11 无线客户端以托管模式（也称为客户端模式）连接到接入点。连接后，客户端仅与接入点通信；它们无法直接与其他客户端通信。\n\
  \n主模式（也称为基础设施模式）是无线接入点使用的模式。处于主模式的无线网卡只能与处于托管模式的已连接客户端通信。\n\n自组网模式是一种无中心接入点的对等模式。通过有线网卡连接到互联网的计算机可能会发布一个自组网\
  \ WLAN 以允许共享互联网。\n\n最后，监听模式是一种用于嗅探 WLAN 的只读模式。\n\n##### SSID 和 MAC 地址过滤\n\n802.11\
  \ WLAN 使用服务集标识符（SSID），它充当网络名称。无线客户端在加入该 WLAN 之前必须知道 SSID，因此 SSID 是一个配置参数。SSID 通常会被广播；出于安全考虑，某些\
  \ WLAN 配置为禁用 SSID 广播。依赖 SSID 的保密性是一种糟糕的安全策略：处于监听模式的无线嗅探器可以检测到客户端加入 WLAN 时使用的 SSID；即使禁用了\
  \ SSID 广播，这一点依然成立。\n\n另一种常见的 802.11 无线安全预防措施是通过过滤无线 MAC 地址来限制客户端访问，仅允许受信任的客户端。这提供的安全性有限。MAC\
  \ 地址在 802.11 WLAN 上以明文形式暴露；受信任的 MAC 地址可被嗅探，攻击者可通过软件将不受信任的设备重新配置为受信任的 MAC 地址。随后，攻击者可以等待受信任设备离开网络（或对受信任设备发起\
  \ DoS 攻击），然后使用受信任的 MAC 地址加入网络。\n\n##### WEP\n\n`WEP` 是 `Wired Equivalent Privacy`（有线等效保密）协议，是早期为提供\
  \ 802.11 无线安全所做的尝试（首次批准于 1999 年）。WEP 已被证明极其脆弱：新型攻击可在几分钟内破解任何 WEP 密钥。由于这些攻击，WEP 实际上几乎不提供完整性或机密性保护。WEP\
  \ 被认为已被攻破，强烈不建议使用。应使用 802.11i 中指定的加密算法和/或其他加密方法（如 VPN）来替代 WEP。\n\nWEP 设计于加密出口管制比今天更严格的时期，专门设计用于避免与当时现有的军火法规冲突。换句话说，从密码学角度来看，WEP\
  \ 被设计为“不太强”，结果证明它甚至比预期的还要弱。WEP 拥有 40 位和 104 位密钥长度，并使用 RC4 密码。WEP 帧没有时间戳和重放保护：攻击者可通过重放之前嗅探到的\
  \ WEP 帧来注入流量。\n\n##### 802.11i\n\n`802.11i` 是第一个提供合理安全性的 802.11 无线安全标准。802.11i 描述了一个强健安全网络（RSN），它允许可插拔的认证模块。RSN\
  \ 允许在发现新漏洞时更换加密密码。\n\nRSN 通常被称为 WPA2（Wi-Fi Protected Access 2，Wi-Fi 保护访问 2），它是 802.11i\
  \ 的完整实现。默认情况下，WPA2 使用 AES 加密提供机密性，使用 CCMP（计数器模式 CBC-MAC 协议）创建消息完整性检查（MIC），从而提供完整性。安全性较低的\
  \ `WPA`（没有“2”）是为缺乏实现完整 802.11i 标准能力的接入点设计的，提供了一种比 WEP 更好的安全替代方案。WPA 使用 RC4 提供机密性，使用\
  \ TKIP 提供完整性。建议使用 WPA2 而非 WPA。\n\n#### 蓝牙\n\n`Bluetooth`（蓝牙），由 IEEE 标准 802.15.1\
  \ 描述，是一种个人区域网络（PAN）无线技术，工作在与许多类型的 802.11 无线设备相同的 2.4 GHz 频率上。蓝牙可用于手机等小型低功耗设备，在短距离内传输数据。蓝牙\
  \ 2.1 及更早版本的速度为 3 Mbps 或更低；3 及更高版本提供快得多的速度。\n\n蓝牙有三类设备，总结如下。虽然蓝牙是为短距离网络设计的，但值得注意的是\
  \ 1 类设备可传输高达 100 米。\n\n*   **3 类：** 10 米以内\n*   **2 类：** 10 米\n*   **1 类：** 100\
  \ 米\n\n蓝牙使用 128 位 `E0` 对称流密码。E0 的密码分析已证明其较弱；实际攻击显示其真实强度为 38 位或更低。\n\n敏感设备应禁用被其他蓝牙设备自动发现的功能。发现功能的“安全性”依赖于蓝牙适配器\
  \ 48 位 MAC 地址的保密性。即使禁用了发现功能，蓝牙设备仍可能通过猜测 MAC 地址被发现。前 24 位是 OUI，容易被猜测；后 24 位可通过暴力攻击确定。例如，许多诺基亚手机使用\
  \ OUI 00:02:EE。如果攻击者知道目标设备是诺基亚手机，剩下的挑战就是猜测 MAC 地址的后 24 位。\n\n#### ZigBee\n\nZigBee，最初由\
  \ IEEE 标准 802.15.4 描述，是另一种个人区域网络（PAN）无线技术。它是一种低功耗、短距离的无线网状技术，广泛用于仓库、物联网、楼宇自动化与控制（BAC）等领域。它在\
  \ 2.4 GHz 频率下运行（与 802.11 和蓝牙相同）。此外，根据地区不同，它还在以下频率运行：784 MHz（中国）、868 MHz（欧洲）和 915\
  \ MHz（美国和澳大利亚）。它支持在高达 100 米的距离内达到 250 kbps 的速度。ZigBee 使用电池供电的天线，ZigBee 标准要求电池寿命达到\
  \ 2 年。\n\n\n\n\nNIST 对 ZigBee 的描述：*ZigBee 是一种无线技术，作为开放的全球标准而开发，旨在满足低成本、低功耗无线传感器网络的独特需求。该标准充分利用了\
  \ IEEE 802.15.4 物理无线电规范，并在全球范围内以不同频率在非授权频段运行。ZigBee 无线网状网络被公认为楼宇自动化和控制的一种高性价比且灵活的解决方案。它们有潜力统一传感器、执行器、家电和资产跟踪设备的数据通信方法。它们提供了一种构建可靠且经济的网络骨干的方法，该骨干支持具有低数据速率和低占空比的电池供电设备，以促进楼宇自动化和控制系统\
  \ (BACs)* [\\[13\\]](#Ch005_225-293_B9780443187346000039.xhtml#bb0070)。\n\nZigBee\
  \ 提供三种安全模式：非安全模式、ACL（访问控制列表）模式和安全模式。顾名思义，非安全模式不提供加密或过滤：数据以明文形式发送。ACL 模式增加了防火墙风格的\
  \ ACL，限制哪些设备可以向其他设备发送/接收数据，但仍然是明文。安全模式使用 `128-bit AES` 加密数据。强烈建议使用安全模式，而非 ZigBee\
  \ 的其他模式。\n\n#### Li-Fi\n\nLi-Fi（光保真度）使用 `LED`（发光二极管）传输数据。它以极高的速度脉冲 LED，以至于人眼只能看到光线，而检测不到闪烁。该技术要求\
  \ LED 与发送/接收设备之间具有视距。Li-Fi 用于有线设备不（易于）使用的区域，以及电磁干扰 (`EMI`) 导致传统无线技术（如 `802.11` 或\
  \ `Bluetooth`）难以或无法使用的区域。传统无线射频技术也可能干扰关键设备，例如某些医疗设备。医院通常面临所有这些挑战。\n\n光的潜在带宽远大于无线电波，因此\
  \ Li-Fi 可以以超过 `100 Gbps` 的速度传输，比任何当前的 Wi-Fi 技术都快：“LiFi 是一种可见光通信系统，以极高的速度传输无线互联网通信。该技术使\
  \ LED 灯泛发出人眼无法察觉的光脉冲，数据可在这些发射的脉冲中往返于接收器之间。然后，接收器收集信息并解读传输的数据。这在概念上类似于解码摩斯密码，但速度快得多——每秒数百万次。LiFi\
  \ 传输速度可超过 `100 Gbps`，比被誉为世界上最快 WiFi 的 WiGig 快 14 倍” [\\[14\\]](#Ch005_225-293_B9780443187346000039.xhtml#bb0075)。\n\
  \n#### RFID\n\n射频识别 (`RFID`) 是一种用于为动物或物体创建可无线读取标签的技术。`RFID` 标签有三种类型：*有源*、*半无源* 和\
  \ *无源*。有源和半无源 `RFID` 标签有电池。有源标签主动广播信号；半无源 `RFID` 标签依靠 `RFID` 读取器的信号供电。无源 `RFID`\
  \ 标签没有电池，也依靠 `RFID` 读取器的信号供电。\n\n有源 `RFID` 标签可在更大距离上运行。收费应答器（允许自动支付高速公路通行费）等设备使用有源标签。无源\
  \ `RFID` 标签更便宜；它们用于仓库库存跟踪等应用。\n\n`RFID` 信号可用 *法拉第笼* 屏蔽，法拉第笼可将封闭物体与 `EMI` 隔离。电倾向于绕过导电物体而不是穿过它（如闪电击中汽车：车内人员通常安然无恙）。*法拉第笼*\
  \ 是一种金属笼或外壳，充当导电物体，保护内部物体。这会阻挡许多无线电信号，包括 `RFID`。该笼子可以简单到只是用铝箔包裹物体。\n\n#### 蜂窝网络\n\
  \n蜂窝网络使用基站（又称“小区”）无线连接到蜂窝设备（如手机）。小区之间（以及与互联网）通过高速有线连接相连。当前的蜂窝技术包括 `4G`（第四代）和 `5G`（第五代）。请注意，`4G`\
  \ 使用宏基站，而 `5G` 使用小基站（顾名思义，体积更小）。小基站可安装在路灯等物体上。\n\n`4G` 和 `5G` 的主要区别在于下载速度和延迟。下载速度描述每秒可传输多少吉比特。延迟描述接收数据前的延迟（或滞后）。与有线网络相比，蜂窝网络历史上下载速度较低且延迟较高。与\
  \ `4G` 相比，`5G` 提供 `10–20` 倍的下载速度，且延迟低得多。图 5.17 来自美国政府问责局 (`GAO`)，展示了 `4G` 和 `5G`\
  \ 之间的主要差异。\n\n![图 5.17 4G 对比 5G [15].](images/B9780443187346000039/f05-17-9780443187346.jpg)\n\
  \n图 5.17 4G 对比 5G [\\[15\\]](#Ch005_225-293_B9780443187346000039.xhtml#bb0080)。\n\
  \n#### 卫星\n\n卫星通信通过与地球轨道匹配、看似静止在天空中的地球静止卫星提供语音和数据服务。卫星通信常用于缺乏宽带互联网或手机服务的区域，如农村地区。虽然卫星通信可提供较高的下载速度，但由于往返卫星的距离，其延迟与有线或蜂窝网络相比要高得多：“从卫星发出的无线电波以光速传播，但由于信号必须传输更远的距离，延迟高于地面提供商。例如，有线互联网信号的平均延迟可能为\
  \ `30 毫秒 (ms)`，而来自地球静止轨道卫星的信号可能为 `600 ms`” [\\[16\\]](#Ch005_225-293_B9780443187346000039.xhtml#bb0085)。\n\
  \n### 安全网络设备与协议\n\n让我们看看网络设备，范围从第 1 层集线器到工作在第 7 层的应用层代理防火墙。许多网络设备（如路由器）都有专用于其使用的协议，如路由协议。\n\
  \n#### 中继器和集线器\n\n*中继器* 和集线器是第 1 层设备。中继器在一个端口接收比特，并将其从另一个端口“重发”出去。中继器不理解协议；它只是简单地重复比特。中继器常用于延长网络长度。\n\
  \n集线器是一个拥有两个以上端口的中继器。它在一个端口接收比特，并将其重复到所有其他端口。\n\n在交换机普及且价格低廉之前，集线器曾非常普遍。集线器不提供流量隔离，也没有安全性：所有节点都能看到集线器发送的所有流量。集线器不提供机密性或完整性；连接到集线器的攻击者可能读取并潜在地篡改通过集线器发送的流量。\n\
  \n集线器也是半双工设备：它们不能同时发送和接收。连接到集线器的任何设备都将协商为半双工模式，这可能导致网络拥塞。集线器还有一个“冲突域”：任何节点都可能发送与另一个节点冲突的流量（有关冲突的更多信息，请参阅前面的“CSMA”部分）。缺乏安全性、半双工模式和大冲突域使集线器不适合大多数现代用途。\n\
  \n#### 网桥\n\n\n\n\n##### 网桥和交换机\n\n*网桥*和交换机是第 2 层设备。网桥有两个端口，用于连接网段。每个网段通常包含多个节点，网桥会学习两侧节点的\
  \ MAC 地址。从网桥同一侧的两个节点发送的流量不会跨越网桥转发。从网桥一侧的节点发送到另一侧的流量将会跨越转发。网桥通过学习连接节点的 MAC 地址来提供流量隔离并做出转发决策。\n\
  \n在图 5.18 中，从计算机 1 发送到计算机 2 的流量不会跨越网桥转发。从计算机 1 发送到计算机 3 的流量将跨越网桥转发。\n\n![图 5.18\
  \ 网络网桥。](img/f05-18-9780443187346.jpg)\n\n图 5.18 网络网桥。\n\n网桥有两个冲突域。如图 5.18 所示，网络右侧的网络协议分析器（非正式称为“嗅探器”）可以嗅探发送给或来自计算机\
  \ 3 和 4 的流量，但无法嗅探计算机 1 或 2 的流量（除非发送给计算机 3 或 4）。\n\n#### 交换机\n\n交换机是具有两个以上端口的网桥。此外，最佳实践是每个交换机端口仅连接一个设备。除此之外，关于网桥的一切特性也都适用于交换机。\n\
  \n图 5.19 展示了一个网络交换机。交换机通过将每台计算机和服务器的 MAC 地址与其端口关联来提供流量隔离。计算机 1 和服务器 1 之间发送的流量仅隔离在它们各自的交换机端口上：运行在服务器\
  \ 3 上的网络嗅探器将看不到该流量。\n\n![图 5.19 网络交换机。](img/f05-19-9780443187346.jpg)\n\n图 5.19\
  \ 网络交换机。\n\n交换机将冲突域缩小到单个端口。假设每个端口仅连接一个设备（这是最佳实践），通常不会发生冲突。\n\n干线用于连接多个交换机。\n\n#####\
  \ VLAN\n\n*VLAN* 是虚拟局域网，可视为虚拟交换机。在图 5.19 中，假设您想创建一个计算机局域网和一个服务器局域网。一种选择是购买第二台交换机，一台专用于计算机，一台专用于服务器。\n\
  \n另一种选择是在原交换机上创建 VLAN，如图 5.20 所示。该交换机有两个 VLAN，充当两个虚拟交换机：一个计算机交换机和一个服务器交换机。\n\n![图\
  \ 5.20 交换机 VLAN。](img/f05-20-9780443187346.jpg)\n\n图 5.20 交换机 VLAN。\n\n图 5.20 中的\
  \ VLAN 有两个广播域。计算机 1-3 发送到 MAC 地址 `FF:FF:FF:FF:FF:FF` 的流量将到达其他计算机，但不会到达服务器 VLAN 上的服务器。VLAN\
  \ 间通信需要第 3 层路由，将在下一节讨论。\n\nVLAN 还可为网络增加纵深防御保护；例如，使用 VLAN 分隔数据流量和管理流量。\n\n##### 端口隔离\n\
  \n端口隔离的概念并不新鲜，但随着数据中心虚拟化系统密度的增加，它焕发了新生并被更广泛地采用。传统的端口隔离侧重于使用托管交换机中的软件来隔离端口，使其只能与指定的上行链路通信。这种端口隔离通常也称为专用\
  \ VLAN 或 PVLAN，可用于确保单个系统无法与其他资源交互，即使它们在逻辑上位于同一子网。从安全角度来看，这可以在攻击者成功攻破一个系统后，严重限制其在组织内横向移动或跳转的能力。\n\
  \n从架构上讲，大规模实施传统的端口隔离/PVLAN 对许多组织来说似乎很麻烦。然而，随着高度虚拟化基础设施的出现，端口隔离重获新生。在多租户环境中，端口隔离非常有用，有助于确保由同一管理程序服务的客户之间相互隔离。同样，即使在内部虚拟基础设施中，也经常存在无需直接相互访问但由同一管理程序托管的系统。端口隔离有助于确保即使在单个\
  \ vswitch（虚拟交换机）内也能实现逻辑分段。\n\n##### SPAN 端口\n\n由于交换机提供流量隔离，连接到 24 端口交换机的网络入侵检测系统\
  \ (NIDS) 将无法看到同一交换机上其他设备发送和接收的单播流量。配置交换端口分析器 (SPAN) 端口是解决此问题的一种方法，它通过将多个交换机端口的流量镜像到一个“SPAN\
  \ 端口”。SPAN 是思科术语；惠普交换机使用“镜像端口”一词。\n\n使用交换机 SPAN 端口的一个缺点是端口带宽过载。一台 100 兆比特、24 端口的交换机可以将二十三个\
  \ 100 兆比特的流量流镜像到一个 100 兆比特的 SPAN 端口。聚合流量很容易超过 100 兆比特，这意味着 SPAN 端口（和连接的 NIDS）将丢失流量。\n\
  \n#### 网络分流器\n\n网络分流器提供了一种“分流”网络流量的方法，可查看网络上的所有流量（包括所有单播连接）。分流器是为嗅探器或网络入侵检测系统提供混杂网络访问的首选方式。\n\
  \n分流器可以“故障开放”，以便在发生故障时网络流量仍能通过。分流器还可以提供对所有流量的访问，包括畸形以太网帧。交换机通常会“清理”这些流量并不予转发。最后，分流器可配备内存缓冲区，用于缓存突发流量。\n\
  \n#### 路由器\n\n路由器是第 3 层设备，用于将流量从一个局域网路由到另一个局域网。基于 IP 的路由器根据源和目的 IP 地址做出路由决策。\n\n\
  > **注意**\n>\n> 在现实世界中，一个机箱（如思科 6500）可以同时充当多种设备：路由器、交换机、防火墙、NIDS 等。考试可能会给出更明确的例子：专用防火墙、专用交换机等。如果考试涉及多功能设备，会明确说明。无论如何，在考试中将这些设备视为不同的概念是有帮助的。\n\
  \n##### 静态路由和默认路由\n\n对于简单的路由需求，*静态路由*可能就足够了。静态路由是固定的路由条目，例如“网络 `10.0.0.0/8` 的路由经由路由器\
  \ `192.168.2.7`；网络 `172.16.0.0/12` 的路由经由路由器 `192.168.2.8`”等。大多数 SOHO（小型办公室/家庭办公室）路由器都有一个静态“默认路由”，将所有外部流量发送到一台路由器（通常由\
  \ ISP 控制）。\n\n以下是典型家庭局域网网络配置示例：\n\n- 内部网络：`192.168.1.0/24`\n- 内部防火墙 IP：`192.168.1.1`\n\
  - 外部网络：`192.0.2.0/30`\n- 外部防火墙 IP：`192.0.2.2`\n- 下一跳地址：`192.0.2.1`\n\n防火墙有内部和外部接口，IP\
  \ 地址分别为 `192.168.1.1` 和 `192.0.2.2`。内部（受信）主机通过 DHCP 获取 `192.168.1.0/24` 子网上的地址。互联网流量经\
  \ NAT 转换为外部防火墙 IP `192.0.2.2`。内部主机的静态默认路由是 `192.168.1.1`。外部默认路由是 `192.0.2.1`。这是一台由\
  \ ISP 拥有和控制的路由器。\n\n##### 路由协议\n\n静态路由适用于简单网络，如冗余有限或无冗余的 SOHO 网络。具有许多路由器和网络间多条可能路径的更复杂网络有更复杂的路由需求。\n\
  \n\n\n\n\n图 5.21 中的网络在所有四个站点之间都有冗余路径。如果任何单个电路或站点发生故障，至少有一条备用路径可用。最快的电路是连接数据中心与各办公室的\
  \ 45 兆比特 T3 线路。额外的 1.5 兆比特 T1 线路连接办公室 A 到 B，以及 B 到 C。\n\n![图 5.21 冗余网络架构。](img/f05-21-9780443187346.jpg)\n\
  \n图 5.21 冗余网络架构。\n\n如果数据中心与办公室 A 之间最左侧的 T3 电路发生故障，从数据中心到办公室 A 有多条可用路径：最快的是经由办公室\
  \ B 的 T3，然后经由办公室 A 的 T1。\n\n你可以为此网络使用静态路由，优先选择速度更快的 T3 而非较慢的 T1。问题在于：如果 T3 故障会怎样？网络工程师常说所有电路最终都会故障。静态路由将需要手动重新配置。\n\
  \n路由协议是解决之道。路由协议的目标是自动学习网络拓扑，并学习所有网络节点之间的最佳路由。如果最佳路由失效，应选择备用路由，且选择要迅速。理想情况下，即使网络工程师正在睡觉，这一过程也应自动发生。\n\
  \n*收敛* 意味着网络上的所有路由器就路由状态达成一致。没有近期故障的网络通常处于“已收敛”状态：所有路由器都视所有路由为可用。随后某条电路故障。离故障最近的路由器会立即知晓；较远的路由器则不会。网络此时缺乏收敛：一些路由器认为所有电路均正常，而另一些则知晓有一条已故障。路由协议的一个目标是使收敛时间尽可能快。\n\
  \n路由协议主要分两类：内部网关协议（IGP），如 `RIP` 和 `OSPF`；以及外部网关协议（EGP），如 `BGP`。私有网络（如内联网）使用 IGP，而公共网络（如互联网）使用\
  \ EGP。路由协议支持 OSI 模型的第 3 层（网络层）。\n\n##### 距离矢量路由协议\n\n度量值用于确定跨网络的“最佳”路由。最简单的度量是跳数。在\
  \ 图 5.21 中，从数据中心经 T3 到达各办公室的跳数为 1。从数据中心到各办公室还有其他路径，例如经办公室 B 的 T3，再经办公室 A 的 T1。\n\
  \n后者为两跳，且第二跳通过较慢的 T1。任何网络工程师都会倾向于数据中心到办公室 A 的单跳 T3 直连，而非经办公室 B 到办公室 A 的两跳绕行。所有路由协议也会做同样的选择，即选择单跳\
  \ T3。\n\n当考虑办公室间的连接时，情况变得棘手。办公室 A 到 B 的流量应如何路由？最短跳数是通过直连 T1。但该链路只有 1.5 兆比特：走两跳路线，从办公室\
  \ A 经数据中心再回到办公室 B，可提供 45 兆比特带宽，代价仅是多一跳。\n\n像 `RIP` 这样的*距离矢量*路由协议会选择直连 T1，并认为 1.5\
  \ 兆比特的单跳比 45 兆比特的两跳“更快”。大多数网络工程师（以及下一节所述的所有*链路状态*路由协议）会持不同意见。\n\n距离矢量路由协议使用跳数等简单度量，且容易产生路由环路，即数据包在两个路由器间来回循环。以下输出是一个\
  \ Linux traceroute 路由环路示例，从第 16、17 跳开始。nyc 和 bos 核心路由器会将数据包在彼此间不断转发，各自认为对方拥有正确路由。\n\
  \n```\n14 pwm-core-03.inet.example.com (10.11.37.141) 165.484 ms 164.335 ms 175.928\
  \ ms\n15 pwm-core-02.inet.example.com (10.11.23.9) 162.291 ms 172.713 ms 171.532\
  \ ms\n16 nyc-core-01.inet.example.com (10.11.5.101) 212.967 ms 193.454 ms 199.457\
  \ ms\n17 bos-core-01.inet.example.com (10.11.5.103) 206.296 ms 212.383 ms 189.592\
  \ ms\n18 nyc-core-01.inet.example.com (10.11.5.101) 210.201 ms 225.674 ms 208.124\
  \ ms\n19 bos-core-01.inet.example.com (10.11.5.103) 189.089 ms 201.505 ms 201.659\
  \ ms\n20 nyc-core-01.inet.example.com (10.11.5.101) 334.19 ms 320.39 ms 245.182\
  \ ms\n21 bos-core-01.inet.example.com (10.11.5.103) 218.519 ms 210.519 ms 246.635\
  \ ms\n```\n\n##### RIP\n\n`RIP`（路由信息协议）是一种使用跳数作为度量的距离矢量路由协议。在 图 5.21 中，`RIP` 会通过直连\
  \ T1 将流量从办公室 A 路由到办公室 B，因为它是 1 跳的“最近”路由。\n\n`RIP` 无法全貌掌握网络：它只能“看到”直连的路由器。收敛速度慢。`RIP`\
  \ 每 30 秒发送一次路由更新，无论路由是否变化。处于已收敛数周网络中的 `RIP` 路由器，仍会全天候每 30 秒发送路由更新。\n\n`RIP` 的最大跳数为\
  \ 15；16 被视为“不可达”。`RIPv1` 仅支持有类网络路由；`RIPv2` 增加了对 CIDR 的支持。`RIP` 由 UNIX `routed` 命令使用，是\
  \ UNIX 通用支持的唯一路由协议。\n\n`RIP` 使用*水平分割*来帮助避免路由环路。在 图 5.22 中，NYC 和 BOS 路由器之间的电路已故障。此时，NYC\
  \ 和 BOS 路由器知晓电路故障；其他路由器则不知情。网络缺乏收敛。\n\n![图 5.22 电路故障的示例网络。](img/f05-22-9780443187346.jpg)\n\
  \n图 5.22 电路故障的示例网络。\n\nNYC 告诉 PWM 路由器“NYC 和 BOS 之间的路由已故障”。在 PWM 的另一接口上，ATL 路由器可能宣称链路正常。水平分割意味着\
  \ PWM 路由器不会“反驳”：它不会通过学习到该路由的接口发送路由更新。在本例中，PWM 路由器不会向 NYC 路由器发送 NYC → BOS 的路由更新。*毒性反转*\
  \ 是水平分割的补充：PWM 不向 NYC 发送关于 NYC → BOS 路由的空信息，而是发送一条开销为 16（无限大）的 NYC → BOS 路由。NYC\
  \ 会忽略任何“不可达”路由。\n\n`RIP` 使用*保持定时器*来避免“路由振荡”（路由状态在 up 和 down 间反复变化）。一旦 `RIP` 将路由状态更改为“down”，`RIP`\
  \ 将“保持”该决定 180 秒。在 图 5.22 中，PWM 路由器将保持 NYC → BOS 路由“down”状态 180 秒。期望在此期间网络能达到收敛。如果未收敛，180\
  \ 秒后 `RIP` 可能再次更改状态。\n\n`RIP` 相当受限。每个路由器仅有网络的部分视图，且无论是否变化都每 30 秒发送更新。收敛缓慢。保持定时器、水平分割和毒性反转只是小补丁，无法弥补\
  \ `RIP` 的弱点。链路状态路由协议（如 `OSPF`）更为优越。\n\n##### 链路状态路由协议\n\n链路状态路由协议在确定最佳路由时会考量额外度量，包括带宽。链路状态协议会看到\
  \ 图 5.21 中从办公室 A 到办公室 B 的多条路由，包括直连 T1 链路，以及经数据中心的两跳 T3 路由。额外的带宽（45 兆比特对 1.5 兆比特）会使两跳\
  \ T3 路由胜出。\n\n##### OSPF\n\n\n\n\n\n###### 开放最短路径优先 (OSPF)\n\n开放最短路径优先 (OSPF) 是一种开放的链路状态路由协议。OSPF\
  \ 路由器会学习其“区域”（即其维护路由的网络部分，对于小型网络通常是整个网络）的整个网络拓扑。OSPF 路由器发送事件驱动的更新。如果网络收敛了一周，OSPF\
  \ 路由器将不会发送任何更新。与 RIP 等距离矢量协议相比，OSPF 的收敛速度要快得多。在 图 5.21 中，OSPF 会选择从办公室 A 到 B 的两跳\
  \ T3 路由，而不是单跳 T1 路由。\n\n> **注意**\n>\n> 考试非常倾向于开放标准而非专有标准，这就是为什么思科的 EIGRP 等专有路由协议未在此讨论的原因。\n\
  \n##### BGP\n\nBGP 是边界网关协议，即互联网上使用的路由协议。BGP 在自治系统之间路由，自治系统是指具有多个互联网连接的网络。BGP 具有一些距离矢量特性，但正式被认为是一种路径矢量路由协议。\n\
  \n#### 调制解调器\n\n`Modem`（调制解调器）是 Modulator/Demodulator（调制器/解调器）的缩写。它接收二进制数据并将其调制为可在电话网络上传输的模拟声音（电话网络设计用于传输人声）。接收端的调制解调器再将模拟声音解调回二进制数据。调制解调器是异步设备：它们不依靠时钟信号运行。\n\
  \n#### DTE/DCE 和 CSU/DSU\n\n`DTE`（数据终端设备）是一种网络“终端”，指任何类型的网络连接用户机器，如台式机、服务器或实际终端。`DCE`（数据电路终端设备，有时也称为数据通信设备）是连接\
  \ DTE 的设备，如路由器。这些术语最常见的用法是 DTE/DCE，且各自含义更为具体：DCE 标志着 ISP 网络的末端。它连接到数据终端设备 (DTE)，后者由客户负责。DCE\
  \ 与 DTE 相接的点称为分界点：即分界点，ISP 的责任在此结束，客户的责任由此开始。\n\n通过 DCE/DTE 传输的电路是同步的（使用时钟信号）。双方必须同步到由\
  \ DCE 提供的时钟信号。DCE 设备是调制解调器或 `CSU/DSU`（信道服务单元/数据服务单元）。\n\n#### 硬件运维\n\n硬件运维涉及日常运营问题，如冗余电源、维护适当的保修以及支持合同。\n\
  \n##### 冗余电源\n\n路由器和防火墙等关键设备应配备冗余电源。每个电源应连接到不同的电源插座，且这些插座应位于不同的电路回路上。应使用浪涌保护器和 UPS，关键设备应具备发电机备用电源。我们将在第\
  \ 8 章（Chapter 8），领域 7：安全运营中讨论浪涌保护器、UPS 和发电机。\n\n##### 保修与支持\n\n所有关键设备应在有效的供应商保修期内，并拥有适当的支持合同。支持合同的定价通常基于响应时间和其他变量（响应越快费用越高）。思科\
  \ SmartNet 提供多个级别的保障：\n\n*   **24 × 7 × 2**：2 小时响应，每天 24 小时，每周 7 天，含节假日\n*   **24\
  \ × 7 × 4**：4 小时响应，每天 24 小时，每周 7 天，含节假日\n*   **8 × 5 × 4**：4 小时响应，基于仓库时间的当地工作时间，每周\
  \ 5 天，不含节假日\n*   **8 × 7 × Next Calendar Day**：次日历日送达，基于仓库时间的当地工作时间，每周 7 天，含节假日\n\
  *   **8 × 5 × Next Business Day**：下一个工作日送达，基于仓库时间的当地工作时间，每周 5 天，不含节假日 [[17]](#Ch005_225-293_B9780443187346000039.xhtml#bb0090)\n\
  \n请注意，思科 SmartNet 本身不是考试重点；以上示例之所以使用，是因为这种分级保障在整个行业中很常见。选择哪级支持没有“标准答案”：期望的响应时间可在彻底的风险评估后确定。业务连续性规划指标（如最大可容忍停机时间\
  \ MAD，详见 第 8 章，领域 7：安全运营）有助于确定应购买哪级支持。关键设备应在达到支持终止 (EoS，详见 第 3 章，领域 2：资产安全) 前退役。请注意，组织可选择对不太关键的设备（包括通用\
  \ PC）进行自保，但在自保前必须进行彻底的风险评估。\n\n### 安全通信\n\n保护传输中的数据是我们面临的最复杂的挑战之一。互联网提供了廉价的全球通信——但几乎没有内置的机密性、完整性或可用性。为了保护我们的数据，我们通常必须自己动手；安全通信描述了实现这一目标的方法。\n\
  \n#### 认证协议与框架\n\n认证协议通过网络验证身份声明。良好的安全设计假设网络窃听者可能会嗅探客户端与认证服务器之间发送的所有数据包：协议应保持安全。正如我们稍后将看到的，PAP\
  \ 无法通过此测试，但 CHAP 和 EAP 可以。\n\n### PAP 和 CHAP\n\nPAP（密码认证协议）是一种非常脆弱的认证协议。它以明文形式发送用户名和密码。能够嗅探认证过程的攻击者可发起简单的重放攻击，通过重放用户名和密码来登录。PAP\
  \ 不安全，不应使用。\n\nCHAP（质询握手认证协议）是一种更安全的认证协议，它不暴露明文密码，且不易受重放攻击。CHAP 依赖共享密钥：即密码。密码在安全创建时（如账户注册期间）生成并存储在\
  \ CHAP 服务器上。由于用户和 CHAP 服务器共享一个密钥（明文密码），它们可利用该密钥进行安全通信。\n\n为进行认证，客户端首先通过 LCP（链路控制协议）创建初始（未认证）连接。服务器随后启动三次\
  \ CHAP 认证过程：\n\n1.  服务器发送一个质询，即一个小的随机字符串（也称为一次性数 nonce）。\n2.  用户获取质询字符串和密码，使用 MD5\
  \ 等哈希密码创建哈希值，并将该值作为响应发回 CHAP 服务器。\n3.  CHAP 服务器同样对密码和质询进行哈希运算，生成预期响应。然后将预期响应与从用户收到的响应进行比较。\n\
  \n如果响应相同，则用户必定输入了正确密码，从而通过认证。如果不同，则用户输错了密码，拒绝访问。\n\nCHAP 服务器可通过发送新的（且不同的）质询来重新认证。每次质询必须不同；否则，攻击者可通过重放旧的加密响应进行认证。\n\
  \nCHAP 的一个缺点是服务器以明文存储每个客户端的密码。攻破 CHAP 服务器的攻击者可能窃取其上存储的所有密码。\n\n##### 802.1X 和 EAP\n\
  \n`802.1X` 是“基于端口的网络访问控制”，包含 EAP（`可扩展认证协议`）。EAP 是一个认证框架，描述了多种具体的认证协议。EAP 旨在提供第 2\
  \ 层认证（它是“基于端口的”，如交换机上的端口），在节点获得 IP 地址之前进行。它适用于有线和无线网络，但更常部署于 WLAN。\n\n主要的 802.1X\
  \ 角色包括：\n\n*   **申请者**：802.1X 客户端\n*   **认证服务器 (AS)**：认证申请者的服务器\n\n\n\n\n\n######\
  \ 认证器\n\n认证器：一种设备（如接入点），允许申请者进行身份验证并连接。\n\n#### 考试警告\n\n不要混淆 `802.1X` (EAP) 与 `802.11`\
  \ (无线)。\n\nEAP 解决了许多问题，包括“漫游感染笔记本电脑”问题。携带受感染笔记本电脑的用户插入典型办公网络，并向 DHCP 服务器请求 IP 地址。一旦获得\
  \ IP，安装在笔记本电脑上的恶意软件便开始攻击网络上的其他系统。\n\n当笔记本电脑能够请求 IP 地址时，它已经处于可在网络上造成危害的位置，包括机密性、完整性和可用性攻击。此问题在\
  \ WLAN 上最为严重（位于距离大楼 100 英尺处的外部笔记本电脑可能即可访问网络）。理想情况下，应在笔记本电脑加入网络前要求进行身份验证：EAP 正是实现这一功能的。\n\
  \n图 5.23 展示了申请者成功进行身份验证并连接到内部网络的过程。步骤 1 显示申请者通过 `EAPOL` (*EAP Over LAN*，LAN 上的 EAP)\
  \ 进行身份验证，这是一种第 2 层 EAP 实现。步骤 2 显示认证器接收 `EAPOL` 流量，并使用 `RADIUS` 或 `Diameter` 将 EAP\
  \ 流量传送至认证服务器 (AS)。步骤 3 显示认证器在成功认证后允许申请者访问内部网络。\n\n![图 5.23 成功的 802.1X 认证。](img/f05-23-9780443187346.jpg)\n\
  \n图 5.23 成功的 802.1X 认证。\n\nEAP 有多种类型；我们将重点介绍 `EAP-MD5`、`LEAP`、`EAP-FAST`、`EAP-TLS`、`EAP-TTLS`\
  \ 和 `PEAP`：\n\n*   **EAP-MD5** 是最弱的 EAP 形式之一。它仅提供客户端-服务器端认证（本节讨论的所有其他形式的 EAP 均支持客户端和服务器的相互认证）；这使其容易受到中间人攻击。`EAP-MD5`\
  \ 也容易受到密码破解攻击。\n*   **LEAP** (*Lightweight Extensible Authentication Protocol*，轻量级可扩展认证协议)\
  \ 是思科专有协议，在 `802.1X` 最终确定前发布。`LEAP` 存在重大安全缺陷，不应使用。\n*   **EAP-FAST** (*EAP-Flexible\
  \ Authentication via Secure Tunneling*，通过安全隧道进行的 EAP 灵活认证) 由思科设计，旨在取代 `LEAP`。它使用\
  \ *Protected Access Credential* (PAC，受保护访问凭证)，其作用类似于预共享密钥。\n*   **EAP-TLS** (*EAP-Transport\
  \ Layer Security*，EAP 传输层安全) 使用 PKI，要求同时具备服务器端和客户端证书。`EAP-TLS` 建立用于认证的安全 TLS 隧道。由于使用\
  \ PKI，`EAP-TLS` 非常安全，但也因同一原因而复杂且成本高昂。其他主要版本的 EAP 试图在不需要客户端证书的情况下创建相同的 TLS 隧道。\n\
  *   **EAP-TTLS** (*EAP Tunneled Transport Layer Security*，EAP 隧道传输层安全) 由 Funk Software\
  \ 和 Certicom 开发，通过取消客户端证书要求简化了 `EAP-TLS`，允许使用其他认证方法（如密码）进行客户端认证。因此 `EAP-TTLS` 比\
  \ `EAP-TLS` 更易于部署，但省略客户端证书时安全性较低。\n*   **PEAP** (*Protected EAP*，受保护的 EAP) 由思科系统、微软和\
  \ RSA Security 开发，类似于（且可被视为竞争对手）`EAP-TTLS`，同样不需要客户端证书。\n\n#### VPN\n\n虚拟专用网络 (VPN)\
  \ 保护通过互联网等不安全网络发送的数据。其目标是虚拟地提供专线（如 T1）所提供的隐私。VPN 的核心机制涉及安全认证、加密哈希（如 `SHA-1`）以提供完整性，以及加密算法（如\
  \ `AES`）以提供机密性。\n\n> **注意**\n> 此处讨论的 VPN 协议的加密细节在第 4 章 第 4 章，领域 3：安全架构与工程中有深入介绍。\n\
  \n##### SLIP 和 PPP\n\n`SLIP` (Serial Line Internet Protocol，串行线路互联网协议) 是一种第 2 层协议，通过异步连接（如串行线路和调制解调器）提供\
  \ IP 连接。`SLIP` 于 1988 年首次推出时，首次允许通过调制解调器链路路由数据包（此前，调制解调器主要用于非路由的终端访问）。`SLIP` 是一种极简协议，不提供内置的机密性、完整性或认证。`SLIP`\
  \ 已基本弃用，被 `PPP` 取代。\n\n`PPP` (Point-to-Point Protocol，点对点协议) 是一种第 2 层协议，已基本取代 `SLIP`。`PPP`\
  \ 基于 `HDLC`（前文已讨论），并通过点对点链路增加了机密性、完整性和认证。除了异步链路（如调制解调器）外，`PPP` 还支持同步链路（如 T1 线路）。\n\
  \n##### PPTP 和 L2TP\n\n`PPTP` (Point-to-Point Tunneling Protocol，点对点隧道协议) 通过 IP\
  \ 隧道传输 `PPP`。它由包括微软、3COM 在内的多家厂商联盟开发。`PPTP` 使用 `GRE` (Generic Routing Encapsulation，通用路由封装)\
  \ 通过 IP 传输 `PPP`，并使用 TCP 作为控制通道（使用 TCP 端口 1723）。\n\n`L2TP` (Layer 2 Tunneling Protocol，第\
  \ 2 层隧道协议) 结合了 `PPTP` 和 `L2F` (Layer 2 Forwarding，第 2 层转发，旨在隧道传输 `PPP`)。`L2TP` 专注于认证，不提供机密性：它经常与\
  \ `IPsec` 结合使用以提供加密。与 `PPTP` 不同，`L2TP` 也可用于非 IP 网络，如 ATM。\n\n##### IPsec\n\n`IPv4`\
  \ 没有内置机密性；通常使用 `TLS` 等高层协议来提供安全性。为解决第 3 层缺乏安全性的问题，设计了 `IPsec` (Internet Protocol\
  \ Security，互联网协议安全) 以通过加密为 `IPv6` 提供机密性、完整性和认证。`IPsec` 已移植至 `IPv4`。`IPsec` 是一套协议；主要两个是封装安全载荷\
  \ (`ESP`) 和认证头 (`AH`)。每个都有一个 IP 协议号：`ESP` 是协议 50；`AH` 是协议 51。\n\n> **注意**\n> 本章描述\
  \ `IPsec`、`SSL` 和 `TLS` 的网络方面：这些协议的加密方面见第 4 章 第 4 章，领域 3：安全架构与工程。\n\n###### IPsec\
  \ 体系结构\n\n`IPsec` 有三种体系结构：主机到网关、网关到网关和主机到主机。主机到网关模式（也称为客户端模式）用于将运行 `IPsec` 客户端软件的一个系统连接到\
  \ `IPsec` 网关。网关到网关（也称为点对点）连接两个 `IPsec` 网关，它们形成的 `IPsec` 连接充当共享可路由网络连接，如 T1 线路。最后，主机到主机模式通过\
  \ `IPsec` 将两个系统（如文件服务器）相互连接。许多现代操作系统（如 Windows 10 或 Ubuntu Linux）可原生运行 `IPsec`，允许它们形成主机到网关或主机到主机连接。\n\
  \n###### 隧道模式和传输模式\n\n`IPsec` 可用于隧道模式或传输模式。隧道模式为整个原始数据包（包括原始 IP 头部）提供机密性 (`ESP`)\
  \ 和/或认证 (`AH`)。会添加新的 IP 头部（包含 `IPsec` 网关的源和目的地址）。传输模式仅保护 IP 数据（第 4-7 层），原始 IP 头部不受保护。两种模式均添加额外的\
  \ `IPsec` 头部（一个 `AH` 头部和/或一个 `ESP` 头部）。图 5.24 显示了隧道模式和传输模式的区别。\n\n![图 5.24 IPsec\
  \ 隧道模式和传输模式。](img/f05-24-9780443187346.jpg)\n\n图 5.24 IPsec 隧道模式和传输模式。\n\n#####\
  \ SSL 和 TLS\n\n安全套接字层 (`SSL`) 旨在保护 HTTP (Hypertext Transfer Protocol，超文本传输协议) 数据：HTTPS\
  \ 使用 TCP 端口 443。`TLS` (Transport Layer Security，传输层安全) 1.0 等同于 `SSL` 3.1 版。`TLS`\
  \ 当前版本为 1.3，详见 RFC 8446（参见 [`datatracker.ietf.org/doc/html/rfc8446`](https://datatracker.ietf.org/doc/html/rfc8446)）。\n\
  \n\n\n\n虽然最初面向 Web，但 SSL 或 TLS 可用于加密多种类型的数据，并可用于隧道传输其他 IP 协议以形成 VPN 连接。SSL VPN 可能比其\
  \ IPsec 对应物更简单：IPsec 对 IP 网络进行了根本性更改，因此安装 IPsec 软件会更改操作系统（这需要超级用户权限）。SSL 客户端软件不需要更改操作系统。此外，IPsec\
  \ 很难通过防火墙；SSL 则简单得多。\n\n#### 远程访问\n\n在远程办公和移动办公的时代，安全的远程访问是一项关键控制。这包括通过 DSL 或有线调制解调器等方式连接移动用户，回拨等安全机制，以及即时通讯和远程会议技术等较新的关注点。\n\
  \n##### ISDN\n\n综合业务数字网（ISDN）曾尝试通过“铜线对”提供数字服务，即普及于全球家庭和小型办公室的 `POTS`（普通老式电话服务）。这被称为“最后一英里”，通过（历史上为铜线对的）最后一英里提供高速数字服务一直是一个长期存在的挑战。\n\
  \nISDN 设备称为终端。ISDN 基本速率接口（BRI）服务通过铜线对提供两个 64 K 数字信道（外加一个 16K 信令信道）。PRI（主速率接口）提供二十三个\
  \ 64K 信道，外加一个 16K 信令信道。\n\nISDN 从未在家庭中得到广泛应用；它很快就被 DSL 和有线调制解调器所取代。ISDN 通常用于电话会议和视频会议。\n\
  \n##### DSL\n\n数字用户线路（DSL）拥有类似于 ISDN 的“最后一英里”解决方案：利用现有的铜线对为家庭和小型办公室提供数字服务。与 ISDN\
  \ 相比，DSL 因速度更高而获得了更广泛的应用，速度可达 10 兆比特及以上。\n\n常见的 DSL 类型包括对称数字用户线路（SDSL，上传和下载速度匹配）、非对称数字用户线路（ADSL，下载速度快于上传）和超高速数字用户线路（VDSL，具有快得多的非对称速度）。另一种选择是\
  \ HDSL（高速率 DSL），它使用两对铜线达到 SDSL 的速度；HDSL 用于提供廉价的 T1 服务。\n\n对称 DSL 也称为单线 DSL。ADSL\
  \ 的一个优势是它允许同时使用 POTS 线路，通常可从 DSL 流量中分离出来。一般来说，站点距离中心局（CO）越近，可用服务速度越快。\n\n表 5.9 总结了\
  \ DSL 的速度和模式。\n\n**表 5.9：DSL 速度和距离 [18]**\n\n| 类型 | 下载速度 | 上传速度 | 距离中心局 |\n| ---\
  \ | --- | --- | --- |\n| ADSL | 1.5–9 Mbps | 16–640 Kbps | 18,000 英尺 |\n| SDSL |\
  \ 1.544 Mbps | 1.544 Mbps | 10,000 英尺 |\n| HDSL | 1.544 Mbps | 1.544 Mbps | 10,000\
  \ 英尺 |\n| VDSL | 20–50+ Mbps | 高达 20 Mbps | <5000 英尺 |\n\n##### 有线调制解调器\n\n`Cable\
  \ modems` 由有线电视提供商用于通过宽带有线电视提供互联网接入。有线电视接入并非无处不在，但在工业化地区的大多数大城镇和城市都可用。宽带与基带不同，拥有多个信道（如电视频道），因此为网络服务分配带宽需要为此目的专用信道。有线调制解调器为有线电视公司提供了一个引人注目的“最后一英里”解决方案：他们已经投资连接了最后一英里，而互联网服务则基于该投资提供了另一条收入来源。\n\
  \n与 DSL 不同，有线调制解调器带宽通常与同一网段上的邻居共享。\n\n##### 回拨和来电显示\n\n`Callback` 是一种基于调制解调器的认证系统。创建回拨账户时，会将用户拨打的调制解调器号码录入账户。用户稍后通过调制解调器连接并进行认证。系统挂断后，再回拨到预配置的号码。\n\
  \n`Caller ID` 是一种类似的方法：除了用户名和密码外，它要求从正确的电话号码拨打。来电显示很容易被伪造：许多电话服务商允许最终用户选择任何他们想要的来电显示号码。这使得来电显示成为一种薄弱的认证形式。\n\
  \n##### 远程桌面控制台访问\n\n许多用户需要远程访问计算机的控制台。自然，应使用某种形式的安全通道，如 IPsec VPN、SSH 或 SSL 隧道，以确保连接的机密性，特别是当连接源自组织外部时。有关远程控制台访问这一层的更多详细信息，请参阅上文的“VPN”部分。\n\
  \n几十年来，使用协议远程访问控制台一直是常见做法，例如类 UNIX 操作系统上明文且认证薄弱的 rlogin 和 rsh，它们分别利用 TCP 端口 513\
  \ 和 TCP 端口 514。提供远程桌面访问的两种常见现代协议是虚拟网络计算（VNC），通常运行在 TCP 5900 上，以及远程桌面协议（RDP），通常运行在\
  \ TCP 端口 3389 上。VNC 和 RDP 允许对远程系统进行图形化访问，这与基于终端的旧式远程访问方法形成对比。RDP 是微软的专有协议。\n\n越来越多的用户期望能快速、从任意数量的个人设备通过互联网轻松访问图形化桌面。出于安全考虑，传统的基于\
  \ VNC 和 RDP 的方法通常通过 VPN 等加密通道进行隧道传输，这使得满足这些期望变得困难。\n\n这些方法的一个近期替代方案是使用反向隧道，它允许建立出站加密隧道的用户通过同一隧道连接回来。这通常需要在用户计算机上安装一个小型代理，该代理将使用\
  \ HTTPS over TCP 443 发起出站连接。该连接将终止于一台中央服务器，用户可对其进行认证（从办公室外部）以控制其办公室桌面机器。采用这种方法的两个最著名的解决方案是\
  \ GoToMyPC 和 LogMeIn。\n\n##### 桌面和应用虚拟化\n\n除了远程访问独立桌面系统外，提供对计算资源远程访问的另一种方法是通过桌面和应用虚拟化。桌面虚拟化是一种提供集中式基础设施的方法，该基础设施托管可由员工远程利用的桌面镜像。桌面虚拟化通常称为\
  \ VDI，根据相关供应商不同，代表虚拟桌面基础设施或虚拟桌面接口。VDI 也称为 DaaS（桌面即基础设施）。\n\n与提供完整桌面环境相反，组织可以选择仅虚拟化将集中提供的关键应用程序。与桌面虚拟化一样，应用虚拟化相关的集中控制允许组织实施严格的访问控制，并可能更快地修补应用程序。此外，应用虚拟化还可用于运行传统应用程序，否则这些应用程序将无法在员工使用的系统上运行。\n\
  \n\n\n\n#### 虚拟化、远程访问与协作技术\n\n虽然该方法的术语和细节相对较新，但桌面虚拟化和应用虚拟化的底层概念已以瘦客户机、大型主机和终端服务器的形式存在了几十年。无论是新方法还是传统方法，其主要前提都是：与大量更复杂的系统相比，拥有更集中、更整合的计算系统和基础设施可能会带来组织效益。除了通用的“规模经济”理由外，从受到更严格控制的桌面和应用程序环境中，也可能获得安全优势。在集中式环境中修补更复杂的应用程序可能更易于管理。同样，当有一个甚至多个中央主镜像来确定每个相应虚拟桌面的设置时，按照安全基线开发和维护桌面也会更容易实现。\n\
  \n##### 屏幕抓取\n\n屏幕抓取提供了一种对系统进行图形远程访问的方法。屏幕抓取协议将绘制被访问系统屏幕所需的信息打包并传输到用于远程访问的系统的显示器上。`VNC`（虚拟网络计算）是一种常用的远程桌面访问技术，从根本上说，它是一种屏幕抓取风格的远程访问方法。并非所有远程访问协议都构建为屏幕抓取器。例如，微软流行的`RDP`（远程桌面协议）不使用屏幕抓取来提供图形远程访问。\n\
  \n##### 多媒体协作\n\n多媒体协作包含一套技术，包括即时消息和远程会议技术。这些技术中的许多都允许文件传输、远程控制 PC、录制音频和视频，以及其他可能给组织带来风险的功能。\n\
  \n###### 即时消息\n\n即时消息允许两个或多个用户通过实时“聊天”相互通信。聊天可以是一对一的，也可以是通过聊天组进行多对多的。除了聊天之外，大多数现代即时消息软件还允许文件共享，有时还允许音频和视频会议。\n\
  \n较旧的即时消息协议包括`IRC`（互联网中继聊天）、AOL Instant Messenger 和`XMPP`（可扩展消息和状态协议，以前称为 Jabber）。这些较旧的即时消息技术通常使用明文\
  \ `TCP/IP` 协议传输数据，并且易于在网络上监控。现代即时消息解决方案（如 Google Talk、Discord 和 Slack）使用 `HTTPS`\
  \ 进行通信，并且难以监控得多。\n\n聊天软件可能面临各种安全问题，包括远程利用，必须像其他软件一样进行修补。聊天软件的文件共享功能可能允许用户通过分发敏感文档来违反策略，这些程序中的音频和视频共享功能也可能引发类似问题。组织应制定控制聊天软件使用的策略，并建立技术控制来监控并在必要时阻止其使用。\n\
  \n###### 远程会议技术\n\n*远程会议技术*是一种较新的技术，允许用户通过互联网进行在线会议，包括桌面共享功能。商业远程会议解决方案包括 Zoom、Citrix\
  \ Systems 的 GoToMeeting 和 Microsoft Live Meeting。这些技术通常包括在所有连接到会议的 PC 上显示 PowerPoint\
  \ 幻灯片、共享电子表格等文档，有时还共享音频或视频。某些解决方案允许用户远程控制另一台连接的 PC。\n\n许多此类解决方案旨在通过出站 `SSL` 或 `TLS`\
  \ 流量建立隧道，这些流量通常可以通过防火墙和任何 Web 代理。如果站点的远程访问策略要求使用强身份验证的 `IPsec VPN` 连接以允许远程控制内部 PC，这些解决方案可能会绕过现有控制（如强身份验证要求）并违反策略。应理解、控制远程会议技术的使用，并确保其符合所有适用策略。\n\
  \n##### 保护第三方连接\n\n许多组织通过 `VPN`、专线等与第三方维护外联网连接。外联网通常用于远程办公室，为合作伙伴组织提供连接，以及供应商支持。这些第三方连接代表了重大风险：第三方可能被攻破，攻击者或恶意软件可能通过外联网连接转向攻击组织本身。这些类型的连接要求组织在一定程度上信任第三方的安全性。\n\
  \n外联网连接应始终通过专线或加密 `VPN` 进行。访问控制列表（`ACL`）应严格控制可通过外联网连接访问的系统。从检测角度来看：应使用增强监控，包括检测被\
  \ `ACL` 阻止的系统的尝试连接。应在可通过外联网连接访问的系统上部署强大的基于主机的控制：修补、加固、使用双因素认证等。\n\n##### 无线应用协议\n\
  \n无线应用协议（`WAP`）旨在为智能手机等手持无线设备提供安全的 Web 服务。`WAP` 基于 `HTML`，包含 `HDML`（手持设备标记语言）。认证由无线传输层安全（`WTLS`）提供，后者基于\
  \ `TLS`。\n\n`WAP` 浏览器是一个微型浏览器，比完整的 Web 浏览器更简单，所需资源更少。它连接到 `WAP` 网关，后者是一个旨在转换网页的代理服务器。微型浏览器访问用（或转换为）`WML`（无线标记语言）编写的站点，后者基于\
  \ `XML`。\n\n> **注意**\n>\n> `WAP` 是一个重载的首字母缩略词，映射到多种技术和协议。在无线方面尤其令人困惑：`WAP` 可能代表无线接入点或无线应用协议。而\
  \ `WPA`（Wi-Fi Protected Access）字母相同但顺序不同。\n>\n> 请勿混淆这些无线协议和技术：考试会明确说明问题涉及哪一个；不要匆忙阅读问题而忽略上下文。此外，不要将\
  \ `802.11` 无线安全标准（包括 `WEP` 和 `802.11i`/`WPA2`）与手持设备 `WAP` 安全（`WTLS`）混淆。\n\n#####\
  \ 内容分发网络\n\n内容分发网络（`CDN`，也称为内容交付网络）使用一系列分布式缓存服务器来提高性能并降低下载在线内容的延迟。它们会自动确定离最终用户最近的服务器，以便用户从互联网上速度最快、距离最近的服务器下载内容。示例包括\
  \ Akamai、Amazon CloudFront、Cloudflare 和 Microsoft Azure。\n\n`CDN` 还能提高可用性，并能减轻拒绝服务攻击的影响：“虽然内容分发网络也解决了改善全球可用性和减少带宽等附带问题，但它们解决的主要问题是延迟：主机服务器接收、处理并交付页面资源（图像、CSS\
  \ 文件等）请求所需的时间。延迟主要取决于用户距离服务器有多远，并因网页包含的资源数量而加剧。\n\n例如，如果您的所有资源都托管在旧金山，而用户在伦敦访问您的页面，那么每个请求都必须从伦敦到旧金山再返回伦敦进行一次漫长的往返。如果您的网页包含\
  \ 100 个对象（这处于正常范围的低端），那么用户的浏览器必须向您的服务器发出 100 个单独的请求才能检索这些对象” [\\[19\\]](#Ch005_225-293_B9780443187346000039.xhtml#bb0100)。\n\
  \n### 考试目标总结\n\n\n\n\n\n### 通信与网络安全\n\n通信与网络安全是一个庞大且复杂的领域，要求对棘手的技术问题有广泛且有时需要深入的理解。我们的现代世界依赖于网络，而这些网络必须保持安全。不仅要理解我们为何使用分组交换网络和\
  \ OSI 模型等概念，还要理解我们如何实现这些概念。\n\n我们已经从集线器演进到提供流量隔离的交换机。我们增加了诸如 `HIDS` 和 `NIDS` 之类的检测设备，以及诸如\
  \ `HIPS` 和 `NIPS` 之类的防御设备。我们部署了诸如 `TLS` 和 `IPsec` 之类的安全协议。\n\n我们在每一步都改进了网络纵深防御，并提高了网络数据的机密性、完整性和可用性。\n\
