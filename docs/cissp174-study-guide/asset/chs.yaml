  \  \nContinuity Planning Project Team，由组织内的利益相关者组成的团队，专注于确定如果发生特定紧急事件，谁需要发挥作用。\n\
  \n**CPU**  \nCentral Processing Unit，计算机的“大脑”，能够控制和执行数学计算。\n\n**Credential Management\
  \ System**  \n实现账户凭据和密码更安全存储和使用的软件。\n\n**Criminal law**  \n受害者可视为社会本身的法律。\n\n**Crippleware**\
  \  \n部分功能的专有软件，通常禁用关键功能。用户通常需要付费以解锁全部功能。\n\n**Crisis Management Plan**  \n参见——`CMP`。\n\
  \n**CRL**  \nCertificate Revocation Lists，PKI 组件，列出已被吊销的数字证书。\n\n**Crossover** \
  \ \n遗传算法概念，结合两种算法。\n\n**Crossover Error Rate**  \n参见——`CER`。\n\n**Cross-Site Request\
  \ Forgery**  \n参见——`CSRF`。\n\n**Cross-Site Scripting**  \n参见——`XSS`。\n\n**Cryptanalysis**\
  \  \n破解加密消息（恢复其含义）的科学。\n\n**Cryptographic Protocol Governance**  \n描述为特定工作选择正确密码和实现的过程。\n\
  \n**Cryptography**  \n创建隐藏含义消息的科学。\n\n**Cryptology**  \n安全通信的科学。\n\n**CSIRT**  \n\
  Computer Security Incident Response Team，负责监控、识别和响应安全事件的团队。\n\n**CSMA**  \nCarrier\
  \ Sense Multiple Access，以太网网络用于允许共享基带网络并避免冲突的方法。\n\n**CSRF**  \nCross-Site Request\
  \ Forgery，在受信任站点的安全上下文中对静态内容的第三方重定向。\n\n**CSU/DSU**  \nChannel Service Unit/Data\
  \ Service Unit，DCE 设备。\n\n**CTR**  \nCounter，使用计数器进行反馈的 DES 流模式。\n\n**Custodian**\
  \  \n提供资产的实操保护。\n\n**Customary Law**  \n被群体普遍接受以至于被视为法律的习俗或惯例。\n\n**CWR**  \n新 TCP\
  \ 标志，Congestion Window Reduced。\n\n**Cyber Incident Response Plan**  \n旨在应对破坏性网络事件的计划，包括基于网络的攻击、蠕虫、计算机病毒和特洛伊木马。\n\
  \n**Cybersquatting**  \n注册与另一组织知识产权相关的互联网域名。\n\n\n\n\n\n## 术语表\n\n### D\n\n**DAC**\
  \ (Discretionary Access Control)：自主访问控制，赋予主体对其拥有或被授权访问的对象的完全控制权，包括与其他主体共享对象。\n\n\
  **DAD** (Disclosure, Alteration, and Destruction)：泄露、篡改和破坏，是机密性、完整性和可用性的对立面。\n\n\
  **DARPA** (Defense Advanced Research Projects Agency)：国防高级研究计划局，最初的 MILNET 和 ARPANET\
  \ 的资助者。\n\n**DAST** (Dynamic Application Security Testing)：动态应用安全测试，在代码执行过程中对其进行测试。\n\
  \n**Data at rest**：静态数据，驻留在磁盘和/或文件中的存储数据。\n\n**Data controllers**：数据控制者，在组织内创建和管理敏感数据的角色。例如人力资源员工：他们创建和管理敏感数据，如薪资福利数据、员工制裁报告等。\n\
  \n**Data Circuit-Terminating Equipment**：数据电路终接设备，参见 **DCE**。\n\n**Data Definition\
  \ Language**：数据定义语言，参见 **DDL**。\n\n**Data dictionary**：数据字典，包含数据库表的描述，包括模式、数据库视图信息，以及授权的数据库管理员和用户账户信息。\n\
  \n**Data Encryption Algorithm**：数据加密算法，参见 **DEA**。\n\n**Data Encryption Standard**：数据加密标准，参见\
  \ **DES**。\n\n**Data Execution Prevention**：数据执行保护，参见 **DEP**。\n\n**Data hiding**：数据隐藏，参见\
  \ **Encapsulation (object)**。\n\n**Data in transit**：传输中数据，也称为动态数据，指正在跨网络传输的数据。\n\
  \n**Data in use**：使用中数据，指在应用程序中正被主动使用的数据，例如用户在打开的电子表格中查看的数据。\n\n**Data link layer**：数据链路层，OSI\
  \ 模型的第 2 层，处理对物理层的访问以及局域网通信。\n\n**Data maintenance**：数据维护，保护数据的日常操作过程。\n\n**Data\
  \ Manipulation Language**：数据操作语言，参见 **DML**。\n\n**Data mining**：数据挖掘，用于在数据仓库中搜索模式，如欺诈活动。\n\
  \n**Data Owner**：数据所有者，负责确保特定数据受到保护的管理层员工。\n\n**Data processor**：数据处理者，代表数据控制者管理数据的角色。外包薪资公司是数据处理者的一个例子。\n\
  \n**Data Quality Principle**：数据质量原则，OECD 隐私准则原则之一，规定个人数据应当完整、准确，并以与数据收集目的一致的方式维护。\n\
  \n**Data remanence**：数据残留，参见 **Remanence**。\n\n**Data Terminal Equipment**：数据终端设备，参见\
  \ **DTE**。\n\n**Data warehouse**：数据仓库，大量数据的集合。\n\n**Database**：数据库，相关数据的结构化集合。\n\
  \n**Database Administrators**：数据库管理员，参见 **DBA**。\n\n**Database journal**：数据库日志，所有数据库事务的日志。若数据库损坏，可将其恢复至备份副本，随后从日志中“重放”后续事务，以恢复数据库完整性。\n\
  \n**Database Management System**：数据库管理系统，参见 **DBMS**。\n\n**Database replication**：数据库复制，镜像实时数据库，允许客户端对多个复制的数据库进行同时读写。\n\
  \n**Database shadowing**：数据库影子，两个或多个完全相同的数据库同时更新。\n\n**Database view**：数据库视图，数据库查询的结果。\n\
  \n**DBA** (Database Administrators)：数据库管理员，管理数据库的角色。\n\n**DBMS** (Database Management\
  \ System)：数据库管理系统，控制对数据库的所有访问并强制执行数据库安全策略。\n\n**DCE** (Data Circuit-Terminating\
  \ Equipment)：数据电路终接设备，用于连接 DTE 的设备，如路由器。\n\n**DCOM** (Distributed Component Object\
  \ Model)：分布式组件对象模型，跨网络定位和连接对象。\n\n**DDL** (Data Definition Language)：数据定义语言，用于创建、修改和删除表。\n\
  \n**DDoS** (Distributed Denial of Service)：分布式拒绝服务，利用多个系统发起的可用性攻击。\n\n**DEA** (Data\
  \ Encryption Algorithm)：数据加密算法，由 DES 描述。\n\n**Deadbolt**：插芯锁，一种由钥匙固定的刚性锁定机制，伸出时防止门打开或完全关闭。\n\
  \n**Decryption**：解密，将密文转换为明文。\n\n**Defense-in-depth**：纵深防御，跨越多个域应用多重防护措施以保护资产。\n\
  \n**Defined**：CMM 第 3 阶段。\n\n**Degaussing**：退磁，破坏存储介质磁化的完整性，使数据无法恢复。\n\n**Demarc**\
  \ (Demarcation point)：分界点，ISP 责任结束和客户责任开始的地点。\n\n**Demilitarized Zone**：非军事区，参见\
  \ **DMZ**。\n\n**Denial of Service**：拒绝服务，参见 **DoS**。\n\n**DEP** (Data Execution\
  \ Prevention)：数据执行保护，可在硬件和/或软件中启用，使堆栈的特定页面不可执行。\n\n**Deprovisioning**：取消配置，将资源（如用户、系统、应用程序）从运行状态中移除。\n\
  \n**Depth of field**：景深，处于聚焦状态的区域。\n\n**DES** (Data Encryption Standard)：数据加密标准，一种使用\
  \ 56 位密钥和 64 位块大小的对称分组密码。\n\n**Detection phase**：检测阶段，事件管理阶段之一，分析事件以确定其是否构成安全事件。\n\
  \n**Detective controls**：检测型控制，在攻击成功期间或之后发出警报的控制措施。\n\n**Deterrent controls**：威慑型控制，阻止用户在系统上执行操作的控制措施。\n\
  \n**Develop an IT contingency plan**：制定 IT 应急计划，NIST SP 800-34 应急规划过程的第五步。\n\n**Develop\
  \ recovery strategies**：制定恢复策略，NIST SP 800-34 应急规划过程的第四步。\n\n**Develop the contingency\
  \ planning policy statement**：制定应急规划政策声明，NIST SP 800-34 应急规划过程的第一步。\n\n**DevOps**：一种更敏捷的开发和支持模式，呼应包括\
  \ Sashimi 和 Scrum 在内的敏捷编程方法。开发人员直接支持运维职能。\n\n**DevSecOps**：开发、安全和运维：将安全集成到 DevOps\
  \ 过程中，延续对敏捷方法论的关注。\n\n**DHCP** (Dynamic Host Configuration Protocol)：动态主机配置协议，为系统分配临时\
  \ IP 地址租约，以及 DNS 和默认网关配置。\n\n**Diameter**：RADIUS 的继任者，旨在提供改进的认证、授权和审计 (AAA) 框架。\n\
  \n**Dictionary attack**：字典攻击，使用预定义单词列表（如字典）的密码破解方法，将每个单词通过哈希算法运行。\n\n**Differential\
  \ backup**：差异备份，自上次完整备份以来已更改文件的归档。\n\n**Differential cryptanalysis**：差分密码分析，寻找加密后的相关明文之间的“差异”。\n\
  \n**Diffie-Hellman Key Agreement Protocol**：Diffie-Hellman 密钥协商协议，允许双方通过公共信道在无密钥预共享的情况下安全地协商对称密钥。\n\
  \n**Diffusion**：扩散，明文的顺序应在密文中被分散。\n\n**Digital**：数字，以比特（0 和 1）传输数据的通信方式。\n\n**Digital\
  \ Rights Management**：数字版权管理，参见 **DRM**。\n\n**Digital signature**：数字签名，提供不可抵赖性，包括签名者身份认证和文档完整性证明。\n\
  \n**Digital Subscriber Line**：数字用户线路，参见 **DSL**。\n\n**Direct evidence**：直接证据，证人就其亲身经历提供的证词。\n\
  \n**Direct Sequence Spread Spectrum**：直接序列扩频，参见 **DSSS**。\n\n**Directory Path Traversal**：目录路径遍历，通过引用“../..”等目录，从\
  \ Web 服务器根目录（如 `/var/www`）逃逸到常规文件系统。\n\n**Disassembler**：反汇编器，尝试将机器语言转换为汇编语言。\n\n\
  **Disaster**：灾难，任何中断正常系统操作的破坏性事件。\n\n**Disaster Recovery Plan**：灾难恢复计划，参见 **DRP**。\n\
  \n**Disclosure, Alteration, and Destruction**：泄露、篡改和破坏，参见 **DAD**。\n\n**Discretionary\
  \ Access Control**：自主访问控制，参见 **DAC**。\n\n**Diskless workstation**：无盘工作站，包含 CPU、内存和固件但无硬盘的计算机系统，属于瘦客户端的一种。\n\
  \n**Distance vector**：距离矢量，使用简单度量（如跳数）的路由协议。\n\n**Distributed Component Object Model**：分布式组件对象模型，参见\
  \ **DCOM**。\n\n**Distributed Denial of Service**：分布式拒绝服务，参见 **DDoS**。\n\n**Distributed\
  \ Network Protocol**：分布式网络协议，参见 **DPN3**。\n\n**Distributed systems**：分布式系统，将多个位置的计算机组合在一起，视为一个逻辑系统。\n\
  \n**Divestitures**：剥离，也称为反向合并和反向收购，代表收购的另一面：一家公司分裂为两家或更多。\n\n**DML** (Data Manipulation\
  \ Language)：数据操作语言，用于查询和更新表中存储的数据。\n\n**DMZ** (Demilitarized Zone)：非军事区网络，用于隔离受信网络与非受信网络。\n\
  \n\n\n\n\n## 术语表\n\n### D\n\n**DNP3** Distributed Network Protocol，提供一种开放标准，主要用于能源领域，实现不同供应商的\
  \ SCADA 和智能电网应用之间的互操作性。\n\n**DNS** Domain Name System，一个分布式全球层级数据库，将名称转换为 IP 地址，反之亦然。\n\
  \n**DNS reflection attack** 使用第三方 DNS 服务器的欺骗性 DoS 攻击。\n\n**DNSSEC** Domain Name\
  \ Server Security Extensions，通过使用公钥加密为 DNS 响应提供认证和完整性。\n\n**Domain Name Server Security\
  \ Extensions** 见——**DNSSEC**。\n\n**Domain Name System** 见——**DNS**。\n\n**Domains\
  \ of trust** Windows Active Directory 使用的访问控制模型。\n\n**DoS** Denial of Service，针对可用性的攻击。\n\
  \n**DRAM** Dynamic Random Access Memory，将比特存储在小电容器中（如小电池），比 SRAM 更便宜但速度更慢。\n\n**DRM**\
  \ Digital Rights Management，旨在通过水印、产品密钥和区域锁定等控制手段限制受版权保护材料和其他形式知识产权的使用。\n\n**DRP**\
  \ Disaster Recovery Plan，从破坏性事件中恢复的短期计划。\n\n**DSL** Digital Subscriber Line，利用现有铜线对为家庭和小型办公室提供数字服务。\n\
  \n**DSSS** Direct Sequence Spread Spectrum，一次性使用整个无线频段。\n\n**DTE** Data Terminal\
  \ Equipment，网络“终端”，如台式机、服务器或实际终端。\n\n**DTE/DCE** 跨越分界点的连接。\n\n**Dual-factor authentication**\
  \ 见——**Strong authentication**。\n\n**Dual-homed host** 具有两个网络接口的主机：一个连接到受信网络，另一个连接到不受信网络。\n\
  \n**Due care** 要求关键组织利益相关者在履行职责时审慎行事，又称“审慎人规则”。\n\n**Due diligence** 对尽职照管的管理。\n\
  \n**Dumpster diving** 一种物理攻击，攻击者翻找垃圾，希望找到仅被丢弃而未被销毁的敏感信息。\n\n**Dynamic Host Configuration\
  \ Protocol** 见——**DHCP**。\n\n**Dynamic Application Security Testing** 见——**DAST**。\n\
  \n**Dynamic password** 定期更改的密码。\n\n**Dynamic signatures** 测量某人签名过程的生物特征控制。\n\n**Dynamic\
  \ testing** 在代码执行时对其进行测试。\n\n### E\n\n**E1** 承载 30 个信道的专用 2.048 兆比特电路。\n\n**E3**\
  \ 24 个 E1。\n\n**EAP** Extensible Authentication Protocol，一种第 2 层认证框架，描述了许多具体的认证协议。\n\
  \n**EAP-FAST** EAP-Flexible Authentication via Secure Tunneling，由 Cisco 设计用于替代 LEAP。\n\
  \n**EAP Over LAN** 见——**EAPOL**。\n\n**EAP-Transport Layer Security** 见——**EAP-TLS**。\n\
  \n**EAP Tunneled Transport Layer Security** 见——**EAP-TTLS**。\n\n**EAP-TLS** EAP-Transport\
  \ Layer Security，使用 PKI，要求服务端和客户端均持有证书。\n\n**EAP-TTLS** EAP Tunneled Transport Layer\
  \ Security，通过取消客户端证书要求简化了 EAP-TLS。\n\n**EAPOL** EAP Over LAN，一种用于多种 EAP 的第 2 层协议。\n\
  \n**ECB** Electronic Code Book mode，DES 最简单也最弱的模式。\n\n**ECE** 新的 TCP 标志，Explicit\
  \ Congestion Notification Echo。\n\n**ECPA** Electronic Communications Privacy Act，为非电话电子通信提供搜查和扣押保护。\n\
  \n**Edge computing** 分布式计算的一个组件，旨在将数据推送到网络边缘（更靠近客户）。\n\n**eDiscovery** Electronic\
  \ Discovery，指法律顾问在民事诉讼审前取证阶段获取相关 ESI（Electronically Stored Information，电子存储信息）的过程。\n\
  \n**EEPROM** Electrically-Erasable Programmable Read Only Memory，通过刷写程序实现电擦除的存储器。\n\
  \n**EF** Exposure Factor，因事件导致资产价值损失的百分比。\n\n**EGP** Exterior Gateway Protocol，互联网上使用的一种路由协议。\n\
  \n**Egress monitoring** 专注于检测基于数据离开组织的对手活动的控制措施。\n\n**Electrically-Erasable Programmable\
  \ Read Only Memory** 见——**EEPROM**。\n\n**Electronic backups** 以电子形式存储、可在破坏性事件或灾难发生时检索的数据。\n\
  \n**Electronic Code Book** 见——**ECB**。\n\n**Electronic Communications Privacy Act**\
  \ 见——**ECPA**。\n\n**Electronic Discovery** 见——**eDiscovery**。\n\n**Electronic vaulting**\
  \ 定期按计划时间间隔，以批处理方式电子传输待备份数据的过程。\n\n**Emanations** 从电子系统逸出的能量，在特定条件下可被远程监控。\n\n**Embedded\
  \ systems** 执行有限功能集的计算机。嵌入式系统示例包括 HVAC 控制器、医疗设备（如心脏监护仪或静脉滴注泵）、ATM 机和“智能”家电。\n\n\
  **Emergency Operations Center** 见——**EOC**。\n\n**Encapsulating Security Payload**\
  \ 见——**ESP**。\n\n**Encapsulation (network)** 接收来自较高网络层的信息并添加报头，将较高层信息视为数据处理。\n\n\
  **Encapsulation (object)** 包含并隐藏对象方法的细节。\n\n**Encryption** 将明文转换为密文。\n\n**End-User\
  \ License Agreement** 见——**EULA**。\n\n**End-of-Life** 见——**EOL**。\n\n**End-of-Service**\
  \ 见——**EOS**。\n\n**Enrollment** 向系统（如生物特征认证系统）注册的过程，即首次创建账户。\n\n**Enticement** 为已有意图违法者创造有利的犯罪条件。\n\
  \n**Entitlements** 授予用户的权限。\n\n**Entity integrity** 要求每个元组具有唯一且非空的主键。\n\n**Entrapment**\
  \ 一种法律抗辩，被告声称执法人员诱导其犯下原本不会犯的罪行。\n\n**EOC** Emergency Operations Center，紧急事件期间或刚结束后建立的指挥所。\n\
  \n**EOL** End-of-Life，供应商不再销售但仍提供支持的产品。\n\n**EOS** End-of-Service，供应商不再提供支持的产品。\n\
  \n**Ephemeral ports** TCP/IP 端口 1024 及以上。\n\n**EPROM** Erasable Programmable Read\
  \ Only Memory，可用紫外线擦除的存储器。\n\n**Eradication phase** 清理受损系统的事件管理阶段。\n\n**Erasable\
  \ Programmable Read Only Memory** 见——**EPROM**。\n\n**ESP** Encapsulating Security\
  \ Payload，IPsec 协议，主要通过加密数据包数据提供机密性。\n\n**Ethernet** 占主导地位的局域网技术，通过帧传输网络数据。\n\n\
  **Ethical disclosure** 私下与供应商共享漏洞信息，并在补丁可用前暂不公开发布的做法。也称为负责任披露。\n\n**Ethics** 做道德上正确的事。\n\
