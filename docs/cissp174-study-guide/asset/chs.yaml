  \  \n参见 **SQL**。\n\n**Subject**  \n信息系统上访问或更改数据的主动实体。\n\n**Substitution**  \n用一个字符替换另一个字符的加密方法。\n\
  \n**Supply Chain Risk Management (SCRM)**  \n供应链风险管理。\n\n**SVC (Switched Virtual\
