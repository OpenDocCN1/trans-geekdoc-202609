  \n## 附录：自测\n\n### 第 2 章：领域 1：安全与风险管理\n\n#### 问题 1\n**以下哪项是策略声明的示例？**\n\n1.  A. 通过加固服务器来保护\
  \ PII\n2.  B. 首先安装预加固的操作系统镜像来加固 Windows 11\n3.  C. 你可以通过选取句子中每个单词的首字母并混合数字和符号来创建强密码\n\
  4.  D. 下载 CISecurity Windows 基准并应用它\n\n**正确答案与解析：** **A**。答案 **A** 正确；策略是高层级的，避免技术细节。\n\
  \n**错误答案与解析：** **B**、**C** 和 **D**。答案 **B**、**C** 和 **D** 不正确。**B** 是程序声明。**C**\
  \ 是指南。**D** 是基线。\n\n#### 问题 2\n**以下哪项描述了通过实施安全控制所节省的资金？**\n\n1.  A. 总拥有成本\n2.  B.\
  \ 资产价值\n3.  C. 投资回报率\n4.  D. 控制节省\n\n**正确答案与解析：** **C**。答案 **C** 正确；投资回报率 (ROI)\
  \ 是通过安全控制保护资产所节省的资金数额。\n\n**错误答案与解析：** **A**、**B** 和 **D**。答案 **A**、**B** 和 **D**\
  \ 不正确。总拥有成本是实施安全控制的成本。资产价值是受保护资产的价值。控制节省是一个干扰项，它在不使用正确术语的情况下描述了 ROI。\n\n#### 问题\
  \ 3\n**根据《通用数据保护条例》(GDPR)，违规的最高罚款是多少？**\n\n1.  A. 2000 万欧元或全球收入的 4%（以较低者为准）\n2.\
  \  B. 2000 万欧元或全球收入的 4%（以较高者为准）\n3.  C. 2000 万欧元或全球利润的 4%（以较低者为准）\n4.  D. 2000 万欧元或全球利润的\
  \ 4%（以较高者为准）\n\n**正确答案与解析：** **B**。答案 **B** 正确；GDPR 最高罚款为 2000 万欧元或全球收入的 4%（以较高者为准）。\n\
  \n**错误答案与解析：** **A**、**C** 和 **D**。答案 **A**、**C** 和 **D** 不正确。最高罚款以两者中的较高者为准，且基于全球收入而非利润。\n\
  \n#### 问题 4\n**以下哪项证明身份声明？**\n\n1.  A. 认证\n2.  B. 授权\n3.  C. 问责\n4.  D. 审计\n\n**正确答案与解析：**\
  \ **A**。答案 **A** 正确；认证证明身份声明。\n\n**错误答案与解析：** **B**、**C** 和 **D**。答案 **B**、**C**\
  \ 和 **D** 不正确。授权描述主体被允许执行的操作。问责通过提供审计数据来追究用户责任。审计验证是否符合信息安全框架。\n\n#### 问题 5\n**以下哪项防止对数据的未授权更改？**\n\
  \n1.  A. 机密性\n2.  B. 完整性\n3.  C. 可用性\n4.  D. 篡改\n\n**正确答案与解析：** **B**。答案 **B** 正确；完整性防止对数据的未授权更改。\n\
  \n**错误答案与解析：** **A**、**C** 和 **D**。答案 **A**、**C** 和 **D** 不正确。机密性防止数据未授权泄露。可用性意味着系统可供正常业务使用。篡改是对数据的未授权更改：与完整性相反。\n\
  \n**使用以下场景回答问题 6–8：**\n\n\n\n\n\n### 练习题与解析\n\n#### 场景描述\n\n您的公司在线销售 Apple iPhone，平均每周获利\
  \ `$20,000`，典型的 DoS 攻击会使销售额降低 `40%`。平均每年遭受 `7` 次 DoS 攻击。可用的 DoS 缓解服务订阅费为每月 `$10,000`。经测试，您认为该服务能够缓解攻击。\n\
  \n---\n\n#### 问题 6\n\n**问题：** 在上述场景中，年发生率（ARO）是多少？\n\n**选项：**\n\n1.  A. `$20,000`\n\
  2.  B. `40%`\n3.  C. `7`\n4.  D. `$10,000`\n\n**正确答案与解析：** **C**。答案 **C** 正确；年发生率（ARO）是指一年内发生的攻击次数。\n\
  \n**错误答案解析：** **A**、**B**、**D**。答案 **A**、**B**、**D** 均不正确。`$20,000` 是资产价值（AV）。`40%`\
  \ 是暴露因子（EF）。`$10,000` 是 DoS 服务的月费（用于计算 TCO）。\n\n---\n\n#### 问题 7\n\n**问题：** 因 DoS\
  \ 攻击导致 iPhone 销售损失的年化损失期望值（ALE）是多少？\n\n**选项：**\n\n1.  A. `$20,000`\n2.  B. `$8,000`\n\
  3.  C. `$84,000`\n4.  D. `$56,000`\n\n**正确答案与解析：** **D**。答案 **D** 正确；年化损失期望值（ALE）的计算方法是先计算单次损失期望值（SLE），即资产价值（AV，`$20,000`）乘以暴露因子（EF，`40%`）。SLE\
  \ 为 `$8,000`；再乘以年发生率（ARO，`7`），得到 ALE 为 `$56,000`。\n\n**错误答案解析：** **A**、**B**、**C**。答案\
  \ **A**、**B**、**C** 均不正确。`$20,000` 是资产价值。`$8,000` 是单次损失期望值。\n\n---\n\n#### 问题 8\n\
  \n**问题：** DoS 缓解服务是一项好的投资吗？\n\n**选项：**\n\n1.  A. 是，它将自行支付费用\n2.  B. 是，`$10,000`\
  \ 低于 `$56,000` 的年化损失期望值\n3.  C. 否，年度总拥有成本高于年化损失期望值\n4.  D. 否，年度总拥有成本低于年化损失期望值\n\n\
  **正确答案与解析：** **C**。答案 **C** 正确；DoS 缓解服务的总拥有成本（TCO）高于因 DoS 攻击导致销售损失的年化损失期望值（ALE）。这意味着接受\
  \ DoS 攻击的风险（或寻找成本更低的缓解策略）费用更低。\n\n**错误答案解析：** **A**、**B**、**D**。答案 **A**、**B**、**D**\
  \ 均不正确。**A** 不正确：TCO 更高，而非更低。`$10,000` 是月度 TCO；必须计算年度 TCO 才能与 ALE 进行比较。**D** 错误：年度\
  \ TCO 更高，而非更低。\n\n---\n\n#### 问题 9\n\n**问题：** 在进行定性风险分析时，会采取以下哪个步骤？\n\n**选项：**\n\
  \n1.  A. 计算资产价值\n2.  B. 计算投资回报率\n3.  C. 完成风险分析矩阵\n4.  D. 完成年化损失期望值\n\n**正确答案与解析：**\
  \ **C**。答案 **C** 正确；风险分析矩阵使用 `1` 到 `5` 的近似值，根据可能性和后果对风险进行定性分析。\n\n**错误答案解析：** **A**、**B**、**D**。答案\
  \ **A**、**B**、**D** 均不正确。这些都是定量风险分析的步骤。\n\n---\n\n#### 问题 10\n\n**问题：** 标准与指南的区别是什么？\n\
  \n**选项：**\n\n1.  A. 标准是强制的，指南是强制的\n2.  B. 标准是建议，指南是要求\n3.  C. 标准是要求，指南是建议\n4.  D.\
  \ 标准是建议，指南是可选的\n\n**正确答案与解析：** **C**。答案 **C** 正确；标准是要求（强制性的），指南是建议。\n\n**错误答案解析：**\
  \ **A**、**B**、**D**。答案 **A**、**B**、**D** 均不正确。对于 **A**，指南是建议（compulsory 和 mandatory\
  \ 是同义词）。**B** 将建议和要求颠倒了。对于 **D**，标准是强制性的，而非建议。\n\n---\n\n#### 问题 11\n\n**问题：** 攻击者发现一栋大楼有保安看守，于是攻击隔壁没有保安的大楼。保安属于哪种控制组合？\n\
  \n**选项：**\n\n1.  A. 物理/补偿\n2.  B. 物理/检测\n3.  C. 物理/威慑\n4.  D. 物理/预防\n\n**正确答案与解析：**\
  \ **C**。答案 **C** 正确；保安起到了威慑攻击的作用。\n\n**错误答案解析：** **A**、**B**、**D**。答案 **A**、**B**、**D**\
  \ 均不正确。在不同场景下，保安可能属于这些类型中的任意一种，但根据题目描述均不正确。补偿控制用于弥补另一控制的弱点。检测控制在攻击发生期间或之后检测成功的攻击。预防控制防止成功的攻击。\n\
  \n---\n\n#### 问题 12\n\n**问题：** 在 (ISC)²® 职业道德准则中，哪一条准则应被视为最重要？\n\n**选项：**\n\n1.\
  \  A. 保护社会、公共利益、必要的公众信任和信心以及基础设施\n2.  B. 促进和保护职业\n3.  C. 光荣、诚实、公正、负责任且合法地行事\n4.\
  \  D. 为委托人提供勤勉且称职的服务\n\n**正确答案与解析：** **A**。答案 **A** 正确；保护社会、公共利益、必要的公众信任和信心以及基础设施是第一条准则，因此是\
  \ (ISC)²® 职业道德准则四条准则中最重要的一条。\n\n**错误答案解析：** **B**、**C**、**D**。答案 **B**、**C**、**D**\
  \ 均不正确。(ISC)²® 职业道德准则按重要性顺序排列。第二条要求安全专业人员光荣、诚实、公正、负责任且合法地行事。第三条要求专业人员为委托人提供勤勉且称职的服务。最后一条（即最不重要的一条）要求专业人员促进和保护职业。\n\
  \n---\n\n#### 问题 13\n\n**问题：** 哪项原则可能允许在未经版权持有者同意的情况下，为研究目的复制受版权保护的材料？\n\n**选项：**\n\
  \n1.  A. 首次销售\n2.  B. 合理使用\n3.  C. 首次特权\n4.  D. 免费稀释\n\n**正确答案与解析：** **B**。答案 **B**\
  \ 正确；合理使用通过对版权持有者对相关知识产权的专有垄断权做出某些例外规定，限制了版权持有者的权利。对于可以复制多少材料仍属于合理使用，没有明确的规则。\n\n\
  **错误答案解析：** **A**、**C**、**D**。答案 **A**、**C**、**D** 均不正确。首次销售允许受版权保护材料的合法购买者将该材料出售给另一方。首次特权和免费稀释均为虚构术语。\n\
  \n---\n\n#### 问题 14\n\n**问题：** 哪种类型的知识产权侧重于维护品牌识别度？\n\n**选项：**\n\n1.  A. 专利\n2.\
  \  B. 商业秘密\n3.  C. 版权\n4.  D. 商标\n\n**正确答案与解析：** **D**。答案 **D** 正确；商标旨在允许组织创建与公司商品或服务相关联的可识别品牌。\n\
  \n**错误答案解析：** **A**、**B**、**C**。答案 **A**、**B**、**C** 均不正确。专利与发明相关。商业秘密是组织为保持其在市场上的竞争地位而加以保护的材料。版权涵盖创意作品的表现形式。\n\
  \n---\n\n#### 问题 15\n\n**问题：** 拖放：识别下列所有对象。将左侧的所有对象拖放到右侧（图 A.1）。\n\n![图 A.1 拖放题](img/bm01-9780443187346.jpg)\n\
  \n图 A.1 拖放题。\n\n**正确答案与解析：** 文件、数据库表和税务表单是对象的示例，因此应将它们拖放到右侧（图 A.2）。\n\n\n\n\n\n\
  ![图 A.2 拖放答案。](img/bm02-9780443187346.jpg)\n\n图 A.2 拖放答案。\n\n错误答案及解析：正在运行的进程和用户是主体的示例。\n\
  \n### 第 3 章：领域 2：资产安全\n\n#### 1. 哪种类型的内存常用于 CPU 寄存器？\n\n1.  A. DRAM\n2.  B. 固件\n\
  3.  C. ROM\n4.  D. SRAM\n\n**正确答案及解析：D。** 答案 D 正确；SRAM（静态随机存取存储器）速度快且昂贵，常用于高速缓存内存，包括\
  \ CPU 寄存器。\n\n**错误答案及解析：A、B 和 C。** 答案 A、B 和 C 不正确。DRAM 比 SRAM 慢且便宜，常用作主内存。固件是 EEPROM\
  \ 等可编程逻辑器件使用的一种技术。只读存储器是一种固件，为 BIOS 等用途提供非易失性内存。\n\n#### 2. 哪种类型的固件通过紫外线擦除？\n\n\
  1.  A. EPROM\n2.  B. EEPROM\n3.  C. 闪存\n4.  D. PROM\n\n**正确答案及解析：A。** 答案 A 正确；EPROM（可擦除可编程只读存储器）通过暴露在紫外线下来擦除。\n\
  \n**错误答案及解析：B、C 和 D。** 答案 B、C 和 D 不正确。EEPROM（电可擦除可编程只读存储器）通过电子方式擦除，即通过刷写程序。闪存驱动器是一种\
  \ EEPROM，也通过电子方式擦除。PROM（可编程只读存储器）无法擦除。\n\n#### 3. 以下哪项描述了确定组织将采用标准中哪些部分的过程？\n\n\
  1.  A. 基线\n2.  B. 策略\n3.  C. 划定范围\n4.  D. 裁剪\n\n**正确答案及解析：C。** 答案 C 正确；划定范围是确定组织将采用标准中哪些部分的过程。\n\
  \n**错误答案及解析：A、B 和 D。** 答案 A、B 和 D 不正确。基线是实施防护措施的统一方式，属于管理控制。策略是高层管理指令。裁剪是为组织定制标准的过程。\n\
  \n#### 4. 哪个术语表示供应商不再销售某产品？\n\n1.  A. 停止支持\n2.  B. 遗留\n3.  C. 停止生命周期\n4.  D. 停止支持生命周期\n\
  \n**正确答案及解析：C。** 答案 C 正确；停止生命周期意味着供应商不再销售该产品，但通常仍会在一段时间内提供支持。\n\n**错误答案及解析：A、B 和\
  \ D。** 答案 A、B 和 D 不正确。停止支持（也称为停止服务生命周期）意味着供应商不再支持该产品。遗生是指不受支持设备的通用术语。\n\n#### 5.\
  \ ISO 17799 更名为什么？\n\n1.  A. BS 7799-1\n2.  B. ISO 27000\n3.  C. ISO 27001\n4. \
  \ D. ISO 27002\n\n**正确答案及解析：D。** 答案 D 正确；ISO 17799 更名为 ISO 27002。\n\n**错误答案及解析：A、B\
  \ 和 C。** 答案 A、B 和 C 不正确。BS 7799-1 是 ISO 17799 的前身。ISO 27000 是一系列信息安全标准文档。ISO 27001\
  \ 是另一个 ISO 27000 系列文档，旨在支持审计。\n\n#### 6. 以下哪项描述了数据所有者的职责？\n\n1.  A. 给系统打补丁\n2. \
  \ B. 报告可疑活动\n3.  C. 确保其文件已备份\n4.  D. 确保数据具有适当的安全标签\n\n**正确答案及解析：D。** 答案 D 正确；数据所有者确保数据具有适当的安全标签。\n\
  \n**错误答案及解析：A、B 和 C。** 答案 A、B 和 C 不正确。保管员给系统打补丁。用户应保持警惕并报告可疑活动。确保文件已备份是数据所有者职责的一个较弱答案，旨在混淆数据所有者与自主访问控制系统上的“文件所有者”。\n\
  \n#### 7. 哪个控制框架在五个域中拥有 40 个流程？\n\n1.  A. COSO\n2.  B. COBIT\n3.  C. ITIL\n4.  D.\
  \ OCTAVE\n\n**正确答案及解析：B。** 答案 B 正确；COBIT 在五个域中拥有 40 个信息技术流程。\n\n**错误答案及解析：A、C 和\
  \ D。** 答案 A、C 和 D 不正确。这些都是审计或控制框架，但只有 COBIT 在五个域中拥有 40 个流程。\n\n#### 8. OCTAVE 的哪个阶段识别漏洞并评估防护措施？\n\
  \n1.  A. 阶段 1\n2.  B. 阶段 2\n3.  C. 阶段 3\n4.  D. 阶段 4\n\n**正确答案及解析：B。** 答案 B 正确；阶段\
  \ 2 识别漏洞并评估防护措施。\n\n**错误答案及解析：A、C 和 D。** 答案 A、C 和 D 不正确。阶段 1 识别员工知识、资产和威胁。阶段 3 进行风险分析并制定风险缓解策略。OCTAVE\
  \ 中没有阶段 4。\n\n#### 9. 以下哪项是从未受物理损坏的固态硬盘安全移除数据的最佳方法？\n\n1.  A. ATA 安全擦除\n2.  B. 位级覆盖\n\
  3.  C. 退磁\n4.  D. 文件粉碎\n\n**正确答案及解析：A。** 答案 A 正确；ATA 安全擦除可可靠地从未受损的固态硬盘 (SSD) 中移除数据。\n\
  \n**错误答案及解析：B、C 和 D。** 答案 B、C 和 D 不正确。位级覆盖无法可靠地销毁固态硬盘上的所有数据。退磁对非磁性介质无效。文件粉碎（删除前覆盖文件内容）也无法可靠地销毁固态硬盘上的所有数据。\n\
  \n#### 10. 泄露哪类机密数据可能导致“对国家安全造成极其严重的损害”？\n\n1.  A. 机密\n2.  B. 秘密\n3.  C. 敏感但未分类\n\
  4.  D. 绝密\n\n**正确答案及解析：D。** 答案 D 正确；泄露绝密数据可能导致“对国家安全造成极其严重的损害”。\n\n**错误答案及解析：A、B\
  \ 和 C。** 答案 A、B 和 C 不正确。泄露机密数据可能导致“对国家安全造成损害”。泄露秘密数据可能导致“对国家安全造成严重损害”。泄露 SBU 数据不涉及国家安全，但出于其他原因很重要，包括保护个人的\
  \ PII。\n\n#### 11. 某公司将薪资服务外包给第三方公司。以下哪个角色最可能适用于该第三方薪资公司？\n\n1.  A. 数据控制者\n2.  B.\
  \ 数据处理者\n3.  C. 数据所有者\n4.  D. 数据处理器\n\n**正确答案及解析：D。** 答案 D 正确；第三方薪资公司是数据处理器的一个示例。\n\
  \n**错误答案及解析：A、B 和 C。** 答案 A、B 和 C 不正确。数据控制者是创建 PII 的人，例如人力资源部门。“数据处理者”不是一个正式术语，是一个干扰项。数据所有者是负责确保特定数据受到保护的管理层员工。\n\
  \n#### 12. 哪个管理角色负责存放数据的实际计算机，包括硬件和软件配置的安全性？\n\n1.  A. 保管员\n2.  B. 数据所有者\n3.  C.\
  \ 任务所有者\n4.  D. 系统所有者\n\n**正确答案及解析：D。** 答案 D 正确；系统所有者负责存放数据的实际计算机，包括硬件和软件配置的安全性。\n\
  \n\n\n\n\n##### 错误答案及解析：A、B 和 C\n\n答案 A、B 和 C 均不正确。保管员是提供资产实操保护的非管理人员。数据所有者是负责确保特定数据受到保护的管理层员工。任务所有者是创建信息安全计划并确保其人员配备得当、资金充足且具有组织优先级的高级管理层成员。\n\
  \n#### 13. 何种方法通过将磁带或磁盘驱动器等磁性介质暴露于强磁场中，破坏其完整性以及其中所含数据的完整性？\n\n- A. 位级覆写\n- B. 退磁\n\
  - C. 销毁\n- D. 粉碎\n\n##### 正确答案及解析：B\n\n答案 B 正确；退磁通过将磁带或磁盘驱动器等磁性介质暴露于强磁场中，破坏介质的完整性以及其中所含数据的完整性。\n\
  \n##### 错误答案及解析：A、C 和 D\n\n答案 A、C 和 D 不正确。位级覆写通过覆盖磁盘的每个扇区来移除数据。销毁通过物理方式销毁数据，例如焚烧。电子数据粉碎涉及在删除文件前覆写文件内容。\n\
  \n#### 14. 哪种相对昂贵且快速的内存使用称为“触发器”的小锁存器来存储位？\n\n- A. DRAM\n- B. EPROM\n- C. SRAM\n\
  - D. SSD\n\n##### 正确答案及解析：C\n\n答案 C 正确；SRAM 是一种相对昂贵且快速的内存，它使用称为“触发器”的小锁存器来存储位。\n\
  \n##### 错误答案及解析：A、B 和 D\n\n答案 A、B 和 D 不正确。DRAM 是一种相对便宜的内存，使用电容器。EPROM 是可擦除可编程只读存储器，可用紫外线擦除。SSD\
  \ 是固态硬盘，是 DRAM 和 EEPROM 的组合。\n\n#### 15. 哪种内存将位存储在小电容器中（像小电池一样）？\n\n- A. DRAM\n\
  - B. EPROM\n- C. SRAM\n- D. SSD\n\n##### 正确答案及解析：A\n\n答案 A 正确；DRAM 将位存储在小电容器中（像小电池一样）。\n\
  \n##### 错误答案及解析：B、C 和 D\n\n答案 B、C 和 D 不正确。EPROM 是可擦除可编程只读存储器，可用紫外线擦除。SRAM 是一种相对昂贵且快速的内存，使用称为“触发器”的小锁存器来存储位。SSD\
  \ 是固态硬盘，是 DRAM 和 EEPROM 的组合。\n\n### 第 4 章：领域 3：安全架构与工程\n\n#### 1. 哪种类型的喷淋系统最适合美术馆？\n\
  \n- A. 湿式管道\n- B. 干式管道\n- C. 淹没式\n- D. 预作用\n\n##### 正确答案及解析：D\n\n答案 D 正确；预作用喷淋系统通过要求两个独立的触发条件才能启动来降低意外喷水的几率：喷头必须打开且火灾报警必须触发。这些系统降低了误报风险，通常用于水会造成昂贵损失的区域。\n\
  \n##### 错误答案及解析：A、B 和 C\n\n答案 A、B 和 C 不正确；它们都在单一触发条件下释放水。这增加了误报导致昂贵损失的几率。\n\n####\
  \ 2. 使用犬只作为外围控制的主要缺点是什么？\n\n- A. 训练\n- B. 成本\n- C. 法律责任\n- D. 外观\n\n##### 正确答案及解析：C\n\
  \n答案 C 正确；法律责任是使用犬只作为安全控制手段的主要缺点。犬只可能误伤意外进入受控区域的人员。\n\n##### 错误答案及解析：A、B 和 D\n\n\
  答案 A、B 和 D 不正确；它们都是潜在的有效问题，但与法律责任和安全相比属于次要考量。\n\n#### 3. RSA 算法基于哪种单向函数？\n\n- A.\
  \ 椭圆曲线\n- B. 离散对数\n- C. 频率分布\n- D. 将合数分解为其素数\n\n##### 正确答案及解析：D\n\n答案 D 正确；RSA 基于将大合数分解为其素数的困难性。\n\
  \n##### 错误答案及解析：A、B 和 C\n\n答案 A、B 和 C 不正确。椭圆曲线和离散对数是其他类型的单向函数。频率分布是一种执行密码分析的方法。\n\
  \n#### 4. 以下关于数字签名的描述哪项是正确的？\n\n- A. 发送方使用公钥加密哈希值\n- B. 发送方使用私钥加密哈希值\n- C. 发送方使用公钥加密明文\n\
  - D. 发送方使用私钥加密明文\n\n##### 正确答案及解析：B\n\n答案 B 正确；发送方生成明文的哈希值，并使用私钥加密该哈希值。接收方使用公钥解密哈希值。\n\
  \n##### 错误答案及解析：A、C 和 D\n\n答案 A、C 和 D 不正确。发送方使用私钥而非公钥加密哈希值。明文是经过哈希处理的，而非加密。\n\n\
  #### 5. 对于必须采用数字签名的低功耗设备，应使用哪种算法？\n\n- A. AES\n- B. RSA\n- C. ECC\n- D. ElGamal\n\
  \n##### 正确答案及解析：C\n\n答案 C 正确；数字签名需要非对称加密。ECC 是每比特密钥长度提供最强强度的非对称算法。这允许使用较短的密钥长度，从而需要更少的\
  \ CPU 资源。\n\n##### 错误答案及解析：A、B 和 D\n\n答案 A、B 和 D 不正确。AES 是对称密码；对称密码不用于数字签名。RSA 基于将合数分解为其素数，ElGamal\
  \ 基于离散对数。这两种方法每比特提供的强度大致相同，且远弱于 ECC。\n\n#### 6. 如果你主要关注信息的机密性，应该使用哪种模型？\n\n- A.\
  \ Bell-LaPadula\n- B. Biba\n- C. Clark-Wilson\n- D. 机密性模型\n\n##### 正确答案及解析：A\n\n\
  答案 A 正确；Bell-LaPadula 模型保护数据的机密性。\n\n##### 错误答案及解析：B、C 和 D\n\n答案 B、C 和 D 不正确。Biba\
  \ 和 Clark-Wilson 是完整性模型。不存在“机密性模型”。\n\n#### 7. 在 Intel ×86 系统上，内核通常运行在哪个 CPU 特权环？\n\
  \n- A. 0 环\n- B. 1 环\n- C. 2 环\n- D. 3 环\n\n##### 正确答案及解析：A\n\n答案 A 正确；内核通常运行在 0\
  \ 环，这是系统中最受信任的部分。\n\n##### 错误答案及解析：B、C 和 D\n\n答案 B、C 和 D 不正确。1 环理论上用于不适合放在 0 环的操作系统部分。2\
  \ 环理论上用于设备驱动程序。3 环用于用户应用程序。\n\n#### 8. Linux 托管将在哪种云服务层级下提供？\n\n- A. IaaS\n- B.\
  \ IDaaS\n- C. PaaS\n- D. SaaS\n\n##### 正确答案及解析：A\n\n答案 A 正确；IaaS（基础设施即服务）提供完整的虚拟化操作系统，客户从操作系统层面向上进行配置。\n\
  \n##### 错误答案及解析：B、C 和 D\n\n答案 B、C 和 D 不正确。IDaaS（身份即服务）也称为云身份，允许组织利用云服务进行身份管理。PaaS（平台即服务）提供预配置的操作系统，客户配置应用程序。SaaS（软件即服务）从操作系统到应用程序完全配置好，客户只需使用应用程序。\n\
  \n\n\n\n\n### 练习题\n\n#### 9. 无线网络切换安全特性\n\n你正通过无线网络浏览网页。无线连接变得不可靠，因此你插入有线网络以继续浏览。在你更换物理网络时，浏览器无需任何更改。什么安全特性允许这样做？\n\
  \n1.  A. 抽象\n2.  B. 硬件分段\n3.  C. 分层\n4.  D. 进程隔离\n\n**正确答案和解释：C**。答案 **C** 正确；分层意味着一层（硬件）的变化不会直接影响非相邻层（应用）。\n\
  \n**错误答案和解释：A、B 和 D**。答案 **A**、**B** 和 **D** 不正确。抽象向用户隐藏不必要的细节，这与分层相关（但不同）。硬件分段为特定安全域提供专用硬件或硬件部分。进程隔离防止一个进程影响另一个进程的机密性、完整性或可用性。\n\
  \n#### 10. 推理攻击\n\n罪犯根据停车场进出的低流量推断某组织正在举行外勤会议，大楼内人员很少，并利用这个机会闯入大楼偷窃笔记本电脑。发起了哪种类型的攻击？\n\
  \n1.  A. 聚合\n2.  B. 电磁辐射\n3.  C. 推理\n4.  D. 维护钩子\n\n**正确答案和解释：C**。答案 **C** 正确；推理要求攻击者“填补空白”，从公开信息中推断出敏感信息。\n\
  \n**错误答案和解释：A、B 和 D**。答案 **A**、**B** 和 **D** 不正确。聚合是一种数学运算，所有问题都被问到且所有答案都被接收：不需要推导。电磁辐射是从电子设备广播出的能量。维护钩子是供应商留下的系统维护后门。\n\
  \n#### 11. EMI 问题主要影响的安全方面\n\n诸如串扰之类的 EMI 问题主要影响安全的哪个方面？\n\n1.  A. 机密性\n2.  B. 完整性\n\
  3.  C. 可用性\n4.  D. 认证\n\n**正确答案和解释：B**。答案 **B** 正确；虽然诸如串扰之类的 EMI 问题可能影响列出的所有方面，但它最常见地影响完整性。\n\
  \n**错误答案和解释：A、C 和 D**。答案 **A**、**C** 和 **D** 不正确；机密性可能受影响（例如在语音电话中听到另一个通话），极端情况下可用性和认证也可能受影响（串扰严重到导致系统停止运行）。这些场景远不如由\
  \ EMI 问题（如串扰）引起的简单完整性违规常见。\n\n#### 12. 火灾抑制系统最重要的目标\n\n火灾抑制系统最重要的目标是什么？\n\n1.  A.\
  \ 关键数据的保存\n2.  B. 人员安全\n3.  C. 建筑完整性\n4.  D. 迅速扑灭火灾\n\n**正确答案和解释：B**。答案 **B** 正确；人员安全是物理（环境）安全领域的首要关注点。\n\
  \n**错误答案和解释：A、C 和 D**。答案 **A**、**C** 和 **D** 不正确；这些都是有效的关注点，但不如安全重要。数据保护始终是次于安全的次要关注点；这就是为什么水是推荐的灭火剂。建筑完整性和迅速扑灭火灾也很重要并影响安全，但安全本身是目标，因此是更有力的答案。例如，空楼的完整性是次要关注点，虽然扑灭火灾的速度很重要，但必须撤离的人员安全是更重要的关注点。扑灭火灾最快的方法是切断氧气，这对人来说是致命的。\n\
  \n#### 13. 容器与虚拟机的对比\n\n关于容器和虚拟机，以下哪项陈述是正确的？\n\n1.  A. 容器和虚拟机都共享同一个内核\n2.  B. 虚拟机共享同一个内核；容器使用自己的内核\n\
  3.  C. 容器共享同一个内核；虚拟机使用自己的内核\n4.  D. 容器和虚拟机都使用自己的内核\n\n**正确答案和解释：C**。答案 **C** 正确；容器共享同一个内核，虚拟机使用自己的内核。\n\
  \n**错误答案和解释：A、B 和 D**。答案 **A**、**B** 和 **D** 不正确。\n\n#### 14. 不可否认性的最佳描述\n\n不可否认性最好描述为？\n\
  \n1.  A. 证明用户执行了事务\n2.  B. 证明事务未被更改\n3.  C. 认证事务\n4.  D. 证明用户执行了未被更改的事务\n\n**正确答案和解释：D**。答案\
  \ **D** 正确；不可否认性是用户执行了事务的证明，也是事务未被更改的证明。\n\n**错误答案和解释：A、B 和 C**。答案 **A**、**B** 和\
  \ **C** 不正确。证明事务未被更改是不可否认性的一半；证明用户执行了事务是另一半。不可否认性需要两者兼备。认证事务是用户执行了事务的另一种说法，也只是不可否认性的一半。\n\
  \n#### 15. 热点题：数字签名验证\n\n热点题：你收到来自 Roy Batty 的以下签名邮件。你确定该邮件不真实，或自发送以来已被更改。点击本地生成的、证明邮件缺乏不可否认性的消息摘要（图\
  \ A.3）。\n\n![图 A.3 热点题](img/bm03-9780443187346.jpg)\n\n图 A.3 热点题。\n\n**正确答案和解释**：哈希算法（如\
  \ `SHA-1`）的输出称为消息摘要。下图右上角的消息摘要是本地生成的哈希值，它与使用创建者公钥解密数字签名后接收到的原始哈希值不匹配（图 A.4）。\n\n\
  ![图 A.4 热点题答案](img/bm04-9780443187346.jpg)\n\n图 A.4 热点题答案。\n\n**错误答案和解释**：热点题的其他可点击区域不是证明邮件缺乏不可否认性的本地生成哈希值。\n\
  \n### 第 5 章：领域 4：通信与网络安全\n\n#### 1. 音频流服务器协议选择\n\n对于音频流服务器，可以接受一定的丢包，应使用哪种协议？\n\n\
  1.  A. IP\n2.  B. ICMP\n3.  C. TCP\n4.  D. UDP\n\n**正确答案和解释：D**。答案 **D** 正确；`UDP`\
  \ 用于可接受一定丢包的高速应用。\n\n**错误答案和解释：A、B 和 C**。答案 **A**、**B** 和 **C** 不正确。`IP` 是承载协议，需要像\
  \ `UDP` 这样的高层协议来支持应用。`ICMP` 是辅助协议，不承载应用数据。`TCP` 是可靠但较慢的协议，当需要速度且可接受丢包时不是最佳选择。\n\n\
  #### 2. 使用固定长度单元传输数据的网络技术\n\n什么网络技术使用固定长度单元来传输数据？\n\n1.  A. ARCNET\n2.  B. ATM\n\
  3.  C. Ethernet\n4.  D. FDDI\n\n**正确答案和解释：B**。答案 **B** 正确；`ATM` 是一种使用 53 字节固定长度单元的网络技术。\n\
  \n**错误答案和解释：A、C 和 D**。答案 **A**、**C** 和 **D** 不正确。`ARCNET` 传递令牌。`Ethernet` 使用帧。`FDDI`\
  \ 也使用令牌。\n\n#### 3. SSH 服务器监听端口和协议\n\nSecure Shell（`SSH`）服务器监听什么端口和协议？\n\n1.  A.\
  \ TCP 端口 20\n2.  B. TCP 端口 21\n3.  C. TCP 端口 22\n4.  D. TCP 端口 23\n\n**正确答案和解释：C**。答案\
  \ **C** 正确；`SSH` 服务器监听 `TCP` 端口 22。\n\n**错误答案和解释：A、B 和 D**。答案 **A**、**B** 和 **D**\
  \ 不正确。`FTP` 使用 `TCP` 端口 20 和 21。`Telnet` 使用 `TCP` 端口 23。\n\n\n\n\n\n### 网络与安全知识问答\n\
  \n#### 4. 哪种网络线缆类型能在最长距离传输最多数据？\n\n1. A. 同轴电缆\n2. B. 光纤\n3. C. 屏蔽双绞线 (STP)\n4. D.\
  \ 非屏蔽双绞线 (UTP)\n\n**正确答案及解析：B**。答案 B 正确；光纤网络线缆能传输最多数据且距离最远。\n\n**错误答案及解析：A、C、D**。答案\
  \ A、C、D 错误。在这四个选项中，STP 和 UTP 传输距离最短。同轴电缆传输数据量和距离虽比双绞线强，但远不及光纤。\n\n---\n\n#### 5.\
  \ 哪个设备工作在 OSI 模型的第 2 层？\n\n1. A. 集线器\n2. B. 防火墙\n3. C. 交换机\n4. D. 路由器\n\n**正确答案及解析：C**。答案\
  \ C 正确；交换机工作在 OSI 模型的第 2 层（数据链路层）。\n\n**错误答案及解析：A、B、D**。答案 A、B、D 错误。集线器工作在第 1 层（物理层）。包过滤和状态检测防火墙工作在第\
  \ 3、4 层，电路级代理（如 SOCKS）工作到第 5 层（会话层），应用层代理工作到第 7 层（应用层）。路由器工作在第 3 层（网络层）。\n\n---\n\
  \n#### 6. OSI 模型各层名称自底向上的正确顺序是什么？\n\n1. A. 物理层、数据链路层、传输层、网络层、会话层、表示层、应用层\n2. B.\
  \ 物理层、网络层、数据链路层、传输层、会话层、表示层、应用层\n3. C. 物理层、数据链路层、网络层、传输层、会话层、表示层、应用层\n4. D. 物理层、数据链路层、网络层、传输层、表示层、会话层、应用层\n\
  \n**正确答案及解析：C**。答案 C 正确；OSI 模型自底向上为：物理层、数据链路层、网络层、传输层、会话层、表示层、应用层。可用助记符 \"Please\
  \ Do Not Throw Sausage Pizza Away\" 记忆。\n\n**错误答案及解析：A、B、D**。答案 A、B、D 错误。顺序均不正确。\n\
  \n---\n\n#### 7. 以下哪种认证协议使用三次握手认证？\n\n1. A. CHAP\n2. B. EAP\n3. C. Kerberos\n4.\
  \ D. PAP\n\n**正确答案及解析：A**。答案 A 正确；CHAP（挑战握手认证协议）使用三次握手认证。\n\n**错误答案及解析：B、C、D**。答案\
  \ B、C、D 错误。EAP 是可扩展认证协议，描述多种认证方法的框架。Kerberos 是使用票据的单点登录系统。PAP 是密码认证协议，比 CHAP 更简单（步骤更少）。\n\
  \n---\n\n#### 8. 限制蓝牙设备发现依赖于什么的保密性？\n\n1. A. MAC 地址\n2. B. 对称密钥\n3. C. 私钥\n4. D.\
  \ 公钥\n\n**正确答案及解析：A**。答案 A 正确；限制蓝牙设备发现依赖于 48 位蓝牙 MAC 地址的保密性。\n\n**错误答案及解析：B、C、D**。答案\
  \ B、C、D 错误。虽然 E0 是对称密码，但不用于限制发现（用于加密数据）。公钥或私钥也不用于蓝牙发现。\n\n---\n\n#### 9. 哪种无线安全协议也称为\
  \ RSN（强健安全网络），且实现了完整的 802.11i 标准？\n\n1. A. AES\n2. B. WEP\n3. C. WPA\n4. D. WPA2\n\
  \n**正确答案及解析：D**。答案 D 正确；WPA2（Wi-Fi Protected Access 2）实现了 802.11i 标准定义的 AES 和 CCMP（计数器模式\
  \ CBC-MAC 协议）。\n\n**错误答案及解析：A、B、C**。答案 A、B、C 错误。AES 是 WPA2 的一部分，WPA2 还包含 CCMP，因此\
  \ WPA2 是更完整的答案。WEP 是有线等效隐私，一种过时且不安全的协议。WPA 使用 RC4 和 TKIP，安全性低于 WPA2。\n\n---\n\n\
  #### 10. TCP/IP 封装的正确顺序是什么？\n\n1. A. 数据、段、包、帧、比特\n2. B. 数据、帧、段、包、比特\n3. C. 数据、帧、包、段、比特\n\
  4. D. 数据、包、段、帧、比特\n\n**正确答案及解析：A**。答案 A 正确：TCP/IP 封装的正确顺序是数据、段、包、帧、比特。\n\n**错误答案及解析：B、C、D**。答案\
  \ B、C、D 均错误。列出的 TCP/IP 封装顺序不正确。\n\n---\n\n#### 11. HDLC 和 SDLC 都支持哪种传输模式？\n\n1.\
  \ A. 异步平衡模式 (ABM)\n2. B. 异步响应模式 (ARM)\n3. C. 正常平衡模式 (NBM)\n4. D. 正常响应模式 (NRM)\n\n\
  **正确答案及解析：D**。答案 D 正确；HDLC 和 SDLC 都支持正常响应模式 (NRM)，即从节点在获得主节点许可后才能发送。\n\n**错误答案及解析：A、B、C**。答案\
  \ A、B、C 错误。HDLC 支持异步平衡模式 (ABM) 和异步响应模式 (ARM)，而 SDLC 不支持。不存在正常平衡模式 (NBM)。\n\n---\n\
  \n#### 12. 哪种 EAP 类型最安全？\n\n1. A. EAP-TLS\n2. B. EAP-TTLS\n3. C. LEAP\n4. D. PEAP\n\
  \n**正确答案及解析：A**。答案 A 正确；EAP-TLS 是最安全（且成本最高）的 EAP 形式，因为它要求服务端和客户端都使用证书。\n\n**错误答案及解析：B、C、D**。答案\
  \ B、C、D 错误。EAP-TTLS 和 PEAP 类似，不需要客户端证书。LEAP 是思科专有协议，不需要客户端证书，且存在根本安全弱点。\n\n---\n\
  \n#### 13. 哪种 WAN 协议没有错误恢复机制，依赖高层协议提供可靠性？\n\n1. A. ATM\n2. B. 帧中继\n3. C. SMDS\n\
  4. D. X.25\n\n**正确答案及解析：B**。答案 B 正确；帧中继是一种第 2 层分组交换 WAN 协议，没有错误恢复功能。\n\n**错误答案及解析：A、C、D**。答案\
  \ A、C、D 错误。ATM 和 SMDS 是基于信元的 WAN 协议，提供纠错。X.25 是类似帧中继的分组交换协议，但 X.25 具有错误恢复功能。\n\n\
  ---\n\n#### 14. ZigBee 在美国使用什么频率？\n\n1. A. 784 MHz 和 2.4 MHz\n2. B. 868 MHz 和 2.4\
  \ MHz\n3. C. 915 MHz 和 2.4 MHz\n4. D. 2.4 MHz 和 6 MHz\n\n**正确答案及解析：C**。答案 C 正确；ZigBee\
  \ 在美国使用 915 MHz 和 2.4 MHz。\n\n**错误答案及解析：A、B、D**。答案 A、B、D 错误。中国使用 784 MHz，欧洲使用 868\
  \ MHz，5 MHz 不为 ZigBee 使用。\n\n---\n\n#### 15. 通过 IPv4 网络访问 IPv6 网络称为什么？\n\n1. A.\
  \ CIDR\n2. B. NAT\n3. C. Translation\n4. D. Tunneling\n\n**正确答案及解析：D**。答案 D 正确；通过\
  \ IPv4 网络访问 IPv6 网络称为隧道技术。\n\n**错误答案及解析：A、B、C**。答案 A、B、C 错误。CIDR 是无类别域间路由，一种创建灵活子网的方法。NAT\
  \ 是网络地址转换，用于 IP 地址互转。Translation 是干扰选项。\n\n---\n\n### 第 6 章：领域 5：身份与访问管理\n\n####\
  \ 1. 哪种密码破解攻击在给定足够时间后总会成功？\n\n1. A. 暴力破解\n2. B. 字典攻击\n3. C. 混合攻击\n4. D. 彩虹表攻击\n\n\
  **正确答案及解析：A**。答案 A 正确；给定足够时间，暴力破解攻击总会成功。\n\n\n\n\n\n##### 错误答案及解析\n\n*B*、*C* 和 *D*。答案\
  \ *B*、*C* 和 *D* 均不正确。字典攻击只能破解存在于字典或单词列表中的密码。混合攻击会在字典单词的后面追加、前面前置或修改字符。彩虹表使用预计算的哈希值。并非所有彩虹表都是完整的，且彩虹表对加盐哈希的效果较差。\n\
  \n#### 1. 密码破解和密码猜测有什么区别？\n\n1.  A. 它们是相同的\n2.  B. 密码猜测尝试登录系统；密码破解尝试确定用于创建哈希的密码\n\
  3.  C. 密码猜测使用盐值；密码破解不使用\n4.  D. 密码破解有账户锁定风险，密码猜测没有\n\n##### 正确答案及解析\n\n**B**。答案\
  \ *B* 正确；密码破解依赖于破解密码的哈希值；密码猜测尝试登录系统。\n\n##### 错误答案及解析\n\n*A*、*C* 和 *D*。*A* 不正确：密码猜测与密码破解不同。*C*\
  \ 不正确，因为盐值是密码破解的问题，而非密码猜测的问题。*D* 不正确：密码猜测存在账户锁定风险。\n\n#### 2. 同一系统上的两个用户拥有相同的密码，但\
  \ `/etc/shadow` 文件中存储的哈希值不同。哈希值不同的最可能原因是什么？\n\n1.  A. 用户名不同，所以哈希值会不同\n2.  B. 使用了多种哈希算法\n\
  3.  C. 使用了彩虹表\n4.  D. 使用了盐值\n\n##### 正确答案及解析\n\n**D**。答案 *D* 正确；盐值是一个与用户密码一起进行哈希运算的随机数，这使得两个密码相同的用户极不可能拥有相同的哈希值。\n\
  \n##### 错误答案及解析\n\n*A*、*B* 和 *C*。答案 *A*、*B* 和 *C* 均不正确。在大多数系统中，不同的用户名不会影响密码哈希。在同一系统上使用多种哈希算法是可能的，但不太可能。彩虹表不用于创建哈希；它们作为数据库，包含大多数或所有可能密码的哈希输出。\n\
  \n#### 3. 哪种认证方法会以明文形式暴露密码？\n\n1.  A. CHAP\n2.  B. Kerberos\n3.  C. PAP\n4.  D.\
  \ SESAME\n\n##### 正确答案及解析\n\n**C**。答案 *C* 正确；密码认证协议 (PAP) 在网络上以明文形式暴露密码。\n\n#####\
  \ 错误答案及解析\n\n*A*、*B* 和 *D*。答案 *A*、*B* 和 *D* 均不正确。CHAP、Kerberos 和 SESAME 均不会暴露明文密码。\n\
  \n#### 4. 视网膜扫描和虹膜扫描的主要区别是什么？\n\n1.  A. 视网膜扫描无创，虹膜扫描有创\n2.  B. 虹膜扫描侵犯个人隐私，视网膜扫描不侵犯\n\
  3.  C. 虹膜扫描随个人健康状况变化，视网膜扫描稳定\n4.  D. 视网膜扫描随个人健康状况变化，虹膜扫描稳定\n\n##### 正确答案及解析\n\n\
  **D**。答案 *D* 正确；视网膜中的血管可能因特定健康状况而发生变化。\n\n##### 错误答案及解析\n\n*A*、*B* 和 *C*。*A* 不正确，因为视网膜扫描是有创的——它们可能泄露用户健康信息。*B*\
  \ 不正确，因为虹膜扫描无创。*C* 不正确，因为虹膜扫描（相对而言）稳定，不受尝试访问用户的总体健康状况影响。\n\n#### 5. 组织在实施基于角色的访问控制\
  \ (RBAC) 时，需要做出的最重要的决定是什么？\n\n1.  A. 确定每个用户的安全许可\n2.  B. 明确定义用户在系统中的角色\n3.  C. 明确标记用户的数据\n\
  4.  D. 用户必须在 IT 系统中相互隔离，以防止敏感数据泄露\n\n##### 正确答案及解析\n\n**B**。答案 *B* 正确；在基于角色的访问控制\
  \ (RBAC) 中，必须明确定义用户的角色，以便根据这些角色限制对数据的访问，符合组织策略。\n\n##### 错误答案及解析\n\n*A*、*C* 和 *D*。答案\
  \ *A* 不正确，因为在 RBAC 中不考虑用户的许可。答案 *C* 不正确，因为 MAC 会给每个对象打标签并将其与主体的许可进行比较，而非 RBAC。答案\
  \ *D* 不正确，因为在 RBAC 中用户不会相互隔离。\n\n#### 6. 哪种访问控制方法在授予访问权限前，可以审查诸如尝试访问时间等额外因素？\n\n\
  1.  A. 自主访问控制\n2.  B. 基于属性的访问控制\n3.  C. 基于角色的访问控制\n4.  D. 基于规则的访问控制\n\n##### 正确答案及解析\n\
  \n**B**。答案 *B* 正确；基于属性的访问控制 (ABAC) 允许考虑无数额外因素，包括尝试访问时间等要素，以做出访问控制决策。\n\n##### 错误答案及解析\n\
  \n*A*、*C* 和 *D*。答案 *A*、*C* 和 *D* 均不正确。自主访问控制涉及由主体控制对对象的访问，主体对其创建或被授予完全控制权的对象拥有完全控制权。基于角色的控制基于主体的角色。基于规则的访问控制考虑管控访问决策的已定义规则，最常与防火墙或类似类型的控制相关联。\n\
  \n#### 7. 哪种服务被称为云身份，并允许组织利用云服务进行身份管理？\n\n1.  A. IaaS\n2.  B. IDaaS\n3.  C. PaaS\n\
  4.  D. SaaS\n\n##### 正确答案及解析\n\n**B**。答案 *B* 正确；身份即服务 (IDaaS)，也称为云身份，允许组织利用云服务进行身份管理。\n\
  \n##### 错误答案及解析\n\n*A*、*C* 和 *D*。答案 *A*、*C* 和 *D* 均不正确。IaaS（基础设施即服务）提供完整的虚拟化操作系统，由客户从操作系统层面向上进行配置。PaaS（平台即服务）提供预配置的操作系统，由客户配置应用程序。SaaS（软件即服务）从操作系统到应用程序均已完全配置，客户只需使用应用程序即可。\n\
  \n#### 8. 第二类生物特征错误还被称为？\n\n1.  A. 交叉错误率 (CER)\n2.  B. 等错误率 (EER)\n3.  C. 错误接受率\
  \ (FAR)\n4.  D. 错误拒绝率 (FRR)\n\n##### 正确答案及解析\n\n**C**。答案 *C* 正确；错误接受率 (FAR) 被称为第二类错误。请记住，错误拒绝通常比错误接受更严重，且\
  \ II 大于 I。\n\n##### 错误答案及解析\n\n*A*、*B* 和 *D*。答案 *A*、*B* 和 *D* 均不正确。交叉错误率 (CER) 和等错误率\
  \ (EER) 是同义词，用于衡量生物特征系统的准确性。错误拒绝率 (FRR) 是第一类错误。\n\n#### 9. 在 Kerberos 中，哪个部分是单点故障？\n\
  \n1.  A. 票据授予票据\n2.  B. 领域\n3.  C. 密钥分发中心\n4.  D. 客户端-服务器会话密钥\n\n##### 正确答案及解析\n\
  \n**C**。*C* 是正确答案，因为 KDC 是 Kerberos 中唯一能够认证主体的服务。如果 KDC 失去可用性，则不会签发票据授予票据，也无法进行新的认证。\n\
  \n##### 错误答案及解析\n\n*A*、*B* 和 *D*。*A* 不正确，因为 TGT 是由主体从 KDC 接收的。*B* 不正确，因为领域是共享认证的\
  \ Kerberos 网络。*D* 不正确，因为可以签发新的 C-S 会话密钥。\n\n#### 10. 什么是用于交换安全信息（包括认证数据）的基于 XML\
  \ 的框架？\n\n1.  A. Kerberos\n2.  B. OpenID\n\n\n\n\n\n##### 3. C. SAML\n\n##### 4.\
  \ D. TACACS\n\n**正确答案与解析：** `C`。答案 `C` 正确；SAML 是一种基于 XML 的框架，用于交换安全信息，包括认证数据。\n\n\
  **错误答案与解析：** `A`、`B` 和 `D`。答案 `A`、`B` 和 `D` 不正确。Kerberos 是一种第三方认证服务，可用于支持单点登录。OpenID\
  \ 是一种用于交换认证数据的框架，但并非基于 XML。TACACS 是一种集中式访问控制系统，要求用户发送 ID 和静态（可重用）密码进行认证。\n\n####\
  \ 12. 哪种认证协议利用令牌来传达身份信息详情？\n\n##### A. OAuth\n\n##### B. OIDC\n\n##### C. SAML\n\
  \n##### D. Kerberos\n\n**正确答案与解析：** `B`。答案 `B` 正确；OpenID Connect (OIDC) 采用令牌（如 ID\
  \ 令牌），并被定义为一种认证协议。\n\n**错误答案与解析：** `A`、`C` 和 `D`。答案 `A`、`C` 和 `D` 不正确。OAuth 确实使用令牌，但它提供的是授权而非认证。SAML\
  \ 和 Kerberos 都可被视为认证协议，但两者均不使用令牌来传达身份信息。SAML 使用断言，而 Kerberos 通过票据运作。\n\n#### 13.\
  \ 服务器 A 信任服务器 B。服务器 B 信任服务器 C。因此服务器 A 信任服务器 C。什么术语描述了这种信任关系？\n\n##### A. 域信任\n\n\
  ##### B. 林信任\n\n##### C. 非传递信任\n\n##### D. 传递信任\n\n**正确答案与解析：** `D`。`D` 是正确答案。传递信任存在于两个合作伙伴及其所有合作伙伴之间。例如：如果\
  \ A 信任 B，在传递信任中，A 将信任 B 以及 B 的所有信任合作伙伴。\n\n**错误答案与解析：** `A`、`B` 和 `C`。域信任和林信任是不那么具体的术语，不一定要求是传递的。非传递信任是传递信任的反面。\n\
  \n#### 14. 一项规定用户在尝试查看数据前必须有业务需求的策略，是强制执行什么的示例？\n\n##### A. 最小权限\n\n##### B. 需知原则\n\
  \n##### C. 职责轮换\n\n##### D. 职责分离\n\n**正确答案与解析：** `B`。答案 `B` 正确；需知原则意味着用户在访问特定对象前必须有访问该对象的需求（要求）。\n\
  \n**错误答案与解析：** `A`、`C` 和 `D`。答案 `A`、`C` 和 `D` 不正确。最小权限比需知原则粒度更粗：用户拥有完成工作所需的最小权限，但对象通常仍被分组在一起（例如允许备份管理员访问所有备份磁带）。职责分离旨在将敏感任务分配给多个主体。职责轮换旨在缓解串通舞弊。\n\
  \n#### 15. 在指纹扫描系统中，什么技术会提高误接受率 (FAR) 并降低误拒率 (FRR)？\n\n##### A. 减少验证的细节特征点数量\n\n\
  ##### B. 增加验证的细节特征点数量\n\n##### C. 延长注册时间\n\n##### D. 降低吞吐时间\n\n**正确答案与解析：** `A`。答案\
  \ `A` 正确；减少验证的细节特征点数量会降低系统的准确性，从而降低误拒但提高误接受。\n\n**错误答案与解析：** `B`、`C` 和 `D`。答案 `B`、`C`\
  \ 和 `D` 不正确。增加验证的细节特征点数量会提高系统准确性，增加 FRR 并降低 FAR。注册时间和吞吐时间与 FAR 和 FRR 没有直接关联。\n\n\
  ### 第 7 章：领域 6：安全评估与测试\n\n#### 1. 什么过程涉及构建脚本或工具，以模拟应用程序中通常执行的活动？\n\n##### A. 测试覆盖率分析\n\
  \n##### B. 误用用例测试\n\n##### C. 合成事务\n\n##### D. 渗透测试\n\n**正确答案与解析：** `C`。答案 `C` 正确；合成事务涉及构建脚本或工具，以模拟应用程序中通常执行的活动。\n\
  \n**错误答案与解析：** `A`、`B` 和 `D`。答案 `A`、`B` 和 `D` 不正确。测试覆盖率分析旨在确定已测试的应用程序百分比。误用用例测试旨在模拟异常用户行为。渗透测试旨在确定攻击者是否能渗透组织。\n\
  \n#### 2. 用于衡量可用性的安全指标是什么？\n\n##### A. 关键正常运行时间指标\n\n##### B. 关键风险指标\n\n##### C.\
  \ 关键绩效指标\n\n##### D. 关键响应指标\n\n**正确答案与解析：** `C`。答案 `C` 正确；关键绩效指标 (KPI) 可用于衡量可用性。\n\
  \n**错误答案与解析：** `A`、`B` 和 `D`。答案 `A`、`B` 和 `D` 不正确。关键风险指标 (KRI) 用于衡量风险。关键正常运行时间指标和关键响应指标是干扰项，并非通用知识体系\
  \ (CBK) 中的有效术语。\n\n#### 3. 什么过程旨在自动化渗透测试，且通常 24/7/365 全天候运行？\n\n##### A. 误用用例测试\n\
  \n##### B. 合成事务\n\n##### C. 违规攻击模拟\n\n##### D. 测试覆盖率分析\n\n**正确答案与解析：** `C`。答案 `C`\
  \ 正确；违规攻击模拟 (BAS) 可自动化渗透测试，且通常 24/7/365 全天候运行。\n\n**错误答案与解析：** `A`、`B` 和 `D`。答案\
  \ `A`、`B` 和 `D` 不正确。误用用例测试旨在模拟异常用户行为。合成事务旨在模拟正常行为。测试覆盖率分析旨在确定已测试的应用程序百分比。\n\n####\
  \ 4. 哪种渗透测试不掌握任何外部或受信信息，仅凭公开信息发起攻击？\n\n##### A. 全知晓\n\n##### B. 部分知晓\n\n##### C.\
  \ 灰盒\n\n##### D. 零知晓\n\n**正确答案与解析：** `D`。答案 `D` 正确；零知晓测试不掌握任何外部或受信信息，仅凭公开信息发起攻击。\n\
  \n**错误答案与解析：** `A`、`B` 和 `C`。答案 `A`、`B` 和 `C` 不正确。全知晓测试（也称水晶盒测试）向渗透测试人员提供内部信息，包括网络图、策略和程序，有时还包括之前渗透测试人员的报告。灰盒不是考试中的有效术语。部分知晓测试介于零知晓和全知晓之间：渗透测试人员接收一些有限的受信信息。\n\
  \n#### 5. 哪种评估类型最能证明组织符合 PCI-DSS（支付卡行业数据安全标准）？\n\n##### A. 审计\n\n##### B. 渗透测试\n\
  \n##### C. 安全评估\n\n##### D. 漏洞评估\n\n**正确答案与解析：** `A`。答案 `A` 正确；审计用于验证是否符合已发布的规范。\n\
  \n**错误答案与解析：** `B`、`C` 和 `D`。答案 `B`、`C` 和 `D` 不正确。渗透测试旨在确定攻击者是否能渗透组织。安全评估是评估访问控制有效性的整体方法。漏洞评估旨在发现环境中的错误配置和缺失补丁。\n\
  \n#### 6. 哪种测试类型向渗透测试人员提供内部信息，包括网络图、策略和程序，有时还包括之前渗透测试人员的报告？\n\n##### A. 全知晓\n\n\
  ##### B. 部分知晓\n\n##### C. 灰盒\n\n##### D. 零知晓\n\n\n\n\n\n##### 正确答案与解析：A\n\n答案 `A`\
  \ 正确；全知识测试向渗透测试人员提供内部信息，包括网络图、策略和程序，有时还包括之前渗透测试人员的报告。\n\n##### 错误答案与解析：B、C 和 D\n\
  \n答案 `B`、`C` 和 `D` 不正确。部分知识测试介于零知识和全知识之间：渗透测试人员接收一些有限的可信信息。灰盒不是考试中的有效术语。零知识测试开始时没有任何外部或可信信息，仅使用公开信息开始攻击。\n\
  \n#### 7. 什么可用于确保软件满足客户的运营需求？\n\n1.  A. 集成测试\n2.  B. 安装测试\n3.  C. 验收测试\n4.  D. 单元测试\n\
  \n##### 正确答案与解析：C\n\n答案 `C` 正确；验收测试旨在确保软件满足客户的运营需求。\n\n##### 错误答案与解析：A、B 和 D\n\n\
  答案 `A`、`B` 和 `D` 不正确。集成测试测试多个软件组件在组合成工作系统时的表现。安装测试测试软件在安装和首次运行时的表现。单元测试是对软件组件（如函数、过程或对象）的低级测试。\n\
  \n#### 8. 什么术语描述了一种无技术或低技术含量的方法，利用人类思维绕过安全控制？\n\n1.  A. 模糊测试\n2.  B. 社会工程学\n3. \
  \ C. 战争拨号\n4.  D. 零知识测试\n\n##### 正确答案与解析：B\n\n答案 `B` 正确；社会工程学是一种无技术或低技术含量的方法，利用人类思维绕过安全控制。\n\
  \n##### 错误答案与解析：A、C 和 D\n\n答案 `A`、`C` 和 `D` 不正确。模糊测试是一种黑盒测试类型，将随机畸形数据作为输入输入软件程序，以确定它们是否会崩溃。战争拨号使用调制解调器拨打一系列电话号码，寻找应答调制解调器的载波音。零知识渗透测试开始时没有任何外部或可信信息，仅使用公开信息开始攻击。\n\
  \n#### 9. 什么术语描述了一种黑盒测试方法，旨在识别并测试所有软件输入的唯一组合？\n\n1.  A. 组合软件测试\n2.  B. 动态应用安全测试\n\
  3.  C. 误用用例测试\n4.  D. 静态应用安全测试\n\n##### 正确答案与解析：A\n\n答案 `A` 正确；组合软件测试是一种黑盒测试方法，旨在识别并测试所有软件输入的唯一组合。\n\
  \n##### 错误答案与解析：B、C 和 D\n\n答案 `B`、`C` 和 `D` 不正确。动态应用安全测试在代码执行时对其进行测试。误用用例测试正式建模对手滥用应用程序如何实现安全影响。静态应用安全测试被动地测试代码；代码不运行。这包括演练、语法检查和代码审查。\n\
  \n#### 10. 什么术语描述了一种确定访问控制有效性的整体方法，且范围广泛？\n\n1.  A. 安全评估\n2.  B. 安全审计\n3.  C. 渗透测试\n\
  4.  D. 漏洞评估\n\n##### 正确答案与解析：A\n\n答案 `A` 正确；安全评估是一种确定访问控制有效性的整体方法，且范围广泛。\n\n#####\
  \ 错误答案与解析：B、C 和 D\n\n答案 `B`、`C` 和 `D` 不正确。安全审计验证对信息安全框架的合规性。渗透测试旨在确定攻击者是否能渗透组织。漏洞评估旨在发现环境中的不良配置和缺失补丁。\n\
  \n### 使用以下场景回答第 11 至 14 题\n\n您是一家大型银行的 CISO，并聘请了一家公司提供整体安全评估，并对您的组织进行渗透测试。您的目标是确定整体信息安全有效性。您特别有兴趣确定窃取财务数据是否可能。\n\
  \n您的银行最近部署了一个定制开发的三层 Web 应用程序，允许客户查询余额、进行转账，并通过用智能手机拍照上传支票图像来存款。除了传统的浏览器界面外，贵公司还为\
  \ Apple iOS 和 Android 设备开发了智能手机应用程序。\n\n合同已签署，双方已就范围和交战规则达成一致。银行已提供一名 24/7 值班的 IT\
  \ 联系人，以防渗透测试期间出现任何意外情况，包括潜在的服务意外中断。\n\n#### 11. 假设渗透测试成功，渗透测试公司证明财务数据被盗风险的最佳方式是什么？\n\
  \n1.  A. 指示渗透测试团队对包含财务数据的服务器进行彻底的漏洞评估\n2.  B. 指示渗透测试团队下载财务数据、将其编辑并据此报告\n3.  C. 指示渗透测试团队只能通过加密且经过认证的通道下载财务数据\n\
  4.  D. 在财务数据的同一位置放置一个无害的“标志”文件，并通知渗透测试团队下载该标志\n\n##### 正确答案与解析：D\n\n答案 `D` 正确；标志是一个不包含受监管或敏感数据的虚拟文件，放置在系统中与信用卡数据相同的区域，并受相同权限保护。如果测试人员能读取和/或写入该文件，则证明他们本可以对信用卡数据做同样的事。\n\
  \n##### 错误答案与解析：A、B 和 C\n\n答案 `A`、`B` 和 `C` 不正确。答案 A 是漏洞评估，而非渗透测试。答案 B 和 C 很危险，可能涉及未经授权访问受监管数据，如医疗记录。\n\
  \n#### 12. 哪种类型的渗透测试将导致时间和小时顾问费用的最高效利用？\n\n1.  A. 自动化知识\n2.  B. 全知识\n3.  C. 部分知识\n\
  4.  D. 零知识\n\n##### 正确答案与解析：B\n\n答案 `B` 正确；全知识测试比其他形式的渗透测试高效得多，允许渗透测试人员更快地发现薄弱环节。\n\
  \n##### 错误答案与解析：A、C 和 D\n\n答案 `A`、`C` 和 `D` 不正确。自动化知识不是有效的考试术语。零知识和部分知识测试都不如全知识测试高效。\n\
  \n#### 13. 您希望安全公司测试新的 Web 应用程序，但决定不共享底层源代码。哪种测试类型可用于帮助确定定制 Web 应用程序的安全性？\n\n1.\
  \  A. 安全编译器警告\n2.  B. 模糊测试\n3.  C. 静态测试\n4.  D. 白盒测试\n\n##### 正确答案与解析：B\n\n答案 `B`\
  \ 正确；模糊测试是一种黑盒测试方法，不需要访问源代码。\n\n##### 错误答案与解析：A、C 和 D\n\n答案 `A`、`C` 和 `D` 不正确。这些都是需要访问源代码的静态方法。\n\
  \n#### 14. 在渗透测试过程中，测试人员发现新定制的三层 Web 应用程序存在活跃入侵的迹象。他们的最佳行动方案是什么？\n\n1.  A. 尝试遏制并根除恶意活动\n\
  2.  B. 继续测试\n\n\n\n\n\n##### 3. C. 悄悄结束测试，立即联系运维 IT 联系人，并升级问题\n\n##### 4. D. 关闭服务器\n\
  \n**正确答案及解析：** `C`。答案 `C` 正确；如果攻击者认为自己已被发现，往往会变得更加恶意，有时会破坏数据和系统完整性。在这种情况下系统完整性处于风险之中，渗透测试人员应结束渗透测试，并立即升级问题。\n\
  \n**错误答案及解析：** `A`、`B` 和 `D`。答案 `A`、`B` 和 `D` 不正确。必须立即通知客户，而事件处理并非渗透测试人员的职责。\n\n\
  #### 1. 15. 拖放题：以下关于 Syslog 的陈述哪些是正确的？将左侧所有正确答案拖放至右侧（图 A.5）。\n\n![图 A.5 拖放题。](img/bm05-9780443187346.jpg)\n\
  \n图 A.5 拖放题。\n\n**正确答案及解析：** Syslog 使用 `UDP`，它提供不可靠的传输，因此数据容易被伪造。数据也未加密。\n\n**错误答案及解析：**\
  \ Syslog 不使用 `TCP`，未加密，且不使用身份验证（图 A.6）。\n\n![图 A.6 拖放题——答案。](img/bm06-9780443187346.jpg)\n\
  \n图 A.6 拖放题——答案。\n\n### 第 8 章：领域 7：安全运营\n\n#### 1. 1. 在事件响应的响应（即遏制）阶段获取哪种类型的备份？\n\
  \n1.  A. 增量\n2.  B. 完全\n3.  C. 差异\n4.  D. 二进制\n\n**正确答案及解析：** `D`。答案 `D` 正确；二进制备份，即逐位备份，是在事件响应的遏制阶段获取的。强烈倾向于获取利用哈希算法来保证可靠性的、取证上可靠的二进制备份。其他类型的备份不会捕获未分配空间，可能导致分析师错过一些已标记为删除的数据。\n\
  \n**错误答案及解析：** `A`、`B` 和 `C`。答案 `A`、`B` 和 `C` 不正确。增量、完全和差异都是常见的备份技术，但只会备份已分配空间而非整个驱动器。这些技术用于简单的备份/恢复功能，而非事件响应或取证。\n\
  \n#### 2. 2. 灾难恢复计划（DRP）的主要目标是什么？\n\n1.  A. 数据完整性\n2.  B. 业务资本保全\n3.  C. 业务流程恢复\n\
  4.  D. 人员安全\n\n**正确答案及解析：** `D`。答案 `D` 正确；人员伤亡是任何风险中影响最高的；人员安全是所有 8 个领域的首要关注点，包括业务连续性和灾难恢复规划。\n\
  \n**错误答案及解析：** `A`、`B` 和 `C`。答案 `A`、`B` 和 `C` 不正确。这些都是合理的关注点，但没有任何一点凌驾于人员安全之上。\n\
  \n#### 3. 3. 针对贵组织的对手创建了一个定制的恶意文档并通过邮件发送给贵组织内的一名用户。哪种控制最有助于组织识别此类定向攻击？\n\n1.  A.\
  \ 反恶意软件\n2.  B. 下一代防火墙（NGFW）\n3.  C. 沙箱\n4.  D. 用户和实体行为分析（UEBA）\n\n**正确答案及解析：**\
  \ `C`。答案 `C` 正确；恶意软件沙箱专门用于解决与定制创建的恶意内容相关的问题。此外，强调使用邮件分发恶意文档进一步支持相关控制为沙箱，因为邮件和 Web\
  \ 下载是沙箱审查的两种主要投递机制。\n\n**错误答案及解析：** `A`、`B` 和 `D`。答案 `A`、`B` 和 `D` 不正确。虽然其他每种控制在此场景下可能都提供一定益处，但对“定制制作”的强调更符合沙箱的优势，而非其他控制。反恶意软件和\
  \ NGFW 更倾向于基于特征的检测，这对文中描述的定制性质将失效。虽然 UEBA 可能提供基于用户行为的检测益处，但这取决于文档被最终用户渲染后表现出的活动。\n\
  \n#### 4. 4. 贵组织的最大可容忍停机时间（MTD）为 48 小时。哪种备选站点选择最具成本效益？\n\n1.  A. 冷站点\n2.  B. 热站点\n\
  3.  C. 冗余站点\n4.  D. 温站点\n\n**正确答案及解析：** `D`。答案 `D` 正确；温站点是一个具备架空地板、电力、公用设施、计算机外设和完全配置好计算机的数据中心，需要\
  \ 24–72 小时才能全面投入运行。\n\n**错误答案及解析：** `A`、`B` 和 `C`。答案 `A`、`B` 和 `C` 不正确。冷站点只有基本的物理和环境控制，没有计算机系统。通常需要一周或更长时间才能全面投入运行。热站点是一个具备架空地板、电力、公用设施、计算机外设和完全配置好计算机的数据中心。热站点只需几小时即可全面投入运行，是第二昂贵的选项。冗余站点是系统的精确生产副本，具备无缝运行所有必要\
  \ IT 操作的能力，是最昂贵的选项。\n\n#### 5. 5. 贵组织收到来自 ISAC（信息共享与分析中心）的通信，详述了近期观察到的入侵活动相关的指标。此过程可被视为以下哪种形式？\n\
  \n1.  A. 灾难恢复\n2.  B. 事件管理\n3.  C. 威胁情报\n4.  D. 行为分析\n\n**正确答案及解析：** `C`。答案 `C`\
  \ 正确；威胁情报涉及处理从先前安全事件中获取的、面向对手的信息。\n\n**错误答案及解析：** `A`、`B` 和 `D`。答案 `A`、`B` 和 `D`\
  \ 不正确。提供的情报最终可能使组织发现事件并进行管理，进而可能导致灾难。然而，即使没有事件或灾难，上述过程仍属于威胁情报的范畴。行为分析与所描述的过程似乎关系不大。\n\
  \n#### 6. 6. 哪种备份类型仅包含自最近一次完全备份以来已更改的文件？\n\n1.  A. 完全\n2.  B. 差异\n3.  C. 增量\n4.\
  \  D. 二进制\n\n**正确答案及解析：** `B`。答案 `B` 正确；差异备份仅归档自最近一次完全备份以来已更改的文件。\n\n**错误答案及解析：**\
  \ `A`、`C` 和 `D`。答案 `A`、`C` 和 `D` 不正确。完全备份会归档所有文件，无论其是否已更改。增量备份仅归档自上次增量或完全备份以来已更改的文件。二进制备份用于取证和事件响应目的，将备份整个磁盘上的所有内容，包括已分配和未分配空间。\n\
  \n#### 7. 7. 哪种预防性控制最适合保护定制开发的应用程序免受 SQL 注入攻击？\n\n1.  A. Web 应用防火墙（WAF）\n2.  B.\
  \ 漏洞扫描器\n3.  C. 入侵防御系统（IPS）\n4.  D. 沙箱\n\n**正确答案及解析：** `A`。答案 `A` 正确；考虑到定制开发的应用程序结合\
  \ SQL 注入，Web 应用防火墙（WAF）是最佳答案。\n\n\n\n\n##### 错误答案及解析：B、C 和 D\n\n答案 B、C 和 D 不正确。漏洞扫描器、IPS\
  \ 和沙箱在防御应用程序安全缺陷方面效果要差得多，特别是在定制开发的应用程序情况下。\n\n#### 8. 关于业务连续性计划 (BCP) 的哪项陈述是正确的？\n\
  \n1.  A. BCP 和 DRP 是独立的、同等的计划\n2.  B. BCP 是一个包含其他专项计划（如 DRP）的总体“伞型”计划\n3.  C. DRP\
  \ 是一个包含其他专项计划（如 BCP）的总体“伞型”计划\n4.  D. COOP 是一个包含其他专项计划（如 BCP）的总体“伞型”计划\n\n#####\
  \ 正确答案及解析：B\n\n答案 B 正确；业务连续性计划是一个伞型计划，包含多个专项计划，其中最重要的是灾难恢复计划。\n\n##### 错误答案及解析：A、C\
  \ 和 D\n\n答案 A、C 和 D 不正确。它们都错误地声称 BCP 等同于其他计划，或是其他计划的子集。\n\n#### 9. 哪种高可用性 (HA) 解决方案涉及多个系统，且所有系统均在线并主动处理流量或数据？\n\
  \n1.  A. 主动-主动集群\n2.  B. 主动-被动集群\n3.  C. 数据库影子\n4.  D. 远程日志记录\n\n##### 正确答案及解析：A\n\
  \n答案 A 正确；主动-主动集群涉及多个系统，且所有系统均在线并主动处理流量或数据。这种配置也通常被称为负载均衡，在面向公众的系统（如 Web 服务器场）中尤为常见。\n\
  \n##### 错误答案及解析：B、C 和 D\n\n答案 B、C 和 D 不正确。主动-被动集群涉及已就位、已配置、已通电并准备好在主系统发生故障时开始处理网络流量的设备或系统。数据库影子使用两个或更多相同的数据库，并同时更新它们。远程日志记录将数据库检查点和数据库日志保存到远程站点。在主站点发生故障时，数据库可被恢复。\n\
  \n#### 10. 哪个计划旨在为组织管理者在紧急情况或破坏性事件发生时提供有效的协调？\n\n1.  A. 电话树\n2.  B. 支持连续性计划\n3.\
  \  C. 危机管理计划\n4.  D. 危机沟通计划\n\n##### 正确答案及解析：C\n\n答案 C 正确；危机管理计划 (CMP) 旨在为组织管理者在紧急情况或破坏性事件发生时提供有效的协调。\n\
  \n##### 错误答案及解析：A、B 和 D\n\n答案 A、B 和 D 不正确。电话树通过指派每位员工负责在紧急事件中呼叫少数其他员工来工作。支持连续性计划专门关注对特定\
  \ IT 系统和应用程序的支持。危机沟通计划（有时简称为沟通计划）；是在破坏性事件发生时向员工和公众进行沟通的计划。该计划是 CMP 的子集。\n\n####\
  \ 11. 哪个计划详述了在从破坏性事件中恢复后，恢复正常业务运营所需的步骤？\n\n1.  A. 业务连续性计划 (BCP)\n2.  B. 业务恢复计划 (BRP)\n\
  3.  C. 运营连续性计划 (COOP)\n4.  D. 人员应急计划 (OEP)\n\n##### 正确答案及解析：B\n\n答案 B 正确；业务恢复计划详述了在从破坏性事件中恢复后，恢复正常业务运营所需的步骤。\n\
  \n##### 错误答案及解析：A、C 和 D\n\n答案 A、C 和 D 不正确。业务连续性计划制定长期计划以确保业务运营的连续性。运营连续性计划描述了在灾难期间维持运营所需的程序。人员应急计划为在情况对人员健康安全、环境或财产构成威胁时，设施内人员提供响应程序。\n\
  \n#### 12. 哪个指标描述了恢复故障系统需要多长时间？\n\n1.  A. 最低运行需求 (MOR)\n2.  B. 平均故障间隔时间 (MTBF)\n\
  3.  C. 平均修复时间 (MTTR)\n4.  D. 恢复点目标 (RPO)\n\n##### 正确答案及解析：C\n\n答案 C 正确；平均修复时间 (MTTR)\
  \ 描述了恢复故障系统需要多长时间。它是重建 IT 系统以实现业务连续性的最佳估算。\n\n##### 错误答案及解析：A、B 和 D\n\n答案 A、B 和\
  \ D 不正确。最低运行需求描述了运行计算机设备所需的最低环境和连接要求。平均故障间隔时间量化了新系统或修复后的系统在发生故障前将运行多长时间。恢复点目标 (RPO)\
  \ 是指数据必须被恢复并可供用户使用以恢复业务运营的那个时间点。\n\n#### 13. 哪个指标描述了数据必须被恢复并可供用户使用以恢复业务运营的那个时间点？\n\
  \n1.  A. 平均故障间隔时间 (MTBF)\n2.  B. 平均修复时间 (MTTR)\n3.  C. 恢复点目标 (RPO)\n4.  D. 恢复时间目标\
  \ (RTO)\n\n##### 正确答案及解析：C\n\n答案 C 正确；恢复点目标 (RPO) 是指数据必须被恢复并可供用户使用以恢复业务运营的那个时间点。\n\
  \n##### 错误答案及解析：A、B 和 D\n\n答案 A、B 和 D 不正确。平均故障间隔时间量化了新系统或修复后的系统在发生故障前将运行多长时间。平均修复时间描述了恢复故障系统需要多长时间。恢复时间目标描述了恢复业务或\
  \ IT 系统所允许的最长时间。\n\n#### 14. 最大可容忍停机时间 (MTD) 由哪两个指标组成？\n\n1.  A. 恢复点目标 (RPO) 和工作恢复时间\
  \ (WRT)\n2.  B. 恢复点目标 (RPO) 和平均修复时间 (MTTR)\n3.  C. 恢复时间目标 (RTO) 和工作恢复时间 (WRT)\n\
  4.  D. 恢复时间目标 (RTO) 和平均修复时间 (MTTR)\n\n##### 正确答案及解析：C\n\n答案 C 正确；恢复时间目标 (RTO，使故障系统重新上线所需的时间)\
  \ 和工作恢复时间 (WRT，配置故障系统所需的时间) 用于计算最大可容忍停机时间。`RTO + WRT = MTD`。\n\n##### 错误答案及解析：A、B\
  \ 和 D\n\n答案 A、B 和 D 不正确。最大可容忍停机时间不直接使用恢复点目标或平均修复时间作为指标。\n\n#### 15. 哪个 RAID 级别**不**提供额外的可靠性？\n\
  \n1.  A. RAID 1\n2.  B. RAID 5\n3.  C. RAID 0\n4.  D. RAID 3\n\n##### 正确答案及解析：C\n\
  \n答案 C 正确；RAID 0 仅提供条带化，仅用于性能目的。它不提供任何额外的数据冗余或弹性。\n\n##### 错误答案及解析：A、B 和 D\n\n答案\
  \ A、B 和 D 不正确。RAID 1、3 和 5 都通过镜像或奇偶校验措施提供可靠性增益。\n\n### 第 9 章：领域 8：软件开发安全\n\n####\
  \ 1. 哪种软件设计方法论使用结对程序员？\n\n1.  A. 敏捷\n2.  B. 极限编程 (XP)\n3.  C. Sashimi（重叠瀑布模型）\n\
  4.  D. Scrum\n\n\n\n\n##### 正确答案及解析：B\n\n答案 `B` 正确；极限编程（XP）是一种敏捷开发方法，它使用程序员配对工作，依据详细规格说明进行开发。客户参与度很高。\n\
  \n##### 错误答案及解析：A、C 和 D\n\n答案 `A`、`C` 和 `D` 不正确。敏捷描述了众多开发方法论，包括 XP：XP 是更好的答案，因为它更具体。Sashimi（重叠模型）是瀑布模型的变体。Scrum\
  \ 是另一种敏捷方法论，它使用小团队。\n\n#### 2. 哪种形式的人工智能使用知识库和推理引擎？\n\n1.  A. 人工神经网络（ANN）\n2.  B.\
  \ 贝叶斯过滤\n3.  C. 专家系统\n4.  D. 遗传算法\n\n##### 正确答案及解析：C\n\n答案 `C` 正确；专家系统由两个组件组成：一个由“如果/那么”语句组成的知识库。这些语句包含专家系统用于决策的规则。第二个组件是推理引擎。\n\
  \n##### 错误答案及解析：A、B 和 D\n\n答案 `A`、`B` 和 `D` 不正确。人工神经网络（ANN）模拟人类和动物大脑中的神经网络。贝叶斯过滤使用数学公式分配概率以做出决策，例如识别垃圾邮件。遗传算法和编程从根本上改变了软件开发方式：软件不再由程序员编写，而是通过进化来解决问题。\n\
  \n#### 3. 什么敏捷方法论专注于通过流水线快速部署代码更新？\n\n1.  A. 安全编排、自动化与响应（SOAR）\n2.  B. DevSecOps\n\
  3.  C. 集成开发环境（IDE）\n4.  D. 持续集成和持续交付（CI/CD）\n\n##### 正确答案及解析：D\n\n答案 `D` 正确；持续集成和持续交付（CI/CD）专注于通过流水线快速部署代码更新。\n\
  \n##### 错误答案及解析：A、B 和 C\n\n答案 `A`、`B` 和 `C` 不正确。安全编排、自动化与响应（SOAR）是一种用于集中管理安全运营的敏捷方法论。DevSecOps（开发、安全与运维）将安全集成到\
  \ DevOps 流程中，延续了对敏捷方法论的关注。集成开发环境（IDE）通过为程序员提供一个可执行多种功能的单一界面来提高生产力。\n\n#### 4. 什么描述了一种更敏捷的开发和支持模型，其中开发人员直接支持运维？\n\
  \n1.  A. DevOps\n2.  B. Sashimi\n3.  C. Spiral\n4.  D. Waterfall\n\n##### 正确答案及解析：A\n\
  \n答案 `A` 正确；DevOps 是一种更敏捷的开发和支持模型，其中开发人员直接支持运维。\n\n##### 错误答案及解析：B、C 和 D\n\n答案 `B`、`C`\
  \ 和 `D` 不正确。Sashimi、Spiral（螺旋模型）和 Waterfall（瀑布模型）是软件开发方法论，它们不描述开发人员直接支持运维的模型。\n\n\
  #### 5. 在系统开发生命周期（SDLC）的哪个阶段，安全应成为流程的一部分？\n\n1.  A. 启动前\n2.  B. 开发/获取期间\n3.  C.\
  \ 系统实施时\n4.  D. SDLC 不包含安全流程\n\n##### 正确答案及解析：A\n\n答案 `A` 正确；安全是整个 SDLC 流程的关键组成部分，通常始于启动前的安全计划。\n\
  \n##### 错误答案及解析：B、C 和 D\n\n答案 `B`、`C` 和 `D` 不正确。安全是 SDLC 的第一步，也是 SDLC 每个阶段的一部分。\n\
  \n#### 6. 一个对象根据输入消息的上下文不同而表现出不同的行为。这说明了面向对象编程的哪个概念？\n\n1.  A. 委托\n2.  B. 继承\n3.\
  \  C. 多实例化\n4.  D. 多态\n\n##### 正确答案及解析：D\n\n答案 `D` 正确；多态（基于希腊词根“poly”和“morph”，分别意为“多”和“形”）：允许重载运算符，根据输入消息的上下文执行不同的方法。\n\
  \n##### 错误答案及解析：A、B 和 C\n\n答案 `A`、`B` 和 `C` 不正确。委托允许对象将消息委托给其他对象。继承意味着对象从其父类继承能力。多实例化意为“多个实例”，即两个名称相同但数据不同的对象。\n\
  \n#### 7. 两个同名对象拥有不同的数据。这说明了面向对象编程的哪个概念？\n\n1.  A. 委托\n2.  B. 继承\n3.  C. 多实例化\n\
  4.  D. 多态\n\n##### 正确答案及解析：C\n\n答案 `C` 正确；多实例化意为“多个实例”，即两个名称相同但拥有不同数据的对象。\n\n#####\
  \ 错误答案及解析：A、B 和 D\n\n答案 `A`、`B` 和 `D` 不正确。委托允许对象将消息委托给其他对象。继承意味着对象从其父类继承能力。多态允许重载运算符，根据输入消息的上下文执行不同的方法。\n\
  \n#### 8. 什么敏捷方法可以自动化系统管理任务，包括服务器部署和配置管理？\n\n1.  A. 软件配置管理（SCM）\n2.  B. 安全编排、自动化与响应（SOAR）\n\
  3.  C. 持续集成和持续交付（CI/CD）\n4.  D. 集成开发环境（IDE）\n\n##### 正确答案及解析：A\n\n答案 `A` 正确；软件配置管理（SCM）是一种敏捷方法，可自动化系统管理任务，包括服务器部署和配置管理。\n\
  \n##### 错误答案及解析：B、C 和 D\n\n答案 `B`、`C` 和 `D` 不正确。安全编排、自动化与响应（SOAR）是一种用于集中管理安全运营的敏捷方法论。持续集成和持续交付（CI/CD）专注于通过流水线快速部署代码更新。集成开发环境（IDE）通过为程序员提供一个可执行多种功能的单一界面来提高生产力。\n\
  \n#### 9. 程序员为用户名变量分配了 20 字节，攻击者输入了一个 1000 字节长的用户名。所有 1000 字节都被复制到了栈中。攻击者执行了哪种类型的攻击？\n\
  \n1.  A. 缓冲区溢出\n2.  B. 跨站脚本攻击（XSS）\n3.  C. 模糊测试\n4.  D. 检查时间/使用时间（TOC/TOU）\n\n#####\
  \ 正确答案及解析：A\n\n答案 `A` 正确；当程序员未执行变量边界检查时，会发生缓冲区溢出。\n\n##### 错误答案及解析：B、C 和 D\n\n答案\
  \ `B`、`C` 和 `D` 不正确。跨站脚本攻击（XSS）利用第三方在受信任站点的安全上下文中执行 Web 脚本语言（如 JavaScript）。模糊测试是一种黑盒软件测试形式，将随机畸形数据作为输入输入软件程序以确定其是否会崩溃。检查时间/使用时间（TOCTOU）攻击也称为竞争条件：攻击者试图在操作系统检查条件后、使用条件前修改该条件。\n\
  \n#### 10. 哪种数据库语言用于创建、修改和删除表？\n\n1.  A. 数据定义语言（DDL）\n2.  B. 数据操作语言（DML）\n3.  C.\
  \ 数据库管理系统（DBMS）\n4.  D. 结构化查询语言（SQL）\n\n##### 正确答案及解析：A\n\n答案 `A` 正确；数据定义语言（DDL）用于创建、修改和删除表。\n\
  \n\n\n\n\n##### 错误答案及解析：B、C 和 D\n\n答案 B、C 和 D 不正确。数据操作语言（DML）用于查询和更新存储在表中的数据。数据库管理系统（DBMS）管理数据库系统并提供安全功能。结构化查询语言（SQL）是一种数据库查询语言，包含\
  \ DDL 和 DML。DDL 比 SQL 更具体，或者它是本题更好的答案。\n\n#### 11. 一个数据库包含一个主键为空的条目。违反了哪个数据库概念？\n\
  \n1. A. 实体完整性\n2. B. 规范化\n3. C. 参照完整性\n4. D. 语义完整性\n\n##### 正确答案及解析：A\n\n答案 A 正确；实体完整性意味着每个元组都有一个非空的唯一主键。\n\
  \n##### 错误答案及解析：B、C 和 D\n\n答案 B、C 和 D 不正确。规范化旨在使数据库表中的数据在逻辑上简洁、有序且一致。参照完整性意味着辅助表中的每个外键都与父表中的一个主键匹配：如果不成立，则参照完整性已被破坏。语义完整性意味着每个属性（列）的值与属性数据类型一致。\n\
  \n#### 12. 哪种漏洞允许第三方在受信任站点的安全上下文中重定向静态内容？\n\n1. A. 跨站请求伪造 (CSRF)\n2. B. 跨站脚本攻击 (XSS)\n\
  3. C. PHP 远程文件包含 (RFI)\n4. D. SQL 注入\n\n##### 正确答案及解析：A\n\n答案 A 正确；跨站请求伪造 (CSRF)\
  \ 允许第三方在受信任站点的安全上下文中重定向静态内容。\n\n##### 错误答案及解析：B、C 和 D\n\n答案 B、C 和 D 不正确。跨站脚本攻击 (XSS)：第三方在受信任站点的安全上下文中执行\
  \ Web 脚本语言（如 Javascript）。XSS 与 CSRF 相似；区别在于 XSS 使用主动代码。PHP 远程文件包含 (RFI)：篡改正常的 PHP\
  \ 变量以引用远程内容，可能导致恶意 PHP 代码的执行。SQL 注入通过前端 Web 服务器操纵后端 SQL 服务器。\n\n#### 13. 哪种语言允许\
  \ CORBA（公共对象请求代理体系结构）对象通过消息接口进行通信？\n\n1. A. 分布式组件对象模型 (DCOM)\n2. B. 接口定义语言 (IDL)\n\
  3. C. 对象链接与嵌入 (OLE)\n4. D. 对象管理指南 (OMG)\n\n##### 正确答案及解析：B\n\n答案 B 正确；接口定义语言 (IDL)\
  \ 允许 CORBA 对象通过消息接口进行通信。\n\n##### 错误答案及解析：A、C 和 D\n\n答案 A、C 和 D 不正确。DCOM（分布式组件对象模型）是一种\
  \ Microsoft 对象代理，用于在网络上定位对象。对象链接与嵌入 (OLE) 是 DCOM 的一部分，提供了一种将文档链接到其他文档的方式。对象管理指南是一个干扰项，利用了\
  \ OMG 这个术语：对象管理组 (OMG) 开发了 CORBA。\n\n#### 14. 哪种数据库高可用性选项允许多个客户端同时访问多个数据库服务器？\n\n\
  1. A. 数据库提交\n2. B. 数据库日志\n3. C. 复制数据库\n4. D. 影子数据库\n\n##### 正确答案及解析：C\n\n答案 C 正确；数据库复制镜像一个活动数据库，允许客户端对多个复制数据库进行同时读写。\n\
  \n##### 错误答案及解析：A、B 和 D\n\n答案 A、B 和 D 不正确。DBMS 可能会尝试提交更新：使挂起的更改永久化。数据库日志是所有数据库事务的日志。影子数据库类似于复制数据库，但有一个关键区别：影子数据库镜像主数据库的所有更改，但客户端不访问影子数据库。\n\
  \n#### 15. 专家系统的哪个组件由“如果/那么”语句组成？\n\n1. A. 逆向链接\n2. B. 正向链接\n3. C. 推理引擎\n4. D. 知识库\n\
  \n##### 正确答案及解析：D\n\n答案 D 正确；知识库由“如果/那么”语句组成。这些语句包含专家系统用于做决策的规则。\n\n##### 错误答案及解析：A、B\
  \ 和 C\n\n答案 A、B 和 C 不正确。正向链接从无前提开始，向前工作以确定解决方案。逆向链接从一个前提开始，向后工作。推理引擎遵循由知识库形成的树，并在匹配时触发规则。\n\
  \n## 词汇表\n\n> 本词汇表按首字母缩写词组织：例如，“Data Encryption Standard”条目显示“See—DES”。“DES”条目包含定义。这样做是因为这是技术书籍的合乎逻辑的方法，并允许更快地查找定义。\n\
  >\n> 第二个原因是鼓励你学习首字母缩写词到术语的映射（反之亦然）。通用知识体系中的正式短语可以提供一条捷径，帮助你在考试题目中抽丝剥茧。了解正式的首字母缩写词可以提供识别问题核心的最快路线图。\n\
  >\n> 在参加考试前，你应该理解本词汇表中定义的每个术语。通读一遍词汇表是一个很好的最后考前准备步骤，正如简介中“如何准备考试”部分所讨论的那样。\n\n**802.11**\
  \ 无线网络标准\n\n**\\*完整性公理** Biba 属性，规定“不写上”\n\n**\\*安全属性** Bell-LaPadula 属性，规定“不写下”\n\
  \n**“坏”块/簇/扇区** 标记为坏的良好磁盘块\n\n**4GL** 第四代编程语言，旨在通过自动创建计算机编程代码来提高程序员效率\n\n**4G**\
  \ 使用宏基站的第四代蜂窝技术\n\n**5G** 使用小基站的第五代蜂窝技术\n\n**802.11-1997** 802.11 的原始模式，使用 2.4 GHz\
  \ 频率，运行速率为 2 Mbps\n\n**802.11a** 使用 5 GHz 频率、运行速率为 54 Mbps 的 802.11 模式\n\n**802.11ac**\
  \ 使用 5 GHz 频率、运行速率高达 1.3 Gbps 的 802.11 模式\n\n**802.11ax** 使用 2.4、5 和 6 GHz 频率、运行速率高达\
  \ 10 Gbps 的 802.11 模式\n\n**802.11b** 使用 2.4 GHz 频率、运行速率为 11 Mbps 的 802.11 模式\n\n\
  **802.11g** 使用 2.4 GHz 频率、运行速率为 54 Mbps 的 802.11 模式\n\n**802.11i** 第一个提供合理安全性的 802.11\
  \ 无线安全标准\n\n**802.11n** 同时使用 2.4 和 5 GHz 频率、允许速度达到 144 Mbps 及以上的 802.11 模式\n\n**802.1X**\
  \ 基于端口的网络访问控制，第 2 层认证\n\n**ABM** 异步平衡模式，HDLC 混合模式，节点可作为主站或从站，无需接收许可即可发起传输\n\n**抽象**\
  \ 向用户隐藏不必要的细节\n\n**验收测试** 为确保软件满足客户运营需求而进行的测试\n\n**访问聚合** 多个系统授予单个用户的权利总和。可能导致权限蔓延\n\
  \n**访问控制列表** 见—ACL\n\n**访问控制矩阵** 定义特定主体和客体之间存在的访问权限的表\n\n**账户锁定** 在一组失败登录次数后（有时在特定时间段内）禁用账户\n\
  \n**问责制** 让个人对其行为负责\n\n**问责原则** OECD 隐私指南原则，规定个人应有权质疑所持有的任何个人数据的内容，并拥有在发现个人数据不准确或不完整时更新其个人数据的流程\n\
  \n\n\n\n\n## 术语表\n\n**Accreditation**  \n数据所有者对系统所代表的风险的接受。\n\n**ABAC**  \n一种较新的访问控制模型，通过在访问请求时考虑主体和客体的属性来确定授权。\n\
  \n**ACK**  \nTCP 标志，确认接收到的数据。\n\n**ACL**  \n访问控制列表。\n\n**Act honorably, honestly,\
  \ justly, responsibly, and legally**  \n(ISC)²® 职业道德准则的第二条准则。\n\n**Active RFID**\
  \  \n有源 RFID 标签，可在更大距离上运行。\n\n**Active-active cluster**  \n涉及多个系统，所有系统均在线并主动处理流量或数据。\n\
  \n**Active-passive cluster**  \n涉及已就位、已配置、已通电并准备好在主系统发生故障时开始处理网络流量的设备或系统。\n\n**ActiveX\
  \ controls**  \nJava Applet 的功能等价物。它们使用数字证书而非沙箱来提供安全性。\n\n**Ad hoc mode**  \n802.11\
  \ 对等模式，无中心接入点。\n\n**Address Space Layout Randomization**  \n参见——`ASLR`。\n\n**Administrative\
  \ controls**  \n通过创建和遵循组织政策、程序或法规来实施。也称为指令性控制。\n\n**Administrative law**  \n由政府机构颁布的法律，又称监管法。\n\
  \n**ADSL**  \n非对称数字用户线路，下载速度快于上传的 DSL 技术。\n\n**Advance and protect the profession**\
  \  \n(ISC)²® 职业道德准则的第四条准则。\n\n**Advanced Encryption Standard**  \n参见——`AES`。\n\n\
  **AES**  \n高级加密标准，一种分组密码，使用 128 位、192 位或 256 位密钥加密 128 位数据块。\n\n**Agents of law\
  \ enforcement**  \n代表执法部门行事的私人公民。\n\n**Aggregation**  \n聚合攻击，用户能够利用低级别访问权限获取受限信息。\n\
  \n**Agile Software Development**  \n一种灵活的软件开发模型，是对瀑布模型等僵化软件开发模型的反应而演变而来的。\n\n**AH**\
  \  \n认证头，IPsec 协议，为每个网络数据包提供认证和完整性。\n\n**ALE**  \n年化损失期望值，一年内因风险导致的损失成本。\n\n**All\
  \ pairs testing**  \n参见——成对测试。\n\n**Allocated space**  \n磁盘分区中标记为活跃包含数据的部分。\n\n\
  **ALU**  \n算术逻辑单元，执行数学计算的 CPU 组件。\n\n**Analog**  \n发送连续信息波的通信方式。\n\n**ANN**  \n\
  人工神经网络，模拟人类和动物大脑中发现的神经网络。\n\n**Annual Rate of Occurrence**  \n参见——`ARO`。\n\n**Annualized\
  \ Loss Expectancy**  \n参见——`ALE`。\n\n**Antivirus software**  \n旨在预防和检测恶意软件感染的软件。\n\
  \n**API**  \n应用程序编程接口，允许应用程序与另一个应用程序、操作系统、数据库、网络等进行通信。例如，`Google Maps API` 允许应用程序集成第三方内容，如叠加在\
  \ Google 地图上的餐厅。\n\n**Applet**  \n嵌入在其他软件（如 Web 浏览器）中的小段移动代码。\n\n**Application layer\
  \ (OSI)**  \nOSI 模型的第 7 层，用户在此与计算机应用程序交互。\n\n**Application layer (TCP/IP)**  \n\
