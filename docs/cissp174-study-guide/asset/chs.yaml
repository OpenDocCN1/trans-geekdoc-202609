  \n**Star**  \n物理网络拓扑，将每个节点连接到中心设备（如集线器或交换机）。\n\n**Stateful firewall**  \n具有状态表的防火墙，允许防火墙将当前数据包与之前的数据包进行比较。\n\
  \n**Static password**  \n可重复使用的密码，可能过期也可能不过期。\n\n**Static Random Access Memory**\
