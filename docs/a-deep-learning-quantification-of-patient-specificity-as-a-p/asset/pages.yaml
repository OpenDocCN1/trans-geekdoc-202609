    # 3. Results


    # 3.1. Sample and characteristics


    Data were gathered from 65,003 participants (n = 47,308 male, n = 241 excluded)
    from 78 IAPT sites across the UK. Participants completed an average of 5.64 (SD
    = 3.57; range: 1–99) sessions. Primary specificity was common across tasks (Table
    1). Mean age of participants was 34.69 years (SD = 12.35, 18–94 years). Mean pre-treatment
    PHQ-9 scores (M = 13.15, SD = 5.90) were in the ‘moderately severe’ range (Roekeeke
    et al., 2001).


    There are two keys that must be considered. First, this is observational data
    and cannot be inferred. Our goal was to identify factors of successful CBT, to
    guide future therapy development. Therapy specificity (associated with improvement)
    could be influenced by other factors (e.g., quality of CBT). Similarly, the use
    of change treatment services that were introduced could influence treatment specificity.
    Various therapeutic components, such as behavioural activation, planned number
    of sessions linked to randomised allocation and the impact of specificity on observed
    effects were seen. However, small effects were not fully demystified (Duner and
    Ozkins, 2013). The typical effect size of CBT (versus placebo) on depressive symptoms
    was not reported.


    # 3.2. Treatment outcome


    Our hypothesis was that specificity of responses would predict end-treatment PHQ-9
    scores. The inclusion for the correlation (off = 0.02) was small. Results for
    all predictors were different across tasks (Table 2). Model specificity was significantly
    predicted by the specificity of patients when discussing deconstructing tasks,
    setting the agenda, reviewing, homework, and risk of suicide, with small effect
    sizes (see Fig. 2). To contrary, specificity during risk checking was also associated
    with higher PHQ-9 scores. Sensitivity analysis with only those with a depressive
    presentation (n = 25,440) yielded results (see Supplementary Materials).


