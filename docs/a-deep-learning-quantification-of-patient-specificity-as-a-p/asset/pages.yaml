    # 2.5. Sympt measures


    The Patient Questionnaire (PHQ-9; Kroeke et al., 2001) is a valid and reliable
    index of depression, and was used as our primary outcome measure. The PHQ-9 is
    administered at each CBT session, as well as the Generalized Anxiety Disorder-7-item
    scale (GAD; Spitzer et al., 2006), which we pre-registered as a secondary outcome.
    We also intended to examine Work and Social Anxiety (Witzman et al., 2008), but
    were unable to obtain this data. As we used real-service data, our conceptualisation
    of clinical outcomes was limited by the available date.


