    # A deep learning quantification of patient as a predictor of session attendance
    and treatment response to internet-enabled cognitive behavioural therapy for common
    mental disorders


    ![](img/774968a1aef6375b9d919dee5c923713_0_2.png)


    Caitlin Hookrock^{a,b}, Julia Funk^{b}, Roman Cummins^{c}, Shivam D. Patel^{a},
    Ana Catarino^{d}, Keisuke Takano, Tim Dalgeish^{a}, Michael Ewbank^{d}


    +   a Medical Research Council Cognition and Brain Sciences, University of Cambridge,
    United Kingdom

    b Melbourne Melbourne School of Psychological Sciences, The University of Melbourne,
    Australia

    c Department of Psychology, Ludwig-Maximilians-Universität München, Germany

    d Lea Digital Health, Cowley Rd, London, United Kingdom


    # ABSTRACT


    Background: Increasing an individuals ability to focus on concrete, specific detail,
    thus reducing the tendency toward broad, decontextualized abstractions about the
    world is a goal. However, empirical investigation of the impact of treatment-specific
    CBT on outcomes remains. We evaluated whether the specificity of patient dialogue
    predicted (a) end-treatment symptoms and (b) session completion in patients with
    common mental health disorders.


    Methods: We used a deep learning model to score the specificity of patient dialogue
    in transcripts from 353,614 recorded CBT-based sessions for common mental health
    disorders, derived from UK NHS services. We included 65,030 patients (n = 478,
    female = 241) aged 18-94 years (n = 34,569, SD = 12.35). Descriptive scores were
    the most common (39.1%) primary finding. Primary outcome was end-treatment response
    on the Patient Health Questionnaire (PHQ-9). Secondary outcome was number of sessions.


    Results: Linear-effects models demonstrated that patient specificity predicted
    lower post-treatment symptoms on the PHQ-9, although size and direction of the
    effect were associated with therapeutic activity. Higher specificity was associated
    with a greater number of sessions.


    Limitations: We were unable to infer causation from our design. Conclusions: Effect
    sizes were small, although specificity was observed across common mental health
    disorders. Further studies are needed to explore whether encouraging patient specificity
    during CBT may provide enhancement of treatment attendance and treatment effects.


    # 1. Introduction


    Cognitive behavioural therapy (CBT) is our leading treatment for common mental
    health disorders. However, CBT fails to remission for 30-50% of treated individuals
    (Clark et al., 2018), leaving many with significant symptoms and distress. Increasing
    the usage of therapy techniques in favor of good outcomes is a matter of vital
    importance to return function


