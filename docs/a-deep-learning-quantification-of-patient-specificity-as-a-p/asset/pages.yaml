    et al., 2012), overgenerised autobiographical memory (Hallford et al., 2021a),
    and mental imagery (Powell et al., 2021) as a training modality. Similarly, processed-focused
    adaptations of CBT have integrated a greater focus on being concrete (Clark et
    al., 2016). Machine learning techniques have been examined lately as a linear
    process, partly due to the quantity and structural format of such data.


    Machine learning techniques can provide insights into various factors during therapeutic
    exchanges between therapist and patient, at scale (Chekroud et al., 2021). Recent
    research has used deep learning models to identify features of treatment (e.g.,
    topic of discussion, duration of session) and features on outcomes (Ewbank et
    al., 2020), allowing to identify features of CBT success across large numbers
    of patients.


    The quality of information within therapeutic interactions may determine the degree
    of patient specificity in post-treatment outcomes. We expected that increased
    specificity during therapy period would predict better outcomes at least for individuals
    with severe symptoms, and more concrete processing specificity with CBT, or more
    specific detail during therapeutic activities (e.g., when designing experiments)
    may lead to improved solving (Sloan et al., 2021). We also wanted to examine whether
    specificity is more important in some tasks than others, and specificity within
    different feature categories (Ewbank et al., 2020), including goal setting. Our
    aim was to determine whether patient specificity predicted treatment outcome of
    CBT sessions or not; while CBT tasks require the individual to provide specific
    information, those who are inclined to specificity may find CBT easier, and complete
    a greater number of sessions.


    We trained a deep learning model to quantify the specificity of patient dialogue
    within internet-enabled CBT sessions across NHS Improving Access to Psychological
    Therapies (IAPT) services. Our primary hypothesis was that specificity of patient
    dialogue would predict recovery, as well as specificity of specific features in
    patients'' responses would predict better outcome on the Health Questionnaire
    (PHQ-9; Kroeke et al., 2001). We found that specificity is linked to patient outcome
    in CBT (Ewbank et al., 2021a), and we also wanted to evaluate the efficacy of
    IAPT services (Gansbury et al., 2013). Furthermore, there is a well established
    relationship between specificity and depressive outcomes (Hallford et al., 2021).
    Our second hypothesis was that greater specificity of patient dialogue would predict
    a better outcome or greater number of CBT sessions.


    # 2. Method


    # 2.1. Approvals


    Cambridge University Ethics committee granted ethical approval (PR/2017.100).
    Hypotheses and analyses were prepared-


    # 2.2. Participants


    Participants (n = 65,030) were receiving treatment from NHS Improving Access to
    Psychological Therapies (IAPT) services in the UK – a public service which treats
    common mental health issues.


    Individuals self-refer. Inclusion criteria were age < 18 and registration with
    a general practitioner in the NHS service. Exclusion criteria, determined by a
    clinician during the intake assessment, were deemed unsuitable for online treatment
    (e.g., experiencing cognitive impairment, brain injury or dementia); reality;
    no history of psychosis; low literacy levels indicating poor reading/writing;
    visual impairment preventing using an electronic device; lack of English; unsuitable
    for IAPT in need of more intensive support (accuity).


    # 2.3. Internet-CBT


    CBT was administered via instant messaging in a online therapy room by the British
    Association for Behaviour and Cognitive Psychotherapies-accredited CBT therapist
    or NHS Wellbeing Practitioner, from National Institute of Health and Care. The
    sessions were delivered individually, in real-time, by a trained therapist at
    scale on behalf of NHS IAPT services by (www.iesapt.org), in accordance with international
    standards for information. CBT protocols were used, which consisted of a range
    of tasks, including cognitive restructuring, behavioural experiments, behavioural
    activities. Sessions were approximately 45-60 minutes in length, and on a weekly
    basis; free sessions were deployed by both therapist and patient.


    # 2.4. Specifying


    We analyzed 353,614 internet-enabled CBT sessions completed June 2012 to May 2021.
    Each therapy transcript text were submitted by the user, and text entries were
    submitted by the therapist. The therapy transcript was eliciting for linguistic
    features that could indicate (e.g., “can you tell me of an example/the task’s
    time you free tell me this happened?”, “how do you know that is true?”). We identified
    specificity in patient responses during different types of task (Ewbank et al.,
    2020). Our results were clinically significant (see Fig. 1). It showed that, for
    example, being specific when completing therapy tasks was more important for outcome
    than specifying in the sessions. We separated specificity by the tasks elicited
    during agenda setting, homework setting, goal setting, planning for the future,
    discussing concerns and worries, completing CBT tasks (included any cognitive
    or behavioural activities, homework, education), assessing risk of suicide, summarizing
    the session, or other tasks. Full details on the different tasks are in Ewbank
    et al. (2020).


    Patient responses were classified using a supervised deep learning model, which
    predicted whether the response was specific. The model trained on a dataset of
    describing patient experiences (10,000 entries), written by individuals of interest.
    These entries were then scored as specific or non-specific by a human rater using
    criteria for the Autobiographical Memory Test (Williams and Benedict, 2008). We
    used 800 examples to train our model and 1000 to validate model performance using
    overlapping sets. The remaining 1000 entries were used as the held-out test set.
    We further validated the model on another separate dataset of out-of-test describing
    patient experiences (1632 entries) written by individuals'
