    3）。在讨论解构任务、完成任务、规划未来和应对策略时，更多的 CBT 课程与更高的特异性相关。当询问自杀风险是一个目标时，观察到了更多的完成课程。预测参加
    ≥ 2 次课程的额外分析，以及用户特定的（参与了）参与度也显示，完成的课程可能与其他因素（例如症状严重程度）相关，这产生了相似的结果（见补充材料）。


    根据指导 CBT 的一致（Beck and Haigh, 2014），结果支持对话期间存在特异性的证据。然而，当患者在反思和努力他们学到的内容（例如规划生活中的策略/新知识）方面特异性较高时，观察到的完成课程较少。患者表现出对构建
    CBT 任务的关注，可能会挑战抑郁信念或谎言。我们在讨论课程和议程时看到的患者请求较少，而对要求的特异性请求更频繁。


