    研究论文


    # 深度学习量化分析患者特异性作为预测常见心理障碍网络支持认知行为疗法出勤率和治疗反应的因子


    ![](img/774968a1aef6375b9d919dee5c923713_0_2.png)


    Caitlin Hookrock^{a,b}, Julia Funk^{b}, Roman Cummins^{c}, Shivam D. Patel^{a},
    Ana Catarino^{d}, Keisuke Takano, Tim Dalgeish^{a}, Michael Ewbank^{d}


    - a 英国剑桥大学，医学研究委员会认知与脑科学

    - b 澳大利亚墨尔本大学，心理科学学院

    - c 德国慕尼黑路西米利安大学，心理学系

    - d 英国伦敦，Cowley Rd，Lea Digital Health


    # 摘要


    **背景：** 提高个体关注具体、特定细节的能力，从而减少对世界产生泛泛、去背景化抽象的倾向，是一个目标。然而，关于特定认知行为疗法（CBT）对结果影响的实研究仍然不足。我们评估了患者对话的特异性是否能预测（a）常见心理障碍患者的治疗结束后症状和（b）疗程完成情况。


    **方法：** 我们使用深度学习模型，对来自英国国家医疗服务体系（NHS）的353,614 份常见心理障碍 CBT 治疗记录转录中的患者对话特异性进行评分。我们纳入了
    65,030 名年龄在 18-94 岁之间（n = 34,569, SD = 12.35）的患者（n = 478, 女性 = 241）。描述性分值是最常见的初步发现（39.1%）。主要结局指标是患者健康问卷（PHQ-9）的治疗结束后反应。次要结局指标是治疗次数。


    **结果：** 线性效应模型显示，患者的特异性可以预测 PHQ-9 治疗后症状的减轻，尽管效应的大小和方向与治疗活动有关。较高的特异性与更多的治疗次数相关。


    **局限性：** 我们无法根据研究设计推断出因果关系。**结论：** 效应量较小，但在各种常见心理障碍中观察到了特异性。需要进一步的研究探索在 CBT 期间鼓励患者特异性是否可以增强治疗出勤率和治疗效果。


    # 1. 引言


    认知行为疗法（CBT）是我们治疗常见心理障碍的主要方法。然而，CBT 对 30-50% 的受治疗个体未能实现缓解（Clark 等人，2018），导致许多人仍伴有严重症状和困扰。增加治疗技术的使用以获得良好结果，对于恢复功能至关重要。


    在传统 CBT 和第三波 CBT 中，人们可以潜在地改善变化的机制方面，即从抽象、泛化的风格转向具体、特定的处理（Beck and Haigh, 2014;
    van der Velden 等人，2015）。多种治疗成分促进了患者特异性。正念体验旨在提高关注（具体、感官）细节的能力，并减少抽象模式（忧虑）。Oldandy
    和 Igesan（2020）认知重构旨在泛化对世界以及特定背景、环境和技术的信念，这需要帮助来识别特定实例并关注具体的特定细节（Craske 等人，2014）。说明（例如通过论证和个人史）很重要，即基于此类事件所做主张的反应函数仅在特定背景内适用（在决定谁来执行任务时）。关注特定性对于使背景背景化——即驱动常见心理障碍的关于价值感、危险、失败和脆弱性的信念——至关重要（Beck
    and Haigh, 2014）。针对这些科学驱动的干预措施已作为 CBT 的调整方案被提出，以增强特定认知、认知调控（Watkins 等人，2012）、过度泛化的自传记忆（Hallford
    等人，2021a）以及心理想象（Powell 等人，2021）作为一种训练模式。同样，以处理为重点的 CBT 调整整合了更多对具体的关注（Clark 等人，2016）。机器学习技术最近作为一种线性过程受到了审查，部分原因是由于此类数据的数量和结构格式。


    机器学习技术可以大规模地为治疗师与患者之间交流期间的各种因素提供见解（Chekroud 等人，2021）。最近的研究使用深度学习模型来识别治疗特征（例如讨论主题、疗程时长）和结果特征（Ewbank
    等人，2020），允许识别大量患者中 CBT 成功的特征。


    治疗互动中的信息质量可能决定治疗后结果中患者特异性的程度。我们预计，治疗期间特异性的增加将预测出更好的结果，至少对于症状严重的个体是如此；而且 CBT 中更具体的处理特异性，或治疗活动期间更具体的细节（例如在设计实验时）可能会导致问题的解决（Sloan
    等人，2021）。我们还想检查特异性在某些任务中是否比其他任务更重要，以及不同特征类别（Ewbank 等人，2020）包括目标设定内的特异性。我们的目标是确定患者特异性是否预测
    CBT 治疗疗程的结果；虽然 CBT 任务要求个体提供特定信息，但倾向于特异性的人可能会发现 CBT 更容易，并完成更多的疗程。


    我们训练了一个深度学习模型，来量化网络支持 CBT 中患者对话的特异性。我们的主要假设是患者对话的特异性将预测康复情况，患者的特异性将预测更好的结果（PHQ-9）。我们发现特异性与了（Ewbank
    等人，2021）治疗师和患者的部署。我们的第二个假设是患者的特异性将预测更多的治疗次数。


    # 2. 方法


    ### 2.1 批准

    剑桥大学伦理委员会授予了伦理批准（2017）。


    ### 2.2 参与者

    患者（n = 65,030）接受 NHS 的治疗。入组标准为年龄小于 18 岁且在全科医生处；排除标准为认知障碍、脑损伤或痴呆；有精神病史；识字水平低；阻碍使用设备的视力障碍。


    ### 2.3 网络 CBT

    CBT 由经过培训的治疗师通过在线房间的即时消息进行（www.iesapt.org）。每次 45-60 分钟，每周一次。


    ### 2.4 特异性

    我们分析了 2012 年 6 月至 2021 年 5 月完成的 353,614 次网络支持 CBT 疗程。每份治疗转录由用户提交，文本输入由治疗师提交。从治疗转录中提取了可以指示的语言特征（例如，“你能告诉我一个例子/任务发生这种情况吗？”、“你怎么知道那是真的？”）。我们识别了患者在不同类型任务期间反应的特异性（Ewbank
    等人，2020）。我们的结果具有临床意义（见图 1）。结果显示，例如在完成治疗任务时保持具体比在疗程中特异化对结果更重要。我们根据日程设定、作业设定、目标设定、未来计划、讨论担忧和虑、完成
    CBT 任务（包括任何认知或行为活动、作业、教育）、评估自杀风险、总结疗程或其他任务期间提取的特异性进行了分类。不同任务的完整细节请见 Ewbank 等人
    (2020)。


