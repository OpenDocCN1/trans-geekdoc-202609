    # ABSTRACT


    **Background:** Increasing an individuals'' ability to focus on concrete, specific
    detail, thus reducing the tendency toward broad, decontextualized abstractions
    about the world is a goal. However, empirical investigation of the impact of treatment-specific
    CBT on outcomes remains. We evaluated whether the specificity of patient dialogue
    predicted (a) end-treatment symptoms and (b) session completion in patients with
    common mental health disorders.


    **Methods:** We used a deep learning model to score the specificity of patient
    dialogue in transcripts from 353,614 recorded CBT-based sessions for common mental
    health disorders, derived from UK NHS services. We included 65,030 patients (n
    = 478, female = 241) aged 18-94 years (n = 34,569, SD = 12.35). Descriptive scores
    were the most common (39.1%) primary finding. Primary outcome was end-treatment
    response on the Patient Health Questionnaire (PHQ-9). Secondary outcome was number
    of sessions.


    **Results:** Linear-effects models demonstrated that patient specificity predicted
    lower post-treatment symptoms on the PHQ-9, although size and direction of the
    effect were associated with therapeutic activity. Higher specificity was associated
    with a greater number of sessions.


    **Limitations:** We were unable to infer causation from our design. **Conclusions:**
    Effect sizes were small, although specificity was observed across common mental
    health disorders. Further studies are needed to explore whether encouraging patient
    specificity during CBT may provide enhancement of treatment attendance and treatment
    effects.


    # 1. Introduction


    Cognitive behavioural therapy (CBT) is our leading treatment for common mental
    health disorders. However, CBT fails to remission for 30-50% of treated individuals
    (Clark et al., 2018), leaving many with significant symptoms and distress. Increasing
    the usage of therapy techniques in favor of good outcomes is a matter of vital
    importance to return function.


    In both traditional and third-wave CBTs, one can potentially improve mechanistic
    aspect of change movement from an abstract, generalized style type, to concrete,
    specific processing (Beck and Haigh, 2014; van der Velden et al., 2015). A variety
    of treatment components facilitate patient specificity. Mindfulness experiences
    aim to improve ability to focus on (concrete, sensory) detail and decrease from
    abstract patterns (worry). Oldandy and Igesan (2020), cognitive restructuring
    aims to generalize beliefs about the world and specific contexts, environments,
    and techniques require help to identify specific instances and to focus on concrete-specific
    details (Craske et al., 2014). It is important to illustrate (e.g., with argument
    and personal history) that the response function of) claims made on the basis
    of such events are only applicable within context (when deciding who is going
    to do the deeds). A focus on the specific is important for the context to be contextualized
    beliefs of worthiness, jeopardy, failure, and vulnerability which drive common
    mental health disorders (Beck and Haigh, 2014). To this science-driven interventions
    have been offered as adjusts to CBT to enhance specific cognition, cognition,
    regulation (Watkins et al., 2012), overgenerised autobiographical memory (Hallford
    et al., 2021a), and mental imagery (Powell et al., 2021) as a training modality.
    Similarly, processed-focused adaptations of CBT have integrated a greater focus
    on being concrete (Clark et al., 2016). Machine learning techniques have been
    examined lately as a linear process, partly due to the quantity and structural
    format of such data.


    Machine learning techniques can provide insights into various factors during therapeutic
    exchanges between therapist and patient, at scale (Chekroud et al., 2021). Recent
    research has used deep learning models to identify features of treatment (e.g.,
    topic of discussion, duration of session) and features on outcomes (Ewbank et
    al., 2020), allowing to identify features of CBT success across large numbers
    of patients.


    The quality of information within therapeutic interactions may determine the degree
    of patient specificity in post-treatment outcomes. We expected that increased
    specificity during therapy period would predict better outcomes at least for individuals
    with severe symptoms, and more concrete processing specificity with CBT, or more
    specific detail during therapeutic activities (e.g., when designing experiments)
    may lead to improved solving (Sloan et al., 2021). We also wanted to examine whether
    specificity is more important in some tasks than others, and specificity within
    different feature categories (Ewbank et al., 2020), including goal setting. Our
    aim was to determine whether patient specificity predicted treatment outcome of
    CBT sessions or not; while CBT tasks require the individual to provide specific
    information, those who are inclined to specificity may find CBT easier, and complete
    a greater number of sessions.


    We trained a deep learning model to quantify the specificity of patient dialogue
    within internet-enabled CBT. Our primary hypothesis was that specificity of patient
    dialogue would predict recovery, as well as specificity of patients would predict
    better outcomes (PHQ-9). We found that specificity is linked to (Ewbank et al.,
    2021) were deployed by both therapist and patient. We also wanted to evaluate
    specificity in internet-enabled sessions (Hallford et al., 2021). Our second hypothesis
    was that specificity of patient would predict greater number of sessions.


    # 2. Method


    ### 2.1. Approvals

    Cambridge University Ethics committee granted ethical approval (2017).


    ### 2.2. Participants

    Participants (n = 65,030) were receiving treatment from NHS Access to Therapies.
    Inclusion criteria were age < 18 and registration with a general practitioner;
    Exclusion criteria were experiencing cognitive impairment, brain injury or dementia;
    history of psychosis; low literacy levels; visual impairment preventing using
    device.


    ### 2.3. Internet-CBT

    CBT was administered via instant messaging in online room by trained therapist
    (www.iesapt.org). Sessions were approximately 45-60 minutes in length, and on
    a weekly basis.


    ### 2.4. Specifying

    We analyzed 353,614 internet-enabled CBT sessions completed June 2012 to May 2021.
    Each therapy transcript were submitted by the user, and text entries were submitted
    by the therapist. The therapy transcript was elicited for linguistic features
    that could indicate (e.g., “can you tell me of an example/the task’s time you
    tell me this happened?”, “how do you know that is true?”). We identified specificity
    in patient responses during different types of task (Ewbank et al., 2020). Our
    results were clinically significant (see Fig. 1). It showed that, for example,
    being specific when completing therapy tasks was more important for outcome than
    specifying in the sessions. We separated specificity by the tasks elicited during
    agenda setting, homework setting, goal setting, planning for the future, discussing
    concerns and worries, completing CBT tasks (included any cognitive or behavioural
    activities, homework, education), assessing risk of suicide, summarizing the session,
    or other tasks. Full details on the different tasks are in Ewbank et al. (2020).


    Patient responses were classified using a supervised deep learning model, which
    predicted whether the response was specific. The model trained on a dataset of
    describing patient experiences (10,000 entries), written by individuals of interest.
    These entries were then scored as specific or non-specific by a human rater using
    criteria for the Autobiographical Memory Test (Williams and Benedict, 2008). We
    used 800 examples to train our model and 1000 to validate model performance using
    overlapping sets. The remaining 1000 entries were used as the held-out test set.
    We further validated the model on another separate dataset of out-of-test describing
    patient experiences (1632 entries) written by individuals.

