    # ## 2. THE EXPERIMENT


    # ### 2.1 HYPOTHESIS


    We explore the role of convolutional autoencoders (CAE) as a tool for characterizing
    image quality. One hypothesis is to establish that a CAE trained with a larger
    window (7x7) at each layer retains greater amount of information compared with
    a CAE trained with smaller (3x3) for the same size network. The expectation is
    that a 7x7 window captures more available space for features and therefore higher
    quality results. The second avenue of investigation is the size of the smallest
    space to capture the information contained within the image database.


