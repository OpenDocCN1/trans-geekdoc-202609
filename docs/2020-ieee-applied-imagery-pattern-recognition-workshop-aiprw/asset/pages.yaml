    # ## ABSTRACT


    The current trend toward incorporating learning (ML) models within closed-loop
    workflows renew existing issues for image compression and reconstruction; specifically,
    matching the generation-loop system operations. Our paper reviews methods to assess
    content in the reconstruction process to maintain trust in closed-loop workflows.
    We structure commonly ML architectures in the form of Autencoders. Autencoders
    are commonly studied for image reconstruction. For instance, the interpretability
    of image potential the intelligence value of data. Historically, the National
    Imagery Interpretability Rating (NIR) has been the standard for quantifying the
    intelligence potential by human observers. Experimental studies demonstrated that
    spatial resolution is the dominant predictor of NIR of an image and compression
    to 1 bit per pixel can maintain NIR levels. However, with ML that digits images
    rather than extracts, what the corresponding size of image required to maintain
    the NIR levels? To ends, we need to operate on moderate sizes, 480x480, to provide
