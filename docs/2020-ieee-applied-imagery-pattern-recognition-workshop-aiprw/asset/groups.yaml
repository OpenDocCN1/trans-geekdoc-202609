    These experiments compare the input image and its corresponding merged image created
    by the CAE at a specific latent space size. We believe that learning on a heterogeneous
    database will yield a smaller latent space than the heterogeneous data chosen
    for this experiment. The images were chosen from different handful, aerial, and
    satellite platforms to provide insights into images with different optical parameters.
    Reconstruction quality was assessed using the Structural Similarity Metrics and
    Mean Square Error.


    **Structural Similarity Metric**: Structural Similarity Metric (SSIM) was designed
    to objectively measure differences between images. SSIM typically uses an original
    and a processed version


    > $SSIM(x,y) = \frac{(2\mu_x\mu_y + C_1)(2\sigma_{xy} + C_2)}{(\mu_x^2 + \mu_y^2
    + C_1)(\sigma_x^2 + \sigma_y^2 + C_2)}$


    SSIM is performed on pixel by pixel and can be commonly applied to a single metric
    for the entire image. When reviewing the SSIM results, the SSIM is more sensitive
    to correlated latent space for the resolution rather than edge information. Again,
    let $x''$ represent the normalized images, and $y''$ represent the normalized
    image. Denote the pixels by $x''(i,j)$ and $y''(i,j)$, respectively.


    ```

    $MSE(x,y) = \sum_{i,j}[(x''(i,j) - y''(i,j)]^2]/N$

    ```


    # 2. AUTOENCODER ARCHITECTURE AND TRAINING


    During our initial work with image quality, we discovered that compression of
    1 bit per pixel enables image reconstruction without using NIIRS [9]. As a baseline,
    we utilized the CAE to neck the raw images below the 1% latent space size. There
    was a later latent size of 40x40N, where N is the variable number of filters in
    the network N. For each layer, convolution (and up-sampling reconstruction), bottleneck,
    normalization, and activation were performed sequentially.


    Applying the process to exemplar images using varying latent size and filter size
    illustrates the effects (Figure 2). show reconstructions where the CAE (ineffectively)
    passed reconstruction through a filter size and number of filters on the left
    and side respectively. The middle column shows the baseline. The upper row consists
    of 3 filters while the lower row consists of 7 filters. The results consist of
    reconstructions using different latent space sizes. The left to right is 5x, 10x,
    30x, 40x.


    All of the networks were trained using 200 iterations for the 12,000 cases. In
    all cases, training passed the knee-in-curve update where updates were marginal.
    The CAE architecture is extremely deep, without using an ever increasing number
    of layers. We used Windows laptops. The networks were implemented using Keras
    Spotify integrated development environment (IDE). The smallest 3x3 network contained
    39k parameters and trained in about 60 seconds per iteration. The largest 7x7
    network contained 375k parameters and trained in about 160 seconds per iteration.'
