    # 2.2 IMAGE DATABASE


    Much the current autoencoder research [4] [5] is focused on small format images,
    typically 100 by100 pixels or smaller. Many target models are trained using larger
    segments.¹ Further, small images do not


    allow for information content assessment because of their limited number of attributes.
    In particular, the Modified National Institute of Standards and Technology (MNIST)
    database of handwritten numbers [6] contains about 30% of unused varying pixels.²


    ![](img/0d22eb0c1c13ea71522d9dc9b3ec2246_1_0.png)


    Our database consists of grayscale 480x480 pixel (Figure 1). Top row shows a coarse
    resolution image and the bottom row depicts a scene with strong information, as
    indicated by the annotations. In row, the left image is a reconstruction better
    than optimal latent space. The center scene is the original image and the right
    is using a near optimum latent space. The bottom row shows aggregation of small
    features to a “blob” which is indicative of reconstruction that a full NIRS level
    worse than the original. The bottom row shows which that distorts features around
    the edges. Small ringing enhances visual segmentation, but large ringing reduces
    coherence:


    Our database includes images spanning the majority of the NIRS levels (Table 1
    and Table 2). Images at each row consist of different edge quality and noise floor.
    All the images were collected with download (near-tadir) viewing. Because of the
    ‘image’ across large areas, multiple segments were extracted from the images.
    The database totals 329 image segments. Each segment was rendered with flip, rotation,
    shear x y, and center offset augmentations for training.


    +   ¹ The WorldView 3 satellite claims a spatial resolution of 0.3m. So, and image
    segment encapsulating a 737 airplane would require nearly 400 pixels on a side.


    +   ² Off-line experiments with the MNIST dataset revealed indiscriminable loss
    with a 7 attribute latent space.


