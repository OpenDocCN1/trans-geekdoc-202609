    ## 3. RESULTS


    The analysis focuses on empirical characterization of the various representations
    induced by "parent" image to the data derived from autoencoding, we quantify the
    image quality loss using the SSIM and MSE. Linear modeling suggests that SSIM
    provides a clearer indication of the quality loss, but both metrics show clear
    relationships with the autoencoder processing (Table 3 and 4). In both cases,
