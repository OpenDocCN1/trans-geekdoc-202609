    # 4. CONCLUSIONS AND FUTURE DIRECTIONS


    CAE provide a flexible method for representing imagery at varying levels of fidelity
    depending on the size of the latent space. Using a smaller space yields a smaller
    file size, but at the cost of level quality. Our analysis indicates that SSIM
    and overall edge strength are methods methods characterizing quality imagery,
    and we have presented empirical metrics for quantifying these relationships. Furthermore,
    we demonstrate the relationship with perceptual interpretability measured by the
    NIRS of the image.


    Future investigations will seek to refine and validate the models presented here.
    Generalizations to others (RGB) imagery, thermal infrared imagery, and natural
    extensions. These methods could be useful in analyzing the image for new sensors
    or establishing bandwidth requirements for data transmission and storage.


