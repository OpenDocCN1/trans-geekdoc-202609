    # 机器学习、压缩与图像质量


    Steven A. Israel*, John M. Irvine*, Steve Tate*

    a The Charles Stark Draper Laboratory, Inc., 1943 Newton Square East, Reston,
    VA, 20190

    b The MITRE, 2021lington Road, Bedford, MA 01730-1420

    c The Charles Stark Draper Laboratory, Inc., 555 Technology Square, Cambridge,
    MA 02139


    ## 摘要


    将机器学习（ML）模型整合到闭环工作流中的当前趋势，使图像压缩和重构的现有问题再次出现；特别是与生成环系统操作的匹配问题。我们的论文回顾了在重构过程中评估内容的方法，以维持对闭环工作流的信任。我们将常见的
    ML 架构结构化为自编码器（Autencoders）的形式。自编码器常用于研究图像重建。例如，图像的可解释性是提高分辨率的原因——分辨率越高，人类执行任务的能力就越强。从历史上看，国家图像解释性评级（NIR）一直是人类观察者量化情报潜力的标准。实验研究表明，空间分辨率是图像
    NIR 的主要预测因子，而压缩到每像素 1 位可以保持 NIR 水平。然而，随着 ML 对图像进行数字化处理而非提取，那么维持 NIR 水平所需的相应图像大小是多少？为了解决这个问题，我们需要在
    480x480 的中等尺寸上进行操作，以便对针对小精灵尺寸图像（< 100x100 像素）的实验提供更真实的估计。


    在 20 世纪 90 年代，NIR 需要扩展热红外以及反射区域获取的多光谱图像。此外，NIR 是被查看的标准 [30]。


    图像采集已经演变。先进传感器面临来自多个光谱区域和运动图像的海量数据。自动初级处理提示操作员在经过确认后根据需要采取行动。学习算法已经发展为数字化图像而非提取特征，目标是提高跨过程的表征和一致性。因此，需要重新思考
    NIR 人类感知范式以进行有效探索。为了应对这一挑战，我们探索了开发学习标准方法的可行性。此外，我们寻求一种能够涵盖各种成像材料和类型的新标准。这里提出的初步调查表明，任何新标准除了目标表征外，还必须适应模型架构。


    ## 1. 引言


    图像质量是军事和安全任务潜在情报价值的关键。质量差的图像将为分析和决策提供必要的信息。人类分析图像时，国家图像解释性评级（NIR）是量化图像情报潜力的标准
    [1]。原始 NIR 使用图像分析由人类查看静态图像组成 [2]。因此，图像可解释性的首要决定因素是数据的情报价值。


    ### 2.1 假设


    我们探索了卷积自编码器（CAE）作为表征图像质量工具的作用。其中一个假设是建立：与相同规模的网络相比，在每一层使用较大窗口（7x7）训练的 CAE 比使用较小窗口（3x3）训练的
    CAE 保留了更多的信息。预期是 7x7 窗口为特征捕获了更多可用空间，从而获得更高质量的结果。调查的第二个方向是捕捉图像数据库中包含信息的最小空间大小。


    ### 2.2 图像数据库


    目前的许多自编码器研究 [4] [5] 集中于小格式图像，通常为 100x 100 像素或更小。许多目标模型是使用较大的片段训练的。¹ 此外，由于属性有限，小图像无法进行信息内容评估。特别是，手写数字的美国国立标准与技术研究院（MNIST）数据库
    [6] 包含约 30% 的未使用变化像素。²


    ![](img/0d22eb0c1c13ea71522d9dc9b3ec2246_1_0.png)


    我们的数据库由灰度 480x480 像素组成（图 1）。


