    ## 4. CONCLUSIONS AND FUTURE DIRECTIONS


    CAE provide a flexible method for representing imagery at varying levels of fidelity
    depending on the size of the latent space. Using a smaller space yields a smaller
    file size, but at the cost of quality. Our analysis indicates that SSIM and overall
    edge strength are methods characterizing imagery, and we have presented metrics
    for quantifying these relationships. Furthermore, we demonstrate the relationship
    with perceptual interpretability measured by the NIIRS of the image.


    Future investigations will seek to refine and validate the models presented here.
