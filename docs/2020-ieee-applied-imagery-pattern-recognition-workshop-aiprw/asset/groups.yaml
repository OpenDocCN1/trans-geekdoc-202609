    # ## ABSTRACT


    The current trend toward incorporating learning (ML) models within closed-loop
    workflows renew existing issues for image compression and reconstruction; specifically,
    matching the generation-loop system operations. Our paper reviews methods to assess
    content in the reconstruction process to maintain trust in closed-loop workflows.
    We structure commonly ML architectures in the form of Autencoders. Autencoders
    are commonly studied for image reconstruction. For instance, the interpretability
    of image potential the intelligence value of data. Historically, the National
    Imagery Interpretability Rating (NIR) has been the standard for quantifying the
    intelligence potential by human observers. Experimental studies demonstrated that
    spatial resolution is the dominant predictor of NIR of an image and compression
    to 1 bit per pixel can maintain NIR levels. However, with ML that digits images
    rather than extracts, what the corresponding size of image required to maintain
    the NIR levels? To ends, we need to operate on moderate sizes, 480x480, to provide
    realistic estimates over experiments against small sprite size (< 100x100 pixels)
    images.


    interpretability is reason finer the resolution, the better humans can perform
    tasks. In the 1990s, NIR was needed to expand the thermal infrared, and multispectral
    imagery acquired in the reflective region. More, the NIR was standard to be viewed
    [30].


    Image collection has evolved. Advanced sensors encounter enormous data volumes
    multiple spectral regions and motion imagery. Automated primary processing cues
    operators-on-confirmation to take action based on need. The learning algorithms
    have developed to digit imagery rather than extract features, with the goal of
    improved characterization and consistency across processes. Consequently, there
    is a need to rethink the NIR human perception paradigm for effective exploration.
    To address this challenge, we explore the feasibility of developing a computational
    method learned standard. Furthermore, we seek a new standard that addresses the
    range of imaging materials and types. The preliminary investigations presented
    here show that any new standard must adapt model architectures in addition to
    target characterization.


    # ## 2. THE EXPERIMENT


    # ### 2.1 HYPOTHESIS


    We explore the role of convolutional autoencoders (CAE) as a tool for characterizing
    image quality. One hypothesis is to establish that a CAE trained with a larger
    window (7x7) at each layer retains greater amount of information compared with
    a CAE trained with smaller (3x3) for the same size network. The expectation is
    that a 7x7 window captures more available space for features and therefore higher
    quality results. The second avenue of investigation is the size of the smallest
    space to capture the information contained within the image database.


    # ## 1. INTRODUCTION


    Image quality is a key of potential intelligence value for military and security
