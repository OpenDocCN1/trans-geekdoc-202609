    Now let’s implement the meat of the function. This is a bigger chunk of code,
    but we’ll deconstruct it in just a moment:


    ![Image](p161-1.jpg)


    Looks fun, right?! You may already have deciphered some high-level understanding
    of the code while looking through it, but let’s dissect it now. Starting, of course,
    with the loop:


    ![Image](p161-2.jpg)


    As mentioned, we want to spawn the same number of Goroutines as there are cores
    on this machine to handle those Goroutines. Our application is very special in
    that it’s very CPU-bound, not I/O-bound or memory-bound, meaning that the bottleneck
    to high performance in this case is not having more memory bandwidth or faster
    I/O. Instead, you need a faster processor. When applications are `not` CPU-bound,
    it may make more sense to spawn more Goroutines than there are cores, because
    while one Goroutine is waiting on the CPU for something else to complete, another
    one can begin to run.


    Because we want to spawn only as many Goroutines as we have cores, we use a `for`
    loop to iterate a number from `0` to `1` less than the number of cores we have.
    At each iteration, we append a `0` to the hash array. Remember, the hash array
    contains the number of hashes each Goroutine has processed.


    Next, in the loop, we spawn the Goroutine itself:


    ![Image](p162.jpg)


    The function this Goroutine invokes only takes a single argument, and that is
    its index; using this index (called `hashIndex` in the code), it can log into
    the hash array the number of hashes it has processed.


    Within this function, we create a new random seed by getting the local Unix Epoch
    timestamp in nanoseconds. This seed is converted to a 64-bit unsigned integer,
    which is compatible with the custom random number generator we defined in the
    last chapter.


    Then, we run a little bit of what may look like “funny” logic if you come from
    languages such as C, Python, Java, or Swift. Essentially, we start by allocating
    a new array of 20 bytes. These are the 20 bytes in memory that will contain the
    actual “random” ending to the string, which may give us the solution to our proof
    of work problem. Then, we insert the prefix string (represented as an array of
    bytes) in the `beginning` of this new array.


    We insert it in the beginning by using the `append` function. The `append` function
    supports `variadic arguments`, which, if you remember from [Chapter 2](#ch2.xhtml),
    means it can take any number of arguments of the same type after the first argument.
    The first argument must be an array of some type, and the rest of the variadic
    arguments must be of the same type as the elements within the array.


    By feeding the `prefix` as the first argument into the `append` function, and
    then feeding all of the 20 elements in `randomBytes` as 20 arguments after that,
    we end up essentially creating a new array where the memory looks like this:


    ```

    [bytes of the prefix][bytes we initialized when we allocated randomBytes]

    ```


    If you’re wondering how the last line in that snippet manages to send 20 parameters
    by only passing 1, it’s using the `...` operator. This will “unfurl” the array
    into 20 separate arguments at runtime, making it look to the callee function as
    if you had manually passed those 20 arguments.


    Next, within the function that the Goroutine invokes, we need an infinite loop
    that can actually do our processing. This loop has a `select` statement within
    it because, of course, we want to know when `closeChan` tells us to exit. Here’s
    how we do that:


    ![Image](p163.jpg)


    This code may look simple (and it is!), but it packs a really interesting piece
    of logic. Look at the case for receiving from `closeChan`: Why do we put a number
    `back` into the channel after we receive a number from it? Well, first things
    first. Recall that, regardless of the fact that we put a number back into the
    channel, we `do` return from the function if we get a value from this function.


    So why do we end up putting a number back in the channel? It’s because when we
    do this, we only need the Goroutine that finds the solution to insert `a single
    number` into this channel, and `all` of the Goroutines will exit. That’s because
    technically only one Goroutine will pick up the number the solution Goroutine
    sends, but before that next Goroutine exits, it will tell `another` Goroutine
    to exit by sending that message back into the channel.


    The final Goroutine will send another message to the channel and then exit, but
    because there are no more Goroutines to pick up the message, that’s just going
    to stay there, which doesn’t really matter to us.


    ![Image](p164.jpg)


    This next `case` in the `select` statement is where the main work actually happens.
    Before we can discuss the work, we think it’s important to discuss what’s more
    than likely the elephant in the room: Why is the case waiting for `time.After(time.Nanosecond)`?


    Again, if you go back a couple of pages, you’ll recall we mentioned that a `select`
    statement allows you to wait for multiple blocking operations to unblock at the
    same time. `time.After` is a blocking operation, and so is waiting for a value
    on the exit channel. We just need `some` kind of blocking operation here so it
    is eligible to be part of the `select` statement, in order to run this code immediately
    if the exit channel doesn’t have any information to receive.


    Because we’re only asking Go to run this code after a nanosecond, it’s essentially
    a noop (“no-op” or “no operation”), but because we also ask Go to evaluate the
    `exitChan` wait first, if there is a value to receive there, we won’t end up running
    this code.


    Within the actual `case`’s code, the operations we execute are similar to the
    previous, raw “pow” function that didn’t use Goroutines. Except, instead of running
    them a single time, we run them 5000 times. This is so we run blocks of 5000 checks
    in between waiting for the exit channel. If we were to only do a single check
    before waiting for the channel again, we wouldn’t be doing enough work to justify
    the extra overhead of all these channels, the `switch` statement, and the Goroutine.


    Specifically, we have a `for` loop that iterates 5000 times, and each time, generates
    a new random string to append to the prefix. It then feeds the complete string
    (prefix + randomized portion) into the `Hash` function, which will tell us whether
    or not we met the proof of condition.


    A bit of a change from the last chapter comes in what we do if we end up finding
    a solution. Once we find a random string that meets our requirements, we add the
    `count` variable (which is how many of the 5000 iterations we’ve completed) to
    the Goroutine’s dedicated element in the hash array. Then, we send the solution
    to the `solution channel` and start the exit cycle by feeding a single number
    into the `exit channel`. We also return from the function, breaking the loop,
    and killing this Goroutine.


    If we don’t find a solution in these 5000 iterations, we increment this Goroutine’s
    dedicated element in the hash array by 5000 and iterate once again through the
    larger `for` loop, which runs the `select` statement and, by extension, potentially
    this code, once again.


    ![Image](p165-1.jpg)


    This next section of the code closes the `for` loop inside the Goroutine, closes
    the function, invokes the function with the `index` variable from the array, and
    then closes the `for` loop that’s responsible for spawning the Goroutines.


    ![Image](p165-2.jpg)


    And, just like that, you’ve successfully built your first real application that
    uses the power of Goroutines!


    This is what your code should look like now:


    **CODE LISTING 5.6** The new, improved, Goroutine-powered pow function


    ![Image](p166.jpg)


    ![Image](p167.jpg)


    Because this function has the same signature, you should be able to keep your
    main function exactly the same, and compile and run this code. In [Chapter 4](#ch4.xhtml),
    we mentioned that on a MacBook Pro, this code reached around 4 million hashes
    per second.

