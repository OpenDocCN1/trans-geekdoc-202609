    The first of the four nested loops (the outermost loop) is responsible for moving
    from the beginning to the end of a row. The second inner loop is responsible for
    moving from one row to another. Whenever we encounter a row or column that would
    be impossible to get the value for, like something that’s out of bounds, we skip
    the iteration. If we find the row and column have the same index as the cell we’re
    trying to calculate neighbors for, we also skip it.


    However, if none of these guard conditions is hit, and we are at a valid index,
    then we look at the value of the neighbor, and if it’s alive, we increment the
    value of this cell in the `“neighbors”` array.


    Before we continue, let’s create another structure called `GameOfLife`, which
    contains a game board that represents the current state of the environment, the
    pixels we’ll render of that game board, and also the size of the cells on the
    board itself. This is because a single cell won’t just be a single pixel, that
    would be incredibly tiny—instead, each cell will have a certain “size” on the
    screen, and that’s what we need to store.


    ![Image](p101.jpg)


    To add to this, let’s create some simple helper functions that can create a new
    Game of Life instance with an empty board, as well as a function that can populate
    the board with random cells, meaning they all have a 50/50 chance of being dead
    or alive:


    ![Image](p102.jpg)


    ![Image](p103.jpg)


    Now let’s create a function that can help us actually run a single iteration of
    Conway’s Game of Life according to the conditions we defined earlier on in this
    section and the output from the `countNeighbors` function that we just defined.


    Within this function, we also update the canvas itself. Because we’re just updating
    the canvas that we’ve created ourselves, and we’re not actually rendering out
    to the screen, it’s super-fast and adds barely any overhead.


    ![Image](p104.jpg)


    This code is also quite simple. It implements a pointer receiver to the `GameOfLife`
    structure, takes no extra arguments, and returns nothing because it modifies the
    original structure it was passed a pointer to.


    Within the function, we count all the “alive” neighbors for each cell in the game
    board, and we then loop through every Y index in the game board. We subscript
    the board at every iteration to get that row, and loop through every column in
    that row. If the cell is alive and the neighbor count is 2 or 3, we keep the cell
    as it is. Or else, if the neighbor count is 3, we turn the cell alive. Once again,
    if none of the previous conditions evaluated to true, we turn the cell dead.


    Whenever we change the cell’s living status to alive or dead, also make the necessary
    change in the pixels.


    Finally, let’s tie all of this together into a main function that creates a canvas
    on which to render pixels, creates the Game of Life, runs the iterations, and
    updates the canvas. The iterations of the Game of Life will end and the program
    will exit once the window is closed.


    ![Image](p105.jpg)


    Your code should now look like this:


    **CODE LISTING 4.2** “Conway’s Game of Life” application


    ![Image](p106.jpg)


    ![Image](p107.jpg)


    ![Image](p108.jpg)


    ![Image](p109.jpg)


    When you run the program, you should see a window like [Figure 4.6](#ch4.xhtml#fig4_6),
    where the Game of Life is chaotically killing and birthing (giving birth to) new
    cells!


    ![Image](Tanmay_0406.jpg)


    **FIGURE 4.6** A snapshot of the Game of Life application in action


    That’s amazing! You’ve not only built a real application in Go, you’ve built an
    entire GUI for it as well! Now, we’re sorry, but we want you to build another
    application *without* a user interface. Don’t worry—it’s still going to be fun—we’ll
    implement a building block of one of the most hyped technologies in the world:
    Blockchain!


    ### Proof of Work


    The name and logic for this example app sound scarier than they actually are—the
    basic idea is actually pretty simple! We’re essentially trying to brute force
    a value that’s mathematically impossible to compute.

