  trans: "\n在不同的平台上，这些库以不同的文件格式存在。在 Linux 上，它们是 `.so`（共享对象）；在 macOS 上，它们是 `.dylib`（动态库）；而在\
    \ Windows 上，它们是 `.dll`（动态链接库）。它们的基本目的相同。某些系统处理这些库的方式比其他系统更或不那么优雅——这导致了 Windows\
    \ 上偶尔会出现的“DLL 地狱”状况。\n\n关于共享库的知识引导我们学习如何跨编程语言共享代码。因为 AOT 编译语言将其高级代码翻译成相同的底层机器码格式——甚至是共享库——因此我们可以直接将某些任意代码编译为共享库。然后，从另一种编程语言开始，我们可以获取编译后的代码并将其链接到上述库，从而使我们能够从该其他语言调用这些代码。\n\
    \n正如你可能察觉到的，这种技术是有局限性的。主要来说，如果我们想要调用的语言是解释型或 JIT 编译的怎么办？嗯，这确实引入了一些挑战，但在那种情况下，解决方案因具体情况而异。对于\
    \ Python，你可以链接到解释器的共享库，并手动解释 Python 程序。对于 Java，你也有类似的能力。\n\n在本章中，我们不会探索调用解释型语言。相反，我们将只处理\
    \ AOT 编译语言。然而，还有一个局限性，如果你熟悉 Go 编译器的内部运行机制，可能会错过这一点。这个局限性在于：并不是所有的 AOT 编译语言都遵循相同的机器码格式！\n\
    \n嗯，从操作系统的角度来看，“理论上来说”，是的，每个可执行文件都遵循相同的格式，无论它是从什么语言编译的。但在实践中，每种语言通常都会在其二进制文件中添加自己的一套技巧，以实现某些特殊行为。这些添加的代码被称为语言的“运行时”（runtime），通常情况下，语言拥有的“运行时”越多，从其他语言调用其代码就越令人恼，反之亦然。\n\
    \n这是因为编译器最终输出的代码并不完全是你程序中编写的代码。你会发现，那些编译后的机器码是基于某些假设构建的——只有当编译后的代码是从使用相同编译器编译的其他代码调用时，这些假设才成立。以\
    \ Swift 为例。当你传递一个类引用时，Swift 的 ARC 会增加引用计数，以确保它能够跟踪何时需要释放内存。如果你将该引用作为指针传递给某些 C\
    \ 代码，C 代码并不拥有该指针，并且永远无法确定该内存是否真的可以安全访问或修改。\n\n而且，正如我们在前面的章节中已经确定的，Go 有一个非常大的运行时，比\
    \ C、Swift 或 Rust 大得多。这是因为 Go 需要处理 Goroutines 以及它们为局面增加的所有负担。因此，当你将一个 Go 程序编译为汇编时，你会发现你定义的\
    \ `main` 函数甚至不是程序的入口点。Go 程序的入口点实际上位于与之链接的共享库内部，该库包含了 Go 运行时的大部分后端内容。该共享库随后初始化运行时，准备并设置一些内部机制，然后调用你的\
    \ `main` 函数。当程序退出时，它当然也是通过这个库的。\n\n因此，你不能简单地“将 Go 程序链接到共享库并调用那些函数”。在 Go 中调用共享库实际上会产生相当大的性能损耗，至少与其他语言相比如此。这种损耗几乎可以通过使用\
    \ `gccgo` 编译器而不是 `gc` 来抵消。\n\n尽管有这种损耗，但从其他语言调用代码通常是值得的，特别是当另一种语言执行特定任务的能力从根本上优于\
    \ Go，但你又想从 Go 代码中访问计算结果时。\n\n为了演示这种情况，我们将在本章中探索 Go 与其他 AOT 编译语言之间互操作的多种任务和方法。\n\
    \n### 与 C 代码互操作\n\n让我们从从 Go 调用 C 代码的简单“Hello World!”示例开始。首先，看看纯 C 语言版本是什么样的：\n\
    \n**CODE LISTING 6.1** C 语言的简单“Hello World”应用\n\n![Image](img/p173.jpg)\n\n关键行是第\
    \ 1 行和第 3 行。这些行告诉编译器：\n\n1. 从操作系统获取 `stdio.h` 文件并将其内容填充进二进制。\n\na. `stdio.h` 文件包含了声明。\n\
    \n2. 这意味着我们需要包含 `stdio.h` 头文件：\n\n```c\n#include <stdio.h>\n\nint main() {\n \
    \   printf(\"Hello, World!\\n\");\n    return 0;\n}\n```\n\n为了使用 cgo，你只需要导入 `C`\
    \ 包，并将你想运行的所有 C 代码作为注释放在导入之前：\n\n```go\npackage main\n\n/*\n#include <stdio.h>\n\
    \nvoid helloWorld() {\n    printf(\"Hello, World!\\n\");\n}\n*/\nimport \"C\"\n\
    \nfunc main() {\n    C.helloWorld()\n}\n```\n\n这将使 Go 导入 C 模块，然后查看之前的注释，并将其视为需要编译进\
    \ Go 可执行文件的 C 代码。\n\n现在，为了调用该 C 函数，你可以像对待 C 模块中的其他任何函数一样对待它：\n\n**CODE LISTING\
    \ 6.3** 从 Go 调用 C “Hello World”函数\n\n![Image](img/p175.2)\n\n如果你编译并运行该代码，你应该会得到一个通过\
    \ C 而不是 Go 输出 hello world 的可执行文件。\n\n既然你已经理解了如何在不需要库的情况下从 Go 调用简单的 C 代码，让我们探索稍微复杂一点的。具体来说，如果你想向\
    \ C 传递变量或使用函数的返回值怎么办？\n\n我们遇到的第一个障碍是类型从 C 到 Go 以及反向转换。cgo 模块包含许多类型，例如 `C.int`（32\
    \ 位有符号整数）、`C.uint`（32 位无符号整数）、`C.long`（64 位有符号整数）等。\n"
- fmt: '

    One of the most difficult types to convert is the string. This is because strings
    aren’t technically one piece of data. They’re a list—an array—of multiple independent
    pieces of data, which we call characters. What’s worse is that what we consider,
    as humans, to be a single “character” may not be represented by a single byte,
    as in the case of emoji or other Unicode characters.


    In C, strings are represented as raw arrays of 8-bit signed integers, called `char*`
    (or “pointer to a character buffer”). The last, terminating value in these strings
    is usually a byte with all bits set to OFF (to 0), which acts as a “null terminator”;
    thus, the name “null terminated strings.” This tells us when the string buffer
    actually ends so we don’t need to keep track of the length alongside the buffer
    forever.


    In Go, translating a Go string to a C string is quite easy with the help of the
    `CString` function from `cgo`. However, keep in mind that this makes a copy of
    the memory backing the string, which can be bad in some cases if the code is performance
    sensitive. This is a price you have to pay when you’re interoperating between
    languages that are high level and have the baggage of a runtime.


    This also means that after you use the C string that you make, you are responsible
    for freeing that memory and making sure it doesn’t live longer than it needs to.
    This is called a *memory leak*. Go’s Garbage Collector cannot deal with this pointer
    for you, because you created it and are responsible for freeing the buffer of
    memory it points to.


    The following is the signature for the `CString` function:


    ```

    func C.CString(string) *C.char

    ```


    Now let’s use a slightly more complex C function in Go. Specifically, let’s define
    a function that simply takes a null terminated string and prints it out. Here’s
    all the code you’ll need to do that:


    **CODE LISTING 6.4** Passing character pointers to C from Go


    ![Image](p177.jpg)


    As you can see, the logic is quite simple. First, we implement the C code in comments
    before the import of the `cgo` module. The C function simply takes a character
    pointer and passes that to the `printf` function, along with a format string telling
    it to print the character pointer followed by a new line.


    However, you need to do a bit more work in the main function. The first thing
    is to convert the Go string to a C string, which is done by `C.CString("This is
    from Golang")`. Then, pass it as an argument to the C function, just as you would
    to any other Go function.


    Because you’re in control of the memory manually, you also need to free the buffer
    yourself. Remember, though, that the C string is a character pointer, not just
    a generic pointer. The `free` function also technically expects a generic pointer
    with no type information attached to it. Because Go is strict with types, you
    need to use the `Pointer` function in the `unsafe` module to erase the type associated
    with the C string. Then, you can pass it to the `free` function, and you’re good
    to go!


    One more thing—the definition of the `free` function is the reason we had to also
    include `stdlib.h` in the C code this time alongside `stdio.h`. Without that header,
    there would be no way for us to free the memory we allocated.


    If you were to run this code, you should see “This is from Golang” printed to
    your terminal. Thus, the string is internally passed from Go to C, printed, and
    then the memory is freed.


    Taking return values that come from C functions and translating them back into
    types that Go can understand is also pretty simple. For example, if you were to
    *return* a string (character pointer), you can convert it to a Go string like
    so:


    **CODE LISTING 6.5** Converting a C string to a Go string


    ![Image](p178.jpg)


    In this case, you don’t need to free the character pointer returned from C because
    that value was never allocated on the heap in the first place. It was only stored
    on the stack. However, if the buffer originated as the result of a call to `malloc(1)`,
    then the `free` is required.


    One last thing you should know about—you are allowed to instruct the C compiler
    to compile the code you insert in your comments however you’d like it to. So,
    for example, if you want to pass a specific compile flag, you can do so using
    the `CFLAGS` parameter.


    Let’s say you’re writing a function to tell whether or not a number is “ugly,”
    meaning its prime factors include only 2, 3, and 5. These are the first 20 ugly
    numbers:


    ```

    1, 2, 3, 4, 5, 6, 8, 9, 10, 12, 15, 16, 18, 20, 24, 25, 27, 30, 32, 36

    ```


    The following could be some C code to achieve this:


    **CODE LISTING 6.6** Code to get the nth ugly number in C


    ![Image](p179.jpg)


    Using the `getNthUglyNumber` function, you can get the nth ugly number. For example,
    the 10th ugly number is 12. The 20th is 36. This algorithm can definitely be improved,
    but let’s roll with this one for now.


    Write the following Go code to wrap the C code:


    **CODE LISTING 6.7** Calling the C code


    ![Image](p180.jpg)


    ![Image](p181.jpg)


    Write the following Go code to wrap the C code:


    **CODE LISTING 6.8** Linking against a shared library and calling a C function


    ![Image](p182.jpg)

