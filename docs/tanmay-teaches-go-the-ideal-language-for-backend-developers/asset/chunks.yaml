    另一种重用代码并使其模块化的极佳方法是使用函数。函数是大多数编程语言中不可或缺的一部分，而 `Go` 的函数极其有用。然而，在编写本文时，它们缺少一个**关键**特征，这个特征可以将整洁、可重用且低冗余的代码与潜在漏洞风险较大的代码区分开来。不过，语言开发者正在完善这一特性的。稍后我们将对此进行更多介绍。


    你已经看到过 `Go` 中函数的一个示例了：`main` 函数！它的写法如下：


    ```

    func main() {

    }

    ```


    如果你只运行这三行代码，它将成功编译并运行——尽管程序将什么都不做。这是因为该函数不返回任何内容，因此并不*需要*“`return`”语句。我们想更显式地指出这一点，因为某些编程语言（如
    `C`）要求 `main` 函数必须返回某些内容（例如退出代码），以便让调用进程知道程序是否成功完成了预定任务。在 `Go` 中并非如此。


    如果你想创建一个始终返回常量值的简单函数，例如 `pi` 的 32 位浮点表示，你可以像这样编写代码：


    **代码列表 2.11** 声明、定义和调用函数


    ![Image](img/p23.jpg)


    注意函数签名的结构方式。返回类型注解直接放在函数名之后、函数块的左大括号之前。


    然而，括号仍然阻碍了我们——正如你可能猜的那样，这些括号是为了你可能想要传递给函数的参数。


    例如，如果你想要一个返回 `pi` 乘以某个非负整数结果的函数，你可以编写以下函数：


    **代码列表 2.12** 一个与任意常量相乘的新的 `valueOfPi` 函数


    ![Image](img/p24.jpg)


    再次，注意函数签名是如何变化的。我们首先放置了参数的名称，然后是一个空格，最后是该变量的类型。


    在继续之前，我想在这里说明一个简短的旁注。当我们运行之前的乘法时，请注意我们如何手动将无符号整数转换为 32 位浮点数。这样做是为了避免操作中的任何歧义。


    你现在可能在想：类型转换是如何运作的？类型转换能够遵循特定的规范，将按某种类型期望的方式排列比特转换为另一种类型期望的方式。例如，`float32` 在内存中是如何表示的？嗯，`Go`
    中的 `float32` 符合 IEEE 754 规范。


    一个比特留给符号（是正还是负？），8 个比特留给指数，通常 23 个比特留给小数部分。然而，整数完全不同：它们在二进制中的表示方式非常直接，比特值从右到左按
    2 的倍数增加，最左的比特通常留给“符号”。


    所以，如果你想将整数值转换为 `float32` 值，并不仅仅简单地说“这些是比特。把它们视作 `float32`”。

