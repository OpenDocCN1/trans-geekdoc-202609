    这种工作原理是通过取一个值为 0 的无符号整数——意味着该数字中的所有位均为 0——并对其执行位取反操作，即脱号符号 `^`。这会将每一位都变为 1，从而将变量的值变为无符号整数能持有的最大值。


    ### 实现 Dijkstra 算法


    是时候实现 Dijkstra 算法了。在接下来的部分，输入和输出与我们之前看到的伪代码相同。它只需要知道源节点，然后就会为你计算成本和父节点：


    ![Image](img/p84.jpg)


    ![Image](img/p85.jpg)


    为了了解这段代码是如何工作的，我们认为最好从代码片段的末尾开始，即代码中的第二个函数。如你所知，伪代码只定义了一个函数，那么为什么我们在这个代码片段中有两个独立的函数来用于路径查找呢？


    这是因为 Go 正如我们提到的，是一种不提供许多奢华特性的语言。有很多你本以为拥有的各种功能，遗憾的是，你需要自己实现它们。


    在某些情况下，这对性能可能非常有益，因为你不需要使用标准库来处理一切，并且不再围绕使用库来设计数据结构，而是围绕你的数据来设计算法。然而，有时这也会对性能产生不利，因为你经常需要重复轮子，并实现那些本可以通过开源社区做得更好的功能。


    在这种情况下，第二个函数的任务非常简单：获取一个告诉我们节点“成本”（在本例中为“距离”）的字典，以及一个告诉我们节点是否被访问过的映射（map），找出成本最低且*尚未*被访问的节点。


    该函数通过创建两个变量来实现这一点：具有最小距离值的节点的距离以及该节点的名称。最初，我们不知道这些值，所以简单地填充了占位值。例如，距离为无穷大——稍后你会明白为什么。


    然后，我们遍历 `dist`（距离）映射中的不同的值，当我们看到某个节点的距离小于我们在 `lowestNode` 和 `lowestCost` 变量中存储的值时，我们会更新最小距离以及具有该距离的节点名称。


    回到为什么距离的初始值是无穷大的原因……这是为了无论我们遇到的第一个非无穷大距离是多少，我们最终都能替换掉占位值，因为任何不是无穷大的数字都会比无穷大小。


    代码片段中第二个函数（`getClosestNonVisitedNode`）第 4 行的逻辑非常有趣，因此在继续之前值得详细说明一下：


    ```

    if _, ok := visited[key]; dis == INFINITY || ok {

    ```


    这行代码尝试用我们从距离字典获取的键来查询“访问”（visited）字典。当字典返回两个响应值时，我们忽略第一个（即实际值），而是只关注字典的第二个响应。这第二个响应告诉我们该键是否存在于字典中。如果键存在，则该节点已被访问过（无论其在字典中的值为何），我们就会跳过代码的这次迭代。


