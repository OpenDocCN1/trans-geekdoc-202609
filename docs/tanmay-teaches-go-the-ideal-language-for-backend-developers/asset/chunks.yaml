    ### A Go Primer—“Hello, World!”


    To start, let’s take a look at a simple program that gives you a good feel for
    Go. So, as is programming tradition, let’s implement “Hello, World!”


    Begin by creating a new file called “main.go” in a new directory called “helloworld”.
    Your directory structure should look something like this:


    ![Image](p1.jpg)


    Within the main.go file, enter the following code.


    **CODE LISTING 2.1** The traditional “Hello, World!” in Go


    ![Image](p2.jpg)


    That’s all there is to it! If you navigate to your terminal, go into your helloworld
    directory and run:


    ```

    go build

    ```


    You should now have an executable called “helloworld”, in the same directory.
    In other words, you’ve just created and compiled your very first Go app, which
    you can now run! On a UNIX-like system, you can invoke (or “run”) it like so:


    ```

    ./helloworld

    ```


    You should then see the following output:


    ```

    Hello, World!

    ```


    The program does work—but how? Let’s go back and analyze the source code part
    by part, as you can see in [Table 2.4](#ch2.xhtml#tab2_4).


    **TABLE 2.4** Functionality of Each Section of the “Hello, World!” Code


    ![Image](t2.4.jpg)


    **NOTE:** One difference you may have noticed about Go syntax is that the first
    letter of the `Println` function is, well, a capital letter. More on that a bit
    later. There is quite an intriguing reason for this.


    ### Variables


    The Go language is both strongly and statically typed. That means two things:


    **1.**   Variables are not automatically converted from one type to another by
    the compiler in a “hidden” fashion. Even casts such as 32- to 64-bit integers
    must be completed manually.


    **2.**   The compiler *can* try to figure out the type of variables at compile
    time, instead of having you specify the type yourself. However, Go doesn’t do
    “Type Inference” in as advanced a manner as Swift does—again, that’s because the
    compiler wants to be *as fast* as possible. We’ll explore some of these limitations
    as we progress.


    The standard in Go is to allow the compiler to figure out the type and to avoid
    manual annotation, unless it’s necessary, such as to tell the compiler not to
    use a type that translates directly from a certain literal value (e.g., “for this
    number, please don’t use the default 64-bit integer, use an 8-bit integer instead”).
    You will see multiple examples of this manual annotation as we continue.


    Let’s start exploring the world of variables by looking at global variables. A
    global variable can be one of two types: static or constant. A static global variable
    can be declared like so:


    ```

    var age = 16

    ```


    That expression does two things, not just one. It first declares a new global
    static variable called “`age`”, and then initializes that variable with the value
    `16`. In this case, the initialization and declaration are able to work together
    to mark this variable as an “`int`” type. However, if you are unable to initialize
    the value, and just want to “declare” that a global static variable exists, you
    must explicitly code the type of the variable yourself, like so:


    ```

    var age int

    ```


    If you’d like, even though it’s not considered good practice, you can combine
    the approaches and explicitly declare the type of the variable and provide a value
    with which to initialize it:


    ```

    var age int = 16

    ```


    Because it’s a global *static* variable, it’s allowed to change. So, if you have
    a program such as the following:


    **CODE LISTING 2.2** Getting and setting a global static variable


    ![Image](p3.jpg)


    You should see the following output:


    ```

    16

    ```


    ```

    24

    ```


    Now, as a heads up, in a lot of Go programs, you’ll see a lot of variable, function,
    and structure names that start with an uppercase letter (and follow the UpperCamelCase
    standard), instead of the more traditional lowercase one. For example, `var` `Age`
    `int` instead of `var` `age`. Why is this?


    It’s because the capitalization of the first letter is how *Go enforces access
    control*. In other languages, such as Swift and Java, you must annotate your symbols
    (for example, function and variable names) with “public,” “private,” and other
    access control keywords to get the compiler to enforce where, for example, certain
    variables and functions can and cannot be reached. In Go, however, there are no
    annotations for access control. The capitalization of the first letter itself
    determines if your variable is `public` or `private`. If it’s capitalized, it’s
    `public`; if it’s lowercase, it’s `private`!


    **NOTE:** This decision is definitely a controversial one, because deciding whether
    or not you want your code to be accessible publicly is now tied to the stylistic
    choice of your code.


    Many languages like to enforce access control in their own ways, so Go isn’t incredibly
    different in that regard. Python, for example, encourages duck typing, which means
    it doesn’t enforce those rules *at all!*


    One more thing to know about syntax related to variables: If you’d like to initialize
    multiple variables at once, you don’t need to repeat the “var” keyword multiple
    times. You can simply write:


    ![Image](p4.jpg)


    This will declare and initialize those two strings as global variables. You can
    even mix and match types like so:


    ![Image](p5.jpg)


    Notice the lack of commas at the end of each line—the value assignment itself
    acts as the delimiter between variables.


    Now that you know how to work with `global` `static` variables, let’s take a look
    at global constants. Constants, as the name implies, strictly *cannot be modified*.
    In languages such as Go and Swift, where safety is valued immensely, you can’t
    even do tricks such as “get a pointer to the constant and modify it that way,”
    because the compiler won’t let you. This makes it so the compiler can be absolutely
    certain when running optimizations, such as constant folding, which precomputes
    some calculations to avoid executing them at runtime.


    A global constant is created by replacing the word “`var`” in a variable declaration
    with “`const`”. It can be used like so:


    ```

    const name1 = "Tanmay Bakshi"

    ```


    ```

    const name2 string = "Baheer Kamal"

    ```


    Both of these are valid, but the first one relies on type inference, whereas the
    second relies on a manually annotated type, which in this case is `string`, for
    the Go compiler. Keep in mind that while a variable can be declared but may not
    be initialized, a global constant cannot *just* be declared, because it cannot
    be changed in the future.


    For some types, such as maps, the Go compiler cannot ensure that you won’t use
    some trickery in your code to mutate the internals of the constants. Therefore,
    you’re not allowed to store those types inside of constants; you must use a global
    static variable instead.'
