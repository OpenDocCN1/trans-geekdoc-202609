    \n### A Go Primer—“Hello, World!”\n\nTo start, let’s take a look at a simple program\
    \ that gives you a good feel for Go. So, as is programming tradition, let’s implement\
    \ “Hello, World!”\n\nBegin by creating a new file called `main.go` in a new directory\
