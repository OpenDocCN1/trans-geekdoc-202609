    The fact that Go is the backend for popular services such as `Docker` and `Kubernetes`,
    and that Go can scale with `Goroutines`, plus the fact that it supports so many
    architectures and is so lightweight, makes it the perfect language in which to
    architect the microservices that power large, complex services.


    Finally, there are a couple of more plus points to Go that aren’t unique per se,
    but they make coding in Go more convenient than in other languages:


    - Not only does Go support tons of architectures and operating systems, you can
    also cross-compile for any architecture, from any architecture, by just passing
    a couple of extra compile flags to Go!` No extra libraries need to be installed.
    Try doing that with `Clang`! On `Ubuntu`, you’d be stuck in `Aptitude` dependency
    hell for at least tens of minutes, if not hours.

    - Go features an experimental `LLVM` backend, enabling you to compile Go code
    to `LLVM` in case your use case can benefit from the optimizations or flexibility
    of the modular `LLVM` compiler.


    The preceding text has a sneak peek into the world of Go and what makes it so
    special, but we’ve only just gotten started. Next, in [Chapter 2](#ch2.xhtml),
    let’s install Go, take a look at some basic Go constructs, get you calibrated
    to Go standards and syntax, and dive into building some apps!


    ## Exercises


    **1.** Who created Go and for what purposes?


    **2.** In your view, what are the three main factors that would make Go your programming
    language of choice?


    **3.** What are the four most common ways that programming languages allocate
    and reclaim memory, and what are their pros and cons?


    **4.** What are some of the drawbacks of Go?


    **5.** Why is the Go runtime so unique?


    ## CHAPTER 2


    ## Quickstart


    Let’s get started! But before we get to the fun part, which is writing code, it’s
    important to make sure we have an environment in which we can write Go code, compile
    it, and run it as well.


    Once we have our environment set up, we’ll take a look at some of the basic building
    blocks of the Go language, such as the different kinds of control flow, and how
    they work together.


    Once you’ve finished this chapter, you’ll be able to answer the following questions:


    - How do you install Go on a Windows, Linux, or macOS machine?

    - How can you find out how to install Go from source?

    - How does basic control flow work in Go?


    ### Installing Go


    As with most languages, installing Go on your system is as simple as running a
    few system commands. We will explore three ways of installing Go:


    - Using a system package manager

    - Manually installing a prebuilt binary

    - Building Go from source


    ### Using a System Package Manager


    The easiest way to install Go, much like any other program, is to use the package
    manager built into your system. Unfortunately, Windows doesn’t come with a full-featured
    built-in package manager, which is one of the reasons it may not be an optimal
    system for backend developers. On Linux and macOS, however, you can use the package
    managers and commands explained in [Table 2.1](#ch2.xhtml#tab2_1).


    **TABLE 2.1** Commands to Install Go Using Built-in Package Managers


    ![Image](t2.1.jpg)


    Unfortunately, the package manager distributions are only community supported,
    and not officially supported by the Go team. While this method is more convenient,
    for real production workloads, which may require a specific version of Go, for
    example, we recommend downloading a precompiled binary.


    ### Manually Installing a Precompiled Binary


    The exact process of installing a precompiled binary depends on the platform you’re
    running on. We’ll take a look at Ubuntu and macOS as examples, but if you want
    to see instructions specific to your platform, please visit the Go website at
    [https://golang.org/doc/install](https://golang.org/doc/install).


    Installing a precompiled binary boils down to a few key steps:


    1. Downloading the binary

    2. Extracting the binary

    3. Updating your `PATH` so your shell can find the binary


    You can download Go and its accompanying tools from [https://golang.org/dl](https://golang.org/dl).


    For Linux, after downloading, you’ll have a `.tar.gz` file. One of the ways you
    can extract it is from the command line:


    ```

    tar -xvf go1.14.6-linux-amd64.tar.gz

    ```


    **NOTE:** The version `1.14.6` that we’ve hardcoded into the preceding command
    will need to be replaced based on the version you downloaded or the name of your
    archive.


    This will give you a `go` folder, under which is a `bin` folder, which contains
    the `go` binary—the one tool you need for everything Go related! However, manually
    invoking that Go binary with an absolute path every time is very inconvenient.
    Therefore, when you extract, use this command instead:


    ```

    tar -C /usr/local -xvf go1.14.6-linux-amd64.tar.gz

    ```


    This will deflate and move the `go` folder in your `/usr/local` directory. Next,
    add the following line to your `$HOME/.profile` file:


    ```

    export PATH=$PATH:/usr/local/go/bin

    ```


    ### Building Go from Source


    Building the Go and tools from source is a lot more intense.


    **NOTE:** To give you a sense of the performance, Go is written in Go.


    To learn how to compile Go from source, visit their GitHub Wiki page at [https://github.com/golang/go/wiki/InstallFromSource](https://github.com/golang/go/wiki/InstallFromSource).


    ### Basic Go Concepts


    Now it’s time to dive into actually using some of the core concepts you’ll use
    every day as a Go developer. These core concepts include basic control flow, project
    structure, syntax for more advanced features such as functions and structures,
    and also error handling. Let’s get started!


    ### Conventional Project Structure


    Unlike some other languages, Go doesn’t have a very strict way of laying out your
    project. However, there are standards that the majority of projects conform to
    that make it easier for developers to understand the way code bases are structured
    and what the code does.


    You can find out more about this official standard at the following GitHub repository
    at [https://github.com/golang-standards/project-layout](https://github.com/golang-standards/project-layout).


    Before we can talk about project layout, there is an important piece of terminology
    you need to understand: packages. A Go package is a single source code file. The
    standard for these packages is that the package name for a file is the same as
    the filename itself, without the file extension.

