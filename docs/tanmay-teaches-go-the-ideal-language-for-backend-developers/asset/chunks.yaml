    除外，因为 2 是质数）。


    # 第 3 章


    ## Go Modules


    欢迎来到第 3 章！现在你已经了解了 Go 语言的基础构建模块，你可能认为是时候开始实现更复杂的应用程序了！然而，在在此之前，学习如何与更大的程序员社区共同工作至关重要。为了这一点，你必须学会如何消费和创建
    `packages`（包），它们使得代码能够大规模分发。


    完成本章后，你将能够回答以下问题：


    - 什么是包？为什么它们对编程语言的生态系统至关重要？

    - 包管理器是如何工作的？它们在开发大型应用程序中起什么作用？

    - Go modules 是如何结构化的？

    - 你如何在应用中使用内置模块和第三方模块？

    - 你如何构建自己的 Go modules？


    大多数编程语言都实现了“包管理”系统来实现这种代码分发。如果做得恰当，包管理系统能让程序员更高效、更具协作性。例如 Python 的 `PIP`、Swift
    的 `Swift Package Manager`、Ruby 的 `RubyGems`，当然还有 Go 的“Go modules”。


    此外，当一个由内置包和社区支持包组成的惊人生态系统，辅以令人惊叹的语言特性（如 Go 独特的并发性和快速编译）时，程序设计将变得简单而有趣。


    编程语言的定义实际上取决于它们提供的功能“包”。以 Python 为例，Python 拥有一系列广泛且通常经过优化的内置包，扩展了它的“标准库”。例如 `json`、`urllib`、`pickle`、`os`、`sys`、`sqlite`
    等。这些包是 Python 成功的支柱之一，尽管从技术角度来看它存在某些缺点——你只需要安装语言，就可以发送和接收 HTTP 请求、解析 JSON 和 CSV
    文件、将数据序列化到磁盘、控制 OS 特性，甚至使用 SQLite 数据库。


    另一个成功的关键在于，它不仅通过内置包提供基本功能，还为他人提供了一种简单的方法来发布自己的包并利用他人的包。如果这样一个系统不是易用的、集中的，且不是语言本身同步构建的功能，你可能会得到一个碎片、混乱且产生
    Bug 的生态系统，如 Java 或非 iOS 平台的旧版本 Swift。


    ### 使用内置包


    我们将探索的第一个是一个相对简单的应用程序，它可以从“OMDb”API 获取数据。OMDb 代表“开放电影数据库”，正如其名所示，他们提供了可以通过程序化访问的海量电影信息。可以把它想象成“廉价且可供
    API 调用的 IMDb”。


    具体来说，让我们构建一个小型应用程序，允许我们通过名称搜索电影。我们将使用常规的内容加上一些额外的内容来启动应用程序——别担心，稍后我们就会解释它们的意思！


    ![Image](img/p65.jpg)


    当然，第一行代码只是告诉 Go 我们正在为哪个包编写代码。然后，我们进入了导入（imports）部分。到目前为止，你只需要使用 `fmt` 库，但这次我们使用了许多其他库，如表
    3.1 所示。


    **表 3.1** OMDb 搜索应用中导入每个包的目的


    ![Image](img/t3.1.jpg)


    这些包将提供构建模块，我们可以借此实现自己的逻辑。


    **注意：** 需要记住的一点是，在 Go 中，每个导入*必须被使用*。否则，不像某些编程语言会静默继续或抛出警告，Go 将抛出错误并拒绝编译你的程序。这既是为了速度也是为了安全——未使用的导入可能指向
    Bug 的存在。例如，你可能忘记了实现某些重要功能。


    在导入之后，我们将创建一个名为 `APIKEY` 的新常量，用于存储 OMDb API 密钥。API 密钥用于告诉 API 你是谁，以便服务可以实施速率限制、权限和计费等功能。


    ```

    // omdbapi.com API key

    ```


    ```

    const APIKEY = "193ef3a"

    ```


    在继续之前，我们想对 API 做个简单的说明：我们将实现两个函数，调用我们提供的许多 API 端点中的两个。这两个函数将实现电影搜索功能。其中一个实现按标题搜索，另一个实现按电影
    ID（IMDB 中电影的唯一标识符）搜索。


    当你调用其中任一个端点时，你会得到一个 JSON 响应，其中包含一个符合特定“spec”（规范）的对象。我们现在要做的是*将该 JSON 序列化（marshal）到结构体中*。这是我们将构建的结构：


    ![Image](img/p66.jpg)


    我们从那里得到了很多数据，但为了简洁起见，我们在结构中省略了它们。该结构中还有一些我们还没有引入的语法——它是类型注解之后的部分，封装在反引号中。例如：


    ![Image](img/p67.jpg)


    `json:"Actors"` 部分具体的作用是什么？它告诉 JSON 包，当你需要将字符串序列化到此结构中时，`Actors` 键的值应该被放入该变量。


    为了让你更清楚这一点，我们在第 2 章中介绍了了简化的结构体。我们解释过需要在结构中提供变量名和类型注解，但还有另一个 Go 可以接受的变量信息，尽管可选。这被称为标签（tag）。标签包含了关于变量的额外信息以及哪些代码部分需要它。


    在这种情况下，我们使用包含 JSON 键的标签来支持 JSON 序列化。


    现在我们已经有了从 API 获取信息的结构体，让我们实现对 API 的调用。在此之前，我们必须编写负责向 API 发送 HTTP 请求的函数。这是一个实现此逻辑的简单函数：


    ![Image](img/p68.jpg)


    该函数的工作原理很简单，尽管它看起来很复杂，因为是你处理的第一个大函数。让我们从解析函数开始：


    ```

    func sendGetRequest(url string) (string, error)

    ```


    这个签名非常直观。函数只接受一个类型为字符串的参数 `url`。然而，它返回两个独立的值：作为字符串的请求响应；以及一个错误类型，它本应该是 nil，但如果在发送请求或解析响应过程中发生错误，它可以包含一个值。


    签名之后是函数的主体。因为这是你接触的第一个真实函数，让我们通过表 3.2 逐节查看它。


    **表 3.2** sendGetRequest 中每个代码部分的功能


    ![Image](img/t3.2.jpg)

