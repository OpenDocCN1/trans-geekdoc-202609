    现在让我们来实现函数的体部分。这是一段较大的代码，但我们稍后就会对其进行解构：


    ![Image](img/p161-1.jpg)


    看起来很有趣，对吧？！在通读这段代码时，你可能已经对它有了某些高层面的理解，但让我们现在来仔细剖析它。当然，先从循环开始：


    ![Image](img/p161-2.jpg)


    正如前面提到的，我们希望启动与该机器核心数数量相同的 Goroutine，以处理这些 Goroutine。我们的应用程序非常特殊，因为它是典型的 **CPU
    密集型**（CPU-bound），而不是 I/O 密集型或内存密集型，这意味着在这种情况下，高性能的瓶颈不在于没有更多的内存带宽或更快的 I/O。相反，你需要一个更快的处理器。当应用程序`不是`
    CPU 密集型时，启动比核心数更多的 Goroutine 可能更有意义，因为当一个 Goroutine 在等待 CPU 完成其他任务时，另一个 Goroutine
    可以开始运行。


    由于我们只想启动与核心数数量相同的 Goroutine，因此我们使用一个 `for` 循环从 `0` 迭代到核心数减 1。在每次迭代中，我们向哈希数组中追加一个
    `0`。记住，哈希数组包含了每个 Goroutine 处理的哈希数量。


    接下来，在循环中，我们启动了 Goroutine 本身：


    ![Image](img/p162.jpg)


    该 Goroutine 调用的函数只接受一个参数，即它的索引；使用这个索引（代码中称为 `hashIndex`），它就可以在哈希数组中记录它所处理的哈希数量。


    在该函数内部，我们通过获取本地纳秒级 Unix Epoch 时间戳来创建一个新的随机种子。该种子被转换为一个 64 位无符号整数，这与我们在上一章中定义的自定义随机数生成器兼容。


    然后，我们运行了一段逻辑，如果你来自 C、Python、Java 或 Swift 等语言，这看起来可能是些“奇怪”的逻辑。本质上，我们开始分配一个新的 20
    字节数组。这些是内存中的 20 字节将包含字符串的实际“随机”结尾，这可能为我们的工作量证明问题提供解决方案。然后，我们将前缀字符串（表示为字节数组）插入到这个新数组的`beginning`（开头）。


    我们通过使用 `append` 函数将其插入到开头。`append` 函数支持`变长参数`（variadic arguments），如果你还记得第 2 章，这意味着在第一个参数之后，它可以接受任意数量的相同类型的参数。第一个参数必须是某种类型的数组，而其余的变长参数必须与数组内元素的类型相同。


    通过将 `prefix` 作为第一个参数传递给 `append` 函数，然后将 `randomBytes` 中的所有 20 个元素作为随后的 20 个参数传递，我们最终本质上创建了一个新数组，其内存结构如下：


    ```

    [bytes of the prefix][bytes we initialized when we allocated randomBytes]

    ```


    如果你在好奇该代码片段的最后一行是如何通过只传递 1 个参数来发送 20 个参数的，它使用的是的是 `...` 操作符。这将在运行时将数组“展开”为 20
    个独立的参数，使得调用函数看起来就像是你手动传递了那 20 个参数一样。


    接下来，在 Goroutine 调用的函数内部，我们需要一个可以实际执行处理的无限循环。这个循环内部包含一个 `select` 语句，因为当然，我们想知道何时
    `closeChan` 通知我们退出。以下是我们的做法：


    ![Image](img/p163.jpg)


    这段代码看起来可能很简单（而且确实如此！），但它包含了一段非常有趣的逻辑。看从 `closeChan` 接收数据的 `case` 分：为什么我们在从通道中接收到一个数字后，又要向通道里`back`
    回一个数字？首先，首先。记住，无论我们是否向通道中放回了一个数字，如果我们从这个函数获取了值，我们`确实`会返回函数。


    那么，为什么我们最终要把一个数字放回通道中呢？因为当我们这样做时，我们只需要找到解决方案的 Goroutine 向这个通道插入`a single number`，`所有`
    Goroutine 就会退出。这是因为从技术上讲，只有一个 Goroutine 会取到解决方案 Goroutine 发送的数字，但在下一个一个 Goroutine
    退出之前，它会通过向通道发回该消息来告诉`另一个` Goroutine 退出。


    最后一个 Goroutine 将向通道发送另一个消息然后退出，但由于已经没有更多的 Goroutine 来接收该消息了，它将停留在那里，这对我们来说并不重要。


    ![Image](img/p164.jpg)


    `select` 语句中的下一个 `case` 是实际工作真正发生的地方。在我们讨论工作之前，我们认为讨论一下很可能是一个显而见的问题（elephant in
    the room）很重要：为什么这个 `case` 在等待 `time.After(time.Nanosecond)`？


    再次，如果你回溯几页前，你会记得我们提到过 `select` 语句允许你等待多个阻塞操作同时解除阻塞。`time.After` 是一个阻塞操作，等待退出通道上的值也是。我们在这里只需要`some`
    种阻塞操作，使其有资格成为 `select` 语句的一部分，以便立即运行这段代码。


    因为我们只有在 `closeChan` 收到数据时才继续运行，所以我们 Goroutine    00  的来运行这段代码。


    因为我们只有在 `closeChan` 有数据时才继续运行，所以我们 Goroutine   000 运行的。


    在 Goroutine 调用的函数内部，我们执行的逻辑与之前使用 Goroutine 的原始“pow”函数相似。具体来说，我们有一个 `for` 循环迭代
    5000 次，每次都会生成一个新的随机字符串追加到前缀上。然后它将完整字符串（前缀+随机部分）传递给 `Hash` 函数，这会告诉我们是否满足了条件。


    与上一章的一点不同在于我们在找到解决方案时的做法。一旦我们找到了符合要求的随机字符串，我们将 `count` 变量（即我们完成了多少 5000 次迭代）添加到
    Goroutine 在哈希数组中的专用元素中。然后，我们将解决方案发送到 `solution channel`，并通过向 `exit channel` 传递一个数字来启动退出周期。我们还从函数返回，打破循环并杀死这个
    Goroutine。


    如果我们在这 5000 次迭代中没有找到解决方案，我们将 Goroutine 在哈希数组中的专用元素加 5000，并再次遍历较大的 `for` 循环，该循环再次运行
    `select` 语句，并推导出运行这段代码。


    ![Image](img/p165-1.jpg)


    代码的这段部分关闭了 Goroutine 内部的 `for` 循环，关闭函数，使用数组中的 `index` 变量调用函数，然后关闭负责启动 Goroutine
    的 `for` 循环。


    ![Image](img/p165-2.jpg)


    就这样，你已经成功构建了你的第一个使用 Goroutine 力量的真实应用程序！


    现在你的代码应该是这样的：


    **代码列表列表 5.6** 新的、改进的、由 Goroutine 驱动的 pow 函数


    ![Image](img/p166.jpg)


    ![Image](img/p167.jpg)


    由于此函数的签名相同，你应该能够保持主函数不变，并编译和运行这段代码。在第 4 章 中，我们提到在 MacBook Pro 上，这段代码达到了每秒约 400
    万次哈希。

