    Well, get ready, because this code reaches nearly 30 million hashes per second
    on the same machine. That’s around a 7.5× speedup without a massive amount of
    effort. And, what’s great is that this machine runs 8 cores on an Intel i9, so
    we are reaching ~8× speedup, which is what we expect.


    Remember that because of the overhead of spawning, shutting down, and checking
    the exit channel, scaling is not perfectly linear, but it is still really good,
    especially because, in the grand scheme of software development, we put next to
    no effort into making it this fast. In a way, you’ve learned to leverage the processing
    power of your CPU that otherwise goes unused. By unlocking this capability using
    Go, you can make your applications scalable and fast.


    In this chapter, we’ve taken a look at what makes Go really special: Goroutines,
    a feature that is literally named after the language! However, while Go does a
    lot of things really well, there are some things it simply cannot do as nicely
    as other languages. This isn’t a problem though, because Go is a compiled language,
    and because of the compile process, it’s relatively easy to call code from other
    compiled languages, too! So, in the next chapter, let’s take a look at how you
    can call code from languages such as C and Swift in Go, and why you might want
    to do so in the first place.


    ## Exercises


    1. What is concurrency? How does the concept of threads relate to concurrency?

    2. What is the relation between processes, threads, Goroutines, and functions?

    3. What are channels and how do they work? Think of and implement a small use
    case that demonstrates what channels are used for.

    4. What is a semaphore? How does a semaphore prevent deadlocks in your code?

    5. What kind of channel can be used in Go to replicate a semaphore’s functionality?

    6. From a syntax perspective, how are a `switch` and `select` statement similar?

    7. Why does the proof of work application scale so well to nearly 8× the performance
    when run on 8 physical cores?

    8. What is the most common source of overhead when multithreading applications?

    9. How can you get multiple Goroutines to automatically kill themselves with only
    a single manual channel insert operation?

    10. How does variable capturing differ in Go from most languages, and what can
    be an unintended side effect of this?


    ## CHAPTER 6


    ## Interoperability


    Welcome to [Chapter 6](#ch6.xhtml)! In this chapter, we’ll take the concept of
    “reusing code” one step further. When we’ve finished, you’ll not only be able
    to import external codebases written in Go (known as modules), you’ll also be
    able to import other codebases written in other languages!


    Once you’ve finished this chapter, you’ll be able to answer the following questions:


    - In what format do operating systems understand the binaries generated by compilers?

    - What is a language’s “runtime”? What effect does it have on the programming
    experience and compiled code?

    - How can multiple programs on the same operating system share the same basic
    pre-compiled binary code?

    - Why is inter-language operability important?

    - How can you call C and Swift code from Go using shared libraries?


    One principle of computer science is to not reinvent the wheel. This means that
    if something already exists, then it’s usually best not to have to rewrite it.
    The ideology of the principle is that if someone has already built something,
    they likely had a purpose for it, and have put some level of thought into how
    best to solve the problem.


    In today’s world, where open source software is more prevalent than ever, this
    principle is even more valuable. This is because, even for tasks that may seem
    simple on the surface, literally thousands of people may have put effort into
    architecting an effective solution. As an individual developer, it’s highly unlikely
    that your hand-rolled solution could beat the solution that many other developers
    have poured time and energy into. However, everyone has their own unique perspective
    to solving problems. So, if you do find an inefficiency, or something you’d like
    to change, open source software lets you do exactly that.


    ### Why Is Interoperability Important?


    You may be thinking: “Didn’t we just cover this topic in the last chapter?” Yes,
    we did. However, we covered using libraries of code written in Go. This is incredibly
    useful and is what you’ll be using in the majority of cases. But not all code
    in the world is written in Go—in fact, much of it isn’t. Every programmer has
    their own favorite programming language, and every task calls for using a different
    language. How, then, can you use other people’s code in your own Go programs,
    if that code isn’t written in Go?


    This is a problem that almost every programming language faces in some way, and
    every language deals with it in a different way depending on its architecture.
    Python, for example, is not a compiled language; it’s an interpreted language.
    This means that when you run a python program, your code is not compiled down
    to machine code. Instead, an interpreter process is actively looking at your code
    and running it through that process.


    Then, there’s also the JIT (Just In Time)–compiled languages such as Java. Java
    compiles your code beforehand, but not to machine code. Instead, your code is
    compiled to Java Bytecode, which is a higher-level instruction set than the one
    CPU uses. When you run the Bytecode, the Java Virtual Machine interprets those
    instructions in a similar manner as Python. This method usually achieves much
    better performance than a purely interpreted language, because the code being
    interpreted can be compiled on the fly to native code and cached for when the
    function is called.


    Finally, there’s the bracket that languages such as Go, C++, Swift, and Rust fall
    under: AOT (Ahead Of Time)–compiled. These languages compile your code directly
    to native code before you can run the program. Usually, these languages can best
    optimize your code to run as fast as possible. Plus, because of the way they’re
    architected, they all output a binary executable that your operating system already
    knows how to run without any additional software.


    On macOS, the compilers need to generate Mach-O files. On Linux, they need to
    generate ELF files. On Windows, they need to generate .exe files. Each file format
    has its own standard of arranging the instructions in binary, as well as header
    information to help the operating system understand how the code is intended to
    be.


    For most AOT-compiled programming languages, such as C, C++, Swift, and Rust,
    this is very straightforward. There is an “entry point” or `main` function that
    the operating system will call into, this function will execute whatever code
    it needs to execute, and then once the main function exits, the program exits.


    Sometimes, your own code can call out to other pre-compiled code on the same system.
    For example, when you call `malloc(1)` for memory allocation, your own code doesn’t
    contain the definition of the `malloc` function. Instead, that’s a function provided
    by the C library on your operating system. So, the binary your compiler outputs
    also gives the operating system instructions on what “libraries” are “linked”
    to this binary, which your code needs to access.


    These kinds of libraries—ones that you promise to your compiler exist at compile
    time, and that are loaded at runtime—are called “shared libraries.” That’s because
    multiple programs can share that same library. So, instead of having every single
    camera application shipped for an iPhone contain a copy of the library that handles
    dealing with the camera, the operating system contains a single copy, and that
    copy is loaded up dynamically when you run an executable that needs it.

