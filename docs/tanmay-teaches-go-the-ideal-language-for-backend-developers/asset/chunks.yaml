    \ or multiply.\n\nWhat’s really interesting is you can get some very complex behavior\
    \ to emerge from a very simple initial state. Take the following grid in [Figure\
    \ 4.4](#ch4.xhtml#fig4_4), for example.\n\n![Image](Tanmay_0404.jpg)\n\n**FIGURE\
    \ 4.4** Sample “Conway’s Game of Life” grid at the beginning of the game\n\nThis\
