    最难转换的类型之一是字符串。这是因为字符串在技术上并不是一个数据整体。它们是一个列表——一个数组——由多个独立的数据单元组成，我们称之为字符（characters）。更糟糕的是，我们人类认为的单个“字符”可能无法用单个字节表示，例如
    emoji 或其他 Unicode 字符的情况。


    在 C 语言中，字符串被表示为 8 位有符号整数的原始数组，称为 `char*`（或“指向字符缓冲区的指针”）。这些字符串末尾的终止值通常是一个所有位都设置为关闭（0）的字节，它充当了“空终止符”（null
    terminator）的作用；因此被称为“空终止字符串”（null terminated strings）。这告诉我们字符串缓冲区实际何时结束，这样我们就不需要一直随缓冲区的同时跟踪它的长度。


    在 Go 中，借助 `cgo` 中的 `CString` 函数，将 Go 字符串转换为 C 字符串非常简单。然而，请记住，这为支持字符串的底层内存创建了一个副本，如果代码对性能敏感，这在某些情况下是有利的。当你在这类高级且带有运行时开的语言之间进行互操作时，这是你必须付出的代价。


    这同时也意味着，在你使用创建的 C 字符串之后，你负责释放该内存并确保它的生存时间不会超过需要的时间。这被称为*内存泄漏*（memory leak）。Go
    的垃圾回收器无法为你处理这个指针，因为是你创建了它，并负责释放它所指向的内存缓冲区。


    以下是 `CString` 函数的签名：


    ```

    func C.CString(string) *C.char

    ```


    现在，让我们在 Go 中使用一个稍微复杂的 C 函数。具体来说，让我们定义一个简单的接收空终止字符串并将其打印出来的函数。这里是实现该操作所需的所有代码：


    **代码列表 6.4** 从 Go 向 C 传递字符指针


    ![Image](img/p177.jpg)


    如你所见，逻辑非常简单。首先，我们在导入 `cgo` 模块之前的注释中实现 C 代码。该 C 函数简单地接收一个字符指针并将其传递给 `printf` 函数，同时带上格式字符串，告诉它打印字符指针并接着换行。


    然而，你需要在 `main` 函数中多做一些工作。第一件事是将 Go 字符串转换为 C 字符串，这是通过 `C.CString("This is from
    Golang")` 完成的。然后，将其作为参数传递给 C 函数，就像传递给任何其他 Go 函数一样。


    由于你手动控制内存，你仍然需要自己释放缓冲区。但请记住，C 字符串是一个字符指针，而不仅仅是一个通用指针。`free` 函数在技术上也期望一个不带任何类型信息的通用指针。由于
    Go 对类型要求非常严格，你需要使用 `unsafe` 模块中的 `Pointer` 函数来擦除与 C 字符串关联的类型。然后，你就可以将其传递给 `free`
    函数，并大功告成了！


    还有一点——`free` 函数的定义就是我们这次在 C 代码中除了 `stdio.h` 之外，还必须包含 `stdlib.h` 的原因。如果没有该头文件，我们将无法释放所分配的内存。


    如果你运行这段代码，你应该能看到终端上打印出“This is from Golang”。因此，字符串在内部从 Go 传递到 C，被打印，然后内存被释放。


    获取来自 C 函数的返回值并将其转换回 Go 可以理解的类型也相当简单。例如，如果你要*返回*（return）一个字符串（字符指针），你可以这样将其转换为
    Go 字符串：


    **代码列表 6.5** 将 C 字符串转换为 Go 字符串


    ![Image](img/p178.jpg)


    在这种情况下，你不需要释放从 C 返回的字符指针，因为该值从初没有在堆上分配。它只存储在栈上。然而，如果缓冲区源于对 `malloc(1)` 的调用，则需要
    `free`。


    你应该知道的最后一点——你允许指示 C 编译器以你想要的方式编译你插入注释中的代码。例如，如果你想传递一个特定的编译标志，可以使用 `CFLAGS` 参数来实现。


    假设你正在编写一个函数来判断一个数字是否为“丑数”（ugly），即它的质因因子只包含 2、3 和 5。这些是前 20 个丑数：


    ```

    1, 2, 3, 4, 5, 6, 8, 9, 10, 12, 15, 16, 18, 20, 24, 25, 27, 30, 32, 36

    ```


    以下可以是实现此目的的一些 C 代码：


    **代码列表 6.6** 在 C 中获取第 n 个丑数的


    ![Image](img/p179.jpg)


    使用 `getNthUglyNumber` 函数，你可以获取第 n 个丑数。例如，第 10 个丑数是 12。第 20 个是 36。这个算法绝对可以改进，但我们先用这一个。


    编写以下 Go 代码来封装 C 代码：


    **代码列表 6.7** 调用 C 代码


    ![Image](img/p180.jpg)


    ![Image](img/p181.jpg)


    编写以下 Go 代码来封装 C 代码：


    **代码列表 6.8** 链接共享库并调用 C 函数


    ![Image](img/p182.jpg)

