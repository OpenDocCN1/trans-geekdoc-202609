    \ of the `Println` function is, well, a capital letter. More on that a bit later.\
    \ There is quite an intriguing reason for this.\n\n### Variables\n\nThe Go language\
    \ is both strongly and statically typed. That means two things:\n\n1. Variables\
    \ are not automatically converted from one type to another by the compiler in\
    \ a “hidden” fashion. Even casts such as 32- to 64-bit integers must be completed\
    \ manually.\n2. The compiler *can* try to figure out the type of variables at\
    \ compile time, instead of having you specify the type yourself. However, Go doesn’t\
    \ do “Type Inference” in as advanced a manner as Swift does—again, that’s because\
    \ the compiler wants to be *as fast* as possible. We’ll explore some of these\
    \ limitations as we progress.\n\nThe standard in Go is to allow the compiler to\
    \ figure out the type and to avoid manual annotation, unless it’s necessary, such\
    \ as to tell the compiler not to use a type that translates directly from a certain\
    \ literal value (e.g., “for this number, please don’t use the default 64-bit integer,\
    \ use an 8-bit integer instead”). You will see multiple examples of this manual\
    \ annotation as we continue.\n\nLet’s start exploring the world of variables by\
    \ looking at global variables. A global variable can be one of two types: static\
    \ or constant. A static global variable can be declared like so:\n\n```go\nvar\
    \ age = 16\n```\n\nThat expression does two things, not just one. It first declares\
    \ a new global static variable called `age`, and then initializes that variable\
    \ with the value `16`. In this case, the initialization and declaration are able\
    \ to work together to mark this variable as an `int` type. However, if you are\
    \ unable to initialize the value, and just want to “declare” that a global static\
    \ variable exists, you must explicitly code the type of the variable yourself,\
    \ like so:\n\n```go\nvar age int\n```\n\nIf you’d like, even though it’s not considered\
    \ good practice, you can combine the approaches and explicitly declare the type\
    \ of the variable and provide a value with which to initialize it:\n\n```go\n\
    var age int = 16\n```\n\nBecause it’s a global *static* variable, it’s allowed\
    \ to change. So, if you have a program such as the following:\n\n**CODE LISTING\
    \ 2.2** Getting and setting a global static variable\n\n![Image](p3.jpg)\n\nYou\
    \ should see the following output:\n\n```\n16\n24\n```\n\nNow, as a heads up,\
