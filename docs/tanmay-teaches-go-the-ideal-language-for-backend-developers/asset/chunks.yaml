    “go”, in your terminal!


    ### Building Go from Source


    Building the Go compiler and tools from source is a lot more intense. One reason
    for this is because Go is written in Go itself, which introduces a sort of chicken-and-the-egg
    problem. Thus, just as with a C compiler, you have to “bootstrap” a compilation
    of the Go compiler using an older Go compiler.


    **NOTE:** To give you a sense of the performance of Go: The Go compiler is known
    to be one of the fastest code compilers in the world. What language is it written
    in? Go! It just goes to show that the Go language developers practice what they
    preach.


    Technically, there is another way to compile Go without using an older version
    of the official Go compiler: Use a different compiler that implements the same
    Go language specification. When we refer to “Go”, we usually mean “gc”, which
    stands for “Go compiler,” but it really means the “Go language spec.” For example,
    before the first version of “gc” was written, you’d have to use “gccgo”, which
    is a GCC (GNU C Compiler) frontend for the Go language. This frontend is still
    maintained (albeit a few versions older than gc), and can be used to compile gc
    itself.


    To this day, gc has more of a focus on compiling code *fast*, and while it does
    generally output very high-quality machine code, there are some cases when tight
    loops or performance-sensitive code may need to be compiled with a compiler that
    takes its time and optimizes better. For example, gc doesn’t support tail call
    optimization, making some recursive algorithms in Go run slower. You can use gccgo
    for these kinds of codebases.


    To learn how to compile Go from source, visit their GitHub Wiki page at [https://github.com/golang/go/wiki/InstallFromSource](https://github.com/golang/go/wiki/InstallFromSource).


    ### Basic Go Concepts


    Now it’s time to dive into actually using some of the core concepts you’ll use
    every day as a Go developer. These core concepts include basic control flow, project
    structure, syntax for more advanced features such as functions and structures,
    and also error handling. Let’s get started!


