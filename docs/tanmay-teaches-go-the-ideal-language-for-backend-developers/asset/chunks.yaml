    ### Errors


    Go has a somewhat unique way of handling errors. In most popular languages, a
    function can “throw” an error and the caller can “catch” the error. This approach
    is still possible in Go, but it’s uncommon and not encouraged. Rather, in Go you’re
    encouraged to return a type called `error`.


    `error` is an interface that only expects the underlying type to implement a single
    function. This function is called `Error`, takes no arguments, and returns the
    error it represents as a human-readable string. The definition for the `error`
    interface is as follows:


    ![Image](p58.jpg)


    You can create your own error types very easily! The following is a simple implementation
    of an error:


    ![Image](p59.jpg)


    The `errorString` structure now conforms to the `error` interface, and a function
    that you define could return this as an `error`. However, you may ask, what’s
    the point of an interface in the first place? Why not just make `error` a structure
    instead, and that way, your function can just store the `error` as a string directly?


    Well, the answer is simple: Errors are complex. Let’s say you get an error from
    a function that’s meant to make a request to an HTTP endpoint. The error could
    occur at multiple points, and you may not have been able to *send* the request
    because of a firewall or lack of an internet connection. Maybe the response code
    was 500 (Internal Server Error), so it was the server’s fault!


    So, instead of simplifying what counts as an `error` to just a string, Go makes
    it so you can define your own `error` structures to contain custom error information.
    Then, because you’re forced to implement the `Error()` function to return a human-readable
    string, you can still print out any runtime errors to debug them. These strings
    can be assembled based off of the other content of the structure—such as, in the
    HTTP example, a response code.


    This unorthodox approach to error handling leads to somewhat inelegant code, but
    usually reduces the chance of a crash due to an unhandled error. To see how, let’s
    go over an example of using `error` in a function.


    When it comes to defining new kinds of simple errors, the standard in Go is to
    define them as global variables. This allows code from outside the package to
    see, check, and deal with it.

