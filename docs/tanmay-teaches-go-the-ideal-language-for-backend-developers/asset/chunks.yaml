    为了给你提供更多背景信息，虽然这对于这个示例来说并不重要，但在区块链技术中，你不会拥有像 `“Tanmay Bakshi + Baheer Kamal”`
    这样的字符串。你拥有的是代表支付和其他交易的字节序列，通过找到满足工作证明条件的魔法序列，并在你创建的下一个交易区块中包含该区块的引用，你可以确保人们无法篡改已经发生的交易。这是因为如果他们篡改了某个区块，整个工作证明链将失效。除非由于某种天学上极不可能的巧合，他们找到了一种能够精确返回区块链所需的正确哈希值的算法——而这是我们不需要担心的。


    这背后的实际代码紧凑地包含在一个函数中。不过在我们开始之前，我们首先需要实现几个工具函数和辅助函数。甚至在此之前，我们还需要处理好导入项：


    ![Image](img/p110.jpg)


    现在，来看辅助函数。例如，我们需要一个可以帮助我们生成随机数的函数：


    ![Image](img/p111.jpg)


    我们完全知道你在想：“Go 的标准库甚至不让我们安静地生成随机数吗！？”是的，Go 确实已经为我们提供了可以用来生成随机数的函数。然而，标准库内置的那些函数非常好；事实上，对我们来说太太好了。这意味着什么呢？


    记住，计算机不能真正生成随机数，它们是确定性的。从技术上说，宇宙中的一切在宏观上都是确定性的，只有在量子水平上事物才被认为是概率性的。宇宙中我们能接近随机的是混沌，比如天气。但这不是重点。计算机实现了被称为“伪随机数生成器”的算法，它们利用混沌数学来生成在我们的用例中随机性上“足够均匀”的数字。


    这些算法在计算时间上非常廉价，但复杂度各异。有些非常简单，提供“足够好”的数字分布，而有些非常昂贵，并提供密码学安全的随机数。对于我们的用例，我们不需要任何昂贵的东西，只需要超级随机数。这就是为什么在这种情况下，我们实现了自己的非常简单的
    PRNG（伪随机数生成器）。


    我们希望它在 CPU 周期上如此廉价，是因为这个函数会被调用数千万甚至上亿次，如果你不小心，这个函数上的 CPU 周期真的会积累成大量的运行时间。这正说明当你优化代码时，你真的需要优化热点，即使它们看起来很简单。一个只被调用几次的复杂代码不需要经过良好的优化。


    回到我们实现的函数……随机数生成器简单地接收一个随机数种子，对其进行几次位级操作，并返回该新数字。其用例背后的想法是，当我们我们需要某个范围内的随机数时，我们将一个种子输入到此函数，获取结果，并对该范围的长度进行模运算。这里有一个例子：


    ```

    seed := 42 // 这可以是任何值

    ```


    ```

    seed = RandomNumber(seed)

    ```


    ```

    seed = seed % 10

    ```


    ```

    seed = RandomNumber(seed)

    ```


    ```

    seed = seed % 10

    ```


