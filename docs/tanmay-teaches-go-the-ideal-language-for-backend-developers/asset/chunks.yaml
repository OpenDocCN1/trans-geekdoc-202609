    好了，现在你已经了解全局变量了。那么，我们来谈局部变量吧！在 Go 中，创建局部变量的方式与其他语言非常不同，使用了臭名昭著的 `:=` 运算符。让我们来看一个示例。


    如果你想在 `main` 函数内部创建一个局部变量并打印它，可以像下面这样操作：


    **代码列表 2.3** 函数内部的局部变量


    ![Image](img/p6.jpg)


    我们知道，与其他语言相比，这种变量的实例化看起来很奇怪，但 `main` 函数中的第一行代码告诉 Go：“创建一个名为 `name` 的变量，并在其中存储字符串字面量‘`Anna`”。当你将其与
    C 或 Swift 等其他语言比较时，这在作用域（scope）上并没有变化。在变量所在的代码块退出后，它就会被删除。


    “删除”是一个有点奇怪的概念，所以让我们深入探讨一下。如果你有像下面这样的浮点数：


    ```

    price := 69.99

    ```


    变量 `price` 占用 4 字节内存，它直接包含了这 4 字节，也就是说，CPU 寄存器可以直接持有这 4 字节。因此，当它所在的代码块退出（在本例中为
    `main` 函数）时，它就会被删除，不再存在。然而，如果该变量实际上是对另一个变量或结构体的引用，那么该引用会被删除，这会在未来的某个时刻触发垃圾回收器（Garbage
    Collector）移除它所引用的任何内容，*且仅当*没有其他指向它的引用时。


    如果你想在局部声明一个变量但不初始化它，可以使用相同的全局静态变量语法：


    ![Image](img/p7.jpg)


    你甚至可以创建局部常量：


    ![Image](img/p8.jpg)


    我们已经涵盖了一些基础类型的变量，但还有一些你应该记住的，它们列在表 2.5 中。


    **表格 2.5** Go 中常用原生类型存储的内容


    ![Image](img/t2.5.jpg)


    当然，变量不仅限于标量，你还可以创建数组。在 Go 中创建数组非常简单。在类型注解方面，只需在 `[]` 标记后追加你想要数组中的元素类型即可。例如，对于字符串数组，你会使用
    `[]string` 类型注解。


    数组字面量的元素封装在大括号 `{}` 中，而不是方括号 `[]`，且数组的类型注解必须始终位于字面量值之前。例如，如果你想创建一个字符串局部数组，可以使用以下：


    ```

    names := []string{"Tanmay Bakshi", "Baheer Kamal"}

    ```


    或者，如果你想手动注解类型，可以使用这个：


    ```

    var names []string

    ```


    ```

    names = []string{"Tanmay Bakshi", "Baheer Kamal"}

    ```


    为了向数组追加新元素，请使用 `append` 函数：


    ```

    names = append(names, "Kathy")

    ```


    `append` 函数在数组末尾为新元素分配内存，然后将该新内存空间设置为我们传递给函数的第二个参数。然后它返回一个**新**数组，我们将将其放回原始变量。


    Go 中的数组存储为连续的内存块，这意味着从指向第一个元素的指针开始，你可以到达后续内存地址中的其余元素。


    在内部，当你向数组追加内容时，Go 的运行环境（runtime）可能需要执行一种被称为“重新分配”（reallocation）的操作。大多数操作系统都会尝试扩展你已经拥有的内存缓冲区，但当后续内存被其他东西使用而无法实现时，为了适应更大的数组，它会分配一个全新的缓冲区，将之前的元素复制过去，然后释放之前的缓冲区。


    如你所见，这整个机制可能会非常慢。为了在我们已经知道需要**多少个**元素但不知道这些元素具体是什么的情况下，让某些数组操作更高效，你可以使用 `make`
    函数。通过 `make` 函数，你可以在数组中分配特定数量的元素供你使用，而无需运行重新分配。这里有一个示例：


    ```

    names := make([]string, 3)

    ```


    ```

    names[0] = "Tanmay Bakshi"

    ```


    ```

    names[1] = "Baheer Kamal"

    ```


    ```

    names[2] = "Kathy"

    ```


    需要记住的一点是，这不仅为数组预留了容量，它还报告数组的长度*就是*你传递给 `make` 的元素数量。因此，如果你创建一个包含三个元素的数组且没有设置它们的值，它们内部的内存只是最后存储在那里的任何垃圾内存。


    在某些其他语言（如 Swift）中，当你预留容量时，它仍然报告数组是空的，并且当你追加时，在达到该预留容量计数之前，它简单不需要进行任何重新分配。要在 Go
    中实现相同的的结果（即具有特定容量底层内存缓冲区的空数组），你可以向 `make` 函数传递一个零，然后将你想要的容量作为第三个参数传递。例如：


    ![Image](img/p9.jpg)


    当你运行这段代码时，你应该看到以下输出：


    ```

    0

    ```


    ```

    2

    ```


    ```

    Tanmay Bakshi Baheer Kamal

    ```


    这意味着当调用 `make` 时，数组是“空”的（长度为零），你可以看到数组中的名称长度为二。然而，这段代码的不同之处在于 `append` 操作不需要分配任何内存。


    ### if 语句和 switch 语句


    当然，任何编程语言的不可或缺的部分都是其条件分支的能力。在这方面，Go 支持两种主要的条件分支方式：


    - `if` 语句

    - `switch` 语句


    让我们先来看看经典的、几乎通用的 `if` 语句。在 Go 中，这些语句看起来与 Java、C 和 Swift 等语言中的 `if 语句` 非常相似：


    ![Image](img/p10.jpg)


    `<解析为布尔值的表达式>`可以是一个布尔字面量（`true`, `false`）、返回布尔值的函数调用、存储布尔值的变量或常量，或者返回布尔值的算符调用（例如，你可以使用
    `==` 检查相等性，或使用 `>` 和 `<` 进行比较等）。提到布尔运算符，请看表 2.6 中的一些常用布尔运算符和位运算符。


    **表格 2.6** Go 中常见的内置布尔和位运算符


    ![Image](img/t2.6.jpg)


    ![Image](img/t2.6a.jpg)


    当然，你可以组合多个布尔运算符来构造“复合条件”。例如“(如果国家是加拿大且年龄大于 17）或（如果国家是日本且年龄大于 15）”。


    例如，如果我们想写一个短程序来判断某人是否成年，我们可以编写以下代码：


    **代码列表 2.4** 在 Go 中使用 if 语句和布尔运算符


    ![Image](img/p11.jpg)


    在这个程序中，`age`（作为加载变量解析为整数的表达式）和 `18`（整数字面量）被喂给 `>=` 运算符的任一边。运算符返回一个布尔值，然后被喂给 `if`
    语句，由它决定代码下一步跳转到哪里。有时 `if` 语句：


    - 因为有太多条件需要评估而让你的代码变得“丑”

    - 总是针对某个单一表达式查找相等性


