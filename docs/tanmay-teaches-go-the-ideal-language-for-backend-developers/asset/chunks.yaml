    太棒了！随着这个函数的完成，我们现在拥有了发送 GET 请求的能力，并处理我们在尝试这样做时可能出现的某些常见错误。现在，让我们来实现搜索功能。


    记住，我们需要实现两种搜索方式：通过标题和通过电影 ID 搜索。让我们从通过标题或名称搜索开始：


    ![Image](img/p69.jpg)


    这个函数看起来简单多了！让我们再次从函数签名开始：


    ```

    func SearchByName(name string) (*MovieInfo, error)

    ```


    函数签名初看之下非常简单直观：你只是在创建一个接收单个参数并返回两个值的函数。然而，仔细观察，你会发现返回的第一个值——即从 JSON 响应中反序列化（unmarshaled）的
    `MovieInfo` 结构体——实际上是一个指针！


    这是为什么呢？因为我们还有另一个返回值：`error`。当发生错误时，意味着我们没有 `MovieInfo` 结构体可以返回 . . . . 那么，我们返回什么代替它呢？我们可以返回一个包含许多占位符值的空结构体，但这并不优雅。你可能会问，为什么不直接返回
    `nil` 呢？嗯，如果函数的类型注解只是 `MovieInfo`（一个值而不是指针），那么 Go 将不会允许我们返回 `nil`，因为在内存中没有方法可以表示它。


    相反，当我们将其声明为指针时，Go 允许我们返回 `nil`，因为指针被允许指向空。所以，如果我们需要返回一个错误，可以返回一个带有错误的 `nil` 值；如果没有问题，则返回一个带有
    `nil` 错误的有效值。


    在逻辑本身方面，该函数本质上只是遵循了以下步骤：


    1. 构建一组 URL 参数集（URL parameters），其中包含 API 密钥和我们要搜索的电影名称。

    2. 组合我们想要查询的 REST API URL，以及来自第 1 步的参数。

    3. 向网站发送请求，如果发生错误，则返回一个 `nil` 指针和错误。

    4. 创建一个新的 `MovieInfo` 值，获取它的指针，返回该指针，并通过该指针将响应字符串反序列化到该值中。如果反序列化过程中出现错误，也返回该错误。


    在所有步骤中，第 4 步可能是唯一复杂的，因为它涉及到函数中的最后两行代码。让我们更详细地查看这些代码：


    ```

    mi := &MovieInfo{}

    ```


    ```

    return mi, json.Unmarshal([]byte(body), mi)

    ```


    这段代码片段的第一行非常简单：我们创建了结构体，使用取地址运算符 `&` 获取指针，并将该地址存储在变量 `mi` 中。第二行是情况变得稍微复杂的地方。如果你在看这段代码，你会发现它变得有点复杂。*（此处原文似乎有一处逻辑跳跃或重复描述，翻译已按原意处理）*
    如果你在看这段代码，你会发现它变得有点复杂。*（原文代码：* `return mi, json.Unmarshal([]byte(body), mi)`。这里是
    `json.Unmarshal` 将 `body` 转换为字节数组，并通过指针将响应字符串反序列化到值中。如果反序列化出现错误，也返回该错误。

