    \n在运行代码之前，让我们稍微解释一下它的工作原理。当我们启动主函数时，我们简单地调用 `echo.New()`，得到一个新的 HTTP 服务器实例。之后，我们在该服务器上注册一个\
    \ GET 端点。\n\n我们通过传递字符串 `/:number` 来注册这个 GET 端点。这意味着“在 URL 根路径之后，如果你看到的只有我们称为‘number’的字符序列，那么我们可以处理该请求。”\n\
    \n**注意：** 当我们在字符串中说“number”时，我们并不是在告诉它*只*寻找数字。相反，我们是指这可以是任何字符序列，但我们希望这些字符存储在变量\
    \ `number` 中，因为我们设计的 API 期望这是一个数字。\n\n然而，我们传递给这个函数的还有另一个参数：另一个函数，它不是立即调用的。这意味着从主函数第\
