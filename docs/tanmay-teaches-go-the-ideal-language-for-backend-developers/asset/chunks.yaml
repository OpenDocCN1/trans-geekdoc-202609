    现在你已经掌握了从 Go 中调用 C 的所有基础知识。是时候转向更复杂的内容了：从 Go 中调用 Swift，并实际构建一个在现实世界中有意义的实用应用程序。


    ## 与 Swift 互操作


    首先，我们为什么要从 Go 中调用 Swift 呢？


    记住，Go 编译器非常强大。然而， Go 接受一种非常特定的权衡，因为这被认为对于用 Go 编写的代码库是有益的：编译速度与运行速度之间的权衡。Go 接受在编译代码时极快的速度，即使这意味着编译后的代码本身可能会慢一点，或者该语言的表达能力随之而略低一些。


    在大多数情况下，这并不重要，因为 Go 优化器本身就已经非常优秀了。但某些优化是你无法获得的，而这些优化对于特定操作可能大有益。例如，Go 中并不存在尾调用优化（tail
    call optimizations）！尾调用优化有时可以显著提高递归算法的效率，因为它使得递归调用不需要通过深层递归调用栈返回，而是直接返回给原始调用者。


    对于这类代码，你可能会认为使用 C 这样的语言变得变得重要了。虽然事实可能如此，但有时你并不需要 C 提供的那种控制水平；它可能会成为一种负担。这就是为什么
    Swift 以及其他类似的语言存在。


    然而，Go 也有一些非常擅长的任务，例如并发。或者，某人用 Go 编写了一个特定的模块，让你的应用程序中某个方面的代码编写变得简单得多。有时，你需要在需要用另一种语言编写代码的应用程序中使用
    Go 的能力。这时，在 Go 中调用另一种高级语言（如 Swift）就会非常有用。


    为了演示这一观点的实际用例，我们将实现一个使用特殊“AI”自动玩方块游戏的应用程序，并在命令行中视觉化方块游戏的输出。为了理解这为什么需要 Go 和 Swift
    之间的互操作性，我们首先需要了解方块游戏，然后深入研究我们将构建的 AI。


    你可能几乎肯定玩过或见过别人玩方块游戏，但简而言之，方块游戏是一种经典的游戏，通过处理掉落的砖块，并操纵它们从屏幕顶部到底部的掉落方式，使砖块能够在棋盘上形成“行”。当你凑齐一行时，棋盘上的那行就会被清除，其上方的任何砖块都会向下移动。


    图 6.1 是经典方块游戏实现过程的一个示例截图。由于我们在本章中构建的版本在命令行中运行，它看起来会有所不同。


    ![Image](img/Tanmay_0601.jpg)


    **图 6.1** 由 The Tetris Company, LLC 开发的经典方块游戏


    我们将构建的 AI 所采取的具体策略是：


    1. **观察掉落的方块，并确定该块在其他方块之上的所有可能的最终状态——无论这些方块好坏。**

    2. **使用许多加权启发式算法对每个可能的结束状态进行评分，以找到哪一个是“最佳”的，因为它使我们有最大的概率实现得分最大化。**

    3. **使用路径查找算法找到到达结束位置的方法。**

    4. **执行移动以到达该结束状态。**


    通过这种方式，为每个启发式方法设置正确的启发式方法和权重，我们可以得到一个非常擅长玩方块游戏的 AI。


    以下是我们将实现的启发式方法：


    * **空洞数量 (Number of holes)**——方块中的空隙，在上方行被清除之前无法填充。

    * **开放空洞数量 (Number of open holes)**——未被其他方块覆盖的方块空隙。

    * **空洞上方的方块 (Blocks above holes)**——空洞上方方块的数量。

    * **最大行高 (Maximum line height)**——棋盘上方块的峰 Y 位置。

    * **最后添加方块高度 (Last block added height)**——我们在这一步中添加的方块的峰 Y 位置。

    * **柱体数量 (Number of pillars)**——需要垂直线块填充的列。

    * **最右侧车道的方块 (Blocks in rightmost lane)**——最右侧通道中峰 Y 位置的方块。

    * **凸起度 (Bumpiness)**——相邻列之间峰 Y 位置的差值


    通过这种方式，为每个启发式方法设置正确的启发式方法和权重，我们可以得到一个非常擅长玩方块游戏的 AI。


    以下是我们将实现的启发式方法：


    （此处为启发式方法列表，已按上文翻译）


