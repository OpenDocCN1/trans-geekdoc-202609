    ## CHAPTER 3


    ## Go Modules


    Welcome to [Chapter 3](#ch3.xhtml)! Now that you’re aware of the basic building
    blocks of the Go language, you may think it’s time to start implementing more
    complex apps! However, before we get to that, it’s important to learn how to work
    together with the larger community of programmers. To do this, you must learn
    how to consume and create *packages*, which enable code to be distributed at scale.


    Once you’ve finished this chapter, you’ll be able to answer the following questions:


    •   What are packages and why are they important for a programming language’s
    ecosystem?


    •   How do package managers work, and what is their role in developing large applications?


    •   How are Go modules structured?


    •   How can you use built-in and third-party modules in your apps?


    •   How can you build your own Go modules?


    Most programming languages implement “package management” systems to enable this
    distribution of code. When done right, package management systems enable programmers
    to be more efficient and cooperative. Take, for example, Python’s PIP, Swift’s
    Swift Package Manager, Ruby’s RubyGems, and of course, Go’s “Go modules.”


    Plus, when an amazing ecosystem of packages, both built-in and community supported,
    are accompanied by incredible language features, such as Go’s unique concurrency
    and fast compilation, programming becomes easy and fun.


    Programming languages are really defined by the “packages” of functionality they
    provide. Take Python, for instance. Python has an extensive set of usually well-optimized
    built-in packages that extend its “standard library.” For example, “json,” “urllib,”
    “pickle,” “os,” “sys,” “sqlite,” and more. These packages are one of the pillars
    of Python’s success, even despite its shortcomings from a technical perspective—you
    only need to install the language, and you can make and receive HTTP requests,
    parse JSON and CSV files, serialize data to disk, control OS features, and even
    use SQLite databases.


    One more key to its success is that it not only provides basic functionality with
    built-in packages, but also offers an easy way for others to distribute their
    own packages and leverage others’ packages. If a system like this isn’t easy to
    use, centralized, and a feature that’s built alongside the language itself, you
    can end up with a fragmented, messy, bug-spawning ecosystem such as that of Java
    or older versions of Swift for platforms other than iOS.


    ### Using Built-in Packages


    The first example we’ll explore is a relatively simple application that can grab
    data from the “OMDb” API. OMDb stands for “The Open Movie Database,” and as the
    name suggests, they provide programmatically accessible information about a vast
    array of movies. Think “IMDb, but cheaply API callable.”


    Specifically, let’s build a small application that lets us search for movies by
    their name. We’ll start the application with the usual, plus a few extras—don’t
    worry, we’ll explain what they mean in just a moment!


    ![Image](p65.jpg)


    Of course, the first line of code just tells Go which package we’re writing code
    for. Then, we come to the imports. So far, you’ve only had to use the “fmt” library,
    but this time we’re using quite a few other libraries, as you can see in [Table
    3.1](#ch3.xhtml#tab3_1).


    **TABLE 3.1** The Purpose for Importing Each Package in the OMDb Searcher App


    ![Image](t3.1.jpg)


    These packages will provide the building blocks upon which we can implement our
    own logic.


    **NOTE:** Something to keep in mind is that, in Go, every import *must be used*.
    Otherwise, unlike some other programming languages, which would either continue
    silently or throw a warning, Go will throw an error and refuse to compile your
    program. This is for both speed and safety—an unused import may point to the presence
    of a bug. For instance, you may have forgotten to implement some important functionality.


    After the imports, we’re going to create a new constant called “APIKEY,” which
    stores the OMDb API key. An API key is used to tell an API who you are, so that
    the service can implement features such as rate limiting, permissions, and billing.


    ```

    // omdbapi.com API key

    ```


    ```

    const APIKEY = "193ef3a"

    ```


    Before we continue, we want to make a quick note about the API: We’re going to
    implement two functions that call two of the many API endpoints provided to us.
    Both of these functions will implement movie search functionality. One will implement
    searching by title, and the other will implement searching by Movie ID (the unique
    identifier of a movie for IMDB).


    When you call either of these endpoints, you get a JSON response that contains
    an object that conforms to a certain “spec” (specification). What we’ll do now
    is implement that same spec in a structure in Go. This way, when we get the JSON
    string as a response, we can just tell Go to marshal that JSON into the structure!


    Here’s the structure we’ll build:


    ![Image](p66.jpg)


    There are quite a few other pieces of data that we get from the API, but we’ve
    omitted them from the structure for the sake of brevity. There is also some extra
    syntax in this structure that we haven’t introduced you to yet—it’s the part that
    comes after the type annotation, enclosed in backticks. For example:


    ![Image](p67.jpg)


    What exactly does the \`json:”Actors”\` part do? This tells the JSON package that,
    when you need to marshal a JSON string into this structure, the “Actors” key’s
    value should be placed into this variable (the “Actors” string). This allows you
    to have a name for the key in JSON that is different from the variable name that
    stores it in the structure.


    To make this even clearer for you, in [Chapter 2](#ch2.xhtml) we introduced a
    simplified version of structures. We explained you need to provide a variable
    name and type annotation within the structure, but there’s another piece of variable
    information that Go can accept, albeit optionally. This is called a “tag.” The
    tag contains extra info about the variable and what different parts of your code
    need to know about it.


    In this case, we’re using the tag, which contains the JSON key, to support JSON
    marshaling.


    Now that we have a structure containing information we get from the API, let’s
    implement the calls to the API. Before that though, we must write the function
    that’s actually responsible for sending the HTTP GET requests to the API. Here’s
    a simple function that implements this logic:


    ![Image](p68.jpg)


    The way this function works is simple, even though it may look complex because
    it’s the first large function you deal with in Go. Let’s start by deciphering
    the function signature:


    ```

    func sendGetRequest(url string) (string, error)

    ```


    This signature is quite straightforward. The function takes only a single argument,
    called url, of type string. However, it returns *two* separate values: a string
    that represents the response of the request as a string; and an error type, which
    should be nil but can contain a value if an error occurred somewhere in making
    the request or parsing the response.


    After the signature comes the main body of the function. Because this is the first
    real function you’ve been exposed to, let’s go through it section by section in
    [Table 3.2](#ch3.xhtml#tab3_2).


    **TABLE 3.2** The Functionality of Each Section of Code Within sendGetRequest


