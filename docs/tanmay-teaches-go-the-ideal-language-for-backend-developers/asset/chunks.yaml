  raw: 'Well, yes, we will not dive into the technical details of how the Python interop
    works. However, Swift also has one more incredible capability: There is a very
    easy and powerful Python interop layer built into the standard library! So, for
    example, we can use Python packages alongside our Swift code very easily:


    **CODE LISTING 6.9** Calling Python code from Swift


    ![Image](p187.jpg)


    This is a capability that, unfortunately, does not yet exist in Go. Therefore,
    the optimization code will also be written in Swift, which will call Python for
    the real optimization work.


    “What will Go do, then?” you ask. Well, Go will be responsible in this case for
    providing the UI for the application. Because we’ve already built a GUI in this
    book, it’s time for a CLI, or command-line interface. Go has an excellent library
    known as “tcell” that is unmatched by anything in the Swift ecosystem. The tcell
    module provides a very intuitive way to build complex command-line interfaces.
    Therefore, the main game logic will be handled by Swift, with some parts imported
    from Python, and all of that will be called from Go.


    Isn’t it incredible to see how all the code written in these languages can coexist?!


    To begin, we need to write the Swift code to actually play the game. You can download
    this code from the GitHub repo containing all of the code for this book under
    the “Tetris” folder. The reason you can’t just read the code from the book is,
    well, it’s around 700 lines of code—way more than we’re sure you want to see in
    a book!


    However, the really important parts of the code are the ones that Go will call.
    This is what that looks like:


    ![Image](p187-1.jpg)


    ![Image](p188.jpg)


    The architecture of the code is simple, and it was designed with the idea that
    it will be compiled to a shared library. It works by declaring the game state
    as a global variable and using functions to modify that global state. This architecture
    can definitely be improved, for example by passing the state back and forth as
    a pointer instead of it being global. However, for this specific example, it’s
    sufficient to use a global variable.


    When the shared library is loaded, the global “game” variable is automatically
    initialized to a new Tetris board with a default width and height of 10 and 24,
    respectively.


    Then, we have the actual functions that do the work. This is what each one does:


    •   **nextBestMoves**—This function takes the current board state and runs the
    whole AI pipeline to determine the next best set of moves. It returns the number
    of moves and then the moves themselves as an “array” or an “integer pointer,”
    because the return type needs to be C-compatible.


    •   **playMove**—This function takes an individual move as an integer and runs
    that move on the game state.


    •   **renderFrame**—This function takes the current final board (all the pieces
    that have already landed) and the current piece that is still being finalized
    (the one in the air) and renders them both onto a single 2D array, which is flattened
    and returned as an integer pointer (representing an array).


    •   **lockGame**—This function takes the current piece in the air that has been
    moved into place via the playMove function and modifies the Tetris game state
    to move that piece into the final game board, clears any lines that have been
    formed, makes a new random piece, detects if the game was lost, and returns that
    as a Boolean.


    •   **resetGame**—This function resets the global game state by initializing it
    to a new Tetris structure.


    You may notice that each function declaration is preceded by the “@\_cdecl” function
    decorator. This is telling Swift that “this function needs to look and act like
    a C function in the resulting binary machine code.” By doing this, we can call
    these functions from Go as if they were C functions, regardless of which Swift
    features they may be using internally.


    To compile the Swift code, you can simply run:


    ```

    swiftc TWAI.swift -O -emit-library -o libTWAI.so

    ```


    This is what every flag does:


    •   `-O`—Use full compiler optimizations and make the code as fast as possible,
    without using unsafe features.


    •   `-emit-library`—Don’t build an executable binary, build a library that other
    code can dynamically link against.


    •   `-o libTWAI.so`—The output filename is “libTWAI.so”.


    However, installing the Swift for TensorFlow compiler (which is the specific distribution
    we need) can be a bit tedious. So, to keep the instructions the same for every
    platform, the GitHub repo containing this example also has a Dockerfile you can
    build, which will automatically deal with setting up your environment and running
    the code for you.


    Regardless, once the library is built (whether you do it manually or through the
    Dockerfile), the next step is to implement the library’s functionality in Go and
    actually make it do something. We can now begin coding the Go part of this app!


    To start, you’ll need to make a few cgo declarations and import a few modules:


    ![Image](p191.jpg)


    As we analyze this code, also keep in mind that it’s important the cgo import
    is separate from the other imports, because that’s the only way it can look at
    the comments, which contain the C code, that come before it.


    The first instruction we give cgo is to tell the linker it needs to link against
    a library called TWAI, meaning that on Linux the name of the shared library file
    would be libTWAI.so.


    Then, we declare the functions that the shared library exposes, which we’re meant
    to call from the Go code. As you can see, the Swift types have been translated
    to their C counterparts. The `UnsafeMutablePointer<Int>` type becomes `long` `*`
    and Bool becomes `char`.


    Apart from that, we also import a couple of modules that are important for the
    rest of the code, such as Tcell for the CLI.


    Now let’s build a few helper functions so we can actually call the Swift code
    from our Go code more easily. These are important especially because we are dealing
    with buffers and arrays and the like, which need a bit more care.


    Let’s start with the simpler function. `playNextMove` is where we’ll begin:


    ![Image](p191-1.jpg)


    As you can tell, the logic is pretty simple. We take the move as an integer, cast
    it via `C.long`, and pass it to the function. No pointers, no return values, no
    messy stuff.


    `nextBestMoves` is where things may start to look a little weirder. This is what
    the helper function looks like:


    ![Image](p192.jpg)


    This looks scary, but it makes a lot of sense once you dig into it. Let’s start
    with line 3.


    To understand what this line does, it’s important to understand the output from
    `nextBestMoves`. As mentioned previously, this function outputs the moves that
    need to be taken to move the current falling piece to where it should be. This
    array of moves starts with the number of moves there are to be made. This is so
    that we know how many elements there are in the buffer. So, in line 3, we simply
    dereference the beginning of the buffer we got back from the function, and cast
    that to a Go integer.


    After that, we need to find the pointer address where the actual content of the
    array starts, because we’ve already looked at the size. Doing this is simple—increment
    the pointer address we got from the function by the number of bytes we’ve already
    looked at. To do this, we cast the pointer to `uintptr`, which we then increment
    by the size in bytes of the size variable that we’ve already dereferenced.


    We technically already know the size is 8 bytes because it’s a “long” or “64-bit
    integer,” but for good programming practice, we still call `Sizeof` to get the
    size for us dynamically.


    Then, we have the pointer address of the buffer itself. To convert this to an
    array of integers in Go, we use the `SliceHeader` function from the reflect package.
    This will take the pointer, along with the length of the array itself and the
    total capacity of the buffer, and convert it to a “slice” or “array.” We store
    the reference to the result that this returns.'
