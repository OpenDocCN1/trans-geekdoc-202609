  trans: '

    最后，这个函数的返回值初看起来可能很困惑。但当你将其拆解开来，它其实非常好理解：


    ```go

    return *(*[]int)(unsafe.Pointer(sh))

    ```


    基本上，我们是在告诉 Go：“获取 `sh` 变量，将其传递给 `Pointer` 函数，获取结果，将其转换为整数数组的指针，然后对指针进行解引用并返回整数数组。”你可以这样拆解：


    ![Image](img/p193-1.jpg)


    最后，还有一个 `renderFrame` 函数：


    ![Image](img/p193-2.jpg)


    除了这个函数外，我们还声明了一个新的 `Frame` 结构体，将棋盘存储为 1d 数组，并包含棋盘的 `width` 和高度 `height`。


    在函数内部，我们有一个与 `nextBestMoves` 非常相似的机制。在这种情况下，虽然 Swift `renderFrame` 函数的返回值只是一个
    1d 数组，但它的开头有三个整数，而不是只有一个：包括另外两个整数在内的总缓冲区大小；另外两个整数分别是俄罗斯方块游戏板的高度和宽度。


    `renderFrame` 会首先计算棋盘本身的大小（不包括另外两个整数），然后将指针增加两次，每次增加一个整数的大小，以获取指向高度和宽度整数的指针。


    最后，通过再次增加一次指针，我们得到了实际数值数组的指针，然后将其通过与 `nextBestMoves` 函数非常相似的机制进行处理。


    最后从函数返回 `Frame`。


    这个这个应用的所有内容就到这里了！我们知道它的某些部分——特别是处理内存、指针和缓冲器的部分——有点吓人，但最终结果确实值得。如果你克隆了 GitHub 仓库并进入
    Tetris 文件夹，然后运行以下两个命令：


    ```bash

    docker build --tag block_ai:1.0 .

    ```


    ```bash

    docker run -it block_ai:1.0

    ```


    你应该能看到你的终端自动变成了一个正在运行的俄罗斯方块棋盘！这太棒了不是？！


    `main` 函数有点太长，大约有 100 行代码，在书中书中深入探讨。然而，所有这些逻辑你已经学过了，而且代码有详尽的注释，所以请尽管在仓库本身中深入研究代码。


    通过这个例子，你应该能够上手 Go 与其他语言之间的互操作。你现在可以将这些知识用于调用你可能已经在其他语言中编写的代码，或者由于特定限制在未来可能需要编写的代码。


    到此，你结束了探索 Go 编程语言的旅程。你不仅仅是湿了脚，而是进行了一次完整的游泳。这仅仅是一个开始！Go 还有很多东西，还有很多可以可以构建。你现在应该能够使用
    Go 构建各种简单和中级水平应用程序，从命令行工具到由 CLI 和 GUI 驱动的程序。


    ### 练习题


    1. `tcell` 包允许我们做什么？

    2. 为什么解释型语言和 JIT 编译语言的互操作更困难？

    3. 列出跨语言互操作至关重要的场景。

    4. 语言的“运行时”（runtime）由哪些部分组成？

    5. 在 Go 中嵌入 C 代码常见的常见问题有哪些？


    ![Image](img/line.jpg)


    [*] 俄罗斯方块是 The Tetris Company, LLC 的注册商标。


