    我们现在需要做的只是运行一次标准的 Dijkstra 算法迭代。我们首先查看所有节点的成本，并找到成本最小的节点。因为除了 `B` 之外的所有节点成本都是无穷大，所以
    `B` 自然是成本最低的节点。


    然后，我们查询图表以找到该节点的邻居是谁，以及它们的成本是多少。我们看到在这个特定的图中，邻居节点是节点 `C` 和 `D`。


    是的，从技术上讲，`B` 与 `A` 有一条连接，但那是从 `A` 到 `B` 的连接，所以我们无法从 `B` 移动到 `A`，因此该连接对于此逻辑是无效的。


    我们从节点 `C` 开始（在这种情况下，顺序并不重要）。我们检查：`B` 的成本加上旅行到 `C` 所需的成本是否低于 `C` 本身的成本？在这种情况下，这意味着：“`0
    + 4` 是否小于无穷大？”当然，结果的结果为真。因此，我们将 `C` 的成本设置为 `4`（因为 `0 + 4 = 4`），并将 `C` 的父节点设置为
    `B`。


    我们对节点 `D` 执行了类似的操作。因为之前的成本是无穷大，新成本 `0`（`B` 的成本）加上 `5`（从 `B` 移动到 `D` 的成本）较低——因为任何有限数字都小于无穷大。所以我们将成本设置为
    `5`，并将父节点设置为 `B`。


    搞定！我们遍历了从 `B` 可以进行的所有移动。让我们再次运行迭代。表 4.3 是我们目前字典的状态。


    **表 4.3** 更新 C 和 D 节点成本和父节点后的 Dijkstra 路径查找状态


    ![Image](img/t4.3.jpg)


    查看表格，我们发现 `C` 目前成本最低。所以，让我们看看 `C` 有哪些出站连接。我们看到 `C` 可以移动到 `A` 和 `D`。让我们从确定它与 `A`
    的关系开始。


    节点 `A` 目前的成本是无穷大，所以无论 `C` 的成本加上 (`C` ![Image](img/arrow.jpg)`A`) 的成本是多少，它都会更低。在这种情况下，结果为
    `10`，因为 `C` 是 `4`，连接成本是 `6`。因此，我们将 `A` 的成本设置为 `10`，并将父节点设置为 `C`。


    然后，我们看 `D`。`D` 已经有一个成本 `5`。正如我们看到的，`C` 的成本是 `4`，且 `C` 和 `D` 之间的连接成本为 `2`。所以，`4
    + 2 = 6`，这意味着 `C` 和 `D` 之间的连接比 `D` 已有的连接（来自 `B`）贵。因此，我们完全不修改字典中 `D` 的值。


    表 4.4 是我们字典当前的状态。


    **表 4.4** 更新节点 A 成本和父节点后的 Dijkstra 路径查找状态


    ![Image](img/t4.4.jpg)


    我们还没有结束！记住，到目前为止，我们在节点 `B` 和 `C` 上运行了算法迭代。所以，如果我们在表中寻找我们*尚未*迭代过的成本最低节点，我们看到那个节点是
    `D`。让我们继续对 `D` 执行迭代。


    `D` 只能连接到 `A`。让我们尝试如果我们将其父节点切换到 `D`，为 `A` 确定一个新的成本。`D` 的成本是 `5`，它到 `A` 的连接成本仅为
    `1`。`5 + 1 = 6`，这*低于*表中已有的 `A` 的成本（10）。）。因此，我们将 `A` 的成本从 `10` 改为 `6`，并将 `A` 的父节点从
    `C` 改为 `D`。


    在更新之后，我们的字典看起来如表 4.5。


    **表 4.5** 更新节点 A 成本和父节点后的 Dijkstra 路径查找状态


    ![Image](img/t4.5.jpg)


    好了，剩下的唯一节点是 `A`。让我们尝试对它运行一次迭代。`A` 连接到 `B` 和 `C`。


    我们需要替换 `B` 的成本和父节点吗？直觉上我们知道答案是否定的，因为 `B` 是源节点，让 `A` 成为它的父节点没有意义。然而，我们也可以用算法证明这一点，因为无论
    `A` 和 `B` 之间的连接成本是多少，我们永远不会替换 `B` 的父节点，因为 `B` 的成本已经是我们能达到的最低：零。所以，让 `B` 保持不变。


    `C` 呢？`A` 的成本已经是 `6`，加上从 `A` 到 ![Image](img/arrow.jpg)`C` 的连接，即 `9`。总和为 `15`。`15`
    大于现有的成本 `4`，因此我们也让 `C` 保持不变。这意味着路径查找状态没有变化；它保持与表 4.5 相同。


