    好了，准备好，因为这段代码在同一台机器上每秒可以达到近 3000 万次哈希。这在没有投入大量精力的情况下实现了 7.5 倍的速度提升。而且棒的是，这台机器在
    Intel i9 上运行着 8 个核心，所以我们实现了约 8 倍的加速，这正是我们预期的。


    请记住，由于启动、关闭和检查退出通道的开销，扩展性并不是完全线性的，但它仍然非常出色，尤其是从软件开发的宏观角度来看，我们为了让它变得这么快几乎没有花费任何精力。在某种意义上，你学会了利用原本未被使用的
    CPU 处理能力。通过使用 Go 释放这种能力，你可以让你的应用程序具有可扩展性且快速。


    在本章中，我们探讨了让 Go 真正特别的特性：Goroutines（协程），这是一个直接以该语言命名的特性！然而，虽然 Go 在很多方面都做得非常好，但有些事情它确实不像其他语言那样做得出色。不过这并不是问题，因为
    Go 是一门编译语言，而且由于编译过程，调用其他编译语言的代码也相对容易！所以，在下一章中，让我们来看看如何在 Go 中调用来自 C 和 Swift 等语言的代码，以及为什么你最初可能想这样做。


    ## 练习


    1. 什么是并发？线程的概念与并发有什么关系？

    2. 进程、线程、Goroutine 和函数之间是什么关系？

    3. 什么是通道（channels）？它们是如何工作的？思考并实现一个小型用例来演示通道的用途。

    4. 什么是信号量（semaphore）？信号量如何防止代码中的死锁？

    5. Go 中可以使用哪种通道来模拟信号量的功能？

    6. 从语法角度来看，`switch` 语句和 `select` 语句相似之处何？

    7. 为什么工作证明应用在 8 个物理核心上运行时，性能能很好地扩展到近 8 倍？

    8. 多线程应用程序中最常见的开销源是什么？

    9. 你如何通过单次手动通道插入操作，让多个 Goroutine 自动自毁？

    10. Go 中的变量捕获与大多数语言有何不同？这可能导致什么意外的副作用？


    ## 第 6 章


    ## 互操作性 (Interoperability)


    欢迎来到第 6 章！在本章中，我们将“代码复用”的概念向前推进了一。当我们结束时，你不仅能够导入用 Go 编写的外部代码库（称为模块），还能导入用其他语言编写的代码库！


    完成本章后，你将能够回答以下问题：


    - 操作系统以什么格式理解编译器生成的二进制文件？

    - 语言的“运行时（runtime）”是什么？它对编程体验和编译代码有什么影响？

    - 同一个操作系统上的多个程序如何共享相同的基础预编译二进制代码？

    - 为什么跨语言互操作性很重要？

    - 你如何使用共享库从 Go 调用 C 和 Swift 代码？


    计算机科学的一个原则是不重复发明轮子。这意味着，如果某物已经存在，那么通常最好的办法就是不要重写它。该原则的理念是：如果有人已经构建了某些东西，他们很可能有其目的，并在如何最好地解决问题上付出了某种思考。


    在当今开源软件比以往任何时候都盛行的世界上，这一原则更具价值。这是因为，即使对于表面看似简单的任务，也可能有成千上万的人投入精力来构建一个有效的解决方案。作为一名独立开发者，你手写的解决方案极不可能击败许多其他开发者投入了时间和精力的解决方案。然而，每个人都有解决问题的独特视角。所以，如果你确实发现了效率低下的地方或你想改变的地方，开源软件恰恰让你做到这一点。


    ### 为什么互操作性很重要？


    你可能在想：“我们不是在上一章涵盖过这个话题了吗？”是的，我们涵盖了。但是，我们涵盖的是使用用 Go 编写的代码库。这非常有用，也是你在大多数情况下会使用的。但世界上并不是所有的代码都是用
    Go 编写的——事实上，大部分都不是的。每个程序员都有自己喜爱的编程语言，每项任务都需要使用不同的语言。那么，如果代码不是用 Go 编写的，你如何在自己的
    Go 程序中使用别人的代码呢？


    这是几乎每种编程语言都会以某种方式面临的问题，每种语言都会根据其架构以不同的方式处理它。例如，Python 不是编译语言；它是一种解释型语言。这意味着当你运行
    python 程序时，你的代码没有被编译成机器码。相反，解释器进程会积极查看你的代码并通过该过程运行它。


    然后，还有像 Java 这样的 JIT（即时）编译语言。Java 会预先编译你的代码，但不是编译成机器码。相反，你的代码被编译成 Java 字节码（Bytecode），这是一个比
    CPU 使用的指令更高级的指令集。当你运行字节码时，Java 虚拟机以类似于 Python 的方式解释这些指令。这种方法通常比纯解释型语言性能好得多，因为被解释的代码可以被即时编译成原生代码并缓存，以便在调用函数时使用。


    最后，是 Go、C++、Swift 和 Rust 等语言所属的类别：AOT（提前）编译。这些语言在你可以运行程序之前直接将你的代码编译成原生代码。通常，这些语言可以最好地优化你的代码以最快速度运行。此外，由于它们的架构方式，它们都会输出操作系统已经知道如何运行无需额外软件的二进制可执行文件。


    在 macOS 上，编译器需要生成 Mach-O 文件。在 Linux 上，它们需要生成 ELF 文件。在 Windows 上，它们需要生成 .exe 文件。每种文件格式在二进制指令排序方面都有自己的标准，以及帮助操作系统理解代码意图的头部信息。


    对于大多数 AOT 编译的编程语言（如 C、C++、Swift 和 Rust），这非常直接。有一个操作系统将调用的“入口点”或 `main` 函数，该函数将执行它需要执行的所有代码，一旦
    `main` 函数退出，程序就会退出。


    有时，你自己的代码可以调用同一系统的其他预编译代码。例如，当你调用 `malloc(1)` 进行内存分配时，你自己的代码并不包含 `malloc` 函数的定义。相反，那是操作系统上的
    C 库提供的一个函数。所以，你的编译器输出的二进制文件还向操作系统提供了指令，说明哪些“库”被链接到该二进制文件，你的代码需要访问这些库。


    这些类型的库——即你向编译器承诺在编译时存在、并在运行时加载的库——被称为“共享库（shared libraries）”。这是因为多个程序可以共享同一个库。所以，而不是让为
    iPhone 交付的每一个相机应用程序都包含一个处理摄像头的库副本，操作系统包含一个副本，并在当你运行需要它的可执行文件时，该副本会被动态加载。


