    ```


    ```

    20

    ```


    Great! You’ve now learned the basics of `structure`s in Go. Of course, there still
    is quite a bit more to learn, like `Reflection`, but we’ll get into that in a
    later chapter.


    ### Interfaces


    In Go, we also have what is known as “`interfaces`,” which are similar to the
    `interfaces` in Java or protocols in Swift. However, they do have some more limitations
    (again, Go can be quite “classic” in this regard).


    An `interface` enables you to define a group of functions that a certain `structure`
    needs to have, without tying them to an implementation. For example, you could
    say that “to be compatible with the ‘`Living`’ `interface`, you must have an `incrementAge`
    function that takes no arguments and returns nothing.”


    Let’s take a look at a simple group of `structure`s without an `interface`:


    **CODE LISTING 2.24** Similar structures without a backing interface


    ![Image](p51.jpg)


    **NOTE:** The eagle-eyed among you may have noticed a “mistake” here, at least
    according to what we’ve talked about before. In the `getAge()` function, we have
    a “pointer receiver”—i.e., the type annotation for the `structure` we’re attaching
    to is `*Dog` not `Dog`. But we’re not changing anything, so why does it need to
    be a pointer? We’ll get to that in a bit.


    Now, what if we wanted to write a function that would be able to call `incrementAge`
    and then print out the new `age`, regardless of what *kind* of living being it
    is? What if we could abstract away the species? We don’t need full-blown parametric
    polymorphism (`generics`), we just need `interfaces`. For example, we can define
    the following `interface`:


    **CODE LISTING 2.25** An interface to standardize the two structures


    ![Image](p52.jpg)


    What we’ve done is we’ve told Go “if a structure implements these two functions,
    let me just refer to it as Living, and assume it only has the functionality defined
    in the `Living` `interface`.” Therefore, we can write a function like this:


    **CODE LISTING 2.26** A function that mutates an instance of a structure conforming
    to the interface


    ![Image](p53.jpg)


    And then call it like this:


    **CODE LISTING 2.27** Calling incrementAndPrintAge with two structure instances


    ![Image](p54.jpg)


    Now, don’t think too hard about this code. We’ll walk through it, and through
    the Go compiler’s thought process, in more detail in just a moment. Right now,
    just run it, and admire the output of your hard work:


    ```

    22

    ```


    ```

    7

    ```


    Hooray! But how did that happen? Let’s dig a bit deeper.


    First, let’s look at the `incrementAge` and `getAge` functions. Notice that, for
    both of them, they really are receiving pointer values, not regular values. This
    means that `Person` and `Dog` both do *not* have the `incrementAge` and `getAge`
    functions—instead, `*Person` and `*Dog`, the *reference types*, implement those
    functions.


    So, let’s take a look again at our `interface`:


    ![Image](p55.jpg)


    The `interface` says “any type that implements these two functions can also be
    referred to as the `Living` type.” And, what do you know, `Person` and `Dog` don’t
    implement them, instead `*Person` and `*Dog` do. Therefore, when we call the `incrementAndPrintAge`
    function, if we just pass the variables directly as:


    ```

    incrementAndPrintAge(harley)

    ```


    ```

    incrementAndPrintAge(snowy)

    ```


    . . . we’d get an error because the types of those variables don’t implement the
    functions needed to conform to the `Living` `interface`. However, when we pass
    the reference:


    ```

    incrementAndPrintAge(&harley)

    ```


    ```

    incrementAndPrintAge(&snowy)

    ```


    . . . then we’re not passing `Person` and `Dog`, we’re passing `*Person` and `*Dog`,
    which do conform properly to the `interface`.


    So, this has proven something to us, but it’s basically subliminal: *The functions
    in an interface can either all be pointer receivers, or all be value receivers.
    There is no in-between.*'
