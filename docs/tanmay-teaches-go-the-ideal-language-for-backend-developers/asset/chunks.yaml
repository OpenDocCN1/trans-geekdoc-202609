    好的，是的，我们不会深入探讨 Python 互操作的实现细节。然而，Swift 还有另一项惊不起的能力：标准库中内置了一个非常简单且强大的 Python 互操作层！因此，例如，我们可以非常容易地在
    Swift 代码中使用 Python 包：


    **代码列表 6.9** 从 Swift 调用 Python 代码


    ![Image](img/p187.jpg)


    遗憾的是，Go 目前尚不具备这种能力。因此，优化代码也将用 Swift 编写，它将调用 Python 来执行实际的优化工作。


    “那么 Go 将负责什么呢？”你可能会问。嗯，在这种情况下，Go 将负责为应用程序提供 UI。因为我们已经在书中构建了一个 GUI，现在是时候构建一个 CLI（或命令行界面）了。Go
    拥有一个名为 `tcell` 的优秀库，这是 Swift 生态系统中任何工具都无法比拟的。`tcell` 模块提供了一种非常直观的方式来构建复杂的命令行界面。因此，主游戏逻辑将由
    Swift 处理，部分内容从 Python ，而所有这些内容将通过 Go 调用。


    看到这些语言编写的代码竟然可以共存，难道不不可思议吗？！


    首先，我们需要编写 Swift 代码来实际运行游戏。你可以从 GitHub 仓库中下载这些代码，该仓库在“Tetris”文件夹下包含了本书的所有代码。你不能直接从书中阅读代码的原因是，嗯，大约有
    700 行代码——远超你希望在书中看到的数量！


    然而，代码中真正重要的部分是 Go 将调用的部分。它们看起来如下：


    ![Image](img/p187-1.jpg)


    ![Image](img/p188.jpg)


    代码的架构非常简单，它的设计理念是将其编译为共享库。它的工作原理是将游戏状态声明为全局变量，并使用函数来修改该全局状态。这种架构确实可以改进，例如通过指针来回传状态而不是使用全局变量。但对于这个特定示例，使用全局变量就足够了。


    当加载共享库时，全局变量 `game` 会自动初始化一个新的俄罗斯俄罗斯方块面板，默认宽度和高度分别为 10 和 24。


    然后，我们有了实际工作的函数。以下是每个函数的作用：


    *   `nextBestMoves`——该函数获取当前面板状态并运行整个 AI 流水线，以确定下一组最佳移动。它返回移动次数，然后将移动本身以“数组”或“整数指针”的形式返回，因为返回类型需要与
    C 兼容。

    *   `playMove`——该函数将单个移动作为整数传入，并在游戏状态上执行该移动。

    *   `renderFrame`——该函数获取当前的最终面板（所有已落地的方块）和当前仍在处理中的方块（空中的那个），并将它们都渲染到单个 2D 数组中，该数组会被展平并作为整数指针返回（代表一个数组）。

    *   `lockGame`——该函数获取通过 `playMove` 函数移动到位并在空中方块，并修改俄罗斯方块游戏状态将该方块移入最终游戏面板，清除任何形成的行，生成一个新的随机方块，检测游戏是否失败，并返回该布尔值。

    *   `resetGame`——该函数通过将其初始化为新的俄罗斯方块结构来重置全局游戏状态。


    你可能会注意到，每个函数声明之前都有一个 `@_cdecl` 函数装饰器。这是在告诉 Swift：“这个函数在生成的二进制机器码中看起来和运行得像一个 C
    函数。”通过这样做，我们可以像调用 C 函数一样从 Go 调用这些函数，无论它们内部可能使用了哪些 Swift 特性。


    要编译 Swift 代码，你只需运行：


    ```

    swiftc TWAI.swift -O -emit-library -o libTWAI.so

    ```


    这是每个标志的作用：


    *   `-O`——使用全编译器优化并使代码尽可能快，且不使用不特性。

    *   `-emit-library`——不构建可执行二进制文件，而是构建其他代码可以动态链接的库。

    *   `-o libTWAI.so`——输出文件名为 `libTWAI.so`。


    然而，安装 Swift for TensorFlow 编译器（我们需要的特定发行）可能有点麻烦。因此，为了保持每个平台的指令一致，包含此示例的 GitHub
    仓库还包含一个你可以构建的 Dockerfile，它将自动处理环境设置并为你运行代码。


    无论如何，一旦库构建完成（无论你是手动构建还是通过 Dockerfile 构建），下一步是在 Go 中实现该库的功能并让它真正发挥作用。我们现在可以开始编写此应用的
    Go 部分了！


    要开始，你需要进行一些 cgo 声明并导入几个模块：


    ![Image](img/p191.jpg)


    在我们分析这段代码时，请记住，cgo 导入与其他导入分开是非常重要的，因为只有这样它才能看到在其之前的、包含 C 代码的注释。


    我们给 `cgo` 的第一条指令是告诉链接器链接 `TWAI`，即共享库 `libTWAI.so`。


    之后，我们需要找到数组实际内容开始位置的指针地址，因为我们已经查看了大小。为了做到这一点，我们将指针强制转换为 `uintptr`，然后根据我们已经解引的大小变量的字节数对其进行递增。


    技术上讲，我们已经知道大小是 8 字节，因为它是“长型”或“64 位整数”，但为了良好的编程习惯，我们仍然调用 `Sizeof` 来动态地获取大小。


    然后，我们有了缓冲区本身的指针地址。为了将其转换为 Go 中的整数数组，我们使用 `reflect` 包中的 `SliceHeader` 函数。它将接收指针、数组自身的长度以及缓冲区的总容量，并将其转换为“切片”或“数组”。我们存储该返回结果的引用。

    '
- fmt: '

    Finally, the return of this function may look perplexing at first. But when you
    break it down, it’s pretty simple to understand:


    ```go

    return *(*[]int)(unsafe.Pointer(sh))

    ```


    Basically, we tell Go: “Take the `sh` variable, pass it to the `Pointer` function,
    take the result, cast it to a pointer to an integer array, then dereference the
    pointer and return the integer array.” You can break it down like so:


    ![Image](p193-1.jpg)


    Finally, there’s also the `renderFrame` function:


    ![Image](p193-2.jpg)


    Alongside this function, we also declare a new `Frame` structure to store the
    board as a 1d array, with the `width` and `height` of the board.


    Within the function itself, we have a very similar mechanism to `nextBestMoves`.
    In this case, while the return value from the Swift `renderFrame` function is
    just a 1d array, it begins with three integers instead of just one: the size of
    the total buffer including the other two integers; and the other two integers
    are the height and then width of the Tetris game board.


    `renderFrame` will first calculate the size of the board itself, not including
    the other two integers, and then will increment the pointer twice, each time by
    the size of an integer, to get the pointers to the height and width integers as
    well.


    Finally, by incrementing the pointer once more, we get the pointer to the actual
    array of values, which is then fed through a very similar mechanism to the `nextBestMoves`
    function.


    The `Frame` is then returned from the function.


    And that’s all there is to this application! We know that some parts of it—especially
    the parts that deal with memory, pointers, and buffers—are a bit scary, but the
    end result really is worth it. If you were to clone the GitHub repo and go into
    the Tetris folder, then run the following two commands:


    ```bash

    docker build --tag block_ai:1.0 .

    ```


    ```bash

    docker run -it block_ai:1.0

    ```


    You should see your terminal turn into a Tetris board automatically playing itself!
    How great is that?!


    The `main` function is a bit too long to delve into in this book at around 100
    lines of code. However, all of this logic is stuff you’ve already learned and
    the code is well-commented, so feel free to delve deeper into the code in the
    repository itself.


    Through this example, you should be able to get up and running with interoperability
    between Go and other languages. You can now apply this knowledge to call code
    you may have already written in other languages, or may need to write in the future
    due to specific constraints.


    With that, you conclude your journey of diving into the Go programming language.
    You’ve not just gotten your toes wet, you’ve gone for a whole swim. And this is
    just the beginning! There’s still so much more to Go, and so much more to build.
    You should now be capable of building all kinds of simple and intermediate-level
    applications using Go, from command-line utilities to apps powered by CLIs and
    GUIs.


    ### Exercises


    1. What does the `tcell` package enable us to do?

    2. Why are interpreted and JIT-compiled languages more difficult to interoperate
    with?

    3. List some scenarios in which cross-language interoperability is critical.

    4. What is a language’s “runtime” comprised of?

    5. What are some common problems when embedding C code in Go?


