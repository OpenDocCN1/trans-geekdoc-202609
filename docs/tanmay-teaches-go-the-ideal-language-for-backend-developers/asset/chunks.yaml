    例如，对于源文件 `main.go`，包名为 `main`，它在文件的第一行通过如下有效的 Go 语法进行声明：


    ```go

    package main

    ```


    回到目录结构……简而言之，表 2.2 代表了你现在需要了解的目录结构。在接下来的章节中，随着我们涵盖更多功能，我们将讨论更多你可以在项目使用的目录。


    **表 2 2.2** 默认 Go 项目结构中文件和文件夹的作用


    ![Image](img/t2.2.jpg)


    现在你对 Go 代码的结构有了更多了解，让我们开始学习一些语法吧！


    任何编程语言语法的节点构建块是你用于构建表达式的“标记”（tokens）。在某种语言中，某些标记被保留为“关键字”（keywords），这意味着例如你不能将它们用作变量或函数的名称。这是因为这些标记对于
    Go 编译器实际解析你的代码以确定各个部分的含义的方式至关重要。表 2.3 列出了所有这些关键字。


    **表 2.3** Go 中保留的关键字列表


    ![Image](img/t2.3.jpg)


    现在，让我们开始尝试一些 Go 语法！


    ### Go 入门——“Hello, World!”


    首先，让我们来看一个简单的程序，让你对 Go 有个良好的感受。那么，按照编程的传统，让我们来实现“Hello, World!”


    首先，在一个名为 `helloworld` 的新目录下创建一个名为 `main.go` 的新文件。你的目录结构应该像这样：


    ![Image](img/p1.jpg)


    在 `main.go` 文件中输入以下代码。


    **代码列表 2.1** Go 中传统的“Hello, World!”


    ![Image](img/p2.jpg)


    就是这些了！如果你导航到终端，进入 `helloworld` 目录并运行：


    ```bash

    go build

    ```


    你现在应该在同一目录下有一个名为 `helloworld` 的可执行文件。换句话说，你刚刚创建并编译了第一个 Go 应用程序，你现在可以运行它了！在类 Unix
    系统上，你可以这样调用（或“运行”）它：


    ```bash

    ./helloworld

    ```


    你应该你会看到以下输出：


    ```

    Hello, World!

    ```


    程序确实在工作——但它是如何工作的呢？让我们回过部分分析源代码，正如你在表 2.4 中所示。


    **表 2.4** “Hello, World!”代码各部分的功能


    ![Image](img/t2.4.jpg)


    **注意：** 你可能已经注意到 Go 语法的一个区别是，`Println` 函数的第一个字母是……嗯，一个大写字母。稍后会详细介绍。这背后有一个非常有趣的原因。


    ### 变量


    Go 语言既是强类型又是静态类型。这意味着两点：


    1. 变量不会由编译器以“隐藏”的方式自动从一种类型转换为另一种类型。即使是从 32 位整数到 64 位整数的转换也手动完成。

    2. 编译器*可以*尝试在编译时推断变量的类型，而不是让你自己指定类型。然而，Go 的“类型推断”并没有像 Swift 那样先进——再次，这是因为编译器希望尽可能*快*。随着学习的进行，我们将探索这些局限性。


    Go 的标准是允许编译器推断类型并避免手动标注，除非有必要，例如告诉编译器不要直接从某个字面量转换类型（例如，“对于这个数字，请不要使用默认的 64 位整数，请改用
    8 位整数”）。在我们继续之后，你会看到许多手动标注的示例。


    让我们通过观察全局变量开始探索变量的世界。全局变量可以是两种类型之一：静态或常量。静态全局变量可以这样声明：


    ```go

    var age = 16

    ```


    该表达式做了两件事，而不仅仅。它首先声明了一个名为 `age` 的新全局静态变量，然后用值 `16` 初始化该变量。在这种情况下，初始化和声明共同工作，将此变量标记为
    `int` 类型。但是，如果你无法初始化值，只想“声明”一个全局静态变量，你必须显式地编写变量类型，如下：


    ```go

    var age int

    ```


    如果你愿意，尽管这不被认为是良好做法，你也可以结合这些方法，显式声明变量类型并提供用于初始的值：


    ```go

    var age int = 16

    ```


    因为它是一个全局*静态*变量，它是允许更改的。所以，如果你有如下所示程序：


    **代码列表 2.2** 获取和设置全局静态变量


    ![Image](img/p3.jpg)


    你应该看到以下输出：


    ```

    16

    24

    ```


    现在，提醒一下，在很多 Go 程序中，你会看到许多以大写字母开头（遵循驼峰命名法 UpperCamelCase）的变量、函数和结构名称。在其他语言（如 Swift
    和 Java）中，你甚至无法进行“获取常量的指针并修改它”这样的技巧，因为编译器不允许你这样做。这使得编译器在运行优化时（例如常量折叠）可以完全预计算某些计算以避免在运行时执行。

