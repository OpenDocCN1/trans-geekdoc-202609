    need to do is follow the dictionary: D’s parent is B, B’s parent is . . . A! So
    A ![Image](arrow.jpg)B ![Image](arrow.jpg)D is the cheapest way to get from A
    to D.


    Although this is a very simple example to demonstrate how you can use Dijkstra’s
    algorithm to ascertain the shortest path in a graph, this same code can be used
    in larger scale applications. Plus, the concepts learned during the implementation
    of this demo will help you in your journey of applying Go.


    ### Conway’s Game of Life


    Conway’s Game of Life is quite a popular game among people in the math and technology
    communities. It’s not like your traditional game—it’s special, in that it’s a
    *zero-player* game. That means you don’t get to modify the environment or state
    after you set it for the first time.


    It was invented by mathematician John Conway back in 1970. Technically, the Game
    of Life is a kind of “cellular automaton,” meaning the game consists of a collection
    of cells which, according to some mathematical rules, will either live, die, or
    multiply.


    What’s really interesting is you can get some very complex behavior to emerge
    from a very simple initial state. Take the following grid in [Figure 4.4](#ch4.xhtml#fig4_4),
    for example.


    ![Image](Tanmay_0404.jpg)


    **FIGURE 4.4** Sample “Conway’s Game of Life” grid at the beginning of the game


    This is a grid, which is really a collection of cells. Every cell that’s gray
    is “dead,” and all the yellow cells are “alive.” At each iteration, you use a
    few rules to determine if a cell should die, become alive, or stay the same. With
    this specific initial setup, using Conway’s rules, you should see the yellow cells
    drift to the bottom right of the grid infinitely.


    Looking at static images of the Game of Life in action really cannot do it justice.
    It’s absolutely worth it to go to the online implementation of this game at Edwin
    Martin’s website, [www.bitstorm.org/gameoflife](https://www.bitstorm.org/gameoflife).


    Now, let’s take a look at how we can implement this game in Go! But first, let’s
    quickly go over our rules:


    **1.**   If a cell is already alive


    **a.**   If it has less than 2 living neighbors, it dies.


    **b.**   If it has 2 or 3 living neighbors, it stays alive.


    **c.**   If it has more than 3 living neighbors, it dies.


    **2.**   If a cell is already dead


    **a.**   If it has exactly 3 living neighbors, it becomes alive.


    The rules are deceptively simple—and not only do they emerge in visually interesting
    behavior, they’re even *Turing complete*! You could implement a calculator, the
    Go programming language, or any computable task in a single, initial Game of Life
    state.


    In this example application, we’ll do things a bit differently. We’ll build a
    graphical user interface, so you can actually see what the Game of Life is doing.
    For this, we’ll need a couple of extra imports. Specifically, we’ll use a package
    called “pixel.” The following are all the imports we’ll need:


    ![Image](p96.jpg)


    We’ll also create a structure that’s responsible for storing the information of
    what we’re rendering to the screen. It stores only two pieces of very simple information:
    the pixels that we’re rendering, and the width of the screen. The reason we only
    store width and not height is because we don’t need it to calculate the index
    of the pixels. We’ll explore this in a moment.


    One thing to note: The way the pixels are stored is in a single, one dimensional
    array of unsigned 8-bit integers. Each pixel has four values in this array, in
    the following order: Red, Green, Blue, Alpha. You’re likely familiar with RGB,
    and Alpha means transparency.


    ![Image](p97.jpg)


    Before we continue, understand that we don’t store the height. This is because
    when we need to find the index of the pixel in the Pix array given a certain (x,
    y) coordinate (here, x and y are indices from the top-left corner of the screen,
    for which the coordinates are (0,0)), all you need to do is figure out ((y \*
    width) + x) \* 4, and you get the index of the R element of the pixel. Plus 1,
    you get G; plus 2, you get B; plus 3, you get A; and plus 4, you’ve found the
    R element of the next pixel.


    Therefore, while we could store the height for safety reasons, such as to make
    sure the user gave us a valid Y coordinate, we don’t *need* to.


    Now we need to create some functions to help us interface with this structure
    more easily—for example, initializing the structure to a screen of just black
    pixels with a certain width, or a function that can set the color of a pixel at
    a certain coordinate.


    Technically, we could use the functions already built for this task within the
    Pixel module that we’ve imported. However, graphics rendering is compute intensive,
    and the Pixel module has a relatively slow implementation of these methods. If
    we were to use those methods directly, it would be impossible to run a large-scale
    Game of Life in real time. It would take a couple of seconds, not to compute the
    iteration, but for Pixel to render the iteration that we compute!


    Therefore, we’ll write our own function to implement these basic pieces of functionality.
    In a way, this is an opportunity for you to learn a few new tricks and to get
    in the habit of learning how to solve problems that come your way, even if they’re
    caused by other people’s code! Remember, Go was never really built for GUI work,
    but if you *really* need to, you *can* use it.


    ![Image](p98.jpg)


    ![Image](p99.jpg)


    As you can tell, these functions are quite simple. `NewPixels` will simply initialize
    the `pixels` array, create a new `Pixels` `struct`, and pass us a pointer to it.
    `DrawRect` will take the top-left coordinate of a rectangle, the `width` and `height`,
    and the color, and draw that rectangle into the `Pixels` `structure`. Finally,
    `SetColor` will find the 1D (one-dimensional) index of a 2D coordinate to a pixel
    and set the color accordingly.


    All right! We’ve gotten most of the GUI infrastructure out of the way. Now we
    can work on the actual Game of Life logic. As we’ve already explored, one of the
    main tasks in the Game of Life is being able to count the neighbors of a certain
    node. Unlike some other algorithms, even nodes at a diagonal are considered to
    be valid neighbors in the Game of Life. Therefore, in [Figure 4.5](#ch4.xhtml#fig4_5),
    for the node in the middle (the node with a circle), all the eight nodes pointed
    to with arrows are considered neighbors.


    ![Image](Tanmay_0405.jpg)


    **FIGURE 4.5** The boxes that count as a “neighbor” for one box


    In order to implement the logic that counts the number of neighbors that are still
    alive, we’ll start from the top left of the neighbors, move to the end of that
    row, then move down a row, move to the end of that row, and so on. We will skip
    any indices that would be off the screen (such as for a box at the very left of
    the screen; we won’t count neighbors further to the left). We will also skip the
    node that we’re counting neighbors for.


    Here’s the function implementing that logic:


    ![Image](p100.jpg)


    If you look closely, you’ll see precisely the logic that moves from the top left
    down each row one by one to count neighbors. The first `for` loop in the function
    is simply responsible for initializing a two-dimensional array that will store
    the number of “alive” neighbors for each cell.


    Then, the second `for` loop, which is really just the first `for` loop in an enclosure
    of three total, loops through every single cell, running the logic to compute
    the number of “alive” neighbors for that cell using the inner two loops.'
