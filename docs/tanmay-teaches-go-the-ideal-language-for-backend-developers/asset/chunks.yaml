    Another great way to reuse code and make it more modular is to use functions.
    These are an integral part of most programming languages, and `Go`’s functions
    are incredibly useful. However, at the time of writing this, they lack one KEY
    feature that separates clean, reusable, and less redundant code, from code that
    has a larger surface area for potential bugs. This is a feature the language developers
    are working on, however. More on this in a little bit.


    You’ve already seen an example of a function in `Go`: the `main` function! It’s
    written like so:


    ```

    func main() {

    }

    ```


    If you were to run just those three lines of code, it would compile and run successfully—even
    though the program would do nothing. That’s because this function doesn’t return
    anything, and therefore doesn’t *need* a “`return`” statement. We want to point
    this more explicitly because some programming languages, such as `C`, require
    that the `main` function must return something, such as an exit code, to let the
    invoking process know if the program did what it was supposed to do successfully
    or not. This is not the case in `Go`.


    If you’d like to create a simple function that just returns a constant value all
    the time, such as a 32-bit floating point representation of `pi`, you could write
    code like this:


    **CODE LISTING 2.11** Declaring, defining, and calling a function


    ![Image](p23.jpg)


    Notice the way the function signature is structured. The return type annotation
    is placed directly after the name of the function and before the opening curly
    brace of the function block.


    However, we’ve still got the parentheses in the way—and as you’ve likely guessed,
    these are for arguments that you may want to pass into the function.


    For example, if you’d like a function that returns `pi` multiplied by some non-negative
    integer, you could write the following function:


    **CODE LISTING 2.12** A new `valueOfPi` function that multiplies against an arbitrary
    constant


    ![Image](p24.jpg)


    Once again, notice how the function signature changed. We first placed the name
    of the argument, then a space, and then the type of that variable.


    Before we continue, there is a quick sidenote I want to make. When we ran the
    preceding multiplication, note how we had to manually cast the unsigned integer
    to a 32-bit floating point number. This is done to avoid any kind of ambiguity
    in the operation.


    You may be wondering at this point: How does a type cast work? A type cast is
    able to follow a certain spec to convert bits arranged in a way that a certain
    type expects into a way that another type expects them to be. For example, how
    is a `float32` represented in memory? Well, `float32` in `Go` conforms to the
    IEEE 754 spec.


    One bit is reserved for the sign (is this positive or negative), 8 bits are reserved
    for the exponent, and 23 bits are usually reserved for the fraction. However,
    integers are completely different: They have a very straightforward way of being
    represented in binary, with the value of bits increasing by a factor of 2 from
    right to left, with the leftmost bit usually reserved for the “sign.”


    So, if you want to convert an integer value to a `float32` value, it’s not as
    simple as saying “Here are the bits. Treat them as `float32`.”

