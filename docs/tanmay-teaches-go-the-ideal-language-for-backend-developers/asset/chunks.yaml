  raw: 'As we mentioned, this function takes two separate channels: an input channel
    and an output channel. Within the function, we loop through the input channel
    just like how we loop through essentially any other sequence, like a dictionary
    or array. However, what Go does behind the scenes is a little bit different. When
    there are no values in the channel, the `for` loop will block and start waiting
    for a new data point. When it finds one, then the `for` loop continues with its
    iteration, and at the end, jumps back to the top of the loop.


    Within the `for` loop itself, we do only one simple thing: We square “`x`”, which
    is the integer we got from the input channel, and then we put that squared value
    into the output channel using the “`<-`” operator.


    As you can tell, modifying this function to use channels was quite simple. However,
    the `main` function still requires a bit more rearchitecting:


    ![Image](p144-1.jpg)


    Let’s go through the `main` function section by section again.


    We start with the first two lines of code that are responsible for creating the
    input and output `channels` using the “`make`” function, which we used in [Chapter
    2](#ch2.xhtml) to create arrays:


    ```

    inputChannel := make(chan int)

    ```


    ```

    outputChannel := make(chan int)

    ```


    Then, we run the `squareIt` function in a separate Goroutine:


    ```

    go squareIt(inputChannel, outputChannel)

    ```


    At this point, the function is running in the background, and because of the `for`
    loop, it’s waiting for data to come through the input channel.


    In order to feed the input channel with data, we simply loop from 0 to 9, and
    at each iteration we place the number within the input channel:


    ![Image](p144-2.jpg)


    At this point, because we’ve put the data into the channel, we expect that the
    `squareIt` function has picked up the data and placed it in the output channel.
    Then, we need to loop through the output channel to get the data back from the
    `squareIt` function and print it out so we can see that output too:


    ![Image](p145-1.jpg)


    If you’ve been really attentive up to this point, you may have noticed a bug in
    this program. And, if you already know about how channels work, you’ve likely
    noticed *another* bug in this program. However, let’s roll with this code for
    now, and determine what the bugs are when we get to them.


    Here is the final code:


    **CODE LISTING 5.2** A concurrent implementation of the number squaring application


    ![Image](p145-2.jpg)


    First, compile the program. Notice that it compiles with no errors. However, when
    you run the code, on the majority of systems you’ll see an error like this one:


    ![Image](p146.jpg)


    All right, so we know there *is* an issue with the logic of our program. In fact,
    Go gives us a pretty clear error message here; we’ve encountered what’s known
    as a *deadlock*. A deadlock occurs when all of your threads are waiting on another
    one to do something, so no thread gets the opportunity to do the thing that the
    others are waiting for.


    In most programming languages, especially the ones that use native threads, this
    just results in your program freezing and refusing to cooperate, and at this point
    you must kill the process. However, because the Go runtime can see what each Goroutine
    is doing, it sees the deadlock and kills the process for you. Plus, it prints
    a neat little stack trace to help you determine where your code is failing!


    Currently, the deadlock arises because we’re using what are known as *unbuffered*
    channels. An unbuffered channel means the channel has no “storage space,” and
    when a sender puts some data within the channel, a receiver needs to take that
    data immediately. If a receiver has not taken the data, then, as you try to put
    more data into the channel, you will be blocked until the channel is empty, at
    which point you’d be allowed to place the data inside it.


    So, [Table 5.1](#ch5.xhtml#tab5_1) is a timeline of what’s happening through the
    execution of the program.


    **TABLE 5.1** A Walkthrough of How Both Goroutines’ Execution Leads to a Deadlock


    ![Image](t5.1.jpg)


    At this point, both Goroutines are waiting for each other to do something that
    they both won’t get the opportunity to do because . . . they’re waiting for each
    other. In order for either of these Goroutines to continue executing, the other
    one would need to execute as well. As you can likely tell, this deadlock wouldn’t
    occur if the `squareIt` Goroutine didn’t need to wait for another Goroutine to
    take the results out of the output channel.


    In order to solve this problem, we can use what’s known as a “buffered” channel.
    In a buffered channel, you can insert up to only a certain number of elements
    that you define asynchronously (without blocking) before the channel blocks and
    waits for a Goroutine to take data out before it lets you add more. Essentially,
    the channel lets you “buffer” or “store” a certain number of elements without
    blocking.


    You can create a buffered channel by simply passing the size of the buffer to
    the `make` function when you’re making the channel. For example, modify the output
    channel instantiation to the following:


    ```

    outputChannel := make(chan int, 10)

    ```


    And now, if you compile your code, it should still work. Plus, when you run your
    code, success! You see the numbers you expect!


    ![Image](p148-1.jpg)


    Well, at least it was *kind of* a success. If you see where it deadlocks, line
    16 of the code (as pointed out by Go in the last line of the stack trace), you’ll
    realize the bug now arises with the way we take data out of the output channel.


    See, when the output channel is empty, and the input channel is empty, then the
    main function is blocked because it’s waiting for data on the output channel,
    and there’s nothing that’ll come in the output channel because the input channel
    is empty and the other goroutine is waiting for data on the input channel.


    The way we can fix this is by replacing this loop in the main function:


    ![Image](p148-2.jpg)


    This loop will block when there’s nothing in the output channel because the loop
    does not know when to stop. However, in this case, we know there are only going
    to be 10 values, so we can replace the `for-in` loop with this:


    ![Image](p149-1.jpg)


    Now, when we’ve done 10 iterations, the channel will still technically be open,
    meaning we *could* be getting more data and we wouldn’t know it, but because we
    know the logic of the rest of the program, we know this won’t happen.


    Also, as you can see, we also use the “`<-`” operator to take data out of a channel.


    Before we move on to the next major pillar of Go’s concurrency, we think it’s
    helpful to visualize the way a channel works in the backend.


    We’ve already seen two kinds of channels:


    •   **Unbuffered Channels (sync channels).** These need to store a single element
    from a single Goroutine, wait for some Goroutine to pick it up, and then it’s
    available to store another element.


    •   **Buffered Channels (async channels).** These need to store multiple elements
    from potentially multiple Goroutines, and only block the senders when the channel
    is full. It needs to allow potentially multiple Goroutines to receive elements
    as well.


    However, there is also a third kind of channel that we haven’t taken a look at
    yet: the channel with zero-sized elements. For example, imagine a channel like
    this:


    ```

    channel := make(chan struct{})

    ```


    In this case, the type of the data in the channel is just an empty structure.
    When this is the case, we’re telling Go “I’m not storing anything in the channel,
    I’m just using this to help me synchronize my threads.” In other words, you could
    look at this as like a semaphore.


    So, for example, take a look at this Swift code:


    ![Image](p149-2.jpg)


    ![Image](p150-1.jpg)'
