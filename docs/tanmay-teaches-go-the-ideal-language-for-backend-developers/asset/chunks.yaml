    there! The parent is also nil—because how did you get to the source? You didn’t
    get there *from* the source, you were just already there; no node precedes it.


    Let’s say, for the sake of discussion, the source node in our graph is node B.
    The dictionaries should look like [Table 4.2](#ch4.xhtml#tab4_2) now.

