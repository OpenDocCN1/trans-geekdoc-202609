    `=` 运算符，如下所示：


    ![Image](img/p32.jpg)


    在 Go 中使用函数的另一种方法，当然是将它们传递给其他函数！例如，如果你需要一个调用另一个函数的函数，但你又在编译时不知道它需要调用*哪一个*函数呢？你可以编写这样的代码：


    **代码列表 2.17** 将函数指针传递给其他函数


    ![Image](img/p33.jpg)


    ![Image](img/p34.jpg)


    注意 `runMathOp` 函数的签名。它接收一个名为 “op”的参数，其类型看起来像普通的函数签名，只是没有函数名和参数名——只留下了参数类型和返回类型。


    当你调用 `runMathOp` 函数时，你可以简单地像传递其他参数（如 `add` 或 `mul`）一样传递另一个函数，只要它符合 `runMathOp`
    声明中指定的函数签名即可。


    在我们继续之前，你应该意识的最后一个非常强大的特性叫做 *defer*。通过 `defer`，你告诉 Go 在函数即将返回之前执行某些代码。这段代码将在返回表达式被求值后执行，但在实际返回给调用者之前执行。语法非常简单：你只需要编写
    `defer` 关键字并紧随其后运行一个函数调用。例如，看下面的代码：


    ![Image](img/p35.jpg)


    `println(x)` 是一个函数调用，该调用被传递给了 `test` 函数内部的 `defer` 关键字。因此，在 `test` 函数返回之前，该打印语句不会执行。正因如此，你应该看到以下输出：


    ```

    6

    ```


    ```

    5

    ```


    你也可以使用 `defer` *内联*定义一个新函数并内联调用它，如下：


    **代码列表 2.18** 为 defer 内联定义并调用函数


    ![Image](img/p36.jpg)


    由于你不仅是在内联*定义*一个函数，而且在第 9 行通过两个括号*调用*了它（这正是 `defer` 的要求），因此这是有效的语法。当你运行这段代码时，你应该看到以下输出：


    ```

    6

    ```


    ```

    this is being called from an inline function

    ```


    ```

    I can put multiple expressions inside of here!

    ```


    ```

    4

    ```


    现在我们已经涵盖了关于函数的基础知识，让我们来谈谈在 Go 中*不能*做的事情：*泛型* (generics)。


    泛型是支持泛型的语言中最受喜爱的特性之一。至少，大多数语言是如此（我们在看着你们，Java 和 C++！）。


    例如，在 Swift 和 Julia 中，泛型允许你编写更少的代码来支持更多类型，并具有更高的可读性和灵活性。像 Python 这样的语言在这种比较中并不真正适用，因为你无论如何都在那里使用鸭子类型（duck
    typing）！它从根本不在乎你变量的类型。


    然而，Go 团队正在开发泛型。这里有一些你可以在 Go 语言未来版本中编译的代码预览：


    ![Image](img/p37.jpg)


    这段代码看起来可能很复杂，但实际上非常简单。在此之前，假设你想写一个打印整数数组中每个元素的函数。你会写类似这样的代码：


    ![Image](img/p38.jpg)


    它是有效的！但随后如果你想对字符串做同样的事情，你就必须这样做：


    ![Image](img/p39.jpg)


    你必须对浮点数、无符号整数、不同大小的整数和浮点数等执行类似的操作。


    ### 结构体


    Go *不是*一种面向对象的语言。它没有“类”（class）或“对象”（object）的概念。一切都是值。甚至引用也是值，这意味着它们是表示为值的指针。


    因此，为了帮助程序员存储多个相关数据，Go 拥有“结构体”（structures）的概念。结构体允许你将某些数据存储在连续的内存中。让我们回到用户名和年龄的示例。我们可以将其表示为`结构体`：


    ![Image](img/p43.jpg)


    现在，`User` 的字节大小是 `string` 的字节大小加上 `int` 的字节大小。浅白地说，这些变量的字节在内存中是一个接一个顺序排列的。


    如果你想创建一个结构体的新实例，可以使用以下语法：


    ```go

    myUser := User{"Kathy", 18}

    ```


    现在，如果你想打印存储在结构体中的不同数据，你可以简单地使用“.”运算符：


    ```go

    fmt.Println(myUser.Name)

    ```


    ```go

    fmt.Println(myUser.Age)

    ```


