    如果出现那种情况，你可以使用 `switch` 语句来代替。在历史上，`switch` 语句比 `if` 语句更具优化空间，但编译器技术已经进步到这种差异带来的影响微乎其微的程度，且仅适用于大多数程序员通常不太触及的边缘情况。


    “switch” 允许你评估单个表达式，并将其相等性与多个可能结果中的一个进行匹配。例如，假设用户输入了姓名，我们想查看三个可能的用户中是哪一个输入了姓名。你可以通过以下代码实现：


    ![Image](img/p12.jpg)


    Go 的 `switch` 语句与 C 和 Swift 等语言中的语句非常相似。与 Swift 一样，你*必须*提供一个 `default` 情况（case），当没有其他
    `case` 的条件被满足时就会调用该情况。与 C 不同，你不需要在每个 `case` 的末尾添加 `break`，因为 Go 不会穿透其他 `case`。相反，它会移动到
    `switch case` 块*之后*的下一行代码。如果你没有 C 语言经验，不用担心。你不需要它也能掌握 Go。这只是一个示例，让你了解 Go 的控制流在使用
    `switch` 语句时与其他语言 `switch` 语句的区别。


    所以，请像这样在 main 函数中实现前面的 `switch` 语句：


    **代码列表 2.5** 使用 switch 语句在 Go 中检查相等性


    ![Image](img/p13.jpg)


    当你运行这段代码时，你应该看到以下输出：


    ```

    Hi, Tanmay.

    ```


    这是关于 Go 中条件判断的入门。通过使用它们，你可以根据条件是否满足跳转到代码的不同部分。


    ### 循环


    循环是编程语言为你提供的另一个重要构建块。在 Go 中，循环被极大简化了。事实上，只有*一种*循环承担了你通常在其他语言中看到的*三类*循环的角色（`for`
    循环、`while` 循环、`do-while/repeat-while` 循环）。


    Go 将这三种循环替换为仅一种循环：`for` 循环。从技术上讲，你也可以用 `for` 循环复制其他类型循环的功能。这意味着 Go 在“for”的旗帜下实际上只有多种循环，代表了在其他语言中找到的不同类型的循环。


    让我们从经典的循环开始：“for-in”循环。这种“for 循环”允许你按照特定的顺序遍历序列中的元素，例如数组中的元素。这里有一个使用 `for-in`
    循环的示例：


    **代码列表 2.6** 在 Go 中使用 for-in 循环


    ![Image](img/p14.jpg)


    **注意：** 你可能在想：“我在这里没有看到‘in’这个词，所以为什么它叫 `for-in` 循环呢？”答案很简单：循环中的“`:=` `range`”部分被视为“in”——例如，“for
    `i` `in` `names`”，类似于 Swift 和 Python。


