    ## CHAPTER 5


    ## Concurrency


    Welcome to [Chapter 5](#ch5.xhtml)! You’ve progressed quite far down your journey
    of learning Go, and you’re now at the level where you can competently implement
    simple and intermediately complex applications in Go. However, to really master
    Go, and to unlock its full potential, you need to be familiar with a cornerstone
    in modern computing: concurrency. By enabling a computer to do multiple things
    at the same time—or by switching across multiple execution streams—you can run
    tasks that computers of the past could never have done.


    Once you’ve finished this chapter, you’ll be able to answer the following questions:


    * What is a thread and a process?

    * What’s the difference between concurrency and parallelism?

    * How do green threads and user-space threads work?

    * Why are Goroutines better than using threads? When should you not use them?

    * How can you communicate among different Goroutines with channels?

    * How can a Goroutine wait for input from multiple sources at once?


    ### Concurrency, Threads, and Parallelism


    Concurrency is fundamental to modern computing; it enables computers to execute
    independent streams of instructions simultaneously, thereby enabling functionality
    such as multiple applications running at the same time.


    Imagine if your computer could only do a single thing at once. It would be incredibly
    limiting! We wouldn’t even have the technical provision for graphical interfaces.
    We’d instead be stuck with command-line interfaces for everything.


    On some systems, concurrency simply means that the CPU will switch from running
    instructions of one process to another in very quick succession, making it look
    to us humans as if multiple things are happening at the same time.


    However, this technique has its limitations. If you’re trying to run multiple
    processes that require a lot of compute time, and if they all need to run at once,
    then the CPU will spend a lot of time running those processes. That’s because,
    not only does the CPU need to do the computing per process, it also needs to keep
    switching between the processes, which in itself takes a bit of computing power.


    This is why modern CPUs have “cores.” The more cores a CPU has, the more independent
    streams of execution it can perform essentially simultaneously. This means that
    as the instructions of one process execute on one “core,” a totally different
    process can be running its instructions in another “core” during the same “clock
    cycle.”


    Now, the real value of this technique starts to show when you merge the old and
    the new. Imagine having multiple physical cores, capable of running multiple different
    processes at the same time, and also having them switch between processes really
    fast so we can build systems such as GUIs which, by design, require concurrency!
    This is how modern computing systems are architected—all the way from the CPU
    to the operating system, and even to the programming languages.


    We now know that a single CPU and OS instance can run multiple—meaning thousands—of
    different processes at the same time. However, what if an independent process
    needs to run its own multiple streams of execution at the same time? For example,
    let’s say you have a web browser, and you open multiple tabs. Technically, the
    browser is a single process, but there are multiple tabs all running their own
    code. This is where threads come into play. A thread is a lightweight part of
    a process that has its own “stack pointer” and registers. A process could spawn
    hundreds of threads, and the operating system would map those threads to the CPU
    just as it would other processes.


    Something to note: the browser analogy we gave isn’t set in stone and there are
    a few exceptions. For example, on the Google Chrome web browser, each tab gets
    its own full-blown process, which makes it easier for Chrome to hit performance
    benchmarks, but it’s very resource intensive. That’s why Chrome is notorious for
    consuming orders of magnitude more battery power on laptops, as well as RAM, than
    other browsers such as Safari and Firefox so far use threads.


    You may now be thinking: “This all seems too good to be true! We can just run
    thousands of threads and processes and our operating system handles it all for
    us? Wow!” Unfortunately, when something seems too good to be true, it usually
    is. There are quite intense limitations to scaling with threads.


    You see, threads may be relatively lightweight compared to full-blown processes,
    but they’re still very expensive to spin up and then join with. It requires an
    entire system call, and interaction with the kernel, to do so. This means that
    in instances when you need thousands of threads, it’s usually more efficient to
    only spin up tens or hundreds, and then have each thread do multiple pieces of
    work.


    That’s why, for most software today, there are actually two kinds of threads:
    native threads, which are the kind we’ve already talked about (handled at the
    kernel-level), and green threads, which we’ll discuss in a moment (they’re handled
    at the user-level).


    Think about web servers for a moment. A single system may get thousands, maybe
    tens of thousands, of requests at once that it needs to deal with. In this case,
    threads would be insufficient, because there would be so many of them that the
    scheduler, which is responsible for switching between threads, would execute for
    a longer period of time than the threads would themselves.

