- fmt: "\nThat’s why the web servers implement “green threads,” which are handled\
    \ by the server itself, making it so that, within a single thread, we can switch\
    \ between multiple different green threads at certain points in the code. Because\
    \ we have more fine-grained control over where a “context switch” happens, performance\
    \ is usually enhanced for web server–type applications.\n\nGo has a unique implementation\
    \ of a similar concept, that follows a paradigm known as the “M:N” model of threading.\
    \ This is also known as “hybrid threading.” The `M` represents the user-mode or\
    \ “green” threads, and the `N` represents the kernel-mode or “native” threads.\
    \ It’s similar to what you’d get if you were to combine completely kernel mode\
    \ (1:1) and completely user mode (N:1) threading.\n\nThe extra complexity in hybrid\
    \ threading comes with the fact that you need to modify both kernel- and user-level\
    \ code to get the system to work. However, we do have something working in our\
    \ favor: Most modern kernels have all the provisions we need already built in!\
    \ We just need good user-level software to handle the green threads, and that’s\
    \ exactly what Go delivers on.\n\n### Goroutines\n\nGo has a concept of “Goroutines”\
    \ that map lots of different execution streams, which we can just call functions,\
    \ to a pool of native threads. To give you an idea how lightweight Goroutines\
    \ are, they require only `2KB` of memory, compared to a native thread’s `1MB`\
    \ plus a guard page, which is `500`× as much!\n\nBefore we dive into how these\
    \ Goroutines work, let’s take a look at an example of how you can use them.\n\n\
    The syntax for creating Goroutines is quite simple: To invoke a function as you\
    \ normally do, you only need to add the token “go” before the invocation. For\
    \ example, take a look at the following code:\n\n**CODE LISTING 5.1** A naïve,\
    \ single-threaded program to square numbers\n\n![Image](p140.jpg)\n\nAs you can\
    \ imagine, when you compile and run this code, it prints out the number `4`. But\
    \ what if `squareIt` was really a long-running operation that you wanted to run\
    \ in a separate Goroutine, so the `main` function can continue doing whatever\
    \ it needs to do while `squareIt` runs? All you need to do is put “go” before\
    \ `squareIt` in the `main` function:\n\n![Image](p141-1.jpg)\n\nGreat! If you\
    \ compile your program, you’ll notice there are no errors. However, when you run\
    \ the code, you’ll see that it prints . . . nothing. (This is usually the case\
    \ on most systems.) Why is that?\n\n(Even if it did print something out, continue\
    \ reading. You’ll see why in a moment.)\n\nWell, think about it. When we ran the\
    \ Goroutine, we put the execution of `squareIt` into the “background,” which is\
    \ another way of saying it’s “a separate Goroutine from the one we’re currently\
    \ on.” Then, right as we did that, the `main` function ended. The `main` function\
    \ is executing in the main Goroutine, which is executing the main thread of the\
    \ process this program is running in. When the `main` function ends, the entire\
    \ program exits—and that means the process exits before our other Goroutine even\
    \ had the chance to print out the squared number.\n\nThat means we need to wait\
    \ for the Goroutine to finish. This can be done by adding a `time.Sleep` call\
    \ to the `main` function:\n\n```go\npackage main\n\nimport (\n\t\"fmt\"\n\t\"\
    time\"\n)\n\nfunc squareIt(n int) {\n\tfmt.Println(n * n)\n}\n\nfunc main() {\n\
    \tgo squareIt(5)\n\ttime.Sleep(time.Second)\n}\n```\n\nGreat! If you compile your\
    \ program, you’ll notice there are no errors. However, when you run the code,\
    \ you’ll see that it prints `25`.\n"
