    All right, now you know about global variables. So, let’s talk about local variables!
    Creating local variables is done quite differently in Go, compared to other languages,
    using the infamous `:=` operator. Let’s take a look at an example.


    If you want to create a local variable inside your `main` function and print it
    out, you could do it like the following:


    **CODE LISTING 2.3** Local variables within functions


    ![Image](p6.jpg)


    We know the variable instantiation looks weird when you compare it to other languages,
    but the first line of code in the `main` function told Go “create a variable called
    `name` and store the string literal ‘`Anna`’ within it.” hasn’t changed when you
    compare this to another language such as C or Swift is scope. A variable is deleted
    after the block of code it’s in exits.


    “Deleted” is a bit of a strange concept, so let’s dive a bit deeper into that.
    If you have a float such as the following:


    ```

    price := 69.99

    ```


    The variable `price` takes 4 bytes of memory, and it directly contains those 4
    bytes, as in, a CPU register could hold those 4 bytes directly. So, when the block
    of code it’s in exits, in this case the `main` function, it’s deleted, and it
    no longer exists. However, if the variable is, in reality, a reference to another
    variable or structure, then the reference is deleted, which will, sometime in
    the future, trigger the Garbage Collector to remove whatever it was referring
    to *if and only if* there remain no other references to it as well.


    If you’d like to declare a variable locally but not initialize it, you can use
    the same global static variable syntax:


    ![Image](p7.jpg)


    You can even create local constants:


    ![Image](p8.jpg)


    We’ve already covered some basic types of variables, but there are some more you
    should keep in mind, which are listed in [Table 2.5](#ch2.xhtml#tab2_5).


    **TABLE 2.5** What the Common Native Types in Go Store


    ![Image](t2.5.jpg)


    Of course, variables aren’t limited to being scalar, you can create arrays as
    well. Creating an array is quite simple in Go. In terms of a type annotation,
    it’s just appending the type you want in the array to the `[]` token. For example,
    for an array of strings, you’d use the `[]string` type annotation.


    An array literal’s elements are wrapped in curly braces instead of square brackets,
    and the array’s type annotation must always precede the values within the literal.
    For example, if you want to create a local array of strings, you could use the
    following:


    ```

    names := []string{"Tanmay Bakshi", "Baheer Kamal"}

    ```


    Or, if you want to manually annotate the type, you could use this:


    ```

    var names []string

    ```


    ```

    names = []string{"Tanmay Bakshi", "Baheer Kamal"}

    ```


    In order to append a new element to an array, use the `append` function:


    ```

    names = append(names, "Kathy")

    ```


    The `append` function allocates memory for a new element at the end of the array,
    and then sets the value of that new space in memory to the second argument we
    passed to the function. It then returns a NEW array, which we place back into
    the original variable.


    An array in Go is stored as a contiguous block of memory, meaning that, from a
    pointer to the first element, you can reach the rest of the elements in subsequent
    memory addresses.


    Internally, when you append to an array, Go’s runtime may need to run an operation
    known as a “reallocation.” Most operating systems try to extend the buffer of
    memory that you already have, but when that’s not possible because the succeeding
    memory is being used by something else, then, to accommodate the bigger array,
    it allocates a brand new buffer, copies the previous elements over, and then frees
    the previous buffer.


    As you can tell, that whole mechanism can be quite slow. In order to make some
    array operations more efficient when we already know *how many* elements we’ll
    need, but not what those elements are, you can use the `make` function. With the
    `make` function, you can allocate a certain number of elements in the array for
    you to use without having to run the reallocation. Here’s an example of that:


    ```

    names := make([]string, 3)

    ```


    ```

    names[0] = "Tanmay Bakshi"

    ```


    ```

    names[1] = "Baheer Kamal"

    ```


    ```

    names[2] = "Kathy"

    ```


    One thing to keep in mind is that this does not only reserve capacity in the array,
    it also reports that the length of the array *is* the number of elements you passed
    into `make`. So, if you make an array with three elements, and don’t set their
    values, the memory within them is just garbage memory from whatever was last stored
    there.


    In some other languages, such as Swift, when you reserve capacity, it still reports
    that the array is empty, and when you append, it simply doesn’t need to do any
    reallocations until you reach that reserved capacity count. To achieve the same
    outcome in Go, of an empty array with a backing memory buffer with a certain capacity,
    you can pass the `make` function a zero and then pass it the capacity you’d like
    as a third argument. For example:


    ![Image](p9.jpg)


    When you run this code, you should see the following output:


    ```

    0

    ```


    ```

    2

    ```


    ```

    Tanmay Bakshi Baheer Kamal

    ```


    What this signifies is that when you call `make`, the array is “empty” (it has
    a length of zero), and you can see the names in the array had a length of two.
    However, what’s different about this code is that the append operations did not
    need to allocate any memory.


    ### if Statements and switch Statements


    Of course, an integral part of any programming language is its ability to conditionally
    branch. In this regard, Go supports two main ways of conditional branching:


    - `if` statements

    - `switch` statements


    Let’s start by taking a look at the classic, nearly universal `if` statement.
    In Go, these look quite similar to the `if statements` in languages such as Java,
    C, and Swift:


    ![Image](p10.jpg)


    The `<expression that resolves to Boolean value>` can be a Boolean literal (`true`,
    `false`), a function call that returns a Boolean, a variable or constant that
    stores a Boolean, or an operator call that returns a Boolean (e.g., you can use
    `==` for checking equality, or `>` and `<` for comparison, etc.). Speaking of
    Boolean operators, take a look at some common Boolean and Bitwise operators in
    [Table 2.6](#ch2.xhtml#tab2_6).


    **TABLE 2.6** Common Built-in Boolean and Bitwise Operators in Go


    ![Image](t2.6.jpg)


    ![Image](t2.6a.jpg)


    Of course, you can combine multiple Boolean operators to make a “compound condition.”
    For example, “(if country is Canada and age is greater than 17) OR (if country
    is Japan and age is greater than 15)”.


    For example, if we want to write a short program to find out if someone’s an adult,
    we can write the following code:


    **CODE LISTING 2.4** Using if statements and Boolean operators in Go


    ![Image](p11.jpg)


    In this program, `age` (as an expression that resolves to an integer by loading
    a variable) and `18` (an integer literal) are fed into either side of the `>=`
    operator. The operator returns a Boolean, which is then fed into the `if` statement,
    which determines where the code needs to jump to next.


    Sometimes `if` statements:


    - Make your code “ugly” because there are too many conditions to evaluate

    - Always look for equality against a certain single expression

