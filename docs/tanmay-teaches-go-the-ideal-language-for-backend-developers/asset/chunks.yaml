    \ the server itself, making it so that, within a single thread, we can switch\
    \ between multiple different green threads at certain points in the code. Because\
    \ we have more fine-grained control over where a “context switch” happens, performance\
    \ is usually enhanced for web server–type applications.\n\nGo has a unique implementation\
    \ of a similar concept, that follows a paradigm known as the “M:N” model of threading.\
    \ This is also known as “hybrid threading.” The M represents the user-mode or\
    \ “green” threads, and the N represents the kernel-mode or “native” threads. It’s\
    \ similar to what you’d get if you were to combine completely kernel mode (1:1)\
    \ and completely user mode (N:1) threading.\n\nThe extra complexity in hybrid\
    \ threading comes with the fact that you need to modify both kernel- and user-level\
    \ code to get the system to work. However, we do have something working in our\
    \ favor: Most modern kernels have all the provisions we need already built in!\
    \ We just need good user-level software to handle the green threads, and that’s\
    \ exactly what Go delivers on.\n\n### Goroutines\n\nGo has a concept of “Goroutines”\
    \ that map lots of different execution streams, which we can just call functions,\
    \ to a pool of native threads. To give you an idea how lightweight Goroutines\
    \ are, they require only 2KB of memory, compared to a native thread’s 1MB plus\
    \ a guard page, which is *500*× as much!\n\nBefore we dive into how these Goroutines\
    \ work, let’s take a look at an example of how you can use them.\n\nThe syntax\
    \ for creating Goroutines is quite simple: To invoke a function as you normally\
    \ do, you only need to add the token “go” before the invocation. For example,\
    \ take a look at the following code:\n\n**CODE LISTING 5.1** A naïve, single-threaded\
    \ program to square numbers\n\n![Image](p140.jpg)\n\nAs you can imagine, when\
    \ you compile and run this code, it prints out the number *4*. But what if `squareIt`\
    \ was really a long-running operation that you wanted to run in a separate Goroutine,\
    \ so the main function can continue doing whatever it needs to do while `squareIt`\
    \ runs? All you need to do is put “`go`” before `squareIt` in the main function:\n\
    \n![Image](p141-1.jpg)\n\nGreat! If you compile your program, you’ll notice there\
    \ are no errors. However, when you run the code, you’ll see that it prints . .\
    \ . nothing. (This is usually the case on most systems.) Why is that?\n\n(Even\
    \ if it did print something out, continue reading. You’ll see why in a moment.)\n\
    \nWell, think about it. When we ran the Goroutine, we put the execution of `squareIt`\
    \ into the “background,” which is another way of saying it’s “a separate Goroutine\
    \ from the one we’re currently on.” Then, right as we did that, the main function\
    \ ended. The `main` function is executing in the main Goroutine, which is executing\
    \ the main thread of the process this program is running in. When the `main` function\
    \ ends, the entire program exits—and that means the process exits before our other\
    \ Goroutine even had the chance to print out the squared number.\n\nThat means\
    \ we need to tell our main thread that it needs to *wait* before exiting, so the\
    \ other Goroutine has a chance to finish. This can be done quite simply by just\
    \ telling the main function to “sleep” (idle) for, say, just a single millisecond.\
    \ To do so, you first need to import the time package. Modify your imports to\
    \ the following:\n\n![Image](p141-2.jpg)\n\nAnd then add a call to the Sleep function\
    \ within your main function:\n\n![Image](p141-3.jpg)\n\nNow, if you compile and\
    \ run your program, you should notice it prints out *4* like usual! If it does\
    \ not, try to increase the time you sleep; your processor just might need a bit\
    \ more time to compute.\n\nAgain, you should keep one thing in mind: This is not\
    \ how we actually wait for Goroutines to finish in real-world scenarios. You should\
    \ really be using a feature known as *channels*, which we’ll get into in a bit.\n\
    \nThe idea behind Goroutines is almost genius in terms of efficiency. When a program\
    \ starts, Go only has a single Goroutine running, so there’s only a single native\
    \ thread running as well. Whenever you have multiple Goroutines running simultaneously,\
    \ Go will map each Goroutine to multiple threads. If it needs to launch more threads\
    \ to try and run Goroutines in parallel instead of just concurrently, it may decide\
    \ to do that. In this case, that means it will launch another thread when you\
    \ run `go` `squareIt(2)`.\n\nSo, for example, just like how the OS is able to\
    \ map multiple threads to CPU cores, the Go runtime is able to map multiple Goroutines\
    \ to native threads. And, by default, native threads can “move around” between\
    \ different CPU cores (e.g., core 1 was executing thread 1 a few moments ago,\
    \ but after a few context switches, core 2 is now executing thread 1). This can\
    \ be locked down with certain flags, telling the kernel to only run a thread on\
    \ a specific core. Similarly, you can tell Go “keep this Goroutine pinned to a\
    \ specific thread.” Again, take this with a grain of salt, given this is a kernel\
    \ feature—most kernels (Linux, BSD, XNU, etc.) support it, but some may not.\n\
    \nNow here’s the really interesting part: Let’s say that while Go is multiplexing\
    \ Goroutines on threads, and while it’s handling scheduling, a certain Goroutine\
    \ blocks these because it needs to execute a syscall (system call). These are\
    \ usually the slowest parts of your program. In this case, Go will *create a new\
    \ thread* and move Goroutines to that thread. This means that when executing a\
    \ long-  \n\nrunning operation that we don’t need to idle the CPU to wait for,\
    \ Go can keep other Goroutines running. Plus, that operation only requires storing\
    \ three registers, meaning it’s *super-lightweight* and your programs can run\
    \ *really fast*! When you compare that to the cost of switching between threads,\
    \ which require storing *every single register* (50+ registers on x86-64), you\
    \ can see why Goroutines are valuable.\n\nThere is one disadvantage to the very\
    \ lightweight nature of Goroutines, which Go has implicitly introduced a solution\
    \ to. The problem is that when you spawn a new Goroutine, you no longer have any\
    \ control over it from other Goroutines. For example, one Goroutine cannot “kill”\
    \ another one or “merge” with another one. Instead, a Goroutine can only “finish\
    \ executing” or “exit” once it returns (reaches the end of a function).\n\nThis\
    \ limitation also means that the function you invoke as a Goroutine cannot return\
    \ any values. You must instead use channels to share information.\n\nSpeaking\
    \ of which, you now have a good idea of how the world of Goroutines works. Now\
    \ let’s take a look at another integral component of using Goroutines for concurrency:\
    \ channels.\n\n### Channels\n\nWith channels, you have the ability to send data\
    \ to different Goroutines in a very high-performance manner. Plus, their syntax\
    \ is very simple to use, just as with Goroutines, resulting in code that doesn’t\
    \ get more complex because of communication between Goroutines.\n\nLet’s expand\
    \ our previous number squaring example to use channels for communication. Let’s\
    \ update the `squareIt` function to take two arguments, both being channels. One\
    \ channel is to let this function know what numbers it needs to square, and the\
    \ other channel is where the Goroutine will put the numbers once it has squared\
    \ them.\n\nHere’s the code for the `squareIt` function:\n\n![Image](p143.jpg)\n\
    \nBefore we take a look at the main function, let’s decipher the `squareIt` function\
    \ a bit more. As you can see, the type annotation for channels is unique in the\
    \ sense that it is comprised of *two tokens* (`chan` `int`) whereas most type\
    \ annotations are just a single token, `int`. However, the meaning of the annotation\
    \ isn’t ambiguous—we’re telling Go that we want a channel (`chan`), and the data\
    \ within that channel is of type `int`. You could store any data type, including\
    \ pointers and custom structures, within a channel."
