    replace the reference types with value types:


    ![Image](p56.jpg)


    ![Image](p57.jpg)


    Now, let’s see if our types conform properly.


    `Dog` and `Person` unfortunately still don’t conform to `Living`, because they
    only implement `getAge` and not `incrementAge`. However `*Dog` and `*Person` now
    *also* don’t conform, because they only implement `incrementAge` and not `getAge`.
    Now you can see why this is a problem. No type in this code currently conforms
    to `Living`!


    Therefore, our interface becomes essentially useless.


    There are definitely better ways Go could handle these situations, but for now,
    if even one function in an `interface` requires a pointer receiver, *all* your
    functions will need a pointer receiver.


    ### Errors


    Go has a somewhat unique way of handling errors. In most popular languages, a
    function can “throw” an error and the caller can “catch” the error. This approach
    is still possible in Go, but it’s uncommon and not encouraged. Rather, in Go you’re
    encouraged to return a type called `error`.


    `error` is an interface that only expects the underlying type to implement a single
    function. This function is called `Error`, takes no arguments, and returns the
    error it represents as a human-readable string. The definition for the `error`
    interface is as follows:


    ![Image](p58.jpg)


    You can create your own error types very easily! The following is a simple implementation
    of an error:


    ![Image](p59.jpg)


    The `errorString` structure now conforms to the `error` interface, and a function
    that you define could return this as an `error`. However, you may ask, what’s
    the point of an interface in the first place? Why not just make `error` a structure
    instead, and that way, your function can just store the `error` as a string directly?


    Well, the answer is simple: Errors are complex. Let’s say you get an error from
    a function that’s meant to make a request to an HTTP endpoint. The error could
    occur at multiple points, and you may have not been able to *send* the request
    because of a firewall or lack of an internet connection. Maybe the response code
    was 500 (Internal Server Error), so it was the server’s fault!


    So, instead of simplifying what counts as an `error` to just a string, Go makes
    it so you can define your own `error` structures to contain custom error information.
    Then, because you’re forced to implement the `Error()` function to return a human-readable
    string, you can still print out any runtime errors to debug them. These strings
    can be assembled based off of the other content of the structure—such as, in the
    HTTP example, a response code.


    This unorthodox approach to error handling leads to somewhat inelegant code, but
    usually reduces the chance of a crash due to an unhandled error. To see how, let’s
    go over an example of using `error` in a function.


    When it comes to defining new kinds of simple errors, the standard in Go is to
    define them as global variables. This allows code from outside the package to
    see, check, and deal with the error that was returned more effectively.


    In the following example, we use the `errors` package to help us create the `DivisionByZero`
    error. We then define a `Divide` function, and if this function is asked to divide
    a number by zero, it returns our custom error.


    Right now, you don’t need to worry about the second line of code that deals with
    importing the errors module. You’ll learn more about modules and how they work
    in the next chapter. For now, all you need to know is that it affords us the functionality
    to define our own simple errors.


    **CODE LISTING 2.28** A simple DivisionByZero error


    ![Image](p60.jpg)


    You should see the following output:


    ```

    +1.000000e+000

    ```


    ```

    +0.000000e+000

    ```


    ```

    division by zero

    ```


    As you can see, the first division goes through properly, but the second one returns
    an error!


    Now, there are still times where the program crashes due to something unexpected
    happening, and these types of error are usually handled with a try/catch block.
    For any crash that happens in the block, the program will catch it and try to
    handle the error. So, while Go supports this feature, it’s not implemented the
    same way it is in other languages, such as Java and C++.


    For any unexpected error, Go will throw a *panic*, which kills the program. In
    fact, some packages can also throw a panic if they encounter unexpected behavior.
    Alongside panics, Go has another concept called *recover*. This function will
    catch any panic that either a package or the language throws.


    The dance between the function stack, panic, and recover goes something like this:
    The function that throws a panic will immediately return but will run its defer
    operation beforehand if there is one. Then, the caller function will *also* immediately
    return to its caller, and so on until you hit the root of the call stack (which
    is the program invocation). Each return will execute the defer for its corresponding
    function if there is one. In any of the defer blocks, you are allowed to stop
    the loop of function returns by calling the recover function and doing something
    with the error that came from the top of the call stack. If, however, you reach
    the root of the call stack and you haven’t run a recover, the program will crash,
    and Go will print out the error for you.


    To understand this a bit better, take a look at the following code:


    **CODE LISTING 2.29** The behavior of panic: single function call


    ![Image](p61.jpg)


    ![Image](p62.jpg)


    In the `testRecover` function, the first thing we do is define a defer function
    that simply runs the recover function, and checks if the return value is not nil.
    If so, then we know we got a panic, and we can print that out. Otherwise, there
    was no error, and this defer is just being called before a normal function return.
    Because we have called the recover function, the panic was handled, and the panic
    will not propagate to the caller of `testRecover`, which is `main`.


    If you run the code as is, you should see:


    ```

    got an error!

    ```


    If you were to comment out the panic, you’d notice the code prints:


    ```

    Hello!

    ```


    ```

    no error

    ```


    Now, let’s say you refactor the code to the following:


    **CODE LISTING 2.30** The behavior of panic: two function calls deep


    ![Image](p63.jpg)


    In this case, the panic is not being handled within `testPanic`, so it propagates
    to `testRecover`, which is forced to immediately return without printing. It does,
    however, run its defer, which runs recover, which prevents the panic from propagating
    to `main`, which happens to be the root of the call stack. This means that the
    program will not crash.


    All in all, after the panic & recover dance, the output of the program is the
    following:


    ```

    got an error!

    ```


    With that, you’ve learned about all the basic syntax that will help you on your
    Go programming journey. Next, in [Chapter 3](#ch3.xhtml), let’s learn some more
    advanced concepts by building some applications, such as a pathfinder and an implementation
    of the Game of Life!


    Exercises


