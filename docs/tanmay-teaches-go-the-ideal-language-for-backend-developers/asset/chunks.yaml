    ```

    if _, ok := visited[key]; dis == INFINITY || ok {

    ```


    This line of code tries to query the “visited” dictionary with the key that we
    got from the distances dictionary. When the dictionary returns its two response
    values, we ignore the first one, which is the actual value, and we instead only
    focus on the second response from the dictionary. This second response tells us
    whether or not that key even exists in the dictionary. If the key does exist,
    this node was visited (regardless of its value in the dictionary), and we skip
    this iteration of the loop. We also skip this iteration if we know that the cost
    of this node is infinite, meaning it hasn’t been calculated or set yet.


    Now, we can finally focus on the first function, which is where the real fun is.
    It’s implemented as a pointer receiver on the Graph structure. This is because
    we may need to modify the graph itself within this function.


    Let’s recap, section by section, what the function does:


    ![Image](p86.jpg)


    This first section starts by creating the cost and parent (`dist` and `prev`)
    dictionaries and initializes them in the way that was described at the beginning
    of the chapter. The costs are all infinite and the parents are all nil. (In this
    case, nil is represented as an empty string, because the value is not a pointer.)
    We also create the dictionary that represents whether or not a node has been visited,
    and we set the distance, which is the cost, for the source node to 0.


    ![Image](p87.jpg)


    This section of the code has one simple responsibility: start a `for` loop with
    the variable `u` that starts with the source string, and then loops until the
    `u` variable is equal to an empty string. After every iteration, call the `getClosestNonVisitedNode`
    function, pass it the dictionaries it needs, and store the result in `u`. The
    logic behind this line is that when this function returns an empty string, we’ve
    already visited all the nodes and can stop the loop.


    After we start the loop itself, we simply query the cost and distance dictionary
    for the node that we’re on and store that distance in `uDist`.


    ![Image](p88.jpg)


    This entire section is essentially just responsible for going through the link
    this node has outbound, and running the Dijkstra iteration we talked about earlier.
    It starts by checking if this node has already been visited, in which case we
    refrain from running the iteration.


    If the node has not been visited, then we do run the iteration, which consists
    of calculating a new proposed cost for this node, checking if the proposed cost
    is lower than the previously calculated cost, and if so, updating the node’s parent
    and cost values.


    After running the iterations, we also make sure to jot down that we just visited
    the node stored in `u`, so that we don’t run the iteration on this node again.


    After that section, only one task remains! We need to return the cost and parent
    dictionaries, so the caller of the function can run the actual pathfinding if
    they need it:


    ```

    return dist, prev

    ```


    Just before we start using this code, we’ll define a short helper function that
    prints out the values from these dictionaries in a pretty way:


    ![Image](p89.jpg)


    You don’t really need to worry about how this function works, but on a high level,
    the inputs are the two dictionaries from the Dijkstra function, and the output
    is a string that represents a pretty, tabular version of the dictionaries.


    This function works by creating a new `Buffer` of bytes, which will eventually
    be converted to our string. We use a module called `tabwriter` to make this a
    lot easier for us. We call `NewWriter` on `tabwriter` to get a new instance of
    a `writer`, with a minimum width of 1, a tab width of 5, and padding of 2 characters:
    the padding character being a space, and no special flags. We then write the header
    row, followed by each key in the `dist` (cost) dictionary, as well as its value,
    and then its parent from the `prev` dictionary.


    We then call `Flush()` on `writer` (telling it to move whatever changes are cached
    to the actual buffer), then we convert the buffer to a string and return that
    string from the function.


    Now, let’s see how we can use these dictionaries to run pathfinding on a real
    graph. Let’s say we’re working on the graph from earlier, in [Figure 4.3](#ch4.xhtml#fig4_3).


    ![Image](Tanmay_0403.jpg)


    **FIGURE 4.3** The sample graph to use for Dijkstra pathfinding


    Now let’s write a main function for this program. The main function will simply
    re-create the preceding graph within the structures we defined at the beginning
    of our code, and then run Dijkstra from a certain source node.


