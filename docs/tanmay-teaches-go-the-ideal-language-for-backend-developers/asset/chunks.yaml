    \ nothing because it modifies the original structure it was passed a pointer to.\n\
    \nWithin the function, we count all the “alive” neighbors for each cell in the\
    \ game board, and we then loop through every Y index in the game board. We subscript\
    \ the board at every iteration to get that row, and loop through every column\
    \ in that row. If the cell is alive and the neighbor count is 2 or 3, we keep\
    \ the cell as it is. Or else, if the neighbor count is 3, we turn the cell alive.\
    \ Once again, if none of the previous conditions evaluated to true, we turn the\
    \ cell dead.\n\nWhenever we change the cell’s living status to alive or dead,\
    \ also make the necessary change in the pixels.\n\nFinally, let’s tie all of this\
    \ together into a main function that creates a canvas on which to render pixels,\
    \ creates the Game of Life, runs the iterations, and updates the canvas. The iterations\
    \ of the Game of Life will end and the program will exit once the window is closed.\n\
    \n![Image](p105.jpg)\n\nYour code should now look like this:\n\n**CODE LISTING\
    \ 4.2** “Conway’s Game of Life” application\n\n![Image](p106.jpg)\n\n![Image](p107.jpg)\n\
    \n![Image](p108.jpg)\n\n![Image](p109.jpg)\n\nWhen you run the program, you should\
    \ see a window like [Figure 4.6](#ch4.xhtml#fig4_6), where the Game of Life is\
    \ chaotically killing and birthing (giving birth to) new cells!\n\n![Image](Tanmay_0406.jpg)\n\
    \n**FIGURE 4.6** A snapshot of the Game of Life application in action\n\nThat’s\
    \ amazing! You’ve not only built a real application in Go, you’ve built an entire\
    \ GUI for it as well! Now, we’re sorry, but we want you to build another application\
    \ *without* a user interface. Don’t worry—it’s still going to be fun—we’ll implement\
    \ a building block of one of the most hyped technologies in the world: Blockchain!\n\
    \n### Proof of Work\n\nThe name and logic for this example app sound scarier than\
    \ they actually are—the basic idea is actually pretty simple! We’re essentially\
    \ trying to brute force a value that’s mathematically impossible to compute otherwise.\n\
    \nIn fact, the code for this application is about 20 lines—it’s not much, but\
    \ you’ll see why this is a specifically important example in the very next chapter,\
    \ [Chapter 5](#ch5.xhtml)!\n\nWe must start this example with a bit more fundamental\
    \ understanding. There exists a class of functions known as “cryptographic hashing\
    \ functions.” The idea behind these functions is that they can map an arbitrary\
    \ sequence of bytes to a known size. A very small perturbation in the input can\
    \ cause a drastic change in the output. And, because the output is of fixed size,\
    \ and the input can be infinitely large, there is an infinite number of inputs\
    \ that can map to a certain output.\n\nWhen you have two separate inputs that\
    \ map to the same output through a hashing function, it’s known as a “hash collision.”\
    \ These can be issues for some systems. However, because of the sheer number of\
    \ possible outputs, which we’ll get into in a moment, the chances of this ever\
    \ happening are so low that they’re essentially negligible, so we basically ignore\
    \ them.\n\nOne of the most popular hashing functions is “SHA256”. It outputs a\
    \ hash that’s 256 bits (32 bytes) long. To give you an idea of what we mean by\
    \ “a small change in the input can drastically affect the output,” here’s the\
    \ hex representation of the SHA256 hash for “Tanmay Bakshi”:\n\n```\n0x315920ffce53870d99f349ed8cebaab5c30f8efcc2f6ff835fe594e2539\n\
    \ 28b54\n```\n\nNow, the following is the hash for “Tbnmay Bakshi”. Only one character\
    \ changed, and even that only from an “a” to a “b,” just a single value.\n\n```\n\
    0x6d3d44c306e9367484621e6639171226fc3b2daff31a8e60efb06168f2e\n 7904f\n```\n\n\
    As you can see, it’s not even remotely similar! It’s essentially impossible to\
    \ crack these hashes—it would take many decades worth of intense computing power—say,\
    \ at a top-10 supercomputer level—just to make a dent in solving the problem,\
    \ and by the time your descendants do figure out the solution, the data the hash\
    \ is protecting will have lost its value.\n\nHowever, there is a specific technology\
    \ that found a very clever way to use this attribute of hashing functions: blockchain.\
    \ Within blockchain, the goal is to verify the authenticity of a “block” of transactions\
    \ in order to determine how much of a currency any specific wallet address has.\
    \ We can verify a block’s authenticity by determining how much “work” was put\
    \ into trying to legitimize it.\n\nFor example, take the following string:\n\n\
    ```\n\"Tanmay Bakshi + Baheer Kamal\"\n```\n\nIt’s a pretty standard string, and\
    \ the SHA256 hash for it looks like this in hex:\n\n```\n0x9D2BE96E68D9432AB2D883C51C2CD872DCACA6CA1495EF8A4E8865A9CCA\n\
    \ 7FBA9\n```\n\nNow, imagine we wanted to append a certain sequence of bytes to\
    \ the end of this string, such that the first few bytes of the output are all\
    \ zeros. Of course, that would take an incredible amount of work, but it is possible.\
    \ For example, when you find the hash for the following string:\n\n```\n\"Tanmay\
    \ Bakshi + Baheer KamalEHjjDodhxmxORke8hv0t\"\n```\n\nYou get this in hex format:\n\
    \n```\n0x00000096408c134fb028dd260ce9e682e3524538442f34c874b4a4e7267\n 997d2\n\
    ```\n\nWow! Just by appending that magic sequence, we were able to find a hash\
    \ value that met our conditions! In fact, finding these many zeros took only around\
    \ 13 million tries of random strings, and Go could do this in under 3 seconds,\
    \ meaning it processed about 4 million random hashes per second."
