    You may be wondering: Why does Go work this way? Really, from a technical and
    efficiency perspective, this just makes sense. For example, look at the following
    Swift code. I’m sure this code is simple enough to make sense without deep Swift
    knowledge, but we will explain it in detail to help you understand the Go syntax
    better.


    ![Image](p16.jpg)


    Of course, this code will print each name followed by a new line. However, you
    didn’t need to create a counter to store *which* element you were on, did you?


    So, if you’d like a counter, there are two ways to do it. There’s the standard,
    generally accepted way, which uses the “enumerated” method:


    ![Image](p17.jpg)


    And there’s the less pretty, non-standard way, which is to use a counter that
    you manually define and increment:


    ![Image](p18.jpg)


    ![Image](p19.jpg)


    Both of these methods involve some kind of overhead. The official method involves
    a new call to the enumerated method in the Collection protocol, which of course,
    isn’t terribly efficient.


    Now, you’re likely wondering: Isn’t the second method super-efficient? *No!* It’s
    not as efficient as you can get it to be. That’s because you now have *two counters*
    in your code.


    I know what you’re saying: “But we’re only incrementing one counter!” Well, here’s
    the thing: The compiler is incrementing another counter for you. This counter
    is internal and is in the generated machine code. This is important because the
    compiler needs to know the offset from the buffer pointer to know which element
    we’re on.


    So, while the offset variable can be *hidden* from the programmer, it can’t be
    removed altogether. Therefore, Go made the decision to just *allow the programmer
    to access the offset counter that it already has*. This makes it so you don’t
    need yet another counter, which is an extra inefficiency.


    However, there are some cases, quite a few in fact, where you just really don’t
    care about the index, and you only care about the value. In those circumstances,
    even though Go can detect that automatically, it’s still considered good practice
    to tell Go that you don’t need it. This helps other programmers read your code
    more naturally and even helps the Go optimizer a bit.


    Here’s how you can loop through an array while ignoring the index:


    **CODE LISTING 2.8** Ignoring the index in a for-in loop


    ![Image](p20.jpg)


    The underscore in the `for-in` loop has the effect of telling Go: “I don’t care
    about whatever value this resolves to, and don’t let me use it.” Now, if you run
    it, you should just see the names printed, like so:


    ```

    Tanmay Bakshi

    ```


    ```

    Baheer Kamal

    ```


    ```

    Kathy

    ```


    Now that we’ve discussed `for-in` loops, let’s discuss an absolute classic: the
    C-style `for` loop!


    This blast from the past consists of three main parts, which are made more flexible
    in Go: an expression that creates a new iterator variable, an expression that
    resolves to a Boolean to see if the loop needs to end, and lastly, an expression
    that increments the counter between loop iterations. Here’s how you can use one
    of these loops in Go:


    **CODE LISTING 2.9** Using C-style for loops


    ![Image](p21.jpg)


    This code will print out 0 through 4 like this:


    ```

    0

    ```


    ```

    1

    ```


    ```

    2

    ```


    ```

    3

    ```


    ```

    4

    ```


    However, here’s what’s interesting about this `for` loop. It can emulate a `while`
    loop by using the following syntax:


    **CODE LISTING 2.10** Emulating while loops using for loops


    ![Image](p22.jpg)


    By completely neglecting to provide the first and last expressions to the `for`
    loop, it only ends up checking the condition you specify in the middle, and thus
    becomes, for all intents and purposes, a `while` loop. This code will print the
    following:


    ```

    1024

    ```


    There is technically *one* more use of a `for` loop, and that is for *channels*.
    Channels are a very unique feature of Go, but we need to cover a few more basics
    before getting there. Onward and upward!


