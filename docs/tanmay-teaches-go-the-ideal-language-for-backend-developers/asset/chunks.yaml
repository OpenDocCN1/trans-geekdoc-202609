- fmt: "\nOn different platforms, these libraries are referred to with different file\
    \ formats. On Linux, it’s `.so` (Shared Object); on macOS, it’s `.dylib` (Dynamic\
    \ Library); and on Windows, it’s `.dll` (Dynamically Linked Library). They all\
    \ have the same basic purpose. Some systems handle these more or less elegantly\
    \ than others—thus, the occasional “DLL Hell” situation on Windows.\n\nThe knowledge\
    \ of shared libraries brings us to the way we can share code across programming\
    \ languages. Because AOT-compiled languages translate their high-level code to\
    \ the same basic format of machine code—even shared libraries—we can just compile\
    \ some arbitrary code to a shared library. Then, from another programming language,\
    \ we can take the compiled code and link it against the aforementioned library,\
    \ enabling us to call the code from that other language.\n\nAs you can likely\
    \ tell, there are limitations with this technique. Mainly, what if the language\
    \ we want to call is interpreted or JIT-compiled? Well, this definitely introduces\
    \ a couple of challenges, but in that case the solution varies case by case. For\
    \ Python, you can link against the interpreter’s shared library, and interpret\
    \ the Python program manually. With Java, you have a similar capability.\n\nIn\
    \ this chapter, we won’t explore calling interpreted languages. Instead, we’ll\
    \ deal with AOT-compiled languages only. However, there is one more limitation,\
    \ and it’s one you may have missed if you’re not familiar with the internal operation\
    \ of the Go compiler. This limitation is that not every AOT-compiled language\
    \ follows the same format of machine code!\n\nWell, from the operating system’s\
    \ perspective, “in theory,” yes, each executable follows the same format, regardless\
    \ of the language it was compiled from. However, in practice, each language usually\
    \ adds its own set of tricks to its binaries to get them to achieve some kind\
    \ of special behavior. This added code is called the language’s “runtime,” and\
    \ usually, the more “runtime” the language has, the more annoying it is to call\
    \ its code from other languages, and vice versa.\n\nThis is because the code the\
    \ compiler ends up outputting isn’t exactly the code you programmed in. You see,\
    \ that compiled machine code was built with certain assumptions in mind—assumptions\
    \ that only hold up if the compiled code is called from other code compiled with\
    \ the same compiler. Think about Swift, for example. When you pass a reference\
    \ to a class, Swift’s ARC increments a reference counter to ensure that it can\
    \ keep track of when memory needs to be freed. If you pass that reference as a\
    \ pointer to some C code, the C code doesn’t own the pointer and can’t ever be\
    \ sure that that memory is really safe to access or mutate.\n\nAnd, as we’ve already\
    \ established in the previous chapters, Go has a very big runtime, much larger\
    \ than that of C, Swift, or Rust. This is because Go needs to deal with Goroutines,\
    \ and all the baggage they add to the fray. So, when you compile a Go program\
    \ to assembly, you can see that the `main` function you define isn’t even the\
    \ entry point of the program. The entry point of a Go program is actually inside\
    \ a shared library linked against it, which contains the majority of the backend\
    \ of the Go runtime. That shared library then initializes the runtime, gets some\
    \ internals ready and set up, and then calls your `main` function. When the program\
    \ exits, it also of course does so through this library.\n\nTherefore, you cannot\
    \ just “link the Go program against a shared library and call those functions.”\
    \ Calling out to a shared library in Go actually incurs a relatively large performance\
    \ penalty, at least when compared to other languages. This penalty can almost\
    \ always be nullified by using the `gccgo` compiler instead of `gc`.\n\nDespite\
    \ the penalty, it’s usually worth it to call code from other languages, especially\
    \ when another language can do a certain task fundamentally better than Go but\
    \ you’d like to access the result of the computation from your Go code.\n\nTo\
    \ demonstrate this kind of situation, in this chapter we’ll explore multiple tasks\
    \ and ways of interoperating between Go and other AOT-compiled programming languages.\n\
    \n### Interoperating with C Code\n\nLet’s start with a simple “Hello, World!”\
    \ example of calling C code from Go. First, let’s see what the pure C version\
    \ of this application would look like:\n\n**CODE LISTING 6.1** A simple “Hello\
    \ World” application in C\n\n![Image](p173.jpg)\n\nThe only essential lines are\
    \ lines 1 and 3. These lines tell the compiler to:\n\n**1.** Take the `stdio.h`\
    \ file from the OS and paste its contents into the binary.\n\n**a.** This `stdio.h`\
    \ file contains the declarations.\n\n**2.** This means we need to include the\
    \ `stdio.h` header:\n\n```c\n#include <stdio.h>\n\nint main() {\n    printf(\"\
    Hello, World!\\n\");\n    return 0;\n}\n```\n\nIn order to use cgo, all you need\
    \ to do is import the `C` package like so, with all the C code you’d like to run\
    \ as comments before the import:\n\n```go\npackage main\n\n/*\n#include <stdio.h>\n\
    \nvoid helloWorld() {\n    printf(\"Hello, World!\\n\");\n}\n*/\nimport \"C\"\n\
    \nfunc main() {\n    C.helloWorld()\n}\n```\n\nThis will make Go import the C\
    \ module, then it’ll look at the comments that came before it, and treat that\
    \ as C code that it needs to compile into the Go executable.\n\nNow, in order\
    \ to call that C function, you can simply treat it as any other function in the\
    \ C module:\n\n**CODE LISTING 6.3** Calling the C “Hello World” function from\
    \ Go\n\n![Image](p175.2)\n\nIf you were to compile and run that code, you should\
    \ get an executable that prints hello world via C instead of Go.\n\nNow that you\
    \ understand how to call very simple C code from Go without needing a library,\
    \ let’s explore a slightly more complex example. Specifically, what if you want\
    \ to pass variables to C or use the return values from the functions?\n\nOur first\
    \ hurdle is the translation of types from C to Go, and vice versa. The cgo module\
    \ contains a bunch of types, such as `C.int` (32-bit signed integer), `C.uint`\
    \ (32-bit unsigned integer), `C.long` (64-bit signed integer), and more.\n"
