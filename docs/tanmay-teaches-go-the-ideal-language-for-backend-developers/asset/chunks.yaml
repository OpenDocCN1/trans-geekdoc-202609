    在这种情况下，我们要求函数寻找 24 个连续的起始 0 位。你可以将该字符串替换为任何喜欢的字符串，还可以告诉它寻找你想要的任何数量的 0！但请记住，随着要求的哈希值开头的
    0 位数量越来越多，任务会变得越来越困难——这种难度不是线性的，因此每增加增加位，增加的难度都比前一个增加的更大。


    如果你直接运行这段代码，因为它本身已经经过了很好的优化，你得到的输出可能像这样：


    ```

    Tanmay Bakshi + Baheer KamalEHjjDodhxmxORke8hv0t

    ```


    ```

    time: 2.7946521730000002

    ```


    ```

    processed 12,814,971

    ```


    ```

    processed/sec: 4,585,533

    ```


    每秒获得 450 万次哈希计算似乎很了不起，但在计算世界中，这些只是菜鸟水平。当我们在 CPU 上达到每秒 3000 万次时，应该感到惊叹。或者在 GPU
    上达到每秒 *80 亿* 次！在让这段代码运行得更快方面，天空才是极限。


    一种直接的潜在加速方法是使用并发，让我们有多个进程同时查看随机字符串。然而，你必须阅读第 5 章来学习相关内容！


    现在你已经学习了如何在 Go 中实现一些常见的算法和技术，让我们提升这段代码的境界吧！我们将使用一种真正让 Go 脱颖而出的语言特性——Goroutines（协程），并学习如何优化我们的代码使其运行得更快！每当你突破一个新的优化和速度屏颈时，你都会学到足够的新知识，让你感觉自己变成了一个更出色的程序员！


    ## 练习题


    1. **在本章的示例中，我们在哪些实例中特意优化了代码使其运行得更快？**

    2. **旨在用于图论的 Dijkstra 算法如何被转而运之运行在“地图”（例如迷宫）上？**

    3. **哪个运算符用于位运算：NOT、OR、AND 还是 XOR？编写一个程序来测试这些运算符的行为。**

    4. **计算机能生成真正的随机数吗？为什么能或为什么不能？**

    5. **通过不拷贝变量可以避免哪种昂贵的操作？**

    6. **在 Dijkstra 路径查找算法的代码片段 4.1 中，尝试将从 B 到 D 的代价从 1 改为 10。你预测新的输出会是什么？它与程序计算的结果相符吗？**

    7. **任何两个数据遇到 SHA256 哈希冲突的概率有多大？**


    ## 第 5 章


    ## 并发


    欢迎来到第 5 章！你在学习 Go 的旅程中已经取得了很大进展，现在已经达到了可以熟练用 Go 实现简单和中等复杂应用的水平。然而，要真正精通 Go 并释放它的全部潜力，你需要熟悉现代计算的一个基石：并发。通过让计算机同时做多件事——或者通过在多个执行流之间切换——你可以运行过去的计算机永远无法完成的任务。


    完成本章后，你将能够回答以下问题：


    * 什么是线程和进程？

    * 并发（concurrency）和并行（parallelism）之间的区别是什么？

    * 绿线程（green threads）和用户空间线程是如何工作的？

    * 为什么 Goroutines 比使用线程更好？什么时候不应该使用它们？

    * 如何通过通道（channels）在不同的 Goroutine 之间进行通信？

    * Goroutine 如何同时等待来自多个源的输入？


    ### 并发、线程与并行


    并发是现代计算的基础；它允许计算机同时执行独立的指令流，从而实现多个应用程序同时运行等功能。


    想象一下，如果你的计算机一次只能做一件事。那将是极大的限制！我们甚至不会有图形界面的技术支持。相反，我们对所有事情都只能使用命令行界面。


    在某些系统中，并发简单意味着 CPU 将在非常短的时间内从运行一个进程的指令切换到另一个进程，这在我们人类看来，就像是多件事在同时发生。


    然而，这种技术也有其局限性。如果你试图运行多个需要大量计算时间的进程，而且它们都必须同时运行，那么 CPU 将花费大量时间运行这些进程。这是因为 CPU 不仅需要对每个进程进行计算，还需要在进程之间保持切换，这本身就会消耗一些计算能力。


    这就是为什么现代 CPU 拥有“核心”的原因。CPU 拥的核心越多，它本质上就能同时执行越多的独立执行流。这意味着当一个进程的指令在一个“核心”上执行时，另一个完全不同的可以在同一个“时钟周期”内在另一个“核心”上运行它的指令。


    现在，当新旧结合时，这种技术的真正价值开始体现。想象拥有多个物理核心，能够同时运行多个不同的进程，并且让它们在进程之间非常快速地切换，这样我们就可以构建诸如
    GUI 这种设计上就需要并发的系统！这就是现代计算系统的架构方式——从 CPU 到操作系统，甚至到编程语言。


    我们现在知道，单个 CPU 和操作系统实例可以同时运行多个（意味着成千上万）不同的进程。但是，如果一个独立进程需要同时运行它自己的多个执行流呢？例如，假设你有一个网络浏览器，并打开了多个标签页。从技术上讲，浏览器是一个进程，但有多个标签页都在运行它们自己的代码。这就是线程大显用场的地方。线程是进程的轻量级部分，拥有自己的“栈指针”和寄存器。一个进程可以产生数百个线程，操作系统会像处理其他进程一样将这些线程映射到
    CPU 上。


    需要注意的是：我们提供的浏览器类比并不是一成不变的，也有少数例外。例如，在 Google Chrome 浏览器中，每个标签页都获得自己的完整进程，这使得 Chrome
    更容易达到性能基准，但它非常消耗资源。这就是为什么 Chrome 在笔记本电脑上消耗的电池电和内存比 Safari 和 Firefox 等浏览器多出几个数量级，而它们目前使用的是线程。


    你现在可能在想：“这听起来太好了！我们可以运行成千上万个线程和进程，操作系统会为我们处理这一切？哇！”遗憾的是，当某件事听起来好得不可谱时，通常确实如此。扩展线程具有非常的限制。


    你看，线程与完整的进程相比虽然是轻量级的，但启动和合并它们仍然非常昂贵。这需要整个系统调用以及与内核的交互。这意味着在需要成千上万线程的情况下，通常只启动几十或几百，然后让每个线程执行多个任务会更高效。


    这就是为什么对于今天大多数软件，实际上有两种线程：原生线程（我们已经讨论过的类型，在内核层级处理）和绿线程（我们稍后会讨论，它们在用户层级处理）。


