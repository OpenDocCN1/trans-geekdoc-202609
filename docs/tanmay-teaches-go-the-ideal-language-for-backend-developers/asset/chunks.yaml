    ## CHAPTER 4: Using Built-in Packages


    Welcome to [Chapter 4](#ch4.xhtml)! Now that you’ve been introduced to the basic
    building blocks of the Go programming language and how you can use packages and
    modules, it’s time to learn some additional features and capabilities of the language.
    We’ll do this by building applications powered by some common data structures
    and algorithms you’ll likely use in your own apps.


    Once you’ve finished this chapter, you’ll be able to answer the following questions:


    • What is the Dijkstra pathfinding algorithm and how does it work?

    • How can you implement Dijkstra to search through a graph in Go?

    • What is Conway’s Game of Life and how does it work?

    • How can you implement graphical user interfaces in Go?

    • Why is generating random numbers a difficult task and how can you build your
    own pseudorandom number generator in Go?


    ### Common Data Structures and Algorithms


    Specifically, we’ll take a look at a couple of famous algorithms that can teach
    us a lot about transforming pseudocode and logic into Go code. These two examples
    are:


