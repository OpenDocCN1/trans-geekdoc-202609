    All we need to do now is run a normal Dijkstra’s algorithm iteration. We start
    by looking at the costs of all the nodes and finding the node with the smallest
    cost. Because all of them apart from `B` are infinite, of course, `B` is the node
    with the lowest cost.


    Then, we query the graph to find out what the neighbors of that node are, and
    what their costs are. We see that the neighbors in this specific graph are nodes
    `C` and `D`.


    And yes, technically, `B` shares a connection with `A`, but that’s a connection
    FROM `A` to `B`, so we can’t move from `B` to `A`, and that connection is therefore
    invalid for this logic.


    We start with node `C` (the order does not matter in this case). We check, is
    the cost of `B` PLUS the cost it would take to travel to `C` lower than the cost
    of `C` itself? In this case, that means: “Is `0 + 4` less than infinity?” Of course,
    this resolves to true. Therefore, we set the cost of `C` to `4` (because `0 +
    4 = 4`), and we set the parent of `C` to `B`.


    We do something similar with node `D`. Because the cost was previously infinity,
    the new cost of `0` (`B`’s cost) plus `5` (the cost of moving from `B` to `D`)
    is lower—because any finite number is lower than infinity. So we set the cost
    to `5` and set the parent to `B`.


    There we go! We’ve iterated through the movements you could make from `B`. Let’s
    run the iteration again. [Table 4.3](#ch4.xhtml#tab4_3) is what our dictionaries
    look like at the moment.


    **TABLE 4.3** Dijkstra Pathfinding State After Updating C and D Nodes’ Costs and
    Parents


    ![Image](t4.3.jpg)


    Looking at the table, we find that `C` currently has the lowest cost. So, let’s
    see what outbound connections `C` has. We see that `C` can move to `A` and `D`.
    Let’s start with determining its relationship with `A`.


    Node `A` currently has a cost of infinity, so regardless of the cost of `C` +
    (`C` ![Image](arrow.jpg)`A`), it will be lower. In this case, that resolves to
    `10`, because `C` is `4`, and the connection cost is `6`. Therefore, we set the
    cost of `A` to `10` and the parent to `C`.


    Then, we look at `D`. `D` already has a cost of `5`. `C` has a cost of `4`, as
    we’ve seen, and the connection between `C` and `D` has a cost of `2`. So, `4 +
    2 = 6`, which means that the connection between `C` and `D` would be more expensive
    than the connection that `D` already has, which is from `B`. Therefore, we don’t
    modify `D`’s values in the dictionaries at all.


    [Table 4.4](#ch4.xhtml#tab4_4) is the current state of our dictionaries.


    **TABLE 4.4** Dijkstra Pathfinding State After Updating Node A’s Cost and Parent


    ![Image](t4.4.jpg)


    But we’re not done yet! Remember that, so far, we’ve run the algorithm’s iteration
    on nodes `B` and `C`. So, if we look for the node with the lowest cost in the
    table that we have *not* yet iterated on, we see that node is `D`. Let’s go ahead
    and run an iteration on `D`.


    `D` can connect only to `A`. Let’s try and determine a new cost for `A` if we
    were to switch its parent to `D`. `D`’s cost is `5`, and the cost of its connection
    to `A` is only `1`. `5 + 1 = 6`, which is *lower* than the cost for `A` that’s
    already in the table, which is `10`. Therefore, we change `A`’s cost from `10`
    to `6` and `A`’s parent from `C` to `D`.


    After this update, our dictionaries look like [Table 4.5](#ch4.xhtml#tab4_5).


    **TABLE 4.5** Dijkstra Pathfinding State After Updating Node A’s Cost and Parent


    ![Image](t4.5.jpg)


    All right, the only node left is `A`. Let’s try running an iteration on it. `A`
    connects to both `B` and `C`.


    Should we replace `B`’s cost and parent? Intuitively, we know the answer is no
    because `B` is the source node, it makes no sense to make `A` its parent. However,
    we can also prove this with the algorithm, because no matter what the cost is
    for the connection between `A` and `B`, we will never replace `B`’s parent, because
    `B`’s cost is already as low as we can get it: zero. So, let’s leave `B` alone.


    What about `C`? `A`’s cost is already `6`, plus the connection from `A` ![Image](arrow.jpg)`C`,
    which is `9`. That adds up to `15`. `15` is greater than the existing cost of
    `4`, therefore we leave `C` alone as well. This means the pathfinding state doesn’t
    change; it remains the same as in [Table 4.5](#ch4.xhtml#tab4_5).


    Now, finally, how in the world does this tell us how to move from `B` to any other
    node? The answer is hidden in plain sight in this table. What Dijkstra did is
    it created ANOTHER graph where we know what the cheapest preceding node is to
    come in from for every node, considering you originate at a certain source.


    For example, let’s say you want to go from `B` to `A`. Let’s look at the table.
    What’s the parent for node `A`? It’s node `D`. What’s the parent for node `D`?
    It’s node `B`. But hey! Node `B` is our origin—so we can stop our loop.


    This means `B` ![Image](arrow.jpg)`D` ![Image](arrow.jpg)`A` is the most efficient
    way to get from `B` ![Image](arrow.jpg)`A`.


    Once this algorithm clicks in your head, the code makes a *lot* more sense. Otherwise,
    the abstraction layer created by the code makes it more difficult to really understand
    why this table of the most efficient path to any node emerges.


    Now let’s code this in Go! Before we touch any real code, let’s take a look at
    some pseudocode for Dijkstra’s algorithm:


    ![Image](p80.jpg)


    As you can see, the pseudocode is quite similar to the process we described earlier.


    When it comes to implementing this algorithm in Go, there are various different
    ways of doing so. We’ll stick to the method that stays true to the logic we introduced
    you to a moment ago.


    We know there is some basic information we need to have for this to work, such
    as how nodes are connected to each other, the cost of moving from one node to
    another, and the directions of the connections.

