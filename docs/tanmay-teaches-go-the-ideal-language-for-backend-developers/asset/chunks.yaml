    In the preceding snippet, you’re not allowed to use the `:=` operator, you must
    use the `=` operator.


    However, what if you don’t care about, say, the `name`, and you only care about
    the `age`? To understand how you can ignore a return value, let’s look at this
    sample program:


    **CODE LISTING 2.16** Returning multiple values from a function


    ![Image](p30.jpg)


    This looks like perfectly valid syntax, so let’s compile it! And . . .


    Compile error . . .


    Why, you may ask? It’s because we declared `userName`, but we never used it. Most
    programming languages would ignore it, some would throw a warning. However, Go
    completely stops the compilation process, and says you *must* fix this code before
    continuing. This is what we meant in [Chapter 1](#ch1.xhtml) by “Go has a very
    strict compiler”!


    The reason why Go throws an error is because when you don’t use a variable but
    you do go through the effort of naming and declaring it, it’s usually indicative
    of a bug. For example, what if you forgot to write the logic that deals with that
    value? Usually, though, it’s just a value that you don’t need. If so, then to
    tell the compiler you’d like to ignore it, you can assign it to an underscore:


    ![Image](p31.jpg)


    Now, this code will compile, and print:


    ```

    24

    ```


    One more thing to note: the underscore is not considered a new variable, but `userAge`
    is, and therefore we use the `:=` operator. If we had already declared `userAge`,
    then because underscore is not a “new” declaration, we’d have to use the `=` operator,
    like so:


    ![Image](p32.jpg)


    Another way you can use functions in Go is, of course, to pass them to other functions!
    For example, what if you need a function that calls another function, but you
    don’t know at compile time *which* function it needs to call? You could write
    code like this:


    **CODE LISTING 2.17** Passing function pointers to other functions


    ![Image](p33.jpg)


    ![Image](p34.jpg)


    Notice the function signature of the `runMathOp` function. It is taking an argument
    called “op,” the type of which looks like a regular function signature, just without
    the function name and argument names—only the argument types and return type(s)
    remain.


    When you call the `runMathOp` function, you can simply pass to it another function
    just as you would any other parameter, such as `add` or `mul`, as long as it matches
    the function signature specified in the `runMathOp` declaration.


    One last very powerful feature you should be aware of before we continue is called
    *defer*. With defer, you tell Go to execute some code just before your function
    is about to return. This code will be executed after the return expression has
    been evaluated, but right before the actual return to the caller occurs. The syntax
    is very simple: You simply write the `defer` keyword and run a function call right
    after it. So, for example, look at the following code:


    ![Image](p35.jpg)


    `println(x)` is a function call, and that call is being passed to the `defer`
    keyword within the `test` function. So, that print won’t be executed until just
    before the `test` function returns. Because of this, you should see the following
    output:


    ```

    6

    ```


    ```

    5

    ```


    You can also define a new function *inline* with the defer and call it inline,
    like so:


    **CODE LISTING 2.18** Defining and calling a function inline for defer


    ![Image](p36.jpg)


    Because you’re not just *defining* a function inline, but also *calling* it on
    line 9 with the two parentheses, which is what-defer requires, this is valid syntax.
    You should see the following output when you run this code:


    ```

    6

    ```


    ```

    this is being called from an inline function

    ```


    ```

    I can put multiple expressions inside of here!

    ```


    ```

    4

    ```


    Now that we’ve covered the basics surrounding functions, let’s talk about what
    you *cannot* do with Go: *generics*.


    Generics are one of the most beloved features of the languages that support them.
    At least, most of them (we’re looking at you, Java and C++!).


    In Swift and Julia, for example, generics enable you to write less code that supports
    more types and has more readability and flexibility. A language such as Python
    doesn’t really count for this comparison because you’re duck typing in it anyway!
    It doesn’t care about the types of your variables in the first place.


    However, generics are being worked on by the Go team. Here’s a sneak peak of some
    code you will be able to compile in a future version of the Go language:


    ![Image](p37.jpg)


    This code may look complex, but it’s really quite simple. Previously, let’s say
    you wanted to write a function that would print every element of an array of integers.
    You’d write something like this:


    ![Image](p38.jpg)


    And it works! But then if you want to do the same thing with strings, you have
    to do this:


    ![Image](p39.jpg)


    And you have to do something similar for floats, unsigned integers, different
    sizes of integers and floats, and on.


    ### Structures


    Go is *not* an object-oriented language. It has no concept of a “`class`” or an
    “`object`”. Everything is a value. Even references are values, meaning that they’re
    “pointers” represented as values.


    So, to aid the programmer in storing multiple pieces of related data, Go has the
    concept of `structures`. `Structures` enable you to store some data as a contiguous
    block of memory. Let’s go back to our user name and age example. We could represent
    that as a `structure`:


    ![Image](p43.jpg)


    Now, the size of `User` in bytes is the size of `string` in bytes + the size of
    `int` in bytes. Quite literally, the bytes for these variables are just laid out
    sequentially, one after the other, in memory.


    If you’d like to create a new instance of this structure, you can use the following
    syntax:


    ```go

    myUser := User{"Kathy", 18}

    ```


    Now, if you want to print the different pieces of data stored within the `structure`,
    you can simply use the “`.`” operator:


    ```go

    fmt.Println(myUser.Name)

    ```


    ```go

    fmt.Println(myUser.Age)

    ```

