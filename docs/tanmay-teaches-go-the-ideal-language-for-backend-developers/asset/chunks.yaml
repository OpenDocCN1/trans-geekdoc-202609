    \n### Interoperating with C Code\n\nLet’s start with a simple “Hello, World!”\
    \ example of calling C code from Go. First, let’s see what the pure C version\
    \ of this application would look like:\n\n**CODE LISTING 6.1** A simple “Hello\
    \ World” application in C\n\n![Image](p173.jpg)\n\nThe only essential lines are\
    \ lines 1 and 3. These lines tell the compiler to:\n\n**1.**   Take the “stdio.h”\
    \ file from the OS and paste its contents into this file.\n\n**a.**   This file\
    \ contains a lot of function declarations (not definitions) that deal with input\
    \ and output. However, because the header only tells our code *which* functions\
    \ it can call, not *how* they work, you still need to link this code against the\
