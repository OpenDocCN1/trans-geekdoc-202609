    It might seem impressive to get 4.5 million hashes per second, but in the computing
    world, these are rookie numbers. We should be impressed when we get 30 million
    per second on CPU. Or maybe 8 *billion* per second on GPU! The sky is the limit
    when it comes to making this code faster.


    One immediate potential speedup is using concurrency, so we have multiple processes
    looking at random strings at the same time. However, you’ll have to read [Chapter
    5](#ch5.xhtml) to learn about that!


    Now that you’ve learned how to implement some common algorithms and techniques
    in Go, let’s level up this code! We’ll use a language feature that really sets
    Go apart, Goroutines, and learn how to optimize our code to make it run faster!
    Every time you break a new optimization and speed barrier, you end up learning
