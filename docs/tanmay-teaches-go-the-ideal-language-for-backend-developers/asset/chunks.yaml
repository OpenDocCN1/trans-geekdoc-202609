    longer has any references to it. If there are no references, that means the program
    is no longer using it, and it can be deleted. The issue with this method, or at
    least most of its implementations, is that it introduces short “halts” into the
    program when the app has to stop and collect garbage. It’s also not deterministic,
    so you can’t be absolutely certain of—at any point in your application—how much
    memory you really have, without explicitly checking. You can’t even predict when
    your app will next come to a halt due to Garbage Collection.


    •   **Automatic Reference Counting (ARC)**—This method is usually the best trade-off
    between performance, smoothness (no jittering), and ease of implementation. With
    this memory management technique, every time you create a new object, you also
    create a “reference counter” alongside it. Every time you pass a reference to
    the object somewhere, the counter increments. Every time a reference goes out
    of scope, the counter decrements. Every time the counter is decremented, a check
    is run to see if the counter is at 0. If it is, the memory is freed, because the
    last reference has gone out of scope. Languages such as Swift and Objective-C
    use this method. However, you sometimes need to be careful about *reference cycles*,
    which can lead to memory never getting freed, although this is easy to find with
    some simple instrumentation tooling and is easy to fix with *weak* and *unowning*
    variables.


    •   **Compile-Time Ownership Disambiguation**—As the name suggests, this method
    is the one that really values performance and safety, while also being slightly
    more convenient than just leaving memory management as something that needs to
    be done entirely manually. Languages such as Rust use this method. This technique
    makes it so the compiler can determine, as it compiles the code, when memory will
    need to be allocated or freed. This can be a bit complex to code for because there
    are more restrictions the compiler must place to disambiguate the ownership of
    memory. However, it is worth it for system programming languages such as Rust.


    Online, you’ll find many varying opinions about which memory management technique
    is best, but it really boils down to the implementation. For example, some corner
    cases, such as Intel’s open-source user-space network driver, are architected
    in a way to be optimized for a specific kind of memory management; this makes
    languages such as Swift that use ARC very slow. In the common case, it’s GC that’s
    usually the slowest, most jittery, or most inconvenient. However, that’s just
    the common case—some implementations can be exceptional, such as the GC in Go!


    Go’s Garbage Collector is so efficient, in fact, that there are usually no noticeable
    jitters in between program execution, and it can even match the performance of
    Swift’s ARC.


    ### Concurrency


    We’ve really only just gotten started talking about the advantages of the Go language,
    but there is one more flagship feature, which may just be the tipping point in
    convincing you to use Go: *easy, powerful concurrency*.


    Moore’s law is slowly but surely coming to an end. That’s sad, but we have to
    do something about it. So far, our best solution is multiprocessing, which is
    when a single chip can execute multiple sets of instructions at the same time,
    in parallel. However, driving so many “cores” can be difficult, because you need
    to make sure you’re saturating them with work, and they’re not just sitting around
    waiting for system calls, memory accesses, etc.


    To make multiprocessing easier, operating systems have a concept of “threads.”
    On most platforms that are POSIX-compliant, threads are part of a “process” and
    have their own stack pointers. On other systems, such as Windows, threads are
    their own processes. You can have hundreds of threads running through your kernel,
    but the problem is that these are relatively heavyweight. For example, on a 22-core
    system with 44 threads, you can scale to “thousands” of OS threads on Linux. However,
    when you get to a larger scale, the pure cost of the “Linux CFS (Completely Fair
    Scheduler)” simply context switching between the threads becomes too much to handle.


    In order to fix this problem, Go introduces the concept of Goroutines. A Goroutine
    is a super lightweight “thread-like” execution environment, which is handled by
    the Go runtime rather than the OS. Goroutines map to OS threads, which then further
    map to CPU threads, enabling millions of Goroutines to run without sacrificing
    much performance.


    Now, I know what you’re thinking: “These must be a pain to use!” The truth is
    quite the opposite, actually. It’s easier to implement Goroutines in Go than it
    is to use Jobs on Grand Central Dispatch in Swift! It’s quite literally just a
    single token of syntax—“go”—that tells Go to execute a function in a separate
    Goroutine.


    And, to make communication among Goroutines high performance, Go features “channels.”
    Channels make it super-easy and fast for Goroutines to communicate with one another.


    These two features are highly sought after in other languages, such as Swift and
    C. There are actually quite a few open-source implementations of Goroutines and
    Channels in other languages, but none can really match the original!'
