    我们传递的这个函数将在 HTTP 服务器发现符合我们作为 GET 函数第一个参数传递的字符串条件的请求时被调用。当它被调用时，它将接收一个 `echo.Context`\
    \ 值，并预期返回一个错误。如果没有错误，它将返回 `nil`。如果*有*错误（即返回值不为 `nil`），echo 模块将会你向请求发送失败响应。\n"
