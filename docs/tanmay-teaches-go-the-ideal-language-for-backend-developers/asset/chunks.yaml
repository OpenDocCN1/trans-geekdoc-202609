    • Conway’s Game of Life


    As we do this, we’ll not only revise Go concepts and learn new ones, we’ll also
    move onto a whole new paradigm of user interaction we haven’t covered yet: graphical
    user interfaces.


    Go as a language was never built to work on the UI side of programming. However,
    it is definitely possible to use Go to build GUIs. We’ll be diving further into
    this in a few moments.


    ### Dijkstra’s Pathfinding


    Let’s start with the algorithm you’ve likely heard a lot more about: Dijkstra’s
    pathfinding algorithm. As you may know, a pathfinding algorithm lets you find
    a “route” from one node to another in a graph.


    The word “graph” might seem a bit limiting, but lots of things in the world can
    be turned into a “graph.” Take, for example, a maze. You can represent the maze
    as a graph of individual tiles that connect to each other, where some connections
    are blocked by walls.


    Or you could even take your city’s road system. Different roads are nodes that
    are connected to each other with a certain “cost,” which in the real world usually
    translates to “distance.” However, by using particular technologies, you can factor
    other features into this cost as well, such as traffic, the straightforwardness
    of a route, and others.


    For this example, let’s say we’re working on the graph shown in [Figure 4.1](#ch4.xhtml#fig4_1).


    What we want to do is figure out that, when given any two nodes on this graph,
    what route should we take? For example, to move from C to D, the cost would add
    up to 7, because E is 5 and D is 2.


    ![Image](Tanmay_0401.jpg)


    **FIGURE 4.1** Sample graph to run Dijkstra on


    The inner working of Dijkstra is deceptively simple—so much so that it might take
    you a moment to comprehend the algorithm’s behavior. The best way to really understand
    the algorithm is to visualize it step by step. So, let’s use a simplified version
    of the graph in [Figure 4.1](#ch4.xhtml#fig4_1), which you can see in [Figure
    4.2](#ch4.xhtml#fig4_2), and work through the Dijkstra algorithm first:


    ![Image](Tanmay_0402.jpg)


    **FIGURE 4.2** A simpler graph to practice Dijkstra’s algorithm


    The way Dijkstra works is interesting in the sense that it looks at every possible
    path. When the algorithm starts, we create two dictionaries where the keys are
    the nodes, and the values are floats and nodes, respectively. These two dictionaries
    are called the “distance” or “cost” and the “parent” or “previous” dictionaries.
    We’ll get into what those mean in just a moment. First, let’s take a look at a
    tabular representation of those dictionaries in [Table 4.1](#ch4.xhtml#tab4_1).


    When the algorithm starts, we need to know the source node that we’ll start the
    pathfinding from. For this node, we will set the cost to 0—intuitively, this makes
