    这绝对不是最优解。但你可能会问，究竟为什么会这样？嗯，让我们让代码变得更好一点，在 `getAge()` 函数中，我们将引用类型替换为值类型：


    ![Image](img/p56.jpg)


    ![Image](img/p57.jpg)


    现在，让我们看看我们的类型是否符合要求。


    遗憾的是，`Dog` 和 `Person` 仍然不符合 `Living`，因为它们只实现了 `getAge` 而没有实现 `incrementAge`。然而，`*Dog`
    和 `*Person` 现在*也*不符合了，因为它们只实现了 `incrementAge` 而没有实现 `getAge`。现在你就可以看到为什么这是一个问题了。目前这段代码中没有任何类型符合
    `Living`！


    因此，我们的接口本质上变得毫无用处了。


    Go 肯定有更好的方法来处理这些情况，但目前，如果 `interface` 中甚至有一个函数需要指针接收者，那么你的*所有*函数都都需要指针接收者。


    ### 错误


    Go 处理错误的方式有些独特。在大多数流行编程语言中，函数可以“抛出”（throw）错误，而调用者可以“捕获”（catch）错误。这种方法在 Go 中仍然可行，但并不常见且不被鼓励。相反，Go
    鼓励你返回一种名为 `error` 的类型。


    `error` 是一个接口，它只期望底层类型实现单个函数。该函数被称为 `Error`，不接受任何参数，并返回它所代表的错误的人类可读的字符串。`error`
    接口的定义如下：


    ![Image](img/p58.jpg)


    你可以非常轻松地创建自己的错误类型！以下是一个简单的错误实现：


    ![Image](img/p59.jpg)


    `errorString` 结构现在符合 `error` 接口，你定义的函数可以将其作为 `error` 返回。然而，你可能会问，接口的初衷意义何在？为什么不直接让
    `error` 成为一个结构体，这样你的函数就可以直接将 `error` 存储为字符串了？


    嗯，答案很简单：错误是复杂的。假设你从一个旨在向 HTTP 端点发送请求的函数获取了一个错误。该错误可能发生在多个点，由于防火墙或缺少网络连接，你可能无法*发送*请求。也许响应码是
    500（内部服务器错误），所以是服务器的错！


    因此，Go 没有将 `error` 的定义简单简化为字符串，而是让你定义自己的 `error` 结构体来包含自定义错误信息。由于你被迫实现 `Error()`
    函数来返回一个人类可读的字符串，你仍然可以打印任何运行时错误以进行调试。这些字符串可以根据结构的其他内容进行组合——例如，在 HTTP 示例中的响应码。


    这种非正的错误处理方法会导致代码有些不够优雅，但通常减少了由于未处理的错误导致崩溃的概率。为了了解这一点，让我们来看在函数中使用 `error` 的示例。


    在定义新类型的简单错误时，Go 的标准是将它们定义为全局变量。这允许包外部的代码看到、检查并处理它们。


