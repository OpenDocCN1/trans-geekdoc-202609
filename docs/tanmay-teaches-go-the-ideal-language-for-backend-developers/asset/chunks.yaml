  trans: "\n这就是为什么 Web 服务器会实现“绿色线程”（green threads），它们由服务器本身处理，使得在单个线程内，我们可以在代码的某些节点多个不同的绿色线程之间切换。由于我们对“上下文切换”发生的位置有更细粒度的控制，对于\
    \ Web 服务器类型的应用程序，性能通常会得到增强。\n\nGo 对类似的概念有独特的实现，它遵循一种被称为“M:N”线程模型的范式。这也称为“混合线程”（hybrid\
    \ threading）。`M` 代表用户态或“绿色”线程，而 `N` 代表内核态或“原生”线程。这类似于将完全的内核态（1:1）线程和完全的用户态（N:1）线程结合起来的结果。\n\
    \n混合线程的额外复杂性在于，你需要同时修改内核级和用户级代码才能让系统正常工作。然而，我们确实有一些对我们有利的因素：大多数现代内核已经内置了我们所需的所有机制！我们只需要良好的用户级软件来处理绿色线程，而这正是\
    \ Go 所能提供的。\n\n### Goroutines\n\nGo 有一个“Goroutine”的概念，它可以将许多不同的执行流（我们可以直接称为函数）映射到原生线程池中。为了让你直观感受\
    \ Goroutine 有多轻量，它们只需要 `2KB` 的内存，而原生线程需要 `1MB` 加上保护页，后者是前者的 `500` 倍！\n\n在深入研究这些\
    \ Goroutine 如何工作之前，让我们先来看一个如何使用它们的示例。\n\n创建 Goroutine 的语法非常简单：要像平常一样调用一个函数，只需要在调用之前添加标记“go”即可。例如，请看下面的代码：\n\
    \n**代码列表 5.1** 一个计算数字平方的简单单线程程序\n\n![Image](img/p140.jpg)\n\n正如你可以想象的，当你编译并运行这段代码时，它会打印数字\
    \ `4`。但如果 `squareIt` 实际上是一个耗时的操作，你希望在单独的 Goroutine 中运行它，以便 `main` 函数可以在 `squareIt`\
    \ 运行的同时继续执行它需要做的事，呢？你只需要在 `main` 函数中的 `squareIt` 之前加上“go”即可：\n\n![Image](img/p141-1.jpg)\n\
    \n太棒了！如果你编译程序，你会发现没有错误。但是，当你运行代码时，你会发现它打印了……什么都没有。（在大多数系统上通常都是这样。）这是为什么呢？\n\n\
    （即使它打印了某些内容，也请继续阅读。你就会知道为什么了。）\n\n，想一下。当我们运行 Goroutine 时，我们将 `squareIt` 的执行放在了“后台”，换句话说，它是“与我们当前所在的\
    \ Goroutine 不同的独立 Goroutine”。然后，就在我们这样做的同时，`main` 函数结束了。`main` 函数在主 Goroutine\
    \ 中执行，而主 Goroutine 执行的是该程序运行的主线程。当 `main` 函数结束时，整个程序就会退出——这意味着在我们另一个 Goroutine\
    \ 来得及打印平方数之前，进程就已经退出了。\n\n这意味着我们需要等待 Goroutine 完成。这可以通过在 `main` 函数中添加 `time.Sleep`\
    \ 调用来实现：\n\n```go\npackage main\n\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n\nfunc\
    \ squareIt(n int) {\n\tfmt.Println(n * n)\n}\n\nfunc main() {\n\tgo squareIt(5)\n\
    \ttime.Sleep(time.Second)\n}\n```\n\n太棒了！如果你编译程序，你会发现没有错误。但是，当你运行代码时，你会看到它打印了\
    \ `25`。\n"
