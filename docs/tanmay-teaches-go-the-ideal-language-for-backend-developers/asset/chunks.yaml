- fmt: "\nTechnically, for `Go` modules to work, you don’t need a `GitHub` link, just\
    \ a link to any remote Git repository (perhaps hosted on `GitHub`, `Gitlab`, `Bitbucket`,\
    \ etc.). You could even use your own Git server instance!\n\nThis enables the\
    \ `Go` module system to handle version control. For example, it remembers specifically\
    \ which commit of the module you used to compile your code, which enables more\
    \ consistency in your coding environment. This information is stored within a\
    \ file called `go.sum` if you take the second option we mentioned a moment ago,\
    \ which is creating your own package.\n\nBack to understanding our code . . .\
    \ If you were to compile it at this point (using the `go` `build` `.` command),\
    \ you’d encounter something along the lines of the following error:\n\n![Image](p76.jpg)\n\
    \nThis is `Go` telling you “I can’t find the module you tried to import!” and\
    \ so it’s throwing a compiler error. If you decided on the first method of installing\
    \ the package, which again we wouldn’t recommend, then you’d run the following\
    \ in your command line:\n\n```\ngo get github.com/otiai10/primes\n```\n\nThis\
    \ will download the package to your home folder, so now if you build and run,\
    \ the code should work normally.\n\nHowever, we recommend running the following\
    \ command:\n\n```\ngo mod init primechecker\n```\n\nThis `command` will do one\
    \ simple thing: Within the current directory, it will create a new module called\
    \ “primechecker.” Within this example, the name doesn’t really matter—it only\
    \ comes into play when somebody else wants to use your package (this is the name\
    \ they’ll use to refer to your module).\n\nNow when you run the `go build` command,\
    \ you’ll see your code compiles successfully! This is because `Go` is able to\
    \ download the module you need into your own new module.\n\nYou should see output\
    \ like the following when you run the `go build` command:\n\n```\n> go build .\n\
    ```\n\n```\ngo: finding module for package github.com/otiai10/primes go:\nfound\
    \ github.com/otiai10/primes in github.com/otiai10/primes\nv0.0.0-20180210170552-f6d2a1ba97c4\n\
    ```\n\nAnd you should see the following content in the `go.sum` file:\n\n```\n\
    github.com/otiai10/primes v0.0.0-20180210170552-f6d2a1ba97c4/\ngo.mod h1:UmSP7QeU3XmAdGu5+dnrTJqjBc+IscpVZkQzk473cjM=\n\
    ```\n\n### Building Your Own Packages\n\nAs we’ve already alluded to, in `Go`,\
    \ making and building your own custom packages is very simple. We’ve even already\
    \ covered how you can make your own modules, because they’re important for being\
    \ able to use other people’s modules.\n\n### Am I Prime? Part 2\n\nNow, in order\
    \ to have others use your own custom modules, you must name your module very specifically.\
    \ In our last example, you could name your module essentially anything—however,\
    \ if you’d like to push this module to a remote Git server so others can use it,\
    \ you must name your package as the remote Git repo that others will import in\
    \ their code.\n\nFor example, let’s write a package that enables a user to check\
    \ if a number is prime. We initialize our package like this:\n\n```\ngo mod init\
    \ github.com/Tanmay-Teaches/golang/chapter3/example3\n```\n\nThat way, our `Go`\
    \ module is able to be automatically imported by people who want to use our code.\n\
    \nLet’s write the code for this package now. Of course, we will be coding in our\
    \ `main.go` file, but this time, instead of having “package main”, we’ll name\
    \ the package “example3”. This means that whenever people refer to this package\
    \ in their own code, they’ll refer to it as “example3”.\n\n**CODE LISTING 3.3**\
    \ Custom Prime Number Checker package\n\n![Image](p77.jpg)\n\nThe logic behind\
    \ the `IsPrime` function is quite simple—we have a few conditions at the top that\
    \ check for immediate cases where we can return true or false, and after that\
    \ we loop from 5 to the square root of the number we want to check for. If our\
    \ number is divisible by any number we encounter in our loop, then we return false;\
    \ otherwise, we return true.\n\nNow we can push the code to our `GitHub` repo.\
    \ If this `GitHub` repo happens to be public, then the rest of this chapter should\
    \ be quite self-explanatory, and you should be able to figure it out. All you\
    \ need to do is commit your changes and push to your repo—or whatever else your\
    \ Git workflow may call for.\n\nHowever, you might wonder: What do we do if the\
    \ `GitHub` repo is private? Or maybe you work at a company that uses `GitHub Enterprise`,\
    \ so you have your own instance of `GitHub`. How do you tell `Go` to authenticate\
    \ against that specific instance of `GitHub`?\n\nLet’s start off with figuring\
    \ out how we would do that normally. Usually, you use SSH keys to authenticate\
    \ against Git. SSH keys are easy to use, ultra-secure, and an industry standard.\n\
    \nTo begin telling `Go` to use SSH, we actually have to start with a `Git` command.\
    \ Specifically, we have to tell `git` that whenever it sees an HTTPS URL, it must\
    \ replace the HTTPS request with an SSH request. This is how we can set our global\
    \ `Git` config to do that:\n\n![Image](p78.jpg)\n\nThen, you need to tell `Go`\
    \ to *not* do a “sum check” against the private or internal repository that you’re\
    \ going to clone. This is because the sum check is incompatible with private and\
    \ internal repositories.\n\n```\nexport GONOSUMDB=github.com/Tanmay-Teaches/golang\n\
    ```\n\nThat’s all you need to do! At this point, you should be able to create\
    \ a new project that references the module you created in a private Git repository,\
    \ and then grab the module and use it in your own code. Let’s go ahead and do\
    \ that!\n\nTo start, create a new `Go` project (create a new folder) and initialize\
    \ a new module, like so:\n\n```\ngo mod init example4\n```\n\nOnce again, when\
    \ you’re creating a module for your own purposes that you don’t plan on distributing,\
    \ the name doesn’t really matter.\n\nApart from the module we created for ourselves,\
    \ we’ll use another third-party module called “echo” from “labstack”. This module\
    \ will let us create a quick web (HTTP) server. So, in all, our application will:\n\
    \n1. Open up an HTTP server at a certain port.\n2. Listen for GET requests coming\
    \ in at that port.\n3. If it notices a GET request where the path of the URL is\
    \ a number, we:\n    a. Check if the number is prime.\n    i. If yes, we return\
    \ “true” as a response.\n    ii. If no, we return “false” as a response.\n\nHere’s\
    \ all the code that goes behind this application:\n\n**CODE LISTING 3.4** Using\
    \ the custom Prime Checker package\n\n![Image](p79.jpg)\n\nBefore we run the code,\
    \ let’s decipher a little bit of how it works. When we start the main function,\
    \ we simply call `echo.New()`, giving us a new HTTP Server instance. After that,\
    \ we “register a GET endpoint” against that server.\n\nWe register this GET endpoint\
    \ by passing it a string `/:number`. This means “after the root of the URL, if\
    \ the only thing you see is a certain sequence of characters that we call ‘number’,\
    \ then yes, we can handle the request.”\n\n**NOTE:** When we say “number” in the\
    \ string, we’re not telling it to *only* look for numbers. Rather, we’re saying\
    \ this could be any sequence of characters, but we want to store those characters\
    \ in a variable `number`, because the API we’re designing expects this to be a\
    \ number.\n\nHowever, there is one more argument that we pass to this function:\
    \ It’s another function, which is not immediately invoked. That means after the\
    \ `func` keyword on line 2 of the main function, until line 9 of the main function,\
    \ that code is *not* immediately executed—it’s just part of a new function that\
    \ we’re declaring inline and passing to the GET function from the echo module.\n\
    \nThis function we pass will be invoked by the HTTP server whenever it finds a\
    \ request that fulfills the condition made by the string we passed in as the first\
    \ argument to the GET function. When it’s invoked, it’ll be passed an `echo.Context`\
    \ value, and is expected to return an error. This will be `nil` if there is no\
    \ error. If there *is* an error, which means the return value is not `nil`, the\
    \ echo module will handle sending a failure response to the request for you.\n"
