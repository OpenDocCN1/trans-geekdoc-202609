    \ from unmarshaling, return that error as well.\n\nOf all the steps, step 4 is\
    \ likely the only one that’s complex, because it ties into the last two lines\
    \ of code in the function. Let’s take a look at those in more detail:\n\n```\n\
    mi := &MovieInfo{}\n```\n\n```\nreturn mi, json.Unmarshal([]byte(body), mi)\n\
    ```\n\nThe first line in this snippet is simple: We create the structure, get\
    \ a pointer with the ampersand operator, and store that address in the `mi` variable.\
    \ The second line is where things get a bit more complex. If you were to break\
    \ it down, you’d realize the first value that needs to be returned is an expression\
    \ that’s easily resolvable: It’s just a value in a variable.\n\nHowever, the second\
