  raw: 'Just to give you a bit more context, even though this doesn’t really matter
    for this example, within Blockchain tech, you wouldn’t have a string like “Tanmay
    Bakshi + Baheer Kamal”. You would have a byte sequence that represented payments
    and other transactions, and by finding that magic sequence that fulfills the proof
    of work condition, and by having a reference to this block in the next block of
    transactions you create, you can make sure that people can’t tamper with transactions
    that have already happened. That’s because if they do tamper with a block, the
    whole chain of proof of work will fail to work. Unless, by some astronomically
    unlikely coincidence, they find an algorithm that returns exactly the right hashes
    that the blockchain needs—which is something we don’t need to worry about.


    The actual code that goes behind this fits snugly within a single function. Before
    we can get to it, though, we need to first implement a few utility and helper
    functions. Even before that, we need to get our imports out of the way:


    ![Image](p110.jpg)


    Now, helper functions. For example, we need a function that can help us generate
    random numbers:


    ![Image](p111.jpg)


    We know exactly what you’re thinking: “Go’s standard library doesn’t even let
    us generate random numbers in peace!?” Well, yes, Go *does* already provide us
    functions that we can use to generate random numbers. However, the ones built
    into the standard library are really good; in fact, too good for us. What does
    that mean?


    Remember, computers can’t really generate random numbers, they’re deterministic.
    Technically, everything in the universe is deterministic at a macro level, and
    things are only supposedly probabilistic at a quantum level. The closest we can
    get to random in the universe is chaotic, like the weather. But that’s beside
    the point. Computers implement algorithms known as “pseudorandom number generators”
    that use chaotic math in order to generate numbers that are “uniform enough” in
    their randomness for our use cases.


    These algorithms are pretty cheap in terms of compute time, but they vary in complexity.
    Some are very simple and give “good enough” distributions of numbers, and some
    are very expensive and provide cryptographically secure random numbers. For our
    use case, we don’t need anything expensive, we only need super-simple random numbers.
    That’s why, in this case, we implement our own very simple PRNG (pseudorandom
    number generator).


    The reason we want it to be so cheap in terms of CPU cycles is because this function
    will be called many tens or hundreds of millions of times, so the CPU cycles on
    this function really add up to a lot of runtime if you’re not careful. It just
    goes to show that when you’re optimizing your code, you really need to optimize
    the hotspots, even if they seem simple. Complex code that’s only ever called a
    couple of times doesn’t need to be well-optimized.


    Back to the function we implemented . . . The random number generator simply takes
    a random number seed, runs a few bit-level operations on it, and returns that
    new number. The idea behind its usage is that when we want a random number in
    a certain range, we’ll feed a seed into this function, take the result, and run
    it through a modulus operation against the length of that range. Here’s an example:


    ```

    seed := 42 // this can be anything

    ```


    ```

    seed = RandomNumber(seed) // this generates the new seed

    ```


    ```

    rn := seed % 10 // this is your random number

    ```


    ```

    seed = RandomNumber(seed) // this generates another new seed

    ```


    ```

    rn := seed % 10 // this is another random number

    ```


    Remember, when you start this chain of random numbers with the same seed, you
    will get the same random numbers; computers are deterministic, after all. This
    is why we start the seed with something that changes rapidly, such as a timestamp
    of the number of seconds since 1970.


    The preceding code isn’t going to be used exactly in our upcoming code, but that’s
    what it’s going to be based off of.


    Next, in the same vein, we need a function that can generate random strings for
    us. This function is going to need a global variable that it can pull characters
    from to use in the random strings. Here’s an implementation of both the global
    variable and the function:


    ![Image](p112.jpg)


    This function works in a pretty simple way. Before the function declaration, we
    define a new global variable called `characterSet`. This variable is an array
    of bytes, and this array is defined from a single string—each character essentially
    becomes its own element in this array. We will choose characters for the random
    string from this array.


    The function itself takes a slice of bytes containing an entire string like “Tanmay
    Bakshi + Baheer Kamalxxxxxx” and an offset, telling the function where the “xxxxxx”
    part begins inside the string. We also take a random seed.


    We then loop from the beginning of the random section (the offset) to the end
    of the string, at each index, placing a random character from the characterSet,
    choosing them with the PRNG that we coded a moment ago.


    At the end, the function only needs to return the new seed value. The way this
    function is designed makes it so we don’t need to make copies of the string in
    memory whenever we want to try out a new hash, we can keep reusing the same space
    in memory with the next set of random characters changed for each iteration. This
    makes the code even faster.


    Finally, let’s implement a helper function that can take a string and a proof
    of work condition, and tell us if we’ve met that condition:


    ![Image](p113.jpg)


    This function takes both the data it needs to check against, as well as the number
    of consecutive starting bits in the hash we expect to be all zeros. It does this
    in a few simple steps:


    **1.**   Calculate the SHA256 hash of the data using the built-in crypto package
    from Golang.


    **2.**   Calculate the number of bytes that we need to be all zero.


    **3.**   Calculate the number of bits after the bytes that we need to be all zero.


    **4.**   Loop through the bytes and check them at a high level, returning “false”
    if any byte has a non-zero value (we didn’t meet the proof of the work condition).


    **5.**   If the bytes were fine, we run a bitshift to check if the final few bits
    also meet the PoW condition. If they do, we return true; otherwise, we return
    false.


    We’re done with our helper functions now! Let’s finally move on to the main part
    of this code, the function that actually finds a matching sequence of random characters:


    ![Image](p114.jpg)


    As you can tell, this function can remain pretty simple thanks to the helper functions
    that we’ve created. The function begins by noting the time at which it started
    execution. Using this value, at the end of the function, we can calculate the
    amount of time it took for us to find a solution, and the number of hashes we
    could process per second.


    We then create a couple of variables that we’ll need, such as the total number
    of hashes that have been checked, the random seed (which is based off of a timestamp),
    and the byte array representing the prefix string with a bunch of random characters
    concatenated to it.


    Next, we run an infinite loop in which we always start by incrementing the number
    of hashes processed, because we know we’re going to process a hash if we’ve reached
    this stage of execution. Then, we fill in new random characters in our string
    and refresh our random seed. We check if we’ve met the proof of work condition,
    and if we have, we print the solution and break the loop. If not, we continue
    the loop iterations until we hit that break.


    Then, we get the end time, and print out some statistics. We use a module known
    as “humanize” in order to place commas in our large numbers so they’re more readable.


    There’s just one more thing we need to do: add a main function that calls `pow`!
    It’s quite simple to do so:


    ![Image](p115.jpg)


    Your code should look like this:


    **CODE LISTING 4.3** “Proof of work” application'
