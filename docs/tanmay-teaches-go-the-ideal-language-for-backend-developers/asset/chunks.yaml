    *Tanmay Teaches Go* 旨在让 Go 语言对每位开发者来说都易于上手且。。一种语言，Go 的设计初衷是为了现代后端开发。随着摩尔定律的终结，仅仅期待更强大、更快的计算机已经不够了。因此，我们必须适应新常态：大规模分布式系统，运行高度优化的软件栈。


    这些分布式系统拥有从根本上就不同的硬件理念，它们也迫使软件世界进行创新和变革。现代软件系统正在摒弃大型的单体设计。相反，它们由许多较小的 `microservices`（微服务）驱动，实现了跨项目更大的代码复用以及职责委托——这一切都使得代码更加整洁，漏洞的表面积更小。


    随着软件世界的不断演进，对这种新范式的合适基础设施的需求也随之增长，导致了许多从底层开始开发的全新 `programming languages` 以满足这一需求。Go
    就是这些语言之一，具有适用于基于微服务的开发的特定特性，例如快速的编译时间、较小的二进制文件大小和可移植性。它还拥有其他语言无法真正比拟的特殊特性，如 `Goroutines`
    和 `channels`，用于强大且易于使用的并发处理。


    Go 是后端开发中许多基础设施服务的引擎，如 `Kubernetes`、`Docker`、`etcd`、`CockroachDB` 等。通过使用这些流行工具已经构建的相同语言，你的代码将更接近并能更好地利用面向企业级后端开发的庞大开源生态系统。


    通过这本书，我们希望将你变成 `Go developers`（Go 开发者），让你有能力将 Go 作为解决问题工具箱中的工具。最棒的部分是，Go 并不是普通的工具。它是一种可以解决
    `enterprise-level`（企业级）问题的工具；因此，它是你编写代码的首选。


    我们的目标不仅是教你 Go 语言，而是采用一种在每一步都将 Go 与用于类似任务的其他流行编程语言进行对比的方法，例如 `Swift`、`C`、`Python`
    和 `Java`。我们甚至深入到操作系统和 CPU 层级，向你准确展示这些语言是如何与你的计算机硬件和软件交互的。此举目的两点：


    • 我们希望来自其他语言的开发者轻松过渡到 Go 的世界。

    • 我们希望你从其他编程语言的决策以及我们计算机的底层架构中获得洞察。这有助于你更好地理解 Go 适合和不适合哪些任务，以及它内部是如何运作的以及为什么那样运作。


    *Tanmay Bakshi*


    *Baheer Kamal*


    # Acknowledgments（致谢）


    我想非常感谢我的家人和导师们对我的无条件支持，这让我保持动力。特别感谢 McGraw Hill 优秀的团队，在我编写 `Tanmay Teaches` 系列中的第二本书（未来还有很多本）期间向我的支持。我特别想感谢
    McGraw Hill 的 Lara Zoble，她为我提供了取得成功所需的支持、建议和反馈。她是 `Tanmay Teaches` 系列创建背后的智脑。撰写一本关于
    Go 的书的想法源于我和合著者 Baheer 在为一个项目编写代码时。我们都有一个相同的目标：筛选和处理大型二进制文件。我在 `Swift` 中实现了它，而他用
    `Go` 实现了。在第一次运行中，Go 在编译时间和运行基准测试中都完胜了 Swift！不仅如此，代码也更加直观。这启发了我去写一本关于 Go 语言、它的优势、为什么它有效以及如何应用它的书。特别感谢
    Baheer 与我同走这段旅程！


    *Tanmay Bakshi*


    # CHAPTER 1（第一章）


    ## Introduction（引言）


    欢迎学习 *Tanmay Teaches Go*！在书中（Tanmay Teaches 系列的第二本），你将学习 Go 编程的世界。Go 是一门在设计时考虑了安全性、性能、灵活性和
    `concurrency`（并发）的编程语言。它的设计目标与后端开发的需求从根本上是一致致的。


    在完成本章后，你将能够回答以下问题：


    • Go 的哪些设计目标让 Go 语言如此特别？它有哪些缺点？

    • Go 支持哪些平台？它可以用在哪里？

    • 为什么 Go 的编译器如此特别？

    • Go 的内存管理和它的垃圾回收器（Garbage Collector）是什么？

    • 并发如何让 Go 运行时如此独特？


    ### Why Go?（为什么选择 Go？）


    Go 是一门为了非常特定的目的而构建的语言：简化后端开发者的整个工作流——从执行速度、编译速度、依赖管理，到并发和优化。为了实现这一愿景，Go 团队在构建语言规范时考虑了几个关键的设计目标。


    ### What Are Go’s Design Goals?（Go 的设计目标是什么？）


    Go 由 Google 在 2009 年开发，首个稳定版本于 2011 年向公众发布。该语言由 Robert Griesemer、Rob Pike 和 Ken
    Thompson 设计。Go 以其吉祥物闻名：Gopher（口袋鼠），如图 图 1.1 所示！


    ![Image](img/Tanmay_0101.jpg)


    **图 1.1** “Gopher”：Go 的吉祥物


    Go 的出现是 Google 面临许多问题的解决方案。例如，在编译方面，大多数编译器太慢，无法快速编译 Google 的大型代码库。


    在实现方面，诸如 `C++` 的语言被证明太底层且冗长，而诸如 `Java` 的语言被证明太高层且笨重（带有垃圾回收器带来的延迟）。


    Google 决定解决这些问题的方法是开发自己的语言！Google 对 Go 的目标如下：


    • 创建一个尽可能处理大型代码库的编译器

    • 使用一组良好的优化创建一个生成快速代码的编译器


    Go 实现了这些目标。编译器已被证明非常快。为了实现这种速度，编译器继承了几个关键特性：


    • 它对代码极其严格；例如，未使用的变量和导入是 `errors`（错误）而不是 `warnings`（警告）。

    • 编译器架构非常 `simple`。例如，大多数优化发生在编译后的汇编代码上，而不是 Go 代码的内部表示上（如 `Swift`、`C`、`C++` 通过
    `LLVM` 编译）。甚至直接生成二进制形式的形式，而不是生成文本再编译为二进制。


    不仅编译器本身，由于语言结构，它还能生成快速运行的代码。通过保持语言特性和语法糖的简洁，编译器中的优化器在分析复杂的控制流和逻辑时的工作减少了。这意味着 Go
    代码有时非常简洁，但结果是快速编译的代码。


    同时，由于编译器的严格性，你还继承了安全性。在以安全性特性闻名的复杂的语言中，实现这种安全性需要在编译器和运行时产生额外的开销。然而，由于 Go 语法非常简单，在编译和运行时都很实现。


    ### Where Can I Use Go?（我可以在哪里使用 Go？）


    Go 在各种平台上都具有`高度兼容性`！例如，它支持：


    • Linux

    • BSDs（类 Unix 发行版）

    • DragonFly BSD/FreeBSD/OpenBSD/NetBSD, 等.

    • Darwin

    • macOS/iOS/watchOS/tvOS, 等.

    • Plan 9

    • IBM i

    • Solaris

    • Windows


    '
- fmt: '

    As shown in the preceding list, Go even supports Plan 9 and IBM i! What more could
    you ask for?


    Not only does Go support a variety of operating systems, it also supports a range
    of CPU architectures, such as:


    * `x86/x86_64`—The most mainstream CPU architecture today.

    * `ARM/ARM64`—An architecture built for mobile systems, which will be mainstream
    in high-performance computing soon, thanks to Apple Silicon.

    * `MIPS`—A very simple ISA that’s uncommon in the real world.

    * `IBM PowerPC`—An enterprise-grade RISC CPU architecture by IBM that values high-speed
    I/O with accelerators, performance, and massive parallelism.

    * `IBM Z`—A family of enterprise-grade CISC CPUs (in mainframes!) by IBM that
    values extreme redundancy, reliability, and performance.

    * `RISC-V`—An incredibly exotic, nearly brand new CPU architecture for which there’s
    only one chip available in the market today, by SiFive.


    If Go even supports `RISC-V` and `IBM Z`, I’m sure it’ll fit your use case.


    ### The Go Compiler and Runtime


    A common criticism of Go is precisely one of the things it was built to have—a
    very simplistic syntax. (This syntax style is also, at times, inconsistent, but
    this is a topic for another time.) In fact, there’s a famous joke that the Go
    language designers ignored all programming language technologies invented after
    1980! Despite this less modern way of representing code, however, Go powers some
    of the most modern software, such as Docker, Kubernetes, Terraform, CockroachDB,
    `etcd`, and more.


    One key reason Go is so pervasive is its performance. We’ve already talked about
    how the Go compiler is smart, modern, and fast, but the way the language is designed
    enables programmers themselves to write fast code, too. For example, you can get
    down to the level of C, dealing with pointers and manually managing memory, or
    you can abstract all of that away and let Go deal with memory for you.


    ### Memory Management and the Special Garbage Collector


    Specifically, `Golang` uses Garbage Collection (`GC`) for memory management. There
    are four mainstream ways to do memory management in programming languages:


    * **Don’t!**—This is the approach taken by C, in which you do *everything* manually.

    * **Garbage Collection (GC)**—This is the most popular approach, by far, but unfortunately
    the one that usually compromises the most when it comes to program performance
    (of course, there are exceptions to every rule, and this is just the average case).
    For example, Java and Kotlin (via the `JVM`), Python, `C#`, Go, JavaScript, Lisp,
    Ruby, and Julia all use `Garbage Collection`. The way this works is that, every
    so often, the “Garbage Collector” kicks in and looks for memory that no longer
    has any references to it. If there are no references, that means the program is
    no longer using it, and it can be deleted. The issue with this method, or at least
    most of its implementations, is that it introduces short “halts” into the program
    when the app has to stop and collect garbage. It’s also not deterministic, so
    you can’t be absolutely certain of—at any point in your application—how much memory
    you really have, without explicitly checking. You can’t even predict when your
    app will next come to a halt due to Garbage Collection.

    * **Automatic Reference Counting (ARC)**—This method is usually the best trade-off
    between performance, smoothness (no jittering), and ease of implementation. With
    this memory management technique, every time you create a new object, you also
    create a “reference counter” alongside it. Every time you pass a reference to
    the object somewhere, the counter increments. Every time a reference goes out
    of scope, the counter decrements. Every time the counter is decremented, a check
    is run to see if the counter is at 0. If it is, the memory is freed, because the
    last reference has gone out of scope. Languages such as `Swift` and `Objective-C`
    use this method. However, you sometimes need to be careful about *reference cycles*,
    which can lead to memory never getting freed, although this is easy to find with
    some simple instrumentation tooling and is easy to fix with *weak* and *unowning*
    variables.

    * **Compile-Time Ownership Disambiguation**—As the name suggests, this method
    is the one that really values performance and safety, while also being slightly
    more convenient than just leaving memory management as something that needs to
    be done entirely manually. Languages such as `Rust` use this method. This technique
    makes it so the compiler can determine, as it compiles the code, when memory will
    need to be allocated or freed. This can be a bit complex to code for because there
    are more restrictions the compiler must place to disambiguate the ownership of
    memory. However, it is worth it for system programming languages such as `Rust`.


    ### Concurrency


    We’ve really only gotten started talking about the advantages of the Go language,
    but there is one more flagship feature, which may just be the tipping point in
    convincing you to use Go: easy, powerful concurrency.


    Moore’s law is slowly but surely coming to an end. That’s sad, but we have to
    do something about it. So far, our best solution is multiprocessing, which is
    when a single chip can execute multiple sets of instructions at the same time,
    in parallel. However, driving so many “cores” can be difficult, because you need
    to make you’re saturating them with work, and they’re not just sitting around
    waiting for system calls, memory accesses, etc.


    To make multiprocessing easier, operating systems have a concept of “threads.”
    On most platforms that are POSIX-compliant, threads are part of a “process” and
    have their own stack pointers. On other systems, such as `Windows`, threads are
    their own processes. You can have hundreds of threads running through your kernel,
    but the problem is that these are relatively heavyweight. For example, on a 22-core
    system with 44 threads, you can scale to “thousands” of OS threads on `Linux`.
    However, when you get to a larger scale, the pure cost of the `Linux CFS (Completely
    Fair Scheduler)` simply switching between the threads becomes too much to handle.


    In order to fix this problem, Go introduces the concept of `Goroutines`. A `Goroutine`
    is a super lightweight “thread-like” execution environment, which is handled by
    the Go runtime rather than the OS. `Goroutines` map to OS threads, which then
    map to CPU threads, enabling millions of `Goroutines` to run without sacrificing
    much performance.


    Now, I know what you’re thinking: “These must be a pain to use!” The truth is
    quite the opposite, actually. It’s easier to implement `Goroutines` in Go than
    it is to use Jobs on Grand Central Dispatch in `Swift`! It’s quite literally just
    a single token of syntax—`go`—that tells Go to execute a function in a separate
    `Goroutine`.


    And, to make communication among `Goroutines` high performance, Go features “channels.”
    `Channels` make it super-easy and fast for `Goroutines` to communicate with one
    another.

