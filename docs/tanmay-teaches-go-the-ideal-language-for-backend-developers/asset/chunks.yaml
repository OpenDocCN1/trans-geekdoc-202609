    \ values, but that’s inelegant. You may ask, why not just return `nil`? Well,\
    \ if the type annotation for the function were just `MovieInfo`, as a value and\
    \ not a pointer, then Go would not allow us to return `nil`, because there wouldn’t\
    \ be a way to represent that in memory.\n\nInstead, when we declare this to be\
    \ a pointer, Go gives us permission to return `nil`, because the pointer is allowed\
