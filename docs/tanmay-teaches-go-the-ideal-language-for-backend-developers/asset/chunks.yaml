    You’d think so, right? That’s what it would do with similar syntax in Swift and
    Java, so why not in Go? Well, this comes back to what we were talking about in
    [Chapter 1](#ch1.xhtml): Go deviates from quite a few language standards. In fact,
    this code will actually print the following:


    ```

    0

    ```


