    \ directory and run:\n\n```bash\ngo build\n```\n\nYou should now have an executable\
    \ called `helloworld`, in the same directory. In other words, you’ve just created\
    \ and compiled your very first Go app, which you can now run! On a UNIX-like system,\
    \ you can invoke (or “run”) it like so:\n\n```bash\n./helloworld\n```\n\nYou should\
    \ then see the following output:\n\n```\nHello, World!\n```\n\nThe program does\
    \ work—but how? Let’s go back and analyze the source code part by part, as you\
    \ can see in [Table 2.4](#ch2.xhtml#tab2_4).\n\n**TABLE 2.4** Functionality of\
    \ Each Section of the “Hello, World!” Code\n\n![Image](t2.4.jpg)\n\n**NOTE:**\
