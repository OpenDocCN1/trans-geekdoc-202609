    main function, the original “`kathy`” has never been touched, so it prints the
    original `age`.


    If instead you want to have a function that modifies a `structure` or other value
    in place, you must pass a reference to it. That can be done with the following
    syntax, which should be familiar to you if you’ve programmed in C:


    **CODE LISTING 2.21** Mutating a structure through its pointer passed to a function


    ![Image](p46.jpg)


    Note that there are only two changes in this code. The type annotation in the
    `incrementAge` function has changed to `*User` instead of `User`, meaning it’s
    a reference. Plus, at the call site in the `main` function, we’re no longer passing
    `kathy`, we’re feeding `kathy` into the “&” operator, which fetches a reference
    to `kathy`, and then we pass that reference into the function.


    When you run this code, you should see:


    ```

    20

    ```


    ```

    20

    ```


    Bingo! Now, we would like to point out here that this is NOT a pointer, despite
    what your C instincts may be telling you! This is a *reference* that’s handled
    by Go. So, within the function, you don’t need to dereference the pointer before
    accessing the `age` property. Remember, in Go, we did:


    ```

    fmt.Println(user.Age)

    ```


    Whereas, in C, with a pointer, we’d need to do:


    ```

    printf("%d\n", user->age);

    ```


    Or:


    ```

    printf("%d\n", *user.age);

    ```


    As you may have noticed, in C we wouldn’t be able to use the “`.`” operator unless
    we dereferenced the pointer ourselves, or we would need to use the “`->`” operator
    to dereference it for us automatically. Luckily, in Go, we have no such restriction,
    because this isn’t really a pointer in the first place; it’s a reference.


    Another thing you can do with structures in Go is assign functions to them! For
    example, what if we need a simple function for our `User` structure that could
    return a pretty string like “Baheer Kamal is 24 years old!”? We could write a
    function like this:


    ![Image](p47.jpg)


