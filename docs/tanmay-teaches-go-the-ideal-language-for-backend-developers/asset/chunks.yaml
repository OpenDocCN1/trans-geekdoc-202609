    If you’d like to create a simple function that just returns a constant value all
    the time, such as a 32-bit floating point representation of pi, you could write
    code like this:


    **CODE LISTING 2.11** Declaring, defining, and calling a function


    ![Image](p23.jpg)


    Notice the way the function signature is structured. The return type annotation
    is placed directly after the name of the function and before the opening curly
    brace of the function block.


    However, we’ve still got the parentheses in the way—and as you’ve likely guessed,
    these are for arguments that you may want to pass into the function.


    For example, if you’d like a function that returns pi multiplied by some non-negative
    integer, you could write the following function:


    **CODE LISTING 2.12** A new valueOfPi function that multiplies against an arbitrary
    constant


    ![Image](p24.jpg)


    Once again, notice how the function signature changed. We first placed the name
    of the argument, then a space, and then the type of that variable.


    Before we continue, there is a quick sidenote I want to make. When we ran the
    preceding multiplication, note how we had to manually cast the unsigned integer
    to a 32-bit floating point number. This is done to avoid any kind of ambiguity
    in the operation.


    You may be wondering at this point: How does a type cast work? A type cast is
    able to follow a certain spec to convert bits arranged in a way that a certain
    type expects into a way that another type expects them to be. For example, how
    is a float32 represented in memory? Well, float32 in Go conforms to the IEEE 754
    spec.


    One bit is reserved for the sign (is this positive or negative), 8 bits are reserved
    for the exponent, and 23 bits are usually reserved for the fraction. However,
    integers are completely different: They have a very straightforward way of being
    represented in binary, with the value of bits increasing by a factor of 2 from
    right to left, with the leftmost bit usually reserved for the “sign.”


    So, if you want to convert an integer value to a float32 value, it’s not as simple
    as saying “Here are the bits. Treat them as float32 type now!” Instead, you have
    to *tell* Go that you want to convert the bit representation from integer spec
    to float32 spec. You don’t need to understand how this works; all you need to
    know is that it *does* work because the compiler and your CPU handle it for you—if
    the types in the cast are compatible.


    Back to our code . . . Remember, we had to add the cast from uint to float32.
    However, in a language such as C, similar code would compile even without an explicit
    cast. But what would that code do? We’re nearly certain only a few C developers
    *really* know what all those implicit operations would actually do. And, because
    their behavior can be undefined or change behind the scenes, you’re basically
    asking for bugs in your code.


    While Go code can sometimes be quite terse because of this rule, it’s worth it
    for the safety, which as we discussed, is something that Go values highly.


    Back to the function . . . In order to call it, we can do this:


    ```

    valueOfPi(2)

    ```


    An example of using this expression in a real program is:


    **CODE LISTING 2.13** Calling the new valueOfPi function with a multiplier


    ![Image](p25.jpg)


    Multiple arguments are delimited by commas at both the function declaration and
    the call site. Here’s a similar function that not only takes the non-negative
    multiplier to multiply by, but also a signed integer that we want to subtract
    from pi.


    **CODE LISTING 2.14** Implementing operateOnPi to offset and multiply pi by constants


    ![Image](p26.jpg)


    Notice how the function signature kept the same theme—the arguments are listed,
    comma delimited, within the parentheses, and the name of each argument and its
    type annotation are listed in that order, delimited by a space.


    When you want to call that function, simply delimit the two arguments you pass
    with a comma, like so:


    **CODE LISTING 2.15** Calling the new operateOnPi function


    ![Image](p27.jpg)


    Let’s tie this back to what we learned a little while ago: variables. Remember,
    when you are initializing a variable, you’re really just writing out the following:


    ![Image](p28.jpg)


    The expression on the right may be a call to a function that returns what you
    want to store, it may be another variable, it could be a literal, or just *anything*
    that resolves to the value you expect.


    There is another way, but it still follows the same theme:


    ```

    var <name> <type>

    ```


    ```

    <name> = [expression that resolves to the above <type>]

    ```


    So, if you’d like to call the function we built and store the value in a variable,
    the normal way to do it is:


    ```

    tau := operateOnPi(2, 0)

    ```


    Now this variable contains the value of Tau. However, we can *still do more*.
    What if you want to return *multiple* values? Say we’re building a function that
    returns both a name AND an age, how would we handle that?


    Here’s an example that does just that:


    ![Image](p29.jpg)


    This function takes a user ID, matches it using a `switch` statement, and returns
    the name and age associated with that user ID. Once again, the function signature
    is still familiar, and the change makes sense. Instead of a standalone type annotation
    between the function name with its arguments and the code block, there are multiple
    type annotations, delimited by commas, and enclosed in parentheses.


    At the site of the function return, we *don’t use the parentheses*, instead we
    just delimit the different expressions that resolve to the return values with
    commas. In this case, all of those expressions are literals, but they don’t have
    to be.


    However, using this function may not be as intuitive as you expect. Depending
    on which languages you’ve coded in before, it may look like Go is returning a
    type such as a “tuple,” but it isn’t really. It’s actually returning two separate,
    distinct values. This means that the following code will fail to compile:


    ```

    user := nameAndAge(0)

    ```


    The reason why it fails is because Go is expecting the expression on the right
    to resolve to *two* values, while there’s only *one* on the left side of the `:=`
    operator. So, as the function signature demands, in order to fix this issue, you
    need to have two variables on the left side, delimited by a comma:


    ```

    userName, userAge := nameAndAge(0)

    ```


    Something to keep in mind here is that, as long as there is at least *one* new
    variable on the left side of the `:=` operator, you must use, well, the `:=` operator.
    If there are no new variables, then you must use the simple = assignment operator.
    For example, this code makes sense:


    ```

    var userName string

    ```


    ```

    userName, userAge := nameAndAge(0)

    ```


    This code works because `userAge` is still a new variable, so Go tolerates the
    pre-declared userName variable on the left. However, in the following code, both
    are already declared.'
