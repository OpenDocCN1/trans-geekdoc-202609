    对于每个请求，你应该能看到“true”或“false”作为输出：如果是素数则显示 true，如果是合数则显示 false。


    在本章中，我们探索了如何使用 Go 模块——包括第三方和内置模块——并向你展示了如何构建自己的模块！在接下来的章节中，我们将利用目前为止学到的所有概念，构建使用常用数据结构和算法的真实应用程序。


    ### 练习


    **1.** 什么是“校验和（checksum）”，Go 为什么要使用它？在什么情况下你应该禁用它？


    **2.** 如果你在 Go 中导入了一个模块，为什么如果没有被使用它，编译器会抛出错误？


    **3.** 为什么倾向于为每个项目单独安装 Go 模块，而不是全局安装？


    **4.** 对于计划在版本控制系统中作为自定义模块重新分发的包，你应该使用什么样的命名方案？


    **5.** 为什么如果返回类型不是指针，你就不能从函数中返回 `nil`？


    **6.** 在调用阻塞的 `start` 函数后，如何停止 HTTP 服务器？


    ## 第 4 章：使用内置包


    欢迎来到第 4 章！现在你已经熟悉了 Go 语言的基础构建组件以及如何使用包和模块，现在是时候学习该语言的一些额外功能和能力了。我们将通过构建由你可能在自己的应用程序中常用的数据结构和算法驱动的应用来实现。


    完成本章后，你将回答以下问题：


    • 什么是 Dijkstra 路径算法？它是如何工作的？

    • 如何在 Go 中实现 Dijkstra 来搜索图？

    • 什么是康威生命游戏（Conway’s Game of Life）？它是如何工作的？

    • 如何在 Go 中实现图形用户界面（GUI）？

    • 为什么生成随机数是一项困难的任务？如何在 Go 中构建自己的伪随机数生成器？


    ### 常用数据结构和算法


    具体来说，我们将查看两个著名的算法，这些算法可以教我们很多关于将伪代码和逻辑转换为 Go 代码的知识。这两个例子是：


    • Dijkstra 路径算法

    • 康威生命游戏


    在进行这一过程中，我们不仅会复习 Go 概念并学习新概念，还将进入我们尚未涵盖的全新用户交互范式：图形用户界面。


    Go 这种语言从并不是为编程的 UI 端而设计的。然而，使用 Go 构建 GUI 绝对是可能的。我们将在稍后深入探讨这一点。


    ### Dijkstra 路径算法


    让我们从你可能听过得多的算法开始：Dijkstra 路径算法。正如你可能知道的，路径算法允许你找到图中从一个节点到另一个节点的“路线”。


    “图（graph）”这个词可能看起来有些局限性，但世界上许多事物都可以转化为“图”。例如，一个迷宫。你可以将迷宫表示为相互连接的单个瓷砖组成的图，其中某些连接被墙壁挡住。


    或者你甚至可以考虑城市的道路系统。不同的道路是节点，它们以特定的“成本”连接，这在现实世界中通常翻译为“距离”。然而，通过特定的技术，你还可以将其他特征考虑入成本中，例如交通状况、路线的直直程度等。


    对于这个例子，假设我们正在处理图 4.1 所示的图。


    我们要做的是确定，当给定图中任意两个节点时，我们应该走哪条路线？例如，从 C 移动到 D 的成本总和为 7，因为 E 是 5，D 是 2。


    ![Image](img/Tanmay_0401.jpg)


    **图 4.1** 用于运行 Dijkstra 的示例图


    Dijkstra 的内部原理具有欺骗性的简单——以至于你可能需要花一点时间来理解算法的行为。真正理解算法的方法是分步骤进行可视化。所以，让我们使用图 4.1
    的简化版本（你可以在图 4.2 中看到），并首先演示算法：


    ![Image](img/Tanmay_0402.jpg)


    **图 4.2** 用于练习算法的简单图


    Dijkstra 的工作原理在于它考虑了所有可能的路径。当算法开始时，我们创建两个字典，键是节点，值分别是浮点数和节点。这两个字典被称为“距离（distance）”或“成本（cost）”字典以及“父节点（parent）”或“上（previous）”字典。我们稍后会解释它们的含义。首先，让我们看看表
    4.1 中这些字典的表格表示。


    当算法开始时，我们需要知道开始路径查找的源节点。对于该节点，我们将成本设置为 0——直觉上这是合理的。从源节点到源节点的成本是 0，因为你已经在那里了！父节点也是
    `nil`——因为你是如何到达源节点的？你不是通过源节点到达那里的，你只是就在那里；没有节点先于它。


    为了方便讨论，假设我们图中的源节点是节点 B。现在字典应该像表 4.2 所示。


