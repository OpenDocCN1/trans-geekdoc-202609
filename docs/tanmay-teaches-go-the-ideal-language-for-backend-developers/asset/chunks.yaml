    Let’s start with the classic kind of loop: the “`for-in`” loop. This “for loop”
    enables you to loop through the elements in a certain sequence, such as in an
    array. Here’s an example of using a `for-in` loop:


    **CODE LISTING 2.6** Using for-in loops in Go


    ![Image](p14.jpg)


    **NOTE:** You’re probably wondering: “I don’t see the word ‘in’ here, so why is
