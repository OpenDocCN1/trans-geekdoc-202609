    If that situation arises, you can use `switch` statements instead. Historically,
    `switch` statements were more optimizable than `if` statements, but compiler technology
    has advanced to the point where the effect of this difference is truly minimal,
    and only really applies in edge cases that the majority of programmers are normally
    unlikely to reach.


    A “switch” enables you to evaluate a single expression and match its equality
    to one of many possible outcomes. For example, let’s say the user enters their
    name, and we want to see which user of the three possible users entered their
    name. You can do that with the following code:


    ![Image](p12.jpg)


    Go’s `switch` `statements` are very similar to ones in languages such as C and
    Swift. As in Swift, you *must* provide a `default` case, which is the case that’s
    called when no other case’s condition is satisfied. Unlike in C, you don’t need
    to add a `break` at the end of each case, because Go doesn’t pass through to other
    cases. It instead moves to the next line of code *after* the `switch` `case` block.
    If you don’t have experience with C, no worries. You don’t need it to master Go.
    This was simply an example to let you know how Go’s control flow works with `switch`
    statements in comparison to the `switch` statements in other languages.


    So, go ahead and implement the preceding `switch` statement in a main function
    like so:


    **CODE LISTING 2.5** Using switch statements to check equality in Go


    ![Image](p13.jpg)


    When you run this code, you should see the following output:


    ```

    Hi, Tanmay.

    ```


    That’s a primer on conditionals in Go. Using them, you can branch to different
    parts of your code based on whether or not a condition is fulfilled.


    ### Loops


    Loops are another integral building block that programming languages provide you
    with. In Go, loops are heavily simplified. In fact, just *one* kind of loop takes
    on the role of the *three* you usually see in other languages (`for` loops, `while`
    loops, `do-while/repeat-while` loops).


    Go replaces the three loops with simply one kind of loop: the `for` loop. Technically,
    you can replicate the functionality of the other kinds of loops with a `for` loop
    as well. This means Go really just has multiple kinds of loops under the “for”
    banner, which represents the different kinds of loops found in other languages.


    Let’s start with the classic kind of loop: the “for-in” loop. This “for loop”
    enables you to loop through the elements in a certain sequence, such as in an
    array. Here’s an example of using a `for-in` loop:


    **CODE LISTING 2.6** Using for-in loops in Go


    ![Image](p14.jpg)


    **NOTE:** You’re probably wondering: “I don’t see the word ‘in’ here, so why is
    it called a `for-in` loop?” The answer is simply: the “`:=` `range`” part of the
    loop is taken as “in”—for example, “for `i` `in` `names`”, similar to Swift and
    Python.


    Now, I want you to guess what this code is going to be. This code will print the
    following:


    ```

    Tanmay

    ```


    ```

    Baheer

    ```


    ```

    Kathy

    ```

