    如前面的列表所示，Go 甚至支持 Plan 9 和 IBM i！你还有什么可要求的呢？


    Go 不仅支持多种操作系统，还支持一系列 CPU 架构，例如：


    * `x86/x86_64`——当今主流的 CPU 架构。

    * `ARM/ARM64`——为移动系统构建的架构，得益于苹果芯片（Apple Silicon），它很快将在高性能计算领域成为主流。

    * `MIPS`——一种非常简单的指令集架构（ISA），在现实世界中并不常见。

    * `IBM PowerPC`——IBM 开发的企业级 RISC CPU 架构，重视带有加速器的高速 I/O、性能以及大规模并行化处理。

    * `IBM Z`——IBM 开发的一系列企业级 CISC CPU（用于大型机！），重视极高的冗余性、可靠性和性能。

    * `RISC-V`——一种极其新颖、近乎全新的 CPU 架构，目前市场上只有 SiFive 公司提供了一款芯片。


    如果 Go 甚至支持 `RISC-V` 和 `IBM Z`，我确信它能满足你的用场景。


    ### Go 编译器与运行时


    对 Go 的一个常见批评恰恰是它设计初衷之一——极其非常简单的语法。（这种语法风格有时也是不一致的，但那是另一个的话题了。）事实上，有一个著名的笑话说 Go
    语言的设计者忽略了 1980 年之后发明的所有编程语言技术！尽管这种代码表示方式不够现代，但 Go 驱动了一些最现代的软件，如 Docker、Kubernetes、Terraform、CockroachDB、`etcd`
    等。


    Go 之所以普及的一个关键原因是它的性能。我们已经讨论过 Go 编译器是智能、现代且快速的，但这种语言的设计也让程序员本身能够编写快速的代码。例如，你可以深入到
    C 语言级别，处理指针并手动管理内存；或者你可以抽象掉这一切，让 Go 为你处理内存。


    ### 内存管理与特殊的垃圾回收器


    具体来说，`Golang` 使用垃圾回收（`GC`）进行内存管理。编程语言中内存管理有四种主流方式：


    * **不要管理！**——这是 C 语言采用的方法，其中你必须*手动*完成一切。

    * **垃圾回收 (GC)**——这是目前最流行的方法，但遗憾的是，在程序性能方面它通常是妥协最多的（当然，规则都有例外，这只是平均情况）。例如，Java
    和 Kotlin（通过 `JVM`）、Python、C#、Go、JavaScript、Lisp、Ruby 和 Julia 都使用 `Garbage Collection`。它的工作原理是：每隔一段时间，“垃圾回收器”就会启动寻找没有任何引用的内存如果没有引用，意味着程序不再使用它，可以将其删除。这种方法（或至少是大多数实现）的问题在于，当应用程序停止并收集垃圾时，会在程序中引入短暂的“暂停”。它不是确定性的，因此在没有任何明确检查的情况下，你无法绝对确定剩余内存。你甚至无法预测应用程序下次何时会因为垃圾回收再次停止。

    * **自动引用计数 (ARC)**——这种方法通常是性能、流畅度（无抖动）和实现便利之间的最佳平衡。在这种内存管理技术下，每当你创建一个新对象时，也会同时创建一个“引用计数器”。每当你将对象的引用传递给某处时，计数器加增。每当引用离开作用域，计数器减小。每当计数器减小，就会运行一次检查查看计数器是否为
    0。如果是，内存就会释放，因为最后一个引用已经离开了作用域。`Swift` 和 `Objective-C` 等语言使用这种方法。然而，你有时需要注意*引用循环*，这可能导致内存永远无法释放，尽管通过一些简单的监测工具很容易发现，并且可以使用*弱（weak）*和*非拥有（unowning）*变量轻松修复。

    * **编译时所有权消除歧义**——顾名义，这种方法真正重视性能和安全性，同时比完全将内存管理留给手动操作要稍微方便。`Rust` 等语言使用这种方法。这种技术使得编译器可以在编译代码时确定何时需要分配或释放内存。这在编写代码时可能有点复杂，因为编译器必须施加更多限制来消除内存所有权的歧义。但对于
    `Rust` 这样的系统编程语言来说，这是值得。


    ### 并发


    我们刚刚开始讨论 Go 语言的优势，但还有另一个旗舰特性，它可能是说服你使用 Go 的转折点：简单且强大的并发。


    摩尔定律正在缓慢但坚定地结束。这很遗憾，但我们必须采取行动。到目前为止，我们最好的解决方案是多进程处理，即单个芯片可以同时并行执行多组指令。然而，驱动如此多的“核心”可能是困难的，因为你需要确保它们被工作饱和，而它们不会只是闲在那里等待系统调用、内存访问等。


    为了让多进程处理变得简单，操作系统引入了“线程”的概念。在大多数符合 POSIX 的平台上，线程是“进程”的一部分，并有自己的栈指针。在其他系统（如 `Windows`）中，线程是它们自己的进程。你可以让数百个线程通过你的内核运行，但问题是这些线程相对重量。例如，在一个具有
    22 核 44 线程的系统中，你可以在 `Linux` 上扩展到“数千个”操作系统线程。然而，当你达到更大的规模时，`Linux CFS（完全公平调度器）`
    在线程之间切换的纯成本将变得无法处理。


    为了解决这个问题，Go 引入了 `Goroutines` 的概念。`Goroutine` 是一个超轻级的“类线程”执行环境，由 Go 运行时而非操作系统处理。`Goroutines`
    映射到操作系统线程，然后映射到 CPU 线程，使得数百万个 `Goroutines` 能够运行而不牺牲太多性能。


    现在我知道你在想什么：“这些用起来肯定很痛苦！” 实际上恰恰相反。在 Go 中实现 `Goroutines` 比在 `Swift` 中使用 Grand Central
    Dispatch 的 Jobs 还要简单得多！这仅仅只需要一个语法标记——`go`——它告诉 Go 在单独的 `Goroutine` 中执行函数。


    而且，为了让 `Goroutines` 之间的通信高性能，Go 提供了“通道（channels）”。`Channels` 让 `Goroutines` 之间的相互通信变得超级简单且快速。


