    steps:


    **1.**   Build a set of URL parameters that contain the API key and the name of
    the movie we want to search.


    **2.**   Compose the REST API URL we want to query, along with the parameters
    from step 1.


    **3.**   Make the request to the site, and if there is an error, return a nil
    pointer and the error.


    **4.**   Create a new MovieInfo value, get a pointer to it, return the pointer,
    and unmarshal the response string into the value through the pointer. If there
    is an error from unmarshaling, return that error as well.


    Of all the steps, step 4 is likely the only one that’s complex, because it ties
    into the last two lines of code in the function. Let’s take a look at those in
    more detail:


    ```

    mi := &MovieInfo{}

    ```


    ```

    return mi, json.Unmarshal([]byte(body), mi)

    ```


    The first line in this snippet is simple: We create the structure, get a pointer
    with the ampersand operator, and store that address in the mi variable. The second
    line is where things get a bit more complex. If you were to break it down, you’d
    realize the first value that needs to be returned is an expression that’s easily
    resolvable: It’s just a value in a variable.


    However, the second value that needs to be returned is not so easy to resolve.
    You need to call a function (which in this case is `Unmarshal`), get the return
    value, and then use that as a return value for this function. So, here’s what’s
    happening internally:


    **1.**   We create the pointer to a new MovieInfo struct.


    **2.**   We convert the body string to an array of bytes.


    **3.**   We pass the body, as bytes, and the pointer to the Unmarshal function
    in the json package.


    •   The response of the Unmarshal function is of type `error`, and we don’t get
    a real “value” returned. This is because we passed it a pointer, so it just puts
    the value we expect it to “return” inside the memory that the pointer points to.


    **4.**   The function returns the pointer to the memory that we just unmarshaled
    within, and also, potentially, the error that the Unmarshal function may have
    returned.


    Again, it may be a bit unintuitive to read for the first time, but once you get
    used to it, it starts to make a lot of sense.


    Then, we simply do something similar for the function that will search for a movie
    by its unique identifier:


    ![Image](p70.jpg)


    The only difference here, apart from the name of the function, is on line 4 of
    the snippet. Instead of the parameter’s name being “t” for title, it’s “i” for
    ID.


    And that’s all there is to it! We now have the capability to query OMDb and get
    information about movies. Let’s test it out with a main function:


    ![Image](p71.jpg)


    All we do in the main function is search by ID, and then search by Name. Try filling
    in the values here and see which movies you get! One thing to remember is that
    we ignore the second return values of these functions, which are both of type
    `error`. This means that if we do get an error at this point, we will not be handling
    it. Depending on where the error arose, this may crash the application or print
    out a garbage, nonsense value.


    In real production code, of course, we would handle the errors more gracefully.


    When you run this code, you should see the following output:


    ```

    Guardians of the Galaxy Vol. 2

    ```


    ```

    Game of Thrones

    ```


    The first line is the title of the result with ID “tt3896198”, and the second
    line is the title of the first result when you search for “Game of” in OMDb.


    Here’s the complete code listing:


    **CODE LISTING 3.1** Retrieve movie information using the OMDb API


    ![Image](p72.jpg)


    ![Image](p73.jpg)


    ![Image](p74.jpg)


    You’ve just seen an example of using only built-in packages to build a real, useful
    application. However, the true beauty of a programming language emerges when you
    leverage the code written by the community. To do this, we’ll use Go modules.


    ### Using Third-Party Packages


    Support for Go modules began in Go version 1.11. Using modules, Go can handle
    third-party packages in a seamless way, enabling programmers to collaborate and
    share code to prevent everybody from reinventing the wheel.


    Go modules can be handled by your IDE or manually via the command line. Because
    the purpose of this book is to learn about Go in as platform-agnostic a manner
    as possible, we will of course cover the way to use the command-line version.


    The main command that deals with modules is “go mod”. For example, if you run
    this in your command line:


    ```

    go mod help

    ```


    you should see a help page telling you all the things you can do with Go modules.


    There are two paths you can take to using Go modules:


    •   Install a Go module “globally,” meaning that you download the code for that
    module and store it in a path that’s accessible to all of your projects. The advantage
    to this is that you only need to grab it once, and all of your projects suddenly
    have access to this module. The main disadvantage is that this can be bad sometimes,
    like when you need certain versions of a package or an isolated environment of
    packages.


    •   If you create your own Go module, you can install a third-party Go module
    within your own module. This prevents other projects and modules from accessing
    the module you download, and it will be stored within the project folder itself.


    Let’s write some code that uses a third-party Go module, and then explore both
    of these options. First, we recommend installing modules within your project,
    unless there’s a very specific reason you need to install them globally.


    ### Am I Prime?


    We’re going to build an application that takes a number from the user via the
    command line and simply prints out whether or not that number is prime. This example
    is quite simple, so we could easily write the code for this ourselves. However,
    we’ll use an open source module from GitHub that does it for us.


    The package we’ll use can be found at [www.github.com/otiai10/primes](https://www.github.com/otiai10/primes).
    The entire code file is quite simple:


    **CODE LISTING 3.2** Checking if a number is prime using otiai10’s package


    ![Image](p75.jpg)


    As you can see, working with a third-party module is almost the same as using
    a built-in package! The first noticeable difference is that when you run the import,
    you need to specify the link to the GitHub repo (repository) where the module
    is hosted.'
