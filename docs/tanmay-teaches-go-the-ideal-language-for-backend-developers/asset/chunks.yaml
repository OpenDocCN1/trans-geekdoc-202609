- fmt: "\nYou’re now in the know of all of the basics when it comes to calling C from\
    \ Go. It’s time to move on to something more complex: calling Swift from Go, and\
    \ actually building a practical application that makes sense in the real world.\n\
    \n## Interoperating with Swift\n\nFirst off, why would we ever want to call Swift\
    \ from Go?\n\nRemember, the Go compiler is really powerful. However, Go is fine\
    \ with making a very specific tradeoff, because it’s deemed beneficial for the\
    \ kinds of codebases that are written in Go: the compilation speed versus runtime\
    \ speed tradeoff. Go is okay being really fast at compiling your code, even if\
    \ that means the compiled code itself may be a bit slower, or if the language\
    \ is a bit less expressive because of it. \n\nMostly, this doesn’t really matter,\
    \ because the Go optimizer is really good anyway. But there are some optimizations\
    \ you just don’t get, and that could be very beneficial for specific operations.\
    \ For example, tail call optimizations don’t exist in Go! Tail call optimizations\
    \ can sometimes make recursive algorithms significantly more efficient by making\
    \ it so the recursive call doesn’t need to return back through the deep recursive\
    \ call stack and can return back to the original caller instead.\n\nFor this kind\
    \ of code, you might think that writing in a language such as C becomes important.\
    \ And while this may be true, sometimes you don’t need the level of control that\
    \ C gives you; it can be a burden. This is why Swift, and other similar languages,\
    \ exist.\n\nHowever, there are also some tasks that Go is really good at, such\
    \ as concurrency. Or, maybe there’s a specific module that someone wrote in Go\
    \ that makes a certain aspect of your application a lot easier to code. Sometimes,\
    \ you need to leverage the capabilities of Go in the same application that requires\
    \ code to be written in another language. This is when calling another high-level\
    \ language, such as Swift, in Go can be useful.\n\nTo demonstrate a use case where\
    \ this is true, we’ll implement an application that uses a special “AI” to play\
    \ Tetris automatically, and to visualize the output of the Tetris game in the\
    \ command line. To understand how this requires an interop between Go and Swift,\
    \ we first need to understand the game of Tetris and then dive deeper into the\
    \ AI we’ll build.\n\nYou’ve almost certainly played or seen someone play Tetris\
    \ before, but in brief, Tetris is the classic game of taking falling bricks and\
    \ manipulating the way they fall from the top of the screen to the bottom such\
    \ that the bricks can make “lines” across the board. When you build a line, that\
    \ row of the board gets cleared and any bricks above it get moved down.\n\nFigure\
    \ 6.1 is a sample screenshot of an implementation of the classic Tetris game as\
    \ someone is playing it. Because the version that we build in this chapter runs\
    \ in the command line, it will look different.\n\n![Image](Tanmay_0601.jpg)\n\n\
    **FIGURE 6.1** Playing the classic Tetris game by The Tetris Company, LLC\n\n\
    The specific strategy taken by the AI that we’ll build is to:\n\n1. **Look at\
    \ the block that is falling and determine what all the possible final states are\
    \ of that block on top of the other blocks—regardless of whether they’re good\
    \ or not.**\n2. **Use many weighted heuristics to score each possible end state\
    \ to find out which one is the “best,” in that it enables us to have the greatest\
    \ likelihood to maximize the score.**\n3. **Use a pathfinding algorithm to find\
    \ out how to get to that ending position.**\n4. **Make the moves to get to that\
    \ end state.**\n\nIn this way, with the right set of heuristics and weights for\
    \ each heuristic, we can get an AI that’s really good at playing Tetris.\n\nThe\
    \ following are the heuristics we’ll implement:\n\n* **Number of holes**—Gaps\
    \ in the blocks that can’t be filled until the lines above have been cleared\n\
    * **Number of open holes**—Gaps in the blocks that are not covered by other blocks\n\
    * **Blocks above holes**—Number of blocks above the holes\n* **Maximum line height**—The\
    \ peak Y position of a block on the board\n* **Last block added height**—The peak\
    \ Y position of the block that we’re adding in this move\n* **Number of pillars**—Columns\
    \ that require a vertical line piece to fill\n* **Blocks in rightmost lane**—The\
    \ peak Y position blocks in the rightmost column\n* **Bumpiness**—Cumulative difference\
    \ of the peak Y positions between each neighboring column pair\n\nThe way a certain\
    \ state’s “cost” will be determined is by getting the values of all these heuristics,\
    \ multiplying them by a weight, and summing the weighted heuristics. The lower\
    \ the cost, the better the state is for the game as a whole.\n\nThis brings us\
    \ to the next challenge: How in the world can a human find the right weights to\
    \ use?\n\nOne way of doing this is to use your intuition. For example, we know\
    \ bumpiness is bad, and so is the number of holes, but open holes are better than\
    \ blocked holes, and we want to minimize the line height, and so on, and to guesstimate\
    \ some numbers off of that. Estimation in this way is simply not scalable because\
    \ we don’t understand the effects of how each heuristic interacts with every other\
    \ heuristic. This is why we need a mathematical, automated way of finding the\
    \ weights.\n\nSpecifically, the solution implemented in the code is known as Covariance\
    \ Matrix Adaptation Evolutionary Strategy (`CMA-ES`). This is an algorithm commonly\
    \ used when you have a nondifferentiable function, or if the derivative doesn’t\
    \ make sense to. That is exactly the case in this scenario—it doesn’t make sense\
    \ to differentiate. Therefore, we use `CMA-ES` to find the best weights.\n\nThe\
    \ algorithm starts with each weight being just `1`—meaning we just sum together\
    \ the outputs from the heuristics. As you can imagine, this set of weights results\
    \ in chaotic behavior that doesn’t make sense. However, through a trial-and-error\
    \ optimization method, `CMA-ES` quickly finds a solution that can get over 4000\
    \ lines cleared! Plus, the optimization only takes under 12 hours to complete.\n\
    \nSomething you should keep in mind, however, is that just simulating the game\
    \ in memory, with no UI rendering, in which the AI got 4000 lines cleared, took\
    \ over 4 hours. That is a lot of time, even if the AI got an insanely high score.\
    \ However, it’s also faster than other implementations out there, mostly because:\n\
    \n* It’s written in Swift, so it’s compiled and optimized by the best compiler\
    \ infrastructure in the world.\n* No UI rendering occurs, and the game is played\
    \ entirely in memory.\n\nAlso, because the optimization requires you to simulate\
    \ a full game, the faster we can simulate games, the faster we can find a set\
    \ of weights that is good, and the more time we can dedicate to the optimization,\
    \ resulting in even better weights. In order to simulate games faster, you need\
    \ an implementation of the game logic itself that is fast. This brings us to why\
    \ the game is implemented in Swift: It needs to be fast. The little optimizations\
    \ that Go cannot implement for us add up and prevent the final AI from being as\
    \ competent as it can be. This is a direct example of when better technical infrastructure\
    \ can enable a better user experience.\n\nSo, now you understand why the AI and\
    \ game logic is written in Swift. But what about the optimizer itself? It’s not\
    \ called as often as the rest of the game logic, so why not write that in Go?\
    \ The simple answer: Don’t reinvent the wheel for something so complex, and something\
    \ that thousands of people have already invested time in.\n\nA Python package\
    \ already exists that enables you to optimize with `CMA-ES` very easily. In fact,\
    \ it’s just a few function calls. But this brings us back to the beginning of\
    \ the chapter. Didn’t we say we wouldn’t cover calling interpreted languages such\
    \ as Python?\n"
  raw: 'You’re now in the know of all of the basics when it comes to calling C from
    Go. It’s time to move on to something more complex: calling Swift from Go, and
    actually building a practical application that makes sense in the real world.


    ### Interoperating with Swift


    First off, why would we ever want to call Swift from Go?


    Remember, the Go compiler is really powerful. However, Go is fine with making
    a very specific tradeoff, because it’s deemed beneficial for the kinds of codebases
    that are written in Go: the compilation speed versus runtime speed tradeoff. Go
    is okay being *really* fast at compiling your code, even if that means the compiled
    code itself may be a bit slower, or if the language is a bit less expressive because
    of it.


    Mostly, this doesn’t really matter, because the Go optimizer is really good anyway.
    But there are some optimizations you just don’t get, and that could be very beneficial
    for specific operations. For example, tail call optimizations don’t exist in Go!
    Tail call optimizations can sometimes make recursive algorithms significantly
    more efficient by making it so the recursive call doesn’t need to return back
    through the deep recursive call stack and can return back to the original caller
    instead.


    For this kind of code, you might think that writing in a language such as C becomes
    important. And while this may be true, sometimes you don’t need the level of control
    that C gives you; it can be a burden. This is why Swift, and other similar languages,
    exist.


    However, there are also some tasks that *Go* is really good at, such as concurrency.
    Or, maybe there’s a specific module that someone wrote in Go that makes a certain
    aspect of your application a lot easier to code. Sometimes, you need to leverage
    the capabilities of Go in the same application that requires code to be written
    in another language. This is when calling another high-level language, such as
    Swift, in Go can be useful.


    To demonstrate a use case where this is true, we’ll implement an application that
    uses a special “AI” to play Tetris\* automatically, and to visualize the output
    of the Tetris game in the command line. To understand how this requires an interop
    between Go and Swift, we first need to understand the game of Tetris and then
    dive deeper into the AI we’ll build.


    You’ve almost certainly played or seen someone play Tetris before, but in brief,
    Tetris is the classic game of taking falling bricks and manipulating the way they
    fall from the top of the screen to the bottom such that the bricks can make “lines”
    across the board. When you build a line, that row of the board gets cleared and
    any bricks above it get moved down.


    Figure 6.1 is a sample screenshot of an implementation of the classic Tetris game
    as someone is playing it. Because the version that we build in this chapter runs
    in the command line, it will look different.


    ![Image](Tanmay_0601.jpg)


    **FIGURE 6.1** Playing the classic Tetris game by The Tetris Company, LLC


    The specific strategy taken by the AI that we’ll build is to:


    **1.**   Look at the block that is falling and determine what all the possible
    final states are of that block on top of the other blocks—regardless of whether
    they’re good or not.


    **2.**   Use many weighted heuristics to score each possible end state to find
    out which one is the “best,” in that it enables us to have the greatest likelihood
    to maximize the score.


    **3.**   Use a pathfinding algorithm to find out how to get to that ending position.


    **4.**   Make the moves to get to that end state.


    In this way, with the right set of heuristics and weights for each heuristic,
    we can get an AI that’s really good at playing Tetris.


    The following are the heuristics we’ll implement:


    •   **Number of holes**—Gaps in the blocks that can’t be filled until the lines
    above have been cleared


    •   **Number of open holes**—Gaps in the blocks that are not covered by other
    blocks


    •   **Blocks above holes**—Number of blocks above the holes


    •   **Maximum line height**—The peak Y position of a block on the board


    •   **Last block added height**—The peak Y position of the block that we’re adding
    in this move


    •   **Number of pillars**—Columns that require a vertical line piece to fill


    •   **Blocks in rightmost lane**—The peak Y position blocks in the rightmost column


    •   **Bumpiness**—Cumulative difference of the peak Y positions between each neighboring
    column pair


    The way a certain state’s “cost” will be determined is by getting the values of
    all these heuristics, multiplying them by a weight, and summing the weighted heuristics.
    The lower the cost, the better the state is for the game as a whole.


    This brings us to the next challenge: How in the world can a human find the right
    weights to use?


    One way of doing this is to use your intuition. For example, we know bumpiness
    is bad, and so is the number of holes, but open holes are better than blocked
    holes, and we want to minimize the line height, and so on, and to guesstimate
    some numbers off of that.


    Estimation in this way is simply not scalable because we don’t understand the
    effects of how each heuristic interacts with every other heuristic. This is why
    we need a mathematical, automated way of finding the weights.


    Specifically, the solution implemented in the code is known as Covariance Matrix
    Adaptation Evolutionary Strategy (CMA-ES). This is an algorithm commonly used
    when you have a non-differentiable function, or if the derivative doesn’t make
    sense to optimize against. That is exactly the case in this scenario—it doesn’t
    make sense to differentiate through the Tetris board, even if you could. Therefore,
    we use CMA-ES to find the best weights possible.


    The algorithm starts with each weight being just 1—meaning we just sum together
    the outputs from the heuristics. As you can imagine, this set of weights results
    in chaotic behavior that doesn’t make much sense. However, through a trial-and-error
    optimization method, CMA-ES quickly finds a solution that can get over *4,000,000*
    lines cleared! Plus, the optimization only takes under 12 hours to complete.


    Something you should keep in mind, however, is that just simulating the game in
    memory, with no UI rendering, in which the AI got 4,000,000 lines cleared, took
    over 4 hours. That is a *lot* of time, even if the AI got an insanely high score.
    However, it’s also a *lot* faster than other implementations out there on the
    internet, mostly because:


    •   It’s written in Swift, so it’s compiled and optimized by the best compiler
    infrastructure in the world.


    •   No UI rendering occurs, and the game is played entirely in memory.


    Also, because the optimization requires you to simulate a full game, the faster
    we can simulate games, the faster we can find a set of weights that is good, and
    the more time we can dedicate to the optimization, resulting in even better weights,
    meaning a better AI.


    In order to simulate games faster, you need an implementation of the game logic
    itself that is fast. This brings us to why the game is implemented in Swift: It
    needs to be fast. The little optimizations that Go cannot implement for us add
    up and prevent the final AI from being as competent as it can be. This is a direct
    example of when better technical infrastructure can enable a better final user
    experience.


    So, now you understand why the AI and game logic is written in Swift. But what
    about the optimizer itself? It’s not called as often as the rest of the game logic,
    so why not write that in Go? The simple answer: *Don’t reinvent the wheel for
    something so complex, and something that thousands of people have already invested
    time in.*


    A Python package already exists that enables you to optimize with CMA very easily.
    In fact, it’s just a few function calls. But this brings us back to the beginning
    of the chapter. Didn’t we say we wouldn’t cover calling interpreted languages
    such as Python?'
