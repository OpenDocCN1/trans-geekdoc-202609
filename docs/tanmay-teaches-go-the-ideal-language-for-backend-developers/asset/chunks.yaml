    strings aren’t technically one piece of data. They’re a list—an array—of multiple
    independent pieces of data, which we call characters. What’s worse is that what
    we consider, as humans, to be a single “character” may not be represented by a
    single byte, as in the case of emoji or other Unicode characters.


    In C, strings are represented as raw arrays of 8-bit signed integers, called “char[\*](#ch6.xhtml#fn1)”
    (or “pointer to a character buffer”). The last, terminating value in these strings
    is usually a byte with all bits set to OFF (to 0), which acts as a “null terminator”;
    thus, the name “null terminated strings.” This tells us when the string buffer
    actually ends so we don’t need to keep track of the length alongside the buffer
    forever.


    In Go, translating a Go string to a C string is quite easy with the help of the
