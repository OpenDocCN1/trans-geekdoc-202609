    We know there is some basic information we need to have for this to work, such
    as how nodes are connected to each other, the cost of moving from one node to
    another, and the directions of the connections. In order to encode this information
    in Go, we’ll use the following three structures:


    ![Image](p81.jpg)


    The “Node” structure contains the information for a single node, which is basically
    the other nodes it connects to, plus the name of the node.


    The “Edge” structure contains a pointer to the node it comes from, a pointer to
    the node it goes to, and the cost of deciding to take that connection.


    The “Graph” structure only contains a single value, which is the map of node names
    to the pointers to the nodes themselves.


    We also define a very small helper function to let us create a new Graph structure
    instance and get a pointer to it:


    ![Image](p82.jpg)


    Before we can start coding the fun pathfinding, we need to write some infrastructure,
    so users are able to interact with the actual pathfinding algorithm. This means
    they must be able to take a graph of theirs and somehow represent it using the
    three structures we defined earlier.


    We’ll use the following two functions to help them do that:


    ![Image](p83.jpg)


    These functions are mostly self-explanatory. We add two pointer receiver functions
    to the Graph type, one for adding new nodes with no links, and one for adding
    links to existing nodes.


    If you want to add nodes, all you do is, for each node you create a new node,
    assign it a name and no edges, get a pointer to that node, and assign that pointer
    as a value in the nodes map within the graph you called the function on.


    If you’d like to add a link, all you do is get the nodes from the graph, and append
    a new edge to the links of the first node.


    Now let’s implement the actual pathfinding! First, how do we represent the costs
    and nodes? Well, we already have a structure for the nodes, and for the sake of
    simplicity, we’ll use the `uint` datatype for the costs instead of `float`. This
    raises an issue though: How can we represent infinity with an integer?


    Floating point values have a certain set of bits that represent the infinity value,
    but the same is not true for integers. Therefore, to represent infinity, we’ll
    simply use the maximum value an unsigned integer can hold in Go. So, create a
    global constant containing this max value:


