    The following is the signature for the `CString` function:


    ```

    func C.CString(string) *C.char

    ```


    Now let’s use a slightly more complex C function in Go. Specifically, let’s define
    a function that simply takes a null terminated string and prints it out. Here’s
    all the code you’ll need to do that:


    **CODE LISTING 6.4** Passing character pointers to C from Go


    ![Image](p177.jpg)


    As you can see, the logic is quite simple. First, we implement the C code in comments
    before the import of the cgo module. The C function simply takes a character pointer
    and passes that to the `printf` function, along with a format string telling it
    to print the character pointer followed by a new line.


    However, you need to do a bit more work in the main function. The first thing
    is to convert the Go string to a C string, which is done by `C.CString("This is
    from Golang"`). Then, pass it as an argument to the C function, just as you would
    to any other Go function.


    Because you’re in control of the memory manually, you also need to free the buffer
    yourself. Remember, though, that the C string is a character pointer, not just
    a generic pointer. The C free function also technically expects a generic pointer
    with no type information attached to it. Because Go is strict with types, you
    need to use the Pointer function in the unsafe module to erase the type associated
    with the C string. Then, you can pass it to the free function, and you’re good
    to go!


    One more thing—the definition of the free function is the reason we had to also
    include `stdlib.h` in the C code this time alongside `stdio.h`. Without that header,
    there would be no way for us to free the memory we allocated.


    If you were to run this code, you should see “This is from Golang” printed to
    your terminal. Thus, the string is internally passed from Go to C, printed, and
    then the memory is freed.


    Taking return values that come from C functions and translating them back into
    types that Go can understand is also pretty simple. For example, if you were to
    *return* a string (character pointer), you can convert it to a Go string like
    so:


    **CODE LISTING 6.5** Converting a C string to a Go string


    ![Image](p178.jpg)


    In this case, you don’t need to free the character pointer returned from C because
    that value was never allocated on the heap in the first place. It was only stored
    on the stack. However, if the buffer originated as the result of a call to `malloc(1)`,
    then the `free` is required.


    One last thing you should know about—you are allowed to instruct the C compiler
    to compile the code you insert in your comments however you’d like it to. So,
    for example, if you want to pass a specific compile flag, you can do so using
    the `CFLAGS` parameter.


    Let’s say you’re writing a function to tell whether or not a number is “ugly,”
    meaning its prime factors include only 2, 3, and 5. These are the first 20 ugly
    numbers:


    ```

    1, 2, 3, 4, 5, 6, 8, 9, 10, 12, 15, 16, 18, 20, 24, 25, 27, 30, 32, 36

    ```


    The following could be some C code to achieve this:


    **CODE LISTING 6.6** Code to get the nth ugly number in C


    ![Image](p179.jpg)


    Using the `getNthUglyNumber` function, you can get the nth ugly number. For example,
    the 10th ugly number is 12. The 20th is 36. This algorithm can definitely be improved,
    but let’s roll with this one for now.


    Write the following Go code to wrap the C code:


    **CODE LISTING 6.7** Calling the ugly number code from Go


    ![Image](p180.jpg)


    ![Image](p181-1.jpg)


    Notice that there is one significant difference between this code and the code
    we’ve written previously using cgo. It’s in the first line of C code: We’re telling
    cgo to pass a flag “-O0” to the C compiler using the CFLAGS variable. This flag
    tells the C compiler “Don’t optimize the code at all! Do as much of a direct code
    to assembly translation as possible.”


    When you run this code, the process of finding the 1000th ugly number will take
    about 1.7 seconds on a MacBook Pro with an Intel i9. That’s a long time! If, however,
    you were to change the flag at the top of the code from O0 to Ofast, like so:


    ```

    //#cgo CFLAGS: -Ofast

    ```


    You should see that the code now only takes about 0.4 seconds to execute on the
    same machine. Compiler optimizations are powerful, and using the CFLAGS variable,
    you can pass these and any other GCC flag to the compiler.


    By the same logic, you can also pass flags to the “linker,” which is responsible
    for telling the operating system which shared libraries your executable needs
    to call code from (or “is linked to”).


    To test this out, write the following C code into a file named “factorial.c”:


    ![Image](p181-2.jpg)


    You don’t need any includes or a main function, because we will simply compile
    this code, which calls no other function but the one that it defines, into a shared
    library. Use the following compile command to do this:


    ```

    clang factorial.c -shared -fPIC -o libcfactorial.dylib

    ```


    Now you should have a file containing the binary machine code for the factorial
    function. In order to call this from Go, the following is all you have to do:


    **CODE LISTING 6.8** Linking against a shared library and calling a C function
    from Go


    ![Image](p182.jpg)


    There are only two lines of comments for cgo, and this is what they do:


    **1.**   The first one tells the linker “look for shared libraries in the directory
    in which the code is being compiled, and specifically link against a library called
    ‘`cfactorial`’.”


    The real filename of the library is “`libcfactorial.dylib`”, but the linker ignores
    the “`lib`” in the beginning and the “`.dylib`” at the end.


    **2.**   The second one says “I don’t know how this function works, but I know
    there is a function somewhere in the program called factorial, it returns a 32-bit
    signed integer, and takes a single 32-bit signed integer as an argument.”


    This function’s actual machine code is already compiled in the library that we
    built in the previous step.


    To be even more clear, remember that when you now compile your Go code, you will
    *not* be compiling the factorial function. You already did that compilation when
    you ran the clang command manually. Instead, you’re now telling Go to link against
    the precompiled version of the factorial function.


    When you build and run the Go code, you should see it print out the factorial
    of 5:120.'
