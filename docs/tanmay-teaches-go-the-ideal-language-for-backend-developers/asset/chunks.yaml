    Go 能够 `Docker` 和 `Kubernetes` 等流行服务的后端，并且 Go 能够通过 `Goroutines` 进行扩展，加之它还支持如此多的架构且极其轻量，这使其成为构建大型复杂服务微服务架构的完美语言。


    最后，Go 还有几个加分项，虽然这些本身并非独有，但它们让用 Go 编写代码比其他语言更方便：


    - Go 不仅支持大量的架构和操作系统，你还可以通过仅向 Go 传递几个额外的编译标志，从任何架构为任何架构进行交叉编译！不需要安装任何额外的库。试着用 `Clang`
    这样做看看吧！在 `Ubuntu` 上，你可能会陷入 `Aptitude` 依赖地狱中，至少浪费上几分钟，甚至几个小时。

    - Go 拥有一个实验性的 `LLVM` 后端，允许你将 Go 代码编译为 `LLVM`，以防你的用例可以从模块化 `LLVM` 编译器的优化或灵活性中受益。


    上述文本初步预览了 Go 的世界以及它的特殊之处，但我们才刚刚开始。接下来，在第 2 章中，我们将安装 Go，查看一些基础的 Go 结构，让你熟悉 Go 的标准和语法，并深入构建一些应用！


    ## 练习题


    **1.** 谁创建了 Go？目的是什么？


    **2.** 在你看来，哪三个主要因素会使 Go 成为你的首选编程语言？


    **3.** 编程语言分配和回收内存的四种常见方式是什么？它们的优缺点是什么？


    **4.** Go 有哪些缺点？


    **5.** 为什么 Go 的运行时（runtime）是如此独的？


    ## 第 2 章


    ## 快速入门


    让我们开始吧！但在进入有趣的部分（即编写代码）之前，确保我们拥有一个一个可以编写 Go 代码、编译它并运行它的环境至关重要。


    一旦设置好环境，我们将查看 Go 语言的一些基础构建块，例如不同类型的控制流以及它们是如何协同工作的。


    在完成本章后，你将能够回答以下问题：


    - 如何在 Windows、Linux 或 macOS 上安装 Go？

    - 如何找到从源码安装 Go 方法？

    - Go 中的基础控制流是如何运作的？


    ### 安装 Go


    与大多数语言一样，在系统上安装 Go 只需要运行几个系统命令一样简单。我们将探索三种安装 Go 的方法：


    - 使用系统包管理器

    - 手动安装预编译的二进制文件

    - 从源码编译 Go


    ### 使用系统包管理器


    安装 Go 最简单的方法（就像任何其他程序一样）是使用系统内置的包管理器。遗憾的是，Windows 不带功能全的内置包管理器，这也是它可能不是后端开发人员理想系统的原因之一。但在
    Linux 和 macOS 上，你可以使用表 2.1 中解释的包管理器和命令。


    **表 2.1** 使用内置包管理器安装 Go 的命令


    ![Image](img/t2.1.jpg)


    遗憾的是，包管理器发行版仅由社区支持，并非 Go 团队的官方支持。虽然这种方法更方便，但对于可能需要特定版本 Go 的真实生产负载，我们建议下载预编译的二进制文件。


    ### 手动安装预编译二进制文件


    安装预编译二进制文件的具体过程取决于你运行的平台。我们将以 Ubuntu 和 macOS 为例，但如果你想查看针对你特定平台的说明，请访问 Go 官网：[`golang.org/doc/install`](https://golang.org/doc/install)。


    安装预编译二进制文件主要分为几个关键步骤：


    1. 下载二进制文件

    2. 解压二进制文件

    3. 更新你的 `PATH`，以便 shell 能够找到该二进制文件


    你可以从 [`golang.org/dl`](https://golang.org/dl) 下载 Go 及其配套工具。


    对于 Linux，下载后你将得到一个 `.tar.gz` 文件。解压它的方法之一是通过命令行：


    ```

    tar -xvf go1.14.6-linux-amd64.tar.gz

    ```


    **注意：** 我们在上一个命令中硬编码的版本 `1.14.6` 需要根据你下载的版本或存档名称进行替换。


    这将为你提供一个 `go` 文件夹，其下有一个 `bin` 文件夹，其中包含了 `go` 二进制文件——这是处理所有与 Go 相关事务所需的唯一工具！然而，每次都使用绝对路径手动调用该
    Go 二进制文件非常不方便。因此，在解压时，请使用此命令：


    ```

    tar -C /usr/local -xvf go1.14.6-linux-amd64.tar.gz

    ```


    这将 `go` 文件夹解压并移动到你的 `/usr/local` 。接下来，向 `$HOME/.profile` 文件添加以下行：


    ```

    export PATH=$PATH:/usr/local/go/bin

    ```


    ### 从源码编译 Go


    从源码编译 Go 和工具要激烈得多。


    **注意：** 为了让你对性能有一个直观感受，Go 本身是用 Go 编写的。


    要学习如何从源码编译 Go，请访问他们的 GitHub Wiki 页面：[`github.com/golang/go/wiki/InstallFromSource`](https://github.com/golang/go/wiki/InstallFromSource)。


    ### Go 基础概念


    现在是时候深入学习你作为 Go 开发者每天都会使用的的核心概念了。这些核心概念包括基础控制流、项目结构、函数和结构体等高级功能的语法，以及错误处理。让我们开始吧！


    ### 约定项目结构


    与其他某些语言不同，Go 对项目布局没有非常严格的。但是，存在大多数项目都会遵循的标准，这有助于开发者理解代码库的结构以及代码的功能。


    在讨论项目布局之前，有一个重要的术语你需要理解：包（packages）。一个 Go 包是一个单一源代码文件。这些包的标准是：包名与文件名相同（不包含扩展名）。

