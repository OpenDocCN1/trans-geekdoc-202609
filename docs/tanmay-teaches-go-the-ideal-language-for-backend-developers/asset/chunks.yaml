    四个嵌套循环中的第一个（最外层循环）负责从一行的开头移动到末尾。第二个内部循环负责从一行移动到另一行。每当我们遇到无法获取值的行或列时（例如越界内容），我们都会跳过该迭代。如果我们发现某行或列的索引与我们正尝试计算邻居的单元格索引相同，我们也会跳过它。


    然而，如果这些保护条件都没有被触发，并且我们处于一个有效索引处，我们就会查看邻居的值，如果它是“活”的，我们就会增加 `“neighbors”` 数组中该单元格的值。


    在继续之前，让我们创建一个名为 `GameOfLife` 的结构，它包含一个代表环境当前状态的游戏板、我们要在该游戏板上渲染的像素，以及游戏板本身单元格的大小。这是因为单个单元格不仅仅是一个像素，那样会太微小了——相反，每个单元格在屏幕上将有一个特定的“尺寸”，这正是我们需要存储的内容。


    ![Image](img/p101.jpg)


    此外，让我们创建一些简单的辅助函数，可以创建一个带有空游戏板的新 Game of Life 实例，以及一个可以用随机单元格填充游戏板的函数，这意味着它们都有
    50/50 的概率死亡或存活：


    ![Image](img/p102.jpg)


    ![Image](img/p103.jpg)


    现在，让我们创建一个函数，根据我们在在本节之前定义的条件以及我们刚刚定义的 `countNeighbors` 函数的输出，帮助我们实际运行康威生命之游戏的单次迭代。


    在这个函数内部，我们还更新了画布本身。由于我们只是在更新自己创建的画布，而不是实际上渲染到屏幕上，所以速度极快，而且几乎不增加任何开销。


    ![Image](img/p104.jpg)


    这段代码也非常简单。它实现了一个指向 `GameOfLife` 结构的指针接收器，不接受额外参数，也不返回任何内容，因为它修改了传递给它的原始结构体。


    在函数内部，我们计算游戏板上每个单元格的所有“存活”邻居，然后遍历游戏板中的每个 Y 索引。我们在每次迭代中对游戏板进行下标索引获取该行，并遍历该行中的每一列。如果单元格是活着的且邻居数量为
    2 或 3，我们保持该单元格原状。否则，如果邻居数量为 3，我们将该单元格变为存活。再次，如果之前的没有任何条件评估为真，我们将该单元格变为死亡。


    每当我们更改单元格的生存状态为存活或死亡时，也要在像素中进行相应的更改。


    最后，让我们将所有内容整合到一个主函数中，该函数创建一个用于渲染像素的画布，创建生命之游戏，运行迭代并更新画布。一旦窗口关闭，生命之游戏的迭代将结束，程序也将之退出。


    ![Image](img/p105.jpg)


    你的代码现在看起来应该是这样的：


    **代码列表 4.2** “康威生命之游戏”应用程序


    ![Image](img/p106.jpg)


    ![Image](img/p107.jpg)


    ![Image](img/p108.jpg)


    ![Image](img/p109.jpg)


    当运行运行程序时，你应该看到一个类似 图 4.6 的窗口，其中生命之游戏正在混乱地杀死和产生（出生）新细胞！


    ![Image](img/Tanmay_0406.jpg)


    **图 4.6** 运行中的生命之游戏应用程序快照


    太棒了！你不仅用 Go 构建了一个真实的应用程序，还为它构建了整个图形界面！现在，我们很抱歉，但我们让你构建另一个*没有*用户界面的应用程序。担心——这仍然很有趣——我们将实现世界上最火热的技术之一的构建块：区块链！


    ### 工作量证明


    这个示例应用程序的名字和逻辑听起来比实际上要吓得多——基本思想其实非常简单！我们本质上是在通过暴力破解来获取一个数学上无法计算的值。


