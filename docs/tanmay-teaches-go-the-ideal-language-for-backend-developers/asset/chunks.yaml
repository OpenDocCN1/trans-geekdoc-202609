    keyword, we have a new argument name and type annotation in parentheses before
    the rest of the usual function signature. This tells Go “make this an instance
    method on the `User` `structure`, and pass that instance into the function with
    the name ‘`user`’.”


    Now, you can call this function like so:


    ![Image](p48.jpg)


    This will print:


    ```

    Kathy is 19 years old!

    ```


    Great! Now, for some extra practice, let’s port over the `incrementAge` function
    to an instance method:


    **CODE LISTING 2.22** Mutating a structure using a value receiver


    ![Image](p49.jpg)


