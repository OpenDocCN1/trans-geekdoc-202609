    现在，如果你想确定从 A 到 D 的最佳路径，你只需要遵循字典：D 的父节点是 B，B 的父节点是 . . . A！所以 A ![Image](img/arrow.jpg)B
    ![Image](img/arrow.jpg)D 是从 A 到 D 最廉价的方式。


    虽然这是一个非常简单的例子，用于演示你如何使用 Dijkstra 算法确定图中的最短路径，但这段代码也可以用于更大规模的应用程序。此外，在实现此演示过程中学到的概念将对你应用
    `Go` 的旅程有所帮助。


    ### 康威生命游戏


    康威生命游戏在数学和技术社区中是一个非常受欢迎的游戏。它不像你的传统游戏——它的特殊之处在于它是一个`零玩家` 游戏。这意味着在你第一次设置它之后，你就无法再修改环境或状态。


    它是由数学家约翰·康威（John Conway）于 1970 年发明的。从技术上讲，生命游戏是一种“细胞自动机”，这意味着该游戏由一组细胞组成，根据某些数学规则，这些细胞将生存、死亡或繁殖。


    真正有趣的是，你可以从一个非常简单的初始状态获得非常复杂的行为。例如，以图 4.4 中的网格为例。


    ![Image](img/Tanmay_0404.jpg)


    **图 4.4** 游戏开始时的“康威生命游戏”示例网格


    这是一个网格，实际上是细胞的集合。每个灰色的细胞都是“死的”，所有的黄色细胞都是“活着的”。在每次迭代中，你使用一些规则来决定细胞应该死亡、变为活跃还是保持不变。在这个特定的初始设置下，使用康威规则，你应该看到黄色细胞无限地向网格的右下角移动。


    观察生命游戏运行的静态图像并不能体现它的魅力。去 Edwin Martin 的网站查看该游戏的在线实现：[www.bitstorm.org/gameoflife](https://www.bitstorm.org/gameoflife)是非常值得的。


    现在，让我们来看看如何用 `Go` 实现这个游戏！但首先，让我们快速过一遍我们的规则：


    **1.** 如果细胞已经是活着的


    **a.** 如果它有少于 2 个活着的邻居，它就会死亡。

    **b.** 如果它有 2 个或 3 个活着的邻居，它将保持活跃。

    **c.** 如果它有多于 3 个活着的邻居，它就会死亡。


    **2.** 如果细胞已经是死的


    **a.** 如果它恰好有 3 个活着的邻居，它将变为活跃。


    这些规则简单得具有欺骗性——它们不仅产生了视觉上有趣的行为，它们甚至是`图灵完备`的！你可以在单个初始生命游戏状态中实现一个计算器、`Go` 编程语言或任何可计算的任务。


    在这个示例应用程序中，我们将采取稍微不同的方法。我们将构建一个图形用户界面，这样你就可以实际上看到生命游戏在做什么。为了这一点，我们需要一些额外的导入。具体来说，我们将使用一个名为“pixel”的包。以下是我们需要的所有导入项：


    ![Image](img/p96.jpg)


    我们还将创建一个结构，负责存储渲染到屏幕上的信息。它只存储两个非常简单的信息：我们正在渲染的像素和屏幕宽度。我们只存储宽度而不存储高度，是因为我们不需要它来计算像素的索引。我们稍后会探讨这一点。


    需要注意的是：像素的存储方式是在单个的一维无符号 8 位整数数组中。每个像素在数组中有四个值，顺序如下：红、绿、蓝、Alpha。你可能对 RGB 熟悉，而
    Alpha 表示透明度。


    ![Image](img/p97.jpg)


    在继续之前，请理解我们不存储高度。这是因为当我们根据给定的 `(x, y)` 查找 `Pix` 数组中像素的索引时，我们使用公式：


    ```

    index = y * width + x

    ```

