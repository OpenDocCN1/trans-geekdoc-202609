    正如我们提到的，此函数接收两个独立的通道：一个输入通道和一个输出通道。在函数内部，我们遍历输入通道的方式就像我们遍历几乎任何其他序列（如字典或数组）一样。然而，Go
    在幕后执行的操作略有不同。当通道中没有值时，`for` 循环会阻塞并开始等待新的数据点。当它找到一个数据时，`for` 循环会继续迭代，并在最后跳转回循环顶部。


    在 `for` 循环内部，我们只做了一件简单的事情：我们将 `xx`（即我们从输入通道获取的整数）平方，然后使用 `<-` 运算符将该平方值放入输出通道中。


    如你所见，将此函数修改为使用通道是非常简单。然而，`main` 函数仍然需要更多的架构重构：


    ![Image](img/p144-1.jpg)


    让我们再次逐节分析 `main` 函数。


    我们从前两行代码开始，它们负责使用 `make` 函数创建输入和输出 `channels`（通道），我们在第 2 章 中曾用过该函数来创建数组：


    ```

    inputChannel := make(chan int)

    ```


    ```

    outputChannel := make(chan int)

    ```


    然后，我们在单独 Goroutine 中运行 `squareIt` 函数：


    ```

    go squareIt(inputChannel, outputChannel)

    ```


    此时，该函数正在后台运行，由于 `for` 循环的存在，它正在等待数据通过输入通道传入。


    为了向输入通道提供数据，我们简单地从 0 循环到 9，并在每次迭代中将该数字置于输入通道中：


    ![Image](img/p144-2.jpg)


    此时，由于我们已经将数据放入通道，我们预计 `squareIt` 函数已经取了这些数据并将其置于输出通道中。然后，我们需要遍历输出通道以从 `squareIt`
    函数获取数据并将其打印出来，这样我们也能看到输出结果：


    ![Image](img/p145-1.jpg)


    如果你到为止一直非常专注，你可能已经注意到程序中存在一个 bug。如果你已经了解了通道的工作原理，你可能还发现了程序中的*另一个* bug。不过，让我们先继续运行这段代码，等我们遇到这些问题时再确定它们具体是什么。


    以下是最终代码：


    **代码列表 5.2** 数字平方应用程序的并发实现


    ![Image](img/p145-2.jpg)


    首先，编译程序。注意，它编译时没有错误。然而，当你运行代码时，在大多数系统上你会看到类似这样的错误：


    ![Image](img/p146.jpg)


    好了，我们知道程序的逻辑存在问题。事实上，Go 在这里给了我们一个非常清晰的错误信息；我们遇到了所谓的*死锁*（deadlock）。当你的所有线程都在等待另一个线程执行某些操作时，就会发生死锁，导致没有线程有机会执行其他线程正在等待的事情。

