  raw: "*Tanmay Teaches Go* is intended to make the Go programming language easily\
    \ accessible and approachable for every developer. Go, as a language, is built\
    \ with modern backend development in mind. As Moore’s Law comes to an end, it’s\
    \ no longer enough to expect better and faster computers. Therefore, we must adapt\
    \ to the new normal: large-scale, distributed systems, running highly optimized\
    \ software stacks.\n\nThese distributed systems, with their fundamentally different\
    \ hardware ideology, have also forced the software world to innovate and change\
    \ as well. Modern software systems are moving away from large, monolithic designs.\
    \ Rather, they’re powered by lots of smaller *microservices*, enabling greater\
    \ reuse of code across projects, and a delegation of responsibilities—all of which\
    \ results in cleaner code with smaller surface area for bugs.\n\nAs the software\
    \ world has had to evolve, the demand for the right infrastructure for this new\
    \ paradigm has grown, resulting in brand new *programming languages*, developed\
    \ from the ground up, to meet that demand. Go is one of these languages, having\
    \ specific traits suitable for microservices-based software development, such\
    \ as fast compile times, small binary sizes, and portability. There are also special\
    \ features that no other language can really match, such as Goroutines and channels,\
    \ for powerful, easy-to-use concurrency.\n\nGo is the engine behind many of the\
    \ infrastructural services in backend development, such as Kubernetes, Docker,\
    \ etcd, CockroachDB, and more. By using the same language that these popular tools\
    \ are already built in, your code is closer to, and can take better advantage\
    \ of, the large ecosystem of open source code meant for enterprise-level backend\
    \ development.\n\nThrough this book, we hope to turn you into *Go developers*,\
    \ so you have the capability to leverage Go as a tool in your problem-solving\
    \ toolbox. The best part is that Go isn’t just any other tool. It’s a tool that\
    \ can be applied to solve *enterprise-level* problems; therefore, it’s a prime\
    \ candidate to be your first choice to write code in.\n\nOur goal is not only\
    \ to teach you the Go language, but take an approach that, at every step, contrasts\
    \ and compares Go to other popular programming languages used for similar tasks,\
    \ such as Swift, C, Python, and Java. We even go down to the operating system\
    \ and CPU level to show you exactly how these languages interact with your computer’s\
    \ hardware and software. The purpose for this is twofold:\n\n•   We want to make\
    \ it easy for developers coming from other languages to transition to the world\
    \ of Go.\n\n•   We want you to derive insight from the decisions made by other\
    \ programming languages and the low-level architecture of our computers. This\
    \ helps you better understand which tasks Go is and is not well-suited for, as\
    \ well as how it works internally and why it works that way.\n\n*Tanmay Bakshi*\
    \  \n\n*Baheer Kamal*\n\n## Acknowledgments\n\nI’d like to say a huge thank you\
    \ to my family and my mentors for their unconditional support, which keeps me\
    \ motivated. Special thanks to the wonderful team at McGraw Hill for supporting\
    \ me as I wrote the second of many books to come in the *Tanmay Teaches* series.\
    \ I’d especially like to thank Lara Zoble at McGraw Hill for providing me with\
    \ the support, advice, and feedback I needed to make this a success. She is the\
    \ brain behind the creation of the *Tanmay Teaches* series.\n\nThe idea of authoring\
    \ a book on Go originated when my co-author, Baheer, and I were writing code for\
    \ a project. We both had the same objective: to sift through and massage large\
    \ binary files. I implemented in Swift, and he implemented in Go. On the very\
    \ first run, Go blew Swift out of the water in both compile-time and run-time\
    \ benchmarks! Not only that, the code was more intuitive. This inspired me to\
    \ write a book on the Go language, its strengths, why it works, and where to apply\
    \ it. My special thanks to Baheer for being with me on this journey!\n\n*Tanmay\
    \ Bakshi*\n\n## CHAPTER 1\n\n## Introduction\n\nWelcome to *Tanmay Teaches Go*!\
    \ In this book, the second in the Tanmay Teaches series, you will learn about\
    \ the world of Go programming. Go is a programming language designed with safety,\
    \ performance, flexibility, and *concurrency* in mind. Its design goals fundamentally\
    \ align with the needs of backend development, where Go has found the most value.\n\
    \nOnce you’ve finished this chapter, you’ll be able to answer the following questions:\n\
    \n•   What are Go’s design goals that make the Go language special, and what are\
    \ some of its drawbacks?\n\n•   What platforms does Go support, and where can\
    \ it be used?\n\n•   Why is Go’s compiler so special?\n\n•   What are Go’s memory\
    \ management and its Garbage Collector?\n\n•   How does concurrency make the Go\
    \ runtime so unique?\n\n### Why Go?\n\nGo is a language built with a very specific\
    \ purpose in mind: to ease the entire workflow of a backend developer—all the\
    \ way from speed of execution, speed of compilation, and dependency management,\
    \ to concurrency and optimization. To achieve this vision, the Go team has built\
    \ the language spec with a few key design goals in mind.\n\n### What Are Go’s\
    \ Design Goals?\n\nGo was developed by Google back in 2009, and the first stable\
    \ version was released to the public in 2011. The language was designed by Robert\
    \ Griesemer, Rob Pike, and Ken Thompson. Go is known for its mascot: the Gopher,\
    \ as shown in [Figure 1.1](#ch1.xhtml#fig1_1)!\n\n![Image](Tanmay_0101.jpg)\n\n\
    **FIGURE 1.1** “Gopher”: The Go mascot\n\nGo emerged as a solution to a number\
    \ of problems that Google was facing. On the compilation front, for example, the\
    \ majority of compilers were too slow to compile Google’s large codebases in a\
    \ reasonable amount of time.\n\nOn the implementation front, languages such as\
    \ C++ proved to be too low level and verbose, and languages such as Java proved\
    \ to be too high level and heavyweight (with the baggage of the JVM and the latency\
    \ introduced by the Garbage Collector).\n\nGoogle decided the best way to solve\
    \ these problems was to, well, develop their own language!\n\nGoogle’s design\
    \ goals for Go were as follows:\n\n•   Create a compiler that works on large codebases\
    \ as fast as possible\n\n•   Create a compiler that generates fast code using\
    \ a good set of optimizations\n\nGo delivers on exactly those goals. The compiler\
    \ has proven to be very fast. To enforce this kind of speed, the compiler inherits\
    \ a few key traits:\n\n•   It’s incredibly strict with your code; unused variables\
    \ and imports, for example, are *errors*, not *warnings*.\n\n•   The compiler\
    \ architecture is *simple*. The majority optimizations, for example, take place\
    \ on the compiled assembly code, not on an internal intermediate representation\
    \ of the Go code (as in Swift, C, C++ compiling through LLVM).\n\n•   Assembly\
    \ is generated directly in binary form, instead of being generated as text and\
    \ compiled to binary.\n\nNot only is the compiler itself fast, it’s also able\
    \ to generate fast-running code because of the way the language is structured.\
    \ By keeping language features and syntactic sugar slim, the optimizer within\
    \ the compiler has less work to do analyzing complex control flow and logic. This\
    \ means that Go code can be quite terse at times, but the result is fast compiled\
    \ code that you get quickly.\n\nAt the same time, due to the strictness of the\
    \ compiler, you also inherit safety. In more complex languages that are known\
    \ for their best in class safety features, such as Swift, implementing that safety\
    \ requires quite a bit of extra overhead in the compiler and some overhead in\
    \ the runtime. However, because Go syntax is very minimal, safety is simple to\
    \ implement in both compile-time and runtime.\n\n### Where Can I Use Go?\n\nGo\
    \ is also *highly compatible* across all sorts of platforms! For example, it supports:\n\
    \n•   Linux\n\n•   BSDs (Berkeley Software Distributions)\n\n•   DragonFly BSD/FreeBSD/OpenBSD/NetBSD,\
    \ etc.\n\n•   Darwin\n\n•   macOS/iOS/watchOS/tvOS, etc.\n\n•   Plan 9\n\n•   IBM\
    \ i\n\n•   Solaris\n\n•   Windows"
