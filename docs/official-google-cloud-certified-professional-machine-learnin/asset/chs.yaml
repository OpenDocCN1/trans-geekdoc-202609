  \n### 第 8 章 模型训练与超参数调优\n\n在本章中，我们将讨论各种文件类型以及它们如何在 GCP 中存储和摄取用于 AI/ML 工作负载。然后我们将讨论如何使用\
  \ Vertex AI 训练模型。Vertex AI 训练支持 scikit-learn、TensorFlow、PyTorch 和 XGBoost 等框架。我们将讨论如何使用预构建容器和自定义容器训练模型。我们还将介绍为什么以及如何对机器学习的数据和模型进行单元测试。然后，我们将介绍超参数调优以及\
  \ Google Cloud 中可用的各种超参数搜索算法。我们还将介绍 Vertex AI Vizier 以及它与超参数调优的区别。我们将讨论如何使用 Vertex\
  \ AI 指标、Vertex AI 交互式 Shell、TensorFlow Profiler 和 What-If Tool 跟踪和调试 Vertex AI 中的训练模型。最后，我们将讨论数据漂移、概念漂移，以及何时应该重新训练模型以避免漂移。\n\
  \n#### 将各种文件类型摄取到训练中\n\n训练数据可以是多种类型，例如：\n\n*   结构化数据，如来自本地数据库的表或 CSV 文件\n*   半结构化数据，如\
  \ PDF 或 JSON 文件\n*   非结构化数据，如聊天记录、电子邮件、音频、图像或视频\n\n此外，这些数据可以是批处理数据，也可以是实时流数据——例如，从物联网\
  \ (IoT) 传感器流式传输的数据。而且，数据可以很小（如几兆字节），也可以达到 PB 级规模。正如您在前几章中所学，在训练数据之前，清理和转换数据非常重要，以便您可以对其应用\
  \ ML 训练。Google Cloud 分析产品组合提供了收集、存储、处理和分析这些数据的工具，如图 8.1 所示。\n\n![图 8.1 Google Cloud\
  \ 数据和分析概览](img/c08f001.png)\n\n**图 8.1** Google Cloud 数据和分析概览\n\n让我们看看各个步骤。\n\n\
  ##### 收集\n\n如果您需要从各种来源（如 IoT 设备、电子商务网站或任何第三方应用程序）收集批处理或流数据，可以通过 Google Cloud 服务完成。\n\
  \n*   **用于实时流式传输的 Pub/Sub 和 Pub/Sub Lite**：`Pub/Sub` 是一种无服务器的可扩展服务（1 KB 到 100 GB，性能一致），用于消息传递和实时分析。`Pub/Sub`\
  \ 可以在全球范围内进行发布和订阅，无论您的摄取或处理应用程序位于何处。它与处理服务 (`Dataflow`) 和分析服务 (`BigQuery`) 深度集成。您可以使用\
  \ `Pub/Sub` 直接从第三方将数据流式传输到 `BigQuery`。`Pub/Sub Lite` 也是一种无服务器产品，但针对成本而非可靠性进行了优化。`Pub/Sub\
  \ Lite` 适用于负载更可预测且一致的工作负载。\n\n*   **用于将本地 Oracle 和 MySQL 数据库迁移到 Google Cloud 数据存储的\
  \ Datastream**：`Datastream` 是一种无服务器且易于使用的变更数据捕获 (CDC) 和复制服务。它允许您跨异构数据库和应用程序可靠地同步数据，且延迟和停机时间极短。`Datastream`\
  \ 支持从 Oracle 和 MySQL 数据库流式传输到 `Cloud Storage`。`Datastream` 与 `Dataflow` 集成，并利用 `Dataflow`\
  \ 模板将数据加载到 `BigQuery`、`Cloud Spanner` 和 `Cloud SQL` 中。\n\n*   **BigQuery Data Transfer\
  \ Service**：您可以使用 `BigQuery Data Transfer Service` 从以下来源将数据加载到 `BigQuery`：\n   \
  \ *   数据仓库，如 `Teradata` 和 `Amazon Redshift`\n    *   外部云存储提供商 `Amazon S3`\n    *\
  \   Google 软件即服务 (SaaS) 应用，如 `Cloud Storage`、`Google Ads` 等\n\n配置数据传输后，`BigQuery\
  \ Data Transfer Service` 会定期自动将数据加载到 `BigQuery` 中。\n\n##### 处理\n\n从各种来源收集数据后，您需要工具在数据准备好进行\
  \ ML 训练之前对其进行处理或转换。以下部分介绍一些有用的工具。\n\n###### Cloud Dataflow\n\n`Cloud Dataflow` 是一种无服务器、全托管的数据处理或\
  \ ETL 服务，用于处理流数据和批数据。`Dataflow` 在开源其 SDK 之前使用 `Apache Beam`。`Apache Beam` 提供精确一次流语义，这意味着它具有机制不仅能至少处理每条消息一次，而且能恰好处理一次。这简化了您的业务逻辑，因为您不必担心处理重复项或错误。\n\
  \n数据流是执行一组操作的处理管道，这使您能够构建管道、监控其执行情况，并转换和分析数据。它旨在解决使用 MapReduce 构建管道时的性能问题。许多 Hadoop\
  \ 工作负载可以通过 `Dataflow` 轻松完成并更易于维护。`Cloud Dataflow` 允许您从源 Google Cloud 数据服务处理和读取数据到接收端，如图\
  \ 8.2 所示。\n\n![图 8.2 Cloud Dataflow 源和接收端](img/c08f002.png)\n\n**图 8.2** Cloud Dataflow\
  \ 源和接收端\n\n例如，您可以使用 `Cloud Dataflow` 从 `Cloud Pub/Sub`（源）处理和转换数据到 `BigQuery`（接收端）。\n\
  \n###### Cloud Data Fusion\n\n我们在第 3 章“特征工程”中介绍了 `Cloud Data Fusion`。`Cloud Data\
  \ Fusion` 是一种基于 UI 的 ETL 工具，无需代码实现。\n\n###### Cloud Dataproc\n\n`Dataproc` 是一种全托管且高度可扩展的服务，用于运行\
  \ `Apache Spark`、`Apache Flink`、`Presto` 和 30 多种开源工具和框架。`Dataproc` 让您利用开源数据工具进行批处理、查询、流处理和机器学习。`Dataproc`\
  \ 自动化可帮助您快速创建集群、轻松管理它们，并在不需要时将其关闭以节省资金。\n\n`Dataproc` 与其他 Google Cloud Platform\
  \ 服务（如 `BigQuery`、`Cloud Storage`、`Cloud Bigtable`、`Cloud Logging` 和 `Cloud Monitoring`）具有内置集成，提供了一个完整的数据平台。例如，您可以使用\
  \ `Dataproc` 轻松地将 TB 级原始日志数据直接 ETL（提取、转换、加载）到 `BigQuery` 中以进行业务报告。`Dataproc` 使用\
  \ Hadoop 分布式文件系统 (`HDFS`) 进行存储。此外，`Dataproc` 会自动安装兼容 `HDFS` 的 `Cloud Storage` 连接器，从而支持将\
  \ `Cloud Storage` 与 `HDFS` 并行使用。数据可以通过上传/下载到 `HDFS` 或 `Cloud Storage` 进出集群。表 8.1\
  \ 总结了 `Dataproc` 的连接器。\n\n**表 8.1** Dataproc 连接器\n\n| 连接器 | 说明 |\n| --- | --- |\n\
  | Cloud Storage 连接器 | 默认在 `Dataproc` 上可用，此连接器有助于直接在 `Cloud Storage` 中的数据上运行 `Apache\
  \ Hadoop` 或 `Apache Spark` 作业。将数据存储在 `Cloud Storage` 中，并使用 Cloud Storage 连接器直接访问。您无需先将其传输到\
  \ `HDFS`。 |\n\n\n\n\n\n| BigQuery 连接器 | | 您可以使用 BigQuery 连接器启用对 BigQuery 的编程读/写访问。由于未公开命令行访问，这是处理存储在\
  \ BigQuery 中的数据的理想方式。BigQuery 连接器是一个库，可让 Spark 和 Hadoop 应用处理来自 BigQuery 的数据并将数据写入\
  \ BigQuery。BigQuery Spark 连接器用于 Spark，BigQuery Hadoop 连接器用于 Hadoop。 |\n\n| BigQuery\
  \ Spark 连接器 | | 适用于 Google BigQuery 的 Apache Spark SQL 连接器。该连接器支持将 Google BigQuery\
  \ 表读取到 Spark 的 DataFrames 中，并将 DataFrames 写回 BigQuery。这是通过使用 Spark SQL Data Source\
  \ API 与 BigQuery 通信来完成的。 |\n\n| 结合 Dataproc 使用 Cloud Bigtable | | 对于任何需要 Apache\
  \ HBase 的 Apache Spark 或 Hadoop 用例，Bigtable 都是一个绝佳的选择。Bigtable 支持 Apache HBase API，因此可以轻松地将\
  \ Bigtable 与 Dataproc 结合使用。 |\n\n| Pub/Sub Lite Spark 连接器 | | Pub/Sub Lite Spark\
  \ 连接器支持将 Pub/Sub Lite 作为输入源，用于默认微批处理和实验性连续处理模式下的 Apache Spark Structured Streaming。\
  \ |\n\n所有 Cloud Dataproc 集群均内置了用于 Hadoop 的 BigQuery 连接器，以便您可以轻快地在 Cloud Dataproc\
  \ 与 BigQuery 之间读写数据。\n\n#### Cloud Composer\n\n创建、运行和管理工作流的方式有多种，例如运行 Cron 任务、使用\
  \ Cron 作业、编写脚本和创建自定义应用。每种方法都有利弊。更重要的是，上述所有方法都存在管理开销。这就是我们推出 Cloud Composer 的原因，它是一项全代管式数据工作流编排服务，允许您编写、调度和监控流水线。Cloud\
  \ Composer 基于 Apache Airflow 构建，流水线使用 Python 配置为有向无环图 (DAG)。\n\n它支持混合云和多云架构，无论工作流流水线位于本地、多个云中，还是完全在\
  \ Google Cloud 内部，均可对其进行管理。\n\nCloud Composer 提供与 Google Cloud 产品的端到端集成，包括 BigQuery、Dataflow、Dataproc、Datastore、Cloud\
  \ Storage、Pub/Sub 和 Vertex AI Platform，让用户能够完全自由地编排其流水线。\n\n#### Cloud Dataprep\n\
  \n我们在第 3 章中介绍了 Cloud Dataprep。Cloud Dataprep 是一款基于 UI 的 ETL 工具，可用于以可视化方式探索、清理和准备结构化和非结构化数据，以便大规模进行分析、报告和机器学习。\n\
  \n#### 处理工具摘要\n\n我们迄今为止介绍的所有工具的摘要如图 8.3 所示。\n\n![图 8.3 GCP 上处理工具的摘要](img/c08f003.png)\n\
  \n**图 8.3** GCP 上处理工具的摘要\n\n##### 存储和分析\n\n使用工具收集和处理数据后，您需要可扩展的存储来存储各种类型的数据。表 8.2\
  \ 显示了机器学习中各种数据类型的 Google Cloud 存储选项。请参考表 8.2 了解 GCP 上机器学习的数据存储指南。\n\n**表 8.2** GCP\
  \ 上机器学习的数据存储指南\n\n| 数据类型 | | 产品 |\n| --- | --- | --- |\n| 表格数据 | | BigQuery、BigQuery\
  \ ML |\n| 图像、视频、音频和非结构化数据 | | Google Cloud Storage |\n| 非结构化数据 | | Vertex Data Labeling\
  \ |\n| 结构化数据 | | Vertex AI Feature Store |\n| 面向 AutoML 图像、视频、文本 | | Vertex AI Managed\
  \ Datasets |\n\n在 Cloud Storage 上，以大容器格式存储图像、视频、音频和非结构化数据。此外，将许多单独的图像、视频和音频剪辑合并为大文件，因为这将提高您对\
  \ Google Cloud Storage 的读写吞吐量。文件大小应至少达到 100 MB，分片数在 100 到 10,000 之间。\n\n#### 使用常见框架在\
  \ Vertex AI Workbench 中开发模型\n\n在本节中，我们将介绍如何创建 Jupyter Notebook 环境，以使用 Vertex AI\
  \ Workbench 训练、调优和部署模型。\n\nVertex AI Workbench 是一个基于 Jupyter Notebook 的开发环境，面向整个数据科学工作流。您可以从\
  \ Vertex AI Workbench 实例的 Jupyter Notebook 内部与 Vertex AI 和其他 Google Cloud 服务进行交互。我们在第\
  \ 6 章“构建安全的 ML 流水线”中介绍了 Vertex AI Workbench，当时我们介绍了创建实例的安全性方面以及两种笔记本类型：\n\n*   **用户管理的笔记本**\
  \ Vertex AI 平台中最早版本的 Jupyter Notebook（以前称为 AI Platform）。与托管笔记本相比，它们提供更多控制权但功能较少。请参阅表\
  \ 8.3 了解功能差异。\n\n*   **托管笔记本** 最新推出的产品。这些笔记本具有自动关机、与数据存储集成以及按计划执行笔记本等功能。\n\n**表\
  \ 8.3** 托管笔记本与用户管理的笔记本的区别\n\n| 托管笔记本 | | 用户管理的笔记本 |\n| --- | --- | --- |\n| **闲置实例自动关机：**\
  \ 选择托管笔记本将在 Jupyter Notebook 闲置时将其关闭。此功能有助于节省成本，因为实例会在闲置时自动关闭。 | | **闲置实例自动关机：**\
  \ 默认不支持此功能。不过，您可以使用 Cloud Monitoring 和 Cloud Functions 创建监控器来查看实例何时闲置，并在不使用时将其关闭。\
  \ |\n| **界面与 Cloud Storage 和 BigQuery 集成：** 在托管笔记本实例的 JupyterLab 导航菜单中，您可以使用 Cloud\
  \ Storage 和 BigQuery 集成来浏览您有权访问的数据和其他文件，并将数据加载到笔记本中。 | | **界面与 Cloud Storage 和 BigQuery\
  \ 集成：** 没有界面集成。不过，您可以使用 BigQuery 连接器通过代码连接到 BigQuery 数据，也可以使用 BigQuery 魔术命令 (`%%`)\
  \ 在 Jupyter Notebook 上运行 BigQuery SQL 命令。对于 Cloud Storage，您可以在用户管理的笔记本中使用 `gsutil`\
  \ 命令读写数据。 |\n| **笔记本自动运行：** 您可以设置笔记本按定期计划运行。即使您的实例已关闭，Vertex AI Workbench 也会运行您的笔记本文件并保存结果，供您查看和与他人共享。\
  \ | | **笔记本自动运行：** 不支持此功能。您可以使用 Cloud Scheduler 来调度训练作业或笔记本。 |\n| **自定义容器：** 您可以向托管笔记本\
  \ Jupyter 实例添加自己的自定义容器镜像。 | | **自定义容器：** 您可以选择添加自定义容器。 |\n| **Dataproc 或 Serverless\
  \ Spark 集成：** 您可以通过在 Dataproc 集群或 Serverless Spark 上运行笔记本来快速处理数据。此功能目前处于私有预览阶段。设置好集群后，您无需离开\
  \ JupyterLab 界面即可在其上运行笔记本文件。 | | **Dataproc 或 Serverless Spark 集成：** 不支持此功能。 |\n\
  | **框架：** 创建托管笔记本时，所有框架均已预装。创建托管笔记本后，您可以选择任何受支持的框架。 | | **框架：** 您只能从所有受支持的框架中选择创建一种框架。例如，用户管理的笔记本支持\
  \ TensorFlow、R 和 PyTorch，但在创建时，您只能为 JupyterLab 环境选择一种框架。 |\n\n\n\n\n\n#### 网络和安全\n\
  \n**托管笔记本：** 您可以在同一项目的 VPC 中运行此项。共享 VPC 控制目前尚不支持托管笔记本。\n\n**用户管理的笔记本：** 对于有特定网络和安全需求的用户，用户管理的笔记本可能是最佳选择。您可以使用\
  \ VPC Service Controls 在服务边界内设置用户管理的笔记本实例，并实现其他内置的网络和安全功能。\n\n这两种笔记本选项均预装了 JupyterLab，并预装了一套深度学习包，如\
  \ TensorFlow 和 PyTorch 框架，以及 R、Spark 和 Python 等其他包。您可以使用仅 CPU 或启用了 GPU 的实例。这两种笔记本实例也都与\
  \ GitHub 集成，因此您可以将笔记本与 GitHub 代码库同步。\n\n首先，我们将介绍托管笔记本和用户管理的笔记本之间的一些功能差异，然后介绍如何创建和使用这些笔记本进行模型开发。\n\
  \n接下来，我们将通过在 Vertex AI GCP 控制台中创建笔记本来探索每种笔记本的功能。\n\n##### 创建托管笔记本\n\n转到 Vertex AI\
  \ 并选择**启用所有 API**。默认情况下，在 GCP 中，所有服务 API 均处于停用状态。启用 API 后，点击 **Workbench（工作台）**，转到\
  \ **Managed Notebooks（托管笔记本）** 标签页，然后选择 **New Notebook（新建笔记本）**。点击 **Create（创建）**\
  \ 按钮，使用默认设置创建笔记本（请参阅图 8.4）。\n\n![FIGURE 8.4 创建托管笔记本](img/c08f004.png)\n\n**图 8.4**\
  \ 创建托管笔记本\n\n请注意，右侧显示了运行笔记本的月度账单预估。\n\n过一段时间后，您会发现笔记本已创建完成，**Open JupyterLab（打开\
  \ JupyterLab）** 按钮已启用（请参阅图 8.5）。点击 **Open JupyterLab** 按钮进入您托管的 JupyterLab 环境。\n\
  \n![FIGURE 8.5 打开托管笔记本](img/c08f005.png)\n\n**图 8.5** 打开托管笔记本\n\n##### 探索托管 JupyterLab\
  \ 功能\n\n点击 **Open JupyterLab** 后，您将被重定向到图 8.6 所示的屏幕。您会发现此环境中提供了所有可用的框架，包括 Serverless\
  \ Spark 以及本地安装的 PySpark。Serverless Spark 功能用于在笔记本内运行 Dataproc 集群。\n\n![FIGURE 8.6\
  \ 探索托管笔记本中可用的框架](img/c08f006.png)\n\n**图 8.6** 探索托管笔记本中可用的框架\n\n在 tutorials（教程）文件夹中，您将找到现有的笔记本，帮助您开始在此\
  \ JupyterLab 环境中构建和训练模型。JupyterLab 还附带终端选项，可在整个笔记本上运行终端命令。\n\n接下来，让我们探索此类笔记本支持的功能。\n\
  \n##### 数据集成\n\n点击左侧导航栏上的 **Browse GCS（浏览 GCS）** 图标（请参阅图 8.7），以浏览并从 Cloud Storage\
  \ 文件夹加载数据。\n\n![FIGURE 8.7 托管笔记本中与 Google Cloud Storage 的数据集成](img/c08f007.png)\n\
  \n**图 8.7** 托管笔记本中与 Google Cloud Storage 的数据集成\n\n##### BigQuery 集成\n\n如图 8.8 所示，点击左侧的\
  \ **BigQuery** 图标，从您的 BigQuery 表中获取数据。该界面还提供 **Open SQL editor（打开 SQL 编辑器）** 选项，可在不离开\
  \ JupyterLab 界面的情况下查询这些表。\n\n![FIGURE 8.8 托管笔记本中与 BigQuery 的数据集成](img/c08f008.png)\n\
  \n**图 8.8** 托管笔记本中与 BigQuery 的数据集成\n\n##### 扩展或缩减计算资源的能力\n\n点击 `n1‐standard‐4`（请参阅图\
  \ 8.9）。您将获得修改 Jupyter 环境硬件的选项。您也可以在不离开环境的情况下为此实例附加 GPU。\n\n##### 用于团队协作的 Git 集成\n\
  \n点击左侧导航栏的分支图标，您将进入集成现有 git 代码库或克隆代码库以进行项目协作的屏幕（请参阅图 8.10）。或者，您可以使用终端并运行命令 `git\
  \ clone <your‐repository name>` 来克隆您的代码库。\n\n![FIGURE 8.9 从托管笔记本扩展硬件](img/c08f009.png)\n\
  \n**图 8.9** 从托管笔记本扩展硬件\n\n![FIGURE 8.10 托管笔记本中的 Git 集成](img/c08f010.png)\n\n**图\
  \ 8.10** 托管笔记本中的 Git 集成\n\n##### 安排或执行笔记本代码\n\n点击 **Python**，输入“hello world”，然后点击\
  \ **run cell（运行单元格）**，使用黑色三角形箭头手动执行单元格。为了自动执行此笔记本，请如图 8.11 所示点击 **Execute（执行）**。\n\
  \n![FIGURE 8.11 在笔记本中安排或执行代码](img/c08f011.png)\n\n**图 8.11** 在笔记本中安排或执行代码\n\n点击\
  \ **Execute** 后，您将看到图 8.12 所示的屏幕：**Submit notebooks to Executor（提交笔记本给执行器）**。此功能主要用于设置或触发\
  \ Vertex AI 训练作业，或部署 Vertex AI Prediction 端点的调度，而无需离开 Jupyter 界面。\n\n![FIGURE 8.12\
  \ 提交笔记本以供执行](img/c08f012.png)\n\n**图 8.12** 提交笔记本以供执行\n\n向下滚动到 **Type（类型）** 选项，以安排笔记本运行，如图\
  \ 8.13 所示。\n\n![FIGURE 8.13 安排笔记本以供执行](img/c08f013.png)\n\n**图 8.13** 安排笔记本以供执行\n\
  \n我们介绍了托管笔记本的所有功能，例如与 Cloud Storage/BigQuery 的集成、扩展或缩减笔记本硬件的能力、Git 集成，以及安排笔记本进行一次性运行或按计划时间运行的能力。\n\
  \n##### 创建用户管理的笔记本\n\n使用用户管理的笔记本时，您需要在创建笔记本期间选择执行环境，如图 8.14 所示。\n\n![FIGURE 8.14\
  \ 选择 TensorFlow 框架以创建用户管理的笔记本](img/c08f014.png)\n\n**图 8.14** 选择 TensorFlow 框架以创建用户管理的笔记本\n\
  \n您需要从 Python 3、TensorFlow、R、JAX、Kaggle、PyTorch 等选项中选择特定的框架。让我们按照图 8.14 所示的路径，继续创建一个不带\
  \ GPU 的 TensorFlow 笔记本。然后点击 **Create（创建）** 以创建用户管理的笔记本（请参阅图 8.15）。\n\n![FIGURE 8.15\
  \ 创建用户管理的 TensorFlow 笔记本](img/c08f015.png)\n\n**图 8.15** 创建用户管理的 TensorFlow 笔记本\n\
  \n您可以看到，用户管理的笔记本带有高级选项，可配置与共享 VPC 的网络。\n\n笔记本处于活动状态后，您将看到 **Open JupyterLab（打开 JupyterLab）**\
  \ 选项。点击它以探索笔记本（请参阅图 8.16）。\n\n![FIGURE 8.16 探索网络](img/c08f016.png)\n\n**图 8.16**\
  \ 探索网络\n\n此笔记本预装了 TensorFlow。您可以使用用户管理的笔记本中的 Git 集成和终端访问。\n\n您可以使用托管笔记本和用户管理的笔记本，通过\
  \ Vertex AI Python SDK 触发 Vertex AI 训练，或使用 Vertex AI Training Python SDK 运行预测。\n\
  \n\n\n\n在本节中，我们介绍了用户管理笔记本和托管笔记本之间的一些功能差异。我们还介绍了如何创建它们。\n\n在下一节中，您将学习如何使用 Vertex\
  \ AI Training 训练模型。\n\n#### 在不同环境中将模型训练作为作业运行\n\nVertex AI 支持两种类型的训练：\n\n*   **AutoML：**\
  \ AutoML 让您能够以极少的技术工作量创建和训练模型。我们在 第 4 章“选择合适的 ML 基础设施”中详细介绍了 AutoML。\n*   **自定义训练：**\
  \ 自定义训练让您能够创建针对目标结果进行优化的训练应用。您可以完全控制训练应用的功能。具体而言，您可以以任何目标为对象，使用任何算法，开发自己的损失函数或指标，或进行任何其他自定义。在以下章节中，我们将重点介绍使用\
  \ Vertex AI 进行自定义训练。\n\n##### Vertex AI 训练工作流\n\n使用 Vertex AI，您可以使用以下选项为 AutoML\
  \ 或自定义模型创建训练作业或训练资源：\n\n*   **训练流水线：** 训练流水线是 Vertex AI 中主要的模型训练工作流。您可以使用训练流水线创建\
  \ AutoML 训练的模型或自定义训练的模型。对于自定义训练模型，训练流水线可编排自定义训练作业和超参数调优，并包含添加数据集或将模型上传到 Vertex AI\
  \ 以用于预测服务等额外步骤。图 8.17 显示了 Vertex AI 控制台中的训练流水线。\n\n    ![FIGURE 8.17 Vertex AI 控制台中的训练\
  \ ¶ 来源：Google LLC.](img/c08f017.png)\n\n    **图 8.17** Vertex AI 控制台中的训练 ¶ 来源：Google\
  \ LLC。\n\n*   **自定义作业：** 自定义作业指定 Vertex AI 如何运行您的自定义训练代码，包括工作器池、机器类型以及与您的 Python\
  \ 训练应用和自定义容器相关的设置。自定义作业仅用于自定义训练模型，而非 AutoML 模型。当您创建自定义作业时，您需要指定 Vertex AI 运行训练代码所需的设置。\n\
  *   **超参数调优作业：** 超参数调优通过在一系列试验中优化指标值，搜索超参数值的最佳组合。超参数调优仅用于自定义训练模型，而非 AutoML 模型。我们将在本章后面的“超参数调优”部分介绍这一点。\n\
  \n##### Vertex AI 中的训练数据集选项\n\n训练始于数据集。在 Vertex AI 中，您有两种存储和管理数据集的选择：\n\n*   **非托管数据集：**\
  \ 您可以使用存储在 Google Cloud Storage 中的数据或存储在 BigQuery 中的数据进行训练。Vertex AI 托管笔记本与 Cloud\
  \ Storage 和 BigQuery 集成。因此，您可以直接使用来自这些来源的数据进行训练，您可以在 Vertex AI Workbench 中使用 Google\
  \ Cloud Storage FUSE 为非托管数据集选项指定 GCS 存储桶中的数据集。GCS FUSE 为应用程序提供了一种使用标准文件系统语义上传和下载\
  \ Cloud Storage 对象的方式。\n*   **托管数据集：** 这是在 Vertex AI 上训练机器学习模型的首选方式。以下是使用托管数据集在\
  \ Vertex AI 上进行训练的一些优势：\n    *   在中心位置管理您的数据集。\n    *   轻松创建标签和多个注释集。\n    *   使用集成的数据标注创建人工标记任务。\n\
  \    *   跟踪到模型的血缘，用于治理和迭代开发。\n    *   通过使用相同的数据集训练 AutoML 和自定义模型来比较模型性能。\n    *\
  \   生成数据统计信息和可视化。\n    *   自动将数据拆分为训练集、测试集和验证集。\n\nVertex AI 训练为训练提供了两种选择：预构建容器和自定义容器。让我们详细了解一下每一种。\n\
  \n##### 预构建容器\n\nVertex AI 支持容器注册表上托管的 scikit-learn、TensorFlow、PyTorch 和 XGBoost\
  \ 容器，用于预构建训练。Google 管理所有容器镜像及其版本。要使用预构建容器设置训练，请遵循以下步骤：\n\n1.  您需要按照 图 8.18 所示的应用结构组织代码。您应该有一个包含\
  \ `setup.py` 的根文件夹和一个包含 `task.py`（训练代码）的 trainer 文件夹，后者是 Vertex AI 训练作业的入口点。您可以通过在\
  \ `setup.py` 中指定，使用标准依赖项或预构建容器中不包含的库。\n2.  在使用预构建容器开始训练之前，您需要将训练代码作为 Python 源代码分发包上传到\
  \ Cloud Storage 存储桶。您可以使用 `sdist` 命令创建源代码分发包——例如 `python setup.py sdist ‐‐formats=gztar,zip`。图\
  \ 8.18 显示了预构建容器的文件夹结构和架构。\n\n![FIGURE 8.18 预构建容器的 Vertex AI 训练架构](img/c08f018.png)\n\
  \n**图 8.18** 预构建容器的 Vertex AI 训练架构\n\n图 8.19 显示了 GCP 控制台为预构建容器设置 Vertex AI 训练流水线的样子。\n\
  \n选择训练容器后，您可以选择要用于训练的计算实例类型。\n\n以下命令基于预构建训练容器镜像和您的本地 Python 代码构建 Docker 镜像，将镜像推送到\
  \ Container Registry，并创建自定义作业。\n\n```\ngcloud ai custom-jobs create \\\n  --region=LOCATION\
  \ \\\n  --display-name=JOB_NAME \\\n  --worker-pool-spec=machine-type=MACHINE_TYPE,replica-count=REPLICA_COUNT,executor-image-uri=EXECUTOR_IMAGE_URI,local-package-path=WORKING_DIRECTORY,script=SCRIPT_PATH\n\
  \nLOCATION: 容器或 Python 包将在其中运行的区域。\nJOB_NAME: 必需。CustomJob 的显示名称。\nMACHINE_TYPE:\
  \ 机器类型。请参阅可用于训练的机器类型。\nREPLICA_COUNT: 要使用的工作器副本数量。在大多数情况下，对于第一个工作器池，将其设置为 1。\nEXECUTOR_IMAGE_URI:\
  \ 运行所提供代码的容器镜像的 URI。请参阅可用于训练的预构建容器。\n此镜像充当您使用此命令构建的新 Docker 镜像的基础镜像。\nWORKING_DIRECTORY:\
  \ 本地文件系统中包含运行训练代码的入口点脚本的目录（请参阅下一个列表项）。\n\n相对于本地文件系统上 WORKING_DIRECTORY 的路径，指向作为训练代码入口点的脚本。例如，如果您想运行\
  \ /custom job/trainer/task.py 且 WORKING_DIRECTORY 是 /custom job，则对此值使用 trainer/task.py。\n\
  ```\n\n![FIGURE 8.19 预构建容器的 Vertex AI 训练控制台 来源：Google LLC.](img/c08f019.png)\n\n\
  **图 8.19** 预构建容器的 Vertex AI 训练控制台 来源：Google LLC。\n\n##### 自定义容器\n\n自定义容器是您创建用于运行训练应用的\
  \ Docker 镜像。以下是使用自定义容器相较于预构建容器的一些优势：\n\n*   **更快的启动时间。** 如果您使用预装了依赖项的自定义容器，可以节省训练应用在启动时原本需要安装依赖项的时间。\n\
  *   **使用您选择的 ML 框架。** 如果您找不到包含您想要使用的 ML 框架的 Vertex AI 预构建容器，您可以构建一个包含您所选框架的自定义容器，并使用它在\
  \ Vertex AI 上运行作业。例如，您可以使用自定义容器通过 PyTorch 进行训练。\n*   **对分布式训练的扩展支持。** 使用自定义容器，您可以使用任何\
  \ ML 框架进行分布式训练。\n\n\n\n\n#### 使用最新版本\n\n您还可以使用 ML 框架的最新构建版本或次要版本。例如，您可以构建一个自定义容器，以使用\
  \ `tf-nightly` 进行训练。\n\n图 8.20 展示了自定义容器训练在 Google Cloud 上的工作架构。您需要使用 `Dockerfile`\
  \ 和采用推荐文件夹结构的训练文件来构建容器。您构建 `Dockerfile` 并将其推送到 Artifact Registry。对于使用自定义容器的 Vertex\
  \ AI 训练，您需要指定数据集（托管模式）、您推送到代码库的自定义容器镜像 URI，以及用于训练的计算（VM）实例。\n\n![图 8.20 用于自定义容器的\
  \ Vertex AI 训练架构](img/c08f020.png)\n\n**图 8.20** 用于自定义容器的 Vertex AI 训练架构\n\n要为 Vertex\
  \ AI 训练创建自定义容器，您需要创建 `Dockerfile`、构建 `Dockerfile` 并将其推送到 Artifact Registry。步骤如下：\n\
  \n##### 1. 创建自定义容器和训练文件\n\n###### 1.1 按照要求的文件夹结构设置文件\n\n您需要创建一个根文件夹。然后创建一个 `Dockerfile`\
  \ 和一个名为 `trainer/` 的文件夹。在该 `trainer` 文件夹中，您需要创建 `task.py`（您的训练代码）。此 `task.py` 文件是入口点文件。\n\
  \n###### 1.2 创建 Dockerfile\n\n您的 `Dockerfile` 需要包含如下代码所示的命令，这些命令包括选择基础镜像、安装额外依赖项、将训练代码复制到镜像中，以及配置入口点以调用训练代码等任务。\n\
  \n```\n####### 指定基础镜像和标签\nFROM image:tag\nWORKDIR /root\n\n####### 安装额外的软件包\nRUN\
  \ pip install pkg1 pkg2 pkg3\n\n####### 下载训练数据\nRUN curl https://example-url/path-to-data/data-filename\
  \ --output /root/data-filename\n\n####### 将训练器代码复制到 Docker 镜像中\nCOPY your-path-to/model.py\
  \ /root/model.py\nCOPY your-path-to/task.py /root/task.py\n\n####### 设置入口点以调用训练器\n\
  ENTRYPOINT [\"python\", \"task.py\"]\n```\n\n##### 2. 构建并运行您的 Docker 容器\n\n您可以使用以下代码构建\
  \ Docker 镜像：\n\n```\nexport PROJECT_ID=$(gcloud config list project --format \"\
  value(core.project)\")\nexport REPO_NAME=REPOSITORY_NAME\nexport IMAGE_NAME=IMAGE_NAME\n\
  export IMAGE_TAG=IMAGE_TAG\nexport IMAGE_URI=us-central1-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/${IMAGE_NAME}:${IMAGE_TAG}\n\
  \ndocker build -f Dockerfile -t ${IMAGE_URI} ./\n```\n\n对于本地运行，请使用以下命令：\n\n```\n\
  docker run ${IMAGE_URI}\n```\n\n##### 3. 将容器镜像推送到 Artifact Registry\n\n如果 Docker\
  \ 构建成功，您可以通过运行以下命令将容器推送到 Artifact Registry。\n\n```\ndocker push ${IMAGE_URI}\n```\n\
  \n##### 4. 开始训练\n\n将镜像推送到代码库后，您可以通过使用以下命令创建自定义作业来开始训练：\n\n```\ngcloud ai custom-jobs\
  \ create \\\n  --region=LOCATION \\\n  --display-name=JOB_NAME \\\n  --worker-pool-spec=machine-type=MACHINE_TYPE,replica-count=REPLICA_COUNT,container-image-uri=CUSTOM_CONTAINER_IMAGE_URI\n\
  ```\n\n#### 分布式训练\n\n为了使用 Vertex 运行分布式训练作业，您需要在训练集群中指定多台机器（节点）。训练服务会为您指定的机器类型分配资源。在给定节点上运行的作业称为\
  \ *副本*。具有相同配置的一组副本称为工作池。您可以通过定义多个工作池，将任何自定义训练作业配置为分布式训练作业。您还可以在训练流水线或超参数调优作业中运行分布式训练。请使用支持分布式训练的\
  \ ML 框架。在您的训练代码中，您可以使用 `CLUSTER_SPEC` 或 `TF_CONFIG` 环境变量来引用训练集群的特定部分。请参阅 表 8.4 以了解分布式训练中的工作池任务。\n\
  \n**表 8.4** 分布式训练中的工作池任务\n\n| `workerPoolSpecs[]` 中的位置 | 在集群中执行的任务 |\n| --- | ---\
  \ |\n| 第一 (`workerPoolSpecs[0]`) | 主节点、控制器、调度器或 \"master\"。恰好有一个副本被指定为 *主副本*。此任务管理其他副本并报告整个作业的状态。\
  \ |\n| 第二 (`workerPoolSpecs[1]`) | 次要节点、副本、工作器。一个或多个副本可被指定为 *工作器*。这些副本按照您在作业配置中指定的方式完成其份额的工作。\
  \ |\n| 第三 (`workerPoolSpecs[2]`) | 参数服务器和 Reduction Server<br>• **参数服务器：** 如果您的\
  \ ML 框架支持，一个或多个副本可被指定为参数服务器。这些副本存储模型参数，以协调工作器之间的共享模型状态。<br>• **Reduction Server**\
  \ 是一种全归约算法，可提高分布式训练的吞吐量并降低延迟。如果您使用 GPU 工作器进行分布式训练，可以使用此选项。您的训练代码使用 TensorFlow 或\
  \ PyTorch，并配置为使用 NCCL 全归约进行多主机数据并行 GPU 训练。<br>对于 TensorFlow，您还可以使用 Horovod，它支持 Tensor\
  \ Fusion 以将小张量批量处理进行全归约。 |\n| 第四 (`workerPoolSpecs[3]`) | 评估器：这些副本可用于评估您的模型。如果您使用\
  \ TensorFlow，请注意 TensorFlow 通常预期您使用不超过一个评估器。 |\n\n##### 设置 Vertex AI Reduction Server\
  \ 分布式训练\n\nVertex AI 以 Docker 容器镜像的形式提供 Reduction Server，您可以在分布式训练期间将其用于其中一个工作池。在设置\
  \ `workerpoolspec[2]` 中的 Reduction Server 容器之前，您需要遵循此链接中提到的先决条件：`https://cloud.google.com/vertex-ai/docs/training/distributed-training`。以下命令提供了一个示例，展示如何通过设置工作池创建一个使用\
  \ Reduction Server 进行分布式训练的 `CustomJob` 资源：\n\n```\ngcloud ai custom-jobs create\
  \ \\\n  --region=LOCATION \\\n  --display-name=JOB_NAME \\\n  --worker-pool-spec=machine-type=n1-highmem-96,replica-count=1,accelerator-type=NVIDIA_TESLA_V100,accelerator-count=8,container-image-uri=CUSTOM_CONTAINER_IMAGE_URI\
  \ \\\n  --worker-pool-spec=machine-type=n1-highmem-96,replica-count=4,accelerator-type=NVIDIA_TESLA_V100,accelerator-count=8,container-image-uri=CUSTOM_CONTAINER_IMAGE_URI\
  \ \\\n  --worker-pool-spec=machine-type=n1-highcpu-16,replica-count=16,container-image-uri=us-docker.pkg.dev/vertex-ai-restricted/training/reductionserver:latest\n\
  ```\n\n我们在 第 7 章 \"模型构建\" 中介绍了使用 TensorFlow 的分布式训练策略。要深入了解 Reduction Server 的工作原理，请参阅此深度解析博客：`https://cloud.google.com/blog/topics/developers-practitioners/optimize-training-performance-reduction-server-vertex-ai`\n\
  \n#### 超参数调优\n\n超参数是训练算法本身的参数，不会直接从训练过程中学习。让我们看一个使用梯度下降训练的简单前馈神经网络 DNN 模型的示例。梯度下降中的超参数之一是学习率，我们在\
  \ 第 7 章 中已介绍过。学习率必须在任何学习开始之前预先设置。因此，寻找合适的学习率涉及选择一个值、训练模型、评估它，然后再次尝试。\n\n\n\n\n#####\
  \ 图 8.21：ML 模型参数和超参数\n\n图 8.21 总结了参数和超参数之间的区别。\n\n![图 8.21 ML 模型参数和超参数](img/c08f021.png)\n\
  \n**图 8.21** ML 模型参数和超参数\n\n##### 为什么超参数很重要\n\n超参数的选择对神经网络架构的成功至关重要，因为超参数会严重影响所学习模型的行为。例如，如果学习率设置得太低，模型将错过数据中的重要模式；但如果设置得太大，模型将过于容易地在偶然的巧合中发现模式。寻找良好的超参数涉及解决两个问题：\n\
  \n*   **如何高效地搜索可能的超参数空间：** 有一些算法可帮助进行超参数搜索空间优化。Vertex AI 默认算法应用贝叶斯优化以得出最优解。表 8.5\
  \ 总结了 Vertex AI 超参数调优支持的搜索算法。\n\n*   **如何管理大量用于超参数调优的实验：** 如果没有像 Vertex AI 超参数调优这样的自动化技术，您将需要在许多训练运行过程中手动调整超参数，以得出最优值。超参数调优使确定最佳超参数设置的过程更轻松、不那么繁琐。超参数调优利用\
  \ Google Cloud 的计算基础设施，在训练模型时测试不同的超参数配置。它可以为您提供超参数的优化值，从而最大化模型的预测准确性。\n\n######\
  \ 表 8.5：GCP 上超参数调优的搜索算法选项\n\n**表 8.5** GCP 上超参数调优的搜索算法选项\n\n| 网格搜索 | 随机搜索 | 贝叶斯搜索\
  \ |\n| --- | --- | --- |\n| 网格搜索本质上是对手动指定的一组超参数进行详尽搜索。例如，一个具有超参数 `learning_rate`\
  \ 和 `num_layers` 的模型。<br>`learning_rate = [0.1, 0.5, 1]`<br>`num_layers = [5, 10,\
  \ 20]`<br>网格搜索将在每次训练中对每一对 `[learning_rate, num_layers]` 进行训练，例如 `[0.1, 5]`，并使用训练集上的交叉验证或单独的验证集来衡量性能。得分最高的超参数设置即为最终输出。\
  \ | 随机搜索是一种使用超参数的随机组合来为构建的模型寻找最佳解决方案的技术。这在并非所有超参数都同等重要的假设下效果最好。在这种搜索模式中，每次迭代都会考虑参数的随机组合。\
  \ | 这是 Vertex AI 的默认搜索算法。贝叶斯优化在选择下一个要评估的超参数集时，会考虑过去的评估结果。 |\n| 网格搜索的缺点之一是，就维度而言，当超参数的数量呈指数级增长时，其评估会变得困难。\
  \ | 然而，随机搜索的缺点是它不利用先前实验的信息来选择下一个设置。 | 它使用过去的评估结果。 |\n| 要使用网格搜索，所有参数必须属于 `INTEGER`、`CATEGORICAL`\
  \ 或 `DISCRETE` 类型。 | 由于随机搜索模式的随机性，模型可能最终在没有任何混叠的情况下在优化参数上进行训练，因此随机搜索找到最优参数的几率比网格搜索高。\
  \ | 超参数调优使用一种称为 `Gaussian Process Bandits`（高斯过程老虎机）的算法，这是一种贝叶斯优化形式。 |\n\n##### 加速超参数优化的技术\n\
  \n有几种技术可以加速超参数优化：\n\n*   如果您有大型数据集，请使用简单的验证集代替交叉验证。与 k 折交叉验证相比，这将使速度提高约 k 倍。如果您没有足够的数据，这种方法效果不好。\n\
  *   通过使用带有超参数优化的分布式训练，将问题并行化到多台机器上。每台机器可以使用不同的超参数选择来拟合模型。对于 n 台机器，这将使速度提高约 n 倍。\n\
  *   通过预先计算或缓存可为后续模型拟合重用的计算结果，避免冗余计算。\n*   如果使用网格搜索，请减少您愿意考虑的超参数值的数量。由于组合总数按乘法方式扩展，这可能会带来潜在的巨大加速。\n\
  \n要了解更多信息，请访问以下页面：\n\n*   `https://cloud.google.com/blog/products/ai-machine-learning/hyperparameter-tuning-cloud-machine-learning-engine-using-bayesian-optimization`\n\
  *   `https://cloud.google.com/ai-platform/training/docs/hyperparameter-tuning-overview`\n\
  \n##### Vertex AI 超参数调优的工作原理\n\n超参数调优通过运行您训练应用的多次试验来工作，在这些试验中使用您指定并在限制范围内设置的超参数值。超参数调优需要\
  \ Vertex AI 与训练应用之间的通信。训练应用定义模型所需的所有信息。您定义要调整的超参数（变量）以及用于评估每次试验的目标变量。超参数调优会优化您指定的目标变量，称为超参数指标。指标必须是数值型的。\n\
  \n配置超参数调优作业时，您需要定义每个指标的名称和目标。目标指定您是希望调整模型以最大化还是最小化该指标的值。\n\n请按照以下步骤使用带有自定义作业的 `gcloud`\
  \ CLI 命令配置超参数调优作业：\n\n1.  对于自定义容器，请在 Dockerfile 中安装 `cloud-ml hypertune` Python\
  \ 软件包。\n2.  在 `trainer/task.py` 中，在主函数中添加超参数调优代码，并按如下所示添加参数。\n\n    ```python\n\
  \    def main():\n        args = get_args()\n        train_data, validation_data\
  \ = create_dataset()\n        model = create_model(args.num_units, args.learning_rate,\
  \ args.momentum)\n        history = model.fit(train_data, epochs=NUM_EPOCHS, validation_data=validation_data)\n\
  \n        # 定义指标\n        hp_metric = history.history['val_accuracy'][-1]\n\n  \
  \      hpt = hypertune.HyperTune()\n        hpt.report_hyperparameter_tuning_metric(\n\
  \            hyperparameter_metric_tag='accuracy',\n            metric_value=hp_metric,\n\
  \            global_step=NUM_EPOCHS)\n    ```\n\n3.  构建并将此容器推送到 Artifact Registry。设置训练后，您可以使用训练流水线或自定义作业配置超参数调优作业。\n\
  \n![图 8.22 通过训练流水线 UI 配置超参数调优来源：Google LLC。](img/c08f022.png)\n\n**图 8.22** 通过训练流水线\
  \ UI 配置超参数调优来源：Google LLC。\n\n您可以使用控制台、`gcloud`、命令行、Java 或 Python 为预构建容器或自定义容器创建超参数调优作业。以下步骤将指导您通过使用\
  \ `gcloud` CLI 命令的自定义作业来设置超参数调优：\n\n1.  创建一个名为 `config.yaml` 的 YAML 文件，其中包含您要为新的\
  \ `HyperparameterTuningJob` 指定的一些 API 字段：\n\n\n\n\n\n##### Vertex AI 超参数调优配置\n\n\
  ```yaml\nstudySpec:\n  metrics:\n  - metricId: METRIC_ID\n    goal: METRIC_GOAL\n\
  \  parameters:\n  - parameterId: HYPERPARAMETER_ID\n    doubleValueSpec:\n     \
  \ minValue: DOUBLE_MIN_VALUE\n      maxValue: DOUBLE_MAX_VALUE\ntrialJobSpec:\n\
  \  workerPoolSpecs:\n  - machineSpec:\n      machineType: MACHINE_TYPE\n    replicaCount:\
  \ 1\n    containerSpec:\n      imageUri: CUSTOM_CONTAINER_IMAGE_URI\n```\n\n**配置参数：**\n\
  \n*   `METRIC_ID`：要优化的超参数指标的名称。您的训练代码在运行时必须报告此指标。\n*   `METRIC_GOAL`：超参数指标的目标，为\
  \ `MAXIMIZE`（最大化）或 `MINIMIZE`（最小化）。\n*   `HYPERPARAMETER_ID`：要调优的超参数的名称。您的训练代码必须解析一个具有此名称的命令行标志。在本示例中，该超参数必须接受浮点值。\n\
  *   `DOUBLE_MIN_VALUE`：您希望 Vertex AI 为此超参数尝试的最小值（数字）。\n*   `DOUBLE_MAX_VALUE`：您希望\
  \ Vertex AI 为此超参数尝试的最大值（数字）。\n*   `MACHINE_TYPE`：用于训练的虚拟机类型。\n*   `CUSTOM_CONTAINER_IMAGE_URI`：包含您训练代码的\
  \ Docker 容器镜像的 URI。\n\n> **注意：** 您也可以指定搜索算法。如果未指定，Google Cloud 默认会选择贝叶斯算法。\n\n######\
  \ 创建超参数调优作业\n\n在与 `config.yaml` 文件相同的目录下，运行以下 Shell 命令以创建自定义作业来启动超参数调优：\n\n```bash\n\
  gcloud ai hp-tuning-jobs create \\\n    --region=LOCATION \\\n    --display-name=DISPLAY_NAME\
  \ \\\n    --max-trial-count=MAX_TRIAL_COUNT \\\n    --parallel-trial-count=PARALLEL_TRIAL_COUNT\
  \ \\\n    --config=config.yaml\n```\n\n**命令参数：**\n\n*   `LOCATION`：您要在其中创建 HyperparameterTuningJob\
  \ 的区域。\n*   `DISPLAY_NAME`：您选择的显示名称。\n*   `MAX_TRIAL_COUNT`：要运行的最大试验次数。\n*   `PARALLEL_TRIAL_COUNT`：要并行运行的最大试验次数。\n\
  \n您可以在 Vertex AI 控制台的 Vertex AI 训练中跟踪此作业的进度。\n\n#### Vertex AI Vizier\n\nVertex\
  \ AI Vizier 是一项黑盒优化服务，可帮助您调整复杂机器学习模型中的超参数。以下是使用 Vertex AI Vizier 训练机器学习模型的标准：\n\n\
  *   Vertex AI Vizier 没有已知的目标函数来进行评估。\n*   使用目标函数评估 Vertex AI Vizier 的成本太高，通常是由于系统的复杂性。\n\
  *   Vertex AI Vizier 优化机器学习模型的超参数，但也可以执行其他优化任务，例如调整模型参数，并适用于任何可评估的系统。\n\n您可以使用 Vertex\
  \ AI Vizier 进行超参数调优的一些示例或用例如下：\n\n*   优化神经网络推荐引擎的学习率、批量大小和其他超参数。\n*   通过测试不同的用户界面元素排列来优化应用程序的易用性。\n\
  *   通过确定理想的缓冲区大小和线程数来最小化作业的计算资源。\n*   优化配方中配料的用量，以制作出最美味的版本。\n\n##### Vertex AI\
  \ Vizier 与自定义训练的区别\n\nVertex AI Vizier 是一项用于优化具有许多参数的复杂模型的独立服务。它可用于机器学习和非机器学习用例。它可与训练作业或其他系统（甚至多云环境）一起使用。自定义训练的超参数调优是一项内置功能，它使用\
  \ Vertex AI Vizier 进行训练作业。它有助于确定机器学习模型的最佳超参数设置。默认情况下，它使用贝叶斯优化。\n\n如需了解详情，请参阅 `https://cloud.google.com/vertex-ai/docs/training/using-hyperparameter-tuning#aiplatform_create_hyperparameter_tuning_job_python_package_sample-gcloud`。\n\
  \n#### 训练期间跟踪指标\n\n在以下部分中，我们将介绍如何使用交互式 Shell、TensorFlow Profiler 和 What-If Tool\
  \ 等工具来跟踪和调试机器学习模型指标。\n\n##### 交互式 Shell\n\n使用交互式 Shell 检查您的训练容器，可以帮助您调试训练代码或 Vertex\
  \ AI 配置方面的问题。您可以在 Vertex AI 上运行的每个预构建容器或自定义容器中浏览文件系统并运行调试实用程序。您可以使用交互式 Shell 运行跟踪和分析工具、分析\
  \ GPU 使用情况，并检查容器可用的 Google Cloud 权限。您可以通过在以编程方式设置自定义作业时将 `enableWebAccess` API 字段设置为\
  \ `true`，或在 Vertex AI 控制台训练流水线中勾选**启用训练调试**，来为自定义训练资源启用交互式 Shell，如图 8.23 所示。\n\n\
