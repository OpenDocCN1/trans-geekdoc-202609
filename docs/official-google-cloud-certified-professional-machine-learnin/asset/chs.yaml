  \ 2：探索数据与构建数据管道\n\n数据收集和清洗是机器学习中的主要步骤，因为你的模型只能像你的数据一样好。机器学习中大部分时间花在清洗数据和特征工程上。在本章中，我们将重点关注数据清洗和探索性数据分析（**EDA**）。我们将讨论数据可视化和统计技术，以检查坏数据（遗漏值、异常值、重复值）。然后我们将介绍如何规范化数据和处理坏数据（如拥有**data\
  \ schema**数据模式），如何处理缺失数据，以及如何检查**data leakage**（数据泄露）。我们还将介绍如何使用**TensorFlow Data\
  \ Validation (TFDV)**为大规模系统验证数据。\n\n#### 可视化\n\n**Data visualization**（数据可视化）是一种数据探索技术，用于发现数据中的趋势和异常值。数据可视化有助于数据清洗过程，因为你可以通过在图表上可视化数据来发现数据是否不平衡。它还有助于特征工程过程，因为你可以通过可视化来选择特征、丢弃特征，并查看特征将如何影响你的模型。\n\
  \n可视化数据有两种方式：\n\n*   **Univariate Analysis**（单变量分析） 在这种分析中，每个特征被独立分析，例如特征的范围以及数据中是否存在异常值。最常用的可视化工具是**box\
  \ plots**（箱线图）和**distribution plots**（分布图）。\n\n*   **Bivariate Analysis**（双变量分析）\
  \ 在这种分析中，我们比较两个特征之间的数据。这种分析有助于发现特征之间的相关性。执行此分析的一些方法包括使用**line plots**（折线图）、**bar\
  \ plots**（条形图）和**scatterplots**（散点图）。\n\n##### Box Plot（箱线图）\n\n\n\n\n##### Box\
  \ Plots\n\nBox plots help divide observations into defined intervals called **quartiles**\
  \ and compare them with the entire observation. It represents the data as the 25th,\
  \ 50th, and 75th quartiles. It consists of a body (the interquartile range, IQR)\
  \ where most observations are concentrated. The whiskers or lines represent the\
  \ maximum and minimum values. Points outside the whiskers are considered **outliers**.\n\
  \nFigure 2.1 shows a box plot.\n\n![Figure 2.1 Box plot showing quartiles](img/c02f001.png)\n\
  \n**Figure 2.1** Box plot showing quartiles\n\n##### Line Plots\n\nLine plots plot\
  \ the relationship between two variables to analyze trends in data over time.\n\n\
  Figure 2.2 shows a line plot.\n\n![Figure 2.2 Line plot](img/c02f002.png)\n\n**Figure\
  \ 2.2** Line plot\n\n##### Bar Plots\n\nBar plots are used to analyze data trends\
  \ and compare categorical data, such as weekly sales figures, website visitor counts,\
  \ or monthly product revenue.\n\nFigure 2.3 shows a bar plot.\n\n![Figure 2.3 Bar\
  \ plot](img/c02f003.png)\n\n**Figure 2.3** Bar plot\n\n##### Scatter Plots\n\nScatter\
  \ plots are the most commonly used plots in data science, primarily used to visualize\
  \ clusters in datasets and show the relationship between two variables.\n\n####\
  \ Statistics Basics\n\nIn statistics, we have three measures of central tendency:\
  \ mean, median, and mode. They help us describe data and can be used to clean data\
  \ from a statistical perspective.\n\n##### Mean\n\nThe mean is an accurate measure\
  \ to describe data when there are no outliers present in the data.\n\n##### Median\n\
  \nThe median is used when there are outliers in the dataset. You can find the median\
  \ by arranging the data values from low to high.\n\nIf the number of data points\
  \ is even, the median is the average of the two middle numbers; if odd, the median\
  \ is the middle value. For example, in the dataset 1, 1, 2, 4, 6, 6, 9, the median\
  \ is 4. For the dataset 1, 1, 4, 6, 6, 9, the median is 5. Take the average of 4\
  \ and 6, which is `(4+6) / 2 = 5`.\n\n##### Mode\n\nThe mode is used when there\
  \ are outliers and most of the data is the same. The mode is the value or values\
  \ that appear most frequently in a dataset.\n\nFor example, for the dataset 1, 1,\
  \ 2, 5, 5, 5, 9, the mode is 5.\n\n##### Outlier Detection\n\nThe mean is a measure\
  \ of central tendency affected by outliers, which in turn affects the standard deviation.\n\
  \nFor example, consider the following small dataset:\n\n*   `[15, 18, 7, 13, 16,\
  \ 11, 21, 5, 15, 10, 9, 210]`\n\nIt is visible to the naked eye that 210 is an outlier\
  \ far greater than the other values.\n\nAs shown in Table 2.1, adding the outlier\
  \ caused a significant change in the mean compared to the median and mode. **Variance**\
  \ is the average of the squared differences from the mean.\n\n**Table 2.1** Mean,\
  \ Median, and Mode for Outlier Detection\n\n| With Outlier | Without Outlier |\n\
  | --- | --- |\n| Mean: 12.72 | Mean: 29.16 |\n| Median: 13 | Median: 14 |\n| Mode:\
  \ 15 | Mode: 15 |\n\n##### Standard Deviation\n\nStandard deviation is the square\
  \ root of variance. Standard deviation is an excellent method for identifying outliers.\
  \ Data points that are more than one standard deviation away from the mean can be\
  \ considered outliers.\n\n##### Correlation\n\nCorrelation is simply a standardized\
  \ form of covariance. The value of the correlation coefficient ranges from -1 to\
  \ +1. The correlation coefficient is also known as the Pearson correlation coefficient.\n\
  \n*   **Positive Correlation** When the value of one variable increases, the value\
  \ of the other variable increases correspondingly; this is called **positive correlation**.\n\
  *   **Negative Correlation** When the value of one variable increases, the value\
  \ of the other variable decreases correspondingly; this is called **negative correlation**.\n\
  *   **Zero Correlation** When the change in the value of one variable has no substantial\
  \ effect on the other variable, it is called **zero correlation**.\n\n#### Data\
  \ Quality and Reliability\n\nThe quality of a model depends on the quality and reliability\
  \ (or feasibility) of the data. Model quality also depends on the scale of the training\
  \ data.\n\n**Reliability** is the degree to which you can trust the data. If data\
  \ is unreliable, it means it contains missing values, duplicate values, and bad\
  \ features; you can think of it as dirty data. If you train a model on dirty data,\
  \ you are unlikely to get useful predictions. To ensure data reliability, you can\
  \ do the following:\n\n*   Check for label errors, as they are sometimes manually\
  \ annotated and prone to errors.\n*   Check for noise in features, such as GPS measurements.\n\
  *   Check for outliers and data skew.\n\nWhen collecting data, it is important to\
  \ have a concrete definition of quality. We will discuss several parameters of data\
  \ quality in the following sections.\n\n##### Data Skew\n\n**Data skew** occurs\
  \ when the normal distribution curve is asymmetrical, causing the data to be skewed.\
  \ This means there are outliers in the data or the data distribution is uneven.\n\
  \nA normal distribution has a skewness of 0.\n\nData can be right-skewed or left-skewed\
  \ (see Figure 2.4). You can analyze skewness by understanding statistical measures\
  \ of the dataset, such as mean, median, and standard deviation.\n\n![Figure 2.4\
  \ Data skew](img/c02f004.png)\n\n**Figure 2.4** Data skew\n\nFor right-skewed data,\
  \ a real-world example could be income data, because most people have average incomes,\
  \ while only 0.01% of people earn more than the rest of the population (such as\
  \ billionaires like Jeff Bezos), resulting in outliers or right skew.\n\nSkewed\
  \ data is not good for model performance because extreme outliers affect the model's\
  \ predictive ability. Through various transformations such as log transformation\
  \ and normalization, you can convert a skewed distribution into a normal distribution\
  \ by removing outliers. If the target variable has skew, you can use Synthetic Minority\
  \ Over-sampling Technique (SMOTE), undersampling, or oversampling.\n\n##### Data\
  \ Cleaning\n\nThe goal of normalization is to transform features to a similar scale.\
  \ This improves model performance and training stability. (See `https://developers.google.com/machine-learning/data-prep/transform/normalization`.)\n\
  \n##### Scaling\n\nScaling refers to converting floating-point feature values from\
  \ their natural range into a standard range—for example, from 1,000–5,000 to 0 to\
  \ 1 or -1 to +1. Scaling is very useful when the feature set contains multiple features.\
  \ It has the following advantages:\n\n*   In deep neural network training, scaled\
  \ features allow gradient descent to converge better than unscaled features.\n*\
  \   Scaling eliminates the possibility of \"NaN traps\" because every value is scaled\
  \ into a numerical range.\n*   Without scaling, the model pays undue attention to\
  \ features with wider numerical ranges.\n\n##### Log Scaling\n\nLog scaling is used\
  \ when some data samples follow a power-law distribution or have extremely large\
  \ values. For example, when some samples are 10,000 while others are in the 0–100\
  \ range, you would use log scaling.\n\nTaking the log brings them to the same range.\
  \ For example, `log(100,000) = 100` while `log(100) = 10`. Thus, your data will\
  \ be adjusted to the 0 to 100 range through log scaling.\n\n##### Z-Score\n\nThis\
  \ is another scaling method where values are calculated as the number of standard\
  \ deviations away from the mean. When you have a few outliers, calculate the Z-Score\
  \ as follows:\n\n*   `Scaled value = (value − mean) / stddev`\n\nFor example, given\n\
  \n*   `Mean = 100`\n*   `Standard deviation = 20`\n*   `Original value = 130`\n\n\
  The scaled value is 1.5. Z-Scores lie between -3 and +3, so any value outside this\
  \ range will be an outlier.\n\n\n\n\n\n###### 裁剪\n\n在极端异常值的情况下，可以将所有高于或低于某个固定值的特征值限制在该值。可以在其他归一化技术之前或之后执行特征裁剪。\n\
  \n###### 处理异常值\n\n异常值是指与其他数据点相距甚远、过大或过小的观测值。它们可能因人为错误或数据倾斜而存在。\n\n需要使用以下可视化技术和统计技术（其中一些在前面章节已讨论）来检测异常值：\n\
  \n*   箱线图\n*   Z-score\n*   裁剪\n*   四分位距（IQR）\n\n一旦检测到异常值，可以将其从数据集中移除以免影响模型训练，也可以使用均值、中位数、众数或边界值进行插补或替换。\n\
  \n##### 建立数据约束\n\n数据分析和探索过程会产生关键洞察和结果，例如数据质量问题（缺失值、异常值和类型转换）。\n\n为了进行一致且可复现的检查，需要通过为\
  \ ML 流水线定义模式来建立数据约束。\n\n带有定义元数据的模式描述了数据的属性，例如数据类型（数值型与分类型）、允许范围、格式以及数据值的分布。模式是数据分析过程的输出。\n\
  \n拥有模式的优势如下：\n\n*   对于特征工程和数据转换，分类数据和数值数据都需要转换。模式支持元数据驱动的预处理。\n*   可以使用数据模式验证新数据，并在训练和预测期间捕捉偏斜和异常值等异常情况。\n\
  \n###### 大数据规模下的探索与验证\n\n数据量正在快速增长。训练深度神经网络需要大量数据。验证这些大型数据集的挑战在于数据需要在内存中进行验证。需要多台机器来扩展大型数据集的数据验证规模。\n\
  \n`TensorFlow Data Validation`（TFDV）可用于大规模理解、验证和监控 ML 数据（参见图 2.5）。\n\nTFDV 用于检测数据中的数据异常和模式异常。它是\
  \ `TensorFlow Extended`（TFX）平台的一部分，为 ML 流水线中的大型数据集提供数据验证和模式验证库。关键的 TFX 库包括：`TensorFlow\
  \ Data Validation`、`TensorFlow Transform`（用于数据预处理和特征工程）、`TensorFlow Model Analysis`（用于\
  \ ML 模型评估和分析）以及 `TensorFlow Serving`（用于服务 ML 模型）。\n\n![FIGURE 2.5 TensorFlow Data\
  \ Validation](img/c02f005.png)\n\n**图 2.5** TensorFlow Data Validation\n\nTFDV 的使用方式如下：\n\
  \n*   **探索性数据分析阶段** 可以使用 TFDV 生成数据模式，以了解 ML 流水线的数据。此模式可作为 ML 流水线与数据之间的定义契约。每当模式被违反时，需要修复数据或流水线。\n\
  *   **生产流水线阶段** 模型部署后，此模式可用于定义基线，以检测训练和服务期间导致模型偏斜或漂移的任何新数据。\n\n##### 在 Google Cloud\
  \ Platform 上运行 TFDV\n\nTFDV 核心应用程序编程接口（API）构建在用于构建批处理和流式处理流水线的 Apache Beam 开源软件开发工具包（SDK）之上。`Dataflow`\
  \ 是一项托管服务，可大规模运行 Apache Beam 数据处理流水线。\n\n`Dataflow` 与数据仓库无服务器服务 `BigQuery` 和数据湖（`Google\
  \ Cloud Storage`）以及 `Vertex AI Pipelines` 机器学习原生集成。\n\n##### 组织和优化训练数据集\n\n在上一节中，你学习了如何检查数据质量。本节将讨论数据采样、不平衡数据以及如何划分数据集。我们通常将数据划分为训练集、测试集和验证集（参见图\
  \ 2.6）。\n\n![FIGURE 2.6 Dataset representation](img/c02f006.png)\n\n**图 2.6** 数据集表示\n\
  \n*   **训练数据集** 这是用于训练模型的实际数据集，模型从此数据中学习。\n*   **验证数据集** 这是用于模型评估的数据子集。此数据用于超参数调优。模型不使用此数据进行学习（这与训练数据不同）。它用于在训练后改进模型行为。\n\
  *   **测试数据集** 这是用于测试或评估模型性能的数据样本。测试集不同于训练集和验证集，因为它在模型训练和验证后使用。测试集不应包含验证集或训练集中的数据样本，因为这可能导致数据泄露。此外，绝不应使用测试集训练数据。\n\
  \n###### 不平衡数据\n\n当数据集中的两个类别不相等时，结果就是不平衡数据。如图 2.7 所示，数据集中信用卡欺诈的可能性比非欺诈小得多。\n\n以信用卡交易为例，假设在所有交易中，1000\
  \ 笔非欺诈，仅 5 笔欺诈。这是不平衡数据的典型表现。在这种情况下，没有足够的交易来训练模型对信用卡交易是否为欺诈进行分类。训练模型将花费更多时间在非欺诈场景上。\n\
  \n在随机采样中，可以执行*过采样*（复制少数类样本）或*欠采样*（删除多数类样本）。这两种方法都会引入偏差，因为它们通过引入更多或更少的样本来消除不平衡。\n\
  \n![FIGURE 2.7 Credit card data representation](img/c02f007.png)\n\n**图 2.7** 信用卡数据表示\n\
  \n现在考虑前面的例子，对多数类（非欺诈示例）进行降采样。按 10 倍降采样将改善平衡（参见图 2.8）。\n\n![FIGURE 2.8 Downsampling\
  \ credit card data](img/c02f008.png)\n\n**图 2.8** 信用卡数据降采样\n\n现在对降采样的类别增加权重。由于我们按\
  \ 10 倍因子降采样，示例权重应为 10。*示例权重*意味着在训练期间将单个示例视为更重要。示例权重为 10 意味着模型将该示例视为比权重为 1 的示例重要\
  \ 10 倍（在计算损失时）。请参考 `https://developers.google.com/machine-learning/data-prep/construct/sampling-splitting/imbalanced-data`\
  \ 了解更多信息。\n\n对多数类进行降采样并增加降采样类别权重的优势之一是模型收敛更快，因为与降采样和加权之前的数据相比，我们拥有更多的少数类示例。\n\n\
  ###### 数据划分\n\n通常在通用数据清洗中，会从数据的随机划分开始。例如，考虑具有天然聚类示例的数据集。\n\n假设你想让模型对书籍文本中的主题进行分类。主题可以是恐怖、爱情故事和戏剧。在这种情况下，随机划分会是一个问题。\n\
  \n为什么随机划分会导致偏斜？因为同类主题的故事写在同一时间线上。如果数据随机划分，测试集和训练集可能包含相同的故事。\n\n\n\n\n为了解决这个问题，请尝试根据故事发布的时间来拆分数据。例如，您可以将六月撰写的故事放入训练集，将七月发布的故事放入测试集。\n\
  \n解决此问题的另一种简单方法是根据故事发布的时间拆分数据。例如，您可以使用四月的故事进行训练，然后使用五月第二周的故事作为测试集，以防止重叠。\n\n######\
  \ 在线系统的数据拆分策略\n\n对于在线系统，建议按时间拆分数据，因为训练数据比服务数据更旧。通过按时间拆分数据，您可以确保验证集反映训练和预测之间的时间滞后。\n\
  \n步骤如下：\n\n1.  执行 30 天的数据收集。\n2.  使用第 1 天到第 29 天的数据创建训练集。\n3.  使用第 30 天的数据创建验证集。\n\
  \n通常，基于时间的拆分最适合非常大的数据集，例如包含数百万个样本的数据。\n\n当数据是聚类数据时——例如一本书或一个在线系统——您必须确保以一种方式拆分数据，使您的模型不会利用预测时不可用的信息进行训练。这就是为什么您应该使用基于时间的方法而不是随机拆分。对于数据拆分，您应该始终利用领域知识来理解何时随机拆分有效，何时需要基于时间的拆分。\n\
  \n##### 处理缺失数据\n\n为什么会有缺失数据？在现实场景中，缺失数据可能是由于记录数据失败造成的，也可能是由于数据损坏。结构化数据中缺失数据的一些示例可以是\
  \ `NaN` 值或给定特征的 `null` 值。因此，为了有效地训练模型，您需要考虑处理缺失数据的方法。\n\n以下列表包含处理缺失数据的一些方法：\n\n\
  *   删除包含缺失值（如 `null` 或 `NaN`）的行或列。如果一列中超过一半的行为 `null`，则可以删除整列。具有一个或多个列值为 `null`\
  \ 的行也可以删除。这种方法的缺点是信息丢失，如果完整数据集中有大比例的数据缺失，模型将表现不佳。\n*   替换数据集中具有缺失值的数值型连续列或特征（如年龄或利率）的缺失值。您可以用该列剩余值的平均值、中位数或众数来替换缺失值。与删除列或行相比，此方法可以防止数据丢失。此方法适用于小型数据集。此外，此方法不考虑特征之间的协方差，并可能导致数据泄露，我们将在下一节讨论该问题。\n\
  *   对于分类列（字符串或数值）中的缺失值，可以用最高频类别替换缺失值。此方法称为**插补法**。如果缺失值数量非常大，则可以用新类别替换缺失值。此方法的缺点是在独热编码时会编码额外添加的特征。\n\
  *   您可以使用最后一个有效观测值来填补缺失值。这被称为 `last observation carried forward (LOCF)` 方法（最后观测值前向填充法）。此方法可以减少偏差。\n\
  *   对于时间序列数据集，您可以使用时间戳前后变量的插值来填补缺失值。\n*   也可以使用能够忽略数据中缺失值的机器学习算法。例如，当值缺失时，`k‐nearest\
  \ neighbors (k‐NN)` 算法（k-近邻算法）可以在距离度量中忽略某一列。`Naive Bayes`（朴素贝叶斯）在进行预测时也可以支持缺失值。\n\
  \n    此外，`Random Forest`（随机森林）算法在非线性和分类数据上效果很好。它能适应数据结构，考虑高方差或偏差，在大型数据集上产生更好的结果。\n\
  *   使用机器学习预测缺失值。包含缺失值的变量与其他变量之间的相关性可用于预测缺失值。可以使用回归或分类模型，基于非缺失变量来预测缺失值。\n\n#####\
  \ 数据泄露\n\n数据泄露是指在训练期间将测试数据暴露给机器学习模型。结果，模型在训练和测试期间表现良好，但当面对未见过的数据时，表现不佳。数据泄露会导致模型过拟合，因为模型已经从测试和训练数据中学习到了信息。\n\
  \n以下是数据泄露的一些原因：\n\n*   目标变量是模型试图预测的输出，特征是输入模型以进行预测或预测目标变量的数据。数据泄露的原因是您错误地将目标变量作为特征添加进去了。\n\
  *   在为模型训练拆分测试数据和训练数据时，您将测试数据包含在了训练数据中。\n*   存在暴露目标变量信息的特征，这些特征在模型部署后将不可用。这也称为**标签泄露**，可以通过检查目标变量与特征之间的相关性来检测。\n\
  *   对整个数据集应用预处理技术（归一化特征、移除异常值等）会导致模型不仅学习训练集，还学习测试集，从而导致数据泄露。\n\n数据泄露的一个典型例子是时间序列数据。例如，在处理时间序列数据时，如果我们在计算当前特征或进行预测时使用了未来的数据，我们极有可能得到一个泄露的模型。这通常发生在数据被随机拆分为训练和测试子集时。\n\
  \n您可能遇到数据泄露的情况如下：\n\n*   如果模型的预测输出与实际输出一样好，这可能是因为数据泄露。这意味着模型可能以某种方式记住了数据，或者可能已经接触过实际数据。\n\
  *   在进行探索性数据分析时，拥有与目标变量高度相关的特征可能是数据泄露。\n\n数据泄露主要发生是因为我们拆分数据的*方式*和拆分数据的*时间*。现在，让我们了解如何防止数据泄露：\n\
  \n*   选择与给定目标变量不相关或不包含目标变量信息的特征。\n*   将数据拆分为测试集、训练集和验证集。验证集的目的是模拟真实场景，它将有助于识别任何可能的过拟合情况。\n\
  *   分别对训练数据和测试数据进行预处理。您应该对训练数据执行归一化，而不是对完整数据集执行，以避免任何泄露。\n*   在时间序列数据的情况下，设置一个时间截止值，因为它可以防止您获取预测时间点之后的任何信息。\n\
  *   交叉验证是在数据有限时避免数据泄露的另一种方法。但是，如果仍然发生数据泄露，则对数据进行缩放或归一化，并在交叉验证的每一折上分别计算参数。\n\n此外，生产数据与训练数据的差异必须体现在验证数据拆分与训练数据拆分的差异，以及测试数据拆分与验证数据拆分的差异中。\n\
  \n例如，如果您计划预测未来 30 天的用户生命周期价值 (LTV)，那么请确保验证数据拆分中的数据来自训练数据拆分之后的 30 天，并且测试数据拆分中的数据来自验证数据拆分之前的\
  \ 30 天。\n\n#### 总结\n\n\n\n### 第 2 章：数据可视化、质量与验证\n\n在本章中，我们讨论了为什么需要可视化数据以及可视化数据的各种方法，例如使用箱线图、折线图和散点图。然后我们介绍了统计基础知识，如平均值、中位数、众数和标准差，以及它们在发现数据离群值时的相关性。此外，你还学习了如何使用折线图检查数据相关性。\n\
  \n你了解了各种数据清洗和归一化技术，例如对数缩放、缩放、裁剪以及使用 z-score 来提高数据质量。\n\n我们还讨论了建立数据约束，以及为什么在 ML 流水线中定义数据架构很重要，还有验证数据的必要性。我们介绍了使用\
  \ `TFDV` 大规模验证数据，以及为什么需要 `TFDV` 来验证大规模深度学习系统的数据架构。然后我们讨论了拆分数据所用的策略，并讲述了针对不平衡数据集的数据拆分策略。我们介绍了基于时间的拆分方法（用于在线系统）和聚类数据拆分。\n\
  \n最后，我们介绍了处理缺失数据和数据泄露的策略。\n\n#### 考试要点\n\n*   **能够可视化数据。** 理解为什么需要可视化数据以及各种可视化方法，例如使用箱线图、折线图和散点图。\n\
  *   **理解统计术语的基础知识。** 能够描述平均值、中位数、众数和标准差，以及它们在发现数据离群值时的相关性。还要知道如何使用折线图检查数据相关性。\n\
  *   **确定数据质量、可靠性或可行性。** 理解为什么需要没有离群值的数据，什么是数据倾斜，并了解各种数据清洗和归一化技术，例如对数缩放、缩放、裁剪和 z-score。\n\
  *   **建立数据约束。** 理解为什么在 ML 流水线中定义数据架构很重要，以及验证数据的必要性。此外，你需要理解用于大规模验证数据的 `TFDV`。\n\
  *   **组织和优化训练数据。** 你需要理解如何将数据集拆分为训练数据、测试数据和验证数据，以及如何在拥有聚类数据和在线数据时应用数据拆分技术。还要理解拥有不平衡数据时的采样策略。\n\
  *   **处理缺失数据。** 了解处理缺失数据的各种方法，例如删除缺失值；用平均值、中位数或众数替换缺失值；或使用 ML 来生成缺失值。\n*   **避免数据泄露。**\
  \ 了解数据泄露和标签泄露在数据中发生的各种方式以及如何避免它们。\n\n#### 复习题\n\n1.  你是公司的数据科学家。你有一个包含信用卡交易的数据集，其中\
  \ 1% 的信用卡交易是欺诈性的。哪种数据转换策略可能会提高分类模型的性能？\n    1.  将数据写入 `TFRecords`。\n    2.  对所有数值特征进行\
  \ Z-score 归一化。\n    3.  对所有分类特征使用独热编码。\n    4.  对欺诈交易进行过采样。\n\n2.  你是一名研究科学家，正在利用医疗记录构建癌症预测模型。模型特征包括患者姓名、医院名称、年龄、生命体征和检测结果。该模型在保留的测试数据上表现非常好，但在新患者数据上表现不佳。原因是什么？\n\
  \    1.  特征“医院名称”与预测结果之间存在强相关性。\n    2.  在所有可用特征之间随机拆分数据。\n    3.  特征“医院名称”和“年龄”中存在缺失值。\n\
  \    4.  特征“医院名称”与“年龄”之间存在负相关性。\n\n3.  你的团队训练并测试了一个准确率为 99% 的深度神经网络模型。模型部署六个月后，由于输入数据分布的变化，模型表现不佳。应该如何解决输入数据分布问题？\n\
  \    1.  创建警报以监控倾斜并重新训练模型。\n    2.  执行特征选择并重新训练模型。\n    3.  在超参数调优后重新训练模型。\n   \
  \ 4.  每月重新训练模型以检测数据倾斜。\n\n4.  你是一名构建和管理销售预测生产系统的 ML 工程师。模型准确度很重要，因为生产模型必须跟上市场变化。生产一个月后，模型未改变但模型准确度下降了。导致模型准确度下降的最可能原因是什么？\n\
  \    1.  准确度因数据质量差而下降。\n    2.  缺乏模型重新训练。\n    3.  验证集、测试集和训练集的数据拆分比例不正确。\n    4.\
  \  训练数据缺失。\n\n5.  你是一家制造公司的数据科学家。你被要求根据传感器读数调查生产线故障。你意识到 1% 的数据样本是故障传感器读数的正例。你将如何解决类别不平衡问题？\n\
  \    1.  使用类别分布生成 10% 的正例。\n    2.  对多数类数据进行降采样并加权以创建 10% 的样本。\n    3.  删除负例直到正负例数量相等。\n\
  \    4.  使用带有 softmax 激活函数的卷积神经网络。\n\n6.  你是气象部门的数据科学家，受命构建模型预测日温度。你随机拆分数据，然后转换训练集和测试集。用于模型训练的温度数据每小时上传一次。测试期间，模型准确率达\
  \ 99%；然而，在生产环境中，准确率下降到 70%。如何提高模型在生产环境中的准确率？\n    1.  基于时间而非随机拆分训练集和测试集，以避免泄露。\n\
  \    2.  将训练集和测试集的数据归一化作为两个独立的步骤。\n    3.  向数据集添加更多数据，以获得公平的分布。\n    4.  在拆分前转换数据，并进行交叉验证以确保转换同时应用于训练集和测试集。\n\
  \n7.  你正在从事一个基于神经网络的项目。提供给你的数据集包含不同范围的列和大量缺失值。在为模型训练准备数据时，你发现梯度优化在移动权重时遇到困难。你应该怎么做？\n\
  \    1.  使用特征构造来组合最强特征。\n    2.  使用归一化技术转换数据。\n    3.  通过删除含缺失值的特征来改进数据清洗步骤。\n \
  \   4.  更改超参数调优步骤以减小测试集维度并扩大训练集。\n\n8.  你是一名致力于将模型投入生产的 ML 工程师。你的模型在训练数据上表现良好。然而，模型在生产环境中性能下降，且模型出现过拟合。可能的原因是什么？（选择三项。）\n\
  \    1.  对整个数据集应用归一化特征（如移除离群值）\n    2.  目标变量与特征之间存在高相关性\n    3.  删除含缺失值的特征\n   \
  \ 4.  将目标变量作为特征添加\n\n### 第 3 章：特征工程\n\n在上一章中，我们讨论了拥有高质量数据的重要性。我们介绍了获取高质量数据的一些方法，例如移除缺失值、移除离群值和使用数据归一化。在本章中，我们将介绍特征工程技术。我们还将介绍编码结构化数据类型、类别不平衡、特征组合以及用于执行特征工程的\
  \ `TensorFlow Transform`。\n\n\n\n#### 特征工程\n\n*特征工程*是将来自各种来源（如日志文件和气象读数）的原始数据转换为用于模型训练的有用特征的过程。特征可以是数值型或类别型。让我们了解数据转换的主要原因。\n\
  \n##### 为数据兼容性而转换\n\n数据由数值特征和非数值特征组成。您的模型无法对字符串类型的数据执行数学计算。这就是为什么将此类特征转换为模型能够理解的向量或数值表示非常重要。\n\
  \n您还需要调整输入数据的大小，以匹配模型中的输入节点；例如，线性模型和前馈神经网络具有固定数量的输入节点。因此，您的输入数据必须始终保持相同的大小。\n\n\
  ##### 为数据质量而转换\n\n这种类型的转换有助于模型表现得更好。例如，将文本特征转换为小写可以提高性能，分词或在模型训练前归一化数值特征也能起到同样的作用。\n\
  \n现在您已了解特征工程为何重要，让我们在下一节讨论在模型训练或模型预测阶段何时应用特征转换。\n\n#### 一致的数据预处理\n\n一致的数据预处理是必要的，因为您可以在磁盘上生成数据时或在模型内部应用转换。让我们讨论这些方法：\n\
  \n##### 训练前数据转换\n\n这意味着在完整数据集上进行模型训练*之前*执行数据转换。您的转换代码独立于您的机器学习模型。这种方法的优点是计算仅执行一次，并且它可以查看整个数据集以确定转换。\n\
  \n这种方法的一些缺点是：在预测时需要重现相同的转换，如果预测时的数据发生变化，可能会导致偏差，尤其是在在线服务或预测的情况下。另一个挑战是更新转换。如果您想更新数据转换，就必须在整个数据集上重新运行转换，导致迭代缓慢和计算时间增加。\n\
  \n##### 模型内数据转换\n\n在这种方法中，转换是模型代码的一部分，因为模型接收未转换或原始数据作为输入，并在训练前在模型内部对其进行转换。这种方法的优点之一是易于将数据和转换解耦。即使您的转换技术发生变化，您仍然可以使用相同的数据。由于转换是模型的一部分，您在训练和服务期间也使用相同的转换。这种方法的缺点是，如果转换规模大或计算量大，会增加模型延迟。转换是按数据批次完成的，如果您试图使用数据批次而不是整个数据集来设置均值以归一化数据，这可能会成为一个问题。\n\
  \n这可以通过 `tf.Transform` 解决，我们将在本章后面的“TensorFlow Transform”部分介绍。\n\n#### 编码结构化数据类型\n\
  \n一个好的特征应该与业务目标相关、在预测时已知、具有数值大小的数值型，并拥有足够的样本。让我们看看我们将在本章中使用的特征工程中的各种数据类型。\n\n#####\
  \ 类别数据\n\n这种数据类型定义类别，且数据仅取有限数量的值——例如，数据列中的是/否类型数据、性别类别中的男/女值等。\n\n##### 数值数据\n\n\
  这表示标量值或连续数据形式的数据，如观测值、记录和测量值。\n\n###### 映射数值\n\n整数和浮点数据不需要特殊编码，因为它们可以乘以数值权重。您可能需要对数值数据应用两种转换：归一化和分桶。\n\
  \n####### 归一化\n\n我们在第 2 章“探索数据和构建数据管道”的数据清洗部分介绍了缩放、对数缩放、Z 分数和裁剪等归一化技术。您会在两种情况下对数值数据执行归一化：\n\
  \n*   **具有截然不同范围的数值特征（例如年龄和收入）：** 在这种情况下，由于数据范围各异，模型梯度下降可能会减慢收敛。这就是 `AdaGrad` 和\
  \ `Adam` 优化技术能提供帮助的原因，因为它们为每个特征创建单独的学习率。\n*   **覆盖宽范围的数值特征（如城市）：** 如果不归一化，此类数据集模型将生成\
  \ `NaN` 数据错误。在这种情况下，即使是 `Adam` 和 `AdaGrad` 等优化器，也无法在单个特征中存在宽范围值时防止 `NaN` 错误。\n\n\
  ####### 分桶\n\n分桶是将数值数据转换为类别数据。例如，纬度可以是浮点值，而在预测房价与位置的关系时，很难表示它。分桶有两种方法：\n\n*   **创建等间距边界的桶：**\
  \ 您创建一系列桶，某些桶可能比其他桶拥有更多的数据点。例如，为了表示降雨量，您可以按范围分桶（0–50 厘米，50–100 厘米）；在降雨强度较小的地区，您可能在\
  \ 0–50 厘米的降雨量范围内拥有更多数据点。\n*   **分位数边界的桶：** 每个桶拥有相同数量的点。边界不是固定的，可能包含窄或宽的值跨度。\n\n\
  ###### 映射类别值\n\n有多种方法可以将您的类别数据转换为数值数据，以便您的模型能够理解。\n\n####### 标签编码或整数编码\n\n在标签编码中，您将使用词汇表进行索引。如果数据字段的类别数量较少，例如犬种或一周中的日期，您可以为每个类别创建一个唯一特征并分配一个整数值。例如，评分可以分配为“满意”=\
  \ 1，“良好”= 2，“最佳”= 3。仅当类别代表有限范围或有序值时，才能应用整数评分。\n\n####### 独热编码\n\n独热编码是创建哑变量的过程。此技术用于顺序无关的类别变量。当特征为名义型（没有任何顺序）时，使用独热编码技术。让我们先讨论类别数据中的有序关系是什么；例如，有序变量可以是社会经济地位（低收入、中等收入、高收入）、教育水平（高中、学士、硕士、博士）、收入水平（低于\
  \ 5 万、5 万–10 万、10 万以上）、满意度评分（极其不喜欢、不喜欢、中立、喜欢、极其喜欢）。对于不存在这种有序关系的类别变量，整数编码是不够的。\n\n\
  在独热编码中，为每个类别特征创建一个新变量。这是一个将类别变量转换为整数编码或整数值的二进制表示的过程。让我们看看表 3.1 所示的两种颜色的示例。每种颜色都可以用二进制值表示。\n\
  \n**表 3.1** 独热编码示例\n\n| 类别值 | 整数编码或创建词汇表映射 | 独热编码 |\n| --- | --- | --- |\n| 红色 |\
  \ 0 | 00 |\n| 蓝色 | 1 | 01 |\n\n有时您有巨大的二进制空间需要表示，这可能会导致包含大量 0 的稀疏表示。\n\n####### 词汇表外（OOV）\n\
  \n\n\n#### 处理分类数据异常值\n\n对于分类数据包含异常值的情况，你可以为所有异常值创建一个名为 `out of vocabulary` 的单一类别，而不是给它们唯一的表示，因为它们在数据集中出现的频率非常低。当你使用这种方法时，ML\
  \ 系统就不会浪费时间在每个罕见异常值上进行训练。\n\n##### 特征哈希\n\n哈希通过将 `hash function`（哈希函数）应用于分类特征，并直接使用其哈希值作为索引，而不是查找词汇表。哈希经常导致冲突，这就是为什么对于重要术语，哈希可能比选择词汇表效果更差。哈希的优势在于，当特征分布随时间发生剧烈变化时，它不需要你组装词汇表。\n\
  \n##### 哈希与词汇表的混合方法\n\n在这种方法中，你可以对数据中最重要的类别使用词汇表，并用哈希类别替换超出词汇表范围的类别。这种方法的优势在于，每个超出词汇表的类别都用哈希表示，模型仍然能学习词汇表之外的类别。\n\
  \n##### 嵌入\n\n嵌入是将分类特征表示为连续值特征。深度学习模型经常将索引从索引转换为嵌入。嵌入主要用于文本分类或文档分类，此时你拥有词袋或词语文档。\n\
  \n#### 特征选择\n\n**特征选择** 是指选择特征子集或减少输入变量的数量，保留对模型预测目标变量最有用的特征。\n\n**降维** 是减少特征数量最流行的技术之一。其优势在于减少数据中的噪声和过拟合问题。数据维度降低意味着训练时间和计算资源减少，并提高机器学习算法的整体性能。这可以通过两种方式实现：\n\
  \n*   **仅保留最重要的特征**：使用的技术包括向后选择和随机森林。\n*   **寻找新特征的组合**：使用的技术包括主成分分析（PCA）和 t 分布随机邻域嵌入（t-SNE）。\n\
  \n#### 类别不平衡\n\n我们在第 2 章中介绍了数据类别不平衡，在本节中，我们将讨论特定于分类模型的类别不平衡。\n\n分类模型依赖于我们在第 1 章“构建\
  \ ML 问题”中介绍的一些关键结果：\n\n*   **真阳性** 是指模型正确预测正类的结果；例如，接受检测的患者确实感染了病毒。\n*   **真阴性**\
  \ 是指模型正确预测负类的结果，即接受检测的患者结果为阴性，且他们实际上并未患病。\n*   **假阳性** 是指模型错误预测正类的结果，意味着患者实际上未患病，但检测预测他们患病。\n\
  *   **假阴性** 是指模型错误预测负类的结果，意味着患者患病，但检测判定他们未患病。\n\n在这种情况下，假阴性是个问题，因为你不希望生病的患者被识别为未生病。因此，你需要致力于在分类模型中最小化假阴性结果。\n\
  \n##### 带有精确率和召回率的分类阈值\n\n为了将逻辑回归值映射到二元类别，你需要定义一个 **分类阈值**（也称为 **决策阈值**）。这是一个由人类选择的值，而非模型训练选择的值，通常在大多数情况下，该阈值假定为\
  \ 0.5。逻辑回归模型输出 0 到 1 之间的值。假设人类设定的分类阈值为 0.6，模型预测值为 0.7，则模型预测为正类。分类阈值的选择强烈影响假阳性和假阴性的数量。分类阈值大多取决于具体问题，必须进行微调。精确率-召回率曲线表明模型预测正类的效果如何。精确率是指真阳性数量除以正预测总数，而召回率也称为真阳性率（TPR）。召回率是指机器学习模型正确识别为感兴趣类别（即“正类”）的数据样本百分比，占该类别总样本数的比例。\n\
  \n精确率和召回率对于评估模型都很重要。然而，如果你提高精确率，会降低召回率，反之亦然。\n\n如果你想最小化假阳性，则提高分类阈值。对于这些问题，精确率对你非常重要。例如，你宁愿模型将垃圾邮件分类为非垃圾邮件，也不愿将非垃圾邮件分类为垃圾邮件。当你更关注正类而非负类时，应使用精确率。\n\
  \n如果你想最小化假阴性，则降低分类阈值。对于这些问题，召回率对你非常重要。换句话说，你倾向于让模型将未患病患者分类为患病，但如果将患病患者识别为未患病则会是个问题。在这类场景中，如果你更关注负类而非正类，应使用召回率。\n\
  \n召回率回答的问题是：在所有可能的正样本中，模型正确识别了多少？\n\n##### 曲线下面积 (AUC)\n\n在本节中，我们将介绍分类问题中两种类型的曲线下面积。\n\
  \n*   **AUC ROC**：用于分类问题中的平衡数据集，即我们试图预测的两个类别拥有相同数量的样本。\n*   **AUC PR**：用于分类问题中的不平衡数据集，例如信用卡交易中的欺诈识别。假设你有\
  \ 10,000 笔信用卡交易，欺诈数据可能是每 1,000 笔交易中只有 1 笔。\n\n###### AUC ROC\n\nROC 曲线（受试者工作特征曲线）是一张展示分类模型在所有分类阈值下性能的图表。该曲线绘制两个参数：真阳性率和假阳性率。你可以参考此链接查看图表外观：\n\
  \n`https://developers.google.com/machine-learning/crash-course/classification/roc-and-auc`\n\
  \nAUC ROC（ROC 曲线下面积）测量整个 ROC 曲线下方的二维面积。它指的是一个 0.0 到 1.0 之间的数字，代表二元分类模型将正类与负类分开的能力。\n\
  \nAUC 越接近 1.0，模型区分类别的能力越强。当类别平衡，或当你希望赋予正负类预测能力同等权重时，使用 AUC ROC 曲线。\n\n###### AUC\
  \ PR\n\nPR 曲线是一张以精确率值为 y 轴、召回率值为 x 轴的图表。PR 曲线关注少数类，使其成为不平衡二元分类模型的有效诊断工具。\n\n精确率-召回率曲线下面积（AUC\
  \ PR）测量 PR 曲线下方的二维面积。在类别不平衡的情况下，对于高度偏斜的领域，推荐使用精确率-召回率曲线（PR 曲线）。AUC PR 更关注少数类。它可以结合我们在第\
  \ 2 章中介绍的欠采样或过采样一起使用。\n\n#### 特征组合\n\n\n\n\n#### 特征交叉\n\n*特征交叉*，或称合成特征，是通过将两个或多个特征相乘（交叉）而创建的。它可以是将同一特征与自身相乘\
  \ [`A * A`]，也可以是将多个特征的值相乘，例如 [`A * B * C`]。在机器学习中，特征交叉通常在独热编码特征上执行——例如，`binned_latitude\
  \ × binned_longitude`。（更多信息请参阅 `https://developers.google.com/machine-learning/crash-course/feature-crosses/video-lecture`。）\n\
  \n使用特征交叉主要有两种方式：\n\n*   当单个特征本身的预测能力不如组合特征时，会使用特征交叉。例如，我们有一个模型需要预测在一天中的某个时刻，基于街道位置的人群拥挤程度。如果我们从这两个特征构建特征交叉，[`location\
  \ (market, curbside) × time of the day`]，那么我们将获得比单独使用任一特征强得多的预测能力。例如，如果周二晚上有农贸市场，人群会更拥挤。如果周二晚上没有农贸市场，人群会较少。\n\
  \n*   在具有高度复杂模型的线性问题中，特征交叉用于通过将两个或多个特征相乘（交叉）来在线性模型中表示非线性。线性学习器可很好地扩展到海量数据。在海量数据集上使用特征交叉是学习高度复杂模型的一种高效策略。让我们看一个例子。如\
  \ 图 3.1 所示，圆点代表患病者，矩形代表健康者。很难用直线或线性方法将它们分开。\n\n![图 3.1 难以用直线或线性方法分开](img/c03f001.png)\n\
  \n**图 3.1** 难以用直线或线性方法分开\n\n这是一个线性问题，但从这些变量的数据分布来看，很难用一条直线将圆点与矩形分开，或者说很难用线性方法对它们进行分类，如\
  \ 图 3.2 所示。很难用直线分开类别。\n\n![图 3.2 难以用直线分开类别](img/c03f002.png)\n\n**图 3.2** 难以用直线分开类别\n\
  \n这就是为什么我们要交叉这些特征，即圆点与矩形，以创建特征交叉——例如，`AB = A * B`。请参考此链接以理解编码非线性的概念：`https://developers.google.com/machine-learning/crash-course/feature-crosses/encoding-nonlinearity`。\n\
  \n图 3.3 总结了我们迄今为止介绍的所有用于转换数值和分类数据的特征工程技术。\n\n![图 3.3 特征列总结 Google Cloud via Coursera,\
  \ www.coursera.org/professional‐certificates/preparing‐for‐google‐cloud‐machine‐learning‐engineer‐professional‐certificate](img/c03f003.png)\n\
  \n**图 3.3** 特征列总结 Google Cloud via Coursera, [www.coursera.org/professional‐certificates/preparing‐for‐google‐cloud‐machine‐learning‐engineer‐professional‐certificate](https://www.coursera.org/professional-certificates/preparing-for-google-cloud-machine-learning-engineer-professional-certificate)\n\
  \n##### TensorFlow Transform\n\n提高 TensorFlow 模型性能需要高效的输入流水线。首先我们将讨论 TF Data API，然后介绍\
  \ TensorFlow Transform。\n\n##### TensorFlow Data API (tf.data)\n\n高效的数据输入流水线可以通过减少设备空闲时间，大幅提高模型执行速度。请考虑采纳\
  \ `here` 中详述的以下最佳实践，使您的数据输入流水线更加高效：\n\n*   使用预取转换来重叠预处理和训练步骤的模型执行。此转换将数据生成的时间与数据消费的时间解耦。`tf.data`\
  \ API 提供了 `tf.data.Dataset.prefetch` 转换。\n\n*   `tf.data.Dataset.interleave` 转换可并行化数据读取。通过使用\
  \ interleave 转换，您可以减轻各种数据提取开销的影响。\n\n*   使用缓存转换在第一个 epoch 期间将数据缓存在内存中。`tf.data.Dataset.cache`\
  \ 转换可以缓存数据集，无论是在内存中还是在本地存储上。这将节省一些操作（如文件打开和数据读取）在每个 epoch 中重复执行。\n\n*   在一批数据集上向量化用户定义函数。数据集被传递给\
  \ map 转换。\n\n*   在应用 interleave、prefetch 和 shuffle 转换时减少内存使用量。\n\n##### TensorFlow\
  \ Transform\n\nTensorFlow Transform 库是 TensorFlow Extended (TFX) 的一部分，它允许您在训练模型之前执行转换，并生成一个\
  \ TensorFlow 图，该图在训练期间复现这些转换。使用 tf.Transform 可避免训练-服务偏差。在 Google Cloud 中，您可以使用 Cloud\
  \ Dataflow 创建转换流水线。TF Transform 在训练和服务期间进行转换的一些步骤包括分析训练数据、转换训练数据、转换评估数据、生成元数据、馈送模型和服务数据，如\
  \ 图 3.4 所示。\n\n![图 3.4 TensorFlow Transform ¶ 来源：改编自 Google Cloud](img/c03f004.png)\n\
  \n**图 3.4** TensorFlow Transform ¶ 来源：`Adapted from Google Cloud`\n\n您可以使用 Cloud\
  \ Dataflow 和 BigQuery 运行上述流水线：\n\n1.  从 BigQuery 读取训练数据。\n2.  使用 tf.Transform Cloud\
  \ Dataflow 分析和转换训练数据。\n3.  将转换后的训练数据作为 TFRecords 写入 Cloud Storage。\n4.  从 BigQuery\
  \ 读取评估数据。\n5.  在 Cloud Dataflow 中使用步骤 2 生成的 `transform_fn` 转换评估数据。\n6.  将转换后的训练数据作为\
  \ TFRecords 写入 Cloud Storage。（注：原文此处为 \"training data\"，根据上下文应为评估数据，但此处严格翻译原文）\n\
  7.  将转换工件写入 Cloud Storage，用于创建和导出模型。\n\n表 3.2 展示了如何使用 Google Cloud Platform (GCP)\
  \ 服务运行 TFX 流水线。\n\n**表 3.2** 在 GCP 上运行 TFX 流水线\n\n| 步骤 | TFX 库 | GCP 服务 |\n| ---\
  \ | --- | --- |\n| 数据提取和验证 | TensorFlow Data Validation | Cloud Dataflow |\n| 数据转换\
  \ | TensorFlow Transform | Cloud Dataflow |\n| 模型训练和调优 | TensorFlow (tf.Estimators\
  \ and tf.Keras) | Vertex AI Training |\n| 模型评估和验证 | TensorFlow Model Analysis |\
  \ Cloud Dataflow |\n| 用于预测的模型服务 | TensorFlow Serving | Vertex AI Prediction |\n\n\
  #### GCP 数据和 ETL 工具\n\n我们将在 第 8 章 \"模型训练和超参数调优\" 中详细介绍完整的数据分析生态系统，从数据收集到存储。以下是两个有助于在\
  \ Google Cloud 中进行数据转换和 ETL 的工具：\n\n*   **Cloud Data Fusion** 是一个无代码、基于 Web UI 的托管服务，有助于从各种数据源构建和管理提取、转换、加载\
  \ (ETL) 或提取、加载、转换 (ELT) 流水线。Web UI 可帮助您在无需基础设施管理的情况下清理和准备数据。它还支持 Cloud Dataproc，后者是另一项在\
  \ Google Cloud 上运行和管理 Hadoop 与 Spark 工作负载的服务。使用 Dataproc 作为执行环境，Cloud Data Fusion\
  \ 允许您运行 MapReduce 和 Spark 流式处理流水线。请参考此链接了解更多信息：`https://cloud.google.com/data-fusion#section-9`。\n\
  \n\n\n\n\n##### Dataprep by Trifacta\n\n**Dataprep by Trifacta** (`https://cloud.google.com/dataprep`)\
  \ 是一款无服务器的智能工具，用于以可视化方式探索、清洗和准备结构化及非结构化数据，以便大规模进行分析、报告和机器学习。无需部署或管理基础设施。此外，由于它是无服务器且基于\
  \ UI 的，因此无需管理基础设施，也无需编写代码。它会建议您的下一步数据转换，并随每次 UI 输入进行预测。\n\n#### 概要\n\n在本章中，我们讨论了特征工程，以及为什么转换数值特征和类别特征对于模型训练和服务至关重要。\n\
  \n随后，我们讨论了转换数值特征的各种技术，例如分桶和归一化。我们还讨论了转换类别特征的技术，如线性编码、独热编码、词表外处理、哈希和嵌入。\n\n您了解了为什么特征选择很重要，以及一些降维技术，如\
  \ PCA。然后我们介绍了类别不平衡，以及精确率和召回率如何影响分类。对于不平衡类别，AUC PR 比 AUC ROC 更有效。\n\n我们还讨论了为什么特征组合很重要以及特征组合的好处。\n\
  \n我们介绍了如何使用 `tf.data` 表示 TensorFlow 的数据，随后介绍了 `tf.Transform` 以及如何在 Google Cloud\
  \ 上使用 `tf.Transform` 处理流水线。您了解了一些 Google Cloud 数据处理和 ETL 工具，如 Cloud Data Fusion\
  \ 和 Cloud Dataprep。\n\n#### 考试重点\n\n*   **使用一致的数据处理。** 了解何时转换数据，无论是在训练前还是在模型训练期间。还要了解训练前转换数据的优缺点。\n\
  \n*   **了解如何编码结构化数据类型。** 理解转换数值和类别数据的技术，如分桶、归一化、哈希和独热编码。\n\n*   **理解特征选择。** 了解为什么需要特征选择以及一些特征选择技术，如降维。\n\
  \n*   **理解类别不平衡。** 理解分类问题中的真阳性、假阳性、准确率、AUC、精确率和召回率，以及如何在类别不平衡的情况下有效衡量准确率。\n\n* \
  \  **知道在何处以及如何使用特征组合。** 您需要理解为什么特征组合很重要以及在哪些场景中需要它。\n\n*   **理解 TensorFlow Transform。**\
  \ 您需要理解 TensorFlow Data 和 TensorFlow Transform，以及如何使用 BigQuery 和 Cloud Data Fusion\
  \ 在 Google Cloud 上构建 `tf.Transform` 流水线。\n\n*   **使用 GCP 数据和 ETL 工具。** 知道如何以及何时使用\
  \ Cloud Data Fusion 和 Cloud Dataprep 等工具。例如，如果您正在寻找一种无代码解决方案来清洗数据，您将使用 Dataprep\
  \ 进行数据处理；如果您正在寻找一种无代码且基于 UI 的 ETL（提取、转换、加载）解决方案，您将使用 Cloud Data Fusion。\n\n####\
  \ 复习题\n\n1.  您是公司的数据科学家。您有一个数据集，其中所有特征均为类别特征。您使用某些算法训练了模型。某些算法对此数据效果良好，但更换算法后性能下降。哪种数据转换策略可能会提高模型性能？\n\
  \n    1.  将数据写入 TFRecords。\n    2.  使用类别特征创建特征组合。\n    3.  对所有类别特征使用独热编码。\n    4.\
  \  对特征进行过采样。\n\n2.  您正在从事一个基于神经网络的项目。提供给您的数据集包含不同范围的列。在为模型训练准备数据时，您发现梯度优化难以将权重移动到最优解。您应该怎么做？\n\
  \n    1.  使用特征构造来组合最强特征。\n    2.  使用归一化技术。\n    3.  通过去除缺失值的特征来改进数据清洗步骤。\n    4.\
  \  更改分区步骤以减小测试集维度并获得更大的训练集。\n\n3.  您在一家信用卡公司工作，被要求使用 AutoML Tables 基于历史数据创建一个自定义欺诈检测模型。您需要优先检测欺诈交易，同时将误报降至最低。训练模型时应使用哪个优化目标？\n\
  \n    1.  使对数损失最小化的优化目标。\n    2.  在召回率为 0.50 时使精确率最大化的优化目标。\n    3.  使精确率-召回率曲线下面积\
  \ (AUC PR) 最大化的优化目标。\n    4.  使接收者操作特征曲线下面积 (AUC ROC) 最大化的优化目标。\n\n4.  您是一名数据科学家，正在处理一个带有时间序列数据的分类问题，仅经过几次实验就在训练数据上实现了\
  \ 99% 的接收者操作特征曲线下面积 (AUC ROC)。您尚未探索使用任何复杂算法，也未花费任何时间进行超参数调优。为了识别并修复问题，您的下一步应该是什么？\n\
  \n    1.  通过使用复杂度较低的算法来解决模型过拟合问题。\n    2.  通过在模型训练期间应用嵌套交叉验证来解决数据泄露问题。\n    3. \
  \ 通过移除与目标值高度相关的特征来解决数据泄露问题。\n    4.  通过调整超参数以降低 AUC ROC 值来解决模型过拟合问题。\n\n5.  您正在\
  \ Vertex AI 上使用 TPU 训练 ResNet 模型，以直观地对汽车发动机缺陷类型进行分类。您使用 Cloud TPU 性能分析器插件捕获训练配置文件，并观察到其高度受输入限制。您希望减少瓶颈并加快模型训练过程。您应该对\
  \ `tf.data` 数据集进行哪些修改？（选择两项。）\n\n    1.  使用 interleave 选项读取数据。\n    2.  将 prefetch\
  \ 选项设置为等于训练批次大小。\n    3.  减少 repeat 参数。\n    4.  减少转换中的批次大小参数。\n    5.  增加 shuffle\
  \ 的缓冲区大小。\n\n6.  您受命为一个 ML 训练模型开发输入流水线，该模型以低延迟处理来自不同来源的图像。您发现输入数据无法放入内存。按照 Google\
  \ 推荐的最佳实践，您应如何创建数据集？\n\n    1.  创建 `tf.data.Dataset.prefetch` 转换。\n    2.  将图像转换为\
  \ TFRecords，将图像存储在 Cloud Storage 中，然后使用 `tf.data` API 读取图像进行训练。\n    3.  将图像转换为\
  \ `tf.Tensor` 对象，然后运行 `Dataset.from_tensor_slices()`。\n    4.  将数据转换为 TFRecords。\n\
  \n7.  加利福尼亚州的不同城市房价差异巨大。假设您必须创建一个模型来预测房价。以下哪组特征或特征组合可以学习 roomsPerPerson 与房价之间的城市特定关系？\n\
  \n    1.  两个特征组合：`[分桶纬度 x 分桶 roomsPerPerson]` 和 `[分桶经度 x 分桶 roomsPerPerson]`\n \
  \   2.  三个单独的分桶特征：`[分桶纬度]`、`[分桶经度]`、`[分桶 roomsPerPerson]`\n    3.  一个特征组合：`[分桶纬度\
  \ x 分桶经度 x 分桶 roomsPerPerson]`\n    4.  一个特征组合：`[纬度 x 经度 x roomsPerPerson]`\n\n\n\
  \n\n### 8. 数据集成服务选择\n\n您是一家金融公司的数据工程师。您负责跨各种本地数据集市构建统一的分析环境。由于使用了大量脱节的工具和临时解决方案，您的公司在跨服务器集成数据时面临数据质量和安全挑战。您需要一种全代管的云原生数据集成服务，以降低总工作成本并减少重复性工作。您团队中的一些成员倾向于使用无代码界面来构建提取、转换、加载\
  \ (ETL) 流程。您应该使用哪种服务？\n\n1.  **Cloud Data Fusion**\n2.  Dataprep\n3.  Cloud Dataflow\n\
  4.  Apache Flink\n\n### 9. 模型验证策略\n\n您为一家全球鞋类零售商工作，需要根据历史库存数据预测商品何时会缺货。由于鞋类需求受许多不同因素影响，客户行为高度动态。您希望提供基于所有可用数据训练的模型，但在推送到生产环境之前，跟踪其在特定数据子集上的性能。执行此验证的最简化、可扩展且可靠的方法是什么？\n\
  \n1.  使用 `tf.Transform` 为数据的生产就绪性指定性能指标。\n2.  使用整个数据集，并将接收者操作特征曲线下面积 (AUC ROC) 视为主要指标。\n\
  3.  使用最后一周的相关数据作为验证集，以确保您的模型在当前数据上表现准确。\n4.  使用 k 折交叉验证作为验证策略，以确保您的模型已准备好投入生产。\n\
  \n### 10. 提高生产模型准确性\n\n您在模型训练前转换完整数据集。您的模型在训练中的准确率为 99%，但在生产环境中仅为 66%。改进生产环境中模型的一种可能方法是什么？\n\
  \n1.  在模型训练期间应用转换。\n2.  执行数据归一化。\n3.  移除缺失值。\n4.  **使用 `tf.Transform` 为训练和服务创建生产流水线。**\n\
  \n### 第 4 章：选择合适的 ML 基础设施\n\n在本章中，我们将讨论针对不同类型数据进行训练以及各种部署场景的硬件要求。硬件要求取决于您选择的机器学习\
  \ (ML) 算法类型、训练方法（自定义、AutoML 或预训练）以及数据类型。\n\n通常，用于视频和图像的 ML 模型在每个训练循环中需要大量计算，包括矩阵乘法、加法、减法和微分。这些操作在非常大的矩阵上执行，有时每个数据点可能高达数兆字节。当您拥有数百万个数据点时，这对传统的通用\
  \ CPU 来说就成了一个问题。因此，GPU（最初用于视频渲染或游戏机）被重新用于训练 ML 模型。后来，Google 创建了称为张量处理单元 (TPU) 的定制\
  \ ASIC，其性能表现更佳。这些技术最初应用于视频和图像，随后应用于自然语言处理任务。它们极大地提高了翻译、文本分类以及一般文本到文本问题（模型的输入和输出均为文本）的性能。\n\
  \n让我们探讨可用于训练和部署模型的硬件选项。\n\n#### 预训练模型 vs. AutoML vs. 自定义模型\n\n当您有一个 ML 问题要解决，例如图像分类时，您有三种方法来应对：\n\
  \n*   预训练\n*   AutoML\n*   自定义\n\n图 4.1 展示了模型之间的差异，我们将在本章中详细阐述每一种。\n\n第一种方法是使用任何可用的、现成的预训练模型。这些模型已经由\
  \ Google 在大型数据集上训练完成。这些预训练模型已部署完毕，可通过 API 直接使用。Google 管理这些模型的部署；因此，作为用户，您只需考虑调用\
  \ API 的次数。\n\n![图 4.1 预训练模型、AutoML 和自定义模型](img/c04f001.png)\n\n**图 4.1** 预训练模型、AutoML\
  \ 和自定义模型\n\n使用预训练模型最大的优势在于易用性，以及您能以多快的速度将 ML 融入您的应用程序。在这种情况下，您无需考虑算法、训练方法、训练硬件、部署硬件、可扩展性等。\n\
  \n预训练模型应是您的首选。请仔细考虑预训练模型，并评估它是否适合您的用例。您可以先在应用程序中使用预训练模型，如果认为需要更好的模型，再转向 AutoML 或自定义模型。\n\
  \n预训练模型被成千上万的用户使用，面对数百万的请求，它们由一个工程师团队维护。在所有希望在应用程序中使用 ML 的用户中，大多数会选择预训练模型。图 4.1\
  \ 以金字塔形式展示了这些模型。您会注意到底层（宽阔的一层）代表使用预训练模型的用户数量。\n\n您甚至不必是 ML 工程师就能使用预训练模型。任何开发者都可以通过\
  \ API 使用预训练模型。它们可以通过 Python、Java 和 Node.js SDK 轻松使用。我们将在本章后面提供可用预训练模型的详细列表。\n\n\
  使用预训练模型时，您无需预配任何云资源，仅通过 API 使用。这称为*无服务器*方式，您将根据向 API 发出请求的次数付费。部分 API 提供免费层级。这是预训练模型通过\
  \ API 使用如此流行的原因之一。\n\n现在，虽然预训练模型对大多数用户效果良好，但有时可能不适合您。这是最方便的选项，但也是可定制性最低的。假设您使用 Vision\
  \ API 对植物进行分类，但现在想识别植物的确切亚种。虽然 Vision API 可以提供数千个标签，但它可能没有植物亚种的名称。在这种情况下，您可以考虑下一个选项：AutoML。\n\
  \nVertex AI AutoML 是一种使用您自己的数据构建您自己的模型的方法。有些流行的机器学习问题已被研究数十年并被深入理解。这些问题（例如图像分类和文本翻译）过去被多次使用，所有的细微差别和变体都已被识别。AutoML\
  \ 会选择最佳的 ML 算法，它唯一需要的就是数据。就像“只需加水”的蛋糕粉，AutoML 可以被视为“只需加数据”。然后您需要对数据进行格式化并进行质量控制。\n\
  \n与预训练模型不同，您需要为训练和部署模型预配云资源实例。在训练时，您必须决定要预配多少小时的实例时间；在部署期间，您将决定模型是部署在云端、现场设备（如 Android\
  \ 手机）还是其他物联网设备上。我们将在本章后面查看硬件预配选项。\n\nAutoML 是 图 4.1 中金字塔的第二层，通常是希望使用自己的数据训练模型的用户的去处。AutoML\
  \ 赋予您构建自己模型的能力，同时不需要 ML 专家团队来构建它们。\n\n\n\n假设您发现您的用例独一无二，且没有可用的 AutoML。在这种情况下，您可以在\
  \ Vertex AI 中使用自定义模型。这是 图 4.1 金字塔的顶层，它为您提供了算法选择、硬件配置和数据类型方面的极大灵活性。之所以将其置于金字塔顶端，是因为这种灵活性；但同时，它的基数也最小，因为拥有使用自定义模型专业知识的客户数量很少。我们将在本章后面介绍这种训练方法的硬件配置选项。\n\
  \n#### 预训练模型\n\n当您尝试使用机器学习解决问题时，第一步是查看是否有预训练模型可用。预训练模型是在超大规模数据集上训练的机器学习模型，在基准测试中表现优异。这些模型由庞大的工程和研究团队支持，并会频繁重新训练。\n\
  \n作为客户，您可以通过 Web 控制台（或 CLI、Python、Java 或 Node.js SDK）在几分钟内开始使用这些模型。\n\n任何试图使用机器学习解决问题的开发者，都应首先检查\
  \ Google Cloud 平台上是否有可用的预训练模型，如果有，则应使用它。\n\nGoogle Cloud 提供多种预训练模型：\n\n*   Vision\
  \ AI\n*   Video AI\n*   Natural Language AI\n*   Translation AI\n*   Speech-to-Text\
  \ 和 Text-to-Speech\n\n除了预训练模型，Google Cloud 还提供针对特定问题的解决方案平台，这些平台包含预训练模型，并支持对现有模型进行调优：\n\
  \n*   Document AI\n*   Contact Center AI\n\n##### Vision AI\n\nVision AI 为您提供便捷的\
  \ ML 算法访问权限，用于处理图像和照片，无需构建完整的机器学习基础设施。使用此服务，您可以执行图像分类、检测物体和人脸，以及通过光学字符识别 (OCR) 识别手写文字。\n\
  \n您也可以在浏览器中通过 `https://cloud.google.com/vision` 快速试用该服务。在生产环境中，通常将图像上传到服务或指向图像 URL\
  \ 进行分析。\n\n当您使用浏览器试用服务时，会获得四种类型的预测，如 图 4.2 所示。首先，您会看到照片中检测到的物体。\n\n![图 4.2 使用 Vision\
  \ AI 分析照片](img/c04f002.png)\n\n**图 4.2** 使用 Vision AI 分析照片\n\n其次，您会获得图像的一组标签；在我们的示例中，获得的标签包括\
  \ Table、Furniture、Plant、Houseplant、Cabinetry、Wood 等。第三，您会获得这些图像的主要颜色，可用于基于调色板整理图像。最后，您会获得“安全搜索”分类，即图像是否属于以下类别之一：Adult（成人内容）、Spoof（恶搞）、Medical（医疗）、Violence（暴力）和\
  \ Racy（低俗）。这些分类可用于标记图像，适用于需要限制共享特定类型图像的场景（例如避免向青少年展示成人内容）。\n\n##### Video AI\n\n\
  此 API 拥有预训练的机器学习模型，可识别视频中的物体、地点和动作。它适用于存储的视频，也适用于流式视频（实时返回结果）。\n\n您可以使用此服务识别视频中\
  \ 20,000 多种不同的物体、地点和动作。您可以将结果作为视频中的元数据，用于从视频目录中搜索视频。例如，您可以使用该服务标记体育视频，并具体识别运动类型。您还可以处理直播流；例如，如果您有一个监控交通的街道摄像头，可以统计通过路口的汽车数量。\n\
  \n以下是 Video AI 的几个用例示例：\n\n*   **用例 1：** 此 API 可用于构建视频推荐系统，利用 API 生成的标签和用户的观看历史。这使您能够基于视频内部细节（而不仅仅是外部元数据）进行推荐，从而极大地提升用户体验。\n\
  \n*   **用例 2：** 另一个用例是利用 API 的元数据为视频档案创建索引。这非常适合拥有 PB 级未索引数据的大众媒体公司。\n\n*   **用例\
  \ 3：** 插入视频中的广告有时可能与视频内容完全无关。这是另一个用例，您可以通过比较视频内容的时间段特定标签和广告内容来改善用户体验。\n\n##### Natural\
  \ Language AI\n\nNatural Language AI 使用预训练的机器学习模型从非结构化文本中获取洞察。其提供的主要服务包括实体提取、情感分析、语法分析和通用分类。\n\
  \n实体提取服务可识别人名、组织名、产品名、事件、地点等实体。如果找到相关链接，该服务还会用 Wikipedia 文章链接等额外信息丰富实体。尽管实体提取听起来像个简单问题，但它是一项非同小可的任务。例如，在句子\
  \ “Mr. Wood is a good actor” 中，需要相当的理解能力才能判断 “Mr. Wood” 是一个人名，而不是一种木材。\n\n情感分析为每个句子、每个实体和整段文本提供带幅度的正面、负面或中性评分。语法分析可用于识别词性、词间依存关系、词\
  \ lemma 和文本形态。最后，它还将文档分类到 700 多个预定义类别之一。详情请参阅 `https://cloud.google.com/natural-language`。\n\
  \n以下是 Natural Language AI 的一些用例：\n\n*   **用例 1：** 衡量客户对特定产品的情感。使用实体分析从电子邮件、聊天记录和社交媒体等文档中查找重要详情，并对这些实体进行情感分析，以了解客户对特定产品的看法。\n\
  \n*   **用例 2：** 使用 Healthcare Natural Language API 理解医疗文本特有的详情，如临床记录或医疗研究文档。您可以用它提取药物、剂量和病症等医疗洞察，构建强大的医疗应用。注意：Healthcare\
  \ Natural Language API 独立于 Google 的 Natural Language AI。\n\n##### Translation AI\n\
  \n使用 Translation AI 可检测 100 多种语言（从 Afrikaans 到 Zulu），并翻译列表中任意语言对。它采用 Google 神经机器翻译\
  \ (GNMT) 技术，该技术由 Google 率先开发，现已成为行业标准。详情请参阅 `https://ai.googleblog.com/2016/09/a-neural-network-for-machine.html`。\n\
  \n此服务分 Basic 和 Advanced 两个级别。两者有很多区别，但主要区别在于 Advanced 版本可以使用 *glossary*（源语言到目标语言的术语映射字典），还可以翻译整个文档（PDF、DOC\
  \ 等）。价格也有差异。\n\n您可以翻译 ASCII 或 UTF-8 格式的文本。此外，还可以使用 Media Translation API 实时翻译音频，通常用于流媒体服务。\n\
  \nMedia Translation API（独立于 Translation API）可直接将源语言音频翻译为目标语言音频。这有助于低延迟流式应用并快速扩展。\n\
  \n##### Speech-to-Text\n\n\n\n#### 语音转文本和文本转语音\n\n您可以使用语音转文本服务将录制的音频或流式音频转换为文本。这是一项用于为视频录制和流式视频创建字幕的热门服务。这也通常与翻译服务结合使用，以生成多种语言的字幕。有关更多详细信息，请参阅\
  \ `https://cloud.google.com/speech-to-text#section-10`。\n\n##### 文本转语音\n\n客户使用文本转语音服务提供具有类人语调的逼真语音。这基于\
  \ DeepMind（Google 的 AI 子公司）最先进的语音合成专业知识。它目前支持 40 多种语言和变体中的 220 多种语音。您可以创建一个独特的语音，以在所有接触点代表您的品牌。有关支持的语言列表，请参阅此处：`https://cloud.google.com/text-to-speech/docs/voices`。\n\
  \n#### AutoML\n\nAutoML（自动化机器学习）是自动化模型训练耗时任务的过程。AutoML 适用于流行、易懂且切实可行的机器学习问题，如图像分类、文本分类、翻译等。作为用户，您只需提供数据并配置一些设置，其余的训练过程将实现自动化。您可以利用易于使用的\
  \ Web 控制台，或使用 Python、Java 或 Node.js SDK 来启动 AutoML 训练作业。\n\n针对许多数据类型和用例都提供了 AutoML\
  \ 训练。我们可以将它们大致分为四类：\n\n*   结构化数据\n*   图像/视频\n*   自然语言\n*   推荐 AI/零售 AI\n\n#####\
  \ 面向表格或结构化数据的 AutoML\n\n结构化数据是指符合明确定义的模式且通常呈矩形表格形式的数据。针对表格，有两种训练模型的方法：\n\n*   **BigQuery\
  \ ML：** 这是一种基于 SQL 的模型训练方法。如果您是数据分析师且擅长编写 SQL 查询，可以使用此方法。您可以使用 BigQuery 进行训练和预测，并自动将预测结果添加到表中。这是一种用于机器学习训练和预测的无服务器方法。我们将在第\
  \ 14 章“BigQuery ML”中详细介绍这一点。\n*   **Vertex AI Tables：** 这是训练机器学习模型的第二种方法，可使用 Python、Java\
  \ 或 Node.js，或使用 REST API 触发。Vertex AI Tables 为您提供了在端点上部署模型并通过 REST API 提供预测服务的能力。\n\
  \n我们将在表 4.1 中介绍可用的 AutoML Tables 算法。\n\n**表 4.1** Vertex AI AutoML Tables 算法\n\n\
  | 数据类型 | 机器学习问题 | 指标 |\n| --- | --- | --- |\n| 表格 (IID) | 分类 | AUC ROC, AUC ROC,\
  \ Logloss, Precision at Recall, Recall at Precision |\n| 表格 (IID) | 回归 | RMSE, RMSLE,\
  \ MAE |\n| 时间序列数据 | 预测 | RMSE, RMSLE, MAPE, 分位数损失 |\n\n在配置 AutoML 作业时，从硬件角度来看有几个相关事项。“预算”是\
  \ Web 控制台中的最后一步，您可在其中指定允许作业运行的最长小时数（请参阅图 4.3）。如果训练作业未在预算内完成，AutoML 将使用在预算内训练出的最佳模型。下图中还有一个名为“启用提前停止”的设置，如果识别出模型训练已完成，则会结束训练作业，在这种情况下，您将仅为使用的节点小时数付费。\n\
  \n![图 4.3 Vertex AI AutoML，提供“预算”](img/c04f003.png)\n\n**图 4.3** Vertex AI AutoML，提供“预算”\n\
  \n您为 AutoML 作业提供的预算有最小值。例如，对于目标检测 AutoML，最小值为 20 小时。另一个需要记住的重要方面是，虽然所有 AutoML 作业都要求您为预算提供节点小时数，但并非所有节点小时都相同。不同\
  \ AutoML 作业类型的每个节点小时价格不同，因为不同 AutoML 作业使用的硬件不同。\n\n从模型类型角度来看，预测是一种特殊情况。Vertex AI\
  \ 为预测提供三种模型训练方法：\n\n*   **AutoML：** 这是内置模型，适用于各种预测用例。\n*   **Seq2seq+：** 这种模型接收一个序列并生成另一个序列。当数据集大小小于\
  \ 1 GB 时，此模型非常有效。\n*   **时序融合变换器：** 这是一种深度神经网络模型，也使用了注意力机制。它旨在为广泛的用例生成高准确性和可解释性。\n\
  \n##### 面向图像和视频的 AutoML\n\n直到最近，图像和视频数据上的机器学习问题对机器学习专家来说仍然繁琐且耗时。Vertex AI AutoML\
  \ 使构建此类问题的模型变得极其简单。表 4.2 简明扼要地总结了这些数据类型的所有可用 AutoML 算法。\n\n**表 4.2** AutoML 算法\n\
  \n| 数据类型 | 机器学习问题 | AutoML 详情 |\n| --- | --- | --- |\n| 图像 | 图像分类（单标签） | 从训练期间用户提供的标签列表中预测一个正确标签。\
  \ |\n| 图像 | 多类分类 | 预测您想要分配给图像的所有正确标签。 |\n| 图像 | 目标检测 | 预测您感兴趣的所有目标的位置。 |\n| 图像 |\
  \ 图像分割 | 预测带有标签的图像逐像素区域。 |\n| 视频 | 分类 | 获取整个视频、镜头和帧的标签预测。 |\n| 视频 | 动作识别 | 识别视频中的动作时刻。\
  \ |\n| 视频 | 目标跟踪 | 获取您想要在视频中跟踪的目标的标签、轨迹和时间戳。 |\n\n与硬件相关的 AutoML 另一个考量因素是 AutoML\
  \ Edge 模型。这些模型将部署到边缘设备，因此模型经过训练和配置，以使用更少的内存和低延迟。目前支持的边缘设备包括 iPhone、Android 手机（Google\
  \ Pixel、Samsung Galaxy 等）和 Edge TPU 设备，随着 Google 支持更多设备，此集合将继续增加。\n\n当您选择 AutoML\
  \ Edge 模型时，有可用选项可帮助您在准确性和延迟之间找到合适的权衡。对于 Edge TPU，我们看到图 4.4 中显示的选项。\n\n![图 4.4 在\
  \ Vertex AI 中选择模型大小](img/c04f004.png)\n\n**图 4.4** 在 Vertex AI 中选择模型大小\n\n#####\
  \ 面向文本的 AutoML\n\n现在文本的机器学习模型也已被充分理解，您可以使用 Vertex AI AutoML 文本轻松构建自己的模型。使用 AutoML\
  \ 解决了四个常见问题，包括分类和情感分析。表 4.3 显示了完整列表。\n\n**表 4.3** 使用 AutoML 解决的问题\n\n| 数据类型 | 机器学习问题\
  \ | AutoML 详情 |\n| --- | --- | --- |\n| 文本 | 文本分类 | 预测您想要分配给文档的一个正确标签。 |\n| 文本 |\
  \ 多标签分类 | 预测您想要分配给文档的所有正确标签。 |\n| 文本 | 实体提取 | 识别文本项中的实体。 |\n| 文本到文本 | 翻译 | 将文本从源语言转换为目标语言。\
  \ |\n\n##### 推荐 AI/零售 AI\n\nGCP 拥有面向零售领域的 AutoML 解决方案。零售搜索为零售商提供 Google 质量的搜索，该搜索可进行自定义，并建立在\
  \ Google 对用户意图和上下文的理解之上。\n\n\n\n\n\n#### Vision API 产品搜索\n\nVision API 产品搜索（Vision\
  \ AI 下的一项服务）可以基于您产品目录中的参考图片进行训练，随后可使用图片进行搜索。\n\n#### Recommendations AI\n\n该解决方案的第三部分是\
  \ Recommendations AI，它能够理解客户行为、上下文和 SKU 背后的细微差别，以便通过相关推荐在各渠道提升互动率。\n\n在该解决方案中，客户上传包含每个产品详细信息、照片和其他元数据的产品目录。随后，客户输入“用户事件”，例如客户点击、浏览和购买的内容。Recommendations\
  \ AI 利用这些数据创建模型。客户需为训练模型付费，这些模型会持续微调以纳入“用户事件”数据的更新。\n\n此外，当推荐结果被调用并产生数百万次点击时，客户需为每\
  \ 1,000 次请求付费。这是一种无服务器的资源配置方式，客户无需操心后台的确切硬件配置。\n\nRecommendations AI 提供了易于使用的自动化机器学习训练方法。它提供了多种不同的模型，服务于在线零售业务的多种目的。从考试角度来看，理解表\
  \ 4.4 非常重要，该表描述了不同的推荐类型。\n\n##### 表 4.4：Retail AI 中可用推荐类型汇总\n\n来源：改编自 Google Cloud\
  \ / `https://cloud.google.com/retail/docs/models#model-types`，最后访问日期 2022 年 12 月\
  \ 16 日。\n\n| 推荐类型 | 预测内容？ | 使用场景 | 使用的数据 | 优化目标 |\n| --- | --- | --- | --- | ---\
  \ |\n| 您可能还喜欢 | 用户可能购买的下一个产品 | 产品页面 | 客户行为和产品相关性 | 点击率 |\n| 经常一起购买（购物车扩展） | 在同一购物会话中，针对特定产品经常一起购买的商品\
  \ | 结账页面 | 购物车中的用户行为 | 单笔订单收入 |\n| 为您推荐 | 用户可能购买的下一个产品 | 主页 | 用户浏览历史和上下文 | 点击率 |\n\
  | 相似商品 | 具有相似属性的其他产品 | 产品页面 | 产品目录 | 点击率 |\n\n#### Document AI\n\n当您想要从文档中提取详细信息时，例如旧印刷文档、书籍或表格的数字化扫描图片，可以使用\
  \ Document AI。这些页面可能包含段落格式的文本，也可能包含表格和图片。其中部分文本可能是印刷体，有时也可能是手写体。这也是政府办公室（如车管所 DMV）常见的文档类型，人们需要在表格上填写信息。\n\
  \n表格包含印刷文本和供人们填写详细信息的空白栏。这些内容可能用不同类型的墨水书写（蓝笔或黑笔等），且人们书写时有时会出错。因此，ML 模型需要理解文档的结构（在哪里期望出现“姓名”和“地址”），并对手写文本具有一定的容错能力。\n\
  \n另一个例子是政府文件，如护照、驾驶执照和纳税申报单。这些文档结构较好，但仍存在一些差异。\n\n如果我们能从表格中提取重要详细信息（如“名”、“姓”、“地址”等），就得到了结构化数据，这些数据现在可以存储在数据库中并进行分析。这就是提取阶段。\n\
  \nDocument AI 是一个理解文档并帮助您执行以下操作的平台：\n\n*   检测文档质量。\n*   矫正倾斜。\n*   提取文本和布局信息。\n\
  *   识别并提取键值对。\n*   提取并规范化实体。\n*   拆分和分类文档。\n*   审核文档（人工介入）。\n*   存储、搜索和整理文档（Document\
  \ AI Warehouse）。\n\nDocument AI 有两个重要概念：`processors` 和 `Document AI Warehouse`。\n\
  \nDocument AI 处理器是文档与机器学习模型之间的接口，用于执行相关操作。有通用处理器、专用处理器（采购、身份、贷款和合同文档）和自定义处理器。您可以通过提供训练数据集（标记过的文档集）来训练自定义处理器以满足您的自定义需求。有关处理器类型的完整列表，请访问\
  \ `https://cloud.google.com/document-ai/docs/processors-list`。\n\nDocument AI Warehouse\
  \ 是一个用于存储、搜索、整理、治理和分析文档及其结构化元数据的平台。\n\n#### Dialogflow 和 Contact Center AI\n\nDialogflow\
  \ 是 Google Cloud 提供的对话式 AI 产品，提供聊天机器人和语音机器人。它集成到电话服务和其他服务中，为您提供 Contact Center AI\
  \ (CCAI) 解决方案。让我们看看该解决方案提供的服务。\n\n##### 虚拟代理\n\n您可以快速开发面向企业的高级虚拟代理，它们能够处理话题切换和补充问题，并提供\
  \ 7x24 小时多渠道支持。其设计应确保虚拟代理能够处理大多数情况。复杂的通话将转接给人工代理。\n\n##### 代理辅助\n\n当人工代理处理通话时，代理辅助可以通过识别意图、提供来自集中式知识库的即时回复和答案，以及实时转录通话来提供支持。\n\
  \n##### 洞察\n\n该服务使用自然语言处理来分析通话驱动因素并衡量情绪，帮助管理层了解呼叫中心运营情况，从而改善结果。\n\n##### CCAI\n\n\
  Contact Center AI 平台是一个完整的云原生平台，支持客户与代理之间的多渠道通信。\n\n尽管 Dialogflow 和 CCAI 使用了先进的机器学习技术（尤其是在自然语言方面），但这些技术大多对机器学习工程师是隐藏的。深入了解\
  \ CCAI 超出了本次考试的范围。\n\n#### 自定义训练\n\n当您选择自定义训练时，您可以完全灵活地选择各种硬件选项来训练模型。\n\n图形处理单元\
  \ (GPU) 可以加速深度学习模型的训练过程。用于自然语言、图像和视频的模型需要计算密集型操作（如矩阵乘法），这些操作可通过在 GPU 等大规模并行架构上运行而受益。\n\
  \n如果在单个 CPU 上训练深度学习模型，可能需要数天、数周甚至数月才能完成。但是，如果您能将繁重的计算卸载到 GPU，可以将时间缩短一个数量级。以前需要数天的任务可能只需几小时即可完成。\n\
  \n为了了解专用硬件的优势，让我们先看看 CPU 的工作原理。\n\n##### CPU 的工作原理\n\nCPU 是一种可以运行通用工作负载的处理器，包括软件应用、数据应用等。CPU\
  \ 设计得非常灵活，支持大量操作。\n\nCPU 从内存加载数据，对值执行某些操作，然后将结果存回内存，每个操作都如此。这种架构非常适合通用软件应用。然而，CPU\
  \ 串行执行计算，当需要进行数万亿次计算时（这在使用大型数据集训练 ML 模型时非常典型），这种方式效率极低。\n\n##### GPU\n\nGPU 提供了额外的强大算力。图形处理单元\
  \ (GPU) 是一种专用芯片，旨在快速处理内存中的数据以创建图像；它最初用于处理电影和渲染视频游戏中的图像。GPU 不单独工作，它是一个协助 CPU 完成某些任务的协处理器。\n\
  \n\n\n\n#### GPU 和 TPU 硬件加速\n\nGPU 在单个处理器中包含数千个算术逻辑单元（ALU）。因此，GPU 不会为每次操作都访问内存，而是加载一块内存，并利用数千个\
  \ ALU 并行应用某些操作，从而使其更快。将 GPU 用于大型矩阵乘法和微分运算，可将速度提高一个数量级。\n\n要使用 GPU，必须使用 A2 或 N1 机器系列。目前\
  \ GPU 提供以下类型：\n\n*   `NVIDIA_TESLA_T4`\n*   `NVIDIA_TESLA_K80`\n*   `NVIDIA_TESLA_P4`\n\
  *   `NVIDIA_TESLA_P100`\n*   `NVIDIA_TESLA_V100`\n*   `NVIDIA_TESLA_A100`\n\n在 `WorkerPoolSpec`\
  \ 中，在 `machineSpec.acceleratorType` 字段中指定要使用的 GPU 类型，在 `machineSpec.acceleratorCount`\
  \ 字段中指定工作池中每个 VM 要使用的 GPU 数量。\n\n尝试使用实例类型配置 GPU 时，基于实例类型、实例内存等存在若干限制。部分限制如下：\n\n\
  *   所选 GPU 类型必须在执行自定义训练的位置可用。并非所有类型的 GPU 在所有区域都可用。\n    列出可用位置的页面：`cloud.google.com/vertex-ai/docs/general/locations`。\n\
  *   存在每个实例的 GPU 数量限制。例如，可在 VM 上使用两个或四个 `NVIDIA_TESLA_T4` GPU，但不能使用三个。Google 提供了完整的参考表，随着更多实例类型和\
  \ GPU 的推出，该表可能会发生变化；请参阅下方提示中的链接。\n*   GPU 配置必须具有与之匹配的机器类型相比足够的虚拟 CPU 和内存。例如，如果在工作池中使用\
  \ `n1-standard-16` 机器类型，则每个 VM 拥有 16 个虚拟 CPU 和 60 GB 内存。由于每个 `NVIDIA_TESLA_V100`\
  \ GPU 最多可提供 12 个虚拟 CPU 和 76 GB 内存，因此每个 `n1-standard-16` VM 必须至少使用 2 个 GPU 以满足其要求。（一个\
  \ GPU 资源不足，且无法指定 3 个 GPU。）\n\n##### TPU\n\n随着 ML 工程师使用 GPU 训练超大型神经网络，他们开始注意到下一个瓶颈。GPU\
  \ 仍是一种半通用处理器，必须支持包括视频处理软件在内的许多不同应用。因此，GPU 与 CPU 存在相同的问题。对于数千个 ALU 中的每次计算，GPU 都必须访问寄存器或共享内存以读取操作数并存储中间计算结果。为将性能提升到新水平，Google\
  \ 设计了 TPU。\n\n张量处理单元（TPU）是 Google 专门为机器学习工作负载设计的专用硬件加速器。请参阅图 4.5 了解 TPU-v4 的系统架构。\n\
  \n![图 4.5 TPU 系统架构](img/c04f005.png)\n\n**图 4.5 TPU 系统架构**\n\nCPU 中的 ALU 一次执行一项操作，而每个\
  \ TPU 拥有多个矩阵乘法单元（MXU）。\n\n每个 MXU 拥有 128 × 128 个乘累加器。每个 MXU 每个周期可使用 `bfloat16` 数字格式执行\
  \ 16,000 次乘累加运算。\n\nTPU 的主要任务是矩阵处理，这是乘法和累加运算的组合。TPU 包含数千个直接相连的乘累加器，形成一个大型物理矩阵。\n\
  \nTPU 可对巨大矩阵执行海量运算，而这正是神经网络训练循环的核心。\n\n###### 如何使用 TPU\n\nTPU 可组成称为 Pod 的群组，只需极少或无需代码更改即可扩展工作负载。\n\
  \nCloud TPU 提供以下 TPU 配置：\n\n*   单个 TPU 设备\n*   TPU Pod（由高速互连连接的一组 TPU 设备）\n*   TPU\
  \ 切片（TPU Pod 的一个细分）\n*   TPU VM\n\n###### TPU 的优势\n\nTPU 将计算速度提升到超越 GPU 的水平。在 CPU\
  \ 上需数月训练的模型，在 GPU 上可能仅需数天，而在 TPU 上可能只需数小时。简单来说，TPU 相较于 GPU 可提供一个数量级的性能提升。\n\n######\
  \ 何时使用 CPU、GPU 和 TPU\n\nTPU 适合特定工作负载，但在某些情况下，使用 GPU 甚至 CPU 可能更好。以下是为您的用例选择合适硬件的指南：\n\
  \n*   **CPU**\n    *   需要灵活性的快速原型设计\n    *   训练速度快的模型\n    *   适用小批量的小型模型\n    *\
  \   使用 C++ 编写的自定义 TensorFlow 操作\n    *   受限于主机的可用 I/O 或网络带宽\n\n*   **GPU**\n   \
  \ *   源代码不存在或更改过于繁琐的模型\n    *   包含大量自定义 TensorFlow 操作、因此至少需部分在 CPU 上运行的模型\n    *\
  \   包含 TPU 上不可用的 TensorFlow ops 的模型\n    *   中大型模型搭配中等批量\n\n*   **TPU**\n    * \
  \  以矩阵计算为主的模型\n    *   无自定义 TensorFlow 操作的模型\n    *   训练时间长达数周或数月的模型\n    *   具有超大有效批量的大型和超大型模型\n\
  \nCloud TPU **不**适合以下工作负载：\n\n*   需要频繁分支（if/else 或条件判断）或以元素级代数为主的程序。TPU 非为执行条件判断而设计，而是为大规模矩阵乘法而设计。\n\
  *   稀疏数据（包含大量零值、仅极少非零值的数据），会导致稀疏内存访问，不适用。\n*   高精度场景不适合 TPU。勿期望双精度运算。\n*   包含使用\
  \ C++ 编写的自定义 TensorFlow 操作的深度神经网络，特别是主要训练循环中的自定义操作不适合 TPU 的情况。\n\n要有效发挥 TPU 优势，应在\
  \ TPU 上运行训练循环的多次迭代。这非理论要求，而是为消除否则将导致的显著低效而提出的实际要求。您可在 `https://cloud.google.com/tpu/docs/tpus`\
  \ 文档中找到这些指南及更多 TPU 信息。\n\n####### Cloud TPU 编程模型\n\n使用 TPU 时的主要瓶颈是 Cloud TPU 与主机内存之间的数据传输。该数据传输通过\
  \ PCIe 总线进行，其速度远慢于 TPU 互连和片上高带宽内存（HBM）。若使用模型的部分编译（部分在 TPU 上执行，其余在主机上执行），TPU 将处于空闲等待数据状态。正确的编程模型是在\
  \ TPU 上执行训练循环的大部分，理想情况下是全部。\n\n#### 预测阶段的资源预配\n\n上一节探讨了训练阶段的硬件预配方面。本节将探讨预测阶段。\n\n\
  预测工作负载与训练工作负载截然不同。训练期间，我们将预配置在特定时长内使用、完成后释放的资源。\n\n预测可通过两种方式进行：在线和批量。在线预测是指模型部署在服务器上，可通过\
  \ REST 等便捷接口查询。此处预期响应时间接近实时。批量预测是指大量输入数据已就绪并存储，预测作为“批量作业”启动。此处用户预期作业在合理时间内完成（非实时），但重点关注预测成本。\n\
  \n\n\n与训练工作负载相比，预测（尤其是在线预测）是一种持续性工作负载，也需要根据需求持续地扩容或缩容。批量预测工作负载与这两者也有显著差异。\n\n在此背景下，为预测配置资源时最重要的两个考量因素是扩缩容行为和寻找理想的机器类型。让我们详细了解这两个考量因素。\n\
  \n##### 扩缩容行为\n\n如果您使用自动扩缩容配置，`Vertex AI` 会在现有节点的 `CPU` 使用率变高时自动扩容以使用更多预测节点。如果您使用的是\
  \ `GPU` 节点，请务必配置适当的触发器，因为有三种资源（`CPU`、内存和 `GPU`）需要监控其使用情况。\n\n##### 寻找理想的机器类型\n\n\
  要从成本角度确定自定义预测容器的理想机器类型，请将该容器作为 `docker` 容器直接部署到 `Compute Engine` 实例，然后通过调用预测接口对实例进行基准测试，直到实例达到\
  \ 90% 以上的 `CPU` 利用率。确定不同机器类型的*每秒查询数成本（QPS cost per hour）*。例如，如果自定义容器包含一个只能有效利用 1\
  \ 个核心的 `Python` Web 服务器进程，而该进程调用的是多线程 `ML` 模型（如大多数 `XGBoost` 实现），随着 `QPS` 增加，Web\
  \ 服务器将开始“阻塞” `XGBoost`，因为每次 `XGBoost` 预测都将等待 Web 服务器进程。如果部署到 2 核或 4 核机器规格上，容器将触及\
  \ `QPS` 限制且 `CPU` 利用率会很高，因此该容器部署到 `Vertex AI` 后将能有效地自动扩缩容。\n\n请注意自定义容器中单线程 Web 服务器的局限性；即使部署在\
  \ 32 核机器规格上，它也可能无法扩容。\n\n因此，您需要综合考虑模型类型、自定义模型情况下的服务封装代码、资源（`CPU`、内存、 `GPU`）的有效利用率、延迟和吞吐量要求以及价格，以确定要使用的实例类型。\n\
  \n您可以选择使用 `GPU` 来加速预测，但存在一些限制。限制如下：\n\n*   `GPU` 只能用于 `TensorFlow SavedModel`，或用于经过设计可利用\
  \ `GPU` 的自定义容器。您不能将 `GPU` 用于 `scikit-learn` 或 `XGBoost` 模型。\n*   `GPU` 在某些地区不可用。\n\
  *   每个 `DeployedModel` 资源或 `BatchPredictionJob` 只能使用一种类型的 `GPU`，并且根据您使用的机器类型，可添加的\
  \ `GPU` 数量存在限制。\n\n以上考量因素针对的是云端预测。在许多用例中，训练好的模型需要部署在边缘设备上。让我们在下文探讨这些用例。\n\n#####\
  \ Edge TPU\n\n物联网（`IoT`）的重要组成部分是边缘设备。这些设备收集实时数据、做出决策、采取行动，并与其他设备或云端通信。由于此类设备带宽有限，有时可能完全离线运行，因此在设备本身上运行推理（称为*边缘推理*）的需求日益增长。\n\
  \n`Google` 设计的 `Edge TPU` 协处理器可加速这些边缘设备上的 `ML` 推理。单个 `Edge TPU` 仅消耗 2 瓦功率，即可执行每秒\
  \ 4 万亿次运算（4 `TOPS`）。\n\n`Edge TPU` 为您的原型和生产设备提供多种外形规格，包括单板计算机、系统级模块、 `Edge TPU`\
  \ 本身及所有可用产品。这些产品以 `Coral.ai` 品牌销售。\n\n##### 部署到 Android 或 iOS 设备\n\n`ML Kit`（`https://developers.google.com/ml-kit`）将\
  \ `Google` 的机器学习专业知识以功能强大且易于使用的软件包形式带给移动开发者。您可以利用针对设备端运行进行优化的解决方案，使您的 `iOS` 和 `Android`\
  \ 应用更具吸引力、个性化和实用性。\n\n您可以在 `Google Cloud` 上训练 `ML` 模型，使用 `AutoML` 或自定义模型，并将模型部署到您的\
  \ `Android` 或 `iOS` 应用中。预测在设备端进行，以实现低响应时间、节省带宽，并支持离线模式下的预测。\n\n#### 总结\n\n在本章中，您了解了\
  \ `Google Cloud` 上可用的不同预训练模型。您还了解了 `AutoML` 模型及其在不同场景下的适用性。在本章的主要部分，您了解了可用于训练模型的不同硬件选项，以及训练工作负载和预测工作负载的区别。`Google\
  \ Cloud` 以 `GPU` 和 `TPU` 的形式为您提供了各种硬件加速器。最后，超越云端，您了解了部署到边缘设备的理念。\n\n#### 考试要点\n\n\
  *   **选择正确的 ML 方法。** 了解需求，以在预训练模型、`AutoML` 或自定义模型之间进行选择。了解解决方案的就绪程度、灵活性和方法。\n* \
  \  **为训练配置正确的硬件。** 了解可用于机器学习的各种硬件选项。同时了解 `GPU` 和 `TPU` 硬件的要求以及支持专用硬件的实例类型。还要了解训练和部署中的硬件差异。\n\
  *   **为预测配置正确的硬件。** 了解训练时配置和预测时配置的区别。预测的要求通常是可扩展性以及 `CPU` 和内存限制，因此云端使用 `CPU` 和 `GPU`。然而，边缘设备使用\
  \ `TPU`。\n*   **了解可用的 ML 解决方案。** 通过使用针对特定领域问题构建的预训练模型和解决方案，采用无服务器方法，而非配置硬件。\n\n\
  #### 复习题\n\n1.  您的公司从事房地产业务，作为软件开发团队的一员，您被要求添加一个机器学习模型来识别上传到网站的照片中的物体。您该如何着手？\n\n\
  \    1.  使用自定义模型以获得最佳结果。\n    2.  使用 `AutoML` 创建目标检测模型。\n    3.  从 `Vision AI` 开始，如果不起作用，则使用\
  \ `AutoML`。\n    4.  结合 `AutoML` 和自定义模型以获得更好的结果。\n\n2.  您的公司正在处理法律文档（数千页），需要将其翻译成西班牙语和法语。您注意到\
  \ `Google` 的 `Translation AI` 中的预训练模型效果不错，但有几百个领域特定术语的翻译不符合预期。您没有任何标注数据，公司里只有几位专业翻译。您该怎么做？\n\
  \n    1.  使用 `Google` 翻译服务，然后安排人工介入（`HITL`）逐条修正翻译。\n    2.  使用 `Google AutoML Translation`\
  \ 为您的场景创建新的翻译模型。\n    3.  使用 `Google Translation AI` 并搭配您需要的术语“词汇表”。\n    4.  因为您似乎没有数据，所以无法翻译。\n\
  \n3.  您正在处理一千小时的西班牙语视频录制，需要创建英语和法语字幕。您已经拥有一个包含数百小时已手动创建字幕的视频的小型数据集。您的首选方法是什么？\n\n\
  \    1.  没有“翻译字幕”服务，所以使用 `AutoML` 利用现有数据集创建“字幕”作业，然后使用该模型创建翻译字幕。\n    2.  没有“翻译字幕”服务，也没有针对该任务的\
  \ `AutoML`，所以您必须使用数据创建自定义模型并在 `GPU` 上运行。\n    3.  没有“翻译字幕”服务，也没有针对该任务的 `AutoML`，所以您必须使用数据创建自定义模型并在\
  \ `TPU` 上运行。\n\n\n\n\n#### 4. 使用预训练的语音转文本（STT）服务，然后使用预训练的 Google Translate 服务翻译文本并插入字幕。\n\
  \n#### 4. 你想构建一个移动应用来对不同种类的昆虫进行分类。你有足够的标记数据来训练，但想快速上线。你会如何设计？\n\n1.  使用 AutoML 训练分类模型，选择\
  \ AutoML Edge 作为方法。使用 ML Kit 创建 Android 应用并将模型部署到边缘设备。\n2.  使用 AutoML 训练分类模型，选择\
  \ AutoML Edge 作为方法。使用带有边缘 TPU 的 Coral.ai 设备并在该设备上部署模型。\n3.  使用 AutoML 训练目标检测模型，选择\
  \ AutoML Edge 作为方法。使用带有边缘 TPU 的 Coral.ai 设备并在该设备上部署模型。\n4.  使用 AutoML 训练图像分割模型，选择\
  \ AutoML Edge 作为方法。使用 ML Kit 创建 Android 应用并将模型部署到边缘设备。\n\n#### 5. 你正在为目标检测训练深度学习模型。收敛时间太长，所以你正在尝试加快训练速度。当你尝试启动一个带有\
  \ Deep Learning VM Image 的实例（带 GPU）时，收到错误提示“未找到 NVIDIA_TESLA_V100”。可能的问题是什么？\n\n\
  1.  所选区域中没有可用的 GPU。\n2.  GPU 配额不足。\n3.  抢占式 GPU 配额不足。\n4.  GPU 内存不足。\n\n#### 6.\
  \ 你的团队正在本地仅使用 CPU 的机器上为图像分割问题构建卷积神经网络。训练时间很长，所以你想通过迁移到云端来加速该过程。你在 Google Cloud 上试验\
  \ VM 以使用更好的硬件。你没有用于手动放置的代码，也没有使用任何自定义转换。你应该使用什么硬件？\n\n1.  带有 1 个 GPU 的 n1-standard-2\
  \ 机器深度学习 VM\n2.  更强大的 e2-highCPU-16 机器深度学习 VM\n3.  带有 8 个 GPU 的 VM\n4.  带有 1 个 TPU\
  \ 的 VM\n\n#### 7. 你在一家硬件零售店工作，拥有一个每天有数千用户访问的网站。你想在主页上为用户显示推荐，使用 Recommendations\
  \ AI。你会选择哪个模型？\n\n1.  “Others you may like”（其他人可能也喜欢）\n2.  “Frequently bought together”（经常一起购买）\n\
