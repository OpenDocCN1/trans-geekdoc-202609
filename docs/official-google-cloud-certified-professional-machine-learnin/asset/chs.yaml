  \ 中。\n\n3.  您是一名数据工程师，正在为基于登录用户信息的电子商务网站产品推荐系统构建 ML 模型。您将使用 `Pub/Sub` 处理传入请求。您想存储结果以进行分析和可视化。应该如何配置流水线？\n\
  \n    `Pub/Sub` -> `预处理(1)` -> `ML 训练/服务(2)` -> `存储(3)` -> Data studio/Looker studio\
  \ 进行可视化\n\n    1.  `1 = Dataflow`，`2 = Vertex AI 平台`，`3 = Cloud BigQuery`\n    2.\
  \  `1 = Dataproc`，`2 = AutoML`，`3 = Cloud Memorystore`\n    3.  `1 = BigQuery`，`2\
  \ = AutoML`，`3 = Cloud Functions`\n    4.  `1 = BigQuery`，`2 = Vertex AI 平台`，`3\
  \ = Google Cloud Storage`\n\n4.  您正在开发模型对客户支持邮件进行分类。您使用小数据集在本地系统上通过 `TensorFlow\
  \ Estimator` 创建了模型，但现在需要使用大数据集训练模型以确保高性能。您将模型移植到 Google Cloud，并希望最大限度地减少代码重构和基础设施开销，以便更轻松地从本地迁移到云端。应该怎么做？\n\
  \n    1.  使用 Vertex AI 平台进行分布式训练。\n    2.  在 `Dataproc` 上创建集群进行训练。\n    3.  创建具有自动扩缩功能的托管实例组。\n\
