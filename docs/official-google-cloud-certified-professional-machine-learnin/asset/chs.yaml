  \ 和 `Cloud Composer` 自动化流水线。\n\n#### 复习题\n\n1.  您是一家在线旅行社的数据科学家。您被要求预测用户接下来应看到的最相关网页横幅，要求近实时完成。模型延迟要求为\
  \ 300ms@p99，库存包含数千个网页横幅。您希望在 Google Cloud 上实现最简单的解决方案。应如何配置预测流水线？\n\n    1.  在网站上嵌入客户端，并通过创建指向数据仓库的批量预测作业将预测结果缓存在数据存储中。在\
  \ `App Engine` 上部署网关，然后使用 `Vertex AI Prediction` 部署模型。\n    2.  使用 `TF Serving`\
  \ 部署模型。\n    3.  使用 `Google Kubernetes Engine` 部署模型。\n    4.  在网站上嵌入客户端，在 `App Engine`\
  \ 上部署网关，在 `Cloud Bigtable` 上部署数据库以写入和读取用户的导航上下文，然后在 `Vertex AI` 上部署模型。\n\n2.  您是一名数据科学家，正在使用\
