  \    shape: (-1, 2)\n    name: dnn/head/predictions/textclassifier\n    SignatureDefs\
  \ for output.\n    output ['text'] tensor_info:\n    dtype: String\n    shape: (-1,\
  \ 2)\n    name: tfserving/predict\n    ```\n\n    编写预测请求的正确方式是什么？\n\n    1.  `json.dumps({'signature_name':\
  \ 'serving_default', 'instances': ['fab', 'be1', 'cd']})`\n    2.  `json.dumps({'signature_name':\
  \ 'serving_default', 'instances': [['a', 'b', 'c', 'd', 'e', 'f']]})`\n    3.  `json.dumps({'signature_name':\
  \ 'serving_default', 'instances': [['a', 'b', 'c'], ['d', 'e', 'f']]})`\n    4.\
  \  `json.dumps({'signature_name': 'serving_default', 'instances': [['a', 'b'], ['c',\
  \ 'd'], ['e', 'f']]})`\n\n5.  您是一名 ML 工程师，在一个需要计算成本高昂的预处理操作的数据集上训练了模型。您需要在预测时执行相同的预处理。您已在\
  \ `Vertex AI` 平台上部署模型以进行高吞吐量在线预测。您应该使用哪种架构？\n\n    1.  将传入的预测请求发送到 `Pub/Sub` 主题。设置一个由发布到\
  \ `Pub/Sub` 主题的消息触发的 `Cloud Function`。在 `Cloud Function` 中实现预处理逻辑。使用转换后的数据向 `Vertex\
  \ AI` 平台提交预测请求。将预测结果写入出站 `Pub/Sub` 队列。\n    2.  将传入的预测请求数据流式传输到 `Cloud Spanner`。创建一个视图来抽象预处理逻辑。每秒查询一次视图以获取新记录。使用转换后的数据向\
  \ `Vertex AI` 平台提交预测请求。将预测结果写入出站 `Pub/Sub` 队列。\n    3.  将传入的预测请求发送到 `Pub/Sub` 主题。使用\
  \ `Dataflow` 作业转换传入数据。使用转换后的数据向 `Vertex AI` 平台提交预测请求。将预测结果写入出站 `Pub/Sub` 队列。\n \
  \   4.  验证在预处理数据上训练的模型的准确性。创建一个使用原始数据且可实时使用的新模型。将新模型部署到 `Vertex AI` 平台以进行在线预测。\n\
  \n6.  作为公司的首席数据科学家，您负责构建 ML 模型以数字化扫描的客户表单。您开发了一个 `TensorFlow` 模型，可将扫描图像转换为文本并存储在\
  \ `Cloud Storage` 中。您需要在每天结束时对聚合数据使用 ML 模型，且尽量减少人工干预。您应该怎么做？\n\n    1.  使用 `Vertex\
  \ AI` 平台的批量预测功能。\n    2.  在 `Compute Engine` 中创建用于预测的服务流水线。\n    3.  每次摄入新数据点时使用\
  \ `Cloud Functions` 进行预测。\n    4.  在 `Vertex AI` 平台上部署模型并创建一个版本用于在线推理。\n\n7.  作为公司的首席数据科学家，您需要创建一个计划，以便在每天结束时使用\
  \ `Jupyter Notebook` 运行批量作业，且尽量减少人工干预。您应该怎么做？\n\n    1.  使用 `Vertex AI 托管笔记本` 中的调度功能。\n\
  \    2.  在 `Compute Engine` 中创建用于预测的服务流水线。\n    3.  每次摄入新数据点时使用 `Cloud Functions`\
  \ 进行预测。\n    4.  使用 `Cloud Workflow` 通过 `Cloud Function` 调度批量预测 `Vertex AI` 作业。\n\
  \n8.  您是一家在线旅行社的数据科学家。管理层要求您预测用户接下来应看到的最相关新闻文章，要求近实时完成。库存位于数据仓库中，包含数千篇新闻文章。您希望在\
  \ Google Cloud 上实现最简单的解决方案，并在服务模型时延迟最低。应如何配置预测流水线？\n\n    1.  在网站上嵌入客户端，在 `App Engine`\
  \ 上部署网关，然后使用 `Vertex AI Prediction` 部署模型。\n    2.  使用 `TF Serving` 部署模型。\n    3.\
  \  使用 `Google Kubernetes Engine` 部署模型。\n    4.  在网站上嵌入客户端，在 `App Engine` 上部署网关，在\
  \ `Cloud Bigtable` 上部署数据库以写入和读取用户的导航上下文，然后在 `Vertex AI` 上部署模型。\n\n### 第 11 章：设计\
  \ ML 训练流水线\n\n\n\n\n#### 通过机器学习交付业务价值\n\n通过机器学习（ML）交付业务价值，不仅仅是针对手头的用例构建最佳的 ML 模型。交付这种价值还关乎构建一个集成的\
  \ ML 系统，使其持续运行以适应业务环境动态的变化。这样的 ML 系统涉及收集、处理和管理 ML 数据集与特征；大规模训练和评估模型；为预测提供模型服务；监控生产环境中的模型性能；以及跟踪模型元数据和工件。\n\
  \nML 系统的挑战在于，ML 代码只是整个 ML 组件的一小部分。您需要管理模型、数据和 ML 代码之间的关系，如图 11.1 所示。\n\n![FIGURE\
  \ 11.1 Relation between model data and ML code for MLOps](img/c11f001.png)\n\n**图\
  \ 11.1** MLOps 中模型数据与 ML 代码的关系\n\n机器学习运维（MLOps）支持 ML 的开发和部署，正如 DevOps 和 DataOps\
  \ 分别支持应用工程和数据工程。区别在于：当您部署 Web 服务时，您关心的是弹性、每秒查询数和负载均衡。而当您部署 ML 模型时，还需要担心数据的变化、模型的变化和用户行为的变化。\n\
  \nMLOps 过程是一个迭代过程，它需要输入，并产生进入下一步骤的输出，如图 11.2 所示。您可以在 `https://services.google.com/fh/files/misc/practitioners_guide_to_mlops_whitepaper.pdf`\
  \ 了解更多信息。\n\nML 流水线让您能够检测、编排和自动化图 11.2 所示的复杂 ML 步骤，从 ML 开发到预测服务。\n\nML 流水线的关键功能包括：按需、按计划或响应指定事件触发流水线。流水线还与\
  \ ML 元数据跟踪功能集成，以捕获流水线执行参数并生成工件。\n\n![FIGURE 11.2 End‐to‐end ML development workflow](img/c11f002.png)\n\
  \n**图 11.2** 端到端 ML 开发工作流\n\n在本章中，我们将介绍用于管理 ML 流水线的编排框架和工具，如 `Vertex AI Pipeline`、`Kubeflow\
  \ Pipelines` 和 `Cloud Composer`。\n\n然后我们将介绍如何在这些流水线中调度工作流。我们将深入探讨 `Kubeflow` 和 `TFX`（`TensorFlow\
  \ Extended`）的系统设计，以搭建 ML 流水线。\n\n最后，我们将介绍一些用于搭建 ML 工作流的混合云和多云策略。\n\n#### 编排框架\n\n\
  您需要一个编排器来管理 ML 流水线中的各个步骤，例如清洗数据、转换数据和训练模型。编排器按顺序运行流水线，并根据定义的条件自动从一个步骤移动到下一个步骤。例如，一个定义的条件可能是在模型评估步骤之后执行模型服务步骤，前提是评估指标达到预定义的阈值。编排\
  \ ML 流水线在开发和生产阶段均很有用：\n\n*   在开发阶段，编排帮助数据科学家运行 ML 实验，而无需手动执行每个步骤。\n*   在生产阶段，编排帮助根据计划或特定触发条件自动执行\
  \ ML 流水线。\n\n在以下部分中，我们将介绍 `Kubeflow Pipelines`、`Vertex AI Pipelines`、`Apache Airflow`\
  \ 和 `Cloud Composer`，作为您可以使用的不同 ML 流水线编排器。\n\n##### Kubeflow Pipelines\n\n在了解 `Kubeflow\
  \ Pipelines` 如何工作之前，您应该先了解什么是 `Kubeflow`。`Kubeflow` 是面向 Kubernetes 的 ML 工具包。（您可以在\
  \ `www.kubeflow.org/docs/started/architecture` 了解更多相关信息。）`Kubeflow` 基于 Kubernetes\
  \ 构建，作为一个用于部署、扩展和管理复杂系统的系统。使用 `Kubeflow`，您可以为工作流指定所需的任何 ML 框架，如 `TensorFlow`、`PyTorch`\
  \ 或 `MXNet`。然后，您可以将工作流部署到各种云端或本地和本地部署平台，用于实验和生产用途。图 11.3 展示了如何使用 `Kubeflow` 作为平台，在\
  \ Kubernetes 之上安排 ML 系统的组件。\n\n![FIGURE 11.3 Kubeflow architecture](img/c11f003.png)\n\
  \n**图 11.3** Kubeflow 架构\n\n当您开发和部署 ML 系统时，ML 工作流通常包含多个阶段。开发 ML 系统是一个迭代过程。您需要评估\
  \ ML 工作流各阶段的输出，并在必要时对模型和参数应用更改，以确保模型持续产生您所需的结果。\n\n`Kubeflow Pipelines` 是一个基于 Docker\
  \ 容器的平台，用于构建、部署和管理多步骤 ML 工作流。\n\n流水线是以图的形式描述的 ML 工作流，包含工作流中的所有组件以及组件之间的关系。流水线配置包括运行流水线所需的输入（参数）定义，以及每个组件的输入和输出。\n\
  \n当您运行流水线时，系统会启动一个或多个与工作流（流水线）中的步骤（组件）对应的 Kubernetes Pod。Pod 启动 Docker 容器，容器随即启动您的程序，如图\
  \ 11.4 所示。\n\n![FIGURE 11.4 Kubeflow components and pods](img/c11f004.png)\n\n**图\
  \ 11.4** Kubeflow 组件和 Pod\n\n`Kubeflow Pipelines` 平台包含以下内容：\n\n*   用于管理和跟踪实验、作业和运行的用户界面（UI）\n\
  *   用于调度多步骤 ML 工作流的引擎\n*   用于定义和操作流水线及组件的 SDK\n*   用于使用 SDK 与系统交互的笔记本\n*   编排、实验和复用\n\
  \n您可以在 Google Cloud 的 `GKE` 上安装 `Kubeflow Pipelines`，或使用托管的 `Vertex AI Pipelines`\
  \ 在 Google Cloud 上运行 `Kubeflow Pipelines`。\n\n###### Vertex AI Pipelines\n\n您可以使用\
  \ `Vertex AI Pipelines` 运行 `Kubeflow Pipelines` 或 `TensorFlow Extended` 流水线，而无需搭建任何服务器来设置\
  \ `Kubeflow` 基础设施或 `TFX` 基础设施。`Vertex AI Pipelines` 会自动为您预配和管理底层基础设施。您可以携带现有的 `Kubeflow`\
  \ 或 `TFX` 流水线代码，在 `Vertex AI Pipelines` 上以无服务器方式运行。\n\n`Vertex AI Pipelines` 还提供数据血缘。*血缘*\
  \ 在机器学习中是指跟踪数据随时间从源系统流向转换过程，再到被模型消费的过程。这包括数据一路经历的所有转换，从源系统开始、数据如何被转换、发生了什么变化以及为什么变化。每次流水线运行都会生成*元数据*和\
  \ ML *工件*，例如模型或数据集。*工件血缘* 描述了导致工件产生的所有因素，例如用于模型训练的训练数据或超参数。通过使用工件血缘，您可以理解多次流水线运行中性能或准确率的差异：\n\
  \n*   流水线让您能够自动化、监控 ML 工作流中相互依赖的部分并进行实验。\n*   ML 流水线具有可移植性、可扩展性，且基于容器。\n*   您的流水线工作流的每个单独部分（例如创建数据集或训练模型）均由代码定义。此代码称为*组件*。组件的每个实例称为*步骤*。组件由一组输入、一组输出和一个容器镜像位置组成。组件的容器镜像是一个包，包含组件的可执行代码和代码运行环境的定义。\n\
  \n\n\n\n\n#### 流水线组件\n\n流水线组件是执行流水线工作流中某一部分的独立代码集合，例如数据预处理、数据转换和模型训练。\n\n您可以构建自定义组件，也可以复用预构建组件。要在流水线中使用\
  \ Vertex AI 的功能（如 AutoML），请使用 Google Cloud 流水线组件。您可以在 `https://cloud.google.com/vertex-ai/docs/pipelines/build-pipeline#google-cloud-components`\
  \ 了解更多关于在流水线中使用 Google Cloud 流水线组件的信息。\n\n![FIGURE 11.5 Vertex AI Pipelines](img/c11f005.png)\n\
  \n**图 11.5** Vertex AI Pipelines\n\n**图 11.5** 中的流水线首先创建了一个数据集，然后启动了一个 AutoML 训练作业。该流水线设置了一个阈值，仅当*曲线下面积\
  \ (AUC)* 的阈值超过 95% 时才部署模型。您可以在将模型部署到生产环境之前，向流水线添加条件和参数，如**图 11.6** 所示。\n\n![FIGURE\
  \ 11.6 Vertex AI Pipelines condition for deployment](img/c11f006.png)\n\n**图 11.6**\
  \ Vertex AI Pipelines 部署条件\n\n您可以通过点击资源并点击“Lineage（血缘/谱系）”来查看流水线资源的谱系。例如，点击 Endpoint（端点），然后在右侧面板中您将看到“View\
  \ Lineage（查看谱系）”，这将重定向您到谱系图，如**图 11.7** 所示。\n\n![FIGURE 11.7 Lineage tracking with\
  \ Vertex AI Pipelines](img/c11f007.png)\n\n**图 11.7** 使用 Vertex AI Pipelines 进行谱系跟踪\n\
  \n您还可以使用 Vertex ML Metadata 进行谱系跟踪，这是 Vertex AI 的一项功能，用于存储使用 Vertex AI Pipelines\
  \ 运行的流水线的工件和元数据，如**图 11.8** 所示。\n\n![FIGURE 11.8 Lineage tracking in Vertex AI Metadata\
  \ store](img/c11f008.png)\n\n**图 11.8** Vertex AI Metadata 存储中的谱系跟踪\n\n通过使用 Kubeflow\
  \ Pipelines SDK 构建流水线，您可以通过构建自定义组件或复用预构建组件（例如 Google Cloud Pipeline Components）来实现您的工作流。\n\
  \n请参考 `https://cloud.google.com/vertex-ai/docs/pipelines/migrate-kfp`，了解有关如何将您现有的\
  \ Kubeflow Pipelines 迁移到 Vertex AI Pipelines 的更多信息。\n\n#### Apache Airflow\n\nApache\
  \ Airflow 是一个用于数据工程流水线的开源工作流管理平台。它于 2014 年 10 月在 Airbnb 诞生，旨在解决该公司日益复杂的工作流管理问题。\n\
  \nAirflow (`https://airflow.apache.org/docs/apache-airflow/stable/concepts/overview.html`)\
  \ 是一个允许您构建和运行工作流的平台。工作流表示为有向无环图 (DAG)，并包含称为*任务* 的独立工作单元，这些任务经过依赖关系和数据流的考虑进行排列。它自带\
  \ UI、调度器和执行器。\n\n#### Cloud Composer\n\nCloud Composer 是一个基于 Apache Airflow 构建的全代管式工作流编排服务。\n\
  \n通过使用 Cloud Composer 而不是 Apache Airflow 的本地实例，您可以在无需安装或管理开销的情况下享受 Airflow 的所有优势。Cloud\
  \ Composer 可帮助您快速创建 Airflow 环境并使用 Airflow 原生工具（如功能强大的 Airflow Web 界面和命令行工具），以便您专注于工作流而非基础设施。Cloud\
  \ Composer 旨在编排数据驱动的工作流（特别是 ETL/ELT）。\n\nCloud Composer 最适合能够容忍任务执行之间几秒钟延迟的批处理工作负载。您可以使用\
  \ Cloud Composer 编排数据流水线中的服务，例如触发 BigQuery 中的作业或启动 Dataflow 流水线。\n\n#### 工具对比\n\n\
  **表 11.1** 对比了三种编排器。\n\n**表 11.1** Kubeflow Pipelines 与 Vertex AI Pipelines 与 Cloud\
  \ Composer 对比\n\n| | Kubeflow Pipelines | Vertex AI Pipelines | Cloud Composer |\n\
  | --- | --- | --- | --- |\n| **框架的管理与支持** | Kubeflow Pipelines 用于使用 Kubernetes 在任何受支持的框架（如\
  \ TensorFlow、PyTorch 或 MXNet）中编排 ML 工作流。它可以在本地部署或在任何云中部署。 | 用于编排 Kubeflow Pipelines\
  \ 或 TFX Pipeline 的代管式无服务器流水线。无需管理基础设施。 | 使用 Apache Airflow 编排 ETL/ELT 流水线的代管式方式。它是基于\
  \ Python 的实现。您可以使用工作流来解决 MLOps 中复杂的数据处理工作流。 |\n| **故障处理** | 您需要自行处理基于指标的故障，因为这不支持开箱即用。\
  \ | 由于 Vertex AI Pipelines 运行 Kubeflow Pipelines，您可以使用 Kubeflow 基于指标的故障管理。 | 内置\
  \ GCP 指标的故障管理，可在故障或成功时采取行动。 |\n\n#### 组件、参数、触发器和计算需求的识别\n\n我们在**第 10 章**“生产环境中的模型扩展”中介绍了如何配置触发器和流水线计划，特别是关于调度训练作业方面。在本章的这一部分，我们将介绍如何触发\
  \ MLOps 流水线。您可以自动化 ML 生产流水线，以使用新数据重新训练模型。您可以按需、按计划、在新数据可用时、在模型性能下降时、在数据统计属性发生重大变化时或基于其他条件触发流水线。\n\
  \n新数据的可用性是重新训练 ML 模型的一个触发器：\n\n*   要使用新数据训练新的 ML 模型，将执行先前部署的持续训练 (CT) 流水线。不会部署新的流水线或组件；仅在流水线结束时提供新的预测服务或新训练的模型。\n\
  *   要使用新实现训练新的 ML 模型，将通过 CI/CD 流水线部署新的流水线。\n\n**图 11.9** 展示了 CI/CD 流水线与 ML CT 流水线之间的关系。\n\
  \n![FIGURE 11.9 Continuous training and CI/CD](img/c11f009.png)\n\n**图 11.9** 持续训练与\
  \ CI/CD\n\n##### 使用 Kubeflow Pipelines 调度工作流\n\n让我们看看 Kubeflow Pipelines 的 CI/CD\
  \ 是如何工作的。请参见**图 11.10**。\n\n![FIGURE 11.10 CI/CD with Kubeflow Pipelines](img/c11f010.png)\n\
  \n**图 11.10** 使用 Kubeflow Pipelines 进行 CI/CD\n\nKubeflow Pipelines 提供了一个 Python\
  \ SDK，用于使用 `kfp.Client` 以编程方式操作流水线。通过使用 Kubeflow Pipelines SDK (`www.kubeflow.org/docs/components/pipelines/v1/sdk/sdk-overview`)，您可以使用以下服务调用\
  \ Kubeflow Pipelines：\n\n*   按计划调度，您可以使用 Cloud Scheduler。\n*   响应事件，您可以使用 Pub/Sub\
  \ 和 Cloud Functions。例如，事件可以是 Cloud Storage 存储桶中有新数据文件可用。\n*   作为更大的数据和流程工作流的一部分，您可以使用\
  \ Cloud Composer 或 Cloud Data Fusion。\n*   Kubeflow Pipelines 还提供了一个内置调度器 Argo，用于\
  \ Kubeflow Pipelines 中的定期流水线。\n*   作为使用 Cloud Build 的替代方案，您可以使用其他构建系统，如 Jenkins。Google\
  \ Cloud Marketplace 上提供了现成的 Jenkins 部署。\n*   您可以使用 Apache Airflow（一种流行的编排和调度框架）用于通用工作流，您可以使用全代管式\
  \ Cloud Composer 服务运行它。有关如何使用 Cloud Composer 和 Cloud Build 编排数据流水线的更多信息，请参考 `https://cloud.google.com/architecture/cicd-pipeline-for-data-processing`。\n\
  \n#### 调度 Vertex AI Pipelines\n\n\n\n\n\n#### 调度 Vertex AI Pipelines\n\n调度 Vertex\
  \ AI 管道有两种方式：\n\n*   **使用 Cloud Scheduler 调度管道执行：** 您可以使用 Cloud Scheduler，配合具有 HTTP\
  \ 触发器的事件驱动型 Cloud Function，来调度预编译管道的执行。要使用 Cloud Scheduler 调度管道，请构建并编译一个简单的管道，将编译后的管道\
  \ JSON 上传到 Cloud Storage 存储桶，创建一个具有 HTTP 触发器的 Cloud Function，并创建一个 Cloud Scheduler\
  \ 作业。您可以手动运行您的作业（可选）。\n\n*   **使用 Cloud Pub/Sub 触发管道运行：** 您可以使用具有 Cloud Pub/Sub\
  \ 触发器的事件驱动型 Cloud Function，来调度预编译管道的执行。在 Cloud Functions 中，Pub/Sub 触发器使函数能够响应 Pub/Sub\
  \ 消息而被调用。当您为函数指定 Pub/Sub 触发器时，还需要指定一个 Pub/Sub 主题。每当消息发布到指定主题时，您的函数就会被调用。\n\n####\
  \ 使用 Kubeflow/TFX 进行系统设计\n\n在以下章节中，我们将讨论使用 Kubeflow DSL 进行系统设计，然后介绍使用 TFX 进行系统设计。\n\
  \n##### 使用 Kubeflow DSL 进行系统设计\n\n在 Kubeflow Pipelines 中创建的管道以 YAML 文件的形式存储，由一个名为\
  \ Argo 的程序执行。Kubeflow Pipelines 默认运行在 Argo Workflows 上。Kubeflow 暴露了一个 Python 领域特定语言（DSL）用于编写管道。DSL\
  \ 是对 ML 工作流中执行的操作的 Python 表示，专门为 ML 工作负载而构建。DSL 还允许将一些简单的 Python 函数用作管道阶段，而无需您显式构建容器。\n\
  \n对于每个容器（使用 Kubeflow Python SDK），您需要执行以下操作：\n\n1.  将容器创建为简单的 Python 函数，或使用任意 Docker\
  \ 容器创建。\n2.  创建一个操作，该操作引用该容器以及要传递给容器的命令行参数、数据挂载和变量。\n3.  对操作进行排序，定义哪些可以并行发生，哪些必须完成后才能继续下一步。\n\
  4.  将这个用 Python 定义的管道编译成 Kubeflow Pipelines 可以使用的 YAML 文件。\n\n###### Kubeflow Pipelines\
  \ 组件\n\n要在管道中调用组件，您需要创建一个 `component op`。您可以使用以下方法之一创建 component op：\n\n*   **实现轻量级\
  \ Python 组件：** 此组件不要求您为每次代码更改构建新的容器镜像，旨在用于笔记本环境中的快速迭代。在轻量级 Python 函数中，我们定义一个 Python\
  \ 函数，然后让 Kubeflow 负责将该函数打包到容器中并创建操作。\n*   **创建可重用组件：** 此功能要求您的组件在 `component.yaml`\
  \ 文件中包含组件规范。在管道编译期间，使用 Kubeflow Pipelines SDK 中的 `ComponentStore.load_components`\
  \ 函数，从 `component.yaml` 文件自动创建 Component ops。\n*   **使用预定义的 Google Cloud 组件：** Kubeflow\
  \ Pipelines 提供预定义组件，这些组件通过提供所需参数来执行各种托管服务，例如 Google Cloud 上的 AutoML。这些组件可帮助您使用 BigQuery、Dataflow、Dataproc\
  \ 和 AI Platform 等服务执行任务。与使用可重用组件类似，这些 component ops 通过 `ComponentStore.load_components`\
  \ 从预定义的组件规范自动创建。其他预定义组件可用于在 Kubeflow 和其他平台上执行作业。\n\n图 11.11 展示了在 Kubeflow Pipelines\
  \ 中，容器化任务如何调用其他服务，如 BigQuery 作业、AI Platform（分布式）训练作业和 Dataflow 作业。Cloud SQL 用作元数据存储。\n\
  \n![图 11.11 GCP 上的 Kubeflow Pipelines](img/c11f011.png)\n\n**图 11.11** GCP 上的 Kubeflow\
  \ Pipelines\n\n##### 使用 TFX 进行系统设计\n\n在讨论 TFX 管道之前，让我们先了解什么是 TFX。TFX 是一个基于 TensorFlow\
  \ 的 Google 生产级机器学习（ML）平台。它提供了一个配置框架和共享库，使您的 ML 代码具备生产就绪能力。TFX 是一个用于在生产环境中构建和管理 ML\
  \ 工作流的平台。TFX 提供以下内容：\n\n*   TFX 管道允许您在多个平台上编排 ML 工作流，例如 Apache Airflow、Apache Beam\
  \ 和 Kubeflow Pipelines。\n*   TFX 提供组件，您可以将其用作管道的一部分，或用作 ML 训练脚本的一部分。\n*   TFX 提供库，这些库为许多标准组件提供基础功能。TFX\
  \ 包括库和管道组件。我们在 第 2 章 \"探索数据和构建数据管道\" 中介绍了 TFDV 等 TFX 库。图 11.12 说明了 TFX 库和管道组件之间的关系。\n\
  \n![图 11.12 TFX 管道、库和组件 ¶ 来源：www.tensorflow.org/tfx/guide#tfx_standard_components](img/c11f012.png)\n\
  \n**图 11.12** TFX 管道、库和组件 ¶ 来源：`www.tensorflow.org/tfx/guide#tfx_standard_components`\n\
  \nTFX 管道通常包括以下组件：\n\n*   **ExampleGen** 是管道的初始输入组件，负责摄取并可选择性地拆分输入数据集。\n*   **StatisticsGen**\
  \ 计算数据集的统计信息。\n*   **SchemaGen** 检查统计信息并创建数据架构。\n*   **ExampleValidator** 查找数据集中的异常和缺失值。\n\
  *   **Transform** 对数据集执行特征工程。\n*   **Trainer** 训练模型。\n*   **Tuner** 调整模型的超参数。\n\
  *   **Evaluator** 对训练结果执行深度分析，帮助您验证导出的模型，确保它们“足够好”以推送到生产环境。\n*   **Model Validator**\
  \ 检查模型是否真正可从基础设施提供服务，并防止错误模型被推送。\n*   **Pusher** 将模型部署到服务基础设施上。\n*   **Model Server**\
  \ 使用未标记的推理请求对模型执行批量处理。\n\n了解上述组件对于考试很重要。\n\nTFX 管道是一系列组件的序列，这些组件实现了专门为可扩展、高性能机器学习任务设计的\
  \ ML 管道。组件使用 TFX 库构建，这些库也可以单独使用。TFX 使用元数据存储来维护管道运行的状态。\n\n您可以使用编排系统（如 Apache Airflow\
  \ 或 Kubeflow）来编排 TFX 管道。\n\n您可以通过以下方法之一在 GCP 上编排 TFX 管道：\n\n*   使用运行在 GKE 上的 Kubeflow\
  \ Pipelines。\n*   使用 Apache Airflow 或 Cloud Composer。\n*   使用 Vertex AI Pipelines。\n\
