  \ D 更好，因为它使用了 `ARIMA_PLUS`，并利用了 COVID-19 公开数据集。\n\n#### 2\n**C.** 选项 A 和 D 是错误的，因为你属于一个小型数据分析师团队，可能不具备自定义模型或\
