  \ Vertex AI 上使用最新的深度神经网络 TensorFlow 算法训练自定义模型。\n3.  使用猫/狗数据集在 Vertex AI 上训练 Vertex\
  \ AI AutoML 图像分类模型。对地标识别做同样的处理。\n4.  Vision AI 已经能识别宠物和地标。使用它来查看是否满足要求。如果不满足，则使用\
  \ Vertex AI AutoML 模型。\n\n#### 23. 你正在构建一个产品，能将球准确地投进篮网。无论放置在球场的哪个位置都应正常工作。你基于数千小时的视频创建了一个非常大的\
  \ TensorFlow 模型（大小超过 90 GB）。该模型使用自定义操作，并优化了训练循环，使其没有任何 I/O 操作。你有哪些硬件选项来训练此模型？\n\n\
  1.  使用 TPU 切片，因为模型非常大且已优化为没有任何 I/O 操作。\n2.  使用 TPU Pod，因为模型大小超过 50 GB。\n3.  使用仅含\
  \ GPU 的实例。\n4.  使用仅含 CPU 的实例来构建模型。\n\n#### 24. 你在渔业工作，被要求使用机器学习根据大小和颜色预测龙虾的年龄。你有来自北极渔船的数千张龙虾图像，从中提取了龙虾的大小并传递给模型，且构建了一个用于预测年龄的回归模型。你的模型在测试集和验证集上表现非常好。用户希望从他们的渔船上使用此模型。你的后续步骤是什么？（选择三项。）\n\
