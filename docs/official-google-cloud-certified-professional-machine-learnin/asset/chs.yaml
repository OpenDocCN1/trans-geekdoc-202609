  \ `execution`（执行）是数据模型中的有效元素。\n\n---\n\n### 第 13 章：维护机器学习解决方案\n\n#### 第 1-7 题：MLOps\
  \ 成熟度等级\n\n1.  **B.** 选项 B 不属于 MLOps 的一部分。虽然寻找其他用例来解决是一项有效的工作，但它不属于 MLOps 工作流。选项\
  \ A、C 和 D 是 MLOps 的主要步骤。\n\n2.  **B.** 这是一个老牌组织，刚开始探索和试验机器学习，所以最好的方法是采用 0 级。选项 A\
  \ 是错误的，因为构建临时模型不是任何组织的规范化方法。选项 C 和 D 适用于更成熟的情况。\n\n3.  **C.** 选项 A 是错误的，因为临时构建模型不适合这种成熟度等级。选项\
  \ B 是错误的，因为 MLOps 0 级适用于刚在试验和运行概念验证的组织。MLOps 1 级（战略级）是该组织的正确等级。此外，因为我们只处理一个模型，所以符合这个等级。选项\
  \ D 是错误的，因为那通常适用于处理数十或数百个模型、并尝试不同算法和技术的组织。\n\n4.  **D.** 选项 A 是错误的，因为临时构建模型不适合这种成熟度等级。选项\
  \ B 是错误的，因为 MLOps 0 级适用于刚在试验和运行概念验证的组织。选项 C 也是错误的，因为 MLOps 1 级（战略级）通常适用于运行少数模型的组织。MLOps\
  \ 2 级是正确等级，因为他们并行处理许多模型，并尝试不同的算法和技术。\n\n5.  **C.** 选项 A 是错误的，因为虽然模型训练可能被称为临时性的，但它确实解决了一些问题。选项\
  \ B 是错误的，因为 MLOps 0 级不实现训练自动化。选项 D 是错误的，因为 0 级不实现整个流程的自动化。选项 C 在事实上是正确的。\n\n6. \
  \ **D.** 选项 D 不在 MLOps 1 级处理范围内，仅在 2 级处理。所有其他选项 A、B 和 C 在 1 级均有效。\n\n7.  **D.**\
  \ 该组织处于机器学习使用的高级阶段，这种成熟度也应体现在 MLOps 中，因此 2 级是正确答案。\n\n#### 第 8-12 题：MLOps 工作流与触发器\n\
  \n8.  **C.** 在此级别，数据科学家试验模型，然后创建流水线来生成模型。此流水线代码通过代码仓库提交，将在生产环境中进行编排。\n\n9.  **A.**\
  \ 在此级别，数据科学家试验模型，然后创建模型。此文件提供给部署团队。\n\n10. **C.** 虽然它们是重要组件，但特征存储和元数据存储不会触发训练工作流。此外，也不会使用随机触发器。当模型随时间退化时，正如监控数据所见，会触发重新训练。\n\
  \n11. **B, C.** 重新训练模型有基础设施成本，重新训练越频繁，这些成本增加越多。因此，选项 B 和 C 是正确的。算法与触发重新训练无关。访问数据的时间完全不是一个因素。\n\
  \n12. **B, D.** 启用模型监控后，我们会定期评估模型性能。如果性能突然下降或降至阈值以下，则可能触发重新训练。因此，正确答案是选项 B 和 D。预测次数或安全漏洞不应触发重新训练。\n\
  \n\n\n\n\n#### 13\n**D.** 通常情况下，当你训练/重新训练一个具有相同输入/输出且预期使用方式与前一版本相同的模型时，为避免对下游造成干扰，建议创建一个新版本。选项\
  \ A 是错误的，因为如果你训练一个功能完全不同的模型，它不应作为现有模型的新版本部署。选项 B 是错误的，因为虽然增量训练的模型通常作为新版本部署，但这并非唯一情况。选项\
  \ C 是错误的，因为新模型的版本控制是一种常见的设计模式。\n\n#### 14\n**B, C.** 当团队各自为政时，他们往往会重复创建相同或相似的特征，从而造成冗余。最好只创建一次特征并存储起来以供将来使用，甚至供他人使用。选项\
  \ A 是错误的，因为一个模型使用的特征数量不是创建特征存储的充分理由。同样，选项 D 也是错误的，因为模型输入的类型数量也不是使用特征存储的理由。\n\n####\
  \ 15\n**C.** Feast 使用 `BigQuery`、`Redis` 和 `Apache Beam`。它不使用 `Gojek`，后者是 Feast\
  \ 开源项目的贡献者。\n\n#### 16\n**A.** `Featurestore` 是高层容器，包含 `EntityType`，后者又包含许多 `Features`。\n\
  \n#### 17\n**A.** `Featurestore` 是最高层容器，包含 `EntityType`，后者可包含许多 `Features`。\n\n\
  #### 18\n**D.** 选项 A 是错误的，因为你无法从 `BigQuery` 进行实时服务。选项 B 不是一个好的解决方案，因为创建特征存储需要很长时间。选项\
  \ C 虽然可行，但鉴于你只有一天时间且被要求转去另一个项目，你应该使其易于维护和移交。因此，托管服务是首选。选项 D 是正确答案；`Vertex AI Feature\
  \ Store` 是一个托管特征存储，最适合此用例。\n\n#### 19\n**C.** `Vertex AI Feature Store` 无法存储图像。所有其他陈述均为真。\n\
  \n#### 20\n**A.** `Vertex AI Feature Store` 使用时间序列模型存储数据。这有助于其检索历史数据，以协助下游 ML 工作流的一致性。\n\
  \n### 第 14 章：BigQuery ML\n\n#### 1\n**D.** 选项 A 是错误的，因为这不是一个分布式用例（销售数据可能是分布式的，但数据和计算并非如此）。选项\
