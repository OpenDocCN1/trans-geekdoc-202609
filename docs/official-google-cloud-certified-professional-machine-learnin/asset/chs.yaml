  \ Hitesh Hinduja 在整个写作过程中作为一名出色的审稿人。\n\n我还要感谢 Wiley 的 Jim Minatel 和 Melissa Burlock，以及\
  \ Dan Sullivan，是他促成了我与 Wiley 的合作撰写本书。\n\n—Mona Mona\n\n本书是许多人辛勤工作的成果，很高兴看到大家作为一个团队聚在一起，从\
  \ Wiley 的 Jim Minatel 和 Melissa Burlock 开始，包括 Kim Wimpsett、Christine O' Connor、Saravanan\
  \ Dakshinamurthy、Judy Flynn、Arielle Guy 和审稿人们。\n\n最重要的是，我要感谢 Mona 主导了这项庞大的工程。她以往的写作经验积累的知识以及从头到尾的领导力，对完成本书至关重要。\n\
  \n—Pratap Ramamurthy\n\n### 作者简介\n\n**Mona Mona** 是 Google Public Sector 的 AI/ML\
  \ 专家。她是《Natural Language Processing with AWS AI Services》一书的作者，也是一位演讲者。在加入 Google\
  \ 之前，她曾担任 AWS 高级 AI/ML 专家解决方案架构师。她拥有 14 项认证，并为 AWS AI/ML 认证专业考试创建了备考课程。她撰写了 17 篇关于\
  \ AI/ML 的博客，并合著了一篇关于 AWS CORD‐19 Search 的研究论文：一款用于 COVID‐19 文献的神经搜索引擎，该论文在人工智能促进协会（AAAI）会议上获奖。可通过\
  \ `monasheetal3@gmail.com` 联系她。\n\n**Pratap Ramamurthy** 善于利用机器学习解决问题。目前他是 Google\
  \ Public Sector 的 AI/ML 专家。此前他在 AWS 担任合作伙伴解决方案架构师，帮助构建 Amazon SageMaker 的合作伙伴生态系统。后来他担任\
  \ H2O.ai 的首席解决方案架构师，该公司致力于结构化数据和自然语言的机器学习算法。在此之前，他是一名开发人员和研究员。他发表了多篇关于网络、服务器分析技术、遗传算法和光电子学的研究论文。他持有三项与云技术相关的专利。业余时间，他喜欢用现代桌游教学\
  \ AI。可通过 `pratap.ram@gmail.com` 联系他。\n\n### 技术编辑简介\n\n\n\n\n\n#### Hitesh Hinduja\n\
  \n**Hitesh Hinduja** 是一位热衷于人工智能（AI）和数据平台的爱好者，目前担任微软 Azure 数据与 AI 高级经理。他曾在 Ola Electric\
  \ 担任 AI 高级经理，领导一个 30 多人的团队，涉及机器学习、统计学、计算机视觉、深度学习、自然语言处理和强化学习等领域。他在印度和美国申请了 14 项以上专利，并以其名义发表了多篇研究论文。Hitesh\
  \ 曾在印度顶尖商学院——印度商学院（海得拉巴）和印度管理学院（艾哈迈达巴德）担任研究职务。他还积极参与培训和指导工作，受邀担任全球各地各类企业和协会的嘉宾演讲者。他是一位勤奋的学习者，业余时间喜欢阅读书籍。\n\
  \n#### Kanchana Patlolla\n\n**Kanchana Patlolla** 是 Google Cloud 的 AI 创新项目负责人。此前她曾担任\
  \ Google Cloud Platform 的 AI/ML 专家。她为金融服务行业的主要公共云提供商设计解决方案，助力其上云进程，特别是在大数据和机器学习领域。业余时间，她喜欢尝试各种美食，并陪伴孩子放松身心。\n\
  \n### 关于技术校对员\n\n**Adam Vincent** 是一位经验丰富的教育工作者，热衷于传播知识、帮助人们拓展技能。他持有多项 Google Cloud\
  \ 认证，是 Google Cloud 认证讲师，并创建了多门机器学习课程。Adam 还喜欢玩转数据、实现一切自动化。不在屏幕前时，他喜欢与亲朋好友玩桌面游戏、阅读科幻和奇幻小说以及徒步旅行。\n\
  \n### Google 技术审阅员\n\nWiley 和作者们感谢 Google 技术审阅员 Emma Freeman 对本书校样进行的细致审阅。\n\n######\
  \ 简介\n\n当客户遇到业务问题时，例如在图像中检测对象，有时可以使用机器学习非常好地解决。Google Cloud Platform（`GCP`）提供了一套广泛的工具，用于构建能够完成此任务的模型，并将其部署用于生产环境。本书将涵盖许多不同的用例，例如使用销售数据预测下一季度的业绩、识别图像或视频中的对象，甚至从文本文档中提取信息。本书帮助工程师构建安全、可扩展、有弹性的机器学习应用，并使用最新技术实现整个流程的自动化。\n\
  \n本书旨在帮助您通过最新版本的 Google Cloud 专业机器学习工程师（`PMLE`）考试。即使您已经参加并通过了 `PMLE` 考试，本书仍应作为一本有用的参考书，因为它涵盖了机器学习基础、`BigQuery\
  \ ML`、`Vertex AI` 平台和 `MLOps`。\n\n#### Google Cloud 专业机器学习工程师认证\n\n专业机器学习工程师利用 Google\
  \ Cloud 技术和经过验证的 ML 模型及技术，设计、构建和生产化 ML 模型以解决业务挑战。ML 工程师在整个 ML 开发过程中考量负责任的 AI，并与其他职角色紧密协作，确保模型的长期成功。ML\
  \ 工程师应精通模型架构、数据管道交互和指标解读的各个方面。ML 工程师需要熟悉应用开发、基础设施管理、数据工程和数据治理的基础概念。通过理解训练、重新训练、部署、调度、监控和改进模型，ML\
  \ 工程师设计并创建可扩展的解决方案以实现最佳性能。\n\n##### 为什么要成为专业 ML 工程师（PMLE）认证人员？\n\n获得 `PMLE` 认证有几个充分的理由。\n\
  \n*   **提供专业成就的证明** 认证正迅速成为计算机服务行业的身份象征。包括计算机服务行业成员在内的各类组织，都已认识到认证的益处。\n\n*   **提高您的就业竞争力**\
  \ 根据《福布斯》（`www.forbes.com/sites/louiscolumbus/2020/02/10/15-top-paying-it-certifications-in-2020/?sh=12f63aa8358e`）报道，要求具备\
  \ `GCP` 认证的职位已连续第二年成为薪酬最高的 IT 职位，平均年薪达 175,761 美元。因此，许多工程师都有获证需求。在 `GCP` 提供的众多认证中，AI/ML\
  \ 认证工程师是一项新认证，仍在不断发展中。\n\n*   **提供晋升机会** IDC 的研究（`www.idc.com/getdoc.jsp?containerId=IDC_P40729`）表明，虽然\
  \ AI/ML 采用率正在上升，但成本、缺乏专业知识和缺乏生命周期管理工具是大规模实现 AI 和 ML 的前三大阻碍因素。\n\n*   本书是市场上第一本介绍\
  \ Google Cloud AI/ML 工具和技术、涵盖 2022 年 2 月 22 日发布的最新专业机器学习工程师认证指南的书籍。\n\n*   **彰显\
  \ Google 在开源和 AI 领域的领导地位** Google 是许多开创性开源软件的主要贡献者，这些软件极大地改变了 AI/ML 的格局，包括 `TensorFlow`、`Kubeflow`、`Word2vec`、`BERT`\
  \ 和 `T5`。尽管这些算法属于开源领域，但 Google 拥有通过 Google Cloud Platform（`GCP`）将这些开源项目推向市场的独特能力。在这方面，其他云服务提供商经常被视为落后于\
  \ Google 的产品。\n\n*   **增强客户信心** 随着 IT 社区、用户、小企业主等对 `PMLE` 认证专业人士的了解加深，他们将越来越多地意识到，与非认证人员相比，`PMLE`\
  \ 专业人士更有资格在 Google Cloud 环境中设计安全、具成本效益且可扩展的 ML 解决方案。\n\n##### 如何获得认证\n\n您无需为特定公司工作。这不是一个秘密组织。参加此考试没有先决条件。不过，建议拥有\
  \ 3 年以上行业经验，包括 1 年以上使用 Google Cloud 设计和管理解决方案的经验。\n\n考试时长为 2 小时，包含 50-60 道多项选择题。\n\
  \n您可以通过两种方式注册参加此考试：\n\n*   参加在线监考考试，随地随时（如在家）均可。您可以在 `www.webassessor.com/wa.do?page=certInfo&branding=GOOGLECLOUD&tabs=13`\
  \ 查看在线考试要求。\n\n*   在考试中心参加现场监考考试。\n\n我们通常倾向于选择现场考试，因为我们喜欢监考环境下的专注时间。我们所有的认证考试都是在考试中心参加的。您可以在\
  \ `www.kryterion.com/Locate-Test-Center` 查找并定位您附近的考试中心。\n\n#### 谁应该购买本书\n\n本书旨在帮助学生、开发人员、数据科学家、IT\
  \ 专业人员和 ML 工程师精通 Google Cloud Platform 上的 ML 技术，并参加 `专业机器学习工程师` 考试。本书意在引导读者完成机器学习流程，从数据开始，经过特征工程、模型训练，直到在\
  \ Google Cloud 上部署。它还指导读者了解在何种最佳实践下应选择自定义模型、AutoML 或预训练模型。通过真实场景展示 Google Cloud\
  \ AI/ML 技术，说明 IT 专业人员如何设计、构建和运行安全的 ML 云环境，以实现应用现代化和自动化。\n\n\n\n\n\n任何想要通过专业机器学习工程师考试的人都能从本书中受益。如果您是\
  \ Google Cloud 新手，本书涵盖了更新后的机器学习考试课程材料，包括 Google Cloud Vertex AI 平台、MLOps 和 BigQuery\
  \ ML。这是市场上唯一一本完整涵盖 Vertex AI 平台的书籍，从数据引入到模型训练、调优和部署全都囊括在内。\n\n由于这是一本专业级学习指南，本书的编写假设您了解\
  \ Google Cloud Platform 的基础知识，例如计算、存储、网络、数据库以及身份和访问管理 (IAM)，或者已通过 Google Cloud Associate\
  \ 级认证考试。此外，本书假设您总体上理解机器学习和数据科学的基础知识。如果您不理解某个术语或概念，我们已附上词汇表供您参考。\n\n#### 本书的组织结构\n\
  \n本书包含 14 章以及补充信息：词汇表、本导言和导言后的评估测试。各章节安排如下：\n\n*   **第 1 章**：构建 ML 问题 — 本章介绍如何将业务挑战转化为\
  \ ML 用例。\n*   **第 2 章**：探索数据和构建数据流水线 — 本章涵盖可视化、大规模统计基础、数据质量与可行性评估、建立数据约束（例如 `TFDV`）、组织和优化训练数据集、数据验证、处理缺失数据、处理异常值以及数据泄露。\n\
  *   **第 3 章**：特征工程 — 本章涵盖结构化数据类型编码、特征选择、类别不平衡、特征组合和转换（`TensorFlow Transform`）等主题。\n\
  *   **第 4 章**：选择合适的 ML 基础设施 — 本章涵盖计算和加速器选项评估（例如 CPU、GPU、TPU、边缘设备）以及选择合适的 Google\
  \ Cloud 硬件组件等主题。还涵盖根据业务需求选择最佳解决方案（ML 与非 ML、自定义与预打包 [例如 `AutoML`、`Vision API`]）。内容涉及如何定义模型输出以解决业务问题。还介绍了如何决定处理错误结果的方式以及识别数据源（可用与理想）。并探讨了\
  \ `CCAI`、`DocAI` 和 `Recommendations AI` 等 AI 解决方案。\n*   **第 5 章**：设计 ML 解决方案架构 —\
  \ 本章解释如何设计可靠、可扩展且高可用的 ML 解决方案。其他主题包括如何为用例选择合适的 ML 服务（例如 `Cloud Build`、`Kubeflow`）、组件类型（例如数据收集、数据管理）、自动化、编排以及机器学习中的服务。\n\
  *   **第 6 章**：构建安全的 ML 流水线 — 本章描述如何构建安全的 ML 系统（例如防止数据/模型被无意利用、黑客攻击）。还涵盖数据使用和/或收集的隐私影响（例如处理敏感数据，如个人身份信息\
  \ [PII] 和受保护的健康信息 [PHI]）。\n*   **第 7 章**：模型构建 — 本章描述框架选择和模型并行性。还涵盖考虑到可解释性要求的建模技术、迁移学习、数据增强、半监督学习、模型泛化，以及处理过拟合和欠拟合的策略。\n\
  *   **第 8 章**：模型训练和超参数调优 — 本章重点介绍将各种文件类型引入训练（例如 CSV、JSON、IMG、parquet 或数据库、Hadoop/Spark）。涵盖在不同环境中将模型训练作为作业运行。还介绍模型训练和服务的单元测试以及超参数调优。此外，还讨论了在训练期间跟踪指标的方法以及重新训练/重新部署评估。\n\
  *   **第 9 章**：Vertex AI 上的模型可解释性 — 本章介绍 Vertex AI 上模型可解释性的方法。\n*   **第 10 章**：生产环境中的模型扩缩\
  \ — 本章涵盖预测服务扩缩（例如 `Vertex AI Prediction`、容器化服务）、服务（在线、批量、缓存）、Google Cloud 服务选项、目标性能测试以及配置触发器和流水线计划。\n\
  *   **第 11 章**：设计 ML 训练流水线 — 本章涵盖组件、参数、触发器和计算需求的识别（例如 `Cloud Build`、`Cloud Run`）。还讨论编排框架（例如\
  \ `Kubeflow Pipelines`/`Vertex AI Pipelines`、`Cloud Composer`/`Apache Airflow`）、混合云或多云策略，以及使用\
  \ `TFX` 组件/`Kubeflow DSL` 进行系统设计。\n*   **第 12 章**：模型监控、跟踪和元数据审计 — 本章涵盖 ML 模型预测的性能和业务质量、日志记录策略、实验组织与跟踪以及流水线运行。还讨论数据集版本控制和模型/数据集血缘。\n\
