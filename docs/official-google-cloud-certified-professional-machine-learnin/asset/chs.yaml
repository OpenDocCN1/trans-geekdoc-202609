  \n\n\n#### 3. B\n特征组合或合成特征，是通过将两个或多个特征相乘（组合）来创建的。它可以是将同一特征与自身相乘 [`A * A`]，也可以是将多个特征的值相乘，例如\
  \ [`A * B * C`]。在机器学习中，特征组合通常在独热编码特征上执行。例如，`binned_latitude × binned_longitude`。更多信息请参阅第\
  \ 3 章。\n\n#### 4. A\n正确。Cloud Pub/Sub 创建数据流式传输管道，Cloud Dataflow 用于数据转换。更多信息请参阅第\
