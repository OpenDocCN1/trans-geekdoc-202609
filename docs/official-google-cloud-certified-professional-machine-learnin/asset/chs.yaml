  \ Engine 实例上部署模型并测试内存和 CPU 使用情况。\n4.  检查代码，看是否为单线程，并检查其他软件配置是否有 Bug。\n\n### 第 5\
  \ 章：架构 ML 解决方案\n\n在上一章中，我们讨论了在 Google Cloud 中运行工作负载的各种选项。在本章中，我们将讨论如何使用我们的人工智能/机器学习\
  \ (AI/ML) 服务栈，在 Google Cloud Platform (GCP) 上设计可靠、可扩展且高可用的 ML 解决方案的最佳实践。我们将介绍 Google\
  \ AI/ML 栈，并讨论如何根据你的易用性需求和 AI/ML 技能水平，从栈中为 ML 用例选择合适的服务。然后我们将讨论在 GCP 上进行 ML 时，用于收集和管理数据的各种服务。之后，我们将讨论如何使用\
  \ GCP AI/ML 流水线自动执行数据准备、数据转换、训练、调优和部署等各个步骤。最后，你将了解一些在生产环境中托管或部署 ML 模型以提供请求服务的最佳实践。\n\
  \n#### 设计可靠、可扩展且高可用的 ML 解决方案\n\n要设计高度可靠、可扩展且可用的 ML 解决方案，你需要考虑如何自动化和编排 AI/ML 流水线的各个步骤。\n\
  \n你的 ML 流水线包含以下步骤：\n\n1.  数据收集\n2.  数据转换\n3.  模型训练\n4.  模型调优\n5.  模型部署\n6.  模型监控\n\
  \n此外，这是一个迭代过程，因为你可能需要根据评估指标（准确率、置信度得分等）重新训练模型。\n\n你需要一个可扩展的存储解决方案来管理和存储数据——例如 `Google\
  \ Cloud Storage`。然后你需要一个可扩展的基础设施来运行转换作业，例如在 `Google Cloud Dataflow` 上运行 `PySpark`\
  \ 转换作业。数据转换完成后，你需要可扩展的算力来训练模型。要创建无法在笔记本电脑中容纳的大型模型，你需要分布式训练。\n\n对于自定义模型训练（`TensorFlow`、`Scikit`、`PyTorch`\
  \ 或其他框架），你可以使用 `Vertex AI Training`，因为你无需担心为训练启动基础设施，也无需管理该基础设施以在训练结束时停止。如果你不使用\
  \ `TensorFlow`、`Scikit` 或 `PyTorch` 进行自定义训练，你也可以选择使用 `Vertex AI AutoML` 和 `Vertex\
  \ AI APIs`。训练结束后，你可能想通过运行 100 个此类训练作业（这些作业包含来自搜索空间的各种超参数组合）来调整模型的各种超参数。这就是你可以使用\
  \ `Vertex AI Hyperparameter Tuning` 以可扩展的方式自动运行多个训练作业的地方。你还希望以托管、可扩展且可靠的方式跟踪这些变量和多次训练结果。这就是\
  \ `Vertex AI Experiments` 可以帮助跟踪训练运行的参数和结果的地方。既然你能跟踪实验，这将有助于更快地选择模型。\n\n最后，一旦你选出了准确率最高的最佳训练作业，你就必须考虑在生产环境中部署此模型。你还需要担心生产模型的扩缩容；`Vertex\
  \ AI Prediction` 可以帮助你以全托管方式在生产环境中扩缩容预测端点。\n\n模型部署到生产环境后，你需要考虑监控托管模型以检查是否存在任何模型漂移。这就是\
  \ `Vertex AI Model Monitoring` 可以提供帮助的地方。你还需要考虑如何复现从数据收集到模型部署的完整流水线，因为 ML 是一个迭代过程。`Vertex\
  \ AI Pipelines` 可以在此提供帮助。\n\n表 5.1 总结了我们提到的用于架构高可用可扩展托管解决方案的服务。\n\n##### 表 5.1：ML\
  \ 工作流到 GCP 服务的映射\n\n| ML 工作流 | Google Cloud 服务 |\n| :--- | :--- |\n| 数据收集 | `Google\
  \ Cloud Storage`、`Pub/Sub`（流式数据）、`BigQuery` |\n| 数据转换 | `Dataflow` |\n| 模型训练 | 自定义模型（`Vertex\
  \ AI Training` 和 `Vertex AutoML`） |\n| 调优和实验跟踪 | `Vertex AI Hyperparameter Tuning`\
  \ 和 `Vertex AI Experiments` |\n| 部署和监控 | `Vertex AI Prediction` 和 `Vertex AI Model\
  \ Monitoring` |\n| 编排和 CI/CD | `Vertex AI Pipelines` |\n| 可解释性和负责任的 AI | `Vertex\
  \ Explainable AI`、模型卡 |\n\n#### 选择合适的 ML 服务\n\nGoogle Cloud ML 服务和解决方案根据易用性和实现难度分为三层，如图\
  \ 5.1 所示。\n\n![图 5.1：Google AI/ML 栈](img/c05f001.png)\n\n##### 图 5.1：Google AI/ML\
  \ 栈\n\n顶层是 AI 解决方案，例如 `Document AI`、`Contact Center AI` 和 `Enterprise Translation\
  \ Hub`。这些是托管的软件即服务 (SaaS) 产品，无需代码即可更轻松地实现和管理。AI 解决方案构建在中间层的 `Vertex AI` 服务之上。\n\n\
  中间层由 `Vertex AI` 组成，包含以下内容：\n\n*   **Vertex AI 预训练 API**，适用于视觉、语言、对话和结构化数据中最常见的用例。这些\
  \ API 是无服务器且可扩展的。\n*   **Vertex AI AutoML**，用于利用你自己的数据丰富 Vertex AI API 用例，以创建针对你业务用例的特定模型。例如，你可以通过提供一些公司徽标的示例来训练\
  \ `AutoML Vision` 模型，以检测道路上带有你公司徽标的卡车图像。\n*   **Vertex AI Workbench**，这是整个数据科学工作流的开发环境。这可以涵盖从数据标注、训练、调优、部署到监控你自己的自定义模型，这些模型不适合使用\
  \ AI 服务和 AutoML 的任何用例。一个例子是构建文本摘要模型。\n\n底层由基础设施组成，例如计算实例和容器（`Google Kubernetes Engine`），可选择\
  \ TPU、GPU 和存储。你需要自行管理基础设施以实现可扩展性和可靠性。\n\nGoogle Cloud 提供 `BigQuery ML` 和 `Vertex\
  \ AI AutoML` 来帮助自动创建针对某些常见问题领域的自定义模型。`Vertex AI` 提供的其余工具帮助你为任何问题领域构建完全自定义的模型。我们将在第\
  \ 14 章“BigQuery ML”中详细介绍 `BigQuery ML`。表 5.2 讨论了何时使用 AutoML 与 BigQuery ML 与 Vertex\
  \ AI 自定义模型。\n\n##### 表 5.2：何时使用 BigQuery ML 与 AutoML 与自定义模型\n\n| GCP 服务 | 何时使用 |\n\
  | :--- | :--- |\n| `BigQuery ML` | 你在 `BigQuery` 数据仓库中拥有结构化数据，因为 `BigQuery ML` 需要表格数据集。你熟悉\
  \ `SQL`，且 `BigQuery ML` 中可用的模型与你试图解决的问题相匹配。我们将在第 14 章介绍所有模型。 |\n\n\n\n\n\n#### AutoML（Vertex\
  \ AI 语境下）\n\n*   您的问题符合 AutoML 支持的类型之一，例如分类、目标检测、情感分析和翻译。\n*   您的数据（文本、视频、图像和表格数据）符合每种\
  \ AutoML 模型类型设定的格式要求和限制。\n\n#### Vertex AI 自定义训练模型\n\n*   您的问题不符合本表中列出的 BigQuery\
  \ ML 或 AutoML 的标准。\n*   您已经在本地或其他云平台上运行训练，并且需要跨平台的一致性。\n\n#### 数据收集与数据管理\n\nGoogle\
  \ Cloud 提供了多种数据存储，以满足您对特征在延迟、负载、吞吐量和规模方面的组合要求：\n\n*   Google Cloud Storage\n*  \
  \ BigQuery\n*   `Vertex AI's datasets`，用于管理训练集和标注集\n*   Vertex AI Feature Store\n\
  *   NoSQL 数据存储\n\n##### Google Cloud Storage (GCS)\n\nGoogle Cloud Storage 是一项在\
  \ Google Cloud 中存储对象的服务。您可以使用 GCS 存储图像、视频、音频和非结构化数据。您可以将这些单独的数据类型合并为大小至少为 100 MB\
  \ 的大文件（https://cloud.google.com/architecture/ml-on-gcp-best-practices#store-image-video-audio-and-unstructured-data-on-cloud-storage），并分成\
  \ 100 到 10,000 个分片，以提高读写吞吐量。如果您使用 TensorFlow，这适用于分片 TFRecord 文件；如果您使用任何其他框架，则适用于\
  \ Avro 文件。\n\n##### BigQuery\n\n最佳实践是将表格数据存储在 BigQuery 中。对于训练数据，最好将数据作为表存储，而不是视图，以获得更好的速度。可以通过以下方式使用\
  \ BigQuery 功能：\n\n*   Google Cloud 控制台，搜索 BigQuery\n*   `bq` 命令行工具\n*   BigQuery\
  \ REST API\n*   使用 BigQuery Magic 或 BigQuery Python 客户端的 Vertex AI Jupyter Notebook。\n\
  \n我们将在第 14 章介绍 BigQuery ML。\n\n表 5.3 列出了可让您更轻松地使用 API 的 Google Cloud 工具。\n\n**表\
  \ 5.3** 用于读取 BigQuery 数据的 Google Cloud 工具\n\n| 框架 | 用于从 BigQuery 读取数据的 Google Cloud\
  \ 工具 |\n| --- | --- |\n| TensorFlow 或 Keras | `tf.data.dataset reader for BigQuery`\
  \ 和 `tfio.BigQuery.BigQueryClient()` (`www.tensorflow.org/io/api_docs/python/tfio/BigQuery/BigQueryClient`)\
  \ |\n| TFX | `BigQuery client` |\n| Dataflow | `BigQuery I/O connector` |\n| 任何其他框架\
  \ | `BigQuery Python Client library` |\n\n##### Vertex AI 托管数据集\n\nGoogle Cloud\
  \ 建议使用 Vertex AI 托管数据集来训练自定义模型，而不是编写训练应用以直接从 Google Cloud Storage 或本地存储等存储系统中摄取训练数据。主要支持四种数据格式：图像、视频、表格（CSV、BigQuery\
  \ 表）和文本。\n\n使用托管存储的优势如下：\n\n*   在中心位置管理数据集。\n*   使用 Vertex AI 数据标注，对视频、文本和图像等未标注的非结构化数据进行集成数据标注。\n\
  *   易于追踪模型谱系，以便进行治理和迭代开发。\n*   使用相同的数据集训练 AutoML 和自定义模型，以对比模型性能。\n*   生成数据统计信息和可视化结果。\n\
  *   自动将数据拆分为训练集、测试集和验证集。\n\n当您拥有未标注的非结构化数据时，可以使用 Vertex AI 数据标注服务，对 Google Cloud\
  \ Storage 或 Vertex AI 托管数据集中的数据进行标注。这只是一项标注数据的服务，并不存储数据。您可以使用第三方众包标注人员或您自己的标注人员来标注数据。\n\
  \n##### Vertex AI Feature Store\n\nVertex AI Feature Store 是一个全代管的中心化存储库，用于组织、存储和服务\
  \ ML 特征。您可以独立使用 Vertex AI Feature Store，也可以将其作为 Vertex AI 工作流的一部分使用。例如，您可以从 Vertex\
  \ AI Feature Store 获取数据，在 Vertex AI 中训练自定义模型或 AutoML 模型。当您使用结构化数据训练模型时，用户可以定义特征，然后从各种数据源摄取（导入）特征值。任何获授权的用户都可以搜索并从\
  \ Feature Store 检索值。例如，您可以查找特征，然后执行批量导出以获取用于创建 ML 模型的训练数据，或者如果特征不存在，则创建一个新特征。您还可以实时检索特征值，以执行快速在线预测。\n\
  \n使用 Feature Store 的好处是，您无需计算特征值并将它们保存在各种位置，例如 BigQuery 中的表和 Google Cloud Storage\
  \ 中的文件。此外，由于特征是在中心化的方式下创建的，Feature Store 可以帮助检测漂移并缓解数据倾斜。\n\n##### NoSQL 数据存储\n\n\
  对于预测期间的静态特征查找，BigQuery 等分析型数据存储并非为低延迟的单例读取操作而设计，此类操作的结果是包含许多列的单行数据。此类查询的示例是“为特定客户\
  \ ID 从多个表中选择 100 列”。因此，静态参考特征会被收集、准备并存储在针对单例查找操作进行了优化的 NoSQL 数据库中。\n\n表 5.4 显示了\
  \ Google Cloud 中托管数据存储的 NoSQL 数据存储选项。作为 ML 专家，我们曾使用 Memorystore 处理需要亚毫秒级延迟的用例。我们曾在延迟可达毫秒级的用例中使用数据存储来存储用户登录详细信息，并使用\
  \ Bigtable 处理具有动态变化数据的毫秒级延迟场景。\n\n**表 5.4** NoSQL 数据存储选项\n\n| | Memorystore | Datastore\
  \ | Bigtable |\n| --- | --- | --- | --- |\n| 说明 | Memorystore 是一种代管式内存数据库。当您使用其\
  \ Redis 产品时，可以存储中间数据以实现亚毫秒级读取访问。键是二进制安全字符串，值可以是不同的数据结构。 | Datastore 是一种全代管、可扩展的\
  \ NoSQL 文档数据库，专为自动扩缩、高性能和简化应用开发而构建。Datastore 中的数据对象称为实体。一个实体具有一个或多个命名属性，您可在其中存储模型所需的特征值。\
  \ | Bigtable 是一种大规模可扩展的 NoSQL 数据库服务，专为高吞吐量和低延迟工作负载而设计。它可以处理 PB 级数据，每秒支持数百万次读写，延迟在毫秒级。数据结构为排序的键值映射。Bigtable\
  \ 随节点数量线性扩缩。 |\n| 检索 | 在有限的快速变化数据上实现亚毫秒级检索延迟，由几千个客户端检索。 | 在缓慢变化的数据上实现毫秒级检索延迟，存储自动扩缩。\
  \ | 在动态变化的数据上实现毫秒级检索延迟，使用可随大量读写线性扩缩的存储。 |\n| 用例 | 实时竞价中的用户特征查找，要求亚毫秒级检索时间。<br>使用预计算预测的媒体和游戏应用。<br>存储实时数据流水线的中间数据，用于创建输入特征。\
  \ | 基于登录用户信息的电商网站产品推荐系统。 | 利用动态聚合值的欺诈检测。Fintech 和 Adtech 领域的应用通常面临大量读写。<br>利用所有广告请求和历史数据动态聚合值的广告预测。<br>基于整体客户群近期预订情况的预订推荐。\
  \ |\n\n#### 自动化与编排\n\n\n\n\n\n#### 机器学习工作流与流水线编排\n\n机器学习工作流定义了在机器学习项目期间实施的各个阶段。典型阶段包括数据收集、数据预处理、构建数据集、模型训练与优化、评估以及部署到生产环境。要在生产环境中集成\
  \ ML 系统，您需要编排 ML 流水线中的各个步骤。此外，您还需要实现流水线的自动化执行，以便对模型进行持续训练。\n\nML 流水线用于连接 ML 解决方案的各个步骤。`Kubeflow`\
  \ 是一个机器学习工具包，它提供了一个名为 `Kubeflow Pipelines` 的流水线解决方案，构建在 `Kubernetes` 之上。Google 推出了\
  \ `Vertex AI Pipelines`，因为维护 `Kubernetes` 可能具有挑战性且耗时。它是一个用于运行流水线的无服务器产品，因此您的机器学习团队可以专注于他们的本职工作：ML。\n\
  \n##### 使用 Vertex AI Pipelines 编排 ML 工作流\n\n`Vertex AI Pipelines` 是一项托管服务，它通过以无服务器方式编排您的\
  \ ML 工作流并使用 `Vertex ML Metadata` 存储工作流的工件，帮助您自动化、监控和治理 ML 系统。通过将 ML 工作流的工件存储在 `Vertex\
  \ ML Metadata` 中，您可以分析工作流工件的血缘关系，例如用于创建模型的训练数据、超参数和代码。`Vertex AI Pipelines` 可以运行使用\
  \ `Kubeflow Pipelines SDK` v1.8.9 或更高版本或 `TensorFlow Extended` v0.30.0 或更高版本构建的流水线。\n\
  \n对于 `TensorFlow`，请使用 `TensorFlow Extended` 来定义您的流水线及每个步骤的操作，然后在 `Vertex AI` 的无服务器流水线系统上执行它。\n\
  \n对于所有其他框架，请将 `Kubeflow Pipelines` 与 `Vertex AI Pipelines` 结合使用。使用 `Vertex AI` 来启动平台并与其交互。\n\
  \n这会产生两个结果：\n\n*   您可以使用流水线，而无论您选择哪种 ML 环境。\n*   您只需要少量配置适度 CPU 和内存的节点，因为大部分工作将在托管服务中完成。\n\
  \n##### 使用 Kubeflow Pipelines 进行灵活的流水线构建\n\n`Kubeflow` 是一个开源 `Kubernetes` 框架，用于开发和运行可移植的\
  \ ML 工作负载。`Kubeflow Pipelines` 是一项 `Kubeflow` 服务，可让您组合、编排和自动化 ML 系统。您可以选择在本地、本地部署或云环境（如\
  \ `Google Cloud` 或其他云平台）中部署 `Kubernetes` 工作负载。`Kubeflow Pipelines SDK` 推荐给大多数想要编写托管流水线的用户。`Kubeflow\
  \ Pipelines` 灵活多变，让您可以使用简单的代码构建流水线，并提供 `Google Cloud Pipeline Components`，允许您在流水线中包含\
  \ `AutoML` 等 `Vertex AI` 功能。\n\n`Kubeflow Pipelines` 通过执行所需的 `Google Cloud` 服务，让您能够编排和自动化生产级\
  \ ML 流水线。在图 5.2 中，`Cloud SQL` 作为 `Kubeflow Pipelines` 的 ML 元数据存储。\n\n![FIGURE 5.2\
  \ Kubeflow Pipelines and Google Cloud managed services](img/c05f002.png)\n\n**图\
  \ 5.2** Kubeflow Pipelines 和 Google Cloud 托管服务\n\n`Kubeflow Pipelines` 组件不仅限于在 `Google\
  \ Cloud` 上执行 `TensorFlow Extended (TFX)` 相关服务。这些组件可以执行用于 `Spark` ML 作业的 `Dataproc`、`AutoML`\
  \ 和其他计算工作负载。\n\n##### 使用 TensorFlow Extended SDK 利用预构建组件处理常见步骤\n\n`TensorFlow` 为\
  \ `Vertex AI` 工作流中的常见步骤（如数据摄取、数据验证和训练）提供预构建组件。`TFX` 提供了一系列框架、库和组件，用于在生产环境中定义、启动和监控机器学习模型。如果满足以下任一条件，建议使用\
  \ `TensorFlow Extended SDK`：\n\n*   您已经在使用 `TensorFlow`。\n*   您使用结构化数据和文本数据。\n*\
  \   您处理大量数据。\n\n我们在第 3 章“特征工程”中介绍了 `TFX` 流水线的 `Google Cloud` 实现。另请参阅此页面：\n\n`https://neptune.ai/blog/deep-dive-into-ml-models-in-production-using-tfx-and-kubeflow`\n\
  \n##### 何时使用哪种流水线\n\n`Vertex AI Pipelines` 可以运行使用 `Kubeflow Pipelines SDK` v1.8.9\
  \ 或更高版本或 `TensorFlow Extended` v0.30.0 或更高版本构建的流水线。\n\n如果您在处理 TB 级结构化数据或文本数据的 ML\
  \ 工作流中使用 `TensorFlow`，我们建议您使用 `TFX` 构建流水线。默认情况下，`TFX` 会创建 ML 流水线的有向无环图 (DAG)。它在底层使用\
  \ `Apache Beam` 来管理和实现流水线，并且可以轻松地在 `Apache Spark`、`Google Cloud Dataflow` 和 `Apache\
  \ Flink` 等分布式处理后端上执行。\n\n虽然在 `Cloud Dataflow` 上运行 `Apache Beam` 的 `TFX` 很酷，但配置、监控和维护已定义的流水线和工作流却很困难。这催生了我们称为*编排器*的工具。\n\
  \n像 `Kubeflow` 这样的编排器使配置、操作、监控和维护 ML 流水线变得容易。它们大多附带易于理解的 GUI。您可以使用 `Kubeflow Pipelines`\
  \ 来调度和编排 `TFX` 流水线。\n\n对于其他用例，我们建议您使用 `Kubeflow Pipelines SDK` 构建流水线。\n\n虽然您可以考虑其他编排器，如\
  \ `Cloud Composer`（请参阅 Apache `Airflow`），但 `Vertex AI Pipelines` 是更好的选择，因为它内置了对常见\
  \ ML 操作的支持，并跟踪特定于 ML 的元数据和血缘关系。血缘关系对于验证流水线在生产环境中是否正常运行尤为重要。\n\n#### 服务\n\n在训练、评估和调优机器学习\
  \ (ML) 模型后，该模型将被部署到生产环境以进行预测。ML 模型可以通过两种方式提供预测：离线预测和在线预测。\n\n##### 离线或批量预测\n\n当您以批次形式获取数据并运行指向已训练模型的批处理作业以进行离线预测时，您执行的是离线或批量预测。离线或批量处理的一些用例包括推荐、需求预测、细分分析，以及对大批量文本进行分类以确定其所属主题。您可以使用\
  \ `Vertex AI batch prediction` 为存储在 `BigQuery` 或 `Google Cloud Storage` 中的数据运行批量预测作业。\n\
  \n图 5.3 展示了在 `Google Cloud` 上执行离线批量预测的典型高层架构。\n\n![FIGURE 5.3 Google Cloud architecture\
  \ for performing offline batch prediction](img/c05f003.png)\n\n**图 5.3** 用于执行离线批量预测的\
  \ Google Cloud 架构\n\n###### 在线预测\n\n当您向已部署的模型端点发送请求并获得预测响应时，这种预测会近乎实时地发生。这可以是一个部署到\
  \ HTTPS 端点的模型，您可以使用微服务架构从 Web 应用程序或移动应用程序调用此端点。在进行 ML 预测时需要近乎实时响应的用例包括实时竞价和对 Twitter\
  \ 源的实时情感分析。\n\n有两种方式可以进行在线预测，具体说明如下：\n\n*   **同步** 在这种方式中，调用者会等待，直到从 ML 服务接收到预测，然后再执行后续步骤。您可以使用\
  \ `Vertex AI online predictions` 将模型部署为实时 HTTPS 端点。您还可以使用 `App Engine` 或 `GKE` (`Google\
  \ Kubernetes Engine`) 作为 ML 网关，在从客户端应用程序发送请求之前执行一些特征预处理，如图 5.4 所示。\n\n    ![FIGURE\
  \ 5.4 Google Cloud architecture for online prediction](img/c05f004.png)\n\n    **图\
  \ 5.4** 用于在线预测的 Google Cloud 架构\n\n\n\n\n\n##### 异步\n\n在这种方法中，最终用户可能不会直接查询模型端点。最终用户可能会收到通知，或者轮询特征存储或数据存储以实时获取预测。这可以通过以下两种方法发生：\n\
  \n###### 推送\n\n模型生成预测并将它们作为通知推送给最终用户。例如，在欺诈检测中，当识别出潜在的欺诈交易时，如果您想通知其他系统采取行动，则会使用此方法。请参阅图\
  \ 5.5 以供参考。\n\n###### 轮询\n\n模型生成预测并将它们存储在低延迟读取数据库中，例如 NoSQL 数据存储。最终用户定期轮询数据库以获取可用的预测。一个例子是定向营销，系统会实时检查活跃客户的预测倾向评分，以决定是否发送带有促销或挽留优惠的电子邮件。\n\
  \n![图 5.5 在线预测的推送通知架构](img/c05f005.png)\n\n**图 5.5** 在线预测的推送通知架构\n\n最小化延迟以提供预测对于实时用例非常重要。这可以在这两个层面发生：\n\
  \n###### 在模型层面最小化延迟\n\n您需要最小化模型在收到请求时进行预测所需的时间。您可以通过构建更小的模型来最小化延迟，因为它将拥有更少的神经网络层，并且处理预测所需的计算量更少。\n\
  \n您可以使用 Cloud GPU 和 `TPU` 等加速器来提供模型端点服务。通常，只有当您拥有大型深度学习模型和大批次大小时，才会使用 `TPU`。\n\n\
  ###### 在服务层面最小化延迟\n\n这是您最小化系统在收到请求时提供预测所需时间的地方。这包括将输入特征存储在低延迟读取查找数据存储中，在离线批量评分作业中预计算预测，以及缓存预测。\n\
