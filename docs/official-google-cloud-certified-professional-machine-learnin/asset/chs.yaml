  \ 12 章 模型监控、跟踪和审核元数据\n\n在前几章中，您了解了如何收集数据、训练模型、寻找最佳超参数以及部署模型。在本章中，您将了解如何监控已部署的模型、不同的日志记录策略，以及最后如何使用元数据存储来跟踪血缘。\n\
  \n#### 模型监控\n\n您经历了一段漫长的旅程，从 Jupyter Notebook 中的实验到在生产环境中部署模型，现在您正在使用无服务器架构提供预测服务。部署不是此工作流的终点；相反，它是机器学习模型生命周期的第一次迭代。\n\
  \n虽然您的模型在评估指标中得分很高，但您如何知道它在实时数据上表现良好？如果部署后世界发生巨大变化（如改变人类行为的全球大流行病）怎么办？如果输入数据发生不明显的细微变化怎么办？简而言之，您如何知道模型在部署后仍然有效？部署后，模型可能会在一段时间后不再适合其原始用途。\n\
  \n世界是动态的，事物不断变化。然而，机器学习模型是在历史数据上训练的，理想情况下是最近收集的数据。想象一下，模型部署后，环境缓慢但肯定地开始变化；随着时间的推移，您的模型将变得越来越无关紧要。这个概念称为**漂移**。漂移分为两种：**概念漂移**和**数据漂移**。\n\
  \n##### 概念漂移\n\n一般来说，输入变量和预测变量之间存在一种关系，我们试图使用机器学习模型来近似这种关系。当这种关系不是静态的并发生变化时，称为**概念漂移**。这通常是因为模型的底层假设发生了变化。\n\
  \n一个很好的例子是电子邮件垃圾邮件，它占所有发送邮件的大多数。随着垃圾邮件被检测和过滤，发送者会修改邮件以绕过检测过滤器。在这种情况下，对抗性代理试图相互超越并改变其行为。\n\
  \n##### 数据漂移\n\n**数据漂移**是指输入到机器学习模型的输入数据与用于训练模型的数据相比发生了变化。一个例子是统计分布的变化，例如：一个经过训练用于预测客户食物偏好的模型，如果客户人口统计的年龄发生变化，就会失效。\n\
  \n数据漂移的另一个原因可能是数据源处的输入模式发生变化。一个例子是训练数据中不存在的新产品标签 (SKU)。一个更微妙的情况是列的含义发生变化。例如，术语*糖尿病*的含义可能会根据血糖的医学诊断标准随时间而变化。\n\
  \n采取行动应对模型恶化（如漂移）的唯一方法是密切关注数据，这称为**模型监控**。最直接的方法是监控输入数据，并使用训练阶段使用的相同指标持续评估模型。\n\n\
  #### Vertex AI 上的模型监控\n\nVertex AI 作为模型部署的一部分提供模型监控功能。从实际角度来看，可以针对偏差和漂移对模型进行监控：\n\
  \n*   **训练-服务偏差：** 当生产环境中的输入特征分布与训练数据相比存在差异时，可能会影响模型性能。仅当您有权访问原始数据时，才能启用此功能。\n\n\
  *   **预测漂移：** 当生产环境中输入的统计分布随时间变化时，也会影响性能。如果在预测期间无法获得原始训练数据，可以使用预测漂移检测来监控输入。\n\n\
  这两个功能不是互斥的；您可以在 Vertex AI 中同时启用偏差和漂移检测。事实上，您会意识到需要针对每种数据类型检查偏差和漂移，Vertex AI 为分类特征和数值特征提供了此功能。让我们看看这些功能适用的数据类型：\n\
  \n*   **分类特征：** 这些特征具有有限数量的可能值，通常按定性属性分组。示例包括颜色、国家和邮政编码。请参阅 图 12.1 查看示例分布。\n\n \
  \   ![图 12.1 分类特征](img/c12f001.png)\n\n    **图 12.1** 分类特征\n\n*   **数值特征：** 这些特征可以取任意值。示例包括价格\
  \ ($)、速度和距离。请参阅 图 12.2 查看示例分布。\n\n    ![图 12.2 数值特征](img/c12f002.png)\n\n    **图\
  \ 12.2** 数值特征\n\n\n\n\n\n##### 漂移与偏差计算\n\n我们将向您展示如何计算基准分布，然后使用相同的方法计算预测时的分布，并使用比较方法。这些方法将因数据类型而异。\n\
  \n1.  计算基准。\n\n    *   **用于偏差检测的基准：** 训练数据中特征值的统计分布即为基准。\n\n    *   **用于漂移检测的基准：**\
  \ 近期过去在生产环境中观察到的特征值的统计分布即为基准。\n\n        这些如何应用取决于数据类型是分类型还是数值型。用于基准的分布计算如下：\n\n\
  \    *   **分类特征的分布计算：** 每个可能值的实例计数或百分比。\n\n    *   **数值特征的分布计算：** 落入各个桶中的值的计数或百分比。（全范围被划分为等大小的桶。）\n\
  \n2.  使用上述方法计算在生产环境中看到的最新值的统计分布。\n\n3.  Vertex AI 随后将基准与步骤 2 中计算的最新分布进行比较。距离度量的计算如下：\n\
  \n    *   **分类特征：** 基准分布与最新生产分布之间的距离得分使用 L-无穷距离 计算。这是沿任何坐标维度测量的两个向量之间的最大距离。\n\n\
  \    *   **数值特征：** 距离得分使用 Jensen-Shannon 散度 计算。（其数学定义超出了考试范围。）\n\n4.  当距离得分达到配置的阈值时，Vertex\
  \ AI 会将其识别为异常（偏差或漂移）。\n\n##### 启用监控的实际注意事项\n\n有几件事需要牢记，以便有效地监控数据，同时使其具有成本效益：\n\n\
  *   **采样率：** 配置 `预测请求采样率` 以仅获取生产输入的样本。\n\n*   **监控频率：** 配置 `频率` 以设置监控模型记录输入以检测偏差或漂移的速率。这设置了每次运行中分析的已记录数据的监控窗口大小。\n\
  \n*   **告警阈值：** 为您感兴趣的每个特征配置阈值。当基准与生产输入特征分布之间的统计距离超过此阈值时，会生成告警。默认值为 0.3。\n\n*  \
  \ **端点中的多个模型：** 当您在端点上启用并配置偏差或漂移检测时，该配置将应用于部署在该端点后面的所有模型，包括以下内容：\n\n    *   检测类型\n\
  \n    *   采样率\n\n    *   监控频率\n\n###### 输入架构\n\n输入值是预测请求负载的一部分。Vertex AI 应能够解析输入值以进行监控。您可以在配置模型监控时指定架构，以帮助解析此输入。\n\
  \n对于 AutoML 模型，输入架构会自动解析，因此您无需提供。对于不使用键/值输入格式的自定义训练模型，您必须提供一个。\n\n####### 自动架构解析\n\
  \n为偏差或漂移启用模型监控时，通常可以自动解析输入架构。Vertex AI 模型监控将分析前 1,000 个请求以检测架构。如果输入值采用键/值对的形式，这种自动检测的效果最好。此处\
  \ `key` 是特征的名称，实际值紧随冒号之后。请参阅以下以键/值对形式呈现的输入（汽车）示例：\n\n```\n{\"make\":\"Ford\", \"\
  model\":\"focus\": year: \"2011\", \"color\":\"black\"}\n```\n\n####### 自定义架构\n\n\
  为了确保 Vertex AI 正确解析输入值，您可以在所谓的 `分析实例` 中指定架构。分析实例预期为 Open API 架构格式。\n\n以下是预期架构的详细信息：\n\
  \n*   “type” 可以是以下之一：\n\n    *   `object`：键/值对\n\n    *   `array`：类数组格式\n\n    *\
  \   `string`：csv 字符串\n\n*   `Properties`：每个特征的类型。\n\n*   对于 `array 或 csv` 字符串格式，指定特征的顺序。\n\
  \n以下是预测汽车转售价值的模型的输入示例：\n\n```\ntype: object\nproperties:\n  make:\n    type:string\n\
  \  model:\n    type:string\n  year:\n    type:number\n  color:\n    type:string\n\
  \  known_defects:\n    type: array\n    items:\n       type: string\nrequired:\n\
  \ -make\n -model\n -year\n -color\n```\n\n上述架构以 `object` 格式指定。特征 `make`、`model`\
  \ 和 `color` 是字符串特征，`year` 是数字。特征 `known_defects` 是字符串数组。最后一部分告诉您除 `known_defects`\
  \ 外所有特征均为必需。\n\n在 CSV 格式中，您可以通过提供空字段来跳过可选输入特征。例如，假设您期望五个特征：`[\"a\",\"b\",,\"d\"\
  ,\"e\"]`。请注意第三个特征被跳过。第三个缺失特征将被理解为“null”值。\n\n##### 日志记录策略\n\n当您部署模型进行预测时，除了监控输入（即跟踪输入特征的趋势）外，记录请求可能也很有用。在某些领域（如受监管的金融垂直领域），出于未来审计的目的，所有模型都强制要求记录日志。在其他情况下，收集监控数据以更新您的训练数据可能很有用。\n\
  \n在 Vertex AI 中，您可以为 AutoML 表格模型、AutoML 图像模型和自定义训练模型启用预测日志。这可以在模型部署或端点创建期间完成。\n\n\
  ###### 预测日志的类型\n\n您可以启用三种日志以从预测节点获取信息。这三种日志类型相互独立，因此可以独立启用或禁用。\n\n####### 容器日志记录\n\
  \n这会将预测节点的 `stdout` 和 `stderr` 记录到 Cloud Logging。这对于调试您的容器或模型非常有用且相关。了解 GCP 上更大的日志记录平台可能会有所帮助。\n\
  \n####### 访问日志记录\n\n这会将诸如每个请求的时间戳和延迟之类的信息记录到 Cloud Logging。这在 v1 服务端点上默认启用；此外，您在将模型部署到端点时可以启用访问日志记录。\n\
  \n####### 请求-响应日志记录\n\n这会将在线预测请求和响应的样本记录到 BigQuery 表中。这是主要机制。通过它，您可以创建更多数据来增强您的训练或测试数据。您可以在创建预测端点期间启用此功能，也可以稍后更新它。\n\
  \n###### 日志设置\n\n创建端点或将模型部署到端点时，可以更新日志设置。了解日志记录的默认设置很重要。如果您已经使用默认日志设置部署了模型，但想要更改日志设置，则必须取消部署模型，并使用新设置重新部署。\n\
  \n如果您预计模型会有大量请求，除了扩展部署外，还应考虑日志记录的成本。高“每秒查询率”，即 QPS，将产生大量日志。\n\n以下是为图像分类模型配置日志记录的\
  \ `gcloud` 命令示例。请注意最后两行，其中指定了日志记录配置。\n\n\n\n\n```\ngcloud ai endpoints deploy-model\
  \ 1234567890 \\\n  --region=us-central1 \\\n  --model=model_id_12345 \\\n  --display-name=image_classification\
  \ \\\n  --machine-type=a2-highgpu-2g \\\n  --accelerator=count=2,type=nvidia-tesla-t4\
  \ \\\n  --disable-container-logging \\\n  --enable-access-logging\n```\n\n#######\
  \ 模型监控和日志记录\n\n模型监控和请求-响应日志记录在后端使用相同的基础设施（BigQuery 表）。因此，当这两项服务同时涉及时，存在一些限制：\n\n\
  * 如果端点上已启用模型监控，则无法启用请求-响应日志记录。\n* 如果先启用了请求-响应日志记录，然后启用模型监控，则无法修改请求-响应日志记录。\n\n####\
  \ 模型和数据集谱系\n\n当你尝试不同类型的模型时，需要一种有条理的方法来记录实验的参数和相应的观察结果。机器学习实验的参数、工件和指标称为实验的*元数据*。元数据可帮助你执行以下操作：\n\
  \n* 检测部署后的模型性能下降。\n* 比较不同超参数集的有效性。\n* 跟踪机器学习工件（包括数据集和模型）的谱系。谱系有助于查找所有工件的来源，也能从给定的模型/数据集找到派生工件。\n\
  * 使用相同的参数重新运行机器学习工作流。\n* 为审计目的跟踪工件的下游使用情况。这也可用于了解给定工件影响了什么。\n\n##### Vertex ML Metadata\n\
  \n使用 Vertex ML Metadata，你可以记录工件的元数据，并查询元数据以进行分析、调试或审计。Vertex ML Metadata 基于 Google\
  \ TensorFlow Extended 团队开发的开源 ML Metadata (MLMD) 库。\n\nVertex ML Metadata 使用以下数据模型和相关术语：\n\
  \n* **元数据存储区：** 这是所有元数据资源的顶级容器。它是区域级的，且在 Google Cloud 项目范围内。通常，一个元数据存储区由整个组织共享。\n\
  * **元数据资源：** Vertex ML Metadata 使用类图数据模型来表示资源之间的关系。这些资源如下：\n    * **工件：** 工件是由机器学习工作流创建或可被其使用的实体或数据片段。示例包括数据集、模型、输入文件、训练日志和指标。\n\
  \    * **上下文：** 上下文是一组可供查询的工件和执行。假设你正在优化超参数；每个实验将是一个具有自己参数和指标集的不同执行。你可以将这些实验分组到一个上下文中，然后比较该上下文中的指标以确定最佳模型。\n\
  \    * **执行：** 这代表机器学习工作流中的一个步骤，并可附带运行时参数进行标注。示例可以是一个“训练”操作，附带关于耗时和使用的 GPU 数量的标注。\n\
  \    * **事件：** 事件连接工件和执行。诸如工件作为执行的输出和下一个执行的输入等详细信息，可使用事件来捕获。当你试图追踪谱系时，它有助于确定工件的来源。图\
  \ 12.3 显示了一个包含事件、工件、执行和上下文的简单图。\n\n![图 12.3 Vertex Metadata 数据模型](img/c12f003.png)\n\
  \n**图 12.3** Vertex Metadata 数据模型\n\n* **元数据架构：** 元数据架构指定工件或执行等特定类型数据所使用的架构。类型架构使用\
  \ YAML 格式的 OpenAPI 架构对象表示。\n\n###### 管理 ML 元数据架构\n\n存储在 Vertex ML Metadata 中的每个元数据资源都遵循一个称为\
  \ `MetaDataSchema` 的架构。对于存储的最常见资源类型，有称为*系统架构*的预定义架构。系统架构位于 `system` 命名空间下。以下是 YAML\
  \ 格式的预定义模型系统类型示例：\n\n```yaml\ntitle: system.Model\ntype: object\nproperties:\n \
  \ framework:\n    type: string\n    description: \"The ML framework used, eg: 'TensorFlow'\
  \ or 'PyTorch'.\"\n  framework_version:\n    type: string\n    description: \"The\
  \ version used, eg: '1.16' or '2.5'\"\n  payload_format:\n    type: string\n   \
  \ description: \"The format of the model stored: eg: 'SavedModel' or 'pkl'\"\n```\n\
  \n让我们看看两个重要操作：创建工件和查找工件。其他操作（此处未显示）包括删除工件、创建执行和上下文管理。你可以使用 REST、命令行或 Python 来执行这些操作，我们将展示\
  \ Python 示例。以下是在 Python 中创建工件的方法：\n\n```python\ndef create_artifact_sample(\n  \
  \  project: str,\n    location: str,\n    uri: Optional[str] = None,\n    artifact_id:\
  \ Optional[str] = None,\n    display_name: Optional[str] = None,\n    schema_version:\
  \ Optional[str] = None,\n    description: Optional[str] = None,\n    metadata: Optional[Dict]\
  \ = None,\n):\n    system_artifact_schema = artifact_schema.Artifact(\n        uri=uri,\n\
  \        artifact_id=artifact_id,\n        display_name=display_name,\n        schema_version=schema_version,\n\
  \        description=description,\n        metadata=metadata,\n    )\n    return\
  \ system_artifact_schema.create(project=project, location=location)\n```\n\n在此示例中，我们定义了一个新函数，接收\
  \ URI、工件 ID、位置、显示名称、架构版本、描述和元数据（定义元数据本身的属性）等详细信息。在函数内部，我们调用 `artifact_schema.Artifact`\
  \ 函数创建一个系统工件实例，第二步调用 `create()` 函数在元数据存储区中创建它。\n\n在下一个示例中，我们将看到如何查询或查找数据集或模型等工件：\n\
  \n```python\ndef list_artifact_sample(\n    project: str,\n    location: str,\n\
  \    display_name_fitler: Optional[str] = \"display_name=\\\"my_model_*\\\"\",\n\
  \    create_date_filter: Optional[str] = \"create_time>\\\"2022-06-11\\\"\",\n):\n\
  \    aiplatform.init(\n        project=project,\n        location=location)\n  \n\
  \    combined_filters = f\"{display_name_fitler} AND {create_date_filter}\"\n  \
  \  return aiplatform.Artifact.list(filter=combined_filters)\n```\n\n我们在这里使用类似的方法，定义一个名为\
  \ `list_artifact_sample` 的函数来完成这项工作。这也只有三行代码，第一行是 `init()` 函数，第二行创建一个 `combined_filters`\
  \ 查询。第三行我们使用 `combined_filters` 字符串作为参数调用 `aiplatform.Artifact.list()` 函数。这些代码块和更多信息可以在\
  \ `https://cloud.google.com/vertex-ai/docs/ml-metadata/managing-metadata` 的文档中找到。\n\
  \n###### Vertex AI Pipelines\n\n当你使用 Vertex AI Pipelines 时，模型元数据和工件会自动存储在元数据存储区中，用于*谱系跟踪*。每当你运行一个流水线，它都会生成一系列工件。这些可能包括数据集摘要、模型评估指标、特定流水线执行的元数据等。Vertex\
  \ AI Pipelines 还提供谱系的可视化表示，如图 12.4 所示。你可以用它来了解模型基于哪些数据构建、部署了哪个模型版本，并按数据架构和日期排序。\n\
  \n![图 12.4 显示谱系的 Vertex AI Pipelines](img/c12f004.png)\n\n**图 12.4** 显示谱系的 Vertex\
  \ AI Pipelines\n\n##### Vertex AI Experiments\n\n\n\n\n##### Vertex AI Experiments\n\
  \n在开发机器学习模型时，目标是为用例找到最佳模型。您可以尝试各种不同的库、算法、模型架构、超参数等。Vertex AI Experiments 可帮助您跟踪这些试验，并分析不同的变体。\n\
  \n具体而言，Vertex AI Experiments 可帮助您：\n\n* 跟踪实验运行的步骤（如预处理、嵌入、训练等）\n* 跟踪输入，如算法、超参数、数据集等\n\
  * 跟踪这些步骤的输出，如模型、指标、检查点等\n\n基于上述信息，您可以了解什么有效，并选择探索的方向。Google Cloud 控制台提供了一个统一的视图来查看您的实验，您可以在其中对实验运行的结果进行切片分析，并深入查看单次运行的结果。使用\
  \ Vertex AI SDK for Python，您可以访问实验、实验运行、实验运行参数、指标和工件。结合 Vertex ML Metadata 使用时，您可以跟踪工件并查看谱系。\n\
  \n##### Vertex AI Debugging\n\n有时在训练模型时，您会遇到问题，并怀疑 GPU 未被高效利用，或者权限问题限制了对数据的访问。要调试这类问题，Vertex\
  \ AI 允许您直接连接到运行训练的容器。为此，请按以下步骤操作：\n\n1. 在训练容器中安装交互式 Bash shell。预构建容器中已预装 Bash shell。\n\
  2. 运行支持交互式 shell 的自定义训练。\n3. 确保用户拥有正确的权限。如果您使用的是服务帐号，请确保服务帐号拥有正确的权限。\n4. 将 `enableWebAccess`\
  \ API 字段设置为 true 以启用交互式 shell。\n5. 导航到您启动自定义训练作业时 Vertex AI 提供的 URI。\n6. 使用交互式 shell\
  \ 执行以下操作：\n    1. 检查 Vertex AI 用于训练代码的服务帐号的权限。\n    2. 使用 py-spy 等分析工具可视化 Python\
  \ 执行情况，您可以使用 pip3 安装它。\n    3. 使用 perf 分析训练节点的性能。\n    4. 检查 CPU 和 GPU 使用情况。\n\n\
  #### Summary\n\n在本章中，我们探讨了构建和部署模型之外的步骤。这包括监控已部署的模型，以检测是否存在性能下降。随后，我们还了解了 Vertex\
  \ AI 中可用的各种日志记录策略。最后，在构建多个模型时，我们了解了如何使用 Vertex ML Metadata 跟踪模型谱系，以及如何使用 Vertex\
  \ AI Experiments 进行跟踪。\n\n#### Exam Essentials\n\n* **了解模型监控。** 理解部署后监控模型性能的必要性。主要有两种类型的下降：数据漂移和概念漂移。学习如何持续监控输入的这些变化。\n\
  * **学习日志记录策略。** 部署后的日志记录对于跟踪部署情况（包括性能）以及创建新的训练数据至关重要。学习如何在 Vertex AI 中使用日志记录，并结合模型监控。\n\
  * **了解 Vertex ML Metadata。** ML 元数据可帮助您跟踪模型和其他工件的谱系。Vertex ML Metadata 是一种在 GCP\
  \ 上存储和访问元数据的托管解决方案。学习数据模型以及创建和查询元数据的基本操作。\n\n#### Review Questions\n\n1. 您花费数月时间微调模型，根据测试数据评估，模型表现非常好。您部署了模型，但随着时间的推移，您注意到模型准确率很低。发生了什么，您应该怎么做？（选择两项。）\n\
  \    1. 什么也没发生。只是暂时的故障。\n    2. 您需要启用监控，以确定输入数据是否已从训练/测试数据发生漂移。\n    3. 丢弃模型并使用更高的准确率阈值重新训练。\n\
  \    4. 从输入流收集更多数据并用其创建训练数据，然后重新训练模型。\n\n2. 您花费数月时间微调模型，根据测试数据评估，模型表现非常好。您部署了模型，根据初步评估，它在实时数据上也表现良好。您仍然需要监控部署吗？\n\
  \    1. 不需要，因为它在测试数据上表现非常好。\n    2. 不需要，因为它在测试数据上表现良好，且在初步评估的实时数据上也表现良好。\n    3.\
  \ 需要。无论模型在测试数据上表现多好，监控模型都是必要的。\n    4. 不需要，因为成本限制。\n\n3. 以下哪两项是漂移类型？\n    1. 数据漂移\n\
  \    2. 技术漂移\n    3. 缓慢漂移\n    4. 概念漂移\n\n4. 您训练了一个回归模型来预测树木的寿命，输入特征之一是树高。模型部署后，您发现看到的树木平均高度与您的输入数据相差两个标准差。这是什么类型的漂移？\n\
  \    1. 数据漂移\n    2. 技术漂移\n    3. 缓慢漂移\n    4. 概念漂移\n\n5. 您训练了一个分类模型来预测欺诈交易，并获得了很高的\
  \ F1 分数。模型初次部署时效果良好，但一年后，您的模型无法捕捉欺诈。这是什么类型的漂移？\n    1. 数据漂移\n    2. 技术漂移\n    3.\
  \ 缓慢漂移\n    4. 概念漂移\n\n6. 当训练数据与生产环境数据之间的输入特征分布存在差异时，这叫什么？\n    1. 分布漂移\n    2.\
  \ 特征漂移\n    3. 训练-服务偏差\n    4. 概念漂移\n\n7. 当生产数据中输入特征的统计分布随时间变化时，在 Vertex AI 中这叫什么？\n\
  \    1. 分布漂移\n    2. 预测漂移\n    3. 训练-服务偏差\n    4. 概念漂移\n\n8. 您训练了一个分类模型，利用显微镜拍摄的海水图像预测浮游生物数量，以测量海洋中的浮游生物含量。模型部署后，您发现平均浮游生物数量比训练数据相差一个数量级。后来您调查发现，这是因为训练数据中显微镜的放大倍数不同。这是什么类型的漂移？\n\
  \    1. 数据漂移\n    2. 技术漂移\n    3. 缓慢漂移\n    4. 概念漂移\n\n9. 检测训练-服务偏差需要什么？（选择两项。）\n\
  \    1. 训练数据中输入特征的基准统计分布\n    2. 生产数据中输入特征的基准统计分布\n    3. 训练数据中特征的持续统计分布\n    4.\
  \ 生产数据中特征的持续统计分布\n\n10. 检测预测漂移需要什么？（选择两项。）\n    1. 训练数据中输入特征的基准统计分布\n    2. 生产数据中输入特征的基准统计分布\n\
  \    3. 训练数据中特征的持续统计分布\n    4. 生产数据中特征的持续统计分布\n\n11. Vertex AI 中用于分类特征的距离分数是什么？\n\
  \    1. L-无穷范数距离\n    2. 分类值随时间出现的次数统计\n    3. Jensen-Shannon 散度\n    4. 分类值不同时间的归一化百分比\n\
  \n12. 您在端点上部署了模型并启用了监控。您想降低成本。以下哪项是有效的方法？\n    1. 定期关闭监控以省钱。\n    2. 将采样率降低到适当水平。\n\
  \n\n\n\n\n### 第 13 章  \n\n#### 维护机器学习解决方案\n\n在前几章中，您学习了模型训练、部署策略以及已部署模型的监控。在本章中，我们将讨论之前未涉及但对于创建成熟的机器学习解决方案并对其进行维护至关重要的一些概念。\n\
  \n这包括重训练策略、MLOps 成熟度（第 0、1、2 级），以及一种常见的设计模式，它解决了随着 MLOps 成熟而频繁出现的问题。\n\nMLOps 是将\
  \ DevOps 原则应用于机器学习运营。这为管理运营的 ML 工程师提供了架构和策略指导。在本章中，您将了解到 MLOps 并非“一刀切”的方法，而是一种基于组织采用机器学习成熟度的分级方法。\n\
  \n稍后我们还将讨论 ML 工程师在实施 MLOps 时面临的两个重要问题。首先，确定 ML 模型的重训练策略并使其与组织目标保持一致，随后介绍一种用于模型版本控制的有用约定。其次，组织在特征工程上投入巨大，将机器学习扩展到内部多个团队所面临的复杂性。这两个问题均可通过我们描述为设计模式的解决方案来解决。\n\
  \n#### MLOps 成熟度\n\n组织会经历一个历程：从尝试机器学习技术开始，然后逐步将持续集成/持续部署（CI/CD）的概念引入机器学习。将 DevOps\
  \ 原则应用于机器学习被称为 MLOps。\n\n虽然 MLOps 和 DevOps 之间存在相似之处，但也存在一些关键差异。\n\n我们发现，组织首先通过手动训练模型来尝试机器学习，然后使用流水线为该过程带来自动化；随后，随着完全实现自动化，它们进入转型阶段。它们经历的这三个阶段使用不同的技术，并反映了其“AI\
  \ 就绪度”。\n\n在详细了解这些阶段之前，让我们先看看 ML 的步骤：\n\n1.  数据 \n    1.  **提取：** 从不同来源收集数据，聚合数据，并使其可供下游\
  \ ML 流程使用。\n    2.  **分析：** 对收集的数据执行探索性数据分析（EDA），以了解模式、统计分布和关系。确定将要执行的特征工程和数据准备要求。\n\
  \    3.  **准备：** 对数据应用转换和特征工程。将数据拆分为训练集、测试集和验证集，用于 ML 任务。\n\n2.  模型 \n    1.  **训练：**\
  \ 使用输入数据设置 ML 训练，并预测输出。尝试不同的算法和超参数，以确定表现最佳的模型。\n    2.  **评估：** 使用保留集评估模型，并根据预定义的指标评估模型质量。\n\
  \    3.  **验证：** 验证模型是否符合部署条件，即指标是否满足特定的基线性能标准。\n\n3.  部署 \n    1.  **服务：** 部署模型以提供在线或批量预测。对于在线预测，为模型创建并维护\
  \ RESTful 端点，并根据需求配置扩展。这也可能包括进行批量预测。\n    2.  **监控：** 部署后持续监控模型，以检测异常、漂移和偏差。\n\n\
  我们在前几章中已经了解了所有这些步骤，因此您应该对它们很熟悉。这些步骤的自动化程度定义了 MLOps 的成熟度。Google 将 MLOps 定义为具有三个级别：MLOps\
  \ 第 0 级（手动阶段）、MLOps 第 1 级（战略自动化阶段）和 MLOps 第 2 级（CI/CD 自动化，转型阶段）。\n\n##### MLOps\
  \ 第 0 级：手动/战术阶段\n\n开始尝试 ML 的组织处于此阶段。在此阶段，重点是构建概念验证并测试一些 AI/ML 用例。其目的是验证一些关于如何利用\
  \ ML 改进业务的想法。\n\n在此阶段，通常有一个个人或团队在进行实验和训练模型。他们工作的成果是模型，该模型通过模型注册表（如图 13.1 所示）移交给发布或部署团队。然后部署团队获取该模型并将其部署以提供预测服务。\n\
  \n![图 13.1 MLOps 第 0 级步骤](img/c13f001.png)\n\n**图 13.1** MLOps 第 0 级步骤\n\n######\
  \ 第 0 级的关键特性\n\n让我们看看此战术阶段流程的关键点：\n\n1.  **手动：** 所有步骤均无自动化。每个任务均为手动执行，包括数据分析、准备、训练和验证。其中大部分步骤在数据科学家的\
  \ Jupyter Notebook 中完成，这并不奇怪。\n\n2.  **ML 与 MLOps 之间的分离：** 服务模型的数据科学家和工程师完全分离，唯一的联系点是模型移交。即使是移交，也可能只是将模型文件存储在存储位置供部署团队获取，或者稍成熟的团队可能会使用模型注册表进行移交。这种分离对检测训练-服务偏差产生负面影响。\n\
  \n\n\n\n\n##### MLOps 第 0 级：手动流程阶段\n\n3. **手动迭代：** 由于此阶段训练是手动进行的，因此重新训练没有规律性，导致该流程无法扩展到几个以上的模型。\n\
  \n4. **持续集成：** 测试通常仅作为 Jupyter Notebooks 的一部分进行，除此之外，CI 甚至不在考虑范围内。\n\n5. **持续部署：**\
  \ 这些模型不经常更新，因此 CD 没有得到太多重视。\n\n6. **预测服务部署：** 此处的部署通常是模型的微服务，通过 REST API 进行调用，而不是部署整个\
  \ ML 系统。\n\n7. **监控：** 通常，此流程不考虑监控或模型退化。\n\n###### 挑战\n\n此阶段最重要的挑战是模型退化。由于训练数据与真实数据之间的差异，训练良好的模型在现实生活中经常表现不佳。缓解这些问题的唯一方法是主动监控预测质量，频繁重新训练模型，并频繁尝试新的算法或模型实现，以利用技术改进带来的优势。\n\
  \n##### MLOps 第 1 级：战略自动化阶段\n\n处于此阶段的组织通常已确定业务目标，并将 ML 确定为解决某些问题的优先事项。此阶段涉及使用流水线来自动化模型的持续训练和模型预测服务的持续交付。实现这一点需要新的服务，包括自动化的数据和模型验证步骤、流水线触发器、特征存储和元数据管理，如\
  \ 图 13.2 所示。\n\n![图 13.2 MLOps 第 1 级或战略阶段](img/c13f002.png)\n\n**图 13.2** MLOps\
  \ 第 1 级或战略阶段\n\n在此阶段，有基础设施支持团队间共享工件，并且开发环境和生产环境有明确的区分。ML 模型的开发发生在编排环境中。数据流水线的源代码存储在中央代码库中，模型训练实现了自动化。\n\
  \n###### MLOps 第 1 级的关键特性\n\n此阶段具有一些独特的特性，使其比第 0 级更成熟，我们将在此列出：\n\n1. **实验：** 实验阶段的每个步骤都经过编排。由于步骤之间的转换是自动化的，因此加快了实验迭代的速度。\n\
  \n2. **持续训练：** 模型在生产环境中自动训练，由新数据触发。\n\n3. **实验-运营对称性：** 用于创建实验流水线的代码也用于生产环境，这与统一\
  \ MLOps 的最佳实践非常吻合。\n\n4. **模块化组件：** 用于创建流水线的每个组件都应可复用、可组合且可共享。\n\n5. **持续交付：** 由于生产流水线是自动化的，因此可以基于新数据构建新模型并交付用于预测服务。\n\
  \n6. **流水线部署：** 在第 1 级，你部署的是一个通过执行来创建模型的流水线。\n\n###### 挑战\n\n在此阶段，预期团队仅管理少量流水线。此外，新流水线是手动部署的。流水线主要在数据发生变化时触发。当你基于新的\
  \ ML 思路部署模型时，这并不理想。例如，此方法适合使用新特征重新训练模型。然而，如果你想使用现有流水线中不包含的技术，则必须手动部署。要做到这一点，你需要创建\
  \ CI/CD 设置来自动化 ML 流水线的构建/测试/部署。\n\n##### MLOps 第 2 级：CI/CD 自动化，变革阶段\n\n这是处于变革阶段的组织所期望的成熟度级别，此时组织利用\
  \ AI 进行创新并提供敏捷性。通常，你可以期望 ML 专家成为产品团队的一部分，并分布在各个业务单元中。数据集通常可跨孤岛访问，ML 项目在产品组之间共享。如\
  \ 图 13.3 所示，整个流水线都经过 CI/CD 自动化（不仅仅是模型）。因此，如果你想将库从 TensorFlow 2.1 更新到 TensorFlow\
  \ 2.5，它将自然地经过 CI/CD 自动化步骤，而无需手动操作。\n\n![图 13.3 MLOps 第 2 级，变革阶段](img/c13f003.png)\n\
  \n**图 13.3** MLOps 第 2 级，变革阶段\n\n###### 第 2 级的关键特性\n\n进入第 2 级的显著特征是完全采用 CI/CD 模型。让我们详细了解一下一些特性：\n\
  \n1. **流水线：** 第一阶段是新 ML 算法的开发和实验，可能使用新库。输出是通过代码库共享的流水线源代码。从那时起，自动化接管一切，从构建流水线代码、对流水线代码运行各种测试、创建流水线代码的工件（如包、可执行文件等），随后部署此流水线并生成模型工件。训练好的模型自动部署以实现持续交付。部署后启用监控，收集监控数据以创建更多训练数据并自动触发训练。\n\
  \n2. **测试：** 测试是流水线持续集成的必要条件，从测试特征工程逻辑、模型训练收敛性检查、检查模型输出中的错误（如 NaN 值）、验证每个阶段创建的工件，以及流水线组件之间的集成测试开始。\n\
  \n3. **交付：** 为了实现持续交付，你需要验证模型与服务环境中的软硬件基础设施的兼容性。测试预测服务是否符合 API 模式、负载测试等。此外，根据特定模型的需求，你还可以在完全推出之前使用蓝绿部署、金丝雀部署或影子部署策略。\n\
  \n总之，维护 ML 解决方案不仅仅是训练模型并在 API 后面部署单个模型。它意味着自动化模型的重新训练、测试和部署的能力。由于机器学习领域几乎每天都在见证技术的快速进步，因此拥有管理这种变化的能力非常重要。\n\
  \n然而，并非每个组织在旅程开始时都必须达到第 2 级。这取决于组织使用 AI/ML 的成熟度，随着组织思维的成熟，自动化也随之而来。\n\n在前面的章节中，我们详细讨论了重新训练模型，甚至持续训练和部署方法论。在这一过程中存在一些常见场景和实际问题，我们将在下一节中将其中两个作为设计模式进行解决。\n\
  \n#### 重新训练和版本控制模型\n\n你已经部署了一个模型，并正在监控预测偏移。现在，我们知道模型性能会随时间退化，这可以从监控数据中测量出来。然而，在什么时间点重新训练模型？这不仅仅是一个出于好奇的问题，而是一个必须回答的问题，以便配置持续训练流水线。\n\
  \nVertex AI 模型监控为你提供了监控偏移检测和训练-服务偏差的能力。在监控性能时，收集这些真实数据也很重要。这将用于模型评估以及创建新的训练数据集。那么，我们何时使用这个训练数据集来训练新模型？或者我们的重新训练频率是多少？\n\
  \n##### 重新训练的触发器\n\n\n\n\n\n#### 模型性能与重新训练策略\n\n模型性能通常会随时间推移而下降。为了解决这个问题，我们需要重新训练模型。其思路是根据策略触发重新训练流水线。以下是几种可用的策略：\n\
  \n*   **绝对阈值：** 您可以设置一个用于重新训练的绝对阈值。例如，每当准确率降至 90% 以下时，即可触发重新训练。确定该绝对阈值取决于您的用例。\n\
  *   **降级速率：** 每当性能突然下降时，您可以触发重新训练。例如，如果您发现一天内准确率下降超过 2%，则可以触发重新训练。\n\n现在考虑到上述策略，有几个主要要点需要考量：\n\
  \n*   **训练成本：** 训练模型是有成本的。频繁训练模型可能代价高昂。因此，重要的是确保策略不会频繁触发重新训练。\n*   **训练时间：** 有些模型只需几分钟即可训练完成，但其他模型可能需要数周。在等待新训练模型的过程中，已部署的模型可能会进一步降级。\n\
  *   **延迟训练：** 如果阈值设置得太低，在新模型部署之前，模型可能已经降级太多。这不仅会影响机器学习服务的性能，还会显示出机器学习性能的不一致性，而最终用户可能无法容忍这一点。\n\
  *   **定时训练：** 一种简单得多的策略是按固定时间表进行重新训练。这将定期纳入新数据，且成本可预测。\n\n##### 模型版本控制\n\n当您构建多个模型并与其他团队共享时，拥有某种查找它们的方法非常重要。一种方法是使用元数据来识别工件；然而，组织外部的用户通过\
  \ API 访问已部署的模型，对他们来说，元数据存储可能不可访问。这就是版本控制可以发挥作用的地方。\n\n拥有多个模型的问题在于，当用户通过 API 访问时，他们期望模型具有特定的性能和行为。如果同一\
  \ API 的行为突然发生变化，会导致意外的中断。然而，模型更新或变更是必要的。例如，假设有一个模型用于识别图像中的物体和人类，并能准确检测所有人脸。后来，假设您更新了该模型，使其现在也具备检测狗和其他宠物的能力；这可能会导致中断。在这种情况下，用户需要有能力选择旧模型。\n\
  \n解决方案是使用模型版本控制。模型版本控制允许您将额外的模型部署到现有模型中，并能够使用版本 ID 进行选择。在这种情况下，最终用户可以通过指定版本来访问这两个模型。这解决了向后兼容性问题；即，这非常适用于具有相同输入和输出的模型。\n\
  \n对于行为方式不同的模型（例如具有提供模型解释能力的模型），它们可以作为新模型部署（而不是作为现有模型的新版本）。\n\n在这两种情况下，都应该能够使用 REST\
  \ 端点单独且方便地访问这些模型。在所有已部署的模型版本上启用监控，使您能够比较不同版本。\n\n#### 特征存储\n\n特征工程是构建优秀机器学习模型能力的重要因素。然而，观察发现，实际上特征工程比尝试机器学习模型更加耗时。因此，一个经过精心设计的有价值特征为整个机器学习解决方案提供了巨大价值。\n\
  \n因此，特征工程是任何组织的一项巨大投资。为了优化模型，许多团队致力于创建新特征。有时这些特征对其他团队也很有价值。不幸的是，共享这些特征很棘手，因此相同的特征工程任务会一遍又一遍地重复进行。这会产生几个问题：\n\
  \n*   **不可复用：** 特征是临时创建的，并非旨在供他人使用。每个团队创建特征的目的仅在于自用。这些临时特征未在流水线中自动化，有时源自其他昂贵的数据预处理流水线。\n\
  *   **治理：** 创建这些特征的方法来源多样，给数据治理带来了非常复杂的局面。\n*   **跨团队协作：** 由于这些特征具有临时性且不共享，团队之间产生了更多隔阂，并继续各自为政。\n\
  *   **训练与服务差异：** 当特征临时构建且未自动化时，会导致训练数据和服务数据之间存在差异，从而降低机器学习解决方案的有效性。\n*   **特征产品化：**\
  \ 虽然这些临时特征在实验期间很有用，但由于缺乏自动化以及对特征低延迟检索的需求，它们无法实现产品化。\n\n##### 解决方案\n\n解决方案是拥有一个中心位置来存储特征以及关于特征的元数据，以便在数据工程师和机器学习工程师之间共享。这还允许将软件工程的版本控制、文档编制和访问控制原则应用于这些特征。\n\
  \n特征存储还有两个关键特性：快速处理大型特征集的能力，以及以低延迟访问特征以进行实时预测、以及批量访问以进行训练和批量预测的能力。\n\n`Feast` 是由\
  \ Google 和 Gojek 创建的开源特征存储，可作为软件下载获得。`Feast` 的设计采用了 `Redis` 和 Google Cloud 服务 `BigQuery`\
  \ 及 `Apache Beam`。Google Cloud 还提供了一项名为 `Vertex AI Feature Store` 的托管服务，可根据您的需求动态扩缩。\n\
  \n##### 数据模型\n\n我们现在将讨论 `Vertex AI Feature Store` 服务使用的数据模型。它使用时间序列模型来存储所有数据，这使您能够管理随时间变化的数据。`Vertex\
  \ AI Feature Store` 中的所有数据都按层级排列，顶层称为特征存储。此特征存储是一个容器，可以包含一个或多个实体类型，代表特定类型的特征。在您的实体类型中，您可以存储相似或相关的特征。\n\
  \n*   `Featurestore` → `EntityType` → `Feature`\n\n例如，表 13.1 包含棒球击球手的数据。第一步是创建一个名为\
  \ `baseballfs` 的特征存储。\n\n**表 13.1** 棒球击球手数据表\n\n| 行 | | `player_id` | | `Team` |\
  \ | `Batting_avg` | | `Age` | |\n| --- | --- | --- | --- | --- | --- | --- | ---\
  \ | --- | --- |\n| 1 | | `player_1` | | `RedSox` | | `0.289` | | `29` | |\n| ---\
  \ | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| 2 | | `player_2` |\
  \ | `Giants` | | `0.301` | | `32` | |\n| 3 | | `player_3` | | `Yankees` | | `0.241`\
  \ | | `35` | |\n\n然后，您可以创建一个名为 `batters` 的 `EntityType`，并将列标题 `player_id` 映射到该实体。接着，您可以将\
  \ `team`、`batting_avg` 和 `age` 作为特征添加到此 `EntityType` 中。\n\n此处 `player_1` 和 `player_2`\
  \ 是此 `EntityType` 中的实体。实体必须始终唯一，且必须始终为 `String` 类型。\n\n`RedSox`、`Giants` 和 `Yankees`\
  \ 是特征存储中的特征值。\n\n##### 摄取与服务\n\n`Vertex AI Feature Store` 支持批量和流式摄取。一种典型的方法是将特征存储在\
  \ `BigQuery` 中，然后摄取到特征存储中。\n\n对于从特征存储检索特征，有两种方法：批量和在线。批量方法用于模型训练阶段，在线方法用于在线推理。当您请求时间\
  \ `t` 的数据时，`Vertex AI Feature Store` 返回时间 `t` 或之前的值。\n\n#### Vertex AI 权限模型\n\n\n\
  \n\n管理对数据集、模型等各种不同资源的访问，以及提供执行训练、部署和监控等各种操作的权限至关重要。身份与访问管理 (IAM) 是强制执行此操作的机制。请参阅\
  \ 第 6 章“构建安全的 ML 流水线”，了解关于 IAM 的讨论。\n\n您可能已经有 GCP IAM 模型的经验——例如在 Compute Engine\
  \ 或 Google Cloud Storage 中——这将派上用场。\n\n强调遵循最佳实践以使用 IAM 安全性非常重要。以下是一些高层级要点：\n\n*\
  \   **最小权限：** 限制用户和应用仅执行必要的操作。\n*   **管理服务账号和服务账号密钥：** 积极管理这些安全资产并定期检查它们。\n*   **审计：**\
  \ 启用审计日志并使用 Cloud Logging 角色。\n*   **策略管理：** 使用更高层级的检查，确保策略在每个层级得到实施。\n\n有关 IAM\
  \ 最佳实践的更多详细信息，请参阅此网址：\n\n`https://cloud.google.com/blog/products/identity-security/iam-best-practice-guides-available-now`\n\
  \n我们了解了通用的 IAM 最佳实践，现在将了解 Vertex AI 的一些特殊情况。\n\n##### 自定义服务账号\n\n当您运行 Vertex AI\
  \ 训练作业时，它会使用 Google 为您的 Google Cloud 项目自动创建的几个*服务账号*之一。然而，这些服务账号可能拥有超出需求的权限，例如访问\
  \ BigQuery 和 GCS 的权限。最好使用仅具有所需权限集的自定义服务账号。\n\n##### Vertex AI 中的访问透明度\n\n要验证谁在访问您的内容以及访问了什么内容，您需要日志。在许多领域，对此类日志记录有法律和合规性要求。重要的是，它还为您提供访问日志，记录\
  \ Google 人员在您项目中的操作。有两种类型的访问日志。*Cloud Audit 日志* 是您组织中用户的日志。*Access Transparency\
  \ 日志* 是 Google 人员的日志。大多数服务都支持此功能，但有一些功能不在覆盖范围内。\n\n有关支持的服务的完整列表，请参阅此网址：\n\n`https://cloud.google.com/vertex-ai/docs/general/access-transparency`\n\
  \n#### 常见训练和服务错误\n\n在以下部分中，我们将了解训练和服务期间常见的一些错误。了解错误类型将帮助您有效地调试问题。虽然错误取决于所使用的框架，但我们将在本讨论中使用\
  \ TensorFlow 作为框架。\n\n##### 训练时错误\n\n在训练阶段，当您运行 `Model.fit()` 时会看到最相关的错误。当发生以下情况时会出现错误：\n\
  \n1.  输入数据未转换或未编码。\n2.  张量形状不匹配。\n3.  由于实例大小（CPU 和 GPU）导致内存溢出错误。\n\n##### 服务时错误\n\
  \n服务时错误仅在部署期间出现，错误的性质也不同。典型错误如下：\n\n1.  输入数据未转换或未编码。\n2.  发生签名不匹配。\n\n有关 TensorFlow\
  \ 错误的完整列表，请参阅此网址：\n\n`www.tensorflow.org/api_docs/python/tf/errors`\n\n##### TensorFlow\
  \ 数据验证\n\n为了防止和减少这些错误，您可以使用 TensorFlow 数据验证 (TFDV)。TFDV 可以按如下方式分析训练和服务数据：\n\n1.\
  \  计算统计信息\n2.  推断架构\n3.  检测异常\n\n有关完整文档，请参阅此处：\n\n`https://cloud.google.com/vertex-ai/docs/training/monitor-debug-interactive-shell`\n\
  \n##### Vertex AI 调试 Shell\n\nVertex AI 提供了一个交互式 Shell 来调试预构建容器和自定义容器的训练。您可以使用交互式\
  \ Shell 检查训练容器，以调试训练代码或 Vertex AI 配置中的问题。使用它，您可以执行以下操作：\n\n1.  运行跟踪和分析工具。\n2.  分析\
  \ GPU 利用率。\n3.  验证容器的 IAM 权限。\n\n有关完整文档，请参阅此网址：\n\n`https://cloud.google.com/vertex-ai/docs/training/monitor-debug-interactive-shell`\n\
  \n#### 摘要\n\n在本章中，我们探讨了 ML 应用的长期维护。ML 运维或 MLOps 基于维护软件应用的 CI/CD 原则。在此过程中，我们了解了如何自动化训练、部署和监控。模型的重新训练策略是一个重要概念，必须在模型质量和训练成本之间取得平衡。大型企业中出现的另一个重要问题是部门间无法共享特征，这导致了大量的低效。为了解决这个问题，特征存储的概念应运而生，它可以使用开源软件或\
  \ Vertex AI Feature Store 来实现。\n\n#### 考试要点\n\n*   **理解 MLOps 成熟度。** 学习 MLOps 的不同成熟度级别以及它们如何与组织目标相匹配。了解实验阶段的\
  \ MLOps 架构，然后是具有一定自动化的战略阶段，最后是完全成熟的受 CI/CD 启发的 MLOps 架构。\n*   **理解模型版本控制和重新训练触发器。**\
  \ MLOps 中面临的一个常见问题是知道何时触发新的训练。这可能基于模型监控中观察到的模型性能下降，也可能基于时间。重新训练模型时，了解如何将其作为新版本或新模型添加。\n\
  *   **理解特征存储的用途。** 特征工程是一项昂贵的操作，因此使用这些方法生成的特征如果在团队间共享会更有用。Vertex AI Feature Store\
  \ 是一项托管服务，Feast 是 Google 的开源特征存储。\n\n#### 复习题\n\n1.  以下哪项*不是* MLOps 工作流的主要步骤？\n\n\
  \    1.  数据处理，包括提取、分析和准备\n    2.  与第三方软件集成并识别类似模型的进一步用例\n    3.  模型训练、测试和验证\n  \
  \  4.  模型部署、监控和触发重新训练\n\n2.  您是一家历史悠久的零售组织中一个小型 ML 团队的成员，该组织希望开始探索机器学习以预测产品的日销量。在这种情况下，您会实施哪级\
  \ MLOps？\n\n    1.  无 MLOps，将临时构建 ML 模型\n    2.  MLOps 级别 0\n    3.  MLOps 级别 1\n\
  \    4.  MLOps 级别 2\n\n3.  您是一名数据科学家，作为 ML 团队的一员，该团队已为其在线时尚零售店尝试过 ML。您构建的模型将客户与合适尺寸/版型的衣服进行匹配。组织决定大力推进此项工作，您负责领导这项工作。您将在此实施哪级\
  \ MLOps？\n\n    1.  无 MLOps，将临时构建 ML 模型\n    2.  MLOps 级别 0\n    3.  MLOps 级别 1\n\
  \    4.  MLOps 级别 2\n\n4.  您受聘为一家处理照片和图像的大型组织的 ML 工程师。该团队创建模型来识别照片中的物体、人脸和照片方向（以自动旋转），还创建模型来调整照片颜色。该组织还在尝试可以根据文本自动创建图像的新算法。您会推荐哪级\
  \ MLOps？\n\n    1.  无 MLOps，临时构建，因为他们使用新算法\n    2.  MLOps 级别 0\n    3.  MLOps 级别\
  \ 1\n    4.  MLOps 级别 2\n\n5.  MLOps 级别 0 解决什么问题？\n\n    1.  它是临时构建模型，因此不解决任何问题。\n\
  \    2.  它自动化训练，使构建模型成为一个可重复的过程。\n    3.  模型训练是手动的，但在模型移交后部署是自动化的。\n\n\n\n\n####\
  \ 4. 它是从数据到部署的完全自动化。\n\n#### 6. 关于 MLOps 1 级（战略阶段），以下哪项陈述是**错误**的？\n\n1.  由于训练自动化，构建模型成为一个可重复的过程。\n\
  2.  模型训练由新数据自动触发。\n3.  训练好的模型被自动打包和部署。\n4.  流水线经过自动化，可处理新库和新算法。\n\n#### 7. 你是某大型组织\
  \ ML 工程团队的一员，该组织已开始在多个产品中广泛使用 ML。它正在尝试不同的算法，甚至创建自己的新 ML 算法。为了能够扩展，其 MLOps 成熟度级别应是什么？\n\
  \n1.  临时级别是该组织唯一可行的级别，因为它使用自定义算法。\n2.  MLOps 0 级。\n3.  MLOps 1 级。\n4.  MLOps 2 级。\n\
  \n#### 8. 在 MLOps 1 级成熟度（战略阶段）中，什么被移交给部署？\n\n1.  模型文件\n2.  包含模型的容器\n3.  训练模型的流水线\n\
  4.  TensorFlow 或 ML 框架库\n\n#### 9. 在 MLOps 0 级成熟度（战术阶段）中，什么被移交给部署？\n\n1.  模型文件\n\
  2.  包含模型的容器\n3.  训练模型的流水线\n4.  TensorFlow 或 ML 框架库\n\n#### 10. 在 MLOps 2 级中，什么触发构建新模型？\n\
  \n1.  特征存储\n2.  随机触发\n3.  监控检测到的性能下降\n4.  ML 元数据存储\n\n#### 11. 当你设置重新训练模型的触发条件时，应该考虑什么？（选择两项。）\n\
  \n1.  算法\n2.  触发重新训练的频率\n3.  重新训练的成本\n4.  访问数据的时间\n\n#### 12. 基于模型监控数据触发重新训练，应用哪些策略比较合理？（选择两项。）\n\
  \n1.  模型的预测请求量\n2.  模型性能降低至阈值以下\n3.  安全漏洞\n4.  模型性能突然下降\n\n#### 13. 当你训练或重新训练模型时，何时部署新版本（而不是作为新模型部署）？\n\
  \n1.  每次训练模型时，都将其作为新版本部署。\n2.  只有从预训练模型微调而来的模型才获得新版本。\n3.  永不创建新版本，始终创建新模型。\n4.\
  \  当模型具有相似的输入和输出，且用于相同目的时。\n\n#### 14. 以下哪些是使用特征存储的充分理由？（选择两项。）\n\n1.  模型有许多特征。\n\
  2.  有许多工程特征未在团队间共享。\n3.  数据团队创建的特征在服务时不可用，这导致了训练/服务差异。\n4.  模型建立在各种特征之上，包括分类变量和连续变量。\n\
  \n#### 15. Feast *不*使用哪项服务？\n\n1.  BigQuery\n2.  Redis\n3.  Gojek\n4.  Apache Beam\n\
  \n#### 16. Vertex AI Feature Store 数据模型的层级结构是什么？\n\n1.  Featurestore ‐ > EntityType\
  \ ‐> Feature\n2.  Featurestore ‐ > Entity ‐> Feature\n3.  Featurestore ‐ > Feature\
  \ ‐> FeatureValue\n4.  Featurestore ‐> Entity ‐ > FeatureValue\n\n#### 17. Vertex\
  \ AI Feature Store 数据模型层级结构中的最高层级叫什么？\n\n1.  Featurestore\n2.  Entity\n3.  Feature\n\
  4.  EntityType\n\n#### 18. 你在一个小型组织工作，处理结构化数据，并已创建了多个高价值特征。现在你想将这些特征用于机器学习训练，并使这些特征可用于实时服务。你只有一天时间来实施一个好的解决方案，然后转到另一个项目。哪个选项最适合你？\n\
  \n1.  将特征存储在 BigQuery 中并使用 BigQuery Python 客户端检索。\n2.  使用 BigQuery、Redis 和 Apache\
  \ Beam 从头创建一个 Feature Store。\n3.  下载并安装开源 Feast。\n4.  使用 Vertex AI Feature Store。\n\
  \n#### 19. 以下哪项陈述是错误的？\n\n1.  Vertex AI Feature Store 可以从 BigQuery 导入数据。\n2.  Vertex\
  \ AI Feature Store 可以从 Google Cloud Storage 导入数据。\n3.  Vertex AI Feature Store 甚至可以存储图像。\n\
  4.  Vertex AI Feature Store 以低延迟提供特征服务。\n\n#### 20. 以下哪项陈述是正确的？\n\n1.  Vertex AI\
  \ Feature Store 使用时间序列模型存储所有数据。\n2.  Vertex AI Feature Store 无法从 Google Cloud Storage\
  \ 导入数据。\n3.  Vertex AI Feature Store 甚至可以存储图像。\n4.  Vertex AI Feature Store 无法以低延迟提供特征服务。\n\
  \n### 第 14 章：BigQuery ML\n\nBigQuery 是 Google Cloud 的旗舰数据仓库产品。它是一项全托管的无服务器服务，可处理\
  \ PB 级数据。BigQuery 于 2011 年 11 月发布（正式上线）。10 多年来，这项广受欢迎的服务在用户群和功能数量上都有了显著增长。\n\n你可能已经注意到，在前面的许多章节中都提到了\
  \ BigQuery ML。虽然当前的考试指南（截至本书撰写时）没有单独的章节介绍它，但这是 ML 认证最重要的主题之一。\n\n在 BigQuery 中，数据是使用\
  \ SQL 进行分析的，包括创建和训练模型。我们将通过一个示例解释 BigQuery 的用法。假设我们有一个包含信用卡客户数据的数据集，目标是判断客户是否拖欠了信用卡付款。\n\
  \nBigQuery ML 彻底改变了行业，因为它对现状进行了根本性的变革。传统上，机器学习只对编写代码（如 Python）的专家机器学习工程师开放。BigQuery\
  \ ML 使得熟悉 SQL 的数据分析师也能利用 ML 工具。\n\n在很大程度上，BigQuery ML 实现了机器学习的普及，让更多人能够使用它。这导致机器学习的使用发生了快速变化，特别是针对结构化数据。\n\
  \n#### BigQuery – 数据访问\n\n有三种访问数据的方法。最常用的方法是使用 Web 控制台编写 SQL 查询（如图 14.1 所示）。查询结果显示在查询编辑器下方。\n\
  \n第二种方法是在 Jupyter Notebook 中运行相同的查询，通过使用魔术命令 `%%bigquery`，如图 14.2 所示。该图展示了在运行 Vertex\
  \ AI Workbench 的 Jupyter Notebook 中执行 BigQuery 查询并获得结果的过程。\n\n![图 14.1 在 Web 控制台中运行\
  \ SQL 查询](img/c14f001.png)\n\n**图 14.1** 在 Web 控制台中运行 SQL 查询\n\n![图 14.2 在 Vertex\
  \ AI Workbench 的 Jupyter Notebook 中运行相同的 SQL 查询](img/c14f002.png)\n\n**图 14.2**\
  \ 在 Vertex AI Workbench 的 Jupyter Notebook 中运行相同的 SQL 查询\n\n第三种方法是使用 Python API\
  \ 在 Jupyter Notebook 中运行相同的查询。请参考以下代码。第一部分是导入 BigQuery 库并创建客户端。将查询作为字符串传递，结果捕获在\
  \ Pandas DataFrame 中。\n\n```python\nfrom google.cloud import bigquery\nimport pandas\n\
  client = bigquery.Client(location=\"us-central1\", project=\"projectname\")\nquery\
  \ = \"\"\"\n    SELECT * FROM `projectname.dataset1.table1` LIMIT 10\n\"\"\"\nquery_job\
  \ = client.query(\n    query,\n    location=\"us-central1\",\n)\ndf = query_job.to_dataframe()\n\
  ```\n\n#### BigQuery ML 算法\n\n\n\n\n#### BigQuery ML\n\nBigQuery ML（以前称为 BQML）允许您使用标准\
  \ SQL 查询创建机器学习模型。您可以仅使用 SQL 查询创建模型，并对模型进行训练、测试、验证和预测。您无需编写任何 Python 代码即可在 BigQuery\
  \ 中使用机器学习。此外，它完全无服务器。\n\n##### 模型训练\n\n要创建模型，使用的关键字是 `CREATE MODEL`。此语句类似于 `CREATE\
  \ TABLE DDL` 语句。当您运行包含 `CREATE MODEL` 语句的查询时，会生成一个查询作业并处理该查询。与 `CREATE MODEL` 类似，您还可以使用\
  \ `CREATE MODEL IF NOT EXISTS` 和 `CREATE OR REPLACE MODEL`，这些命令名称直观易懂，方便我们复用模型名称。\n\
  \n```\nCREATE MODEL modelname1\n   OPTIONS(model_type='linear_reg', input_label_cols=['label_col'])\n\
  AS SELECT * FROM table1\n```\n\n在前面的 SQL 命令中，关键字之后，您必须提供两个选项：`model_type` 和 `input_label_cols`。模型类型指定您尝试构建哪种模型。可供您选择的有回归、分类和时间序列模型。有关当前可用模型的完整列表，请参见表\
  \ 14.1。第二个选项是 `input_label_cols`，用于标识所提供数据中的目标列。\n\n最后，SQL 命令的最后一部分（`SELECT * FROM\
  \ table1`）标识您将用于训练的表。请注意，它显示为一个简单的选择查询，这意味着查询结果被传递给了训练作业。在这一行中，您可以选择某些列、选择某些行、连接多个表以生成结果等，以创建您的训练数据集。唯一的限制是确保目标列存在，并且有足够的行来训练模型。\n\
  \n###### 表 14.1：BigQuery ML 上可用的模型\n\n| 模型类别 | 模型类型 | 说明 |\n| --- | --- | --- |\n\
  | 回归 | `LINEAR_REG`, `BOOSTED_TREE_REGRESSOR`, `DNN_REGRESSOR`, `AUTOML_REGRESSION`\
  \ | 预测真实值 |\n| 分类 | `LOGISTIC_REG`, `BOOSTED_TREE_CLASSIFIER`, `DNN_CLASSIFIER`,\
  \ `DNN_LINEAR_COMBINED_CLASSIFIER`, `AUTOML_CLASSIFIER` | 预测二元标签或多标签 |\n| 深度和宽度模型\
  \ | `DNN_LINEAR_COMBINED_REGRESSOR`, `DNN_LINEAR_COMBINED_CLASSIFIER` | 用于推荐系统和个性化的深度和宽度模型\
  \ |\n| 聚类 | `KMEANS` | 无监督聚类模型 |\n| 协同过滤 | `MATRIX_FACTORIZATION` | 用于推荐 |\n| 降维\
  \ | `PCA`, `AUTOENCODER` | 无监督预处理步骤 |\n| 时间序列预测 | `ARIMA_PLUS` | 预测 |\n| 通用 | `TENSORFLOW`\
  \ | 通用 TensorFlow 模型 |\n\n如果您查看表 14.1 中的列表，会发现有几种可用的模型。预期的模型包括线性回归、分类和聚类，它们很容易使用\
  \ SQL 定义。然而，随着列表往下，您可能会看到 DNN，它代表*深度神经网络*。在 BigQuery ML 中，您可以通过在选项部分传递正确的参数，完全灵活地定义和训练\
  \ DNN 模型。有关 `DNN_CLASSIFIER` 和 `DNN_REGRESSOR` 的完整选项列表，请参见图 14.3。这些模型是使用 TensorFlow\
  \ Estimator 构建的。请注意，您拥有构建所选模型所需的所有灵活性。\n\n![图 14.3 DNN_CLASSIFIER 和 DNN_REGRESSOR\
  \ 的 SQL 选项](img/c14f003.png)\n\n**图 14.3** `DNN_CLASSIFIER` 和 `DNN_REGRESSOR` 的\
  \ SQL 选项\n\n我们为小型数据集创建了一个模型，几分钟内就完成了：\n\n```\nCREATE OR REPLACE MODEL \n    `test.creditcard_model1`\
  \ \nOPTIONS(model_type='logistic_reg', \n        input_label_cols=['defaultpaymentnextmonth'])\n\
  AS \nSELECT * FROM `test.creditcardtable`\n```\n\n当我们训练分类模型时，可以查看训练结果、迭代过程以及评估指标，包括聚合指标、分数阈值、ROC\
  \ 曲线、PR 曲线和混淆矩阵。这些都是自动计算的。\n\n##### 模型评估\n\n不过，建议使用模型未见过的独立数据集，通过关键字 `ML.EVALUATE`\
  \ 对模型进行评估。\n\n```\nSELECT * FROM \nML.EVALUATE(MODEL `projectid.test.creditcard_model1`,\
  \ \n  (SELECT * FROM `test.creditcardtable`))\n```\n\n这在几秒钟内给出了图 14.4 所示的结果，Web\
  \ 界面中显示了查询及其下方的结果。\n\n![图 14.4 显示模型评估结果的查询](img/c14f004.png)\n\n**图 14.4** 显示模型评估结果的查询\n\
  \n##### 预测\n\n`ML.PREDICT` 函数用于 BigQuery ML 中的预测。您可以传递整个表进行预测，输出将是一个包含所有输入列且行数相同的表，外加两个新列：`predicted_<label_column_name>`\
  \ 和 `predicted_<label_column_name>_probs`。此处的 `<label_column_name>` 是训练数据中标签列的名称。存在一些差异。\n\
  \n以下是使用我们创建的模型进行预测的示例 SQL：\n\n```\nselect * from \n ML.PREDICT (MODEL `dataset1.creditcard_model1`,\n\
  \       (select * FROM `dataset1.creditcardpredict` limit 1))\n```\n\n这里我们指定了之前创建的模型\
  \ `creditcard_model1`，从名为 `creditcardpredict` 的表中选择一行并将其传递给 `ML.PREDICT` 函数。第一行中的\
  \ `select` 允许我从输出中仅选择特定列。\n\n以下是仅选择预测结果的相同示例：\n\n```\nselect \n       predicted_defaultpaymentnextmonth,\
  \ \n       predicted_defaultpaymentnextmonth_probs\n  from \nML.PREDICT (MODEL `dataset1.creditcard_model1`,\n\
  \    (select  * FROM `dataset1.creditcardtable` limit 1))\n```\n\n前面查询的结果如图 14.5\
  \ 所示。请注意，每个标签的预测概率均已显示。\n\n![图 14.5 仅显示预测结果的查询结果](img/c14f005.png)\n\n**图 14.5**\
  \ 仅显示预测结果的查询结果\n\n##### BigQuery ML 中的可解释性\n\n可解释性对于调试模型和提高透明度非常重要，在某些领域甚至是法规要求。在\
  \ BigQuery 中，您可以在模型级别获取全局特征重要性值，也可以获取每个预测的解释。这些也通过 SQL 函数访问。\n\n要在全局级别获得解释，您必须在训练期间设置\
  \ `enable_global_explain=TRUE`。以下是我们前一个示例的样本 SQL：\n\n```\nCREATE OR REPLACE MODEL\
  \ \n       `model1`\n  \nOPTIONS(model_type='logistic_reg',\n        enable_global_explain=TRUE,\n\
  \        input_label_cols=['defaultpaymentnextmonth']) AS SELECT \n  * \nFROM `dataset1.creditcardtable`\n\
  ```\n\n模型训练完成后，您可以查询模型的全局解释，这些解释以表的形式返回（图 14.6）；每一行包含输入特征及代表重要性的浮点数。\n\n```\nSELECT\
  \  *\nFROM  \nML.GLOBAL_EXPLAIN(MODEL `model1`)\n```\n\n特征旁边的数字代表该特征对预测的影响。归因值越高，与模型的相关性越高，反之亦然。但请注意，归因值未归一化（它们的总和不等于\
  \ 1）。请参见表 14.2。\n\n![图 14.6 为我们的模型返回的全局特征重要性](img/c14f006.png)\n\n**图 14.6** 为我们的模型返回的全局特征重要性\n\
  \n\n\n\n\n##### 模型类型\n\n**表 14.2** 模型类型\n\n| 模型类型 | 可解释性方法 | 说明 |\n| --- | --- |\
  \ --- |\n| 线性回归和逻辑回归 | Shapley 值、标准误、p 值 | 这是对所有可能联盟的所有边际贡献的平均值。 |\n| 提升树 | Tree\
  \ SHAP、基于基尼系数的特征重要性 | 针对基于决策树的模型优化的 Shapley 值。 |\n| 深度神经网络和宽深模型 | 集成梯度 | 一种基于梯度的方法，能高效计算特征归因，具有与\
  \ Shapley 相同的公理属性。 |\n| `Arima_PLUS` | 时间序列分解 | 如果时间序列中存在多个分量，则将其分解为多个分量。 |\n\n\
  为预测添加可解释性会产生计算成本。对于 Shapley 等方法尤其如此，其复杂度会随特征数量呈指数级增长。\n\n在以下 SQL 代码中，我们使用的是 `EXPLAIN_PREDICT`\
  \ 而非 `PREDICT` 函数。我们从名为 `dataset1.credit_card_test` 的表中选择所有列，且仅选择一行。结果如 **图 14.7**\
  \ 所示。\n\n![图 14.7 预测结果](img/c14f007.png)\n\n**图 14.7** 预测结果\n\n```sql\nSELECT *\n\
  FROM ML.EXPLAIN_PREDICT(\n    MODEL `creditcard_model1`,\n    (\n        SELECT\
  \ * FROM\n        `dataset1.credit_card_test` LIMIT 1\n    ),\n    STRUCT(5 AS top_k_features)\n\
  )\n```\n\n在本例中，预测值为 –1.281。现在让我们看看作为查询结果一部分报告的前五个特征（**图 14.8**）。值得注意的是，这些单个特征贡献比基线低两个数量级。\n\
  \n![图 14.8 预测的顶部特征归因](img/c14f008.png)\n\n**图 14.8** 预测的顶部特征归因\n\n分析完解释后，您可能还希望将全局解释作为元数据的一部分进行记录。在模型层面，您可以始终预留一个数据集专门用于运行解释。将每次预测的特征归因与预测结果一起存储。\n\
  \n##### BigQuery ML 与 Vertex AI Tables\n\nBigQuery ML 处理表，Vertex AI 也是如此。这两个产品有相似之处，但存在关键差异，因为它们面向不同类型的用户。BigQuery\
  \ 是一款无服务器数据仓库，其用户是 SQL 专家，习惯用表、连接、`GROUP-BY` 语句等概念思考问题。部分 BigQuery 客户编写了数千个查询，其中一些非常复杂，通过\
  \ `BigQuery_scheduled queries` 自动化，并使用 Looker 和 Looker Studio 等可视化工具。\n\nVertex\
  \ AI 的客户非常熟悉 Kubeflow，且精通 Java 或 Python。这类数据科学家每天使用 Jupyter Notebook，主要使用 Pandas\
  \ DataFrame 处理数据。这类机器学习工程师构建有趣的新神经网络，有时编写自定义 TensorFlow 操作，并考虑使用 TPU。这类用户希望对数据流和训练过程拥有细粒度的控制。\n\
  \n总之，尽管这两个产品功能大体相似，但其界面以及训练和预测的方法截然不同，面向的受众也不同。\n\n##### 与 Vertex AI 的互操作性\n\n尽管\
  \ Vertex AI 和 BigQuery ML 是截然不同的产品，但它们在机器学习流水线的每个环节都被设计为可互操作。至少有六个集成点，使得将这两个产品无缝结合使用变得轻而易举。\n\
  \n###### 访问 BigQuery 公共数据集\n\nBigQuery 拥有 200 多个公共数据集，通过 Google Cloud 公共数据集计划向公众开放。Google\
  \ 承担数据集的存储费用，您可以通过自己的 GCP 项目访问它们。您只需为在这些数据集上运行的查询付费。\n\n您也可以从 Vertex AI 访问这些数据集，以训练\
  \ ML 模型或增强现有数据。例如，假设您要预测某地的交通状况；您可以将自己的数据集与 BigQuery 的公共天气数据集结合，以改进模型。\n\n######\
  \ 将 BigQuery 数据导入 Vertex AI\n\n在 Vertex AI 中创建数据集时，您需要提供源网址作为起点。您可以直接提供指向 BigQuery\
  \ 数据集的 BigQuery 网址，以创建 Vertex AI 数据集。您可以在控制台中通过几个步骤完成此操作，或在 Python 中按如下方式操作：\n\n\
  ```python\nfrom google.cloud import aiplatform\ndataset = aiplatform.TabularDataset.create(\n\
  \    display_name=\"my-tabular-dataset\",\n    bq_source=\"bq://project.dataset.table_name\"\
  ,\n)\n```\n\n请注意，我们并未将数据从 BigQuery 导出再导入 Vertex AI。得益于此集成，您现在可以无缝连接 BigQuery 中的数据。\n\
  \n###### 从 Vertex AI Workbench Notebook 访问 BigQuery 数据\n\n当您在 Vertex AI Workbench\
  \ 的托管笔记本实例中使用 Jupyter Notebook 时，可以直接浏览 BigQuery 数据集、运行 SQL 查询，或下载为 Pandas DataFrame。\n\
  \n这对于使用 Jupyter Notebook 进行探索性分析、创建可视化、试验机器学习模型，或使用不同数据集进行特征工程的数据科学家来说非常有用。\n\n\
  ###### 在 BigQuery 中分析测试预测数据\n\n此功能与数据集创建集成类似，但方向相反。训练模型时，您提供训练集和测试集，作为流程的一部分，您会获得测试集的预测结果。您可以将这些结果直接导出到\
  \ BigQuery。当您想使用各种 SQL 方法进一步分析测试预测时，这非常有用。\n\n###### 导出 Vertex AI 批量预测结果\n\n在 Vertex\
  \ AI 中进行批量预测时，您可以直接指向 BigQuery 表作为输入数据，此外，还可将预测结果发回 BigQuery 并存储为表。如果您已使用 Vertex\
  \ AI 标准化 MLOps，但数据在 BigQuery 中，这非常有用。\n\n###### 将 BigQuery 模型导出到 Vertex AI\n\n在\
  \ BigQuery 中构建模型后，您可以将模型从 BigQuery 导出到 GCS，然后导入 Vertex AI。这使您能完全自由地在任何地方训练和使用模型。展望未来，如果您使用\
  \ Vertex AI Model Registry，可以直接将 BigQuery ML 模型注册到其中。此步骤省去了将模型文件导出到 GCS 的额外工作，实现了无缝衔接。支持\
  \ BigQuery 内置模型和 TensorFlow 模型。目前导出 `ARIMA_PLUS` 模型、`XGBoost` 模型以及使用了 transform\
  \ 的模型存在限制。\n\n#### BigQuery 设计模式\n\n在数据科学和机器学习中，有几种情况频繁出现，足以被视为一种模式，针对这些情况有一些巧妙且经过深思熟虑的解决方案，称为设计模式。因为\
  \ BigQuery ML 是一项从新视角切入机器学习的革命性技术，所以针对一些老问题出现了一些优雅的新解决方案。\n\n##### 哈希特征\n\n此解决方案解决了分类变量面临的三个问题：\n\
  \n*   **词汇表不完整**：输入数据可能不包含分类变量可能取值的完整集合。如果数据直接输入 ML 模型，这会造成问题。\n*   **基数高**：邮政编码是基数高的分类变量示例，这在\
  \ ML 中会造成一些扩缩问题。\n*   **冷启动问题**：分类变量可能会新增训练数据集中不存在的值——例如，新员工入职时创建新的员工 ID。\n\n\n\n\
  \n\n解决此问题的一种方法是通过哈希将这个高基数变量转换为低基数域。这在 BigQuery 中可以非常轻松地完成，如下所示：\n\n```\nABS(MOD(FARM_FINGERPRINT(zipcode),\
  \ numbuckets))\n```\n\n这使用了一个名为 FarmHash 的哈希函数，它是一系列哈希算法，具有确定性、分布良好，且可在多种编程语言中使用。\n\
  \n##### 转换\n\n有时在将输入送入模型之前，会对模型的输入进行修改、增强或构建，就像哈希示例那样。应用于输入的转换中包含有价值的信息。应用于训练数据集输入的转换，如果模型部署在生产环境中，也必须应用于输入。因此，转换代码是在进行预测时流水线的一部分。BigQuery\
  \ 有一个优雅的解决方案来解决这个问题，称为 `TRANSFORM` 子句，它是 `CREATE_MODEL` 函数的一部分：\n\n```\nCREATE OR\
  \ REPLACE MODEL m\n  TRANSFORM(ML.FEATURE_CROSS(STRUCT(f1, f2)) as cross_f,\n  \
  \          ML.QUANTILE_BUCKETIZE(f3) OVER() as buckets,\n            label_col)\n\
  \  OPTIONS(model_type='linear_reg', input_label_cols=['label_col'])\nAS SELECT *\
  \ FROM t\n```\n\n在前面的示例 SQL 中，我们正在对 f1 和 f2 创建一个“特征交叉”转换，第二个转换是对特征 f3 进行分位数分桶。这些转换将应用于输入字段\
  \ f1、f2 和 f3，以创建名为“cross_f”和“buckets”的新特征。BigQuery ML 将自动将此转换代码添加到构建的模型中。因此，在预测期间，当你传递输入\
  \ f1、f2 和 f3 时，它将在将输入发送到模型之前自动执行这些转换。\n\nBigQuery 提供了许多此类有用的转换，如 `POLYNOMIAL_EXPAND`、`FEATURE_CROSS`、`NGRAMS`、`QUANTILE_BUCKET`、`HASH_BUCKETIZE`、`MIN_MAX_SCALER`\
  \ 和 `STANDARD_SCALER`。\n\n有关 `TRANSFORM` 子句的更多详细信息，请参阅文档：\n\n`https://cloud.google.com/bigquery-ml/docs/reference/standard-sql/bigqueryml-preprocessing-functions`\n\
  \n此设计模式的注意事项是，带有转换的模型将无法在 BigQuery ML 之外工作，例如，如果你将模型导出到 Vertex AI。\n\n#### 总结\n\n\
  BigQuery 是一项重要的服务，它彻底改变了 SQL 社区中 ML 的使用方式。BigQuery ML 实现了机器学习的民主化，使其可供更多人使用。\n\n\
  在本章中，我们了解了如何使用 SQL 执行 ML 流水线的所有操作。我们还学习了如何直接使用 SQL 对输入值应用转换，从而减少创建模型的时间。虽然 BigQueryML\
  \ 是一项独立的服务，但它与 Vertex AI 高度互操作。最后，我们还看到了一些 BigQuery ML 独有的有趣设计模式。\n\n#### 考试要点\n\
  \n*   **理解 BigQuery 和 ML。** 了解 BigQuery 的历史以及将机器学习引入数据仓库、数据分析以及任何熟悉 SQL 人员的创新。学习如何使用\
  \ SQL 进行训练、预测和提供模型解释。\n\n*   **能够解释 BigQuery ML 和 Vertex AI 之间的区别以及它们如何协同工作。** 这些服务提供相似的功能，但面向不同的用户设计。BigQuery\
  \ ML 面向分析师和任何熟悉 SQL 的人设计，而 Vertex AI 面向 ML 工程师设计。了解使这两项服务之间无缝协作的各种集成点。\n\n*   **理解\
  \ BigQuery 设计模式。** BigQuery 拥有解决机器学习中反复出现问题的优雅方案。哈希、转换和无服务器预测很容易应用到你的 ML 流水线中。\n\
  \n#### 复习题\n\n1.  你在一家拥有全球鞋类品牌的公司的大型数据分析师团队中工作。该公司在南亚制造，并在全球范围内分销。其销售在 COVID-19\
  \ 大流行期间受到影响，分销也是如此。你的团队被要求利用关于疾病传播的新数据和恢复计划，按国家预测销售额。目前你的数据在本地，销售数据每周来自世界各地。你将使用什么进行预测？\n\
  \n    1.  使用 Vertex AI AutoML Tables 预测销售额，因为这是一个分布式案例。\n    2.  使用带有自定义模型的 Vertex\
  \ AI AutoML Tables，因为由于 COVID-19 这是一个特殊案例。\n    3.  使用 BigQuery ML，尝试 TensorFlow\
  \ 模型和 DNN 模型以找到最佳结果。\n    4.  使用带有 `ARIMA_PLUS` 的 BigQuery ML，并使用 BigQuery COVID-19\
