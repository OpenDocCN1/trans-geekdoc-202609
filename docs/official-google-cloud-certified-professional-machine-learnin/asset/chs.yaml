  \ 了解用于存储数据以满足各种 ML 用例的各种数据存储类型。\n*   **了解如何实现自动化和编排。** 了解何时使用 `Vertex AI Pipelines`\
  \ 与 `Kubeflow` 与 `TFX pipelines`。我们将在第 11 章“设计 ML 训练流水线”中介绍详细信息。\n*   **了解如何最佳地提供数据服务。**\
  \ 您需要了解部署模型时的最佳实践。了解何时使用批量预测与实时预测，以及如何通过在线实时预测管理延迟。\n\n#### 复习题\n\n1.  您在一家在线旅行社工作，该公司还向其他公司出售其网站上的广告位。您被要求预测用户接下来应该看到的最相关网页横幅。安全性对您的公司很重要。模型延迟要求为\
  \ `300ms@p99`，库存有数千个网页横幅，您的探索性分析表明导航上下文是一个很好的预测因子。\n\n    您想要实现最简单的解决方案。应该如何配置预测流水线？\n\
  \n    1.  在网站上嵌入客户端，然后在 Vertex AI 平台预测上部署模型。\n    2.  在网站上嵌入客户端，在 `App Engine` 上部署网关，然后在\
  \ Vertex AI 平台预测上部署模型。\n    3.  在网站上嵌入客户端，在 `App Engine` 上部署网关，在 `Cloud Bigtable`\
  \ 上部署数据库以写入和读取用户的导航上下文，然后在 Vertex AI Prediction 上部署模型。\n    4.  在网站上嵌入客户端，在 `App\
  \ Engine` 上部署网关，在 `Memorystore` 上部署数据库以写入和读取用户的导航上下文，然后在 Google Kubernetes Engine\
  \ (`GKE`) 上部署模型。\n\n2.  您正在使用 `TensorFlow` 训练一个模型，该模型基于存储在多个 `CSV` 文件中的 1000 亿条记录的结构化数据集。您需要提高输入/输出执行性能。应该怎么做？\n\
