  \ `Vertex AI Model Monitoring` 等工具，这些工具可以帮助测试生产环境中的模型。\n\n最后，您了解了配置触发器和计划以自动化模型流水线的方法，例如\
  \ `Cloud Run`、`Cloud Build`、`Cloud Scheduler`、`Vertex AI managed notebooks` 和 `Cloud\
