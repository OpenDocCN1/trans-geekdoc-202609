  \ `GCP` AI/ML 技术栈三层中的哪项服务。我们介绍了用于在集成的 Vertex AI 平台中使用 `BigQuery` 管理数据的数据收集和数据管理策略。我们还介绍了用于亚毫秒级和毫秒级延迟的数据存储选项，例如\
  \ NoSQL 数据存储。然后我们介绍了用于 ML 流水线的自动化和编排技术，例如 `Vertex AI Pipelines`、`Kubeflow Pipelines`\
  \ 和 `TFX pipelines`。\n\n我们讨论了如何使用批处理模式和实时模式来提供模型服务以进行预测。我们介绍了一些架构模式，用于使用 `Vertex\
  \ AI Prediction` 创建批量预测以及在线预测。最后，我们讨论了在使用实时服务时提高模型延迟的一些方法。\n\n#### 考试要点\n\n*   **设计可靠、可扩展和高可用的\
