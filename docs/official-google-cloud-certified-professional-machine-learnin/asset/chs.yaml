  \n1.  TensorBoard\n2.  What-If Tool\n3.  Looker\n4.  语言可解释性工具 (LIT)\n\n### 第 9 章：Vertex\
  \ AI 上的模型可解释性\n\n在本章中，我们将介绍什么是可解释性 AI 以及它在机器学习中为什么重要。我们将详细讨论 Vertex AI 平台上的模型可解释性技术以及应用用例。\n\
  \n#### Vertex AI 上的模型可解释性\n\n对于开发机器学习模型的团队来说，随着预测对业务结果的影响增加，解释模型预测的责任也随之增加。例如，消费者可能会毫无保留地接受来自机器学习模型的电影推荐，而不需要解释。消费者可能同意也可能不同意该推荐，但模型开发人员证明预测合理性的需求相对较低。\n\
  \n相反，如果机器学习模型预测信贷申请是否获批或患者的药物剂量是否正确，模型开发人员就有责任解释该预测。他们需要回答诸如“为什么我的贷款被拒？”或“为什么我应该服用\
  \ 10 毫克这种药？”等问题。因此，深入了解训练过程并开发人类可解释的机器学习模型非常重要。\n\n##### 可解释性 AI\n\n*可解释性* 是指您能够用人类语言解释机器学习或深度学习系统内部机制的程度。这与“黑箱”概念形成对比，在黑箱中，即使是设计者也无法解释为什么\
  \ AI 做出特定决策。\n\n可解释性分为两种类型：全局和局部：\n\n*   *全局可解释性* 旨在使整体机器学习模型透明且易于理解。\n*   *局部可解释性*\
  \ 侧重于解释模型的单个预测。\n\n解释机器学习模型及其预测的能力可以建立信任并提高机器学习的采用率。模型不再是黑箱。这增加了模型预测消费者的舒适度。对于模型所有者来说，了解机器学习模型固有的不确定性有助于在出现问题时调试模型，并改进模型以获得更好的业务成果。\n\
  \n\n\n\n#### 调试机器学习模型\n\n由于深度神经网络的存在，调试机器学习模型非常复杂。随着变量数量的增加，要弄清哪个特征导致了哪个结果变得非常困难。线性模型易于解释和阐释，因为输入参数与输出呈线性关系：`X\
  \ = ax + y`，其中 `X` 是依赖于 `x` 和 `y`（输入参数）的预测输出。对于基于决策树的模型（如 `XGBoost`）和深度神经网络，这种从一组输入确定输出的数学关系变得复杂，导致调试这些模型变得困难。这就是为什么需要可解释技术来解释模型的原因。\n\
  \n##### 可解释性与可阐释性\n\n*可解释性* 和 *可阐释性* 经常互换使用。然而，它们的含义略有不同。可解释性关乎机器学习模型将因果关联起来的准确程度。可阐释性关乎解释深度神经网络中隐藏参数（我们在第\
  \ 7 章“模型构建”中介绍过）证明结果的能力。\n\n##### 特征重要性\n\n特征重要性是一种使用分数（重要性）来解释构成训练数据的特征的技术。它指示了特征相对于其他特征的有用性或价值。在使用\
  \ `XGBoost` 进行个人收入预测的用例中，重要性分数指示了每个特征在模型内构建提升决策树时的价值。模型使用某个属性通过决策树做出关键决策的次数越多，该属性的相对重要性就越高。\n\
  \n以下是使用特征重要性最重要的优势：\n\n*   **变量选择**：假设你正在使用 1000 个变量进行训练。你可以轻松找出哪些变量不重要或对模型预测贡献较小，并在将模型部署到生产环境之前轻松移除这些变量。这可以节省大量的计算和基础设施成本以及训练时间。\n\
  *   **模型中的目标/标签或数据泄露**：数据泄露是指你错误地将目标变量（你试图预测的特征）作为特征添加到了训练数据集中。我们在第 2 章“探索数据和构建数据管道”中介绍过这一点。\n\
  \n##### Vertex Explainable AI\n\nVertex Explainable AI 将特征归因集成到 Vertex AI 中，帮助你理解分类和回归任务的模型输出。Vertex\
  \ AI 会告诉你数据中的每个特征对预测结果的贡献程度。然后，你可以利用这些信息验证模型是否按预期运行，识别模型中的偏差，并获得改进模型和训练数据的思路。以下是\
  \ Vertex Explainable AI 支持的服务：\n\n*   AutoML 图像模型（仅限分类模型）\n*   AutoML 表格模型（仅限分类和回归模型）\n\
  *   基于表格数据的自定义训练 TensorFlow 模型\n*   基于图像数据的自定义训练 TensorFlow 模型\n\n###### 特征归因\n\n\
  Google Cloud 在 Vertex AI 中目前的提供以实例级特征归因为中心，它提供了一个与特征对模型预测的贡献成比例的带符号的逐特征归因分数。特征归因指示了模型中的每个特征对每个给定实例的预测贡献了多少。当你请求预测时，你会获得适合你模型的预测值。当你请求解释时，你会获得预测结果以及特征归因信息。\n\
  \n有关详细信息，请参阅 `https://cloud.google.com/vertex-ai/docs/explainable-ai/overview#feature-based_explanations`。\n\
  \nVertex Explainable AI 提供三种用于特征归因的方法：采样 Shapley、积分梯度和 XRAI。\n\n*   **采样 Shapley**：这将结果的功劳分配给每个特征，并考虑不同的特征排列。此方法提供了精确\
  \ Shapley 值的采样近似。图 9.1 展示了如何使用 Shapley 图来确定黑盒特征重要性（`https://github.com/slundberg/shap`）。模型中有四个输入变量产生一个输出。使用\
  \ Shapley 值，你可以知道这四个特征（年龄、性别、血压、BMI）中哪些对输出或预测有正向或负向贡献。\n\n    ![图 9.1 SHAP 模型可解释性](img/c09f001.png)\n\
  \n    **图 9.1** SHAP 模型可解释性\n\n*   **积分梯度**：存在一种基于梯度的方法来高效计算特征归因。这主要用于具有图像用例的深度神经网络。计算梯度，以告知哪个像素对模型预测的类别概率影响最强。例如，一个图像分类模型被训练用于预测给定图像是包含狗还是猫。如果你请求该模型对一组新图像进行预测，则会收到每张图像的预测结果（“狗”或“猫”）。如果你请求解释，你会获得预测类别以及图像的叠加层，显示图像中哪些像素对最终预测贡献最大，如图\
  \ 9.2 所示。有关详细信息，请参阅 `https://cloud.google.com/vertex-ai/docs/explainable-ai/overview#integrated-gradients`。\n\
  \n    ![图 9.2 使用积分梯度对猫图像进行特征归因 ¶ 来源：Google LLC / www.tensorflow.org/tutorials/interpretability/integrated_gradients\
  \ 最后访问日期：2022 年 11 月 21 日。](img/c09f002.png)\n\n    **图 9.2** 使用积分梯度对猫图像进行特征归因 ¶\
  \ 来源：Google LLC / `www.tensorflow.org/tutorials/interpretability/integrated_gradients`\
  \ 最后访问日期：2022 年 11 月 21 日。\n\n    积分梯度提供单个示例的特征重要性；但是，它们不提供整个数据集的全局特征重要性。此外，它们不解释特征交互和组合。\n\
  \n*   **XRAI (eXplanation with Ranked Area Integrals，基于秩积分的解释)**：基于积分梯度方法，XRAI 评估图像的重叠区域以创建显著性图，该图突出显示图像的相关区域，而非像素。XRAI\
  \ 方法将积分梯度方法与额外步骤相结合，以确定图像的哪些*区域*对给定类别预测贡献最大。XRAI 通过像素级分割、过度分割和区域选择为图像提供解释。有关详细信息，请参阅\
  \ `https://cloud.google.com/vertex-ai/docs/explainable-ai/overview#xrai`。\n\n考试不要求你了解这些方法的细节。但是，你需要知道在\
  \ Vertex AI 中针对用例和数据类型何时使用哪种技术；请参阅表 9.1。\n\n**表 9.1** Vertex AI 使用的可解释技术\n\n| 方法\
  \ | 支持的数据类型 | 模型类型 | 用例 | Vertex AI 等效模型 |\n| :--- | :--- | :--- | :--- | :--- |\n\
  | 采样 Shapley | 表格 | 不可微模型（表后解释），如树集成和神经网络。 | 表格数据上的分类和回归 | 自定义训练模型（任何预测容器）<br>AutoML\
  \ 表格模型 |\n| 积分梯度 | 图像和表格数据 | 可微模型（表后解释），如神经网络。特别推荐用于具有大特征空间的模型。推荐用于低对比度图像，如 X 光片。\
  \ | 表格数据上的分类和回归 | |\n\n\n\n\n\n#### 图像数据分类 || 使用 TensorFlow 预构建容器提供预测的自定义训练 TensorFlow\
  \ 模型\n\nAutoML 图像模型 |\n\n| XRAI（基于秩分面积积分的解释） || 图像数据 || 接受图像输入的模型。特别推荐用于自然图像，即包含多个物体的任何真实场景。\
  \ || 图像数据分类 || 使用 TensorFlow 预构建容器提供预测的自定义训练 TensorFlow 模型\n\nAutoML 图像模型 |\n\n\
  我们在表 9.1 中提到了可微分模型和不可微分模型。让我们谈谈它们之间的基本区别：\n\n*   **可微分模型：** 您可以计算 TensorFlow 图中所有操作的导数。此属性有助于使反向传播在这类模型中成为可能。例如，神经网络是可微分的。要获取可微分模型的特征归因，请使用积分梯度法。\n\
  \n*   **不可微分模型：** 这些模型在 TensorFlow 图中包含不可微分操作，例如执行解码和舍入任务的操作。例如，作为树和神经网络集成构建的模型是不可微分的。要获取不可微分模型的特征归因，请使用采样\
  \ Shapley 方法。\n\n如需深入了解，请参阅 `https://cloud.google.com/blog/products/ai-machine-learning/example-based-explanations-to-build-better-aiml-models`\
  \ 处的 *AI Explanations Whitepaper*（AI 解释白皮书）。\n\n#### Vertex AI 基于示例的解释\n\n基于示例的解释用于错误分类分析，并可支持主动学习，以便有选择地标记数据。例如，如果一张图像的\
  \ 10 个解释中有 5 个来自“鸟”类，5 个来自“飞机”类，则该图像可作为人工标注的候选项，从而进一步丰富数据。\n\n基于示例的解释不限于图像。它们可以为图像、文本和表格等多种类型的数据生成嵌入。请参阅此博客以了解更多信息：`https://cloud.google.com/blog/products/ai-machine-learning/example-based-explanations-to-build-better-aiml-models`。\n\
  \n此功能处于公开预览阶段，考试中可能不会涉及此主题的问题。不过，了解 Google Cloud 提供的可解释 AI 选项，这是一个很好的切入点。\n\n####\
  \ 数据偏差与公平性\n\n当数据的某些部分未被收集或被错误表征时，数据可能会产生偏差。这可能发生在通过调查收集的数据、基于系统性或历史观念的数据，或非随机或样本量过小的数据样本中。以上任何情况都可能导致结果倾斜，因为有偏差的数据无法准确代表机器学习模型的用例。这还会带来数据中的系统偏见或公平性问题。\n\
  \nML 公平性旨在确保数据中的偏差和模型不准确性不会导致模型基于种族、性别、残疾、性取向或政治倾向等特征对个人产生不利对待——例如，基于性别发放信用卡或基于种族拒绝申请。\n\
  \n以下列表包含在 Vertex AI 中检测数据偏差和公平性的一些方法：\n\n*   Explainable AI 特征归因技术（已存在于 AutoML Tables\
  \ 中）有助于检测表格或结构化数据集中的偏差和公平性。\n\n*   使用 Vertex AI 通过集成了 `What‐If Tool`（交互式分析工具）的交互式仪表板检查模型。（我们在第\
  \ 8 章“模型训练与超参数调优”中介绍了 What‐If Tool。）此工具可利用特征概览功能检测数据集中的偏差，该功能可自动从数据中检测偏差。您可以参考此链接了解更多详情：`https://pair-code.github.io/what-if-tool/learn/tutorials/features-overview-bias`。\n\
  \n*   或者，对于检测 NLP（自然语言处理）模型中的偏差和公平性，您可以使用开源的 `Language Interpretability Tool`（语言可解释性工具）。\n\
  \n通过使用这些工具和技术，您可以在数据探索或数据预处理阶段（我们在第 2 章“探索数据与构建数据管道”和第 3 章“特征工程”中介绍过）训练模型之前，检测数据集中的偏差和公平性。\n\
  \n#### ML 解决方案就绪性\n\n我们将从以下两个概念来谈论 ML 解决方案就绪性：\n\n*   负责任 AI\n*   模型治理\n\nGoogle\
  \ 秉持负责任 AI 原则，我们在第 1 章“构建 ML 问题”中介绍过。Google 通过 Google `Responsible AI practices`（负责任\
  \ AI 实践）、`fairness best practices`（公平性最佳实践）、`technical references`（技术参考）和 `technical\
  \ ethics`（技术伦理）材料与客户分享最佳实践。\n\n负责任 AI 工具是检查和理解 AI 模型日益有效的途径。此处列出了一些工具：\n\n*   `Explainable\
  \ AI`（可解释 AI），我们在本章前面介绍过——如何使用 Vertex AI 产品在模型中实现可解释 AI。\n*   `Model cards`（模型卡片），用于解释模型的功能、目标受众和维护者。模型卡片还提供了关于模型构建的见解，包括其架构和所用的训练数据。请参阅此链接了解更多关于模型卡片的信息：`https://modelcards.withgoogle.com/about`。\n\
  *   `TensorFlow open source toolkit`（TensorFlow 开源工具包），以结构化、易访问的方式提供模型透明度。\n\n模型治理是公司的一项核心职能，它提供指导方针和流程，帮助员工落实公司的\
  \ AI 原则。这些原则可以包括避免创建或强化偏见的模型，以及能够为 AI 做出的决策提供理由。\n\n实现模型治理的一些方法如下：\n\n*   确保有人工介入回路，以审查敏感和高影响工作负载的模型输出或预测。\n\
  *   为每个模型按任务建立 `responsibility assignment matrix`（责任分配矩阵）。\n*   维护模型卡片以跟踪模型版本控制和数据血缘。\n\
  *   在涵盖标准情况和边缘情况的基准数据集上评估模型，并根据公平性指标验证模型，以帮助检测隐性偏见。\n*   使用 `what‐if analysis tools`（假设分析工具）了解不同数据特征的重要性。\n\
  *   从数据清洗、训练和调优到部署模型的所有模型就绪最佳实践均在 Google Cloud 文档中提及：`https://cloud.google.com/architecture/guidelines-for-developing-high-quality-ml-solutions`。\n\
  \n#### 如何在 Vertex AI 中设置解释\n\n如果您使用的是自定义训练模型（TensorFlow、Scikit 或 XGBoost），我们在第 8\
  \ 章中介绍过，您需要为自定义训练模型配置解释（`https://cloud.google.com/vertex-ai/docs/explainable-ai/configuring-explanations-feature-based`），以创建支持\
  \ Vertex Explainable AI 的模型。对于 AutoML 表格分类或回归，您无需任何特定配置即可使用 Vertex Explainable AI（`https://cloud.google.com/vertex-ai/docs/explainable-ai/getting-explanations`）。\n\
  \n创建好支持 Explainable AI 的模型资源后，您可以执行以下解释：\n\n*   **在线解释：** 对 Vertex AI API 的同步请求，类似于返回带有特征归因的预测的在线预测。对于在线解释，您不发送\
  \ `projects.locations.endpoints.predict` 请求到 Vertex AI API，而是发送 `projects.locations.endpoints.explain`\
  \ 请求。\n\n*   **批量解释：** 对 Vertex AI API 的异步请求，返回带有特征归因的预测。批量解释是批量预测请求的可选部分。要获取批量解释，请在创建批量预测作业时将\
  \ `generateExplanation` 字段设置为 true。\n\n\n\n\n*   **本地内核解释：** 在我们在第 6 章“构建安全的 ML\
  \ 流水线”中介绍的用户管理式 Vertex AI Workbench 笔记本中执行这些操作。您可以通过在笔记本的本地内核或运行时中运行 Vertex Explainable\
  \ AI，为自定义训练的模型生成解释，而无需将模型部署到 Vertex AI 以获取解释。使用本地解释可以让您尝试不同的 Vertex Explainable\
  \ AI 设置，而无需为每次更改调整 Vertex AI 模型部署。\n\n如果您使用的是 TensorFlow，可以使用 Explainable AI SDK\
  \ 的 `save_model_with_metadata()` 方法来推断模型的输入和输出，并将此解释元数据与模型一起保存。接下来，使用 `load_model_from_local_path()`\
  \ 将模型加载到 Explainable AI SDK 中。最后，使用数据实例调用 `explain()`，并可视化特征归因。\n\n#### 摘要\n\n在本章中，我们讨论了什么是可解释\
  \ AI，以及可解释性和可理解性之间的区别。然后我们介绍了*特征重要性*这一术语，以及为什么解释模型很重要。我们还涵盖了数据偏差与公平性，以及 ML 解决方案就绪性。\n\
  \n最后，我们介绍了 Vertex AI 平台上的可解释 AI 技术和特征归因。我们介绍了 Vertex AI 平台上使用的三种主要模型特征归因技术：采样 Shapley、XRAI\
  \ 和积分梯度。\n\n#### 考试要点\n\n*   **理解 Vertex AI 上的模型可解释性。** 了解什么是可解释性，以及全局解释和局部解释之间的区别。为什么解释模型很重要？什么是特征重要性？了解\
  \ Vertex AI 平台上特征归因的选项，如采样 Shapley 算法、积分梯度和 XRAI。我们涵盖了数据偏差和公平性，以及特征归因如何帮助从数据中确定偏差和公平性。ML\
  \ 解决方案就绪性涉及负责任的 AI 和 ML 模型治理最佳实践。请理解 Vertex AI 中的可解释 AI 支持使用 Explainable AI SDK\
  \ 的 TensorFlow 预测容器，以及 Vertex AI AutoML 表格模型和 AutoML 图像模型。\n\n#### 复习题\n\n1.  您是一名数据科学家，正在构建一个包含\
  \ 100 多个输入特征的线性模型，所有特征的值均在 -1 和 1 之间。您怀疑许多特征是非信息性的。您希望从模型中移除非信息性特征，同时保留信息性特征的原始形式。您应该使用哪种技术？\n\
  \n    1.  使用主成分分析来消除信息量最少的特征。\n\n    2.  在构建模型时，使用 Shapley 值来确定哪些特征最有信息量。\n\n  \
  \  3.  使用 L1 正则化将非信息性特征的系数降为 0。\n\n    4.  使用迭代 Dropout 技术来识别移除后不降低模型性能的特征。\n\n\
  2.  您是一家初创公司的数据科学家，您的团队正在开展多个 ML 项目。您的团队训练了一个效果良好的 TensorFlow 深度神经网络模型用于图像识别，即将投入生产。领导层要求您演示模型的内部工作原理。您会在\
  \ Google Cloud 上使用哪种可解释性技术？\n\n    1.  采样 Shapley\n\n    2.  积分梯度\n\n    3.  PCA\n\
  \n    4.  What-If Tool 分析\n\n3.  您是一名使用 Vertex AI 的数据科学家，希望利用 Explainable AI 了解哪些是最关键的特征以及它们如何影响模型预测。选择\
  \ Vertex Explainable AI 支持的模型类型和服务。（选择三项。）\n\n    1.  AutoML Tables\n\n    2.  图像分类\n\
  \n    3.  自定义 DNN 模型\n\n    4.  决策树\n\n    5.  线性学习器\n\n4.  您是一名使用 Vertex Explainable\
  \ AI 的 ML 工程师。您想了解使用图像和表格数据集训练模型时最重要的特征。您可以使用哪些特征归因技术？（选择三项。）\n\n    1.  XRAI\n\n\
  \    2.  采样 Shapley\n\n    3.  最小似然\n\n    4.  可解释性\n\n    5.  积分梯度\n\n5.  您是一名数据科学家，正在训练一个包含图操作的\
  \ TensorFlow 模型，这些操作执行解码和舍入任务。您会在 Vertex AI 中使用哪种技术来调试或解释此模型？\n\n    1.  采样 Shapley\n\
  \n    2.  积分梯度\n\n    3.  XRAI\n\n    4.  PCA\n\n6.  您是一名数据科学家，正在 Vertex AI 上创建图像分类模型。您希望这些图像具有特征归因。Vertex\
  \ AI AutoML 图像支持以下哪种归因技术？（选择两项。）\n\n    1.  采样 Shapley\n\n    2.  积分梯度\n\n    3.\
  \  XRAI\n\n    4.  DNN\n\n7.  您是一名数据科学家，正在 Vertex AI 上创建图像分类模型。您希望在用户管理式笔记本中设置解释以测试您的\
  \ TensorFlow 代码。建议的最省力方法是什么？\n\n    1.  在笔记本中使用 Explainable AI SDK 设置本地解释。\n\n \
  \   2.  为自定义 TensorFlow 模型配置解释。\n\n    3.  设置 AutoML 分类模型以获取解释。\n\n    4.  在创建批量预测作业时将\
  \ generateExplanation 字段设置为 true。\n\n8.  您是一名在航空行业工作的数据科学家。您被指派创建一个识别飞机的模型。数据集中的图像质量较差。您的模型将鸟类识别为飞机。您会使用哪种方法来帮助解释此数据集的预测？\n\
  \n    1.  使用 Vertex AI 基于示例的解释。\n\n    2.  使用积分梯度技术进行解释。\n\n    3.  使用采样 Shapley\
  \ 技术进行解释。\n\n    4.  使用 XRAI 技术进行解释。\n\n### 第 10 章\n\n生产环境中的模型扩展\n\n在本章中，我们将介绍如何使用\
  \ TensorFlow Serving 部署模型并在生产环境中对其进行扩展。然后我们将介绍在 Google Cloud 上在线和批量提供模型服务的架构模式。我们还将介绍在\
  \ Google Cloud 中提供模型服务时的缓存策略。我们将讨论如何使用 Vertex AI Prediction 设置实时端点和批量作业。我们将介绍在生产环境中测试模型目标性能时面临的一些挑战。最后，我们将介绍用于自动化模型训练和预测流水线的触发器和流水线编排方式。\n\
  \n#### 扩展预测服务\n\n对于考试，您需要了解如何部署使用 TensorFlow 训练的模型。图 10.1 回顾了 TensorFlow 中的训练选项，以及我们使用\
  \ CPU、GPU 和 TPU 与 TensorFlow 所涵盖的各种分布式策略。训练完成后，您将获得一个 SavedModel。SavedModel 包含一个完整的\
  \ TensorFlow 程序，包括训练好的参数（即 `tf.Variables`）和计算图。它不需要原始的模型构建代码即可运行，这使其非常适合与 TensorFlow\
  \ Lite、TensorFlow.js、TensorFlow Serving 或 TensorFlow Hub 共享或部署。\n\n![图 10.1 TF 模型服务选项](img/c10f001.png)\n\
  \n**图 10.1** TF 模型服务选项\n\n当您调用 `tf.saved_model.save()` 时，得到的就是 SavedModel。SavedModel\
  \ 作为磁盘上的一个目录存储。该目录中的文件 `saved_model.pb` 是一个描述 `tf.Graph` 函数的协议缓冲区。\n\n##### TensorFlow\
  \ Serving\n\nTensorFlow (TF) Serving 允许您通过模型服务器将训练好的 TensorFlow 模型作为 API 端点托管。TensorFlow\
  \ Serving 处理模型服务和版本管理，并允许您提供模型服务。它允许您从不同来源加载模型。\n\nTensorFlow Serving 允许两种类型的 API\
  \ 端点：REST 和 gRPC。\n\n设置 TF Serving 的步骤如下：\n\n1.  使用 Docker 安装 TensorFlow Serving。\n\
  \n\n\n\n###### 2. 使用 TensorFlow 训练并保存模型。\n\n###### 3. 使用 TensorFlow Serving 服务已保存的模型。\n\
  \n更多信息请参阅 `www.tensorflow.org/tfx/serving/api_rest`。\n\n####### 使用 TensorFlow Serving\
  \ 服务已保存的模型\n\n运行在 host:port 上的 TensorFlow ModelServer 接受以下 REST API 请求：\n\n```\n\
  POST http://host:port/<URI>:<VERB>\n\nURI: /v1/models/${MODEL_NAME}[/versions/${MODEL_VERSION}]\n\
  VERB: classify|regress|predict\n```\n\n要调用 `predict()` REST 端点，您需要定义一个 JSON 数据载荷，因为\
  \ TF Serving 期望数据为 JSON 格式，如下所示：\n\n```\ndata = json.dumps({\"signature_name\":\
  \ \"serving_default\",\n \"instances\": instances.tolist()})\nheaders = {\"content-type\"\
  : \"application/json\"}\njson_response = requests.post(url, data=data, headers=headers)\n\
  predictions = json.loads(json_response.text)['predictions']\n```\n\n`signature_name`\
  \ 指定输入/输出数据类型。`instances` 是您想要预测的数据/输入/实例。您应该将其作为列表传递。\n\nTF Serving 为您处理所有模型和 API\
  \ 基础设施，以便您专注于模型优化。在考试中，可能会给您一个 TF Serving JSON 负载的实例和签名，并要求您提供 `predict()` 函数的输出。\n\
  \n以下是一个张量实例的示例：\n\n```\n{\n // 两个形状均为 [1, 2] 的张量列表\n \"instances\": [ [[1, 2]],\
  \ [[3, 4]] ]\n}\n```\n\n要了解您的 `predict()` 响应格式，您需要查看 SavedModel 的 SignatureDef（更多信息请参阅\
  \ `www.tensorflow.org/tfx/serving/signature_defs`）。您可以使用 SignatureDef CLI 来检查已保存的模型。给定的\
  \ SavedModel SignatureDef 包含以下输出：\n\n```\noutputs['class_ids'] tensor_info:\ndtype:\
  \ DT_INT64\nshape: (-1, 1)\nname: dnn/head/predictions/ExpandDims:0\noutputs['classes']\
  \ tensor_info:\ndtype: DT_STRING\nshape: (-1, 1)\nname: dnn/head/predictions/str_classes:0\n\
  outputs['logits'] tensor_info:\ndtype: DT_FLOAT\nshape: (-1, 3)\nname: dnn/logits/BiasAdd:0\n\
  outputs['probabilities'] tensor_info:\ndtype: DT_FLOAT\nshape: (-1, 3)\nname: dnn/head/predictions/probabilities:0\n\
  Method name is: tensorflow/serving/predict\n```\n\n根据前面的 SignatureDef，`predict()`\
  \ 请求会在响应体中返回一个 JSON 对象，如下面的代码所示：\n\n```\n{\n \"predictions\": [\n {\n \"class_ids\"\
  : [3],\n \"probabilities\": [2.0495e-7, 0.0243, 0.9756],\n \"classes\": [\"2\"],\n\
  \ \"logits\": [-5.74621, 5.94074, 9.62958]\n }\n ]\n}\n```\n\n前面的示例具有形状为 (−1,1)\
  \ 的类别 ID 整数、形状为 (−1,1) 的字符串类别、形状为 (−1,3) 的浮点数 logits 以及形状为 (−1,3) 的浮点数概率。\n\n由于类别\
  \ ID 和类别的形状均为 (−1,1)，因此它们在预测中将只有一个值。同样，对于概率和 logit，形状 (−1,3) 将在响应中给出三个张量值。−1 意味着我们可以向已保存的模型传递任意大小。\n\
  \n一旦模型在模型目录或文件夹中可用，TF Serving 会自动加载新模型。此外，当新模型版本可用时，TF Serving 会自动卸载旧模型并加载更新的版本。此技术非常高效，且可以轻松添加到\
  \ MLOps 流水线中。这有助于您更专注于模型优化，而不是模型服务基础设施。我们将在 第 11 章 \"设计 ML 训练流水线\" 中介绍使用 TFX/Kubeflow\
  \ 进行系统设计的主题。\n\n更多信息请参阅 `https://neptune.ai/blog/how-to-serve-machine-learning-models-with-tensorflow-serving-and-docker`。\n\
  \n#### 服务（在线、批量和缓存）\n\n在 第 5 章 \"ML 解决方案架构设计\" 中，我们介绍了 ML 系统中的两种服务选项：批量预测（或离线服务）和在线预测，以及它们推荐的架构。在本章中，我们将介绍一些关于您的服务和缓存策略的最佳实践。\n\
  \n##### 实时静态和动态参考特征\n\n有两类输入特征是实时获取以调用模型进行预测的：静态参考特征和动态参考特征。让我们看 表 10.1 以了解它们的区别。\n\
  \n###### **表 10.1** 静态特征与动态特征\n\n| 静态参考特征 | 动态实时特征 |\n| --- | --- |\n| 它们的值不会实时变化。相反，这些值通常通过批量方式更新。\
  \ | 实时特征是在事件流处理流水线中即时计算的。 |\n| 这些类型的特征通常在数据仓库中可用——例如，客户 ID 和电影 ID。 | 对于实时特征，您需要特定时间段内特定窗口（固定、滑动或会话）的聚合值列表，而不是该时间段内值的总体聚合。\
  \ |\n| 用例包括根据房屋位置估算房价，或根据客户当前正在查看的产品属性推荐相似产品。 | 用例可以是根据实时传感器数据预测发动机在未来一小时内是否会故障。另一个用例可以是根据用户在当前会话期间查看的最后\
  \ N 篇文章列表，推荐下一篇要阅读的新闻文章。 |\n| 这些类型的静态参考特征存储在针对单点查找操作进行了优化的 NoSQL 数据库中，例如 Firestore。BigQuery\
  \ 未针对单点读取进行优化，例如，查询“为特定客户 ID 从多个表中选择 100 列”，结果是一行包含多列的数据。 | 您可以使用 Dataflow 流式流水线来实现动态特征读取的用例。对于动态特征创建，流水线实时捕获并聚合（求和、平均等）事件，并将它们存储在低延迟读/写数据库中。Cloud\
  \ Bigtable 是用于特征值的低延迟读/写数据库的一个不错选择。 |\n| 静态参考架构（请参阅 图 10.2）。 | 动态参考架构（请参阅 图 10.3）。\
  \ |\n\n![图 10.2 静态参考架构](img/c10f002.png)\n\n**图 10.2** 静态参考架构\n\n![图 10.3 动态参考架构](img/c10f003.png)\n\
  \n**图 10.3** 动态参考架构\n\n##### 预计算和缓存预测\n\n改善在线预测延迟的另一种方法是在离线批量评分作业中预计算预测，并将它们存储在像\
  \ Memorystore 或 Datastore 这样的低延迟读取数据存储中，以便在线服务。在这些情况下，客户端（移动端、Web、数据流水线工作器、后端或前端\
  \ API）不会调用模型进行在线预测。相反，假设预测存在，客户端会从数据存储中获取预计算的预测。该过程如下：\n\n1.  数据被摄取、处理并存储在键值存储中。\n\
  2.  一个训练并部署好的模型在准备好的数据上运行批量预测作业，为输入数据生成预测。每个预测由一个键标识。\n3.  数据流水线将按键引用的预测导出到针对单点读取进行了优化的低延迟数据存储中。\n\
  4.  客户端发送一个由唯一键引用的预测请求。\n5.  ML 网关使用条目键从数据存储中读取并返回相应的预测。\n\n客户端接收预测响应。图 10.4 展示了该流程。\n\
  \n![图 10.4 缓存架构](img/c10f004.png)\n\n**图 10.4** 缓存架构\n\n预测请求可用于两类查找键：\n\n\n\n\n\n\
  ##### 特定实体预测\n\n特定实体预测是指基于 ID（如 `customerid` 或 `deviceid`）或特定的输入特征组合，针对单个实体进行预测。如果实体过多（基数高），则很难在有限的时间内预先计算预测结果。一个例子是按商品预测日销量，此时您拥有数十万甚至数百万种商品。在这种情况下，您可以按照架构图采用混合方法，为排名前\
  \ N 位的实体（如最活跃的客户或浏览量最高的产品）预先计算预测结果。然后，您可以直接使用模型对其余实体进行在线预测。\n\n##### 特定输入特征组合\n\n\
  特定输入特征组合用于判断匿名或新客户是否会在您的网站上购买商品。当您拥有一组输入特征时，您需要创建一种哈希方法，其中键是所有可能输入特征的哈希组合，值则是预测结果。\n\
  \n##### Google Cloud 服务选项\n\n在 Google Cloud 中，您可以部署模型以进行在线预测或批量预测。您可以对 AutoML 模型和自定义模型同时执行批量预测和在线预测。在以下章节中，我们将介绍如何使用\
  \ Vertex AI 设置在线和批量作业。\n\n###### 在线预测\n\n要设置实时预测端点，您可能会遇到以下两种用例：\n\n*   **使用 Vertex\
  \ AI 训练在 Vertex AI 中训练的模型：** 这可以是 AutoML 模型或自定义模型，详见第 8 章“模型训练与超参数调优”。\n*   **在其他地方训练的模型（本地部署、其他云或本地设备）：**\
  \ 如果您已在其他地方训练好模型，则需要在部署和创建端点之前将模型导入 Google Cloud。\n\n如果您是作为预构建容器导入，请确保您的模型工件文件名与以下示例完全匹配：\n\
  \n*   **TensorFlow SavedModel：** `saved_model.pb`\n*   **scikit-learn：** `model.joblib`\
  \ 或 `model.pkl`\n*   **XGBoost：** `model.bst`、`model.joblib` 或 `model.pkl`\n\n如果您是导入自定义容器，则需要创建一个容器镜像，并根据自定义容器托管的要求，可能需要使用\
  \ `Cloud Build` 将镜像推送到 `Artifact Registry`。\n\n对于这两种选项，您都需要遵循以下步骤来设置 Vertex AI 预测：\n\
  \n1.  将模型资源部署到端点。\n2.  进行预测。\n3.  如果端点未被使用，则取消部署模型资源。\n\n####### 部署模型\n\n当您使用 Vertex\
  \ AI 预测端点部署模型时，您需要为端点的容器（TensorFlow、scikit-learn 或 XGBoost）指定自动扩缩配置。Vertex AI 会自动配置容器资源并为您的端点设置自动扩缩。您可以将多个模型部署到一个端点，也可以将一个模型部署到多个端点。有两种方式可以部署模型：使用\
  \ API 和使用 Google Cloud 控制台。\n\n######## 使用 API 部署模型\n\n您可以通过在 `Model` 资源上调用 Vertex\
  \ AI `deploy` 函数来部署模型。`deploy` 方法将创建一个端点，并将您的模型部署在该端点上。您需要提供流量分配、机器类型、GPU 和最小节点数来设置\
  \ `deploy` 方法。以下 `deploy` 函数返回一个 `Endpoint` 对象。\n\n```\nEndpoint = model.deploy(\n\
  \     deployed_model_display_name=DEPLOYED_NAME,\n     traffic_split=TRAFFIC_SPLIT,\n\
  \     machine_type=DEPLOY_COMPUTE,\n     accelerator_type=DEPLOY_GPU.name,\n   \
  \  accelerator_count=DEPLOY_NGPU,\n     min_replica_count=MIN_NODES,\n     max_replica_count=MAX_NODES,\n\
  \ )\n```\n\n上述 Vertex AI 函数接受以下参数：\n\n*   `deployed_model_display_name`：已部署模型的可读名称。\n\
  *   `TRAFFIC_SPLIT`：流向该模型的端点流量百分比，以一个或多个键值对字典的形式指定。\n    *   如果只有一个模型，则指定为 `{ \"\
  0\": 100 }`，其中 `\"0\"` 指代正在上传的此模型，100 表示 100% 的流量。\n    *   如果端点上存在现有模型且流量将被分配，则使用\
  \ `model_id` 指定为 `{ \"0\": percent, model_id: percent, ... }`，其中 `model_id` 是已部署端点上现有模型的模型\
  \ ID。百分比之和必须为 100。\n*   `machine_type`：用于训练的机器类型。\n*   `accelerator_type`：硬件加速器类型。\n\
  *   `accelerator_count`：附加到每个工作副本的加速器数量。\n*   `starting_replica_count`：最初预配的计算实例数量。\n\
  *   `max_replica_count`：扩缩的最大计算实例数量。在本教程中，仅预配一个实例。\n\n您可以使用上述 API 或 Google Cloud\
  \ 控制台来部署模型。\n\n######## 使用 Google Cloud 控制台部署模型\n\n如果您使用 GCP 控制台，可以通过前往模型注册表来部署模型。模型注册表是一个集中式的位置，用于跟踪\
  \ AutoML 和自定义模型的版本。您还可以选择要部署的版本。Vertex AI 训练的 AutoML 和自定义模型会自动出现在模型注册表中。您可以选择模型和版本，点击三个点，然后选择“部署到端点”来部署您的模型。\n\
  \n当您在模型注册表中点击“部署到端点”时，您将被重定向到定义端点的页面，如图 10.5 所示。在“模型设置”部分，您可以定义流量分配、计算资源和自动扩缩选项；在“模型监控”部分，您可以启用选项以监控生产环境中的模型是否存在偏移。\n\
  \n![图 10.5 部署到端点](img/c10f005.png)\n\n**图 10.5** 部署到端点\n\n####### 进行预测\n\n在通过端点运行数据之前，您需要对其进行预处理，以匹配您的自定义模型在\
  \ `task.py` 中定义的预期格式。使用 `Endpoint` 对象的 `predict` 函数，该函数接受以下参数：\n\n*   您将在每个预测的输出中看到该预测的置信度。\n\
  \n    ```\n    predictions = endpoint.predict(instances=x_test)\n    ```\n\n   \
  \ 您将获得一个 REST 端点 ID，您可以将其嵌入网站、API 网关或 App Engine 中，以创建用于实时预测的 ML 网关。\n\n*   如果您使用预构建容器通过\
  \ TensorFlow、scikit-learn 或 XGBoost 提供预测服务，您的预测输入实例需要格式化为 JSON。\n*   如果您的模型使用自定义容器，您的输入必须格式化为\
  \ JSON，并且有一个额外的参数字段可供您的容器使用。\n\n前往 Vertex AI GCP 控制台中的“端点”页面，选择端点，然后点击“示例请求”。您将获得关于如何预处理数据以使用端点进行\
  \ REST 和 Python 预测的说明，如图 10.6 所示。\n\n![图 10.6 示例预测请求](img/c10f006.png)\n\n**图 10.6**\
  \ 示例预测请求\n\n####### 模型不同版本的 A/B 测试\n\nA/B 测试对比机器学习中两个版本模型的性能，以查看哪一个更吸引访问者/观看者。它测试对照版本\
  \ (A) 与变体版本 (B)，根据您的关键指标衡量哪一个最成功。\n\n\n\n\n##### 将两个模型部署到同一端点\n\n将两个模型部署到同一端点，可让您逐步用一个模型替换另一个模型。在\
  \ A/B 测试场景中，如果您不想在应用中造成突发性变化，可以将新模型添加到同一端点，为其分配一小部分流量，然后逐渐增加新模型的流量分割比例，直到其承载 100%\
  \ 的流量。\n\n##### 使用流量分割进行 A/B 测试\n\n对于 Vertex AI 中的 A/B 测试，我们在部署模型时介绍了 `traffic-split`\
  \ 参数。您可以在将两个模型托管到同一端点时，向此 `traffic-split` 参数提供 `model_id` 和分割值，以拆分流量。以下是在 Cloud\
  \ Shell 中使用 `gcloud` 命令的示例：\n\n```\ngcloud ai endpoints update <Endpoint> --region=us-central1\
  \ \\\n  --traffic-split=[DEPLOYED_MODEL_ID=Value] --service-account=<Service account>\
  \ \\\n  --project=<Project> \\\n  --traffic-split=[DEPLOYED_MODEL_ID=VALUE,…]\n\
  ```\n\n在上述代码中，`traffic-split` 参数接受一个已部署模型 ID 列表，并将其值设置为 `traffic-split`。请查看此链接以了解有关部署模型参数的更多信息：\n\
  \n`https://cloud.google.com/sdk/gcloud/reference/ai/endpoints/update`\n\n由于资源与模型相关联而非端点，因此您可以将不同类型的模型部署到同一端点。然而，最佳实践是将特定类型的模型（例如\
  \ AutoML 文本、AutoML 表格、自定义训练）部署到一个端点。这种配置更易于管理。\n\n开箱即用方面，除了使用 `traffic-split` 之外，Vertex\
  \ AI 并不具备您通常用于 A/B 测试的所有功能，例如控制模型流量、实验、跟踪结果、对比等。\n\n不过，您可以结合 Vertex AI 模型评估功能与 Vertex\
  \ AI 模型监控来创建一套 A/B 测试方案。此功能目前处于实验性版本。\n\nVertex AI 模型评估功能允许您运行模型评估作业（在测试数据集上衡量模型性能），而无论使用哪种\
  \ Vertex 服务来训练模型（AutoML、托管流水线、自定义训练等），并可在 Vertex AI 模型注册表中跨多个模型存储和可视化评估结果。凭借这些功能，Vertex\
  \ AI 模型评估使用户能够决定哪些模型可以进入在线测试或投入生产，以及一旦投入生产后，何时需要重新训练模型。\n\n##### 取消部署端点\n\n如果您没有关键业务需求，仅需在一天中的几个小时或工作日期间让端点保持运行，则需要取消部署这些端点。运行中的端点会产生费用。因此，最好在不使用时取消部署它们。您可以使用\
  \ `undeploy` 函数来取消部署，如以下 Python 代码片段所示：\n\n```\ndeployed_model_id = endpoint.list_models()[0].id\n\
  endpoint.undeploy(deployed_model_id=deployed_model_id)\n```\n\n##### 发送在线解释请求\n\n\
  如果您已为模型配置了 Vertex Explainable AI，则可以获取在线解释。在线解释请求的格式与在线预测请求相同，返回的响应也类似；唯一的区别在于在线解释响应除了包含预测结果外，还包含特征归因。以下示例\
  \ Python 代码使用 Vertex AI Python SDK 发送在线解释请求：\n\n```\naiplatform.init(project=project,\
  \ location=location)\n\nendpoint = aiplatform.Endpoint(endpoint_id)\n\nresponse\
  \ = endpoint.explain(instances=[instance:dict], parameters={})\n```\n\n#### 批量预测\n\
  \n在批量预测中，您需要指向 Google Cloud Storage 中的模型和输入数据（生产数据），并运行批量预测作业。该作业使用模型对输入数据运行预测，并将预测输出保存在\
  \ Cloud Storage 中。\n\n您需要确保输入数据的格式符合 AutoML 模型（视觉、视频、图像、文本、表格）或自定义模型（预构建容器或自定义容器）的要求。要从自定义训练模型获取批量预测，请按照\
  \ 表 10.2 中所述的方式之一来准备输入数据。\n\n**表 10.2** Vertex AI 中批量训练的输入数据选项\n\n| 输入 | 说明 |\n\
  | --- | --- |\n| JSON Lines | 使用 JSON Lines 文件指定要进行预测的输入实例列表。将 JSON Lines 文件存储在\
  \ Cloud Storage 存储桶中。 |\n| TFRecord | 您可以选择使用 gzip 压缩 TFRecord 文件。将 TFRecord 文件存储在\
  \ Cloud Storage 存储桶中。Vertex AI 将 TFRecord 文件中的每个实例读取为二进制数据，然后对实例进行 base64 编码，作为一个键名为\
  \ `b64` 的 JSON 对象。 |\n| CSV 文件 | 在 CSV 文件中每行指定一个输入实例。第一行必须为表头行。您必须用双引号 (\") 括起所有字符串。\
  \ |\n| 文件列表 | 创建一个文本文件，其中每一行为指向文件的 Cloud Storage URI。示例：`gs://path/to/image/image1.jpg`。\
  \ |\n| BigQuery | 将 BigQuery 表指定为 `projectId.datasetId.tableId`。Vertex AI 将表中的每一行转换为一个\
  \ JSON 实例。 |\n\n与在线预测类似，您可以使用 Vertex AI API 或 Google Cloud 控制台来创建批量预测作业（请参阅 图 10.7）。\n\
  \n![图 10.7 控制台中的批量预测作业](img/c10f007.png)\n\n**图 10.7** 控制台中的批量预测作业\n\n您可以选择将输出写入\
  \ BigQuery 表或 Google Cloud Storage 存储桶。您还可以启用模型监控（预览版）以检测偏差。\n\n#### 在 Google Cloud\
  \ 上托管第三方流水线 (`MLflow`)\n\n在本节中，我们将介绍在 Google Cloud 上托管特定于 MLflow 的第三方流水线的各种方式。MLflow\
  \ (`https://mlflow.org/docs/latest/concepts.html`) 是一个用于管理端到端机器学习生命周期的开源平台。它与库无关，您可以将其与任何机器学习库以及任何编程语言配合使用。它主要解决四大功能：\n\
  \n*   **MLflow Tracking** 用于实验跟踪，以及记录和对比参数与结果。您可以将其视为类似于 Vertex AI Experiments，后者用于在\
  \ Vertex AI 中跟踪实验。我们将在即将到来的 第 14 章 中介绍实验。\n*   **MLflow Projects** 用于以可重用、可复现的形式打包\
  \ ML 代码，以便与其他数据科学家共享或迁移至生产环境。\n*   **MLflow Models** 用于管理和部署来自各种 ML 库的模型，以适配各种模型服务和推理平台。\n\
  *   **MLflow Model Registry** 用于提供一个中央模型存储，协作管理 MLflow Model 的完整生命周期，包括模型版本控制、阶段转换和注解。这类似于\
  \ Vertex AI Model Registry，后者是一个集中存储模型、支持版本控制和注解的场所。\n\n您可以单独使用这些组件中的每一个。例如，您可能只想使用\
  \ MLflow 来跟踪实验，而不使用 MLflow Model Registry 或 Projects。\n\n您会在 Google Cloud 上使用 MLflow，以利用\
  \ Google Cloud Vertex AI 平台为模型训练和托管提供的可扩展性和可用性。您可以访问 GPU、TPU 和 CPU 等高性能计算资源，在 Google\
  \ Cloud 上运行 MLflow 训练和托管工作负载。\n\n要在 Google Cloud 上运行或安装 MLflow：\n\n*   创建一个 PostgreSQL\
  \ 数据库，用于存储模型元数据。\n*   创建一个 Google Cloud Storage 存储桶，用于存储工件。\n*   创建一个 Compute Engine\
  \ 实例来安装 MLflow 并运行 MLflow 服务器，或者您可以在 Kubernetes 上使用 Docker 环境运行 MLflow Projects。\n\
  \n\n\n\n##### 您还可以使用 Google Cloud 插件运行 MLFlow，而无需安装 MLFlow 提供的 Docker 镜像。有关插件详情，请参阅此链接：\n\
  \n`https://pypi.org/project/google-cloud-mlflow`\n\n#### 测试目标性能\n\n在测试模型在生产环境中的性能时，您需要考虑以下事项：\n\
  \n*   您需要检查模型中的**训练-服务偏差**，并使用实时数据测试模型在生产环境中的质量。\n*   您可以在整个 ML 流水线中监控模型的生命周期和性能。\n\
  *   您可以测试模型权重和输出在数值上是否稳定。例如，在模型训练期间，您的权重和层输出不应为 `NaN` 或 `null`。您需要编写测试来检查模型权重和层输出的\
  \ `NaN` 和 `null` 值。此外，您需要测试某层输出中超过一半的值不为零。\n\nVertex AI 拥有诸如 `Vertex AI Model Monitoring`\
  \ 和 `Vertex AI Feature Store` 等服务，可帮助解决部署在生产环境中的模型的一些测试问题，例如检测偏差和监控模型随时间推移的性能。\n\
  \n如需了解详情，请参阅 `https://developers.google.com/machine-learning/testing-debugging/pipeline/production`。\n\
  \n#### 配置触发器和流水线计划\n\n对于本节，您需要知道如何根据用例在 Vertex AI 平台上触发训练或预测作业。\n\n例如，要触发实时预测作业，您可以在\
  \ Google Cloud App Engine 上设置预测端点，以创建无服务器 ML 网关。我们在本章前面的“服务（在线、批量和缓存）”一节中介绍了该架构模式。\n\
  \n以下是一些有助于创建触发器并在 Vertex AI 上安排训练或预测作业的服务：\n\n*   `Cloud Scheduler` 可帮助您设置 cron\
  \ 作业计划，以安排 Vertex AI 训练或预测作业。\n*   使用 `Vertex AI managed notebooks`，您可以使用 Jupyter\
  \ Notebook 执行和安排 Vertex 训练和预测作业。请参阅此链接了解详情：`https://cloud.google.com/vertex-ai/docs/workbench/managed/schedule-managed-notebooks-run-quickstart`。\n\
  *   `Cloud Build` 是 GCP 上的 CI/CD 产品。如果您想重新训练模型、构建 `Dockerfile` 并将其推送用于自定义训练，请使用\
  \ `Cloud Build` 启动它。`Cloud Run` 是用于部署容器的托管产品。假设您部署的容器是一个包含您模型的 Flask 或 FastAPI 应用。您可以使用\
  \ `Cloud Build` 将应用部署到 `Cloud Run`。\n*   您还可以使用事件驱动的无服务器 `Cloud Functions` 和 `Cloud\
  \ Pub/Sub`。`Cloud Functions` 是无服务器且无状态的函数即服务，而 `Pub/Sub` 实现了发布者-订阅者模式。您可以为 `Cloud\
  \ Function` 使用基于事件的 `Cloud Storage` 触发器，以便在存储桶中添加新版本的模型时，激活 `Cloud Function` 以启动部署。\n\
  \n当有多个 `Cloud Functions` 执行多项任务时，使用 `Cloud Function` 和 `Pub/Sub` 具有挑战性。例如，`Cloud\
  \ Function A` 触发数据转换，然后 `Cloud Function B` 触发模型训练，最后 `Cloud Function C` 部署模型。在这种情况下，您需要一个编排器来在流水线中编排这些事件。要使用\
  \ `Cloud Functions` 编排数据清洗、数据转换、模型部署和模型训练，您可以使用 `Cloud Workflows`。\n\n**Cloud Workflows**\
  \ 将多个基于 HTTP 的服务编排为持久且有状态的工作流。工作流非常适合将微服务链接在一起、自动化基础设施任务（如启动或停止 VM）以及与外部系统集成。工作流连接器还支持\
  \ Google Cloud 服务（如 `Cloud Storage` 和 `BigQuery`）中的简单操作序列。\n\n如果您不想使用 `Cloud Function`\
  \ 进行编排，请使用 `Cloud Scheduler` 和 `Workflows`。\n\nVertex AI 提供了编排选项，例如 表 10.3 中列出的\
  \ Vertex AI 流水线，我们将在下一章（第 11 章，“设计 ML 训练流水线”）中详细介绍。\n\n##### 表 10.3 ML 编排选项\n\n\
  | 选项 | 说明 |\n| --- | --- |\n| Vertex AI Pipelines | Vertex AI Pipelines 通过以无服务器方式编排\
  \ ML 工作流并使用 Vertex ML Metadata 存储工作流的工件，帮助您自动化、监控和治理 ML 系统。通过将 ML 工作流的工件存储在 Vertex\
  \ ML Metadata 中，您可以分析工作流工件的血缘关系。 |\n| Cloud Composer | Cloud Composer 旨在编排数据驱动的工作流（特别是\
  \ ETL/ELT）。它构建在 Apache Airflow 项目之上，但 Cloud Composer 是全托管的。Cloud Composer 支持您的流水线无论身在何处，包括本地部署或跨多个云平台。Cloud\
  \ Composer 中的所有逻辑（包括任务和调度）均以 Python 形式表示为有向无环图 (DAG) 定义文件。 |\n\n阅读此博客以获取更多信息：`https://cloud.google.com/blog/topics/developers-practitioners/choosing-right-orchestrator-google-cloud`。\n\
  \n#### 摘要\n\n在本章中，我们介绍了 TF Serving 在扩展预测服务方面的详细信息。\n\n我们讨论了 TF Serving 中的 `predict`\
