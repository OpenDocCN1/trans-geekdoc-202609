  \n    1.  使用 Document AI 解决方案。\n    2.  使用 Vision AI OCR 对文档进行数字化。\n    3.  使用 Google\
  \ Cloud Storage 存储文档。\n    4.  使用 `Cloud Bigtable` 存储文档。\n    5.  使用自定义 Vertex AI\
  \ 模型构建文档处理流水线。\n\n\n\n\n\n### 考试题目\n\n#### 6. 公共交通公司延迟预测模型架构\n\n你为一家公共交通公司工作，需要构建一个模型来估算多条交通路线的延迟情况。预测结果将实时直接提供给\
  \ App 中的用户。由于不同季节和人口增长会影响数据相关性，你将每月重新训练一次模型。你希望遵循 Google 推荐的最佳实践。应如何配置预测模型的端到端架构？\n\
  \n1.  配置 `Kubeflow Pipelines` 来调度从训练到部署模型的多步骤工作流。\n2.  使用在 `BigQuery ML` 上训练和部署的模型，并利用\
  \ `BigQuery` 的计划查询功能触发重新训练。\n3.  编写一个 `Cloud Functions` 脚本，在 `Vertex AI` 平台上启动训练和部署作业，由\
  \ `Cloud Scheduler` 触发。\n4.  使用 `Cloud Composer` 以编程方式调度 `Dataflow` 作业，执行从训练到部署模型的工作流。\n\
  \n#### 7. Keras 深度神经网络实验管理\n\n你需要设计一个定制的 Keras 深度神经网络，根据客户的购买历史预测其购买行为。你想使用多种模型架构探索模型性能，存储训练数据，并能在同一个仪表板中比较评估指标。你应该怎么做？\n\
  \n1.  使用 `AutoML Tables` 创建多个模型。\n2.  使用 `Cloud Composer` 自动执行多次训练运行。\n3.  在 `Vertex\
  \ AI` 平台上运行多个具有相似作业名称的训练作业。\n4.  在 `Kubeflow Pipelines` 中创建一个实验来组织多次运行。\n\n####\
  \ 8. 基于 GCS 新数据自动触发 Kubeflow 训练\n\n你与一个数据工程团队合作，该团队开发了一个管道来清理数据集并将其保存在 `Google Cloud\
  \ Storage` 存储桶中。你已经创建了一个 ML 模型，并希望在新数据可用时立即使用该数据刷新模型。作为 CI/CD 工作流的一部分，你希望在 `Google\
  \ Kubernetes Engine (GKE)` 上自动运行 `Kubeflow Pipelines` 训练作业。应如何设计此工作流架构？\n\n1.  配置带有\
  \ `Dataflow` 的管道，将文件保存在 `Google Cloud Storage` 中。文件保存后，在 `GKE` 集群上启动训练作业。\n2.  使用\
  \ `App Engine` 创建一个轻量级 Python 客户端，持续轮询 `Google Cloud Storage` 以查找新文件。一旦文件到达，立即启动训练作业。\n\
  3.  配置 `Google Cloud Storage` 触发器，在存储桶中有新文件可用时向 `Pub/Sub` 主题发送消息。使用由 `Pub/Sub` 触发的\
  \ `Cloud Function` 在 `GKE` 集群上启动训练作业。\n4.  使用 `Cloud Scheduler` 按固定时间间隔调度作业。作为作业的第一步，检查\
  \ `Google Cloud Storage` 存储桶中对象的时间戳。如果自上次运行以来没有新文件，则中止作业。\n\n#### 9. 数据科学团队实验跟踪与报告\n\
  \n你的数据科学团队需要快速尝试各种特征、模型架构和超参数。他们需要跟踪各种实验的准确率指标，并使用 API 随时间查询这些指标。在尽量减少人工工作的前提下，他们应该使用什么来跟踪和报告实验？\n\
  \n1.  使用 `Kubeflow Pipelines` 执行实验。导出指标文件，并使用 `Kubeflow Pipelines API` 查询结果。\n2.\
  \  使用 `Vertex AI Platform Training` 执行实验。将准确率指标写入 `BigQuery`，并使用 `BigQuery API`\
  \ 查询结果。\n3.  使用 `Vertex AI Platform Training` 执行实验。将准确率指标写入 `Cloud Monitoring`，并使用\
  \ `Monitoring API` 查询结果。\n4.  使用 `Vertex AI Workbench Notebooks` 执行实验。在共享的 `Google\
  \ Sheets` 文件中收集结果，并使用 `Google Sheets API` 查询结果。\n\n#### 10. 扫描表单数字化批量预测\n\n作为公司的首席\
  \ ML 工程师，你负责构建 ML 模型以数字化扫描的客户表单。你开发了一个 `TensorFlow` 模型，可将扫描图像转换为文本并将其存储在 `Google\
  \ Cloud Storage` 中。你需要在每天结束时对聚合数据使用 ML 模型，且尽量减少人工干预。你应该怎么做？\n\n1.  使用 `Vertex AI`\
  \ 平台的批量预测功能。\n2.  在 `Compute Engine` 中创建用于预测的服务管道。\n3.  每次摄入新数据点时使用 `Cloud Functions`\
  \ 进行预测。\n4.  在 `Vertex AI` 平台上部署模型并创建一个版本用于在线推理。\n\n#### 11. TensorFlow 数据从块存储迁移到\
  \ BigQuery\n\n作为首席 ML 架构师，你使用 `TensorFlow` 和 `Keras` 作为机器学习框架，数据以块存储形式存储在磁盘文件中。你正在迁移到\
  \ Google Cloud，并需要将数据以表格存储形式存储在 `BigQuery` 中。将使用以下哪种技术将 `TensorFlow` 存储数据从块存储迁移到\
  \ `BigQuery`？\n\n1.  `tf.data.dataset` reader for BigQuery\n2.  `BigQuery Python\
  \ Client library`\n3.  `BigQuery I/O Connector`\n4.  `tf.data.iterator`\n\n####\
  \ 12. 结构化数据集访问 BigQuery 方式（多选）\n\n作为一家专注于为结构化数据集构建 AI 模型的金融公司的 CTO，你决定将用于 ML 模型的大部分数据存储在\
  \ `BigQuery` 中。你的团队目前正在使用 `TensorFlow` 和其他框架。他们将如何修改代码以访问 `BigQuery` 数据来构建模型？（选择三项。）\n\
  \n1.  `tf.data.dataset` reader for BigQuery\n2.  `BigQuery Python Client library`\n\
  3.  `BigQuery I/O Connector`\n4.  `BigQuery Omni`\n\n#### 13. Vertex AI 中数据组织最佳实践\n\
  \n作为零售网站的首席数据科学家，你在 `PyTorch` 和 `TensorFlow` 中为 `Vertex AI Training` 开发了许多 ML 模型。你还使用\
  \ `Bigtable` 和 `Google Cloud Storage`。在大多数情况下，相同的数据用于多个模型和项目，并且会不断更新。在 `Vertex AI`\
  \ 中组织数据的最佳方式是什么？\n\n1.  `Vertex AI` 托管数据集\n2.  `BigQuery`\n3.  `Vertex AI Feature\
  \ Store`\n4.  `CSV`\n\n#### 14. Vertex AI 中 NLP 模型应避免的存储类型（多选）\n\n你是数据科学家团队负责人，团队在一家大型咨询公司工作。你正在开发一个\
  \ NLP 模型来对客户支持请求进行分类。你正在制定数据存储策略以存储 NLP 模型的数据。在 `Vertex AI` 的托管 GCP 环境中，你应该避免哪种类型的存储？（选择两项。）\n\
  \n1.  块存储\n2.  文件存储\n3.  `BigQuery`\n4.  `Google Cloud Storage`\n\n### 第 6 章：构建安全的\
  \ ML 管道\n\n在本章中，我们首先将讨论在 Google Cloud Platform 上管理数据的安全策略，涵盖从存储、处理到 ML 模型开发的全过程。我们还将简要介绍如何使用身份和访问管理\
  \ (IAM) 最佳实践，为数据科学团队提供对 `Vertex AI` 环境的安全访问。\n\n此外，我们将讨论用于管理敏感数据（如个人身份信息 (PII) 和受保护的健康信息\
  \ (PHI)）的 Google Cloud 服务和最佳实践。我们还将介绍一种使用 `Google Cloud Data Loss Prevention (DLP)\
  \ API` 大规模管理 PII 数据的架构。\n\n#### 构建安全的 ML 系统\n\n任何企业的关键任务之一是帮助确保其用户和员工数据的安全。Google\
  \ Cloud 提供内置的安全措施来促进数据安全，包括静态数据加密和传输中数据加密。让我们看看云系统中的静态加密和传输加密分别是什么。\n\n##### 静态加密\n\
  \n对于机器学习模型，你的数据将位于 `Cloud Storage` 或 `BigQuery` 表中。Google 默认对 `Cloud Storage` 和\
  \ `BigQuery` 中静态存储的数据进行加密。默认情况下，Google 管理用于保护数据的加密密钥。你也可以使用客户管理的加密密钥 (CMEK)。你可以使用带关联数据的认证加密\
  \ (AEAD) 加密函数在 `BigQuery` 中加密单个表值。请参考 `https://cloud.google.com/bigquery/docs/reference/standard-sql/aead-encryption-concepts`\
  \ 以了解 `BigQuery` AEAD 加密函数。\n\n\n\n\n\n#### 加密对比\n\n表 6.1 显示了服务端加密与客户端加密在云存储和 BigQuery\
  \ 方面的区别。\n\n**表 6.1** 服务端加密与客户端加密的区别\n\n| 服务端加密 | 客户端加密 |\n| --- | --- |\n| 云存储接收您的数据后、但数据写入磁盘并存储之前发生的加密。\
  \ | 数据发送到 Cloud Storage 和 BigQuery 之前发生的加密。此类数据到达 Cloud Storage 和 BigQuery 时已加密，但也会经历服务端加密。\
  \ |\n| 您可以使用 Google Cloud Key Management Service 创建和管理加密密钥。 | 您负责客户端密钥和加密操作。 |\n\
  \n#### 传输中加密\n\n为了保护数据在读写操作期间通过互联网传输时的安全，Google Cloud 使用传输层安全性 (TLS)。\n\n#### 使用中加密\n\
  \n使用中加密通过在数据处理过程中对其加密，保护内存中的数据免遭泄露或数据渗漏。`Confidential Computing` 通过在数据处理过程中对其加密，保护内存中的数据免遭泄露。您可以使用\
  \ Confidential VMs 和 Confidential GKE Nodes 对使用中的数据进行加密。阅读此博客以了解有关数据安全概念的更多详情：`https://cloud.google.com/blog/topics/developers-practitioners/data-security-google-cloud`。\n\
  \n#### 身份和访问管理\n\n身份和访问管理 (IAM) 是在 Google Cloud 中管理对数据和资源访问的方式。（有关 IAM 的更多信息，请参阅\
  \ `https://cloud.google.com/vertex-ai/docs/general/access-control`。）Vertex AI 使用\
  \ IAM 管理对资源的访问。您可以在项目级别或资源级别管理访问权限：\n\n*   **项目级角色**：要在项目级别授予对资源的访问权限，请向主体（用户、组或服务账号）分配一个或多个角色。服务账号是应用或计算工作负载的账号，而非个人最终用户的账号。服务账号主要用于创建\
  \ Vertex AI Workbench、Vertex AI 自定义训练和 Vertex AI 预测。\n\n*   **资源级角色**：要授予对特定资源的访问权限，请在该资源上设置\
  \ IAM 政策；该资源必须支持资源级政策。该政策定义将哪些角色分配给哪些主体。\n\n您可以使用这两个粒度级别来自定义权限。例如，您可以通过设置项目级政策，向所有\
  \ Vertex AI Feature Store 用户授予对所有特征存储的读取权限。Vertex AI Feature Store 以集中方式存储特征。对于一部分用户，您可以通过使用资源级政策，授予其对特定特征存储的写入权限。\n\
  \n以下是可在 Vertex AI 中使用的 IAM 角色：\n\n*   **预定义角色**允许您在项目级别向 Vertex AI 资源授予一组相关权限。Vertex\
  \ AI 的两个常见预定义角色是 Vertex AI 管理员和 Vertex AI 用户。\n\n*   **基本角色**（如所有者、编辑者和查看者）提供对 Vertex\
  \ AI 资源在项目级别的访问控制。这些角色适用于所有 Google Cloud 服务。\n\n*   **自定义角色**允许您选择一组特定权限，使用这些权限创建自己的角色，并将该角色授予组织中的用户。\n\
  \n并非所有 Vertex AI 预定义角色和资源都支持资源级政策。\n\n##### Vertex AI Workbench 的 IAM 权限\n\nVertex\
  \ AI Workbench 是 Google Cloud Platform (GCP) 提供的一项数据科学服务，它利用 JupyterLab 来探索和访问数据。在设置\
  \ Vertex AI Workbench 笔记本和资源（如模型作业、训练和部署）时，您可以选择要使用的 Virtual Private Cloud。Google\
  \ 为 Vertex AI Workbench 提供静态加密和传输中加密。\n\nVertex AI Workbench 有两种类型的 Vertex AI 笔记本：\n\
  \n*   **用户管理的笔记本**：用户管理的笔记本实例高度可定制，非常适合需要对其环境拥有大量控制权的用户。因此，与托管笔记本实例相比，用户管理的笔记本实例可能需要更多时间来设置和管理。您可以使用用户管理笔记本的\
  \ Metadata 部分中的标记来控制实例；但是，托管笔记本中不提供此选项。图 6.1 展示了如何创建用户管理的笔记本。\n\n*   **托管笔记本**：托管笔记本实例由\
  \ Google Cloud 管理，因此比 Vertex AI Workbench 用户管理的笔记本实例定制性较低。托管笔记本的一些优势包括 JupyterLab\
  \ 中与 Cloud Storage 和 BigQuery 的集成，以及在笔记本实例不使用时自动关闭。在图 6.2 中，您可以看到 MANAGED NOTEBOOKS\
  \ 标签页上创建的托管笔记本。您也可以在 USER-MANAGED NOTEBOOKS 标签页上找到用户管理的笔记本。\n\n![图 6.1 创建用户管理的 Vertex\
  \ AI Workbench 笔记本](img/c06f001.png)\n\n**图 6.1** 创建用户管理的 Vertex AI Workbench 笔记本\n\
  \n![图 6.2 托管的 Vertex AI Workbench 笔记本](img/c06f002.png)\n\n**图 6.2** 托管的 Vertex\
  \ AI Workbench 笔记本\n\n为用户管理和托管笔记本设置用户访问模式（权限）有两种方式：\n\n*   **仅单个用户**：仅单个用户访问模式仅向您指定的用户授予访问权限。\n\
  \n*   **服务账号**：服务账号访问模式向服务账号授予访问权限。您可以通过此服务账号向一个或多个用户授予访问权限。要将服务账号与 Google Cloud\
  \ CLI 结合使用，您需要在代码运行的位置设置环境变量。\n\n图 6.3 显示了设置托管笔记本的权限。\n\n![图 6.3 托管 Vertex AI Workbench\
  \ 笔记本的权限](img/c06f003.png)\n\n**图 6.3** 托管 Vertex AI Workbench 笔记本的权限\n\n在本节中，我们介绍了配置\
  \ Vertex AI Workbench 所需的 IAM（身份和访问管理）角色和权限。我们还介绍了如何使用服务账号和单用户访问来访问 Vertex AI Workbench\
  \ 的 JupyterLab 笔记本。现在让我们讨论如何使用 Vertex AI 保护网络安全。\n\n##### 使用 Vertex AI 保护网络安全\n\n\
  在深入了解如何使用 Vertex AI 保护网络安全之前，您应该了解 Google Cloud 共担责任模型和共担命运模型。在确定如何最好地保护您在 Google\
  \ Cloud 上的数据和工作负载时，理解这些术语非常重要。\n\n**共担责任模型**：根据 Google 共担责任模型，云提供商必须监控并响应与云本身及其底层基础设施相关的安全威胁。同时，最终用户（包括个人和公司）负责保护他们存储在任何云环境中的数据和其他资产。\n\
  \n**共担命运模型**：此模型旨在解决共担责任模型未涉及的挑战。共担命运侧重于各方如何更好地互动以持续改进安全性。共担命运建立在共担责任模型之上，因为它将云提供商与客户之间的关系视为一种持续改进安全性的长期合作伙伴关系。共担命运有几个组成部分：\n\
  \n*   **入门帮助**：安全蓝图，让您使用基础设施即代码 (IaC) 部署和维护安全解决方案。蓝图默认启用安全建议，例如 Vertex AI Workbench\
  \ 笔记本蓝图。\n\n*   **风险保护计划**\n\n\n\n\n\n##### 保障工作负载与治理\n\n要了解更多关于这些概念的信息，请参阅：\n\n\
  `https://cloud.google.com/architecture/framework/security/shared-responsibility-shared-fate`\n\
  \n考试中不会测试这些概念。不过，对这些概念的基本理解有助于您理解 Google Cloud 中数据和访问是如何受到控制的。\n\n现在我们将介绍如何保护以下内容：\n\
  \n*   Vertex AI Workbench 笔记本环境\n*   Vertex AI 端点（公共端点与私有端点）\n*   Vertex AI 训练作业\n\
  \n###### 保护 Vertex AI Workbench\n\n默认情况下，您的托管笔记本实例使用 Google 托管网络。（我们在上一节介绍了如何使用\
  \ IAM 保护 Vertex AI Workbench。）保护 Workbench 的一些最佳实践如下：\n\n*   **使用私有 IP 地址** Vertex\
  \ AI Workbench 默认分配公共 IP 地址，这会增加攻击面并暴露敏感数据。最佳实践是在创建 Workbench 时使用私有 IP 地址。要创建私有\
  \ Vertex AI Workbench，您需要指定 `--no-public-ip` 命令。以下是使用私有 IP 地址创建 Workbench 的 Google\
  \ CLI 命令：\n\n```\ngcloud beta notebooks instances create example-instance \\\n \
  \ --vm-image-project=deeplearning-platform-release \\\n  --vm-image-name=tf2-2-1-cu101-notebooks-20200110\
  \ \\\n  --machine-type=n1-standard-4 \\\n  --location=us-central1-b \\\n  --no-public-ip\n\
  ```\n\n*   **将您的实例连接到同一项目中的 VPC 网络** 要将托管笔记本实例连接到与您的托管笔记本实例位于同一项目中的 VPC 网络，您需要配置私有服务访问。私有服务访问使您能够访问托管在\
  \ VPC 网络中的内部 IP 地址。如果您希望 VPC 网络中的虚拟机实例使用内部 IP 地址而不是外部 IP 地址，这非常有用。请参阅此链接了解更多信息：\n\
  \n`https://cloud.google.com/vpc/docs/private-services-access`\n\n*   **共享 VPC 网络**\
  \ 您还可以指定位于您项目内的 VPC 网络，或您有权访问的共享 VPC 网络。如果您指定了 VPC 或共享 VPC 网络，该网络需要建立私有服务访问连接。共享\
  \ VPC 允许组织将来自多个项目的资源连接到一个通用的虚拟私有云 (VPC) 网络，以便它们可以通过使用该网络中的内部 IP 地址安全高效地相互通信。\n\n\
  \    *   **VPC Service Controls** 这是一项功能，允许您控制 VPC 中可用的服务。您可以使用 VPC Service Controls\
  \ 允许或拒绝对特定服务的访问，或限制特定服务可产生的流量。当您使用 VPC Service Controls 保护 Vertex AI 时，以下工件无法离开您的服务边界：\n\
  \n        *   AutoML 模型或自定义模型的训练数据\n        *   您创建的模型\n        *   在线预测请求\n   \
  \     *   批量预测请求的结果\n\n###### 保护 Vertex AI 端点\n\nVertex AI 提供了通过 Vertex AI 预测创建端点来托管模型的选项，这在\
  \ 第 10 章 \"Scaling Models in Production\" 中有介绍。有公共端点和私有端点。\n\n*   **公共端点** 此端点可公开访问互联网。默认情况下，在使用\
  \ Vertex AI 创建端点时可用此选项。\n\n*   **私有端点** 通过 Vertex AI Prediction 中的 VPC 对等连接，您可以建立私有连接与您的端点通信，而您的数据永远不会遍历公共互联网，从而提高了安全性并降低了在线预测的延迟。在使用私有端点之前，您首先需要在您的\
  \ VPC 网络与 Vertex AI 之间创建连接。\n\n从 Vertex AI 控制台设置私有端点非常简单。转到 Endpoint 并选择 Create\
  \ Endpoint。您将看到一个选择 Private 的选项。图 6.4 展示了如何在 Vertex AI 中创建私有端点。\n\n![FIGURE 6.4\
  \ Creating a private endpoint in the Vertex AI console](img/c06f004.png)\n\n**图\
  \ 6.4** 在 Vertex AI 控制台中创建私有端点\n\n要设置 VPC 网络对等连接，您可以配置 Vertex AI 与 VPC 对等，以直接连接\
  \ Vertex AI 中的特定资源，例如 第 8 章 \"Model Training and Hyperparameter Tuning\" 中介绍的自定义训练作业、私有预测端点和\
  \ Vertex AI Matching Engine。\n\n###### 保护 Vertex AI 训练作业\n\n使用私有 IP 地址连接到您的训练作业，比使用公共\
  \ IP 地址提供更高的网络安全性和更低的网络延迟。要使用私有 IP 地址，您可以使用 VPC 将您的网络与任何类型的 Vertex AI 自定义训练作业对等连接。这允许您的训练代码访问您的\
  \ Google Cloud 或本地网络内的私有 IP 地址。更多信息请参阅 `https://cloud.google.com/vertex-ai/docs/training/using-private-ip`。\n\
  \n在以下章节中，我们将介绍联邦学习、差分隐私和令牌化等概念。\n\n###### 联邦学习\n\n根据 Google AI 博客 `https://ai.googleblog.com/2017/04/federated-learning-collaborative.html`，*联邦学习*\
  \ 是一种技术，用于使移动电话能够协作学习共享预测模型，同时将所有训练数据保留在设备上。设备下载模型并从设备数据中学习。然后通过加密通信将此更新后的模型发送到云端。由于所有训练数据都保留在您的设备上，联邦学习在确保隐私的同时，实现了更智能的模型、更低的延迟和更低的功耗。\n\
  \n一个例子是全球一组参与同一临床试验的医院。单个医院收集的患者数据不在医院外部共享。因此，医院无法将患者数据传输或共享给第三方。联邦学习让关联医院能够在仍保留每家医院内部患者数据的安全性、隐私和控制权的同时，使用所有医院共享的中心化模型训练共享机器学习模型。该模型在医院本地训练数据，仅将模型更新发送回中心化云服务器。模型更新被解密、平均并集成到中心化模型中。迭代轮次进行，协作训练持续进行，直到模型完全训练完成。这样，联邦学习将进行机器学习的能力与在云端存储数据的需求解耦了。更多信息请参阅此链接：`https://cloud.google.com/architecture/federated-learning-google-cloud`。\n\
  \n###### 差分隐私\n\n根据 `https://en.wikipedia.org/wiki/Differential_privacy`，*差分隐私 (DP)*\
  \ 是一种系统，通过描述数据集内个体群组中的模式来公开共享关于数据集的信息，同时隐瞒数据集中每个个体的信息。例如，为医学诊断训练机器学习模型，我们希望拥有不会记住训练集敏感信息（如个别患者的具体病史）的机器学习算法。差分隐私是一种概念，允许量化算法为其运行的底层（敏感）数据集提供的隐私保护程度。通过差分隐私，我们可以设计负责任地在私有数据上训练模型的机器学习算法。\n\
  \n###### 格式保留加密与令牌化\n\n\n\n\n\n#### 格式保留加密 (FPE)\n\n**格式保留加密**，或 **FPE**，是一种在加密过程中保留信息格式的加密算法。它是以这样的方式加密数据，使得输出（密文）与输入（明文）保持相同的格式。更多信息请参阅\
  \ `https://en.wikipedia.org/wiki/Format-preserving_encryption`。\n\n此技术有两个用例，如下所示：\n\
  \n*   **支付卡验证：** 在零售和电子商务领域，必须收集并存储支付卡数据以进行支付。此外，员工可能需要查看并验证客户支付卡信息的后四位数字。FPE 使得仅向员工暴露所需信息变得更加容易，同时让其他\
  \ 12 位数字保持受保护状态。\n*   **遗留数据库：** 电信系统可能拥有大量需要使用加密数据以保障安全的遗留系统。但是，重构数据库以存储加密数据可能不是该组织的可选方案。借助\
  \ FPE，数据库的结构可以保持不变。（更多信息请参阅 `www.ubiqsecurity.com/what-is-format-preserving-encryption-fpe-and-its-benefits`。）\n\
  \n#### 令牌化\n\n**令牌化** 是指用一个称为令牌的替代值来替换一段敏感数据（如信用卡号）的过程。敏感数据通常仍需安全地存储在一个中心位置，以供后续参考，并需要对其采取强有力的保护措施。令牌化方法的安全性取决于敏感值的安全性，以及用于创建替代值并将其映射回原始值的算法和过程。\n\
  \nFPE 对敏感信息进行混淆，而令牌化则将其完全移除（至另一位置）。\n\n#### 数据使用和收集的隐私影响\n\n在以下章节中，我们将介绍数据中的**个人身份信息\
  \ (PII)** 和**受保护健康信息 (PHI)**，以及 Google Cloud 建议的处理敏感数据的策略。\n\nPII 是一类允许识别特定个人身份的数据。它包括与特定个人相关的任何信息，例如姓名、地址、社会安全号码\
  \ (SSN)、出生日期、财务信息、护照号码、电话号码和电子邮件地址。\n\n《健康保险流通与责任法案》(HIPAA) 隐私规则为受保护实体持有的 PHI 提供联邦保护，并赋予患者关于该信息的一系列权利。同时，隐私规则在保护与披露之间取得了平衡，允许为患者护理和其他重要目的所需的个人健康信息披露。\n\
  \n##### Google Cloud Data Loss Prevention\n\n**Google Cloud Data Loss Prevention\
  \ (DLP) API** 可以对文本内容（包括存储在表格等容器结构中的文本）中的敏感数据进行去标识化。**去标识化** 是从数据中移除识别信息的过程。该 API\
  \ 检测 PII 等敏感数据，然后使用去标识化转换来掩盖、删除或以其他方式模糊化数据。\n\n所使用的去标识化技术如下：\n\n*   通过用符号（如星号 (`*`)\
  \ 或井号 (`#`)）部分或完全替换字符，来掩盖敏感数据\n*   使用加密哈希等技术，用令牌替换每个敏感数据实例\n*   使用随机生成或预先确定的密钥，对敏感数据进行加密并替换\n\
  *   使用分桶技术，用区分度较低的值替换区分度较高的值\n\n以下是与 DLP 相关的一些关键概念：\n\n*   **数据概要文件：** 数据分析器可让您通过识别敏感数据和高风险数据的驻留位置，来保护整个组织中的数据。当您开启数据分析时，Cloud\
  \ DLP 会自动扫描整个组织、单个文件夹和项目中的所有 BigQuery 表和列。随后，它会在表级、列级和项目级创建数据概要文件。\n*   **风险分析：**\
  \ 您可以在去标识化之前使用风险分析方法，以帮助确定有效的去标识化策略；也可以在去标识化之后使用，以监控任何变化或异常值。Cloud DLP 可以计算四种重识别风险指标：`k`-匿名性、`l`-多样性、`k`-映射和\
  \ `δ`-存在性。（更多信息请参阅 `https://cloud.google.com/dlp/docs/concepts-risk-analysis`。）\n\
  *   **检查（作业和触发器）：** **作业** 是 Cloud Data Loss Prevention 为扫描敏感数据内容或计算重识别风险而运行的一个操作。每当您指示\
  \ Cloud DLP 检查数据时，它就会创建并运行一个作业资源。您可以通过创建作业触发器来安排 Cloud DLP 运行作业的时间。**作业触发器** 是一种事件，它可自动创建\
  \ DLP 作业以扫描 Google Cloud Storage 存储库，包括 Cloud Storage 存储桶、BigQuery 表和 Datastore。每当有文件上传到\
  \ Cloud Storage 时，您也可以使用 Cloud Functions 触发 DLP 扫描作业。\n\nDLP 提供了可帮助您设置 DLP 作业的模板（即配置）；请参阅\
  \ 图 6.5。\n\n![图 6.5 使用 DLP 对大型数据集中的 PII 进行去标识化的架构](img/c06f005.png)\n\n**图 6.5**\
  \ 使用 DLP 对大型数据集中的 PII 进行去标识化的架构\n\n该架构包含以下组成部分：\n\n*   **数据去标识化流式管道：** 使用 Dataflow\
  \ 对文本中的敏感数据进行去标识化。如果您有流式数据传入，可以使用 Dataflow 触发 DLP 作业以对数据进行去标识化，并将其存储在 Google Cloud\
  \ Storage 中，或将去标识化的数据填充到 BigQuery 表中。您也可以在 Cloud Storage 中存储的批量数据上运行 DLP 作业。\n*\
  \   **配置（DLP 模板和密钥）管理：** 您可以让一小部分人作为安全管理员来管理 DLP 作业的模板和配置，并使用 Cloud KMS（密钥管理服务）以避免暴露去标识化方法和加密密钥。\n\
  *   **数据验证和重识别管道：** 您可以对批量和流式数据进行去标识化，并作为 DLP 作业输出存储在 BigQuery 中。您也可以选择将其存储在其他类型的存储中。您可以验证去标识化数据的副本，并使用\
  \ Dataflow 管道大规模重识别数据。\n\n##### 用于 PHI 识别的 Google Cloud Healthcare API\n\n根据美国《健康保险流通与责任法案》(HIPAA)，基于\
  \ 18 个标识符列表（如姓名、病历号、社会安全号码、IP 地址等）关联的 PHI 必须受到特殊保护。有关标识符的完整列表，请参阅此 Wikipedia 页面：`https://en.wikipedia.org/wiki/Protected_health_information`。\n\
  \n**Google Cloud Healthcare API** 具有去标识化操作，可从医疗数据中移除 PHI 或其他敏感信息。Healthcare API\
  \ 的去标识化功能具有高度可配置性，可从文本、图像、快速医疗保健互操作资源 (FHIR) 以及医学数字成像和通信 (DICOM) 数据中编辑 PHI。来源 `https://cloud.google.com/healthcare-api/docs/concepts/de-identification`\
  \ Cloud Healthcare API 还会检测 DICOM 实例和 FHIR 数据中的敏感数据（如受保护的 PHI），然后使用去标识化转换来掩盖、删除或以其他方式模糊化数据。\n\
  \n去标识化命令针对的 PHI 包括 HIPAA 隐私规则去标识化标准中描述的 18 个标识符。由于去标识化的健康信息不再被视为受保护的健康信息，因此 HIPAA\
  \ 隐私规则不限制其使用或披露。\n\n\n\n\n\n#### 对于 CSV、BigQuery 表和文本字符串，开源 DLP API Dataflow 流水线（请参阅\
  \ GitHub 代码库 `https://github.com/GoogleCloudPlatform/healthcare-deid`）简化了在医疗保健数据上配置和运行\
  \ DLP API 的过程。\n\n#### 移除敏感数据的最佳实践\n\n根据数据集的结构，移除敏感数据需要不同的方法，如表 6.2 所示。\n\n**表 6.2**\
  \ 处理敏感数据的策略\n\n| 数据类型 | 使用的策略 |\n| --- | --- |\n| 数据仅限于结构化数据集中的特定列。 | 您可以创建一个不提供对相关列访问权限的视图。数据工程师无法查看数据，但同时数据是实时的，且不需要人工干预即可对其进行去标识化以用于持续训练。\
  \ |\n| 敏感数据是非结构化内容的一部分，但可以使用已知模式或正则表达式识别。 | 您可以使用 Cloud DLP 来处理此类数据。 |\n| 敏感数据存在于图像、视频、音频或非结构化自由格式数据中。\
  \ | 使用 NLP API、Cloud Speech API、Vision AI 和 Video Intelligence API 即开即用地识别电子邮件和位置等敏感数据，然后对其进行遮盖或移除。\
  \ |\n\n有关更多详情，请参阅 `https://cloud.google.com/architecture/sensitive-data-and-ml-datasets`。\n\
  \n保护多列数据的方法之一是使用 ML 算法（如主成分分析 (PCA)）或其他降维技术来组合多个特征，然后仅对生成的 PCA 向量进行 ML 训练，详见 `https://medium.com/lizuna/beacon-the-use-of-principal-components-analysis-to-mask-sensitive-data-in-machine-learning-7904b01445d0`。例如，给定年龄、吸烟者（用\
  \ 1 或 0 表示）和体重这三个不同字段，数据可能会被浓缩为单个 PCA 列，并使用以下公式：\n\n*   `1.5age + 30smoker + 0.2\
  \ * body‐weight`\n\n一位 20 岁、吸烟、体重 140 磅的人会生成 88 这个值。一位 30 岁、不吸烟、体重 215 磅的人生成的值也是\
  \ 88。\n\n这种方法非常稳健，因为即使识别出在某些方面独一无二的个体，如果没有 PCA 向量公式的解释，也很难确定是什么使他们独一无二。\n\n粗化是另一种用于降低数据粒度的技术，旨在使数据集中的敏感数据更难被识别，同时仍能提供与使用粗化前数据训练的模型相比可媲美的效果。表\
  \ 6.3 中的字段特别适合这种方法。\n\n**表 6.3** 处理数据中敏感字段的技术\n\n| 字段 | 说明 |\n| --- | --- |\n| IP\
  \ 地址 | 将 IPv4 地址的最后一个八位字节归零（如果使用 IPv6，则为最后 80 位）。 |\n| 数值 | 数字可以分箱，使其不太可能识别出个人；例如，年龄和生日可以转换为范围。\
  \ |\n| 邮政编码 | 可以粗化为仅包含前三位数字。 |\n| 位置 | 使用城市、州或邮政编码等位置标识符，或使用较大范围来混淆某一行的独特特征。 |\n\
  \n#### 摘要\n\n在本章中，我们讨论了在 Google Cloud 中用于管理机器学习数据的一些安全最佳实践，例如静态加密和传输中加密。\n\n我们还简要介绍了\
  \ IAM 以及如何使用 IAM 为您的数据科学团队提供和管理对 Vertex AI Workbench 的访问权限。我们介绍了一些安全 ML 开发技术，例如联邦学习和差分隐私。\n\
  \n最后，我们介绍了如何使用 Cloud DLP 和 Cloud Healthcare API 管理 PII 和 PHI 数据。我们还介绍了一种架构模式，说明如何大规模扩展\
  \ PII 识别和去标识化。\n\n#### 考试要点\n\n*   **构建安全的 ML 系统。** 了解 Google Cloud 的静态加密和传输中加密。知道静态加密和传输中加密如何用于在\
  \ Cloud Storage 和 BigQuery 中存储机器学习数据。知道如何设置 IAM 角色来管理 Vertex AI Workbench，以及如何为\
  \ Vertex AI Workbench 设置网络安全。最后，了解差分隐私、联邦学习和令牌化等概念。\n\n*   **理解数据使用和收集的隐私影响。** 了解\
  \ Google Cloud Data Loss Prevention (DLP) API 以及它如何帮助识别和遮盖 PII 类型的数据。此外，了解 Google\
  \ Cloud Healthcare API 以识别和遮盖 PHI 类型的数据。最后，了解移除敏感数据的一些最佳实践。\n\n#### 复习题\n\n1.  您是一家银行的\
  \ ML 安全专家，该银行拥有一个移动应用程序。您被要求为该应用构建一个基于 ML 的指纹身份验证系统，根据客户的指纹验证其身份。指纹无法下载到银行数据库中并存储。您应该推荐哪种学习策略来训练和部署此\
  \ ML 模型，并确保指纹的安全和受保护？\n\n    1.  差分隐私\n    2.  联邦学习\n    3.  令牌化\n    4.  Data Loss\
  \ Prevention API\n\n2.  您在一个不断壮大的团队中工作，该团队有 50 多名数据科学家，他们都使用 Vertex AI Workbench。您正在设计一种策略，以整洁且可扩展的方式组织作业、模型和版本。哪种策略管理程度最高且工作量最小？\n\
  \n    1.  在 Vertex AI 平台笔记本上设置限制性 IAM 权限，以便只有单个用户或组可以访问给定实例。\n    2.  将每位数据科学家的工作分离到不同的项目中，以确保每位数据科学家创建的作业、模型和版本仅对该用户可访问。\n\
  \    3.  使用标签将资源组织到描述性类别中。对每个创建的资源应用标签，以便用户在查看或监控资源时可以按标签筛选结果。\n    4.  为 Cloud\
  \ Logging 日志设置 BigQuery 接收器，并适当过滤以捕获有关 AI Platform 资源使用情况的信息。在 BigQuery 中，创建一个将用户映射到其正在使用的资源的\
  \ SQL 视图。\n\n3.  您是一家金融科技公司的 ML 工程师，正在从事一个创建文档分类模型的项目。您有一个包含大量 PII 的大数据集，无法分发或披露。您被要求用特定的替代字符替换敏感数据。以下哪种技术最适合使用？\n\
  \n    1.  格式保留加密或令牌化\n    2.  K-匿名性\n    3.  替换\n    4.  遮盖\n\n4.  您是一家教育科技公司的数据科学家，您的团队需要在\
  \ Vertex AI 平台上构建模型。您需要在 Google Colab Jupyter Notebook 上设置对 Vertex AI Python 库的访问权限。您有哪些选择？（选择三项。）\n\
  \n    1.  创建服务账号密钥。\n    2.  设置名为 `GOOGLE_APPLICATION_CREDENTIALS` 的环境变量。\n    3.\
  \  为您的服务账号授予 Vertex AI 用户角色。\n    4.  使用控制台密钥。\n    5.  创建私有账号密钥。\n\n5.  您是一名正在训练深度神经网络的数据科学家。您用于训练的数据包含\
  \ PII。您面临两个挑战：首先需要转换数据以隐藏 PII，还需要管理在 GCP 环境中各个组谁有权访问这些数据。Google 提供了哪些可供您使用的选择？（选择两项。）\n\
  \n    1.  网络防火墙\n    2.  Cloud DLP\n    3.  VPC 安全控制\n    4.  服务密钥\n    5.  差分隐私\n\
  \n\n\n\n### 6. Vertex AI Workbench 架构设计\n\n你是一名数据科学经理，公司最近迁移到 GCP。你需要为团队的 20 名数据科学家设置\
  \ JupyterLab 环境。你正在寻找一种**托管程度最低**且**具有成本效益**的方式来管理 Vertex AI Workbench，以便实例仅在数据科学家使用笔记本时运行。你会如何在\
  \ GCP 上设计此架构？\n\n1.  使用 Vertex AI 托管笔记本。\n2.  使用 Vertex AI 用户管理笔记本。\n3.  使用 Vertex\
  \ AI 用户管理笔记本，并配合脚本在不使用时停止实例。\n4.  使用 Vertex AI 管道。\n\n### 7. FHIR 数据 PHI 移除\n\n\
  你拥有快速医疗互操作资源（FHIR）数据，并正在构建一个文本分类模型来检测患者记录。你需要从数据中移除 PHI。你会使用哪个服务？\n\n1.  Cloud DLP\n\
  2.  Cloud Healthcare API\n3.  Cloud NLP API\n4.  Cloud Vision AI\n\n### 8. 实时预测引擎\
  \ PII 保护\n\n你是一家金融科技公司的 ML 工程师，正在构建一个实时预测引擎，该引擎将可能包含个人身份信息（PII）的文件流式传输到 GCP。你想使用\
  \ Cloud Data Loss Prevention (DLP) API 扫描文件。如何确保未经授权的个人无法访问 PII？\n\n1.  将所有文件流式传输到\
  \ Google Cloud，然后将数据写入 BigQuery。定期使用 DLP API 对表进行批量扫描。\n2.  将所有文件流式传输到 Google Cloud，并将数据批量写入\
  \ BigQuery。在数据写入 BigQuery 时，使用 DLP API 对数据进行批量扫描。\n3.  创建两个数据存储桶：敏感和非敏感。将所有数据写入非敏感存储桶。定期使用\
  \ DLP API 对该存储桶进行批量扫描，并将敏感数据移动到敏感存储桶。\n4.  定期使用 DLP API 对 Google Cloud Storage 存储桶进行批量扫描，并将数据移动到敏感或非敏感存储桶。\n\
  \n### 第 7 章 模型构建\n\n在本章中，我们将讨论训练大型神经网络时使用的数据并行和模型并行策略。然后我们将介绍一些建模技术，通过定义梯度下降、学习率、批次大小和轮数等重要概念来阐述神经网络中的相关内容。接着你将了解在训练神经网络时更改这些超参数（批次大小、学习率）会发生什么。\n\
  \n我们将讨论迁移学习，以及如何在数据集有限时使用预训练模型来启动训练。\n\n随后我们将介绍半监督学习及其适用场景。我们还将介绍数据增强技术及其在 ML 流水线中的应用。最后，我们将介绍偏差和方差等关键概念，并讨论它们如何导致欠拟合和过拟合模型。我们还将介绍针对欠拟合和过拟合模型的策略，并详细说明用于过拟合模型的正则化策略。\n\
  \n#### 框架选择与模型并行性\n\n现代深度学习模型的参数数量越来越大，数据集规模也在急剧增加。要在大型数据集上训练复杂的现代深度学习模型，必须使用多节点训练；否则耗时极长。在分布式深度学习训练中，你总会看到数据并行性和模型并行性。\n\
  \n##### 数据并行性\n\n**数据并行性**是指将数据集拆分为多个部分，然后分配给并行的计算机器或图形处理单元（GPU）。对于每个 GPU 或节点，前向传播使用相同的参数。一小批数据被发送到每个节点，梯度正常计算并发回主节点。分布式训练实践中有两种策略：**同步**和**异步**。对于数据并行性，如果计算节点过多，我们必须降低学习率以保持平滑的训练过程。详情请参考\
  \ `https://analyticsindiamag.com/data-parallelism-vs-model-parallelism-how-do-they-differ-in-distributed-training`。\n\
  \n###### 同步训练\n\n在同步训练中，模型将数据的不同部分发送到每个加速器或 GPU。每个 GPU 拥有模型的完整副本，并仅在数据的一部分上进行训练。每个部分同时开始前向传播，并计算不同的输出和梯度。同步训练使用全归约算法，从各个工作器和加速器收集所有可训练参数。\n\
  \n###### 异步训练\n\n同步训练难以扩展，且可能导致工作器有时处于空闲状态。在异步训练中，工作器在维护停机期间无需相互等待，所有工作器独立地在输入数据上训练并异步更新变量。一个例子是\
  \ TensorFlow 分布式训练的参数服务器策略。请参阅图 7.1 以了解带有参数服务器的数据并行性。\n\n![图 7.1 异步数据并行性](img/c07f001.png)\n\
  \n**图 7.1** 异步数据并行性\n\n##### 模型并行性\n\n在**模型并行性**中，每个模型被划分为多个部分，这与数据并行性类似。然后每个模型部分被放置在单个\
  \ GPU 上。\n\n模型并行性具有明显的优势。它可用于训练无法仅放入单个 GPU 的模型。例如，假设我们有 10 个 GPU，想要训练一个简单的 ResNet50\
  \ 模型。我们可以将前五层分配给 GPU 1，第二组五层分配给 GPU 2，依此类推，最后五层分配给 GPU 10。在训练期间，每次迭代中，前向传播必须先在 GPU\
  \ 1 中完成，GPU 2 等待来自 GPU 1 的输出。前向传播完成后，我们计算位于 GPU 10 中的最后几层的梯度，并更新 GPU 10 中那些层的模型参数。然后梯度反向传播到\
  \ GPU 9 中的前几层。每个 GPU/节点就像工厂流水线上的一个隔间；它等待来自前一个隔间的产品，并将自己的产品发送到下一个隔间。请参阅图 7.2，其中模型被拆分到各个\
  \ GPU 上。\n\n![图 7.2 模型并行性](img/c07f002.png)\n\n**图 7.2** 模型并行性\n\n增加深度学习模型的规模（层和参数）可提高复杂视觉模型的准确性。然而，单个\
  \ GPU 内存能容纳的最大模型规模是有限的。训练大型深度学习模型时，GPU 内存限制可能成为瓶颈。因此，可以使用模型并行性来克服在单个 GPU 上训练模型的相关限制。你可以将模型（层）拆分到多个\
  \ GPU 上。\n\n你可能希望将训练扩展到一台机器上的多个 GPU、网络中的多台机器（每台机器有 0 个或多个 GPU）或 Cloud TPU。`tf.distribute.Strategy`\
  \ 是一个用于跨多个 GPU、多台机器或 TPU 分发训练的 TensorFlow API。（请参阅 `www.tensorflow.org/guide/distributed_training`。）使用此\
  \ API，你只需极少的代码更改即可分发现有模型和训练代码。表 7.1 解释了在 TensorFlow 中哪些策略受支持以及适用场景。\n\n**表 7.1**\
  \ 使用 TensorFlow 的分布式训练策略\n\n| 策略 | 说明 |\n| --- | --- |\n| `MirroredStrategy` | 单机多\
  \ GPU 同步分布式训练。 |\n| `CentralStorageStrategy` | 同步训练但不镜像。 |\n| `MultiWorkerMirroredStrategy`\
  \ | 跨多个工作器的同步分布式训练，每个工作器可能有多个 GPU 或多台机器。 |\n\n\n\n\n#### 建模技术\n\n让我们回顾一下神经网络中的一些基本术语，这些术语可能会出现在考试题目中。\n\
  \n##### 人工神经网络\n\n人工神经网络（ANN）是最简单类型的神经网络；它们有一个隐藏层。前馈神经网络是 ANN 的一个经典示例。它们主要用于监督学习，其中数据大多是数值型和结构化的，例如回归问题。请参见图\
  \ 7.4。\n\n![FIGURE 7.4 Artificial or feedforward neural network](img/c07f004.png)\n\
  \n**图 7.4** 人工或前馈神经网络\n\n##### 深度神经网络 (DNN)\n\n深度神经网络（DNN）可以定义为具有额外深度的 ANN——即输入层和输出层之间隐藏层数量的增加。通常至少具有两层的神经网络即可称为\
  \ DNN，简称 `deep net`。请参见图 7.5 以了解 DNN。\n\n![FIGURE 7.5 Deep neural network](img/c07f005.png)\n\
  \n**图 7.5** 深度神经网络\n\n##### 卷积神经网络\n\n卷积神经网络（CNN）是一种专为图像输入设计的 DNN 网络。CNN 最适合图像分类任务，尽管它们也可用于接受图像作为输入的各种其他任务。\n\
  \n##### 循环神经网络\n\n循环神经网络（RNN）旨在处理数据序列。它们已被证明对于自然语言处理问题非常有效，在这些问题中，文本序列作为输入提供给模型。RNN\
  \ 在时间序列预测和语音识别方面也取得了一定的成功。最流行的 RNN 类型是长短期记忆（LSTM）网络。LSTM 可用于模型中以接受一系列输入数据并进行预测，例如分配类标签或预测序列中的下一个数值或数值。\n\
  \n神经网络使用随机梯度下降进行训练，要求你在设计和配置模型时选择一个损失函数。损失是一个数字，指示模型在单个示例上的预测有多糟糕。如果模型的预测完美，损失为零；否则，损失更大。训练模型的目标是找到一组权重和偏置，使其在所有示例上的平均损失较低。损失函数是神经网络的重要组成部分之一。损失无非是神经网络的预测误差。而计算损失的方法称为损失函数。简单来说，损失用于计算梯度。而梯度用于更新神经网络的权重。\n\
  \n##### 使用哪种损失函数\n\n重要的是，损失函数的选择与神经网络输出层中使用的激活函数直接相关。这两个设计要素是相互关联的。表 7.2 根据 ML 问题总结了损失函数。\n\
  \n**表 7.2** 基于 ML 问题的损失函数总结\n\n| | 输出 | 输出层配置或激活函数 | 损失函数 |\n|---|---|---|---|\n\
  | 回归问题 | 数值输出 | 一个具有线性激活单元的节点 | 均方误差 (MSE) |\n| 二分类问题 | 二元结果 | Sigmoid 激活单元 | 二元交叉熵、分类合页损失和平方合页损失\
  \ (Keras) |\n| 多分类问题 | 单标签多类 | Softmax 激活函数 | 分类交叉熵（用于独热编码数据）和稀疏分类交叉熵（用于整数） |\n\n\
  以下是 TensorFlow 多分类的示例代码片段。模型在输出层中必须为每个类别设置一个节点，并使用 softmax 激活函数。损失函数 `sparse_categorical_crossentropy`\
  \ 适用于整数编码的类标签（例如，某一类为 0，下一类为 1 等）。\n\n```\n#### define model\nmodel = Sequential()\n\
  model.add(Dense(10, activation='relu', kernel_initializer='he_normal', input_shape=(n_features,)))\n\
  model.add(Dense(8, activation='relu', kernel_initializer='he_normal'))\nmodel.add(Dense(3,\
  \ activation='softmax'))\n\n#### compile the model\nmodel.compile(optimizer='adam',\
  \ loss='sparse_categorical_crossentropy', metrics=['accuracy'])\n```\n\n##### 梯度下降\n\
  \n梯度下降算法计算起始点处损失曲线的梯度。损失的梯度等于曲线的导数（斜率）。梯度既有大小又有方向（向量），且始终指向损失函数最陡峭上升的方向。梯度下降算法沿着负梯度的方向迈出一步，以尽可能快地减少损失。\n\
  \n##### 学习率\n\n正如我们所知，梯度向量既有方向又有大小。梯度下降算法将梯度乘以一个称为学习率（有时也称为 `step size`）的标量，以确定下一个点。例如，如果梯度大小为\
  \ 2.5 而学习率为 0.01，则梯度下降算法将选取距离前一个点 0.025 的下一个点。\n\n##### 批次\n\n在梯度下降中，批次是指在单次迭代中用于计算梯度的示例总数。到目前为止，我们假设批次是整个数据集。非常大的批次可能会导致即使是单次迭代也需要很长的计算时间。\n\
  \n##### 批次大小\n\n批次大小是批次中的示例数量。例如，SGD 的批次大小为 1，而小批量的批次大小通常在 10 到 1,000 之间。批次大小在训练和推理期间通常是固定的；不过，TensorFlow\
  \ 允许动态批次大小。\n\n##### 轮次\n\n一个轮次意味着使用所有训练数据训练神经网络的一次迭代。在一个轮次中，我们恰好使用所有数据一次。一次前向传递和一次后向传递合计为一次传递。一个轮次由一个或多个批次组成。\n\
  \n##### 超参数\n\n我们介绍了损失、学习率、批次大小和轮次。这些是在训练 ML 模型时可以更改的超参数。大多数机器学习程序员会花费相当多的时间来调整学习率。\n\
  \n*   如果选择的学习率太小，学习将花费太长时间。\n*   相反，如果指定的批次大太大，模型计算可能需要更多时间。\n\n###### 调整批次大小\n\n\
  以下是调整批次大小的最佳实践：\n\n*   较小的小批量大小（不要太小）通常不仅比大批量大小导致训练算法的迭代次数更少，而且总体准确性更高；即在相同的训练时间内，神经网络性能更好。我们的平行坐标图也使一个关键的权衡变得非常明显：较大的批次大小训练时间较短，但准确性较低。\n\
  *   如果批次大小太小，训练会震荡；如果太大，训练将花费很长时间。\n*   然而，使用较小的批次大小可以让梯度在每个轮次中更新更频繁，这可能导致每个轮次的损失减少更多。此外，使用较小批次训练的模型泛化能力更好。\n\
  \n###### 调整学习率\n\n实现理想的学习率非常重要，原因如下：\n\n*   过低和过高的学习率都会导致时间和资源的浪费。\n\n\n\n\n\n####\
  \ 学习率与训练成本\n\n* 学习率越低，训练时间越长。\n* 训练时间越长，云 GPU 成本越高。\n* 学习率过高可能导致模型无法准确预测。\n* 学习率过小会导致训练耗时极长；过大则会导致训练过程震荡发散。\n\
  \n#### 迁移学习\n\n根据维基百科定义，*迁移学习*（https://en.wikipedia.org/wiki/Transfer_learning）是机器学习（ML）中的一个研究问题，侧重于存储解决某一问题时获得的知识，并将其应用于不同但相关的问题。例如，学习识别汽车获得的知识可应用于识别卡车。在深度学习中，迁移学习是一种技术：首先在一个与目标问题相似的问题上训练神经网络模型，然后将训练好的模型中的一层或多层用于在目标问题上训练的新模型中。\n\
  \n迁移学习是一种节省时间或获得更好性能的优化手段。\n\n* 可以使用可用的预训练模型，作为训练自己模型的起点。\n* 迁移学习使你能够针对数据量较少的问题开发模型。\n\
  \n#### 半监督学习\n\n半监督学习（SSL）是第三种学习类型。它是一种机器学习问题，涉及少量标记样本和大量未标记样本。半监督学习是一种`machine\
  \ learning`方法，在训练期间将少量`labeled data`与大量未标记数据相结合。它介于`unsupervised learning`（无标记训练数据）和`supervised\
  \ learning`（仅有标记训练数据）之间。\n\n##### 何时需要半监督学习\n\n当你没有足够的标记数据来生成准确模型，且没有资源获取更多数据时，可以使用半监督技术来扩大训练数据规模。\n\
  \n例如，假设你正在为一家大型银行开发欺诈检测模型。部分欺诈案例是已知的，但其他欺诈实例却在不知不觉中溜走了。你可以用已知的欺诈实例标记数据集，但其余数据将保持未标记状态。你可以使用半监督学习算法对数据进行标记，并用新标记的数据集重新训练模型。然后，将重新训练的模型应用于新数据，利用监督机器学习技术更准确地识别欺诈。然而，无法验证算法生成的标签是否\
  \ 100% 准确，导致结果不如传统监督技术可靠。\n\n以下是一些用例：\n\n* 欺诈检测或异常检测\n* 聚类\n* 语音识别\n* 网页内容分类\n*\
  \ 文本文档分类\n\n##### SSL 的局限性\n\n在极少量标记数据和大量未标记数据的情况下，半监督学习在分类任务中显示出良好效果。但这并不意味着它适用于所有任务。如果标记数据部分不能代表整体分布，该方法可能会失效。\n\
  \n#### 数据增强\n\n神经网络通常拥有大量参数。你需要向机器学习模型展示成比例的示例数量以获得良好性能。此外，所需参数数量与模型执行任务的复杂度成正比。\n\
  \n训练神经网络需要大量数据示例。在大多数用例中，很难找到包含大量示例的相关数据集。因此，为了获取更多数据或示例来训练神经网络，你需要对现有数据集进行微小改动——例如翻转、平移或旋转。神经网络会将这些视为不同的图像。这就是*数据增强*，即在数据有限的情况下，使用合成修改后的数据（方向、翻转或旋转）来训练神经网络。\n\
  \n即使你拥有大量数据，增加数据集中相关数据的数量也会有所帮助。在 ML 流水线中应用增强主要有两种方式：离线增强和在线增强。\n\n##### 离线增强\n\n\
  在离线增强中，你预先执行所有必要的转换，从本质上增加数据集的大小。这种方法适用于相对较小的数据集，因为数据集大小会按你执行的转换数量等比例增加。例如，通过旋转所有图像，可以将数据集大小增加\
  \ 2 倍。\n\n##### 在线增强\n\n在在线增强中，你在将小批量数据馈送给机器学习模型之前，对其执行数据增强转换。这也称为*即时增强*。这种方法适用于大数据集，因为你会将小批量数据馈送给模型。\n\
  \n以下列表包含一些针对图像的数据增强技术：\n\n* 翻转\n* 旋转\n* 裁剪\n* 缩放\n* 高斯噪声（添加适量噪声以增强学习能力）\n* 平移\n\
  * 条件生成对抗网络（GANs），将一个域中的图像转换为另一个域中的图像\n* `Transfer learning`，在数据稀缺时给模型更好的机会\n\n####\
  \ 模型泛化及处理过拟合与欠拟合的策略\n\n训练神经网络模型时，存在两个重要概念：\n\n* **偏差：** 偏差是模型平均预测值与我们试图预测的正确值之间的差异。它实际上是训练数据的误差率。误差率高则偏差高，误差低则偏差低。高偏差模型很少关注训练数据，过度简化模型。\n\
  * **方差：** 测试数据的误差率称为方差。误差率高称为高方差，误差率低称为低方差。高方差模型过度关注训练数据，无法泛化到未见过的数据。因此，此类模型在训练数据上表现很好，但在测试数据上误差率很高。\n\
  \n训练一个能很好地泛化到新数据的深度神经网络是一个具有挑战性的问题。容量太小的模型无法学习问题，而容量太大的模型会过度学习并过拟合训练数据集。这两种情况都会导致模型泛化能力差。\n\
  \n##### 偏差-方差权衡\n\n你需要找到合适的平衡，避免过拟合或欠拟合数据。如果模型过于简单且参数很少，则可能具有高偏差和低方差。如果模型拥有大量参数，则会具有高方差和低偏差。这种复杂性的权衡就是偏差与方差之间存在权衡的原因。\n\
  \n欠拟合可以通过增加网络容量（权重）轻松解决，但过拟合需要使用专门技术。请参考 `www.geeksforgeeks.org/underfitting-and-overfitting-in-machine-learning`\
  \ 了解更多。\n\n##### 欠拟合\n\n欠拟合模型无法充分学习问题，在训练数据集上表现不佳，在测试或验证数据集上也不理想。在偏差-方差权衡背景下，欠拟合模型具有高偏差和低方差。无论训练数据中的具体样本如何，它都无法学习问题。导致模型欠拟合的原因有以下几点：\n\
  \n\n\n\n*   用于训练的数据未经过清洗。\n*   模型具有高偏差。\n\n过拟合模型的性能在训练数据集中未见过的样本上变化很大。以下是一些减少欠拟合的方法：\n\
  \n*   增加模型复杂度。\n*   通过特征工程增加特征数量。\n*   从数据中移除噪声。\n*   增加轮数或延长训练时长以获得更好的结果。\n\n####\
  \ 过拟合\n\n模型过度学习了训练数据，导致在新的未见样本上，甚至在训练数据集样本中添加统计噪声时，性能变化很大。过拟合模型具有低偏差和高方差。针对过拟合模型主要有两种处理思路：\n\
  \n*   通过在更多样本上训练网络来减少过拟合。\n*   通过改变网络结构和参数的复杂度来减少过拟合。\n\n以下是一些避免过拟合的方法：\n\n*   正则化技术：下一节将详细解释。\n\
  *   `Dropout`：训练期间以概率方式移除输入。\n*   `Noise`：训练期间向输入添加统计噪声。\n*   `Early stopping`：监控模型在验证集上的性能，当性能下降时停止训练。\n\
  *   数据增强。\n*   交叉验证。\n\n参考此链接了解避免过拟合的 10 种方法：`www.v7labs.com/blog/overfitting`。\n\
  \n#### 正则化\n\n正则化发挥作用，将学习到的估计值向 0 收缩。换句话说，它通过添加惩罚项来调整损失函数，防止系数过度波动，从而降低过拟合的风险。\n\
  \nL1 和 L2 是两种常见的正则化方法。当你试图减少特征时使用 L1，当你寻求稳定模型时使用 L2。表 7.3 总结了这两种技术的区别。\n\n**表 7.3**\
  \ L1 与 L2 正则化的区别\n\n| L1 正则化 | L2 正则化 |\n| --- | --- |\n| L1 正则化，也称为 L1 范数或套索（在回归问题中），通过将参数向\
  \ 0 收缩来对抗过拟合。这会使某些特征变得多余。因此，如果你有大量特征，这非常适合特征选择。 | L2 正则化，或 L2 范数或岭回归（在回归问题中），通过强制权重变小但不使其恰好为\
  \ 0 来对抗过拟合。 |\n| L1 正则化惩罚权重绝对值之和。 | L2 正则化惩罚权重平方和。 |\n| L1 正则化内置特征选择功能。 | L2 正则化不执行特征选择。\
  \ |\n| L1 正则化对异常值具有鲁棒性。 | L2 正则化对异常值不具鲁棒性。 |\n| L1 正则化有助于特征选择和减小模型规模，从而得到更小的模型。\
  \ | L2 正则化始终能改善线性模型的泛化能力。 |\n\n本节介绍了正则化。接下来我们将介绍训练神经网络时反向传播可能出错的常见方式及正则化对策：\n\n\
  *   **梯度爆炸：** 如果网络中的权重非常大，则较低层的梯度将涉及许多大项的乘积，导致梯度过大而无法收敛。批量归一化和降低学习率有助于防止梯度爆炸。\n\
  *   **ReLU 单元死亡：** 线性整流激活函数，简称 `ReLU`，是一种线性函数，如果输入为正则直接输出输入，否则输出 0。隐藏层使用整流函数的网络称为整流网络。一旦\
  \ `ReLU` 单元的加权和低于 0，该单元可能会卡住。它输出 0 激活值，不对网络输出做任何贡献，且在反向传播期间梯度无法再通过它流动。由于梯度来源被切断，`ReLU`\
  \ 的输入可能永远无 longer 变化足以使加权和重新回到 0 以上。降低学习率有助于防止 `ReLU` 单元死亡。\n*   **梯度消失：** 较低层（更接近输入层）的梯度可能变得非常小。当较低层的梯度向\
  \ 0 消失时，这些层训练得非常慢，或者根本不训练。`ReLU` 激活函数有助于防止梯度消失。\n*   **Dropout 正则化：** 这种正则化类型对神经网络很有用。它通过在单个梯度步骤中随机“丢弃”网络中的单元激活值来工作。丢弃得越多，正则化越强：\n\
  \    *   `0.0` = 无 Dropout 正则化。\n    *   `1.0` = 丢弃所有内容。模型什么也学不到。\n    *   `0.0`\
  \ 和 `1.0` 之间的值 = 更有用。\n\n损失目前表现良好，但如果你想进一步降低训练损失，可以尝试以下技术：\n\n*   增加神经网络的深度和宽度。\n\
  *   如果特征相对于现有特征没有增加信息量，尝试不同的特征。\n*   降低学习率。\n*   增加层的深度和宽度（以增强预测能力）。\n*   如果你有大量数据，使用留出的测试数据。\n\
  *   如果你数据很少，使用交叉验证或自助法。\n\n你训练的模型未收敛且在震荡。这可能是由于以下原因：\n\n*   特征可能没有预测能力。\n*   原始数据可能不符合定义的模式。\n\
  *   学习率似乎过高，需要降低它。\n*   减少训练集至少量样本以获得极低的损失。\n*   从一两个已知具有预测能力的特征（和一个简单模型）开始，看看模型是否优于你的基线。\n\
  \n#### 总结\n\n在本章中，我们讨论了模型并行和数据并行，以及使用模型并行和数据并行方法训练 `TensorFlow` 模型时的一些策略。\n\n你了解了建模技术，例如在训练神经网络时选择何种损失函数。我们涵盖了与训练神经网络相关的重要概念，如梯度下降、学习率、批量大小、轮数和超参数。\n\
  \n我们还介绍了这些超参数在训练神经网络时的重要性——例如，在训练网络时降低学习率或增加轮数会发生什么。\n\n我们讨论了迁移学习及其优势。我们还介绍了半监督学习：何时需要半监督学习及其局限性。\n\
  \n我们讨论了数据增强技术。当你有大型数据集时使用在线增强，当你有小型数据集时使用离线增强。我们还介绍了旋转和翻转等技术来增强现有数据集。\n\n最后，我们讨论了模型欠拟合、模型过拟合和正则化概念。\n\
  \n#### 考试要点\n\n*   **选择框架并行或模型并行。** 理解多节点训练策略以训练大型神经网络模型。策略可以是数据并行或模型并行。此外，了解可用于\
  \ `TensorFlow` 模型分布式训练的策略。\n*   **理解建模技术。** 理解何时使用哪种损失函数（稀疏交叉熵与分类交叉熵）。理解梯度下降、学习率、批量大小和轮数等重要概念。还要理解这些是超参数，并知道一些调整这些超参数的策略，以在训练模型时最小化损失或错误率。\n\
  *   **理解迁移学习。** 理解什么是迁移学习，以及它如何帮助利用有限数据训练神经网络，因为这些是在大型数据集上预训练的模型。\n\n\n\n\n### 核心知识点\n\
  \n#### 使用半监督学习 (SSL)\n理解半监督学习及其适用场景，同时掌握 SSL 的局限性。\n\n#### 使用数据增强\n理解数据增强及其在 ML\
