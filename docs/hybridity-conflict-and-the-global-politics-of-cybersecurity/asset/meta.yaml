- - '###'
  - 为什么网络行动的国家实践中缺失国际法？
- - '###'
  - 第一，“主权”的性质尚未定论。主权是国际法的一原则，由此推导出某些规则，包括禁止违反领土主权。简而言之，规则和原则都是国际法的渊.^(22) 规则指的是国际法的实际规范，主要源于条约或国际习惯法。原则指的是流向规则的更抽象概念。虽然各国对主权一般原则的存在表示认同，但对从该原则衍生的规则持有不同意见。英国等国家和学者认为主权是网络领域的国际法原则，而法国、伊朗和荷兰等国则认为它是一项规则.^(23)
- - '###'
  - 第二，对于什么是网络空间的国家主权没有共识。例如，对于国家是否有权对位于其他实体计算机上的数据（这些实体可能或可能在该国领土内）行使主权，存在争议。作为政治概念的主权与国际法视角下的主权的混淆了这种困惑。
