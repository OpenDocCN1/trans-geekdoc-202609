    # IV CONCLUSION


    In this paper, a learning-based fatigue detection method for asphalt pavement
    is developed. The experimental results show that this method has high accuracy
    in detecting various types of cracks and is of significance for the timely of
    fatigue cracks on asphalt pavement.


