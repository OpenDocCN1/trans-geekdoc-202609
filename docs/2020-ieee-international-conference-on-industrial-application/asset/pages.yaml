    # B. Pre-processing of crack image


    The pre-processing of fracture image is as follows: grayscale, histogram equalization
    operation processing noise, gamma correction processing. The specific processing
    steps are:


    Step 1: First, the original crack image is generated to the original image from
    three channels into a single channel image, which is convenient for subsequent
    processing [10];


    Step 2: On this basis, histogram equalization operation is performed. The histogram
    is the embodiment of distribution of gray values in an image. The image background
    has low contrast, single image brightness is generated in a narrow range. The
    high contrast with high contrast is needed to detect the characteristics of crack
    image, and the distribution is relatively narrow and uniformly distributed. Due
    to the characteristics of crack, the gap between crack and background is small,
    so equalization of gray pixel value is needed to make the crack distribution more
    obvious;


    Step 3: And the original crack image contains lot of random noise and soft noise
    processing, whereas the median filter is used for processing [11];


    Step 4: Gamma correction is performed on the image after equalization and to obtain
    the correct image. The formula is as follows:


    > $y = x^\gamma$$


    When $\gamma > 1$, the gray level of the left region is bright and the dark region
    of image is darker. When $\gamma < 1$, the gray level of the left region of brightness
    is stretched to brighter, and the right region is lighted. The overall brightness
    of the crack image is dark. Therefore, the parameter $\gamma < 1$ is used to increase
    the brightness contrast.


    # C. Segmentation and recognition of cracks image


