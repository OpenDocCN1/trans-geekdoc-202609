    **Abstract—Based on the research results**, this paper proposes a method for fatigue
    crack detection of asphalt pavement based on machine learning. Obtaining the crack
    data from public sets and manually collected data, the cracks are classified into
    three types: horizontal, longitudinal cracks and lateral cracks. The crack image
    is processed using histogram equalization operation, noise processing, and crack
    correction. After processing, the extraction and positioning of the image are
    performed. Since there are fractures in the extracted image, it is merged into
    a complete fracture region. On this basis, the crack detection network model of
    asphalt pavement based on the collected data is input to train the model, and
    the fatigue crack detection of asphalt pavement is realized. The experiment shows
    that the method is effective for all kinds of fractures, and the detection effect
    is ideal when the detection iteration reaches 10000 times.


    **Keywords—**Asphalt pavement, Fatigue crack, Fatigue crack detection, Deep learning.


    detection of cracks on asphalt pavement is is of great significance for reducing
    the probability of traffic accidents. The technology based on image analysis and
    processing is the basis for fatigue crack detection of asphalt pavement which
    has been developed since the early 1990s. In present, researchers at home and
    abroad have proposed various methods to detect cracks, such as the fatigue crack
    detection method of Asphalt Pavement based on strength threshold and morphology.


    Based on the above research results, this paper designs a machine learning-based
    crack detection method for asphalt pavement.


    # II METHOD DESIGN


    # **Data acquisition**


    In first, we collect the asphalt pavement fatigue crack data is composed of public
    data and manually collected data. The types of cracks are divided into three types:
    horizontal cracks, longitudinal cracks and mesh cracks.


    # **Enhance and fracture part**


    To perform a degree of enhancement on the manually collected data, the method
    is as:


    +   (1)It is a data enhancement method to fix the fracture image, that is to enhance
    the image surface smoothness.


    +   (2)It rotates the crack by rotating the original image clockwise or counterclockwise
    by an angle, generally the degree of rotation is 90° and 180°.


    +   (3)The random part of crack image is cropped and adjusted to the same size
    as the original image.


    +   (4)Perform translation on the crack image. When the crack is translated, it
    is necessary to assume that the background is image, which means that only the
    position of crack is preserved and the size does not change. The enhancement method
    of translation is very useful.


    +   (5)The random noise is added to the fracture image, to prevent the effect
    of over-smoothing while increasing the set data;


