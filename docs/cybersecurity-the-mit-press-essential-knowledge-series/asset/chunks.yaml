- fmt: '

    A computer virus is code that replicates by inserting itself into other programs.
    A program that a virus has inserted itself into is infected and referred to as
    the virus’s host. An important caveat is that viruses, in order to function, require
    their hosts; that is, a virus needs an existing host program in order to cause
    harm. For example, in order to get into a computer system, a virus may attach
    itself to some software utility (e.g., a word processing application). Launching
    the word processing application could then activate the virus that may, for instance,
    duplicate itself and disable malware detectors enabled on the computer system.
    A Trojan horse, or `Trojan`, is a type of malware that is often disguised as a
    legitimate application. Its goal is to gain system access by going in through
    the front door. A computer user is typically tricked into loading and executing
    `Trojans`. Once activated on a system, a `Trojan` can enable an attacker to spy
    on you, steal data, and open the back door to your system.


    ![](images/11656_006_fig_000.jpg)


    A virus needs an existing host program in order to cause harm.


    A logic bomb, or slag code, is malicious code that is programmed to damage a network
    under certain conditions. The logic bomb metaphorically explodes when it is triggered
    by specific events, such as a certain date or time, the deletion of a specific
    file, or the launch of an infected application.


    In contrast, worms do not need a host to cause damage. A computer worm replicates
    itself by executing its own code independent of any other program. Another distinction
    between viruses and worms is their propagation model. In general, viruses attempt
    to spread through programs/files on a single computer system. Worms, however,
    spread via network connections with the goal of infecting as many computer systems
    connected to the network as possible; recall the Morris worm example. Worms often
    hide within an `OS` that is either automated or otherwise invisible to the user.
    What gives them away is when their uncontrolled replication drains system resources,
    slowing or halting other tasks.


    A `zombie` (also known as a `bot`) is a computer that has been taken over by a
    remote attacker who then sets it up to forward spam and viruses to other computers
    on the internet—either for sport or financial gain. Attackers typically exploit
    multiple computers to create a `botnet`, or zombie army. The increasing prevalence
    of home-based personal computers connecting to the web and remote servers via
    high-speed connections makes them more susceptible to such attacks.


    The types of malware I’ve just reviewed form the basis for all other types of
    malware. Today, most malware is a combination of traditional malicious programs,
    frequently including parts of `Trojans` and `worms`, and occasionally a virus.
    Usually malware programs gain entry as `Trojans`, but once executed, they attack
    other networked systems like a worm. There are many other popular malware types,
    including spyware (spies on user activity), rootkits (hides malicious programs),
    backdoors (secures remote access to a computer system), and adware (generates
    unsolicited advertisements).


    Although the modern world faces hacking by criminals or nation-states that could
    threaten everyone’s way of life, the early days of malware were free of malice.
    Back then, the intention was to see what was truly possible with computing, not
    to harm, steal, or manipulate. Computing visionary John von Neumann was the first
    to have the idea for a virus, or a self-replicating string of code.[1](#11656-0014.xhtml#en23)
    In 1949, he postulated the potential for a “self-reproducing automata” that would
    be able to pass along its programming to a new version of itself. This early research
    resulted in both the `Creeper` virus and Morris worm. In the next two sections,
    I am going to deconstruct viruses and worms into their logical components, and
    present a couple infamous examples to give you a better understanding of how they
    work.


    ## Two Infamous Viruses: Melissa and ILOVEYOU


    Viruses are primarily comprised of five distinct components: search routine, copy
    routine, infection mechanism, trigger mechanism, and the payload. Once a virus
    makes its way onto a computer system, the search routine looks for a host application
    to which it attaches itself. After the application has been identified, the copy
    routine is executed to merge the virus code into the target application. The infection
    mechanism is how the virus will spread and/or propagate throughout a system (or
    network, in the case of a worm). The trigger mechanism is the code that activates
    the virus. This could be an independent trigger mechanism (e.g., time bomb that
    executes at a certain date/time) or user-triggered event (e.g., a double click).
    All previous steps lead up to the execution of the payload, which represents the
    code that does the damage and achieves the virus’s objectives. I will use this
    structure to describe the viruses in this section.


    Melissa is a fast-spreading virus that is distributed as an email attachment that
    when opened, disables a number of safeguards in `Word 97` or `Word 2000`, and
    if the user has the Microsoft Outlook email program, causes the virus to be resent
    to the first fifty people in each of the user’s address books. While it does not
    destroy files or other resources, Melissa has the potential potential to disable
    corporate and other mail servers as the ripple of email distribution becomes a
    much larger wave. On Friday, March 26, 1999, Melissa caused the Microsoft Corporation
    to shut down incoming email. Intel and other companies also reported being affected.


    The Computer Emergency Response Team, funded by the Department of Defense, issued
    a warning about the virus and developed a fix. The team responds to cyber incidents
    (or hack attempts) targeting Department of Defense information systems and networks.
    The technical analyses below are adapted from the Symantec, F-Secure, and University
    of California at Davis analyses of the viruses.


    - **Search routine**: When a user opens the infected document (`LIST.doc`), the
    search routine initiates a search for an email application (`Microsoft Outlook`)
    to connect to and sends up fifty emails (for the potential infection of other
    users).

    - **Copy routine**: After sending itself out, the virus continues to infect (copy
    itself to) other Word documents and will attempt to replicate this process until
    it is eradicated.

    - **Infection mechanism**: When a user opens or closes an infected document, the
    virus first checks to see if it has sent this mass email once before. It does
    so by checking a registry entry. The registry or `Windows registry` is a database
    of information, settings, options, and other values for software and hardware
    installed on all versions of Microsoft Windows OS. If the entry has been found,
    this is an indication that the mass emailing (fifty emails) has already been done
    and it will not be done again. Otherwise, the mass emails will be sent.

    - **Trigger mechanism**: If the user downloads and opens an infected file (e.g.,
    `LIST.doc`), the virus will execute. The virus will also execute independently
    based on the conditions described below.

    - **Payload**: As its primary payload, the virus will attempt to use Microsoft
    Outlook to email a copy of the infected document to up to fifty other people.
    There is a second payload that triggers once an hour, at the number of minutes
    past the hour corresponding to the date (i.e., on the sixteenth of the month,
    the payload triggers at sixteen minutes after every hour). If an infected document
    is opened or closed at the appropriate minute, this payload will insert the following
    sentence into the document: *“Twenty-two points, plus triple-word-score, plus
    fifty points for using all my letters. Game’s over. I’m outta here.”*

