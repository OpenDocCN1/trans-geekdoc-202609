    When designing a cybersecurity system, tool (application), or methodology, cyber
    threats (or possible attacks) are the first thing to which cybersecurity professionals
    pay attention. Security experts need to be as imaginative as they can in order
    to come up with a wide variety of possible attacks. By anticipating attacks, cybersecurity
    professionals can guard against them. There are many types of cyber threats that
    have been identified over the years. Oftentimes, people outside of cybersecurity
    confuse threats with types of attacks. For example, if you Google cyber threats,
    attacks such as `ransomware` will come up. `ransomware` is an attack that encrypts
    (locks) either your entire hard drive, critical files, or even web resources (web
    server), and forces you to pay a fine to decrypt (unlock) that particular resource.
    This is notnot`. threat. This is the. The threat would be the availability of
    your hard drive, critical files, or a web resource that could be compromised.
    This threat might not be realized until after the fact, through an attack such
    as `ransomware` or some other type of denial-of-service attack. This distinction
    between an attack and a threat is important to understand, and will assist you
    to better recognize vulnerabilities and risks as well.


    For the purposes of this book, I will define a cyber threat as an event that could
    impact one or more of the cybersecurity tenets I previously introduced, summarized
    in table 2.


    Now that we have a working definition and understanding of what a cyber threat
    is, let’s consider the common sources of these threats. One of the more succinct
    lists of cyber threat sources comes from a 2017 SecureWorks article.[1](#11656-0014.xhtml#en20)
    It shows the following sources (or actors): nation-states or national governments,
    terrorists, industrial spies, organized crime groups, script kiddies, hacktivists
    and hackers, business competitors, and disgruntled insiders. As you can see, there
    are a range of threat sources and associated motivations. I will not be deconstructing
    these sources further since they are not necessarily foundational to the field.
    Nevertheless, it is important to appreciate how serious cyber threats can be given
    the amount of resources being put behind some of the aforementioned groups of
    offenders (e.g., national governments).


    ## Table 2 Cyber Threats


    | Cyber tenet || Definition || Cyber threat |

    | --- | --- | --- |

    | Confidentiality || Keeping information secret || Information will not be kept
    secret |

    | Integrity || Keeping information correct and reliable || Information cannot
    be trusted |

    | Availability || Ensuring information is available to the right people at the
    right time || Information will not be available when it is needed |

    | Authentication || Verifying an identity || Identity cannot be verified |

    | Authorization || Verifying access to resources || Access to resources cannot
    be verified |

    | Nonrepudiation || Validating the source of the information || The source of
    the information received cannot be verified |


    In the remainder of this chapter, I will explore threats, vulnerabilities, and
    risks in the context of some commonly attacked targets: web applications. The
    Open Web Application Security Project (OWASP) is a nonprofit organization dedicated
    to security. The latest ten security risks are broken down in table.


    ## Cyber Vulnerabilities


    Once threats have been identified, a vulnerability is a cybersecurity term that
    refers to a flaw in system that can leave it open to attack. There are many types
    of vulnerabilities, such as software bugs, weak passwords. It is important to
    think of vulnerabilities in a broader sense. To help you do this, you can reference
    the Common Vulnerabilities and Exposures (`CVE`) list. The `CVE` represents all
    publicly known cybersecurity vulnerabilities, which is an important asset for
    the creation of cybersecurity products and services. It is a list of entries—each
    containing an identification number, description, and at least one public reference—for
    publicly known cybersecurity vulnerabilities. `CVE` entries are used to create
    numerous cybersecurity products and services around the world, including the US
    National Vulnerability Database. The `CVE Details` website takes the information
    from the `CVE` site and categorizes vulnerabilities based on the type of attack
    they enable. Let us assume you are running a Linux server, manufactured by Red
    Hat. Looking at the `CVE Details` site for a Red Hat Linux server, we see that
    most of the vulnerabilities in 2019 were related to code execution. This means
    that each vulnerability in that category represents a threat that could potentially
    be exploited. These vulnerabilities are not a concern for a nonnefarious application
    code that is running on the server. An attacker, however, could easily use these
    publicly available vulnerabilities to cause major damage in each of the six threat/vulnerability
    areas I previously enumerated, depending on their objectives.


    ## Table 3 OWASP Ten


    | Risk || Sample attack |

    | --- | --- |

    | Injection || Attackers can issue requests to the web application that will result
    in unauthorized data. |

    | Broken authentication || Attackers can gain access to web application. |

    | Sensitive data exposure || Information is seen by an adversary because it is
    not encrypted. |

    | XML external entities || Attackers are allowed to upload XML directly to the
    application. |

    | Broken access control || Attackers can access functions without proper authentication.
    |

    | Security misconfiguration || Attackers will be able to exploit a feature of
    the web application that was not set up correctly. |

    | Cross-site scripting || Attacker inserts a malicious application into web application
    that will execute in another user’s browser. |

    | Insecure deserialization || Object serialization is the process of saving the
    state of an object so it can be sent from source to destination (or saved and
    restored) while maintaining that state. If the deserialization of an object on
    a web application is not handled securely, data leakage can occur. |

    | Using unknown components with known vulnerabilities || Web application owners
    are using vulnerable components. |

    | Insufficient logging and monitoring || Attacks are not discovered because web
    application owners are not collecting information about who is interacting with
    their application. |


    ## Table 4 Cyber Vulnerabilities


    | Cyber tenet || Cyber threat || Cyber vulnerability example |

    | --- | --- | --- |

