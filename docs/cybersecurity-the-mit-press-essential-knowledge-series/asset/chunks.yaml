    prevention” yields close to two hundred thousand results, both citations (papers)
    and patent ideas. In my opinion, however, the design of more secure software should
    really be the focus of application security. This is the most proactive form of
    prevention. For example, in the typical life cycle of software, the goal is to
    produce software with the highest quality and lowest cost in the shortest time.
    The main steps include planning, designing, building, testing, and deployment.
    See anything missing? Yes! Security. So if this broadly accepted and taught framework
    for software development does not have security in any of its stages, how can
    secure software be the result of any development effort?


    As indicated, it is common practice to perform security-related activities only
    as part of testing. This after-the-fact technique usually results in a high number
    of issues discovered too late (or not discovered at all). It is a far better practice
    to integrate activities across the software development process to help discover
    and reduce vulnerabilities early on, effectively building security in. The concept
    of a secure software development integrates such security measures as penetration
    testing, code review, and architecture analysis into the process. Let’s go back
    to our example of a macro. Since on the surface it appears to perform one function
    but can decompose into others, how could we plan for this during software development?
    During the planning and design phases, we could lay out all the instructions ahead
    of time. Let’s call them instructions one, two, and three for simplicity, where
    one = open file, two = write some text to file, and three = save/close file. During
    the building phase (i.e., actually writing the application code), we only write
    those three instructions. In the predeployment testing phase, we test to make
    sure the program is not executing additional instructions (e.g., opening additional
    files), and once the application is deployed, we can verify the execution of *only*
    those three instructions. This makes our application predictable. Therefore if
    it goes outside the bounds of what is expected, it can be stopped. Even though
    this is a simple case, it is a powerful concept in application security. The more
    these principles are taught in conjunction with other application development
    concepts, the more secure code will be.


    ## Data Security'
