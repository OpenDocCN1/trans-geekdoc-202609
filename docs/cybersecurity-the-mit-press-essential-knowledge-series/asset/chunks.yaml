  raw: 'These statistics demonstrate why any DiD should start with people, not technology.
    The challenge with defending against people-based attacks is twofold: people will
    generally choose convenience over security, and people are inherently trusting.
    With new technology comes new conveniences. With new conveniences come more users.
    With more users come more vulnerabilities. And with more vulnerabilities come
    more hacking opportunities. People prefer to pay for convenience, not for security,
    especially when the benefits of the security protocols are not transparent. As
    a result, people will always be susceptible to cybersecurity attacks. Technological
    innovation occurs so fast that it is difficult for security professionals to keep
    up. Software engineer Max Kanat-Alexander states that


    > in general, when technology attempts to solve problems of matter, energy, space,
    or time, it is successful. When it attempts to solve human problems of the mind,
    communication, ability, etc. it fails or backfires dangerously. For example, the
    Internet handled a great problem of space—it allowed us to communicate with anybody
    in the world, instantly. However, it did not make us better communicators.[2](#11656-0014.xhtml#en17)


    The relative ease and ubiquity of internet technology leads to naivete among some
    users. As Alexander notes, Facebook (and by extension, other communication and
    social media platforms) makes it easier for people to communicate. But that’s
    not the same as forming or enhancing real human connection, which depends on trust.
    In my own work, I’ve come across and presented statistics that link human trafficking
    recruiting to social media networks.[3](#11656-0014.xhtml#en18) The reason? People
    are generally trusting, even of their social media “friends” whom they barely
    know, and they overly rely on the conveniences of technology. As a result, we
    face a dilemma that I call the security versus convenience imbalance, which I
    regard as a critical challenge for professionals in the cybersecurity field: How
    do we decide how much security is enough without annoying users to the extent
    that they don’t want to use a useful piece of technology? This is a constant struggle.
    It is an essential one for cybersecurity professionals, however, if they want
    to successfully provide solutions that the entire world will actually use. As
    a rule of thumb, we have to assume that users will almost always choose convenience
    over security. It’s why even to this day, if you walk around many corporate office
    spaces, you will find at least one person’s password written on a sticky note
    or piece of paper.


    People prefer to pay for convenience, not for security, especially when the benefits
    of the security protocols are not transparent.


    Two questions need to be asked when designing or proposing a security solution:
    Is it easy to use? Is it transparent? Even as someone who has spent almost twenty
    years in cybersecurity, I don’t always have the patience for complicated security
    solutions, so how much less would a more trusting user. Therefore the best cyber
    solutions need to be transparent (clearly showing the need for the solution) or
    require little to no user interaction (thereby reducing the complexity). One great
    example that achieves both of these objectives is the captcha, which was designed
    to make it difficult for an automated program to fill out a form online. The captcha
    does so through a test that requires a human action that cannot be automated by
    a program. Google’s reCAPTCHA simply requires users to click a checkbox after
    inputting their username and password (see figure 4) to verify that they are human
    rather than asking users to complete more complex tasks, such as solving math
    problems, word problems, or time-based authentications, or providing biometric
    data.


    ![](images/11656_004_fig_000.jpg)


    ## Network Security


    The next layer in DiD is network security. The easiest way to think about a network
    is as a boundary, such as a fence. Your home network is probably the best example
    of a network you use on a daily basis. Most of us will have some form of an internet
    connection at home that we use for various purposes: to stream videos, music,
    and TV, or save data on our cell phone plans. Whenever you connect to your Wi-Fi,
    you are connecting to your internal home network. Imagine if anyone in your neighborhood
    could connect to your network. If so, they could not only see the other devices
    that are connected to your network but also the content you’re viewing. How does
    that make you feel? For me, I would prefer that my internet usage is kept private
    and would guess that you would as well.


    In the physical world, we all have family, friends, and acquaintances in our personal
    network. When we speak to or spend time with a member of our personal network
    in private (and not publicly on a social network), we would prefer those interactions
    to remain private. That’s what network security aims to provide.


    When the people level fails, the next level an attacker has to penetrate is the
    network level. Network security can be defined as all of the protection items
    that are in place to prevent and detect access to an internal set of systems and
    resources. To understand the technical layers of the DiD model, it is helpful
    to think about them in terms of the Open Systems Interconnection (OSI) model.
    The OSI model was created by the International Organization for Standardization,
    which enables diverse communication systems to communicate using standard protocols
    that allow different computer systems to communicate with each other. In the context
    of cybersecurity, the OSI model can also represent layers of defense including
    the network.


    There are a number of devices that provide network security. The top ones are
    firewalls, intrusion detection systems, IPSs, and security information and event
    management systems. All network devices are based conceptually on these four.
    A firewall is a network security device that monitors and regulates incoming and
    outgoing network traffic according to a defined set of security rules. An intrusion
    detection system is a software or hardware device that searches network traffic
    for suspicious activity and known threats, and then registers an alert on detection.
    An IPS is a combination of a firewall and an intrusion detection system. Once
    an intrusion is detected, it can automatically be stopped. This is similar to
    the operation of a firewall when it blocks or allows traffic into a network. Lastly,
    a security information and event management system is a device that brings information
    together from all levels: the network, applications, and a computer system. It
    is most helpful for cyberattacks that proliferate through each level. There will
    be evidence of the attack at each level that can be seen in a single view within
    a security information and event management system.


    ## Computer System (Host) Security


    Once an attacker has made it through your people and network, they are now at
    the computer system or host level. This is usually referred to as the OS, such
    as Microsoft’s Windows, Apple’s OS X, and the open-source Linux OS. An OS must
    deal with potential security issues, whether they arise accidentally or as part
    of a malicious attack. Modern OSs are designed for multiuser environments and
    multitasking operations. Consequently an OS must, at a minimum, deal with separation,
    memory protection, and access control. Separation is the idea of keeping one user’s
    objects separate from other users. An object refers to the user’s digital possessions
    (e.g., files, folders, permissions/rights, application space, or memory segment).
    Memory protection prevents one application from corrupting another, specifically
    when they are running simultaneously. Access control is one of the cybersecurity
    tenets in action—authorization—and focuses on preventing unauthorized access to
    specific resources.'
