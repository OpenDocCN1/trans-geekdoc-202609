  trans: '


    例如，存在一些旨在改进查看语音邮件体验的移动应用程序。它们可以过滤入电电话并将入电消息转为文本。它们甚至可以检测虚假（欺骗性）电话，这些电话显示为看似熟悉的号码。这些应用程序可以播放服务不可用的信息并挂断电话（防止诈骗者留下语音留言）。这是说明为什么关注攻击结果至关重要的极佳案例。这些语音邮件应用也是自然语言处理的示例，它使计算机能够通过分析自然语言数据来理解人类的说话方式。政府情报部门大量使用这种技术来拦截可能识别国土安全威胁的对话。对话式人工智能和自然语言处理平台可以帮助公司自动化日常通信任务，如客户服务、内部帮助热线、知识管理和成员互动。亚马逊的
    `Alexa` 是自然语言处理技术的良好示例，它能够通过极少的语音输入产生结果。这些技术使用统计机器学习方法，从自然语言输入中提取对话意图和实体。对于网络安全而言，这种能力在应对高级持续性威胁（APT）时最有帮助，这种威胁涉及未经授权的用户访问系统或网络，并在那里长时间停留而不被发现。人工智能引擎可以保留这种“上下文”（一旦最初通过异常检测或基于特征的系统发现），并在攻击恢复时启动恢复措施。以一个跨越几天的计划攻击为例：


    - 第 1 天：我们将利用帮助热线进行社会工程攻击

    - 第 2 天：将在受害者机器上种植逻辑（时间）炸弹

    - 第 3 天：将在周日晚上 8:00 发布病毒


    为了完全理解这次攻击，需要将所有消息结合起来，形成一个针对敌者的“案件”。保留上下文的机制使得这成为可能。


    ## 结论


    未来的网络安全是什么？可以这样说：它是关于的一只眼睛盯着新技术的创新，另一只眼睛盯着网络安全的基础过去，所有的视角都更关注于预防攻击结果，而非攻击本身。研究人员指出，社交媒体用户倾向于过度分享生活细节，这些细节可能被网络罪分子恶意利用，以访问敏感账户并盗取用户身份。这一令人震惊的观察强调了网络卫生的必要性，并要求用户意识
    true 自己在推动网络防御社区“技术水平”进步方面所起的作用。记住，网络杀伤链的第一步是侦察，攻击者在此选择目标系统或网络，进行研究并寻找漏洞。这种研究的一部分被称为开源情报收集，即罪犯可以从公开来源收集的数据。开源情报的质量与公众可用的数据成正比。在社交媒体上过度分享生活细节提供了开源情报数据，这些数据随后可用于网络杀伤链的剩余步骤，特别是武器化。


    我鼓励你从书中汲取最能引起你共的原则。我希望通过阅读这本书以及其他关于该主题的书，你将对一个仍处于婴儿阶段但每天都在快速演变的领域产生认同。产生疑问时，当你遇到无疑会出现的新话题（即使在你进一步阅读该主题期间），请回想起网络安全准则。从基础上说，网络安全就像保护这些准则一样简单：


    1. `机密性`：保持信息保密

    2. `完整性`：维护信息完整

    3. `可用性`：确保信息可用

    4. `身份验证`：验证身份

    5. `授权`：提供资源的访问权限

    6. `不可否认性`：验证来源


    # 术语表


    `访问控制列表`：指定对...访问的列表


    `目标达成`：网络杀伤链的最后一步


    `应用程序安全`：一种旨在保护应用程序机密性、完整性和可用性的网络安全方法


    `人工智能`：机器的模仿


    `身份验证`：识别用户的过程


    `授权`：为用户提供


    `可用性`：确保数据可以持续被访问


    `生物识别`：可作为格式使用的人类物理或行为特征


    `区块链`：跨多个计算机的交易的数字记录（区块），不由任何实体控制


    `机器人`：被恶意软件感染并受...控制的计算机


    `密码`：用于执行加密的算法


    `云计算`：通过互联网按需获取计算机系统资源的可用性


    `命令与控制`：安装在受害者机器上的恶意应用程序与其创建者通信的通道


    `合规性`：满足对某些方面的监管要求


    `计算机免疫学`：一种模仿人类免疫系统的网络安全方法


    `计算机安全`：一种旨在保护计算机系统机密性、完整性和可用性的网络安全方法


    `机密性`：确保信息不被公开


    `蠕虫病毒`：可以认为是第一个计算机病毒；在受感染的打印机上显示“I’M THE CREEPER: CATCH ME IF YOU CAN（我是蠕虫：有本事就捉我我）”


    `加密算法`：一组用于加密或解密数据的数学指令


    `密码学`：网络安全的原始形式，侧重于通过加密和哈希算法保护数据的机密完整性


    `网络犯罪`：涉及利用数字资产实施犯罪的犯罪活动


    `网络卫生`：根据用户的在线习惯衡量其在线安全程度的指标


    `网络杀伤链`：攻击者为了成功利用目标而采取的步骤


    `网络安全`：电子数据的可用性、完整性、身份验证、机密性和不可否认性


    `数据安全`：一种旨在保护数据机密性、完整性和可用性的网络安全方法


    `深度防御 (DiD)`：网络防御的分层方法；如果某一层失效，则可以在另一层阻止攻击


    `数字签名`：通过密码学实现的人类签名的数字表示


    `加密`：使用对称或非对称密钥提供数据机密性的双向加密函数


    `电子投票`：通过电子方式投票


    `文件权限`：为文件提供读取、写入和执行权限


    `防火墙`：一种根据预定义规则阻止或拒绝网络流量的网络防御工具


    `黑客行为`：攻击目标计算机系统、网络或个人的“艺术”


    `哈希`：用于提供数据完整性的单向加密函数


