- fmt: '

    The Heartbleed bug allows anyone on the internet to read the memory of the systems
    protected by the vulnerable versions of the OpenSSL software. The flaw allows
    an attacker to steal sensitive information by compromising the mechanism used
    for protecting data privacy (or confidentiality). The secret keys are what enable
    the cybersecurity tenet—confidentiality—which is focused on keeping online conversations
    private. Even in 2017, almost three years after this nasty bug was first discovered,
    close to two hundred thousand websites and servers remained vulnerable to it.
    Thankfully, this issue has now been resolved for most websites and servers. Yet
    it shows just how dependent we are on cryptography for secure communications online.
    One “minor” programming error affected billions of internet users across the globe;
    that’s why cryptography is such a foundational concept, and needs to be more broadly
    understood and appreciated.


    ## Cryptography as an Equation


    In its simplest form, cryptography can be described as the study of encrypting
    and decrypting data—which represents the base functions of the foundational field.
    The following two equations further explain how cryptography works:


    `ciphertext = plaintext + encryption key` (1)


    and


    `plaintext = ciphertext + decryption key` (2)


    For equation (1), some form of `plaintext` is translated by an encryption key
    to produce the `ciphertext`. For equation (2), some form of `ciphertext` is translated
    by a decryption key to produce the original `plaintext`. In the case of the equations
    above, the same key is used for both encryption and decryption. This is not always
    the case, as I will detail further in this chapter. For now, let’s break down
    each equation component. `plaintext` is an input for an encryption algorithm,
    and can be in the form of text, audio, video, and images. `ciphertext` is generally
    described as the output of the encryption process. Or to look at it another way,
    `plaintext` is in a human-readable or legible format. To preserve the confidentiality
    of the `plaintext`, the `ciphertext` should `not` human readable or legible. Here
    is a simple illustration using a substitution cipher from the Practical Cryptography
    website.[1](#11656-0014.xhtml#en14) Keys for the simple substitution cipher usually
    consist of twenty-six letters. An example key is:


    `plain alphabet: abcdefghijklmnopqrstuvwxyz`


    `cipher alphabet: phqgiumeaylnofdxjkrcvstzwb`


    The `plaintext` that I will encrypt is “defend the east wall of the castle” and
    is shown below:


    `plaintext: defend the east wall of the castle`


    `ciphertext: giuifg cei iprc tpnn du cei qprcni`


    To create `ciphertext`, each character of the `plaintext` is replaced with the
    corresponding letter in the `cipher alphabet`. The `cipher alphabet` is simply
    a mapping that denotes how to go from the `plaintext` to `ciphertext`. The simplest
    instance of this is `abc` —>`xyz`. Wherever you see an `a`, replace it with an
    `x`; when you see a `b`, replace it with a `y`; and when you see a `c`, replace
    it with a `z`. So “cab” would be translated to “zxy.”


    In cryptography, a substitution cipher is a method of encrypting by which `ciphertext`
    replaces units of `plaintext`. It is important to note that the simple substitution
    cipher offers little communication security as it can be easily broken, even by
    hand, especially as the messages become longer (more than several hundred ciphertext
    characters). An encryption key is typically a random string of bits generated
    specifically to scramble and unscramble data. Encryption keys are created with
    algorithms designed to ensure that each key is unique and unpredictable. The longer
    the key that is constructed this way, the harder it is to break the encryption
    code. It is important to keep this premise in mind, as keys are foundational to
    the field of cryptography and analogous to a physical key. You can have the strongest
    fortress protected by dragons, moats, guards, and other defense mechanisms, but
    if the key (or mechanism) used to enter that fortress is compromised or stolen,
    all those defenses will become null and void.


    ## Confidentiality and Encryption


    Confidentiality is one of the key tenets of cybersecurity, and encryption (to
    produce ciphertext achieves it). As just mentioned, an encryption key is typically
    a random string of bits generated specifically to scramble and unscramble data.
    Encryption methods can either be symmetric or asymmetric. Symmetric key encryption
    uses the same key for encryption and decryption. Asymmetric key encryption uses
    different keys for encryption and decryption. They both have specific uses as
    well as pros and cons.


    Symmetric encryption involves the use of relatively short keys that both parties
    can use to encrypt and decrypt. It enables a faster and more efficient use of
    computer resources by handling a greater volume of data in a given time. This
    makes symmetric key encryption the preferred method for encrypting large quantities
    of data, but it also exposes one of its major weaknesses, resulting in the need
    for asymmetric key encryption. The main purpose of encryption is to preserve confidentiality.
    To do this, the encryption keys `must` remain private. So if the same key is used
    for both symmetric key encryption and decryption operations, how can we share
    it if the encrypted message is sent between parties over the internet and they
    do not live near each other? One option could be to send it via another medium.
    If that medium is insecure, however, the key could be compromised and the message
    could still be lost. This is where asymmetric key encryption becomes so valuable
    as a supplementary technique—primarily for key management.


    Asymmetric key encryption uses a single key for encryption (as noted earlier,
    called the public key) and a single key for decryption (called the private key,
    as mentioned before). There is a mathematical relationship between the two keys
    such that they cannot be derived from each other, and one can be used for encryption
    and the other for decryption. Although simple, it is outside the scope of this
    book to describe the math in detail. Suffice it to say, it is a combination of
    algebra 2, modulo operators, and prime numbers that results in the private-public
    key pair that enables the “magic” of asymmetric key encryption. Asymmetric key
    encryption is primarily used to encrypt small quantities of data and is beneficial
    in situations where you need to share information over an insecure channel. The
    information can be encrypted with the public key and then decrypted with the private
    key of the recipient.


    To clarify these concepts, let’s look at one of the primary cases where both symmetric
    and asymmetric key encryption are used in practice: public key infrastructure
    (PKI). According to the Thales corporation, PKI is responsible for most of the
    security that consumers experience online. A simple analogy would be the organizations
    that issue driver’s licenses. They have the responsibility of creating, managing,
    distributing, facilitating the use of, storing, and revoking driver’s licenses.
    PKIs provide several useful security properties for the online user. These include
    (but are not limited to) strengthening online identity, enabling confidentiality,
    offering security for Internet of Things (IoT) devices, and protecting access
    to sensitive resources. In PKI, both types of cryptography are used to facilitate
    a secure connection. Symmetric key encryption is used to encrypt the data being
    transmitted between the parties, while asymmetric key encryption is used to encrypt
    the symmetric keys. By doing so, it employs the strengths of each approach: symmetric’s
    speed of encryption/decryption, and asymmetric’s secure key exchange.


    ## Integrity and Hashing

