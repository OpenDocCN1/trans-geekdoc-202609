    its unique characteristics. If someone interacts with a dog and begins to notice
    that it has fur, long floppy ears, a distinct smell, walks on all fours, a specific
    body shape, and barks—these are “features” or characteristics that could be used
    to identify another dog. No one has to supervise the identification and characterization
    of these features; they will be recognized automatically through repeated interactions
    with previous dogs.


    Anomaly detection is the process of spotting unusual activity, data, or processes
    (e.g., fraud detection for online banking or gambling). Anomaly detection principles
    are different from traditional intrusion detection in that they do not require
    a signature to detect aberrant behavior or traffic of concern. Once the machine
    learning algorithm (supervised or unsupervised) has established the baseline of
    normalcy within an environment, the anomaly detection engine can begin to detect
    anomalies. Research in this area has focused primarily on attack detection, as
    is the trend with most cyber products and conceptual ideas. When considering an
    outcome-based approach to anomaly detection, how could we employ these techniques
    to *prevent* the attack outcomes of deception, data theft, or denial of service?'
