    另一种臭名昭著的病毒以钓鱼邮件的形式出现，带有一个附件（如 JPEG 图像文件），主题行为“ILOVEYOU”；点击后，ILOVEYOU 病毒中的文件会向接收者
    Microsoft Outlook 联系人列表中的每一个人发送相同的电子邮件。它甚至会删除接收者硬盘上的某些文件。得益于 Outlook 在大型企业中的普及，2000
    年 5 月 4 日，该病毒传播速度之快，导致包括福特汽车公司在内的许多大型企业不得不关闭电子邮件系统。该病毒当天估计感染了四千五百万用户。


    以下是关于 ILOVEYOU 病毒工作原理的技术分析：


    *   **搜索程序**：首先，它执行一个例程来定位每个固定器和远程驱动器，并递归遍历所有文件夹。在每个文件夹中，它都会寻找被程序设置为删除的特定文件类型。

    *   **复制程序**：这是主程序，它将蠕虫复制到操作系统的根目录中。复制程序引导病毒注入到特定的文件类型（如上所述）。

    *   **感染机制**：该机制将蠕虫传播到受害者地址列表中的所有地址，类似于 Melissa 病毒。此外，病毒也可以通过互联网中继聊天（IRC）传播，这种信息传递服务是
    WhatsApp 等应用程序的前身。感染机制还使用相同的方法来判断批量邮件是否已发送（例如，通过注册表项）。

    *   **触发机制**：用户必须点击包含病毒的文件才能使其执行（例如 JPG 或 JPEG 文件）。

    *   **载荷**：在固定器和远程驱动器上，Visual Basic、ActiveX、Java 和图片文件会被蠕虫的副本取代，因此当用户双击与文件对应的图标时，蠕虫就会启动。电影文件仅被隐藏，但会创建一个同名的蠕虫文件，产生与替换其他文件类型类似的效果。


    ## 一种臭名昭著的蠕虫：震网（Stuxnet）


    蠕虫与病毒共享一些结构元素，但通常由以下部分组成：目标定位器、感染传播器、远程控制和更新接口、生命周期管理器、载荷和自我跟踪机制。目标定位器类似于病毒的搜索程序，尽管病毒是在寻找可以附加的宿主应用程序，但蠕虫通常在寻找传播机制，例如电子邮件地址或其他目标系统（通过扫描
    IP 地址的相邻系统来识别）。感染传播器是用于将蠕虫传输到目标系统并感染下一台机器的机制。接下来，蠕虫创建者使用远程控制和更新接口与蠕虫通信并提供更新。例如，如果目标系统安装了
    Microsoft Office 2007 的 Windows 机器，且这些系统更新到了 Microsoft Office 2010，蠕虫可以通信这一点，创建者就可以更新蠕虫代码以针对新的应用程序类型。生命周期管理器会运行版本的蠕虫一段时间，然后根据预设条件对其进行更新。所有之前的步骤都指向载荷的执行，载荷代表了造成损害并实现蠕虫目标的代码。可选，蠕虫作者可能想要跟踪蠕虫的遍历路径或跟踪受害者机器。自我跟踪程序完成了此任务。我将使用这一通用结构在在本节中描述震网（Stuxnet）蠕虫。


    震网（由美国和以色列情报小组创建）蠕虫针对所谓的监控控制和数据采集系统，这些系统被广泛用于工业控制系统，如电力、水务和污水处理厂，以及电信和石油气精炼。震网包含了可以识别德国制造商西门子设计的逻辑控制器所用软件的代码。逻辑控制器使关键工业过程自动化，例如温度、压力以及液体和气体的流速。据报道，震网曾用于劫持伊朗浓铀设施的高速离心机，导致其剧烈震动，从而对设备造成损坏。


    以下是该蠕虫运行方式的分析：


    *   **目标定位器**：一旦进入机器，震网会寻找 Microsoft Windows 机器，然后寻找西门子 Step7 软件，该软件是用于为运行设备（例如离心机）的工业控制系统的
    Windows 软件。

    *   **感染传播器**：震网通过连接的 USB 设备进入系统，然后执行目标定位器程序（上所述）。蠕虫随后通过连接到互联网的打印机，利用特定漏洞进行传播。

    *   **远程控制和更新接口**：该蠕虫通过注册在虚假名称下的两个 IP 地址，由位于丹麦的两个服务器进行远程控制，这使其难以追踪。然而，震网的设计是为了在孤立网络上传播，因此被设计成具有自主性，减少了对稳健且细粒度“命令与控制”的需求。

    *   **生命周期管理器**：震网的不同变体针对五个伊朗组织，可能的目标被广泛怀疑是伊朗的浓铀基础设施。这意味着代码有某种方法在需要时更换版本。

    *   **载荷**：蠕虫强制离心机高速旋转十五分钟，然后使其恢复到正常速度。在攻击发生五个月内，过度的速度变化导致机器损坏，造成约一千台离心机损失。

    *   **自我跟踪机制**：没有文献证据表明震网内置了自我跟踪机制。这是因为需要保持隐蔽性并在未连接的基础设施上运行。然而，代码本身必须感知新受感染的系统，这些系统是根据内置的通信机制（即感染相邻机器）上线的。


    # 7 现代应用


    如果你知道自己每天都在使用网络安全，你会感到惊讶吗？鉴于今天技术的无处不在，网络安全也渗透到了我们生活的许多方面。让我们来看一些关于技术和互联网使用的统计数据。全球接近
    60% 的人口在使用互联网。根据 2019 年皮尤研究中心的报告，81% 的美国人表示他们每天在线，其中包括 28% 的几乎一直在线。只有 10% 的成年人表示他们完全不使用互联网。在移动互联网用户中，92%
    的人每天在线，32% 的人几乎一直在线。大约一半 18 至 29 岁的人表示他们几乎总是在线，46% 的人每天在线多次。


    当任何人使用任何连接互联网的技术时，他们都在利用网络安全原则，无论是有意还是无意。在本章中，我将介绍常见的用例，例如身份验证机制、用户身份、TLS、电子商务、银行和区块链技术。


