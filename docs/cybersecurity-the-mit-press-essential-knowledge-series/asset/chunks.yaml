    For instance, mobile apps exist that aim to improve the user experience when checking
    voice mails. They can filter incoming calls and transcribe incoming messages to
    text. They can even detect fake (deceptive) calls, which show up as phone numbers
    that seem familiar. These apps can play an out-of-service message and hang up
    the phone (preventing the scammer from leaving a voice message). This is an excellent
    case of why it is essential to focus on attack outcomes. These voice mail apps
    are also an example of natural language processing, which enables computers to
    understand the ways humans speak through the analysis of natural language data.
    The government intelligence community uses this technique heavily to intercept
    chatter that could identify homeland security threats. Conversational artificial
    intelligence and natural language processing platforms can help companies automate
    routine communications tasks like customer service, internal help desks, knowledge
    management, and member engagement. Amazon’s `Alexa` is a good example of a natural
    language processing technology that is able to produce results with little voice
    input. These technologies use statistical machine learning methods to extract
    conversational intents and entities from natural language input. For cybersecurity,
    this capability would be most helpful in the pursuit of an advanced persistent
    threat, which involves an unauthorized user gaining access to a system or network,
    and remaining there for an extended period without being detected. The artificial
    intelligence engine could preserve this “context” (once initially detected either
    via anomaly detection or a signature-based system) and initiate recovery measures
    when the attack resumes. Take the example of an attack that is planned over a
    few days:


    - Day 1: we will socially engineer using the help desk

    - Day 2: we will plant a logic (time) bomb on victim machines

    - Day 3: we will release the virus at 8:00 p.m. on Sunday


    To fully understand the attack, all the messages need to be collectively combined
    to form a “case” against an adversary. A mechanism for preserving context makes
    this possible.


    ## Conclusion


    What is the cybersecurity of the future? Put it this way: it is about simultaneously
    keeping one eye on new technology innovations and one eye on cybersecurity’s foundational
    past, all with a perspective that is more focused on preventing attack outcomes
    than the attacks themselves. Researchers have noted that social media users tend
    to overshare life details that can be used maliciously by cybercriminals to access
    sensitive accounts and steal the user’s identity. This frightening observation
    underscores the need for cyber hygiene and for users to be aware of their part
    in advancing the “state of the art” in the cyber defense community. Remember,
    the first step of the cyber kill chain is reconnaissance, where an attacker selects
    a target system or network, performs research, and looks for vulnerabilities.
    Part of this research is called open-source intelligence gathering, which is data
    that criminals can collect from publicly available sources. The quality of open-source
    intelligence is directly proportional to data available to the public. Oversharing
    life details on social media provides open-source intelligence data, which can
    subsequently be used in the remaining steps of the cyber kill chain, specifically
    weaponization.


    I encourage you to take from this book whatever principles resonated with you
    most. I hope that through reading this book and others on the topic, you will
    gain an appreciation for a field that is still in its infancy but is rapidly evolving
    day by day. When in doubt, recall the cybersecurity tenets as you encounter new
    topics that will undoubtedly emerge, even during your further reading about this
    subject. Foundationally, cybersecurity is as simple as the preservation of these
    tenets:


    1. `Confidentiality`: keeping information secret

    2. `Integrity`: maintaining information

    3. `Availability`: ensuring information is available

    4. `Authentication`: verifying an identity

    5. `Authorization`: providing access to resources

    6. `Nonrepudiation`: validating the source of


