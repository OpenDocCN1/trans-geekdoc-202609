- fmt: '

    The field of autonomic computing, which investigates principles of self-management
    and self-healing, serves as a viable baseline for exploring immune system principles
    in today’s computing environment. We require an autonomous decision-making system
    that can adapt, react, and learn from real-time computer systems to keep up with
    the pace of cyberattacks, which requires a complementary paradigm shift from focusing
    on attack prevention to attack outcomes or effects. Such a system would have much
    more sophisticated notions of identity and protection than those afforded by current
    `OSs`, and would provide a general-purpose protection system to augment current
    computer security systems.


    It would have at least the following components: a stable definition of self,
    prevention or detection and subsequent elimination of dangerous foreign activities
    (infections), a memory of previous infections, a method of recognizing new infections,
    and a method of protecting the immune system itself from attack. Immunological
    models are experimental systems that re-create aspects of the human immune system
    to study its development and function in health as well as disease. In the computing
    world, the major challenge will be to replicate elements of the immune system
    that are applicable in the computing space. To mitigate this risk, existing immunological
    models can be mapped onto relevant computing functions—specifically at the `OS`
    layer. `OS` security is the process of ensuring `OS` integrity, confidentiality,
    and availability. `OS` security refers to specified steps or measures used to
    protect the `OS` from threats, viruses, worms, malware, or remote hacker intrusions.


    ## Outcome-Based Cyber Defense


    While computer immunology centers on the proactive prevention of cyberattacks,
    outcome-based cybersecurity assumes an attack will inevitably occur, and concentrates
    on preventing the outcomes or objectives of an attack. A simple example of outcome-based
    cyber defense for denial-of-service attacks would be a system designed with built-in
    redundancies. Denial-of-service attacks are often caused by overwhelming the capacity
    of a server. The traditional cyber defense would focus on detecting an attack
    and starting to drop traffic that would overwhelm the server to prevent further
    damage. Outcome-based cyber defense will use the detection system as a trigger
    only. The trigger will instruct the backup system to take over if the primary
    system goes down.


    Outcome-based cyber defense can also be used for malware detection. Current antimalware
    products are designed to look for signatures (or indicators) of malware being
    downloaded or installed on a computer system. If the signature matches a file
    or a prespecified behavior of an executable file, it will be blocked or quarantined
    for further analysis to ensure that it does not infect other files. The outcome-based
    alternative to this approach would be to categorize malware based on the specific
    outcome it is trying to achieve. Based on that outcome and the system objective,
    it will either allow or deny the malware from running. For example, if the system
    objective is to serve as a payroll processor and the malware is designed to change
    non–payment file extension names, then that malware can be allowed to run. This
    approach is distinct from and more efficient than the signature-based method described
    above. By design, it will consume fewer resources because it will only be polling
    for malware that can negatively affect a system’s objective.


    A similar approach can be employed for data theft or a misinformation attack.
    With data theft, the outcome we are trying to prevent is the unauthorized removal
    of data leaving a network or machine. This is called extrusion detection. For
    this to be effective, sensitive data needs to be tagged and examined whenever
    an attempt is made to transfer it from the system or network. If the attempt is
    made by an authorized user, allow it. Otherwise the attempt should be denied.


    Misinformation attacks can be prevented similarly. In the case of a misinformation
    attack, what is the outcome we are trying to prevent? Deception. So users have
    to be able to trust their information systems and data within these environments.
    I discussed many integrity mechanisms in chapters 2 and 3. A combination of system
    integrity, data integrity, and digital signatures (for data transmitted over a
    network) can suffice to offer legitimate users confidence in the systems they
    use, data with which they interact, and information they receive. We still have
    a long way to go before we get ahead of the adversary completely. To close the
    gap, we need more research that focuses on defense methods based on outcomes.


    ## Artificial Intelligence / Machine Learning


    One of the aspects of artificial intelligence that is most applicable to cybersecurity
    is machine learning. Machine learning uses statistical techniques to give computers
    the ability to learn (i.e., progressively improve performance on a specific task)
    with data, without being explicitly programmed. Imagine you are the administrator
    of a network with a hundred thousand machines that could potentially be hacked.
    It would be impossible for you to monitor all the machines to determine if they
    were behaving strangely. Machine learning allows you to form a baseline of the
    “behavior” of a user and an associated computer system. Then it can identify any
    aberrations from this behavioral norm and generate an alert. Now you only have
    to look for new behaviors that might be indicative of an attack.


    A good supervised machine learning example would be identifying how long it would
    take you to walk around the neighborhood. You could feed the algorithm information
    such as age, physical condition, weather information, distance, and details from
    previous similar walks. The data would be labeled accordingly, and the estimate
    determined by the “supervised” algorithm. Alternatively, an unsupervised example
    that is commonly used is the identification of an animal (e.g., a dog) based on
    its unique characteristics. If someone interacts with a dog and begins to notice
    that it has fur, long floppy ears, a distinct smell, walks on all fours, a specific
    body shape, and barks—these are “features” or characteristics that could be used
    to identify another dog. No one has to supervise the identification and characterization
    of these features; they will be recognized automatically through repeated interactions
    with previous dogs.


    Anomaly detection is the process of spotting unusual activity, data, or processes
    (e.g., fraud detection for online banking or gambling). Anomaly detection principles
    are different from traditional intrusion detection in that they do not require
    a signature to detect aberrant behavior or traffic of concern. Once the machine
    learning algorithm (supervised or unsupervised) has established the baseline of
    normalcy within an environment, the anomaly detection engine can begin to detect
    anomalies. Research in this area has focused primarily on attack detection, as
    is the trend with most cyber products and conceptual ideas. When considering an
    outcome-based approach to anomaly detection, how could we employ these techniques
    to *prevent* the attack outcomes of deception, data theft, or denial of service?

