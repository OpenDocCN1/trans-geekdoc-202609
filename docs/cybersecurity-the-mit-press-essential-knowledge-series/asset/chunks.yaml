    Yet even with all the safeguards, rules, and policies in place to make username
    and password combinations more secure, if MFA isn’t used, as discussed in chapter
    2, usernames and passwords are still susceptible to the aforementioned cyberattacks.
    MFA serves as a complement to password-based authentication by adding a factor
    (or factors) required for complete authentication. Recall how in chapter 2 I presented
    the fact that a fully secure authentication system would encompass the following:


    *   • Something you know (username and password)


    *   • Something you have (MFA token)


    *   • Something you are (biometrics, as discussed in the next section)


    A typical method of MFA would send an SMS message to your phone with a number
    combination that you have to enter after successfully entering your username and
    password combination. Not only does this add another authentication step, it requires
    an attacker to have physical access to the mobile device you have registered.
    This method may seem foolproof and completely secure, but what happens if you
    forgot that you loaned someone your old phone or it was stolen? Or worse yet,
    what if you upgraded to the latest Android or Apple device, and forgot to do a
    secure wipe before turning it in? The next time you attempt to authenticate to
    that particular web application, your pin will be sent to that device. This will
    reveal the site that you are authenticating to, deny you access to the site, or
    (in the case of a stolen phone) provide a potential entry point for an attacker
    into that application.


    ## Biometrics


    Biometrics offer extra layers of security when gaining access to accounts and
    include all metrics that are considered unique to every human. Biometric research
    is being conducted in areas such as fingerprint identification, ear structure,
    and retina scanners.[4](#11656-0014.xhtml#en28) It is one of the ways to add heightened
    security by forcing end users to include both information about what you know
    (i.e., your username and password combination) and something you are (i.e., your
    fingerprint, EKG reading, or eye scan).[5](#11656-0014.xhtml#en29) Biometrics
    is the missing link in a fully secure authentication system. It has become more
    common as image scanning is being used on various OSs (iOS and Microsoft) to unlock
    devices, and fingerprint scanning technology has become pervasive and is included
    on most modern laptops and smartphones. As image recognition technology continues
    to improve, facial and other physical features can be used to recognize and even
    authenticate people to gain access. Though there are many positive uses of biometrics,
    and in sci-fi movies (e.g., *Star Trek*) it can do intriguing actions like opening
    large metal doors to secret underground laboratories, image recognition gives
    rise to a number of privacy concerns. For example, fingerprints have been used
    for years to uniquely identify people. The issue with fingerprints, however, is
    that they are stored like passwords in databases. Storing fingerprints, facial
    images, and other biometric images in this way potentially exposes these databases
    to being breached since they are protected by some of the same mechanisms they
    store. Research and discussions around privacy concerns will continue as the use
    of these access control techniques increase in practice.


    For now, the question arises, if biometrics are the strongest form of authentication,
    why not just use them and do away with other mechanisms? What could be stronger
    than a biometric-based authentication system? Hopefully by this stage of the book,
    you know that DiD is a principle that should always be employed in designing a
    secure system. Additionally, good security systems are both secure and usable
    by end users without disrupting the original intended use case of the item being
    secured. Fingerprint scanners are integrated into the device for ease of use.
    So, for instance, if every time you needed to use a fingerprint scanner on your
    mobile device you had to plug something in, you would probably stop using it after
    a while. Because biometric systems are sometimes not user friendly, they alone
    will not address all the issues with authentication. Lastly, the major challenge
    with biometrics is how to handle compromises. When a username or password is compromised
    or forgotten, it is easy to click the “forgot password” link and go through the
    process of resetting one or more of your credentials. I’m sure we’ve all done
    that many, many times! What happens if and when a biometric “credential” (fingers,
    toes, or eyeballs) is compromised? Similarly, in tactical environments such as
    the army, how do you leverage biometrics when soldiers are required to wear gloves
    with their standard-issue uniforms as well as some form of eyewear. These are
    some of the challenges that make the use of biometrics difficult for some modern-day
    cases.


    ## VPNs


    Internet access has become a public expectation rather than a commodity only for
    those with business needs or those willing to pay for mobile subscriptions. With
    more publicly available and easy-to-access internet sources, keeping communications
    and network transactions private and between expected end users has become more
    important than ever. Thus VPNs were created to keep end users’ network traffic
    protected and private while still on a public network. This type of technology
    is akin to driving on a busy highway with millions and millions of other cars,
    but you are able to drive safely in your own lane. Your personal lane connects
    you as an end user to any destination where you would like to go. This lane also
    exists for as long as you are on the road as well as when you arrive at your destination
    and are done driving. At that point the lane is repurposed for someone else to
    use. VPNs are used to keep private network communication private while still providing
    access to the internet.


    A VPN works by routing your device’s internet connection through a chosen private
    server rather than your internet service provider. It acts as an intermediary
    and conceals your IP address. If your data is somehow intercepted, it will be
    unreadable until it reaches its final destination. This process is illustrated
    in figure 7.[6](#11656-0014.xhtml#en30)'
