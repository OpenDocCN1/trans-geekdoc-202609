    ## Cyber Principles in Action


    I end this chapter by looking at a real-world incident that encompasses a number
    of these cyber principles gone wrong. This attack was so impactful it even has
    its own website ([www.heartbleed.com](http://www.heartbleed.com)). Here is the
    background of the attack, which occurred in 2012 and was publicly disclosed in
    April 2014, directly from the site:


    > The Heartbleed Bug is a serious vulnerability in the popular OpenSSL cryptographic
    software library. This weakness allows stealing the information protected, under
    normal conditions, by the SSL/TLS encryption used to secure the Internet. SSL/TLS
    provides communication security and privacy over the Internet for applications
    such as web, email, instant messaging (IM) and some virtual private networks (VPNs).
    The Heartbleed bug allows anyone on the Internet to read the memory of the systems
    protected by the vulnerable versions of the OpenSSL software. This compromises
    the secret keys used to identify the service providers and to encrypt the traffic,
    the names and passwords of the users and the actual content. This allows attackers
    to eavesdrop on communications, steal data directly from the services and users
    and to impersonate services and users.


    Remember, there are two types of encryption: one that uses the same key for encryption
    and decryption (symmetric encryption), and another that uses two different keys
    (asymmetric encryption). In the Heartbleed attack, almost 70 percent of internet
    users were affected since OpenSSL was used by about 66 percent of the web servers
    currently in use at the time. Based on the attack, the private key within the
    asymmetric key pair was compromised. This was a widespread attack that affected
    over six hundred million internet sites. A simple programming error caused it,
    but the result was catastrophic. Attacks of this magnitude affect most (if not
    all) cybersecurity tenets. The primary result of this attack was the ability for
    an attacker to eavesdrop. This impacted confidentiality and integrity as an attacker
    could obtain the traffic of a user and manipulate it before it reached its final
    destination. Similarly, even if the source was authenticated via a digital signature,
    since the private key was compromised, the signature could not be trusted as being
    from the actual key owner. This overcame both the nonrepudiation and authentication
    tenets. Next, recall that authentication is a prerequisite for authorization.
    If a user cannot be authenticated, implicitly they cannot be authorized to access
    a particular resource since they cannot be verified. Due to the Heartbleed attack,
    a number of websites were taken down to be updated, resulting in widespread downtime
    across the web. Even though this downtime was temporary, it still affected the
    availability of a large percentage of websites online. As I have shown through
    the Heartbleed attack, a single attack can adversely affect any and all of the
    cybersecurity tenets. As a result, it is important to have a good understanding
    of how to preserve these tenets.


    # 3


    # Cryptography Demystified


    In the last chapter, I introduced all the main tenets within the field of cybersecurity:
    confidentiality, integrity, availability, authentication, authorization, and nonrepudiation.
    In this chapter, I further examine the field of cryptography and demonstrate how
    it enables several of these tenets. To help understand its importance, let’s again
    take a look at the real-world example of Heartbleed, a security bug in the OpenSSL
    cryptography library, which is a widely used implementation of the TLS protocol.'
