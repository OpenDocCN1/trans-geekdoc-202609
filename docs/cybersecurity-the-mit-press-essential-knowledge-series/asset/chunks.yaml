    The primary challenge with using a VPN is the infrastructure required. As you
    may have guessed, VPN tunnels share some similarities with `SSL/TLS`, which form
    the basis for secure (`HTTPS`) connections. `HTTPS` secures information communicated
    between a person’s web browser and a website. It is indicated in green in the
    browser address bar and also by a padlock icon. While this does indeed provide
    added security while web browsing, your data will still be vulnerable, particularly
    if you’re using public `Wi-Fi`. If anonymity online is worth it to you, then VPNs
    add an effective layer of security and are one of the more common forms of cybersecurity
    used online today.


    ![](images/11656_007_fig_000.jpg)


    ## E-commerce


    Modern society is an online one. Communication, experiences, and even shopping
    can all be done online, so much so that traditional brick-and-mortar storefronts
    are closing due to a lack of foot traffic and business. Many people would rather
    shop online, and with `Amazon`’s Prime delivery, you wait only one to two days
    before the item is delivered to your front door—the ultimate convenience factor.
    That said, with this convenience comes quite a range of cybersecurity concerns,
    most of which are centered around data protection and user privacy. This was never
    more apparent than in 2014 when the e-commerce site `eBay` was breached, and reportedly
    145 million users’ account information was potentially viewed and exfiltrated.[7](#11656-0014.xhtml#en31)
    Such a breach would be cause for concern even for the most secure organizations,
    but `eBay` is unique since, supposedly, its account information was stored in
    plaintext. This means there was no encryption to mask the actual username, email
    address, phone number, physical address, and date of birth of its users. This
    may seem innocuous and innocent, but this type of information can be used to launch
    attacks on other platforms. Think of the common questions that are asked by password
    reset protocols on platforms such as email. Usually they will ask for answers
    to one or more of the personally identifiable metrics that were jeopardized in
    the `eBay` breach. This could lead to catastrophic breaches, hacks, and unauthorized
    access across multiple sites, perhaps even on banking websites.


    This breach was also interesting because of how the attackers gained access. Reportedly
    the hackers used three employee log-in credentials to gain access to the large
    database of user accounts. This suggests that social engineering attacks such
    as `phishing` or vulnerable browsers were exploited to retrieve these unsuspecting
    employee accounts. Applying cybersecurity to e-commerce represents a challenging
    problem as it must protect data for both end users and the employees who have
    access to the end user data. How would you protect end user accounts? How would
    you change the level of access for employees? These are difficult questions that
    have a snowball effect on how systems are implemented and how businesses operate
    online. Modern e-commerce systems such as `Amazon` have advanced to the point
    where their use is secure. Thus as a general user, it is important to use reputable
    vendors when shopping online.


    ## Banking, Tokens, Payment Systems, and Brokerage Systems


    Virtual tokens are another way that authorization can be provided when a user
    needs to frequently access a secured system. Tokens rely on various cryptographic
    algorithms. `Soft(ware)` tokens, for instance, are locally stored apps that allow
    for two-factor authentication beyond just a username and password. They are loosely
    based on the `Kerberos` cryptographic algorithm, which was designed at `MIT` to
    provide strong authentication for client and server applications by using secret
    key cryptography. A good example is `Apple Pay` and other smart device payment
    systems, which utilize soft tokens authorized by the various payment companies
    that represent physical credit and debit cards owned by the end user. This algorithm
    basically uses a central server to grant soft authentication tokens to various
    devices. These soft tokens provide the ability for these devices to act as an
    authenticated user, granting the device any access control capabilities that the
    end user approves. Consumers can use these soft tokens to purchase goods just
    as their physical credit cards would work in stores.


    Soft tokens are great for gaining easy access to systems without having the physical
    token—that is, credit card. This type of access also requires stringent control
    over how and what devices are authorized to gain access via soft tokens. `MFA`
    can be used to ensure the correct device is authorized to access systems via soft
    tokens. Soft tokens also provide the ability to decouple username and password
    tokens from system access. In this case, if an attacker were to view an account
    being accessed, without possession of a soft token, they would not be able to
    associate the log-in credentials with the soft token to log in. This effectively
    creates an authorization process that is anonymized, as the soft token is associated
    with specific log-in credentials but cannot be used to identify a particular user.


    ## Blockchain Technology


    An online society provides great flexibility and access to information—more access
    than was ever imagined. With great access, though, comes a greater need for accounting.
    Keeping track of all the various communications, transactions, and activities
    online seems like a nearly impossible task. But one technology that has been used
    to record the activities and transactions happening online is `blockchain`. Better
    known for its application to `Bitcoin` and other cryptocurrencies, `blockchain`
    at its core is technology that records data using cryptographic algorithms, ensuring
    that the actions and activities that are recorded cannot be denied. This process
    of nonrepudiation guarantees that an action executed by `Person A` was in fact
    executed by `Person A` and cannot be denied in the future. `Blockchain` technology
    also removes the need to have a single controlling party (like a private corporation
    or central bank) review and capture every record of online activity. This process
    (called `decentralization`) allows for more efficient recording and provides higher
    integrity than traditional methods since `blockchain` technology is based on cryptography.


    In terms of cybersecurity, this could alter how end users interact with the internet
    as third-party hosting fees could effectively disappear, and all transactions
    would occur directly between supplier and consumer. This could also make transactions
    more efficient and secure since they could be publicly verified and proven. Some
    of the more common use cases for `blockchain` technology are as follows:


    *   **Banking and finance**: Cryptocurrencies serve as a unifying currency that
    can be ubiquitously used across the world without a third-party arbitrator.

    *   **Digital identity**: Identity credentials could be stored on `blockchain`
    to preserve immutability and make auditing easier whenever the credentials are
    used within a registered system.

    *   **Government**: Government regulations require annual compliance audits across
    a number of domains. `Blockchain` could be used as an immutable repository for
    enforcing regulatory compliance as well as auditing various compliance standards.

    *   **Health care**: Data control and exchange based on `blockchain` can make
    medical data management, including drug and medical device tracking, more efficient.

    *   **Law**: `Blockchain` introduced the concept of a `smart contract`, which
    is a digital representation of an actual legal document.

    *   **Publishing**: `blockchain` can serve as a viable replacement for digital
    rights management of such content as music or e-books. The copyright rules and
    requirements could be stored and enforced via `blockchain` technology.

