- fmt: '

    I have discussed multiple applications of authentication to include system/device/web
    access, MFA, and biometrics. The top examples for authorization are access control
    lists (`ACLs`) for files, applications, and several network devices. `ACLs` for
    files and applications are essentially the same as the permissions I previously
    described. Network devices such as a firewall or intrusion prevention system (`IPS`)
    control access to traffic flowing in or out of a network. They both leverage some
    form of authorization techniques in their approach to traffic control. Firewall
    `ACLs` are called rules. For instance, most companies prevent access to certain
    sites (e.g., pornography sites) from an internal computer. One or more rules that
    disallow a web browser from navigating to that type of website accomplishes this
    block. An `IPS` is usually deployed to prevent malicious traffic from coming into
    a network. An easy illustration to understand is an email that has an attachment
    with some form of malware in it. XYZ has designed an `IPS` to detect this type
    of traffic, and then block the attachment or prevent the email from reaching the
    recipient’s in-box.


    ## Nonrepudiation


    The last goal of cybersecurity—`nonrepudiation`—is typically handled using a digital
    signature or something similar. It prevents someone from being able to claim that
    they did not send a message or authorize some other action, when they actually
    did. It is most commonly used in email, however it has its origins off-line in
    the postal service. Postal services offer the mail service of registered mail
    in many countries. Registered mail provides the sender proof of mailing via a
    mailing receipt, and on request, electronic verification that the mail service
    delivered an article or attempted to make a delivery. In this case, `nonrepudiation`
    is focused on the recipient—not the sender—but the same principles apply. A second,
    nontechnical example is a notary public—someone authorized by the government to
    serve the public as an impartial witness in performing a variety of official fraud-deterrent
    acts related to the signing of important documents. A notary’s duty is to screen
    the signers of important documents for their true identity, to sign without duress
    or intimidation, and to be aware of the contents of the document or transaction.


    In the digital world, `nonrepudiation` plays a role in email origin verification,
    financial transactions, and audit records. For email, since malware is often transmitted
    through attachments, `nonrepudiation` gives the sender some form of proof that
    the origin of the message is legitimate and can be trusted. This is accomplished
    using a digital signature. If you recall, earlier I discussed asymmetric key cryptography.
    In this form of cryptography, there is a public and private key. I will explore
    this in further detail in chapter 3, but here it is helpful to note that the private
    key is used to produce a digital signature that can be verified by the recipient
    of an email message. In financial transactions, users are required to provide
    identifying information before making a purchase and each transaction is associated
    with a unique `ID`. This is, in part, to provide `nonrepudiation` to protect vendors
    from users making false refund claims for products they have already received.
    Lastly, financial websites maintain a detailed record of each page visited including
    information such as internet protocol (`IP`) addresses. Digital forensics can
    use this information to prove the authenticity of a user’s actions.[10](#11656-0014.xhtml#en13)


    ## Cyber Principles in Action


    I end this chapter by looking at a real-world incident that encompasses a number
    of these cyber principles gone wrong. This attack was so impactful it even has
    its own website ([www.heartbleed.com](http://www.heartbleed.com)).


    ```

    The Heartbleed Bug is a serious vulnerability in the OpenSSL cryptography library,
    which is a widely used implementation of the TLS protocol.

    ```

