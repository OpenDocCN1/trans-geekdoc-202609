    |

    | Authorization | Access to resources cannot be verified | Attackers can gain
    unauthorized access to resources (ones they do *not* own) by exploiting a sensitive
    data exposure vulnerability in the web application |

    | Nonrepudiation | The source of information received cannot be verified | Attackers
    can send a malicious message and deny they sent it based on using a web application
    component with a known vulnerability |


    ## Cyber Risk Formula


    The Cyber risks concept brings everything together by relating threats and vulnerabilities
    in a formula. Risk can be described as the probability that a vulnerability will
    be exploited by a threat actor. It also considers the impact of that exploitation
    on a critical asset and is typically represented by a simple formula: `risk =
    threat × vulnerability × impact`. The impact is then a qualitative assessment
    of the impact level to the asset in question. For example, if the web application
    we are evaluating is for an e-commerce business such as Amazon, and an attacker
    is able to take down the website for a couple of hours, the impact level would
    be high for that particular vulnerability. Why? Because Amazon is primarily an
    e-commerce business that makes quite a bit of money per hour. Let us assume that
    Amazon makes $15 million per hour. If a particular vulnerability was exploited
    that resulted in two hours of downtime, this would cost Amazon approximately $30
    million. This is called a high-impact vulnerability. Putting it all together,
    we come up with a risk score or rating based on these factors. Table 5 provides
    an overview of some potential scores for this fictitious web application example.
    It is important to note that risk scores can be subjective based on the subject
    matter expert’s level of expertise or bias toward certain types of threats and
    vulnerabilities. So please keep in mind that most risk ratings are qualitative
    at best—unless a numerical rating scale is used (e.g. `High = 7–10`).


    The process we just went through of identifying threats and vulnerabilities, and
    computing some rudimentary risk ratings, is called a cyber risk (or security/threat)
    assessment. At a high level, a cybersecurity risk assessment identifies the various
    information assets that a cyberattack could affect (such as hardware, systems,
    laptops, customer data, and intellectual property), and then identifies the various
    risks that could affect those assets. As shown, it is a comprehensive way to look
    at how an attacker can exploit a target in a variety of ways. A cyber risk assessment
    can inform purchasing decisions for users or help companies prioritize cyber defense
    resource spending. Finally, let’s consider the process by which this exploitation
    takes place. This is called the cyber kill chain model.


    ### Table 5 Cyber Risk Ratings


    | Cyber threat (table 2) | Cyber vulnerability (table 4) | Impact/risk |

    | --- | --- | --- | --- |

    | Information will not be kept secret | Data exposure | Medium | Medium |

    | Information cannot be trusted | Data manipulation | High | High |

    | Information will not be available when it is needed | Denial of service | High
    | High |

    | Identity cannot be verified | Identity spoofing | High | Medium |

    | Access to resources cannot be verified | Unauthorized access | Medium | Low
    |

    | The source of information received cannot be verified | Source identity spoofing
    | Low | Medium |


    ## Cyber Kill Chain


    The media, especially TV shows and movies, depict cybersecurity attacks in a sexy
    and fast-paced way. The hacker is often a nerdy-looking character who is able
    to penetrate the most complex systems or networks in a matter of minutes or hours.
    This all occurs with various screens popping up, showing the apparent exploit
    they are executing against a target. One of my favorite movies of all time is
    *Swordfish*. In the film, a covert counterterrorist unit called Black Cell seeks
    money to help finance its war against international terrorism. Its leader, Gabriel
    Shear, brings in convicted hacker Stanley Jobson to help him. In one scene, Stanley
    must prove himself by hacking into a US Department of Defense system in sixty
    seconds. As the clock ticks, he tries a variety of different techniques. Later
    in the movie, he is asked to find and deploy a worm he created in college that
    steals money from a series of microtransactions in major banks across the world.
    For this feat, he has a few days before his time is up again.


    Although exciting to watch, movies and shows like this minimize the time, effort,
    and knowledge required to effectively penetrate even the simplest of networks,
    much less one that is as secure as the Department of Defense. For example, none
    of the steps Stanley uses are actually found in the kill chain model. As I explore
    the steps of a cyberattack and provide a real-world illustration, not a Hollywood
    one, it becomes clear why each step is required.


    The cyber kill chain process, developed by Lockheed Martin, identifies seven steps
    that adversaries must complete in order to achieve their objective.


    *   **Step 1: Reconnaissance**—The act of performing recon on a target to gain
    information about potential weak points that can be exploited (e.g., harvesting
    email addresses).

    *   **Step 2: Weaponization**—The act of creating an exploit based on weaknesses
    identified in the previous step (e.g., if a company is using a vulnerable application
    or service, design an exploit for this service).

    *   **Step 3: Delivery**—The act of delivering the exploit (often called a payload)
    to the target network or device (e.g., sending the exploit via email in the hope
    that an employee will download it).

    *   **Step 4: Exploitation**—Once an exploit is successfully delivered, this step
    is the act of the application running on the victim machine to take advantage
    of the weakness identified in step 1 (e.g., a vulnerable version of Adobe Reader).

    *   **Step 5: Installation**—This step goes along with step 4 in that once the
    exploit is successful, malicious code (the payload) will be installed on the victim
    machine.

    *   **Step 6: Command and control**—Part of any exploit is the ability to correspond
    with the attacker from the victim machine. This step indicates that the payload
    will have a component that allows an adversary to do this (e.g., the communication
    channel between victim machine and “home”).

    *   **Step 7: Actions on objectives**—The act of executing the objective against
    a target. Usually, this action is data theft, but it may also be a denial-of-service
    or deception-based attack (e.g., phishing or social engineering).


    Now let’s look at a real example that shows the cyber kill chain in action. In
    2013, Target was the subject of a cyberattack that resulted in the theft of approximately
    110 million shoppers’ financial and personal information. The US Senate’s Committee
    on Commerce, Science, and Transportation did an outstanding job of putting together
    a report that aligns the kill chain with the actual breach. I summarize its findings
    here:

