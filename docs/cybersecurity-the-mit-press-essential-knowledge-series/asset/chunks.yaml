    | 信息将不会保密 | 数据泄露 | 中 | 中 |

    | 信息不可信 | 数据操纵 | 高 | 高 |

    | 信息在需要时无法可用 | 拒绝服务 | 高 | 高 |

    | 身份无法验证 | 身份欺骗 | 高 | 中 |

    | 资源访问无法验证 | 未经授权的访问 | 中 | 低 |

    | 接收信息的来源无法验证 | 身份欺骗 | 低 | 中 |


    ## 网络杀伤链


    媒体，尤其是电视节目和电影，以一种性感且快速的方式描绘网络安全攻击。黑客通常是一个看起来书呆的角色，能够在几分钟或几小时内穿透最复杂的系统或网络。这一切都伴随着各种屏幕的弹出，显示出他们正在针对目标执行的明显利用程序。我一生最喜欢的电影之一是《电子鱼鱼》（*Swordfish*）。在电影中，一个名为“黑细胞”的秘密反恐部队寻求资金来资助其对抗国际恐怖主义的战争。其领袖加布里尔·谢尔（Gabriel
    Shear）请来惯犯黑客斯坦利·乔布森（Stanley Jobson）来帮助他。在一个场景中，斯坦利必须在六十秒内进入美国国防部系统来证明自己。随着时钟滴答，他尝试了各种不同的技术。电影后期，他被要求找到并部署他在大学期间创建的一种蠕病毒，这种病毒可以从世界各大银行的一系列微交易中窃取资金。为了完成这一壮，他在时间到期前还有几天时间。


    虽然看起来很刺激，但这类电影和节目最小化了有效渗透即使是最简单的网络所需的时间、努力和知识，更不用像国防部那样安全的网络了。例如，斯坦利使用的任何步骤实际上都没有出现在杀伤链模型中。当我探索网络攻击的步骤并提供真实的插图（而不是好莱坞式的）时，就很清楚了为什么每一步都是必要的。


    由洛克希德·马丁（Lockheed Martin）开发的网络杀伤链识别了对手为了实现目标必须完成的七个步骤。


    *   **步骤 1：侦察（Reconnaissance）**——对目标进行侦察以获取有关可以利用的潜在弱点的信息（例如收集电子邮件地址）。

    *   **步骤 2：武器化（Weaponization）**——根据上一步识别出的缺陷创建利用程序的行为（例如，如果公司使用有漏洞的应用程序或服务，则为该服务设计利用程序）。

    *   **步骤 3：交付（Delivery）**——将利用程序（通常称为载荷）传递目标网络或设备的行为（例如通过电子邮件发送利用程序，希望员工会下载）。

    *   **步骤 4：利用（Exploitation）**——一旦利用程序被成功交付，该步骤是应用程序在受害者机器上运行以利用步骤 1 中识别的缺陷（例如，旧版本的
    Adobe Reader）。

    *   **步骤 5：安装（Installation）**——这一步骤与步骤 4 同时进行，一旦利用成功，恶意代码（载荷）将安装在受害者机器上。

    *   **步骤 6：命令与控制（Command and control）**——任何利用程序的一部分都是受害者机器与攻击者通信的能力。这一步骤表明载荷将具有一个允许对手执行此操作的组件（例如受害者机器与“家”之间的通信通道）。

    *   **步骤 7：目标达成（Actions on objectives）**——针对目标执行目标的行为。通常，这种行动是数据窃取，但也可能是拒绝服务或基于欺骗的攻击（例如，钓鱼或社会工程）。


    现在让我们来看一个展示网络杀伤链实际运作的真实案例。2013 年，Target 成为了一场网络攻击的目标，导致约 1.1 亿购物者的财务和个人信息被盗。美国参议院商务科学与交通委员会编写了一份优秀的报告，将杀伤链与实际泄露事件联系起来。我在这里总结了他们的发现：


    '
- fmt: '

    - **Step 1: Reconnaissance**—The attacker sent emails to a Target contractor,
    phishing for information, and performed internet searches to map the internal
    network structure.

    - **Step 2: Weaponization**—This step is not detectable by cyber defense techniques
    because it occurs off-line after the weakness is determined. In this step, the
    attacker prepared the exploit based on the information gathered in step 1.

    - **Step 3: Delivery**—The attacker delivered the payload in an email to the Target
    contractor through spear phishing (targeted email attack).

    - **Step 4: Exploitation**—Once delivered, the malicious application started to
    record credit card swipes and store data for later theft (step 7).

    - **Step 5: Installation**—As implied by step 4, the application had to be installed
    prior to being able to record the credit card transactions.

    - **Step 6: Command and control**—The attacker maintained a foothold on Target’s
    network for over a month. Thus there is a reasonable assumption that there was
    a communication channel open between the victim’s machine and the attacker (although
    this is unconfirmed in the report).

    - **Step 7: Actions on objectives**—The attacker transmitted the stolen data to
    outside server locations.


    As you can see, there is quite a bit more involved in executing a cyberattack
    than is shown on a TV show or infomercial. The process of targeting and attacking
    a victim machine or network is complex as well as lengthy. For movie lovers, even
    the beloved *Hackers* of 1995 depicts hacking in a context that is somewhat unrealistic.
    In the film, hackers are blamed for creating a virus that will capsize five oil
    tankers. An attack of this magnitude would require all seven of the stages enumerated
    above, yet on film it is easier and more exciting to portray the actual attacks
    after the prework has been done. For example, one of the hackers is arrested and
    charged with crashing 1,507 computer systems in a single day and causing a single-day
    seven-point drop in the New York Stock Exchange. While the single day of the attack
    is conveyed, a number of unseen steps had to occur prior to this (e.g., identifying
    the systems, installing bot programs on the machines, and programming the crash
    time logic—when to execute). Because it isn’t as thrilling to watch, the work
    that goes into planning an attack never makes it into the news and is left out
    of movie plots. In reality, though, that work is crucial to the successful execution
    of a cyberattack using the kill chain model.


    # 6


    # Malware in Action


    You wake up in the morning in a great mood. Yesterday you found out you got a
    promotion and raise because of your outstanding performance with your company’s
    clients. This is going to be a *great* day, and you try to get to work early.
    You speed through your regular morning routine and get to work an hour ahead of
    time. Sure enough, there is an email from the vice president of human resources
    with instructions on how to “claim your promotion.” Without thinking about it,
    you click on the email and open the PDF attachment. Part of the instructions require
    you to download a new promotion tool kit that was specially designed to aid in
    the promotion process, so of course you follow the instructions exactly.


    Around this time, your coworkers begin to arrive, and some walk by to shake your
    hand and offer you congratulations. This day could not get *any* better! The application
    finishes installing around the time your supervisor, Harry, gets in. You can hardly
    contain your excitement, so you let him know that you got in early to clear your
    schedule for any new tasks assigned to you given your new role. He’s impressed
    by your initiative! Next you inform Harry that you received the email from human
    resources and already took care of installing the promotion tool kit, but you
    have some questions. The look on Harry’s face is priceless as he asks the two-word
    question: “What email?” You repeat yourself and then realize that he wasn’t joking.


    You walk back to your computer with Harry to see a crowd of coworkers gathered
    around your desk. Every few seconds, frustrated screams rise from your colleagues
    that sit closest to you. Figure 6, shown below, is now on your screen, indicating
    that you have been hit with a ransomware attack and all your files are inaccessible.


    Before long, the ransomware has infected the entire office. The day that started
    early also ended early—with you carrying a box to your car in shame.


    So what was the meaning of all that? What happened, and how could it have been
    avoided? Malware is any software intentionally designed to cause damage to a computer,
    server, client, or computer network. In this unfortunate case, you were exposed
    to one of the most damaging and costly forms of malware—ransomware. Such attacks
    typically involve the infection of a single machine, which allows the attacker
    to hold data hostage on an organization’s server or even a cloud-based server.
    All malware has its similarities, but they can be unique in their damaging effects.
    Let’s learn some more about this dangerous cybersecurity issue.


    ## Malware Overview


    The primary goal of malware is to gain access to sensitive information or prevent
    the access of authorized users to this information. Malware comes in a variety
    of different forms, such as the Creeper virus and Morris worm discussed in chapter
