    The username and password paradigm dates back thousands of years in the physical
    world. Having to provide a secret code to gain access to a back room or tavern
    has been in existence for millennia, and is portrayed in countless modern movies
    and stories. The mindset behind applying username and password authentication
    is that end users would be the only people who know their passwords, and this
    would be enough to keep them secret and their accounts safe. But when hackers
    and attackers were able to discover end users’ passwords without having to ask
    the user—by using brute force attacks and tools, such as the password cracker
    `John the Ripper`, with just dictionary words and simple combinations—the username
    and password paradigm had to shift.[3](#11656-0014.xhtml#en27) Storing passwords
    with a random salt mask became common to keep passwords protected on the disk
    where they are stored. Forcing end users to change their password every thirty,
    sixty, and ninety days made attacking end users harder since their target to attack
    kept changing. Additional length and character requirements for passwords also
    made brute force attacks more difficult.


    Yet even with all the safeguards, rules, and policies in place to make username
    and password combinations more secure, if MFA isn’t used, as discussed in chapter
    2, usernames and passwords are still susceptible to the aforementioned cyberattacks.
    MFA serves as a complement to password-based authentication by adding a factor
    (or factors) required for complete authentication. Recall how in chapter 2 I presented
    the fact that a fully secure authentication system would encompass the following:


    *   Something you know (username and password)

    *   Something you have (MFA token)

    *   Something you are (biometrics, as discussed in the next section)


    A typical method of MFA would send an SMS message to your phone with a number
    combination that you have to enter after successfully entering your username and
    password combination. Not only does this add another authentication step, it requires
    an attacker to have physical access to the mobile device you have registered.
    This method may seem foolproof and completely secure, but what happens if you
    forgot that you loaned someone your old phone or it was stolen? Or worse yet,
    what if you upgraded to the latest `Android` or `Apple` device, and forgot to
    do a secure wipe before turning it in? The next time you attempt to authenticate
