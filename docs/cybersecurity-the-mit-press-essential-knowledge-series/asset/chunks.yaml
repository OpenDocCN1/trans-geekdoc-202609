    # 5


    # Who Attacked Me?


    Growing up, we used to play a game where you would tap someone on one side of
    their body and duck or hide before they saw who it was. Through your own laughter,
    you could often hear them asking, “Who hit me?” and see them looking around, confused.


    Determining “who did it” is called attribution, and it’s an important challenge
    in the field of cybersecurity. Attribution in cybersecurity is the process of
    a digital forensics investigation to determine the who, why, what, where, and
    how of a cyberattack. A single attack can comprise many variables, including multiple
    steps (e.g., social engineering and then data theft), polymorphic code (i.e.,
    code that changes), various attack methods (e.g., social engineering, denial-of-service
    attacks, or deception-based methods), or multiple participants (i.e., collaborative
    attacks). So like the childhood game I described, it could be difficult to determine
    who attacked you.


    To simplify the challenge, cybersecurity is segmented into three main categories:
    *threats*, *vulnerabilities*, and *risks*. A threat is a potential digital event
    that could cause damage to an information system or network. For example, for
    an e-commerce website, a potential threat could be that the website could be taken
    down for a period of time, resulting in a loss of revenue since products cannot
    be sold. A vulnerability is a potential threat due to some form of weakness or
    error in a system. Computer programming errors, for instance, typically result
    in some form of a vulnerability. Using the same example of the e-commerce website,
    let’s assume that there is a programming error that allows someone to purchase
    a particular item for less than the advertised price. This would be considered
    a vulnerability. The threat in this case would be that someone could purchase
    a product for less than the advertised cost because of the error.


    Lastly, a risk takes into account threats, vulnerabilities, and consequences.
    It is a measure of the likelihood of a cyberattack given certain conditions. This
    likelihood is a rough measure that describes the chances that a given vulnerability
    will be discovered and used by an attacker (or a “threat actor” in cybersecurity
