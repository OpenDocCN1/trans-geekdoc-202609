- fmt: '

    There are four main types of separation within an OS: `physical`, `temporal`,
    `sandboxing`, and `cryptographic`. While physical separation provides the highest
    practical level of security, it is not practical for modern applications. Temporal
    separation uses the same hardware to execute the tasks, but they are executed
    one after the other. Sandboxing prevents code from doing something harmful by
    holding it in a separate container (e.g., a file that has been quarantined). Access
    to resources outside the sandbox is strictly limited. Cryptographic separation
    involves the encryption of sections in the memory; it prevents other processors
    without the key from decrypting the information.


    Memory protection prevents one process from affecting the confidentiality, integrity,
    or availability of another. This is a requirement for secure multiuser systems
    (more than one logged-in user at a time) and multitasking systems (more than one
    simultaneously running process). It is accomplished via process isolation, hardware
    segmentation, and `virtual memory`. Process isolation is a logical control that
    attempts to prevent one process from interfering with another. Hardware segmentation
    takes process isolation one step further by mapping processes to specific memory
    locations. This provides more security than (logical) process isolation alone.
    Memory protection ensures that whenever two or more applications are being used
    at the same time, there is no interference. To illustrate this, imagine you are
    using `Microsoft Word` to create a document and are also building a supplemental
    `PowerPoint` presentation. If memory protection did not exist, you could be writing
    in one application, and see that text or image show up in the other application.
    Worse yet, one application could cause the other one to shut down if memory was
    handled incorrectly. This is why memory protection is sometimes referred to as
    memory management.


    Access control comes in a variety of forms. The primary ones are mandatory, discretionary,
    role based, and rule based. Mandatory access controls are imposed by a system
    administrator and cannot be changed by users. Discretionary access controls are
    determined by a user. For example, permissions on file access that are set by
    a user are considered discretionary.


    Users can change, update, or modify these permissions at any time. In contrast,
    a mandatory control for file permissions is not able to be changed by a user.
    Role-based access control focuses on categorizing access by user type (e.g., general
    or administrator). Rule-based access control simply defines the conditions of
    access such as time of day or logistical access constraints. An example of role-based
    access control would be when a particular computer or file is only accessible
    during a certain time.


    ## Application/Software Security


    Now that I have covered people, networks, and systems (host) security, we should
    be well protected, right? The answer should be yes, but after people, applications
    are the main target of an attacker because they are easier to exploit than an
    OS. There are a few reasons for this, but one of the main ones is that applications
    are designed to require more frequent updates than an OS. The components of an
    OS are pretty standard—some of which I discussed in the previous section. They
    rarely need to be replaced or updated. Yet applications have many more features
    than a standard OS. For instance, `Microsoft Word` has well over a hundred features
    as well as the option to include others through add-ons such as `macros`. In computing,
    a `macro` is defined as a single instruction that expands automatically into a
    set of instructions in order to perform a particular task. An example of a `macro`
    is setting the font to `Arial` or `Times New Roman` each time you open `Microsoft
    Office` or `PowerPoint`. Think about the implications of this. One major implication
    goes back to the attack vector (or layer) of people. Once we get accustomed to
    using a particular application, we use it without thinking about security. When
    was the last time you thought about security before opening a `Word` file? Even
    as I composed this manuscript in `Word`, I certainly didn’t. This is a prime case
    of the convenience versus security dilemma.


    There are a number of application-based security tools that are designed to protect
    against application-based attacks, such as antivirus or antimalware software.
    This is what application security tools mostly rely on: knowing how an attack
    looks beforehand. This is called a `signature` of an attack—the attack’s characteristics.
    Once this signature is known, a rule could be designed to look for these characteristics
    and stop them before they cause damage. But there is a class of attacks called
    `zero-day attacks`, which most commonly target a vulnerability that has not been
    addressed or found. Since these types of attacks are not known, it is impossible
    to create a `signature` (rule) to look for the characteristics.


    There are many techniques that have been proposed in research to prevent zero-day
    attacks from occurring. A simple search on `Google Scholar` for “zero-day attack
    prevention” yields close to two hundred thousand results, both citations (papers)
    and patent ideas. In my opinion, however, the design of more secure software should
    really be the focus of application security. This is the most proactive form of
    prevention. For example, in the typical life cycle of software, the goal is to
    produce software with the highest quality and lowest cost in the shortest time.
    The main steps include planning, designing, building, testing, and deployment.
    See anything missing? Yes! Security. So if this broadly accepted and taught framework
    for software development does not have security in any of its stages, how can
    secure software be the result of any development effort?


    As indicated, it is common practice to perform security-related activities only
    as part of testing. This after-the-fact technique usually results in a high number
    of issues discovered too late (or not discovered at all). It is a far better practice
    to integrate activities across the software development process to help discover
    and reduce vulnerabilities early on, effectively building security in. The concept
    of a secure software development integrates such security measures as `penetration
    testing`, `code review`, and `architecture analysis` into the process. Let’s go
    back to our example of a `macro`. Since on the surface it appears to perform one
    function but can decompose into others, how could we plan for this during software
    development? During the planning and design phases, we could lay out all the instructions
    ahead of time. Let’s call them `one`, `two`, and `three` for simplicity, where
    `one` = open file, `two` = write some text to file, and `three` = save/close file.
    During the building phase (i.e., actually writing the application code), we only
    write those three instructions. In the predeployment testing phase, we test to
    make sure the program is not executing additional instructions (e.g., opening
    additional files), and once the application is deployed, we can verify the execution
    of *only* those three instructions. This makes our application predictable. Therefore
    if it goes outside the bounds of what is expected, it can be stopped. Even though
    this is a simple case, it is a powerful concept in application security. The more
    these principles are taught in conjunction with other application development
    concepts, the more secure code will be.


    ## Data Security

    '
