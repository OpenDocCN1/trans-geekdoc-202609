    It will infiltrate your chips


    Yes it’s Cloner!


    It will stick to you like glue


    It will modify ram too


    Send in the Cloner![3](#11656-0014.xhtml#en3)


    These two cases illustrate how software applications—if they are able to spread
    uncontrollably—can be irritating and intrusive at best, even if they weren’t meant
    to be harmful. Yet the Morris worm created in 1988 was deliberately written with
    malicious intent and arguably led to the cybersecurity field as we know it today.
    Robert Tappan Morris, then a graduate student at Cornell University, launched
    his worm surreptitiously from a computer based at MIT that was connected to the
    then-nascent internet. What made the Morris worm malicious was that it created
    far more copies of itself than Morris intended, which drained the infected computer’s
    resources—this is now known as a denial-of-service attack. Such attacks impact
    a computer system’s *availability*, the second fundamental cybersecurity goal.
    Estimates at the time claimed that the worm infected more than ten thousand computers
    and cost the government hundreds of thousands to millions of dollars to decontaminate
    the stalled computers. Morris was tried and convicted in a federal court.


    So why was the internet’s design so insecure? Have there been improvements over
    the years to address some of its inherent vulnerabilities? To answer these questions,
    we must briefly understand one of its core features—*packet switching*. In 1961,
    MIT PhD computer science student Leonard Kleinrock published a theoretical paper
    on packet switching, an alternative method to purely electronic signals for sharing
    data between connected computer systems. A packet consists of a header and payload;
    the header tells the network’s hardware where and how to deliver the payload,
    the contents of the message. The concept was later adopted in the early plans
    for ARPANET by MIT-trained electrical engineer Lawrence (Larry) G. Roberts, who
    was then working for the Defense Advanced Research Projects Agency.


    Kleinrock would later obtain a professorship at the University of California in
    Los Angeles; his lab was selected as the first node for the nascent ARPANET. As
    more computers were added to ARPANET, computer scientists focused on software
    to govern the shuttling of data across the network. An early example is the host-to-host
    protocol, which outlined the rules by which information is exchanged: the message
    (or packet) format, delivery time, file type, and other such variables. Today,
    consumers assume that their internet-connected devices have built-in cybersecurity
    measures, however that was not a concern for the internet pioneers. Somehow they
    did not anticipate the diversity and intensity of the cyberattacks that now plague
    the internet.


    The Morris worm attack could have been prevented. Estimates are that it shut down
    roughly 10 percent of all the computers connected to the internet at the time;
    that’s essentially a cyberpandemic! That worm proliferated largely because the
    early internet had a flat structure rather than a hierarchical one. Today, the
    internet is essentially made up of public and private networks separated by *firewalls*—cybersecurity
    protocols that monitor and control the flow of traffic into and out of private
    networks (i.e., an organization’s local network). A simple firewall would have
    stopped the Morris worm in its tracks. The internet is now more secure, but it
    is also more threatened. In the subsequent chapters, I will explore both the threats
    and modern cyberdefenses. Additionally, I will show how cybersecurity is practically
    implemented on the internet, and discuss how the field is likely to change with
    new and forthcoming technologies, such as blockchain technology or quantum cryptography.


    # 2


    # Foundations


    In the early 1960s, people saw the great potential of transmitting and sharing
    information across different systems, with a focus on the scientific and military
    fields. The theory of packet switching, which forms the basis of the modern-day
    internet, emerged after MIT’s J. C. R. Licklider proposed the first global network
    of computers in 1962. Along with early technological innovations came the need
    to secure sensitive data, software, and applications, giving birth to cybersecurity.
    Further underscoring the importance of cybersecurity is the explosion of internet
    (or World Wide Web \[WWW\]) users, who jumped from one billion in 2005 to more
    than four billion in 2019.[1](#11656-0014.xhtml#en4) And that’s only 53 percent
    of the world’s (still growing) population!


    The WWW is responsible for the interaction between humans via technological mediums.
    The terms *WWW* and *internet* are often used interchangeably, yet WWW refers
    to the web of information (i.e., websites, files, and other resources) accessible
    via the internet (i.e., a global connection of computers linked together). Tim
    Berners-Lee introduced the idea for the WWW in 1989.[2](#11656-0014.xhtml#en5)
    Since then, a total of four web generations have been introduced. Web 1.0 was
    essentially an information portal for businesses to broadcast their information.
    Web 2.0 introduced the concept of a social network in which people were grouped
    based on common interests. Web 3.0, or the semantic web, featured machine-readable
    content that aimed to reduce the number of tasks and decisions a human would make,
    with the goal of making it easier for humans to find information online by training
    machines to understand the interrelationship between data. This was the advent
    of what we know today as artificial intelligence and machine learning. Web 4.0,
    or the symbiotic web, aims to take the interrelationship between humans and machines
    to an even deeper level. In a symbiotic web, machines are clever enough to read
    internet content and react to it; for example, the web could bring up the last
    page you viewed or display ads based on previous searches. With the advent of
    Web 4.0, it is more important than ever that we understand and implement effective
    cybersecurity. But to do that, we first need to know what cybersecurity actually
    is.


    The overall aim of cybersecurity is to protect digital assets from being compromised.
    I mentioned in chapter 1 that there are six goals of cybersecurity. In fact, there
    are three industry-recognized major goals (1–3), and three others (4–6) that are
    often neglected.


    1.  1\. Confidentiality: keeping information secret


    2.  2\. Integrity: keeping information correct and reliable


    3.  3\. Availability: ensuring information is available to the right people at
    the right time


    4.  4\. Authentication: verifying an identity


    5.  5\. Authorization: verifying access to resources


    6.  6\. Nonrepudiation: validating the source of information


    ## Keeping Information Secret


    Confidentiality is a principle that is easy to understand because it applies to
    many non-cyber situations. The government frequently uses it to denote the act
    of keeping sensitive or classified data from people without the proper clearances;
    the information is only shared on a “need-to-know” basis. Sometimes confidentiality
    is used interchangeably with privacy, as in keeping all confidential information
    in a private or locked container. In the cyber world, people’s information is
    kept confidential through the use of encryption. Described further in the next
    chapter, encryption is a fundamental part of cryptography that allows for data
    to be translated into a form that is illegible to those without authorized access.
    Encryption requires a secret key that is known only to the parties that possess
    it. Decryption is the opposite of encryption and is known as the process of converting
    the encrypted data back to its original form. In the digital world, encryption
    and decryption are accomplished at varying levels of sophistication, but at a
    high level, they are essentially the same as using a key to lock and unlock our
    house or car.'
