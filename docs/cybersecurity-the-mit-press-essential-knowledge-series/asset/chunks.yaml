    or asymmetric algorithms. Symmetric algorithms serve as the base algorithm type
    for transmitting data securely over an online medium (e.g., HTTPS). The evolution
    of symmetric algorithms arose based on some inherent weaknesses in the original
    algorithms that made them susceptible to cryptographic attacks. These weaknesses
    were primarily overcome by increasing the key sizes used for encryption operations.
    Asymmetric algorithms are used mainly for online key exchange as well as supplementing
    symmetric algorithms in establishing VPN connections. When you navigate to a website
    and type in ‘“https,” and then the website name, a key exchange takes place to
    enable a secure connection. Also when you send email, some email clients offer
    the option to digitally sign a message (i.e., verify its authenticity). This is
    accomplished with an asymmetric algorithm too. Finally, perhaps the most emergent
    use case of asymmetric algorithms is with cryptocurrencies like Bitcoin or Ethereum.
    The “magic” behind a cryptocurrency address is asymmetric key cryptography.


    Cryptography would be nothing without its underlying algorithms, which enable . . .
    critical tasks.


    The last class of cryptographic algorithms I will describe are used to preserve
    integrity, and within hashes and MACs. The most popular (yet vulnerable) hashing
    algorithm is MD5. Previous to it being compromised, it was the algorithm of choice
    to protect the integrity of files and other digital data. It generally will produce
    a hashed value of 128 bits. SHA-1 is a widely used cryptographic hash function
    with a 128-bit hash value, similar to MD5. SHA-1 can also be used to check the
    integrity of files, but since its inception there have been known successful attacks
    against it as well as MD5. They have both been succeeded by SHA-2, which produces
    a 256-bit hash value that is much more secure.


    ## The Other Tenets


    I end this chapter with a short discussion of the extent to which cryptography
    relates to the other cybersecurity tenets: *availability*, *authorization*, and
    *authentication*. From the Heartbleed example cited earlier in this chapter, we
    learned that even cybersecurity tenets that do *not* depend on cryptography can
    be affected by incorrect implementations. To enable availability in the traditional
    sense, we look to principles like backup servers and other types of redundancies—not
    cryptography. Yet there are cases (like Heartbleed) where availability could be
    negatively impacted if cryptography is not implemented correctly.


    Authentication uses cryptography in at least two of its forms: the password and
    public key. The process of password-based authentication is relatively straightforward.
    A user will register for an account, and then select a username and password.
    In the back end, the username is stored in plaintext, and a *salt string* is generated
    and attached to the password for additional security. A salt string is a pseudorandom
    text string derived from a password. For example, if your password is 123 (I hope
    this is never the case), a salt string could be “abc.” If an attacker is able
    to discover your weak password (123), they would have to also be able to guess
    the salt value as well in order to use it.


    Public key authentication is an alternative means of identifying yourself to a
    log-in server instead of typing a password. It is more secure and flexible, but
    more difficult to set up. The method of authenticating using cryptographic keys
    is similar to creating a digital signature, as I noted above. The server will
    store the public keys that the users generate on registration. The user will save
    the private key on their own machine or device. When needed for authentication,
    a digital signature is created (with the private key) and presented to the server.
    On verification, authentication will be granted. Authorization takes place after
    authentication has occurred. This process uses access control lists that are protected
    via some form of authentication. As authorization does not use cryptography inherently,
    it falls outside the scope of this chapter.


    # 4


    # Cybersecurity in Layers


    In the movie *Shrek*, Shrek the ogre tries to explain to his sidekick, Donkey,
    why ogres are not just the fierce, carnivorous monsters everyone makes them out
    to be: “You dense, irritating, miniature beast of burden! Ogres are like onions!
    They have layers,” says a frustrated Shrek.


    The same is true of cybersecurity. You cannot just view cybersecurity on the surface
    and expect to understand it completely. But it is also daunting to think about
    cybersecurity as a whole, without separating it into layers of defense. In this
    chapter, I will examine the cybersecurity elements and challenges at each layer
    of defense—people, network, computer (or host), application, data, and the cloud—that
    underlie mobile and internet-connected devices. Although some cybersecurity professionals
    don’t see it this way, my contention is that the only true cybersecurity threat
    is people—for example, an organization’s employees. The objective of most attacks
    is to extract information from a host or negatively affect its users. Remove people
    from the equation, and it becomes difficult to damage a computer system or network
    from the outside.


    To understand cybersecurity according to its layers, cybersecurity experts created
    the term *defense in depth* (DiD). Just as all cyberattacks follow a similar pattern—called
    the cyber kill chain model—cybersecurity has a pattern. Let’s walk through a realistic
    example to demonstrate how this works in practice.


    First, an attacker identifies an employee who consistently skips their cybersecurity
    awareness training and sees them as an entry point into a network. The attacker
    sets up a fake email address and sends that employee an email claiming to be from
    the information technology (IT) department with an “update.” Since the employee
    missed their phishing and social engineering training, they read the email and
    click on the link without giving it a second thought. By breaching the first layer
    (people), the exploit has passed through the network layer and been installed
    on a host system.


    Now that the exploit has been installed on one system within a network, it can
    replicate itself (like the Morris worm) across multiple systems and begin to target
    certain applications. Once applications are exploited, data can be stolen regardless
    of the platform—whether a computer, tablet, or mobile device. So within a few
    steps, you can see how an attacker can permeate all layers of cyber defense and
    accomplish their objectives by simply exploiting the weakest layer: a person’s
    trust.


    Some experts refer to DiD as the “castle approach” because it uses multiple layers
    of defense all designed to protect valuable data and critical assets. The approach
    features intentional redundancies that serve as security fallbacks in case one
    layer fails. Let’s take a more detailed look at all the layers of the DiD model.


    ## People


    In cybersecurity, a social engineering attack involves tricking users in performing
    actions or divulging confidential information. Such attacks have been known to
    fool elementary school students, office workers, or even the most seasoned IT
    professionals. According to cybersecurity firm Purple Security, 98 percent of
    cyberattacks rely on social engineering, 63 percent of successful attacks come
    from internal sources, errors, or fraud, and new employees are the most susceptible
    to socially engineered attacks, and 43 percent of IT professionals said they had
    been targeted by social engineering schemes in 2019.[1](#11656-0014.xhtml#en16)'
