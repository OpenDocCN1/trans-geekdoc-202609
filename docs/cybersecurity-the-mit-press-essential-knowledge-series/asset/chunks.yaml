- fmt: '

    Integrity is the second cybersecurity tenet that cryptography makes possible.
    Where confidentiality is focused on data privacy, integrity revolves around data/system
    trust. There are three primary cases in which integrity is paramount: using a
    computer system, sending data, and receiving data. In the case of using a computer
    system, everything starts with the device or system you are using. If you cannot
    trust the device you are using, then how can you trust the data on it? Sending
    data is closely related in that prior to sending data to someone else, you want
    to be sure you can trust that the data has not been manipulated. Lastly, when
    receiving data, the recipient needs to also also be able to trust the system they
    are using as well as the data on it, including the data received from a sender.
    At a high level, some form of cryptography can address all three cases.


    First, hashing addresses data integrity. Hashing, as mentioned previously, is
    a method of cryptography that converts any form of data into a unique string of
    text. Any piece of data can be hashed, no matter its size or type. In traditional
    hashing, regardless of the data’s size, type, or length, the hash that any data
    produces is always the same length. A hash is designed to act as a one-way function—you
    can put data into a hashing algorithm and get a unique string, but if you encounter
    a new hash, you cannot decipher the input data it represents. A unique piece of
    data will always produce the same hash. So the sender can create and update a
    hash during the data life cycle to ensure that particular data elements can be
    trusted. Similarly, on receipt, the recipient can verify the original hash to
    ensure the data they received is the same data that was sent.


    System integrity is a bit more complex, but the output is the same: being able
    to trust the system. Three main concepts facilitate system integrity: file system
    integrity, hard disk (HD) integrity, and secure boot. Hashing folders or files
    ensures their integrity accomplishes file system integrity. Hashing the entire
    hard drive and everything on it accomplishes HD integrity. Secure boot is a mechanism
    that prevents the computer from turning off if a cyberattack has been detected.
    The combination of all these concepts provides holistic system integrity. You
    can now trust that the computer has not changed since the last time you logged
    in (secure boot), trust the entire system (HD integrity), and trust the files
    residing on the HD (file system integrity).


    ## Cryptography and Nonrepudiation


    The last cybersecurity tenet I will discuss that cryptography enables is nonrepudiation,
    a combination of authentication and integrity. Nonrepudiation is obtained through
    a digital signature or message authentication code (`MAC`). What is the purpose
    of a tenet that encompasses two of the other ones? Well, in dictionary and legal
    terms, a repudiation is a rejection or denial of something as valid or true. Where
    might this principle be relevant in real life with applicability to online transactions?
    Again, the concept of registered mail is relevant here. Registered mail is primarily
    for the sender to ensure three things:


    1. An important package/letter was sent (through tracking)

    2. An important package/letter was delivered (through tracking)

    3. The sender cannot deny that it was received (through a signature)


    In some cases, you can even pay for a signature to be required on delivery to
    enforce number 3 (called signature confirmation). In the digital world, there
    are several cases in which this is important. Imagine you are the owner of a company
    and have to fire someone. You talk with the head of the human resources department
    and their supervisor, and then inform the employee of your decision. The supervisor
    informs the employee, and they are directed to speak with human resources. To
    formalize the “transaction,” the human resources department sends an email to
    the employee as confirmation of the firing action along with the terms. The employee,
    however, did not acknowledge receipt of any termination notice. Thirty days later,
    the company is hit with a lawsuit from the employee’s lawyer, claiming negligence
    because the paychecks stopped coming without the employee being informed.


    A second example is electronic bill transactions. Most companies now have an “environmentally
    friendly” option, allowing you to receive your bills and pay them electronically.
    Would this be possible without nonrepudiation? There are several scenarios that
    could occur without nonrepudiation: the bill payer could deny every month (or
    whenever convenient) that they received a bill, the company could claim that the
    bill payer did not make a payment, the bill payer could claim that they made a
    payment (when they did not), or the company could claim it received partial payment,
    but not all. The list could go on and on, with either party having a legitimate
    claim that cannot be refuted by the other. Nonrepudiation allows us to easily
    address these scenarios through digital signatures and/or `MAC`s.


    A digital signature is created by using the private key within the asymmetric
    key pair. Recall that to encrypt and provide confidentiality, we would use the
    public key to encrypt and the private key to decrypt. Keep in mind that the private
    key must always be kept private. So if we do the opposite and encrypt “something”
    with the private key, we can decrypt it with the public key, right? Yes. This
    is because, as I mentioned earlier, there is a mathematical relationship between
    the two keys allowing one (either-or) to be used for encryption and the other
    to be used for decryption. A lighter form of a digital signature is called a `MAC`,
    which is a block of a few bytes that is used to authenticate a message. The receiver
    can check this block and be sure that the message hasn’t been modified by the
    third party. This may sound similar to hashing. It is, although with one minor
    but crucial difference: their purposes. Once a hash is computed, it can only be
    used to verify the integrity of a message (i.e., that the message was not manipulated
    in transit). `MAC`s also do this, but they use the private key to create a form
    of a digital signature that can be verified by the recipient. So `MAC`s are able
    to provide both integrity and authentication. These concepts are both extremely
    important when it comes to nonrepudiation in digital communications where denial
    is not an option.


    ## Cryptography Algorithms


    Cryptography would be nothing without its underlying algorithms, which enable
    such critical tasks as data encryption, integrity, authentication, nonrepudiation,
    and digital signatures. A cryptographic algorithm is a set of mathematical instructions
    that is used to encrypt or decrypt data. An algorithm is simply a fancy way of
    describing a set of rules that are used to govern a particular problem-solving
    operation (e.g., `1 + 1 = 2`). Cryptographic algorithms work in the same way,
    but they are a bit more complex.

