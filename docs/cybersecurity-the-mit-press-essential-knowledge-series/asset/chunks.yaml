    Heartbleed 漏洞允许互联网上的任何人读取受受影响的 OpenSSL 软件保护的系统内存。该漏洞允许攻击者通过破坏用于保护数据隐私（或机密性）的机制来窃取敏感信息。密钥是实现网络安全准则——机密性的关键，该准则重点关注保持在线对话的私密性。即使在
    2017 年，在这一糟糕漏洞首次被发现近三年后，仍有近二十万个网站和服务器受到该漏洞的影响。幸运的是，这个问题现在已经对大多数网站和服务器得到了解决。然而，这表明了我们在在线安全通信中对加密技术的依赖程度。一个“微小”的编程错误影响了数十亿互联网用户；这就是为什么加密是一个基础概念，需要被广泛理解和重视。


    在最形式的形式，加密可以描述为加密和解密数据的研究。以下两个公式进一步解释了加密的工作原理：


    `ciphertext = plaintext + encryption key` (1)


    以及


    `plaintext = ciphertext + decryption key` (2)


    对于公式 (1)，某种形式的 `plaintext` 通过加密密钥转换为 `ciphertext`。对于公式 (2)，某种形式的 `ciphertext`
    通过解密密钥转换为 `plaintext`。在上述情况下，同一个密钥同时用于加密和解密。这并不总是如此，我将在本书中详细说明。每个公式组件：`plaintext`
    是加密算法的输入，可以是文本、音频和图像的形式。`ciphertext` 通常被描述为加密过程的输出。从另一个角度看，`plaintext` 是可读或合法的格式。为了保护
    `plaintext` 的机密性，`ciphertext` **不应该是**可读或合法的。以下是[实用加密](https://example.org/Practical_Cryptography)
    的简单示例。加密密钥通常由二十六个字母组成。例如：


    `plain alphabet: abcghijklmnopqrstuvwxyz`


    `cipher alphabet: phqgiumeaylnofdxjkzwb`


    `plaintext` 被加密为“defend the east wall of the castle”（保护城堡的东墙），这是非对称加密的一种加密方式，并显示如下：


    `plaintext: defend the east wall of the castle`


    `ciphertext: giuifg cei iprcnn du cei`


    为了创建 `ciphertext`，`plaintext` 的每个字符都与 `cipher alphabet` 中对应的字母替换。`cipher alphabet`
    仅仅是映射如何从 `plaintext` 到 `ciphertext`。其最简单的实例是 `abc` —>`xyz`。每当你看到 `a`，将其替换为 `x`；当你看到
    `b`，将其替换为 `y`；当你看到 `c`，将其替换为 `z`。因此，“cab”会被转换为“zxy。”


    在密码学中，替换加密是一种通过 `ciphertext` 替换 `plaintext` 的方法。需要注意的是，简单的替换加密提供的通信安全性有限，因为它可以很容易被手动破解，特别是当消息变长（超过数百个字符）时。加密密钥通常是专门用于混乱和解密数据的随机位串。加密密钥通过算法创建，以确保每个密钥都是唯一的且不可预测的。这种方式构建的密钥越长，加密越难以破解。记住这一点很重要，因为密钥是加密领域的基础，并类似于物理钥匙。你可以拥有一个由龙、护城河、卫兵和其他机制保护的坚固城堡，但如果进入该城堡的密钥（或机制）被破坏或窃取，所有防御都将失效。


    ## 机密性与加密


    机密性是网络安全的关键准则之一，而加密（产生 `ciphertext`）实现了这一点。正如前面提到的，加密密钥通常是专门用于混乱和解密数据的随机位串。加密方法可以是对称或非对称的。对称加密使用相同的密钥进行加密和解密。非对称加密使用不同的密钥进行加密和解密。它们都有特定的用途以及优缺点。


    对称加密涉及使用双方都可以加密和解密的较短密钥。通过在给定时间内处理大量数据，它实现了计算机资源更快更高效的使用。这使得对称加密成为加密大量数据的首选方法，但也暴露了它的主要弱点之一，导致了对非对称加密的需求。加密的主要目的是保护机密性。为了做到这一点，加密密钥**必须**保持私密。那么如果同一个密钥同时用于对称加密和解密操作，当加密消息通过互联网在双方之间发送且他们没有住得近时，我们如何共享它呢？一种方案可能是通过另一种介质发送。然而，如果该介质是不安全的，密钥可能会被泄露，信息仍可能丢失。这就是非对称加密作为一种补充技术（主要用于密钥管理）变得如此宝贵的地方。


    非对称加密使用一个单一密钥进行加密（如前所述，称为公钥）以及一个单一密钥进行解密（如前所述，称为私钥）。两个密钥之间存在数学关系，使得它们无法相互推导，一个可以用于加密，另一个用于解密。虽然简单，但详细描述这些数学原理超出了本书的范围。可以说，它是代数
    2、模运算和质数的结合，产生了私钥-公钥密钥对，从而实现了非对称加密的“魔力”。非对称加密主要用于加密少量数据，并且在需要在不安全的通道上共享信息的情况下是有益的。信息可以使用公钥进行加密，然后用接收者的私钥进行解密。


    为了澄清这些概念，让我们看看实践中同时使用对称和非对称加密的首要用例之一：公钥基础设施 (PKI)。根据 Thales 公司的说法，PKI 负责消费者在网上体验的大部分安全。一个简单的类比是发行执照的机构。他们负责创建、管理、分发、促进使用、存储和吊销驾驶执照的责任。PKI
    为在线用户提供了许多实用的安全属性。这些包括（但不限于）加强在线身份、实现机密性、为物联网 (IoT) 设备提供安全以及保护对敏感资源的访问。在 PKI 中，使用了两种加密技术来促进安全连接。


