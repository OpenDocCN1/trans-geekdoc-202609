    这两个案例说明了应用程序——即使它们本意并非有害——在某种程度上也是具有侵入性的。然而，1988 年创建的莫里斯蠕病毒是有意的编写的，并可以说催生了我们今天所知的网络安全领域。塔潘·莫里斯（Tappan
    Morris）当时是康奈大学的一名研究生，他发布了蠕病毒。莫里斯蠕病毒的恶意之处在于它创建了比意图多得副本，耗尽了计算机资源——这种攻击现在被称为拒绝服务攻击。此类攻击影响了计算机系统的可用性，这是网络安全的基本目标。据估计，该蠕病毒感染了当时约
    10%的联网计算机，造成了数十万至数百万的损失。莫里斯在联邦法庭受审并被定罪。


    所以为什么互联网的设计是不安全的？多年来是否过改进以解决其固有的漏洞？为了回答这些问题，我们必须简要了解互联网的核心特征——`packet switching`（分组交换）。1961
    年，计算机科学学生莱纳德·克莱因克（Leonard Kleinrock）发表了关于`packet switching`的论文，这是联网系统之间共享数据的另一种方法。一个数据包包含头部（header）和载荷（payload）；头部告诉网络如何以及何时交付载荷的内容。这一概念后来被劳伦斯·G·罗伯茨（Lawrence
    G. Roberts，他当时在国防高级研究计划署[DARPA]工作）在 ARPANET 中采用。克莱因克后来在洛杉矶加州大学获得了教授职位。随着 ARPANET
    的扩展，计算机科学家们专注于管理跨网络的数据传输。早期的主机对主机协议（host-to-host protocol）概述了信息交换的规则：信息（或数据）格式、交付时间以及其他变量。如今，消费者认为联网设备具有内置的网络安全措施，然而这对于互联网先驱们来说并不是考虑的问题。网络攻击的多样性和强度是可以是可以预防的。莫里斯蠕病毒的蔓延很大程度上是因为早期互联网具有扁平化而非分层的结构。今天，我们使用`firewalls`（防火墙）来管理私有网络中的流量。一个简单的`firewall`本可以阻止莫里斯蠕病毒的扩散。互联网现在更安全，但也面临更多威胁。在随后的章节中，我将探索威胁和现代防御。此外，我将展示网络安全在互联网上是如何实现的，并讨论该领域可能会发生的变化。


    ## 2


    ### 基础


    在早期，互联网并不是现在的样子。`packet switching`（分组交换）的概念由莱纳德·克莱因克在 1961 年引入，提供了联网系统之间共享数据的方法。这一概念后来被劳伦斯·G·罗伯茨用于
    ARPANET。随着 ARPANET 的增长，主机对主机协议建立了数据交换的规则，包括分组格式和交付时间。


    莫里斯蠕病毒利用了早期互联网的扁平结构。今天，我们使用`firewalls`来管理私有网络中的流量。虽然简单的`firewall`可以阻止莫里斯蠕病毒，但现代格局要复杂得多且充满威胁。


    Web 的演变可以通过几代来看：

    - Web 1.0：早期的只读网络。

    - Web 2.0：社交与交互网络时代。

    - Web 3.0：语义网络，机器开始能够更好地理解内容。

    - Web 4.0：共生网络，专注于人工智能和机器学习。


    随着这些技术的演进，网络安全对于保护数字资产变得越来越至关重要。


    ## 网络安全


    网络安全的总体目标是保护数字资产免受破坏。我在第一章中提到网络安全有六个目标。事实上，有三个行业认可的主要目标（1–3），以及另外三个经常被忽视的目标（4–6）。


    1. `confidentiality`（机密性）：保持信息保密

    2. `integrity`（完整性）：保持信息正确且可靠

    3. `availability`（可用性）：确保正确的人在正确的时间获得信息

    4. `authentication`（身份验证）：验证身份身份

    5. `authorization`（授权）：验证对资源的访问权限

    6. `nonrepudiation`（不可否认性）：验证信息的来源


    ### 保持信息保密


    机密性是一个易理解的原则，因为它适用于许多非网络场景。政府经常使用它来表示防止没有适当许可的人员接触敏感或机密数据；信息仅在“需要知道”的基础上进行共享。有时，机密性与隐私互用，例如将所有机密信息保存在私有或锁定的容器中。在网络世界中，人们的信息通过使用`encryption`（加密）来保持机密。下一章将进一步描述`encryption`，它是密码学中的一个基本部分，允许将数据转换为未经授权访问的人员无法识别的格式。`encryption`需要一个只有持有者才知道的密钥。`decryption`（解密）是加密的反面，被称为将加密数据转换回原始格式的过程。


