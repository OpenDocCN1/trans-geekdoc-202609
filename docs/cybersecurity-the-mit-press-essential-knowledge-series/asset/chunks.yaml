  trans: '

    使用 VPN 的主要挑战在于所需的底层基础设施。正如你可能猜到的，VPN 隧道与 `SSL/TLS` 具有某些相似之处，后者是安全连接（`HTTPS`）的基础。`HTTPS`
    保护了个人网络浏览器与网站之间通信的信息。它在浏览器地址栏中以绿色显示，并配有一个锁头图标。虽然这在浏览网页时确实提供了额外的安全保障，但你的数据仍然容易受到攻击，特别是当你使用公共
    `Wi-Fi` 时。如果你认为在线匿名对你来说很重要，那么 VPN 提供了一层有效的安全防护，是当今网络上常用的网络安全形式之一。


    ![](img/11656_007_fig_000.jpg)


    ## 电子商务


    现代社会是一个在线社会。交流、体验甚至购物都可以在线完成，以至于传统的实体店因缺乏客流量和业务量而相继关闭。许多人更倾向于在线购物，而且有了 `Amazon`
    的 Prime 递送服务，你只需要等待一到两天，物品就会送到家门口——这是终极的便利因素。尽管如此，这种便利也带来了一系列网络安全忧虑，其中大多数集中在数据保护和用户隐私上。这一点在
    2014 年得尤为明显，当时电子商务网站 `eBay` 遭到破解，据报道有 1.45 亿用户的账户信息可能被查看和泄露。7 这种破解即使是最安全的组织也会感到担忧，但
    `eBay` 的独特之处在于，据称其账户信息是以明文形式存储的。这意味着没有加密来掩盖用户的真实用户名、电子邮件地址、电话号码、物理地址和出生日期。这看起来可能并无害，但这类信息可以被用于对其他平台发起攻击。想想像邮箱等平台上密码重置协议提出的常见问题。通常它们会要求提供一个或多个在
    `eBay` 破解中泄露的个人身份识别指标。这可能导致多个网站（甚至可能是银行网站）发生灾难性的泄露、黑客攻击和未经授权的访问。


    这次破解之所以是因为是因为攻击者获取访问的方式。据报道，黑客使用了三个员工的登录凭据访问了大型用户账户数据库。这表明社交工程攻击（如 `phishing`）或存在漏洞的浏览器被利用来获取这些毫无防备的员工账户。将网络安全应用于电子商务是一项具有挑战性的任务，因为它必须保护终端用户的数据，也要保护有访问终端用户数据的员工。你将如何保护终端用户账户？你将如何更改员工的访问级别？这些困难的问题对系统实现方式和企业在线运营方式具有连锁效应。现代电子商务系统（如
    `Amazon`）已经进步到其使用是安全的程度。因此，作为普通用户，在在线购物时使用声誉良好的供应商至关重要。


    ## 银行、令牌、支付系统和经纪系统


    用户需要频繁访问安全系统时，虚拟令牌是提供授权的另一种方式。令牌依赖于各种加密算法。例如，`Soft(ware)` 令牌是本地存储的应用程序，允许在用户名和密码之外进行双因素身份验证。它们松地基于
    `Kerberos` 加密算法，该算法由 `MIT` 设计，旨在通过密钥加密为客户端和服务器应用程序提供强身份验证。一个很好的例子是 `Apple Pay`
    以及其他智能设备支付系统，它们利用由各种支付公司授权的软令牌，这些公司代表了终端用户拥有的实体信用卡和借记卡。该算法基本上使用中央服务器向各种设备授予软身份验证令牌。这些软令牌提供了让设备充当已验证用户的能力，并授予设备终端用户批准的任何访问控制能力。消费者可以使用这些软令牌购买商品，就像他们的实体信用卡在商店里工作一样。


    软令牌非常便于在没有物理令牌的情况下轻松访问系统。这种类型的访问也需要对哪些设备获得授权进行严格控制。`MFA` 可以用于确保正确的设备通过软令牌访问系统。软令牌还提供了将用户名和密码与系统访问解耦的能力。在这种情况下，这有效地创建了一个匿名化的授权过程，因为软令牌关联了特定的登录用户。


    ## 区块链技术


    在线社会提供了极大的灵活性信息访问——比以往想象的都要多。然而，随着访问的增加，对会计的需求也增加了。跟踪所有的在线通信、交易和活动似乎是一项几乎不可能的任务。但一种用于记录在线活动和交易的技术是区块链。区块链以在
    `Bitcoin` 和其他加密货币中的应用而闻名，其核心是使用加密算法记录数据的技术，确保记录的操作无法被否认。这种不可否认性保证了由 `Person A`
    执行的操作确实是由 `Person A` 执行的，未来无法否认。区块链技术还消除了对单一控制方（如私人公司或中央银行）审查和捕捉每一次在线记录的需求。这种过程（称为去中心化）允许更高效的记录，并由于区块链技术基于加密，提供了更高的完整性。


    在网络安全方面，这可能会改变终端用户与互联网交互的方式，因为第三方托管费用可能会消失，所有交易都将在供应商和消费者之间直接进行。由于交易可以被公开验证和证明，这也可以使交易更加高效和安全。区块链技术的一些常见用例如下：


    *   **银行与金融**：加密货币作为统一货币，可以在全球通用，无需第三方仲裁。

    *   **数字身份**：身份凭据可以存储在区块链上，以保持不可篡改性，并在注册系统中使用这些凭据时使审计更容易。

    *   **政府**：政府法规要求跨领域进行年度合规审计。区块链可以作为不可更改的存储库用于执行监管合规并审计各种合规标准。

    *   **医疗**：基于区块链的数据控制和交换可以让医疗数据管理（包括药物和医疗设备跟踪）更加高效。

    *   **法律**：区块链引入了`smart contract`的概念，它是实际法律文件的数字表示。

    *   **出版**：区块链可以作为音乐或电子书等内容数字版权管理的有效替代方案。

    '
