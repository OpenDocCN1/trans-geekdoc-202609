    我已经讨论了身份验证的多种应用，包括系统/设备/网络访问、多因素认证（MFA）和生物识别。授权方面的顶级示例是针对文件、应用程序和若干网络设备的访问控制列表（`ACLs`）。文件和应用程序的
    `ACLs` 本质上与之前描述的权限相同。防火墙或入侵防御系统（`IPS`）等网络设备控制流入或流出网络的流量访问。它们在流量控制方法中都利用了某种形式的授权技术。防火墙
    `ACLs` 被称为规则。例如，大多数公司会防止内部计算机访问某些网站（例如色情网站）。通过一条或多条禁止网页浏览器导航到此类网站的规则，即可实现这种拦截。`IPS`
    通常被用于防止恶意流量进入网络。一个易于理解的例子是一封带有某种形式恶意软件附件的邮件。XYZ 设计了一台 `IPS` 来检测此类流量，然后拦截附件或防止邮件送达收件人的收件箱。


    ## 不可否认性


    网络安全的最后一个目标——`nonrepudiation`（不可否认性）——通常使用数字签名或类似技术来处理。它防止某人在实际发送了消息或授权了某些操作后，却声称自己没有这样做。它最常用于电子邮件，但其起源源于线下的邮政服务。许多国家的邮政服务提供挂号信服务。挂号信通过邮执为发送者提供寄信证明，并根据要求提供邮政服务已投递物品或尝试投递的电子验证。在这种情况下，`nonrepudiation`
    关注的是收件者而非发送者，但原理同样适用。另一个非技术示例是公证员——经政府授权为公众提供公正见证的人员，在执行与重要文件签署相关的各种官方防诈行为时履行职责。公证员的职责是核实重要文件签署者的真实身份，确保其在未受胁迫或恐吓的情况下签署，并知晓文档或交易的内容。


    在数字世界中，`nonrepudiation` 在邮件来源验证、金融交易和审计记录中起着作用。对于电子邮件，由于恶意软件通常通过附件传输，`nonrepudiation`
    为发送者提供了某种形式的证明，证明消息来源是合法且可信的。这是通过数字签名实现的。如果你还记得，我之前讨论过非对称密钥加密。在这种加密形式中，存在公钥和私钥。我将在第
    3 章中详细探讨这一点，但在这里很有重要的是，私钥用于生成数字签名，该签名可以被电子邮件接收者验证。在金融交易中，用户购买前需要提供身份信息，且每笔交易都与一个唯一的
    `ID` 相关。这在某种程度上是为了提供 `nonrepudiation`，保护供应商免受用户对已收到的产品提出虚假退款请求。最后，金融网站会维护每个访问页面的详细记录，包括互联网协议（`IP`）地址等信息。数字取证可以使用这些信息来证明用户行为的真实性。10


    ## 网络原理的实践


    我通过观察一个现实世界的事件来结束本章，该事件包含了许多错误的网络原理。这次攻击的影响之大，甚至有它自己的网站（[www.heartbleed.com](http://www.heartbleed.com)）。


    ```

    Heartbleed 漏洞是 OpenSSL 加密库中的一个严重漏洞，该库是广泛使用的 TLS 协议实现。

    ```

