    加密有两种形式：对称加密和非对称加密。对称加密使用相同的密钥对数据进行加密和解密。非对称加密使用一个公开的密钥进行加密（公钥），以及一个私留的密钥进行解密（私钥）。对称密钥加密比非对称密钥加密快得多，因此它是加密或解密数据的首选。非对称密钥可用于加密对称密钥，以防止其被盗。对称加密与非对称加密的结合对于保护各种在线交易非常有效。事实上，它形成了区块链以及其他催生加密货币技术的基础。


    在保护客户端和 Web 服务器之间传输的敏感数据的同时，保持互联网连接安全的标准技术是安全套接层（SSL）。购买域名的人通常会有购买 SSL 证书的选项，它作用像一个数字钱包，包含了标识所有者的信息以及关于该所有者的元数据。SSL
    证书可以防止犯罪分子读取和修改网站之间传输的任何信息，包括可能的个人详情。当网站受 SSL 证书保护时，网站地址（ `URL`）将显示为安全超文本传输协议（HTTPS），而不仅仅是
    HTTP。SSL 的最新更新是传输层安全协议（TLS），它允许用户查看证书详情，包括颁发机构和网站所有者的公司名称。


    在网络世界中，人们通过使用加密保持信息的机密性。


    SSL 和 TLS 都能让我们通过建立安全通信通道，以安全的方式与其他用户或计算机系统通信。它们通常互换使用，你在写作中经常看到它们被标记为 `SSL/TLS`。`SSL/TLS`
    同时使用非对称和对称密钥加密来实现安全数据传输的目标。从高层来说，`SSL/TLS` 在后台使用的步骤如图 2 所示。简而言之，客户端（一台联网计算机）和服务器（客户端需要访问的资源主机）相互联系，出示
    `SSL/TLS` 证书，客户端对其进行验证，它们交换支持的密码套列表并约定其中一种，然后进行密钥交换。


    ![](img/11656_002_fig_000.jpg)


    ## 区块链安全


    加密也是加密货币的基础流程，加密货币已成为一个热门话题。比特币等加密货币的基础被称为区块链——这是一个分布式数据库，包含记录（或交易），这些记录同时存储在多台计算机上。加密货币基于几种密码学基础，包括加密。让区块链变得有趣的独特特性是它能够在不需要中心化机构的情况下验证各种类型的交易。区块链数据的加密对于保护用户的隐私和机密性是必要的。每当进行交易时，其记录都会存储在区块链上。与上述的
    `SSL/TLS` 握手协议类似，区块链隐私的一个关键方面是使用私钥和公钥。区块链系统使用非对称/公钥加密来确保用户之间交易的安全。随着受欢迎程度的提高，区块链系统是今天加密的主要用途之一。鉴于巨大的兴趣，越来越多的基于区块链的初创公司脱颖而出，对它们的投资从
    2012 年的约 100 万美元增长到 2017 年的 10 亿美元。2018 年，名为 `EOSIO` 的区块链协议为其 `EOS` 加密货币的“首次代币发行”产生了
    42 亿美元的巨额投资。


    ## 完整性


    完整性的正式定义是“诚实和具有良好道德标准的品质；道德正直”。在网络世界中，完整性指的是数据和系统的信任和可靠性。计算机用户希望知道他们创建、访问或接收的数据是可验证的可靠且准确的。完整性通过一种名为
    `hashing`（哈希）的密码学原理实现。`hashing` 与加密不同，它是一种单向操作，会创建一个数据的表示，该表示只能通过相同的交易进行验证。当我们讨论密码学的主要目的和用例时，它们包含了数据机密性和完整性。


    完整性在应用到网络安全背景时有两种形式：系统完整性和数据完整性。这个顺序实际上很重要，因为数据存储在某种计算机系统上，所以你必须首先能够信任该系统。因此，系统完整性简单来说就是能够信任你正在交互的系统。这可以通过两种主要方式实现：验证授权访问系统的用户身份，以及验证系统自上次登录以来未被破坏。第一个原理要求使用某种形式的生物识别数据。大多数现代设备现在都提供某种形式的生物识别认证，例如虹膜扫描、指纹识别器或语音识别，并与基于文本的登录凭据（如用户名和密码）结合使用。第二个原理通常由名为
    `secure boot`（安全启动）的操作系统功能完成。想象一下，在你进入汽车或房屋之前，有一个扫描来确定它是否被入过。这类似于 `secure boot`
    对计算机系统所的作用。如果扫描结果出现任何错误（即自上次登录以来发生了变化），系统将关闭并拒绝启动，直到进行分析是否被破坏。这两个原理（生物识别认证和 `secure
    boot`）的结合提供了系统完整性。


    数据完整性是系统完整性的后续。为什么呢？在上述关于房屋的类比中，一旦你验证了（总的来说）事情没有被篡改，你就想逐个验证内容，特别是最关键的内容。在计算中，数据以许多不同的格式、大小和访问级别出现（例如机密信息）。数据和完整性验证都需要某种形式的
    `hashing`。如前，`hashing` 是一种加密转换，会产生一个被哈希项的不可逆表示。换句话说，数据通过加密密钥和函数进行转换，生成一个代表该文件、应用程序、密码或系统内容的字符字符串。相同的操作可以在访问文件、应用程序、密码或系统内容之前执行。这验证了项目的完整性自其最后已知的“信任”状态以来没有发生变化。回到房屋的类比，假设你发现保险箱被动过手；无论系统完整性的“房屋扫描”结果如何，你可能仍然面临完整性问题。

