    VPN 连接时补充对称算法。当你访问一个网站并输入 `“https,”` 以及网站名称时，会进行密钥交换以建立安全连接。此外，当你发送电子邮件时，某些电子邮件客户端提供对消息进行数字签名的选项（即验证其真实性）。这也是通过非对称算法完成的。最后，非对称算法最新兴的应用用例可能是用于
    `Bitcoin` 或 `Ethereum` 等加密货币。加密货币地址背后的“魔法”是非对称密钥加密。


    如果没有底层算法，加密学将无从谈起，这些算法实现了关键任务。


    我将描述的最后一类加密算法用于保护完整性，包含哈希算法（hashes）和 `MACs`。目前最流行（但易受攻击）的哈希算法是 `MD5`。在它被破解之前，它是保护文件和其他数字数据完整性的首选算法。它通常产生
