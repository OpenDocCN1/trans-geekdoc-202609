- fmt: '

    There are two forms of encryption: symmetric and asymmetric. Symmetric encryption
    uses the same key to both encrypt and decrypt data. Asymmetric encryption uses
    a key that is publicly available to encrypt (public key) and a key that is kept
    private to decrypt (private key). Symmetric key encryption is much faster than
    asymmetric key encryption, so it is the preferred choice for encrypting or decrypting
    data. The asymmetric key can be used to encrypt the symmetric key to protect it
    from being stolen. The combination of symmetric and asymmetric key encryption
    is effective for protecting a variety of online transactions. Indeed, it forms
    the basis for the blockchain and other technologies that have given rise to cryptocurrencies.


    The standard technology for keeping an internet connection secure while safeguarding
    sensitive data being sent between the client and web server is the Secure Sockets
    Layer (SSL). Someone who purchases a domain name is typically given the option
    of purchasing an SSL certificate, which works like a digital wallet containing
    information that identifies its owner and the metadata about that owner. An SSL
    certificate prevents criminals from reading and modifying any information being
    transferred between websites, including potential personal details. When a website
    is secured by an SSL certificate, the website address, or `URL`, will show up
    as a Hypertext Transfer Protocol Secure (HTTPS), and not just HTTP. A recent update
    to the SSL is Transport Layer Security (TLS), which allows users to view the details
    of the certificate, including the issuing authority and corporate name of the
    website owner.


    In the cyber world, people’s information is kept confidential through the use
    of encryption.


    Both SSL and TLS enable us to talk to other users or computer systems online in
    a secure manner – through the establishment of a secure communications channel.
    They are generally used interchangeably, and you will often see them denoted as
    `SSL/TLS` in writing. `SSL/TLS` uses both asymmetric and symmetric key encryption
    to accomplish the goal of secure data transmission. At a high level, the steps
    used behind the scenes for `SSL/TLS` are those depicted in figure 2. In summary,
    a client (a networked computer) and the server (the host of resources that the
    client needs to access) contact one another, the `SSL/TLS` certificate is presented,
    the client authenticates it, they exchange a list of supported cipher suites and
    agree on one, and then key exchange occurs.


    ![](images/11656_002_fig_000.jpg)


    ## Blockchain Security


    Encryption is also a fundamental process for cryptocurrencies, which have become
    a mainstream topic. The underpinning of cryptocurrencies like Bitcoin is called
    a blockchain—a distributed database containing records, or transactions, stored
    simultaneously on multiple computers. Cryptocurrencies are based on several cryptographic
    foundations—to include encryption. The unique characteristic that makes the blockchain
    interesting is its ability to verify various types of transactions without needing
    a centralized authority. The encryption of blockchain data is necessary to preserve
    a user’s privacy and confidentiality. Each time a transaction is made, a record
    of it is stored on the blockchain. Similar to the `SSL/TLS` handshake protocol
    described above, a key aspect of privacy in blockchains is the use of private
    and public keys. Blockchain systems use asymmetric/public key cryptography to
    secure transactions between users. With their growth in popularity, blockchain
    systems are one of the primary uses of cryptography today. Given the massive interest,
    an increasing number of blockchain-based start-up companies have sprung up, and
    investment in them has grown from roughly $1 million in 2012 to more than $1 billion
    in 2017. In 2018, the blockchain protocol known as `EOSIO` generated a massive
    $4.2 billion of investment in the “initial coin offering” for its `EOS` cryptocurrency.


    ## Integrity


    Integrity is formally defined as “the quality of being honest and having strong
    moral principles; moral uprightness.” In the cyber world, integrity refers to
    the trustworthiness and reliability of data and systems. A computer user wants
    to know that the data they create, access, or receive is verifiably reliable and
    accurate. Integrity is achieved by a principle of cryptography called `hashing`.
    `hashing`, unlike encryption, is a one-way operation that creates a representation
    of data that can only be verified through the same transaction. When we discuss
    the primary purposes and use cases of cryptography, they include both data confidentiality
    and integrity.


    Integrity comes in two flavors when applied in a cybersecurity context: system
    and data integrity. The order is actually important since data resides on a computer
    system of some sort, so you must be able to trust that system first and foremost.
    Thus, system integrity is simply being able to trust the system with which you
    are interacting. This can be accomplished in two primary ways: verifying the identity
    of the users authorized to access a system, and verifying that the system has
    not been compromised since the last log-in. The first principle requires the use
    of some form of biometric data. Most modern machines now have some form of biometric
    authentication available, such as an iris scan, fingerprint reader, or voice recognition
    that works in combination with text-based log-in credentials, like a username
    and password. The second principle is usually accomplished by an OS function called
    `secure boot`. Imagine that before you can enter your car or house, there is a
    scan to determine whether or not it has been broken into. This is akin to what
    a `secure boot` does for a computer system. If the scan results in any errors
    (i.e., something has changed since the last log-in), the system will shut down
    and refuse to boot until it is analyzed for compromise. The combination of these
    two principles—biometric authentication and `secure boot`—provides system integrity.


    Data integrity is the successor to system integrity. Why? In the analogy I used
    above regarding the house, once you have verified that (in general) things have
    not been tampered with, then you want to verify the contents one by one, especially
    the most critical ones. In computing, data comes in many different formats, sizes,
    and access levels (e.g., classified information). Both data and system integrity
    verification require some form of `hashing`. As mentioned above, `hashing` is
    a cryptographic transformation that produces an irreversible representation of
    the item that was hashed. In other words, data is transformed using a cryptographic
    key and function that results in a string of characters that represents that file,
    application, password, or system contents. This same operation can be performed
    before the file, application, password, or system contents are accessed. This
    verifies that the integrity of the item has not changed since its last known “trusted”
    state. Referring back to the house analogy, let’s say you notice that your safe
    has been tampered with; you may still have an integrity issue regardless of the
    results of the “house scan” for system integrity.

