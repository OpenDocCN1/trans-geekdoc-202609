    Another infamous virus arrives as a phishing email with an attachment (like a
    JPEG image file) with the subject line “ILOVEYOU”; when clicked on, the file in
    the ILOVEYOU virus sends the same email to everyone on the recipient’s Microsoft
    Outlook contacts list. And it even deletes certain files on the recipient’s hard
    drive. Thanks to Outlook’s popularity among major corporations, on May 4, 2000,
    the virus spread so quickly that email had to be shut down by a number of major
    enterprises, including Ford Motor Company. The virus infected an estimated forty-five
    million users that day.


    Here’s a technical analysis of how the ILOVEYOU virus works:


    *   **Search routine**: First, it executes a routine that locates each fixed and
    remote drive, and recursively goes through all their folders. In each folder,
    it looks for specific file types that it has been programmed to delete.

    *   **Copy routine**: This is the main routine, which copies the worm into a root
    folder in the OS. The copy routine directs the injection of the virus into specific
    file types (as mentioned above).

    *   **Infection mechanism**: This mechanism spreads the worm throughout all the
    victim’s addresses in their address lists, similar to the Melissa virus. Alternatively,
    the virus can spread via Internet Relay Chat, a messenger service that was a precursor
    to applications like WhatsApp. The infection mechanism also uses the same method
    to determine if the mass mail message was already sent out (e.g., a registry entry).

    *   **Trigger mechanism**: The user has to click on the file containing the virus
    in order for it to execute (e.g., a JPG or JPEG file).

    *   **Payload**: On fixed and remote drives, Visual Basic, ActiveX, Java, and
    picture files are replaced by copies of the worm, so when the user double clicks
    on the icon corresponding to the file, the worm is launched. Movie files are simply
    hidden, but a worm file with the same name is created, giving a similar effect
    to the replacement of the other file types.


    ## An Infamous Worm: Stuxnet


    Worms share some of the same structural elements as viruses, but are typically
    made up of the following parts: target locator, infection propagator, remote control
    and update interface, life cycle manager, payload, and self-tracking mechanism.
    The target locator is similar to the search routine for a virus, although where
    a virus is looking for a host application to attach to, a worm is typically looking
    for propagation mechanisms such as email addresses or other target systems (identified
    via scanning for neighboring systems via IP addresses). The infection propagator
    is the mechanism used to transfer the worm onto another target system and infect
    the next machine. Next the worm creator uses the remote control and updated interface
    to communicate with the worm and provide updates. For example, if the target systems
    were Windows machines with Microsoft Office 2007 and these systems were updated
    to Microsoft Office 2010, the worm could communicate this, and the creator could
    update the worm code to target the new application type. The life cycle manager
    will run versions of the worm for a certain period of time and then update it
    based on preset conditions. All previous steps lead up to the execution of the
    payload, which represents the code that does the damage and achieves the worm’s
    objectives. Optionally, worm authors might want to track the traversal path of
    the worm or keep track of victim machines. The self-tracking routine accomplishes
    this task. I will use this general structure to describe the Stuxnet worm in this
    section.


    The Stuxnet (created by US and Israeli intelligence groups) worm targets so-called
    supervisory control and data acquisition systems, which are used widely for industrial
    control systems such as power, water, and sewage plants as well as in telecommunications
    and oil and gas refining. Stuxnet contained code that could identify software
    used in the logic controllers designed by German manufacturer Siemens. Logic controllers
    automate critical industrial processes such as temperature, pressure, and the
    flow rate of liquids and gases. Stuxnet was reportedly used to hijack high-speed
    centrifuges at Iran’s uranium enrichment facilities, causing them to shake violently,
    which led to physical damage of the equipment.


    Here is an analysis of how this worm operates:


    *   **Target locator**: Once on a machine, Stuxnet looked for Microsoft Windows
    machines and then sought out Siemens Step7 software, which is Windows software
    used to program industrial control systems that operate equipment (e.g., centrifuges).

    *   **Infection propagator**: Stuxnet enters a system via a connected USB device
    and then executes the target locator routine (above). The worm would then propagate
    via printers connected to the internet exploiting a specific vulnerability.

    *   **Remote control and update interface**: The worm was controlled remotely
    by two servers in Denmark via two IP addresses that were registered to false names,
    making them hard to track. Stuxnet was designed to spread on isolated networks,
    however, and therefore had been designed to be autonomous, reducing the need to
    have robust and fine-grained “command and control.”

    *   **Life cycle manager**: Different variants of Stuxnet targeted five Iranian
    organizations, with the probable target widely suspected to be the uranium enrichment
    infrastructure in Iran. This implies that the code had a means to swap out versions
    as necessary.

    *   **Payload**: The worm forced the centrifuges to spin quickly for fifteen minutes
    and then return them to normal speed. Within five months of the attack, the excessive
    speed changes caused the machines to break, resulting in the loss of about a thousand
    centrifuges.

    *   **Self-tracking mechanism**: There is no documented evidence of Stuxnet having
    a self-tracking mechanism built in. This is because it was required to be stealthy
    and operate on unconnected infrastructures. Yet the code itself had to be aware
    of newly compromised systems, which came online based on the communication mechanism
    built in (i.e., infecting neighboring machines).


    # 7 Modern-Day Applications


    Would you be surprised to know that you use cybersecurity on a day-to-day basis?
    Given the ubiquitous presence of technology today, cybersecurity also permeates
    many aspects of our lives. Let’s examine some statistics around technology and
    internet use. Close to 60 percent of the world’s population uses the internet.
    According to a 2019 Pew Research report, 81 percent of people in the United States
    say they go online daily, including 28 percent who are almost always online. Only
    10 percent of adults say they do not use the internet at all. Among mobile internet
    users, 92 percent go online daily and 32 percent are almost always online. Roughly
    half of eighteen- to twenty-nine-year-olds say they are virtually always online,
    and 46 percent go online multiple times per day.


    Anytime a person uses some internet-connected technology, they are leveraging
    cybersecurity principles, whether intentionally or not. In this chapter, I will
    cover a number of common use cases such as authentication mechanisms, user identity,
    TLS, electronic commerce, banking, and blockchain technology. The goal of this
    chapter is to highlight how cybersecurity has proliferated our daily lives and
    societies.


    ## Username and Password

