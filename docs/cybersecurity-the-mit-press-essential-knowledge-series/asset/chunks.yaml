    操作系统中有四种主要的隔离类型：`physical`（物理）、`temporal`（时间）、`sandboxing`（沙箱）和`cryptographic`（加密）。物理隔离提供了最高的实用安全级别，但对于现代应用程序来说并不实际。时间隔离使用相同的硬件执行任务，但它们是一个接一个执行的。沙箱通过将代码保持在独立的容器中（例如被隔离的文件）来防止代码执行有害操作。对沙箱外部资源的访问受到严格限制。加密隔离涉及对内存中的区域进行加密；它可以防止没有密钥的其他处理器解密信息。


    内存保护防止一个进程影响另一个进程的机密性、完整性可用性。这是安全多用户系统（同时登录一个以上用户）和多任务系统（同时运行一个以上进程）的要求。它是通过进程隔离、硬件分段和
    `virtual memory`（虚拟内存）实现的。进程隔离是一种逻辑控制，试图防止一个进程干扰另一个进程。硬件分段通过将进程映射到特定的内存位置将进程隔离进一步了一了一步。这比单独的（逻辑）进程隔离提供了更高的安全性。内存保护确保了当同时使用两个或多个应用程序时，不会发生干扰。为了说明这一点，想象你正在使用
    `Microsoft Word` 创建文档，同时在制作一个辅助的 `PowerPoint` 演示文。如果没有内存保护，你可以在一个应用程序中编写内容，并看到这些文本或图像出现在另一个应用程序中。更糟糕，如果内存处理不当，一个应用程序可能会导致另一个关闭。这就是为什么内存保护有时被称为内存管理。


    访问控制有多种形式。主要的形式有强制性（mandatory）、裁量性（discretionary）、基于角色（role based）和基于规则（rule based）。强制性访问控制由系统管理员实施，用户无法更改。裁量性访问控制由用户决定。例如，由用户设置的文件访问权限被认为是裁量性的。


    用户可以任何时候更改、更新或修改这些权限。相比之下，文件权限的强制控制无法由用户更改。基于角色的访问控制侧重于按用户类型对访问进行分类（例如普通用户或管理员）。基于规则的访问控制简单定义了访问条件，如时间或逻辑访问限制。基于角色的访问控制的一个示例是特定的计算机或文件仅在特定时间内可以访问。


    ## 应用/软件安全


    既然我已经涵盖了人员、网络和系统（主机）安全，我们应该得到很好的保护，对吧？答案应该是肯定的，但在人员之后，应用程序是攻击者的主要目标，因为它们比操作系统更容易被利用。这有几个原因，但主要原因之一是，应用程序的设计要求比操作系统更频繁的更新。操作系统的组件非常标准——其中一些我在上一一节中讨论过。它们极少需要被替换或更新。然而，应用程序的功能比标准操作系统多得多。例如，`Microsoft
    Word` 拥有超过一百个功能，并通过 `macros`（宏）等插件包含其他功能。在计算中，`macro`（宏）被定义为单条指令，该指令会自动展开为一组指令以执行特定任务。`macro`
    的一个示例是每次当你打开 `Microsoft Office` 或 `PowerPoint` 时，都将字体设置为 `Arial` 或 `Times New
    Roman`。考虑一下这的影响。一个主要影响追溯到人员的攻击向量（或层）。一旦我们习惯了使用某个应用程序，我们使用它时就不会去考虑安全性了。你上一次在打开
    `Word` 文件之前考虑安全性是什么时候？即使当我用 `Word` 撰写这篇手稿时，我显然也没有考虑过。这是一个便利性与安全性困境的典型案例。


    有很多基于应用程序的安全工具，旨在防御基于应用程序的攻击，例如杀病毒软件或反恶意软件软件。这是应用程序安全工具主要依靠的：预先了解攻击的样貌。这被称为攻击的
    `signature`（签名）。


    由于这种方法是事后为的，为了防止基于应用程序的攻击，有很多种技术。通过这种攻击的 `signature`（签名）来查找攻击的特征。一旦这种签名是已知的，就可以设计一条
    `rule`（规则）来查找这些特征。但有一类攻击被称为 `zero-day attacks`（零日攻击），它们通常针对尚未被处理或发现的漏洞。


    研究中提出了许多技术来防止零日攻击的发生。在 `Google Scholar` 上搜索“zero-day attack prevention”会有几十万条结果，包括论文和专利想法。然而，我认为，更安全的软件设计应该是应用程序安全的重点。这是最主动的防御形式。例如，在软件的生命周期中，目标是以最短的时间、最低成本产生高质量的软件。主要步骤包括计划、设计、构建、测试和部署。发现了什么了吗？是的！安全。所以如果这个广泛接受和教学的软件开发框架在任何阶段中都没有安全，那么如何能产生安全软件的结果呢？


    正如所指示，常见的做法只在测试部分执行安全相关的活动。这种事后技术通常会导致问题被发现得太晚（或根本没有被发现）。更好的做法是在整个软件开发过程中整合活动，以尽早发现并减少漏洞，从而有效地构建安全性。


    安全软件开发的概念将 `penetration testing`（渗透测试）、`code review`（代码审查）和 `architecture analysis`（架构分析）等安全措施集成到过程中。让我们回到
    `macro` 的示例。由于它在表面上执行一个功能，但可以分解为其他功能，我们在软件开发期间如何为此计划呢？在计划和设计阶段，我们可以预先布置指令。为了简单起见，我们将它们命名为
    `one`、`two` 和 `three`，其中 `one` 打开文件，`two` 向文件写入某些文本，`three` 保存/关闭文件。在构建阶段（即实际编写应用程序代码），我们只编写这三条指令。在部署前的测试阶段，我们测试程序没有执行额外的指令（例如打开其他文件），一旦应用程序部署，我们就可以验证仅执行这三条指令。这使得我们的应用程序是可预测的。因此，如果它超出了预期的范围，就可以被拦截。尽管这是一个简单的案例，但它是应用程序安全中一个强大的概念。这些原则越与其他应用程序开发概念相结合进行教学，代码就会越安全。


    ## 数据安全


