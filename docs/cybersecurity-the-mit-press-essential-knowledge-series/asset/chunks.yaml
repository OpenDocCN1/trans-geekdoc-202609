    - **Supply chain management**: Blockchain can facilitate the accurate and transparent
    tracking of products and services from manufacturing all the way up to the point
    of consumption.


    ## Smart Devices


    Smart devices have changed the face of technology potentially more than any device
    in history. They provide their owners with a computer in their hands that they
    can access at any time, connecting more people than ever before. With this increase
    in connectivity comes the need to improve security around networking, user recognition,
    and protecting personal information. Smartphones have advanced to incorporate
    many of the core tenants of cybersecurity. Confidentiality is used to encrypt
    photos, texts, and other data on the device. Integrity is used to ensure apps
    are doing what they should do and have not changed without the device owner’s
    knowledge. Accessing the device itself incorporates both what you know and who
    you are to include pin and biometric log-in capabilities. Nevertheless, because
    of all the information that is stored on these devices, including health information,
    personal text messages, and pictures, there is a need to heighten their security.
    Hackers are interested in controlling and accessing information on smart devices.
    Phones, tablets, smart watches, and other devices have to incorporate form factor
    technology to be thin, lightweight, and efficient as well as secure, locked down,
    and controllable, all while being usable. Many times, these three concepts are
    difficult to integrate, but smart devices have been able to integrate them on
    a consumer-friendly device that is here to stay.


    ## IoT (Internet of Things)


    IoT is a fancy term for smart devices that can connect to the internet, including
    baby monitors, vehicles, medical devices, network routers, and consumer electronics.
    There may be as many as twenty billion IoT devices in use today. Unsurprisingly,
    such devices are attractive to hackers. For example, `Mirai` is malware that infects
    smart devices that run on `ARC` processors, turning them into a network of remotely
    controlled bots or zombies. `Mirai` scans the internet for IoT devices that run
    on this particular type of processor, which runs a stripped-down version of the
    `Linux` OS. If the device’s default username and password combination is not changed,
    `Mirai` is able to log into the device and infect it. This is just one of the
    instances of attacks that target IoT devices.


    With this in mind, there is a treasure trove of data that an adversary can harvest
    from an IoT device. Such devices are particularly susceptible to attacks against
    the six cyber tenets I presented in chapter 1. The security protections, however,
    have not necessarily caught up to the capabilities. In some cases, IoT devices
    (e.g., automatic lights, video doorbells, and baby cameras) add security as an
    orthogonal effect. By this I mean that both provide protection when you are away
    from your home (or the baby’s room) and give the appearance that you are “always
    home.”


    # 8. Cybersecurity for the Future


    In this final chapter, I will discuss a number of innovative cybersecurity research
    areas that are worth noting: outcome-based cyber defense, artificial intelligence
    / machine learning, and Computer immunology. Outcome-based cyber defense focuses
    on attack outcomes rather than the attacks themselves. Recall that there are three
    primary cyberattack outcomes: denial-of-service attacks, data theft attacks, and
    misinformation attacks (i.e., cyber deception). Denial-of-service attacks prevent
    legitimate users from accessing systems or data that belong to them. Data theft
    attacks remove information that pertains to authorized users. Misinformation attacks
    cause legitimate users to make decisions based on erroneous information (e.g.,
    phishing).


    In recent years, as data volumes have increased, artificial intelligence is being
    applied in various areas of cybersecurity in an attempt to emulate the function
    of a human being in decision making. Machine learning is a subset of artificial
    intelligence that has both supervised and unsupervised methods of analyzing information
    that is useful for cybersecurity. A supervised approach will take labeled data
    and learn from it for subsequent examples, while an unsupervised approach will
    learn from unlabeled data. Natural immune systems protect animals from dangerous
    foreign pathogens, including bacteria, viruses, parasites, and toxins. Their role
    in the body is analogous to that of computer security systems. Although there
    are many differences between living organisms and computer systems, the similarities
    are compelling and could point the way to improved computer security. Outcome-based
    cyber defense will use the detection system as a trigger only.


    ## Computer Immunology


    The analogy of computer immunology with human immunology contributes an important
    point of view about how to achieve computer security—one that can potentially
    lead to systems built with entirely different sets of assumptions, biases, and
    organizing principles than in the past. Immunologists have traditionally described
    the problem solved by the immune system as that of distinguishing “self” from
    dangerous “other” (or “nonself”), and eliminating the dangerous nonself. The issue
    of protecting computer systems from malicious intrusions can similarly be seen
    as the problem of distinguishing self from nonself, which might be an unauthorized
    user, foreign code in the form of a computer virus or worm, unanticipated code
    in the form of a Trojan horse, or corrupted data. What would it take to build
    a computer immune system with some or all of the properties of a natural immune
    system—especially one that is outcome focused? Advances in multicore computing
    systems, networking, mobile and smart devices, sophisticated software, and the
    internet have enabled the development of revolutionary capabilities that have
    served many fields across industry, the military, and academia. But these advances
    have also led to vulnerabilities resulting from the complexity of the various
    platforms and their respective applications. Current security techniques are mainly
    labor intensive (e.g., patch update), signature based, and not flexible enough
    to handle the complexity of modern-day attacks. This is partly because cybersecurity
    approaches are often based on attack prevention.

