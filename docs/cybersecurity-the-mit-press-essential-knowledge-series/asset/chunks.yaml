    ## Cyber Vulnerabilities


    Once threats have been enumerated and identified, cybersecurity experts use the
    concept of vulnerabilities to determine what can actually be exploited. A vulnerability
    is a cybersecurity term that refers to a flaw in a system that can leave it open
    to attack. There are many types of vulnerabilities that can impact a network or
    information system, such as software bugs, weak passwords, web application security
    flaws, or buffer overflows. It is important to think of vulnerabilities in a broader
    sense too, similar to cyber threats. Let’s reexamine table 2 with these vulnerabilities
    in mind. In table 4, I enumerate the type(s) of vulnerabilities that could be
