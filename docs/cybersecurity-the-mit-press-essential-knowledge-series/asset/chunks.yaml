    ## 网络风险公式


    网络风险概念通过公式将威胁和漏洞联系起来，将所有元素整合在一起。风险可以被描述为漏洞被威胁行为者利用的概率。它还考虑了这种利用对关键资产的影响，并通常由简单的公式表示：`risk
    = threat × vulnerability × impact`。影响随后是对所涉及资产的影响水平的定性评估。例如，如果我们正在评估的 Web 应用程序是像
    Amazon 这样的电子商务业务，攻击者能够让网站宕机几小时，那么该特定漏洞的影响水平就是高的。为什么？因为 Amazon 主要是一个电子商务业务，每小时赚取大量资金。假设
    Amazon 每小时赚 1500 万美元。如果某个漏洞被利用导致两小时停机，这将导致 Amazon 损失约 3000 万美元。这被称为高影响漏洞。综上所述，我们根据这些因素得出风险评分或等级。表
    5 提供了该虚构 Web 应用示例的某些潜在评分概述。需要注意的是，风险评分可能会根据领域专家的专业水平或对某些类型威胁和漏洞的偏见而具有主观性。因此，请记住，大多数风险评级充其量是定性的——除非使用了数值评分标准（例如，`高
    = 7–10`）。


    我们刚刚经历的识别威胁和漏洞并计算某些初步风险评级的过程被称为网络风险（或安全/威胁）评估。在高级层次，网络风险评估识别了网络攻击可能影响的各种信息资产（如硬件、系统、笔记本电脑、客户数据和知识产权），然后识别可能影响这些资产的各种风险。所示，这是一种观察攻击者如何多种方式利用目标的全面方法。网络风险评估可以为用户提供购买决策，或帮助公司优先考虑网络防御资源的支出。最后，让我们考虑这种利用发生的过程。这被称为网络杀伤链模型。


