    用户名和密码的范式在物理世界中追溯到数千年前。必须提供秘密代码才能进入后室或酒馆已经存在了数千年，并且在无数现代电影和故事中都有刻画。应用用户名和密码认证的背后的逻辑是：终端用户应该是唯一知道自己密码的人，这就足够保持他们的密码机密性和账户的安全了。但当黑客和攻击者能够在不询问用户的情况下发现终端用户的密码时——通过使用暴力攻击和诸如密码破解器
    `John the Ripper` 类的工具，仅需字典词汇和简单组合——用户名和密码的范式必须发生变化。3 使用随机盐值（salt）掩码存储密码已成为常态，以确保存储在磁盘上的密码受到保护。强制终端用户每三十、六十和九十天更改一次密码使得攻击终端用户变得更加困难，因为他们的攻击目标不断变化。对密码额外的长度和字符要求也使暴力攻击变得更加困难。


    然而，尽管有了所有这些安全措施、规则和策略来提高用户名和密码组合的安全性，但如果像第 2 章讨论的那样未使用 MFA（多因素身份验证），用户名和密码仍然受到上述网络攻击的影响。MFA
    通过增加完成认证所需的因素（或多个因素），作为基于密码认证的补充。回想我在第 2 章中介绍过的，一个完全安全的认证系统将包含以下内容：


    *   你知道的（用户名和密码）

    *   你拥有的（MFA 令牌）

    *   你特征的（生物识别，将在下一节中讨论）


    一种典型的 MFA 方法会向你的手机发送短信，其中包含一组你在成功输入用户名和密码组合后需要输入的数字组合。这不仅增加了另一个认证步骤，还要求攻击者能够物理接触到你注册的移动设备。这种方法似乎是万无一失且完全安全的，但如果你忘记了把旧手机借给了别人，或者手机被盗了该怎么办？更糟糕的是，如果你升级到了最新的
    `Android` 或 `Apple` 设备，并在退还前忘记进行安全擦除怎么办？当你下次尝试对该特定应用程序进行认证时，你的口令码将发送到该设备。这将暴露你正在认证的网站，拒绝你访问该网站，或者（在手机被盗的情况下）为攻击者进入该应用程序提供潜在的入口。


    ## 生物识别


    生物识别在访问账户时提供了额外的安全层，并包含了所有被认为每个人独有的指标。生物识别研究正在指纹识别、耳部结构和视网膜扫描仪等领域进行。4 这是增强安全性的方法之一，通过强制终端用户同时包含关于“你知道的”（即你的用户名和密码组合）和“你特征的”（即你的指纹、心电图读数或人眼部扫描）。5
    生物识别是完全认证系统中缺失的环节。随着图像扫描被用于各种操作系统（`iOS` 和 `Microsoft`）来解锁设备，它已变得越来越常见；指纹扫描技术已无处不在，并包含大多数现代笔记本电脑和智能手机。随着图像识别技术的不断提高，面部和其他物理特征可以用于验证人的身份。

    '
