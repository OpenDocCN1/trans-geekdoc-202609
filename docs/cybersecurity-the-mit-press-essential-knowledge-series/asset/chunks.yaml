    在设计网络安全系统、工具（应用程序）或方法论时，网络威胁（或可能的攻击）是网络安全专业人员首先关注的。安全专家需要尽可能发挥想象力，以构思各种可能的攻击。通过预测攻击，网络安全专业人员可以防范这些攻击。多年来，已经发现了许多类型的网络威胁。通常，网络安全领域之外的人会混淆威胁与攻击类型。例如，如果你在
    Google 上搜索网络威胁，会出现诸如 `ransomware`（勒索软件）之类的攻击。`ransomware` 是一种加密（锁定）你的整个硬盘、关键文件甚至网络资源（Web
    服务器）的攻击，并强制你支付罚金以解密（解锁）该特定资源。这**不是**威胁。这是攻击。威胁是指你的硬盘、关键文件或网络资源可能被破坏的**可用性**。这种威胁可能在事件发生后，通过诸如
    `ransomware` 或其他类型的拒绝服务攻击才实现。理解攻击与威胁之间的这种区别至关重要，并将帮助你更好地识别漏洞和风险。


    为了本书的目的，我将网络威胁定义为可能影响我之前介绍的（表 2 总结的）一个或多个网络安全原则的事件。


    现在我们已经对什么是网络威胁有了定义和理解，让我们考虑这些威胁的常见来源。网络威胁来源最简洁的列表之一来自 2017 年 SecureWorks 的文章。1
    它显示了以下来源（或行为者）：国家或国家政府、恐怖分子、工业间谍、组织犯罪集团、脚本小子（script kiddies）、黑客主义者黑客、商业竞争对手以及不满的内部人员。如你所示，存在一系列威胁来源和相关的动机。我不再对这些来源进行进一步分解，因为它们并不是该领域的基础。尽管如此，考虑到某些上述犯罪群体（例如国家政府）背后投入的大量资源，意识到网络威胁可能有多严重是非常重要的。


    ## 表 2 网络威胁


    | 网络原则 | || 定义 | 网络威胁 |

    | --- | --- | --- |

    | 机密性 | 保持信息保密 | 信息将无法保密 |

    | 完整性 | 保持信息正确和可靠 | 信息不可信 |

    | 可用性 | 确保在正确的时间为正确的人提供可用信息 | 在需要时信息将不可用 |

    | 身份认证 | 验证身份 | 身份无法验证 |

    | 授权 | 验证对资源的访问 | 无法验证对资源的访问 |

    | 非否认性 | 验证信息的来源 | 接收信息的来源无法验证 |


    在本章的剩余部分中，我将结合常用攻击目标的背景：Web 应用程序，探索威胁、漏洞和风险。开放 Web 应用安全项目（OWASP）是一个致力于安全的非营利组织。最新的十大安全风险列在表中。


    ## 网络安全漏洞


    一旦确定了威胁，漏洞（vulnerability）是一个网络安全术语，指的是系统中可能导致其易受攻击的缺陷。有许多类型的漏洞，例如软件错误、弱密码。从更广泛的意义上考虑漏洞是非常重要的。为了帮助你做到这一点，你可以参考常见漏洞和暴露（`CVE`）列表。`CVE`
    代表所有在公开层面上已知的网络安全漏洞，它是创建网络安全产品和服务的的重要资产。这是一个列表——每个条目包含一个识别号、描述和至少一个公开引用——用于记录公开的网络安全漏洞。`CVE`
    条目用于在世界范围内创建许多网络安全产品和服务，包括美国国家漏洞数据库。`CVE Details` 网站获取 `CVE` 站点的信息，并根据它们能够实现的攻击类型对漏洞进行分类。假设你正在运行一个由红帽（Red
    Hat）制造的 Linux 服务器。查看 `CVE Details` 网站关于红帽 Linux 服务器的数据，我们发现 2019 年的大部分漏洞与代码执行有关。这意味着该类别中的每个漏洞代表一个可能被利用的威胁。对于运行在服务器上的非应用程序代码来说，这些漏洞并不担心。然而，攻击者可以利用这些公开的漏洞，根据其目标在我之前列出的六个威胁/漏洞领域造成重大损害。


    ## 表 3 OWASP 十


    | 风险 | 示例攻击 |

    | --- | --- |

    | 注入 | 攻击者向 Web 应用程序发送导致未经授权数据的请求。 |

    | 认证失效 | 攻击者可以访问 Web 应用程序。 |

    | 敏感数据泄露 | 信息被对手看到。 |

    | XML 外部实体 | 允许攻击者直接向应用程序上传 XML。 |

    | 访问控制失效 | 攻击者可以在没有适当认证的情况下访问功能。 |

    | 安全配置错误 | 攻击者将能够利用未设置正确的 Web 应用程序功能。 |

    | 跨站脚本 | 攻击者在 Web 应用程序中插入恶意应用程序，并在另一个用户的浏览器中执行。 |

    | 不安全的反序列化 | 对象序列化是保存对象状态的过程，以便从源发送到目的地（或保存并恢复）同时保持该状态。如果 Web 应用程序上的对象反序列化处理不安全，就会导致泄露。
    |

    | 使用已知漏洞的未知组件 | Web 应用程序所有者使用了脆弱的组件。 |

    | 日志和监控不足 | 由于 Web 应用程序所有者未收集与应用程序交互的信息，攻击未被发现。 |


    ## 表 4 网络漏洞


    | 网络原则 | 网络威胁 | 网络漏洞示例 |

    | --- | --- | --- |


