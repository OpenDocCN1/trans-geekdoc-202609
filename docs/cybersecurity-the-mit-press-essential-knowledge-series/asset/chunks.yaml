- fmt: '

    In most cyberattacks, the most valuable asset to an attacker is data—for instance,
    a password or some other form of personal identifier like a social security number.
    Data typically resides in multiple states: at rest (not in use), in transit (being
    sent from one location to another), and in process (being used). For the purposes
    of confidentiality, integrity, and availability (primarily), data has to be protected
    in each of these states, and the protection mechanisms vary by state. Data-at-rest
    protection is the simplest of the three because it is accomplished by either encryption,
    access control, or a mix of both. I have discussed both mechanisms already.


    If, for example, data is created and encrypted, and the encryption key is password
    protected, there would be fewer data breaches. One of the main challenges with
    protecting data at rest is key management. Asymmetric key encryption can help
    with this, yet it is still a challenge to consider when it comes to data-at-rest
    protection. Even so, the real challenges come into play because data has to be
    used. Data-in-transit protection adds a level of complexity to the data security
    issue, but is mainly handled via asymmetric key encryption. In short, if you want
    to send data from one person (or place) to another, you would encrypt the data
    with the recipient’s public key, and then they can decrypt it on the other end
    with their private key. I will explore this further in chapter 7 when I introduce
    `VPNs`.


    Last but not least, there are some cases where we need to protect data while it
    is in use. For that to work with encrypted data, we need a scheme that allows
    computations to be performed on the data that don’t decrypt it. A homomorphic
    encryption scheme allows for true end-to-end encryption, meaning the data can
    remain encrypted at rest, in use, and in transit. A number of practical applications
    for homomorphic encryption exist. I challenge you to think of other use cases,
    but here are two to consider.


    - **Encrypted search**: There are times when it would be beneficial to hide your
    search query from the all-knowing search engines developed by Google, Microsoft
    (Bing), Yahoo, and others. Say you are trying to investigate some research topics
    or conduct a market survey to examine a potential business idea you are trying
    to pursue. It would be helpful if this was kept private until the research results
    were published or after the business launch date.

    - **Electronic voting**: Also known as e-voting, voting in this manner uses electronic
    means to either aid or administer the casting and counting votes. By their very
    nature, votes must be kept private. The option to vote electronically is a great
    convenience, however, there are many opportunities to manipulate votes that are
    cast this way. Homomorphic encryption can provide a means to facilitate e-voting
    in a secure manner. All aspects—voting, tallying, and the results—could be kept
    private.


    ## Cloud and Mobile Security


    I end this chapter with a short look at the security behind cloud and mobile platforms.
    They each have their own unique challenges for various reasons. First, cloud security
    is shared between the provider and cloud customer based on the service model selected.
    Figure 5 depicts the primary service models in the cloud: infrastructure, platform,
    and application. These service models indicate the security responsibilities of
    the customer and cloud provider. In an `infrastructure-as-a-service` model, the
    customer is responsible for the security of the data, application, runtime, middleware,
    and OS, while the cloud provider is responsible for the security of the virtual
    machines, servers, storage, and networking components. As shown in figure 5, the
    customer’s security responsibility decreases based on the service model, while
    the cloud provider’s security responsibility increases. This is due to the fact
    that the customer has less control in both `platform-as-a-service` and `software-as-a-service`
    models.


    Regarding mobile devices, the most common ones on the market are based on `Android`,
    `Linux`, or `iOS`. The architecture of an `Android` device consists of the application
    space, application framework, various libraries, runtime environment, and a `Linux`
    kernel. An `iOS` device is slightly simpler, and consists of application space,
    core services, security services, and the core OS. At a high level, attackers
    will target the components of these architectures, focusing on gaining access
    to data storage, binaries (executables or applications), and the platform itself.
    Thus mobile device/application security measures should concentrate on securing
    these components. Mobile app security requirements aren’t much different from
    a traditional system’s. Mobile app security is not integral to the software development
    process, app developers are not familiar with the underlying system infrastructure,
    and users prefer convenience over security—which all adds up to a number of threats
    that can be exploited by an adversary.


    ![](images/11656_005_fig_000.jpg)


    # Who Attacked Me?


    Growing up, we used to play a game where you would tap someone on one side of
    their body and duck or hide before they saw who it was. Through your own laughter,
    you could often hear them asking, “Who hit me?” and see them looking around, confused.


    Determining “who did it” is called attribution, and it’s an important challenge
    in the field of cybersecurity. Attribution in cybersecurity is the process of
    a digital forensics investigation to determine the who, why, what, where, and
    how of a cyberattack. A single attack can comprise many variables, including multiple
    steps (e.g., social engineering and then data theft), polymorphic code (i.e.,
    code that changes), various attack methods (e.g., social engineering, denial-of-service
    attacks, or deception-based methods), or multiple participants (i.e., collaborative
    attacks). So like the childhood game I described, it could be difficult to determine
    who attacked you.


    To simplify the challenge, cybersecurity is segmented into three main categories:
    `threats`, `vulnerabilities`, and `risks`. A `threat` is a potential digital event
    that could cause damage to an information system or network. For example, for
    an e-commerce website, a potential `threat` could be that the website could be
    taken down for a period of time, resulting in a loss of revenue since products
    cannot be sold. A `vulnerability` is a potential threat due to some form of weakness
    or error in a system. Computer programming errors, for instance, typically result
    in some form of a `vulnerability`. Using the same example of the e-commerce website,
    let’s assume that there is a programming error that allows someone to purchase
    a particular item for less than the advertised price. This would be considered
    a `vulnerability`. The `threat` in this case would be that someone could purchase
    a product for less than the advertised cost because of the error.


    Lastly, a `risk` takes into account `threats`, `vulnerabilities`, and consequences.
    It is a measure of the likelihood of a cyberattack given certain conditions. This
    likelihood is a rough measure that describes the chances that a given `vulnerability`
    will be discovered and used by an attacker (or a “threat actor” in cybersecurity
    parlance). Using our e-commerce website illustration, cybersecurity professionals
    would not only consider the `threat` of the erroneous product purchase but also
    the likelihood that a programmer would actually make that error. In that case,
    the `risk` would be low since coding for e-commerce transactions is common, and
    it’s unlikely that a programmer would make that error.

