    计算机病毒是一种通过将自己插入其他程序来自我复制的代码。被病毒插入的程序被称为被感染程序，并称为病毒的宿主。一个重要的注意事项是，病毒为了运行需要其宿主；换之，病毒需要一个现有的宿主程序才能造成危害。例如，为了进入计算机系统，病毒可能会附着在某些软件实用程序（例如，文字处理应用程序）。启动该文字处理程序可能会激活病毒，病毒可能会可能会复制自身并禁用计算机系统上启用的的恶意软件检测器。特洛木马，或
    `Trojan`，是一种通常被伪装成合法应用程序的恶意软件。它的目标是通过从“正门”进入来获取系统访问权限。计算机用户通常会被欺骗去加载并执行 `Trojans`。一旦在系统上激活，`Trojan`
    就可以让攻击者监视你、窃取数据并为你的系统打开后门。


    ![](img/11656_006_fig_000.jpg)


    病毒需要现有的宿主程序才能造成危害。


    逻辑炸弹（或称垃圾代码）是程序化在特定条件下破坏网络的恶意代码。当逻辑炸弹被特定事件（如特定日期或时间、删除特定文件或启动被感染的应用程序）触发时，它会发生比喻性的爆炸。


    相比之下，蠕虫不需要宿主即可造成破坏。计算机虫通过执行独立于任何其他程序的自身代码自我复制。病毒与蠕虫之间的另一个区别是它们的传播模型。通常，病毒尝试通过单个计算机系统上的程序/文件传播。然而，蠕虫通过网络连接传播，目标是感染尽可能多连接到网络的计算机系统；回想莫里斯蠕虫的例子。蠕虫通常隐藏在自动化的或对用户不可见的
    `OS` 中。让它们暴露的通常是它们不受控的复制耗尽了系统资源，导致其他任务变慢或停止。


    `zombie`（也称为 `bot`）是指被远程攻击者接管的计算机，攻击者随后将其配置为向互联网上的其他计算机转发垃圾邮件和病毒——无论是出于兴趣还是为了财务利益。攻击者通常利用多台计算机来创建一个
    `botnet`，即僵尸网络。随着家庭个人电脑通过高速连接到网络和远程服务器的现象日益普遍，它们更容易受到此类攻击。


    我刚刚回顾的恶意软件类型构成了所有其他类型恶意软件的基础。今天，大多数恶意软件都是传统恶意程序的组合，经常包含 `Trojans` 和 `worms` 的部分，偶尔包含病毒。通常恶意软件程序作为
    `Trojans` 进入系统，但一旦执行，它们就会像蠕虫一样攻击其他网络系统。许多许多流行的恶意软件类型，包括间谍软件（监视用户活动）、根内核（隐藏恶意程序）、后门（确保远程访问计算机系统）和广告软件（产生未经请求的广告）。


    尽管现代世界面临犯罪分子或国家黑客的威胁，可能威胁每个人的生活方式，但恶意软件早期并没有恶意。那时候的意图是看看计算机到底能做到什么，而不是伤害、窃取或操纵。计算机远见大师约翰·冯·诺依曼是第一个病毒（即自我复制的代码字符串）想法的人。11949
    年，他假设了“自我复制自动化”的可能性，它能够将其程序传递给自身的新版本。这项早期研究导致了 `Creeper` 病毒和莫里斯蠕虫。在接下来的两个部分中，我将病毒和蠕虫解构成它们的逻辑组件，并展示几个臭臭有名的例子，以便让你更好地理解它们是如何工作的。


    ## 两个臭臭有名的病毒：Melissa 和 ILOVEYOU


    病毒主要由五个不同的组件组成：搜索程序、复制程序、感染机制、触发机制和负载。一旦病毒进入计算机系统，搜索程序就会寻找一个它可以附接的宿主应用程序。识别应用程序后，就会执行复制程序将病毒代码合并到目标应用程序中。感染机制是病毒在整个系统（如果是蠕虫，则是网络）中扩散和或传播的方式。触发机制是激活病毒的代码。这可以是独立的触发机制（例如，在特定日期/时间执行的时间炸弹）或用户触发的事件（例如，双击）。之前所有的步骤都指向负载的执行，负载代表了造成破坏并实现病毒目标的代码。我将使用这种结构来描述本节中的病毒。


    Melissa 是一种快速传播的病毒，以邮件附件的形式分发，打开后，它会禁用 `Word 97` 或 `Word 2000` 中的若干安全措施，如果用户拥有
    Microsoft Outlook 电子邮件程序，它会导致病毒被发送给用户每个地址簿中的前五十个人。虽然它没有破坏文件或其他资源，但 Melissa 具有禁用企业和其他邮件服务器的潜力，因为邮件分发的涟漪效应会变成巨大的波浪。1999
    年 3 月 26 日星期五，Melissa 导致微软关闭了入站邮件。英特尔和其他公司也报告受到影响。


    由国防部资助的计算机应急响应小组发布了关于该病毒的警告并开发了修复程序。该小组负责响应针对国防部信息系统和网络的网络事件（或黑客尝试）。下面的技术分析改编自赛门克、F-Secure
    和加州大学戴维斯分校对这些病毒的分析。


    - **搜索程序**：当用户打开被感染的文档（`LIST.doc`）时，搜索程序开始搜索电子邮件应用程序（`Microsoft Outlook`）以连接并发送五十封邮件（以可能感染其他用户）。

    - **复制程序**：在发送自身后，病毒继续感染（复制自身到）其他 Word 文档，并会尝试重复这一过程，直到被清除为止。

    - **感染机制**：当用户打开或关闭被感染的文档时，病毒首先检查它是否已经发送过这种群邮件。它通过检查注册表项来实现。注册表或 `Windows registry`
    是一个存储安装在所有版本的 Microsoft Windows OS 上的软件和硬件的信息、设置、选项和其他值的数据库。如果找到了该项，则说明群发邮件（五十封邮件）已经完成，将不再再次发送。否则，将发送群邮件。

    - **触发机制**：如果用户下载并打开了被感染的文件（例如，`LIST.doc`），病毒将执行。病毒还将根据下面描述的条件独立执行。

    - **负载**：作为其主要负载，病毒将尝试使用 Microsoft Outlook 将被感染文档的副本通过电子邮件发送给多达五十个人。还有一个第二个负载，它每小时触发一次，时间是每小时对应日期的分钟数（例如，在每月的
    16 号，负载会在每小时的第 16 分触发）。如果被感染的文档在相应的分钟被打开或关闭，此负载将在文档中插入以下句子：*“二十二分，加上三倍单词得分，再加上使用所有字母的五十分。游戏结束了，我走了。”*


