    \ used form of authentication in conjunction with some form of a username. To\
    \ maintain their integrity and confidentiality, passwords are not stored in their\
    \ native form. Once you create a password, it will be hashed, `salted`, and then\
    \ stored. Adding the salt to hashing provides another level of security for password\
    \ integrity. A `salt` is essentially a one-time random stream of characters that\
    \ is changed every time the password is updated. The application automatically\
    \ updates the `salt`, without requiring interaction by the user or system owner.\
    \ The best modern-day example of a `salt` is the completely automated public Turing\
    \ test to tell computers and humans apart (`captcha`). Each time you navigate\
    \ to a website and attempt to log in, a different `captcha` code is presented,\
    \ which serves as part of the authentication process. \n\nIn the event that an\
    \ application may have been tampered with, application `verification` can be initiated,\
    \ which is typically done when an application (like a `hash`) is created and downloaded\
    \ (e.g., the same `hash` is computed or verified). If the `hash` verification\
    \ process fails, the user should not trust the application. \n\nLastly, `tripwire`\
    \ is an application used primarily for file integrity. By now you can see the\
    \ pattern for integrity, and `tripwire` follows suit. Once installed, it will\
    \ create `hashes` of all the files you select and update these hashes whenever\
    \ an authorized user updates the files. On accessing the files that have been\
    \ integrity protected, `tripwire` will send an alert if a file has been modified\
    \ by an unauthorized user.\n\n## Availability\n\nIn the context of cybersecurity,\
