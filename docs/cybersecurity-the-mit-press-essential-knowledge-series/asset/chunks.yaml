  trans: '


    这些统计数据说明了为什么任何深度防御（DiD）都应该从人开始，而不是技术。防御基于人的攻击面临着双重挑战：：人们通常会选择便利性而非安全性，而且人类天生是信任的。新技术的带来了新的便利。便利带来了更多的用户。用户越多，漏洞就越多。漏洞越多，黑客攻击的机会越多。人们倾向于为便利付费，而不是为安全付费，特别是当安全协议的益处不透明时。因此，人们总是受到网络安全攻击的影响。技术创新的速度之快，让安全专业人员难以跟上。软件工程师
    Max Kanat-Alexander 表示：


    > 总的来说，当技术试图解决物质、能量、空间或时间的问题时，它是成功的。当它试图解决人类思想、交流、能力等心理方面的问题时，它会失败或产生危险的反作用。例如，互联网解决了一个巨大的空间性问题——它允许我们即时与世界上任何人进行通信。然而，它并没有让我们成为更优秀的沟通者。2


    互联网技术的相对易用性和普及性导致了某些用户变得天真。正如 Alexander 所指出的，Facebook（以及其他通信和社交媒体平台）让人们的交流变得更容易。但这并不等同于形成或增强真实的人际连接，后者取决于信任。在我的自己的工作中，我遇到并展示了将人口贩运招聘与社交媒体网络联系起来的统计数据。3
    原因是什么？人们通常是信任，即使是对他们几乎不认识的社交媒体“朋友”，而且他们过度依赖技术的便利。结果，我们面临着一个我称为“安全性与便利性平衡”的困境，我认为这是网络安全领域专业人士面临的一项关键挑战：我们如何决定多大的安全性才足够，而不至于让用户反感到不想使用一项用的技术？这是一场持久的斗争。然而，如果网络安全专业人员想要成功提供全球范围内真正使用的解决方案，这种斗争是至关重要的。根据经验，我们必须假设用户几乎总是选择便利性而非安全性。这就是为什么直到今天，如果你在许多公司办公场所里走走，你会发现至少有一个人的密码写在便利贴或纸条上。


    人们倾向于为便利付费，而不是为安全付费，特别是当安全协议的益处不透明时。


    在设计或提出安全解决方案时，需要问两个问题：它好用吗？它透明吗？即使作为一个在网络安全领域工作了近二十年的人，我并不总是对复杂的安全解决方案有耐心，更何况是一个更易信任的用户了。因此，最好的网络解决方案需要是透明的（清晰地显示解决方案的必要性），或者需要很少或没有用户交互（从而降低复杂性）。一个实现这两个目标的绝佳例子是
    `captcha`（验证码），它的设计是为了让自动化程序难以在线填写表单。`captcha` 通过一个需要人类动作的测试来实现，这种动作无法被程序自动化。Google
    的 `reCAPTCHA` 只需要用户在输入用户名和密码后点击复选框（见图 4）来验证他们是人类，而不是要求用户完成更复杂的任务，例如解决数学题、文字题或基于时间的身份验证，或提供生物识别数据。


    ![](img/11656_004_fig_000.jpg)


    ## 网络安全


    DiD 的下一层是网络安全。考虑网络最简单的方法是将其视为一个边界，比如围栏。你的家庭网络可能是你每天使用的网络最好的例子。我们大多数人在家里都有某种形式的互联网连接，用于各种目的：流式视频、音乐和电视，或者在手机套餐中保存数据。每当你连接到你的
    `Wi-Fi` 时，你就连接到了你的内部家庭网络。想象一下，如果你邻居的任何人都能连接到你的网络。如果是，他们不仅可以看到连接到你网络的其他设备，还可以看到你观看的内容。这让你感觉如何？对我来说，我希望我的互联网使用保持私密，我猜你也是。


    在物理世界中，我们个人网络中都有家人、朋友和熟人。当我们私下（而不是在社交网络上公开）与个人网络成员交流或共处时，我们希望这些互动保持私密。这正是网络安全旨在提供的。


    当人的防御失效时，攻击者必须渗透的下一层是网络层。网络安全可以定义为防止和检测对内部系统和资源访问的所有保护措施。为了理解 DiD 模型的各个层级，从开放系统互连模型（`OSI`）的角度考虑是有帮助的。`OSI`
    模型由国际标准化组织创建，它允许不同的通信系统使用标准协议进行通信，从而允许不同的计算机系统相互通信。在网络安全的背景下，`OSI` 模型也可以代表包括网络在内的防御层。


    有许多提供网络安全的设备。最顶级的是防火墙、入侵检测系统、`IPSs` 和安全信息事件管理系统。所有网络设备在概念上都基于这四种。`firewall` 是一种网络安全设备，根据定义的安全规则集监控并调节入出的网络流量。入侵检测系统是一种软件或硬件设备，它在网络流量中搜索可疑活动和已知威胁，并在检测时记录警报。`IPS`
    是防火墙和入侵检测系统的结合。一旦检测到入侵，就可以自动停止。这与防火墙在阻止或允许流量进入网络时的操作类似。最后，安全信息事件管理系统是一种汇总所有层级信息（网络、应用程序和计算机系统）的设备。对于渗透到每一层的网络攻击非常有帮助。


