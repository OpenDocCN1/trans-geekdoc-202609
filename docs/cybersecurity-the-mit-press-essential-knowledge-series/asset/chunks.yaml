    `Hypertext Transfer Protocol Secure (HTTPS)`: A secure connection to a website
    that uses the `Secure Sockets Layer` to maintain the confidentiality of data transferred
    between a browser and web server.


    `ILOVEYOU virus`: A worm that targeted Windows’ computers with a malicious file
    attached to an email title “ILOVEYOU”; also known as the love bug and love letter.


    `Integrity`: Ensuring that data remains untainted or uncorrupted.


    `Internet of Things (IoT)`: A term used to describe anything (a device or machine)
    that is connected to the internet.


    `Kerberos`: A network protocol that utilizes tickets to provide authentication
    and communication over a network.


    `Logic Bomb`: Code that is hidden in a system that does not act until certain
    conditions are met.


    `MAC`: A unique computer/device identification number.


    `Machine learning`: A science that utilizes algorithms to develop computers that
    can simulate intelligence without being programmed.


    `Malware`: Software that is designed to do harm to a computer system (e.g., a
    mobile device or personal computer).


    `Melissa virus`: A virus that infected Microsoft applications, causing multiple
    emails to be sent overloading systems.


    `Misinformation attack`: An attack that causes users to make decisions based on
    false information.


    `Morris worm`: A self-replicating computer program that was designed to see how
    large the internet was, but ended up causing more harm than good.


    `Multifactor authentication`: A form of authentication that requires two or more
    credentials to verify the identity of a person for access.


    `Network security`: A cybersecurity approach aimed at protecting the confidentiality,
    integrity, and availability of a network.


    `Nimda`: A worm that would attach itself to files sent via email (first released
    in September 2001).


    `Nonrepudiation`: Principle guaranteeing that information such as a message or
    transaction cannot be deemed invalid.


    `Open Systems Interconnection (OSI)`: A conceptual model that describes the way
    in which computer systems communicate through layers.


    `Open Web Application Security Project (OWASP)`: Consortium that publishes information
    about web application vulnerabilities and mitigation activities.


    `Outcome-based cyber defense`: A form of cyber defense that focuses on preventing
    the intended outcome (i.e., information theft) of a cyberattack rather than preventing
    the attack itself.


    `Password`: A secret word or phrase that must be used to gain admission to something.


    `People security`: A cybersecurity approach aimed at protecting the human layer
    of security (e.g., social engineering or phishing).


    `Phishing`: A targeted social engineering attack that attempts to get a user to
    click on a link that will download malware or input credentials on a fake website.


    `Public key infrastructure (PKI)`: Technology that provides certificates for people
    and devices to authenticate themselves online; the certificates can also be used
    to supply integrity, nonrepudiation, and confidentiality.


    `Ransomware`: A type of malicious software (malware) that takes over a computer
    or system in order for an attacker to demand money for access.


    `Risk`: The possibility of a system being exposed to a cyberattack.


    `Secure Sockets Layer (SSL)`: A layer 6 (Open Systems Interconnection model) protocol
    for securing a connection between a client and server.


    `Secure software development life cycle`: A method for integrating security into
    each phase of the original software development life cycle.


    `Social engineering`: The act of using a social connection (i.e., trust relationship)
    to get a user to perform an action leading to an attack.


    `Stuxnet`: A worm, identified in 2010, that is designed for supervisory control
    and data acquisition systems.


    `Threat`: An entity that can exploit a vulnerability.


    `Transport Layer Security (TLS)`: An updated version of the Secure Sockets Layer
    protocol that is more secure and efficient.


    `Trojan`: A type of malicious software (malware) that infects a system by hiding
    in legitimate software or applications.


    `Virtual private network (VPN)`: A service that provides a secure connection to
    a network via the internet.


    `Virtual token`: An exterior device that is used to provide access to a system
    other than the use of a password.


    `Virus`: A type of malicious software (malware) that utilizes a host computer
    or system to self-replicate.


    `Vulnerability`: A characteristic of a computer system that puts it at risk of
    being attacked.


    `Weaponization`: The act of creating an attack for a specific target.


    `Worm`: A form of a computer virus that can replicate itself and infect multiple
    computers in a network.


