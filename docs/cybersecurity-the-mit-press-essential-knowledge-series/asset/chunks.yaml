  trans: '


    在大多数网络攻击中，对攻击者最有价值的资产是数据——例如，密码或其他形式的个人标识符（如社会安全号码）。数据通常存在于多种状态：静态存储（未在使用）、传输中（从一个位置发送到另一个位置）以及处理中（正在使用）。为了机密性、完整性和可用性（主要目标），数据在每种状态下都必须受到保护，且保护机制会随状态而异。静态数据保护是三者中最简单的，因为可以通过加密、访问控制或两者的结合来实现。我已经讨论过这两种机制。


    例如，如果数据被创建并加密，且加密密钥受密码保护，那么数据泄露的情况就会减少。保护静态数据的主要挑战之一是密钥管理。非对称密钥加密可以帮助这个问题，但在考虑静态数据保护时，这仍然是一个挑战。尽管如此，由于数据必须被被使用，真正的挑战才会出现。传输中数据为数据安全问题增加了复杂性，但主要通过非对称密钥加密处理。简而言之，如果你想将数据从一个人（或一个地方）发送到另一个人，可以使用接收者的公钥对数据加密，然后他们可以在另一端使用他们的私钥进行解密。我将在第
    7 章介绍 `VPNs` 时进一步探讨这一点。


    最后但同样重要的是，在某些情况下，我们需要在数据在使用时对其保护。为了让加密数据生效，我们需要一种允许在数据上进行计算而不将其解密的方案。同态加密方案允许真正的端到端加密，这意味着数据在静态存储、使用中和传输中都可以保持加密状态。同态加密有许多实际应用。我挑战你思考其他用例，但这里有两个可以考虑的场景：


    -   **加密搜索**：有时，将你的搜索查询从 Google、微软 (Bing)、Yahoo 等无所不知的搜索引擎中隐藏起来是有益的。假设你正在调查某些研究课题，或正在进行市场调查以检查你正尝试的潜在业务想法。如果这些内容在研究结果发布或业务启动日期之前保持私，将非常有帮助。

    -   **电子投票**：也称为 e-voting，这种投票方式使用电子手段辅助或管理选票的投投和统计。根据其本质，选票必须保持保密。电子投票是一个极大的便利，但有很多机会操纵这种方式投出的选票。同态加密可以提供一种安全的方式促进电子投票。所有方面——投票、计和结果——都可以保持保密。


    ## 云与移动设备安全


    我将通过简要回顾云和移动平台的安全性来结束本章。由于各种原因，它们各自都有独特的挑战。首先，云安全在提供商和云客户之间根据所选的服务模型共享。图 5 展示了云中主要的服务模型：基础设施、平台和应用。这些服务模型指示了客户和云提供商的安全责任。在
    `infrastructure-as-a-service`（基础设施服务）模型中，客户负责数据、应用程序、运行时、中间件和操作系统的安全，而云提供商负责虚拟机、服务器、存储和网络组件的安全。如图
    5 所示，客户的安全责任随着服务模型的改变而减少，而云提供商的安全责任则随之增加。这是因为在 `platform-as-a-service`（平台服务）和
    `software-as-a-service`（软件即服务）模型中，客户的控制权都较少。


    关于移动设备，市场上最常见的基于 `Android`、`Linux` 或 `iOS`。`Android` 设备的架构由应用程序空间、应用程序框架、各种库、运行时环境和
    `Linux` 内核组成。`iOS` 设备稍微简单，由应用程序空间、核心服务、安全服务和核心操作系统组成。在高级层面上，攻击者将针对这些架构的组件，重点获取数据存储、二进制文件（可执行文件或应用程序）以及平台本身的访问。因此，移动设备/应用程序的安全措施应集中在保护这些组件上。移动应用程序的安全要求与传统系统并没有多少不同。移动安全并非软件开发过程的一部分，应用程序开发者不熟悉底层系统基础设施，而且用户偏于便利性而非安全性——这些因素共同构成了可以被攻击者利用的威胁。


    ![](img/11656_005_fig_000.jpg)


    # 谁攻击了我？


    在小时候，我们以前玩过一种游戏：拍某人身体的一侧，然后在他们看到是谁之前蹲下或躲起来。通过你自己的笑声，通常能听到他们问：“谁打我？”，并看到他们困惑地环顾。


    确定“是谁干的”被称为溯源，它是网络安全领域的一个重要挑战。网络安全中的溯源是一个数字取证调查过程，旨在确定网络攻击的谁、为什么、什么、何地以及如何。单次攻击可能包含许多变量，包括多个步骤（例如，社会工程然后是数据窃取）、多态代码（即会改变的代码）、各种攻击方法（例如社会工程、拒绝服务攻击或基于欺骗的方法）或多个参与者（即协作攻击）。所以就像我描述的小游戏一样，确定是谁攻击了你可能是困难的。


    为了简化这一挑战，网络安全分为三个主要类：`threats`（威胁）、`vulnerabilities`（漏洞）和 `risks`（风险）。`威胁` 是可能对信息系统或网络造成损害的潜在数字事件。例如，对于电子商务网站来说，潜在的`威胁`可能是网站关闭一段时间，导致无法无法产品而产生收入损失。`漏洞`
    是由于系统中某种形式的弱点或错误导致的潜在威胁。例如，计算机编程错误通常会导致某种形式的`漏洞`。同样使用电子商务网站的例子，假设存在编程错误允许人们以低于广告的价格购买特定商品。这被视为一个`漏洞`。在这种情况下，`威胁`
    是由于该错误，有人可以以低于广告的价格购买产品。


    最后，`风险` 考虑了`威胁`、`漏洞`和后果。它是在特定条件下网络攻击发生的概率衡量。这种概率是一个粗略的衡量，描述了特定的`漏洞`被攻击者（或网络安全术语中的“威胁行为者”）发现并使用的几率。使用我们的电子商务网站插图，网络安全专业人员不仅会考虑错误购买产品的`威胁`，还会考虑程序员实际上犯下该错误的概率。在这种情况下，`风险`很低，因为为电子商务交易编码很常见，程序员不太可能犯那个错误。


