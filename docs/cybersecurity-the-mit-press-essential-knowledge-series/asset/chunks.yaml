    今天使用的完整性原则的三个顶级示例是`passwords`（密码）、应用`verification`（验证）和`tripwire`（触发器）。`passwords`仍然是与某种形式用户名结合的最常用的身份验证形式。为了保持其完整性和机密性，密码不会以原始形式存储。一旦你创建了密码，它将会被哈希处理、加盐（`salted`），然后进行存储。在哈希过程中添加盐为密码的完整性提供了另一层安全保障。`salt`（盐）本质上是一个一次性的随机字符流，每当更新密码时都会发生变化。应用程序会自动更新`salt`，而不需要用户或系统所有者的交互。`salt`的最佳现代例子是完全自动的、用于区分计算机和人的公共图灵测试（`captcha`）。每当你访问网站并尝试登录时，都会显示不同的`captcha`
    代码，它作为身份验证过程的一部分。


    在应用程序可能被篡改的情况下，可以启动应用`verification`，这通常在创建和下载应用（如一个`hash`）时进行（例如，计算或验证相同的`hash`）。如果
    `hash` 验证过程失败，用户不应信任该应用程序。


    最后，`tripwire`是一种主要用于文件完整性的应用程序。到目前你已经可以看到完整性的模式，`tripwire`也遵循了这一点。一旦安装，它将为你选择的所有文件创建`hashes`，并在每当授权用户更新文件时更新这些哈希值。在访问受完整性保护的文件时，如果文件被未经授权的用户修改，`tripwire`将发送警报。


    ## 可用性 (Availability)


    在网络安全语境下，`availability`指的是数据在需要时是可访问的。`availability`对于需要“按需”访问数据的企业和其他组织来说特别重要。例如，如果一家在线零售商正在销售一种在其他网站也出售的毛衣，它必须确保其毛衣与竞争对手同时甚至更早于竞争对手可用。否则，零售商可能会失去销售。与`availability`相关的关键指标是`uptime`（运行时间）和`downtime`（停机时间），它们分别了系统在给定时间内可能处于运行或停机状态百分比。表
    1 显示了百分比与实际时间段之间的映射。如你所示，即使是最小的百分比变化，也会导致多年、数月、数周和数天更多的停机时间。


    `availability`影响我们在线交互的许多方面。许多组织现在使用`cloud computing`（访问远程数据中心获取资源、数据存储和计算能力）来实现`digital
    transformation`（数字信息如何被使用或转换）。根据 Gartner 的最新报告，云技术服务市场预计在 2019 年增长 17.3%（2060
    亿美元），高于 2018 年的 1,758 亿美元；到 2022 年，90%的组织将使用云服务。`Clouds`对于电子商务特别为重要。研究估计，2019
    年全球有 19.2 亿数字买家。今天，全球 77 亿人人口中，约有 25%的人在在线购物。云的普及使得`availability`的目标变得更加重要。


    ### 表 1 运行时间图表 (Uptime Chart)


    | 可用性 | 每年停机时间 | 每月停机时间 | 每周停机时间 | 每日停机时间 |

    | --- | --- | --- | --- | --- |

    | 90% (“一个 9”) | 36.50 天 | 72.0 小时 | 16.80 小时 | 2.4 小时 |

    | 95% | 18.25 天 | 36.0 小时 | 8.40 小时 | 1.2 小时 |

    | 97% | 10.96 天 | 21.6 小时 | 5.04 小时 | 43.2 分钟 |

    | 98% | 7.30 天 | 14.4 小时 | 3.36 小时 | 28.8 分钟 |

    | 99% (“两个 9”) | 3.65 天 | 7.2 小时 | 1.68 小时 | 14.4 分钟 |


    （注：此处根据原文内容翻译）


    许多组织现在使用`cloud computing`（访问远程数据中心获取资源、数据存储和计算能力）来实现`digital transformation`（数字信息如何被使用或转换）。根据
    Gartner 的最新报告，云技术服务市场预计在 2019 年增长 17.3%（2060 亿美元），高于 2018 年的 1,758 亿美元；到 2022
    年，90%的组织将使用云服务。`Clouds`对于电子商务特别为重要。研究估计，2019 年全球有 19.2 亿数字买家。今天，全球 77 亿人人口中，约有
    25%的人在在线购物。云的普及使得`availability`的目标变得更加重要。


    ### 被忽视的网络安全目标 (The Overlooked Cybersecurity Goals)


    有三个目标被遗漏了：`authentication`（身份验证）、`authorization`（授权）和`nonrepudiation`（不可否认性）。虽然机密性、完整性和`availability`是基石，但如果你忽略这些，你就只解决了网络安全问题的一部分。


    ### 身份验证 (Authentication)


    在最简单的情况下，`authentication`通常通过用户名和密码完成。其目的是验证用户是他们所称的。多因素身份验证（`MFA`）通常需要资源。访问控制的第一步之一是识别和身份验证用户。有三种常见的认证因素：


    - 你知道的（如密码）

    - 你拥有的（如智能卡）

    - 你具备的（如指纹）


    这些因素的结合为验证个人并为下一步——`authorization`提供了可靠的方法。


    ### 授权 (Authorization)


    `Authorization`与`authentication`协同工作；它在个人通过验证后发生。随后，`Authorization`负责确定授权用户对资源的访问范围。什么是资源？资源可以是计算环境中的任何东西。常见的资源是文件（如文字处理文档）或应用程序（如文字处理软件或网络浏览器）。任何操作系统（Microsoft
    Windows、Red Hat Linux 或 Apple iOS）中的文件都可以分配权限。文件权限有助于授权的范围和类型。查看图 3 查看 Linux 系统的权限结构。如你所示，有四个通用权限部分：`file
    type`、文件所有者权限、组所有者权限和其他用户权限。`file type`部分简单，询问：这些权限适用于文件还是目录（存放多个文件的目录）？`file
    owner`是经过验证的用户。此部分表示用户是否可以读取（`r`）文件，或同时读取和写入（`w`）文件（即编辑文件）。`xx）专门用于可以执行或运行的应用程序。相同的权限也适用于同一组的人。对于特定的组织，如果需要，可以将所有的行政助理或工程师放在同一组。最后一组权限是针对“其他人”的。例如，这可能是你组织之外未授权访问文件/应用程序的人。

