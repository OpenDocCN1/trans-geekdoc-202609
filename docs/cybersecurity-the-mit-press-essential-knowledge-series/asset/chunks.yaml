    top ten.


    Table 3 OWASP Top Ten Risks


    | Risk || Sample attack result |


    | --- | --- |


    | Injection || Attackers can issue requests to the web application that will result
    in a return of sensitive data on the website (e.g., passwords). |


    | --- | --- |


    | Broken authentication || Attackers can supply the incorrect username and password,
    and be granted access to the web application. |


    | Sensitive data exposure || User supplies the username and password to the web
    application, and the information is seen by an adversary because it is not encrypted.
    |


    | XML external entities || Attackers are allowed to upload XML directly to the
    web application, causing a potential disclosure of sensitive information. |


    | Broken access control || Attackers can access web application functions directly
    without proper authentication. This could result in the theft of sensitive information.
    |


    | Security misconfiguration || Attackers will be able to exploit a feature of
    the web application that was not set up correctly. For example, if the authentication
    for the application is not set up correctly, it could allow access to unauthorized
    users. |


    | Cross-site scripting || Attacker inserts a malicious application into a web
    application that will execute in another user’s browser. This can result in that
    user’s credentials being sent to the attacker. |


