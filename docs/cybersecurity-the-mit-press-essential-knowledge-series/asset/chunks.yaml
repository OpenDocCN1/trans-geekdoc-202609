    完整性是密码学实现的第二个网络安全原则。如果说机密性关注的是数据隐私，那么完整性则围绕数据/系统的信任展开。完整性在三种主要情况下至关重要：使用计算机系统、发送数据和接收数据。在
    ways 计算机系统的情况下，一切都始于你正在使用的设备或系统。如果你无法信任你正在使用的设备，又如何能信任上面的数据呢？发送数据与之紧密相关，因为在将数据发送给他人之前，你希望确保可以信任数据没有被篡改。最后，在接收数据时，接收者也需要能够信任他们正在使用的系统以及其中的数据，包括从发送者处接收的数据。在高级层面，某种形式的密码学可以解决这三种情况。


    首先，哈希（Hashing）解决了数据完整性问题。如前所述，哈希是一种加密方法，它可以将任何形式的数据转换为唯一的文本字符串。任何数据都可以进行哈希，无论其大小或类型。在传统的哈希中，无论数据的大小、类型或长度如何，任何数据产生的哈希长度始终是相同的。哈希被设计为一种单向函数——你可以将数据输入哈希算法并获得一个唯一的字符串，但如果你遇到一个新的哈希，你无法解密它所代表的输入数据。独特的数据将始终产生相同的哈希。因此，发送者可以在数据生命周期内创建并更新哈希，以确保特定的数据元素是可以的。同样，在接收时，接收者可以验证原始哈希，以确保他们接收的数据与发送的数据相同。


    系统完整性要复杂一点，但结果相同：能够信任系统。三个主要概念有助于系统完整性：文件系统完整性、硬盘（HD）完整性和安全启动。对文件夹或文件进行哈希确保其完整性实现了文件系统完整性。对整个硬盘及其上的所有内容进行哈希实现了硬盘完整性。安全启动是一种机制，在检测到网络攻击时防止计算机关闭。所有这些概念的结合提供了全面的系统完整性。你现在可以信任计算机自上次登录以来没有发生变化（安全启动），信任整个系统（硬盘完整性），并信任硬盘上的文件（文件系统完整性）。


    ## 密码学与不可否认性


    我将讨论的由密码学实现的最后一个网络安全原则是不可否认性，它是认证和完整性的结合。不可否认性通过数字签名或消息认证码（`MAC`）获得。一个包含另外两个原则的原则目的是什么呢？在词典和法律术语中，“否认”是对某些事物的有效性或真实性的拒绝或否定。这一原则在现实生活的在线交易中可能涉及何处？再次，挂号邮件的概念与此相关。挂号邮件主要供发送者确保以下三点：


    1. 一个重要的包裹/信件已发送（通过追踪）

    2. 一个重要的包裹/信件已送达（通过追踪）

    3. 发送者无法否认已收到（通过签名）


    在某些情况下，你甚至可以付费要求在交付时进行签名以执行第 3 点（称为签名确认）。在数字世界中，有几种情况这很重要。想象你是一家公司老板，必须解雇某人。你与人力资源部门负责人及其主管交谈，然后告知员工你的决定。主管通知员工，并指示他们与人力资源部门会谈。为了使这项“交易”正式化，人力资源部门向员工发送一封邮件，作为解雇行动的确认并附带条款。然而，员工并未确认收到任何终止通知。三十天后，公司遭到了来自员工律师的诉讼，指称在未通知员工的情况下停止发放工资属于疏忽。


    第二个例子是电子账单交易。大多数公司现在都有“环保”选项，允许你通过电子方式接收并支付账单。如果没有不可否认性，这可能实现吗？没有不可否认性的场景有很多：付款者可以每个月（或任何方便的时候）否认收到账单；公司可以声称付款者没有付款；付款者可以声称已付款（实际上没有）；公司可以声称只收到了部分付款。这种情况可以一直持续，双方都可以提出无法被另一方反驳的主张。不可否认性允许我们通过数字签名和或
    `MAC` 轻松解决这些场景。


    数字签名是通过使用密钥对中的私钥创建的。回顾一下，为了加密并提供机密性，我们会使用公钥加密并使用私钥解密。请记住，私钥必须始终保密。所以如果我们反过来，用私钥加密“某些内容”，就可以用公钥解密，对吗？是的。这是因为正如我之前提到的，两个密钥之间存在数学关系，允许其中一个（或）用于加密，另一个用于解密。数字签名的轻量级形式被称为
    `MAC`，它是用于验证消息的几个字节块。接收者可以检查此区块并确保消息没有被第三方修改。这听起来与哈希相似。确实相似，但有一个微小但关键的区别：它们的用途。一旦计算出哈希，它只能验证消息的完整性（即消息在传输过程中没有被篡改）。`MAC`
    也这样做，但它们使用私钥创建了一个可以由接收者验证的数字签名形式。因此 `MAC` 能够提供完整性和认证。在不允许否认的数字通信中，这些概念都极其重要。


    ## 密码算法


    如果没有基础算法，密码学将一无是处，算法实现了数据加密、完整性、认证、不可否认性和数字签名等关键任务。密码算法是用于加密或解密数据的数学指令集。算法只是描述用于规定特定问题解决的操作规则的一种通说法（例如，`1
    + 1 = 2`）。密码算法的工作原理相同，但它们要复杂一点。

