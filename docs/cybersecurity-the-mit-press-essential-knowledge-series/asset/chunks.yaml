    - **第 1 步：侦察**——攻击者向目标承包商发送电子邮件进行信息钓鱼，并进行互联网搜索以绘制内部网络结构图。

    - **第 2 步：武器化**——这一步无法被网络防御技术检测，因为它是在确定漏洞后在离线进行的。在此步骤中，攻击者根据第 1 步收集的信息准备了利用程序。

    - **第 3 步：交付**——攻击者通过鱼叉式网络钓鱼（针对性电子邮件攻击）将载荷发送给目标承包商。

    - **第 4 步：利用**——一旦交付，恶意应用程序就开始记录信用卡刷卡并存储数据以备日后盗取（第 7 步）。

    - **第 5 步：安装**——如第 4 步所示，应用程序在记录信用卡交易之前必须先安装。

    - **第 6 步：命令与控制**——攻击者在目标网络中立足了一个多月。因此可以合理推断，受害者机器与攻击者之间存在开启的通信通道（尽管报告中未证实这一点）。

    - **第 7 步：实施目标**——攻击者将盗取的数据传输到外部服务器位置。


    如你所见，执行一次网络攻击涉及的内容比电视节目或广告中展示的要复杂得多。定位并攻击受害者机器或网络的过程既复杂又漫长。对于电影爱好者来说，即使是备受喜爱的
    1995 年电影《黑客》（*Hackers*），描述的黑客也有些不切实际。在电影中，黑客被指责创建了一个会导致五艘油轮倾覆的病毒。这种规模的攻击需要上述列出的所有七阶段，但在电影中，在完成准备工作后描写真实的攻击变得更容易且更刺激。例如，其中一名黑客被捕并被指控在一天内导致
    1,507 台计算机系统崩溃，并导致纽约证券交易所单日跌幅七点。虽然传达了攻击持续一天，但在之前必须发生许多不可见的步骤（例如：识别系统、在机器上安装僵尸程序以及编写崩溃时间逻辑——即何时执行）。因为观看过程并不那么刺激，策划攻击的这些投入工作从未进入新闻，也被排除在电影情节之外。然而在现实中，这些工作对于杀伤链模型（kill
    chain model）成功执行网络攻击至关重要。


    # 6


    # 行动中的恶意软件


    你早晨醒来，心情非常好。昨天你发现因为在公司客户中的表现出色，获得了晋升和加薪。这将是*精彩*的一天，你尝试早点上班。你快速地完成了日常的晨间活动，提前一小时到达公司。果真，你收到了一封来自人力资源副总裁的邮件，上面指示了如何“领取你的晋升”。你没有多想就点击了邮件并打开了
    PDF 附件。指令的一部分要求你下载一套新的晋升工具包，该工具包专门设计用于帮助晋升过程，所以你完全按照指示操作。


    这时，你的同事开始到达，一些人路过向你握手并向你祝贺。这一天不能更*好*了！就在你的主管哈里（Harry）到达时，应用程序完成了安装。你几乎无法抑制内心的兴奋，所以告诉他你早来是为了为你新角色可能分配的任何新任务空出时间。他对你的主动性留下了深刻印象！接下来你告诉哈里你收到了人力资源部的邮件，并已经处理了晋升工具包的安装，但你有一些问题。当哈里问出这两个字的问题时，他的表情简直无价了：“什么邮件？”你重复了一遍，然后意识到他并不是在开玩笑。


    你和哈里回到电脑旁，看到一群同事聚集在你的办公桌旁。每隔几秒，坐在离你最近的同事就会发出沮丧的尖叫。下方的图 6 现在出现在你的屏幕上，表明你已经遭受了勒索软件攻击，所有的文件都无法访问。


    不久，勒索软件就感染了整个办公室。这一天开始得早，结束得也早——你羞愧地抱着一箱东西走向汽车。


    那么这一切的意义是什么？发生了什么？又该如何避免？恶意软件是任何故意设计用于计算机、服务器、客户端或计算机网络造成损害的软件。在这一不幸的情况下，你接触了破坏性最强、成本最高的恶意软件形式之一——勒索软件。此类攻击通常涉及单台机器的感染，允许攻击者将组织服务器甚至云端服务器上的数据作为人质。所有恶意软件都有相似之处，但其破坏性影响可能是独特的。让我们进一步了解一下这种危险的网络安全问题。


    ## 恶意软件概述


    恶意软件的主要目标是获取敏感信息或防止授权用户访问这些信息。恶意软件有多种形式，例如第 1 章中讨论的蠕虫病毒（Creeper virus）和莫蠕虫（Morris
    worm）。在本章的其余部分，我将查看其中的一些形式以及一些相关的示例。


    早在 2006 年，研究人员就在检查点对点（P2P）网络中最常见的恶意软件类型，这些网络涉及互连计算机系统之间的资源共享。在当时，点点网络是网上共享信息的常用手段。由于上述便利性与安全性之间的挑战，几乎没有任何保护措施来确保这些网络中交换的文件不是恶意的。因此，这使得点点网络成为传播恶意软件的理想媒介。这一假设今天仍然成立：恶意软件在用户量大且安全性低的业务领域最为流行。2018
    年，当世界关注于木马（信息窃取程序）和黑客挖比特币时，勒索软件问题正在悄悄恶化。虽然这并不是一本关于网络卫生维护的书，但这是攻击者的共同主题。每当技术创新出现，恶意软件的演进就会随之而来。


    ## 恶意软件分类背景


    恶意软件主要分为两大类：基于主机的（host based）和独立的（independent）。正如其名所示，基于主机的恶意软件需要主机才能执行，而独立的恶意软件不需要。需要主机的常见恶意软件类型是病毒、木马和逻辑炸弹。不需要主机的常见恶意软件类型是僵尸（也称为机器人）和蠕虫。进一步区分恶意软件分类的是，它们分为可以复制和不可复制的。病毒、蠕虫和僵尸构成了可以复制的恶意软件类别。图
    6 展示了这些恶意软件分类。


