  raw: 'Three of the top examples of integrity principles being used today are *passwords*,
    application *verification*, and *tripwire*. Passwords are still the most widely
    used form of authentication in conjunction with some form of a username. To maintain
    their integrity and confidentiality, passwords are not stored in their native
    form. Once you create a password, it will be hashed, *salted*, and then stored.
    Adding the salt to hashing provides another level of security for password integrity.
    A salt is essentially a one-time random stream of characters that is changed every
    time the password is updated. The application automatically updates the salt,
    without requiring interaction by the user or system owner. The best modern-day
    example of a salt is the completely automated public Turing test to tell computers
    and humans apart (captcha). Each time you navigate to a website and attempt to
    log in, a different captcha code is presented, which serves as part of the authentication
    process.


    In the event that an application may have been tampered with, application verification
    can be initiated, which is typically done when an application (like a hash) is
    created and downloaded (e.g., the same hash is computed or verified). If the hash
    verification process fails, the user should not trust the application.


    Lastly, tripwire is an application used primarily for file integrity. By now you
    can see the pattern for integrity, and tripwire follows suit. Once installed,
    it will create hashes of all the files you select and update these hashes whenever
    an authorized user updates the files. On accessing the files that have been integrity
    protected, tripwire will send an alert if a file has been modified by an unauthorized
    user.


    ## Availability


    In the context of cybersecurity, availability refers to data being accessible
    when it is required. Availability is particularly important to businesses and
    other organizations that require “on-demand” access to data. For example, if an
    online retailer is selling a sweater that is also available on other websites,
    it must ensure that its sweater is available at the same time or even before its
    competitors. Otherwise the retailer is likely to lose sales. Key metrics related
    to availability are uptime and downtime, which reflect the percentage of time
    a system could potentially be up or down, respectively, during a given period.
    Table 1 shows the mapping between percentages and actual time periods. As you
    can see, even the smallest percentage change results in a lot more downtime across
    years, months, weeks, and days.[6](#11656-0014.xhtml#en9)


    Availability affects many aspects of our online interactions. Many organizations
    are now using cloud computing (accessing remote data centers for resources, data
    storage, and computing power) to enable digital transformation (how digital information
    is used or transformed). According to the latest Gartner report, the cloud technologies
    services market was projected to grow 17.3 percent ($206 billion) in 2019, up
    from $175.8 billion in 2018; by 2022, 90 percent of organizations will be using
    cloud services.[7](#11656-0014.xhtml#en10) Clouds are particularly important for
    e-commerce. Studies estimate that 1.92 billion global digital buyers existed in
    2019. Today, about 25 percent of the world’s population of 7.7 billion people
    shop online.[8](#11656-0014.xhtml#en11) The ubiquity of the cloud makes the goal
    of availability all that much more important.


    Table 1 Uptime Chart


    | Availability || Downtime per year || Downtime per month || Downtime per week
    || Downtime per day |


    | --- | --- | --- | --- | --- |


    | 90% (“one nine”) || 36.50 days || 72.0 hours || 16.80 hours || 2.4 hours |


    | --- | --- | --- | --- | --- |


    | 95% || 18.25 days || 36.0 hours || 8.40 hours || 1.2 hours |


    | 97% || 10.96 days || 21.6 hours || 5.04 hours || 43.2 minutes |


    | 98% || 7.30 days || 14.4 hours || 3.36 hours || 28.8 minutes |


    | 99% (“two nines”) || 3.65 days || 7.2 hours || 1.68 hours || 14.4 minutes |


    Availability is also critical to governments, and especially their departments
    of defense. When a business’s cyber system fails or is interrupted, business operations
    and revenue are negatively impacted. When a government-run system goes down, lives
    can be lost. For example, the US Department of Defense’s Advanced Field Artillery
    Tactical Data System is used by the army and marine corps to provide automated
    support during conflicts.[9](#11656-0014.xhtml#en12) When a “request-for-fire”
    command is made to this system, a number of components and subsystems need to
    be *available* at that precise moment in order to achieve a precision strike.
    Any interruption to such a system could be catastrophic.


    ## The Overlooked Cybersecurity Goals


    There are three goals that are typically left out of primary cybersecurity definitions:
    *authentication*, *authorization*, and *nonrepudiation*. Although confidentiality,
    integrity, and availability are the foundations on which the entire field is built,
    if you cannot verify online identity (authentication), determine what users have
    access to (authorization), and prevent users from denying that things have occurred
    (nonrepudiation), you are only solving a portion of the cybersecurity problem.


    ### Authentication


    In its simplest form, authentication is usually accomplished by a username and
    password selected by the user. It is safe to assume that most individuals have
    had to use some form of authentication online. Its purpose is to verify that a
    user is who they say they are. Multifactor authentication (MFA) is typically required
    to access a resource. One of the first steps of access control is the identification
    and authentication of users. There are three common factors used for authentication:


    *   • Something you know (such as a password)


    *   • Something you have (such as a smart card)


    *   • Something you are (such as a fingerprint or other biometric method)


    The combination of these factors provides a strong method of validating an individual
    and suppling the information required for the next step—*authorization*.


    ### Authorization


    Authorization works in conjunction with authentication; it takes place after an
    individual has been authenticated to a system. Authorization then is responsible
    for determining the scope of access to a resource that a particular person has
    once authenticated. What is a resource? A resource can be anything in a computing
    environment. The most common resources are files (like a word processing document)
    or applications (like a word processing software or internet browser). All files
    in any variant of an OS—Microsoft’s Windows, Red Hat’s Linux, or Apple’s iOS—can
    be assigned permissions. File permissions facilitate the authorization’s scope
    and type. See figure 3 for the Linux OS’s permissions structure.


    Applications contain similar permissions structures, but let us take a closer
    look at how permissions work. As you can see, there are four general permissions
    sections: *file type*, *file owner permissions*, *group owner permissions*, and
    *other user permissions*. The file type section is simple, asking: Are these permissions
    applicable to a file or directory (which hosts multiple files)? The file owner
    is the authenticated user. This section denotes whether or not a user can read
    (r) the file only, or both read and write (w) to the file (i.e., edit the file).
    The (x) is specifically for applications that can be executed or run. These same
    permissions apply for people in the same group. For a particular organization,
    you can have all administrative assistants or engineers in the same group if desired.
    The last set of permissions are for “everyone else.” For example, this might be
    people outside your organization not authorized to access the file/application.


