  \n# 网络效应\n\n没有回复，噢，你没看到吗？没有回复，它正在毁我 Peter Shelley, 1978\n\n作者兼多产通信者 P. G. 伍德豪斯曾透露，他从不邮寄他的邮件。在信上贴好邮票后，他声称会直接把它扔出窗外，因为他深信“总有人会捡起来的，这让我每次想寄信时都不用去爬四层楼梯”\
  \ [\\[66\\]](#text00027.html#a3W9) 。\n\n有些人认为，伍德豪斯依赖于战后英国公民的基本道德感（这确实与他在小说中创造的那个充满笨拙贵族和狡猾管家的世界契合得很好），但我认为其中有某种更深层的东西，而这种深层的东西与网络有关。\n\
  \n区块链运行在去中心化的点对点计算机网络上。现在，如果世界上有一群人真正且本能地理解网络的力量，那一定是销售人员。噢，还有业务拓展人员、政治家和记者。以及共济会成员、更精通的名校及大学校友，以及退伍军人。所以这是七类人。如果我愿意继续深入寻找，可能还会列出至少另外七类。\n\
  \n对于这类网络的所有成员来说，本章的大部分内容似乎将是直而易懂的。而我们其他人，奇怪的是，对网络的社交力量一知甚少，尤其是那些被工程、科学和数学所吸引的人。我们从很小起就知道那些网络是什么——几乎每个人的个人网络中都有家庭、一群朋友，可能还有工作同事，以及他们的\
  \ Facebook、Instagram 和 LinkedIn 好友。\n\n然而，我们中的许多人并不知道这些网络究竟是怎样的，也没有花任何时间去思考其中发生的事情的深层意义。我们绝没有思考过如何以任何富有效率的方式利用这些社交网络。它们就呆在那里，而我们漫无知地在其中漂浮。所以，让我直白地说吧：网络的根本力量在于，你可以利用该网络的技能和资源，而且，你可以通过联系远程成员来放大这些技能和资源的力量，即使你并不认识网络中的每一个人。\n\
  \n工程师对社交网络的关注不够，因为他们没有充分考虑资源（那些东西如果他们足够幸运有一份工作，就会在向雇主索要时像魔法一样出现，前提是他们正在做一份被认为有价值的工作）。这是我曾希望在几十年前就知道的事情，这是一种奇怪的差异，因为从技术上说，工程师非常理解网络运行的通信方法。他们只是不理解通过这些网络传递的价值。\n\
  \n对于软件工程师来说，说得更清楚一点——去找办公室坐在你旁边的开发者并问“你能向我解释一下 Python 语言中的多态吗？”，与说“你认识谁可以向我解释 Python\
  \ 语言中的多态吗？”，之间有巨大的区别。前者问题可能让你得到一个“不”，或者一个半条不烂的解释，除非你足够幸运地坐在一个深入理解这个问题和答案的人旁边，否则它毫无意义。后者实际上可能会让你获得与公司面向对象编程专家进行三十分钟一对一交流的机会。\n\
  \n作为工程师，我们习惯于确定自己问题的焦点，在现有的网络中尽力识别谁能回答该问题，并联系他们且仅联系他们。真正的网络达人会提出开放的、探索性的问题。这就是为什么他们会说“你认识谁需要区块链咨询吗？”，而不是“你需要区块链顾问吗？”。\n\
  \n## 理解网络图\n\n史上最糟糕的网络图![](img/Image00022.jpg)图 18：中心化、去中心化和分布式网络 1964 年，保罗·巴兰（Paul\
  \ Baran）画了一个简单的图来解释不同类型的网络 [\\[67\\]](#text00027.html#a3RD)。近年来，它反复出现在各种区块链出版物中，用来解释去中心化网络和分布式网络。正如常有的一样，大多数转发者实际上并没有花心思去溯源查明这张图的真实含义到底是什么。其实它本身并不是一张糟糕的图，但在\
  \ 1964 年，去中心化的概念仍在研究中，并且与今天非常不同（甚至更具革命性）。\n\n所以，正是图 18 中间那幅引起了所有问题。看着巴兰的图，我想起了罗塞尔和怀特海德那部令人着迷、宏大、奇妙且最终徒劳的著作《数学原理》[\\\
  [68\\]](#text00027.html#a3MS)，其中两位最伟大的数学家、逻辑学家和哲学家试图将所有的逻辑和数学形式化（甚至在第 379 页“证明”了\
  \ 1+1=2）。希望巴兰在他的论文上花费的精力比那少。\n\n我对这张图存在的核心问题是什么？事实是，它在一张图像中混合了两个不同的概念——中心化与去中心化，以及分布性与……额……非分布性？集中性？还有第二个问题——大多数人认为分布式的对面是中心化的。在中心化网络中，有一个\
  \ `server`（服务器），它接收来自 `clients`（客户端）的请求并做出响应。你可以将其想象成一个坐在山上的导师。\n\n![](img/Image0023.jpg)图\
  \ 19：去中心化分布式网络 相比之下，在一个真正的分布式系统中，没有真正的 `clients` 和 `servers`。或者更好的观点是，每个节点既是 `client`\
  \ 也是 `server`。在去中心化网络中，如果一个节点不知道答案，它会将其转发给其他节点，然后这些节点再转发，以此类推，直到每个节点都拥有。\n\n## 区块链与网络\n\
  \n如所述，区块链运行在点对点网络之上。如果你要提供一个在任何意义上都是去中心化的系统，它必须是这样。这并不意味着任何人都可以走上街加入你的网络——你可以有准入要求——但如果存在一个实体优于所有其他实体，那么它就不是无许可区块链，而是一个中心化系统。许可链（目前公司首选的区块链结构）面临着一个单调重复的问题——独裁节点。我认为这归于我们公司系统的演变方式。公司从军事中汲取了剧本，而军事又基于中世纪的封建制度。命令与控制结构被构建在我们所熟悉的每一个正式环境中。我们可能会用民主选举或其他人气选拔来装饰它，但从我们的家庭生活（父母是独裁者）到学校，再到工作以及我们居住国家的各个，总有一些处于权威地位的人，他们有权做出对我们产生深的影响。\n\
  \n## 握手问题\n\n对于不熟悉荷兰的人来说，这里有一个关于那里那里的人习惯的有趣文化事实：当你到达一个成人的生日派对时，你会逐个向场的所有人祝主主的生日，而不仅仅是过生日的人。即使是荷兰人也会轻易承认这是事实，并认为这奇怪极了。所以，撇开奇怪的文化习俗不谈，问题是：如果一个派对有\
  \ N 个人像矮人来到比尔·巴金斯的霍比特穴一样一个一个到达，到底会有多少次祝福？回答这个问题有很多方法，其中某些方法比其他更高效。遗憾的是，高效的方法并不一定最容易理解或最能启发。所以，让我们从简单的方法开始：\n\
  \n\n\n\n\n*   主人没有祝贺自己。\n*   第一位客人到达。我们现在有两个人，产生了一声祝贺。\n*   第二位客人到达，并向第一位客人和主人祝贺。这样就是\
  \ 2 次，加上之前的 1 次。\n*   第三位客人到达，并向第一位、第二位客人以及主人祝贺，所以是 3 次，加上之前的 2 次和 1 次。\n*   现在我们可以看到一个模式。当\
  \ `Nth` 位客人到达时，总数变为 `N + (N – 1) + … + 3 + 2 + 1`。\n\n这个总和很容易计算出来。如果邀请了五位客人，意味着将会有六个人在场（别忘了加上过生日的那个人）。在我们刚刚得到的公式中代入\
  \ `N = 5`，你得到 `5 + 4 + 3 + 2 + 1 = 15`。这个数字足够小，完全可以在脑海中完成：想象客人陆续到达，给每个人一个不同的面孔，并在脑海中计算每一声祝贺。但如果是一个有百位客人的非常受欢迎的生日呢——有没有更简单的方法？记载史上第一个用更高效的方法解决这个问题的人，也是历史上最著名的数学家之一，令人惊讶的是：a)\
  \ 他在做这件事时还是个学生，而且 b) 这竟然是 1784 年的事。约翰·卡尔·弗里德里里希·高斯出生于 1777 年，死于 1855 年，被描述为“自古代以来最伟大的数学家”。他七岁时就用脑海中想出了一个简单的公式来求前\
  \ `N` 个自然数的和。我认为用视觉化的方式演示高斯如何推导出他的公式会更容易。形如 `N + (N – 1) + … + 3 + 2 + 1` 的数字被称为三角形数，因为——嗯，看：\n\
