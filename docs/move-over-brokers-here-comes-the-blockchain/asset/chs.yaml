  \ 作者简介\n\n我永远感谢我过去的影响 Mark E. Smith, 1980 ![](img/Image034.jpg)\n\n你好，我是 Keir Finlow-Bates！我目前是一名区块链技术的发明者，也是一名企业家，和妻子以及孩子们一起住在芬兰。我出生在澳大利亚，但在奥地利、德国和荷兰长大。尽管我是英国人，但我有一本新西兰护照。\n\
  \n我是在 2009 年底通过一位同事向我推荐那篇开创性论文首次发现区块链的。遗憾的是，我把时间花在了研究技术上，而不是购买廉价的比特币，这就是为什么我仍然为了生活而工作并编写像你刚刚读的这样的书。我的职业生涯大部分部分时间都是软件测试工程师，过去还有制作奶酪、酿酒、阅读晦涩文学和写糟糕诗等爱好，但现在我将时间平均分配在研究新的区块链概念、照顾孩子、修理他们弄坏的东西以及睡觉上。如果你想了解更多，可以在\
  \ [www.youtube.com/thinklair](http://www.youtube.com/thinklair) 查看关于区块链概念的短视频合集。\n\
  \n"
