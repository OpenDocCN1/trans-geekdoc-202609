  md: '**Lemma 4.1.** For each \(k \in \mathbb{N}\), letting \(\tilde{G}_k \sim N(0,
    1)\) be independent of \((Z, \bar{\varepsilon})\), we have \((Z, Z_k, \bar{\varepsilon})
    \stackrel{d}{=} (Z, \mu_{Z,k}Z + \sigma_{Z,k}\tilde{G}_k, \bar{\varepsilon})\),
    where

    \[

    \begin{aligned}

    \mu_{Z,k} &:= \frac{\mathbb{E}(\bar{\beta}f_k(\mu_k\bar{\beta} + \sigma_k\tilde{G}_k))}{\mathbb{E}(\bar{\beta}^2)}
    = \frac{\Sigma_{21}}{\Sigma_{11}}, \\

    \sigma_{Z,k}^2 &:= \frac{\mathbb{E}(\bar{\beta}^2)\mathbb{E}(f_k(\mu_k\bar{\beta}
    + \sigma_k\tilde{G}_k)^2) - \mathbb{E}(\bar{\beta}f_k(\mu_k\bar{\beta} + \sigma_k\tilde{G}_k))^2}{\delta
    \mathbb{E}(\bar{\beta}^2)} \\

    &= \Sigma_{22} - \frac{\Sigma_{12}^2}{\Sigma_{11}},

    \end{aligned}

    \]

    (4.8)


    with \(\Sigma \equiv \Sigma_k\). Thus, \(\mu_{k+1} = \mathbb{E}(\partial_z\tilde{g}_k(Z,
    \mu_{Z,k}Z + \sigma_{Z,k}\tilde{G}_k, \bar{\varepsilon}))\) and \(\sigma_{k+1}^2
    = \mathbb{E}(\tilde{g}_k(Z, \mu_{Z,k}Z + \sigma_{Z,k}\tilde{G}_k, \bar{\varepsilon})^2)\).
    Moreover,

    \[

    \begin{aligned}

    \mu_{k+1} &= \frac{\delta}{\mathbb{E}(\bar{\beta}^2)}\mathbb{E}(Zg_k(Z_k, Y))
    - \mu_{Z,k}\mathbb{E}(g''_k(Z_k, Y)) \\

    &= \mathbb{E}\left(\frac{\mathbb{E}(Z \mid Z_k, Y) - \mathbb{E}(Z \mid Z_k)}{\text{Var}(Z
    \mid Z_k)}g_k(Z_k, Y)\right).

    \end{aligned}

    \]

    (4.9)


    Before stating the main result of this subsection, we make an further regularity
    assumption that is similar to (B5).


    (G5) For each \(k \in \mathbb{N}_0\), writing \(D_k \subseteq \mathbb{R}^2\) for
    the set of discontinuities of \(g''_k\), we have \(\mathbb{P}((Z_k, Y) \in D_k)
    = 0\), and \(f''_{k+1}\) is continuous Lebesgue almost everywhere.


    **Theorem 4.2.** Suppose that (G0)-(G5) hold for a sequence of GAMP recursions
    (4.4) indexed by \(n\) and \(p \equiv p_n\), with \(n/p \to \delta \in (0, \infty)\)
    and \(\sigma_1 > 0\). Then for each \(k \in \mathbb{N}_0\), we have


    \[

    \sup_{\psi \in \text{PL}_2(r, 1)} \left| \frac{1}{p} \sum_{j=1}^p \psi(\beta_j^{k+1},
    \beta_j) - \mathbb{E}(\psi(\mu_{k+1}\bar{\beta} + \sigma_{k+1}G_{k+1}, \bar{\beta}))
    \right| \xrightarrow{\mathsf{p}} 0,

    \]

    (4.10)


    \[

    \sup_{\psi \in \text{PL}_3(r, 1)} \left| \frac{1}{n} \sum_{i=1}^n \psi(\theta_i^k,
    \theta_i, \varepsilon_i) - \mathbb{E}(\psi(\mu_{Z,k}Z + \sigma_{Z,k}\tilde{G}_k,
    Z, \bar{\varepsilon})) \right| \xrightarrow{\mathsf{p}} 0

    \]

    (4.11)


    as \(n, p \to \infty\) with \(n/p \to \delta\), where \(\theta_i \equiv \theta_i(n)
    = x_i^\top \beta\) for \(n \in \mathbb{N}\) and \(1 \le i \le n\).'
