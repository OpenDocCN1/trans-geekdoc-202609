    Stronger versions of these statements can be formulated as analogues of Theorem
    2.3. We now explain why we have stated our AMP master theorems (and all subsequent
    asymptotic results in the monograph) in terms of complete convergence.


    +   • Complete convergence is stronger than almost sure convergence and convergence
