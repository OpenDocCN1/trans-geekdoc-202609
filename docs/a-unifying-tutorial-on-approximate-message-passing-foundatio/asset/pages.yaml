    Given an arbitrary coupling \((Y_1, Y_2, \dots)\) of the random elements \(g_1(X_1),
    g_2(X_2), \dots\) , the first (and most important) step in the proof below is
    to ‘lift’ this to produce a suitable coupling \((X''_1, X''_2, \dots)\) of the
    random elements \(X_1, X_2, \dots\) , in such a way that \((g_1(X''_1), g_2(X''_2),
    \dots) \stackrel{d}{=} (Y_1, Y_2, \dots)\) as random sequences. Intuitively, the
    key construction can be interpreted as the output of the following two-stage procedure:


    +   (A) Denoting by \(\pi\) the (given) distribution of \((Y_1, Y_2, \dots)\)
    on \(\prod_{n=1}^\infty E''_n\), we first draw \((Y''_1, Y''_2, \dots) \sim \pi\);


    +   (B) Having obtained \((Y''_1, Y''_2, \dots) = (y_1, y_2, \dots)\) from Step
    A, we then generate \(X''_1, X''_2, \dots\) by sampling independently from \(Q_{y_1}^1,
    Q_{y_2}^2, \dots\) , where \(Q_{y_n}^n\) denotes the “conditional distribution
    of \(X_n\) given \(g_n(X_n) = y_n\)” .


    Step B ensures that \(X''_1, X''_2, \dots\) are conditionally independent given
    \((Y''_1, Y''_2, \dots)\). To make rigorous sense of this informal description
    and to validate the construction, we use the language of *disintegration of measures*,
    as outlined in Remark B.5. There are similarities here with the proof of the gluing
    lemma (Villani, 2003, Lemma 7.6). To verify that the random sequences \((g_n(X''_n))\)
