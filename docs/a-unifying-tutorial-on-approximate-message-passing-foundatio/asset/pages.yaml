  md: 'Thus, to establish the seemingly stronger conclusions in (ii) and (iii) for
    a random sequence of distributions \(P_n\), a putative limit \(P \in \mathcal{P}_D(r)\)
    and any of the above modes of stochastic convergence, it is sufficient (and sometimes
    more convenient) to show that the appropriate version of (i) holds for each \(\psi
    \in \text{PL}_D(r)\) in turn. This is the approach we take in the proofs of the
    master theorems for symmetric AMP (Theorems 2.1 and 2.3).


    Proof. (a) The implications (ii) \(\Rightarrow\) (iii) \(\Rightarrow\) (i) are
    immediate from Theorem B.17. As for (i) \(\Rightarrow\) (ii), note that for each
    \(\psi \in \text{PL}_D(r)\) in (i), the event \(\Omega(\psi)\) of probability
    1 on which \(\int_{\mathbb{R}^D} \psi dP_n \to \int_{\mathbb{R}^D} \psi dP\) may
    depend (a priori) on \(\psi\). The key point is that under (i), Theorem B.17 ensures
    that this convergence is actually uniform over \(\text{PL}_D(r, 1)\) on a countable
    intersection of such events \(\Omega(\psi)\). More precisely, letting \(T_r \subseteq
    \text{PL}_D(r)\) be as in Theorem B.17, we see that \(\cap_{\psi \in T_r} \Omega(\psi)\)
    is an event of probability 1 on which (ii) and (iii) hold.


    # (b) Convergence in probability:


    (i) \(\Rightarrow\) (ii): First, we prove that if \(P_n(\psi) \xrightarrow{p}
    P(\psi)\) for each \(\psi \in \text{PL}_D(r)\), then \(\tilde{d}_r(P_n, P) \xrightarrow{p}
    0\), or equivalently that every subsequence of \((\tilde{d}_r(P_n, P) : n \in
    \mathbb{N})\) has a further subsequence that converges almost surely to 0. It
    suffices to show that for any subsequence \((Q_k) \equiv (P_{n_k})\), there is
    a further subsequence \((Q_{k_\ell})\) such that with probability 1, we have \(Q_{k_\ell}(\psi)
    \to P(\psi)\) for all \(\psi \in T_r \subseteq \text{PL}_D(r)\); indeed, the desired
    conclusion then follows directly from (a). To this end, enumerate the elements
    of the countable set \(T_r\) as \(\psi_1, \psi_2, \dots\) and apply a diagonal
    argument: since \(Q_k(\psi_1) \xrightarrow{p} P(\psi_1)\), we can extract a subsequence
    \((Q_{k_{1,\ell}})\) of \((Q_k)\) such that \(Q_{k_{1,\ell}}(\psi_1) \xrightarrow{a.s.}
    P(\psi_1)\) as \(\ell \to \infty\). Continuing inductively, we see that for each
    \(J \in \mathbb{N}\), there exist a subsequence \((Q_{k_{J,\ell}})\) of \((Q_{k_{J-1,\ell}})\)
    and an event of probability 1 on which \(Q_{k_{J,\ell}}(\psi_j) \to P(\psi_j)\)
    as \(\ell \to \infty\) for all \(1 \le j \le J\). Finally, let \(Q_{k_\ell} :=
    Q_{k_{\ell,\ell}}\) for \(\ell \in \mathbb{N}\), and observe that with probability
    1, we have \(Q_{k_{J,\ell}}(\psi_j) \to P(\psi_j)\) as \(\ell \to \infty\) for
    all \(j \in \mathbb{N}\), as required.'
