    The proof of Proposition A.16(g) makes use of the following straightforward consequence
    of the definition of weak convergence.


    **Lemma B.14.** On a Euclidean space $E$, if $(\mu_n)$ is a sequence of Borel
    probability measures that converges weakly to a Borel probability measure $\mu$,
    then $\int_E g \, d\mu_n \to \int_E g \, d\mu$ for any bounded, Borel measurable
    $g: E \to \mathbb{R}$ that is continuous $\mu$-almost everywhere (in the sense
    that the set of discontinuities of $g$ has $\mu$-measure 0).


    _Proof._ Writing $A \subseteq E$ for the set of discontinuities of $g$, we have
    $\mu(A) = 0$ by assumption. By Skorokhod''s representation theorem (e.g. Kallenberg,
    1997, Theorem 3.30), there exist random variables $X, X_1, X_2, \dots$ defined
    on a common probability space such that $X \sim \mu$, $X_n \sim \mu_n$ for all
    $n$ and $X_n \to X$ almost surely. Then $g(X_n) \to g(X)$ almost surely on the
    event $\{X \in A^c\}$, which has probability $\mu(A^c) = 1$, so an application
    of the dominated (or bounded) convergence theorem shows that $\int_E g \, d\mu_n
    = \mathbb{E}(g(X_n)) \to \mathbb{E}(g(X)) = \int_E g \, d\mu$, as required. \(\square\)'
