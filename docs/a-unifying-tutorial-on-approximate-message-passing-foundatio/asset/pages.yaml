    In this tutorial, we restrict our focus to AMP recursions in which the random
    matrices are Gaussian. However, as we discuss in Section 5, several recent works
    have extended AMP and its state evolution recursion to more general non-Gaussian
    settings. For matrices with independent sub-Gaussian entries, results on the “universality”
    of AMP were first established by Bayati et al. (2015) and later in greater generality
    by Chen and Lam (2021). In addition, to accommodate the class of rotationally
    invariant random matrices, a number of extensions of the original AMP framework
    have recently been proposed, including Orthogonal AMP (Ma and Ping, 2017; Takeuchi,
    2020) and Vector AMP (Schniter et al., 2016; Rangan et al., 2019b), as well as
    the general iterative schemes of Opper et al. (2016), Çakmak and Opper (2019)
    and Fan (2022). Some of these are closely related to expectation propagation (Opper
    and Winther, 2005; Kabashima and Vehkaperä, 2014). In all of the above variants
    of AMP, the recursion is tailored to the spectrum of the random matrix.


    # 1.1 Notation and Preliminaries


