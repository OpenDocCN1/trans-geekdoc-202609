    By a *Euclidean space* $(E, \|\cdot\|_E)$ we mean a finite-dimensional inner product
    space over $\mathbb{R}$, equipped with the norm induced by its inner product;
    examples include $(\mathbb{R}^n, \|\cdot\|)$ for $n \in \mathbb{N}$ and $(\mathbb{R}^{k
    \times \ell}, \|\cdot\|_\mathrm{F})$ for $k, \ell \in \mathbb{N}$, where $\|\cdot\|_\mathrm{F}$
    is the Frobenius norm induced by the trace inner product $(A, B) \mapsto \mathrm{tr}(A^\top
    B)$.


