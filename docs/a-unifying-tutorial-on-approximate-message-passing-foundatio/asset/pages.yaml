    is based on a matrix \( W \in \mathbb{R}^{n \times p} \), two vectors \( \beta
    \in \mathbb{R}^p \) and \( \gamma \in \mathbb{R}^n \) of auxiliary information
    and two sequences \( (g_k, f_{k+1}: k \in \mathbb{N}_0) \) of Lipschitz functions
    \( g_k, f_{k+1}: \mathbb{R}^2 \to \mathbb{R} \). Given \( q^{-1} := 0 \in \mathbb{R}^n
