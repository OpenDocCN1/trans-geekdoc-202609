    # Complete convergence:


    (i) \(\Rightarrow\) (ii): Suppose that \(P_n(\psi) \xrightarrow{c} P(\psi)\) for
    every \(\psi \in \text{PL}_D(r)\). In view of Definition 1.1 of complete convergence,
    it suffices to show that if \((\beta_n)\) is any sequence of random variables
    with \(\beta_n \stackrel{d}{=} \tilde{d}_r(P_n, P)\) for each \(n\), then \(\beta_n
    \xrightarrow{a.s.} 0\). For any such sequence \((\beta_n)\), we first seek to
    construct a sequence \((\tilde{P}_n)\) of random elements \(\tilde{P}_n : \Omega
    \to (\mathcal{P}(r), \tilde{d}_r)\) such that \(\tilde{P}_n \stackrel{d}{=} P_n\)
    on \((\mathcal{P}(r), \mathcal{B}_r)\) for each \(n\) and \((\tilde{d}_r(\tilde{P}_n,
    P) : n \in \mathbb{N}) = (\beta_n : n \in \mathbb{N})\) almost surely as random
    sequences. Since \((\mathcal{P}(r), \tilde{d}_r)\) is a Polish space, a suitable
    \((\tilde{P}_n)\) can be obtained by applying Lemma B.10, where for each \(n\),
    we take \(g_n : (\mathcal{P}(r), \tilde{d}_r) \to \mathbb{R}\) to be the 1-Lipschitz
    (and hence Borel measurable) function \(Q \mapsto \tilde{d}_r(P, Q)\).


    For each \(\psi \in \text{PL}_D(r)\), we see from the definition of \(\tilde{d}_r\)
    in (1.4) that \(Q \mapsto Q(\psi) = \int_{\mathbb{R}^D} \psi \, dQ\) is also a
    1-Lipschitz (and hence Borel measurable) function from \((\mathcal{P}(r), \tilde{d}_r)\)
    to \(\mathbb{R}\), so \(\tilde{P}_n(\psi) : \Omega \to \mathbb{R}\) is measurable
    (i.e. a random variable). Now \(\tilde{P}_n \stackrel{d}{=} P_n\) for each \(n\)
    by construction, so for every \(\psi \in \text{PL}_D(r)\), it follows that \(\tilde{P}_n(\psi)
    \stackrel{d}{=} \tilde{P}_n(\psi)\) for each \(n\) and hence that \(\tilde{P}_n(\psi)
    \xrightarrow{a.s.} P(\psi)\). Thus, by the implication (i) \(\Rightarrow\) (ii)
    in (a) above, we conclude that \(\beta_n = \tilde{d}_r(\tilde{P}_n, P) \to 0\)
    almost surely, as required.


    (ii) \(\Rightarrow\) (iii) \(\Rightarrow\) (i): To establish these remaining implications,
    observe that it suffices to show the following: if \(F_n, G_n : \mathcal{P}(r)
    \to \mathbb{R}\) are Borel measurable functions for which it is known from (a)
    that \(F_n(P_n) \xrightarrow{a.s.} 0\) implies \(G_n(P_n) \xrightarrow{a.s.} 0\),
    then \(F_n(P_n) \xrightarrow{c} 0\) implies \(G_n(P_n) \xrightarrow{c} 0\). To
    prove this, we can proceed as in the argument for (i) \(\Rightarrow\) (ii): given
    any random sequence \((\beta_n)\) such that \(\beta_n \stackrel{d}{=} G_n(P_n)\)
