  md: 'Proof of Lemma 4.1. The first assertion follows from the following standard
    fact: let $(X_1, X_2)$ be a Gaussian random vector with $\mathbb{E}(X_1) = \mathbb{E}(X_2)
    = 0$ and $\Sigma_{ij} := \text{Cov}(X_i, X_j)$ for $i, j \in \{1, 2\}$. If $\Sigma_{11}
    = \text{Var}(X_1)$ is invertible, then $AX_1$ and $X_2 - AX_1$ are uncorrelated
    and hence independent when $A := \Sigma_{21}\Sigma_{11}^{-1}$. Thus, $(X_1, X_2)
    \stackrel{d}{=} (X_1, AX_1 + G)$, where $AX_1 = \mathbb{E}(X_2 \mid X_1)$ and
    $G \sim N(0, \Sigma_{22} - \Sigma_{21}\Sigma_{11}^{-1}\Sigma_{12})$ is independent
    of $X_1$. For (4.8), we deduce from Lemma A.20 that


    $\mathbb{E}(Z\tilde{g}_k(Z, Z_k, v)) = \Sigma_{11} \mathbb{E}(\partial_1 \tilde{g}_k(Z,
    Z_k, v)) + \Sigma_{12} \mathbb{E}(\partial_2 \tilde{g}_k(Z, Z_k, v))$


    for all $v \in \mathbb{R}$, where $\Sigma \equiv \Sigma_k$ is as in (4.7). Thus,
    since $(Z, Z_k) \stackrel{d}{=} (Z, \mu_{Z,k}Z + \sigma_{Z,k}\tilde{G}_k)$ is
    independent of $\bar{\varepsilon}$ in (4.6), and $\mu_{Z,k} = \Sigma_{21}/\Sigma_{11}$
    by the first part of the lemma,


    $\begin{aligned} \mathbb{E}(Zg_k(Z_k, Y)) &= \mathbb{E}(Z\tilde{g}_k(Z, Z_k, \bar{\varepsilon}))
    \\ &= \Sigma_{11} \mathbb{E}(\partial_1 \tilde{g}_k(Z, Z_k, \bar{\varepsilon}))
    + \Sigma_{12} \mathbb{E}(\partial_2 \tilde{g}_k(Z, Z_k, \bar{\varepsilon})) \\
    &= \frac{\mathbb{E}(\bar{\beta}^2)}{\delta} \{ \mu_{k+1} + \mu_{Z,k} \mathbb{E}(g''_k(Z_k,
    Y)) \}, \end{aligned} \text{(A.68)}$


    which yields the first equality. Next, by the tower property of expectation, the
    final expression in (4.9) can be written as


    $\begin{aligned} \mathbb{E}\left( \frac{\mathbb{E}(Z \mid Z_k, Y) - \mathbb{E}(Z
    \mid Z_k)}{\text{Var}(Z \mid Z_k)} g_k(Z_k, Y) \right) \\ = \mathbb{E}\left( \frac{Z
    - \mathbb{E}(Z \mid Z_k)}{\text{Var}(Z \mid Z_k)} \tilde{g}_k(Z, Z_k, \bar{\varepsilon})
    \right). \end{aligned}$


    Since $Z$ is conditionally Gaussian given $Z_k$ and $\bar{\varepsilon}$ is independent
    of $(Z, Z_k)$, a further (conditional) application of Stein''s lemma yields


    $\begin{aligned} \mathbb{E}\left( \frac{Z - \mathbb{E}(Z \mid Z_k)}{\text{Var}(Z
    \mid Z_k)} \tilde{g}_k(Z, Z_k, \bar{\varepsilon}) \Bigg| Z_k \right) \\ = \frac{\mathbb{E}\{(Z
    - \mathbb{E}(Z \mid Z_k)) \tilde{g}_k(Z, Z_k, \bar{\varepsilon}) \mid Z_k\}}{\text{Var}(Z
    \mid Z_k)} = \mathbb{E}(\partial_1 \tilde{g}_k(Z, Z_k, \bar{\varepsilon}) \mid
    Z_k), \end{aligned}$


    so by taking expectations, we obtain the second identity for $\mu_{k+1}$.'
