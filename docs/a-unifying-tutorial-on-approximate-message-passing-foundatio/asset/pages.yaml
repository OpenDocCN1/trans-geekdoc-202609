  md: '# 4.2 Choosing the Functions $f_k, g_k$, and Inference for $\beta$


    Asymptotic estimation error: Since the functions $f_k$ in (4.4) are Lipschitz
    by assumption, it follows as in Corollary 3.2 that in the setting of Theorem 4.2
    above, the asymptotic estimation error of $\hat{\beta}^k$ with respect to any
    loss function $\psi \in \text{PL}_2(r)$ is given by


    $$ \frac{1}{p} \sum_{j=1}^p \psi(\hat{\beta}_j^k, \beta_j) \xrightarrow{\mathcal{L}}
    \mathbb{E}\{\psi(f_k(\mu_k\bar{\beta} + \sigma_k G_k), \bar{\beta})\} $$ (4.15)


    for each $k \in \mathbb{N}$, as $n, p \to \infty$ with $n/p \to \delta$. In particular,
    taking $\psi(x, y) = |x - y|^q$ for $q \in [1, r]$, we obtain the asymptotic normalised
    $\ell_q$ error c-\(\lim_{p \to \infty} p^{-1} \|\hat{\beta}^k - \beta\|_q = \mathbb{E}\{(f_k(\mu_k\bar{\beta}
    + \sigma_k G_k) - \bar{\beta})^q\}^{1/q}\).


    Bayes-GAMP: If the limiting prior distribution $\pi_{\bar{\beta}}$, the limiting
    noise distribution $P_{\bar{\varepsilon}}$ and the initial $\Sigma_0 \in \mathbb{R}^{2\times
    2}$ are known, then guided by Lemma 3.7, we can proceed as in Section 3.3 and
    choose $f_k, g_k$ in (4.4) so as to maximise the effective signal-to-noise ratios
    $\rho_k = (\mu_k/\sigma_k)^2$ and $\rho_{Z,k} := (\mu_{Z,k}/\sigma_{Z,k})^2$ for
    each $k$.


    Specifically, given the matrix $\Sigma \equiv \Sigma_k \in \mathbb{R}^{2\times
    2}$ in (4.7) for some $k \in \mathbb{N}_0$, we can obtain $\mu_{Z,k}, \sigma_{Z,k}$
    from (4.8); conversely, given $\mu_{Z,k}, \sigma_{Z,k}$, we can recover $\Sigma$
    since $\Sigma_{11} = \delta^{-1} \mathbb{E}(\bar{\beta}^2)$ is known, and (4.8)
    yields $\Sigma_{21} = \Sigma_{11} \mu_{Z,k}$ and $\Sigma_{22} = \sigma_{Z,k}^2
    + \Sigma_{11} \mu_{Z,k}^2$. Now take $(Z, Z_k) \sim N_2(0, \Sigma_k)$ to be independent
    of $\bar{\varepsilon} \sim P_{\bar{\varepsilon}}$, and let $Y = h(Z, \bar{\varepsilon})$,
    so that $Y$ and $Z_k$ are conditionally independent given $Z$. Based on the joint
    distribution of $(Z, Z_k, Y)$, let $g_k^*: \mathbb{R}^2 \to \mathbb{R}$ be a measurable
    function satisfying


    $$ g_k^*(Z_k, Y) = \frac{\mathbb{E}(Z | Z_k, Y) - \mathbb{E}(Z | Z_k)}{\text{Var}(Z
    | Z_k)}, $$ (4.16)


    where $\mathbb{E}(Z | Z_k) = m_k Z_k$ with


    $$ m_k := \frac{\Sigma_{21}}{\Sigma_{22}} = \frac{\mu_{Z,k}}{\sigma_{Z,k}^2} \text{Var}(Z
    | Z_k), $$


    $$ \text{Var}(Z | Z_k) = \Sigma_{11} - \frac{\Sigma_{21}^2}{\Sigma_{22}} = \frac{\Sigma_{11}
    \sigma_{Z,k}^2}{\sigma_{Z,k}^2 + \Sigma_{11} \mu_{Z,k}^2} = \left( \frac{\delta}{\mathbb{E}(\bar{\beta}^2)}
    + \rho_{Z,k} \right)^{-1}. $$


    Then by (4.6), (4.9) and the Cauchy–Schwarz inequality, we have


    $$ \rho_{k+1} = \frac{\mu_{k+1}^2}{\sigma_{k+1}^2} = \frac{\mathbb{E}(g_k^*(Z_k,
    Y) g_k(Z_k, Y))^2}{\mathbb{E}(g_k(Z_k, Y)^2)} \le \mathbb{E}(g_k^*(Z_k, Y)^2),
    $$


    with equality when $g_k$ is a (non-zero) scalar multiple of $g_k^*$.'
