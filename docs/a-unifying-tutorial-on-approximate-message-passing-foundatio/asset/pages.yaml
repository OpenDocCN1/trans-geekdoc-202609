    # 4.5 AMP for the Lasso


    In high-dimensional linear models $y = X\beta + \varepsilon$, the Lasso (Tibshirani,
    1996) is a popular method for obtaining sparse estimates of $\beta \in \mathbb{R}^p$
    via $\ell_1$-penalised least squares. Given $X \in \mathbb{R}^{n \times p}, y
    \in \mathbb{R}^n$ and a regularisation parameter $\lambda > 0$, the Lasso estimator
    is defined by


    \(\hat{\beta}^{\mathrm{L}, \lambda} \in \operatorname{argmin}_{\hat{\beta} \in
    \mathbb{R}^p} \left\{ \frac{1}{2} \| y - X \hat{\beta} \|^2 + \lambda \| \hat{\beta}
    \|_1 \right\}.\) (4.38)


    In the random design setting of (G0) and (G1), Bayati and Montanari (2012) derived
    an exact expression (4.46) for the asymptotic estimation error of $\hat{\beta}^{\mathrm{L},
    \lambda}$ as \(n, p \to \infty\) with \(n/p \to \delta \in (0, \infty)\). By following
    the GAMP recipe in Section 4.4, we will show how to design and calibrate an AMP
    iteration that is central to the proof of their main result (Theorem 4.5 below).


    To begin with, note that $\hat{\beta}^{\mathrm{L}, \lambda}$ solves a convex optimisation
    problem of the form (4.22) with \(\ell: (u, v) \mapsto (u-v)^2/2\) and \(J: x
    \mapsto \lambda|x|\). For \(k \in \mathbb{N}_0\), the corresponding \(\bar{g}_k,
