  md: 'Note that since \(\ell\) and \(J\) are assumed to be convex in their first
    arguments, \(\bar{g}_k(u, v)\) and \(f_{k+1}(w)\) are well-defined as unique minima
    of strongly convex functions. The pertinence of this specific choice of \(g_k,
    f_{k+1}\) will become apparent through Proposition 4.4 below and its proof. At
    this point, it is helpful to recall that for a convex function \(\mathrm{M}: \mathbb{R}
    \rightarrow \mathbb{R}\) and \(\eta > 0\), the associated *proximal operator*
    \(\text{prox}_{\eta \mathrm{M}}: \mathbb{R} \rightarrow \mathbb{R}\) is given
    by


    ```

    \(\text{prox}_{\eta \mathrm{M}}(z) := \underset{t \in \mathbb{R}}{\mathrm{argmin}}
    \left\{ \eta \mathrm{M}(t) + \frac{1}{2}(t - z)^2 \right\}, \quad (4.25)\)

    ```


    and moreover that \(\text{prox}_{\eta \mathrm{M}}\) is always non-decreasing and
    1-Lipschitz (cf. Parikh and Boyd, 2013, Sections 2.3 and 3.1). We see that \(\bar{g}_k(u,
    v) = \text{prox}_{b_k \ell(\cdot, v)}(u)\) and \(f_{k+1}(w) = \text{prox}_{-J/\bar{c}_k}(-w/\bar{c}_k)\)
    for \(u, v, w \in \mathbb{R}\), so \(\bar{g}_k, g_k, f_{k+1}\) are all Lipschitz
    with constants \(1, \bar{b}_k^{-1}\) and \(|\bar{c}_k|^{-1}\) respectively, and
    hence weakly differentiable with respect to their first arguments. Writing \(\bar{g}''_k,
    g''_k, f''_{k+1}\) for the corresponding weak derivatives, we have


    ```

    \(f''_{k+1}(w) \ge 0, \quad \bar{g}''_k(u, v) \le 1 \quad \text{and hence} \quad
    g''_k(u, v) \le 0 \quad (4.26)\)

    ```


    for all \(u, v, w\). If in addition \(\ell\) and \(J\) are twice continuously
    differentiable, then \(J''(f_{k+1}(w)) - (\bar{c}_k f_{k+1}(w) + w) = 0\) for
    each \(w\), so it follows from the implicit function theorem that


    ```

    \(f''_{k+1}(w) = (J''''(f_{k+1}(w)) - \bar{c}_k)^{-1} \quad \text{and similarly}
    \quad \bar{g}''_k(u, v) = (\bar{b}_k \ell''''(f_{k+1}(w)) + 1)^{-1} \quad (4.27)\)

    ```


    for all \(u, v, w\), where \(\ell''''\) denotes the second partial derivative
    of \(\ell\) with respect to its first argument.


