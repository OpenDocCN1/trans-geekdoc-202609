- pgno: 10
  md: '# # A Unifying Tutorial on Approximate Message Passing


    Oliver Y. Feng<sup>1</sup>, Ramji Venkataramanan<sup>2</sup>, Cynthia Rush<sup>3</sup>
    and Richard J. Samworth<sup>1</sup>


    <sup>1</sup>Statistical Laboratory, University of Cambridge, UK; o.feng@statslab.cam.ac.uk;
    r.samworth@statslab.cam.ac.uk

    <sup>2</sup>Department of Engineering, University of Cambridge, UK; ramji.v@eng.cam.ac.uk

    <sup>3</sup>Department of Statistics, Columbia University, USA; cgr2130@columbia.edu


    # ## ABSTRACT


    Over the last decade or so, Approximate Message Passing (AMP) algorithms have
    become extremely popular in various structured high-dimensional statistical problems.
    Although the origins of these techniques can be traced back to notions of belief
    propagation in the statistical physics literature, our goals in this work are
    to present the main ideas of AMP from a statistical perspective and to illustrate
    the power and flexibility of the AMP framework. Along the way, we strengthen and
    unify many of the results in the existing literature.'
  merge: -1
  img_proc: true
