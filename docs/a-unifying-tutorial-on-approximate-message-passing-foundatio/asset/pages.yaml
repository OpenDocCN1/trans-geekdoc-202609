  md: 'for an accessible summary of this line of work, which reveals that in the limiting
    regime where $\|v\|_n$ converges to 1, the eigenstructure of $A \equiv A(n)$ for
    large $n$ exhibits two different types of qualitative behaviour depending on whether
    $\lambda \le 1$ or $\lambda > 1$. In particular, when $n \to \infty$, it follows
    from the concentration results in Knowles and Yin (2013, Theorems 2.7 and 6.3)
    that


    ```

    $$

    \lambda_1(A) \xrightarrow{c} \begin{cases} \lambda + \lambda^{-1} > 2 & \text{if
    } \lambda > 1 \\ 2 & \text{if } \lambda \in (0, 1], \end{cases}

    \\

    \frac{|\langle \hat{\varphi}, v \rangle|}{\|\hat{\varphi}\| \|v\|} \xrightarrow{c}
    \begin{cases} \sqrt{1 - \lambda^{-2}} & \text{if } \lambda > 1 \\ 0 & \text{if
    } \lambda \in (0, 1]; \end{cases}

    $$

    (3.2)

    ```


    see also Peng (2012, Theorem 3.1) for the former and Corollary 3.4 below for the
    latter.


    In the "supercritical" phase when $\lambda > 1$, the effect of the spike $v$ can
    be seen in the limiting expressions above: with high probability, $\hat{\varphi}$
    is at least partially aligned with $v$ (although it does not estimate $v$ consistently)
    and $\lambda_1(A)$ is an outlier that is separated from the "bulk" of the spectrum
    of $A$. Indeed, the remaining eigenvalues of $A$ are asymptotically distributed
    according to the Wigner semicircle law on $[-2, 2]$, and it can be shown that
    the second-largest eigenvalue $\lambda_2(A)$ of $A \equiv A(n)$ satisfies $\lambda_2(A)
    \xrightarrow{c} 2$ as $n \to \infty$, so the limiting spectral gap $\lambda_1(A)
    - \lambda_2(A)$ is strictly positive.


    On the other hand, in the "subcritical" phase when $\lambda \le 1$, the noise
    matrix $W$ obscures the signal in (3.1) to such an extent that $\hat{\varphi}$
    is asymptotically uninformative as an estimator of $v$, as evidenced by the asymptotic
    orthogonality in (3.2), and $\lambda_1(A)$ remains attached to the bulk of the
    eigenvalues of $A$. In this low signal-to-noise regime, the limits for $\lambda_1(A)$
    and $\hat{\varphi}$ in (3.2) are the same as for the leading eigenvalue and eigenvector
    of $W$ respectively.


    A further limitation of the classical spectral estimator $\hat{\varphi}$ is that
    it is unable to exploit any additional information about the structure of $v$
    that may be relevant for inference. For example, in some matrix estimation problems
    such as hidden clique detection and non-negative or sparse principal component
    analysis, there are natural constraints'
