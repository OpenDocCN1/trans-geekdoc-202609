    linear model, phase retrieval (where $y_i = (x_i^\top \beta)^2 + \varepsilon_i$
    for $1 \le i \le n$), and logistic, binomial and Poisson regression (e.g., Agresti,
    2015; McCullagh and Nelder, 1989). Sometimes, “GLM” is used as an umbrella term
    to describe more general models of the form (4.1, 4.2).


    Likelihood-based inference for $\beta$ in (4.2, 4.3) is justified by classical
    asymptotic theory when $p$ is fixed and $n \to \infty$, or when $p$ grows sufficiently
    slowly with $n$ (Portnoy, 1984, 1985, 1988). However, in modern high-dimensional
    regimes where $n, p \to \infty$ and the aspect ratio $n/p$ of the design matrix
    $X$ is bounded, different tools are needed to construct and analyse estimators
    of $\beta$, and it is in this context that we introduce the GAMP paradigm below.


    # ## 4.1 Master Theorem for GAMP


    The *generalised AMP* (GAMP) *algorithm* proposed by Rangan (2011) iteratively
    produces estimates $\hat{\beta}^k, \theta^k$ of $\beta \in \mathbb{R}^p$ and $\theta
    := X\beta \in \mathbb{R}^n$ respectively in (4.1), via update steps of the following
    form: given $\hat{\tau}^{-1} := 0 \in \mathbb{R}^n$, $b_0 \in \mathbb{R}$ and
    an initialiser $\hat{\beta}^0 \in \mathbb{R}^p$, recursively define


    $$\begin{aligned} \theta^k &:= X\hat{\beta}^k - b_k \hat{\tau}^{k-1}, & \hat{r}^k
    &:= g_k(\theta^k, y), \\ c_k &:= n^{-1} \sum_{i=1}^n g''_k(\theta_i^k, y_i), &
    \beta^{k+1} &:= X^\top \hat{r}^k - c_k \hat{\beta}^k, \\ \hat{\beta}^{k+1} &:=
    f_{k+1}(\beta^{k+1}), & b_{k+1} &:= n^{-1} \sum_{j=1}^p f''_{k+1}(\beta_j^{k+1})
    \end{aligned}$$ (4.4)'
