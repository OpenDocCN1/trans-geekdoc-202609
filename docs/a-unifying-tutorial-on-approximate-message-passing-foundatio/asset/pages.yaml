    \(g_k\) is Lipschitz and \(\mathbb{E}(V^2) = \mathbb{E}(G^2) = 1\), we indeed
    have \(\mu_k \in \mathbb{R}\) and \(\sigma_k \in [0, \infty)\) for all \(k\) by
    induction: we will see below that these represent the *effective signal strength*
    and *effective noise level* respectively at iteration \(k\).


