    + \sum_{j=1}^p J(\tilde{\beta}_j) + s^\top (\tilde{\theta} - X \tilde{\beta})

    ```


    for \(\tilde{\beta} \in \mathbb{R}^p\) and \(\tilde{\theta}, s \in \mathbb{R}^n\).
    Then the iterates in (4.29) satisfy


    ```

