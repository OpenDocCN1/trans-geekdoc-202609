  md: 'In summary, the state evolution characterisation of the AMP algorithm (3.3)
    allows us to choose the functions \(g_k\) in a principled way, depending on the
    prior information available about the signal \(v\). A poor choice of \((g_k)\)
    will lead to low effective signal-to-noise ratios \(\rho_k = (\mu_k/\sigma_k)^2\),
    but the asymptotic convergence results (3.8)-(3.11) will continue to hold provided
    that the hypotheses of Theorem 3.1 or 3.5 are satisfied.


    A key strength of the AMP framework is that it gives us the flexibility to choose
    non-linear functions \(g_k\), such as the soft-thresholding functions above. Note
    that the MMSE denoising functions \(g_k^*\) in (3.16) are non-linear except in
    special cases (such as when \(V\) is Gaussian). Nevertheless, iterations with
    linear \(g_k\) can sometimes be useful as a theoretical device for obtaining distributional
    information about spectral estimators, as the following example shows; see also
    Mondelli and Venkataramanan (2020) and Mondelli et al. (2021).


    **Connection with the power method**: Suppose that we initialise (3.3) with \(\hat{v}^0
    \equiv \hat{v}^0(n) := \mu_0 v + \xi\), where \(\mu_0 \neq 0\) and \(\xi \equiv
    \xi(n) \sim N_n(0, I_n)\), and define


