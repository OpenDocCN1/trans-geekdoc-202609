- pgno: 12
  md: '# Introduction


    Approximate Message Passing (AMP) refers to a class of iterative algorithms that
    have been successfully applied to a number of statistical estimation tasks such
    as linear regression (Bayati and Montanari, 2011; Donoho et al., 2009; Krzakala
    et al., 2012), generalised linear models (Mondelli and Venkataramanan, 2020; Rangan,
    2011; Schniter and Rangan, 2014) and low-rank matrix estimation (Deshpande and
    Montanari, 2014; Deshpande et al., 2016; Kabashima et al., 2016; Lesieur et al.,
    2017; Matsushita and Tanaka, 2013; Montanari and Richard, 2016; Montanari and
    Venkataramanan, 2021; Rangan and Fletcher, 2018). Moreover, these techniques are
    also popular and practical in a variety of engineering and computer science applications
    such as imaging (Fletcher and Rangan, 2014; Metzler et al., 2017; Vila et al.,
    2015), communications (Barbier and Krzakala, 2017; Jeon et al., 2015; Rush et
    al., 2017; Schniter, 2011) and machine learning (El Alaoui et al., 2018; Emami
    et al., 2020; Manoel et al., 2017; Pandit et al., 2020; Yang, 2019). AMP algorithms
    have two features that make them particularly attractive. First, they can easily
    be tailored to take advantage of prior information on the structure of the signal,
    such as sparsity or other constraints. Second, under suitable assumptions on a
    design or data matrix, AMP'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'theory provides precise asymptotic guarantees for statistical procedures in
    the high-dimensional regime where the ratio of the number of observations _n_
    to dimensions _p_ converges to a constant (Bayati and Montanari, 2012; Donoho
    and Montanari, 2016; Donoho et al., 2013; Sur et al., 2017). More generally, AMP
    has been used to obtain lower bounds on the estimation error of first-order methods
    (Celentano et al., 2020). In generalised linear models, low-rank matrix estimation
    and neural network models, it also plays a fundamental role in understanding the
    performance gap between information-theoretically optimal and computationally
    feasible estimators (Aubin et al. 2019. 2020: Barbier et al., 2019: Lelarge and
    Miolane, 2019: Reeves and Pfister, 2019). In these settings, it is conjectured
    that AMP achieves the optimal asymptotic estimation error among all polynomial-time
    algorithms (cf. Celentano and Montanari, 2022).


    The purpose of this tutorial is to give a comprehensive and rigorous introduction
    to what AMP can offer, as well as to unify and formalise the core concepts within
    the large body of recent work in the area. We mention here that many of the original
    ideas of AMP were developed in the physics and engineering literature, and involved
    notions such as “loopy belief propagation” (e.g., Koller and Friedman, 2009, Section
    11.3) and the “replica method” (e.g., Guo and Verdú, 2005; Krzakala et al., 2012:
    Mézard and Montanari, 2009; Tanaka, 2002; Rangan et al., 2009). Our starting point,
    however, will be an abstract AMP recursion, whose form depends on whether or not
    the data matrix is symmetric; we will study the symmetric case in detail, and
    then present the asymmetric version, which can be handled via a reduction argument.
    The striking and crucial feature of this recursion is that when the dimension
    is large, the empirical distribution of the coordinates of each iterate is approximately
    Gaussian, with limiting variance given by a scalar iteration called “state evolution”.


    Rigorous formulations of the key AMP property are given in Theorems 2.1 and 2.3
    (for the symmetric case) and Theorem 2.5 (for the asymmetric case), which can
    be found in Sections 2.1 and 2.2 respectively. Here, we both strengthen earlier
    related results, and seek to make the underlying arguments more transparent. These
    “master theorems”, which can be viewed as asymptotic results on Gaussian random
    matrices.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'can be adapted to analyse variants of the original AMP recursion that are geared
    towards more statistical problems. In this aspect, we focus on two canonical statistical
    settings, namely estimation of low-rank matrices in Section 3, and estimation
    in generalised linear models (GLMs) in Section 4. The former encompasses Sparse
    Principal Component Analysis (Deshpande and Montanari, 2014; Gataric et al., 2020;
    Jolliffe et al., 2003; Wang et al., 2016; Zou et al., 2006), submatrix detection
    (Ma and Wu, 2015), hidden clique detection (Alon et al., 1998; Deshpande and Montanari,
    2015), spectral clustering (von Luxburg, 2007), matrix completion (Candès and
    Recht, 2009; Zhu et al., 2019), topic modelling (Blei et al., 2003) and collaborative
    filtering (Su and Khoshgoftaar, 2009). The latter provides a holistic approach
    to studying a suite of popular modern statistical methods, including penalised
    M-estimators such as the Lasso (Tibshirani, 1996) and SLOPE (Bogdan et al., 2015),
    as well as more traditional techniques such as logistic regression. A novel aspect
    of our presentation in Section 4 is that we formalise the connection between AMP
    and a broad class of convex optimisation problems, and then show how to systematically
    derive exact expressions for the asymptotic risk of estimators in GLMs. We expect
    that our general recipe can be applied to a wider class of GLMs than have been
    studied in the AMP literature to date.


    To preview the statistical content in this tutorial and highlight some recurring
    themes, we now discuss two prototypical applications of AMP that form the basis
    of Sections 3 and 4 respectively. First, suppose that we wish to estimate an unknown
    signal \( v \in \mathbb{R}^n \) based on an observation


    ```

    \( A = \frac{\lambda}{n} vv^\top + W, \)

    ```


    where \( \lambda > 0 \) is fixed and \( W \in \mathbb{R}^{n \times n} \) is a
    symmetric Gaussian noise matrix. In this so-called spiked Wigner model (see Section
    3.1 and the references therein), a popular and well-studied estimator of \( v
    \) is the leading eigenvector \( \hat{\varphi} \) of \( A \), which can be approximated
    via the power method, with iterates


    ```

    \( v^{k+1} = \frac{Av^k}{\|Av^k\|}. \)

    ```'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'An AMP algorithm in this context can be interpreted as a generalised power
    method that produces a sequence of estimates \(\hat{v}^k\) of \(v\) via iterative
    updates of the form


    ```

    \(\hat{v}^k = g_k(v^k), \qquad v^{k+1} = A\hat{v}^k - b_k\hat{v}^{k-1}\)

    ```


    for \(k \in \mathbb{N}_0\), where we emphasise the following two characteristic
    features:


    +   (i) Each “denoising” function \(g_k : \mathbb{R} \to \mathbb{R}\) is applied
    componentwise to vectors, and can be chosen appropriately to exploit different
    types of prior information about the structure of \(v\) (e.g., to encourage \(\hat{v}^k\)
    to be sparse).


    +   (ii) In the “memory” term \(-b_k\hat{v}^{k-1}\), which is called an “Onsager”
    correction in the AMP literature (e.g., Bayati and Montanari, 2011; Donoho _et
    al._, 2009), the scalar \(b_k\) is defined as a specific function of \(v^k\) to
    ensure that the iterates \(v^{k+1}\) have desirable statistical properties; see
    (3.3).


    One way to incorporate additional structural information on \(v\) into the spiked
    model is to assume that its entries are drawn independently from some prior distribution
    \(\pi\) on \(\mathbb{R}\); for example, we can enforce sparsity through priors
    that place strictly positive mass at 0. Then under appropriate conditions, AMP
    theory guarantees that, for each \(k\), the components of the estimate \(\hat{v}^k\)
    have approximately the same empirical distribution as those of \(g_k(\mu_k v +
    \sigma_k\xi)\); here, \(\xi \sim N_n(0, I_n)\) is a “noise” vector that is independent
    of the signal \(v \in \mathbb{R}^n\), and the “signal” and “noise” parameters
    \(\mu_k \in \mathbb{R}, \sigma_k > 0\) are determined by a scalar state evolution
    recursion that depends on \((g_k)\) and the prior distribution \(\pi\); see (3.6).
    This distributional characterisation effectively reduces the analysis of the high-dimensional
    \(\hat{v}^k\) to a much simpler univariate denoising problem, where the aim is
    to reconstruct \(V \sim \pi\) based on a single corrupted observation of the form
    \(\mu_k V + \sigma_k G\) with \(G \sim N(0, 1)\) representing independent Gaussian
    noise. The functions \(g_k\) can then be chosen in such a way that the “effective
    signal-to-noise ratios” \((\mu_k/\sigma_k)^2\) are large and \(g_k(\mu_k V + \sigma_k
    G)\) accurately estimates \(V\). This ensures that the resulting AMP estimates
    \(\hat{v}^k = g_k(v^k)\) have low asymptotic estimation error as \(n \to \infty\).'
  merge: -1
  img_proc: true
- pgno: 16
  md: '![](img/08301bfcee7cd5d250121110618787f6_16_0.png)


    ![](img/08301bfcee7cd5d250121110618787f6_16_1.png)


    Figure 1.1: Asymptotic mean-squared error plots for estimation of a signal $v
    \in \mathbb{R}^n$ with i.i.d. $U\{-1, 1\}$ entries in the rank-one spiked model,
    based on an AMP algorithm with denoising functions $g_k: x \mapsto \tanh(\mu_k
    x / \sigma_k^2)$ and spectral initialisation ($v^0 = \hat{\varphi}$ and $\hat{v}^{-1}
    = \lambda^{-1} \hat{\varphi}$ with $\|\hat{\varphi}\| = \sqrt{n\lambda^2(\lambda^2
    - 1)_+}$). See Sections 3.2-3.3, where we also discuss how to consistently estimate
    $\lambda$ when it is unknown (Remark 3.12). Left: Plot of $\text{AMSE}_k(\lambda)
    := \lim_{n \to \infty} \|\hat{v}^k - v\|^2/n$ against the iteration number $k$
    for the AMP estimates $\hat{v}^k \equiv \hat{v}_k^n(\lambda)$, when $\lambda =
    1.7$. $\text{AMSE}_k(\lambda)$ decreases monotonically to some $\text{AMSE}_\infty(\lambda)$
    as $k \to \infty$; see Theorem 3.10(c). Right: Plots of $\text{AMSE}_{-1}(\lambda)
    = 1 \wedge \lambda^{-2}$ for the pilot spectral estimator $\hat{v}^{-1}$ and $\text{AMSE}_\infty(\lambda)$
    for AMP, with $\lambda \in [0, 3]$. The spectral estimator undergoes the so-called
    BBP phase transition at $\lambda = 1$; see Section 3.1.


    For instance, suppose that the entries of $v$ are drawn uniformly at random from
    $\{-1, 1\}$. Then provided we initialise the AMP algorithm with $v^0 = \hat{\varphi}$
    and $\hat{v}^{-1} = \lambda^{-1} \hat{\varphi}$, where $\|\hat{\varphi}\| = \sqrt{n\lambda^2(\lambda^2
    - 1)_+}$, it turns out that the asymptotic mean squared error (MSE) of $\hat{v}^k$
    is minimised by choosing $g_k$ to be the function $x \mapsto \tanh(\mu_k x / \sigma_k^2)$;
    see Section 3.3. Figure 1.1 illustrates that the limiting MSE of the AMP estimates
    $\hat{v}^k$ decreases with the iteration number $k$, and in particular that they
    improve on the pilot spectral estimator $\hat{v}^{-1}$ (which is agnostic to the
    structure of $v$).


    As a second example, consider the linear model $y = X\beta + \varepsilon$, where
    $\beta \in \mathbb{R}^p$ is the target of inference, $\varepsilon \in \mathbb{R}^n$
    is a noise vector, and $X \in \mathbb{R}^{n \times p}$ is a random design matrix
    with independent $N(0, 1/n)$ entries. In high-dimensional regimes where $p$ is
    comparable in magnitude to, or even much larger than $n$, a popular (sparse) estimator
    is the Lasso (Tibshirani, 1996), which for $\lambda > 0$ is defined by


    ```

    \hat{\beta}^{\text{L}, \lambda} \in \underset{\beta \in \mathbb{R}^p}{\text{argmin}}
    \left\{ \frac{1}{2} \|y - X\tilde{\beta}\|^2 + \lambda \|\tilde{\beta}\|_1 \right\}.

    ```'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'In the literature on high-dimensional estimation, upper bounds on the prediction
    and estimation error of the Lasso have been obtained under suitable conditions
    on the design matrix $X$, such as the restricted isometry property or compatibility
    conditions (e.g., Bühlmann and van de Geer, 2011). AMP offers complementary guarantees
    by providing exact formulae for the asymptotic risk in the “large system limit”
    where $n, p \to \infty$ with $n/p \to \delta \in (0, \infty)$, and with the components
    of $\beta$ drawn independently from a prior distribution on $\mathbb{R}$. To motivate
    the form of the AMP algorithm in this setting, first consider the iterative soft
    thresholding algorithm (ISTA) for solving the Lasso optimisation problem, whose
    update steps can be written as


    ```

    $\hat{r}^k = y - X\hat{\beta}^k, \quad \hat{\beta}^{k+1} = \text{ST}_{\lambda
    \eta_k}(\hat{\beta}^k + \eta_k X^\top \hat{r}^k) \quad \text{for } k \in \mathbb{N}_0;
    \quad (1.1)$

    ```


    here, $\hat{r}^k$ is the current residual, $\eta_k > 0$ is a deterministic step
    size, and for $t > 0$, the soft-thresholding function $\text{ST}_t: w \mapsto
    \text{sgn}(w)(|w| - t)_+$ is applied componentwise to vectors. This is an instance
    of the general-purpose proximal gradient method (Parikh and Boyd, 2013, Sections
    4.2 and 4.3). An “accelerated” version of (1.1) called FISTA (Beck and Teboulle,
    2009) bears a closer resemblance to an AMP algorithm, where the iterates of the
    latter are given by


    ```

    $\hat{r}^k = y - X\hat{\beta}^k + \frac{\|\hat{\beta}^k\|_0}{n} \hat{r}^{k-1},
    \quad \hat{\beta}^{k+1} = \text{ST}_{t_{k+1}}(\hat{\beta}^k + X^\top \hat{r}^k)
    \quad \text{for } k \in \mathbb{N}_0. \quad (1.2)$

    ```


    Here, each $t_k > 0$ is a deterministic threshold and $\|\hat{\beta}^k\|_0$ denotes
    the number of non-zero entries of $\hat{\beta}^k \in \mathbb{R}^p$. By comparison
    with (1.1), we observe that $\hat{r}^k$ in (1.2) is a corrected residual, whose
    definition includes an additional memory term that is crucial for ensuring that
