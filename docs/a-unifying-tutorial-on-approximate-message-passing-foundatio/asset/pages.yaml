  md: '# # 4.1. Master Theorem for GAMP


    We remark here that while (G2) is in general a stronger requirement than (B2),
    both (G2) and (G3) are implied by (G1) if for some fixed \(c \in \mathbb{R}\)
    we have \(\tilde{\beta}^0 \equiv \hat{\beta}^0(n) = c 1_p\) for all \(n\). As
    in Section 3, constraints on \(\beta \equiv \beta(n)\) such as sparsity or entrywise
    non-negativity will be reflected in the form of the “limiting prior distribution”
    \(\pi_{\bar{\beta}}\). Note that


    \((\Sigma_0)_{11} = \text{c-}\lim_{n \to \infty} \left( \frac{p}{n} \cdot \frac{\|\beta\|^2}{p}
    \right) = \frac{\mathbb{E}(\tilde{\beta}^2)}{\delta} > 0 \quad (4.5)\)


    by (G1) and (G2). Also, the condition on \(\varepsilon \equiv \varepsilon(n)\)
    in (G1) is satisfied if \(\varepsilon_1, \dots, \varepsilon_n \stackrel{\text{iid}}{\sim}
    P_{\bar{\varepsilon}}\) for each \(n\).


    **State evolution**: With \(\Sigma_0\) as in (G2), the state evolution parameters
    \((\mu_k \in \mathbb{R}, \sigma_k \in [0, \infty), \Sigma_k \in \mathbb{R}^{2
    \times 2}: k \in \mathbb{N})\) are recursively defined by


    \(\mu_{k+1} := \mathbb{E}(\partial_z \tilde{g}_k(Z, Z_k, \bar{\varepsilon})),
    \quad \sigma_{k+1}^2 := \mathbb{E}(\tilde{g}_k(Z, Z_k, \bar{\varepsilon})^2) =
    \mathbb{E}(g_k(Z_k, Y)^2), \quad (4.6)\)


    \(\Sigma_{k+1} := \frac{1}{\delta} \begin{pmatrix} \mathbb{E}(\tilde{\beta}^2)
    & \mathbb{E}\{\bar{\beta} f_{k+1}(\mu_{k+1}\bar{\beta} + \sigma_{k+1}G_{k+1})\}
    \\ \mathbb{E}\{\bar{\beta} f_{k+1}(\mu_{k+1}\bar{\beta} + \sigma_{k+1}G_{k+1})\}
    & \mathbb{E}\{f_{k+1}(\mu_{k+1}\bar{\beta} + \sigma_{k+1}G_{k+1})^2\} \end{pmatrix}
    \quad (4.7)\)


    for \(k \in \mathbb{N}_0\), where we take \((Z, Z_k) \sim N_2(0, \Sigma_k)\) to
    be independent of \(\bar{\varepsilon} \sim P_{\bar{\varepsilon}}\), define \(Y
