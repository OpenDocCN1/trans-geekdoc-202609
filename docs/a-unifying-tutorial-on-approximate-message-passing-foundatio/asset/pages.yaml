  md: 'We conclude this subsection with some straightforward results on pseudo-Lipschitz
    functions.


    # **Lemma B.22.** For \(D \in \mathbb{N}\), if \(f \in \text{PL}_D(r)\) and \(g
    \in \text{PL}_D(s)\) for some \(r, s \ge 1\), then \(fg \in \text{PL}_D(r + s)\)
    and \(|f|^p \in \text{PL}_D(pr)\) for all \(p \ge 1\).


    **Proof.** There exists \(L > 0\) such that \(f \in \text{PL}_D(r, L)\) and \(g
    \in \text{PL}_D(s, L)\). Letting \(L'' := L \vee |f(0)| \vee |g(0)|\), we have


    ```

    \(|f(x)| \le |f(0)| + |f(x) - f(0)| \le L''(1 + \|x\| + \|x\|^r) \le 2L''(1 +
    \|x\|^r)\)

    \(|g(x)| \le |g(0)| + |g(x) - g(0)| \le L''(1 + \|x\| + \|x\|^s) \le 2L''(1 +
    \|x\|^s)\)

    (B.19)

    ```


    for all \(x \in \mathbb{R}^D\). Therefore, fixing arbitrary \(x, y \in \mathbb{R}^D\)
    and setting \(a := \|x\| \vee \|y\|\), we see that


    ```

    \(|f(x)g(x) - f(y)g(y)|\)

    \(\le |f(x)| \, |g(x) - g(y)| + |g(x)| \, |f(x) - f(y)|\)

    \(\le 2L'' L \|x - y\| \{ (1 + \|x\|^r)(1 + \|x\|^{s-1} + \|y\|^{s-1})\)

    \(+ (1 + \|x\|^s)(1 + \|x\|^{r-1} + \|y\|^{r-1}) \}\)

    \(\le 2L'' L \|x - y\| (2 + 2a^{r-1} + a^r + 2a^{s-1} + a^s + 4a^{r+s-1})\)

    \(\le 20 L'' L \|x - y\| (1 + a^{r+s-1})\)

    \(\le 20 L'' L \|x - y\| (1 + \|x\|^{r+s-1} + \|y\|^{r+s-1}).\)

    ```


    This shows that \(fg \in \text{PL}_D(r + s)\). For \(p \ge 1\), we have \((a +
    b)^{p-1} \le (1 \vee 2^{p-2})(a^{p-1} + b^{p-1})\) for \(a, b \ge 0\), and it
    follows from Lemma B.20 and (B.19) that


    ```

    \(||f(x)|^p - |f(y)|^p|\)

    \(\le \frac{p \vee 2}{2} |f(x) - f(y)| (|f(x)|^{p-1} + |f(y)|^{p-1})\)

    \(\le \frac{L(2L'')^{p-1}(p \vee 2)}{2} \|x - y\| (1 + \|x\|^r + \|y\|^r)\)

    \(\cdot ((1 + \|x\|^r)^{p-1} + (1 + \|y\|^r)^{p-1})\)

    \(\lesssim_p L(L'')^{p-1} \|x - y\| (1 + \|x\|^r + \|y\|^r)(1 + \|x\|^{(p-1)r}
    + \|y\|^{(p-1)r})\)

    \(\lesssim_p L(L'')^{p-1} \|x - y\| (1 + \|x\|^{pr} + \|y\|^{pr})\)

    ```


    for all \(x, y \in \mathbb{R}^D\). Thus, \(|f|^p \in \text{PL}_D(pr)\), as required.'
