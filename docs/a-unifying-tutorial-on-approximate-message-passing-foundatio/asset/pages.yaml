    is unique up to \( \mathsf{P}|_\mathcal{G}\)-almost sure equivalence. For \( F
    \in \mathcal{F} \), we also write \( \mathsf{P}(F | \mathcal{G}) := \mathsf{E}(\mathbb{1}_F
    | \mathcal{G}) \).


    If \( X \) is a measurable function from \( (\Omega, \mathcal{F}, \mathsf{P})
    \) to a measurable space \( (\mathcal{X}, \mathcal{A}) \), we say that \( P_{X|\mathcal{G}}
    : \Omega \times \mathcal{A} \to [0, 1] \) is a *(regular) conditional distribution
    for X given* \( \mathcal{G} \) if


    +   (i) for every \( \omega \in \Omega \), the set function \( P_{X|\mathcal{G}}(\omega,
    \cdot) \) is a probability measure on \( \mathcal{A} \);


    +   (ii) for each \( A \in \mathcal{A} \), the map \( P_{X|\mathcal{G}}(\cdot,
    A) \) is \( \mathcal{G} \)-measurable, and \( P_{X|\mathcal{G}}(\omega, A) = \mathsf{P}(X^{-1}(A)
    | \mathcal{G})(\omega) \) for \( \mathsf{P}|_\mathcal{G}\)-almost every \( \omega
    \in \Omega \), so that \( \mathsf{P}(X^{-1}(A) \cap E) = \int_E P_{X|\mathcal{G}}(\omega,
    A) \, d\mathsf{P}(\omega) \) for all \( E \in \mathcal{G} \).


    We say that \( (\mathcal{X}, \mathcal{A}) \) is a *Borel space* if there exist
    a Borel subset \( S \subseteq [0, 1] \) (equipped with the restriction \( \mathcal{B}_S
    \) of the Borel \( \sigma \)-algebra on \( [0, 1] \) to \( S \)) and a bijection
    \( f : (\mathcal{X}, \mathcal{A}) \to (S, \mathcal{B}_S) \) such that both \(
    f \) and \( f^{-1} \) are measurable. Examples of Borel spaces \( (\mathcal{X},
    \mathcal{A}) \) include *Polish spaces* (i.e. separable, completely metrisable
    topological spaces) \( \mathcal{X} \) equipped with their Borel \( \sigma \)-algebras
    \( \mathcal{A} \) (Kallenberg, 1997, Theorem A1.6).


    Whenever \( (\mathcal{X}, \mathcal{A}) \) is a Borel space, there exists a conditional
    distribution \( P_{X|\mathcal{G}} \), and moreover, if \( P'' \) is another such
    conditional distribution, then \( P''(\omega, \cdot) = P_{X|\mathcal{G}}(\omega,
    \cdot) \) for \( \mathsf{P}|_\mathcal{G}\)-almost every \( \omega \in \Omega \);
    see Kallenberg (1997, Theorem 5.3) and Dudley (2002, Theorem 10.2.2). For brevity,
    we will write ‘\( X \) has conditional distribution \( P \equiv P_\omega \) given
    \( \mathcal{G} \) on an event \( \Omega_0 \in \mathcal{G} \)’ to mean that there
    exists a conditional distribution \( P_{X|\mathcal{G}} \), and we can take \(
    P_{X|\mathcal{G}}(\omega, \cdot) = P_\omega(\cdot) \) for \( \mathsf{P}|_\mathcal{G}\)-almost
