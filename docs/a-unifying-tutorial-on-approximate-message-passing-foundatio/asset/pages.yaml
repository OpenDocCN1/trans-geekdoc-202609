    matrices of the limiting Gaussian distributions in Theorem 3.1 below. Let \(\bar{\Sigma}^{[1]}
    = \bar{\Sigma}_{1,1} := \sigma_1^2 \ge 0\). For a general \(k \ge 2\), suppose
