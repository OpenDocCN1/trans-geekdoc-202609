    **Complete convergence of random sequences**: The asymptotic results below are
    formulated in terms of the notion of *complete convergence* (e.g., Hsu and Robbins,
    1947; Serfling, 1980, Chapter 1.3). This is a stronger mode of stochastic convergence
    than almost sure convergence, and is denoted throughout by the symbol $\to^c$.
    In Definition 1.1 and Proposition 1.2 below, we give two equivalent characterisations
