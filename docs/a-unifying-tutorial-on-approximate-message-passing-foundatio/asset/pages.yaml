    **Sparse signal recovery:** To give another example where the AMP procedure (3.3)
    can be specialised appropriately, suppose that the exact distribution \pi of V
    is not known, but that for some fixed s \in (0, 1) and every n \in \mathbb{N},
    the spike v \equiv v(n) is known to have at most sn non-zero entries. This implies
    that \pi satisfies \pi(\{0\}) \ge 1 - s. In line with the classical theory on
    denoising sparse vectors (Donoho and Johnstone, 1994, 1998; Montanari, 2012, Section
    9.3), we can take (g_k)_{k \in \mathbb{N}_0} to be a sequence of soft-thresholding
