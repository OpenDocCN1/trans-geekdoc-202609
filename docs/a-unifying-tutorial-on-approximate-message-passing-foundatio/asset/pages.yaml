  md: '# **Lemma B.23.** Let $\psi \in \text{PL}_{D+1}(r, L)$ for some $D \in \mathbb{N},
    r \ge 1$ and $L > 0$.

    Fix $c \equiv (c_1, \dots, c_D) \in \mathbb{R}^D$ and $\tau > 0$.


    (a) For fixed $x \equiv (x_1, \dots, x_D) \in \mathbb{R}^D$, define $\psi_x: \mathbb{R}
    \to \mathbb{R}$ by $\psi_x(z) := \psi(x_1, \dots, x_D, \sum_{\ell=1}^D c_\ell
    x_\ell + \tau z)$. Then $\psi_x \in \text{PL}_1(r, L_{\|x\|, \tau})$, where $L_{a,
    \tau} := L \tau \max\{1 + (2 \lor 2^{r-1})(1 + \|c\|)^{r-1} a^{r-1}, (1 \lor 2^{r-2})\tau^{r-1}\}$
    for $a \ge 0$.


    (b) Let $Z \sim N(0,1)$ and define $\Psi: \mathbb{R}^D \to \mathbb{R}$ by $\Psi(x_1,
    \dots, x_D) := \mathbb{E}\{\psi(x_1, \dots, x_D, \sum_{\ell=1}^D c_\ell x_\ell
    + \tau Z)\}$. Then $\Psi \in \text{PL}_D(r, L_\tau)$, where $L_\tau := L(1 + \|c\|)
    \max\{1 + (2 \lor 2^{r-1}) \mathbb{E}(|\tau Z|^{r-1}), (1 \lor 2^{r-2})(1 + \|c\|)^{r-1}\}$.


    Proof. For $x \equiv (x_1, \dots, x_D) \in \mathbb{R}^D$ and $z \in \mathbb{R}$,
    note first that


    $\|(x_1, \dots, x_D, \sum_{\ell=1}^D c_\ell x_\ell + \tau z)\|^{r-1}$

    $\le (\|x\| + |\sum_{\ell=1}^D c_\ell x_\ell| + \tau |z|)^{r-1}$

    $\le \{(1 + \|c\|)\|x\| + \tau |z|\}^{r-1}$ (B.20)

    $\le (1 \lor 2^{r-2}) \{(1 + \|c\|)^{r-1} \|x\|^{r-1} + \tau^{r-1} |z|^{r-1}\},$
    (B.21)


    where the three bounds above are obtained using the triangle inequality, the Cauchy–Schwarz
    inequality and the fact that $(a + b)^{r-1} \le (1 \lor 2^{r-2})(a^{r-1} + b^{r-1})$
    for $a, b \ge 0$.


    (a) For $z, z'' \in \mathbb{R}$, we have


    $|\psi_x(z) - \psi_x(z'')|$

    $= |\psi(x_1, \dots, x_D, \sum_{\ell=1}^D c_\ell x_\ell + \tau z) - \psi(x_1,
    \dots, x_D, \sum_{\ell=1}^D c_\ell x_\ell + \tau z'')|$

    $\le L \tau |z - z''| \{1 + 2(1 \lor 2^{r-2})(1 + \|c\|)^{r-1} \|x\|^{r-1}$

    $+ (1 \lor 2^{r-2}) \tau^{r-1} (|z|^{r-1} + |z''|^{r-1})\}$

    $\le L_{\|x\|, \tau} |z - z''| (1 + |z|^{r-1} + |z''|^{r-1}),$


    where the first bound follows from (B.21) and the fact that $\psi \in \text{PL}_{D+1}(r,
    L)$.'
