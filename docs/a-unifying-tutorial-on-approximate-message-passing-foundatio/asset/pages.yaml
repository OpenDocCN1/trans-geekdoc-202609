  md: "# **Remark B.1.** For a random sequence $(X_n)$ taking values in a Euclidean\
    \ space $(E, \\|\\cdot\\|_E)$, it can be seen from Definition 1.1 and Proposition\
    \ 1.2 that complete convergence (to a degenerate limit) is a property of the marginal\
    \ distributions of the random elements $X_1, X_2, \\dots$ and not of their joint\
    \ dependence structure (i.e. the specific coupling between them), so $X_1, X_2,\
    \ \\dots$ need not be defined on the same probability space. Thus, just as for\
    \ weak convergence or convergence in probability to a degenerate limit (but not\
    \ almost sure convergence), there is a meaningful notion of complete convergence\
    \ for sequences $(\\mu_n)$ of Borel probability measures on $E$: defining $\b\
    ar{B}(x, \\varepsilon) := \\{x' \\in E : \\|x' - x\\|_E \\le \\varepsilon\\}$\
    \ for $\\varepsilon > 0$, we write $\\mu_n \to^\\mathfrak{c} \\delta_x$ if $\\\
    sum_n \\mu_n(\bar{B}(x, \\varepsilon)^c) < \\infty$ for all $\\varepsilon > 0$.\n\
    \n# **Example 1.** Let $(X_n)$ be any sequence of random variables for which there\
    \ exist $c_1, c_2, \beta > 0$ such that $\\mathbb{P}(|X_n| > t) \\le c_1 \\exp(-c_2\
    \ t^\beta)$ for all $t > 0$ and $n \\in \\mathbb{N}$. Let $(a_n)$ be a deterministic\
