  md: '**State evolution:** Starting with \(\mu_1 \in \mathbb{R}\) and \(\sigma_1
    \in [0, \infty)\), we inductively define state evolution parameters \(\mu_k \in
    \mathbb{R}\) and \(\sigma_k \in [0, \infty)\) for \(k \in \mathbb{N}\) by


    ```

    \(\mu_{k+1} := \lambda \mathbb{E}(V g_k(\mu_k V + \sigma_k G)), \quad \sigma_{k}^2
    := \mathbb{E}''(g_k(\mu_k V - \sigma_k G)^2). \quad (3.6)\)

    ```


