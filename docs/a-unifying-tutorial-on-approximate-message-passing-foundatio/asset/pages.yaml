  md: 'Proof (Sketch) of Theorem 4.2. As mentioned previously, the overall objective
    is to handle the dependence of $y$ on $X$ (through $\theta = X\beta$) in (4.4),
    and show that the “noise” component $\tilde{\beta}^k \equiv \tilde{\beta}^k(n)
    := \beta^k - \mu_k\beta$ of the effective observations is approximately Gaussian
    (and independent of $\beta$) for large $n$. To this end, consider rewriting the
    second update step as


    \(\begin{aligned} \tilde{\beta}^{k+1} \equiv \beta^{k+1} - \mu_{k+1}\beta &= X^\top
    \tilde{g}_k(\theta, \theta^k, \varepsilon) \\ - \left( \begin{matrix} \beta \\
    f_k(\tilde{\beta}^k + \mu_k\beta) \end{matrix} \right) \left( \begin{matrix} \mu_{k+1}
    \\ (\partial_2\tilde{g}_k(\theta, \theta^k, \varepsilon))_n \end{matrix} \right).
    \end{aligned} \tag{4.13}\)


    Here, $\tilde{g}_k(\theta, \theta^k, \varepsilon) = g_k(\theta^k, y) = \hat{r}^k$
    (applying $\tilde{g}_k$ componentwise), $f_k(\tilde{\beta}^k + \mu_k\beta) = f_k(\beta^k)
    = \hat{\beta}^k$ and $\partial_2\tilde{g}_k(z, u, v) := g''_k(u, h(z, v))$ agrees
    with the partial derivative of $\tilde{g}_k$ with respect to its second argument,
    wherever the latter is defined. A useful feature of (4.13) is that unlike $y$,
    the noise vector $\varepsilon$ is independent of $X$ by (G0). Since both $\theta$
    and $\theta^k$ depend on $X$, this suggests treating $\tilde{\theta}^k := (\theta
    \ \theta^k) \in \mathbb{R}^{n \times 2}$ as a single entity, and rewriting the
    first update step in (4.4) as


    \(\begin{aligned} \tilde{\theta}^k \equiv (\theta \ \theta^k) &= X \left( \begin{matrix}
    \beta \\ f_k(\tilde{\beta}^k + \mu_k\beta) \end{matrix} \right) \\ - \bar{g}_{k-1}(\theta,
    \theta^{k-1}, \varepsilon) \left( 0 \ \frac{p}{n} \langle f''_k(\tilde{\beta}^k
    + \mu_k\beta) \rangle_p \right), \end{aligned} \tag{4.14}\)


    where $\frac{p}{n}\langle f''_k(\tilde{\beta}^k + \mu_k\beta)\rangle_p = \frac{p}{n}\langle
    f''_k(\beta^k)\rangle_p = b_k$. In doing so, we have recast (4.4) as a matrix-valued
    AMP iteration (4.13)-(4.14) that is no longer a valid algorithm for practical
    purposes, but is more amenable to theoretical analysis. Indeed, its asymptotics
    can be derived by applying a master theorem for abstract recursions (A.52) of
    this type; see Section A.7. The significance of the definition of $\mu_{k+1} =
    \mathbb{E}(\partial_z \tilde{g}_k(Z, Z_k, \bar{\varepsilon})) \equiv \mathbb{E}(\partial_1
    \tilde{g}_k(Z, Z_k, \bar{\varepsilon}))$ in (4.6) is that the final term in (4.13)
    is a non-linear correction based on the derivative (gradient) of $\tilde{g}_k$.
    The final term in (4.14) has a similar interpretation as a multivariate analogue
    of the original $b_k$ in (4.4), and together these ensure that the limiting empirical
    distributions of the iterates in (4.13)-(4.14) are indeed Gaussian.'
