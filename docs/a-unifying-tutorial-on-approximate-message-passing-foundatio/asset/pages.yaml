    F_n(P_n)\) and \(\beta_n = G_n(\tilde{P}_n)\) almost surely for each \(n\). Then
    \(F_n(\tilde{P}_n) \xrightarrow{a.s.} 0\), so (a) implies that \(\beta_n = G_n(\tilde{P}_n)
    \to 0\) almost surely. This completes the proof. \(\square\)'
