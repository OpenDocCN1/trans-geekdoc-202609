- pgno: 104
  md: 'Ping, 2017; Takeuchi, 2020) is an algorithm that is equivalent to VAMP for
    estimation in rotationally invariant linear models. Recently, Ma et al. (2021)
    studied the performance of Expectation Propagation (an algorithm closely related
    to VAMP) for rotationally invariant GLMs, and analysed the impact of the spectrum
    on the estimation performance. VAMP has also been used to obtain the asymptotic
    risk of convex-penalized estimators for rotationally invariant GLMs (Gerbelot
    et al., 2020a,b). A few lower complexity alternatives to VAMP have also been proposed,
    including convolutional AMP (Takeuchi, 2021a), Memory AMP for linear models (Liu
    et al., 2021), and Generalised Memory AMP for GLMs (Tian et al., 2021).


    Fan (2022) and Zhong et al. (2021) provide a master theorem for an abstract AMP
    recursion defined via a rotationally invariant random matrix. Compared with the
    original Gaussian setting of Section 2, AMP recursions with general rotationally
    invariant random matrices have two key differences, as seen in (3.38): (i) the
    presence of multiple memory terms, accounting for all the preceding iterates,
    and (ii) thresholding functions that act on all the preceding iterates rather
    than just the current one. The abstract AMP recursion of Fan (2022) and Zhong
    et al. (2021) has been used to derive AMP algorithms with state evolution guarantees
    for low-rank matrix estimation with rotationally invariant noise (Çakmak and Opper,
    2019; Fan, 2022; Mondelli and Venkataramanan, 2021; Opper et al., 2016; Zhong
    et al., 2021), as discussed in Section 3.5. See also Venkataramanan et al. (2021)
    for an application of this more general AMP framework to GLMs defined via rotationally
    invariant matrices.


    Though the focus in this tutorial has been on low-rank matrix estimation and generalised
    linear models, both AMP and Vector AMP have been applied to a number of other
    statistical problems including tensor PCA (Montanari and Richard, 2014) and inference
    in multilayer neural networks (Fletcher et al., 2018; Emami et al., 2020; Manoel
    et al., 2017). AMP has also been used to obtain lower bounds on the limiting estimation
    error of a broad class of general first-order methods such as gradient descent
    and mirror descent (Celentano et al., 2020). An active area of current research
    is to determine whether AMP outperforms all other polynomial-time algorithms in
    low-rank matrix'
