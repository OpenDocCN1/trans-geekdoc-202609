    \le i,j \le n}$ takes values in the space of all symmetric $n \times n$ matrices,
    and has the property that $(W_{ij})_{1 \le i \le j \le n}$ are independent, with
    $W_{ij} \sim N(0, 1/n)$ for $1 \le i < j \le n$ and $W_{ii} \sim N(0, 2/n)$ for
    $i = 1, \dots, n$. Writing $\mathbb{O}_n$ for the set of all $n \times n$ orthogonal
    matrices, we note the orthogonal invariance property of the $\mathrm{GOE}(n)$
    distribution: if $Q \in \mathbb{O}_n$ and $W \sim \mathrm{GOE}(n)$, then $Q^\top
