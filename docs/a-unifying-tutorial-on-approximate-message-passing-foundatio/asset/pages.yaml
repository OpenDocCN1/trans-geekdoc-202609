  md: 'Since \(\|\cdot\| \equiv \|\cdot\|_2 \le D^{\frac{1}{2}-\frac{1}{r}}\|\cdot\|_r\)
    on \(\mathbb{R}^D\), we see that


    \(\frac{1}{n} \sum_{i=1}^n \|X^{(i)} - Y^{(i)}\|^r \le \frac{D^{\frac{r}{2}-1}}{n}
    \sum_{i=1}^n \sum_{\ell=1}^D |x_i^\ell - y_i^\ell|^r = D^{\frac{r}{2}-1} \sum_{\ell=1}^D
    \|x^\ell - y^\ell\|_{n,r}^r.\) \newline (B.23)


    In addition, by applying the triangle inequality for \(\|\cdot\|_{n,r''}\) and
    arguing as in (B.23), we have


    \(\left(\frac{1}{n} \sum_{i=1}^n (1 + \|X^{(i)}\|^{r-1} + \|Y^{(i)}\|^{r-1})^{r''}\right)^{1/r''}\)

    \(\le 1 + \left(\frac{1}{n} \sum_{i=1}^n \|X^{(i)}\|^r\right)^{1/r''} + \left(\frac{1}{n}
    \sum_{i=1}^n \|Y^{(i)}\|^r\right)^{1/r''}\)

    \(\le 1 + \left(D^{\frac{r}{2}-1} \sum_{\ell=1}^D \|x^\ell\|_{n,r}^r\right)^{\frac{r-1}{r}}
    + \left(D^{\frac{r}{2}-1} \sum_{\ell=1}^D \|y^\ell\|_{n,r}^r\right)^{\frac{r-1}{r}}\)

    \(\le 1 + (D^{\frac{r}{2}-1})^{\frac{r-1}{r}} \sum_{\ell=1}^D (\|x^\ell\|_{n,r}^{r-1}
    + \|y^\ell\|_{n,r}^{r-1}),\) \newline (B.24)


    where the final bound follows since \(\|\cdot\|_r \le \|\cdot\|_{r-1}\) on \(\mathbb{R}^D\).
    Combining (B.22)-(B.24) yields the desired conclusion.'
