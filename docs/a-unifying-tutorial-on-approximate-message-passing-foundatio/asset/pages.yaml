  md: '# # B

    Supplementary Mathematical Background


    # ## B.1 Basic Properties of Complete Convergence


    Proof of Proposition 1.2. For (a), suppose that \(\sum_n \mathbb{P}(\|X_n\|_E
    > \varepsilon) < \infty\) for all \(\varepsilon > 0\). Then for any sequence \((Y_n)\)
    of \(E\)-valued random elements with \(Y_n \stackrel{d}{=} X_n\) for all \(n\),
    the first Borel–Cantelli lemma implies that \(\mathbb{P}(\|Y_n\|_E > \varepsilon
    \text{ infinitely often}) = 0\) for all \(\varepsilon > 0\) and hence that \(Y_n
    \to 0\) almost surely. This shows that \(X_n \xrightarrow{\mathcal{L}} 0\). Conversely,
    suppose that \(\sum_n \mathbb{P}(\|X_n\|_E > \varepsilon) = \infty\) for some
    \(\varepsilon > 0\). Then for a sequence \((Y_n)\) of independent \(E\)-valued
    random elements with \(Y_n \stackrel{d}{=} X_n\) for all \(n\), the second Borel–Cantelli
    lemma implies that \(\mathbb{P}(\|Y_n\|_E > \varepsilon \text{ infinitely often})
    = 1\) and hence that \(Y_n \not\to 0\) almost surely. Thus, \(X_n \not\xrightarrow{\mathcal{P}}
    0\).


    The argument for (b) is similar. If \(\sum_n \mathbb{P}(\|X_n\|_E > C) < \infty\)
    for all \(C > 0\), then \(X_n = O_c(1)\) by the first Borel–Cantelli lemma. Conversely,
    suppose that \(\sum_n \mathbb{P}(\|X_n\|_E > C) = \infty\) for all \(C > 0\).
    Then for a sequence \((Y_n)\) of independent \(E\)-valued random elements with
    \(Y_n \stackrel{d}{=} X_n\) for all \(n\), the second Borel–Cantelli lemma implies
    that \(\mathbb{P}(\|Y_n\|_E > C \text{ infinitely often}) = 1\) for all \(C >
    0\) and hence that \(\limsup_{n\to\infty} \|Y_n\|_E = \infty\) almost surely.
    Thus, \((X_n)\) is not \(O_c(1)\). \(\square\)'
