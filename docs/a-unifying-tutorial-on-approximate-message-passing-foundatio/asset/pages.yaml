  md: '# Conclusions and Extensions


    With the abstract AMP recursions in Section 2 as our starting point, we have shown
    how to design and analyse AMP algorithms for estimating structured signals, both
    in low-rank spiked models with Gaussian noise matrices and in GLMs with Gaussian
    design matrices. In high-dimensional asymptotic regimes where the matrix dimensions
    scale proportionally to each other, we have illustrated how to apply the abstract
    master theorems to derive precise state evolution characterisations of AMP estimation
    performance, which we have stated as complete convergence guarantees.


    In Section 4, we have presented a general recipe that uses AMP systematically
    to obtain exact expressions for the asymptotic error of penalised and unpenalised
    M-estimators in GLMs with Gaussian design matrices. An alternative approach to
    deriving such guarantees is via Gaussian comparison inequalities and the convex
    Gaussian min-max theorem (CGMT) (Thrampoulidis et al., 2015). These techniques
    have recently been used to analyse the performance of regularised M-estimators
    (Thrampoulidis et al., 2018), the Lasso (Miolane and Montanari, 2021), boosting
    (Liang and Sur, 2022) and convex-constrained least squares estimators (Han, 2022),
    as well as to elucidate the so-called'
  merge: -1
  img_proc: true
- pgno: 103
  md: '“double descent” phenomenon in over-parametrised binary classification models
    (Deng et al., 2019; Kini and Thrampoulidis, 2020).


    Remaining within the realm of Gaussian matrices, we mention that the results in
    this monograph can be extended to AMP recursions with (i) non-separable denoising
    functions that do not act componentwise on their vector arguments, and can therefore
    take advantage of correlation between entries of the signal (Berthier et al.,
    2020; Ma et al., 2019b); (ii) matrices with independent entries and a blockfully
    variance structure (Javanmard and Montanari, 2013). With a carefully chosen variance
    structure (“spatial coupling”), AMP has been shown to achieve the information-theoretic
    limit for compressed sensing (Donoho et al., 2013).


    In the setting of AMP for asymmetric matrices in Section 2.2, the results of Theorem
    2.5 can be generalised to matrices with i.i.d. sub-Gaussian entries with mild
    additional assumptions (Bayati et al., 2015; Chen and Lam, 2021). It is likely
    that the proof strategies in these papers can be developed further to extend other
    theoretical results (such as Theorem 4.2 for GAMP) to these more general random
    matrix ensembles.


    When the data matrix does not have i.i.d. Gaussian entries, AMP is not guaranteed
    to converge, and in fact can even diverge in sometimes pathological ways; see
    Rangan et al. (2019a) for a discussion of this issue. For this reason, a number
    of other AMP-based algorithms have been introduced that allow for this assumption
    to be weakened in various ways, such as Vector AMP (VAMP) (Rangan et al., 2019b),
    orthogonal AMP (OAMP) (Ma and Ping, 2017; Takeuchi, 2020) and other generalisations
    of AMP for rotationally invariant matrices (Opper et al., 2016; Fan, 2022).


    Vector AMP (VAMP) is an iterative algorithm (based on Expectation Propagation)
    for estimation in rotationally invariant linear models (Rangan et al., 2019b;
    Takeuchi, 2020, 2021b) and generalised linear models (Schniter et al., 2016; Pandit
    et al., 2020). Rangan et al. (2019b) and Pandit et al. (2020) showed that the
    asymptotic estimation error of VAMP (with optimal denoising functions) coincides
    with the statistical physics-based prediction for the Bayes-optimal error whenever
    the state evolution recursion has a unique fixed point. Orthogonal AMP (Ma and'
