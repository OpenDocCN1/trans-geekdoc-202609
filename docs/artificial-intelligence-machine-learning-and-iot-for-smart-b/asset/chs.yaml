  \ 循环神经网络 (RNN)\n\nRNN 是一类旨在处理序列数据的神经网络。图 5.3 显示了 RNN 的对称结构。该模型维护隐藏状态，以捕捉有关上一个状态的信息。RNN\
  \ 由顺序连接的节点组成。在每一步中都会对输入进行处理，输出随隐藏层一起传递到下一个一步。隐藏层存储了从上一步捕获的信息。\n\n### 5.8.2 长短期记忆网络\
  \ (LSTM)\n\nLSTM 是 RNN 的改进版本，专门用于处理序列数据中的长期依赖关系。LSTM 由单元组成，数据流通过输入门、遗忘门和输出门。图 5.4\
  \ 显示了 LSTM 的架构，这种架构允许 LSTM 在长序列中保持信息，使其成为具有长依赖关系的时间序列数据的理想选择。\n\n![图 5.4 LSTM 架构。来源：https://www.researchgate.net/figure/A-Long-short-term-memory-LSTM-unit-architecture\\\
