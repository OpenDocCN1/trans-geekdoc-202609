  \ VIT 大学工作的 14 年时间里，他也曾担任副教授。他的研究重点是区块链和物联网。他出版了 80 本技术书籍以及 150 多篇期刊、会议论文和书籍章节。他担任多家初创公司和论坛的顾问委员会成员，并为工业物联网提供咨询服务。他在各类活动和研讨会上进行过\
