  cdot stat\\left( {\\\\mathcal{X}\\}_{i},{\\\\mathbb{C}}\\_{j}} \\right)$ (9.4)\n\
  \n这里，\n\n*   `ℙ(ℂ[j])` 表示类 `ℂ[j]` 的概率，\n*   `stat(\U0001D4B3[i], ℂ[j])` 是一个统计函数，衡量\
  \ \U0001D4B3[`i]` 对于 `ℂ[j]` 的相关性，例如互信息、卡方或相关系数。互信息（`MD`）的计算方式如下：\n\n$MD\\left( {\\\
