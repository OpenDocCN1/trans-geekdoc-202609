  \ 返回正文。\n\n\n\n\n人工神经网络（ANNs）、模糊逻辑和遗传算法（GAs）是计算智能方法的典型示例，它们是突目的研究课题，因为它们能够处理传统方法难以解决的复杂工程问题。在计算智能领域，混合技术引起了广泛关注。最广泛使用的策略之一是模糊逻辑与遗传算法的混合化，这产生了模糊进化算法和遗传模糊系统（GFSs）。两者都是软计算方法如何进行建设性协同作用的著名实例。本质上，GFS\
  \ 是一个基于模糊规则的系统（FRBS），它通过基于进化计算的学习过程进行增强，该学习过程结合了多种进化算法（EAs），例如遗传编程、遗传算法和进化策略。仅需一个性能指标，遗传算法——一种流行且常用的全局搜索方法——就能在广泛的搜索空间中搜寻合适的答案。FRBS\
  \ 的计算机化开发可以被视为一个识别或效率问题。鉴于其通用的代码结构、独特的性能特征以及在具有挑战性的搜索环境中寻找近优解的能力，遗传算法是先验信息的极佳选择。在\
  \ FRBS 的设定中，这些先验知识可以表示为语言变量、模糊规则、隶属参数的模糊函数等。在过去的几年里，这些特征扩展了遗传算法在创建许多设计 FRBS 方法中的应用。1988\
  \ 年后期，Goldberg 和 Holland 编写了一篇客座社论，描述了遗传算法与机器学习（ML）的应用。在同一篇社论中，他们还通过大量的参考文献解释了遗传算法和分类器系统。FRBS\
  \ 提供了一项工具，可以将基于专家知识的语言控制方法转换为自动控制策略。它们在模拟不明确或极其复杂的设定下的变量间相关性方面表现特别出色。这种可以受益于 FRBS\
  \ 应用的复杂问题之一是遗传算法参数的自适应，这导致了所谓的模糊自适应遗传算法（FAGAs）。“模糊进化算法”这一术语适用于任何可以使用基于模糊逻辑的方法进行增强的进化算法。本章简要概述了该主题的现状，介绍了\
  \ GFSs 和模糊进化算法，并强调了一些近期更引人入目的进展进展和潜在方向。\n\n217。\n\n## 12.2 基于模糊规则的系统\n\n构建 FRBS\
  \ 是模糊逻辑的主要成就之一。这些系统基于模糊 IF-THEN 规则和语言参数的基本概念。模糊 IF-THEN 规则的一个常见例子是：“如果室外温度很高，那么风扇的速度也应该是高的。”通过模拟人类思维，FRBS\
  \ 能够处理这些模糊规则并描绘动态、复杂的系统，其中许多系统本质上是不确定的而非精确的。正因如此，FRBS 对冲击、系统参数的变化和其他变量表现出高度的鲁棒性。使用规则归纳技术，可以使用数据或专家知识产生用于\
  \ FRBS 的模糊规则。在本节中，我们将介绍 FRBS 的核心组件，并对各种基本思想进行简要介绍，例如模糊集和作为语言形式的变量。\n\n### 12.2.1\
  \ 初始步骤：语言变量和模糊集\n\n与确集不同，模糊集允许其组成元素具有不同程度的隶属关系。隶属函数是一条说明集合范围内包含的内容与其隶属程度之间联系的直线或曲线，它是模糊集的核心部分。元素\
  \ `x` 模糊集 `A` 的隶属度表示为 `μA(x)` 或简单的 `A(x)`，其范围从 0（表示完全不隶属）到 1（表示完全隶属），这意味着根据 Zadeh\
  \ 的原始概念，它可以取区间 `[0,1]` 内的任何值。隶属函数仅接受 0 到 1 之间值的集合概念的扩展就是模糊集。`x` 产生 `A` 的程度由 `A(x)`\
  \ 的指标显示。语言变量是自动或计算机化语言中的短语，而非数值。显而易见，这种想法是作为数值变量的类比创建的。根据文献，`L` 是一个五元组：`X` 是定义域（领域），`A\
  \ = {A1, A2, …, AN}` 是语言术语集，`g` 是语法规则，`m` 是语义规则，它为每个语言术语分配一个模糊集。图 12.1 使用了三种语言表达式“低”、“中”和“高”来描绘一个涉及语言变量的情况。通过适当单位传的“温度”是一个基本变量。\n\
  \n### 12.2.2 FRBS 的基本组件\n\nFRBS 的主要构建块是 IF-THEN 规则的集合，模糊断言作为先验数据和结论。FRBS 的知识库（`KB`）以模糊规则的形式显示信息：\n\
  \n* 如果，满足了某些条件；\n* 那么，可以得出一系列结论。\n\n![图 12.1 三种语言语句和语言变量的示例](img/Figure12_1.jpg)\n\
  \n218。推理机模块包含以下部分：\n\n用于模糊化的用户接口，从清晰数据创建模糊分组。\n\n推理系统结合 `KB` 使用推理技术来得出结论。\n\n去模糊化接口使用去模糊化技术将推导出的模糊规则动作转换为实际动作。通常，FRBS\
  \ 属于许多组中的一种：\n\n> 第一类是使用以语言值为前提的 IF-THEN 规则组进行语言建模。系统的行为可以使用自然语言来解释。\n\n以函数结论和模糊前提为特征的规则结构构成了第二类的基础，该类主要关注散列划分或近似。219。语言\
  \ FRBS 的数据库（`DB`）和规则库（`RB`）构成了知识库（`KB`）。`DB` 包含了规则中考虑的语言术语集合以及定义语言标签函数的隶属程序。规则连接词（或“或”操作符）连接一组语言规则形成形成\
  \ `RB`。换句话说，多个规则可以同时针对完全相同的输入执行。图 12.2 显示了 FRBS 的通用结构。\n\n\n\n\n![图 12.2 FRBS 的结构。返回正文。](img/Figure12_2.jpg)\n\
  \n图 12.2 FRBS 的结构。返回正文。\n\n## 12.3 遗传模糊系统\n\n通过采用“IF-THEN”规则（即使用模糊逻辑语句而非经典语句来指定前件和后果），FRBS\
  \ 扩展了传统的基于规则的系统。许多应用，如控制问题 [14]],建模 [15]],分类以及数据挖掘 [16}$–18]，已经证明了它们的效能。\n\n本质上，GFS\
  \ 是一种通过基于进化计算的学习过程增强的模糊系统，该过程包含了多种进化算法（EA），如遗传算法（GA）、编程语言和进化策略等。这一概念在图 12.3 中所示，其中不同的\
  \ FRBS 组件通过遗传过程进行学习或调整。将知识库（KB）的设计建模为优化问题，对于使用 `GA` 进行 FRBS 的自学习至关重要。\n\n寻找合适的 KB\
  \ 类似于将其建模为一组参数，并从优化的角度，根据适应度函数确定哪些参数值能产生最佳性能。搜索空间由 KB 参数提供，并根据遗传表示法进行改变。因此，确定 `GA`\
  \ 可以优化的特定 KB 组件是创建 GFS 的第一步。\n\n![图 12.3 遗传模糊系统。返回正文。](img/Figure12_3.jpg)\n\n图\
  \ 12.3 遗传模糊系统。返回正文。\n\n## 12.4 遗传模糊系统的分类学\n\n通过将案例放入染色体中，设计过程可以被视为设计框架内的搜索问题，而设计框架是规则的集合。这是利用\
  \ `GAs` 自主学习 FRBS 的基本思想。GFS 方法的两个阶段是学习和调优。然而，很难在这两个过程之间做出明确区分，因为在它们之间划定清晰的界限变得与定义学习概念本身一样困难\
  \ [19, 20]]。\n\n**遗传调优：** 我们采用遗传调优过程，在不改变现有规则库（RB）的情况下提高 FRBS 的性能。换句话说，在保持相同 RB\
  \ 的情况下，通过改变 FRBS 设置来提高性能。\n\n**遗传学习：** 第二种技术是学习 KB 组件，甚至可以采用灵活的推理算法。关于 KB 组件与其他\
  \ FRBS 组件的共同检查，我们根据这两个过程以及进入遗传学习过程的 FRBS 元素对建议进行分组。因此，我们检查了图 12.3 中所示的分类学 [21}$–23]]\\\
  。\n\n### 12.5 当前 GFS 研究趋势\n\n在本节中，我们重点从大量发表的研究成果中提取了六个当代趋势，这些趋势目前备受关注，并在不久的未来具有广阔前景。\n\
  \n**FRBS 的进化多目标学习：** 它解决了精度与可解释性之间的权衡。多目标进化算法（`MOEAs`）是研究最热门的主题之一，因为它们能够在单次运行中识别出一组非支配解。`NSGA-II`\
  \ [24]] 和 `SPEA` [25]], 26] 是文献中提出的 `MOEAs` 中两种流行且广泛使用的算法 [27, 28]]\\。在创建如图 12.4\
  \ 所示的多目标 GFS 时，在学习机制的可解释性和准确性之间取得平衡至关重要。\n\n![图 12.4 GFS 的分类学。返回正文。](img/Figure12_4.jpg)\n\
  \n图 12.4 GFS 的分类学。返回正文。\n\n**基于 GA 的新数据挖掘技术：** 在数据挖掘（`DM`）/知识发现（`KD`）等必须以易理解的方式提取和呈现信息的领域，或者在决策系统中，可理解性至关重要。许多研究调查了在发现过程中如何使用语言和术语。然而，在\
  \ `DM/KD` 任务中，使用 `GAs` 和 `EAs` 是常见的 [29]]\\。与以前的方法相比，其优势在于其在模糊 IF-THEN 规则方面的理解能力，GFS\
  \ 领域的这种结合为分析和提取新类型信息提供了新颖且实用的工具。在参考文献 [30, 31]]中，我们发现了致力于模糊规则遗传提取的有趣当代研究。未来关于 GFS\
  \ 在关联分析中的应用贡献将非常吸引人，[32]]\\。\n\n**基于低质量数据（噪声数据和模糊数据）的遗传学习：** 在许多现实问题中，必须从模糊数据中学习模型。研究人员尚未积极研究从观察不精确的数据中学习的\
  \ GFS 实验设计。然而，从模糊统计学的角度来看，模糊集主要用于处理分类和建模问题中的模糊数据。我们可以通过使用模糊数据来训练和测试 GFS，检查这些分类器在预计模糊系统表现更好的任务类型中表现如何。该领域的初步发现包括：在\
  \ GFS 背景下开发的适应度函数（带有模糊值）[33]]，以及基于随机集与模糊集相互作用的模糊分类器定义的几种形式化方法 [34]]\\。在不久的调查这一新领域是值得的，因为它可能会产生有趣的发现。\n\
  \n\n\n\n\n## 上文适应与模糊划分遗传学习\n\nDB 学习包括定义与每个标签关联的模糊隶属函数、定义每个语言因子的标签总数，以及指定话语域。文献 [35]\
  \ 探讨了模糊划分粒度对 `FRBS`性能的影响。它证明了为每个参数使用适当数量的短语，可以在不需要复杂学习机制的情况下显著提高 `FRBS` 的可靠性。相反，向模糊系统引入上下文的想法源于这样一种认识：在现实世界中，同一个基本概念可能会根据具体情况有不同的解释方式。目前已经提出了多种方法，利用\
  \ `GAs`、粒度、隶属度学习等技术来处理非线性态势 [36]。\n\n## 经过遗传修改的推理引擎组件\n\n我们已经意识到，通过设计推理系统和去模糊化，可以使用参数化聚合来寻找任何应用的最佳参数配置。为了获得更精确的模型，可以考虑这些组件的调整。我们遇到过许多\
  \ `GFS` 方法论。这是一个有趣的研究领域，可以为我们提供调整设置以适应 `FRBS` 并开发与推理引擎常数协同进化的神经网络的机会 [38]。\n\n##\
  \ 重新审视密歇根风格 GFS\n\n在文献 [39] 中描述了第一个密歇根风格的 `GFS`。`强度`（strength）的概念构成了该领域所有早期方法的基础。规则（分类器）通过与环境的交互获得`强度`，并根据其表现如何获得奖励或惩罚。这种强度有助于解决许多规则同时匹配时的冲突，并在学习过程中辅助适应度评估。另一种方法是根据规则的`准确率`（accuracy）而非强度来评估规则的适用性。Casillas\
  \ 等提出了一种获取基于准确率的密歇根风格 `GFSs`的新方法。源自 `XCS` 框架的方法在函数近似相关的在线学习问题中显示出良好的前景。该算法还通过一种新的密歇根风格遗传学习方法扩展到了分类。这些方法在模糊系统模型与遗传研究之间建立了联系，可能会产生引入胜的发现。\n\
  \n## 模糊算法\n\n为了提高这些搜索算法的性能，目前人们对使用模糊工具和基于逻辑的方法论来模拟各种遗传算法（EA）组件或调整控制参数越来越越来越兴趣。通过这种整合产生的\
  \ EA 通常被称为模糊遗传算法。\n\n### 12.6.1 模糊自适应 GA\n\n一种称为模糊逻辑控制器（`FLCs`）的特殊 `FRBS` 提供了一种工具，可以将基于专家知识的语言控制策略转换为自动控制策略。它们在模拟高度复杂或定义不全的情况下的变量间交互方面效果特别好。`FLCs`\
  \ 可能帮助的一个此类问题是 `GA` 参数的自适应，这产生了所谓的模糊自适应 GA（`FAQs`）。各种 `GA` 的自适应策略可以通过 `FLCs` 的规则库更容易地捕获和表示（例如，它们可能帮助此类策略的自动学习）。`FAQs`\
  \ 的基本概念是使用带有 `GA` 控制参数作为输出的 `FLC`，并将 `GA` 性能量的任意组合或当前控制参数作为输入。`FLC` 接收 `GA` 的当前性能指标并利用它们计算出\
  \ `GA` 将采用的新控制参数值。图 12.5 展示了这一过程。\n\n## 12.7 设计 FACS\n\n本节提供了模糊自适应遗传算法（`FAGA`）在设计\
  \ `FLC` 时面临的困难概述。选择正确的输入输出、建立相关的数据库以及创建规则库都是这些困难之处。\n\n![图 12.5 FAGA 模型。](img/Figure12_5.jpg)\n\
  \n图 12.5 FAGA 模型。\n\n- **输入**：它们应该是解释 `GA` 行为以及遗传算子和遗传配置因素影响的可靠指标。多样性测量、最大、平均和最小适应度等都是潜在输入的示例。人们可能还会将现有的控制参数视为输入。\n\
  - **输出**：它们显示控制参数的值或这些值的演化。描述了几种输出，包括种群规模、交叉概率、变异概率、选择压力、为了使过程被视为成功必须保持目标状态的时间，以及达到最有效答案的程度。\n\
  - **数据库**：每个输入和结果都应赋予一组语言标签。数据库中的模糊划分（可以用隶属度的模糊数组表示）定义了这些标签的字面意义。每个输入和输出都必须有一个限制范围，以便在指定的取值范围内构建这些隶属函数。\n\
  - **规则库**：在选择输入并创建数据库后，必须定义解释存在关系的模糊规则。它们使得记录和描述各种 `GA` 适应技术变得更容易。虽然规则库可以从 `GA`\
  \ 专家的知识和经验衍生，但许多作者在此过程中遇到了挑战。\n\n## 12.8 模糊表示\n\n提出了一种模糊技术来解决连续域变量的参数优化问题。范围 `[0,1]`\
  \ 对于每个问题参数包含若干 `m` 个模糊备选方案。随后将为每个参数选定的变量值组合形成染色体。在解码过程中，每个参数都从感兴趣的区间 `[0,1]` 线性调整到合适的域，并通过一个算子\
  \ `g: [0,1] m → [0,1]`。作者提供的此类函数插图所示：\n\n```\n∀d = (d1,...,dm) ∈ [0,1] m, g(d) =\
  \ 2^m – 1 ∑j=1m (dj²j – 1) (12.1)\n```\n\n这种编码方式违背了经典遗传算法（EAs）的核心假设，即当 `m>1` 时基因型和表型是一对一对应的，因为两个不同的基因型可以产生相同的表型。因此，基因型与表型之间的映射不是同构的，意味着无法从基因型简单地推断出表型。2014\
  \ 年进行了使用 `m=1` 和 `m=2` 的多次实验，证明了采用模糊表示可以产生健性行为。在某些情况下，它优于育种者 `GA`。另一个重要发现是，对于小种群规模，`m=2`\
  \ 的性能略好于 `m=1`，但对于较大的种群规模，情况相反。\n\n具体而言，以下方程指定了每个搜索参数：\n\n```\np*s = (p*g.2[l]-1).*R\
  \ + O (12.2)\n```\n\n\n\n\n\n`R` 代表特定的参数范围，`O` 代表偏移量，`l` 代表遗传参数的位数，`ps` 代表搜索参数，`pg`\
  \ 代表遗传参数。为了获得更准确的答案，可以通过改变偏移量和范围来使用相同二进制位。\n\n## 12.9 模糊进化算法（Fuzzy EAs）的研究展望\n\n\
  在未来的研究中，可能会考虑以下问题以创建成功的模糊适应遗传算法（FAGAs）。\n\n*   **FLCs 的重要数据：** 应该更多地研究识别控制 GA 行为的\
  \ `FLCs` 的相关输入变量。这些因素应当刻画种群状况或染色体特征，以便相应修改控制设置，从而带来显著的性能提升。因此，Boulif 和 Karim [18]\
  \ 最近断言，早期对 FAGA 的研究使得创建性能明显优于普通 GA 的 FAGA 系统成为可能。尽管这些出版物非常吸引，但它们关注的是结果而非驱动 GA 寻找可靠答案的原因。事实上，种群多样性、平均适应度和收敛速度是模糊模型使用的输入。\n\
  \n*   **基于模糊行为的协同进化适应：** 两个显著特征使得与模糊行为（FBs）协作修改 GA 设置成为进一步 FAGA 研究的一种可行途径：(1) 目前尚未在利用在线学习方法创建\
  \ FAGA 规则库方面投入过多的关注；(2) 基于协同进化的 EA 适应目前是目前的热门研究领域。尽管连接这些特征与算子控制动作的精确模糊规则尚不清楚，但与\
  \ `FBs` 协同进化的灵活系统也可以用于解决特定父代特征可能提高交叉算子效能的情况。这种方法使得通过结合特定情境的知识（situation-specific\
  \ knowledge）来增强进化算法（EA）的性能成为可能。\n\n## 12.10 模糊进化算法的应用与扩展\n\n可以设计模糊进化算法来解决特定问题，包括多峰优化挑战。模糊逻辑也可能帮助当代混合元启发算法提高其性能，从而产生模糊混合元启发算法。\n\
  \n### 12.10.1 多峰优化问题\n\n当面对具有多个解的问题时，基础 EA 通常会收敛到单一解。为了使 EA 能够一致地找到多个最优解，已经提出了许多技术在搜索过程中维持种群的多样性。然而，这些技术许多通过拥挤（crowding）和共享（sharing）促进人工生态位的创建，但这些技术也增加了一个或多个影响算法性能的因素，如拥挤密度或效率传输中的半径。在许多情况下，无法通过统一生态位大小捕捉不同位置和范围的解，除非将种群规模推过可接受的限制。\n\
  \n因此，仍然需要创建能够一致且有利地识别最大生态位的技术，无论它们的大小和间隔如何。`FLCs` 可能有助于调整与拥挤共享技术相关的参数。可能的输入示例包括多样性指标、整个种群中现存栖息地的数量等\
  \ [40]。\n\n### 12.10.2 利用模糊工具改进混合元启发算法\n\n近年来报道了许多不严格遵守单一经典元启发算法原理的搜索算法。相反，它们寻求最大化一组元启发算法的输出。`MA`\
  \ 是此中的一个著名例子。（注：原文此处存在重复段落，已按原文逻辑处理）。\n\n## 12.11 结论\n\n在本章中，我们对模糊进化算法和 `FSs` 提供了全面的概述。特别是，我们回顾了一组元启发算法的设计。`MA`\
  \ 是此中的一个著名例子。\n\n## 12.12 参考文献\n\n1.  Ah, R.T., Radha, B., Kong, H.S.: A fuzzy logic\
