  \ 返回文本。⏎\n\n\n\n\n\n# 6 AI、机器学习与物联网的未来趋势与伦理考量\n\nSarabjeet Kaur, Swarnima, Purnima\
  \ Pal, and Nidhi Sharma\n\nDOI: [10.1201/9781003561873-6](https://doi.org/10.1201/9781003561873-6)\n\
  \n## 6.1 引言\n\n在任何时间、任何地点连接传感器或“物体”的想法被称为物联网（IoT）。通过实体物品的连接，它将互联网范围扩展到了现实世界；这种现象通常被称为“无处不在的网络”或“信息物理系统”。网络协议、嵌入式系统和微电子技术的创新将在物联网的未来发展中发挥重要作用\
  \ [1]。本章概述了未来几年内物联网可能改变的许多行业。它探讨了未来国家公公路上的驾驶可能会发生什么变化，普通服装将如何从仅仅的面料演变为更丰富的形态，双向通信在未来电网中的重要性如何，以及物联网如何帮助保护犀牛等濒危物种\
  \ [2]。它还研究了物联网开发者面临的困难，以及数据安全未来将如何影响物联网网络。章节结论部分总结了随着物联网设备在市场上的泛滥，制造商可能使用的几种商业模式\
  \ [3]。\n\n## 6.2 物联网的应用\n\n物联网应用层出不穷，并且在过去几年中显著增长，接下来的章节将对此进行详细介绍。开发者超越基础的云编程知识以加速这些应用的创建至关重要。目前已提出了一种与\
  \ `Aneka` 等技术的云应用程序编程接口（API）对接的解决方案，用于解决这一问题 [4]。该系统可以从在线数据库和传感器收集信息，并根据检测到的特定感兴趣的事件发送消息。\n\
  \n图 6.1 显示了设计的概述 [5]。\n\n*   **物理对象（Physical Object）：** 描述了一个直接帮助用户的实体物体，例如灯泡。\n\
  \n![Figure 6.1 未来构建物联网应用的可能结构。返回正文。⏎](img/Figure6_1.jpg)\n\n图 6.1 未来构建物联网应用的可能结构。返回正文。⏎\n\
  \n*   **传感器/执行器（Sensor/Actuator）：** 第一层位于配备了传感器和执行器的微型计算机。执行器通过对传感器采集的关于监测对象或周围环境的数据做出响应来反应。例如，执行器可以根据显示有人存在的传感器数据决定开启或关闭灯泡。\n\
  *   **连接性（Connectivity）：** 下一层让用户可以在任何地方访问全球维网。\n*   **分析（Analytics）：** 该组件负责收集并跟踪传感器数据，同时确认其准确性。\n\
  *   **数字服务（Digital Service）：** 最后一层将之前各级的数字服务安排成易于获取的格式。\n\n由于每一层都显示不同的颜色，因此它们在视觉上都是不一样的。设计物联网应用时，该结构建议了一个层级关系。\n\
  \n### 6.2.1 智能交通\n\n物联网理念预计很快将用于汽车，通过车载自组织网络（VANETs）促进设备间（D2D）通信。通过 `D2D`，设备可以相互发现并交互。这有助于降低延迟，特别是是在车辆间（V2V）通信。在\
  \ 100-300 米的范围内，汽车作为无线路由器或节点与其他车辆形成网络 [6]–8]。一旦离开该范围，就会与网络断开。在智能交通领域已经取得了巨大进展。全球公司已经开发了利用传感器技术进行地图绘制（Street）、让停车变得更简单（Sight）以及让可以通过移动设备叫车（Uber）的工具\
  \ [9]。预计物联网将显著影响驾驶员与环境的互动，尤其是交通。VANET 预计使用的许多通信技术如 图 6.2 所示。\n\n### 6.2.2 智能服装\n\
  \n目前，只有带有电子元件的特种纺织品适用于服装。然而，未来的物联网应用预计将在生产阶段整合传感器层——如导电涂层或导电线。为此，详细说明了三个关键条件：\n\n\
  识别的变量以及旨在监测的精确身体位置需要定制。为了让传感器接收电源并进行通信，层级之间需要连接性。\n\n电控模块可能还包含之前提到的功能的特定操作系统。物联网还可以用于质量控制和产品检测\
  \ [10]。例如，已经开发出一种悬挂设计，可以评估服装的拉伸耐用性和持续使用能力，并检查其外观（包括颜色和合身），以确保符合预设标准 [11]。\n\n\n\n\
  \n\n图 6.2 预计在车载自联网网络（VANETs）中使用的通信技术，包括带有电子控制单元（ECU）和车载传感器的汽车，例如车对车（V2V）、车对基础设施（V2I）、车对路侧（V2R）以及车对传感器（V2S）。返回正文\n\
  \n#### 关键元素：\n\n**电子控制单元 (ECU) 和传感器：** 汽车配备了传感器（用蓝点表示）和 `ECU`（用红点表示），用于监控行驶特性并与周围基础设施进行通信。\n\
  \n#### 网络基础设施：\n\n*   **蜂窝基站 (BS)：** 为整个道路网络提供无线通信覆盖。\n*   **Wi-Fi 访问点 (AP)：** 为道路基础设施和汽车提供本地连接性。\n\
  *   **道路基础设施：** 为了提高安全性并更好地管理交通，结合了停车服务、速度控制结构和交通信号灯等功能。\n\n#### 车对万物（V2X）通信：\n\n\
  车辆可以通过 `V2V` 通信相互交换位置和速度信息。\n\n车辆与道路基础设施（如交通信号灯或标志）使用 `Vehicle-to-Infrastructure\
  \ (V2I)` 通信交换数据。\n\n**车对路 (V2R)：** 关于限速或警告等状况的信息通过道路基础设施发送给车辆。\n\n车辆通过 `Vehicle-to-Sensor\
  \ (V2S)` 通信与外部传感器通信，接收实时交通信息。\n\n**无线接入基础设施范围：** 轨迹图显示了无线通信可能到达的范围，跨越城市并确保车辆的持续接触。\n\
  \n#### 服务：\n\n*   **速度控制：** 利用与路径基础设施的通信来跟踪和调节车辆速度。\n*   **停车服务：** 提供可用停车位位的最新信息。\n\
  *   **交通信息：** 为驾驶员提供有关交通模式和方向的最新信息。\n\n这一互联系统的目标是促进自动驾驶技术的发展，同时优化交通流和安全性。\n\n为了建立安全连接，被认为是信息收集设备的智能表——可以连接到一个类似于智能网关的通信设备。这一点至关重要。该入口可能会实时从提供者获取并共享信息，甚至可以开启或关闭电源\
  \ `[14]`。\n\n此外，通过连接到家电，该网关可能会向下一代电网发送消耗统计数据。智能表预计将直接传输电压和电流值到中央聚合点，最终取代电网使用的许多传感器并节省费用\
  \ `[15]`。\n\n为了在智能电网的区域网（`NAN`）内传输这些数据，人员研究了多种通信策略。例如，为了通过多个中继协作将信息从初始节点传递到目标节点，研究开发了一个使用软件定义无线电\
  \ (`SDRs`) 的实验平台 `[16]`。该配置在室内和室外环境中都得到了测试，表明与不使用协作交互的系统相比，增加中继数量可以提高覆盖距离，同时保持了相当的服务质量（`QoS`），并增加了网络能量节省\
  \ `[17]`。\n\n研究结果之一如图 6.3](#ch06.xhtml#_24032-0872-006-Figure-003）所示，它支持了以下结论：增加中继数量以保持相同的服务质量可以延长网络寿命。考虑到\
  \ `IoT` 系统中的大多数设备由电池供电，这一点尤为关键 `[18]`。\n\n此外，它还为这类网络专门创建了介质访问控制（`MAC`）协议。作者的一组结果如图\
  \ 6.4](#ch06.xhtml#_24032-0872-006-Figure-004）所示。\n\n图中描绘了协作链路和单输入单输出（`SISO`）链路在不同发射功率下提高源目的（`SD`）长度的吞吐量变化。绘图显示，源广播强度为\
  \ `5 dBm` 的协作网络可以实现吞吐量效率与广播强度为 `10 dBm` 的 `SISO` 系统相当。这是一个重要的发现。\n\n### 6.2.4 教育\n\
  \n由于互联网接入已非常普及，学习者和研究人员比以往任何时候都渴望与同伴及学科专家建立联系。世界维网正在成为交换概念和继续研究的重要媒介。预计未来将邀请来自领域的专家通过视频直播进行讲座。自从大规模开放课程（`MOOCs`）推出以来，全球教育得到了极大改善。随着顶尖高校日益提供教师的开放资源，“翻转课堂”理念变得越来越流行。通过这种方法，教师可以在课堂上专注于解决问题和概念，因为学生被要求课外学习内容\
  \ `[19]`。在发展中国家，受限于资金限制导致高等教育机会受阻的学生现在有机会通过 `MOOCs` 和其他在线资源追求基础之外的学习。无论是足不出在家的热门学习者，还是无法支付学费的人，都通过这种接入提高了生活质量。\n\
  \n![图 6.3 网络寿命、覆盖距离与协作中继数量之间的权衡。返回正文。⏎](img/Figure6_3.jpg)\n\n图 6.3 网络寿命、覆盖距离与协作中继数量之间的权衡。返回正文。⏎\n\
  \n**重要特征：**\n\n*   `X 轴` 显示中继或通信节点之间的距离，以米为单位。\n*   `Y 轴` 显示中继的数量（`1`、`2`、`3`）。\n\
  *   网络寿命显示在 `Z 轴`上，该轴以百万秒为对数刻度。\n\n绘图显示，在在中继数量和距离范围内，`LOS`（视距）通信实现的网络寿命比 `NLOS`（非视距）通信更长。\n\
  \n### 6.2.5 环境的跟踪、预测与保护\n\n\n\n\n考虑到大规模城市化和运动性狩猎等有害人类行为对地球造成的持续压力，预计 `IoT` 将在保护生物多样性和稀危物种方面发挥重要作用。全球各机构正在使用启用\
  \ `GPS` 的设备来跟踪这些动物的行为和健康状况，以保护它们。例如，思科使用远距离（`LoRa`）无线连接来追踪人们在犀牛保护区区域的移动。在发生侵入时，可以采取安全措施来保护动物的健康和安全\
  \ [20]。![图 6.4 CT 和 SISO 传输中吞吐量与 S-D 长度的关系。返回文本。⏎](img/Figure6_4.jpg)\n\n图 6.4 CT\
  \ 和 SISO 传输中吞吐量与 `SD` 长度的关系。返回正。⏎\n\n#### 重要特性：\n- X 轴显示了通信设备之间的距离（以米为单位）。\n- 吞吐量由\
  \ Y 轴表示（单位为 `kbps`）。\n\n#### 线条：\n- **协作：** 实黑线（`5 dBm`）\n- 虚黑线：`SISO`（`5 dBm`）\n\
  - **深黑色实线：** 10 dBm `SISO`\n- 实黑线上的圆圈表示协作（`10 dBm`）。\n\n图表显示，对于两种功率水平，吞吐量都会随距离增加而减少，且协作通信在吞吐量方面持续优于\
  \ `SISO`。此外，对于两种通信技术，较高的功率（`10 dBm`）比 `5 dBm` 有更好的吞吐量性能。\n\n此外，`IoT` 还可以帮助解决废物处理问题，特别是在美国，2013\
  \ 年人均每天产生的垃圾平均重量为 4.6 千克。`IoT` 可以通过确定垃圾清理的最佳时间和收集车行驶的最有效路线，协助解决与社区垃圾堆积相关的问题。另一个主要的环保关注问题是森林流失，`Bio\
  \ Carbon Engineering` 正在重新种植一亿棵树，这项努力结合了无人机技术。通过使用无人机调查被砍伐地区以及减少成本和劳动力的精细农业方法，该机构希望实现其目标。最后，`IoT`\
  \ 在预测和减轻自然灾害的影响方面非常有帮助。例如，`Zizmo` 使用连接到云端的传感器来识别震中附近的活动，并提醒附近的邻居。可以开发类似的技术来提高对灾害的响应和准备能力。类似地，`Avatech`\
  \ 使用压力传感器预测雪崩发生的概率。\n\n116.\n\n### 6.2.6 智能农业与耕作\n事实证明，世界水库正在迅速枯竭，因此保护这一基本资源迫在眉睫。据估计，农民利用了地球上\
  \ 70%的淡水，其中 60%由于耗水型作物种植、灌溉基础设施不足以及低效的农业技术而浪费。\n\n传感器配合执行器可以帮助种植者更清楚地了解其运营情况，并通过监控水压和温度等重要参数来最大限度地减少废水。例如，`Macrostrain`\
  \ 创建了一个无线传感器系统，旨在评估葡萄园生长季节的关键状况。通过监测土壤湿度、温度和太阳辐射等因素，这些设备会向农民通知可能影响作物健康的严酷状况。图 6.5\
  \ 概述了 `IoT` 在农业中的潜在用途。\n\n### 6.2.7 医疗保健\n考虑到 `IoT` 丰富的潜在用途，预计它也将转型医疗保健，这并不令人意外。由于有了\
  \ `IoT`，医生现在可以持续关注患者的生理体征。嵌入式系统和无线传感器网络（`WSNs`）的最新进展使得健康监测设备的微型成为可能。这些传感器共同可以创建一个人体传感器网络（`BSN`），通过监测健康指标并通过上下文感知传感增强响应能力。\n\
  \n`BSNs` 的一个常见应用是监测持续的心电图（`ECG`）信号以评估心脏病。此外，与仅基于临床观察的评估相比，这些 `WSNs` 已证明能成功追踪帕金森病患者，因为它们提供了在长时间内收集的可靠数据。例如，研究人员已使用可穿戴传感器评估帕金森病患者的运动模式，实现了高精度的实时监控。`BSNs`\
  \ 在治疗呼吸系统疾病方面也很有用。为了评估这种情况下的呼吸量和频率，网络配备了呼吸设备。收集的信息可以帮助需要呼吸练习的人，这些练习证明对呼吸疾病的康复至关重要。通过使用呼吸传感器，设备帮助患者正确呼吸，这对于他们的愈合至关重要。\n\
  \n### 6.2.8 智能家居/建筑与监控\n在家里，传感器对于防止潜在的健康危害非常有帮助。例如，环境传感器可以监控许多变量，包括温度、湿度、硫化氢浓度、一氧化气体泄漏量以及空气质量，如图\
  \ 6.6\n\n图 6.5 IoT 在农业中的用途。返回文本。⏎\n\n- **田间监控无人机（顶部）：** 无人机提供实时数据以辅助决策，帮助监测作物状况和健康。\n\
  - **水资源管理（右侧）：** 精确监测和自动灌溉是 IoT 驱动设备最大化用水的两种方式。\n- **土壤因素（底部）：** 使用传感器测量湿度和营养水平等因素，以便更好地管理作物生长。\n\
  - **日常作业机器（左侧）：** 集成 IoT 的设备使日常农作活动自动化，提高了生产力并降低了动力需求。\n\n主主题是农业 IoT，它说明了 IoT 如何正在改变农业方法。\n\
  \n![图 6.6 BSN 的组成。返回文本。⏎](img/Figure6_6.jpg)\n\n图 6.6 BSN 的组成。返回文本。⏎\n\n118.\n\n\
  ### 6.2.9 公共安全\n\n\n\n\n设备对设备（D2D）连接是物联网（IoT）改善公共安全的方法之一。设备的广泛部署使得源和目的地之间的多跳交互成为可能，这在危机时期特别为有用。由于大多数电子设备使用电池运行，因此在任何为此类场景构建的网络中，必须将能源效率放在首位。\n\
  \n灾难发生后，许多设备可能会损坏且无法通信。此外，便携电子设备的所有者可能会禁用外部控制，这可能会阻通信。由于内容的敏感性，在灾难和恐怖场景下，阻塞通信并不是选项。因此，在紧急情况下，网络需要是稳健的并能够重新组织自己。\n\
  \n此外，电量不足可能导致许多节点停止传输数据。如果节点具有自主调整传输协议的能力，到达预期位置的概率就会增加。在这种情况下，可以启用 119。“灾难模式”，该模式将使用特定的路由进行低功耗通信，并防止无意义的\
  \ D2D 接触。此外，物联网已经是有效管理人群的重要工具。当局可以利用传感器收集的实时数据，监控人群移动，评估任何安全风险，并做出及时选择，以确保大型活动或紧急情况下的公共安全。\n\
  \n## 6.3 研究挑战\n\n尽管物联网为进一步发展开启了许多有趣的前景，但研究人员继续与阻碍其进展的障碍作斗。本节将试图定义其中的一些问题。\n\n###\
  \ 6.3.1 多功能传感器与技术\n\n第一个问题是处理大量的多样化传感器节点，这使得连接传感器网络的互联网变得非常复杂和多样。由于许多网络使用不同的通信技术，物联网系统通常缺乏一个用于无缝设备识别和标识的一致框架。此外，由于传输的数据量巨大，这些系统通常会遇到延迟和其他传输问题。正在进行的研究的主要领域之一是创建网络协议，以保证物联网支持系统中多个传感设备的数据平稳传输。物联网网络还受益于模块化，这使用户能够独立于单一供应商的产品，设计他们自己的有效对象。\n\
  \n### 6.3.2 物联网与传统 IT 的集成\n\n为了创建一个单一的信息结构，物联网还必须与传统信息技术（IT）平台集成。为了将物联网设备与当前的软件平台集成，创建中间件也是必要的。此外，物联网网络的传感器产生大量的实时数据，这些数据可能对最终用户并不直接相关。终端用户必须具备强大的大数据处理能力才能利用可用信息，而这本身可能被证明是极其困难的。\n\
  \n### 6.3.3 标准化\n\n标准化是另一个需要解决的问题，以提高不同应用程序之间的操作性，并提高整体性能。物联网未来的标准应该促进全球制造商的各种类型传感器之间信息的顺利传输。它们还应该解决安全和无线访问问题，以及为了满足不同部门特定需求的行业特定修改\n\
  \n### 6.3.4 安全协议\n\n保护隐私的强安全机制的增长是物联网标准化的基本组成部分之一。物联网网络依赖云服务器，容易受到黑客攻击。某些工业应用的严格要求可能无法完全完全物联网安全安全安全满足。与无线传感器网络（WSNs）相比，为物联网网络开发加密算法的挑战更大，因为物联网系统连接了大量普通设备，这些设备逐渐收集大量的私有数据。例如，在未来几年，对于使用车载网络（VANETs）的自动驾驶汽车来说，安全的互动将至关重要，以避免导致错误信息引起碰撞等危险场景的活动。同样，医疗领域的人体传感器网络（BSNs）需要稳健的安全协议，在向医生传输医疗数据时保护患者隐私，如图\
  \ 6.7 所示。\n\n![图 6.7 AI 的新进展。返回正文。⏎](img/Figure6_7.jpg)\n\n图 6.7 人工智能的新进展。返回正文。⏎\n\
  \n**医疗保健**：用听诊器和水滴等医疗符号显示。\n\n**金融**：以纸张和与钱相关的符号为例。\n\n**制造业**：由机械和工厂的图标显示。\n\n\
  **零售业**：用店面图像或购物车显示。\n\n**教育**：用学术标志和地球仪表示。\n\n**交通运输**：使用卡车和其他车辆图标代表交通。\n\n**劳动力**：由与工人相关的图标指示。\n\
  \n121.\n\n## 6.4 商业模式\n\n用于引入资金并从运营中盈利的商业计划被称为商业模式。由于物联网生态系统的特性，企业必须与竞争对手以及其他行业的公司合作。因此，传统的商业模式不适用于物联网现象。\n\
  \n连接在这些网络中的海量设备、将最新的物联网创新纳入实用物品和产品的必要性，以及在这个快速增长领域围绕利益相关者角色、组织和治理的不确定性，是当前物联网的一些困难。文献中已经研究了许多物联网商业模式的框架。“需求目标”（DNA）代表了这样一种模型。在这种范式中，“需求”指的是与消费者的关系，“目标”指的是赚钱等预期结果，而“设计”指的是结构的关键组成部分，例如资源和活动。\n\
  \n物联网服务的一个独特元素是它们能够随时间跟踪用户行为和反馈的能力，这让公司能够为其产品添加新功能。这符合服务主导型商业模式的定义。\n\n此外，该模型可以用于高效的过程优化和预测。与公司单独创造价值的传统模型不同，在这种基于服务的业务策略下，客户和公司作为价值创造的合作者共同工作。表\
  \ 6.1 阐述了基于物联网业务中以网络为中心视角的服务型模型的核心组成和障碍。\n\n此外，另一种被称为“数字充电商品”的物联网特定公司结构有六个主要组成部分。这些元素包括诸如“物理免费”的想法，它在提供实体产品之外还提供免费的数字服务，122.例如维护或安装指南。通过数字插件，消费者除了商品提供的之外，还可以从原始销售者或其他来源购买额外服务。被称为“数字锁定”的基于传感器的电子验证程序可以防止伪货并维护保证。\n\
