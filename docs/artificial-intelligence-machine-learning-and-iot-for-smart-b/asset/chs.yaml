  \n图 11.8 根据账户休眠状态的流失者与非流失者。返回文本。⏎\n\n## 11.5 方法论\n\n根据我们的研究，流失预测中最常用的机器学习算法是逻辑回归、朴素贝叶斯、RF\
  \ 和 SVM (Lalwani 等人，2022)。在工作中，我们使用了三种算法，即 `KNN`、`SVM` 和 `RF`，如图 11.9 所示。\n\n###\
  \ 11.5.1 SVM\n\n名为 `SVM` 的流行监督学习概念经常用于回归和分类问题。`SVM` 以最大的间隔分离不同的数据点。在二维空间中，分离平面被称为边界，而在高维中，它被称为平面\
  \ (Ramadevi 和 Das，2024)。\n\n\n\n\nSVM 的主要优点是它在高维空间中非常高效，并且仅使用一小部分训练数据即可构建决策边界。SVM\
  \ 最适用于记录数少于属性数量的问题。它也有一些缺点。结果可能会受到核函数选择和其他相关变量校准的影响。此外，研究已表明它对离群值敏感。\n\nSVM 在某些应用中非常流行。它被广泛用于文本分类（如垃圾邮件分类）、图像分类（如识别图像对象）以及生物信息学（如识别基因和蛋白质）。\n\
  \n### 11.5.2 随机森林\n\nRF 被认为是机器学习中一种用于回归和分类任务的流行集成学习概念。它在训练阶段构建多棵决策树。在分类任务中，最终类别通过计算每棵树输出的众数来确定的。对于回归任务，则通过计算各个预测值的平均值来实现。`RF`\
  \ 的思想基于装袋算法（bagging algorithm）的概念。根据该算法，可以使用不同比例的数据集（`RF` 中的决策树）来训练若干个算法，这些数据集是通过有放抽样创建的，从而构建了树与树之间的差异。这使得\
  \ `RF` 比单棵树更强大，且不易发生过拟合（Barreñada et al. 2024）。森林中的不确定性源于洗牌的数据点和特征选择。在树的每个节点上都会随机选择一组属性，然后计算最佳划分点。这种随机性通过降低树与树之间的依赖性，使得集成思想变得相对有效。\n\
  \n`RF` 的一个显著优势是它能够在不进行特征选择的情况下监督具有大量属性的大数据集。它可以捕捉特征之间复杂的相互作用，并在处理数值和类别数据方面具有高度灵活性。此外，`RF`\
  \ 对过拟合具有鲁棒性，特别是在大型集中，因为它通过平均多棵树的输出来平滑噪声，并防止模型从数据中的噪声中学习。这使其成为各种现实应用的极选择，在这些应用中，数据可能存在噪声，或者特征与目标变量之间的关系可能是复杂的，单决策树难以捕捉。\n\
  \n`RF` 还会计算特征重要性因子来理解数据。该参数有助于根据重要性对特征进行排序，并降低每棵树的纯度。这种方法有助于移除不重要的特征，特征重要性指标通常用于特征选择，即通过只考虑最重要的属性来移除不重要的特征，以精简模型、提高准确性并缩短训练时间。`RF`\
  \ 还能处理缺失数据，如果某个属性的值缺失，则使用交替特征进行划分。\n\n该算法也有许多缺点。该算法最主要的缺点是在程序上成本可能很高，并且消耗大量存储，特别是对于巨大的数据集和大量的树而言。其次，随着树数量的增加，推断系统变得具有挑战性。与可以轻松可视化和理解的单决策树相比，森林很难解释，这使得决策变得困难。\n\
  \n`RF` 是机器学习领域中被广泛接受和充分利用的算法之一，因为它在处理各种数据和密度方面提供了适应性、强度和效率。它被用于许多领域，例如金融领域的信用评分计算、医疗保健领域的不同疾病预测，以及营销领域的客户细分。简而言之，`RF`\
  \ 是一种极其强大的工具。\n\n### 11.5.3 KNN\n\n`KNN` 是一种用于回归和分类的易于实现且高效的算法。它基于以下规则的监督学习：相似的数据点预计会有相关的结果。`KNN`\
  \ 在分类中采用多数投票法，在回归中采用平均法。最新的特性是，`KNN` 从训练数据集中识别 `k`（Barreñada et al. 2024）。`k` 是用于决定考虑邻数量的变量。根据特定问题使用欧几里得距离、闵可夫斯距离或曼哈顿距离计算距离。\n\
  \n`KNN` 的主要优势是简单易操作。该模型没有训练阶段，而是保存所有训练数据并仅在分类时执行计算。`KNN` 被称为“懒学习器”或基于实例的学习方法，它应用于整个数据集。由于是非参数的，因此不做出任何假设。这使得\
  \ `KNN` 非常灵活，可以解决大量问题。这种灵活性使得 `KNN` 在决策边界不对称或属性与标签之间的关系复杂的情况下特别有效率。\n\n`KNN` 的灵活性也有许多缺点。最大的短板是程序执行效率低下，特别是对于庞大的数据集。由于该模型涉及估计最新数据特征与训练数据集中所有其他实例之间的空间，随着数据集的增加，预测阶段可能会变得很长。这种担忧在高维空间中被加剧。随着特征数量的增加，数据点之间的差距变得不再确定，这使得模型难以正确找到最近邻居。特征缩放非常重要，以确保所有属性都均匀地参与距离估计过程。这个问题可以通过先应用归一化来减轻。\n\
  \n`KNN` 的另一个缺点是选择 `k` 值（计数的邻居数）的最佳值。`k` 值较会导致模型对噪声敏感，导致过拟合，而较大的 `k` 值可能导致欠拟合。这个问题可以通过交叉验证来解决，交叉验证用于为已知问题寻找最佳\
  \ `k` 值。此外，`KNN` 对距离参数的偏好敏感，算法的准确性可能会根据所使用的方法产生很大波动。尽管有这些缺点，`KNN` 的灵活性简单性使其成为许多机器学习任务中合适的标准模型。\n\
  \n## 11.6 结果\n\n\n\n\n在完成初始预处理和特征分析后，我们对三个不同的分类器进行了一系列实验。在本章中，我们使用了三种机器学习算法，如 `KNN`、`decision\
  \ tree` 和 `RF`。数据集按照 7:3 的比例分为训练集和测试集。模型的性能根据`precision`（精确率）、`accuracy`（准确率）、`F1-score`\
  \ 和 `recall`（召回率）指标进行评估。这指标主要取决于四个因素，即 `True Positive`（真正例）、`True Negative`（真负例）、`False\
  \ Positive`（假正例）和 `False Negative`（假负例）。在流失预测的背景下，这四个因素见表 11.3。\n\n当这些衡量标准以 4x4\
  \ 矩阵的形式表示时，被称为混淆矩阵，如表 11.4 所示。\n\n对于流失预测，`FN` 的数量应该少于 `FP` 的数量。背后的原因是如果未能及时识别不满的客户，银行服务将无法采取预防措施（Burez\
  \ and Van Den Poel 2009）。此外，流失的客户不仅会导致巨大的收入损失，还会影响未来的客户获取，因为银行服务严重依赖口碑评价。同时，`FP`\
  \ 的数量将为企业为不需要留存的客户制定留存策略带来不成本，如图 11.5 所示。\n\n`TP` 和 `TN` 之和代表被正确识别的客户数量，`FN` 和 `FP`\
  \ 之和描述了识别错误的客户数量。评估机器学习模型实现程度的指标可以使用混淆矩阵和公式 (11.1)–(11.4) 来计算（Das and Srivastava\
  \ 2023）。\n\n### Accuracy\n它被用于计算正确预测的总数。`RF` 模型实现了约 86% 的最高准确率。`KNN` 和 `decision\
  \ trees` 实现了约 76% 和 79% 的准确率。\n\n```\nAccuracy = (T[i]+T[j])/(T[i]+F[j]+T[j]+F[i])\
  \ (11.1)\n```\n\n#### 表 11.3 真正例、真负例、假正例和假负例说明返回正文\n\n| **符号** | **含义** |\n| ---\
  \ | --- |\n| True Positive (TP) | 正确预测为流失客户的客户数量 |\n| True Negative (TN) | 正确预测为非流失客户的客户数量\
  \ |\n| False Positive (FP) | 错误预测为流失客户的客户数量 |\n| False Negative (FN) | 错误预测为非流失客户的客户数量\
  \ |\n\n#### 表 11.4 混淆矩阵返回正文\n\n| **实际** | **预测** |\n| --- | --- |\n| True Positive\
  \ | False Positive |\n| False Negative | True Negative |\n\n#### 表 11.5 性能指标\n\n\
  | **分类器** | **Accuracy** | **Precision** | **F1** |\n| --- | --- | --- | --- |\n\
  | KNN | 0.76 | 0.80 | 0.86 |\n| Decision Tree | 0.79 | 0.87 | 0.87 |\n| Random Forest\
  \ | 0.86 | 0.88 | 0.92 |\n\n### Precision\n它是 `TP` 的百分比。\n\n```\nPrecision = T[i]/(T[i]+F[j])\
  \ (11.2)\n```\n\n### Recall\n它描述了被正确预测的 `TP` 数量。\n\n```\nRecall = T[i]/(T[i]+F[j])\
  \ (11.3)\n```\n\n### F1-Score\n它是 `recall` 和 `precision` 的调和平均数。\n\n```\nF1 = 2\
  \ * (precision * recall) / (precision + recall) (11.4)\n```\n\n## 结论\n近年来的发展表明，机器学习模型在流失预测中非常有效。在完成初始预处理和特征分析后，我们对三个不同的分类器进行了一系列实验。在本章中，我们使用了三种机器学习算法，如\
  \ `KNN`、`decision tree` 和 `RF`。数据集按照 7:3 的比例分为训练集和测试集。模型的性能根据`precision`、`accuracy`、`F1-score`\
  \ 和 `recall` 指标进行评估。\n\n\n\n\n\n* Chen, Ssu-Han. 2016. “在线客户流失预测的 Gamma CUSUM 图方法。”\
