  \ Process. Manag. 2020, 26, 4. 返回文本。⏎\n\n# 机器学习技术用于商业智能与决策\n\nVijay Anand Rajasekaran,\
  \ Magesh Guru, Veena Grover DOI: [10.1201/9781032051873](https://doi.org/10.1201/9781032051873)\
  \ \n\n## 引言\n\n商业智能（BI）是收集和分析数据以寻求见解并进行决策的过程。传统的，商业智能严重依赖描述性分析，提供对过去的回顾[1–3]。大数据是指数据在数量、多样性和速度上的爆炸，这使得传统的\
  \ BI 工具无法处理，迫使其从中提取价值，而机器学习已被证明是游戏规则改变者。因此，它是补充商业智能框架不可或缺的工具。\n\n它有助于商业智能从描述性和诊断性分析向预测性和指导性分析转型。预测性分析预测未来事件。指导性分析则为预期结果提供行动策略。这种高级分析能力允许企业预测客户需求、优化运营并识别市场新机会。此类机器学习驱动的商业智能系统超越了静态仪表板和基于规则的报告，让组织享受动态和实时的见解。\n\
  \n这是机器学习在商业智能背景下的特征：机器学习实际上可以处理非结构化数据的样本。传统方法通常限于关系数据库中的结构化数据，而机器学习算法可以处理文本、图像、视频和其他形式的非结构化数据。这种能力在当今数字世界中更为相关，因为机构正在社交媒体、客户评论、物联网设备等方面收集大量的非结构化数据。例如，情感分析是机器学习的一个领域，企业可以根据社交媒体上的可用文本数据理解客户的意见和偏好。这种见解对于定制营销策略具有极高价值[4–6]以增强客户体验并确保品牌忠诚度。机器学习影响商业智能的另一种重要方式是与其实时决策潜力有关。\n\
  \n传统的流程按时间分批进行大部分商业智能。通过来自物联网传感器、交易系统甚至在线平台的流式数据，机器学习算法可以为业务人员提供即时见解和建议。例如，在电子商务网站案例中，动态定价算法将使用机器学习根据需求、竞争定价以及库存水平动态更新价格。同样，在金融服务中，在使用机器学习的异常欺诈检测系统中，异常交易模式将在发生时立即被标记，从而确保实时干预的可能性。最后，但同样重要的是，机器学习技术的多样性凸显了处理许多业务挑战的灵活性。\n\
  \n\n\n\n监督学习、无监督学习、强化学习和深度学习，都更适用于特定的 BI（商业智能）领域使用场景。监督学习基于标记数据集提供解决方案，为大多数与预测相关的任务提供方案，例如销售预测、客户细分和信用风险评估。深度学习是\
  \ `ML` 的子领域，其通过神经网络的应用在处理高维数据时取得了令人瞩目的成果，这为图像识别处理、语音处理和自然语言处理（NLP）等领域带来了先进进展。在 BI\
  \ 领域采用 `ML` 方法时会出现一些问题。\n\n这些问题中的第一个是数据样本的质量和可用性。`ML` 算法的好坏取决于输入其中的数据。质量较差或不完整的数据会导致偏见和错误的决策，而且\
  \ `ML` 系统的实际实现和配置投入了大量精力——基础设施、人才和工具。大多数公司并不擅长此，因为将 `ML` 引入 BI 对能力有很高的要求——数据科学、编程技能以及其所在工作领域的某些知识。此外，在决策过程中应用\
  \ `ML` 时，还存在数据隐私、公平性和透明等重大的伦理问题。只有当技术创新与强大的治理结构同时出现时，才能解决此类问题。但考虑到与 BI-ML 相关的所有问题，其收益不容忽视，许多组织正在少数部门内开展工作，并引入\
  \ `ML` 来支持其决策并在竞争中占据更好位置。\n\n零售商使用基于 `ML` 的推荐引擎来个性化客户的购买体验，从而提升销售和客户满意度。预测性分析协助医疗领域的临床人员预测患者需求、优化治疗方案并改进结果。在制造业中，通过\
  \ `ML` 进行预测性维护减少了停机时间并最大化了运营效率。可解释人工智能 (`XAI`)旨在使 `ML` 系统变得透明且可解释。长期以来，深度神经网络等复杂模型一直受到“黑箱”问题的困扰。此外，通过联邦学习（一种允许在不共享原始数据的情况下进行协作模型训练的技术），医疗、金融和其他行业的隐私保护分析的未来正在开启。`AutoML`\
  \ 自动化了构建和调优 `ML` 模型的过程，使高级分析变得变得民主化，并赋予了组织可以利用的少量数据科学专业知识以在 BI 中使用 `ML`。总之，释放数据样本的潜力将彻底改变\
  \ BI 和决策。\n\n36. 从描述性分析向预测性和指导性分析的转变将使企业能够以竞争优势发现运营趋势。它的转型是多功能性的，开启了分析非结构化数据的能力、做出实时决策的可能性、解决多样化问题的能力并改变了\
  \ BI 系统。随着企业在数字化旋涡中航行，如何将 `ML` 集成到 BI 系统将成为决定组织智能数据驱动策略的关键组件。本章描述了驱动这些进展的特定 `ML`\
  \ 技术，并阐述了它们如何应用、以及在智能业务管理中的优势和挑战。通过对这些主题的全面涵盖，读者将能够理解 `ML` 将如何改变 BI 的未来面，以及它是如何改变决策过程的。\n\
  \n### 3.1.1 BI 的定义与范围\n\nBI 是过程、技术和工具的集合，能够将原始数据转换为洞察，为业务每个部门做出妥善决策提供信息。BI 是基于组织战略的数据分析核心构建过程，该战略基于通过增强运营效率来改善客户体验，从而获得竞争优势。随着时间的推移，它反映了技术的进步和数据格局日益的复杂性。今天，BI\
  \ 通用称为工具的集合（如数据分析、可视化和报告），这些工具支持基于组织的决策。它涵盖了从数据采集、以可用格式处理、分析趋势到向利益相关者直观呈现结果的全端到端流程。\n\
  \n通常，大多数 BI 系统包含许多工具和技术，涉及数据仓库、提取、转换和加载 (`ETL`) 过程、在线分析处理 (`OLAP`)。这些部分集成在一起以确保数据集成、实时分析和自动化报告，这对于在竞争环境中生存的现代企业至关重要。\n\
  \n### 3.1.1.1 BI 的范围\n\n数字时代下 BI 的地平线由于大数据技术、云计算和人工智能的快速创新已经跨越了多个边界。到目前为止，BI 只能实现静态报告和仪表板；相反，动态决策和实时决策已属于\
  \ BI 的范畴。这些变化 [7–9](#ch03.xhtml#_24032-0872_chp003_ref9)] 重写了 BI 范围的规则：\n\n> 数据管理与集成\
  \ BI 的核心在于帮助管理和整合来自各种来源的数据。现代组织从交易系统、客户交互、供应链运营甚至 IoT 设备中产生海量数据。BI 系统在强大的数据集成框架中聚合数据，以确保一致性、准确性和可靠性。数据仓库解决方案提供了一个中心存储库，用于存储和组织数据以便于访问和分析。BI\
  \ 中的数据集成不仅限于传统数据库典型的结构化数据，还包括半结构化和非结构化格式，如电子邮件、社交媒体内容、传感器读取和多媒体文件。这种能力有助于捕捉业务运营和客户行为的完整且全的画面。\n\
  \n描述性、预测性和指导性分析 BI 可以认为涵盖了某些分析能力，从非常描述性的分析到稍微先进的预测性和指导性方法。描述性分析涉及总结过去的历史，以解释在那段时间内发生了什么。\n\
  \n预测性分析通过使用 `ML` 算法将 BI 提升到另一个水平，对趋势和结果给出未来预测。通过预测性 BI 模型，企业可以预测客户群的流失、需求波动甚至供应链的中断风险。指导性分析再次更进一步，从预测的场景中开出最佳行动方案。因此，在提取实时交通数据结合过去趋势后，物流公司将获得关于最高效率路线的指导性见解。\n\
  \n\n\n\n\n# 实时决策支持使现代 BI 具有高度的转型性：提供实时决策支持能力。在今天，特别是在快速变化的业务环境中，任何组织都无法跟上变化的速度进行数据分析和反应。BI\
  \ 系统中的实时分析和数据可视化工具使利益相关者能够监控关键性能指标 (KPI)、识别异常并做出实时响应。例如，电子商务网站可以根据客户的实时需求和竞争对手的活动动态调整价格或库存。这种实时能力将\
  \ BI 的范围从传统业务领域扩展到金融交易、网络安全和物联网（IoT）驱动的行业。它使企业能够保持敏捷性 `[10–12`]，并通过实时的可执行见解保持主动性。\n\
  \n## BI 工具的自助服务民主化是近期过去的主要趋势之一；它已经扩展到了非技术用户。自助服务 BI 解决方案允许业务用户自行浏览和分析数据，而无需寻求 IT\
  \ 团队或数据科学家的服务。这些通常带有直观的用户界面、拖拽功能和自然查询能力，帮助跨部门的利益相关者独立探索数据，以获得对流程的洞察。因此，自助性质使其应用涵盖了每个行业和组织体系中的每个层级，从使用仪表板制定战略计划的执行团队，到为运营决策寻求信息的前线员工。\n\
  \n## 跨行业应用 BI 具有多功能性，适用于每一个行业。在零售业，它改进了客户细分、库存管理和营销活动的执行。医疗保健领域利用 BI 更好地优化患者护理资源、资源分配并优化运营。\n\
  \n## 高级数据可视化和报告可视化是 BI 的基石。因此，人们可以使用图表、图形、热力图等工具视觉化地解释复杂的信息。可视化工具曾曾非常复杂的，但现在通过更简单、更具互动性的方式呈现见解，使其进入了一个完全不同的领域，以便与\
  \ 38. 更广泛的用户进行交流。仪表板促进了对丰富见解的交互式探索，用户可以深入研究数据点或关系，以发现某些静态报告无法呈现的发现。BI 报告已进一步发展，演变为自动的、AI\
  \ 驱动的自然语言叙述，总结数据洞察中的趋势，并将技术分析与业务语言接起来，使其在过程中易于解释并具有可操作性。\n\n## 协作与移动 BI：协作是 BI 的本质。特别是对于大型组织而言，这是一种内在属性，因为决策过程跨越了许多利益相关者。协作\
  \ BI 允许团队通过集成的通信功能共享见解并标注报告，从而使战略一致。\n\n## 伦理与合规维度：随着 BI 系统日益复杂且无处不在，伦理考量随同合规性问题一起出现，这些必将属于\
  \ BI 系统的范畴。例如，所有的 BI 活动应完全符合 GDPR 和 CCPA，特别是数据隐私立法。此外，它们应该考虑有关数据分析和决策系统的偏差、透明度和问责制的伦理问题。通过这种方式，组织通过将这些\
  \ XAI 技术集成到 BI 系统中克服了这些风险，并在过程中使见解更有信息量且易于解释。\n\n### 3.1.1.2 商业智能 – 意义与范围\n\n它随着技术的进步、数据使用量的增加以及在决策过程中对此类信息依赖程度的提高而演变。BI\
  \ 在现代业务战略发展中的潜力作用几乎是无限的，从管理不同的数据源和复杂分析到实时决策和协作。它的范围正随着自助工具、移动 BI 和伦理框架的演变，成为任何希望在这一数据驱动的世界中领先的组织的不可或缺的工具。从本质上说，BI\
  \ 的核心功能是将原始数据转化为执行的见解，帮助企业应对不确定性并抓住机会，从而获得可持续的增长。。当企业在数据洪流中运行并需压力下做出及时决策时，机器学习通过跨复杂数据的自动模式、趋势发现以及预测性输出等形式来满足这一需求，使决策者能够在正确的土地上进行战略移动。\n\
  \n### 3.1.2 机器学习变革决策范式\n\n企业传统的决策方式涉及直觉、经验和基于规则的系统。在动态环境中，由于不断变化的复杂性因素，这些决策模式将暴露出弱点。机器学习变革了这一范式：数据驱动决策\
  \ (DDDM) 是基于证据而非主观的见解。通过 ML 模型分析获取的历史数据，提取出的模式关系是人类分析师无法感知的。这些发现为不同业务功能（包括营销、运营和财务）的明智决策形成了基础。机器学习对决策艺术产生的\
  \ 39. 最关键的影响之一在于其处理海量、高维数据集的能力。在信息来源方面，现代组织现在从许多来源产生信息：可以来自客户互动、物联网设备和社交媒体。ML 算法非常高效地处理这些信息，从而提取有用特征并过滤掉噪声进行精确分析。这对于在考虑各种变量和限制的情况下做出决策的零售、医疗保健和制造业非常重要。\n\
  \n#### 3.1.2.1 提高预测准确性\n\n### 3.1.2.2 实时决策支持\n\n\n\n\n在当今瞬息万变的商业环境中，竞争优势将取决于实时决策。因此，`ML`\
  \ 将促进即时决策，因为它能够对流数据进行实时处理并即时交付可操作的洞察。这在动态定价、欺诈检测和供应链优化等情景中变得尤为重要。电子商务平台是一个经典的例子，`ML`\
  \ 算法可以根据需求、竞争对手定价和库存水平动态调整价格。因此，金融服务中的此类异常可以通过异常检测模型自动标记，这些模型通过扫描实时交易数据来发现可能的欺诈活动。提供速度与准确性融合的高级\
  \ `ML` 架构支持实时决策。在线学习算法与流处理框架的集成，帮助企业在新数据到达时不断更新其模型。因此，这种方法将导致更低的延迟和更好的响应，且决策是基于过程中范围内最新信息做出的。\n\
  \n### 3.1.2. 个性化与以客户为中心的策略\n\n`ML` 驱动决策的一个关键优势是，它能够实现独特客户体验的个性化。由于零售、娱乐和医疗健康领域的客户需求和偏好差异巨大，个性化变得越来越重要。因此，`ML`\
  \ 模型将通过客户数据来提供推荐、内容和服务，旨在提供更令人满意和更高忠诚度的体验。\n\n个性化可以通过推荐系统中的协同过滤和深度学习等方法来体现。此类系统使用过去的交互、购买历史以及有关产品和服务的上下文信息，来推荐与客户选择最接近的内容。个性化驱动了客户体验的提升，并产生了诸如销售额增长和流失率下降等业务成果。对于治疗计划，可以发现无价的\
  \ `ML` 算法，它们能够分析从病史、遗传信息到健康部署指示的实时指标等患者数据。这被广泛认为归类于精准医学范畴，是 `ML` 更具革命性的应用之一，在这一过程中，决策是根据个人的独特特征进行定制的。\n\
  \n### 3.1.2.4. 优化运营与资源配置\n\n运营效率是业务成功的最重要的决定因素之一，`ML` 在流程优化和资源配置方面发挥着非常重要的作用。通过分析运营数据，`ML`\
  \ 模型可以识别效率低下、预测瓶颈并建议改进策略。制造业中的预测性维护模型分析设备数据以预测潜在故障，从而确保主动维护并减少停机时间。在物流领域，`ML` 驱动的算法为送货车辆计算最高效路线，从而减少燃料消耗和交付延迟。不确定性和风险是决策的自然伴生物。`ML`\
  \ 提供了量化风险甚至更好地缓解风险的工具。通常情况下，概率模型（如贝叶斯网络）允许决策者为每组特定的结果得出某些概率，并附带相应的风险估计。将信息纳入决策框架中可以提高准确性，进一步赋能组织做出更明智的选择并管理权衡。\n\
  \n### 3.1.2.5. 伦理与可解释性挑战\n\n尽管 `ML` 在决策方面有很多优势，但它在伦理和可解释性方面面临挑战。决策者应确保模型足够透明和公平，以避免延续可能导致歧视性结果的偏差。例如\
  \ `[1, 2, 10]`，有偏见的训练数据将导致偏见的预测，例如在招聘、贷款或法律执行的决策中。\n\n`XAI` 技术通过使 `ML` 模型更具可解释性和透明度来处理所有挑战。这为决策者提供了模型模型预测背后原因的知识，并在机器决策中培养了信任和责任感。这在医疗保健或刑事司法等高风险领域中变得尤为重要，因为其影响是深远的。\n\
  \n`ML` 在决策中起着变革性的作用。这意味着在数据驱动的世界中，组织内部应对挑战和机遇的方式发生了变化。这是大多数企业正在将 `ML` 集成到其决策框架中的领域，但数据相关问题的伦理、可解释性和质量问题也随之产生。组织应该通过采用良好实践、利用\
  \ `XAI` 进展以及实时分析，并将人类专业知识与机器智能相结合，从而释放 `ML` 的全部力量，做出明智且基于证据的决策。\n\n41.\n\n### 3.1.3.\
  \ 集成 BI 与 ML 的重要\n\n`BI` 与 `ML` 的融合是组织感知和执行数据驱动决策（DDDM）的一种新范式转变。虽然 `BI` 传统被用于帮助组织和可视化数据，但它往往无法带来预测性或指导性的洞察。\n\
  \n#### 3.1.3.1. 提高 BI 的预测能力\n\n旧的 `BI` 系统主要用于描述性和诊断性分析。描述性分析显示发生的事件，而诊断性分析描绘了原因。这种方法对于理解过去表现至关重要，但在预测未来结果方面滞后。`ML`\
  \ 通过在 `BI` 中实现预测性和指导性分析，弥补了这一差距。例如，`ML` 结合 `BI` 准确预测销售趋势、需求激增或客户流失倾向的能力，是使这种 `BI`\
  \ 从反应型转变为前瞻型以指导战略规划的关键。这些能力 `[11, 12, 13]` 增强了 `BI` 的效用，帮助决策者应对未来挑战并利用新兴机会。\n\n\
  #### 3.1.3.2. 洞察自动化与减少人类偏差\n\n`BI` 过程通常需要大量的人工干预，从数据准备到结果解读。这种对主判断的依赖引入了偏差风险，并向不恰的方向扭斜洞察，使其在决策中并非最优。在\
  \ `ML` 的帮助下，与数据分析和洞察生成相关的大部分领域将实现自动化。聚类、异常检测和 `NLP` 等技术使 `ML` 模型能够客观地分析数据，并在此基础上产生可能被忽略的洞察。\n\
  \n例如，在零售业，`BI` 结合 `ML` 算法可以捕捉客户行为的细微变化，预示新兴趋势的到来，并在无人工干预的情况下做出可操作的建议。集成 `ML` 的 `BI`\
  \ 系统可以检测公司生产数据中的异常，使相关的利益相关者能够预警可能加剧的生产问题。作为回报，企业就可以开始自动化那些可能增加决策者认知负担的过程，例如将他们引导至战略重点关注。\n\
  \n\n\n\n### 3.1.3.3 实时分析与决策\n\n当代业务环境的动态变化要求实时分析。通过批处理运行 `BI` 系统在跟上实时生成的信息的速度和数量方面面临着巨大挑战。通过采用\
  \ `ML`，`BI` 具备了实时数据处理和分析的能力。实时分析将对电子商务、金融和供应链管理等领域大有裨益。例如，运行在电子商务平台上的实时动态定价算法利用\
  \ `ML`，使得价格能够根据需求变化、竞争对手报价和库存水平进行调整。在金融领域，集成了 `ML` 的 `BI` 系统允许对交易流进行欺诈监控，以便及时进行干预。所有这些应用都反映了\
  \ `ML` 如何增强 `BI` 洞察的时效性和相关性，使决策始终基于最新的数据样本做出。\n\n### 3.1.3.4 个性化与以客户为中心的策略\n\n当与\
  \ `BI` 的报告和可视化能力相结合时，这些洞察可以通过直观的仪表板呈现，供营销和销售团队使用。例如，通过 `ML` 推荐引擎，一旦与 `BI` 应用集成，企业就可以确定特定客户群体最可能通过营销活动购买哪些产品。在健康领域，通过\
  \ `ML` 模型分析患者数据将识别出特定的治疗方案，并由 `BI` 工具为他们可视化这些方案。因此，`ML` 和 `BI` 的共同努力分别提高了以客户为中心的实践在参与度和收入方面的准确性和潜在影响。\n\
  \n### 3.1.3.5 应对大数据挑战的可扩展解决方案\n\n这对传统的 `BI` 系统构成了严峻挑战，数据的规模、多样性和速度正威胁着传统的 `BI` 系统。随着组织日益依赖于来自社交媒体、IoT\
  \ 设备等各种来源的非结构化数据，对可扩展解决方案的需求变得迫切。。`ML` 算法可用于处理和分析海量高维数据；因此，它们适用于大数据挑战。`ML` 与 `BI`\
  \ 的集成使企业能够在不加重现有基础设施负担，从复杂的数据集中得出可操作的洞察。\n\n### 3.1.3.6 提高运营效率\n\n企业成功的最重要因素之一是运营效率，`ML`\
  \ 和 `BI` 的集成将帮助简化并优化流程。基于 `ML` 的自动化 `BI` 系统可以识别低效率环节、预测可能的瓶颈，并建议改进这些低效率瓶颈的措施。例如，在物流领域，`ML`\
  \ 算法分析所有路线数据并建议采取最高效的道路进行交付，从而减少燃料消耗并加快交付。这些洞察在 `BI` 仪表板中进行可视化，并提供可操作的建议以提高管理人员的绩效。预测性维护是集成\
  \ `ML` 的 `BI` 系统在各个制造和能源领域的另一个非常关键的应用，因为它能够利用设备传感器数据预测故障，并随后采取预防性措施。`BI` 接口为组织提供了减少维护成本的同时防止停机时间的洞察。因此，`ML`\
  \ 与 `BI` 之间的关系从此提高了其运营广泛流程的业务效率。\n\n### 3.1.3.7 支持伦理决策与治理\n\n`ML` 与 `BI` 的集成在伦理决策和治理中发挥着非常重要的作用。随着企业变得更加数据驱动，决策过程中对透明度、责任和公平的需求至关重要。`ML`\
  \ 算法可以识别数据中的偏差，从而在问题影响结果之前标记出来。如果这些洞察与 `BI` 结合，就可以为利益相关者可视化，从而更好地为伦理考虑的讨论提供信息。\n\
  \n例如，在人力资源领域，可以通过运行 `ML` 的 `BI` 系统分析招聘数据，来确定系统是否存在性别和种族偏差。这会导致 `BI` 仪表板上的判定，因此组织可以纠正其行动路线以提高公平性。同样在金融服务领域，组织可以确信信用评分模型是否公平，因为\
  \ `BI` 与 `ML` 的集成将符合监管标准。\n\n例如，在医疗保健领域，`XAI` 将解释为什么特定的 `ML` 模型建议特定的治疗方案。`XAI` 的可解释性与\
  \ `BI` 的易用性相结合，使组织能够自信且负责任地应用来自 `ML` 的洞察。从自动化洞察和实现实时分析，到驱动个性化和支持伦理治理，`ML` 驱动的 `BI`\
  \ 系统赋予了组织适应数字时代复杂性的能力。在公司应对数字时代的挑战与机遇时，正是 `BI` 与 `ML` 的集成将在塑造战略和结果方面产生差异影响。\n\n\
  ## 3.2 ML 技术概述\n\n在此背景下，在 `BI` 中使用 `ML` 是各种有助于解决不同业务问题的技术的结合。每种技术在趋势预测、客户细分、战略决策和隐藏模式检测方面都有优势和能力。\n\
  \n### 3.2.1 BI 应用中的监督学习\n\n监督学习是 `ML` 中最基础的技术之一，算法从带标记的训练数据中学习，以预测未见实例和样本的结果。这种过程涉及使用预测模型将一组输入变量（特征）映射到目标变量（标签）。它已成为\
  \ `BI` 领域的基石之一，从而促进了预测、分类甚至回归分析的应用。\n\n### 3.2.1.1 在 BI 中的应用\n\n监督学习的应用在预测性分析中特别强大，而预测性分析是\
  \ `BI` 的重要部分。例如，在销售预测中应用了回归模型，因为可以使用过去的销售数据或输入特征来预测未来收入或目标变量。识别出的趋势和季节性可以帮助企业优化库存水平、规划营销活动并有效分配资源。\n\
  \n### 3.2.1.2 挑战与机遇\n\n\n\n\n尽管监督学习非常有效，但它需要标记数据集的存在，而开发这些数据集是一项耗时且昂贵的工作。然而，更好的数据标注工具和合成数据生成的新技术缓解了这方面的挑战。`AutoML`\
  \ 平台的出现正在简化监督学习模型的开发，并让技术性较的业务实体可以使用它们。\n\n### 3.2.2 无监督学习：数据聚类与分割\n\n与监督学习不同，无监督学习不使用标记数据；相反它试图在数据样本中寻找模式或关系。在探索性数据分析和\
  \ BI 设置中，某些技术是必要的。基于相似性的数据点分组和异常检测是 BI 集合的重要应用之一。无监督学习在 BI 中最通用的应用之一是聚类——一种将相似的数据点分组到一起簇中的技术。用于此目的的算法包括\
  \ `k-means`、`hierarchical` 和 `DBSCAN`。这些算法常用于客户细分。例如，一家电子商务公司使用聚类根据人口统计特征、行为以及在网站上的活动对其客户进行细分。这种无监督学习过程的其他基本应用还包括降维。这些算法（包括\
  \ `PCA`）可以压缩高维数据并暴露其最核心的部分。BI 中这种降维特征使得复杂的数据可视化变得更容易理解，让利益相关者能够解释趋势和关系。异常检测是无监督学习的一种\
  \ [12, 14, 15]，用于识别数据样本中的异常点，非常有用。在 BI 中，异常检测用于找出不寻模式，以便进一步调查欺诈检测。此类应用在金融、电子商务和网络安全等行业非常重要。\n\
  \n### 3.2.2.1 挑战与机遇\n\n大多数无监督学习算法需要对参数进行仔细调优并结合领域知识以获得意义的结果。但解释 AI 的进展也使得无监督学习模型可行，从而更便于业务用户使用。\n\
  \n### 3.2.3 用于战略业务决策的强化学习\n\nRL 是一种受行为心理学集合启发的机器学习分支：它是一个代理在与环境交互的同时学习序列决策的领域。智能体随着时间的推移和所采取的行为获得奖励或惩罚，并此通过最大化收集到的奖励来不断改进其策略。\n\
  \n### 3.2.3.1 在 BI 中的应用\n\n决策能力可以随时间不断优化，但供应链优化实际上是 RL 算法的一个非常显著的用例，它可以通过模拟跨供应链动态并从历史数据样本中学习，推断出最佳库存水平、补货点和配送路线。成本节省、最小化缺货和更好的运营都降低了成本。营销中用于客户参与策略是\
  \ RL。这是因为 RL 的推荐系统会学习哪些建议具有最高的点击率或转化率。动态定价使用 RL，其中算法根据需求和竞争对手的价格设置实时调整价格。金融服务业在算法交易过程中也受益于\
  \ RL。RL 代理通过市场数据分析、风险收益平衡以及对市场不断变化的适应来学习如何执行交易。这比静态交易策略更优，因为它们可以不断学习市场的动态变化。\n\n\
  ### 3.2.3.2 挑战与机遇\n\n主要的缺点是实现强化学习（RL）效率所需的计算能力和海量数据。因此，它在小型企业中使用并不容易。此外，复杂的 RL 模型缺乏解释性，且无法以直接的方式部署。然而，云计算的进步结合可解释\
  \ RL 解决了这些担忧，使该技术变得可用且透明。\n\n### 3.2.4 用于预测分析的深度学习\n\n深度学习是机器学习的一个子类，它利用 `ANN` 在复杂模式数据集上的多层表示。`ANN`\
  \ 解析高维和非结构化数据为预测分析开启了新纪元，并应用于 BI 设置的主要子集中。\n\n#### 3.2.4.1 BI 的应用\n\n深度学习具有适应性和准确性。深度学习在需求预测中最稳健的应用是使用循环神经网络和长短期记忆（`LSTM`）网络。这些网络分析时间序列数据预测未来趋势。它们被广泛应用于零售和制造业运营，以优化库存管理和生产规划。\n\
  \n客户分析中的深度学习有助于情感分析，处理来自社交媒体、评论和客户反馈的文本数据。例如，在零售业，`CNN` 被用于分析商店视频监控以追踪轨迹并寻找商店设计方案。在医疗保健领域，深度学习模型分析放射影像，识别医疗状况并为医疗专业人员提供有意义的见解。\n\
  \n### 3.2.4.2 挑战与机遇\n\n深度学习模型非常复杂，因此带来了解释性和计算需求问题。然而，硬件加速和云 AI 服务的进步使得深度学习与 BI 的集成可行。`XAI`\
  \ 技术也让深度学习模型更加透明，并改进了它们在决策过程中的采用。机器学习集成到 BI 系统中正使数据分析（因此决策）与以往大不同。在监督学习中，它在预测和分类等预测任务上表现更好。它能揭示无监督学习在数据集中隐藏的模式和异常。RL\
  \ 增强了代理在动态环境中的序列决策能力。深度学习具有以前所未有的能力处理高维和非结构化数据。所有这些方法共同帮助企业从传统分析转向驱动创新、效率和竞争优势的洞察。\n\
  \n随着该领域的进步，这些机器学习技术与 BI 之间的交互将更加深远，使企业能够在日益由数据样本主导的世界中生存。组织利用这些能力可以将原始数据转换为可操作的智能，帮助他们在每个层面上做出更明明的决策。\n\
  \n## 3.3 BI 的关键机器学习算法\n\n机器学习是 BI 用于从数据样本中提取群体洞察的赋能技术。BI 中的机器学习应用包含许多算法，但每种算法都有其优势和用例。下节将讨论五种核心算法及其在\
  \ BI 设置中的应用：决策树和随机森林、支持向量机、人工神经网络、梯度提升机和 `k-means` 聚类过程。\n\n### 3.3.1 决策树和随机森林\n\
  \n### 3.3.1.1 决策树\n\n\n\n在商业智能（BI）应用中最直观且功能强大的机器学习算法可能就是决策树；它们简单、高效，并且具有良好的可解释性。其工作原理是根据特征值将数据递归地划分为子集，并形成一种树形结构，其中每个节点代表一个基于特征的决策，每个叶子节点代表一个结果或预测。决策树是非常多功能的，因为它们能够在各种场景下毫不费力地处理分类和回归任务。\n\
  \n### 3.3.1.2 在 BI 中的应用\n\n决策树被广泛地应用于客户细分、欺诈检测和风险分析。例如，决策树模型可以根据购买历史、人口统计数据和参与指标将客户归类为不同的忠诚度小组。同样，决策树通过学习历史数据样本中的模式来检测可疑交易。\n\
  \n### 3.3.1.3 随机森林\n\n随机森林通过树集成将决策树进行泛化。每棵树都在随机的数据子集和特征空间上进行训练，以此此类推。在营销领域，它有助于识别对客户购买影响最大的因素，并实现基于数据驱动的营销活动策略。在金融领域，随机森林根据借款人的画像和过去的还款模式预测信用风险。\n\
  \n### 3.3.1.4 挑战与机遇\n\n虽然决策树和随机森林非常强大，但它们的可解释性并不随模型复杂度（例如森林中树的数量）增加。可视化工具和特征重要性指标的进步也使得这些模型对业务用户更加易用。\n\
  \n### 3.3.2 支持向量机 (SVMs)\n\n`SVMs` 是机器学习中非常先进的算法，适用于监督和无监督学习。这些方法也适用于分类和回归用例。核函数允许\
  \ `SVMs` 通过将数据映射到高维来处理任务，从而在此过程中解决非线性问题。\n\n### 3.3.2.1 在 BI 中的应用\n\n它在高维数据集方面往往表现特别强大，有助于文本分类、情感分析和异常检测。在\
  \ BI 中，`SVMs` 应用于从行为数据识别高价值客户或识别金融交易中的离群值的问题。\n\n### 3.3.2.2 在 BI 中的优势\n\n`SVMs`\
  \ 在高维空间中具有很强的抗过拟能力，因此在 BI 中非常有益。它们通过核技巧实现的非线性处理能力有助于对复杂数据集获得更全面的洞察。\n\n### 3.3.2.3\
  \ 挑战与机遇\n\n这通常取决于某种程度的领域知识，并且计算密集，至少对于较大的数据集是如此。随着先进的优化技术和硬件的发展，`SVMs` 在大规模 BI 应用中变得可行。\n\
  \n### 3.3.3 人工神经网络\n\n人工神经网络（`ANN`）遵循并模仿人类的结构。它由被称为神经元的节点组成。神经元按层组织。通过激活函数，输入数据允许\
  \ `ANNs` 对数据之间存在的复杂模式和关系建模。\n\n### 3.3.3.1 在 BI 中的应用\n\nAI 在商业智能（BI）的预测分析和模式发现中非常有效。例如，`ANNs`\
  \ 根据销售趋势、天气数据和零售业正在进行的促销预测需求；协助对患者数据进行分析，以确定疾病的进展或风险人群的存在。\n\n### 3.3.3.2 更优的特征\n\
  \n`ANNs` 可以学习非线性关系，是 BI 中非常重要的组件。例如，情感分析模型在处理文本数据时使用 `ANNs`，以从客户评论或社交媒体帖子中获取洞察。\n\
  \n### 3.3.3.3 挑战与机遇\n\n这种复杂性使得 `ANNs` 变成一个“黑箱”，导致它们不可解释。此外，训练 `ANNs` 需要大量的计算机资源和专业知识。然而，随着\
  \ `TensorFlow`、`PyTorch` 和预训练模型的出现，`ANNs` 正在逐渐接近 BI 应用。\n\n### 3.3.4 梯度提升机 (XGBoost\
  \ 和 LightGBM)\n\n梯度提升机（`GBMs`）指的是一种强大的集成学习技术，在预测过程中顺序构建模型以减少误差。`XGBoost` 和 `LightGBM`\
  \ 是极其流行的实现，以显著的效率和准确性处理结构化数据样本。极端梯度提升或 `XGBoost` 设计旨在实现快速，在过程中具有高性能，并且在此结合了正则化以避免过程中的过拟合。由于具有处理大规模数据的能力，这在\
  \ BI 应用中也非常受欢迎。\n\n### 3.3.4.1 LightGBM\n\n该名称本身就说明了效率，因为它遵循基于直方图的方法，大幅减少了内存占用，从而加速了训练。`LightGBM`\
  \ 直接处理类别特征的能力在 BI 数据集中非常有用。\n\n### 3.3.4.2 在 BI 中的应用\n\n`GBMs` 广泛应用于 BI 中的预测、分类和排名任务。例如，在电子商务领域，`GBMs`\
  \ 根据购买行为样本、网站交互和人口统计数据估算客户生命周期价值。在金融领域，它们有助于分析信用风险并优化投资组合。\n\n### 3.3.4.3 在 BI 中的优势\n\
  \n`GBMs` 以提供良好的特征重要性分析而闻名；也就是说，它们展示了在过程中驱动业务结果因素 [4–6]。它们的高扩展性和准确性使其成为 BI 数据集中进行预测分析的绝对必要手段。\n\
  \n### 3.3.4.4 挑战与机遇\n\n`GBMs` 本质上非常有效，但它们需要仔细调整参数才能运行，因此计算开销大。这使得 `AutoML` 框架可以轻松执行该过程，因此\
  \ `GBMs` 对于非技术用户也是易用的。\n\n### 3.3.5 K-均聚类\n\n`k-means` 聚类是一种用于对相似数据点的无监督学习算法。因此，每个点以迭代的方式分配给一个类，以使点与其相应类中心之间的距离平方和最小。\n\
  \n### 3.3.5.1 在 BI 中的应用\n\n`k-means` 聚类是 BI 中客户细分的核心工具之一。例如，企业使用 `k-means` 根据购买行为、位置或偏好对客户进行分类。此类小组为针对性营销和定制化优惠提供了基础。\n\
  \n在零售业，`k-means` 聚类用于根据客户共同购买模式对商店布局进行优化优化。同样，在人力资源领域，它根据技能组或绩效指标对员工进行分组，支持劳动力规划过程。\n\
  \n\n\n`k-means` 假设聚类是球形的且大小相等的。对于大多数真实世界应用中的数据来说，这种假设往往是不切实际的。此外，还需要知道聚类的数量。最近的技术——`肘部点法`和`轮廓分析`——部分地解决了这些问题。在机器学习（ML）背景下，本章涉及的最重要算法是`决策树`、`随机森林`、`支持向量机`、`人工神经网络`、`梯度提升机`和`k-means\
  \ 聚类`。所有这些算法在高级商业智能（BI）应用的成功中都起着重要作用。从分类和回归，到聚类和异常检测，它们允许企业利用其所有的数据样本。随着组织越来越多地使用数据驱动的策略，这些算法与\
  \ BI 之间的共生关系将继续推动不断变化的格局中的创新、效率和竞争优势。\n\n# 3.4 机器学习在 BI 中的应用\n\n机器学习技术在 BI 升级中发挥的作用至关重要。接下来的章节确定了机器学习在\
  \ BI 中的五大主要应用：销售预测与收入预测、客户细分与目标客户定位、供应链优化、欺诈检测与风险分析，以及情感分析与市场趋势预测。对于每种应用，都提供了数值和表格示例，以说明这些方法的各种丰富性及其在过程中的实际应用。\n\
  \n## 3.4.1 销售预测与收入预测\n\n### 对战略规划和运营效率的重要性\n\n预测和收入预测对于战略规划和运营效率至关重要。在这种方法中，用于生成未来收入组预测的模型有`线性回归`、`决策树`和`RNN`模型。它分析了销售、季节模式和其他外部来源的历史数据。\n\
  \n### 3.4.1.1 应用场景\n\n在这里，收入预测模型的场景应用可以是：根据历史销售、促销和天气状况，预测某零售业务未来 12 个月的销售额。\n\n\
  ### 场景分析细节\n\n| 月份 | 历史销售额 ($) | 促销指数 (0–1) | 平均温度 (°F) | 预测销售额 ($) |\n| --- | ---\
  \ | --- | --- | --- |\n| 2023 年 1 月 | 50,000 | 0.8 | 30 | 55,000 |\n| 2023 年 2 月\
  \ | 48,000 | 0.6 | 32 | 50,000 |\n| 2023 年 3 月 | 52,000 | 0.7 | 45 | 58,000 |\n\n\
  这种特定的 ML 模型在它的未来销售预测中使用了历史销售、促销和平均温度。捕捉数据样本的时间依赖性需要在一个 `LSTM` 网络中特异地使用 `RNNs` 来实现这一点，这使其适用于手头任务及整个过程。因此，一旦获得了关于销售的准确预测，企业应当优化其库存水平、资源利用率并设计其营销策略。\n\
  \n## 3.4.2 客户细分与目标客户定位\n\n客户细分是一种根据相似特征将客户分为不同类别的方法。结果，这导致了营销策略的发展，以提高其质量并更充分地服务客户体验。广泛使用的\
  \ ML 技术包括`k-means 聚类`和`层次聚类`。\n\n### 3.4.2.1 示例场景\n\n电子商务网站将根据购买历史、人口统计数据和互动评分对其用户进行细分。\n\
  \n### 场景分析细节\n\n| 客户 ID | 总购买额 ($) | 年龄 | 互动评分 (0–100) | 聚类（分段） |\n| --- | --- |\
  \ --- | --- | --- |\n| 001 | 1,200 | 28 | 75 | 高价值 |\n| 002 | 300 | 35 | 40 | 低互动\
  \ |\n| 003 | 800 | 22 | 65 | 增长潜力 |\n\n`K-means 聚类`将客户分为“高价值”、“低互动”和“增长潜力”。这意味着可以制定定制化策略，通过仅向高价值客户提供折扣来实施差异化沟通，而低互动用户则获得重新互动的活动，帮助他们在客户留存和获取方面表现更好。\n\
  \n## 3.4.3 供应链优化\n\nML 算法通过优化需求预测、库存管理和路线规划过程来优化供应链运营。使用的技术是`RL`和线性规划。\n\n### 3.4.3.1\
  \ 示例场景\n\n物流公司希望通过优化路线规划来减少成本。\n\n### 场景分析细节\n\n| 路线 ID | 距离 (英里) | 交付时间 (小时) |\
  \ 燃料成本 ($) |\n| --- | --- | --- | --- |\n| R1 | 50 | 2 | 30 |\n| R2 | 70 | 3 | 45\
  \ |\n| R3 | 40 | 1.5 | 20 |\n\nML 算法通过优化需求预测、库存管理和路线规划过程来优化供应链运营。使用的技术是`RL`和线性规划。\n\
  \n## 3.4.4 欺诈检测与风险分析\n\n它非常高效地检测金融领域的欺诈。技术包括`异常检测`、`SVM`和神经网络。\n\n### 3.4.4.1 示例场景\n\
  \n银行希望通过分析模式来识别潜在欺诈。\n\n### 场景分析细节\n\n| 交易 ID | 金额 ($) | 位置 | 时间 (HH:MM) | 异常评分\
  \ | 欺诈 (是/否) |\n| --- | --- | --- | --- | --- |\n| T001 | 1,200 | 纽约 | 14:32 | 0.95\
  \ | 是 |\n| T002 | 50 | 波士顿 | 09:15 | 0.10 | 否 |\n| T003 | 2,500 | 芝加哥 | 23:45 |\
  \ 0.87 | 是 |\n\n`异常检测`模型标记那些高分交易。它搜索金额、位置等特征的偏差。神经网络在欺诈数据上训练进行预测。\n\n## 3.4.5 情感分析与市场趋势预测\n\
  \n这还介绍了两种可以分析情绪并预测市场的工具，即情感分析。情感分析基于 `NLP` 模型和趋势分析。示例包括 `BERT` 等 `transformers`，以及用于时间序列分析的技术。\n\
  \n### 3.4.5.1 案例研究\n\n服装零售商想了解客户对其新系列的整体感受，并预测销售趋势。\n\n### 场景分析细节（情感分析）\n\n| 评论\
  \ ID | 评论文本 | 情感评分 (0–1) | 情感倾向（正面/负面） |\n| --- | --- | --- | --- |\n| R001 | “质量太棒了，喜欢！”\
  \ | 0.92 | 正面 |\n| R002 | “不值这个价。” | 0.25 | 负面 |\n| R003 | “很有时尚，但延迟延迟。” | 0.65\
  \ | 正面 |\n\n### 场景分析细节（趋势预测）\n\n| 周 | 社交媒体提及次数 | 销售额 ($) | 预测销售额 ($) |\n| --- |\
  \ --- | --- | --- |\n| 第 1 周 | 1,000 | 20,000 | 22,000 |\n| 第 2 周 | 1,200 | 25,000\
  \ | 27,500 |\n| 第 3 周 | 800 | 18,000 | 19,000 |\n\n\n\n客户反馈的分类或归类（通常上分为正面或负面）有助于为营销和产品开发流程制定策略。基于\
  \ BERT 的自然语言处理（NLP）模型被用于高精度的情感分类。同时，通过能够通过时间序列分析预测销售趋势的社交媒体互动，可以从数据驱动的角度做出库存和营销决策。用于销售预测、客户细分、供应链优化、欺诈检测和情感分析的\
  \ BI 应用可以使组织具备做出更智能、更快速、更准确决策的潜力。本节中的示例数据和表格展示了这些算法在现实生活中是如何运作的，并提供了有助于推动竞争优势的洞察。随着企业采用数据驱动策略，这些\
  \ ML 应用将仍然是所有这些场景下未来 BI 的核心。\n\n## 3.5 ML 驱动的决策支持系统\n\nML 改变了决策支持系统（DSS）的开发和实施，并提高了业务实体在业务决策中的预测性、自动化和响应能力。基于\
  \ ML 的 DSS 应用算法和分析技术，为战略性、战术性或运营性结果提供建议。本章讨论了适用于工业应用的特征和设计原则，这些领域拥有丰富的真实数据饱和案例，能够产生相应的效应集。\n\
  \n### 3.5.1 特征与设计原则\n\n基于 ML 的 DSS 具有一组区别于传统决策支持系统的特征。这些特征包括实时数据处理、自适应学习、预测性和规范性分析，以及与其他业务工具轻松集的可能性。实时处理使决策者能够根据最新的数据做出决策，而自适应学习确保系统随着新数据的不断输入而持续进化。预测性分析依赖于过去的模式来预测未来，而规范性分析则提供实现所需目标的建议性行动方案。\n\
  \n基于 ML 的 DSS 设计的主要考虑因素是可用性、准确性和可靠性。它应该关注以用户为中心的界面，让没有技术知识的利益相关者也能轻松访问系统。这很重要，因为数据的质量和完整性直接影响\
  \ ML 算法的性能，而性能通常取决于输入数据样本的准确性和完整。扩展性也是一个设计考虑因素，因为需要管理海量数据和计算需求。最后，鼓励透明性和可解释性，以便在高风险的决策环境中进一步建立信任和问责制。\n\
  \n### 3.5.2 DSS 的行业特定实现\n\n这种 ML 驱动的 DSS 已被许多领域采用，特别是其特征能够克服某些挑战。在健康领域，这些系统提取患者数据以制定定制化的治疗计划，这些计划可能证明更加有效并减少浪费。在金融领域，它们平衡风险与收益以优化投资组合，并分析信用风险。零售商通过\
  \ ML 驱动的方式使用 DSS 来预测需求并维持最佳库存水平，以确保任何库存浪费至最低。在制造业中，这些 DSS 系统允许进行准确的诊断，以避免潜在的停机和其他与机械故障相关的其他服务中断。例如，下述示例展示了运行\
  \ ML 的 DSS 在过程中可以处理的某些适应性和灵活性。\n\n### 3.5.3 案例研究\n\n54.\n\n#### 场景分析详情\n\n| 机器 ID\
