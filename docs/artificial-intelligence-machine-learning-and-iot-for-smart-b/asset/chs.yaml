  \ 中国张家界，页 2147–2152. 返回文本.\n\n161.\n\n# 9 机器人流程自动化：为卓越运营优化业务流程\n\nMagesh Sankar,\
  \ Vijayalakshmi Sivaram, Palamadai Subramanian Raj, S. Geetha, and R. Manikandan\n\
  \nDOI: [`10.1201/9781003561879`](https://doi.org/10.1201/9781003561879)\n\n## 9.1\
  \ 引言\n\n在当今快速且竞争激烈的商业环境中，组织面临着提高效率、降低运营成本和提供高质量服务的巨大压力。机器人流程自动化(`RPA`)是一种变革性技术，它可以自动执行重复的、基于规则的任务，允许企业优化运营并专注于其战略目标。通过这一概念，`RPA`\
  \ 机器人模拟人类与数字系统的交互，以高速、准确的方式提取、处理和生成报告。这消除了人为错误，同时显著缩短了处理时间和运营成本，从而使 `RPA` 成为任何数字化战略的关键组件\
  \ [1, 2。\n\n最早采用 `RPA` 的银行、医疗、保险、制造业和零售业，他们利用该平台实现后台流程的自动化并简化工作流。例如，在银行业，贷款处理时间大幅缩短；在医疗领域，它被用于管理患者记录和账单系统，与现有企业系统实现无缝集成。基于\
  \ `RPA` 的非侵入式现代化方法进一步加速了其在各个领域的采用 [3, 4]。\n\n\n\nRPA 与人工智能（AI）和机器学习（ML）的进展密切相关。智能自动化是\
  \ AI 与 RPA 的集成，它允许系统分析非结构化数据、理解上下文甚至做出决策。这种能力为复杂的工作流自动化带来了新的可能性，例如金融领域中的欺诈检测和制造业中的预测性维护。事实上，资源优化和运营敏捷性的提升已成为业务流程优化的骨石\
  \ [5]。\n\n尽管 RPA 具有许多优势，但在采用方面仍面临挑战。初始投资成本过高、人们对变化产生抵触情绪，且缺乏标准化（162）。此外，虽然 RPA 在基于规则的工作中表现出色，但在处理高度动态和基于判断的活动时，在\
  \ AI 集成方面仍有大量工作需要完成。云端 RPA 平台和可解释 AI 模型已经解决了上述挑战。可扩展性、透明度和成本效益使其成为最佳解决方案之一 [6]。在客户服务领域，RPA\
  \ 也非常有帮助。自动聊天机器人、邮件回复系统和个性化通信工具帮助企业提供 24/7 的客户支持，及时解决查询并提升用户体验。这些技术不仅提升了客户满意度，还提高了留存率，从而反映了\
  \ RPA 对业务结果的直接影响 [7]。除了运营效率外，RPA 还通过减少资源消耗并最大限度地减少对环境的影响，有助于可持续发展。纸张使用、能源消耗和整体浪费的减少使自动化成为致力于可持续目标组织的价值工具。\n\
  \n此外，常规工作的自动化将使员工能够从事创造性和战略性的工作，从而促进创造力和工作满意度 [8]。RPA 采用的另一个主要驱动力是合规性。自动化系统可以扫描合规要求、监控审计跟踪并检查是否遵循标准条件，以降低不合规风险，特别是在金融、医疗保健和其他受严格监管的行业\
  \ [9]。这一切都在企业内部发生，但将改变数字时代运营范式的未来技术仍然是 RPA。因为它同时带来了生产力的提高和成本的节省，以及更好的客户体验，RPA 仍然是实现卓越运营的关键资产\
  \ [10]。\n\n### 9.2 研究目标与范围\n\n本研究旨在开发一种先进的 RPA 运营解决方案，以实现高效的任务调度、资源分配和作业执行监控，从而改进业务运营。当前的研究旨在为机器人流程自动化系统提供新方法，以解决零售业对自动化需求日益增长、可扩展性低以及\
  \ RPA 系统扩展的问题，使企业能够实现卓越运营并数字化转型。\n\n#### 9.2.1 研究动机与目标\n\n*   **自动化需求增长：** 对智能 RPA\
  \ 解决方案的需求源于对节省成本和提高效率的流程自动化的日益增长的要求。\n*   **运营挑战：** 当前 RPA 系统的动态资源分配和实时灵活性受到限制，需要复杂的优化方法。\n\
  *   **可扩展性问题：** 公司需要能够管理大型数据集和复杂程序的可扩展框架。\n*   **性能提升：** 为了实现可持续扩展，必须提高包括任务完成时间、资源使用和能源效率在内的性能指标。\n\
  *   **技术进步：** 机器学习和强化学习的集成为开发能够自我优化的更智能 RPA 系统提供了机会。\n\n克服上述问题的关键目标如下：\n\n*   设计一种自适应资源管理系统，使用\
  \ `SARSA-TS` 等强化学习技术动态平衡工作负载和资源。\n*   使用 `APSO` 和 `XGBoost` 等机器学习方法进行高效的任务规划和排序，以减少延迟并增加吞吐量。\n\
  *   开发可以管理复杂流程和来自不同领域各种负载的可扩展框架。\n*   通过优化低延迟、改进任务完成时间和实现最大化节能，增强整个系统的性能。\n*   开发性能监控工具和仪表板，以及自动监控工具以跟踪系统性能并识别异常，反过来有助于使用\
  \ `ARIMA-WOA` 算法采取预防性措施。\n*   在吞吐量、资源利用率和能源消耗等参数上与现有方法（如 `GRA` 和 `GA`）进行比较，以证明所提技术的优越性。\n\
  \n#### 9.2.2 研究贡献\n\n*   一种智能运营管理框架，包含机器学习和强化学习的集成，用于高效资源分配和任务调度的 RPA 系统。\n*   用于自适应资源优化模型的\
  \ `SARSA-TSA`：具有改进的可扩展性和灵活性的动态资源分配。\n*   通过特征工程、优化过滤的 `XGBoost` 和 `APSO` 提高预测准确性和系统性能。\n\
  *   基于 `ARIMA-WOA` 的新型监控方法在任务完成时间、延迟、吞吐量、资源利用率和能源效率等性能指标上表现出显著改进。\n\n### 9.3 文献综述\n\
  \n\n\n\n\nRPA 在追求业务流程简化和实现卓越运营的过程中已成为一种颠覆性技术。为了理解其能力，需要恰善探索它是如何被开发、采纳并集成到众多行业中的。本章深入回顾了该领域的一些相关研究工作。作者\
  \ [11] 发表了一项系统性制图研究，调查了科学研究与 RPA 工业应用之间的关系。他们揭示了 RPA 如何减少重复性任务中的人机交互，从而带来效率和准确性的优势。他们最后强调了\
  \ RPA、`AI` 和 `ML` 技术的集成，这种操作中的复杂性处理将有助于应对挑战。在所识别的应用领域中，金融和医疗健康从 RPA 的引入中获益匪浅。作者\
  \ [12] 对 RPA 的采纳进行了系统性的文献综述，阐明了其机遇与障碍。他们的工作对各业的 RPA 应用进行了分类，并强调了其在优化运营流程中的转型性作用。该研究解决了诸如变革阻、高实施成本和技术局限性等关键挑战，组织必须克服这些问题才能释放\
  \ RPA 的全部潜力。作者 [13] 通过对可用文献的系统性回顾，提供了一个分析 RPA 技术的框架。这项研究侧重于在业务流程中有效实施 RPA 的方法论以及其在提高运营效率方面的应用。它进一步阐明了一些较新的趋势，例如\
  \ RPA 与 `AI` 的集成，这进一步增强了其处理非结构化数据和决策活动的能力。一位作者 [14] 调查了 RPA 作为数字化转型驱动者的角色。研究证明了其在自动化后台流程、降低成本和提高生产力方面的潜力。作者强调，RPA\
  \ 允许组织在不改变现有系统的情况下转换工作流，这对于希望实现高效益数字化转型的公司来说是一个很好的选择。作者 [15] 专注于银行业，并在该领域展示了 RPA\
  \ 如何减少贷款处理和客户服务中操作的复杂性。这项研究研究提供的案例描绘了 RPA 对处理时间和服务质量的影响，这将提升客户满意度和运营效率。\n\n作者 [16]\
  \ 讨论了 RPA 如何与 `Power Apps` 等平台结合，以重新思考运营效率和数据质量。该研究还说明了 RPA 如何高效地完成常规和基于规则的操作，从而使组织能够实现更高的数据准确性并在很大程度上避免错误。通过这种集成，员工将能够解放出来执行有助于组织整体增长的战略性和创造性工作。作者\
  \ [17] 探索了云端 RPA 能力，他主要关注了 `Appian` 的 `BPM` 平台。本章探讨了云端 RPA 解决方案的可扩展性和成本效益，使公司能够在对基础设施投入少量资金的情况下快速部署自动化。该研究显示了云端\
  \ RPA 如何于与现有系统集成，从而为那些寻求扩大业务规模的组织提供了一个可行方案。作者 [18] 描述了 RPA 在跨行业自动化中的策略。研究显示了其通过自动化基于规则的流程来增强运营效率的有效性，从而减少错误并提高生产力。作者讨论了\
  \ RPA 如何影响存在重复性任务的零售和制造业的转型。作者 [19] 讨论了智能自动化中的创新。研究侧重于 RPA 与 `AI` 的集成。他们的工作展示了更复杂的用例，包括非结构化数据处理和决策能力的增强。作者\
  \ [20] 建议基于 `AI` 的 RPA 使公司在应对更复杂的业务需求时具有更高的准确性和速度。作者评估了 RPA 連同 `AI` 和 `ML` 如何促进业务模式的转变。本章提出的几个较复杂的用例包括预测分析、异常检测和针对特定客户的交互。他进一步强调了\
  \ RPA 在创新、更好的资源配置和获得运营敏捷性方面的作用。\n\n这篇文献综述展示了 RPA 从仅作为自动化基本业务功能的工具，演变为每个数字化转型战略中不可或缺的组成部分。在与\
  \ `AI` 和 `ML` 集成后，RPA 解决了处理可扩展性和准确性方面的复杂挑战。尽管高昂的前期成本和变革性仍是障碍，但考虑到云端 RPA 和智能自动化，提供了合理的解决方案。这些研究强调了\
  \ RPA 提高运营效率的潜力。\n\n## 9.4 建议的方法\n\n为了克服使用 RPA 优化业务流程的障碍，需要采用详尽的解决方案。建议的方法包含了五个关键阶段。这些阶段包括数据收集、预处理、特征工程、调度与资源分配以及运营管理。所有这些阶段共同成了各种\
  \ RPA 系统开发、部署和修改的基础组件。本研究的总体框架如图 9.1\n\n\n\n\n其中 `x`′ 是插补值，`x[i]` 是非缺失值，`n` 是非缺失值的总数。\n\
  \n*   对于类别属性，使用众数进行插补。\n*   去重：根据事务 ID 等唯一标识符对行进行重复项检查。\n\n### 9.6.2 数据转换\n\n* \
  \  归一化：使用最小-最大缩放（min-max scaling）对数值属性进行归一化，将其带到相同的尺度：\n\n$x_{\\text{scaled}} =\
  \ \\frac{x - x_{\\text{min}}}{x_{\\text{max}} - x_{\\text{min}}}$ (9.2)\n\n其中 `x[scaled]`\
  \ 是归一化值，`x` 是原始值，`x[min]` 是最小值，`x[max]` 是数据集中的最大值。\n\n*   聚合交易数据以计算以客户为中心的指标：\n\n\
  $\\text{~Total~Spend~(per~Customer)~} - \\sum\\_{i = 1}^{N}\\text{~Transaction~Value~N}\\\
  _{i}$ (9.3)\n\n其中 `N` 是每个客户的交易次数。\n\n### 9.6.3 数据集成\n\n*   如果使用了额外数据集，则使用主键（例如客户\
  \ ID）执行关系型连接。\n\n### 9.6.4 使用 RPA 实现自动化\n\n*   使用 RPA 工具（如 UiPath 或 Automation Anywhere）使预处理流自动化，以确保操作高效无误。\n\
  \n这种预处理方法将确保数据集能够用于适当的特征工程和分析、稳健的洞察以及运营改进。\n\n### 9.7 特征工程\n\n特征工程意味着提出能够代表自动化内容的新特征，例如将类别数据转换为数值特征，或对时间数据进行聚合以提高效率。\n\
  \n为了解决特征恢复问题，必须提高模型的可解释性和准确性。我们提出了一种名为“Opti-Filter XGBoost”的新型技术，它集成了用于特征选择和工程的“基于过滤的\
  \ APSO-XGBoost”方法。该方法通过识别信用数据集中消费者分组的关键特征，提高了了完美模型的预测精确性和可解释性。通过根据类别的粗略统计值，这种基于过滤的特征选择方法评估了属性的价值。通过评估它们的独立性并确保没有统计学联系，它评估了根据类别值预测属性值的能力。每个类的统计测量量用于评估特征的价值。假设\
  \ \U0001D4B3 = {\U0001D4B3[1],\U0001D4B3[2],…,\U0001D4B3[*n*]}, 则具有 `n` 个特征的特征集由\
  \ \U0001D4B3 = {\U0001D4B3[1],\U0001D4B3[2],…,\U0001D4B3[*n*]} 表示，而 `k` 个类由 ℂ = {ℂ[1],ℂ[2],…ℂ[*k*]}\
  \ 表示。特征 \U0001D4B3[`i]` 的显著性评分 \U0001D4AE\U0001D4B3[`i]` 确定方式如下：\n\n$\\mathcal{SX}\\\
