  \ in Robotics and AI, 9, 108737.\n\n# 基于神经系统的智能业务管理 10 种智能预测模型\n\nHina Riaz and\
  \ Mohan Prasad Sharma\n\nDOI: `10.1201/9781003561873-10`\n\n## 10.1 引言\n\n在数字技术领域，组织必须应对日益增长的复杂性和不可预测性。作为关键流程，在过去的几十年里，人力资源管理（HRM）在形式和功能上经历了巨大的演变。业务管理人员正在快速准备数字时代，基于机器学习（ML）的人工智能（AI）有望改变人力资源部门。可靠的预测对于资源的有效利用和决策至关重要。神经系统模型结合\
  \ `AI`、`ML` 和物联网（IoT）的发展改变了预测领域。人工智能可以快速检索数据库、获取信息、正确解决我们的查询，并立即、逻辑地提供最佳解决方案，同时模拟人类大脑的信息处理。多种能力构成了劳动力管理，因此评估旨在建立智能劳动力。\n\
  \n\n\n\n\n一种融合了模糊逻辑和神经网络优势的混合方法——神经模糊系统，为精明的业务管理中的智能预测提供了强有力的工具。\n\n在本章中，我们将讨论 `ANNs`\
  \ 如何与模糊集结合形成神经模糊系统，以处理现实业务场景。这些场景通常涉及复杂的、不可预测的以及非线性数据，而这些系统（187.）非常擅长处理此类数据。这些系统以以前所未有的准确性和通用性，利用\
  \ `ANNs` 的强大处理能力来检查和预测模式。\n\n## 10.2 模糊集系统\n\n1965 年，Zadeh 发表了第一篇关于表征非概率不确定性新方法的论文，他将其命名为“模糊集”。具有一系列隶属程度的项类被称为模糊集。隶属度（特征）函数为每个对象赋予一个\
  \ 0 到 1 之间的隶属度，该函数定义了这样一个集合。在模糊集的背景下，确立了包含、并、、交、补、关系、凸性等概念的某些属性。该理论的应用可见于许多领域，例如人工智能、计算机科学、医学、控制工程、决策理论、专家系统、逻辑、管理科学、运筹学、模式识别和机器人技术。模糊逻辑是一种基于规则的算法，它考虑多个因素，通过为每个因素分配程度来处理评估过程中的不确定性和不精确性，并根据规则集进行组合计算以确定例如员工的绩效指数，而传统的评估方法是无法实现的。\n\
  \n## 10.3 神经模糊系统 (NFS)\n\n根据 Jang 在 1993 年的建议，神经模糊系统是人工智能领域`ANNs`与模糊逻辑的结合 (6)。根据\
  \ Nauck 等人和 Vieira 等人的解释，`NFS` 有三种类型。\n\n在协作式 `NFS` 中，神经网络组件最初用于识别模糊集和/或模糊规则，然后将生成的模糊系统用于决策。\n\
  \n并行神经网络 (`NFS`) 与模糊系统协同工作，通过向模糊系统提供数据或通过改变其结果来实现。\n\n混合式 `NFS` 使用模式扫描，通过模仿 `ANN`\
  \ 方法论的学习方法来调整模糊系统的参数。\n\n在这三种类型中，混合式 `NFS` 已成功用于识别务实问题。这些年来 `NFS` 主要应用领域是预测与预测、交通控制、人力资源管理和信息系统、生产与运营、财务、业务规划、营销与配送、医疗保健等。\n\
  \n## 10.4 人工神经网络\n\n“人工神经网络” (`ANN`) 一术的定义如下：“给定一组反映映射的数据，计算系统能够获取、编码并视觉化从多模态数据域到另一个域的映射”\
  \ (7)。根据 Haykin (8) 的观点，`ANN` 是简单处理单元的动态并行排列，它们可以从环境中学习并将这些知识保存在其内部连接中。\n\n`ANNs`\
  \ 采用旨在执行神经类比任务的算法，例如从经验中读取、从类似情况中推断，以及评估以前获得过欠佳结果的状态 (9)。`ANNs` (188.) 被证明具有更强的模式检测和学习能力\
  \ (10)。机构使用 `ANNs` 处理从功能预测和系统建模到模式识别引擎和鲁棒分类器的各种挑战。`ANNs` 可以泛化并基于模糊输入得出结论，这是传统评估方法无法实现的，这取决于输入与输出之间的相关性\
  \ (11)。![Figure 10.1 Representation of NFS by combining the advantages of fuzzy\
  \ systems](img/Image10.jpg)\n\n## 10.5 深度模糊系统 (DNFS)\n\n深度模糊系统 (`DNFS`) 是一种将模糊逻辑和深度学习技术（如深度神经网络）相结合以处理需要高维数据的复杂世界场景的复杂构想。`DNFS`\
  \ 相比于其他方法的性能日益增加 (12)。\n\n## 10.6 基于神经网络的不同预测模型\n\n### 10.6.1 金融\n\n过去几年，金融工程一直是学术界的热门话题，许多结合模糊逻辑、神经网络和遗传算法的系统\
  \ (13) 已被提出。189. 190. 混沌类型神经模糊系统 (14) 已应用于电子商务平台、股票指数和比特币预测。![Table 10.1 NFS in\
  \ Finance](img/Table10.jpg)\n\n\n\n\n\n| Khashei et al. (2013) | NFIS | 信用风险分析 |\n\
