  ## 4. AI、ML 和 IoT\n\n### 4.1 AI、ML 和 IoT 简介\n\nAI 是计算机科学的一个分支，涉及以类人类的方式创建智能计算机。这包括但不限于学习、推理、解决问题的能力、感知和语言理解。总体而言，智能的发展始于\
  \ 20 世纪 40 年代和 50 年代。由于算法的改进、计算能力的提高以及大型数据集，20 世纪 90 年代和 21 世纪初取得了显著进展 1。\n\nML\
  \ 是 AI 最重要的子集之一，旨在开发允许计算机获取新数据并提供预测的算法。由于大数据的增加和更好的计算能力，ML 在过去的几十年中进展速度比任何时候都快 2。\n\
  \n因此，IoT 指一组连接和交互的设备，它们能够从周围环境中收集信息并对其进行操作，使物体智能化。通过无线通信、传感器和数据处理技术，智能 IoT 的增长清晰可见。目前，IoT\
  \ 已应用于智能家居、医疗保健、工业控制和智慧城市等几乎所有领域。万物是指 AI 与 IoT 的结合，通过将 AI 集成到决策和数据处理中来增强设备 3。AI、ML\
  \ 和 IoT 之间的关系如图 4.1 所示](#ch04.xhtml#_24032-0872-004-Figure-001)。\n\n#### 4.1.1 在现代业务管理中的重要性\n\
  \n##### 4.1.1.1 提高效率和生产力\n\n通过 AI、ML 和 IoT 为现代业务管理增加价值。AI 允许组织实时分析大量数据并对变化提供及时的决策和响应。由于它们旨在从性能数据中学习以帮助业务预测，并执行其他降低运营成本的功能，这些进步得到了支持\
  \ 3。\n\n##### 4. 4.1.1.2 驱动创新和提升客户体验\n\n除了优化生产力外，AI、ML 和 IoT 的采用继续为当前的业务管理开启新机会。通过这些技术，特定组织可以发现市场机会并开发独特的产品和服务。在消费者分析中，AI\
  \ 收集消费者行为模式的数据，使公司能够应用适当的营销策略，甚至根据消费者偏好设计产品 1。\n\n这些领域的发展使得协同创新成为可能，例如用于客户支持的聊天机器人\
  \ AI 以及业务预测中的 ML。在零售领域，IoT 设备可以监控商店内的客户移动以实现更好的组织管理；在营销策略领域，ML 算法有助于对其进行定制 1。\n\n\
  ![图 4.1 AI、ML 和 IoT 的关联。](img/Figure4_1.jpg)\n\n图 4.1 AI、ML 和 IoT 的关联。 返回正。\n\n\
  ### 4.1.2 AI、ML 和 IoT 的协同与相互依赖性\n\n#### 4.1.2.1 协作效益\n\nAI、ML 和 IoT 的结合是商业世界内的一场演变革命，它创建了关系并通过合作放大了广泛应用中的力量。在\
  \ AI 算法的帮助下，IoT 设备收集的海量数据可以轻松地进行分析和检查，将其转换为有用信息 3。\n\n#### 4.1.2.2 驱动数字化转型\n\nAI、ML\
  \ 和 IoT 之间密相互相关；因此，它们的集成是各组织实现数字化转型的核心。随着这些技术的整合，业务可能会整体运营并增强数据分析，以提供满足消费者需求的价值产品\
  \ 3, 4。\n\n\n\n\n\nAI 的起源深植于关于机器是否能够模仿人类认知功能的哲学问题。AI 的早期概念表明，不仅可能创建执行简单任务的机器，还可以让它们参与诸如推理、从经验中学习以及理解自然语言等高级操作。在其理论框架方面做出重大贡献的先驱人物之一是阿兰·图灵。他在\
  \ 1950 年提出的`图灵测试`是一个重要的里程碑，因为它提供了一种评估任何机器是否能够表现出与人类所表现无异的智能行为的方法。它仍然是机器智能的基本课题之一，作为衡量机器能多大程度上进行“思考”的标准。此外，提出早期\
  \ AI 概念的基础理论源于多位哲学家和数学家的著作。这些理论探讨了智能和认知的本质，使人们相信在思考方面，高级机器可以像人类一样行动。此外，对符号逻辑和计算的研究为研究人员奠定了基础，使他们能够读取、理解并处理信息的算法\
  \ [5, 6]\n\n## 4.2.2 达特茅斯会议与 AI 的诞生\n\n这场会议可以被视为 AI 作为一门学科的开始——达特茅斯会议于 1956 年夏天举行\
  \ [7]。会议由约翰·麦卡锡、马文·明斯基、纳撒尼尔·罗彻斯特和克劳德·香农组织，聚集了一群爱好者，他们成功地汇聚了多位领先的研究人员，讨论创建“思考机器”的可能性。在会议期间，`ML`\
  \ 的可能性、机器推理和自然语言理解等问题被讨论，作为 AI 进一步发展的基础。会议产生的最重要影响之一是讨论了一个事实：通过在问题中指定逻辑前件并为机器提供解决同类问题的方法，可以在机器中模拟智能。达特茅斯会议可以被视为这种\
  \ AI 从纯属推测转向形成科学学科的时刻，这反过来为影响行业和社会的技术发展指了方向 [8]。因此，它成为 AI 作为一个领域不断发展中的独特一步。\n\n\
  ## 4.2.3 AI 从符号系统到神经网络的演变\n\nAI 的出现可以追溯到 20 世纪上半叶，始于 AI 使用符号系统开始；这种方法涉及创建依赖于符号并通过逻辑规则处理这些符号的算法。其中一些系统以结构化形式表示知识，以便机器使用算法和决策方法回答问题。但随着人们对进一步发展符号系统的担忧出现（因为符号系统无法处理世界的不确定性和模糊性，且在创建详细数据术语方面存在局限），语言\
  \ AI 转向了神经网络 [9, 10]。以人脑结构为例，被称为神经网络的新概念允许机器根据数据输入得出解决方案，而不仅仅是根据预先编程到机器中的一组规则 [11,\
  \ 12]。处理能力的增强和对用于训练足够复杂模型的数据访问开启了所谓的深度神经网络架构。计算能力的提高和可用于训练复杂模型的数据获取引入了深度神经网络架构。这提升了图像识别、语音和语言翻译等领域的效率和精度\
  \ [13, 14]。这些神经网络在许多领域显示出卓越的性能，例如 `CNN` 在不需要人工干预的情况下检测特征方面取得了重大进展 [15]\n\n## 4.2.4\
  \ ML 的兴起\n\n### 4.2.4.1 早期算法与统计方法\n\nML 的一部分最初在 20 世纪晚期出现，其目标是统计方法。`线性回归`、`逻辑回归`和决策树由于其易用性变得流行，这些早期算法通过概率分布帮助研究人员实现其目标奠定了基础\
  \ [16]。随着未来领域的发展，ML 将涉及置信区间、显著性水平和假设测试等新概念 [17]。ML 的演变如图 4.2 所示。\n\n### 4.2.4.2\
  \ 神经网络与深度学习的突破\n\n神经网络在 21 世纪 10 年代的兴趣复兴主要与计算能力的剧增增加有关。`GPUs` 有助于嵌入并行特性以以高速度训练模型，这在以前的方法中是完全无法想象的。这伴随着计算能力的提高，使得多层深度架构能够有效地从大数据中学习高级表示。由于这个原因，研究人员能够推进包括卷积神经网络（CNNs）和循环神经网络（RNNs）在深度架构，它们分别对于图像和序列数据至关重要\
  \ [18, 19]。\n\n第三个可能也是最重要的因素是，大型数据集在深度学习发展的同时变得可用。互联网的发展和数字内容的出现为需要泛化的深度学习模型提供了巨大的训练数据集\
  \ [18, 19]。这些模型非常擅长发现数据中的模式，因此在多个领域带来了性能的巨大提升，例如医疗机构的成像、自动驾驶汽车的效率，以及语音识别等。大数据与最先进神经网络结构的结合使得该领域克服了传统\
  \ `ML` 方法被认为不可解决的困难 [20, 21]。\n\n![图 4.2 ML 的演变。返回文本。⏎](img/Figure4_2.jpg)\n\n\n\
  \n\n\n图 4.2 机器学习的演进。\n\n### 4.2.4.3 大数据与机器学习应用的大激增\n\n1. **大数据对机器学习应用的影响**：组织可以利用大量广泛且多样化的数据集，在现代机器学习技术的帮助下发现模式，并根据这些信息产生预测。\n\
  2. **对业务策略的影响**：通过将数据转化为洞察的能力，可以获得竞争优势和创新，使策略与市场新兴趋势及消费者行为之间的匹配更好。\n\n### 4.2.5\
  \ 物联网（IoT）的兴起与增长\n\n#### 4.2.5.1 早期联网设备与 IoT 术语的\n\n可以将 20 世纪后半叶出现的早期联网设备视为物联网的发展阶段。20\
  \ 世纪 80 年代初卡内基梅梅隆大学设计的智能冰箱表明，典型的物品可能变成互联网的活跃参与者并进行相互交互 [22]。虽然复杂程度远不如目前在物联网领域的应用，但这些早期体域网络\
  \ 70. 的实例有助于展示连接性的核心理念，并为无处计算环境和智能设备概念的进步奠定了基础。技术越进步，集成低成本传感器和网络解决方案的先进设备就出现得越多，并带来了实时数据共享理念以及与不同领域各种活动自动化相关的理念，技术进步详见表\
  \ 4.1。\n\n表 4.1 2010 年代的技术进步\n\n| 进展 | 描述 | 对物联网的影响 |\n| --- | --- | --- |\n| **无线通信**\
  \ | 采用诸如技术，如第四代长期演进 (`4G LTE`)、无线局域网 (`Wi-Fi`)）和低功耗广域网 (`LPWAN`)，其中包括许可运营的超宽带网络\
  \ (`LoRaWAN`) [23]。 | 挑战包括增强更广泛的物联网设备之间的连接和数据通信 [24]。 |\n| **传感器技术** | 微型和廉价传感器的改进使其可能收集不同类型的数据，如环境和使用情况\
  \ [25]。 | 实时数据获取和评估能力的利用程度将更高，从而创造出更智能的方法利用这些可能 [26]。 |\n| **云计算** | 云平台的发展为物联网提供了所需的存储和计算能力\
  \ [27]。 | 弃用了对本地硬件的依赖，允许快速且易于集成的物联网解决方案理念 [28]。 |\n| **数据分析** | 连接物联网的设备中存在提供决策的大数据处理和数据挖掘的技术进步\
  \ [29]。 | 许多领域中决策和商品制造的进步 [30]。 |\n| **安全协议** | 创建更好的安全特性，也可以保护和安全易受攻击攻击的物联网设备和网络\
  \ [31]。 | 对物联网应用的信心，从而促进它们在不同部门的使用 [32]。 |\n\n表 4.2 列出了对 2010 年代物联网进步和有效性发挥巨大作用的技术，以及这些技术如何帮助推动连接技术向智能城市、商业智能及更多领域的发展。\n\
  \n#### 4.2.6 未来方向\n\n物联网在智能城市概念和业务分析中的进一步发展表明了 AI 和机器学习的进一步使用。大数据技术能够改进预测分析，从而改善城市规划和运营。此外，为了保护物联网设备的无限数据流，经常需要扩展网络安全解决方案将是不可避免的，以维护用户的隐私并建立他们的信心\
  \ [48]。因此，从物联网扩展的角度反思不同部门，可以认为这些技术能够重塑城市的功能以及企业与环境的交互 [49]。\n\n71.\n\n表 4.2 智能城市、商业智能及其他领域的扩展\n\
  \n| 变革性扩展 | 智能城市 | 商业智能 | 供应链管理 |\n| --- | --- | --- |\n| **自动化** | 智能交通信号根据交通需求进行动态变化，从而减少拥堵和污染\
