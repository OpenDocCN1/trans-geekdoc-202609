  \ 返回正文。⏎\n\n# 7 语音辅助机器人在增强小企业客户关系管理（CRM）中的作用\n\nAditi Srivastava, Ajay Singh 和 Brij\
  \ Mohan\n\n## 7.1 引言\n\n人工智能（AI）和机器学习（ML）彻底改变了数字世界，并带来了可见的改进。AI 和 ML 目前主导市场，预计在未来几年内彻底改变该行业\
  \ 1。语音助手机器人的出现使得小企业通过数字营销实现的扩张变得更加显著 2。\n\n## 7.2 CRM 与技术\n\n客户关系管理（CRM）是业务的一个组成部分，当客户对产品满意时，它代表了忠诚度。与客户建立强大持久的关系是定义\
  \ CRM 的关键，因为它能促使他们再次购买。CRM 由系统进行监控，现在 AI 和 ML 被用于监控这些系统。模糊数据技术已应用于 AI 和 ML 中，以推动研究的进展\
  \ 4。小企业如果能在网站上启用先进的 AI 驱动聊天机器人，将获得先发优势 5。\n\n\n\n\n\n# 理解消费者对互联网服务的偏好与选择\n\n受益于互联网\
  \ `[6]`，理解消费者对互联网服务和功能的偏好与选择对于营销人员来说变得愈关重要。技术的使用增加了 2023 年技术市场的人口（technologies and\
  \ 2021, 123AD）。根据 Internet World Stats (2020) (statistics (itu. int))，2023 年有超过\
  \ 540 万人利用技术来完成任务。在数字时代，技术是生活的必需。得益于技术，人们现在可以社交、保持联系并轻松地获取信息。我们很难想象没有技术的生活。由于技术，我们的生活现在变得更加可靠、更加方便。\n\
  \n由于技术已成为一种基本的工具，了解消费者每天如何使用它以及他们在使用在线平台时的自信程度至关重要。数字 130 时代的人们可以轻松获得技术。这些技术的引入导致了客户参与度的显著转变。从长远来看，技术使人们能够从各种产品中进行选择，并根据方便进行挑选。良好的技术驱动平台可能会通过提高参与度来吸引更多的人。用户精通技术的行为甚至促使他们购买超出基础需求的产品。\n\
  \n客户对技术的舒适程度对他们的行为有重大影响，特别是在客户体验（CE）的背景下。接受使用技术来改进工作是至关重要的。技术接受模型（TAM）、计划行为理论（TPB）和详述似性模型（ELM）等各种模型被认为是最有效的理论，有助于研究技术对客户的影响\
  \ `[7, 8, 9]`。\n\n## 技术在数字时代的作用\n\n在数字时代，理解并适应技术至关重要。根据技术的进步，个人和企业能够演变并制定策略在市场中生存\
  \ `[10, 11]`。尽管在线平台易于使用且成本低，许多客户仍然避免使用，因为他们害怕技术或有技术恐惧。确定人们是否自由地使用技术以及他们在在使用后感到有多自信至关重要。\n\
  \n通过在线购物获得的信心增加了回到同一平台进行重复购买的可能性。在数字领域，一个散发自信和可靠性的平台受到高度重视。分析师关注于如何留住客户并确保他们回到同一个平台。定制化驱动的平台优于缺乏定制化的平台。技术甚至使用户能够根据自己的需求和要求定制其购买行为。\n\
  \n## 社交媒体与业务增长\n\n社交媒体平台为小型企业和电子商务平台长远开展业务提供了更大的可行性。广泛的覆盖范围使企业能够专注于社交媒体平台做出决策。俗称为\
  \ `SIM` 的社交影响者营销促进了社交媒体的发展和增长，具有极的成本效益。每季度的需求增长和趋势变化促使这一代人购买更多小企业的产品。良好的折扣和节日季节促进了此类平台的更多销售；因此，了解数字平台并掌握最新技术的知识至关重要。\n\
  \n研究缺口集中在客户对使用技术购买小企业产品感到有多舒适，从而导致更多的客户参与度。本研究围绕需要回答的研究问题展开，使行业能够理解消费者行为。理解这一点至关重要，因为\
  \ Z 世代（Gen Z）更加冲动，并希望平台能够毫无障碍，以便快速导航。\n\n## 技术整合与客户体验\n\n小型企业近年来销售额有所增长；因此，看到技术及其接受程度有多重要至关重要。必须能够自由地使用技术并感知其益处。在使用技术后，性能得到了提高，过程变得简单得多。\n\
  \nAI 驱动的聊天机器人模型强调了这样一个事实：具有高效系统的优秀平台对于促进购买和重复购买是必要的 `[13]`。更高效的平台确保了更低的复杂性和更多的输出，特别是当消费者不想在混乱的状态之间页面跳转花费更多时间时\
  \ `[14]`。`AI` 和 `ML` 是用于分析消费者和期望的工具。本研究利用了三个著名的理论：`TAM`、`TPB` 和 `TRA`。\n\n\n\n\n\
  \n在这里，重点在于研究 `UTAUT` 模型的意义，以及 `VAC` 如何影响小微企业产品的购买行为。该研究将 `VAC` 作为调节变量，以弥补最新可用文献中的研究空白\
  \ [15]]。目前的文献还缺乏关于 `VAC` 作为调节变量的贡献，以及 `VAC` 如何在电子产品电子商务平台中调节购买行为的讨论。文献强调了 `AI` 的使用，其应用带来了更好的客户互动。高级聊天机器人能够提供更优异的性能并增强客户满意度\
  \ [16]]。聊天机器人现在已投入使用，客户反复使用它们来交互并解决购买疑问。聊天机器人语音助手在小微企业中发挥着至关重要的作用，因为品牌需要认可度和更多的客户互动来在市场中推广其信誉。小微企业需要认可和增长。他们需要客户互动并有长期留住客户的愿望。满意的客户对客户来说更像家人。聊天机器人实现了\
  \ 24/7 的客户支持，并能为客户提供更多定制化服务。此处的目的是调查以下目标：\n\n1. 确定并理解 `AI` 及其在小微企业中增强使用（如语音机器人）的适用性。\n\
  2. 研究 `UTAUT` 模型中使用的所有因素在决定电子商务平台电子产品 `CE` 方面的关联性。\n3. 研究 `VAC` 的调节作用及其对 `UTAUT`\
  \ 模型中所有构念的影响。\n\n## 7.2 UTAUT 模型及其要素\n\n`UTAUT` 理论是关于技术和创新的八种理论中最具主流且有效的理论之一，因为它将整个构念简化并增强为影响客户的四个主要要素和四个调节构念因素\
  \ [17]]。`UTAUT` 理论应该是理解消费者行为以及他们如何在行为中采纳技术最合适的方法 [18]]。`UTAUT` 模型包含了研究最丰富的构念，并在近期产生了最显著的成果\
  \ [19, 20, 21]]。`UTAUT` 被认为具有可能说服人们的 `CEs` 变得精通技术 [21]]。这些要素被专门识别，用于研究客户行为以及他们如何对技术做出反应\
  \ [15, 22]]。该理论使用了三个要素：`性能期望`、`努力期望`和`社会影响`（`SI`）作为决定用户 `CE` 的影响因素 [23, 24]]。本研究中未考虑`经验`和`性别`，因为它们已应用于其他研究\
  \ [25, 26]]。根据文献，`EE` 和 `PE` 构念对金融科技行业中的 `CE` 有更显著的影响 [27]]。这四个构念在学习和管理中也通过了成功测试，并显示在模型中具有实质性的关联\
  \ [12]。技术友好型客户比不太精通技术的客户更容易使用技术 [6, 28, 29, 30] 以及在线平台而非精通技术（Im et al., 2011） [31]。为了理解这种行为，`UTAUT`\
  \ 模型被广泛用于研究 [13, 17, 23, 32]。`UTAUT` 包含了在下文中讨论的四个经过成功测试的构念 [28, 31, 33, 36]。\n\n\
  ### 7.2.1 PE 和 CE\n`PE` 被定义为用户相信技术能使他们更高效工作的频率 [37]。作者还发现，在这些因素中，`PE` 是影响力最强、最重要的构念。\n\
  \n* H1：`PE` 显著影响电子商务应用的 `CE`。\n\n### 7.2.2 EE 和 CE\n`EE` 是用户发现使用技术更简易的程度 [38, 40]。在讨论许多行业（如医疗保健）时，它被视为一个关键要素\
  \ [41, 42]。\n\n* H2：`EE` 直接影响小微企业电子商务应用的 `CE`（Rahi 等）[28]。\n\n### 7.2.3 SI 和 CE\n\
  `SI` 目前被认为是必要的，因为它迫使个人适应现代技术 [43]。在任何地方，人们都接受并重视精通技术的学生，反之亦然 [44]。人们经常受到社会和社交压力驱动而采用新技术，并且他们确实这么做了\
  \ [39]。由于数字时代（Lu, Yao and Yu, 2005），`SI` 对用户产生了重大影响 [36]。不同部门（如医疗保健）已经看到 `SI` 对用户的显著影响\
  \ [39, 42]。\n\n* H3：`SI` 显著影响小微企业电子商务应用的 `CE`。\n\n\n\n\n\n![图 7.1 研究模型。返回正文。⏎](img/Figure7_1.jpg)\n\
  \n图 7.1 研究模型。返回正文。⏎\n\n134.\n\n## 7.3 研究方法\n\n本章重点关注 `AI` 如何通过 `UTAUT` 模型在小型企业中实现客户参与。采用\
  \ `UTAUT` 模型是为了了解 `AI` 在在线网站上的适用性。`UTAUT` 是一个用于研究和理解客户观点以及小型企业模型如何创建客户参与的非常著名的模型。该研究使用了启用\
  \ `AI` 功能的语音助手（如 `chatbots`）及其增强用途来获取客户参与。本章具有实证性，包含了一份问卷的设计，由积极使用小型企业进行购物需求的人填写。数据通过在线\
  \ `Google form` 收集。研究使用了目的抽样法，因为只联系了那些在小型企业购买过产品的受访者，如图 7.1 所示。数据收集量约为 690 个，研究使用\
  \ `SEM` 来理解通过图 7.2 所示的启用 `AI` 功能的 `VAC` 实现的客户参与。问卷分为两部分，第一部分包括受访者的人口统计学特征，第二部分包含有关在小型企业购买时使用的启用\
  \ `AI` 功能的语音助手的信息。`Chatbots` 更加值得信赖，并能够为公司建立好感和信任 [49]。\n\n### 7.3.1 仪器开发\n\n问卷的项目是根据之前的文献工作构建并经过的。问卷包含两个部分。为了创建\
  \ `PE`、`EE`、`SI`、`FC` 和 `CE` 使用的量表，修改了文献 [40] 中的原始项目并使其适用于电子商务。体验还通过电子商务移动应用程序的使用频率进行衡量。向具有相关经验的学术专业人士展示了问卷的最终迭代版本。他们的意见对于增强问卷的清晰度起了至关重要的作用。在第二部分，数据收集分为两个阶段。研究的第一阶段包含的问题展示了\
  \ `UTAUT` 模型四个构要素的调节作用以及中介变量 `CE` 对购买的中介作用。第一阶段侧重于调节变量 `VAC` 如何作为调节变量调节 `IV` 与 `CE`\
  \ 之间的关联。第一阶段还利用了受访者的人口统计特征（如年龄、性别和职业），并在第一部分进行了收集。问题使用 5 点李克特量表进行框架设计，范围从 1 分的“非常不同意”到\
  \ 5 分的“非常同意”。\n\n![图 7.2 结构模型。返回正文。⏎](img/Figure7_2.jpg)\n\n图 7.2 结构模型。返回正文。⏎\n\n\
  135.\n\n### 7.3.2 数据分析\n\n我们使用偏最小二乘 (`PLS`) 回归来分析所提供的研究框架，就像原始的 `UTAUT` 研究 [38]\
  \ 所做的那样。`PLS` 由 Herman World 在 20 世纪 60 年代创建，是一种实用的探索性分析工具，可能是多元线性回归的扩展 [50]，它适用于因素之间存在共线性的预测模型。关于\
  \ `PLS` 回归的优缺点可以在文献中找到 [51]。因子载荷、组合信度和平均方差提取 (`AVE`) 用于评估收敛效度，正如文献 [34, 52] 建议的那样；而区分效度通过确定\
  \ `AVE` 的平方根是否超过构要素之间的相关性来评估，正如文献 [38] 建议的那样，信度通过评估内部一致性来评估。### 7.3.3 测量模型\n\n在\
  \ `PLS-SEM` 方法的阶段，使用测量模型来确保研究的信度、收敛效度和区分效度。使用 Cronbach alpha 和组合信度评估构的内部一致性和信度 [53–57](#ch07.xhtml#_24032-0872_00757)]。如表\
  \ 7.1 所示，所有 Cronbach alpha 和组合信度值都超过了 0.70 的接受值，正如文献 [58] 建议的那样，证实了所有测量的稳健性和信度。\n\
