  \ \\mathcal{X} \\right){\\\\mathbb{P}}\\left( \\\\mathbb{C} \\right)} \\right)$\
  \ (9.5)\n\n#### 9.7.1 自适应粒子群优化\n\nAPSO 技术通过改变粒子的速度和位置来提高模型性能。时间 (`T`+1) 时的粒子速度 `v[i]`\
  \ 如下所示：\n\n`vi = W*vi + r[1]*(ℙ[i]-\U0001D4B3i) + r[2]*(ℙ[i]-\U0001D4B3i)` (9.6)\n\
  \n其中 `r[1]` 和 `r[2]` 是 0 到 1 之间的随机值，`W` 是惯性权重，`r[1]` 和 `r[2]` 是认知分部分的加速系数。粒子位置如下：\n\
  \n`\U0001D4B3i = \U0001D4B3i + vi` (9.7)\n\n为了提高收敛性，APSO 使用局部密度和距离。粒子的局部密度可以使用方程确定：\n\
