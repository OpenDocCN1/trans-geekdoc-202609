  \n# 8. 业务运营中的 IoT 应用\n\nTaher Alkhalaf, Omar Durrah, 和 Monir Alkhalaf. DOI: 10.1201/9781003561873-8\n\
  \n## 8.1 引言\n\n物联网 受了学术界和企业主的广泛关注，现在被视为世纪世纪创新技术之一，是一种为各种`经济部门`创建新产品/服务业务模式的技术手段\
  \ (Ibarra-Esquer 等人, 2017)。Atzori 等人 (2010)) 认为 `IoT` 的关键要素在于它可以影响人们在家和工作中的日常生活\
  \ (Roopa 等人, 2019)。因此，`IoT` 的潜在应用可以在许多领域找到，包括`医疗`、`教育`和`安全` (Jain 和 Jain, 2022)。同样，在商业层面，它可以塑造`生产`、`运营管理`和商品`供应链`。结果，`IoT`\
  \ 将对经济和社会发展产生关键影响。Borgia 声 `IoT` 是一种新兴的互联对象模型，大量互联并能够收集大量信息的设备为人们、社会和经济创造新服务提供了机会\
  \ (Borgia, 2014)。\n\n预计 `IoT` 将日常生活中无处不在，通过`传感器`、`通信系统`和`数字处理`提供日常服务，使机器自动运行而人工干预将保持有限\
  \ (Chen, 2012; Li 等人, 2015a)。\n\n从`桌面电脑`、`笔记本电脑`、`平板电脑`和`智能手机`收集并分析实时数据为信息创造了巨大的价值\
  \ (Bhushan 和 Agrawal, 2020)，为决策者提供了深度见解。当使用复杂的`数据分析算法`时，可以非常准确的预测并为任何事件提供见解，包括`医疗保健`、`天气`、`交通`、`农业`、`制造业`和`股票市场`\
  \ (Grover 等人, 2024)。基于这些见解，信息可以被视为公司的重大经济资产 (Alkhalaf 和 Badewi, 2024)，它可能会出现在公司的`资产负债表`上\
  \ (Greengard, 2015)。麦肯锡学院估计，数据的可用性可降低运营成本 50% 或更多，并可能促使公司重新思考管理其人力投入的方式 (Manyika,\
  \ 2011)。\n\n\n\n\n\n“物联网”一词由技术先驱凯文·阿什斯顿（Kevin Ashton）于 1999 年在麻省理工学院自动识别中心中心的射频识别（`RFID`）社区提出。它被视为一种通过物理环境中的计算机、路由器和传感器，在没有人类直接干预的情况下将互联网连接到物理世界的系统([Ashton,\
  \ 2009])，并同时监控和识别现实世界中的物体([Gupta and Quamara, 2020])。阿什斯顿认为，这些设备比人类更能准确生成、捕获和记录数据，因为人类的行为受到时间、注意力和数据采集准确性的限制([Joshi\
  \ and Gupta, 2019])。他指出了物理环境的重要性，以及经济和社会不仅依赖于信息，还依赖于事物。研究表明，尽管许多协助或构成其设计或支持的技术多年来一直在并肩发展，例如此类传感器节点，包括无线通信技术和能够为多个部门收集、处理并将数据连接到互联网的数字设备([Samih,\
  \ 2019]; [Akyildiz et al., 2002])。\n\n一些研究人员将物联网描述为电子设备的互连，这些设备被称为一组物体或传感器节点，在没有人类干预的物理世界中连接到互联网。凯文·阿什斯顿期望`RFID`技术将引导计算机及其相关对象运行的统一方式，这将有助于供应链的完全自动化、理解现实世界，并在库存管理方面获得更好的性能，同时增强并支持客户体验([Akzildiz\
  \ et al., 2002])。从这个意义上说，这种设计被描述为一个无缝、可用且廉价的系统，它将物理对象自动连接到全球互联网，并遵循国际和政府标准，以便商业工业企业和个人在日常生活中应用并从中获益([Qin\
  \ et al., 2016])。\n\n## 8.2 物联网的应用\n\n物联网的概念可以通过其应用领域来理解。事物本身是产品、设备、交通工具和存储，与产品的生命周期相关([Munirathinam,\
  \ 2020])。因此，在某些方面，它代表了人与周围环境交互的延伸。通常，物联网的确定应用领域如图 8.1 所示。应用提供了运行系统功能的能力并通过`Web 服务描述语言`（`WSDL`）和`业务流程定义语言`（`BPEL`）与外部对象交互([Atzori\
  \ et al., 2010])。\n\nSundmaeker 等人(2010) 以及 Gupta 和 Quamara(2020) 提出了物联网可能应用的几个主要领域：在工业领域，物联网有助于提供信息以启动工业工作，例如提供有关车间内任何产品的库存、购买、设备和数量的数据，甚至在运输到商店后提供数据。物联网可以应用于环境中测量雨量、树木，并监测指定的娱乐、体育和住宅综合体建筑（见表\
  \ 8.1）。根据 Atzori 等人(2010)的观点，应用分为以下五个领域：\n\n![Figure8.1\n\n| 领域 | 描述 | 指示示例 |\n\
  | :--- | :--- | :--- |\n| **工业** | 公司、组织和其他实体之间涉及财务或商业交易的活动 | 制造业、物流、服务业、金融政府部门等。\
  \ |\n| **环境** | 关于所有自然资源的保护、监控和开发的活动 | 农业和养殖、回收、环境管理服务、能源管理等。 |\n| **社会** | 关于人类发展和包容的活动/倡议\
  \ | 面向公民和其他社会的政府服务（电子参与）、电子包容（例如残疾人）等。 |\n\n### 8.2.1 物联网与供应链管理\n\n物联网彻底改变了许多领域，帮助公司迈向工业\
  \ 4.0([Ben-Daya et al., 2019]; [de Vass et al., 2021a]; [Biswal et al., 2023])或所谓的工业物联网（`IIoT`），连接生产线上的技术对象和事物，从而对持续过程进行持续控制([Boyes\
  \ et al., 2018])。现代业务技术通过提供增强供应链性能的通信和数据传输，显著影响了物流管理和供应链操作的性质([de Vass et al., 2021b];\
  \ [Durrah et al., 2023])。在这种情况下，物联网可以为决策者提供实时数据，从生产和设计决策、采购供应、原材料库存、操作流程、成品到预计运输时间。这项技术在需求预测、仓储和降低成本方面可以带来显著收益([Bose\
  \ and Pal, 2005]; [Alkhalaf, 2006])。\n\n由于物联网的存在，交通车辆、道路和铁路已配备了传感器技术，允许收集信息以引导交通，并为司机提供路况信息并选择合适的路线以缓解拥堵，从而实现高效的交通管理([Atzori\
  \ et al., 2010]; [Li et al., 2006])。供应链的内部集成已被证明可以提高性能、为客户传递价值并以最低成本和最快速度提供服务([Shee\
  \ et al., 2018])。然而，尽管公司可以获得积极成果和收益，且物联网设备成本低、易于安装，但公司对投资这项技术仍然犹豫不决([Tu, 2018])，原因与数据隐私、实施该技术的复杂性、潜在的财务负担以及劳动力中的社会影响有关([Haddud\
  \ et al., 2017])。\n\n\n\n\nIoT 技术可以应用于医疗保健领域，从诊断到监控和治疗（Jain and Jain, 2022）。此外，通过传感器系统可以测量人体的许多生命功能，如温度、胆固醇水平和血压（Jain\
  \ and Jain, 2022）。这些技术可用于预防和远程监控，允许与医生、急救服务和护士进行通信。这些技术可以通过触摸屏设备帮助患者，允许患者操作互联网和电视等设备，或者让学龄儿童跟上课程（Borgia,\
  \ 2014; Delmastro, 2012）。跟踪患者的过程有助于减少医疗保健领域的事故和人为错误，特别是在正确的时间提供药物剂量方面，最明显的例子是跟踪医院新生儿的身份以防止与此类病例相关的错误（Sharma\
  \ et al., 2020）。此外，自动跟踪有助于管理药品和设备的库存，并指示诊所的压力位点以便将患者转运到其他部门（Atzori et al., 2010）。\n\
  \n## 8.2.3 IoT 与智能环境\n\n今天，已经可以通过智能技术连接家居，为人们提供有用的服务（Sharma et al., 2020）。它们可以为消费者提供舒适性并方便他们的日常生活，例如使洗衣机、电视和照明的自动化运行（Jain\
  \ and Jain, 2022）。此外，已经可以使用 IoT 用于家中的监控、安保、电气系统和空调（Callaghan and Hagras, 2010）。\n\
  \n## 8.2.4 IoT 与个人及社交\n\n益于 IoT 技术和相关应用，通过社交网络在任何时间与人们之间进行通信已成为可能（Samih, 2019）。个人物联网\
  \ (`PIoT`) 使用传感器管理家中的物品和家电器，或者通过智能手机和移动设备等 IoT 设备（Gulzar et al., 2024）。Biswa et\
  \ al. (2021) 将 `PIoT` 定义为“一组主要关注家居和个人临近区域的连接设备”（p. 1）。\n\nIoT 还帮助通过被称为社交物联网 (`SIoT`)\
  \ 的网络提供用户间的社交通信（Roopa et al., 2019; Afzal et al., 2019），它可以使用 `LinkedIn`、`Facebook`、`TikTok`\
  \ 和 `X` 等社交网络增强人机互动，并允许人们更新工作和日常生活信息（Atzori et al., 2010）。\n\n## 8.3 IoT 的发展\n\n\
  ### 8.3.1 IoT 的早期尝试\n\n研究人员从业人员对可以连接物品的智能设备提供了见解，包括机器对机器 (`M2M`)、`RFID`、可穿戴设备以及物联网（Press,\
  \ 2014）。根据 Dega (2023)）。\n\n### 8.3.2 早期愿景（20 世纪 90 年代后期至 2005 年）\n\n20 世纪 90 年代后期，比尔·乔在达沃斯世界经济论坛上提出了\
  \ IoT 的早期愿景，即与互联网连接的传感器系统可以提供有用的服务（见表 8.2）（Pontin, 2005）。1999 年下半年，阿什顿将“物联网”这一术语作为演讲的标题，并将\
  \ `RFID` 的使用与宝洁公司的供应链联系起来。这是使用计算机系统和物理对象在少量人工干预下收集数据最可靠的方法（Dega, 2023）。基于这一愿景，国际电信联盟\
  \ (`ITU`) 展示了 IoT 的图像，将其定义为网络空间中物品的身份，促进了人类与物品或物品内部之间的通信与互动（ITU, 2005）。\n\n表 8.2\
  \ 六种 Web\n\n| 类别 | 描述 |\n| :--- | :--- |\n| 近端 Web (Near web) | 指连接到计算机的实体设备，如键盘和发射器，指的是物理和无线网络。\
  \ |\n| 此地 Web (Here web) | 提供随时随地访问的互联网。 |\n| 远端 Web (Far Web) | 指允许电视这样的远程访问的互联网。\
  \ |\n| 奇异 Web (Weird Web) | 这是最广泛使用的 Web，提供语音和摄像头访问。 |\n| 企业间 (B2B) | 指没有用户界面的互联网，提供机器访问并可用于业务。\
  \ |\n| 设备间 (D2D) | 是一种传感器可以开放设备访问的互联网，允许数据共享、监控和控制。这种机器智能仍在开发中，供企业和个人日常生活使用。 |\n\
  \n现代通信技术的普及改变了人们与环境互动的方式。因此，IoT 的愿景诞生了。新技术的发现（特别是在无线系统、设备技术和服务面向的架构领域）加上隐私问题和协议，是当今世界格局不可缺的一部分（Sundmaeker\
  \ et al., 2010）。\n\n2005 年，国际电信联盟 (`ITU`) 通过发布关于该主题的第一份官方报告强调了 IoT 的概念。`ITU` 认为\
  \ IoT 是一种结合了传感器、无线网络、嵌入式思考系统和纳米技术等的技术。\n\n### 8.3.3 基础阶段（2009 年至 2011 年）\n\n在这个阶段，创建了一种基础设施，通过物理对象连接到互联网，使得通信、路由、传感和数据处理等物理对象在业务运营中发挥作用。在瑞士黎世举行了一次\
  \ IoT 会议，来自圣加仑大学、苏黎世联邦理工学院和麻省理工学院的三个实验室参与了会议，旨在交流知识并开发对消费者有益的电子商务。在东京组织了一次会议，探索了\
  \ IoT 在医疗保健、建筑能源服务、自然灾害预测、交通拥堵管理跟踪、产品监控及其回收前的存储和保质期等领域面临的技术挑战。（Sundmaeker et al.,\
  \ 2010）。\n\n### 8.3.4 向数据和服务的转变（2012 年至 2020 年）\n\n\n\n\n\n人们曾尝试通过将事物连接起来来开发通信设备，这为企业服务增加了新价值，并有助于改进业务流程、运营和支持客户体验\
  \ (Alam et al., 2013)）。研究表明，将事物与传感器系统集成或连接的能力将创造新的业务模式，从而创新新的服务 (Skaržauskienė and\
  \ Kalinauskas, 2015)）。2015 年记录了一些进展，特别是在传感系统领域，人员人员将这些手段与人类的五感以及大脑处理信息和通信的方式进行对比\
  \ (Ibarra-Esquer et al., 2017)）。\n\n2013 年至 2016 年间，通过`PIoT`系统开发了社交媒体平台，旨在人、公司和设备之间的通信。此外，在\
  \ 2016 年至 2020 年期间，开发了认知物联网（`CIoT`），以进一步理解现实世界与物理环境之间的交互。它寻求设备或系统能够实现自学习、自动思考和决策\
  \ (Gulzar et al., 2024)。\n\n### 8.3.5 智能工业时代 (IIoT)\n\n现在的重点是物理实体智能制造（`CPMS`），旨在实现工业生产要素的独立管理，包括可用空间、生产规划、调度、存储和实时数据采集\
  \ (Cheng et al., 2018)。基于`IoT`架构，智能制造可以应用于任务调度、生产质量可靠性以及机器及其性能的监控，这有助于提高整个生产过程的效率\
  \ (Li et al., 2015b; Malik et al., 2021)。\n\n`IoT`被认为是第四次工业革命（4.0）最重要的技术之一，因为它将信息技术、通信设备、大数据和`ML`用于工业\
  \ (Zhou et al., 2015; Khan et al., 2020)，使得事物能够在不同的环境中独立运行 (Hofmann and Rüsch, 2017)，并被称为智能工业\
  \ (Greengard, 2015)。无线通信领域和无线传感器网络（`WSNs`）的发展有助于从各种来源读取环境数据和指标，这代表了互联网作为一种技术革命的发展的新阶段，这种革命可以将互联网从`Web\
  \ 1.0`（`WWW`）转变为`Web 2.0`（社交网络），然后转变为`Web 3.0`，即全球全球计算网络 (Uckelmann et al., 2011)。人们曾尝试通过云计算、网络系统和监控设备等多个系统来连接并丰富`IoT`网络\
  \ (Kagermann et al., 2013; Borgia, 2014)。\n\n云计算预计通过连接处理和存储系统，提供一个虚拟平台，允许用户无论所处何地访问服务。此外，该平台可以提供商业服务以及研发的可能性。第四代技术（`4G-LTE`）可以通过互联网平台为终端用户提供高速通信\
  \ (Gupta and Quamara, 2020)。\n\n### 8.4 工业物联网 (IIoT) 或 工业互联网 0.4\n\n由于智能技术和`IoT`的发展产生了一个新的子领域，称为工业物联网（`IIoT`），它正引领着工业\
  \ 4.0。互联网领域的这一新创新关注生产过程的自动化、机器学习以及实时数据和信息分析，预计将带来巨大的经济和社会效益 (Munir, 2020)。Boyes\
  \ et al. (2018) 提出了工业 4.0 的定义，包含了关键要素。传感器连接到机器、工业设备和互联网上。该定义区分了两种类型：关注广告的消费者互联网，以及通过创造价值的工业互联网\
  \ (Boyes et al., 2018; Dijkman et al., 2015)。\n\n```\n图 8.2 IoT 与 IIoT 的区别。来源：https://www.cumulocity.com/resource-library/the-internet-of-things-guide/```\n\
  \n一些研究人员和专家使用未来物联网（`FIoT`）术语来表达未来在该领域的创新技术。目前正在提出的另一个概念是`CIoT`，它预计将与其他认知系统集成，以便做出智能决策。这种类型的互联网可能理解业务类型并根据以往知识分析数据和感知信息，并采取必要的措施来提高性能\
  \ (Zhang et al., 2015)。\n\n`图 8.2`展示了面向直接用户或消费者的`IoT`以及基于行业的`IoT`，说明了`IoT`与商业公司和工业之间的关系\
  \ (Malik et al., 2021)。\n\n世界经济论坛 (2017) 将`IIoT`描述为在制造工艺中使用`IoT`技术。在这，`IIoT`技术帮助制造商实时运行并分析数据以保持灵活性和控制。一些研究人员和专家使用`FIoT`术语来表达未来在该领域的创新技术和应用\
  \ (Ibarra-Esquer et al., 2017)。表 8.3 展示了`IoT`系统与`IIoT`系统的对比。\n\n\n\n\n物联网（IoT）还可以为利益相关者提供重大机遇，例如设备和应用开发制造领域的工业人士，以及提供和维护互联网服务的业务所有者（Gupta\
  \ and 154. Quamara, 2020）。国际电信联盟（ITU）的报告确定了可能阻碍充分利用互联网潜力的挑战，例如与数据隐私、标准化以及伦理和社会问题相关的问题。然而，预计到\
  \ 2020 年将会有 500 亿到 1000 亿个连接物体，通过互联网的物的潜在连接可能会增加 1000 倍。Helbing and Pournaras (2015)\
  \ 已经确认，在十年内将有 1500 亿物体相互连接并与数十亿的人相连，数据和信息量每天翻两倍，而不是目前的每年翻一次。\n\n### 表 8.3 物联网与工业物联网系统的运行差异返回正文\n\
  \n| 关注点 | 物联网 (IoT) | 工业物联网 (IIoT) |\n| --- | --- | --- |\n| 关注领域 | 通用应用 | 工业应用\
  \ |\n| 重点开发 | 设备 | 智能工业系统 |\n| 安全与风险措施 | 以实用为中心 | 先进且健壮 |\n| 互操作性 | 自主 | CPS 物理物理系统集成\
  \ |\n| 可扩展性 | 小规模网络 | 大规模网络 |\n| 精密度与精度 | 关键监控 | 毫秒级同步 |\n| 可编程性 | 易离线编程 | 远程现场编程\
  \ |\n| 输出 | 便捷与利用率 | 运行效率 |\n| 韧性 | 不需要 | 高容错性 |\n| 维护 | 消费者偏好 | 定期和计划维护 |\n\n##\
  \ 8.6 物联网业务模式\n\n成功的公司日益关注业务建模作为一种管理工具，它可以提供公司组件的概览，并帮助经理开发业务（Dijkman et al., 2015）。一些研究人员将业务应用与竞争优势联系起来（Johnson\
  \ et al., 2008）。业务模式的重要性随着技术和电子商务的发展而增加，它现在被视为公司执行任务产生收入的方式（Wirtz et al., 2016）。此外，它可能被视为传统方法的替代或补充工具。\n\
  \n### 8.6.1 物联网应用业务模式框架\n\n传统业务和数字业务的业务模式为理解物联网业务模式提供了坚实基础。根据 Li and Xu (2013)，物联网业务模式是一个考虑技术、行业和策略维度的多维结构。新技术的出现和数字化转型需要新的业务模式来交付、分发和变现产品/服务（Amit\
  \ and Zott, 2000）。\n\n### 表 8.4 物联网业务模式组件返回正文\n\n| 组件 | Bhushan and Agrawal (2020)\
  \ | Ashton (2009) | Chen (2012) | Delmastro (2012) | Hui et al. (2017) |\n| ---\
