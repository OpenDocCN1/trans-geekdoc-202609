  \ C002，并带来了活动增加了 15%。DSS 将转化率提高了 30% 并培养了客户忠诚度水平。在收入增长集的案例中，DSS 在实时场景中取得了成功。\n\n\
  ## 3.6 将 ML 应用于 BI 面临的挑战\n\nML 改变了 BI 的游戏。组织现在能够在实现决策自动化的同时，对业务现象获得深度洞察。但其应用并非没有挑战。这些挑战从数据质量、算法的可扩展性、伦理考量到模型的可解释性不等。在\
  \ ML 真正释放其在 BI 中的潜力之前，每一个障碍都需要深思思考。\n\n### 3.6.1 数据质量与预处理问题\n\n数据质量是 BI 中有效使用 ML\
  \ 的基础，因为模型的好坏取决于训练它们的数据。然而，真实数据在到达时往往带有噪声、偏差、不完整或缺失值并存在矛盾，从而降低了 ML 模型的精确性和有效性。\n\
  \n#### 3.6.1.1 挑战\n\n\n\n\n数据不完整是商业智能（BI）中的常见问题，其中数据集大部分由于人为错误、系统限制或记录未完成而产生空白条目。例如，客户数据集在关键人口统计学数据上存在缺陷，这将导致开发合适的预测模型变得困难。数据格式（如日期格式或类别标签）的不一致问题使得预处理变得更有挑战性。\n\
  \n56. 数据预处理是对数据的清洗、转换以及归一化过程，这消耗大量的大量的和精力。例如，销售预测方面的预测分析需要对历史销售数据进行校正，以消除单次活动期间大规模促销产生的异常值。否则，模型在这一场景下的学习效果将很糟糕。\n\
  \n### 3.6.1.2 解决方案\n大多数问题可以通过更复杂的预处理技术来解决，例如自动数据插补和异常值检测算法。通过基于机器学习的预处理工具（包括特征工程框架），将原始数据转换为可用格式的过程得到了简化，同时通过建立稳健的数据治理框架，确保所有\
  \ BI 流水线的数据质量是一致的。\n\n### 3.6.2 大数据的算法扩展性\n\n另一个问题是可扩展性，当组织处理更大、更复杂的数据集时，这一问题往往会出现。为了在如今的\
  \ BI 系统中提供可操作的洞察，需要实时处理数百万条记录，而传统算法往往无法维持。\n\n大多数机器学习算法都是计算密集型且内存密集型的，例如 `SVMs`\
  \ 和旧的聚类算法。例如，在处理 `k-meansclustering` 时，当面对数百万条记录时，计算成对距离矩阵是不可能的。高维空间上的深度学习模型需要巨大的计算资源，只有当硬件专门为此过程进行优化时才能实现。\n\
  \n更严重的是，在动态环境中也存在可扩展性问题，例如在物联网驱动的供应链或实时欺诈检测中，数据在不断地产生。算法应该适应新数据，而无需从头训练——而大多数传统模型在计算量上是禁止做到此的。\n\
  \n### 3.6.2.1 解决方案\n某些框架（如 `Apache Spark` 和 `Hadoop`）通过在数据处理的计算密集型任务中使用并行计算，支持机器学习的可扩展性。在算法方面，增量学习始终使用新数据更新模型，这在如今被广泛使用。硬件加速器（从\
  \ `GPUs` 到 `TPUs`）的进步使得在同一数据集和样本中训练复杂模型变得可行。\n\n### 3.6.2.2 挑战\n该领域最主要的伦理问题可能是训练数据中的偏见；简单来说，历史上的不公或平衡的数据集会产生歧视结果。例如，一个在之前的招聘数据上训练的招聘\
  \ `DSS`（决策支持系统），如果数据集反映了历史歧视，将会重复性别或种族偏见。\n\n隐私是一个更敏感的问题，特别是在医疗保健或金融等领域，因为分析的信息涉及高度个人化甚至是敏感的\
  \ 57 数据样本。这意味着，在没有对数据进行匿名化或获得同意的情况下，共享或处理后的数据样本存在违反 `GDPR` 或 `CCPA` 等隐私法律的风险。\n\n\
  ### 3.6.2.3 解决方案\n伦理考量需要公平敏感型机器学习算法和去偏技术，使模型能够公平地对待不同的人口群体。隐私保护方法（如差分隐私和联邦学习）使企业可以使用不侵个人隐私的敏感数据。伦理建议和治理结构将进一步确保所应用的机器学习符合社会价值观和法律标准。\n\
  \n## 3.7 机器学习模型的可解释性与解释性\n\n可解释性和可说明性对于机器学习模型在 BI 环境中的采纳和信任至关重要。利益相关者必须知道模型为何以及如何预测某些内容或推荐某些内容，特别是在医疗保健、金融和刑事司法等高风险领域。\n\
  \n### 3.7.1 挑战\n许多先进机器学习模型（包括深度神经网络和集成方法）像“黑箱”一样，以牺牲透明度为代价换取高准确率。例如，一个用于信用评分的随机森林模型被用来对信誉做出精确预测，但无法解释哪些特定因素影响了决策。\n\
  \n缺乏可解释性是用户信任的障碍，并阻了问责。这种局限性为机器学习在需要审计和可解释决策的监管行业中的应用形成了巨大障碍。利益相关者倾向于拥有准确率较低但更简单且可解释的模型。\n\
  \n### 3.7.2 解决方案\n可解释人工智能 (`XAI`) 技术填补了准确性与可解释性之间的空白。其他技术包括 Shapley 加性解释 (`SHAP`)\
  \ 和局部可解释模型无关的解释 (`LIME`)，它们通过识别单个特征如何影响模型预测来提供特征贡献的解释。BI 仪表板包含了可视化工具，允许利益相关者对模型输出进行交互式探索，并结合用户教育，这能够在组织内部建立信任和健全的决策流程。将机器学习应用于\
  \ BI 的挑战包括多个层次，如数据质量、算法的可扩展性、伦理影响和模型可解释性。为了解决所有这些问题，必须整合更先进的技术、稳健的框架和深思的设计原则。在这种情况下，克服所有障碍将允许组织利用机器学习驱动的\
  \ BI 的变革性力量，通过运营提供更智能的决策和更大的价值。\n\n58.\n\n## 3.8 BI 机器学习的未来趋势\n\nBI 与机器学习的整合正通过新的方法和技术不断创新，这些技术将塑造其未来。它研究了重新定义机器学习如何改进\
  \ BI 的主要趋势，包括 `XAI` 的发展、实时流、`IoT` 的作用，以及机器学习技术如何指导更好的决策过程。每一个趋势都是让 BI 系统变得更加智能、透明和动态的一步。\n\
  \n### 3.8.1 BI 中可解释人工智能 (XAI) 的发展\n`XAI` 处理了困扰 BI 机器学习的最挑战性问题之一：模型预测需要更高水平的透明度和信任。传统的机器学习模型是“黑箱”。相反，`XAI`\
  \ 试图向用户解释其内部机制。\n\n#### 3.8.1.1 XAI 进展\n`XAI` 技术的进展包括 `SHAP`、`LIME` 和事实解释。所有这些技术大大提高了复杂机器学习模型的可解释性。例如，`SHAP`\
  \ 为每个特征对模型输出的贡献分配衡量；因此，`SHAP` 为客户细分或欺诈检测过程等 BI 场景提供了更细粒度的洞察。\n\n#### 3.8.1.2 对 BI\
  \ 的影响\n由于包含 `XAI` 的 BI 系统允许利益相关者对输出进行直接检查和验证，因此增加了信任和接受。这种透明度也成为金融和医疗等监管领域的强制性合规标准。最后，`XAI`\
  \ 让非技术用户（如经理或其他高管）对基于机器学习的洞察进行互动感到放心，这意味着这些复杂的 BI 工具将获得更广泛的接受。\n\n### 3.8.2 流处理与机器学习\n\
  \n\n\n\n\n实时数据流处理与分析已成为现代商业智能（BI）系统的骨干。大多数企业在快速节奏的业务环境中运营，对实时洞察的需求日益增长，这反过来驱动了与\
  \ ML 集合集成的高级流处理技术的发展。\n\n### 3.8.2.1 技术赋能\n\n得益于 `Apache Kafka`、`Apache Flink` 和\
  \ `Spark Streaming` 等系统，人们可以摄取数据并在过程中进行分析。因此，`ML` 模型可以在数据产生时进行处理，并交付即时洞察。例如，零售链的订单可以根据各门店实时销售数据进行动态调整。\n\
  \n这一趋势的关键特征是在线学习算法，它根据新数据的到来增量地更新 `ML` 模型。与批量学习相比，在线学习的优势在于它能确保模型无需重新训练整个数据集即可保持更新，从而节省了计算资源并降低了延迟。\n\
  \n### 3.8.2.2 在 BI 中的应用\n\n实时数据流构成了以下用例的基础：动态定价、欺诈检测和客户体验个性化。例如，电子商务网站将应用有关客户交互的流数据，为消费者提供实时产品推荐，从而提高其转化率。在金融服务领域，实时异常检测系统可以快速警报疑交易，从而减少因欺诈造成的损失。\n\
  \n### 3.8.2.3 未来前景\n\n集成了实时 `ML` 的 BI 系统不仅能提供事件反应，还能基于 `ML` 算法提供事件预测和实时响应。随着此类 BI\
  \ 系统的普及，运营敏捷性将成为行业相继出现的新热门词汇。\n\n### 3.8.2.4 IoT 驱动的 BI 洞察\n\n`IoT` 设备（例如传感器、可穿戴设备和智能家电）持续收集指标数据，包括温度、位置、能源消耗和用户交互。随后，`ML`\
  \ 模型通过处理数据样本提取出可操作的洞察。例如，在制造业中，由 `IoT` 启的预测性维护系统将分析传感器数据，预测设备何时可能发生故障并提前安排相应的维修。\n\
  \n零售商利用 `IoT` 数据优化店内布局和库存管理。通过使用 `ML` 对客户移动和产品交互进行分析，可以使模型建议商店配置，以实现销售额和客户满意度的最大化。\n\
  \n### 3.8.2.5 挑战与解决方案\n\n`IoT` 数据具有高速度、高容量和多变性的显著特征，这给传统的 BI 系统带来了复杂性。因此，边缘计算以及分布式数据处理框架成为极具前景的解决方案，能够在靠近数据样本源的地方进行实时分析。此外，联邦学习正在开发保护隐私的技术，确保在不损害任何个人数据集的情况下对\
  \ `IoT` 数据进行分析。\n\n### 3.8.3 决策中的新兴 ML 技术\n\n`ML` 领域目前正经历着新一波创新创新技术的诞生，并将彻底改变 BI\
  \ 集合中的决策理念。在这里，创新从早期的模型扩展出来，并可能用于进一步增强对过程的复杂且具有情境感知能力的洞察。\n\n### 3.8.3.1 BI 中的强化学习\n\
  \n`RL` 通过试错训练智能体（agents）做出顺序决策，现在在 BI 应用中越来越受到关注。`RL` 在优化复杂系统（如供应链或投资组合）方面表现优异，其决策具有连锁反应。它在医疗健康和金融领域极其有用。\n\
  \n### 3.8.3.2 图神经网络 (GNNs)\n\n`GNNs` 正在成为分析关系数据（如社交网络、供应链和客户交互）的重要工具。它们被用于社交媒体营销或预测客户流失。\n\
  \n### 3.8.3.3 自监督学习\n\n依赖海量数据进行预训练的自监督学习使得 BI 在标记数据稀缺的领域成为可能。这将提高欺诈检测的准确性。\n\n###\
  \ 3.8.3.4 应用与未来影响\n\n这些新技术开始推向 BI 的边界，因为它们导向了更好、更高效的过程。使用这些方法将带来额外的可扩展性、适应性和智能性。可解释\
  \ AI 支持了这种对透明度和信任的关键需求，而集成实时数据流则带来了更快的响应速度和更高的敏捷性。随着 `IoT` 更深层次贡献，基于 BI 的洞察范围从丰富的数据集中得到了丰富和扩展。因此，这些共同构成了下一代\
  \ BI 系统，使企业能够在不断流动的环境中以更高的精度、效率和预见性进行运营。\n\n## 3.9 总结\n\n`ML` 已与 BI 融合，通过利用数据实现对效率的规范性洞察以及创新策略，重新定义了组织内部决策方式的跨越。这些发现定义了\
  \ `ML` 在支持 BI 功能中的关键作用，并为围绕基于 `ML` 的解决方案实施业务运营提供了战略步骤。\n\n### 3.9.1 ML 在带决策的 BI\
  \ 中的作用\n\n通过将 `ML` 整合到 BI 中，它将 BI 从回顾性分析工具转变为前瞻性的决策中心。传统的 BI 系统非常擅长总结过去趋势，但通常不具备对当前业务挑战进行预测和建议的能力。`ML`\
  \ 在此过程中提供了帮助，因为它会处理海量数据并发现那些在不同场景下原本无法检测的模式。\n\n预测分析是 `ML` 对 BI 的主要贡献之一。企业能够回归回归、随机森林\
  \ (`Random Forests`) 和梯度提升机器 (`Gradient Boosting Machines`) 等模型准确地预测销售、需求和市场趋势。这是企业能够更好地优化库存水平、资源利用和客户需求的能力之一。类似地，由\
  \ `RL` 和优化算法驱动的规范性分析为更改价格或在过程中优化供应链等结果提供了可操作的建议。\n\n预测一直是 `ML` 承担的主要角色。但远超预测，`ML`\
  \ 的意义大得多。事实上，通过无监督学习技术，企业可以进行客户细分、异常检测和探索性分析，揭示经典 BI 系统可能会错过的洞察。聚类算法的使用将有助于将这些内容归类为有意义的子集，作为针对性营销活动的基础并交付独特的客户体验。\n\
  \n\n\n\n此外，机器学习增强了商业智能（BI）的实时响应能力。实时数据流结合在线学习算法，确保决策能够根据最新信息做出。在电子商务和金融等领域，决策滞后可能会导致损失或风险增加。\n\
  \n尽管前景广阔，但不应忽视在 BI 中应用机器学习面临的挑战。必须解决数据质量、可扩展性问题、伦理问题和可解释性，才能真正利用机器学习驱动的 BI 系统。然而，所有这些问题正随着新的预处理工具、分布式计算、联邦学习和可解释人工智能（XAI）技术的发展逐步得到解决。\n\
  \n## 3.9.2 机器学习驱动的业务管理战略路线图\n\n简而言之，必须采用路线图，并结合战略对齐技术，才能在无缝融入实现机器学习与 BI 所有潜在利益的过程中，否则将面对残酷的现实，以真正捕捉某些完整的运营现状。这一路线图的实际结果意味着了一系列在技术、组织和文化上定义的步骤和操作。\n\
  \n### 3.9.2.1 数据驱动的文化\n\n这为数据驱动文化背景下机器学习赋能的业务管理奠定了基础。组织必须构建一种将数据视为战略资产的环境，并使具备充分数据素养的员工能够更好地解释数据提供的洞察。执行管理层的支持是必要的，因为在任何问题上，这都取决于领导层如何驱动这种数据驱动决策（DDDM）的实践。\n\
  \n### 3.9.2.2 投资基础设施和数据质量\n\n高质量数据是机器学习模型的命脉。业务数据样本需要通过数据湖、数据仓库和集成平台等稳健的数据基础设施进行集中和标准化。需要建立数据治理框架，以确保数据的一致性、准确性并符合监管要求。应该建立预处理流水线，以自动化数据清洗、转换和特征工程，为机器学习分析准备数据。\n\
  \n### 3.9.2.3 选择最适合应用场景的适当机器学习技术\n\n不同的业务应用需要不同的机器学习技术。对于预测任务，强大的监督学习模型主要是梯度提升回归树（GBM）和深度神经网络。像\
  \ k-means 聚类等无监督学习技术最适用于细分和探索性分析。此类应用非常适合优化问题，图神经网络（GNN）完美适合分析关系型数据样本。因此，企业需要分析其特定的应用，并在过程中选择最有前景的应用。\n\
  \n### 3.9.2.4 实时能力的整合\n\n运行动态业务的人员应该能够将实时数据流注入 BI 系统。通过使用 Apache Kafka 和 Spark Streaming\
  \ 等技术结合在线学习算法，流数据的摄取和处理是可行的。模型的更新确保了实时可行性，允许对开发中的事件做出快速响应，从而增强了运营灵活性，并提高了对不同场景下客户的响应速度。\n\
  \n### 3.9.2.5 挖掘物联网和新兴数据源\n\n物联网（IoT）设备的使用增加为企业改进其 BI 系统提供了新途径。IoT 传感器数据和基于位置的信息将为运营和客户行为分析带来急需的丰富。边缘计算框架支持在边缘进行\
  \ IoT 数据处理，从而支持实时分析。企业应寻求与新兴数据源建立伙伴关系和合作，以补充他们现有的数据集样本。\n\n### 3.9.2.6 实现可扩展且灵活的技术\n\
  \n可扩展性至关重要，因为处理日益增长的数据量、速度和多样性是必不可少的。分布式计算平台、云机器学习服务以及 GPU 等硬件加速器使企业能够扩展其机器学习能力。同样重要的是灵活性，模块化架构和\
  \ API 意味着组织可以在新工具和技术出现时轻松集成。\n\n### 3.9.2.7 组建跨职团队\n\n这种强大的机器学习驱动 BI 部署需要技术、分析和特定领域团队之间的跨学科协作。开发和部署符合业务目标的解决方案将需要数据科学家、工程师和业务分析师之间的合作。只有当跨职团队将其变为现实时，机器学习洞察才能证明在技术上是正确的、可操作的且与决策相关的。\n\
  \n### 3.9.2.8 监控、评估与迭代\n\n机器学习模型和 BI 还需要对性能和相关性进行持续监控，以便决策者了解输出。持续创新是保持领先的关键。企业需要探索联邦学习和自监督学习等新兴技术，以数据驱动经济中开启新的可能性。无论是预测分析还是客户细分，机器学习的\
  \ BI 系统重新定义了运营的方式。\n\n## 参考文献\n\n1. Haas, S., Hüllermeier, E. Conformal machine\
