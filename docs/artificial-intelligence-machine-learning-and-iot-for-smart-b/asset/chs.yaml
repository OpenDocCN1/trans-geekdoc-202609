  \ 1–4). IEEE. 返回正文.\n\n\n\n\n一种创建、维护和增强与消费者之间持久且忠诚关系的整体方法被称为客户关系管理，或 `CRM` (Sibisi\
  \ 2024)。它在包括零售、电信、保险和银行在内的各种行业被广泛接受和使用。\n\n服务市场面临激烈的竞争，不同的供应商提供具有吸引力的优惠。客户可以自由选择提供更优服务的机构，这将导致收入的直接损失。企业正投入大量精力使用各种策略在这一残酷竞争的环境中生存。为了增加收入，银行业采用了主要方法，如获取新客户（也称为\
  \ `customer acquisition`）、向现有客户进行交叉销售以及延长客户留存（俗称为 `customer attrition`）。通过比较这些方法并考虑每种方法的投资回报率（`return\
  \ on investment`）发现，留住现有客户是最有利的方法 (Almestari et al. 2024)。这意味着留住现有客户比获取新客户要便宜得多\
  \ (Gurung et al. 2024)。留住客户也被认为比交叉销售策略简单得多。\n\n留住当前消费者是订阅制产品扩张的关键方面之一。银行和保险市场竞争激烈，因为有大量受监管的提供商\
  \ (Booth 2022)。永久地失去消费者是非常糟糕的。此外，如果大量不满意的客户离开公司，公司将遭受巨大的财务损失和声誉损害。最近的一项调查发现，获取客户的成本可能是留住客户的五六倍\
  \ (Pandey and Shukla 2021)。\n\n客户流失（俗称为“customer churn”）是一个术语，用于银行忠实客户停止购买其产品的现象\
  \ (Klepac et al. 2015)。金融机构在特定持续时间内流失客户的速率被称为 `churn rate`，有时也被称为 `customer attrition\
  \ rate`。确定 `churn rate` 的方法是计算在此期间流失客户占总人数的百分比 (Wagh et al. 2024)。这给出了 198 的客户流失率。例如，如果某银行在某月增加了\
  \ 50 个新客户，同时有 2 个客户离开，那么 `customer attrition rate` 就是 4%。\n\n`churn rate` 是评估企业的一个重要指标。（此处省略重复段落以符合不重复输出原文的要求）\n\
  \n\n\n为了留住现有客户，金融交易必须识别客户流失的原因，这可以通过基于已获得数据得出的洞察来确定。广泛的研究表明，机器学习（ML）创新在预测这种状况方面特别有效。这种方法通过从历史数据中学习来实现。机器学习是一种数据分析技术，它使用编程来产生分析原型。机器学习通过涉及一组能够利用数据持续获取知识的规则，使系统能够在无需被明确告知去哪里寻找的情况下发现未被检测到的趋势。机器学习方法的三大主要类是监督学习、半监督学习和无监督学习。监督学习是识别带标签数据集中未知排列的机器学习问题。无监督学习是一项识别无标签数据中隐藏模式的机器学习活动。半监督学习介于监督学习和无监督学习之间。它同时使用两种类型的记录，即用一小部分标记记录用于训练，一组未标记数据用于预测（Injadat\
  \ et al. 2021）。流失预测是一个二分类模型，用于从非流失客户中识别出流失客户。\n\n留住现有客户的成本远低于为网络增加新订阅者（Lu et al.\
  \ 2021）。客户流失是公司利润的直接损失。如果能提前获得客户流失的知识，就可以采取适当努力为这些消费者提供优质服务。长期消费者为公司产生更多资金，因为他们对微变化的反应较小。处理流失客户是目前银行业面临的最困难且最重要的挑战之一。根据最新研究，主要目标是通过分析金融机构的海量数据来寻找盈利的流失客户。在实践中，采用现有方法存在许多局限性，在解决当前的流失问题方面面临许多挑战和障碍。在模型开发过程中，许多具有重要信息的特征在特征选择阶段被忽略（Li\
  \ et al. 2018）。大多数统计方法被应用于广泛领域，导致当前预测模型的结果不如人意。现有技术的另一个主要问题是选择一组特征。每个消费者，无论是个人还是集体，都可能出于各种原因迁移。无论导致其离开银行的原因和因素是什么，消费者都可能被归类为流失客户。在流失过程中，会出现各种行为模式，不应对对其进行一同对待。某些消费者离开的速度可能不像其他人那样快。现在的需求是一个更全面的预测框架，能够提前预测客户流失（Wu\
  \ et al. 2021）。这对于为不同流失客户群体提供稳健的留存计划将非常有帮助，例如根据每个群体的流失变量提供各种优惠。基于上述呈现的事实和观察结果，本研究提出了一种使用各种机器学习算法预测流失客户的模型。\n\
  \n本研究旨在利用先进的机器学习技术，为客户流失构建一个稳健的预测原型，以帮助企业识别高风险客户并主动实施留存策略。这项工作的目的是建立一个完美且可扩展的客户流失预测模型。该模型将分析历史客户数据以预测流失，并提供可操作的洞察，使企业能够实施有效的留存策略并提高客户满意度。客户流失预测模型将：\n\
  \n*   探索过去的客户数据，以发现有助于客户流失的模型和方面。\n*   预测现有客户的流失概率。\n*   提供可操作的洞察，帮助银行业企业开发针对性的留存策略。\n\
  \n## 11.2 银行业无机器学习的流失预测案例研究\n\n花银行（Citibank）是印度的一家知名私人银行。其控制客户流失的方法说明了机器学习在有效管理客户流失方面的重要性。最初，银行依赖标准数据分析方法来获取有关流失趋势的初步洞察。然而，这些方法在预测哪些消费者最可能更换银行及其原因方面能力很小。通过采用决策树和逻辑回归等机器学习算法，花银行的预测能力大幅提高（Nosratabadi\
  \ et al. 2020）。机器学习模型通过分析服务利用的复杂趋势，帮助银行识别风险客户。流失率迅速下降了约 15%。这表明预测模型比传统方法可以提供更深层次、更实用的洞察。\n\
  \n美国另一家热门金融机构——美国银行（Bank of America）强调了实施机器学习方法识别流失客户的重要性。在初始阶段，美国银行也采用了传统方法，例如根据服务使用和账户活动创建客户细分（Kovács\
  \ et al. 2021）。尽管这些方法提供了一些洞察，但预测准确性并不高。该银行随后实施了聚类等不同的机器学习模型。这改进了其预测可能的不满客户并制定定制化留存政策的能力。面向机器学习的方法证实了更明确、强有力的策略，并使流失率下降了约\
  \ 12%。\n\n星星银行（DBS Bank）是一家新加坡银行，它在流失预测中实施了广泛使用的机器学习概念，使其能够灵活地制定有效的客户留存政策（Jameaba\
  \ 2022）。该银行通过采用机器学习技术而非传统方法，克服了收入低的担忧。星星银行使用神经网络和梯度提升等算法来理解影响流失的因素。这项技术协助检查复杂的客户数据并高精度地预测流失，导致流失率下降了\
  \ 18%。\n\nFinSecure Bank 是另一家使用传统方法分析客户数据的印度热门金融机构。在引入机器学习概念后，该机构从常规数据分析转向机器学习模型。FinSecure\
  \ Bank 使用梯度提升和 `RF` 等模型来预测流失。它现在能够解码复杂的客户行为并实施主动的留存策略，以数据为导向。该银行显著降低了约 20%的流失率（Miller\
  \ and Toman 2016）。\n\n\n\n\n这些案例研究强调了机器学习（ML）模型在金融市场中预测高风险客户的精确性和效率。虽然传统方法提供了基础性思路，但机器学习模型帮助获得更佳的预测能力和实践建议，从而极大地增强了客户留存工作。机器学习评估具有挑战性的数据趋势并生成即时预测的能力，显示了其在有效控制客户流失方面的卓越效果。\n\
  \n## 11.3 文献综述\n\nChih-Fong Tsai 开发了一种混合神经网络（Tsai and Lu 2009）。该项目使用了从一家美国电信公司收集的\
  \ CRM 数据。通过合并自组织映射（`SOM`）和反向传播人工神经网络（`ANNs`），设计了两种用于流失预测的组合模型。混合模型为 `ANN + ANN`\
  \ 和 `SOM + ANN`。在第一阶段对数据进行降维。特别是这两种融合模型中的初始步骤是通过移除无效的训练数据来实现数据缩减。该阶段的结果被用于构建预测算法。模型在一组标准数据和两组不精确的数据上进行了评估。结果显示，混合模型的性能优于标准神经网络技术。`ANN\
  \ + ANN` 模型的性能精度优于 `SOM + ANN` 模型。\n\nNing Lu 提出了一种采用提升算法的新型技术（Lu et al. 2014）。根据提升算法分配的程度将客户划分为两个部分，该算法可以高效地预测出离开公司概率较高的客户群。`Logistic\
  \ regression` 被用作主要学习器，并为每个部分设计了预测流失的模型。结果表明，提升方法的预测效果优于 `logistic regression`。\n\
  \nSsu-Han Chen（[2016） 提出了一种基于伽马累积求和（`CUSUM`）图的新型技术，该技术通过使用有限融合模型跟踪每个客户的到达间隔时间（`IAT`），以设计可视化图表的参考标准和决策尺度，以及记录客户多样性的有序贝叶斯结构。202.\
  \ `Recency` 是 `IAT` 中包含的另一个变量，用于衡量时间间隔。它被纳入框架中以监控认证活动的最新状态。此外，提交的解释为每个客户包含一个 `GUI`。结果显示，伽马\
  \ `CUSUM` 图的准确率比指数 `CUSUM` 高 5%（`ACC`），平均信号时间（`ATS`）比指数 `CUSUM` 大约长两天。\n\nLee 等（[2011））在强相关数据点上使用了基于偏最小二乘（`PLS`）的方法，设计了一个准确且清晰的流失预测模型。除了建立用于准确估计客户流失的预测模型外，还建立了一种基础但获益的流失广告策略。推荐的方法允许营销高管在促销活动中有效且无缝地维持适当的留存人数。\n\
  \nKoen W. De Bock（[De Bock and Van Den Poel 2012）也提出了一种利用广义相加模型（`GAMs`）概念的集成分类器，该模型根据准确性和可访问性共同评估。该模型使用随机子空间方法、`bagging`\
  \ 和半参数 `GAMs` 作为基础分类器。使用从 6 个主要现实情况收集的数据集对模型进行评估，结论认为，所提模型比标准的 `GAM` 和 `logistic\
  \ regression` 具有更高的精度。\n\nM.A.H. Farquad（[Farquad et al. 2014）开发了一种减少标准 `SVM` 缺陷的方法。`SVM`-递归特征剔除（`SVM-RFE`）在第一阶段执行。该技术包括三个阶段：使用归素贝叶斯和决策树的组合（称为\
  \ `Tree`）。不平衡数据集包含 7% 的流失客户 93% 的非流失客户。Verken 等（[Verken et al. 2013）提出了一种创新的性能指标——预期利润，有助于企业选择目标。\n\
  \n一种基于 `SVM` 的方法由 He 等（[He et al. 2014）实施，用于预测流失。他们使用的不平衡数据提高了系统的精度。`SVM` 在高维或无限维空间中构建超平面。随机采样方法用于调节流失客户比例低于非流失客户的数据分布。\n\
  \nKoen W. De Bock（[De Bock and Poel 2011）建议了名为旋转森林（`Rotforest`）和旋转提升（`RotBoost`）的两种集成分类器，具有旋转的概念。集成分类器将多个分类器整合到一个模型中。`Rotforest`\
  \ 使用特定属性的提取来训练单个分类器，而 `RotBoost` 则整合了 `Rotforest` 和 `AdaBoost`。使用了四个领域的真实数据集。`Rotforest`\
  \ 在 `AUC` 方面优于 `RotBoost`，而 `RotBoost` 在精度上优于 `Rotforest`。\n\n203.\n\n## 11.4 数据描述\n\
  \n图 11.1 展示了预测系统的基本步骤。在第一阶段，从相关银行收集数据集。该数据集由用于训练的原始数据组成。第二阶段包括数据预处理，移除缺失值、离群值等噪声。特征选择是第三阶段，考虑对目标变量有效的特征，如图\
  \ 11.2 所示。在第四阶段选择正确的模型。随后在第六阶段使用数据集的一个集对所选模型进行训练，并在第七阶段使用数据集的剩余部分进行测试。常用的训练与测试比例为\
  \ 7:3。理想模型预期对新样本预测到正确的类别。这种分类是基于训练模型的数据的。最后，在最后一个阶段将模型结果与某些标准或之前的预测进行比较，以衡量其效率。\n\
