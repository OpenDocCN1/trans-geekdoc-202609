  ## 结果与讨论\n\n### 9.1 对比分析\n\n该算法与已知方法的对比研究如下：\n\n| 算法 | 平均值 | 标准差 | 优解 |\n| :---\
  \ | :--- | :--- | :--- |\n| WOA | 125.43 | 12.34 | 110.21 |\n| GWOA | 118.21 | 9.45\
  \ | 98.56 |\n| HWOA | 112.15 | 7.12 | 92.34 |\n| 提出的 WOA | 105.67 | 5.23 | 85.12\
  \ |\n\n结果显示，所提出的算法在平均值、标准差和优解方面优于其他算法。\n\n### 9.2 完成时间 (TCT)\n\nTCT 是任务完成所需的时间。下表显示了不同算法的\
