  \ `t` 的当前值和随机误差；这些被称为模型参数 `⌀i` 和 `⌀j`。\n\n图 9.2 显示了使用 ARIMA 模型预测新数据的流程图。加载和分析数据是确定适当参数的第一步。此外，对数据进行预处理是必要的，以消除可能导致预测不准确的噪声。可用，可以使用季节性、AR\
  \ 和 I 来获取每个参数。接下来，使用这些参数构建一个 ARIMA 模型，并通过与实际数据比较来估计误差。要被认为是适当的，模型预测中的误差必须超过标准值 `∈`。相反，如果误差超过，则需要更改通过学习算法调整的参数值。然后，使用修改后的参数创建一个新的\
  \ ARIMA 模型并运行另一个误差估计。重复此过程直到误差值满足指定条件（`error < ∈`）。ARIMA 用于根据历史延迟数据预测未来性能，这对于保持沉浸式体验的质量（特别是应用程序）至关重要。ARIMA\
  \ 使用时间序列数据预测趋势，允许主动分配资源以避免可能的延迟。这防止了实时通信中的干扰，从而产生更平滑、响应更快的体验。该模型通过结合自回归（AR，使用过去值预测未来点）、差分（I，消除趋势并使数据稳定）和移动平均（MA，考虑之前的预测误差）来工作。在沉浸式应用的背景下，主动延迟预测允许网络编排进行动态带宽调整，从而优化用户体验（QoE）。\n\
