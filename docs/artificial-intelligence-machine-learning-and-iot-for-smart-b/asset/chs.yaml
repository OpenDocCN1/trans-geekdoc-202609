  \ `AVE` 的平方根，表明构念之间存在差异性。结果显示变量之间缺乏实质性相关，证实了研究中不存在多重共线性，这与文献 [60] 的观察一致。\n\n###\
  \ 表 7.3 结构模型结果\n\n| `Hypotheses` | `Path` | `Estimate` | `Result` |\n| --- | ---\
  \ | --- | --- |\n| `H[1]` | `PE → VAC` | 0.37 | 支持 |\n| `H[2]` | `EE → VAC` | 0.45\
  \ | 支持 |\n| `H[3]` | `SI → VAC` | 0.34 | 支持 |\n| `H[4]` | `FC → VAC` | 0.24 | 支持\
  \ |\n| `H[5]` | `FC → CE` | 0.67 | 支持 |\n\n### 7.3.4 结构模型与假设检验\n\n`PLS-SEM` 方法论的第二步涉及评估结构模型。该评估分析了与模型假设相关的标准化\
  \ beta 系数和 `t` 值。模型中研究了包括社交媒体影响者、社交媒体平台声誉和内容吸引力在内的自变量。此外，信息社会影响和规范社会影响被视为中介变量，冲动行为是因变量。\n\
  \n假设 `H[1]` 确定 `PE` 是否显著影响语音辅助机器人的使用。该关系为正相关。[表 7.3] 中所示的结果显示，绩效期望在预测此背景下的 `VAC`\
  \ 使用方面发挥了重要作用（`β = 0.37`, `p < 0.05`），证实了 `H[1]`。假设 `H[2]` 检验了 `EE` 是否正向影响语音辅助机器人的使用。[表\
  \ 7.3] 显示努力期望对 `VAC` 的使用确实有影响（`β = 0.45`, `p < 0.05`），支持 `H[2]`。\n\n假设 `H[3]` 测试了\
  \ `SI` 是否影响语音辅助机器人的使用。该关系为正相关。根据从 `PLS-SEM` 获得的结果确定 `SI` 显著影响 `VAC` 的使用，`β` 值为 0.34，`p`\
  \ 值小于 0.05。因此，验证了 `H[3]`。假设 `H[4]` 确定 `FC` 是否正向影响语音辅助机器人的使用。结果表明便利条件在预测用户行为方面发挥了重要作用，`β`\
  \ 值为 0.24，`p` 值小于 0.05。因此，支持 `H[4]`。假设 `H[5]` 测试了语音辅助机器人的使用是否正向影响客户参与度。这两个因子之间连接的稳健性为这种关联提供了证实（`β\
  \ = 0.67`, `p < 0.05`）。因此，验证了 `H[5]`。\n\n## 7.4 发现\n\n结果显示 `PE` 对 `VAC` 使用具有显著的正向影响（`β\
  \ = 0.37`, `p < 0.05`）。这证实了如果用户假设机器人有用且能提高他们的绩效，他们将倾向于采用，从而支持了 `H[1]`。`EE` 对 `VAC`\
  \ 的采用影响最大，`β` 值为 0.45（`p < 0.05`）。这一发现支持了 `H[2]`，表明当人们发现机器人易于使用时，他们更倾向于采用。\n\n模型证实\
  \ `SI` 显著影响 `VAC` 的使用（`β = 0.34`, `p < 0.05`）。验证了 `H[3]`，表明人们的使用决策受到社会因素（如同伴、教师或社会规范）的影响。\n\
  \n根据模型，`FC` 对人们的使用具有正向影响（`β = 0.24`, `p < 0.05`），证实了 `H[4]`。这表明适当的技术支持和环境在鼓励使用机器人方面起着重要作用。\n\
  \n研究发现使用 `VAC` 显著增强了客户参与度（`β = 0.67`, `p < 0.05`）。假设 `H[5]` 得到验证，表明机器人使用与参与度提高之间存在强关联。\n\
  \n## 7.5 讨论\n\n分析强调了各种因素在预测 `VAC` 纳入方面的相关性。`PE` 和 `EE` 是关键预测因子，这与 UTAUT 模型原理一致。如果用户认为机器人对任务有益且易于操作，他们就会倾向于使用。`SI`\
  \ 的有效作用建议，同伴推荐、社会规范和教师背书会严重影响人们纳入新技术的行为。这了通过社区和小组活动推广机器人使用的重要性，可能利用口碑策略或来自影响力的同伴或教师的证言。`FC`\
  \ 也证明是机器人采用的一个重要因素，强调了机构需要提供足够的资源和支持以便人们有效使用这些工具。确保人们获得必要的设施可以显著减少潜在的采用障碍。最后，研究证实使用\
  \ `VAC` 可以增强客户参与度。这凸显了此类技术不仅用于学术目的，还能促进与人们建立更深层次的互动和关系，提高整体满意度和参与度。\n\n## 7.6 结论\n\
  \n\n\n\n\n本章重点关注了 `VAC` 如何提升客户参与度，并为小企业产品带来了更佳的客户关系管理器。本研究专门针对小企业产品，旨在帮助它们在长期内实现指数级增长和扩张。由于目前小企业产品不断演变，小企业需要在其应用中引入\
  \ `AI` 以及高级别的客户参与工具。良好的客户参与有助于网站和应用程序的优质定制，最终将提高客户留存率，从长远来看有助于建立客户关系。语音辅助机器人能够实现极佳的客户参与，并能自动引导客户完成购买流程，从而优化购买偏好。\n\
  \n## 7.7 理论与实践意义\n\n本章旨在探讨 `AI` 如何再次变革数字营销，以及它如何造福小企业在全球范围内增长。随着“印度创业之鲨”和“印度制造”（Make\
  \ in India）倡议的出现，小企业已成为增长最快的业务之一。小企业正以指数级增长，并深受人们推崇 [67–69]。随着 `AI` 驱动的应用型系统的加入，这些企业在市场上拥有更大的增长机会，更值得赞赞。`VAC`\
  \ 的出现使消费者能够更快速地探索应用程序。`VAC` 让网站导航变得更加简单，并提升了这些网站在电子商务平台上留存客户的时长。网站的长效留存策略能够促进消费者购买。在网站上停留时间越长的消费者越可能产生购买。这对于小企业在市场中保持高可见度至关重要。小企业根据客户需求设计电子商务网站。`VAC`\
  \ 形式的定制使网站更具客户参与度。拥有更高客户参与度的网站可以建立 `CRM`。良好的客户参与可以建立有效的客户关系。小企业在市场的长期可持续发展需要有效的\
  \ `CRM`。因此，`VAC` 使客户能够更有效地与小企业的网站进行互动，帮助小企业建立品牌形象。`VAC` 使得产品搜索更加容易。客户无需输入即可向聊天机器人询问搜索的产品。聊天机器人是\
  \ `AI`-驱动的应用，它们能够分析网络平台上的客户行为，并在几秒内推荐具有有效定价的最合适产品。聊天机器人通过个性化协助他们将更好的产品放入购物车。对于小企业而言，在平台上拥有此功能至关重要，以实现更大规模的客户参与，从而服务更广泛的群体。使用智能\
  \ `VAC` 设计智能应用和网站提供了更广阔的购物视角。客户可以使用它们无需输入即可导航网站。`VAC` 将更积极地分析用户行为。\n\n## 7.8 局限性与未来研究\n\
  \n本章具有实践性且基于创新；然而，也存在一些局限性，为进一步研究提供了空间。首先，该概念局限于 `UTAUT` 模型。在管理指导领域也发展出了许多其他理论。其次，数据收集使用了便利抽样法，因为只考虑了那些方便获取的受访者。在未来的研究中，可以通过随机抽样进行，让每个参与者都有机会。其他许多因素也有助于利用\
  \ `AI`、`ML` 和 `IoT` 促进小企业产品的发展。第三，未来的研究可以将位置追踪功能引入高级语音聊天机器人中，机器人可以自动评估客户的位置，并推荐附近小企业的产品。\n\
