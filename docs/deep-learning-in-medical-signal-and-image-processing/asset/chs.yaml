  \ ChatGPT 在复杂疾病中的作用。Frontiers in Artificial Intelligence, 7, 3389.\n\n# 第 11 章：用于医学影像的卷积神经网络\
  \ (CNNs)：变革诊断准确性与治疗\n\n### 摘要\n本章深入探讨了卷积神经网络 (CNNs) 对医学影像的变革性影响，强调了其在提高诊断准确性和优化工作流方面的能力。本文概述了\
  \ CNN 架构、原理以及它们如何整合到 X 光、磁共振成像 (MRI) 和 CT 扫描等多种医学模中。通过案例研究，本章探索了其在脑肿瘤、肺炎和皮肤癌检测的应用，同时讨论了迁移学习、基于\
  \ GAN 的数据增强和混合模型等先进技术。讨论强调了可解释人工智能 (XAI) 在克服模型可解释性和伦理考量相关挑战中的作用。通过关注未来进展（包括个性化医疗和临床工作流的无缝集成），本章强调了其变革医疗保健领域的潜力。\n\
  \n## 引言\n拯救生命并减轻疾病带来的心理和生理负担，取决于对医学异常的早期和精准检测。对于青光眼、糖尿病网膜病变、肿瘤、间质性肺病、心血管疾病和结核等疾病，通常需要对多种模态（包括\
  \ X 光、磁共振成像 (MRI)、计算机断层扫描 (CT)、正电子发射层扫描 (PET) 和超声扫描）获取的医学影像进行高级分析。识别异常、定义边界、估算大小以及判断严重程度对于有效的图像解读至关重要。然而，由于异常形状、位置和结构的复杂性，传统技术在这些方面面临着许多挑战。\n\
  \n手动解读的主观性、人类专家可能出现的疲劳以及专业咨询的高昂成本，进一步凸显了智能自动化技术在改进医学影像工作流方面的必要性。\n\n\n\n\n本章首先概述了医学成像，追溯了其演变过程，并通过\
  \ X 光、`MRI` 和 CT 扫描等多种模态强调了其在现代医疗保健中的重要性。随后，介绍了卷积神经网络（`CNNs`），解释了它们的架构和核心组件，同时强调了它们在医学成像中的变革性作用。接着，章节探讨了\
  \ `CNN` 框架的进展，例如 `LeNet`、`VGGNet` 和 `ResNet`，展示了它们的具体应用和优势。真实世界的案例和案例研究演示了 `CNNs`\
  \ 在脑肿瘤和肺炎等疾病诊断中的应用。文中讨论了先进的学习技术，包括预训练网络、迁移学习和混合模型，以解决数据集受限带来的挑战。本章还研究了关键挑战和伦理考量，例如模型的可解释性和患者隐私，并提出了可解释人工智能（`XAI`）等解决方案。最后，它强调了未来方向，包括实时诊断工具和\
  \ `CNNs` 与临床工作流的整合，强调了它们彻底改变医疗保健的潜力。\n\n## 医学成像\n\n医学成像是现代医疗保健不可或缺的基石，为医生提供了强大的诊断和治疗工具，允许对人体内部结构进行所未有的可视化(Aamir\
  \ et al. 2023)。通过利用 `X-rays`、CT 扫描、`MRI` 和超声等先进技术（如图 1)，医学成像代表了理解人类健康的革命性方法，通过对人体复杂系统和潜在健康挑战提供精确、实时的见解，改变了医学实践。\n\
  \n## 医学成像发展时间线\n\n### 早期起源\n\n* • 1895: 威廉·伦琴射线发现 `X-rays`\n* • 1896: `X-rays` 在全球范围内首次获得广泛的医学用途\n\
  \n### 20 世纪中叶的创新\n\n* • 1955: Ian Donald 开始研究用于医学诊断的超声\n* • 1957: 开发出第一代光纤半柔性胃镜\n\
  * • 1967: 格德弗里·豪斯菲尔构思了 `CT scanning` 技术\n* • 1971: 安装了第一台 `CT scanner`，完成了首个患者脑扫描\n\
  * • 1973: 产生了第一批磁共振成像 (`MRI`) 图像\n* • 1974: 开发了第一台正子发射断层扫描 (`PET`) 相\n* • 1977:\
  \ 完成了首次完整人体 `MRI` 扫描\n\n### 现代时代\n\n* • 1979: 豪斯菲尔和 Cormack 因 `CT technology` 获得诺贝尔奖\n\
  * • 1980 年代: 医院安装了 `MRI scanners`\n* • 1990 年代: 超声成为产前监测的常态\n* • 2000: `PET/CT scanner`\
  \ 被《时代》杂志评为年度医学发明\n* • 2003: Lauterbur 和 Mansfield 因 `MRI` 的工作获得诺贝尔奖\n* • 2014:\
  \ 坎特伯大学开始开发世界上第一个人体彩色 `MRI` \n\n### 近期进展\n\n* 医学成像中持续整合 `AI`\n* 进阶的 3D 和 4D 成像\n\
  * 对功能性成像的关注\n* 更精确、低侵入成像技术的发展\n\n该时间线展示了医学成像从简单的 `X-ray` 到复杂的 `AI` 增强工具的卓越演变，这些工具不断彻底改变医疗保健。\n\
  \n**图 1. 医学成像**\n\n![](img/979-8-3693-9816-6.f01)\n\n## 医学成像的核心原理\n\n医学成像依赖于不同类型的“不可见”波，包括电磁辐射、磁场和声波。这些波穿过人体，与组织相互作用，并被探测器捕捉形成图像。\n\
  \n### X 光\n\n`X-ray imaging` 代表了一项突破性的医学技术，利用电磁辐射创建人体图像（如图 2）。该技术通过电子与金属板（通常为钨）的碰撞产生高能电磁波，产生能够穿透人体的辐射，创建组织的视觉表示\
  \ (Ou et al., 2021)。当 `X-ray beams` 穿过人体时，不同组织吸收辐射的情况不同——骨骼等致密材料吸收更多辐射并呈白色，软组织呈灰色，而肺部等充满空气的空间呈黑色，这使得医生能够精确观察内部细节。医学专业人员利用\
  \ `X-ray technology` 进行多种检查，包括胸部成像、骨关节评估、牙科诊断、腹部检查和尿路检查。\n\n**图 2. 人体 X 光**\n\n\
  ![](img/979-8-3693-9816-6.f02)\n\n### 计算机断层扫描\n\n`Computed Tomography (CT) scanning`\
  \ 是一种先进的医学成像方法，利用复杂的 `X-ray technology` 生成人体的精细横截面图像（如图 3\n\n### 磁共振成像 (MRI)\n\n\
  \n\n\n\n# 磁共振成像 (MRI) 是一种先进的医学诊断技术，它利用强磁场和无线电波来创建高度详尽的身体内部图像，且不使用电离辐射 (Aamir et\
  \ al., 2022)。该技术的工作原理是对齐全身水分子中的氢质子，然后应用射频脉冲，使这些质子在返回原始状态时发生偏移并发射信号。这些发射的信号被特殊的接收器捕获，并通过计算机算法处理，从而生成器官、组织和结构极清晰的综合横截面图像。与\
  \ X 射线或 CT 扫描不同，MRI 可以提供精细的软组织细节，如图 4 所示，这对于检查大脑、脊髓、肌肉和复杂的内脏具有极高价值，同时具有无辐射的显著优势。\n\
  \n##### 图 4. 大脑的磁共振扫描\n![](img/979-8-3693-9816-6.ch011.f04.png)\n\n# 核医学成像\n核医学成像是一种创新的医学诊断技术，它使用少量称为放射性示踪的放射性材料在细胞水平上创建人体内部过程的详细图像。与关注结构解剖的传统成像方法不同，核医学通过追踪放射性示踪如何与特定组织相互作用，为器官功能和代谢活动提供了独特的见解。\n\
  \n##### 图 5. 不同类型的医学成像\n![](img/979-8-3693-9816-6.ch011.f05.png)\n\n医学成像自诞生以来经历了深刻的变革，其标志是技术的指数级进步和显著的市场增长。图\
  \ 5 展示了不同类型的医学成像。从 19 世纪末原始的 X 射线机到如今复杂的 AI 集成诊断工具，该领域经历了前所未有的演变。全球医学成像市场已大幅扩张，从\
  \ 2022 年的 292 亿美元增长到 2032 年的预计 488 亿美元，代表年复合增长率约为 5.40%。现代 CT 扫描仪现在可以在不到一秒的时间捕捉\
  \ 128 层图像，而几十年前只能捕捉几层。MRI 技术已从 1.5 特斯拉进展到 3 特斯拉场强磁体，实现了前所未有的身体内部可视化。数字图像采集已完全取代传统胶片，缩短了处理时间并将图像清晰度提高了近\
  \ 70%。人工智能彻底改变了医学成像，AI 解决方案预计将从 2021 年的 135 亿美元增长到 2032 年惊人的 1836 亿美元。\n\n# 卷积神经网络\
  \ (CNN)简介\n卷积神经网络 (CNN) 是一种复杂的深度学习算法，通过模拟人类视觉皮层的分层信息处理来处理视觉数据 (Aamir et al., 2019)。这些网络在多个领域已实现卓越的近人类水平性能，在复杂识别任务中展现了非凡的能力。在人体活动识别中，CNN\
  \ 在分类动作方面达到了 97.20% 的惊人准确率，而自动驾驶车辆物体检测系统在实时追踪和识别方面已达到人类感知水平。医学成像应用利用 CNN 技术检测放射学图像中的复杂模式，有时在癌症检测和诊断解释方面优于人类专家。面部识别系统现在可以以以前所未有的精度分解并分析面部组件，分离出独特的特征\
  \ (Nirani et al., 2023)。由 CNN 驱动的技术将错误率降低到惊人的水平，这种革命性的方法扩展了计算机视觉、自然语言处理和语音识别边界。\n\
  \n##### 图 6. CNN 架构\n![](img/979-8-3693-9816-6.ch011.f06.png)\n\n图 6 展示了卷积神经网络的工作流。\n\
  \n## 输入层\n卷积神经网络 (CNN) 的输入层是原始数据的入口。图像以张量表示，具有三个维度：高度（*H*）、宽度（*W*）和通道（*C*），如图 7\
  \ 所示。该层接收 64x64x3 的图像。\n\n##### 图 7. 输入层\n![](img/979-8-3693-9816-6.ch011.f07.png)\n\
  \n## 卷积层\nCNN 的基础构建块是卷积层，它们能够自动自适应地从输入中提取特征 (Yamashita, Nishio, 2018; Selvamugan\
  \ et al., 2024)。这些层使用一组滤波器（也称为内核），尺寸通常为 3x3。两个重要参数控制滤波器如何在输入上移动：填充（处理边界）和步长（确定移动步大小）。\n\
  \n\n\n\n\n激活层部署在每次卷积操作之后，旨在为网络引入非线性特征。如果没有这些激活层，CNN 将作为线性模型运行，这限制了其理解复杂关联的能力。修整线性单元单元（`ReLU`）是\
  \ CNN 中最常用的激活函数，它用 0 替换负值（`f(x)=max(0,x)`）。这一简单的过程在解决梯度消失问题的同时，也保证了计算效率。在特征可能具有负相关性的情况下，也可以使用\
  \ `Leaky ReLU` 和 `Parametric ReLU` 等变体。得益于这些激活函数，网络能够表示数据中的复杂模式。\n\n对于来自卷积层的每个输出值\
  \ `Y[i,j]`：\n\n`Z[i,j] = f(Y[i,j])`\n\n### 池化层\n\n池化层是神经网络中的关键组成部分，旨在减少特征图的维度，增强网络对输入微小变化的鲁棒性，并降低计算成本。在各种类型中，最大池化（max\
  \ pooling）使用最广泛。它通过选择指定窗口（如 2×2 区域）内的最大值来提取最显著的特征。另一种不常用的选项是平均池化（average pooling），它计算窗口内的平均值。\n\
  \n例如，考虑图 9 中的 4×4 矩阵，将其分为 4 个子矩阵。在最大池化中，第一个子矩阵（红色高亮的 2×2 子矩阵）中的最大值为 32，它成为生成的 2×2\
  \ 矩阵中的第一个元素。同样的过程适用于其他子矩阵。相反，在平均池化中，第一个子矩阵的平均值 15 成为输出矩阵中的第一个元素，并对其他子矩阵重复该过程。\n\n\
  池化层是简单而强大的降维工具。它们在每个特征图上独立运行，不依赖于可学习参数，使得它们在保留关键空间特征的同时具有高计算效率。\n\n### 图 9. 池化\n\
