  \ 2022(1), 78. PMID: [354687](https://pubmed.ncbi.nlm.nih.gov/354687)\n\n# 第 9 章：通过卷积神经网络\
  \ (CNN) 变革医学影像\n\n## 诊断与治疗的进展\nPunam Kumari, 阿米提大学\n\n### 摘要\n卷积神经网络 (`CNN`) 是一种用于图像识别的深度学习模型。医学影像中的\
  \ `CNN` 专门用于处理网格状数据（如图像）。本章探讨了 `CNN` 在分类、分割和目标检测任务中的应用，以增强诊断。文中深入探讨了 `ResNet` 和\
  \ `U-Net` 等关键 `CNN` 架构在放射学、病理学和眼科领域的应用。此外，本章还讨论了隐私、数据安全以及医学可解释人工智能的需求。通过审查前沿的 `CNN`\
  \ 应用，本章强调了深度学习如何通过更准确、高效和个性化的医疗服务变革医疗。\n\n### 1. CNN 与医学影像引言\n\n#### 1.1 深度学习中的\
  \ CNN\n卷积神经网络 (`CNNs`) 是一种特殊的深度学习模型，专门为处理网格状数据（如图像）而设计（Aamir 等，2019）。其灵感源于动物视觉皮层的结构和功能，`CNNs`\
  \ 改变了图像识别和其他视觉任务，使其成为影像（Salehi 等，2023）、自动驾驶（Muhammad 等，2020）和人脸识别（Wang & Deng，2021）等领域至关重要的技术。\n\
  \n##### CNN 架构\n`CNNs` 的架构由多个层组成，旨在自动从图像中学习特征。`CNN` 的关键组件包括：\n\n1. **卷积层**：`CNN`\
  \ 中的卷积层通过滤波器应用于输入数据，提取边缘、纹理和模式等特征。\n2. **池化层**：`CNN` 中的池化层通过特征图的空间维度，在保留重要信息的同时减少计算复杂性和过拟合。\n\
  3. **全连接层**：`CNN` 中的全连接层连接所有神经元，整合提取的特征以完成分类或回归任务的预测。\n4. **激活函数**：激活函数在神经网络中引入非线性，使其能够学习数据中复杂的模式和关系。\n\
  \n#### 1.2 医疗中的医学影像\n医学影像是现代医疗保健中的关键工具，使医生能够观察人体内部、诊断疾病、指导治疗并监测病情的进展（Aamir 等，2023）。各种医学影像技术利用不同的物理原理创建人体解剖结构的图像。以下是常用医学影像类型的概述：\n\
  \n##### 1.2.1 磁共振成像 (MRI)\n概述：MRI 利用强磁场和射电波产生软组织（如大脑、肌肉和内脏）的详细图像。它不使用电离辐射，因此长期使用更加安全。\n\
  \n\n\n\n\n# 工作原理：核磁共振（MRI）设备产生强磁场，使人体水分子中的质子排列齐。随后向身体发射射电波，打破这种排列状态。当射电波关闭时，质子会重新排列齐，MRI\
  \ 设备通过检测这种重新排列的过程来形成详细的图像（Talagala, S. L., & Lowe, I. J. 1991）。\n\n## 应用：MRI 用于诊断和监测大脑（中风、肿瘤、多发性硬化）、脊柱、关节、软组织以及肝脏和心脏等器官的情况。\n\
  \n优点：软组织成像效果极佳，高分辨率图像，无创性。\n\n缺点：费用昂贵，耗时比其他成像方法长，不适用于带有某些金属植入物的患者。\n\n## 1.2.2 计算机断层扫描\
  \ (CT)\n\n概述：CT 扫描使用从不同角度拍摄的一系列 X 射线图像来创建骨骼、血管和软组织的横断面图像（切片）。它比标准 X 射线更详细，并且可以可视化人体内的骨骼和软组织。\n\
  \n工作原理：CT 扫描仪绕身体旋转的同时发射一系列 X 射线。这些 X 射线穿过身体，数据由计算机处理以创建横断面图像，这些图像可以组合成被扫描区域的 3D\
  \ 图像（Cantatore, A., & Müller, P., 2011）。\n\n应用：CT 扫描用于诊断骨折、肿瘤、内出血以及手术计划。它们被广泛应用于急医学、肿瘤学和心血管成像。\n\
  \n优点：速度快，骨骼和软组织成像详细，在急诊情况下很有用。\n\n缺点：涉及电离辐射暴露，可能对儿童或孕妇女性并不理想。\n\n## 1.2.3 X 射线\n\
  \n概述：X 射线是一种常用的成像技术，利用电离辐射创建人体内部图像，主要用于检查骨骼和检测骨折。\n\n工作原理：X 射线机发射的辐射穿过身体，并根据组织密程度以不同量被吸收。骨骼密度较大，吸收更多的\
  \ X 射线，在 X 射线片上显示为白色，而较软的组织则允许更多 X 射线穿过并显示为较暗（Pasveer, B., 1989）。\n\n应用：X 射线主要用于骨骼（骨折、脱位、骨性肿瘤）、牙齿和胸部（肺炎、肺感染）的成像。它们还用于乳腺摄影检查以筛查乳腺癌。\n\
  \n优点：快速、廉价、广泛可用且无创性。\n\n缺点：暴露于电离辐射，尽管在诊断剂量下极小，但反复暴露仍可能带来风险。\n\n## 1.2.4 超声\n\n概述：超声利用高频声波创建人体内部（主要是软组织）的图像。它常用于产产科、心脏病学和腹部成像。\n\
  \n工作原理：超声机使用换能器将声波发送到体内。这些声波在组织和器官上反射，回声由超声机转换为图像（Powers, J., & Kremkau, F., 2011）。\n\
  \n应用：超声常用于监测怀孕、心脏成像（超声心动图）和腹部评估（胆囊、肾脏、肝脏）。\n\n优点：无创、实时成像、廉价。\n\n缺点：对肠道的成像能力有限，分辨率较低。\n\
  \n## 1.3 为什么 CNN 用于医学成像？\n\n卷积神经网络 (CNNs) 在医学成像方面已成为一种变革性工具，特别是涉及复杂的模式识别任务。以下是 CNN\
  \ 在医学分析中的适用性。\n\n### 1.3.1 架构与分层特征学习\n\n- 局部感受野与滤波器：CNN 构建在卷积层之上，使用滤波器来检测局部区域的模式。这些过滤器在训练过程中学习，以识别初始层中的边缘、线条或颜色，并在深层中识别更复杂的形状、纹理和物体。\n\
  \n- 池化与降维：CNN 使用池化层（例如最大池化）来减少图像的空间维度，同时保留信息。这种降维通过减少参数数量使网络更高效，同时也对图像的微小移动或畸变不敏感。对于由于成像条件而可能变化的医学图像，这种特征非常有价值。\n\
  \n- 多层与深度学习：CNN 可以堆叠多个层，每层都检测日益抽象和复杂的特征。在医学成像中，疾病可能体现在细微或多尺度特征上（例如病变），CNN 的深度架构可以捕捉传统方法经常忽略的细节。\n\
  \n### 1.3.2 处理医学图像复杂模式的能力\n\n- 细粒度模式识别：医学图像（如 MRI 扫描、CT 扫描和 X 射线）通常包含复杂且细粒度的模式。这些模式很难通过手动提取等传统分析技术识别。相比之下，CNN\
  \ 直接从数据中学习相关特征，使其更能适应不同类型的图像和疾病（Aamir et al., 2023）。\n\n- 跨模态泛化：CNN 在识别各种类型的医学图像（包括\
  \ X 射线、CT 扫描、MRI 和超声）方面非常有效。例如，在 CT 扫描中检测肿瘤的 CNN 可以经过较小的调整学习乳腺摄影中的新模式。传统方法通常为每种成像模式都需要全新的特征集和手动调整（Guan\
  \ et al. 2021）。\n\n### 1.3.3 优于传统方法的性能\n\n- 自动特征提取：传统的图像方法依赖于专家定义的特征，例如边缘检测、纹理分析或像素强度阈值。这些手工设计的特征在处理医学扫描等复杂图像时往往不从心，因为这可能需要识别非常细微的模式（例如在致密组织中识别早期癌症）（Aamir\
  \ et al., 2022）。CNN 消除了了手动提取特征的需求，根据数据集自动学习特征，从而在复杂模式识别中表现出优异的性能。\n\n\n\n\n\n- \
  \  端到端学习：CNN 以端到端的方式工作，这意味着它们接受原始图像数据作为输入并直接产生分类或检测结果。相比之下，传统方法通常涉及多个阶段的处理和人工干预，这可能会引入错误并降低效率。CNN\
  \ 的端到端学习过程使其在医学图像分析中更加准确和流高效。\n-   对变性的鲁棒性：传统方法在面对光照、方向或图像质量的变化时可能会遇到困难，而这些变化在医学影像中由于设备差异和患者状况非常常见。CNN\
  \ 对这些变化更鲁棒，因为它们学习的是对输入图像微小变化不变的模式。这种适应能力确保了 CNN 在各种医学成像条件下都能有良好的表现，使其比传统技术更可靠。\n\
  \n### 1.3.4 处理大型且多样化的数据集\n\n-   可扩展性：医学影像数据集通常很大且多样，涵盖了广泛的疾病、解剖变异和成像条件。传统方法应用于大型数据集时可能会力不从心，或需要大量的人工干预。相反，CNN\
  \ 擅长处理大数据，并可以从数百万图像中学习，随着更多数据的可用，不断提高其准确性。\n-   迁移学习：CNN 允许允许迁移学习，即在一个大型数据集（例如 `ImageNet`）上训练的模型可以针对具有较小数据集的医学影像任务进行微调。这种利用预训练网络的能力显著缩短了训练时间和计算资源的消耗，使得\
  \ CNN 非常适用于标记数据可能较稀缺的医学应用。\n\n### 1.3.5 CNN 在医学图像分析中的示例\n\n-   肿瘤检测：CNN 在 MRI 和\
  \ CT 扫描的肿瘤检测方面取得了巨大成功，在这些场景中，传统方法可能难以识别组织结构的细微变化。CNN 可以以高精度和速度准确定异常生长，为放射科医生诊断癌症提供无价值的帮助\
  \ (Chattopadhyay, A., & Maitra, M., 2022)。\n-   视网膜疾病筛查：在眼科中，CNN 已用于分析视网膜图像以发现糖尿病视网膜病变和年龄性黄斑变变的迹象。CNN\
  \ 自动检测视网膜图像中微小病变的能力使其成为早期疾病检测的重要工具 (Muchuchuti, S., & Viriri, S., 2023)。\n-   胸部\
  \ X 光分类：CNN 已用于分析胸部 X 光以诊断肺炎、结核和 COVID-19 等疾病。它们快速准确地分类医学图像的能力可以协助医生诊断呼吸系统疾病，特别是在资源有限的环境下\
  \ (Ibrahim et al., 2024)。\n\n# 2. 理解卷积神经网络\n\n## 2.1 CNN 的基本架构\n\n卷积神经网络 (CNN) 由于其处理和分析视觉数据的强大能力，已成为医学影像和医疗保健领域许多应用的基础。CNN\
  \ 的分层结构允许它们从医学图像中自动学习并提取相关特征，使其对于疾病诊断、肿瘤检测和图像分割等任务非常有效。以下是关于 CNN 结构的详细解释。\n\n###\
  \ 2.1.1 卷积层\n\n结构：卷积层是 CNN 的基础构建模块。这些层将滤波器（或卷积核）应用于输入图像以检测模式。每个滤波器在输入图像（或特征图）上滑动，并执行逐元素乘法，然后进行求和，产生称为特征图的输出。\n\
  \n-   滤波器：滤波器是小矩阵（例如 `3x3` 或 `5x5`），用于检测特定特征，如边缘、角或纹理。\n-   步长（Stride）：步长是指滤波器在卷积过程中移动的距离。步长为\
  \ `1` 意味着滤波器每次移动一个像素，而较大的步长则会跳过像素，从而减小特征图的大小。\n-   填充（Padding）：当滤波器减小输出尺寸时应用填充以保留输入的大小。例如，零填充在图像边界周围添加额外的像素。\n\
  \n卷积层的图示表示如图 1 所示。\n\n#### 图 1. 卷积层中计算特征图的过程\n\n```\n![](img/979-8-3693-9816-6.ch009.f01.png)\n\
  ```\n\n在对输入图像应用一系列滤波器后，卷积层会创建特征图堆叠，并将其作为下一层的输入。\n\n必须记住，用于卷积的滤波器深度应该与输入尺寸匹配。例如，对于灰度图像，图像的深度（通道数）为\
  \ `1`，因此滤波器深度为 `1`，而对于 RGB 图像，滤波器深度为 `3`。\n\n在在医学影像中的作用：\n\n在医学影像中，卷积层负责从 MRI 扫描、X\
  \ 光、CT 扫描和超声图像中提取关键特征。早期层捕捉基本特征（边缘、对比），而深层捕捉更复杂的模式（例如器官形状、异常、肿瘤）。\n\n-   示例：在癌症检测中，卷积层可以识别不规则的组织模式或肿瘤边界，这些可能是放射科医生肉眼很难发现的。\n\
  \n优点：\n\n-   自动特征学习：CNN 自动学习哪些特征对于特定的医学任务（例如检测病变或肿瘤）最。\n-   空间层次结构：卷积层保留了关于特征位置的空间信息，这在医学影像中至关重要，因为异常的位置对诊断非常重要。\n\
  \n### 2.1.2 池化层\n\n结构：池化层用于减少特征图的空间维度（宽度和高度），同时保留重要信息。最常见的池化类型是最大池化、最小池化和平均池化。\n\
  \n-   最大池化（Max Pooling）：窗口（例如 `2x2`）在特征图上滑动，保留窗口中的最大值，而丢弃其他值。\n-   最小池化（Min Pooling）：窗口（例如\
  \ `2x2`）在特征图上滑动，保留窗口中的最小值，而丢弃其他值。\n-   平均池化（Average Pooling）：在实践中较少，它取每个窗口的平均值而不是最大值。\n\
  \n池化中的步长：与卷积层类似，池化也使用步长来控制窗口在图像上移动的距离。\n\n各种池化过程的图示如图 2 所示。\n\n#### 图 2. 使用各种池化层减少特征图空间维度的过程\n\
  \n```\n![](img/979-8-3693-9816-6.ch009.f02.png)\n```\n\n在医学影像中的作用：\n\n通过在保留最显著特征的同时下采样，池化有助于关注医学图像中最关键的部分。\n\
  \n-   示例：对于用于从 CT 扫描检测肺部疾病的 CNN，池化层减少了模型需要处理的数据量，帮助其关注显示疾病的区域，如结节。\n\n优点：\n\n- \
  \  降维：池化层在不丢失重要特征的情况下减少了训练的计算成本。\n-   对微平移的不不变性：池化层使模型对图像的微小移动或畸变不敏感，这在医学影像中很重要，因为患者体位或成像条件可能会变化。\n\
  \n### 2.1.3 全连接层\n\n\n\n\n\n# 全连接层\n\n结构：全连接层是标准的神经网络层，其中每个神经元都与前一层中的每一个神经元相连接。在卷积层和池化层从图像中提取特征后，这些全连接层利用这些特征进行分类或回归任务。\n\
  \n- • 神经元：每个神经元接收来自前一层所有神经元的输入，对这些输入进行加权求和，应用激活函数，并将结果传递给下一层。\n\n## 在医学影像中的作用\n\n\
  全连接层用于在医学影像任务中做出最终预测。在通过卷积层和池化层提取特征后，这些层决定了图像代表的内容（例如，扫描是否显示存在肿瘤）。\n\n- • 示例：在一个用于将\
  \ MRI 扫描分类为正常或癌症的 CNN 中，全连接层聚合了之前层所提取的特征，并输出扫描显示癌症的概率。\n\n## 优点\n\n- • 特征聚合：全连接层结合来自整个图像的特征来做出高层决策。\n\
  - • 最终分类：这些层在分类任务中做出最终决策（例如，健康与患病），对于医疗保健领域的诊断应用至关重要。\n\n## 2.1.4 激活函数\n\n结构：激活函数为\
  \ CNN 引入了非线性，允许网络学习输入和输出之间复杂的关系。常见的激活函数包括：\n\n- • ReLU（整流线性单元）：CNN 中最常用的激活函数，它对负输入输出零，对正值输出输入本身。\n\
  - • Sigmoid：输出 0 到 1 之间的值，通常用于二分类任务。\n- • Softmax：用于输出层以进行多分类，产生跨类别的概率分布。\n\n##\
  \ 在医学影像中的作用\n\n激活函数允许 CNN 针对医学影像做出复杂的非线性决策，这对于识别不同组织密度、形状和纹理中的模式至关重要。\n\n- • 示例：在一个用于从胸部\
  \ X 光中检测多种状况的 CNN 中，输出层的 `softmax` 激活函数可以为肺炎、结核或正常扫描等状况分配概率。\n\n## 优点\n\n- • 非线性：激活函数允许\
  \ CNN 模拟复杂的非线性关系，这在医学任务中通常是需要的，而简单的线性模型会失效。\n- • 决策制定：`softmax` 等函数提供概率分布，这在需要同时考虑多种状况的医学应用中非常有用。\n\
  \n卷积神经网络完整架构的图形表示如图 3 所示。\n\n### 图 3 完整的 CNN 架构\n\n![](img/979-8-3693-9816-6.ch009.f03.png)\n\
  \n## 2.2 CNN 如何从图像中学习：训练过程概述\n\n卷积神经网络（CNN）通过结构化的训练过程从图像中学习，该过程涉及监督学习、反向传播和梯度下降。这些机制允许\
  \ CNN 自动检测并学习图像中的特征，使其能够执行分类、目标检测或分割等任务。以下是 CNN 训练过程中每个组件的说明。\n\n### 2.2.1 CNN 中的监督学习\n\
  \n监督学习是 CNN 训练的基础（Aljuaid, A., & Anwar, M., 2022）。在这种范式中，使用标记数据集来训练网络，每张图像都与特定的标签（或地面真）相关。CNN\
  \ 的目标是学习输入图像与其相应标签之间的关系，以便其能预测新的、未见图像的标签。\n\n- • 训练数据集：数据集由输入图像（例如，MRI 扫描、X 光片）及其相应标签（例如，“癌症”，“非癌症”）的对组成。\n\
  - • 预测：在训练期间，CNN 处理每个输入图像并输出预测结果，该结果可以是类别标签（分类任务中）或连续值（回归任务中中）。\n- • 损失函数：使用损失函数将预测输出与真实标签进行比较。损失函数量化了预测值与真实值之间的差异，提供了衡量\
  \ CNN 性能的指标。\n\n### 2.2.2 反向传播\n\n一旦 CNN 做出预测，将使用反向传播来调整网络的内部参数（即权重和偏置）以最小化损失。反向传播是一种计算损失函数相对于网络中每个参数的梯度的算法，允许网络从错误中学习并随着时间的不断改进（Mizutani,\
  \ H., 1994）。\n\n#### 反向传播的步骤：\n\n1. **正向传播**：在正向传播期间，输入图像馈送 CNN，经过卷积层、池化层、全连接层和激活函数。网络根据输入生成预测结果。\n\
  2. **计算损失**：损失函数将预测标签与真实标签进行比较。分类任务常用的损失函数是交叉熵损失，而均方误差用于回归任务。\n3. **误差的反向传播**：反向传播算法计算网络中每个权重对损失的贡献程度。这是通过使用微积分中的链式法则完成的，允许\
  \ CNN 从输出层反向回溯误差到每个先前的层，计算损失函数相对于每个权重的梯度。\n4. **权重更新**：一旦计算出梯度，就会更新权重以减少损失。此过程反复重复，允许\
  \ CNN 逐渐学习并提高其准确性。\n\n### 2.2.3 梯度下降\n\n梯度下降是训练期间用于更新 CNN 权重的优化算法。梯度下降的目标是通过沿最陡下降的方向（即负梯度）移动网络参数来最小化损失函数（Cui,\
  \ N., 2018）。\n\n#### 梯度下降类型：\n\n- • **批量梯度下降**：在批量梯度下降中，使用整个数据集计算梯度后更新权重。虽然这可以产生更准确的梯度计算，但对于大型数据集计算开销巨大且速度缓慢。\n\
  - • **随机梯度下降 (SGD)**：在 SGD 中，网络在每个训练样本（或小批量样本）后更新权重，使其对于大型数据集更快且更具扩展性。然而，更新可能带有噪声，可能会导致训练期间损失函数的出现波动。\n\
  - • **小批量梯度下降**：这是两者的折中，小批量梯度下降将数据集分成小批量，并在每个批量后更新权重。它在 CNN 训练中常用，因为它平衡了速度和准确性。\n\
  \n**学习率**：学习率是一个控制梯度下降过程中步长大小的超参数。高学习率可能会导致模型过快收敛并跳过最优解，而低学习率可能导致收敛缓慢或陷入局部最优。\n\n\
  #### 梯度下降的步骤：\n\n1. **初始化参数**：首先随机或使用某些启发式方法初始化参数（权重）。初始值会影响算法收敛的速度。\n2. **计算损失**：计算损失函数（或代价函数），它衡量预测值与实际值之间的差异。常见的损失函数是回归任务的均方误差\
  \ (MSE) 或分类任务的交叉熵。\n\n\n\n\n\n## 第 3 步：计算梯度\n\n- 计算损失函数对每个参数的梯度。梯度指示了损失函数增长最快的方向和速率。\n\
  \n## 第 4 步：更新参数\n\n- 沿着梯度相反的方向更新参数，以最小化损失。更新使用以下公式完成：\n\n`θ=θ−α⋅∇J(θ)` 其中：(1)\n\n\
  - `Θ` 代表参数（权重）\n- `α` 是学习率（一个控制更新幅的较小正数）\n- `∇J(θ)` 是损失函数的梯度。\n\n## 第 5 步：重复\n\n\
  - 重复计算损失、计算梯度和更新参数的过程，直到达到收敛（即：当损失函数的变化变得微不足道而可以忽略不计，或者完成了预设的迭代次数）。\n\n## 第 6 步：收敛\n\
  \n- 当参数不再发生显著变化时，算法收敛，这意味着损失函数已达到最小值（理想情况下是全局最小值，但有时是局部最小值）。\n\n## 示例：医学影像中的 CNN\
  \ 训练\n\n考虑一个用于通过胸部 X 光片检测肺炎的 `CNN`：\n\n1. **监督学习**：`CNN` 在标记的胸部 X 光片数据集上进行训练，每张\
  \ X 光片都有一个标签，指示患者是否患肺炎。\n2. **前向传播**：在每次迭代中，一张 X 光片图像被传入 `CNN`。网络的卷积层和池化层从图像中提取特征（例如肺部模式和异常情况），全连接层输出预测结果（例如，“肺炎”或“无肺炎”）。\n\
  3. **损失计算**：将预测结果与真实标签进行比较，并计算交叉熵损失。\n4. **反向传播**：反向传播算法计算每个滤波器和权重对错误预测的贡献程度，并相应地进行调整。\n\
  5. **梯度下降**：使用梯度下降来更新网络权重，使其更接近于使损失最小化的值。\n\n这一迭代过程在多个轮次（epochs）中持续，`CNN` 逐渐提高其检测未见过的胸部\
  \ X 光片中肺炎的能力。\n\n## 2.3 CNN 在图像识别任务中的主要优势\n\n卷积神经网络（`CNNs`）在图像识别任务中被证明非常有效，这是它们具有几项优于传统机器学习方法的关键优势。其中一些最重要的优势包括平移不变性、空间层次结构和减少预处理需求。\n\
  \n### 2.3.1. 平移不变性\n\n平移不变性是指 `CNNs` 无论物体或模式在图像中的位置或方向如何都能识别。这种属性对于目标检测、人脸识别和医学影像等任务至关重要，在这些任务中，物体出现在图像的任何位置，或者可能会轻微旋转或偏移。\n\
  \n示例：在人脸识别中，即使脸部在图像框内轻微旋转或偏移，`CNNs` 也能识别出人的脸 (Sohail et al., 2024)。\n\n### 2.3.2.\
  \ 空间层次结构\n\n`CNNs` 通过其深层架构利用空间层次的概念，逐步构建输入图像的高级表示。这种层次结构允许 `CNNs` 自动学习不同级别的特征，从边缘和角等低级特征到形状和复杂物体等高级特征。\n\
  \n- **分层学习**：`CNN` 中的早期层学习边缘和纹理等基础特征，而深层则结合这些特征来学习更复杂的结构，如形状、物体，甚至是脸部或器官等特定实体。\n\
  - **感受野**：随着网络不断加深，每个神经元的感受野（它“看到”的图像部分）会增大。这使得网络能够捕捉图像的精细细节和更广泛的上下文。\n\n示例：在医学影像中，`CNN`\
  \ 的早期层学习边缘和纹理等基础特征，而深层则结合这些特征来学习更复杂的结构。\n\n### 2.3.3. 减少预处理需求\n\n`CNNs` 相比传统方法的一个主要优势是能够直接从图像中学习特征，减少了手动预处理的需要。\n\
  \n示例：在医学影像中，传统方法可能需要手动提取特征，而 `CNNs` 则简化了这一过程 (Kumar et al., 2024)。\n\n## 其他关键优势\n\
  \n### 2.3.4. 参数共享与局部连接\n\n- `CNNs` 利用参数共享，即相同的滤波器（卷积核）应用于图像的不同区域。这减少了全连接网络的参数数量。\n\
  - 局部连接是指 `CNNs` 仅关注图像的一小部分，使其在处理高维数据时非常高效。\n\n### 2.3.5. 适用于大规模数据\n\n- `CNNs` 具有良好的扩展性，适用于处理像\
  \ ImageNet 这样包含数百万张图像的数据集。它们可以提供准确的结果。\n\n### 2.3.6. 对噪声数据具有鲁棒性\n\n- 由于其深层架构和层次特征学习，`CNNs`\
  \ 对噪声数据具有鲁棒性。即使在扭变、模糊或遮挡的情况下，它们仍能识别模式。\n\n# 3. CNN 在医学影像中的应用\n\n## 3.1 疾病检测与诊断\n\
  \n卷积神经网络（`CNNs`）通过显著提高医学影像分析的准确性和效率，改变了疾病检测。`CNNs` 广泛用于诊断癌症、阿尔茨海默病、糖尿病视网膜病和心脏疾病。以下是\
  \ `CNNs` 应用于检测这些疾病的概述。\n\n### 3.1.1. 乳腺癌检测\n\n在乳腺癌早期检测中，`CNNs` 在乳腺摄影、MRI 扫描或超声图像上进行训练，以识别可能指示癌症的肿瘤或钙化等异常情况。\n\
  \n示例：Google 的 DeepMind 开发了一种基于 `CNN` 的模型，在乳腺癌检测方面的表现优于放射科医生，减少了假阳性和假阴性 (McKinney\
  \ SM, 2020)。\n\n### 3.1.2 肺癌检测\n\n肺癌检测通常涉及分析 CT 扫描以识别可疑结节或病变。\n\n- **CT 扫描**：`CNNs`\
  \ 训练识别肺 CT 扫描中各种形状和的结节。它们可以评估结节的大小、纹理和随时间的变化来判断其是否具有癌性 (Javed et al., 2024)。\n-\
  \ **低剂量 CT 扫描**：`CNNs` 已应用于使用低剂量 CT 扫描的筛查计划，特别是在高风险人群中，以便早期检测肺癌。\n\n### 3.1.3. 皮肤癌检测\n\
  \n`CNNs` 在分析皮肤镜图像识别皮肤癌（包括黑色素瘤）方面展现了卓越的成功。\n\n\n\n\n\n- 皮肤镜检查：`CNNs` 被训练用于检测皮肤病变的细微变化，包括不对称性、边缘不规则性、颜色变化和大小变化——这些因素与黑色素瘤和其他类型的皮肤癌有关（Faghihi\
  \ et al., 2024）。\n\n- 手机应用程序：一些基于 `CNN` 的模型已集成到手机 App 中，允许用户拍摄皮肤病变的照片进行初步诊断。\n\n\
  ### 3.1.4. 阿尔茨海默症检测\n\n`CNNs` 正用于通过 `MRI` 和 `PET` 扫描等医学成像技术检测阿尔茨海默症的早期迹象。\n\n`MRI`\
  \ 和 `PET` 扫描：在阿尔茨海默症检测中，`CNNs` 被训练分析脑扫描，识别结构性和功能性变化，如皮层变薄、海马体萎缩和异常蛋白积累（例如，淀粉蛋白斑块）（Alsubaie,\
  \ et al., 2024）。\n\n### 3.1.5. 糖尿病视网膜病检测\n\n`CNNs` 已广泛应用于通过视网膜底图像检测糖尿病视网膜病。糖尿病视网膜病是糖尿病的一种并发症，影响视网膜血管，如果不及治疗，会导致失明。\n\
  \n视网膜底图像：`CNNs` 在大型视网膜图像数据集上进行训练，以检测微动脉瘤、出血和渗出，这些都是糖尿病视网膜的的指征（Asia et al., 2022）。\n\
  \n示例：Google 用于糖尿病视网膜病检测的 `AI` 模型达到了与眼科医生相当的准确率，帮助为资源匮乏的人群提供负担得起的筛查服务。\n\n### 3.1.6.\
  \ 心脏状况检测\n\n`CNNs` 也被用于通过医学影像和电图（`ECG`）数据检测心脏状况，如心律失常和冠状动脉疾病。\n\n超声图：`CNNs` 分析心脏超声图（心脏超声图像）以检测结构异常，如瓣膜缺陷、隔膜缺陷和心肌病。它们可以识别心室、壁和瓣的变化，实现心脏疾病的早期诊断（Ghorbani\
  \ et al., 2020）。\n\n`ECG` 分析：`CNNs` 通过分析 `ECG` 信号来检测心律失常。它们可以识别可能指示心房颤或心室性过速等疾病的异常心律（Liu\
  \ et al., 2021）。\n\n`CT` 冠状动脉造影：`CNNs` 可以分析 `CT` 冠状动脉造影，以检测动脉中的斑块沉积，评估冠状动脉疾病的风险，并帮助早期发现心脏发作（Alskaf\
  \ et al., 2022）。\n\n### 3.2 图像分割与定位\n\n精确分割是医学影像分析的关键步骤，能够对病变区域进行准确定位和评估，这对于诊断、治疗计划和疾病进展监测至关重要。卷积神经网络（`CNNs`）已成为放射学中分割器官、肿瘤和其他解剖结构的关键工具。\n\
  \n#### 3.2.1. 器官分割\n\n精确分割是医学影像分析的关键步骤，能够对病变区域进行准确定位和评估，这对于诊断、治疗计划和疾病进展监测至关重要。卷积神经网络（`CNNs`）已成为放射学中分割器官、肿瘤和其他解剖结构的关键工具。\n\
