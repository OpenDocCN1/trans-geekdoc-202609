  \nKamlesh Kamlesh\n\n华南大学\n\n### 摘要\n\n\n\n\n图像融合在图像处理领域起着至关重要的作用，它通过整合多幅图像的信息来生成一张包含所有实质信息的输出图像。本章对图像融合进行了彻底的文献综述，分为六个主要方面。通过对每个类别的基本概念和方法论进行深入回顾，将图像融合（IF）技术分类为：多尺度分解、边缘保持、基于子空间、稀疏表示、深度学习和混合方法。每个类别都将通过其特定的子技术进行研究，强调其独特之处和基本概念。本章进一步探讨了对于分析图像融合技术性能和效能至关重要的评估指标，并强调了定量和定性评估。这篇文献综述为旨在在众多应用中生成和改进图像融合方法的专业人士和研究人员提供了重要的帮助。\n\
  \n### 1. 引言\n\n图像融合（IF）是一个合并多幅图像以生成输出图像的过程，该图像能产生比任何单一图像更丰富的实质信息（Bhutto, Guosong,\
  \ et al., 2024）。任何图像融合方法的主要动力是从输入照片中提取所有有用信息，以增强如空间分辨率、光谱信息、对比度和所有细节特征等质量。在卓越、增强的视觉数据对于进一步研究至关重要的领域，图像融合是本质的，包括遥感、监控、医学影像（Rahman\
  \ et al., 2022)）和计算机视觉。多模态医学图像融合（MMIF）中，来自许多成像模式（包括磁共振成像（MRI）、计算机层扫描（CT）、正电子发射层扫描（PET）和超声）的图像整合至关重要。每种成像模式在提供信息类型方面都有独特的优缺点。MRI\
  \ 在软组织对比方面表现越，而 CT 提供了详细的结构信息。通过整合多个模态的图像，医疗保健人员可以对患者的解剖结构获得更全面的理解（Wang et al.,\
  \ 2022）。因此，它有助于精确诊断、治疗计划和疾病监测，特别是在肿瘤检测和神经学检查等复杂情况下。红外（IR）和可见光图像融合（IRVI-IF）将热红外数据与可见光图像整合，产生对场景更全面、信息丰富的表示。这在监控、安全和遥感等应用中至关重要，必须结合视觉信息分析温度波动（Zhang\
  \ et al., 2022）。最后，多聚焦图像融合（MFIF）整合在不同焦距下捕取的几张照片，提供一张具有更宽景深精确焦点的图像，通常用于显微、摄影和机器人等领域（Li\
  \ et al., 2020）。\n\n大多数图像融合技术遵循一种系统性的三阶段程序，如图图 1 所示。\n\n## 图 1. 图像融合的基本图\n\n![](img/979-8-3693-9816-6.ch001.f01.png)\n\
  \n最初，将源图像投影到指定的变换域中以便进行有效的特征分析。反映照片各种属性的修改后系数通过合适的融合技术进行合并，以确保保留所有源图像的关键信息。最后，对合并后的系数采用逆变换，以在空间域中恢复融合后的图像。\n\
  \n图像融合方法可以分为三个基本类别：像素级、特征级和决策级。每一层都有其独特的优势，适用于特定的应用和融合目标。像素级融合是一种基础方法，其中合并不同图像的像素值以生成新图像（Dogra\
  \ et al., 2017）。这种方法通常计算量较小，但在处理噪声方面可能存在困难。特征级融合涉及处理图像以提取显著特征（如边缘、纹理），随后对其进行合并（Sarwar\
  \ et al., 2024）。当目标是强调医学影像中的结构或监控中的物体边界时，特征级融合特别有利。决策级融合依赖于每个图像生成的分类结果，而不是整合原始数据（Ma\
  \ et al., 2019）。这种融合方法通常用于诊断系统，其中不同的分类器评估不同的源，并合并其结果做出最终决策。\n\n本章的主要目标是理解图像融合的整体概念，例如其工作原理、类别及其子类别，以及评估每种方法有效性的评估参数。此外，本章还将介绍图像融合的应用。同时，本章还将面临挑战并提供解决方案。最后将讨论详细结论。因此，本章的设计如图图\
  \ 2 所示。\n\n## 图 2. 全章的整体结构\n\n![](img/979-8-3693-9816-6.ch001.f02.png)\n\n本章的其余部分安排如下：第\
  \ 2 节讨论图像融合方法及其子类别。第 3 节将阐述评估指标。第 4 节进行仿真结果。第 5 节介绍图像融合的应用，第 6 节强调图像融合领域的挑战。最后，第\
  \ 7 节将给出结论。\n\n# 2. 图像融合的类别\n\n由于不同领域的需求增加，图像融合引起了广泛关注。在过去的二十年里，许多学者试图开发能够产生所有相关信息同时消除噪声和伪影的方法。图像融合技术大致分为六类，如图图\
  \ 3 所示。\n\n## 图 3. 图像融合方法的分类\n\n![](img/979-8-3693-9816-6.ch001.f03.png)\n\n\n\n\
  \n如图 3 所示，图像融合（IF）被分为六类，每类又进一步划分为子类（Bhutto, Tian, Du, Sun, Yu, & Tahir, 2022）。这些类别强调了在不同处理复杂程度上合并图像时所采用的多样化技术，从基础的基于像素的融合到更复杂的基于学习的方法。我们将讨论每个类别及其子类别。\n\
  \n### 2.1 基于多尺度分解（MSD）的方法\n\n在过去的几十年里，基于 MSD 的方法在 IRVI-IF、MFIF 和 MMIF 中均证明了其有效性。MSD\
  \ 方法将原始照片分解成不同尺度的分量。每个分代表不同尺度的子图像，而现实世界中的物体通常由不同尺度的分量组成（Rahman et al., 2021）。许多研究表明，MSD\
  \ 方法符合人类视觉特征，使合并图像能够提供最佳视觉效果（Bhutto, Tian, Du, Sun, Yu, & Soomro, 2022）。通常，IF 方案依赖的\
  \ MSD 由三个阶段组成，如图 4\n\n最初，每幅源图像被分割成系列多尺度表示（MSR）。源图像的 MSR 根据指定的融合规则进行合并。融合后的图像通过对融合后的表示应用等效逆多尺度变换获得。基于多尺度变换的融合方法的本质在于变换的选择和融合准则。\n\
  \n现在，我们将讨论常用的子类。\n\n#### 2.1.1 离散小波变换（DWT）\n\n它提供了信号频率分元素的简洁表示，增强了频率信息和时间分辨率（Aamir\
  \ et al., 2019）。它通过将图像划分为高频（HF）子带和低频（LF）子带，将图像分解为许多尺度上的频率子带（Bhutto et al., 2020）。LF\
  \ 包含了图像的平均强度，而 HF 包含了图像边缘的信息。在 DWT 中，下采样减少了计算时间并加速了过程。DWT 技术将几幅图像分解为不同的 LF 和 HF\
  \ 子带。与基于像素的方法相比，这种方法通过在降低空间分辨率的同时提供高信噪比，减轻了融合图像中的光谱失真。小波融合在减少色彩失真方面超过空间域融合。然而，DWT\
  \ 存在振荡、平移变异、混叠和方向性不足的问题。\n\n#### 2.1.2 离散驻小波变换（DSWT）\n\n离散小波变换（DWT）中的下采样会导致平移不变性缺失，导致失真、伪影和模糊效应，导致输出照片质量欠佳。这些挑战可以通过在\
  \ DSWT 中移除下采样来解决（Aamir et al., 2019; Lianfang et al., 2018)）。因此，它保持了优异的质量并提供了信息更丰富的输出照片。源图像在列和行方向上使用\
  \ LF 和 HF 滤波器分为水平和垂直近似值。对分割的分量逐行逐列应用相同的滤波，以获取近似的垂直、水平和对角线细节。作者采用 DSWT 将源照片分解为一个\
  \ LF 子带和三个 HF 子带（低-高、高-低和高-高子带），且不使用下采样。生成的照片增强了光谱信息，但对空间特征的捕捉不充分。\n\n#### 2.1.3\
  \ 非下采样轮廓变换（NSCT）\n\nNSCT 是一种多尺度、多方向的照片分解技术，它将非下采样金字塔滤波器组（NSPFB）与非下采样方向性滤波器组（NSDFB）集成在一起。这种分割技术可以有效重建图像的真实几何结构（包括边缘和轮廓），并且完全是平移不变的。NSPFB\
  \ 使用双通道非下采样 2D 滤波器组分析图像，避免了下采样和上采样。此外，使用 NSDFB 将带子带划分为多个方向。利用 NSPF 构建下采样金字塔。随后，所有滤波器上采样\
  \ 2 倍，以满足完美重构标准。在应用 NSPFB 分解后，实施平移不变的 NSDFB。这是一种双通道非下采样滤波器组迭代方法（Ibrahim et al.,\
  \ 2023）。相同的程序将用于预期的更高层分解。NSCT 已广泛应用于 IRVI-IF、MF-IF 和 MMIF，因为它能够减轻伪吉尔斯现象和配准误差的影响。\n\
  \n#### 2.1.4 非下采样剪切变换（NSST）\n\nNSST 是一种多尺度、多方向的照片分割技术，能够有效地保留多个尺度和方向上的显著特征。NSST\
  \ 技术由两个主要阶段组成： MSD 和方向定位。MSD 通过使用 NSPF 导出，而方向定位通过使用小尺度剪切滤波器（SF）实现（Sharma et al.,\
  \ 2024）。同时，它在时间域内的卷积计算中表现出高效。这些局部 SF 可以消除阻塞效应并减轻吉尔斯现象。\n\n### 2.2 基于保边缘滤波的方法\n\n\
  许多学者开发了基于保边缘滤波的 MSD 方法，取得了卓越的结果。在过去的几十年里，保边缘滤波技术已成为许多融合应用研究的一项重要工具。所需的照片通过滤波被分割为基层和细节层。基层通过保边缘滤波器精确地捕捉强度的主要变化。相反，细节层由一系列在细尺寸上具有粗分辨率的照片组成（Li\
  \ et al., 2023）。\n\n\n\n\n在许多图像图像融合中，包括 `MMIF`、`MF-IF` 和 `IRVI-IF`，精确的边界（边缘）对于准确分析至关重要。因此，经常采用边缘保持滤波器来合并源图像，以确保详细信息的保留（特别是在物体边界处），同时减轻照片其他区域不理想的噪声或模糊。作者在(Shreyamsha\
  \ Kumar, 2015)中应用了交叉双边滤波（`CBF`）方法。该方法通过从源图像中减去 `CBF` 来评估图像强度以确定权重。随后，这些权重通过权重归一化直接与源图像相乘。直接相乘会导致伪影和噪声的引入。基于边缘保持的融合方法有多种方法，例如双边滤波、高斯滤波\
  \ (Rahman et al., 2019)、引导滤波、各向异性扩散、非局部均值滤波等。\n\n### 2.3 基于子空间的方法\n\n子空间技术试图将高维输入图像映射到低维子空间。自然图像通常包含冗余信息，低维子空间可以有效封装原始图像的内在结构。此外，与高维输入图像相比，处理低维子空间数据需要的时间和内存更少\
  \ (Mitianoudis et al., 2013)。此外，低维子空间表示可以增强泛化。许多学者已将子空间方法应用于图像融合，获得了更好的空间信息。由于维度还原的优势，这些策略具有时间效率。最常用的子空间方法是主成分分析（`PCA`）\
  \ (Bhutto, He, et al., 2024)、独立成分分析（`ICA`）、非负矩阵分解（`NMF`） (Kong, Lei, & Zhao, 2014)、奇异值分解（`SVD`）以及强度色调度（`IHS`）。子空间方法的计算效率更高，因为它们减少了数据维度，从而加快了处理速度。此外，这些方法有助于捕捉图像中的显著能量信息。\n\
  \n### 2.4 基于稀疏表示 (SR) 的方法\n\nSR 技术已有效应用于多个领域，如图像分析、计算机视觉、模式识别和机器学习，以解释人类视觉系统 (Zhang\
  \ et al., 2018)。与利用预定义基函数的 `MSD` 的 `IRVI-IF`、`MMIF` 和 `MFIF` 技术相比，SR 图像融合方法试图从大量的高质量自然图像中获取过完备字典\
  \ (Adnan et al., 2020)。随后，源图像可能通过获取的字典进行稀疏表示，从而可能改进显著且稳定图像的表示 (Bhutto, Khan, & Rahman,\
  \ 2023)。此外，错配准或噪声可能会在融合的多尺度表示系数中引入偏差，导致融合照片出现视觉伪影。为了减轻视觉伪影并增强对错配准的韧性，基于 SR 的技术采用滑动窗口方法将源图像划分为许多重叠的块\
  \ (Liu et al., 2015)。基于 SR 的图像融合方法通常包含四个阶段，如图图 5 所示。\n\n#### 图 5. 基于 SR 的图像融合原理图\n\
  \n![](img/979-8-3693-9816-6.ch001.f05.png)\n\n最初，使用滑动窗口技术将每个源图像分割成许多重叠的块。其次，从许多高质量照片中导出过完备字典（`OCD`），并对每个块进行稀疏编码，以利用学习到的\
  \ `OCD` 获取稀疏表示系数。稀疏表示系数根据指定的融合规则进行合并。最终利用从学习的 `OCD` 得到的融合系数重建融合照片 (Bin et al., 2016)。基于稀疏表示的融合方法的本质在于\
  \ `OCD` 的制定和稀疏编码的实现。\n\n稀疏表示方法有若干类，如过完备字典（`OCD`）、正交匹配（`OMP`）、奇异值分解、联合表示等。\n\n###\
  \ 2.6 基于深度学习 (DL) 方法\n\n深度学习（`DL`）的重要性在过去十年中受到了广泛关注 (Rahman et al., 2024; Rahman,\
  \ Zhang, & 2023](#979-8-3693-9816-6.ch001.bits-pdf.xhtml#_idTextAnchor084); Sarwar\
  \ et al., 2024](#979-8-3693-9816-6.ch001.bits-pdf.xhtml#_idTextAnchor085))。深度学习的最新进展导致图像融合领域出现了许多卷积（`CNN`），包括\
  \ `MMIF`、`IRVI-IF` 和 `MF-IF`。`CNN` 是一种利用监督学习的多阶段前馈网络，且卷积操作是多维的 (Aamir et al., 2019)。在卷积网络中，初始参数通常称为输入。第二个参数称为内核，而结果称为特征图。基础\
  \ `CNN` 模型通常具有四个阶段，如图图 6 所示。\n\n#### 图 6. CNN 融合的基本图\n\n![](img/979-8-3693-9816-6.ch001.f06.png)\n\
  \n输入图像首先通过 `CNN` 进行特征提取，然后对恢复的特征应用融合方法。最终利用重建提供融合图像。稀疏权重、同构表示和参数共享是 `CNN` 设计的基本原理。`CNN`\
  \ 利用矩阵乘法来调节交互。输入输出单元之间的连接需要大量的存储空间。因此，通过在相邻神经元上执行局部卷积操作，减少了存储需求并提高了计算效率。计算机视觉中的特征提取主要依赖于卷积层，这些层通常比传统方法提供更相关的数据\
  \ (Bhutto, Siddique, et al., 2024)。\n\n深度学习有许多类别因其卓越性能而受到了关注，例如孪生 CNN、`VGG-19`、`ResNet`、生成对抗网络和自动编码器\
  \ (Bhutto, Sunkari, et al., 2023; Bhutto, Zhang, & Rahman, 2023](#979-8-3693-9816-6.ch001.bits-pdf.xhtml#_idTextAnchor060);\
  \ Nabi et al., 2024](#979-8-3693-9816-6.ch001.bits-pdf.xhtml#_idTextAnchor078))。\n\
  \n\n\n\n\n尽管许多多光谱（MSD）、子空间、超分辨率（SR）和深度学习技术的发展，其他领域方法的整合在图像融合（IF）中已显示出显著的效能。各种变换具有独特的优势但也存在某些局限性（Bhutto,\
  \ Mubashir, et al., 2023）。MS 融合可以提取图像中不同尺度的空间特征。然而，它们无法以稀疏的方式表示低频（LF）成分。在这种情况下，通过平均值或`choose-max`等基本融合方法整合\
  \ LF 系数可能会损害融合性能，因为 LF 系数封装了图像的主要能量（Sun, Tian, Du, et al., 2023）。基于 SR 的融合可以通过字典学习产生原始照片更显著的表示，这些表示更适用于数据。尽管如此，由于字典中原子数量有限，重建原始图像的复杂细节仍然具有挑战。根据相关的融合协议，包括\
  \ IHS 和 PCA 变换在内的其他变换对于遥感融合是高效且快速的（Zhou et al., 2016）。然而，这些方法并不直接适用于 MF-IF、MMIF\
  \ 等额外的图像融合应用。CNN 和基于深度学习（DL）的融合技术在过去的十年中引起了广泛关注。CNN 和 DL 比之前的单域融合技术产生了更优的结果（Yu et\
  \ al., 2023）。然而，这些方法并不适用于空间域方法，导致显著特征的丢失。\n\n混合方法利用了各种技术的特性和优点（Sun, Tian, Du, &\
  \ Bhutto, 2023）。因此，在过去的十年中出现了许多整合多种变换的融合算法，以充分利用这些优势，最小化误差并确保所采用的方法是互补的（Kong, Zhang,\
  \ & Lei, 2014）。\n\n论文中的作者（Lianfang et al., 2018）使用了结合中值和平均值滤波器、`DSWT`和`PCA`的合并方法，如图图\
  \ 7\n\n在预处理阶段部署了合并的中值和平均值滤波器，它利用统计直方图高效消除噪声。该技术采用自适应滤波器掩码，通过快速计算有效减少噪声。然后使用`DSWT`处理图像，因为其平移不变性可以恢复平滑的边缘和轮廓。此外，该方法使用了`Haar`小波，它具有吸引吸引力的属性，包括正交性、紧凑支持和频率域中的无限支持。之后，利用`PCA`融合分解后的图像，以在保持稳健操作的同时去除不需要的信息。最后通过应用逆`DSWT`获得具有改进的空间光谱信息且噪声最小的最终融合图像。\n\
  \n另一种混合方法出现在论文（Bhutto et al., 2020)中。开发了一种合并直方图均衡化快速灰度分组（`HE-FGLG`）技术，可以自动提高照片的对比度。从`HE-FGLG`收集的照片被输入到`NSCT`中。这种分解技术可以很好地捕捉真实的几何结构。对于保留能量信息的\
  \ LF 照片，通过选择平均模式或选择模式使用基于能量的融合技术。对于高频（HF）照片，使用均值梯度融合技术来保留平滑的轮廓、边缘、边界和纹理。之后，采用`gray-PCA`，有助于在降维的同时保留照片中所有丰富的特征。\n\
  \n许多学者设计了混合方法，这些方法产生的结果比任何单一 IF 方法都好（Sun et al., 2022）。\n\n### 3. 图像融合方法的评估\n\n\
  评估图像融合方法的性能是一项重要的挑战。评估过程分为定性评估和定量评估（Zhang et al., 2014）。我们将详细讨论这两者。\n\n### 3.1 定性评估\n\
  \n定性评估用于根据人类感知评估融合图像的质量，包括亮度、对比度和边缘和轮廓等因素。它是人眼比较图像差异的最受青的方法（Yu et al., 2022）。\n\n\
  ### 3.2 定量评估\n\n定量评估通过数学计算进一步证实融合图像的质量（Liu et al., 2017); Zhu et al., 2021)）。有许多参数用于定量评估，我们将介绍一些。\n\
  \n#### 3.2.1 输入照片到融合照片的质量传输 (`Q(F)`)\n\n`Q(F)` 用于监控从源图像到最终输出图像的细节传输，包括边缘、纹理和边界（Z.\
  \ Liu et al., 2018)）。`Q(F)`值越高，从源图像传输的信息越多。\n\n#### 3.2.2 特征互信息 (`FMI`)\n\n计算`FMI`是为了分析单个源照片到最终输出照片的属性变化，如对比度、纹理和边缘（Jin\
  \ et al., 2017)）。较大的`FMI`值会导致源照片到生成照片产生更多转换。因此，更高的`FMI`反映输出照片包含更多源照片的信息。\n\n####\
  \ 3.2.3 结构相似性指数 (`SSIM`)\n\n`SSIM`表示输入照片与输出照片之间的结构相似性。较高的`SSIM`分数表明从输入图像到融合图像提取了大量的比较信息（Y.\
  \ Liu et al., 2018)。\n\n### 4. 现有方法的仿真结果\n\n\n\n\n\n本节展示了四种图像融合方法的实现，并通过四个质量参数对其质量进行了评估。本章使用的方法包括主成分分析（`PCA`）(Kumar\
  \ & Muttan, 2006),离散波小变换（`DWT`）(Tawade et al., 2014),脉冲编码神经网络非下采样切片变换（`NSST-PCNN`）(Kong,\
  \ Zhang, & Lei, 2014),以及结合各向异性扩散的卷积神经网络（`CNN-AD`）(Bhutto, Guosong, et al., 2024)。我们根据定性和定量评估参数对它们的性能进行了评估。我们使用了\
  \ `Q[F]^(XY)`、`FMI`、`SSIM` 和 `N[F]^(XY)`。\n\n### 图 8. (a) 中心聚焦，(b) 边缘聚焦，(c) `PCA`((d)\
