  \n# 第 14 章：基于 EEG 信号的情绪预测：案例研究\n\n### 摘要\n情绪在人类认知中起着至关重要的作用，并影响决策、行为和社会互动。基于脑活动等生理信号来理解和预测情绪，可以为神经科学、心理健康和人机交互等多个领域开辟新途径。脑电图（`EEG`）是一种记录脑电活动的非侵入性技术，能够为与情绪状态相关的神经过程提供见解。本章介绍了一个利用机器学习技术通过\
  \ `EEG` 数据进行情绪预测的案例研究。对 `EEG` 数据进行降噪和伪迹消除预处理后，训练一个基于 `GRU` 的神经网络以捕捉时间模式。通过 `softmax`\
  \ 激活层预测情绪，并对其性能进行了评估。该研究表明，`EEG` 数据和深度学习模型可以成为情绪识别的强大工具，未来可应用于个性医疗、情绪追踪和更好的人机交互。\n\
  \n## 引言\n\n### EEG 概述\n`EEG` 是一种广泛使用的神经成像技术，通过放置在头皮上的电极检测电压变化来测量脑电活动。`EEG` 由 Hans\
  \ Berger 于 1929 年首次发现，为脑功能提供了早期非侵入性观察。随着技术的极大进步，`EEG` 已成为睡眠研究和脑机接口（`BCIs`）等领域的关键工具。`EEG`\
  \ 能够检测随时间变化的脑活动模式。因此，它非常适合情绪识别，因为它允许研究人员观察对情绪刺激的反应。\n\n`EEG` 测量与认知和情感相关的各种频率的震荡。例如，alpha\
  \ 波曾被认为反映放松状态；发现不同的情绪体验会导致其产生变化，而 `beta` 波则与注意力水平和压力反应相关。这些独特属性使得 `EEG` 成为追踪情绪变化的有力手段；同时也允许研究人员根据特定的神经模式对情绪进行分类。`EEG`\
  \ 在情绪检测的应用是多方面的：从可以使用 `EEG` 情绪障碍治疗的心理健康领域，到可以导致对用户当前情绪做出反应的自适应系统的人机交互领域。\n\n\n\n\
  \n\n# 研究目标\n使用 EEG 数据预测情绪已通过证明，通过使用机器学习模型对情绪状态进行分类，准确性和可靠性得到了提高。我们使用了非侵入性的 EEG 方法来采集脑活动，并区分了不同情绪状态（快乐、悲伤和无情绪）的模式。数据通过\
  \ EEG 采集并进行处理，以确保获得的信号具有良好的定义，我们应用了基于门控循环单元（`GRU`）的神经网络。这些架构有效地建模了 EEG 数据中的时间依赖性，从而对情绪状态提供了准确的实时预测。最终，这项研究通过提供基于神经信号的情绪分类稳健框架，为个性化心理健康护理、自适应人机交互以及情感计算等多个情绪识别应用提供了支持。\n\
  \n# 情绪预测面临的挑战\n使用 EEG 信号进行情绪预测是最具挑战性的任务之一，因为它涉及许多固有问题。EEG 信号的非线性本质、噪声干扰以及受试者之间的个体差异是导致直接预测情绪状态困难的一些挑战。因此，解决所有这些问题对于设计可靠的情绪预测系统至关重要。\n\
  \nEEG 信号表现出复杂的非线性特性，难以从原始数据中直接解释。Higuchi 分形维数和样本熵是为更好地跟踪此类特征最常用的两种方法（Rahman, 2022）。此外，EEG\
  \ 信号的建模进一步增加了复杂性，因为情绪状态的变化是不可预测的（Zhang Z. F., 2024）。EEG 数据通常包含来自肌肉活动和环境干扰的噪声，这可能会模糊情绪信号并降低预测准确性（Wirawan,\
  \ 2022）。因此，需要强大的预处理技术（包括平滑和基线消除）来控制这些干扰并增强信号清晰度。挑战之一源于脑模式的个体间差异，这涉及到情绪反应的个体差异。例如，相同的刺激在不同受试者可能会引起截然不同的情绪反应（Zhang\
  \ H. W., 2024）。为了解决这些个体差异，研究人员提出了多种方法，包括共同-私有拓扑模式学习策略（`CPT-LS`），区分与大脑情绪反应相关的共同模式和独特模式（Zhang\
  \ H. W., 2024）。\n\nEEG 数据通常包含来自肌肉活动和环境干扰的噪声，这可能会模糊情绪信号并降低预测准确性（Wirawan, 2022）。 ...\
  \ [为了简洁已删除重复内容]\n\n这些挑战增加了复杂性，这意味着它们可能促进情绪识别系统的开发和增强。因此，在解决这些挑战的同时，研究人员可以提高这些系统的准确性和适用性，以更好地理解情绪动力学。\n\
  \n## 2. 文献综述\n\n## 相关工作\n在最近的研究中，利用 EEG 信号进行情绪预测受到了广泛关注，特别是深度学习技术的整合。深度学习的进步使得情绪识别系统的性能在广泛的现实场景中更加有效且具适用性。基于\
  \ EEG 的情绪预测在多个领域具有前景，包括心理健康监测、个性化用户界面以及用于各种应用的自适应系统。该领域的研究涉及各种模型、特征提取技术和数据集，以为情绪识别系统增添准确性和稳健性。\n\
  \n在情绪识别中，人们已经尝试了许多模型，从经典的机器学习算法到一些最新的深度学习架构。深度学习模型的应用极大地改变了局面。最著名的应用之一是使用 Transformer\
  \ 神经网络。这些网络在序列数据分析中已成为主流，因为它们可以处理数据中的程依赖（Prabowo, 2023）。这些网络被证明在处理时间序列方面非常有效，因此适用于具有固有顺序性的\
  \ EEG 数据。`CNNs` 发现也得到了广泛使用，因为它们在空间特征检测方面非常有效，能够提取与情绪反应相关的关键模式（Samal, 2024）。\n\n\
  除了个体深度学习模型外，基于模糊集成的方法已成为情绪预测最强大的方法。近期见证了一些具前景的模糊集成模型，通过聚合多个模型的预测结果来提高准确性和稳健性。在基准数据集\
  \ `DEAP` 和 `AMIGOS` 上，其表现优异，准确率高达 98.73%（Dhara, 2024）。该技术利用了不同架构模型的优势来解释和分类情绪，从而提高了对复杂数据的泛化能力。如上所述，从多个信息源提取特征的技术被开发用于克服过拟合并提高准确应用的泛化性。\n\
  \n特征提取是基于 EEG 情绪识别的主要步骤之一，因为它将原始 EEG 信号转换为机器学习模型可用的信息表示。多种特征提取技术已被应用，为每种情绪状态背后的神经活动提供了独特的视角。它可以分为四类：时域、频域、时频和非线性特征。\n\
  \nEEG 信号的幅和持续时间捕捉了时域特征，反映了对脑活动简单但有效的整体分析。这种类型的特征主要用于监测与环境刺激反应相关的情绪状态变化。除了上述方面，另一个方向是基于频域的特征，它关注\
  \ EEG 信号的频谱内容，提供了与情绪处理相关的频率分量。这项工作发现，特定的频带与某些情绪状态（如放松或警觉）良好相关；例如 `alpha` 和 `beta`\
  \ 频。\n\n\n\n\n\n对于研究人员而言，时频分析是一项重要的技术，因为它使他们能够同时观察时间信息频谱信息。这在捕捉短暂的、瞬态的情绪反应时非常有帮助。它被进一步用于非线性地理解\
  \ EEG 信号的复杂动力学；这些特征本质上基于对大脑是非线性和混沌性的理解，描述了情绪状态是如何表征的。非线性分析的方法包括分形维度或基于熵的度量，这些方法通过提供更详尽的脑活动表征，在改进情绪反应分类方面展现了巨大的前景（Hamzah,\
  \ 2024）。\n\n深度学习将关注点从特征提取转向了完全自动的方法。使用 `CNNs` 和 `RNNs` 等深度学习模型，已经可以直接从原始 EEG 数据中学习特征，而无需进行任何人工特征工程。这种方法的优势在于它不怎么依赖于预先定义的特征，并使模型能够发现数据中最相关的模式。随着特征提取过程的自动化化，深度学习模型不仅提高了分类的准确性，还提升了情绪预测系统的扩展性和灵活性（Samal,\
  \ 2024）。\n\n数据集是创建和测试情绪预测模型的基础。在这些数据集中，像 `DEAP`、`SEED` 和 `AMIGOS` 等公开访问的 EEG 数据集对该领域的研究人员非常有用。这些数据集包含了在情绪刺激存在时记录的\
  \ EEG 信号，用于测试在受控环境下对情绪刺激的反应。在所有数据集中，最常见的是 `DEAP` 数据集，它包含了 EEG 数据以及针对一系列效价（valence）、唤醒度（arousal）和主导性（dominance）的情绪主观评分（Prabowo,\
  \ 2023）（Dhara, 2024）。\n\n情绪预测模型的性能随使用的验证类型而显著变化。通常，受试者相关验证（subject-dependent）的结果更高，因为模型是针对个人情绪的特定反应定制的。这种方法考虑了每个受试者独特的脑模式和适当反应，有助于显著提高预测的准确性。然而，受试者无关验证（subject-independent）要求模型泛化到不同个体，由于情绪反应固有的变异性，这种方法挑战性得多。尽管无关无关的模型更具通用性，但其准确性通常较低，这凸显了情绪预测的复杂性，并需要更多样化、更广泛的数据集（Prabowo,\
  \ 2023）。\n\n最近基于 EEG 的情绪预测研究中报告的性能指标取得了令人深刻的改进。例如，根据 Dhara 等人（2023）的研究，多个模型在情绪状态分类中达到了\
  \ 90% 的准确率，特别是在效价和唤醒这两个维度上。这些高准确率值反映了情绪识别系统以很高精度对情绪反应分类日益增强的能力。\n\n*   **当前研究的空白**：目前利用\
  \ EEG 信号进行情绪预测的研究存在显著空白，即对 EEG 数据中噪声和伪迹的处理不一致，以及对捕获时间依赖性的优化模型架构探索有限。为了解决这些问题，我们的研究采用了先进的预处理技术，包括用于降噪和归一化的过滤方法，以确保使用清洁且有意义的\
  \ EEG 信号进行分析。基于门循环单元（`GRU`）的神经网络优于 `CNNs` 和 `ResNet` 等传统模型，因为它能有效捕获序列 EEG 数据中的时间依赖关系，而这对于识别与情绪状态相关的细微模式至关重要。`GRUs`\
  \ 计算效率高，降低了梯度消失的风险，特别适用于处理时间序列数据。通过利用这些优势，我们的 `GRU` 模型实现了 94.375% 的高准确率，证明了其在克服从\
  \ EEG 数据预测情绪挑战方面的有效性。这些结果强调了将稳健的预处理流水线与先进的时间建模技术相结合以改进情绪识别系统的潜力。\n\n### 3. 数据准备\n\
  \n#### **数据集**\n\n该数据集的构成专门设计为通过观看电影进行情绪诱发，基于视觉刺激与情绪唤醒之间建立的关系，这直接转化为 EEG 信号中的不同模式。这种方法与神经心理学和情感计算的发现一致，在这些领域中，电影等动态且复杂的刺激被用于诱发真实的情绪，与静态或参与度较低的刺激相比，它可以捕捉更全面的生理反应（Koelstra\
  \ & Patras, 2013）。电影的使用允许探索高唤醒情绪（如快乐）和低唤醒情绪（如悲伤），从而为训练更稳健敏感的模型提供了丰富的数据。这些模型可以学习将特定的\
  \ EEG 模式与情绪状态相关起来，这种分析通过来自 `FFT` 的频率信息进一步细化，对于强调 EEG 信号所提供的情绪粒度至关重要（Lee & Hsieh,\
  \ 2014）。\n\n本研究使用的 EEG 数据集收集自 `SEED` 数据集，托管在上海交通大学的脑机接口（BCMI）网站上。`SEED` 数据集包含 12\
  \ 名受试者的 EEG 和眼动数据，以及另外 3 名受试者的 EEG 数据。数据是在受试者观看精心挑选的电影片段时收集的，这些旨在诱发不同类型的情绪：如图 1\
  \ 所示的积极、负性和中性。该数据集广泛应用于情感计算和脑机接口中的分类任务。可以通过 [`bcmi.sjtu.edu.cn/home/seed/`](https://bcmi.sjtu.edu.cn/home/seed/)\
  \ 获取（Zhang, Wang, & Xu, 2018）。\n\n#### 图 1. 积极、负性和中性情绪状态的可视化\n\n![](img/979-8-3693-9816-6.ch014.f01.png)\n\
  \n表 1 显示了数据情绪标签的分布、计数和类型。它指示了每个情感类别（中性、负性和积极）的实例数量。\n\n表 1. 情绪标签分布\n\n| 情绪标签 | 计数\
  \ | 额外信息 |\n| --- | --- | --- |\n| NEUTRAL | 716 | `label, dtype: int64` |\n| NEGATIVE\
  \ | 708 | `label, dtype: int64` |\n| POSITIVE | 708 | `label, dtype: int64` |\n\n\
  \n\n\n随后，使用快速傅里变换（`FFT`）技术对记录的 EEG 进行了分析，捕捉了从 `fft_0_b` 到 `fft_749_b` 多个通道的广泛功率成分。每个由\
  \ `FFT` 导出的特征都封装了不同的频分，这对于复杂情绪状态的细致分析至关重要，因为它们反映了与各种情绪相关的特定神经活动和认知过程 (M. Murugappan\
  \ & S. Murugappan, 2013)）。这种方法与之前的研究一致，这些研究强调了频谱分析在通过 EEG 区分不同情绪状态方面的用途，为底层脑活动提供了详细的视角\
  \ (M. Murugappan & S. Murugappan, 2013)）。通过利用这些 `FFT` 特征，本研究中应用的机器学习算法能够更准确地识别和分类一系列情绪响应，从而加深我们通过神经生理指标对情绪状态的理解。\n\
  \n### 标签映射\n\n在准备用于情绪识别的 EEG 数据时，标签编码（label encoding）对于使机器学习模型区分并准确预测不同的情绪状态起着至关重要的作用。这一过程简化了计算需求并标准化了数据输入，从而简化了算法的训练。这种标准化至关重要，因为它将类别标签转换为机器学习模型可以高效解释和处理的格式。这一原理在机器学习和数据预处理的文献中得到了很好的支持，文献指出，将类别数据转换为数值格式对于优化模型效能至关重要\
  \ (Hastie et al., 2009)。此外，在整个数据集中保持标签编码的一致性是必不可的。编码的不一致可能会导致差异，在模型学习阶段对其产生困惑，并可能导致偏斜或不准确的预测。\n\
  \n为不同情绪状态分配数值值是经过深思熟虑且刻意的，反映了在适用时情绪之间可能固有的顺序。例如，如果情绪状态被认为具有内在的分层结构（例如从悲伤到中性再到快乐），某些研究可能会采用序数编码（ordinal\
  \ encoding）。这种方法承认并利用了数据的顺序性，在分析过程中可能提供更细致的洞察。然而，当情绪状态之间不存在此类层级关系时（如本研究所示），简单的标签编码就足够了。这种方法有效地支持了模型区分根本不同情绪状态的能力，而不会引入任何人为的顺序\
  \ (Brownlee, 2020)。在我们特定的案例中，`NEGATIVE` 情绪编码为 `0`，`NEUTRAL` 编码为 `1`，`POSITIVE` 编码为\
  \ `2`。这种编码将情绪从类别字符串转换为一致的数值格式，便于后续的数据处理步骤更易管理。\n\n### 训练-测试划分\n\n为了使用 EEG 数据有效训练用于情绪识别的机器学习模型，关键的初始步骤是将数据集适当地地划分为训练集和测试集。根据\
  \ Muraina (2022)，划分的选择会显著影响模型的泛化能力。取得正确的平衡可以确保模型既不会因为训练不足而欠拟合，也不会因为记忆而过拟合。在本研究背景下，数据集的\
  \ `70%` 被分配用于训练，剩余的 `30%` 指定用于测试。\n\n准备训练和测试数据的过程涉及将 EEG 分分为特征和标签，分别表示为 `X_train`、`y_train`\
  \ 和 `X_test`、`y_test`。在这种设置中，`X` 值由用于预测情绪状态的特征组成，而 `y` 值代表输出。\n\n### 4. 数据预处理\n\n\
  * EEG 数据的预处理被认为是 EEG 分析过程中最重要的步骤之一。许多 EEG 记录包含高水平的噪声和伪迹，从而扭曲信号并使分析变得困难；我们获取并准备了这些信号。\n\
  * 预处理对于使不同环境下采集的 EEG 数据兼容至关重要；因此数据具有一致性以进行后续分析。预处理通过有效管理噪声和伪迹将原始数据连接到可操作的信息，使其成为神经科学研究不可或缺的一部分。这些努力为后续应用（包括脑机接口、诊断系统和认知研究）奠定了坚实的基础。\n\
  \n使用滤波技术对 EEG 进行预处理：\n\n#### 1. 带通滤波\n\n* 带通滤波用于从 EEG 信号中选择特定的频带同时抑制其他频带。这让我们能够关注与特定脑波相关的频率，例如\
  \ `beta` 波（范围从 `12 Hz` 到 `30 Hz`，与活跃思维过程相关）和 `alpha` 波（范围从 `8 Hz` 到 `12 Hz`，与放松相关）。\n\
  \n* `FIR` 滤波器（特别是使用 `Blackman` 窗时）恢复出的信号误差极低且频谱泄漏最小 (Kaur, 2024)。滤波器的设计还为了减少对脑信号提供关键信息的失真。设计\
  \ `FIR` 滤波器还避免了相位失真，而相位失真对于保留 EEG 信号的时间特征至关重要。\n\n* 然而，通带的选择非常关键，需要仔细处理。否则，将丢失关键数据或引入无关频率。因此，考虑到所有这些问题，带通滤波被证明是准确分析脑活动的必备工具，并可以作为后续信号处理的可靠基础。\n\
  \n\n\n- 此外，带通滤波允许根据各个频带分离不同的大脑活动状态，并对其进行清晰的隔离。这种能力对于认知研究和情感识别应用特别有用，因为在这些领域中，信号表征的准确性至关重要。\n\
  - 带通滤波通过显著减少与实验无关频率范围内的噪声增强了脑电图（EEG）的可解释性。这不仅增加了结果的可靠性，还提高了其可重复性。这意味着专注于特定脑波范围（通常用于高级认知处理的伽马波）的\
  \ EEG 研究将具有更高的完整。\n\n## 2. 陷波滤波 (Notch filtering)\n\n- 为了排除特定的频率成分，采用了陷波滤波。示例包括电源线干扰，根据地理位置不同，通常为\
  \ 50 Hz 或 60 Hz。这种干扰可能会掩盖脑信号，如果不进行滤波，会导致记录充满噪声。陷波滤波器证明能够成功移除针对特定窄频带的可预测噪声，且对周围频率的影响微乎其微\
  \ (Sen, 2023)。\n- 尽管有效，但陷波滤波并非所有噪声源的万灵药。它在消除窄带干扰时最有用，但对肌肉运动伪迹或其他宽谱噪声的效果较差。此外，当应用不当时时，滤波器会略微降低附近的频率。因此，数据质量因此降低。\n\
  - 尽管陷波滤波有局限性，但它仍然是排除 EEG 记录相关噪声类型的一种可靠手段。由于它对检测要排除的小频带很敏感，这使得在追求清晰数据时，这种过滤具有了价值，特别是在需要考虑电源线噪声的控环境中。除了去噪声的用途外，陷波滤波通常还能使流水线更加强健。系统地持续移除电源线干扰意味着下游分析可以在这些信号上进行几乎不失真的处理，并在很大程度上增强了我们结果的可靠性。\n\
  - 现代安装还研究了自适应陷波滤波器，以实时调整变化的噪声频率，特别是在易波动的电噪声环境中。自适应技术允许获得更好的数据质量，而无需持续重新训练陷波滤波器。\n\
  \n## 3. 用于伪迹去除的独立成分分析 (ICA)\n\n- 为了实现混合 EEG 信号分离，执行了独立成分分析 (ICA)，以便神经活动与眼球运动或肌肉抽动等伪迹区分开来。统计分析确实过滤了一些伪迹；因此它显著有助于提高\
  \ EEG 信号的清晰度 (Ansari, 2023)。\n- 例如，ICA 有效地移除了信号中的眼动伪迹，使得仅分析神经活动。这尤为关键，因为对于需要多次眼动的研究，传统的滤波往往无法区分脑活动和眼球伪迹。尽管\
  \ ICA 已被证明非常有效，但缺点是当它们发生重叠时，有用的神经信号可能会随伪迹被移除。重叠在保证数据保真度方面确实是一个问题。\n- ANC 方法确实更可靠，因为它在不抑制神经信号的情况下消除了噪声\
  \ (Ansari, 2023)。这种结合方法为伪迹去除提供了一个全面的解决方案，以提高处理后 EEG 的准确性和可靠性。有了了这些灵活性，可以根据每个实验的需求来定制预处理流水线。例如，在进行运动想象时，ICA\
  \ 效果最好，它能捕获来自运动皮层的信号并消除噪声信号（例如，与前者无关的信号）。这种适应性将确保预处理步骤与每项研究的所有目的相匹配，从而最大限度地利用 EEG\
  \ 数据。事实上，组合预处理技术证明，这使我们能够克服原始 EEG 数据面临的大多数问题。它为有意义且准确的分析奠定了坚实的基础，因为我们有系统地去除了噪声和伪迹。\n\
  - 研究结果已经表明，将 ICA 与机器学习算法结合以自动检测和去除伪迹可以产生更好的结果，因为这减少了对人工干预的需求，并在大规模研究中提供了标准化的预处理方案。这种集成极大地提升了预处理流水线的效率，并为多中心研究的协作提供了必要的扩展性。\n\
  \n在代码中，函数 `preprocess_inputs(df)` 为机器学习准备输入数据。它首先通过创建输入数据框 `df` 的副本来避免更改原始数据。然后使用预定义的\
  \ `label_mapping` 将 `'label'` 列映射到新值。接着，通过提取 `'label'` 列并将剩余列保存为特征，将标签 (`y`) 与特征\
  \ (`x`) 分离开。然后使用 `train_test_split`（70% 用于训练，30% 用于测试）将数据集分为训练集和测试集，使用固定随机值的 `train_test_split`\
  \ 是为了可重复性。最后，函数返回特征和标签的训练及测试集。\n\n## 5. 特征可视化 (FEATURE VISUALIZATION)\n\n### 绘制\
  \ EEG 特征\n\nEEG 特征的提取和可视化（特别是在频率范围内）对于破解情感状态与大脑活动之间复杂的关系起着至关重要的作用。在我们的研究中，我们仔细绘制了从\
  \ `fft_0_b` 到 `fft_749_b` 的频域特征。每幅图的设计旨在清晰地显示频率成分的振幅，并系统地排列，x 轴标记了频率箱（从 `fft_0_b`\
  \ 到 `fft_749_b`），y 轴记录相应的振幅。这种结构化和方法化的数据表示不仅有助于识别独特的频率模式，还将这些模式与各种情感状态联系起来。从视觉上追踪和区分这些模式的能力对于理解特定频率如何与情感反应相关至关重要。\n\
  \n现有文献和研究进一步强调了此类图表的重要性，这些研究指出特定的频带与不同的心理状态紧密相连。例如，正如 Wolfgang 等人指出的，alpha 频段（通常在\
  \ 8 到 12 Hz 之间）与放松和冷静的状态有关，可能代表了我们研究中的“中性”情感状态。相反，beta 波（范围大约在 12 到 30 Hz 之间）通常与高度增强的警觉、活跃思维和注意力状态有关，这些特征可能与“积极”情感状态相关。通过通过视觉化映射这些频率，我们的研究能够深入探索特定的被分类为“积极”、“消极”或“中性”的情感状态如何反映或影响大脑的电活动。这些见解对于增强我们对情感神经学基础的理解至关重要。\n\
  \n\n\n\nMatplotlib 是用于这些可视化的库，它是 Python 编程生态系统中广泛使用的绘图库。Matplotlib 以其功能强大而闻名，提供了系列通用且稳健的绘图能力，使其成为科学计算数据可视化领域不可或缺的工具。正如\
  \ Barrett et al. (2005) 所出的，`Matplotlib` 不仅有助于创建高质量的图表，而且能够通过极少的代码高效地实现。这一特性在探索性数据分析中特别有利，因为快速且清晰的视觉洞察至关重要。快速生成直观且信息丰富的视觉化能力，允许研究人员通过复杂数据集的表示（例如涉及\
  \ EEG 分析的数据）做出明智的决策和解释。\n\n#### 图 2. 所选样本 FFT 特征 (fft_0_b 到 fft_749_b) 可视化\n\n![](img/979-8-3693-9816-6.ch014.f02.png)\n\
  \n图 2 中的图表可视化了从数据集中提取的 750 个 FFT（快速傅里叶变换）特征，范围从 `fft_0_b` 到 `fft_749_b`。x 轴表示这些特征的索引，y\
  \ 轴显示相应的值。数值波动显著，大约在 -800 到 600 之间，显示出波形状模式。该图有助于分析 FFT 变换特征的分布和变化，为所选样本数据的频域特征提供了见解。\n\
  \n### 6. 模型架构\n\n模型架构由多个层组成，旨在有效处理 EEG 数据的序列性和复杂性。初始层负责输入 EEG 特征，随后是一个 `GRU` 层用于处理时间序列。接着是展平化（flattening）过程，最后以带有\
  \ `softmax` 函数的全连接输出层结束，用于分类为三种情绪状态：负性（Negative）、中性（Neutral）和积极（Positive）。\n\n输入层作为初始阶段，引入了预处理后的\
  \ EEG 特征。这些特征封装了与情绪状态相关的脑电动力学，源于早些详细的数据预处理步骤。通过这些技术，数据被处理为适合神经网络模型的输入，为情绪识别分析提供了优化的基础。\n\
  \n输入层之后，一个具有 256 个单元的 `GRU`（门控循环单元）层处理序列数据。`GRUs` 是循环神经网络（`RNN`）的变体，通过在时间上保持信息并解决困扰传统\
  \ `RNNs` 的梯度消失问题来优化序列处理。这种问题（梯度要么消失要么爆炸）导致难以学习数据序列中的长程依赖，通过 `GRUs` 的独特架构得到了有效缓解，因为它们利用更新门和重置门来调节信息流，允许它们选择性地保留或忘记数据，从而增强了它们以更高精度建模时间序列的能力\
  \ (Zargar, 2021)。这种能力使得 `GRUs` 特别适用于 EEG 数据，因为 EEG 数据本质包含了区分不同情绪状态至关重要的动态和时间信息。\n\
  \n展平层位于 `GRU` 层之后，它将来自 `GRU` 的多维输出转换为一维数组。这种转换至关重要，因为它准备了数据以满足后续密集层的输入规范，该层需要一个扁平向量进行处理。展平过程是神经网络架构中一种标准且关键的实践，特别是在卷积层或循环层与全连接层之间时\
  \ (Calin, 2020)。它确保了输入数据的空间层次结构被有效压缩，在保留基本信息的同时，将其转换为更适合分类任务的格式。重要的是，此层维持了数据底层模式的完整性，这对于基于\
  \ EEG 信号的情绪状态准确分类至关重要。\n\n最后，模型的输出层由一个带有 `softmax` 激活函数的全连接层组成。该层旨在将输入的 EEG 特征归类为三种情绪状态之一：负性、中性和积极。`softmax`\
  \ 函数在多类分类任务中特别有用，因为它输出了每个类别的概率，为模型的决策过程提供了清晰的指示。Duan et al. (2003) 强调了 `softmax`\
  \ 在神经网络中将输入分类为互斥类别的有效性，这对于情绪状态预测的清晰性和准确性非常重要。\n\n在我们模型的最后阶段，输出层采用了一个具有三层和 `softmax`\
  \ 激活函数的全连接层，选择它是因为它擅长将处理过的 EEG 特征归类为三种预定义的情绪状态之一：负性、中性和积极。`softmax` 函数对于我们的情况特别适用，因为它根据神经网络前序层处理的输入来计算每个类别可能性的概率\
  \ (Duan et al., 2003)。该函数擅于处理需要分类为排斥类别的输入，使其成为我们的最佳选择。\n\n\n\n本研究的模型编译涉及设计一种编译过程，以实现多分类分类任务的高效训练和强劲性能。在这方面，优化器、损失函数和评估指标的选择对于有效模型的有效收敛以及减少资源消耗起着至关重要的作用，从而在优化模型性能的同时实现高准确率。每一个组件都经过精心挑选，以适应当前任务面临的挑战。\n\
  \n### 优化器\n- 优化器：在实验中，选择了 `Adam` 优化器，它具有自适应学习率的能力，并在训练过程中表现高效且稳定。具体而言，`Adam` 是一种结合了\
  \ `AdaGrad` 和 `RMSProp` 的新型优化器，这两者是最流行的两种基于自适应的优化算法。它通过梯度属性来调整学习率，这使得任何参数的更新都更加高效（Kingma\
  \ & Ba, 2015）。这种学习率的自适应调整确保了优化器在面对噪声梯度和更新幅度差异时能够合理地运行，这一特征对于涉及大型数据集和复杂模型的深度学习任务极其有用。\n\
  \n`Adam` 的最大优点之一是能够对每个参数进行个体化的学习率适应，这显著加快了训练速度。反过来，这使得优化器不太可能出现收敛缓慢或过度波动，而这些是应用\
  \ `SGD` 等标准优化算法时常见的显著缺点。事实上，实验已经过，并证明 `Adam` 经常优于经典的 `SGD`，特别是在应用于一系列 `CNN` 深度学习任务时（Barakat,\
  \ 2021）（Cong, 2018）。在本次实验中，`Adam` 在计算效率和内存占用减少方面提供了更好的性能。它还减少了过拟合，不需要 `SGD` 等其他优化器通常需要的许多超参数设置。\n\
  \n研究了权重衰减 `Adam` 的影响，作为最小化过拟合和保证强泛化性能的措施。这种技术与当代研究一致，该研究发现权重衰减可以增强 `Adam` 在复杂神经网络中的稳定性，特别是在多项分类任务中。\n\
  \n### 损失函数\n- 损失函数：为了高效处理多分类任务，选择了 `sparse categorical cross-entropy`（稀疏分类交叉熵）损失函数。它与其他损失函数不同，因为它直接接受整数编码的标签，不需要任何独热编码，这简化了训练过程并从而减少了计算开销。在本项工作的背景下，这是一个关键属性，因为简化数据预处理流水线对于减少计算开销和加速训练过程至关重要。\n\
  \n`sparse categorical cross entropy` 对每个输入应用正确类别的似然对数，并对错误预测进行惩罚。这通过为正确类别分配更大的概率来减少模型中的噪声，从而提高其在分类中的性能。此外，`sparse\
  \ categorical cross entropy` 也被认为在类别不平衡时表现良好。当然，这是本研究中的一个考虑因素，因为类别的分布是不均匀的。根据先前的研究，`sparse\
  \ categorical cross entropy` 可以提高模型的准确率和收敛时间，对于大型不平衡数据集而言最为显著（Ghosh, 2023）。\n\n\
  除了上述，还通过修改损失函数使用了有助于减少过拟合的技术。在这里，`dropout` 层被认为是帮助模型在强特征上进行训练而不会对训练数据产生过偏的重要部分。这一额外策略进一步增强了学习模型对新场景的泛化能力。\n\
  \n### 指标\n- 指标：本研究使用的主要评估指标是 `accuracy`（准确率），它在分类任务中被常用。准确率通过计算准确预测占所有预测的百分比，为模型性能提供了一个直接且易理解的评估。通过在整个训练过程中跟踪准确率，可以轻松监控模型的进度。\n\
  \n`94.375%` 的准确率清楚地展示了模型的强大性能，监控每轮（epoch）的准确率指示模型的进度。这种方法允许在需要时进行及时调整，以确保模型朝着最佳性能的方向进行。\n\
  \n尽管准确率已足以说明模型的整体性能，但重要的是，`precision`（精确率）、`recall`（召回率）和 `F1-score`（F1 分数）指标也可以被认为是确定更完美验证的合适指标，特别是对于不平衡数据集（Mohan,\
  \ 2024)（Agarwal, 2024）。这些指标将对模型正确分类正负用例的能力提供更详细的分析，使其性能的感知更加微妙。\n\n最后，我们在训练期间应用了\
  \ `early stopping`（早停）标准，在验证性能达到平台期时停止过程，从而防止不必要的过拟合并允许高效利用计算资源。这种方法的适应性能模型能够在不给训练过程带来过度压力的情况下获得性能，证明了适用于特定任务的有效编译策略。\n\
  \n### 8. 模型训练与测试\n\n#### 模型训练：\n在训练阶段，我们采用了结构化方法来优化用于从 EEG 数据识别情绪的机器学习模型。初始步骤是将大量的标记\
  \ EEG 数据输入模型，这通过允许模型识别并关联数据中的特定模式和特征与相应情感状态来促进模型的学习过程。为了进一步提高模型的准确率，我们参与了严谨的超参数调优。这一重要步骤涉及调整诸如\
  \ `learning rate`（学习率）、`batch size`（批量大小）和 `number of layers`（层数）等参数，以最小化预测结果与实际标签之间的差异，从而显著提升模型的预测性能，正如\
  \ Uçar 等人 (2020) 所述。\n\n\n\n\n# 超参数调优与训练策略\n\n微调超参数对于增强机器学习模型的效能至关重要。学习率是一个关键参数，它调节了模型根据观测到的误差更新权重的程度。较低的学习率可能导致收敛速度较慢，而较高的学习率则可能会越过最优解。批处理大小（batch\
  \ size）对模型训练有重大影响，它是每次迭代中用于计算梯度的训练样本数量。较小的批处理大小可能会更频繁地更新模型，但可能可能在更新中引入噪声；而较大的批处理大小提供了更稳定的梯度估计，但会消耗更多的计算资源。\n\
  \n此外，模型学习复杂模式的能力受到神经网络中层数的显著影响。增加层数允许模型学习到更详细的特征，但也增加了过拟合的风险并使训练过程变得复杂。此外，神经网络中的层数会极大地影响模型学习复杂模式的能力。在模型中添加更多层的优点是允许它捕捉到更复杂的特征；然而，这同时也带来了增加过拟合风险的缺点。\n\
  \n## 提前停止（Early Stopping）\n\n提前停止是一种在模型在验证集上的性能不再提升时停止训练的策略，以防止过拟合。这种方法对于确保模型在未见数据上具有泛化能力至关重要。在实验中，我们通过监控验证损失的变化来确定最佳停止点。\n\
  \n## 训练配置\n\n在训练过程中，我们配置了多个超参数组合以寻找最佳性能。这包括不同的学习率、批处理大小和优化器设置。通过交叉验证，我们评估了这些参数对模型准确率的影响。\n\
  \n## 测试\n\n最后，我们在独立的测试集上对模型进行了测试，以评估其真实泛化能力。我们计算了准确率、召回率和 F1 分数，这些指标全面反映了模型在处理新数据时的表现。\n\
  \n# 9. 结果可视化\n\n在经历了广泛的数据处理、特征提取和建模阶段后，机器学习模型在 EEG 信号情绪预测方面取得了良好结果。模型的有效性可以通过混淆矩阵和详细分类报告清晰看到。\n\
  \n## 混淆矩阵\n\n混淆矩阵是一种检查分类模型性能的强大图形工具。它以矩阵形式展示了预测分类的对比，从而对模型的准确性进行直观评估。矩阵的行代表实际类别（也称为真实标签），而列代表模型预测的类别。这种布局有助于将预测结果与真实情况进行直接比较(Naidu\
  \ et al., 2023)。矩阵中的每个单元格显示了模型对给定实际-预测对的预测计数，清晰揭示了有多少预测是正确的（预测类别与实际类别匹配的对角线单元格），有多少是错误的（预测与实际不匹配的非对角线单元格）(Naidu\
  \ et al., 2023。这种设置不仅有助于识别整体准确率，还能识别模型可能将一个类别误认为另一个类别的特定区域。例如，对应不同情绪的行和列中大量的非对角线元素将表明模型经常在这些情绪之间误分类\
  \ (Beauxis-Aussalet & Hardman, 2014)。\n\n本研究生成的分类报告包含了几个关键部分：每个分类情绪状态的精确率（precision）、召回率（recall）和\
  \ F1 分数（包括快乐、悲伤和中性）。每个指标都从不同角度提供了模型性能视角，对于全面评估至关重要。\n\n\n\n\n\n`Precision`（精确率）衡量分类模型做出准确正向预测的能力。它被定义为真阳性（正确预测的正向案例）与总预测正例（真阳性\
  \ + 假阳性）之比。这一指标非常有洞察力，因为它有助于理解在被分类为特定情感的样本中正确预测的比例，清晰地表明了模型在正确预测正向实例方面的可靠性。在假阳性成本较高的场景下，`Precision`\
  \ 至关重要，它可以确保模型的正向预测是可信的（Naidu et al., 2023; Rainio et al., 2024)（(Lab, n.d.)）。\n\
  \n`Recall`（召回率），也称为敏感性，是一种衡量模型正确识别特定类别所有相关实例能力的指标。它的计算方法是通过将真阳性预测的数量除以实际正例（真阳性和假阴性之和）来得出的。该比例表明了模型检测特定情感所有样本的能力如何，强调了模型在捕捉所有正向案例而不遗漏任何一个方面的有效性。在遗漏正向实例（假阴性）可能导致严重后果的情况下，高\
  \ `recall` 至关重要，确保了对正向案例的全面覆盖（Naidu et al., 2023; Rainio et al., 2024)）。\n\n`F1-score`（F1\
  \ 分数）是一个强有力的指标，通过计算 `precision` 和 `recall` 的调和平均数来平衡两者。这一指标特别有用，因为它在模型的 `precision`\
  \ 和 `recall` 之间保持了平衡，确保了任何一个指标都不会受到不成比例的偏袒。`F1 score` 是模型整体准确性的宝贵指标，特别是在假阳性和假阴性都带有重大后果的场景下。通过调和\
  \ `precision` 和 `recall`，`F1 score` 提供了一个单一指标，概括了模型在可靠性和完整性方面的性能（Naidu et al., 2023;\
  \ Rainio et al., 2024)）。\n\n图 3 中展示的混淆矩阵提供了情感分类模型性能的洞察，该模型实现了 94.37%的总体准确率。矩阵显示\
  \ `NEUTRAL`（中性）类的准确率最高，231 个样本中有 228 个被正确分类，仅有 3 个被误分类为 `POSITIVE`（正向）。对于 `NEGATIVE`（负面）类，201\
  \ 个样本中有 187 个被正确分类，有 14 个被误分类为 `POSITIVE`。同样，`POSITIVE` 类在 208 个样本中有 189 个正确预测，其中\
  \ 17 个被误分类为 `NEGATIVE`，2 个被误分类为 `NEUTRAL`。\n\n#### 图 3. 可视化模型性能的混淆矩阵\n\n#### 10.\
  \ 使用 EEG 进行情感预测的局限性\n\n使用 EEG 进行情感预测面临许多挑战。`EEG` 信号受到年龄、性别和状态的影响，具有个体差异。此外，`EEG`\
  \ 记录容易受到运动和外部电干扰的影响，影响数据质量。尽管 `EEG` 具有高时间分辨率，但其空间分辨率限制了定位与情感相关脑区域的能力。此外，情感是复杂且多维的，并受到文化、环境和背景因素的影响，许多研究在受控实验室环境下进行，可能反映真实情况。\n\
  \n#### 11. 伦理考量\n\n使用 EEG 预测情感引发了重要的伦理问题，需要仔细考虑以确保技术的负责任开发和应用。一个重要问题是隐私保护，因为 `EEG`\
  \ 数据包含了敏感的心理和情感信息。未经授权的访问或滥用此类数据可能侵犯个人隐私。为了保护用户数据，安全的存储和加密方法是必须的。\n\n另一个担忧是情感预测技术的滥用，例如在监控、营销或利用人们情感脆弱性的做法中。为了防止不道德的应用，需要明确规则和限制。此外，人们必须对其\
  \ `EEG` 数据的收集、处理和使用充分知情，以表示同意。\n\n情感预测模型的准确性和可靠性也必须考虑到。不准确的预测可能会导致意外，特别是在心理健康诊断等关键应用中。开发者需要确保技术减少偏差并经过科学验证。为了确保技术负责任地服务于社会，伦理问题应继续是关注焦点。\n\
  \n#### 12. 未来研究方向\n\n使用 EEG 进行情感预测的领域提供了许多未来探索机会，以解决现有局限性并扩大其应用。处理不同人群 `EEG` 信号差异的稳健方法对于创建通用且包容的模型至关重要。改进伪迹去除技术并采用先进的信号处理方法可以提高\
  \ `EEG` 质量和可靠性。增加样本量并纳入来自不同人口统计的数据将为情感反应提供更全面的见解。\n\n未来的研究应关注将 `EEG` 数据与其他模态（如面部表情、语音分析或生理信号）相结合，以开发多模态系统，提高情感预测的准确性和稳健性。在动态的实验室环境中对模型进行验证也至关重要。\n\
  \n#### 13. 结论\n\n\n\n\n本研究工作充分调查了基于 `EEG` 的情绪预测，并成功证明了所开发模型在解码神经活动方面的效率。我们的研究结果还反映了\
  \ `GRU` 模型的优越性，其达到了 `94.375%` 的准确率，并能有效捕捉 `EEG` 信号中的时间模式。结果还强调了特定频率特征（特别是来自 `delta`、`theta`\
  \ 和 `alpha` 波段）对于区分情绪状态的重要性。因此，模型的成功得益于鲁健的预处理技术，如`band-pass filtering`（带通滤波）、`Independent\
  \ Component Analysis`（独立成分分析）以及特征提取方法如 `Fast Fourier Transform`。\n\n通过案例研究进一步验证了该模型的现实世界适用性。结果证明，该模型在各种场景下对情绪状态具有良好的预测性和高可靠性。研究确定，优化良好的\
  \ `machine learning` 流水线可以带来更高的效率和 `accuracy`。这也是一个非常重要的现象，表明该技术在如今情感识别日益重要的所有医疗、教育和娱乐领域都有应用前景。\n\
  \n目前，本文还讨论了未来几个极具前景的研究领域。进一步捕捉 `EEG` 动态空间和时间特征的可能方向包括与 `transformers` 等复杂模型集成。`EEG`\
  \ 数据的实时集成结合多模态方法（例如将其与`facial expression analysis`或`physiological sensors`结合），可能会显著提升模型的性能和适用性。此外，伦理问题（如`data\
  \ privacy`和包容性）以及能够泛化到不同人群的更多数据集，也是该领域发展中非常重要的关注点。\n\n通过完成这项研究成功证明了我们模型的实用性，为不断发展的基于\
  \ `EEG` 信号的情绪识别领域做出了贡献，并为更智能、响应更快的系统开辟了道路。由此产生的理解为通过神经活动解码人类情绪的进一步研究和创新提供了非常坚实的平台。\n\
