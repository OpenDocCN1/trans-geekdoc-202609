  \n印度 R.M.K. 工程学院\n\n### 摘要\n\n本章介绍了一种自动化生物医学图像分类系统 `HBDL-FBTA`（基于融合脑肿瘤分析的混合生物启发深度学习），该系统专注于脑肿瘤——即脑部或周围组织中的异常细胞生长，这需要早期、准确的检测以进行有效治疗。`HBDL-FBTA`\
  \ 采用预处理来增强图像质量，基于 `Swin-UNet` 的分割进行精确的区域划分，以及基于融合的特征提取以获取稳健的特征。它使用带模拟退火的座头鲸优化算法\
  \ (`HSSA`) 进行参数调优，并使用门控循环单元 (`GRU`) 进行可靠的分类。在包括 `BraTS2017` 在内的基准数据集上的仿真表明，其具有卓越的性能，在\
  \ `ISIC 2017` 数据集上达到 `94.51%` 的准确率，在 `ISIC 2020` 数据集上达到 `95.38%`。未来的工作将重点评估大型数据集上的计算复杂度、整合多模态成像数据并开发可解释的深度学习模型以增强临床采用和可靠性。\n\
  \n### 1. 引言\n\n在生物医学图像分析的巨大领域中，使用了多种方法和策略来从生物医学图像中提取、处理和解释相关信息 (S. Nazir et. al,\
  \ 2023)。它在临床实践、医学研究和医疗管理中起着至关重要的作用 (M. Obayya et.al, 2022)。根据内容自动标记或分类医学图像的任务被称为生物医学图像分类\
  \ (S. Chakraborty et. al)。由于医学成像数据的丰富以及 `Deep Learning` (`DL`) 技术辅助医疗专业人员识别疾病和做出治疗决策的潜力，该领域近期引起了广泛关注\
  \ (M. Di Giammarco et. al, 2022)。医学图像分析旨在为放射科医生和医生提供高效诊断和治疗程序的工具 (J. Yang et. al,\
  \ 2023)。`CT`、`MRI` 和 `X-ray` 等医学成像工具可以提供体内疾病和异常的解剖和功能信息，而不造成任何伤害 (J. Zhu et. al,\
  \ 2023)。由于医学图像包含缺陷、伪影和混杂信息（如果存在），因此处理以从医学图像中检索有意义的数据 (F. Li et. al, 2023)。医学应用受益于图像处理技术的贡献；例如，图像引导手术、图像分割和图像配准广泛应用于医学诊断和治疗\
  \ (S. Maqsood et. al, 2023)。`DL` 方法在某些领域（如医学影像）中的表现显著优于人类专业人士。`DL` 算法利用海量数据集来预测复杂任务。\n\
  \n在涉及 `Computer Vision` (`CV`) 图像解释的任务中，`DL` 方法已实现了显著更高的准确度 (A. Shrivastava et.\
  \ al, 2022)。在网格结构架构中，用于信息分析最高效的神经网络类型是卷积深度神经网络 (`CNNs`) (D. Sharma et. al, 203)。近年来，医学成像分析最有效的方法是\
  \ `DL` 模型，特别是 `Deep CNN` (`DCNN`) (S. Dash et. al, 2023)。在图像分类任务中，深度神经网络 (`DNNs`)\
  \ 的性能显著优于其他人工智能 (`AI`) 技术，并且往往优于人类领域专家。对于生物医学应用中使用 `AI` 技术进行成像分割和分类的担忧日益增加 (K. VanHorn\
  \ et. al, 2022)。尽管建议编码器-解码器转换，但 `CNN` 是图像分类和分割更现代的范式 (S. Patel et. al, 2022) (Aamir\
  \ et al., 2019)。\n\n本文介绍了混合生物启发深度学习 - 融合脑肿瘤分析 (`HBDL-FBTA`)。文中，`HBDL-FBTA` 首先使用\
  \ `Swin-UNet` 对图像进行预处理和分割。带模拟退火的座头鲸优化算法 (`HSSA`) 用于参数调优，门控循环单元 (`GRU`) 提供可靠的分类。\n\
  \n#### 图 1. 全球医疗 AI 市场收入 2022-2032\n\n![](img/979-8-3693-9816-6.ch006.f01.png)\n\
  \n\n\n\n\nPradhan et al. (2023) 研究了一种基于集成 DNN 的智能方法，用于将 CXR 和 MRI 图片分为异常类和正常类，以便对海金森病、新冠和阿尔茨海默症进行初步识别。该方法使用\
  \ `CNN` 自动从照片中提取特征，同时使用 `LSTM` 作为最终分类器。此外，使用爬山算法（`HCA`）来拟合其他参数，并同时确定 `CNN` 和 `LSTM`\
  \ 超参数的最优值，例如 `CNN` 过滤器维度和 `LSTM` 单元数量。Ahmed et al. (2023) 研究了一种名为 `DOLG-NeXt` 的新颖编码-解码器结构，该结构在基于\
  \ `UNet` 的变体基础上结合了三个关键增强。作者主要使用由 `SE-Net` 驱动的 `ConvNeXt` 阶段作为嵌入骨干以有效提取特征。其次，作者通过使用从解码器的\
  \ `DOLG` 特征组件获取细粒度的上下文特征表示。对于生物医学图像分类，Barzekar and Yu (2022) 研究了一种名为 `C-Net` 的新型\
  \ `CNN` 结构，它由多个网络拼接组成。架构的前两个部分由六个网络组成，有助于特征提取并创建一个用于良性和恶性图片分类的内部网络。Mansour (2022)\
  \ 提出了 `AIFM-CRC`，一种用于 CRC 分类分析的新型 AI 融合技术。此外，`WOA-tuned` Deep `SVM` 算法是一种识别 CRC\
  \ 是否存在的分类方法。\n\n在 G. Habib 等（2020）的最新研究中，引入了一种用于分类脑肿瘤的新型深度 `CNN` 方法。通过在某种程度上利用 `TL`\
  \ 进行数据蒸馏，这种革命性的 `CNN` 技术可以省去从开始训练的需求，从而节省数天或几周的时间。此外，使用高斯初始化策略创建权重，随后使用 `ReLu` 激活函数，以通过不同的优化器方法增加训练加速效果。Assad\
  \ and Kiczales (2020) 创建了一种用于生物医学图片的新型深度特征提取和分类方法——对角双线性插值深度残差网络（`DBI-DRSN`）。`DBI-DRSN`\
  \ 方法通过 `DRSN` 方法的微调对分类，并通过预处理方法实现了信息或特征的平衡。\n\nPang et al. (2019) 描述了一种新型融合 `CNN`，它在给定的\
  \ `DNN` 结构中结合了浅层和深层特征，为生物图像创建了更准确、更有效的分类。利用生物医学图片，Alanazi et al. (2022) 研究了一种智能的\
  \ `DL` 允许口腔鳞细胞癌检测与分类（`IDL-OSCDC`）方法。`GF` 被所提 `IDL-OSCDC` 技术中的预处理步骤用于去除噪声。此外，使用基于增强\
  \ `GOA`（`EGOA`）的 `DBN` 方法完成了 `OC` 检测和分类。`EGOA` 技术用于对 `DBN` 算法进行超参数调优，从而提高了分类结果。\n\
  \nJaszcz et al. (2022) 建议将红狐启发优化算法（`RFOA`）用于图像诊断分割。通过创新的适应函数和对方程修改的强调，对启发式操作进行了修改以分析\
  \ 2D 图像。为了克服这些困难，S.Z.Kurdi 等人采用了哈里斯鹰优化卷积网络（`HHOCNN`）。为了降低肿瘤误识别率，对脑磁共振（`MR`）图片进行了预处理并去除了噪声像素。然后使用候选区域方法定位恶性区域。Khan\
  \ et al. (2022)) 提出了一种用于步态识别的轻量级深度学习技术。首先检查并在添加层方面改进了两个预训练模型。火蛾优化方法改进了判别相关性，可用于融合过程。\n\
  \n### 3 提出的方法\n\n本文介绍了一种用于生物医学图像自动分类的完整框架——HBDL-FBTA（基于生物启发深度学习的脑肿瘤分析混合融合模型）。HBDL-FBTA\
  \ 方法的主要目标是精确评估和分类用于疾病诊断的生物图像，解决了现代医疗诊断中的重要问题。该框架是系统性构建的，结合了多个互补的复杂阶段，以提高可靠性和性能。\n\
  \n为了保证输入的统一和高质量，预处理是第一步，在此期间对原始生物图像进行增强和去噪处理。这一步对于减少后续处理中的错误和不一致性至关重要。\n\n\n\n\n\
  \n本文提出了一种使用 `HBDL-FBTA`（用于医学图像分析的混合元启发式加深度学习融合模型）技术进行自动化生物医学图像分类的全面框架。`HBDL-FBTA`\
  \ 技术的主要目标是准确地评估和分类生物图像用于疾病诊断，从而解决现代医疗诊断中的重大问题。该结构经过了精心构建，包含了多个旨在增强性能和可靠性的先进阶段。\n\
  \n## HBDL-FBTA 框架\n\n预处理是第一阶段，旨在确保输入的一致性和高质量，通过对原始生物图像进行改进并消除噪声。这一阶段对于度地减少后续处理中的错误和不一致性至关重要。在预处理之后，使用基于\
  \ `Swin-UNet` 的分割分离图像中的某些感兴趣区域。利用 `Swin Transformer` 模型收集局部和整合全局图像特征的能力，`Swin-UNet`\
  \ 架构实现了卓越的分割准确性。这种分割确保了后续分析仅针对图像中最相关的区域。\n\n下一步是使用两种先进的深度学习模型 `Xception` 和 `残差网络\
  \ (ResNet)` 进行基于融合的特征提取。该框架结合了各种模型的优势来提取广泛的价值信息，捕捉生物图像中复杂的模式和变化。这种融合策略显著提高了框架的表征能力，使其能够区分复杂的疾病特征。\n\
  \n使用 `HWOA_APSO` 进行超参数优化，以优化深度学习模型的性能。这种元启发式优化策略确保了模型尽可能高效地运行。由于加入了 `HSSA`，框架更加可靠且具有场景适应性，同时它还提高了准确性和计算效率。\n\
  \n在最后阶段使用 `门控循环单元 (GRU)` 算法进行分类。循环神经网络 (`RNNs`)（`GRU` 是其一种变体）在处理时间序列和序列数据方面表现出色。`GRU`\
  \ 算法通过检查检索到的特征，能够且极其准确地诊断和分类疾病。这种结合了分割、特征提取、优化和分类的多层技术确保了对生物医学图像进行全面且可靠的分析。\n\n\
  #### 图 2. 提出的 HBDL-FBTA 框架\n\n![](img/979-8-3693-9816-6.ch006.f02.png)\n\n`HBDL-FBTA`\
  \ 框架的全面过程包含了这些每个阶段，所示图 2。所建议的方法通过将尖端深度学习技术与创新的元启发式优化相结合，在变革生物医学图像分析方面前景巨大。其提供准确且可靠的疾病分类的能力，凸显了其作为提高医疗应用中诊断精度和效率有力工具的潜力。\n\
  \n## 数据集\n\n`BRATS2017`（2017 年脑瘤分割）样本是脑瘤研究和分割的重要基准。该数据集包含 285 脑瘤 MRI 扫描，每份扫描都具有四种不同的\
  \ MRI 模态：`T1 加权 (T1)`、`T1 加权增强 (T1ce)`、`T2 加权 (T2)` 以及 `流体衰减反转恢复恢复 (FLAIR)`。这些模态提供了补充信息，有助于对脑组织和肿瘤区域进行彻底分析。每份\
  \ MRI 扫描都配有掩码，勾勒出三个关键的肿瘤子区域：`增强肿瘤 (ET)`，代表活跃增殖的肿瘤区域；`非增强肿瘤核心或坏死 (NET/NCR)`，说明非活动或坏死组织；以及`水肿\
  \ (Edema)`，表示相邻的肿胀或液体积聚。该数据集有助于三个任务的分割评估：`全肿瘤 (WT)`，包含所有肿瘤区域；`肿瘤核心 (TC)`，包含 `增强肿瘤\
  \ (ET)` 和 `非增强肿瘤/非关键区域 (NET/NCR)`；以及 `增强肿瘤 (ET)`，专注于活跃肿瘤区域，如图 3 所示。\n\n#### 图 3.\
  \ 胶质瘤与无胶质瘤样本\n\n![](img/979-8-3693-9816-6.ch006.f03.png)\n\n\n\n\n\n数据增强技术通过在原始图像中引入差异来人为扩大数据集，从而提高模型的性能和泛化能力（Aamir\
  \ et al., 2023）。常见的增强技术包括：用于模拟不同方向的旋转；用于解剖结构对称性的翻转；用于识别不同尺寸肿瘤的缩放；用于处理位置差异的平移；用于调整强度的修改，以适应\
  \ MRI 获取参数的变化；以及用于复制自然解剖畸变的弹性形变。这些方法结合跨模态像素强度的归一化，提供了稳健的特征学习并减少了过拟合（Aamir et al.,\
  \ 2022）。`BRATS2017`数据集与数据增强的结合，为训练复杂的脑肿瘤分割模型奠定了坚实的基础，改进了诊断、治疗计划和患者预后。\n\n## 基于融合的特征提取\n\
  \n为了从分割图像中提取特征向量，此阶段融合两个特征提取器。在 `Xception` 模型中，深度分离卷积取代了分离卷积（M. T. Aziz et. al,\
  \ 2023）。名为 `Xception` 的 `Inception` 架构“极端”版本在 `ImageNet` 数据上的表现优于 `InceptionV3`，在包含\
  \ 17,000 类的巨大数据集上显著优于后者。深度分离卷积所需的计算量比分离卷积少。因此，`Xception` 的参数比其他 `CNN` 变体少。使用的深度\
  \ 2D 卷积占内存更少，运行速度比标准 2D 卷积慢。值得注意的是，它在与 `Inception` 相似的模型参数下实现了卓越的计算性能。初始函数后是否存在非线性：`Inception`\
  \ 架构通过压缩和过滤输入空间提出了非线性建议；但 `Xception` 则没有。\n\n在这项工作中，使用 `ResNet18` 版本进行深度特征提取。它包含\
  \ 18 层。`ResNet18` 架构拥有 11,511,784 个可训练参数，首先在 `ImageNet` 数据集中的千类数据上进行预训练。启用大量的卷积层是要目标。网络性能会因为消失问题而恶化或饱和。当层数更多时，由于梯度消失会导致网络性能下降，且相乘产生的梯度比前一个更小。为了解决梯度消失问题，本文提出了名为“跳跃连接”（skip\
  \ connection）的新颖观点。通过利用上一层的激活，跳跃连接解决了梯度消失问题。通过压缩网络，跳跃连接使网络比以前更快地学习。\n\n## 基于 GRU\
  \ 的分类\n\n最后，使用 `GRU` 技术对图像进行分类。`GRU` 网络在保持质量的同时重建了 `LSTM` 模块（Obayya, M et. al, 2023）。重置门\
  \ (`JT`) 和更新门 (`BT`) 是每个 `GRU` 单元中发现的两个不同门。`GRU` 结构如图图 4 所示。\n\n## GRU 框架\n\n在提取重要特征后，我们将特殊的\
  \ `RNN` 类型 `GRU` 应用于时间分析。由于其训练更快、架构更简单，`GRU` 优于其他 `RNNs`。这些元素对于控制信息流至关重要。遗忘门选择哪些信息应该被删除，而输入门选择保留哪些输入。`GRU`\
  \ 对于许多自然语言处理 (`NLP`) 任务至关重要，包括语音识别、机器翻译和语言建模。这使得模型能够准确地识别和分类脑肿瘤。\n\n\n\n\n在达到最大迭代次数或答案收敛到理想值之前，该迭代过程将持续进行。除了提高算法的探索与开发能力外，混合策略还通过避免停滞确保了更快的收敛速度。全局最优位置代表了问题的最优解，是最终结果。由于\
  \ `Hybrid WOA_APSO Algorithm` 具有强大的适应性，已被用于解决许多现实问题，包括生物医学图像处理、资源分配、特征选择和路径规划。因为它能够在保持适应性的同时平衡探索与开发，因此成为解决多个领域中复杂优化问题的有效工具。\n\
  \n# Hybrid WOA_APSO Algorithm\n\n1. 初始化座须鲸群 `Yi = (1, 2, ..., n)`，令 `i = 1`。\n2.\
  \ 为每个 `Yi` 计算适应度函数 `Fit_ob`。\n3. `while (i < maximum number of iterations) do`\n\
  4. `for each search agent do`\n5. 更新参数 `b`、`P`、`L` 和 `m`。\n6. `if (m < 0.5) then`\n\
  7. `if (|P| < 1) then`\n8. 使用 `E→=|L→⋅y→*(ⅈ)-y→(ⅈ)|` 修改当前搜索代理的位置。\n9. `else if (|P|\
  \ > 1) then`\n10. 选择一个随机搜索代理 `(Y_random)`。\n11. 使用 `E→=|L→⋅y→*(ⅈ)-y→(ⅈ)|` 修改当前搜索代理的位置（注：逻辑根据语境推断）。\n\
  12. 搜索全局最优位置。\n13. `else if (m > 0.5) then`\n14. 使用 `b=1` 更新当前搜索代理的位置。\n15. 使用 `b=2`\
  \ 替换全局最优位置。\n16. `end`\n17. `end`\n18. `end`\n19. 使用 `Y*` 更新最优位置。\n20. `i = i+1`\n\
  21. `end`\n\n# RESULTS AND DISCUSSIONS\n\n混淆矩阵将预测分为四类，如图 `Figure 3` 所示。当预测和实际结果均为正值时，被称为\
  \ `TP`；当预测为负值但实际结果为正值时，被称为 `FP`。\n\n损失曲线如图 `Figure 4` 所示，展示了训练和验证阶段损失与训练轮数（epochs）之间的关系。图表描述了训练损失（蓝色表示）和验证损失（红色表示）。两条曲线均显示随着训练的进行，损失持续且逐渐下降。初始损失值约为\
  \ `2.305`，到第 25 个 epoch 结束时，损失减少到约 `2.245`。注意的是，训练和验证曲线在整个过程中保持紧密对齐。这种紧密对齐是模型对未见数据良好泛化能力的积极指示，表明过拟合情况极小。\n\
  \n此外，损失随 epoch 增加而平滑且平行的下降，凸显了稳定且有效的学习过程。这种稳定的减少表明优化算法运行符合预期，每次迭代都在逐步减少误差。\n\n准确率（accuracy）、精确率（precision）、召回率（recall）和\
  \ `F1-score` 是用于评估性能的指标之一。准确率如图 `Figure 5` 所示。将预测分为四个去标识化类别的混淆矩阵如图 `Figure 6` 所示。\n\
  \n特异性（specificity）如图 `Figure 7` 所示。\n\n```\nAccuracy = (TP + TN) / (TP + TN + FP\
  \ + FN)\nSpecificity = (TN) / (TN + FP)\nPrecision = TP / (TP + FP)\nRecall = TP\
  \ / (TP + FN)\nF1-score = 2 * (Precision * Recall) / (Precision + Recall)\n```\n\
  \n灵敏度（sensitivity）如图 `Figure 7` 所示。\n\n不同模型性能的比较表明所提策略带来了显著改进，该策略在准确率方面优于所有其他策略，如图\
  \ `Figure 7` 所示。\n\n\n\n\n以 88.4% 的惊人准确率，所提方法在比较中优于所有其他模型。这一结果证明了所提工作中提出的进展——无论是通过增强的特征提取方法、复杂的架构设计还是训练策略优化——是多么有效。所提方法在相对于基准模型和注意力增强模型之上的稳定提升，证明了其在识别复杂模式和获得卓越性能方面的韧性和可靠性。\n\
  \n总之，所提方法不仅性能优于传统模型和注意力增强模型，还展现了其作为前沿解决方案的潜力。准确率的显著提升，进一步支持了其在准确性和可靠性至关重要的现实世界应用中的适用性。\n\
  \n## 5. 结论与未来工作\n\n本文引入了一种名为 `HBDL-FBTA` 的独特自动化生物医学图像分类系统（全称为“融合脑瘤分析的混合生物启发深度学习”）。`HBDL-FBTA`\
  \ 算法的主要目标是高效评估生物图像，以进行疾病的检测和分类。这种详尽的方法结合了许多复杂的计算阶段，确保了生物图像分类的高效率和高精度。\n\n`HBDL-FBTA`\
  \ 方法包含一系列协同工作的功能性阶段，以实现其目标。利用预处理阶段来提高图像质量并减少噪声，这对于精确分析至关重要。随其后的是基于 `Swin-UNet` 的分割技术，该技术利用尖端的深度学习\
  \ (`DL`) 架构来精确勾勒生物医学图像中的感兴趣区域。采用了一种基于融合的特征提取模块来整合多种特征类型，便于从分割后的图像中提取稳健且差异化的特征。随后，采用了一种基于模拟退火的驼背鲸优化算法（`HSSA`）的参数调优机制，以增强分类模型的参数并提高性能。采用了一种基于门控循环单元（`GRU`）的分类模型来评估提取的特征并以极高的可靠性对生物图像进行分类。\n\
  \n为了评估 `HBDL-FBTA` 系统的效能，利用两个基准数据集进行了全面的模拟：`BraTS2017`，该数据集被广泛应用于皮肤科和生物医学图像分析研究。模拟结果表明，与传统的深度学习方法相比，所提的\
  \ `HBDL-FBTA` 方法具有更高的效能。该模型在 `ISIC 2017` 数据集上达到了 94.51% 的最高分类准确率，在 `ISIC 2020` 数据集上达到了\
  \ 95.38%，说明了其精确诊断疾病的能力。`HBDL-FBTA` 技术的未来研究和开发前景广阔。一个关键方面是评估模型在大规模实时数据集上的计算复杂度，这可能为其在实际应用中的可扩展性和效率提供见解。此外，后续研究可以调查来自多种成像模态的数据（包括\
  \ `MRI`、`CT` 和 `X-ray`），以提高分类任务的精确可靠性。这种多模态策略对于在复杂情况下提高诊断准确性具有巨大潜力。此外，旨在创建可解释深度学习模型（例如生成显著性图或视觉解释的方法）可能会提高透明度，培养信任，并加速这些自动化系统在医疗保健领域的临床整合。\n\
