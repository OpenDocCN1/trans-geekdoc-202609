  \ | :--- | :--- | :--- | :--- |\n| 高斯噪声 | $\\sigma = 15$ | 30.45 | 32.12 | 29.80\
  \ | 31.34 | 33.45 |\n| | $\\sigma = 25$ | 27.98 | 29.45 | 26.84 | 28.77 | 31.12\
  \ |\n| 盐噪声 | 10% 损坏 | 28.45 | 30.56 | 27.12 | 29.01 | 32.21 |\n| | 20% 损坏 | 25.10\
