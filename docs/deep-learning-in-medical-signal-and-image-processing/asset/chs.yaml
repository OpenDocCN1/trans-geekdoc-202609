  \n### 图 9. (a) 中心聚焦，(b) 边缘聚焦，(c) `PCA`((d) `DWT`((e) `NSST-PCNN`((f) `CNN-AD`\n\n\
  ![](img/979-8-3693-9816-6.ch001.f09.png)\n\n### 图 10. (a) CT 图像，(b) MRI 图像，(c) `PCA`((d)\
  \ `DWT`((e) `NSST-PCNN`((f) `CNN-AD`\n\n![](img/979-8-3693-9816-6.ch001.f10.png)\n\
  \n### 图 11. (a) CT 图像，(b) MRI 图像，(c) `PCA`((d) `DWT`((e) `NSST-PCNN`((f) `CNN-AD`\n\
  \n![](img/979-8-3693-9816-6.ch001.f11.png)\n\n从图 8 中可以看出，`PCA` 的性能较差，因为它是一种空间技术，因此无法捕捉光谱信息。`DWT`\
  \ 产生的结果比 `PCA` 好，但其质量并不尽如人意，因为 `DWT` 使用了平移不变性，导致融合照片出现退化。`NSST-PCNN` 的质量优于 `PCA`\
  \ 和 `DWT`，因为它使用了混合方法，有助于捕捉更多信息。`CNN-AD` 产生的融合图像生艳且噪声较少。此外，它包含比其他方法更丰富的信息。\n\n从图\
  \ 9 中观察到，`PCA` 方法的性能很差，融合图中引入了噪声。`DWT` 的结果比 `PCA` 好，但融合图像比较模糊。`NSST-PCNN` 和 `CNN-AD`\
  \ 的质量看起来相似，但 `CNN-AD` 方法的对比度略好。\n\n从图 10 中可以看出，`PCA` 生成的融合照片有噪声。`DWT` 方法由于方向信息有限，也存在伪影和像素不连续。\n\
  \nCNN-AD` 获取的图像具有更好的视觉效果，但光照不均匀，导致融合图像丢失了一些关键信息。`NSST-PCNN` 具有鲜艳的对比度和高分辨率。此外，它更精确地捕捉了平滑的边缘和轮廓。\n\
  \n从图 11 中观察到`PCA` 和 `DWT` 的质量相似，结果满意。然而，融合图像的对比度不够明显，导致某些信息的丢失。`NSST-PCNN` 的融合性能较弱，因为细节不清晰且丢失了大部分信息。`CNN-AD`\
  \ 的融合结果更好，对比度和纹理信息更好。\n\n### 表 1. 所有 IF 方法定量参数的平均值\n\n| 方法 | `PCA` | `DWT` | `NSST-PCNN`\
