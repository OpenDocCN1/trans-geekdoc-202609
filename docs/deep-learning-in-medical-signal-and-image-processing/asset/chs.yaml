  \ 52(2), 487–499.\n\n# 第 7 章：注意力驱动的特征融合协同 ViT 与 CNN 架构用于脑瘤分类\n\nV. Vanitha (Sri\
  \ Ramachandra 工程技术学院，印度), Akshaya Vajpeyarr (新加坡国立大学), Arneshwar Sivakumar (爱丁堡大学，印度提鲁普尔)\n\
  \n### 摘要\n\n脑瘤分类成为诊断领域的一个重要问题。在研究中，我们提出了一种结合了 `CNN` 和 `Vit` 架构的模型，并结合基于注意力的融合机制来改进\
  \ MRI 数据分类。该模型成功整合了卷积神经网络 (`CNN`) 捕捉局部特征的能力以及视觉 Transformer (`Vit`) 捕捉全局上下文信息的能力。使用\
  \ `DenseNet-201` 进行多尺度特征提取，然后进行标记化和嵌入变换以输入 `Vit`。基于注意力的特征融合使得网络能够动态整合不同粒度的特征，并增强模型对高级胶质瘤\
  \ (`HGG`)、低级胶质瘤 (`LGG`) 和非肿瘤区域的分类能力。\n\n### 1 引言\n\n脑瘤分类对于制定治疗方案、改善患者预后以及实施更具针对性的治疗至关重要。由于肿瘤的复杂性和多样性，准确识别肿瘤类型具有挑战性。MRI\
  \ 等先进成像技术提供了肿瘤结构、位置和特征的详细见解，为可靠的分类方法奠定了基础，如图 1 所示。\n\n\n\n\n\n# 图 1. 带标注的不同肿瘤类型：第\
  \ 1 行胶质母细胞瘤，第 2 行低级胶质瘤，第 3 行脑膜瘤，第 4 行转移瘤\n\n![](img/979-8-3693-9816-6.ch007.f01.png)\n\
  \n这种多样性使得后续的准确诊断和治疗计划变得复杂。对于临床医生而言，能够区分不同的肿瘤类型、胶质瘤、脑膜瘤和转移性病变至关重要。这些肿瘤的分类非常关键（Rao\
  \ & Karunakara, 2021），因为患者管理是基于表 I 所示的生物学行为、治疗方案和预后的。然而，完全或主要依赖于放射科医生的专业知识的传统诊断方法会带来局限性，在最好的情况下也存在主观解释和观察者之间的差异。因此，在这些限制范围内，先进的人工智能技术提供了巨大的潜力。\n\
  \n# 表 1. 主要脑肿瘤类型的特征与治疗方法\n\n| 肿瘤类型 | 生物行为 | 治疗方案 | 预后 |\n| --- | --- | --- | ---\
  \ |\n| 胶质瘤 | 起于胶质细胞；可能具有高度侵袭性，经常浸润周围脑组织。 | 根据肿瘤的分级和位置，术后进行放射和化疗。 | 差异很大；高级胶质瘤（如胶质母细胞瘤）预后通常较差，而低级胶质瘤的效果较好。\
  \ |\n| 脑膜瘤 | 通常生长缓慢且良性；起源于脑膜（脑和脊髓的衬层）。 | 对于小型、无症状病例进行观察；有症状的肿瘤进行手术；如果手术不可行则放射治疗。\
  \ | 通常良好；通过手术通常可以治愈；存在复发风险，特别是在非典型或恶性脑膜瘤中。 |\n| 转移性病变 | 从其他器官（如肺、乳腺）的原发癌症扩散形成的继发性肿瘤。\
  \ |治疗取决于原发癌类型；包括手术、放射、化疗和靶向治疗。 | 预后根据原发癌类型和阶段差异很大；通常与更晚期的疾病和更短的生存期有关。 |\n\n人工智能（AI）正在彻底改变医学领域。它在提高各个医学专业的诊断准确性、速度和便利性方面具有巨大潜力。AI\
  \ 越来越多地整合到放射学、病理学和其他领域，以帮助疾病早期检测分期、疾病进展评估和手术规划。其主要优势之一在于协助基于复杂数据进行诊断，这有助于医疗专业人员识别人类难以检测的复杂模式（He\
  \ et al., 2023）。\n\n人工智能的一个重要用途是在早期识别和评估癌症、心血管疾病和神经系统疾病等状况。例如，在肿瘤学中，AI 算法被用于肿瘤的界定、肿瘤分级以及对治疗反应的评估（Khan,\
  \ Nasim, Ahmad, & Masood, 2024）。同样，AI 辅助图像分析在神经病学中的阿尔茨海默病、多发性硬化和脑肿瘤等疾病中起着重要的作用。AI\
  \ 系统设计用于极高精度地解释 MRI、计算机断层扫描 (CT) 和其他成像模式，帮助放射科医生识别感兴趣区域，并最大限度地减少诊断差异。\n\n尽管 AI 目前侧于诊断，但它在治疗和进展跟踪方面也具有巨大潜力。在癌症放射治疗中，准确识别肿瘤边界对于优化治疗效果和保护健康组织至关重要。先进的分割深度学习算法增强了肿瘤边界检测的精度，支持临床医生设计更有效的治疗策略。\n\
  \n## 1.1 基于 AI 的分类挑战\n\n使用 AI 技术进行分类由于肿瘤类型的多样性、脑解剖结构的复杂性以及成像技术的差异而面临挑战。肿瘤被分为原发性或继发性。继发性肿瘤从身体其他部位转移到大脑，这些肿瘤在外观、大小和行为上表现出巨大的异质性，早期肿瘤与正常组织相似。图\
  \ 2 显示了基于 AI 分分类的各项挑战及其相关因素。\n\n## 图 2. 基于 AI 的肿瘤分类的挑战\n\n![](img/979-8-3693-9816-6.ch007.f02.png)\n\
  \n分类因脑结构而进一步复杂；由于许多区域之间只有细微差别，使得很难区分正常组织的结束和异常组织的开始。此外，获取的序列差异也影响了模型的发展，因为每个序列都包含了肿瘤的关键信息。例如，某些肿瘤需要对比增强\
  \ MRI 进行分级评估，而其他肿瘤需要 fMRI 来了解其对大脑的影响（Zhang, Xu, Tian, Jiang, & Ma, 2021）。其他障碍是数据限制。分类需要大量的标注数据集；但由于获取专家标注的过程繁琐且昂贵，这些数据非常稀缺。这种稀缺性导致\
  \ AI 模型泛化能力不佳，并引入了偏见的可能性。\n\n\n\n\n尽管受到 transformer 架构的挑战，`CNN` 架构在特征提取和模式确定过程中仍然占据主导地位。以这种分层设计为核心，利用卷积和池化操作的力量，它们在识别局部空间层次的缩放模式以及检测图像中复杂特征方面，继续在该领域内优于其他方法。在最近的研究中，对此类通用\
  \ `CNN` 结构的改进（如空洞卷积、`SE blocks` 和归一化层）已适用于现代深度学习生态系统。\n\n目前的研究方向正逐渐转向 `ViT` 与 `CNNs`\
  \ 的结合架构，这两者可以互补。研究人员正在探索融合技术，使局部特征提取和上下文感知产生相互作用。这些混合模型的目标是克服单一架构的局限性，建立更稳健、更灵活的神经网络。它们的设计允许模型在医疗诊断和感知系统等不同领域中应对日益复杂的视觉识别挑战。\n\
  \n## 1.3 特征融合：概念与技术\n\n特征融合是一种广泛使用的技术，通过整合来自多个源或多种表示的数据来增强模型性能。在这种情况下，通过利用互补信息来构建更信息丰富的表示，可以提高预测所需的稳健性和准确性\
  \ (Kittler, Hatef, Duin, & Matas, 1998)）。早期融合、后期融合和混合融合是特征融合的几种类型。\n\n早期融合发生在特征级，多个特征在传递给模型之前会被组合。在这种情况下，模型通过从组合数据开始学习过程而获益。例如，在医学影像应用中，早期融合可能涉及\
  \ `MRI` 和 `CT` 健康特征表示的融合 (Li, Jiang, Zhang, & Zhu, 2023)）。另一方面，后期融合发生在模型在不同特征上开发和训练之后，而早期融合发生在模型构建之前。每个模型提供类别的概率，这些概率通过平均、投票或堆叠等方式进行组合。后期融合允许模型专注于各种特征专门化，但缺乏一种优化利用从原始数据中派出的所有互补信息的方法\
  \ (Ahmed, Dada, & Samaila, 2023)。\n\n早期融合和后期融合可以混合，以在建模阶段的不同阶段整合特征。这种方法对于复杂任务是有利的，例如脑肿瘤分类，因为这种任务既需要高层也需要低层特征\
  \ (Xie et al., 2022; Batool & Byun, 2024)。通过策略融合方法，模型可以在更具挑战性的领域中提取更丰富的特征集，从而提高它们的预测准确率。\n\
  \n## 1.4 特征融合：医学影像分析中架构能力的协同\n\n通过特征融合结合 `CNN` 和 `ViT` 为解决医学影像分析中各自的缺点提供了一种可能的解决方案。`CNNs`\
  \ 针对采用局部细节的空间组织进行了优化，因此对于识别纹理或病变等细微细节有用。相反，`ViTs` 擅长利用自注意力机制对全局依赖进行建模，使其能够理解跨越图像的更广泛上下文关系。\n\
  \n待诊断的患者医学影像（包括 `MRI`、`CT`、病理组织图像）需要局部线索也需要全局上下文线索。`CNN` 和 `ViT` 架构的特征融合结合了这些优势，增强了特征提取和解释，这对于肿瘤定位和异常检测等任务特别有用。\n\
  \n整合 `CNN` 和 `ViT` 的益处包括诊断准确性的提高、跨数据集的泛化能力增强以及复杂模型过拟合风险的降低。特征融合的主要优势包括：\n\n*   **互补信息**：不同的模型擅长捕捉不同类型的信息。`CNNs`\
  \ 有效提取局部特征，而 `ViTs` 能很好地建模依赖。这些互补特征提供了更完整的解释。\n*   **减少过拟合**：特征融合可以减少过拟合，这是在使用深度学习算法时经常出现的问题。通过整合来自所有源的特征，模型变得更加稳健。\n\
  *   **增强性能**：特征融合持续提高深度学习算法的性能。通过利用各种架构的优势，模型可以获得更高的准确性和特异性。\n*   **提高可解释性**：它还可以增强深度学习模型的可解释性。通过融合特征的可视化，可以更好地理解模型是如何得出结论的，哪些方面起了关键作用。\n\
  \n## 2 文献综述\n\n由于深度学习技术的发展，脑肿瘤分类近年来受到了广泛关注。本节分析了包括 `CNNs`、迁移学习、视觉 Transformer 和混合模型在内的多种方法。\n\
  \nAamir 等人 (2022) 提出了一种多尺度 `CNN` 框架以及数据增强和滑动窗口测试来减少偏差并防止过拟合。Khan 等人 (2020) 利用深度学习开发了一种自动\
  \ `MM-Brain Tumor` 分类器，其中 `VGG16` 和 `VGG19` 架构用于精确特征选择。应用对比度拉以增强肿瘤的可视性，并进行了特征选择以减少计算负载。然而，该研究面临许多挑战，包括某些类型肿瘤结构的高度相似性、`T1`\
  \ 加权图像低对比度对特征提取的影响，以及多模态分类的内在复杂性。\n\n\n\n\nAri and Hanbay (2018) 提出了一种具有局部感受野的极端学习机\
  \ (`ELM-LRF`) 用于将 MR 图像分类为良性或恶性。主要的局限性是数据集较小，仅包含 16 名患者的图像。Srinivas et al. (2022)\
  \ 作者们讨论了深度迁移学习技术在基于 MR 图像的脑肿瘤分类中的应用。在对数据进行强度归一化和尺寸调整后，`VGG-16` 取得了最佳性能结果。Badjie\
  \ and Ülker (2022) 开发了一种基于深度学习的架构，利用预训练网络并对其进行微调以进行肿瘤分类，从而有效检测和区分 MRI 扫描中的各种肿瘤类型。\n\
  \nMehrotra et al. (2020) 评估了多种模型，包括 `AlexNet`、`GoogLeNet`、`ResNet 50`、`ResNet 101`\
  \ 和 `SqueezeNet`。然而，他们仅使用了 696 个 MRI 图像样本，这在大规模应用中可能无法良好泛化。Hao 等 (18) 引入了一种创新的主动学习框架，利用迁移学习来最小化标注成本。该性能结果在测试集上的\
  \ `AUC` 达到 82.89%，且通过数据增强，所有标注成本降低了 40% 以上。\n\nAli (2023) 引入了 `ViT-BT`，一种基于 Vision\
  \ Transformer 的用于脑肿瘤分类的模型。`ViT-BT` 框架通过首先预训练 Vision Transformer 模型，然后使用专门的 MRI 脑肿瘤数据集进行微调，提升了分类性能，准确率达到\
  \ 98%。Reddy et al. (2024) 实现了一种 vision transformer 变体，用于从 MRI 扫描图像中自动分类多类脑肿瘤。该研究比较了多个预训练模型，其中\
  \ `FTVT-l16` 模型表现最佳，测试准确率达到 98.70%。\n\nTummala et al. (2022) 提出了一种用于肿瘤分类的 `ViT`\
  \ 模型集成方法。在 `ImageNet` 上预训练的 `ViT` 模型经过微调后被用于分类任务。所提出的模型实现了 98.7% 的准确率。Goceri (2023)\
  \ 利用 `CNN` 和 `ViT` 的优势，通过有效整合特征组合模块开发了一种用于胶质瘤分类的新型架构。实验结果证明了该方法在从病理学图像分类四种胶质瘤亚型方面的有效性，准确率达到\
  \ 96.75%。\n\nKaragoz et al. (2024) 引入了一种自监督技术来解决数据集可用性有限的问题。双 `CNN` & Vision Transformer\
  \ 方法经过预训练和微调。使用合成 MRI 图像通过增强来平衡数据集，从而提高分类效率并减少过拟合。该模型展示了良好的性能以及对其他数据库的泛化能力，但假图像的使用表明，生成的合成图像可能存在某些偏差。\n\
  \nAsiri et al. (2023) 引入了 `FT-ViT` 模型，这是一种利用图像处理和深度学习技术分类肿瘤的微调 Vision Transformer。该框架包含多个阶段，包括数据预处理、块提取、特征拼接、选择、学习和微调。在包含\
  \ 5,712 张脑肿瘤图像的 `CE-MRI` 数据集上训练，`FT-ViT` 实现了 98.13% 的准确率。`DeepTumorNet` (Asiri et\
  \ al., 2023) 是一种用于脑肿瘤分类的混合深度学习模型。该架构了改进的 `GoogLeNet` 和 `leaky ReLU` 激活函数。结果显示，该模型优于相当的方法，实现了\
  \ 99.67% 的准确率和 100% 的召回率。\n\nVimala et al. (2023) 利用 `EfficientNets` 进行分类并使用 `Grad-CAM`\
  \ 微调以提高可解释性。Dixon 等 (2024) 提出了一种结合 `ViT` 和 `CNN` 的混合架构以实现稳健分类。Aloraini 等. (2023)\
  \ 在 `BraTS` 上展示了 96.75% 在 `Figshare` 上展示了 99.10% 的准确率。通过交叉融合策略整合局部特征以增强准确性。轻量级 `iResNet`\
  \ 架构优于其他 `CNN` 变体，达到了 99.30%。文献综述表明，脑肿瘤分类存在改进空间 (Verma et al., 2023; Garg et al.,\
  \ 2024)，但这些研究存在一些问题。一个共同问题是数据集有限或不平衡，如 Ari and Hanbay (2018) 所述，Mehrotra 等 (2020)\
  \ 也是。这些限制损害了模型的迁移性和可靠性，特别是在使用多种患者组和成像方法的临床实践中。此外，如 Karagoz, Nalbant, & Fox (2024)\
  \ 那样包含合成数据可能会引入一些偏差。虽然合成数据是有益的，因为它可以减少小数据集的影响；但它并不总是反映现实情况，因此模型在测试其他数据集时效率会下降。\n\
  \n计算和训练方面也存在重大问题。(Reddy et al., 2024); Tummala et al., 2022)) 的方法在预训练和微调需要大量的计算资源，因此在资源受限的环境下并不实际可行。此外，许多混合模型如\
  \ `DeepTumorNet` 由于参数高度微调且数据量有限，容易产生过拟合。这可能会降低模型对其他数据集或其他临床应用的泛化能力。\n\n\n\n\n\n\
  文献强调了特征提取中的一些主要困难，这些困难直接影响了脑肿瘤分类中所用模型的性能和效能。主要挑战之一是不同类型肿瘤的结构之间差异并不显著，这为模型很好地区分它们之间带来了挑战。此外，T1\
  \ 加权图像中的低对比度是一个重大的障碍，因为它阻碍了准确分类所需的意义特征的提取。多模态分类本质上也是困难的，因为源自各种成像模态的信息必须由模型进行组合和解释。上述挑战意味着，当模型用于实际临床实践时，更容易发生误分类错误。这凸显了开发复杂的特征提取方法和可靠的数据融合方法的必要性。\n\
  \n这项工作展示了迁移学习（TF）、视觉 Transformer（ViT）以及 ViT-CNN 集成模型在脑肿瘤分类中的潜力和局限性。TF 模型通常从 `VGG16`\
  \ 或 `ResNet` 开始，在特征提取方面表现良好，但在图像集大小较小或不平衡时，无法有效识别肿瘤特征。研究发现，使用 `ViTs` 适用于大量数据并可获得高准确率，但会消耗大量的计算资源且无法捕捉局部细节。`ViT-CNN`\
  \ 混合模型的性能优于 `ViT` 和 `CNN` 方法；然而，它们较为复杂，并且在小数据集上可能会过拟合。\n\n## 3 脑肿瘤分类中实现方法的审查\n\n\
  ### 3.1 DenseNet-210\n\n对于所提的混合模型，`DenseNet-201` 作为主要的 `CNN` 架构。图 3 展示了 `DenseNet-20`\
  \ 的详细结构。`DenseNet-201` 最显著的特征是连接性，这意味着将前一层的特征与所有后续层进行拼接。这种连接结构增强了信息流，使得 `DenseNet-201`\
  \ 适用于在不同应用中提取复杂特征。令 `x[0]` 代表网络的输入，`f[1]``,`f[2]``,`f[3]`、…`f[l-1]``,`f[L]` 表示稠密块中\
  \ `L` 层中每一层的输出。第 `l` 层的输入是较早层的组合输出：\n\n```\nf[l]=H([x[0,] f[1],f[2],f[3],…f[l-1]])\n\
  ```\n\n其中 `H(⋅)` 表示应用于层 `l` 的复合函数，它通常包括 `Batch Normalization`（批归一化）、`ReLU` 激活和卷积操作。\n\
  \n#### 图 3 DenseNet-201 的架构\n\n![](img/979-8-3693-9816-6.ch007.f03.png)\n\n`DenseNet`\
  \ 的结构由稠密块和过渡层组成。稠密块包含许多卷积层，每层通过稠密连接与其他所有层相连。在这种情况下，稠密块之间存在过渡层，有助于通过平均池化对特征图进行下采样。此外，增长率（决定了每层添加的新特征数量）保持在相对较低水平，以在保持模型性能的同时确保计算效率。\n\
  \n`DenseNet-201` 的特征输出通过一个具有两个全连接层的 `Multilayer Perceptron`，每层包含 512 个神经元。这些层之间穿插了\
  \ `BN`（批归一化）以增加学习过程的稳定性。使用 `Leaky ReLU` 作为激活函数，定义为：\n\n$$f\\\\left( z \\right) =\
  \ \\left\\\\{ \\\\begin{matrix} {z~z > 0} \\\\\\\\ {\\\\alpha z~z \\leq 0} \\\\\\\
  \\ \\\\end{matrix}\\\\right\\}$$\n\n`DenseNet` 的结构由稠密块和过渡层组成。稠密块包含许多卷积层，每层通过稠密连接与其他所有层相连。在这种情况下，稠密块之间存在过渡层，有助于通过平均池化对特征图进行下采样。此外，增长率（决定了每层添加的新特征数量）保持在相对较低水平，以在保持模型性能的同时确保计算效率。\n\
  \n`DenseNet-201` 的特征输出通过一个具有两个全连接层的 `Multilayer Perceptron`，每层包含 512 个神经元。这些层之间穿插了\
  \ `BN`（批归一化）以增加学习过程的稳定性。使用 `Leaky ReLU` 作为激活函数，定义为：\n\n$$f\\\\left( z \\right) =\
  \ \\left\\\\{ \\\\begin{matrix} {z~z > 0} \\\\\\\\ {\\\\alpha z~z \\leq 0} \\\\\\\
  \\ \\\\end{matrix}\\\\right\\}$$\n\n其中 `H(⋅)` 表示应用于层 `l` 的复合函数，它通常包括 `Batch Normalization`（批归一化）、`ReLU`\
  \ 激活和卷积。\n\n### 3.2 视觉 Transformer (Vision Transformer)\n\nVision Transformer 代表了从传统视觉范式到\
  \ Transformer 的转变。2020 年，Google Brain 的人员开发了 `ViT`，将自注意力机制应用于图像数据，突破了 `CNN` 的局限性。`ViT`\
  \ 在大规模图像分类中取得了显著结果，标志着研究进入了一个新时代。\n\n`ViT` 与 `CNN` 的根本区别在于它处理图像的方式具有全局感知能力。传统的 `CNN`\
  \ 通过分层提取更抽象的特征，而 `ViT` 类似于 `NLP` 模型将句子视为序列。在这一创新的方法中，输入图像被分割成图像块（patches）。每个图像块通过可学习层线性转换为一维向量。这些嵌入块有效地充当了\
  \ `Transformer` 处理的标记。\n\n脑肿瘤分类中 `ViT` 的关键组件如图所示](#979-8-3693-9816-6.ch007.bits-pdf.xhtml#_idTextAnchor416）是编码器，它构成了模型的基础。每个区块包含一个自注意力机制，以及带有残差连接和层归一化的前馈神经网络。自注意力机制自适应地评估块的依赖关系，关注图像的关键区域。这使得\
  \ `ViT` 能够学习远程上下文并捕捉全局信息，同时避免了传统 `CNN` 所需大量参数。\n\n#### 图 4 Vision Transformer 的架构\n\
  \n![](img/979-8-3693-9816-6.ch007.f04.png)\n\n为了保留图像的空间结构，`ViT` 在块嵌入上添加了可学习的位置嵌入。这是因为\
  \ Transformer 模型默认对顺序不敏感，本质上不理解标记布局。模型通过位置嵌入保留图像中每个块的位置。当与自注意力机制结合时，这些嵌入使得 `ViT`\
  \ 学习捕捉局部和全局空间结构，从而在学习空间模式方面表现更好。\n\n这一概念最初引入用于 `NLP` 任务的 `BERT` 模型，在 `ViT` 中作为整个图像的全局表示。随着图像被处理，`CLS`\
  \ 标记通过自注意力机制与所有其他块交互，收集代表图像整体内容的特征。一旦图像通过最后的 `Transformer` 编码器层，`CLS` 标记将被传递到线性分类层，用于生成模型的最终预测。\n\
  \n\n\n\n尽管具有这些优势，但 ViT 的计算复杂度是一个大问题。然而，自注意力机制非常消耗资源，其计算量随 patch（块）数量呈平方级增长，考虑到 ViT\
  \ 在高分辨率图像上表现良好，这一点尤为显著。模型需要计算所有 patch 之间的交互，导致内存和处理能力的平方级增长。然而，虽然在资源有限的环境下 ViT 需要这些高需求，但在实际中可能是不行的。为了应对这些挑战，研究人员开发了多种解决方案，包括稀疏自注意力以及这些分层\
  \ Transformer 架构，这些架构在降低计算成本的同时保持了强大的性能。\n\nVision Transformer（视觉 Transformer）的兴起导致了各种融合\
  \ CNN 和 Transformer 两个领域优势的混合架构的发展。如 Swin Transformer 和 DeiT（数据高效图像 Transformer）等模型将通过\
  \ CNN 结构实现的局部特征提取能力与 Transformer 的全局上下文感知能力相结合。传统模型提供区域拟合，使得混合模型适用于小数据集。例如，Swin\
  \ Transformer 模型利用分层结构化来处理不同分辨率的图像，在不损害准确性的情况下大幅降低了计算开销。这些改进有助于解决 ViT 的局限性，并使这些模型在现实应用中更具实用性。\n\
  \n## 4. 提出的方法\n\n本工作提出了一种具有新型基于注意力特征融合机制的混合架构，用于将 BRaTS 数据集的 MRI 图像分类为三类。\n\n本工作的贡献如下：\n\
  \n1. **1. 新型混合架构**：提出了一种整合 CNN 和 ViT 优势的混合框架。它旨在捕捉并整合图像的全局和局部信息。\n2. **2. 注意力驱动的特征融合模块**：提出了一种新的特征融合机制，该机制通过交叉注意力机制结合不同粒度的特征。这允许该模块通过交叉注意力机制无缝集成全局上下文模式与局部细节。这种动态融合过程在调整特征重要性的同时，增加了捕获信息的多样性，而不仅仅是包含其他特征。\n\
  \n所提方法由三个相互连接的组件组成，如图图 5\n\n1. **1. 基于 CNN 的多尺度特征提取**：该组件采用 `DenseNet-201` 在三个不同的空间尺度上生成特征图：粗粒度特征（全局结构模式）、中尺度特征（中间解剖细节）和细粒度特征（局部和纹理信息）。该模块通过跨尺度的特征提取产生详细且多样化的表示。\n\
  2. **2. ViT 特征精炼**：这些 Transformer 中的注意力机制通过上下文信息增强了 CNN 的特征，产生了结构化且高质量的特征图表示。\n\
  3. **3. 交叉注意力特征融合模型**：该机制实现了三个 ViT 的不同尺度特征图之间的交互，通过精炼优化特征图，并将整合结果合并为单个特征图。交叉注意力机制利用来自粗、中、细特征层的信息，产生一个专用于分类的统一多尺度表示。\n\
  \n接下来的章节将详细介绍该架构的每个组件，阐明其在整个系统中的架构和功能。\n\n### 4.1 基于 CNN 的多尺度特征提取\n\n`DenseNet-201`\
  \ 设计为在层之间具有密集连接。这种结构增强了反向传播过程中的梯度流并改进了特征重用。模型被组织成若干密集块（dense blocks），每个块在不同的抽象层次上提取特征。对于脑肿瘤分类，我们的目标是从这些块中提取精细、中等和粗粒度的特征，以捕捉脑图像中的各种空间模式和结构。\n\
  \n选择 `DenseNet-201` 作为 CNN 组件的原因如下：\n\n- **密集连接**：在每个密集块内部，每一层都利用了之前所有层的特征图。这种方法能够捕捉细微的特征。\n\
  - **特征保留**：与会遭受特征损失的传统 CNN 不同，`DenseNet-201` 在整个网络中维持并结合来自早期层的特征。这种特性对于医学影像中的诊断至关重要。\n\
  - **参数效率**：尽管其深度很大（201 层），`DenseNet-201` 实现了卓越的参数效率。这种密集连接减少了对冗余特征图的需求，产生了更紧凑的模型。\n\
  - **多尺度特征提取**：`DenseNet-201` 的架构天然支持多尺度特征提取。这种方法对于医学影像至关重要，因为肿瘤和病变状况以多种方式表现。\n\n\
  `DenseNet-201` 凭借其密集连接、参数效率和多尺度特征提取能力，提供了高质量的分层特征图，适用于混合 CNN-ViT 架构。结合 Vision Transformer\
  \ 的长距离依赖建模，这种设置利用了两种范式的优势，对于脑肿瘤分类等挑战性任务非常有效。\n\n\n\n\n其中 `f[block]` 指在 Dense Block\
  \ 2 中执行的操作，包括额外的卷积层和批归一化。生成的输出 `F[medium]` 包含中等尺度特征，这些特征抽象了精细的细节，并开始捕捉较大的解剖结构。这些中等特征对于识别中间肿瘤特征以及跨越图像中较小区域的结构至关重要。此外，这些特征还可以帮助检测不同脑区域之间的关系，这对于准确诊断肿瘤非常重要。\n\
  \n## 粗粒特征提取（Dense Block 3）\n\nDense Block 3 捕捉粗粒特征，这些特征代表了特征提取过程中最高层次的抽象。这些粗粒特征是全局性的、大规模模式，包含了重要的结构，例如整个肿瘤或其他更广泛的脑区域。来自\
  \ Dense Block 2 的输出 `F[medium]` 被传递到 Dense Block 3 进行进一步处理。从 Dense Block 2 到 Dense\
  \ Block 3 的数学转换表示为：\n\n```\nF[coarse]=fblock (5)\n```\n\n其中 `f[block]` 代表 Dense\
  \ Block 3 中的操作，包括进一步的卷积和批归一化。生成的输出 `F[coarse]` 包含粗粒特征，它们经过抽象后提供了对脑结构的全局理解。这些粗粒特征对于识别整个肿瘤区域、其大小以及与大脑与其他部分的关系至关重要。粗粒特征为模型提供了关于肿瘤在脑内位置的上下文，这对于做出最终分类决策至关重要。\n\
  \n表 II 总结了输入尺寸为 240×240×4 时 DenseNet-201 架构不同阶段的输出维度。在经过第一个卷积层和池化层后，空间维度减半。初始卷积和池化后的输出尺寸为\
  \ 120×120×64，其中 64 是滤波器/通道数。这作为第一个密集块的输入。\n\n### 表 2.DenseNet-201 各阶段的特征图维度\n\n\
  | 阶段 | 空间尺寸 | 通道数 |\n| --- | --- | --- |\n| 初始输入 | 120×120 | 64 |\n| Dense Block\
  \ 1 后 | 120×120 | 92 |\n| Transition 1 后 | 60×60 | 128 |\n| Dense Block 2 后 | 60×60\
  \ | 384 |\n| Transition 2 后 | 30×30 | 256 |\n| Dense Block 3 后 | 30×30 | 1792 |\n\
  \n## 4.2 ViT 特征精炼\n\n卷积神经网络（CNN）与视觉 Transformer（ViT）的结合代表了现代计算机视觉架构中的一项关键计算挑战。这种转换需要一种复杂的方法将分层特征图转换为与基于\
  \ Transformer 模型兼容的标记化格式。本节提出了一种此类转换的系统方法，重点关注处理多个粒粒度的特征，以实现分层表示学习。\n\n### 4.2.1\
  \ 特征图转换的数学公式\n\n令 CNN 在粒度层级 `g` {fine, medium, coarse} 提取的特征图表示为 `F[g]`，其数学表示为：\n\
  \n```\nF[g] ∈ R^(w[g] × H[g] × c[g]) (6)\n```\n\n其中 `H` 代表高度，`W` 代表宽度，`C` 代表特征图的通道数。ViT\
  \ 需要标记化的输入，每个标记对应一个固定长度的向量。这使得：\n\n1. 将空间维度高度 `H[g]` 和宽度 `W[g]` 展平为单一维度。\n2. 将生成的标记投影到维度为\
  \ `d` 的嵌入空间，以符合 ViT 的输入规范。\n\n### 4.2.2 标记化与嵌入转换\n\n标记化和嵌入转换是将图像数据转换为适用于 Transformer\
  \ 架构处理格式的关键步骤。该过程中涉及的步骤详细如下。\n\n#### 4.2.2.1 展平 CNN 特征图。\n\n将空间维度 `H[g]×W[g]` 展平，将特征图\
  \ `F[g]` 转换为矩阵 `F[g]^(f**l**a**t)` `(f**l**a**t*)` 如：\n\n```\nF[g] ∈ R^(w[g] × H[g]\
  \ × c[g]) (7)\n```\n\n对于特征图 `F[g]∈R^(64×16×16)`，展平产生 `F[g]^(flat)∈R^(256×64)`（即\
  \ 256 个标记，每个维度为 64）。\n\n#### 4.2.2.2 线性投影到嵌入空间。\n\n使用 (8) 给出的可学习线性投影矩阵 `W[g]^(p**r**o**j)`\
  \ 和偏置项 `b[g]^(p**r**o**j)` 将展平的特征图 `F[g]^(flat)` 投影到低维空间：\n\n```\nE[g] = F[g]^(flat)\
  \ ⋅ W[g]^(p**r**o**j) + b[g]^(p**r**o**j) (8)\n```\n\n其中 `W[g]^(p**r**o**j)∈R^(Cg×d)`：将\
  \ `C[g]` 维标记还原为 `d` 嵌入的线性投影矩阵。`b[g]^(p**r**o**j)∈R^d`：添加到每个标记的偏置项。生成的标记嵌入 `E[g]`\
  \ 给出：\n\n```\nE[g] ∈ R^(H[g].W[g]) (9)\n```\n\n#### 4.2.2.3 使用视觉 Transformer 处理标记化特征。\n\
  \n标记化嵌入 `E[g]` 通过专门的 ViT 块处理每个粒度 `g`：\n\n```\nF[g]' = ViT(E[g]) (10)\n```\n\n其中\
  \ `F[g]'` 表示精炼后的特征。每个 ViT 块由：\n- 用于捕捉远程依赖的多头自注意力 (`MHSA`)\n- 前馈层组成。\n\n独立处理 `E[g]`\
  \ 使模型能够为任务提取多尺度表示。\n\n## 4.3 交叉注意力特征融合\n\n提出的融合技术解决了整合多粒度特征表示的挑战。模型从不同层提取三个不同的特征图如图\
  \ 6 所示。\n\n### 图 6 使用 DenseNet-201 进行多尺度特征提取\n\n令 `F[1]'`、`F[2]'`、`F[3]'` 分别代表从粗、中、细层提取的特征图。经过标记化和嵌入转换具有不同的空间分辨率和语义粒度。为了有效融合，所有特征图都被投影到共同的特征维度\
  \ `d`：\n\n```\nF[i]' = W_i F_i + b_i (11)\n```\n\n其中 `W[i]∈R^(d×d')` 是可学习投影参数，`d'`\
  \ 是原始特征维度。\n\n#### 4.3.1 交叉注意力块\n\n为了融合信息，定义了三个交叉注意力块，每个特征图作为查询，另外两个作为键和值。交叉注意力特征融合如图\
  \ 7 所示。\n\n### 图 7 交叉注意力融合\n\n块 1：粗级特征 `F[1]'` 作为查询。\n`Q[1]=F[1]'W[Q], K[2]=F[2]'W[K],\
  \ V[2]=F[2]'W[V], K3=F[3]'W[K], V3=F[3]'W[V]`\n其中 `W[Q], W[k], W[v]∈R^(d×d')` 是查询、键和值的可学习投影矩阵。交叉注意力输出计算为：\n\
  \n```\nF[1]_out = Softmax(Q_1K_2^T/sqrt(d'))V_2 + Softmax(Q_1K_3^T/sqrt(d'))V_3\
  \ (12)\n```\n\n块 2：中级特征 `F[2]'` 作为查询。\n`Q[2]=F[2]'W[Q], K[1]=F[1]'W[K], V[1]=F[1]'W[V],\
  \ K3=F[3]'W[K], V3=F[3]'W[V]`\n\n```\nF[2]_out = Softmax(Q_2K_1^T/sqrt(d'))V_1 +\
  \ Softmax(Q_2K_3^T/sqrt(d'))V_3 (13)\n```\n\n块 3：细级特征 `F[3]'` 作为查询。\n\n\n\n\n\n\
  $Q[3]=F[3]′W[Q], K[1]=F[1]′W[K], V[1]=F[1]′W[V], K[2]= F[2]′W[K], V[3]=F[2]′W[V]$\n\
  \n$F3 =$\n\n$$Softmax\\left( \\frac{Q_{3}K_{1}^{T}}{\\sqrt{d^{'}}} \\right) V_{1~}\
  \ + Softmax\\left( \\frac{Q_{3}K_{2}^{T}}{\\sqrt{d^{'}}} \\right)$$\n\n$V[2]$ (14)\n\
  \n### 4.3.2 残差连接与归一化\n\n每个交叉注意力输出应用残差连接和层归一化，以稳定训练并增强特征表示，\n\n$Fi = LayerNorm (F[i]'+\
  \ Fi)$ (15)\n\n### 4.3.3 拼接与全连接融合\n\n将三个块的残差输出拼接在一起：\n\n$F[concat] = ConcatF[1 ,F2\
  \ ,F3]$ (16)\n\n拼接后的特征随后通过多层感知器生成最终的融合特征表示：\n\n$F[used] = MLP(F[concat])$ (17)\n\
  \n#### 算法：基于注意力的特征融合\n\n**输入：**\n* $F[1]''$, $F[2]'$, $F[3]'$：来自 ViT 在粗、中、细粒粒度上的特征图，大小分别为\
  \ $B\\times N \\timesd[1], B\\times N[2]\\timesd[2], B\\times N[3]\\timesd[3]$。\n\
  * $d'$：融合的共同特征维度。\n\n**输出：** $F[used]$：融合后的特征图。\n\n1. **初始化：**\n1.1. 定义投影矩阵 $W[1],\
  \ W[2], W[3] \\in R^{(d\\times d')}$。\n1.2. 定义偏置向量 $b[1], b[2], b[3] \\in Rd'$。\n\
  1.3. 定义查询、键和值投影矩阵 $W[Q], W[K], W[V] \\in R^{(d\\times d')}$\n\n2. **线性投影：**\n2.1.\
  \ 对于每个特征图 $F_i$ 执行：\n2.2. 计算：$F[i]' = W[i]F[i] + b[i]$\n\n3. **交叉注意力块：**\n3.1. 对于\
  \ $i=1$ 到 3（表示粒粒度）执行：\n3.2. 将 $F[i]'$ 设置为查询：$Q[1]= F[1]'W[Q]$\n3.3. 对于所有其他特征图 $F[j]'$\
  \ $j\\neq i$：\n3.4. 计算键和值：$K[j],V[j] = F[i]'W[K],F[i]'W[V]$\n3.5. 计算交叉注意力输出：$Fi\
  \ = \\sumjSoftmax(Q K[j]^T) V[j]$\n3.6. 添加残差连接并归一化：$Fi = LayerNorm (F[i]'+ Fi)$\n\
  结束循环\n\n4. **拼接：**\n4.1. 拼接所有残差输出：$F[concat] = ConcatF[1 ,F2 ,F3]$\n\n5. **最终融合：**\n\
  5.1. 将 $Fconcat$ 通过 `MLP` 以整合多粒度特征；$F[used] = MLP(Fconcat)$\n\n### 实验设置与结果\n\n##\
  \ 5.1 实验设置\n模型使用基于 Python 的库实现，并在配备有 CPU `Intel Core i9-1390K` 和 GPU `NVIDIA RTX\
  \ 3090` 的桌面电脑上运行。开发了一个基于深度学习的框架，使用卷积神经网络（`CNNs`）分析 MRI。实现在 `Anaconda` 环境中使用了带有 `TensorFlow`\
  \ 后端的 `Keras`。\n\n## 5.2 数据集\n`BraTS015`（脑肿瘤分割）数据集是医学影像领域的重要里程碑，包含了来自 220 例高级别胶质瘤（HGG）和\
  \ 54 例低级别胶质瘤（LGG）的多模态 MRI 扫描。数据集中的每个病例包含四个不同的 MRI 序列：`T1` 加权（`T1`）、对比增强 T1 加权（`T1ce`）、`T2`\
  \ 加权（`T2`）和流体衰减反恢复（`FLAIR`）。对数据集进行了严格的预处理，以确保所有病例的标准化。所有图像均由专家神经放射科医生手动标注。`BraTS015`\
  \ 数据集的关键特点是包含了详细的分割掩码和分类标签。肿瘤区域使用分级分割方法进行标注：`label 1` 表示坏死、非增强肿瘤；`label 2` 表示水肿；`label\
  \ 4` 表示增强肿瘤。`BraTS015` 数据集的独特优势在于同时包含了 HGG 和 LGG 病例，这对于创建既有效又稳健的算法具有极价值。图 8 展示了四种模态的样本。每种模态包含\
  \ 155 层切片，每个病例产生 620 张图像。对于 274 个病例，总共产生 169,880 张 MRI 图像，如表 III 所示。数据集分为 80% 训练集和\
  \ 20% 测试集。对于本研究，我们将数据集分为三类：类别 1 代表高级别胶质瘤（HGG）中的坏死；类别 2 代表低级别胶质瘤（LGG）中的水肿。\n\n表 3.\
