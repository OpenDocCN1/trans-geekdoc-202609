  \ PMID: [30478442](https://pubmed.ncbi.nlm.nih.gov/30478442)\n\n## 第 21 章\n\n# 3D\
  \ MRI 图像中的脑肿瘤级检测：一种利用体积 MRI 数据分析和分类肿瘤严重程度的先进方法\n\n**Muhammmad Sajid Khan**\n![Orcid\
  \ Imagehttps://orcid.org/0000-0001-6413-5324](https://orcid.org/0000-0001-6413-5324)\
  \ 英国数字信息威尔学院\n\n**Andrew Ware**\n![Orcid Imagehttp://orcid.org/0000-0001-8596-2601](http://orcid.org/0000-0001-8596-2601)\
  \ 英国南威尔士大学\n\n**Fizza Asif**\n巴基斯坦工程技术大学\n\n**Muhammad Usman Sharif**\n巴基斯坦工程技术大学\n\
  \n**Attia**\n巴基斯坦工程技术大学\n\n### 摘要\n\n神经放射学领域随着 3D 磁共共振成像（MRI）技术的实施取得了显著进展。这种成像模式通过高精度地检测微小肿瘤和细微异常，实现了早期肿瘤诊断。脑肿瘤分为三大类：良性、前恶性性和恶性。脑肿瘤被定义为细胞和组织的异常增生，其中恶性肿瘤的特征是生长迅速、表面不规则、缺乏包膜以及与周围结构深层附着。这些肿瘤会对相邻组织施加巨大压力并迅速扩散。所提方法利用\
  \ 3D MRI 扫描进行精确脑肿瘤检测。用户可以在两种先进分类方法之间选择：支持向量机（SVM）或自适应神经模糊推理系统（ANFIS）分类器。预处理阶段包括对比度增强、降噪和灰度转换，旨在优化图像质量。随后应用分割技术分离肿瘤区域，然后进行特征提取以识别基于向量的特征。这些特征被输入分类器以准确确定肿瘤类型。受肿瘤影响的\
  \ MRI 图像通过自组织映射（SOM）生成的各种图表进行可视化，增强了可解释性并辅助诊断决策。关键词：3D 脑模型、检测、肿瘤分期、3D MRI、分割。\n\n\
  ### 1. 引言\n\n磁共共振成像（MRI）是一种利用磁性、无线电波和复杂的系统产生肉眼不可见的身体内部部位详细图像的技术。MRI 图像非常详尽，可以检测到人体内部结构的细微变化。在某些情况下，会应用专门算法来增强\
  \ MRI 图像的质量。MRI 扫描仪根据电磁原理运行，由两个产生所需磁场的主磁体组成（DeAngelis, 2001）。\n\n初始巨大的圆形磁体对齐体内的水分子，使其朝同一方向排列。第二个磁体使体内的每个氢原子（H\
  \ 原子）在磁场的影响下调整对其齐方式。当磁场移除时，传感器探测质子返回原始对齐状态时释放的能量。患者通过滑动床放置在扫描仪内。整个过程完成后，内部 MRI 机制处理数据并构建出图像（Liang\
  \ & Lauterbur, 2000）。\n\nMRI 图像可以在计算机屏幕上查看并进行电子传输。进行 MRI 扫描有几个原因。除了头部成像，神经外科医生还用它们评估损伤后的脊髓，并检查脊椎或椎间盘。MRI\
  \ 提供了关于全身的宝贵信息，还用于评估心脏结构。MRI 扫描的精确结果通常有助于提高手术操作的准确性（Gordillo et al., 2013）。\n\n\
  磁共振成像（MRI）是一种检测脑恶性肿瘤的先进方法。脑肿瘤是任何由异常细胞引起的颅内肿瘤，通常位于大脑内部或附近。自动脑肿瘤识别是现代医学成像中最挑战性的任务之一。它需要图像分割，这是一个根据特定特征将图像分为不同区域的过程。然而，在不损害精细解剖细节的情况下去除\
  \ MR 图像噪声是一项复杂的任务。这些挑战使得获取准确的 MRI 图像变得困难，但精确的肿瘤检测高度依赖于准确的脑图像分割（Gondal & Khan, 2013）。\n\
  \n多种算法适用于脑分割，这对于手术规划和术后评估至关重要。尽管有许多方法，但由于噪声和低对比度等挑战，许多方法都失败了（Borole et al., 2015）。\n\
  \n脑肿瘤是指任何由异常细胞增生引起的颅内肿瘤。在人体中，细胞和组织作为基本单元运作。正常情况下，细胞增殖然后按有序的方式死亡。然而，当这些细胞未能经历程序性死亡（凋亡），而是不受控制地生长、过度复制、形成血管并以不自然的方式侵犯周围组织时，就会形成肿瘤。\n\
  \n癌细胞的大小和其他物理特征与正常细胞有显著差异。例如，它们的细胞核比正常细胞大且颜色深。癌细胞还可能形成没有细胞壁或外边界的簇，与正常细胞相比，其染色体数量异常多。癌症肿瘤通常分为良性和恶性。\n\
  \n良性肿瘤是一种生长缓慢的原发性肿瘤，不太扩散，因为它不侵犯周围组织或转移到身体其他部位。它通常体积较小、表面规则、有包膜，并附着在深层结构上。虽然它会对邻近器官施加轻压力，但除非变为恶性状态或产生继性（恶性）肿瘤细胞，否则通常不严重。然而，术后存在复发的风险。\n\
  \n另一方面，恶性肿瘤（继性肿瘤）是生长迅速、巨大的、易扩散的癌细胞。它们威胁生命，表面不规则、无包膜，并附着在深层结构，对相邻组织施加巨大压力。这些肿瘤在术后也可能再生。从身体其他部位起源并通过血液扩散到大脑的肿瘤被称为继性肿瘤或转移瘤（Pereira\
  \ et al., 2016）。\n\n\n\n\n\n根据最近的研究，脑癌患者的存活率为女性 36%，男性 34%（Pereira et al., 2016）。癌症的类型和确诊时的阶段是影响存活率的众多变量之一。我们研究的目标是及时诊断肿瘤，并在三个维度上将其分为两类：良性（原发性）和恶性（转移性）。可以通过\
  \ 3D 视角详细查看物体。\n\n该算法使用 3D `MRI` 扫描作为输入；在识别肿瘤及其阶段之前，该算法会执行分割和特征提取等关键任务。这种方法通过实现及时且适当的治疗，有望提高未来脑瘤患者的存活率。\n\
  \n本文的结构如下：第 2 节介绍了脑瘤检测的文献综述，第 3 节概述了我们提出的方法和分类器，第 4 节提供了结果分析与讨论。论文第 5 节总结了我们的研究和发现，第\
  \ 6 节给出结论。\n\n## 2. 文献综述\n\n使用 `MRI` 扫描识别脑瘤是医学影像中的一项重要任务，旨在提高诊断精密度并确保及时治疗。随着医学影像技术的发展，研究人员开发了各种技术来增强脑瘤的检测和分类。研究人员提出了多种检测肿瘤的算法。2020\
  \ 年，一些研究人员开发了使用自适应 `K-means` 聚类方法的算法，以增强对比度并填充 `MRI` 脑图像中的间隙。在接收到 `MRI` 扫描输入后，算法应用阈值消除不需要的像素。然后将处理后图像的左部分叠加到原始图像上以检测肿瘤。随后将左区域映射到原始图像上进行肿瘤检测。肿瘤检测分为两个阶段：首先是分割，其次是映射到原始图像。检测后，使用支持向量机\
  \ (`SVM`) 进行分类。将检测到肿瘤的图像输入离散小波变换 (`DWT`)，它将图像分解为四个部分：低低 (`LL`)、低高 (`LH`)、高低 (`HL`)\
  \ 和高高 (`HH`)。低低 (`LL`) 系数进一步通过主成分分析 (`PCA`) 进行处理，以提取更强的特征（Zulpe & Pawar, 2012）。\n\
  \n使用灰度级共生矩阵 (`GLCM`) 对特征进行进一步表征。最后，在数据集上训练支持向量机 (`SVM`)，使用线性内核进行分类，并使用灰度级共生矩阵 (`GLCM`)\
  \ 衍生的特征确定肿瘤类型。通过这种方式，他们实现了 93%的准确率（Zulpe & Pawar, 2012）。\n\n他们在研究中应用于图像的预处理技术包括统称为卷积过滤的各种。这些方法涵盖了\
  \ `RGB` 转灰度化、边缘检测和 `2D` 卷积掩膜。图像被用于训练系统，在此期间系统地提取了它们的特征。应用形态学技术去除不需要的像素，以提高图像质量以供后续处理。分割通过生成带符号距离图\
  \ (`SDM`) 来，这有助于准确勾定感兴趣区域。对于最终分类，利用 `MATLAB` 的 `Classification Learner` 应用，实现了 80%的准确率（Chander\
  \ et al., 2020）。\n\n本文提出了一种利用 3D `MRI` 图像检测脑瘤的自动技术。该技术涉及使用偏置场校正对 3D `MRI` 图像进行预处理。使用了\
  \ `N4ITK` (`N4ITK` 偏置场校正）技术以及直方图匹配，每幅图像的直方图根据均值直方图进行调整。预处理后，应用 `Otsu` 算法提取所需的脑瘤细胞区域。特征提取对于分类或识别是一个重要步骤，因此他们提取了脑\
  \ `MRI` 图像的局部二值模式 (`LBP`) 特征和直方图方向梯度 (`HOG`) 特征。最后，在所提方法的帮助下，借助随机森林算法进行分类；他们获得了\
  \ 83%的最大准确率（Abbasi & Tajeripour, 2017）。\n\n在本文（Sharmila et al., 2019）中，提出了一种利用 3d\
  \ `MRI` 图像检测脑瘤的自动技术。该技术涉及使用偏置场校正对 3d `MRI` 图像进行初步预处理。使用了 `N4ITK` 技术和直方图匹配，其中每幅图像的直方图根据图像均值直方图进行调整。预处理后应用\
  \ `Otsu` 算法提取所需的脑瘤细胞区域。对于分类或识别，特征提取是一个重要步骤，因此他们提取了脑 `MRI` 图像的局部二值模式 (`LBP`) 特征和直方图方向梯度\
  \ (`HOG`) 特征。最后，在所提方法的帮助下，借助随机森林算法进行分类；他们获得了 83%的最大准确率（Abbasi & Tajeripour, 2017）。纠正：在本文（Sharmila\
  \ et al., 2019）中，研究人员提出了一种利用支持向量机 (`SVM`) 分类脑瘤的技术。数据集输入系统，从提取特征开始。首先，系统使用基于波的纹理分析\
  \ (`WSFTA`) 技术，包括离散小波变换 (`DWT`) 和基于分割的纹理分析 (`SFTA`)。其次，使用主成分分析 (`PCA`) 进行降维。\n\n\
  系统使用支持向量机 (`SVM`) 算法进行训练，并对两幅图像进行相似性检查。通过这种方法，他们实现了 90.67%的准确率。在所提方法中（Sharma et\
  \ al., 2018），使用了灰度化、二值阈值、形态学操作和岭水分割预处理技术。然后使用灰度级共生矩阵 (`GLCM`) 提取特征。最后，使用 `K-means`\
  \ 聚类和神经网络 (`ANN`) 进行分类。为了这一目的，使用了神经模糊系统。\n\n在另一项研究中，研究人员专注于从 `MRI` 图像中提取和识别胶质瘤。在他们的工作中（Selvapandian\
  \ & Manivannan, 2018），他们首先应用了预处理技术。之后，使用灰度级共生矩阵 (`GLCM`) 方法提取特征。提取出的四个特征被输入自适应神经模糊推理系统\
  \ (`ANFIS`) 分类器，以判断是否为胶质瘤。\n\nKapoor 和 Thakur (2017) 比较了各种图像分割技术，包括阈值分割、区域分割和无监督学习算法（如模糊聚类、`C-means`\
  \ 和 `k-means`）。他们评估了每种技术的优缺点，指出阈值分割容易实现，但无法提供所有必要信息，且不适用于低对比图像。虽然模糊聚类、`C-means`\
  \ 和 `k-means` 是基于学习的技术，但在噪声图像上无法产生准确的结果。相比之下，区域分割更准确，尽管速度比其他方法慢。\n\n在他们 2018 年的研究中，S.M.\
  \ Kamrul Hassan 和 Mohiuddin Ahmad 等人实现了一种双步验证流程，用于脑瘤分割和脑状态评估。图像数据集源自 `BRATS` 2012\
  \ 数据集，包含 30 名胶质瘤患者的 `MRI` 扫描，其中 20 例高级胶质瘤，10 例低级胶质瘤。随后使用岭水算法将分割区域与真值图像进行匹配（Hasan\
  \ & Ahmad, 2018）。\n\n\n\n\n\n最近的研究强调了机器学习在脑瘤分类和医学成像中日益凸显的作用。Aamir 等人 (2023) 开发了一种利用利用从\
  \ MRI 图像高质量区域提取的深层特征来对脑瘤进行分类的方法，提高了肿瘤检测的准确性。\n\n在之前的一项研究中，Aamir 等人 (2022) 提出了一种基于\
  \ MRI 图像的脑瘤分类的深度学习方法，侧重于提高分类性能。Aamir 等人 (2017) 用于目标提议生成的混合方法也通过增强图像分析技术为医学成像领域做出了贡献。此外，Guan\
  \ 等人 (2023) 开发的框架提供了一种使用 MRI 数据进行脑瘤分类的高效方法。最后，Aamir 等人 (2023) 探索了机器学习在医学中更广泛的应用，强调了基于\
  \ MRI 的肿瘤分类等医学技术背景下的当前趋势和未来前景。\n\n最近的研究表明，应用于 MRI 图像的深度学习和机器学习技术在脑瘤检测方面取得了显著进展（Zulpe\
  \ & Pawar, 2012）。Abdusalomov 等人 (2023) 探索了深度学习方法，强调了通过使用卷积神经网络 (CNNs) 和磁共振成像来提高肿瘤检测的能力（Chander\
  \ 等人., 2020）。\n\nAnantharajan 等人 (2024) 通过整合深度学习和机器学习方法，进一步增强了基于 MRI 的脑瘤检测，从而实现了更稳健的肿瘤分类和检测。2021\
  \ 年，Brindha 等人应用了深度学习技术（特别是 CNNs）从 MRI 扫描中进行自动脑瘤检测，展示了它们有效分析医学图像的能力。Ahmed 等人 (2024)\
  \ 提出了一种结合了 Vision Transformer (ViT) 和门控循环单元 (GRU) 以及可解释 AI 的混合模型，以提高分类性能并为肿瘤分类的决策过程提供透明度。\n\
  \nMartínez-Del-Río-Ortega 等人 (2024) 利用 CNNs 进行脑瘤检测为该领域做出了贡献，证明了其在增强 MRI 分析以实现精确诊断方面的潜力。最后，Khaliki\
  \ 和 Başarslan (2024) 将迁移学习技术与传统的三层 CNN 模型进行了比较，提供了它们在肿瘤检测中比较的效果的效果。这些研究共同强调了脑瘤检测向\
  \ AI 驱动方法的逐步转变，为临床应用提供了更准确、更可靠且高效的诊断工具。\n\n### 3. 方法论\n\n从 BRATS 获取的 3D MRI 脑瘤扫描在体积内被切成切片。3D\
  \ 切片使用对比度增强进行预处理，使图像对比度更亮，提高扫描的可视性并突出图像中的区域。现在使用 `K-means` 对扫描进行分割以检测肿瘤，然后为 3D MRI\
  \ 扫描绘制自组织映射表示。进行特征提取并使用 `PCA` 选择合适的特征集以最大化准确率结果，最后将肿瘤分类为高级别胶质瘤和低级别胶质瘤，并给用户一个选项，用户可以选择\
  \ `SVM` 进行肿瘤分类或 `ANFIS`。\n\n3D MRI BRATS 脑瘤被切片。使用 `K-means` 对扫描进行分割，然后为 3D MRI 扫描绘制自组织映射表示。进行特征提取并使用\
  \ `PCA` 选择合适的特征集以最大化准确率结果，最后将肿瘤分类为高级别胶质瘤和低级别胶质瘤，并给用户一个选项，用户可以选择 `SVM` 进行肿瘤分类或 `ANFIS`。\n\
  \n3D MRI BRATS 脑瘤被切片。使用 `K-means` 对扫描进行分割以检测肿瘤，然后为 3D MRI 扫描绘制自组织映射表示。进行特征提取并使用\
  \ `PCA` 选择合适的特征集以最大化准确率结果，最后将肿瘤分类为高级别胶质瘤和低级别胶质瘤，并给用户一个选项，用户可以选择 `SVM` 进行肿瘤分类或 `ANFIS`。\n\
  \n#### 3.1 原始图像与增强图像\n\n任务是对 3D 图像进行分割以提取所需区域。为此，采用了三类的 `K-means` 算法。`K-means` 算法最初为类分配随机位置。然后将每个点分配给最近的类。此过程持续进行，直到类均值没有显著变化。使用三个类进行分割：一个脑区域、一个非脑部以及一个肿瘤。\n\
  \n#### 图 1. 原始图像（左），增强图像（右）\n\n![](img/979-8-3693-9816-6.ch021.f01)\n\n#### 3.2\
  \ 聚类形成\n\n`K-means` 聚类用于分离大脑的不同区域。为此，使用了三个类，即一个非脑部、一个无肿瘤的脑部和一个肿瘤。该方法的步骤按算法描述如下：\n\
  \n假设有一个图像 `x * y`，坐标为 `x` 和 `y`，图像将被分为 `L` 个类，`k(x, y)` 说明所有无序像素，而 `CL` 是形成的类。将图像分为\
  \ `l` 个类，然后估计每个像素到类的欧式距离，见公式 1：\n\n```\nDistance = |k(x, y) - C[L]|\n```\n(1)\n\n\
  将像素分配到距离该类最近的类。在对每个像素后，通过计算公式 (2) (Guan 等人，n.d.) 的数据均值重新计算质心。\n\n```\nC_L = \\frac{1}{L}\\\
  sum_{x \\in C_L}\\sum_{y \\in C_L}k(x,y)\n```\n(2)\n\n重复上述所有步骤，直到质心值停止变化。现在将重塑类的像素元素映射到图像上。\n\
  \n#### 图 3. K-Means 算法\n\n图 3 将显示 `K-Means` 算法的详细工作原理。\n\n![](img/979-8-3693-9816-6.ch021.f03.png)\n\
  \n\n\n\n形态学操作是在对输入图像中的输入像素与其邻域进行比较时执行，以便在输出图像中获取所需的输出结果。在提议系统的其他类型中，根据场景选择了开运算（opening）。当目标是消除带有不必要信息的小对象，同时保留形状且不对其尺寸产生干扰时，形态学开运算非常有用。开运算涉及腐蚀和膨胀，这是形态学操作的关键类型：腐蚀缩小区域，而膨胀将其放大，因此，开运算是腐蚀和膨胀的组合，且两种操作均使用相同的结构元素。\n\
  \n### 4.1 自组织映射 (SOM)\n\n自组织映射是纯粹为了执行数据聚类而训练的神经网络。网络包含的结构使得网络强制决定由哪一个单元做出响应，并根据输入向量在输入空间中的分组情况来学习分类。在我们的案例中，使用了尺寸为\
  \ `10*10` 的图像，神经元值为 `25*25`。SOM 训练后，系统输出不同的图表，显示了不同神经元在不同位置的分布。自组织特征图网络使用与竞争层相同的程序识别胜出神经元\
  \ `i*`。然而，并不是只更新胜出神经元，而是使用 Kohonen 规则更新胜出神经元特定邻域 `N[i]*` 内的所有神经元。具体而言，所有此类神经元 `i\
  \ ∊ N[i]*` 的调整如下如下：\n\n`i**w*(q*) = i**w*(q−1) ⅅ+ α(p(q)−i**w*(q−1))`\n(3)\n\n或\n\
  \n`i**w*(q*) = (1−α)*i**w*(q−1) ⅅ+ αp(q*)`\n(4)\n\n这里，邻域 `N[i]*` 包含位于胜出神经元 `i*`\
  \ 半径 `d` 以内所有神经元的索引。\n\n`N**i*(d*) = {*j*,d**ij≤d}`\n(5)\n\n因此，当呈现向量 `p` 时，胜出神经元及其近邻神经元的权重会向\
  \ `p` 移动。结果，在多次呈现后，相邻的神经元学习了彼此相似的向量。\n\n在 SOM 的每个表示中，维度如下：\n\n```\n% 创建一个自组织映射\n\
  dimension1 = 25;\ndimension2 = 25;\n```\n\n这显示神经元被视为 `25*25`。\n\n在训练时，使用了批权重算法，迭代次数为\
  \ 200。每幅图显示了 x 轴和 y 轴上神经元的选取维度，描述了从第一个神经元到最后一个神经元的位置。\n\n#### 图 4. SOM 拓扑结构\n![](img/979-8-3693-9816-6.ch021.f04.png)\n\
  \n#### 图 5. SOM 邻域连接\n![](img/979-8-3693-9816-6.ch021.f05.png)\n\n#### 图 6. SOM\
  \ 邻域权重距离\n![](img/979-8-3693-9816-6.ch021.f06.png)\n\n#### 图 7. SOM 命中情况\n![](img/979-8-3693-9816-6.ch021.f07.png)\n\
  \n#### 图 8. SOM 输入平面\n![](img/979-8-3693-9816-6.ch021.f08.png)\n蓝色六边形代表神经元，红色线条连接相邻的神经元。区域内的颜色表示神经元之间的距离，深颜色表示距离较远，浅颜色表示距离较近。自组织映射（SOM）命中告诉我们距离的分布。\n\
  \n#### 图 9. SOM 权重位置\n![](img/979-8-3693-9816-6.ch021.f09.png)\n自组织映射（SOM）输入平面是神经元的权重。这种权重调整显示了神经元的分布不平衡性。\n\
  \n### 4.2 特征提取\n\n在训练时，使用了批权重算法，迭代次数为 200。每幅图显示了 x 轴和 y 轴上神经元的选取维度，描述了从第一个神经元到最后一个神经元的位置。\n\
  \n#### 图 10. 特征提取\n![](img/979-8-3693-9816-6.ch021.f10.png)\nGLCM（灰度共生矩阵）是用于描述图像纹理特征的。通过\
  \ GLCM 提取的常用特征包括：\n\n- **对比度 (Contrast)**：衡量图像相邻像素间灰度的差异。\n- **相关性 (Correlation)**：衡量相邻像素值的线性相关程度。\n\
  - **能量 (Energy)**：也称为均匀性，反映灰度分布的均匀性。\n- **同性 (Homogeneity)**：衡量相邻像素间灰度值的接近程度。\n\n\
  \n\n局部二值模式（Local binary patterns）是描述表面纹理属性的特征描述符。它是早期使用的发散统计特征和结构模型的混合，用于检查和研究表面的纹理属性。这些特征描述符因其处理单调灰度图像的鲁棒性以及计算效率而受到优先考虑。该算法根据现有值对相邻邻域像素进行阈值处理。它们主要在空间上存储灰度对比度和图像模式。以下是特征计算过程的描述。首先，在每个像素半径为\
  \ `R’` 的范围内选择若干像素，然后计算所选当前像素与其相邻像素之间的 `Intensity` 差异。现在，通过应用阈值处理，所有负值差异将变为 `0`，其他所有值被设置为\
  \ `1`。最后，获得的向量将转换为十进制值，并假设为该当前像素的新强度值。\n\n公式 (13) 给出了计算每个像素 `LBP` 的方程：\n\n$$LBP\\\
  _{({A,R^{\\\\prime}})} = {\\\\sum\\\\limits\\_{a = 1}^{A}{s\\left( {g\\_{A} - g\\\
  _{B}} \\\\right) \\cdot 2^{({a - 1})}}}$$\n\n(13)\n\n以及\n\n`s`(`x`) = {1,*x*≥00,*x*<0\
  \  \n\n(14)\n\n其中 `A` 分别代表相邻像素的数量，`R’` 表示半径。`g[A]` 和 `g[B]` 分别是当前像素和邻域像素的强度值。\n\n\
  ### 小波包变换\n\n利用图像范围内不同频率的小波包变换对图像进行分解。这里使用了 `2D-DWT`，它在定义和评估特征方面具有真正的建设性，并使用了 `DB5`\
  \ 小波。通过使用感兴趣区域的四个子带 `HH`（高高）、`LL`（低低）、`HL`（高低）和 `LH`（低高），可以获得 40 个特征，其中包含 20 个均值值和\
  \ 20 个标准差值。`Mean` 是每个分解层级的平均值。它显示了每个分解层级的数据分布。从 0、45、90 和 135 度四个不同的角度提取了不同的特征，即对比度、能量、相关性和同质性，还计算了均值、标准差、偏度和峰度，这些特征被称为局部二值模式。\n\
  \n后 40 个特征是从基于小波的特征提取的，并计算了它们的均值、标准差、偏度和峰度。基于 `LOG` 的特征有 40 个，因为图像被分解为 40 层级，因此从每个层级提取一个特征。特征降约是从获取特征中减少特征到所需特征的过程，因此为了获得更好的准确性，对这些特征形成一个矩阵，作为分类器的输入进行分类处理。这一步通过\
  \ `Principal Component Analysis Algorithm` 完成。\n\n### 4.3 分类\n\n本研究侧重于将肿瘤分为两类：良性和恶性。为此，所选算法为\
  \ `SVM` 或 `ANFIS` (Khaliki & Başarslan, 2024)，并对它们的结果进行了比较。在应用 `PCA` 后，`SVM` 的准确率从\
  \ 83% 达到 80%，而 `ANFIS` 的准确率从 92% 达到 97.76%。在这一步中，包含 64 个特征的特征向量准备好输入 `PCA` 算法，`PCA`\
  \ 将给出 64 个特征作为输出，与输入系统的特征相同，但这是一个包含输入特征向量特征值的新特征向量。\n\n该特征向量的属性将将是：其起始特征将有助于实现高准确率，而最后的特征将会降低准确率。修改后的\
  \ `ANFIS` 训练数据集将应用于 `ANFIS` 模型上，并获得系统的训练模型，然后对该模型进行测试以计算准确率。系统为用户在两个分类器 `SVM` 或\
  \ `ANFI` 之间提供了选项选择（参见 图 11 和 12）。\n\n#### 图 11. 修改后 ANFI 的贡献流程图\n\n![](img/979-8-3693-9816-6.ch021.f11.png)\n\
  \n#### 图 12. SVM 测试和训练阶段的框图\n\n![](img/979-8-3693-9816-6.ch021.f12.png)\n\n### 4.4\
  \ 实施与结果分析\n\n训练时间通常需要开发时间的 20-30%，它可能长达几个月，也可能短至几天或几周，取决于我们用于训练系统的数据集。计算时间和响应时间尚无法提前预测，因为尚未完成实现，但无疑，系统的目标将通过提高效率和缩短时间来提高性能并增强结果。之前开发的系统无法描述肿瘤阶段，它们只关注从图像中提取肿瘤、检测肿瘤，某些还讨论了肿瘤的位置。所实现的分类器能够指定肿瘤阶段，即其是否为恶性。错误总是影响系统的结果和可用性。它们产生了负面影响，导致需求未满足，随着错误的减少，将会获得更好的结果。\n\
  \n通过对比度调整进行处理；它通过提高对比度来增加像素值，以诊断并提取肿瘤区域，应用 k-means 聚类将数据分为 3 类：非脑部分、无肿瘤的脑以及最后是肿瘤。\n\
  \nK-means 估计每个点或像素到质心的欧几里得距离。然后将其分配给距离最近的质心。这一过程持续所有点。在将每个类分配给相应的点后，通过取每类数据的平均值重新计算质心。重复此迭代过程直到停止条件，即质心值不再变化。\n\
  \n一旦聚类完成，将类映射到图像上，得到 K-means 算法输出的二值图像。\n\n接下来对二值图像形态开启操作。这首先对图像进行腐蚀，然后使用相同的结构元素进行膨胀。开启操作平滑物体并移除微小的不需要细节。\n\
  \n开启操作后，从图像中删除小于 200 像素的对象，以消除任何剩余噪声或无关对象。最终输出是分割后的图像，无关对象已成功移除。\n\n特征提取涉及从图像中检索有用的定量信息。在此过程中总共获取了\
  \ 64 个特征。使用了多种技术进行特征提取：GLCM、LBP、离散小波变换（DWT）和高斯拉普拉斯（LoG）。\n\n在 GLCM 中，从四个方向（0°、45°、90°\
  \ 和 135°）提取了四个特征。这些特征包括对比度、相关性、能量和同质性，每个特征都有四个对应值。\n\n\n\n\n# 特征提取\n高斯拉普拉斯（`LoG`）用于计算均值、标准差、偏度和峰度。`LBP`\
  \ 也用于提取均值、标准差、偏度和峰度。\n\n最后，应用了离散小波变换（`DWT`），并计算了均值和标准差。这些值每个都有二十种不同的测量结果，为分析提供了全面的特征集。\n\
  \n应用主成分分析进行特征降维，以从给定数据中获取最相关的数据。在使用 `PCA` 后，使用 `SVM` 进行肿瘤分类时，准确率从 83%下降到 80%；而当应用\
  \ `PCA` 特征并使用 `ANFIS` 进行分类时，准确率从 92%增加到 97.76%，然后其结果显示 `ANFIS` 具有更高的准确率，权重位置如表 1\n\
  \n### 图 14. 二值图像![](img/979-8693-9816-6.ch021.f14.png)\n\n### 图 15. 分段图像![](img/979-8693-9816-6.ch021.f15.png)\n\
  \n### 图 16. SOM 权重位置![](img/979-8693-9816-6.ch021.f16.png)\n\n# 方法\n现有系统对图像进行处理，然后使用直方图均衡化和聚类技术实现肿瘤检测；随后使用\
  \ II 模糊推理系统 `ANFIS` 实现肿瘤分类。通过两个数据集 `brats 2012` 和 `brats 2013` 操作，使用 `brats12` 的准确率为\
  \ 91.2%，使用 `brats13` 为 85.71% (Chander et al., 2020)，参见表 1。\n\n## 表 1. 先有工作与建议方法的准确率对比\n\
  \n| 数据集 | 模型 | 准确率 | 精确率 | 回回率 |\n| --- | --- | --- | --- | --- |\n| Brats 12 (Khaliki\
  \ & Başarslan, 2024) | 现有工作 (Chander et al., 2020) | 91.2% | 94% | 93.3% |\n| Brats\
  \ 13 (Khaliki & Başarslan, 2024) | 现有工作 (Chander et al., 2020) | 85.71% | 100% |\
  \ 83.3% |\n| Brats 15 | 建议工作 | 97.76% | 99.03% | 97.19% |\n\n使用外部数据集进行验证，以确保模型能够处理不同的人口统计、肿瘤类型和临床状况。这证明了模型的适用性。使用\
  \ `BraTS 2015` 数据集的独立子集应用交叉验证技术，帮助我们识别针对特定的过拟合。最后，在临床环境中真实扫描测试模型，这些扫描可能包含训练数据中不存在的伪影、噪声或差异。这为模型在常规使用中的可靠性提供了见解。\n\
  \n### 结论\n总之，MRI 是识别各器官异常和疾病的重要工具。在 `BraTS 2015` 上评估的建议模型与早期的 `BrTS 2012` 和 `BrTS\
  \ 2013` 模型相比，在准确率、精确率回归率方面有显著提高。这些进展强调了其在可靠肿瘤分类方面的潜力。未来的工作可以整合深度学习技术和实时实现，进一步提高肿瘤诊断的准确性和效率。\n\
