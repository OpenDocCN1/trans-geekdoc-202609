  \n\n\n\n\n## 第 10 章\n\n# 深度图像处理中的数据增强技术\n\nFikriye Ataman\n\n![Orcid Imagehttps://orcid.org/0000-0002-0257-7730](https://orcid.org/0000-0002-0257-7730)\n\
  \n土耳其，Van Yüzüncü Yıl 大学\n\n### 摘要\n\n\n\n图像数据增强是一种人工扩展和多样化现有图像数据集的技术。当训练数据不足以供机器学习和深度学习模型训练时，这种方法非常有益。它能允许模型在训练过程中具有更好的泛化能力，并减少过拟合。主要技术包括几何变换、颜色和光变化、噪声添加、光学畸变以及现代混合方法。这些方法通过模拟现实世界的波动，使模型接触到更多多样性。因此，在降低数据收集和标注成本的同时，提高了模型的性能和泛化能力。数据增强在成功的基础上起着重要作用，特别是在处理医学图像的研究中。本研究详细解释了用于图像增强的技术，还揭示了这些方法在数据集上的性能结果及其对深度模型的影响。该研究包含了最常用的方法，并提供了详细的文献综述。\n\
  \n### 1. 引言\n\n人工智能（AI）与医学成像之间的关系已变得更加实质。医学成像通过将人体内部结构可视化来诊断和治疗疾病。这一过程允许医生更准确地诊断疾病、个性化治疗方案并跟踪患者的康复\
  \ (Aamir et al.,2023)。如果能早期诊断，许多疾病可以得到更成功的治疗 (Carrasco Ramírez, 2024; Khalifa et\
  \ al., 2024; Mahesh Batra & Reche, 2023; Pinto-Coelho, 2023; Rana & Shuford, 2024;\
  \ Zatloukal et al., 2020)。医学成像可以更早发现疾病，从而尽早治疗 (Guan et al., 2021)。医学图像还为医生提供了有关疾病类型、大小和位置的详细信息。这减少了误诊风险，并允许选择正确的治疗方法\
  \ (Carrasco Ramírez, 2024; Khalifa et al., 2024; Mahesh Batra & Reche, 2023; Pinto-Coelho,\
  \ 2023; Rana & Shuford, 2024)。这对于罕见疾病尤为重要 (D. He et al., 2024; Zheng et al., 2024)。此外，成像结果可以为手术提供详细的术前规划。这可以缩短手术时间并减少并发症风险。在治疗过程中，医学成像还帮助评估治疗效果，并在必要时修改治疗方案。医学成像可以用更小或无切口完成许多手术。这意味着患者疼痛更少、恢复更快且并发症更少\
  \ (Carrasco Ramírez, 2024; Khalifa et al., 2024; Rana & Shuford, 2024)。使用许多不同的技术来产生医学图像。标准的成像技术包括正电子发射层扫描、X\
  \ 射线、磁共振成像、计算机断层扫描和超声 (Aamir et al., 2022)。医学图像影响人们的生活，其处理自然极其重要。\n\n医学图像处理面临许多挑战，包括图像的复杂性\
  \ (Zheng et al., 2024)、特定疾病高质量数据的稀缺、准确标注图像的成本以及数据隐私和安全的伦理问题 (Jalal et al., 2021;\
  \ Koohi-Moghadam & Bae, 2023; Sen et al., 2020; Tripathi & Musiolik, 2022)。AI 模型的可靠性和透明度至关重要，用于训练的数据分布影响着其对真实数据的泛化能力。数据的缺乏会对模型性能产生负影响，导致过拟合并损害模型的泛化能力。为了解决这些问题，研究人员正在开发更广泛的数据集、先进的算法和强大的方法\
  \ (Jalal et al., 2021; Koohi-Moghadam & Bae, 2023; Sen et al., 2020; Tripathi &\
  \ Musiolik, 2022)。无论问题有多大，医学图像处理进步的力量都是显而易见的 (Jalal et al., 2021; Koohi-Moghadam\
  \ & Bae, 2023)。近年来，深度神经网络对医学图像的影响显著增加。然而，众所周知，医学数据往往观察不足，图像数据量小是模型训练和性能的重要限制。解决这一问题的一个重要方法是使用数据增强（DA）方法增加数据样本量。本研究提供了近年来开发的\
  \ DA 技术的深度信息，还对通过将模型应用于先进数据集所获得的实验结果进行了详细比较。本研究将为该领域的研究人员提供关于 DA 技术的详细信息。通过比较实验结果，将帮助研究人员决定哪种技术或模型更适用于他们的数据。\n\
  \n## 1.1 图像数据增强 (`IDA`)\n\n`IDA` 是一种通过从现有数据集创建新图像来增加图像数据大小和多样性的技术 (Gao et al., 2019;\
  \ C. Zhang et al., 2023; Zhao et al., 2023)。它被用于计算机视觉领域，如目标识别、分类、模型训练 (Goodfellow\
  \ et al., 2020)、抽象视觉推理 (S. Hu et al., 2021) 以及分割 (Lee et al., 2023)。`IDA` 方法在有限的训练数据中提高了分类性能，并通过学习训练数据中的统计噪声防止过拟合。它还增强了目标检测中的泛化性能，并使模型对输入数据的变化更具鲁棒性。`DA`\
  \ 也用于抽象视觉推理，创建符合任务规则的新模型 (Goodfellow et al., 2020)。\n\n## 1.2 数据增强的重要性\n\n`DA` 非常重要，因为机器学习模型有助于执行多项图像处理任务，包括分割、目标检测和分类。\n\
  \n\n\n\n\nDA（数据增强）被用于一种抽象视觉推理任务，以创建与底层规则一致的新视觉模型。得益于 DA 技术，模型能够更高效地学习任务规则，并以更可接受的速率适应新数据（W.\
  \ He et al., 2023）。\n\n可能会出现可用数据缺失的情况，使得必须针对稀有事件采取行动并运行 ML 模型。DA 是填补稀有事件数据缺口并有效利用\
  \ ML 算法的首选技术（Min et al., 2023）。\n\n数据的变形和变化可能会阻碍目标检测问题中的预期结果。DA 技术可以解决这些障碍（H. Lee\
  \ et al., 2023）。\n\nDL（深度学习）在各种计算机视觉任务中（如分割、目标识别和图像分类）取得了巨大成功。然而，用于训练 DL 模型的数据集不足，这可能导致过拟合和泛化能力差。增加数据样本量是应对这些问题的重要措施。\n\
  \nDA 被应用于许多领域，例如抽象视觉推理（C. Zhang et al., 2023）、图像到图像翻译、高光谱图像分类（Gao et al., 2019）（Xu\
  \ et al., 2023）。\n\n### 图像分类与跨类学习\n\n图像分类具有挑战性，因为自然图像具有高类内多样性和低类间差异（Aamir et al.,\
  \ 2019）。跨类学习旨在通过学习区分不同类的特征来提高分类性能。DA 是提高跨类学习性能的常用方法。DA 生成与任务基础规则一致的新数据点。DA 将帮助模型更有效地学习区分不同类别的特征（Tokozume\
  \ et al., 2018； Zhu et al., 2017）。\n\n### 联邦学习 (FL)\n\nDA 发挥作用的另一个领域是联邦学习（FL）。FL\
  \ 和 DA 是两种互补的技术。FL 是一种协作机器学习方法，用户数据永远不会离开用户设备，且训练过程分布在许多用户之间（Hao et al., 2021; B.\
  \ Hu et al., 2023; H. Zhang et al., 2023; J. Zhang & Jiang, 2022）。\n\nFL 防止了敏感数据在中央服务器上被收集。DA\
  \ 方法可以与 FL 成并应用于本地设备，可以使用来自本地数据的增强数据更新模型。模型在不将数据发送到中央服务器的情况下进行训练，并保护了数据隐私（Hao et\
  \ al., 2021; B. Hu et al., 2023; J. Zhang & Jiang, 2022）。\n\nFL 汇了来自不同机构或设备的异构数据源。DA\
  \ 通过应用于这些异构数据集中的每一个增加了多样性，使得模型比单独使用 DA 更具泛化性。例如，对不同人口群体的数据执行 DA 可以减少模型的偏 own（Hao\
  \ et al., 2021; B. Hu et al., 2023; Menegatti et al., 2023; H. Zhang et al., 2023;\
  \ J. Zhang & Jiang, 2022）。\n\n在某些机构，数据源有限。DA 可以在本地扩展这些小数据集数据集并让 FL 从中获益。例如，移动设备上的几张图像可以通过增强方法来训练模型（Hao\
  \ et al., 2021; Menegatti et al., 2023; J. Zhang & Jiang, 2022）。\n\nDA 可以通过创建合成数据包含在\
  \ FL 过程中。使用这种合成数据，FL 可以在不访问敏感数据的情况下提高性能。DA 可以增加 FL 中的匿名性，特别是在敏感数据场景下。例如，通过几何变换处理图像增加了数据隐私。FL\
  \ 使用这种匿名增强数据训练模型。例如，FL 和 DA 可以用于来自不同医院的医学图像。每个医院通过增强本地数据增加了模型的整体成功率。然而，可能存在缺点。DA\
  \ 和 FL 过程在本地设备上可能需要计算资源。某些设备或机构的数据较少或质量低，这种数据平衡可能会限制 FL 的效果。此外，在 FL 中，每个设备都应该执行\
  \ DA 操作。FL 和 DA 在具有敏感和小型数据集的场景下形成了强大的协作。FL 和 DA 在确保数据隐私的同时提高了模型性能。这些技术的进一步整合可能提供更有效的医疗、金融和移动解决方案（Hao\
  \ et al., 2021; B. Hu et al., 2023; Koohi-Moghadam & Bae, 2023; Menegatti et al.,\
  \ 2023; H. Zhang et al., 2023; J. Zhang & Jiang, 2022）。\n\n### 深度神经网络 (DNN)\n\n\
  深度神经网络（DNN）在图像分类、目标检测和许多其他不同的计算机视觉任务中取得了巨大成功。DNN 往往难以提供准确的不确定性估计，这对于疾病诊断和自动驾驶等工作非常重要（D.\
  \ He et al., 2024; Jalal et al., 2021; Koohi-Moghadam & Bae, 2023; Sen et al., 2020）。DA\
  \ 是用于提高 DNN 健性和不确定性估计的常用方法。它帮助 DNN 学习泛化到新数据，包括竞争性示例。DA 鼓励 DNN 学习更多信息丰富的特征，使模型能够做出更准确的不确定性估计（Hendrycks\
  \ et al., 2020）。\n\nDL 在计算机视觉中至关重要，并代表了许多任务（如目标检测、分割和分类）的最先进结果（Aamir et al., 2023）。DL\
  \ 模型需要海量且多样化的训练数据。DA 可以通过从当前数据集生成新实例来满足这一需求。为 DL 模型收集足够的各种图像可能是困难且昂贵的。生成人工图像数据创建了一个极佳的舒适区。\n\
  \n\n\n\n\n[表 1] 包含了使用最先进数据集进行的实验相关研究的结果。\n\n#### 表 1. DA 算法的整体性能\n\n| 算法 | 数据集 |\
  \ 准确率 % | 参考文献 |\n| --- | --- | --- | --- |\n| Mixup | MNIST | %99.7 | ([H. Zhang\
  \ et al., 2018]) |\n| GAN | MNIST<br>CIFAR-10<br>CelebA | %98<br>%70<br>%80 | ([I.\
  \ Goodfellow et al., 2020]) |\n| CycleGAN | Plant Village | %95 | (Zhu et al., 2017)\
  \ |\n| RDAGAN | PASCAL VOC2007 | %84.1 | ([Lee et al., 2023]) |\n| PatchGAN (Pix2Pix)\
  \ | CelebA(a->b)<br>CelebA(b->a) | %99<br>%98.7 | ([Isola et al., 2018]) |\n| PRAN\
  \ | Indian Pines<br>Pavia University | %99.5<br>%98.2 | ([Gao et al., 2019]) |\n\
  | BCLearning | CIFAR-10 | %93.7 | ([Tokozume et al., 2018]) |\n| CutMix | CIFAR-10\
  \ | %95.2 | ([Yun et al., 2019]) |\n| AugMix | CIFAR-10 | %96.4 | ([Hendrycks et\
  \ al., 2020]) |\n| PuzzleMix | CIFAR-100 | %77.1 | (J.-H. Kim et al., 2020) |\n\
  | Co-Mixup | CIFAR-10 | %96.3 | ([J. H. Kim et al., 2021]) |\n| SuperMix | CIFAR-10\
  \ | %97.2 | ([Dabei et al., 2021]) |\n\n#### 1.3 数据增强的挑战\n\n所使用的 `model` 的问责制在诊断和治疗中起着至关重要的作用。必要解释\
  \ `models'` 输出是如何以及为何形成的。否则，做出错误的诊断可能会带来致命风险 ([Alta et al., 2019]; [Chlap et al.,\
  \ 2021]; [Hesamian et al., 2019]; [Razzak et al., 2018]; [Wei et al., 2023])。\n\n\
  `model's` 决策过程应该是透明的。也就是说，模型错误应该是可追踪的，在发生错误时，问题应该更容易检测和修正。从伦理上讲，应用必须符合国际标准。因此，问责制也是法律合的必要要求\
  \ ([Chlap et al., 2021]; [Garcea et al., 2023]; [Razzak et al., 2018]; [Wei et al.,\
  \ 2023])。\n\n患者图像数据在增强过程中会被匿名，但某些图像特征可能会暴露患者的身份。当产生合成数据时，可能会创建出类似于原始数据的样本，导致隐私泄露\
  \ ([Koohi-Mhadam & Bae, 2023]; [Tripathi & Musiolik, 2022])。\n\n黑箱模型在临床决策中可能会产生伦理问题。例如：模型可能会将肿瘤分类为良性，但忽略了某些区域存在异常的情况。在这种情况下，医生很难质疑或验证模型的决策。\n\
  \n此外，如果 DA 过程基于错误或有偏的数据，模型可能会做出有偏偏的决策 ([Carrasco Ramírez, 2024]; [Khalifa et al.,\
  \ 2024]; [Koohi-Mhadam & Bae, 2023]; Rana & Shuford, 2024; [Tripathi & Musiolik,\
  \ 2022])。\n\n应当告知患者其医疗图像是否会被用于增强或合成数据生产。解释数据使用过程并获得患者同意在伦理上是强制性的。医疗决策依据的模型如果缺乏问责制和透明度会降低医生和患者的信任\
  \ ([Koohi-Mhadam & Bae, 2023]; [Tripathi & Musiolik, 2022])。\n\n### 2. 相关数据增强方法\n\
  \n#### 2.1 Mixup\n\n`Mixup` 是一种用于提高分类性能的 DA 技术。它试图通过生成图像的随机混合来提高模型的泛化能力和鲁棒性。\n\n\
  当需要组合图像对如 `(x[i],y[i])` 和 `(x[j],y[j])` 时（其中图像中的独热标签用 `y` 表示，数据本身用 `x` 表示），会使用称为\
  \ `Vanilla Mixup` (H. Zhang et al., 2018)。在这里，`λ` 是决定如何混合两幅图像的超参数。混合图像有助于 ML 模型通过理解未知区域的某些关系来稳定地提升性能。\n\
  \n```\n\\tilde{x} = \\lambda x_{i} + (1 - \\lambda)x_{j}\n\\tilde{y} = \\lambda\
  \ y_{i} + (1 - \\lambda)y_{j}\n```\n\n```latex\n\\mu\\left( \\tilde{x},\\tilde{y}\\\
  left| {x_{i},y_{i}}\\operatorname{} \\right. \\right) = \\frac{1}{n}\\sum_{j}^{n}\\\
  underset{\\lambda}{E}\\left[ \\delta\\left( \\tilde{x},\\tilde{y} \\right) \\right],\\\
  lambda \\sim Beta(\\alpha,\\alpha),\\alpha \\in (0,\\infty)\n```\n\n(1)\n\n####\
  \ 2.2 CAM-Mix\n\n`CAM-Mix` 算法是一种旨在提高图像 DA 和模型泛化能力的新方法 (He et al., 2023)。该算法由两个主要部分组成。首先，`CAM`\
  \ 使用 DL 模型识别图像中最重要的区域和物体。这使得模型能够关注有意义的视觉信息，并忽略背景噪声。其次，`Mixup` 是一种 DA 技术，通过随机混合两幅图像来创建新的合成图像。`CAM-Mix`\
  \ 将 `Mixup` 与 `CAM` 模块整合，将混合过程聚焦于视觉重要的区域。\n\n\n\n\n\nCAM-Mix 融合了两幅图像的视觉属性，而没有专门提取视觉属性，这与\
  \ Mixup 不同，后者会创建在当前限制集合之外具有新视觉属性值的图像。通过使用 公式 2 和 公式 3，对于一对大小为 $n \\times m$ 的灰度图像\
  \ `I1` 和 `I2` 定义了以下灰度形态学处理。在提出的图像混合过程中，不会产生新的视觉特征值。生成图像的特征取自两张原始照片中的每一个，属性没有被显式移除，且创建新图像不需要像原生\
  \ mixup 那样的额外的标量或插值函数。通过改变候选响应，目标是扩展训练数据。为此，`A` = {`a[c]}`}  `A[N]`，其中 `a[c]` 是包含正确答案的集合，`Q`\
  \ 是要消除的集合，而 `A[N]` 是包含错误（负）答案的集合。\n\n模型的主要目标是使用建议的灰度形态学过程提供更多的负候选回复。为此，生成了额外的训练数据。用于生成额外训练数据的步骤如\
  \ 公式 4 和 公式 5。因此，将负候选答案与正候选答案混合产生的数据包含关于真实答案的部分信息。结果，有效解空间可以由新创建的 `AN` 定义更尖锐的决策边界。CAM-Mix\
