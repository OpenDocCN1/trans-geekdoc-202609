  \n## 第 18 章\n\n# 用于医学影像的多流注意力机制的卷积神经网络\n\nT. V. V. Satyanarayana\n![Orcid Imagehttps://orcid.org/0000-0002-8764-9982](https://orcid.org/0000-0002-8764-9982)\n\
  印度，Mohan Babu 大学\n\nB. Bhaskar Reddy\n![Orcid Imagehttps://orcid.org/0000-0002-3200-0182](https://orcid.org/0000-0002-3200-0182)\n\
  印度，St. Peter's 工程学学院\n\nA. Swetha Rani\n![Orcid Imagehttps://orcid.org/0009-0008-6023-8527](https://orcid.org/0009-0008-6023-8527)\n\
  印度，G. Pullaiah 工程与技术学院\n\nP. Sree Lakshmi\n![Orcid Imagehttps://orcid.org/0000-0001-7212-9135](https://orcid.org/0000-0001-7212-9135)\n\
  印度，Audisankara 工程与技术学院\n\nHedayath Basha Shaik\n印度，R.M.K. 工程与技术学院\n\n### 摘要\n\n\
  在近期，医学影像已成为更好地诊断患者的工具。诊断机制包括非侵入性方法以及对各种疾病（如肺炎、癌症和其他神经系统疾病）的进一步治疗。为了应对现有方法中的挑战，本章引入了一种新的`多流注意力机制卷积神经网络\
  \ (MSA-CNN)` 技术，这是一种深度学习架构。所提架构的核心组件是注意力机制，它能够动态地为每个模态的特征分配重要性，专注于图像中感兴趣的最相关区域，以提高模型的可解释性。此外，还引入了`噪声感知损失函数`来处理图像噪声以增强模型性能。结果显示，所提技术在胸部\
  \ X 光数据集上的准确率达到 95.7%，优于现有的基准技术（分别为使用`AlexNet` 的 89.3% 和使用`ResNet-18` 的 92.4%）。\n\
  \n### 1. 引言\n\n目前医学影像技术如磁共振成像 (MRI)、计算机断层扫描 (CT) 和 X 光被广泛使用，被认为是现代医疗保健系统的主要工具。医疗专业人员将使用这些工具以非侵入的方式观察人体内部结构，并进一步用于诊断从癌症到多种感染性疾病的身体状况。这些技术改变了疾病检测、监测和进一步治疗的方式。然而，医学影像的解读已变得复杂，且迄为止仍然是一项耗时的任务。这种任务只能通过熟练的放射科医生完成。最近的研究表明，放射科医生在压力下可能会漏掉高达\
  \ 30% 的异常，导致有时漏诊。人工智能 (AI)、深度学习 (DL)，特别是卷积神经网络 (CNN)，在医学影像自动化方面表现出更好的效果。CNN 已经成为图像分类、分割和目标检测的标准，因为它们可以从原始图像数据中自动学习分层特征，从而消除了对手动特征工程的需要。这些技术也可以成功应用于检测胸部\
  \ X 光中的肺炎（Lakhani and Sundaram, 2017）、分割 MRI 扫描中的脑肿瘤（Ronneberger et al., 2015）以及通过\
  \ CT 扫描诊断 COVID-19（Isensee et al., 2021）。近期开发了许多应用来展示 CNN 的潜力，这减少了技术人员的工作量并提高了诊断准确性。\n\
  \n然而，在真实的临床环境中，将 CNN 应用于医学影像仍面临着若干挑战。其中一个主要挑战是泛化性。CNN 在特定数据集上进行训练，当应用于来自不同来源的图像（例如使用不同成像方案或机器的医院）时，通常表现糟糕。例如，在一家医院的胸部\
  \ X 光上训练的模型可能无法很好地泛化到另一家医院的 X 光。这是因为分辨率、噪声水平或对比度在不同医院之间存在差异（Rajpurkar et al., 2017）。这种泛化能力的缺乏为医疗领域中基于\
  \ CNN 的模型带来了关键问题，因为数据集之间的变异是非常常见的。\n\n\n\n\n医学影像的另一个重大挑战在于其多模态性质。临床医生通常需要来自多种成像模态的数据来做出全面诊断（Zhou,\
  \ Greenspan, and Shen, 2017）。例如，MRI 扫描在区分不同对比度的软组织方面非常有效，而 CT 扫描则更有利于可视化骨骼结构。然而，为处理单模态数据设计的传统\
  \ `CNN` 架构难以整合多模态输入所提供的互补信息。这种整合对于创建患者状况的全面视图至关重要，特别是在诊断如癌症等复杂疾病时，因为每种模态都能揭示疾病的独特方面。Muhammad\
  \ Aamir 等（Aamir, M., et al., 2023）针对了对快速且改进的脑瘤检测的需求，以及对计算复杂度更低的诊断方法的需求，实现了约 98.98%\
  \ 的准确率。Aamir, M. 等（Aamir, M. et al., 2022）建议通过结合 `EfficientNet-B0` 和 `ResNet50`\
  \ 进行特征提取，结合精炼和对齐等创新技术，模型展示了卓越的效率和诊断可靠性。\n\n此外，`CNN` 模型的解释性在医学应用中是一个巨大的警示。这些模型通常被视为“黑箱”模型，因为它们的内部决策过程无法容易理解。这种透明度的缺乏使得医疗专业人员难以认知模型为何做出特定的决策或预测，这对于构建\
  \ AI 辅助诊断工具至关重要（Caruana et al., 2015）。通常情况下，在临床实践中，开发的模型不仅需要提供准确的结果，还需要解释该结果或预测背后的原因，这是至关重要的。\n\
  \n此外，医学图像经常受到多种因素引起的噪声的影响，例如信号采集或扫描期间患者的移动，或者成像源/设备差异。通常，`CNNs`（Tallapragada, V.\
  \ S., et al., 2024）在无噪声数据集上训练，在可能包含噪声的真实世界数据上训练时表现很差，导致假阳性或假阴性（Ghafoorian et al.,\
  \ 2017）。因此，为医学影像开发的模型必须对噪声具有稳健性，并且能够处理不同质量的图像。Aamir, M.（Aamir, M. et al., 2019）评估了一种用于图像分类的简单\
  \ `CNN` 架构的性能，并证明在 `CIFAR-10` 数据集上与现有方法相比具有优的准确率。\n\n此外，医学图像经常受到噪声的影响。这是多种因素的结果，例如扫描期间患者的移动或成像设备的差异。通常，`CNNs`\
  \ 在洁洁的数据集上训练。当它们暴露于带噪声的真实世界数据时，这阻碍了性能，导致假阳性或假阴性（Ghafoorian et al., 2017）。因此，为医学影像设计的模型必须对噪声具有稳健性，并能够处理不同质量的图像。为了应对这些挑战，本章提出了一种新的多流注意力机制\
  \ `CNN`（`MSA-CNN`）架构，用于处理多模态数据。所提的 `MSA-CNN` 架构处理多模态数据。\n\n\n\n\n本节对各种方法论、架构和数学公式进行了简要概述。基本上，CNN\
  \ 执行卷积操作，其定义如下：\n\n$$(f\\*g)(x) = {\\\\sum\\limits\\_{a}{f(a).g(x - a)}}$$\n\n…\
  \ (1)\n\n其中\n\n`f` 是输入图像，`g` 是卷积滤波器或卷积核，`x` 是图像中的当前位置，`a` 是滤波器尺寸。\n\n从公式 (1)可以看出，输出是一个卷积操作，它通过在输入图像\
  \ `f` 上平移滤波器 `g` 来提取特征，从而生成特征图。该特征图突出了显著的模式，例如边缘或纹理。在医学成像中，某些情况尤为重要，例如肿瘤或病变的识别，这些可以使用这些显著模式进行捕捉。此外，CNN\
  \ 中的池化层减少了特征图的空间维度，并通常在卷积层操作之后应用。这些池化层对数据进行下采样，如公式 (2)所示。\n\n`y` = max (`x`[`i`], `x`[`i` + 1`], ..., `x`[`i` + `k`]) )\n\
  \n… (2)\n\n此类池化操作从一组邻近像素中选择最大值，从而保留了最重要信息。这进一步有助于减少计算负载。表 1 展示了在医学成像领域使用 CNN 的近期工作对比。\n\
  \n### 表 1. 先前工作对比\n\n| 作者 (年份) || 识别的问题 || 提出的解决方案/新颖方法 || 获得的结果 || 缺点 |\n| ---\
  \ | --- | --- | --- | --- |\n| Shen 等人, 2017 || MRI 中的脑肿瘤分割 | 带有基于块输入处理的 3D CNN\
  \ 用于肿瘤分割 | 在 BRATS 数据集上实现了 0.84 的 Dice 分数 | 3D 卷积导致计算成本高 |\n| Zhang 等人, 2021 ||\
  \ 胸部 X 光中的肺炎检测 | 使用 ImageNet 迁移学习的 DenseNet | 在 ChestX-ray14 数据集上实现了 96.7% 的准确率\
  \ | 在处理噪声或低分辨率图像时表现不佳 |\n| Ronneberger 等人, 2015) || 生医学图像分割 | 具有编码器-解码器结构和跳跃连接的\
  \ U-Net 架构 | 在 ISBI 2015 上实现了 91% 的分割准确率 | 需要大量的标注数据 |\n| Lakhani & Sundaram, 2017\
  \ || 胸部 X 光中的肺炎检测 | 使用 AlexNet 和 GoogleNet 的迁移学习 | 在 NIH 数据集上实现了 92.8% 的准确率 | 对其他机构的\
  \ X 光数据集的泛化能力有限 |\n| Litjens 等人, 2017 || MRI 中的前列腺癌检测 | 手工特征提取结合深度学习的 CNN | 88.4%\
  \ 的准确率并改进了假阳性率 | 在小病变检测方面表现不佳 |\n| Wang 等人, 2018 || 胸部疾病多标签分类 | 带有图像增强的自定义 CNN 以检测\
  \ 14 种疾病 | 在 ChestX-ray14 上对多种疾病实现了 0.90 的 AUC | 模型在处理类别不平衡问题上存在困难 |\n\n### 2.2\
  \ 用于医学图像分割的 U-Net\n\n在最近，U-Net 架构不断演进，并在医学图像分割任务中显示出更好的性能。这是由 Ronneberger 等人 (2015)\
  \ [3] 提出的。它使用编码器-解码器结构，编码器通过连续的卷积和池化层提取特征，而解码器通过上采样重构图像。U-Net 的独特之处是跳跃连接，它将来自编码器的特征图与相应的解码器层相结合。这一过程确保了在重构过程中保留了细细节。U-Net\
  \ 操作在数学上定义为公式 (3)。\n\n$$y^{(l)} = \\sigma\\left(\\sum\\limits\\_{k}{W^{(l)}x^{(l)}}\\\
  right)$$\n\n… (3)\n\n其中 `x[k]` 是第 `l` 层的输入，`W(l)` 是卷积权重，`b(l)` 是偏置项，`σ` 是激活函数。\n\
  \n`x[l]` + 1 上采样\n\n… (4)\n\n该架构因能够学习精确边界而被广泛应用于医学任务。图 3 显示了 UNet 架构。第 1 层的卷积和池化操作过程在减少空间维度的同时保留了显著特征。另一方面，后期（称为扩展路径）使用第\
  \ 5 层和第 6 层提到的上采样层重构输入的空间分辨率。\n\n#### 图 3. UNet 通用示意图\n\n```\nimage/979-8-3693-9816-6.ch018.bits-pdf.xhtml\n\
  ```\n\n### 2.3 用于医学成像分类的 DenseNet\n\nDenseNet (Huang 等人, 2017) (Zhang 等人, 2021)\
  \ 在层与层之间使用密集连接，这与现有 CNN 架构不同，后者中每层仅从前一个层接收输入。其定义为：\n\n`x[l]` = `Hl`\n\n… (5)\n\n\
  \n\n\n其中 `H[l]` 是卷积、批归一化和 ReLU 的复合函数。每一层的输出都与从所有之前层处理的输入进行组合或拼接，从而实现了更高效的特征传播并缓解了梯度消失问题。网络中建立的密集连接在训练期间提供了更好的梯度流，从而导致更快的收敛速度和更高的准确率。从文献中观察到，DenseNet\
  \ 在分类任务中表现出卓越的性能，主要集中在医学图像分类。这类分类包括胸部 X 光和 CT 扫描数据集。\n\n### 图 4.DenseNet 架构。\n\n\
  ![](img/979-8-3693-9816-6.ch018.f04.png)\n\nDenseNet 也称为密集连接卷积网络（Densely Connected\
  \ Convolutional Network），是现代深度学习架构之一，旨在改进特征复用并缓解梯度消失问题。该架构由 Gao Huang 在 2017 年提出。这种架构使用了层连接。此外，传统的\
  \ CNN 每一层都接收来自上一层的输入，并在传递到下一层之前进行处理。而这种架构在密集块内部的所有层层之间建立了直接连接。换句话说，每层都接收之前所有层的特征图作为输入，并将特征图传递给所有后续层。这种结构确保了信息流在整个网络中保持稳健，从而在训练阶段导致更高效的梯度传播。该架构中的密集连接实现了大量的特征复用。这一过程减少了深度网络中的冗余问题。该架构允许每层访问之前计算的所有特征图，使得\
  \ DenseNet 架构适用于低层和高层特征。这导致了有效的学习机制和更好的特征提取。此外，与其他深度网络相比，该架构具有很高的参数效率。DenseNet 并不学习冗余特征，而是最大化对每个特征图的利用。这反过来减少了训练所需的参数数量和计算成本。\n\
  \nDenseNet 不需要过度复杂模型即可产生高度判别性的特征。图 4 所示的架构采用了批归一化、激活函数和卷积层来处理每层内的特征图。组合层或拼接层的利用是为了结合特征图，确保每一层都能直接访问来自损失函数的梯度。这一过程降低了梯度消失的概率。这使得\
  \ DenseNet 在深度学习架构中特别有用，因为传统架构在训练、稳定性和收敛方面往往面临挑战。需要注意的是，与其他复杂模型相比，DenseNet 具有产生高度判别性特征的能力。该架构采用批归一化、激活函数和卷积层来处理每层内的特征图。图\
  \ 4 所示的组合块为每一层提供了直接访问损失函数梯度的方法。这一过程降低了梯度消失的概率。这一特性也使得 DenseNet 特别适用于非常深的网络，传统架构在训练、稳定性和收敛方面往往面临挑战。观察到\
  \ DenseNet 在计算机视觉任务中具有更好的应用，包括图像分类、目标检测和语义分割。它的架构非常灵活，可以调整以满足特定的应用需求。为了说明，图 4 中显示的某些线条是从图像画到组合块的，这意味着它使用过渡层来控制特征图的大小，并进一步减少了深层网络中的计算开销。这些层包括池化和\
  \ 1 x 1 卷积等操作，用于压缩特征图并在保持关键信息的同时维持效率。\n\n### 2.4 跨模态的泛化\n\n跨成像模态的泛化一直是深度学习应用中的一个重要挑战。这在医学影像领域尤为需要解决。在特定成像模态（如\
  \ X 光）数据上训练的卷积神经网络（CNNs）在应用于其他类型模态（如 MRI 或 CT 扫描）时，往往难以获得类似的性能。这种问题由于图像分辨率、对比度、噪声模式和成像方案的固有差异产生。这些属性跨模态和机构使得模型难以学习稳健且可迁移的表示。\n\
  \n### 2.5 RESNET\n\nResNet（残差网络）基本上是一种基于卷积神经网络（CNN）的设计，解决了极深网络中的训练问题。它主要消除了梯度问题。它由\
  \ Kaiming He 在 2015 年引入。该架构基于残差学习的概念，允许信息通过跳跃连接跳过中间层，最终改善了反向传播期间的梯度流。该网络的基础单元是残差块，它包含少量卷积层和一个跳跃连接。后者在通过卷积层后将输入直接相加。这允许网络学习残差映射。网络不是学习从输入到输出的完整变换，而是专注于学习差异或残差，从而简化了优化过程。残差块通常由两个三个卷积层组成，后面是批归一化和激活函数（通常称为\
  \ ReLU 单元）。跳跃连接跳过这些层，如果维度匹配则直接提供，如果维度不同则通过 1 x 1 卷积层，如图 5\n\n\n\n该架构采用分层结构，包含多个阶段。每个阶段包含若干具有可靠特征图尺寸的残差块，这些块通过下采样层隔开。这种下采样在降低空间分辨率的同时增加了特征深度。这种分层结构确保了网络能够有效捕获低层和高层特征。该架构中引入的瓶颈块（bottleneck\
  \ blocks）通过在执行主要的 `3 x 3` 卷积之前，使用 `1 x 1` 卷积压缩特征图，然后使用另一个 `1 x 1` 卷积将其扩展，从而降低了计算成本。这种设计能够在保持准确性的同时，以更低的计算开销实现更深的网络。因此，该架构被证明是多功能的，可作为标准图像分类之外许多先进模型和任务的主干网络。该架构在保持性能的同时训练极深网络的能力，影响了诸如\
  \ `DenseNet` 和 `EfficientNet` 等后续模型的设计。\n\n经常阻碍深层神经网络训练的梯度消失问题通过 `ResNet`（残差网络）设计得到了解决，这是深度学习技术领域的一项突破性架构。何恺明（Kaiming）于\
  \ 2015 年首次提出了该架构，他及其团队通过赢得 ImageNet 大规模视觉识别挑战（`ILSVRC`）实现了一项关键里程碑。他们实现了 `3.57%`\
  \ 的前五错误率，这一表现优于人类水平。残差块是该架构相关最重要的创新。它允许信息直接跨越快捷连接（shortcut links）流动，从而使得训练超过一千层的网络成为可能。由于其可扩展性，`ResNet`\
  \ 适用于广泛的计算机视觉任务，这是该网络最大的优势之一。`ResNet-50`、`ResNet-101` 和 `ResNet-152` 变体是最广泛使用的版本，因为它们在网络深度和计算效率之间取得了平衡。图像分类、目标检测和语义分割只是这些网络被广泛采用的任务示例。\n\
  \n## 2.6 注意力机制\n\n注意力机制允许 `CNNs` 专注于图像中具有信息内容的最显著区域，以便对其进行进一步分析。这提高了处理诸如噪声图像中的肿瘤检测等挑战性任务的性能。注意力函数在数学上的定义为：\n\
  \n$$\\alpha_{i} = \\frac{\\exp(e_{i})}{\\sum\\limits_{k = 1}^{n}{\\exp(e_{k})}}$$\n\
  \n… (6)\n\n其中 `α`[`i]` 是特征权重 `h`[`i]` 的注意力权重，`υ` 和 `W` 是可学习参数。\n\n注意力机制通过集中或聚焦图像的特定区域增强或改进了可解释性。这一过程提升了模型性能，特别是在异常情况占据图像较小区域的情况下，尤其是在癌症检测中。图\
  \ 6 显示了深度学习中使用的注意力机制架构。\n\n在深度学习领域，注意力机制作为一种改变游戏规则的突破出现，提供了巨大的优势。它可以应用于需要顺序数据处理的各种任务。注意力机制最初应用于机器翻译领域。这些机制允许模型专注于输入序列的特定部分。因此，这种技术显示出其处理长期依赖能力的提升。注意力在基于自然语言处理（`NLP`）方面的工作或此类任务中的潜力，通过添加基于\
  \ transformer 的设计被观察到最新进展。此类设计的示例包括广泛使用的 `BERT` 和 `GPT` 模型。这些进展使得语言生成、摘要和翻译领域达到了顶尖水平。注意力机制在计算机视觉领域变得更加突出。这是克服卷积神经网络（`CNNs`）局限性努力的结果，并利用了\
  \ `CNNs` 的缺点。视觉 Transformer（也称为 `ViTs`）凭借其使用自注意力的能力改变了图像处理机制阶段。这被进一步用于获取全局上下文信息。与传统的\
  \ `CNNs` 不同，`ViTs` 不需要固定尺寸的内核，但它们利用注意力的优势在空间维度上动态改变焦点。通过这种技术，分类、目标检测和视频分析领域取得了显著进展。\n\
  \n## 图 6 注意力机制架构\n\n![](img/979-8-3693-9816-6.ch018.f06.png)\n\n另一个取得重大进展的领域是多模态学习。这是学习的一种形式，注意力机制允许整合多种材料，包括文本、视觉和音频。`CLIP`\
  \ 和 `DALL-E` 等模型的目的是通过自注意力与跨模态注意力相结合，建立视觉与文本表示之间的联系。内容生产、图像标注和人机交互的应用得到了改进。这为开发新方法论开辟了途径，为现实世界中的研究和应用开启了新路径。\n\
  \n最近的研究还关注注意力机制的可扩展性作为一个特定的研究领域。传统上自注意力计算随输入大小呈二次方增长。这在处理大型数据集和高分辨率图像时带来了挑战。为了减少计算开销或在保持模型性能的同时降低侧的计算复杂性，研究人员提出了各种创新。这些创新包括稀疏注意力、线性注意力和分层注意力。这些发展对于在资源有限的系统等场景中成功部署注意力模型是至关重要的。此外，注意力机制已用于强化学习，使得改进计算复杂、复杂的现实世界场景中的决策成为可能。注意力驱动的模型提高了学习策略的效率和有效性，因为它们使智能体能够关注状态空间中最相关的方面。\n\
  \n\n\n卷积神经网络的引入彻底改变了医学影像领域，它在分割、分类和检测等多种任务中提供了最先进的性能。最近的进展，例如用于分割的 `U-Net`、用于分类的\
  \ `DenseNet` 以及注意力方法，显著提高了系统的准确性与鲁棒性。然而，在数据可用性、跨不同模态的泛化能力以及计算成本方面，仍有待克服的障碍。未来，研究应该集中在建立能够跨多种成像模态进行高效泛化的模型上，并提高这些模型的可解释性。\n\
  \n# 3. 医学影像中的研究空白\n\n根据文献综述，卷积神经网络（`CNNs`）及其衍生技术或模型在应用于医学影像领域时显示出显著的改进。这些应用涵盖了从分类到检测的范围，也可以用于分割。然而，若干挑战和局限性仍然存在，当务之急是解决这些挑战，以充分发挥\
  \ `CNNs` 在医学领域的潜力。这些挑战源于数据可用性、模型可解释性、跨数据集的泛化能力、计算成本以及现实世界医学应用的复杂性等因素。本节详细阐述了基于 `CNN`\
  \ 的医学影像中的关键问题和研究空白。\n\n## 3.1 数据稀缺与标注挑战\n\n数据稀缺是每位研究人员面临的最突出挑战之一。这在使用卷积神经网络（`CNNs`）进行医学影像分析时构成了巨大挑战。与其他领域不同，在医学领域寻找大型且多样化的数据集往往是不可行的，并且受到严格法规和隐私考虑的限制。收集数据需要伦理批准和患者同意。这限制了处理过程的速度，也进一步限制了公开访问的医学数据集的可用性。此外，罕见病或易发状况增加了另一层难度，因为它们发生频率低，带来了挑战。这意味着此类病例的数据集本质上很小且缺乏多样性。这种稀缺会负影响\
  \ `CNN` 模型的泛化能力，进一步导致过拟合并降低在未见数据上的性能。\n\n标注挑战增加了医学影像分析的难度。此类医学影像的标记通常需要经过培训的专家或放射治疗领域的专业人士。此类任务看似既耗时又昂贵，但是非常必要的，因为标注和标记为现有数据提供了某些真值（groundtruth）。此外，即使在专家之间，标注也可能存在差异。这是由于解释上的差异，特别是对于复杂或模糊的病例。高观察者间变异会向训练数据中引入噪声，从而影响\
  \ `CNN` 模型的可靠性。此外，创建细粒度的标注（例如分割肿瘤或其他异常情况）需要大量精力，进一步增加了标注者的负担。这些挑战强调了开发创新解决方案重要性，以同时解决医学影像分析中的数据稀缺和标注局限性问题。\n\
  \n## 3.2 缺乏大型标注医学数据集\n\n`CNNs` 在医学影像中成功部署面临的最重大障碍之一是大型标注数据集的可用性有限。医学数据通常是稀缺的，特别是在放射学等领域，图像必须由专家临床医生进行标注。手动标注耗时且昂贵，需要高度专业的知识。例如，在肿瘤分割任务中，对肿瘤边界的精确勾定需要临床专业知识，这使得难以扩展大型训练数据集的创建。\n\
  \n许多 `CNN` 架构（如 `U-Net` 和 `DenseNet`）需要大量的标注数据以避免过拟合并在不同数据集上良好地泛化。与包含数百万张标注图像的 `ImageNet`\
  \ 等自然图像数据集相比，医学数据集通常要小得多。例如，[Shen 等人 (2017)] 用于 3D `CNN` 训练的 `BRATS`（脑肿瘤分割）数据集仅包含数百个示例，这对于有效训练深层网络构成了显著限制。\n\
  \n## 3.3 数据不平衡\n\n目前的研究主要集中在医学影像分析上。在这一阶段，医学数据集在获取或通过代理获得的数据上往往面临类别不平衡的挑战。这在罕见病的情况下尤为明显，因为与其他疾病相比，这些疾病的比例较低。例如，在胸部\
  \ X 光数据集中，与健康图像相比，肺炎图像在数据集中所占的比例小得多。值得注意的是，[Wang 等人 (2018)] 在此类具有较差或代表不足类别的数据集上训练了\
  \ `CNN` 模型，这可能导致预测偏差。这在医疗保健部门至关重要，因为在那里检测罕见但影响严重的情况也非常重要。\n\n## 3.4 限制的公开可用多模态数据\n\
  \n医学影像通常涉及多种模态（例如 `CT`、`MRI`、超声）。这些模态为医学影像的分析提供了独特的见解，因为它们充了特定疾病的标签。然而，由于医学领域的限制，公开可用的多模态医学数据集的使用日益困难，这使得难以训练近期开发的用于分析的模型。这些模型侧重于融合来自不同模态的数据，从而创建一种用于疾病即时预测的新型架构。由于缺乏公开的数据集，健壮模型的开发受到了限制并面临着挑战。\n\
  \n## 3.5 模型的可解释性与可信度\n\n`CNNs` 虽然功能强大，但通常被称为“黑箱”模型，因为它们的决策过程人类并不易于解释。在事量极大的医学影像领域，这种透明度的缺乏为临床采用构成了重大障碍。临床医生需要信任并理解\
  \ AI 模型做出的预测结果，以便将它们用于关键决策过程。\n\n例如，Esteva 等人 (2017) 开发了一种 `CNN`，它在分类皮肤癌方面达到了皮肤科医生水平的准确率，但没有解释为何或如何做出某些决策。在临床环境中，这种可解释性的缺乏可能会导致问题，因为医生通常需要向患者和其他医疗提供者解释诊断。\n\
  \n虽然注意力机制和如 `Grad-CAM`（梯度加权类激活映射）等技术已被引入以为 `CNN` 预测提供视觉解释，但这些方法距离提供完全的可解释性仍然很远。这些方法大多突亮了\
  \ `CNN` 关注的图像区域，但对于决策背后的高层推理提供见解。\n\n## 3.3. 跨不同医学数据集和模态的泛化\n\n\n\n\n文献中识别的关键问题之一是\
  \ `CNNs` 在不同医学数据集和成像模态之间缺乏泛化能力。在特定数据集上训练的 `CNNs` 通常在这些数据集内部表现良好，但当应用于来自不同来源、机构或成像设备的图像时，往往会显得力不从心。\n\
  \n例如，Lakhani and Sundaram (2017) 证明了他们的 `CNN` 模型在 `NIH ChestX-ray14` 数据集上通过胸部 X\
  \ 光片检测肺炎方面达到了高准确率，但在测试来自不同医院的数据时，该模型的性能会显著下降。这凸显了成像方案、设备和患者人口统计学差异所带来的挑战。为了使 `CNNs`\
  \ 具有临床应用价值，它们必须在不同的人口和成像环境中具有泛化能力，而这目前是一个主要的局限性。\n\n基于这些研究空白，现在让我们来定义问题定义和解决方案。在人工智能（AI）和深度学习（DL）领域，取得了显著的进展，可以解决复杂的现实世界问题。随着技术进步的持续，许多任务仍然需要处理多样化的多模态数据流，这给传统的\
  \ `CNNs` 和其他基准技术带来了挑战。因此，在这种背景下，基于多流注意力的 CNN（`MSA-CNN`）应运而生，并通过结合多流处理和注意力机制的优点来解决这些缺点。本节详细阐了当前方法的核心挑战和局限性，并定义了\
  \ `MSA-CNN` 试图解决特定问题。\n\n现代机器学习中最突出且最重要的挑战之一是多流数据的有效集成，指的是包含多种模态或具有多样化特征的不同类型图像数据集。例如，在视频分类等任务中，系统必须处理空间信息和来自帧序列的时间信息。同样，在多模态学习中，数据可能从不同的传感器获取且类型各异。这些数据涵盖图像、文本、音频等，每种都带有互补但不同的信息。处理这些多样化的数据具有挑战性，因为每种模态或特征类型都有其独特的特性，需要特殊的预处理技术和进一步的分析算法，通过处理此类数据来提供更高的准确性。\n\
  \n现有的基准技术擅长从图像中提取空间特征，但它们缺乏适应异构输入数据流的灵活性。它们通过单一流水线处理数据，这在涉及多个模态时会导致价值信息的丢失。在没有定义方法的情况下，模型可能会将提取的所有输入特征视为均匀的，从而导致学习效果欠佳且准确率降低。因此，这个问题的一个关键方面是开发一种能够并行处理的架构，其中每个流都关注特定类型的数据，以确保每个模态的独特属性得到保留。\n\
  \n\n\n在中心或全局层面的另一个挑战是从获取的噪声数据或无关数据中区分、差异化或识别出相关的特征。随着输入数据复杂性的增加，模型在为特定任务优先考虑最重要元素方面面临困难。一个众周知的事实是，随着数据集规模的增大，分类错误也会之增加。例如，在含有噪声或杂乱图像的目标检测中，输入中的许多区域可能对检测任务没有实质性的贡献。同样，在多模态数据场景中，并非所有模态对输出都具有同等的相关性。在这种下，注意力机制已被证明是解决这些挑战的有力工具，并被应用于所提的技术中。通过对提取的特征或输入的分割区域进行动态权重分配，注意力机制允许模型关注最关键的区域或特征，同时抑制无关特征。\n\
  \n仍然存在另一个问题。在多流框架中引入注意力机制会增加额外的复杂性。这些机制必须跨流运行，并在单个流内运行，这需要精细的设计，以确保注意力系统与网络的整体目标一致。此外，这种注意力机制结合带来的额外计算开销或计算复杂度可能会阻碍其在移动设备或嵌入式系统等资源受限环境中的实用性。因此，问题在于如何创建一个既能在关注相关特征方面有效，又在计算上高效的注意力框架。\n\
  \n除了特征选择外，多流学习中的另一项关键挑战是上下文依赖关系的获取。各种任务（如视频分析、语音识别和情感分析）都需要理解单个流内部以及多个流之间数据点之间的关系。在视频分析中，理解动作序列需要对时间关系进行建模；而在多模态背景下，文本与图像之间的对齐对于字幕生成等任务至关重要。传统的\
  \ `CNNs` 在捕捉此类相关性方面具有内在局限性，因为它们主要执行关注输入受限区域的局部操作。虽然循环神经网络（`RNNs`）和 `transformers`\
  \ 通过对时间和序列链接进行建模缓解了某些局限性，但将这些能力整合到多流架构中是非常复杂的。目标是创建一个能够同时处理多流数据、捕捉每个流内部长距离依赖并对齐流间关系的模型。这种复杂性强调了对一种结合了\
  \ `CNNs`、注意力机制和先进序列建模技术优势的新方法的需求。\n\n这件事的一个至关重要的方面是使模型效能与计算效率保持对齐。由于整合了许多处理流水线，多流架构本质上增加了计算复杂度。注意力过程的整合通过为注意力权重的计算和利用引入额外的层，加剧了这种复杂性。尽管研究环境中提供了大量的计算资源，但许多实际应用（如自动驾驶汽车、实时视频处理和可穿戴技术）都需要在严格的资源限制内运行的模型。目标是优化\
  \ `MSA-CNN` 架构，以实现精度与效率之间的平衡。这包括轻量级注意力机制的设计、减少多流处理中的冗余，以及实施模型剪枝或量化等技术。确保可扩展性至关重要，因为模型必须适应不同水平的输入复杂度，而不需要进行实质性的修改。\n\
  \n尽管神经网络架构取得了显著进展，但在处理多流和基于注意力的学习的错综性方面，仍存在相当的缺陷。传统的多流模型在整合流间信息方面的技术通常表现不佳。它们独立地处理每个流并在后期阶段包含其输出，这可能导致关键的流间依赖关系的丢失。同样，几种基于注意力的模型是为单流数据设计的，它们向多流的适应需要额外的进展。另一个局限性是现有模型的泛化能力。许多技术是为特定目的或数据集定制的，使得它们在应用于新或多样化问题时效果较差。为图像-文本集成设计的范式在不进行重大重构的情况下，在视频-音频情况下可能会表现出次优。这种僵性凸显了对能够处理各种任务和数据类型的灵活框架的需求。\n\
  \n通过解决传统 `CNNs` 的局限性并利用多流和基于注意力的学习的优势，`MS-CNN`（所提的技术或框架）为复杂的多模态数据处理任务提供了一个稳健的解决方案。它特别适用于视频分析、多模态情感检测和传感器数据融合等应用，在这些应用中，处理多样化数据对于成功至关重要且关键。\n\
  \n## 4. 多流注意力卷积神经网络 (MSA-CNN)\n\n本节概述了所提的新型架构——多流注意力卷积神经网络 (`MSA-CNN`)，该架构的设计和开发旨在解决在前述节中识别的关键问题。该架构使用单独的卷积流整合多模态医学图像处理（例如\
  \ `MRI`、`CT`、`X-ray`）。随后通过注意力机制结合每种模态的最相关特征。所提的技术旨在提高跨多样化数据集和医学成像模态的泛化能力，通过引入噪声感知损失函数解决噪声或低质量图像问题，通过识别对模型预测贡献最大的图像区域的注意力机制来增强可解释性，并通过迁移学习和注意力机制减少对大型标注数据集的需求。\n\
  \n多流注意力卷积神经网络 (`MSA-CNN`) 标志着深度学习领域的一个重要发展。它解决了与有效处理多模态和多流数据相关的挑战。与被观察到提取空间特征非常有效的传统卷积神经网络\
  \ (`CNNs`) 不同，后者在处理异构数据时往往力不从心。此类数据来自多种模态或特征类型，如图像、音频、文本或时间数据。这些局限性的出现是因为传统 `CNNs`\
  \ 通过单一流水线处理数据，导致了数据内部及流之间独特特性和依赖关系的丢失。`MSA-CNN` 通过引入集成了注意力机制的多流架构解决了这些缺陷。这允许模型能够动态关注当前任务最相关的特征。\n\
  \n\n\n\n`MSA-CNN` 的一项核心创新在于其多流设计。该设计使用了多个数据流，并进行并行处理。每个流都经过定制，以处理特定类型的输入。这些输入可能可能是来自图像的空间特征，也可能是来自视频的时间序列。例如，在视频处理中，一个流可能侧重于从单帧中提取空间细节，而另一一个流则捕捉连续帧之间的时间动态变化。这确保了每种模态的独特特征能够被保留并进行独立处理，从而防止了单流架构中可能出现的干扰或信息丢失。由于每个流都是自主处理的，`MSA-CNN`\
  \ 增强了模型从多样化输入中提取有效模式和特征的能力。\n\n除了特征选择外，所提技术的一个关键问题是上下文依赖的获取。各种任务（包括视频分析、语音识别和情感分析）都需要理解输入数据之间、或者单流内部数据点之间以及跨流之间的关系。在视频分析中，理解动作序列需要对时间关系进行建模。这在多模态语文中有所不同，文本与图像之间的对齐对于字幕生成等任务至关重要。传统的\
  \ `CNNs` 由于其主要关注输入的受限部分且采用局部局部操作，因此捕捉此类链接的能力从本质上说是有限的。\n\n虽然循环神经网络 (`RNNs`) 和 `transformers`\
  \ 通过建模时间及序列链接缓解了某些局限性，但将这些能力整合到多流架构中是非常复杂的。其目标是开发一种能够同时处理多流数据、捕捉每个流内部长程依赖并对齐流间关系的模型。这种复杂性强调了对一种新方法的需求，即结合\
  \ `CNNs`、注意力机制和高级序列建模技术的优点。这个问题的一个至关重要的方面是将模型效果与计算效率相统一。多流设计由于涉及许多处理流水线，固有增加了计算复杂度。注意力过程的集成通过引入用于计算和利用注意力重的额外层进一步强化了这种复杂性。尽管研究环境中拥有大量的计算资源，但某些实际应用（如自动驾驶、实时视频处理和可穿戴技术）需要在严格的资源下运行模型。目标是优化\
  \ `MSA-CNN` 架构，以实现准确性和效率之间的平衡。这包括开发轻量级注意力方法、减少多流处理中的冗余，以及实施模型剪枝或量化等技术。确保可扩展性至关重要，因为模型必须适应不同水平的输入复杂度，而不需要进行重大修改。尽管神经网络架构取得了显著进展，但在处理多流和基于注意力的学习的复杂性方面仍存在相当的缺陷。传统的多流模型在整合跨流信息方面的技术往往表现不足。它们独立地处理每个流并在后期阶段包含其输出，这可能导致关键流间依赖的丢失。同样，若干基于注意力的模型是为单流数据设计的，它们向多流的适应需要额外的进展。另一个局限性是现有模型的泛化能力。许多技术是针对特定用途或数据集定制的，使得它们在应用于新问题或多样化问题时效果较差。为图像-文本集成设计的范式在不进行重大重工程的情况下，在视频-音频情况下可能会表现出次优性能。这种僵性凸显了对能够处理各种任务和数据类型的灵活框架的需求。图\
  \ 7 显示了所提 `MSA-CNN` 的框图。\n\n#### 图 7。所提技术的框图。\n\n![](img/979-8-3693-9816-6.ch018.f07.png)\n\
  \n所提技术由多流输入组成，如 MRI、CT 和 X 射线，这些通常提供互补信息。例如，流 1 处理如 MRI 等高分辨率图像，而流 2 处理如 X 射线等低分辨率或噪声图像。然后使用\
  \ `CNN` 对这些处理，在这里被称为 `Multi-Stream Convolutional`（多流卷积）层。这些层提取特定模态的特征。\n\n\n\n\n\
  其中 `y[i]` 是输入 `i` 的真实标签，`P[i]` 是类别 `i` 的预测概率，`N(X[i])` 是一个估计图像 `X[i]` 中噪声水平的函数，`λ`\
  \ 是控制噪声惩罚重要性的超参数。该损失函数在噪声图像上发生分类错误时会对其进行更严厉的惩罚，从而使模型对图像质量的变化更具鲁棒性。表 2 显示了所提技术的算法。\n\
  \n#### 表 2. 所提技术的算法\n\n| 针对 MSA-CNN 的算法 |\n| --- |\n| 输入：多模态医学图像（例如 MRI、CT、X 射线）\
  \ <br>输出：预测类别或分割图 <br>1. 为每个特定模态的流初始化 `CNN` 参数（MRI 使用流 1，CT 使用流 2 等） <br>2. 对于 {1,\
  \ 2, ..., n} 中的每个模态 `i`： <br>a. 从 `CNN_i` 为输入 `X_i` 提取特征图 `F_i`：<br>`F_i = CNN_i(X_i)`\
  \ <br>b. 存储特征图 `{F_1, F_2, ..., F_n}` <br>3. 应用注意力机制计算注意力权重 `{α_1, α_2, ..., α_n}`：<br>对于每个特征图\
  \ `F_i`：<br>`α_i = softmax(W_i^T F_i)` <br>4. 计算最终的融合特征图 `F_final`：<br>`F_final\
  \ = Σ(α_i * F_i)` 对于 `i` 在 {1, 2, ..., n} <br>5. 将 `F_final` 通过通过全连接层进行分类：<br>`P\
  \ = softmax(W_fc * F_final + b_fc)` <br>6. 计算感知感知损失：<br>`L = CrossEntropyLoss(P,\
  \ y) + λ * NoisePenalty(X)` <br>7. 使用反向传播和梯度下降更新 `CNN` 权重。 <br>8. 输出预测类别或分割图。 |\n\
  \n#### 5. 结果与讨论\n\n`MSA-CNN` 的性能通过三个公开的多模态医学图像数据集进行了测试和评估。每个数据集都包含来自不同模态（如 MRI、CT\
  \ 和 X 射线）的图像。初始步骤是预处理，确保输入维度在不同模态之间是统一的。在胸部 X 射线肺炎数据集上评估了 `MSA-CNN` 的性能。结果在准确率、敏感性、特异性和\
  \ AUC（ROC 曲线下面积）方面与 `AlexNet` 和 `ResNet-18` 等标准 `CNN` 模型进行了比较，并列于表 3。\n\n#### 表\
