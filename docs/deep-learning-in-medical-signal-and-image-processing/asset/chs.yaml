  ## 第 19 章\n\n# 用于医学影像增强图像去噪的波变换-自编码器混合模型\n\nHewa Majeed Zangana\n\n![Orcid Imagehttps://orcid.org/0000-0001-7909-254X](https://orcid.org/0000-0001-7909-254X)\n\
  \n杜霍克理工大学，伊拉克\n\nFiras Mahmood Mustafa\n\n杜霍克理工大学，伊拉克\n\n### 摘要\n\n本章提出了一种新型混合方法，结合了波变换的优势与自编码器网络的强大学习能力，以实现卓越的去噪性能。通过利用波分解对图像进行多尺度处理，并将这些分解后的信号输入深度自编码器网络，我们在抑制噪声的同时保留了高频细节。大量实验表明，我们的方法优于现有技术，在峰值噪声比（`PSNR`）和结构相似性指数（`SSIM`）方面都有显著提高。结果表明，波变换与自编码器网络的集成为鲁棒图像去噪提供了一种良好的解决方案，特别是在复杂噪声模式的场景下。\n\
  \n### 1 引言\n\n图像去噪是计算机视觉的一项基础任务，对于通过消除噪声保留边缘和纹理等重要特征来提高图像质量至关重要。图像中的噪声由于环境条件、传感器限制或传输错误可能会降低图像质量，并影响后续的检测、分割和识别等高级任务(Goyal\
  \ 等人，2020)多年年来，人们开发了各种方法来应对这一挑战，从传统的滤波技术到先进的深度学习模型比应有许多。\n\n\n\n\n\n# 引言\n\n图像去噪的经典技术之一是波变换（`WT`），它在多尺度分析和噪声抑制方面表现出色（Averbuch\
  \ 等人，2022; Guan 等人，2021)）。波变换允许将图像分解为不同的频率分量，能够分离并减少存在于尺度上的噪声（Kumar 等人，2021; Aamir\
  \ 等人，2019）。这种方法在保留重要图像特征方面证明了有效性，特别是在边缘和纹理等高频分量中（Chakraborty 等人，2020; Yan 等人，2023）。然而，基于波的方法在处理更复杂的噪声结构时往往表现不佳，导致精细细节的丢失和图像整体锐度的下降（Cengiz\
  \ 等人，2022; You 等人，2023）。\n\n近年来，深度学习，特别是卷积神经网络（`CNNs`），已成为图像去噪的强大工具（Liu 等人，2020;\
  \ Aamir 等人，2019）。基于 CNN 的模型能够从噪声数据集中学习复杂的模式，使其在区分噪声和真实图像内容方面非常非常有效（Ghose 等人，2020;\
  \ Roy 等人，2021）。自动编码器网络作为一种为无监督学习设计的神经网络架构，通过学习输入数据的紧凑表示，被证明在去噪任务中特别有用（Arab 等人，2022;\
  \ Ilesanmi & Ilesanmi, 2021）。然而，深度学习方法虽然在降噪方面有效，但往往受到过度平滑的影响，导致纹理和尖锐边缘等高频细节的丢失（Zhou\
  \ 等人，2022）。\n\n为了解决传统方法和基于深度学习方法的局限性，研究者提出了结合多种技术优势的混合方法。例如，将波变换与深度学习架构相结合在增强图像去噪性能方面显示出了具有前景的结果（Bao\
  \ 等人，2020; Shukla 等人，2023)）。在这些混合模型中，波变换通常用于预处理图像并分离不同频率的噪声，而深度学习模型通过从数据中学习复杂模式来精炼去噪过程（Paul\
  \ 等人，2022）。这种互补方法有效地平衡了噪声抑制和细节保留。\n\n## 提出的方法\n\n在本章中，我们提出了一种整合波变换与自动编码器网络的新型去噪方法，旨在利用这两种技术的优势。波变换用于预处理图像并分离不同频率的噪声，而深度学习模型通过从数据中学习复杂模式来精炼去噪过程。这种互补方法有效地平衡了噪声抑制和细节保留。\n\
  \n本章的贡献如下：\n\n1. 我们提出了一种整合波变换与自动编码器网络的新型去噪方法。\n2. 我们证明了这种方法如何有效地平衡噪声抑制和细节保留。\n3.\
  \ 我们与最先进技术相比对所提方法进行了全面的评估。\n\n本章的其余部分安排如下：第 2 节讨论相关工作；第 3 节介绍提出的方法；第 4 节提供实验结果。最后，第\
  \ 5 节总结了本章并概述了未来的方向。\n\n\n\n\n深度学习也越来越多地应用于图像去噪任务。Ghose et al. (2020) 使用 `CNNs`\
  \ 进行图像去噪，而 Goyal et al. (2020) 对经典和最先进的图像去噪方法进行了广泛回顾，强调了深度学习对该领域的变革性影响。Liu et al.\
  \ (2020) 进一步探索了去噪与高层视觉任务之间的联系，证明了去噪技术如何增强后续计算机视觉任务的性能。\n\nChakraborty et al. (2020)\
  \ 为该领域做出了独特贡献，了一种基于量子小波变换的图像去噪技术。这项工作通过引入新的量子信号处理技术，强调了量子计算革新降噪方法的潜力。\n\n除了医学和通用图像处理外，小波变换已有效集成到人脸识别系统中。例如，Liang\
  \ et al. (2021) 开发了一个结合 `wavelet transform` 和 `principal component analysis` 的框架，用于不同光照变化条件下的人脸识别；而\
  \ He et al. (2023) 应用 `wavelet-based convolutional networks` 进行人脸反伪检测。\n\n多项研究聚焦于将\
  \ `wavelet transform` 与深度学习模型相结合以增强图像去噪性能。Tian et al. (2023) 使用 `wavelet transform`\
  \ 开发了一种多阶段图像去噪模型，显著提高了在不同噪声水平下的去噪性能。Zhou et al. (2022) 探索了结合深度学习与 `sparse representation`\
  \ 的混合模型进行去噪，强调了该模型在轴承故障诊断中的适用性。\n\n去噪算法的最新进展还包括 Pang et al. (2021) 提出的用于受损到恢复循环数据场景中图像去噪的无监督深度学习模型。该模型展示了深度学习与传统去噪技术结合时的鲁棒性。此外，Mustaqim\
  \ et al. (2022)](#979-8-3693-9816-6.ch019.bits-pdf.xhtml#_idTextAnchor1113) 提出将\
  \ `wavelet transformation` 结合 `local binary pattern` 用于基于深度学习的人脸识别系统中的数据增强，证明了这些方法如何结合以提高性能。\n\
  \n`wavelet transform` 与深度学习模型的集成已成为图像处理中的一种强大方法，特别适用于去噪任务。`wavelet transform` 以其能够将图像分解为多分辨率频率分量的能力而闻名，这补充了深度学习模型学习数据中复杂层次模式的能力。这种混合方法利用了两种技术的长处，在保留图像关键细节的同时实现了有效的降噪，这在医学成像中特别有价值。\n\
  \n最近的研究证明了将 `wavelet transforms` 与深度学习相结合以提高去噪性能的有效性。例如，Khan & Mohanta (2019) 探索了在混合模型中使用\
  \ `wavelet transforms`，强调了小波隔离不同频段噪声的能力，而深度学习模型随后对其进行精细化处理。另一 Anwar et al. (2019)\
  \ 的研究强调了这种混合技术的效率，显示了 `wavelet-based preprocessing` 如何增强深度学习架构在噪声易发环境中的特征提取能力。\n\
  \n通过引入 `wavelet decomposition`，所提出的模型可以在多个尺度上处理图像，在高频分量中孤立噪声，而深度学习网络则关注低频分量以保持结构的完整性。这些最近的研究强化了这种混合方法的有效性，强调了其对医学成像中经常遇到的复杂噪声条件的适用性。\n\
  \n总而言之，文献强调了将传统信号处理技术（如 `wavelet transforms`）与尖端深度学习架构相结合的混合模型在图像去噪和分类中的重要性。\n\n\
  ### 3 方法\n\n本节详细说明了用于开发和评估新型去噪的方法，该方法结合了 `wavelet transform` 和 `autoencoders`。\n\
  \n#### 3.1 数据预处理\n\n用于训练和评估的数据集由通用和医学图像组成，来源于公开数据集。这些数据集的选择是为了确保多样化的噪声模式和图像类型。\n\
  \n- NIH 胸光：该数据集包含 100,000 张标注的胸光图像，适用于测试医学图像的去噪有效性。https://www.kaggle.com/datasets/nih-chest-xrays\n\
  - BraTS（脑胶瘤分割）：BraTS 数据集提供了带有胶质标记的 MRI 扫描，为脑部去噪和分割提供了数据。https://www.med.upenn.edu/cbica/brats2020/data.html\n\
  - DDSM（数字筛查摄影数据库）：该数据集包含用于乳腺癌筛查的乳腺摄影图像，具有良性和恶性标签，允许对高分辨率乳腺进行去去噪。https://www.kaggle.com/datasets/ddsm-mammography\n\
  - LUNA16（2016 年肺结节分析）：LUNA16 关注于 CT 扫描中的肺结节检测，使其适用于低剂量 CT 成像的去噪应用。https://luna16.grand-challenge.org/\n\
  - AIDR（美国放射学院数据科学）：一个包含多种标注医学图像的综合库，适用于医学成像的通用机器学习应用。https://www.acrdsi.org/DSI-Services/Data-Science-Resources\n\
  \n为了一致性，所有图像在处理前都经过了尺寸调整和归一化。人为引入噪声模拟不同的真实场景，包括高斯噪声、盐椒噪声和泊松噪声。这些预处理步骤确保了模型对通用和医学成像背景下不同噪声条件的适应性。\n\
  \n#### 3.2 小波变换模块\n\n\n\n在去噪过程的第一阶段，对噪声图像应用了多级离散小波变换（`DWT`）。`DWT` 将每个图像分解为若干子带，这些子带能够捕获低频和高频成分，这在之前的图像处理工作中所已有利用（Zhou\
  \ 等人，2023；Aamir 等人，2019）。通过使用 `Haar` 或 `Daubechies` 小波，该方法能够有效识别图像高频成分中存在的噪声。对于该模型，执行了三层小波分解，以捕捉不同程度的细节。近似系数（低频）传递到下一阶段，而细节系数（高频）则使用软阈值进行选择性去噪，这是基于小波去噪的常用方法。\n\
  \n#### 3.3. 自编码器网络\n该方法的核心组件是自编码器网络。采用深度卷积自编码器从小波变换后的输入重建去噪后的图像。自编码器已证明去噪任务中是有效的（Vincent\
  \ 等人，2010），且该架构专门设计用于处理小波变换产生的近似系数。由 Hinton（2010）引入的 `ReLU`（线性线性单元）激活函数被用于编码器层，以防止梯度消失并加速收敛，使其对深度学习模型特别有效。自编码器由以下组成：\n\
  \n- 编码器（Encoder）：一系列卷积层，旨在将近似系数压缩到低维潜空间，在保留关键特征的同时去除噪声。该结构基于 Hinton 等人（2020）提出的架构，并添加了批归一化（batch\
  \ normalization）和 `ReLU` 激活函数以改进收敛并避免过拟合。\n- 解码器（Decoder）：解码器从压缩的潜表示重建去噪后的图像。它利用上采样层结合转置卷积将图像恢复到原始分辨率，与编码器的架构反向镜像。\n\
  \n##### 3.3.1. 所提系统\n所提的去噪系统旨在高效去除噪声的同时保留关键细节。如图 1\n\n#### 3.4. 训练与优化\n使用噪声图像数据集及其对应的清洁图像作为真值对模型进行训练。采用的损失函数是均方误差（`MSE`），它最小化了去噪图像与清洁图像之间的像素级差异。此外，使用了结构相似性指数（`SSIM`）作为次要指标来评估去噪图像的结构保真度，与\
  \ Lin 等人（2022）的工作一致。\n\n对于优化，使用了 `Adam` 优化器，学习率设置为 `0.0001`，批量大小为 `64`。模型在 NVIDIA\
  \ GPU 上训练了 150 个轮次（epochs），并根据验证损失应用了早停，类似于近期去噪研究中采用的方法（Zhang & Wu, 2023）。在训练期间，采用了随机旋转和翻转等数据增强技术来增强模型的泛化能力，正如\
  \ Shorten & Khoshgoaar（2019）所建议。\n\n#### 3.5. 去噪与重建\n训练后，去噪过程涉及两个步骤：\n\n1. 小波变换去噪：首先使用\
  \ `DWT` 将噪声图像分解为近似系数和细节系数。对细节系数进行选择性阈值以去除高频噪声。\n2. 自编码器去噪：然后将阈值化的近似系数通过训练过的自编码器，在低频水平进一步精炼并去噪图像。\n\
  \n一旦处理完系数，应用逆离散小波变换（`IDWT`）来重建去噪图像，结合处理后的近似系数和细节系数。\n\n#### 3.6. 模型评估\n使用标准指标如峰值信噪比（`PSNR`）和\
  \ `SSIM` 对所提去噪方法进行评估，这些指标通常用于评估去噪任务中的图像质量（Bovik 等人，2021）。该方法与几种先进的去噪算法进行了比较，包括传统的小波阈值方法（Dabov\
  \ 等人，2007）和基于深度学习的方法（Zhang 等人，2022）。\n\n进行了详细的消融实验，以研究每个模块（小波变换和自编码器网络）对整体去噪性能的贡献。该分析表明，将小波变换与自编码器网络相结合产生的结果优于单独使用任一种技术。\n\
  \n#### 3.7. 实验设置\n实验在高性能计算环境中进行，配备了硬件和软件软件包，以处理训练和测试的计算需求。\n\n1. 硬件配置\n- GPU：NVIDIA\
  \ GeForce RTX 3090，配备 24 GB 内存，能够实现高效并行处理和更快的模型训练。\n- CPU：Intel Core i9-11900K，具有\
  \ 16 个线程，为数据预处理和其他串行任务提供高单线程性能。\n- RAM：64 GB DDR4，确保为大型图像数据集和中间处理提供足够的内存。\n- 存储：2\
  \ TB SSD，用于快速数据访问和进行 I/O 操作，减少数据处理中的延迟。\n\n2. 软件软件包\n- 操作系统：Ubuntu 20.04 LTS，提供稳定的\
  \ Linux 环境，并对机器学习库有强力支持。\n- 编程语言：Python 3.8，因其丰富的机器学习库和与深度学习框架的易于集成性而被选中。\n- 机器学习框架：\n\
  \    - TensorFlow 2.5：用于构建和训练自编码器网络，利用 GPU 加速处理深度学习任务。\n    - Keras：运行在 TensorFlow\
  \ 之上的高层 API，便于模型的设计和部署。\n\n\n\n在本节中，我们对所提出的图像去噪方法进行了定量和定性评估，该方法将小波变换与自动编码器网络相结合。我们将结果与最先进的去噪方法进行了比较，并从去噪性能、图像细节保留以及计算效率等方面讨论了这种混合方法的有效性。我们还提供了详细的表格，展示了在多个指标上的性能。\n\
  \n## 4.1 定量评估\n\n我们使用了两种广泛认可的图像质量评估指标对所提方法的性能进行了评估：峰值信噪比（`PSNR`）和结构相似性指数（`SSIM`）。这些指标为去噪过程的有效性提供了客观衡量。\n\
  \n- `PSNR`: `PSNR` 值越高表示图像质量越好，重建图像中的噪声越少。以分贝（`dB`）表示。\n- `SSIM`: `SSIM` 衡量去噪图像与真值图像之间的结构相似性。其范围在\
  \ 0 到 1 之间，1 表示完全相似。\n\n### 4.1.1 数据集与噪声水平\n\n实验在三个数据集上进行：`MNIST`、`CIFAR-10` 和 `ImageNet`。我们在图像上应用了三种类型的噪声：高斯噪声、盐噪声和泊松噪声。对于每种类型的噪声，我们改变了噪声强度，例如：\n\
  \n- 标准差为 15 和 25 的高斯噪声。\n- 损坏率为 10% 和 20% 的盐噪声。\n- 具有不同强度因子的泊松噪声。\n\n### 4.1.2 性能比较\n\
  \n该方法与四种基准去噪方法进行了比较：\n\n1. `BM3D` (Dabov et al., 2007)\n2. `DnCNN` (Zhang et al.,\
  \ 2017)\n3. `小波阈值法` (`WT`） (Donoho, 1995)\n4. `纯自动编码器去噪` (Vincent et al., 2010)\n\
  \n下表总结了不同方法在所有三个数据集及不同噪声水平下的 `PSNR` 和 `SSIM` 值。\n\n#### 表 1. MNIST 数据集上的 PSNR 比较\n\
