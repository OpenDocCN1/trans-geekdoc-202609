  #### 2.7. 激活残差注意力网络 (PRAN)\n\nPRAN 是一种结合了残差网络原理和注意力机制的深度学习算法。它的设计是为了目标检测、图像重建和分类等任务中表现良好\
  \ (Gao et al., 2019)。该模型用于分类高光谱图像。一组高光谱图像表示为 $D\\in\\mathbb{R}^{H\\times W\\times\
  \ B}$，其中 $H$ 是高度，$W$ 是宽度，$B$ 是高光谱带宽。图像以分段的形式输入模型。每幅图像由围绕中心标签像素织成的 $S\\times S$ 邻域组成。因此，分段后的图像大小为\
  \ $S\\times S\\times B$。假设一张图像包含 $N$ 个标签像素，则碎片图像的数据集将为 $X=\\{x[1], \\dots, x[n]\\\
  }\\in\\mathbb{R}^{S\\times S\\times B}$。相应的实际类别定义为 $Y=\\{y[1], \\dots, y[n]\\}\\\
  in\\{1, 2, \\dots, Q\\}$。这里的 $Q$ 代表感兴趣的类别。模型中强调的是被替换的残差块。残差块通过两个卷积层和一个残差网络（也称为跳跃层）进行补充。这被称为预激活残差。模型中使用的修改残差块和普通残差块所示所示图\
  \ 8。\n\n#### 图 8. 普通残差块(a), 预激活残差块 (b) (Gao et al., 2019)\n![](img/979-8-3693-9816-6.ch010.f08.png)\n\
  \n残差块的输出计算如下：$H(x)=f(F(x))+x$，其中 $f$ 是激活函数，$F(x)$ 是卷积层的输出，$F$ 是残差学习。在卷积层之前，残差块通过应用批归一化（batch\
  \ norm）和 RELU 进行预激活。在这种情况下，$H(x)=F(x)+x$ 将是预激活残差的结果。\n\n由于所提网络使用来自所有光谱波段的数据作为输入，不必要的冗余信息会降低分类准确率。为了解决这个问题，在\
  \ PRAN 模型的预激活残差块中引入了用于重新校准的通道注意力机制，如图所示图 9。\n\n#### 图 9. 预激活注意力块 (PRAB) 架构 (Gao\
  \ et al., 2019)\n![](img/979-8-3693-9816-6.ch010.f09.png)\n\n假设注意力机制具有 $s\\times\
  \ s\\times d$ 和 $c$ 输入特征图，其中 $c$ 和 $d$ 分别代表通道和深度。通过使用 3D 全局平均池化（GAP）层压缩每个特征图中的全局空间信息，产生\
  \ $C1\\times1\\times1$ 通道特征张量。然后，通过将特征张量作为输入馈 $1\\times1\\times1$ 3D 卷积层来降低通道维度。具体而言，特征张量的通道维度在卷积期间变为\
  \ $c/r$，其中 $r$ 是收缩比例率。在所提网络中，$r$ 的值为 4。\n\n之后，使用 ReLU 函数来增强通道响应的非线性，使用第二个 $1\\times1\\\
  times1$ 3D 卷积层来扩展通道尺寸，并产生 $c$ 个特征张量。注意力机制的最终输出通过 sigmoid 函数将输出与预激活残差的特征图相乘，重新缩放为\
  \ $cs \\times s \\times d$ 特征图。这种实现通过分配通道权重，允许每个特征图进行自适应地重新校准。\n\n#### 2.8. BC 学习\n\
  \n\n\n\n\n类间学习（BC Learning）是一种深度学习算法，旨在通过最大化类别区分度来提高图像分类任务的性能。该算法侧重于学习不同类别图像之间的差异，从而提供更准确的分类结果（Tokozume\
  \ et al., 2018）。\n\n分类问题的标准学习涉及从数据集中选择一个训练样本并将其输入模型，使用单标签输出来训练模型。另一方面，在类间学习中，从数据集中随机选择两个不同类别的训练样本并进行组合。此后，通过输入模型的混合数据来训练模型，使其提供每个类别的混合比例。与交叉熵损失相比，典型的损失函数是模型输出值与比例标签之间的差异。混合操作在测试阶段不进行。\n\
  \n在模型中，令 `{x[1],t[1]}` 和 `{x[2],t[2]}` 为从训练数据标记的属于两个不同类别的数据集。`τ` ~ `∪(0,1)` 是均匀分布的随机变量，图像数据集通过该随机率进行洗乱。标签洗乱为\
  \ `τt[1]+(1 – τ)t[2]`。数据同样被洗乱为 `τx[1]+(1 – τ)x[2]`。然而，为了使数据更合适，将其除以一个系数，从而纠正了混淆的数据。\n\
  \n为了使模型更合适，假设数据是两个独立图像强度 `G1` 和 `G2` 的混合。计算出相应的 `p` 值，其计算公式为 `P=11/(11+10)`。根据变量\
  \ `p` 的，数据组合 `x[1]+(1−p)x[2]` 会发生变化。在音频数据的研究中，是这样处理的。但在图像数据的研究中，使用了标准的混合公式[公式 29]。为了寻求混合的新形式，通过将图像数据转换为波数据克服了这一缺陷。计算了图像中红、绿、蓝通道的均值（`μ`）和标准差（`σ`）。因此，每幅图像\
  \ `x[i]=μ[i]+d[i]` 被转换为波形。在这里，变量 `d` 是波分量。如果用新的 `x` 值替换[公式 25]，则出现了[公式 26] 这一一种新的混合公式。然而，如果我们取波形数据，波分量（`d1`\
  \ 和 `d2`）是决定因素。此外，静态分量可能会对模型产生不利影响。因为原则上假设两波混合时的静态分量是相同的。因此，在本研究中，为了消除静态分量，从每幅图像中减去均值并重新计算为[公式\
  \ 27]。在这种情况下，混合的最终形式将如[公式 28]。此外，研究中完成的第二件事是确定混合图像 `x[1]: x[2] = r: (1-r)` 的感知，考虑了图像能量的差异。为此计算了一个系数\
  \ `p`。它本质上给出了振幅比 `ρ`。`σ[1]: (1-ρ).σ[2]=r:(1-r)`。在这种情况下，`p` 系数的计算方法如[公式 29]，并考虑了图像的标准差。相应的，混合方法通过[公式\
  \ 30] 最终确定。本研究与以往研究的主要区别在于，使用了每幅图像的标准差，而不是通过平均图像使用声压级。\n\n```\nτ.*x[1]+(1−τ).*x[2]\
  \ (25)\n\nτ.*(μ[1]+d[1])+(1−τ).(μ[2]+d[2]) (26)\n\nτ.*(x[1]-μ[1])+(1−τ).(x[2]-μ[2])\
  \ (27)\n\n$$\\frac{\\tau.\\left( x_{1} - \\mu_{1} \\right) + \\left( 1 - \\tau \\\
  right).\\left( x_{2} - \\mu_{2} \\right)}{\\sqrt{\\tau^{2} + \\left( 1 - \\tau^{2}\
  \ \\right)}}$$ (28)\n\n$$p = \\frac{1}{1 + \\frac{\\sigma_{1}}{\\sigma_{2}}.\\frac{1\
  \ - \\tau}{\\tau}}$$ (29)\n\n$$\\frac{p.\\left( x_{1} - \\mu_{1} \\right) + \\left(\
  \ 1 - p \\right).\\left( x_{2} - \\mu_{2} \\right)}{\\sqrt{p^{2} + \\left( 1 - p^{2}\
  \ \\right)}}$$ (30)\n```\n\n\n\n\n\nCutMix 是一种数据增强（DA）技术，用于提高图像分类任务的性能。它通过结合属于不同类的随机图像片段来提高模型的泛化能力和鲁棒性\
  \ (Yun et al., 2019)）。它与 Mixup 模型非常。在 Mixup 中，两张图像的数据和标签在所有像素上进行混合；而在 Cutmix 中，混合的是两个不同图像的补块（patches）。这允许模型生成更自然的图像。假设\
  \ $x\\in R^{(WxHxC)}$ 是训练数据，$y$ 是数据的标签，目标是从两个不同的训练数据 $(x[A],y[A])$ 和 $(x[B],y[B])$\
  \ 生成图像 $(\\tilde{x}, \\tilde{y})$。这种生成的组合过程由公式 31 给出。这里 $M \\in \\{0, 1\\}^{(W\\\
  times H)}$ 是一个二值掩码，其中 1 表示要从两张图像中提取并填充的掩码区域。$\\odot$ 是逐元素乘法。$\\lambda$ 是从 beta 分布中抽取的样本，代表两个数据点之间的组合比例\
  \ $(\\lambda\\sim\\beta(\\alpha,\\alpha))$。在原始研究中，所有实验的 $\\alpha=1$。换句话说，$\\lambda$\
  \ 是从均匀分布 $(0, 1)$ 中采样的。与 Mixup 相比，CutMix 通过用来自另一个训练图像的补块替换图像区域来创建一个局部自然的图像。为了获取\
  \ $M$ 的样本，首先定义一个边界框 $Boundary=(r[x],r[y],r[W],r[H])$，它决定了从图像 A 复制到图像 B 的图像大小。框设置如公式\
  \ 32 所示。样本根据图像原始尺寸以矩形形式提取 (Yun et al., 2019)。\n\n$$\\tilde{x} = M \\odot x_{A} +\
  \ \\left( 1 - M \\right) \\odot x_{B},M \\in \\left\\\\{ 0,1\\}^{WxH}~and~\\tilde{y}\
  \ = \\lambda y_{A} + \\left( 1 - \\lambda \\right)y_{B} \\right.$$  \n\n(31)\n\n\
  $$r_{x} \\sim U\\left( {0,W} \\right),r_{w} = W\\sqrt{1 - \\lambda}~and~r_{y} \\\
  sim U\\left( 0,H \\right),r_{h} = H\\sqrt{1 - \\lambda}$$  \n\n(32)\n\nCutMix 的计算步骤如图\
  \ 10 所示。\n\n#### 图 10. CutMix 方法的伪代码\n\n![](img/979-8-3693-9816-6.ch010.f10.png)\n\
  \n### 2.10. AugMix\n\nAugmix 是一种简单有效的数据处理方法，旨在使图像分类模型更具鲁棒性并对不性更有适应能力。基本上，它通过混合以不同方式增强的图像版本来实现\
  \ (Hendrycks et al., 2020b)。它通过旋转、裁剪、添加噪声和改变颜色等方法创建原始图像的增强版本。因此，这些增强版本使得模型对不同的视觉变化更加敏感。然后，按照一定的比例混合增强后的图像。这种混合过程允许模型关注更通用、更抽象的特征。混合后的图像与原始图像具有相同的标签。通过这种方式，模型学习正确分类不同的视觉变化及其混合物。通过这种方式，模型通过对现实图像中意外变化（如光照条件）的增强适应能力获得了鲁棒性。模型可以更好地预测其分类图像的置信度。这有助于减少误分类风险。这强调了模型的不确定性估计特征。模型是一个泛化模型，通过关注更通用、更抽象的视觉特征，在不同的数据集上表现得更好。模型的处理过程包括数据预增强、基于增强数据的复合数据生成以及使用\
  \ Jensen-Shannon 散度一致性损失进行误差计算。在数据预增强中，数据通过三个连续的 3 个随机操作链进行增强。然后合并这些增强结果。随后，通过最小化原始图像\
  \ $x[orig]$ 与其增强变体后验分布之间的 Jensen-Shannon 散度来训练模型。\n\n\n\n\n在模型中，$x \\in X$ 是输入数据，$y\
  \ \\in Y$ 是该数据的标签，数据 $(x,y) \\sim D(X,Y)$ 意味着每个 $(x,y)$ 图像标签对都来自分布 $D$。混合过程通过由公式\
  \ 36 提供的函数 `g` 用于标签，由公式 37 提供的函数 `h` 用于数据本身，以及两者的加性混合，则由公式 38 给出。目标是最小化由公式 39 提供的损失值\
  \ `l`。在模型中，混合函数按照公式 40 进行了修改。在这里，$Z$ 是一个由 $z[ij] \\in [0,1]$ 组成的掩码，$\\prod_{0}^{\\\
  mathbf{T}}\\mathbf{~}$ 和 $\\prod_{1}^{\\mathbf{T}}$ 是待混合图像的 $n \\times n$ 维传输部分。$\\\
  lambda$ 是混合比例，计算公式为 $\\lambda = \\frac{1}{n}\\sum_{ij} bij$。$\\prod_{\\mathbf{i}\\\
  mathbf{j}}^{\\mathbf{T}}$ 是二进制传输碎片，提供了关于传输后有多少图像从位置 $i$ 移动到位置 $j$ 的信息。这里的目标是找到最优混合掩码\
  \ $z$ 和最优传输计划 $\\Pi$。这是因为最优值允许数据最大化每个输入的显著性信息。\n\n```\ng() = (1 - λ)y0 + λy1 (36)\n\
  ```\n\n```\nh(x0, x1) = (1 - λ)x0 + λx1 (37)\n```\n\n```\nh(x0, x1) = (1 - λ)fx0\
  \ + λfx1 (38)\n```\n\n```\n\\overset{\\text{minimize}}{\\theta}\\underset{(x_{0},y_{0}),(x_{1},y_{1})\
  \ \\in D}{\\mathbf{E}}\\mathbf{~}\\underset{\\lambda \\sim q}{\\mathbf{E}}\\mathcal{l}(h(x_{0},x_{1}),g(y_{0},y_{1});\
  \ \\theta) (39)\n```\n\n```\nh(x0, x1) = (1 - z) \\odot 0^T \\cdot x_0 + z \\odot\
  \ 1^T \\cdot x_1, \\lambda = \\frac{1}{n}\\sum_{i} izi (40)\n```\n\n显著性信息可能存在噪声，导致次优解。因此，使用空间正则化项\
  \ $\\psi$ 和 $\\phi[i,j]$ 来控制掩码的平滑性以及生成的混合样本的局部平滑性。\n\n传输成本 $C_{ij}$ 定义为位置 $i$ 和\
  \ $j$ 之间的距离。在处理时，通过考虑 $C_{ij}$ 来确保通常保留每个数据的结构完整性，并确保数据的局部显著结构在传输后不发生耗散。为此，对二进制传输计划进行优化。在下采样后，我们使用平均池化和显著性信息\
  \ $s(x)$ 优化主目标以支持多尺度迁移和掩码。下采样大小为 $n$。在实践中，为每个 mini-batch 随机选择采样分辨率。\n\n为了优化 $Z$\
  \ 掩码，首先对掩码范围进行分解。令该分解 $L = \\{\\frac{t}{m} \\mid t=0,...,m\\}$。此外，为了控制给定输入的混合比例，我们加入了遵循二项分布的先验项\
  \ $p(z[i])$。相应地，目标函数将如公式 40 所示。优化公式 41 导致：\n\n```\n\\overset{\\text{minimize}}{\\\
  theta}z \\in L^{n}, \\|(1-z) \\odot \\prod_{0}^{\\mathbf{T}}s(x_0)\\|_1 - \\|z \\\
  odot \\prod_{1}^{\\mathbf{T}}s(x_1)\\|_1 + \\beta\\sum_{(i,j) \\in N}\\psi(z[i],z[j])\
  \ + \\gamma\\sum_{(i,j) \\in N}\\phii,j - \\eta\\sum_{i}\\log p(z[i]) + \\xi\\sum_{k=0,1}\\\
  langle\\Pi[k],C\\rangle (41)\n```\n\nPuzzle-Mix 专注于两个主要目标。第一个是最小化 $Z$，第二个是同时优化 $\\\
  prod_{0}^{T}$ 和 $\\prod_{1}^{T}$。Puzzle Mix (J.-H. Kim 等人，2020) 相比之前的研究需要更多的计算资源。然而，在相同的实验设置下，Puzzle\
  \ Mix 比其他方法获得了更高的准确率。\n\n总之，PuzzleMix 的算法如图 12 中的算法 6 所示，包含以下步骤：\n\n#### 图 12. PuzzleMix\
  \ 方法的伪代码\n\n![](img/979-8-3693-9816-6.ch010.f12.png)\n\n### 3 结论与讨论\n\n\n\n\n本研究聚焦于基于深度网络模型的\
  \ DA（数据增强）方法。其目的是探索能够深上克服传统 DA 模型缺陷的新方法。图像处理在医学数据中被广泛使用。特别是在医学领域，对于罕见病等关键领域的早期诊断和早期干至关重要。然而，医学图像样本量小是该领域最重要的限制之一。DA\
  \ 是可作为预防措施的解决方案之一。目前有许多用于 DA 的方法，但应该首选哪种方法通常是研究人员面临的一个大问号。在本研究中，详细解释了当前的方法，并将模型实验结果与最先进的数据集进行比较，为研究人员提供参考，详见表\
  \ 1。此外，模型在各个数据集上的性能表现于表 2。回顾文献可以发现，虽然在 MNIST 数据集上进行的研究中 Mixup 达到了 99.7%的成功率，但 GAN\
  \ 模型达到了 98%的成功率。因此，可见 Mixup 在 DA 方面比 GAN 模型更成功。结果，CAM-Mix 也对 CoPINET 模型的成功做出了贡献。在常用当前数据集之一\
  \ CIFAR10 的实验结果中，SuperMix 的准确率为 97.2%，AugMix 为 96.4%，Co-Mixup 为 96.3%，CutMix 为 95.2%，BCLearning\
  \ 为 93.7%，而 GAN 为 70%。同样，在 Celeb-A 数据集上进行的研究中，很明显 PatchGAN 算法给出了比 GAN 模型更好的结果。总的来说，数据集的大小和结构直接影响\
  \ DA 性能和模型训练性能。因此，选择用于 DA 的模型非常重要。然而，尽管使用了广泛接受的数据集，但现实世界的数据是否能表现出同样的成功，只能通过实验研究来揭示。因此，应当知道医学图像处理领域仍存在巨大差距。本研究提供了当前及常用\
  \ DA 模型的详细框架。\n\n### 3.1. 伦理问题讨论\n\n临床环境中的增强图像数据是提高 AI 和 ML 模型性能的强大工具，特别是在医学图像分析等领域。DA\
  \ 技术在医学图像数据有限的情况下可以提高模型性能，防止过拟合，并有助于模型的泛化能力。在罕见病例中提供了更好的表示。此外，通过增强技术可以消除不同年龄组、性别或种族的图像数据的不平衡，从而减少模型偏差。然而，除了这些积极影响外，还存在与模型责任、数据隐私和模型透明度相关的伦理问题和风险。例如，增强图像数据可能无法完全反映真实临床图像的特征，这可能导致误导并带来巨大风险。应用必须经过仔细设计以解决数据隐私、模型透明度和问责等伦理问题。如果实现了这种平衡，DA\
  \ 就可以在临床环境中安全、伦理且有效地使用。\n\n### 3.2. 结论与未来方向\n\n医学图像处理中 DA 的未来前景广阔，但需要对伦理影响进行审慎考虑。未来的研究应侧重于提高\
  \ DA 模型在现实数据集上的稳健性，并确保数据隐私。多种 DA 技术的整合可能会带来更好的诊断工具。\n\n#### 表 2. 模型在最先进数据集上的性能表现\n\
  \n| 数据集 | 方法与准确率 |\n| :--- | :--- |\n| MNIST | Mixup 99.7%<br>GAN 98% |\n| CIFAR10\
  \ | SuperMix 97.2%<br>AugMix 96.4%<br>Co-Mixup 96.3%<br>CutMix 95.2%<br>BCLearning\
  \ 93.7%<br>GAN 70% |\n| Celeb-A | (a->b) PatchGAN 99%<br>(b->a) PatchGAN 98.7%<br>GAN\
  \ 80% |\n\n#### 表 3. 根据特征和规格对比模型\n\n| 模型 | 优点 | 缺点 | 局限性 | 实际应用 |\n| :--- | :---\
  \ | :--- | :--- | :--- |\n| Mixup | 实现简单；减少过拟合；数据多样化。 | 无法学习更复杂的数据关系。 | 可能导致图像标注错误。\
  \ | 易集成到许多模型中。 |\n| GAN | 生成真实数据方面有效；广泛使用。 | 训练过程不稳定；存在模式崩溃风险。 | 需要大型模型和数据集。 | 常用于数据增强。\
  \ |\n| CycleGAN | 在数据集之间进行双向转换。 | 成功取决于特定的数据类型。 | 无需标记数据，但在某些场景下会失败。 | 风格迁移的强大工具。\
  \ |\n| RDAGAN | 生成随机数据方面性能先进。 | 由于复杂性导致训练时间长。 | 存在模式崩溃风险和数据不平衡问题。 | 适用于真实图像生成。 |\n\
  \n\n\n\n## 数据增强方法\n\n- 训练可能需要很长时间。\n- 在小数据集上性能有限。\n- 用于图像变换和数据增强任务。\n\n### PRAN\n\
  - 丰富了注意力机制。\n- 在视觉任务中表现良好。\n- 对硬件要求高。\n- 可能需要多参数优化。\n- 需要健壮的基础设施来支持高分辨率性能。\n- 适用于涉及视觉分析和注意力机制项目的强力模型。\n\
  \n### BCLearning\n- 集成了针对网络架构定制的学习方法。\n- 仅在特定场景下有效。\n- 依赖于架构。\n- 可能需要专门的数据准备。\n\
  - 可用于小型任务和分众项目。\n\n### CutMix\n- 在数据多样化和提高整体准确率方面有效。\n- 标签分布的变化可能导致错误学习。\n- 在需要视觉注意的任务中表现较弱。\n\
  - 对于多样化数据集快速且有效。\n\n### AugMix\n- 在处理视觉噪声和失真方面有效。\n- 提高模型的稳定性。\n- 在某些任务中增强效果有限。\n\
  - 取决于数据类型。\n- 需要专门应用。\n- 常作为数据增强的通用解决方案。\n\n### PuzzleMix\n- 在数据多样化方面处于先进。\n- 提高模型的泛化能力。\n\
  - 计算成本高。\n- 实现复杂。\n- 在大型数据集上更有效。\n- 在小数据集上可能会产生过度的多样性。\n- 特别适用于大型项目。\n\n### Co-Mix\n\
  - 在混合数据类型上表现出强大的性能。\n- 提供健壮的泛化能力。\n- 计算要求高。\n- 复杂性增加了错误率。\n- 对小数据集的影响有限。\n- 难以优化。\n\
  - 对于大数据和深度学习场景非常强大。\n\n## 表 4. 缩写列表\n\n| 缩写 | 上下文 |\n| :--- | :--- |\n| ADAM | 自适应动估计\
