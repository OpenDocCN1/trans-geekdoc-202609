  \ + Ey~pdata[log(D(G(x)) + 1 - DX] + 1-10` (10)\n\n`Lcyc = G,F = Ex~pdata[log(D(x))\
  \ + 1 - DX] + Ey~pdata[log(D(G(y)) + 1 - DX] + 1-y` (11)\n\n`L*(G,F,DX,DY) = GAN(G,DY,X,Y)\
  \ + GAN(F,DX,Y,X) + λLcyc(G,F)` (12)\n\n`CycleGAN` 的算法如图 4 中的算法 2 所示。\n\n#### 图\
  \ 4. CycleGAN 的伪代码\n![](img/979-8-3693-6.ch010.f04.png)\n\n## 2.5. 鲁棒数据增强 (RDAGAN)\n\
  \n`RDAGAN` 是 `GAN` 的变体，旨在增加数据的多样性并增强模型的泛化能力。该模型对有限数据集和数据分布的变化特别鲁棒。它被用于图像合成、图像翻译和图像编辑等任务\
  \ (Lee et al., 2023)。该模型本质上基于 `GAN` 模型。不同的是，它由两个独立的网络组成。第一个是图像生成网络，第二个是图像变换网络。目标生成模型使用\
  \ `InfoGAN` (Chen et al., 2016) 架构。目标生成网络产生的图像作为目标变换网络的输入并计算损失函数。由于 `InfoGAN` 架构包含\
  \ Info 和 GAN 模块（即信息层），它会计算两个不同的损失值。其中 `GAN` 模块的损失通过公式 13 计算，而 `Info` 模块的损失值通过公式\
  \ 14 计算。生成网络模块的总损失是这两个模块损失之和，并由公式 15 给出。公式 16 显示了模型的总损失函数。\n\n`LGANobj = ER[T*log(Dobj(R))]\
  \ + IC[C*log(Dobj(Gobj(z,c)) + 1)]` (13)\n\n\n\n\n图像变换网络将清洁图像（`i[c]∈C`）与从 `InfoGan`\
  \ 模型生成的目标部分 `Gobj` 结合。它与 `CycleGAN` 架构非常相似，是一种包含 `ResNet` 块的编码器-解码器架构。区别在于生成器保持了灵活的采样频率，因此，它为图像的大小变化提供了灵。该生成器模块具有两个不同的判别器：局部\
  \ `D[tr]^local` 和全局 `D[tr]^global`，它们用于计算该模块的损失值。全局分配器评估生成网络产生的图像，它并不使用整幅图像，而是只使用其中的补丁部分。公式\
  \ 17 衡量了图像与目标区域图像的相似程度。Info 层的损失通过公式 18 计算。输入图像（`i[c]`）与生成图像（`Gtr`）之间的损失被视为背景损失，并通过公式\
  \ 19 计算。这里，`L` 代表损失，`D` 代表判别器，`z` 是噪声，`G` 是生成器，`m[b]` 是掩码，`i[c]` 是清洁图像，`i[t]` 是目标图像，`λ`\
  \ 是信息损失的权重。\n\n`RDGAN` 转换模块的结构如图 5 所示。\n\n```\nL[GAN]^tr= E[i[t]∼p[T]] log D[tr]^global(i[t])+E[i[p]∼Gen(z,\
  \ c), i[c]∼p[c]] log D[tr]^global(Grt)\n```\n\n\n\n\n## 图 5. RDGAN 转换器结构\n\n![](img/979-8-3693-9816-6.ch010.f05.png)\n\
  \n## 2.6. Pix2Pix (PatchGAN)\n\nPix2Pix 算法是由 (Isola et al., 2018) 提出的模型。另一项研究 (Wang\
  \ et al., 2021) 也给出了一个名为 `PatchGAN` 的相似模型。由于这两个模型是相同的，因此它们被放在同一个标题。`PatchGAN` 是一种用于图像合成、翻译和编辑等任务的深度学习算法。在使用\
  \ `GAN` 生成数据时的一种判别器架构。它将图像分为称为 `patches` 的小块并分别处理每个小块。通过这种方式，它可以产生质量更高、更真实的图像 (Isola\
  \ et al., 2018)。在经典分类问题中，整张图像被归为一个类，而在 `patchGAN` 中，图像的每个小块都被分类。然后取所有分类结果的平均值或通过应用\
  \ `maximum pooling` 进行组合作为结果。`GANs` 是通过最小化损失函数来学习的生成模型，旨在分类输出图像是真实的还是造的。模糊图像是不可接受的，因为它们看起来可能是欺诈的。`GANs`\
  \ 用于通常需要不同损失函数的各种任务，因为它们训练时的损失函数可以根据数据进行调整。相比之下，已经产生了条件 `GAN` 模型，将图像作为条件输入 (Goodfellow∗\
  \ et al., 2014)。条件 `GAN` 模型不同之处在于它学习的是结构化损失值。这种结构化损失对输出的联合重建进行惩罚。条件 `GAN` 模型为图像到图像转换提供了合适的架构。在\
  \ Isola 等人关于 `PatchGAN` 的工作中，生成部分分别使用了 `U-Net` 和 `Encoder-Decoder` 架构。作为判别器，它使用卷积网络和一个分类模型，该模型惩罚的是片段而不是整个图像。这里的\
  \ `GAN` 模型是从图像中创建新图像的生成模型。`G` 代表生成器，`D` 代表判别器，`G: z to y`，其中 `z` 是噪声图像，`y` 是输出图像。条件\
  \ `GAN` 模型不同，因为它尝试根据观测向量 `x` 和噪声输入向量 `z` 产生结果。因此，条件 `GAN` 模型中的产生函数定义为 `G:{z,x}→y`。生成器\
  \ `G` 的目标是创建与真实照片一完全相同的伪造图像。为了评估这些伪造照片和真实照片之间的差异程度，训练了判别器 `D`。公式 20 提供了条件 `GAN`\
  \ 模型的目标函数。公式 21 显示了总损失。当 `G` 尝试最小化目标函数时，判别器 `D` 通过尝试最大化它来通过判别。当 `x` 不作为条件给出时，该损失的计算如公式\
  \ 22 所示。在之前的研究中，这些损失函数通过添加 `L1` 损失 (Isola et al., 2018) 和 `L2` 损失 (Pathak et al.,\
  \ 2016) 了测试。(Isola et al., 2018) 通过添加如公式 23 所示的公式 24 中的 `L1` 范数计算了总损失。该模型本质上所做的是，不再训练生成器\
  \ `G` 来最小化误差 `log(1 - D(x,G(z)))`，而是训练网络来最大化误差 `logD(x, G(z))`。这意味着判别网络 (`D`) 的学习率低于生成网络\
  \ (`G`)。该模型使用 `SGD` 作为激活函数，学习率 `0.0002`，使用 `ADAM` 作为优化函数，并将 `β1=0.5, β2=0.999` 作为动量参数\
  \ (Isola et al., 2018)。`PatchGAN` 的算法如图 6 所示。`Pix2Pix` 架构如图 7 所示。\n\n```\nG*=arg\
  \ min[G] max[D] LcGAN\n```\n\n(21)\n\n\n\n\n\n$L_{cGAN}(G,D) = \\mathbb{E}_{x \\\
  sim p_{data}(x)}[\\log D(x)] + \\mathbb{E}_{z \\sim p_z(z)}[\\log(1 - D(G(z,c)))]$\n\
  \n$G = \\arg\\min_{G}\\max_{D}L_{cGAN}(G,D)$\n\n$L$: 损失，$D$: 判别器，噪声，$c$: 隐码，$G$:\
  \ 生成器 $R(i[c])$，$i[c]\\in$ 清洁图像，$i[t]\\in$ 目标图像，$\\lambda$: 信息损失权重，$m[b]$: 掩码\n\n\
