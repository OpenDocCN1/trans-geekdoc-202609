  \n##### 5.3.3 注意力图和特征图的可视化\n\n`DenseNet201` 在多尺度下的特征图如图图 10。该图显示了 `DenseNet201`\
  \ 在经过 `Dense Blocks 1`、`2` 和 `3` 后三个不同抽象层面的特征图。`Dense Block 1` 的特征图代表了图像的低级和简单模式。`Dense\
  \ Block 2` 的特征图显示了中间级特征，形状和局部结构更加明显。`Dense Block 3` 的特征图通过强调小区域对肿瘤分类的重要性，提取了高度抽象但有意义的特征。\n\
  \n#### 图 10. 来自 DenseNet201 的三个粒度的特征图 (a) 在 Dense Block 1 后 (b) 在 Dense Block 2\
  \ 后 (c) 在 Dense Block 3 后 \n\n![](img/979-8-3693-9816-6.ch007.f10.png)\n\n图 11 展示了\
  \ MRI 扫描以及由 Vision Transformer 模型生成的相应注意力图。这些图突显了模型对特定肿瘤区域的关注。在 MRI 图像中，可以看到明显的肿瘤区域，其特征是病变周围改变的增强和水肿。注意力图反映了模型准确定这些识别为包含肿瘤组织的区域的能力。例如，在第一张\
  \ MRI 中，注意力图主要突显了肿瘤的下部分，表明模型正在关注坏死或无增强的核心。在第二张 MRI 中，注意力图转移到肿瘤周围的区域，可能捕捉到了瘤周水肿，这在增强扫描中也被突显了。第三和第四张\
  \ MRI 显示注意力图集中在增强区域，表明模型准确地识别了对比增强肿瘤区域作为关键特征。这种对不同肿瘤特征（如坏死、水肿和增强区域）的针对性关注，证明了提议模型区分这些病理特征的能力。\n\
  \n#### 图 11. MRI 图像（上）及其相应注意力图（下）的可视化\n\n![](img/979-8-3693-9816-6.ch007.f11.png)\n\
  \n##### 5.3.4 损失-准确率曲线和混淆矩阵分析\n\n图 12 说明了 `DenseNet201`、Vision Transformer (`ViT`)\
  \ 和提议模型的准确率和损失曲线。对于 `DenseNet201`，准确率稳步增长但速度缓慢，在 `0.85` 左右停滞。训练和验证准确率图中观察到的模式表明过拟合；虽然训练损失急剧下降并收敛于极低值，但验证损失减少较慢。`ViT`\
  \ 的训练和验证准确率显示出进展并稳定在 `0.9`，表明存在细微的泛化问题。另一方面，提议混合模型在训练早期实现了高准确率（`0.97`），训练和验证损失均收敛至接近零。这表明与基准模型相比，效率更高且减少了过拟合。\n\
  \n#### 图 12. 三种模型的训练和验证准确率\n\n![](img/979-8-3693-9816-6.ch007.f12.png)\n\n归一化混淆矩阵如图\
  \ 13 所示。\n\n#### 图 13. 提议模型的归一化混淆\n\n\n\nimage/979-8-3693-9816-6.ch007.f13.png)\n\
  \n提议模型提供了对 `HGG` 的极分类，真率为 `0.98`。然而，极小比例的 `HGG` 样本被误类为 `LGG`（`0.01`）和 `无肿瘤`（`0.01`）。这表明尽管模型在检测肿瘤形态方面有效，但与\
  \ `LGG` 和 `无肿瘤`之间可能存在特征重叠，未来可能进一步调优或优化。与 `LGG` 类似，模型的真率为 `0.97`，反映了模型有效分割低级胶质瘤区域的能力。然而，`0.02%`\
  \ 的 `LGG` 样本被误类为 `HGG`，可能是因为这两个级别的肿瘤特征非常相似。此外，检测到 `0.01` 的 `LGG` 样本被误类为 `无肿瘤`，这可能源于特征相似性或输入数据的噪声。对于\
  \ `无肿瘤`，模型实现了 `0.98` 的真率，展示了其准确检测非肿瘤区域的能力。这些样本中极少数部分被误类为 `HGG`（`0.01`）或 `LGG`（`0.01`），这可能是由于背景特征或伪影被误解释为肿瘤区域。\n\
  \n总体而言，所有类别的高分类率突显了模型的有效性。然而，细微的误类率表明了改进空间，特别是在精炼 `HGG` 和 `LGG` 之间重叠特征方面。\n\n##\
  \ 6. 结论与未来工作\n\n\n\n\n\n所提模型通过有效利用分层粒度、基于注意力的特征融合以及多尺度信息，展示了稳健的性能。脑部 MRI 肿瘤图像的特征使用\
  \ `DenseNet-201` 在三个粒度级别上进行提取，并通过三个 Vision Transformer 进行处理，从而捕捉局部和全局空间模式。基于注意力的特征融合技术通过关注可能与肿瘤相关的区域，整合了提取的特征，提高了区分不同肿瘤类别的能力。融合后的特征将被归分为\
  \ `HGG`、`LGG` 和 `No Tumor`（无肿瘤）类。从这个意义上说，模型的整体强度超过了单个模型的性能；而 `DenseNet201` 的准确率分别为\
  \ 86%，`ViTs` 分别为 93%。这种混合方法在不同肿瘤类型之间具有高准确率和优的泛化能力，证明了该模型作为自动化脑肿瘤诊断高效解决方案的潜力。未来工作将通过引入解释性来增强当前模型，并让临床医生参与以便在临床环境中采用。\n\
  \n用于脑肿瘤分类混合架构的未来工作将转向模型的微调和优化。此外，还将探索结合多种图像模态（包括 `MRI`、`PET` 和 `CT`）以获得更好的分类以及提高性能和稳定性。为了验证这些模型的现实适用性，将进行进一步研究以在临床环境中对其进行测试，确保它们在不同的患者群体和环境中都能有效运行。此外，将添加解释性和解释性模块，以确保决策过程的透明度。通过确保模型的决策不仅准确，而且易于理解和合乎逻辑，这将增强信任并促进临床采用。\n\
