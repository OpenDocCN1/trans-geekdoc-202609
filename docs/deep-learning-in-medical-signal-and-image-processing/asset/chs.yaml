  \n基于 Transformer 的 U-net\n\n## 第 4 章：基于 Transformer 的深度学习在医学图像处理中的进展与新兴趋势\n\nUzair\
  \ Aslam\n[单导联心电图信号](http://dx.doi.org/10.1109/JSEN.2022.3162691)\n海南大学，信息与通信工程学院\n\
  \nMuhammad Aamir\n[00028743](http://dx.doi.org/10.1109/JSEN.2022.3162691)\n黄冈大学，计算机科学与人工智能学院\n\
  \nZia Ur Rehman\n[313710](https://pubmed.ncbi.nlm.nih.gov/35913710)\n黄冈大学，计算机科学与人工智能学院\n\
  \nJameel Ahmed Bhutto\n[36405957](https://pubmed.ncbi.nlm.nih.gov/36405957)\n黄冈大学，计算机科学与人工智能学院\n\
  \nMughair Aslam\n[00028743](http://dx.doi.org/10.1515/978311)\nSZABIST，巴基斯坦，机器人与人工智能系\n\
  \nAhsan Ahmad Nizamani\n中南大学\n\nAbdul Haseeb Nizamani\n中南大学\n\n### 摘要\n\n`U-net`\
  \ 是一种用于医学分割的 U 型网络。然而，传统的卷积神经网络（CNNs）如其在处理细节方面面临挑战。自从 `U-net` 成功以来，它已成为许多衍生模型的基础。\n\
  \n### 1. 引言\n\n深度学习为计算机视觉领域带来了巨大变化，卷积神经网络（CNNs）表现良好，以至于它们变得越来越深以解决更复杂的问题。全卷积 `U-net`\
  \ 在下采样过程中提供了跳跃连接，在恢复低级特征的同时获取全局特征。\n\n然而，由于 CNN 固有的归纳偏差，它们无法建模长距离依赖，从而限制了性能。视觉 Transformer（ViT）通过将图像视为一组块并像自然语言处理（NLP）一样处理这些块标记，延续了\
  \ `Transformer` 在计算机视觉中的应用。在随后的模型中，如 SETR 和 DETR，`Transformer` 在视觉目标检测中的作用和可能性已得到确立（Azad\
  \ 等人，2023；Bhatti 等人，2022）。\n\n## 2. 医学图像分割\n\n\n\n\n医学图像分割是计算机视觉领域的一项重要任务，它关注像素级分类，以精确勾勒医学图像中的目标对象。这些数据集通常源于\
  \ MRI、CT 和超声等先进成像模态（Azad et al., 2023; Bhatti et al., 2024a）。传统的分割方法（如阈值分割、区域生长和边缘检测技术）具有简单和对硬件要求低的优点，但通常高度依赖人工调优以获得高质量的特征表示。相比之下，基于深度学习的分割模型通过极少的人工干预实现了特征学习，在付出大量训练计算资源的情况下，提供了卓越的性能（Bhatti\
  \ et al., 2024b; Bhatti et al., 2023a; Bhatti et al., 2024c; Bhatti et al., 2024d;\
  \ Bhatti et al., 2023b）。\n\n随着 GPU 技术和内存容量的进步，训练复杂的深度学习网络已变得更加可行，推动了它们在包括医学图像分析在内的多种应用中的采用。基于\
  \ CNN 的分割模型广泛应用于肿瘤检测、皮肤病变分析和视网膜血管分割等任务。其中，`U-Net` 已成为医学图像分割的基石，特别是在计算机辅助诊断和智能医疗系统中。`U-Net`\
  \ 的设计通过跳跃连接结合了低层和高层特征，在各个医学领域均取得了巨大成功（Bhatti et al., 2023c; Bhatti et al., 2024e）。\n\
  \n尽管 CNN 具有优势，但它们面临着固有局限性，包括难以捕捉长程依赖以及对固定尺寸卷积核的依赖，这限制了它们的泛化能力。此外，医学图像具有独特的挑战，例如边界模糊、低对比度和目标尺寸多异，要求能够有效地提取全局上下文信息（Bhatti\
  \ et al., 2024f; Bhatti, Tang, & Wu, 2023）。Transformer 的引入利用了最初为 NLP 开发的自注意力机制，通过使模型能够捕捉长程依赖和全局上下文，解决了这些挑战。这种能力推动了基于\
  \ Transformer 的架构在医学图像分割中的适配，为提高准确性和鲁棒性开辟了新途径。本文探讨了分割技术的演变，强调了从传统方法到基于 CNN 方法的转变以及近期\
  \ Transformer 模型的整合。我们强调了每种范式的优势和局限性，重点关注了 `U-Net` 及其 Transformer 增强变体在克服医学图像分割挑战中的作用。\n\
  \n## 3. U-SHAPED NETWORK\n\n医学图像分割是医学领域基础且具有挑战性的任务之一，旨在从 MRI、CT 和超声等不同的医学成像模态中进一步全面识别和定义解剖结构以及病变变化（Bristi\
  \ et al., 2023; Cao et al., 2023; Chen et al., 2023a）。`U-Net` 架构被证明是一个完美的解决方案，其独特的设计使其能够完美捕捉图像中的细节和全局信息。基础\
  \ `U-Net` 结构如图 1 所示。\n\n#### 图 1. U-Net 架构\n\n![](img/979-8-3693-9816-6.ch004.f01.png)\n\
  \nU 型网络（`U-Net`）架构通常可视化如下：\n\n组件：\n\n1. **编码器（收缩路径）：**\n   - 一系列卷积层后接池化层。\n   -\
  \ 在减少空间维度的同时提取特征（下采样）。\n   - 捕捉图像的高层上下文。\n2. **瓶颈（Bottleneck）：**\n   - `U-Net` 的中心部分，在最低分辨率下处理特征。\n\
  \   - 通常由不带池化的卷积层组成。\n3. **解码器（扩展路径）：**\n   - 一系列上采样层后接卷积层。\n   - 在精细分割细节的同时重建图像分辨率。\n\
  4. **跳跃连接：**\n   - 直接连接编码器和解码器中的对应层。\n   - 保留下采样过程中丢失的空间信息和精细细节。\n\n### a. U-Net\
  \ 及其变体的 2D 应用\n\n对于多尺度特征融合，`U-Net` 引入了编码器-解码器架构，包含了用于特征提取的下采样、用于补偿信息的上采样以及跳跃连接。这种整合增强了模型考虑局部和全局特征的能力，使收敛到最优的速度更快，并提高了医学图像分割任务的准确率（Chen\
  \ et al., 2024; Chen, Lu, & Xie, 2023）。\n\n自从 `U-Net` 引入以来，在此基础上进行了多项改进。例如，`U-Net++`\
  \ 引入了减少编码器和解码器之间特征图差异的概念，通过首次引入密集路径来实现这一点（Chen et al., 2023; Cheng et al., 2023）。这种变化使得层级之间的过渡更加一致。\n\
  \n另一种演演变是 `ResUNet`，它用残差块替换了 `U-Net` 的传统卷积层。这些残差连接解决了梯度消失问题，允许网络在不损害性能的情况下加深（Cheng,\
  \ Tang, & Li, 2024; Dong et al., 2023](#979-8-3693-9816-6.ch004.bits-pdf.xhtml#_idTextAnchor260);\
  \ Fahim, Fadil, & Bhatti, 2023; Fu et al., 2024）。在此基础上，`ResUNet++` 在每个残差块后包含了挤压激励（`SE`）块。这些\
  \ `SE` 块本质上利用通道注意力机制丢弃进入解码器的不需要特征。与标准 `U-Net` 的单次拼接过程相比，它改进了多尺度特征图整合的有效性（Gao et\
  \ al., 2024; Han et al., 2024a）。这些改进确保了 `U-Net` 及其变体成为肿瘤检测、器官分割和病变勾勒等应用中的关键资源。\n\
  \n### b. U-net 及其变体在 3D 中的应用\n\n在 3D 图像分割中，U 型网络已扩展以处理体积数据，以克服 MRI 或 CT 扫描等 3D 成像模态的困难。`V-Net`\
  \ 是著名的 3D 适配之一，作者移除了 2D 卷积层并应用 3D 卷积来处理体积数据。对于准确分割特别重要，因为这种方法包含了三个维度的空间依赖关系。由于医学影像中前景和背景类别的数量可能存在巨大，`V-Net`\
  \ 的作者利用 Dice 损失来改进分割结果（Han et al., 2024b; Hasnain et al., 2024a; Hasnain et al.,\
  \ 2024b）。\n\n\n\n\n同样，3D U-Net 通过将 2D 操作替换为 3D 操作扩展了原始的 U-Net 架构。这种 `Flex` 提供了高标准和弹性特性，非常适用于半自动和全自动特征分割。3D\
  \ 卷积的应用使得网络能够从体素数据中获取重要表示，并从医学图像对人体内部结构获得全面的理解（He & Bhatti, 2024; He et al., 2023a;\
  \ He, Gou, & Wu, 2023; He et al., 2023b; He et al., 2023c; Huang et al., 2023a）。\n\
  \n其后续进展名为 `nnU-Net`，它在此基础上指出，数据处理——准备、归一化、反归一化和超参数规范——与深度学习算法具有同等的重要性。由于对特定数据集和任务相关的每个方面进行了彻底优化，`nnU-Net`\
  \ 以极高的效率实现了高水平的分割精度，这些发现证明了通通用策略超越了网络架构（Huang et al., 2024a; Huang et al., 2024b;\
  \ Joysoyal et al., 2024; Lei et al., 2023; Li & Bhatti, 2024; Li et al., 2023a）。这些\
  \ 3D 适配模型最初是开发并应用于医学领域的，但此后已进入环境和地理等其他行业。处理 3D 数据的能力巩固了 U 型网络在广泛应用领域中的应用地位，保证了其应用前景和价值。\n\
  \n## 4. TRANSFORMER\n\n将基于 Transformer 的架构融合到 U 型网络中是医学图像分割领域的一个范式转变，其中 Transformer\
  \ 擅长全局依赖关系建模，而 U-Net 则擅长层级化特征建模（Li et al., 2024; Li et al., 2023b; Liang et al.,\
  \ 2023; Lin et al., 2023; Liu et al., 2023a; Liu, Feng, Huang, & Bhatti, 2024).\n\
  \n### 图 2. 根据需求运行的 Transformer\n\n![](img/979-8-3693-9816-6.ch004.f02.png)\n\na.\
  \ 作为编码器的 Transformer：\n\n在 U 型网络架构中，编码器组件被认为能够提取所需的特征。将 Transformer 放入编码器中可以利用这种自注意力机制从低分辨率输入图像中获取依赖关系，此外还有卷积神经网络中卷积操作熟悉的层级化特征提取。\n\
  \n#### TransUNet\n\n`TransUNet` 由 Chen 等人于 2021 年提出，是 Transformer U 型网络领域的第一项工作，专注于医学图像分割。该技术涉及在编码器内对图像块进行下采样，并将它们串行输入到传统的\
  \ Transformer 块中（Liu, Kaul, & Wang, 2023; Liu et al., 2023b; Liu et al., 2024; Luo\
  \ et al., 2023; Nawaz et al., 2024a）。这种架构利用了 Transformer 在理解长程关系和增强分割性能方面的优势，特别是对于\
  \ `SeedNet` 因为分辨率低而失败的特征图采样率（Nawaz et al., 2024b; Nawaz et al., 2024c; Nawaz et\
  \ al., 2024d; Nawaz et al., 2023）。然而，在 `TransUNet` 的情况下，我们面临着较大的固定块大小和高注意力计算，可以通过以下方式进行优化。\n\
  \n#### MedT\n\n为了解决与数据集大小的问题，`MedT` 的位置嵌入包含了一个门控机制。这种机制有助于模型的泛化能力，使其成为各种医学成像任务的良好解决方案。\n\
  \n#### X-Net\n\n`X-Net` 是一种双编码器-解码器网络，主要的分割编码器使用 Transformer 设计。此外，一个基于卷积的辅助编码器-解码器执行图像重建以作为代理任务，从而增强了基于\
  \ Transformer 的编码器中的特征表示（Nizamani et al., 2023; Noor et al., 2024; Pang et al.,\
  \ 2023; Peng et al., 2024）。这种双结构提升了网络学习特征的能力。\n\n#### LeViT-UNet\n\n`ViT` Transformer\
  \ 是轻量且快速的，部署在 `LeViT-UNet` 的编码器中实现了高精度。它在 Synapse 数据上表现出色，在速度上名列前茅（Peng et al.,\
  \ 2024; Pham et al., 2024; Pu et al., 2024）。\n\n#### TransFuse\n\n`BiFusion` 在 `TransFuse`\
  \ 中连接了 CNN 和 Transformer，并结合了它们强大的特征提取能力。它进一步使用了预训练模型 `Deit`（数据高效图像 Transformer）来提高参数效率。\n\
  \n#### Swin UNETR\n\n该模型基于 Swin Transformer，在大规模 CT 上通过对比学习和随机增强进行训练。`Swin UNETR`\
  \ 展示了在非目标数据集上预训练对于 3D 图像分割微调的优越性（Reja et al., 2023; Roy et al., 2023; Shao et al.,\
  \ 2024）。\n\nb. 仅在解码器中使用\n\n在解码器中限制使用 Transformer 旨在增强对编码器提取特征的利用。\n\n#### Segtran\n\
  \n`Segtran` 的压缩和扩展模块源自集合 Transformer `ISAB`（诱导压缩注意力块）。前者减少了计算注意力的努力，而后者基于单头 Transformer\
  \ 改进了特征差异化（Sun et al., 2023; Sun et al., 2024; Tang et al., 2024a）。`Segtran` 还通过可学习的正弦位置编码解决了语义和局部连续性问题。\n\
  \n\n\n\n\n`nnFormer` 在其编码器和解码器系统中从理论上结合了 `CNN` 和 `Transformer` 层。其所采用的多尺度监督确保了不同分辨率特征的精确性。由于利用了\
  \ `ImageNet` 预训练的 `Transformer` 模块，这种方法在减轻计算负担的同时，使得分割更加准确（Tang et al., 2024b; Wang\
  \ et al., 2023; Wu et al., 2023a）。\n\n#### D-Former\n\n`D-Former` 将空洞卷积与 `Transformer`\
  \ 模块相结合，在其架构中融合了局部和全局上下文。在类似于 `Synapse` 的数据集上，这种方法在提供了较有竞争力的性能的同时，实现了对输入图像的正确分割（Wu\
  \ et al., 2023b; Xu et al., 2024a; Xu et al., 2023a）。\n\n#### MISSFormer\n\n医学图像分割\
  \ Transformer (`MISSFormer`) 通过对 `K` 和 `V` 进行矩阵压缩，缓解了注意力机制中的序列长度问题。引入了一种名为“增强 Transformer\
  \ 上下文桥”的新型跳跃连接，允许充分融合低、高频特征。与 `Swin UNet` 相比，`MISSFormer` 执行所有多器官分割任务时所需的时间相对较少，尽管它具有高水平的准确率（Xu\
  \ et al., 2023b; Xu et al., 2023c; Yan et al., 2023）。\n\n#### MT Net\n\n提示：`MT Net`\
  \ 有效利用外部注意力机制来捕捉样本间的关系，并极大提高了分割性能。\n\n#### PCAT-UNet\n\n在 `PCAT-UNet` 中，我们在 patch\
  \ 内部及之间引入了卷积自注意力，以实现全局和局部特征之间的良好平衡。\n\n#### d. 过渡连接\n\n反，将 `transformers` 相互连接提供了一个在编码器和解码器之间的过渡连接处，从低分辨率特征图中学习全局关系的机会（Yang\
  \ et al., 2024a; Yang et al., 2023a; Yang et al., 2024b; Yu et al., 2024; Yuan et\
  \ al., 2023a; Zhang et al., 2024a）。\n\n#### UCATR\n\n`UCATR` 将经典的 `Transformer`\
  \ 架构扩展到 `U-Net` 的瓶颈阶段，用于从低分辨率图像提取全局上下文。跳跃连接和交叉注意力机制通过关注重要特征提升了分割质量。\n\n#### TransBTS\n\
  \n`TransBTS` 系列将 `Transformers` 引入过渡层。`TransBTSv2` 增加了特征空间的维度，并且比多个堆叠的 `Transformers`\
  \ 具有更好的注意力计算参数化方法和更丰富的特征。\n\n#### MS-TransUNet++\n\n为了降低注意力计算的成本，该模型采用了深度卷积；此外，多个跳跃连接有助于特征恢复和提高分割准确性。\n\
  \n#### e. 跳跃连接中的 Transformer\n\n与跳跃连接相关的特征可以改进基于跳跃连接的多模态特征融合。跳跃连接中的 `transformers`\
  \ 能够更好地对齐编码器和解码器之间的特征图。\n\n#### HTNet\n\n`HTNet` 将 `Transformer` 引入跳跃连接，即 `RAPP`（残差空洞金字塔池化）和\
  \ `HCA`（分层上下文注意力）。这些改进了多尺度上下文感知。\n\n#### f. 输出块中的 Transformer\n\n输出块中的 `transformers`\
  \ 增强了细节。\n\n#### RTNet\n\n对于 `DR` 分割，`RTNet` 在注意力模块利用 `Transformer`。正如大多数基于 `Transformer`\
  \ 的网络所示，`Transformer` 通常放置在编码器部分。\n\n\n\n\n\n基于 Mamba 的分割是一个超越了 Mamba 公式简单使用、迈向当今深度学习方法的发展过程（Aamir\
  \ et al., 2018a）。Mamba 算法源于形态学图像处理，对于分割具有几何和结构特征的物体非常有效，因此在接触边界最显著的地方效果最理想。这种分割方法在分析那些可能具有不确定结构和异常形状的复杂图像时尤为出色；这是通过使用包括膨胀、腐蚀、开运算和闭运算在内的形态学算子来改进物体的形状和轮廓。当整合到这些深度学习平台时，为分割开发的基于\
  \ Mamba 操作将有效地将旧的图像处理方法与更复杂的神经网络技术结合起来（Aamir et al., 2019a; Aamir et al., 2018b）。\n\
  \n准确地，基于 Mamba 的分割已经在医学影像应用中得到了很好的实现，在该领域，精确的边界检测至关重要。例如，在肿瘤分割中，该方法提高了肿瘤边缘精确细节的机会，这对于诊断和治疗具有重要意义。与\
  \ `CNNs` 或 `Transformer` 结构结合时，基于 Mamba 的分割还可以在保持分割区域结构相干性的同时进行全局和局部上下文分析。此外，它与去噪或边缘检测等许多预处理/后处理方法结合的能力使其在复杂的成像条件下极具吸引。（Aamir\
  \ et al., 2017a; Aamir et al., 2019b; Guan et al., 2021a; Guan et al., 2021b; Guan\
  \ et al., 2021c）\n\n将 Mamba 的某些方面引入到 `U-Net` 或其衍物等 U 型架构中，为架构增加了形态学不变性，并通过更具包容性的边界改进了分割效果。这对于大型或更多化的数据集特别有益，特别是对于组织病理学或多器官\
  \ CT 扫描。此外，衍生的基于 Mamba 的分割速度快得多，甚至是实时的，这使其能够应用于手术导航甚至自动诊断平台等应用场景中。这些特征结合多尺度特征提取的完美能力，使该方法成为图像分割领域极具前景的工具（Aamir\
  \ et al., 2023c; Aamir et al., 2019c; Guan et al., 2021d; Aamir et al., 2019d; Aamir\
  \ et al., 2018c）。\n\n## 7. 挑战与展望\n\n### 7.1 挑战\n\n已发现 `Transformers` 在那些存在长依赖模型的应用中能够卓越的结果。然而，在医学影像分割中使用它们会引入某些基于医学数据集性质和\
  \ `Transformers` 复杂性的困难性问题（Aamir et al., 2019e; Aamir et al., 2018d; Aamir et al.,\
  \ 2019f）。如下所示，解决这些问题对于在医学影像任务中部署至关重要。\n\n### 1. 小样本医学图像数据集\n首先是缺乏可用于任何 AI 训练的大型标注医学图像数据集。在医学图像中标记也需要大量精力、花费大量时间且非常昂贵。这种限制是非常致命的，因为它限制了训练深度学习模型所需大型数据集的数量。`Transformers`\
  \ 特别是受益于大样本量，因为自注意力机制被用于有效捕捉全局依赖。因此，当我们没有广泛且深入的数据集时，就会面临开发出过拟模型的风险，从而在其他语境下可能不具迁移性和高效性（Guan\
  \ et al., 2021e; Aamir et al., 2023d; Guan et al., 2021f）。这个问题需要使用迁移学习、半监督学习或无监督学习等方法来利用小样本量。\n\
  \n### 2. 诊断或治疗期间的许多图像需要高质量\n这些图像通常具有高分辨率以提供清晰的人体解剖图像。实际上，为自然语言处理任务设计的图像在处理之前应被序列化为序列。由于像\
  \ `Vision Transformer (ViT)` 等方法将图像转换为块，高分辨率图像被视为长序列。这些长序列增加了计算和内存需求，因为自注意力的计算成本与序列的平方成正比。这一挑战阻碍了\
  \ `Transformers` 在医学影像中的扩展性，特别是实时学习，因此这启发了对更好注意力机制的需求。\n\n### 3. 导致效果不另一个因素是缺乏位置信息\n\
  位置信息在医学图像分割中至关重要，因为结构取决于周围的空间。具体而言，虽然像卷积神经网络 `CNNs` 等卷积架构通过局部感受野具有固有的位置关系，但这里描述的基础\
  \ `Transformer` 架构并不具备。为了克服这个问题，在输入序列中加入了位置嵌入以确保模型理解空间关系。然而，这些嵌入特定于数据集，并且对成像模态敏感。这种变异性与其他因素结合，可能会导致次优性能，从而强调了创建更具结构不变性和通用性的位置编码方法的需求。\n\
  \n### 4. 特别地，自注意力机制仅在块计算内执行\n由于计算成本高昂，通常不使用独立的像素级注意力，注意力通常在图像块之间计算。虽然这种基于块的方法有助于减少计算负载，但缺点是它失去了建模图像块内细粒度关系的能力，正如\
  \ `ViT` 架构所示。这种缺点在医学图像分割中特别引人注目，因为通常微动脉瘤或其他细微结构可能需要像素区分，而肿瘤边缘通常很薄。未能考虑到这些关系会导致小结构的定义不精确，甚至丢失边界，这直接影响分割的成功。为此，仍然需要通过使用完整的混合模型/注意力机制或某些精细内核来提供更快的收敛速率和更准确的像素级估计，以完全恢复原始像素。\n\
  \n### 7.2 展望\n\n基于结合 `Transformers` 和 U 型架构的混合网络的进展，概述了几个前景前景的研究方向和未来展望：\n\n*  \
  \ **半监督和无监督学习**：为了应对医学领域标记数据稀缺的问题，可以使用 `Transformers` 通过解决辅助任务从大规模数据获取全局表示。此外，在半监督或无监督训练的情况下，通过获取高置信度的伪标签可以提高分类性能和泛化能力。\n\
  \n\n\n\n- **先验知识的整合**：可以结合关于形状和位置先验的知识，使模型能够关注重要特征，同时避免对本质相同的内容进行多次拟合。这可能需要使用解剖学先验，以更准确地表示设计中的结构关系，从而提高医学图像分割的性能。\n\
  - **多模态图像融合**：通过这种方式，一种成像模态的特征可以用另一种成像模态的特征信息进行补充。例如，整合`T1 加权 MRI` 用于结构信息可视化，而利用`T2\
  \ 加权 MRI` 用于病变位置，可以产生更好且更准确的分割。\n- **优化采样方法**：U 型网络中的标准下采样和上采样往往会丢弃有用的高频信息并产生重复信息。在决策过程中增强更先进的采样方法，可以有效地保持重要特征的丰富性，同时降低模型的复杂性，从而大大提高模型的准确性和计算速度。\n\
  \n上述研究方向强调了在基于混合 Transformer 的 U 型结构网络的设计和性能方面的未来改进潜力，以产生具有前景且具有临床效益的医学图像分割结果。\n\
  [/content]\n\n---\n\n### 第二部分：结论（译文）\n\n[content]\n## 8. 结论\n\nTransformer 已经成为深度学习中的骨干力量，证明了它们通过注意力机制捕捉全局上下文的价值。这种优势在医学图像分割中特别有用，因为离散的目标区域和解剖形状的变异性很难处理的。与利用局部感受野且难以捕捉长距离依赖关系的\
  \ CNN 相比，Transformer 的设计用于学习图像中每个点与任何其他点之间的关系，因此在具有挑战性的情况下产生高度准确且一致的分割。\n\n然而，当应用于医学图像分割时，Transformer\
  \ 面临以下主要挑战：一个主要的限制是需要在大型数据集上进行训练，因为自注意力机制在高维空间运行，需要大量数据来实现泛化。医学图像数据集的关键问题在于，由于标注所需的时间和成本，这些数据集通常较小。数据的匮乏限制了\
  \ Transformer 充分利用其潜力和能力，导致在解决问题过程中产生次优解决方案。\n\n为此，将 Transformer 与 U 型网络结合可以被视为一种折中方案。我们在\
  \ `U-Net` 网络中描述的 U 型架构由于其编码器-解码器设计和跳跃连接，擅于捕捉局部空间尺度上的复杂依赖。通过将 U 型网络与 Transformer\
  \ 模块相结合，生成的混合模型可以兼顾两种方法的优势：Transformer 的全局上下文建模和 U 型网络的局部特征提取。这种整合有助于提高模型在全局视图和复杂细节都至关重要的正确分割案例中的表现。\n\
  \n在本文中，我们提出了基于 Transformer 的 U 型网络，并根据 Transformer 模块在网络中的位置对其进行了分类。例如，在编码器中整合 Transformer\
  \ 可以捕捉全局关系，而在解码器中整合它则可以细致地利用上下文信息重建分割图。在编码器中加入 Transformer 的混合设计（如 `TransUNet`）以及在解码器中加入的设计（如\
  \ `MISSFormer`）表明了此类方法的优势。这些模型在包括多器官分割和稀缺数据集病变检测在的任务中表现出增强的性能。本文介绍并分析了这些网络，并总结了\
  \ U 型网络与 Transformer 结合时可能产生的变化。它们还克服了源于各种任意结构的缺点，并为医学图像分割的进一步发展揭示了方向。这种对全局和局部细节建模的能力使得基于\
  \ Transformer 的 U 型网络成为未来研究的路径，并有望通过提高效率来彻底改变医学影像诊断。\n[/content]\n\n---\n\n### 第三部分：参考文献（译文）\n\
