  \nP. Mercy 是位于泰米尔纳德邦钦奈的安德高等学院（`Anand Institute of Higher Technology`）计算机科学与业务系统系的系教职教师。她专注于将技术与业务原则相结合，在塑造学生的学术和职业历程方面发挥着重要作用。她的专业领域涵盖计算机科学、信息系统及其在现代业务背景下的应用。在学院里，她致力于培养创新，鼓励实践学习，并确保学生能够在不断发展的由技术驱动的业务世界中取得成功。\n\
  \nP. Selvakumar 目前是印度泰米尔纳德邦哥尔培尼赫鲁技术学院（`Nehru Institute of Technology`）科学与人文系的副教授。自\
