  \n### 2.3 生成对抗网络 (GAN)\n\n生成对抗网络 (GANs) 是一种由两个神经网络组成的深度学习模型（Goodfellow et al., 2014)。（(Goodfellow\
  \ et al., 2020)。（(Stovic et al., 2024)。（(Goodfellow et al., 2014)。训练过程不是一次性事件，而是一个持续优化正确标记训练实例和\
  \ G 实例似然性的迭代过程。当 D 被训练时，G 被被训练以最小化 `1 - D(G(z))`。这种“游戏”的竞争本质迫使双方不断改进，直到生成的数据与真实数据变得无法区分，如图\
  \ 图 2。\n\n输入噪声变量 `pz` 是预定义的，用于学习数据 `x` 上生成器分布 `p[g]`。`G(z; θ[g])` 是一个应用于数据领域的映射函数。在这种情况下，具有参数\
  \ `θ[g]` 的 MLP 代表可微函数 `G`。第二个产生单个标量的 MLP 是判别网络 `D`。`D(x; θ[d])` 是定义。`x` 源自训练数据而非\
  \ `p[g]` 分布的概率由 `D(x)` 给出。对于梯度更新，建议应用任何其他常用的梯度学习规则；在模型中，应用了动量学习规则。\n\n\n\n\n\n##\
  \ 2.4. CycleGAN\n\nCycleGAN 是一种用于不同数据集之间视觉风格迁移的深度学习算法（Zhu et al., 2017）。它在不匹配的数据集上特别有效（Goodfellow\
  \ et al., 2020）。CycleGAN 输入两个包含来自不同区域图像的数据集。这些集合中的图像不需要相互匹配。它包含两个生成层，分别标记为 `F` 和\
  \ `G`。第一个生成层 `G` 将图像从一个领域转换到另一个领域，而第二个生成层 `F` 则尝试逆转这种转换。每个区域都有一个对应的判别器。这些判别器旨在区分真实图像和伪图像。图像首先通过\
  \ `G` 转换到另一个领域，然后通过 `F` 返回到第一个领域。生成的图像与原始图像之间的距离被称为循环损失（cyclic loss）。该模型通过最小化这些损失进行训练，从而学习如何生成真实的图像，并同时将其还原回原始图像。在模型中，`X={x_1,\
  \ ..., x_N}` 和 `Y={y_1, ..., y_M}` 是训练数据，`x` 和 `y` 来自相同的分布。模型中有两个分布函数 `F` 和 `G`，定义为\
  \ `F: X→Y` 和 `G: Y→X`。此外，定义了两个对比的判别器 `D[x]` 和 `D[y]`。`D[x]` 学习 `x` 与 `F(y)`（转换到\
  \ Y 的结果）之间的差异，而 `D[y]` 学习 `G(x)` 之间的差异。基本上，这里计算了两种损失。第一个是每次转换中的损失，称为对抗损失（opposite\
  \ loss），第二个是函数 `F` 和 `G` 完成一个完整循环时生成数据与实际数据之间的损失。在这里，函数 `G` 的循环损失使用公式 9 计算，函数 `F`\
  \ 使用公式 10 计算。结束时的循环一致性损失通过公式 11 计算。模型的总损失被认为是这些损失之和。总损失通过公式 12 计算，其中 `G` 和 `F` 损失的超参数\
  \ `λ` 代表两个模型的相对重要性。目标是最小化总损失。\n\n$$\n\\text{D}\\text{\\*}\\_{G}\\left( x \\right)\\\
  {~=~}\\frac{p_{\\text{data}}\\left( x \\right)}{p_{\\text{data}}\\left( x \\right)\\\
  text{~+~}\\text{p}_{g}\\left( x \\right)}\n$$\n\n(7)\n\n$$\n\\text{D}\\text{\\*}\\\
  _{G}\\left( x \\right)\\{~=~}\\frac{p_{\\text{data}}\\left( x \\right)}{p_{\\text{data}}\\\
  left( x \\right)\\text{~+~}\\text{p}_{g}\\left( x \\right)}\n$$\n\n(8)\n\n#### 图\
