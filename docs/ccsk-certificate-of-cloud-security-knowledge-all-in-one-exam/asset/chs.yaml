  \ 第 337 页\n\n* * *\n\n## 关于作者\n\n**Graham Thompson** 是 Intrinsec Security 的创始人，一家为北美企业和政府提供云安全咨询和培训的组织。他是一名拥有\
  \ 25 多年系统工程、技术架构、漏洞评估以及多种管理职务经验的安全专业人员。他为领先的企业和政府机构构建了数百万美元的成功安全解决方案。\n\n自 2010\
  \ 年起，Graham 专注于云安全。他为北美政府机构以及财务、电信和零售行业的财富 500 强企业设计和评估了云安全解决方案。他是 Cloud Security\
  \ Alliance 以及 (ISC)² 认证的 CCSK、CISSP 和 CCSP 培训师，并参与了相关课程的开发，作为领域专家。\n\n除了 CSA 和 (ISC)²\
  \ 认证外，Graham 还获得了包括 Amazon、ISACA（CISA）、Microsoft（MCSE）、Cisco、Symantec、Fortinet、SANS\
  \ 等多个认证。他于蒙特利尔麦吉尔大学学习，并在渥太华阿尔冈金学院为多门安全课程担任兼职教授。\n\n### 关于技术编辑\n\n**Ryan Bergsma**，CCSK，是一名致力于推广网络安全最佳实践的网络安全专业人员，尤其关注云安全。作为云安全联盟的培训项目主管，他不断寻找将最新的最佳实践文档转化为培训产品的方法，以填补网络安全技能缺口，培养能够构建更安全网络生态系统的个人。Ryan\
  \ 出身于销售和业务背景，拥有计算机信息系统安全学士学位。\n\n**Daniele Catteddu** 是一名安全与风险管理实践者和隐私倡导者。他在私营和公共部门的高级职位拥有丰富经验。目前，他是\
  \ Cloud Security Alliance 的首席技术官，负责推动组织技术战略的采用。他是 CSA STAR 计划的联合创始人，并是意大利国家标准化委员会在\
  \ ISO/IEC SC27 委员会的成员。他是马斯特里赫特大学隐私与网络安全中心的讲师，欧洲隐私协会科学委员会成员，以及肯特大学网络安全咨询委员会成员。此前，他在\
  \ ENISA（欧洲联盟网络安全局）担任关键信息基础设施保护及新兴和未来风险方面的专家。加入 ENISA 之前，他在银行和金融行业从事信息安全顾问工作。他拥有意大利帕尔马大学的工商管理与经济学硕士学位。他经常在主要安全会议上发表演讲，并撰写了多篇关于网络安全和隐私的论文。\n\
  \n**Dr. Peter van Eijk**，CCSK, CCSP，是一位经验丰富的信息技术专业人士，拥有 40 多年信息与通信技术及计算机科学领域的经验。他是实践者、研究者和教师。他的经历包括在计算机网络、数字基础设施项目的教学与研究、管理多个项目与团队以及担任互联网服务提供商的技术总监。咨询期间，他的实践经验涵盖\
  \ IT 共享服务成本与风险评估、客户服务架构、IT 战略、协作架构以及共享服务实施。他还活跃于 ISO 标准化活动、政府关键网络基础设施委员会以及 CSA 志愿者工作。Dr.\
  \ van Eijk 编写并交付了多个云培训项目，包括如今被公认为 CompTIA Cloud Essentials 的第一版课程。他目前作为独立 CCSK 培训师以及乌特勒支\
  \ Hogeschool 的网络安全与云计算副教授工作。他拥有格罗宁根大学数学与计算机科学硕士学位，以及滕托大学的博士学位。\n\n![](img/title.jpg)\n\
