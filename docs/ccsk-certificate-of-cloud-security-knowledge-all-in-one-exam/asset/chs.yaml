  \n## GLOSSARY\n\n**ABAC (attribute-based access control)** An access control scenario\
  \ that grants users access rights based on policies that combine attributes. It\
  \ considers the attributes of an entity and the connection in making access control\
  \ decisions. For example, a user who used multifactor authentication, which requires\
  \ two or more authentication factors, may be granted additional access, while a\
  \ user who does not use MFA authentication would be granted less.\n\n**Amazon Simple\
  \ Storage Service (S3)** A form of storage for use on the Web that provides scalability,\
  \ data availability, security, and performance and enables you to retrieve any amount\
  \ of data at any time.\n\n**API (application programming interface)** A protocol\
  \ that exposes functionality through an interface to simplify the receipt of requests\
  \ and delivery of responses. The two major types of APIs are Representational State\
  \ Transfer (REST) and Simple Object Access Protocol (SOAP).\n\n**attestation** A\
  \ formal statement that is officially claimed to be true. Attestations are legally\
  \ binding. Provider attestations are part of a Service Organization Control 2 (SOC\
  \ 2) report, for example, indicating a third-party, independent assessment of the\
  \ security of a cloud service provider.\n\n**auto-scaling** A method used in the\
  \ cloud, whereby the amount of computational resources in a server farm, typically\
  \ measured in terms of the number of active servers, scales automatically based\
  \ on current load.\n\n**automation** The processes and tools an organization uses\
  \ to reduce the manual efforts associated with provisioning and managing cloud computing\
  \ workloads.\n\n**availability zone** An isolated data center within a geographical\
  \ region from which public cloud services originate and operate.\n\n**AWS (Amazon\
  \ Web Services)** A public cloud service created and maintained by Amazon that offers\
  \ compute power, database storage, content delivery, and other functionality to\
  \ help businesses scale and grow.\n\n**Azure** A cloud service created by Microsoft\
  \ for building, testing, deploying, and managing applications and services through\
  \ a global network of Microsoft-managed data centers.\n\n**bastion virtual network**\
  \ An emerging architecture for hybrid cloud connectivity. It can also be used to\
  \ manage connectivity across multiple accounts in the same cloud provider environment\
  \ while maintaining a single network connection back to a data center.\n\n**broad\
  \ network access** Resources hosted in a cloud environment that are available for\
  \ access from a wide range of locations and devices. It is an essential characteristic\
  \ of cloud computing.\n\n**CAIQ (Consensus Assessments Initiative Questionnaire)**\
  \ A survey for cloud consumers and auditors provided by the Cloud Security Alliance\
  \ to assess the security capabilities of a cloud provider.\n\n**CASB (cloud access\
  \ security broker)** A software service or appliance that is deployed between an\
  \ organization’s on-premises infrastructure and a cloud provider’s infrastructure.\
  \ A CASB acts as a control primarily for Software as a Service (SaaS) and enables\
  \ the organization to extend the reach of their security policies beyond their own\
  \ infrastructure.\n\n**CCM (Cloud Controls Matrix)** A set of security controls\
  \ created by the CSA that provides fundamental security principles to guide cloud\
  \ vendors and to assist prospective cloud customers in assessing the overall security\
  \ risk of a cloud provider.\n\n**CCSK (Certificate of Cloud Security Knowledge)**\
  \ A certification used to validate that a professional has a broad foundation of\
  \ knowledge about cloud security, with topics such as architecture, governance,\
  \ compliance, operations, encryption, virtualization, and much more.\n\n**CCSP (Certified\
  \ Cloud Security Professional)** A certification used to validate that cloud security\
  \ professionals have the required knowledge, skills, and abilities in cloud security\
  \ design, implementation, architecture, operations, controls, and compliance with\
  \ regulatory frameworks.\n\n**chaos engineering** A testing methodology by which\
  \ the interrelationships between components in a system are tested by simulating\
  \ failures in components and studying what knock-on effect occurs throughout the\
  \ system. It is used to instill the requirement for resiliency in the development\
  \ phase.\n\n**chargeback** Also known as IT chargeback. An accounting strategy that\
  \ applies the costs of IT services, hardware, or software to the business unit in\
  \ which they are used.\n\n\n\n# CI/CD（continuous integration/continuous deployment）\n\
  一种常用于 DevOps 的工具集，用于建立一致且自动化的方式来构建、包装和测试应用程序。也称为 continuous integration/continuous\
  \ delivery，具体取决于目标环境（开发或生产）。\n\n# cloud account（云账户）\n任何类型的账户，包括个人或企业，与云服务提供商关联。\n\
  \n# cloud broker（云经纪人）\n一个管理云服务的使用、性能和交付的实体，并负责调解云提供商与云消费者之间的关系。\n\n# cloud bursting（云突发）\n\
  一种应用部署模型，其中应用在私有云或数据中心运行，当计算容量需求激增时，会自动扩展到公有云。\n\n# cloud firewall（云防火墙）\n也称为安全组。策略集用于定义入站和出站规则，可应用于单个资产或资产组，无论其网络位置如何。此外，云防火墙可以基于比硬件防火墙更灵活的标准进行管理，因为它不受物理拓扑的限制。\n\
  \n# community cloud（社区云）\n一种提供云计算解决方案的部署模型，专为有限数量的个人或组织提供，并由所有参与组织或第三方托管服务提供商共同治理、管理和保护。所有社区云成员共享相似的安全性和合规性要求。\n\
  \n# configuration management tool（配置管理工具）\n一种用于在产品整个生命周期内保持其性能、功能和物理属性与需求、设计及运营信息一致的工具。\n\
  \n# container（容器）\n一种逻辑包装机制，使得应用程序能够与其运行环境解耦。这种解耦使得容器化应用可以在任何环境（私有数据中心、公有云或开发者个人笔记本）中轻松且一致地部署。容器有助于解决云环境中的可移植性问题。\n\
  \n# continuous integration server（持续集成服务器）\n一种用于支持频繁集成软件实践的工具，通常在源代码库中对任何 artifact\
  \ 发生变更时进行集成。每当团队成员向仓库提交更改时，持续集成可用于确保该变更通过一系列测试，并能够成功构建、测试和部署。\n\n# controller（控制器）\n\
  也称为 cloud controller（云控制器）。一种帮助管理或编排云操作的服务。例如，当用户请求实例时，云控制器会处理该请求并将其发送到适当的目标，全程监控直至完成。\n\
  \n# CSA (Cloud Security Alliance)（云安全联盟）\n全球领先的致力于定义和提高云计算安全最佳实践意识的组织，帮助确保安全的云计算环境。\n\
  \n# CSP (cloud service provider)（云服务提供商）\n一家向其他企业或个人提供云计算某些组件（通常为 IaaS、SaaS 或 PaaS）的公司。\n\
  \n# custodian（数据保管人）\n也称为 data custodian（数据保管人）。在 IT 领域，指负责安全保管、传输和存储数据，并实施业务规则的实体。换言之，保管人负责技术环境和数据库结构，以保护最终用户的数据。\n\
  \n# customer managed key（客户管理密钥）\n由云客户管理的加密密钥，而云提供商负责管理加密引擎。\n\n# DAM (database\
  \ activity monitor)（数据库活动监控套件）\n一组工具，用于以最小影响用户操作和生产力的方式识别和报告欺诈、非法或其他不良行为。它通过检查 SQL\
  \ 代码来实现，因而可以被视为 SQL 的层 7 防火墙。\n\n# DAST (dynamic application security testing)（动态应用安全测试）\n\
  对运行中的应用程序或软件产品进行的测试过程。此类测试有助于满足行业标准合规性以及为不断发展的项目提供通用安全防护。\n\n# data（数据）\n由计算设备处理或存储的信息，可包括文本文档、图像、音频片段、软件程序或其他媒体类型。\n\
  \n# data dispersion（数据分散）\n一种允许数据在分布式存储基础设施中复制的过程。它使服务提供商能够根据用户订阅级别或项目受欢迎程度提供存储服务。可被视为独立磁盘的冗余阵列（RAID）的一种形式，但涉及多台服务器。\n\
  \n# dedicated hosting（独立托管）\n一种客户租用整台不与其他人共享的服务器的 Internet 托管方式。相比共享托管，它更具灵活性，因为组织拥有对服务器的完整控制权，包括操作系统、硬件等选择。\n\
  \n# deployment model（部署模型）\n一种表示特定云环境类型的模型，主要区别于所有权、规模和访问权限。常见的四种云部署模型为公有云、社区云、私有云和混合云。\n\
  \n# DevOps\n一种旨在统一软件开发（Dev）与软件运维（Ops）的工程文化和实践。DevOps 的核心特征是倡导在软件构建的全部阶段（集成、测试、发布、部署及基础设施管理）中实现自动化和监控。\n\
  \n# DevSecOps\n一种在 DevOps 工作流中嵌入安全控制和流程，以自动化核心安全任务的实践。\n\n# Direct Connect\nAWS\
  \ 提供的 Direct Connect 服务，可实现私有连接方式，将 AWS 与数据中心、办公室或共 colocation 环境相连，通常能降低网络成本、提高带宽\
  \ throughput，并提供比基于 Internet 的连接更一致的网络体验。Microsoft Azure ExpressRoute 和 Google Cloud\
  \ Dedicated Interconnect 产品类似。\n\n# DLP (data loss prevention)（数据丢失防泄漏）\n一种确保终端用户不在企业网络外发送敏感或重要信息的策略，也用于描述帮助网络管理员控制用户数据传输的软件产品。\n\
  \n# EC2 (Elastic Compute Cloud)（弹性计算云）\nAmazon 提供的弹性计算云服务，提供安全且可伸缩的云端计算容量，旨在简化开发者的大规模云计算。\n\
  \n# e-discovery（电子发现）\n在诉讼或调查中，识别、收集并以电子形式提供已存储的信息（ESI）的过程。ESI 包括但不限于电子邮件、文档、数据库、语音信箱、社交媒体和网站。\n\
  \n# elasticity（弹性）\n云服务提供商能够根据需求快速动态调配资源的能力，即在需求上升或下降时实时切换资源。这通常是对客户实时增减服务的即时反应。\n\
  \n# ENISA (European Network and Information Security Agency)（欧洲网络与信息安全局）\n一个增强欧盟及其成员国网络和信息安全防护能力的机构，帮助整个商业社区预防、应对和响应网络与信息安全挑战。\n\
  \n# entitlement（权限）\n角色、个人或属性等身份映射到授权的过程。换句话说，权限指示唯一用户身份对特定资源或系统能够执行（或不得执行）的操作。为了文档目的，我们将这些内容保存在权限矩阵中。\n\
  \n\n\n# 许可矩阵\n一个文档，列出特定用户、群体和角色被允许使用的各种资源和功能。\n\n# 短暂的\n描述某事物变化速度很快，或持续时间极短的情况。例如，短暂存储不会长期写入磁盘。\n\
  \n# 关键特征\n使云计算成为云的特征：关键特征包括资源池化、按需自助服务、广泛的网络、快速弹性和计量服务。如果某事物具备这些特征，我们认为它是云计算；如果缺少其中任何一项，则很可能不是云。\n\
  \n# 事件驱动安全\n一种在安全事件发生时自动触发操作的安全系统。此类安全系统可定义会产生安全操作的事件，并利用事件驱动能力触发自动通知、评估、修复或其他安全流程。某些云服务提供商支持事件驱动的代码执行。在这些情况下，管理平面会检测到各种活动，并通过通知消息或通过托管无服务器代码触发代码执行。\n\
  \n# 联合身份\n也称为联邦。将两个或多个服务提供商的云计算环境相互连接的做法，目的是平衡流量并应对需求峰值。\n\n# FedRAMP（联邦风险和授权管理计划）\n\
  由管理预算办公室指示美国机构使用的评估和授权流程，旨在确保在访问云计算产品和服务时安全得到保障。\n\n# GDPR（通用数据保护条例）\n欧盟法律中关于保护和隐私个人数据的法规，适用于欧盟内的所有个人，同时也涉及欧盟外个人数据的跨境传输。GDPR\
  \ 旨在让公民和居民对其个人数据拥有控制权，并通过统一 EU 内的法规简化国际业务的监管环境。\n\n# HSM（硬件安全模块）\n一种物理计算设备，用于保护和管理数字密钥以实现强身份验证，并提供加密处理。传统上，HSM\
  \ 以插卡形式或作为直接连接到计算机或网络服务器的外部设备出现。\n\n# 混合云\n由两个或更多云（如私有云和公有云）组成的组合，这些云保持独立但相互绑定，提供多种部署模型的优势。它也可指传统数据中心与公有云的组合。\n\
  \n# 超 visor（虚拟化层）\n用于创建和运行虚拟机的计算机软件、固件或硬件。\n\n# IaaS（基础设施即服务）\n一种云计算服务模式。IaaS 云提供商会托管传统数据中心中包含的基础设施组件，如服务器、存储、网络硬件，以及虚拟化或超\
  \ visor 层。在这种服务模式下，客户对安全承担最多责任。\n\n# IAM（身份和访问管理）\n一种安全与业务纪律，用于确保在日益异构的技术环境中对资源的适当访问，并满足日益严格的合规要求。\n\
  \n# IAST（交互式应用安全测试）\n一种在测试阶段分析应用程序行为的测试过程，结合 RASP（运行时应用自我保护）和 DAST（动态应用安全测试），帮助识别应用程序中的漏洞，使开发人员在开发过程中降低风险。\n\
  \n# IdEA（身份、许可和访问）管理\n一种利用目录服务提供访问控制的解决方案，在特定时间为授权用户提供访问其被允许访问的资源的功能。\n\n# 身份提供者（IdP）\n\
  一个系统实体，使组织能够为使用多种在线服务或应用程序的个人创建和维护身份信息。\n\n# 映像\n供消费者的提供者提供的可用副本，或用于构建服务器实例的先前创建的映像。\n\
  \n# 不可变\n指在创建后状态无法更改的对象。在云中，不可变基础设施意味着服务器在部署后不会被修改；如果需要变更，会基于相似映像创建新的服务器实例，应用变更后重新部署。\n\
  \n# 信息结构\n在云环境中存储的任何结构化或非结构化数据。\n\n# 基础设施\n构成计算系统基础的移动部分，通常包括计算、网络和存储；在公有云中由提供商拥有。\n\
  \n# 实例\n一个运行您服务器映像的服务器，您对其维护和确保安全运行负有完全责任。\n\n# 互操作性\n多个实例能够同时工作且不受任何限制的能力。\n\n\
  # ISO/IEC（国际标准化组织/国际电工委员会）\n一个技术委员会，负责开发、维护和推广一系列 IT 标准，如 ISO/IEC 27001 和 ISO/IEC\
  \ 27017。\n\n# 隔离\n一种确保同一虚拟机或容器中的进程不可见于另一个的做法，允许多租户在同一基础设施上共存。\n\n# 跳板工具包（jump kit）\n\
  用于云环境中事件响应的软件工具集合。\n\n# 管辖权\n根据地理位置确定适用法律。\n\n# KMS（密钥管理系统）\n管理加密系统中的密钥的系统；它负责密钥的生成、交换、存储、替换、使用和销毁。\n\
  \n# Lambda\n亚马逊云科技（AWS）提供的事件驱动、无服务器计算平台。微软 Azure 和 Google Cloud Functions 是竞争的无服务器计算产品。\n\
  \n# 负载均衡\n将工作量在多个计算资源之间分发的过程。通常以应用负载均衡或网络负载均衡服务的形式提供。\n\n## 管理平面\n系统的元素，通过 API 调用和\
  \ Web 控制台管理基础设施、平台、应用和资源。\n\n# 计量服务\n云提供商通过测量和监控系统，确保用户仅消费其被允许的资源，并在必要时进行计费的过程。\n\
  \n# 元数据\n关于其他数据的信息，通常用于发现和识别。\n\n# 元结构\n提供基础设施与系统内其他层之间接口的协议和机制。\n\n# MFA（多因素认证）\n\
  用户需通过两个或更多验证因素（如知识因素（密码）、拥有因素（智能卡）或是因素（生物特征））确认身份的过程。\n\n# 微服务\n也称为微服务架构。一种将软件应用开发为一组独立且各自独立的服务的方法。\n\
  \n# 迁移\n将系统从一个环境移动到另一个的过程，例如从数据中心迁移到云端。\n\n# 多租户\n一种运营模式，多个个别租户（如公有云中的公司）在共享环境中运行。租户在逻辑上相互隔离，但在物理上是集成的。\n\
  \n# NIST 800-53\n由国家标准与技术局（NIST）创建的指南，规定了联邦信息系统和组织的安全与隐私控制。\n\n\n\n\n# NIST 800-61\
  \ A 由国家标准技术局（NIST）创建的指南，关于计算机安全事件处理（事件响应）。\n\n# NIST 800-145 国家标准技术局（NIST）定义云计算的文档。\n\
  \n# OAuth 协议 一个用于授权的行业标准，用于处理 Web、桌面、移动设备和物联网（IoT）设备的授权。\n\n# on-demand 按需的能力，可以自动且单方面地在无需任何人工交互的情况下，按需分配计算资源。\n\
  \n# OpenFlow 软件定义网络（SDN）通信协议，它使网络控制器能够确定网络交换机之间网络数据包的路径。\n\n# OpenID 开源标准，使用户可以使用单一现有账户在多个网站上登录，而无需新密码。它可以在\
  \ OAuth 授权能力之上提供身份验证。最新版本是 OpenID Connect（OIDC）。\n\n# orchestration 自动化安排、协调和管理计算机系统的能力。\n\
  \n# PaaS（Platform as a Service）云计算服务模型。该完整的开发和部署环境在云端，设计用于支持完整的 Web 应用程序生命周期：构建、测试、部署、管理和更新。它使您能够交付从简单的云端应用到复杂的云启用企业级应用。\n\
  \n# packet encapsulation 设计模块化通信协议的方法，通过在更高层次对象中包含或隐藏信息，将网络中逻辑上独立的功能抽象化，隐藏其底层结构。\n\
  \n# pools 一组随时可用的资源集合。在云计算中，资源池通常专注于计算、网络、存储和容器池。\n\n# portability 将应用程序和/或系统从一个环境迁移或重复使用到另一个环境的能力。\n\
  \n# private cloud 仅为单一组织运营的云基础设施，由该组织或第三方管理，且可以在本地或远程部署。\n\n# public cloud 由提供云服务的组织拥有，并向大量用户提供云服务的云基础设施。\n\
  \n# RASP（runtime application self-protection）实时检测并保护应用程序免受攻击的安全技术。\n\n# raw storage\
  \ 直接连接到虚拟机的存储，通常在公有云中不可用。\n\n# RBAC（role-based access control）基于角色的访问控制，一种根据个人在组织中的角色来确定其可访问权限的访问安全方法。\n\
  \n# region 工作负载运行的管辖区域，通常由云服务提供商的设置中用户自定义。\n\n# relying party 依赖方，即依赖身份提供者（identity\
  \ provider）发出的身份断言的系统。\n\n# resiliency 云服务提供商在面对挑战时保持运营的能力，通过在同一云中使用另一套冗余的 IT 资源实现。\n\
  \n# RESTful（Representational State Transfer）API 使用 HTTP 请求（GET、PUT、POST、DELETE）来获取、更新、创建和删除数据的应用程序编程接口。\n\
  \n# SaaS（Software as a Service）云端软件解决方案和服务模型，提供商承担最多的安全责任。\n\n# SAML（Security Assertion\
  \ Markup Language）由 OASIS 开放标准组织定义的一种标记语言框架，用于在企业工具和云服务提供商之间实现身份管理的联合。它支持身份验证和授权，并创建身份提供者与依赖方之间的断言。\n\
  \n# SAST（static application security testing）白盒测试工具，通过检查应用程序源代码从内到外确定安全漏洞。SAST 可在软件开发生验证生命周期（SDLC）的所有阶段使用。\n\
  \n# SCIM（System for Cross-domain Identity）标准，用于自动化用户配置、在身份提供者和服务提供者之间传输用户身份数据，以及管理用户身份信息。注意\
  \ SCIM 用于配置，不用于联邦。\n\n# SDI（software defined infrastructure）也称为基础设施即服务（IaC）。使用模板自动化部署虚拟基础设施的过程。\n\
  \n# SDLC（software development lifecycle）软件开发生命周期框架，概述了软件开发过程中必须完成的任务和责任。\n\n# SDN（software\
  \ defined networking）将网络数据包从控制平面解耦的过程，以提升网络性能和监控，是自动化网络环境的基础。\n\n# SDN firewall\
  \ 也称为 IaaS 环境中的安全组。基于 SDN 的软件定义网络防火墙，充当数据包过滤器和策略检查器。防火墙规则可以应用于单个资产或资产组，例如针对带有特定标签的资产。\n\
  \n# SDP（Software Defined Perimeter）结合设备和用户身份验证的动态网络访问方法，用于增强安全并按需启用对资源的访问。\n\n#\
  \ SecaaS（Security as a Service）面向安全的 SaaS 产品，可用于保护云端和传统 IT 资产。它让您能够在所有所需系统上（无论物理位置如何）强制执行策略。\n\
  \n# security group 定义实例处理入站和出站流量的网络规则，类似于 SDN 防火墙的使用方式。\n\n# segmentation 将服务器的内存划分为不同部分，以便将系统和应用程序相互隔离。\n\
  \n# segregation 云服务提供商将资源在不同组之间划分的过程。\n\n# self-service 无需与人交互即可按需访问物理或虚拟资源的过程。\n\
  \n# serverless computing 云服务提供商管理服务器，使用户无需管理任何操作系统或容器，即可在云提供商环境中运行应用程序的全部或部分堆栈。\n\
  \n# service model 云服务的基本类别：软件即服务（SaaS）、平台即服务（PaaS）和基础设施即服务（IaaS）。\n\n# SIEM（security\
  \ information and event management）系统日志和事件数据管理方法，从虚拟和真实网络、应用程序及系统中收集数据，实时分析并提供需要行动的信息或事件的报告和警报。\n\
  \n# SOAP（Simple Object Access Protocol）基于轻量 XML 协议的 Web API，用于交换信息。\n\n# SOC（Service\
  \ Organizational Control）美国会计师协会（AICPA）制定的服务组织控制鉴证标准，用于证明提供方已建立控制措施。多个 SOC 报告包括\
  \ SOC 1（财务报告内部控制）、SOC 2（信任服务标准）和 SOC 3（隐藏的 SOC 2）。SOC 正在更名为系统和组织控制（System and Organizational\
  \ Controls）。\n\n# software defined security 安全模型，其中安全流程以自动化方式运行。\n\n# SOX（Sarbanes-Oxley）美国国会通过的审计法，适用于美国公开上市公司，旨在通过在云视角下维护财务报告的内部控制，保护投资者免受财务报告欺诈。许多\
  \ SOX 合规活动与应用安全控制（applistructure）相关。\n\n# SSAE 16/18 美国会计师协会（AICPA）制定的审计标准，用于执行\
  \ SOC 认证参与项目。\n\n\n\n\n# SSO (单点登录)  \n一种访问控制系统，允许使用单一 ID 和密码访问服务。SSO 的示例包括 `Kerberos`\
  \ 和 `Security Assertion Markup Language (SAML)`，用于与云服务提供商进行联邦。\n\n# STAR (安全信任保障与风险)\
  \  \nCSA（Cloud Security Alliance）的仓库，可用于对潜在的云服务提供商（CSP）进行尽职调查。条目包括自评，即供应商针对 CSA\
  \ 的 `Consensus Assessment Initiative Questionnaire (CAIQ)` 提供的响应。CSP 还可列出基于 `ISO`\
  \ 标准的第三方评估认证，以及基于 `AICPA SOC` 报告的认证。\n\n# storage gateway  \n也称为混合存储网关。本地存储和云存储之间的互连存储设备（虚拟或物理）。网关可执行去重、压缩、加密等操作。\n\
  \n# tag  \n也称为资源标签。由名称/值对组成，用于在云服务中标识并对单个资源或资源集合执行操作。\n\n# TDE (透明数据加密)  \n一种数据库加密系统，在文件级别加密整个数据库，以支持数据库文件的“静态加密”合规性。\n\
  \n# treaties  \n正式签署并批准的国家间协议。云讨论中适用的条约包括 `US/EU Safe Harbor` 及其后续 `EU/US Privacy\
  \ Shield`，后者为在欧盟和瑞士向美国传输个人数据以支持跨大西洋贸易时，提供符合数据保护要求的机制。\n\n# version control repository\
  \  \n用于存放软件项目的存储位置，支持多个软件版本，便于回滚等功能。通常同时提供公共和私有部署模式。公共仓库已被用于发现企业凭证文件（如访问密钥）。\n\n\
  # virtualization  \n一种抽象硬件的系统，供给定的操作系统使用。虚拟化允许在同一物理服务器上以隔离方式运行多个虚拟机（即客户操作系统）。\n\n\
  # VLAN (virtual local area network)  \n在一个或多个局域网中，配置为像连接到同一有线广播域（同一广播域）一样通信的设备集合。由于\
  \ VLAN 基于逻辑而非物理连接，它们极具灵活性。\n\n# VM (virtual machine)  \n一种软件程序或操作系统，既表现出独立计算机的行为，也能够像独立计算机一样运行应用程序和程序。VM（通常称为\
  \ guest）在另一个计算环境（host）中创建。同一台 host 可同时运行多个 VM。在 AWS 等云环境中，这些 VM 被称为实例。\n\n# volatile\
  \ memory  \n仅在设备通电时保持数据的存储介质。从安全角度来看，volatile memory 可保存密码和未加密数据。\n\n# VPC (virtual\
  \ private cloud)  \n在云中共享资源池，可让您配置逻辑上隔离的区域，在该区域中您可以按需在自定义的虚拟网络中启动资源。您对虚拟网络环境拥有完全控制权，包括自行选择\
  \ IP 地址范围、创建子网、配置路由表和网关。\n\n# WAF (web application firewall)  \n过滤、监控并阻止 HTTP 流量到达和离开\
  \ Web 应用的防火墙。WAF 与普通防火墙的区别在于，WAF 能基于 HTTP 流量内容进行过滤，而普通防火墙仅根据 IP 和端口限制流量。WAF 可为传统型或云基于型。\n\
  \n# workload  \n在计算中，在特定时刻电脑被分配的处理量。工作负载包括运行在计算机上的某些应用程序代码以及通常有若干用户连接并与计算机的应用程序交互。\n\
  \n# XACML (eXtensible Access Control Markup Language)  \n定义基于属性的细粒度访问控制策略语言、架构以及处理模型的标准；该模型描述了如何依据策略规则评估访问请求。\n\
