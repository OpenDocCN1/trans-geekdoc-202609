  ## 目录\n* * *\n\n## 前言\n\n当今的技术环境似乎是一场目眩神迷的游乐场之旅。它移动速度快，方向变化莫测，如果不关注安全，你可能会受伤。云计算无疑是我们最重要且最普遍的技术之一。云在许多方面是全球经济的支柱；它被消费者、企业和政府每天使用，并且在很大程度上已经取代了传统的本地\
  \ IT。按需消费计算的概念对各类规模的组织具有强大吸引力，并且只会继续增长。\n\n保障云的安全是更广泛的网络安全行业的重要任务之一。2009 年，云安全联盟（Cloud\
  \ Security Alliance）成立，旨在解决这一问题并制定基本的安全最佳实践和教育项目，以此实现目标。CSA 已发展成为全球最重要的安全组织之一，拥有五大洲\
  \ 100 多个分会和办事处。CSA 开发了云安全知识证书（CCSK），为 IT 和安全专业人员提供衡量其掌握云计算安全所需技能的基准，确保他们能够采取适当的措施保护其交互的云计算环境。CCSK\
  \ 备受好评，屡获殊荣，并且常常是许多职位的必要条件。\n\n当前，我们正面临网络安全领域的关键技能缺口。许多研究表明，全球网络安全专业人才缺口已达到数百万。在我们行业的从业者中，大量人员需要将传统的本地\
  \ IT 安全技能升级到云计算的动态环境中。CCSK 是开启更好、更有前景职业道路的关键之一。\n\n云安全知识具有独特性，因为云计算不断变化，拥有独特的共享责任模型，而必须采用的安全最佳实践细节与管理员对拥有完整控制权的计算机有显著差异。例如，对传统系统进行漏洞扫描必须仔细协调，以确保结果准确且不影响其他生产系统。相反，云平台拥有大量新的自动化功能，能够在大规模上更轻松地解决诸如补丁管理等现有问题。DevSecOps\
  \ 是一种描述利用这些新工具进行协调安全的颠覆性新方法。对于您而言，理解云端的安全差异对于运营、风险管理以及最终符合众多安全和隐私要求至关重要。\n\n为此，我很高兴推荐这本由\
