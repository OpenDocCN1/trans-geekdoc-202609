  \n最后，我要感谢 BPB Publications 的 Manish Jain，他给了我为他们撰写第一本书的机会。\n\n# 前言\n\n`Golang` 由\
  \ Robert Griesemer、Rob Pike 和 Ken Thompson 于 2007 年在 Google 开发，并于 2009 年 11 月作为开源项目发布。`Golang`\
  \ 经历了许多更改和增强。目前我们有在 2020 年 8 月发布的 `Go1.15` 版本。每个主要的 `Go` 版本将一直支持直到有两个新的主版本发布。`Go`\
  \ 被应用于 LinkedIn、Twitter、IBM、Firefox、Docker、YouTube、Alibaba 等许多组织的后端开发。\n\n这本书面向初学者以及渴望学习\
  \ Go 语言的专业人士。本书重点介绍了你进行 Go 编程需要学习的基本概念。在书中，通过图表示来澄清概念，并在必要时提供了截图来描述过程。为了成为一名合格的\
  \ Go 程序员，读者必须通过运行书中的程序进行实战学习。这些程序不仅运行正确，而且易于编写和理解。程序中包含了详细的注释，说明特定语句/块的作用。详细给出了程序的输出结果，以便人们在运行代码后进行验证。每个章节都包含一个目标，说明该章节对读者有什么帮助。在每章的最后，结论部分简要回顾或强调章节内容，并建立与下一章的联系。\n\
  \n这本书将帮助那些没有编程经验的人。书中提供了具体的指令来编写和运行第一个 Go 程序。每个概念都提供了良好的示例。在获取了所需的 `Golang` 知识后，我们将使用\
  \ Go 创建一个小型应用程序。所有必要的代码都在示例程序中进行了描述，这些程序可以在所有现代浏览器中实现。如果读者学习了书中提到的概念，他将走向成为 Go 程序员的道路，了解\
  \ Go 语言的特性、工作原理、使用方法以及通过整合 `Golang` 的前后端技术构建应用程序。\n\n这本书的主要目标是提供学习 Go 语言所需的信息和技能。本书包含了大量的示例和插图，将展示如何安装和运行\
  \ Go 程序，以及如何将 Golang 与前端集成以构建应用程序。在本书的 20 个章节中，你将学习以下内容：\n\n\n\n\n\n# 第一章 介绍了 Go\
  \ 语言的评估、其成功之处、特性和应用。它解释了 Go 语言的需求，以及使其与其他编程语言不同的类比。\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
