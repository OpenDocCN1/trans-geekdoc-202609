  \ Go 之后，将演示一个检查安装是否正确的第一个 Golang 程序。\n\n## 结构\n\n在本章中，我们将讨论以下主题：\n\n* Go 语言的系统要求\n\
  * 适合文本编辑器\n* 如何在你的系统上安装/卸载 Go\n* 如何在 Go 中编写第一个测试程序\n\n## 目标\n\n学习完本章后，你将能够：\n\n\
  * 为 Go 语言获取合适的文本编辑器\n* 在你的系统上安装 Golang\n* 在任何文本编辑器上编写测试程序\n* 运行一个简单的 Go 程序\n* 在出现任何问题时卸载\
  \ Go\n\n### 系统要求\n\nGo 针对多个平台，如 Linux、Mac、FreeBSD、32 位和 64 位 x86 处理器架构的 Windows。对于任何其他操作系统，可以使用\
  \ Go 语言的编译器 `gccgo`。\n\n`Go1.15` 是 Go 的最新版本，于 2020 年发布。它最初需要 OpenBSD 6.2，随后是 Mac\
  \ OS 10.10 Yosemite，然后是 Windows 7。对这些操作系统较旧版本的支持已被移除。\n\n运行一个简单的 Go 程序需要文本编辑器和 Go\
  \ 编译器。这些如下：\n\n*   **文本编辑器**\n    Go 支持多种编辑器插件和 IDE，以使 Go 开发更高效、更无缝。大多数著名的文本编辑器都可以直接提供支持，或者通过某些插件支持。文本编辑器会根据不同的操作系统而异。\n\
  \n    是一些文本编辑器：\n\n    1.  **Atom**\n        `Atom` 是一个适用于 Windows、Linux 和 macOS\
  \ 的免费开源文本编辑器。\n        它是来自 GitHub 的跨平台、面向 JavaScript 的桌面应用程序。\n\n    2.  **BBedit**\n\
  \        `BBedit` 是一个为 macOS 开发的商业文本编辑器。\n        `Go-bbpackage` 带有剪贴板、ctags 标准库完成、更好的语法高亮和工具。\n\
  \n    3.  **Eclipse IDE**\n        `Eclipse IDE` 是最广泛使用的开源跨平台 IDE。\n        `GoClipse`\
  \ 是 Eclipse 扩展，为 Go 语言添加了 IDE 功能。\n\n    4.  **Emacs**\n        `Emacs` 是一个由多个可扩展和自定义文本编辑器加载的免费编辑器。\n\
  \        代码自动补全、代码分析和重构、错误检查、播放场和代码片段是 Emacs 的附加功能。\n\n    5.  **Gedit**\n     \
  \   `Gedit` 是 GNOME 桌面的默认文本编辑器。\n        `Go-gedit-plugin` 是用于 gedit 编辑器的 Go 编程插件。\n\
  \n    6.  **Goland**\n        `Goland` 是 JetBrains 开发的商业跨平台 IDE。\n        该 IDE\
  \ 可以分析代码、符号之间的关系、快速导航、错误分析和格式化。\n\n    7.  **Notepad++**\n        `Notepad++` 是适用于\
  \ Microsoft Windows 的分布式源码编辑器。\n        `Gopp` 插件提供代码补全、函数提示、Go 导入和快捷键。\n\n    8.\
