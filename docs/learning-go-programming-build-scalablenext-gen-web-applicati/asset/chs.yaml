  \ elements: []\ndestination slice after copying elements: []\nlength of destination\
  \ slice after copying elements: 0\nNumnber of copied elements after copying elements:\
  \ 0\n```\n\n从这个示例可以明显看出，`copy` 函数并没有向目标切片添加任何新值。\n\n### 排序切片\n\n在 Goang 中，`sort`\
