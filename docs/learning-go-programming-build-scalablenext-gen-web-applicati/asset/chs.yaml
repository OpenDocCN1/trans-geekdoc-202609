  ### 图 3.2: 未定义的函数错误\n\n如上一章所述，我们可以使用以下命令在命令提示符上运行此程序：\n\n```bash\ngo run file_name.go\n\
  ```\n\n1.  在下一行，我们将根据需要声明变量。由于 Go 是一种静态类型语言，变量不允许在运行时更改类型。我们可以将变量定义为 `name:= “Jitendra”`。它将通过值来识别变量的类型。\n\
  \n2.  `\"Printf\"` 是 `fmt` 包中定义的函数。所有导出的名称都应该以大字母开头。\n\n    Go 中的函数是家族的根。程序的执行始于函数调用；它可以被赋值给变量，也可以作为参数传递。Go\
  \ 编译器从 `main` 包开始执行。它获取适当的文件，进行编译，将其转换为临时可执行形式，并运行程序。它完全遵循 `main` 包中的 `main` 函数。\n\
  \n## 关键字\n\n关键字是特定编程语言的预定义保留词，对编译器具有特殊含义。关键字不能用作变量或标识符。Golang 支持 25 个关键字，如下：\n\n\
  *   `import`: 此关键字用于在 Go 程序中导入包。\n*   `type:`: 用于根据需求创建新类型。\n*   `const:`: 指定字符、数值、布尔或字符串值。\n\
  *   `var:`: 此关键字用于声明一个包含特定名称和值的变量。\n*   `func:`: 此关键字用于声明具有特定名称、参数、结果类型和主体的函数。\n\
  *   `package:`: 定义 Go 程序中的包，这些包包含变量、常量和函数。\n*   `map:`: 此关键字用于在 Go 程序中声明 `map` 类型的数据。\n\
  *   `chan:`: `chan` 关键字用于在 Go 程序中定义通道（channel）。\n*   `struct:`: 使用此关键字声明用户定义的类型\
  \ `\"struct\"`。\n*   `interface:`: 此关键字用于在 Golang 中定义自定义数据类型 `\"interface\"`。\n\
  *   `if:` 如果关键字指定“if 语句”，它需要评估给定的条件。\n*   `else:`: 如果块中给定的条件为假，则 `else` 关键字执行语句。\n\
  *   `for:`: 此关键字执行 `for` 语句，重复执行代码块。\n*   `range:`: 此关键字与 `for` 循环配合使用，用于遍历特定的数据。\n\
  *   `break:`: 在循环内部定义 `break` 语句，以终止当前循环执行并恢复循环后续的程序控制。\n*   `continue:`: 在循环内部定义\
  \ `continue` 语句，将程序控制跳转到下一次迭代。\n*   `goto:`: 执行 `goto` 语句并将程序控制转移到标记语句。\n*   `return`:\
  \ 通过向调用者返回结果来执行 `return` 语句。\n*   `switch:`: 在 Go 程序中定义 `switch` 语句。\n*   `case`:\
  \ 在 `switch` 语句中定义各种情况（cases）。\n*   `select:`: 此关键字定义 `select` 语句。\n\n## 标识符\n\n\
  标识符是类、函数、语句标签、常量、包名或变量名称，用于唯一标识一个对象。它是 Unicode 字母、数字和下划线的融合。标识符的首字母必须是字母或下划线。在 Go\
  \ 语言中，标识符的大小写敏感。我们不能使用保留词作为标识符。Go 提供了一种特殊的标识符类型称为“空白标识符”，用 `_` 表示。**空白标识符**作为一个具有任何值的占位符，但我们无法在程序中读取它。首字母为大字母的标识符称为导出标识符。这些标识符应该在包块中声明，因为它们可以在其他包访问。相反，首字母不是大写的标识符称为非导出标识符。\n\
  \n以下是一些有效和无效的标识符：\n\n*   **有效**：\n    *   `_ = 12`\n    *   `var Version = 4.0`\n\
  \    *   `var name = \"Ansh\"`\n    *   `var _12 = \"hello world\"`\n*   **无效**：\n\
  \    *   `var 12 = \"hello world\"`\n    *   `var count$ = 23`\n    *   `var default\
  \ = 5.0`\n\n## 结论\n\n在本章中，我们看到了 Go 程序的的基本结构和组件。编写和运行简单的 Go 程序是 Go 编程的第一步。我们讨论了 Go\
  \ 语言支持的关键字。通过标识符，我们了解了包、类、函数或变量的命名规范。让我们在下一章继续学习 Golang 变量和数据类型。\n\n\n\n\n## 问题\n\
