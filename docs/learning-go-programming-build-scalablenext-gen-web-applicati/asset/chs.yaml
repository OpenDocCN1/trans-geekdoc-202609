  \n通过观察软件开发中的问题，人们决定随着网络和多核计算的兴起，语言必须支持某种并发与并行性、垃圾回收，并实现内存管理的自动化。所有这些都汇成了一系列讨论、一系列观点、合理的策略，并形成了一项伟大的开发。通过\
  \ Golang，使用一种语言即可实现高效的编译、执行和易于编程。\n\n`Go language` 由 Google 赞助，由 Robert Griesemer、Rob\
  \ Pike 和 Ken Thompson 创建，他们描绘了 Golang 的目标。它最终于 2009 年 11 月 10 日发布。它是一种开源语言。Go 语言的创建者和社区构建了许多语言原生支持的工具，这些工具在大多数情况下不需要任何第三方库。例如，Go\
  \ 语言原生支持 HTTP、JSON、HTML 模板等，它可以在无需考虑在 GitHub 上寻找库的情况下构建出非常复杂的 API 服务。现在，有数百万程序员正在使用\
  \ Go，并且未来会有更多人加入。\n\n![](img/image-1.1.jpg)\n\n**图 1.1:** 2018 年 4 月的 Logo \n\n\
  ## Go 的特性\n\nGo 是一种静态且快速编译的语言，专为多核架构设计，以实现高效的内存利用。以下是 Golang 的特性：\n\n* **自动垃圾回收**\n\
  \  有了这一特性，程序员不需要担心内存的全局管理。目前，Go 使用“标记-清除”收集器。它跟踪所有创建的对象。每当需要时，它会首先暂停运行进程，处理垃圾对象，然后释放进程重新运行。它还支持并发。\n\
  \n* **并发**\n  同时运行多个任务被称为并发。Golang 提供了一种不同的方法来同时执行多个函数。这通过 `Goroutines` 和 `channels`\
  \ 实现。在 Go 中，`Goroutines` 可以被看作与其他函数并行执行的函数。另一方面，`channel` 提供了多个 `Goroutines` 之间进行通信的功能。\n\
  \n* **静态**\n  Golang 被构建为编译语言，Google 的开发者在此工作非常出色。通过静态链接，它根据操作系统类型和架构将所有依赖库和模块合并为一个单一二进制文件，这意味着在编译后端应用程序时，只需将编译后的二进制文件上传到服务器即可运行，无需在上面安装任何依赖项。\n\
  \n* **易于测试**\n  Go 语言提供了支持自动化测试的丰富库。有一个名为 `testing` 的包，它可以帮助运行 go `test` 命令，从而使任何测试函数的执行成为可能。还有一些基准测试（bench）。有许多由\
  \ go `test` 命令执行的测试函数形式。\n\n* **标准库**\n  良好编程的重要部分是`代码复用性`。Go 语言的标准库包含了许多为 Go 应用提供强大功能的包。它提供了如\
  \ `OS`、`runtime`、`HTTP`、`XML` 和 `JSON` 等包，这些包与操作系统连接并提供运行时支持。\n\n* **跨平台**\n  Go\
  \ 是一种跨平台语言，可以在 Linux、Mac、Free BSD、Windows、iOS、Android 等平台上运行。\n\n* **文档**\n  Golang\
  \ 有一个命令 `Godoc`，专注于包文档并以 HTML 或纯文本形式提供。通过这些文档的帮助，程序员可以从说明引导到任何函数的实现。它定义了包的函数、常量、变量，甚至是\
  \ Go 支持的类型。\n\n## 面向对象的本质\n\n面向语言的标准定义并不适用于 Go，但它以其他方式提供了相同的功能。它有一个定义的数据结构 `struct`，集成了字段和方法。Golang\
  \ 没有继承，但它有不同的方法来建立 struct 之间的关系。对象组合建立了“是”（IS-A）关系，而接口则被用于形成“包含”（Has-A）关系。\n\n此外，Go\
  \ 语言中的方法更加透明。它们没有与 struct 绑定。Go 不支持重载功能。通过这种方式，Go 语言让事情变得更简单方便。\n\n#与其他语言的类\n\n\
  在 C++、Java 以及其他面向对象的语言中，继承、重载和泛型是关键特性。在这里，Go 团队专注于并发、垃圾回收和快速编译，以便与并行系统良好协作。让我们来看看这门编程语言的一些细节：\n\
  \n* **类型安全**\n  这指的是防止“类型` 错误的特性。就像 C、C++、Java 和 Python 一样，Go 也是一种类型安全的语言。Go 编译器在编译时满足特定水平的有效性检查。它确保如果存在\
  \ `+` 运算符，那么两个操作数都是数值类型。\n\n* **面向对象**\n  Go 可以被看作是一种轻量级的面向对象语言。然而，它支持为任何类型的数据定义类型和方法，但没有类和继承。这里并不是所有东西都关联对象。Go\
  \ 的语法类似于 C 语言。它是静态类型，并且可以扩展到像 C++ 和 Java 更大的系统。\n\n* **继承**\n  Go 不是一种面向对象的语言。它不支持继承，但具有组合和接口特性。通过组合，可以将多个\
  \ struct 嵌入在一起。接口中可以添加多个方法，因此它有增长的空间。这种新概念比基于类的继承更强大。\n\n* **重载**\n  与 C++ 和 Java\
  \ 不同，Go 没有方法重载的概念。仅通过名称识别方法消除了复杂性，并使编码变得简单。\n\n* **异常处理**\n  与 C++ 和 Java 不同，Go\
  \ 中没有 `try-catch-finally` 模式。它有一些内置函数来信号和恢复异常情况。Go 函数将错误作为最后一个值返回。这里有一个简单的机制：将最后一个值与\
  \ `nil` 进行比较。如果是，则没有错误；否则就会出错。\n\n* **并发**\n  在 Java 中，有线程选项用于并发编程。Java 有许多工具来管理这些线程，但它们仍然被认为相当昂贵且难以理解。为了简单化，Go\
  \ 提供了一种带有 Go routines 和 channels 特性的简单并发技术。Go routines 是轻量级线程，channel 帮助 Go routines\
  \ 之间进行通信。\n\n* **垃圾回收**\n  通常，内存管理有两种方式。一种是自动引用计数，另一种是垃圾回收。像 C# 和 Java 一样，Go 也有垃圾回收器。Objective-C\
  \ 和 Swift 使用引用计数技术管理资源。Go 使用当前的“标记-清除”GC。它运行在独立的 CPU 上，与主程序并行，因此有助于多核架构。\n\n## Go\
  \ 语言的痛点\n\n尽管有很多特性，Golang 也有一些缺点。Go 语言的局限性如下：\n\n* **泛型编程**\n  Go 没有编译时泛型，导致根据需要产生重复代码或进行类型转换。虽然有一等函数，但我们无法对不同类型的集合复用相同的函数。这在某种程度上也影响了效率和生产力。\n\
  \n* **繁琐的错误处理**\n\n\n\n\nGo 语言中的错误处理并不完美。编译器没有执行相应的操作来处理错误。这取决于程序员如何使用函数在每次错误发生时返回错误。\n\
  \n## Golang 的应用\n\nGo 自 2009 年首次发布以来一直变得越来越受欢迎。包括 IBM、Twitter、Facebook、YouTube、Apple、BBC、Google\
  \ 在内的许多公司都在使用或正对 Go 语言进行开发工作。没人能预测未来，但 Golang 有多个理由不断成长。\n\n以下是使用 Go 语言开发的应用：\n\n\
  *   **Docker**\n    它是一组用于创建、部署和运行分布式应用程序的工具集。\n    它是一个开源平台，允许根据需要扩展其功能。\n\n* \
  \  **OpenShift**\n    它是 Red Hat 提供的作为服务的开源云计算平台。\n    它提供基于容器的软件部署和管理服务。\n\n* \
  \  **Kubernetes**\n    它是一个可扩展的开源容器集群管理系统，促进了无缝的自动化部署流程。\n\n*   **Dropbox**\n  \
  \  Dropbox 从 Python 迁移到 Go 语言，以便更高效的方式扩展其系统，并支持更好的并发和快速的执行。\n\n*   **InfluxDB**\n\
  \    它是一个用于获取时间序列数据的开源时间序列数据库。\n    它支持物联网传感器数据、应用矩阵和实时分析。\n\n## 结论\n\n在本章中，你学习了软件开发的痛点以及\
  \ Go 语言的演进是如何解决这些问题的。这种开源编程语言让软件开发变得简单、高效且可靠。我们看到了一些不同组织使用 Go 语言开发的应用程序。我们讨论了在编写\
  \ Golang 时需要记住的 Go 语言的一些缺点。这些就是我们需要了解的所有理论知识。让我们在下一章开始安装 Go 语言吧。\n\n## 问题\n\n1.\
