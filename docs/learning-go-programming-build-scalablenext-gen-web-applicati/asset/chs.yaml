  \ Go 环境。Go 编译器的两个主要实现领域：\n\n    1.  **Gc**\n\n\n\n\n`Gc` 是一个带有递归下降解析器的默认编译器，它使用了自定义的加载器。它支持如\
  \ x86 (32/64bit) 和 ARM 等流行的处理器。\n\n## 2. Gccgo\n\n`Gccgo` 是 GCC 的一部分，GCC 是 GNU 编译器集合，它支持前端。它支持\
  \ GCC 支持的所有处理器。`Gccgo` 比 `Gc` 慢，但支持更多的处理器，并具有更强大的优化功能，因此由 `gccgo` 构建的 CPU 密集型程序运行速度很快。\n\
