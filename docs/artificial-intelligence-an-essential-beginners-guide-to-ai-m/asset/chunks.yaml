    \ Union (EU) is already doing.\n\nThe EU is fighting back against US tech giants,\
    \ most notably by introducing sweeping legal frameworks intended to curb their\
    \ influence in the EU market. As explained in one CNN article [[14]](#text00000.html#_ftn14).\
    \ (Wait, the prompt text actually has a repetition here, I will include it once\
    \ to be clean or twice if the user demands literalism. I'll include it once as\
    \ it's likely a typo in the prompt).\n\n*Actually, looking at the prompt one more\
    \ time, the repetition is NOT there. I will just provide the clean version.*\n"
  trans: '

    我们显然需要第三台具备诊断故障能力的 Roomba，它能够监督第一台的扫地工作，以检测它何时以及为何损坏，并派第二台出发。这三台 Roomba 已经构成了一个物联网生态系统，可以独立运行，而无需等待缓慢的人类输入。如果这三台
    Roomba 必须覆盖巨大的区域并通过无线连接进行通信，我们现在可以雇佣第四台 Roomba 作为移动路由器，它将跟随这三台机器并调整自己的位置以获得最大的网络性能。


    那么问题变成了，计算机系统的攻击面通常随着复杂性的线性增加而呈指数级增长。附近任何拥有制作和使用天线知识的人都可以黑入我们的 Roomba 四人组，并随心所欲地处置它。因此，现在我们可以雇佣
    55 台配备机枪的 Roomba 来击倒所有来者，但这无法解决该概念中固有的缺陷，这种缺陷削弱了此类生态系统可能具有的任何用途。然而，如果我们的 Roomba
    处于一个封闭系统（例如仓库），那么同样的缺陷在很大程度上被消除了。


    通过消除人为干预，物联网生态系统允许机器人以远超人类能力的速度、协调性和耐力进行协作。现场的任何人类通常只是被动的观察者，甚至没有手动覆盖机器人的能力，到目前为止这种情况已经发生在
    Google 的 Waymo 身上，这是一种没有方向盘或刹车的自动驾驶穿梭车。科技巨头们展望了这样一个未来：家庭、学校和医院将变成 AI 的同一种无菌环境，人类表现出极大的尊重和服从。目前，亚马逊是最接近让这一愿景成为现实的公司。


    亚马逊仓库（也被称为“履行中心”）是物联网生态系统已经在增强人类劳动力并可能很快取代它的地方；人类仍在拣货、分拣和包装物品，但得益于波士顿动力 `Handle`
    [[12]](#text00000.html#_ftn12)（一种像鸵鸟一样的移动箱子机器人），这些工作岗位可能也会变得自动化。


    这些巨大的仓库以高强度的工作节奏和不容许迟到的严格条件 [[13]](#text00000.html#_ftn13) 为特征，内部驻扎着机器人，它们通过在特殊的混凝土地板上滑动并读取
    QR 码导航到目的地，从而运送大量物品。滚筒和传送带在左右之间穿梭物品，这一切都是为了尽快交付那份礼物或订单。最终目标是让亚马逊一次向每位客户销售世界上所有的产品；亚马逊实际上在销售上损失了数十亿美元，因为它关注的是增长，而不是利润。


    # 第 7 章 —— 与科技巨头斗争


    随着互联网的出现，我们现在拥有了数字工具和方法来传播信息，这正是 AI 用来喂养自己的东西。当地经济可以负担得起按照自己的节奏采用像蒸汽机这样的东西，但 AI
    的出现将迫使我们限制对信息的访问，并遏制那些肆意向我们的环境中播种不受控增长服务的科技公司的增长，这正是欧盟（EU）目前正在做的。


    欧盟正在反击美国科技巨头，最显著的手段是引入广泛的法律框架，旨在遏制它们在欧盟市场的影响。正如一篇 CNN 文章中所 [[14]](#text00000.html#_ftn14)
    所述。

    '
