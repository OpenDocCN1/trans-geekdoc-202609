    随着 AI 卡车的出现，事情将将会发生变化，但重要的是生产力，那些愿意投入专业技能的人将始终有收入来源，尽管这种方式可能看起来与过去那种稳健的职业不同。没有任何工作会被“丢失”，因为工作起初并不存在，也没有工作会被“抢夺”，因为工作数量并不是有限的；工作是由市场需求创造的，随着市场的增长，包括
    AI 卡车在内的每个人的就业机会数量也会随之增加。


    随着设备的老化，AI 可能会停止按预期运行，届时驾驶辅助专家可以轮流手动操作卡车，不同的是他们现在法律上受工作时时限制的保护，因为从技术上讲，是 AI 在驾驶。针对现有问题的市场解决方案总是回到同样的老方案，因为它们是有效的；在车辆情况下，必须有人在车上，只是如果人类能学会如何处理
    AI 卡车，现在他们将获得更高的报酬。顺便说一句，想象得到的每个企业对新技术都嗤之以鼻，所以除非媒体宣传的新解决方案能为企业家提供更多的法律斡旋空间或提供更多资金，否则直接忽略它。


    初创公司 AI 部署的统计数据揭示了全貌——AI 的定义如此模糊，以至于 2830 家欧洲初创公司中约有 40% 没有使用任何 AI，却吹嘘说在使用，因为这能让他们从投资者那里获得额外
    15%的资金 [[8]](#text00000.html#_ftn8)。只需提到你的初创公司将使用“由大数据支持的 AI 增强机器学习来让世界变得更好”；这听起来很棒但毫无意义，给你提供了一个在不增加工作或义务的情况下获得额外资金和媒体关注的机会。


    当然，文章完全没有提到这些背景，只是简单地贴了一张图表就完事了。图表不会骗我们，对吧？你并不是为了去理解正在发生的细微差别——只需给网站一个点击，吸收底层的恐惧信息，然后跳到下一个标题即可。“致命的大黄根用途”——标题本该表达的是：“如果
    AI 真的被制造并获得任何关注，AI 驱动的卡车将为每个人创造更多就业机会”，但乐观和对事实的适度描述并不能吸引像点击党那样由恐惧和愤怒驱动的点击。


    ### AI 将成为浪漫伴侣


    这种神话对 30 多岁到 40 岁初的女性特别有效，她们还没有家庭，现在正在疑惑：“好男人都去哪儿了？”男性也受到缺乏亲密的困扰，但由于他们天生孤独且习惯于独立行事，他们可以通过偶然的身体关系生存下来，而不需要建立稳定的联系。一篇名为《爱上
    AI 虚拟助手：一场比你想象中更近的诡异恋情》的 Wired 文章 [[9]](#text00000.html#_ftn9) 只使用了一个点击党关键词——“诡异”。


    文章的主体是电影《她》 [[10]](#text00000.html#_ftn10)，这是一部关于一个感到孤独的作家买了一个 AI 助手并爱上她的电影。能够与某人分享他的想法和感受，即使是一个
    AI，实际上也让他工作中变得更快乐、更高效。


    # 第 3 章 – 操纵边缘系统


    人类大脑通过数百万年的演化结构以生存为中心，这就是为什么我们能感受到如此强烈的恐惧和愤怒，这两种情绪都能帮助我们应对危险。那么，人类大脑是如何构造的？单个神经元密挤在坚硬的骨鞘中，可以形成网络以交换来自外界的脉冲。这些神经通路在童年如何形成以及之后如何通信被称为`性格`，这是一组我们引以为傲的独特偏好，而我们甚至没有意识到其中很大一部分是超出了我们的控制范围。


    我们大脑的基础是边缘系统，它处理核心身体功能，如呼吸和体温。这是大脑中原始的部分，容纳了奇特的冲动和恐惧症，但也有冲动，如饥饿、欲望和焦虑。边缘系统包裹在新皮层中，新皮层是大脑包含高级大脑功能的部分，如逻辑和幽默感。边缘系统帮助我们生存，而新皮层帮助我们繁荣，二者本应合作，但通常存在截然不同的权力动态。


    边缘系统如此快速且强大，以至于在整个身体方面它基本上随心所欲，然后我们用新皮层为它的行为辩护，要么用逻辑来使其合理化，要么用幽默来应对刚刚发生的事情。我们大脑这种自动驾驶功能在百万年前的非洲平原是有意义的，当时在听到草丛沙沙声的瞬间，毫秒级的反应意味着生与死。在当今社会中，边缘系统在很大程度上毫无理由地过度活跃，不断受到媒体、公司和科学家协同操纵的触发，他们只想获得我们的注意力。

