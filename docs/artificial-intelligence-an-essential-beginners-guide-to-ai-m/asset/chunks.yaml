    了解一个人的过去并获取数字记录后，AI 可以模仿权威人士或该个人会顺从的亲属的声音。如果这不行，只需将声音调整得尽可能柔和，使边缘系统进入安自足的状态。如果将这种系统添加到现有的医疗保健基础设施中，护士和医生就能有更多时间来处理没不完的文件工作和层层行政事务。考虑到慢性健康问题需要整个护理网络来处理一个患者的事实，我们可能迫切需要
    AI 了。


    AI 可以与患者聊天让他们保持忙碌，同时评估他们的词汇量、心理疾病或一般情绪，为医生生成一份方便的报告，让医生在不浪费任何时间的情况下掌握全貌。AI 可以自动将匿名数据馈到数据库中并实时更新，显示不同类型中风、外伤、癌症等疾病的发病率，这可以帮助政治家在问题发生时制定健康策略，而不是在二十年之后。


    # 第 20 章 – AI 与伦理


    这种医疗 AI 可以分析图像和 X 光片，它可以深入到每一个像素，以观察疾病的最早期迹象和可能的扩散情况。对于那些有恐惧症和焦虑的人，可以提供虚拟现实眼镜，由
    AI 引导他们度过创伤过程，并就如何处理这种情况的最微细节给出正确的指示。当与 `Skype` 等视频通话软件配合时，AI 可以分析卧床患者的脸部，比任何人类都能更好地读懂他们的内心。患者应该获得知情同意，他们应该时刻意识到自己是在与机器而非人类交谈，但看到大型社交网络已经承认它们在字面上监视用户，而没有人对此侧目，因此患者很可能会接受这种程序。


    医生在处理患者方面有很大的余地，并可能不得不采取极端措施来处理极端病例。这并不是恶意或傲慢，而是为了提高效率并避免对患者产生情感依赖，这两点都可以通过采取快速解决方案（通常是某种形式的处方药）来实现。然而，医生还有一套伦理准则，可以最好概括为“首先，不要伤害”。如果要求
    AI 采取某种极端措施来救患者的生命，AI 是否也需要与医生相同的伦理准则，以防止它对不幸的患者变成“疯狂科学家”？


    根据 AI 书籍作者斯图尔特·罗塞尔 [\[37\]](#text00000.html#_ftn37) 的说法，我们正面临这样一个未来：智能机器必须被赋予强制性的伦理准则，因为它们可以产生假新闻来改变我们的投票和消费行为。它们已经可以遍历社交媒体获取关键词以确定性格特征，然后进行自动聊天、间谍活动和勒索。斯图尔特还制作了“杀戮机器人”（Slaughterbots）[\[38\]](#text00000.html#_ftn38)，这是一段戏剧化的视频，展示了微型无人机如何用于暗杀，以便他向联合国提交禁止自主武器的请愿做准备。无人机能够避开粗糙的拍打，从字面上可以俯冲目标，在额头中心投放三克爆炸药，使其瞬间死亡。


    虽然“杀戮机器人”视频很有戏剧性，但它并没有解释如何抵御自主无人机，这并不比击落俯扑的喜鹊有什么差。

