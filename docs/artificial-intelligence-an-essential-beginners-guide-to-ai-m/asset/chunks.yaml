- raw: 'When humans interact with a digital device, they leave behind a trace of information
    that is like a blip on a radar; with enough blips, a human can be reliably tracked
    down to the tiniest detail, and all it takes is a single fact-checking app. At
    the app developer’s headquarters, an array of machines quietly vacuums in all
    possible data from users who have the app installed, including their text messages,
    phone numbers, Wi-Fi network names to triangulate location, and so on. Without
    even realizing it, users’ smartphones become spying devices, and that is when
    the developer doesn’t want to collect data. If a tech company wants to collect
    data, it can create special systems that are designed to label and sort data in
    a way that shields the company owner from liability but still allows full-blown
    surveillance.


    Like tiny grains of sand on their own are imperceptible but piled up create a
    sand dune that can no longer be swept under the rug, bits of data can be piled
    up to create a monumental collection of user details and habits that reveal their
    most private thoughts and secrets. In essence, this is Big Data, an array of user
    data that is so big and keeps growing so fast that no human can keep it in check.
    Big Data is used to feed and perfect machine learning, which then helps build
    up Big Data even more. What can humans do against Big Data? Quite a bit, actually.


    If you own a company that might collect user data, be advised that Big Data makes
    a juicy target for hackers, who can always find cheap, easy, and low-tech ways
    to breach security. The best defense against hackers is to: a) gather only minimum
    user data, b) delete all user data as soon as it is no longer needed and c) compartmentalize
    all data so a hacker can’t get it all at once. This approach is called security
    by design and involves creating the simplest possible services and products with
    the fewest number of moving parts. Couple this with defense in depth, where physical
    access control is buttressed with software protections, meaning you keep data
    encrypted and locked in a secure room where only trusted people get the key. Make
    regular backups on dedicated hard drives and keep them disconnected from the internet.


    If you are a programmer working for a company gathering Big Data, keep in mind
    that in the vast majority of cases, users of any service or product go with default
    settings. Whatever you set as the default is what your users will use without
    checking or even knowing how to change settings. Also, beware of “feature creep”,
    where products get pivoted to take on more roles than they can realistically fulfill,
    making them vulnerable to hacking.


    If you are a user who wants to keep their data out of Big Data, start lying. Whenever
    you’re asked for personal information, such as name, e-mail, and date of birth,
    input fake responses—unless you’re actually going to use those services—and delete
    old accounts that you are not using when they’re being used to send you spam e-mails.
    Create burner e-mail accounts and choose long passwords for everything; password
    length is the best indicator of its strength, so don’t bother with capital letters,
    numbers and special unless the product explicitly demands those. If you really
    need to use social media, use a separate device for each platform, and reset the
    devices to clear all personal data if you are going to give or sell them.


    # Chapter 13 – AI and Employment


    In the current business environment in the US, IQ tests are forbidden as they
    lead to what is known as “disparate impact”, which essentially means a business
    can get sued if it filters out incompetent people. Even when there is an actual
    need to have an employee with a set of skills, the employer can still get dragged
    through courts and thrown to the media court of opinion, so most of them just
    sigh and hire people who barely contribute to the business alongside actually
    productive employees. This practice of hiring token employees just to follow an
    idealistic notion of a perfect pie chart, where every racial and national identity
    gets a slice, is simply unsustainable and likely harmful, but employers do it
    anyway simply to avoid getting flak from the media.


    In one such case that ended up in front of the Supreme Court, Ricci v DeStefano  [\[24\]](#text00000.html#_ftn24)
    , a group of New Haven, Connecticut firefighters were jockeying for lieutenant
    and captain positions by passing a lengthy, costly exam. City authorities eventually
    threw out the results because not enough minority candidates passed the exam and
    the firefighters who should have gotten the promotion sued. The Supreme Court
    ruled that “race-based action like the City’s in this case is impermissible under
    Title VII unless the employer can demonstrate a strong basis in evidence that,
    had it not taken the action, it would have been liable under the disparate-impact
    statute.” In short, the exam was the best New Haven had, and that is what should
    have been used.


    Imagine the state of affairs where firefighters respond to a call but have no
    clue how to proceed because they have all been hired based on their skin, eye
    or hair color rather than the actual ability to save lives and property. Rather
    than hiring the strongest, most athletic and resourceful people, firefighting
    becomes a process of quenching the fires of social discontent where politicians
    jostle for favorable media coverage by pandering to the most basic of tribal urges.
    Those who dare point out the problem get lambasted in the media, no matter how
    they framed it or how right they are. However, there is no negotiating with an
    open flame that is truly indiscriminate in whom it roasts.


    Employers can’t even refuse to hire or outright fire a pregnant woman, even if
    her job involves handling toxic materials that might affect the fetus. Some 75%
    of all women with employment in the US will become pregnant during their career,
    forcing the employer to: a) write off any costs on hiring and training the woman,
    b) pay for any costs incurred, as pregnancy is considered a chronic health problem
    and c) find a replacement for the pregnant woman at their own expense.


    This stems from a Federal Pregnancy Discrimination Act of 1978  [\[25\]](#text00000.html#_ftn25)
    , brought about by another Supreme Court case where a pregnant woman sued General
    Electric because its disability insurance program didn’t cover pregnancy or childbirth.
    Courts all the way up to the Supreme Court affirmed that General Electric did
    no wrong because its disability program provided the same benefits to men and
    women, which is why Congress promptly adopted the Act to plug that neat loophole.


    Compare this outcome to how Chinese businessmen would handle it—they would gladly
    send pregnant women through the grinder by the truckload if that meant a minimal
    increase in productivity of their factories, and the Chinese government would
    approve. Do you now see why so many companies moved their manufacturing to China?
    Thanks to minimal worker rights and maximum profit, China is the perfect place
    to experiment with any new kind of business product. If AI really is coming and
    is going to displace human workers, it would make sense to leave manufacturing
    capability in the first world rather than ship it out, but that is not what’s
    happening.'
