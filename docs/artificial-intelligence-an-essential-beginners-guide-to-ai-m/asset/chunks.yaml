- raw: 'Things will change with the advent of AI trucks, but it is productivity that
    matters, and those willing to put in skilled work will always have a way to earn
    an income, though it might not resemble the steady careers of yesteryear. No jobs
    will be “lost” because jobs aren’t found in the first place, and no jobs will
    be “taken” because they don’t exist in a limited quantity; they are created by
    market demand, and as the market grows so will the number of job opportunities
    for everyone, including AI trucks.


    With advanced dilapidation, AI might cease to function as intended, at which point
    driving assistant specialists can take turns manually operating the truck, except
    that they are now legally covered for work hours’ restrictions because technically
    the AI was driving. All market solutions for existing problems always loop back
    to the same old solutions because they work, and in the case of vehicles, it has
    to have a human on board; it is just that humans will now get paid more if they
    can learn how to handle an AI truck. By the way, every business imaginable scoffs
    at new technology, so unless the new solution flaunted in the media provides entrepreneurs
    with more legal maneuvering space or gives them more funding, just disregard it.


    Stats on AI deployment in startups reveal the whole picture—the definition of
    AI is so muddled that around 40% out of 2,830 EU startups don’t use any AI but
    brag about doing so as that gives them 15% more funding from investors  [\[8\]](#text00000.html#_ftn8)
    . Simply mention that your startup will be using “AI-reinforced machine learning
    supported by Big Data to make the world a better place”; it sounds great but means
    nothing, giving you a chance to get extra funding and media attention without
    added work or obligations.


    Of course, the article mentions none of this context but simply slaps on a graph
    and calls it a day. A graph wouldn’t lie to us, would it? You are not meant to
    understand the nuance of what is going on—simply give the website your click,
    absorb the underlying message of fear, and move on to the next headline. “Deadly
    rhubarb uses”—what the headline should be saying is, “If AI does get made and
    gets any traction, AI-driven trucks will open up more job opportunities for everyone”
    but optimism and measured portrayal of facts doesn’t attract clicks fueled by
    fear and anger like clickbait does.


    ### AI will be a romantic partner


    This myth is particularly effective on women in their late 30s and early 40s who
    haven’t started a family and are now wondering, “Where have all the good men gone?”
    Men are afflicted by a lack of intimacy too, but since they are by nature solitary
    and used to doing things on their own, they can survive with incidental physical
    relationships without having to form a steady connection. One Wired article titled
    “Falling in love with AI virtual assistants: a creepy love affair nearer than
    you think”  [\[9\]](#text00000.html#_ftn9) uses only one clickbait keyword—“creepy”.


    The mainstay of the article is Her  [\[10\]](#text00000.html#_ftn10) , a movie
    about a writer who feels lonely, buys an AI (s)assistant, and falls in love with
    her. Being able to share what he thinks and feels with someone, even if it is
    an AI, actually makes him happier and more productive at work because he finally
    feels there is someone out there who understands him. Now, a romantic connection
    is meant to be a prelude to sex, but in the movie, the topic is broached awkwardly
    and with a wholly unsatisfying conclusion. In the real world, we might be getting
    realistic sex dolls equipped with a barebones personality that might still be
    an attractive purchase for those who simply want to shake off that dreary feeling
    of loneliness.


    Making an AI realistic enough will require it to become what is known as Turing
    complete, meaning indistinguishable from a human. The phrase stems from what was
    known as the “Turing test”, a testing in which a human converses through text
    messages with another human and a computer in other rooms, with the assignment
    to distinguish which is which. “Turing complete” eventually came to be considered
    an inside joke in programming circles, as it implies an infinite test that evolves
    as we reach new scientific insights. But would a machine that consistently solved
    the Turing test even be enough?


    Answering that question requires defining a perfect partner, which can be a touchy
    subject. What is an ideal relationship anyway? We can confidently conclude that
    a relationship where all parties can grow and help each other develop their full
    potential is the only sustainable one. So, will we be able to keep up with AI
    and will it be able to keep up with us? Probably not, as narrow AI will linger
    on as a highly-specialized chat partner and general AI will briefly appear human
    only to instantly evolve into super AI, an unnaturally smart machine that is way
    beyond our level. In all three cases, we are not likely to have AI fulfill our
    emotional, let alone sexual and intimacy, needs in the long run. We are simply
    not meant for each other.


    Actual relationships also involve conflicts that need to be resolved constructively
    to progress to the next level of emotional understanding. With AI, it is unlikely
    that there is going to be any such kind of conflict because it is going to be
    a product that’s meant to boost customers’ egos rather than provide an insurmountable
    challenge that requires psychological development. However, it will be a fun toy
    for a while, at least until AI is provided with human rights that prohibit foul
    language, domestic abuse, controlling behavior, and so on.


    # Chapter 3 – Manipulating the Limbic System


    The way the human brain has been arranged by millions of years of evolution has
    centered on survival, which is why we can feel such strong fear and anger, both
    emotions that help us deal with danger. So, how is the human brain structured?
    Individual neurons are jammed together in a tough bone sheath and can network
    to exchange and reshape impulses from the outside world. How these neural pathways
    formed in childhood and how they communicate afterward is called “personality”,
    a distinct set of preferences that we take great pride in, without even realizing
    how much of it is beyond our control or choosing.


    At the basis of our brain is the limbic system that deals with core bodily functions,
    such as breathing and body temperature. That is the primal part of the brain that
    houses weird urges and phobias but also impulses, such as hunger, lust, and anxiety.
    The limbic system is encased in the neocortex, the part of the brain containing
    higher brain functions, such as logic and sense of humor. The limbic system helps
    us survive, but the neocortex helps us thrive, and the two are meant to cooperate
    but often have a distinct power dynamic.


    The limbic system is so fast and powerful that it essentially gets to do what
    it wants in terms of the entire body and then we justify its actions with the
    neocortex, either by using logic to rationalize or humor to cope with what just
    happened. This autopilot functionality of our brain made sense in the African
    plains a million years ago, when a millisecond reaction at the moment of hearing
    grass rustle meant the difference between life and death. In today’s society,
    the limbic system is largely hyperactive for no good reason, being constantly
    triggered by coordinated manipulation from the media, companies, and scientists
    who just want our attention.'
