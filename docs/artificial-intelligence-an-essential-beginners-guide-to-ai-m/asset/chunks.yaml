- raw: 'The solution to stress is always to consider all situations as challenges
    rather than sources of danger. This simple change in perspective makes us use
    our neocortex rather than the limbic system, developing higher brain functions
    rather than triggering the most basic survival instincts. In essence, seeing a
    yelling customer as a challenge rather than a threat may let you reply with a
    witty remark that interrupts his or her angry rant and perhaps even makes them
    burst out laughing, turning a stressful situation into a relaxed and fun one,
    where you can both work together to fix whatever problem there was without any
    stress.


    The study examined how people who don’t know about stress deal with it by eating
    caloric foods, such as cookies, that trigger a feel-good brain response just like
    a drug would; addiction to cookies can be purged from the brain using Naloxone,
    a medication that helps drug addicts kick their habit. It is not just that humans
    relieve stress this way because even rats exposed to extreme danger were eventually
    hooked on cookies or sugary water, which is the equivalent of soda or fruit juice.
    Who ultimately benefits from the general public being constantly stressed out?
    Companies that produce and market these stress-coping mechanisms, whether it is
    food, alcohol, medication, or some other vice that slowly ruins the body.


    In essence, our very existence involves small amounts of stress from time to time
    but being included in a thriving financial market mandates that we are constantly
    stressed out, or we won’t be giving our best to make and spend as much money.
    Big companies from media to food and entertainment have to whip us into a stress-fueled
    frenzy constantly, or we will just be happy with what little we have on our own
    and lead a peaceful life. Therefore, if tech giants decided they need the ultimate
    economic booster, they might announce a threat to end all threats—AI, a mystical
    and intangible perfect worker, advisor, lover, and warrior.


    We don’t have to take any heed of tech giants’ AI doom and gloom announcements—since
    now we have an alternative explanation as to why they would be pushing it so intensely.
    Humans have always adapted to life and will continue to do so, except now you
    know that it is all just a challenge that can be solved using higher functions
    that lie dormant in the brain, being constantly overridden by the limbic system
    when we are stressed out fearing for our lives, which makes us utterly predictable
    and ultimately complacent. There is no external factor that can mold our behavior
    against our free will, as long as we are aware of the possibilities and consciously
    build our own path in life.


    Looking at AI from a stress-free perspective of a human that doesn’t feel fear,
    anxiety, anger, or hunger, what is the chance it will replace said human? No chance
    at all. Humans can exchange information and learn at a much faster rate than any
    machine as long as they are not using that pesky primal part of the brain, the
    limbic system, that always simplifies things.


    # Chapter 10 – AI and Growth Hacking


    To use AI, you should first clearly define the goal and how it is going to be
    achieved using machine learning. You will be using what is known as “growth hacking”,
    an entrepreneurial paradigm that relies on building a sturdy framework with repeatable
    steps you can always go back to if you get stuck. Just like a vine finds the nearest
    point to latch onto but always keeps climbing up to reach more sunlight, you too
    should improvise daily implementing AI while staying true to your ultimate goal.


    Growth hacking relies on having steady sources of data and reliable ways of analyzing
    it. More than anything else, growth hacking means you will be having a scientific
    approach to whatever your project entails, without any kind of prejudice as to
    what the customers want or what the final product should look like. It is only
    after the data has been gathered and dissected to reach an actionable solution
    that you’ll be using a tiny spark of creativity to find a new vantage point and
    climb up higher, just like the vine, to repeat the process all over again. Only
    after you have managed to do this kind of growth hacking independently of any
    AI is when you can actually afford to employ it. AI should always be used to automate
    existing processes that we know can produce working results but lack time or the
    workforce to iterate them enough times.


    AI works in mysterious ways and might be offering solutions that fall within the
    bounds of statistical error. Therefore, be prepared to tweak your use cases and
    experiment with them until you have been fully satisfied with the answer. At first,
    try to simplify your questions so they can be answered with “yes” or “no” and
    have as many people participate in answering each question. Don’t rush anything
    and just establish a sturdy foundation. The growth you experience shouldn’t be
    sudden or explosive but controlled and manageable, or the unexpected success will
    overwhelm you.


    # Chapter 11 – AI and Correcting Fake News


    Making news is an ordeal, which is why so many websites use clickbait, but at
    least they are not outright lying with the intent to influence elections. On the
    other hand, making fake news is fairly easy, and, with the help of gullible users
    on social media, spreads like wildfire to influence countries in the long run.
    China already has a solution—fact-checking bot Meiyu  [\[23\]](#text00000.html#_ftn23)
    that idles with users on social media and automatically corrects whatever they
    are saying in chats.


    Described as being “Taiwanese” rather than Chinese, the bot is free—it is supposedly
    there to cite an open source database when a dubious article is mentioned and
    is not designed to collect personal data on users. However, it has to sift through
    user messages, getting access to all the data they mentioned in order to understand
    the conversation. All it has to do is create a report on who is the one spreading
    fake news for a friendly visit from the police.


    If the bot is free, what is the motivation for the owner to even create it in
    the first place? The most likely answer is that the Chinese government funded
    Meiyu; in particular, counter-intelligence services under the guise of venture
    investment, which is something that already happens in the US. The second most
    likely answer is that it hoovers up private data to create psychological profiles
    and sells them to advertising companies. Finally, it might also genuinely be made
    by a small-fry developer who has the best intentions, in which case actors from
    the previous two cases can still swoop in and buy the app, getting the entire
    user base and all the gathered data, even if it is only error reports.


    Users didn’t like Meiyu, especially when elders were in the chat—since disagreeing
    with an elder is considered in bad taste. Meiyu ultimately seemed more like a
    contrarian bot than a fact-checking one, simply barging into the conversation
    random assertions regardless of whether there was any truth to the material. For
    example, Meiyu disagreed that flu symptoms can be lessened by drinking more water,
    stating, “The internet has a lot of information on drinking water. Doctors say
    not all of it is credible.”


