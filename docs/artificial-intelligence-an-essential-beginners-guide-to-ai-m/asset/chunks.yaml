- raw: 'The AI won’t hire you based off of some goofy keyword shenanigans, but at
    least it won’t throw you in jail, right? As it turns out, neural networks are
    already being used to jail people, especially those with a record of delinquency
    and/or a prior arrest record.


    # Chapter 14 – AI and The Legal System


    Across the United States, different counties are experimenting with neural network
    tools that give criminals risk scores, a probability on a 1-10 scale if they will
    offend again. One exhaustive ProPublica article  [\[28\]](#text00000.html#_ftn28)
    describes a few cases of how this kind of software works and brings inside data
    about a prison system running on algorithms.


    When Brisha Borden, an eighteen-year-old black girl, stole a bike for a joy ride
    on her way to school, she was arrested and charged with petty theft and burglary.
    Computer algorithm analyzing her record (four juvenile misdemeanors) gave her
    an 8/10, meaning she was very likely to repeat the crime. Meanwhile, Vernon Prater,
    a 41-year-old white man with one attempted and two performed armed robberies,
    got arrested for shoplifting from Home Depot and got rated a 3/10 by the same
    system. Two years later, Vernon attempted grand theft, but Brisha didn’t do anything
    else, meaning the algorithm got it wrong. How come?


    The human mind doesn’t correctly understand probability and causes itself much
    grief in trying to figure out chances. When technology is introduced to the mix,
    it becomes an additional source of confusion because technology is never perfect.
    Just like you will see in a later chapter with a soap dispenser, technology is
    meant to work reliably with a certain acceptable range of inputs, but fringe cases
    may lead to it randomly failing. Furthermore, probabilities compound, so if we
    use inaccurate technology to double-check our guesstimate, the prediction will
    be much more inaccurate than if we just guesstimated. It sounds strange, but the
    math checks out.


    Imagine setting up a police checkpoint to catch drunk drivers. Drunk driving is
    a wicked crime—one that could be completely prevented by self-driving cars that
    would kill the driver if need be—that endangers lives for no good reason, so we
    have a noble goal and feel good about inconveniencing drivers. Also imagine a
    state-of-the-art breathalyzer that has 99% accuracy. Sounds perfect, doesn’t it?
    However, also assume that only one in a thousand drivers drive around drunk. What
    are the chances of catching the guy? Think carefully about the answer.


    If you stop and test 1,000 drivers, the breathalyzer, which errs in 1% of cases,
    will show ten of them as being drunk while only one is actually drunk. Therefore,
    the breathalyzer has a 90% false-positive rate, and just falsely accused nine
    people of drunk driving. The worst part is that drivers will typically be so overwhelmed
    with guilt that they won’t dare challenge the breathalyzer. It is state-of-the-art
    after all, so how could it possibly be making any mistakes, let alone so many?
    When coupled with something like SCS, a false drunk driving accusation can lead
    to a cascade of mishaps that completely ruins someone’s life, and that is using
    a breathalyzer that’s 99% accurate!


    It turns out that, if an event isn’t all that common, the technology used to detect
    it has to have a margin of error lower than the chance of incidence or there is
    no advantage to using the technology in the first place. In fact, the less common
    an event, the more wildly inaccurate the results of detection and prediction.
    You can play around with the incidence of drunk driving in this thought experiment,
    and you will see it is only when 90% of drivers drive drunk that the breathalyzer’s
    margin of error equals the wrongful detection rate.


    It turns out that humans are much more precise than technology; just imagine a
    breathalyzer that has 50% or less accuracy. The police and courts know how often
    false positives happen but press on regardless because the general public needs
    to see that something is being done about crime to appease their limbic systems,
    even though completely innocent people are being punished. This thought exercise
    also shows that all those mandatory drunk driving checkpoints are completely meaningless
    because we are inconveniencing 999 drivers to catch that one guy who is driving
    tipsy.


    Therefore, this very simple thought experiment showed us that math is always the
    ultimate arbiter of efficiency that cuts through emotional nonsense and deprivation
    of human rights. You should always challenge the results of technology being used
    to prove something on the basis that: a) the operator wasn’t skilled enough, b)
    technology can randomly fail and c) rare occurrences can’t be reliably detected.
    Brisha’s and Vernon’s crime scores had nothing to do with the fact that she was
    a black girl and he was a white man, as the article subtly framed it, but most
    likely that petty theft happens much more often than armed robbery, which means
    the algorithm assigned it a much greater likelihood of happening again.


    These algorithmic risk assessments are already used in courtrooms from Arizona
    to Wisconsin, with results given to judges during sentencing. The idea is to arrive
    at a number that shows how likely rehabilitation is going to work for any given
    defendant. In federal prisons, these kinds of assessments would become mandatory.
    As expected, political figures are latching on to “algorithmic unfairness” as
    an extension of systemic racism and bias, but it appears the explanation is much
    simpler than that—a tool used for risk assessment simply sucks.


    Created by a for-profit company Northpointe, the crime prediction algorithm used
    to assess Brisha and Vernor was said to be proprietary and thus not available
    for examination. What we do know about it is that 137 questions were answered
    by either the defendant or pulled directly from their file, such as education
    level and current employment status. Created by a statistics professor, the company
    was later on sold for an undisclosed sum to another company. If this kind of tool
    becomes mandatory in courtrooms, someone will be making a ton of cash.


    Previously, judges had plenty of leeway in how they wanted to treat the defendant,
    but political pressure to treat minorities better tied their hands—that is until
    they started using the risk assessment algorithms. Often attached as confidential
    documents during pre-sentencing to determine eligibility for probation, these
    scores were found to accurately predict recidivism about 61% of the time, with
    some variation depending on if the defendant was white or black. However, judges
    starting using them for sentencing, with some judgments even explicitly quoting
    the risk assessment score as the main reason for the harsh sentence. These have
    been challenged and successfully reduced. In Florida, Broward County uses the
    risk assessment score to determine if the defendant can be let out on bail, which
    the algorithm can also recommend to avoid jail overcrowding.


    The risk assessment algorithm doesn’t take into account that people can change
    for the better or that people have free will. It is actually quite easy to challenge
    the algorithm: if it’s accurate, then free will doesn’t exist, and the punishment
    makes no sense because the defendant’s actions were predetermined; if it’s not
    accurate, then it shouldn’t be used at all—case dismissed, and the defendant is
    free to walk and might look into a career in law. The main way of fighting faulty
    technology is to challenge all conclusions drawn based on it, ask for insight
    into raw data based off of due process rights, and have a human expert or even
    the general public look into it.


    # Chapter 15 – AI and Self-driving Vehicles'
