  trans: '

    你对 AI 的整个世界观可能被媒体（如电影、书籍和新闻文章）所塑造。毕竟，媒体的作用是向我们介绍世界，但它们也有隐藏的意图——赚钱。电影和书籍可以保持作者想要传递的信息，因为它们有多种联动变现手段，如玩具、动画片、漫画等，但新闻文章呢？报纸拍卖版面并费力寻求订阅，但推销新闻的网站几乎完全依赖广告，这意味着向访问者强推广告，每次点击只能赚取几分钱的微小收入。


    由于不知道如何创作高质量内容并从中获利，依靠点击量生存的新闻网站不得不创造所谓的“点击党”（clickbait）内容，即那些标题眼球但内容匮乏的即时消费型文章。这类内容的作者被迫使使用任何非纯属谎言的描述来为网站引入尽可能多的流量，这往往会让他们迅速精疲力竭。有一整套机器机制在稳定地生产点击党内容，一旦幕被揭开，你再也无法享受互联网上
    90% 的“新闻”。


    网页用户喜欢分类整齐的信息，因此倒计时列表是一种极佳的点击党方法，它提供了一种对结尾大大揭晓的期待感，但这通常不符合预期。例如，一个点击党标题可能会吹嘘“大黄的
    12 种最佳用法”或“电视上最糟糕的 7 个节目”。这两篇文章中实际上可能有有用且相关的信息，但其标题的写法表明，托管网站并不关心为读者提供价值，而只是想要他们的点击。此外，称某物为“顶级”或“最差”是高度主观的，与其说是说明主题，不如说是在说明作者，而作者很快就会精疲力竭并消失。


    任何能激发极端情绪（如恐惧或愤怒）的内容都是点击党标题中受欢的补充。我们对这些情绪没有太大控制权，因为它们的进化目的是通过支配我们的注意力来让我们存活；在野外遇到老虎要么让你想逃跑，要么想用锋利的棍子戳它，但无论哪种情况，你都会高度关注那只老虎。劫持这种电路来获取访问者的注意力，最好的方法是使用点击党描述词，例如“捕食者”、“战争”、“致命”、“粉碎”等。这会触发访问者大脑中古老的生存硬件，让他们粘在网站上，回来寻求下一次恐惧和愤怒的冲击。激起厌恶同样有效——因为我们会对让我们生病的事感到厌恶，例如指示腐烂食物的臭味和有毒动物。再次，高度关注的大脑电路开始运作。


    追热点对点击党非常有利，因此标题可以使用某个时刻流行的名人名字来增加流量。埃隆·马斯克在 2018 年几乎出现在几乎每一个点击党标题中，尤其是因为他是一个几乎没有节制的古怪企业家。使用唐纳德·特朗普的名字也同样有效，只要它稍微有一点真实性，且不会让网站因公然撒谎而面临诉讼即可。电影、玩具、城市传说——任何被他人谈论的话题都值得塞进标题里，因为这增加了文章在搜索引擎结果中获得高分的概率，而这是每个点击党网站都倍推崇的流量来源。


    标题中的不确定性是另一种喜爱的点击党方法。好奇心是一个极佳的方法，提供了一种对结尾大揭晓的期待感，但这通常不符合预期。例如，一个点击党标题可能会吹嘘“大黄的
    12 种最佳用法”或“电视上最糟糕的 7 个节目”。这两篇文章中实际上可能有有用且相关的信息，但其标题的写法表明，托管网站并不关心为读者提供价值，而只是想要他们的点击。此外，称某物为“顶级”或“最差”是高度主观的，与其说是说明主题，不如说是在说明作者，而作者很快就会精疲力竭并消失。


