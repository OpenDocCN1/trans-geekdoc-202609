- raw: 'We would obviously need a third Roomba with the ability to diagnose malfunctions,
    capable of overseeing the first one’s sweeping to detect when and why it broke
    and to send out the second one. The three Roombas would already be an IoT ecosystem
    that could work on its own without having to wait for sluggish humans’ input.
    If the three Roombas had to cover a huge area and communicated through a wireless
    connection, now we could employ a fourth Roomba working as a mobile router that
    would follow the trio around and position itself for maximum network performance.


    The problem then becomes that computer systems typically experience an exponential
    increase in attack surface with a linear increase in complexity. Anyone in the
    vicinity with the know-how to make and use an antenna could hack into our Roomba
    quartet and do with it as he pleases. So, now we could employ 55 Roombas with
    machine guns that gunned down everyone coming, but that wouldn’t solve the inherent
    weakness in the concept that undercuts any utility such an ecosystem might have.
    However, if our Roombas are in a closed system, such as a warehouse, that same
    weakness is largely eliminated.


    By eliminating human interference, an IoT ecosystem allows robots to cooperate
    at speeds, coordination, and endurance well beyond what humans are capable of.
    Any humans present on the location would typically be just passive observers,
    without even having the ability to manually override the robots, which has so
    far happened with Google’s Waymo, a self-driving shuttle car that has no steering
    wheel or brakes. Tech giants envision the future in which homes, schools, and
    hospitals become the same kind of sterile environment for the AI, with humans
    showing ultimate respect and obedience. For now, Amazon is the one to be making
    that vision closest to reality.


    Amazon warehouses, also called “fulfillment centers”, are places where an IoT
    ecosystem is already enhancing the human workforce and might soon be replacing
    it; humans still pick items, sort and pack them, but those work positions are
    likely to become automated too, thanks to robots such as Boston Dynamics’ Handle  [\[12\]](#text00000.html#_ftn12)
    , an ostrich-like robot that can move boxes on its own.


    Boasting a hard work tempo and strict conditions that tolerate no tardiness  [\[13\]](#text00000.html#_ftn13)
    , these gigantic warehouses host robots that cart massive quantities of items
    by gliding along the special concrete floor and reading QR codes to navigate to
    their destination. Rollers and conveyor belts shuttle items left and right and
    it is all due to wanting to deliver that gift or order as soon as possible. The
    end goal is to have Amazon selling all products in the world to every customer
    at once; Amazon is actually losing billions of dollars on sales because it’s focused
    on growth, not making a profit.


    # Chapter 7 – Fighting Against Tech Giants


    With the advent of the internet, we now have at our disposal digital tools and
    methods to propagate information, which is what an AI uses to feed itself. A local
    economy could afford to adopt something like the steam engine at its own pace,
    but the emergence of AI will mandate that we restrict access to information and
    curb the growth of tech companies that recklessly seed our environment with uncontrollably
    growing services, which is what the European Union (EU) is already doing.


    The EU is fighting back against US tech giants, most notably by introducing sweeping
    legal frameworks intended to curb their influence in the EU market. As explained
    in one CNN article  [\[14\]](#text00000.html#_ftn14) , EU is dead set on breaking
    Google apart through fines and regulatory action. In March 2019, EU voted in a
    copyright directive  [\[15\]](#text00000.html#_ftn15) that contains the now-infamous
    Article 11 and Article 13, which respectively mandate a news aggregator service
    to ask for permission or pay a license fee before linking to a news article and
    that content providers have to respect copyright at all times, not just when big
    companies ask them to. In short, Article 11 and 13 all but explicitly name Google
    News and YouTube, both of which attach ads to someone’s content and make money
    by the truckload while paying a pittance to select content creators.


    How is Google supposed to scan hundreds of thousands of hours of video being uploaded
    round the clock to YouTube for copyright infringement? While Google does possess
    ContentID, a system for checking uploaded content against an established database
    of work belonging to major publishers, there is very little that can be done to
    apply ContentID before the video is uploaded, which is what Google would have
    to start doing. The main problem is that YouTube has grown way beyond what any
    company can handle, and it was perfectly on purpose by Google.


    YouTube was meant to be a massive siphon for information, the most comprehensive
    dataset in video form for training an AI in object recognition and trend analysis.
    YouTube videos also make money by having ads shown next to them, allowing Google
    to just keep expanding the infrastructure and pocket the difference without having
    to create any content at all. By the time you are reading this, it is likely that
    YouTube is not the same anymore, becoming fragmented or restricted for most users,
    which the EU regulators expected and planned for. Google won’t abate its data
    collection efforts and is likely to simply shift to some other data source, such
    as IoT gadgets. We all have smartphones, which can easily have Google apps baked
    into them, for which the EU has actually punished Google as it promoted a monopoly.
    But when it comes to YouTube, it is all about the tricky business of copyright.


    Legally, copyright owners have absolute rights to their content and can even pass
    them on to their progeny or sell them to any company. A copyright owner can rent
    or sell any part of his or her content while placing any restrictions imaginable
    on it for free or at a price. However, content gets remixed by the general public
    all the time, which makes copyright void since it only concerns exact copies,
    but that is determined through a lengthy and costly court process the copyright
    owner is all but guaranteed to win. The problem is that changing just 0.01% of
    copyrighted content doesn’t provide the same legal protection as changing 99.99%
    of it; copyright covers the exact expression of ideas but not ideas themselves.


    When Google got hold of YouTube and users started uploading enormous quantities
    of content, huge copyright owners, such as Warner Brothers, started rubbing their
    hands; Google was serving ads alongside the content, becoming liable for copyright
    infringement since it was making money off of copyrighted content. Solution? Create
    an automated system that reviews all uploaded videos and compares them to the
    copyrighted content database created by big companies that are eager to sue Google
    into oblivion if infringements continue.


    This ContentID flagging system has been shown as a spectacular failure, correctly
    recognizing copyrighted content only for as long as exact copies of big-brand
    content were uploaded. Once small content producers started recording and copyrighting
    noise, such as wind chimes, entire swaths of YouTube content got flagged for copyright
    infringement. In 2015, ContentID issued a copyright strike against a video that
    contained nothing else but a purring cat  [\[16\]](#text00000.html#_ftn16) , claiming
    the sound belonged to EMI Music Publishing. Technically, cat owner could sue Google
    and EMI for false copyright claims, but that is again another costly court process
    that nobody is willing to undergo, so things get settled by Google defaulting
    towards whatever benefits copyright holders.'
