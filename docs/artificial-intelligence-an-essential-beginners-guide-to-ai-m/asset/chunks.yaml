- raw: 'Human behavior is what is known as emergent property, a spontaneous appearance
    of a heretofore unknown function. We have very little idea of how and why human
    behavior appears, but we can speculate. The brain is made up of neurons, which
    are highly conductive bioelectrical components wrapped in layers of fat that serve
    as insulation. On their own, neurons can’t do much of anything, but when billions
    of them are crammed together inside a skull, fed, kept cozy, and allowed to network,
    they can produce the human consciousness, culture, and self-awareness. There is
    a good reason why we say “brain surgery” for anything excessively complex; we
    use the brain daily but know very little about how it works, why it fails, and
    how to fix it.


    How does this relate to AI? Well, machine learning is about giving digital devices
    the adaptability of a living brain or, to be more specific, of a single neuron
    that can process individual bits of data and provide some utility to the owner.
    When these digital neurons are strung together in massive arrays, they exponentially
    increase each other’s processing power in a way living neurons do. Since we now
    possess an environment peppered with tiny IoT devices, each of which can process
    individual bits of data to provide some utility to the owner, we might get a monumental
    digital brain the size of a continent and a spontaneously emerging AI. What other
    emergent properties will this kind of digital brain develop? We don’t know, which
    is for scientists the best possible introduction to “let’s find out”.


    What we do know is that other living beings can organize themselves in intelligent
    ways to make up for their lack of individual strength. Volvox is a species of
    freshwater algae that form colonies of up to 50,000 units. Each of them is a separate
    cell and may survive on its own, but together they move, feed, and reproduce in
    unison. With hardened cells on the outskirts, primitive eyes that can sense light,
    and tiny tentacles serving as oars that move the entire colony towards the light,
    i.e., the power source, Volvox is an example of how a group of simple organisms
    can work together to create something bigger and more prosperous.


    Why do algae band together? They don’t have any capability for reasoning or abstract
    planning but somehow appear to sense power in one another and understand their
    chance of survival is much higher if they cooperate. We know that lions and hyenas
    hunt in packs to increase their chances of taking down big game, while birds migrate
    in massive flocks to easily cut through wind resistance and allow the weakest
    members to coast along.


    # Chapter 5 – Basic Concepts


    The concept of machines that can evolve by learning from the environment has been
    discussed in the scientific community for nearly a century. As with all advanced
    paradigms, machine learning was first mocked, then considered, and then wholeheartedly
    embraced. The problem with machine learning is that computers don’t have a filtering
    mechanism to sort out information like living brains do, and they can’t create
    organizations of higher order like humans. We can quickly assess if something
    is unworthy of our attention to save our energy for actual tasks under the guidance
    of a smarter, more efficient person, but computers can’t handle the actual world
    in either way. Smart machines are thus fed filtered data arranged in sets, with
    their learning environment being kept completely sterile, so to speak.


    Exposing smart machines to the outside world usually ends in disaster as their
    frail brains become clogged with useless information. For example, there is a
    smart machine watching what you type into Google Search, and by being hooked into
    your personal profile assembled courtesy of Gmail, YouTube, and other Google services,
    can recommend personalized search results. You are not meant to know about this
    smart machine because you might want to feed it false information, corrupting
    the results it provides. If enough users did this, Google Search would essentially
    be rendered worthless.


    The structure of a smart computer is like the Congress in that it is made out
    of small, independent units that can vote on any given thing. When additional
    layers are built on top of this arrangement, we can think of it as creating the
    Senate, which can also add input on matters. Think about the prolonged political
    discussions that eventually have to boil down to a Yay or Nay vote; that is essentially
    how a smart machine works. Note that a smart machine takes in binary data but
    outputs probability, meaning it can be more or less certain about the result and
    thus we can rate any neural network’s quality by estimating how correctly it guessed
    what we wanted it to do, but it is never certain .


    With enough layers, we can start talking about a neural network, where different
    layers have different weights attached to them depending on their performance.
    In short, the neural network can differentiate between units and their votes depending
    on how they performed in the past. Think of it as driving to work and barely listening
    to a voice on the radio but then giving your full attention to your boss at work;
    the neural network learns to ration its computational resources. At this point,
    machine learning becomes deep learning, where the neural network reorganizes itself
    according to its own principles that we don’t fully understand at speeds we can’t
    keep track of.


    Feeding the neural network consistent datasets and showing it what we want the
    result to be is called “reinforcement learning” and produces a highly-specialized
    smart machine. For example, showing images of dogs or cats will reinforce the
    concepts of “dog” or “cat”, but showing both will make the neural network much
    better at recognizing animals in general. Depending on what the intended use of
    the neural network is, scientists train it differently using data gathered from
    publicly available sources.


    When a neural network is attached to a specific piece of hardware, we can start
    talking about robotics, which is essentially giving a neural network a body. The
    robot can have different levels of mobility or just be stationary, like Alexa’s
    speaker that is meant to be put on the table and listen to occupants. Some advances
    have been made in letting the neural network decide where and how it wants to
    move in the world, but again, it is all workable while it’s in a safe, controlled
    environment; any interference by humans or animals usually wrecks the robot. When
    there are so many robots around us that they form their own neural network, but
    with hardware instead of software units, is when we can start talking about the
    internet of things (IoT).


    # Chapter 6 – IoT Ecosystem


    Our businesses scale, but our ways of doing business don’t, which is why we have
    this push for automation and adoption of artificially intelligent systems. Countries
    and companies that adopt IoT will gain the upper hand, forcing everyone else to
    do the same. This opens companies and governments to hacking attacks thanks to
    the concept of the attack surface, wherein the more systems are networked together,
    the lower their overall security as a remote attacker can breach the weakest link
    to breach the entire network.


    The main advantage of IoT, as touted by producers of various robots it consists
    of, is being able to quickly make tiny decisions based off of data gathered through
    sensors or fed to it from some external source. For example, Roomba sweeps the
    floor while relying on its sensors to relieve you of having to stand by with a
    dustpan. Sounds good but the main disadvantage of Roomba is that it relies on
    regular maintenance, so now you are standing by with a screwdriver instead of
    a dustpan. What if we made a second Roomba that fixed the first one and let them
    work in tandem?'
