    # Chapter 13 – AI and Employment


    In the current business environment, IQ tests are forbidden as they lead to what
    is known as “disparate impact”, which essentially means a business can get sued
    if it filters out people. Even when there is an actual need to have an employee
    with a set of skills, the employer can still get dragged through courts and thrown
    to the media court of opinion, so most of them just sigh and hire people who barely
    contribute to the business alongside productive employees. This practice of hiring
    token employees just to follow an idealistic notion of perfect pie chart where
    every racial and national identity gets a slice is unsustainable and likely harmful,
    but employers do it anyway to avoid getting flak from the media.


    In one such case that ended up before the Supreme Court, `Ricci v DeStefano`,
    a group of New Haven, Connecticut firefighters were jockeying for lieutenant and
    captain positions by passing a lengthy, costly exam. City authorities eventually
    threw out the results because not enough minority candidates passed the exam and
    the firefighters who should have gotten the promotion sued. The Supreme Court
    ruled that “race-based action like the City’s in this case is impermissible under
    `Title VII` unless the employer can demonstrate a strong basis in evidence that,
    had it not taken the action, it would have been liable under the `disparate-impact
    statute.” In short, the exam was the best New Haven had, and that is what should
    have been used.


    Imagine the state of affairs where firefighters respond to a call but have no
    clue how to proceed because they have all been hired based on their skin, eye
    or hair color rather than the actual ability to save lives and property. Rather
    than hiring the strongest, most athletic and resourceful people, firefighting
    becomes a process of quenching the fires of social discontent where politicians
    jostle for favorable media coverage by pandering to the most basic of tribal urges.
    Those who dare point out the problem get lambasted in the media, no matter how
    they framed it or how right they are. However, there is no negotiating with an
    open flame that is truly indiscriminate in whom it roasts.


    Employers can’t even refuse to hire or outright fire a pregnant woman, even if
    her job involves handling toxic materials that might affect the fetus. Some 75%
    of all women with employment in the US become pregnant during their career, forcing
    the employer to:

    a) write off any costs on hiring and training the woman

    b) pay for any costs incurred, as pregnancy is considered a chronic health problem

    c) find a replacement for the pregnant woman at their own expense.


    This stems from a `Federal Pregnancy Discrimination Act of 1978`, brought about
    by another Supreme Court case where a pregnant woman sued `General Electric` because
    its disability insurance program didn’t cover pregnancy or childbirth. Courts
    all the way up to the Supreme Court affirmed that `General Electric` did no wrong
    because its disability provided provided the same benefits to men and women, which
    is why Congress promptly adopted the Act to plug that neat loophole.


    Compare this outcome to how Chinese businessmen would handle it—they would gladly
    send pregnant women through the grinder by the truckload if it meant a minimal
    increase in productivity of their factories, and the Chinese government would
    approve. Do you now see why so many companies moved their manufacturing to China?
    Thanks to minimal worker rights and maximum profit, China is the perfect place
    to experiment with any new kind of business product. If AI really is coming and
    is going to displace human workers, it would make sense to leave manufacturing
    capability in the first world rather than ship it out, but that is not what’s
    happening.

    '
  trans: '


    当人类与数字设备交互时，他们会留下信息痕迹，就像雷达上的一个点一样；只要有足够的点，一个人类就可以被追踪到最细微的细节，而这只需要一个单一的事实检查应用。在开发者的总部，一系列机器正静静地吸取安装了该
    App 的用户的所有可能数据，包括他们的短信、电话号码、用于三角定位置的 Wi-Fi 名称等。用户在毫无察觉的情况下变成了间谍设备，而这恰恰是开发者**不想**收集数据的时候。如果一家科技公司想要收集数据，它可以创建特殊的系统，这些系统旨在对数据进行标记和排序，从而既能保护公司所有者免受责任影响，又能允许全方位的监控。就像细微的沙粒本身无法察觉，但堆积在一起就会形成一处无法扫到地毯下的沙丘，数据位也可以堆积起来，形成海量的用户细节集合，揭示他们的私人想法和秘密。本质上，这就是`Big
    Data`（大数据），一组规模庞大且增长极快的用户数据，以至于没有人类可以对其进行约束。`Big Data`被喂给`machine learning`（机器学习），后者反过来帮助构建更多的`Big
    Data`。人类面对`Big Data`能做什么？实际上可以做很多。


    如果你拥有一可能收集`user data`的公司，请注意，`Big Data`使你成为黑客眼中的肥肉目标，他们总能找到廉价、简单且低技术的方法来破解。针对黑客的最佳防御措施是：

    a) 只收集最少的`user data`

    b) 在不再需要时立即删除所有`user data`

    c) 对所有`data`进行分块存储，让黑客无法一次性获取所有。这种方法被称为`security by design`（设计安全），涉及创建组件最少的最简单服务和产品。结合`defense
    in depth`（深度防御），即物理访问控制受到软件保护的支撑，这意味着你将数据加密并锁在安全房间里，只有受信任的人才能获得钥匙。在专用驱动器上进行定期备份，并保持其与互联网断开；如果你是一个为收集`Big
    Data`的公司工作的程序员，请记住在绝大多数情况下，任何服务或产品的用户都会使用默认设置。无论你设置什么默认值，你的用户都会不检查甚至不知道如何更改的情况下直接使用。此外，还要警惕“功能蠕变”（feature
    creep），即产品转向承担更多比其实际能完成的角色，使其容易受到黑客攻击。


    如果你是一个想让数据排除在`Big Data`之外的用户，请开始撒谎。每当你被要求提供个人信息（如姓名、电子邮件和出生日期）时，输入虚假回答——除非你真的要使用这些服务——并删除旧账户。创建临时账户并为所有内容选择长密码；密码长度是其强度的最佳指标，除非产品明确要求，否则不要费心大写字母和数字。如果你真的需要使用社交媒体，请为每个平台使用独立的设备，并重置设备以清除所有个人数据。


    # 第 13 章 – AI 与就业


    在目前的商业环境中，IQ 测试是被禁止的，因为它们会导致所谓的“差异性影响”（disparate impact），这本质上意味着如果企业过滤掉某些人，可能会被起讼。即使实际上需要具备某项技能的员工，雇主仍可能被拖上法庭并被推向媒体舆论的法判席，因此大多数人只会叹气，雇佣那些对业务贡献微乎其微、与高效员工并存的人。这种为了遵循“完美饼图”理想化（即每个种族和国家身份都拥有一席）而雇佣象征性员工的做法是不可持续的，且可能有害的，但雇主仍然会这样做，以规避媒体的负面评价。


    在其中一个上诉最高法院的案例`Ricci v DeStefano`中，康涅狄格州新哈市的一组消防员通过通过一项漫长且昂贵的考试来争夺中尉和上尉职位。市当局最终否决了结果，因为没有足够的少数族候选人通过考试，而本应获得晋升的消防员提起了诉讼。最高法院裁定，“除非雇主能够提供有力的证据证明，如果不采取行动，他们将根据`Title
    VII`承担责任，否则这种基于种族的行动是不允许的。”简而言之，该考试是新哈市最好的，而这本该是应该使用的。


    '
