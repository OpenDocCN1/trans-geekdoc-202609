    # Introduction


    What you are about to read defies all mainstream notions of artificial intelligence
    (`AI`) and challenges all foregone conclusions regarding what smart machines are
    or can be. However, scratching beneath the surface shows there is barely any truth
    to them and that there’s a grand deception being played, but one that’s not inherently
    malicious—it’s all about the money. The mainstream media has been starving for
    sales, views, and subscriptions to the point it now has to come out with bombastic
    claims that are simple enough for everyone to understand. What better claim than
    that of an `AI`, a concept so vague that it can do anything and everything? As
    the barrier to entry into the media market lowered, a random Swedish guy in a
    cubicle snorting into his microphone could get millions of views more than a mainstream
    news outlet. Radical times called for radical measures, such as announcing `AI`,
    driving fear-based sales, views, and subscriptions. Companies claiming to involve
    `AI` in their products and services get more funding and extra attention from
    the mainstream media, which is in on the ploy. Want to make bricks? Announce you
    are making `AI`-designed bricks, and the media will do your marketing for you.
    Stage a flashy but ultimately misleading demonstration, and all the global media
    will give you attention.


    Scientists want to feel respected, so what better way to become influential and
    admired than claiming there is an `AI` only they can access, understand, and interpret?
    If that sounds like priesthood, that is exactly what it is. Again, the more bombastic
    claims scientists can produce, the more funding they can get and more attention
    from the media.


    These three groups fuel one another in an endless cycle of excitement and fear.
    When is the actual `AI` product coming out? Nobody actually wants to make one
    because it would reveal the ruse and show that the technology just isn’t there
    yet. What we do have right now is a very simple smart machine that can crunch
    data, compare images, and make simple mechanical motions, such as lifting boxes.
    Everything else is just a myth that might not ever come true.


    So, what is actually going on? Read on and find out.


