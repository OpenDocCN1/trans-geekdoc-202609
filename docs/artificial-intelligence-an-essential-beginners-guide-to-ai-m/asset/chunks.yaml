- raw: 'Foxconn is one especially egregious example, owning a massive factory campus
    in China where workers have their daily quota set out for them by the most productive
    echelon of workers—do better than that, and everyone else has to speed up or get
    fired. Everything from seating positions to worker interactions is strictly controlled
    and optimized. Workers that decide they can’t take it anymore usually end it all
    by jumping off the nearest campus building, which prompted Foxconn management
    to install safety nets that will make unhappy workers rethink their choices and
    deal with the shame of being fired. Foxconn produces some 40% of all consumer
    electronics used globally, such as Playstations, iPhones, Nintendo 3DS, and Xbox.


    The Western idea of workplace equality, where pregnant women and minorities get
    a cushy job position just because of anti-discrimination laws, seems idealistic
    and quaint in a way that a philosopher, who has never run a successful business,
    would imagine it being run; China is more efficient in every given aspect, though
    it produces immense suffering. Businesses can’t stay competitive if they have
    to deal with a constant barrage of complaints, lawsuits, and negative media headlines,
    which is why they generally create Human Resource (HR) departments to handle employee
    matters internally.


    HR deals with hiring and firing, acting like a thought-police that micromanages
    employees’ behavior to minimize legal liability for the employer. After the #MeToo
    scare, during which various women made claims of being sexually harassed by powerful
    men, Netflix’s HR department introduced a rule that a male and female worker can’t
    hold eye contact for more than five seconds at a time  [\[26\]](#text00000.html#_ftn26)
    —since that is what “invokes powerful sexual desire”. Can HR do that? HR can do
    as it wills.


    HR handles job interviews with its own byzantine schemes, which are specifically
    designed so the potential employee can’t file a discrimination lawsuit. If you
    ever had the displeasure of suffering through six increasingly complex job interviews
    by the same company only to get rejected without a reason, now you know why—you
    were never considered for the job position in the first place, but the company
    had to put up a dog and pony show to minimize the chance of negative media coverage.
    The same thing goes with resumes, which are simply sent to the recycle bin save
    a select few—again chosen through “unknown divination rites”.


    However, what if an AI could do the hiring instead of HR? Incapable of discrimination
    or racial bias, which is what supposedly makes businesspeople avoid hiring minorities,
    an AI would be perfectly objective and always find the perfect employee without
    any need for an HR department. AI could also sift through Facebook and LinkedIn
    profiles to find upcoming talent and hire it before anyone else, snapping up all
    the hottest employees for peanuts before they know their worth. An AI could be
    able to find a suitable job for everyone, ensuring nobody goes hungry or destitute,
    which would boost the economy, eliminate unemployment, and solve the problem of
    prison recidivism. Sound like a great future?


    Amazon actually tried making the perfect AI recruiter, but the results scared
    the engineering team working on it, and the project was quickly shut down—their
    digital brain consistently favored men over women, and there was apparently no
    way to tweak it without ruining it completely. Amazon’s emphasis was on automation,
    with the idea that an executive could feed the neural network 100 or more resumes
    to get the five most qualified people for the position  [\[27\]](#text00000.html#_ftn27)
    . This kind of tool is a Holy Grail for all tech giants, as it would eliminate
    plenty of overhead related to hiring, but this project shows just how much progress
    we would have to undo. Right now, we all have to rely on a friend or relative
    to skip over the HR department anti-lawsuit moat, but the tool promised a bright
    future where nobody has to write or read a single resume.


    By using a training dataset that consisted of ten years’ worth of resumes, mostly
    those of men, Amazon’s job candidate finder neural network picked up on some 50,000
    keywords related to productivity. The tool learned that any resume with the word
    “women” or “women’s” negatively affected that person’s productivity. In addition,
    job candidates from all-women’s colleges were extra penalized. Even after engineers
    made the tweak so that women were equal to men, the neural network was able to
    bypass the restriction and find another way of detecting if the resume belonged
    to a woman, penalizing it regardless. So, how did the tool evaluate resumes? Skills
    that were common among resumes were given low importance, such as the ability
    to write computer code. Aggressive, manly terms, such as “executed” and “captured”,
    were given higher importance as they showed ambition and remorselessness.


    What is interesting is that Amazon’s tool recommended that unqualified candidates
    be given all sorts of job positions, which made engineers think it was just glitching
    and giving random results. However, the hiring process companies use right now
    relies on positive bias, meaning we expect better results from people who have
    provided similar results in the past, which makes sense but doesn’t give a chance
    to people who have talent but haven’t had the chance to get their foot in the
    door by going to a fancy university. The tool had no positive bias and recommended
    that Amazon introduces fresh blood at all levels because people without any experience
    have limitless potential. People who already have a filled-out resume have, in
    a sense, defined themselves, but naive schoolboys and girls could become anything
    and provide a novel perspective to any company’s inner working.


    It was a stroke of genius, one that can only be achieved by trawling through countless
    resumes and crunching trends to their constituent words and numbers to analyze
    them without the limbic system barging in. As companies grow, they mature from
    the startup phase, where they had to take a risk, to the corporate phase, where
    they wish to eliminate the risk that drove them in the first place. This makes
    established companies complacent, inert, and populated by all the same crusty
    executives that keep doing what their experience has taught them—except that is
    no longer enough in an eternally changing market. Of course, Amazon ignored this
    idea completely as an error and quietly shelved the entire project, but commented
    that it is committed to workplace diversity and equality because that is what
    the media want to hear.


    Other companies are trying different approaches, mainly by analyzing facial expressions
    to see what the job candidate thinks of themselves. HireVue is a startup that
    assesses video interviews instead of resumes to reveal flashes of insight from
    unconscious facial expressions made by tiny muscles around the eyes and mouth.
    As you have probably figured out by now, this kind of analysis is probabilistic
    and works most of the time in some cases; we have no way of knowing if the candidate
    has had, for example, a root canal that would cause a painful grimace on the day
    of the video interview. It is an intriguing idea but still doesn’t make the interviewing
    process fully automated.


    LinkedIn would be the vanguard in AI hiring, so what does LinkedIn think of it?
    John Jersin, VP of the LinkedIn hiring department says, “I certainly would not
    trust any AI system today to make a hiring decision on its own” and “technology
    is just not ready yet.” Well, that settles it. Transparency in AI-managed hiring
    processes is another problem—since there is no way to double-check the process
    or enforce workplace equality. There is already a term for this kind of problem:
    “algorithmic fairness”.'
