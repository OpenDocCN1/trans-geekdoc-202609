- raw: 'Some random country might happen to have just the right ingredients to physically
    anchor AI in our world, suddenly making it an El Dorado. A shift in global power
    will be near instantaneous, tectonic and, due to the presence of nuclear weapons,
    surprisingly peaceful. It is likely that AI, once it reaches a sufficient level
    of penetration in our global digital society, will have the same impact the internal
    combustion engine had: more power, more productivity, more status, and more leisure.
    We did leave dedicated lanes for pedestrians (sidewalks) and forbade cars from
    driving on them; we also created dedicated lanes for cars (highways) and forbade
    pedestrians from walking on them. In computer terms, human legs are legacy hardware
    that is still supported in city infrastructure, so we will likely have to create
    an entirely new layer of infrastructure just to accommodate AI and leave the ordinary
    internet and landlines to humans.


    It is not even a matter of willpower or societal organization; just compare the
    outputs of a tractor and a third-world village with hoes and shovels. A single
    machine driven by a human can do the work of 300 men, women, and children with
    ease while creating a tiny bit of pollution. Not just that, but the tractor driver
    is in a comfortable seat, with the cabin protecting him or her from the sun, so
    plowing is pleasant.


    How likely is it that AI will leave people jobless? The same way we don’t hear
    anyone complaining about tractors getting all the juicy plowing and hoeing jobs
    of villagers, AI will most certainly not remove jobs as they are but will automate
    and expedite certain simple, repeatable chores we had to do manually with great
    expense in time and energy. AI will make those chores more pleasant, and we’ll
    be glad to have it finally, but there is also the problem of becoming too reliant
    on machines to the point we forget to use our brains.


    Note how in the tractor analogy, it still mentioned “machine driven by a human”.
    That wasn’t just a figure of speech or a contrived circumstance—legally, all roadworthy
    vehicles have to be operated by a human, even in cases of horse carriages where
    an animal has a choice of speed and direction. Vehicles using an engine with internal
    combustion simply have to have someone accountable in case something goes wrong,
    meaning they have to be registered, serviced, and operators have to have a certain
    license, etc. If we compare a horse carriage driver to a car driver, we can clearly
    see that the increase in horsepower leads to a stricter licensing mandate. If
    AI ever becomes a household item, something each person will own just like we
    own smartphones, it is likely they will have to be licensed the same way some
    US states register guns in case something goes wrong.


    # Chapter 9 – Fear-based Consumerism


    Humans are known to use performance boosters, nerve stimulants—such as coffee—that
    power the global economy. What is the equivalent to that when it comes to machines
    or AI? As far as we know, there is no such thing—meaning that machines may outperform
    humans but will have linear productivity at best and won’t be able to keep up
    with humans that can constantly improve their performance, albeit temporarily.
    However, using performance boosters does have a drawback.


    The alcohol crisis is skyrocketing in the US, especially with women. Responsible
    for the deaths of about three million people a year worldwide, alcohol is a brain
    stimulant that lowers inhibition and warps the sense of reality. Simply put, alcohol
    lets the user unwind and live in a slightly better world, even if excess use does
    cause a hangover the day after. The ultimate reason for wanting alcohol in the
    first place is stress—usually due to pushing the body to its utmost limits to
    keep going in the workplace. Entrepreneurs are particularly prone to pushing themselves
    and everyone around them through discomfort, lack of sleep, and pain, and we actually
    lionize them for it.


    Being a well-rested entrepreneur is heresy even though sleep deprivation is a
    legitimate torture method that induces psychosis, a detachment from reality that
    fractures the mind. Presidents and leaders pride themselves in their autobiographies
    on making decisions without sleeping at all, even though they command armies and
    nuclear arsenals. How can we entrust the future of anything to a sleepless, crazed
    person who has barely had a good night’s sleep in years? Yet, we have to have
    all these people, from common janitors to presidents, working themselves into
    an early grave or there is no chance to stay competitive in the global market.
    So, excessive demands and lack of sleep cause a tremendous deal of stress, the
    long-term breakdown of the body and psyche.


    Caffeine abuse is another big problem when it comes to attempts to increase productivity
    without innovating or dealing with stress. We don’t see coffee consumption as
    a problem—since it gives us that kick in the morning—but caffeine is a stimulant
    that hurts the body in the long run, particularly by disrupting sleep patterns,
    again compounding the problem of induced psychosis. Caffeine is not banned like
    heroin or cocaine only because it stimulates the economy. See the common theme?
    Whatever increases economic output is allowed.


    All the executives working in tech giants are likely in such a psychosis induced
    by sleep deprivation and stimulant consumption that they have lost touch with
    reality and don’t even know what they are doing, relying on the hierarchy of competent
    people below them to do their magic. In all likelihood, the fact tech giants’
    CEOs crave AI to take over is simply so—they can finally get a good night’s rest.
    They are stressed out of their minds, but since all their projects are proprietary,
    nobody can tell if there is any truth to what they’re saying regarding AI.


    So, what is the real cause of stress? In engineering terms, stress is when a structure
    or an element in it is exposed to a certain amount of load; every beam, brick,
    and pillar have a certain range of load they can bear before breaking down. When
    it comes to humans, stress is a cognitive load caused when we perceive the world
    around us as dangerous and have to deal with the cause/s. Successfully doing so
    releases a small amount of feel-good chemicals in the brain that helps us unwind,
    making us feel accomplishment and satisfaction. If we can’t deal with causes of
    stress, we develop coping mechanisms, such as finding comfort foods, highly caloric
    foods that typically have little nutrition but taste just right to trigger the
    release of same feel-good chemicals in the brain.


    In a 2007 study titled “Stress, eating and the reward system”  [\[22\]](#text00000.html#_ftn22)
    , a pair of University of California scientists researched the link between stress
    and indulging in comfort foods. In essence, stress is an evolved response to danger
    that triggers a short-lived “fight or flight” reflex, releasing adrenaline and
    cortisol that exhaust the body and shorten the lifespan. Stress is meant to give
    us superhuman strength so we can either fight back or escape danger, but the same
    stress response can trigger for no benefit during the course of an ordinary life,
    especially when you are involved in a dynamic work environment. So, if you’re
    working in retail and a customer starts yelling at you, that causes your limbic
    system to think it is being attacked and triggers stress, causing you to either
    yell back (fight) or cower (flight).'
