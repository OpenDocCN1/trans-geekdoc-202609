- raw: 'How did we deal with nuclear weapons? Almost all countries in the world got
    together in 1963 and signed the Partial Test Ban Treaty that is basically a pinky
    swear that they won’t be testing nuclear weapons; those that still haven’t signed
    include the Vatican, Mozambique, Zimbabwe, and Uzbekistan. Of course, this favors
    the United States the most—since they had already detonated nuclear weapons over
    1,000 times in the Earth’s atmosphere prior to the Treaty.


    Chemical weapons give us another 12 gruesome ways to die you won’t believe are
    true . First used on an industrial scale in World War I, meaning over 100 years
    ago, chemicals such as mustard gas were indiscriminately sprayed from airplanes
    and lobbed using artillery, producing painful blisters, blindness, and lesions
    on lungs; those who survived often developed cancer. The result was that these
    chemicals were banned from use in warfare the same way nuclear weapons were.


    If AI or robots become a threat to established world powers, rest assured they
    will be banned just like nuclear and chemical weapons. Anything that gives small
    countries a force multiplier, meaning a way to have one soldier do the damage
    of a hundred or more, will be swiftly locked away in a vault so nobody can use
    it against the world’s superpowers. Also, note how in the article the robot is
    shown being used by the soldier, rather than gunning down targets on its own.
    That is because no army wants to have its weapons controlled by an AI that could
    develop a conscience and refuse to invade a country, shoot up civilians, or do
    enhanced interrogation to gather data.


    The most stereotypical portrayal of wartime AI is in the movie War Games , where
    it crunches down a huge number of nuclear holocaust scenarios to realize that
    the only winning move is no move at all. It is a nice movie twist but also reveals
    a fatal weakness in AI, because why would any army use a machine that would recommend
    against all attacks or retaliations?


    AI and smart machines can be given boring chores, such as digging trenches or
    carrying supplies back and forth. The problem is, what happens when the enemy
    inevitably captures one of our smart machines? How do we prevent all the resources
    and effort put into AI development simply being stolen by enemies and used against
    us? To that, there is no satisfying answer, which brings up interesting notions
    of reckless AI use backfiring against people who pushed it. This isn’t inherent
    to just wartime use; even peacetime AI development will be liable to be easily
    stolen by the competitors through the internet.


    Will AI be used in combat? Most likely not, as it is quite fragile and won’t withstand
    the raw experience that makes grown men get PTSD. If robots do get used in warfare
    on a grand scale, we can expect all sides to use them equally, making war just
    another hyper-violent sport where nobody actually dies. If anything, AI will be
    used in disinformation campaigns to sow discontent online, which is a far more
    devastating use, but the headline of “You might have been reading AI’s poor grammar
    without even knowing” just doesn’t have the same clickbait appeal.


    ### AI will take our jobs


    This myth aims to stoke fears of losing job security, going straight for that
    part of the brain obsessed with survival. The notion of losing employment to an
    AI that vastly outperforms humans sounds plausible but also plays into and latches
    onto the fear of low-skilled immigrants taking all our jobs and being paid peanuts
    to do them; if a crummy immigrant can do it, why not a smart machine? Note this
    article headline “Self-driving vehicles are set to take 25,000 jobs a MONTH away
    from Americans with truck drivers being worst hit”  [\[4\]](#text00000.html#_ftn4)
    . Here we have the keywords “take”, “worst”, and “hit” in the headline. What is
    the catch?


    The article authoritatively cites a Goldman Sachs report, which claims that in
    each year leading up to 2042 truck drivers will be losing jobs at a rate of up
    to 25,000 a month, with all four million trucking jobs gone by that year. A direct
    link to the report itself is conspicuously absent from the article, and there
    doesn’t seem to be any trace of it online. Perhaps it was distributed through
    mail or other non-digital means, but let’s just assume it does exist and those
    claims are valid. How does truck driving work now and how exactly are AI trucks
    supposed to “take away jobs”?


    A truck driver is expected to haul cargo from point A to B in the shortest time
    possible using a truck supplied by the logistics company that hires anyone willing
    and able to do the task. The truck itself is usually in a state of advanced dilapidation,
    with maintenance cutting into the owner’s company profit margins. Brakes are a
    particularly worrisome part, which led to plenty of US states implementing truck
    arrester beds  [\[5\]](#text00000.html#_ftn5) , special lanes filled with coarse
    gravel where a truck with failed brakes can safely stop. Any trucker that stays
    in the business always has just one goal—buying his or her own truck to have a
    reliable vehicle, making him or her an owner-operator, an independent contractor
    that can now bargain for better jobs from a favorable position.


    Truck drivers are typically men with minimal education who can’t find any other
    employment and rely on trucking as hard as possible to make quick cash—that is
    until the government decided to regulate the industry severely. Gone are the days
    where truckers were like cowboys, riding in a group, pushing rude drivers off
    the road and taking over empty stretches of desert highways to settle their scores,
    like in the 1978 movie Convoy  [\[6\]](#text00000.html#_ftn6) . To be fair, it
    was a lawless state of affairs, and it is hard to negotiate with a guy at the
    seat of a 40-ton truck who hasn’t slept in six days, but there is regulation,
    and then there’s overregulation.


    Truck drivers now have to use mandatory log tracking devices, have trucks electronically
    limited to 65mph at most, take mandatory breaks, suffer obnoxious drivers, and
    have trouble finding parking space  [\[7\]](#text00000.html#_ftn7) , causing plenty
    of them to quit. Churnover is a huge problem with truckers, but there is no shortage
    of cargo in need of hauling thanks to whiny consumers spoiled by Amazon’s same-day
    delivery who will gladly leave a four-star review, which is a death sentence for
    any Amazon seller jostling for a perfect review score and a top spot in search
    results. When put like that, it is no wonder why AI trucks are so desperately
    needed—logistics companies need more workers than ever but can’t find them to
    the point they are willing to use whatever they can get.


    An AI truck would supposedly be able to skirt around all the mandatory work hours’
    regulation, though it too might need maintenance. This would best be done by a
    dedicated person riding inside the truck to take over when AI experiences issues,
    the truck fails mechanically, or someone tries to hijack the cargo. We can even
    call that job “driving assistant specialist”. The driving assistant specialist
    would need to have at least two replacements, so three persons for each AI truck,
    and have them take eight-hour shifts as the other two are resting in the back
    of the truck.


    In essence, we now have to hire triple the workforce because of AI trucks, though
    the role of strictly being a driver isn’t there anymore unless AI fails catastrophically.
    Would being a driving assistant specialist be a better or worse job than being
    a driver? That comes down to perspective, but one thing is for sure—it would pay
    a lot more because it would now require a more delicate skillset related to repairing
    and handling the AI truck. That sounds completely counterintuitive, but market
    trends have consistently shown that every new generation has been getting more
    chances for education and thus much better-paid jobs thanks to technology, not
    despite it.'
