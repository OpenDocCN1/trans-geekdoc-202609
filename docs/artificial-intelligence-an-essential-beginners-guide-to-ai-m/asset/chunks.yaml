    \ personality traits and then perform automated chatting, espionage, and blackmail.\
    \ Stuart also created “Slaughterbots” [\\[38\\]](#text00000.html#_ftn38), a dramatized\
    \ video on how tiny drones could be used for assassination in preparation for\
    \ his petition to ban autonomous weapons in front of the United Nations. Capable\
    \ of avoiding lazy swats, the drone can literally dive-bomb a target, delivering\
    \ three grams of explosives right at the center of the forehead for instant death.\n\
    \nWhile dramatic, the Slaughterbots video doesn’t explain how it is fighting off\
