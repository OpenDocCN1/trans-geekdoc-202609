- raw: 'Dr. Lee says that governments around the world will have to provide citizens
    with “meaning to life” more than just the means to live and mentions that jobs
    where the outcome has more to do with human satisfaction rather than 0s and 1s,
    such as nannies and teachers, are still safe from automation. Creative creators,
    for example, writers and painters, also have nothing to fear for quite a long
    time. For many people, says Dr. Lee, work is the meaning of life, and they expect
    to have the same old routine for 60 years of their existence just like their forefathers,
    so having that snatched away from them won’t put them in a good mood.


    The thing is, we are already treating our workers as robots: sit still, fill out
    these spreadsheets, and send them out in an e-mail for eight hours a day, so automating
    their jobs will actually be doing them a favor. How about giving them a smart
    tool that fills out the spreadsheets, and they just double-check the results?
    That would absolve the company of any legal liability as there would still be
    a human, but the work output could increase tremendously, though with some reduction
    in overall quality. It is telling that two countries with the feeblest consumer
    protection laws, the United States and China, are the ones pushing for AI as their
    captive customers have very little say in what they get.


    This common ground could be used to let Chinese-style censorship enter the US
    through tech giants, such as Facebook and Google, which have already expanded
    to the point they resemble nation states, except they can’t be defeated in a war.
    China’s social credit system (SCS) is like a huge video game, save that the consequences
    of being low on the scoreboard mean being shut off from government essentials,
    such as education and public transport. What causes loss of social score? Traffic
    accidents, murders, embezzlement, and being related to someone who did any of
    those.


    In one instance in 2015, a young Chinese student, Zhong Pei, couldn’t buy a train
    ticket or enroll at a university because her dad had killed two people and himself
    in a car accident  [\[41\]](#text00000.html#_ftn41) . The official label entered
    in the system was that Pei was “dishonest”, but she was able to clear her name
    after four months. Already built and trialed by Tencent and Alibaba, the Chinese
    equivalents of Apple and Amazon, SCS will become China-wide in 2020, where everything
    a citizen does will go into figuring out their score. Drinking, playing video
    games too much, or simply hanging out with the wrong people? SCS will consider
    whether hobbies, purchases, and health habits deviate from what the Party has
    set out for a model citizen to dole out the punishment: social and economic isolation.
    The only problem is, as we saw with the Canadian isolation experiments, those
    measures radicalize people and warp their sense of reality.


    The idea behind SCS is that the Chinese government can’t possibly handle over
    a billion people who might own powerful technology, so untrustworthy ones most
    likely to cause trouble should be identified and gradually squeezed out of the
    big cities, including those who could help them claw their way back in. According
    to that logic, SCS will reward those who act responsibly while acting as a pre-punishment
    to those who endanger themselves and others. Other punishments include the cutting
    off internet access, no access to housing loans or job opportunities, and a revoked
    passport. What will those people do to survive in a world with increasingly hostile
    technology?


    # Chapter 22 – Hacking AI


    The idea of hacking refers to having a cheap, scalable, and reliable way of introducing
    uncertainty into any computer system to produce an unexpected result. Because
    of how they are programmed, computer systems typically fail catastrophically when
    faced with unacceptable inputs. One example of this would be buffer overflow,
    which is when something like a text box on a website allows any visitor to input
    any number as age; a hacker can tinker with inputs until he or she finds such
    a strange number that it crashes the website or gives them total access to the
    backend.


    Usually being rushed to production, websites and software don’t check for all
    possible inputs or even restrict them because just getting things to run at all
    takes so much time and effort. At least after a hacking attack, the owner of the
    software or website will plug the hole, right? In computer systems that are large
    enough, the owner might not even have the resources or willpower to keep fixing
    these code loopholes, leaving the customers to fend for themselves. In cases where
    the system has been silently infiltrated in a way that doesn’t cause the customer
    to notice, the owner might even willingly ignore it and focus on those problems
    that might lead to a class action lawsuit. Like mentioned before, minimum viable
    product.


    In engineering terms, “hacking something together” would refer to taking a medley
    of various scraps and tidbits to create a useful tool or product that shouldn’t
    be possible. When it comes to hacking, the idea is to overcome an obstacle or
    solve a problem using less effort and resources a human would need to make that
    obstacle or problem. Applied to any area in life, hacking becomes a performance-centered
    mindset—how can this be made to work right now?


    There is no limit as to what can be used in hacking. Wherever the computer system
    is fortified with a human operator who is meant to double-check the system, a
    hacker can count on laziness or compliance.


    Depending on sensors used in IoT devices, those with darker skin tones could find
    themselves unable to use them. In one instance  [\[42\]](#text00000.html#_ftn42)
    , a bathroom soap dispenser installed at Facebook’s headquarters couldn’t recognize
    a black person waving his hand underneath it to drip soap but worked just fine
    when a white person did it. The workaround is to take a sheet of white paper towel
    and wave it underneath the sensor, after which it works as intended. This isn’t
    an intentional design flaw but an omission on the part of the engineers who built
    the soap dispenser.


    Dark skin absorbs more light while light skin reflects it, which confuses the
    sensor that measures the amount of light reflected into it. Engineers building
    the soap dispenser didn’t test for enough of fringe cases because they were most
    likely urged to rush the product out as soon as possible and also keep its cost
    low; increasing the range of skin colors the soap dispenser detects would likely
    make it cost more and err more often. We are likely looking at a future filled
    with slick, fancy, overpriced IoT devices that work only in a narrow set of circumstances,
    but at least it is just a soap dispenser, right?


    Sensors in self-driving cars could run the same fault as they fail to detect people
    with darker skin tones, thus smashing into them. One University of Georgia study
    analyzed by Metro.co.uk  [\[43\]](#text00000.html#_ftn43) found that self-driving
    cars tend to err 5% more when dark-skinned pedestrians were introduced in the
    test. Simply put, when engineers create a neural network to detect objects and
    pedestrians, they use the most glaringly obvious examples that help them create
    a working product in the least amount of time, which means white people because
    they stand out the most. Investors have shelled out money and want to see impressive
    results right now, but as mentioned previously, neural networks are probabilistic.


    Vehicles currently require human drivers since no kind of software can react in
    a wide range of nuanced situations where a simple action or inaction can have
    fatal consequences, but at least we can assign blame to them. When a neural network
    in one such car finds itself in a completely novel situation, there is no telling
    what could happen with the Trolley Problem, a thought experiment in which a human
    has to make a split-second decision on whom to kill.'
