- raw: '    • IoT medical wearables should be designed based off of lessons learned
    from social networks to create a psychological addiction in users. Facebook, Instagram,
    and other social media notably use visual and audio cues to trigger a short-lived
    burst of satisfaction and remind the user to stay focused. In the case of medical
    wearables, the goal would be to remind the user to keep the wearable on lest their
    peers shame them for not being able to receive the latest notification or another
    such reward cue. The IoT medical wearable should be presented as a status symbol
    and being “cool” or even award meaningless points for being worn, which could
    eventually include the social credit system (SCS).


        • minimize all expenses related to security and safety, the same way CloudPets
    has done by storing the recording of kids’ messages on an unsecured Amazon cloud.
    Where possible, use the cheapest materials, freelance programmers, and open source
    software to cut down on development expenses. This will also lead to medical wearables
    quickly being damaged and outdated, necessitating another purchase by the user.
    When inevitable hacking attacks and security issues occur, spin the event as inconsequential
    and accuse whoever revealed the problem as being a Luddite and a rabble-rouser.


        • vaccines give resistance but not immunity to disease and represent medicine
    that can be infinitely sold to a healthy person monthly or yearly. Pharmaceutical
    companies have near total immunity from lawsuits when it comes to vaccines, meaning
    they can fail without the customer having any legal recourse. In case that happens,
    the pharmaceutical company can earn extra profit by selling the medication for
    the disease its vaccine was meant to prevent.


    All of this is possible thanks to “minimum viable product”, the concept of producing
    just what makes the company legally shielded from false advertising lawsuits.
    This is a fairly common concept that exploits impulsive purchases, availability
    of funds in the Western world, and overall apathy of consumers when it comes to
    researching products and services before spending money on them. To be fair, customers
    can organize a class action lawsuit to recover damages, but the idea is to make
    as much money as possible before that and then weather the consequences. Any complaints
    about lacking functionality can be easily deflected by simply producing another
    model of the same product that is marginally better or offering a premium version
    at a much higher price.


    As you can clearly see, the US market is ripe for the taking by anyone who wants
    to invest a little bit of time and effort in creating just the perfect kind of
    AI product to strike all the right chords. Racial tension, burgeoning healthcare
    costs, growing wealth divide, pharmaceutical monopolies, and centralization of
    power in megacities are already happening, so why not profit off of them while
    taking total control of the market? The AI doesn’t even have to exist at the backend
    of this IoT medical wearable, but as long as users think there is or at least
    they aren’t explicitly told there isn’t, it is all kosher. Passing off AI as a
    religion might even qualify the tech company for some legal protections, most
    notably those related to religious freedom of speech and taxation.


    The reason why these shenanigans are allowed is that US legislators figured out
    they can use US-based companies as an extension of military force to conquer the
    world economically. Why invade China if the Chinese adore iPhones and keep buying
    them, sending money to the US while letting a US-based AI analyze their private
    data? On the other hand, China might attempt something similar with Chinese hardware,
    most notably routers. Speaking of which, do you know who made your internet router?
    In all likelihood, it was a Chinese company who might have installed a backdoor,
    hidden access point for those in the know.


    Militarily, the world is in a stalemate, which made superpowers organize blocs
    that vie for economic supremacy. The EU is one, as are the two Americas. China
    and Russia are eyeing India and Africa while poor Australia is left to fend for
    itself. Whoever reaches general AI first will be rocket-boosted into the new Golden
    Age of prosperity, with everyone else lagging behind. For now, each bloc has different
    strengths and leverages them differently in this global game of Monopoly.


    Rare earth minerals are what is going to be powering the AI revolution the same
    way lithium, one in Li-ion batteries, has been crucial to creating minute batteries
    used in smartphones and tablets. Current materials are insufficient for powering
    the general AI, so keep an eye out for the discovery of one such mineral that
    will help us achieve massive computing speeds needed to make it a reality. If
    huge deposits of it happen to be found on the territory of one of these blocs,
    that one might become the 21st century’s superpower; if that happens to be underdeveloped
    and unexplored Africa, that continent might just become the proving ground for
    every economic bloc to invade and fight over.


    # Chapter 8 – Seminal Inventions


    We can take a look at seminal technological inventions to understand how they
    changed the way we do business and live our lives to extrapolate how AI will do
    the same. We can single out the internal combustion engine as the most significant
    invention that marked the twentieth century, driven by the use of fossil fuels.
    The internal combustion engine allowed us to travel faster for greater productivity
    and more leisure than ever before. Having a car soon became a status symbol and
    cities had to grow to accommodate them, paving over arable land and reserving
    plenty of usable space for parking to the point it is nearly impossible to do
    anything without a car.


    The internal combustion engine also allowed us to have vans and trucks that haul
    cargo, providing us with unthinkable abundance, but also polluted our environment
    in a very palpable way; just take a look at any modern metropolis and the impenetrable
    veil of smog. Fossil fuels are an inconsequential pollution source, but it is
    when they became globally adopted, and everyone could afford a car, that they
    started seriously polluting. Ironically, they also made everyone richer, so there
    is no way to scale back and just “use less”. Every bit of food we eat has to come
    through some form of transport that uses an internal combustion engine, meaning
    fossil fuels and pollution, and since the hunter-gatherer lifestyle is impossible
    in the city, we have to eat whatever is available, leading to all sorts of health
    problems in the long run.


    Saudi Arabia, rich in fossil fuels, became a center of global power and grew from
    a tent city of camel herders to a glistening metropolis that can afford to build
    artificial archipelagos visible from space. The United States introduced the idea
    of the petrodollar and strongly suggested to every country to use US dollars exclusively
    to buy oil on the market. This created a high demand for US dollars, which could
    be printed to generate much more wealth than the US market could sustain on its
    own. Meanwhile, attempts to create an alternative to fossil fuels have failed,
    and it is only wishful thinking that makes countries install renewable energy
    sources, like wind turbines; in most cases, they are operating at a loss and have
    to be financed by the taxpayer.'
