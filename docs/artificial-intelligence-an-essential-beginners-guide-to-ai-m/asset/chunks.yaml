  trans: '

    从规模上来说，`ContentID` 根本行不通，因为它倾向于保护 Google 免受诉讼影响，而不是确保版权所有者或 YouTube 用户的需求得到满足。这其中需要人类担任主主来审查版权主张，并决定批准或驳回；无法想象
    AI 何时能接管这项职责。光是 YouTube 每秒就有大约 3,000 小时的视频被上传，没有任何足够的支持人员来审核所有视频是否侵犯版权或违反社区准则；这部分工作被交给了群体智能，无论那是人类还是机器。


    Google 曾尝试引入 `YouTube Heroes` 模式，作为一种激励用户本质上成为无偿内容审核员的方法，这在理论上是一个好主意，但被所有 YouTube
    内容作者无情地抨击为是专制和剥削的。如果 Google 已经准备好 AI 或任何类似的技术进行部署，它早已经在 YouTube 上上线了；如果 `ContentID`
    就是那个被推崇的 AI，那么我们可以看到它是一场灾难。这仅仅是版权主张——一个模糊的权利，AI 处理这种权利极其不给力，但我们却被认为 AI 已经准备好进入市场并来夺取我们的工作了。


    居住在 IoT 设备中并向总部报告现实世界及其中人类行为的神经网络，可以代表 AI 的感官器官。这些微型机器人单元可以向 AI 馈大量的实时数据，让它模拟现实并尝试预测未来趋势。我们相互影响，我们最微小的行为都会产生深远的影响，而我们通常会忽略这些影响；但在一个没有自由意志的严密控制环境中，一个洞察所有
    IoT 设备数据流的 AI 将能够无处不在且无知一切。


    这就是我们开启的一段进入人类深层潜意识思想的奇特之旅，特别是与对高地位者服从相关的想法。如果指令由另一个人类发出，我们会评估其地位相对于我们的地位，如果更高则予以顺从；神灵会自动获得极高尊重并被假定为无懈可击的。因此，如果一家科技巨头想要推行完全接受
    IoT 以及随之而来的隐私侵入，最好的方法是将处理所有硬件数据流的 AI 呈现为一个神一般的实体。这并不意味着这一切实际上是真实的，而是所属公司将以这种方式进行营销，以实现完全的市场渗透，并在字面上的“异端指控”下排除竞争。


    这种想法是，这种 AI 将受到张手欢迎，因为它可以妥善安排我们日常生活中做的每件事以让其变得更好，只要我们不以任何方式干扰它。从寻找完美的工作到预测未来的犯罪，以及成为每个人的完美伴侣，这样的
    AI 在理论上能够像时钟一样运行整个大都市，在问题出现之前就将其解决。请注意，这仍然是科幻小说，但每一个想要在市场上引入更多 IoT 设备以获取更多数据流的科技巨头，早晚都会吹榜这种安排是不可避免且积极的，让
    AI 扮演仁慈神的角色。对于某些人来说，事实已经如此了。


    `George Hotz` 是 AI 及其改变未来能力的忠信者，尽管他已经拥有成功的自动驾驶创业项目，并深知 AI 的内在局限性——即它是概率性的而非确定性的。注意他在
    2019 年发表于《The Verge》的一篇为《Comma.ai 创始人 George Hotz 想将人类从 AI 模拟中解放出来》的文章中所说的话是多么贴切。

    '
