  trans: '

    AI 不会因为某些愚蠢的关键词手段就录用你，但起码它不会把你关进监狱，对吧？事实证明，神经网络已经开始用来监禁人们，特别是那些有犯罪记录和/或有被捕记录的人。


    # 第 14 章 – AI 与法律系统


    在全美，不同县正在尝试使用神经网络工具来为犯罪犯提供风险评分，即在 1 到 10 分的量表上对他们再次犯罪的概率进行评估。详详的 ProPublica 文章
    `[\[28\]](#text0000.html#_ftn28)` 描述了这种软件运作的几个案例，并带入了关于基于算法运行的监狱系统的内部数据。


    当十八岁的黑人女孩 `Brisha Borden` 在上学路上偷了一辆自行车去兜风时，她被捕并指控犯小偷和入室盗窃罪。计算机算法分析她的记录（四次青少年轻罪）后给了她一个
    `8/10` 的分，意味着她极有可能再次犯罪。与此同时，41 岁的白人男子 `Vernon Prater` 曾有一次未遂和两次成功的武装抢劫记录，他在 Home
    Depot 百货商店偷东西时被捕，并被同一系统评为 `3/10`。两年后，`Vernon` 企图实施大额盗窃，但 `Brisha` 没有做任何其他事情，这意味着算法判错了。这是怎么回事呢？


    人类大脑无法正确理解概率，在试图弄清机会时给自己带来很多苦恼。当技术引入其中时，它会成为额外的困惑来源，因为技术永远是不完美的。就像你在后面的章节中看到的皂液分配器一样，技术旨在在特定的接受输入范围内可靠地工作，但边缘情况可能会导致随机故障。此外，概率是复合叠加的，所以如果我们使用不准确的技术来复核我们的估测，预测结果将比我们直接猜测不准确得多。这听起来很奇怪，但在数学上是说得通的。


    想象一个警察检查站来抓捕醉驾。醉驾是一种邪恶的犯罪——这种犯罪可以通过自动驾驶汽车完全防止（如果汽车在需要时会杀死司机）——它无故地危及生命，所以我们有一个高尚的目标，并对给司机带来不便感到良好。再想象一下一个准确率为
    99% 的先进酒精测试仪。听起来完美，不是吗？然而，也假设每千名司机中只有一个人醉驾。抓到那个家伙的概率是多少？仔细考虑一下答案。


    如果你停下来测试 1,000 名司机，错误率为 1% 的酒精测试仪会显示其中有十个人是酒醉的，而实际上只有一个是醉的。因此，酒精测试仪有 90% 的误报率，仅仅错误地指控了九个人醉驾。最糟糕的部分是，司机通常会被负罪感淹没，不敢于挑战酒精测试仪。毕竟它是最先进的，它怎么可能犯错呢，更不用说这么多？当结合
    `SCS` 之类的东西时，虚假的醉驾指控可能会导致一系列连锁事故，彻底毁掉一个人的生活，而这仅仅是使用了一个准确率 99% 的酒精测试仪！


    事实证明，如果一个事件并不常见，那么用于检测的技术在事实上是……（此处原文为大量重复的 de-fact，此处根据语意逻辑处理）。

