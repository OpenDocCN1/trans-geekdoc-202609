    Superpowers 博客销售由李凯父（Kai-Fu Lee）博士撰写的同名书籍`21`，它认为政府应该免费向公民提供最低基本服务（医疗、食物、住房和教育），然后给那些参与帮助其他不愿参与的人提供最低基本服务的人员提供现金。从本质上说，只有政府/AI
    员工将获得作为工资形式的 `UBI`。


    ### `UBI` 与目前的福利有何不同？


    `UBI` 背后的隐藏主张是，可以找到对所有人都是足够的现金金额，但观察现实生活的运作表明事实并非如此。年轻单身男性比大多数其他类别更能自给自足，而单亲妈妈等类别需要额外的资金来应对由国家抚养儿童的负担。残疾或慢性健康状况（如糖尿病和精神疾病）又如何？如果我们开始考虑年龄、性别、婚姻状况和整体健康，突然之间，我们的
    `UBI` 就会从一个可以用几句话解释的简单、整洁的概念，变成一种行政混乱，在几十年后又变回我们已经正在使用的那种福利。


    如果没有福利，部落本能就会发挥作用，人们开始组织成松散关联的氏族，这些部落不可避免地想要互相取代并吞噬资源。


