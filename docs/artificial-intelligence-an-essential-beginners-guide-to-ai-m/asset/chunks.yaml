  trans: '

    某些国家可能恰好拥有在物理上锚定 AI 的要素，使其突然变成了“黄金国”。全球权力的转移将是瞬时的、构造性的，而且由于核武器的存在，出奇地和平。AI 一旦在全球数字社会中达到足够的渗透水平，将产生与内燃机相同的影响：更强大的动力、更高的生产力、更高的地位以及更多的休闲。我们曾为行人留出专用通道（人行道），并禁止汽车在上面行驶；我们也为汽车留出专用通道（高速公路），并禁止路人在上面行走。在计算机术语中，人腿是城市基础设施中仍支持的遗留硬件，因此我们可能需要创建一个全新的基础设施层来专门适应
    AI，并将普通的互联网和电话线留给人类。


    这甚至不是意志力或社会组织的问题；只需比较拖拉机的产量与第三世界村庄使用锄头和子的产出即可。由人类驾驶的单一机器就可以轻松地完成 300 个男女老幼的工作，同时只产生少量的污染。不仅如此，拖拉机驾驶员坐在舒适的座椅上，驾驶舱保护他免受阳光照射，因此耕作变得很愉快。


    AI 让人们失业的可能性有多大？就像我们没有听到任何人抱怨拖拉机取代了村庄的工作一样，AI 绝不会消除工作，但它将自动化并加速我们以前需要花费大量时间和精力完成的某些简单重复家务。AI
    将让这些家务变得更加愉快，我们将很幸最终拥有它，但问题在于过度依赖机器，至于我们忘记了使用大脑。


    注意在拖拉机的类比中，仍然提到了“由人类驱动的机器”。这不仅仅是一个修辞，而是一种人为的情况——从法律上，所有合格的车辆都必须由人类操作，即使在动物选择速度和方向的马车情况下也是如此。使用内燃机的车辆出现问题时必须有人负责，这意味着它们必须经过注册、维护，并且操作者必须持有执照等。如果我们将马车夫与汽车驾驶员进行比较，我们可以清楚地看到马力的增加会导致更严格的许可规定。如果
    AI 变成一种家用物品，每个人像拥有智能手机一样拥有它，它们可能需要像某些美国州注册枪支那样对其进行许可。


    # 第 9 章 —— 基于恐惧的消费主义


    众所周知，人类使用性能增强剂、神经刺激剂——例如咖啡——来驱动全球经济。当涉及到机器或 AI 时，与之对应的事物是什么？据我们所知，并没有这种东西——这意味着机器可能超过人类，但其生产力最多是线性的，并且无法跟上那些不断提高自身性能的人（尽管是暂时的）。然而，使用性能增强剂是有副作用的。


    酒精危机在美国激，尤其是在女性中。全球每年有约 300 万人死于酒精，酒精是一种降低抑制并扭曲现实大脑刺激剂。简单来说，酒精让用户放松并生活在一个稍微更好的世界里，尽管过度使用会导致第二天宿醉。最初想要酒精的根本原因是为了应对压力。

