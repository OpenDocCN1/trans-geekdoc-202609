    富士康是一个极其极端的例子，它在中国拥有一个巨大的工厂园区，那里的工人的每日配额由效率最高的一拨工人设定——如果做得比这更好，其他人就必须加快速度否则会被解雇。从座位安排到工人之间的互动，一切都受到严格的控制和优化。那些决定无法忍受的工人通常会跳下最近的园区大楼来结束生命，这促使富士康管理层安装了安全网，让不满的工人重新考虑自己的选择，并忍受被雇的耻辱。富士康生产了全球约
    40%的消费电子产品，如 `Playstations`、`iPhones`、`Nintendo 3DS` 和 `Xbox`。


    西方关于职场平等的观念——即孕妇和少数群体仅因为反歧视法就能获得优渥职位——似乎是理想且古老的，就像一个从未经营过成功业务的哲学家想象的经营方式一样；中国在各个方面都更高效，尽管它造成了巨大的痛苦。如果企业必须应对不断的投诉、诉讼和负面媒体标题的轰炸，就无法保持竞争力，这就是为什么他们通常会建立`人力资源
    (HR)` 部门来内部处理员工事务。


    ### HR 与职场控制


    `HR` 负责招聘和解雇，像思想警察一样微观管理员工的行为，以最大限度地减少雇主的法律责任。在经历了 `#MeToo` 恐慌之后（期间各种女性指控自己受到权势男性的骚扰），`Netflix`
    的 `HR` 部门引入了一项规定：男、女员工的目光接触每次不能超过五秒 26——因为这会“引发强烈的性欲望”。`HR` 能做到这一点吗？`HR` 可以随心所欲。


    `HR` 以其复杂的方案处理工作面试，这些方案专门设计为为了让潜在员工无法提起歧视诉讼。如果你曾不幸地经历过同一家公司连续六六场复杂程度日益增加的面试，结果却在没有任何理由的情况下被拒绝，现在你知道为什么了——你从根本上没有被考虑过该职位，但公司必须举行一场戏以减少负面媒体报道的概率。简历也是如此，它们通常被直接发送到垃圾桶，只剩下极少数——而这些又是通过“未知的占卜仪式”选出的。


    ### AI 招聘的承诺


    然而，如果由 `AI` 代替 `HR` 进行招聘呢？`AI` 不会有歧视或种族偏见（这据称是商人避免招聘少数群体的原因），`AI` 将完全完全的，并且总是找到完美的员工，无需任何
    `HR` 部门。`AI` 还可以筛选 `Facebook` 和 `LinkedIn` 资料来寻找即将出现的人才，并在其他人之前雇用他们，在他们还没意识到自己的价值之前就以廉廉的价格抢走所有最炙手的员工。`AI`
    能够为每个人找到合适的工作，确保没有任何人会挨饿或贫困，这将提振经济、消除失业并解决监狱再犯率问题。听起来像是一个美好的未来，对吗？


    `Amazon` 实际上尝试过制作完美的 `AI` 招聘官，但结果让工作的工程团队感到恐惧，项目很快被关闭——他们的数字大脑一直倾向于男性而非女性，显然没有办法在不完全破坏它的情况下进行调整。`Amazon`
    强调的是自动化，想法是高管可以向`神经网络` 输入 100 份或更多简历，以获得该职位的最符合要求的五个人 27。这种工具是所有科技巨头的圣杯，因为它可以消除许多与招聘相关的开销，但这个项目显示了我们必须倒退多少进步。现在，我们都都必须依靠朋友或亲戚来跳过
    `HR` 部门的反诉讼护城河，但这项工具承诺了一个光明的未来，在那里没有人需要写或读任何一份简历。


    ### 亚马逊神经网络案例研究


    通过使用一个包含十年简历（主要是男性简历）的训练数据集，`Amazon` 的人才寻找神经网络捕捉到了与生产力相关的数万个关键词。工具发现任何简历中出现“女性”或“女性的”单词会对负面影响该人的生产力。此外，来自女子大学的候选人受到了额外的惩罚。即使在工程师进行了调整使女性与男性平等，`神经网络`
    仍然能够绕过限制检测出简历是否属于女性，并无论如何进行惩罚。


    那么，工具是如何评估简历的呢？简历中常见的技能被赋予的重要性较低，例如编写代码的能力。侵略性的、男性化的词汇，如“执行”和“捕捉”，被赋予了更高的重要。


    ### 替代方法与挑战


    有趣的是，亚马逊的工具向不合格的候选人推荐了各种工作，这让工程师认为它在故障并给出随机结果。然而，公司现在使用的招聘流程依赖于正偏见，意味着我们预期过去表现更好，这很有道理，但没有给有才华但没经验的人。


    其他公司正在尝试不同的方法，主要通过分析面表情来观察候选人如何看待自己。`HireVue` 是一家初创公司，通过评估视频而非简历来揭示眼口周围微小肌肉产生的无意识表情中的信息。正如你现在可能发现的，这种分析是概率性的，在某些情况下有效；我们无法知道候选人是否经历过根管治疗，导致在视频面试当天出现痛苦的扭脸。这是一个引人注的想法，但还没有让面试过程完全自动化。


    `LinkedIn` 将是 AI 招聘的先锋，那么 `LinkedIn` 如何看这个问题？`LinkedIn` 招聘部门副总裁 `John Jersin`
    表示：“我绝对不会信任现在的任何 `AI` 系统独立做决定”，以及“技术还没有准备好”。好吧，这定论了。


    '
