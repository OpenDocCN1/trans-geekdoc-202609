    as movies, books, and news articles. After all, the media are there to inform
    us about the world, but they also have a hidden agenda—to make money. Movies and
    books can keep to the author’s message because they have several means of tie-in
    monetization, such as toys, cartoons, comics, and so on, but what about news articles?
