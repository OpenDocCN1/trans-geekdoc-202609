  trans: '

    血糖飙升被认为是糖尿病的主要预测指标（根据研究标题，称为“血糖反应”），这意味着身体必须费力来处理刚刚摄入的食物。苹果和榛果的血糖指数较低，但精制糖和碳酸饮料的很高；总的来说，越精制的食品对身体的冲击就越大。科学家对
    800 名糖尿病患者进行了血糖水平测量，直到获得 150 万次测量数据，随后，让 `AI` 在没有人类偏见的情况下处理所有这些数据。研究发现，肠道细菌是个人对不同食物反应的最显著因素。之后，记者有机会亲自尝试这套系统——`AI`
    的所有建议都是他讨厌的食物，而所有建议避开的食物都是他最喜欢的。


    同一款 `AI` 的商业版本虽然经过了简化，但旨在通过人餐盘的照片来识别食物并提供建议，以避免费琐的人工记录，但如果没有（最好通过医疗可穿戴设备）测量血糖水平，这一切都仅仅比随机猜测好一点点。在记者的情况下，他患有结石，而草莓等食物加剧了他的病情，但这些饮食
    `AI` 教练恰恰推荐了这些食物。


    目前，我们有像 `Paleo`（原始人饮食）和 `Keto`（生酮饮食）这样的通用饮食。`Paleo` 饮食认为加工食品含有许多惊喜，加工链中的每一个环节都可能在到达餐盘之前污染它。因此，`Paleo`
    饮食推荐食用“清洁”食物，即你确定如何生长、储存和加工的食物。如果可能，自己种植水果、蔬菜和禽类。`Keto` 饮食旨在通过避免精制碳水化合物或任何碳水化合物来应对血糖波动，这意味着不要面包、糖果、糖或碳酸饮料，每天只吃一点水果。发现
    `Keto` 饮食可以停止任何药物无法控制的癫痫发作；科学仍然不知道为什么会这样。


    # 第 19 章 – AI 与孤独


    似乎未来，随着我们通过屏幕而不是面对面互动，孤独将成为最大的问题。问题的出现是因为我们的大脑习惯于接收来自他人的潜意识信号，这些信号让我们对周围环境和社会背景更加敏感，使我们与现实建立联系；没有了这些信号，这个巨大的神经机制就会开始关闭。尽管现实世界中存在积极和消面的体验可能，但至少它们在真正意义上是真实的，并能引发某种成熟感；而在线点击诱体验的数字海洋旨在针对我们人格中的最低公约数，以触发恐惧、焦虑和恐慌，让我们尽可能长时间地留在网上。


    众周知隔离会扭曲思想，极度隔离会导致幻觉和恐慌发作，这就是为什么禁闭对即使是最糟糕的罪犯来说也是真正的惩罚。对加拿大学生进行的一系列感官剥夺 `[\[36\]](##_ftn36)`
    实验让他们戴上了一套复杂的可穿戴设备，旨在最大限度地减少大脑刺激：耳朵上的隔罩、眼睛上的眼罩等。几小时后，学生开始表现出不安，在那之后，他们开始疯狂产生幻觉，看到与人各异的怪异场景。他们的心理性能下降，无法摆脱自己正处于奇异梦境中的感觉，即使在恢复刺激后很长时间，房间和其中的物体仍在旋转或改变形状。没有人挺过两天的关口。


    这是因为人类大脑的设计是为了吸收和处理海量数据，任何数量上的短缺都会对其产生负面影响；它就像一辆如果减速就会故障的汽车，但零件会保持一段时间惯性，即使在汽车停止移动时也会散开。长时间的隔离导致了悲剧的人生，大脑通过构思精妙的幻想和详细的世界来逐渐适应孤独，通常在其中点缀了想象的视觉体验。当幼猴子从群体中被隔离后，30
    天后它们完全无法与同伴共同生活。

