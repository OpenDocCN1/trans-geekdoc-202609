- raw: 'While singularity has been envisioned before, prominent exponents of it, such
    as Ray Kurzweil, primarily focused on implanting the technology in our bodies,
    but George Hotz talks about implanting the idea in our minds. We should forget
    about bettering ourselves or making money to gain more creature comforts and simply
    yield to the super AI and start having faith in this ultimate New Age religion.
    In both Ray’s and George’s version of singularity, capitalism is an outdated mode
    of thinking we should get past to become a part of the collective, representing
    the ultimate socialist Utopia where cash flows freely, and we can live without
    having to work.


    Despite generating more wealth than any other form of societal organization in
    history and distributing it further than ever before, capitalism has been maligned
    by certain ideologies related to socialism as evil incarnate. Since AI will boost
    capitalism sky-high, tech giants might want to represent it as being godlike without
    actually being such to overcome this skepticism and resistance. Some pittance
    could also be distributed to the unwashed masses who adopt AI through universal
    basic income (UBI), again to sate socialist revolutionaries.


    The late Stephen Hawking, Elon Musk, and Mark Zuckerberg have all at some point
    referred to the idea of UBI as necessary for when AI inevitably leaves humans
    jobless. As stated previously, that is highly unlikely to happen as it’s humans
    who can create job openings faster than they can create and adopt AI that can
    fill them. One article  [\[19\]](#text00000.html#_ftn19) on Medium.com notes that
    installing AI into society will cause it comprehensive trauma and UBI will serve
    to cushion citizens from the economic crisis, stating that a 2020 US presidential
    candidate, Andrew Yang, already offered to introduce UBI. Both Republicans and
    Democrats actually agree on UBI; the former could see it happen without any new
    taxes while the latter would enjoy bragging about increased social benefits for
    minorities.


    Mark Cuban opposes UBI, calling it “the worst possible response” to joblessness  [\[20\]](#text00000.html#_ftn20)
    . AI Superpowers blog, which sells the eponymous book  [\[21\]](#text00000.html#_ftn21)
    written by Dr. Kai-Fu Lee, argues that governments should provide minimum basic
    services (healthcare, food, shelter, and education) to citizenry for free, and
    then cash to those people involved with helping provide minimum basic services
    to others who don’t want to get involved. In essence, only government/AI employees
    would be getting UBI as a form of salary.


    How would UBI differ from current welfare? The hidden claim behind UBI is that
    it is possible to find such an amount of cash that is adequate for everyone but
    looking at how real life plays out shows that is not the case. Young, single men
    are much more self-sustainable than most other categories, while categories like
    single moms require extra cash to deal with the burden of having a child raised
    by the state. How about disability or chronic health conditions, such as diabetes
    and mental illness? If we start considering age, sex, marital status, and overall
    health, all of a sudden, our UBI turns from being a simple, neat concept explainable
    in a few words to an administrative mess that goes back to being just the same
    kind of welfare we are already using within a few decades.


    Without welfare, the tribal instinct kicks in, and people start organizing themselves
    into loosely affiliated clans that inevitably want to displace one another and
    gobble up the resources, leading to balkanization. It is another one of those
    pesky instincts coming from the limbic system, and we have done so much to appease
    it, but where do we go from here?


    The romantic notion of replacing capitalism with some other form of governance
    more closely aligned with religion will ultimately be aimed at the lowest rungs
    of society, those who consider entrepreneurs and capitalists thoroughly evil and
    morally corrupt due to their desire to succeed. Everyone else can perceive the
    tremendous amount of wealth and productivity brought about by capitalism, wanting
    to participate and contribute to the economic growth willingly, but these discontents
    won’t be so easily appeased with just wealth; they’ll need something better.


    What is likely to happen is that technology will have more and more separate haves
    and have-nots, leading to widespread resentment coming from those who can’t relinquish
    outdated ideas or reconcile themselves with merit-based competency hierarchies.
    Those who can afford the latest iPhone or get involved in the IoT ecosystem will
    get all the benefits of AI that entails, while outsiders become a well of frustration,
    dragging everyone down and possibly causing riots that would make the elite huddle
    in their ultra-safe city fortresses turned into bunkers.


    Growing societal tension and strife would then be rectified by tech giants presenting
    AI as a universal combination of religion and capitalism, touted as a necessary
    part of our lives. If a tech giant strikes a deal with the medical and pharmaceutical
    industry, the faithful can be equipped with IoT hardware that will create additional
    medical data sources for the company while drip-feeding users with drugs and vaccines.
    Therefore, the perfect business plan for marketing AI is revealed:


        • present AI as a way to settle societal differences and make everyone equal,
    just like Facebook is already doing. To those who believe in capitalist ideas,
    AI should be presented as a way to increase productivity and personal wealth;
    to those who believe in religious concepts, AI should be presented as a benevolent
    “guardian angel” that’s in accordance with their religious teachings. Concept
    of AI can be spun every which way to align with the ideals of all subcultures
    in the society the same way Facebook is a news source for some and a source of
    entertainment for others.


        • use IoT devices that constantly scan the environment and gather data to
    report everything back to the mothership regardless of what the user wants, which
    is what Alexa is already doing. Shamelessly invade everyone’s privacy through
    outright surveillance and create a detailed, thorough privacy policy that explains
    nothing and is buried deep within pages of legalese. This will create data feeds
    to help the company analyze user trends and sell off data to advertisers while
    minimizing legal liability. Any responsibility for the intrusion of privacy should
    always be placed on the user.


        • medical devices have to undergo extensive clinical testing, but medical
    wearables don’t (see Apple Watch that’s being sold as a watch while being a fully
    functional medical wearable). Therefore, the IoT hardware should be sold in the
    form of a ring, bracelet, or necklace under the guise of jewelry or an accessory
    while claiming to provide some intangible medical benefit to the wearer. Certain
    body implants are also excluded from clinical testing, such as earrings and nose
    piercings, so one potential avenue of revenue would be creating IoT versions of
    such jewelry that could be installed in outpatient procedures or tattoo parlors.


        • pharmaceutical companies typically have ironclad monopolies on the market,
    allowing them to deny competition from bringing down the prices of medication.
    Striking a deal with one such cartel may be coupled with giving IoT medical wearables
    the capability of injecting the wearer with a drug needed to control a chronic
    condition, preferably insulin to treat diabetes. Being mostly a lifestyle illness,
    diabetes disproportionately strikes minorities, which would allow the company
    to present itself as socially conscious, hide from negative publicity by claiming
    to “just want to help”, and reap tremendous revenue from programs intended to
    help minorities battle chronic conditions, primarily Obamacare.'
