- raw: 'Knowing a person’s past and having access to digital records, the AI could
    take on the voice of an authority or just a relative the person will yield to.
    Failing that, the voice can simply be made to be as soothing as possible, lulling
    the limbic system into complacency. If that kind of system is added to the existing
    healthcare infrastructure, nurses and doctors get more time to deal with waves
    of paperwork and layers of administration. Coupled with the fact that chronic
    health problems require an entire network of carers to handle just one patient,
    we will most likely be needing AI—stat.


    An AI could be chatting with patients to keep them occupied while assessing their
    vocabulary, mental illnesses, or just general mood, producing a handy report for
    the doctor who can get the whole picture without wasting any time. The AI could
    automatically feed anonymized data to a database that would update it in real
    time, showing incidence in different kinds of strokes, injuries, cancers, and
    so on, which could help politicians develop health strategies as problems occur
    rather than twenty years after.


    # Chapter 20 – AI and Ethics


    Images and X-rays could be analyzed by this medical AI, which could peer into
    the image down to the very last pixel to see the earliest signs and the possible
    spread of disease. For those with phobias and anxiety, virtual reality goggles
    could be supplied where an AI would walk them through the trauma and give them
    the right instructions on how to handle the situation down to the tiniest detail.
    When used with video call software, such as Skype, AI could analyze bedridden
    patients’ faces to read into their inner world better than any human could. There
    should be informed consent by patients, who should at all times be aware that
    they are speaking with a machine rather than a human, but seeing how major social
    networks have been confessing they literally spy on users, and nobody batted an
    eye, it is likely patients would go with the program.


    Doctors have much leeway in how they handle patients and might have to resort
    to extreme measures to handle extreme cases. It is not malice or arrogance but
    the need to be efficient and avoid emotional attachment to the patient, both of
    which are accomplished by going with the quickest solution, usually some form
    of prescription medication. However, doctors also have a code of ethics that can
    best be summed up as “first, do no harm”. What if an AI was required to do some
    sort of an extreme measure to save a patient’s life? Would AI then need the same
    code of ethics doctors have to stop it from going mad scientist on hapless patients?


    According to Stuart Russell  [\[37\]](#text00000.html#_ftn37) , author of a book
    on AI, we are facing a future where smart machines absolutely have to be given
    a mandatory code of ethics as they can produce fake news to change our voting
    and spending behavior. They can already trawl social media to pick up on keywords
    to determine personality traits and then perform automated chatting, espionage,
    and blackmail. Stuart also created “Slaughterbots”  [\[38\]](#text00000.html#_ftn38)
    , a dramatized video on how tiny drones could be used for assassination in preparation
    for his petition to ban autonomous weapons in front of the United Nations. Capable
    of avoiding lazy swats, the drone can literally dive-bomb a target, delivering
    three grams of explosives right at the center of the forehead for instant death.


    While dramatic, the Slaughterbots video doesn’t explain how it is fighting off
    autonomous drones any worse than, say, fighting off swooping magpies that aggressively
    defend their nests during nesting season in Australia  [\[39\]](#text00000.html#_ftn39)
    . Humans have been dealing with murderous animals, including deadly insects and
    rampaging predators, for millennia, but drones would also presumably be extremely
    vulnerable to something like a nerf gun or a super soaker. It is easy to imagine
    humans making a sport out of hunting down these assassin drones while using special
    goggles to see them and wearing headcams to stream this first-class entertainment.
    Well, that is what humans do.


    So, drones could have ethical behavior baked into their programming, and the government
    could oversee ethical standards just like it does electrical and engineering ones.
    Isaac Asimov already thought of the idea of robots having ethical rules, namely
    with his three laws of robotics that can be summed up as: 1) don’t hurt human,
    2) obey human, and 3) preserve yourself. The problem arises when we think of traditional
    programming that ignores context and how AI could interpret any such ethical restrictions.
    If a human is taking a walk, should a smart machine forbid it because sunlight
    causes skin cancer? How about if a human wants to drive in a car or go skydiving?


    The question of ethical limitation can be posited as: how much power do we want
    machines to have over us? Too much and we are serfs in a prison of our own construction,
    so it appears that the answer is giving the machines enough consciousness to recognize
    when we are making bad choices but not enough power so they can stop us from making
    them. We want smart machines to be our advisors that will gather raw data, present
    it transparently, and crunch the numbers to a simple conclusion with such clarity
    that it stands up to every possible challenge but ultimately leave the choice
    to us. Even when they hurt, wrong choices typically lead to valuable lessons that
    last for a lifetime.


    # Chapter 21 – AI and Social Credit


    While the US might be leading in AI research, it is China that does most of the
    implementation on a large scale. China can leverage its massive population to
    both produce a large volume of engineers and train any sort of neural network
    as a diverse set of challenges. Just like we can see with the simplest products,
    the Chinese have no shame when it comes to copying what smarter people have already
    done and just toying with it using their extremely cheap workforce to make a working
    prototype and turn it into profit. In fact, big US companies might want to tap
    into the Chinese market just to sip from that fount of data and leverage the workforce
    to iterate on a product that would then be offered to the US market, under the
    auspices of the Chinese government of course.


    Google already made inroads into China as a search engine of choice from 2006-2010
    but gave up because of extreme censorship demands, hacking attacks, employee interrogations,
    and theft of intellectual property  [\[40\]](#text00000.html#_ftn40) . In 2018,
    Google decided to give it another try, which startled analysts who stated that,
    if anything, the Chinese government made the online environment much more hostile
    so there must be some really pressing concern that made Google so eager to enter
    China.


    According to Dr. Kai-Fu Lee, the former president of Google China, we are entering
    the age of AI where “data is the new oil, and China is going to be the new Saudi
    Arabia” and workers won’t simply be displaced by machines in a 1:1 ratio—entire
    industries will be automated and people depending on them disenfranchised. He
    calls for some form of income redistribution since companies employing AI will
    easily earn billions of dollars, so charging them extra tax seems like the most
    natural solution but argues against UBI as presented in the media.'
