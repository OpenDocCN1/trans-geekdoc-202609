    The solution to stress is always to consider all situations as challenges rather
    than sources of danger. This simple change in perspective makes us use our neocortex
    rather than the limbic system, developing higher brain functions rather than triggering
    the most basic survival instincts. In essence, seeing a yelling customer as a
    challenge rather than a threat may let you reply with a witty remark that interrupts
    his or her angry rant and perhaps even makes them burst out laughing, turning
    a stressful situation into a relaxed and fun one, where you can both work together
    to fix whatever problem there was without any stress.


    The study examined how people who don’t know about stress deal with it by eating
    caloric foods, such as cookies, that trigger a feel-good brain response just like
    a drug would; addiction to cookies can be purged from the brain using `Naloxone`,
    a medication that helps drug addicts kick their habit. It is not just that humans
    relieve stress this way because even rats exposed to extreme danger were eventually
    hooked on cookies or sugary water, which is the equivalent of soda or fruit juice.
    Who ultimately benefits from the general public being constantly stressed out?
    Companies that produce and market these stress-coping mechanisms, whether it is
    food, alcohol, medication, or some other vice that slowly ruins the body.


    In essence, our very existence involves small amounts of stress from time to time
    but being included in a thriving financial market mandates that we are constantly
    stressed out, or we won’t be giving our best to make and spend as much money.
    Big companies from media to food and entertainment have to whip us into a stress-fueled
    frenzy constantly, or we will just be happy with what little we have on our own
    and lead a peaceful life. Therefore, if tech giants decided they need the ultimate
    economic booster, they might announce a threat to end all threats—AI, a mystical
    and intangible perfect worker, advisor, lover, and warrior.


    We don’t have to take any heed of tech giants’ AI doom and gloom announcements—since
    now we have an alternative explanation as to why they would be pushing it so intensely.
    Humans have always adapted to life and will continue to do so, except now you
    know that it is all just a challenge that can be solved using higher functions
    that lie dormant in the brain, being constantly overridden by the limbic system
    when we are stressed out fearing for our lives, which makes us utterly predictable
    and ultimately complacent. There is no external factor that can mold our behavior
    against our free will, as long as we are aware of the possibilities and consciously
    build our own path in life.


    Looking at AI from a stress-free perspective of a human that doesn’t feel fear,
    anxiety, anger, or hunger, what is the chance it will replace said human? No chance
