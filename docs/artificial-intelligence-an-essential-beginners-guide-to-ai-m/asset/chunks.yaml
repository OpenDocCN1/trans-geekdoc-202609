    # 引言


    你即将读到的内容违背了所有关于人工智能（`AI`）的主流认知，并挑战了关于智能机器是什么或可以变成什么的所有结论。然而，揭开表象发现，这些观点几乎没有任何根据，一场宏大的骗局正在上演，但这种骗局并非本质上恶意的——一切都是为了钱。主流媒体对销量、收视和订阅的渴望已到了这种现在不得不提出一些每个人都能轻松理解的夸张言论。还有什么比
    `AI` 更好的主张呢？这个概念如此模糊，以至于它可以做任何事、完成任何事。随着媒体市场准入门槛的降低，一个在隔间里对着麦克风喷鼻的随机瑞典人获得的观看量可能比主流新闻媒体多出数百万。激进时代需要激进的措施，例如宣布
    `AI`，驱动基于恐惧的销售、收视和订阅。声称在其产品和服务中涉及 `AI` 的公司会获得更多资金和主流媒体的额外关注，而主流媒体正是这场圈谋的分子。想造砖吗？宣布你正在制造
    `AI` 设计的砖，媒体就会为你做营销。举办一场华丽但最终误导的演示，所有全球媒体都会关注你。


    科学家们想要被尊重，所以还有什么比更能让他们获得影响力和崇拜的方式呢：声称存在一种只有他们才能访问、理解和解释的 `AI`？如果这听起来像神职人员，那它确实如此。同样，科学家能产出的夸张言论越多，他们获得的资金就越多，获得媒体的关注也越多。


    这三个群体在兴奋与恐惧的无尽循环中相互推动。真正的 `AI` 产品什么时候才出来？没有人真的想制造一个，因为那会揭穿骗局，并证明技术尚未到位。我们现在拥有的只是非常简单的智能机器，可以处理数据、比较图像并执行简单的机械动作，例如搬箱子。其他一切都可能是永远不会实现的神话。


    所以，到底发生了什么？继续读下去就会发现。


