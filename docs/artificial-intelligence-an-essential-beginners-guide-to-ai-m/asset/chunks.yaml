  trans: '

    如果 AI 是神灵，那么祭司又是谁？来自各个领域的科学家们认为自己是唯一有资格解释神圣大脑那不可言之意志的人。2019 年，斯坦福大学成立了一个专门致力于
    AI 的新机构 34，但其中很少提到科学，而是充斥传教。该机构并没有将人类划分为利用 AI 进行竞争的国家，而是提出了一个统一人类的概念。在曾任 Google
    首席 AI 科学家 `Fei-Fei Li` 的领导下，斯坦福人类中心人工智能研究所计划成为 21 世纪的宗教。所以，这是一个由一个恰好是中国人的 Google
    员工运营的私人组织。


    宣传材料吹嘘着“AI 时代”的到来，声称 AI 将改变从法律到医学和文学的一切切。当然，斯坦福大学将成为全球立法者、政治家和企业者的活动中心，他们在做出任何涉及人类的决策之前，必须去那里寻求官方批准。该机构的职员工广泛代表了不同的国籍和肤色，旨在向人类在全球范围内进行合作是什么样子。


    从理论上说，AI 比人类更了解一切，但是这些科学家将解释它的意志，就像异教宗教的祭司一样。AI 将被描述为对公众危险的，这使得必须将其限制在斯坦福的地下库中，方便地隐藏所有的原始数据输入和决策过程，使其无法被独立分析。别担心，权力人员从未滥用过它，特别是当他们像这些斯坦福的天才们一样谦逊时。


    科技巨头是这种亲 AI 运动的幕后推手，难怪他们也想分一杯羹。2017 年，`Google` 将其营销转向“AI 优先”，并将研究部门重新命名为“Google
    AI”。其中也有一些反对的声音，例如斯坦福大学教授 `Steve Blank`，他说开发新技术的人通常不对其误用承担责任，并提到技术产生的影响往往超出其创造者的任何想象。


    # 第 18 章 – AI 提供的饮食建议


    饮食将是 AI 帮助提供有用信息的领域之一，这样每个人都能选择适合自己基因特征的菜谱。想象一下把白面包换成含有 40-60% 玉米和黑麦成分，虽然味道很奇怪，但最终解决了你的胀气、痤疮和皮疹问题。出于某种原因，改变饮食中的某些内容对健康问题非常有帮助，但我们通常不会有意识地考虑这种选择，或不知道如何处理。我们食用的许多食物与我们的需求无关，更多是习惯的力量，或者是由于过度接触压力而对慰藉食品的渴望。


    谈到食物，目前的市场状况需要冲动控制力低的无知客户来实现财务增长——看看 `gluten` 的结果吧。`gluten` 通常在自然界中作为一种小麦蛋白存在，像胶水一样保持种子完整；`gluten`
    在 20 世纪早期曾被分离并作为增稠剂投入商业用途——用于冰淇淋以防止其融化太快。分离出的 `gluten` 在人体消化道中像一颗微小的子弹，刺出会迅速愈合的孔；几十年来过度使用
    `gluten` 导致消费者出现严重的肠道问题和自身免疫性疾病。


    公司使用 `gluten` 是因为它让食物具有韧性，在不影响产品结构的情况下替代了更贵的原料，并延长了保质期。（注：原文此处存在大量重复句子，翻译已根据要求提取核心内容并精简。）

