- raw: 'It all comes down to getting votes, and all politicians ultimately vie for
    votes in the same way a tribe elder would—by celebrating the strength of the tribe,
    promising plenty of root hunting opportunities, having full storerooms of roots
    for everyone, and providing pretty clothes for women, fun musical instruments
    for men, and great toys for kids. Entrepreneurs aren’t satisfied by these empty
    promises since their entire goal was fundamentally changing how the entire tribe
    leads its life; all they got were meaningless honors and tokens of appreciation.
    So, what do entrepreneurs want? A fundamental change for the better.


    Successful people would give everything they have to help out the disadvantaged
    and never again have to deal with panhandlers begging for change. Why, aren’t
    they the dreaded 1% who live in mansions and use secret Illuminati handshakes?
    Don’t they gloat at the misery and degradation of the common man? Not at all.
    Successful people know the recipe to success and can repeatedly achieve it, but
    even if they gave away everything , they wouldn’t be able to make an appreciable
    dent in overall poverty. Simply put, we have no idea how to fix things like generational
    poverty, where broken parents engender insecurity in their children through domestic
    abuse, making them drop out of school, develop anti-social behaviors, and become
    broken parents themselves.


    All the best scientists put together can’t figure out how to prevent the formation
    of psychopathic behavior, even if the warning signs are spotted in time. If little
    Johnny starts mutilating animals, there is a strong chance he will get into serious
    trouble as he enters his 20s, but no amount of intervention can halt or reverse
    this course of action. Attempts by sociologists to delay the formation of such
    a personality, for example, by putting Johnny in a pleasant environment with caring
    parents, have even been found to aggravate the problem. The best our society can
    come up with is to wait for Johnny to start making problems and then put him in
    jail, meaning closed quarters with all the other ruffians and psychopaths, giving
    them plenty of free time to learn advanced tricks of the trade from one another.


    It appears personality is partly ingrained in the genetic code of each person
    and that the immediate sociological environment triggers the expression of an
    archetype, such as a warrior, poet or merchant, which is what Jung set forth as
    a fundamental psychological principle in his writings. We can’t stop the expression
    of behaviors, but we can put them to good use through capitalism. With the example
    of little Johnny, getting him employed as a butcher all of a sudden productively
    harnesses his destructive urges, gives him respectable employment, and makes him
    a valued member of the community. Ultimately, entrepreneurs all want to shape
    society, so everyone has a worthwhile job, but see politicians as the main obstacle.


    What if a certain group of entrepreneurs got together and started scheming how
    to displace politicians once and for all? By using technology, these upstarts
    would try to gather as much data on the behavior of the general public to understand
    how the mind works, why people vote the way they do, and so on. These tech giants
    would then try to create a digital nation populated by ethereal tribesmen, exact
    replicas of living people that would serve them without question, gloating at
    the imaginary clout they wield.


    All the warnings about AI taking jobs and governments needing to introduce UBI
    aren’t aimed at Joe Schmoe, truck driver, but at politicians who have no clue
    how technology works in order to make them yield to tech giants and acknowledge
    them as the ultimate tribe leaders. When a tech company announces their AI will
    take away jobs, they aren’t giving out a kind-hearted warning but are actually
    threatening politicians: “Our technology will take away your ability to get votes
    by harnessing our effort.” That is what it’s all about, control of the society
    through uncertainty, not merely having a machine that can climb stairs, move boxes,
    flip burgers, or fold laundry on its own.


    So far, AI has only proven itself useful in the narrowest sense of the word, such
    as when crunching data from resumes, making simple mechanical motions or comparing
    images, but hasn’t come anywhere close to human intelligence. By the looks of
    it, AI won’t be coming near human intelligence in the next 50 years—save for some
    revolutionary discovery that would make computers a million times faster than
    they already are. Right now, AI is like a shovel that tech giants say only they
    are allowed to build, inspect, and use, and according to their words, it is the
    best shovel anyone could ever dream of, so the tribe elder might as well scurry
    off into the jungle and let them lead the tribe. Why would they ever lie?


    # Chapter 17 – AI as One World Religion


    When you have this kind of context, you can finally understand the political aspirations
    of tech giant CEOs, most notably Mark Zuckerberg, who all but admitted to running
    for president in the future 2020 US elections  [\[31\]](#text00000.html#_ftn31)
    , his platform almost entirely focusing on UBI. In other words, free roots for
    everyone. So, how well would a country managed by Mark fare? Let’s see how he
    is managing his own company for clues.


    On March 13 2019, Facebook, Instagram, and WhatsApp had a massive worldwide outage  [\[32\]](#text00000.html#_ftn32)
    . Depending on users, some functions were available, but most others were down.
    Websites that use Facebook accounts for logins also had trouble with those functions.
    It took over a day before everything was in order, with the official explanation
    being “server configuration change,” which doesn’t exclude hackers since they
    too can change server configuration.


    Now imagine Facebook’s websites being the only ones existing on the internet,
    and you can see just how unfeasible that would be. One tech giant controlling
    much of the internet would make it extremely vulnerable to hacking attacks, but
    they will be pushing for the monoculture anyway because it is about political
    control, not increased productivity and user needs. This is quite like religious
    zealots talking about their religion as “the only right way”. Technically a competitor
    to Google, Microsoft is adopting some of the same tactics and even some of the
    same software.


    In 2018, Microsoft announced that its Edge browser was going to be powered by
    Google’s Chromium engine, the same one used in Google Chrome. So users could pick
    between Edge or Chrome but would essentially get the same thing no matter what.
    Website creators would predictably take the easy way out and just optimize websites
    for Chromium, making other browsers less enjoyable to use and gradually nudging
    users into using Chrome.


    The web-based Skype application recent update already made it work only in Edge
    and Chrome, proving that tech giants are more than willing to lock everyone else
    out of the fun. But hackers who tinkered with other browsers proved that the same
    update could be applied to other browsers if they falsely identify themselves
    as Edge or Chrome  [\[33\]](#text00000.html#_ftn33) . It is not that Microsoft
    can’t make things work in Firefox or Safari; it’s that it won’t just to create
    a monopoly. That is particularly ironic since Skype is marketed as a way to bridge
    the gap across platforms and continents but actually funnels users into a monoculture
    world, where only those apps by the same company work seamlessly. This kind of
    behavior happened with Microsoft, and it will happen again, fueled by the executives’
    fear of losing market shares.'
