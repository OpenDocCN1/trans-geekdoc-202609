  trans: '

    这一切归根结底是为了选票，所有的政治家最终争取选票的方式与部落长老无异——通过庆祝部落的实力，承诺充足的采集根类机会，让每个人都有充足的根类储藏，并为女性提供漂亮的衣服，为男性提供有趣的乐器，为孩子们提供很棒的玩具。企业家对这些空头承诺并不为满意，因为他们的全部目标从根本上是为了改变整个部落的生活方式；而他们得到的只是毫无意义的荣誉和谢意。那么，企业家想要什么呢？他们想要根本性的好转。


    成功人士会倾尽所有去帮助弱势群体，并且再也不用面对讨要零钱的乞丐了。难道他们不是那些住在豪宅里、使用光芒会秘密手势的令人生畏的“1%”精英吗？难道他们会对普通人的痛苦和堕落幸灾乐祸吗？完全没有。成功人士知道成功的秘诀并能反复实现它，但即使他们送出一切，也无法对整体贫困产生实质性的影响。简单来说，我们根本不知道如何解决代际贫困这类问题，即破碎的家庭通过家虐给孩子带来不安全感，导致他们辍学、产生反社会行为，并最终成为破碎的父母。


    最顶尖的科学家聚在一起也想不出如何防止精神变态行为的形成，即使及时发现了预警信号。如果小约翰尼开始残害动物，他在进入 20 多岁时极有可能会陷入严重的麻烦，但任何干预都无法停止或扭转这一过程。例如，社会学家试图推迟这种人格的形成（通过将约翰尼放在一个有关爱的父母的良好环境中），结果被发现这反而加剧了问题。我们社会能想出的最好办法就是等约翰尼开始制造麻烦，然后把他关进监狱，这意味着和其他所有的恶混和精神变态者待在密闭的空间里，让他们有大量的空闲时间互相学习高超的行当。


    看来性格部分植根于每个人的基因密码中，而直接的社会环境则触发了原型的表达，例如战士、诗人或商人，这正是荣格在其著作中提出的基本心理学原则。我们无法阻止行为的表达，但我们可以通过资本主义让这些行为发挥良用处。以小约翰尼为例，突然雇佣他当一名屠夫，可以有效地生产性地利用他的破坏欲望，给他一份体面的工作，并让他成为社区中有价值的成员。最终，企业家们都想塑造社会，让每个人都有一份值得的工作，但他们将政治家视为主要的障碍。


    如果某些企业家聚在一起，开始策划如何一劳永逸地取代政治家呢？通过技术，这些新秀会尝试收集尽可能关于大众行为的数据，以理解大脑是如何运作的、人们为什么以那样的方式投票等。这些科技巨头随后会尝试创建一个数字国家，其中由虚幻的部落民组成，这些族民是活生人的精确复制品，将毫无疑问地为他们服务，并对他们掌握的虚拟权力幸灾乐祸。


    所有关于 AI 取代工作和政府需要引入全民基本收入（UBI）的警告，并不是针对普通人乔·史密（司机），而是针对那些完全不知道技术如何工作的政治家，为了让他们屈服于科技巨头并承认他们为最终的部落领袖。当一家科技公司宣布他们的
    AI 将夺工作时，他们并不是在发出善意的警告，而是在威胁政治家：“我们的技术将通过利用我们的努力，夺走你们获得选票的能力。”这就是核心所在：通过不确定性对社会进行控制，而不仅仅是一个可以自己爬楼梯、搬箱子、翻汉堡或折叠衣服的机器。


    到目前为止，AI 仅在最狭义意义上证明了自己的实用性，例如处理简历数据、进行简单的机械动作或比较图像，但远没有接近人类智能。目前看来，未来 50 年内 AI
    不会接近人类智能——除非有某些革命性的发现，让计算机运行速度比现在快百万倍。现在，AI 就像一把铲子，科技巨头声称只有他们被允许制造、检查和使用，而且根据他们的话，这是任何人梦梦过的最好的铲子，所以部落长老直接跑进丛林，让他们带领部落就好了。他们为什么要撒谎呢？


    # 第 17 章 – AI 作为一种世界宗教


    当你拥有这种背景时，你终于可以理解科技巨头 CEO 们的政治诉求，最有名的马克·扎克伯格，他几乎承认了将在未来 2020 年美国大选中竞选总统[31]，他的政纲几乎完全集中在
    UBI 上。换句话说，就是给每个人免费的根类。那么，由马克·扎克伯格管理的国家表现如何呢？让我们看看他是如何管理自己的公司来寻找线索。


    2019 年 3 月 13 日，Facebook、Instagram 和 WhatsApp 发生了全球性的大规模宕机[32]。根据用户情况，某些功能可用，但大多数其他功能失效了。使用
    Facebook 账户登录的网站在这些功能上也遇到了问题。过了多天，一切才恢复正常，官方解释是“服务器配置更改”，这并不排除黑客，因为黑客也可以更改服务器配置。


    现在想象一下 Facebook 的网站是互联网上唯一的网站，你就能看到这将是不可行的。一个科技巨头控制大部分互联网会使其极易受到黑客攻击，但他们仍会推行单一文化，因为这是政治控制，而不是提高生产力和满足需求。这非常像宗教狂热分子把他们的宗教称为“唯一的正确途径”。


    在技术上是谷歌的竞争对手，微软正在采取类似的策略，甚至是相同的软件。2018 年，微软宣布其 Edge 浏览器将由谷歌的 Chromium 引擎驱动，这与
    Google Chrome 使用的引擎相同。因此，用户可以在 Edge 或 Chrome 之间进行选择，但无论选哪个，本质上是一样的。网站创建者会意料之中地走捷径，只为
    Chromium 优化网站，使其他浏览器变得难用，并逐渐引导用户进入 Chrome。


    网页版 Skype 最近的更新使其只能在 Edge 和 Chrome 中运行，证明了科技巨头完全乐意将其他人排除在外。但修改其他浏览器的黑客证明了，如果这些浏览器伪装成
    Edge 或 Chrome，同样的更新也可以应用于它们\[33]。这并不是微软不能让程序在 Firefox 或 Safari 中运行；而是他们为了制造垄断而这样做。这种行为发生过微软身上，也将再次发生，受高管对失去市场份额的恐惧驱动。

