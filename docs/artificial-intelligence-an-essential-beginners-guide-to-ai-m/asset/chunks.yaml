  trans: '

    边缘系统并非仅在生命受到危险时才激活，它不断受到企业广告的轰炸，因为这些企业意识到所有的购买和消费决策都源于它。声音、视觉和嗅味都代表了正向强化，旨在诱导边缘系统中处理愉悦、成瘾和情感体验的区域，并创造出终身客户。公司已经在利用这些曾经对我们生存至关重要的核心、休眠行为来获利。然而，这类行为还有很多，谁能先定义它们，谁就将获得不可思议的财富。


    所有的营销归结底都是找出我们大脑中原始部分潜伏着什么力量，并直接作用于它们以覆盖意识形态。营销 AI 也不例外，你已经已经看到它如何被吹称为进行战争、杀戮、消除饥饿和孤独的完美工具，而这一切都直接指向边缘系统。计算机程序员也必须处理边缘系统，主要通过使用所谓的
    `UX` 或“用户体验”，这试图找出用户在使用界面过程中何时会产生非理性的愤怒、愉悦或痛苦。


    有趣的是，大脑和计算机结构之间存在许多相似之处。边缘系统对应于计算机中的核心组件 `kernel`（内核），而新皮层就像操作系统。所以，只要你按下电脑的电源按钮，`kernel`
    就会启动并协调其他所有部分，引导你可以操作的操作系统；`kernel` 本身是无法访问的，因此免受篡改。普通计算机用户并不知道有 `kernel` 这种东西，也不知道它是干做什么的，因为那个哒哒啪嗒的桌面环境运行得很好。


    可以认为，计算机之所以设计成人类大脑结构是有原因的——它是世界上最完美的工具。我们正在使用大脑处理琐碎的任务，甚至不知道它是如何运作的或为什么，这就像普通人只是在他们的台式电脑上玩
    `Solitaire`（纸牌游戏）一样。AI 预计将从一个看起来像人类大脑的数字安排产生，这并不奇怪；我们还能用什么呢？


    这意味着 AI 将使用人类大脑的数字副本，在瞬间跳过数百万年的进化，教导我们大脑是如何运作的，以及我们下一步应该关注何处。由于它不需要为生存而挣扎，这意味着
    AI 将没有边缘系统，使其能够完全清晰地进行思考，而没有会遮蔽我们判断的生存冲动，从而带给我们这些微小大脑无法理解的科学和心理突破。


    这些只是深埋在我们脑中、每天受环境影响的某些迷人行为。关于边缘系统有很多有誉的学术文献，但它们都是那么枯燥得难以忍受且催睡——在你眼前看到这一切发生感觉完全不同，不是吗？最值得注意的是，停止这些冲动极其困难，但如果我们只使用自由意志（大致定义为“对选择的意识”），这是可以实现的。


    所有的宗教和教育系统都是为了告诉我们不必服从这些冲动，至少这是它们最初的初初衷；随着时间的推移，所有支持新皮层的系统都会崩溃并开始影响边缘系统，因为后者更快且更容易顺从。这削弱了我们的自由意志，因为它强化了我们的原始冲动，最终导致我们变得安逸并毁灭。了解大脑是如何运作的是至关重要的。


    ## 创建 AI 的动机


    所有的宗教和教育系统都是为了告诉我们不必服从这些冲动，至少这是它们最初的初初衷；随着时间的推移，所有支持新皮层的系统都会崩溃并开始影响边缘系统，因为后者更快且更容易顺从。这削弱了我们的自由意志，因为它强化了我们的原始冲动，最终导致我们变得安逸并毁灭。了解大脑是如何运作的是至关重要的。


    我们正在使用大脑处理琐碎的任务，甚至不知道它是如何运作的或为什么，这就像普通人只是在他们的台式电脑上玩 `Solitaire`（纸牌游戏）一样。AI 预计将从一个看起来像人类大脑的数字安排产生，这并不奇怪；我们还能用什么呢？


    这意味着 AI 将使用人类大脑的数字副本，在瞬间跳过数百万年的进化，教导我们大脑是如何运作的，以及我们下一步应该关注何处。由于它不需要为生存而挣扎，这意味着
    AI 将没有边缘系统，使其能够完全清晰地进行思考，而没有会遮蔽我们判断的生存冲动，从而带给我们这些微小大脑无法理解的科学和心理突破。


    这些只是深埋在我们脑中、每天受环境影响的某些迷人行为。关于边缘系统有很多有誉的学术文献，但它们都是那么枯燥得难以忍受且催睡——在你眼前看到这一切发生感觉完全不同，不是吗？最值得注意的是，停止这些冲动极其困难，但如果我们只使用自由意志（大致定义为“对选择的意识”），这是可以实现的。

    '
