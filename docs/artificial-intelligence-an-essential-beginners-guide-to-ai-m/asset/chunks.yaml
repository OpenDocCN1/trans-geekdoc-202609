- raw: 'If AI is a deity, then who are the priests? Various scientists from all fields
    see themselves as the only ones worthy of interpreting the ineffable will of the
    divine machine brain. In 2019, Stanford University unveiled a new institute dedicated
    to AI  [\[34\]](#text00000.html#_ftn34) , but there was little mention of science
    and a whole lot of proselytizing. Rather than dividing humanity into nations that
    compete using AI, the institute presented the idea of a unified humanity. Led
    by Fei-Fei Li, Google’s chief AI scientist at one moment, the Stanford Institute
    for Human-Centered Artificial Intelligence is slated to become the religion of
    the 21 st century. So, a private organization run by a Google employee who just
    so happens to be Chinese.


    Touting the coming of “Age of AI”, promotional materials boast that AI will transform
    everything from law to medicine and literature. Of course, Stanford University
    will be the center of worldwide activity for lawmakers, politicians, and entrepreneurs,
    who will have to go there to ask for official approval before making any decision
    concerning humans. Comprised of staff broadly representing different nationalities
    and skin tones, the institute is meant to show humanity what it is like to cooperate
    on a global scale.


    In theory, AI will know everything better than humans, but it is these scientists
    who will interpret its will, just like priests of pagan religions. AI will be
    described as being dangerous to the general public, which would necessitate its
    containment in the Stanford vaults, conveniently hiding all the raw data inputs
    and decision-making processes from being independently analyzed. Don’t worry,
    people in power have never abused it, especially when they were as humble as these
    Stanford prodigies.


    Tech giants were the ones behind this kind of AI-friendly movement, so it is no
    wonder they too want in on the action. In 2017, Google pivoted its marketing to
    be “AI first”, rebranding the research department as “Google AI”. There are dissenting
    voices, such as Steve Blank, a professor at Stanford, who said that people who
    develop new technology typically aren’t held liable for its misuse and mentioning
    that technology always has consequences beyond anything its creators imagine.


    # Chapter 18 – Dietary Advice by AI


    Diet is going to be one of those areas where AI helps dish out useful information
    so each person can step up to the plate that fits him or her genetically. Imagine
    replacing white bread with a 40-60 corn and rye one that tastes weird but finally
    solves your bloating, acne, and rashes. For whatever reason, changing something
    in the diet helps tremendously with health problems, but we typically never consider
    the option consciously or know what to do about it. Plenty of foods we are eating
    have nothing to do with our needs but are rather a force of habit or a yearning
    for comfort food due to excess exposure to stress.


    When it comes to food, current market conditions require uninformed customers
    with low impulse control to achieve financial growth—just look at how gluten turned
    out. Typically found in nature as a wheat protein that functions like glue to
    keep the seed in one piece, gluten was isolated and put into commercial use as
    a thickener sometime in the early twentieth century—used in ice creams to stop
    them from melting too quickly. Isolated gluten acts like a tiny bullet in the
    human digestive tract, poking holes which heal up quickly; overuse of gluten over
    decades leads to severe intestinal problems and autoimmune diseases in consumers.


    Companies used gluten because it made foods chewy, replaced more expensive ingredients
    without the product falling apart, and increased shelf life. Food safety inspectors
    didn’t find any problem with gluten because they were typically underfunded and
    overworked; without any evidence to the contrary, gluten was allowed on the market,
    which opened the floodgates to wanton experimentation with all sorts of substances.
    Meanwhile, a typical consumer sees a cheaper ice cream that melts slower, and
    tastes chewier than the competition because it has gluten; who cares if it’s the
    real thing or it harms health? It was only about a century later that the ruse
    was discovered and everyone started freaking out when the limbic system kicked
    into high gear, but by that time, food companies had made a fortune selling inferior
    products under the guise of quality .


    What is interesting about gluten is that it has a different impact on different
    individuals, with exposure in youth, apparently, activating certain genes that
    lead to health problems later in life. It is hard to speak in certainties when
    it comes to gluten because the human digestive tract is so complex that elucidating
    just one process in it deserves—and usually gets—a Nobel Prize. In the end, use
    of gluten in foods turned out to be an extensive experiment on the general public
    devised by food companies, sanctioned by the government, and funded by the oblivious
    consumer driven by the limbic system. Why? Because it increased economic growth
    through an increase in food sales and consumption.


    There is no reason to believe the deployment of AI in any society will fare any
    better than the deployment of gluten. However, gluten could be blended seamlessly
    with other ingredients, but AI will stick out like a sore thumb, mandating that
    we willingly accept and adore it from the start. That is another explanation as
    to why so many influential people have started advocating for AI, despite it being
    well off in the future. Mass adoption of AI will require wholesale enlightenment,
    total turnover in how companies do their business or both ; most likely neither
    will happen but let’s examine the possibilities regardless.


    According to a New York Times article  [\[35\]](#text00000.html#_ftn35) , where
    the reporter, also a cardiologist, used an app to log everything he ate, and how
    much he slept and exercised over fourteen days, AI can make us seriously doubt
    what we have been eating all our lives. Alongside a sensor that tracked his blood
    sugar levels, the reporter also had his stool analyzed for gut bacteria to see
    what was inside his intestines; different people have different bacteria in their
    gut, with each strain liking different foods.


    Most food studies are observational and voluntary, meaning they rely on participants
    to report what they have been eating over the years correctly. The best possible
    diet study results show correlation, but we have no idea about cause and effect,
    except when it comes to salt—excessive use over the years definitely increases
    blood pressure. Who funds the most dietary research? The same food industry that
    is interested in peddling as many cheap and stable replacements for genuine ingredients
    it can find. Is there an optimal diet for all people? We have no idea, which is
    why AI is meant to sift through all the data of people with a similar genetic
    profile, analyze how they fared on certain diets, and bring us probabilistic recommendations.


    Everything from family history to toxins in the environment and gut bacteria plays
    a role in how the body processes foods. From time to time, there is a landmark
    study with promising results that tries to isolate that one key factor, but then
    it gets challenged, and conclusions are softened up. One such study was “Personalized
    Nutrition by Prediction of Glycemic Responses”, which looked at how blood sugar
    levels of participants spiked in response to 52,000 of the most popular foods,
    including ice cream.'
