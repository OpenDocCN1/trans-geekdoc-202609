- raw: 'Your entire worldview with regards to AI has likely been molded by media,
    such as movies, books, and news articles. After all, the media are there to inform
    us about the world, but they also have a hidden agenda—to make money. Movies and
    books can keep to the author’s message because they have several means of tie-in
    monetization, such as toys, cartoons, comics, and so on, but what about news articles?
    Newspapers auction off page space and hustle subscriptions, but websites peddling
    news almost exclusively rely on advertisements, meaning shoving ads at visitors,
    with each view earning a small fraction of a cent.


    Not knowing how to create quality content and make money off of it, news websites
    that survive off of ad views have to create what is known as clickbait, instantly
    consumable articles with flashy headlines and little substance. Writers of such
    content are pushed to drive as much traffic to the website using any description
    that is not an outright lie, which often burns them out very quickly. There is
    entire machinery that produces clickbait on a steady basis, and once the curtain
    is lifted, you will never again enjoy 90% of “news” on the internet.


    Web users appreciate neatly sorted information, making countdown lists a great
    clickbait method that provides a sense of anticipation that there is going to
    be a grand reveal at the end, which usually doesn’t live up to expectations. For
    example, a clickbait headline could boast about “12 best rhubarb uses” or “7 worst
    shows on the TV”. There could actually be useful, relevant information in those
    two articles, but the way their headlines are written suggests the hosting website
    doesn’t care about providing value to readers but simply wants their clicks. Besides,
    calling something “top” or “worst” is highly subjective and tells less about the
    topic and more about the author, who is going to burn out and disappear quickly
    anyway.


    Anything that arouses the most extreme of emotions, such as fear or anger, is
    a welcome addition to a clickbait headline. We don’t have much control over those
    emotions since their evolutionary purpose was to keep us alive by commanding our
    attention; meeting a tiger in the wild will either make you want to run away or
    poke it with a sharp stick, but in both cases, you will be hyper-focused on the
    tiger. Hijacking this circuitry to grab the attention of visitors is best done
    using clickbait descriptors, such as “predator”, “war”, “deadly”, “smash” and
    so on. This triggers the ancient survival hardware in visitors’ brains and makes
    them glued to the website, coming back for another hit of fear and anger. Provoking
    disgust works too—since we are disgusted by things that would make us sick, such
    as foul smells that indicate rotten food and poisonous animals. Again, hyper-focus
    brain circuitry in action.


    Riding popular trends is great for clickbait, so a headline could be using a celebrity
    name that is popular at a given moment to boost its traffic. Elon Musk was in
    nearly every clickbait headline in 2018, especially since he is an eccentric entrepreneur
    that shows little restraint. Using Donald Trump’s name works too, as long as it’s
    remotely true and doesn’t open the website to lawsuits for outright lying. Movies,
    toys, urban legends—anything that’s talked about by others is worth cramming into
    a headline as it increases the chances of the article scoring high in search engine
    results, which is a vaunted source of traffic for every clickbait website out
    there.


    Uncertainty in the headline is another favorite clickbait method. Curiosity is
    an extremely strong survival urge that helped us find new sources of food, so
    a clickbait headline hijacking this part of our brain could state “you won’t believe
    what happened next” or “you’d never imagine what he said next.” Often enough,
    the article doesn’t actually show what happened or was said next, but it doesn’t
    matter because the website got your click and earned that blasted fraction of
    a cent. Questions in headlines have the same purpose and can almost always be
    answered by “no” without even reading the article or knowing anything about the
    topic.


    Let’s combine these four most common clickbait methods and make an article headline,
    such as “You won’t believe these 12 deadly rhubarb uses by Elon Musk”. It is a
    completely made-up headline, but it does arouse attention, doesn’t it? Like a
    great movie, it takes the reader on a rollercoaster of emotion and simply commands
    clicks; whether the content justifies the click is another story entirely. Buzzfeed.com
    happens to be the undisputed “King of Clickbait”.


    What happens when these websites get hold of content related to AI? We get a mishmash
    of all the most exaggerated and incredulous details that are meant to simply make
    you click the headline but not actually understand the content so that tomorrow
    you will be coming back for more. Over time, and with tens of thousands of clickbait
    websites constantly churning out content, we get a writhing, seething mass of
    total nonsense that threatens to send internet denizens into a state of total
    panic. Boiled down and spread from one person to the next virally, this universe
    of nonsense becomes AI myths, which are easily repeatable, explainable yet unproven,
    unsourced, and perfectly enraging statements.


    It is tempting to believe the production of AI myths is a coordinated action,
    but that would be giving the clickbait producers and internet denizens too much
    credit. Reality is much more layered than we expect and often has the prime causes
    of any given result obscured by time and anonymity of initial actors. Layered
    incompetence and greed are much more likely and observable causes of AI myths
    than some nebulous entity working from the shadows.


    The human brain is a great tool, sharpened by constant use and adaptation but
    also one that, at times, becomes too efficient at doing certain things, turning
    passive and jumping to conclusions even when that turns out to be harmful. This
    reflex stemming from the limbic system helped a lot when it came to survival but
    today serves little purpose—except to fuel clickbait websites. The solution is
    always to take things with a small dose of skepticism until they are abundantly
    proven rather than taking them at face value.


    Now let’s take a look at some of the most popular AI myths and unravel them:


    ### AI will be used in combat


    Metro.co.uk brings us “World War 3 fears as Russia unveils army of murderous robots
    the size of horses”  [\[1\]](#text00000.html#_ftn1) . Note the keywords in the
    heading: “war”, “fear”, “army” and “murderous”, all meant to provoke fear and
    anger, associating them with robots. There is a curious mention of horses, though
    the article doesn’t explain why horses were chosen as a reference point; this
    is the enticing curiosity part of writing clickbait headlines as mentioned above.


    As expected, article content doesn’t live up to the headline and doesn’t even
    link to the official demo  [\[2\]](#text00000.html#_ftn2) . It is a small tank
    where a soldier aiming his gun at a location also has the vehicle aimed at the
    same location, probably to provide flanking fire. The tank looks nothing like
    a horse but is armed with two grenade launchers and a machine gun. Aerial drones
    flying in squads help spot targets behind cover.


    Armies already have enough conventional weaponry to destroy the entire world several
    times over, though you probably won’t take comfort in that fact. Nuclear weapons
    alone can wipe out every trace of life on Earth, save deep-water creatures, bacteria,
    and cockroaches, who can survive headless for weeks  [\[3\]](#text00000.html#_ftn3)
    . Fun fact: cockroaches don’t actually have a brain, so one scientist decapitated
    them under a microscope and sealed the wound with wax; they survived due to nerve
    clumps throughout their body that replaced the lost head and let them react as
    if alive.'
