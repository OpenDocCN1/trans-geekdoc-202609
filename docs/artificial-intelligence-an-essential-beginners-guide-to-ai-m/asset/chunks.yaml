    Things will change with the advent of AI trucks, but it is productivity that matters,
    and those willing to put in skilled work will always have a way to earn an income,
    though it might not resemble the steady careers of yesteryear. No jobs will be
    “lost” because jobs aren’t found in the first place, and no jobs will be “taken”
    because they don’t exist in a limited quantity; they are created by market demand,
    and as the market grows so will the number of job opportunities for everyone,
    including AI trucks.


    With advanced dilapidation, AI might cease to function as intended, at which point
    driving assistant specialists can take turns manually operating the truck, except
    that they are now legally covered for work hours’ restrictions because technically
    the AI was driving. All market solutions for existing problems always loop back
    to the same old solutions because they work, and in the case of vehicles, it has
    to have a human on board; it is just that humans will now get paid more if they
    can learn how to handle an AI truck. By the way, every business imaginable scoffs
    at new technology, so unless the new solution flaunted in the media provides entrepreneurs
    with more legal maneuvering space or gives them more funding, just disregard it.


    Stats on AI deployment in startups reveal the whole picture—the definition of
    AI is so muddled that around 40% out of 2,830 EU startups don’t use any AI but
    brag about doing so as that gives them 15% more funding from investors [[8]](#text00000.html#_ftn8).
    Simply mention that your startup will be using “AI-reinforced machine learning
    supported by Big Data to make the world a better place”; it sounds great but means
    nothing, giving you a chance to get extra funding and media attention without
    added work or obligations.


    Of course, the article mentions none of this context but simply slaps on a graph
    and calls it a day. A graph wouldn’t lie to us, would it? You are not meant to
    understand the nuance of what is going on—simply give the website your click,
    absorb the underlying message of fear, and move on to the next headline. “Deadly
    rhubarb uses”—what the headline should be saying is, “If AI does get made and
    gets any traction, AI-driven trucks will open up more job opportunities for everyone”
    but optimism and measured portrayal of facts doesn’t attract clicks fueled by
    fear and anger like clickbait does.


    ### AI will be a romantic partner


    This myth is particularly effective on women in their late 30s and early 40s who
    haven’t started a family and are now wondering, “Where have all the good men gone?”
    Men are afflicted by a lack of intimacy too, but since they are by nature solitary
    and used to doing things on their own, they can survive with incidental physical
    relationships without having to form a steady connection. One Wired article titled
    “Falling in love with AI virtual assistants: a creepy love affair nearer than
    you think” [[9]](#text00000.html#_ftn9) uses only one clickbait keyword—“creepy”.


    The mainstay of the article is `Her` [[10]](#text00000.html#_ftn10), a movie about
    a writer who feels lonely, buys an AI (s)assistant, and falls in love with her.
    Being able to share what he thinks and feels with someone, even if it is an AI,
    actually makes him happier and more productive at work.


