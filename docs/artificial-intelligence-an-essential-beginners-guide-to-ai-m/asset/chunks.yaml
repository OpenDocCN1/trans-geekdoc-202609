- raw: 'Scaled up, ContentID simply doesn’t work because it is tilted towards shielding
    Google from lawsuits, not making sure copyright owners or YouTube users get their
    needs met. There simply needs to be a human at the helm reviewing copyright claims
    and either approving or dismissing them; there is no conceivable way AI can ever
    take this duty over. YouTube alone has something like 3,000 hours of video uploaded
    every second, with no kind of support staff to review it all for copyright infringement
    and community guidelines adherence; it is relegated to the hive-mind intelligence,
    whether it’s humans or machines.


    Google tried introducing a model of YouTube Heroes as a way to incentivize users
    to essentially become unpaid content reviewers, which is, in theory, a good idea,
    but was mercilessly panned by all YouTube content creators as being tyrannical
    and exploitative. If Google had AI or anything close to it ready for deployment,
    it would have been deployed already on YouTube; if ContentID is the vaunted AI,
    we can see it is a disaster. This is only copyright claims, a nebulous right that
    AI is woefully inadequate in handling, yet we are supposed to think that AI is
    market-ready and coming to take our jobs.


    Neural networks inhabiting IoT devices and phoning back home to report on the
    real world and actions of humans in it can be said to represent AI sensory organs.
    These tiny robotic units can feed massive quantities of real-time data to the
    AI, letting it simulate reality and attempt to predict future trends. We all impact
    one another and the tiniest of our actions have long-reaching consequences that
    we typically ignore, but an AI that has insight into all the IoT device data feeds
    in a tightly controlled environment devoid of free will would be able to be omnipresent
    and omniscient.


    Here is where we embark on a strange journey into deep subconscious thoughts of
    humans, especially those related to obedience towards a higher status person.
    If a command is given by another human, we assess his or her status relative to
    ours and comply if it is higher; a deity is automatically afforded ultimate respect
    and presumed infallible. Therefore, if a tech giant wanted to push total acceptance
    of IoT and the intrusion of privacy that involves, the best way would be to present
    an AI crunching all the data feeds from hardware as a godlike entity. That doesn’t
    mean any of it would be actually true but simply that the owner company would
    market it that way to achieve total market penetration and exclude the competition
    under a literal accusation of heresy.


    The idea is that this kind of AI would be welcomed with open arms, as it could
    properly arrange every little thing we are doing in our daily life to make it
    better, provided we don’t interfere with it in any way. From finding perfect employment
    to predicting future crime and being the perfect partner for everyone, such an
    AI would, in theory, be able to run an entire metropolis like clockwork, fixing
    problems before they appear. Note that this is still science fiction, but every
    tech giant that wants more IoT devices in the open to gain more data feeds will
    sooner or later tout this kind of arrangement as inevitable and positive, with
    AI serving the role of a benevolent god. For some people, this is already the
    case.


    George Hotz is a true believer in AI and its ability to transform the future,
    despite already having a successful self-driving car venture and knowing the inherent
    limitations of AI—namely that it is probabilistic rather than deterministic. Pay
    attention to how closely what he is saying in a 2019 article from The Verge titled
    “Comma.ai founder George Hotz wants to free humanity from the AI simulation”  [\[17\]](#text00000.html#_ftn17)
    matches a religious sermon. At the annual SXSW tech conference held in Austin,
    Texas, George held a speech about the idea that we are all living in a simulated
    universe and that breaking out of it would let us meet God and kill him.


    George’s sermon is supported by mainstream musings of scientists who say we might
    all be just characters in a video game made by an extremely advanced intelligence.
    The same way we create and engage in scenarios where characters follow our rules
    and exist within the framework we give them, but only have “life” when we are
    micromanaging them, we might be someone’s entertainment, except that we also have
    a degree of free will to make things interesting.


    According to a Scientific American article  [\[18\]](#text00000.html#_ftn18) that
    quotes Neil deGrasse Tyson, there is a 50-50 chance our entire universe is just
    a simulation on someone’s cosmic hard drive. After noting that our DNA differs
    from chimpanzees by only 2%, Neil said that there could be such a form of intelligence
    that would make us look as primitive as chimps; that same intelligence would be
    entertaining itself with creating and editing the human race.


    The simulation theory stems from Nick Bostrum, who in 2003 suggested our super
    advanced progeny could one day decide to run a simulation of ancestors—us—on their
    mega computers. Our lives right now could be just a flicker of an imaginary dream,
    and we wouldn’t be able to tell whether any other person is a simulation of a
    real mind or just a side character in this massive charade.


    Simulation theory is corroborated by the fact that all natural laws in our universe
    seem to be mathematically correlated, just like if a conscious mind made them.
    Other scientists lamented the fact that such an improbable hypothesis was considered
    at all, claiming the likelihood of the simulation theory is effectively zero.
    How does one even begin to test the simulation theory?


    It gets worse. The simulation theory also states that we might be living in a
    computer game, with game designers cutting corners to save on their computational
    resources, which is meant to explain paranormal phenomena, such as ghosts, clairvoyance
    and deja vu. There are even MIT physicists, such as Zohreh Davoudi, who chip in
    with their musings on the topic, stating that since we have limited resources
    for running computer simulations so would our own godlike creators. Another interesting
    idea is that measuring cosmic rays shows they aren’t continuous but have breaking
    points, like if we zoomed in on a picture and saw pixels that told us it is a
    file and not the real thing.


    Philosophers are welcome to jump in the fray, which they do, stating that any
    evidence that we are in a simulation could also be a part of the simulation. Death
    would then be creators terminating those parts of the simulation that haven’t
    produced anything interesting, so the advice for immortality would be “go do fun
    stuff”. This also raises awkward questions about the soul, immortality, and reincarnation,
    which turns any scientific discussion sour. It is funny to consider that religious
    texts scientists consider backward and outdated might be the most advanced form
    of science because it all comes back to the human experience.


    What would God be replaced by? You probably know the answer already—AI. George
    compares programming to magic, mentions humans likely have no free will, and belabors
    starting a religion focused on breaking out of the simulation. According to George,
    capitalism is spent as all companies inevitably set themselves up for failure
    by looking to maximize profits at all costs; a corporation should closely resemble
    a church to succeed in the long run. The turning point in our history will be
    what is known in the tech industry as “singularity”, a point where the disconnected
    units in the IoT ecosystem gain critical mass and turn from disjointed robotic
    hardware doohickeys into living entities representing the super AI, a godlike
    emergent property of a neural network.'
