    # 自动化与人类满意度


    李博士表示，全球各国政府必须为公民提供“生活的意义”，而不仅仅是生存手段。他提到，那些产出更多与人类满意度而非 0 和 1 相关的职业（例如保姆和老师）仍然免受自动化的威胁。例如，创意工作者（如作家和画家）在未来很长一段时间内都不必担心。李博士说，对许多人来说，工作就是生活的意义，他们期望像祖先一样在
    60 年的人生中保持同样的常规，因此如果这些被夺夺，并不会让他们心情愉快。


    问题在于，我们已经把工人当作机器人来对待了：坐好、填写这些电子表格，每天花八小时时间通过电子邮件发送出去，因此将他们的工作自动化实际上是在帮他们。如果给他们一个智能工具来填写表格，而他们只需要核对结果，你觉得如何？这将免除公司的任何法律责任，因为仍然有人类参与，但工作产出可能会大幅增加，尽管整体质量会有所下降。令人深思的是，消费者保护法最脆弱的两个国家——美国和中国，正是推动
    AI 的国家，因为它们的俘性客户对于获得什么几乎没有话语权。


    ## 社会信用体系 (SCS)


    这种共同点可以被科技巨头（如 Facebook 和 Google）让中式审查进入美国，这些巨头已经扩张到类似于国家的程度，区别是它们在战争中无法被击败。中国的社会信用体系（`SCS`）就像一个巨大的游戏，不同的是，低分的后果意味着被切断政府基本服务，如教育和公共交通。是什么导致了社会分降低？交通事故、谋杀、贪污，以及与做过这些事情的人有关。


    在 2015 年的一个案例中，一位中国女学生小贝（音译）无法购买车票或进入大学，因为她的父亲在车祸中害了两人并自杀 41。系统录入的官方标签是她“不诚”，但她在四个月后洗清了声誉。由腾讯和阿里巴巴（中国的苹果和亚马逊）已经构建并测试的
    `SCS` 将在 2020 年推向全国，届时公民所做的一切都将计入评分计算中。喝酒、过度玩游戏，或仅仅是与错误的人混在一起？`SCS` 将考虑爱好、购买和健康习惯是否偏离了党设定的模范公民标准并施加惩罚：社会和经济上的隔离。唯一的问题是，正如我们在加拿大隔离实验中看到的，这些措施会使人们激进并扭曲他们对现实的认知。


    ## 逻辑与后果


    `SCS` 背后的逻辑是，中国政府无法处理十亿可能拥有强大技术的人，因此不可信且最可能制造麻烦的人应该被识别，并逐渐挤出大城市，包括那些可能帮助他们重新爬回城市的人。根据这一逻辑，`SCS`
    将奖励那些负责任的人，同时对那些危及自己和他的人进行预惩罚。其他惩罚包括切断网络访问、无法获得住房贷款或工作机会，以及吊销护照。在一个日益充满敌意的世界里，这些人将如何生存呢？


    # 第 22 章 – 破解 AI


    `SCS` 背后的逻辑是，中国政府无法处理十亿可能拥有强大技术的人，因此不可信且最可能制造麻烦的人应该被识别，并逐渐挤出大城市，包括那些可能帮助他们重新爬回城市的人。根据这一逻辑，`SCS`
    将奖励那些负责任的人，同时对那些危及自己和他的人进行预惩罚。其他惩罚包括切断网络访问、无法获得住房贷款或工作机会，以及吊销护照。在一个日益充满敌意的世界里，这些人将如何生存呢？


