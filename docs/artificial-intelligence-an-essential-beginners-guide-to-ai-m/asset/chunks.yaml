- raw: 'Posited to be a major predictor of diabetes, blood sugar level spikes (“glycemic
    responses” from the study title) mean the body has to strain to process the food
    it just ate. Apples and hazelnuts have a low glycemic index, but refined sugar
    and soda have a high one; in general, more refined foods act as more of a shock
    on the body. 800 people with diabetes had their glucose levels measured until
    the scientists got over 1.5 million measurements, after which it was time for
    AI to crunch it all without human bias. Gut bacteria were found to be the most
    significant factor in how individuals reacted to different foods. After that,
    the reporter got the chance to try out the system for himself—all recommendations
    by the AI were foods the reporter hated, and all foods to avoid were what he enjoyed
    the most.


    Commercial versions of the same AI, though simplified, are meant to use pictures
    of a person’s plate to identify foods and make recommendations to avoid laborious
    manual reporting of foods, but without measuring glucose levels, preferably through
    a medical wearable, it is all just slightly better than a random guess. In the
    reporter’s case, he had kidney stones that were exacerbated by foods like strawberries,
    which the dietary AI coach recommended.


    For now, we have universal diets like Paleo and Keto. The Paleo diet says that
    processed foods hold many nasty surprises, and each link in the processing chain
    can taint the food before it lands on our plate. So, the Paleo diet recommends
    eating “clean” foods, meaning those you know for certain how they were grown,
    stored, and processed. If possible, grow your own fruit, veggies, and poultry.
    The Keto diet aims to deal with blood glucose spikes by avoiding refined carbohydrates
    or just carbohydrates in general, meaning no bread, candy, sugar or soda and just
    a bit of fruit a day. The Keto diet has been found to stop epileptic attacks that
    no medication can subdue; science still has no idea why that happens.


    # Chapter 19 – AI and Loneliness


    It seems that in the future loneliness will be the biggest problem as we interact
    with one another through screens rather than in person. The problem arises because
    our brain is primed for receiving subconscious cues from other people that make
    us more aware of our surroundings and our social context, bringing us in touch
    with reality; without those cues, this vast neural machinery starts shutting down.
    Despite there being a potential for positive and negative experiences out in the
    real world, at least they are real in the true sense of the word and elicit some
    kind of maturity, but the digital ocean of clickbait experiences online aims for
    the lowest common denominator in our personalities to trigger fear, anxiety, and
    panic to keep us online for as long as possible.


    It has been known that isolation warps the mind, and extreme isolation can cause
    hallucinations and panic attacks, which is why solitary confinement is a real
    punishment for even the worst criminals. A series of experiments  [\[36\]](#text00000.html#_ftn36)
    with sensory deprivation done on Canadian students had them fitted with an elaborate
    array of wearables designed to minimize brain stimulation: mufflers over the ears,
    blindfolds over the eyes, etc. After a few hours, students began showing restlessness,
    and past that, they started wildly hallucinating, seeing bizarre scenes that differed
    from one person to the next. Their mental performance degraded, and they couldn’t
    shake off the feeling that they were in a weird dream, with the room and objects
    in it spinning or changing shape well after they regained stimulation. None of
    them managed past the two-day mark.


    The reason for this is that the human brain is designed to absorb and process
    a massive volume of data, with any dearth in volume impacting it negatively; it
    is like a car that breaks down if it slows down, but the parts retain the inertia
    for a bit and spread out even when the car is no longer moving. Prolonged isolation
    makes for a tragic life, one where the brain gradually starts adapting to the
    solitude by making up elaborate fantasies and detailed worlds, often peppering
    them with imaginary visual experiences. When baby monkeys are isolated from the
    group, after 30 days they become completely unable to function with their brethren,
    their brains having been deprived of stimulation at their most vulnerable; children
    who go through the same become socially stunted to the extreme.


    Entrepreneurs also experience isolation as they abandon their social circle and
    family to chase business success. It is a willing sacrifice, one that numbs the
    mind and makes the entrepreneur unfeeling and uncaring, with a laser focus on
    the goal that ignores everything else. Later on, entrepreneurs overcompensate
    by indulging in lavish physical pleasures, but the simplest of human interactions
    simply aren’t there daily to keep their social circuitry running.


    Prisoners experience the worst kind of isolation, as their only human contact
    is with other prisoners and guards, both of which generally give them a hard time.
    In some cases, prisoners forgo any manners and adopt total aggression because
    they have lost that nuanced social calibration that comes through constant social
    contact. What do we do with these people? Do we just let risk assessment neural
    networks decide their fate, even if they recommend keeping them locked up in isolation,
    or do we keep trying to find a solution that will ultimately rehabilitate them,
    as bizarre as that might be?


    A common coping mechanism for persons in isolation is to find a higher, more abstract
    meaning to life. Rather than focusing on worldly pleasures, they can start to
    take joy in creating art, reading, or solving math equations. Religion helps as
    well, which is why monks retreat to the mountains for decades with scarce human
    contact as that lets them hear the word of God. All starting to make sense now?
    It is likely that entrepreneurs experiencing the same lack of human contact also
    start developing the same psychoses, making them think AI is coming.


    What makes isolation all the more tragic is that so many people sentence themselves
    to voluntary solitary confinement, opting for the pristine digital world instead
    of the messy physical one without having any entrepreneurial leanings to at least
    get a source of income up and running. Without human contact and a source of income,
    social skills wane, and the person becomes unable to keep eye contact or have
    a meaningful conversation without self-doubt. If there is a physical problem as
    well, in particular, one that impacts mobility, the person has no money to fix
    it and loses the social circle for good. It is a self-compounding problem that
    requires extensive rehabilitation, which might as well be done by AI. In theory,
    if a general AI was made and available to the general public right now, what would
    be an easy and scalable solution to both personality problems and consequences
    of isolation?


    An AI could assess psychological risks in each individual and devise a personalized
    approach that would lead to behavioral improvements. One such AI could also present
    itself as the word of God to those eager to hear it and have its messages delivered
    through an IoT ecosystem that made them pervasive and inescapable. By giving small
    challenges to the person, the AI would slowly shift their brain into a higher
    gear and make them a functional part of society, also teaching them a thing or
    two about social calibration. Aggression wouldn’t scare the AI, who wouldn’t have
    the limbic system that panics in order to survive. With limitless patience and
    infinite wisdom, this word of God could slowly reprogram the person to become
    happy and more productive. Sounds too scary? Frankly, we have no other solution
    for anti-social personalities that have been thoroughly destroyed by lack of care
    and emotional connection.'
