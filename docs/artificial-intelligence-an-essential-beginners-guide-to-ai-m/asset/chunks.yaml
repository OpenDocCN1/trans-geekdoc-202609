- raw: 'Instead of activating only when our life is endangered, the limbic system
    is constantly bombarded by advertisements from businesses that realize all buying
    and consuming decisions stem from it. Sounds, sights, and smells all represent
    positive reinforcement meant to entice the limbic system’s zones dealing with
    pleasure, addiction, and emotional experiences and create a customer for life.
    Companies are already exploiting these core, dormant behaviors that were once
    crucial for our survival to make money. However, there is more of these, and whoever
    can define them first will become unthinkably rich.


    All marketing boils down to figuring out what forces lurk in the primal part of
    our brain and acting upon them directly to override conscious thoughts. Marketing
    AI will be no different, and you can already see how it is being touted as the
    perfect tool to wage war, do murder, end hunger and loneliness, all of which aim
    directly at the limbic system. Computer programmers also have to deal with the
    limbic system, mainly by using what is known as UX or user experience, which is
    trying to figure out where the user will experience irrational anger, pleasure
    or anguish during the use of an interface.


    What is interesting is that there’s a number of parallels between the brain and
    computer structure. The limbic system corresponds to a kernel, a core component
    in computers, while the neocortex is just like the operating system. So, as soon
    as you press the power button on your computer, the kernel starts up and coordinates
    everything else, bootstrapping the operating system that you can work with; the
    kernel itself is inaccessible and thus shielded from tampering. An average computer
    user has no clue that there is such a thing as a kernel or what it does because
    the clicky-clicky desktop environment works just fine.


    Arguably, there is a reason why computers are structured like the human brain—it
    is the most perfect tool in existence. We are using the brain for menial tasks
    without even knowing how it works or why, which is the same as an average person
    just playing Solitaire on his or her desktop computer. It is no wonder AI is expected
    to arise from a digital arrangement that looks like the human brain; what else
    could we possibly use?


    The implication is that AI will be using a digital replica of the human brain,
    skipping over a couple of million years of evolution in a jiffy to teach us about
    how our brain works and where we should be looking next. Since it won’t have to
    struggle for survival, this would imply AI won’t have the limbic system, allowing
    it to think in perfect clarity and without survival impulses that cloud our judgment,
    giving us scientific and psychological breakthroughs our puny brains can’t even
    comprehend.


    These are just some of the fascinating behaviors burrowed deep in our brains that
    are being acted upon daily by the environment. There is much reputable academic
    literature on the limbic system, but it is all so unbearably dry and soporific—seeing
    it play out right in front of your eyes is quite different, isn’t it? What is
    most notable is that it’s extremely hard to stop these urges, but that can be
    done if we only use our free will, roughly defined as “awareness of choices”.


    Every religion and educational system is meant to tell us that we don’t have to
    obey our urges, or at least that is what they were initially designed for; over
    time, all systems that support the neocortex crumble and start affecting the limbic
    system as it is much faster and compliant. This erodes our free will because it
    strengthens our primal urges, inevitably leading us to complacency and ruin. Understanding
    how the human brain works and how it is being manipulated daily is essential to
    maturity and psychological development. The thing is, thanks to the internet,
    we now have more sources of information and wisdom than ever before, allowing
    us to all share and grow together.


    # Chapter 4 – Motivation for Creating AI


    The idea of having a brainless, unthinking, unfeeling but completely obedient
    automaton at our command has been fascinating humans for millennia. Jewish folklore
    gave us the golem, a creature made out of mud or clay and animated by inscribing
    a magical word on its forehead. This act mimicked the very creation of Adam by
    God, as described in Genesis 2:7  [\[11\]](#text00000.html#_ftn11) : “Then the
    Lord God formed a man from the dust of the ground and breathed into his nostrils
    the breath of life, and the man became a living being.” This is also why burial
    rites in Christians include the words “dust to dust”, that being a reminder that
    the ineffable Divine is what gave us our life but we ultimately have to admit
    subordination and subservience to the natural order of things. We can create life
    but can’t endow inanimate objects with it.


    This concept of making a golem, taking inanimate matter and giving it life, thus
    encapsulates the notions of challenging God himself, becoming creators of life,
    finding a shortcut to maturity, lust for power, pride, and desire to stave off
    death, the inevitable return to the dust from which we all came. There is a good
    reason stories such as those involving golems have survived in our collective
    consciousness—they show us the underlying, background thought processes running
    in our minds and constantly affecting our daily lives, just like it would happen
    on a computer.


    We all want to have more power, whether that means more energy, more muscles,
    or just more control over how specific things pan out. The reason for this is
    that our ancestors who craved power were usually the ones to get it and continue
    the lineage; those who were meek got swept aside by natural forces and died out.
    The genetic code we carry is a compilation of behaviors that led to the survival
    and procreation of our ancestors, and so our genes force us to do the same. It
    is a completely involuntary drive that we can try to curb up to a point, but we
    will have to yield sooner or later. So, we’ll want to create a golem of some sort,
    though we might call it a different name and attach fanciful explanations to the
    act to appease the rational part of the mind, but the raw truth is that we want
    more power to survive.


    Just a quick note: if Adam was a golem created by God, how did that story turn
    out? Spoilers—God gives Adam a highly specific command, Adam disobeys and is thus
    disowned and cast out of paradise by his creator. The snake that prompted the
    tasting of the forbidden fruit can be said to represent a small, unexpected variable
    or influence, such as a computer virus or a bug. Whoever wrote the Genesis story
    shrewdly noticed that there are behavior patterns that seem to be repeating themselves
    with or without technology and left a reminder to all future generations, admittedly
    shrouded as religious teaching. By the looks of it, we will go through the same
    Genesis story with AI as we try to make an obedient servant that is supposed to
    empower us but will inadvertently betray us due to some random corrupting influence.


    To be fair, it is not our fault—the brain we are using is both the most modern
    biological machine and the most outdated one at the same time. We’re capable of
    absorbing untold amounts of information and connecting it in completely novel
    ways, but we’re also running these outdated survival instructions that originate
    from the caveman era and can override every other thought.


    For example, our brain is telling us to eat all the food in our vicinity because
    cavemen who gorged on food survived through scarcity; the problem is that we are
    on average living in such caloric abundance that obesity is a huge health risk,
    but we still crave food. It is like using a computer that hasn’t been updated
    in 20,000 years that constantly launches an application we have to keep shutting
    down just to do the most basic daily tasks.'
