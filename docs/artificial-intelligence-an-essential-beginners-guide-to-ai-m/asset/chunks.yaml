    described as being dangerous to the general public, which would necessitate its
    containment in the Stanford vaults, conveniently hiding all the raw data inputs
    and decision-making processes from being independently analyzed. Don’t worry,
    people in power have never abused it, especially when they were as humble as these
    Stanford prodigies.


    Tech giants were the ones behind this kind of AI-friendly movement, so it is no
    wonder they too want in on the action. In 2017, `Google` pivoted its marketing
    to be “AI first”, rebranding the research department as “Google AI”. There are
    dissenting voices, such as `Steve Blank`, a professor at Stanford, who said that
    people who develop new technology typically aren’t held liable for its misuse
    and mentioning that technology always has consequences beyond anything its creators
    imagine.


    # Chapter 18 – Dietary Advice by AI


    Diet is going to be one of those areas where AI helps dish out useful information
    so each person can step up to the plate that fits him or her genetically. Imagine
    replacing white bread with a 40-60 corn and rye one that tastes weird but finally
    solves your bloating, acne, and rashes. For whatever reason, changing something
    in the diet helps tremendously with health problems, but we typically never consider
    the option consciously or know what to do about it. Plenty of foods we are eating
    have nothing to do with our needs but are rather a force of habit or a yearning
    for comfort food due to excess exposure to stress.


    When it comes to food, current market conditions require uninformed customers
    with low impulse control to achieve financial growth—just look at how `gluten`
    turned out. Typically found in nature as a wheat protein that functions like glue
    to keep the seed in one piece, `gluten` was isolated and put into commercial use
    as a thickener sometime in the early twentieth century—used in ice creams to stop
    them from melting too quickly. Isolated `gluten` acts like a tiny bullet in the
    human digestive tract, poking holes which heal up quickly; overuse of `gluten`
    over decades leads to severe intestinal problems and autoimmune diseases in consumers.


    Companies used `gluten` because it made foods chewy, replaced more expensive ingredients
    without the product falling apart, and increased shelf life.


    What is interesting about `gluten` is that it has different impact on individuals,
    with each strain liking different foods. Everything from family history to toxins
    in the environment and gut bacteria plays a role in how the body processes foods.


    There is no reason to believe the deployment of AI in any society will fare any
    better than the deployment of `gluten`. However, `gluten` could be blended seamlessly
    with other ingredients, but AI will stick out like a sore thumb, mandating that
    we willingly accept and adore it from the start.


    Mass adoption of AI will require wholesale enlightenment, total turnover in how
    companies do their business, most likely neither will happen but let’s examine
    the possibilities regardless.


    According to a New York Times article [35](#text00000.html#_ftn35), where the
    reporter, also a cardiologist, used an app to log everything he ate, and how much
    he slept and exercised over fourteen days, AI can make us seriously doubt what
    we have eating all our lives. Alongside a sensor that tracked his blood sugar
    levels, the reporter also had his stool analyzed for gut bacteria to see what
    was inside his intestines; different people have different bacteria in their gut.


    One such study was “Personalized Nutrition by Prediction of Glymic Responses”,
    which looked at how blood sugar levels of participants spiked in response to 52,000
    of the most popular foods, including ice cream.

    [/content]

