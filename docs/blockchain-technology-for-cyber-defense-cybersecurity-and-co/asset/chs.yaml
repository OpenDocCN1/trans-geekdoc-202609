  \ C. (2017 年)。网络安全与区块链教育。Software Practices, 25。\n\n# 网络安全与区块链实践\n\nDevendra Chapagain,\
  \ Naresh Kshetri, 网络安全伦理\n\nDOI: [10.1201/9780344518](https://doi.org/10.1201/9780344518)\n\
  \n## 8.1 引言\n\n在现代，知识被视为极其宝贵的资产。全球人口中约有 63.5% 的人在使用互联网，研究显示 95% 的安全漏洞是由于人为错误引起的。安全地上网需要具备基本知识，例如安全密码、识别网络钓鱼、多重验证、社交隐私设置、避免公共\
  \ Wi-Fi 以及理解数据是如何获取的。就像不了解交通规则开车是极其危险一样，在不理解安全概念的情况下使用互联网也极其危险。遗憾的是，如今许多毕业生缺乏足够的安全知识，这是教育系统中的一个漏洞，也是企业的担忧。学术机构应该在课程中加入信息安全。IT\
  \ 毕业生在编程和 IT 设计方面非常优秀；然而，如果他们缺乏安全技能，他们的 IT 作品将不可避免地受到漏洞的影响[2。尽管 行业在开发安全应用程序和软件方面付出了努力，但教育普通用户如何安全地使用互联网的努力非常少。在线购物和电子支付等活动，以及年轻人大部分时间使用手机和电脑已成为常态。尼泊上网人数的增加为该政府和企业部门带来了许多挑战性问题。尼泊出现了多种网络犯罪，包括勒索软件攻击、网络钓鱼、隐私泄露以及社交媒体问题，如欺凌、儿童色情和传播虚假信息。\n\
  \n即使软件或应用程序通过了某些安全标准（如国际标准组织 ISO 标准），它们可能仍然存在安全问题。安全标准为安全提供了指南和最佳实践，但并没有保证产品绝对安全。安全是一个持续的过程，即使在某个软件通过安全标准后，仍可能发现新的漏洞。软件应用程序的安全性可能会因为人为错误或恶意破坏而被破坏。因此，定期更新和维护软件以修复已知的漏洞，并使用防火墙和杀病毒软件等额外的安全措施是非常重要的。\n\
  \n## 8.2 文献综述\n\n在 `3` 中，分析了技术系统中最薄弱的是人。在为以人为的网络安全理念奠基础时，他选择了 `3Us`（用户、用法和易用性）作为在设计、实施和评估安全时需要考虑的三个组成部分。\n\
  \n\n\n\n\n为了在这种环境中妥应对网络攻击，用户需要对周围环境和攻击者的意图保持高度警惕。这使他们能够快速适应甚至预判意外之外的攻击。用户需要考虑广泛的因素，例如电子邮件的主题和发件人姓名、他们对发件人的了解，以及邮件是否与他们当前的情况有关。他们还应该能够超越这些基础理解，尝试确定攻击者的意图以及点击该邮件可能带来的潜在网络安全后果。换句话说，用户需要能够对网络攻击进行批判性思考，并就如何应对做出明智决策。这需要对网络威胁格局以及可能发生的不同攻击类型有深入理解。以下是如何利用情境和意图意识来应对网络攻击的示例。\n\
  \n### 情境与意图意识\n\n想象你收到一封自称来自你所在银行的邮件。邮件主题为“紧急安全警报”，邮件正文说你的账户已被入侵，你需要点击链接来重置密码。如果你不了解最新的钓鱼诈骗，你可能会被骗点击该链接。然而，如果你了解钓鱼邮件的威胁，你更有可能对这封邮件产生怀疑。你可能会问自己以下问题：\n\
  \n*   我在该银行或机构有账户吗？\n*   我熟悉发送此邮件的人吗？\n*   这封邮件的主题与我生活中的任何当前事件有关吗？\n*   是否有其他迹象表明这封邮件可能不可信？\n\
  *   这封邮件的时间点有什么异常之处吗？\n*   邮件内容是否暗示了某种紧迫性或威胁？\n*   我网络中的其他人收过类似的邮件吗？\n*   这封邮件是否在促使我立即采取行动而没有留给我思考的时间？\n\
  *   我过去收到过类似的邮件吗，或者其他人是否报告过类似的钓鱼邮件或垃圾邮件？\n*   邮件中包含任何拼写或语法错误吗？\n\n如果你对其中任何一个问题的回答是“否”，那么你不应该点击邮件中的链接。相反，你应该直接联系银行以验证邮件的真实性。通过意识到周围环境和攻击者的意图，你可以保护自己免受网络攻击。\n\
  \n### 数据驱动的网络安全研究\n\n从安全的角度来看，[3]] 研究社交媒体 Twitter 上的垃圾邮件或来自网络的流量样本。网络安全分析依赖于数据，而\
  \ Twitter 是这些数据的主要来源。调查介绍了一种新的数据驱动网络安全研究方法，并回顾了其在社交和互联网流量分析中的应用。它强调了当前 Twitter 垃圾邮件检测和\
  \ IP 流量分类研究中数据、模型和方法之间的紧密联系。他们讨论了海量流量数据、专业知识和研究方法。\n\n### 全球威胁格局与伦理\n\n黑客随时准备获取个人身份信息、实施犯罪或暴露敏感且有用的知识。对国家和国际计算机网络的攻击是许多国家面临的问题。持续的危机、全球大流行的可能性以及万事就绪上线的需求，都凸显了网络防御和网络情报的重要性。需要某种形式的网络伦理和全球网络规则来指导落后和发展中国家政府所开展的一些突出活动\
  \ [4]。\n\nAndreea Bendovschi 在其 2015 年的文章《网络攻击——趋势、模式与安全防御措施》中研究了不断变化的网络犯罪世界以及依赖互联网的社会中攻击的增加。报告讨论了中间人攻击、分布式拒绝服务（DDoS）攻击、勒索软件和社交工程及其对个人和企业的影响。在分析了超过\
  \ 1500 万次攻击后，研究发现目标行业与攻击类型之间存在相关性，强调了全球网络意识的必要性。Bendovschi 建议组织定期评估风险，维护健康的 IT 基础设施，实施强身份验证，并投资独立的安全评估以应对这些危险。文章强调了在技术驱动环境中网络安全的必要性\
  \ [5]。\n\n### 物联网与安全漏洞\n\n预计到 2025 年，将有约 309 亿设备通过物联网（IoT）相互连接 [6]。从结果可以看出，黑客不断想出滥用系统、软件和信息的新方法。该研究一个有趣的发现是，不到一半的安全违规可以追溯到犯罪意图。相反，原因均匀分布在三类中：犯罪意图、`human\
  \ error`和系统弱点。结果凸显了一个事实：攻击的成功是多种因素共同作用的结果，包括攻击者的知识能力以及受害者方面的漏洞，例如编写糟糕的代码、`human\
  \ error`以及`缺乏保护敏感数据的措施`。\n\n## 8.3 疫情后的网络安全现状\n\nCOVID-19 病毒对网络安全产生了巨大影响，既带来了新问题，也改变了旧趋势。网络犯罪分子利用了由于快速转向远程办公导致的公司和组织弱点。因此，近年来勒索软件、数据泄露和钓鱼计划有所增加。\n\
  \n过去几年中，网络攻击增长了很多，这对个人和企业来说都是更大的问题。COVID-19 疫情加剧了这个问题，因为黑客现在可以针对几乎任何人。由于糟糕的网络安全习惯，许多人遭受了伤害。在疫情期间，封锁使得黑客很容易获取人们的数据。结果是，网络犯罪分子开始针对越来越多的领域，如银行、政府和非政府组织\
  \ [7]。2020 年，美国发生了多次数据泄露，影响了大量人员。Identity Theft Resource 的一项研究发现，从 2020 年 9 月到 2021\
  \ 年 9 月，数据泄露比去年更多。这显示了从 2016 年至 2021 年数据泄露日益增长的趋势。\n\n在 COVID-19 疫情期间，某些黑客问题案例增加。这段期间发生的常见网络攻击类型包括恶意软件、黑客攻击、勒索软件、DDoS\
  \ 攻击、有害域名、恶意浏览器应用、拒绝服务（DoS）攻击、恶意移动应用、垃圾邮件、社交媒体上的恶意帖子、业务电子邮件欺骗、高级持续性威胁（APT）、僵尸网络攻击和黑入。\n\
  \nMcAfee Enterprise 和 FireEye 的一份名为《大流行世界网络犯罪：COVID-19 的影响》的报告强调了网络攻击日益增长的危险。报告显示，81%的全球组织在疫情期间看到网络威胁增加，79%的组织在高峰时期因网络事件面临停机。。随着假期季节的临近，供应链、电子商务、零售和旅游等部门由于消费者和业务活动增加而面临更高的风险，使业务、员工和消费者数据处于危险之中。这强调了组织加强网络安全防御的紧迫需求\
  \ [8]。\n\n\n\n\n\n在过去的五年里，IC3（网络犯罪调查中心）每年收到约 652,000 起投诉。来自世界各地的人针对各种网络诈骗报告了这些投诉。下表显示了\
  \ 2018 年至 2022 年投诉的年度及总数以及损失金额。在此期间，IC3 共收到 326 万起投诉，受害者损失了高达 276 亿美元 [9]。\n\n根据联邦调查局（FBI）2022\
  \ 年老年人诈骗报告，网络犯罪受者的数量每年都在变化，显示出不同的影响范围。2022 年，未付款/未交付成为最常见的网络犯罪，影响了 7,985 人。2021\
  \ 年，个人数据泄露是最常见的网络犯罪，影响了 6,189 人。另一方面，勒索是 2020 年最大的威胁，有 23,100 名受害者。2022 年，针对儿童的犯罪受害者人数最少，仅有\
  \ 84 人；而暴力威胁在 2021 年的受害者最多，达 719 人。2020 年，针对儿童的犯罪再次位居最后，但这次只有 58 名受害者。与就业相关的网络犯罪一直处于中间水平，2022\
  \ 年、2021 年和 2020 年的受害者分别为 1,286、1,408 和 1,867。这些数字显示了在线威胁如何不断变化并对不同的人以及整个社会产生不同的影响\
  \ [10]。\n\n## 8.4 网络教育的需求与安全上网习惯\n\n尽管互联网为人们提供了巨大的便利，但由于他们对网络风险的理解有限，它具有危害。网络安全技能在现代世界变得更加重要，对于年轻一代尤其如此，他们通常是首批采用新技术和消费新形式媒体的人\
  \ [11]。由于对技术的依赖日益增加以及网络风险无处不在，网络教育和安全浏览习惯在当今的数字时代至关重要（见图 8.1）。\n\n![图 8.1 网络生态系统与网络教育的作用。](img/fig8_1.jpg)\n\
  \n图 8.1 网络生态系统与网络教育的作用。\n\n几乎每个用户在几乎每个需要登录的网站都使用电子邮件地址作为身份，这非常常见。另一方面，将电子邮件地址作为\
  \ ID 会带来严重的安全和隐私风险 [12]。然而，当电子邮件地址被用作身份标识时，会引入严重的安全和隐私问题。个人的电子邮件地址可能会向公众披露，这引发了巨大的隐私担忧。事实上，作者建议在建立网站账户时不要相同的电子邮件地址。为了增加安全性，它应该生成自己的登录凭据。如果你在多个网站上使用相同的电子邮件地址识别身份，更容易发生身份盗窃。\n\
  \n宫本大介（Daisuke Miyamoto）在他的文章 [13] 中提到，用户落入陷是因为他们不知道 URL、域名和安全凭据的内部运作。为了确保用户只访问安全的网站，他还提出了一种可以添加到网络浏览器并与眼动追踪设备协作的软件。该软件能够检测用户何时正在查看地址栏，地址栏是浏览器中显示用户正在访问的网站地址的部分。这出于许多原因可能很有用。例如，它可以防止用户意外点击恶意链接。它还可以通过让用户更容易导航到他们想要访问的网站来改善用户体验。\n\
  \n## 8.5 区块链与安全措施\n\n如果利用得，区块链可以用于许多领域。区块链的用途之一是在线交易中的安全软件实践。区块链是一种高度发展的数字网络，近年来引起了极大关注。该技术旨在创建一个去中心且安全的计算机网络，这些计算机共同工作以验证和确认交易或数据，使其成为数字资产和信息的理想解决方案。通过使用加密技术，区块链技术确保数据和交易保持不可篡改和透明性，从而增强了数字资产的信任和可靠性。因此，区块链技术已成为在包括网络安全在内的各个领域寻求稳健安全措施组织的理想选择。\n\
  \n实施基于区块链的网络安全解决方案可能会产生积极结果。这些优势的示例包括：\n\n### 去中心化\n区块链是一种运行在点点网络上的去中心化系统，使得攻击者难以发起\
  \ DDoS 攻击。由于区块链在没有中央权威的情况下运行，因此不存在可能导致网络崩溃的单点故障。\n\n### 不可篡改的记录\n由于区块链对所有交易和数据具有不可篡改的记录，欺诈行为更容易发现和防止。\n\
  \n### 透明性\n区块链技术提供了透明性，允许网络参与者查看所有网络交易和活动。有助于识别恶意行为和安全漏洞。\n\n### 验证\n区块链技术提供了安全的验证方法，从而降低了身份盗窃和其他形式的网络犯罪的风险。\n\
  \n### 用于网络安全的区块链\n区块链技术的发明是技术领域一个绝对突破性的进展。它在实施全面的安全政策方面非常有效，这种政策具有彻底许多不同行业的潜力。区块链技术凭借其去中心化、不可篡性和加密算法的使用，保护数据不受篡改和泄密的影响\
  \ [16]。这种前瞻性的策略消除了对传统中间人的需求，反过来降低了欺诈活动、非法访问和数据操纵的概率。\n\n\n\n\n\n区块链采用了一种独特的技术机制来缓解网络攻击，从而防止潜在攻击者对敏感信息进行未经授权的访问。因此，区块链技术的独特特征可以作为恶意攻击的威慑，并在某种程度上增强网络的整体安全性。区块链的技术机制通常会带来高水平的安全性，这凸显了在利用区块链技术进行安全在线浏览时，优先考虑安全问题的重要性\
  \ [15]。\n\n使用区块链增强安全性并不是一个简单的解决方案，因为它需要大量的资源，这可能导致处理时间增加和通信速度变慢 [16]。因此，即使我们使用了最先进的技术，也始终存在人类交互的需求。因此，在能够该技术的同时，对其对其安全性有基本的理解是必要的。\n\
