  \ Journal, 16, 267–278.\n\n# 基于区块链的安全图书馆系统\n\nShallu Sharma 和 Balraj Singh\n\nDOI:[10.1080/0953728.2022](https://doi.org/10.1080/0953728.2022)\n\
  \n## 12.1 引言\n\n图书馆的工作本身非常全面，涉及的工作范围也极其广泛。在现代社会中，人们对各种知识的欲望更加强烈。图书馆能够提供大量的高质量书籍，这导致每天需要服务的读者数量显著增加。这无形中增加了服务的难度。为了使原有服务具有更高的质量，相关人员可以积极应用区块链技术优化过去的工作环节，使整个图书馆的工作更有序。本章分析并总结了图书馆的工作方法，并提出了一些实行的计划，旨在帮助更多工作人员在执行工作任务时积极应用区块链技术[1]。这需要工作人员利用空闲时间研究和学习更多信息技术，根据图书馆的实际情况和读者的真实需求创建更好的服务系统[2]。\n\
  \n## 12.2 动机\n\n\n\n\n数据安全是文档传递中的首要问题，这进一步引发了资源盗窃和未经授权攻击等问题。大多数传统的文档传递方法都是离线的以确保数据安全\
  \ [4, 5]]。这些方法实时性不足，容易导致数据丢失。随着技术的不断发展，数据的在线传输在及时性方面具有优势。然而，目前的图书馆文献访问和授权系统是为集中化服务器和分布式数据库设计的\
  \ [5]]。这可能导致数据的未经授权访问和隐私泄露。此外，中央服务器容易受到攻击，产生单点故障问题，导致资源不可用。这危及了数据安全并对第三方产生了依赖。尽管许多研究人员正在研究问题的各种因素，但其失败的最原因之一是组织不愿意为非成员提供访问权限\
  \ [6, 7]]。因此，需要一个设计良好的方案来处理授权并提供一种去中心化的访问控制解决方案。区块链的引入将成为一个突破，对智能资源系统的服务做出有效贡献。传统图书馆可能会遭受财产破坏的物理损坏，而由于分馆在物理上相远，这可以被视为有限的意外。数字图书馆的基础设施通过点击即可互联和访问，可能会遭受\
  \ DDoS 攻击，这可能导致整个服务的崩溃 [8]。去中心化网络通过将风险从中心分散到多个小分支显示了其优势。因此，关闭几个服务节点不会影响整个网络提供的服务。提供一个易于扩展、具有无处不在且没有特定集中服务点的系统是主要的设计哲学。我们主要关注图书馆对服务可用性和效率的关键需求，但访问控制和权限管理是与服务可用性同样关键的功能\
  \ [9]。然而，传统图书馆可能会遭受资源的未经授权访问。物理副本的负担使得威胁难以产生进一步影响。相比之下，对于数字化图书馆，未经授权的访问更为关键：管理不当和记录篡改会严重侵犯资产的合法性\
  \ [10, 11]。\n\n我们将下一代图书馆的需求总结如下：\n\n1. **高并发访问会话**：系统应处理密集的并发访问会话以满足客户请求，并免疫拒绝服务攻击\
  \ [12]。\n2. **存储效率**：系统能够高效地存储和分布数据，其中文件系统设计用于降低数据重复的可能性。同时，系统可以提供快速的数据检索 [13]。\n\
  3. **易于扩展**：操作人员可以通过少量设置步骤快速扩展存储容量，且不中断服务 [14]。\n4. **安全性**：篡改访问控制应该具有挑战性。系统能够为每份档案提供稳健的用户访问控制\
  \ [15]。\n\n## 12.3 区块链\n\n加密货币是说明在去中心化系统中提供安全可靠数据存储重要性的重要例子。它要求每个参与者在自己的本地场所维护账本。任何破坏共识并修改某些账本副本的人都会对平台的信誉造成严重损害\
  \ [16, 17]。确保在多个去中心化点拥有统一且经过批准的副本至关重要（见图 12.1）。\n\n![图 12.1 区块链功能结构。](img/fig12_1.jpg)\n\
  \n图 12.1 区块链功能结构。\n\n## 12.4 区块链的问题与挑战\n\n区块链技术仍处于实验初期，必须面对许多问题，尽管它极有可能颠覆教育系统 [18]。其中一些是由技术不成熟引起的，另一些是由与技术无关的情况引起的。表\
  \ 12.1 分析了区块链在实施过程中可能如何解决某些传统问题。\n\n| 序号 | 传统问题 | 区块链解决方案 |\n| --- | --- | --- |\n\
  | 1 | 需要巨大的存储 [17] | 数据记录在区块中；使用 `IPFS` 进行去中心化存储 |\n| 2 | 数据地址安全性低 [19] | 区块链支持加密算法\
  \ |\n| 3 | 政策保护或指导 [20] | 使用 `smart contracts` 实现策略和属性 |\n| 4 | 用户隐私 | 带时间戳的加密 |\n\
  | 5 | 数据机密性 | 共识算法 |\n| 6 | 资源可用性 [21] | 证书机构 |\n| 7 | 内容安全性 [22] | 许可访问与无许可访问 |\n\
  \n## 12.5 区块链网络类型\n\n区块链是一种去中心化的安排，允许创建交易的数字分布式记录并在网络上的各个节点之间共享，而不是将其存储在中央服务器上。去中心化网络将负担分配给每个节点并利用它们的处理能力来完成。在在线资源共享中，去中心化系统的扩展性优于集中化系统\
  \ [23]。区块链网络基本上分为三部分，如图 12.2 所示。\n\n![图 12.2 区块链网络类型。](img/fig12_2.jpg)\n\n图 12.2\
  \ 区块链网络类型。\n\n## 12.6 建议方法\n\n\n\n\n文献综述表明，从一开始研究人员就尽力构建一个有效的分布式数据库系统，以支持多个平台之间的数据共享。区块链技术在图书馆和信息科学领域处于早期阶段。区块链技术连接了一个去中心化的网络，该网络没有单一的所有者。网络中的区块可以包含交易链。通过对区块数据进行加密来确保数据隐私。用户仅拥有私钥，而公钥与网络中的所有参与节点关联[23,\
  \ 24]。用户创建的交易通过其私钥加密。因此，结果过程创建一个与交易关联的公钥，且该过程是不可逆的，以确保用户私钥的安全。另一方面，网络节点根据共识协议使用公钥授权网络中的交易[25]。此外，随着区块链中启动每一项新交易，它都会被添加到网络中所有成员节点之前存储的账本中。本文提出了基于区块链网络的电子图书馆记录共享策略。区块链环境使得以更经济的方式与难以接触的读者共享资源变得更加容易。\n\
  \n## 12.7 智能合约的设计\n\n在我们提出的架构中，使用了基于智能合约的以太坊网络来描述网络每个参与节点上现有的馆际服务记录。区块链交易伴随着加密加密的签名，用于管理数据所有权、访问数据的权限以及数据的完整性[24]。\n\
  \n只有合法的交易才能通过智能合约的状态事务函数来执行数据更改。这些规则的形成是为了规范图书共享系统的工作流。该框架旨在实现智能合约以处理复杂的数据传输，并维护数据源的安全性和隐私性[26]。智能合约的设计涵盖了从授予数据访问权限的所有所有状态，如图图\
  \ 12.3\n\n图 12.3 馆际服务的智能合约工作流。\n\n## 12.8 用户验证与系统认证算法\n\n在所提工作中，图书馆生态系统内的用户验证通过生成的认证密钥和用户位置数据的结合提升到了新的水平。这些认证密钥对每个用户都是唯一的，并基于他们在图书馆环境中的位置，作为安全和访问控制的第一层[27]。然而，为了进一步增强验证，系统利用多项式曲线拟合。这种数学技术用于建立用户位置与其认证密钥之间稳健的关系。多项式曲线拟合生成的数学模型可以准确表示每个用户在图书馆生态系统中的位置如何与其认证密钥相对应。在验证期间，当用户尝试访问图书馆资源或执行操作时，将收集其精确位置数据并输入之前建立的多项式方程中。如果位置匹配，则允许访问。\n\
  \n1. **初始化**：算法从设置某些参数并根据 `ord` 初始化 `clus` 开始。\n\n2. **主循环（代际）**：算法进入一个运行指定次数 `gen`\
  \ 的循环。\n\n3. **信任计算**：在每个代际中，算法根据 `x` 和 `y` 计算一组 `trust`。\n\n4. **信任表**：受信任的成员存储在\
  \ `trust_table` 中，其中包含坐标和密钥。\n\n5. **活跃学生选择**：根据 `clus` 选择一部分活跃学生。\n\n6. **图书馆聚类分配**：算法将每个活跃学生分配给一个图书馆聚类\
  \ (`act_lib`)。\n\n7. **唯一图书馆**：识别聚类内的 `libs`。\n\n8. **内层循环（图书馆）**：算法进入另一个遍历已识别 `libs`\
  \ 的循环。\n\n9. **图书馆密钥**：对于每个图书馆，获取该图书馆的密钥 (`key`)。\n\n10. **请求处理**：有一段代码似乎在处理来自活跃学生的请求。它检查请求数量是否小于多项式阶数\
  \ `ord`。如果没有，它会继续添加请求直到满足条件。\n\n11. **数据验证**：如果提出了请求，则执行数据验证。这涉及收集来自活跃学生的数据 (`data`)\
  \ 并将其与来自信任表的验证过的数据 (`val`) 进行比较。然后对这些数据集应用多项式曲线拟合 (`fit`)。\n\n\n\n\n\n一旦用户通过身份验证，用户将向其相应的库请求资源（参见图\
  \ 12.4）。\n\n![图 12.4 生成的密钥。](img/fig12_4.jpg)\n\n图 12.4 生成的密钥。\n\n## 12.9 实现与结果\n\
  \n数字图书馆是以电子格式存储的学习资源集合。用户可以根据自己的方便随时在线访问这些资源。在这种情况下，数据安全和可用性是这些图书馆面临的重要问题，特别是当资源价格昂贵且有时稀缺时。我们建立了以太坊智能合约以利用图际借用服务和文档传递服务。智能合约允许用户在由所有参与方同意的一组规则的区块链网络上运行代码。这将消除文档传递过程中的第三方角色，图书馆可以直接在网络上与用户共享其资源\
  \ [28]。\n\n我们提出的框架包括参与者/实体、智能合约和区块链网络三个主要组成部分。智能合约是位于以太坊区块链上特定地址的函数及其状态的组合。图 12.5\
  \ 中的代码展示了实例化并部署一个用于执行以太坊上账户的合约。\n\n![图 12.5 在网络上执行账户的智能合约。](img/fig12_5.jpg)\n\n\
  图 12.5 在网络上执行账户的智能合约。\n\n所提模型中的参与实体包括管理员、用户和图书馆。每个实体都有不同的角色，并可以通过调用智能合约函数来执行各种任务。在给的模型中，用户使用用户名和密码登录门户。如果用户凭据有效，他将进入以太坊网络。这将在链中生成一个创世纪区块。用户可以使用“搜索选项”搜索所需的文件。如果文件存在，则会将合约地址分配给该文件，并生成哈希值。该哈希值首先与用户共享。整个交易以区块的形式存储在账本中。如果用户没有访问该文件的权限，将会被要求在网络上注册。通过这种方式，多个用户可以请求共享书籍并在验证后访问它们。\n\
  \n## 12.10 用户登录与注册\n\n在我们的模型中，用户使用用户名和密码登录门户。如果用户凭据有效，他将进入以太坊网络。通过用户界面，用户验证其凭据。只有在身份验证通过后才会授予数据访问。界面转发请求，服务器日志在区块链中授予或撤销权限。服务器更新响应并通知用户。这将在链中生成一个创世纪区块。图\
  \ 12.6 显示了用于注册/登录网络的用户界面。\n\n![图 12.6 用户注册与登录。](img/fig12_6.jpg)\n\n图 12.6 用户注册与登录。\n\
  \n如图 12.6 所示，当用户尝试登录或注册到网络时时，智能合约会创建一个创世纪区块并生成其哈希值。图 12.7 显示了带有其地址的创世纪区块。\n\n![图\
  \ 12.7 初始化网络的创世纪区块。](img/fig12_7.jpg)\n\n图 12.7 初始化网络的创世纪区块。\n\n用户可以使用“搜索选项”搜索所需的文件。如果文件存在，则会将合约地址分配给该文件，并生成哈希值。该哈希值首先与用户共享。整个交易以区块的形式存储在账本中。如果用户没有访问该文件的权限，将会被要求在网络上注册。通过这种方式，多个用户可以请求共享书籍并在验证后访问它们。\n\
  \n\n\n\n\n本章讨论了图书馆在共享资源时面临的当前问题。解释了一种基于以太坊的框架，该框架包含实体（用户、图书馆和电子书）在一个不可篡改且透明的环境中，以实现学习资源的受信任和安全共享。在参与者之间共享数据时，通过一组算法解释了访问控制机制，以维护所有实体的隐私和安全。这有助于减少对中心控制的依赖以及单点故障的风险。该系统通过防篡改的不可变账本提供安全性，因为未经授权的用户无法更改账本。此外，区块链技术为系统提供了一个去中心化的环境，多个用户可以从不同位置访问数据，并在受信任的氛围中获得保护，无无担心信息丢失。所提系统的评估和实验将在后续工作中完成，涵盖包括吞吐量、平均延迟、延迟和\
