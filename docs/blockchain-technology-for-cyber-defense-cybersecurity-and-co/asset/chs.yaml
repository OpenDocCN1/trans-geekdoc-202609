  # 第 3 章 区块链技术助力医疗保健行业的转型\n\nNavneet Kaur 和 Naresh Kshetri\n\nDOI: [10.1201/9781003449515-3](https://doi.org/10.1201/9781003449515-3)\n\
  \n## 3.1 引言\n\n“区块链”是医疗技术领域最流行的流行术语之一。它具有变革医疗行业的力量，因为在充分实施时，它可以完全革新运营模式，将患者置于一切的核心，同时提高安全性、隐私性和可访问性。\n\
  \n这种被称为分布式账本的去中心化且广泛分布的数据库架构，允许多个自主和自我管理的领域进行协作、协调并参与逻辑决策过程。该系统通过一系列无法任意更改的时间戳区块来实现这些属性。相反，区块只能通过共识协议进行更改或添加，这涉及到求解一个数学方程（称为挖掘），直到其满足预设的标准。区块链在医疗和健康保健领域的潜力仍处于起步阶段，相关技术领域已取得了大量研究和进展。医疗保健数据库的核心组件包括安全性、互操作性、数据共享和数据访问。由于安全性是区块链的核心，其属性——如不可篡改性、确保的身份验证、中心化访问和存储——使其成为一种极具前景的解决方案。\n\
  \n由于信息的碎片化和分散，医疗行业一直难以安全地进行通信和访问患者数据。区块链技术可以通过在保持高安全水平的同时允许高度可配置的开放性来解决这一问题。领先的企业正在为区块链革命铺路，这可以通过增强护理和治疗来提高生活质量。医疗行业的中心化环境导致了碎片化和分散的健康信息引发了误诊和误治。\n\
  \n整个医疗保健生态系统的互操作性是一个问题，而对网络威胁和攻击的脆弱性使得保护患者数据变得更加困难。最近的研究显示了医疗保健部门对网络攻击是多么脆弱 [1,\
  \ 2]。信息可能会因勒索软件或拒绝服务攻击而丢失，在许多情况下，信息是无法恢复的。此外，由于访问患者医疗记录会危及医疗保健生态系统的声誉、保险和资金等方面，安全性是一个必不可少的组件。泄露可能会破坏医疗系统，损害患者信任并危害人类生命\
  \ [3]。在医疗保健系统中，信息既是专有的也是机密的。因此，区块链技术在医疗行业中的实施不仅可以实现数据交换完整性的自动化，还能赋予用户验证其数据是否被更改以及如何被更改的能力。\n\
  \n简而言之，区块链可以通过允许在极其分散的医疗系统中在患者同意的情况下更安全、更简单地传输数据，来改善数字健康。由于其开放性和显著的安全水平，区块链技术在医疗和健康领域有许多应用可能。由于新的区块链（BC）解决方案不断演变以及医疗保健系统的增长，很难确定技术现状，因此我们建议进行全面的文献综述。目前的系统性研究旨在通过提供有关技术格局的见解，帮助学术界理解医疗区块链应用中的替代方案和局限性。以下是本章重要贡献的一些亮点。首先，我们将回顾区块链的历史及其显著特征和优势。我们还将讨论一些内部应用以及区块链如何在医疗保健领域被使用。最后，我们关注分析区块链应用中实际和无形问题的困难性。本书章节的其余部分结构如下：本章的目标摘要可以在\
  \ 3.1 节中找到。在 3.2 节中，我们提供了区块链特性和操作概念的高级综述。3.3 节讨论了医疗领域对区块链的需求。3.4 节概述了实施区块链的重要性。3.5\
  \ 节介绍了现有用用例和应用的信息。3.6 节强调了区块链应用中的功能性问题。3.7 节用于结论。最后，3.8 节提供了未来的研究方向。\n\n## 3.2 背景\n\
  \n### 3.2.1 区块链概览\n\n\n\n\n\n二十世纪最重要的发明之一是区块链技术，它吸引了金融服务机构的关注和资金。它在提供运营和监管验证效率的同时，还提高了各行业整个供应链的可追溯性和可见性。区块链是一个分布式账本系统，通过允许点对点的网络加密交易传输给所有用户（无论是公开还是私有的），实现了对任何格式数据的安全、可靠的保存\
  \ [4\\]。不断增加的数据被称为“区块”，它们通过加密安全地连接在一起形成形成链。每个区块都包含一个时间戳、前一个区块的安全加密哈以及交易数据。根据时间戳，与交易相关的数据在区块创建时就已经存在。由于每个区块都构建在前一个区块的信息之上，它们相互连接并形成了一种类似于链的结构。区块链的工作原理是顺序将安全的交易区块添加到链中，并同时将更新后的链传输到网络节点。结果，由于更新后的区块链被持续传播，每个单独区块中包含的交易是不可更改的，区块链的完整性也可以被检查。参与交易的个人使用公标识密钥，而支付者使用只有自己知道知的秘密私钥对交易进行加密签名。这一过程将未完成的交易变成了一个数学难题。通过计算机，“矿工”（人员）生成哈希——每个区块对应一个独特的字符和数字字符串——来解决这一挑战\
  \ [5\\]。\n\n区块链允许通过审计和追溯将新区块与其前驱区块关联。点对点的分布式网络连接了节点（或没有建立信任关系的实体），构成了区块链系统的管理。为了使其有用，区块链必须有某种方式让节点对区块链中的下一个合法区块达成共识。实现这种分布式共识的最常用的两种策略如表\
  \ 3.1 所示：\n\n表 3.1 实现分布式共识的两种策略优缺点\n\n| 策略 | 优点 | 缺点 |\n| --- | --- | --- |\n| 工作证明\
  \ (Proof of work) | 网络中的权力和控制权完全去中心化 | 计算成本昂贵，能耗高 |\n| --- | --- | --- |\n| 增加网络安全性\
  \ | 小规模网络容易受到攻击 |\n| 权益证明 (Proof-of-stake) | 在能源方面更高效 | 相比 PoW，去中心化程度较低 |\n| 高质押具有更大的激励\
  \ | 安全性低于 PoW | |\n| 交易处理速度更快 | | |\n\n*   `Proof-of-work`（工作证明）是经典的区块验证机制，节点通过投入计算力来解决困难的数学问题，竞争生成后续区块。第一个获得解决方案的节点会将其广播到整个网络；其他节点对该解决方案进行验证，然后开始处理下一个区块。\n\
  *   `Proof-of-stake`（权益证明）技术通过允许随机选定的子节点产生每个区块，从而避免了计算问题。选中的概率根据每个实体在系统中现有投资金额进行加权，这通常表示为与特定区块链相关的资产持有价值或持有时间跨度。\n\
  \n### 3.2.2 关键特性/特征\n\n*   `Decentralization`（去中心化）是区块链技术的关键组成。上传到区块链的每条内容都遵循点点网络，并采用几种共识最小化策略之一；内容不是中心化的，并且受到持续监督。\n\
  *   `Data security`（数据安全）是每个区块链交易的首要目标。没有外部实体参与通过区块链进行的数据传输过程，因此没有未经授权访问或操纵的机会。\n\
  *   区块链技术的另一个重要方面是 `openness`（开放性）。账本向多个个人开放。这增加了区块链网络参与者之间的透明度。\n*   `blockchain`（区块链）是可分发的。这能够扩展区块链系统的节点数量，使其不易受到恶意行为者的攻击。通过增加节点的总数，恶意行为者影响区块链共识程序的潜力降低了。\n\
  *   区块链的另一个重要方面是 `persistence`（持久性）。一旦条目在区块链中被识别，就无法删除，因为共享账本存储在许多节点上。此外，区块链在加密上是安全的，确保整个账本中的数据未被篡改且是可证明的。\n\
  *   伪匿名性被许多区块链利用这一事实是它的另一个引人入胜的方面。\n\n### 3.2.3 不同类型的区块链\n\n不同类型的区块链所示图 3.1。\n\n\
  ![图 3.1 各种区块链类型：联盟链、私有链、公链和混合链。](img/fig3_1.jpg)\n\n图 3.1 各种区块链类型：联盟链、私有链、公链和混合链。\n\
  \n### 3.2.4 区块链的优势\n\n区块链的优势如下所示，并在图 3.2 中所示。\n\n![图 3.2 区块链技术的优势。](img/fig3_2.jpg)\n\
  \n图 3.2 区块链技术的优势。\n\n#### 3.2.4.1 去化\n\n分布式存储系统是这项技术的关键部分，增强了安全数据认证。为了创建一个网络或链，每个区块都携带交易数据、前一个区块的加密哈希和一个戳。数据的任何变化都可能引发连锁反应，导致冻结。处理后，每台机器同时锁定，创建数据的不可篡改记录。可以使用区块链框架或现有平台（如\
  \ `Hyperledger` 和 `Ethereum`）创建去中心化应用。这些平台允许程序员在现有区块链之上构建额外的区块链应用。\n\n### 3.2.4.2\
  \ 信任与透明度\n\n在新区块被正确纳入区块链后，修订后的版本将对所有参与者开放。无效的数据区块不会被添加到区块链中，而是被丢弃。参与者使用共识技术作为验证工具来确认数据区块的合法性和有效性。通过在客户之间建立信任和透明度，可以防止数据泄取或篡改。\n\
  \n### 3.2.4.3 隐私与安全\n\n区块链保护交易数据和区块数据免受恶意、内部、敌对和意外威胁。安全和信息技术领域的服务、策略和技术经常用于识别潜在威胁，在它们发生前阻止它们，并在发生时做出适当反应。\n\
  \n区块链隐私是利益相关者或群体将自己与其他数据隔离并能够以易理解的方式交互的能力。交易可以在区块链网络中进行而不泄露个人信息，创建一个私密环境。用户还可以通过谨慎的自我披露来维护合规\
  \ [6, 7\\]。\n\n### 3.2.4.4 可访问性与耐用性\n\n\n\n\n区块链技术提供了全面的安全性。它在网络中维护完全相同的医疗数据块，且由于无法被中心化机构所有，因此不存在单点故障。由于没有中心化机构，所有参与节点的资源都得到了利用，防止了多对一的流量，并确保了灵活性和韧性。这种方法还消除了等待时间，并解决了单步故障的问题\
  \ [8]。\n\n## 3.3 医疗领域的数据透明与安全需求\n\n医疗数据对安全性和隐私有很高要求。隐私是定义谁以及什么应该访问患者机密信息的起点 [4]。为了应对这个问题，已经建立并实施了多种安全标准，例如《健康保险流通与责任法》（HIPAA）、信息和相关技术控制目标（COBIT）以及艾滋病/肝毒地区整合战略（DISHA），以保护患者的健康信息。这需要医疗服务提供者与机构之间达成一致，以采用认可的规范和程序。\n\
  \n自医疗 4.0 时代出现以来，医疗服务提供者日益依赖智能技术。这些技术有助于患者疾病的治疗和诊断，以及用于健康记录管理的患者数据的传输、接收和收集。电子健康记录（EHR）系统上记录的数据质量对医疗服务提供者至关重要；此类数据必须始终无风险且安全。随着大数据的出现，医疗记录的数量和复杂性已不断增加，但仍未得到优化。记录频繁出现重复、使用不同的身份/命名规范导致不匹配，并发布在医疗系统的许多网络和目录中。医疗记录的安全性变得越来越关重要，以保护数据免受安全泄露和犯罪活动。未经授权的用户可以交易或将患者数据暴露给公众，让任何拥有数据访问权限的人了解有关患者的知识。地址、电话号码、全名和其他个人信息可能被包含在。\n\
  \n患者数据的机密性对于良好的医疗管理至关重要 [7]。针对这些问题，一些国家建议或建立了针对医疗系统的监管规范，以最大限度地减少网络风险，从而提高患者的隐私性和对医患关系的信任。如今，大多数医疗系统采用中心化的客户端-服务器设计，由中心机构拥有系统的完全访问权限。在这种情况下，缺乏隐私或安全问题可能会导致系统崩溃，可能允许网络犯罪分子访问患者数据。\n\
  \n医疗系统相当复杂，包含许多不同的领域，每个领域都包括医生、研究人员、从业人员、支持人员、管理人员和患者 [9]。这使得组织和维护患者数据成为了一项艰巨的任务，并带有高昂的维护保养费用\
  \ [10]。不同医疗部门不同的数据架构和独特的操作进一步加剧了这个问题。这些因素使得不同医疗部门之间有效交换医疗信息面临极大的挑战。因此，需要一个能够管理、维护和管理医疗信息及记录的系统。由第三方维护的传统个人和\
  \ EHR 系统仍然面临重大的信任、隐私和数据安全问题。由于对隐私和数据安全的担忧，传统的电子医疗方法缺乏透明度，无法满足利益相关者的隐私需求。区块链技术为解决医疗系统中巨大且极其多样化的数据严重问题以及安全相关问题提供了巨大的可能性\
  \ [11]。\n\n## 3.4 将区块链技术整合到医疗系统的意义\n\n区块链技术正在改变医疗应用治理和数据管理范式。这主要由于它的多功能性以及拆、分发和保护医疗信息的特殊能力。数据安全是医疗行业的一个大问题。由于过时的遗留\
  \ IT 设计，大多数医疗机构将私人医疗记录保留在一个中心位置，容易受到间谍活动和其他安全泄露的影响。事实上，基于区块链的技术可能对于组织、处理和分发个人医疗记录有用；它还可能帮助解决数据安全问题，并支持医疗行业的数字化\
  \ [12]。\n\n此外，医疗行业目前正领先开发基础设施、计算机程序员和战略策略，以可靠且一致地结合他们可以获得的各种类型的数据 [13]。区块链在应用上非常灵活，这种灵活性源于它应用于各种操作的能力。基于区块链的解决方案改进了通信和透明度，为患者和医疗提供者带来了显著优势\
  \ [14]。医疗行业的主要重点是利用现代技术来提高医疗系统的有效性和效率。\n\n将区块链整合到医疗行业分为几个阶段。在初始阶段，医疗专业人员以前所未有的访问区块链；所有临床数据都在当前的健康信息系统内部监控和保存。通过应用程序接口（APIs），患者\
  \ ID 用于为区块链网络提供各种患者相关数据。然后使用区块链系统的智能合约来完成传入的交易。所有区块链网络交易都使用患者公共 ID 执行，这些 ID 不包含任何个人数据。区块使用不可篡改的账本构建并连接。之后，所有交易都被提交并唯一识别。医疗供应商使用\
  \ API 启动查询处理或反向挖掘。区块数据库仅包含不可识别的患者数据，例如年龄、性别和状况。临床数据被分析以获得新的见解。最后，如果患者决定向医疗专业人员透露自己的身份，可以共享私钥。这允许临床医生访问患者数据，并对检测到的症状提供解决方案或治疗。自然，没有患者加密密码的人无法访问这些信息\
  \ [15]。在这一部分，我们将查看分布式账本技术在医疗领域的一些常见应用和优势。\n\n### 3.4.1 增强远程医疗的信誉\n\n\n\n\n\n随着远程医疗服务的普及，数据的安全性和机密性正日益受到关注。在患者、医疗设备和医疗保健提供者之间，区块链技术可以建立一种数字信任链，确保授权网络参与者能够安全地传输\
  \ `EHR`（电子健康记录）。自执行智能合约会自动运行，并且仅在满足预定义条件时采取行动，这是基于区块链的技术提高医疗保健领域可靠性和信心的另一种方式。区块链交易是加密的，可以防止第三方操纵；由于其不可篡改性和实时可见性，培养了信任和透明度，确保没有人能为了个人利益而操纵数据。\n\
  \n### 3.4.2 身份验证\n\n区块链技术为身份验证提供了一种安全的方法，因为它使用了带有唯一授权密钥的加密账本。爱沙尼亚政府和荷兰数据安全公司“Guardtime”共同开发了一套用于患者身份验证的区块链系统，每张智能卡都连接到网络中的一个区块，作为数据访问或更新的认证密钥。\n\
  \n### 3.4.3 临床研究\n\n区块链可以通过提高数据完整性和促进利益相关者之间的信任，来转变临床试验的问责制和透明度。它确保了数据记录不可更改，防止了药公司更改试验结果。区块链架构可以进行定制，仅添加确认的数据点，从而在数据所有者不共享或放弃控制权的情况下实现同行评审。这种方法解决了临床试验中可验证的数据完整性、数据交换和合作信任等问题。\n\
  \n### 3.4.4 药物追溯性与供应链可见性\n\n在中低收入国家，每十件医疗物资中就有一个劣质或伪品，这使得假药对公共健康安全构成了严重威胁。持续的疫情加剧了这些问题。区块链技术可以通过跨分布式网络跟踪药物产品的来源和有效性，来提高供应链的可见性。其不可篡改的数据和共享账本有助于减少欺诈并建立建立产品验证系统。这可能有助于识别和报告假药或非法药物。国际业务机器（IBM）区块链透明供应链解决方案提供了跨合作伙伴的特定产品透明度，确保供应链完整性、打击盗窃和欺诈、降低成本和等待时间，并在利用数据数字化的同时解决药物追踪的法律规范。\n\
  \n### 3.4.5 保险理赔\n\n保险市场面临的挑战包括建立信任、管理数据和应对身份盗用。区块链技术可以帮助打击欺诈理赔、自动化理赔流程并减少医疗保健领域的身份盗用。例如：\n\
  \n* 区块链网络防止交易的被篡改，确保只有授权的节点可以访问数据，降低了欺诈风险。\n* 智能合约自动处理理赔流程，提升了客户体验。\n* 由于没有中央服务器，消费者仍然可以访问其身份信息，所有价值链参与者都能看到变化，降低了身份盗用风险。\n\
  \n### 3.4.6 信息共享可行性\n\n区块链网络可以复制到同一设施或医疗服务网络内的其他站点，实现准确、可靠且一致的医疗数据共享。该技术允许研究人员、合作机构和保险公司将数据上传到区域性的区块链，并将其传播到同一网络内的多个站点。新位置也共享数据，将其分布到整个网络，允许访问最新信息。\n\
  \n## 3.5 区块链技术在医疗保健的应用\n\n区块链技术最初为加密货币和经济设计，目前已应用于多个领域，包括遗传学、医学、远程医疗、电子健康、远程监控、个性化医疗保健和神经科学。得益于其保护和稳定数据集的能力，它是多个行业的重要参与者。下文提到的几点讨论了区块链技术具有巨大潜力的某些医疗和健康领域。\n\
  \n### 3.5.1 用于电子健康记录的区块链技术\n\n由于医疗保健对高效决策的需求日益增加，医疗文档的数字化已变得至关重要。区块链技术被用于管理长期记录，允许患者访问其当前和历史医疗保健数据，减少数据的分散。学者认为，区块链技术可以为处理\
  \ EHR 提供一种创新方式。\n\n`MedRec` 是一个由区块链驱动的平台，促进数据交换、认证、秘密性和完整性。它为用户提供了方便访问来自许多医生和治疗中心的个人健康记录和医疗记录的方法\
  \ [[16]]。`MedRec` 在存储医疗记录时不进行任何调整。它为患者提供建议并存储记录标记，允许患者控制其位置。该系统将控制权从机构转移给患者，强化了他们的所有者角色。管理协会作为不处理信息的患者代理。`MedRec`\
  \ 架构还集成了一个用户界面，以改善与其他机构医疗记录的长期关联。\n\n`MeDShare` 是由 Xia 等人开发的用于医疗保健信息共享的 s 区块链框架\
  \ [[17]]。`MeDShare` 解决了 EHR 采用中的问题，如受保护的数据跟踪溯源、审计和管理丢失。`MeDShare` 提供了数据的数据溯源、个性化的审计控制和更少的安全风险，使其成为云服务提供商和医院之间共享\
  \ EHR 的理想解决方案。\n\nEHR 数据对于准确诊断和有效治疗至关重要，但其存储、传输和分布可能对患者健康构成严重风险。癌症和艾滋病毒等疾病会增加此类危害的发生率。因此，维护最新的患者记录对于确保患者获得正确的治疗至关重要，特别是那些需要大量随访、康复以及术前后治疗程序的人。\n\
  \n区块链技术可以应用于临床环境，正如 Dubovitskaya 等人 [[18]] 提议的用于加密数据存储以及访问控制的许可区块链系统，该系统允许管理、维护和共享有关癌症患者的电子医疗信息。\n\
  \n区块链技术的快速发展使爱沙尼亚处于该领域的前沿，这归功于其医疗记录工作，该工作使用区块链技术在保持数百万医疗信息秘密的同时，允许医生和保险公司访问 [[19]]。\n\
  \n\n\n\n医疗领域的区块链技术驱动力在于为患者提供不可篡改医疗记录的承诺。该技术能够快速识别并标记任何访问或修改的尝试，确保患者数据的完整性，并检测如欺诈或记录篡改等非法活动。它还简化了持证制药服务的记录交换与审查，使供应商能够感知患者的就诊情况。在患者护理算法中使用区块链技术，可以快速记录药物缺陷、过敏反应和药物解决方案。这增强了临床数据确认、安全性、医疗记录管理和护理规划的效率，而无需完成耗时的药物妥协表\
  \ [20]。\n\n### 3.5.2 用于临床研究的区块链技术\n\n临床研究面临着数据隐私、完整性、共享、记录保存和患者招募等挑战 [21]]。这些问题可以通过区块链技术、`Artificial\
  \ Intelligence`（`AI`）以及机器学习来解决。医疗保健研究人员越来越多地使用区块链来解决这些问题，这为医疗行业的重大变革开启了大门 [22]。\n\
  \nTimothy 等人的 [23] 研究表明，许可链 `Ethereum`（一种具有智能合约能力的区块链协议 [24, 25]）可以与临床数据管理系统结合使用，解决患者招募问题。研究发现，`Ethereum`交易的完成速度比`Bitcoin`交易更快，表明`Ethereum`智能合约可以增加临床试验的数据透明度，特别是通过区块链进行患者招募。\n\
  \nMehdi Benchoufi 的 [26] 研究利用区块链技术设计了一个用于获取患者知情同意追踪的框架，确保了一种安全、公开验证且不可伪造的追踪方法。\n\
  \n### 3.5.3 用于检测医疗欺诈的区块链技术\n\n区块链技术正被医疗部门用于管理处方药供应链，由于行业的复杂性，这是一个至关重要的问题。供应链的任何破坏都会对患者的健康产生负面影响\
  \ [27]。区块链提供了数据透明度和产品可追溯性，为防止欺诈和提高供应链安全提供了一个安全的平台。然而，区块链的操纵具有挑战性，因为记录只能通过智能合约进行验证和修改\
  \ [28]。总体而言，区块链技术是医疗保健领域非常有价值的工具。\n\n### 3.5.4 用于神经科学的区块链技术\n\n以消除与外界的机械连接并通过精神指令控制物品和数据为目标，神经学是区块链应用的一个重要课题\
  \ [29]。这些神经设备可能利用神经活动来推断人的心理状态，同时分析大脑活动模式并将其转换为外部设备的指令。它们使用带有传感器、计算处理器和无线连接的神经接口设备来读取和解释脑电信号。\n\
  \n总部位于日内瓦的 Neurogress 公司利用区块链技术解释大脑的电活动并将其传输至控制设备。该公司使用头部的单个设备来存储脑电信号。\n\n### 3.5.5\
  \ 用于研究和制药业的区块链技术\n\n化学制药行业是医疗保健领域增长迅速的部门，负责引入新药并确保医疗用品的安全。它支持安全的药物检查和处理，促进患者更快康复。然而，由于假药和伪劣的存在，及时的产品追踪可能会带来风险，凸显了改进供应链管理的必要性。假药的生产和分发构成了重大的全球健康风险，尤其是在贫困国家。研究基金\
  \ `Hyperledger` [30] 开发了一种基于区块链的系统，用于评估、监督和确保开发、生产和研发期间的药品生产过程，旨在打击和验证假药制造。数字技术对于药品的生产和运输至关重要，特别是在发展中国家，以确保合法可靠药物的有效分发。实施数字药物控制系统（或\
  \ `DDCS` [31]）可能有助于遏制假药销售。赛诺、`Pfizer` 和 `Amgen`这三大最大的制药公司合作启动了一项集成试点项目，利用基于区块链的\
  \ `DDCS` 对创新药物进行检查和评估 [32]。这将提高药物供应链的信誉 [33]，改进对假冒药物的监测 [34]，并保证给客户或终端用户的药物的有效性。\n\
  \n\n\n尽管区块链技术消除了交易中中间人的需求，但它使数据暴露于潜在的机密性和安全威胁之下。由于区块链系统允许组织中的每个人验证记录，数据隐私受到了损害，因为所有节点都可能查看某个节点提供的数据\
  \ [35]。在紧急情况下，患者必须选择代表来访问其信息和病史，这给数据隐私和安全构成了风险。高安全性技术阻止了块之间的数据传输，且区块链网络容易受到 `51%`\
  \ 攻击，使得块与块的数据传输变得困难。这可能导致对患者详情的访问部分或不完整。一组控制了区块链网络超过 `50%` 区块的矿工曾发动过影响五种加密货币的攻击。该攻击允许矿工在未经许可的情况下控制网络，可能停止新的交易。\n\
  \n一种解决方案可能是使用轻量级数字签名技术 [36] 来确保数据完整性，并向患者发送收据。由于患者医疗数据的敏感性，患者医疗数据的匿名化至关重要。轻量级环结构和数字签名\
  \ [36] 可用于确保匿名性，允许签名者匿名签署数据。双重加密系统或密钥交换方法（如 `Diffie-Hellman` 密钥交换技术）也可以防止医疗设备或健康数据被篡改。\n\
  \n### 3.6.2 存储容量管理\n\n区块链最初设计用于交易数据存储，但由于其扩展到医疗行业，在管理存储容量方面面临着挑战。由于包括患者记录、健康史和医学图像在内的大量数据需要存储空间，区块链需要大量的存储空间\
  \ [37, 38]。此外，基于交易的数据库快速扩展使其不适用于对速度有要求的交易。因此，区块链解决方案必须同时具备可扩展性和健壮性，以处理医疗领域日益增长的数据量。作者\
  \ [11] 建议使用具有加密安全、数字签名和加密方案的云存储系统来解决交易安全问题。他们建议将交易存储在单独区块中，并使用 `Merkle tree` 创建组合哈希，从而维护第三方之间的信任。\n\
  \n### 3.6.3 互操作性问题\n\n区块链在互操作性方面面临挑战，这阻碍了医疗生态系统中的数据共享。由于存在具有不同安全和隐私需求的多个利益相关者，共享远程设备生成的医疗数据具有挑战性。医疗机构无法负担起现代化或数字化以提供远程服务的费用，导致缺乏透明度，并且无法追踪保存在服务器上的交易或数据。这一问题影响了专家和患者的职业，使得难以有效共享医疗信息\
  \ [39]。\n\n### 3.6.4 数据共享\n\n区块链技术对于健康信息的传递至关重要，但安全担忧仍然存在。从历史上看，数据记录一直可用，除非直接参与患者治疗的人。但区块链的隐私范式更像医学研究，保持患者的隐私或匿名。为了减少公钥与患者关联的风险，必须努力降低分析将公钥与患者关联的概率。区块链去中心且透明的结构可以防止数据窃取，但用户仍可以通过伪匿名身份或数据模式被追踪。\n\
  \n区块链架构的核心价值是一个不可修改的交易数据库，但它可能会削弱受保护健康信息 (`PHI`) 的匿名性。为了解决这个问题，可以将去标识和加密的信息添加到区块链中，确保安全且符合\
  \ HIPAA 标准的 `PHI`。对这些数据的访问限制在使用 `smart contracts` 和秘密私钥的特定专业人员。谨慎地维护此密钥就像保护社会安全号码或医疗保健记录的安全一样。区块链技术的优势在于其能够在不损害独特信息的前提下确认交易的能力。\n\
  \n### 3.6.5 标准化挑战\n\n区块链技术的实施仍处于初步阶段，因此在通往医疗应用的应用的道路上，标准化方面无疑会存在困难。组织需要提供经过认证和认可的标准，以评估交换的数据、类型和结构。这些标准将作为安全措施。\n\
  \n### 3.6.6 社会困难\n\n区块链技术的应用仍处于早期阶段，因此由于其方法从根本上不同，面临着社会文化方面的挑战。医疗行业正在逐步数字化，但在完全接受新技术（尤其是像区块链这样的技术）方面还有很长的路要走。需要时间和精力来说服医生接受技术而非纸质记录。\n\
  \n提供的技术在健康行业的采纳率较低 [39]，这使得它们不可信，且无法为所有医疗问题提供完整的答案。\n\n### 3.6.7 成本\n\n用于数据共享的区块链技术需要节点网络，由于需要医疗社区的支持以及维护网络的计算能力，这具有挑战性。这可能导致较高的硬件成本和能源消耗。为了解决这些问题，对区块链参与者的奖励可以增加利用。区块链应用程序发布的令牌可以交换扩展存储、更快的信息传输或访问数据仓库等服务。令牌也可以用\
  \ `Bitcoin` 或美元进行交易。\n\n### 3.6.8 技术困难\n\n最后，除了技术和监管问题外，所提框架的实用价值将受到终端用户体验的影响。区块链交易包含了我们预计大多数人并不熟悉的加密概念。尽管如此，所提的方法需要患者创建和管理密钥对、提供加密签名并发布授权访问其医疗数据和记录的交易。这些操作背后的复杂性必须隐藏在足够用户好的界面之后，该界面将作为\
  \ Web 和/或移动应用程序实现。增强终端用户体验可能是挑战性的。\n\n## 3.7 结论\n\n\n\n\n\n当今的世界很大程度上依赖信息和通信技术。遗憾的是，医疗健康行业正受到数个问题的困扰，包括缺乏以患者为中心的倡议、系统间互操作性差、连接异构系统的挑战、`EHRs`\
  \ 的访问性问题以及与隐私相关的问题。\n\n近年来，`blockchain` 在医疗领域的应用引起了越来越多的关注。因为 `blockchain` 能够在保留匿名性、安全性互操作性、验证和身份认证的同时管理健康信息相关问题，它为医疗行业展现了巨大的潜力。医疗保健数据泄露、未报告的临床试验和数据不准确只是\
  \ `blockchain` 技术所解决的几个相关现代问题。`EHR` 管理可能涉及 `blockchain` 感的几个领域。\n\n广泛的人群将受益于 `blockchain`\
  \ 技术在医疗行业中的实际应用，包括医学专家、医生、研发专家和科学家。海量数据的有效共享、科学知识的共享以及在提高安全性和保障隐私保护的前提下进行想法的共享，都是其中的一些优势。由于可能的数据完整性，医疗健康行业可能会很快采用\
  \ `blockchain` 来实现新目标。\n\n通过基于 `blockchain` 的医疗保健框架，人们将更积极地参与到自己的医疗健康中，从而提高生活质量。分布式账本在医疗机构中的使用在当今市场中至关重要。它可以实现数据收集和验证的自动化程序，获得来自多个源的精确且整合的不可更改且防篡改的数据，以及降低了网络犯罪风险的安全数据。系统还允许分布式数据存在，并具有容错能力和冗余性。本研究强调了医疗健康行业正面临的当前问题。\n\
  \n本研究对采用 `blockchain` 时与医疗健康部门相关的益处和挑战进行了深入分析。本章还关注了以往的研究及其核心观点和困境。我们讨论了 `blockchain`\
  \ 技术的基本原理，并概述了一种可以在不需要中心化权威的情况下实现患者控制的跨领域医疗数据的 `blockchain` 实现方案。这种方法具有许多优点，我们特别强调了\
  \ `blockchain` 如何满足医疗系统的许多需求。在将 `blockchain` 作为交换健康信息的结构之前，考虑不同方案的相对优势并留意该技术非常重要的局限性将是重要的。\n\
  \n尽管存在这些缺点，本系统综述的结果表明，尽管存在各种观点和方法且缺乏实际应用，但现有文献对该主题表现出相当大但新兴的兴趣。`Smart contracts`\
  \ 已证明自己是 `blockchain` 网络上满足特定条件时管理点对交易的有效技术。`blockchain` 技术在医疗健康领域的整合可以改善患者和整个医疗系统的成果。然而，为了对医疗健康中\
  \ `blockchain Smart Contracts (SCs)` 的应用和成就得出更确定的结论，还需要更多实践研究。\n\n## 3.8 未来展望\n\n\
  最近开发的 `blockchain` 理念一直是推动若干重要去中心化尝试的主要发明，因此探索其与医疗行业问题的关联性是合理的。毫无疑问，基于 `blockchain`\
  \ 的系统在临床医疗环境中的成功采用将为生物研究的发展创造新机会。相反，医疗信息安全、可靠且可扩展的收集、存储和交换将促进医疗精准应用中疾病识别和管理预测方法的进展。\n\
  \n`blockchain` 技术在存储神经技术实验数据中的应用仍处于探索阶段。只有少数公司进展到了这一步。\n\n\n\n\n\n5. Zheng, Z.;\
