  \ [21] 在最终分析中显示，第一代和第二代区块链（BC）被用于构建本研究涉及几乎所有的用例。目前开发的用例集中在加密货币和智能合约或 dApp（区块链 1.0\
  \ 和区块链 2.0）。dApp 属于第三代区块链 3.0，它们通过连接创建 DAO。当连接的 DAO 在更复杂的环境中时，形成了去中心化自治社会（DAS）。本研究证明了基于区块链的\
  \ PHR 和 EHR 在实现分布式自主医疗环境中的重要性。为了实施 DAO 和 DAS，预计需要研究五个研究挑战（RC）（BC 3.0）：\n\n  1. `RC1`：其他类型区块链中隐私与去中心化的权衡。\n\
  \  2. `RC2`：去中心化最大的优势在采用混合区块链的用例中最为明显。\n\n\n\n\n3. **RC3:** 去中心化电子健康记录（EHR）与个人健康记录（PHR）在中心化存储系统的结合。\n\
  4. **RC4:** 通过实施 `DAO` 和 `DAS` 建立去中心化的自主医疗生态系统。\n5. **RC5:** 在考虑 `RC1`、`RC2`、`RC3`\
  \ 和 `RC4` 的情况下，实施 EHR 和 PHR 的概念验证。\n\n* **Rocha 等人 (2021)** [5] 开发了一种农食品供应链管理方法，该方法代表了\
  \ `SmartAgriChain`，它以清晰且合理的成本提供了系统开发所需的所有能力，该系统目前仅完成了一部分，并允许使用 `RESTful` `API` 进行遗留系统和通信。尽管事务处理器的逻辑仍需进一步完善，但它已经支持了用例认证和农食品管理所需的大多数程序。在\
  \ `SmartAgriChain` 的帮助下，生产者可以更有效地管理其供应链，同时在升级现有链的同时，确保所有阶段的安全性、透明度、可溯性和产品追踪。日益明确的是，技术将通过拉近消费者和生产者之间的距离带来新的食品消费模式和产品。因此，客户将能够接入一个平台，简单快速地（例如通过手机）决定他们购买的商品是否符合可验证的可持续农业实践和理智消费主义。此外，该平台不受限于特定类型的认证，将具有各种工具来简化和增强农产品源物品的认证过程。认证机构、生产者和寻求认证服务的零售机构都将在未来的\
  \ `SmartAgriChain` 阶段汇合，负责监督已建立的认证流程管理、相关的认证专家和/或生产或认证行业的咨询公司。从更技术角度角度应该提到，这种基于区块链的网络为系统提供了显著的可扩展性，并确保了安全性、去中心化、透明性和可追溯性。该倡议的第二个目标是数字化并加速农食品的认证程序。\n\
  \n* **Adefisayo Akande (2018)** [22] 证明了基于区块链的技术可以有效用于保险领域的流程创新。其目标是描述目前的保险模型，并证明区块链如何支持和促进整个行业价值链的创新，不可避免地导致具有更多创新子过程的新业务模型（To\
  \ - Be）的出现。提供的理论主张和建议将作为额外研究的起点。结果，我们对主要研究问题提供了答案。结论是，2017 年《世界保险报告》充分证明了客户偏好和行为的变化。它认为，保险公司必须进行适当的技术投资以保持未来的竞争力，并且必须拥有详尽的保险科技策略以促进合作。目前大多数解决方案已经研究了技术的可能性，但仍需进一步研究以确定长期来看将如何影响医疗生态系统和整个价值链，特别是对于医疗系统，以实现理想的\
  \ `DAO` 和 `DAS` (`BC` 3.0)。\n\n## 5.2 自主权身份\n\n自主权身份是任何个人、群体或物品的终身可转移身份，它独立于任何中心化权力之外，且无法被剥夺。\n\
  \n作为一种新型基础框架的要求（我们简而言之称为自主权身份），`SSI` 指个人或组织对其自己的模拟和数字身份拥有完全所有权，并能够调节其个人信息如何被共享和利用。用户对于管理自己的身份至关重要。这提供了一种灵活性和安全性，使身份持有者仅披露任何特定接触或交易所需的信息。\n\
  \n赋予个人或组织管理身份信息的权力，强调了身份不仅仅是登录，因为这个解释似乎有点不够清晰。\n\n考虑到在调查开发过程中所考虑的研究和应用 [21]，汇总了其相关特征（见图\
  \ 5.8）。带有时间戳的不变数据历史、去中心化验证、自执行智能合约、透明性、互操作性、去中心化价值转移系统和游戏化是这些应用的一些关键 `BC` 特性 [21]。\n\
  \n![图 5.8 医疗和用例中的 BC 特性。（基于 Bahar Houtan 2020。）](img/fig5_8.jpg)\n\n图 5.8 医疗和用例中的\
  \ BC 特性。（基于 Bahar Houtan 2020。）\n\n### 5.2.1 自主权身份遵循的原则\n\n自主权身份必须遵循的十项原则，以确保个人拥有自己的身份：\n\
  \n1. **存在性：** 用户必须是自给自足的。\n2. **控制性：** 用户必须维持身份控制。\n3. **访问性：** 用户身份必须是可访问的。\n4.\
  \ **透明性：** 必须使用透明的系统和方法管理身份。\n5. **持久性：** 长期身份和主张。\n6. **可移植性：** 身份相关数据必须能够在之间易于携带。\n\
  7. **互操作性：** 用户身份主张应当适应各种行业、企业甚至国家。\n8. **同意：** 用户必须接受其身份和主张可能被使用和披露。\n9. **最小化：**\
  \ 为了保护隐私，限制身份和主张的披露是重要的。\n10. **保护：** 用户的权利必须受到保护。\n\n### 5.2.2 身份写入类型的基本概念\n\n\
  **信任三角：** 在此场景中有三个主要的利益相关者（见图 5.9），信任三角概述了凭证是如何授予和使用的。\n\n![图 5.9 展示了三个主要的利益相关者。](img/fig5_9.jpg)\n\
  \n图 5.9 展示了三个主要的利益相关者。\n\n1. **持有者：** 持有某些属性或凭证的主体。\n2. **发行者：** 身份信息的提供方\n3. **验证者：**\
  \ 请求信息的方。\n\n如果我们想证明自己的身份，例如开银行账户，我们需要通过政府身份证进行身份验证。该身份证是由政府颁发给我们的数字凭证，并由政府签名，使其成为一个经过验证的凭证。然后，我们可以向验证者（在本例中为银行）展示证明和验证过的凭证。由于银行信任政府，我们在深入研究主体之前，已经在所有参与者之间建立了信任关系。我想定义一个属性。属性描述了一个人的资质，但不一定特定于某个人。\n\
  \n这些包括身高、体重和性别等参数。\n\n\n\n\n由第三方产生的经过验证的文档（例如公民身份证明、大学学位或会员状态）同样可以作为一种属性。我们可能会问自己：“凭证的数据从何处开始？”尽管我们目前还没有统一的答案，但\
  \ `SSI` 社区已经决定，这些数据不应存储在区块链上。只有去中心化身份（`DIDs`）以及短信息，在需要时还有签名被存储在区块链上。而在去中心化的数据存储中，身份识别数据本身被维护。\n\
  \n在这些去中心化标识符中，针对特定用例或领域具有法律和实际影响的真实身份（例如电话号码、护照号码或电子邮件地址）被称为 `DID` 标识符。\n\n撰写数字身份是因为去中心化标识符充当了验证自我的标记。由于\
  \ `D IDs` 注册在分布式账本技术或其他区块链等形式的中心化网络中，它们完全由 `D ID` 持者控制，并独立于任何中心化注册身份提供程序或证书机构。它们本质上是全球唯一的标识符。\n\
  \n自主主权身份（`SSI`）是一种去中心化的身份概念，它使人们能够在不需要中心化机构或中间人的情况下，掌控自己的数字身份和私有信息。许多行业将 `SSI` 用于各种目的。\n\
  \n## 5.2.3 自主主权身份的用途\n\n*   **数字身份验证：** 在 `SSI` 的帮助下，人们可以在线安全且隐私地证明自己的身份。这对于创建银行账户、提交工作申请或使用政府服务等任务非常有益。\n\
  *   **访问控制与权限：** 通过 `SSI`，人们可以管理谁可以访问其个人数据。用户授予或撤销特定个人或组织访问数据的权限确保了数据隐私和安全。\n* \
  \  **医疗：** 患者可以在管理健康记录并与医疗提供人员或人员共享特定医疗信息的同时，保持对敏感数据的控制。\n*   **教育：** 在 `SSI` 的帮助下，你可以安全地管理和发放学位、证书等教育凭证。对于公司和教育机构，这使得验证过程变得更加。\n\
  *   **银行服务：** 在银领域，`SSI` 可以提高安全性并简化流程。通过将其用于 `KYC`（了解客户）程序，可以减少欺诈和身份盗窃。\n    * \
  \  护照和其他旅行证件可以作为自主主权身份存储，有助于更安全、更高效的海外旅行。\n*   **投票与选举：** `SSI` 可用于透明且安全的在线投票，降低选民欺诈的可能性，并维护选举的完整性。\n\
  *   **物联网（IoT）：** `IoT` 生态系统设备可以拥有自己的自主身份，能够与其他 `IoT` 生态系统设备及服务进行安全通信。\n*   **政府服务：**\
  \ 使用自主主权身份，公民可以访问政府服务、报税并领取福利，提高效率并降低行政成本。\n*   **供应链与产品认证：** `SSI` 可用于跟踪物品跨越供应链的移动并验证其真实性，这有助于防止伪造并确保产品质量。\n\
  *   **去中心化金融（DeFi）：** 用户可以在管理其 `DeFi` 资产与去中心化应用程序（`DApps`）交互的同时，控制自己的金融身份。\n*  \
  \ **在线服务与社交媒体：** `SSI` 可以增加用户隐私，并让个人对在线账户和数据的更多控制，减少数据泄露。出于慈善目的捐捐可以使用 `SSI` 进行跟踪和验证，确保整个捐赠过程的问责和透明度。\n\
  *   **法律与公证服务：** 通过促进安全的文档签署、合同管理和公证，`SSI` 可以加速法律流程。\n    *   **人道主义援助与难民支持：** `SSI`\
  \ 可以为流离失所的人和难民提供安全的数字身份，增强获得必需和帮助的能力。\n\n## 5.3 医疗领域的区块链\n\n区块链是一种用于存储医疗记录并确保记录真实性和完整性的系统，不需要中心权威或中介。它提高了稳定性，但也展示了其易受黑客攻击的脆弱性。如果记录需要传输到医院的不同区域，或者在医生之间切换，或传输到另一个建立了统一电子病历的医院环境，它为设施提供了不同个人或群体之间共享医疗记录的能力（如`图\
  \ 5.10`所示）。此外，许多用例（如保留电子健康记录 (`EHR`) 中的中的访问权限和简化理赔处理）已经证明了区块链作为增强医疗数据真实性和开放性平台的潜力[12]。\n\
  \n![图 5.10 区块链中区块的描述（B 市）和交易的执行（A 市）。](img/fig5_10.jpg)\n\n`图 5.10` 区块链中区块的描述（B\
  \ 市）和交易的执行（A 市）。\n\n### 5.3.1 不可变的交易账本\n\n`Bitcoin` 加密货币的基础设施是区块链的最初目的。从一个账户到另一个账户的特定\
  \ `Bitcoin` 金额转账由区块链上的交易表示。通过正确的软件工具查看公共区块链上的交易，任何人都可以确定 `Bitcoin` 属于哪个账户。\n\n医疗行业中的交易将是医疗服务某些事件的记录。现在维护在\
  \ `EHR` 系统中的临床信息、支付方理赔历史和护理缺口、患者设备读数以及家族史可能都包含在内。受健康信息泄露影响的人数将被加密并保留在区块链中，只有拥有患者私钥的人才能对其进行解密（`图\
  \ 5.11`）。\n\n![图 5.11 金融与医疗交易的示例。（基于 Drew Ivan 2016）。](img/fig5_11.jpg)\n\n`图 5.11`\
  \ 金融与医疗交易的示例。（基于 Drew Ivan 2016）。\n\n账本无法被更改或删除，因为它是不可更改的。更新包含了指示修改日期、时间、地点和实体的元数据信息。基于区块链的医疗记录将这样实现自审计（如`图\
  \ 5.12`所示）。\n\n![图 5.12 区块链技术的步骤。（基于 Abid Haleem 2021。）](img/fig5_12.jpg)\n\n`图\
  \ 5.12` 区块链技术的步骤。（基于 Abid Haleem 2021）。\n\n对于不同的数字交易，可以集成区块链技术来创建一个可靠、去中心化且不可变的账本，其性能优于目前的方法、策略和程序[19]。此外，医疗系统的格局正在转向以患者为中心的策略，重点关注两个关键组成部分：易于获得的服务和始终合适的医疗资源[17]。\n\
  \n\n\n\n\n区块链技术在医疗保健行业中的主要用途包括：\n\n1. **电子健康记录 (EHRs)：** 在区块链上安全地存储患者记录和病史，以确保数据的完整性、隐私性和可访问性，这是区块链在医疗保健领域的主要用途。\n\
  2. **药物追溯：** 监控药品业务中的供应链，以防止假药的引入。\n3. **临床试验：** 确保数据的透明和不可篡改性。\n4. **患者知情与身份验证：**\
  \ 确保患者知情书管理和身份检查的安全。\n5. **医疗供应链：** 监控并改进药物和医疗用品的流动。通过远程医疗和远程患者监测促进患者与医疗人员之间的安全接触。\n\
  \n### 5.3.2 区块链在医疗保健中的优势\n\n* 得益于区块链，医疗机构能够提供适当的患者护理和顶级医疗服务。\n* 交换健康信息也是一项耗时且具有重复性的活动，这导致了医疗行业的成本。区块链在这里再次大放异彩。\n\
  * 公民可以使用区块链技术参与健康教育计划。\n* 此外，改进的公共福利研究和数据共享将改善许多群体的护理。\n* 区块链可以与最强大且影响力最大的技术相结合，用于研究目的并造人类造益（如图\
  \ 5.13 所示）。区块链确保了我们的安全性、透明性、可追溯性的许多利益。\n\n![图 5.13 未来的创新技术。（基于 [23], Raconteur 2016。）](images/fig5_13.jpg)\n\
  \n图 5.13 未来的创新技术。（基于 [23], Raconteur 2016。）]\n\n### 5.3.3 区块链如何满足医疗保健需求\n\n通过图 5.14，这里有一个高层图，清晰地展示了区块链如何满足医疗行业的需求。该图还显示了区块链的一些重要应用。\n\
  \n![图 5.14 此图表明医疗需求与区块链的。](img/fig5_14.jpg)\n\n图 5.14 此图表明医疗需求与区块链的。\n\n1. **数据共享：**\
  \ 考虑到多种因素，数据共享是医疗护理行业的一个基本需求：\n    * **协调的患者护理：** 成功的医疗服务传递通常需要多个供应商的共同努力，包括关键考虑因素医生、领域专家、诊所、实验室和药店。信息共享使这些合作伙伴能够尽可能地获取重要的患者数据，从而促进更有组织、更全面的护理。\n\
  \    * **临床决策：** 获取详细的患者信息（包括病史、测试结果和治疗方案）可以提升临床决策并有助于理解结果。当医疗行业掌握患者健康状况的整体状况时，可以对诊断、治疗和护理计划做出更明智的决策。\n\
  \    * **效率和成本效益：** 电子化共享患者信息消除了对纸质记录和手动流程的依赖，提高了医疗保健的效率和成本效益。\n\n2. **数据访问：** 医疗保健行业的数据访问是一个核心先决条件，包含关键观点：\n\
  \    * **患者驱动的访问：** 患者保留访问其健康数据的权利，包括临床记录、测试结果和治疗历史。让患者获得简单安全的健康信息访问使他们能够在处理治疗选择中发挥作用。\n\
  \    * **医疗提供者访问：** 医疗提供者（包括医生、护士和不同的临床医生）需要理想便利的患者信息来提供良好的关怀、协调不同专业并确保护理的连续性。\n\
  \n3. **安全性：**\n    * **数据隐私：** 数据隐私对于保护患者健康信息非常重要。这些信息必须由授权人员出于合法目的访问。它涵盖了访问控制、用户验证、加密等。\n\
  \    * **数据完整性：** 数据完整性是指防止未经授权的修改或篡改医疗记录，以维护其准确性和可靠性。为了防止，医疗机构应使用数据验证和数字签名等技术。区块链技术对维护数据完整性也有贡献。\n\
  \    * **数据机密：** 为了实现数据机密，医疗机构必须拥有处理敏感数据的政策和程序。医疗机构可以使用加密技术、使用`HTTPS` 在互联网上进行数据的安全传输，并实施访问控制。\n\
  \n4. **互操作性数据交换：** 互操作性对于实现各种医疗服务机构、系统和合作伙伴之间一致的信息交换至关重要。为了确保患者数据的安全高效交换，可以在不同组织之间使用标准数据格式并设定规则，以改善患者的持续结果。\n\
  \n## 5.4 结论与未来展望\n\n区块链是今天一种强大且广泛使用的技术。它最初是为了存储和保护数字数据或货币而开发的，尽管它不仅限于这些。它在医疗保健（包括医疗）领域有许多潜在应用，这些应用通过区块链技术提供的平台成为可能\
  \ [24]。在这里，我们将关注多种因素，由于行业法规、自动化流程、无纸化计划、隐私安全风险缓解以及改善患者健康的需求，学术研究正转向这些主题，并研究新的技术和策略来解决这些问题。我们对区块链和自主身份（SSI）进行了详尽分析，并对区块链系统进行了深入研究。通过彻底审查与\
  \ SSI 和区块链技术的重要论文，我们的研究对这一讨论做出了重大贡献。以下是结果的概述。\n\n\n\n\n在`first segment` 中，我们介绍并涵盖了区块链、其不可变性和完整性以及其必要性。在这里，我们还列出了基于区块链的盈利平台，并展示了如何部署锯齿网络。在`second\
  \ part` 中，我们解释了背景信息、相关研究以及电子健康记录的隐私问题。许多研究讨论了医疗保健，并声称基于区块链的技术在医疗领域具有广泛的应用潜力。这些研究还声称在大规模生产之前仍需进行更多研究，以评估该技术的可扩展性、安全性和可负担性。总之，尽管对于研究人员、医生和其他专业人士来说，在满足其监测需求、匹配其使用场景并有助于疾病监测基础要求的\
  \ ECG 监测系统之间进行选择可能是困难的。在`third segment` 中，我们简要介绍了自主主权身份以及源于自主主权的原则，并结合了许多形式的身份写作的核心原则。我们在`fourth\
  \ section` 中讨论了医疗保健中的区块链，并对比了金融和医疗保健的区块链交易。\n\n本节还涵盖了区块链技术在医疗保健领域的主要应用。讨论还关注了区块链在医疗保健方面的优势，并介绍了一些未来可以与区块链结合使用的尖端技术。区块链不仅限于数字货币和医疗保健，它还可以用于供应链和物流、金融和银行、医疗保健、房地产、政府和公共服务、教育、能源、零售和电子商务以及法律和治理。\n\
