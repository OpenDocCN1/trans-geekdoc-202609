  \ 年 9 月，`141`,文章编号 104197。\n\n# 第 4 章：针对网络攻击和网络犯罪的区块链技术策略\n\nVasudha\n\nDOI: [10.1201/9781003449515-4](https://doi.org/10.1201/9781003449515-4)\n\
  \n## 4.1 引言\n\n区块链是广为人知的的技术之一，因为它在各个领域和工业层面的应用而变得越来越受欢迎，这些领域通常包括业务活动、金融交易、个人通信、投票、教育等\
  \ [1, 2]。该技术的主要亮点在于，它为安全数据传输提供了良好的平台，并确保所传输的数据不被篡改，从而维护其真实性和完整性。区块链交易将资产从一个节点转移到另一个节点，这些资产是关键数据，可能代表财务信息、业务信息、医疗信息甚至个人信息。比特币是区块链最流行的应用，本质上是一种金融加密货币。在金融交易期间，比特币在不同个人之间传输并通过区块链执行。除了比特币之外，区块链的另一个流行应用是以太坊。[3]\
  \ 中提到，以太坊，“它的创建不仅是为了实施交易，还为了涉及交易的带有条件和规则的合约。”此类合约被称为智能合约，其应用领域称为物联网（`IoT`），在该领域，大多数设备共同工作，并为数据交换和处理创建智能合约。本质上，这是一种没有中心化控制机构的对点技术。区块链被专门设计用于处理安全交易和涉及数据的交易\
  \ [4, 5]。这些交易包含大量数据，必须安全地收集、处理、分析并与区块链网络中涉及的各种交易共享。也就是说，这是在大多数交易中实现的常用数据科学技术之一。区块链为在网络运行此类交易提供了安全介质。本章详细阐述区块链技术及其在增强网络方面的实现。第\
  \ 4.2 节 讨论了区块链技术、其特征以及区块链类型。第 4.3 节 讨论了近期工作。第 4.4 节 分析了网络攻击和犯罪，以及最常见的网络犯罪类型，并分析了印度和美国（`US`）五年的网络攻击和犯罪情况。第\
  \ 4.5 节 包含了针对网络攻击和犯罪的区块链技术（`BCT`）策略，第 4.6 节](#chapter4.xhtml#sec4_6) 讨论了 `BCT` 如何帮助预测犯罪行为，第\
  \ 4.7 和第 4.8 节 是结论和未来工作。\n\n## 4.2 区块链技术\n\n\n\n\n区块链主要是一个通过链连接在一起的区块组织集合。区块主要是一个包含与交易相关数据内容的文件。当前区块的数据可能会被传输到多个其他被称为节点的区块\
  \ \\[6, 7]]。此外，一个区块可能包含来自许多其他区块的数据。每个区块中持有的数据内容是永久且不可变的。在交易过程中，可以向区块链添加额外的区块。在此过程中，每次转换都必须经过充分验证。然而，与非区块链应用不同，中心化机构会一直验证每一笔交易，而在区块链的交易中，它是由分布在区块链网络上的处理区块集合进行每次验证的\
  \ \\[8]]。正如 NIST 文档 [9] 所述，区块可以通过两种方式发布，有许可或无许可：首先是有许可的，即区块只有在权威许可的情况下才能发布，无论是通过中心化还是去中心化的方式；其次是在缺乏授予权限权威的情况下，在这种情况下，任何人都可以任何时候发布区块。\n\
  \n区块链技术还通过使用加密哈希函数概念来实现安全的重要组件。这是消息摘要的一种形式，根据数据内容计算校验和。这是为区块链提供数据安全以及数据机密性、纯度和完整性的关键组件之一。区块链网络的另一个关键组件是交易，它是显示双方之间交互的手段。交易也是区块链用户之间交换加密货币的方式。区块链主要使用非对称密钥加密方法，本质上是公钥密码学。它还使用了从公钥加密的网络地址。去中心化账本是区块链的核心，即交易集合。交易以分散的方式执行，因此支持区块链作为分布式账本的架构。随着交易开始执行，区块被逐个添加到区块链中，包含诸如验证交易列表和有关这些交易的元数据等信息。这些区块聚集形成区块链。还有其他与区块链相关的多个细节，例如用于分叉和智能合约的共识模型（也称为工作量证明模型）。在这种模型中，当用户发布下一个时工作完成。该模型被比特币使用。在某些情况下，区块链可能需要一些更改，称为分叉。正如\
  \ [9] 所示，在区块链网络上，智能合约（数据和代码集合）通过加密签名的交易进行部署，区块链节点执行智能合约，例如 Ethereum 和 Hyperledger\
  \ Fabric 的链码。使用区块链执行交易的过程以及不同组件的细节见 [9, 10]。\n\n### 4.2.1 区块链的特征\n\n区块链技术变得越来越流行，并不是因为它被用于比特币和加密货币相关的交易，而是因为它具有许多广泛的特性，使其在实现上具有独特且安全性。\n\
  \n(1) **可扩展与去中心化**：区块链基于去中心化特征，这里没有中心权威来监管一切，相反，网络区块共同工作以验证、确认、归档、存储和更新交易数据。\n(2)\
  \ **透明性**：存储在每个区块中的信息对于区块链网络中的每一个节点都是透明的，当数据被修改或创建时对所有人也是透明的，这就是区块链备受信任的原因。\n(3)\
  \ **身份与访问**：网络上的每一个区块都可以由其他参与者使用相同的通用区块链架构进行识别。节点生成的数据被共享给链的所有其他成员，并由他们进行唯一验证。\n\
  (4) **开源**：大多数情况下，区块链框架对所有人开放，文档可以由链网络中的任何区块公开验证。\n(5) **自主性**：区块链网络上的每个节点都可以安全地传输或更新信息，其概念是信任整个系统形成一个单一实体，没有人可以参与其中。\n\
  (6) **不可篡改性**：所有数据记录将永久保存，除非在特定时刻有人可以控制超过 51% 的节点。\n(7) **匿名性**：区块链技术处理了节点之间的信任问题，因此交易和数据传输可以是匿名的，只需要知道该人的区块链地址。\n\
  (8) **共识模型**：共识模型帮助链网络维持无偏见的决策。在决策阶段，活跃节点组可以快速对协议做出反应，以增强区块链网络的顺畅运行。\n\n### 4.2.2\
  \ 区块链的类型\n\n\n\n\n\n区块链技术用于根据需求执行安全的网络交易。区块链可以通过以下三种方式实现 [11]：\n\n**(1) 公有区块链：**\
  \ 网络中的每一个节点都可以对该区块链上的交易进行验证，并可以参与共识构建过程。最初，区块链网络计划在资产交换场景下安全地消除中心机构。它通过为点对点交易链接区块来确保去中心化。每笔交易都与区块链相关，需要与网络中的每个节点块进行验证和同步\
  \ [11, 12]。任何拥有适当互联网连接的机器都可以注册区块节点并获得完整的区块链历史。公有区块链中记录的分布使其极其安全。然而，每个节点对交易的处理和验证是一个非常缓慢且耗时的过程。验证每笔交易所需的能量是巨大的，并随着网络加入节点的增加而急剧增加。\n\
  \n**(2) 私有区块链：** 这是一种受限的区块链类型，允许有限的节点参与并存在于网络中。这种区块链网络数据访问遵循严格的真实性机制。如果没有确认和验证，没有任何节点会参与交易。由于网络规模较小，交易的验证和校验速度快且效率更高。这种区块链唯一的显著缺陷\
  \ [11] 是它没有提供像公有区块链所提供的去中心化安全性。\n\n**(3) 联盟链：** 这种区块链是公有和私有区块链的结合体，可以称为部分去中心化。在网络中，数据以及交易细节可以是开源的，也可以是私有的，节点有权提前进行选择。目前很难实现区块链联盟与完全私有的区块链网络之间的区别。然而，到目前为止这种差异尚未经过详细研究。通常，联盟链是极低信任的公有区块链与大部分信任的私有区块链实体模型之间的混合体，而私有区块链网络可以被具体识别为带有加密验证和附加校验的传统层次级网络。\n\
  \n## 4.3 相关工作\n\n在 [13] 中，N. Kshetri 等人在本章讨论了区块链技术应对网络防御和网络安全的对策。作者在此讨论了不同类型的网络攻击，以及区块链如何利用适用于消除这些攻击的不同属性来对抗这些攻击。这篇文章清楚地阐述了区块链技术及其类型在网络防御和网络安全方面的用途，针对实施过程中常见的挑战提供了解决方案并提供了克服问题的方法。\n\
  \n在 [14] 中，S. Sanober 等人在本章强调了网络日常活动中网络犯罪数量增加的事实，这是由于过去一年对网络资源和连接的最大化利用。为了检测此类恶意活动，区块链提供了各种因素来消除和防止网络攻击。在本章中，通过使用主成分分析方法的概念，增强了区块链的能力，这有助于提高区块链网络中坏数据的检测和清除率，并有助于快速识别网络中的威胁。\n\
  \n在 [15] 中，A. Razaque 等人在这一研究章节中分析了这样一个事实：大多数人缺乏网络安全意识、知识、指南以及关于互联网使用的规则和法规，他们很容易受到网络威胁的影响。为了克服这些问题并减少网络犯罪的风险，引入了一种基于\
  \ Web 的区块链网络安全意识计划（WBCA），它有助于提高用户对网络犯罪分子行为和做法的认知，并增强他们的安全技能、对现代网络安全漏洞的理解以及趋势。\n\n\
  在 [16] 中，L. Yuchong 等人的研究工作强调了通信技术在经济、商业、政府、文化和社会等不同领域日益增长的需求和需求，同时也增加了可能损害网络共享数据的网络攻击机会。本章的目标是发现当发生的网络攻击时的网络安全面临的挑战、弱点和优势、其最新发展以及实施期间面临的挑战。\n\
  \n在 [17] 中，P.J. Taylor 等人的文章主要关注区块链网络的特征，如安全数据存储以及通过去中心化的点对点系统进行传输。本章还强调了区块链在物联网（IoT）、基于\
  \ Web 的应用程序、AI 数据和个人身份信息安全存储等不同平台上网络安全的实现。\n\n## 4.4 网络攻击与犯罪分析\n\n我们看到过去几年网络攻击和犯罪呈现出惊人的增长。全球范围内发生了大规模个人数据泄露。网络犯罪分子试图利用安全漏洞来窃取密码、记录或资金\
  \ [18, 19]。大多数常见的网络威胁包括：\n\n*   **黑客攻击** – 包括社交媒体和电子邮件密码。\n*   **钓鱼攻击** – 要求提供安全统计和隐私数据的虚假电子邮件。\n\
  *   **恶意软件** – 由勒索软件组成，犯罪分子通过它扣管存档并保留以索要。\n*   **针对网站的分布式拒绝服务（DDOS）攻击** – 经常伴随着勒索行为。\n\
  \n网络攻击的范围和复杂性非常大，“现成”工具意味着技术知识较少的犯罪分子现在能够实施网络犯罪，并且随着可行收入变得更加普遍，这种行为也日益增加。\n\n###\
  \ 4.4.1 最常见的网络攻击类型\n\n从现在以及过去观察到的各种网络攻击，网络犯罪分子改变了攻击策略来伤害个人或组织。根据过去年的网络攻击，表 4.1 中列出了前\
  \ 10 种最相似的网络攻击类型。图形表示见图 4.1。\n\nTable 4.1 前 10 种最常见的网络攻击类型\n\n| 序号 | 常见的网络攻击类型 |\
  \  |\n| --- | --- | --- |\n| 1 | 恶意软件 | 它是附在合法代码中的感染代码，并在网络中传播。它可以以病毒、蠕虫、木马程序、间谍软件和勒索软件的形式存在。<br>这种感染代码具有访问私有网络、窃取敏感数据和中断进程执行的能力。\
  \ |\n| 2 | 拒绝服务（DoS）攻击 | 这种攻击过度消耗系统资源使其无法满足服务请求。受影响的系统受攻击者的控制，他们将攻击系统资源。这些攻击以 TCP\
  \ SYN 泛洪攻击、碎片攻击、死亡之信攻击和 Smurf 攻击的形式存在。 |\n\n\n\n\n\n### 3. 钓鱼攻击\n* 这种攻击通过受影响的电子邮件窃取个人的凭据和敏感信息，以附件形式出现的超链接似乎来自受信任源。\n\
  * 攻击技术包括鲸叉钓鱼（whaling）、钓网攻击（pharming）、欺骗性钓鱼和针对性钓鱼（spear phishing）。\n\n### 4. 伪装攻击\n\
  * 在这种技术中，攻击者伪装成真实且信任的来源，窃取机密信息、资金，并可能有害软件感染计算机系统。\n* 伪装有不同类型，如域名伪装、邮件伪装和 ARP 伪装。\n\
  \n### 5. 基于身份的攻击\n* 网络攻击者窃取个人的凭据数据并创建该人的克隆，以访问其个人、财务和基于组织的信息。原始用户并不知道其数据正被泄露，以及被谁泄露。\n\
  * 攻击可以通过多种方式发生：中间人攻击、凭据填充（credential stuffing）和密码喷洒（password spraying）。\n\n### 6.\
  \ 代码注入攻击\n* 在这种攻击类型中，攻击者将恶意代码注入应用程序以导致感染。\n* 这种攻击主要由于缺乏非结构化数据的处理、数据验证实施不当以及数据管理缺失。\n\
  \n### 7. 供应链攻击\n* 这种攻击发生在组织外部人员在授权人员的帮助下获得了系统访问权限。\n* 在这种情况下，外部人员获得了操纵敏感数据、应用程序和网络设置权限。\n\
  \n### 8. 内部威胁\n* 内部人员是有权访问和操纵组织数据的人，为了损害组织的目的会将数据泄露给外部世界。\n* 攻击直接影响组织数据、人员或设施的完整性、机密性和可用性。\n\
  \n### 9. DNS 隧道\n* 这种攻击将程序或协议的数据编码到 DNS 查询和响应中。\n* 添加到受攻击的 DNS 服务器以控制该 DNS 服务器和应用程序的数据载荷包括了\
  \ DNS 隧道技术。\n\n### 10. 基于 IoT 的攻击\n* 在这种网络攻击中，IoT 设备有助于获取用户的敏感数据。\n* 攻击者在设备上安装恶意软件以破坏设备，或获取公司后续凭据数据的访问权限。\n\
  \n![图 4.1 前 10 种最常见的网络攻击类型](img/fig4_1.jpg)\n\n图 4.1 前 10 种最常见的网络攻击类型\n\n如今，网络攻击策略正从企业转向个人，针对个人的钓鱼攻击也在不断上升。这是因为网络罪犯远离攻击地点（例如不同的州或国家）。\n\
  \n#### 4.4.2 印度和美国的网络攻击与犯罪分析\n本节将介绍过去 5 年在印度和美国发生的网络攻击。\n\n##### 4.4.2.1 印度\n在当今数字世界，互联网用户数量逐渐增加，对其依赖程度也提高。几乎所有的日常交易和其他活动都是以数字方式进行的。印度是世界上人口第二的国家，面临着不同类型的网络攻击。如\
