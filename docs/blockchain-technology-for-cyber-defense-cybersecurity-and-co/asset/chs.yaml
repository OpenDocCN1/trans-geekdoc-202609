  \n## 9.2 背景\n\n### 9.2.1 VNF\n\n在现代网络中引入新型且复杂的服务面临着巨大的挑战，包括现有硬件的专有性、适应各种中间设备所带来的财务负担，以及用于无缝集成和维护的专业人才的匮乏。针对这些多方面的挑战，`NFV`\
  \ 已经成为一种变革性的解决方案，应用于 `5G` 及超越 `5G` 等下一代网络中，并配备了 `SDN` 和 `cloud computing` 等尖端技术。`NFV`\
  \ 引发了网络架构的范式转变，利用虚拟化将软件与硬件解耦，并将功能从地理限制中解放出来，从而加速了服务的提供。网络功能通过软件虚拟化技术实现，并在行业标准硬件上执行，如图\
  \ 9.3 所示，使得无需安装新设备即可实现动态实例化。\n\n![图 9.3 VNF 的高层架构。](img/fig9_3.jpg)\n\n图 9.3 VNF\
  \ 的高层架构。\n\nNFV 的关键技术要求总结如下：\n\n### 9.2.1.1 性能\n\n### 9.2.1.2 可管理性\n\n### 9.2.1.3\
  \ 可靠性和稳定性\n\n### 9.2.1.4 安全性\n\n### 9.2.1.5 兼容性和互操作性\n\n### 9.2.2 区块链\n\n\n\n\n\
  区块链技术通过利用社区验证在多个节点之间维护同步账本来运行，如图 9.4]。比特币代表了首个去中心化的数字货币，解决了货币系统中的信任问题。比特币区块链是一种公共、去中心化、点对验证且带有时间戳的账本，它按时间顺序记录交易，所有参与者均可见。交易被广播并由点对独立验证，分组为区块，并以链式顺序安全地链接。值得注意的是，参与者可以是自主代理，这扩展了直接在线价值传输的可能性，类似于街头现金支付或即时消息传递。区块链属于分布式账本技术家族，涉及跨多个实体的去中心化数据共享。需要注意的是，并非所有的分布式账本都使用区块链，但为了简单起见，我们使用区块链技术来涵盖基于社区共识的分布式账本。\n\
  \n![![图 9.4 区块链网络工作原理抽象图](img/fig9_4.jpg)\n\n图 9.4 区块链网络工作原理抽象图。\n\n除了最初的设计和应用外，区块链是一项基础技术，将信任从人类转移到机器，将控制从中心化转移到去中心化\
  \ [22]。为了充分理解其潜力，可以应用两个视角。首先，它作为一种信息通信技术（ICT），记录数字和物理资产的所有权，以及协议产生的权利和义务。区块链可以记录各种数据，从资产所有权到合同义务、版权信息、信誉敞口和数字身份。其次，区块链作为一种制度技术，用于协调人类和经济决策的治理结构的去中心化处理\
  \ [23]。\n\n### 9.2.3 区块链的类型\n\n区块链技术用于 P2P 网络内安全的交易和信息交换。它与数字加密货币结合使用，服务于公共和私有网络目的。在私有网络中，访问被限制为授权用户，通常由网络管理员监督，由管理员管理寻求访问的新节点或用户的活动和权限。广义上，区块链技术分为两大类：私有区块链和公共区块链，根据特定标准还有如联盟链区块链和混合区块链等额外分类。在所有情况下，区块链都通过\
  \ P2P 网络中的节点集群运行。每个节点都维护共享账本的副本，不断更新和验证交易，并启动和接收新交易。为了提供全面的理解，区块链技术被分为四种不同的类型 [24]，总结如下：\n\
  \n1. **公共区块链**：公共区块链是无许可的开放式网络，任何人都可以连接并参与，而无需批准。比特币和以太坊是公共区块链的著名示例。它们提供了去中心化、安全性和透明性，但速度可能较慢且能耗较高\
  \ [21]。这类区块链提供的特征如下：\n\n    *   去中心化：公共区块链通常是去中心化的，这意味着没有单一实体拥有控制权。\n    *   无许可：公共区块链是开放式网络，任何人都可以连接并参与，而无需批准。\n\
  \    *   透明性：区块链上的所有交易对所有参与者可见。\n    *   工作量证明（PoW）或权益证明（PoS）：这些共识机制很常用，如比特币所示，而\
  \ PoS 提供了一种更节能效益的替代方案，如以太坊。\n\n2. **私有区块链**：私有区块链是具有受限访问的许可网络。公司和组织通常在内部使用。它们提供了比去中心化更大的控制力\
  \ [25]。这类区块链提供：\n\n    *   控制力：私有区块链对网络具有更大的控制力。\n    *   许可性：私有区块链将访问限制为授权用户。\n\
  \    *   可扩展性：由于成员较少，它们能够每秒处理更多交易。\n    *   效率：私有区块链使用的能量较少，因为它们不需要密集的挖矿。\n    *\
  \   企业级用途：它们适用于希望维护数据隐私的组织。\n\n3. **联盟链**：联盟链包括公共和私有区块链，由各种不同的实体管理。这种架构在中心化和去中心化之间取得了折中，适用于多方必须安全协作的应用\
  \ [26]。这些区块链提供：\n\n    *   协作控制：联盟链允许一组可靠的组织共同监督和维护网络。\n    *   互操作性：它们经常使成员组织相互兼容，从而更容易共享安全数据。\n\
  \    *   效率：它们在提供可扩展性的同时保持了去中心化水平。\n\n4. **混合区块链**：混合区块链结合了公共和私有区块链组件，功能可以根据特定用例进行调整。由于具有适应性和多功能，它们适用于各种应用\
  \ [27]。这种区块链提供：\n\n    *   定制化：混合区块链可以适应特定需求，允许组织根据需要定制功能。\n    *   灵活性：它们可以根据需要在公共和私有模式之间切换，在各种场景中提供了多功能性。\n\
  \    *   可扩展性和安全性：根据配置，它们可以平衡可扩展性与去中心化。\n\n### 9.2.4 机器学习\n\n机器学习（ML）是人工智能的一个重要子领域，引起了大量的关注和研究兴趣。Arthur\
  \ Samuel 和 Tom Mitchell 提供的两个著名的 ML 定义简洁地捕捉了其本质。根据 Samuel [28]，机器学习涉及计算机在没有显式编程的情况下学习任务。Mitchell\
  \ [29] 将机器学习定义为通过经验改进的计算机程序，使用了以下概念：计算机程序从某些任务 T 和性能指标 P 的经验 E 中学习，其通过 P 衡量的任务 T\
  \ 的性能随着经验 E 的增加而提高。这些定义强调了学习的核心方面，根据学习过程对 ML 方法进行区分，大致分为监督学习、无监督学习和强化学习。\n\n###\
  \ 9.2.5 机器学习的类型\n\n机器学习技术被分为以下三大类：\n\n\n\n\n\n1. 监督学习（Super learning）依赖于标记数据进行训练，通过优化器优化损失函数以执行分类或回归任务。该过程包括收集适当的训练集、定义输入表示和算法结构、运行算法以拟合数据、使用验证器进行优化以及评估准确性。\n\
  \n2. 相比之下，无监督学习（Unsupervised learning）在未标记数据上运行，提取潜在模式。它涵盖了聚类、降维和关联分析等任务，并诸如 `k-means`、分层次聚类、主成分分析等技术。无监督算法的显著示例包括\
  \ `k-means` 聚类和主成分分析。监督学习（Supervised learning）处理回归和分类任务，通过映射输入-输出对产生真实值或类别作为输出。它利用了\
  \ `ANNs`、`NB`、`SVM`、`RF`、`LR` 和 `LGR` 等算法。\n\n3. 强化学习（Reinforcement learning）不同于监督和无监督方法，它通过与环境交互进行学习，寻求累积期望奖励的最大化。它将场景建模为马尔可夫决策过程（`MDP`），涵盖了\
  \ `agent`（代理）、`state`（状态）、`environment`（环境）、`action`（动作）和 `reward`（奖励）等关键术语。强化算法包括\
  \ `Q-learning`、`State Action Reward State Action (SARSA)`、`deep Q-learning`、`actor-critic\
  \ (AC)`、`deep deterministic policy gradients (DDPGs)` 以及 `trust region policy optimization\
  \ (TRPO)`。\n\n## 9.3 相关\n\n在本节中，我们将深入文献综述，并探索使用区块链、`ML` 和混合技术等不同技术进行 VNF 测试领域的最相关工作。\n\
  \n### 9.3.1 基于区块链的 VNF 测试技术\n\n前沿且优秀的区块链技术具有在不信任的网络参与者之间建立信任的能力，其固有的不可篡改性使其在金融交易之外的信任和可审计性性领域也具有价值。这些属性促使研究人员将区块链应用于\
  \ VNF 安全、隐私和透明性领域，而不仅仅是 VNF 管理和编排。\n\nLal 等人最近的研究 [30]] 讨论了 5G 及以后网络环境中 NFV 基础设施中的不同安全威胁，并提出了缓解这些问题的最佳实践。不同的研究人员建议了区块链在解决\
  \ VNF 迁移期间安全问题的潜力，研究工作 [31]] 和 [32]] 展示了用于安全可靠的 VNF 服务迁移和 5G 切片提供的各种区块链用例。\n\n在\
  \ [33]] 中，Scheid 等人发现针对 NFV 环境的现有区块链项目往往忽视了 VNF 仓库，这可能会损害 VNF 的信任和透明度，并引入了 `BUNKER`，一种基于区块链的\
  \ VNF 仓库，可以在不依赖可信第三方（`TTP`）的情况下增强 VNF 包的信任和完整性验证。它还允许通过 `Ethereum Smart Contracts`\
  \ 直接获取 VNF，确保供应商支付和完整性验证。\n\n在 [34]] 中，Nath 等人引入了一种用于 5G 和 B5G 网络可信 VNF 的基于区块链的\
  \ VNF 测试框架。它同时采用联盟链和公有链，涉及 VNF 测试的关键实体，并利用智能合约的能力来增强 VNF 全生命周期中的透明度、安全性和信任。这种创新方法解决了中心化\
  \ VNF 管理中的问题。\n\n*（注：原文中 Nath 等人的段落重复了多次，译文已按要求仅保留一份。）*\n\n\n\n\n\nPiao, G. 等人在\
  \ \\[38\\]中引入了 `Env2Vec`，这是一种深度学习架构，它结合了上下文特征和历史资源数据，在嵌入空间中表征影响测试执行的栈参数，从而实现对未见环境的预测。\n\
  \n单一 `ML` 模型的集成实现了错误检测自动化，并识别了测试工作流中的性能瓶颈。真实测试数据显示，其准确率在 86.2% 到 100% 之间，在报告性能问题时，与最先进的方法相比，其误报率降低了\
  \ 20.9%–38.1%。\n\nBunyakitanon, M. 等人在论文 \\[39\\]中，利用基于 `ML` 的技术为 VNF 性能预测做出了重大贡献。首先，他们引入了一种创新方法，通过引入专门为准确性能预测而训练的\
  \ `ML` 模型来增强 VNF 放置决策。这种方法解决了现有编排器（如 `Open-Source MANO` (`OSM`) 或 `OpenStack`）中的明显空白，因为这些平台缺乏对\
  \ `ML` 模块的原生支持。此外，该研究关注预测服务级的端到端网络或处理延迟，这一领域对于增强延迟敏感用例的 VNF 放置具有潜力。其次，作者强调了基于真实测试床的实验，展示了\
  \ `Auto-3P` 在实际网络环境中的部署，使用了真实数据、VNF 视频转码器、智慧城市安全用例以及真实的部署设置。这一方面填补了目前大多数基于模拟的 VNF\
  \ 放置文献中的关键空白。最后，该章节对 VNF 预测模型及其相应的放置决策进行了全面的对比研究。他们评估了各种 `ML` 算法和非 `ML` 模型，同时评估了\
  \ `MANO` 在结合 `Auto-3P` 时的放置效率。结果表明，系统范围内的负载均衡显著增强，端到端服务级延迟有所减少，这与 5G 针对延迟敏感服务和应用的“零接触网络和服务管理”目标一致。\n\
  \nBunyakitanon 等人在 \\[40\\]中讨论了 VNF 的自主放置对于 5G 网络中 `ZSM` 的重要性。研究人员引入了 `AREL3P`——一种用于自主\
  \ VNF 放置的自适应 `Reinforcement Learning` VNF 性能预测模块，提供了两项核心创新。首先，它利用端到端服务级性能预测进行 VNF\
  \ 放置。其次，与大多数使用监督学习的 `ML` 方法不同，`AREL3P` 了一种适用于预测的强化学习形式，使得放置决策具有适应性并迁移到各种网络条件。在真实\
  \ 5G 测试床中的大量性能评估表明，与其他基准相比，VNF 性能预测准确率提高了 40%–45%，VNF 放置效率得到了整体提升。这些改进体现在 27 个场景中的\
  \ 23 个场景达到了近优决策得分。\n\nRahman 等人在一项 \\[41\\]的研究中，引入了一种主动的 `ML` 方法，用于响应变化的流量模式对 VNF\
  \ 进行自动扩缩。`ML` 分类器从过去的决策和网络流量行为中学习，提前生成扩缩决策。研究探索了不同的虚拟化技术如何影响服务质量 (`QoS`) 和成本节约。结果表明，`ML`\
  \ 分类器具有良好的准确性，并为网络所有者和领导带来了显著的 `QoS` 改进和成本节约。\n\n## 9.4 挑战\n\n在 5G 网络中集成 `ML` 和区块链技术进行\
  \ VNF 测试面临着不同的挑战。首先，5G 网络和 VNF 的复杂性要求能够处理大规模多样化数据集的高 `ML` 模型。其次，确保区块链内敏感数据的安全隐私至关重要，因为任何泄露都会产生深远影响。第三，`ML`\
  \ 与区块链技术之间的互操作性以及与现有网络基础设施的集成需要仔细规划和执行。此外，5G 网络的动态性和开放性需要能够快速响应变化条件的自适应 `ML` 模型。最后，这一新兴领域需要标准化方法和最佳实践，对于确保\
  \ `ML` 与区块链在 VNF 测试中的无缝且有效集成至关重要。\n\n### 9.4.1 标准化工作\n\nETSI 为 `NFV` 建立了一个行业规范小组\
  \ (`ISG`)，以创建一个支持 VNF 的统一架构。关键行业参与者包括美国电信公司 (`AT&T`)、蓝牙 (`BT`)、中国移动、德国电信、Orange、西班牙电信和\
  \ Verizon 发起了该 `ISG`，并获得了来自网络运营商、设备供应商和 IT 供应商的 150 多成员的大力行业支持。ETSI 的 `NFV ISG`\
  \ 包含多个工作组和专家小组，涵盖基础设施架构、管理、编排、软件架构、安全和性能等领域。其旨在定义网络运营商可以用于商化部署的需求，并协调 `PoCs` 以证明\
  \ `NFV` 的可行性。\n\n\n\n\n\n适当的信任与透明度管理技术对于 5G 及以后网络中的 VNF 测试至关重要且敏感，原因如下：\n\n*   **确保安全性**：`VNFs`\
  \ 的安全性至关重要，因为 5G 及以后网络是开放的生态系统，这意味着它们在自动驾驶汽车、远程医疗和关键基础设施等各种应用中发挥着关键作用；`VNFs` 的安全性意义重大。信任与透明度管理确保\
  \ `VNFs` 按预期运行，并可能没有漏洞或恶意篡改。这对于维护网络服务的机密性、完整性和可用性关重要。\n\n*   **隐私保护**：信任与透明度方法保护处理敏感数据（如金融或医疗数据）的网络中的隐私。这些方法可以防止\
  \ `VNFs` 处理的敏感信息被误用或暴露，并抵御各种威胁，维护用户信任并符合法律法规。\n\n*   **服务可靠性**：信任与透明度的管理有助于快速检测和解决\
  \ `VNFs` 的问题。为了提供高质量的网络服务、消除中断并保证无缝连接——这对于服务任务关键型应用的 5G 网络尤为重要——可靠的 `VNFs` 是必不可少的。\n\
  \n*   **防止未经授权的访问**：可以通过透明的管理机制确认 `VNFs` 的合法性，防止它们被未经授权的方破坏。对于停止未经授权的进入或操控至关重要，这些可能会损害网络性能并导致安全漏洞。\n\
  \n*   **监管合规**：许多行业和司法管辖区对数据保护和网络安全有特定的规则和要求。组织可以通过使用适当的信任与透明度管理来遵守这些规则并展示合规性，帮助他们避免负面的法律和财务影响。\n\
  \n*   **网络性能优化**：VNF 测试中的透明性允许识别瓶颈、低效环节或性能问题。这些信息可以对 `VNFs` 进行优化和改进，提升网络性能和用户体验。\n\
  \n*   **业务声誉**：维护良好的业务声誉取决于信任。确保 `VNFs` 开放且可靠地运行可以增强用户信心、客户满意度和市场主导地位。\n\n适当的信任与透明度管理技术对于维护\
  \ 5G 及以后网络中 `VNFs` 的安全性、隐私性、可靠性和性能至关重要。它们有助于保护敏感数据，确保符合法规，并提升整体用户体验，这对于支持广泛应用和服务的网络至关重要。\n\
  \n### 9.4.3 权衡\n\n尽管在 5G 及以后网络的 VNF 测试中使用区块链和 `ML` 方法具有许多优势，但在复杂性、资源利用、数据隐私、可扩展性和合规性方面也存在权衡。为了确定实施这些技术的潜在收益和成本效益，组织必须仔细评估其独特的需求和限制。可能的权衡总结如下：\n\
  \n*   **复杂性**：在 VNF 测试中同时实施区块链和 `ML` 会为测试环境引入复杂性。这种复杂性可能难以管理，并需要专门知识。\n\n*   **资源密集型**：训练模型需要大量数据和强大的计算能力，这在资源有限的场景下会导致成本增加或性能瓶颈。\n\
  \n*   **数据隐私**：区块链的透明性可能会将测试过程中的敏感数据暴露给未经授权的。在保持透明性的同时确保数据隐私是一个微妙的平衡。\n\n*   **可扩展性**：由于\
  \ 5G 网络的设计是为了处理海量设备和服务，确保区块链和 `ML` 解决方案的可扩展性是一项重大挑战。\n\n*   **延迟**：`ML` 算法在处理测试时可能会引入处理延迟。\n\
  \n*   **集成**：将区块链和 `ML` 与现有的 VNF 框架集成可能是复杂的。\n\n*   **监管合规**：使用区块链和 `ML` 可能会带来监管挑战，特别是在要求严格的行业中。\n\
  \n*   **能耗**：`ML` 的资源密集特性会导致能耗增加。\n\n*   **成本**：实施和维护区块链和 `ML` 解决方案的成本很高，特别是对于小型组织而言。\n\
  \n## 9.5 讨论与未来研究方向\n\n在 5G 及以后网络等许多敏感应用的开放生态系统中，VNF 测试过程起着至关重要的作用。不同的研究人员讨论并证明了区块链和\
  \ `ML` 等沿技术的潜力。以下是采用区块链和 `ML` 的 5G 及以后网络 VNF 测试的研究方向。\n\n### 9.5.1 增强的安全与隐私\n\n\
  为了保护存储在区块链上的 VNF 测试数据，研究可以进一步关注创建和部署复杂的加密方法。此外，可以调查隐私保护 `ML` 算法以保护敏感数据。\n\n### 9.5.2\
  \ 互操作性\n\n为了增强不同 VNF 测试环境和平台的互操作性，未来的研究可以集中在通信协议和接口的标准化上。这将促进许多平台之间的数据传输并改进团队协作。研究应用\
  \ `ML` 技术根据 `VNFs` 的需求和工作负载动态分配测试资源。\n\n### 9.5.3 实时测试\n\n创建允许在实时 VNF 测试中使用区块链和\
  \ `ML` 的方法。对于需要快速决策和低延迟测试的远程医疗和自动驾驶汽车等应用至关重要。研究人员可以探索使 VNF 测试平台更加健壮和韧性的方法，特别是在出现网络问题或安全漏洞时。这包括自适应\
  \ `ML` 算法和容错区块链系统。\n\n### 9.5.4 能源效率\n\n为了减少 VNF 测试过程对环境的影响，并解决对大规模 5G 网络日益增长的能源消耗担忧，研究可以集中于构建高效的\
  \ `ML` 模型和优化区块链共识机制。\n\n### 9.5.5 边缘与雾计算\n\n对于去中心化的 VNF 测试，可以在边缘和雾计算层面集成区块链和 `ML`。通过实现本地化测试和实时决策，这些技术有助于降低延迟和网络拥塞。\n\
  \n### 9.5.6 区块链的可扩展性\n\n为了让区块链扩展到大规模 5G 网络的需求，解决可扩展性是一个重大挑战。为了管理沉重的 VNF 测试负载，研究人员可能会开发新的共识机制、共享方案和分区算法。\n\
  \n### 9.5.7 网络切片集成\n\n\n\n\n\n研究 5G 网络中的切片技术如何能够无缝集成区块链和 `ML` 方法。这使得 `VNF` 测试变得动态化，并能够适应各种应用程序的特定网络切片。\n\
  \n### 9.5.8 AI 驱动的测试\n\n对于认知 `VNF` 测试，研究可以探讨 `ML` 与人工智能 `AI` 的融合。对于更复杂的测试和诊断，可以使用语音识别和自然语言处理等\
  \ `AI` 技能来构建 `VNF` 的声誉体系。\n\n## 9.6 结论\n\n在本研究中，我们彻底研究了无线网络代际演进的基础知识。我们深入探讨了 `VNF`、`VNF`\
  \ 测试、区块链技术、`ML` 以及使用基于 `ML` 和区块链的方法进行 `VNF` 测试。我们还仔细审查了 `VNF` 测试领域一些最重要的现有研究。\n\n\
  此外，我们还作为研究的一个方面，探讨了与测试过程相关的各种挑战。我们细致地考虑了这些测试技术带来的所有挑战。最后，我们通过总结研究发现和对进一步研究的建议完成了工作。\n\
