  \n\n\n\n虽然创建基于区块链的平台应用程序的技术具有提高安全性的潜力，但它们从未作为基础。在积极设计、测试、实施和管理新的安全能力之前，安全专业人员必须首先与产品和平台构建者合作，识别此类能力的问题、交互和权衡。\n\
  \n正如我们所讨论过的，网络攻击具有大多数 10 种相似性。在这些类型的攻击中，大多数将突破网络以获取用户凭据的访问权限。大多数攻击者想要破解知名组织、公司或个人人士的数据，其主要动机是获取越来越多的利润。世界日益数字化，因此网络攻击也随之增加，我们无法阻止它们，但通过一些策略和修复我们的数据，可以使数据受到网络攻击的影响更小。正如我们所知，如果用区块链技术管理数据，`拒绝服务`(`Dos`)\
  \ 和 `DNS` 隧道攻击将会减少。因此，为了防止网络攻击和犯罪，区块链发挥着至关重要的作用，它通过与链链接的区块管理数据，有助于减少此类攻击。\n\n在讨论针对网络攻击和犯罪的区块链策略之前，我们应该先明确以下术语：\n\
  \n1. **第一步**：一级防护——机器无物理损坏，服务器在不同地点有备份等。\n2. **第二步**：二级防护——每层进行用户身份验证\n3. **第三步**：三级防护——软件（医院、任何公司或组织等）必须有适当的验证（免受\
  \ `SQL injection` 攻击）\n4. **第四步**：四级防护——用户数据（敏感）以区块链的形式保存\n\n尽管用户凭据（数据）更为敏感和重要，因此我们必须保护数据免受网络攻击（`四级`），但我们也必须记住一级、二级和三级的安全性。在表\
  \ 4.5 中讨论了针对网络攻击和犯罪的 `BCT`策略。\n\n表 4.5 针对网络攻击和犯罪的 BCT 策略。\n\n| 序号 | 针对网络攻击和犯罪的 BCT\
  \ 策略 | 详细描述 |\n| --- | --- | --- |\n| **1** | 用户数据（敏感）不集中化，也不以原始形式存储 | **持久性与可访问性：**<br>-\
  \ 去中心化环境支持防止攻击、损坏和停机的持久性。<br>- 去中心化有助于减少 `DDoS` 攻击发生时的影响。 |\n| **2** | 通过授权用户更改数据\
  \ | **数据完整性：**<br>- 区块链上的数据无法被更改。<br>- 每个网络节点都交叉引用并需要共识来验证交易。 |\n| **3** | 易于追踪\
  \ | **可追溯性和来源：**<br>- 可追溯性和透明性是区块链的核心，但它们的安全利益在不同应用中的表现形式不同。<br>- 区块链通过汇款和跨境支付提高了交易的隐私和安全性。\
  \ |\n| **4** | 必须经过授权软件或软件验证 | **软件和/或设备交互的验证：**<br>- 区块链哈希有助于组织与开发者验证更新、下载和补丁。<br>-\
  \ 它也有助于防止供应链攻击。 |\n| **5** | 个人身份验证 | **个人身份验证：**<br>- 区块链用 `hash` 存储数据，而不是用户的个人信息。<br>-\
  \ 公司使用区块链加密和哈希来安全并保护聊天、消息等中的数据。 |\n\n正如所讨论的 `BCT` 策略，网络攻击和犯罪必须减少，但对区块链及其特征的缺乏意识以及信任问题阻止了组织升级其软件或开发区块链。\n\
  \n## 4.6 BCT 帮助预测犯罪行为\n\nBCT 在预测犯罪分子的行为方面起着显著的作用。网络犯罪分子和其他人按照他们设定的犯罪行为模式进行犯罪。如果犯罪记录以区块链的形式管理，我们就能提取出重要的犯罪模式属性。所有犯罪分子的数据都存储在区块中并链接在一起。每个区块包含犯罪人的信息，带有基本属性如\
  \ `criminal id`、`criminal name` 以及犯罪模式如 `crime type`、`crime location` 等。图 4.2 展示了这一点。\n\
  \n![图 4.2 具有不同犯罪行为的犯罪分子基本详情区块链](img/fig4_2.jpg)\n\n图 4.2 具有不同犯罪行为的犯罪分子基本详情区块链。\n\
  \n## 4.7 结论\n\n在数字交易数量逐年增加数字时代，网络攻击和犯罪也呈灾难性增长。每个组织/个人都在考虑他们的数据安全。恶意软件、拒绝服务 (`DoS`)\
  \ 以及更多；是最频繁的网络攻击类型，攻击者通过这些类型窃取组织数据，随心所欲使用、更改或破坏它们，并获得财务利润。数据安全是目前最大的挑战。因此，在本章中，我们讨论了区块链技术及其特征，这种技术如何保护用户凭据并防止网络攻击。区块链由于其加密和去中心化方法保持数据安全，数据更改几乎是不可能的。我们还讨论了影响全球的\
  \ 10 种常见网络攻击类型，并分析了两个国家——印度和美国五年内发生的网络攻击和犯罪，正如预期那样，逐年增加且财务损失也在增加。我们提出了利用区块链技术应对网络攻击和犯罪的策略。组织必须将他们的数据以区块形式，但由于缺乏意识和信任，除了医疗系统和一些组织外，未使用。如果用\
  \ BCT 管理数据，网络攻击和犯罪将会减少。BCT 也有助于预测犯罪行为。区块包含犯罪基本信息和犯罪模式，有助于分析和防止未来的犯罪。\n\n## 4.8 前景\n\
  \n正如我们所知，区块链技术由于其强大的特征保持数据安全并防止网络攻击。加密（`hash method`）和去中心化方法有助于保护用户的敏感信息并防止未经授权的访问。在多个业务中，区块链已被证明是法的颠覆。交易、内部通信和数据存储都得到了有效优化。国际组织正在使用该技术创建数字货币。此外，它帮助企业增强数据开放性并减少了欺诈的可能性。客户甚至可以访问云服务来托管、创建和使用区块链应用程序。\n\
