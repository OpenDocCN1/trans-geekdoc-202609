  \ | 美国加利福尼亚州 |\n\n### 7.3.1 Coinbase\n\nCoinbase 是 Brian Armstrong 和 Fred Ehrsam\
  \ 于 2012 年在美国创立的加密货币交易所。Coinbase App 允许用户在开放市场上购买、交易和交换各种加密货币。注册 Coinbase 账户的客户可以交易、出售、购买、提取和存款所有类型的加密货币\
  \ [19, 20]。Coinbase 客户的私钥保存在本地设备上，用户对其加密货币、密钥和数据拥有完全控制。Coinbase 使用基于智能合约的加密来提供安全的加密交易优势\
  \ [21, 22]。\n\nCoinbase 的技术栈包含多种技术。其中包括 `Node.js`、Ruby on Rails、Django 和 Go。在 2020\
  \ 年，Coinbase 移动应用使用 `React Native` 从头开始重新设计 [23]。冷热存储是 Coinbase 的强大功能之一，大部分（估计为\
  \ 98%）的客户资金存储在冷钱包中，这意味着它们处于离线状态，可以防止网络威胁。热钱包还投了了险，这意味着如果 Coinbase 发生导致客户资金损失的漏洞，保险将赔付损失。所有信息（包括客户数据和钱包私钥）在传输和存储中均经过加密\
  \ [24]。\n\n### 7.3.2 MobileCoin\n\nMobileCoin 是由 MobileCoin Inc 开发的一种点对点加密货币，由 Josh\
  \ Goldbard 和 Shane Glynn 于 2017 年在美国加利福尼亚州创立 [19, 25]。它是一种注重隐私、安全和移动设备易用性的加密货币。其主要目的是与移动即时应用集成，允许快速、安全的点对点交易\
  \ [26]。MobileCoin 适用于 Facebook Messenger、WhatsApp 和 Signal 等消息应用 [19]。\n\n\n\n\n\
  MobileCoin 的机制构建在`Stellar Consensus Protocol (SCP)` 之上，它实现了去中心化控制、低延迟和灵活的信任。为了保护隐私，MobileCoin\
  \ 的区块链账本基于`CryptoNote`账本加密协议，该协议使用一次性接收者地址来掩盖所有用户交易输出（`TxOuts`）的身份。此外，MobileCoin\
  \ 利用了`Ring Confidential Transactions (RingCT)`（来自 Monero 的功能），确保交易金额被隐藏，从而通过掩盖发送者和接收者地址提供隐私保护\
  \ [25, 26]。\n\nMobileCoin 实施了零知识证明 (`ZKP`) 以确保 MobileCoin 用户之间可以安全地通信，并发送和接收 MobileCoin\
  \ (`MOB`) 令牌，同时防止攻击者操纵或获取其交易金额。`ZKPs` 确保除了你之外，甚至连应用程序的服务商也无法访问你的数据。\n\n### 7.3.3\
  \ Founders Bank（创始人银行）\n\nFounders Bank 是一个提议的项目，旨在建立一个社区所有有的、基于区块链的银行。它得到了全球最大的加密货币交易所之一\
  \ Binance 的支持。该项目的主要目的是桥接传统金融系统与加密生态系统之间的差距。Founders Bank 将是去中心化的，没有中央机构。相反，它将由所有客户共同拥有\
  \ [27]。\n\n该银行使用去中心化存储系统、庞大的公共账本系统和加密方法来确保加密货币的安全交易。Founders Bank 的区块链实现允许基于令牌的所有权和去中心化治理模型，其中令牌持有者可以在银行的运营和决策中发挥重要作用。通过该项目，银行旨在实现无缝的加密货币转换，并为加密企业提供业务账户。他们将使用智能合约来自动化某些银行流程，提高透明度并降低运营成本。区块链实现的主要优势将是更快速、更具效益的跨境交易\
  \ [26, 27]。\n\n### 7.3.4 JPMorgan Chase（摩根大通）\n\n2016 年，摩根大通创建了`Quorum`，这是一种基于`Ethereum`架构的私有区块链。\n\
  \n`Quorum` 是一种基于 `Ethereum` 的分布式账本协议，经过修改以满足金融行业的需求，强调了隐私保护和许可网络功能 [22]。\n\n`Quorum`\
  \ 是一种基于 `Ethereum` 协议官方 `Go` 实现的私有/许可区块链。`Quorum` 的基本思想是利用加密来防止交易参与方以外的任何人员访问敏感数据。它由单一共享区块链和智能合约软件架构混合组成。`Quorum`\
  \ 采用了一种名为 `QuorumChain` 的多数投票机制，其中网络节点子集被授予了对区块进行投票的能力。`Quorum` 引入了私有交易的概念，只有参与交易的网络用户才能访问这些交易\
  \ [28, 29]。\n\n### 7.3.5 Santander US（桑德兰银行）\n\n桑德兰银行是英国第一家使用区块链将其国际支付服务证券化的银行。得益于该银行的`BCT`，客户可以安全地在欧洲和南美的桑德兰账户之间转移资金\
  \ [21]。\n\n桑德兰银行推出了外汇服务`One Pay FX`，这是一种面向各国零售客户的基于区块链的国际汇款服务，使用了`Ripple's xCurrent`技术，使其成为第一家同时为不同国家的零售客户推出区块链国际支付解决方案的银行。英国客户可以下载`One\
  \ Pay FX` 应用，使用标准的桑德兰移动银行凭据进行连接并开始支付。它与`Apple Pay` 集成，用户可以使用`Touch`或`Face ID` 安全确认支付\
  \ [30]。桑德兰银行投资了`Securitize`，这是一个在区块链上发行和管理数字资产的平台 [31]。桑德兰声称是第一家使用区块链管理债券所有元素的机构。该银行在公共`Ethereum`区块链上发行了\
  \ 2000 万美元的债券，其一个部门收购了该债券，完成了链结算。这使得桑德兰能够以许可的方式对债券进行代币化注册在区块链上 [32]。\n\n### 7.3.6\
  \ Philips Healthcare（飞利浦医疗）\n\n位于马萨诸塞州剑桥市的飞利浦医疗利用区块链和人工智能开发一个全新的安全的医疗环境。通过与全球医院的合作，该公司利用人工智能识别并评估医疗系统的所有部分，包括运营、行政和医疗数据。收集的大量数据通过区块链进行安全保护\
  \ [21, 22, 33]。\n\n为了开发一种用于维护医疗记录、保存患者数据或简化医疗提供者之间支付的基于以太坊的区块链应用，飞利浦医疗正在与`Cryptoium`和`Gem\
  \ Health` 合作 [34]。`Cryptoium` 这种区块链提供了一套工具，允许开发者在`Ethereum`区块链上轻松地设计和部署去中心化应用程序（`dApps`）。`Gem\
  \ Health` 是面向全球医疗机构和人士的区块链网络 [35]。\n\n### 7.3.7 Hashed Health\n\n位于田纳西州纳什维尔市的 Hashed\
  \ Health 是一家致力于协助该行业实施`BCT`的医疗创新机构。Hashed Health 已与数百家医疗机构和企业开发了安全的数字区块链网络，用于内部通信和患者数据共享\
  \ [19]。Hashed Health 使用`Hyperledger`，这是一个在金融、基础设施和医疗领域具有影响力的跨行业区块链。通过实施`BCT`，Hashed\
  \ Health 旨在确保患者数据的安全，创建能够有效沟通并为患者制定良好治疗方案的医疗团队，并追踪药品等关键物资 [36]。\n\n\n\n\n\nHashed\
  \ Health 的一些区块链实施和倡议包括 ProCredEx（专业证书交换平台）、Signal Stream 和区块链联盟（Blockchain Consortium）。ProCredEx\
  \ 由 Hashed Health 推出，是一个数字市场，利用区块链技术来简化并加速医疗保健领域中专业证书的共享、确认和认证过程。它旨在消除认证过程中的重复和低效\
  \ [36\\]。Signal Stream 是医疗保健领域首个多利益相关区块链/分布式账本技术（DLT）业务管理平台，提供多系统数据收集和报告能力，为医疗保健中安全、可扩展且机密的共享流程和合同创建持续的信息源\
  \ [37\\]。Hashed Health 创建了一个由对研究和扩展区块链解决方案感兴趣的医疗保健组织组成的联盟。成员可以共同合作构建基于区块链的解决方案，并从彼此的经验中获益\
  \ [38\\]。\n\n## 7.3.8 MedicalChain\n\nMedicalChain 是一个去中心化平台，使用 `BCT` 安全地存储和管理健康信息，实现了电子健康记录（EHRs）管理中的互操作性、安全性和以患者为中心\
  \ [21\\]。MedicalChain 的目标是通过允许与其医疗网络中的每个组织共享其最全面的记录版本，赋予患者对其医疗数据的控制权。使用 `MedicalChain`，患者对其数据拥有最终所有权。患者控制哪些实体可以访问其医疗记录，并且对数据的任何修改或访问都是可审计的。为了保护健康数据，该平台采用了加密技术。医疗记录以去中心化的方式进行加密和存储，确保数据防篡改，且只有具有适当权限的人才能访问\
  \ [39\\]。\n\nMedicalChain 利用了双区块链结构：`MedicalChain` 使用 `Ethereum` 区块链用于多种应用，包括身份验证、审计追踪和治理功能。`Ethereum`\
  \ 的智能合约能力对于确保只有授权人员才能访问医疗信息至关重要，而 `Hyperledger Fabric` 则用于健康记录的核心管理。这使得通过精密的访问控制措施实现可扩展、安全的数据管理\
  \ [39\\]。`MedToken` (`MTN`) 是 `MedicalChain` 生态系统中的代币。该代币支持多种行为，例如奖励提供研究数据的患者，或获得各种平台功能的访问权限。\n\
  \n## 7.3.9 HDAC\n\n现代数字资产货币 (`HDAC`) 是一个通过将 `BCT` 与 `IoT` 技术融合来实现认证、映射和机器机（M2M）通信的平台。`HDAC`\
  \ 平台使用私有链为 M2M 通信建立了一个简单的交易环境。\n\nHDAC 创建了除 `Ethereum` 或 `Bitcoin` 之外的区块链，名为 `RIZON`\
  \ 区块链，这是一种物联网友好的公私链结合。为了提高交易速度和量，`Hdac` 系统采用了双链结构，一个公链和一个私链。这意味着该平台可以同时用于 `IoT`\
  \ 设备和工业网络。`HDAC` 引入了一种名为 `ePOW`（选举工作证明）的独特机制作为共识算法，旨在提高能源效率并提供更快的区块生成时间 [40, 41\\\
  ]。`IoT` 合约是与区块链通信的 `IoT` 设备相关的智能合约，是 `HDAC` 平台的基础组件。物主可以使用 `IoT` 合约描述设备需要执行的任务以及安全和访问控制限制。`HDAC`\
  \ 在其平台上将其代币 (`HDAC`) 用于多种用途，包括交易费用和智能合约执行 [41\\]。\n\n## 7.3.10 Xage Security\n\n\
  Xage Security 总位于加州，是一家将 `BCT` 集成到其解决方案中的网络安全公司，主要关注工业物联网（IIoT）和关键基础设施。例如，当新设备连接到现有环境时，使用共识来确认其用途，或者如果是恶意设备，则将其排除在未来的通信之外。因此，它被视为一个自愈系统，可以直接在每个边缘设备上自动更改安全策略的实施，允许对用户和应用程序进行更细粒的管理\
  \ [42\\]。\n\nXage 引入了基于区块链的“安全织”（Security Fabric），这是一种为广泛设备提供完整安全的去中心化解决方案。该织在节点之间分发验证和规则，确保即使一个节点被黑客攻击，整个系统也能保持安全\
  \ [43\\]。绝对多数共识是安全织区块链使用的一种新颖共识过程，如果大多数节点批准交易，则判定交易为合法；发送以评估交易的有效性——如果大多数节点接受它，则它是有效的。当许多组织共享敏感信息时，它允许绝对多数条件共识。Xage\
  \ Security 重点关注 `IIoT`，将其 `零信任`（Zero Trust）模型实现在安全织中。`零信任` 是一种基于“从不信任，始终验证”核心前提的安全模型，无论请求源自网络内部还是外部。这区别于标准的安全模型，标准模型通常基于安全的内部网络与不可信的外部网络的对比运行\
  \ [43, 44\\]。\n\n## 7.4 挑战与局限性\n\n`BCT` 因其变革不同行业的潜力而受到认可，提供了增强透明度、可追溯性和减少中间环节等不可否认的优势。作为一种新兴技术，区块链面临着许多挑战和问题。组织在将区块链整合到网络安全策略时可能面临的挑战包括：数据隐私、可扩展性、政策和法规、互操作性、能源消耗和自私挖。\n\
  \n### 7.4.1 数据隐私\n\n在公共区块链中，任何人都可以查看任何地址或实体的交易历史，这可能会无意中暴露与用户行为相关的模式或数据。虽然这些交易与伪匿名地址而非个人姓名相关，但通过足够的数据分析，可能会出现模式并导致去匿名化，特别是当与链外数据结合时。对于希望严密管理公开信息的公司来说，这是一个问题。许多这些隐私担忧可以通过许可区块链来缓解。许可网络由企业区块链平台创建，仅允许受信任的方参与或观察交易并对决策进行投票\
  \ [45, 46\\]。\n\n### 7.4.2 可扩展性\n\n\n\n\n\n# 扩展性\n\n在区块链语境下，扩展性（Scalability）是指区块链系统处理日益增长的交易量并容纳更多用户且不损害性能或安全性的能力。虽然\
  \ `BCT` 为数据完整性和去中心化提供了一种突破性的方法，但它仍面临着重大的扩展性挑战。许多区块链系统的底层架构（特别是第一代系统，如 `Bitcoin`）限制了系统每秒能处理的交易数量。这种限制源于区块大小和区块生成频率等因素。为了确保安全性和匿名性，系统中的每个节点都会在区块中保存、处理并保留交易。然而，随着交易数量的增加，中小型企业难以在一个区块中容纳日益增多的交易。这些增加可能会阻碍验证过程。这些扩展性问题引发了大量的的研究和发明热潮，以开发出既能保持区块链基本优势，又能有效容忍更高交易量的解决方案\
  \ [45–47]]。\n\n## 7.4.3 政策与法规\n\n尽管 `BCT` 具有变革许多行业的潜力，但它面临着复杂的政策和监管限制。作为一种具有许多未知且不可预见风险及困难的新技术，区块链目前正在等待法律监管的采用。监管机构也担心区块链系统（特别是处理金融交易或敏感数据的系统）维持可接受的安全要求，以避免黑客攻击或数据泄露\
  \ [47–49]]。各机构仍在尝试弄清楚区块链结构和复杂性如何适应不断发展的数据隐私、合规和监管格局。欧盟的《通用数据保护条例》（`GDPR`）赋予了个人“被遗忘的权利”，这允许他们请求删除自己的数据。这与区块链的不可篡改性相矛盾。如果将个人数据直接存储在公有区块链上，数据将很难删除，这对\
  \ `GDPR` 的合规构成了挑战 [45]]。\n\n## 7.4.4 互操作性\n\n在区块链语境下，互操作性（Interoperability）是指多个区块链系统在各自网络之间进行无缝通信、信息共享和执行交易的能力\
  \ [50]。互操作性仍然是新兴区块链世界中的主要障碍。尽管具有颠覆性的承诺，但区块链已经催生了多个网络，每个网络都有自己的协议、共识机制和加密标准 [51]。这些孤立的生态系统往往难以相互交换和交互，导致数据和资产池的碎片化。这种限制阻碍了区块链在需要跨链交互的场景中的广泛应用\
  \ [52]。开放协议、多链框架和算法正在区块链中兴起，缓解了这一问题。`GS1` 已建立区块链互操作性的全球标准，并与 `Microsoft` 和 `IBM`\
  \ 合作，将这些标准整合到它们的业务区块链应用中。以太坊企业联盟（Enterprise Ethereum Alliance）也致力于创建商业标准 [45]。解决互操作性对于实现区块链的全部潜力以及创建一个连贯且全球可用的去中心化数字未来至关重要。\n\
  \n## 7.5 结论\n\n`BCT` 已从 `Bitcoin` 交易的核心组件迅速成长为一种对包括网络防御和安全在内的各种行业产生深远影响的变革工具。随着数字攻击变得日益复杂，保证网络安全的传统技术有时不再从心。凭借其去中心化、透明性、不可篡改性和加密安全的独特属性，`BCT`\
  \ 有潜力满足这一需求。区块链的去中心化本质消除了网络保护语境下通常与中心化系统相关的风险。这种去中心化不仅将数据分散在多个节点上，还消除了单点故障（`SPoF`）的可能性。结果，对手在试图破坏区块链内存储数据的完整性或可用性时面临着巨大的困难。\n\
