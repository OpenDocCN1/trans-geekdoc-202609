  \n# 第 5 章 用于医疗保健的区块链技术与自主身份\n\nDilip Kumar\n\nDOI: [10.1201/9781003449515-5](https://doi.org/10.1201/9781003449515-5)\n\
  \n## 5.1 引言\n\n### 5.1.1 区块链\n\n在医学领域，区块链的出现是为了安全地组织患者和处方。假设一个场景，我们有两个城市 A 和 B。现在这个人转向城市\
  \ B，可以获取在 A 城市的病历。\n\n### 5.1.2 区块链\n\n因此，这种情况导致了对分布式数据库或应用的需求，而不是单一存储。有很多分布式应用和数据库可以在互联网上存储和发布，但某些担忧增加了对区块链的需求。\n\
  \n## 5.2 区块链\n\n非区块链（单一存储/数据库或分布式应用）存在以下问题：\n\n*   数据模糊性\n*   安全问题（访问控制、身份验证、不可否赖性和互操作性）\n\
  *   中心化存储\n*   数据共享与访问\n*   可变性\n\n因此，为了解决上述问题，我们可以在医疗保健中使用区块链技术，并利用区块链的特性使患者数据和处方变得安全、透明且不可篡改。\n\
  \n\n\n\n\n-   使用代币（tokens）辅助直接价值交换（加密经济）\n\n区块链是一种去中心化、透明、安全且分布式的数字账本技术，用于存储交易或信息。区块链将信息存储在不可篡改的账本，该账本是分布式且完全透明的。在区块链中，一旦数据被记录，就会变得不可篡改。不可篡意味着记录的数据难以被更改或删除。这是通过加密哈希和共识机制实现的。区块链是一种记录或存储信息的安全方式。我们甚至可以说，它不仅记录了信息，还有助于追踪资产并建立信任。区块链是一个不断增长的有序条目（或区块）集合，这些条目组合成一个数字账本。包含每笔交易的经过加密验证的区块将由网络自动进行认证。\n\
  \n区块链记录被封装在区块中，每个区块都有一个名为`hash`的唯一标识。这些区块相互连接，且每个区块都包含前一个区块的`hash`，这就是区块链名称的由来。这种区块排列方式使得修改变得非常困难，因为所有其他区块都会随之改变，因此区块链是记录我们不希望更改信息的绝佳场所。要在区块链区块中添加新信息或修改任何已记录的信息，此类更改将发送到连接到网络的每个参与者或节点进行验证。如果所有连接的参与者中有超过\
  \ 50%的人验证了信息，则更改将生效并视为有效信息，否则将被视为被篡改的数据。对于这一过程，每个节点因其工作获得奖励，通常以加密货币的形式存在。区块链实现了安全、不可篡改且分布式的数据库，可以在没有主管或中央机构的情况下运行。近年来，区块链技术引起了广泛关注，因为对包括医疗保健在内的许多行业的兴趣日益增长\
  \ [4]。\n\n此处图 5.5 进一步描述了区块链在密码学方面的运行机制。由连接区块组成的链（正如“区块链”名称所示）形成了一个区块链。一旦连接，这些区块就无法被修改或断开。它们必须按照精确的顺序连接。这一基本构想是区块链不可篡改性和安全性的基础。负载（payload，即交易集合）和区块`hash`是每个区块的两个主要元素，如图图\
  \ 5.5 所示。保持链条不可篡改性的基本思想与创建每个区块`hash`的过程密切相关 [5]。\n\n![图 5.5 区块链如何实现数据的不可篡改性和完整性。（基于\
  \ Rocha 2021。）](img/fig5_5.jpg)\n\n图 5.5 区块链如何实现数据的不可篡改性和完整性。（基于 Rocha 2021。）\n\n\
  ```\nhash(x) = hash(hash(x-1)+payload(x))\n```\n\n每个区块的`hash`根据其内部信息以及其之前区块的`hash`决定。这些设计使记录的不可篡改性成为一种副产品，这正是我们所需要的。根据逻辑，在区块记录的每次修改中保持密码学问题的完整性是不可能的。如果发生任何更改历史数据的恶意尝试，结果将破坏连接前一个区块和下一个区块的链接，导致链发生故障且记录不准确\
  \ [6–9]。然而，系统内部的恶意行为者可能会更改你想要阻止的区块，并使每个链的下一个区块变得稳固。这些进展进入了区块链去中心化模型中的下一层保护。尽管计算机网络中的每次交换都受到了保护并被认为是安全准确的，但区块链并没有中央处理枢纽来处理和验证连接。这种可行性的唯一方法是使用共识程序，这是区块链的关键组成部分。\n\
  \n共识规则作为网络中所有参与者的通信通道，使得分布式账本可行。通过这种方式，加密哈希使得区块链得到了大家的认可。根据用例和应用，区块链提供了许多优势和缺点 [10]。\n\
  \n### 5.1.2 为什么是区块链？\n\n分布式账本技术（DLT）是一个由许多人使用和管理的数据库。区块链通过利用不可篡改的加密签名来实现信任。这两个术语经常被混淆或被等同。尽管它们存在相似之处，但区块链和分布式账本是两个完全的概念。虽然区块链可以被视为\
  \ DLT，但也存在其他的 DLT。\n\n\n\n\nSawtooth 的设计旨在具有良好的适应性和可扩展性。它支持许可制和非许可制的安装，因此所有用户都可以访问或参与区块链。其发布版本包含了一种全新的共识算法——执行时间证明（`PoET`）。然而，在此实现中，共识算法是可更换的。尽管如此，`PoET`\
  \ 使用少量的资源来针对广泛分布的验证者群体。通过将交易的业务逻辑从共识层中抽象出来，创建了事务族（Transaction families）。这一架构特性使其目前支持多种编程语言实现，包括\
  \ `C++`、`JavaScript`、`Python`、`Go` 和 `Swift`。目前，通过 Hyperledger Burrow 集成提供了对以太坊智能合约的支持。目前，Sawtooth\
  \ 在许多不同领域运行着许多企业级应用 [5]。另一方面，我们还有来自 Hyperledger 的 Fabric。Fabric 仅支持许可链区块链，而 Sawtooth\
  \ 支持所有类型的区块链。`Fabric` 也缺乏事务族的概念。以太坊合约和智能合约非常相似。`Fabric` 提出了一种革命性的智能合约执行架构 [5]。现有智能合约区块链解决方案的大多数采用“排序-执行”的设计，这要求每个操作在被每个节点执行之前，必须经过验证、指定并交付到所有节点。这意味着确定性是智能合约的要求。否则，可能很难达成共识。通常，通过\
  \ `DSL` 来强制要求这种要求的发生。\n\n图 5.6 展示了 Sawtooth 网络部署的简单示意图。在那里，当前节点与构成整个分布式网络的其他节点之间的连接是可见的。为了与客户端通信并作为区块链信息的门户，节点可能额外包含一个\
  \ `REST API`。基础组件是事务处理器，它位于特定于每个 `SmartAgriChain` 字段的逻辑所在。。它处理我们应用程序所需的逻辑，并包含了我们所有系统的规则。`Sawtooth`\
  \ 策略允许同一网络中的多个事务处理单元，从而实现了多个应用程序的使用。例如，我们的网络实现可能支持使用不同事务处理器运行在同一区块链上的其他应用程序。\n\n\
  ![图 5.6 Hyperledger sawtooth 网络布局与交互。（基于 Rocha 2021。）](img/fig5_6.jpg)\n\n图 5.6\
  \ Hyperledger sawtooth 网络布局与交互。（基于 Rocha 2021。）\n\n### 5.1.3.3 其他考虑的平台\n\n可能会采用另一个平台。然而，其他可能性中的要么尚未准备好使用或仍处于开发早期阶段（例如\
  \ `Cardano`），要么性能没有显著优于 Hyperledger 解决方案（例如 `R3 Corda`）。\n\n### 5.1.4 背景与相关工作\n\n\
  本章使用的思想定义了该术语，我们还查看了相关工作。\n\n### 5.1.4.1 定义\n\n接下来的描述旨在使核心思想更加清晰并解释研究的目标和结论。\n\n\
  1. **电子健康记录**：Hardin 和 Kotz [11, 12] 定义了电子健康记录（`EHR`），其指的是“以患者为中心、安全且即时提供信息的实时记录”。它是数字形式的患者病史。\n\
  2. **互操作性**：根据 IEEE 标准计算机字典 [10]，互操作性是“多个系统或部分共享信息并利用交换信息的能力” [13]。\n3. **隐私**：《世界人权宣言》提到了它\
  \ [14]。任何人都不应受到个人空间、家庭空间、住所的任意侵入，也不应受到对其荣誉和声誉的攻击。Solove [15] 提出的隐私概念被用于我们的研究，我们采用了他通过违规行为来分析隐私的方法。该分类法使用以下类别对侵犯隐私的活动进行分组：\n\
  \n    - **信息收集**：独立第三方通过审问获取知识，可能存在监控（录制、倾听或观察）以及探测行为。\n    - **信息处理**：通过聚合（组合）数据，对记录进行保留、利用和保存。将数据归属于特定个人（识别）、缺乏存储数据保护（不安全）、二次使用、排除（阻止人们了解关于他们的被保留了什么信息）以及用于原始目的之外的其他。\n\
  \    - **信息传播**：数据所有者以某种方式分发或共享信息，从而损害了机密性（违反信息的机密协议）、披露（个人信息的公开）、暴露（类似于披露，但涉及裸体等实体物品）、改进访问（促进信息暴露并易于获取）以及勒索（威胁披露细节）。\n\
  \    - **侵入**：独立个人通过实施侵入性行为或干预决策来违反某人的隐私（涉及政府干预个人选择）。\n\n### 5.1.5 相关工作\n\n* **Suveen\
  \ 等人 (2023)** [13] 指出，基于区块链的技术在医疗行业有许多潜在应用。许多机构已经对可能的解决方案提出了建议，以提高医疗数据的运行效率和透明度，尽管这些仍处于研究开发的早期。然而，在区块链技术进行大规模生产部署之前，还需要更多的研究来确定其可扩展性、安全性和可用性。研究和临床治疗中的应用尚未得到证实，该技术在医疗和其他领域的应用可能会在未来发生。然而，一个消除中间人的分布式系统有很大机会颠覆许多现有流程。\n\
  \n\n\n\n\n- **Mohamed Adel Serhani 等人 (2020)** [16] 得出结论，对于研究人员、医生和其他专业人员来说，选择符合其监测需求、适应使用场景并能协助疾病监测核心需求的心电图（ECG）监测系统是具有挑战性的。由于这些系统是多维的，并且突显了技术、应用性、设计、寿命、分类和问题等许多要素，他们提出并讨论了一种经专家验证的分类模型。他们将情境感知型监测系统分为技术感知、基于方案和频率的、基于目标和目的的，以及尖端\
  \ ECG 监测系统。ECG 监测仪的最新进展已利用大数据、人工智能、深度学习和物联网等尖端技术，创建了复杂、高效益且完全链路的监测系统。得于赋能技术，ECG\
  \ 监测设备具有巨大的前景。物联网引入了远程不受限的连接服务，利用数据做出快速、重要的决策，从而改善生活。\n\n  此外，云处理和雾计算增加了提高生产力的机会，并提供了许多热门的可扩展应用。此外，区块链技术允许在地理分散的环境中进行保护，允许\
  \ ECG 监测系统架构的不同层之间进行许多交易。\n\n- **Abid 等人 (2021)** [17] 涵盖了临床研究、药物追踪、医疗保险和系统追踪。通过使用区块链框架和设备追踪，医院可以在整个生命周期内规划其服务。区块链技术在增强患者历史管理、特别是追踪和保险调解程序方面具有巨大潜力，这将通过改进数据维护加速临床行动。总的来说，该技术的使用将改变患者与医生互动、使用临床记录以及提供医疗保健的方式。\n\
  \n- **Alexandre 等人 (2021)** [9] 彻底检查了与术后感染（SSI）和区块链技术相关的重要论文，我们的研究对这一讨论做出了重大贡献。结果概述显示：这仍然是一个新课题，区块链技术为解决电子健康记录（EHR）系统的核心问题提供了一种可行方法，大多数选定的研究将整合区块链技术作为策略的关键元素，通过在链外外部存储中维护原始健康数据可能实现可扩展解决方案。用户可以更快地从与区块链的数据结构中筛选/选择健康记录。得益于健康相关数据存储标准的实施，基于区块链的电子健康记录系统必须包含智能合约。为了确保患者对数据拥有完全控制，应该扩大数据所有权的概念。\n\
  \n- **Daniel Solove (2008)** [18] 描述了利用我在最后一段创建的分类框架来理解隐私的优势。我希望书中提出的隐私理论可以消除经常围绕隐私概念的不确定性。对隐私有清晰、透彻且实用的理解将有助于制定处理隐私问题的法律和政策。在隐私的概念迷宫中频繁穿梭往往导致隐私问题的解决无效。本书旨在帮助我们穿过这片复杂的领域。\n\
  \n- **Yong 等人 (2019)** [4] 提出了一种基于区块链的 EHR 共享系统，该系统使用并发关键字确保数据安全和隐私、可搜索加密、条件代理重加密以及维护不同医疗机构之间的数据共享。首先，他们提供了一个基于区块链的跨实体\
  \ EHR 共享系统。其次，构建了第三代区块链 EHR 联盟的网络拓扑结构和共识机制以确保系统运行，而 EHR 保存在云端。我们对数据进行了去标识化，通过可搜索加密和条件代理重加密确保数据安全和隐私以实现可搜索性。我们还在\
  \ `Ethereum` 平台上实施了该方案，并评估了实现预期安全所需的计算开销。\n\n- **Satoshi Nakamoto** [19] 提出了一种不依赖信任的电子交易系统。我们从使用工作量证明的对等网络开始，存储一个公共历史，诚实节点控制大部分\
  \ CPU 算力，使得攻击者想要修改历史变得非常困难。\n\n- **Barbara 等人 (2007)** [20] 得出结论，据作者所知，在区块链上使用主权身份模型存储和共享健康信息相关的问题尚未经过评估或调查。旨在为系统综述提供详细建议（如图\
  \ 5.7 所示）对于从事软件工程的博士生和学者来说是合适的。评估特定研究问题、主题或感兴趣的现象的所有可用研究的方法是进行系统文献综述。系统性研究使用可靠、严格且可审计的技术，试图对研究问题做出客观评估。\n\
