  \n### 4.1. 全局训练到特定受试者微调的分析\n\n本节描述了 `EEGCubeNet` 模型在对 `N-1` 个受试者进行全局训练，然后针对特定的剩余受试者进行微调（LOSO-CV\
  \ 方法）在 HC 与 RE 以及 HO 与 RE 两个任务中的性能。结果分别在表 2 和 3 中报告。表 2 和 3 中的每一列代表一个受试者，并报告了全局训练模型在相应受试者上微调后的性能。每一行对应一个特定的微调模型，如第\
  \ 3.3 节所述。正如该节所示，在全局训练和特定受试者微调阶段均应用了 10 折交叉验证。准确率（Accuracy）、精确率（Precision）、召回率（Recall）和\
  \ `F1-score`（F1 分数）详见第 3.5 节，以均值 ± 标准差的形式报告。\n\n表 2. HC 与 RE 分类任务中从全局训练到特定受试者微调的结果。（查看表格）\n\
