- "# 脑机接口应用中 EEG 解码的可解释 3D 深度学习模型\n\n\n\n\nMuhammad Suffian [`orcid.org/0000-0002-1946-285X`](https://orcid.org/0000-0002-1946-285X)¹,\
  \ Cosimo Ieracitano [`orcid.org/0000-0001-7890-2897`](https://orcid.org/0000-0001-7890-2897)²,\
  \ Francesco C. Morabito [`orcid.org/0000-0003-0734-9136`](https://orcid.org/0000-0003-0734-9136)³,\
  \ 以及 Nadia Mammone [`orcid.org/0000-0003-4962-3500`](https://orcid.org/0000-0003-4962-3500)^(3,)\
  \ ¹DIIES, University Mediterranea of Reggio Calabria, Via Zehender, Loc. Feo di\
  \ Vito, Reggio Calabria 89122, Italy ²DICMAPI, University of Naples “Federico II”,\
  \ Piazzale Vincenzo Tecchio, 80, Napoli 80125, Italy ³DICEAM, Mediterranea University\
  \ of Reggio Calabria, Via Zehender, Loc. Feo di Vito, Reggio Calabria 89122, Italy\
  \ M.S. (m.suffian@unirc.it); C.I. (cosimo.ieracitano@unina.it); F.C.M. (morabito@unirc.it);\
  \ N.M. (nadia.mammone@unirc.it) 接收于 2025 年 4 月 24 日；接受于 2025 年 9 月 19 日；在线发表于 2025\
  \ 年 10 月 18 日\n\n## 摘要\n\n脑电图（EEG）信号解码对于脑机接口（BCI）系统的开发至关重要。然而，EEG 信号高度的个体间变异需要针对特定用户进行校准，由于妥善训练这些模型通常需要大量数据，这可能会消耗时间并限制深度学习方法的应用。在此背景下，本文提出了一种多维且可解释的深度学习框架，用于快速且可解释的\
  \ EEG 解码。具体而言，将 EEG 信号投影到空间-频谱-时间域，并使用自定义的三维（3D）卷积神经网络进行处理，此处称为 `EEGCubeNet`。在这项工作中，该方法在运动\
  \ BCI 实验期间记录的 EEG 上得到了验证。具体来说，通过区分开手（HO）和握拳（HC）运动规划与无运动准备（静息态，RE）状态对其进行了研究。所提出的方法基于从全局到特定用户的微调。模型在受试者群体上进行全局训练，然后在最终用户上进行微调，显著缩短了适应时间。实验结果表明，`EEGCubeNet`\
  \ 实现了先进的性能（HC 与 RE 以及 HO 与 RE 的二分类任务准确率分别为 89.56 ± 4.29 和 89.06 ± 4.86），同时降低了框架复杂性和训练时间。此外，为了提高透明度，引入了一种基于\
  \ 3D 遮挡敏感性分析的可解释方法（此处名为 `3D xAI-OSA`），该方法可以生成揭示每个预测中最显著特征的相关性图。数据和源代码可通过以下链接获取：[`github.com/AI-Lab-UniRC/EEGCubeNet`](https://github.com/AI-Lab-UniRC/EEGCubeNet)\
  \ 关键词：脑电图；3D 卷积神经网络；可解释人工智能；脑机接口。\n\n* *\n\n\n## 1. 引言\n\n\n\n\n\n在脑机接口（BCI）领域，大脑与机器之间建立了直接通信。脑信号被采集、解码，并用于与交互式应用程序进行通信.^(1)\n\
  \n## 1. 引言\n\n#### 1.1.1. 运动脑机接口与准备阶段\n运动脑机接口为正在进行主动神经康复和神经假肢控制的患者提供了一个非常有前景的视角。基于脑电图（EEG）的运动脑机接口因其非侵入性、便携性和高时间分辨率而被广泛研究，使其适用于包括神经康复、辅助技术和认知监测在内的广泛领域.^(2)\n\
  \n在运动脑机接口的语境下，本研究专门针对运动准备：即在想象或执行运动启动之前的早期瞬态阶段。该阶段的特征是存在短暂的计划相关活动，通常发生在运动执行前 1–1.5\
  \ 秒。从神经生理学角度来看，运动准备涉及运动相关皮层电位（MRCP）的早期组件，^(3)并与前运动区和运动区神经活动的快速转变有关。\n\n因此，虽然实验任务属于更广泛的运动脑机接口范式范畴，但此处研究的神经特征与预期计划活动（运动准备）有关，这可能包含对低延迟\
  \ BCI 应用有价值的判别信息。\n\n#### 1.1.2. 校准挑战与深度学习\n在 BCI 系统中，针对特定用户的校准至关重要，以考虑 EEG 信号在个体之间的高度变异性。长时间的校准实际上是不现实的，并限制了\
  \ BCI 在现实场景中的可用性。因此，快速的特定受体微调（即针对特定主体的短校准）是未来应用的关键需求。\n\n在使用复杂的深度学习（DL）模型时，这仍然是一个主要挑战，因为这些模型通常需要大型数据集和大量的训练来适应用户。在这种背景下，能够快速适应最终用户的\
  \ DL 模型尤为理想，这也是为什么所提模型在人群上进行全局训练，然后在最终用户（未见受体）上进行微调的原因。\n\n#### 1.1.3. EEGCubeNet\
  \ 架构\n为了解决上述问题，引入了一种新型多维且可解释的深度学习网络 `EEGCubeNet`，专为运动 BCI 任务中的高效 EEG 解码设计。`EEGCubeNet`\
  \ 旨在显著减少校准时间的同时确保高分类性能。\n\n该模型首先在人群级数据集上进行训练，然后在之前未见的受体上进行微调，以便以极少的额外数据快速适应个体用户。`EEGCubeNet`\
  \ 以三维（3D）矩阵的形式处理 EEG 数据，这些矩阵代表了空间-频率-时间域的投影，使其捕捉与运动意图相关的时空神经动力学的完整复杂度。\n\n为了评估所提架构的性能，利用运动\
  \ BCI 实验期间采集的 EEG 记录进行了广泛分析。特别是重点关注了解码运动准备阶段的运动脑机接口（即大脑准备运动执行时、运动启动之前的阶段）。^(4)\n\
  \n#### 在运动准备阶段解码 EEG 信号的能力提供了一个充满前景且很大程度上未被探索的机会，有助于更好地理解运动产生的早期神经机制，从最初的意图和计划到执行。^(5,6)\
  \ 通过针对这一早期阶段，我们可以获得关于运动指令的随时间演变以及大脑如何从计划过渡到行动的新颖见解。\n\n从实用角度来看，在准备阶段解码运动意图可能实现预测性\
  \ BCI，其能够在运动执行之前预测意图运动，并在无法执行时可能通过设备实现它。基于运动准备的 BCI 还可以补充和增强基于运动意念（MI）的系统，后者在卒中神经康复中已经证明了显著的影响。^(7,8)\
  \ 通过整合运动准备信号，基于 MI 的 BCI 可以从更快的响应时间和更高的鲁棒性中获益，特别是在难以维持持续意念的情况下。\n\n#### 1.1.4. 数据集与相关工作\n\
  本研究使用的数据源于 Ofner *et al.* 整理的公开存储库^(15)，其特征是受体在执行涉及同一上肢的一系列复杂运动任务时采集的 EEG 信号。已有几种\
  \ DL 模型，^(9,10) 被用于分析上述数据集。\n\n这些研究的共同目标是识别正在执行的具体运动，并考虑其从准备到启动再执行的整个时间演变。这项工作仅关注准备阶段，由于缺乏运动启动的神经相关物，这本质上更具挑战性。具体而言，从\
  \ EEG 数据中早在在其准备阶段即可预测即将到来的子运动。\n\n特别研究了手部打开（HO）和手部关闭（HC）运动的启动，并将其与中性休息（RE）状态条件区分来。过去关注子运动预测的方法依赖于空间频谱特征，^(4)或空间和时间特征，^(11,12)，它们无法捕捉\
  \ EEG 信号动力学的整体空间、频率、时间演变。Ieritano *et al.*^(11,12) 需要计算密集型的预处理步骤，例如通过反演问题求解来重建皮层源，由于通常采用对多个受体取平均的头部模型，这可能会引入偏差。^(13)\n\
  \n#### 1.1.5. 可解释性的性\n除了 EEG 解码性能外，可解释性可以为 BCI 系统的行为提供有意义的见解，特别是当这些系统从研究环境转向现实应用时。EEG\
  \ 信号确实具有内在噪声、非平稳性，并受个体间和个体内变性的影响，使得在使用机器学习模型时，底层神经解码过程变得复杂且往往不透明。在这种背景下，可解释人工智能（xAI）方法可能有助于调查\
  \ BCI 系统解释神经数据的内部机制，从而增强模型的透明度和信任度。由于 xAI 领域关于 BCI 系统的文献不足，目前缺乏专门的方法来解释或说明 BCI 的\
  \ EEG 信号解码机制。^(14)\n\n\n\n\n\n为了填补这一空白，本文提出了一种新型 3D xAI 遮挡敏感性分析，称为 `3D xAI-OSA`。随后，使用\
  \ `3D xAI-OSA` 框架对提出的分类模型 `EEGCubeNet` 的结果进行解释。`3D xAI-OSA` 通过在考虑的频率随时间变化的同时评估通道的相关性，提供了\
  \ 3D 关联性图。总而言之，本文的主要贡献如下：\n\n*   开发了一种新型基于深度学习（DL）的 EEG 解码模型，能够同时捕捉 EEG 信号的空间、频谱和时间特征；\n\
  *   实现了先进的性能，且无需解决皮层源重建的逆问题，从而避免了计算负担和对头部的模型的依赖；\n*   全面验证了所提模型将在多个受试者上训练期间获得的知识（全局训练）迁移到未见的最终受试者（受试者特定微调）的能力，能够在显著缩短训练时间的同时实现高个体化性能；\n\
  *   引入了一种新型 `3D xAI-OSA` 框架，提供了跨空间、频谱和时间域的 EEG 活动同步解释性。\n\n本文的其余部分结构如下：第 2 节描述了该领域的当前先进水平。第\
  \ 3 节介绍了提出的 `EEGCubeNet` 和 `3D xAI-OSA` 方法。第 4 节展示了结果。第 5 节和 6 节讨论了局限性、未来的潜在扩展并得出了结论。\n\
  \n## 2. 相关工作\n\n此处使用的数据集（Ofner *et al.*^(15))）也曾用于其他研究。特别是，Ofner *et al.*^(15) 评估了不同输入\
  \ EEG 段长度的分类器性能。他们在子动作执行相对于 RE（准备复位）的最高准确率为 80%，而不同子动作执行之间的分类准确率最高达到 40%。Namazi\
  \ *et al.*^(9) 发现，在运动执行（ME）期间肘部弯曲和 HC 运动期间 EEG 信号表现出更高的复杂性，而在 ME 的 HO 和 RE 条件下观察到复杂性较低。Jeong\
  \ *et al.*^(10) 引入了一种依赖受试者的分段频谱滤波（SSSF）方法来解码 MRCP。使用这种方法，他们对 ME 进行了二分类，HC 与 RE 的平均准确率达到\
  \ 0.72 ± 0.09，HO 与 RE 任务达到 0.76 ± 0.06。在另一项相关研究中，Jeong *et al.*^(16) 提出了一种分层流卷积神经网络（CNN），用于区分右前臂旋仰、旋前和\
  \ RE 的三类分类任务。该方法的平均分类准确率为 0.52 ± 0.03。这些研究的共同目标是识别正在执行的特定动作，然而，这项工作的重点仅在于准备阶段，由于缺乏运动启动的神经相关性，该阶段在本质上更具挑战性。另一项基于支持向量机的^(17)\
  \ 工作执行了分类，使用基于傅里叶的同步压缩变换（FSST）作为特征提取器，并使用奇异值分解（SVD）。另一项工作^(18) 提出了图卷积网络（GCN），用于运动\
  \ MI 的分类。\n\n## 3. 方法\n\n数据和代码可通过以下链接获取：[`github.com/EEGCubeNet`](https://github.com/EEGCubeNet)。所提出的\
  \ `3D xAI-OSA` 框架涉及以下关键步骤：\n\n1. **数据预处理**：将 EEG 信号投影到空间、频谱和时间域，形成 `channels × frequency ×��time`\
  \ 卷；\n2. **分类**：将 3D 卷输入到 `EEGCubeNet`，用于 HC 与 RE、HO 与 RE 的分类；\n3. **微调**：；\n4.\
  \ **xAI**：使用 `3D xAI-OSA` 解释 `EEGCubeNet` 的输出，提供空间、频谱和时间域的 EEG 活动关联性。\n\n### 3.1\
  \ 数据预处理\n\n#### 数据处理与数据集构建\n\n### 3.1.1 EEG 预处理\n\n为了评估所提方法的有效性，使用了 16 通道 EEG 数据（g.tec，奥地利）。右乳作为作为参考，AFz\
  \ 被指定为接地。信号经过了 0.01Hz 到 200Hz 的带通滤波（使用了八阶切雪比滤波器），随后通过了 50Hz 陷波滤波器以抑制干扰。采样率为 512Hz，更多细节请参见\
  \ 15。在实验期间，受试者舒适地坐着，右臂由外骨骼支撑（Hocoma，瑞士）。采用了基于提示的运动范式，受试者从标准中立位置执行特定的肢体动作——定义为手臂伸展\
  \ 120°且手部部分开启(15)。实验方案由 10 轮组成，每轮包含 6 次试验。在每次试验中，受试者对要求的提示做出反应。每次运动后，在下一次提示之前，手回到中立位置。运动启动使用手套中的运动传感器数据确定，方法见\
  \ 15。为了确保准确性，所有选定的运动前区间都经过了人工验证。对于每个检测到的运动，提取 1 秒（对应 512 个样本）的 EEG 段。这为每个运动类别（即\
  \ HO 和 HC）产生了 840 个 EEG 段，跨越 10 轮。为了保持类别平衡，包含了相同数量的 RE 段，共 2520 个 EEG 段。\n\n此处使用的数据源自\
  \ Ofner *et al.*^(15)) 该研究包括 15 名健康受试者（平均年龄 27 ± 5 岁），9 名女性和 6 名男性。一名受试者因质量问题被排除在外。总而言，每个受试者的数据集包含\
  \ 120 次 EEG 试验（即 120 个 EEG chans × freq × time 3D 矩阵），每类（HC 或 HO） 60 个，RE 也是 60\
  \ 个。\n\n### 3.1.2 空间滤波 EEG 的时频分析\n\n\n\n\n对于每一个 EEG 分段，为了减轻体积传导效应并减少相邻电极之间的信号相关性，首先对\
  \ EEG 信号进行空间过滤。具体而言，应用一个小小的拉普拉斯滤波器（Laplacian filter）来增强每个电极的局部活动，同时衰减远源的影响，从而提高\
  \ EEG 信号的空间分辨率。之后，将空间过滤后的 EEG 投影到时间-频率（TF）域。该过程如图 1 所示。紧接着，使用连续小波变换（CWT）将空间过滤后的\
  \ EEG 信号投影到 TF 域。具体来说，对于每个空间过滤后的 EEG 分段 `EEG[s]`，为每个单独通道（`i = 1, …, 59`）计算 TF 表示，从而生成\
  \ 59 幅不同的 TF 图。这些图随后被堆叠形成一个维度为 `channel × frequency × time` 的 3D 矩阵，捕捉跨越空间、频谱和时间维度的\
  \ EEG 动态。\n\n为了研究与运动规划和准备相关的频带——即 MRCP（< 5 Hz）、感觉运动节律（13–15Hz）和 `β`-带（约 13–40Hz），分析集中在\
  \ 0.5–40Hz 范围。使用 `MATLAB2024b` 中的 `scal2freq` 函数生成了一组覆盖该范围的 59 个自定义伪频率，并与头皮 EEG\
  \ 通道数匹配。最后，创建了尺寸为 59 × 59 × 512 的 3D 图，然后下采样为 59 × 59 × 128，代表了所分析 EEG 分段的空间-谱-时间动态。下采样允许更快的计算速度，同时不会影响\
  \ EEG 动态表示，因为 128Hz 的采样率能够跟踪分析范围（0.5–40Hz）内的变化。\n\n![图 1. EEG 获取、预处理和数据集创建。该图说明了数据获取范式，该部分在第\
  \ 3.1 节中进行了详细描述。提取运动开始前 1s 的 EEG 段——称为“运动前 EEG 段”，并对其进行标记（如 HC、HO 或 RE），并存储在数据集中。这些\
  \ EEG 信号通过拉普拉斯方法进行空间过滤，然后通过 CWT 进行 TF 分析。生成的 TF 表示被结构化为按通道、频率和时间组织的卷。这些卷随后被相应标记并存储以供进一步分析。](img/s012906572550073xfigf1.png)\n\
  \n图 1. EEG 获取、预处理和数据集创建。该图说明了数据获取范式，该部分在第 3.1 节中进行了详细描述。提取运动开始前 1s 的 EEG 段——称为“运动前\
  \ EEG 段”，并对其进行标记（如 HC、HO 或 RE），并存储在数据集中。这些 EEG 信号通过拉普拉斯方法进行空间过滤，然后通过 CWT 进行 TF 分析。生成的\
  \ TF 表示被结构化为按通道、频率和时间组织的卷。\n\n### 3.2. EEGCubeNet\n\n3D CNN 通过引入额外的时间维度扩展了传统的二维（2D）\
  \ CNN，这使其在处理视频或医学影像等体量数据时特别有效。与仅在空间维度（高度和宽度）上应用卷积的 2D CNN 不同，3D CNN 在高度、宽度和时间上执行卷积，使其能够同时捕捉空间和时间依赖关系。在本文中，根据尝试错误的方法开发了不同的\
  \ 3D CNN。具体来说，通过改变卷积核大小、步长（stride）以及层数来探索不同的配置。在本研究中，`Model 7` 用于二分类任务（HC 对比 RE\
  \ 和 HO），在此处被称为 `EEGCubeNet`。注意的是，选择 `Model 7` 是因为其在 `k`-折验证的多次运行中实现了最高的平均性能，特别是在准确率和\
  \ Cohen's Kappa 方面。重要的是，这一选择并非基于单次结果，而是基于多次运行的优异表现。架构如图 2 所示，由四层 3D 卷积组成，每层后接批次归一化、ReLU\
  \ 激活和池化。模型的输入是尺寸为 `channels × frequency × time` 的 59 × 59 × 128。第一个卷积层 `Conv1` 应用\
  \ 16 个滤波器，生成尺寸为 31 × 31 × 128 的特征图。池化层 `Max-Pool1` 将特征下采样为 15 × 15 × 64。第二个卷积层 `Conv2`\
  \ 具有 32 个滤波器，产生尺寸为 9 × 9 × 64 的特征图。池化层 `Max-Pool2` 将其下采样为 4 × 4 × 32。第三个卷积层 `Conv3`\
  \ 包含 64 个滤波器，输出为 4 × 4 × 32。池化层 `Max-Pool3` 生成尺寸为 2 × 2 × 16 的特征；最后一个卷积层 `Conv4`\
  \ 包含 128 个滤波器，产生 128 幅相同的特征图。最后一个池化层 `Max-Pool4` 输出尺寸为 1 × 1 × 8 的特征向量。这些向量被展平并并通过三个全连接层。第一个全连接层\
  \ `FC1` 由 512 个神经元组成，随后是具有 256 个神经元的 `FC2`，最后是用于二分类的 2 个神经 `FC3`（即 HC 与 RE 以及 HO\
  \ 与 RE）。注意的是，`Conv1` 和 `Conv2` 的卷积核大小为 3 × 3 × 3，步长为 1 × 2，填充（padding）为 1 × 2；而\
  \ `Conv3` 和 `Conv4` 的卷积核大小为 3 × 3 × 3，步长为 1 × 1，填充为 1 × 1。此外，四个池化层的卷积核大小为 2 × 2\
  \ × 2，步长为 2 × 2 × 2。模型使用 `PyTorch` 实现，并采用自适应量估计（Adam）优化器进行训练，学习率设置为 0.001，权重衰减为\
  \ 0.9，批量大小为 8，最多训练 50 个 epoch，并采用早停止策略，运行在配备 NVIDIA RTX 4000 Ada Generation、Intel\
  \ Xeon CPU @2.30 GHz 和 125 GB RAM 的设备上。为了减轻过拟合并增强鲁棒性，在池化层后还应用了 25% 的丢弃率（dropout）。\n\
