  图 6. 不同层微调时 `EEGCubeNet` 模型对于 HO 与 RE 任务的 Cohen Kappa 性能。\n\n### 4.1.1 特征分析\n\n\
  为了进一步研究 `EEGCubeNet` 模型的性能，执行了 t-分布随机嵌入（t-SNE）分析，以可视化提取特征的可区分性。具体而言，`t-SNE` 通过将成对距离的高维数据投影到低维空间，最小化高维分布与低维表示之间的\
  \ Kullback-Leibler 散度，以保留局部结构（27）。图 7 和 8 展示了针对 HC 与 RE 和 HO 与 RE 任务的 `t-SNE` 可视化图（受试者\
  \ `S10`）。可以可视化地评估 `EEGCubeNet` 的特征投影的可区分性。从图中可以观察到一个清晰的趋势，随着微调扩展到深层，类别之间的分离得到改善，这支持了逐步微调的积极影响。这种模式对于\
  \ HC 与 RE 和 HO 与 RE 任务是一致的。`EEGCubeNet` 的 `Conv2+` 和 `Conv3+` 微调版本的平均区分度达到峰，这与表\
  \ 2 和 3 中报告的分类性能一致。这验证了利用全局训练阶段获得的知识到特定受试者微调阶段的方法的有效性。为了进一步分析其他受试者的 `t-SNE` 结果，我们在*补充材料*中提供了受试者\
  \ `S02` 的图表。补充材料通过以下链接提供：https://github.com/AI-Lab-UniRC/EEGCubeNet。\n\n### 4.1.2\
  \ 性能与模型复杂性\n\n\n\n\n\n模型选择以及针对新主题进行微调的程度，不仅取决于分类性能，还取决于其他关键方面，例如在尺寸和训练时间方面的模型复杂度。为了在性能（准确率）和模型复杂性（训练时间和参数数量）之间提供对比（权衡），在图\
  \ 9 中，每个模型都用不同颜色的圆表示，以便清晰直观地解释趋势。圆心对应于以对数比例计算的参数数量（`x` 轴）以及该模型提供的平均准确率（`y` 轴）。圆的半径与完成一次\
  \ 10 折训练过程所需的时间成正比。在单个主题的整个数据集上对完整模型进行 10 折微调，平均耗时约 2.5 分钟。这一分析揭示了一个一致的模式：随着模型微调层数的增加和可训练参数数量的增加，分类准确率也随之提高，从\
  \ `FC3` 一到 `Conv3+`。从 `Conv3+` 开始，趋势变缓并发生反转。微调卷积层的 `Conv+` 模型实现了更好的性能。尽管这种改进伴随着参数数量的增加，但参数计数仍保持在适合未来潜在部署的范围内。这些特征使得模型特别适用于真实的脑机接口（BCI）应用，因为较短的模型微调时间可以缩短校准时间，这是至关重要的，因为校准需要受试者的积极配合，受试者必须接受数据采集环节，以使模型适应其脑波。此外，结果强调了单个经过良好校准的模型可以有效用于解码新加入受试者的\
  \ EEG 活动，而无需广泛的重新训练。这证明了该模型在动态和资源受限环境中的实用性和适应性![Fig. 9. EEGCubeNet 模型的性能、校准时间与模型尺寸（参数数量）的对比。特定模型的圆圈中提到了参数数量为\
