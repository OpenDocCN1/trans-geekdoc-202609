  \n（注：由于输入文本中存在严重的重复，译文合并了重复信息以确保逻辑的连贯性。）\n\n### 3.5. 性能指标\n\n`EEGCubeNet` 的性能使用标准指标进行评估，即：\n\
  $\\text{准确率} = \\frac{TP + TN}{TP + TN + FP + FN}$\n$\\text{精确率} = \\frac{TP}{TP\
  \ + FP}$\n$\\text{召回率} = \\frac{TP}{TP + FN}$\n$F1\\text{-得分} = \\frac{2 \\cdot\
  \ \\text{精确率} \\cdot \\text{召回率}}{\\text{精确率} + \\text{召回率}}$；以及 Cohen 系数（K-Cohen）$\\\
  kappa = \\frac{p_o - p_e}{1 - p_e}$（其中 $p_o$ 是观测一致性，$p_e$ 是预期一致性），量化预测与真实标签之间致性。准确率仅衡量正确预测的比例，而\
  \ K-Cohen 考虑了可能发生的一致性水平。需要注意的是 `TP` 和 `TN` 代表真正和真负，`FP` 和 `FN` 代表假正和假负。具体而言，`TP`\
  \ 表示被正确分类为运动前（HC 或 HO）类别的 EEG 试验，而 `TN` 指被正确分类为 RE 的试验。相反，`FP` 代表 RE 被误分类为运动前，而\
  \ `FN` 指运动前被误分类为 RE。\n\n## 4. 结果\n\n在本节中，报告 `EEGCubeNet` 的分类性能。提出的方法 `EEGCubeNet`\
  \ 与 `3D-EEGNet` 进行了比较。`3D-EEGNet` 是按照文献 26 中描述的结构实现的。两种方法都使用 LOSO-CV 策略进行评估：使用 $N-1$\
  \ 个受试者的数据训练模型，并在剩下的受试者上进行测试。比较结果如图 4 所示，该图显示了两种方法获得的测试准确率箱图。为了评估统计显著性，执行了 Wilcoxon\
  \ 符号秩检验，结果显示 `EEGNet` 显著优于 `3D-EEGNet`（$p < 0.05$）。\n\n![图 4. EEGCubeNet 和 3D-EEGNet\
  \ 在 HC 与 RE（左侧子图）以及 HO 与 RE（右侧箱图）分类中实现的测试准确率箱图。](img/s012906572550073xfigf4.png)\n\
