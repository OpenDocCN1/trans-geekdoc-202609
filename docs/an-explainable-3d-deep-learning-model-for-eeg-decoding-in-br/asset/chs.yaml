  \ 2，从 `FC3` 到 `Conv1+` 的不同微调版本的 `EEGCubeNet`）。`x` 轴以 10 为底的对数比例报告参数数量以提高图表的可读性。\n\
  \n## 4.2. 3D xAI-OSA 的评估\n\n本节展示了 `EEGCubeNet` 模型在分类 EEG 数据以 HC 与 RE 以及 HO 与 RE\
  \ 任务时输出结果的解释结果。所提出的可解释分析方法 `3D xAI-OSA` 已在第 3.4 节描述。具体而言，该方法对每个 EEG 试验生成并应用多个不同维度的掩码（通道\
  \ × 频率 × 时间 3D 矩阵），作为回报，获得了一个 3D 相关性矩阵，包含输入体在空间、频谱和时间维度上的相关性。如第 3.4 节所示，为了评估关键 EEG\
  \ 频带内的相关性（delta: 0–4Hz，theta: 4–8Hz，alpha: 8–13Hz 和 beta: 13–40Hz），利用代表频率和时间相关性的\
  \ 3D 显著图来观察特定频带内的通道平均行为。具体而言，估计了每个受试者在四个主要频带（delta, theta, alpha 和 beta）内的 EEG 通道相关性。然后，使用开源\
  \ Python 包 `MNE` 根据第 3.4 节所述的方法将平均相关性值可视化为地形图，以便解释空间模式。图 10 展示了受试者 01 地的地图示例，而补充材料报告了所有受试者的相应数据。地形图中的红色区域显示较高的相关性/激活，蓝色显示较低的相关性。此外，识别了每个试验中最相关的通道，并以直方图的形式显示试验的平均相关性\
  \ ± 标准差。图 11 显示了受试者 01 的直方图，所有受试者的相应数据提供在补充材料中![图 10. 不同频带（delta, theta, alpha 和\
  \ beta）的通道平均相关性地形图](img/s012906572550073xfigf10.png)\n\n图 11. HC 与 RE 分类（左图）和 HO\
  \ 与 RE 分类（右图）中跨频带的前 5 个最相关通道的平均相关性。每个条形代表特定子频内给定通道的平均相关性。\n\n\n\n\n在本研究中，引入了一种名为\
  \ `EEGCubeNet` 的新型用于解码 EEG 信号的多维且可解释的深度学习框架，并在运动 BCI 实验期间记录的 EEG 信号上进行了验证。这项工作的核心动机是为了解决将深度学习模型应用于基于\
  \ EEG 的 BCI 时的核心挑战之一：EEG 信号中显著的个体间差异，这使得必须进行用户特定的校准。校准过程通常非常耗时，特别是当涉及深度学习模型时，因为它们通常需要大量数据进行训练，导致需要长时间的\
  \ EEG 记录以对最终用户进行模型微调。在此背景下，开发支持快速个体特定微调的模型是迈向更具部署性和用户友好的深度学习 BCI 系统的关键一步。为了满足这一需求，`EEGCubeNet`\
  \ 首先在群体级数据集上进行训练，随后在未见的受试者进行微调。具体而言，分析了在运动 BCI 实验期间获取的公开数据集 EEG，旨在表征 HO 运动启动（pre-HO\
  \ 与 RE 分类）和 HC 运动启动（pre-HC 与 RE 分类）。`EEGCubeNet` 的输入是代表 EEG 信号投影到空-频-时域的 3D 矩阵。这种策略证明了将复杂的深度学习模型高效适应新用户的可性，从而在保持分类性能的同时减轻了训练负担。性能之外，模型的可解释性在确保神经解码过程的透明度和可解释性方面起着重要作用，特别是在临床和辅助环境中。在文献\
  \ 11 中，作者通过源层面的遮挡敏感性分析（OSA）解释了基于 CNN 的 EEG 解码，揭示了中心区域、前运动层右颞区和初级运动层在 EEG 源分类中起着至关重要的作用。值得注意的是，在\
  \ OSA 中，敏感性掩码通常应用于 2D 图像以解释分类决策。最近的一项研究通过将时间维度引入遮挡敏感性分析，将这种方法扩展到视觉解释 3D CNN 的决策过程（28）。然而，由于非平稳且噪声的\
  \ EEG 信号分布在多个帧中且具有个体间及个体间的连续性，将此策略应用于 3D 体积 EEG 数据面临着挑战。此外，使用光流掩码可能会导致遮挡每个通道频率帧的大部分内容，导致识别高度相关通道及其频率随时间变化所需信息的丢失。为此，还引入了一种基于遮挡敏感性分析的新型\
  \ 3D 可解释性框架，称为 `3D xAI-OSA`。该技术能够更深入地理解有助于网络决策的空-谱-时模式，为与手部运动相关的准备性脑活动如何在 EEG 数据中被表征提供了见解。\n\
  \n### 5.1. 拟提方法的影响\n\n总的来说，`EEGCubeNet` 结合 `3D xAI-OSA` 框架代表了创建稳健、自适应且可解释的 BCI 系统的一个极具前景的方向。`EEGCubeNet`\
  \ 相比于以往模型^(4,11,12) 的优势是多方面的：\n\n- 它在头皮水平处理 EEG 信号而无需重建皮层源，这在计算复杂度方面具有优势。此外，它不需要使用头模型，头模型可能无法准确反映被检受试者的脑结构，从而可能引入偏差^(11)；\n\
  - 得益于从群体到个体特定的方法，它利用了在训练阶段从受试者群体中获取的知识，在减少最终用户训练时间的同时实现了相当的性能；\n- 它以相当的性能解码 EEG\
  \ 信号，同时考虑了它们在空间、频率和时间上的动力学演变，而不仅仅是空间和频率^(4) 或空间和时间^(11)；\n- `EEGCubeNet` 结合 `xAI-3D-OSA`\
  \ 方法能够对模型结果进行解释，允许在 HC 和 HO 运动启动期间频率变化时，在最相关通道中检测受试者特定的趋势。\n\n关于训练时间，在文献 12 中，这是一种双分支深度学习模型，每个受试者\
  \ 10 折的训练时间一个分支约为 30 分钟，另一个分支为 1.5 小时。在文献 11 中，每个受试者 10 折的训练时间为 10 分钟，不包括执行反问题求解以重建皮层源所需的时间。在文献\
  \ 4 中，平均训练时间约为 9 分钟，但分类是在帧级别进行的（一个帧是通道频率图，一个 1 秒的 EEG 试验包含 512 帧），而不是像本工作这样在试验级别进行。`EEGCubeNet`\
  \ 对于单个受试者的 10 折平均训练时间为 4.35 分钟，推理时间为 23 秒；3D EEG 的 10 折平均训练时间为 65 分钟，推理时间为 33 秒。\n\
  \n### 5.2. 局限性与未来工作\n\n本工作的局限性在于每个受试者每类的样本数量较少。未来的研究应该考虑更大的数据集，以验证模型解码更复杂任务的能力。这将扩展解释分析，其有效性取决于分类器的泛化能力。其次，运动启动是通过处理实验期间参与佩戴的手套传感器采集的数据标记的。通过手套采集的运动数据是平滑的，无法实时检测，这意味着用于训练的可能捕获了运动执行的早期，这在原理上可能导致类似的激活模式。所提方法的未来潜力之一是其在在线框架中的适用性，因为适应最终用户需要更新的参数较少。由于\
  \ `EEGCubeNet` 设计用于分析代表空-频-时域 EEG 信号的 3D 矩阵，它能够有效地捕捉 EEG 信号特征在空间域（即跨不同通道）和频域（即跨不同频率）中随时间演变之间复杂的相互作用。这种固有的能力使得假设将模型扩展到其他应用（如注意力检测、情绪识别、睡眠监测、神经系统疾病诊断）是相对直接的。然而，为了验证这一假设，必须在特定于每个领域的数据集上对模型进行调整和严格测试。这一方向将是未来研究的主要目标之一，特别是考虑到这些主题在计算神经科学和神经技术领域日益增长的重要性。\n\
  \n\n\n\n本研究介绍了 `EEGCubeNet`，这是一种新型的可解释深度学习框架，旨在解码 EEG 信号，并特别关注减少针对受试者的适应性。通过将 EEG\
  \ 数据投影到空-频-时域并采用从全局到特定个体的训练方法，`EEGCubeNet` 在展现强大解码性能的同时，显著缩短了新用户所需的训练时间。该模型架构直接在头皮级\
  \ EEG 上运行，无需进行源重建，具有高计算效率并避免了头部模型可能引入的偏差。结合新提出的 `xAI-3D-OSA` 可解释性框架，`EEGCubeNet`\
  \ 还能对其驱动预测的神经模式提供透明见解，特别适用于临床和辅助应用。此外，`EEGCubeNet` 的适应性、效率和解释性使其成为集成到实时 BCI 系统的理想人选。\n\
