  \ `softmax` 函数获得原始输入和掩码输入的类别概率得分。为了给输入中被掩码的像素/区域分配相关性，使用了绝对差和（SAD）。`SAD` 是一种量化模型预测中结果变化程度的合适指标，特别是当关注在于差异的整体幅度而非分布之间细微的形状变化时。`SAD`\
  \ 提供了一种简单且易于解释的总差异衡量方法。\n\n输入体数据（通道 × 频率 × 时间）代表了跨越空间、频谱和时域的 EEG 信号动力学。对输入体的一个区域进行掩码意味着在给定的频率和时间范围内遮挡特定的通道。理解掩码该区域对分类的影响，可以评估这些通道在相应频率段、该时间段内对分类任务（运动前相对于\
  \ RE）的相关性。为了确保相关性评估的平滑和连续，采用了重叠滑动窗口方法，步长等于 `T`/2。通过这种方式，给定的通道（`c`）、频率（`f`）和时间点（`t`）的相关性会被多次评估，取决于它被滑动掩码遮挡的频率。然后计算这些相关性值的平均值，以获得输入体中特定元素\
  \ `(c,f,t)` 的平均相关性评分。\n\n具体而言，当 `(c,f,t)` 元素被掩码遮挡并评估被遮挡区域的相关性时，生成的相关性评分将分配给所有受遮挡影响的\
  \ `(c,f,t)` 元素。在整个输入体扫描过程中，每个 `(c,f,t)` 元素总共会被遮挡 `n` 次，并为其计算出 `n` 个相应的相关性评分。程序结束时，对这些评分取平均值（即求和并除以\
