    \ to decode EEG signals with a particular focus on minimizing subject-specific\
    \ adaptation. By projecting EEG data into the space–frequency–time domain and\
    \ adopting a global-to-subject-specific training approach, *EEGCubeNet* demonstrated\
    \ strong decoding performance while significantly reducing the training time required\
    \ for new users. The model’s architecture, which operates directly on scalp-level\
    \ EEGs without source reconstruction, offers computational efficiency and avoids\
    \ potential bias introduced by head models. Coupled with the newly proposed *xAI-3D-OSA*\
    \ explainability framework, *EEGCubeNet* also provides transparent insights into\
    \ the neural patterns driving its predictions, making it especially suitable for\
    \ clinical and assistive applications. In addition, *EEGCubeNet*’s adaptability,\
    \ efficiency, and interpretability make it a good candidate for integration into\
