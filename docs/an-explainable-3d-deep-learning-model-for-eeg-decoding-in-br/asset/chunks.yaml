    For every EEG segment, to mitigate volume conduction effects and reduce signal
    correlations between adjacent electrodes, EEG signals are initially spatially
    filtered. Specifically, a small Laplacian filter is applied to enhance the local
    activity at each electrode while attenuating the influence of distant sources,
    thereby improving the spatial resolution of the EEG signals. After that, spatially
    filtered EEGs are projected into the time–frequency (TF) domain. This process
    is schematized in Fig. 1. Spatially filtered EEG signals were then projected into
    the TF domain using the Continuous Wavelet Transform (CWT). Specifically, for
    each spatially filtered EEG segment `EEG[s]`, the TF representation was computed
    for each individual channel (`i = 1, …, 59`), resulting in 59 distinct TF maps.
    These maps were then stacked to form a 3D matrix with dimensions: `channel × frequency
    × time`, capturing EEG dynamics across spatial, spectral, and temporal dimensions.


    To investigate frequency bands relevant to motor planning and preparation — namely,
    MRCP (< 5 Hz), sensorimotor rhythms (13–15Hz), and the `β`-band (approximately
    13–40Hz), the analysis was focused on the 0.5–40Hz range. A custom set of 59 pseudo-frequencies
    spanning this range was generated using the `scal2freq` function in `MATLAB2024b`,
    matching the number of scalp EEG channels. In the end, 3D maps sized 59 × 59 ×
    512 were created, and then downsampled to 59 × 59 × 128, representing the spatial–spectral–temporal
    dynamics of the EEG segment under analysis. Downsampling allowed for a faster
    computation while not affecting EEG dynamics representation as a sampling rate
    of 128Hz is able to follow the variations in the range under analysis (0.5–40Hz).


    ![Fig. 1. EEG acquisition, preprocessing, and dataset creation. The figure illustrates
    the data acquisition paradigm, which is described in detail in Sec. 3.1. EEG segments
    of 1s preceding the onset of motion — referred to as pre-motion EEG segments —
    are extracted, labeled (as HC, HO, or RE), and stored in a dataset. These EEG
    signals undergo spatial filtering using the Laplacian method, followed by TF analysis
    via the CWT. The resulting TF representations are structured into volumes organized
    by channel, frequency, and time. These volumes are then labeled accordingly and
    stored for further analysis.](images/s012906572550073xfigf1.png)


    Fig. 1. EEG acquisition, preprocessing, and dataset creation. The figure illustrates
    the data acquisition paradigm, which is described in detail in Sec. 3.1. EEG segments
    of 1s preceding the onset of motion — referred to as pre-motion EEG segments —
    are extracted, labeled (as HC, HO, or RE), and stored in a dataset. These EEG
    signals undergo spatial filtering using the Laplacian method, followed by TF analysis
    via the CWT. The resulting TF representations are structured into volumes organized
    by channel, frequency, and time.


    ### 3.2. EEGCubeNet


    3D CNNs extend traditional two-dimensional (2D) CNNs by incorporating an additional
    temporal dimension, making them particularly effective for processing volumetric
    data as videos or medical imaging. Unlike 2D CNNs, which apply convolutions only
    across spatial dimensions (height and width), 3D CNNs perform convolutions over
    height, width, and time, enabling them to capture both spatial and temporal dependencies.
    In this paper, different 3D CNNs were developed according to a trial-and-error
    approach. Specifically, kernel sizes and strides, along with the number of layers,
    were varied to explore different configurations. In this study, `Model 7` is employed
    for binary classification tasks (HC versus RE and HO) and is here referred referred
    as `EEGCubeNet`. It is to be noted that `Model 7` was selected because it achieved
    the highest average performance across multiple runs of `k`-fold validation, specifically
    in terms of both accuracy and Cohen’s Kappa. Importantly, this selection was not
    based on a single metric or run but reflects superior performance across multiple
    folds. The architecture is shown in Fig. 2 and consists of four 3D convolutional
    layers, each followed by batch normalization, ReLU activation, and max pooling.
    The input to the model is the 3D volume `channels × frequency × time` sized `59
    × 59 × 128`. The first convolutional layer `Conv1` applies 16 filters, producing
    16 feature maps of size `31 × 31 × 128`. The 3D max-pooling layer `Max-Pool1`
    downsamples the 16 features to `15 × 15 × 64`. The second convolutional layer
    `Conv2` has 32 filters and produces 32 feature maps of size `9 × 9 × 64`, that
    are further downsampled to `4 × 4 × 32` by means of the max-pooling operation
    `Max-Pool2`. The third convolutional layer `Conv3` consists of 64 filters with
    output dimensions of `4 × 4 × 32`. The third max-pooling layer `Max-Pool3` generates
    64 features sized `2 × 2 × 16`; while the final convolutional layer `Conv4` contains
    128 filters, resulting in 128 feature maps of the same size `2 × 2 × 16`. The
    last max-pooling layer `Max-Pool4` outputs 128 features vectors of size `1 × 1
    × 8`. These are flattened and passed through three fully connected layers. The
    first fully connected layer `FC1` consists of 512 neurons, followed by `FC2` with
    256 neurons, and finally, `FC3` with 2 neurons for binary classification (i.e.
    HC versus RE and HO versus RE). It is to be noted that for `Conv1` and `Conv2`
    the kernel size is `3 × 3 × 3`, strides `1 × 2 × 2` and padding is `1 × 2 × 2`;
    while, for `Conv3` and `Conv4` the kernel size is `3 × 3 × 3`, stride is `1 ×
    1 × 1` and padding is `1 × 1 × 1`. In addition, the four max-pooling layers have
    kernel size of `2 × 2 × 2` and stride of `2 × 2 × 2`. The model was implemented
    in `PyTorch` and trained with the Adaptive Moment Estimation (Adam) optimizer,
    using learning rate of 0.001, weight decay of 0.9, and a batch size of 8, for
    up to 50 epochs and adopting the early stopping strategy on an NVIDIA RTX 4000
    Ada Generation installed on a processor with an Intel Xeon (R) CPU @2.30 GHz and
    a RAM of 125 GB. To mitigate overfitting and enhance robustness, a dropout rate
    of 25% was also applied after the pooling layers.


    ![Fig. 2. The architecture of EEGCubeNet model and its fine-tuning mechanism,
    where layer-wise fine-tuning is illustrated using different colors. The shaded
    area with different colors represents the progressive fine-tuning process, starting
    from the last layer and extending to the entire model.](images/s012906572550073xfigf2.png)


    Fig. 2. The architecture of `EEGCubeNet` model and its fine-tuning mechanism,
    where layer-wise fine-tuning is illustrated using different colors. The shaded
    area with different colors represents the progressive fine-tuning process, starting
    from the last layer and extending to the entire model.


    Table 1. Architectures of different 3D-CNNs. It is worth noting that `Model 7`
    refers to the configuration providing the best performance (on average, across
    the k-fold cross-validation runs), which was adopted in this study. ([Table view](s012906572550073xtbl001-wrap.xhtml))


    | Layer || Parameter || Model 1 || Model 2 || Model 3 || Model 4 || Model 5 ||
    Model 6 || Model 7 || Model 8 || Model 9 || Model 10 || Model 11 || Model 12 |

