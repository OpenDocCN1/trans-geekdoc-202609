    \ as neural correlates of motion initiation are missing. Specifically, upcoming\
    \ sub-movements are predicted from EEG data as early as their preparatory stage.\
    \ In particular, hand opening (HO) and hand closing (HC) movement initiation are\
    \ investigated, discriminating them for the neutral resting (RE) state condition.\
