    3D 矩阵。


    为了确保相关性评估的稳健性，对不同掩码尺寸进行了分析。使用了尺寸为 2 × 2 × `T`、4 × 4 × `T`、8 × 8 × `T`、16 × 16
    × `T`、24 × 24 × `T` 的掩码（其中 `T` = 32 且 = 64），并评估了它们对模型决策的影响。给定掩码尺寸，掩码在整个输入体上滑动（重叠方式），每一步遮挡体的一个区域。为了完成对整个体的扫描，掩码在
    `M` 个不同的位置移动。对于这 `M` 个遮挡位置中的每一个，都会评估原始输入体和遮挡体的概率得分。选择原始体评分与遮挡体评分之间差异最大的掩码尺寸用于解释性分析。


