    is a critical step toward more deployable and user-friendly DL-based BCI systems.
    To meet this need, `EEGCubeNet` was first trained on a population-level dataset
    and subsequently fine-tuned on unseen subject. In particular, EEG derived from
    a public dataset acquired during motor BCI experiments were analyzed, with the
