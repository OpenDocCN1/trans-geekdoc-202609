- raw: 'The choice of the model and to what extent it should be fine-tuned for the
    new subjects depends not only on the classification performance but also on some
    other key aspects such as the model complexity in terms of both size and training
    time. To provide a comparison (tradeoff) between performance (Accuracy) and model
    complexity (training time and number of parameters), in Fig. [9](s012906572550073xfigf9.xhtml)
    every model was represented as a circle with a different color, allowing for a
    clear and intuitive interpretation of the trends. The center of the circle corresponds
    to the number of parameters in log scale (*x*\-axis) and to the average accuracy
    provided by that model (*y*\-axis). The radius of the circle is proportional to
    the training time necessary to complete one run of the 10-fold training process.
    Fine-tuning the complete model on the whole dataset of a single subject, over
    10 folds, took around 2.5 min on average. This analysis highlights a consistent
    pattern: as more layers of the model were fine-tuned, and the number of trainable
    parameters increased, the classification accuracy also increased, from FC3 to
    Conv3+. From Conv3+ onwards, the trend slows down and reverses. The Conv+ models,
    in which the convolutional layers were fine-tuned, achieved better performance.
    This improvement comes with an increase in the number of parameters, nevertheless,
    the parameter count remains within a range suitable for potential future deployment.
    These characteristics make the model particularly suitable for real BCI applications,
    where a short model fine-tuning time enables a short calibration, which is crucial
    since calibration requires the active cooperation of the subject, who must undergo
    data acquisition sessions aimed at tailoring the model to his/her own brain waves.
    Furthermore, the results highlight that a single, well-calibrated model could
    be effectively used to decode EEG activity for new incoming subjects without requiring
    extensive retraining. This endorses the model’s practicality and adaptability
    in dynamic and resource-constrained environments. ![Fig. 9. Performance versus
    calibration time versus model size (number of parameters) of EEGCubeNet model.
    The number of parameters are mentioned as #Param. in the circles of the specific
    models (the different fine-tuned versions of EEGCubeNet from FC3 to Conv1+, for
    details, refer to Fig. 2). The number of parameters are reported in log scale
    with base 10 on x-axes to improve the figure readability.](images/s012906572550073xfigf9.png)


    Fig. 9. Performance versus calibration time versus model size (number of parameters)
    of *EEGCubeNet* model. The number of parameters are mentioned as #Param. in the
    circles of the specific models (the different fine-tuned versions of *EEGCubeNet*
    from FC3 to Conv1+, for details, refer to Fig. [2](s012906572550073xfigf2.xhtml)).
    The number of parameters are reported in log scale with base 10 on *x*\-axes to
    improve the figure readability.


    ### 4.2.  Evaluation of 3D xAI-OSA


    This section presents the results of the explanation of the outcomes of *EEGCubeNet*
    model in classifying EEG data for the tasks of HC versus RE and HO versus RE.
    The proposed explainable analysis, *3D xAI-OSA*, was described in Sec. [3.4](#index.xhtml#sec-3-4).
    Specifically, this approach generates and applies multiple masks of different
    dimensions to each EEG trial (channels × frequency × time 3D matrices), and, in
    return, a 3D relevance matrix was obtained containing the relevance of the input
    volume along the spatial- spectral- and temporal dimensions. As explained in Sec. [3.4](#index.xhtml#sec-3-4),
    to assess the relevance within key EEG frequency bands (delta: 0–4Hz, theta: 4–8Hz,
    alpha: 8–13Hz, and beta: 13–40Hz), the 3D saliency map, representing channel relevance
    across frequency and time, was utilized to observe the average behavior of channels
    within each specific frequency sub-band. Specifically, the relevance of EEG channels
    within the four primary frequency bands (delta, theta, alpha, and beta) was estimated
    across trials for each subject. The average relevance values were then visualized
    using topographical plots, as explained in Sec. [3.4](#index.xhtml#sec-3-4), using
    the open-source Python package MNE, to facilitate the interpretation of spatial
    patterns. Figure [10](s012906572550073xfigf10.xhtml) presents examples of the
    topographical maps achieved for subject 01, while the *Supplementary Material*
    reports the corresponding data for all subjects. The red region in the topographical
    maps shows higher relevance/activation and blue shows lower relevance. In addition,
    the most relevant channels are identified for each trial, and the average relevance
    ± standard deviation across trials is displayed in the form of histograms. Figure [11](s012906572550073xfigf11.xhtml)
    shows the histograms for subject 01, with corresponding data for all subjects
    provided in the *Supplementary Material*. ![Fig. 10. Topographical maps showing
    the average relevance of channels across the frequency bands (delta, theta, alpha,
    and beta).](images/s012906572550073xfigf10.png)


    Fig. 10. Topographical maps showing the average relevance of channels across the
    frequency bands (delta, theta, alpha, and beta).


    ![Fig. 11. Average relevance of the top-5 relevant channels across the frequency
    bands in the HC versus RE classification (left subplot) and HO versus RE classification
    (right subplot). Each bar represents the mean relevance of a given channel in
    a specific sub-band.](images/s012906572550073xfigf11.png)


    Fig. 11. Average relevance of the top-5 relevant channels across the frequency
    bands in the HC versus RE classification (left subplot) and HO versus RE classification
    (right subplot). Each bar represents the mean relevance of a given channel in
    a specific sub-band.


    ## 5\. Discussion'
