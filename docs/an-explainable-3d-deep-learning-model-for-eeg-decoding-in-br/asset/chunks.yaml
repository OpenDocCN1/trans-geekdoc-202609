    To fill this gap, a novel 3D xAI Occlusion Sensitivity Analysis, here referred
    to as `3D xAI-OSA`, is proposed. The outcomes of the proposed classification model,
    `EEGCubeNet`, are then explained using the `3D xAI-OSA` framework. `3D xAI-OSA`
    provides 3D relevance maps by simultaneously evaluating the relevance of channels
    as the considered frequency varies over time. In summary, the following are the
    main contributions of this paper:


    * Development of a novel DL-based EEG decoding model that simultaneously captures
    the spatial, spectral, and temporal characteristics of EEG signals;

    * Achievement of state-of-the-art performance without the need to solve the inverse
    problem for cortical source reconstruction, thereby avoiding the computational
    burden and dependence on a head model;

    * Comprehensive validation of the proposed model’s ability to transfer knowledge
    acquired during training on multiple subjects (global training) to the adaptation
    to the unseen final subject (subject-wise fine-tuning), enabling high individual
    performance with significantly reduced training time;

    * Introduction of a novel `3D xAI-OSA` framework that provides simultaneous interpretability
    of EEG activity across spatial, spectral, and temporal domains.


    The rest of this paper is organized as follows. Section [2](#index.xhtml#sec-2)
    describes the current state-of-the-art in the field. Section [3](#index.xhtml#sec-3)
    presents the proposed `EEGCubeNet` and the `3D xAI-OSA` method. Section [4](#index.xhtml#sec-4)
    presents the results. Sections [5](#index.xhtml#sec-5) and [6](#index.xhtml#sec-6)
    discuss limitations, potential future extensions, and conclude the paper.


    ## 2. Related Work


    The dataset here used (Ofner *et al.*^([15](#index.xhtml#S012906572550073XBIB015)))
    has been employed also in other studies. In particular, Ofner *et al.*^([15](#index.xhtml#S012906572550073XBIB015))
    assessed classifier performance across different input EEG segment lengths. Their
    highest accuracy for sub-movement execution versus RE was 80%, while classification
    between distinct sub-movement executions reached a maximum of 40%. Namazi *et
    al.*^([9](#index.xhtml#S012906572550073XBIB009)) found out that EEG signals exhibited
    higher complexity during elbow flexion and HC movements in motor execution (ME),
    while lower complexity was observed during HO and RE conditions in ME. Jeong *et
    al.*^([10](#index.xhtml#S012906572550073XBIB010)) introduced a subject-dependent,
    section-wise spectral filtering (SSSF) method for decoding MRCP. Using this approach,
    they performed binary classifications of ME, achieving an average accuracy of
    0.72 ± 0.09 for HC versus RE, and 0.76 ± 0.06 for HO versus RE tasks. In a related
    study, Jeong *et al.*^([16](#index.xhtml#S012906572550073XBIB016)) proposed a
    Hierarchical Flow Convolutional Neural Network (CNN) for a three-class classification
    task distinguishing between right forearm supination, pronation, and RE. This
    approach yielded an average classification accuracy of 0.52 ± 0.03. The common
    objective across these studies was to identify the specific movement being executed,
    however, the focus of this work is on the preparation phase alone, which is inherently
    more challenging as neural correlates of motion initiation are missing. Another
    work based on support vector machines-based^([17](#index.xhtml#S012906572550073XBIB017))
    performed the classification of motor EEG and RE states using Fourier-based synchrosqueezing
    transform (FSST) as a feature extractor and singular value decomposition (SVD)
    as a feature selection method. Another work^([18](#index.xhtml#S012906572550073XBIB018))
    proposed graph convolutional network (GCN) as compared to CNN for the classification
    of four movements of MI. Their model was built on functional connectivity of topological
    structures and time points.


    ## 3. Methodology


    The data and source code are available at the following link: [https://github.com/AI-Lab-UniRC/EEGCubeNet](https://github.com/AI-Lab-UniRC/EEGCubeNet).
    The proposed approach involves the following key steps:


    1. **Data preprocessing**: EEG signals are projected into the spatial–spectral–temporal
    domain, forming 3D volumes of shape `channels × frequency × time` to capture the
    multidimensional dynamics of brain activity;

    2. **Classification**: the 3D volumes are fed into the proposed DL model, here-in
    referred to as `EEGCubeNet`, for feature extraction and classification (i.e. HC
    versus RE and HO versus RE);

    3. **Fine-tuning**: a global training strategy followed by subject-specific fine-tuning
    of `EEGCubeNet` is employed;

    4. **xAI**: the output of `EEGCubeNet` is interpreted using the proposed `3D xAI-OSA`
    framework, which provides insights into the spatial, spectral, and temporal relevance
    of EEG features.


    ### 3.1. Data preprocessing and dataset construction


    #### 3.1.1. EEG preprocessing


    In order to evaluate the effectiveness of the proposed method, 16-channel EEG
    data were recorded using 61 active amplifiers (g.tec medical engineering, Austria).
    The right mastoid was used as the reference, and `AFz` was designated as the ground.
    The signals underwent band-pass filtering between 0.01Hz and 200Hz using an eighth-order
    Chebyshev filter, followed by a 50Hz notch filter to suppress power line interference.
    Data were sampled at a rate of 512Hz, further details can be found in [15](#index.xhtml#S012906572550073XBIB015).
    During the experiment, participants were seating comfortably with their right
    arm supported by an anti-gravity exoskeleton (Hocoma, Switzerland). A cue-based
    movement paradigm was employed, in which subjects performed specific right limb
    actions from a standardized neutral position— defined as the arm extended at 120°
    with neutral rotation and the hand partially open.^([15](#index.xhtml#S012906572550073XBIB015))
    The experimental protocol consisted of 10 runs, each comprising six trials. In
    every trial, participants responded to the requested movement cues. After each
    movement, the hand was returned to the neutral position before the next cue was
    presented. Movement onset was determined using motion sensor data embedded in
    the glove, following the approach described in [15](#index.xhtml#S012906572550073XBIB015).
    To ensure precision, the automatically detected onset times were visually verified
    across all selected pre-movement intervals. For each detected movement, a 1s (corresponding
    to 512 samples) EEG segment was extracted, preceding the initiation of movement.
    This process yielded 840 EEG segments per movement class (i.e. HO and HC) across
    10 runs, 6 trials per run, and 14 subjects. To maintain class balance, an equal
    number of RE segments was included, resulting in a total of 2520 EEG segments
    encompassing all three classes: HO, HC, and RE.


    The dataset used here is sourced from Ofner *et al.*^([15](#index.xhtml#S012906572550073XBIB015)))
    The study included 15 healthy participants (mean age 27 ± 5 years), nine female
    and six male. One participant was excluded from the analysis due to low-quality.
    In summary, the dataset contained 120 EEG trials (thus 120 EEG chans × freq × time
    3D matrices), 60 per class (HC or HO) and 60 for RE, per subject.


    #### 3.1.2. Time–frequency analysis of spatially filtered EEGs

