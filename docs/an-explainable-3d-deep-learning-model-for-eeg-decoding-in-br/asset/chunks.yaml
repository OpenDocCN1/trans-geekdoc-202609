    \ executed movement. This phase is characterized by brief planning-related activity,\
    \ typically occurring 1–1.5s before movement execution. Neurophysiologically,\
    \ motor preparation involves early components of the movement-related cortical\
    \ potential (MRCP),^([3](#index.xhtml#S012906572550073XBIB003)) and is associated\
    \ with rapid shifts in neural activity over premotor and motor areas. Thus, while\
    \ the experimental task falls within the broader category of motor BCI paradigms,\
    \ the neural features here investigated are related to the anticipatory planning\
    \ activity (motor preparation), which may contain discriminative information valuable\
    \ for low-latency BCI applications. In BCI systems, user-specific calibration\
    \ is essential to account for the high variability of EEG signals across individuals.\
    \ Long calibration sessions are indeed impractical and limit the usability of\
    \ BCIs in real-world scenarios. Therefore, fast subject-specific fine-tuning (i.e.\
    \ subject-specific short calibration) is a critical requirement for future applications.\
    \ This remains a major challenge when using complex deep learning (DL) models,\
    \ which typically require large datasets and extensive training to adapt to the\
    \ user. In this context, DL models that can be quickly adapted to the final user\
    \ are especially desirable, and this is the reason why the proposed model was\
    \ trained globally on a population of subjects and then fine-tuned over the final\
    \ user (unseen subject). To address the aforementioned issues, a novel multidimensional\
    \ and explainable DL network, *EEGCubeNet*, designed for efficient EEG decoding\
    \ in motor BCI tasks, was introduced. *EEGCubeNet* aims to significantly reduce\
    \ calibration time while ensuring high classification performance. The model is\
    \ first trained on a population-level dataset and then fine-tuned on previously\
    \ unseen subjects, enabling rapid adaptation to individual users with minimal\
    \ additional data. *EEGCubeNet* processes EEG data in the form of three-dimensional\
    \ (3D) matrices that represent projections into the space–frequency–time domain,\
    \ allowing it to capture the full complexity of spatiotemporal neural dynamics\
    \ associated with motor intention. To assess the performance of the proposed architecture,\
    \ an extensive analysis was carried out using EEG recordings collected during\
    \ motor BCI experiments. In particular, the attention was focused on motor BCIs\
    \ that decode the preparatory phases of movements (i.e. the phase preceding the\
    \ onset of movements when the brain is preparing the movement execution).^([4](#index.xhtml#S012906572550073XBIB004))\
    \ The ability to decode EEG signals during the motor preparation phase offers\
    \ a promising, and still mostly unexplored, opportunity to better understand the\
    \ early neural mechanisms underlying movement generation, from initial intention\
    \ and planning to execution.^([5](#index.xhtml#S012906572550073XBIB005),[6](#index.xhtml#S012906572550073XBIB006))\
    \ By targeting this early stage, we can gain novel insights into the temporal\
    \ evolution of motor commands and how the brain transitions from planning to action.\
    \ From a practical perspective, decoding motor intention at the preparatory level\
    \ may enable predictive BCIs, capable of predicting the intended movement before\
    \ it is executed, and possibly implementing it through a device when execution\
    \ is not possible. BCIs based on motor preparation could also complement and enhance\
    \ motor imagery (MI)-based systems, which have already demonstrated a remarkable\
    \ impact in stroke neurorehabilitation.^([7](#index.xhtml#S012906572550073XBIB007),[8](#index.xhtml#S012906572550073XBIB008))\
    \ By integrating motor preparation signals, MI-based BCIs could benefit from faster\
    \ response times and increased robustness, particularly in cases where sustained\
    \ imagery is difficult to maintain. The dataset used for this study originates\
    \ from a publicly available repository curated by Ofner *et al.,*^([15](#index.xhtml#S012906572550073XBIB015))\
