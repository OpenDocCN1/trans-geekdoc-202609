    模型选择以及针对新主题进行微调的程度，不仅取决于分类性能，还取决于其他关键方面，例如在尺寸和训练时间方面的模型复杂度。为了在性能（准确率）和模型复杂性（训练时间和参数数量）之间提供对比（权衡），在图
    9 中，每个模型都用不同颜色的圆表示，以便清晰直观地解释趋势。圆心对应于以对数比例计算的参数数量（`x` 轴）以及该模型提供的平均准确率（`y` 轴）。圆的半径与完成一次
    10 折训练过程所需的时间成正比。在单个主题的整个数据集上对完整模型进行 10 折微调，平均耗时约 2.5 分钟。这一分析揭示了一个一致的模式：随着模型微调层数的增加和可训练参数数量的增加，分类准确率也随之提高，从
    `FC3` 一到 `Conv3+`。从 `Conv3+` 开始，趋势变缓并发生反转。微调卷积层的 `Conv+` 模型实现了更好的性能。尽管这种改进伴随着参数数量的增加，但参数计数仍保持在适合未来潜在部署的范围内。这些特征使得模型特别适用于真实的脑机接口（BCI）应用，因为较短的模型微调时间可以缩短校准时间，这是至关重要的，因为校准需要受试者的积极配合，受试者必须接受数据采集环节，以使模型适应其脑波。此外，结果强调了单个经过良好校准的模型可以有效用于解码新加入受试者的
    EEG 活动，而无需广泛的重新训练。这证明了该模型在动态和资源受限环境中的实用性和适应性![Fig. 9. EEGCubeNet 模型的性能、校准时间与模型尺寸（参数数量）的对比。特定模型的圆圈中提到了参数数量为
    #Param.（具体细节请参阅图 2，从 `FC3` 到 `Conv1+` 的不同微调版本的 EEGCubeNet）。x 轴以 10 为底的对数比例报告参数数量以提高图表的可读性。](img/s012906572550073xfigf9.png)


    图 9. `EEGCubeNet` 模型的性能、校准时间与模型尺寸（参数数量）的对比。特定模型的圆圈中提到了参数数量为 `#Param.`（具体细节请参阅图
    2，从 `FC3` 到 `Conv1+` 的不同微调版本的 `EEGCubeNet`）。`x` 轴以 10 为底的对数比例报告参数数量以提高图表的可读性。


    ## 4.2. 3D xAI-OSA 的评估


    本节展示了 `EEGCubeNet` 模型在分类 EEG 数据以 HC 与 RE 以及 HO 与 RE 任务时输出结果的解释结果。所提出的可解释分析方法 `3D
    xAI-OSA` 已在第 3.4 节描述。具体而言，该方法对每个 EEG 试验生成并应用多个不同维度的掩码（通道 × 频率 × 时间 3D 矩阵），作为回报，获得了一个
    3D 相关性矩阵，包含输入体在空间、频谱和时间维度上的相关性。如第 3.4 节所示，为了评估关键 EEG 频带内的相关性（delta: 0–4Hz，theta:
    4–8Hz，alpha: 8–13Hz 和 beta: 13–40Hz），利用代表频率和时间相关性的 3D 显著图来观察特定频带内的通道平均行为。具体而言，估计了每个受试者在四个主要频带（delta,
    theta, alpha 和 beta）内的 EEG 通道相关性。然后，使用开源 Python 包 `MNE` 根据第 3.4 节所述的方法将平均相关性值可视化为地形图，以便解释空间模式。图
    10 展示了受试者 01 地的地图示例，而补充材料报告了所有受试者的相应数据。地形图中的红色区域显示较高的相关性/激活，蓝色显示较低的相关性。此外，识别了每个试验中最相关的通道，并以直方图的形式显示试验的平均相关性
    ± 标准差。图 11 显示了受试者 01 的直方图，所有受试者的相应数据提供在补充材料中![图 10. 不同频带（delta, theta, alpha 和
    beta）的通道平均相关性地形图](img/s012906572550073xfigf10.png)


    图 11. HC 与 RE 分类（左图）和 HO 与 RE 分类（右图）中跨频带的前 5 个最相关通道的平均相关性。每个条形代表特定子频内给定通道的平均相关性。


