    定义了掩码的垂直范围（通道），`t[start]^(k)`、`t[end]^(k)` 定义了掩码的时间范围（帧数）。`R[k]` 是根据模型预测和结果变化程度分配给掩码区域的相关性评分。一旦掩码输入被
    `EEGCubeNet` 处理，将通过 `softmax` 函数获得原始输入和掩码输入的类别概率得分。为了给输入中被掩码的像素/区域分配相关性，使用了绝对差和（SAD）。`SAD`
    是一种量化模型预测中结果变化程度的合适指标，特别是当关注在于差异的整体幅度而非分布之间细微的形状变化时。`SAD` 提供了一种简单且易于解释的总差异衡量方法。


    输入体数据（通道 × 频率 × 时间）代表了跨越空间、频谱和时域的 EEG 信号动力学。对输入体的一个区域进行掩码意味着在给定的频率和时间范围内遮挡特定的通道。理解掩码该区域对分类的影响，可以评估这些通道在相应频率段、该时间段内对分类任务（运动前相对于
    RE）的相关性。为了确保相关性评估的平滑和连续，采用了重叠滑动窗口方法，步长等于 `T`/2。通过这种方式，给定的通道（`c`）、频率（`f`）和时间点（`t`）的相关性会被多次评估，取决于它被滑动掩码遮挡的频率。然后计算这些相关性值的平均值，以获得输入体中特定元素
