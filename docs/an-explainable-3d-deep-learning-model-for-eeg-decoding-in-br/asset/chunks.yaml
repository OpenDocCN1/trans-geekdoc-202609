    (1) where `M[k]` represents the `k`th mask, `x[start]^(k)`, `x[end]^(k)` define
    the horizontal range (frequency) of the mask, `y[start]^(k)`, `y[end]^(k)` define
    the vertical range of the mask (channel), `t[start]^(k)`, `t[end]^(k)` define
    the temporal range (number of frames) of the mask. `R[k]` is the relevance score
    assigned to the masked region based on the predictions of the model and the change
    of degree in the outcome. Once the masked input is processed by `EEGCubeNet`,
    class probability scores are obtained via the softmax function for both the original
    input and the masked input. To assign the relevance to the masked pixels/regions
    of the input, Sum of Absolute Difference (SAD) was used. `SAD` is an appropriate
    metric for quantifying changes in the degree of outcome in model predictions,
    especially when the focus is on the overall magnitude of difference rather than
    subtle shape variations between distributions. `SAD` provides a simple, easily
    interpretable measure of the total difference.


    The input volumes (channels × frequency × time) represent EEG signal dynamics
    across the spatial, spectral, and temporal domains. Masking a region of the input
    volume means occluding specific channels within a given frequency and time range.
    Understanding the impact of masking that region on classification allows to assess
    the relevance of those channels, in that frequency band, during that time interval
    for the classification task (premovement versus RE). To ensure a smooth and continuous
    relevance evaluation, an overlapping sliding window approach was adopted with
    a stride equal to `T`/2. In this way, the relevance of a given channel (`c`),
    frequency (`f`), and time point (`t`) is assessed multiple times, depending on
    how often it is occluded by the sliding mask. The average of these relevance values
    is then computed to obtain a mean relevance score for that specific element `(c,f,t)`
    of the input volume.


    Specifically, when a `(c,f,t)` element is occluded by a mask and the relevance
    of the occluded region is evaluated, the resulting relevance score is assigned
    to all `(c,f,t)` elements affected by the occlusion. During the full input volume
    scanning procedure, each `(c,f,t)` element will be occluded a total of `n` times,
    and `n` corresponding relevance scores will be computed for it. At the end of
    the procedure, these scores are averaged (i.e. summed and divided by `n`), yielding
    a single mean relevance value for that element. Finally, a 3D matrix representing
    the relevance of each channel and frequency over time is generated.


    To ensure a robust relevance evaluation, an analysis across different mask sizes
    was performed. Masks sized 2 × 2 × `T`, 4 × 4 × `T`, 8 × 8 × `T`, 16 × 16 × `T`,
    24 × 24 × `T`, with `T` = 32 and `T` = 64 were used and their impact on the model’s
    decisions was evaluated. Given a mask size, the mask slides over the entire input
    volume (in an overlapping way), occluding a region of the volume at each step.
    To complete the scan of the entire volume, the mask moves through `M` different
    positions. For each of the `M` occluded positions, the probability score of both
    the original input volume and occluded one, is evaluated. The mask size that maximizes
    the difference between the probability score of the original volume and that of
    the occluded volume will be selected for explainable analysis.


    Given a relevance 3D saliency map representing the relevance of channels over
    time, in order to evaluate the relevance within the main frequency bands (delta
    (0–4Hz); theta (4–8Hz); alpha (8–13Hz); and beta (13–40Hz)), the relevance was
    averaged over the frequencies (of a given sub-band) and over the time. Namely,
    the relevance map is 3D channel × frequency × time matrix (sized 59 × 59 × 128).
    An average is computed over the time dimension, resulting in channel × frequency
    map (with dimensions 59 × 59). Next, to quantify the relevance within each band
    (delta, alpha, and beta), the frequencies corresponding to each of the four bands
    are identified, and then the columns of the matrix with the same band are averaged.
    This yields a channel × band matrix (size 59 × 4), which represents the relevance
    of each channel in each band. Each column in this matrix represents the relevance
    of channels in a specific sub-band, and will be represented as a topographical
    map in Sec. 4.2.


    ![Fig. 3. Proposed 3D xAI-OSA approach. The EEG volumetric data (channels × frequency
    × time) are systematically occluded using a 3D sliding mask across all three dimensions
    and fed into the trained `EEGCubeNet` model. For each occluded mask, the classification
    score is compared with that of the original input. The relevance is then quantified
    using the `SAD` between the two classification scores. By iteratively scanning
    the entire input volume, a 3D saliency map is generated, highlighting the relevance
    of each region.](images/s012906572550073xfig3.png)


    Fig. 3. Proposed 3D xAI-OSA approach. The EEG volumetric data (channels × frequency
    × time) are systematically occluded using a 3D sliding mask across all dimensions
    and fed into the trained `EEGCubeNet` model. For each occluded mask, the classification
    score is compared with that of the original input. The relevance is then quantified
    using the `SAD` between the two classification scores. By iteratively scanning
    the entire input volume, a 3D saliency map is generated, highlighting the relevance
    of each region.


    ### 3.5. Performance metrics


    The performance of the proposed `EEGCubeNet` was evaluated using standard metrics,
    namely:

    $\text{Accuracy} = \frac{TP + TN}{TP + TN + FP + FN}$

    $\text{Precision} = \frac{TP}{TP + FP}$

    $\text{Recall} = \frac{TP}{TP + FN}$

    $F1\text{-score} = \frac{2 \cdot \text{Precision} \cdot \text{Recall}}{\text{Precision}
    + \text{Recall}}$; and Cohen’s Kappa coefficient (K-Cohen) $\kappa = \frac{p_o
    - p_e}{1 - p_e}$ (where $p_o$ is the observed agreement and $p_e$ is the expected
    agreement by chance) which quantifies the agreement between predictions and true
    labels. While accuracy only measures the proportion of correct predictions, K-Cohen
    accounts for the level of agreement that could occur by chance. It is to be noted
    that `TP` and `TN` represent true positives and true negatives, and `FP` and `FN`
    represent false positives and false negatives. Specifically, `TP` denotes EEG
    trials from the premovement (HC or HO) category correctly classified as premovement,
    whereas `TN` refers to RE trials correctly classified as RE. Conversely, `FP`
    represents RE trials misclassified as premovement, and `FN` refers to premovement
    trials misclassified as RE.


    ## 4. Results


    In this section, the classification performance of `EEGCubeNet` is reported. The
    proposed method, `EEGCubeNet`, was compared with `3D-EEGNet`. The `3D-EEGNet`
    was implemented from scratch, following the structure described in Ref. 26. Both
    methods were assessed using a LOSO-CV strategy: each model was trained on data
    from $N-1$ subjects and tested on the remaining subject. The comparative results
    are presented in Fig. 4, which displays boxplots of the test accuracies obtained
    by both methods. To assess the statistical significance, a Wilcoxon signed-rank
    test was performed, revealing that `EEGNet` significantly outperformed `3D-EEGNet`
    ($p < 0.05$).


    ![Fig. 4. Boxplots of the test accuracies achieved by EEGCubeNet and 3D-EEGNet
    in the HC versus RE (left subplot) and in the HO versus RE (right boxplot) classification.](images/s012906572550073xfigf4.png)

