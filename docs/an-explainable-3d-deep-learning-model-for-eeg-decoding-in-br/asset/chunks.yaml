    对于每一个 EEG 分段，为了减轻体积传导效应并减少相邻电极之间的信号相关性，首先对 EEG 信号进行空间过滤。具体而言，应用一个小小的拉普拉斯滤波器（Laplacian
    filter）来增强每个电极的局部活动，同时衰减远源的影响，从而提高 EEG 信号的空间分辨率。之后，将空间过滤后的 EEG 投影到时间-频率（TF）域。该过程如图
    1 所示。紧接着，使用连续小波变换（CWT）将空间过滤后的 EEG 信号投影到 TF 域。具体来说，对于每个空间过滤后的 EEG 分段 `EEG[s]`，为每个单独通道（`i
    = 1, …, 59`）计算 TF 表示，从而生成 59 幅不同的 TF 图。这些图随后被堆叠形成一个维度为 `channel × frequency ×
    time` 的 3D 矩阵，捕捉跨越空间、频谱和时间维度的 EEG 动态。


    为了研究与运动规划和准备相关的频带——即 MRCP（< 5 Hz）、感觉运动节律（13–15Hz）和 `β`-带（约 13–40Hz），分析集中在 0.5–40Hz
    范围。使用 `MATLAB2024b` 中的 `scal2freq` 函数生成了一组覆盖该范围的 59 个自定义伪频率，并与头皮 EEG 通道数匹配。最后，创建了尺寸为
    59 × 59 × 512 的 3D 图，然后下采样为 59 × 59 × 128，代表了所分析 EEG 分段的空间-谱-时间动态。下采样允许更快的计算速度，同时不会影响
    EEG 动态表示，因为 128Hz 的采样率能够跟踪分析范围（0.5–40Hz）内的变化。


    ![图 1. EEG 获取、预处理和数据集创建。该图说明了数据获取范式，该部分在第 3.1 节中进行了详细描述。提取运动开始前 1s 的 EEG 段——称为“运动前
    EEG 段”，并对其进行标记（如 HC、HO 或 RE），并存储在数据集中。这些 EEG 信号通过拉普拉斯方法进行空间过滤，然后通过 CWT 进行 TF 分析。生成的
    TF 表示被结构化为按通道、频率和时间组织的卷。这些卷随后被相应标记并存储以供进一步分析。](img/s012906572550073xfigf1.png)


    图 1. EEG 获取、预处理和数据集创建。该图说明了数据获取范式，该部分在第 3.1 节中进行了详细描述。提取运动开始前 1s 的 EEG 段——称为“运动前
    EEG 段”，并对其进行标记（如 HC、HO 或 RE），并存储在数据集中。这些 EEG 信号通过拉普拉斯方法进行空间过滤，然后通过 CWT 进行 TF 分析。生成的
    TF 表示被结构化为按通道、频率和时间组织的卷。


    ### 3.2. EEGCubeNet


    3D CNN 通过引入额外的时间维度扩展了传统的二维（2D） CNN，这使其在处理视频或医学影像等体量数据时特别有效。与仅在空间维度（高度和宽度）上应用卷积的
    2D CNN 不同，3D CNN 在高度、宽度和时间上执行卷积，使其能够同时捕捉空间和时间依赖关系。在本文中，根据尝试错误的方法开发了不同的 3D CNN。具体来说，通过改变卷积核大小、步长（stride）以及层数来探索不同的配置。在本研究中，`Model
    7` 用于二分类任务（HC 对比 RE 和 HO），在此处被称为 `EEGCubeNet`。注意的是，选择 `Model 7` 是因为其在 `k`-折验证的多次运行中实现了最高的平均性能，特别是在准确率和
    Cohen''s Kappa 方面。重要的是，这一选择并非基于单次结果，而是基于多次运行的优异表现。架构如图 2 所示，由四层 3D 卷积组成，每层后接批次归一化、ReLU
    激活和池化。模型的输入是尺寸为 `channels × frequency × time` 的 59 × 59 × 128。第一个卷积层 `Conv1` 应用
    16 个滤波器，生成尺寸为 31 × 31 × 128 的特征图。池化层 `Max-Pool1` 将特征下采样为 15 × 15 × 64。第二个卷积层 `Conv2`
    具有 32 个滤波器，产生尺寸为 9 × 9 × 64 的特征图。池化层 `Max-Pool2` 将其下采样为 4 × 4 × 32。第三个卷积层 `Conv3`
    包含 64 个滤波器，输出为 4 × 4 × 32。池化层 `Max-Pool3` 生成尺寸为 2 × 2 × 16 的特征；最后一个卷积层 `Conv4`
    包含 128 个滤波器，产生 128 幅相同的特征图。最后一个池化层 `Max-Pool4` 输出尺寸为 1 × 1 × 8 的特征向量。这些向量被展平并并通过三个全连接层。第一个全连接层
    `FC1` 由 512 个神经元组成，随后是具有 256 个神经元的 `FC2`，最后是用于二分类的 2 个神经 `FC3`（即 HC 与 RE 以及 HO
    与 RE）。注意的是，`Conv1` 和 `Conv2` 的卷积核大小为 3 × 3 × 3，步长为 1 × 2，填充（padding）为 1 × 2；而
    `Conv3` 和 `Conv4` 的卷积核大小为 3 × 3 × 3，步长为 1 × 1，填充为 1 × 1。此外，四个池化层的卷积核大小为 2 × 2
    × 2，步长为 2 × 2 × 2。模型使用 `PyTorch` 实现，并采用自适应量估计（Adam）优化器进行训练，学习率设置为 0.001，权重衰减为
    0.9，批量大小为 8，最多训练 50 个 epoch，并采用早停止策略，运行在配备 NVIDIA RTX 4000 Ada Generation、Intel
    Xeon CPU @2.30 GHz 和 125 GB RAM 的设备上。为了减轻过拟合并增强鲁棒性，在池化层后还应用了 25% 的丢弃率（dropout）。


    ![图 2. EEGCubeNet 架构及其微调机制，层级微调使用不同颜色标示。阴影区域代表了从最后一层扩展到整个模型的渐进式微调过程。](img/s012906572550073xfigf2.png)


