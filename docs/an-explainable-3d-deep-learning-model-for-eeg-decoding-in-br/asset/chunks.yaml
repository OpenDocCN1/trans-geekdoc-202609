  trans: '


    本研究介绍了 `EEGCubeNet`，这是一种新型的可解释深度学习框架，旨在解码 EEG 信号，并特别关注减少针对受试者的适应性。通过将 EEG 数据投影到空-频-时域并采用从全局到特定个体的训练方法，`EEGCubeNet`
    在展现强大解码性能的同时，显著缩短了新用户所需的训练时间。该模型架构直接在头皮级 EEG 上运行，无需进行源重建，具有高计算效率并避免了头部模型可能引入的偏差。结合新提出的
    `xAI-3D-OSA` 可解释性框架，`EEGCubeNet` 还能对其驱动预测的神经模式提供透明见解，特别适用于临床和辅助应用。此外，`EEGCubeNet`
    的适应性、效率和解释性使其成为集成到实时 BCI 系统的理想人选。


    ## 致谢


    本工作部分资于欧盟——下一代欧洲（Next Generation EU）——PRIN 2022 计划，意大利大学与研究部（MUR），项目名称：“EXEGETE：用于医疗信号和图像处理的可解释生成式深度学习方法”（项目代码：2022ENK9LS，CUP:
    C53D23003650001）；部分资于欧盟——下一代欧洲，PRIN 2022 PNRR 征集，项目“利用物联网和边缘智能范式的心血管疾病管理、预防和治疗交互式数字孪生解决方案——IMPROVE”（项目代码：P2022NH2CK，CUP:
    C53D23007960001）；部分资于意大利卫生部资助的 Fa.Per.M.E 项目（项目代码：T3-AN-15，CUP C33C22000390006，CUP
    MASTER H53C22000640006）；部分资于下一代欧洲——意大利 NRRP，任务 4，组件 2，投资 1.5，关于创建和加强“创新生态系统”的征集，建设“区域研发领军者”（第
    2021/3277 号行政法令）——Tech4You 项目——用于适应气候变化和改善生活质量的技术，编号 ECS0000009（CUP: C33C22000290006）。本工作仅代表作者的观点和意见，大学与研究部或欧盟委员会均不对此负责。


