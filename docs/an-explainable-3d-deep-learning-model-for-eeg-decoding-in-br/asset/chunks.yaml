    images to interpret classification decisions. A recent study extended this approach
    to visually explain the decision-making process of 3D CNNs by incorporating a
    temporal dimension into occlusion sensitivity analysis.([28](#index.xhtml#S012906572550073XBIB028)).
    However, applying this strategy to 3D volumetric EEG data poses challenges due
    to the continuous nature of nonstationary and noisy EEG signals distributed across
    multiple frames with a variability in and between the subjects. Furthermore, using
    optical flow masking would likely result in occluding large portions of each channel  frequency
    frame, leading to the loss of information necessary for identifying highly relevant
    channels and their frequency variations over time. To this end, a novel 3D explainability
    framework was also introduced, referred to as `3D xAI-OSA`, based on the Occlusion
    Sensitivity Analysis. This technique enabled a deeper understanding of the spatial–spectral–temporal
    patterns contributing to the network’s decisions, offering insights into how preparatory
    brain activity associated with hand movements is represented in EEG data.


    ### 5.1. Impact of the proposed approach


    Overall, `EEGCubeNet`, coupled with the `3D xAI-OSA` framework, represents a promising
    direction for creating robust, adaptable, and interpretable BCI systems. The advantages
    of `EEGCubeNet` over previous models^([4](#index.xhtml#S012906572550073XBIB004),[11](#index.xhtml#S012906572550073XBIB011),[12](#index.xhtml#S012906572550073XBIB012))
    are manifold:


    - It processes EEG signals at the scalp level without reconstructing cortical
    sources, which provides an advantage in terms of computational complexity. Furthermore,
    it does not require the use of a head model, which might not accurately reflect
    the brain structure of the subject under examination, potentially introducing
    bias^([11](#index.xhtml#S012906572550073XBIB011));

    - Thanks to the global-to-subject-specific approach, it leverages knowledge acquired
    from the subject population during the training phase to achieve comparable performance
    with reduced training time on the final user;

    - It decodes EEG signals with comparable performance while simultaneously taking
    into account the evolution of their dynamics in space, frequency, and time, not
    just space and frequency^([4](#index.xhtml#S012906572550073XBIB004)) or space
    and time^([11](#index.xhtml#S012906572550073XBIB011));

    - `EEGCubeNet`, when coupled with the `xAI-3D-OSA` method, enabled explanation
    of the model’s outcomes, allowing the detection of a subject-specific trend among
    the most relevant channels as frequency varies during motion initiation of HC
    and HO.


    As regards the training time, in Ref. [12](#index.xhtml#S012906572550073XBIB012)
    which is a double branch DL model, the training time was of about 30min for one
    branch and 1.5h for the other branch, per subject for 10 folds. In Ref. [11](#index.xhtml#S012906572550073XBIB011),
    the training time was of 10 min per subject for 10 folds, excluding the time necessary
    to perform the inverse problem solution to reconstruct cortical sources. In Ref.
    [4](#index.xhtml#S012906572550073XBIB004), the average training time was of approximately
    9min, but the classification was carried out at frame level (one frame is channel  frequency
    map and one EEG trial of 1 s includes 512 frames), and not at trial level, like
    in this work. The average training time of `EEGCubeNet` for one subject was of
    4.35min for 10 folds and inference time 23s; the average training time of 3D EEG
    for 10 folds was 65min and inference time 33s.


    ### 5.2. Limitations and future works


    Among the limitations of this work, the small number of trials per class per subject
    should be noted. Future studies should consider larger datasets, also for the
    purpose of validating the model in decoding more complex tasks. This will also
    enable the extension of the explain analysis, whose effectiveness depends on the
    classifier’s ability to generalize. Second, movement’s onset were marked by processing
    the data collected by the motion sensors embedded in the glove that the participant
    used to wear during the experiment. Motion data collected through the glove are
    smooth and do not allow one to detect onset instantaneously, which means the epochs
    used for training may have captured the early milliseconds of motion implementation,
    which may have caused, in principle, the similar activation patterns. Among the
    future potentials of the proposed method is its applicability to online frameworks,
    given the small number of parameters that need to be updated to adapt the model
    to the final user. Since `EEGCubeNet` is designed to analyze 3D matrices representing
    EEG signals in the space–frequency–time domain, it is capable of effectively capturing
    the complex mutual interactions among the temporal evolution of EEG signal features
    across both the spatial domain (i.e. across different channels) and the spectral
    domain (i.e. across varying frequencies). This inherent capability makes it reasonable
    to assume that extending the model to other applications, such as attention detection,
    emotion recognition, sleep monitoring, neurological disorders diagnosis, could
    be relatively straightforward. However, in order to validate this assumption,
    it is essential to adapt and rigorously test the model on appropriate datasets
    that are specific to each application domain. This direction will be one of the
    primary goals of future research, especially considering the growing importance
    of these topics in the fields of computational neuroscience and neurotechnology.


    ## 6. Conclusions

    '
  trans: '

    在本研究中，引入了一种名为 `EEGCubeNet` 的新型用于解码 EEG 信号的多维且可解释的深度学习框架，并在运动 BCI 实验期间记录的 EEG 信号上进行了验证。这项工作的核心动机是为了解决将深度学习模型应用于基于
    EEG 的 BCI 时的核心挑战之一：EEG 信号中显著的个体间差异，这使得必须进行用户特定的校准。校准过程通常非常耗时，特别是当涉及深度学习模型时，因为它们通常需要大量数据进行训练，导致需要长时间的
    EEG 记录以对最终用户进行模型微调。在此背景下，开发支持快速个体特定微调的模型是迈向更具部署性和用户友好的深度学习 BCI 系统的关键一步。为了满足这一需求，`EEGCubeNet`
    首先在群体级数据集上进行训练，随后在未见的受试者进行微调。具体而言，分析了在运动 BCI 实验期间获取的公开数据集 EEG，旨在表征 HO 运动启动（pre-HO
    与 RE 分类）和 HC 运动启动（pre-HC 与 RE 分类）。`EEGCubeNet` 的输入是代表 EEG 信号投影到空-频-时域的 3D 矩阵。这种策略证明了将复杂的深度学习模型高效适应新用户的可性，从而在保持分类性能的同时减轻了训练负担。性能之外，模型的可解释性在确保神经解码过程的透明度和可解释性方面起着重要作用，特别是在临床和辅助环境中。在文献
    11 中，作者通过源层面的遮挡敏感性分析（OSA）解释了基于 CNN 的 EEG 解码，揭示了中心区域、前运动层右颞区和初级运动层在 EEG 源分类中起着至关重要的作用。值得注意的是，在
    OSA 中，敏感性掩码通常应用于 2D 图像以解释分类决策。最近的一项研究通过将时间维度引入遮挡敏感性分析，将这种方法扩展到视觉解释 3D CNN 的决策过程（28）。然而，由于非平稳且噪声的
    EEG 信号分布在多个帧中且具有个体间及个体间的连续性，将此策略应用于 3D 体积 EEG 数据面临着挑战。此外，使用光流掩码可能会导致遮挡每个通道频率帧的大部分内容，导致识别高度相关通道及其频率随时间变化所需信息的丢失。为此，还引入了一种基于遮挡敏感性分析的新型
    3D 可解释性框架，称为 `3D xAI-OSA`。该技术能够更深入地理解有助于网络决策的空-谱-时模式，为与手部运动相关的准备性脑活动如何在 EEG 数据中被表征提供了见解。


    ### 5.1. 拟提方法的影响


    总的来说，`EEGCubeNet` 结合 `3D xAI-OSA` 框架代表了创建稳健、自适应且可解释的 BCI 系统的一个极具前景的方向。`EEGCubeNet`
    相比于以往模型^(4,11,12) 的优势是多方面的：


    - 它在头皮水平处理 EEG 信号而无需重建皮层源，这在计算复杂度方面具有优势。此外，它不需要使用头模型，头模型可能无法准确反映被检受试者的脑结构，从而可能引入偏差^(11)；

    - 得益于从群体到个体特定的方法，它利用了在训练阶段从受试者群体中获取的知识，在减少最终用户训练时间的同时实现了相当的性能；

    - 它以相当的性能解码 EEG 信号，同时考虑了它们在空间、频率和时间上的动力学演变，而不仅仅是空间和频率^(4) 或空间和时间^(11)；

    - `EEGCubeNet` 结合 `xAI-3D-OSA` 方法能够对模型结果进行解释，允许在 HC 和 HO 运动启动期间频率变化时，在最相关通道中检测受试者特定的趋势。


    关于训练时间，在文献 12 中，这是一种双分支深度学习模型，每个受试者 10 折的训练时间一个分支约为 30 分钟，另一个分支为 1.5 小时。在文献 11
    中，每个受试者 10 折的训练时间为 10 分钟，不包括执行反问题求解以重建皮层源所需的时间。在文献 4 中，平均训练时间约为 9 分钟，但分类是在帧级别进行的（一个帧是通道频率图，一个
    1 秒的 EEG 试验包含 512 帧），而不是像本工作这样在试验级别进行。`EEGCubeNet` 对于单个受试者的 10 折平均训练时间为 4.35 分钟，推理时间为
    23 秒；3D EEG 的 10 折平均训练时间为 65 分钟，推理时间为 33 秒。


    ### 5.2. 局限性与未来工作


    本工作的局限性在于每个受试者每类的样本数量较少。未来的研究应该考虑更大的数据集，以验证模型解码更复杂任务的能力。这将扩展解释分析，其有效性取决于分类器的泛化能力。其次，运动启动是通过处理实验期间参与佩戴的手套传感器采集的数据标记的。通过手套采集的运动数据是平滑的，无法实时检测，这意味着用于训练的可能捕获了运动执行的早期，这在原理上可能导致类似的激活模式。所提方法的未来潜力之一是其在在线框架中的适用性，因为适应最终用户需要更新的参数较少。由于
    `EEGCubeNet` 设计用于分析代表空-频-时域 EEG 信号的 3D 矩阵，它能够有效地捕捉 EEG 信号特征在空间域（即跨不同通道）和频域（即跨不同频率）中随时间演变之间复杂的相互作用。这种固有的能力使得假设将模型扩展到其他应用（如注意力检测、情绪识别、睡眠监测、神经系统疾病诊断）是相对直接的。然而，为了验证这一假设，必须在特定于每个领域的数据集上对模型进行调整和严格测试。这一方向将是未来研究的主要目标之一，特别是考虑到这些主题在计算神经科学和神经技术领域日益增长的重要性。

