    ### 3.3. From global training to subject-specific fine-tuning


    In order to develop a model that requires a reduced training time on the subject
    of interest, thus enabling a short calibration, an in-depth evaluation of the
    proposed architecture `EEGCubeNet`, was carried out. To ensure robust evaluation,
    a Leave-One-Subject-Out Cross-Validation (`LOSO-CV`) approach was employed. For
    this purpose, a two-stage approach was adopted: initially, the model is trained
    on `N-1` subjects (global training), followed by fine-tuning on the excluded subject
    (subject-specific fine-tuning). In the global training phase, the training was
    conducted using the data from `N-1` subjects. The trained model was then adapted
    to the left-out subject in the subject-specific fine-tuning stage. A `k`-fold
    cross-validation was carried out which was crucial to evaluate the adaptation
    performance on the target subject more reliably and to minimize the risk of overfitting
    due to the limited amount of subject-specific data. This two-stage strategy with
    global training and subsequent subject-specific fine-tuning, was explicitly designed
    to enhance the robustness and generalizability of our results, despite the constraints
    imposed by the dataset size. As illustrated in Fig. [2], the model architecture
    is shaded with different colors, and each colored box decodes the fine-tuning
    process of the boxed layers. The evaluation of the fine-tuning process was performed
    incrementally, starting from the last fully connected layer (`FC3`) and extending
    back to the first convolutional layer (`Conv1`). In the first step of the evaluation,
    only the `FC3` layer was involved in the fine-tuning. In the second step, both
    `FC2` and `FC3` layers were adapted. These two layers are grouped within a box
    labeled `FC2+`, indicating that `FC2` and all subsequent layers were fine-tuned,
    and so on, progressively including more layers until the entire model (starting
    from the last fully connected layer (`FC3`) and extending back to the first convolutional
    layer (`Conv1+`) was adapted. The goal of this layer-by-layer performance evaluation
    was to analyze the trade-off between the number of model parameters required for
    fine-tuning and the accuracy achieved within a given time. This approach allows
    for estimating the necessary computational resources to fine-tune the model efficiently,
    enabling the decoding and classification of new subject data with minimal resource
    requirements. In the context of EEG classification, this results in minimizing
    the calibration time required for the model to accurately classify signals from
    a new subject.


    ### 3.4. Explainability analysis: 3D xAI-OSA


    In the proposed `3D xAI-OSA` approach, the 3D maps (channels × frequency × time)
    extracted from EEG signals are occluded to compute the spatial, spectral, and
    temporal relevance of specific regions over time. Input volumes are systematically
    occluded across spatial, spectral, and temporal dimensions using varying sizes
    of occlusion 3D masks. Figure [3] illustrates the schematic of the proposed `3D
    xAI-OSA` approach. The masking process, illustrated in Fig. [3], generates occluded
    3D regions by assigning zero values to the masked areas within the 3D input matrix
    (channels × frequency × time). Given a predefined mask size, a sliding 3D mask
    is applied across the input volume, systematically scanning it along the spatial
    (channels), spectral (frequency), and temporal (time samples) dimensions.


