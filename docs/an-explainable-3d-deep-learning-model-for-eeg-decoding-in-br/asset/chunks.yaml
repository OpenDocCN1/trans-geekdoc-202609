    在脑机接口（BCI）领域，大脑与机器之间建立了直接通信。脑信号被采集、解码，并用于与交互式应用程序进行通信.^(1)


    ### 1. 引言


    #### 1.1.1. 运动脑机接口与准备阶段

    运动脑机接口为正在进行主动神经康复和神经假肢控制的患者提供了一个非常有前景的视角。基于脑电图（EEG）的运动脑机接口因其非侵入性、便携性和高时间分辨率而被广泛研究，使其适用于包括神经康复、辅助技术和认知监测在内的广泛领域.^(2)


    在运动脑机接口的语境下，本研究专门针对运动准备：即在想象或执行运动启动之前的早期瞬态阶段。该阶段的特征是存在短暂的计划相关活动，通常发生在运动执行前 1–1.5
    秒。从神经生理学角度来看，运动准备涉及运动相关皮层电位（MRCP）的早期组件，^(3)并与前运动区和运动区神经活动的快速转变有关。


    因此，虽然实验任务属于更广泛的运动脑机接口范式范畴，但此处研究的神经特征与预期计划活动（运动准备）有关，这可能包含对低延迟 BCI 应用有价值的判别信息。


    #### 1.1.2. 校准挑战与深度学习

    在 BCI 系统中，针对特定用户的校准至关重要，以考虑 EEG 信号在个体之间的高度变异性。长时间的校准实际上是不现实的，并限制了 BCI 在现实场景中的可用性。因此，快速的特定受体微调（即针对特定主体的短校准）是未来应用的关键需求。


    在使用复杂的深度学习（DL）模型时，这仍然是一个主要挑战，因为这些模型通常需要大型数据集和大量的训练来适应用户。在这种背景下，能够快速适应最终用户的 DL
    模型尤为理想，这也是为什么所提模型在人群上进行全局训练，然后在最终用户（未见受体）上进行微调的原因。


    #### 1.1.3. EEGCubeNet 架构

    为了解决上述问题，引入了一种新型多维且可解释的深度学习网络 `EEGCubeNet`，专为运动 BCI 任务中的高效 EEG 解码设计。`EEGCubeNet`
    旨在显著减少校准时间的同时确保高分类性能。


    该模型首先在人群级数据集上进行训练，然后在之前未见的受体上进行微调，以便以极少的额外数据快速适应个体用户。`EEGCubeNet` 以三维（3D）矩阵的形式处理
    EEG 数据，这些矩阵代表了空间-频率-时间域的投影，使其捕捉与运动意图相关的时空神经动力学的完整复杂度。


    为了评估所提架构的性能，利用运动 BCI 实验期间采集的 EEG 记录进行了广泛分析。特别是重点关注了解码运动准备阶段的运动脑机接口（即大脑准备运动执行时、运动启动之前的阶段）。^(4)


    #### 在运动准备阶段解码 EEG 信号的能力提供了一个充满前景且很大程度上未被探索的机会，有助于更好地理解运动产生的早期神经机制，从最初的意图和计划到执行。^(5,6)
    通过针对这一早期阶段，我们可以获得关于运动指令的随时间演变以及大脑如何从计划过渡到行动的新颖见解。


    从实用角度来看，在准备阶段解码运动意图可能实现预测性 BCI，其能够在运动执行之前预测意图运动，并在无法执行时可能通过设备实现它。基于运动准备的 BCI 还可以补充和增强基于运动意念（MI）的系统，后者在卒中神经康复中已经证明了显著的影响。^(7,8)
    通过整合运动准备信号，基于 MI 的 BCI 可以从更快的响应时间和更高的鲁棒性中获益，特别是在难以维持持续意念的情况下。


    #### 1.1.4. 数据集与相关工作

    本研究使用的数据源于 Ofner *et al.* 整理的公开存储库^(15)，其特征是受体在执行涉及同一上肢的一系列复杂运动任务时采集的 EEG 信号。已有几种
    DL 模型，^(9,10) 被用于分析上述数据集。


    这些研究的共同目标是识别正在执行的具体运动，并考虑其从准备到启动再执行的整个时间演变。这项工作仅关注准备阶段，由于缺乏运动启动的神经相关物，这本质上更具挑战性。具体而言，从
    EEG 数据中早在在其准备阶段即可预测即将到来的子运动。


    特别研究了手部打开（HO）和手部关闭（HC）运动的启动，并将其与中性休息（RE）状态条件区分来。过去关注子运动预测的方法依赖于空间频谱特征，^(4)或空间和时间特征，^(11,12)，它们无法捕捉
    EEG 信号动力学的整体空间、频率、时间演变。Ieritano *et al.*^(11,12) 需要计算密集型的预处理步骤，例如通过反演问题求解来重建皮层源，由于通常采用对多个受体取平均的头部模型，这可能会引入偏差。^(13)


    #### 1.1.5. 可解释性的性

    除了 EEG 解码性能外，可解释性可以为 BCI 系统的行为提供有意义的见解，特别是当这些系统从研究环境转向现实应用时。EEG 信号确实具有内在噪声、非平稳性，并受个体间和个体内变性的影响，使得在使用机器学习模型时，底层神经解码过程变得复杂且往往不透明。在这种背景下，可解释人工智能（xAI）方法可能有助于调查
    BCI 系统解释神经数据的内部机制，从而增强模型的透明度和信任度。由于 xAI 领域关于 BCI 系统的文献不足，目前缺乏专门的方法来解释或说明 BCI 的
    EEG 信号解码机制。^(14)


