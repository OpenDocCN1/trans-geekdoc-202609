    \ required computationally intensive preprocessing steps such as inverse problem\
    \ solution to reconstruct cortical sources, which can introduce biases as head\
    \ models averaged over multiple subjects are generally adopted.^([13](#index.xhtml#S012906572550073XBIB013))\
