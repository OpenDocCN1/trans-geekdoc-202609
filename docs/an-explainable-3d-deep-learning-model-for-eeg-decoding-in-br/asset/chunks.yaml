    对于 HC 与 RE 任务（表 2），最佳平均性能在 `Conv3+` 设置下获得，而最差性能出现在 `FC3`。`Conv3+` 在所有受试者的平均准确率为
    89.56± 4.29。此外，最佳的个体性能记录在受试者 `S02` 中，其达到了 97.78± 2.72 的准确率，且标准差最低，反映了模型在 `k`-折交叉运行中的稳健性。类似地，表
    3 展示了 HO 与 RE 任务的模型性能。`Conv2+` 层表现最佳，`FC3` 表现最差。该任务 `Conv2+` 的平均准确率为 89.06± 4.86。当对更多层进行逐逐渐微调时，可以观察到性能逐渐增加的趋势，导致性能从
    `FC3` 到 `Conv2+` 增强。从表 2 和 3 可以观察到，所有受试者的平均结果表明，随着模型更多层的微调，性能有所提高。文中分析了微调较少或较多层时微调过程的优势，并在训练时间和已训练参数数量方面的相应见解列在
    Sec.4.1.2 中。关于模型性能的进一步见解在 Sec.3.5 描述中通过图 5 和 6 的 K-Cohen 系数进行了说明。图 5 和 6 分别说明了
    HC 与 RE 任务和 HO 与 RE 任务的箱线图，代表了所有微调模型的 K-Cohen 系数。`y`-轴表示 K-Cohen 值，`x`-轴表示微调模型的受试者。右侧报告了显著性的
    K-Cohen 范围，从“无一致性”到“极高一致性”。提供的结果用不同的颜色表示不同的微调模型。对于给定的受试者，不同微调模型产生的 K-Cohen 值相邻绘制。此外，还绘制了水平线，以显示每个特定微调模型的平均
    K-Cohen 分数，使用箱线图相同的颜色。可以观察到，所有 `Conv4+` 到 `Conv1+`（所有层）模型的平均 K-Cohen 均落在“实质性一致”范围内，而
    `Conv3+`、`Conv2+`、`Conv1+` 模型的平均 K-Cohen 倾向于“极高一致”范围。当仅微调全连接层时（模型 `FC3`、`Conv2+`、`FC1+`），平均达到了“中等一致性”。


