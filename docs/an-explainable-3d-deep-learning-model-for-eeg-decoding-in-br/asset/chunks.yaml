    was observed for `FC3`. The average accuracy for `Conv3+` was 89.56± 4.29 across
    subjects. Additionally, the best individual subject performance was recorded for
    subject `S02`, achieving an accuracy 97.78± 2.72, with the lowest standard deviation,
    reflecting the robustness of the model across the `k`-fold runs. Similarly, Table
    [3](s012906572550073xtbl003-wrap.xhtml) presents the model performance for HO
    versus RE task. The best performance was observed for `Conv2+` layer and the worst
    for `FC3`. The average accuracy of `Conv2+` for this task was 89.06± 4.86. A gradually
    increasing trend of performance can be observed when fine-tuning was performed
    gradually on more layers, resulting in enhanced performance from `FC3` to `Conv2+`.
    From Tables [2](s012906572550073xtbl002-wrap.xhtml) and [3](s012906572550073xtbl003-wrap.xhtml),
    one can observe that the average results across all subjects indicate an improvement
    in performance as more layers of the model are fine-tuned. The advantages of fine-tuning
