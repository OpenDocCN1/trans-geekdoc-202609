- raw: "In the field of brain–computer interface (BCI), a direct communication is\
    \ established between the brain and the machines. Brain signals are collected,\
    \ decoded, and used to communicate with an interactive application.^([1](#index.xhtml#S012906572550073XBIB001))\
    \ Motor BCIs represent a promising perspective for patients in active neurorehabilitation\
    \ and neuroprosthetic control. Electroencephalography (EEG)-based motor BCIs are\
    \ widely studied due to their noninvasiveness, portability, and high temporal\
    \ resolution, making them suitable for a wide range of applications, including\
