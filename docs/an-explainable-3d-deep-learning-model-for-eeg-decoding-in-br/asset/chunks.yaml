    \nThe 3D CNNs extend traditional two-dimensional (2D) CNNs by incorporating an\
    \ additional temporal dimension, making them particularly effective for processing\
    \ volumetric data such as videos or medical imaging. Unlike 2D CNNs, which apply\
    \ convolutions only across spatial dimensions (height and width), 3D CNNs perform\
    \ indeed convolutions over height, width, and time, enabling them to capture both\
    \ spatial and temporal dependencies simultaneously.^([22](#index.xhtml#S012906572550073XBIB022))\
    \ In this paper, different 3D CNNs were developed according to a *trial-and-error*\
    \ approach, as reported in Table [1](s012906572550073xtbl001-wrap.xhtml). Specifically,\
    \ kernel sizes and strides, along with the number of layers, were systematically\
    \ varied to explore different architectural configurations. In this study, *Model\
    \ 7* is employed for the binary classification tasks (HC versus RE and HO versus\
    \ RE) and it is here referred to as *EEGCubeNet*. It is to be noted that Model\
    \ 7 was selected because it achieved the highest average performance across multiple\
    \ runs of the *k*\\-fold validation procedure, specifically in terms of both accuracy\
    \ and Cohen’s Kappa. Importantly, this selection was not based on a single metric\
    \ or run but reflects superior performance across multiple folds and metrics.\
    \ The architecture is shown in Fig. [2](s012906572550073xfigf2.xhtml) and it consists\
    \ of four 3D convolutional layers, each followed by batch normalization, ReLU\
    \ activation, and max pooling. The input to the model is the 3D volume channels × frequency × time\
    \ sized 59 × 59 × 128. The first convolutional layer (Conv1) applies 16 filters,\
    \ producing 16 feature maps of size 31 × 31 × 128. The 3D max-pooling layer (Max-Pool1)\
    \ downsamples the 16 features maps to 15 × 15 × 64. The second convolutional layer\
    \ (Conv2) has 32 filters and produces 32 feature maps of size 9 × 9 × 64, that\
    \ are further downsampled to 4 × 4 × 32 by means of the max-pooling operation\
    \ (Max-Pool2). The third convolutional layer (Conv3) consists of 64 filters with\
    \ output dimensions of 4 × 4 × 32. The third max-pooling layer (Max-Pool3) generates\
    \ 64 features maps sized 2 × 2 × 16; while the final convolutional layer (Conv4)\
    \ contains 128 filters, resulting in 128 feature maps of the same size (2 × 2 × 16).\
    \ The last max-pooling layer (Max-Pool4) outputs 128 features vectors of size\
    \ 1 × 1 × 8. These are flattened and passed through three fully connected layers.\
    \ The first fully connected layer (FC1) consists of 512 neurons, followed by FC2\
    \ with 256 neurons, and finally, FC3 with 2 neurons for binary classification\
    \ (i.e. HC versus RE and HO versus RE). It is to be noted that for Conv1 and Conv2\
    \ the kernel size is 3 × 3 × 3, strides 1 × 2 × 2 and padding is 1 × 2 × 2; while,\
    \ for Conv3 and Conv4 the kernel size is 3 × 3 × 3, stride is 1 × 1 × 1 and padding\
    \ is 1 × 1 × 1. In addition, the four max-pooling layers have kernel size of 2 × 2 × 2\
    \ and stride of 2 × 2 × 2. The model was implemented in PyTorch^([23](#index.xhtml#S012906572550073XBIB023))\
    \ and trained with the Adaptive Moment Estimation (Adam) optimizer,^([24](#index.xhtml#S012906572550073XBIB024))\
