  trans: '


    为了填补这一空白，本文提出了一种新型 3D xAI 遮挡敏感性分析，称为 `3D xAI-OSA`。随后，使用 `3D xAI-OSA` 框架对提出的分类模型
    `EEGCubeNet` 的结果进行解释。`3D xAI-OSA` 通过在考虑的频率随时间变化的同时评估通道的相关性，提供了 3D 关联性图。总而言之，本文的主要贡献如下：


    *   开发了一种新型基于深度学习（DL）的 EEG 解码模型，能够同时捕捉 EEG 信号的空间、频谱和时间特征；

    *   实现了先进的性能，且无需解决皮层源重建的逆问题，从而避免了计算负担和对头部的模型的依赖；

    *   全面验证了所提模型将在多个受试者上训练期间获得的知识（全局训练）迁移到未见的最终受试者（受试者特定微调）的能力，能够在显著缩短训练时间的同时实现高个体化性能；

    *   引入了一种新型 `3D xAI-OSA` 框架，提供了跨空间、频谱和时间域的 EEG 活动同步解释性。


    本文的其余部分结构如下：第 2 节描述了该领域的当前先进水平。第 3 节介绍了提出的 `EEGCubeNet` 和 `3D xAI-OSA` 方法。第 4
    节展示了结果。第 5 节和 6 节讨论了局限性、未来的潜在扩展并得出了结论。


    ## 2. 相关工作


    此处使用的数据集（Ofner *et al.*^(15))）也曾用于其他研究。特别是，Ofner *et al.*^(15) 评估了不同输入 EEG 段长度的分类器性能。他们在子动作执行相对于
    RE（准备复位）的最高准确率为 80%，而不同子动作执行之间的分类准确率最高达到 40%。Namazi *et al.*^(9) 发现，在运动执行（ME）期间肘部弯曲和
    HC 运动期间 EEG 信号表现出更高的复杂性，而在 ME 的 HO 和 RE 条件下观察到复杂性较低。Jeong *et al.*^(10) 引入了一种依赖受试者的分段频谱滤波（SSSF）方法来解码
    MRCP。使用这种方法，他们对 ME 进行了二分类，HC 与 RE 的平均准确率达到 0.72 ± 0.09，HO 与 RE 任务达到 0.76 ± 0.06。在另一项相关研究中，Jeong
    *et al.*^(16) 提出了一种分层流卷积神经网络（CNN），用于区分右前臂旋仰、旋前和 RE 的三类分类任务。该方法的平均分类准确率为 0.52 ± 0.03。这些研究的共同目标是识别正在执行的特定动作，然而，这项工作的重点仅在于准备阶段，由于缺乏运动启动的神经相关性，该阶段在本质上更具挑战性。另一项基于支持向量机的^(17)
    工作执行了分类，使用基于傅里叶的同步压缩变换（FSST）作为特征提取器，并使用奇异值分解（SVD）。另一项工作^(18) 提出了图卷积网络（GCN），用于运动
    MI 的分类。


    ## 3. 方法


    数据和代码可通过以下链接获取：[`github.com/EEGCubeNet`](https://github.com/EEGCubeNet)。所提出的 `3D
    xAI-OSA` 框架涉及以下关键步骤：


    1. **数据预处理**：将 EEG 信号投影到空间、频谱和时间域，形成 `channels × frequency ×��time` 卷；

    2. **分类**：将 3D 卷输入到 `EEGCubeNet`，用于 HC 与 RE、HO 与 RE 的分类；

    3. **微调**：；

    4. **xAI**：使用 `3D xAI-OSA` 解释 `EEGCubeNet` 的输出，提供空间、频谱和时间域的 EEG 活动关联性。


    ### 3.1 数据预处理


    #### 数据处理与数据集构建


    #### 3.1.1 EEG 预处理


    为了评估所提方法的有效性，使用了 16 通道 EEG 数据（g.tec，奥地利）。右乳作为作为参考，AFz 被指定为接地。信号经过了 0.01Hz 到 200Hz
    的带通滤波（使用了八阶切雪比滤波器），随后通过了 50Hz 陷波滤波器以抑制干扰。采样率为 512Hz，更多细节请参见 15。在实验期间，受试者舒适地坐着，右臂由外骨骼支撑（Hocoma，瑞士）。采用了基于提示的运动范式，受试者从标准中立位置执行特定的肢体动作——定义为手臂伸展
    120°且手部部分开启(15)。实验方案由 10 轮组成，每轮包含 6 次试验。在每次试验中，受试者对要求的提示做出反应。每次运动后，在下一次提示之前，手回到中立位置。运动启动使用手套中的运动传感器数据确定，方法见
    15。为了确保准确性，所有选定的运动前区间都经过了人工验证。对于每个检测到的运动，提取 1 秒（对应 512 个样本）的 EEG 段。这为每个运动类别（即
    HO 和 HC）产生了 840 个 EEG 段，跨越 10 轮。为了保持类别平衡，包含了相同数量的 RE 段，共 2520 个 EEG 段。


    此处使用的数据源自 Ofner *et al.*^(15)) 该研究包括 15 名健康受试者（平均年龄 27 ± 5 岁），9 名女性和 6 名男性。一名受试者因质量问题被排除在外。总而言，每个受试者的数据集包含
    120 次 EEG 试验（即 120 个 EEG chans × freq × time 3D 矩阵），每类（HC 或 HO） 60 个，RE 也是 60
    个。


