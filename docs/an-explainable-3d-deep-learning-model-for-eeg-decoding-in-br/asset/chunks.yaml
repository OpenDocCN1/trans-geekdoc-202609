    This study presented `EEGCubeNet`, a novel explainable DL framework designed to
    decode EEG signals with a particular focus on minimizing subject-specific adaptation.
    By projecting EEG data into the space–frequency–time domain and adopting a global-to-subject-specific
    training approach, `EEGCubeNet` demonstrated strong decoding performance while
    significantly reducing the training time required for new users. The model’s architecture,
    which operates directly on scalp-level EEGs without source reconstruction, offers
    computational efficiency and avoids potential bias introduced by head models.
    Coupled with the newly proposed `xAI-3D-OSA` explainability framework, `EEGCubeNet`
    also provides transparent insights into the neural patterns driving its predictions,
    making it especially suitable for clinical and assistive applications. In addition,
    `EEGCubeNet`’s adaptability, efficiency, and interpretability make it a good candidate
    for integration into real-time BCI systems.


    ## Acknowledgments


    This work was supported in part by the European Union — Next Generation EU — PRIN
    2022 program, Italian Ministry of University and Research (MUR), project title:
    “EXEGETE: Explainable Generative Deep Learning Methods for Medical Signal and
    Image Processing” (project code: 2022ENK9LS, CUP: C53D23003650001); in part by
    the European Union — Next Generation EU, PRIN 2022 PNRR call, under the project
    “Interactive digital twin solutions for cardiovascular disease Management, PReventiOn
    and treatment leVeraging the internet of things and Edge intelligence paradigms
    — IMPROVE” (project code: P2022NH2CK, CUP: C53D23007960001); in part by the Fa.Per.M.E
    project (project code: T3-AN-15, CUP C33C22000390006, CUP MASTER H53C22000640006)
    funded by the Italian Ministry of Health; in part by the Next Generation EU —
