    \ Spatially filtered EEG signals were then projected into the TF domain using\
    \ the Continuous Wavelet Transform (CWT).^([20](#index.xhtml#S012906572550073XBIB020))\
    \ Specifically, for each spatially filtered EEG segment *E**E**G*[*s*], the TF\
    \ representation was computed for each individual channel (*i* = 1, …, 59), resulting\
    \ in 59 distinct TF maps. These maps were then stacked to form a 3D matrix with\
    \ dimensions: channel × frequency × time, capturing EEG dynamics across spatial,\
    \ spectral, and temporal dimensions. To investigate frequency bands relevant to\
    \ motor planning and preparation — namely, MRCP ( < 5 Hz),^([3](#index.xhtml#S012906572550073XBIB003))\
    \ sensorimotor rhythms (13–15Hz),^([21](#index.xhtml#S012906572550073XBIB021))\
    \ and the *β*\\-band (approximately 13–40Hz), the analysis was focused on the\
    \ 0.5–40Hz range. A custom set of 59 pseudo-frequencies spanning this range was\
    \ generated using the *scal2freq* function in *MATLAB2024b*, matching the number\
    \ of scalp EEG channels. In the end, 3D maps sized 59 × 59 × 512 were created,\
    \ and then downsampled to 59 × 59 × 128, representing the spatial–spectral–temporal\
    \ dynamics of the EEG segment under analysis. Downsampling allowed for a faster\
    \ computation while not affecting EEG dynamics representation as a sampling rate\
    \ of 128Hz is able to follow the variations in the range under analysis (0.5–40Hz).\
