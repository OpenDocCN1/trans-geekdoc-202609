    ## 摘要


    脑电图（EEG）信号解码对于脑机接口（BCI）系统的开发至关重要。然而，EEG 信号高度的个体间变异需要针对特定用户进行校准，由于妥善训练这些模型通常需要大量数据，这可能会消耗时间并限制深度学习方法的应用。在此背景下，本文提出了一种多维且可解释的深度学习框架，用于快速且可解释的
    EEG 解码。具体而言，将 EEG 信号投影到空间-频谱-时间域，并使用自定义的三维（3D）卷积神经网络进行处理，此处称为 `EEGCubeNet`。在这项工作中，该方法在运动
    BCI 实验期间记录的 EEG 上得到了验证。具体来说，通过区分开手（HO）和握拳（HC）运动规划与无运动准备（静息态，RE）状态对其进行了研究。所提出的方法基于从全局到特定用户的微调。模型在受试者群体上进行全局训练，然后在最终用户上进行微调，显著缩短了适应时间。实验结果表明，`EEGCubeNet`
    实现了先进的性能（HC 与 RE 以及 HO 与 RE 的二分类任务准确率分别为 89.56 ± 4.29 和 89.06 ± 4.86），同时降低了框架复杂性和训练时间。此外，为了提高透明度，引入了一种基于
    3D 遮挡敏感性分析的可解释方法（此处名为 `3D xAI-OSA`），该方法可以生成揭示每个预测中最显著特征的相关性图。数据和源代码可通过以下链接获取：[`github.com/AI-Lab-UniRC/EEGCubeNet`](https://github.com/AI-Lab-UniRC/EEGCubeNet)
    关键词：脑电图；3D 卷积神经网络；可解释人工智能；脑机接口。


    * *


    ^† 通讯作者。这是一篇由 World Scientific Publishing Company 出版的开放访问文章。根据 [知识共享署名许可 4.0 (CC
