    \ define the vertical range of the mask (channel), *t*[start]^(*k*), *t*[end]^(*k*)\
    \ define the temporal range (number of frames) of the mask. *R*[*k*] is the relevance\
    \ score assigned to the masked region based on the predictions of the model and\
    \ the change of degree in the outcome. Once the masked input is processed by *EEGCubeNet*,\
    \ class probability scores are obtained via the softmax function for both the\
    \ original input and the masked input. To assign the relevance to the masked pixels/regions\
    \ of the input, Sum of Absolute Difference (SAD) was used.^([25](#index.xhtml#S012906572550073XBIB025))\
    \ SAD is an appropriate metric for quantifying changes in the degree of outcome\
    \ in model predictions, especially when the focus is on the overall magnitude\
    \ of difference rather than subtle shape variations between distributions. SAD\
    \ provides a simple, easily interpretable measure of the total difference. The\
    \ input volumes (channels × frequency × time) represent EEG signal dynamics across\
    \ the spatial, spectral, and temporal domains. Masking a region of the input volume\
    \ means occluding specific channels within a given frequency and time range. Understanding\
    \ the impact of masking that region on classification allows to assess the relevance\
    \ of those channels, in that frequency band, during that time interval for the\
    \ classification task (premovement versus RE). To ensure a smooth and continuous\
    \ relevance evaluation, an overlapping sliding window approach was adopted with\
    \ a stride equal to *T*/2. In this way, the relevance of a given channel (*c*),\
    \ frequency (*f*), and time point (*t*) is assessed multiple times, depending\
    \ on how often it is occluded by the sliding mask. The average of these relevance\
    \ values is then computed to obtain a mean relevance score for that specific element\
    \ (*c*,*f*,*t*) of the input volume. Specifically, when a (*c*,*f*,*t*) element\
    \ is occluded by a mask and the relevance of the occluded region is evaluated,\
    \ the resulting relevance score is assigned to all (*c*,*f*,*t*) elements affected\
    \ by the occlusion. During the full input volume scanning procedure, each (*c*,*f*,*t*)\
    \ element will be occluded a total of *n* times, and *n* corresponding relevance\
    \ scores will be computed for it. At the end of the procedure, these scores are\
    \ averaged (i.e. summed and divided by *n*), yielding a single mean relevance\
    \ value for that element. Finally, a 3D matrix representing the relevance of each\
    \ channel and frequency over time is generated. To ensure a robust relevance evaluation,\
    \ an analysis across different mask sizes was performed. Masks sized 2 × 2 × *T*,\
    \ 4 × 4 × *T*, 8 × 8 × *T*, 16 × 16 × *T*, 24 × 24 × *T*, with *T* = 32 and *T* = 64\
    \ were used and their impact on the model’s decisions was evaluated. Given a mask\
    \ size, the mask slides over the entire input volume (in an overlapping way),\
    \ occluding a region of the volume at each step. To complete the scan of the entire\
    \ volume, the mask moves through *M* different positions. For each of the *M*\
    \ occluded positions, the probability score of both the original input volume\
