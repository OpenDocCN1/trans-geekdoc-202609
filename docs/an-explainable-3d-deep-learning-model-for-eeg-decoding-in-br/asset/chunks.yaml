- raw: 'For HC versus RE task (Table [2](s012906572550073xtbl002-wrap.xhtml)), the
    best average performance was achieved in the Conv3+ setting, while the worst performance
    was observed for FC3. The average accuracy for Conv3+ was 89.56 ± 4.29 across
    subjects. Additionally, the best individual subject performance was recorded for
    subject S02, achieving an accuracy 97.78 ± 2.72, with the lowest standard deviation,
    reflecting the robustness of the model across the *k*\-fold runs. Similarly, Table [3](s012906572550073xtbl003-wrap.xhtml)
    presents the model performance for HO versus RE task. The best performance was
    observed for Conv2+ layer and the worst for FC3. The average accuracy of Conv2+
    for this task was 89.06 ± 4.86. A gradually increasing trend of performance can
    be observed when fine-tuning was performed gradually on more layers, resulting
    in enhanced performance from FC3 to Conv2+. From Tables [2](s012906572550073xtbl002-wrap.xhtml)
    and [3](s012906572550073xtbl003-wrap.xhtml), one can observe that the average
    results across all subjects indicate an improvement in performance as more layers
    of the model are fine-tuned. The advantages of fine-tuning process are analyzed
    when fewer or more layers are fine-tuned, and the corresponding insights in terms
    of training time and number or trained parameters are presented in Sec. [4.1.2](#index.xhtml#sec-4-1-2).
    Further insights on models’ performance are illustrated in Figs. [5](s012906572550073xfigf5.xhtml)
    and [6](s012906572550073xfigf6.xhtml) in terms of K-Cohen, as described in Sec. [3.5](#index.xhtml#sec-3-5).
    Figures [5](s012906572550073xfigf5.xhtml) and [6](s012906572550073xfigf6.xhtml)
    illustrate the boxplots for the HC versus RE task and HO versus RE task, respectively,
    representing the K-Cohen coefficient for all the fine-tuned models under analysis.
    The *y*\-axes presents the K-Cohen values and *x*\-axes presents the subjects
    on which the models were fine-tuned. On the right, the K-Cohen ranges of significance
    are reported, from “no agreement” to “very high agreement”. The results provided
    by the different fine-tuned models are represented with different colors. Given
    a subject, the K-Cohen produced by the different fine-tuned models cases are plotted
    adjacent to each other. Further, horizontal lines are drawn to show the average
    K-Cohen score for every specific fine-tuned model using the same color of the
    boxplot. It can be observed that the average K-Cohen falls in the range “substantial
    agreement” for all the Conv4+ to Conv1+ (all layers) models, with average K-Cohen
    of models Conv3+, Conv2+, Conv1+ tending towards to the “very high agreement”
    range. When only the fully connected layers were fine-tuned (models FC3, FC2+,
    FC1+), a “moderate agreement” was achieved, on average. ![Fig. 5. Cohen Kappa
    performance of EEGCubeNet model for HC versus RE task when different layers are
    fine-tuned, and plotted with boxplots.](images/s012906572550073xfigf5.png)


    Fig. 5. Cohen Kappa performance of *EEGCubeNet* model for HC versus RE task when
    different layers are fine-tuned, and plotted with boxplots.


    ![Fig. 6. Cohen Kappa performance of EEGCubeNet model for HO versus RE task when
    different layers are fine-tuned, and plotted with boxplots.](images/s012906572550073xfigf6.png)


    Fig. 6. Cohen Kappa performance of *EEGCubeNet* model for HO versus RE task when
    different layers are fine-tuned, and plotted with boxplots.


    #### 4.1.1.  Analysis of the extracted features


    To further investigate the performance of *EEGCubeNet* model, t-distributed stochastic
    neighbor embedding (t-SNE) analysis was performed to visualize the separability
    of the feature maps and assess the effectiveness of different fine-tuning strategies
    in distinguishing between classes. Specifically, t-SNE projects high-dimensional
    data into a lower-dimensional feature space by converting pairwise distances —
    using the Chebyshev distance in this case — into joint probability distributions.
    It then minimizes the Kullback–Leibler divergence between the joint distributions
    of the high-dimensional and low-dimensional representations to preserve local
    structure.^([27](#index.xhtml#S012906572550073XBIB027)) The visualizations of
    t-SNE plots are presented in Figs. [7](s012906572550073xfigf7.xhtml) and [8](s012906572550073xfigf8.xhtml)
    for the tasks HC versus RE and HO versus RE, respectively, for a sample subject
    (S10). The separability of the features projections can be visually evaluated
    for the different *EEGCubeNet* fine-tuned models (from FC3 to Conv1+). A clear
    trend can be observed in the figures, progressing from right to left, where the
    separation between classes improves as fine-tuning is extended to deep layers,
    endorsing the positive impact of progressive fine-tuning. This pattern is consistent
    for both HC versus RE and HO versus RE tasks. A peak of average separability is
    detectable for Conv2+ and Conv3+ fine-tuned versions of *EEGCubeNet*, in agreement
    with classification performances reported in Tables [2](s012906572550073xtbl002-wrap.xhtml)
    and [3](s012906572550073xtbl003-wrap.xhtml), validating the effectiveness of the
    proposed global to subject-specific approach exploiting the knowledge acquired
    in the global training stage to the subject-specific fine-tuning stage. To further
    analyze the t-SNE results of other subjects, we provided plots for subject S02
    in the *Supplementary Materials*. Supplementary material is provided at the following
    link [https://github.com/AI-Lab-UniRC/EEGCubeNet](https://github.com/AI-Lab-UniRC/EEGCubeNet)
    ![Fig. 7. The high-dimensional projections of feature maps of EEGCubeNet model
    are visualized with t-SNE for the task of HC versus RE for subject S10. In each
    plot, the feature maps from the last fully connected layer are visualized, when
    fine-tuning was performed for different layers of the trained model for left out
    subject. Each plot represents to specific layer, Conv1+ (all layers) to FC3 can
    be read from left to right.](images/s012906572550073xfigf7.png)


    Fig. 7. The high-dimensional projections of feature maps of *EEGCubeNet* model
    are visualized with t-SNE for the task of HC versus RE for subject S10. In each
    plot, the feature maps from the last fully connected layer are visualized, when
    fine-tuning was performed for different layers of the trained model for left out
    subject. Each plot represents to specific layer, Conv1+ (all layers) to FC3 can
    be read from left to right.


    ![Fig. 8. The high-dimensional projections of feature maps of EEGCubeNet model
    are visualized with t-SNE for the task of HO versus RE for subject S10. In each
    plot, the feature maps from the last fully connected layer are visualized, when
    fine-tuning was performed for different layers of the trained model for left out
    subject. Each plot represents to specific layer, Conv1+ (all layers) to FC3 can
    be read from left to right.](images/s012906572550073xfigf8.png)


