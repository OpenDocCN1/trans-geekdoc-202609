- raw: "In this study, *EEGCubeNet*, a novel multidimensional and explainable DL framework\
    \ for decoding EEG signals was introduced and validated on EEGs recorded during\
    \ motor BCI experiments. The key motivation behind this work was to address one\
    \ of the central challenges in applying DL models to EEG-based BCI: the substantial\
    \ inter-subject variability in EEG signals, which necessitates user-specific calibration.\
    \ Calibration procedures are often time consuming, especially when DL models are\
    \ involved, as they typically require a large amount of data for training, which\
    \ results in the need of long EEG recordings to fine-tune the model on the final\
    \ user. In this context, developing models that support rapid subject-specific\
    \ fine-tuning is a critical step toward more deployable and user-friendly DL-based\
    \ BCI systems. To meet this need, *EEGCubeNet* was first trained on a population-level\
    \ dataset and subsequently fine-tuned on unseen subject. In particular, EEG derived\
    \ from a public dataset acquired during motor BCI experiments were analyzed, with\
    \ the aim of characterizing the HO motor initiation (pre-HO versus RE classification)\
    \ and the HC motor initiation (pre-HC versus RE classification). *EEGCubeNet*\
    \ was fed with 3D matrices representing the projections of EEG signals into the\
    \ space–frequency–time domain. This strategy demonstrated the feasibility of efficiently\
    \ adapting a complex DL model to new users, thereby reducing the training burden\
    \ while preserving classification performance. Beyond performance, model explainability\
    \ can play an important role in ensuring transparency and interpretability of\
    \ neural decoding processes, especially in clinical and assistive settings. In\
    \ Ref. [11](#index.xhtml#S012906572550073XBIB011), the authors interpreted CNN-based\
    \ EEG decoding through OSA at source level, revealing that the central region,\
    \ the right temporal zone of the premotor cortex, and the primary motor cortex\
    \ played a crucial role in EEG sources classification. It is worth mentioning\
    \ that in OSA, the sensitivity masks are typically applied to 2D images to interpret\
    \ classification decisions. A recent study extended this approach to visually\
    \ explain the decision-making process of 3D CNNs by incorporating a temporal dimension\
    \ into occlusion sensitivity analysis.^([28](#index.xhtml#S012906572550073XBIB028))\
    \ However, applying this strategy to 3D volumetric EEG data poses challenges due\
    \ to the continuous nature of nonstationary and noisy EEG signals distributed\
    \ across multiple frames with a variability in and between the subjects. Furthermore,\
    \ using optical flow masking would likely result in occluding large portions of\
    \ each channel × frequency frame, leading to the loss of information necessary\
    \ for identifying highly relevant channels and their frequency variations over\
    \ time. To this end, a novel 3D explainability framework was also introduced,\
    \ referred to as *3D xAI-OSA*, based on the Occlusion Sensitivity Analysis. This\
    \ technique enabled a deeper understanding of the spatial–spectral–temporal patterns\
    \ contributing to the network’s decisions, offering insights into how preparatory\
    \ brain activity associated with hand movements is represented in EEG data. \n\
    \n### 5.1.  Impact of the proposed approach\n\nOverall, *EEGCubeNet*, coupled\
    \ with the *3D xAI-OSA* framework, represents a promising direction for creating\
    \ robust, adaptable, and interpretable BCI systems. The advantages of *EEGCubeNet*\
    \ over previous models^([4](#index.xhtml#S012906572550073XBIB004),[11](#index.xhtml#S012906572550073XBIB011),[12](#index.xhtml#S012906572550073XBIB012))\
    \ are manifold: • It processes EEG signals at the scalp level without reconstructing\
    \ cortical sources, which provides an advantage in terms of computational complexity.\
    \ Furthermore, it does not require the use of a head model, which might not accurately\
    \ reflect the brain structure of the subject under examination, potentially introducing\
    \ bias^([11](#index.xhtml#S012906572550073XBIB011)); • Thanks to the global-to-subject-specific\
    \ approach, it leverages knowledge acquired from the subject population during\
    \ the training phase to achieve comparable performance with reduced training time\
    \ on the final user; • It decodes EEG signals with comparable performance while\
    \ simultaneously taking into account the evolution of their dynamics in space,\
    \ frequency, and time, not just space and frequency^([4](#index.xhtml#S012906572550073XBIB004))\
    \ or space and time^([11](#index.xhtml#S012906572550073XBIB011)); • *EEGCubeNet*,\
    \ when coupled with the *xAI-3D-OSA* method, enabled explanation of the model’s\
    \ outcomes, allowing the detection of a subject-specific trend among the most\
    \ relevant channels as frequency varies during motion initiation of HC and HO.\
    \ As regards the training time, in Ref. [12](#index.xhtml#S012906572550073XBIB012)\
    \ which is a double branch DL model, the training time was of about 30min for\
    \ one branch and 1.5h for the other branch, per subject for 10 folds. In Ref. [11](#index.xhtml#S012906572550073XBIB011),\
    \ the training time was of 10 min per subject for 10 folds, excluding the time\
    \ necessary to perform the inverse problem solution to reconstruct cortical sources.\
    \ In Ref. [4](#index.xhtml#S012906572550073XBIB004), the average training time\
    \ was of approximately 9min per subject, for 10 folds, but it is worth emphasizing\
    \ that the approach adopted in this paper is not comparable as classification\
    \ was carried out at frame level (one frame is a channel × frequency map and one\
    \ EEG trial of 1 s includes 512 frames), and not at trial level, like in this\
    \ work. The average training time of *EEGCubeNet* for one subject was of 4.35min\
    \ for 10 folds and inference time was 23s; and the average training time of 3D\
    \ EEGNet for 10 folds was 65min and inference time was 33s. \n\n### 5.2.  Limitations\
    \ and future works\n\nAmong the limitations of this work, the small number of\
    \ available trials per class per subject should be noted. Future studies should\
    \ consider larger datasets, also for the purpose of validating the model in decoding\
    \ more complex tasks. This will also enable the extension of the explainability\
    \ analysis, whose effectiveness depends on the classifier’s ability to generalize.\
    \ Second, movement’s onset were marked by processing the data collected by the\
    \ motion sensors embedded in the glove that the participant used to wear during\
    \ the experiment. Motion data collected through the glove are smooth and do not\
    \ allow one to detect onset instantaneously, which means the epochs used for training\
    \ may have captured the early milliseconds of motion implementation, which may\
    \ have caused, in principle, the similar activation patterns. Among the future\
    \ potentials of the proposed method is its applicability to online frameworks,\
    \ given the small number of parameters that need to be updated to adapt the model\
    \ to the final user. Since *EEGCubeNet* is designed to analyze 3D matrices representing\
    \ EEG signals in the space–frequency–time domain, it is capable of effectively\
    \ capturing the complex mutual interactions among the temporal evolution of EEG\
    \ signal features across both the spatial domain (i.e. across different channels)\
    \ and the spectral domain (i.e. across varying frequencies). This inherent capability\
    \ makes it reasonable to assume that extending the model to other applications,\
    \ such as attention detection, emotion recognition, sleep monitoring, neurological\
    \ disorders diagnosis, could be relatively straightforward. However, in order\
    \ to validate this assumption, it is essential to adapt and rigorously test the\
    \ model on appropriate datasets that are specific to each application domain.\
    \ This direction will be one of the primary goals of future research, especially\
    \ considering the growing importance of these topics in the fields of computational\
    \ neuroscience and neurotechnology. \n\n## 6\\. Conclusions"
  fmt: '

