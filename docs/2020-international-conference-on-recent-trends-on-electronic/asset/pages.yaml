    # V. CONCLUSION


    To evaluate our model to achieve a better performance which is done by XGB classifier.
    This is one of the best algorithm and this is a decision based gradient boosting
    framework work for analysis and confusion matrix tells us how correct values are
    predicted. XGB Boost has predictive power and is about 10 times more durable than
