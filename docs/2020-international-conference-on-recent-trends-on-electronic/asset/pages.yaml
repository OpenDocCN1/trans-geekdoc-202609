    In the wake of the ongoing COVID-19 pandemic, businesses and organizations have
    acclimated to unforeseen and different working ways, such as working from home,
    with limited employees at office. With the new normal, employees have also been
    adapted to different working environments and conditions, which has also resulted
    in psychological stress and lethargy for many. In this work, data visualization
    techniques and machine learning algorithms have been used to predict employees
    stress levels. Based on data, we can develop a model to predict if an employee
    is under stress or not. The XGB classifier is used for the prediction and the
    results are presented showing that the method is highly effective. We also found
    that working hours, age, and role ambiguity have a significant significance and
    influence on employee performance. It is concluded that increasing working hours
    would not diminish employee representation in all cases.


    employees are subjected to a phenomenon like the present pandemic. Hence, machine
    learning algorithms are used to predict whether employees undergoing stress or
    not.


    # II. LITERATURE SURVEY


    Workplace stress is a having concern for employees like resource managers and
    so on. Although scholarly and practical work has been dedicated to stress management
    over the years, the time comes for different perspectives. Extracting from the
    emerging field of organizational performance, this research analysis includes
    implications for occupational stress.


    Specifically, from a large sample of working employees beyond a variety of industries
    and organizations that have positive resources of efficacy, and resilience may
    be maintained by building coping strategies against manifestations of stress.
    Numerous investigations and experimentation have been done in the last few years,
    of the studies have been conducted in countries that endeavor to prevent and manage
    workplace stress. However stress is one of the most widespread ‘occupational disorders,’
    the past affect of workplace and it is affecting their overall job performance
    on regular basis.


