    在持续的 COVID-19 疫情背景下，企业和机构已经适应了不可见且不同的工作方式，例如居家办公以及办公室员工人数减少。在新常态下，员工也适应了不同的工作环境和条件，这导致了许多人的心理压力和疲倦。在这项工作中，我们使用了数据可视化技术和机器学习算法来预测员工的压力水平。根据数据，我们可以开发一个模型来预测员工是否承受压力。使用
    XGB 分类器进行预测，结果显示该方法非常有效。我们还发现工作时间、年龄和角色模糊性对员工表现具有显著意义和影响。结论认为，在所有情况下，增加工作时间并不会减少员工的代表性。


    员工正受到如目前疫情等现象的影响。因此，使用机器学习算法来预测员工是否承受压力。


    ## II. 文献综述


    职场压力是资源经理等员工关注的问题。尽管多年来学术界和实务工作一直致力于压力管理，但现在是需要不同视角了。从新兴的组织绩效领域提取，这项研究分析包含了对职业压力的影响。


    具体而言，从来自多种行业和组织的大量工作员工样本中，通过建立针对压力表现的应对策略，可以维持积极的效能资源和韧性。过去几年里，已经进行了大量的调查和实验，在努力预防和管理职场压力的国家进行了研究。然而，压力是最广泛的“职业病”之一，过去影响着职场，并定期影响着他们的整体工作表现。


    ## I. 引言


    关键词—数据可视化、机器学习算法、员工、分析、压力


    2020年3月11日，世界卫生组织（WHO）宣布冠状病毒（COVID-19）为大流行，标志着一场威胁整个世界的全球性流行威胁。“冠状病毒”是一类受病毒影响的疾病家族，引起从流感到其他呼吸道症状的疾病。根据世卫组织的数据，病毒病例已超过200例。由于这一冲击，股市、市场和行业增长出现严重下滑。在此期间，也影响了员工，他们在居家办公以应对压力时感到压力。将机器学习和智能应用于该领域被认为非常有前景。[11]
    中分析了员工的行为模式。


    相应，除了头痛外，他们由于长时间工作而感到不满意。此外，其后果是对员工表现产生压力。此外，这会影响生理疾病和对工作的投入。在目前的情况下，COVID-19
    让世界处于前所未有的地位。通过这项工作，我们打算分析压力水平——


