  ```\n\n\n\n\n\n# PyTorch - 使用卷积进行序列处理\n\n在本章中，我们提出了一种替代方法，该方法在两个序列上依赖于单个 2D 卷积神经网络。我们网络的每一层都会根据目前为止生成的输出序列对源标记进行重新编码。因此，类似于注意力的属性贯穿整个网络。在这里，我们将关注如何利用数据集中包含的值通过特定的池化创建序列网络。此过程最适用于“图像识别模块”。\n\
  \n![Sequential Network](img/image1636.jpg)\n\n使用以下步骤通过 PyTorch 使用卷积创建序列处理模型 −：\n\
  \n### 步骤 1：导入使用卷积进行序列处理所需的必要模块。\n\n```python\nimport keras\nfrom keras. datasets\
  \ import mnist\nfrom keras.models import Sequential\nfrom keras.layers import Dense\
  \ , Dropout , Flatten\nfrom keras.layers import Conv2D , MaxPooling2D\nimport numpy\
  \ as np\n```\n\n### 步骤 2：使用以下代码在相应序列中执行必要操作创建模式 −\n\n```python\nbatch_size = 128\n\
  num_classes = 10\nepochs = 12\n### 输入图像维度\nimg_rows, img_cols = 28 , 28\n### 数据划分为训练集和测试集\n\
  (x_train, y_train), (x_test, y_test) = mnist.load_data()\nx_train = x_train.reshape(\
  \ 60000 , 28 , 28 , 1 )\nx_test = x_test.reshape( 10000 , 28 , 28 , 1 )\nprint (\
  \ 'x_train shape:' , x_train.shape)\nprint ( x_train.shape[0], 'train samples' )\n\
  print ( x_test.shape[0], 'test samples' )\ny_train = keras.utils.to_categorical(\
  \ y_train, num_classes)\ny_test = keras.utils.to_categorical( y_test, num_classes)\n\
  ```\n\n### 步骤 3：编译模型并在上述传统神经网络模型中拟合模式，如下所示 −\n\n```python\nmodel.compile(loss =\
  \ keras.losses.categorical_crossentropy, optimizer = keras.optimizers.Adadelta(),\
