- "# PyTorch：初学者 PyTorch 深度学习入门指南，2019版\n\n\n\n![](img/image8.jpg)\n![](img/image8.jpg)\n\
  \n\n![](img/image29.jpg)\n\n# PyTorch 入学者教程\n\n`PyTorch` 是基于 `Torch` 库的计算机软件的一个部分。它是由\
  \ `Facebook` 引入的一个深度学习框架。`PyTorch` 是一个用于 `Python` 编程语言的机器学习库，用于`自然语言处理`等应用。`PyTorch`\
  \ 提供的高级特性如下：\n\n1. 在`图形处理器` (`GPU`) 的帮助下，它提供了具有强力加速的张量计算。\n2. 它提供了基于胶带式（tape-based）自动微分系统的`深度神经网络`。\n\
  \n`PyTorch` 的开发是为了在实现和构建`深度学习神经网络`时提供高度的灵活性和速度。正如你所知道的，它是一个 `Python` 编程语言的机器学习库，因此安装、运行和理解它非常简单。`Pytorch`\
  \ 是完全 Python 化的（使用广泛采用的 `python` 习语而不是编写 `Java` 和 `C++` 代码），因此它可以快速成功地构建`神经网络模型`。\n\
  \n## PyTorch 历史\n\n`PyTorch` 发布于 2016 年。越来越多的研究人员愿意采用 `PyTorch`。它由 `Facebook` 运营。`Facebook`\
  \ 还运营 `Caffe2` (`用于快速特征嵌入的卷积架构`）。将 `PyTorch` 定义的模型转换为 `Caffe2` 是具有挑战性的。为了这一目的，`Facebook`\
  \ 和 `Microsoft` 在 `2017 年 9 月` 发明了`开放神经网络交换` (`ONNX`)。\n\n简单来说，`ONNX` 的开发是为了在不同框架之间转换模型。`Caffe2`\
  \ 已于 2018 年 3 月合并到 `PyTorch`。`PyTorch` 使得构建极其复杂的神经网络变得容易。这一特性使其迅速成为首选库。在研究工作中，它与\
  \ `TensorFlow` 形成了激烈的竞争。\n\n`PyTorch` 的发明者想要创建一个高度命令式的库，可以轻松运行所有的数值计算，最终，他们发明了 `PyTorch`。对于深度学习科学家、机器学习开发人员和神经网络调试器来说，实时运行和测试部分代码是一个巨大的挑战。`PyTorch`\
  \ 完成了这一挑战，允许他们实时运行和测试代码。因此，他们不需要等待检查它是否有效。\n\n## 教程信息\n\n### 本教程面向的对象\n本教程是为专注于机器学习算法以及自然语言处理系统的研发的\
  \ `python` 开发者准备的。本教程的目标是完整描述 `PyTorch` 的所有概念以及相应的现实示例。\n\n### 先决条件\n在继续本教程之前，你需要具备\
  \ `Python` 和 `Anaconda` 框架的知识（`Anaconda` 中的命令）。具有人工智能概念知识将是一个额外的优势。\n\n---\n\n\n\
  ---\n\n# PyTorch - 简介\n\n`PyTorch` 被定义为用于 `Python` 的开源机器学习库。它用于自然语言处理等应用。它最初由 `Facebook`\
  \ 人工智能研究小组开发，并在此构建了用于概率编程的 `Uberss Pyro` 软件。最初，`PyTorch` 由 `Hugh Perkins` 开发，作为基于\
  \ `Torch` 框架的 `LuaJIT` 的 `Python` 封装。\n\n有两个 `PyTorch` 变体。`PyTorch` 在 `Python` 中重新设计并实现了\
  \ `Torch`，同时为后端代码共享相同的内核 `C` 库。`PyTorch` 开发人员调整了这些后端代码以高效运行 `Python`。他们还保留了基于 `GPU`\
  \ 的硬件加速以及使得基于 `Lua` 的 `Torch` 的扩展性特性。\n\n## 特性\n\n`PyTorch` 的主要特性如下：\n\n### 易用的接口\n\
  `PyTorch` 提供了易于使用的 API；因此它被认为非常容易操作并运行在 `Python` 上。\n\n### Python 使用\n该库被认为是 `pythonic`\
  \ 的，与 `Python` 数据栈无缝集成。因此，它可以利用 `Python` 环境提供的所有服务和功能。\n\n### 计算图\n`PyTorch` 提供了一个提供动态计算图的优秀平台。因此用户可以在运行时更改它们。当开发者不知道创建神经网络模型需要多少内存时，这非常有用。\n\
  \n`PyTorch` 以具有以下三个级别的抽象著称：\n\n- `Tensor` — 运行在 `GPU` 上的命令式多维数组。\n- `Variable` —\
  \ 计算图中的节点。它存储数据和梯度。\n- `Module` — 神经网络层，将存储状态或可学习权重。\n\n\n\n\n\n# PyTorch vs TensorFlow\n\
  \n| PyTorch 以命令式和动态的方式包含所有功能。 | TensorFlow 包含了静态和动态图的结合。 |\n| PyTorch 的计算图是在运行时定义的。\
  \ | TensorFlow 不包含任何运行时选项。 |\n| PyTorch 包含了针对移动和嵌入式框架的部署功能。 | TensorFlow 在嵌入式框架方面表现更好。\
  \ |\n\n## PyTorch - 安装\n\n要进行安装，你必须先选择你的偏好，然后运行安装命令。你可以从本地安装，也可以通过云合作伙伴进行安装。在下图中，`Stable`\
  \ 显示了目前受支持和测试的 PyTorch 版本（`1.1`），它适用于许多用户。如果你想要最新的 `1.1` 构建版本但尚未经过完全测试和支持，那么你必须选择\
  \ `Preview` (Nightly)`。对于安装，前提是你已经满足适用于你的包管理器的先决条件。我们建议你使用 `Anaconda` 包管理器，因为它安装了所有的依赖项。\n\
