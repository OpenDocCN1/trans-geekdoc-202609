  \ - 术语\n\n在本章中，我们将讨论 PyTorch 中一些常用的术语。\n\n## PyTorch NumPy\n`PyTorch` 的张量（tensor）与\
  \ `NumPy` 数组是相同的。`tensor` 是一个 n 维数组，对于 `PyTorch` 而言，它提供了许多对这些张量进行操作的功能。`PyTorch`\
  \ 张量通常利用 GPU 来加速数值计算。这些在 `PyTorch` 中创建的张量可以用于对随机数据拟合双层网络。用户可以手动实现通过网络的前向传播和反向传播。\n\
  \n### 变量与 Autograd\n使用 `autograd` 时，网络的正向传播将定义一个计算图——图中的节点将是 `Tensors`，边将是根据输入 `Tensors`\
  \ 产生输出 `Tensors` 的函数。`PyTorch` Tensors 可以被作为变量对象创建，其中变量代表计算图中的一个节点。\n\n### 动态图\n\
  静态图的优点是用户可以预先对图进行优化。如果程序员反复反复使用同一个图，那么这种潜在的高昂的预先优化就可以被维持，因为同一个图会被反复运行。它们之间的主要区别是\
  \ `Tensor Flow` 的计算图是静态的，而 `PyTorch` 使用动态计算图。\n\n### optim 包\nPyTorch 中的 `optim`\
  \ 包抽象了优化算法的概念，该算法通过许多方式实现实现，并提供了常用优化算法的示例说明。这可以在导入语句中调用。\n\n### 多进程\n多进程（Multiprocessing）支持相同的操作，使得所有张量都在多个处理器上运行。队列将将其数据移动到共享内存中并仅向另一个进程发送句柄。\n\
  \n# PyTorch - 加载数据\n`PyTorch` 包含一个名为 `torchvision` 的包，用于加载和准备数据集。它包含了两个基本函数，即 `Dataset`\
  \ 和 `DataLoader`，有助于数据集的转换和加载。\n\n### Dataset\n`Dataset` 用于从给定的数据集中读取并转换数据点。实现的基本语法如下所示\
  \ −\n```\ntrainset = torchvision.datasets.CIFAR10(root='./data', train=True, download=True,\
  \ transform=transform)\n```\n\n### DataLoader\n`DataLoader` 用于数据的洗乱和分批处理。它可以配合多进程工作器并行加载数据。\n\
  ```\ntrainloader = torch.utils.data.DataLoader(trainset, batch_size=4, shuffle=True,\
  \ num_workers=2)\n```\n\n### 示例：加载 CSV 文件\n我们使用 Python 包 `Panda` 来加载 csv 文件。原始文件格式如下：(图像名称,\
  \ 68 个关键点 - 每个关键点都有 x, y 坐标)。\n```python\nlandmarks_frame = pd.read_csv('faces/face_landmarks.csv')\n\
  n = 65\nimg_name = landmarks_frame.iloc[n, 0]\nlandmarks = landmarks_frame.iloc[n,\
  \ 1:].as_matrix()\nlandmarks = landmarks.astype('float').reshape(-1, 2)\n```\n\n\
  # PyTorch - 线性回归 \n在本章中，我们将重点关注使用 `TensorFlow` 实现线性回归的基本示例。逻辑回归或线性回归是一种用于离散类别分类的监督学习方法。本章的目标是构建一个模型，用户可以通过该模型预测变量与一个或多个独立变量之间的关系。这两个变量之间的关系被认为是线性的，即如果\
  \ `y` 是因变量而 `x` 被视为自变量，那么这两个变量的线性回归关系将看起来像下面提到的方程 −\n`Y = Ax+b`\n\n接下来，我们将为线性回归设计一种算法，使我们能够理解下面的两个重要概念\
  \ −\n* 损失函数 (Cost Function)\n* 梯度下降算法 (Gradient Descent Algorithms)\n\n线性回归的示意图如下，解释结果\
  \ `Y=ax+b`\n\n* `a` 的值是斜率。\n* `b` 的值是截距。\n* `r` 是相关系数。\n* `r 2` 是相关系数。\n\n线性回归的图形视图如下，解释结果\
  \ `Y=ax+b`\n\n![Interpreting result](img/image903.jpg)\n\n使用 `PyTorch` 实现线性回归的步骤如下：\n\
  \n### 第 1 步\n导入用于在 PyTorch 中创建线性回归的必要包 −\n```python\nimport numpy as np\nimport\
  \ matplotlib.pyplot as plt\nimport seaborn as sns\nimport pandas as pd\n% matplotlib\
  \ inline\nsns.set_style('whitegrid')\n```\n\n### 2 步\n创建一个带有可用数据的单个训练集 −\n```python\n\
  m = 2 # 斜率\nc = 3 # 截距\nx = np.random.rand(256)\nnoise = np.random.randn(256) /\
  \ 4\ny = x * m + c\ndf = pd.DataFrame()\ndf['x'] = x\ndf['y'] = y\n```\n![Single\
  \ Training](img/image955.jpg)\n\n### 第 3 步\n使用 `PyTorch` 实现线性回归 −\n```python\nimport\
  \ torch\nimport torch.nn as nn\nfrom torch.autograd import Variable\n\nx_train =\
  \ x.reshape(-1, 1).astype('float32')\ny_train = y.reshape(-1, 1).astype('float32')\n\
  \nclass LinearRegressionModel(nn.Module):\n    def __init__(self, input_dim, output_dim):\n\
  \        super(LinearRegressionModel, self).__init__()\n        self.linear = nn.Linear(input_dim,\
  \ output_dim)\n    def forward(self, x):\n        out = self.linear(x)\n       \
  \ return out\n\ninput_dim = x_train.shape[1]\noutput_dim = y_train.shape[1]\nmodel\
  \ = LinearRegressionModel(input_dim, output_dim)\ncriterion = nn.MSELoss()\n[w,\
  \ b] = model.parameters()\n\ndef get_param_values():\n    return w.data[0][0], b.data[0]\n\
  \ndef plot_current_fit(title=\"\"):\n    plt.figure(figsize=(12, 4))\n    plt.title(title)\n\
  \    plt.scatter(x, y, s=8)\n    w1 = w.data[0][0]\n    b1 = b.data[0]\n    x1 =\
  \ np.array([0., 1.])\n    y1 = x1 * w1 + b1\n    plt.plot(x1, y1, 'r', label='Current\
  \ Fit ({:.3f}, {:.3f})'.format(w1, b1))\n    plt.xlabel('x (input)')\n    plt.ylabel('y\
  \ (target)')\n    plt.legend()\n    plt.show()\n```\n`plot_current_fit('Before training')`\n\
  生成的图表如下 ![Plot Generated](img/image1036.jpg)\n\n\n\n\n让我们详细理解其中的每一个术语。\n\n### 局部感受野\
  \ (Local Respective Fields)\nCNN 利用输入数据中存在的空间相关性。神经网络并发层中的每一层都连接某些输入神经元。这个特定区域被称为\
  \ `Local Receptive Field`（局部感受野）。它只关注隐藏神经元。隐藏神经元将处理上述区域内的输入数据，而不会感知到特定边界之外的变化。生成局部感受野的图示如下所示\
  \ − \n\n![Local Respective Fields](img/image1069.jpg)\n\n### 卷积 (Convolution)\n\
  在上面的图中，我们观察到每个连接都学习了隐藏神经元的权重，该权重与从一层到另一层的移动连接相关联。在这里，单个神经元不时地执行位移。这个过程被称为“卷积”。从输入层到隐藏特征图的连接映射定义为“共享权重”（shared\
  \ weights），包含的偏置则称为“共享偏置”（shared bias）。\n\n### 池化 (Pooling)\n卷积神经网络使用池化层，这些层紧位于\
  \ CNN 声明之后。它将用户的输入作为卷积网络输出的特征图，并准备一个压缩的特征图。池化层有助于创建具有前一层神经元的后续层。\n\n### PyTorch\
  \ 的实现 (Implementation of PyTorch)\n使用以下步骤通过 PyTorch 创建卷积神经网络。\n\n**步骤 1：导入创建简单神经网络所需的包。**\n\
  ```python\nfrom torch.autograd import Variable\nimport torch.nn.functional as F\n\
  ```\n\n**步骤 2：创建一个带有卷积神经网络批处理表示的类。** 我们的输入 `x` 的批处理形状维度为 (3, 32, 32)。\n```python\n\
  class SimpleCNN (torch.nn.Module):\n    def __init__(self):\n        super(SimpleCNN,\
  \ self).__init__()\n        #输入通道 = 3, 输出通道 = 18\n        self.conv1 = torch.nn.Conv2d(3,\
  \ 18, kernel_size=3, stride=1, padding=1)\n        self.pool = torch.nn.MaxPool2d(kernel_size=2,\
  \ stride=2, padding=0)\n        # 4608 个输入特征，64 个输出特征（见下方的尺寸流程）\n        self.fc1\
  \ = torch.nn.Linear(18 * 16 * 16, 64)\n        # 64 个输入特征，对于我们定义的 10 类输出 10 个\n\
  \        self.fc2 = torch.nn.Linear(64, 10)\n```\n\n**步骤 3：计算第一次卷积的激活** 尺寸从 (3,\
  \ 32, 32) 变为 (18, 32, 32)。维度尺寸从 (18, 32, 32) 变为 (18, 16, 16)。由于重塑神经网络输入层的数据维度，尺寸从\
  \ (18, 16, 16) 变为 (1, 4608)。请记住 `-1` 会从其他给定的维度推导出此维度。\n```python\ndef forward(self,\
  \ x):\n    x = F.relu(self.conv1(x))\n    x = self.pool(x)\n    x = x.view(-1, 18\
  \ * 16 * 16)\n    x = F.relu(self.fc1(x))\n    # 计算第二个全连接层（激活稍后应用）\n    # 尺寸从 (1,\
  \ 64) 变为 (1, 10)\n    x = self.fc2(x)\n    return (x)\n```\n\n### PyTorch - 循环神经网络\
  \ (Recurrent Neural Network)\n循环神经网络是一种面向深度学习的算法类型，它遵循顺序方法。在神经网络中，我们总是假设每个输入和输出都与所有其他层相互独立。这类神经网络被称为循环网络，是因为它们以顺序的方式进行数学计算，一个接一个地完成任务。下面的图说明了循环神经网络的完整方法和工作原理\
  \ − \n\n![Recurrent Neural Networks Ex](img/image1138.jpg)\n\n在上面的图中，`c1`、`c2`、`c3`\
  \ 和 `x1` 被视为输入，其中了一些隐藏输入值 `h1`、`h2` 和 `h3`，它们提供了 `o1` 的相应输出。我们现在将关注使用 PyTorch 来通过循环神经网络创建一个正弦波。在训练期间，我们将遵循训练方法对模型进行一次处理一个数据点的训练。输入序列\
  \ `x` 包含 20 个数据点，目标序列被认为与输入序列相同。\n\n**步骤 1：使用以下代码实现循环神经网络所需的包 −**\n```python\nimport\
  \ torch\nfrom torch.autograd import Variable\nimport numpy as np\nimport matplotlib.pyplot\
  \ as plt\nimport torch.nn as nn\nimport torch.nn.functional as F\nimport torch.optim\
  \ as optim\n```\n\n**步骤 2：我们将设置超参数**\n```python\ninput_size = 7\nhidden_size = 6\n\
  output_size = 1\nepochs = 300\nlr = 0.1\nseq_length = 20\ntime_steps = np.linspace(0,\
  \ 2*pi, seq_length)\nx = np.sin(time_steps)\ny = x\nx = Variable(torch.FloatTensor(x))\n\
  ```\n\n**步骤 3：使用正态分布初始化权重**\n```python\nw1 = Variable(torch.randn(input_size, hidden_size))\n\
  w2 = Variable(torch.randn(hidden_size, output_size))\n```\n\n**步骤 4：创建一个前向传播函数**\n\
  ```python\ndef forward(input, context_state, w1, w2):\n    xh = torch.cat((input,\
  \ context_state), 1)\n    context_state = torch.tanh(xh.mm(w1))\n    out = context_state.mm(w2)\n\
  \    return out, context_state\n```\n\n**步骤 5：开始训练程序**\n```python\nfor i in range(epochs):\n\
  \    total_loss = 0\n    context_state = Variable(torch.zeros(1, hidden_size))\n\
  \    for j in range(seq_length):\n        input = x[j:j+1]\n        target = y[j:j+1]\n\
  \        pred, context_state = forward(input, context_state, w1, w2)\n        loss\
  \ = (pred - target).pow(2).sum()\n        total_loss += loss\n    loss.backward()\n\
  \    w1.data -= lr * w1.grad.data\n    w2.data -= lr * w2.grad.data\n    w1.grad.data.zero_()\n\
  \    w2.grad.data.zero_()\n    if i % 10 == 0:\n        print(\"Epoch: {} loss {}\"\
  .format(i, total_loss.data[0]))\n```\n\n**步骤 6：绘制正弦波**\n```python\ncontext_state\
  \ = Variable(torch.zeros(1, hidden_size))\npredictions = []\nfor i in range(seq_length):\n\
  \    input = x[i:i+1]\n    pred, context_state = forward(input, context_state, w1,\
  \ w2)\n    context_state = context_state\n    predictions.append(pred.data.numpy().ravel()[0])\n\
  \nplt.scatter(time_steps[:-1], x.data.numpy(), s=90, label=\"Actual\")\nplt.scatter(time_steps[1:],\
  \ predictions, label=\"Predicted\")\nplt.legend()\nplt.show()\n```\n上述过程的输出如下 −\
  \ \n\n![Sine Wave](img/image1272.jpg)\n\n### PyTorch - 数据集 (Datasets)\n在本章中，我们将更多地关注\
  \ `torchvision.datasets` 及其各种类型。PyTorch 包含以下数据集加载器：\n\n*   MNIST\n*   COCO (字幕与检测)\n\
  \n数据集主要包含以下两种类型的函数：\n\n*   `Transform`：一个接收图像并返回其标准内容修改版本的的函数。这些转换可以组合在一起。\n*  \
  \ `Target_transform`：一个接收目标并对其进行转换的函数。例如，接收字幕字符串并返回单词索引的张量。\n\n\n\n\n# MNIST\n以下是\
  \ `MNIST` `dataset` − `dset` 的示例代码。`MNIST(root, train=TRUE, transform=NONE, target_transform=None,\
  \ download=FALSE)` 的参数如下 −\n\n*   `root` — 存储处理后数据的根目录。\n*   `train` — `True` =\
  \ 训练集，`False` = 测试集。\n*   `download` — `True` = 从互联网下载数据集并放入 `root` 中。\n\n# COCO\n\
  这需要安装 `COCO` API。以下示例演示了如何使用 PyTorch 实现 `COCO` 数据集 −\n\n```python\nimport torchvision.dataset\
  \ as dset\nimport torchvision.transforms as transforms\ncap = dset.CocoCaptions(root='dir\
  \ where images are', annFile='json annotation file', transform=transforms.ToTensor())\n\
  print (' Number of samples: ', len(cap))\nprint (target)\n```\n\n获取的输出如下 −\nNumber\
  \ of samples: 82783\nImage Size: (3L, 427L, 640L)\n\n# PyTorch - 卷积网络简介\n卷积网络主要是关于从零开始构建\
  \ `CNN` 模型。网络架构包含以下步骤的组合 −\n\n*   `Conv2d`\n*   `MaxPool2d`\n*   `Rectified Linear\
  \ Unit`（线性整流单元）\n*   `View`\n*   `Linear Layer`（线性层）\n\n# 训练模型\n训练模型的过程与图像分类问题相同。以下代码片段完成了在提供的数据集上训练模型\
  \ −\n\n```python\ndef fit(epoch, model, data_loader, phase='training', volatile=False):\n\
  \    if phase == 'training':\n        model.train()\n    if phase == 'training':\n\
  \        model.train()\n    if phase == 'validation':\n        model.eval()\n  \
  \  volatile = True\n    running_loss = 0.0\n    running_correct = 0\n    for batch_idx,\
  \ (data, target) in enumerate(data_loader):\n        if is_cuda:\n            data,\
  \ target = data.cuda(), target.cuda()\n        data, target = Variable(data, volatile),\
  \ Variable(target)\n        if phase == 'training':\n            optimizer.zero_grad()\n\
  \            output = model(data)\n            loss = F.nll_loss(output, target)\n\
  \            running_loss += F.nll_loss(output, target, size_average=False).data[0]\n\
  \        preds = output.data.max(dim=1, keepdim=True)[1]\n        running_correct\
  \ += preds.eq(target.data.view_as(preds)).cpu().sum()\n        if phase == 'training':\n\
  \            loss.backward()\n            optimizer.step()\n        loss = running_loss/len(data_loader.dataset)\n\
  \        accuracy = 100.*running_correct/len(data_loader.dataset)\n        print(f'{phase}\
  \ loss is {loss:5.2f} and {phase} accuracy is {running_correct}/{len(data_loader.dataset)}{accuracy:.2f}')\n\
  \    return loss,accuracy\n```\n\n该方法包含了训练和验证的逻辑逻辑。使用不同模式有两个主要原因 −\n\n*   在 `train`\
  \ 模式下，`dropout` 会移除一定比例的值，这在验证或测试阶段是不应该发生的。\n*   对于 `training` 模式，我们会计算梯度并改变模型的参数值，但是。\n\
  \n# PyTorch - 训练卷积网络\n在本章中，我们将重点关注从零开始创建一个卷积网络。\n\n### Step 1 \n创建一个带有参数的必要类。参数包括随机值。\n\
  \n```python\nclass NeuralNetwork(nn.Module):\n    def __init__(self):\n        super(NeuralNetwork,\
  \ self).__init__()\n        self.inputSize = 2\n        self.hiddenSize = 3\n  \
  \      self.outputSize = 1\n        self.fc1 = nn.Linear(self.inputSize, self.hiddenSize)\n\
  \        self.fc2 = nn.Linear(self.hiddenSize, self.outputSize)\n```\n\n### Step\
  \ 2 \n创建一个带有 sigmoid 的前传播函数。\n\n```python\ndef forward(self, x):\n    l1 = F.relu(self.fc1(x))\n\
  \    l2 = torch.sigmoid(self.fc2(l1))\n    return l2\n```\n\n### Step 3 \n按照如下所示创建训练和预测\
  \ −\n\n```python\ndef save(model, path):\n    # 实现保存逻辑\n    torch.save(model.state_dict(),\
  \ path)\n\ndef load(model, path):\n    # 实现加载逻辑\n    model.load_state_dict(torch.load(path))\n\
  ```\n\n# PyTorch - 特征提取\n卷积网络包含一个主要特征。为了获得传统神经网络可视化的完美效果，需要执行以下步骤。\n\n### Step 1\
  \ \n导入相应的模型以创建特征。\n\n```python\nimport torch\nimport torch.nn as nn\nfrom torchvision\
  \ import models\n```\n\n### Step 2 \n创建一个特征提取器类。\n\n```python\ncnn = nn.Sequential(\n\
  \    nn.Conv2d(1, 10, kernel_size=5),\n    nn.ReLU(),\n    nn.MaxPool2d(2),\n  \
  \  nn.Conv2d(10, 20, kernel_size=5),\n    nn.ReLU(),\n    nn.MaxPool2d(2),\n   \
  \ nn.Flatten(),\n    nn.Linear(20 * 4 * 4, 10)\n    nn.ReLU(),\n    nn.Linear(10,\
  \ 2)\n)\n\nclass Feature_extractor(nn.Module):\n    def __init__(self):\n      \
  \  super(Feature_extractor, self).__init__()\n        self.cnn = cnn\n    def forward(self,\
  \ input):\n        return self.cnn(input)\n```\n\n# PyTorch - 卷积网络可视化\n在本章中，我们将重点通过卷积网络来实现数据可视化模型。\n\
