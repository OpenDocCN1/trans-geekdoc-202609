  fmt: "\nLet us understand each of these terminologies in detail.\n\n### Local Respective\
    \ Fields\nCNN utilize spatial correlations that exists within the input data.\
    \ Each in the concurrent layers of neural networks connects of some input neurons.\
    \ This specific region is called `Local Receptive Field`. It only focusses on\
    \ hidden neurons. The hidden neuron will process the input data inside the mentioned\
    \ field not realizing the changes outside the specific boundary. The diagram representation\
    \ of generating local respective fields is mentioned below − \n\n![Local Respective\
    \ Fields](image1069.jpg)\n\n### Convolution\nIn the above figure, we observe that\
    \ each connection learns a weight of hidden neuron with an associated connection\
    \ with movement from one layer to another. Here, individual neurons perform a\
    \ shift from time to time. This process is called “convolution”. The mapping of\
    \ connections from the input layer to the hidden feature map is defined as “shared\
    \ weights” and bias included is called “shared bias”.\n\n### Pooling\nConvolutional\
    \ neural networks use pooling layers which are positioned immediately after CNN\
    \ declaration. It takes the input from the user as a feature map which comes out\
    \ convolutional networks and prepares a condensed feature map. Pooling layers\
    \ help in creating layers with neurons of previous layers.\n\n### Implementation\
    \ of PyTorch\nFollowing steps are used to create a Convolutional Neural Network\
    \ using PyTorch.\n\n**Step 1: Import the necessary packages for creating a simple\
    \ neural network.**\n```python\nfrom torch.autograd import Variable\nimport torch.nn.functional\
    \ as F\n```\n\n**Step 2: Create a class with batch representation of convolutional\
    \ neural network.** Our batch shape for input `x` is with dimension of (3, 32,\
    \ 32).\n```python\nclass SimpleCNN (torch.nn.Module):\n    def __init__(self):\n\
    \        super(SimpleCNN, self).__init__()\n        #Input channels = 3, output\
    \ channels = 18\n        self.conv1 = torch.nn.Conv2d(3, 18, kernel_size=3, stride=1,\
    \ padding=1)\n        self.pool = torch.nn.MaxPool2d(kernel_size=2, stride=2,\
    \ padding=0)\n        # 4608 input features, 64 output features (see sizing flow\
    \ below)\n        self.fc1 = torch.nn.Linear(18 * 16 * 16, 64)\n        # 64 input\
    \ features, 10 output features for our 10 defined classes\n        self.fc2 =\
    \ torch.nn.Linear(64, 10)\n```\n\n**Step 3: Compute the activation of the first\
    \ convolution** size changes from (3, 32, 32) to (18, 32, 32). Size of the dimension\
    \ changes from (18, 32, 32) to (18, 16, 16). Reshape data dimension of the input\
    \ layer of the neural net due to which size changes from (18, 16, 16) to (1, 4608).\
    \ Recall that `-1` infers this dimension from the other given dimension.\n```python\n\
    def forward(self, x):\n    x = F.relu(self.conv1(x))\n    x = self.pool(x)\n \
    \   x = x.view(-1, 18 * 16 * 16)\n    x = F.relu(self.fc1(x))\n    #Computes the\
    \ second fully connected layer (activation applied later)\n    #Size changes from\
    \ (1, 64) to (1, 10)\n    x = self.fc2(x)\n    return (x)\n```\n\n### PyTorch\
    \ - Recurrent Neural Network\nRecurrent neural networks is one type of deep learning-oriented\
    \ algorithm which follows a sequential approach. In neural networks, we always\
    \ assume that each input and output is independent of all other layers. These\
    \ type of neural networks are called recurrent because they perform mathematical\
    \ computations in a sequential manner completing one task after another. The diagram\
    \ below specifies the complete approach and working of recurrent neural networks\
    \ − \n\n![Recurrent Neural Networks Ex](image1138.jpg)\n\nIn the above figure,\
    \ `c1`, `c2`, `c3` and `x1` are considered as inputs which includes some hidden\
    \ input values namely `h1`, `h2` and `h3` delivering the respective output of\
    \ `o1`. We will now focus on implementing PyTorch to create a sine wave with the\
    \ help of recurrent neural networks. During training, we will follow a training\
    \ approach to our model with one data point at a time. The input sequence `x`\
    \ consists of 20 data points, and the target sequence is considered to be same\
    \ as the input sequence.\n\n**Step 1: Import the necessary packages for implementing\
    \ recurrent neural networks using the below code −**\n```python\nimport torch\n\
    from torch.autograd import Variable\nimport numpy as np\nimport matplotlib.pyplot\
    \ as plt\nimport torch.nn as nn\nimport torch.nn.functional as F\nimport torch.optim\
    \ as optim\n```\n\n**Step 2: We will set hyperparameters**\n```python\ninput_size\
    \ = 7\nhidden_size = 6\noutput_size = 1\nepochs = 300\nlr = 0.1\nseq_length =\
    \ 20\ntime_steps = np.linspace(0, 2*np.pi, seq_length)\nx = np.sin(time_steps)\n\
    y = x\nx = Variable(torch.FloatTensor(x).view(-1, 1))\ny = Variable(torch.FloatTensor(y).view(-1,\
    \ 1))\n```\n\n**Step 3: Weights initialized using normal distribution**\n```python\n\
    w1 = Variable(torch.randn(input_size, hidden_size))\nw2 = Variable(torch.randn(hidden_size,\
    \ output_size))\n```\n\n**Step 4: Create a function for feed forward**\n```python\n\
    def forward(input, context_state, w1, w2):\n    xh = torch.cat((input, context_state),\
    \ 1)\n    context_state = torch.tanh(xh.mm(w1))\n    out = context_state.mm(w2)\n\
    \    return out, context_state\n```\n\n**Step 5: Start training procedure**\n\
    ```python\nfor i in range(epochs):\n    total_loss = 0\n    context_state = Variable(torch.zeros(1,\
    \ hidden_size))\n    for j in range(seq_length):\n        input = x[j:j+1]\n \
    \       target = y[j:j+1]\n        pred, context_state = forward(input, context_state,\
    \ w1, w2)\n        loss = (pred - target).pow(2).sum()/2\n        total_loss +=\
    \ loss\n    loss.backward()\n    w1.data -= lr * w1.grad.data\n    w2.data -=\
    \ lr * w2.grad.data\n    w1.grad.data.zero_()\n    w2.grad.data.zero_()\n    if\
    \ i % 10 == 0:\n        print(\"Epoch: {} loss {}\".format(i, total_loss.data[0]))\n\
    ```\n\n**Step 6: Plot the sine wave**\n```python\ncontext_state = Variable(torch.zeros(1,\
    \ hidden_size))\npredictions = []\nfor i in range(seq_length):\n    input = x[i:i+1]\n\
    \    pred, context_state = forward(input, context_state, w1, w2)\n    context_state\
    \ = context_state\n    predictions.append(pred.data.numpy().ravel()[0])\n\nplt.scatter(time_steps[:-1],\
    \ x.data.numpy(), s=90, label=\"Actual\")\nplt.scatter(time_steps[1:], predictions,\
    \ label=\"Predicted\")\nplt.legend()\nplt.show()\n```\nThe output for the above\
    \ process is as follows − \n\n![Sine Wave](image1272.jpg)\n\n### PyTorch - Datasets\n\
    In this chapter, we will focus more on `torchvision.datasets` and its various\
    \ types. PyTorch includes following dataset loaders −\n\n*   MNIST\n*   COCO (Captioning\
    \ and Detection)\n\nDataset includes majority of two types of functions given\
    \ below −\n\n*   `Transform`: a function that takes in an image and returns a\
    \ modified version of standard stuff. These can be composed together with transforms.\n\
    *   `Target_transform`: a function that takes the target and transforms it. For\
    \ example, takes in the caption string and returns a tensor of world indices.\n"
  trans: "\n让我们详细理解其中的每一个术语。\n\n### 局部感受野 (Local Respective Fields)\nCNN 利用输入数据中存在的空间相关性。神经网络并发层中的每一层都连接某些输入神经元。这个特定区域被称为\
    \ `Local Receptive Field`（局部感受野）。它只关注隐藏神经元。隐藏神经元将处理上述区域内的输入数据，而不会感知到特定边界之外的变化。生成局部感受野的图示如下所示\
    \ − \n\n![Local Respective Fields](img/image1069.jpg)\n\n### 卷积 (Convolution)\n\
    在上面的图中，我们观察到每个连接都学习了隐藏神经元的权重，该权重与从一层到另一层的移动连接相关联。在这里，单个神经元不时地执行位移。这个过程被称为“卷积”。从输入层到隐藏特征图的连接映射定义为“共享权重”（shared\
    \ weights），包含的偏置则称为“共享偏置”（shared bias）。\n\n### 池化 (Pooling)\n卷积神经网络使用池化层，这些层紧位于\
    \ CNN 声明之后。它将用户的输入作为卷积网络输出的特征图，并准备一个压缩的特征图。池化层有助于创建具有前一层神经元的后续层。\n\n### PyTorch\
    \ 的实现 (Implementation of PyTorch)\n使用以下步骤通过 PyTorch 创建卷积神经网络。\n\n**步骤 1：导入创建简单神经网络所需的包。**\n\
    ```python\nfrom torch.autograd import Variable\nimport torch.nn.functional as\
    \ F\n```\n\n**步骤 2：创建一个带有卷积神经网络批处理表示的类。** 我们的输入 `x` 的批处理形状维度为 (3, 32, 32)。\n```python\n\
    class SimpleCNN (torch.nn.Module):\n    def __init__(self):\n        super(SimpleCNN,\
    \ self).__init__()\n        #输入通道 = 3, 输出通道 = 18\n        self.conv1 = torch.nn.Conv2d(3,\
    \ 18, kernel_size=3, stride=1, padding=1)\n        self.pool = torch.nn.MaxPool2d(kernel_size=2,\
    \ stride=2, padding=0)\n        # 4608 个输入特征，64 个输出特征（见下方的尺寸流程）\n        self.fc1\
    \ = torch.nn.Linear(18 * 16 * 16, 64)\n        # 64 个输入特征，对于我们定义的 10 类输出 10 个\n\
    \        self.fc2 = torch.nn.Linear(64, 10)\n```\n\n**步骤 3：计算第一次卷积的激活** 尺寸从 (3,\
    \ 32, 32) 变为 (18, 32, 32)。维度尺寸从 (18, 32, 32) 变为 (18, 16, 16)。由于重塑神经网络输入层的数据维度，尺寸从\
    \ (18, 16, 16) 变为 (1, 4608)。请记住 `-1` 会从其他给定的维度推导出此维度。\n```python\ndef forward(self,\
    \ x):\n    x = F.relu(self.conv1(x))\n    x = self.pool(x)\n    x = x.view(-1,\
    \ 18 * 16 * 16)\n    x = F.relu(self.fc1(x))\n    # 计算第二个全连接层（激活稍后应用）\n    # 尺寸从\
    \ (1, 64) 变为 (1, 10)\n    x = self.fc2(x)\n    return (x)\n```\n\n### PyTorch\
    \ - 循环神经网络 (Recurrent Neural Network)\n循环神经网络是一种面向深度学习的算法类型，它遵循顺序方法。在神经网络中，我们总是假设每个输入和输出都与所有其他层相互独立。这类神经网络被称为循环网络，是因为它们以顺序的方式进行数学计算，一个接一个地完成任务。下面的图说明了循环神经网络的完整方法和工作原理\
    \ − \n\n![Recurrent Neural Networks Ex](img/image1138.jpg)\n\n在上面的图中，`c1`、`c2`、`c3`\
    \ 和 `x1` 被视为输入，其中了一些隐藏输入值 `h1`、`h2` 和 `h3`，它们提供了 `o1` 的相应输出。我们现在将关注使用 PyTorch\
    \ 来通过循环神经网络创建一个正弦波。在训练期间，我们将遵循训练方法对模型进行一次处理一个数据点的训练。输入序列 `x` 包含 20 个数据点，目标序列被认为与输入序列相同。\n\
    \n**步骤 1：使用以下代码实现循环神经网络所需的包 −**\n```python\nimport torch\nfrom torch.autograd\
    \ import Variable\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport\
    \ torch.nn as nn\nimport torch.nn.functional as F\nimport torch.optim as optim\n\
    ```\n\n**步骤 2：我们将设置超参数**\n```python\ninput_size = 7\nhidden_size = 6\noutput_size\
    \ = 1\nepochs = 300\nlr = 0.1\nseq_length = 20\ntime_steps = np.linspace(0, 2*pi,\
    \ seq_length)\nx = np.sin(time_steps)\ny = x\nx = Variable(torch.FloatTensor(x))\n\
    ```\n\n**步骤 3：使用正态分布初始化权重**\n```python\nw1 = Variable(torch.randn(input_size,\
    \ hidden_size))\nw2 = Variable(torch.randn(hidden_size, output_size))\n```\n\n\
    **步骤 4：创建一个前向传播函数**\n```python\ndef forward(input, context_state, w1, w2):\n \
    \   xh = torch.cat((input, context_state), 1)\n    context_state = torch.tanh(xh.mm(w1))\n\
    \    out = context_state.mm(w2)\n    return out, context_state\n```\n\n**步骤 5：开始训练程序**\n\
    ```python\nfor i in range(epochs):\n    total_loss = 0\n    context_state = Variable(torch.zeros(1,\
    \ hidden_size))\n    for j in range(seq_length):\n        input = x[j:j+1]\n \
    \       target = y[j:j+1]\n        pred, context_state = forward(input, context_state,\
    \ w1, w2)\n        loss = (pred - target).pow(2).sum()\n        total_loss +=\
    \ loss\n    loss.backward()\n    w1.data -= lr * w1.grad.data\n    w2.data -=\
    \ lr * w2.grad.data\n    w1.grad.data.zero_()\n    w2.grad.data.zero_()\n    if\
    \ i % 10 == 0:\n        print(\"Epoch: {} loss {}\".format(i, total_loss.data[0]))\n\
    ```\n\n**步骤 6：绘制正弦波**\n```python\ncontext_state = Variable(torch.zeros(1, hidden_size))\n\
    predictions = []\nfor i in range(seq_length):\n    input = x[i:i+1]\n    pred,\
    \ context_state = forward(input, context_state, w1, w2)\n    context_state = context_state\n\
    \    predictions.append(pred.data.numpy().ravel()[0])\n\nplt.scatter(time_steps[:-1],\
    \ x.data.numpy(), s=90, label=\"Actual\")\nplt.scatter(time_steps[1:], predictions,\
    \ label=\"Predicted\")\nplt.legend()\nplt.show()\n```\n上述过程的输出如下 − \n\n![Sine\
    \ Wave](img/image1272.jpg)\n\n### PyTorch - 数据集 (Datasets)\n在本章中，我们将更多地关注 `torchvision.datasets`\
    \ 及其各种类型。PyTorch 包含以下数据集加载器：\n\n*   MNIST\n*   COCO (字幕与检测)\n\n数据集主要包含以下两种类型的函数：\n\
    \n*   `Transform`：一个接收图像并返回其标准内容修改版本的的函数。这些转换可以组合在一起。\n*   `Target_transform`：一个接收目标并对其进行转换的函数。例如，接收字幕字符串并返回单词索引的张量。\n"
