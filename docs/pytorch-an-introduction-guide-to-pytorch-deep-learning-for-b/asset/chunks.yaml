    \ **Step 6**: Now, you have to go on [https://pytorch.org/](https://pytorch.org/)\
    \ to get the installation command of PyTorch. Here, you have to select your preferred\
    \ PyTorch build, Operating System, Package, Language, and CUDA. It provides you\
    \ two commands to install PyTorch in your windows.\n*   **Step 7**: Next step\
    \ is to run both the command on your command prompt. Remember if you make any\
    \ changes in this command, it will not install PyTorch and give an error message.\n\
    \n    ```bash\n    pip3 install https://download.pytorch.org/whl/cpu/torch-1.1.0-cp35-cp35m-win_amd64.whl\n\
    \    ```\n    ![Installation on Windows using Pip](image350.jpg)\n\n    ```bash\n\
    \    pip3 install https://download.pytorch.org/whl/cpu/torchvision-0.3.0-cp35-cp35m-win_amd64.whl\n\
    \    ```\n    ![Installation on Windows using Pip](image357.jpg)\n*   **Step 8**:\
    \ Now, rerun `pip list` command to check PyTorch is run successfully or not.\n\
    \    ![Installation on Windows using Pip](image364.jpg)\n*   **Step 9**: Now,\
    \ test PyTorch. Run `python` command to work with python. Import `torch` to work\
    \ with PyTorch and perform the operation.\n    ![Installation on Windows using\
    \ Pip](image371.jpg)\n\n#### Installation on Windows using Conda\n\nThis tutorial\
