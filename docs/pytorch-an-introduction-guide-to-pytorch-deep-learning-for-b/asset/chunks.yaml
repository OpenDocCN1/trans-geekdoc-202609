    \ edges will be functions that produce output Tensors from input Tensors. PyTorch\
    \ Tensors can be created as variable objects where a variable represents a node\
    \ in computational graph. Dynamic Graphs Static graphs are nice because user can\
    \ optimize the graph up front. If programmers are re-using same graph over and\
    \ over, then this potentially costly up-front optimization can be maintained as\
    \ the same graph is rerun over and over. The major difference between them is\
    \ that Tensor Flow’s computational graphs are static and PyTorch uses dynamic\
    \ computational graphs. Optim Package The optim package in PyTorch abstracts the\
