    # PyTorch 入学者教程


    `PyTorch` 是基于 `Torch` 库的计算机软件的一个部分。它是由 `Facebook` 引入的一个深度学习框架。`PyTorch` 是一个用于
    `Python` 编程语言的机器学习库，用于`自然语言处理`等应用。`PyTorch` 提供的高级特性如下：


    1. 在`图形处理器` (`GPU`) 的帮助下，它提供了具有强力加速的张量计算。

    2. 它提供了基于胶带式（tape-based）自动微分系统的`深度神经网络`。


    `PyTorch` 的开发是为了在实现和构建`深度学习神经网络`时提供高度的灵活性和速度。正如你所知道的，它是一个 `Python` 编程语言的机器学习库，因此安装、运行和理解它非常简单。`Pytorch`
    是完全 Python 化的（使用广泛采用的 `python` 习语而不是编写 `Java` 和 `C++` 代码），因此它可以快速成功地构建`神经网络模型`。


    ## PyTorch 历史


    `PyTorch` 发布于 2016 年。越来越多的研究人员愿意采用 `PyTorch`。它由 `Facebook` 运营。`Facebook` 还运营 `Caffe2`
    (`用于快速特征嵌入的卷积架构`）。将 `PyTorch` 定义的模型转换为 `Caffe2` 是具有挑战性的。为了这一目的，`Facebook` 和 `Microsoft`
    在 `2017 年 9 月` 发明了`开放神经网络交换` (`ONNX`)。


    简单来说，`ONNX` 的开发是为了在不同框架之间转换模型。`Caffe2` 已于 2018 年 3 月合并到 `PyTorch`。`PyTorch` 使得构建极其复杂的神经网络变得容易。这一特性使其迅速成为首选库。在研究工作中，它与
    `TensorFlow` 形成了激烈的竞争。


    `PyTorch` 的发明者想要创建一个高度命令式的库，可以轻松运行所有的数值计算，最终，他们发明了 `PyTorch`。对于深度学习科学家、机器学习开发人员和神经网络调试器来说，实时运行和测试部分代码是一个巨大的挑战。`PyTorch`
    完成了这一挑战，允许他们实时运行和测试代码。因此，他们不需要等待检查它是否有效。


    ## 教程信息


    ### 本教程面向的对象

    本教程是为专注于机器学习算法以及自然语言处理系统的研发的 `python` 开发者准备的。本教程的目标是完整描述 `PyTorch` 的所有概念以及相应的现实示例。


    ### 先决条件

    在继续本教程之前，你需要具备 `Python` 和 `Anaconda` 框架的知识（`Anaconda` 中的命令）。具有人工智能概念知识将是一个额外的优势。


