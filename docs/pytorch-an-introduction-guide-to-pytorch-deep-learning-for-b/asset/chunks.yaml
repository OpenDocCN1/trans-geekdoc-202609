  fmt: "\n# PyTorch - Sequence Processing with Convents\n\nIn this chapter, we propose\
    \ an alternative approach which instead relies on a single 2D convolutional neural\
    \ network across both sequences. Each layer of our network re-codes source tokens\
    \ on the basis of the output sequence produced so far. Attention-like properties\
    \ are therefore pervasive throughout the network. Here, we will focus on creating\
    \ the sequential network with specific pooling from the values included in dataset\
    \ . This process is also best applied in “Image Recognition Module”.\n\n![Sequential\
    \ Network](image1636.jpg)\n\nFollowing steps are used to create a sequence processing\
    \ model with convents using PyTorch −\n\n### Step 1: Import the necessary modules\
    \ for performance of sequence processing using convents.\n\n```python\nimport\
    \ keras\nfrom keras. datasets import mnist\nfrom keras.models import Sequential\n\
    from keras.layers import Dense , Dropout , Flatten\nfrom keras.layers import Conv2D\
    \ , MaxPooling2D\nimport numpy as np\n```\n\n### Step 2: Perform the necessary\
    \ operations to create a pattern in respective sequence using the below code −\n\
    \n```python\nbatch_size = 128\nnum_classes = 10\nepochs = 12\n# input image dimensions\n\
    img_rows, img_cols = 28 , 28\n# the data, split between train and test sets\n\
    (x_train, y_train), (x_test, y_test) = mnist.load_data()\nx_train = x_train.reshape(\
    \ 60000 , 28 , 28 , 1 )\nx_test = x_test.reshape( 10000 , 28 , 28 , 1 )\nprint\
    \ ( 'x_train shape:' , x_train.shape)\nprint ( x_train.shape[0], 'train samples'\
    \ )\nprint ( x_test.shape[0], 'test samples' )\ny_train = keras.utils.to_categorical(\
    \ y_train, num_classes)\ny_test = keras.utils.to_categorical( y_test, num_classes)\n\
    ```\n\n### Step 3: Compile the model and fit the pattern in the mentioned conventional\
    \ neural network model as shown below −\n\n```python\nmodel.compile(loss = keras.losses.categorical_crossentropy,\
    \ optimizer = keras.optimizers.Adadelta(), metrics = ['accuracy'])\nmodel.fit(x_train,\
    \ y_train, batch_size = batch_size, epochs = epochs, verbose = 1, validation_data\
    \ = (x_test, y_test))\nscore = model.evaluate(x_test, y_test, verbose = 0)\nprint('Test\
    \ loss:', score[0])\nprint('Test accuracy:', score[1])\n```\n\nThe output generated\
    \ is as follows −\n\n![Neural network model](image1702.jpg)\n\n# PyTorch - Word\
    \ Embedding\n\nIn this chapter, we will understand the famous word embedding model\
    \ − word2vec. Word2vec model is used to produce word embedding with the help of\
    \ group of related models. Word2vec model is implemented with pure C-code and\
    \ the gradient are computed manually. The implementation of word2vec model in\
    \ PyTorch is explained in the below steps −\n\n### Step 1: Implement the libraries\
    \ in word embedding as mentioned below −\n\n```python\nimport torch\nfrom torch.autograd\
    \ import Variable\nimport torch.nn as nn\nimport torch.nn.functional as F\n```\n\
    \n### Step 2: Implement the Skip Gram Model of word embedding with the class called\
    \ word2vec. It includes `emb_size`, `emb_dimension`, `u_embedding`, `v_embedding`\
    \ type of attributes.\n\n```python\nclass SkipGramModel (nn.Module):\n    def\
    \ __init__(self, emb_size, emb_dimension):\n        super(SkipGramModel, self).__init__()\n\
    \        self.emb_size = emb_size\n        self.emb_dimension = emb_dimension\n\
    \        self.u_embeddings = nn.Embedding(emb_size, emb_dimension, sparse=True)\n\
    \        self.v_embeddings = nn.Embedding(emb_size, emb_dimension, sparse=True)\n\
    \        self.init_emb()\n\n    def init_emb(self):\n        initrange = 0.5 /\
    \ self.emb_dimension\n        self.u_embeddings.weight.data.uniform_(-initrange,\
    \ initrange)\n        self.v_embeddings.weight.data.uniform_(-0, 0)\n\n    def\
    \ forward(self, pos_u, pos_v, neg_v):\n        emb_u = self.u_embeddings(pos_u)\n\
    \        emb_v = self.v_embeddings(pos_v)\n        score = torch.mul(emb_u, emb_v).squeeze()\n\
    \        score = torch.sum(score, dim=1)\n        score = F.logsigmoid(score)\n\
    \        neg_emb_v = self.v_embeddings(neg_v)\n        neg_score = torch.bmm(neg_emb_v,\
    \ emb_u.unsqueeze(2)).squeeze()\n        neg_score = F.logsigmoid(-1 * neg_score)\n\
    \        return -1 * (torch.sum(score) + torch.sum(neg_score))\n\n    def save_embedding(self,\
    \ id2word, file_name, use_cuda):\n        if use_cuda:\n            embedding\
    \ = self.u_embeddings.weight.cpu().data.numpy()\n        else:\n            embedding\
    \ = self.u_embeddings.weight.data.numpy()\n        fout = open(file_name, 'w')\n\
    \        fout.write('%d %d\\n' % (len(id2word), self.emb_dimension))\n       \
    \ for wid, w in id2word.items():\n            e = embedding[wid]\n           \
    \ e = ' '.join(map(lambda x: str(x), e))\n            fout.write('%s %s\\n' %\
    \ (w, e))\n\n    def test():\n        model = SkipGramModel(100, 100)\n      \
    \  id2word = dict()\n        for i in range(100):\n            id2word[i] = str(i)\n\
    \        model.save_embedding(id2word)\n```\n\n### Step 3: Implement the main\
    \ method to get the word embedding displayed in proper way.\n\n```python\nif __name__\
    \ == '__main__':\n    test()\n```\n\n# PyTorch - Recursive Neural Networks\n\n\
    Deep neural networks have an exclusive feature for enabling breakthroughs in machine\
    \ learning understanding the process of natural language. It is observed that\
    \ most of these models treat language as a flat sequence of words or characters,\
    \ and use a kind of model which is referred as recurrent neural network or RNN.\
    \ Many researchers come to a conclusion that language is best understood with\
    \ respect to hierarchical tree of phrases. This type is included in recursive\
    \ neural networks that take a specific structure into account. PyTorch has a specific\
