    *   **步骤 2**：在第二步中，你需要在命令行提示符上通过 `easy_install.exe pip` 命令根据你需要的版本安装 `pip`。一旦完成依赖项的处理，你会自动返回\
    \ `Scripts` 文件夹。\n    ![PyTorch 安装](img/image301.jpg)\n*   **步骤 3**：现在，你的下一步是为\
    \ `pip` 安装 python 的 `numpy` 包。Numpy 的安装将通过 `pip install numpy` 命令完成。如果你的 python\
    \ 已经有了此包，它将显示 \"Requirement already satisfied\"，否则它将安装该包。使用 `pip list` 命令用于检查安装包。\n\
    \    ![使用 Pip 在 Windows 上安装](img/image310.jpg)\n    下载完成后，它会显示成功消息并将光标带回 scripts\
    \ 文件夹。\n*   **步骤 4**：下一步是使用 `pip install scipy` 安装安装 另一个包 `scipy`。\n    ![使用 Pip\
    \ 在 Windows 上安装](img/image319.jpg)\n    下载完成后，你的光标会回到 scripts 文件夹。\n    ![使用 Pip\
