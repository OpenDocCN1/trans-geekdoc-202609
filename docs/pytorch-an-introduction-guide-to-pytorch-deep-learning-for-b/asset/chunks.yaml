    # PyTorch Tutorial For Beginners


    `PyTorch` is a small part of a computer software which is based on `Torch` library.
    It is a Deep Learning framework introduced by `Facebook`. `PyTorch` is a Machine
    Learning Library for `Python` programming language which is used for applications
    such as `Natural Language Processing`. The high-level features which are provided
    by `PyTorch` are as follows:


    1. With the help of the `Graphics Processing Unit` (`GPU`), it gives tensor computing
    with strong acceleration.

    2. It provides `Deep Neural Network` which is built on a tape-based auto diff
    system.


    `PyTorch` was developed to provide high flexibility and speed during implementing
    and building the `Deep Learning Neural Network`. As you already know, it is a
    machine learning library for `Python` programming language, so it''s quite simple
    to install, run, and understand. `Pytorch` is completely pythonic (using widely
    adopted `python` idioms rather than writing `Java` and `C++` code) so that it
    can quickly build a `Neural Network Model` successfully.


    ## History of PyTorch


    `PyTorch` was released in 2016. Many researchers are willing to adopt `PyTorch`
    increasingly. It was operated by `Facebook`. `Facebook` also operates `Caffe2`
    (`Convolutional Architecture for Fast Feature Embedding`). It is challenging to
    transform a `PyTorch`-defined model into `Caffe2`. For this purpose, `Facebook`
    and `Microsoft` invented an `Open Neural Network Exchange` (`ONNX`) in `September2017`
    (September 2017).


    In simple words, `ONNX` was developed for converting models between frameworks.
    `Caffe2` was merged in March 2018 into `PyTorch`. `PyTorch` makes ease in building
    an extremely complex neural network. This feature has quickly made it a go-to
    library. In research work, it gives a tough competition to `TensorFlow`.


    Inventors of `PyTorch` wants to make a highly imperative library which can easily
    run all the numerical computation, and finally, they invented `PyTorch`. There
    was a big challenge for Deep learning scientist, Machine learning developer, and
    Neural Network debuggers to run and test part of the code in real-time. `PyTorch`
    completes this challenge and allows them to run and test their code in real-time.
    So they don''t have to wait to check whether it works or not.


    ## Tutorial Information


    ### To whom this tutorial is designed for

    This tutorial has been prepared for `python` developers who focus on research
    and development with machine learning algorithms along with natural language processing
    system. The aim of this tutorial is to completely describe all concepts of `PyTorch`
    and realworld examples of the same.


    ### Prerequisites

    Before proceeding with this tutorial, you need knowledge of `Python` and `Anaconda`
    framework (commands used in `Anaconda`). Having knowledge of artificial intelligence
    concepts will be an added advantage.


