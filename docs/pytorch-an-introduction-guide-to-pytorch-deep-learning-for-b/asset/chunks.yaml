  fmt: "\n# PyTorch - Terminologies\n\nIn this chapter, we will discuss some of the\
    \ most commonly used terms in PyTorch.\n\n## PyTorch NumPy\nA `PyTorch` tensor\
    \ is identical to a `NumPy` array. A `tensor` is an n-dimensional array and with\
    \ respect to `PyTorch`, it provides many functions to operate on these tensors.\
    \ `PyTorch` tensors usually utilize GPUs to accelerate their numeric computations.\
    \ These tensors which are created in `PyTorch` can be used to fit a two-layer\
    \ network to random data. The user can manually implement the forward and backward\
    \ passes through the network.\n\n### Variables and Autograd\nWhen using `autograd`,\
    \ the forward pass of your network will define a computational graph — nodes in\
    \ the graph will be `Tensors`, and edges will be functions that produce output\
    \ `Tensors` from input `Tensors`. `PyTorch` Tensors can be created as variable\
    \ objects where a variable represents a node in computational graph.\n\n### Dynamic\
    \ Graphs\nStatic graphs are nice because user can optimize the graph up front.\
    \ If programmers are re-using same graph over and over, then this potentially\
    \ costly up-front optimization can be maintained as the same graph is rerun over\
    \ and over. The major difference between them is that `Tensor Flow`’s computational\
    \ graphs are static and `PyTorch` uses dynamic computational graphs.\n\n### Optim\
    \ Package\nThe `optim` package in `PyTorch` abstracts the idea of an optimization\
    \ algorithm which is implemented in many ways and provides illustrations of commonly\
    \ used optimization algorithms. This can be called within the import statement.\n\
    \n### Multiprocessing\nMultiprocessing supports the same operations, so that all\
    \ tensors work on multiple processors. The queue will have their data moved into\
    \ shared memory and will only send a handle to another process.\n\n# PyTorch -\
    \ Loading Data\n`PyTorch` includes a package called `torchvision` which is used\
    \ to load and prepare the dataset. It includes two basic functions namely `Dataset`\
    \ and `DataLoader` which helps in transformation and loading of dataset.\n\n###\
    \ Dataset\n`Dataset` is used to read and transform a datapoint from the given\
    \ dataset. The basic syntax to implement is mentioned below −\n```\ntrainset =\
    \ torchvision.datasets.CIFAR10(root='./data', train=True, download=True, transform=transform)\n\
    ```\n\n### DataLoader\n`DataLoader` is used to shuffle and batch data. It can\
    \ be used to load the data in parallel with multiprocessing workers.\n```\ntrainloader\
    \ = torch.utils.data.DataLoader(trainset, batch_size=4, shuffle=True, num_workers=2)\n\
    ```\n\n### Example: Loading CSV File\nWe use the Python package `Panda` to load\
    \ the csv file. The original file has the following format: (image name, 68 landmarks\
    \ - each landmark has a x, y coordinates).\n```python\nlandmarks_frame = pd.read_csv('faces/face_landmarks.csv')\n\
    n = 65\nimg_name = landmarks_frame.iloc[n, 0]\nlandmarks = landmarks_frame.iloc[n,\
    \ 1:].as_matrix()\nlandmarks = landmarks.astype('float').reshape(-1, 2)\n```\n\
    \n# PyTorch - Linear Regression \nIn this chapter, we will be focusing on basic\
    \ example of linear regression implementation using `TensorFlow`. Logistic regression\
    \ or linear regression is a supervised machine learning approach for the classification\
    \ of order discrete categories. Our goal in this chapter is to build a model by\
    \ which a user can predict the relationship between predictor variables and one\
    \ or more independent variables. The relationship between these two variables\
    \ is considered linear i.e., if `y` is the dependent variable and `x` is considered\
    \ as the independent variable, then the linear regression relationship of two\
    \ variables will look like the equation which is mentioned as below −\n`Y = Ax+b`\n\
    \nNext, we shall design an algorithm for linear regression which allows us to\
    \ understand two important concepts given below −\n* Cost Function\n* Gradient\
    \ Descent Algorithms\n\nThe schematic representation of linear regression is mentioned\
    \ below Interpreting the result `Y=ax+b`\n\n* The value of `a` is the slope.\n\
    * The value of `b` is the y − intercept .\n* `r` is the correlation coefficient\
    \ .\n* `r 2` is the correlation coefficient .\n\nThe graphical view of the equation\
    \ of linear regression is mentioned below −\n![Interpreting result](image903.jpg)\n\
    \nFollowing steps are used for implementing linear regression using `PyTorch`\
    \ −\n\n### Step 1\nImport the necessary packages for creating a linear regression\
    \ in `PyTorch` using the below code −\n```python\nimport numpy as np\nimport matplotlib.pyplot\
    \ as plt\nfrom matplotlib.animation import FuncAnimation\nimport seaborn as sns\n\
    import pandas as pd\n% matplotlib inline\nsns.set_style(style='whitegrid')\nplt.rcParams[\"\
    patch.force_edgecolor\"] = True\n```\n\n### Step 2\nCreate a single training set\
    \ with the available data set as shown below −\n```python\nm = 2 # slope\nc =\
    \ 3 # intercept\nx = np.random.rand(256)\nnoise = np.random.randn(256) / 4\ny\
    \ = x * m + c + noise\ndf = pd.DataFrame()\ndf['x'] = x\ndf['y'] = y\nsns.lmplot(x='x',\
    \ y='y', data=df)\n```\n![Single Training](image955.jpg)\n\n### Step 3\nImplement\
    \ linear regression with `PyTorch` libraries as mentioned below −\n```python\n\
    import torch\nimport torch.nn as nn\nfrom torch.autograd import Variable\nx_train\
    \ = x.reshape(-1, 1).astype('float32')\ny_train = y.reshape(-1, 1).astype('float32')\n\
    \nclass LinearRegressionModel(nn.Module):\n    def __init__(self, input_dim, output_dim):\n\
    \        super(LinearRegressionModel, self).__init__()\n        self.linear =\
    \ nn.Linear(input_dim, output_dim)\n    def forward(self, x):\n        out = self.linear(x)\n\
    \        return out\n\ninput_dim = x_train.shape[1]\noutput_dim = y_train.shape[1]\n\
    input_dim, output_dim(1, 1)\nmodel = LinearRegressionModel(input_dim, output_dim)\n\
    criterion = nn.MSELoss()\n[w, b] = model.parameters()\n\ndef get_param_values():\n\
    \    return w.data[0][0], b.data[0]\n\ndef plot_current_fit(title=\"\"):\n   \
    \ plt.figure(figsize=(12, 4))\n    plt.title(title)\n    plt.scatter(x, y, s=8)\n\
    \    w1 = w.data[0][0]\n    b1 = b.data[0]\n    x1 = np.array([0., 1.])\n    y1\
    \ = x1 * w1 + b1\n    plt.plot(x1, y1, 'r', label='Current Fit ({:.3f}, {:.3f})'.format(w1,\
    \ b1))\n    plt.xlabel('x (input)')\n    plt.ylabel('y (target)')\n    plt.legend()\n\
    \    plt.show()\n```\n`plot_current_fit('Before training')`\nThe plot generated\
    \ is as follows ![Plot Generated](image1036.jpg)\n\n# PyTorch - Convolutional\
    \ Neural Network Deep learning is a division of machine learning and is considered\
    \ as a crucial step taken by researchers in recent decades. The examples of deep\
    \ learning implementation include applications like image recognition and speech\
    \ recognition. The two important types of deep neural networks are given below\
    \ −\n* Convolutional Neural Networks\n* Recurrent Neural Networks\n\nIn this chapter,\
    \ we will be focusing on the first type, i.e., Convolutional Neural Networks.\n"
  trans: "\n\n# PyTorch - 术语\n\n在本章中，我们将讨论 PyTorch 中一些常用的术语。\n\n## PyTorch NumPy\n\
    `PyTorch` 的张量（tensor）与 `NumPy` 数组是相同的。`tensor` 是一个 n 维数组，对于 `PyTorch` 而言，它提供了许多对这些张量进行操作的功能。`PyTorch`\
    \ 张量通常利用 GPU 来加速数值计算。这些在 `PyTorch` 中创建的张量可以用于对随机数据拟合双层网络。用户可以手动实现通过网络的前向传播和反向传播。\n\
    \n### 变量与 Autograd\n使用 `autograd` 时，网络的正向传播将定义一个计算图——图中的节点将是 `Tensors`，边将是根据输入\
    \ `Tensors` 产生输出 `Tensors` 的函数。`PyTorch` Tensors 可以被作为变量对象创建，其中变量代表计算图中的一个节点。\n\
    \n### 动态图\n静态图的优点是用户可以预先对图进行优化。如果程序员反复反复使用同一个图，那么这种潜在的高昂的预先优化就可以被维持，因为同一个图会被反复运行。它们之间的主要区别是\
    \ `Tensor Flow` 的计算图是静态的，而 `PyTorch` 使用动态计算图。\n\n### optim 包\nPyTorch 中的 `optim`\
    \ 包抽象了优化算法的概念，该算法通过许多方式实现实现，并提供了常用优化算法的示例说明。这可以在导入语句中调用。\n\n### 多进程\n多进程（Multiprocessing）支持相同的操作，使得所有张量都在多个处理器上运行。队列将将其数据移动到共享内存中并仅向另一个进程发送句柄。\n\
    \n# PyTorch - 加载数据\n`PyTorch` 包含一个名为 `torchvision` 的包，用于加载和准备数据集。它包含了两个基本函数，即\
    \ `Dataset` 和 `DataLoader`，有助于数据集的转换和加载。\n\n### Dataset\n`Dataset` 用于从给定的数据集中读取并转换数据点。实现的基本语法如下所示\
    \ −\n```\ntrainset = torchvision.datasets.CIFAR10(root='./data', train=True, download=True,\
    \ transform=transform)\n```\n\n### DataLoader\n`DataLoader` 用于数据的洗乱和分批处理。它可以配合多进程工作器并行加载数据。\n\
    ```\ntrainloader = torch.utils.data.DataLoader(trainset, batch_size=4, shuffle=True,\
    \ num_workers=2)\n```\n\n### 示例：加载 CSV 文件\n我们使用 Python 包 `Panda` 来加载 csv 文件。原始文件格式如下：(图像名称,\
    \ 68 个关键点 - 每个关键点都有 x, y 坐标)。\n```python\nlandmarks_frame = pd.read_csv('faces/face_landmarks.csv')\n\
    n = 65\nimg_name = landmarks_frame.iloc[n, 0]\nlandmarks = landmarks_frame.iloc[n,\
    \ 1:].as_matrix()\nlandmarks = landmarks.astype('float').reshape(-1, 2)\n```\n\
    \n# PyTorch - 线性回归 \n在本章中，我们将重点关注使用 `TensorFlow` 实现线性回归的基本示例。逻辑回归或线性回归是一种用于离散类别分类的监督学习方法。本章的目标是构建一个模型，用户可以通过该模型预测变量与一个或多个独立变量之间的关系。这两个变量之间的关系被认为是线性的，即如果\
    \ `y` 是因变量而 `x` 被视为自变量，那么这两个变量的线性回归关系将看起来像下面提到的方程 −\n`Y = Ax+b`\n\n接下来，我们将为线性回归设计一种算法，使我们能够理解下面的两个重要概念\
    \ −\n* 损失函数 (Cost Function)\n* 梯度下降算法 (Gradient Descent Algorithms)\n\n线性回归的示意图如下，解释结果\
    \ `Y=ax+b`\n\n* `a` 的值是斜率。\n* `b` 的值是截距。\n* `r` 是相关系数。\n* `r 2` 是相关系数。\n\n线性回归的图形视图如下，解释结果\
    \ `Y=ax+b`\n\n![Interpreting result](img/image903.jpg)\n\n使用 `PyTorch` 实现线性回归的步骤如下：\n\
    \n### 第 1 步\n导入用于在 PyTorch 中创建线性回归的必要包 −\n```python\nimport numpy as np\nimport\
    \ matplotlib.pyplot as plt\nimport seaborn as sns\nimport pandas as pd\n% matplotlib\
    \ inline\nsns.set_style('whitegrid')\n```\n\n### 2 步\n创建一个带有可用数据的单个训练集 −\n```python\n\
    m = 2 # 斜率\nc = 3 # 截距\nx = np.random.rand(256)\nnoise = np.random.randn(256)\
    \ / 4\ny = x * m + c\ndf = pd.DataFrame()\ndf['x'] = x\ndf['y'] = y\n```\n![Single\
    \ Training](img/image955.jpg)\n\n### 第 3 步\n使用 `PyTorch` 实现线性回归 −\n```python\n\
    import torch\nimport torch.nn as nn\nfrom torch.autograd import Variable\n\nx_train\
    \ = x.reshape(-1, 1).astype('float32')\ny_train = y.reshape(-1, 1).astype('float32')\n\
    \nclass LinearRegressionModel(nn.Module):\n    def __init__(self, input_dim, output_dim):\n\
    \        super(LinearRegressionModel, self).__init__()\n        self.linear =\
    \ nn.Linear(input_dim, output_dim)\n    def forward(self, x):\n        out = self.linear(x)\n\
    \        return out\n\ninput_dim = x_train.shape[1]\noutput_dim = y_train.shape[1]\n\
    model = LinearRegressionModel(input_dim, output_dim)\ncriterion = nn.MSELoss()\n\
    [w, b] = model.parameters()\n\ndef get_param_values():\n    return w.data[0][0],\
    \ b.data[0]\n\ndef plot_current_fit(title=\"\"):\n    plt.figure(figsize=(12,\
    \ 4))\n    plt.title(title)\n    plt.scatter(x, y, s=8)\n    w1 = w.data[0][0]\n\
    \    b1 = b.data[0]\n    x1 = np.array([0., 1.])\n    y1 = x1 * w1 + b1\n    plt.plot(x1,\
    \ y1, 'r', label='Current Fit ({:.3f}, {:.3f})'.format(w1, b1))\n    plt.xlabel('x\
    \ (input)')\n    plt.ylabel('y (target)')\n    plt.legend()\n    plt.show()\n\
    ```\n`plot_current_fit('Before training')`\n生成的图表如下 ![Plot Generated](img/image1036.jpg)\n\
    \n"
