    \ neural network is created in such a way that it includes applying same set of\
    \ weights with different graph like structures.\n-   The nodes are traversed in\
    \ topological order.\n-   This type of network is trained by the reverse mode\
    \ of automatic differentiation.\n-   Natural language processing includes a special\
    \ case of recursive neural networks.\n-   This recursive neural tensor network\
    \ includes various composition functional nodes in the tree.\n\nThe example of\
    \ recursive neural network is demonstrated below −\n\n![Recursive Neural Tensor\
    \ Network](image1830.jpg)\n\nThank You!\n"
  trans: "\n\n# PyTorch - 使用卷积进行序列处理\n\n在本章中，我们提出了一种替代方法，该方法在两个序列上依赖于单个 2D 卷积神经网络。我们网络的每一层都会根据目前为止生成的输出序列对源标记进行重新编码。因此，类似于注意力的属性贯穿整个网络。在这里，我们将关注如何利用数据集中包含的值通过特定的池化创建序列网络。此过程最适用于“图像识别模块”。\n\
