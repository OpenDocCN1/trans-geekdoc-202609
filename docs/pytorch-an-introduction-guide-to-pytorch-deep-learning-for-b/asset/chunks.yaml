- raw: "Mathematical Building Blocks of Neural Networks Mathematics is vital in any\
    \ machine learning algorithm and includes various core concepts of mathematics\
    \ to get the right algorithm designed in a specific way. The importance of mathematics\
    \ topics for machine learning and data science is mentioned below − ![machine\
    \ learning](image451.jpg)Now, let us focus on the major mathematical concepts\
    \ of machine learning which is important from Natural Language Processing point\
    \ of view − Vectors Vector is considered to be array of numbers which is either\
    \ continuous or discrete and the space which consists of vectors is called as\
    \ vector space. The space dimensions of vectors can be either finite or infinite\
    \ but it has been observed that machine learning and data science problems deal\
    \ with fixed length vectors. The vector representation is displayed as mentioned\
    \ below − temp \\= torch. FloatTensor (\\[ 23 , 24 , 24.5 , 26 , 27.2 , 23.0 \\\
    ]) temp. size() Output \\- torch. Size (\\[ 6 \\]) In machine learning, we deal\
    \ with multidimensional data. So vectors become very crucial and are considered\
    \ as input features for any prediction problem statement. Scalars Scalars are\
    \ termed to have zero dimensions containing only one value. When it comes to PyTorch,\
    \ it does not include a special tensor with zero dimensions; hence the declaration\
    \ will be made as follows − x \\= torch. rand( 10 ) x. size() Output \\- torch.\
    \ Size (\\[ 10 \\]) Matrices Most of the structured data is usually represented\
    \ in the form of tables or a specific matrix. We will use a dataset called Boston\
    \ House Prices, which is readily available in the Python scikit-learn machine\
    \ learning library. boston\\_tensor \\= torch. from\\_numpy( boston. data) boston\\\
    _tensor. size() Output : torch. Size (\\[ 506 , 13 \\]) boston\\_tensor\\[: 2\
    \ \\] Output : Columns 0 to 7 0.0063 18.0000 2.3100 0.0000 0.5380 6.5750 65.2000\
    \ 4.0900 0.0273 0.0000 7.0700 0.0000 0.4690 6.4210 78.9000 4.9671 Columns 8 to\
    \ 12 1.0000 296.0000 15.3000 396.9000 4.9800 2.0000 242.0000 17.8000 396.9000\
    \ 9.1400 \n\nPyTorch - Neural Network Basics The main principle of neural network\
    \ includes a collection of basic elements, i.e., artificial neuron or perceptron.\
    \ It includes several basic inputs such as x1, x2….. xn which produces a binary\
    \ output if the sum is greater than the activation potential. The schematic representation\
    \ of sample neuron is mentioned below − ![sample neuron](image514.jpg)The output\
    \ generated can be considered as the weighted sum with activation potential or\
    \ bias. Output=∑jwjxj+BiasOutput=∑jwjxj+Bias The typical neural network architecture\
    \ is described below − ![neural network architecture](image523.jpg)The layers\
    \ between input and output are referred to as hidden layers, and the density and\
    \ type of connections between layers is the configuration. For example, a fully\
    \ connected configuration has all the neurons of layer L connected to those of\
    \ L+1. For a more pronounced localization, we can connect only a local neighbourhood,\
    \ say nine neurons, to the next layer. Figure 1-9 illustrates two hidden layers\
    \ with dense connections. The various types of neural networks are as follows\
    \ − Feedforward Neural Networks Feedforward neural networks include basic units\
    \ of neural network family. The movement of data in this type of neural network\
    \ is from the input layer to output layer, via present hidden layers. The output\
    \ of one layer serves as the input layer with restrictions on any kind of loops\
    \ in the network architecture. ![Feedforward Neural Networks](image530.jpg)Recurrent\
    \ Neural Networks Recurrent Neural Networks are when the data pattern changes\
    \ consequently over a period. In RNN, same layer is applied to accept the input\
    \ parameters and display output parameters in specified neural network. ![Recurrent\
    \ Neural Networks](image536.jpg)Neural networks can be constructed using the torch.nn\
    \ package. ![Construct Neural Networks](image541.jpg)It is a simple feed-forward\
    \ network. It takes the input, feeds it through several layers one after the other,\
    \ and then finally gives the output. With the help of PyTorch, we can use the\
    \ following steps for typical training procedure for a neural network − \n\n*\
    \   Define the neural network that has some learnable parameters (or weights).\
    \ \n\n*   Iterate over a dataset of inputs. \n\n*   Process input through the\
    \ network. \n\n*   Compute the loss (how far is the output from being correct).\
    \ \n\n*   Propagate gradients back into the network’s parameters. \n\n*   Update\
    \ the weights of the network, typically using a simple update as given below \n\
    \nrule: weight = weight -learning\\_rate \\* gradient Universal Workflow of Machine\
    \ Learning Artificial Intelligence is trending nowadays to a greater extent. Machine\
    \ learning and deep learning constitutes artificial intelligence. The Venn diagram\
    \ mentioned below explains the relationship of machine learning and deep learning.\
    \ ![relationship machine learning](image567.jpg)Machine Learning Machine learning\
    \ is the art of science which allows computers to act as per the designed and\
    \ programmed algorithms. Many researchers think machine learning is the best way\
    \ to make progress towards human-level AI. It includes various types of patterns\
    \ like − \n\n*   Supervised Learning Pattern \n\n*   Unsupervised Learning Pattern\
    \ \n\nDeep Learning Deep learning is a subfield of machine learning where concerned\
    \ algorithms are inspired by the structure and function of the brain called Artificial\
    \ Neural Networks. Deep learning has gained much importance through supervised\
    \ learning or learning from labelled data and algorithms. Each algorithm in deep\
    \ learning goes through same process. It includes hierarchy of nonlinear transformation\
    \ of input and uses to create a statistical model as output. Machine learning\
    \ process is defined using following steps − \n\n*   Identifies relevant data\
    \ sets and prepares them for analysis. \n\n*   Chooses the type of algorithm to\
    \ use. \n\n*   Builds an analytical model based on the algorithm used. \n\n* \
    \  Trains the model on test data sets, revising it as needed. \n\n*   Runs the\
    \ model to generate test scores. \n\nPyTorch - Machine Learning vs. Deep Learning\
    \ In this chapter, we will discuss the major difference between Machine and Deep\
    \ learning concepts. Amount of Data Machine learning works with different amounts\
    \ of data and is mainly used for small amounts of data. Deep learning on the other\
    \ hand works efficiently if the amount of data increases rapidly. The following\
    \ diagram depicts the working of machine learning and deep learning with respect\
    \ to amount of data − ![Amount Data](image602.jpg)Hardware Dependencies Deep learning\
    \ algorithms are designed to heavily depend on high end machines on a contrary\
    \ to traditional machine learning algorithms. Deep learning algorithms perform\
    \ a large amount of matrix multiplication operations which requires a huge hardware\
    \ support. Feature Engineering Feature engineering is the process of putting domain\
    \ knowledge into specified features to reduce the complexity of data and make\
    \ patterns which are visible to learning algorithms. For instance, traditional\
    \ machine learning patterns focusses on pixels and other attributes needed for\
    \ feature engineering process. Deep learning algorithms focusses on high level\
    \ features from data. It reduces the task of developing new feature extractor\
    \ for every new problem. "
  fmt: '

    # Mathematical Building Blocks of Neural Networks


    Mathematics is vital in any machine learning algorithm and includes various core
    concepts of mathematics to get the right algorithm designed in a specific way.
    The importance of mathematics topics for machine learning and data science is
    mentioned below −


    ![machine learning](image451.jpg)


    Now, let us focus on the major mathematical concepts of machine learning which
    is important from Natural Language Processing point of view −


    ### Vectors

    Vector is considered to be array of numbers which is either continuous or discrete
    and the space which consists of vectors is called as vector space. The space dimensions
    of vectors can be either finite or infinite but it has been observed that machine
    learning and data science problems deal with fixed length vectors. The vector
    representation is displayed as mentioned below −


    ```python

    temp = torch.FloatTensor([23, 24, 24.5, 26, 27.2, 23.0])

    temp.size()

    ```

    Output - `torch.Size([6])`


    In machine learning, we deal with multidimensional data. So vectors become very
    crucial and are considered as input features for any prediction problem statement.


    ### Scalars

    Scalars are termed to have zero dimensions containing only one value. When it
    comes to PyTorch, it does not include a special tensor with zero dimensions; hence
    the declaration will be made as follows −


    ```python

    x = torch.rand(10)

