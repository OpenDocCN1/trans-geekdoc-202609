    \ supported, then you have to choose `Preview` (Nightly)`. For installation, it's\
    \ necessary that you have met the prerequisites which are suited to your package\
    \ manager. We recommend you to use `Anaconda` package manager because it installs\
    \ all the dependencies.\n\n### Platforms, Os, Language and other prerequisites\n\
    \n| PyTorch Build | Suitable (1.1) | Preview |\n| :--- | :--- | :--- |\n| Os |\
    \ Linux | Mac | Windows |\n| package | Conda | pip | LibTorch | Source |\n| language\
    \ | Python 2.7 | Python 3.5 | Python 3.6 | Python 3.7 | C++ |\n| Cuda | 9.0 |\
    \ 10.0 | None |\n\n`LibTorch` is available only for `C++`. Now, we first install\
    \ PyTorch in windows with the `pip` package, and after that we use `Conda`.\n\n\
    #### Installation on Windows using Pip\n\nTo install PyTorch, you have to install\
    \ `python` first, and then you have to follow the following steps.\n\n*   **Step\
    \ 1**: At very first you have to enter on the `python37` folder and then in its\
    \ `Scripts` folder using `cd Scripts` command.\n*   **Step 2**: In the second\
    \ step, you have to install `pip` as per your required version with the help of\
    \ `easy_install.exe pip` command on your command prompt. Once processing of dependencies\
    \ is finished, you will back to the `Scripts` folder automatically.\n    ![PyTorch\
    \ Installation](image301.jpg)\n*   **Step 3**: Now, your next steps is to install\
    \ `numpy` package of python for `pip`. Numpy installation will be done with the\
    \ help of the `pip install numpy` command . If your python has already this package,\
    \ then it will show you \"Requirement already satisfied\" otherwise, it will install\
    \ the package. `pip list` command is used to check packages.\n    ![PInstallation\
    \ on Windows using Pip](image310.jpg)\n    When downloading is finished, it shows\
    \ a successful message and takes back your cursor in the scripts folder.\n*  \
    \ **Step 4**: Next step is to install pip another package `scipy` with the help\
    \ of `pip install scipy` command.\n    ![Installation on Windows using Pip](image319.jpg)\n\
    \    Once downloading is finished your cursor comes back in the scripts folder.\n\
    \    ![Installation on Windows using Pip](image325.jpg)\n*   **Step 5**: Now,\
    \ check all the installed packages that are required for PyTorch using the `pip\
