    \    ![Installation on Windows using Conda](image388.jpg)\n*   **Step 2**: Now,\
    \ run your Anaconda setup and install it completely. Once your installation of\
    \ Anaconda is complete, an Anaconda command prompt appears to you.\n    ![Installation\
    \ on Windows using Conda](image395.jpg)\n*   **Step 3**: Next step is to install\
    \ PyTorch using Anaconda command prompt. To install PyTorch, you have to run the\
