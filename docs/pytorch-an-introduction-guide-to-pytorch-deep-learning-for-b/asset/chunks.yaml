  fmt: "\n# PyTorch vs TensorFlow\n\n| PyTorch includes everything in imperative and\
    \ dynamic manner. | TensorFlow includes static and dynamic graphs as a combination.\
    \ |\n| Computation graph in PyTorch is defined during runtime. | TensorFlow do\
    \ not include any run time option. |\n| PyTorch includes deployment featured for\
    \ mobile and embedded frameworks. | TensorFlow works better for embedded frameworks.\
    \ |\n\n## PyTorch - Installation\n\nFor installation, first, you have to choose\
