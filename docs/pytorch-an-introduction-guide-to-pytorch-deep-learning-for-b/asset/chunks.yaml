    # PyTorch - Neural Network Basics


    The main principle of neural network includes a collection of basic elements,
    i.e., artificial neuron or perceptron. It includes several basic inputs such as
    `x1`, `x2`….. `xn` which produces a binary output if the sum is greater than the
    activation potential. The schematic representation of sample neuron is mentioned
    below −


    ![sample neuron](image514.jpg)


    The output generated can be considered as the weighted sum with activation potential
    or bias. `Output=∑jwjxj+Bias`


    The typical neural network architecture is described below −


    ![neural network architecture](image523.jpg)


    The layers between input and output are referred to as hidden layers. For example,
    a fully connected has hidden layers with dense connections. The various types
    of neural networks are as follows:


    ### Feedforward Neural Networks

    Feedforward neural networks include basic units. The movement of data is from
    input to output via several hidden layers.


    ![Feedforward Neural Networks](image530.jpg)


    ### Recurrent Neural Networks

    Recurrent Neural Networks are when the data changes over a period. In `RNN`, same
    layer is applied to accept input and output parameters.


    ![Recurrent Neural Networks](image536.jpg)


    ### Neural Networks

    Neural networks can be constructed using `torch.nn`.


    ![Construct Neural Networks](image541.jpg)

    It takes input through the other and finally gives output. With the help of PyTorch,
    we can use the following steps:


    * Define the neural network that has some learnable parameters.

    * Iterate over a dataset.

    * Process input through the network.

    * Compute the loss (how far is the output from correct).

    * Propagate gradients back into the network.

    * Update the weights of the network, typically using a simple update as given:


    ```python

    weight = weight - learning_rate * gradient

    ```


    # Universal Workflow of Machine Learning


    Artificial Intelligence is trending nowadays to a greater extent. Machine learning
    and deep learning constitutes artificial intelligence. The Venn diagram below
    explains the relationship of machine learning and deep learning.


    ![relationship machine learning](image567.jpg)


    ### Machine Learning

    Machine learning is the art of science which allows computers to act as per the
    designed and programmed algorithms. Many researchers think machine learning is
    the best way to make towards human-level AI. It includes various types like:


    * Supervised Learning

    * Unsupervised Learning Pattern


    ### Deep Learning

    Deep learning is a subfield of machine learning where concerned algorithms are
    inspired by the structure and function of the brain called Artificial Neural Networks.
    Deep learning has gained much importance through supervised learning or learning
    from labelled data. Each algorithm in deep learning goes through same process.
    It includes hierarchy of nonlinear transformation of input and uses to create
    a statistical model as output. Machine learning process is defined using following
    steps:


    * Identify relevant data sets and prepares them for analysis.

    * Choose the type of algorithm to use.

    * Build an analytical model based on the algorithm used.

    * Train the model on test data sets, revising it as needed.

    * Run the model to generate test scores.


    # PyTorch - Machine Learning vs. Deep Learning


    In this chapter, we will discuss the major difference between Machine and Deep
    learning concepts.


    ### Amount of Data

    Machine learning works with different amounts of data and is mainly used for small
    amounts of data. Deep learning on the other hand works efficiently if the amount
    of data increases rapidly.


    ![Amount Data](image602.jpg)


    ### Hardware Dependencies

    Deep learning algorithms are designed to heavily depend on high end machines on
    a contrary to traditional machine learning algorithms. Deep learning algorithms
    perform a large amount of matrix multiplication operations which requires a huge
    hardware support.


    ### Feature Engineering

    Feature engineering is the process of putting domain knowledge into specified
    features to reduce the complexity of data and make patterns which are visible
    to learning algorithms. For instance, traditional machine learning patterns focus
    on pixels and other attributes needed for feature engineering process. Deep learning
    algorithms focus on high level features from data. It reduces the task of developing
    new feature extractor for every new problem.

