    # PyTorch - 简介


    `PyTorch` 被定义为用于 `Python` 的开源机器学习库。它用于自然语言处理等应用。它最初由 `Facebook` 人工智能研究小组开发，并在此构建了用于概率编程的
    `Uberss Pyro` 软件。最初，`PyTorch` 由 `Hugh Perkins` 开发，作为基于 `Torch` 框架的 `LuaJIT` 的
    `Python` 封装。


    有两个 `PyTorch` 变体。`PyTorch` 在 `Python` 中重新设计并实现了 `Torch`，同时为后端代码共享相同的内核 `C` 库。`PyTorch`
    开发人员调整了这些后端代码以高效运行 `Python`。他们还保留了基于 `GPU` 的硬件加速以及使得基于 `Lua` 的 `Torch` 的扩展性特性。


    ## 特性


    `PyTorch` 的主要特性如下：


    ### 易用的接口

    `PyTorch` 提供了易于使用的 API；因此它被认为非常容易操作并运行在 `Python` 上。


    ### Python 使用

    该库被认为是 `pythonic` 的，与 `Python` 数据栈无缝集成。因此，它可以利用 `Python` 环境提供的所有服务和功能。


    ### 计算图

    `PyTorch` 提供了一个提供动态计算图的优秀平台。因此用户可以在运行时更改它们。当开发者不知道创建神经网络模型需要多少内存时，这非常有用。


    `PyTorch` 以具有以下三个级别的抽象著称：


    - `Tensor` — 运行在 `GPU` 上的命令式多维数组。

    - `Variable` — 计算图中的节点。它存储数据和梯度。

    - `Module` — 神经网络层，将存储状态或可学习权重。


