    # PyTorch - 词嵌入 (Word Embedding)\n\n在本章中我们将我们将著名的词嵌入模型 —— word2vec。Word2vec 模型用于通过一组相关模型的帮助生成词嵌入。Word2vec\
    \ 模型用纯 C 代码实现，梯度是手动计算的。PyTorch 中 word2vec 模型的实现通过以下步骤解释 −\n\n### 步骤 1：按照下述实现词嵌入中的库\
    \ −\n\n```python\nimport torch\nfrom torch.autograd import Variable\nimport torch.nn\
    \ as nn\nimport torch.nn.functional as F\n```\n\n### 步骤 2：使用名为 word2vec 的类实现词嵌入的\
    \ Skip Gram 模型。它包含了 `emb_size`、`emb_dimension`、`u_embedding`、`v_embedding` 等类型的属性。\n\
    \n```python\nclass SkipGramModel (nn.Module):\n    def __init__(self, emb_size,\
    \ emb_dimension):\n        super(SkipGramModel, self).__init__()\n        self.emb_size\
    \ = emb_size\n        self.emb_dimension = emb_dimension\n        self.u_embeddings\
    \ = nn.Embedding(emb_size, emb_dimension, sparse=True)\n        self.v_embeddings\
    \ = nn.Embedding(emb_size, emb_dimension, sparse=True)\n        self.init_emb()\n\
    \n    def init_emb(self):\n        initrange = 0.5 / self.emb_dimension\n    \
    \    self.u_embeddings.weight.data.uniform_(-initrange, initrange)\n        self.v_embeddings.weight.data.uniform_(-0,\
    \ 0)\n\n    def forward(self, pos_u, pos_v, neg_v):\n        emb_u = self.u_embeddings(pos_u)\n\
    \        emb_v = self.v_embeddings(pos_v)\n        score = torch.mul(emb_u, emb_v).squeeze()\n\
    \        score = torch.sum(score, dim=1)\n        score = F.logsigmoid(score)\n\
    \        neg_emb_v = self.v_embeddings(neg_v)\n        neg_score = torch.bmm(neg_emb_v,\
    \ emb_u.unsqueeze(2)).squeeze()\n        neg_score = F.logsigmoid(-1 * neg_score)\n\
    \        return -1 * (torch.sum(score) + torch.sum(neg_score))\n\n    def save_embedding(self,\
    \ id2word, file_name, use_cuda):\n        if use_cuda:\n            embedding\
    \ = self.u_embeddings.weight.cpu().data.numpy()\n        else:\n            embedding\
    \ = self.u_embeddings.weight.data.numpy()\n        fout = open(file_name, 'w')\n\
    \        fout.write('%d %d\\n' % (len(id2word), self.emb_dimension))\n       \
    \ for wid, w in id2word.items():\n            e = embedding[wid]\n           \
    \ e = ' '.join(map(lambda x: str(x), e))\n            fout.write('%s %s\\n' %\
    \ (w, e))\n\n    def test():\n        model = SkipGramModel(100, 100)\n      \
    \  id2word = dict()\n        for i in range(100):\n            id2word[i] = str(i)\n\
    \        model.save_embedding(id2word)\n```\n\n### 步骤 3：实现主方法以正确的方式显示词嵌入。\n\n\
    ```python\nif __name__ == '__main__':\n    test()\n```\n\n# PyTorch - 递归神经网络 (Recursive\
    \ Neural Networks)\n\n深度神经网络在机器学习理解自然语言过程方面具有独特的突破性。观察到，大多数此类模型将语言视为单词或字符的平坦序列，并使用一种被称为循环神经网络或\
    \ RNN 模型。许多研究人员得出结论，语言最好通过短语的层次树来理解。这种类型包含了考虑特定结构的递归神经网络。PyTorch 具有一种特定特性，可以让这些复杂的自然语言处理模型变得简单得多。\n\
    \n## 递归神经网络的特征\n\n-   递归神经网络的创建方式允许在不同的图结构上应用相同的权重集。\n-   节点按照拓扑顺序进行遍历。\n-   这类网络通过自动微分的反向模式进行训练。\n\
    -   自然语言处理包含了递归神经网络的一个特例。\n-   这种递归张量网络在树中包含了各种组合功能节点。\n\n递归神经网络的示例下所示 −\n\n![Recursive\
    \ Neural Tensor Network](img/image1830.jpg)\n\n感谢！\n\n"
