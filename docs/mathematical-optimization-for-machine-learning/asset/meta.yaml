  - 定理 7.4. 假设给定一个形式为 (CALOP) 的优化问题，在每个可行点处满足 LIKQ，且令 `Q` = `Q^⊤` ∈ `ℝ^(n × n)` 为正定矩阵。那么，对于任何可行的起始点
    `x` ∈ `ℝ^(n)`，算法 7.1 在经过有限次迭代后，收敛于二次惩罚版本的优化问题 (CALOP) 的一个极小值点。
- - '##'
