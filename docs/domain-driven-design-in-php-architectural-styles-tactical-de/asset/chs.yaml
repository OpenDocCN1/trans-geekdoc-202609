  \ A：基于 PHP 的六形架构\n\n发表于 php 杂志。2014 年 6 月。Carlos Buenosvinos (@buvinos)。\n\n## 引言\n\
  \n随着领域驱动设计（`DDD`）的兴起，以领域为中心的设计正变得越来越流行。这就是六形架构（Hexagonal Architecture），也称为“端口与适配器”（Ports\
  \ and Adapters），它似乎被 PHP 开发者刚刚重新发现。六形架构由作者之一 Alistair Cockburn 于 2005 年发明，它允许应用程序由用户、程序、自动化测试或运行时设备和数据库平等地驱动。这使得\
  \ Web 应用程序变得更容易测试、编写和维护。让我们看看如何使用真实的 PHP 示例来应用它。\n\n你的公司正在构建一个脑暴系统。用户添加并对想法进行评分，这样有趣的想法就可以在公司内部实施。周一早晨，又一个冲刺开始了，你正在与团队和产品负责人（Product\
  \ Owner）评审一些用户故事：“我想给一个想法评分，并且应该通过邮件通知作者”。作为一名优秀的开发者，你决定分而治之处理这个用户故事，你将从第一部分开始：“我想给一个想法评分”。之后，你将面临“应该通过邮件通知作者”。从业务规则的角度来说，对想法进行评分就像在存储库（所有想法存放的地方）中通过标识符找到该想法，添加评分，重新计算平均值并将想法保存回来。如果想法不存在或仓库可用，我们应该抛出异常，这样我们可以显示错误消息、重定向用户或执行业务所要求的任何操作。\n\
  \n```php\nclass IdeaController extends Zend_Controller_Action\n{\n    public function\
  \ rateAction()\n    {\n        // 从请求中获取参数\n        $ideaId = $this->request->getParam('id');\n\
  \        $rating = $this->request->getParam('rating');\n\n        // 构建数据库连接\n \
  \       $db = new Zend_Db_Adapter_Pdo_Mysql(array(\n            'host' => 'localhost',\n\
  \            'username' => 'idy',\n            'password' => '',\n            'dbname'\
  \ => 'idy'\n        ));\n\n        // 在数据库中查找想法\n        $sql = 'SELECT * FROM ideas\
  \ WHERE idea_id = ?';\n        $row = $db->fetchRow($sql, $ideaId);\n\n        if\
  \ (!$row) {\n            throw new Exception('Idea does not exist');\n        }\n\
  \n        // 从数据库构建想法对象\n        $idea = new Idea();\n        $idea->setId($row['id']);\n\
  \        $idea->setTitle($row['title']);\n        $idea->setDescription($row['description']);\n\
  \        $idea->setRating($row['rating']);\n        $idea->setVotes($row['votes']);\n\
  \        $idea->setAuthor($row['email']);\n\n        // 添加用户评分\n        $idea->addRating($rating);\n\
  \n        // 更新想法并保存到数据库\n        $data = array(\n            'votes' => $idea->getVotes(),\n\
  \            'rating' => $idea->getRating()\n        );\n        $where['idea_id\
  \ = ?'] = $ideaId;\n        $db->update('ideas', $data, $where);\n\n        // 重定向到查看想法页面\n\
  \        $this->redirect('/idea/'.$ideaId);\n    }\n}\n```\n\n我知道读者在想什么：“谁会在控制器中直接访问数据？这是\
  \ 90 年代的示例！”，好吧，好吧，你说得对。如果你已经在使用框架，你很可能也在使用 ORM。可能是自己实现的，也可能是使用任何现有的工具如 `Doctrine`、`Eloquent`、`ZendDB`\
  \ 等。如果是这样，你比那些只有数据库连接对象的人多走了一步，但别高兴得太早。\n\n对于初学者来说，列表 1 的代码可以直接运行。然而，如果你仔细观察控制器，你看到的不仅仅是业务规则，你还会看到\
  \ Web 框架如何将请求路由到业务规则、数据库的引用或如何连接它。在这里你看到了基础设施。\n\n基础设施是使业务规则运行的细节。显然，我们需要某些方式访问它们（API、Web、控制台应用等），并且我们需要一个物理位置来存储我们的想法（内存、数据库、NoSQL\
  \ 等）。然而，我们应该能够将这些组件与其他具有相同行为的实现交换。从数据库访问开始如何？\n\n## 仓库与持久化边界\n\n无论业务规则还是基础设施发生变化，我们都必须修改同一部分代码。相信我，在计算机科学中，你不希望人们为了不同的原因接触同一部分代码。尝试让你的函数只做一件事且只做一件事，这样就就不可能出现人们在同一部分代码上乱搞。你可以通过……了解更多\n\
  \n\n\n看看单一职责原则（SRP）。关于该原则的更多信息，请参考：[http:](http://www.objectmentor.com/resources/articles/srp.pdf)\n\
  \n列表 1 显然是这种情况这种情况。如果我们想迁移到 `Redis` 或添加作者通知功能，就必须更新 `rateAction` 方法。影响 `rateAction`\
  \ 中与更新逻辑不相关的其他方面的概率很高。列表 1 的代码是脆弱的。如果在你的团队中经常听到“如果它能运行，就不要动它”，那么说明缺少 SRP。\n\n因此，我们必须对代码解耦，并将处理获取和持久化点的责任封装到另一个对象中。正如之前解释过的，最好的方法是使用\
  \ `Repository`。接受挑战！让我们看看列表 2 中的结果。\n\n```php\nclass IdeaController extends Zend_Controller_Action\n\
  {\n    public function rateAction()\n    {\n        $ideaId = $this->request->getParam('id');\n\
  \        $rating = $this->request->getParam('rating');\n        $ideaRepository\
  \ = new IdeaRepository();\n        $idea = $ideaRepository->find($ideaId);\n   \
  \     if (!$idea) {\n            throw new Exception('Idea does not exist');\n \
  \       }\n        $idea->addRating($rating);\n        $ideaRepository->update($idea);\n\
  \        $this->redirect('/idea/'.$ideaId);\n    }\n}\n\nclass IdeaRepository\n\
  {\n    private $client;\n    public function __construct()\n    {\n        $this->client\
  \ = new Zend_Db_Adapter_Pdo_Mysql(array(\n            'host' => 'localhost',\n \
  \           'username' => 'idy',\n            'password' => '',\n            'dbname'\
  \ => 'idy'\n        ));\n    }\n\n    public function find($id)\n    {\n       \
  \ $sql = 'SELECT * FROM ideas WHERE idea_id = ?';\n        $row = $this->client->fetchRow($sql,\
  \ $id);\n        if (!$row) {\n            return null;\n        }\n        $idea\
  \ = new Idea();\n        $idea->setId($row['id']);\n        $idea->setTitle($row['title']);\n\
  \        $idea->setDescription($row['description']);\n        $idea->setRating($row['rating']);\n\
  \        $idea->setVotes($row['votes']);\n        $idea->setAuthor($row['email']);\n\
  \        return $idea;\n    }\n\n    public function update(Idea $idea)\n    {\n\
  \        $data = array(\n            'title' => $idea->getTitle(),\n           \
  \ 'description' => $idea->getDescription(),\n            'rating' => $idea->getRating(),\n\
  \            'votes' => $idea->getVotes(),\n            'email' => $idea->getAuthor(),\n\
  \        );\n        $where = array('idea_id = ?' => $idea->getId());\n        $this->client->update('ideas',\
  \ $data, $where);\n    }\n}\n```\n\n结果更漂亮了。`IdeaController` 的 `rateAction` 更易于理解。在阅读时，它谈论的是业务规则。在与业务人员交流时，他们能理解\
  \ `IdeaRepository` 是什么：“一个我存放和获取 Idea 的地方，它使用类集合的接口在领域层和数据映射层之间用于访问领域对象。”正如在 Martin\
  \ Fowler 的模式中所找到的那。\n\n如果你已经在使用如 `Doctrine` 这样的 ORM，你现在的仓库扩展了 `EntityRepository`。如果你需要获取其中一个仓库，你请求\
  \ `EntityManager` 来完成工作。生成的代码几乎完全相同，只是在控制器动作中增加了对 `EntityManager` 的访问以获取 `IdeaRepository`。\n\
  \n到此时，我们可以看到六边形的一个边缘，即 `persistence` 边缘。然而，这一面并没有画得很好，`IdeaRepository` 是什么与它如何实现之间存在某种关系。为了在我们的\
  \ `application boundary` 之间实现有效的分离，……\n\n\n\n\n配合该应用使用？\n\n你的 CTO 已经在路线图中设定了团队将迁移到\
  \ Symfony2，因此当在你当前的 ZF1 应用中开发新功能时，我们希望让即将到来的迁移更加容易。\n\n这很棘手，请看我的列表 5。\n\n```php\n\
  class IdeaController extends Zend_Controller_Action\n{\n    public function rateAction()\n\
  \    {\n        $ideaId = $this->request->getParam('id');\n        $rating = $this->request->getParam('rating');\n\
  \        $ideaRepository = new RedisIdeaRepository();\n        $useCase = new RateIdeaUseCase($ideaRepository);\n\
  \        $response = $useCase->execute($ideaId, $rating);\n        $this->redirect('/idea/'.$ideaId);\n\
  \    }\n}\n\ninterface IdeaRepository\n{\n    // ...\n}\n```\n\n附录 A：PHP 六边形架构\n\
  285\n\n```php\nclass RateIdeaUseCase\n{\n    private $ideaRepository;\n    public\
  \ function __construct(IdeaRepository $ideaRepository)\n    {\n        $this->ideaRepository\
  \ = $ideaRepository;\n    }\n\n    public function execute($ideaId, $rating)\n \
  \   {\n        try {\n            $idea = $this->ideaRepository->find($ideaId);\n\
  \        } catch (Exception $e) {\n            throw new RepositoryNotAvailableException();\n\
  \        }\n\n        if (!$idea) {\n            throw new IdeaDoesNotExistException();\n\
  \        }\n\n        try {\n            $idea->addRating($rating);\n          \
  \  $this->ideaRepository->update($idea);\n        } catch (Exception $e) {\n   \
  \         throw new RepositoryNotAvailableException();\n        }\n\n        return\
  \ $idea;\n    }\n}\n```\n\n让我们回顾一下这些。我们的控制器完全没有任何业务规则。我们将所有逻辑都推入了一个名为 `RateIdeaUseCase`\
  \ 的新对象中并对其进行了封装。这个对象也被称为控制器（Controller）、交互器（Interactor）或应用服务（Application Service）。\n\
  \n魔法是由 `execute` 方法完成的。所有的依赖（如 `RedisIdeaRepository`）都是作为参数传递给构造函数的。我们在 UseCase\
  \ 内部对 `IdeaRepository` 的所有引用都指向接口，而不是任何具体的实现。\n\n这真的很酷。如果你查看 `RateIdeaUseCase` 内部，没有任何内容关于\
  \ `MySQL` 或 `Zend Framework`。没有引用、没有实例、没有注解，什么都没有。这就像你的\n\n附录 A：PHP 六边形架构\n286\n\
  \n基础设施并不在乎。它只谈论业务逻辑。\n\n此外，我们还调整了抛出的异常（Exceptions）。业务过程也有异常。`NotAvailableRepository`\
  \ 和 `IdeaDoesNotExist` 就是其中两个。根据抛出的异常，我们可以在框架边界以不同的方式做出反应。\n\n有时，`UseCase` 接收的参数数量可能太多。为了组织它们，通常的做法是使用数据传输对象（DTO）构建一个\
  \ `UseCase request` 来将它们一起传递。让我们看看如何在列表 6 中解决这个问题。\n\n```php\nclass IdeaController\
  \ extends Zend_Controller_Action\n{\n    public function rateAction()\n    {\n \
  \       $ideaId = $this->request->getParam('id');\n        $rating = $this->request->getParam('rating');\n\
  \        $ideaRepository = new RedisIdeaRepository();\n        $useCase = new RateIdeaUseCase($ideaRepository);\n\
  \        $response = $useCase->execute(\n            new RateIdeaRequest($ideaId,\
  \ $rating)\n        );\n        $this->redirect('/idea/'.$response->idea->getId());\n\
  \    }\n}\n\nclass RateIdeaRequest\n{\n    public $ideaId;\n    public $rating;\n\
  \    public function __construct($ideaId, $rating)\n    {\n        $this->ideaId\
  \ = $ideaId;\n        $this->rating = $rating;\n    }\n}\n\nclass RateIdeaResponse\n\
  {\n    public $idea;\n    public function __construct(Idea $idea)\n    {\n     \
  \   $this->idea = $idea;\n    }\n}\n\nclass RateIdeaUseCase\n{\n    // ...\n   \
  \ public function execute($request)\n    {\n        $ideaId = $request->ideaId;\n\
  \        $rating = $request->rating;\n        // ...\n        return new RateIdeaResponse($idea);\n\
  \    }\n}\n```\n\n这里的这种变化是引入了两个新对象：请求（Request）和响应（Response）。它们不是强制性的，可能 `UseCase`\
  \ 没有请求或响应。另一个重要的细节是你是如何构建这个请求。在这种情况下，我们是通过从 ZF request 对象中获取参数来构建它的。\n\n好的，等一下，真正的处是什么？更容易从一个框架切换到另一个框架，或者从另一种\
  \ `delivery mechanism`（交付机制）中执行我们的 `UseCase`。让我们来看这一点。\n\n### 使用 API 对想法进行评分\n\n\
  一天中，你的产品负责人（Product Owner）来到你身边：“顺便说一下，用户应该能够使用我们的移动 App 对想法进行评分。我认为我们需要更新 API，你能在这次冲刺（sprint）中完成它吗？”PO\
  \ 再次说道：“没问题！”业务部门对你的承诺留下了深刻。\n\n正如 Robert C. Martin 所说：“Web 是一种交付机制……。你的系统架构应该尽可能地忽略它是如何被交付的。你应该能够以控制台应用、Web\
  \ 应用、甚至是 Web 服务应用的形式交付它，而不会产生不必要的复杂性或对基础架构进行任何更改”。\n\n你目前的 API 是使用 Silex 构建的，这是一个基于\
  \ Symfony 的 PHP 微框架。让我们在 7 中实现它。\n\n附录 A：PHP 六边形架构\n288\n\n```php\n// ...\n$app\
