  \    {\n        $this->setExpectedException('NotAvailableRepository');\n       \
  \ $ideaRepository = new WriteAvailableRepository();\n        $useCase = new RateIdeaUseCase($ideaRepository);\n\
  \        $useCase->execute(\n            new RateIdeaRequest(1, 5)\n        );\n\
